<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профиль ребёнка</title>
<meta name="description" content="Диагностика по графу навыков и план «что учить дальше», привязанный к предметам венгерской школы.">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1e25; --muted: #687083; --border: #dfe3ea; --chip: #eef1f5;
    --accent: #2f6fe4; --yes: #1f9d63; --no: #d9483b; --unsure: #d39b14; --implied: #8fc9ab; --gap: #f3d2ce;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0d12; --panel: #151821; --text: #e8eaf0; --muted: #9aa1b2; --border: #2a2f3c; --chip: #1f2433;
      --accent: #6ea2ff; --yes: #3fcf8e; --no: #f2685c; --unsure: #f5c84c; --implied: #2f6e52; --gap: #4a2622;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0d12; --panel: #151821; --text: #e8eaf0; --muted: #9aa1b2; --border: #2a2f3c; --chip: #1f2433;
    --accent: #6ea2ff; --yes: #3fcf8e; --no: #f2685c; --unsure: #f5c84c; --implied: #2f6e52; --gap: #4a2622;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 12px 16px 80px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
  header h1 { font-size: 20px; margin: 4px 0; }
  header a { color: var(--accent); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
  .muted { color: var(--muted); }
  small, .small { font-size: 12.5px; }
  .hu { color: var(--muted); font-size: 12.5px; }
  input, select, button { font: inherit; color: inherit; }
  input[type=text], input[type=number], input[type=search], select {
    background: var(--chip); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
  button { background: var(--chip); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.yes { border-color: var(--yes); } button.no { border-color: var(--no); } button.unsure { border-color: var(--unsure); }
  button.on.yes { background: var(--yes); color: #fff; } button.on.no { background: var(--no); color: #fff; }
  button.on.unsure { background: var(--unsure); color: #000; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 2; }
  .tabs button { white-space: nowrap; border-radius: 999px; }
  .tabs button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bar { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .subj { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; margin: 10px 0; }
  .subj .bar { grid-column: 1 / -1; }
  .q h2 { font-size: 18px; margin: 4px 0; }
  .prompt { font-size: 17px; background: var(--chip); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
  ul.topics { list-style: none; margin: 0; padding: 0; }
  ul.topics li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--border); cursor: pointer; }
  ul.topics li:first-child { border-top: 0; }
  ul.topics li .t { flex: 1; min-width: 0; }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; border: 2px solid var(--border); }
  .dot.y { background: var(--yes); border-color: var(--yes); } .dot.n { background: var(--no); border-color: var(--no); }
  .dot.u { background: var(--unsure); border-color: var(--unsure); } .dot.l { background: var(--accent); border-color: var(--accent); } .dot.yk { background: var(--implied); border-color: var(--implied); }
  .dot.nk { background: var(--gap); border-color: var(--no); }
  details { border-top: 1px solid var(--border); padding: 6px 0; }
  details summary { cursor: pointer; padding: 4px 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; gap: 6px; align-items: center; }
  .legend .dot, .small .dot { margin: 0; display: inline-block; vertical-align: -1px; }
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 5; }
  #sheet .card { position: absolute; right: 0; top: 0; bottom: 0; width: min(520px, 100%); margin: 0; border-radius: 0;
    overflow: auto; padding-bottom: 60px; }
  #sheet h2 { font-size: 19px; margin: 0 32px 2px 0; }
  #sheet h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  #sheetClose { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 22px; }
  .note { background: var(--chip); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .empty { color: var(--muted); padding: 8px 0; }
  @media (max-width: 600px) { #sheet .card { top: 8vh; border-radius: 14px 14px 0 0; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="hello">Профиль ребёнка</h1>
    <a href="./?lang=ru">← Граф навыков</a>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="view"><div class="card muted">Загрузка…</div></div>
</main>
<div id="sheet"><div class="card"><button id="sheetClose" aria-label="Закрыть">×</button><div id="sheetBody"></div></div></div>
<script>
// Child profile on top of the skill graph: adaptive diagnostics, "what next" and gap search.
// Topics are grouped by Hungarian school subjects (NAT 2020, grades 1–4), not by the US/UK source curriculum.
// Progress stays in this browser (localStorage) and can be exported/imported as JSON.

const SCHOOL = [
  { id: 'mat', ru: 'Математика', hu: 'Matematika', subjects: ['Mathematics'] },
  { id: 'kor', ru: 'Окружающий мир', hu: 'Környezetismeret', subjects: ['Science'] },
  { id: 'lit', ru: 'Чтение и письмо', hu: 'Magyar nyelv és irodalom', subjects: ['English'],
    domains: ['Reading Comprehension', 'Writing Composition', 'Speaking & Listening', 'Vocabulary', 'English Thinking',
              'Grammar & Punctuation', 'Handwriting & Transcription'],
    note: 'Общие навыки чтения, письма и речи, они работают и на венгерском, и на русском. Английская фонетика и орфография убраны; в грамматике часть тем английская (артикли, апостроф), их можно отметить «не про нас».' },
  { id: 'dig', ru: 'Цифровая культура', hu: 'Digitális kultúra', subjects: ['Computing'] },
  { id: 'eti', ru: 'Этика и умение учиться', hu: 'Etika · tanulásmódszertan', subjects: ['Personal & Social Development', 'Learning to Learn', 'Life Skills'] },
  { id: 'tor', ru: 'История', hu: 'Történelem', subjects: ['History'], extra: true,
    note: 'В венгерской школе история начинается с 5 класса. Здесь темы на будущее, по умолчанию выключены.' },
];
const STATUS_RU = { y: 'знает', l: 'изучаем', n: 'не знает', u: 'не уверены', yk: 'знает (выведено)', nk: 'пока не знает (выведено)', x: 'не про нас' };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const json = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(`${u}: ${r.status}`); return r.json(); });

let T = new Map(), huName = new Map(), labels = { subjects: {}, domains: {} }, huLabels = { subjects: {}, domains: {} };
let hardPre = new Map(), hardPost = new Map(), allPre = new Map(), allPost = new Map();
let anc = new Map(), desc = new Map(), schoolOf = new Map(), byDomain = new Map();
const mid = (t) => (t.ageRangeStart + t.ageRangeEnd) / 2;
let P, eff = new Map(), tab = 'diag', diagSubj = null, mapSubj = 'mat', mapFilter = 'all', mapQuery = '';

// Storage is shared with the main viewer (index.html): skillgraph.name and skillgraph.progress
// ({id: 'known' | 'learning'}). Diagnostics adds skillgraph.diag ({id: 'n' | 'u' | 'x'}) and skillgraph.child.
const store = {
  get(k, d) { try { const v = localStorage.getItem('skillgraph.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('skillgraph.' + k, JSON.stringify(v)); } catch { /* private mode: keep in memory */ } },
};
function loadProfile(src) {
  const get = src ? (k, d) => src[k] ?? d : store.get;
  const cfg = { age: 9, grade: 4, school: ['mat', 'kor', 'lit', 'dig', 'eti'], ...get('child', {}) };
  const status = { ...get('diag', {}) };
  for (const [id, v] of Object.entries(get('progress', {}))) status[id] = v === 'known' ? 'y' : 'l';
  return { ...cfg, name: get('name', ''), status };
}
function dump() {
  const progress = {}, diag = {};
  for (const [id, v] of Object.entries(P.status)) {
    if (v === 'y') progress[id] = 'known'; else if (v === 'l') progress[id] = 'learning'; else diag[id] = v;
  }
  return { name: P.name, child: { age: P.age, grade: P.grade, school: P.school }, progress, diag };
}
function save() { for (const [k, v] of Object.entries(dump())) store.set(k, v); }
P = loadProfile();
const childName = () => P.name.trim() || 'ребёнок';

// --- graph -------------------------------------------------------------------
function push(m, k, v) { (m.get(k) ?? m.set(k, []).get(k)).push(v); }
function closure(id, adj, memo) {
  // transitive hard closure; the graph is a DAG so memoised DFS is safe
  if (memo.has(id)) return memo.get(id);
  const out = new Set();
  memo.set(id, out);
  for (const e of adj.get(id) ?? []) { out.add(e); for (const x of closure(e, adj, memo)) out.add(x); }
  return out;
}

function schoolFor(t) {
  return SCHOOL.find((s) => s.subjects.includes(t.subject) && (!s.domains || s.domains.includes(t.domain)))?.id ?? null;
}
// Topics the diagnostics asks about: enabled subjects, ages that overlap [age-2, age+1].
const inScope = (t) => P.school.includes(schoolOf.get(t.id)) && t.ageRangeStart <= P.age + 1 && t.ageRangeEnd >= P.age - 2;
// Topics finished well before this age are assumed known unless something says otherwise.
const assumedByAge = (t) => t.ageRangeEnd < P.age - 2;

function recompute() {
  eff = new Map();
  const st = P.status, infK = new Set(), infU = new Set();
  for (const [id, s] of Object.entries(st)) {
    if (!T.has(id)) continue;
    // hard prerequisites of a known topic are known; topics that hard-depend on an unknown one are unknown
    if (s === 'y') for (const a of anc.get(id)) infK.add(a);
    if (s === 'n') for (const d of desc.get(id)) infU.add(d);
    // age ladder inside a domain: hard edges alone leave most topics open, so younger topics of the same
    // domain count as known after a "yes", older ones as unknown after a "no" (inferred, still editable)
    const t = T.get(id), m = mid(t);
    if (s === 'y') for (const x of byDomain.get(t.domain)) { if (mid(x) <= m) infK.add(x.id); }
    if (s === 'n') for (const x of byDomain.get(t.domain)) { if (mid(x) >= m) infU.add(x.id); }
  }
  for (const id of T.keys()) {
    const s = st[id];
    if (s) { eff.set(id, s); continue; }
    const k = infK.has(id), u = infU.has(id);
    if (k && !u) eff.set(id, 'yk');
    else if (u && !k) eff.set(id, 'nk');
    else if (!u && assumedByAge(T.get(id))) eff.set(id, 'yk');
  }
}
const known = (id) => { const s = eff.get(id); return s === 'y' || s === 'yk' || s === 'x'; };
const open = (id) => !eff.has(id);

// Next question: the unanswered topic whose answer settles the most other unanswered topics.
function nextQuestion(subj) {
  let best = null, bestScore = -1;
  for (const t of T.values()) {
    if (!open(t.id) || !inScope(t) || (subj && schoolOf.get(t.id) !== subj)) continue;
    const m = mid(t), below = new Set(anc.get(t.id)), above = new Set(desc.get(t.id));
    for (const x of byDomain.get(t.domain)) { if (mid(x) <= m) below.add(x.id); if (mid(x) >= m) above.add(x.id); }
    let a = 0, d = 0;
    for (const x of below) if (open(x) && inScope(T.get(x))) a++;
    for (const x of above) if (open(x) && inScope(T.get(x))) d++;
    const p = Math.min(0.9, Math.max(0.1, (P.age + 1 - m) / 3)); // prior that a topic of this age is already known
    const score = p * a + (1 - p) * d + t.centrality;
    if (score > bestScore) { bestScore = score; best = t; }
  }
  return best;
}

function frontier() {
  const out = [];
  for (const t of T.values()) {
    if (known(t.id) || !P.school.includes(schoolOf.get(t.id)) || t.ageRangeStart > P.age + 1) continue;
    if ((hardPre.get(t.id) ?? []).every(known)) out.push(t);
  }
  const rank = (t) => ({ l: 0, n: 1, nk: 2, u: 3 }[eff.get(t.id)] ?? 4);
  return out.sort((a, b) => rank(a) - rank(b) || a.ageRangeStart - b.ageRangeStart || b.centrality - a.centrality);
}

// Gaps behind a topic: unknown hard prerequisites, the ones to start from first.
function gaps(id) {
  const missing = [...anc.get(id)].filter((x) => !known(x)).map((x) => T.get(x));
  const start = missing.filter((t) => (hardPre.get(t.id) ?? []).every(known));
  return { missing, start: start.sort((a, b) => a.ageRangeStart - b.ageRangeStart) };
}

// --- rendering ---------------------------------------------------------------
const nm = (t) => esc(t.name);
const hu = (t) => huName.has(t.id) ? `<div class="hu" lang="hu">${esc(huName.get(t.id))}</div>` : '';
const dot = (id) => `<span class="dot ${eff.get(id) ?? ''}" title="${STATUS_RU[eff.get(id)] ?? 'не проверено'}"></span>`;
const prompt = (t) => esc(t.assessmentPrompt.replaceAll('{{name}}', childName()));
const sch = (id) => SCHOOL.find((s) => s.id === id);
const domLabel = (d) => `${esc(labels.domains[d] ?? d)}${huLabels.domains[d] ? ` <span class="hu" lang="hu">· ${esc(huLabels.domains[d])}</span>` : ''}`;

function topicLi(t, extra = '') {
  return `<li data-id="${t.id}">${dot(t.id)}<div class="t">${nm(t)}${hu(t)}<div class="small muted">${esc(sch(schoolOf.get(t.id))?.ru ?? '')} · ${esc(labels.domains[t.domain] ?? t.domain)} · ${t.ageRangeStart}–${t.ageRangeEnd} лет</div>${extra}</div></li>`;
}
const legend = () => `<div class="legend">${['y', 'yk', 'l', 'u', 'nk', 'n'].map((s) => `<span><span class="dot ${s}"></span>${STATUS_RU[s]}</span>`).join('')}<span><span class="dot"></span>не проверено</span></div>`;

function render() {
  recompute();
  $('hello').textContent = P.name.trim() ? `${P.name.trim()} · ${P.grade} класс` : 'Профиль ребёнка';
  const tabs = { diag: 'Диагностика', next: 'Что дальше', map: 'Все темы', profile: 'Профиль' };
  $('tabs').innerHTML = Object.entries(tabs).map(([k, v]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${v}</button>`).join('');
  $('view').innerHTML = { diag: viewDiag, next: viewNext, map: viewMap, profile: viewProfile }[tab]();
}

function progress() {
  return P.school.map((sid) => {
    const s = sch(sid), ids = [...T.values()].filter((t) => schoolOf.get(t.id) === sid && inScope(t)).map((t) => t.id);
    const c = { y: 0, n: 0, open: 0 };
    for (const id of ids) known(id) ? c.y++ : open(id) || eff.get(id) === 'u' ? c.open++ : c.n++;
    const w = (x) => ids.length ? (100 * x / ids.length).toFixed(1) : 0;
    return `<div class="subj"><div>${esc(s.ru)} <span class="hu" lang="hu">${esc(s.hu)}</span></div>
      <div class="small muted">${c.y} знает · ${c.n} нет · ${c.open} не проверено</div>
      <div class="bar"><i style="width:${w(c.y)}%;background:var(--yes)"></i><i style="width:${w(c.n)}%;background:var(--no)"></i></div></div>`;
  }).join('');
}

function viewDiag() {
  if (!P.name.trim()) {
    return `<div class="card"><h2>Начнём с профиля</h2><p class="muted">Имя подставляется в вопросы, возраст задаёт, какие темы спрашивать.</p>${profileForm()}</div>`;
  }
  const q = nextQuestion(diagSubj);
  const chips = `<div class="chips"><button class="chip ${diagSubj ? '' : 'on'}" data-diag="">Все предметы</button>${P.school.map((sid) =>
    `<button class="chip ${diagSubj === sid ? 'on' : ''}" data-diag="${sid}">${esc(sch(sid).ru)}</button>`).join('')}</div>`;
  const body = q ? `<div class="q">
      <div class="small muted">${esc(sch(schoolOf.get(q.id)).ru)} · ${domLabel(q.domain)} · ${q.ageRangeStart}–${q.ageRangeEnd} лет</div>
      <h2>${nm(q)}</h2>${hu(q)}
      <div class="prompt">${prompt(q)}</div>
      <div class="row">
        <button class="yes" data-set="y" data-id="${q.id}">Да, умеет</button>
        <button class="unsure" data-set="u" data-id="${q.id}">Не уверены</button>
        <button class="no" data-set="n" data-id="${q.id}">Нет, пока нет</button>
        <button data-open="${q.id}">Подробнее</button>
      </div>
      <p class="small muted">Сомневаетесь? Можно спросить прямо сейчас или выбрать «Не уверены»: тема попадёт в «Что дальше» на проверку. Остановиться можно в любой момент.</p>
    </div>` : `<p>По ${diagSubj ? `предмету «${esc(sch(diagSubj).ru)}»` : 'выбранным предметам'} вопросов больше нет. Смотрите вкладку «Что дальше».</p>`;
  const answered = Object.keys(P.status).length;
  return `<div class="card">${chips}</div><div class="card">${body}</div>
    <div class="card"><div class="row" style="justify-content:space-between"><b>Прогресс</b><span class="small muted">ответов: ${answered}${answered ? ` · <a href="#" data-undo>отменить последний</a>` : ''}</span></div>${progress()}${legend()}</div>`;
}

function viewNext() {
  const f = frontier();
  const bySubj = P.school.map((sid) => {
    const list = f.filter((t) => schoolOf.get(t.id) === sid).slice(0, 6);
    return `<div class="card"><b>${esc(sch(sid).ru)}</b> <span class="hu" lang="hu">${esc(sch(sid).hu)}</span>
      ${list.length ? `<ul class="topics">${list.map((t) => topicLi(t, eff.get(t.id) ? '' : '<div class="small muted">не проверено: сначала спросите</div>')).join('')}</ul>` : '<div class="empty">Пока нечего предложить: всё в пределах возраста освоено или ждёт проверки.</div>'}</div>`;
  }).join('');
  return `<div class="card"><p style="margin:0">Темы, к которым уже можно переходить: все обязательные предыдущие темы освоены. Сверху то, что точно не знает, ниже то, что стоит проверить.</p></div>${bySubj}`;
}

function viewMap() {
  const s = sch(mapSubj), q = mapQuery.trim().toLowerCase();
  const pass = (t) => {
    const e = eff.get(t.id);
    if (mapFilter === 'gap' && !(e === 'n' || e === 'nk' || e === 'u' || e === 'l')) return false;
    if (mapFilter === 'open' && e) return false;
    if (mapFilter === 'age' && !inScope(t)) return false;
    return !q || t.name.toLowerCase().includes(q) || (huName.get(t.id) ?? '').toLowerCase().includes(q);
  };
  const topics = [...T.values()].filter((t) => schoolOf.get(t.id) === mapSubj && pass(t))
    .sort((a, b) => a.ageRangeStart - b.ageRangeStart || b.centrality - a.centrality);
  const byDom = new Map();
  for (const t of topics) push(byDom, t.domain, t);
  const chips = SCHOOL.map((x) => `<button class="chip ${x.id === mapSubj ? 'on' : ''}" data-map="${x.id}">${esc(x.ru)}</button>`).join('');
  const filters = { age: `Возраст ${P.age - 2}–${P.age + 1}`, all: 'Все', gap: 'Пробелы', open: 'Не проверено' };
  return `<div class="card"><div class="chips">${chips}</div>
      <div class="row" style="margin-top:10px"><input type="search" id="q" placeholder="Поиск, можно по-венгерски" value="${esc(mapQuery)}" style="flex:1 1 200px">
      <select id="mf">${Object.entries(filters).map(([k, v]) => `<option value="${k}" ${k === mapFilter ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      ${s.note ? `<p class="note">${esc(s.note)}</p>` : ''}${legend()}</div>
    <div class="card">${byDom.size ? [...byDom].map(([d, list]) =>
      `<details ${byDom.size <= 3 || q ? 'open' : ''}><summary>${domLabel(d)} <span class="small muted">· ${list.filter((t) => known(t.id)).length}/${list.length}</span></summary>
        <ul class="topics">${list.map((t) => topicLi(t)).join('')}</ul></details>`).join('') : '<div class="empty">Ничего не найдено.</div>'}</div>`;
}

function profileForm() {
  return `<div class="row"><label>Имя <input type="text" id="pName" value="${esc(P.name)}" placeholder="например, Аня"></label>
    <label>Возраст <input type="number" id="pAge" min="4" max="12" value="${P.age}" style="width:70px"></label>
    <label>Класс <input type="number" id="pGrade" min="0" max="6" value="${P.grade}" style="width:70px"></label></div>
    <h3 class="small muted" style="margin:14px 0 6px">Предметы (венгерская школа)</h3>
    <div class="chips">${SCHOOL.map((s) => `<button class="chip ${P.school.includes(s.id) ? 'on' : ''}" data-school="${s.id}">${esc(s.ru)} · <span lang="hu">${esc(s.hu)}</span></button>`).join('')}</div>
    <p class="note">Английский как иностранный (Angol) в графе не представлен: раздел English рассчитан на носителей языка.</p>
    <div class="row"><button class="primary" data-saveprofile>Сохранить</button></div>`;
}

function viewProfile() {
  return `<div class="card">${profileForm()}</div>
    <div class="card"><b>Данные</b><p class="small muted">Ответы хранятся только в этом браузере. Сохраните файл, чтобы перенести на другое устройство.</p>
      <div class="row"><button data-export>Скачать прогресс</button><label class="small"><button data-importbtn>Загрузить прогресс</button>
      <input type="file" id="imp" accept="application/json" hidden></label><button data-reset>Сбросить ответы</button></div>
      <p class="small muted">Ответы общие со списком тем в графе. Выведенные темы (бледно-зелёные) граф не видит, их можно перенести:</p>
      <button data-commit>Отметить выведенные темы как освоенные</button></div>`;
}

function openTopic(id) {
  const t = T.get(id), s = P.status[id], e = eff.get(id);
  const rel = (list, key) => list.map((x) => topicLi(T.get(x[key]), x.reason ? `<div class="small muted">${esc(x.reason)}</div>` : '')).join('');
  const g = known(id) ? null : gaps(id);
  $('sheetBody').innerHTML = `
    <h2>${nm(t)}</h2>${hu(t)}
    <div class="small muted" style="margin:6px 0">${esc(sch(schoolOf.get(id))?.ru ?? labels.subjects[t.subject] ?? t.subject)} · ${domLabel(t.domain)} · ${t.ageRangeStart}–${t.ageRangeEnd} лет · ${dot(id)} ${STATUS_RU[e] ?? 'не проверено'}</div>
    <div class="row" style="margin:10px 0">${['y', 'l', 'u', 'n'].map((k) => `<button class="${{ y: 'yes', l: 'unsure', u: 'unsure', n: 'no' }[k]} ${s === k ? 'on' : ''}" data-set="${k}" data-id="${id}" data-keep>${{ y: 'Знает', l: 'Изучаем', u: 'Не уверены', n: 'Не знает' }[k]}</button>`).join('')}
      <button data-set="x" data-id="${id}" data-keep class="${s === 'x' ? 'on' : ''}" title="Тема не относится к нашей программе">Не про нас</button>
      ${s ? `<button data-set="" data-id="${id}" data-keep>Сбросить</button>` : ''}</div>
    <div>${esc(t.description)}</div>
    <h3>Как проверить</h3><div class="prompt">${prompt(t)}</div>
    ${t.evidence?.length ? `<h3>Признаки освоения</h3><ul>${t.evidence.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${g && g.missing.length ? `<h3>Почему может не получаться</h3><p class="small">Не освоено или не проверено ${g.missing.length} из обязательных предыдущих тем. Начать стоит с этих:</p><ul class="topics">${g.start.slice(0, 8).map((x) => topicLi(x)).join('')}</ul>` : ''}
    ${(allPre.get(id) ?? []).length ? `<h3>Нужно знать до</h3><ul class="topics">${rel(allPre.get(id), 'prerequisiteId')}</ul>` : ''}
    ${(allPost.get(id) ?? []).length ? `<h3>Открывает</h3><ul class="topics">${rel(allPost.get(id), 'topicId')}</ul>` : ''}`;
  $('sheet').style.display = 'block';
  $('sheet').querySelector('.card').scrollTop = 0;
  $('sheet').dataset.id = id;
}

// --- events ------------------------------------------------------------------
let history_ = [];
function setStatus(id, s) {
  history_.push([id, P.status[id]]);
  if (s) P.status[id] = s; else delete P.status[id];
  save();
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('button, li[data-id], a[data-undo]');
  if (!el) { if (ev.target === $('sheet')) $('sheet').style.display = 'none'; return; }
  const d = el.dataset;
  if (d.tab) { tab = d.tab; render(); scrollTo(0, 0); return; }
  if (d.diag !== undefined) { diagSubj = d.diag || null; render(); return; }
  if (d.map) { mapSubj = d.map; render(); return; }
  if (d.school) { el.classList.toggle('on'); return; }
  if (d.set !== undefined) {
    setStatus(d.id, d.set); render();
    if (d.keep !== undefined) openTopic(d.id);
    return;
  }
  if (d.undo !== undefined) {
    ev.preventDefault();
    const last = history_.pop();
    if (last) { last[1] ? (P.status[last[0]] = last[1]) : delete P.status[last[0]]; save(); render(); }
    return;
  }
  if (d.open) { openTopic(d.open); return; }
  if (d.id && el.tagName === 'LI') { openTopic(d.id); return; }
  if (el.id === 'sheetClose') { $('sheet').style.display = 'none'; return; }
  if (d.saveprofile !== undefined) {
    P.name = $('pName').value.trim();
    P.age = Math.min(12, Math.max(4, parseInt($('pAge').value, 10) || 9));
    P.grade = Math.min(6, Math.max(0, parseInt($('pGrade').value, 10) || 4));
    P.school = [...document.querySelectorAll('[data-school].on')].map((b) => b.dataset.school);
    if (!P.school.length) P.school = ['mat'];
    save(); tab = 'diag'; render(); return;
  }
  if (d.export !== undefined) {
    const url = URL.createObjectURL(new Blob([JSON.stringify(dump(), null, 1)], { type: 'application/json' }));
    Object.assign(document.createElement('a'), { href: url, download: `progress-${P.name || 'child'}.json` }).click();
    URL.revokeObjectURL(url); return;
  }
  if (d.commit !== undefined) {
    let n = 0;
    for (const [id, e] of eff) if (e === 'yk' && !assumedByAge(T.get(id))) { P.status[id] = 'y'; n++; }
    save(); render(); $('view').insertAdjacentHTML('afterbegin', `<div class="card note">Отмечено тем: ${n}</div>`); return;
  }
  if (d.importbtn !== undefined) { $('imp').click(); return; }
  if (d.reset !== undefined) {
    if (el.dataset.armed) { P.status = {}; history_ = []; save(); render(); }
    else { el.dataset.armed = 1; el.textContent = 'Точно сбросить?'; }
  }
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'q') { mapQuery = ev.target.value; const pos = ev.target.selectionStart; render(); const q = $('q'); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('change', async (ev) => {
  if (ev.target.id === 'mf') { mapFilter = ev.target.value; render(); }
  if (ev.target.id === 'imp' && ev.target.files[0]) {
    try {
      const x = JSON.parse(await ev.target.files[0].text());
      if (!x || typeof x.progress !== 'object') throw new Error('нет поля progress');
      P = loadProfile(x); save(); render();
    } catch (err) { $('view').insertAdjacentHTML('afterbegin', `<div class="card note">Не удалось загрузить файл: ${esc(err.message)}</div>`); }
  }
});
addEventListener('keydown', (ev) => { if (ev.key === 'Escape') $('sheet').style.display = 'none'; });

// --- boot --------------------------------------------------------------------
(async () => {
  try {
    const [topics, deps, lab] = await Promise.all([
      json('data/i18n/ru/topics.json'), json('data/i18n/ru/dependencies.json'), json('data/i18n/ru/labels.json')]);
    labels = lab;
    T = new Map(topics.topics.map((t) => [t.id, t]));
    for (const e of deps.dependencies) {
      push(allPre, e.topicId, e); push(allPost, e.prerequisiteId, e);
      if (e.strength === 'hard') { push(hardPre, e.topicId, e.prerequisiteId); push(hardPost, e.prerequisiteId, e.topicId); }
    }
    const ma = new Map(), md = new Map();
    for (const id of T.keys()) { anc.set(id, closure(id, hardPre, ma)); desc.set(id, closure(id, hardPost, md)); }
    for (const t of T.values()) { schoolOf.set(t.id, schoolFor(t)); push(byDomain, t.domain, t); }
    if (!P.name.trim()) tab = 'diag';
    render();
  } catch (err) {
    $('view').innerHTML = `<div class="card">Не удалось загрузить данные: ${esc(err.message)}</div>`;
    return;
  }
  // Hungarian names are secondary: load after the first render
  try {
    const [h, hl] = await Promise.all([json('data/i18n/hu/topics.json'), json('data/i18n/hu/labels.json')]);
    huName = new Map(h.topics.map((t) => [t.id, t.name])); huLabels = hl;
    render();
  } catch { /* page works without HU names */ }
})();
</script>
</body>
</html>
