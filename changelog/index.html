const p = new URLSearchParams(location.search);
let lang = LANGS[p.get('lang')] ? p.get('lang') : 'en';
const open = new Set(); // days whose lab list is expanded

const getJson = (url) => fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null);
const [reg, manifest, extra, school, routes] = await Promise.all(['../labs/registry.json', '../data/manifest.json',
  '../data/extra/topics.json', '../data/school-curricula.json', '../data/extra/routes.json'].map(getJson));
const labs = reg?.labs ?? [];
const labsByDay = {};
for (const l of labs) if (l.added) (labsByDay[l.added] ??= []).push(l);
const byDay = Object.fromEntries(NEWS.map((x) => [x.d, x]));
const days = [...new Set([...NEWS.map((x) => x.d), ...Object.keys(labsByDay)])].sort().reverse();
const stats = [
  [(manifest?.counts?.topics ?? 0) + (extra?.topics?.length ?? 0), 'stTopics', manifest && extra],
  [labs.length, 'stLabs', reg],
  [school ? Object.keys(school.curricula).length : 0, 'stCur', school],
  [routes?.routes?.length ?? 0, 'stRoutes', routes],
].filter((s) => s[2]);

function render() {
  const u = UI[lang], q = `?lang=${lang}`, nf = (n) => n.toLocaleString(lang);
  const fmt = new Intl.DateTimeFormat(lang, { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
  document.documentElement.lang = lang;
  document.title = `${u.title} · Skill Graph`;
  document.getElementById('brand').innerHTML = `Skill Graph<i>.</i><small>${esc(u.brand)}</small>`;
  document.getElementById('brand').href = `../${q}`;
  document.getElementById('views').innerHTML = `<a href="../${q}">${esc(u.graph)}</a><a href="../${q}&view=list">${esc(u.list)}</a><a href="../labs/${q}">🧪 ${esc(u.labs)}</a><a href="../curricula/${q}">📚 ${esc(u.cur)}</a>`;
  document.getElementById('langs').innerHTML = Object.entries(LANGS).map(([k, v]) => `<button data-lang="${k}" class="${k === lang ? 'on' : ''}">${v}</button>`).join('');
  const tx = (o) => o?.[lang] ?? o?.en ?? '';
  const card = (d) => {
    const items = (byDay[d]?.[lang] ?? []).map((s) => `<li>${s.replaceAll('{q}', q)}</li>`).join('');
    const ls = labsByDay[d] ?? [], all = open.has(d);
    const chips = (all ? ls : ls.slice(0, SHOW)).map((l) => `<a href="../${esc(l.path)}${q}">${l.emoji ?? ''} ${esc(tx(l.title))}</a>`).join('');
    const more = ls.length > SHOW ? `<button class="more" data-day="${d}">${esc(all ? u.less : u.all(ls.length))}</button>` : '';
    return `<section class="card day"><h2>${esc(fmt.format(new Date(d + 'T00:00:00Z')))}</h2>${items ? `<ul>${items}</ul>` : ''}
      ${ls.length ? `<div class="labs"><h3>🧪 ${esc(u.newLabs(ls.length))}</h3><div class="chips">${chips}</div>${more}</div>` : ''}</section>`;
  };
  document.getElementById('main').innerHTML = `<h1>${esc(u.title)}<i>.</i></h1><p class="lead">${esc(u.lead)}</p>
    ${stats.length ? `<div class="stats">${stats.map(([n, k]) => `<div class="card st"><b>${nf(n)}</b><span>${esc(u[k](n))}</span></div>`).join('')}</div>` : ''}
    ${days.map(card).join('')}
    <p class="tail">${esc(u.tail)} <a href="${REPO}" target="_blank" rel="noopener">${esc(u.tailLink)}</a></p>`;
  history.replaceState(null, '', q);
}
document.getElementById('langs').addEventListener('click', (ev) => {
  const k = ev.target.closest('button')?.dataset.lang; if (!k) return;
  lang = k; render();
});
document.getElementById('main').addEventListener('click', (ev) => {
  const d = ev.target.closest('.more')?.dataset.day; if (!d) return;
  if (open.has(d)) open.delete(d); else open.add(d);
  render();
});
render();
</script>
