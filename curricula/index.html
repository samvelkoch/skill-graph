const ruPlural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many;

const CONTRIB = 'https://github.com/samvelkoch/skill-graph/blob/main/CONTRIBUTING.md#add-a-countrys-school-curriculum';

const UI = {

    whyH: 'Среди сильнейших школьных систем мира',
    why: ['<b>Сингапур</b> — первое место по всем трём предметам PISA 2022 (математика, чтение, естественные науки) и во всех четырёх таблицах TIMSS 2023 (4 и 8 класс, математика и естествознание).',
      '<b>Япония</b> — в группе лидеров по математике в PISA 2022 и на втором месте по естествознанию в 8 классе в TIMSS 2023.',
      '<b>Эстония</b> в PISA 2022 — в группе сразу за Сингапуром по чтению и среди лучших по естественным наукам.',

    listH: 'Программы',
    who: { hu: 'Издаёт Управление образования Венгрии (Oktatási Hivatal).', ru: 'Федеральные рабочие программы Минпросвещения, опубликованы на edsoo.ru.', rs: 'Министерство просвещения Сербии, опубликованы в «Просветном гласнике».', de: 'Институт качества школьного образования Баварии (ISB). Единой программы в Германии нет: каждая земля утверждает свою.', us: 'Стандарты, принятые штатами: Common Core (2010), NGSS (2013), C3 Framework (2013). Единой программы в США нет.', gb: 'Министерство образования Великобритании (Department for Education), 2013.', sg: 'Министерство образования Сингапура (MOE).', se: 'Национальное агентство образования Швеции (Skolverket).', jp: 'Министерство образования, культуры, спорта, науки и технологий Японии (MEXT).', ee: 'Постановление правительства Эстонии, опубликовано в Riigi Teataja.' },
    grades: (a, b) => `${a}–${b} класс`, items: (n) => `${n} ${ruPlural(n, 'пункт', 'пункта', 'пунктов')}`, linked: (n) => `связанных тем: ${n}`,
    showGrade: 'На графе:', g: (g) => `${g} кл.`, openDoc: 'Открыть документ ↗',
    ibName: 'Международный бакалавриат', ibWho: 'Организация Международного бакалавриата, Женева. Граф использует раздел её программы начальной школы (PYP) о личностном, социальном и физическом развитии.', openIb: 'О программе ↗',
    none: (n) => `${n} ${ruPlural(n, 'тема', 'темы', 'тем')} пока не ${ruPlural(n, 'связана', 'связаны', 'связаны')} ни с одной из этих программ: ${ruPlural(n, 'она есть', 'они есть', 'они есть')} только в таксономии Marble.`, marble: 'Таксономия Marble ↗',
    addH: 'Нет вашей страны?', addLink: 'Вот как добавить её программу →',
    cn: { hu: 'Венгрия', ru: 'Россия', rs: 'Сербия', de: 'Германия', us: 'США', gb: 'Англия', sg: 'Сингапур', se: 'Швеция', jp: 'Япония', ee: 'Эстония' } },
  hu: { brand: 'Tantervek', graph: 'Gráf', list: 'Témalista', labs: 'Laborok', title: 'Iskolai tantervek',
    lead: (n) => `A gráf témáit ${n} ország és a Nemzetközi Érettségi (IB) hivatalos iskolai tantervével vetettük össze: ezeket az oktatási minisztériumok adják ki, és ezek szerint tanítanak az alsó és a felső tagozaton.`,
    stCountries: () => 'ország', stItems: () => 'tantervi pont, mindegyik a tanított témákhoz kötve', stCovered: (k, t) => `téma szerepel legalább egy tantervben (összesen ${t})`,
    whyH: 'A világ legerősebb iskolarendszerei között',
    why: ['<b>Szingapúr</b> első lett a PISA 2022 mindhárom területén (matematika, szövegértés, természettudomány) és a TIMSS 2023 mind a négy táblázatában (4. és 8. évfolyam, matematika és természettudomány).',
      '<b>Japán</b> a PISA 2022-ben a matematika élmezőnyében van, a TIMSS 2023-ban pedig második a 8. évfolyamos természettudományban.',

    srcH: 'Források:', howH: 'Hogyan használja őket a gráf',
    how: 'Minden tantervet pontokra bontottunk: egy tantárgy egy egysége egy osztályban. Minden pont a tanított témákhoz kapcsolódik: „fő” kapcsolat, ha közvetlenül tanítja a témát, „kapcsolódó”, ha érinti. A kapcsolatokat egy nyelvi modell készítette csomagonként, és ember ellenőrizte. Válassz a gráfon országot és osztályt, és csak az adott osztály témái maradnak.',
    listH: 'A tantervek',
    who: { hu: 'Kiadja az Oktatási Hivatal.', ru: 'Az orosz oktatási minisztérium szövetségi munkaprogramjai, az edsoo.ru oldalon.', rs: 'A szerb oktatási minisztérium, a Prosvetni glasnikban közzétéve.', de: 'Bajor Iskolaminőségi Intézet (ISB). Németországban nincs országos tanterv: minden tartomány maga határozza meg.', us: 'Az államok által elfogadott standardok: Common Core (2010), NGSS (2013), C3 Framework (2013). Az USA-ban nincs országos tanterv.', gb: 'Az angol oktatási minisztérium (Department for Education), 2013.', sg: 'Szingapúri Oktatási Minisztérium (MOE).', se: 'Svéd Nemzeti Oktatási Ügynökség (Skolverket).', jp: 'Japán Oktatási, Kulturális, Sport-, Tudományos és Technológiai Minisztérium (MEXT).', ee: 'Az észt kormány rendelete, a Riigi Teatajában közzétéve.' },
    grades: (a, b) => `${a}–${b}. osztály`, items: (n) => `${n} pont`, linked: (n) => `${n} kapcsolt téma`,
    showGrade: 'A gráfon:', g: (g) => `${g}.`, openDoc: 'A dokumentum megnyitása ↗',
    ibName: 'Nemzetközi Érettségi (IB)', ibWho: 'Nemzetközi Érettségi Szervezet, Genf. A gráf az alapfokú program (PYP) személyes, társas és testi nevelési részét használja.', openIb: 'A programról ↗',
    none: (n) => `${n} téma még egyik tantervhez sem kapcsolódik: ezek csak a Marble taxonómiában szerepelnek.`, marble: 'Marble taxonómia ↗',
    addH: 'Hiányzik az országod?', addLink: 'Így adhatod hozzá a tantervét →',
    cn: { hu: 'Magyarország', ru: 'Oroszország', rs: 'Szerbia', de: 'Németország', us: 'USA', gb: 'Anglia', sg: 'Szingapúr', se: 'Svédország', jp: 'Japán', ee: 'Észtország' } },
};
const p = new URLSearchParams(location.search);
let lang = LANGS[p.get('lang')] ? p.get('lang') : 'en';

const getJson = (url, optional) => fetch(url).then((r) => { if (!r.ok) throw new Error(url); return r.json(); }).catch((e) => { if (optional) return null; throw e; });
const [school, top, extra] = await Promise.all([getJson('../data/school-curricula.json'), getJson('../data/topics.json'), getJson('../data/extra/topics.json', true)]);

// every number on the page is computed here from the data files
const C = Object.keys(school.curricula);
const items = Object.fromEntries(C.map((c) => [c, 0]));
for (const it of school.items) if (it[0] in items) items[it[0]]++;
const linked = Object.fromEntries(C.map((c) => [c, 0]));
for (const id of Object.keys(school.links)) {
  const seen = new Set(school.links[id].map(([i]) => school.items[i][0]));
  for (const c of seen) if (c in linked) linked[c]++;
}
const topics = [...(top?.topics ?? []), ...(extra?.topics ?? [])];
const stdKeys = (t) => (Array.isArray(t.standards) ? t.standards : Object.keys(t.standards ?? {}));
const ib = topics.filter((t) => stdKeys(t).some((k) => String(k).startsWith('ib-pyp-pspe:'))).length;
const COVER = ['uk-nc-2013', 'ib-pyp-pspe', 'c3-social-studies', 'ccss-ela', 'ccss-math', 'ngss-k5', 'ngss-ms'];
const covered = topics.filter((t) => school.links[t.id] || t.curricula?.length || stdKeys(t).some((k) => COVER.includes(String(k).split(':')[0]))).length;
const total = topics.length, none = total - covered;
const gradesOf = (c) => { const g = (school.curricula[c].grades ?? []).map(Number); return [Math.min(...g), Math.max(...g)]; };

function render() {
  const u = UI[lang], q = `?lang=${lang}`, nf = (n) => n.toLocaleString(lang);
  document.documentElement.lang = lang;
  document.title = `${u.title} · Skill Graph`;
  document.getElementById('brand').innerHTML = `Skill Graph<i>.</i><small>${esc(u.brand)}</small>`;
  document.getElementById('brand').href = `../${q}`;
  document.getElementById('views').innerHTML = `<a href="../${q}">${esc(u.graph)}</a><a href="../${q}&view=list">${esc(u.list)}</a><a href="../labs/${q}">🧪 ${esc(u.labs)}</a><a class="on" aria-current="page" href="./${q}">📚 ${esc(u.brand)}</a>`;
  document.getElementById('langs').innerHTML = Object.entries(LANGS).map(([k, v]) => `<button data-lang="${k}" class="${k === lang ? 'on' : ''}">${v}</button>`).join('');
  const sorted = [...C].sort((a, b) => u.cn[a].localeCompare(u.cn[b], lang));
  const card = (code, name, doc, who, meta, chips, url, label) => `<div class="card cc"><div class="top"><span class="code">${esc(code)}</span><h3>${esc(name)}</h3></div>
    <p class="doc">${esc(doc)}</p><p class="who">${esc(who)}</p><p class="meta">${meta.map(esc).join(' · ')}</p>${chips}
    <a class="open" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a></div>`;
  const cards = sorted.map((c) => {
    const [a, b] = gradesOf(c), cur = school.curricula[c];
    const chips = `<div class="gr"><span>${esc(u.showGrade)}</span>${[...(cur.grades ?? [])].map((g) => `<a href="../${q}&school=${c}-${g}&view=list">${esc(u.g(g))}</a>`).join('')}</div>`;
    return card(c.toUpperCase(), u.cn[c], cur.name, u.who[c] ?? '', [u.grades(a, b), u.items(nf(items[c])), u.linked(nf(linked[c]))], chips, cur.url, u.openDoc);
  }).join('');
  const ibCard = card('IB', u.ibName, IB_DOC, u.ibWho, [u.linked(nf(ib))], '', IB_URL, u.openIb);
  document.getElementById('main').innerHTML = `<h1>${esc(u.title)}<i>.</i></h1><p class="lead">${esc(u.lead(C.length))}</p>
    <div class="stats"><div class="card st"><b>${nf(C.length)}</b><span>${esc(u.stCountries(C.length))}</span></div>
      <div class="card st"><b>${nf(school.items.length)}</b><span>${esc(u.stItems(school.items.length))}</span></div>
      <div class="card st"><b>${nf(covered)}</b><span>${esc(u.stCovered(covered, nf(total)))}</span></div></div>
    <div class="card box"><h2>${esc(u.whyH)}</h2><ul>${u.why.map((x) => `<li>${x}</li>`).join('')}</ul>
      <p class="src">${esc(u.srcH)} <a href="${PISA}" target="_blank" rel="noopener">OECD PISA 2022 Results (Volume I)</a> · <a href="${TIMSS}" target="_blank" rel="noopener">IEA TIMSS 2023 International Results</a></p></div>
    <div class="card box"><h2>${esc(u.howH)}</h2><p>${esc(u.how)}</p></div>
    <h2 class="sj">${esc(u.listH)}</h2>
    <div class="grid">${cards}${ibCard}</div>
    <p class="none">${esc(u.none(nf(none)))} <a href="${MARBLE}" target="_blank" rel="noopener">${esc(u.marble)}</a></p>
    <div class="add"><b>${esc(u.addH)}</b><a href="${CONTRIB}" target="_blank" rel="noopener">${esc(u.addLink)}</a></div>`;
  history.replaceState(null, '', q);
}
document.getElementById('langs').addEventListener('click', (ev) => {
  const k = ev.target.closest('button')?.dataset.lang; if (!k) return;
  lang = k; render();
});
render();
</script>
</body>
</html>
