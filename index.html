<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Graph</title>
<meta name="description" content="Browse the Marble Skill Taxonomy by age, grade and subject, follow prerequisite chains and track a child's progress. English, Russian and Hungarian.">
<style>
  :root {
    --bg: #0b0d12; --panel: rgba(20, 23, 31, 0.96); --solid: #14171f; --text: #e8eaf0; --muted: #9aa1b2;
    --border: #2a2f3c; --accent: #f5c84c; --chip: #1c2030; --ok: #3fcf8e; --wip: #f5c84c;
    --side: 300px; --top: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .muted { color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

  /* top bar */
  .bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: flex-start;
    z-index: 5; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #title { padding: 8px 12px; white-space: nowrap; }
  #title b { font-size: 15px; }
  #title span { color: var(--muted); font-size: 12px; display: block; }
  #filtersBtn { display: none; }
  .btn { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px;
    cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: #3b4254; }
  #searchWrap { position: relative; flex: 1 1 200px; max-width: 420px; }
  #search { width: 100%; padding: 9px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  #results { position: absolute; top: 42px; left: 0; right: 0; max-height: 60vh; overflow: auto; display: none; }
  #results div { padding: 7px 12px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
  #results div:hover, #results div.on { background: var(--chip); }
  #results .dot { margin-top: 5px; }
  #results small { color: var(--muted); display: block; }
  .seg { display: flex; padding: 3px; }
  .seg button { background: none; border: 0; color: var(--muted); padding: 6px 10px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: var(--chip); color: var(--text); }

  /* filters sidebar */
  #side { position: fixed; top: var(--top); left: 12px; bottom: 12px; width: var(--side); overflow: auto;
    padding: 12px 14px; z-index: 4; }
  #side h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
  #side h3:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chips button { background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 3px 9px;
    cursor: pointer; font-size: 12px; }
  .chips button.on { border-color: var(--accent); color: var(--accent); }
  .ages { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  select, .input { background: var(--chip); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; }
  .input { width: 100%; }
  .subj { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .subj label { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; min-width: 0; }
  .subj label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .subj label .n { color: var(--muted); font-size: 12px; flex: none; }
  .subj .more { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 4px; width: 22px; }
  .doms { margin: 0 0 6px 26px; display: none; }
  .doms.open { display: block; }
  .doms label { display: flex; gap: 6px; font-size: 12px; padding: 2px 0; cursor: pointer; }
  .doms .n { color: var(--muted); margin-left: auto; }
  .links { font-size: 12px; margin-top: 4px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
  #side .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  #side footer { color: var(--muted); font-size: 11px; margin-top: 16px; }
  #side footer a { color: var(--muted); }
  input[type=checkbox] { accent-color: var(--accent); margin: 0; }
  #sideDone { display: none; position: sticky; bottom: 0; width: 100%; margin-top: 12px; background: var(--accent); color: #111; border: 0; }

  /* list view */
  #list { position: fixed; top: var(--top); left: calc(var(--side) + 24px); right: 12px; bottom: 0; overflow: auto;
    padding: 0 4px 24px; z-index: 3; }
  body.has-panel #list { right: 436px; }
  #listHead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 4px 0 10px; color: var(--muted); }
  #listHead b { color: var(--text); }
  #listHead select { margin-left: auto; }
  .group { margin-bottom: 18px; }
  .group > h2 { font-size: 16px; display: flex; align-items: center; gap: 8px; margin: 6px 0 8px; }
  .group > h2 .n { color: var(--muted); font-weight: 400; font-size: 13px; }
  details.dom { background: var(--solid); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; }
  details.dom > summary { list-style: none; cursor: pointer; padding: 9px 12px; display: flex; gap: 8px; align-items: baseline; }
  details.dom > summary::-webkit-details-marker { display: none; }
  details.dom > summary::before { content: '▸'; color: var(--muted); }
  details.dom[open] > summary::before { content: '▾'; }
  details.dom > summary .n { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .cluster { margin: 0 12px 8px; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--chip);
    border-radius: 0 8px 8px 0; color: #cfd3dd; font-size: 13px; }
  ul.topics { list-style: none; margin: 0; padding: 0 6px 6px; }
  ul.topics li { display: flex; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; align-items: flex-start; }
  ul.topics li:hover, ul.topics li.sel { background: var(--chip); }
  ul.topics .txt { flex: 1; min-width: 0; }
  ul.topics .d { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .age { font-size: 11px; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  ul.topics li:hover .age { background: var(--bg); }
  .key { color: var(--accent); font-size: 11px; }
  .st { width: 16px; flex: none; text-align: center; font-weight: 700; }
  .st.known { color: var(--ok); }
  .st.learning { color: var(--wip); }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }

  /* graph view */
  #graph { position: fixed; inset: 0; display: none; }
  body.view-graph #graph { display: block; }
  body.view-graph #list { display: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); z-index: 1; }

  /* topic panel */
  #panel { position: fixed; top: var(--top); right: 12px; width: 412px; max-width: calc(100vw - 24px); bottom: 12px;
    overflow: auto; padding: 14px 16px; display: none; z-index: 6; }
  body.has-panel #panel { display: block; }
  #panel .tools { display: flex; gap: 6px; margin: -4px 30px 6px 0; }
  #panel .crumbs { font-size: 12px; color: var(--muted); margin-right: 26px; }
  #panel h2 { font-size: 18px; margin: 4px 24px 4px 0; }
  #panel .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  #panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
  #panel ul { margin: 0; padding-left: 0; list-style: none; }
  #panel ul.bul { padding-left: 18px; list-style: disc; }
  #panel li { margin: 3px 0; }
  #panel .rel { display: flex; gap: 6px; }
  #panel .prompt { background: var(--chip); border-radius: 8px; padding: 8px 10px; font-style: italic; }
  #panel .link { color: var(--accent); cursor: pointer; }
  #panel .why { color: var(--muted); font-size: 12px; }
  #panel details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin: 12px 0 6px; }
  .status { display: flex; gap: 4px; margin: 8px 0; }
  .status button { flex: 1; background: var(--chip); border: 1px solid transparent; border-radius: 8px; padding: 6px 4px;
    cursor: pointer; font-size: 12px; }
  .status button.on[data-s=known] { border-color: var(--ok); color: var(--ok); }
  .status button.on[data-s=learning] { border-color: var(--wip); color: var(--wip); }
  .status button.on[data-s=none] { border-color: var(--muted); }
  .crumb { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline dotted; font-size: 12px; }
  #close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }

  @media (max-width: 1100px) { body.has-panel #list { right: 12px; } }
  @media (max-width: 760px) {
    :root { --top: 112px; }
    .bar { flex-wrap: wrap; gap: 6px; }
    .seg button, .btn { padding: 5px 7px; font-size: 13px; }
    .seg { padding: 2px; }
    #title { display: none; }
    #filtersBtn { display: block; }
    #searchWrap { order: 5; flex-basis: 100%; max-width: none; }
    #side { display: none; right: 12px; width: auto; z-index: 7; }
    body.side-open #side { display: block; }
    #sideDone { display: block; }
    #list { left: 12px; right: 12px !important; }
    #panel { top: auto; height: 72vh; width: auto; left: 12px; }
  }
</style>
</head>
<body>
<div id="graph"></div>
<div id="loading">Loading…</div>
<div class="bar">
  <button id="filtersBtn" class="btn"></button>
  <div id="title" class="card"><b>Skill Graph</b><span id="subtitle"></span></div>
  <div id="searchWrap"><input id="search" autocomplete="off" type="search"><div id="results" class="card"></div></div>
  <div id="views" class="card seg"></div>
  <div id="langs" class="card seg"></div>
</div>
<aside id="side" class="card"></aside>
<main id="list"></main>
<div id="panel" class="card"><button id="close" aria-label="Close">×</button><div id="panelBody"></div></div>

<script>
// Data lives next to this page: data/*.json (EN) and data/i18n/<lang>/*.json.
const LANGS = { en: 'EN', ru: 'RU', hu: 'HU' };
const GRAPH_JS = 'https://cdn.jsdelivr.net/npm/3d-force-graph@1.77.0/dist/3d-force-graph.min.js';
const ruPlural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many;
};
const UI = {
  en: { search: 'Search topics…', sub: (n, e) => `${n} topics · ${e} prerequisites`, list: 'List', graph: '3D graph',
        filters: 'Filters', grade: 'Or pick a school grade (approx.: grade 1 ≈ age 6–7)', pre: 'Pre-K', gr: (g) => `${g}`, age: 'Age',
        ageOpt: (a) => `${a}`, from: 'from', to: 'to', subjects: 'Subjects', all: 'all', none: 'none',
        progress: 'Progress', st: { all: 'All', next: 'Ready to learn', learning: 'Learning', known: 'Known' },
        nextHint: 'Mark topics your child already knows: “Ready to learn” then shows topics whose required prerequisites are all known.',
        name: 'Child’s name (for quick checks)', reset: 'Reset filters',
        shown: (n) => `<b>${n}</b> topics`, sortAge: 'By age', sortKey: 'Key topics first', empty: 'No topics match these filters.',
        key: 'key topic', prereq: 'Requires', unlocks: 'Unlocks', evidence: 'Evidence of mastery', check: 'Quick check',
        child: 'your child', path: (n, k) => `Full learning path: ${n} topics, ${k} known`, back: '← Back',
        mark: { none: 'Not yet', learning: 'Learning', known: 'Knows it' }, markAll: 'Mark it and its whole path as known',
        onlyChain: 'Show only this chain', allNodes: 'Show all topics', hard: 'required', soft: 'helpful',
        hint3d: 'Height = age · click a topic to trace its prerequisites',
        known: (n) => `${n} known`, done: (n) => `Show ${n} topics` },
  ru: { search: 'Поиск по темам…', sub: (n, e) => `${n} ${ruPlural(n, 'тема', 'темы', 'тем')} · ${e} ${ruPlural(e, 'связь', 'связи', 'связей')}`,
        list: 'Список', graph: '3D-граф', filters: 'Фильтры', grade: 'Или класс (примерно: 1 класс ≈ 6–7 лет)', pre: 'Дошк.',
        gr: (g) => `${g} кл.`, age: 'Возраст', ageOpt: (a) => `${a} ${ruPlural(a, 'год', 'года', 'лет')}`, from: 'от', to: 'до',
        subjects: 'Предметы', all: 'все', none: 'ни одного',
        progress: 'Прогресс', st: { all: 'Все', next: 'Можно изучать', learning: 'Изучаем', known: 'Знает' },
        nextHint: 'Отмечайте в карточке темы, что ребёнок уже знает. «Можно изучать» покажет темы, для которых все обязательные пререквизиты освоены.',
        name: 'Имя ребёнка (для проверочных вопросов)', reset: 'Сбросить фильтры',
        shown: (n) => `<b>${n}</b> ${ruPlural(n, 'тема', 'темы', 'тем')}`, sortAge: 'По возрасту', sortKey: 'Сначала ключевые',
        empty: 'Под эти фильтры тем нет.', key: 'ключевая тема', prereq: 'Нужно знать', unlocks: 'Открывает',
        evidence: 'Признаки освоения', check: 'Быстрая проверка', child: 'ребёнок',
        path: (n, k) => `Весь путь к теме: ${n} ${ruPlural(n, 'тема', 'темы', 'тем')}, освоено ${k}`, back: '← Назад',
        mark: { none: 'Пока нет', learning: 'Изучаем', known: 'Знает' }, markAll: 'Отметить тему и весь путь к ней как освоенные',
        onlyChain: 'Показать только эту цепочку', allNodes: 'Показать все темы', hard: 'обязательно', soft: 'желательно',
        hint3d: 'Высота = возраст · клик по теме подсвечивает цепочку пререквизитов',
        known: (n) => `освоено ${n}`, done: (n) => `Показать ${n} ${ruPlural(n, 'тему', 'темы', 'тем')}` },
  hu: { search: 'Témák keresése…', sub: (n, e) => `${n} téma · ${e} előfeltétel`, list: 'Lista', graph: '3D gráf',
        filters: 'Szűrők', grade: 'Vagy osztály (kb.: 1. osztály ≈ 6–7 év)', pre: 'Óvoda', gr: (g) => `${g}. o.`, age: 'Életkor',
        ageOpt: (a) => `${a} év`, from: 'tól', to: 'ig', subjects: 'Tantárgyak', all: 'mind', none: 'egyik sem',
        progress: 'Haladás', st: { all: 'Mind', next: 'Tanulható', learning: 'Tanulja', known: 'Tudja' },
        nextHint: 'Jelöld a témakártyán, mit tud már a gyerek. A „Tanulható” azokat a témákat mutatja, amelyek kötelező előfeltételei mind megvannak.',
        name: 'A gyerek neve (a gyors ellenőrzéshez)', reset: 'Szűrők törlése',
        shown: (n) => `<b>${n}</b> téma`, sortAge: 'Életkor szerint', sortKey: 'Kulcstémák elöl', empty: 'Nincs a szűrőknek megfelelő téma.',
        key: 'kulcstéma', prereq: 'Előfeltételek', unlocks: 'Erre épül', evidence: 'Az elsajátítás jelei', check: 'Gyors ellenőrzés',
        child: 'a gyerek', path: (n, k) => `A teljes út ehhez a témához: ${n} téma, ebből ${k} megvan`, back: '← Vissza',
        mark: { none: 'Még nem', learning: 'Tanulja', known: 'Tudja' }, markAll: 'Megjelölés tudottként a teljes úttal együtt',
        onlyChain: 'Csak ez a lánc', allNodes: 'Minden téma', hard: 'kötelező', soft: 'ajánlott',
        hint3d: 'Magasság = életkor · kattints egy témára az előfeltétel-lánchoz',
        known: (n) => `${n} megvan`, done: (n) => `${n} téma mutatása` },
};
const COLORS = {
  'Mathematics': '#4e9cff', 'Science': '#3fcf8e', 'English': '#f5c84c', 'History': '#e8833a',
  'Personal & Social Development': '#e264a8', 'Life Skills': '#a78bfa', 'Computing': '#38d1d1',
  'Learning to Learn': '#f87171',
};
const SUBJECTS = Object.keys(COLORS);
const AGE_SCALE = 45; // world units per year of age (3D view)
const GRADES = [[0, 4, 5], ...Array.from({ length: 8 }, (_, i) => [i + 1, i + 6, i + 7])]; // [grade, ageFrom, ageTo]

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('skillgraph.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('skillgraph.' + k, JSON.stringify(v)); } catch { /* private mode */ } },
};
const cache = {};
const params = new URLSearchParams(location.search);
let lang = params.get('lang');
if (!LANGS[lang]) lang = 'en';

// --- state -------------------------------------------------------------------
let data, byId, prereqs, dependents, labels, clusters, ageMin = 4, ageMax = 15, keyCut = 1;
let focus = null, chain = new Set(), chainOnly = false, back = [];
const saved = store.get('filters', {});
const f = {
  view: params.get('view') === '3d' ? 'graph' : (params.get('view') ?? saved.view ?? 'list') === 'graph' ? 'graph' : 'list',
  ageFrom: null, ageTo: null,
  offSubj: new Set(saved.offSubj ?? []), offDom: new Set(saved.offDom ?? []),
  status: saved.status ?? 'all', sort: saved.sort ?? 'age',
};
{
  const a = (params.get('age') ?? '').match(/^(\d+)-(\d+)$/);
  if (a) [f.ageFrom, f.ageTo] = [+a[1], +a[2]];
  else if (saved.ageFrom) [f.ageFrom, f.ageTo] = [saved.ageFrom, saved.ageTo];
  if (params.has('off')) f.offSubj = new Set(params.get('off').split(',').filter((s) => COLORS[s]));
}
let progress = store.get('progress', {}); // topicId -> 'known' | 'learning'
let childName = store.get('name', '');
const openDoms = new Set();
let visible = new Set();

async function loadLang(l) {
  if (cache[l]) return cache[l];
  const base = l === 'en' ? 'data/' : `data/i18n/${l}/`;
  const get = (fl) => fetch(base + fl).then((r) => { if (!r.ok) throw new Error(`${base + fl}: ${r.status}`); return r.json(); });
  const [topics, deps, cl, lab] = await Promise.all([
    get('topics.json'), get('dependencies.json'), get('clusters.json').catch(() => ({ clusters: [] })),
    l === 'en' ? Promise.resolve(null) : get('labels.json'),
  ]);
  return (cache[l] = { topics: topics.topics, deps: deps.dependencies, clusters: cl.clusters, labels: lab });
}

function index(d) {
  byId = new Map(d.topics.map((t) => [t.id, t]));
  prereqs = new Map(); dependents = new Map();
  for (const e of d.deps) {
    (prereqs.get(e.topicId) ?? prereqs.set(e.topicId, []).get(e.topicId)).push(e);
    (dependents.get(e.prerequisiteId) ?? dependents.set(e.prerequisiteId, []).get(e.prerequisiteId)).push(e);
  }
  labels = d.labels ?? { subjects: {}, domains: {} };
  clusters = new Map();
  for (const c of d.clusters) {
    const k = c.subject + '|' + c.domain;
    (clusters.get(k) ?? clusters.set(k, []).get(k)).push(c);
  }
  ageMin = Math.min(...d.topics.map((t) => t.ageRangeStart));
  ageMax = Math.max(...d.topics.map((t) => t.ageRangeEnd));
  const cs = d.topics.map((t) => t.centrality ?? 0).sort((a, b) => b - a);
  keyCut = cs[Math.floor(cs.length * 0.1)]; // top 10% by centrality = "key topic"
  if (f.ageFrom == null || f.ageFrom < ageMin || f.ageTo > ageMax || f.ageFrom > f.ageTo) [f.ageFrom, f.ageTo] = [ageMin, ageMax];
}
const subj = (s) => labels.subjects[s] ?? s;
const dom = (s) => labels.domains[s] ?? s;
const isKey = (t) => (t.centrality ?? 0) >= keyCut;
const domKey = (t) => t.subject + '|' + t.domain;

function ancestors(id) {
  const seen = new Set([id]), stack = [id];
  while (stack.length) for (const e of prereqs.get(stack.pop()) ?? []) {
    if (!seen.has(e.prerequisiteId)) { seen.add(e.prerequisiteId); stack.push(e.prerequisiteId); }
  }
  return seen;
}
const ready = (t) => progress[t.id] !== 'known' &&
  (prereqs.get(t.id) ?? []).every((e) => e.strength !== 'hard' || progress[e.prerequisiteId] === 'known');

// topic passes everything except the status filter (used for sidebar counts)
const passBase = (t) => !f.offSubj.has(t.subject) && !f.offDom.has(domKey(t)) &&
  t.ageRangeStart <= f.ageTo && t.ageRangeEnd >= f.ageFrom;
const passStatus = (t) => f.status === 'all' ? true : f.status === 'next' ? ready(t) : progress[t.id] === f.status;

function applyFilters() {
  visible = new Set();
  for (const t of byId.values()) if (passBase(t) && passStatus(t)) visible.add(t.id);
  store.set('filters', { view: f.view, ageFrom: f.ageFrom, ageTo: f.ageTo, offSubj: [...f.offSubj], offDom: [...f.offDom],
    status: f.status, sort: f.sort });
  renderSide(); renderList(); refreshGraph(); setUrl();
}

// --- sidebar -----------------------------------------------------------------
function renderSide() {
  const u = UI[lang];
  const ageOnly = (t) => t.ageRangeStart <= f.ageTo && t.ageRangeEnd >= f.ageFrom;
  const sc = {}, dc = {};
  for (const t of byId.values()) {
    if (!ageOnly(t)) continue;
    sc[t.subject] = (sc[t.subject] ?? 0) + (f.offDom.has(domKey(t)) ? 0 : 1);
    dc[domKey(t)] = (dc[domKey(t)] ?? 0) + 1;
  }
  const domsOf = {};
  for (const t of byId.values()) (domsOf[t.subject] ??= new Set()).add(t.domain);
  const ages = []; for (let a = ageMin; a <= ageMax; a++) ages.push(a);
  const opt = (sel) => ages.map((a) => `<option value="${a}"${a === sel ? ' selected' : ''}>${u.ageOpt(a)}</option>`).join('');
  const known = Object.values(progress).filter((s) => s === 'known').length;
  const scroll = $('side').scrollTop;
  $('side').innerHTML = `
    <h3>${u.age}</h3>
    <div class="ages" style="margin-top:0"><select id="ageFrom" aria-label="${u.from}">${opt(f.ageFrom)}</select> –
      <select id="ageTo" aria-label="${u.to}">${opt(f.ageTo)}</select></div>
    <div class="hint">${u.grade}</div>
    <div class="chips" id="grades" style="margin-top:4px">${GRADES.map(([g, a, b]) =>
      `<button data-a="${a}" data-b="${b}" class="${f.ageFrom === a && f.ageTo === b ? 'on' : ''}">${g ? u.gr(g) : u.pre}</button>`).join('')}</div>
    <h3>${u.progress} <span style="text-transform:none;letter-spacing:0">· ${u.known(known)}</span></h3>
    <div class="chips" id="status">${Object.entries(u.st).map(([k, v]) =>
      `<button data-s="${k}" class="${f.status === k ? 'on' : ''}">${v}</button>`).join('')}</div>
    ${f.status === 'next' && !known ? `<div class="hint">${u.nextHint}</div>` : ''}
    <h3>${u.subjects}</h3>
    ${SUBJECTS.filter((s) => domsOf[s]).map((s) => `
      <div class="subj">
        <label><input type="checkbox" data-subj="${esc(s)}" ${f.offSubj.has(s) ? '' : 'checked'}>
          <i class="dot" style="background:${COLORS[s]}"></i><span>${esc(subj(s))}</span><span class="n">${sc[s] ?? 0}</span></label>
        <button class="more" data-more="${esc(s)}" aria-label="+">${openDoms.has('side:' + s) ? '▾' : '▸'}</button>
      </div>
      <div class="doms ${openDoms.has('side:' + s) ? 'open' : ''}">
        ${[...domsOf[s]].sort((a, b) => dom(a).localeCompare(dom(b))).map((d) => `
          <label><input type="checkbox" data-dom="${esc(s + '|' + d)}" ${f.offDom.has(s + '|' + d) ? '' : 'checked'}
            ${f.offSubj.has(s) ? 'disabled' : ''}> ${esc(dom(d))} <span class="n">${dc[s + '|' + d] ?? 0}</span></label>`).join('')}
      </div>`).join('')}
    <div class="links"><button class="linkbtn" id="subjAll">${u.all}</button> · <button class="linkbtn" id="subjNone">${u.none}</button></div>
    <h3>${u.name}</h3>
    <input id="childName" class="input" value="${esc(childName)}" maxlength="40">
    <div style="margin-top:14px"><button class="btn" id="reset" style="width:100%">${u.reset}</button></div>
    <button class="btn" id="sideDone">${u.done(visible.size)}</button>
    <footer>Marble Skill Taxonomy · CC BY-SA 4.0 · <a href="https://github.com/samvelkoch/skill-graph">GitHub</a></footer>`;
  $('side').scrollTop = scroll;
}

$('side').addEventListener('click', (ev) => {
  const g = ev.target.closest('#grades button');
  if (g) { const a = +g.dataset.a, b = +g.dataset.b;
    [f.ageFrom, f.ageTo] = f.ageFrom === a && f.ageTo === b ? [ageMin, ageMax] : [a, b]; return applyFilters(); }
  const s = ev.target.closest('#status button');
  if (s) { f.status = s.dataset.s; return applyFilters(); }
  const m = ev.target.closest('[data-more]');
  if (m) { const k = 'side:' + m.dataset.more; openDoms.has(k) ? openDoms.delete(k) : openDoms.add(k); return renderSide(); }
  if (ev.target.id === 'sideDone') return document.body.classList.remove('side-open');
  if (ev.target.id === 'subjAll') { f.offSubj.clear(); f.offDom.clear(); return applyFilters(); }
  if (ev.target.id === 'subjNone') { SUBJECTS.forEach((x) => f.offSubj.add(x)); return applyFilters(); }
  if (ev.target.id === 'reset') {
    [f.ageFrom, f.ageTo] = [ageMin, ageMax]; f.offSubj.clear(); f.offDom.clear(); f.status = 'all'; return applyFilters();
  }
});
$('side').addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.id === 'ageFrom' || el.id === 'ageTo') {
    f[el.id] = +el.value;
    if (f.ageFrom > f.ageTo) el.id === 'ageFrom' ? (f.ageTo = f.ageFrom) : (f.ageFrom = f.ageTo);
    return applyFilters();
  }
  if (el.dataset.subj) { el.checked ? f.offSubj.delete(el.dataset.subj) : f.offSubj.add(el.dataset.subj); return applyFilters(); }
  if (el.dataset.dom) { el.checked ? f.offDom.delete(el.dataset.dom) : f.offDom.add(el.dataset.dom); return applyFilters(); }
});
$('side').addEventListener('input', (ev) => {
  if (ev.target.id !== 'childName') return;
  childName = ev.target.value.trim(); store.set('name', childName);
  if (focus) renderPanel();
});

// --- list view ---------------------------------------------------------------
function clusterFor(s, d) {
  // the parent summary written for the age band closest to the selected one
  const cs = clusters.get(s + '|' + d);
  if (!cs?.length) return null;
  const inside = cs.filter((c) => c.ageRangeStart >= f.ageFrom && c.ageRangeStart <= f.ageTo);
  if (inside.length) return inside.sort((a, b) => a.ageRangeStart - b.ageRangeStart)[0];
  return cs.reduce((best, c) => Math.abs(c.ageRangeStart - f.ageFrom) < Math.abs(best.ageRangeStart - f.ageFrom) ? c : best);
}
const stIcon = (id) => progress[id] === 'known' ? '<span class="st known">✓</span>'
  : progress[id] === 'learning' ? '<span class="st learning">●</span>' : '<span class="st"></span>';

function renderList() {
  if (f.view !== 'list') return;
  const u = UI[lang];
  const groups = new Map();
  for (const id of visible) {
    const t = byId.get(id);
    if (!groups.has(t.subject)) groups.set(t.subject, new Map());
    const g = groups.get(t.subject);
    (g.get(t.domain) ?? g.set(t.domain, []).get(t.domain)).push(t);
  }
  const cmp = f.sort === 'key'
    ? (a, b) => (b.centrality ?? 0) - (a.centrality ?? 0)
    : (a, b) => a.ageRangeStart - b.ageRangeStart || a.ageRangeEnd - b.ageRangeEnd || (b.centrality ?? 0) - (a.centrality ?? 0);
  const openAll = visible.size <= 40;
  let html = `<div id="listHead">${u.shown(visible.size)} · ${u.age.toLowerCase()} ${f.ageFrom}–${f.ageTo}
    <select id="sort"><option value="age">${u.sortAge}</option><option value="key"${f.sort === 'key' ? ' selected' : ''}>${u.sortKey}</option></select></div>`;
  if (!visible.size) html += `<div class="empty">${u.empty}</div>`;
  for (const s of SUBJECTS) {
    const g = groups.get(s);
    if (!g) continue;
    const n = [...g.values()].reduce((a, x) => a + x.length, 0);
    html += `<section class="group"><h2><i class="dot" style="background:${COLORS[s]}"></i>${esc(subj(s))} <span class="n">${n}</span></h2>`;
    for (const d of [...g.keys()].sort((a, b) => dom(a).localeCompare(dom(b)))) {
      const ts = g.get(d).sort(cmp), k = s + '|' + d, c = clusterFor(s, d);
      const lo = Math.min(...ts.map((t) => t.ageRangeStart)), hi = Math.max(...ts.map((t) => t.ageRangeEnd));
      const kn = ts.filter((t) => progress[t.id] === 'known').length;
      html += `<details class="dom" data-k="${esc(k)}"${openAll || openDoms.has(k) ? ' open' : ''}>
        <summary><span>${esc(dom(d))}</span><span class="n">${kn ? `✓ ${kn}/` : ''}${ts.length} · ${lo}–${hi}</span></summary>
        ${c ? `<div class="cluster">${esc(c.summary)}</div>` : ''}
        <ul class="topics">${ts.map((t) => `<li data-id="${t.id}" class="${t.id === focus ? 'sel' : ''}">${stIcon(t.id)}
          <div class="txt">${esc(t.name)} ${isKey(t) ? `<span class="key" title="${u.key}">★</span>` : ''}
          <div class="d">${esc(t.description)}</div></div><span class="age">${t.ageRangeStart}–${t.ageRangeEnd}</span></li>`).join('')}</ul>
      </details>`;
    }
    html += '</section>';
  }
  const top = $('list').scrollTop;
  $('list').innerHTML = html;
  $('list').scrollTop = top;
}

$('list').addEventListener('click', (ev) => {
  const li = ev.target.closest('li[data-id]');
  if (li) select(li.dataset.id, true);
});
$('list').addEventListener('toggle', (ev) => {
  const k = ev.target.dataset?.k;
  if (k) ev.target.open ? openDoms.add(k) : openDoms.delete(k);
}, true);
$('list').addEventListener('change', (ev) => {
  if (ev.target.id === 'sort') { f.sort = ev.target.value; applyFilters(); }
});

function showDomain(s, d) {
  f.offSubj.delete(s); f.offDom.delete(s + '|' + d); openDoms.add(s + '|' + d);
  const t = [...byId.values()].filter((x) => x.subject === s && x.domain === d);
  // widen the age filter if the section lies outside it
  const lo = Math.min(...t.map((x) => x.ageRangeStart)), hi = Math.max(...t.map((x) => x.ageRangeEnd));
  if (hi < f.ageFrom || lo > f.ageTo) [f.ageFrom, f.ageTo] = [ageMin, ageMax];
  f.status = 'all';
  setView('list');
  applyFilters();
  document.querySelector(`details.dom[data-k="${CSS.escape(s + '|' + d)}"]`)?.scrollIntoView({ block: 'start' });
}

// --- topic panel -------------------------------------------------------------
function select(id, fly, fromBack) {
  if (!fromBack && focus && id && focus !== id) back.push(focus);
  if (!id) back = [];
  focus = id; chain = id ? ancestors(id) : new Set();
  if (!id) chainOnly = false;
  document.body.classList.toggle('has-panel', !!id);
  if (id) document.body.classList.remove('side-open');
  document.querySelectorAll('ul.topics li.sel').forEach((x) => x.classList.remove('sel'));
  if (id) document.querySelector(`ul.topics li[data-id="${id}"]`)?.classList.add('sel');
  refreshGraph();
  if (id) { renderPanel(); $('panel').scrollTop = 0; if (fly) flyTo(id); }
  setUrl();
}

function renderPanel() {
  const t = byId.get(focus), u = UI[lang];
  const rel = (e, other) => {
    const o = byId.get(other);
    return `<li class="rel">${stIcon(other)}<div><span class="link" data-id="${other}">${esc(o.name)}</span>
      <small class="muted">· ${o.ageRangeStart}–${o.ageRangeEnd} · ${esc(u[e.strength] ?? e.strength)}</small>
      ${e.reason ? `<div class="why">${esc(e.reason)}</div>` : ''}</div></li>`;
  };
  const pre = prereqs.get(focus) ?? [], post = dependents.get(focus) ?? [];
  const path = [...chain].filter((x) => x !== focus).map((x) => byId.get(x))
    .sort((a, b) => a.ageRangeStart - b.ageRangeStart || a.ageRangeEnd - b.ageRangeEnd);
  const pk = path.filter((x) => progress[x.id] === 'known').length;
  const st = progress[focus] ?? 'none';
  const who = childName || u.child;
  $('panelBody').innerHTML = `
    <div class="tools">${back.length ? `<button class="crumb" id="back">${u.back}</button>` : ''}</div>
    <div class="crumbs"><i class="dot" style="background:${COLORS[t.subject]};width:8px;height:8px"></i>
      <button class="crumb" data-s="${esc(t.subject)}" data-d="">${esc(subj(t.subject))}</button> ›
      <button class="crumb" data-s="${esc(t.subject)}" data-d="${esc(t.domain)}">${esc(dom(t.domain))}</button></div>
    <h2>${esc(t.name)}</h2>
    <div class="meta">${u.age} ${t.ageRangeStart}–${t.ageRangeEnd}${isKey(t) ? ` · <span class="key">★ ${u.key}</span>` : ''}</div>
    <div class="status">${['none', 'learning', 'known'].map((s) =>
      `<button data-s="${s}" class="${st === s ? 'on' : ''}">${u.mark[s]}</button>`).join('')}</div>
    ${path.length ? `<button class="linkbtn" id="markAll">${u.markAll}</button>` : ''}
    <p>${esc(t.description)}</p>
    ${t.assessmentPrompt ? `<h3>${u.check}</h3><div class="prompt">${esc(t.assessmentPrompt.replaceAll('{{name}}', who))}</div>` : ''}
    ${t.evidence?.length ? `<h3>${u.evidence}</h3><ul class="bul">${t.evidence.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
    ${pre.length ? `<h3>${u.prereq} (${pre.length})</h3><ul>${pre.map((e) => rel(e, e.prerequisiteId)).join('')}</ul>` : ''}
    ${post.length ? `<h3>${u.unlocks} (${post.length})</h3><ul>${post.map((e) => rel(e, e.topicId)).join('')}</ul>` : ''}
    ${path.length ? `<details><summary>${u.path(path.length, pk)}</summary><ul>${path.map((x) =>
      `<li class="rel">${stIcon(x.id)}<div><span class="link" data-id="${x.id}">${esc(x.name)}</span>
       <small class="muted">· ${esc(subj(x.subject))} · ${x.ageRangeStart}–${x.ageRangeEnd}</small></div></li>`).join('')}</ul></details>` : ''}
    ${f.view === 'graph' && path.length ? `<p><button class="btn" id="chainOnly">${chainOnly ? u.allNodes : u.onlyChain}</button></p>` : ''}`;
}

function setStatus(ids, s) {
  for (const id of ids) s === 'none' ? delete progress[id] : (progress[id] = s);
  store.set('progress', progress);
  applyFilters(); renderPanel();
}

$('panelBody').addEventListener('click', (ev) => {
  const el = ev.target;
  const l = el.closest('.link');
  if (l) return select(l.dataset.id, true);
  if (el.id === 'back') return select(back.pop(), true, true);
  if (el.closest('.status button')) return setStatus([focus], el.closest('button').dataset.s);
  if (el.id === 'markAll') return setStatus([...chain], 'known');
  if (el.id === 'chainOnly') { chainOnly = !chainOnly; refreshGraph(); return renderPanel(); }
  if (el.classList.contains('crumb') && el.dataset.s) {
    if (el.dataset.d) return showDomain(el.dataset.s, el.dataset.d);
    SUBJECTS.forEach((x) => (x === el.dataset.s ? f.offSubj.delete(x) : f.offSubj.add(x)));
    setView('list'); return applyFilters();
  }
});
$('close').onclick = () => select(null);
addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && document.activeElement !== $('search')) select(null); });

// --- 3D graph (loaded on first use) -------------------------------------------
let Graph = null, graphLoading = null;
const nid = (x) => (typeof x === 'object' ? x.id : x);
const shown = (id) => (chainOnly && focus) ? chain.has(id) : visible.has(id) || (focus && chain.has(id));

function ensureGraph() {
  if (Graph) return Promise.resolve();
  return graphLoading ??= new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = GRAPH_JS; s.onload = ok; s.onerror = () => fail(new Error('3d-force-graph'));
    document.head.appendChild(s);
  }).then(() => {
    const onChain = (l) => focus && chain.has(nid(l.source)) && chain.has(nid(l.target));
    Graph = ForceGraph3D()($('graph'))
      .backgroundColor('#0b0d12')
      .nodeId('id')
      .nodeLabel((n) => { const t = byId.get(n.id); return `<b>${esc(t.name)}</b><br>${esc(subj(t.subject))} · ${t.ageRangeStart}–${t.ageRangeEnd}`; })
      .nodeVal((n) => 1 + 6 * (n.centrality ?? 0))
      .nodeColor((n) => {
        if (focus && n.id === focus) return '#ffffff';
        if (focus && !chain.has(n.id)) return 'rgba(120,128,150,0.06)';
        return COLORS[n.subject] ?? '#999';
      })
      .nodeVisibility((n) => shown(n.id))
      .linkVisibility((l) => shown(nid(l.source)) && shown(nid(l.target)))
      .linkColor((l) => (onChain(l) ? '#f5c84c' : 'rgba(150,160,190,0.18)'))
      .linkWidth((l) => (onChain(l) ? 1.2 : 0))
      .linkDirectionalArrowLength((l) => (onChain(l) ? 3 : 0))
      .linkDirectionalArrowRelPos(1)
      .onNodeClick((n) => select(n.id, true))
      .onBackgroundClick(() => select(null));
    const nodes = data.topics.map((t) => ({ id: t.id, subject: t.subject, centrality: t.centrality,
      fy: ((t.ageRangeStart + t.ageRangeEnd) / 2 - 9) * AGE_SCALE }));
    // edge points prerequisite → topic, so arrows read "leads to"
    Graph.graphData({ nodes, links: data.deps.map((e) => ({ source: e.prerequisiteId, target: e.topicId })) });
  });
}

function refreshGraph() {
  if (!Graph || f.view !== 'graph') return;
  Graph.nodeColor(Graph.nodeColor()).nodeVisibility(Graph.nodeVisibility()).linkVisibility(Graph.linkVisibility())
    .linkColor(Graph.linkColor()).linkWidth(Graph.linkWidth()).linkDirectionalArrowLength(Graph.linkDirectionalArrowLength());
}

function flyTo(id) {
  if (!Graph || f.view !== 'graph') return;
  const n = Graph.graphData().nodes.find((x) => x.id === id);
  if (!n || n.x === undefined) return;
  const d = 280, r = 1 + d / Math.hypot(n.x, n.y, n.z || 1);
  Graph.cameraPosition({ x: n.x * r, y: n.y * r, z: n.z * r }, n, 1200);
}

async function setView(v) {
  f.view = v;
  document.body.classList.toggle('view-graph', v === 'graph');
  renderViews();
  if (v === 'graph') {
    $('loading').style.display = 'grid';
    try { await ensureGraph(); } catch (err) { $('loading').textContent = `Failed to load ${err.message}`; return; }
    $('loading').style.display = 'none';
    Graph.width(innerWidth).height(innerHeight).resumeAnimation();
    refreshGraph();
    if (focus) setTimeout(() => flyTo(focus), 300);
  } else {
    Graph?.pauseAnimation();
    renderList();
  }
  if (focus) renderPanel();
  setUrl();
}

// --- search ------------------------------------------------------------------
let hitIdx = 0;
$('search').addEventListener('input', () => {
  const q = $('search').value.trim().toLowerCase(), box = $('results');
  if (q.length < 2) { box.style.display = 'none'; return; }
  const name = [], desc = [];
  for (const t of byId.values()) {
    const n = t.name.toLowerCase();
    if (n.includes(q)) name.push([n.startsWith(q) ? 0 : 1, t]);
    else if (desc.length < 20 && t.description.toLowerCase().includes(q)) desc.push([2, t]);
  }
  const hits = [...name, ...desc].sort((a, b) => a[0] - b[0]).slice(0, 15).map((x) => x[1]);
  hitIdx = 0;
  box.innerHTML = hits.map((t, i) => `<div data-id="${t.id}" class="${i ? '' : 'on'}"><i class="dot" style="background:${COLORS[t.subject]}"></i>
    <span>${esc(t.name)}<small>${esc(subj(t.subject))} · ${esc(dom(t.domain))} · ${t.ageRangeStart}–${t.ageRangeEnd}</small></span></div>`).join('');
  box.style.display = hits.length ? 'block' : 'none';
});
$('search').addEventListener('keydown', (ev) => {
  const items = [...$('results').children];
  if (ev.key === 'Escape') { $('results').style.display = 'none'; return; }
  if (!items.length || $('results').style.display === 'none') return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    items[hitIdx]?.classList.remove('on');
    hitIdx = (hitIdx + (ev.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
    items[hitIdx].classList.add('on'); items[hitIdx].scrollIntoView({ block: 'nearest' });
  } else if (ev.key === 'Enter') pick(items[hitIdx].dataset.id);
});
const pick = (id) => { $('results').style.display = 'none'; $('search').value = ''; $('search').blur(); select(id, true); };
$('results').addEventListener('click', (ev) => { const el = ev.target.closest('[data-id]'); if (el) pick(el.dataset.id); });
document.addEventListener('click', (ev) => { if (!ev.target.closest('#searchWrap')) $('results').style.display = 'none'; });

// --- chrome ------------------------------------------------------------------
function setUrl() {
  const p = new URLSearchParams();
  if (lang !== 'en') p.set('lang', lang);
  if (f.view === 'graph') p.set('view', '3d');
  if (byId && (f.ageFrom !== ageMin || f.ageTo !== ageMax)) p.set('age', `${f.ageFrom}-${f.ageTo}`);
  if (f.offSubj.size) p.set('off', [...f.offSubj].join(','));
  if (focus) p.set('topic', focus);
  history.replaceState(null, '', p.toString() ? `?${p}` : location.pathname);
}

function renderViews() {
  const u = UI[lang];
  $('views').innerHTML = ['list', 'graph'].map((v) => `<button data-v="${v}" class="${f.view === v ? 'on' : ''}">${u[v]}</button>`).join('');
}

function renderChrome() {
  const u = UI[lang];
  document.documentElement.lang = lang;
  $('search').placeholder = u.search;
  $('subtitle').textContent = u.sub(data.topics.length, data.deps.length);
  $('filtersBtn').textContent = '☰ ' + u.filters;
  $('langs').innerHTML = Object.entries(LANGS)
    .map(([k, v]) => `<button data-lang="${k}" class="${k === lang ? 'on' : ''}">${v}</button>`).join('');
  renderViews();
}

$('views').addEventListener('click', (ev) => { const v = ev.target.dataset?.v; if (v && v !== f.view) setView(v); });
$('langs').addEventListener('click', async (ev) => {
  const k = ev.target.dataset?.lang;
  if (!k || k === lang) return;
  lang = k;
  await setLang();
});
$('filtersBtn').onclick = () => document.body.classList.toggle('side-open');

async function setLang() {
  try {
    data = await loadLang(lang);
  } catch (err) {
    $('loading').textContent = `Failed to load data (${err.message})`;
    return;
  }
  index(data);
  renderChrome();
  if (f.view === 'list') $('loading').style.display = 'none';
  applyFilters();
  if (focus) renderPanel();
}

(async () => {
  await setLang();
  const t = params.get('topic');
  if (t && byId.has(t)) focus = t;
  await setView(f.view);
  if (focus) { const id = focus; focus = null; select(id, false); if (f.view === 'graph') setTimeout(() => flyTo(id), 2500); }
})();
addEventListener('resize', () => Graph?.width(innerWidth).height(innerHeight));
</script>
