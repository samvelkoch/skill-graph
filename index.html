<style>
  /* Look and feel follows withmarble.com/curriculum: tokens, type scale, panels and card are taken from its CSS.
     Merel (Marble's UI face) is not freely licensed, so Nunito stands in: also rounded, with Cyrillic and Hungarian glyphs. */
  :root {
    --bg: #0A0C14; --panel: rgba(14, 17, 28, .78); --stroke: rgba(130, 145, 190, .16); --stroke2: rgba(130, 145, 190, .35);
    --hover: rgba(130, 145, 190, .10); --ink: #EDEFF7; --soft: #D3D9E8; --body: #C6CDE0; --mut: #98A0B8; --faint: #646C84;
    --red: #FF3B30; --ok: #3ddc97; --wip: #f5c84c;
    --serif: 'EB Garamond', Georgia, serif; --sans: 'Nunito', ui-rounded, ui-sans-serif, system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --side: 290px; --top: 76px; --gl: 0px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--ink);
    font: 500 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  html { background: var(--bg); }
  /* the map never scrolls the page; in the list the document itself scrolls (pull-to-refresh, hiding address bar) */
  body.view-graph { overflow: hidden; }
  body.view-list { height: auto; min-height: 100%; }
  /* the glow is a fixed layer: it neither repeats nor scrolls with long lists */
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(110% 85% at 50% 115%, rgba(45, 60, 120, .22), transparent 55%); }
  /* rows fade out under the top bar */
  body.view-list::after { content: ''; position: fixed; left: 0; right: 0; top: 0; height: var(--top); z-index: 7; pointer-events: none;
    background: linear-gradient(var(--bg) 78%, rgba(10, 12, 20, 0)); }
  button, input, select { font: inherit; color: inherit; }
  b, strong { font-weight: 700; }
  .card { background: var(--panel); border: 1px solid var(--stroke); border-radius: 20px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .muted { color: var(--mut); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .eyebrow { display: flex; align-items: center; gap: 8px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--mut); font-weight: 600; }
  .eyebrow .dot { width: 9px; height: 9px; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* top bar: logo left, controls right */
  .bar { position: fixed; top: 22px; left: 30px; right: 26px; display: flex; gap: 10px; align-items: center;
    z-index: 8; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #brand { font: 900 27px/1 var(--sans); letter-spacing: -.035em; text-transform: uppercase; margin-right: auto;
    background: none; border: 0; padding: 0; cursor: pointer; color: #fff; }
  #brand i { font-style: normal; color: var(--red); }
  #filtersBtn { display: none; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--stroke2);

    white-space: nowrap; transition: background .15s, border-color .15s; }
  .btn:hover { background: rgba(130, 145, 190, .18); border-color: rgba(130, 145, 190, .6); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary:hover { background: #fff; }
  a.btn { text-decoration: none; }

  .btn.ghost:hover { color: var(--ink); }

  .seg { display: flex; padding: 3px; border-radius: 999px; }

    padding: 10px 14px; font-size: 13px; color: var(--soft); z-index: 9; cursor: pointer; }

  /* map view: headline, legend, hint */

  #hero .cta { pointer-events: auto; }
  body.view-graph #hero { display: block; }
  #hero h1 { font: 500 clamp(56px, 6.2vw, 96px)/1.04 var(--serif); letter-spacing: .002em; margin: 0 0 16px; color: #fff; text-wrap: balance; }

  #legend { position: fixed; left: 30px; bottom: 24px; padding: 12px 13px; z-index: 4; display: none; max-height: 46vh; overflow-y: auto; }
  body.view-graph #legend { display: block; }
  #legend .lg-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); margin: 1px 4px 6px; font-weight: 600; }
  #legend .lg-title .linkbtn { text-transform: none; letter-spacing: normal; }
  #legend .row { display: flex; align-items: center; gap: 9px; padding: 3.5px 7px; border-radius: 8px; cursor: pointer; min-width: 236px;
    width: 100%; background: none; border: 0; text-align: left; transition: background .15s, opacity .15s; }
  #legend .row:hover { background: var(--hover); }
  #lgToggle { display: none; }
  #legend .row.off { opacity: .32; }
  #legend.pick .row:not(.off) { box-shadow: inset 0 0 0 1px var(--c); background: var(--hover); }
  #legend #lgLabs { min-width: 0; margin-bottom: 8px; border: 1px solid var(--stroke); }
  #legend #lgLabs.off { opacity: .8; }
  #legend #lgLabs:not(.off) { background: rgba(255, 59, 48, .14); box-shadow: inset 0 0 0 1px var(--red); }
  #legend .row span:first-of-type { flex: 1; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #legend .row .n { font: 11.5px var(--mono); color: var(--mut); }
  #legend .foot { display: flex; align-items: center; gap: 6px; margin: 8px 4px 0; padding-top: 9px; border-top: 1px solid var(--stroke);
    font-size: 12px; color: var(--mut); }
  #legend .foot select { padding: 1px 3px; font: 11.5px var(--mono); }
  #legend .foot .linkbtn { margin-left: auto; }
  #hint { position: fixed; bottom: 26px; right: 26px; z-index: 2; font-size: 11.5px; color: var(--faint); text-align: right;

  #hint b { color: var(--mut); font-weight: 600; }
  body.view-graph:not(.has-panel) #hint { display: block; }

  /* filters sidebar (always shown in the list; a drawer over the map) */
  #side { position: fixed; top: var(--top); left: 30px; bottom: 16px; width: var(--side); overflow: auto; overscroll-behavior: contain; padding: 16px 16px; z-index: 4; }
  body.view-graph #side { display: none; z-index: 7; }
  body.view-graph.side-open #side { display: block; }
  /* over the map the drawer is a layer of its own: opaque, and the headline and legend underneath step aside */

  .linkbtn:hover { color: #fff; text-decoration-color: var(--mut); }

  /* list view */

  body.has-panel #list { margin-right: 470px; }
  #list .group, #list details.dom { scroll-margin-top: calc(var(--top) + 10px); }
  #listHead { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; padding: 0 0 18px; color: var(--mut); }
  #listHead h1 { font: 500 52px/1 var(--serif); color: #fff; margin: 0; }
  #listHead h1 i { font-style: normal; color: var(--red); }

  #list .contrib { margin: 34px 0 10px; padding-top: 16px; border-top: 1px solid var(--stroke); color: var(--mut); font-size: 13px; line-height: 1.55; max-width: 62ch; }
  body.view-home #side { display: none; }
  body.view-home #list { margin-left: 30px; }
  #home { max-width: 760px; padding-top: 18px; }

  #list h2.ksec { font: 500 24px/1.1 var(--serif); color: #fff; margin: 26px 0 10px; }
  #list .contrib a { color: #fff; font-weight: 700; white-space: nowrap; }
  .group { margin-bottom: 30px; }
  .group > h2 { font: 500 32px/1.1 var(--serif); display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; color: #fff; }
  .group > h2 .dot { width: 12px; height: 12px; }

    if (!seen.has(e.prerequisiteId)) { seen.add(e.prerequisiteId); stack.push(e.prerequisiteId); }

function exportFile() {
  const obj = { v: 1, exported: new Date().toISOString(), name: childName, progress, hypo: store.get('hypo', []), diag, snaps };
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = `skill-graph-progress-${obj.exported.slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function importFile(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let obj = null;
    try { obj = JSON.parse(rd.result); } catch { /* not JSON */ }
    const p = obj?.progress;
    if (!p || typeof p !== 'object' || Array.isArray(p) || !Object.values(p).every((x) => x === 'known' || x === 'learning')) return notice(UI[lang].importBad);
    applyImport(obj);
  };
  rd.onerror = () => notice(UI[lang].importBad);
  rd.readAsText(file);
}
function copyLink() {
  const k = [], l = [];
  for (const [id, st] of Object.entries(progress)) (st === 'known' ? k : st === 'learning' ? l : []).push(id);
  const enc = btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, n: childName, k, l })))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const url = location.origin + location.pathname + (lang !== 'en' ? `?lang=${lang}` : '') + '#p=' + enc;
  const done = () => notice(UI[lang].copied);
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch { /* blocked */ }
    ta.remove();
  };
  navigator.clipboard?.writeText ? navigator.clipboard.writeText(url).then(done, fallback) : fallback();
}
function applyImport(obj) {
  const entries = (obj.progress ? Object.entries(obj.progress).filter(([, st]) => st === 'known' || st === 'learning')
    : [...(obj.k ?? []).map((id) => [id, 'known']), ...(obj.l ?? []).map((id) => [id, 'learning'])]).filter(([id]) => byId.has(id));
  const n = entries.length, u = UI[lang];
  if (!n) return notice(u.importBad);
  if (!confirm(u.importAsk(n))) return;
  for (const [id, st] of entries) progress[id] = st;
  store.set('progress', progress);
  const nm = obj.name ?? obj.n;
  if (typeof nm === 'string' && nm.trim() && !childName) { childName = nm.trim().slice(0, 40); store.set('name', childName); }
  if (Array.isArray(obj.hypo)) store.set('hypo', [...new Set([...store.get('hypo', []), ...obj.hypo.filter((id) => byId.has(id))])]);
  if (obj.diag && typeof obj.diag === 'object' && !Array.isArray(obj.diag)) {
    for (const [id, v] of Object.entries(obj.diag)) if (byId.has(id) && (v === 'y' || v === 'n')) diag[id] = v;
    store.set('diag', diag);
  }
  if (Array.isArray(obj.snaps)) {
    for (const x of obj.snaps) {
      if (x && typeof x.d === 'string' && typeof x.s === 'string' && x.v && typeof x.v === 'object' && !snaps.some((y) => y.d === x.d && y.s === x.s)) snaps.push({ d: x.d, s: x.s, v: x.v });
    }
    snaps.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0)); snaps = snaps.slice(-24);
    store.set('snaps', snaps);
  }
  applyFilters(); if (focus) renderPanel();
  notice(u.importDone(n));
}
function importHash() {
  if (!location.hash.startsWith('#p=')) return;
  try {
    let b = location.hash.slice(3).replace(/-/g, '+').replace(/_/g, '/');
    b += '='.repeat((4 - b.length % 4) % 4);
    const o = JSON.parse(decodeURIComponent(escape(atob(b))));
    if (o && typeof o === 'object') applyImport(o); else notice(UI[lang].importBad);
  } catch { notice(UI[lang].importBad); }

}

function clusterFor(s, d) {

  const cs = clusters.get(s + '|' + d);

  const inside = cs.filter((c) => c.ageRangeStart >= f.ageFrom && c.ageRangeStart <= f.ageTo);
  if (inside.length) return inside.sort((a, b) => a.ageRangeStart - b.ageRangeStart)[0];

  for (const s of SUBJECTS) {
    const ts = by.get(s);
    if (!ts) continue;
    const near = win ? ts.filter((t) => t.ageRangeStart <= win[1] && t.ageRangeEnd >= win[0]).sort(byScore) : [];
    const pick = near.length >= N ? near.slice(0, N)
      : [...near, ...ts.filter((t) => !near.includes(t)).sort(byScore)].slice(0, N);
    html += `<section class="group"><h2><i class="dot" style="background:${COLORS[s]}"></i>${esc(subj(s))} <span class="n">${u.topicsN(ts.length)}</span></h2>
      <ul class="topics next">${pick.map((t) => topicRow(t, `<span class="unl">${esc(u.unlocksN(unl(t)))}</span>`)).join('')}</ul></section>`;
  }
  if (visible.size) html += `<p class="links"><button class="linkbtn" id="nextAll">${u.nextAll(visible.size)}</button></p>`;
  html += contribHtml(u);
  const top = scrollY;
  $('list').innerHTML = html;
  scrollTo(0, top);
}

// active filters as removable pills under the list heading
function pillsHtml(u) {
  const ps = [];
  if (f.labs) ps.push(['labs', u.pillLabs]);
  if (f.school) ps.push(['school', schoolLabel()]);
  if (f.status !== 'all') ps.push(['status', u.st[f.status]]);
  if (!schoolTopics && (f.ageFrom !== ageMin || f.ageTo !== ageMax)) ps.push(['age', u.ages(f.ageFrom, f.ageTo)]);
  const shown = SUBJECTS.filter((s) => !f.offSubj.has(s));
  if (f.offSubj.size || f.offDom.size) ps.push(['subj', f.offSubj.size && shown.length <= 3 ? u.pillOnly(shown.map(subj).join(', ')) : u.pillSubj(f.offSubj.size)]);
  if (f.offSrc.size) ps.push(['src', u.pillSrc(f.offSrc.size)]);
  if (!ps.length) return '';
  return `<div class="pills">${ps.map(([k, t]) => `<button class="pill" data-clear="${k}" aria-label="${esc(u.clearOne + ': ' + t)}">${esc(t)} <span aria-hidden="true">×</span></button>`).join('')}${
    ps.length > 1 ? `<button class="linkbtn" data-clear="all">${u.reset}</button>` : ''}</div>`;
}
function clearFilter(k) {
  if (k === 'labs') f.labs = false;
  else if (k === 'school') { f.school = ''; computeSchool(); kidQ = null; }
  else if (k === 'status') { f.status = 'all'; f.nextAll = false; }
  else if (k === 'age') [f.ageFrom, f.ageTo] = [ageMin, ageMax];
  else if (k === 'subj') { f.offSubj.clear(); f.offDom.clear(); }
  else if (k === 'src') f.offSrc.clear();
  else if (k === 'all') resetFilters();
  applyFilters();
}

// --- "my child" view: the school grade's curriculum by subject, a quick check, the shape of what is known ---------
// subjects of the chosen grade (the school's own subject names) with their topics; null without a school
function kidAxes() {
  const m = f.school.match(/^([a-z]+)-(\d+)$/);
  if (!school || !m) return null;
  const by = new Map();
  for (const id of Object.keys(school.links)) {
    if (!byId.has(id)) continue;
    for (const [i] of school.links[id]) {
      const it = school.items[i];
      if (it[0] === m[1] && gradeHas(it[2], +m[2])) (by.get(it[1]) ?? by.set(it[1], new Set()).get(it[1])).add(id);
    }
  }
  return [...by].filter(([, ids]) => ids.size >= 3).sort((a, b) => b[1].size - a[1].size).slice(0, 8).map(([name, set]) => {
    const ids = [...set];
    return { name, ids, n: ids.length, known: ids.filter((id) => progress[id] === 'known').length, ready: ids.filter((id) => ready(byId.get(id))).length };
  });
}

// radar of the axes: known share, known + ready share, and the last saved snapshot
function radarSvg(axes, prev, u) {
  const W = 420, cx = W / 2, cy = 158, R = 86, N = axes.length, f1 = (n) => n.toFixed(1);
  const ang = (i) => -Math.PI / 2 + 2 * Math.PI * i / N;
  const pt = (i, v) => `${f1(cx + R * v * Math.cos(ang(i)))},${f1(cy + R * v * Math.sin(ang(i)))}`;
  const poly = (vals) => axes.map((a, i) => pt(i, Math.max(vals(a), 0.03))).join(' ');
  let g = [.25, .5, .75, 1].map((r) => `<polygon points="${axes.map((a, i) => pt(i, r)).join(' ')}" fill="none" stroke="var(--stroke)"/>`).join('');
  g += axes.map((a, i) => `<line x1="${cx}" y1="${cy}" x2="${pt(i, 1).split(',')[0]}" y2="${pt(i, 1).split(',')[1]}" stroke="var(--stroke)"/>`).join('');
  if (prev) g += `<polygon points="${poly((a) => prev.v[a.name] ?? 0)}" fill="none" stroke="var(--mut)" stroke-dasharray="3 3"/>`;
  g += `<polygon points="${poly((a) => (a.known + a.ready) / a.n)}" fill="rgba(245,200,76,.12)" stroke="var(--wip)" stroke-dasharray="4 3"/>`;
  g += `<polygon points="${poly((a) => a.known / a.n)}" fill="rgba(61,220,151,.22)" stroke="var(--ok)" stroke-width="2"/>`;
  g += axes.map((a, i) => { const [x, y] = pt(i, Math.max(a.known / a.n, 0.03)).split(','); return `<circle cx="${x}" cy="${y}" r="3" fill="var(--ok)"/>`; }).join('');
  g += axes.map((a, i) => {
    const c = Math.cos(ang(i)), s = Math.sin(ang(i)), x = cx + 1.14 * R * c;
    let y = cy + 1.14 * R * s;
    if (s < -0.9) y -= 12; else if (s > 0.9) y += 8;
    const anchor = Math.abs(x - cx) < 8 ? 'middle' : x > cx ? 'start' : 'end';
    const nm = a.name.length > 15 ? a.name.slice(0, 14) + '…' : a.name;
    return `<text x="${f1(x)}" y="${f1(y + 4)}" text-anchor="${anchor}" font-size="13" font-weight="700" fill="var(--body)">${nm !== a.name ? `<title>${esc(a.name)}</title>` : ''}${esc(nm)}</text>
      <text x="${f1(x)}" y="${f1(y + 19)}" text-anchor="${anchor}" font-size="12" fill="var(--mut)">${Math.round(100 * a.known / a.n)}%</text>`;
  }).join('');
  return `<svg class="radar" viewBox="0 0 ${W} 300" role="img" aria-label="${esc(u.kidShape)}">${g}</svg>`;
}

// the next quick-check question: round-robin over the subjects, ready topics first, then the central and the young ones
function kidNext() {
  const axes = kidAxes() ?? [];
  kidQ.cur = null;
  if (kidQ.n < KQ) for (let k = 0; k < axes.length && !kidQ.cur; k++) {
    const a = axes[(kidQ.n + k) % axes.length];
    const c = a.ids.filter((id) => progress[id] !== 'known' && !kidQ.asked.has(id)).map((id) => byId.get(id))
      .sort((x, y) => ready(y) - ready(x) || (y.centrality ?? 0) - (x.centrality ?? 0) || x.ageRangeStart - y.ageRangeStart);
    if (c.length) kidQ.cur = c[0].id;
  }
  if (!kidQ.cur) { notice(UI[lang].kidDoneN(kidQ.n)); kidQ = null; }
}

      // this week: up to 3 ready topics, one per subject where possible, labs first, then the ones that unlock the most
      const cmp = (a, b) => labTopics.has(b.id) - labTopics.has(a.id) || (dependents.get(b.id)?.length ?? 0) - (dependents.get(a.id)?.length ?? 0) || (b.centrality ?? 0) - (a.centrality ?? 0);
      const per = axes.map((a) => a.ids.map((id) => byId.get(id)).filter((t) => ready(t)).sort(cmp));

}

// clicks in the "my child" view; true when handled
function kidClick(ev) {
  const b = ev.target.closest('button'), id = b?.id;
  if (!b) return false;
  if (id === 'hypo') { applyHypo(); applyFilters(); if (focus) renderPanel(); return true; }
  if (id === 'hypoUndo') { undoHypo(); applyFilters(); if (focus) renderPanel(); return true; }
  if (id === 'kidChange') { kidSetup = true; renderChild(); return true; }
  if (id === 'kidDone') { kidSetup = false; renderChild(); return true; }
  if (id === 'kidStart') { kidQ = { asked: new Set(), n: 0, cur: null }; kidNext(); renderChild(); scrollTo(0, 0); return true; }
  if (id === 'kidStop') { kidQ = null; renderChild(); return true; }
  if (id === 'kidYes' && kidQ?.cur) {
    const cur = kidQ.cur;
    for (const a of ancestors(cur)) if (progress[a] !== 'known') progress[a] = 'known';
    diag[cur] = 'y'; store.set('progress', progress); store.set('diag', diag);
    kidQ.asked.add(cur); kidQ.n++; kidNext(); applyFilters();
    return true;
  }
  if (id === 'kidNo' && kidQ?.cur) {
    diag[kidQ.cur] = 'n'; store.set('diag', diag);
    kidQ.asked.add(kidQ.cur); kidQ.n++; kidNext(); renderChild();
    return true;
  }
  if (id === 'kidSkip' && kidQ?.cur) { kidQ.asked.add(kidQ.cur); kidNext(); renderChild(); return true; }
  if (id === 'kidSave') {
    const axes = kidAxes() ?? [], d = new Date().toISOString().slice(0, 10);
    snaps = snaps.filter((x) => !(x.d === d && x.s === f.school));
    snaps.push({ d, s: f.school, v: Object.fromEntries(axes.map((a) => [a.name, a.n ? a.known / a.n : 0])) });
    snaps = snaps.slice(-24); store.set('snaps', snaps);
    notice(UI[lang].kidSavedNow); renderChild();
    return true;
  }
  if (b.dataset.gap) {
    select(b.dataset.gap, true);
    const queue = candidates(focus, new Set([focus]));
    if (queue.length) { stuck = { root: focus, cur: null, queue, visited: new Set([focus]), step: 0, marked: 0, result: undefined }; advance(); }
    return true;
  }
  if (b.dataset.route) { select(b.dataset.route, true); route = true; renderPanel(); setUrl(); return true; }
  return false;
}

$('list').addEventListener('click', (ev) => {
  const clr = ev.target.closest('[data-clear]');
  if (clr) return clearFilter(clr.dataset.clear);
  if (f.view === 'child' && kidClick(ev)) return;
  if (ev.target.id === 'nextAll' || ev.target.id === 'nextFew') { f.nextAll = ev.target.id === 'nextAll'; return renderList(); }
  const st = ev.target.closest('.stage');
  if (st) return select(st.dataset.id, true);
  if (f.view === 'home') {
    const vw = ev.target.closest('[data-view]');
    if (vw) return setView(vw.dataset.view);
    if (ev.target.closest('[data-go="next"]')) { f.status = 'next'; f.nextAll = false; setView('list'); return applyFilters(); }
    return;
  }
  if (f.view === 'routes') {
    const rt = ev.target.closest('[data-route]');
    if (rt) { select(rt.dataset.route, true); route = true; renderPanel(); setUrl(); return; }
    const vw = ev.target.closest('[data-view]');
    if (vw) return setView(vw.dataset.view);
  }
  const li = ev.target.closest('li[data-id]');
  if (li) select(li.dataset.id, true);
});
$('list').addEventListener('toggle', (ev) => {
  const k = ev.target.dataset?.k;
  if (k) ev.target.open ? openDoms.add(k) : openDoms.delete(k);
}, true);
$('list').addEventListener('change', (ev) => {

function showDomain(s, d) {
  f.offSubj.delete(s); f.offDom.delete(s + '|' + d); openDoms.add(s + '|' + d);
  const t = [...byId.values()].filter((x) => x.subject === s && x.domain === d);
  // widen the age filter if the section lies outside it
  const lo = Math.min(...t.map((x) => x.ageRangeStart)), hi = Math.max(...t.map((x) => x.ageRangeEnd));
  if (hi < f.ageFrom || lo > f.ageTo) [f.ageFrom, f.ageTo] = [ageMin, ageMax];

function select(id, fly, fromBack) {

let ptab = 'links'; // the active tab of the topic card

function schoolLabel() {

// where the topic sits in the national curricula: chosen country first, core links before related ones
function schoolHtml(id) {

  const u = UI[lang], sel = f.school.split('-')[0], by = {};
  for (const [i, core] of links) (by[school.items[i][0]] ??= []).push([school.items[i], core]);
  const order = Object.keys(school.curricula).filter((c) => by[c]).sort((a, b) => (b === sel) - (a === sel));

    const rows = by[c].sort((a, b) => b[1] - a[1] || parseInt(a[0][2]) - parseInt(b[0][2]));
    return `<div class="c">${esc(u.cn[c] ?? c)}</div>${rows.slice(0, MAX).map(([[, s, g, title], core]) =>
      `<div class="it${core ? '' : ' rel'}"><span class="g">${esc(u.grs(g.replace('-', '–')))}</span><span>${esc(s)} · ${esc(title)}</span></div>`).join('')}${
      rows.length > MAX ? `<div class="more">${esc(u.more(rows.length - MAX))}</div>` : ''}`;

function setStatus(ids, s) {
  for (const id of ids) s === 'none' ? delete progress[id] : (progress[id] = s);
  store.set('progress', progress);
  applyFilters(); renderPanel();
}

// --- find the gap: walk back along unmet prerequisites with quick questions ----
// unmet prerequisites of a topic, hard before soft, then the oldest-aimed last (closest to the topic first)
function candidates(id, visited) {
  const seen = new Set(), out = [];
  for (const e of prereqs.get(id) ?? []) {
    const o = e.prerequisiteId;
    if (progress[o] === 'known' || visited.has(o) || seen.has(o) || !byId.has(o)) continue;
    seen.add(o); out.push({ id: o, hard: e.strength === 'hard' ? 0 : 1, age: byId.get(o).ageRangeStart });
  }
  return out.sort((a, b) => a.hard - b.hard || b.age - a.age).map((x) => x.id);
}

function advance() {
  if (!stuck.queue.length) stuck.result = null;
  else {
    stuck.cur = stuck.queue.shift(); stuck.visited.add(stuck.cur); stuck.step++;
    if (stuck.step > 12) stuck.result = stuck.cur;
  }
  renderPanel();
}

function renderStuck(u) {
  const root = byId.get(stuck.root), who = childName || u.child, q = (t) => t.assessmentPrompt ? t.assessmentPrompt.replaceAll('{{name}}', who) : t.description;
  const meta = (t) => `<div class="sub">${esc(dom(t.domain))} · ${u.age} ${t.ageRangeStart}–${t.ageRangeEnd}</div>`;
  const marked = stuck.marked ? `<div class="sub">${esc(u.gapKnownMarked(stuck.marked))}</div>` : '';
  const top = ptop(u, `<button class="back" id="stuckCancel">${u.stuckCancel}</button>`);
  const dot = `<i class="dot" style="background:${COLORS[root.subject]}"></i>`;
  $('panel').style.setProperty('--sc', COLORS[root.subject]);
  if (stuck.result === undefined) {
    const t = byId.get(stuck.cur);
    $('panelBody').innerHTML = `<div class="phead">${top}
      <div class="eyebrow">${dot}${u.stuckKick} · ${u.stuckStep(stuck.step)}</div>
      <div class="sub">${esc(u.stuckFor(shortName(root)))}</div>
      <h2>${esc(shortName(t))}</h2>${meta(t)}</div>
      <div class="pbody"><h3>${u.check}</h3><p class="cq">${esc(q(t))}</p>

      <p class="links"><button class="linkbtn" id="stuckSkip">${u.skip}</button></p>${marked}</div>`;
    return;
  }
  const gap = stuck.result === null ? null : byId.get(stuck.result);
  const btns = `<div class="stuckBtns"><button class="btn primary" id="gapOpen" data-id="${gap ? gap.id : root.id}">${u.gapOpen}</button><button class="btn" id="gapRoot">${u.gapRoot}</button></div>`;
  $('panelBody').innerHTML = gap ? `<div class="phead">${top}
      <div class="eyebrow">${dot}${u.stuckKick}</div>
      <h3>${u.gapTitle}</h3><h2>${esc(shortName(gap))}</h2>${meta(gap)}</div>
      <div class="pbody"><p class="cq">${esc(q(gap))}</p>
      ${labTopics.has(gap.id) ? `<div class="sub">🧪 ${esc(u.gapLab)}</div>` : ''}${btns}${marked}</div>`
    : `<div class="phead">${top}<h3>${u.gapTitle}</h3></div>
      <div class="pbody"><p class="cq">${esc(u.gapNone(shortName(root)))}</p>${btns}${marked}</div>`;
}

// --- the route: from what the child knows to this topic -----------------------
// stations = the prerequisite topics, a series (age stages of one topic) folded into one; order = longest path from the start
function routeModel(goalId, u) {
  const goal = byId.get(goalId), all = [...ancestors(goalId)].filter((x) => x !== goalId).map((x) => byId.get(x));
  const hard = ancestors(goalId, true), kept = routeAll ? all : all.filter((t) => t.subject === goal.subject);
  const key = (t) => series.get(t.id)?.[0].id ?? t.id, by = new Map(), of = new Map();
  for (const t of kept) { (by.get(key(t)) ?? by.set(key(t), []).get(key(t))).push(t); of.set(t.id, key(t)); }
  const stations = [...by].map(([id, ms]) => {
    ms.sort((a, b) => a.ageRangeStart - b.ageRangeStart || a.ageRangeEnd - b.ageRangeEnd);
    const kn = ms.filter((m) => progress[m.id] === 'known').length;
    return { id, members: ms, name: shortName(ms[0]), known: kn === ms.length, learning: ms.some((m) => progress[m.id] === 'learning') || (kn > 0 && kn < ms.length),
      doms: new Set(ms.map((m) => m.domain)), lab: ms.some((m) => labTopics.has(m.id)), optional: !ms.some((m) => hard.has(m.id)), age: ms[0].ageRangeStart, end: Math.max(...ms.map((m) => m.ageRangeEnd)),
      next: ms.find((m) => progress[m.id] !== 'known') ?? ms[0], lvl: 0 };
  });
  const sOf = new Map(stations.map((s) => [s.id, s])), memo = new Map();
  const lvl = (s) => {
    if (memo.has(s.id)) return memo.get(s.id);
    memo.set(s.id, 0); // a loop between stations counts as no step
    let l = 0;
    for (const m of s.members) for (const e of prereqs.get(m.id) ?? []) {
      const o = of.get(e.prerequisiteId);
      if (o && o !== s.id) l = Math.max(l, 1 + lvl(sOf.get(o)));
    }
    memo.set(s.id, l); return l;
  };
  for (const s of stations) s.lvl = lvl(s);
  stations.sort((a, b) => a.lvl - b.lvl || a.age - b.age || a.name.localeCompare(b.name));
  const known = kept.filter((t) => progress[t.id] === 'known').length, doms = new Map();
  for (const t of all) {
    const k = `${t.subject}|${t.domain}`, d = doms.get(k) ?? doms.set(k, { key: k, subject: t.subject, domain: t.domain, name: dom(t.domain), known: 0, ahead: 0 }).get(k);
    progress[t.id] === 'known' ? d.known++ : d.ahead++;
  }
  const domains = [...doms.values()].sort((a, b) => b.known + b.ahead - a.known - a.ahead);
  return { stations, other: all.length - kept.length, total: kept.length, known, ahead: kept.length - known,
    labs: stations.filter((s) => s.lab && !s.known).length, domains, allTotal: all.length, allKnown: all.filter((t) => progress[t.id] === 'known').length };
}

// the sections of the whole route: a known / ahead bar each; a tap filters the station list to the section
function routeDoms(m, goal, u) {
  const shown = routeDomsAll ? m.domains : m.domains.slice(0, 5);
  const rows = shown.map((d) => {
    const pct = Math.round(100 * d.known / (d.known + d.ahead));
    return `<button class="rdom${routeDom === d.key ? ' on' : ''}" data-dom="${esc(d.key)}"><span class="n"><i class="dot" style="background:${COLORS[d.subject]}"></i>${esc(d.name)}</span>`
      + `<span class="c">${d.known}/${d.known + d.ahead}</span><span class="b"><i style="width:${pct}%"></i></span></button>`;
  }).join('');
  const more = m.domains.length > 5 ? `<button class="linkbtn" id="routeDomsAll">${routeDomsAll ? u.routeDomsLess : u.routeDomsMore(m.domains.length - 5)}</button>` : '';
  return `<div class="rdoms">${rows}${more}</div>`;
}

function renderRoute(u) {
  const goal = byId.get(focus), m = routeModel(focus, u), who = childName || u.child;
  const opt = m.stations.filter((s) => !s.known && s.optional).length; // only soft links lead from them to the goal: folded away by default
  const rest0 = m.stations.filter((s) => !s.known && (routeOpt || !s.optional));
  const nextSt = rest0.find((s) => !s.optional) ?? rest0[0]; // the first step that is really needed
  const inDom = (s) => !routeDom || s.members.some((x) => `${x.subject}|${x.domain}` === routeDom);
  // a picked section shows all its steps, the optional ones too: its counts include them
  const rest = (routeDom ? m.stations.filter((s) => !s.known) : rest0).filter(inDom), done = m.stations.filter((s) => s.known && inDom(s));
  const domName = routeDom ? m.domains.find((d) => d.key === routeDom)?.name ?? '' : '';
  const st = (s, cls = '') => {
    const now = s === nextSt, cl = cls || (now ? 'now' : s.learning ? 'learning' : '');
    const meta = u.ages(s.age, s.end) + (s.optional && !s.known ? ` · ${u.routeOptional}` : '') + (now ? ` · ${u.routeNow}` : '');
    return `<li class="rs ${cl}"><button class="rsb" data-id="${s.next.id}"><b>${esc(s.name)}${s.lab ? ' <span class="rlab">🧪</span>' : ''}${s.members.length > 1
      ? `<span class="steps">${s.members.map((x) => `<i class="${progress[x.id] === 'known' ? 'on' : ''}"></i>`).join('')}</span>` : ''}</b><small>${esc(meta)}</small></button></li>`;
  };
  let list = '';
  if (done.length) {
    list += `<li class="rs known fold"><button class="rsb" id="routeKnown"><b>${esc(u.routeKnownN(done.reduce((n, s) => n + s.members.length, 0)))}</b><small>${routeOpenKnown ? u.routeHide : u.routeShow}</small></button></li>`;
    if (routeOpenKnown) list += done.map((s) => st(s, 'known')).join('');
  }
  if (routeDom && !rest.length) list += `<li><div class="sub">${esc(u.routeDomDone)}</div></li>`;
  for (let i = 0; i < rest.length;) {
    let j = i; while (j < rest.length && rest[j].lvl === rest[i].lvl) j++;
    const run = rest.slice(i, j).map((s) => st(s)).join('');
    list += j - i >= 2 ? `<li class="fork"><div class="fh">${u.routeFork}</div><ol>${run}</ol></li>` : run;
    i = j;
  }
  list += `<li class="rs goal"><b>${esc(shortName(goal))}</b><small>${esc(u.routeGoal)}</small></li>`;
  const mapBtn = f.view === 'graph' ? `<button class="btn" id="routeMap">${u.routeMap}</button>` : `<button class="linkbtn" id="routeMap">${u.routeMap}</button>`;
  $('panel').style.setProperty('--sc', COLORS[goal.subject]);
  $('panelBody').innerHTML = `
    <div class="phead">${ptop(u, `<button class="back" id="routeBack">${u.routeBack}</button>`)}
      <div class="eyebrow"><i class="dot" style="background:${COLORS[goal.subject]}"></i>${u.routeKick}</div>
      <h2>${esc(shortName(goal))}</h2>
      <div class="sub">${esc(u.routeFrom(who))}</div>
    </div>
    <div class="pbody">
      <div class="pathcard"><div class="bar"><i style="width:${m.total ? Math.round(100 * m.known / m.total) : 0}%"></i></div>
        <div class="sub">${esc(u.routeSum(m.known, m.total, m.ahead, m.labs))}</div>
        <div class="acts">${mapBtn}${m.other || routeAll ? `<button class="linkbtn" id="routeAll">${routeAll ? u.routeOneSubj(subj(goal.subject)) : u.routeAllSubj(m.other)}</button>` : ''}${opt ? `<button class="linkbtn" id="routeOpt">${routeOpt ? u.routeOptHide : u.routeOptN(opt)}</button>` : ''}</div></div>
      ${m.allTotal ? `<h3>${u.routeWhat}</h3><div class="sub">${esc(u.routeWhatHint)}</div>${routeDoms(m, goal, u)}` : ''}
      ${routeDom ? `<div class="rdomOn"><span>${esc(u.routeDomOnly(domName))}</span><button class="linkbtn" id="routeDomOff">${u.routeDomAll}</button></div>` : ''}
      <ol class="route">${list}</ol>
      ${nextSt ? `<button class="btn primary" id="routeGo" data-id="${nextSt.next.id}" style="width:100%">${esc(u.routeGo(nextSt.name))}</button>` : `<div class="sub">${esc(u.routeDone)}</div>`}
    </div>`;
}

async function routeClick(el) {
  const b = el.closest('button'), id = b?.id, keep = () => { const sc = $('panel').scrollTop; renderPanel(); $('panel').scrollTop = sc; };
  if (!b) return;
  if (b.dataset.dom) {
    const k = b.dataset.dom;
    routeDom = routeDom === k ? null : k;
    if (routeDom && k.split('|')[0] !== byId.get(focus).subject) routeAll = true;
    keep();
    return $('panelBody').querySelector('ol.route')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  if (id === 'routeDomOff') { routeDom = null; return keep(); }
  if (id === 'routeDomsAll') { routeDomsAll = !routeDomsAll; return keep(); }
  if (id === 'routeBack') { route = false; renderPanel(); return setUrl(); }
  if (id === 'routeKnown') { routeOpenKnown = !routeOpenKnown; return keep(); }
  if (id === 'routeAll') { routeAll = !routeAll; return keep(); }
  if (id === 'routeOpt') { routeOpt = !routeOpt; return keep(); }
  if (id === 'routeMap') {
    chainOnly = true;
    if (f.view !== 'graph') await setView('graph'); else refreshGraph();
    flyTo(focus);
    sheet('peek'); // the route on the map stays visible
    return renderPanel();
  }
  if (id === 'routeGo' || b.classList.contains('rsb')) { const g = focus; route = false; select(b.dataset.id, true); routeFrom = g; return; }
}

function stuckClick(el) {
  const id = el.closest('button')?.id;
  if (id === 'stuckCan') { progress[stuck.cur] = 'known'; store.set('progress', progress); stuck.marked++; return advance(); }
  if (id === 'stuckCannot') {
    const next = candidates(stuck.cur, stuck.visited);
    if (!next.length) { stuck.result = stuck.cur; return renderPanel(); }
    stuck.queue = next; return advance();
  }
  if (id === 'stuckSkip') return advance();
  if (id === 'stuckCancel' || id === 'gapRoot' || id === 'gapOpen') {
    const root = stuck.root, to = id === 'gapOpen' ? el.closest('button').dataset.id : root;
    if (id === 'gapOpen' && progress[to] !== 'known') { progress[to] = 'learning'; store.set('progress', progress); }
    stuck = null; applyFilters();
    return id === 'stuckCancel' ? renderPanel() : select(to, true);
  }
}

const phone = matchMedia('(max-width: 720px)');
// the phone sheet has three heights: peek (title only), half, full; drag the header to move between them
let gripY = null, gripH = 0, gripDrag = false;
const sheet = (st) => { const pn = $('panel'); pn.classList.toggle('peek', st === 'peek'); pn.classList.toggle('expanded', st === 'full'); if (st === 'peek') pn.scrollTop = 0; };
$('panelBody').addEventListener('pointerdown', (ev) => {
  gripDrag = false;
  if (!phone.matches || !ev.target.closest('.phead')) return;
  gripY = ev.clientY; gripH = $('panel').offsetHeight;
});
$('panelBody').addEventListener('pointermove', (ev) => {
  if (gripY === null) return;
  const dy = ev.clientY - gripY;
  if (!gripDrag && Math.abs(dy) < 8) return;
  if (!gripDrag) { gripDrag = true; $('panel').classList.add('dragging'); ev.target.setPointerCapture?.(ev.pointerId); }
  $('panel').style.height = `${Math.max(90, Math.min(innerHeight - 64, gripH - dy))}px`;
});
const gripEnd = (ev) => {
  if (gripY === null) return;
  const pn = $('panel'), dy = ev.clientY - gripY, h = pn.offsetHeight; gripY = null;
  pn.classList.remove('dragging'); pn.style.height = '';
  if (!gripDrag) return;
  // snap to the nearest height; a fling of more than 60px goes one step further
  if (h < 110 && dy > 0) return select(null);
  const stops = [['peek', 150], ['half', innerHeight * 0.56], ['full', innerHeight - 64]];
  const target = h + (Math.abs(dy) > 60 ? -Math.sign(dy) * 40 : 0);
  sheet(stops.reduce((a, b) => (Math.abs(b[1] - target) < Math.abs(a[1] - target) ? b : a))[0]);
};
$('panelBody').addEventListener('pointerup', gripEnd);
$('panelBody').addEventListener('pointercancel', gripEnd);
$('panel').addEventListener('scroll', () => { if (phone.matches && $('panel').scrollTop > 24 && !$('panel').classList.contains('peek')) sheet('full'); });
$('panelBody').addEventListener('click', (ev) => {
  const el = ev.target;
  if (el.id === 'close') return select(null);
  if (gripDrag) { gripDrag = false; return; } // the end of a drag is not a tap
  if (el.closest('.grip')) { const pn = $('panel'); return sheet(pn.classList.contains('peek') ? 'half' : pn.classList.contains('expanded') ? 'peek' : 'full'); }
  if ($('panel').classList.contains('peek') && el.closest('.phead') && !el.closest('button')) return sheet('half');
  if (stuck) return stuckClick(el);
  if (route) return routeClick(el);
  if (el.id === 'routeOpen') { route = true; $('panel').scrollTop = 0; renderPanel(); return setUrl(); }
  if (el.closest('#stuck')) {
    stuck = { root: focus, cur: null, queue: candidates(focus, new Set([focus])), visited: new Set([focus]), step: 0, marked: 0, result: undefined };
    return advance();
  }
  const sb = el.closest('.stage');
  if (sb) return select(sb.dataset.id, true);
  const l = el.closest('.link');
  if (l) return select(l.dataset.id, true);
  if (el.id === 'back') {
    const id = back.pop(); select(id, true, true);
    if (id === routeFrom) { route = true; renderPanel(); setUrl(); }
    routeFrom = null; return;
  }
  const tb = el.closest('.ptabs button');
  if (tb) { ptab = tb.dataset.tab; const sc = $('panel').scrollTop; renderPanel(); $('panel').scrollTop = sc; return; }
  if (el.closest('.status button')) return setStatus([focus], el.closest('button').dataset.s);
  if (el.id === 'markAll') return setStatus([...chain], 'known');
  if (el.id === 'chainOnly') { chainOnly = !chainOnly; refreshGraph(); return renderPanel(); }
  if (el.classList.contains('crumb') && el.dataset.s) {
    if (el.dataset.d) return showDomain(el.dataset.s, el.dataset.d);
    SUBJECTS.forEach((x) => (x === el.dataset.s ? f.offSubj.delete(x) : f.offSubj.add(x)));
    setView('list'); return applyFilters();
  }
});
addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && document.activeElement !== $('search')) select(null); });

// --- graph: a 2D canvas of precomputed positions (graph2d.js, data/layout.json), started on first use ------------
let G = null, graphLoading = null, layout = null, noGraph = false;
const shown = (id) => (chainOnly && focus) ? chain.has(id) : visible.has(id) || (focus && chain.has(id));

function tooltip(id) {
  const t = byId.get(id), u = UI[lang];
  let body = t.assessmentPrompt ? t.assessmentPrompt.replaceAll('{{name}}', childName || u.child) : t.description;
  if (body.length > 220) body = body.slice(0, 217).replace(/\s+\S*$/, '') + '…';
  return `<div class="tip"><div class="eyebrow"><i class="dot" style="background:${COLORS[t.subject]}"></i>${esc(dom(t.domain))} · ${u.age} ${t.ageRangeStart}–${t.ageRangeEnd}</div>
    <b>${esc(shortName(t))}</b><p>${esc(body)}</p></div>`;
}

// nodes and links for the renderer; a topic the layout does not know yet (run scripts/layout.mjs) sits among its prerequisites
function graphData() {
  const pos = layout.nodes, mid = (layout.ageMin + layout.ageMax) / 2, at = new Map(data.topics.map((t, i) => [t.id, i]));
  const nodes = data.topics.map((t) => {
    let p = pos[t.id];
    if (!p) {
      const age = (t.ageRangeStart + t.ageRangeEnd) / 2, ps = (prereqs.get(t.id) ?? []).map((e) => pos[e.prerequisiteId]).filter(Boolean);
      let h = 0; for (const ch of t.id) h = (h * 31 + ch.charCodeAt(0)) | 0;
      const a = ((h >>> 0) % 1000) / 1000 * 2 * Math.PI, r = (12 + Math.max(0, age - layout.ageMin) * 15) * 0.6 * (((h >>> 10) % 1000) / 1000);
      p = [ps.length ? ps.reduce((s, q) => s + q[0], 0) / ps.length : Math.cos(a) * r, (age - mid) * 45, // 45 world units per year, as in layout.mjs
        ps.length ? ps.reduce((s, q) => s + q[2], 0) / ps.length : Math.sin(a) * r];
    }
    return { id: t.id, x: p[0], y: p[1], z: p[2], color: COLORS[t.subject] ?? '#999999', size: Math.min(1, t.centrality ?? 0) };
  });
  // edge points prerequisite → topic, so arrows read "leads to"
  const links = data.deps.map((e) => [at.get(e.prerequisiteId), at.get(e.topicId)]).filter(([a, b]) => a !== undefined && b !== undefined);
  return [nodes, links];
}

function ensureGraph() {
  if (G) return Promise.resolve();
  return graphLoading ??= fetch('data/layout.json').then((r) => { if (!r.ok) throw new Error(`layout.json: ${r.status}`); return r.json(); })
    .then((l) => {
      layout = l;
      const [nodes, links] = graphData();
      G = createGraph2D($('graph'), {
        nodes, links, tooltip,
        onClick: (id) => select(id, true),
        onBackground: () => { document.body.classList.remove('side-open'); select(null); },
        avoid: () => (document.body.classList.contains('has-panel') ? $('panel').getBoundingClientRect() : null),
        reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
      });
    })
    .catch((err) => { graphLoading = null; throw err; }); // offline on the first visit: the next click on "Graph" tries again
}

function refreshGraph() {
  if (!G || f.view !== 'graph') return;
  G.setState({ visible: shown, focus, chain });
}

// the part of the map the topic card leaves free: the card sits on the right on a desktop; on a phone it covers the bottom
// and the top bar the top, so the node goes into the strip between them
function freeArea() {
  if (!document.body.classList.contains('has-panel')) return {};
  const p = $('panel').getBoundingClientRect(), g = $('graph').getBoundingClientRect();
  if (p.left > g.left + g.width / 2) return { right: Math.max(0, g.right - p.left) };
  return { top: Math.max(0, document.querySelector('.bar').getBoundingClientRect().bottom - g.top), bottom: Math.max(0, g.bottom - p.top) };
}

function flyTo(id) {
  if (!G || f.view !== 'graph') return;
  G.flyTo(id, freeArea());
}

async function setView(v) {
  f.view = v;
  if (v === 'graph') scrollTo(0, 0); // the map never inherits a scrolled page
  document.body.classList.toggle('view-graph', v === 'graph');
  document.body.classList.toggle('view-list', v !== 'graph');
  document.body.classList.toggle('view-child', v === 'child');
  document.body.classList.toggle('view-home', v === 'home');
  if (v !== 'child') { kidQ = null; kidSetup = false; }
  document.body.classList.remove('side-open');
  renderViews();
  fitMap();
  if (v === 'graph') {
    $('loading').style.display = 'grid';
    try { await ensureGraph(); } catch {
      noGraph = true; $('loading').style.display = 'none'; notice(UI[lang].noGraph);
      return setView('list'); // renders the views, the list and the URL
    }
    $('loading').style.display = 'none';
    if (noGraph) { noGraph = false; renderViews(); } // a retry worked
    G.resume();
    refreshGraph();
    if (focus) flyTo(focus);
  } else {
    G?.pause();
    renderList();
  }
  if (focus) renderPanel();
  setUrl();
}

// --- search ------------------------------------------------------------------
let hitIdx = 0;
$('search').addEventListener('input', () => {
  const q = $('search').value.trim().toLowerCase(), box = $('results'), u = UI[lang];
  if (q.length < 2) { box.style.display = 'none'; return; }
  const name = [], desc = [];
  for (const t of byId.values()) {
    const n = t.name.toLowerCase();
    if (n.includes(q)) name.push([n.startsWith(q) ? 0 : 1, t]);
    else if (desc.length < 20 && t.description.toLowerCase().includes(q)) desc.push([2, t]);
  }
  const hits = [...name, ...desc].sort((a, b) => a[0] - b[0]).slice(0, 15).map((x) => x[1]);
  hitIdx = 0;
  box.innerHTML = hits.map((t, i) => `<div data-id="${t.id}" class="${i ? '' : 'on'}"><i class="dot" style="background:${COLORS[t.subject]}"></i>
    <span>${esc(shortName(t))}<small>${esc(subj(t.subject))} · ${esc(dom(t.domain))} · ${u.ages(t.ageRangeStart, t.ageRangeEnd)}</small></span></div>`).join('');
  box.style.display = hits.length ? 'block' : 'none';
});
$('search').addEventListener('keydown', (ev) => {
  const items = [...$('results').children];
  if (ev.key === 'Escape') { $('results').style.display = 'none'; return; }
  if (!items.length || $('results').style.display === 'none') return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    items[hitIdx]?.classList.remove('on');
    hitIdx = (hitIdx + (ev.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
    items[hitIdx].classList.add('on'); items[hitIdx].scrollIntoView({ block: 'nearest' });
  } else if (ev.key === 'Enter') pick(items[hitIdx].dataset.id);
});
const pick = (id) => { $('results').style.display = 'none'; $('search').value = ''; $('search').blur(); select(id, true); };
$('results').addEventListener('click', (ev) => { const el = ev.target.closest('[data-id]'); if (el) pick(el.dataset.id); });
document.addEventListener('click', (ev) => { if (!ev.target.closest('#searchWrap')) $('results').style.display = 'none'; });

// --- chrome ------------------------------------------------------------------
function setUrl() {
  const p = new URLSearchParams();
  if (lang !== 'en') p.set('lang', lang);
  if (f.view !== 'graph') p.set('view', f.view);
  if (byId && (f.ageFrom !== ageMin || f.ageTo !== ageMax)) p.set('age', `${f.ageFrom}-${f.ageTo}`);
  if (f.offSubj.size) p.set('off', [...f.offSubj].join(','));
  if (f.school) p.set('school', f.school);
  if (f.labs) p.set('labs', '1');
  if (f.offSrc.size) p.set('src', SOURCES.filter((x) => !f.offSrc.has(x)).join(','));
  if (focus) p.set('topic', focus);
  if (focus && route) p.set('route', '1');
  history.replaceState(null, '', p.toString() ? `?${p}` : location.pathname);
}

function renderViews() {
  const u = UI[lang];
  $('views').innerHTML = ['graph', 'list', 'routes', 'child'].map((v) => `<button data-v="${v}" class="${f.view === v ? 'on' : ''}${v === 'graph' && noGraph ? ' off' : ''}"${
    v === 'graph' && noGraph ? ` title="${esc(u.noGraph)}"` : ''}>${v === 'child' ? u.kidView : v === 'routes' ? u.routesView : u[v]}</button>`).join('');
}

let noticeTimer = null;
function notice(text) {
  const el = $('notice');
  el.textContent = text; el.hidden = false;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { el.hidden = true; }, 8000);
}
$('notice').onclick = () => { $('notice').hidden = true; clearTimeout(noticeTimer); };

function renderChrome() {
  const u = UI[lang];
  document.documentElement.lang = lang;
  $('search').placeholder = u.search;
  $('brand').title = u.sub(data.topics.length, data.deps.length);
  $('filtersBtn').textContent = '☰ ' + u.filters;
  $('langs').innerHTML = Object.entries(LANGS)
    .map(([k, v]) => `<button data-lang="${k}" class="${k === lang ? 'on' : ''}">${v}</button>`).join('');
  renderViews();
}

// the top bar wraps on narrow screens: content starts under its real height
new ResizeObserver(() => document.documentElement.style.setProperty('--top', `${Math.ceil(document.querySelector('.bar').getBoundingClientRect().bottom) + 12}px`))
  .observe(document.querySelector('.bar'));

$('views').addEventListener('click', (ev) => { const v = ev.target.dataset?.v; if (v && v !== f.view) setView(v); });
$('langs').addEventListener('click', async (ev) => {
  const k = ev.target.dataset?.lang;
  if (!k || k === lang) return;
  lang = k;
  store.set('lang', k);
  await setLang();
});
$('filtersBtn').onclick = () => document.body.classList.toggle('side-open');
$('brand').onclick = () => { select(null); setView('home'); };

async function setLang() {
  try {
    data = await loadLang(lang);
  } catch (err) {
    $('loading').textContent = UI[lang].noData(err.message);
    return;
  }
  index(data);
  if (G) G.setData(...graphData()); // names and tooltips follow the language; positions and the camera stay
  renderChrome();
  kidQ = null;
  if (f.view !== 'graph') $('loading').style.display = 'none';
  applyFilters();
  if (focus) renderPanel();
}

// --- home-screen app: Chrome/Edge/Android offer an install prompt, iOS Safari only "Add to Home Screen" by hand
let installEvt = null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
addEventListener('beforeinstallprompt', (ev) => { ev.preventDefault(); installEvt = ev; if (data) renderSide(); });
addEventListener('appinstalled', () => { installEvt = null; if (data) renderSide(); });
function installBlock(u) {
  if (standalone() || (!installEvt && !isIos)) return '';
  return `<h3>${u.installH}</h3>
    ${installEvt ? `<button class="btn" id="install" style="width:100%">${u.installBtn}</button>` : `<div class="hint">${u.installIos}</div>`}
    <div class="hint">${u.installNote}${isIos ? ' ' + u.installMove : ''}</div>`;
}

// the app shell for the home-screen app and offline labs (sw.js); the site works the same without it
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

(async () => {
  school = await schoolLoad;
  readyRoutes = (await routesLoad)?.routes ?? [];
  computeSchool();
  await setLang();
  const t = params.get('topic');
  if (t && byId.has(t)) focus = t;
  await setView(f.view);
  if (focus) { const id = focus; focus = null; select(id, true); if (params.get('route') === '1' && focus) { route = true; renderPanel(); setUrl(); } }
  importHash(); // once, at startup (a link made by "Copy a link with the progress")
})();
addEventListener('resize', () => G?.resize());
</script>
<script src="labs/viewer.js" defer></script>
<script src="tour.js" defer></script>
