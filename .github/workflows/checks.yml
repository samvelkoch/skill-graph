name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the dataset
        run: node scripts/validate.mjs
      - name: Validate translations
        run: |
          node scripts/i18n-validate.mjs ru
          node scripts/i18n-validate.mjs hu

  labs:
    name: Labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lab catalog is up to date
        run: |
          node scripts/labs-catalog.mjs
          git diff --exit-code -- labs/catalog.json || { echo "::error file=labs/catalog.json::labs/catalog.json is out of date. Run node scripts/labs-catalog.mjs and commit the result."; exit 1; }
      - name: Page scripts parse
        run: node scripts/check-scripts.mjs
      - name: Robot Lab levels are solvable
        run: node scripts/test-robot-lab.mjs
