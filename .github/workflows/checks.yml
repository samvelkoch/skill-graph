name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the dataset
        run: node scripts/validate.mjs
      - name: Validate translations
        run: |
          node scripts/i18n-validate.mjs ru
          node scripts/i18n-validate.mjs hu

  labs:
    name: Labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lab catalog is up to date
        run: |
          node scripts/labs-catalog.mjs
          git diff --exit-code -- labs/catalog.json || { echo "::error file=labs/catalog.json::labs/catalog.json is out of date. Run node scripts/labs-catalog.mjs and commit the result."; exit 1; }
      - name: Page scripts parse
        run: node scripts/check-scripts.mjs
      - name: Robot Lab levels are solvable
        run: node scripts/test-robot-lab.mjs

  changelog:
    name: Changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md has an entry for this pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          if [ "$SKIP" = "true" ]; then echo "Label skip-changelog: not checked."; exit 0; fi
          if git diff --name-only "$BASE"...HEAD | grep -qx 'CHANGELOG.md'; then echo "CHANGELOG.md is updated."; exit 0; fi
          echo "::error file=CHANGELOG.md::Add an entry to CHANGELOG.md under the merge date (and, for a change parents notice, a bullet in changelog/index.html in EN, RU and HU). For a change that needs no entry, add the label skip-changelog."
          exit 1
