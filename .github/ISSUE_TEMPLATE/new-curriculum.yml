name: New school curriculum
description: Map a country's national curriculum onto the topics
title: "Curriculum: "
labels: ["curriculum"]
body:
  - type: markdown
    attributes:
      value: |
        See [Add a country's school curriculum](https://github.com/samvelkoch/skill-graph/blob/main/CONTRIBUTING.md#add-a-countrys-school-curriculum) for the steps.
  - type: input
    id: country
    attributes:
      label: Country
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source
      description: URL of the official document, its name, version and year.
    validations:
      required: true
  - type: input
    id: terms
    attributes:
      label: Terms of use
      description: Under what license or terms is the document published? A link is enough.
    validations:
      required: true
  - type: input
    id: grades
    attributes:
      label: Grades and subjects
      description: For example "grades 1-9; mathematics, sciences, history".
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: How the document is structured, which parts you would leave out, whether you can write the parser.
