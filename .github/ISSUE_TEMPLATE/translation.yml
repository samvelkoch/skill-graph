name: Translation
description: Fix or add a translation of the interface, a lab or the topics
title: "Translation: "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Where each text lives: [Add or fix a translation](https://github.com/samvelkoch/skill-graph/blob/main/CONTRIBUTING.md#add-or-fix-a-translation).
  - type: dropdown
    id: lang
    attributes:
      label: Language
      options:
        - Russian
        - Hungarian
        - English
        - A new language
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: A link to the page or topic (with `?lang=…`), or the lab's name.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it says and what it should say
    validations:
      required: true
