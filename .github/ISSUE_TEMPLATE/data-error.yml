name: Data error
description: A wrong age, prerequisite, description, curriculum link or translation
title: "Data: "
labels: ["data"]
body:
  - type: input
    id: link
    attributes:
      label: Link
      description: Open the topic on the map and copy the link (it contains `?topic=…`).
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - Age range
        - Prerequisite (missing, wrong or reversed)
        - Name or description
        - School curriculum link
        - Translation (Russian or Hungarian)
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it says and what it should say
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: "Why the fix is right: a curriculum, a textbook, a reference."
