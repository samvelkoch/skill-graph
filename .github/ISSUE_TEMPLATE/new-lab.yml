name: New lab
description: Propose a lab, or a better version of an existing one
title: "Lab: "
labels: ["lab"]
body:
  - type: markdown
    attributes:
      value: |
        A lab makes **one idea** obvious to a child of about 6–10 with **one picture** they can play with.
        Pick the topic with `node scripts/labs-candidates.mjs` and read [Add or improve a lab](https://github.com/samvelkoch/skill-graph/blob/main/CONTRIBUTING.md#add-or-improve-a-lab).
  - type: input
    id: topic
    attributes:
      label: Topic
      description: The topic's name and id on the map (open it and copy the link; it contains `?topic=…`).
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The one idea
      description: One sentence a 9-year-old should walk away with.
    validations:
      required: true
  - type: textarea
    id: picture
    attributes:
      label: The picture
      description: What the child sees and does that makes the idea obvious. A sketch is welcome.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Where the facts come from.
  - type: dropdown
    id: build
    attributes:
      label: Will you build it?
      options:
        - Yes, I'd like to build it
        - No, it's an idea for someone else
    validations:
      required: true
