const sumR = (a, i, j) => a.slice(i, j).reduce((x, y) => x + y, 0);

const maxR = (a, i, j) => Math.max(0, ...a.slice(i, j));
function genPass(task) {
  const k = ASK[task];

    const a = task === 'count' ? Array.from({ length: PN }, () => rint(1, 5)) : uniq(PN, 1, 9);
    let ans, w;
    if (task === 'sum') { ans = sumR(a, 0, k); w = [[sumR(a, 1, k + 1), 'oneBased'], [sumR(a, 0, k - 1), 'early']]; }
    else if (task === 'count') { ans = cntR(a, 0, k); w = [[cntR(a, 1, k + 1), 'oneBased'], [cntR(a, 0, PN), 'allAtOnce']]; }
    else { ans = maxR(a, 0, k); w = [[maxR(a, 0, PN), 'allAtOnce'], [maxR(a, 1, k + 1), 'oneBased']]; }
    if (new Set([ans, w[0][0], w[1][0]]).size < 3) continue;
    const opts = [{ v: ans, ok: true }, { v: w[0][0], why: w[0][1] }, { v: w[1][0], why: w[1][1] }].sort((x, y) => x.v - y.v);
    const h = [0];
    for (let i = 0; i < PN; i++) h.push(task === 'sum' ? h[i] + a[i] : task === 'count' ? h[i] + (a[i] >= 4 ? 1 : 0) : Math.max(h[i], a[i]));

  }
}

function mkQ(n, mode) {

}

}

  c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const w = c.measureText(label).width + 12;
  rr(c, x - w / 2, tipY - 27, w, 17, 8.5); c.fillStyle = 'rgba(14,17,34,.9)'; c.fill(); c.lineWidth = 1; c.strokeStyle = GOLD; c.stroke();
  c.fillStyle = '#fff'; c.fillText(label, x, tipY - 18); c.restore();
}
const KW = /(\b(?:for|in|range|if|else|while|return)\b|\d+)/;
function drawCodeLine(c, x, y, s, on) {
  let cx = x;
  for (const part of s.split(KW)) {
    if (!part) continue;
    c.fillStyle = /^(for|in|range|if|else|while|return)$/.test(part) ? (on ? '#c9b3ff' : '#9a8bd0') : /^\d+$/.test(part) ? (on ? '#ffc58a' : '#c49670') : on ? '#ffffff' : '#aab4d6';
    c.fillText(part, cx, y); cx += c.measureText(part).width;

}
function drawCode(c, x, y, w, lines, active) {
  const h = lines.length * 18 + 16;
  c.save();
  rr(c, x, y, w, h, 12); const g = c.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#10162c'); g.addColorStop(1, '#0a0e1f'); c.fillStyle = g; c.fill();
  c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.stroke();
  c.font = '500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'; c.textBaseline = 'middle'; c.textAlign = 'left';
  lines.forEach((ln, i) => {
    const ly = y + 8 + i * 18, on = active.includes(i);
    if (on) { c.fillStyle = 'rgba(245,200,76,.17)'; rr(c, x + 4, ly + 1, w - 8, 16, 6); c.fill(); c.fillStyle = GOLD; rr(c, x + 4, ly + 3, 3, 12, 1.5); c.fill(); }
    drawCodeLine(c, x + 14, ly + 9.5, ln, on);

}
function drawVars(c, W, cy, items, time) {
  c.font = '700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'; c.textBaseline = 'middle'; c.textAlign = 'left';
  const ws = items.map((it) => c.measureText(it.plain ? `${it.k}  ${it.v}` : `${it.k} = ${it.v}`).width + 22);
  let x = (W - ws.reduce((a, b) => a + b, 0) - 8 * (items.length - 1)) / 2;
  items.forEach((it, i) => {
    const w = ws[i], pop = it.at === undefined ? 0 : Math.max(0, 1 - (time - it.at) / 0.35), sc = 1 + 0.12 * pop;
    c.save(); c.translate(x + w / 2, cy); c.scale(sc, sc);
    rr(c, -w / 2, -14, w, 28, 14); c.fillStyle = pop > 0 ? 'rgba(245,200,76,.28)' : 'rgba(18,22,44,.92)'; c.fill();
    c.strokeStyle = pop > 0 ? GOLD : 'rgba(130,145,190,.4)'; c.lineWidth = 1; c.stroke();
    c.fillStyle = it.plain ? '#aab4d6' : '#9fb0ff'; c.fillText(it.k, -w / 2 + 11, 0.5);
    const kw = c.measureText(it.plain ? `${it.k}  ` : `${it.k} = `).width;
    c.fillStyle = '#fff'; c.fillText(String(it.v), -w / 2 + 11 + kw, 0.5);

}

// what to draw for the current view: { cards, n, vmax, flags(k), ptrs, hi, vars, code, active }
function scene(time) {
  const v = lab.view;
  if (v === 'pass') {
    const o = pcur(), el = time - o.stepAt, hasIf = o.task !== 'sum', doneAt = hasIf ? 0.62 : 0.32;
    const shown = o.pos === 0 ? o.h[0] : el >= doneAt ? o.h[o.pos] : o.h[o.pos - 1];
    const best = o.task === 'max' && o.pos > 0 ? o.a.slice(0, o.pos).indexOf(o.h[o.pos]) : -1;
    let active = [0];
    if (o.pos > 0) active = el < 0.25 ? [1] : !hasIf ? [2] : el < 0.55 ? [2] : (o.h[o.pos] !== o.h[o.pos - 1] ? [3] : [2]);
    return {
      cards: o.cards, n: PN, vmax: o.task === 'count' ? 5 : 9, code: CODE[o.task], active,
      flags: (k) => {
        const f = {};
        if (k < o.pos) f.ring = 'soft';
        if (o.task === 'count' && k < o.pos) { if (o.a[k] >= 4) f.badge = '✓'; else f.dim = 0.55; }
        if (best >= 0 && k === best) { f.badge = '★'; f.ring = 'gold'; } else if (k === o.pos - 1) f.ring = 'gold';
        return f;
      },
      ptrs: o.pos > 0 && o.pos <= PN ? [{ id: 'i', label: `i = ${o.pos - 1}`, i: o.pos - 1 }] : [],
      vars: [{ k: VAR[o.task], v: shown, at: o.pos > 0 && el >= doneAt && o.h[o.pos] !== o.h[o.pos - 1] ? o.stepAt + doneAt : undefined }],
    };
  }
  if (v === 'search') {
    const el = time - Q.stepAt;
    let active = [0];
    if (Q.pos > 0) active = el < 0.25 ? [0] : el < 0.55 || (!Q.done) ? [1] : Q.found ? [2] : [3];
    return {
      cards: Q.cards, n: Q.n, vmax: 99, code: CODE.find, active,
      flags: (k) => {
        if (k >= Q.pos) return { closed: true };
        if (Q.found && k === Q.pos - 1) return { ring: 'green', badge: '✓' };
        return k === Q.pos - 1 ? { ring: 'gold' } : { dim: 0.6 };
      },
      ptrs: Q.pos > 0 ? [{ id: 'i', label: `i = ${Q.pos - 1}`, i: Q.pos - 1 }] : [],
      vars: [{ k: 'x', v: Q.x }, { k: T[lang].q.opened, v: Q.pos, plain: true, at: Q.pos > 0 ? Q.stepAt : undefined }],
    };
  }
  // sort
  if (R.mode === 'bin') {
    const b = R.bin, el = time - b.at;
    let active = [2];
    if (b.steps > 0) active = el < 0.3 ? [3] : el < 0.6 || b.found ? [4] : b.dir > 0 ? [5] : [6];
    return {
      cards: R.cards, n: R.n, vmax: 99, code: CODE.bin, active,
      flags: (k) => {
        if (b.found && k === b.mid) return { ring: 'green', badge: '✓' };
        if (k === b.mid) return { ring: 'gold' };
        return k < b.lo || k > b.hi ? { dim: 0.3 } : {};
      },
      ptrs: b.mid >= 0 ? [{ id: 'm', label: 'mid', i: b.mid }] : [],
      vars: [{ k: 'x', v: b.x }, { k: 'lo', v: b.lo }, { k: 'hi', v: b.hi }],
    };
  }
  const el = time - R.cmpAt, L = R.last, asking = R.guess === null;
  let active = [1];
  if (L && !R.done) active = el < 0.3 ? [2] : L.sw ? [3] : [2];
  if (R.done) active = [];
  return {
    cards: R.cards, n: R.n, vmax: 99, code: CODE.bub, active,
    flags: (k) => {
      const f = {};
      if (!asking && k >= R.n - R.p) f.ring = 'soft';
      if (L && !R.done && (k === L.j || k === L.j + 1)) f.ring = L.sw ? 'gold' : 'white';
      if (R.done) f.ring = 'green';
      return f;
    },
    ptrs: L && !R.done ? [{ id: 'j', label: 'j', i: L.j }, { id: 'j1', label: 'j+1', i: L.j + 1 }] : [],
    vars: asking ? [] : [{ k: 'p', v: R.p, plain: false, at: undefined }, { k: lang === 'ru' ? 'сравн.' : lang === 'hu' ? 'össz.' : 'cmp', v: R.cmp, plain: true }, { k: lang === 'ru' ? 'обмен.' : lang === 'hu' ? 'csere' : 'swaps', v: R.swp, plain: true }],
  };
}

function update(dt) {
  const v = lab.view;
  let changed = false;
  if (v === 'pass') { const o = pcur(); if (o.auto) { o.acc += dt; if (o.acc > 0.9) { o.acc = 0; changed = stepP(); } } }
  else if (v === 'search') { if (Q.auto) { Q.acc += dt; if (Q.acc > 0.6) { Q.acc = 0; changed = stepQ(); } } }
  else if (R.auto && R.mode === 'bub') {
    const d = R.n <= 5 ? 0.55 : R.n <= 10 ? 0.22 : 0.07;
    R.acc += dt;
    while (R.acc >= d && R.auto) { R.acc -= d; changed = stepR() || changed; }
  }
  if (changed) { const auto = v === 'pass' ? pcur().auto : v === 'search' ? Q.auto : R.auto; render(!auto); }
}

canvasLoop($('cv'), (c, W0, H0, dt, time) => {
  update(dt);
  const sc = scene(time), n = sc.n, per = n > 10 ? 10 : n, rows = Math.ceil(n / per), codeH = sc.code.length * 18 + 16;
  const need = (Wp) => { const sw = Math.min(54, (Wp - 24) / per), pitch = sw + 50; return { sw, pitch, H: 14 + 22 + (rows - 1) * pitch + sw + 30 + 40 + codeH + 16 }; };
  const k = Math.min(1, H0 / need(W0).H), W = W0 / k, H = H0 / k;
  const { sw, pitch, H: Hd } = need(W), x0 = (W - per * sw) / 2, extra = Math.max(0, H - Hd);
  const yTop = 14 + extra * 0.2, rowTop = (r) => yTop + 22 + r * pitch;
  const slot = (i) => [x0 + ((i % per) + 0.5) * sw, rowTop(Math.floor(i / per)) + sw / 2];
  c.save(); c.scale(k, k);
  c.lineJoin = 'round';
  // trays with the slot wells and the index labels
  for (let r = 0; r < rows; r++) {
    const cnt = Math.min(per, n - r * per), ty = rowTop(r) - 6, th = sw + 28, tw = per * sw + 16;
    const g = c.createLinearGradient(0, ty, 0, ty + th); g.addColorStop(0, '#171d3c'); g.addColorStop(1, '#0e1329');
    rr(c, x0 - 8, ty, tw, th, 14); c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(130,145,190,.22)'; c.lineWidth = 1; c.stroke();
    for (let q = 0; q < cnt; q++) {
      rr(c, x0 + q * sw + 2, rowTop(r) + 2, sw - 4, sw - 4, 9); c.fillStyle = 'rgba(0,0,0,.34)'; c.fill(); c.strokeStyle = 'rgba(130,145,190,.16)'; c.stroke();
    }
  }
  const hi = new Set(sc.ptrs.map((p) => p.i));
  c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let i = 0; i < n; i++) { const [cx] = slot(i); c.fillStyle = hi.has(i) ? GOLD : '#7f89ad'; c.fillText(String(i), cx, rowTop(Math.floor(i / per)) + sw + 12); }
  // cards glide to their slots (a swap makes two cards pass each other)
  const cs = sw - 6;
  sc.cards.forEach((cd, i) => {
    const [tx, ty] = slot(i);
    if (cd.x === undefined || !isFinite(cd.x)) { cd.x = tx; cd.y = ty; } else { const f = Math.min(1, dt * 9); cd.x += (tx - cd.x) * f; cd.y += (ty - cd.y) * f; }
    cd.dx = tx - cd.x; cd.dy = ty - cd.y;
  });
  sc.cards.forEach((cd, i) => {
    const dist = Math.hypot(cd.dx, cd.dy), side = Math.sign(cd.dx) * Math.min(7, dist * 0.25);
    drawCard(c, cd.x, cd.y - side, cs, cd.v, sc.vmax, sc.flags(i), Math.min(8, dist * 0.3));
  });
  // pointers
  const live = new Set();
  sc.ptrs.forEach((p) => {
    live.add(p.id);
    const [tx, ty] = slot(p.i), tipY = ty - sw / 2 - 3;
    const s = (PTR[p.id] ??= { x: tx, y: tipY, a: 0, label: p.label }); s.label = p.label;
    s.x += (tx - s.x) * Math.min(1, dt * 12); s.y += (tipY - s.y) * Math.min(1, dt * 12); s.a = Math.min(1, s.a + dt * 6);
    drawPtr(c, s.x, s.y, p.label, s.a);
  });
  Object.keys(PTR).forEach((id) => { if (!live.has(id)) { const s = PTR[id]; s.a -= dt * 6; if (s.a > 0) drawPtr(c, s.x, s.y, s.label, s.a); else delete PTR[id]; } });
  // variables and the code
  const yV = rowTop(rows - 1) + sw + 30 + extra * 0.3;
  drawVars(c, W, yV + 14, sc.vars.map((it) => ({ ...it })), time);
  const cw = Math.min(W - 16, 340);
  drawCode(c, (W - cw) / 2, yV + 40, cw, sc.code, sc.active);
  c.restore();
});

// --- controls ----------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (v === 'pass') {
    const o = pcur();
    if (act === 'task') { o.auto = false; P.task = b.dataset.k; sfx.click(); }
    else if (act === 'pick') { o.guess = +b.dataset.i; sfx.click(); }
    else if (act === 'step') stepP();
    else if (act === 'run') { if (o.pos >= PN) return; o.auto = !o.auto; o.acc = 0.9; sfx.click(); }
    else if (act === 'fresh') { P.by[P.task] = genPass(P.task); sfx.click(); }
  } else if (v === 'search') {
    if (act === 'pick') { Q.guess = +b.dataset.i; sfx.click(); }
    else if (act === 'step') stepQ();
    else if (act === 'run') { if (Q.done) return; Q.auto = !Q.auto; Q.acc = 0.6; sfx.click(); }
    else if (act === 'another') { Object.assign(Q, mkQ(Q.n, 'present')); sfx.click(); }
    else if (act === 'absent') { Object.assign(Q, mkQ(Q.n, 'absent')); sfx.click(); }
    else if (act === 'size') { Object.assign(Q, mkQ(+b.dataset.n, 'present')); sfx.click(); }
  } else {
    if (act === 'pick') { R.guess = b.dataset.k; sfx.click(); }
    else if (act === 'size') { R.n = +b.dataset.n; resetR(); sfx.click(); }
    else if (act === 'step') { if (R.mode === 'bin') stepBin(); else stepR(); }
    else if (act === 'run') { if (R.done) return; R.auto = !R.auto; R.acc = 1; sfx.click(); }
    else if (act === 'finish') { while (!R.done) stepR(); }
    else if (act === 'fresh') { resetR(); sfx.click(); }
    else if (act === 'again') { const x = R.cards[rint(0, R.n - 1)].v; R.bin = { lo: 0, hi: R.n - 1, mid: -1, steps: 0, found: false, x, at: -9 }; sfx.click(); }
    else if (act === 'sec') {
      if (!secret.unlocked()) return secret.open();
      if (b.dataset.k === 'worst') { R.worst = R.mode === 'bub' ? !R.worst : true; R.mode = 'bub'; }
      else { R.mode = R.mode === 'bin' ? 'bub' : 'bin'; R.worst = false; }
      resetR(); sfx.click();
    }
  }
  render();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
const chip = (act, label, extra = '', on = false) => `<button class="sl-chip${on ? ' on' : ''}" data-act="${act}" ${extra}>${esc(label)}</button>`;
function render(full = true) {
  const t = T[lang], v = lab.view;
  if (v === 'pass') renderP(t, full); else if (v === 'search') renderQ(t, full); else renderR(t, full);
}

function renderP(t, full) {
  const o = pcur(), p = t.p, k = ASK[o.task], nm = VAR[o.task], last = o.pos > 0 ? o.pos - 1 : -1;
  lab.setGlow('rgba(95, 168, 160, .26)');
  lab.setReadout(o.h[o.pos], `${nm} · ${p.stepN(o.pos, PN)}`, '', '#5fa8a0');
  if (full) {
    const opts = o.opts.map((op, i) => {
      const cls = o.guess === i ? (o.revealed ? (op.ok ? 'good' : 'bad') : 'pick') : o.revealed && op.ok ? 'good' : '';
      return `<button class="sl-opt ${cls}" data-act="pick" data-i="${i}"${o.guess !== null ? ' disabled' : ''}>${op.v}</button>`;
    }).join('');
    const run = o.guess === null ? '' : `<div class="sl-row"><button class="sl-btn" data-act="step"${o.pos >= PN ? ' disabled' : ''}>${esc(t.step)}</button>${chip('run', o.auto ? t.pause : t.run, o.pos >= PN ? 'disabled' : '')}</div>`;
    $('ctrlBody').innerHTML = `<div class="chips">${['sum', 'count', 'max'].map((x) => chip('task', p.tasks[x], `data-k="${x}"`, x === o.task)).join('')}${chip('fresh', t.fresh)}</div>
      <div class="sl-note">${esc(p.note[o.task])}</div><div class="sl-q">${esc(p.q[o.task](k))}</div><div class="sl-opts">${opts}</div>${run}`;
  }
  const desc = last >= 0 ? p.d[o.task](last, o.a[last], o.h[last], o.h[last + 1]) : '';
  if (o.guess === null) lab.setState({ emo: '🤔', title: p.askT, lead: p.askL, body: '', extra: '' });
  else if (o.pos >= PN) {
    lab.setState({ emo: '🏁', title: `${nm} = ${o.h[PN]}`, lead: p.finL, body: desc, extra: '' });
  } else if (!o.revealed) lab.setState({ emo: '🔁', title: p.runT, lead: o.pos === 0 ? p.start : desc, body: '', extra: '' });
  else {
    const g = o.opts[o.guess], hit = g.ok;
    lab.setState({ emo: hit ? '✅' : '🤔', title: hit ? t.ok : p.notQ(o.ans), lead: p.reach(k, nm, o.ans), body: hit ? desc : `${typeof p.why[g.why] === 'function' ? p.why[g.why](k) : p.why[g.why]} ${desc}`, extra: '' });
  }
  lab.setFacts(t.f1);
}

function renderQ(t, full) {
  const q = t.q, opening = Q.mode === 'last';
  lab.setGlow('rgba(224, 176, 80, .24)');
  lab.setReadout(Q.pos, q.opened, Q.found ? '✓' : '', '#e0b050');
  if (full) {
    let html = '';
    if (opening) {
      const opts = Q.opts.map((n) => {
        const cls = Q.guess === n ? (Q.done ? (n === Q.n ? 'good' : 'bad') : 'pick') : Q.done && n === Q.n ? 'good' : '';
        return `<button class="sl-opt ${cls}" data-act="pick" data-i="${n}"${Q.guess !== null ? ' disabled' : ''}>${n}</button>`;
      }).join('');
      html += `<div class="sl-q" style="margin-top:0">${esc(q.q(Q.n))}</div><div class="sl-opts">${opts}</div>`;
    }
    if (Q.guess !== null) {
      html += `<div class="sl-row"><button class="sl-btn" data-act="step"${Q.done ? ' disabled' : ''}>${esc(q.open)}</button>${chip('run', Q.auto ? t.pause : t.run, Q.done ? 'disabled' : '')}</div>`;
      if (Q.done) {
        html += `<div class="sl-row">${chip('another', q.another)}${chip('absent', q.absent)}</div>
          <div class="sl-row">${[10, 20].map((n) => chip('size', q.size(n), `data-n="${n}"`, Q.n === n)).join('')}</div>`;
      }
    }
    $('ctrlBody').innerHTML = html;
  }
  const last = Q.pos - 1;
  if (Q.guess === null) lab.setState({ emo: '🤔', title: q.askT, lead: q.askL, body: '', extra: '' });
  else if (Q.pos === 0) lab.setState({ emo: '📦', title: q.runT, lead: q.start, body: '', extra: '' });
  else if (!Q.done) lab.setState({ emo: '📦', title: q.runT, lead: q.d(last, Q.cards[last].v, Q.x, false), body: '', extra: '' });
  else if (Q.found && opening) {
    const hit = Q.guess === Q.pos;
    lab.setState({ emo: hit ? '✅' : '🤔', title: hit ? t.ok : q.notQ(Q.pos), lead: q.found(last, Q.pos), body: hit ? '' : (q.why[Q.guess] || ''), extra: '' });
  } else if (Q.found) lab.setState({ emo: '🎯', title: q.fT(Q.pos), lead: q.found(last, Q.pos), body: '', extra: '' });
  else lab.setState({ emo: '🚫', title: q.absT, lead: q.absL(Q.n), body: '', extra: '' });
  lab.setFacts(t.f2);
}

function renderR(t, full) {
  const r = t.r, asking = R.guess === null, bin = R.mode === 'bin', open = secret.unlocked();
  lab.setGlow('rgba(143, 127, 208, .26)');
  if (bin) lab.setReadout(R.bin.steps, r.secrets.half[0], R.bin.found ? '✓' : '', '#8f7fd0');
  else lab.setReadout(R.cmp, lang === 'ru' ? 'сравнений' : lang === 'hu' ? 'összehasonlítás' : 'comparisons', asking ? '' : `${R.swp} ${lang === 'ru' ? 'обменов' : lang === 'hu' ? 'csere' : 'swaps'}`, '#8f7fd0');
  if (full) {
    let html = '';
    if (asking) {
      const opts = R.opts.map((k) => `<button class="sl-opt long" data-act="pick" data-k="${k}">${esc(r.o[k])}</button>`).join('');
      html = `<div class="sl-q" style="margin-top:0">${esc(r.q)}</div><div class="sl-opts">${opts}</div>`;
    } else {
      html += `<div class="sl-row" style="margin-top:0">${[5, 10, 20].map((n) => chip('size', T[lang].q.size(n), `data-n="${n}"`, R.n === n)).join('')}</div>`;
      if (bin) html += `<div class="sl-row"><button class="sl-btn" data-act="step"${R.bin.found ? ' disabled' : ''}>${esc(r.binStep)}</button>${chip('again', t.q.another)}${chip('fresh', t.fresh)}</div>`;
      else html += `<div class="sl-row"><button class="sl-btn" data-act="step"${R.done ? ' disabled' : ''}>${esc(t.step)}</button>${chip('run', R.auto ? t.pause : t.run, R.done ? 'disabled' : '')}${R.p1Seen && !R.done ? chip('finish', t.finish) : ''}${chip('fresh', t.fresh)}</div>`;
      const sc = (k, emo, on) => `<button class="sl-chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(r.secrets[k][0])}` : '🔒 ???'}</button>`;
      html += `<div class="sl-row">${sc('worst', '↩️', R.worst && !bin)}${sc('half', '✂️', bin)}</div>`;
    }
    $('ctrlBody').innerHTML = html;
  }
  // the state card
  const tblDone = [5, 10, 20].some((n) => R.table[n] !== null);
  if (asking) { lab.setState({ emo: '🤔', title: r.askT, lead: r.askL, body: '', extra: '' }); lab.setFacts([...t.f3]); return; }
  if (bin) {
    const b = R.bin, m = Math.floor(Math.log2(R.n)) + 1;
    if (b.found) lab.setState({ emo: '✂️', title: r.foundT(b.steps), lead: r.foundL(R.n, m), body: '', extra: '' });
    else if (b.steps === 0) lab.setState({ emo: '✂️', title: r.binRunT, lead: r.binAsk(b.x), body: '', extra: '' });
    else { const v = R.cards[b.mid].v; lab.setState({ emo: '✂️', title: r.binRunT, lead: v < b.x ? r.less(v, b.x) : r.more(v, b.x), body: '', extra: '' }); }
    lab.setFacts([...t.f3]); return;
  }
  const hit = R.guess === 'max', L = R.last;
  const cmpLine = L ? r.cmpD(L.a, L.b, L.sw) : '';
  if (R.verdictOn) lab.setState({ emo: hit ? '✅' : '🤔', title: hit ? r.vT : r.vTno, lead: r.vL(R.max0), body: r.vB, extra: '' });
  else if (R.done) {
    const tbl = `<div class="sl-cap">${esc(r.tbl)}</div><div class="sl-tbl">${[5, 10, 20].map((n) => `<div class="${R.n === n ? 'on' : ''}"><span>${n}</span><b>${R.table[n] ?? '—'}</b></div>`).join('')}</div>`;
    const pair = R.table[10] !== null && R.table[20] !== null ? [10, 20] : R.table[5] !== null && R.table[10] !== null ? [5, 10] : null;
    const ratio = pair ? `<div class="sl-cap">${esc(r.ratio(pair[0], pair[1], R.table[pair[0]], R.table[pair[1]], dec(R.table[pair[1]] / R.table[pair[0]])))}</div>` : '';
    lab.setState({ emo: '🏁', title: r.doneT, lead: r.doneL(R.n, R.cmp, R.swp), body: R.swp === R.cmp ? r.allSwap : '', extra: tbl + ratio });
  } else lab.setState({ emo: '🫧', title: r.runT, lead: L ? cmpLine : r.start, body: '', extra: '' });
  lab.setFacts(tblDone ? [...t.f3, t.f3b] : [...t.f3]);
}
render();
</script>
