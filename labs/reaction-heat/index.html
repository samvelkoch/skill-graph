// --- the loop: integrate the state, then draw the current view -----------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  // integrate
  if (S.run1) { S.raw1 = Math.min(1, S.raw1 + dt / 4.6); if (S.raw1 >= 1) S.run1 = false; }
  if (S.run3) { S.raw3 = Math.min(1, S.raw3 + dt / 2.6); if (S.raw3 >= 1) S.run3 = false; }
  const hp = hump2(), pk = peakOf(S.pl, hp);
  if (S.p2 === null) { S.u2 = 0; S.e = 0; S.run2 = false; }
  else if (!S.run2 && !S.done2) {
    S.e = Math.max(0, S.e - dt * 0.3);
    const tgt = pk.u * clamp01(S.e / hp);
    S.u2 += (tgt - S.u2) * Math.min(1, dt * 9);
    if (S.e >= hp - 1e-6) { S.run2 = true; render(); }
  } else if (S.run2) {
    S.u2 = Math.min(1, S.u2 + dt * (0.3 + 0.35 * Math.sin(Math.PI * clamp01(S.u2 / 0.8)) + 0.15));
    if (S.u2 >= 1) { S.run2 = false; S.done2 = true; S.e = 0; render(); }
  }
  const Tt = tempNow();
  S.Td += (Tt - S.Td) * Math.min(1, dt * 9);
  if (Math.abs(Tt - S.Td) < 0.02) S.Td = Tt;
  S.SC = Math.min(w / W, h / H); S.ox = (w - W * S.SC) / 2; S.oy = (h - H * S.SC) / 2;
  c.save(); c.translate(S.ox, S.oy); c.scale(S.SC, S.SC);
  if (v === 'mix') {
    const rx = rxNow(), done = !!S.done1[rx.id], u = u1(), act = Math.sin(Math.PI * clamp01((u - 0.3) / 0.7));
    drawThermo(c, S.Td);
    const gas = ['mg', 'cit', 'cao'].includes(rx.id) || (rx.id === 'ch4' && u > 0.7);
    const liq = rx.id === 'neu' ? mixHex('#e86aa8', '#9fe0b8', sstep(u / 0.9)) : rx.id === 'fe' ? '#d7c7ad' : rx.id === 'cit' ? '#f2ecc2' : '#cfe3ff';
    drawBeaker(c, time, { kind: rx.id === 'cao' ? 'can' : 'beaker', liq, solid: { mg: 'ribbon', fe: 'powder', cit: 'white', kcl: 'white' }[rx.id], act, prog: u, bubbles: gas && done,
      burner: rx.id === 'ch4', flame: rx.id === 'ch4' && done ? sstep((u - 0.12) / 0.25) * 0.9 + 0.1 * (u > 0.4 ? 1 : 0) : 0, spark: rx.id === 'ch4' && done ? clamp01(1 - Math.abs(u - 0.06) / 0.06) : 0, Tnow: S.Td });
    drawProfile(c, time, R1, { lv: rx.lv, ea: rx.ea, u, show: done });
    drawGraph(c, G1, rx.dT, u, done);
  } else if (v === 'lad') {
    const u = S.u2, act = Math.sin(Math.PI * clamp01((u - 0.3) / 0.7));
    drawThermo(c, S.Td);
    drawBeaker(c, time, { kind: 'beaker', liq: '#cfe3ff', solid: null, act, prog: u, bubbles: S.p2 !== null && S.pl < -0.1 && u > 0.3 && u < 1, flame: 0, spark: 0, Tnow: S.Td });
    drawProfile(c, time, R2, { lv: S.pl, ea: hp, u, show: true, handle: S.p2 !== null, humpLabel: true, noArrow: S.p2 === null, ghost: S.cat ? S.ea : 0, spark: clamp01(1 - (time - S.sparkAt) / 0.35) });
  } else {
    const card = cardNow(), shown = !!S.sort3[card.id], u = u3();
    drawSystem(c, time, card, shown, u);
    drawProfile(c, time, R2, { lv: card.lv, ea: card.ea, u, show: shown });
  }
  c.restore();
  syncReadout();
});

  const b = ev.target.closest('button'); if (!b) return;
  const rx = rxNow();
  if (b.dataset.g) {
    const up = b.dataset.g === 'up'; S.g1[rx.id] = up; S.ok1[rx.id] = up === rx.dT > 0; S.done1[rx.id] = true; S.raw1 = 0; S.run1 = true;
    (S.ok1[rx.id] ? sfx.good : sfx.bad)(); render(); showStage();
  } else if (b.dataset.act === 'again') { S.raw1 = 0; S.run1 = true; sfx.click(); render(); showStage(); }
  else if (b.dataset.act === 'next') { const nx = NORMAL.findIndex((r, k) => k > S.i && !S.done1[r.id]); pickRx(nx >= 0 ? nx : (S.i + 1) % NORMAL.length); }
});

$('ask2').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-g]'); if (!b || S.p2 !== null) return;
  S.p2 = b.dataset.g; S.ok2 = S.p2 === 'up'; S.e = 9; S.moved2 = false;
  (S.ok2 ? sfx.good : sfx.bad)(); render(); showStage();
});
$('plR').addEventListener('input', () => { S.pl = +$('plR').value / 100; S.moved2 = true; render(); });
$('huR').addEventListener('input', () => { S.ea = +$('huR').value / 100; render(); });
$('sparkB').addEventListener('click', () => {
  if (S.p2 === null || S.run2 || S.done2) return;
  S.e += 0.25; S.sparkAt = performance.now() / 1000; sfx.tick(); render();
});
const resetLad = () => { S.u2 = 0; S.e = 0; S.run2 = false; S.done2 = false; };
$('resetB').addEventListener('click', () => { resetLad(); sfx.click(); render(); });
$('secB').addEventListener('click', () => {
  if (!secret.unlocked()) return secret.open();
  S.cat = !S.cat; sfx.click(); render();
});
// drag the products level on the picture
const evDesign = (ev) => { const r = $('cv').getBoundingClientRect(); return [(ev.clientX - r.left - S.ox) / S.SC, (ev.clientY - r.top - S.oy) / S.SC]; };
const plFromY = (y) => { const [lo, hi] = RANGE.lad, G = geom(R2, lo, hi); return clamp(hi - (y - G.py) / G.ph * (hi - lo), -1, 1); };
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'lad' || S.p2 === null) return;
  const [x, y] = evDesign(ev), [lo, hi] = RANGE.lad, G = geom(R2, lo, hi);
  if (x < G.px + G.pw * 0.4 || x > R2.x + R2.w || Math.abs(y - G.yE(S.pl)) > 28) return;
  S.drag = true; $('cv').setPointerCapture(ev.pointerId); ev.preventDefault();
});
$('cv').addEventListener('pointermove', (ev) => {
  if (!S.drag) return;
  S.pl = plFromY(evDesign(ev)[1]); S.moved2 = true; render();
});
const endDrag = () => { S.drag = false; };
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag);

$('cardChips').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-c]'); if (!b) return;
  S.ci = +b.dataset.c; S.raw3 = S.sort3[cardNow().id] ? 1 : 0; S.run3 = false; sfx.click(); render();
});
$('ask3').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const card = cardNow();
  if (b.dataset.s) {
    if (S.p2 === null) return;
    const out = b.dataset.s === 'out'; S.sort3[card.id] = { out, ok: out === card.out }; S.raw3 = 0; S.run3 = true;
    (S.sort3[card.id].ok ? sfx.good : sfx.bad)(); render(); showStage();
  } else if (b.dataset.act === 'lad') { $('views').querySelector('[data-view="lad"]')?.click(); }
  else if (b.dataset.act === 'next') { const nx = CARDS.findIndex((x, k) => k > S.ci && !S.sort3[x.id]); S.ci = nx >= 0 ? nx : (S.ci + 1) % CARDS.length; S.raw3 = S.sort3[cardNow().id] ? 1 : 0; S.run3 = false; sfx.click(); render(); }
});

// --- readout: called every frame (cheap: only writes when the text changes) and from render() --------------------
function syncReadout() {
  const t = T[lang], v = lab.view, Tn = Math.round(S.Td);
  let val, sub, pill, col;
  if (v === 'mix') {
    const rx = rxNow(), done = !!S.done1[rx.id], d = Tn - T0;
    val = `${Tn} °C`; sub = rx.secret ? t.mix.start : t.mix.tally(tallyUp(), tallyDown()) + ' · ' + t.mix.start;
    pill = done && Math.abs(d) >= 1 ? `${sgn(d)} °C` : ''; col = !done || d === 0 ? '#8fa6d8' : d > 0 ? '#ff7a59' : '#5aa9ff';
  } else if (v === 'lad') {
    const d = Tn - T0;
    val = `${Tn} °C`; sub = t.mix.start; pill = S.p2 !== null && S.done2 ? `${sgn(d)} °C` : ''; col = S.p2 === null || d === 0 ? '#8fa6d8' : d > 0 ? '#ff7a59' : '#5aa9ff';
  } else {
    const n = Object.keys(S.sort3).length, cs = S.sort3[cardNow().id];
    val = `${n}/6`; sub = t.life.sorted(n); pill = cs ? (cardNow().out ? t.life.outS : t.life.inS) : ''; col = !cs ? '#8fa6d8' : cardNow().out ? '#ff7a59' : '#5aa9ff';
  }
  const key = [v, val, sub, pill, col, lang].join('|');
  if (key === S.rkey) return;
  S.rkey = key; lab.setReadout(val, sub, pill, col);
}

// --- one render per change: chips, buttons, state card, facts ------------------------------------------------
function render() {
  const v = lab.view;
  document.body.dataset.v = v;
  $('c1').hidden = v !== 'mix'; $('c2').hidden = v !== 'lad'; $('c3').hidden = v !== 'life';
  if (v === 'mix') renderMix(T[lang]); else if (v === 'lad') renderLad(T[lang]); else renderLife(T[lang]);
  S.rkey = ''; syncReadout();
  lab.checkStage?.();
}

function renderMix(t) {
  const rx = rxNow(), id = rx.id, done = !!S.done1[id], nm = t.rx[id];
  lab.setGlow('rgba(255, 140, 90, .24)');
  $('rxChips').innerHTML = NORMAL.map((r, k) => {
    const m = S.done1[r.id] ? `<span class="rh-m ${r.dT > 0 ? 'u' : 'd'}">${r.dT > 0 ? '▲' : '▼'}</span>` : '';
    return `<button type="button" class="chip rh-chip ${k === S.i ? 'on' : ''}" data-i="${k}">${m}${esc(t.rx[r.id][0])}</button>`;
  }).join('');
  const open = secret.unlocked();
  $('secA').textContent = open ? t.sec.a : '🔒 ???'; $('secA').classList.toggle('open', open); $('secA').classList.toggle('on', S.i === 6);
  if (rx.secret) $('ask1').innerHTML = '';
  else if (!done) $('ask1').innerHTML = `<p class="rh-q">${esc(t.mix.qBtn)}</p><div class="rh-pred"><button type="button" class="rh-pb w" data-g="up">${esc(t.warm)}</button><button type="button" class="rh-pb c" data-g="down">${esc(t.cold)}</button></div>`;
  else $('ask1').innerHTML = `<div class="rh-acts"><button type="button" class="chip rh-chip" data-act="again">${esc(t.mix.again)}</button>${finishedCount() < 6 ? `<button type="button" class="btn" data-act="next">${esc(t.mix.next)}</button>` : ''}</div>`;
  if (!done) {
    lab.setState({ emo: '🤔', title: t.mix.pendT, lead: t.mix.pendL(S.i + 1, 6, nm[1]), body: t.mix.pendB, extra: `<div class="fine">${esc(t.mix.fine)}</div>` });
    lab.setFacts([]); return;
  }
  const up = rx.dT > 0;
  if (rx.secret) lab.setState({ emo: '🥫', title: nm[1], lead: nm[2], body: t.exo, extra: `<div class="fine">${esc(t.mix.fine)}</div>` });
  else {
    const all = finishedCount() === 6;
    lab.setState({ emo: up ? '🔥' : '🧊', title: `${S.ok1[id] ? t.right : t.wrong} ${up ? t.gotUp : t.gotDown}`, lead: nm[2], body: up ? t.exo : t.endo,
      extra: `<div class="fine">${esc(t.mix.fine)}</div>${all ? `<p class="body" style="margin:8px 0 0">${esc(t.mix.all(tallyUp(), tallyDown()))}</p>` : ''}` });
  }
  const fx = t.fx1[id];
  lab.setFacts(fx ? [{ emo: '💡', text: fx, src: FSRC.mix[id] }] : []);
}
const FSRC = {
  mix: { mg: 'https://edu.rsc.org/experiments/exothermic-metal-acid-reactions/1731.article', fe: 'https://en.wikipedia.org/wiki/Hand_warmer', ch4: 'https://en.wikipedia.org/wiki/Methane', cao: 'https://en.wikipedia.org/wiki/Calcium_oxide' },
  lad: ['https://en.wikipedia.org/wiki/Endothermic_process', 'https://en.wikipedia.org/wiki/Endothermic_process'],
  life: ['https://en.wikipedia.org/wiki/Hand_warmer', 'https://en.wikipedia.org/wiki/Ice_pack', 'https://en.wikipedia.org/wiki/Photosynthesis'],
};

function renderLad(t) {
  const L = t.lad, pend = S.p2 === null;
  lab.setGlow('rgba(255, 190, 90, .22)');
  $('ask2').hidden = !pend; $('ladCtl').hidden = pend;
  if (pend) $('ask2').innerHTML = `<p class="rh-q">${esc(L.pendT)}</p><div class="rh-pred"><button type="button" class="rh-pb w" data-g="up">${esc(t.warm)}</button><button type="button" class="rh-pb c" data-g="down">${esc(t.cold)}</button></div>`;
  $('plLbl').textContent = L.ptitle; $('plLo').textContent = L.lo; $('plHi').textContent = L.hi; $('huLbl').textContent = L.hump;
  const pv = Math.round(S.pl * 100); if (+$('plR').value !== pv) $('plR').value = pv;
  const hv = Math.round(S.ea * 100); if (+$('huR').value !== hv) $('huR').value = hv;
  $('sparkB').textContent = L.spark; $('resetB').textContent = L.reset;
  $('sparkB').disabled = S.run2 || S.done2; $('sparkB').style.opacity = S.run2 || S.done2 ? 0.4 : 1;
  const open = secret.unlocked();
  $('secB').textContent = open ? (S.cat ? t.sec.onB : t.sec.b) : '🔒 ???'; $('secB').classList.toggle('open', open); $('secB').classList.toggle('on', S.cat);
  if (pend) {
    lab.setState({ emo: '🤔', title: L.pendT, lead: L.pendL, body: L.pendB, extra: '' });
    lab.setFacts([]); return;
  }
  const lvl = S.pl < -0.1 ? [L.outT, L.outL, '🔥'] : S.pl > 0.1 ? [L.inT, L.inL, '🧊'] : [L.eqT, L.eqL, '⚖️'];
  const step = S.run2 ? L.going : S.done2 ? L.done : L.idle;
  const first = !S.moved2 ? (S.ok2 ? L.hit : L.miss) : '';
  lab.setState({ emo: lvl[2], title: S.cat ? L.catT : lvl[0], lead: first + (S.cat ? L.catOn : lvl[1]), body: step, extra: `<div class="fine">${esc(t.exo)}<br>${esc(t.endo)}</div>` });
  lab.setFacts(t.fx2.map((x, k) => ({ emo: '💡', text: x, src: FSRC.lad[k] })));
}

function renderLife(t) {
  const L = t.life, card = cardNow(), cs = S.sort3[card.id], nm = t.cards[card.id];
  lab.setGlow('rgba(110, 200, 150, .22)');
  $('cardChips').innerHTML = CARDS.map((x, k) => {
    const s = S.sort3[x.id], m = s ? `<span class="rh-m ${x.out ? 'u' : 'd'}">${x.out ? '▲' : '▼'}</span>` : '';
    return `<button type="button" class="chip rh-card ${k === S.ci ? 'on' : ''}" data-c="${k}"><span class="rh-e">${x.emo}</span>${m}${esc(t.cards[x.id][0])}</button>`;
  }).join('');
  const nDone = Object.keys(S.sort3).length, locked = S.p2 === null && !cs;
  if (locked) $('ask3').innerHTML = `<p class="rh-q">${esc(L.lock)}</p><button type="button" class="btn" data-act="lad">${esc(L.toLad)}</button>`;
  else if (!cs) $('ask3').innerHTML = `<p class="rh-q">${esc(nm[0])}: ${esc(nm[1])}</p><div class="rh-pred"><button type="button" class="rh-pb w" data-s="out">${esc(L.outB)}</button><button type="button" class="rh-pb c" data-s="in">${esc(L.inB)}</button></div>`;
  else $('ask3').innerHTML = nDone < 6 ? `<div class="rh-acts"><button type="button" class="btn" data-act="next">${esc(L.next)}</button></div>` : '';
  if (!cs) {
    lab.setState({ emo: card.emo, title: L.pendT, lead: L.pendL(S.ci + 1, 6), body: `${nm[0]}: ${nm[1]}`, extra: '' });
    lab.setFacts([]); return;
  }
  lab.setState({ emo: card.out ? '🔥' : '🧊', title: `${cs.ok ? L.okT : L.noT} ${nm[0]}`, lead: nm[2], body: `${card.out ? L.outS : L.inS}: ${nm[3]}. ${card.out ? t.exo : t.endo}`,
    extra: nDone === 6 ? `<p class="body" style="margin:8px 0 0">${esc(L.allT)} ${esc(L.allL)}</p>` : '' });
  // the facts that name a beaker's chemistry wait until that beaker has been answered
  const f3 = t.fx3.map((x, k) => ({ emo: '💡', text: x, src: FSRC.life[k] })).filter((_, k) => k === 2 || (k === 0 ? S.done1.fe : S.done1.kcl));
  lab.setFacts(nDone === 6 ? f3 : []);
}
render();
</script>
