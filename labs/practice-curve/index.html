  }
  if (S.sec === 'own' && O.p < 20) { const old = days(O.p); O.p = Math.min(20, O.p + dt * 6); if (days(O.p) !== old) render(); }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  SC = Math.min(w / W, h / H);
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#14172e'); bg.addColorStop(1, '#0c0e1d'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  step(dt);
  c.save(); c.translate((w - W * SC) / 2, (h - H * SC) / 2); c.scale(SC, SC);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const t = T[lang];
  if (S.sec === 'brain') drawBrain(c, time, t);
  else if (S.sec === 'own') drawOwn(c, time, t);
  else if (lab.view === 'guess') drawGuess(c, time, t);
  else if (lab.view === 'flat') drawFlat(c, time, t);
  else drawStrat(c, time, t);
  c.restore();
});
const nBalls = (v) => clamp(1 + Math.floor(v / 12), 1, 3), dropOf = (v) => clamp(0.75 - v / 30, 0.05, 0.75);

function drawGuess(c, time, t) {
  const G = S.G;
  scene(c, 168); chartFrame(c, 40, t.ax.y, t.ax.x);
  const v = G.run ? val('base', G.p) : 0;
  kit(c, 100, 108, 46, { balls: nBalls(v), dropP: dropOf(v), t: time, seed: 3, mood: G.done ? 'happy' : 'ok' });
  bigNum(c, G.run ? String(Math.round(v)) : '?', 262, 96, t.g.counter);
  if (!G.run) { c.save(); c.globalAlpha = 1; c.fillStyle = 'rgba(190,205,255,.5)'; c.font = `900 ${fs(64)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 196, 335); c.restore(); return; }
  if (G.p >= 6) band(c, 6, 10, t.ax.flat);
  if (G.done && G.pick !== null) {
    const f = SKETCH[G.pick] || ((d) => val('base', d));
    const e = curve(c, f, 20, 40, '#ffd166', { dash: [7, 6], w: 3, head: false });
    if (e) pill(c, t.ax.yours, Math.min(e[0], 300), e[1] - (G.pick === 0 ? -22 : 20), { col: '#ffd166', line: 'rgba(255,209,102,.6)' });
  }
  curve(c, (d) => val('base', d), G.p, 40, '#5fd0a8');
}
function drawFlat(c, time, t) {
  const F = S.F, q = quitted(), st = F.stage;
  scene(c, 168); chartFrame(c, 40, t.ax.y, t.ax.x);
  if (st === 5) {
    kit(c, 92, 108, 38, { mood: 'sad', still: true, balls: 3, t: time, col: '#f08a5d', hat: '#4ea8ff' });
    kit(c, 268, 108, 38, { mood: 'happy', balls: 3, dropP: 0.1, t: time, seed: 5 });
    pill(c, t.f.kQuit, 92, 190, { size: 12 }); pill(c, t.f.kGo, 268, 190, { size: 12 });
    band(c, 6, 10, t.ax.flat);
    const e1 = curve(c, (d) => val('base', Math.min(d, 8)), 9, 40, '#ff8a80', { head: true });
    c.save(); c.setLineDash([5, 5]); c.strokeStyle = 'rgba(255,138,128,.7)'; c.lineWidth = 3; c.beginPath(); c.moveTo(cxD(9), cyV(val('base', 8), 40)); c.lineTo(cxD(20), cyV(val('base', 8), 40)); c.stroke(); c.restore();
    const e2 = curve(c, (d) => val('base', d), 20, 40, '#5fd0a8');
    pill(c, t.f.pQuit, cxD(14), cyV(val('base', 8), 40) + 24, { col: '#ff8a80', line: 'rgba(255,138,128,.5)' });
    if (e2) pill(c, t.f.pGo, cxD(15), e2[1] - 22, { col: '#5fd0a8', line: 'rgba(95,208,168,.5)' });
    return e1;
  }
  const still = st === 4 && q;
  kit(c, 92, 112, 46, { mood: still ? 'sad' : st === 4 ? 'happy' : 'ok', still, balls: 1, dropP: 0.35, t: time, seed: 9 });
  let txt, col = '#ff8a80';
  if (st < 3) txt = t.f.th[st].bad;
  else if (st === 3) { const g = F.ch[2]; txt = t.f.th[2][g ? 'good' : 'bad']; col = g ? '#5fd0a8' : '#ff8a80'; }
  else if (q) txt = t.f.bQuit; else { txt = t.f.bGo; col = '#5fd0a8'; }
  bubble(c, txt, 156, 26, 190, 128, 70, col);
  band(c, 6, 10, t.ax.flat);
  curve(c, (d) => val('base', d), F.p, 40, '#5fd0a8');
}
function drawStrat(c, time, t) {
  const Hh = S.H, ym = 42;
  scene(c, 168); chartFrame(c, ym, t.ax.y, t.ax.x);
  const vals = KITS3.map((k) => (Hh.run ? val(k.k, Hh.p) : 0)), best = vals.indexOf(Math.max(...vals));
  KITS3.forEach((k, i) => {
    const cx = 62 + i * 118, v = vals[i];
    if (Hh.pick === i) { c.save(); c.globalAlpha = 1; c.strokeStyle = '#fff'; c.setLineDash([5, 4]); c.lineWidth = 2; c.beginPath(); c.arc(cx, 102, 52, 0, 7); c.stroke(); c.restore(); }
    kit(c, cx, 102, 32, { col: k.col, hat: k.hat, balls: nBalls(v), dropP: dropOf(v), t: time + i * 0.4, seed: 11 + i, mood: Hh.done && i === best ? 'happy' : 'ok' });
    pill(c, t.s.lab[i], cx, 168, { size: 12, col: k.col, line: k.col });
    if (Hh.run) pill(c, String(Math.round(v)), cx, 194, { size: 13 });
    if (Hh.done && i === best) { c.save(); c.globalAlpha = 1; c.font = `${fs(24)}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText('👑', cx, 22); c.restore(); }
  });
  if (!Hh.run) { c.save(); c.globalAlpha = 1; c.fillStyle = 'rgba(190,205,255,.5)'; c.font = `900 ${fs(64)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 196, 335); c.restore(); return; }
  KITS3.forEach((k) => curve(c, (d) => val(k.k, d), Hh.p, ym, k.col, { w: 3.5 }));
}
const OWN_SPEED = () => 0.4 + S.own.mins / 30, ownF = (d) => val('base', d * OWN_SPEED());
const ownBand = () => { const sp = OWN_SPEED(), a = Math.max(1, Math.round(6 / sp)); return [a, clamp(Math.max(a, Math.round(10 / sp)), a, 20)]; };
function drawOwn(c, time, t) {
  const O = S.own, sk = t.own.sk[O.skill], [a, b] = ownBand();
  scene(c, 168); chartFrame(c, 40, t.ax.lvl, t.ax.x);
  const inFlat = O.p >= a && O.p <= b;
  kit(c, 92, 112, 46, { mood: 'ok', balls: 1, dropP: 0, t: time, seed: 2, still: false });
  c.save(); c.globalAlpha = 1; c.font = `${fs(52)}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(sk.e, 290, 128); c.restore();
  pill(c, t.own.mins(O.mins), 290, 176, { size: 13 });
  if (inFlat) bubble(c, t.f.th[0].good, 160, 22, 180, 130, 66, '#5fd0a8');
  band(c, a, b, t.ax.flat);
  curve(c, ownF, O.p, 40, '#ffd166');
}
function drawBrain(c, time, t) {
  const d = S.brain.days, e = ease(d / 30);
  panel(c, 8, 8, 344, 424, '#262c52', '#12152c');
  // brain: two lumpy hemispheres
  const hemi = (cx, sign) => {
    c.beginPath();
    for (let i = 0; i <= 64; i++) {
      const th = i / 64 * Math.PI * 2, rr = 1 + 0.05 * Math.sin(th * 9 + sign), x = cx + Math.cos(th) * 84 * rr, y = 190 + Math.sin(th) * 118 * rr;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath();
    const g = c.createRadialGradient(cx - 30 * sign, 120, 10, cx, 190, 130); g.addColorStop(0, '#f6c4cf'); g.addColorStop(0.6, '#e49aae'); g.addColorStop(1, '#b4607c');
    c.fillStyle = g; c.strokeStyle = '#7a3b52'; c.lineWidth = 2.5; c.fill(); c.stroke();
    c.strokeStyle = 'rgba(122,59,82,.4)'; c.lineWidth = 2;
    for (let k = 0; k < 4; k++) { c.beginPath(); c.arc(cx + sign * (k % 2 ? 22 : -18), 120 + k * 42, 26 - k * 2, sign > 0 ? 0.7 : 1.9, sign > 0 ? 2.5 : 3.8); c.stroke(); }
  };
  hemi(118, -1); hemi(242, 1);
  const A = [90, 196], B = [270, 196], C1 = [180, 100], C2 = [180, 300];
  const at = (C, u) => [(1 - u) ** 2 * A[0] + 2 * (1 - u) * u * C[0] + u * u * B[0], (1 - u) ** 2 * A[1] + 2 * (1 - u) * u * C[1] + u * u * B[1]];
  const path = (C, w, col) => { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(...A); c.quadraticCurveTo(C[0], C[1], ...B); c.stroke(); };
  // the unused path
  path(C2, 6, '#5a2a40'); path(C2, 3, '#a58796');
  // the practised path: thicker with each day
  const w = 3 + 13 * e;
  path(C1, w + 4, '#5a3d12'); path(C1, w, '#e8b84a'); path(C1, Math.max(1, w * 0.3), '#fff0b8');
  const nb = Math.floor(d / 3);
  for (let i = 0; i < nb; i++) { const [x, y] = at(C1, (i + 0.5) / nb); c.fillStyle = '#ffe9a8'; c.strokeStyle = '#7a5410'; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, 3 + w * 0.3, 0, 7); c.fill(); c.stroke(); }
  // two racing signals
  const sp1 = 0.25 + e * 1.1, u1 = (time * sp1) % 1, u2 = (time * 0.25) % 1;
  for (const [C, u, col] of [[C1, u1, '#fff'], [C2, u2, '#cfd6ee']]) { const [x, y] = at(C, u); c.fillStyle = col; c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, 5.5, 0, 7); c.fill(); c.stroke(); }
  // neurons
  for (const [x, y] of [A, B]) {
    const g = c.createRadialGradient(x - 4, y - 5, 2, x, y, 14); g.addColorStop(0, '#fff'); g.addColorStop(1, '#6fa0ff');
    c.fillStyle = g; c.strokeStyle = '#2a4a99'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 12, 0, 7); c.fill(); c.stroke();
  }
  pill(c, t.br.meta, 180, 26, { col: '#f5c84c', line: 'rgba(245,200,76,.6)' });
  pill(c, t.br.p1, 180, 80, { size: 12, col: '#ffe9a8' });
  pill(c, t.br.p2, 180, 330, { size: 12, col: '#cfd6ee' });
}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const dayN = (p) => Math.round(p);
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, G = S.G, F = S.F, Hh = S.H;
  if (act === 'pickG') { if (G.run && !G.done) return; if (!G.run) G.pick = +b.dataset.i; sfx.click(); }
  else if (act === 'runG') {
    if (G.done) { S.G = { pick: null, run: false, p: 0, done: false }; sfx.click(); }
    else if (G.pick !== null && !G.run) { G.run = true; sfx.click(); showStage(); }
  } else if (act === 'thought') {
    const good = b.dataset.good === '1'; F.ch[F.stage] = good; F.stage++; (good ? sfx.good : sfx.bad)();
  } else if (act === 'nextF') {
    if (F.stage === 3) { F.stage = 4; sfx.click(); showStage(); }
    else if (F.stage === 4) { F.stage = 5; sfx.click(); }
    else if (F.stage === 5) { S.F = { stage: 0, ch: [], p: 5 }; sfx.click(); }
  } else if (act === 'pickS') { if (!Hh.run) Hh.pick = +b.dataset.i; sfx.click(); }
  else if (act === 'runS') {
    if (Hh.done) { S.H = { pick: null, run: false, p: 0, done: false }; sfx.click(); }
    else if (Hh.pick !== null && !Hh.run) { Hh.run = true; sfx.click(); showStage(); }
  } else if (act === 'skill') { S.own.skill = +b.dataset.i; S.own.p = 0; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'own') S.own.p = 0; else S.brain.days = 0; sfx.click(); }
  }
  render();
});
$('mins').addEventListener('input', (ev) => { S.own.mins = +ev.target.value; S.own.p = 0; render(); });
$('bdays').addEventListener('input', (ev) => { S.brain.days = +ev.target.value; render(); });

// --- one render per change: controls, readout, state card and facts -------------------------------------------
function render() {
  const t = T[lang], v = lab.view, k = S.sec || v;
  document.querySelectorAll('.pc-sec').forEach((e) => { e.style.display = e.dataset.k === k ? '' : 'none'; });
  lab.setFacts(t.facts[v]);
  const open = secret.unlocked();
  $('secChips').innerHTML = [['own', '🎯'], ['brain', '🧠']].map(([id, emo]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === id ? 'on' : ''}" data-act="sec" data-k="${id}">${open ? `${emo} ${esc(t.secrets[id][0])}` : '🔒 ???'}</button>`).join('');
  if (k === 'own') renderOwn(t); else if (k === 'brain') renderBrain(t);
  else if (k === 'guess') renderGuess(t); else if (k === 'flat') renderFlat(t); else renderStrat(t);
}

function renderGuess(t) {
  const G = S.G, g = t.g, locked = G.run;
  lab.setGlow('rgba(95, 208, 168, .24)');
  $('gQ').textContent = g.q;
  const svg = ['M4 36 L56 6', 'M4 36 C12 28 16 22 22 20 L34 20 C36 10 42 8 56 5', 'M4 36 L8 8 L56 6'];
  $('gSk').innerHTML = g.sk.map((l, i) => `<button data-act="pickG" data-i="${i}" class="${G.pick === i ? 'on' : ''}"${locked ? ' disabled' : ''}>
    <svg viewBox="0 0 60 40" aria-hidden="true"><path d="M4 4 V36 H56" fill="none" stroke="#646C84" stroke-width="1.5"/><path d="${svg[i]}" fill="none" stroke="#5fd0a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>${esc(l)}</button>`).join('');
  $('gGo').textContent = G.done ? g.again : g.go;
  $('gGo').disabled = !G.done && (G.pick === null || G.run);
  const d = dayN(G.p);
  if (!G.run) { lab.setReadout('?', '', '', '#5fd0a8'); lab.setState({ emo: '🤔', title: g.q, lead: g.lead0, body: '', extra: '' }); }
  else {
    lab.setReadout(Math.round(val('base', G.p)), t.ax.day(d), G.done ? '' : (G.p >= 6 && G.p <= 10 ? t.ax.flatNow : ''), '#5fd0a8');
    if (!G.done) lab.setState({ emo: '🤹', title: g.run, lead: g.runL, body: '', extra: '' });
    else if (G.pick === 1) lab.setState({ emo: '✅', title: g.right[0], lead: g.right[1], body: '', extra: '' });
    else lab.setState({ emo: '🤔', title: g.wrong[G.pick][0], lead: g.wrong[G.pick][1], body: g.wrongBody, extra: '' });
  }
}

function renderFlat(t) {
  const F = S.F, f = t.f, st = F.stage, q = quitted();
  lab.setGlow('rgba(245, 200, 76, .22)');
  $('fQ').textContent = st < 3 ? f.q : '';
  $('fQ').style.display = st < 3 ? '' : 'none';
  $('fTh').innerHTML = st < 3 ? [f.th[st].bad, f.th[st].good].map((x, i) => [x, i]).sort((a, b) => (st % 2 ? b[1] - a[1] : a[1] - b[1]))
    .map(([x, i]) => `<button data-act="thought" data-good="${i}">${esc(x)}</button>`).join('') : '';
  $('fGo').style.display = st < 3 ? 'none' : '';
  $('fGo').textContent = st === 3 ? f.next9 : st === 4 ? f.futures : f.again;
  const sd = st === 5 ? 20 : dayN(F.p);
  const vv = st === 5 ? val('base', 20) : val('base', q && st >= 4 ? Math.min(F.p, 8) : F.p);
  lab.setReadout(Math.round(vv), st === 5 ? '' : t.ax.day(sd), st < 4 ? t.ax.flatNow : '', '#f5c84c');
  if (st < 3) lab.setState({ emo: '🪫', title: f.day(6 + st), lead: f.lead, body: '', extra: '' });
  else if (st === 3) lab.setState({ emo: '🌙', title: f.s3[0], lead: f.s3[1], body: '', extra: '' });
  else if (st === 4) lab.setState(q ? { emo: '🥲', title: f.quit[0], lead: f.quit[1], body: '', extra: '' } : { emo: '💪', title: f.cont[0], lead: f.cont[1], body: '', extra: '' });
  else lab.setState({ emo: '🔀', title: f.both[0], lead: f.both[1], body: '', extra: '' });
}

function renderStrat(t) {
  const Hh = S.H, s = t.s, cols = KITS3.map((k) => k.col), locked = Hh.run;
  lab.setGlow('rgba(224, 176, 80, .22)');
  $('sQ').textContent = s.q;
  $('sPk').innerHTML = s.opts.map((o, i) => `<button data-act="pickS" data-i="${i}" class="${Hh.pick === i ? 'on' : ''}"${locked ? ' disabled' : ''}><i style="background:${cols[i]}"></i><span>${esc(o)}</span></button>`).join('');
  $('sGo').textContent = Hh.done ? s.again : s.go;
  $('sGo').disabled = !Hh.done && (Hh.pick === null || Hh.run);
  if (!Hh.run) { lab.setReadout('?', '', '', '#e0b050'); lab.setState({ emo: '🧰', title: s.q, lead: s.lead0, body: '', extra: '' }); return; }
  const best = Math.max(...KITS3.map((k) => val(k.k, Hh.p)));
  lab.setReadout(Math.round(best), t.ax.day(dayN(Hh.p)), '', '#e0b050');
  if (!Hh.done) lab.setState({ emo: '🤹', title: s.run, lead: s.runL, body: '', extra: '' });
  else lab.setState({ emo: Hh.pick === 2 ? '✅' : '🤔', title: Hh.pick === 2 ? s.right : s.wrong, lead: s.end, body: s.body, extra: '' });
}

function renderOwn(t) {
  const O = S.own, o = t.own, [a, b] = ownBand(), sk = o.sk[O.skill];
  lab.setGlow('rgba(255, 209, 102, .22)');
  $('oSk').innerHTML = o.sk.map((x, i) => `<button class="chip ${O.skill === i ? 'on' : ''}" data-act="skill" data-i="${i}">${x.e} ${esc(x.n)}</button>`).join('');
  $('oLab').textContent = o.label; $('oVal').textContent = o.mins(O.mins); $('mins').value = O.mins;
  lab.setReadout(Math.round(ownF(O.p)), t.ax.day(dayN(O.p)), O.p >= a && O.p <= b ? t.ax.flatNow : '', '#ffd166');
  lab.setState({ emo: sk.e, title: o.title(sk.n, O.mins), lead: o.lead(a, b), body: o.body(sk.tip), extra: '' });
}

function renderBrain(t) {
  const d = S.brain.days, b = t.br;
  lab.setGlow('rgba(228, 154, 174, .24)');
  $('bLab').textContent = b.days(d); $('bVal').textContent = ''; $('bdays').value = d;
  lab.setReadout(d, b.unit, b.pill, '#e49aae');
  lab.setState({ emo: '🧠', title: b.title, lead: d === 0 ? b.l0 : b.l(d), body: b.body, extra: '' });
}
render();
