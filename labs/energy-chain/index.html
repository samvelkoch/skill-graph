const TAU = Math.PI * 2;
const COL = { light: '#FFD166', stored: '#3DDC97', move: '#4EA8FF', elec: '#B98CFF', heat: '#FF7A45', sound: '#FF8FB1', ink: '#F4F1E8', bg: '#121A33', skyTop: '#1B2A5A', skyLow: '#FFB45E' };
const c01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => { t = c01(t); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - Math.pow(1 - c01(t), 3);
const backOut = (t) => { t = c01(t); const k = 1.70158; return 1 + (k + 1) * Math.pow(t - 1, 3) + k * Math.pow(t - 1, 2); };
const R0 = (r) => Math.max(0, r);
const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, a))})`; };
const mixc = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const dark = (h, k) => mixc(h, '#000000', k);
const now = () => performance.now() / 1000;

function wrapLines(c, text, maxW) {
  const words = String(text).split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (cur && c.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
// a dark rounded pill with coloured outline and (wrapped) text, centred on x, y; kept inside the canvas
function pill(c, text, x, y, col, o = {}) {
  const size = o.size || 12, lh = size + 2;
  c.save();
  c.font = `800 ${size}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const lines = wrapLines(c, text, o.maxW || 96);
  const tw = Math.max(...lines.map((l) => c.measureText(l).width)), pw = tw + 16, ph = lines.length * lh + 8;
  if (o.cw) x = Math.min(o.cw - pw / 2 - 3, Math.max(pw / 2 + 3, x));
  c.globalAlpha = o.alpha ?? 1;
  c.beginPath(); c.roundRect(x - pw / 2, y - ph / 2, pw, ph, Math.min(ph / 2, 12));
  c.fillStyle = 'rgba(18,26,51,.84)'; c.fill();
  c.lineWidth = 1.5; c.strokeStyle = rgba(col, .8); c.stroke();
  c.fillStyle = o.text || col;
  lines.forEach((l, i) => c.fillText(l, x, y - (lines.length - 1) * lh / 2 + i * lh + 0.5));
  c.restore();
}
// wavy translucent heat line rising from (x, y)
function heatWave(c, x, y, len, amp, time, seed, a) {
  if (a <= 0.01) return;
  const N = 12;
  c.save(); c.lineCap = 'round'; c.lineWidth = 2.6;
  let px = x, py = y;
  for (let k = 1; k <= N; k++) {
    const f = k / N, yy = y - len * f, xx = x + Math.sin(f * 6.5 + time * 2.4 + seed) * amp * (0.35 + f);
    c.strokeStyle = rgba(COL.heat, a * (1 - f) * 0.85);
    c.beginPath(); c.moveTo(px, py); c.lineTo(xx, yy); c.stroke();
    px = xx; py = yy;
  }
  c.restore();
}
function glowDot(c, x, y, col, a, r = 3.4) {
  if (a <= 0.01) return;
  c.save();
  c.fillStyle = rgba(col, a * 0.28); c.beginPath(); c.arc(x, y, R0(r * 2.5), 0, TAU); c.fill();
  c.fillStyle = rgba(col, a); c.beginPath(); c.arc(x, y, R0(r), 0, TAU); c.fill();
  c.fillStyle = rgba('#ffffff', a * 0.8); c.beginPath(); c.arc(x - r * 0.25, y - r * 0.25, R0(r * 0.4), 0, TAU); c.fill();
  c.restore();
}
// quadratic arrow between two points, trimmed by the node radius

  c.fillStyle = 'rgba(5,8,20,.4)'; c.beginPath(); c.ellipse(bx, floorY + 3, R0(rB * (1.1 - b.y * 0.5)), R0(rB * 0.2), 0, 0, TAU); c.fill();
  c.save(); c.translate(bx, by + rB * (1 - sq)); c.scale(st, sq);
  g = c.createRadialGradient(-rB * 0.35, -rB * 0.4, rB * 0.1, 0, 0, rB); g.addColorStop(0, '#CFE6FF'); g.addColorStop(0.45, COL.move); g.addColorStop(1, dark(COL.move, 0.55));
  c.fillStyle = g; c.strokeStyle = '#102040'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, rB, 0, TAU); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2.5; c.beginPath(); c.arc(0, 0, rB * 0.62, Math.PI * 1.1, Math.PI * 1.45); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.beginPath(); c.ellipse(0, 0, rB, rB * 0.35, 0.5, 0, TAU); c.stroke();
  c.restore();
  // the energy bar: the total never changes, it only moves from "movement" to "heat" and "sound"
  const barX = w * (narrow ? 0.6 : 0.64), barW = 28, barTop = topY, barH = floorY - topY, hH = barH * lost * 0.65, sH = barH * lost * 0.35, mH = barH * E;
  c.fillStyle = 'rgba(130,145,190,.14)'; c.beginPath(); c.roundRect(barX, barTop, barW, barH, 10); c.fill();
  c.save(); c.beginPath(); c.roundRect(barX, barTop, barW, barH, 10); c.clip();
  c.fillStyle = COL.heat; c.fillRect(barX, floorY - hH, barW, hH);
  c.fillStyle = COL.sound; c.fillRect(barX, floorY - hH - sH, barW, sH);
  c.fillStyle = COL.move; c.fillRect(barX, floorY - hH - sH - mH, barW, mH);
  c.restore();
  c.strokeStyle = rgba(COL.ink, 0.35); c.lineWidth = 1.5; c.beginPath(); c.roundRect(barX, barTop, barW, barH, 10); c.stroke();
  const lx = barX + barW + 8, lw = Math.max(60, w - lx - 6);
  if (mH > 16) pill(c, t.forms.move, lx + lw / 2 - 4, floorY - hH - sH - mH / 2, COL.move, { maxW: lw, cw: w });
  if (sH > 16) pill(c, t.forms.sound, lx + lw / 2 - 4, floorY - hH - sH / 2, COL.sound, { maxW: lw, cw: w });
  if (hH > 16) pill(c, t.forms.heat, lx + lw / 2 - 4, floorY - hH / 2, COL.heat, { maxW: lw, cw: w });
}

// ====================================================================================================================
// Frame loop
// ====================================================================================================================
function advance(dt, time) {
  S.ph += dt * S.pedal * 9;
  S.lamp += (ease((S.pedal - 0.05) / 0.85) - S.lamp) * Math.min(1, dt * 5);
  S.heatT += ((S.heatOn ? 1 : 0) - S.heatT) * Math.min(1, dt * 2.5);
  for (let i = 0; i < 7; i++) S.fl[i] = (S.fl[i] + dt * (i < 3 ? 0.3 : 0.18 + 0.75 * S.pedal)) % 1;
  S.mfl = (S.mfl + dt * 0.45) % 1;
  if (S.sec === 'coal' && S.coal.auto) { S.coal.P = Math.min(6.999, S.coal.P + dt * 0.55); $('ecCoalR').value = Math.round(S.coal.P * 100); }
  if (S.sec === 'ball') stepBall(dt, time);
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  advance(dt, time);
  const v = lab.view;
  if (S.sec === 'coal') drawCoal(c, w, h, time);
  else if (S.sec === 'ball') drawBall(c, w, h, time);
  else if (v === 'chain') drawChain(c, w, h, time);
  else if (v === 'missing') drawMissing(c, w, h, time);
  else drawForms(c, w, h, time);
});

// ====================================================================================================================
// Controls
// ====================================================================================================================
function delayShow(o, ms) {
  const tok = ++S.gen; o.tok = tok; o.shown = false;
  setTimeout(() => { if (o.tok === tok) { o.shown = true; render(); } }, ms);
}
function pick(k) {
  const v = lab.view;
  if (v === 'chain') {
    const c = S.c;
    if (c.step === 0) { c.pick1 = k; c.step = 1; c.t0 = now(); (k === C_RIGHT[0] ? sfx.good : sfx.bad)(); delayShow(c, 4200); }
    else if (c.step === 2) { c.pick2 = k; c.step = 3; S.heatOn = true; (k === C_RIGHT[1] ? sfx.good : sfx.bad)(); delayShow(c, 1800); }
  } else if (v === 'missing') {
    const m = S.m; if (m.pick !== null) return;
    m.pick = k; m.t0 = now(); m.rights[m.i] = k === M_RIGHT[m.i]; (m.rights[m.i] ? sfx.good : sfx.bad)();
    if (m.i === 3) m.done = true;
    delayShow(m, k === M_RIGHT[m.i] ? 1000 : 2800);
  } else {
    const f = S.f; if (f.pick !== null) return;
    f.pick = k; f.t0 = now(); f.rights[f.i] = k === F_RIGHT[f.i]; (f.rights[f.i] ? sfx.good : sfx.bad)();
    if (f.i === 3) f.done = true;
    delayShow(f, 1900);
  }
  render(); showStage();
}
function next() {
  const v = lab.view;
  if (v === 'chain') {
    if (S.c.step === 1) { S.c.step = 2; S.c.shown = false; S.c.tok = ++S.gen; }
    else again();
  } else if (v === 'missing') {
    const m = S.m;
    if (m.done) { S.m = { i: 0, pick: null, t0: 0, shown: false, rights: [], done: false, tok: ++S.gen }; }
    else { m.i++; m.pick = null; m.shown = false; m.tok = ++S.gen; }
  } else {
    const f = S.f;
    if (f.done) { S.f = { i: 0, pick: null, t0: 0, shown: false, rights: [], done: false, tok: ++S.gen }; }
    else { f.i++; f.pick = null; f.shown = false; f.tok = ++S.gen; }
  }
  sfx.click(); render();
}
function again() {
  if (S.sec === 'coal') { S.coal.P = 0; S.coal.auto = true; }
  else if (S.sec === 'ball') resetBall();
  else { S.c = { step: 0, pick1: null, pick2: null, t0: 0, shown: false, tok: ++S.gen }; S.heatOn = false; S.pedal = 0.6; S.sel = -1; $('ecPedalR').value = 60; }
  sfx.click(); render();
}
function secClick(k) {
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === k ? null : k;
  if (S.sec === 'coal') { S.coal.P = 0; S.coal.auto = true; }
  if (S.sec === 'ball') resetBall();
  sfx.click(); render(); if (S.sec) showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'opt') pick(+b.dataset.k);
  else if (act === 'next') next();
  else if (act === 'again') again();
  else if (act === 'sec') secClick(b.dataset.k);
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'ecPedalR') { S.pedal = +ev.target.value / 100; readoutChain(); }
  else if (ev.target.id === 'ecCoalR') { S.coal.auto = false; S.coal.P = +ev.target.value / 100; }
});

// --- render: controls, readout and the state card ---------------------------------------------------------------
const optsHtml = (opts, right, pickK, revealed) => opts.map((o, k) =>
  `<button class="ec-opt ${revealed ? (k === right ? 'good' : k === pickK ? 'bad' : 'dim') : ''}" data-act="opt" data-k="${k}"${revealed ? ' disabled' : ''}>${esc(o)}</button>`).join('');
const resHtml = (t, ok, text, btn) => `<div class="ec-res"><div class="v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.wrong)}</div><p>${esc(text)}</p><button class="btn" data-act="${btn}">${esc(btn === 'next' ? t.next : t.again)}</button></div>`;
const dotsOf = (i, n, done) => Array.from({ length: n }, (_, k) => (k < i || (k === i && done) ? '●' : k === i ? '◉' : '○')).join(' ');
function readoutChain() {
  const t = T[lang];
  lab.setReadout(`<span class="ec-bar" role="img" aria-label="${esc(t.c.pedal)}"><i style="width:${Math.round(ease((S.pedal - 0.05) / 0.85) * 100)}%"></i></span>`, '', S.c.step === 3 ? t.c.never : '', COL.heat);
}
function setSt(t, key, full) { const [emo, title, lead, body] = t.st[key][full ? 1 : 0]; lab.setState({ emo, title, lead, body, extra: '' }); }
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  if (sec && v !== 'chain') S.sec = null;
  document.body.dataset.v = v; document.body.dataset.s = S.sec || '';
  const secOn = !!S.sec;
  $('ecQ').style.display = $('ecOpts').style.display = $('ecRes').style.display = secOn ? 'none' : '';
  $('ecSec').style.display = secOn ? '' : 'none';
  $('ecFree').style.display = v === 'chain' && (S.c.step === 3 || secOn) ? '' : 'none';
  $('ecPedal').style.display = secOn ? 'none' : '';
  $('ecSlideWrap').style.display = S.sec === 'coal' ? '' : 'none';
  $('ecSecAgain').textContent = t.again;
  if (v === 'chain') {
    lab.setGlow('rgba(255, 150, 80, .24)');
    const c = S.c, asking = c.step === 0 || c.step === 2, revealed = c.step === 1 || c.step === 3;
    $('ecQ').textContent = c.step <= 1 ? t.c.q1 : t.c.q2;
    const idx = c.step <= 1 ? 0 : 1, opts = idx ? t.c.o2 : t.c.o1, pk = idx ? c.pick2 : c.pick1;
    $('ecOpts').innerHTML = optsHtml(opts, C_RIGHT[idx], pk, !asking);
    $('ecRes').innerHTML = revealed && c.shown ? resHtml(t, pk === C_RIGHT[idx], idx ? t.c.r2 : t.c.r1, idx ? 'again' : 'next') : '';
    $('ecPedalL').textContent = `🚲 ${t.c.pedal}`;
    $('ecPedalR').setAttribute('aria-label', t.c.pedal);
    const sc = (k, emo) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    $('ecChips').innerHTML = sc('coal', '🪨') + sc('ball', '⚽');
    readoutChain();
    if (S.sec) {
      const k = S.sec; lab.setReadout(k === 'coal' ? '🪨' : '⚽', t.secrets[k][1], '', COL.light);
      lab.setState({ emo: k === 'coal' ? '🪨' : '⚽', title: t.secrets[k][0], lead: t.secrets[k][1], body: t.sec[k === 'coal' ? 'coalText' : 'ballText'], extra: '' });
    } else setSt(t, 'chain', c.step === 3);
  } else if (v === 'missing') {
    lab.setGlow('rgba(61, 220, 151, .2)');
    const m = S.m;
    $('ecQ').textContent = t.m.q;
    $('ecOpts').innerHTML = optsHtml(t.m.o[m.i], M_RIGHT[m.i], m.pick, m.pick !== null);
    $('ecRes').innerHTML = m.pick !== null && m.shown ? resHtml(t, m.pick === M_RIGHT[m.i], t.m.why[m.i], m.done ? 'again' : 'next') : '';
    lab.setReadout(dotsOf(m.i, 4, m.pick !== null), '', '', COL.stored);
    setSt(t, 'missing', m.done && m.pick !== null);
  } else {
    lab.setGlow('rgba(255, 122, 69, .22)');
    const f = S.f;
    $('ecQ').textContent = t.f.q;
    $('ecOpts').innerHTML = optsHtml(t.f.o[f.i], F_RIGHT[f.i], f.pick, f.pick !== null);
    $('ecRes').innerHTML = f.pick !== null && f.shown ? resHtml(t, f.pick === F_RIGHT[f.i], t.f.why[f.i], f.done ? 'again' : 'next') : '';
    lab.setReadout(dotsOf(f.i, 4, f.pick !== null), '', '', COL.heat);
    setSt(t, 'forms', f.done && f.pick !== null);
  }
}
render();
</script>
</body>
