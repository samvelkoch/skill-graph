const TAU = Math.PI * 2;

const clamp01 = (x) => Math.min(1, Math.max(0, x));

function rrect(c, x, y, w, h, r) {

  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

  if (s.phase === 'done' && s.qi === 0) row.push(`<button class="btn" data-act="next">${esc(t.next)}</button>`);
  if (v === 'phone' && free(v)) {
    row.push(`<span class="chips"><button class="chip ${P.gTo > .5 ? 'on' : ''}" data-act="taut" data-v="1">${esc(t.p.tight)}</button><button class="chip ${P.gTo > .5 ? '' : 'on'}" data-act="taut" data-v="0">${esc(t.p.loose)}</button></span>`);
    row.push(`<button class="btn push" data-act="speak">${esc(t.p.speak)}</button>`);
  }
  if (v === 'race' && s.phase === 'done') {
    if (s.qi === 0) row.push(`<button class="chip" data-act="replay" data-s="lanes">${esc(t.again)}</button>`);
    else row.push(`<button class="chip ${RC.scene === 'lanes' ? 'on' : ''}" data-act="replay" data-s="lanes">${esc(t.views.race)}</button><button class="chip ${RC.scene === 'table' ? 'on' : ''}" data-act="replay" data-s="table">${esc(t.knock)}</button>`);
  }
  if (v === 'jar' && s.phase === 'done') {
    if (s.qi === 1) row.push(`<button class="chip ${J.scene === 'jar' ? 'on' : ''}" data-act="jarscene" data-s="jar">${esc(t.views.jar)}</button><button class="chip ${J.scene === 'space' ? 'on' : ''}" data-act="jarscene" data-s="space">${esc(t.space)}</button>`);
    if (J.scene === 'jar') {
      const lock = J.auto;
      row.push(`<span class="chips"><button class="chip" data-act="pump"${lock || J.k >= 6 ? ' disabled' : ''}>${esc(t.j.pump)}</button><button class="chip" data-act="letin"${lock || J.k === 0 ? ' disabled' : ''}>${esc(t.j.letIn)}</button></span>`);
    }
  }
  if (row.length) h += `<div class="row2">${row.join('')}</div>`;
  if (v === 'phone') {
    const open = secret.unlocked();
    const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    h += `<div class="row2"><div class="chips">${sc('whale', '🐋')}${sc('wall', '🧱')}</div></div>`;
  }
  return h;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act, v = lab.view;
  if (a === 'pick') pick(+b.dataset.i);
  else if (a === 'next') next();
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); if (S.sec) showStage();
  } else if (a === 'taut') { setTaut(b.dataset.v === '1'); sfx.click(); }
  else if (a === 'speak') speak();
  else if (a === 'replay') {
    sfx.click();
    if (b.dataset.s === 'lanes') { RC.scene = 'lanes'; startRace(); } else { RC.scene = 'table'; startKnock(); }
    showStage();
  } else if (a === 'jarscene') {
    sfx.click(); J.scene = b.dataset.s;
    if (J.scene === 'space') { SP.t = 0; SP.on = true; }
  } else if (a === 'pump') pumpStroke();
  else if (a === 'letin') letIn();
  render();
});

let rdKey = '';
function readout(force) {
  const t = T[lang], v = lab.view, s = V[v];
  let r;
  if (v === 'phone' && S.sec) r = [S.sec === 'whale' ? '🐋' : '🧱', t.secrets[S.sec][0], '', '#4FA3F7'];
  else if (v === 'phone') {
    r = free(v) ? [P.result === 'heard' ? t.p.heard : P.result === 'not' ? t.p.notHeard : '…', '', P.gTo > .5 ? t.p.tight : t.p.loose, WAVE] : ['?', '', '', WAVE];
  } else if (v === 'race') {
    if (RC.scene === 'lanes') r = s.qi === 0 && s.phase === 'ask' ? ['?', '', '', '#4FA3F7'] : [RC.arr[2] ? String(SPEEDS[2]) : '…', RC.arr[2] ? `${t.ms} · ${t.r.lanes[2]}` : '', '', '#4FA3F7'];
    else r = s.qi === 1 && s.phase === 'ask' ? ['?', '', '', '#4FA3F7'] : [s.phase === 'done' ? t.r.o2[1] : '…', '', '', '#4FA3F7'];
  } else if (J.scene === 'jar') r = [`${Math.round(J.vol * 100)}%`, t.j.volume, '', '#F2C65A'];
  else r = s.qi === 1 && s.phase === 'ask' ? ['?', '', '', '#F2C65A'] : [s.phase === 'done' ? '🔇' : '…', '', '', '#F2C65A'];
  const key = r.join('|') + lang;
  if (!force && key === rdKey) return;
  rdKey = key; lab.setReadout(r[0], r[1], r[2], r[3]);
}
function render() {
  const t = T[lang], v = lab.view;
  $('ctrlBody').innerHTML = ctrlHTML();
  readout(true);
  lab.setGlow(v === 'phone' ? 'rgba(255,138,91,.26)' : v === 'race' ? 'rgba(79,163,247,.28)' : 'rgba(242,198,90,.26)');
  const fine = `<div class="fine">${esc(t.fine)}</div>`;
  if (v === 'phone' && S.sec) {
    lab.setState({ emo: S.sec === 'whale' ? '🐋' : '🧱', title: t.secrets[S.sec][0], lead: t.secrets[S.sec][1], body: t.sec[`${S.sec}Text`], extra: fine });
    return;
  }
  const emo = { phone: '🥤', race: '🏁', jar: '🫙' }[v], c = t.st[free(v) ? v + 'F' : v];
  lab.setState({ emo, title: c[0], lead: c[1], body: '', extra: fine });
}

canvasLoop($('cv'), (c, w, h, dt, t) => {
  fit(w, h);
  runSched(dt);
  const v = lab.view;
  if (v === 'phone') {
    if (S.sec === 'whale') drawWhales(c, w, h, dt, t);
    else if (S.sec === 'wall') drawWall(c, w, h, dt, t);
    else { updPhone(dt); drawPhone(c, w, h, t); }
  } else if (v === 'race') {
    if (RC.scene === 'lanes') drawLanes(c, w, h, dt, t); else drawTable(c, w, h, dt, t);
  } else if (J.scene === 'jar') { updJar(dt); drawJar(c, w, h, t); }
  else drawSpace(c, w, h, dt, t);
  readout(false);
});
render();
</script>
</body>
</html>
