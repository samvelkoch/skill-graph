function step(dt) {
  const k = 1 - Math.exp(-dt * 7), k2 = 1 - Math.exp(-dt * 9);
  S.dc += (S.coins - S.dc) * k; S.dl += (S.loaves - S.dl) * k;
  S.dR += (S.rate - S.dR) * k2; S.dY += (S.yrs - S.dY) * k2;
  S.ym += (Math.max(2, growth(S.rate, 20)) - S.ym) * k2;
  let dirty = false;
  if (S.tw) {
    const kk = clamp((performance.now() - S.tw.t0) / S.tw.dur, 0, 1), e = ease(kk);
    for (const [key, a, b] of S.tw.items) S[key] = a + (b - a) * e;
    if (kk >= 1) S.tw = null;
    dirty = true;
  }
  if (S.playing) {
    S.year = Math.min(1650, S.year + dt * 150 / 9); dirty = true;
    if (S.year >= 1650) { S.playing = false; S.potShown = true; dirty = false; render(); }
  }
  if (dirty) syncUI();
  const nP = nPeople(S.dc);
  for (let i = 0; i < PEOPLE; i++) S.pt[i] = clamp(S.pt[i] + (i < nP ? dt / .45 : -dt / .3), 0, 1);
  const yr = S.asked.potosi || S.ans.potosi !== null ? S.year : 1610, n = yr < 1545 ? 0 : yr < 1570 ? 1 : yr < 1600 ? 2 : 3;
  for (let i = 0; i < 3; i++) S.shipA[i] += ((i < n ? 1 : 0) - S.shipA[i]) * (1 - Math.exp(-dt * 4));
}

  else if (id === 'sR') S.rate = val; else if (id === 'sN') S.yrs = val;
  const now = performance.now(); if (now - tickAt > 80) { tickAt = now; sfx.tick(); }
  render();
});

// --- one render per change: controls, readout and the state card ------------------------------------------------
function readout() {
  const t = T[lang], v = lab.view, asking = !S.asked[v];
  if (S.sec === 'a' && v === 'bank') return lab.setReadout('×2', t.x2, '', '#e0b050');
  if (S.sec === 'b' && v === 'market') return lab.setReadout(`${fmt(price(S.coins, S.loaves), 1)} 🪙`, t.priceLoaf, '', '#ffd166');
  if (v === 'market') return asking ? lab.setReadout('?', '', '', '#ffd166') : lab.setReadout(`${fmt(price(S.coins, S.loaves), 1)} 🪙`, t.priceLoaf, '', '#ffd166');
  if (v === 'potosi') return asking || !S.potShown ? lab.setReadout('?', '', '', '#c9d3df') : lab.setReadout('≈ 5–6×', t.englandPrices, '', '#c9d3df');
  return asking ? lab.setReadout('?', '', '', '#e0b050') : lab.setReadout(`×${fmt(growth(S.rate, S.yrs), 2)}`, t.basketAfter(Math.round(S.yrs)), '', '#e0b050');
}
function syncUI() { // the cheap part: slider thumbs, their numbers, the readout (also called every frame of a tween)
  const set = (id, val) => { const e = $(id); if (e && +e.value !== val) e.value = val; };
  set('sC', Math.round(S.coins)); set('sL', Math.round(S.loaves)); set('sY', Math.round(S.year)); set('sR', Math.round(S.rate)); set('sN', Math.round(S.yrs));
  $('vC').textContent = fmt(Math.round(S.coins)); $('vL').textContent = fmt(Math.round(S.loaves)); $('vY').textContent = Math.round(S.year);
  $('vR').textContent = `${Math.round(S.rate)} %`; $('vN').textContent = Math.round(S.yrs);
  const m1 = $('mk1'), m2 = $('mk2'); if (m1) m1.style.opacity = S.year >= 1545 ? 1 : .4; if (m2) m2.style.opacity = S.year >= 1575 ? 1 : .4;
  document.querySelectorAll('#tgt .chip').forEach((b) => b.classList.toggle('on', +b.dataset.t === Math.round(S.rate) && Math.abs(S.rate - Math.round(S.rate)) < .01));
  readout();
}
function askHTML(v, t) {
  const Q = { market: [t.qMarket, t.optsMarket, t.marketWhy], potosi: [t.qPotosi, t.optsPotosi, t.potosiWhy], bank: [t.qBank, t.optsBank, t.bankWhy] }[v], a = S.ans[v];
  if (a === null) {
    if (S.asked[v]) return '';
    return `<div class="sp-q">${esc(Q[0])}</div><div class="sp-opts">${ORD[v].map((i) => `<button class="chip sp-opt" type="button" data-pick="${i}">${esc(Q[1][i])}</button>`).join('')}</div>`;
  }
  const ok = a === 0;
  return `<div class="sp-v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.notQuite)}</div><p>${esc(Q[2])}</p>`;
}
function render() {
  const t = T[lang], v = lab.view, asking = !S.asked[v];
  document.body.dataset.v = v;
  const html = askHTML(v, t), ask = $('spAsk'); ask.innerHTML = html; ask.style.display = html ? 'block' : 'none';
  $('pMarket').style.display = v === 'market' && !asking ? 'block' : 'none';
  $('pPotosi').style.display = v === 'potosi' && !asking ? 'block' : 'none';
  $('pBank').style.display = v === 'bank' && !asking && S.sec !== 'a' ? 'block' : 'none';
  $('lC').textContent = t.coins; $('lL').textContent = t.loaves; $('lY').textContent = t.year; $('lR').textContent = t.inflation; $('lN').textContent = t.years;
  [['sC', t.coins], ['sL', t.loaves], ['sY', t.year], ['sR', t.inflation], ['sN', t.years]].forEach(([id, l]) => $(id).setAttribute('aria-label', l));
  $('play').textContent = S.playing ? '⏸' : `▶ ${t.play}`;
  document.querySelectorAll('#tgt .chip').forEach((b) => { b.textContent = t.targets[b.dataset.k]; });
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" type="button" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('a', '🖨️') + sc('b', '🌾'); $('secRow').style.display = asking ? 'none' : 'flex';
  const gl = { market: 'rgba(224,176,80,.26)', potosi: 'rgba(150,185,215,.24)', bank: 'rgba(95,168,160,.24)' }[v]; lab.setGlow(gl);
  syncUI();
  if (S.sec === 'a' && v === 'bank') { lab.setState({ emo: '🖨️', title: t.secrets.a[0], lead: t.secrets.a[1], body: '', extra: '<div class="sp-fine">📚 S. Hanke &amp; N. Krus, “World Hyperinflations”, Cato Institute, 2012</div>' }); lab.setFacts([]); return; }
  if (S.sec === 'b' && v === 'market') { lab.setState({ emo: '🌾', title: t.secrets.b[0], lead: t.secrets.b[1], body: '', extra: '' }); lab.setFacts([]); return; }
  if (asking) {
    const q = { market: t.qMarket, potosi: t.qPotosi, bank: t.qBank }[v];
    lab.setState({ emo: '🤔', title: q, lead: '', body: '', extra: '' });
    lab.setFacts(v === 'potosi' ? t.facts.potosi.slice(0, 1) : t.facts[v]); // the second Potosí fact gives the answer away
    return;
  }
  const st = t.state[v]; let extra = '';
  if (v === 'market') extra = `<div class="sp-fine">${fmt(Math.round(S.coins))} ÷ ${fmt(Math.round(S.loaves))} × ${fmt(0.5, 1)} = ${fmt(price(S.coins, S.loaves), 1)}</div>`;
  else if (v === 'potosi') extra = `<div class="sp-fine"><div id="mk1">📍 ${esc(t.markers.potosi)}</div><div id="mk2">📍 ${esc(t.markers.mercury)}</div></div>`;
  else extra = `<div class="sp-fine">(1 + ${fmt(S.rate / 100, 2)}) ^ ${Math.round(S.yrs)} = ${fmt(growth(S.rate, S.yrs), 2)}</div>`;
  lab.setState({ ...st, extra });
  lab.setFacts(t.facts[v]);
  syncUI();
}

canvasLoop($('cv'), (c, w, h, dt) => {
  step(dt);
  const v = lab.view, asking = !S.asked[v], time = performance.now() / 1000;
  if (v === 'market') { if (S.sec === 'b') drawLandlord(c, w, h, time); else drawMarket(c, w, h, time, asking); }
  else if (v === 'potosi') drawPotosi(c, w, h, time, asking);
  else if (S.sec === 'a') drawHyper(c, w, h, time);
  else drawBank(c, w, h, time, asking);
});
render();
</script>
</body>
</html>
