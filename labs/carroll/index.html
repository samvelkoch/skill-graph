  else st = { emo: '🤔', title: t.f.ask[0], lead: t.f.ask[1], body: t.f.askB };
  lab.setState({ ...st, extra: '' });
}
function renderSort(t) {
  const [A, B] = PAIRS[S.p2], ra = RL(A), rb = RL(B), n = S.pile.filter((o) => o.st === 'placed').length, cnt = [0, 0, 0, 0];
  S.pile.forEach((o) => cnt[o.tb]++);
  $('bPile').textContent = t.s.newPile; $('bNext').textContent = t.s.next; show('bNext', S.q === 1 && S.qd);
  show('bPile', true);
  lab.setReadout(`${n}/${S.pile.length}`, t.sorted, '', '#e0b050');
  $('qOpts').innerHTML = S.qopts.map((x) => `<button class="cs-opt" data-act="qopt" data-v="${x}" ${S.qwrong.includes(x) ? 'disabled' : ''}>${x}</button>`).join('');
  let st;
  if (S.q === 0) st = S.note === 'wrong' ? { emo: '🙅', title: t.s.wrong, lead: t.s.wrongL, body: '' } : { emo: '🧸', title: t.s.t, lead: t.s.lead, body: t.s.body };
  else if (S.q === 1) {
    const total = cnt[0] + cnt[1];
    st = S.qd ? { emo: '✅', title: t.s.right, lead: `${cnt[0]} + ${cnt[1]} = ${total}`, body: t.s.q1okB }
      : S.qmsg === 'no' ? { emo: '🤔', title: t.s.q1no, lead: t.s.q1noL, body: t.s.q1(rb[0], RULES[B].gen) }
      : { emo: '🔢', title: t.s.q1(rb[0], RULES[B].gen), lead: t.s.q1L, body: '' };
  } else if (S.q === 2) st = S.qmsg === 'no' ? { emo: '🤔', title: t.s.q2no, lead: t.s.q2noL, body: '' } : { emo: '👆', title: t.s.q2(ra[1], rb[1]), lead: t.s.q2L, body: '' };
  else st = { emo: '🏆', title: t.s.done, lead: t.s.doneL, body: t.s.q2ok(t.toys(cnt[3])) };
  lab.setState({ ...st, extra: '' });
}
function renderRings(t) {
  const [A, B] = PAIRS[S.p2], ra = RL(A), rb = RL(B), n = S.hl >= 0 ? S.counts[S.hl] : S.pile.length;
  const names = [t.and(ra[0], rb[0]), t.and(ra[1], rb[0]), t.and(ra[0], rb[1]), t.and(ra[1], rb[1])];
  $('modeSeg').innerHTML = [['grid', t.r.grid], ['rings', t.r.rings]].map(([m, l]) => `<button data-act="mode" data-m="${m}" class="${S.mode === m ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('bPile').textContent = t.s.newPile; show('bNext', false); show('bPile', true);
  lab.setReadout(String(n), S.hl >= 0 ? names[S.hl] : t.toys(S.pile.length).replace(/^\d+ /, ''), '', '#e0b050');
  lab.setState(S.hl >= 0 ? { emo: '🔎', title: names[S.hl], lead: t.toys(n), body: t.r.where[S.hl](ra[0], rb[0]), extra: '' }
    : { emo: '⭕', title: t.r.t, lead: t.r.lead, body: t.r.body, extra: '' });
}
function renderEmpty(t) {
  const E = S.E, ra = RL('star'), rb = RL('round');
  lab.setReadout(E.done ? '0' : `${E.idx}/${E.objs.length}`, E.done ? t.and(ra[0], rb[0]) : t.sorted, '', '#e0b050');
  lab.setState(E.done ? { emo: '🗃️', title: t.ea.doneT, lead: t.ea.doneL, body: t.ea.doneB, extra: '' } : { emo: '🤖', title: t.ea.run[0], lead: t.ea.run[1], body: '', extra: '' });
}
function renderOwn(t) {
  const r = S.own, o = t.ob;
  $('ownChips').innerHTML = OWN.map((k) => `<button class="cs-c ${r.includes(k) ? 'on' : ''}" data-act="rule" data-k="${k}">${r.includes(k) ? `${r.indexOf(k) + 1} · ` : ''}${esc(RULES[k][lang][0])}</button>`).join('');
  if (r.length === 2) {
    const A = RL(r[0]), B = RL(r[1]), empty = S.counts.filter((x) => !x).length;
    lab.setReadout(`${A[0]} × ${B[0]}`, '', '', '#e0b050');
    lab.setState({ emo: '🎛️', title: `${A[0]} × ${B[0]}`, lead: t.f.openL(A, B), body: empty ? o.emptyB : o.fullB, extra: '' });
  } else {
    lab.setReadout('?', '', '', '#e0b050');
    lab.setState(r.length === 1 ? { emo: '🎛️', title: o.pick1T, lead: o.pick1L(RL(r[0])[0]), body: '', extra: '' } : { emo: '🎛️', title: o.pickT, lead: o.pickL, body: '', extra: '' });
  }
}

newSort(1);
newFind(0);
