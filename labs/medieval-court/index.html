      const x0 = slotX(pos < 0 ? e : pos), x = x0 + (tx(YEARS[e]) - x0) * k, y1 = upper ? 82 : 178, y = 100 + (y1 - 100) * k;
      c.strokeStyle = '#6a4a30'; c.lineWidth = 1.5; c.globalAlpha = k; c.beginPath(); c.moveTo(x, 130); c.lineTo(x, y); c.stroke(); c.globalAlpha = 1;
      c.fillStyle = '#fff7e0'; c.strokeStyle = good ? '#2f9a62' : '#d98b2f'; c.lineWidth = 3; c.beginPath(); c.arc(x, y, 18, 0, TAU); c.fill(); c.stroke();
      emo(c, ICONS[e], x, y + 1, 22);
      if (k > 0.55) {
        c.globalAlpha = clamp((k - 0.55) / 0.45, 0, 1);
        pillText(c, String(YEARS[e]), x, upper ? y - 30 : y + 31, { size: 13, bg: 'rgba(60,40,22,.88)' });
        c.globalAlpha = 1;
      }
    }
  }
  for (let q = 0; q < 2; q++) {
    const x = q ? 175 : 10, w = 155, y = 238, h = 134, items = q ? tt.nowL : tt.thenL;
    c.fillStyle = q ? 'rgba(222,236,224,.95)' : 'rgba(240,222,176,.95)'; c.strokeStyle = q ? '#5d8a6a' : '#8a6a3a'; c.lineWidth = 1.6; rr(c, x, y, w, h, 12); c.fill(); c.stroke();
    c.font = font(16, 900); c.fillStyle = '#3d2b1a'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(q ? tt.now : tt.then, x + 12, y + 18);
    c.font = font(12, 700); let yy = y + 42;
    items.forEach((it) => { wrapLines(c, it, w - 32).forEach((l, j) => { c.fillStyle = '#3d2b1a'; if (j === 0) c.fillText('•', x + 12, yy); c.fillText(l, x + 24, yy); yy += 15; }); yy += 4; });
  }
}

let G = { s: 1, ox: 0, oy: 0 };
function frame(c, w, h, dt, time) {
  const s = Math.min(w / DW, h / DH, 1.8); K = s;
  G = { s, ox: (w - DW * s) / 2, oy: (h - DH * s) / 2 };
  const v = lab.view, hz = v === 'old' ? 172 : v === 'clues' ? 118 : 232, gy = G.oy + hz * s;
  c.save(); c.beginPath(); c.roundRect(0, 0, w, h, 18); c.clip();
  const sky = c.createLinearGradient(0, 0, 0, gy); sky.addColorStop(0, '#9dbad6'); sky.addColorStop(1, '#f6e6c4');
  c.fillStyle = sky; c.fillRect(0, 0, w, gy + 1);
  const gr = c.createLinearGradient(0, gy, 0, h); gr.addColorStop(0, '#cdbd9b'); gr.addColorStop(1, '#a58f68');
  c.fillStyle = gr; c.fillRect(0, gy, w, h - gy);
  c.translate(G.ox, G.oy); c.scale(s, s);
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (v === 'old') drawOld(c, dt, time); else if (v === 'clues') drawClues(c, dt, time); else drawTime(c, dt, time);
  c.restore();
}

// --- controls --------------------------------------------------------------------------------------------------
const ctrl = $('ctrlBody');
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function clueTap(k) {
  if (S.g2 === null) { S.cur = k; S.seen[k] = true; } else S.sel[k] = !S.sel[k];
  sfx.tick();
}
function accuse(i) { S.acc = i; S.accAt = now(); (votes(i) === 12 ? sfx.good : sfx.click)(); }
ctrl.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'g1') { S.g1 = +b.dataset.i; S.m = 'iron'; runTrials('iron', 6); (S.g1 === OK.g1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'meth') {
    const m = b.dataset.m;
    if (m === 'duel' && !secret.unlocked()) return secret.open();
    S.m = m; if (!S.tl[m].n) runTrials(m, 6); sfx.click();
  } else if (a === 'run') { runTrials(S.m, 1); sfx.tick(); }
  else if (a === 'g2') { S.g2 = +b.dataset.i; (S.g2 === OK.g2 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'clue') clueTap(+b.dataset.k);
  else if (a === 'wrong') { if (!secret.unlocked()) return secret.open(); S.wrong = !S.wrong; S.acc = null; sfx.click(); }
  else if (a === 'pick') { const e = +b.dataset.e; if (S.chk || S.ord.includes(e)) return; S.ord.push(e); sfx.tick(); }
  else if (a === 'undo') { if (!S.chk) S.ord.pop(); sfx.tick(); }
  else if (a === 'chk') { if (S.ord.length !== 4) return; S.chk = true; S.chkAt = now(); S.ord.every((e, i) => e === i) ? sfx.good() : sfx.click(); showStage(); }
  else if (a === 'again') { S.ord = []; S.chk = false; sfx.click(); }
  render();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'clues') return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.s, y = (ev.clientY - r.top - G.oy) / G.s;
  if (y >= 8 && y <= 74) {
    const k = Math.floor((x - 8) / 110);
    if (k >= 0 && k < 3 && x - 8 - k * 110 <= 104) { clueTap(k); render(); }
    return;
  }
  if (S.g2 !== null && y > 130 && y < 246) {
    const i = Math.round((x - 28) / 56.8);
    if (i >= 0 && i < 6 && Math.abs(x - px(i)) < 28) { accuse(i); render(); }
  }
});

// --- one render per change: controls, readout, state card, facts ----------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  if (v === 'old') renderOld(t); else if (v === 'clues') renderClues(t); else renderTime(t);
}
function renderOld(t) {
  const o = t.o, rev = S.g1 !== null, tl = S.tl[S.m];
  lab.setGlow('rgba(217, 164, 65, .26)');
  lab.setFacts(t.f.old);
  if (!rev) {
    ctrl.innerHTML = `<p class="mc-q">${esc(o.q)}</p><div class="mc-opts">${o.opts.map((x, i) => `<button class="mc-opt" data-a="g1" data-i="${i}">${esc(x)}</button>`).join('')}</div>`;
    lab.setReadout('?', '', '', '#d9a441');
    lab.setState({ emo: '⚖️', title: o.pre, lead: o.intro, body: '', extra: '' });
    return;
  }
  const ok = S.g1 === OK.g1, open = secret.unlocked();
  const chip = (m, label) => `<button class="chip mc-c ${S.m === m ? 'on' : ''}" data-a="meth" data-m="${m}">${esc(label)}</button>`;
  const duel = `<button class="chip mc-c secret ${open ? 'open' : ''} ${S.m === 'duel' ? 'on' : ''}" data-a="meth" data-m="duel">${open ? esc(o.m.duel) : '🔒 ???'}</button>`;
  ctrl.innerHTML = `<p class="mc-v ${ok ? 'ok' : 'no'}">${esc(ok ? o.right : o.wrong)}<span>${esc(o.seeIt)}</span></p>
    <div class="mc-row">${chip('iron', o.m.iron)}${chip('water', o.m.water)}${duel}${chip('ev', o.m.ev)}</div>
    <p class="mc-d">${esc(S.m === 'duel' && !open ? '' : o.d[S.m])}</p>
    <div class="mc-row"><button class="btn" data-a="run">${esc(o.run)}</button></div>`;
  const tb = tl.b[THIEF], ib = tl.b.reduce((x, y) => x + y, 0) - tb;
  lab.setReadout(`${tb}/${tl.n}`, o.sub, o.pill(ib), '#d9a441');
  if (S.m === 'ev') lab.setState({ emo: '🔎', title: o.evT(t.people[THIEF]), lead: o.evL, body: '', extra: '' });
  else {
    const last = tl.last, thiefB = last[THIEF], inn = last.filter((x, i) => x && i !== THIEF).length;
    lab.setState({ emo: S.m === 'iron' ? '🔥' : S.m === 'water' ? '💧' : '🛡️', title: thiefB ? o.thiefB : o.thiefF, lead: o.inno(inn), body: o.body[S.m], extra: `<div>${esc(S.m === 'duel' ? o.fineD : o.fine)}</div>` });
  }
}
function renderClues(t) {
  const c = t.c, seenN = S.seen.filter(Boolean).length, all = seenN === 3, rev = S.g2 !== null, open = secret.unlocked();
  lab.setGlow('rgba(95, 150, 200, .26)');
  lab.setFacts(t.f.clues);
  const longT = (k) => (k === 1 && S.wrong ? c.longWrong : c.long[k]);
  let html = `<div class="mc-row">${[0, 1, 2].map((k) => `<button class="chip mc-c ${(rev ? S.sel[k] : S.cur === k) ? 'on' : ''}" data-a="clue" data-k="${k}">${esc(c.chips[k])}${!rev && S.seen[k] ? ' ✓' : ''}</button>`).join('')}</div>`;
  if (!all) html += `<p class="mc-d">${esc(c.readAll)}</p>`;
  else if (!rev) html += `<div class="mc-row" style="display:block"><p class="mc-q">${esc(c.q)}</p><div class="mc-opts">${c.opts.map((x, i) => `<button class="mc-opt" data-a="g2" data-i="${i}">${esc(x)}</button>`).join('')}</div></div>`;
  else {
    const ok = S.g2 === OK.g2;
    html += `<p class="mc-v ${ok ? 'ok' : 'no'}" style="margin-top:12px">${esc(ok ? c.right : c.wrong)}<span>${S.wrong ? '' : esc(c.explain)}</span></p>
      <div class="mc-row"><button class="chip mc-c secret ${open ? 'open' : ''} ${S.wrong ? 'on' : ''}" data-a="wrong">${open ? esc(c.wrongChip) : '🔒 ???'}</button></div>`;
  }
  ctrl.innerHTML = html;
  if (!rev) {
    lab.setReadout(`${seenN}/3`, c.sub0, '', '#5f96c8');
    if (S.cur >= 0) lab.setState({ emo: c.e[S.cur], title: c.names[S.cur], lead: longT(S.cur), body: all ? c.allIn : c.found(seenN), extra: '' });
    else lab.setState({ emo: '🔎', title: c.pre, lead: c.preL, body: c.found(seenN), extra: '' });
    return;
  }
  const names = t.people;
  if (S.acc !== null) {
    const i = S.acc, vt = votes(i), list = fitList(i).map((k) => c.fitN[k]);
    lab.setReadout(`${vt}/12`, c.subJ, '', '#5f96c8');
    if (S.wrong && vt === 12 && i !== THIEF) lab.setState({ emo: '⚠️', title: c.wt, lead: c.wl(names[THIEF]), body: c.wb, extra: `<div>${esc(c.rule)}</div>` });
    else lab.setState({ emo: vt === 12 ? '⚖️' : '🤔', title: c.jt(vt), lead: c.jf(list), body: vt === 12 ? c.jb12 : S.wrong && i === THIEF ? c.wthief : c.jbLess, extra: `<div>${esc(c.rule)}</div>` });
    return;
  }
  lab.setReadout('?', c.subT, '', '#5f96c8');
  const chosen = S.sel.filter(Boolean).length;
  if (chosen) {
    const m = names.map((_, i) => i).filter((i) => S.sel.every((on, k) => !on || fits(i, k)));
    lab.setState({ emo: '🔎', title: m.length === 0 ? c.fitsNone : m.length === 1 ? c.fitsOne(names[m[0]]) : c.fitsMany(m.map((i) => names[i]).join(', ')), lead: chosen < 3 ? c.narrow : '', body: c.use, extra: '' });
  } else lab.setState({ emo: '🔎', title: S.g2 === OK.g2 ? c.right : c.wrong, lead: S.wrong ? '' : c.explain, body: c.use, extra: '' });
}
function renderTime(t) {
  const tt = t.t, n = S.ord.length, hit = S.ord.filter((e, i) => e === i).length;
  lab.setGlow('rgba(170, 120, 80, .26)');
  lab.setFacts(t.f.time);
  const cards = DISP.map((e) => {
    const pos = S.ord.indexOf(e);
    const cls = !S.chk ? (pos >= 0 ? 'used' : '') : pos === e ? 'right' : 'miss';
    const badgeTxt = S.chk ? `${YEARS[e]}` : pos >= 0 ? `${pos + 1}` : '';
    return `<button class="mc-card ${cls}" data-a="pick" data-e="${e}"><span class="e">${ICONS[e]}</span><span class="t">${esc(tt.cards[e])}</span>${badgeTxt ? `<span class="n">${badgeTxt}</span>` : ''}</button>`;
  }).join('');
  let row = '';
  if (S.chk) row = `<button class="btn" data-a="again">${esc(tt.again)}</button>`;
  else row = `<span class="mc-prog">${esc(tt.prog(n))}</span>${n > 0 ? `<button class="chip mc-c" data-a="undo">${esc(tt.undo)}</button>` : ''}${n === 4 ? `<button class="btn" data-a="chk">${esc(tt.check)}</button>` : ''}`;
  ctrl.innerHTML = `<div class="mc-cards">${cards}</div><div class="mc-row">${row}</div>`;
  if (!S.chk) {
    lab.setReadout(`${n}/4`, tt.sub, '', '#b0784f');
    lab.setState({ emo: '⏳', title: tt.pre, lead: tt.ask, body: tt.prog(n), extra: '' });
  } else {
    lab.setReadout(`${hit}/4`, tt.subR, '', '#b0784f');
    lab.setState({ emo: hit === 4 ? '✅' : '⏳', title: tt.res(hit), lead: tt.lead, body: tt.body, extra: '' });
  }
}

canvasLoop($('cv'), frame);
render();
</script>
