canvasLoop($('cv'), (c, w, h, dt, tm) => {

  else if (mode === 'built') ({ speed: drawSpeed, cold: drawCold, hide: drawHide })[S.b.test](c, w, h, tm);
  else if (mode === 'air') drawAir(c, w, h, tm);

// --- pointer ---------------------------------------------------------------------------------------------------
const cv = $('cv');
const ptr = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cv.addEventListener('pointerdown', (ev) => {
  const [x, y] = ptr(ev), mode = S.sec || lab.view;
  if (mode === 'home' && G) {
    if (y > G.seaH) {
      const i = Math.floor(x / (G.w / 6));
      if (i >= 0 && i < 6) { S.h.drag = { key: KEYS[i], x, y, sx: x, sy: y, moved: false }; try { cv.setPointerCapture(ev.pointerId); } catch { /* ignore */ } }
    } else if (S.h.sel) dropAt(S.h.sel, x);
  } else if (mode === 'octo') nextPat();
  else if (mode === 'whale') { S.w.t0 = NOW(); sfx.click(); }
});
cv.addEventListener('pointermove', (ev) => {
  const d = S.h.drag; if (!d) return;
  const [x, y] = ptr(ev); d.x = x; d.y = y;
  if (Math.hypot(x - d.sx, y - d.sy) > 8) d.moved = true;
});
const endDrag = (ev, cancel) => {
  const d = S.h.drag; if (!d) return;
  const [x, y] = ptr(ev); S.h.drag = null;
  if (cancel) return;
  if (d.moved) { if (G && y < G.seaH) { dropAt(d.key, x); } }
  else { S.h.sel = S.h.sel === d.key ? null : d.key; sfx.tick(); }
};
cv.addEventListener('pointerup', (ev) => endDrag(ev, false));
cv.addEventListener('pointercancel', (ev) => endDrag(ev, true));

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const curTest = () => S.b[S.b.test];
const correctOf = (test) => ({ speed: 'tor', cold: 'thick', air: 'yes' })[test];
function pickAnswer(id) {
  const tm = NOW();
  if (lab.view === 'air') { const A = S.a; if (A.pick) return; A.pick = id; A.t0 = tm; A.done = false; }
  else {
    const B = curTest(), test = S.b.test; if (B.pick) return;
    B.pick = id; B.t0 = tm; B.done = false;
    if (test === 'hide') B.found = B.target === 0;
  }
  sfx.click(); showStage(); render();
}
function again() {
  if (lab.view === 'air') S.a = { pick: null, t0: -1, done: false };
  else {
    const test = S.b.test, B = S.b[test];
    if (test === 'hide') S.b.hide = { pick: null, blend: B.blend, target: B.target, t0: -1, done: false, found: false };
    else S.b[test] = { pick: null, flip: !B.flip, t0: -1, done: false };
  }
  sfx.click(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'pick') pickAnswer(b.dataset.id);
  else if (act === 'again') again();
  else if (act === 'test') { S.b.test = b.dataset.id; sfx.click(); render(); }
  else if (act === 'colour') { const B = S.b.hide; if (!B.pick) { B.target = B.target ? 0 : 1; sfx.tick(); render(); } }
  else if (act === 'clear') { S.h.placed = null; S.h.sel = null; sfx.click(); render(); }
  else if (act === 'pat') nextPat();
  else if (act === 'replay') { S.w.t0 = NOW(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k;
    if (S.sec === 'whale') S.w.t0 = NOW();
    if (S.sec === 'octo' && !S.o.cells) { S.o.cells = octoCells(); setPattern(0); S.o.cells.forEach((q) => { q.col = q.tcol.slice(); q.r = q.tr; }); }
    sfx.click(); render(); showStage();
  }
});

// --- one render per change: controls, readout, state card, facts ----------------------------------------------
function predHTML(t, B, test) {
  const ids = Object.keys(t.o), ok = test === 'hide' ? (B.found ? 'yes' : 'no') : correctOf(test), done = B.done;
  return `<div class="on-q">${esc(t.q)}</div>
    <div class="on-opts">${ids.map((id) => `<button class="on-opt${B.pick === id ? ' pk' : ''}${done && id === ok ? ' good' : ''}${done && B.pick === id && id !== ok ? ' bad' : ''}" data-act="pick" data-id="${id}"${B.pick ? ' disabled' : ''}>${esc(t.o[id])}</button>`).join('')}</div>
    ${done ? `<div class="on-verdict ${B.pick === ok ? 'good' : 'bad'}">${esc(B.pick === ok ? T[lang].v.right : T[lang].v.wrong)}</div>` : ''}`;
}
function render() {
  const t = T[lang], v = S.sec || lab.view, open = secret.unlocked();
  document.body.dataset.v = v;
  let body = '', info;
  if (v === 'home') {
    const pl = S.h.placed;
    body = `<p class="on-hint">${esc(S.h.sel ? t.home.tap : t.home.hint)}</p>${pl ? `<div class="on-row"><button class="on-btn" data-act="clear">${esc(t.home.clear)}</button></div>` : ''}`;
    if (pl) {
      const n = sum3(MX[pl.a][pl.z]);
      info = { emo: '🐠', title: `${t.ful[pl.a]} · ${t.zones[pl.z]}`, lead: t.home.of(n) + ' ' + t.home.sub, body: whyText(pl.a, pl.z), val: t.home.of(n), sub: t.home.sub, pill: t.home.pills[n === 3 ? 2 : n === 0 ? 0 : 1], facts: factList(['clown', 'peng'], ['🐠', '🐧']) };
    } else info = { emo: '🐠', title: t.home.pre[0], lead: t.home.pre[1], body: t.home.pre[2], val: '–', sub: t.home.empty, pill: '', facts: [] };
  } else if (v === 'built') {
    const test = S.b.test, B = curTest(), X = { speed: t.sp, cold: t.cd, hide: t.hd }[test];
    body = `<div class="chips on-tests">${['speed', 'cold', 'hide'].map((k) => `<button class="chip${k === test ? ' on' : ''}" data-act="test" data-id="${k}">${esc(t.tests[k])}</button>`).join('')}</div>`;
    if (test === 'hide' && !B.pick) body += `<div class="on-row" style="margin:0 0 10px"><button class="on-btn" data-act="colour">${esc(t.hd.colour)}</button></div>`;
    body += predHTML(X, B, test) + (B.done ? `<div class="on-row"><button class="on-btn" data-act="again">${esc(t.v.again)}</button></div>` : '');
    if (!B.pick) info = { emo: '🔧', title: X.pre[0], lead: X.pre[1], body: X.pre[2], val: '?', sub: t.v.guess, pill: '', facts: [] };
    else if (!B.done) info = { emo: '🔧', title: X.pre[0], lead: X.pre[1], body: X.pre[2], val: '…', sub: '', pill: '', facts: [] };
    else if (test === 'hide') { const r = B.found ? t.hd.found : t.hd.hid; info = { emo: B.found ? '🦈' : '🐙', title: r[0], lead: r[1], body: r[2], val: B.found ? t.hd.valF : t.hd.valH, sub: B.found ? t.hd.subF : t.hd.subH, pill: '', facts: factList(['octo'], ['🐙']) }; }
    else info = { emo: test === 'speed' ? '🐟' : '🦭', title: X.post[0], lead: X.post[1], body: X.post[2], val: X.val, sub: X.sub, pill: '', facts: [] };
  } else if (v === 'air') {
    const A = S.a, X = t.air;
    body = predHTML(X, A, 'air') + (A.pick && A.done ? `<div class="on-row"><button class="on-btn" data-act="again">${esc(t.v.again)}</button></div>` : '');
    if (!A.pick) info = { emo: '🐬', title: X.pre[0], lead: X.pre[1], body: X.pre[2], val: '?', sub: t.v.guess, pill: '', facts: [] };
    else if (!A.done) info = { emo: '🐬', title: X.pre[0], lead: X.pre[1], body: X.pre[2], val: '…', sub: '', pill: '', facts: [] };
    else info = { emo: '🐬', title: X.post[0], lead: X.post[1], body: X.post[2], val: X.val, sub: X.sub, pill: '', facts: factList(['whale'], ['🐋']) };
  } else if (v === 'octo') {
    body = `<div class="on-row" style="margin:0 0 4px"><button class="on-btn" data-act="pat">${esc(t.oc.btn)}</button></div>`;
    info = { emo: '🐙', title: t.oc.st[0], lead: t.oc.st[1], body: t.oc.st[2], val: t.oc.val, sub: t.oc.sub, pill: '', facts: factList(['octo'], ['🐙']) };
  } else {
    body = `<div class="on-row" style="margin:0 0 4px"><button class="on-btn" data-act="replay">${esc(t.wh.btn)}</button></div>`;
    info = { emo: '🐋', title: t.wh.st[0], lead: t.wh.st[1], body: t.wh.st[2], val: t.wh.val, sub: t.wh.sub, pill: '', facts: factList(['whale'], ['🐋']) };
  }
  body += `<div class="on-sec">${[['octo', 'a', '🐙'], ['whale', 'b', '🐋']].map(([k, s, e]) => `<button class="chip secret${open ? ' open' : ''}${S.sec === k ? ' on' : ''}" data-act="sec" data-k="${k}">${open ? e : '🔒'} ${esc(t.secrets[s][0])}</button>`).join('')}</div>`;
  $('ctrlBody').innerHTML = body;
  lab.setReadout(info.val, info.sub, info.pill);
  lab.setState({ emo: info.emo, title: info.title, lead: info.lead, body: info.body });
  lab.setFacts(info.facts);
}
render();
</script>
</body>
</html>
