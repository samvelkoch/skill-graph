    render(); showStage(); return;

  const vc = ev.target.closest('[data-vat]');
  if (vc) { S.vat = +vc.dataset.vat; sfx.click(); vatBurst(); render(); return; }
  const oc = ev.target.closest('[data-old]');
  if (oc) { S.oldKind = oc.dataset.old; S.old = []; oldSpawn(S.oldKind, 6); sfx.click(); render(); return; }
  const md = ev.target.closest('[data-mode]');
  if (md) { if (md.dataset.mode !== S.mode) { runAlone(md.dataset.mode); sfx.click(); render(); showStage(); } return; }
  const cd = ev.target.closest('[data-svc]');
  if (cd) {
    const k = cd.dataset.svc; if (S.paid.has(k)) return;
    if (S.sel.has(k)) S.sel.delete(k); else S.sel.add(k);
    sfx.tick(); render(); return;
  }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'collect') {
    const B = budget(); S.coins = []; S.collected = true; sfx.click();
    if (B > S.potShown + 0.01) collect(B - S.potShown); else S.potTarget = B;
    render(); showStage();
  } else if (act === 'pay') {
    const list = [...S.sel].filter((k) => !S.paid.has(k)).sort((a, b2) => ORDER[a] - ORDER[b2]);
    const C = list.reduce((a, k) => a + COST[k], 0);
    if (!list.length || paidSum() + C > budget()) return;
    list.forEach((k, i) => { S.paid.add(k); later(i * 0.65, () => payService(k, () => { S.dec[SV.indexOf(k)] = 0; })); });
    S.note = T[lang].payNote(list.map((k) => T[lang].svc[k]).join(', '), budget() - paidSum());
    S.noteKind = 'pay'; S.noteData = { list: list.slice(), left: budget() - paidSum() };
    sfx.click(); render(); showStage();
  } else if (act === 'next') nextYear();
});
function nextYear() {
  const worn = [], paid = [];
  SV.forEach((k, i) => {
    if (S.paid.has(k)) { paid.push(k); S.dec[i] = 0; } else if (S.dec[i] < 3) { S.dec[i] += 1; worn.push(k); }
  });
  S.year++; S.paid.clear(); S.coins = []; S.fx = []; S.potShown = 0; S.potTarget = budget(); collect(budget());
  S.noteKind = 'next'; S.noteData = { y: S.year, paid, worn };
  sfx.snap(); render(); showStage();
}
$('tpRange').addEventListener('input', (ev) => {
  S.rate = +ev.target.value;
  if (lab.view === 'pot') { S.collected = false; S.coins = []; S.potTarget = 0; }
  else if (lab.view === 'choose') S.potTarget = Math.max(0, budget() - paidSum());
  render();
});
$('tpRange').addEventListener('change', () => {
  if (lab.view !== 'choose') return;
  S.coins = []; S.potShown = 0; S.potTarget = Math.max(0, budget() - paidSum()); collect(S.potTarget);
});
function vatBurst() {
  const r = VATR[S.vat], x0 = 30 + 300 * (1 - r / (100 + r) / 2);
  fly(() => x0 + rnd(-10, 10), 356, () => 306 + rnd(-8, 8), 232, Math.max(2, Math.round(10 * r / (100 + r))), { gap: 0.18, dur: 1, h: 70, onLast: () => { S.vatT = Math.min(5, S.vatT + 1); } });
}

// --- render ------------------------------------------------------------------------------------------------------
const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, B = budget();
  const asking = (v === 'pot' && S.p1 === null) || (v === 'alone' && S.p3 === null);
  const pq = v === 'pot' ? S.p1 : S.p3, qd = v === 'pot' ? t.qPot : t.qAlone;
  show('tpQ', !sec && v !== 'choose'); show('tpVerdict', !sec && v !== 'choose' && pq !== null);
  show('tpRate', !sec && ((v === 'pot' && !asking) || v === 'choose')); show('tpPot', !sec && v === 'pot' && !asking);
  show('tpChoose', !sec && v === 'choose'); show('tpAlone', !sec && v === 'alone' && !asking);
  show('tpVatCtl', sec === 'vat'); show('tpOldCtl', sec === 'old');
  if (v !== 'choose') {
    $('tpQ').innerHTML = `<div class="tp-qt">${esc(qd.q)}</div><div class="chips">${qd.opts.map((o, i) => `<button class="chip ${pq === null ? '' : i === qd.ok ? 'ok' : i === pq ? 'miss' : 'dim'}" data-ans="${i}"${pq === null ? '' : ' disabled'}>${pq !== null && i === qd.ok ? '✓ ' : ''}${esc(o)}</button>`).join('')}</div>`;
    $('tpVerdict').innerHTML = pq === null ? '' : `<div class="tp-verdict"><b style="color:${pq === qd.ok ? 'var(--ok)' : 'var(--wip)'}">${esc(pq === qd.ok ? t.vOk : t.vNo)}</b>${esc(qd.v[pq])}</div>`;
  }
  // pot / rate
  $('tpRateLbl').textContent = t.rate; $('tpRateVal').textContent = `${S.rate} %`;
  if ($('tpRange').value !== String(S.rate)) $('tpRange').value = S.rate;
  $('tpPot').firstElementChild.textContent = `🪙 ${t.collect}`;
  // council
  const C = [...S.sel].filter((k) => !S.paid.has(k)).reduce((a, k) => a + COST[k], 0), P = paidSum(), spent = P + C, over = spent > B;
  $('tpFill').style.width = `${B > 0 ? Math.min(100, 100 * spent / B) : (spent > 0 ? 100 : 0)}%`; $('tpFill').classList.toggle('over', over);
  $('tpBarTxt').innerHTML = `<span>${esc(t.chosen)}</span><span class="${over ? 'over' : ''}">${spent} / ${B}${over ? ' · ' + esc(t.over) : ''}</span>`;
  $('tpCards').innerHTML = SV.map((k, i) => {
    const d = Math.round(S.dec[i]), on = S.sel.has(k), pd = S.paid.has(k), fill = 3 - d, col = ['#ff5a4d', '#ff9a4d', '#f5c84c', '#3ddc97'][fill];
    return `<button class="tp-card ${on ? 'on' : ''} ${pd ? 'paid' : ''}" data-svc="${k}" role="checkbox" aria-checked="${on || pd}"><span class="tp-e">${EMO[k]}</span>
      <span class="tp-n">${esc(t.svc[k])}<small>${esc(t.cost(COST[k]))}</small></span><span class="tp-box">✓</span>
      <span class="tp-cond">${[0, 1, 2].map((j) => `<i style="${j < fill ? `background:${col}` : ''}"></i>`).join('')}<span>${esc(t.cond[d])}</span></span></button>`;
  }).join('');
  $('tpPay').textContent = `💰 ${t.pay}`; $('tpPay').disabled = over || C === 0;
  $('tpNext').textContent = `▶ ${t.next}`; $('tpYear').textContent = t.year(S.year);
  let note = B === 0 ? t.noTax : t.hint;
  if (S.noteKind === 'pay') note = t.payNote(S.noteData.list.map((k) => t.svc[k]).join(', '), fmt(S.noteData.left));
  else if (S.noteKind === 'next') { const l = (a) => (a.length ? a.map((k) => t.svc[k]).join(', ') : t.none); note = t.nextNote(S.noteData.y, l(S.noteData.paid), l(S.noteData.worn)); }
  $('tpNote').textContent = note;
  // alone
  $('tpMode').innerHTML = ['one', 'all'].map((m) => `<button class="${S.mode === m ? 'on' : ''}" data-mode="${m}">${esc(m === 'one' ? t.one : t.all)}</button>`).join('');
  $('tpSum').textContent = '';
  // secrets
  const open = secret.unlocked();
  $('tpSecs').innerHTML = [['vat', '🧾', t.secrets.a[0]], ['old', '🏛️', t.secrets.b[0]]].map(([k, e, n]) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${e} ${esc(n)}` : '🔒 ???'}</button>`).join('');
  $('tpVatChips').innerHTML = t.vat.c.map((n, i) => `<button class="chip ${S.vat === i ? 'on' : ''}" data-vat="${i}">${esc(n)} · ${VATR[i]} %</button>`).join('');
  const rv = VATR[S.vat], sh = rv / (100 + rv);
  $('tpVatF').textContent = t.vat.f(rv, fmt(sh * 100));
  $('tpOldChips').innerHTML = ['grain', 'goat', 'work'].map((k) => `<button class="chip ${S.oldKind === k ? 'on' : ''}" data-old="${k}">${esc(t.old.chips[k])}</button>`).join('');
  $('tpOldCap').textContent = t.old.cap;
  // readout + state card
  const c = S.rate / 2;
  if (sec === 'vat') {
    lab.setReadout(esc(t.vat.val(10 * sh)), t.vat.sub(rv), t.vat.pill, '#d98b4a');
    lab.setState({ emo: '🧾', title: t.vat.title, lead: t.vat.lead(t.vat.c[S.vat], rv, 10 * sh), body: t.vat.body });
  } else if (sec === 'old') {
    lab.setReadout(esc(t.old.val), t.old.sub, t.old.pill, '#e0b45c');
    lab.setState({ emo: '🏛️', title: t.old.title, lead: t.old.lead, body: t.old.body });
  } else if (v === 'pot') {
    if (asking) { lab.setReadout('?', '', '', '#d98b4a'); lab.setState({ emo: '🏘️', ...t.stPot0, extra: '' }); }
    else {
      lab.setReadout(`<span style="font-size:24px">${esc(t.potVal(B))}</span>`, t.potSub(c), S.collected ? t.pillCol : t.pillTap, '#d98b4a');
      if (B === 0) lab.setState({ emo: '🕳️', ...t.stZero });
      else lab.setState({ emo: '💰', title: t.stPot1.title, lead: S.collected ? t.stPot1.lead(S.rate, c, B) : t.stPot1.wait, body: t.stPot1.body });
    }
    lab.setGauge(S.potShown / 300, [{ f: 0, label: '0' }, { f: 0.5, label: '150' }, { f: 1, label: '300' }], t.views.pot);
  } else if (v === 'choose') {
    lab.setReadout(`${spent} / ${B}`, `${t.chosen}`, over ? t.over : t.left(B - spent), over ? '#ff5a4d' : '#3ddc97');
    lab.setState({ emo: '🏛️', ...t.stChoose });
    lab.setGauge(S.potShown / 300, [{ f: 0, label: '0' }, { f: 0.5, label: '150' }, { f: 1, label: '300' }], t.views.choose);
  } else {
    if (asking) { lab.setReadout('?', '', '', '#ffd166'); lab.setState({ emo: '🏠', ...t.stAlone0 }); }
    else if (S.mode === 'one') { lab.setReadout(esc(t.aVal1(50)), t.aSub1, t.aPill1, '#ffd166'); lab.setState({ emo: '🏠', ...t.stOne }); }
    else { lab.setReadout(esc(t.aVal2), t.aSub2, t.aPill2, '#3ddc97'); lab.setState({ emo: '🏘️', ...t.stAll }); }
    lab.setGauge(S.potShown / 300, [{ f: 0, label: '0' }, { f: 1, label: '300' }], t.views.alone);
  }
  lab.setFacts(t.facts[v]);
}

// --- canvas ------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (ctx, w, h, dt, time) => {
  // timeline
  S.tlT += dt;
  for (let i = 0; i < S.tl.length; i++) { const e = S.tl[i]; if (e.at <= S.tlT) { S.tl.splice(i, 1); i--; e.fn(); } }
  S.fx.forEach((f) => { if (f.delay > 0) f.delay -= dt; else f.t += dt; });
  S.fx = S.fx.filter((f) => f.t < f.dur);
  let landed = 0;
  for (const k of S.coins) {
    if (k.delay > 0) { k.delay -= dt; continue; }
    k.t = Math.min(1, k.t + dt / k.dur); k.spin += k.ds * dt;
    if (k.t >= 1 && !k.done) { k.done = true; k.onLand?.(); landed++; }
  }
  S.coins = S.coins.filter((k) => !k.done);
  if (landed && ++S.land % 3 === 0) sfx.tick();
  // easing of pot level and service looks
  if (!S.coins.some((k) => k.kind === 'in')) { const df = S.potTarget - S.potShown; S.potShown = Math.abs(df) < 0.3 ? S.potTarget : S.potShown + df * (1 - Math.exp(-dt * 5)); }
  const v = lab.view;
  const tgt = v === 'choose' ? S.dec : v === 'alone' ? S.aDec : [0, 0, 0, 0, 0, 0];
  SV.forEach((k, i) => {
    S.D[i] += (tgt[i] - S.D[i]) * (1 - Math.exp(-dt * 3));
    const hv = v === 'choose' ? (S.paid.has(k) && S.dec[i] < 0.05 ? 1 : 0) : v === 'alone' ? (S.aLit.has(k) ? 1 : 0) : 0;
    S.H[i] += (hv - S.H[i]) * (1 - Math.exp(-dt * 3));
  });
  S.myLampV += (S.myLamp - S.myLampV) * (1 - Math.exp(-dt * 4));
  S.fam += (S.famT - S.fam) * (1 - Math.exp(-dt * 3));
  S.vatShown += (VATR[S.vat] / (100 + VATR[S.vat]) - S.vatShown) * (1 - Math.exp(-dt * 6));
  const fr = S.potShown / 300; if (Math.abs(fr - S.gLast) > 0.003) { S.gLast = fr; lab.setGauge(fr); }
  const s = Math.min(w / 360, h / 420), ox = (w - 360 * s) / 2, oy = (h - 420 * s) / 2;
  ctx.save(); ctx.translate(ox, oy); ctx.scale(s, s);
  if (S.sec === 'vat') drawVat(ctx, time); else if (S.sec === 'old') drawOld(ctx, time, dt); else drawTown(ctx, time);
  ctx.restore();
});

enter();
render();
</script>
