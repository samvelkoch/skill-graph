    if (!S.g2) html = `<div class="bd-q">${esc(J.q)}</div>${opts('g2', ['r', 'w', 'p'], t.kinds, true)}`;
    else {
      html = `<div class="row2" style="margin-top:0"><div class="chips">${['cut', 'germ', 'oxy'].map((m) => `<button class="chip ${S.mode2 === m ? 'on' : ''}" data-act="mode" data-k="${m}">${esc(J.modes[m])}</button>`).join('')}</div></div>
        ${S.mode2 === 'cut' ? '' : `<div class="bd-fine">${esc(J.tap)}</div>`}<div class="row2"><button class="chip" data-act="replay">${esc(J.replay)}</button></div>`;
    }
  } else {
    const C = t.cmp;
    if (!S.g3) html = `<div class="bd-q">${esc(C.q)}</div><div class="bd-opts">${['h', 'f', 'b'].map((k) => `<button class="bd-opt" data-act="g3" data-k="${k}">${esc(C.opts[k])}</button>`).join('')}</div>`;
    else if (S.step3 === 'blood') html = `<div class="bd-lab"><span>${esc(C.zoom)}</span></div><input class="bd-range" id="bdZ" type="range" min="10" max="30" step="1" value="${Math.round(S.zoom3 * 10)}" aria-label="${esc(C.zoom)}">
      <div class="row2"><button class="btn" data-act="step" data-k="tissue">${esc(C.tissues)}</button></div>`;
    else html = `<div class="bd-tiles">${['epi', 'con', 'mus', 'ner'].map((k) => `<button class="bd-tile" data-act="tile" data-k="${k}"${S.done[k] ? ' disabled' : ''}>${esc(t.tis[k][0])}<small>${esc(t.tis[k][1])}</small></button>`).join('')}</div>
      <div class="row2"><button class="chip" data-act="step" data-k="blood">${esc(C.back)}</button></div>`;
  }
  el.innerHTML = html;
}
function renderInfo() {
  const t = T[lang], v = lab.view;
  lab.setGlow('rgba(214, 70, 90, .26)');
  if (v !== 'look' && !S.g1) { lab.setReadout('?', '', '', ACC); lab.setState({ emo: '🔒', title: t.gate.title, lead: t.gate.lead, body: '' }); lab.setFacts([]); return; }
  if (v === 'look') infoLook(t); else if (v === 'jobs') infoJobs(t); else infoCmp(t);
}
function infoLook(t) {
  const L = t.look;
  if (S.sec === 'spin') {
    const s = t.sec.spin, st = S.spin >= 1 ? 2 : S.spinning ? 1 : 0;
    lab.setReadout(st === 2 ? '55 / 45' : '?', st === 2 ? s.sub : '', '', ACC);
    lab.setState(st === 2 ? { emo: '🧪', title: s.title, lead: s.lead, body: '' } : st === 1 ? { emo: '🌀', title: s.spinning, lead: '', body: '' } : { emo: '🧪', title: s.mixTitle, lead: s.mixLead, body: '' });
    lab.setFacts(t.facts.spin); return;
  }
  if (S.sec === 'abo') {
    const A = S.abo, a = t.sec.abo, hit = A.mixed && A.sample && A.serum;
    lab.setReadout(hit ? `${A.sample} + ${A.serum}` : '?', hit ? (reactive(A.sample, A.serum) ? a.yes : a.no) : '', '', ACC);
    lab.setState(hit ? { emo: reactive(A.sample, A.serum) ? '🧬' : '🙂', title: reactive(A.sample, A.serum) ? a.yes : a.no, lead: reactive(A.sample, A.serum) ? a.yesLead(A.sample, A.serum) : a.noLead(A.sample, A.serum), body: '' } : { emo: '🩸', title: a.title, lead: a.lead, body: '' });
    lab.setFacts(t.facts.abo); return;
  }
  if (!S.g1) { lab.setReadout('?', '', '', ACC); lab.setState({ emo: '🩸', title: L.predTitle, lead: L.predLead, body: '' }); lab.setFacts(t.facts.look0); return; }
  const f = FIELDS[S.field % 8], sharp = isSharp(), q = sqCount(f), ok = S.g1 === 'r';
  if (sharp) lab.setReadout(q.n, L.sq(q.r, q.w, q.p), L.field(S.field + 1), ACC); else lab.setReadout('…', L.turn, L.field(S.field + 1), ACC);
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: sharp ? L.lead(cnt(f, 'r'), cnt(f, 'p'), cnt(f, 'w')) : L.blurLead, body: sharp ? L.scale : '' });
  lab.setFacts(t.facts.look1);
}
function infoJobs(t) {
  const J = t.jobs, m = S.mode2;
  if (!S.g2) { lab.setReadout('?', '', '', ACC); lab.setState({ emo: '🩹', title: J.predTitle, lead: J.predLead, body: '' }); lab.setFacts(t.facts.jobs0); return; }
  lab.setFacts(t.facts.jobs1);
  const ok = S.g2 === 'p', msg = S.jmsg;
  if (m === 'cut') {
    const cu = S.j.cut, ph = cu.net >= 1 ? 3 : cu.net > 0.05 ? 2 : cu.stuck >= 3 ? 1 : 0;
    lab.setReadout(cu.stuck, J.cutSub, cu.net >= 1 ? J.pSealed : J.pLeak, ACC);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: J.cut[ph], body: '' });
    return;
  }
  const X = J[m], n = m === 'germ' ? S.j.germ.eaten : S.j.oxy.n;
  lab.setReadout(`${n}/3`, X.sub, '', ACC);
  if (n >= 3) lab.setState({ emo: '🎉', title: X.doneTitle, lead: X.doneLead, body: '' });
  else if (msg && msg.kind === 'ok') lab.setState({ emo: m === 'germ' ? '🦠' : '💨', title: X.ok, lead: X.okLead, body: '' });
  else if (msg && msg.kind === 'wrong') lab.setState({ emo: '🤔', title: X.title, lead: X.wrong[msg.key], body: '' });
  else lab.setState({ emo: m === 'germ' ? '🦠' : '💪', title: X.title, lead: X.lead, body: '' });
}
function infoCmp(t) {
  const C = t.cmp;
  if (!S.g3) { lab.setReadout('?', '', '', ACC); lab.setState({ emo: '🧪', title: C.predTitle, lead: C.predLead, body: '' }); lab.setFacts(t.facts.cmp0); return; }
  const ok = S.g3 === 'f';
  if (S.step3 === 'blood') {
    lab.setReadout(`×${S.zoom3.toFixed(1)}`, C.size, '', ACC);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: C.lead, body: C.body });
    lab.setFacts(t.facts.cmp1); return;
  }
  const n = Object.keys(S.done).length, m = S.m3;
  lab.setReadout(`${n}/4`, C.tSub, '', ACC); lab.setFacts(t.facts.tis);
  if (n >= 4) lab.setState({ emo: '🎉', title: C.tDoneTitle, lead: C.tDoneLead, body: '' });
  else if (m && m.kind === 'ok') lab.setState({ emo: '✅', title: t.right, lead: t.tis[m.tile][2], body: '' });
  else if (m && m.kind === 'wrong') lab.setState({ emo: '🤔', title: t.notq, lead: C.tWrong, body: '' });
  else if (m && m.kind === 'pick') lab.setState({ emo: '👆', title: C.tTitle, lead: C.tPick, body: '' });
  else lab.setState({ emo: '🧫', title: C.tTitle, lead: C.tLead, body: '' });
}
function render() { renderCtrl(); renderInfo(); [S.sig, S.csig] = sigs(); }

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a === 'g1') { if (S.g1) return; S.g1 = k; S.zoomT = 0; (k === 'r' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'g2') { if (S.g2) return; S.g2 = k; S.j.cut.t = 0; (k === 'p' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'g3') { if (S.g3) return; S.g3 = k; S.rev3 = 0; (k === 'f' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'next') { S.field++; S.fieldT = 0; sfx.click(); }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = k; if (k === 'spin') { S.spin = 0; S.spinning = false; } else S.abo = { sample: null, serum: null, mixed: false, t: 0 }; sfx.click(); showStage(); }
  else if (a === 'back') { S.sec = null; sfx.click(); }
  else if (a === 'spin') { if (S.spin >= 1) S.spin = 0; S.spinning = true; sfx.push(); }
  else if (a === 'unspin') { S.spin = 0; S.spinning = false; sfx.click(); }
  else if (a === 'aboS') { S.abo.sample = k; S.abo.mixed = false; S.abo.t = 0; sfx.tick(); }
  else if (a === 'aboZ') { S.abo.serum = k; S.abo.mixed = false; S.abo.t = 0; sfx.tick(); }
  else if (a === 'mix') { S.abo.mixed = true; S.abo.t = 0; sfx.snap(); }
  else if (a === 'mode') { if (S.mode2 === k) return; S.mode2 = k; const keep = S.g2; initJobs(); S.g2 = keep; sfx.click(); }
  else if (a === 'replay') { initJobs(); sfx.click(); }
  else if (a === 'goto') { document.querySelector('#views [data-view="look"]')?.click(); return; }
  else if (a === 'step') { S.step3 = k; S.sel = -1; S.m3 = null; sfx.click(); }
  else if (a === 'tile') {
    if (S.sel < 0) { S.m3 = { kind: 'pick', key: 'pick', tile: '' }; sfx.bad(); }
    else if (ORDER[S.sel] === k) { S.done[k] = true; S.m3 = { kind: 'ok', key: 'ok', tile: k }; S.sel = -1; sfx.good(); }
    else { S.m3 = { kind: 'wrong', key: 'wrong' + Math.random(), tile: k }; S.shk3 = { i: S.sel, t: 0.5 }; sfx.bad(); }
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'bdF') { S.focus = +ev.target.value; renderInfo(); }
  else if (ev.target.id === 'bdZ') { S.zoom3 = +ev.target.value / 10; renderInfo(); }
});
const cv = $('cv');
const setSq = (ev) => {
  const r = cv.getBoundingClientRect();
  let x = (ev.clientX - r.left - geo.cx) / geo.R, y = (ev.clientY - r.top - geo.cy) / geo.R; const d = Math.hypot(x, y);
  if (d > 0.7) { x *= 0.7 / d; y *= 0.7 / d; }
  S.sq = { x, y };
};
cv.addEventListener('pointerdown', (ev) => {
  const v = lab.view, r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  if (v === 'look' && S.g1 && !S.sec && S.zoomT > 0.9) { S.drag = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* ignore */ } setSq(ev); }
  else if (v === 'jobs' && S.g2 && (S.mode2 === 'germ' || S.mode2 === 'oxy')) {
    const rad = geo.rad; if (!rad) return;
    let best = null, bd = 1e9;
    for (const c of V) { if (c.st !== 'flow' || c.x < 0 || c.x > r.width) continue; const d = Math.hypot(c.x - px, c.y - py); if (d < Math.max(rad[c.k] + 8, 22) && d < bd) { bd = d; best = c; } }
    if (!best) return;
    const J = S.j, w = r.width, h = r.height;
    if (S.mode2 === 'germ') {
      if (best.k !== 'w') { S.jmsg = { kind: 'wrong', key: best.k }; S.shake = { v: best, t: 0.5 }; sfx.bad(); }
      else {
        const bi = J.germ.b.findIndex((g) => g.alive && g.tg < 0);
        if (bi < 0) return;
        const g = J.germ.b[bi], vi = V.indexOf(best); g.tg = vi; g.p = 0; S.jmsg = { kind: 'ok', key: 'ok' };
        best.st = 'go'; best.sx = best.x; best.sy = best.y; best.tx = g.fx * w; best.ty = g.fy * h - rad.w * 0.4; best.t = 0; best.T = 1.6; best.tg = bi; sfx.snap();
      }
    } else {
      const pend = V.filter((c) => c.k === 'r' && (c.st === 'go' || c.st === 'work')).length;
      if (best.k !== 'r') { S.jmsg = { kind: 'wrong', key: best.k }; S.shake = { v: best, t: 0.5 }; sfx.bad(); }
      else if (J.oxy.n + pend >= 3) return;
      else { const [fx, fy] = OXT[J.oxy.n + pend]; S.jmsg = { kind: 'ok', key: 'ok' }; best.st = 'go'; best.sx = best.x; best.sy = best.y; best.tx = fx * w; best.ty = fy * h; best.t = 0; best.T = 1.4; sfx.snap(); }
    }
    renderInfo();
  } else if (v === 'cmp' && S.g3 && S.step3 === 'tissue') {
    const i = geo.slides.findIndex((s) => Math.hypot(px - s.cx, py - s.cy) < s.r);
    if (i < 0 || S.done[ORDER[i]]) return;
    S.sel = S.sel === i ? -1 : i; S.m3 = null; sfx.tick(); renderInfo();
  }
});
cv.addEventListener('pointermove', (ev) => { if (S.drag) setSq(ev); });
['pointerup', 'pointercancel'].forEach((e) => cv.addEventListener(e, () => { S.drag = false; }));

// --- frame ------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const g = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.1, w / 2, h / 2, Math.max(w, h) * 0.75); g.addColorStop(0, '#1d2036'); g.addColorStop(1, '#0a0c16');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v !== 'look' && !S.g1) drawLock(c, w, h);
  else if (v === 'look') drawLook(c, w, h, dt, time);
  else if (v === 'jobs') drawJobs(c, w, h, dt, time);
  else drawCmp(c, w, h, dt, time);
  syncUI();
});
render();
</script>
