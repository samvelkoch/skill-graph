  g = c.createLinearGradient(0, GY, 0, GY + 30); g.addColorStop(0, '#4d9fd6'); g.addColorStop(1, '#245b8e');
  c.fillStyle = g; c.fillRect(114, GY, 70, 30);
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.2; c.beginPath(); for (let k = 0; k < 3; k++) { c.moveTo(122 + k * 22, GY + 10 + k * 5); c.quadraticCurveTo(130 + k * 22, GY + 6 + k * 5, 138 + k * 22, GY + 10 + k * 5); } c.stroke();
  // siren mast
  c.strokeStyle = '#8a92a6'; c.lineWidth = 3; c.beginPath(); c.moveTo(352, GY); c.lineTo(352, GY - 64); c.stroke();
  const sirenOn = plan.siren; c.fillStyle = sirenOn ? '#e5453b' : '#6a7388'; c.beginPath(); c.roundRect(344, GY - 74, 16, 11, 3); c.fill();
  if (sirenOn && res && qT < 5.4) { c.strokeStyle = `rgba(229,69,59,${0.7 - ((qT * 2) % 1) * 0.6})`; c.lineWidth = 2; c.beginPath(); c.arc(352, GY - 68, 10 + ((qT * 2) % 1) * 12, Math.PI, Math.PI * 2); c.stroke(); }
  if (plan.pad) { for (const bx of [196, 224]) { c.fillStyle = '#15151c'; c.beginPath(); c.roundRect(bx, GY - 9, 14, 9, 3); c.fill(); } }
  BLD.forEach((b, i) => drawBuilding(c, b, i, qT, plan, res));
  drawDust(c, dt);
  c.restore();
  BLD.forEach((b) => { if (b.lab) pill(c, b.lab, b.x + b.w / 2, GY + 14, '#fff', 12); });
  // people
  const tx = T[lang].town; pill(c, tx.ppl, 62, 266, '#fff', 12);
  if (p.phase === 'result') p.rev += dt;
  const safeN = p.res ? p.res.safe : 0;
  for (let k = 0; k < 100; k++) {
    const col = p.phase === 'result' && p.rev > k * 0.015 ? (k < safeN ? '#3ddc97' : '#e5645e') : '#8fa6d8';
    const dx = 22 + (k % 20) * 16.2, dy = 290 + Math.floor(k / 20) * 16;
    c.fillStyle = col; c.beginPath(); c.arc(dx, dy, 5.2, 0, 7); c.fill(); c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1; c.stroke();
  }
  if (p.phase === 'result') { pill(c, tx.safe, 240, 266, '#3ddc97', 12); pill(c, tx.danger, 320, 266, '#e5645e', 12); }
}

// --- scenes of views 1 and 2 --------------------------------------------------------------------------------
function strengthBar(c, v, mx) {
  pill(c, T[lang].strength, 52, 24, '#fff', 12);
  c.fillStyle = 'rgba(8,10,20,.82)'; c.beginPath(); c.roundRect(96, 19, 100, 10, 5); c.fill();
  const g = c.createLinearGradient(96, 0, 196, 0); g.addColorStop(0, '#f5c84c'); g.addColorStop(1, '#e5453b');
  c.fillStyle = g; c.beginPath(); c.roundRect(96, 19, Math.max(6, 100 * clamp(v / mx, 0, 1)), 10, 5); c.fill();
}
function draw1(c, t, dt) {
  const p = S.p1; drawHall(c); drawTable(c, null);
  const cxs = [70, 180, 290];
  p.sims.forEach((s, i) => drawTower(c, s, cxs[i], 20, 64, COL[i], dt));
  drawDust(c, dt);
  cxs.forEach((x, i) => pill(c, t.twl[i], x, TY + 8, COL[i], 12));
  if (p.phase === 'run') strengthBar(c, amp1(G.t), A1);
  drawTrace(c, 8, 272, 344, 142, p.sims.map((s, i) => ({ arr: s.tr, col: COL[i], lab: 'ABC'[i] })), t);
}
function draw2(c, t, dt) {
  const p = S.p2;
  if (p.phase !== 'explore') {
    drawHall(c); drawTable(c, null);
    drawTower(c, p.sims[0], 95, 20, 56, C5, dt); drawTower(c, p.sims[1], 255, 12.5, 52, C15, dt);
    pill(c, t.o2[0], 95, TY + 8, C5, 12); pill(c, t.o2[1], 255, TY + 8, C15, 12);
    if (p.phase === 'run') strengthBar(c, amp2(G.t), A2);
    drawTrace(c, 8, 272, 344, 142, [{ arr: p.sims[0].tr, col: C5, lab: t.o2[0] }, { arr: p.sims[1].tr, col: C15, lab: t.o2[1] }], t);
    return;
  }
  const s = p.sims[0], quake = p.mode === 'quake', N = s.N;
  drawHall(c); drawTable(c, quake ? (p.soil ? 'lake' : 'rock') : null);
  const fh = Math.min(22, 190 / N), tw = N > 12 ? 48 : 56;
  drawTower(c, s, 180, fh, tw, C5, dt); drawDust(c, dt);
  if (quake) { pill(c, p.soil ? t.soil.lake : t.soil.rock, 180, TY + 40, p.soil ? '#e8c48a' : '#d0d5e0', 12); drawTrace(c, 8, 272, 344, 142, [{ arr: s.tr, col: C5 }], t); }
  else { pill(c, t.nfl(N), 180, TY + 8, C5, 12); drawTrace(c, 8, 272, 344, 66, [{ arr: s.tr, col: C5 }], t); drawBars(c, 8, 344, 344, 72, t); }
}

// --- controls and state cards -------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function onView() { setupG(); render(); }
function goView(v) { $('views').querySelector(`[data-view="${v}"]`)?.click(); }
const chip = (cls, act, attrs, label) => `<button type="button" class="chip st ${cls}" data-act="${act}" ${attrs}>${label}</button>`;
function secretRow(t) {
  const open = secret.unlocked(), p = S.p2;
  const a = chip(`secret ${open ? 'open' : ''} ${open && p.sec === 'ball' && p.ball && p.mode === 'sine' ? 'on' : ''}`, 'sa', '', open ? `⚖️ ${esc(t.secrets.a[0])}` : '🔒 ???');
  const b = chip(`secret ${open ? 'open' : ''} ${open && p.mode === 'quake' ? 'on' : ''}`, 'sb', '', open ? `🏞️ ${esc(t.secrets.b[0])}` : '🔒 ???');
  return `<div class="st-sec">${a}${b}</div>`;
}
function ctrl1(t) {
  const p = S.p1, run = p.phase === 'run';
  let h = '';
  if (p.first) {
    h += `<p class="st-q">${esc(t.q1)}</p><div class="chips">${['A', 'B', 'C', 'BC'].map((k, i) => {
      const done = p.phase === 'done', cls = done ? (k === p.key ? 'okc' : k === p.guess ? 'badc' : '') : p.guess === k ? 'on' : '';
      return chip(cls, 'g1', `data-k="${k}" ${p.phase !== 'predict' ? 'disabled' : ''}`, esc(t.o1[i]));
    }).join('')}</div>`;
  }
  if (p.judged) {
    h += `<div class="st-sub">${esc(t.brace)} · ${esc(t.pads)}</div>` + p.cfg.map((c, i) => {
      const r = p.phase === 'done' && p.res ? `${p.res[i].fell ? t.fell : t.stood} · ${num(p.res[i].mx, 0)} ${'cm'}` : '';
      return `<div class="st-tw"><span class="nm" style="color:${COL[i]}">${'ABC'[i]}</span>${chip(c.brace ? 'on' : '', 'tb', `data-i="${i}" ${run ? 'disabled' : ''}`, `${c.brace ? '✓ ' : ''}${esc(t.brace)}`)}${chip(c.pad ? 'on' : '', 'tp', `data-i="${i}" ${run ? 'disabled' : ''}`, `${c.pad ? '✓ ' : ''}${esc(t.pads)}`)}<span class="rs">${esc(r)}</span></div>`;
    }).join('');
  }
  const first = p.phase === 'predict';
  h += `<div class="st-row"><button type="button" class="btn" data-act="go1" ${run || (first && !p.guess) ? 'disabled' : ''}>${esc(first || run ? t.shake : t.again)}</button></div>`;
  $('ctrlBody').innerHTML = h + secretRow(t);
}
function ctrl2(t) {
  const p = S.p2, run = p.phase === 'run';
  let h = '';
  if (p.phase !== 'explore') {
    h += `<p class="st-q">${esc(t.q2)}</p><div class="chips">${['5', '15'].map((k, i) => {
      const done = p.phase === 'ready', cls = done ? (k === p.key ? 'okc' : k === p.guess ? 'badc' : '') : p.guess === k ? 'on' : '';
      return chip(cls, 'g2', `data-k="${k}" ${p.phase !== 'predict' ? 'disabled' : ''}`, esc(t.o2[i]));
    }).join('')}</div><div class="st-row">`;
    h += p.phase === 'ready' ? `<button type="button" class="btn" data-act="nx">${esc(t.next)}</button>` : `<button type="button" class="btn" data-act="go2" ${run || !p.guess ? 'disabled' : ''}>${esc(t.shake)}</button>`;
    h += '</div>';
  } else if (p.mode === 'quake') {
    h += `<div class="chips">${chip(!p.soil ? 'on' : '', 'gr', '', esc(t.soil.rock))}${chip(p.soil ? 'on' : '', 'gl', '', esc(t.soil.lake))}${chip('', 'redo', '', esc(t.soil.redo))}</div><p class="st-note">${esc(t.soil.note)}</p>`;
  } else {
    h += `<div class="st-sl"><span>${esc(t.fl)}</span><input class="big" id="sn" type="range" min="3" max="20" step="1" value="${p.N}"><b id="snv">${p.N}</b></div>
      <div class="st-sl" style="grid-template-columns:70px 1fr"><span>${esc(t.sk)}</span><input class="big" id="sf" type="range" min="0" max="1000" step="1" value="${Math.round(p.s * 1000)}"></div>
      <div class="ends" style="margin-left:78px"><span>${esc(t.ends[0])}</span><span>${esc(t.ends[1])}</span></div>`;
  }
  $('ctrlBody').innerHTML = h + secretRow(t);
}
function ctrl3(t) {
  const p = S.p3, tt = t.town, pl = p.plan, left = 10 - cost(pl), lock = p.phase === 'quake';
  const m = (k, c) => chip(pl[k] ? 'on' : (c > left ? 'off' : ''), 'm', `data-k="${k}" ${lock ? 'disabled' : ''}`, `${pl[k] ? '✓ ' : ''}${esc(tt.m[k])} · ${c}🪙`);
  const h = `<div class="chips">${m('pad', 4)}${m('drill', 1)}${m('siren', 3)}${m('avoid', 1)}</div>
    <div class="st-sub">${esc(tt.brace)}</div><div class="chips">${BLD.map((b) => chip(pl.brace[b.id] ? 'on' : (left < 2 ? 'off' : ''), 'bb', `data-id="${b.id}" ${lock ? 'disabled' : ''}`, `${pl.brace[b.id] ? '✓ ' : ''}${esc(tt.bn[b.id])}`)).join('')}</div>
    <div class="st-row"><button type="button" class="btn" data-act="qk" ${lock ? 'disabled' : ''}>${esc(tt.quake)}</button><button type="button" class="btn ghost" data-act="clr" ${lock ? 'disabled' : ''}>${esc(tt.clear)}</button></div>`;
  $('ctrlBody').innerHTML = h + secretRow(t);
}
function render() {
  const t = T[lang], v = lab.view;
  if (v === 'stand') ctrl1(t); else if (v === 'rhythm') ctrl2(t); else ctrl3(t);
  lab.setFacts(t.facts[v]);
  paint();
  lab.checkStage?.();
}
const spanN = (s, i, tag) => `<span style="color:${COL[i]}">${tag} ${num(peakOf(s), 0)}</span>`;
function paint() {
  const t = T[lang], v = lab.view;
  if (v === 'stand') {
    const p = S.p1, sum = p.sims.map((s, i) => `${'ABC'[i]}: ${s.alive < s.N ? t.fell : t.stood}`).join(' · ');
    const fl = p.sims.map((s, i) => (s.alive < s.N ? 'ABC'[i] : '')).filter(Boolean).join(', ');
    lab.setReadout(`<span style="font-size:24px">${p.sims.map((s, i) => spanN(s, i, 'ABC'[i])).join(' &nbsp;')}</span>`, t.sub, p.phase === 'done' ? (fl ? t.pill1(fl) : t.pill1n) : '');
    if (p.phase === 'predict') lab.setState({ ...t.s1 });
    else if (p.phase === 'run') lab.setState({ ...t.run1 });
    else if (p.phase === 'done') lab.setState({ emo: p.first ? (p.verdict ? '✅' : '🤔') : '📈', title: p.first ? (p.verdict ? t.right : t.notq) : (fl ? t.pill1(fl) : t.pill1n), lead: sum, body: t.done1 });
    else lab.setState({ ...t.rdy1 });
  } else if (v === 'rhythm') {
    const p = S.p2, s0 = p.sims[0];
    if (p.phase !== 'explore') {
      lab.setReadout(`<span style="font-size:24px"><span style="color:${C15}">15: ${num(peakOf(p.sims[1]), 0)}</span> &nbsp;<span style="color:${C5}">5: ${num(peakOf(p.sims[0]), 0)}</span></span>`, t.sub, '');
      if (p.phase === 'predict') lab.setState({ ...t.s2 });
      else if (p.phase === 'run') lab.setState({ ...t.run2 });
      else lab.setState({ emo: p.verdict ? '✅' : '🤔', title: p.verdict ? t.right : t.notq, lead: t.rdy2(num(p.sims[1].mx, 0), num(p.sims[0].mx, 0)), body: t.rdy2b });
    } else {
      const pk = peakOf(s0);
      lab.setReadout(num(pk, pk < 10 ? 1 : 0) + ' <small style="font-size:16px">cm</small>', t.sub, p.mode === 'quake' ? '' : t.pillf(num(G.f, 1)));
      if (p.mode === 'quake') {
        const f = (k) => (p.peaks[k] == null ? t.soil.wait : `${num(p.peaks[k], 0)} cm${p.fell[k] ? ' · ' + t.fell : ''}`);
        if (p.sims[0]) { const k = p.soil ? 'lake' : 'rock'; p.peaks[k] = s0.mx; p.fell[k] = s0.alive < s0.N; }
        lab.setState({ emo: '🏞️', title: t.soil.title, lead: t.soil.lead(f('rock'), f('lake')), body: t.soil.body });
      } else if (p.ball && p.sec === 'ball') {
        lab.setState({ emo: '⚖️', title: t.ball.title, lead: t.ball.lead(num(swayAt(p.N, false, G.f), 0), num(swayAt(p.N, true, G.f), 0)), body: t.ball.body });
      } else {
        const hit = Math.abs(Math.log(G.f / f1of(p.N))) < 0.07;
        lab.setState({ emo: t.ex.emo, title: t.ex.title, lead: hit ? t.ex.hit : t.ex.lead, body: t.ex.body });
      }
    }
  } else {
    const p = S.p3, tt = t.town;
    lab.setReadout(`🪙 ${10 - cost(p.plan)}`, tt.coins, p.phase === 'result' ? `${p.res.safe} / 100` : '');
    if (p.phase === 'plan') lab.setState({ emo: tt.emo, title: tt.title, lead: tt.lead, body: tt.body });
    else if (p.phase === 'quake') lab.setState({ ...tt.run });
    else {
      const r = p.res, nm = (h) => (h.k === 'b' ? tt.hb(tt.bn[h.id]) : tt[{ pad: 'hp', drill: 'hd', siren: 'hs', avoid: 'ha' }[h.k]]);
      const list = r.helped.length ? `<b>${esc(tt.help)}</b><ul class="st-help">${r.helped.map((h) => `<li>${esc(nm(h))}: +${h.d}</li>`).join('')}</ul>` : `<b>${esc(tt.none)}</b>`;
      lab.setState({ emo: r.safe >= 90 ? '🏆' : r.safe >= 75 ? '👍' : '⚠️', title: tt.res(r.safe), lead: `${tt.stand(r.stand)} ${r.safe >= 90 ? tt.g3 : r.safe >= 75 ? tt.g2 : tt.g1}`,
        body: r.out.hosp.works ? tt.hosp : '', extra: `${list}<p class="st-note">${esc(tt.layers)}</p>` });
    }
  }
}

// --- actions --------------------------------------------------------------------------------------------------
function startRun1() {
  const p = S.p1; if (p.judged) p.first = false;
  mk1(); p.phase = 'run'; p.res = null; G.mode = 'sine'; G.f = 1.3; G.amp = amp1; G.t = 0; G.th = 0; G.x = 0; G.v = 0; TR.R = 10; sfx.push(); render(); showStage();
}
function finish1() {
  const p = S.p1; p.res = p.sims.map((s) => ({ fell: s.alive < s.N, mx: s.mx }));
  p.key = p.res.map((r, i) => (r.fell ? '' : 'ABC'[i])).join('');
  if (!p.judged) { p.judged = true; p.verdict = p.guess === p.key; (p.verdict ? sfx.good : sfx.bad)(); }
  p.phase = 'done'; render();
}
function startRun2() {
  const p = S.p2; mk2(); p.phase = 'run'; G.mode = 'sine'; G.f = 0.7; G.amp = amp2; G.t = 0; G.th = 0; G.x = 0; G.v = 0; TR.R = 10; sfx.push(); render(); showStage();
}
function finish2() {
  const p = S.p2; p.key = p.sims[1].mx > p.sims[0].mx ? '15' : '5'; p.verdict = p.guess === p.key; (p.verdict ? sfx.good : sfx.bad)(); p.phase = 'ready'; render();
}
function touch3() { const p = S.p3; if (p.phase === 'result') { p.phase = 'plan'; p.res = null; DUST.length = 0; } }
function toggleBrace(id) {
  const p = S.p3; if (p.phase === 'quake') return; const pl = p.plan;
  if (pl.brace[id]) { delete pl.brace[id]; sfx.tick(); } else if (cost(pl) + 2 <= 10) { pl.brace[id] = true; sfx.snap(); } else { sfx.bad(); return; }
  touch3(); render();
}
function doBall() {
  if (!secret.unlocked()) return secret.open();
  goView('rhythm'); const p = S.p2;
  if (!(p.sec === 'ball' && p.phase === 'explore' && p.mode === 'sine')) { p.sec = 'ball'; p.mode = 'sine'; p.phase = 'explore'; p.N = 15; p.s = fToS(f1of(15)); p.ball = true; } else p.ball = !p.ball;
  rebuildExplore(); sfx.click(); render();
}
function doSoil() {
  if (!secret.unlocked()) return secret.open();
  goView('rhythm'); const p = S.p2;
  if (p.mode === 'quake') { p.mode = 'sine'; p.sec = null; rebuildExplore(); }
  else { p.sec = 'soil'; p.phase = 'explore'; p.mode = 'quake'; p.N = 15; p.ball = false; p.soil = false; startQuake(); TR.R = 10; }
  sfx.click(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, p1 = S.p1, p2 = S.p2, p3 = S.p3;
  if (a === 'g1') { p1.guess = b.dataset.k; sfx.click(); render(); }
  else if (a === 'go1') startRun1();
  else if (a === 'tb' || a === 'tp') { const c = p1.cfg[+b.dataset.i]; if (a === 'tb') c.brace = !c.brace; else c.pad = !c.pad; p1.first = false; p1.phase = 'ready'; mk1(); G.t = 100; G.x = 0; G.v = 0; sfx.click(); render(); }
  else if (a === 'g2') { p2.guess = b.dataset.k; sfx.click(); render(); }
  else if (a === 'go2') startRun2();
  else if (a === 'nx') { p2.phase = 'explore'; p2.mode = 'sine'; p2.sec = null; p2.ball = false; rebuildExplore(); sfx.click(); render(); }
  else if (a === 'sa') doBall();
  else if (a === 'sb') doSoil();
  else if (a === 'gr' || a === 'gl') { p2.soil = a === 'gl'; startQuake(); TR.R = 10; sfx.click(); render(); }
  else if (a === 'redo') { startQuake(); TR.R = 10; sfx.click(); render(); }
  else if (a === 'm') {
    const k = b.dataset.k, cst = { pad: 4, drill: 1, siren: 3, avoid: 1 }[k];
    if (p3.plan[k]) { p3.plan[k] = false; sfx.tick(); } else if (cost(p3.plan) + cst <= 10) { p3.plan[k] = true; sfx.snap(); } else { sfx.bad(); return; }
    touch3(); render();
  }
  else if (a === 'bb') toggleBrace(b.dataset.id);
  else if (a === 'clr') { p3.plan = { brace: {}, pad: false, drill: false, siren: false, avoid: false }; touch3(); sfx.click(); render(); }
  else if (a === 'qk') startQuake3();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const p = S.p2, id = ev.target.id;
  if (id === 'sn') { p.N = +ev.target.value; $('snv').textContent = p.N; rebuildExplore(); paint(); }
  else if (id === 'sf') { p.s = +ev.target.value / 1000; G.f = sToF(p.s); visit(); snap(); paint(); }
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'town') return;
  const r = $('cv').getBoundingClientRect(), sc = Math.min(r.width / W, r.height / H), x = (ev.clientX - r.left - (r.width - W * sc) / 2) / sc, y = (ev.clientY - r.top - (r.height - H * sc) / 2) / sc;
  if (y < 30 || y > GY + 24) return;
  const b = BLD.find((q) => x >= q.x - 2 && x <= q.x + q.w + 2); if (b) toggleBrace(b.id);
});

// --- the loop -------------------------------------------------------------------------------------------------
let paintT = 0;
canvasLoop($('cv'), (c, w, h, dt) => {
  SC = Math.min(w / W, h / H);
  const t = T[lang], v = lab.view;
  if (v === 'stand') { advance(S.p1.sims, dt); if (S.p1.phase === 'run' && G.t >= 13.5) finish1(); }
  else if (v === 'rhythm') {
    const p = S.p2; advance(p.sims, dt);
    if (p.phase === 'run' && G.t >= 13) finish2();
  } else {
    const p = S.p3;
    if (p.phase === 'quake') { p.qT += dt; if (p.qT >= 6.2) { p.phase = 'result'; (p.res.safe >= 75 ? sfx.good : sfx.bad)(); render(); } }
  }
  c.save(); c.translate((w - W * SC) / 2, (h - H * SC) / 2); c.scale(SC, SC);
  if (v === 'stand') draw1(c, t, dt); else if (v === 'rhythm') draw2(c, t, dt); else drawTown(c, dt, t);
  c.restore();
  paintT += dt; if (paintT > 0.12) { paintT = 0; paint(); }
});
S.p1.first = true;
setupG();
render();
</script>
</body>
</html>
