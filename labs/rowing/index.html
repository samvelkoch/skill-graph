    c.strokeStyle = sel ? '#fff' : '#9a8a5a'; c.lineWidth = sel ? 3 : 1.5; rr(c, cx - cw / 2, cy0, cw, ch, 8); c.stroke();
    c.font = `${loud ? 26 : 21}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#1b1e30'; c.fillText(t.l.tags[i].split(' ')[0], cx, cy0 + ch / 2 + 1);
    kid(c, cx, cyk, r, PAL[i], { loud, look: 0 });
    if (loud) { c.strokeStyle = 'rgba(255,220,120,.85)'; c.lineWidth = 2; c.lineCap = 'round'; for (let k = 1; k <= 3; k++) { const a = 0.55 + 0.1 * Math.sin(time * 6 - k); c.globalAlpha = a; c.beginPath(); c.arc(cx + 14, cyk - 4, 6 + k * 5, -0.7, 0.7); c.stroke(); } c.globalAlpha = 1; }
  }
  c.restore();
  if (!done) {
    pill(c, 'A', X(KX[0] + 30), Y(150), { maxW: w, bg: '#e0b050', fg: '#10131f' });
    P.pair.forEach((i) => pill(c, 'B', X(KX[i] + (i === 0 ? 30 : 22)), Y(i === 0 ? 150 : 160), { maxW: w, bg: '#3ddc97', fg: '#10131f' }));
  }
}

// --- Ringelmann's rope ---------------------------------------------------------------------------------------
function drawRope(c, w, h, dt, time) {
  const R = S, per = (R.board ? PER_BOARD : PER_NO)[R.n];
  R.rper = lerp(R.rper, per, Math.min(1, dt * 6)); R.rneed = lerp(R.rneed, (R.n * R.rper / 100) / 8, Math.min(1, dt * 5));
  const sk = c.createLinearGradient(0, 0, 0, h * 0.6); sk.addColorStop(0, '#7fc4e8'); sk.addColorStop(1, '#cfeaf0'); c.fillStyle = sk; c.fillRect(0, 0, w, h);
  const { sc, ox, oy } = mkTf(w, h, 300, 200), gy = oy + 126 * sc;
  const gg = c.createLinearGradient(0, gy, 0, h); gg.addColorStop(0, '#6fb36f'); gg.addColorStop(1, '#3f7f4a'); c.fillStyle = gg; c.fillRect(0, gy, w, h - gy);
  c.save(); c.translate(ox, oy); c.scale(sc, sc);
  // post with spring scale
  c.fillStyle = '#7a5a38'; c.strokeStyle = '#4a2d14'; c.lineWidth = 1.5; rr(c, 10, 70, 14, 56, 3); c.fill(); c.stroke();
  const dg = c.createRadialGradient(36, 28, 2, 40, 32, 24); dg.addColorStop(0, '#fff'); dg.addColorStop(1, '#cfd5e6');
  c.fillStyle = dg; c.strokeStyle = '#5a6288'; c.lineWidth = 2.5; c.beginPath(); c.arc(40, 34, 22, 0, 7); c.fill(); c.stroke();
  c.strokeStyle = '#4a5070'; c.lineWidth = 1.2; for (let k = 0; k <= 8; k++) { const a = Math.PI * (1.0 + k / 8 * 1.0); c.beginPath(); c.moveTo(40 + Math.cos(a) * 16, 34 + Math.sin(a) * 16); c.lineTo(40 + Math.cos(a) * 19, 34 + Math.sin(a) * 19); c.stroke(); }
  const na = Math.PI * (1 + R.rneed); c.strokeStyle = '#e5484d'; c.lineWidth = 2.5; c.lineCap = 'round'; c.beginPath(); c.moveTo(40, 34); c.lineTo(40 + Math.cos(na) * 16, 34 + Math.sin(na) * 16); c.stroke();
  c.fillStyle = '#1b1e30'; c.beginPath(); c.arc(40, 34, 2.5, 0, 7); c.fill();
  c.strokeStyle = '#4a2d14'; c.lineWidth = 2; c.beginPath(); c.moveTo(24, 98); c.lineTo(34, 56); c.stroke();
  // board
  c.fillStyle = '#9a6b3a'; c.strokeStyle = '#4a2d14'; c.lineWidth = 2; rr(c, 100, 6, 190, 56, 6); c.fill(); c.stroke();
  c.fillStyle = '#2b3a2e'; rr(c, 106, 12, 178, 44, 4); c.fill();
  const bw = 178 / R.n;
  for (let i = 0; i < R.n; i++) {
    const bx = 106 + i * bw + bw * 0.2, bww = bw * 0.6;
    if (R.board) { const bh = 38 * (R.rper / 100); c.fillStyle = PAL[i % 4]; rr(c, bx, 54 - bh, bww, bh, 2); c.fill(); }
    else { c.fillStyle = 'rgba(255,255,255,.18)'; c.font = '900 14px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', bx + bww / 2, 34); }
  }
  // rope
  c.strokeStyle = '#4a2d14'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(30, 104); c.lineTo(292, 104); c.stroke();
  c.strokeStyle = '#d3a96c'; c.lineWidth = 3; c.beginPath(); c.moveTo(30, 104); c.lineTo(292, 104); c.stroke();
  c.strokeStyle = 'rgba(90,60,30,.5)'; c.lineWidth = 1; for (let x = 34; x < 290; x += 6) { c.beginPath(); c.moveTo(x, 102); c.lineTo(x + 3, 106); c.stroke(); }
  // people
  for (let i = R.n - 1; i >= 0; i--) {
    const x = 272 - i * 30, lean = (R.rper / 100) * 7 + Math.sin(time * 4 + i) * 0.8;
    c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(x + lean * 0.4, 122, 12, 3.5, 0, 0, 7); c.fill();
    kid(c, x + lean, 100, 11, PAL[i % 4], { look: -1 });
    c.fillStyle = '#f2d1a8'; c.strokeStyle = '#8a6a3a'; c.lineWidth = 1; c.beginPath(); c.arc(x + lean - 11, 104, 3.2, 0, 7); c.fill(); c.stroke();
  }
  // pull per person bar
  c.fillStyle = 'rgba(10,12,20,.55)'; rr(c, 40, 146, 220, 14, 7); c.fill();
  const bg2 = c.createLinearGradient(40, 0, 260, 0); bg2.addColorStop(0, '#e0b050'); bg2.addColorStop(1, '#3ddc97');
  c.fillStyle = bg2; rr(c, 40, 146, Math.max(1, 220 * R.rper / 100), 14, 7); c.fill();
  c.restore();
  pill(c, `${T[lang].rope.pp}: ${Math.round(R.rper)}%`, w / 2, oy + 178 * sc, { maxW: w });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec === 'cox') drawCox(c, w, h, dt, time);
  else if (S.sec === 'rope') drawRope(c, w, h, dt, time);
  else if (lab.view === 'pull') drawPull(c, w, h, dt, time);
  else if (lab.view === 'jobs') drawJobs(c, w, h, dt, time);
  else drawListen(c, w, h, dt, time);
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const resetPull = () => { S.ph = 'set'; S.t = 0; S.sim = null; S.pred = null; S.clock = 0; };
const resetJobs = () => { S.jph = 'set'; S.jt = 0; S.jpred = null; };
const resetListen = () => { S.lph = 'set'; S.lt = 0; S.lpred = null; };
const btn = (act, attrs, cls, txt, dis) => `<button class="${cls}" data-act="${act}" ${attrs || ''}${dis ? ' disabled' : ''}>${txt}</button>`;
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, d = b.dataset;
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = d.k;
    if (S.sec === k) S.sec = null;
    else { S.sec = k; lab.view = k === 'cox' ? 'pull' : 'jobs'; lab.renderChrome(); if (k === 'cox') S.cx = { ph: 'idle', t: 0, tick: -1 }; }
    sfx.click(); return render();
  }
  if (a === 'pre') { S.r = PRESETS[+d.k].map(([s, dd]) => ({ s, d: dd })); S.pre = +d.k; resetPull(); sfx.click(); }
  else if (a === 'dir') { if (S.ph === 'row') return; S.r[+d.i].d = +d.v; S.pre = null; resetPull(); sfx.tick(); }
  else if (a === 'str') { if (S.ph === 'row') return; S.r[+d.i].s = +d.v; if (S.r[+d.i].d === 0) S.r[+d.i].d = 1; S.pre = null; resetPull(); sfx.tick(); }
  else if (a === 'pred') { if (S.ph === 'row') return; S.pred = d.k; sfx.click(); }
  else if (a === 'row') { if (!S.pred || S.ph === 'row') return; S.sim = simulate(S.r); S.ph = 'row'; S.t = 0; S.clock = 0; sfx.push(); showStage(); }
  else if (a === 'again') { resetPull(); sfx.click(); }
  else if (a === 'task') { if (S.jph === 'run') return; S.sel = S.sel === +d.i ? null : +d.i; sfx.click(); }
  else if (a === 'kid') {
    if (S.jph === 'run' || S.sel === null) return;
    const l = S.asg[S.sel], at = l.indexOf(+d.i); if (at >= 0) l.splice(at, 1); else l.push(+d.i);
    resetJobs(); sfx.snap();
  }
  else if (a === 'jclear') { S.asg = [[], [], [], []]; S.sel = null; resetJobs(); sfx.click(); }
  else if (a === 'jpred') { if (S.jph === 'run') return; S.jpred = +d.k; sfx.click(); }
  else if (a === 'jstart') { if (S.jpred === null || !S.sched || S.jph === 'run') return; S.jph = 'run'; S.jt = 0; sfx.push(); showStage(); }
  else if (a === 'jagain') { resetJobs(); sfx.click(); }
  else if (a === 'idea') {
    if (S.lph === 'done') return;
    const i = +d.i, at = S.pair.indexOf(i);
    if (at >= 0) S.pair.splice(at, 1); else { S.pair.push(i); if (S.pair.length > 2) S.pair.shift(); }
    sfx.snap();
  }
  else if (a === 'lpred') { if (S.lph === 'done') return; S.lpred = d.k; sfx.click(); }
  else if (a === 'lgo') { if (!S.lpred || S.pair.length !== 2) return; S.lph = 'done'; S.lt = 0; sfx.good(); showStage(); }
  else if (a === 'lagain') { resetListen(); S.pair = []; sfx.click(); }
  else if (a === 'cxgo') { S.cx = { ph: 'run', t: 0, tick: -1 }; sfx.push(); showStage(); }
  else if (a === 'rn') { S.n = +d.n; sfx.click(); }
  else if (a === 'rb') { S.board = !S.board; sfx.click(); }
  render();
});

// --- render --------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = S.sec || lab.view, fv = lab.view;
  for (const [id, k] of [['sPull', 'pull'], ['sJobs', 'jobs'], ['sListen', 'listen'], ['sCox', 'cox'], ['sRope', 'rope']]) $(id).style.display = v === k ? 'block' : 'none';
  const un = secret.unlocked(), sc = (k, emo, nm) => `<button class="chip secret ${un ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${un ? `${emo} ${esc(nm)}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('cox', '📣', t.secrets.a[0]) + sc('rope', '🪢', t.secrets.b[0]);
  const F = t.facts[fv];
  lab.setFacts([{ emo: fv === 'pull' ? '🚣' : fv === 'jobs' ? '🪢' : '🦢', text: F.text, src: F.src }]);
  if (v === 'pull') renderPull(t); else if (v === 'jobs') renderJobs(t); else if (v === 'listen') renderListen(t); else if (v === 'cox') renderCox(t); else renderRope(t);
  lab.checkStage?.();
}
function renderPull(t) {
  const P = S, p = t.p, run = P.ph === 'row', sm = sums(P.r), d = sm.L - sm.R;
  lab.setGlow('rgba(60, 130, 190, .3)');
  const cell = (i) => {
    const q = P.r[i], dis = run;
    return `<div class="rw-cell"><div class="nm"><i class="rw-dot" style="background:${PAL[i]}"></i>${esc(p.pos[i])}</div>
      <div class="rw-row">${[['1', '↑', 0], ['-1', '↓', 1], ['0', '⏸', 2]].map(([v, g, k]) => btn('dir', `data-i="${i}" data-v="${v}" title="${esc(p.dirs[k])}" aria-label="${esc(p.dirs[k])}"`, `rw-b ${q.d === +v ? 'on' : ''}`, g, dis)).join('')}</div>
      <div class="rw-row" style="margin-top:4px">${[1, 2, 3].map((s) => btn('str', `data-i="${i}" data-v="${s}" aria-label="${esc(p.str)} ${s}"`, `rw-b ${q.d !== 0 && q.s === s ? 'on' : ''}`, s, dis)).join('')}</div></div>`;
  };
  $('sPull').innerHTML = `<div class="rw-lbl">${esc(p.presetL)}</div><div class="rw-chips">${p.pre.map((n, k) => btn('pre', `data-k="${k}"`, `chip ${P.pre === k ? 'on' : ''}`, esc(n), run)).join('')}</div>
    <div class="rw-lbl">${esc(p.rowersL)}</div><div class="rw-grid">${[0, 1, 2, 3].map(cell).join('')}</div>
    <div class="rw-lbl">${esc(p.ask)}</div><div class="rw-chips">${['L', 'S', 'R', 'B', 'N'].map((k) => `<button class="chip ${P.pred === k ? 'on' : ''}" data-act="pred" data-k="${k}"${run ? ' disabled' : ''}>${BUOY[k] ? `<i class="rw-dot" style="background:${BUOY[k][2]}"></i>` : '⚪'} ${esc(p.dest[k])}</button>`).join('')}</div>
    <div class="rw-go">${P.ph === 'done' ? btn('again', '', 'btn ghost', esc(p.again)) : btn('row', '', 'btn', esc(P.pred ? p.go : p.pick), !P.pred || run)}</div>`;
  lab.setReadout(sg(sm.F), p.sub, p.turn(d), '#4ea8ff');
  if (P.ph === 'set') lab.setState({ emo: '🚣', title: p.set[0], lead: p.set[1], body: p.set[2], extra: '' });
  else if (P.ph === 'row') lab.setState({ emo: '🌊', title: p.rowing[0], lead: p.rowing[1], body: '', extra: '' });
  else { const ex = p.ex(sg(sm.F), sg(sm.L), sg(sm.R)); lab.setState({ emo: P.ok ? '🎯' : '🧭', title: P.ok ? t.ok : t.no, lead: `${p.result}: ${p.dest[P.sim.res]}.`, body: ex.join(' '), extra: '' }); }
}
function renderJobs(t) {
  const j = t.j, P = S, run = P.jph === 'run', full = P.asg.every((l) => l.length > 0);
  P.sched = full ? schedule(P.asg) : null;
  lab.setGlow('rgba(224, 176, 80, .24)');
  const tile = (i) => `<button class="rw-tile ${P.sel === i ? 'on' : ''}" data-act="task" data-i="${i}"><span class="e">${TASKS[i].emo}</span>${esc(j.tn[i])}<small>${TASKS[i].m} ${esc(t.mn)}</small>
    <span class="dots">${P.asg[i].map((k) => `<i class="rw-dot" style="background:${PAL[k]}"></i>`).join('')}</span></button>`;
  const ktile = (k) => `<button class="rw-tile" data-act="kid" data-i="${k}" style="border-color:${PAL[k]}"><i class="rw-dot" style="background:${PAL[k]};width:16px;height:16px"></i>${esc(j.kids[k])}<small>${P.asg.filter((l) => l.includes(k)).length}</small></button>`;
  $('sJobs').innerHTML = `<p class="rw-hint">${esc(P.sel !== null ? j.pickKid : j.rule)}</p><div class="rw-lbl">${esc(j.jobsL)}</div><div class="rw-tiles">${[0, 1, 2, 3].map(tile).join('')}</div>
    <div class="rw-lbl">${esc(j.kidsL)}</div><div class="rw-tiles">${[0, 1, 2, 3].map(ktile).join('')}</div>
    <div class="rw-lbl">${esc(j.ask)}</div><div class="rw-chips">${j.br.map((n, k) => btn('jpred', `data-k="${k}"`, `chip ${P.jpred === k ? 'on' : ''}`, esc(n), run)).join('')}</div>
    <div class="rw-go">${P.jph === 'done' ? btn('jagain', '', 'btn ghost', esc(j.again)) : btn('jstart', '', 'btn', esc(j.start), !full || P.jpred === null || run)}${btn('jclear', '', 'chip', esc(j.clear), run)}</div>`;
  if (P.jph === 'set') {
    lab.setReadout('?', j.sub, '', '#e0b050');
    lab.setState({ emo: '📋', title: j.set[0], lead: !full ? j.need : P.jpred === null ? j.ready : j.set[1], body: j.rule, extra: '' });
  } else if (P.jph === 'run') { lab.setReadout('…', j.sub, '', '#e0b050'); lab.setState({ emo: '⏱️', title: j.run[0], lead: j.run[1], body: '', extra: '' }); }
  else {
    const f = P.sched.finish, w = P.sched.blocks.filter((b) => b.dup).length, u = new Set(P.sched.blocks.map((b) => b.kid)).size;
    lab.setReadout(f, j.sub, '', '#e0b050');
    lab.setState({ emo: P.jok ? '🎯' : '🧭', title: P.jok ? t.ok : t.no, lead: j.lead(f), body: j.body(w, u, f), extra: '' });
  }
}
function renderListen(t) {
  const l = t.l, P = S, done = P.lph === 'done', ready = P.lpred && P.pair.length === 2;
  lab.setGlow('rgba(143, 127, 208, .26)');
  $('sListen').innerHTML = `<p class="rw-hint">${esc(l.topic)} · ${esc(l.pairHint)}</p>
    ${[0, 1, 2, 3].map((i) => `<button class="rw-idea ${P.pair.includes(i) ? 'on' : ''}" data-act="idea" data-i="${i}"><b>${esc(l.tags[i])}</b> · ${esc(l.kids[i])}${i === 0 ? ' 📢' : ''}<br>${esc(l.cards[i])}</button>`).join('')}
    <div class="rw-lbl">${esc(l.ask)}</div><div class="rw-chips">${['A', 'B'].map((k) => btn('lpred', `data-k="${k}"`, `chip ${P.lpred === k ? 'on' : ''}`, esc(l.opts[k]), done)).join('')}</div>
    <div class="rw-go">${done ? btn('lagain', '', 'btn ghost', esc(l.again)) : btn('lgo', '', 'btn', esc(l.go), !ready)}</div>`;
  if (!done) { lab.setReadout('?', l.quality, '', '#8f7fd0'); lab.setState({ emo: '🗣️', title: l.set[0], lead: l.set[1], body: l.set[2], extra: '' }); }
  else {
    const a = quality(new Set([0])), b = quality(new Set(P.pair)), best = P.pair.includes(1) && P.pair.includes(2);
    lab.setReadout(`${nf(b)}<small style="font-size:16px;color:var(--mut)"> / 10</small>`, `B · ${l.quality}`, `A: ${nf(a)}`, '#8f7fd0');
    lab.setState({ emo: P.lpred === 'B' ? '🎯' : '🧭', title: P.lpred === 'B' ? t.ok : t.no, lead: l.lead(nf(a), nf(b)), body: l.body(best), extra: '' });
  }
}
function renderCox(t) {
  const c = t.cox, X = S.cx;
  lab.setGlow('rgba(60, 130, 190, .3)');
  $('sCox').innerHTML = `<div class="rw-go" style="margin-top:0">${X.ph === 'idle' ? btn('cxgo', '', 'btn', esc(c.race)) : X.ph === 'done' ? btn('cxgo', '', 'btn ghost', esc(c.again)) : btn('cxgo', '', 'btn', esc(c.race), true)}</div>`;
  if (X.ph === 'idle') { lab.setReadout('?', c.sub, '', '#4ea8ff'); lab.setState({ emo: '📣', title: c.idle[0], lead: c.idle[1], body: c.idle[2], extra: '' }); }
  else if (X.ph === 'run') { lab.setReadout('…', c.sub, '', '#4ea8ff'); lab.setState({ emo: '📣', title: c.run[0], lead: c.run[1], body: '', extra: '' }); }
  else { const a = Math.round(cdist(10, 1)), b = Math.round(cdist(10, 0.55)), r = c.res(a, b); lab.setReadout(a, c.sub, `${c.out}: ${b}`, '#4ea8ff'); lab.setState({ emo: '🏁', title: r[0], lead: r[1], body: '', extra: '' }); }
}
function renderRope(t) {
  const r = t.rope, n = S.n, per = (S.board ? PER_BOARD : PER_NO)[n], tot = nf(Math.round(n * per) / 100, 2);
  lab.setGlow('rgba(111, 179, 111, .26)');
  $('sRope').innerHTML = `<div class="rw-lbl">${esc(r.n)}</div><div class="rw-chips">${[1, 2, 4, 8].map((k) => btn('rn', `data-n="${k}"`, `chip ${n === k ? 'on' : ''}`, k)).join('')}</div>
    <div class="rw-chips" style="margin-top:8px">${btn('rb', '', `chip ${S.board ? 'on' : ''}`, `📋 ${esc(r.board)}`)}</div>`;
  lab.setReadout(`${per}%`, r.pp, '', '#6fb36f');
  lab.setState({ emo: '🪢', title: r.title(n, per), lead: r.lead(n, per, tot), body: r.body(S.board, n), extra: `<div style="font-size:11px;color:var(--faint)">${esc(r.fine)}</div>` });
}
render();
</script>
</body>
