// --- controls -----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'pick') return pick(+b.dataset.k);
  if (act === 'next') {
    if (S.end) { S.round++; S.i = 0; S.right = []; S.gen = genRound(); startPair(); }
    else if (S.i >= 5) endRound();
    else { S.i++; startPair(); }
    sfx.click();
  } else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'thousand') { TH.step = 0; startThousand(); } else buildSh(false); }
    sfx.click(); showStage();
  } else if (act === 'thNext') {
    if (TH.step === 0) { TH.step = 1; startThousand(); } else S.sec = null;
    sfx.click();
  } else if (act === 'dg') {
    const i = +b.dataset.i, d = +b.dataset.s; let nd = S.digits[i];
    do { nd += d; if (nd > 9) nd = 1; if (nd < 1) nd = 9; } while (S.digits.some((x, j) => j !== i && x === nd));
    S.digits[i] = nd; buildSh(true); sfx.tick();
  } else if (act === 'zin') lineZoom(1);
  else if (act === 'zout') lineZoom(-1);
  else if (act === 'check') return lineCheck();
  else if (act === 'lnNext') {
    LN.i = (LN.i + 1) % LT.length; LN.g = 500; LN.lvl = 0; LN.checked = false; LN.moved = false; LN.lo = 0; LN.hi = 1000; sfx.click();
  } else if (act === 'odReset') { OD.picks = []; sfx.click(); }
  else if (act === 'launch') return odLaunch();
  else if (act === 'odNext') { OD.r = (OD.r + 1) % ORD.length; startOrder(); sfx.click(); }
  render();
});

  $('onLine').style.display = v === 'line' ? '' : 'none';

}
const say = (text, kind) => { sayEl.textContent = text || ''; sayEl.className = 'on-say' + (kind ? ' ' + kind : ''); };

function renderRace(t) {
  const sec = S.sec, open = secret.unlocked(), r = t.race;
  const sc = (k, emo) => `<button class="chip secret on-t ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('onSecChips').innerHTML = sc('thousand', '🎈') + sc('shuffle', '🔀');
  $('onShRow').hidden = sec !== 'shuffle';
  if (sec === 'shuffle') {
    $('onShLbl').textContent = t.sh.digits;
    $('onDigits').innerHTML = S.digits.map((d, i) => `<div class="on-stp"><button class="on-sb" data-act="dg" data-i="${i}" data-s="-1" aria-label="−">−</button><b>${d}</b><button class="on-sb" data-act="dg" data-i="${i}" data-s="1" aria-label="+">+</button></div>`).join('');

    lab.setReadout(`${p[1]} &gt; ${p[0]}`, '', '', '#ffc878');
    lab.setState({ emo: '🎈', title: tx[0], lead: tx[1], body: t.legend(4), extra: '' }); lab.setFacts([]);
    return;
  }
  if (sec === 'shuffle') {
    const ns = SH.bal.map((b) => b.n), hi = Math.max(...ns), lo = Math.min(...ns), ds = S.digits;
    lab.setGlow('rgba(138, 107, 224, .3)');
    $('onRaceAct').innerHTML = '';
    lab.setReadout(`${hi} &gt; ${lo}`, '', '', '#8a6be0');
    lab.setState({ emo: '🔀', title: t.sh.title(hi), lead: t.sh.lead(hi, lo, Math.max(...ds), Math.min(...ds)), body: t.sh.body, extra: '' }); lab.setFacts([]);
    return;

  lab.setGlow('rgba(229, 72, 77, .24)');
  const pair = RC.bal.map((b) => b.n), picked = RC.picked, rv = RC.rv, done = !!(rv && rv.done);
  const score = S.right.filter((x, i) => x && (i < S.i || S.end || (i === S.i && done))).length;
  const dots = [0, 1, 2, 3, 4, 5].map((i) => (i < S.i || S.end || (i === S.i && done) ? (S.right[i] ? '●' : '✕') : i === S.i ? '◉' : '○')).join(' ');
  lab.setReadout(`${score}/6`, dots, '', '#e5484d');
  lab.setFacts(t.facts.race);
  if (S.end) {
    $('onPick').innerHTML = ''; $('onPick').style.display = 'none';
    $('onRaceAct').innerHTML = `<button class="btn" data-act="next">${esc(r.again)}</button>`;
    say(r.end(score), score >= 5 ? 'good' : '');
    lab.setState({ emo: '🏆', title: r.end(score), lead: r.key, body: '', extra: '' });
    return;
  }
  buildBoard(pair, 3); boardEl.style.display = '';
  $('onPick').innerHTML = pair.map((n, k) => {
    let cls = '';
    if (done) cls = n === Math.max(...pair) ? ' good' : picked === k ? ' bad' : '';
    return `<button class="on-big${cls}" data-act="pick" data-k="${k}"${picked !== null ? ' disabled' : ''}><i style="background:${BAL[k][0]}"></i>${n}</button>`;
  }).join('');
  $('onRaceAct').innerHTML = done ? `<button class="btn" data-act="next">${esc(S.i >= 5 ? r.last : r.next)}</button>` : '';
  if (picked === null) {
    say(r.q);
    lab.setState({ emo: '🎈', title: r.q, lead: r.hint, body: t.legend(3), extra: '' });
  } else if (!done) {
    say('');
    lab.setState({ emo: '🎈', title: r.cmp, lead: r.cmpLead, body: t.legend(3), extra: '' });
  } else {
    const ok = S.right[S.i], big = Math.max(...pair), small = Math.min(...pair), lenDiff = String(big).length !== String(small).length;
    const pl = 2 - firstDiff(pair, 3);
    const why = lenDiff ? t.whyLen(t.plc[String(big).length - 1], big, small) : t.whyDiff(t.at[pl], digitOf(big, pl), digitOf(small, pl), big, small);
    const miss = !ok ? r.miss[`${small},${big}`] : null;
    say(`${ok ? r.right : r.wrong} ${r.win(big)}`, ok ? 'good' : 'warn');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? r.right : r.wrong, lead: r.key, body: miss || why, extra: '' });
  }
}

function renderLine(t) {
  const l = t.ln, n = LT[LN.i];
  lab.setGlow('rgba(255, 179, 107, .26)'); lab.setFacts(t.facts.line);
  $('onLineAct').innerHTML = LN.checked
    ? `<button class="btn" data-act="lnNext">${esc(l.next)}</button>`
    : `<button class="chip on-t" data-act="zout"${LN.lvl === 0 ? ' disabled' : ''}>${esc(l.zout)}</button><button class="chip on-t" data-act="zin"${LN.lvl === 2 ? ' disabled' : ''}>${esc(l.zin)}</button><button class="btn" data-act="check">${esc(l.check)}</button>`;
  if (!LN.checked) {
    say(l.q(n));
    lab.setReadout(String(LN.g), `${l.marker} · ${LN.i + 1}/${LT.length}`, '', '#ff7a45');
    lab.setState({ emo: '📏', title: l.q(n), lead: l.hint, body: '', extra: '' });
  } else {
    const tier = lineTier(), e = LN.err;
    say(`${l.tiers[tier]} ${e === 0 ? l.exact : l.away(e)}`, tier === 0 ? 'good' : tier === 3 ? 'warn' : '');
    lab.setReadout(String(e), l.off, '', tier === 0 ? '#2fbf71' : '#f08a24');
    lab.setState({ emo: tier === 0 ? '✅' : '🤔', title: l.tiers[tier], lead: e === 0 ? l.exact : l.away(e), body: tier === 3 ? l.retry : '', extra: '' });
  }
}

function renderOrder(t) {
  const o = t.od, k = OD.picks.length;
  lab.setGlow('rgba(59, 143, 232, .26)'); lab.setFacts(t.facts.order);
  $('onOrdAct').innerHTML = !OD.launched
    ? `<button class="btn" data-act="launch"${k === 5 ? '' : ' disabled'}>${esc(o.launch)}</button><button class="chip on-t" data-act="odReset"${k ? '' : ' disabled'}>${esc(o.reset)}</button>`
    : OD.done ? `<button class="btn" data-act="odNext">${esc(o.next)}</button>` : '';
  const sorted = OD.bal.map((b) => b.n).sort((a, b) => a - b).join(' < ');
  if (!OD.launched) {
    say(o.q);
    lab.setReadout(`${k}/5`, o.cmp, '', '#3b8fe8');
    lab.setState({ emo: '🔢', title: o.q, lead: k < 5 ? o.lead(k + 1) : o.full, body: '', extra: '' });
  } else if (!OD.done) {
    say('');
    lab.setReadout(`${k}/5`, o.cmp, '', '#3b8fe8');
    lab.setState({ emo: '🎈', title: o.cmp, lead: '', body: '', extra: '' });
  } else {
    const all = OD.hit === 5;
    say(all ? T[lang].race.right : o.some(OD.hit), all ? 'good' : 'warn');
    lab.setReadout(`${OD.hit}/5`, o.some(OD.hit), '', all ? '#2fbf71' : '#f08a24');
    lab.setState({ emo: all ? '✅' : '🤔', title: all ? `${T[lang].race.right} ${o.perfect}` : o.some(OD.hit), lead: sorted, body: all ? o.tip[OD.r] : `${o.green} ${o.tip[OD.r]}`, extra: '' });
  }
}

S.gen = genRound(); startPair(); startOrder(); buildSh(false);
render();
</script>
