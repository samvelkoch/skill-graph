// --- small helpers -----------------------------------------------------------------------------------------
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };

const R = (r) => Math.max(0, r);
const rgbOf = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const toHex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const p = rgbOf(a), q = rgbOf(b); return toHex(p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t, p[2] + (q[2] - p[2]) * t); };

const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  heart: '#FF8FB1', gold: '#FFD166', bg: '#1C2433' };

// --- world: 400 x 320 units, fitted into the canvas; the sky and the ground run past its edges --------------
const W = 400, H = 320;

  [404, 110, 36], [206, 92, 22], [232, 104, 26]];
const BR = [[340, 150], [300, 121], [250, 100], [176, 93]]; // the branch the swing hangs from
const bez = (t) => { const u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
  return [a * BR[0][0] + b * BR[1][0] + c * BR[2][0] + d * BR[3][0], a * BR[0][1] + b * BR[1][1] + c * BR[2][1] + d * BR[3][1]]; };
const branchAt = (x) => { let best = bez(0), dm = 1e9; for (let i = 0; i <= 100; i++) { const p = bez(i / 100), e = Math.abs(p[0] - x); if (e < dm) { dm = e; best = p; } } return best; };
const PV = { x: 200, y: branchAt(200)[1] }, LR = 136;

  c.beginPath(); c.moveTo(-700, 242); c.bezierCurveTo(-100, 228, 120, 240, 300, 236); c.bezierCurveTo(500, 232, 700, 240, 1100, 238);
  c.lineTo(1100, 800); c.lineTo(-700, 800); c.fill();
  for (const [fx, fy, col] of FLOWERS) { c.fillStyle = col; for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(fx + Math.cos(i * 1.256) * 2.6, fy + Math.sin(i * 1.256) * 2.6, 1.8, 0, 7); c.fill(); }
    c.fillStyle = '#fff'; c.beginPath(); c.arc(fx, fy, 1.3, 0, 7); c.fill(); }
  // sand under the swing

  // trunk (the front part is drawn again after the children), crown, branch

  for (const [x, y, r] of CROWN) {

    g.addColorStop(0, mix(PAL.tree, '#ffffff', .24)); g.addColorStop(.65, PAL.tree); g.addColorStop(1, shade(PAL.tree, .14));
    c.fillStyle = g; c.beginPath(); c.arc(x, y, R(r), 0, 7); c.fill();
    c.strokeStyle = 'rgba(25,60,35,.35)'; c.lineWidth = 1; c.stroke();
  }
  c.fillStyle = 'rgba(255,255,255,.14)';
  for (const [x, y, r] of CROWN) { c.beginPath(); c.arc(x - r * .3, y - r * .35, R(r * .42), 0, 7); c.fill(); }
  c.lineCap = 'round'; c.beginPath(); c.moveTo(...BR[0]); c.bezierCurveTo(BR[1][0], BR[1][1], BR[2][0], BR[2][1], BR[3][0], BR[3][1]);
  c.strokeStyle = shade(PAL.wood, .3); c.lineWidth = 15; c.stroke();
  c.strokeStyle = PAL.wood; c.lineWidth = 12; c.stroke();
  c.strokeStyle = mix(PAL.wood, '#ffffff', .22); c.lineWidth = 3; c.beginPath(); c.moveTo(BR[0][0], BR[0][1] - 3);
  c.bezierCurveTo(BR[1][0], BR[1][1] - 3, BR[2][0], BR[2][1] - 3, BR[3][0], BR[3][1] - 3); c.stroke();
  c.fillStyle = PAL.tree; c.beginPath(); c.arc(184, 90, 9, 0, 7); c.fill(); c.beginPath(); c.arc(176, 99, 7, 0, 7); c.fill();
}
function trunk(c, top) {
  const { x0, x1 } = TRUNK;
  const g = c.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, mix(PAL.wood, '#ffffff', .12)); g.addColorStop(.5, PAL.wood); g.addColorStop(1, shade(PAL.wood, .3));

// --- swing ------------------------------------------------------------------------------------------------
const swingPos = () => { const th = S.sw.th; return [PV.x + LR * Math.sin(th), PV.y + LR * Math.cos(th)]; };
function drawRopes(c) {
  const th = S.sw.th, [sx, sy] = swingPos(), cs = Math.cos(th), sn = Math.sin(th), rope = mix(PAL.wood, PAL.sand, .55);
  c.lineCap = 'round';
  c.fillStyle = 'rgba(60,45,20,.18)'; c.beginPath(); c.ellipse(sx, 267, 26, 5, 0, 0, 7); c.fill();
  [-1, 1].forEach((s, i) => {
    const [ax, ay] = ANCH[i], bx = sx + s * 19 * cs + 2 * sn, by = sy + s * 19 * sn - 2 * cs;
    c.strokeStyle = shade(rope, .45); c.lineWidth = 3.6; c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
    c.strokeStyle = rope; c.lineWidth = 2.2; c.stroke();
    c.fillStyle = shade(rope, .4); c.beginPath(); c.arc(ax, ay, 2.8, 0, 7); c.fill();
  });
}
function drawSeat(c) {
  const [sx, sy] = swingPos();
  c.save(); c.translate(sx, sy); c.rotate(S.sw.th);
  const g = c.createLinearGradient(0, -4, 0, 4);
  g.addColorStop(0, mix(PAL.wood, '#ffffff', .28)); g.addColorStop(1, shade(PAL.wood, .18));

  c.fillStyle = shade(PAL.wood, .45); for (const s of [-19, 19]) { c.beginPath(); c.arc(s, -1, 1.5, 0, 7); c.fill(); }

// --- the children ---------------------------------------------------------------------------------------------
// drawn in local units (feet, or the seat top, at 0,0; up is negative), scaled by k.sc; k.O and k.rot place them in the world
function drawKid(c, k, sitting, time) {
  const st = STY[k.id], m = k.mood, sad = clamp01(-m), joy = clamp01(m), uns = 1 - Math.min(1, Math.abs(m));
  const skin = st.skin, skinD = shade(skin, .14), hair = st.hair, ink = '#3A2430';
  const crouch = sitting ? 0 : k.crouch;
  const hip = sitting ? -3 : -(24 - 17 * crouch), tTop = hip - 31, hy = tTop - 14;
  const cs = Math.cos(k.rot), sn = Math.sin(k.rot);
  const Wd = (x, y) => [k.O[0] + k.sc * (x * cs - y * sn), k.O[1] + k.sc * (x * sn + y * cs)];
  c.lineJoin = 'round'; c.lineCap = 'round';

  // hair behind the head
  if (st.style === 'pony') {
    c.save(); c.translate(17, hy - 6); c.rotate(.5 + Math.sin(time * 2.2 + k.seed) * .1 - k.lean * 1.2 - k.walkAmp * .12);
    const pg = c.createLinearGradient(-6, 0, 6, 0); pg.addColorStop(0, mix(hair, '#ffffff', .15)); pg.addColorStop(1, shade(hair, .2));
    c.fillStyle = pg; c.strokeStyle = shade(hair, .45); c.lineWidth = 1.1;
    c.beginPath(); c.ellipse(0, 11, 7, 14, 0, 0, 7); c.fill(); c.stroke(); c.restore();
  }
  c.fillStyle = hair; c.beginPath(); c.arc(0, hy - 1, st.style === 'curly' ? 19.6 : 18.8, 0, 7); c.fill();

  // legs: trousers and shoes (they hang from the seat, splay on the ground, or walk)
  for (const s of [-1, 1]) {
    const sw = Math.sin(k.walkPh + (s > 0 ? 0 : Math.PI)) * k.walkAmp;
    let fx, fy;
    if (sitting) { fx = s * 7 + Math.sin(time * 3 + (s > 0 ? 0 : 1.4)) * 2; fy = 17 + 2 * Math.sin(time * 2.6 + s); }
    else { fx = s * (6 + crouch * 17) + sw * 6 * (1 - crouch); fy = -2 - Math.max(0, sw) * 3 * (1 - crouch); }
    c.strokeStyle = shade(PANTS, .35); c.lineWidth = 11.8; c.beginPath(); c.moveTo(s * 6, hip); c.lineTo(fx, fy - 2); c.stroke();
    c.strokeStyle = PANTS; c.lineWidth = 10; c.stroke();
    c.fillStyle = SHOE; c.strokeStyle = shade(SHOE, .45); c.lineWidth = 1.1;
    c.beginPath(); c.ellipse(fx + s * 1.5, fy + 1, 7.6, 3.9, 0, 0, 7); c.fill(); c.stroke();
  }

  // T-shirt
  const tg = c.createLinearGradient(-13, 0, 13, 0);
  tg.addColorStop(0, mix(st.shirt, '#ffffff', .2)); tg.addColorStop(.55, st.shirt); tg.addColorStop(1, shade(st.shirt, .16));
  c.fillStyle = tg; c.strokeStyle = shade(st.shirt, .4); c.lineWidth = 1.2;
  c.beginPath(); c.roundRect(-12.5, tTop, 25, hip + 4 - tTop, 8); c.fill(); c.stroke();
  c.fillStyle = skin; c.beginPath(); c.arc(0, tTop + .5, 5.2, 0, Math.PI); c.fill();

  // head: ears, face, hair in front
  c.fillStyle = skin; c.strokeStyle = shade(skin, .3); c.lineWidth = 1;
  for (const s of [-1, 1]) { c.beginPath(); c.arc(s * 17.4, hy + 2, 3.6, 0, 7); c.fill(); c.stroke(); }
  const hg = c.createRadialGradient(-6, hy - 7, 2, 0, hy, 21);
  hg.addColorStop(0, mix(skin, '#ffffff', .38)); hg.addColorStop(.55, skin); hg.addColorStop(1, skinD);
  c.fillStyle = hg; c.strokeStyle = shade(skin, .3); c.lineWidth = 1.2;
  c.beginPath(); c.arc(0, hy, 17.6, 0, 7); c.fill(); c.stroke();
  const hairG = c.createLinearGradient(-16, hy - 18, 16, hy - 4);
  hairG.addColorStop(0, mix(hair, '#ffffff', .22)); hairG.addColorStop(1, hair);
  c.fillStyle = hairG; c.strokeStyle = shade(hair, .4); c.lineWidth = 1;
  if (st.style === 'curly') {
    for (let i = 0; i < 8; i++) { const a = Math.PI * (1.08 + i * .12); c.beginPath(); c.arc(Math.cos(a) * 15.6, hy + Math.sin(a) * 15.6 - 1, 6.6, 0, 7); c.fill(); }
  }
  c.beginPath(); c.moveTo(-18.2, hy + 1); c.arc(0, hy, 18.2, Math.PI - .07, 2 * Math.PI + .07);
  c.bezierCurveTo(14, hy - 6, 6, hy - 11, -3, hy - 10); c.bezierCurveTo(-10, hy - 9.5, -16, hy - 4, -18.2, hy + 1); c.closePath(); c.fill();
  if (st.style === 'pony') { c.fillStyle = PAL.gold; c.beginPath(); c.arc(14.5, hy - 11, 3, 0, 7); c.fill(); c.strokeStyle = shade(PAL.gold, .4); c.stroke(); }

  // face: brows, eyes with a white highlight, cheeks, mouth, a small tear when sad
  const by = hy - 7.5 - 2.2 * uns - 2.2 * k.o;
  c.strokeStyle = shade(hair, .2); c.lineWidth = 1.9;
  for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * 3.6, by - 3.2 * sad); c.lineTo(s * 10, by + .8 * sad + .6 * joy); c.stroke(); }
  const bl = ((time + k.seed * 1.7) % 3.7) < .12 ? .15 : 1, lk = k.look * 1.3;
  for (const s of [-1, 1]) {
    c.fillStyle = '#2B2230'; c.beginPath(); c.ellipse(s * 6.4 + lk, hy + 1.5, 2.7, R(3.3 * bl), 0, 0, 7); c.fill();
    if (bl > .5) { c.fillStyle = '#fff'; c.beginPath(); c.arc(s * 6.4 + lk - .9, hy + .3, 1.15, 0, 7); c.fill(); }
  }
  c.fillStyle = `rgba(255,143,177,${.3 + .25 * joy})`;
  for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * 10.8, hy + 7.2, 3.7, 2.4, 0, 0, 7); c.fill(); }
  c.fillStyle = skinD; c.beginPath(); c.ellipse(0, hy + 5.6, 1.3, 1, 0, 0, 7); c.fill();
  const my = hy + 10.6;
  if (k.o > .08) {
    const rx = 3 + 2.2 * k.o, ry = R(1 + 4.5 * k.o);
    c.fillStyle = '#7A2E3A'; c.beginPath(); c.ellipse(0, my + 1, rx, ry, 0, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,143,177,.85)'; c.beginPath(); c.ellipse(0, my + 1 + ry * .45, rx * .6, R(ry * .4), 0, 0, 7); c.fill();
  } else {
    c.strokeStyle = '#7A2E3A'; c.lineWidth = 1.8;
    c.beginPath(); c.moveTo(-5, my); c.quadraticCurveTo(0, my + 7.5 * m, 5, my); c.stroke();
    const fa = clamp01((m - .45) / .35);
    if (fa > 0) { // a big smile opens a little
      c.fillStyle = `rgba(122,46,58,${fa})`; c.beginPath(); c.moveTo(-5.4, my - .4); c.quadraticCurveTo(0, my + 8.5 * m, 5.4, my - .4); c.closePath(); c.fill();
    }
  }
  if (sad > .45) {
    const a = clamp01((sad - .45) / .25), dy = ((time * .8) % 1) * 3;
    c.save(); c.globalAlpha = a; c.fillStyle = PAL.skyT; c.strokeStyle = '#6FA8D0'; c.lineWidth = .7;
    c.beginPath(); c.arc(-7.6, hy + 6.5 + dy, 1.9, 0, 7); c.fill(); c.stroke(); c.restore();
  }

  // arms last, so a raised hand can cover the eyes or the mouth
  const hands = {};
  for (const [name, s, ang] of [['L', -1, sitting ? -.32 : k.aL], ['R', 1, sitting ? .32 : k.aR]]) {
    const sx = s * 11, sy = tTop + 7, ex = sx + Math.sin(ang) * 22, ey = sy + Math.cos(ang) * 22;
    c.strokeStyle = shade(skin, .3); c.lineWidth = 9; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke();
    c.strokeStyle = skin; c.lineWidth = 7.4; c.stroke();
    c.strokeStyle = shade(st.shirt, .4); c.lineWidth = 11.4; c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx + Math.sin(ang) * 8, sy + Math.cos(ang) * 8); c.stroke();
    c.strokeStyle = st.shirt; c.lineWidth = 9.6; c.stroke();
    c.fillStyle = skin; c.strokeStyle = shade(skin, .3); c.lineWidth = 1; c.beginPath(); c.arc(ex, ey, 4.5, 0, 7); c.fill(); c.stroke();
    hands[name] = Wd(ex, ey);
  }
  k.hands = hands; k.head = Wd(0, hy - 22); k.mouth = Wd(0, my);
}

function placeKid(k, H0) {
  if (!k.vis) return;
  if (k.sit) { const [sx, sy] = swingPos(), th = S.sw.th; k.O = [sx + 4 * Math.sin(th), sy - 4 * Math.cos(th)]; k.rot = th + k.lean * .4; }
  else { k.O = [(H0[k.id] ?? 0) + k.x, H0.gy - k.y]; k.rot = k.lean; }
}
function renderKid(c, k, H0, time) {
  if (!k.vis) return;
  c.save();
  if (!k.sit) {
    const f = 1 - Math.min(.5, k.y / 90);
    c.fillStyle = 'rgba(30,45,20,.28)'; c.beginPath(); c.ellipse(k.O[0], H0.gy + 2, R(19 * k.sc * f), R(4.6 * k.sc * f), 0, 0, 7); c.fill();
  }
  c.translate(k.O[0], k.O[1]); c.rotate(k.rot); c.scale(k.sc, k.sc);
  drawKid(c, k, !!k.sit, time);
  c.restore();
}

// --- hearts, ribbon, bubbles, sparks --------------------------------------------------------------------------
function heartPath(c, x, y, s) {
  c.beginPath(); c.moveTo(x, y + s * .9);
  c.bezierCurveTo(x - s * 1.5, y - s * .1, x - s * .9, y - s * 1.1, x, y - s * .35);
  c.bezierCurveTo(x + s * .9, y - s * 1.1, x + s * 1.5, y - s * .1, x, y + s * .9); c.closePath();
}
function drawHeart(c, x, y, s, fill) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = 'rgba(255,255,255,.62)'; heartPath(c, 0, 0, 10); c.fill();
  c.save(); heartPath(c, 0, 0, 10); c.clip();
  const top = 9 - 19 * clamp01(fill), g = c.createLinearGradient(0, top, 0, 10);
  g.addColorStop(0, mix(PAL.heart, '#ffffff', .3)); g.addColorStop(1, PAL.heart);
  c.fillStyle = g; c.fillRect(-20, top, 40, 30); c.restore();
  c.strokeStyle = shade(PAL.heart, .28); c.lineWidth = 1.6; heartPath(c, 0, 0, 10); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-6, -5.4, 2.4, 1.4, -.6, 0, 7); c.fill();
  c.restore();

  if (st.phase === 'p2') return `<b>${esc(D.try)}</b> ${esc(D.o[i][best])}`;
  return st.right ? `<b>${esc(t.right)}</b> ${esc(D.why[i])}` : `<b>${esc(cap(t.bothOk))}</b> ${esc(D.why[i])}`;
}
function render() {
  const t = T[lang], v = lab.view, st = V[v], n = NR[v], inFree = v === 'swing' && st.free, D = t[VIEWKEY[v]];
  document.body.dataset.sec = S.sec || '';
  lab.setGlow('rgba(255, 143, 177, .22)');
  $('fpQ').style.display = inFree ? 'none' : '';
  $('fpFree').style.display = inFree && !S.sec ? '' : 'none';
  $('fpSec').style.display = S.sec ? '' : 'none';
  $('fpChips').style.display = inFree ? '' : 'none';
  if (!inFree) {
    const best = BEST[v][st.i], asking = st.phase === 'ask', showBest = st.phase === 'p2' || st.phase === 'done';
    $('fpQt').textContent = D.q[st.i];
    $('fpOpts').innerHTML = D.o[st.i].map((o, j) => `<button class="fp-o ${asking ? '' : showBest && j === best ? 'best' : j === st.pick ? 'pick' : 'dim'}" data-act="pick" data-j="${j}"${asking ? '' : ' disabled'}><i>${j + 1}</i><span>${esc(o)}</span></button>`).join('');
    $('fpSay').innerHTML = sayHtml(t, D, st, best);
    $('fpNextRow').style.display = st.phase === 'done' ? '' : 'none';
    $('fpNext').textContent = st.i + 1 < n || v === 'swing' ? t.next : t.again;
    $('fpAgain').textContent = '';
  } else {
    $('fpFreeT').textContent = t.s.free;
    $('fpPush').textContent = `👋 ${t.s.push}`; $('fpPush').disabled = st.fr.swap || st.fr.n >= 10 || !!S.cur;
    $('fpAgain').textContent = t.again;
    const open = secret.unlocked();
    $('fpChips').innerHTML = [['cut', '✂️'], ['rps', '✊']].map(([k, emo]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  }
  let val, sub = '', pill = '', card;
  if (S.sec === 'cut') {
    const r = S.cut.res, p1 = r ? (r.eq ? 50 : Math.round(r.fs * 100)) : 0;
    val = r ? `${p1} : ${100 - p1}` : '–'; sub = r ? `${t.a} : ${t.b}` : '';
    $('fpSecT').textContent = r ? (r.eq ? t.sec.cutEven : t.sec.cutUneven(t.a, t.b)) : t.sec.cutHint; $('fpRps').innerHTML = '';
    card = ['✂️', t.secrets.cut[0], t.sec.cutText, t.secrets.cut[1]];
  } else if (S.sec === 'rps') {
    const q = S.rps, busy = !q.counted;
    val = `${q.tally[0]} : ${q.tally[1]}`; sub = `${t.a} : ${t.b}`;
    pill = q.counted && q.res ? (q.res === 'draw' ? t.sec.draw : t.sec.win(q.res === 'a' ? t.a : t.b)) : '';
    $('fpSecT').textContent = ''; $('fpRps').innerHTML = [[0, t.sec.rock], [1, t.sec.paper], [2, t.sec.scissors]].map(([k, l]) => `<button data-act="rps" data-p="${k}"${busy ? ' disabled' : ''}><span>${EMO[k]}</span>${esc(l)}</button>`).join('');
    card = ['✊', t.secrets.rps[0], t.sec.rpsText, t.secrets.rps[1]];
  } else {
    if (inFree) { val = esc(t.s.turn(st.fr.rider === 0 ? t.a : t.b)); sub = `${st.fr.n} / 10`; }
    else { val = `${st.i + 1} / ${n}`; pill = st.phase === 'done' ? t.bothOk : ''; }
    card = CARD[lang][v][st.fin ? 1 : 0];
  }
  lab.setReadout(val, sub, pill, PAL.heart);
  lab.setState({ emo: card[0], title: card[1], lead: card[2], body: card[3] });
}
render();
</script>
