// --- the apple tree: branches, clumps of foliage, flowers, apples, buds (made once, in unit coordinates) ---
const TREE = (() => {
  const R = rng(8), br = [], tips = [], ends = [];
  const addBranch = (x0, y0, cx, cy, x1, y1, w0, w1, d, flare = 0) => {
    const Lf = [], Rt = [], mid = [], wds = [], N = 7;
    for (let i = 0; i <= N; i++) {
      const t = i / N, u = 1 - t;
      const px = u * u * x0 + 2 * u * t * cx + t * t * x1, py = u * u * y0 + 2 * u * t * cy + t * t * y1;
      let dx = 2 * u * (cx - x0) + 2 * t * (x1 - cx), dy = 2 * u * (cy - y0) + 2 * t * (y1 - cy);
      const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;

    br.push(b); return b;
  };
  const grow = (x, y, ang, len, w, d) => {
    const bend = (R() - .5) * .5;
    const x1 = x + Math.sin(ang) * len * .86, y1 = y - Math.cos(ang) * len;
    const cx = x + Math.sin(ang + bend) * len * .5, cy = y - Math.cos(ang + bend) * len * .5;
    addBranch(x, y, cx, cy, x1, y1, w, w * .72, d);
    ends.push({ x: x1, y: y1, d });
    if (d >= 4) { tips.push({ x: x1, y: y1 }); return; }

    grow(x1, y1, ang + sp, len * .78, w * .66, d + 1);
    grow(x1, y1, ang - sp * (.85 + R() * .3), len * .78, w * .66, d + 1);
    if (d < 3 && R() < .5) grow(x1, y1, ang + (R() - .5) * .25, len * .72, w * .62, d + 1);

  [-.75, -.38, .02, .4, .78].forEach((a) => grow(.008, -.30, a + (R() - .5) * .14, .31 + R() * .05, .047, 1));
  const bark = [-.7, -.3, .15, .6].map((f) => trunk.mid.slice(0, 6).map((p, i) => [p[0] + f * trunk.wds[i] + (R() - .5) * .004, p[1]]));
  const clumps = [];
  for (const t of tips) clumps.push({ x: t.x + (R() - .5) * .04, y: t.y + (R() - .5) * .04, r: .1 + R() * .045 });
  for (const e of ends) if ((e.d === 3 || e.d === 2) && R() < .65) clumps.push({ x: e.x, y: e.y + .02, r: .1 + R() * .05 });
  clumps.forEach((q) => { q.th = R(); q.th2 = R(); q.tone = Math.floor(R() * 3); q.tone2 = Math.floor(R() * 4); });
  clumps.sort((a, b) => a.y - b.y);
  let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
  for (const q of clumps) { x0 = Math.min(x0, q.x - q.r); x1 = Math.max(x1, q.x + q.r); y0 = Math.min(y0, q.y - q.r); y1 = Math.max(y1, q.y + q.r); }
  const crown = { x: (x0 + x1) / 2, y: (y0 + y1) / 2 + .03, rx: (x1 - x0) / 2 * .78, ry: (y1 - y0) / 2 * .7 };

    for (let j = 0; j < 2; j++) flowers.push({ x: q.x + (R() - .5) * q.r * 1.6, y: q.y + (R() - .5) * q.r * 1.6, rot: R() * TAU, th: R(), sz: .8 + R() * .4 });
  }
  for (const t of tips) buds.push({ x: t.x + (R() - .5) * .03, y: t.y + (R() - .5) * .03 });
  for (const e of ends) if (e.d === 3) buds.push({ x: e.x + (R() - .5) * .03, y: e.y + (R() - .5) * .03 });

// --- the garden ---------------------------------------------------------------------------------------------
const layoutOf = (w, h) => ({ hy: h * .6, sz: Math.min(h * .44, w * .48), tx: w * .52, ty: h * .82 }); // the full summer crown stays inside the frame

  const cx = cardCtx(); if (!cx) return;
  const k = cx.cards.slice().reverse().find((q) => q.vis > .5 && q.placed === null && Math.abs(x - q.x) <= cx.cw / 2 * q.sc && Math.abs(y - q.y) <= cx.ch / 2 * q.sc);
  if (k) { S.drag = { kind: 'card', k, dx: k.x - x, dy: k.y - y, moved: 0, sx: x, sy: y }; k.drag = true; k.tsc = 1.1; cv.setPointerCapture(ev.pointerId); sfx.tick(); }
  else if (S.sel !== null) { const t = cx.target(x, y), kk = cx.cards.find((q) => q.i === S.sel); if (t !== null && kk) { S.sel = null; cx.drop(kk, t); } }
});
cv.addEventListener('pointermove', (ev) => {
  const D = S.drag; if (!D) return;
  const [x, y] = pt(ev);
  if (D.kind === 'dial') { const { w, h } = loop.size(); setDial(x, y, dialGeo(w, h)); }
  else { D.k.tx = x + D.dx; D.k.ty = y + D.dy; D.moved = Math.max(D.moved, Math.hypot(x - D.sx, y - D.sy)); }
});
const pointerEnd = () => {
  const D = S.drag; S.drag = null; if (!D || D.kind === 'dial') return;
  const k = D.k; k.drag = false; k.tsc = 1;
  const cx = cardCtx(); if (!cx) return;
  if (D.moved > 8) { const t = cx.target(k.x, k.y); if (t !== null) { S.sel = null; cx.drop(k, t); } }
  else { S.sel = S.sel === k.i ? null : k.i; sfx.click(); }
};
cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', pointerEnd);

function cDrop(k, slot) {
  if (slot === k.i) {
    k.placed = slot; S.cMsg = ''; sfx.snap();
    if (S.cards.every((q) => q.placed !== null)) { S.cStep = 'done'; sfx.good(); }
  } else { k.miss++; S.flash = { slot, t: .6 }; S.cMsg = 'retry'; sfx.bad(); }
  render();
}
function aPlace(k, b, shown) {
  k.n = S.aCards.filter((q) => q.placed === b).length; k.placed = b; S.aMsg = { key: k.key, state: shown }; sfx.snap();
  if (S.aCards.every((q) => q.placed !== null)) { S.aStep = 'done'; sfx.good(); }
}
function aDrop(k, b) {
  if (b === RIGHT[k.key]) aPlace(k, b, 'ok');
  else { k.miss++; sfx.bad(); if (k.miss >= 2) aPlace(k, RIGHT[k.key], 'shown'); else S.aMsg = { key: k.key, state: 'retry' }; }
  render();
}
function aEnter() { // the cards fly up from below the stage
  const { w, h } = loop.size(), G = aGeo(w, h);
  S.aCards.forEach((k) => { const [x] = aHome(G, w, k.i); k.placed = null; k.miss = 0; k.n = 0; k.x = x; k.y = h + 70; k.vx = k.vy = 0; k.vis = 0; k.init = true; k.sc = 1; });
  S.aStep = 'sort'; S.aMsg = null; S.sel = null;
}

// on a phone the controls sit below the stage: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'a1' && S.tStep === 'q1') {
    S.t1 = i; S.tStep = 'r1'; (i === 2 ? sfx.good : sfx.bad)(); showStage();
    playAnim([{ a: S.m, b: 20.7, d: 8 }], () => render()); // March, round the whole year, to September
  } else if (act === 'next') { S.tStep = 'q2'; sfx.click(); }
  else if (act === 'a2' && S.tStep === 'q2') {
    S.t2 = i; S.tStep = 'r2'; S.showDay = true; (i === 0 ? sfx.good : sfx.bad)(); showStage();
    playAnim([{ a: S.m, b: 11.5, d: 1.2 }, { a: 11.5, b: 17.5, d: 3.6 }, { a: 17.5, b: 17.5, d: .5 }, { a: 17.5, b: 23.5, d: 3.6 }], () => { S.tStep = 'free'; render(); });
  } else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click();
    if (k === 'south') { S.beta = SOUTH; S.betaT = SOUTH; S.autoSouth = 1.2; } else S.bt = 0;
  } else if (act === 'south') { S.betaT = b.dataset.v === 'jun' ? SOUTH : -SOUTH; S.autoSouth = 0; sfx.click(); }
  else if (act === 'bagain') { S.bt = 0; sfx.click(); }
  else if (act === 'cq' && S.cStep === 'q') { S.cPick = i; S.cStep = 'r'; (i === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'cnext' || act === 'cagain') {
    S.cards.forEach((k) => { k.placed = null; k.miss = 0; }); S.cStep = 'place'; S.sel = null; S.cMsg = '';
    if (act === 'cagain') { S.spin = 0; S.spinV = 0; } sfx.click();
  } else if (act === 'aq' && S.aStep === 'q') { S.aPick = i; S.aStep = 'r'; S.curl = 0; S.curlDone = false; S.ecg.tau = 0; (i === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'anext' || act === 'aagain') { aEnter(); sfx.click(); }
  render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------------
function updateReadout() { // also called every frame, because the month changes while the dial turns
  const tx = TX(), v = lab.view; let val = '?', sub = '', pill = '', col;
  if (v === 'tree') {
    if (S.sec) { val = S.sec === 'south' ? tx.months[S.beta > 0 ? 5 : 11] : '🐝'; col = '#FFD84A'; }
    else {
      const mi = Math.floor(((S.m % 12) + 12) % 12), r = Math.round(dayHours(S.m) * 2) / 2, hh = `${Math.floor(r)}${r % 1 ? '½' : ''}`;
      val = tx.months[mi]; pill = tx.seasons[seasonOf(S.m)]; col = SEASON_COL[seasonOf(S.m)];
      if (S.showDay) sub = tx.t.day(hh);
    }
  } else if (v === 'circle') { col = '#FFD84A'; if (S.cStep === 'place' || S.cStep === 'done') val = `${S.cards.filter((k) => k.placed !== null).length}/4`; }
  else { col = '#ff8a3d'; if (S.aStep === 'sort' || S.aStep === 'done') val = `${S.aCards.filter((k) => k.placed !== null).length}/6`; }
  const key = [v, val, sub, pill, col].join('|');
  if (key === S.ro) return;
  S.ro = key; lab.setReadout(esc(val), sub, pill, col);
}
const optsHtml = (arr, act) => `<div class="yt-opts">${arr.map((o, i) => `<button class="yt-opt" data-act="${act}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
const verdictHtml = (ok, tx) => `<p class="yt-v ${ok ? 'yt-ok' : 'yt-no'}">${esc(ok ? tx.right : tx.wrong)}</p>`;
const btnHtml = (act, label) => `<div class="yt-tools"><button class="btn" data-act="${act}">${esc(label)}</button></div>`;

function renderTree(tx) {
  const t = tx.t, st = S.tStep, open = secret.unlocked();
  let h = '';
  if (st === 'q1') h = `<div class="yt-qt">${esc(t.q1)}</div>${optsHtml(t.o1, 'a1')}`;
  else if (st === 'r1') h = `<div class="yt-qt">${esc(t.q1)}</div>${verdictHtml(S.t1 === 2, tx)}<p class="yt-p">${esc(t.r1)}</p>${S.anim ? '' : btnHtml('next', tx.next)}`;
  else if (st === 'q2') h = `<div class="yt-qt">${esc(t.q2)}</div>${optsHtml(t.o2, 'a2')}`;
  else {
    h = `<div class="yt-qt">${esc(t.q2)}</div>${verdictHtml(S.t2 === 0, tx)}<p class="yt-p">${esc(t.r2)}</p>`;
    if (st === 'free') {
      const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(tx.secrets[k][0])}` : '🔒 ???'}</button>`;
      if (S.sec === 'south') h += `<p class="yt-p">${esc(tx.sec.southText)}</p><div class="yt-tools"><div class="card seg small">${[['jun', 5], ['dec', 11]].map(([v, mi]) => `<button data-act="south" data-v="${v}" class="${(S.betaT > 0) === (v === 'jun') ? 'on' : ''}">${esc(tx.months[mi])}</button>`).join('')}</div></div>`;
      else if (S.sec === 'blossom') h += `<p class="yt-p">${esc(tx.sec.beeText)}</p>${btnHtml('bagain', tx.again)}`;
      else h += `<p class="yt-p"><b>${esc(t.drag)}</b></p>`;
      h += `<div class="chips yt-chips">${sc('south', '🌏')}${sc('blossom', '🐝')}</div>`;
    }
  }
  let s = tx.st.tree[st === 'r2' || st === 'free' ? 1 : 0];
  let extra = st === 'r2' || st === 'free' ? `<div class="fine">${esc(tx.fine)}</div>` : '';
  if (st === 'free' && S.sec) { s = [S.sec === 'south' ? '🌏' : '🐝', tx.secrets[S.sec][0], tx.secrets[S.sec][1], '']; extra = ''; }
  lab.setGlow('rgba(127, 201, 127, .26)');
  lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra });
  return h;
}
function renderCircle(tx) {
  const c = tx.c, st = S.cStep; let h;
  if (st === 'q') h = `<div class="yt-qt">${esc(c.q)}</div>${optsHtml(c.o, 'cq')}`;
  else if (st === 'r') h = `<div class="yt-qt">${esc(c.q)}</div>${verdictHtml(S.cPick === 0, tx)}${btnHtml('cnext', tx.next)}`;
  else if (st === 'place') h = `<p class="yt-p"><b>${esc(c.help)}</b></p>${S.cMsg ? `<p class="yt-v yt-no">${esc(tx.retry)}</p>` : ''}`;
  else h = `<p class="yt-v yt-ok">${esc(c.done)}</p>${btnHtml('cagain', tx.again)}`;
  const s = tx.st.circle[st === 'done' ? 1 : 0];
  lab.setGlow('rgba(255, 216, 74, .22)');
  lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' });
  return h;
}
function renderAnimals(tx) {
  const a = tx.a, st = S.aStep, m = S.aMsg; let h;
  if (st === 'q') h = `<div class="yt-qt">${esc(a.q)}</div>${optsHtml(a.o, 'aq')}`;
  else if (st === 'r') h = `<div class="yt-qt">${esc(a.q)}</div>${verdictHtml(S.aPick === 0, tx)}<p class="yt-p">${esc(a.r)}</p>${S.curl >= 1 ? btnHtml('anext', tx.next) : ''}`;
  else {
    h = `<p class="yt-p"><b>${esc(a.help)}</b></p>`;
    if (m && m.state === 'retry') h += `<p class="yt-v yt-no">${esc(tx.retry)}</p>`;
    else if (m) h += `<p class="yt-p"><b>${esc(a.names[m.key])}.</b> ${esc(a.why[m.key])}</p>`;
    if (st === 'done') h += btnHtml('aagain', tx.again);
  }
  const s = tx.st.animals[st === 'done' ? 1 : 0];
  lab.setGlow('rgba(255, 138, 61, .22)');
  lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' });
  return h;
}
function render() {
  const tx = TX(), v = lab.view;
  document.body.dataset.v = v;
  $('pill').style.color = '#15182a';
  $('ytp').innerHTML = v === 'tree' ? renderTree(tx) : v === 'circle' ? renderCircle(tx) : renderAnimals(tx);
  updateReadout();
}
render();
</script>
</body>
