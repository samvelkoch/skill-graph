  return `<svg viewBox="0 0 62 36" aria-hidden="true">${ax}<line x1="6" y1="8" x2="58" y2="8" stroke="#5b6480" stroke-dasharray="2 3"/>${ln(['7,28 20,13 32,8 56,7', '7,20 56,20', '7,10 56,30'][i], Gr)}</svg>`;
};
function sketches(kind) {
  const t = T[lang], guess = kind === 1 ? P.arms : P.stop, rev = kind === 1 ? REV.arms : REV.stop;
  return [0, 1, 2].map((i) => `<button type="button" data-act="pick" data-k="${kind}" data-i="${i}" class="${guess === i ? 'on' : ''}${rev && i === 0 ? ' good' : ''}${rev && guess === i && i !== 0 ? ' bad' : ''}">${SK(kind, i)}<span>${esc((kind === 1 ? t.sk1 : t.sk2)[i])}</span></button>`).join('');
}
function checkReveal() {
  if (!REV.arms && P.arms !== null && S1.gen >= 30 && !mode1) { REV.arms = true; (P.arms === 0 ? sfx.good : sfx.bad)(); }
  if (!REV.stop && P.stop !== null && S2.freeze === 'newts' && (S2.gen >= 40 || S2.dead.newts !== null)) { REV.stop = true; (P.stop === 0 ? sfx.good : sfx.bad)(); }
}
const canRun = (v) => (v === 'arms' ? P.arms !== null || !!mode1 : v === 'stop' ? P.stop !== null : true);
function startRun(S, plus) {
  if (isDead(S) || S.gen >= MAXG) return;
  S.run.on = true; S.run.speed = plus ? 26 : 5; S.run.target = plus ? Math.min(MAXG, S.gen + 100) : Infinity; S.run.acc = 0;
}
function resetSim(v) {
  if (v === 'arms') S1 = mk1();
  else if (v === 'stop') S2 = newSim({ freeze: S2.freeze, p: { mut: 1, cost: 0.2 } });
  else { S3 = newSim({ p: { mut: 1, cost: 0.2 } }); S3.run.on = true; }
}
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function setView(v) { lab.view = v; lab.renderChrome(); render(); }

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view, S = cur();
  if (act === 'pick') {
    const k = +b.dataset.k, i = +b.dataset.i;
    if (k === 1) { if (REV.arms) return; P.arms = i; } else { if (REV.stop) return; P.stop = i; }
    sfx.click();
  } else if (act === 'run') {
    if (!canRun(v)) return;
    if (S.run.on) S.run.on = false; else startRun(S, false);
    sfx.click();
  } else if (act === 'plus') {
    if (!canRun(v)) return;
    startRun(S, true); sfx.click();
  } else if (act === 'reset') { resetSim(v); sfx.click(); }
  else if (act === 'freeze') {
    const k = b.dataset.k; S2.freeze = S2.freeze === k ? null : k; S2 = newSim({ freeze: S2.freeze, p: S2.p }); sfx.click();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (v !== 'arms') { lab.view = 'arms'; lab.renderChrome(); }
    if (mode1 === k) { mode1 = null; par1.cost = 0.2; par1.mut = 1; S1 = mk1(); }
    else {
      mode1 = k; par1.mut = 1; par1.cost = k === 'cost' ? 1 : 0.6; S1 = mk1(); startRun(S1, true); S1.run.target = 150; S1.run.speed = 20;
    }
    sfx.click(); showStage();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'rVar') par1.mut = +ev.target.value;
  else if (ev.target.id === 'rCost') par1.cost = +ev.target.value;
  else return;
  if (S1.cmp) S1.cmp.p.mut = par1.mut;
  updateSliders();
});
$('cards').addEventListener('click', (ev) => {
  const el = ev.target.closest('.rq-card'); if (!el) return;
  el.querySelectorAll('i,small').forEach((n) => { n.style.animation = 'none'; void n.offsetWidth; n.style.animation = ''; });
  sfx.tick();
});

function pairCard(p) {
  const L = (a, b, cls, delay) => `<div class="rq-lane ${cls}"><i style="animation-delay:${delay}s">${a}</i><small>${b}</small></div>`;
  let lanes;
  if (p.n === 'speed') lanes = `<div class="rq-lane a" style="--d:2.6s"><i>${p.e[0]}</i></div><div class="rq-lane b" style="--d:2.6s"><i>${p.e[1]}</i></div>`;
  else if (p.n === 'sonar') lanes = `<div class="rq-lane"><i style="left:8px">${p.e[0]}</i><i class="rq-ping" style="left:44px;font-size:18px">)))</i><i style="left:150px">${p.e[1]}</i></div>
    <div class="rq-lane"><i style="left:150px">${p.e[1]}</i><i class="rq-ping" style="left:96px;font-size:16px;animation-delay:.8s">((( tk</i><i style="left:8px">${p.e[0]}</i></div>`;
  else lanes = `<div class="rq-lane"><i style="left:8px">${p.e[0]}</i><i style="left:46px">🥚</i><i style="left:70px">🥚</i><i class="rq-egg" style="left:96px">${p.e[1]}</i></div>
    <div class="rq-lane"><i style="left:8px">🪺</i><i style="left:46px">🥚</i><i style="left:70px">🥚</i><i class="rq-egg" style="left:96px;animation-delay:1.2s">${p.e[1]}</i></div>`;
  return `<div class="rq-card"><h4>${p.e[0]} ${esc(p.t)} ${p.e[1]}</h4>${lanes}<p>${esc(p.a)}</p><p>${esc(p.b)}</p></div>`;
}

// --- text and readout that follow the run -------------------------------------------------------------------
function updateSliders() {
  const t = T[lang];
  $('lVar').textContent = t.vari; $('vVar').textContent = nf(par1.mut, 1); $('rVar').value = par1.mut;
  $('lCost').textContent = t.cost; $('vCost').textContent = nf(par1.cost, 2); $('rCost').value = par1.cost;
}
function updateLive() {
  checkReveal();
  const t = T[lang], v = lab.view, S = cur(), h = last(S), tx = t.st;
  document.querySelectorAll('[data-act=run]').forEach((b) => { b.textContent = S.run.on && b.dataset.v === v ? t.pause : t.run; b.disabled = !canRun(b.dataset.v); });
  document.querySelectorAll('[data-act=plus]').forEach((b) => { b.textContent = t.plus; b.disabled = !canRun(b.dataset.v) || isDead(S); });
  document.querySelectorAll('[data-act=reset]').forEach((b) => { b.textContent = t.reset; });
  const acc = v === 'arms' ? '#ff9b3d' : v === 'stop' ? '#8fb7ff' : '#e0453f';
  const sub = `${t.gen} · ${t.tox} ${nf(h.t)}${S.solo ? '' : ` · ${t.res} ${nf(h.r)}`}`;
  lab.setReadout(S.gen, sub, S.solo ? '' : `${t.win} ${pc(succ(S))}`, acc);
  let st;
  if (v === 'arms') {
    if (mode1) st = tx[mode1];
    else if (P.arms === null) st = tx.need1;
    else if (REV.arms) st = P.arms === 0 ? tx.ok1 : tx.no1;
    else st = S.gen === 0 ? tx.ready1 : tx.go1;
  } else if (v === 'stop') {
    const f = S.freeze;
    if (S.dead.newts !== null) st = [...tx.deadN, REV.stop ? tx[P.stop === 0 ? 'okN' : 'noN'][1] : ''];
    else if (S.dead.snakes !== null) st = [...tx.deadS, ''];
    else if (REV.stop && f === 'newts') st = tx[P.stop === 0 ? 'okN' : 'noN'];
    else if (P.stop === null) st = tx.need2;
    else if (S.gen === 0 && f === null) st = tx.ready2;
    else st = f === 'newts' ? tx.goN : f === 'snakes' ? tx.goS : tx.goB;
  } else st = tx.queen;
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] ?? '', extra: '' });
  if (v === 'arms') { $('sk1').innerHTML = sketches(1); $('n1').textContent = P.arms === null && !mode1 ? t.needGuess : ''; }
  if (v === 'stop') { $('sk2').innerHTML = sketches(2); $('n2').textContent = P.stop === null ? t.needGuess : ''; }
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secArms').style.display = v === 'arms' ? '' : 'none';
  $('secStop').style.display = v === 'stop' ? '' : 'none';
  $('secQueen').style.display = v === 'queen' ? '' : 'none';
  $('q1').textContent = t.q1; $('q2').textContent = t.q2;
  updateSliders();
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret rq-sec ${open ? 'open' : ''} ${mode1 === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k === 'cost' ? 'a' : 'b'][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('cost', '🛡️') + sc('pond', '🏝️');
  $('frz').innerHTML = [['newts', t.fN], ['snakes', t.fS]].map(([k, l]) => `<button type="button" data-act="freeze" data-k="${k}" class="${S2.freeze === k ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('cards').innerHTML = t.pairs.map(pairCard).join('');
  lab.setGlow(v === 'arms' ? 'rgba(255, 155, 61, .26)' : v === 'stop' ? 'rgba(143, 183, 255, .24)' : 'rgba(224, 69, 63, .26)');
  lab.setFacts(t.facts[v]);
  updateLive();
}
render();
</script>
