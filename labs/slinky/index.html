        const s = Math.sin(TAU * (px + 1) / scM / lam + ph), dens = ((s + 1) / 2) ** 1.6;
        c.fillStyle = `rgba(${hi[0]}, ${hi[1]}, ${hi[2]}, ${(0.05 + 0.6 * dens) * ra})`; c.fillRect(pad + px, y, 2, bh);
      }
      const a = Math.min(2.4, 0.12 * lamPx);
      c.fillStyle = `rgba(255, 255, 255, ${0.5 * ra})`;
      for (let xr = 3; xr < W0; xr += 7) {
        const xp = xr + a * Math.cos(TAU * xr / scM / lam + ph);
        c.beginPath(); c.roundRect(pad + xp - 1, y + bh * 0.3, 2, bh * 0.4, 1); c.fill();
      }
    }
    c.restore();
    const sel = S.med === key && shown;
    c.save(); c.beginPath(); c.roundRect(pad, y, W0, bh, 14); c.lineWidth = sel ? 2.4 : 1;
    c.strokeStyle = sel ? '#ffffff' : 'rgba(130, 145, 190, .3)'; if (!shown) c.setLineDash([4, 4]); c.stroke(); c.restore();
    pill(c, shown ? `${t.s.med[key]} · ${big(m.v)} ${t.u.ms}` : t.s.med[key], pad + 8, y + 14);
    if (sel && ra > 0.5) { // one wavelength, to scale
      const lam = lamOf(m.v, S.f3), lamPx = lam * scM, yb = y + bh - 12, xa = pad + 10, xb = Math.min(xa + lamPx, pad + W0 - 8), cut = xa + lamPx > pad + W0 - 8;
      c.save(); c.strokeStyle = '#ffd86b'; c.lineWidth = 2; c.lineCap = 'round'; c.beginPath(); c.moveTo(xa, yb); c.lineTo(xb, yb); c.moveTo(xa, yb - 5); c.lineTo(xa, yb + 5);
      if (cut) { c.moveTo(xb - 6, yb - 5); c.lineTo(xb, yb); c.lineTo(xb - 6, yb + 5); } else { c.moveTo(xb, yb - 5); c.lineTo(xb, yb + 5); }
      c.stroke(); c.restore();
      const txt = `${t.s.lam} = ${lamTxt(lam)} ${t.u.m}`;
      if (lamPx > 130) pill(c, txt, (xa + xb) / 2, yb - 12, { align: 'center', color: '#ffd86b' }); else pill(c, txt, xb + 8, yb, { color: '#ffd86b' });
    }
  });
  const ry = h - 36;
  c.save(); c.strokeStyle = '#98A0B8'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(pad, ry); c.lineTo(pad + W0, ry);
  for (let m = 0; m <= WIN; m++) { const x = pad + m * scM; c.moveTo(x, ry); c.lineTo(x, ry + (m % 2 ? 4 : 8)); } c.stroke(); c.restore();
  for (let m = 0; m <= WIN; m += 2) plainText(c, m === WIN ? `${m} ${t.u.m}` : String(m), clamp(pad + m * scM, 14, w - 24), ry + 18, 'center');
  pill(c, t.s.slow, w - 8, h - 10, { align: 'right', bg: 'rgba(10, 12, 22, .6)', color: '#98A0B8' });
}
function drawOcean(c, w, h, tt) {
  const t = T[lang].s, ax = h * 0.54;
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#2b86c5'); bg.addColorStop(0.14, '#17659e'); bg.addColorStop(0.55, '#0b2f57'); bg.addColorStop(1, '#030c1c');
  c.fillStyle = bg; c.fillRect(0, 0, w, h);
  c.save(); c.fillStyle = 'rgba(255, 255, 255, .05)';
  [[0.15, 0.1], [0.45, 0.16], [0.78, 0.12]].forEach(([a, wd]) => { c.beginPath(); c.moveTo(w * a, 0); c.lineTo(w * (a + wd), 0); c.lineTo(w * (a + wd * 2.2), h * 0.7); c.lineTo(w * (a - wd * 0.6), h * 0.7); c.closePath(); c.fill(); });
  c.restore();
  c.save(); c.fillStyle = 'rgba(190, 235, 255, .35)'; c.beginPath(); c.moveTo(0, 0);
  for (let x = 0; x <= w; x += 8) c.lineTo(x, 7 + 2.5 * Math.sin(x / 26 + tt * 1.4));
  c.lineTo(w, 0); c.closePath(); c.fill(); c.restore();
  c.save(); c.setLineDash([6, 6]); c.strokeStyle = 'rgba(255, 216, 107, .55)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(0, ax); c.lineTo(w, ax); c.stroke(); c.restore();
  const wl = Math.max(160, w * 0.62), x0 = w * 0.3;
  [[0.2, 0], [0.34, 1.6], [0.5, 3.1]].forEach(([k, ph], r) => {
    const A = h * 0.12 * k * 2, yAt = (x) => ax + A * Math.sin(TAU * (x - x0) / wl + ph);
    c.save(); c.strokeStyle = `rgba(150, 235, 255, ${0.8 - r * 0.15})`; c.lineWidth = 2.2; c.lineCap = 'round'; c.lineJoin = 'round'; c.shadowColor = 'rgba(120, 230, 255, .7)'; c.shadowBlur = 8;
    c.beginPath(); c.moveTo(x0, yAt(x0));
    for (let x = x0 + 8; x <= w + 8; x += 8) c.lineTo(x, yAt(x)); c.stroke();
    const xp = x0 + ((tt * 60 + r * 90) % (w - x0)); c.fillStyle = '#fff'; c.beginPath(); c.arc(xp, yAt(xp), 4, 0, TAU); c.fill(); c.restore();
  });
  const s = clamp(w / 640, 0.5, 1), wx = w * 0.14 + 40 * s, wy = ax - h * 0.02;
  for (let j = 0; j < 3; j++) {
    const p = ((tt * 0.5 + j / 3) % 1), r = 14 + p * 70 * s;
    c.save(); c.strokeStyle = `rgba(190, 240, 255, ${0.65 * (1 - p)})`; c.lineWidth = 2; c.beginPath(); c.arc(wx + 62 * s, wy, r, -0.9, 0.9); c.stroke(); c.restore();
  }
  c.save(); c.translate(wx, wy); c.scale(s * 1.05, s * 1.05); c.rotate(Math.sin(tt * 0.8) * 0.03);
  const wg = c.createLinearGradient(0, -22, 0, 18); wg.addColorStop(0, '#7184a8'); wg.addColorStop(0.6, '#3a4a6c'); wg.addColorStop(1, '#c9d3e6');
  c.fillStyle = wg; c.strokeStyle = '#1a2440'; c.lineWidth = 1.6; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(70, 2); c.bezierCurveTo(60, -14, 20, -22, -20, -13); c.bezierCurveTo(-45, -8, -62, -4, -78, -6);
  c.bezierCurveTo(-84, -14, -92, -20, -100, -18); c.bezierCurveTo(-96, -10, -92, -4, -90, 0); c.bezierCurveTo(-92, 6, -96, 12, -100, 16);
  c.bezierCurveTo(-92, 16, -84, 12, -78, 6); c.bezierCurveTo(-60, 10, -30, 17, 10, 15); c.bezierCurveTo(40, 13, 62, 10, 70, 2); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(-8, -14); c.quadraticCurveTo(-18, -26, -26, -26); c.quadraticCurveTo(-24, -18, -22, -12); c.fillStyle = '#42557a'; c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(50, -1, 2.6, 0, TAU); c.fill(); c.fillStyle = '#10182c'; c.beginPath(); c.arc(50.6, -0.8, 1.4, 0, TAU); c.fill();
  c.restore();
  pill(c, t.ocean[4], wx, wy + 40 * s + 16, { align: 'center' });
  pill(c, t.ocean[3], w - 8, ax - 16, { align: 'right', color: '#ffd86b' });
}

const loop = (c, w, h, dt, tt) => { if (lab.view === 'sound') drawSound(c, w, h, dt, tt); else drawSlinky(c, w, h, dt, tt); };

// --- shell, controls ---------------------------------------------------------------------------------------
const lab = shell({ key: 'slinky', T, topics: TOPICS, views: ['kinds', 'freq', 'sound'], onLang: render, onView: render });
const secret = secretLab('slinky', () => ({
  secrets: [{ emo: '🏁', title: T[lang].secrets.a[0], desc: T[lang].secrets.a[1] }, { emo: '🐋', title: T[lang].secrets.b[0], desc: T[lang].secrets.b[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="c1"><div class="sk-pq" id="q1"></div><div class="row2" id="r1"></div><div class="row2"><div class="chips" id="s1"></div></div></div>
  <div id="c2"><div class="sk-pq" id="q2"></div>
    <div id="run2" hidden>
      <div class="sk-sl"><span class="lbl" id="lf"></span><input type="range" class="big" id="rf" min="8" max="25" step="1" value="10" style="--track: linear-gradient(90deg, #3b82f6, #f5c84c, #ef4444)"><b id="df"></b></div>
      <div class="sk-sl"><span class="lbl" id="la"></span><input type="range" class="big" id="ra" min="15" max="100" step="5" value="55" style="--track: linear-gradient(90deg, #2b4a7a, #5fd6c8)"><b id="da"></b></div>
      <div class="row2"><div class="card seg small" id="spSeg"></div><button class="chip" data-act="rest" id="bRest"></button></div>
    </div></div>
  <div id="c3"><div class="sk-pq" id="q3"></div><div class="row2"><div class="chips" id="mChips"></div></div>
    <div id="run3" hidden><div class="sk-sl"><span class="lbl" id="ln"></span><input type="range" class="big" id="rn" min="110" max="880" step="10" value="440" style="--track: linear-gradient(90deg, #5aa05a, #f5c84c, #ef4444)"><b id="dn"></b></div></div>
    <div class="row2"><div class="chips" id="s3"></div></div></div>`;
canvasLoop($('cv'), loop);

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'p1') { S.p1 = i; S.mode = 'L'; trail = []; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'mode') { S.mode = b.dataset.m; trail = []; sfx.click(); }
  else if (a === 'p2') { S.p2 = i; S.last = null; restart(); (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'p3') { S.p3 = i; S.med = 'water'; S.rev3 = 0; (i === 2 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'med') { S.med = b.dataset.k; sfx.tick(); }
  else if (a === 'stiff') { S.stiff = +b.dataset.m; S.last = 's'; sfx.click(); }
  else if (a === 'rest') { restart(); sfx.snap(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'race') S.race = !S.race; else S.sofar = !S.sofar;
    sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'rf') { S.f2 = v / 10; S.last = 'f'; } else if (id === 'ra') { S.a2 = v / 100; S.last = 'a'; } else if (id === 'rn') S.f3 = v; else return;
  render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------
const qBlock = (q, opts, act, ans, ok, verdict, expl) => (ans === null
  ? `<div class="q">${esc(q)}</div><div class="opts">${opts.map((o, i) => `<button data-act="${act}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
  : `<div class="verdict ${ans === ok ? 'ok' : 'no'}">${esc(verdict)}</div><p>${esc(expl)}</p>`);
const secChip = (k, emo, name) => {
  const open = secret.unlocked(), on = k === 'race' ? S.race : S.sofar;
  return `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(name)}` : '🔒 ???'}</button>`;
};
function render() {
  const t = T[lang], v = lab.view;
  $('c1').hidden = v !== 'kinds'; $('c2').hidden = v !== 'freq'; $('c3').hidden = v !== 'sound';
  if (v !== lastView) { lastView = v; trail = []; if (v !== 'sound') { const P = params(); prime(P.f, P.a, P.v); } }
  if (v === 'kinds') renderKinds(t); else if (v === 'freq') renderFreq(t); else renderSound(t);
}
function renderKinds(t) {
  const k = t.k, ans = S.p1 !== null, f = 1, vv = VS[0], lam = lamOf(vv, f);
  $('q1').innerHTML = qBlock(k.q, k.opts, 'p1', S.p1, 1, S.p1 === 1 ? k.right : k.wrong, k.vx);
  $('r1').innerHTML = `<button class="chip ${S.mode === 'T' ? 'on' : ''}" data-act="mode" data-m="T">${esc(k.sideways)}</button>
    <button class="chip ${S.mode === 'L' ? 'on' : ''}" data-act="mode" data-m="L"${ans ? '' : ' disabled'}>${esc(k.push)}</button>`;
  $('s1').innerHTML = secChip('race', '🏁', t.secrets.a[0]);
  lab.setGlow('rgba(95, 168, 160, .26)');
  lab.setReadout(`${num(vv)} ${t.u.ms}`, t.rd(num(f, 1), num(lam)), S.mode === 'T' ? k.pillT : k.pillL, '#5fa8a0');
  let st;
  if (S.race) st = { emo: '🏁', title: k.race[0], lead: k.race[1](num(L / vv)), body: '' };
  else if (!ans) st = { emo: '🤔', title: k.q, lead: k.pre, body: '' };
  else if (S.mode === 'T') st = { emo: '↕️', title: k.tT[0], lead: k.tT[1], body: '' };
  else st = { emo: '↔️', title: k.tL[0], lead: k.tL[1], body: k.snd };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(ans ? t.facts.k : []);
}
function renderFreq(t) {
  const f = t.f, ans = S.p2 !== null, P = params(), vv = P.v, lam = lamOf(vv, P.f);
  $('run2').hidden = !ans;
  lab.setGlow('rgba(224, 176, 80, .24)');
  if (!ans) {
    $('q2').innerHTML = qBlock(f.q, f.opts, 'p2', null, 1, '', '');
    lab.setReadout(`${num(1, 1)} ${t.u.hz}`, f.rdPre, '', '#e0b050');
    lab.setState({ emo: '🤔', title: f.q, lead: f.pre, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  $('q2').innerHTML = qBlock(f.q, f.opts, 'p2', S.p2, 1, S.p2 === 1 ? f.right : f.wrong, f.vx(num(vv)));
  $('lf').textContent = f.freq; $('df').textContent = `${num(S.f2, 1)} ${t.u.hz}`;
  $('la').textContent = f.amp; $('da').textContent = `${Math.round(S.a2 * 100)} %`;

  $('spSeg').innerHTML = [[0, f.soft], [1, f.tight]].map(([m, l]) => `<button data-act="stiff" data-m="${m}" class="${S.stiff === m ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('bRest').textContent = f.rest;
  lab.setReadout(`${num(vv)} ${t.u.ms}`, t.rd(num(S.f2, 1), num(lam)), f.time(num(L / vv)), '#e0b050');
  const l2 = num(lam), v2 = num(vv);
  const st = S.last === 'f' ? { emo: '🎚️', title: f.sF[0], lead: f.sF[1](num(S.f2, 1), l2, v2) }
    : S.last === 'a' ? { emo: '📏', title: f.sA[0], lead: f.sA[1](v2) }

}
function renderSound(t) {
  const s = t.s, ans = S.p3 !== null, fq = S.f3;
  if (!ans) S.med = 'air';
  const m = MED[S.med], la = lamOf(MED.air.v, 440), lw = lamOf(MED.water.v, 440), ratio = MED.water.v / MED.air.v;
  $('q3').innerHTML = qBlock(s.q(num(440, 0), num(la)), s.opts, 'p3', S.p3, 2, S.p3 === 2 ? s.right : s.wrong, s.vx(num(ratio, 1), lamTxt(lw)));
  $('mChips').innerHTML = ['air', 'water', 'steel'].map((k) => `<button class="chip ${S.med === k ? 'on' : ''}" data-act="med" data-k="${k}"${ans || k === 'air' ? '' : ' disabled'}>${esc(s.med[k])}</button>`).join('');

  }
  $('s3').innerHTML = secChip('sofar', '🐋', t.secrets.b[0]);
  lab.setGlow('rgba(95, 140, 224, .26)');
  if (S.sofar) {
    lab.setReadout(`≈ 1 ${t.u.km}`, s.ocean[3], '', '#5f8ce0');
    lab.setState({ emo: '🐋', title: s.ocean[0], lead: s.ocean[1], body: s.ocean[2], extra: '' });
    lab.setFacts(t.facts.o);
    return;
  }
  const lam = lamOf(m.v, fq);
  lab.setReadout(`${lamTxt(lam)} ${t.u.m}`, `${s.in[S.med]}: ${big(m.v)} ${t.u.ms}`, fq === 440 ? `A4 · 440 ${t.u.hz}` : `${fq} ${t.u.hz}`, '#5f8ce0');
  if (!ans) lab.setState({ emo: '🤔', title: s.q(num(440, 0), num(la)), lead: s.pre(num(440, 0), num(la)), body: '', extra: '' });
  else {
    const cmp = s.cmp(lamTxt(lamOf(MED.air.v, fq)), lamTxt(lamOf(MED.water.v, fq)), lamTxt(lamOf(MED.steel.v, fq)));
    lab.setState({ emo: '📏', title: s.st[0], lead: s.st[1](s.in[S.med], big(m.v), fq, lamTxt(lam)), body: S.p2 !== null ? `${cmp} ${s.rule}` : cmp, extra: '' });
  }
  lab.setFacts(ans ? t.facts.s1 : t.facts.s0);
}
render();
