// --- palette and small helpers ------------------------------------------------------------------------------
const CL = { sky0: '#0E1433', sky1: '#26306B', hill: '#1E3B34', wood: '#B8834F', gold: '#FFD166', torch: '#FFE7A3', laser: '#5CFF8A',
  chalk: '#F4F1E8', neon: '#FF8FB1', bg: '#0B1029' };
const TAU = Math.PI * 2;
const cl = (x, a, b) => Math.min(b, Math.max(a, x));
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ss = (x) => x * x * (3 - 2 * x);
const ramp = (x, a, b) => clamp01((x - a) / (b - a));
const mixN = (a, b, t) => a + (b - a) * t;
const hex2 = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const toHex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(cl(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hex2(a), B = hex2(b); return toHex(mixN(A[0], B[0], t), mixN(A[1], B[1], t), mixN(A[2], B[2], t)); };
const shade = (h, k) => (k >= 0 ? mix(h, '#000000', k) : mix(h, '#ffffff', -k));
const rgba = (h, a) => { const [r, g, b] = hex2(h); return `rgba(${r},${g},${b},${a})`; };
const now = () => performance.now() / 1000;
const scaleOf = (w) => cl(w / 375, 0.9, 1.5);

// twinkling stars at fixed places (a small seeded generator, so the sky is the same every time)
const STARS = (() => {
  let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return Array.from({ length: 90 }, () => ({ x: r(), y: r(), r: 0.5 + r() * 1.1, ph: r() * TAU, sp: 0.8 + r() * 1.8 }));
})();
function drawStars(c, w, h, t, alpha) {
  c.save(); c.fillStyle = CL.chalk;
  for (const s of STARS) {
    c.globalAlpha = alpha * (0.725 + 0.275 * Math.sin(t * s.sp + s.ph));
    c.beginPath(); c.arc(s.x * w, s.y * h, Math.max(0, s.r), 0, TAU); c.fill();
  }
  c.restore();
}
function skyBG(c, w, h, t, starA, z = 0) {
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, mix(CL.sky0, CL.bg, z * 0.8)); g.addColorStop(1, mix(CL.sky1, CL.bg, z * 0.85));
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  drawStars(c, w, h, t, starA);
}
function exitT(x, y, dx, dy, w, h) {
  let t = 1e9;
  if (dx > 0) t = Math.min(t, (w - x) / dx); else if (dx < 0) t = Math.min(t, -x / dx);
  if (dy > 0) t = Math.min(t, (h - y) / dy); else if (dy < 0) t = Math.min(t, -y / dy);
  return Math.max(0, t);
}
function pillText(c, txt, x, y, o = {}) {
  const { w, h, font = '800 13px Nunito, sans-serif', align = 'center', a = 1, padX = 11, hgt = 24, fg = CL.chalk } = o;
  c.save(); c.globalAlpha = a; c.font = font;
  const bw = c.measureText(txt).width + padX * 2;
  let bx = align === 'left' ? x : align === 'right' ? x - bw : x - bw / 2, by = y - hgt / 2;
  if (w) bx = cl(bx, 6, Math.max(6, w - bw - 6));
  if (h) by = cl(by, 6, Math.max(6, h - hgt - 6));
  c.beginPath(); c.roundRect(bx, by, bw, hgt, hgt / 2);
  c.fillStyle = 'rgba(11,16,41,.82)'; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(244,241,232,.35)'; c.stroke();
  c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, bx + bw / 2, by + hgt / 2 + 1);
  c.restore();
}

// chalk drawings: segment = dot-dot, ray = dot-arrow, line = arrow-arrow
function chalkStroke(c, x1, y1, x2, y2, lw = 2.4, a = 1) {
  c.save(); c.globalAlpha = a; c.strokeStyle = CL.chalk; c.lineWidth = lw; c.lineCap = 'round';
  c.shadowColor = CL.chalk; c.shadowBlur = 5;
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.restore();
}
function chalkDot(c, x, y, r, a = 1, col = CL.chalk) {
  if (a <= 0 || r <= 0) return;
  c.save(); c.globalAlpha = a; c.fillStyle = col; c.shadowColor = col; c.shadowBlur = 7;
  c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); c.fill(); c.restore();
}
function arrowHead(c, x, y, ang, size, a = 1, col = CL.chalk) { // the tip is at (x, y), pointing along ang
  if (a <= 0) return;
  c.save(); c.globalAlpha = a; c.translate(x, y); c.rotate(ang); c.fillStyle = col; c.shadowColor = col; c.shadowBlur = 7;
  c.beginPath(); c.moveTo(0, 0); c.lineTo(-size, -size * 0.52); c.lineTo(-size * 0.7, 0); c.lineTo(-size, size * 0.52); c.closePath(); c.fill();
  c.restore();
}
// kind 0 segment (A, B are the two ends), 1 ray (A is the start, B the arrow tip), 2 line (A and B are both arrow tips); p grows 0 -> 1
function chalkFigure(c, kind, A, B, p, m = 1) {
  const dot = 4.2 * m, ah = 11 * m, ang = Math.atan2(B.y - A.y, B.x - A.x);
  const pop = (x) => ease(clamp01(x));
  if (kind === 0) {
    const e = pop(ramp(p, 0.15, 0.85));
    chalkStroke(c, A.x, A.y, mixN(A.x, B.x, e), mixN(A.y, B.y, e));
    chalkDot(c, A.x, A.y, dot * pop(ramp(p, 0, 0.2)));
    chalkDot(c, B.x, B.y, dot * pop(ramp(p, 0.8, 1)));
  } else if (kind === 1) {
    const e = pop(ramp(p, 0.15, 0.85));
    chalkStroke(c, A.x, A.y, mixN(A.x, B.x, e), mixN(A.y, B.y, e));
    chalkDot(c, A.x, A.y, dot * pop(ramp(p, 0, 0.2)));
    arrowHead(c, B.x, B.y, ang, ah, pop(ramp(p, 0.8, 1)));
  } else {
    const e = pop(ramp(p, 0.1, 0.85)), mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    chalkStroke(c, mx, my, mixN(mx, A.x, e), mixN(my, A.y, e));
    chalkStroke(c, mx, my, mixN(mx, B.x, e), mixN(my, B.y, e));
    const a = pop(ramp(p, 0.8, 1));
    arrowHead(c, A.x, A.y, ang + Math.PI, ah, a);
    arrowHead(c, B.x, B.y, ang, ah, a);
  }
}
function beam(c, x1, y1, x2, y2, a = 1, boost = 0) { // a thin, very bright laser: 2 px core, soft glow
  c.save(); c.lineCap = 'round'; c.globalAlpha = a;
  c.strokeStyle = rgba(CL.laser, 0.28 + 0.18 * boost); c.lineWidth = 6 + 3 * boost; c.shadowColor = CL.laser; c.shadowBlur = 14;
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();

// --- objects, drawn in their own frame: the origin is the middle, +x is the way the light goes -----------------------
function drawTorch(c, len, rad) {
  const L = len / 2, g = c.createLinearGradient(0, -rad * 1.2, 0, rad * 1.2);
  g.addColorStop(0, '#D5DBF5'); g.addColorStop(0.35, '#8F99C4'); g.addColorStop(1, '#2F3868');
  c.save(); c.lineJoin = 'round';
  c.lineWidth = Math.max(0.6, rad * 0.12); c.strokeStyle = CL.sky0; c.fillStyle = g;
  c.beginPath(); c.roundRect(-L, -rad * 0.72, len * 0.68, rad * 1.44, rad * 0.5); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(L * 0.25, -rad * 0.72); c.lineTo(L * 0.8, -rad * 1.2); c.lineTo(L, -rad * 1.2);
  c.lineTo(L, rad * 1.2); c.lineTo(L * 0.8, rad * 1.2); c.lineTo(L * 0.25, rad * 0.72); c.closePath(); c.fill(); c.stroke();
  if (rad > 3) {
    c.strokeStyle = 'rgba(14,20,51,.35)'; c.lineWidth = 1;
    for (let i = 0; i < 5; i++) { const x = -L + len * (0.08 + i * 0.06); c.beginPath(); c.moveTo(x, -rad * 0.6); c.lineTo(x, rad * 0.6); c.stroke(); }
    c.fillStyle = '#2A3260'; c.beginPath(); c.roundRect(-L * 0.25, -rad * 0.98, rad * 0.9, rad * 0.32, rad * 0.12); c.fill();
  }
  c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = Math.max(0.6, rad * 0.16); c.lineCap = 'round';
  c.beginPath(); c.moveTo(-L + rad * 0.4, -rad * 0.46); c.lineTo(L * 0.2, -rad * 0.46); c.stroke();
  c.fillStyle = '#FFF4CE'; c.shadowColor = CL.torch; c.shadowBlur = rad * 1.4;
  c.beginPath(); c.ellipse(L, 0, Math.max(0, rad * 0.28), Math.max(0, rad * 1.05), 0, 0, TAU); c.fill();
  c.restore();
}
function drawLaserBox(c, len, th, lit = true) {
  const L = len / 2, g = c.createLinearGradient(0, -th / 2, 0, th / 2);
  g.addColorStop(0, '#3A4580'); g.addColorStop(0.5, '#2A3260'); g.addColorStop(1, '#151B45');
  c.save(); c.lineJoin = 'round'; c.lineWidth = Math.max(0.6, th * 0.09); c.strokeStyle = '#0B1029'; c.fillStyle = g;
  c.beginPath(); c.roundRect(-L, -th / 2, len, th, th * 0.28); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(190,205,255,.5)'; c.lineWidth = Math.max(0.5, th * 0.08); c.lineCap = 'round';
  c.beginPath(); c.moveTo(-L + th * 0.3, -th * 0.28); c.lineTo(L - th * 0.5, -th * 0.28); c.stroke();
  if (th > 5) { c.fillStyle = CL.chalk; c.globalAlpha = 0.55; c.fillRect(-L * 0.45, -th * 0.08, len * 0.3, th * 0.12); c.globalAlpha = 1; }
  c.fillStyle = lit ? CL.laser : '#26306B'; c.shadowColor = CL.laser; c.shadowBlur = lit ? th * 1.2 : 0;
  c.beginPath(); c.arc(L, 0, Math.max(0, th * 0.2), 0, TAU); c.fill();
  c.restore();
}
function drawCone(c, hx, hy, dx, dy, len, halfDeg, alpha) { // soft warm cone: three wedges, brighter in the middle
  const ang = Math.atan2(dy, dx), rg = c.createRadialGradient(hx, hy, 0, hx, hy, Math.max(1, len));
  rg.addColorStop(0, rgba(CL.torch, 0.7)); rg.addColorStop(0.4, rgba(CL.torch, 0.3)); rg.addColorStop(1, rgba(CL.torch, 0.09));
  c.save(); c.globalAlpha = alpha; c.fillStyle = rg;

    c.beginPath(); c.moveTo(hx, hy); c.arc(hx, hy, Math.max(1, len), ang - hw, ang + hw); c.closePath(); c.fill();

}
function glowDot(c, x, y, r, col, a = 1) {
  const g = c.createRadialGradient(x, y, 0, x, y, Math.max(1, r));
  g.addColorStop(0, rgba(col, 0.95 * a)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); c.fill();
}
function shadowEll(c, x, y, rx, ry, a = 0.35) {
  c.save(); c.fillStyle = `rgba(5,8,20,${a})`; c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, TAU); c.fill(); c.restore();
}

// --- Earth and Moon -------------------------------------------------------------------------------------------
const LAND = [[-0.1, -0.78, 0.3, 0.12, 0], [-0.45, -0.1, 0.28, 0.2, 0.5], [0.35, 0.25, 0.3, 0.16, -0.4], [0, 0.62, 0.22, 0.1, 0.2]];
function drawEarthBody(c, x, y, R, a = 1) {
  if (R < 0.5 || a <= 0) return;
  c.save(); c.globalAlpha = a;
  const ag = c.createRadialGradient(x, y, R * 0.9, x, y, R * 1.4);
  ag.addColorStop(0, 'rgba(106,168,255,.55)'); ag.addColorStop(1, 'rgba(106,168,255,0)');
  c.fillStyle = ag; c.beginPath(); c.arc(x, y, R * 1.4, 0, TAU); c.fill();
  c.save(); c.beginPath(); c.arc(x, y, R, 0, TAU); c.clip();
  const og = c.createRadialGradient(x - R * 0.35, y - R * 0.4, R * 0.05, x, y, R * 1.1);
  og.addColorStop(0, '#6EA2F5'); og.addColorStop(0.55, '#3167CF'); og.addColorStop(1, '#183B88');
  c.fillStyle = og; c.fillRect(x - R, y - R, R * 2, R * 2);
  for (const [bx, by, rx, ry, rot] of LAND) {
    c.save(); c.translate(x + bx * R, y + by * R); c.rotate(rot); c.scale(1, ry / rx);
    c.fillStyle = 'rgba(62,143,91,.92)'; c.beginPath(); c.arc(0, 0, Math.max(0, rx * R), 0, TAU); c.fill(); c.restore();
  }
  c.fillStyle = 'rgba(255,255,255,.3)';
  for (const [bx, by, rx] of [[-0.3, -0.45, 0.2], [0.3, -0.05, 0.16], [-0.1, 0.4, 0.18]]) {
    c.beginPath(); c.ellipse(x + bx * R, y + by * R, Math.max(0, rx * R), Math.max(0, rx * R * 0.35), 0.2, 0, TAU); c.fill();
  }
  const ns = c.createRadialGradient(x - R * 0.3, y - R * 0.35, R * 0.4, x + R * 0.35, y + R * 0.4, R * 1.3);
  ns.addColorStop(0, 'rgba(5,8,25,0)'); ns.addColorStop(1, 'rgba(5,8,25,.6)');
  c.fillStyle = ns; c.fillRect(x - R, y - R, R * 2, R * 2);
  c.restore();
  c.strokeStyle = 'rgba(160,200,255,.55)'; c.lineWidth = 1.2; c.beginPath(); c.arc(x, y, R, 0, TAU); c.stroke();
  c.restore();
}
function drawMoonBody(c, x, y, r) {
  if (r < 0.4) return;
  c.save();
  const gl = c.createRadialGradient(x, y, r * 0.9, x, y, r * 2.2);
  gl.addColorStop(0, 'rgba(216,224,255,.22)'); gl.addColorStop(1, 'rgba(216,224,255,0)');
  c.fillStyle = gl; c.beginPath(); c.arc(x, y, r * 2.2, 0, TAU); c.fill();
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.05);
  g.addColorStop(0, '#F1F3FB'); g.addColorStop(0.6, '#B8BFD8'); g.addColorStop(1, '#6B7396');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  c.fillStyle = 'rgba(60,68,105,.35)';
  for (const [bx, by, rr] of [[-0.3, -0.1, 0.22], [0.25, 0.3, 0.16], [0.1, -0.45, 0.12], [-0.1, 0.5, 0.1]]) {
    c.beginPath(); c.arc(x + bx * r, y + by * r, Math.max(0, rr * r), 0, TAU); c.fill();

// --- zoom geometry ---------------------------------------------------------------------------------------------
const TH = (32 * Math.PI) / 180, BD = { x: Math.cos(TH), y: -Math.sin(TH) }, BN = { x: Math.sin(TH), y: Math.cos(TH) };
function curZ(t) {
  if (!S.tw) return S.z;
  return mixN(S.tw.a, S.tw.b, ease(clamp01((t - S.tw.t0) / S.tw.dur)));
}
function startTween(to, ms, then) {
  const a = curZ(now());
  S.tw = { a, b: to, t0: now(), dur: ms / 1000 }; S.z = to; S.busy = true;
  const id = ++S.twId;
  setTimeout(() => { if (id !== S.twId) return; S.tw = null; S.busy = false; then?.(); render(); }, ms + 30);
}
function geom(w, h, z) {
  const m = scaleOf(w), U = Math.min(w, h), k = Math.pow(1600, -z);
  const R0 = 1.3 * w, RA = 0.19 * U, RB = 0.055 * U;
  const R = z <= 0.5 ? R0 * Math.pow(RA / R0, z / 0.5) : RA * Math.pow(RB / RA, (z - 0.5) / 0.5);
  const py = z <= 0.5 ? mixN(0.5 * h, 0.36 * h - RA, ss(z / 0.5)) : 0.36 * h - R;
  return { m, U, k, R, P: { x: w / 2, y: py }, C: { x: w / 2, y: py + R } };
}
// a point standing on the ground, dx pixels (in the room) to the side of the hill top
const ground = (g, dx) => { const x = dx * g.k; return { x: g.P.x + x, y: g.P.y + g.R - Math.sqrt(Math.max(0, g.R * g.R - x * x)) }; };

function zoomReadout(z, force) {
  const t = T[lang], idx = Math.round(z * 4), done = S.zStep === 3;
  const key = `${idx}:${lang}:${done}`;
  if (key === S.rKey && !force) return;
  S.rKey = key;
  lab.setReadout(esc(t.scale[idx]), done ? t.z.ends : '', '', CL.laser);
}

// --- the zoom scene ---------------------------------------------------------------------------------------------
function drawZoom(c, w, h, t) {
  const t_ = T[lang], z = curZ(t), g = geom(w, h, z), { m, k, R, P, C } = g;
  if (!S.sec) { zoomReadout(z, false); if (S.tw) $('zs').value = Math.round(z * 100); }
  skyBG(c, w, h, t, 0.55 + 0.45 * z, z);

  // a far ridge behind the hill, only in the room
  const ra = 1 - ramp(z, 0.02, 0.2);
  if (ra > 0) {
    c.save(); c.globalAlpha = ra; c.fillStyle = mix(CL.sky1, CL.hill, 0.45);
    c.beginPath(); c.moveTo(0, h);
    for (let x = 0; x <= w; x += 10) c.lineTo(x, P.y - 0.04 * h - 0.03 * h * Math.sin((x / w) * 5 + 1) - 0.02 * h * Math.sin((x / w) * 11));
    c.lineTo(w, h); c.closePath(); c.fill(); c.restore();
  }

  // the Moon: far up and to the right; the laser passes beside it, not into it
  const rm = 0.26 * R, M = { x: P.x + BD.x * 3 * R + BN.x * 0.5 * R, y: P.y + BD.y * 3 * R + BN.y * 0.5 * R };
  if (rm > 0.6 && M.x + rm * 2 > 0 && M.x - rm * 2 < w && M.y + rm * 2 > 0 && M.y - rm * 2 < h) drawMoonBody(c, M.x, M.y, rm);

  // the hill that becomes a planet
  const gg = c.createLinearGradient(0, P.y, 0, P.y + Math.min(R * 1.2, h));
  gg.addColorStop(0, shade(CL.hill, -0.18)); gg.addColorStop(0.35, CL.hill); gg.addColorStop(1, shade(CL.hill, 0.35));
  c.fillStyle = gg; c.beginPath(); c.arc(C.x, C.y, Math.max(0, R), 0, TAU); c.fill();
  const rim = 1 - ramp(z, 0.25, 0.5);
  if (rim > 0) {
    c.save(); c.globalAlpha = rim * 0.7; c.strokeStyle = '#7FD3B8'; c.lineWidth = 2; c.shadowColor = '#7FD3B8'; c.shadowBlur = 12;
    c.beginPath(); c.arc(C.x, C.y, Math.max(0, R), -Math.PI * 0.78, -Math.PI * 0.22); c.stroke(); c.restore();
  }
  drawEarthBody(c, C.x, C.y, R, ramp(z, 0.28, 0.55));

  // objects on the hill; everything shrinks by k around the hill top
  const Sp = ground(g, -0.3 * w), Tp = ground(g, -0.02 * w), Lp = ground(g, 0.22 * w);
  const DV = { x: P.x, y: P.y + 0.3 * h * k };
  const small = k < 0.06;

  // the stick on two stones: never shorter than 6 px, both end dots stay
  {
    const len = Math.max(6, 104 * m * k), th = Math.max(1.6, 7 * m * k), lift = 7 * m * k;
    if (!small) { shadowEll(c, Sp.x, Sp.y + 1, len * 0.6, 4 * m * k + 1); for (const f of [-0.32, 0.32]) { c.fillStyle = '#4A5680'; c.beginPath(); c.ellipse(Sp.x + len * f, Sp.y - 2 * m * k, 6 * m * k, 4.5 * m * k, 0, 0, TAU); c.fill(); } }
    const sy = Sp.y - lift - (small ? 2 : 0), gr = c.createLinearGradient(0, sy - th / 2, 0, sy + th / 2);
    gr.addColorStop(0, shade(CL.wood, -0.25)); gr.addColorStop(0.5, CL.wood); gr.addColorStop(1, shade(CL.wood, 0.35));
    c.fillStyle = gr; c.strokeStyle = shade(CL.wood, 0.55); c.lineWidth = Math.max(0.6, th * 0.12);
    c.beginPath(); c.roundRect(Sp.x - len / 2, sy - th / 2, len, th, th / 2); c.fill(); c.stroke();
    if (th > 4) {
      c.strokeStyle = rgba(shade(CL.wood, 0.5), 0.5); c.lineWidth = 1;
      for (const f of [-0.2, 0.05, 0.28]) { c.beginPath(); c.moveTo(Sp.x - len * 0.45, sy + th * f); c.quadraticCurveTo(Sp.x, sy + th * f + th * 0.1, Sp.x + len * 0.45, sy + th * f); c.stroke(); }
    }
    const dr = Math.max(1.8, 3.4 * m * k);
    for (const sx of [-1, 1]) { glowDot(c, Sp.x + sx * (len / 2 - th * 0.15), sy, dr * 2.6, CL.gold, 0.8); chalkDot(c, Sp.x + sx * (len / 2 - th * 0.15), sy, dr, 1, CL.gold); }
  }

  // the torch: a soft warm cone that fades, because real light fades
  {
    const hd = { x: -Math.cos(0.49), y: -Math.sin(0.49) }, tl = 48 * m * k, tr = 8.5 * m * k;
    const cx = Tp.x, cy = Tp.y - 12 * m * k, hx = cx + hd.x * tl / 2, hy = cy + hd.y * tl / 2;
    if (!small) shadowEll(c, Tp.x, Tp.y + 1, 22 * m * k, 4 * m * k + 1);
    drawCone(c, hx, hy, hd.x, hd.y, 0.38 * w * k, 16, 0.55);
    if (!small) { c.save(); c.translate(cx, cy); c.rotate(Math.atan2(hd.y, hd.x)); drawTorch(c, tl, tr); c.restore(); }
    glowDot(c, hx, hy, Math.max(4, 26 * m * k), CL.torch, 0.9);
  }

  // the single laser on a little stand; the beam never stops, so it always reaches the edge
  {
    const bl = 34 * m * k, bth = 15 * m * k, cx = Lp.x, cy = Lp.y - 14 * m * k;
    const N = { x: cx + BD.x * (bl / 2), y: cy + BD.y * (bl / 2) };
    if (!small) {
      shadowEll(c, Lp.x, Lp.y + 1, 14 * m * k, 3.5 * m * k + 1);
      c.strokeStyle = '#3A4580'; c.lineWidth = Math.max(1, 2.2 * m * k); c.lineCap = 'round';
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(Lp.x - 11 * m * k, Lp.y); c.moveTo(cx, cy); c.lineTo(Lp.x + 9 * m * k, Lp.y); c.stroke();
      c.save(); c.translate(cx, cy); c.rotate(Math.atan2(BD.y, BD.x)); drawLaserBox(c, bl, bth, true); c.restore();
    }
    const tt = exitT(N.x, N.y, BD.x, BD.y, w, h), E = { x: N.x + BD.x * tt, y: N.y + BD.y * tt };
    beam(c, N.x, N.y, E.x, E.y, 1, 0);
    arrowHead(c, E.x - BD.x * 3, E.y - BD.y * 3, Math.atan2(BD.y, BD.x), 12 * m, ramp(t - S.arrow1At, 0, 0.7), CL.laser);
    if (t > S.chalk1At) chalkDot(c, N.x, N.y, 3.6 * m, ramp(t - S.chalk1At, 0, 0.4), CL.chalk);
  }

  // the double laser in the foreground: a box that shines both ways
  {
    const lit = clamp01((t - S.devAt) / 0.8), bl = 34 * m * k, bth = 16 * m * k, by = DV.y - bth / 2 - 3 * m * k;
    if (!small) {
      shadowEll(c, DV.x, DV.y + 1, bl * 0.6, 3.5 * m * k + 1);
      c.fillStyle = '#2A3260'; c.beginPath(); c.roundRect(DV.x - bl * 0.22, by + bth / 2, bl * 0.44, 3 * m * k + 1, 2); c.fill();
      c.save(); c.translate(DV.x, by); drawLaserBox(c, bl, bth, lit > 0.4); c.restore();
    }
    if (lit > 0) {
      beam(c, DV.x - bl / 2, by, 0, by, lit, 0); beam(c, DV.x + bl / 2, by, w, by, lit, 0);
      const aa = ramp(t - S.arrow2At, 0, 0.7);
      arrowHead(c, 3, by, Math.PI, 12 * m, aa * lit, CL.laser); arrowHead(c, w - 3, by, 0, 12 * m, aa * lit, CL.laser);
    }
  }

  // the chalk drawings: a row of fixed places, each tied to its object by a dotted guide once we are away from the room
  {
    const row = 0.64 * h, Lc = 0.22 * w;
    const items = [
      { kind: 0, cx: 0.2 * w, at: S.chalk1At, name: t_.seg, o: { x: Sp.x, y: Sp.y } },
      { kind: 2, cx: 0.5 * w, at: S.chalk2At, name: t_.line, o: { x: DV.x, y: DV.y } },
      { kind: 1, cx: 0.78 * w, at: S.chalk1At, name: t_.ray, o: { x: Lp.x, y: Lp.y } },
    ];
    for (const it of items) {
      const p = clamp01((t - it.at) / 1.0);
      if (p <= 0) continue;
      const gl = 0.3 * ramp(z, 0.03, 0.15) * p;
      if (gl > 0) {
        c.save(); c.globalAlpha = gl; c.strokeStyle = CL.chalk; c.lineWidth = 1.2; c.setLineDash([3, 5]);
        c.beginPath(); c.moveTo(it.o.x, it.o.y); c.lineTo(it.cx, row - 14 * m); c.stroke(); c.restore();
      }
      chalkFigure(c, it.kind, { x: it.cx - Lc / 2, y: row }, { x: it.cx + Lc / 2, y: row }, p, m);
      pillText(c, it.name, it.cx, row + 26 * m, { w, h, a: ramp(p, 0.6, 1) });
    }
  }
  pillText(c, t_.scale[Math.round(z * 4)], 10, 20, { align: 'left', w, h });
}

// --- secret: a laser to the Moon and back ---------------------------------------------------------------------------
function drawMoonSecret(c, w, h, t) {
  const U = Math.min(w, h), m = scaleOf(w), tx = T[lang];
  skyBG(c, w, h, t, 1, 1);
  const R = 0.27 * U, E = { x: 0.27 * w, y: 0.68 * h };
  drawEarthBody(c, E.x, E.y, R, 1);
  const ob = (-40 * Math.PI) / 180, O = { x: E.x + Math.cos(ob) * R, y: E.y + Math.sin(ob) * R };
  const Mn = { x: 0.8 * w, y: 0.3 * h }, rm = 0.12 * U;
  drawMoonBody(c, Mn.x, Mn.y, rm);
  let ux = O.x - Mn.x, uy = O.y - Mn.y; const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;
  const Pm = { x: Mn.x + ux * rm * 0.96, y: Mn.y + uy * rm * 0.96 };
  // the small mirror panel on the Moon, facing Earth
  c.save(); c.translate(Pm.x, Pm.y); c.rotate(Math.atan2(uy, ux));
  c.fillStyle = '#D8E0FF'; c.strokeStyle = CL.sky0; c.lineWidth = 1;

function neonStroke(c, pts, m, flick) {

  const path = () => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); };
  c.shadowColor = CL.neon;
  for (const [lw, a, blur, col] of [[18 * m, 0.14, 28, CL.neon], [10 * m, 0.3, 16, CL.neon], [5 * m, 1, 8, CL.neon], [1.8 * m, 0.95, 0, '#FFE9F0']]) {
    c.globalAlpha = a * flick; c.shadowBlur = blur; c.strokeStyle = col; c.lineWidth = lw; path(); c.stroke();
  }
  c.restore();
}
function cornerMark(c, V, A, B, r, g, idx, m) {
  const a = Math.atan2(A[1] - V[1], A[0] - V[0]), b = Math.atan2(B[1] - V[1], B[0] - V[0]);
  let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
  const e = a + d * g, ccw = d < 0;
  c.save(); c.fillStyle = rgba(CL.gold, 0.3); c.strokeStyle = CL.gold; c.lineWidth = 3 * m; c.shadowColor = CL.gold; c.shadowBlur = 8; c.lineCap = 'round';
  c.beginPath(); c.moveTo(V[0], V[1]); c.arc(V[0], V[1], Math.max(0, r), a, e, ccw); c.closePath(); c.fill();
  c.beginPath(); c.arc(V[0], V[1], Math.max(0, r), a, e, ccw); c.stroke(); c.restore();
  if (g > 0.6) {
    const mid = a + d / 2, bx = V[0] + Math.cos(mid) * (r + 17 * m), by = V[1] + Math.sin(mid) * (r + 17 * m), sc = ease(ramp(g, 0.6, 1));
    c.save(); c.translate(bx, by); c.scale(sc, sc);
    c.fillStyle = CL.gold; c.strokeStyle = CL.bg; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, 11 * m, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = CL.bg; c.font = `900 ${Math.round(14 * m)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(idx + 1), 0, 1);
    c.restore();
  }
}
function drawNeon(c, w, h, t) {
  const m = scaleOf(w), C_ = S.c, si = C_.s - 1, shape = SHAPES[si];
  plate(c, w, h, t);
  const px = 0.06 * w, py = 0.05 * h, pw = w - px * 2, ph = h - py * 2;
  const pg = c.createLinearGradient(0, py, 0, py + ph); pg.addColorStop(0, '#151B45'); pg.addColorStop(1, '#0B1029');
  c.fillStyle = pg; c.strokeStyle = 'rgba(255,143,177,.3)'; c.lineWidth = 2; c.beginPath(); c.roundRect(px, py, pw, ph, 18); c.fill(); c.stroke();
  const wash = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.min(pw, ph) * 0.7); wash.addColorStop(0, rgba(CL.neon, 0.14)); wash.addColorStop(1, rgba(CL.neon, 0));
  c.fillStyle = wash; c.beginPath(); c.roundRect(px, py, pw, ph, 18); c.fill();
  c.fillStyle = 'rgba(190,205,255,.35)';
  for (const [bx, by] of [[px + 12, py + 12], [px + pw - 12, py + 12], [px + 12, py + ph - 12], [px + pw - 12, py + ph - 12]]) { c.beginPath(); c.arc(bx, by, 3, 0, TAU); c.fill(); }
  const s = Math.min(pw, ph) * 0.92, ox = w / 2 - s / 2, oy = h / 2 - s / 2, map = ([fx, fy]) => [ox + fx * s, oy + fy * s];
  const flick = 0.96 + 0.04 * Math.sin(t * 9);
  for (const st of shape.strokes) neonStroke(c, st.map(map), m, flick);
  if (C_.rev) {
    const n = shape.corners.length, k = Math.min(n, 1 + Math.floor((t - C_.revAt) / 0.75));
    if (k > C_.shown) { C_.shown = k; sfx.tick(); }
    shape.corners.forEach((cn, i) => {
      if (i >= k) return;
      const g = ease(clamp01((t - C_.revAt - i * 0.75) / 0.4));
      cornerMark(c, map(cn.v), map(cn.a), map(cn.b), s * 0.07, g, i, m);
    });
  }
}
function drawCorner(c, w, h, t) { if (S.c.s === 0) drawFan(c, w, h, t); else drawNeon(c, w, h, t); }

// --- the loop and the canvas taps ------------------------------------------------------------------------------------------
const loop = canvasLoop($('cv'), (c, w, h, dt, t) => {
  c.globalAlpha = 1; c.shadowBlur = 0; c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'zoom') { if (S.sec === 'moon') drawMoonSecret(c, w, h, t); else if (S.sec === 'dots') drawDotsSecret(c, w, h, t); else drawZoom(c, w, h, t); }
  else if (v === 'kinds') drawKinds(c, w, h, t);
  else drawCorner(c, w, h, t);
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, { w, h } = loop.size();
  if (lab.view === 'zoom' && S.sec === 'dots') {
    const i = hitDot(x, y, w, h); if (i < 0) return;
    const d = S.dots;
    if (d.a < 0 || d.b >= 0) { d.a = i; d.b = -1; sfx.click(); }
    else if (i !== d.a) { d.b = i; d.at = now(); sfx.snap(); }
    render();
  } else if (lab.view === 'kinds' && S.n.free) {
    const i = hitDot(x, y, w, h); if (i < 0) return;
    const N = S.n;
    if (N.pts.length >= 2) { N.pts = [i]; sfx.click(); }
    else if (N.pts[0] !== i) { N.pts.push(i); if (N.pts.length === 2) { N.drawAt = now(); sfx.snap(); } else sfx.click(); }
  }
});

// --- controls --------------------------------------------------------------------------------------------------------------------
const showStage = () => { // on a phone the controls sit below the canvas: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function resetZoom() {
  Object.assign(S, { zStep: 0, zPick: null, arrow1At: Infinity, arrow2At: Infinity, chalk1At: Infinity, chalk2At: Infinity, devAt: Infinity, sec: null });
  startTween(0, 1200);
}
function answer(i) {
  const v = lab.view;
  if (v === 'zoom') {
    if (S.zPick !== null || (S.zStep !== 0 && S.zStep !== 2)) return;
    S.zPick = i; (i === 2 ? sfx.good : sfx.bad)();
    if (S.zStep === 0) { S.zStep = 1; S.arrow1At = now(); startTween(1, 6000, () => { S.chalk1At = now(); }); }
    else { S.zStep = 3; S.arrow2At = now(); startTween(1, 5500, () => { S.chalk2At = now(); }); }
  } else if (v === 'kinds') {
    const N = S.n; if (N.rev) return;
    N.pick = i; N.rev = true; N.revAt = now(); (i === OK_KIND[N.i] ? sfx.good : sfx.bad)();
    if (N.i === 2) N.done = true;
  } else {
    const C_ = S.c; if (C_.rev) return;
    C_.pick = i; C_.rev = true; C_.revAt = now(); C_.shown = 0; (i === (C_.s === 0 ? 1 : OK_ANG[C_.s - 1]) ? sfx.good : sfx.bad)();
  }
  render(); showStage();
}
function nextStep() {
  const v = lab.view;
  if (v === 'zoom' && S.zStep === 1) { S.zStep = 2; S.zPick = null; S.devAt = now() + 1; startTween(0, 1400); }
  else if (v === 'kinds') {
    const N = S.n;
    if (N.i < 2) { N.i++; N.pick = null; N.rev = false; }
    else { N.free = true; N.kind = 0; N.pts = []; N.pick = null; N.rev = false; }
  } else if (v === 'corner') { const C_ = S.c; C_.s++; C_.pick = null; C_.rev = false; C_.shown = 0; }
  sfx.click(); render();
}
function againStep() {
  const v = lab.view;
  if (v === 'zoom') resetZoom();
  else if (v === 'kinds') S.n = { i: 0, pick: null, rev: false, revAt: 0, done: false, free: false, kind: 0, pts: [], drawAt: 0 };
  else S.c = { s: 0, pick: null, rev: false, revAt: 0, shown: 0 };
  sfx.click(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const o = ev.target.closest('.ry-opt');
  if (o && !o.disabled) return answer(+o.dataset.i);
  if (ev.target.closest('[data-next]')) return nextStep();
  if (ev.target.closest('[data-act=again]')) return againStep();
  const k = ev.target.closest('[data-kind]');
  if (k) { S.n.kind = +k.dataset.kind; S.n.drawAt = now(); sfx.click(); return render(); }
  const sc = ev.target.closest('[data-sec]');
  if (sc) {
    if (!secret.unlocked()) return secret.open();
    const key = sc.dataset.sec;
    if (S.sec === key) { S.sec = null; S.rKey = ''; }
    else {
      S.sec = key; S.timerTxt = '';
      if (key === 'moon') { S.tw = null; S.twId++; S.busy = false; S.z = 0.75; S.moonT0 = now(); }
      else S.dots = { a: -1, b: -1, at: 0 };
    }
    sfx.click(); render(); showStage();
  }
});
$('zs').addEventListener('input', (ev) => {
  if (ev.target.disabled) return;
  S.z = +ev.target.value / 100;
});

// --- one render per change: the question or the buttons, the readout and the state card --------------------------------------------
function askHTML({ lead, q, opts, ok, pick, text, textOn, next }) {
  const t = T[lang], rev = pick !== null;
  return `<div class="ry-ask">${lead ? `<div class="ry-lead">${esc(lead)}</div>` : ''}<div class="ry-q">${esc(q)}</div>
    <div class="ry-opts">${opts.map((o, i) => `<button class="ry-opt${rev ? (i === ok ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-i="${i}"${rev ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>
    ${rev ? `<div class="ry-verdict ${pick === ok ? 'ok' : 'no'}">${esc(pick === ok ? t.right : t.wrong)}</div>${textOn ? `<p class="ry-why">${esc(text)}</p>` : ''}${next && textOn ? `<div class="ry-next"><button class="btn" data-next>${esc(t.next)}</button></div>` : ''}` : ''}</div>`;
}
const setCard = (cd) => lab.setState({ emo: cd[0], title: cd[1], lead: cd[2], body: cd[3], extra: '' });
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('ryZoomUI').style.display = v === 'zoom' ? '' : 'none';
  $('ryKindUI').style.display = v === 'kinds' && S.n.free ? '' : 'none';
  if (v === 'zoom') renderZoom(t); else if (v === 'kinds') renderKinds(t); else renderCorner(t);
}
function renderZoom(t) {
  const st = S.zStep, done = st === 3, open = st === 0 || st === 2, zz = t.z;
  $('ryAsk').innerHTML = S.sec ? '' : askHTML({ q: st >= 2 ? zz.q2 : zz.q1, opts: st >= 2 ? zz.o2 : zz.o1, ok: 2, pick: S.zPick, text: st === 1 ? zz.r1 : zz.r2, textOn: !S.busy, next: st === 1 });
  const zs = $('zs');
  zs.disabled = open || S.busy || !!S.sec; $('rySl').classList.toggle('off', zs.disabled);
  if (!S.tw) zs.value = Math.round(S.z * 100);
  zs.setAttribute('aria-label', t.scale[Math.round(S.z * 4)]);
  $('zEnds').innerHTML = t.scale.map((s) => `<span>${esc(s)}</span>`).join('');
  const un = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${un ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${un ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('ryChips').innerHTML = done ? sc('moon', '🌙') + sc('dots', '📍') + `<button class="chip" data-act="again">${esc(t.again)}</button>` : '';
  if (S.sec === 'moon') { lab.setReadout('', '', '', CL.laser); S.timerTxt = ''; lab.setState({ emo: '🌙', title: t.secrets.moon[0], lead: t.sec.moonText, body: '', extra: '' }); }
  else if (S.sec === 'dots') {
    lab.setReadout(S.dots.b >= 0 ? '1' : '∞', '', '', CL.gold);
    lab.setState({ emo: '📍', title: t.secrets.dots[0], lead: t.sec.dotsText, body: '', extra: '' });
  } else { zoomReadout(curZ(now()), true); setCard(t.cards.zoom[done ? 1 : 0]); }
}
function renderKinds(t) {
  const N = S.n, n = t.n, names = [t.seg, t.ray, t.line];
  if (N.free) {
    $('ryAsk').innerHTML = '';
    $('kHint').textContent = n.draw;
    $('kBtns').innerHTML = names.map((s, i) => `<button class="chip ${i === N.kind ? 'on' : ''}" data-kind="${i}">${esc(s)}</button>`).join('') + `<button class="chip" data-act="again">${esc(t.again)}</button>`;
    lab.setReadout(esc(names[N.kind]), '', '', CL.gold);
  } else {
    $('ryAsk').innerHTML = askHTML({ lead: n.obj[N.i], q: n.q, opts: n.o, ok: OK_KIND[N.i], pick: N.pick, text: n.why[N.i], textOn: true, next: true });
    lab.setReadout(`${N.i + 1}/3`, N.rev ? names[OK_KIND[N.i]] : '', '', CL.gold);
  }
  setCard(t.cards.kinds[N.done || N.free ? 1 : 0]);
}
function renderCorner(t) {
  const C_ = S.c, c = t.c, last = C_.s === 3;
  const q1 = C_.s === 0, ok = q1 ? 1 : OK_ANG[C_.s - 1];
  const html = askHTML({ lead: q1 ? '' : c.shapes[C_.s - 1], q: q1 ? c.q1 : c.q, opts: q1 ? c.o1 : c.o[C_.s - 1], ok, pick: C_.pick, text: q1 ? c.r1 : c.why[C_.s - 1], textOn: true, next: !last });
  $('ryAsk').innerHTML = html + (last && C_.rev ? `<div class="ry-next"><button class="btn" data-act="again">${esc(t.again)}</button></div>` : '');
  const num = q1 ? '2' : [2, 4, 3][C_.s - 1];
  lab.setReadout(C_.rev ? String(num) : '?', '', '', CL.neon);
  setCard(t.cards.corner[last && C_.rev ? 1 : 0]);
}
render();
</script>
