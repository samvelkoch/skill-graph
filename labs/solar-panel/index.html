// --- the secret pictures: a 24-hour graph ------------------------------------------------------------------
function drawNight(c, time) {
  const t = T[lang], nd = S.batt ? NIGHT.on : NIGHT.off, gx = 38, gy = 62, gw = 340, gh = 280, N = nd.solar.length, MAXY = 320;
  const X = (i) => gx + i / (N - 1) * gw, Y = (p) => gy + gh * (1 - p / MAXY);
  card(c, 6, 6, 388, 408, 16);
  // night hours
  c.fillStyle = 'rgba(40,50,110,.35)'; c.fillRect(gx, gy, gw * 6 / 24, gh); c.fillRect(gx + gw * 18 / 24, gy, gw * 6 / 24, gh);
  txt(c, '🌙', gx + gw * 3 / 24, gy + 16, 18, '#fff'); txt(c, '🌙', gx + gw * 21 / 24, gy + 16, 18, '#fff');
  c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1; for (let h = 0; h <= 24; h += 6) { c.beginPath(); c.moveTo(gx + gw * h / 24, gy); c.lineTo(gx + gw * h / 24, gy + gh); c.stroke(); }
  // battery charge
  if (S.batt) {
    c.beginPath(); c.moveTo(X(0), gy + gh); nd.soc.forEach((s, i) => c.lineTo(X(i), gy + gh - 70 * s / BATT)); c.lineTo(X(N - 1), gy + gh); c.closePath();
    c.fillStyle = 'rgba(61,220,151,.22)'; c.fill(); c.strokeStyle = 'rgba(61,220,151,.8)'; c.lineWidth = 2; c.stroke();
  }
  // solar output
  c.beginPath(); c.moveTo(X(0), gy + gh); nd.solar.forEach((s, i) => c.lineTo(X(i), Y(s))); c.lineTo(X(N - 1), gy + gh); c.closePath();
  const sg = c.createLinearGradient(0, Y(PEAK), 0, gy + gh); sg.addColorStop(0, 'rgba(255,201,60,.85)'); sg.addColorStop(1, 'rgba(255,150,40,.25)'); c.fillStyle = sg; c.fill();
  // the gap: the part of the home's use nothing covers
  c.beginPath(); nd.use.forEach((u, i) => (i ? c.lineTo(X(i), Y(u)) : c.moveTo(X(i), Y(u)))); for (let i = N - 1; i >= 0; i--) c.lineTo(X(i), Y(nd.use[i] - nd.unmet[i])); c.closePath();
  c.fillStyle = 'rgba(229,72,77,.78)'; c.fill();

  c.beginPath(); nd.use.forEach((u, i) => (i ? c.lineTo(X(i), Y(u)) : c.moveTo(X(i), Y(u)))); c.strokeStyle = '#e8eeff'; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(gx, gy); c.lineTo(gx, gy + gh); c.lineTo(gx + gw, gy + gh); c.stroke();

  txt(c, t.nt.hr, gx + gw / 2, gy + gh + 34, 13, '#98A0B8', 'center', 700);
  txt(c, `${PEAK} ${t.u.w}`, gx - 2, gy - 8, 13, '#98A0B8', 'left', 700);
  // legend

  [['#ffc93c', t.nt.sol], ['#e8eeff', t.nt.use], ['#e5484d', t.nt.gap]].forEach(([col, s]) => {
    c.fillStyle = col; rr(c, lx, 22, 12, 12, 3); c.fill(); c.font = FONT(13); const w = c.measureText(s).width; txt(c, s, lx + 17, 29, 13, '#C6CDE0', 'left'); lx += w + 38;
  });
  if (S.batt) { c.fillStyle = '#3ddc97'; rr(c, lx, 22, 12, 12, 3); c.fill(); txt(c, '🔋', lx + 17, 29, 13, '#C6CDE0', 'left'); }
  void time;
}

// --- the loop ---------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const s = Math.min(w / DW, h / DH); V.s = s; V.ox = (w - DW * s) / 2; V.oy = (h - DH * s) / 2;
  const g = tgt(), info = shadeInfo(), wv = wireVals();
  D.e = ease(D.e, g.e, dt, 8); D.tilt = ease(D.tilt, g.th, dt, 8);
  D.frac = ease(D.frac, power(D.e, D.tilt) / PEAK, dt, 8);
  D.rev = ease(D.rev, S.pred.shade === null ? 0 : 1, dt, 4);
  const seen = S.pred.shade !== null; // before the guess the panel is not shown as held back
  for (let k = 0; k < 3; k++) D.str[k] = ease(D.str[k], seen && info.dead[k] ? 0 : 1, dt, 7);
  D.shF = ease(D.shF, seen ? info.P / PEAK : 1, dt, 7);
  D.V = ease(D.V, wv.V, dt, 5); D.I = ease(D.I, wv.I, dt, 5); D.wf = ease(D.wf, wv.on ? 1 : 0, dt, 12);
  D.fanS = ease(D.fanS, wv.V >= 1.5 ? 12 : 0, dt, 2.5); D.fanA += D.fanS * dt;
  D.lamp = ease(D.lamp, wv.on ? Math.min(1, wv.I / 4) : 0, dt, 5);
  c.save(); c.translate(V.ox, V.oy); c.scale(s, s);
  const v = lab.view, asking = S.pred[v] === null;
  if (S.sec === 'night') drawNight(c, time);
  else if (v === 'tilt') drawTilt(c, time, asking);
  else if (v === 'shade') drawShade(c, time, asking);
  else drawWire(c, time, asking);
  c.restore();
});

    S.sec = S.sec === k ? null : k; sfx.click();
  } else if (act === 'city') { S.city = +k; sfx.click(); }
  else if (act === 'batt') { S.batt = !S.batt; sfx.click(); }
  else if (act === 'shape') { S.shape = k; S.fresh.shade = false; sfx.click(); }
  else if (act === 'mode') { S.mode = k; S.fresh.wire = false; sfx.click(); }
  render();
});
// dragging the shadow over the panel
const cv = $('cv'); let dragging = false, lastN = -1;
const toDesign = (ev) => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left - V.ox) / V.s, y: (ev.clientY - r.top - V.oy) / V.s }; };
const moveShadow = (ev) => {
  const p = toDesign(ev), lift = ev.pointerType === 'touch' ? 34 : 0; // on a phone the shadow rides above the finger
  S.sh.x = clamp(p.x, 14, DW - 14); S.sh.y = clamp(p.y - lift, 14, SKY[1] + SKY[3] - 14); S.fresh.shade = false;
  const n = shadeInfo().n; if (n !== lastN) { if (lastN >= 0 && n > lastN) sfx.tick(); lastN = n; } render();
};
cv.addEventListener('pointerdown', (ev) => { if (lab.view !== 'shade' || S.sec || S.pred.shade === null) return; dragging = true; cv.setPointerCapture(ev.pointerId); moveShadow(ev); });
cv.addEventListener('pointermove', (ev) => { if (dragging) moveShadow(ev); });
['pointerup', 'pointercancel'].forEach((n) => cv.addEventListener(n, () => { dragging = false; }));

// --- one render per change: controls, readout and the state card ------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, asking = S.pred[v] === null, u = t.u;
  cv.style.touchAction = v === 'shade' && !asking && !S.sec ? 'none' : 'pan-y';
  $('ask').hidden = !asking;
  $('secTilt').hidden = asking || v !== 'tilt'; $('secShade').hidden = asking || v !== 'shade'; $('secWire').hidden = asking || v !== 'wire';
  if (asking) {
    $('ask').innerHTML = `<div class="q">${esc(t.q[v])}</div><div class="opts">${t.opts[v].map((o, i) => `<button type="button" data-a="${i}">${esc(o)}</button>`).join('')}</div>`;
    lab.setReadout('?', '', '', '#f5c84c'); lab.setGlow('rgba(255, 200, 80, .26)');
    lab.setState({ emo: '🤔', title: t.q[v], lead: '', body: '' }); lab.setFacts([]);
    return;
  }
  lab.setGlow('rgba(255, 200, 80, .26)');
  const verdictHead = (vv) => `${S.pred[vv] === t.ok[vv] ? t.right : t.wrong} `;
  if (v === 'tilt') renderTilt(t, u, verdictHead);
  else if (v === 'shade') renderShade(t, u, verdictHead);
  else renderWire(t, u, verdictHead);
}
function renderTilt(t, u, vh) {
  const tl = t.tl;
  $('slWrap').hidden = !!S.sec;
  $('rT').value = S.tilt; $('rS').value = S.e; $('lT').textContent = tl.tilt; $('lS').textContent = tl.sun;
  $('vT').textContent = `${S.tilt}°`; $('vS').textContent = `${S.e}°`;
  $('eT0').textContent = `0° ${tl.flat}`; $('eT1').textContent = `${tl.up} 90°`; $('eS0').textContent = `10° ${tl.low}`; $('eS1').textContent = `${tl.high} 70°`;
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('city', '🌍') + sc('night', '🔋');
  $('secOpts').hidden = !S.sec;
  if (S.sec === 'city') $('secOpts').innerHTML = CITIES.map((c, i) => `<button class="chip ${S.city === i ? 'on' : ''}" data-act="city" data-k="${i}">${esc(c.n[lang])}</button>`).join('');
  else if (S.sec === 'night') $('secOpts').innerHTML = `<button class="chip ${S.batt ? 'on' : ''}" data-act="batt">${esc(t.nt.batt)}</button>`;
  if (S.sec === 'night') {
    const nd = S.batt ? NIGHT.on : NIGHT.off;
    lab.setReadout(`${nd.pct}%`, t.nt.sub, S.batt ? t.nt.pill1 : t.nt.pill0, '#ffc93c');
    lab.setState({ emo: '🌙', title: S.batt ? t.nt.title1 : t.nt.title0, lead: S.batt ? t.nt.lead1(nd.pct, num(BATT / 1000, 1)) : t.nt.lead0(nd.pct), body: '' });
    lab.setFacts([]); return;
  }
  const g = tgt(), P = Math.round(power(g.e, g.th)), a = Math.round(angleTo(g.e, g.th)), cs = num(Math.cos(rad(a)));
  if (S.sec === 'city') {
    const city = CITIES[S.city], flat = Math.round(power(g.e, 0));
    lab.setReadout(`${P} ${u.w}`, t.ct.sub(flat), t.ct.pill(num(city.lat, 1)), '#ffc93c');
    lab.setState({ emo: '🌍', title: t.ct.title(city.n[lang]), lead: t.ct.lead(num(city.lat, 1), num(g.e, 1), city.lat), body: t.ct.body(flat, city.lat) });
    lab.setFacts([]); return;
  }
  lab.setReadout(`${P} ${u.w}`, tl.sub(a), tl.pill(Math.round(P / PEAK * 100)), '#ffc93c');
  if (S.fresh.tilt) {
    lab.setState({ emo: S.pred.tilt === t.ok.tilt ? '🎉' : '☀️', title: vh('tilt').trim(), lead: tl.verdict(E0, Math.round(power(E0, 0)), Math.round(power(E0, 90 - E0)), Math.round(power(E0, 90))), body: '' });
  } else lab.setState({ emo: '☀️', title: tl.title(a), lead: tl.lead(a, cs, P), body: tl.body(Math.round(90 - S.e), S.e) });
  lab.setFacts([{ emo: '💡', text: t.facts.tilt.text, src: t.facts.tilt.src }]);
}
function renderShade(t, u, vh) {
  const sh = t.sh, info = shadeInfo();
  $('shChips').innerHTML = [['leaf', sh.leaf], ['chimney', sh.chimney]].map(([k, l]) => `<button class="chip ${S.shape === k ? 'on' : ''}" data-act="shape" data-k="${k}">${esc(l)}</button>`).join('');
  $('shHint').textContent = sh.hint;
  lab.setReadout(`${info.P} ${u.w}`, sh.sub(info.n), sh.pill(info.k), '#ffc93c');
  if (S.fresh.shade) lab.setState({ emo: S.pred.shade === t.ok.shade ? '🎉' : '🍃', title: vh('shade').trim(), lead: sh.verdict, body: '' });
  else lab.setState({ emo: '🍃', title: sh.title(info.k), lead: sh.lead(info.k), body: sh.body(info.k, info.P) });
  lab.setFacts([{ emo: '💡', text: t.facts.shade.text, src: t.facts.shade.src }]);
}
function renderWire(t, u, vh) {
  const wr = t.wr, w = wireVals();
  $('wrChips').innerHTML = [['series', wr.series], ['parallel', wr.parallel]].map(([k, l]) => `<button class="chip ${S.mode === k ? 'on' : ''}" data-act="mode" data-k="${k}">${esc(l)}</button>`).join('');
  $('wrHint').textContent = wr.hint;
  lab.setReadout(`${num(w.V, 1)} ${u.v} · ${w.I} ${u.a}`, `= ${num(w.P, 1)} ${u.w}`, wr.pill(S.mode), '#ffc93c');
  if (S.fresh.wire) lab.setState({ emo: S.pred.wire === t.ok.wire ? '🎉' : '🔌', title: vh('wire').trim(), lead: wr.verdict, body: '' });
  else lab.setState({ emo: '🔌', title: wr.title(S.mode), lead: wr.lead(S.mode), body: wr.body });
  lab.setFacts([{ emo: '💡', text: t.facts.wire.text, src: t.facts.wire.src }]);
}
render();
