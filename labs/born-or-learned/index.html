  sky(c, '#2a4a7a', '#cfe0ee', 238, '#6aa05a', '#386a30');
  c.fillStyle = 'rgba(40,90,60,.5)'; c.beginPath(); c.moveTo(-100, 238); c.quadraticCurveTo(100, 205, 240, 236); c.quadraticCurveTo(330, 215, 460, 238); c.lineTo(460, 280); c.lineTo(-100, 280); c.fill();
  const first = d.first, alt = first === 'mother' ? 'ball' : 'mother', gy = 262;
  let el = -1;
  if (d.run) { el = Math.max(0, t - d.run.start); if (el > DUCK_T) { d.run = null; d.fin = true; d.rev = true; render(); } }
  if (!d.run && d.fin) el = DUCK_T + 1;
  const base = [176, 202, 228];
  let fx, ax, dx, face = -1, mv = false, am = false;
  if (el < 0) { fx = 60; ax = 300; dx = base; face = Math.sin(t * 0.7) > 0 ? 1 : -1; }
  else {
    const a = ease(el / 2.4), b = ease((el - 2.4) / 1.2), s = ease((el - 3.6) / 4.0);
    fx = lerpN(-30, 100, a); fx = lerpN(fx, 24, s);
    ax = lerpN(400, 280, b); ax = lerpN(ax, 342, s);
    const lead = lerpN(176, 66, s) - a * 6 * (1 - s);
    dx = base.map((bx, i) => lerpN(bx - a * 6, lead + i * 27, s));
    mv = el < 2.4 || (el > 3.6 && el < 7.6); am = el > 3.4 && el < 7.8;
  }
  const dr = [{ k: first, x: fx, f: 1 }, { k: alt, x: ax, f: -1 }];
  if (el >= 0 && el > 3.6) dr[1].f = 1;
  dr.sort((p, q) => p.x - q.x);
  [dr[0]].forEach((o) => objDraw(c, o.k, o.x, gy, t, o.k === first ? mv : am, o.k === first ? (el > 3.6 ? -1 : 1) : o.f));
  dx.forEach((px, i) => duckling(c, px, gy + (i % 2) * 4 - 2, face, t, i, 1.15));
  objDraw(c, dr[1].k, dr[1].x, gy, t, dr[1].k === first ? mv : am, dr[1].k === first ? (el > 3.6 ? -1 : 1) : dr[1].f);
  if (el < 0) { LB(K.objs[first], 60, 205); LB(K.objs[alt], 300, 205); }
}
const LANE = [90, 270];
function sceneDogs(c, t) {
  const d = S.dog, K = T[lang].dog;
  sky(c, '#2c3a5e', '#8aa7c0', 150, '#6f9a5a', '#3b6232');
  c.fillStyle = 'rgba(10,14,28,.3)'; c.fillRect(178, 0, 2, DH);
  let el = -1;
  if (d.run && d.plan) { el = Math.max(0, t - d.run.start); if (el >= ROUNDS * ROUND) { d.run = null; d.fin = true; d.rev = true; render(); } }
  const R = d.plan ? d.plan.P : null, final = !d.run && d.fin;
  for (let L = 0; L < 2; L++) {
    const cx = LANE[L];
    LB(K.lanes[L], cx, 16);
    let pose = 'stand', p = [0.25, 0.25, 0.25, 0.25], treat = null, click = 0;
    if (R && el >= 0) {
      const r = Math.min(ROUNDS - 1, Math.floor(el / ROUND)), lt = (el - r * ROUND) / ROUND, [a, a2] = d.plan.poses[L][r];
      pose = POSES[lt < 0.5 ? a : a2];
      const u = ease((lt - 0.55) / 0.45);
      p = d.plan.P[L][r].map((v, i) => lerpN(v, d.plan.P[L][r + 1][i], u));
      if (a === 0) { click = lt > 0.06 && lt < 0.3 ? 1 - (lt - 0.06) / 0.24 : 0; const ts = L === 0 ? 0.1 : 0.7, f = c01((lt - ts) / 0.3); if (f > 0 && f < 1) treat = f; }
    } else if (R && final) { pose = 'stand'; p = d.plan.P[L][ROUNDS]; }
    dog(c, cx - 10, 150, pose, t, 0.8);
    if (click) { c.strokeStyle = `rgba(255,220,90,${click})`; c.lineWidth = 2.5; c.beginPath(); c.arc(cx + 6, 52, 8 + (1 - click) * 14, 0, TAU); c.stroke(); }
    if (treat !== null) { const tx = lerpN(cx + 70, cx + 20, treat), ty = lerpN(30, 96, treat) - Math.sin(treat * Math.PI) * 24; c.save(); c.translate(tx, ty); c.rotate(treat * 4); c.fillStyle = '#c98a45'; c.beginPath(); c.roundRect(-7, -4.5, 14, 9, 3); c.fill(); c.strokeStyle = '#6b3a14'; c.lineWidth = 1; c.stroke(); c.restore(); }
    // bars
    for (let i = 0; i < 4; i++) {
      const by = 192 + i * 28, bx = cx - 78;
      LB(K.rows[i], bx, by + 8, 'left', '#fff', false);
      c.fillStyle = 'rgba(255,255,255,.12)'; c.beginPath(); c.roundRect(bx + 56, by, 96, 15, 7); c.fill();
      c.fillStyle = i === 0 ? '#6fd08c' : '#8895b8'; c.beginPath(); c.roundRect(bx + 56, by, Math.max(6, 96 * p[i]), 15, 7); c.fill();
      if (i === 0 || p[i] > 0.4) LB(`${Math.round(p[i] * 100)}%`, bx + 56 + Math.max(6, 96 * p[i]) - 2, by + 8, 'right', '#10131f', false);
    }
  }
}
function drawLearn(c, t) { if (S.sub === 'duck') sceneDuck(c, t); else sceneDogs(c, t); }

// --- drawing: the two secret scenes ------------------------------------------------------------------------
const ADULT = [3, 5, 2, 6, 4, 5, 1, 6, 3, 4, 2, 5], PLAIN = [3, 3, 3, 4, 3, 3, 3, 4, 3, 3, 3, 4];
function staff(c, x, y, seq, col, ph, label) {
  c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 1; for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(x, y + i * 12); c.lineTo(x + 176, y + i * 12); c.stroke(); }
  seq.forEach((h, i) => note(c, x + 14 + i * 14, y + 48 - h * 6, col, ph > i / seq.length ? 1 : 0.3));
  LB(label, x + 88, y - 16);
}
function sceneSong2(c, t) {
  const K = T[lang].song, tutor = S.songM === 0;
  sky(c, '#1c2b55', '#4c6f98', 270, '#1f3a3a', '#0f2222');
  const ph = (t * 0.25) % 1.4, open = Math.sin(t * 9) > 0 ? 1 : 0.2;
  c.strokeStyle = '#4a3626'; c.lineWidth = 8; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-10, 112); c.quadraticCurveTo(70, 104, 150, 114); c.stroke(); c.beginPath(); c.moveTo(-10, 252); c.quadraticCurveTo(70, 244, 150, 254); c.stroke();
  songbird(c, 70, 84, 0.85, ph < 1 ? open : 0, '#c98d68');
  if (tutor) songbird(c, 70, 224, 0.85, ph < 1 ? open : 0, '#d9a07a'); else songbird(c, 70, 224, 0.85, ph < 1 ? open : 0, '#b9a58d');
  staff(c, 160, 54, ADULT, '#f2c14e', ph, K.strips[0]);
  staff(c, 160, 194, tutor ? ADULT : PLAIN, tutor ? '#f2c14e' : '#8aa3c4', ph, K.strips[1]);
  if (!tutor) { c.fillStyle = 'rgba(10,14,28,.55)'; c.beginPath(); c.roundRect(14, 56, 132, 62, 12); c.fill(); LB('🔇', 80, 88); }
}
function sceneFish(c, t) {
  const K = T[lang].fish, r = S.fishR, el = Math.max(0, t - S.secT0);
  c.fillStyle = lin(c, 0, -80, 0, 270, [[0, '#0e3b4a'], [1, '#1b6b7a']]); c.fillRect(-600, -400, 1560, 670);
  c.fillStyle = lin(c, 0, 270, 0, DH + 60, [[0, '#7a6a52'], [1, '#4a3f30']]); c.fillRect(-600, 270, 1560, 300);
  c.fillStyle = 'rgba(255,255,255,.05)'; [[40, 80], [140, 40], [260, 90]].forEach(([x, w]) => { c.beginPath(); c.moveTo(x, -20); c.lineTo(x + w, -20); c.lineTo(x + w - 70, 270); c.lineTo(x - 90, 270); c.fill(); });
  c.strokeStyle = '#2f7d4d'; c.lineWidth = 3; c.lineCap = 'round'; [20, 330, 350].forEach((x, i) => { c.beginPath(); c.moveTo(x, 280); c.quadraticCurveTo(x + 14 * Math.sin(t + i), 240, x - 4, 200 - i * 10); c.stroke(); });
  const rate = [(0.3 + 1.6 * 0.55) * 0.6, (0.3 + 1.6 * r) * 0.6], ty = [96, 226];
  let dxm = 0, dym = 0;
  rate.forEach((rt, i) => { const ph = (el * rt) % 1, pulse = ph < 0.3 ? Math.sin(ph / 0.3 * Math.PI) : 0; dxm += pulse * 70; dym += pulse * (ty[i] - 160) * 0.55; });
  fish(c, 80 + dxm, 160 + dym, 1.25, 1, 0.9, false, t);
  fish(c, 275, ty[0], 1.15, -1, 0.55, false, t + 1); fish(c, 275, ty[1], 1.15, -1, r, true, t + 2);
  [0, 1].forEach((i) => { LB(K.names[i], 275, ty[i] - 40); LB(`${Math.floor(el * rate[i])} ${K.unit}`, 275, ty[i] + 38); });
}
function drawSecret(c, t) { if (S.sec === 'song') sceneSong2(c, t); else sceneFish(c, t); }

// --- main loop ---------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  LBL = [];
  const s = Math.min(w / DW, h / DH), ox = (w - DW * s) / 2, oy = (h - DH * s) / 2;
  c.save(); c.translate(ox, oy); c.scale(s, s); c.lineJoin = 'round';
  if (S.sec) drawSecret(c, time); else if (lab.view === 'sort') drawSort(c, time); else if (lab.view === 'trig') sceneTrig(c, time); else drawLearn(c, time);
  c.restore(); c.globalAlpha = 1;
  c.font = '800 12.5px Nunito, system-ui, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left';
  for (const L of LBL) {
    const X = ox + L.x * s, Y = oy + L.y * s, tw = c.measureText(L.t).width, pw = tw + (L.pill ? 16 : 0), ph = 20;
    let x0 = L.al === 'center' ? X - pw / 2 : L.al === 'left' ? X : X - pw;
    x0 = clamp(x0, 6, Math.max(6, w - 6 - pw)); const y0 = clamp(Y - ph / 2, 4, Math.max(4, h - 4 - ph));
    if (L.pill) { c.fillStyle = 'rgba(10,12,20,.8)'; c.beginPath(); c.roundRect(x0, y0, pw, ph, 10); c.fill(); }
    else { c.lineWidth = 3; c.strokeStyle = 'rgba(8,10,18,.75)'; c.strokeText(L.t, x0, y0 + ph / 2 + 1); }
    c.fillStyle = L.col; c.fillText(L.t, x0 + (L.pill ? 8 : 0), y0 + ph / 2 + 1);
  }
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const optCls = (done, right, mine, j) => (done ? (j === right ? 'good' : j === mine ? 'bad' : 'dim') : '');
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, j = +b.dataset.j, tt = now();
  if (act === 'kind') { const s = S.sort; s.g[s.i] = j; (j === ITEMS[s.i].kind ? sfx.good : sfx.bad)(); }
  else if (act === 'snext') S.sort.i++;
  else if (act === 'sagain') S.sort = { i: 0, g: [] };
  else if (act === 'tguess') { const tr = S.trig; tr.guess = j; tr.phase = 'test'; tr.tally = [0, 0, 0]; tr.lastN = -1; tr.run = { start: tt, order: [0, 1, 2] }; sfx.click(); showStage(); }
  else if (act === 'thold') { const tr = S.trig; tr.run = { start: tt, order: [j] }; tr.lastN = -1; sfx.click(); showStage(); }
  else if (act === 'lsub') { S.sub = b.dataset.s; sfx.click(); }
  else if (act === 'dkguess') { const d = S.duck; d.guess = j; d.phase = 'play'; d.first = 'ball'; d.fin = false; d.rev = false; d.verdict = true; d.run = { start: tt }; sfx.click(); showStage(); }
  else if (act === 'dkfirst') { const d = S.duck; if (d.run) return; d.first = b.dataset.k; d.fin = false; d.verdict = false; sfx.tick(); }
  else if (act === 'dkrun') { const d = S.duck; d.fin = false; d.verdict = false; d.run = { start: tt }; sfx.click(); showStage(); }
  else if (act === 'dgguess') { const d = S.dog; d.guess = j; d.phase = 'play'; d.plan = makePlan(); d.fin = false; d.rev = false; d.verdict = true; d.run = { start: tt }; sfx.click(); showStage(); }
  else if (act === 'dgrun') { const d = S.dog; d.plan = makePlan(); d.fin = false; d.verdict = false; d.run = { start: tt }; sfx.click(); showStage(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) { secret.open(); return; }
    S.sec = S.sec === k ? null : k; S.secT0 = tt; sfx.click();
  } else if (act === 'songm') { S.songM = j; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'fishR') return;
  S.fishR = +ev.target.value / 100; S.secT0 = now(); render();
});

// --- render: controls, readout, state card, facts ----------------------------------------------------------
const GLOW = { sort: 'rgba(143,184,106,.24)', trig: 'rgba(232,84,107,.26)', learn: 'rgba(242,193,78,.24)' };
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  lab.setGlow(GLOW[v] || GLOW.sort);
  const sc = (k, emo, nm) => `<button type="button" class="chip ob-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(nm)}` : '🔒 ???'}</button>`;
  $('bSecs').innerHTML = sc('song', '🎵', t.secrets.song[0]) + sc('fish', '🐟', t.secrets.fish[0]);
  if (S.sec) renderSecret(t); else if (v === 'sort') renderSort(t); else if (v === 'trig') renderTrig(t); else renderLearn(t);
}
const opts = (list, mark, done, right, mine, act, three) => `<div class="ob-opts ${three ? 'three' : ''}">${list.map((o, j) => `<button type="button" class="ob-opt ${done ? optCls(true, right, mine, j) : mark === j ? 'sel' : ''}" data-act="${act}" data-j="${j}" ${done || mark !== null ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;

function renderSort(t) {
  const s = S.sort, n = ITEMS.length, end = s.i >= n, st = t.sort, col = '#8fb86a';
  const score = s.g.filter((g, i) => g === ITEMS[i].kind).length;
  if (end) {
    $('bMain').innerHTML = `<div class="ob-row" style="margin-top:0"><button type="button" class="ob-go" data-act="sagain">${esc(st.again)}</button></div>`;
    lab.setReadout(`${score}/${n}`, '', '', col);
    lab.setState({ emo: '🏆', title: st.endTitle(score, n), lead: st.endLead, body: '', extra: '' }); lab.setFacts(t.facts.sort); return;
  }
  const g = s.g[s.i], done = g !== undefined, it = ITEMS[s.i];
  $('bMain').innerHTML = `<p class="ob-q">${esc(st.items[s.i])}</p>
    <div class="ob-opts three">${t.kinds.map((k, j) => `<button type="button" class="ob-opt ${done ? optCls(true, it.kind, g, j) : ''}" data-act="kind" data-j="${j}" ${done ? 'disabled' : ''}>${esc(k)}</button>`).join('')}</div>
    ${done ? `<div class="ob-row"><button type="button" class="ob-go" data-act="snext">${esc(st.next)}</button></div>` : ''}`;
  lab.setReadout(`${s.i + 1} / ${n}`, st.names[s.i], '', col);
  if (!done) { lab.setState({ emo: '🤔', title: st.q, lead: st.lead, body: '', extra: '' }); lab.setFacts([]); }
  else { const okk = g === it.kind; lab.setState({ emo: okk ? '✅' : '🤔', title: `${okk ? t.ok : t.no} ${t.ans[it.kind]}`, lead: st.reasons[s.i], body: '', extra: '' }); lab.setFacts(t.facts.sort); }
}
function renderTrig(t) {
  const tr = S.trig, x = t.trig, col = '#e8546b', done = tr.phase === 'done', right = 2;
  $('bMain').innerHTML = `<p class="ob-q">${esc(x.q)}</p>${opts(x.opts, tr.phase === 'ask' ? null : tr.guess, done, right, tr.guess, 'tguess', false)}
    ${done ? `<div class="ob-row"><span class="ob-lbl">${esc(x.again)}</span>${x.names.map((nm, k) => `<button type="button" class="chip ob-chip" data-act="thold" data-j="${k}" ${tr.run ? 'disabled' : ''}>${esc(nm)}</button>`).join('')}</div>` : ''}`;
  if (tr.phase === 'ask') { lab.setReadout('?', '', '', col); lab.setState({ emo: '🤔', title: x.q, lead: x.askLead, body: '', extra: '' }); lab.setFacts([]); return; }
  if (tr.phase === 'test') { if (!tr.run) lab.setReadout('?', '', '', col); lab.setState({ emo: '🔬', title: x.runTitle, lead: x.runLead, body: '', extra: '' }); lab.setFacts([]); return; }
  const okk = tr.guess === right;
  if (!tr.run) lab.setReadout(String(Math.max(...tr.tally)), x.unit, '', col);
  lab.setState({ emo: okk ? '✅' : '🤔', title: `${okk ? t.ok : t.no} ${x.resTitle}`, lead: x.resLead, body: x.resBody, extra: '' }); lab.setFacts(t.facts.trig);
}
function renderLearn(t) {
  const col = '#f2c14e', sub = S.sub, tabs = `<div class="ob-row" style="margin-top:0;margin-bottom:12px">${[['duck', t.duck.tab], ['dog', t.dog.tab]].map(([k, l]) => `<button type="button" class="chip ob-chip ${sub === k ? 'on' : ''}" data-act="lsub" data-s="${k}">${esc(l)}</button>`).join('')}</div>`;
  if (sub === 'duck') {
    const d = S.duck, K = t.duck, ask = d.phase === 'ask', right = 0;
    $('bMain').innerHTML = `${tabs}<p class="ob-q">${esc(K.q)}</p>${ask ? opts(K.opts, null, false, right, d.guess, 'dkguess', false) : opts(K.opts, d.guess, d.rev, right, d.guess, 'dkguess', false)}
      ${!d.rev ? '' : `<div class="ob-row"><span class="ob-lbl">${esc(K.firstQ)}</span>${['ball', 'boot', 'mother'].map((k) => `<button type="button" class="chip ob-chip ${d.first === k ? 'on' : ''}" data-act="dkfirst" data-k="${k}" ${d.run ? 'disabled' : ''}>${esc(K.objs[k])}</button>`).join('')}
        <button type="button" class="ob-go" data-act="dkrun" ${d.run ? 'disabled' : ''}>${esc(K.run)}</button></div>`}`;
    if (ask) { lab.setReadout('?', '', '', col); lab.setState({ emo: '🤔', title: K.q, lead: K.askLead, body: '', extra: '' }); lab.setFacts([]); return; }
    if (d.run) { lab.setReadout('…', '', '', col); lab.setState({ emo: '🥚', title: K.watching, lead: K.watchLead, body: '', extra: '' }); lab.setFacts([]); return; }
    if (!d.fin) { lab.setReadout(K.objs[d.first], '', '', col); lab.setState({ emo: '🦆', title: K.idle, lead: K.idleLead, body: '', extra: '' }); lab.setFacts(t.facts.duck); return; }
    const okk = d.guess === right, first = d.first;
    lab.setReadout(K.objs[first], '', '', col);
    lab.setState({ emo: d.verdict ? (okk ? '✅' : '🤔') : '🦆', title: `${d.verdict ? (okk ? t.ok : t.no) + ' ' : ''}${K.res[first]}`, lead: K.resLead, body: K.resBody, extra: '' }); lab.setFacts(t.facts.duck);
  } else {
    const d = S.dog, K = t.dog, ask = d.phase === 'ask', right = 0;
    $('bMain').innerHTML = `${tabs}<p class="ob-q">${esc(K.q)}</p>${ask ? opts(K.opts, null, false, right, d.guess, 'dgguess', false) : opts(K.opts, d.guess, d.rev, right, d.guess, 'dgguess', false)}
      ${!d.rev ? '' : `<div class="ob-row"><button type="button" class="ob-go" data-act="dgrun" ${d.run ? 'disabled' : ''}>${esc(K.run)}</button></div>`}`;
    if (ask) { lab.setReadout('?', '', '', col); lab.setState({ emo: '🤔', title: K.q, lead: K.askLead, body: '', extra: '' }); lab.setFacts([]); return; }
    if (d.run) { lab.setReadout('…', '', '', col); lab.setState({ emo: '🐕', title: K.watching, lead: K.watchLead, body: '', extra: '' }); lab.setFacts([]); return; }
    const pa = Math.round(d.plan.P[0][ROUNDS][0] * 100), pb = Math.round(d.plan.P[1][ROUNDS][0] * 100), okk = d.guess === right;
    lab.setReadout(`${pa}% · ${pb}%`, K.rows[0], '', col);
    lab.setState({ emo: d.verdict ? (okk ? '✅' : '🤔') : '🐕', title: `${d.verdict ? (okk ? t.ok : t.no) + ' ' : ''}${K.resTitle}`, lead: K.resLead(pa, pb), body: K.resBody, extra: '' }); lab.setFacts(t.facts.dog);
  }
}
function renderSecret(t) {
  const col = '#f2c14e';
  if (S.sec === 'song') {
    const K = t.song, tutor = S.songM === 0;
    $('bMain').innerHTML = `<div class="ob-opts">${K.opts.map((o, j) => `<button type="button" class="ob-opt ${S.songM === j ? 'sel' : ''}" data-act="songm" data-j="${j}">${esc(o)}</button>`).join('')}</div>`;
    lab.setReadout(K.val[tutor ? 0 : 1], K.strips[1], '', col);
    lab.setState({ emo: '🎵', title: tutor ? K.tTitle : K.aTitle, lead: tutor ? K.tLead : K.aLead, body: '', extra: '' }); lab.setFacts([]);
  } else {
    const K = t.fish, r = S.fishR;
    $('bMain').innerHTML = `<div class="ob-slide"><span class="ob-lbl" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700">${esc(K.label)}</span>
      <input id="fishR" class="big" type="range" min="0" max="100" value="${Math.round(r * 100)}" style="--track:linear-gradient(90deg,#d9dede,#e0332b)" aria-label="${esc(K.label)}">
      <div class="ends"><span>${esc(K.ends[0])}</span><span>${esc(K.ends[1])}</span></div></div>`;
    lab.setReadout(`${Math.round(r * 100)}%`, K.label, '', '#e0332b');
    lab.setState({ emo: '🐟', title: r > 0.55 ? K.hi : K.lo, lead: K.lead, body: '', extra: '' }); lab.setFacts([]);
  }
}
render();
</script>
