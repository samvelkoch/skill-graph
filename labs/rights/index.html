}
function renderSec(t) {
  const sv = t.sv, sc = t.sc; lab.setFacts([]);
  if (S.sec === 'vote') {
    const voters = (22 - S.vage + 1) * 8;
    $('vs').innerHTML = `<div class="rt-cap">${esc(sv.age)}: ${S.vage}</div><input class="rt-range" id="vage" type="range" min="16" max="21" step="1" value="${S.vage}">
      <div class="rt-row">${sv.chips.map((c, i) => chip('vchip', c[1], esc(c[0]), '', `data-i="${i}"`)).join('')}</div>`;
    lab.setReadout(`${voters}`, sv.sub, '', '#e0b050');
    const note = S.vmsg >= 0 && S.vmsg !== undefined ? sv.chips[S.vmsg][2] : '';
    lab.setState({ emo: '🗳️', title: sv.of(voters, 72), lead: note, body: '', extra: '' });
  } else {
    $('vs').innerHTML = `<div class="rt-row"><button class="btn" data-act="comp">${S.comp ? '✓ ' : ''}${esc(sc.btn)}</button></div>`;
    lab.setReadout(`${Math.round((S.comp ? 0.91 : 0.59) * 100)}%`, sc.turnout, '', '#3ddc97');
    const m = S.comp ? sc.tOn : sc.tOff; lab.setState({ emo: '📮', title: m[0], lead: m[1], body: '', extra: '' });
  }
}
render();
</script>
