    for (const r of [0, 1]) drawBar(ctx, { x0: 20, y: ROW_Y[r], cw: 40, ch: 46, c0: r * 8, notes: g.notes, pos: p, dotGap: 18, dotR: 6.5, r: 14, count: true, sel: g.sel, hover: g.drag ? g.hover : -1, ghost: g.sel !== null, drops: g.drops });
    // the swing meter: one segment for each accent that falls between the beats
    for (let i = 0; i < 6; i++) {
      const x = 51 + i * 44, lit = i < off;
      ctx.save(); if (lit) { ctx.shadowColor = 'rgba(255, 107, 107, .7)'; ctx.shadowBlur = 12; }
      const gr = ctx.createLinearGradient(0, 282, 0, 298); gr.addColorStop(0, lit ? '#ff9a8a' : '#1d2342'); gr.addColorStop(1, lit ? '#ff6b6b' : '#161a32');
      rr(ctx, x, 282, 38, 16, 8); ctx.fillStyle = gr; ctx.fill(); ctx.strokeStyle = lit ? '#c94a4a' : COL.grid; ctx.lineWidth = 1.2; ctx.stroke(); ctx.restore();
    }
    legend(ctx, 318, t);
    return;
  }
  if (g.mode === 'rag') {
    stripGroup(ctx, 30, t.hands[0], RAG_LH_CELLS, P, { ballColor: COL.beat, noGlow: true });
    stripGroup(ctx, 156, t.hands[1], RAG_RH_CELLS, P);
    legend(ctx, 300, t);
    return;
  }
  const show = g.mode === 'show', pa = show && P >= 0 && P < 8 ? P : -1, pb = show && P >= 8 ? Math.min(P - 8, 8) : -1;
  const pick = S.ans.grid, right = RIGHT.grid;
  const oA = { outline: asked ? (right === 0 ? '#3ddc97' : pick === 0 ? '#ff6b6b' : null) : null, tag: asked ? t.offN(offCount(PA)) : null, tagCol: '#9ec2ff', noGlow: !asked };
  const oB = { outline: asked ? (right === 1 ? '#3ddc97' : pick === 1 ? '#ff6b6b' : null) : null, tag: asked ? t.offN(offCount(PB)) : null, tagCol: '#ff9a9a', tagStroke: 'rgba(255, 107, 107, .5)', noGlow: !asked };
  stripGroup(ctx, 30, 'A', PA, pa, oA);
  stripGroup(ctx, 156, 'B', PB, pb, oB);
  legend(ctx, 300, t);
}
const PX = [6, 182], PW = 172;
function drawCompare(ctx) {
  const t = T[lang], c = S.c, asked = S.ans.compare !== null, P = PL.on ? Math.max(0, pos()) : -1, p = P < 0 ? -1 : P % 8;
  if (P >= 0) syncPass(P);
  const vers = [['straight', STRC, COL.beat, t.straight], ['synco', SYNC, COL.acc, t.syncoV]];
  vers.forEach(([key, cells, col, label], i) => {
    const sel = asked && c.ver === key, x = PX[i], pp = sel ? p : -1;
    ctx.save();
    rr(ctx, x, 6, PW, 262, 18); const pg = ctx.createLinearGradient(0, 6, 0, 268); pg.addColorStop(0, sel ? '#1e2442' : '#181c32'); pg.addColorStop(1, '#13162a');
    ctx.fillStyle = pg; ctx.fill();
    if (sel) { ctx.shadowColor = col; ctx.shadowBlur = 14; }
    ctx.strokeStyle = sel ? col : COL.grid; ctx.lineWidth = sel ? 2 : 1; ctx.stroke();
    ctx.restore();
    pill(ctx, label, x + PW / 2, 26, { size: 14, color: '#fff', stroke: sel ? col : undefined });
    const ds = danceState(pp, cells.map((q) => q / 2));
    dancer(ctx, x + PW / 2, 152, 0.8, { color: col, lift: ds.lift, bob: ds.bob, arm: ds.arm });
    if (!asked) { cover(ctx, x + 10, 160, PW - 20, 98); return; }
    ctx.save(); if (!sel) ctx.globalAlpha = 0.6;
    for (const b of [0, 1]) drawBar(ctx, { x0: x + 10, y: 184 + b * 48, cw: 19, ch: 22, c0: b * 8, notes: cells, pos: pp, dotGap: 8, dotR: 3.6, r: 6 });
    ctx.restore();
    if (sel) for (const tp of c.taps) { // where the claps landed
      const age = (nowP() - tp.at) / 1000; if (age > 0.7) continue;
      const row = tp.ph < 4 ? 0 : 1, tx = x + 10 + (tp.ph - row * 4) * 2 * 19, ty = 184 + row * 48 + 11, k = age / 0.7;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = tp.hit ? '#3ddc97' : '#ff6b6b'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(tx, ty, 6 + k * 12, 0, 7); ctx.stroke(); ctx.restore();
    }
  });
  if (asked) { // the hit meter: one pip for each strong note of the chosen version
    const shown = c.taps.length ? c.hit : c.lastSet;
    for (let i = 0; i < 6; i++) {
      const x = 90 + i * 36, on = shown.has(i);
      ctx.save(); if (on) { ctx.shadowColor = 'rgba(61, 220, 151, .8)'; ctx.shadowBlur = 12; }
      const gr = ctx.createRadialGradient(x - 3, 288 - 3, 1, x, 288, 11); gr.addColorStop(0, on ? '#9bf5cf' : '#232a52'); gr.addColorStop(1, on ? '#2bb97c' : '#161a32');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, 288, 10, 0, 7); ctx.fill(); ctx.strokeStyle = on ? '#1f8f60' : COL.grid; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
    }
  }
}
function syncPass(P) { // a new pass through the tune starts a new count of hits; the last count stays on show until the first clap
  const c = S.c, pass = Math.floor(P / 8);
  if (pass === c.pass) return;
  if (c.pass >= 0 && c.taps.length) { c.last = c.hit.size; c.lastSet = c.hit; }
  c.pass = pass; c.taps = []; c.hit = new Set();
}
function drawDots(ctx) {
  const t = T[lang], d = S.d, asked = S.ans.dots !== null, P = PL.on ? Math.max(0, pos()) : -1, p = P < 0 ? -1 : P % 4;
  const X = (b) => 24 + b * 78, notes = pairNotes(d.r), [u1, u2] = UNITS[d.r];
  // ruler, beat guides, beat dots
  ctx.save(); ctx.lineWidth = 1.2;
  for (let q = 0; q <= 16; q++) { const x = X(q / 4), beat = q % 4 === 0; ctx.strokeStyle = beat ? 'rgba(106, 169, 255, .7)' : COL.grid; ctx.beginPath(); ctx.moveTo(x, 208); ctx.lineTo(x, beat ? 217 : 213); ctx.stroke(); }
  ctx.setLineDash([2, 4]); ctx.strokeStyle = 'rgba(106, 169, 255, .4)';
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(X(i), 218); ctx.lineTo(X(i), 228); ctx.stroke(); }
  ctx.restore();
  for (let i = 0; i < 4; i++) {
    beatDot(ctx, X(i), 238, 7, bp(p, i));
    ctx.font = FONT(14, 800); ctx.fillStyle = '#9ec2ff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(i + 1), X(i), 262);
  }
  // the bars
  if (!asked) cover(ctx, 18, 154, 324, 54);
  else {
    for (const n of notes) {
      const x = X(n.s), w = Math.max(8, n.d * 78 - 3), on = p >= n.s && p < n.s + n.d, base = n.k === 0 ? COL.note : '#ffd08a', lift = on ? 3 : 0;
      ctx.save();
      if (on) { ctx.shadowColor = 'rgba(255, 179, 71, .85)'; ctx.shadowBlur = 14; }
      const g = ctx.createLinearGradient(0, 160 - lift, 0, 200); g.addColorStop(0, tint(base, 0.45)); g.addColorStop(0.5, base); g.addColorStop(1, tint(base, -0.3));
      rr(ctx, x, 160 - lift, w, 40 + lift * 0.5, 9); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = tint(base, -0.5); ctx.lineWidth = 1.5; ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255, 255, 255, .45)'; rr(ctx, x + 3, 163 - lift, Math.max(2, w - 6), 5, 2.5); ctx.fill();
      ctx.font = FONT(15, 900); ctx.fillStyle = '#4a2a05'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(n.k === 0 ? u1 : u2), x + w / 2, 181 - lift);
      ctx.restore();
    }
    if (p >= 0) { ctx.save(); ctx.shadowColor = 'rgba(255, 255, 255, .7)'; ctx.shadowBlur = 8; ctx.fillStyle = 'rgba(255, 255, 255, .85)'; rr(ctx, X(p) - 1.2, 150, 2.4, 62, 1.2); ctx.fill(); ctx.restore(); }
  }
  // the hopping figure: it follows the beat sideways and makes one hop for each note, landing where the next note starts
  let fx = X(0) + 4, rise = 0, sq = 0, lift = [0, 0], arm = 0.1, alpha = 1;
  if (p >= 0) {
    const idx = notes.findIndex((n) => p >= n.s && p < n.s + n.d), n = notes[Math.max(0, idx)], u = clamp((p - n.s) / n.d, 0, 1), air = 4 * u * (1 - u);
    fx = X(p); rise = (10 + 38 * n.d ** 0.7) * air / 0.62; sq = Math.max(0, 1 - Math.min(u, 1 - u) * 9);
    lift = d.r === 'even' ? (idx % 2 === 0 ? [air, 0] : [0, air]) : [air, air * 0.7];
    arm = d.r === 'even' ? 0.12 + 0.1 * air : 0.15 + 0.7 * air;
    alpha = Math.min(1, p / 0.12, (4 - p) / 0.12);
  }
  dancer(ctx, fx, 158, 0.62, { color: COL.note, lift, rise, sq, arm, alpha: clamp(alpha, 0, 1) });
}

// --- the page ----------------------------------------------------------------------------------------------
const cv = $('cv');
canvasLoop(cv, (ctx, w, h) => {
  try {
    pump();
    const v = lab.view, [W, H] = BOX[v], s = Math.min(w / W, h / H);
    backdrop(ctx, w, h);
    XF = { s, ox: (w - W * s) / 2, oy: (h - H * s) / 2 };
    ctx.save(); ctx.translate(XF.ox, XF.oy); ctx.scale(s, s);
    if (v === 'grid') drawGrid(ctx); else if (v === 'compare') drawCompare(ctx); else drawDots(ctx);
    ctx.restore();
    readoutTick();
  } catch (err) { console.error(err); }
});
const toBox = (ev) => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left - XF.ox) / XF.s, y: (ev.clientY - r.top - XF.oy) / XF.s }; };
const cellAt = (q) => { for (const r of [0, 1]) if (q.y >= ROW_Y[r] - 6 && q.y <= ROW_Y[r] + 52 && q.x >= 20 && q.x < 340) return r * 8 + Math.floor((q.x - 20) / 40); return -1; };
function moveNote(from, to) {
  const g = S.g, i = g.notes.indexOf(from); if (i < 0 || g.notes.includes(to)) return;
  g.notes[i] = to; g.notes.sort((a, b) => a - b); g.sel = to; g.drops[to] = nowP();
  ping(MEL[g.notes.indexOf(to)], to % 2 === 1);
  (to % 2 === 1 ? sfx.tick : sfx.click)();
}
cv.addEventListener('pointerdown', (ev) => {
  const v = lab.view, q = toBox(ev);
  if (v === 'grid' && S.g.mode === 'edit') {
    const c = cellAt(q), g = S.g; if (c < 0) return;
    if (g.notes.includes(c)) { g.wasSel = g.sel === c; g.sel = c; g.drag = true; g.hover = c; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ } }
    else if (g.sel !== null) moveNote(g.sel, c);
  } else if (v === 'compare' && S.ans.compare !== null && q.y >= 6 && q.y <= 268) {
    const ver = q.x < 180 ? 'straight' : 'synco';
    if (ver !== S.c.ver || !PL.on) { wantSound(); chooseVer(ver); render(); }
  }
});
cv.addEventListener('pointermove', (ev) => { if (S.g.drag) S.g.hover = cellAt(toBox(ev)); });
const dropEnd = (ev) => {
  const g = S.g; if (!g.drag) return;
  g.drag = false;
  const c = ev.type === 'pointerup' ? cellAt(toBox(ev)) : -1;
  if (c >= 0 && c !== g.sel && !g.notes.includes(c)) moveNote(g.sel, c);
  else if (c === g.sel && g.wasSel) g.sel = null;
  g.hover = -1;
};
cv.addEventListener('pointerup', dropEnd); cv.addEventListener('pointercancel', dropEnd);

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function startShow() { startPlay('show', 16, false, showEvs, () => render()); }
function startEdit() { startPlay('edit', 8, true, editEvs); }
function startRag() { S.g.mode = 'rag'; startPlay('rag', 8, false, ragEvs, () => render()); }
function startCompare() { Object.assign(S.c, { pass: -1, hit: new Set(), taps: [], last: null, lastSet: new Set() }); startPlay('compare', 8, true, tuneEvs); }
function chooseVer(ver) { S.c.ver = ver; startCompare(); }
function startDots() { S.d.secret = false; startPlay('dots', 4, true, dotsEvs); }
function startSnap() { S.d.secret = true; S.d.r = 'snap'; startPlay('snap', 8, false, snapEvs, () => render()); }
function startForView() {
  const v = lab.view;
  if (v === 'grid') { if (S.g.mode === 'edit') startEdit(); else if (S.g.mode === 'rag') startRag(); else startShow(); }
  else if (v === 'compare') startCompare();
  else if (S.d.secret) startSnap(); else startDots();
}
const RIGHT_OK = (v) => S.ans[v] === RIGHT[v];
function answer(v, i) {
  if (S.ans[v] !== null) return;
  wantSound();
  S.ans[v] = i; (RIGHT_OK(v) ? sfx.good : sfx.bad)();
  if (v === 'grid') { S.g.mode = 'show'; startShow(); }
  else if (v === 'compare') { S.c.ver = 'synco'; startCompare(); }
  else { S.d.r = 'dotted'; startDots(); }
  render(); showStage();
}
function clap() {
  if (!PL.on || PL.kind !== 'compare') { wantSound(); startCompare(); render(); return; }
  const P = pos(); if (P < 0) return;
  syncPass(P);
  const c = S.c, ph = P % 8, acc = (c.ver === 'synco' ? SYNC : STRC).map((q) => q / 2);
  let bi = -1, bd = 9;
  acc.forEach((a, i) => { if (c.hit.has(i)) return; let d = Math.abs(a - ph); d = Math.min(d, 8 - d); if (d < bd) { bd = d; bi = i; } });
  const hit = bi >= 0 && bd <= 0.22;
  if (hit) c.hit.add(bi);
  c.taps.push({ ph, hit, at: nowP() });
  clapSound();
}
$('ctrlBody').addEventListener('pointerdown', (ev) => { if (ev.target.closest('[data-act="clap"]')) { ev.preventDefault(); clap(); } });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (b.dataset.a !== undefined) return answer(lab.view, +b.dataset.a);
  if (act === 'clap') { if (ev.detail === 0) clap(); return; } // a mouse or finger already clapped on pointerdown; this is the keyboard
  if (act === 'play') { if (PL.on) stopPlay(); else { wantSound(); startForView(); } }
  else if (act === 'mine') { S.g.mode = 'edit'; S.g.sel = null; wantSound(); startEdit(); sfx.click(); showStage(); }
  else if (act === 'snd') { $('sound').click(); return; }
  else if (act === 'ver') { wantSound(); chooseVer(b.dataset.ver); sfx.click(); }
  else if (act === 'rhythm') { S.d.r = b.dataset.r; wantSound(); startDots(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k, target = k === 'a' ? 'grid' : 'dots';
    if (lab.view !== target) { stopPlay(); lab.view = target; lab.renderChrome(); }
    if (S.ans[target] !== null) { wantSound(); if (k === 'a') startRag(); else startSnap(); sfx.click(); showStage(); }
  }
  render();
});

// one render per change: controls, readout and the state card
function askHtml(v) {
  const t = T[lang], a = S.ans[v], right = RIGHT[v];
  const btns = t[v + 'Opts'].map((o, i) => `<button class="sy-opt${a !== null ? (i === right ? ' good' : i === a ? ' bad' : '') : ''}" data-a="${i}"${a !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = a === null ? '' : `<div class="sy-verdict ${a === right ? 'ok' : 'no'}">${esc(a === right ? t[v + 'Right'] : t[v + 'Wrong'])}</div>`;
  return `<div class="sy-ask"><div class="sy-q">${esc(t[v + 'Ask'])}</div><div class="sy-opts">${btns}</div>${verdict}</div>`;
}
function controlsHtml(v) {
  const t = T[lang], play = `<button class="sy-btn pri" data-act="play">${PL.on ? '■ ' + esc(t.stop) : '▶ ' + esc(t.play)}</button>`;
  if (v === 'grid') return `<div class="sy-row">${play}${S.g.mode === 'edit' ? '' : `<button class="sy-btn" data-act="mine">✏️ ${esc(t.mine)}</button>`}</div>`;
  if (v === 'compare') {
    const seg = [['straight', t.straight], ['synco', t.syncoV]].map(([k, l]) => `<button data-act="ver" data-ver="${k}" class="${S.c.ver === k ? 'on' : ''}">${esc(l)}</button>`).join('');
    return `<div class="sy-row"><div class="sy-seg">${seg}</div>${play}</div><div class="sy-row"><button class="sy-btn clap" data-act="clap">👏 ${esc(t.clap)}</button></div>`;
  }
  const seg = ['even', 'dotted', 'snap'].map((r) => `<button data-act="rhythm" data-r="${r}" class="${S.d.r === r && !S.d.secret ? 'on' : ''}">${esc(t[r])}</button>`).join('');
  return `<div class="sy-row"><div class="sy-seg">${seg}</div>${play}</div>`;
}
function secretsHtml(v) {
  const t = T[lang], open = secret.unlocked();
  const sc = (k, emo, on) => `<button class="chip secret ${open ? 'open' : ''} ${open && on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="sy-row"><div class="chips">${sc('a', '🎹', v === 'grid' && S.g.mode === 'rag')}${sc('b', '🏴', v === 'dots' && S.d.secret)}</div></div>`;
}
function render() {
  const t = T[lang], v = lab.view, a = S.ans[v];
  document.body.dataset.v = v + (v === 'grid' ? '-' + S.g.mode : '');
  $('ctrlBody').innerHTML = askHtml(v) + (a === null ? '' : controlsHtml(v) + (soundOn() ? '' : `<button class="sy-snd" data-act="snd">${esc(t.soundOff)}</button>`) + secretsHtml(v));
  lab.setGlow(v === 'grid' ? 'rgba(255, 107, 107, .2)' : v === 'compare' ? 'rgba(106, 169, 255, .26)' : 'rgba(255, 179, 71, .22)');
  if (a === null) { lab.setState({ emo: '🤔', title: t[v + 'Ask'], lead: '', body: '', extra: '' }); lab.setFacts([]); }
  else {
    const st = t.st[v];
    let s = { emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' };
    if (v === 'grid' && S.g.mode === 'rag') s = { emo: '🎹', title: t.secrets.a[0], lead: t.ragCaption, body: '', extra: '' };
    else if (v === 'grid' && S.g.mode === 'edit') s.extra = `<div class="sy-fine">${esc(t.hintGrid)}</div>`;
    else if (v === 'compare') s.extra = `<div class="sy-fine">${esc(t.hintClap)}</div>`;
    else if (v === 'dots' && S.d.secret) s = { emo: '🏴', title: t.secrets.b[0], lead: t.snapCaption, body: '', extra: '' };
    lab.setState(s); lab.setFacts(t.facts[v]);
  }
  roKey = ''; readoutTick();
}
function readoutTick() { // the readout follows the picture: the pattern that is playing, the claps, the ratio
  const t = T[lang], v = lab.view;
  let val = '?', pill = '', col = '#4a86e0';
  if (S.ans[v] !== null) {
    if (v === 'grid') {
      const g = S.g, P = PL.on ? pos() : -1;
      const n = g.mode === 'edit' ? offCount(g.notes) : g.mode === 'rag' ? offCount(RAG_RH_CELLS) : (PL.on && P >= 0 && P < 8 ? offCount(PA) : offCount(PB));
      val = t.offN(n); pill = n > 0 ? t.synco : t.onBeat; col = n > 0 ? '#e0504f' : '#4a86e0';
    } else if (v === 'compare') {
      const c = S.c; val = t.hits(c.taps.length ? c.hit.size : (c.last ?? 0), 6); pill = c.ver === 'synco' ? t.syncoV : t.straight; col = c.ver === 'synco' ? '#e0504f' : '#4a86e0';
    } else { const [a, b] = UNITS[S.d.r]; val = t.ratio(a, b); pill = t[S.d.r]; col = '#b86e0a'; }
  }
  const key = `${lang}|${v}|${val}|${pill}`;
  if (key === roKey) return;
  roKey = key; lab.setReadout(val, '', pill, col);
}
render();
</script>
