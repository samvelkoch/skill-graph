const resetP2 = () => { Object.assign(P2, { pick: null, t: -1, hits: [], seen: 0, revealed: false, done: false }); };

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a === 'item') { if (P1.play) return; P1.items[k] = !P1.items[k]; sfx.tick(); }
  else if (a === 'home') { if (P1.play) return; P1.home = +k; sfx.click(); }

  }

$('cv').addEventListener('pointerdown', (ev) => {

      : `<button class="btn ss-go" data-act="go2"${run || !p.pick ? ' disabled' : ''}>${esc(run ? q.run : q.go)}</button>`;
    if (!run) { lab.setReadout('?', q.pickSub, '', '#8fb4ff'); lab.setState({ emo: '🌩️', title: q.askT, lead: q.askL, body: '', extra: '' }); lab.setFacts([]); }
    else if (!p.revealed) { lab.setReadout('?', q.pickSub, '', '#8fb4ff'); lab.setState({ emo: '🏃', title: q.runT, lead: q.runL, body: '', extra: '' }); lab.setFacts([]); }
    else {
      const ok = !!SAFE[p.pick], n = p.hits.filter((h) => h <= p.t).length;
      lab.setReadout(`⚡ ${n}`, q.strikesSub, ok ? q.safe : q.notSafe, ok ? '#2fbf86' : '#e5484d');
      lab.setState(ok ? { emo: '✅', title: q.okT, lead: q.okL, body: q.okB, extra: '' } : { emo: '⚠️', title: q.badT, lead: q.badL[p.pick], body: q.badB, extra: '' });
      lab.setFacts(t.facts.where);
    }
  }
}
function renderAfter(t) {
  const p = P3, q = t.p3, ch = p.checked;
  lab.setGlow('rgba(255, 200, 130, .26)');
  $('itemChips3').innerHTML = Object.keys(q.items).map((k) => `<button class="chip ss-t ${p.sel.has(k) ? 'on' : ''}" data-act="tgl" data-k="${k}"${ch ? ' disabled' : ''}>${esc(q.items[k])}</button>`).join('');
  const go = $('go3'); go.textContent = q.go; go.disabled = ch || p.sel.size === 0; go.hidden = ch;
  const re = $('re3'); re.textContent = q.again; re.hidden = !ch;
  if (!ch) {
    lab.setReadout(String(p.sel.size), q.mark(p.sel.size), '', '#ffb36b');
    lab.setState({ emo: '🔍', title: q.askT, lead: q.askL, body: '', extra: '' }); lab.setFacts([]);
  } else {
    const all = p.sel.size === 2 && p.sel.has('wire') && p.sel.has('onwire'), wrongSafe = [...p.sel].some((k) => !DANGER[k]);
    lab.setReadout('2', q.sub, all ? q.pillOk : q.pillNo, all ? '#2fbf86' : '#ffb36b');
    lab.setState({ emo: all ? '✅' : '🤔', title: all ? t.ok : t.no, lead: all ? q.okL : `${q.noL}${wrongSafe ? ' ' + q.fine : ''}`, body: q.body, extra: '' });
    lab.setFacts(t.facts.after);
  }
}
render();
</script>
