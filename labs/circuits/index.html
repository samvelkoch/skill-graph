// --- the toy electrical model --------------------------------------------------------------------------------
// Every part is a resistor between two terminals; a cell is 1.5 V with a small internal resistance. Made-up
// round numbers (ohms) chosen only so that the picture behaves sensibly: a simplified model, not real data.
const R_OUT = 6, R_CELL = 0.05, G_WIRE = 100, LEAK = 1e-9, R_GRAPHITE = 6;
const I1 = 1.5 / R_OUT, P_REF = (4.5 * 4.5) / R_OUT; // one-cell current; bulb power with 3 cells (full brightness)
const condOf = (k) => (MAT[k].c === 1 ? 50 : MAT[k].c > 0 ? 1 / R_GRAPHITE : 0);
const TERMS = ['B-', 'B+', 'L1', 'L2', 'S1', 'S2', 'G1', 'G2'];

// C = { cells, out: 'bulb'|'buzzer', sw: true|false|null (no switch), gap: material|'empty'|null (no clips), wires: [{a, b, loose}] }
function solve(C) {
  const E = 1.5 * C.cells, r = R_CELL * C.cells, ix = Object.fromEntries(TERMS.map((k, i) => [k, i]));
  const edges = [{ id: 'BAT', a: 'B-', b: 'B+', g: 1 / r }, { id: 'OUT', a: 'L1', b: 'L2', g: 1 / R_OUT }];
  if (C.sw !== null) edges.push({ id: 'SW', a: 'S1', b: 'S2', g: C.sw ? G_WIRE : 0 });
  if (C.gap !== null) edges.push({ id: 'GAP', a: 'G1', b: 'G2', g: C.gap === 'empty' ? 0 : condOf(C.gap) });
  C.wires.forEach((w, i) => { if (!w.loose) edges.push({ id: 'W' + i, a: w.a, b: w.b, g: G_WIRE }); });
  const run = () => {
    // nodal analysis, the battery's − end is the reference; a tiny leak keeps unconnected terminals solvable
    const n = TERMS.length - 1, M = Array.from({ length: n }, () => new Float64Array(n + 1));
    for (let i = 0; i < n; i++) M[i][i] = LEAK;
    for (const e of edges) {
      const a = ix[e.a] - 1, b = ix[e.b] - 1;
      if (a >= 0) M[a][a] += e.g;
      if (b >= 0) M[b][b] += e.g;
      if (a >= 0 && b >= 0) { M[a][b] -= e.g; M[b][a] -= e.g; }
    }
    M[ix['B+'] - 1][n] += E / r; // the cell as a current source E/r in parallel with r
    for (let col = 0; col < n; col++) {
      let p = col;
      for (let q = col + 1; q < n; q++) if (Math.abs(M[q][col]) > Math.abs(M[p][col])) p = q;
      [M[col], M[p]] = [M[p], M[col]];
      for (let q = col + 1; q < n; q++) { const f = M[q][col] / M[col][col]; if (f) for (let k = col; k <= n; k++) M[q][k] -= f * M[col][k]; }
    }
    const x = new Float64Array(n);
    for (let i = n - 1; i >= 0; i--) { let s = M[i][n]; for (let k = i + 1; k < n; k++) s -= M[i][k] * x[k]; x[i] = s / M[i][i]; }
    const V = Object.fromEntries(TERMS.map((k, i) => [k, i ? x[i - 1] : 0]));
    const I = {};
    for (const e of edges) I[e.id] = e.id === 'BAT' ? (E - (V['B+'] - V['B-'])) / r : e.g * (V[e.a] - V[e.b]);
    return I;
  };
  let I = run(), reversed = false;
  // a buzzer only works one way round: its + end is L2, so the current must run L2 → L1 (I.OUT < 0)
  if (C.out === 'buzzer' && I.OUT > 0.01) { reversed = true; edges[1].g = LEAK; I = run(); }
  const b = Math.sqrt((I.OUT * I.OUT * R_OUT) / P_REF); // brightness 0..1: 1/3 per cell in a plain loop
  const short = I.BAT > 3; // a plain loop never draws more than ~0.75 (toy amps); a shortcut draws far more
  const status = short ? 'short' : reversed ? 'reversed' : b > 0.05 ? (b < 0.7 * C.cells / 3 ? 'dim' : 'on') : 'off';
  return { I, b: status === 'short' || status === 'reversed' ? 0 : b, status, lit: status === 'on' || status === 'dim' };
}

// why is it dark? (only asked when it is)
function diagnose(C) {
  const used = (t) => C.wires.some((w) => !w.loose && (w.a === t || w.b === t));
  const lights = (over) => solve({ ...C, ...over }).lit;
  if (!C.wires.length) return 'none';
  if (C.sw === false && lights({ sw: true })) return 'swOpen';
  if (!used('L1') && !used('L2')) return 'notIn';
  if (!used('L1') || !used('L2')) return 'oneEnd';
  if (!used('B-') || !used('B+')) return 'batEnd';
  return 'generic';
}

// --- board geometry and wire routing (CSS pixels) -------------------------------------------------------------
const TERM_R = (u) => Math.min(10, Math.max(5, 1.4 * u)), WIRE_W = (u) => Math.min(7, Math.max(3, 0.9 * u));
const LOOSE_GAP = (u) => TERM_R(u) + WIRE_W(u) / 2 + Math.max(12, 2.8 * u);
const TOP = 46; // a strip at the top of the stage for the guess pill and tips
function geom(w, h, n) {
  const pad = 10, W = Math.min(w - 2 * pad, (h - TOP - pad) * 1.5, 860), H = W / 1.5;
  const x0 = (w - W) / 2, y0 = TOP + Math.max(0, (h - TOP - pad - H) / 2), u = W / 100;
  const P = (fx, fy) => [x0 + fx * W, y0 + fy * H];
  const cl = 15 * u, half = (n * cl) / 2 + 2.5 * u, by = y0 + 0.88 * H;
  const T = { 'B-': [x0 + W / 2 - half, by], 'B+': [x0 + W / 2 + half, by], L1: P(0.44, 0.3), L2: P(0.56, 0.3), S1: P(0.88, 0.4), S2: P(0.88, 0.7), G1: P(0.12, 0.4), G2: P(0.12, 0.7) };
  return { W, H, x0, y0, u, P, T, cl, m: 4.5 * u, ctr: P(0.5, 0.55) };
}
// orthogonal route between two terminals, leaving each one along its outward direction
function route(p0, n0, p1, n1, m, ctr, away) {
  const A = [p0[0] + n0[0] * m, p0[1] + n0[1] * m], B = [p1[0] + n1[0] * m, p1[1] + n1[1] * m];
  const dt = (v, q) => v[0] * q[0] + v[1] * q[1], hz = n0[0] !== 0, d = dt(n0, n1);
  if (d === 0) {
    const C = hz ? [B[0], A[1]] : [A[0], B[1]];
    if (dt([C[0] - A[0], C[1] - A[1]], n0) >= 0 && dt([C[0] - B[0], C[1] - B[1]], n1) >= 0) return [p0, C, p1];
    if (hz) { const x = n0[0] > 0 ? Math.max(A[0], B[0]) + 1.4 * m : Math.min(A[0], B[0]) - 1.4 * m; return [p0, [x, p0[1]], [x, B[1]], B, p1]; }
    const y = n0[1] > 0 ? Math.max(A[1], B[1]) + 1.4 * m : Math.min(A[1], B[1]) - 1.4 * m;
    return [p0, [p0[0], y], [B[0], y], B, p1];
  }
  if (d > 0) {
    if (hz) { const x = n0[0] > 0 ? Math.max(A[0], B[0]) : Math.min(A[0], B[0]); return [p0, [x, p0[1]], [x, p1[1]], p1]; }
    const y = n0[1] > 0 ? Math.max(A[1], B[1]) : Math.min(A[1], B[1]);
    return [p0, [p0[0], y], [p1[0], y], p1];
  }
  if (dt([p1[0] - p0[0], p1[1] - p0[1]], n0) > 2 * m) { // facing each other
    if (hz) { const x = (p0[0] + p1[0]) / 2; return [p0, [x, p0[1]], [x, p1[1]], p1]; }
    const y = (p0[1] + p1[1]) / 2;
    return [p0, [p0[0], y], [p1[0], y], p1];
  }

  if (!s) { const mid = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2]; s = hz ? [0, mid[1] >= ctr[1] ? 1 : -1] : [mid[0] >= ctr[0] ? 1 : -1, 0]; }

  const x = s[0] > 0 ? Math.max(A[0], B[0]) + 1.4 * m : Math.min(A[0], B[0]) - 1.4 * m;

function wirePath(g, w) {

    rr(c, x - w * 0.5, ya + 0.6 * u, w, L - 1.6 * u, w * 0.5); c.stroke();
  } else if (k === 'foil') {
    const gr = c.createLinearGradient(x - 1.5 * u, 0, x + 1.5 * u, 0); gr.addColorStop(0, '#9aa2b5'); gr.addColorStop(0.5, '#f4f6fb'); gr.addColorStop(1, '#8a92a5');
    c.fillStyle = gr; c.beginPath();
    for (let i = 0; i <= 8; i++) { const yy = ya - 0.5 * u + (i / 8) * (L + u); c.lineTo(x - 1.4 * u + Math.sin(i * 2.3) * 0.35 * u, yy); }
    for (let i = 8; i >= 0; i--) { const yy = ya - 0.5 * u + (i / 8) * (L + u); c.lineTo(x + 1.4 * u + Math.sin(i * 1.7 + 1) * 0.35 * u, yy); }
    c.closePath(); c.fill();
  } else if (k === 'cu' || k === 'cotton') {
    c.strokeStyle = col; c.lineWidth = Math.max(2, (k === 'cu' ? 0.5 : 0.7) * u);
    c.beginPath(); for (let i = 0; i <= 30; i++) { const yy = ya - 0.6 * u + (i / 30) * (L + 1.2 * u); c.lineTo(x + Math.sin(i / 30 * Math.PI * (k === 'cu' ? 2 : 4)) * 0.7 * u, yy); } c.stroke();
  } else if (k === 'nail') {
    const gr = c.createLinearGradient(x - 0.5 * u, 0, x + 0.5 * u, 0); gr.addColorStop(0, '#6d7487'); gr.addColorStop(0.5, '#dfe3ec'); gr.addColorStop(1, '#6d7487');
    c.fillStyle = gr; c.fillRect(x - 0.45 * u, ya, 0.9 * u, L - 0.8 * u);
    rr(c, x - 1.5 * u, ya - 0.9 * u, 3 * u, 0.9 * u, 0.3 * u); c.fill();
    c.beginPath(); c.moveTo(x - 0.45 * u, yb - 0.8 * u); c.lineTo(x + 0.45 * u, yb - 0.8 * u); c.lineTo(x, yb + 0.6 * u); c.closePath(); c.fill();
  } else if (k === 'sspoon' || k === 'pspoon') {
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = Math.max(2, 0.9 * u);
    c.beginPath(); c.moveTo(x, ya - 0.8 * u); c.lineTo(x, yb - 4 * u); c.stroke();
    c.beginPath(); c.ellipse(x, yb - 1.9 * u, 1.6 * u, 2.4 * u, 0, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(x - 0.5 * u, yb - 2.4 * u, 0.4 * u, 1.1 * u, 0, 0, 7); c.fill();
  } else if (k === 'graphite') {
    c.fillStyle = col; c.fillRect(x - 0.45 * u, ya - 0.8 * u, 0.9 * u, L + 1.6 * u);
    c.fillStyle = '#8a8f9e'; c.fillRect(x - 0.15 * u, ya - 0.8 * u, 0.2 * u, L + 1.6 * u);
  } else if (k === 'wood') {
    rr(c, x - 1.1 * u, ya - 0.8 * u, 2.2 * u, L + 1.6 * u, 1.1 * u); c.fillStyle = col; c.fill();
    c.shadowColor = 'transparent'; c.strokeStyle = '#b9884a'; c.lineWidth = 1;
    for (const dx of [-0.4, 0.3]) { c.beginPath(); c.moveTo(x + dx * u, ya + u); c.lineTo(x + dx * u, yb - u); c.stroke(); }
  } else if (k === 'rubber') {
    c.strokeStyle = col; c.lineWidth = Math.max(2, 0.6 * u); c.beginPath(); c.ellipse(x, m, 1.1 * u, L / 2 + 0.4 * u, 0, 0, 7); c.stroke();
  } else if (k === 'glass') {
    const r = L / 2 - 0.2 * u, gr = c.createRadialGradient(x - r * 0.35, m - r * 0.35, r * 0.1, x, m, r);
    gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(0.3, 'rgba(120,200,255,.75)'); gr.addColorStop(1, 'rgba(40,90,190,.85)');
    c.fillStyle = gr; c.beginPath(); c.arc(x, m, r, 0, 7); c.fill();
    c.shadowColor = 'transparent'; c.strokeStyle = 'rgba(255,170,60,.85)'; c.lineWidth = Math.max(1.5, 0.3 * u); c.beginPath(); c.ellipse(x, m, r * 0.25, r * 0.6, 0.3, 0, 7); c.stroke();
  } else if (k === 'paper') {
    rr(c, x - 1.6 * u, ya - 0.8 * u, 3.2 * u, L + 1.6 * u, 0.3 * u); c.fillStyle = col; c.fill();
    c.shadowColor = 'transparent'; c.strokeStyle = 'rgba(78,168,255,.55)'; c.lineWidth = 1;
    for (let yy = ya + 0.8 * u; yy < yb; yy += 1.4 * u) { c.beginPath(); c.moveTo(x - 1.3 * u, yy); c.lineTo(x + 1.3 * u, yy); c.stroke(); }
  } else if (k === 'coat') {
    c.fillStyle = MAT.cu.col; c.fillRect(x - 0.3 * u, ya - 2.2 * u, 0.6 * u, L + 4.4 * u);
    rr(c, x - 0.85 * u, ya - 1 * u, 1.7 * u, L + 2 * u, 0.85 * u); c.fillStyle = col; c.fill();
    c.shadowColor = 'transparent'; c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(x - 0.5 * u, ya - 0.6 * u, 0.25 * u, L + 1.2 * u);
  }
  c.restore();
}
function drawGap(c, g, key, sym, hover) {
  const u = g.u, [gx, y1t] = g.T.G1, [, y2t] = g.T.G2, j1 = y1t + 4 * u, j2 = y2t - 4 * u;
  if (key && key !== 'empty') drawObj(c, key, gx, j1 - 1 * u, j2 + 1 * u, u);
  if (sym) {
    c.strokeStyle = INK; c.lineWidth = 2;
    c.beginPath(); c.moveTo(gx, y1t); c.lineTo(gx, j1 - 0.9 * u); c.moveTo(gx, y2t); c.lineTo(gx, j2 + 0.9 * u); c.stroke();
    for (const yy of [j1 - 0.9 * u, j2 + 0.9 * u]) { c.fillStyle = 'rgba(10,12,20,.6)'; c.beginPath(); c.arc(gx, yy, 0.9 * u, 0, 7); c.fill(); c.stroke(); }
  } else {
    clipJaw(c, gx, y1t, j1, '#e0453a', u);
    clipJaw(c, gx, y2t, j2, '#3a3f4f', u);
  }
  if (hover) drawObj(c, hover.k, gx + (1 - hover.f) * 14 * u, j1 - 1 * u - (1 - hover.f) * 1.5 * u, j2 + 1 * u - (1 - hover.f) * 1.5 * u, u, 0.95);
}

function drawTerminal(c, g, k, sym, state, time) {
  const u = g.u, [x, y] = g.T[k], r = TERM_R(u);
  if (sym) { c.fillStyle = INK; c.beginPath(); c.arc(x, y, lab.view === 'build' ? 3.5 : 2.5, 0, 7); c.fill(); }
  else {
    const gr = c.createRadialGradient(x - r * 0.3, y - r * 0.3, 1, x, y, r); gr.addColorStop(0, '#f3dc96'); gr.addColorStop(1, '#9a7a32');
    c.fillStyle = gr; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    c.strokeStyle = 'rgba(60,40,10,.8)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x - r * 0.55, y - r * 0.55); c.lineTo(x + r * 0.55, y + r * 0.55); c.stroke();
  }
  if (state === 'pending') { c.strokeStyle = '#FF3B30'; c.lineWidth = 2.5; c.beginPath(); c.arc(x, y, r + 4 + Math.sin(time * 8) * 1.5, 0, 7); c.stroke(); }
  else if (state === 'free') { c.strokeStyle = `rgba(255,255,255,${(0.18 + 0.18 * Math.sin(time * 3)).toFixed(2)})`; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, r + 4, 0, 7); c.stroke(); }
}

function label(c, text, x, y, align, u) {
  c.font = `800 ${clamp(2.3 * u, 10, 14)}px Nunito, sans-serif`; c.textAlign = align; c.textBaseline = 'middle'; c.fillStyle = '#98A0B8'; c.fillText(text, x, y);
}

function draw(c, C, dt, time) {
  const g = G, u = g.u, sym = S.mode === 'sym', hidden = isHidden(), t = T[lang], s = sol;
  rr(c, g.x0, g.y0, g.W, g.H, 3 * u); c.fillStyle = 'rgba(130,145,190,.05)'; c.fill(); c.strokeStyle = 'rgba(130,145,190,.14)'; c.lineWidth = 1; c.stroke();
  // paths every charge-carrying part follows (a → b)
  const P = { BAT: [g.T['B-'], g.T['B+']], OUT: outPath(g, C.out, sym) };
  if (C.sw !== null) P.SW = [g.T.S1, g.T.S2];
  if (C.gap !== null) P.GAP = [g.T.G1, g.T.G2];
  C.wires.forEach((w, i) => { P['W' + i] = wirePath(g, w); });
  g.paths = P;
  // wires
  const lw = WIRE_W(u);
  C.wires.forEach((w, i) => {
    const pts = P['W' + i];
    c.lineCap = 'round'; c.lineJoin = 'round';
    if (sym) { c.strokeStyle = INK; c.lineWidth = 2; poly(c, pts, 0); c.stroke(); }
    else {
      c.strokeStyle = 'rgba(0,0,0,.55)'; c.lineWidth = lw + 2.5; poly(c, pts, 2 * u); c.stroke();
      c.strokeStyle = WCOL[i % WCOL.length]; c.lineWidth = lw; poly(c, pts, 2 * u); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = Math.max(1, lw * 0.3); poly(c, pts, 2 * u); c.stroke();
    }
    if (w.loose) { const e = pts[pts.length - 1]; c.fillStyle = MAT.cu.col; c.beginPath(); c.arc(e[0], e[1], Math.max(2.5, 0.6 * u), 0, 7); c.fill(); }
  });
  // parts
  drawBattery(c, g, C.cells, sym);
  drawOut(c, g, C.out, sym, hidden ? 0 : s.b, hidden, time);
  if (C.sw !== null) drawSwitch(c, g, C.sw, sym);
  if (C.gap !== null) {
    const hov = lab.view === 'test' && X.obj && X.drop < 1 ? { k: X.obj, f: X.drop } : null;
    drawGap(c, g, C.gap, sym, hov);
  }
  // charges: dots that are always there, and move only when the loop is complete
  const sp = clamp(3.2 * u, 10, 22), V0 = 3 * sp, rd = clamp(0.5 * u, 2, 3.6);
  for (const [id, pts] of Object.entries(P)) {
    if (id === 'SW' && !C.sw) continue;
    if (id === 'GAP' && (C.gap === 'empty' || !MAT[C.gap].c)) continue;
    const I = hidden ? 0 : s.I[id] ?? 0, v = clamp(I / I1, -4, 4) * V0, key = lab.view + id;
    PH[key] = ((PH[key] ?? 0) + v * dt) % (sp * 1000);
    const L = lengths(pts), tot = L[L.length - 1], moving = Math.abs(v) > 0.5;
    c.fillStyle = s.status === 'short' && moving && !hidden ? '#ff8a7a' : moving ? '#ffd84d' : 'rgba(255,216,77,.3)';
    const off = ((PH[key] % sp) + sp) % sp;
    for (let d = off; d < tot; d += sp) { const [x, y] = pointAt(pts, L, d); c.beginPath(); c.arc(x, y, rd, 0, 7); c.fill(); }
  }
  // terminals
  const used = new Set(C.wires.filter((w) => !w.loose).flatMap((w) => [w.a, w.b]));
  for (const k of present(C)) drawTerminal(c, g, k, sym, S.pending === k ? 'pending' : lab.view === 'build' && S.asked && !used.has(k) ? 'free' : '', time);
  // names
  const o = outGeom(g);
  label(c, t.names.bat(C.cells), g.x0 + g.W / 2, g.T['B-'][1] - 5 * u, 'center', u);
  label(c, t.names[C.out], o.cx + o.r + 2.2 * u, o.gcy, 'left', u);
  if (C.sw !== null) { c.save(); c.translate(g.T.S1[0] + 6.6 * u, (g.T.S1[1] + g.T.S2[1]) / 2); c.rotate(-Math.PI / 2); label(c, t.names.sw, 0, 0, 'center', u); c.restore(); }
  if (C.gap !== null) label(c, t.names.gap, g.T.G2[0] + 3 * u, g.T.G2[1] + 3.2 * u, 'left', u);
  // a wire being dragged
  if (drag?.moved) {
    const [x, y] = g.T[drag.from]; c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2; c.setLineDash([6, 5]);
    c.beginPath(); c.moveTo(x, y); c.lineTo(drag.x, drag.y); c.stroke(); c.setLineDash([]);
  }
}

// the secret lab scene: a battery and two bulbs, in one loop (series) or each on its own rung (parallel)
function drawSecret(c, w, h, time) {
  const st = SEC[lang], br = secretState(), u = Math.min(w, h);
  const x0 = w * 0.16, x1 = w * 0.84, yB = h * 0.84, r = clamp(u * 0.07, 14, 34), lw = Math.max(3, u * 0.012);
  const series = SX.mode === 'series';
  const rungs = series ? [h * 0.3] : [h * 0.22, h * 0.52];
  const spots = series ? [{ k: 'a', x: w * 0.36, y: rungs[0] }, { k: 'b', x: w * 0.64, y: rungs[0] }]
    : [{ k: 'a', x: w * 0.5, y: rungs[0] }, { k: 'b', x: w * 0.5, y: rungs[1] }];
  const bw = Math.max(70, w * 0.22), bx = w / 2 - bw / 2, bh = Math.max(26, u * 0.08);
  // wires: a gap where a bulb is unscrewed
  c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = INK; c.lineWidth = lw;
  const seg = (pts) => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.stroke(); };
  const gapW = r * 0.9;
  seg([[bx, yB], [x0, yB], [x0, rungs[rungs.length - 1]]]); seg([[bx + bw, yB], [x1, yB], [x1, rungs[rungs.length - 1]]]);
  if (rungs.length > 1) { seg([[x0, rungs[1]], [x0, rungs[0]]]); seg([[x1, rungs[1]], [x1, rungs[0]]]); }
  for (const y of rungs) {
    const on = spots.filter((p) => p.y === y).sort((p, q) => p.x - q.x);
    let from = x0;
    for (const p of on) { seg([[from, y], [p.x - gapW, y]]); from = p.x + gapW; }
    seg([[from, y], [x1, y]]);
  }
  // battery
  rr(c, bx, yB - bh / 2, bw, bh, 8); c.fillStyle = '#2b3550'; c.fill(); c.strokeStyle = '#4ea8ff'; c.lineWidth = 2; c.stroke();
  c.fillStyle = '#f5c84c'; c.fillRect(bx + bw - 7, yB - bh / 4, 7, bh / 2);
  c.fillStyle = '#fff'; c.font = `800 ${Math.round(bh * 0.42)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(`− ${'🔋'.repeat(B.cells)} ${nf(1.5 * B.cells)} ${lang === 'ru' ? 'В' : 'V'} +`, w / 2, yB);
  // moving charges: the whole loop for series, each rung's own loop for parallel; speed follows the current
  const loops = series ? [{ on: SX.a && SX.b, y: rungs[0], i: br.a }] : [{ on: SX.a, y: rungs[0], i: br.a }, { on: SX.b, y: rungs[1], i: br.b }];
  for (const L0 of loops) {
    if (!L0.on) continue;
    const pts = [[bx + bw, yB], [x1, yB], [x1, L0.y], [x0, L0.y], [x0, yB], [bx, yB]], L = lengths(pts), tot = L[L.length - 1];
    const n = Math.max(8, Math.round(tot / 34)), sp = 40 + 120 * L0.i;
    c.fillStyle = '#ffd34d';
    for (let j = 0; j < n; j++) { const [px, py] = pointAt(pts, L, ((j / n) * tot + time * sp) % tot); c.beginPath(); c.arc(px, py, Math.max(2.5, lw * 0.75), 0, 7); c.fill(); }
  }
  // bulbs
  SG.bulbs = [];
  for (const p of spots) {
    const inn = SX[p.k], b = br[p.k], cy = inn ? p.y - r * 0.95 : p.y - r * 2.1, cx = inn ? p.x : p.x + r * 0.5;
    if (b > 0) { const g = c.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 3.2); g.addColorStop(0, `rgba(255,214,90,${0.25 + 0.6 * b})`); g.addColorStop(1, 'rgba(255,214,90,0)'); c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r * 3.2, 0, 7); c.fill(); }
    c.save(); c.translate(cx, cy); if (!inn) c.rotate(0.35);
    c.fillStyle = b > 0 ? `rgba(255,${Math.round(200 + 40 * b)},${Math.round(90 + 60 * b)},${0.55 + 0.45 * b})` : 'rgba(200,210,235,.16)';
    c.strokeStyle = 'rgba(237,239,247,.75)'; c.lineWidth = 2;
    c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#9aa2b5'; c.fillRect(-r * 0.45, r * 0.8, r * 0.9, r * 0.55);
    c.strokeStyle = b > 0 ? '#fff6c8' : 'rgba(237,239,247,.5)'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(-r * 0.3, r * 0.75); c.lineTo(-r * 0.15, -r * 0.1); c.lineTo(r * 0.15, -r * 0.1); c.lineTo(r * 0.3, r * 0.75); c.stroke();
    c.restore();
    c.fillStyle = inn ? '#EDEFF7' : '#f5c84c'; c.font = `800 ${Math.round(clamp(u * 0.032, 11, 15))}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText(`${p.k === 'a' ? st.a : st.b}${inn ? '' : ` · ${st.out}`}`, p.x, p.y + lw + Math.max(10, r * 0.55));
    SG.bulbs.push({ k: p.k, x: cx, y: cy, r });
  }
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (lab.view === 'test' && X.obj && X.guess !== null && X.drop < 1) { X.drop = Math.min(1, X.drop + dt / 0.55); if (X.drop >= 1) testLanded(); }
  if (SX.mode && lab.view === 'build') return drawSecret(c, w, h, time);
  const C = circuit();
  G = geom(w, h, C.cells);
  draw(c, C, dt, time);
});
render();
</script>
