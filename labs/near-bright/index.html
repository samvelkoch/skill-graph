// --- tiny drawing helpers ------------------------------------------------------------------------------------
let W = 0, H = 0;
const rr = (c, x, y, w, h, r) => { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
const lg = (c, x0, y0, x1, y1, st) => { const g = c.createLinearGradient(x0, y0, x1, y1); st.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rg = (c, x0, y0, r0, x1, y1, r1, st) => { const g = c.createRadialGradient(x0, y0, Math.max(0, r0), x1, y1, Math.max(0, r1)); st.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); };
const ell = (c, x, y, rx, ry) => { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, Math.PI * 2); };
const c01 = (x) => clamp(x, 0, 1);
const easeOut = (u) => 1 - (1 - u) * (1 - u);
const ease = (u) => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const hexA = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
const ra = (hex, a) => `rgba(${hexA(hex).join(',')},${a})`;
const mix = (a, b, t) => { const A = hexA(a), B = hexA(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
const gcd = (a, b) => (b ? gcd(b, a % b) : a);
const frac = (num, den) => { const g = gcd(num, den); num /= g; den /= g; return den === 1 ? `${num}` : `${num}/${den}`; };
const lvOf = (b) => Math.pow(b, .6); // perceived level of a brightness b (1 = brightest tile)
let seedN = 11; const rnd = () => { seedN = (seedN * 16807) % 2147483647; return seedN / 2147483647; };
const BG = Array.from({ length: 70 }, () => ({ x: rnd(), y: rnd() * .8, r: .5 + rnd() * 1.1, p: rnd() * 6 }));

// a dark rounded label (wraps long text), top-left or centred; returns its height
function tag(c, text, cx, y, maxW = W - 8, o = {}) {
  c.save(); c.font = '800 12.5px Nunito, sans-serif';
  const lines = []; let cur = '';
  for (const wd of String(text).split(' ')) { const tr = cur ? `${cur} ${wd}` : wd; if (cur && c.measureText(tr).width > maxW - 20) { lines.push(cur); cur = wd; } else cur = tr; }
  lines.push(cur);
  const lh = 17, bw = Math.min(maxW, Math.max(...lines.map((l) => c.measureText(l).width)) + 20), bh = lines.length * lh + 10;
  const x = o.left !== undefined ? o.left : clamp(cx - bw / 2, 4, Math.max(4, W - bw - 4));
  c.globalAlpha = o.alpha ?? 1;
  rr(c, x, y, bw, bh, 12); c.fillStyle = 'rgba(8,10,20,.84)'; c.fill(); c.strokeStyle = o.line || 'rgba(130,145,190,.4)'; c.lineWidth = 1; c.stroke();
  c.fillStyle = o.col || '#eef1fa'; c.textAlign = 'center'; c.textBaseline = 'middle';
  lines.forEach((l, i) => c.fillText(l, x + bw / 2, y + 5 + lh * i + lh / 2));
  c.restore(); return bh;
}

// the lamp: cart on the rail, pole, socket, a glowing bulb that faces right (the wall); k = glow strength
function lampObj(c, x, by, railY, R, k = 1) {
  c.save();
  c.globalCompositeOperation = 'lighter';
  ell(c, x, railY + 8, 40 * k + 16, 7); c.fillStyle = rg(c, x, railY + 8, 0, x, railY + 8, 40 * k + 16, [[0, `rgba(255,200,110,${.3 * k})`], [1, 'rgba(255,200,110,0)']]); c.fill();
  circ(c, x + 3, by, R * 4.6); c.fillStyle = rg(c, x + 3, by, 0, x + 3, by, R * 4.6, [[0, `rgba(255,214,130,${.6 * k})`], [.4, `rgba(255,190,90,${.2 * k})`], [1, 'rgba(255,190,90,0)']]); c.fill();
  c.restore();
  c.save();
  c.lineWidth = 3.5; c.lineCap = 'round'; c.strokeStyle = lg(c, x - 2, 0, x + 2, 0, [[0, '#9aa3bd'], [1, '#4b536b']]);
  c.beginPath(); c.moveTo(x, railY - 12); c.lineTo(x, by + R * .7); c.stroke();
  rr(c, x - 15, railY - 15, 30, 11, 4); c.fillStyle = lg(c, x, railY - 15, x, railY - 4, [[0, '#a3acc6'], [1, '#4a5169']]); c.fill(); c.strokeStyle = '#262c40'; c.lineWidth = 1.2; c.stroke();
  [-8, 8].forEach((dx) => { circ(c, x + dx, railY - 3, 3.6); c.fillStyle = '#1c2133'; c.fill(); c.strokeStyle = '#8d96b0'; c.lineWidth = 1; c.stroke(); });
  rr(c, x - 8, by - R * .8, 12, R * 1.6, 4); c.fillStyle = lg(c, x - 8, by, x + 4, by, [[0, '#6d7692'], [1, '#2b3147']]); c.fill(); c.strokeStyle = '#1b2033'; c.lineWidth = 1.2; c.stroke();
  circ(c, x + 3, by, R); c.fillStyle = rg(c, x + 3 - R * .35, by - R * .35, R * .1, x + 3, by, R, [[0, '#ffffff'], [.45, '#fff0b8'], [1, '#ffb94d']]); c.fill();
  c.strokeStyle = 'rgba(224,140,40,.9)'; c.lineWidth = 1.2; c.stroke();
  ell(c, x + 3 - R * .3, by - R * .38, R * .28, R * .16); c.fillStyle = 'rgba(255,255,255,.85)'; c.fill();
  c.restore();
}
function wallSlab(c, x, y0, y1, wdt) {
  rr(c, x, y0, wdt, y1 - y0, 4); c.fillStyle = lg(c, x, 0, x + wdt, 0, [[0, '#39426a'], [.5, '#2a3253'], [1, '#1b2139']]); c.fill();
  c.strokeStyle = '#0d1122'; c.lineWidth = 1.5; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x + 1.5, y0 + 4); c.lineTo(x + 1.5, y1 - 4); c.stroke();
}
function room(c, x, y, w, h) {
  rr(c, x, y, w, h, 16); c.fillStyle = lg(c, 0, y, 0, y + h, [[0, '#0a0e1d'], [1, '#161c33']]); c.fill();
  c.strokeStyle = 'rgba(130,145,190,.18)'; c.lineWidth = 1; c.stroke();
}
function rail(c, x0, x1, y) {
  rr(c, x0, y - 3, x1 - x0, 7, 3); c.fillStyle = lg(c, 0, y - 3, 0, y + 4, [[0, '#b0b8d0'], [.5, '#6a7390'], [1, '#383f58']]); c.fill();
  c.strokeStyle = '#1b2033'; c.lineWidth = 1; c.stroke();

  const L = S.lamp, isz = Math.min(h * .4, w * .6, 230), sideH = h - isz - 52;

  c.save(); rr(c, 2, railY + 4, w - 4, sideH - railY - 4, 14); c.fillStyle = 'rgba(0,0,0,.28)'; c.fill(); c.restore();
  rail(c, 14, wallX, railY);
  c.save(); c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '800 12px Nunito, sans-serif';
  for (let k = 1; k <= 4; k++) {

  // the beam: a square pyramid seen from the side

  c.fillStyle = lg(c, lampX, 0, wallX, 0, [[0, 'rgba(255,218,130,.55)'], [1, `rgba(255,200,100,${.1 + .2 * lvS})`]]); c.fill();
  c.strokeStyle = 'rgba(255,226,150,.5)'; c.lineWidth = 1; c.stroke();
  c.setLineDash([3, 5]); c.strokeStyle = 'rgba(255,230,170,.35)'; c.beginPath(); c.moveTo(lampX + 3, by); c.lineTo(wallX, by); c.stroke();
  c.restore();

  rr(c, wallX - 2, by - half, 7, half * 2, 3); c.fillStyle = mix('#7a6a50', '#fff0b8', .3 + .7 * lvS); c.fill(); c.restore();
  lampObj(c, lampX, by, railY, 9.5, 1);

  // inset: the wall seen face-on
  const px = Math.max(14, (w - isz - 84) / 2), py = sideH + 38, pitch = isz / 9, n2 = L.shown, st = Math.floor((9 - n2) / 2), cn = st + (n2 - 1) / 2;
  const dialX = Math.min(w - 36, px + isz + 50), dialY = py + isz / 2, R = 27;
  tag(c, T[lang].wall, px + isz / 2, sideH + 5, w - 8);
  rr(c, px - 8, py - 8, isz + 16, isz + 16, 14); c.fillStyle = lg(c, 0, py, 0, py + isz, [[0, '#10162a'], [1, '#080b17']]); c.fill();
  c.strokeStyle = 'rgba(130,145,190,.4)'; c.lineWidth = 1.5; c.stroke();
  let lvC = 0;
  for (let j = 0; j < 9; j++) for (let i = 0; i < 9; i++) {
    const x = px + i * pitch, y = py + j * pitch, lit = i >= st && i < st + n2 && j >= st && j < st + n2;
    let lv = 0;
    if (lit) { const rd = Math.max(Math.abs(i - cn), Math.abs(j - cn)); lv = lvOf(1 / (n2 * n2)) * easeOut(c01((t - L.litT - rd * .09) / .35)); if (i === 4 && j === 4) lvC = lv; }
    c.save();
    if (lv > .01) { c.shadowColor = `rgba(255,214,120,${.9 * lv})`; c.shadowBlur = 18 * lv; }
    rr(c, x + 1.5, y + 1.5, pitch - 3, pitch - 3, 3);
    c.fillStyle = lv > .01 ? mix('#262d4a', '#ffe9ad', .2 + .8 * lv) : lg(c, x, y, x, y + pitch, [[0, '#1d243c'], [1, '#141a2e']]); c.fill();
    c.restore();
    c.strokeStyle = lv > .01 ? 'rgba(255,240,190,.35)' : 'rgba(130,145,190,.14)'; c.lineWidth = 1; rr(c, x + 1.5, y + 1.5, pitch - 3, pitch - 3, 3); c.stroke();
  }

  const sx = px + 4.5 * pitch, sy = py + 4.5 * pitch;
  c.save();
  circ(c, sx, sy, pitch * .3); c.strokeStyle = '#7fd4ff'; c.lineWidth = 2; c.stroke();
  c.strokeStyle = 'rgba(127,212,255,.6)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(sx + pitch * .3, sy); c.bezierCurveTo(sx + 50, sy, dialX - R - 30, sy, dialX - R, dialY); c.stroke();
  circ(c, dialX, dialY, R + 3); c.fillStyle = lg(c, dialX - R, dialY - R, dialX + R, dialY + R, [[0, '#aab3cc'], [1, '#444b63']]); c.fill();
  circ(c, dialX, dialY, R - 2); c.fillStyle = rg(c, dialX, dialY - 6, 2, dialX, dialY, R, [[0, '#1b2340'], [1, '#090c18']]); c.fill();
  for (let k = 0; k <= 6; k++) { const a = Math.PI * (1.12 + .76 * k / 6); c.strokeStyle = '#8d96b0'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(dialX + Math.cos(a) * (R - 5), dialY + Math.sin(a) * (R - 5)); c.lineTo(dialX + Math.cos(a) * (R - 9), dialY + Math.sin(a) * (R - 9)); c.stroke(); }
  const na = Math.PI * (1.12 + .76 * lvC);
  c.strokeStyle = '#ff5a4f'; c.lineWidth = 2.2; c.lineCap = 'round'; c.beginPath(); c.moveTo(dialX, dialY); c.lineTo(dialX + Math.cos(na) * (R - 7), dialY + Math.sin(na) * (R - 7)); c.stroke();

}

// --- scene: two lamps ----------------------------------------------------------------------------------------
let GT = {};
function sceneTwo(c, w, h, dt) {
  const K = S.two;
  K.cover = K.phase === 'predict' ? 1 : Math.max(0, K.cover - dt * 2);
  K.bx += (K.B - K.bx) * (1 - Math.exp(-dt * 12)); K.sx += (K.Sm - K.sx) * (1 - Math.exp(-dt * 12));
  const tB = c01(Math.sqrt(4 / (K.B * K.B)) / 2), tS = c01(Math.sqrt(1 / (K.Sm * K.Sm)) / 2);
  K.lb += (tB - K.lb) * (1 - Math.exp(-dt * 10)); K.ls += (tS - K.ls) * (1 - Math.exp(-dt * 10));
  const bandH = (h - 18) / 2, t = T[lang], wallX = w - 96, u = (wallX - 34) / 8.6;
  [0, 1].forEach((r) => {
    const big = r === 0, dd = big ? K.B : K.Sm, dx = big ? K.bx : K.sx, y0 = 6 + r * (bandH + 6), railY = y0 + bandH - 22, by = y0 + bandH * .4, ts = (bandH - 12) / 16;
    room(c, 3, y0, w - 6, bandH);
    rail(c, 14, wallX, railY);
    c.save(); c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '800 12px Nunito, sans-serif';
    for (let k = 1; k <= 8; k++) { const x = wallX - k * u; c.strokeStyle = k === dd ? '#ffe08a' : '#6a7390'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, railY + 4); c.lineTo(x, railY + 9); c.stroke(); c.fillStyle = k === dd ? '#ffe08a' : '#98a0b8'; c.fillText(String(k), x, railY + 17); }
    c.textAlign = 'right'; c.fillStyle = '#98a0b8'; c.fillText(t.m, wallX + 10, railY + 17); c.restore();
    wallSlab(c, wallX, y0 + 6, y0 + bandH - 6, 10);
    const half = dx * ts / 2, lampX = wallX - dx * u;
    c.save(); c.beginPath(); c.moveTo(lampX + 3, by); c.lineTo(wallX, by - half); c.lineTo(wallX, by + half); c.closePath();
    c.fillStyle = lg(c, lampX, 0, wallX, 0, [[0, `rgba(255,218,130,${big ? .55 : .34})`], [1, `rgba(255,200,100,${big ? .2 : .1})`]]); c.fill();
    c.strokeStyle = `rgba(255,226,150,${big ? .5 : .32})`; c.lineWidth = 1; c.stroke(); c.restore();
    lampObj(c, lampX, by, railY, big ? 13 : 6.5, big ? 1.3 : .7);
    // the patch of wall, face-on
    const ps = Math.min(60, bandH * .38), pcx = w - 46, lv = big ? K.lb : K.ls;
    c.save(); c.strokeStyle = 'rgba(160,175,215,.35)'; c.setLineDash([3, 4]); c.lineWidth = 1.2; c.beginPath(); c.moveTo(wallX + 10, by); c.lineTo(pcx - ps / 2 - 4, by); c.stroke(); c.restore();
    c.save(); c.shadowColor = `rgba(255,214,120,${.9 * lv})`; c.shadowBlur = 26 * lv;
    rr(c, pcx - ps / 2, by - ps / 2, ps, ps, 10); c.fillStyle = mix('#232a46', '#fff0b8', .12 + .88 * lv); c.fill(); c.restore();
    c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 1; rr(c, pcx - ps / 2, by - ps / 2, ps, ps, 10); c.stroke();
    c.strokeStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.moveTo(pcx, by - ps / 2); c.lineTo(pcx, by + ps / 2); c.moveTo(pcx - ps / 2, by); c.lineTo(pcx + ps / 2, by); c.stroke();
    const cap = frac(big ? 4 : 1, dd * dd);
    if (K.cover < .98) tag(c, cap, pcx, by + ps / 2 + 8, 70, { col: '#ffe08a', alpha: 1 - K.cover });
    if (K.cover > .001) {
      const hh = ps + 8 + 27 + 4, y1 = by - ps / 2 - 2;
      c.save(); c.beginPath(); c.rect(pcx - ps / 2 - 6, y1, ps + 12, hh * ease(K.cover)); c.clip();
      rr(c, pcx - ps / 2 - 4, y1, ps + 8, hh, 10); c.fillStyle = '#04060c'; c.fill(); c.strokeStyle = 'rgba(130,145,190,.4)'; c.setLineDash([4, 4]); c.stroke(); c.setLineDash([]);
      c.fillStyle = '#7e87a4'; c.font = '900 34px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', pcx, y1 + hh / 2); c.restore();
    }
    tag(c, `${big ? t.bigN : t.smallN} · ${dd} ${t.m}`, 0, y0 + 8, w - 20, { left: 12 });

}

let GS = [];
function starDot(c, x, y, r, col, spikes) {
  c.save(); c.globalCompositeOperation = 'lighter';
  circ(c, x, y, r * 5); c.fillStyle = rg(c, x, y, 0, x, y, r * 5, [[0, ra(col, .6)], [.35, ra(col, .16)], [1, ra(col, 0)]]); c.fill();

  c.restore();
  circ(c, x, y, r); c.fillStyle = rg(c, x - r * .3, y - r * .3, 0, x, y, r, [[0, '#ffffff'], [1, col]]); c.fill();
}
function sceneSky(c, w, h, dt, t) {
  const K = S.sky, sec = S.sec, tt = sec ? t - S.secT : 0, tr = T[lang];
  const hz = h * .82, R = Math.min(w, h) * .15, sunX = w * .2, sunY = hz - R * .35;
  const eA = sec === 'a' ? easeOut(c01(tt / 3.2)) : 0;
  const glowK = 1 - eA * .9;
  c.fillStyle = lg(c, 0, 0, 0, hz, [[0, '#050716'], [.55, '#0e1738'], [1, '#2b3563']]); c.fillRect(0, 0, w, h);
  c.save(); c.globalCompositeOperation = 'lighter';
  ell(c, sunX, hz, w * .55, h * .3); c.fillStyle = rg(c, sunX, hz, 0, sunX, hz, w * .55, [[0, `rgba(255,150,70,${.5 * glowK})`], [.5, `rgba(255,120,80,${.16 * glowK})`], [1, 'rgba(255,120,80,0)']]); c.fill();
  c.restore();
  BG.forEach((s) => { c.globalAlpha = (.3 + .35 * Math.sin(t * 1.4 + s.p)) * (1 - s.y * .5); circ(c, s.x * w, s.y * h, s.r); c.fillStyle = '#dfe8ff'; c.fill(); });
  c.globalAlpha = 1;
  GS = [];
  const sunDraw = (x, y, r, col, gl) => {
    c.save(); c.globalCompositeOperation = 'lighter';
    circ(c, x, y, gl); c.fillStyle = rg(c, x, y, r * .5, x, y, gl, [[0, ra(col, .55)], [.4, ra(col, .18)], [1, ra(col, 0)]]); c.fill(); c.restore();
    circ(c, x, y, r); c.fillStyle = rg(c, x - r * .3, y - r * .3, 0, x, y, r, [[0, '#ffffff'], [.35, col], [1, mix(col, '#ff7a2a', .6)]]); c.fill();
  };
  const starPos = (id) => ({ sir: [.74, .2], alc: [.54, .42], rig: [.34, .15], prx: [.8, .6] }[id]);
  const badge = (x, y, n) => { c.save(); circ(c, x, y, 11); c.fillStyle = '#fff'; c.fill(); c.fillStyle = '#0a0c14'; c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(n), x, y + .5); c.restore(); };
  if (!sec) {
    sunDraw(sunX, sunY, R, SCOL.sun, R * 2.3); GS.push({ id: 'sun', x: sunX, y: sunY, r: R });
    [['sir', 9, true], ['alc', 7, false], ['rig', 6, false], ['prx', 1.8, false]].forEach(([id, r, sp]) => {
      const [fx, fy] = starPos(id), x = fx * w, y = fy * h;
      starDot(c, x, y, r, SCOL[id], sp); GS.push({ id, x, y, r: Math.max(r, 5) + 10 });
    });
  } else if (sec === 'a') {
    const [fx, fy] = starPos('sir'), sx = fx * w, sy = fy * h;
    starDot(c, sx, sy, 9, SCOL.sir, true);
    const ex = w * .4, ey = h * .3, x = lerp(sunX, ex, eA), y = lerp(sunY, ey, eA), r = lerp(R, 1.8, eA);
    c.save(); c.setLineDash([3, 6]); c.strokeStyle = 'rgba(255,214,120,.3)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(sunX, sunY); c.lineTo(x, y); c.stroke(); c.restore();
    sunDraw(x, y, r, SCOL.sun, r * 2.3 + 8);
    tag(c, tr.names.sir, sx, sy + 24); tag(c, tr.names.sun, x, y + (eA > .6 ? 14 : -R * (1 - eA) - 30));
  } else {
    const e = easeOut(c01(tt / .9));
    sunDraw(sunX, sunY, R * 1.35 * e, '#bcd4ff', R * 3.2 * e);
  }
  // hills
  c.beginPath(); c.moveTo(0, h); c.lineTo(0, hz + 4); c.bezierCurveTo(w * .2, hz - 14, w * .35, hz + 10, w * .55, hz - 4); c.bezierCurveTo(w * .7, hz - 14, w * .85, hz + 8, w, hz - 2); c.lineTo(w, h); c.closePath();
  c.fillStyle = lg(c, 0, hz - 10, 0, h, [[0, '#0b0f1e'], [1, '#03040a']]); c.fill(); c.strokeStyle = 'rgba(130,145,190,.2)'; c.lineWidth = 1; c.stroke();
  if (!sec) {
    const rk = (id) => (K.revealed ? TRUE.indexOf(id) + 1 : K.rank.indexOf(id) + 1);
    GS.forEach((s) => {
      const isSun = s.id === 'sun', r = isSun ? R : s.r - 10;
      if (isSun) tag(c, tr.names.sun, s.x, s.y - R - 28); else { tag(c, tr.names[s.id], s.x, s.y + Math.max(r, 5) + 8); if (s.id === 'prx') tag(c, tr.tele, s.x, s.y + Math.max(r, 5) + 8 + 28, W - 8, { col: '#ff9f86' }); }
      if (K.sel === s.id) { c.save(); circ(c, s.x, s.y, (isSun ? R : Math.max(r, 5)) + 8); c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.setLineDash([4, 4]); c.stroke(); c.restore(); }
      if (rk(s.id) > 0) { const bx = isSun ? s.x + R * .72 : s.x + Math.max(r, 6) + 10, byy = isSun ? s.y - R * .72 : s.y - Math.max(r, 6) - 8; badge(bx, byy, rk(s.id)); }
    });
    if (K.revealed) {
      const rig = GS.find((s) => s.id === 'rig'), tg1 = sunY - R - 56, tg2 = rig.y + 6 + 8 + 28;
      tag(c, tr.lookBest, sunX, tg1, 150, { col: '#ffd35c', line: 'rgba(255,211,92,.5)' }); tag(c, tr.realBest, rig.x, tg2, 150, { col: '#a9c6ff', line: 'rgba(169,198,255,.5)' });
      const ax = (sunX + rig.x) / 2 - 12, a0 = tg1 - 4, a1 = tg2 + 36;
      c.save(); c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 1.8; c.setLineDash([5, 5]); c.beginPath(); c.moveTo(sunX, a0); c.quadraticCurveTo(ax - 20, (a0 + a1) / 2, rig.x - 14, a1 + 4); c.stroke(); c.setLineDash([]);
      c.beginPath(); c.moveTo(rig.x - 14, a1 - 4); c.lineTo(rig.x - 21, a1 + 8); c.lineTo(rig.x - 7, a1 + 8); c.closePath(); c.fill(); c.restore();
    }
    if (K.sel) tag(c, `${tr.names[K.sel]}: ${tr.dist[K.sel]}${K.revealed ? ` · ${tr.pow[K.sel]}` : ''}`, w / 2, 8, w - 16);
  } else if (sec === 'a') {
    if (tt > 3.2) tag(c, tr.secLab.a, w / 2, h - 74, w - 20, { alpha: c01((tt - 3.2) / .6) });
  } else {
    const wash = tt < .5 ? ease(tt / .5) : tt < 1.2 ? 1 : Math.max(0, 1 - (tt - 1.2) / 1.2);
    if (wash > 0) { c.fillStyle = `rgba(255,255,255,${wash})`; c.fillRect(0, 0, w, h); }
    if (tt > 1.4) { tag(c, tr.names.rig, sunX, sunY + R * 1.5, 150, { alpha: c01((tt - 1.4) / .5) }); tag(c, tr.secLab.b, w / 2, h - 74, w - 20, { alpha: c01((tt - 1.6) / .6) }); }
  }
}

canvasLoop($('cv'), (c, w, h, dt, t) => {
  W = w; H = h;
  const v = lab.view;
  if (S.sec) sceneSky(c, w, h, dt, t);
  else if (v === 'lamp') sceneLamp(c, w, h, dt, t);
  else if (v === 'two') sceneTwo(c, w, h, dt);
  else sceneSky(c, w, h, dt, t);
});

// --- input ---------------------------------------------------------------------------------------------------
const cv = $('cv');
const ptr = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function lampGo(d) {
  const L = S.lamp;
  if (L.ask || d === L.d) return;
  L.d = d; L.verdict = null;
  if (!L.tried.includes(d) && L.tried.length >= 2) { L.ask = { d, opts: OPTS[d] }; L.ruleOpen = false; }
  else { L.shown = d; L.litT = now(); if (!L.tried.includes(d)) L.tried.push(d); sfx.snap(); }
  render();
}
const moveLamp = (ev) => { S.lamp.lx = clamp((GL.wallX - ptr(ev).x) / GL.u, 1, 4); };
cv.addEventListener('pointerdown', (ev) => {
  const p = ptr(ev);
  if (S.sec) return;
  if (lab.view === 'lamp') {
    const L = S.lamp; if (L.ask || p.y > GL.sideH) return;
    L.drag = true; cv.setPointerCapture?.(ev.pointerId); moveLamp(ev); sfx.tick();
  } else if (lab.view === 'sky') {
    const hit = GS.filter((s) => Math.hypot(s.x - p.x, s.y - p.y) <= (s.id === 'sun' ? s.r : Math.max(s.r, 22))).sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y))[0];
    S.sky.sel = hit && S.sky.sel !== hit.id ? hit.id : null; if (hit) sfx.tick(); render();
  }
});
cv.addEventListener('pointermove', (ev) => { if (S.lamp.drag) moveLamp(ev); });
const endDrag = () => { const L = S.lamp; if (!L.drag) return; L.drag = false; lampGo(Math.round(L.lx)); };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, L = S.lamp, K2 = S.two, K3 = S.sky;
  if (act === 'dist') { lampGo(+b.dataset.k); return; }
  if (act === 'ans') {
    const n = +b.dataset.n, d = L.ask.d, ok = n === d * d;
    L.ask = null; L.shown = d; L.litT = now(); L.tried.push(d); L.verdict = ok ? 'ok' : 'no'; L.vn = d * d;
    if (ok && d >= 3) L.ruleOpen = true;
    (ok ? sfx.good : sfx.bad)(); showStage(); render(); return;
  }
  if (act === 'rule') { L.ruleOpen = !L.ruleOpen; sfx.click(); render(); return; }
  if (act === 'again1') { Object.assign(L, { d: 1, lx: L.lx, tried: [1], ask: null, shown: 1, litT: now(), verdict: null, ruleOpen: false }); sfx.click(); render(); return; }
  if (act === 'g2') {
    const i = +b.dataset.i; K2.guess = i; K2.phase = 'play'; K2.verdict = i === 1 ? 'ok' : 'no'; (i === 1 ? sfx.good : sfx.bad)(); showStage(); render(); return;
  }
  if (act === 'again2') { Object.assign(K2, { B: 4, Sm: 1, phase: 'predict', guess: null, verdict: null, cover: 1, done: false }); sfx.click(); render(); return; }
  if (act === 'card') {
    if (K3.revealed) return;
    const id = b.dataset.id, i = K3.rank.indexOf(id);
    if (i >= 0) K3.rank.length = i; else K3.rank.push(id);
    K3.sel = id; sfx.tick(); render(); return;
  }
  if (act === 'undo') { K3.rank.pop(); sfx.click(); render(); return; }
  if (act === 'check') {
    if (K3.rank.length < 5) return;
    K3.revealed = true; K3.verdict = K3.rank.every((id, i) => id === TRUE[i]) ? 'ok' : 'no'; (K3.verdict === 'ok' ? sfx.good : sfx.bad)(); showStage(); render(); return;
  }
  if (act === 'again3') { Object.assign(K3, { rank: [], revealed: false, sel: null, verdict: null }); sfx.click(); render(); return; }
  if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    L.ruleOpen = false;
    if (S.sec === k) S.sec = null;
    else { S.sec = k; S.secT = now(); if (lab.view !== 'sky') { lab.view = 'sky'; lab.renderChrome(); } showStage(); }
    sfx.click(); render();
  }
});
const sliderIn = (key, prop) => (ev) => {
  const K = S.two;
  if (K.phase === 'predict') { ev.target.value = K[prop]; return; }
  K[prop] = +ev.target.value; sfx.tick();
  if (!K.done && 4 * K.Sm * K.Sm === K.B * K.B) { K.done = true; sfx.good(); }
  render();
};
$('nbSB').addEventListener('input', sliderIn('B', 'B'));
$('nbSS').addEventListener('input', sliderIn('S', 'Sm'));
ruleEl.addEventListener('click', () => { S.lamp.ruleOpen = false; sfx.click(); render(); });
function changeView() { S.sec = null; S.lamp.ruleOpen = false; S.sky.sel = null; render(); }

// --- html side -----------------------------------------------------------------------------------------------
function pillOf(v) { return v === 'ok' ? 'right' : v === 'no' ? 'notq' : ''; }
const colOf = (v) => (v === 'ok' ? '#2fbf84' : v === 'no' ? '#e59a1f' : '#4ea8ff');
function renderLamp(t) {
  const L = S.lamp, asking = !!L.ask;
  $('nbQ').textContent = asking ? t.qLamp : t.pickL;
  $('nbOpts').innerHTML = asking ? L.ask.opts.map((n) => `<button class="nb-opt" data-act="ans" data-n="${n}">${n}</button>`).join('') : '';
  $('nbDist').innerHTML = [1, 2, 3, 4].map((k) => `<button class="nb-chip ${L.d === k ? 'on' : ''}" data-act="dist" data-k="${k}" ${asking ? 'disabled' : ''}>${k} ${t.m}</button>`).join('')
    + (L.tried.length >= 3 ? `<button class="nb-chip ${L.ruleOpen ? 'on' : ''}" data-act="rule">${esc(t.showRule)}</button>` : '')
    + (L.tried.length >= 4 && !asking ? `<button class="nb-chip" data-act="again1">↺ ${esc(t.again)}</button>` : '');
  const rows = [...L.tried].sort((a, b) => a - b);
  $('nbTable').innerHTML = `<table class="nb-table"><thead><tr>${t.th.map((x) => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map((d) =>
    `<tr><td>${d} ${t.m}</td><td>${d * d}</td><td><i class="nb-sw" style="background:${mix('#262d4a', '#ffe9ad', .2 + .8 * lvOf(1 / (d * d)))}"></i>${d === 1 ? '1' : `1/${d * d}`}</td></tr>`).join('')}</tbody></table>`;
  const pk = pillOf(L.verdict);
  const pill = pk === 'notq' ? `${t.notq}: ${t.tilesN(L.vn)}` : pk ? t[pk] : '';
  lab.setReadout(`${asking ? L.d : L.shown} ${esc(t.m)}`, asking ? '' : t.tilesN(L.shown * L.shown), pill, colOf(L.verdict));
  lab.setState({ emo: '💡', title: t.views.lamp, lead: t.state.lamp[0], body: t.state.lamp[1] });
}
function renderTwo(t) {
  const K = S.two, pred = K.phase === 'predict';
  $('nbQ2').textContent = pred ? t.qTwo : '';
  $('nbQ2').hidden = !pred;
  $('nbOpts2').innerHTML = pred ? t.optsTwo.map((o, i) => `<button class="nb-opt" data-act="g2" data-i="${i}">${esc(o)}</button>`).join('') : '';
  $('nbSB').disabled = pred; $('nbSS').disabled = pred;
  $('nbSB').value = K.B; $('nbSS').value = K.Sm;
  $('nbLB').textContent = `${t.bigN}: ${K.B} ${t.m}`; $('nbLS').textContent = `${t.smallN}: ${K.Sm} ${t.m}`;
  $('nbChal').hidden = pred; $('nbChal').className = `nb-chal ${K.done ? 'ok' : ''}`;
  $('nbChal').textContent = `${K.done ? '✓ ' : ''}${t.chal}${K.done ? ` ${t.chalOk}` : ''}`;
  $('nbTwoBtn').innerHTML = pred ? '' : `<button class="nb-chip" data-act="again2">↺ ${esc(t.again)}</button>`;
  const cmp = 4 * K.Sm * K.Sm - K.B * K.B, looks = cmp > 0 ? 0 : cmp < 0 ? 1 : 2; // big lamp looks brighter when 4·Sm² > B²
  const pk = pillOf(K.verdict);
  if (pred) lab.setReadout(`${K.B} ${esc(t.m)} · ${K.Sm} ${esc(t.m)}`, `${t.bigN} · ${t.smallN}`, '', '#4ea8ff');
  else lab.setReadout(`${esc(t.looksW)}: ${esc(t.optsTwo[looks])}`, `${t.reallyW}: ${t.optsTwo[0]}`, K.done ? '✓' : pk ? t[pk] : '', K.done ? '#2fbf84' : colOf(K.verdict));
  lab.setState({ emo: '💡', title: t.views.two, lead: t.state.two[0], body: pred ? t.state.two[1] : t.state.two[2] });
}
function renderSky(t) {
  const K = S.sky, list = K.revealed ? TRUE : DISP;
  $('nbQ3').textContent = t.qSky;
  $('nbCards').innerHTML = list.map((id) => {
    const r = K.rank.indexOf(id), tr = TRUE.indexOf(id), bd = K.revealed ? tr + 1 : r >= 0 ? r + 1 : '';
    return `<button class="nb-card ${r >= 0 ? 'on' : ''} ${K.revealed ? `rv ${r === tr ? 'ok' : 'no'}` : ''} ${K.sel === id ? 'sel' : ''}" data-act="card" data-id="${id}">
      <span class="nb-bd">${bd}</span><span class="nb-dot" style="background:${SCOL[id]}"></span>
      <span class="nb-nm"><b>${esc(t.names[id])}</b><i>${esc(t.dist[id])}</i></span>${K.revealed ? `<span class="nb-pw">${esc(t.pow[id])}</span>` : ''}</button>`;
  }).join('');
  $('nbSkyBtns').innerHTML = K.revealed ? `<button class="nb-chip" data-act="again3">↺ ${esc(t.again)}</button>`
    : `<button class="btn" data-act="check" ${K.rank.length < 5 ? 'disabled' : ''}>${esc(t.check)}</button>${K.rank.length ? `<button class="nb-chip" data-act="undo">${esc(t.undo)}</button>` : ''}`;
  const pk = pillOf(K.verdict);
  lab.setReadout(`${K.revealed ? 5 : K.rank.length} / 5`, '', pk ? t[pk] : '', colOf(K.verdict));
  lab.setState({ emo: '🌟', title: t.views.sky, lead: t.state.sky[0], body: K.revealed ? t.state.sky[2] : t.state.sky[1] });
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v;
  $('nbLamp').hidden = !!sec || v !== 'lamp'; $('nbTwo').hidden = !!sec || v !== 'two'; $('nbSky').hidden = !!sec || v !== 'sky';
  const open = secret.unlocked();
  $('nbSecs').innerHTML = [['a', '🔭'], ['b', '💥']].map(([k, emo]) =>
    `<button class="nb-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  // rule card of the lamp view
  const showRule = S.lamp.ruleOpen && v === 'lamp' && !sec;
  ruleEl.style.display = showRule ? '' : 'none';
  if (showRule) {
    ruleEl.innerHTML = `<button class="nb-x" type="button" aria-label="×">×</button><h3>${esc(t.ruleTitle)}</h3><p>${esc(t.rule)}</p><div class="nb-mini">${[1, 2, 3, 4].map((n) =>
      `<div><div class="nb-g" style="grid-template-columns:repeat(${n},9px);--c:${mix('#262d4a', '#ffe9ad', .2 + .8 * lvOf(1 / (n * n)))}">${'<i></i>'.repeat(n * n)}</div><b>${n} ${esc(t.m)}</b><span>${n === 1 ? '1' : `1/${n * n}`}</span></div>`).join('')}</div>`;
  }
  if (sec) {
    lab.setReadout(sec === 'a' ? esc(t.dFar) : esc(t.names.rig), sec === 'a' ? t.names.sun : t.inPlace, '', sec === 'a' ? '#ffd35c' : '#a9c6ff');
    lab.setState({ emo: sec === 'a' ? '🔭' : '💥', title: t.secrets[sec][0], lead: t.secrets[sec][1], body: t.secLab[sec] });
    lab.setFacts(t.facts.sky);
    return;
  }
  if (v === 'lamp') renderLamp(t); else if (v === 'two') renderTwo(t); else renderSky(t);
  lab.setFacts(t.facts[v]);
}
render();
