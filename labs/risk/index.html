  for (let i = 0; i < 4; i++) if (Math.hypot(x - DX[i], y - 100) < 38) { S5.sel = S5.sel === i ? null : i; sfx.tick(); render(); return; }
  for (let p = 0; p < 4; p++) if (Math.abs(x - DX[p]) < 40 && y > 220 && y < 360) {
    if (S5.sel === null) { const j = S5.pair.indexOf(p); if (j >= 0) { S5.sel = j; S5.pair[j] = -1; sfx.tick(); render(); } return; }
    for (let j = 0; j < 4; j++) if (S5.pair[j] === p) S5.pair[j] = -1;
    S5.pair[S5.sel] = p; S5.sel = null; sfx.snap(); render(); return;
  }
}

// --- the main loop ---------------------------------------------------------------------------------------------
let VW = { sc: 1, ox: 0, oy: 0 };
canvasLoop($('cv'), (c, w, h, dt, t) => {
  const sc = Math.min(w / W, h / H, 1.7); VW = { sc, ox: (w - W * sc) / 2, oy: (h - H * sc) / 2 };
  c.save(); c.translate(VW.ox, VW.oy); c.scale(sc, sc);
  c.beginPath(); c.rect(0, 0, W, H); c.clip();
  const v = lab.view;
  if (S.sec === 'cheese') drawCheese(c, dt);
  else if (S.sec === 'labels') drawLabels(c);
  else if (v === 'grid') drawV1(c, t);
  else if (v === 'ctl') drawV2(c, t);
  else {
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#222a4a'); g.addColorStop(1, '#171c36'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    if (S3.ran && !S3.rev && t - S3.runAt > 3.3) { S3.rev = true; render(); }
    drawRuns(c, t);
  }
  c.restore();
});
function bg(c) { const g = c.createLinearGradient(0, 160, 0, H); g.addColorStop(0, '#1b2140'); g.addColorStop(1, '#141830'); c.fillStyle = g; c.fillRect(0, 160, W, H - 160); }

let drag = null;
function drawV1(c, t) {
  bg(c); drawScene(c, t, {});
  const cur = K1[ORDER1[S1.i]], hl = S1.rev ? cur.cell : null;
  drawGrid(c, hl);
  for (const id of ORDER1) {
    const k = K1[id]; if (k.st === 'wait') continue;
    step(k, t, k.st === 'hold' || k.drag ? 44 : 30);
    const ring = k.st === 'done' ? LC[lvl(...k.cell)] : null;
    if (k.st === 'done' && id === ORDER1[S1.i] && k.ghost && (k.ghost[0] !== k.cell[0] || k.ghost[1] !== k.cell[1])) {
      const [gx, gy] = cellC(...k.ghost); c.save(); c.setLineDash([4, 4]); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.6; rr(c, gx - 15, gy - 15, 30, 30, 8); c.stroke(); c.restore();
    }
    tok(c, k.x, k.y, HZ[id][0], k.sz, { ring });
  }
  if (S1.rev && cur.st === 'done') {
    const [cx, cy] = cellC(...cur.cell);
    pill(c, T[lang].risk(T[lang].lvl[lvl(...cur.cell)]), cx, Math.max(GY + 8, cy - 31), { maxW: 120, stroke: LC[lvl(...cur.cell)] });
  }
  if (S1.rev && cur.ghost && (cur.ghost[0] !== cur.cell[0] || cur.ghost[1] !== cur.cell[1])) { const [gx, gy] = cellC(...cur.ghost); pill(c, T[lang].v1.ghost, gx, gy + 28, { maxW: 90, size: 12 }); }
  // tray hint
  if (!S1.rev && cur.st === 'hold') pill(c, '↑', 180 + 40, 392, { al: 'l', size: 16 });
}
function drawV2(c, t) {
  bg(c);
  const o = { stand: S2.applied.includes('stand') ? 1 : 0, goggles: S2.applied.includes('goggles'), gloves: S2.applied.includes('gloves'), tape: S2.applied.includes('tape'), hairtie: S2.applied.includes('hairtie'), clamp: S2.applied.includes('clamp') };
  drawScene(c, t, o);
  drawGrid(c, null);
  for (const h in K2) {
    const k = K2[h], cl = cells2now()[h]; step(k, t, 30);
    tok(c, k.x, k.y, HZ[h][0], k.sz, { ring: LC[lvl(...cl)] });
  }
  CORD.forEach((id, i) => {
    const x = 30 + i * 60, y = 386, ap = S2.applied.includes(id), pend = S2.pend === id, dg = drag && drag.id === id;
    const px = dg ? drag.x : x, py = dg ? drag.y : pend ? 52 : y;
    if (pend && !dg) { c.save(); c.setLineDash([4, 4]); c.strokeStyle = '#5ab0ff'; c.lineWidth = 2; rr(c, x - 24, y - 24, 48, 48, 12); c.stroke(); c.restore(); }
    tok(c, px, py, CT[id][0], dg || pend ? 46 : 42, { dim: ap, ring: pend ? '#5ab0ff' : null });
    if (ap) { c.save(); c.beginPath(); c.arc(x + 17, y - 17, 8, 0, 7); c.fillStyle = '#3ddc97'; c.fill(); c.strokeStyle = '#0b3a26'; c.lineWidth = 1.4; c.stroke(); c.strokeStyle = '#0b3a26'; c.lineWidth = 2; c.beginPath(); c.moveTo(x + 13.5, y - 17); c.lineTo(x + 16.5, y - 14); c.lineTo(x + 21, y - 20); c.stroke(); c.restore(); }
    pill(c, T[lang].ct[id][0], x, 417, { maxW: 58 });
  });
}
const cells2now = () => cellsWith(S2.applied);
function layout2(d = .6) {
  const cs = cells2now(), groups = {};
  for (const h in K2) (groups[cs[h].join()] ??= []).push(h);
  for (const key in groups) { const g = groups[key], [l, s] = cs[g[0]], [cx, cy] = cellC(l, s), sp = Math.min(34, (CW - 8) / g.length); g.forEach((h, j) => go(K2[h], cx + (j - (g.length - 1) / 2) * sp, cy, d)); }
}
layout2(0);
function layout1() {
  const groups = {};
  for (const id of ORDER1) { const k = K1[id]; if (k.cell) (groups[k.cell.join()] ??= []).push(k); else if (k.st === 'hold') go(k, 180, 392, .35); }
  for (const key in groups) { const g = groups[key], [l, s] = g[0].cell, [cx, cy] = cellC(l, s), sp = Math.min(32, (CW - 8) / g.length); g.forEach((k, j) => go(k, cx + (j - (g.length - 1) / 2) * sp, cy, .55)); }
}

// --- input ---------------------------------------------------------------------------------------------------
const cv = $('cv');
const dp = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - VW.ox) / VW.sc, (ev.clientY - r.top - VW.oy) / VW.sc]; };
function setGuess(cl) { const cur = K1[ORDER1[S1.i]]; S1.guess = cl; cur.st = cl ? 'guess' : 'hold'; cur.cell = cl; layout1(); if (cl) sfx.snap(); render(); }
cv.addEventListener('pointerdown', (ev) => {
  const [x, y] = dp(ev), v = lab.view;
  if (S.sec === 'cheese') {
    for (let i = 0; i < 4; i++) if (Math.abs(x - SLICE_X[i]) < 26 && y > 20 && y < 340) { drag = { kind: 'slice', i, y0: y, o0: S4.sl[i].off }; break; }
  } else if (S.sec === 'labels') { tapLabels(x, y); return; }
  else if (v === 'grid' && !S1.rev) {
    const cur = K1[ORDER1[S1.i]];
    if (Math.hypot(x - cur.x, y - cur.y) < 28) { drag = { kind: 'tok', sx: x, sy: y, moved: false }; cur.drag = true; cur.d = 0; }
    else { const cl = cellAt(x, y); if (cl) setGuess(cl); }
  } else if (v === 'ctl' && !S2.pend) {
    CORD.forEach((id, i) => { if (!drag && !S2.applied.includes(id) && Math.hypot(x - (30 + i * 60), y - 386) < 28) drag = { kind: 'ctrl', id, sx: x, sy: y, x, y, moved: false }; });
  }
  if (drag) { try { cv.setPointerCapture(ev.pointerId); } catch { /* ignore */ } }
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return; const [x, y] = dp(ev);
  if (drag.kind === 'slice') { S4.sl[drag.i].off = clamp(drag.o0 + (y - drag.y0), -32, 32); return; }
  if (Math.hypot(x - drag.sx, y - drag.sy) > 6) drag.moved = true;
  if (drag.kind === 'tok') { const cur = K1[ORDER1[S1.i]]; cur.x = x; cur.y = y; } else { drag.x = x; drag.y = y; }
});
const endDrag = (ev) => {
  if (!drag) return; const d = drag; drag = null; const [x, y] = dp(ev);
  if (d.kind === 'tok') {
    const cur = K1[ORDER1[S1.i]]; cur.drag = false;
    if (d.moved) { const cl = cellAt(x, y); setGuess(cl); if (!cl) go(cur, 180, 392, .35); }
    else { cur.x = cur.fx = cur.tx = cur.x; layout1(); }
  } else if (d.kind === 'ctrl') {
    if (!d.moved || y < 170) { S2.pend = d.id; S2.msg = null; sfx.click(); render(); }
  }
};
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function check1() {
  if (S1.rev || !S1.guess) return;
  const id = ORDER1[S1.i], cur = K1[id], ex = HZ[id][1], g = S1.guess, d = Math.max(Math.abs(g[0] - ex[0]), Math.abs(g[1] - ex[1]));
  cur.ghost = g; cur.cell = ex; cur.st = 'done'; S1.rev = true; S1.res.push(Math.min(2, d)); layout1(); (d === 0 ? sfx.good : d === 1 ? sfx.snap : sfx.bad)(); showStage(); render();
}
function next1() {
  if (!S1.rev) return;
  if (S1.i >= 5) { S1.i = 6; render(); return; }
  S1.i++; S1.guess = null; S1.rev = false; K1[ORDER1[S1.i]].st = 'hold'; go(K1[ORDER1[S1.i]], 180, 392, 0); K1[ORDER1[S1.i]].x = 180; K1[ORDER1[S1.i]].y = 392; sfx.click(); render();
}
function again1() {
  ORDER1.forEach((id) => { Object.assign(K1[id], mk(180, 392), { st: 'wait', cell: null, ghost: null }); });
  Object.assign(S1, { i: 0, guess: null, rev: false, res: [] }); K1[ORDER1[0]].st = 'hold'; sfx.click(); render();
}
function predict2(kind) {
  const id = S2.pend; if (!id) return;
  const right = (CT[id][1] === 'likely') === (kind === 0);
  S2.applied.push(id); S2.pend = null; S2.msg = { id, right };
  layout2(.7); (right ? sfx.good : sfx.bad)(); showStage(); render();
}
function runSim() {
  if (!S3.rev && S3.pred === null) return;
  S3.ran = true; S3.runAt = now(); S3.rev = false; sfx.click(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return; const id = b.id;
  if (id === 'b1c') check1(); else if (id === 'b1n') (S1.i >= 6 ? again1() : next1());
  else if (id === 'b2r') { S2.applied = []; S2.pend = null; S2.msg = null; layout2(.6); sfx.click(); render(); }
  else if (b.dataset.p2 !== undefined) predict2(+b.dataset.p2);
  else if (b.dataset.p3 !== undefined) { S3.pred = +b.dataset.p3; sfx.tick(); render(); }
  else if (b.dataset.md) { S3.mode = b.dataset.md; if (S3.rev) S3.runAt = -99; sfx.click(); render(); }
  else if (id === 'b3r') runSim();
  else if (id === 'bcs') { S4.sl.forEach((s) => { s.off = (Math.random() - .5) * 64; }); S4.tries = 0; S4.thru = 0; S4.ar = []; sfx.click(); render(); }
  else if (id === 'blc') {
    if (S5.checked) { S5.pair = [-1, -1, -1, -1]; S5.sel = null; S5.checked = false; sfx.click(); }
    else if (S5.pair.every((p) => p >= 0)) { S5.checked = true; S5.sel = null; (S5.pair.every((p, i) => BOT[p] === i) ? sfx.good : sfx.bad)(); }
    render();
  } else if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; sfx.click(); render();
  }
});

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.drag = sec === 'cheese' || (!sec && (v === 'grid' || v === 'ctl')) ? '1' : '0';
  const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  show('s1', !sec && v === 'grid'); show('s2', !sec && v === 'ctl'); show('s3', !sec && v === 'run'); show('sc', sec === 'cheese'); show('sl', sec === 'labels');
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('cheese', '🧀') + sc('labels', '🔶');
  $('fine').textContent = t.fine;
  lab.setFacts(t.facts[v]);
  if (sec === 'cheese') return renderCheese(t);
  if (sec === 'labels') return renderLabels(t);
  if (v === 'grid') renderV1(t); else if (v === 'ctl') renderV2(t); else renderV3(t);
}
function renderV1(t) {
  const q = t.v1, end = S1.i >= 6, id = ORDER1[Math.min(S1.i, 5)], cur = K1[id];
  lab.setGlow('rgba(245, 200, 76, .22)');
  $('b1c').style.display = end ? 'none' : ''; $('b1c').textContent = q.check; $('b1c').disabled = S1.rev || !S1.guess;
  $('b1n').style.display = end || S1.rev ? '' : 'none'; $('b1n').textContent = end ? q.again : S1.i >= 5 ? q.results : q.next;
  if (end) {
    const a = cnt(S1.res, 0), b = cnt(S1.res, 1), c_ = cnt(S1.res, 2);
    $('q1').textContent = '';
    lab.setReadout(`${a}/6`, t.v1.sub, '', '#f5c84c');
    lab.setState({ emo: '📍', title: q.endT(a, b, c_), lead: q.endL, body: '', extra: '' });
    return;
  }
  $('q1').textContent = S1.rev ? '' : t.hz[id][0] + ' — ' + (S1.guess ? q.held : q.drag);
  if (!S1.rev) {
    lab.setReadout('?', q.card(S1.i + 1, 6), '', '#f5c84c');
    lab.setState({ emo: HZ[id][0], title: t.hz[id][0], lead: S1.guess ? q.held : q.drag, body: '', extra: '' });
  } else {
    const d = S1.res[S1.i], w = t.lvl[lvl(...cur.cell)];
    lab.setReadout(t.risk(w), q.card(S1.i + 1, 6), q.verdict[d], LC[lvl(...cur.cell)]);
    lab.setState({ emo: d === 0 ? '✅' : '📍', title: `${q.verdict[d]} ${t.risk(w)}`, lead: q.vlead[d], body: t.hz[id][1], extra: '' });
  }
}
function renderV2(t) {
  const q = t.v2, cs = cells2now(), lv = Object.values(cs).map((c_) => lvl(...c_)), n = (k) => lv.filter((x) => x === k).length;
  lab.setGlow('rgba(61, 220, 151, .2)');
  lab.setReadout(`<span style="color:${LC[2]}">${n(2)}</span> · <span style="color:${LC[1]}">${n(1)}</span> · <span style="color:${LC[0]}">${n(0)}</span>`, q.sub, '', '#3ddc97');
  $('pr2').innerHTML = S2.pend ? `<button class="chip" data-p2="0">${esc(q.l1)}</button><button class="chip" data-p2="1">${esc(q.l2)}</button>` : '';
  $('q2').textContent = S2.pend ? q.q(t.ct[S2.pend][0]) : q.pick;
  $('b2r').style.display = S2.applied.length ? '' : 'none'; $('b2r').textContent = q.reset;
  let st;
  if (S2.pend) st = { emo: CT[S2.pend][0], title: q.q(t.ct[S2.pend][0]), lead: `${q.l1} / ${q.l2}`, body: '' };
  else if (S2.msg) { const m = S2.msg, k = CT[m.id][1] === 'likely' ? 0 : 1; st = { emo: m.right ? '✅' : '🤔', title: m.right ? T[lang].v1.verdict[0] : q.wrong(q.kinds[k]), lead: t.ct[m.id][1], body: '' }; }
  else st = { emo: '🧪', title: q.start, lead: q.startL, body: '' };
  if (!S2.pend && S2.applied.length === CORD.length) st = { emo: '🛡️', title: q.allT, lead: q.allL, body: S2.msg ? t.ct[S2.msg.id][1] : '' };
  lab.setState({ ...st, extra: '' });
}
function renderV3(t) {

  const first = !S3.ran;
  $('pr3').innerHTML = !S3.rev && !S3.ran ? q.opts.map((o, i) => `<button class="chip ${S3.pred === i ? 'on' : ''}" data-p3="${i}">${esc(o)}</button>`).join('') : '';
  $('q3').textContent = !S3.rev && !S3.ran ? q.q : '';
  $('md3').innerHTML = ['np', 'pl'].map((k) => `<button data-md="${k}" class="${S3.mode === k ? 'on' : ''}">${esc(q[k])}</button>`).join('');
  $('b3r').textContent = S3.ran ? q.again : q.run; $('b3r').disabled = first && S3.pred === null;
  if (!S3.rev) {
    lab.setReadout('?', q.of, '', '#ff5a4d');
    lab.setState({ emo: S3.ran ? '🎲' : '🤔', title: S3.ran ? q.running : first && S3.pred === null ? q.readyT : q.readyT, lead: first && S3.pred === null ? q.pickFirst : q.plan, body: S3.ran ? '' : q.plan, extra: '' });
    if (first) lab.setState({ emo: '🤔', title: q.readyT, lead: S3.pred === null ? q.q : q.plan, body: S3.pred === null ? q.plan : '', extra: '' });
    return;

  const ps = cnt(pl, 2), pm = cnt(pl, 1), ns = cnt(np, 2), nm = cnt(np, 1), s = cnt(res, 2), m = cnt(res, 1);
  lab.setReadout(s, q.subSer, q.pillSm(m), '#ff5a4d');
  const p = S3.pred, title = p === 1 ? q.rightT : p === 0 ? q.zeroT : q.sameT, lead = p === 1 ? q.rightL : p === 0 ? q.zeroL : q.sameL;

  lab.setState(S4.tries ? { emo: '🧀', title: c.title(S4.thru, S4.tries), lead: c.lead, body: '', extra: '' } : { emo: '🧀', title: c.wait, lead: c.waitL, body: '', extra: '' });
}

  if (!S5.checked) { lab.setReadout('?', `${S5.pair.filter((p) => p >= 0).length}/4`, '', '#e0261b'); lab.setState({ emo: '🔶', title: l.t0, lead: l.t0l, body: '', extra: '' }); }
  else { const n = S5.pair.filter((p, i) => BOT[p] === i).length; lab.setReadout(`${n}/4`, l.right(n), '', n === 4 ? '#3ddc97' : '#e0261b'); lab.setState({ emo: n === 4 ? '✅' : '🔶', title: l.right(n), lead: l.lead, body: '', extra: '' }); }
}
render();
