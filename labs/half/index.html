    c.strokeStyle = 'rgba(20,100,60,.6)'; c.lineWidth = .028; c.lineCap = 'round';
    for (const y of [-.6, -.3, 0, .3, .55]) { c.beginPath(); c.moveTo(0, y + .1); c.quadraticCurveTo(.2, y + .02, .36 - Math.abs(y) * .2, y - .16); c.stroke(); }
    c.strokeStyle = '#12603A'; c.lineWidth = .05; c.beginPath(); c.moveTo(0, -.9); c.lineTo(0, .88); c.stroke();
    c.strokeStyle = PAL.choc; c.lineWidth = .06; c.beginPath(); c.moveTo(0, .85); c.lineTo(0, 1.05); c.stroke();
  } else { // face
    c.fillStyle = rad(c, .25, -.3, .1, 0, 0, 1, [[0, '#FFD9B0'], [1, '#EDB27F']]); dot(c, 0, 0, .88); c.fill();
    c.save(); dot(c, 0, 0, .88); c.clip();
    c.beginPath(); c.moveTo(0, -1); c.lineTo(1, -1); c.lineTo(1, -.28); c.bezierCurveTo(.7, -.5, .5, -.6, .25, -.5); c.bezierCurveTo(.12, -.46, .05, -.5, 0, -.5); c.closePath();
    c.fillStyle = lin(c, 0, -1, 0, -.3, [[0, '#8A5230'], [1, PAL.choc]]); c.fill(); c.restore();
    c.strokeStyle = '#7A4A2A'; c.lineWidth = .03; c.lineJoin = 'round'; dot(c, 0, 0, .88); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.ellipse(.32, -.14, .15, .18, 0, 0, TAU); c.fill(); c.strokeStyle = '#7A4A2A'; c.lineWidth = .02; c.stroke();
    c.fillStyle = '#2B1A12'; dot(c, .34, -.12, .085); c.fill(); c.fillStyle = '#fff'; dot(c, .37, -.16, .028); c.fill();
    c.strokeStyle = '#4A2A18'; c.lineWidth = .035; c.lineCap = 'round'; c.beginPath(); c.arc(.32, -.1, .24, Math.PI * 1.2, Math.PI * 1.7); c.stroke();
    c.strokeStyle = 'rgba(160,90,60,.7)'; c.lineWidth = .028; c.beginPath(); c.moveTo(.0, .02); c.quadraticCurveTo(.06, .2, .0, .2); c.stroke();
    c.fillStyle = 'rgba(229,72,77,.32)'; dot(c, .5, .22, .11); c.fill();
    c.strokeStyle = '#A8392F'; c.lineWidth = .045; c.beginPath(); c.moveTo(0, .45); c.quadraticCurveTo(.22, .62, .42, .36); c.stroke();
  }
  c.restore();
}
function drawPicCell(c, kind, x, y, sp, f, time) {
  c.save(); c.translate(x, y); c.scale(sp, sp);
  const px = 1 / sp, ct = Math.cos(Math.PI * f), lift = Math.sin(Math.PI * f), won = clamp01((f - .85) / .15);
  rrect(c, -1.2, -1.08, 2.4, 2.16, .16); c.fillStyle = 'rgba(255,255,255,.07)'; c.fill(); c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 1.5 * px; c.stroke();
  if (won > 0) { c.save(); c.shadowColor = rgba(PAL.green, .95 * won); c.shadowBlur = 22 * dpr; drawHalfPic(c, kind); c.restore(); }
  drawHalfPic(c, kind);
  c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 14 * dpr * lift; c.shadowOffsetY = 8 * dpr * lift;
  const sx = Math.abs(ct) < .02 ? (ct < 0 ? -.02 : .02) : ct;
  c.translate(0, -.03 * lift); c.scale(-sx, 1); drawHalfPic(c, kind); c.restore();
  c.setLineDash([.06, .05]); c.lineDashOffset = -time * .1; c.lineCap = 'round'; c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2.5 * px;
  strokePath(c, [[0, -1.02], [0, 1.02]]);
  if (won > 0) badge(c, [1.0, -.88], true, easeOutBack(won), px);
  c.restore();
}
function drawMirror(c, w, h, time, dt) {
  const R = region(w, h), land = w >= h * 1.25;
  S.cells = [];
  for (let k = 0; k < 3; k++) {
    S.fold[k] += clamp(S.foldT[k] - S.fold[k], -dt / .9, dt / .9);
    const cw = land ? R.w / 3 : R.w, ch = land ? R.h : R.h / 3, x = R.x + (land ? cw * k : 0), y = R.y + (land ? 0 : ch * k);
    const sp = Math.min(cw * .4, ch * .44);
    S.cells.push({ x, y, w: cw, h: ch, k });
    drawPicCell(c, k, x + cw / 2, y + ch / 2, sp, easeIO(S.fold[k]), time);
  }
}

// --- secret 2: how to write a half ----------------------------------------------------------------------------------------------
function drawSign(c, w, h, time) {
  const R = region(w, h), land = w >= h * 1.15, t = T[lang], local = Math.max(0, time - S.signT0);
  const pz = land ? { x: R.x, y: R.y, w: R.w * .55, h: R.h } : { x: R.x, y: R.y, w: R.w, h: R.h * .56 };
  drawBoard(c, pz.x, pz.y, pz.w, pz.h);
  const food = FOODS.pizza, gap = .16, sep = easeIO(local / .5) * gap, lit = easeIO((local - .5) / .4);
  const Sz = Math.min(pz.w * .92 / (2 + gap), pz.h * .86 / 2), cx = pz.x + pz.w / 2, cy = pz.y + pz.h / 2;
  const halves = [clipHalf(food.poly, [0, -1], [0, 1], 1), clipHalf(food.poly, [0, -1], [0, 1], -1)];
  c.save(); c.translate(cx, cy); c.scale(Sz, Sz);
  halves.forEach((poly, i) => {
    const on = i === S.signSide, o = (i ? 1 : -1) * sep / 2;
    c.save(); c.translate(o, 0); c.globalAlpha = on ? 1 : 1 - .6 * lit;
    drawPiece(c, food, poly, Sz, on ? lit * .25 : 0); c.restore();
    if (on && lit > 0) strokeGlow(c, poly.map(([x, y]) => [x + o, y]), PAL.cheese, lit, 1 / Sz);
  });
  c.restore();
  S.cells = [{ x: pz.x, y: pz.y, w: pz.w, h: pz.h, k: 0 }];
  // the fraction builds itself
  const fs = Math.min(64, R.h * .22), fx = land ? R.x + R.w * .55 + R.w * .45 * .36 : R.x + R.w * .3, fy = land ? R.y + R.h * .5 : R.y + R.h * .56 + (R.h * .44) * .5;
  const u1 = (local - 1) / .55, u2 = (local - 1.65) / .4, u3 = (local - 2.05) / .55, u4 = clamp01((local - 2.8) / .5);
  c.save(); c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `900 ${fs}px Nunito, sans-serif`;
  if (u1 > 0) { const e = easeOutBack(u1); c.globalAlpha = clamp01(u1 * 2); c.fillStyle = PAL.cheese; c.fillText('1', fx, fy - fs * .62 - (1 - e) * 70); }
  if (u2 > 0) { c.globalAlpha = 1; c.strokeStyle = '#fff'; c.lineCap = 'round'; c.lineWidth = 6; strokePath(c, [[fx - fs * .5 * easeIO(u2), fy], [fx + fs * .5 * easeIO(u2), fy]]); }
  if (u3 > 0) { const e = easeOutBack(u3); c.globalAlpha = clamp01(u3 * 2); c.fillStyle = '#fff'; c.fillText('2', fx, fy + fs * .62 + (1 - e) * 70); }
  c.restore();
  if (u4 > 0) {
    const note = (text, y, col) => {
      c.save(); c.globalAlpha = u4; c.font = '800 15px Nunito, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left';
      const x = fx + fs * .55, tw = c.measureText(text).width + 22;
      rrect(c, x, y - 15, tw, 30, 15); c.fillStyle = 'rgba(20,16,36,.84)'; c.fill(); c.fillStyle = col; c.fillText(text, x + 11, y + 1); c.restore();
    };
    note(t.sec.one, fy - fs * .62, PAL.cheese); note(t.sec.two, fy + fs * .62, '#fff');
  }
}

// --- main loop ---------------------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  const k = Math.min(1, dt * 10);
  disp.topH += (S.topH - disp.topH) * k; disp.botH += (S.botH - disp.botH) * k;
  rrect(c, 0, 0, w, h, 20); c.fillStyle = rad(c, w * .5, h * .4, 10, w * .5, h * .5, Math.max(w, h) * .75, [[0, '#3B2E5C'], [1, PAL.bg]]); c.fill();
  c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (sec === 'mirror') drawMirror(c, w, h, time, dt);
  else if (sec === 'sign') drawSign(c, w, h, time);
  else if (v === 'cut') drawCut(c, w, h, time);
  else if (v === 'fair') drawFair(c, w, h, time);
  else drawGroup(c, w, h, time);
  const s = V[v];
  if (!sec && s.play && !s.play.done && time - s.play.t0 >= s.play.total) {
    s.play.done = true; if (v === 'group') (s.res[s.i] ? sfx.good : sfx.bad)(); render();
  }
});

// --- input ---------------------------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (sec === 'mirror') {
    const cell = S.cells.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
    if (cell) { S.foldT[cell.k] = S.foldT[cell.k] ? 0 : 1; sfx.snap(); }
    return;
  }
  if (sec === 'sign') {
    const cell = S.cells[0];
    if (cell && x >= cell.x && x <= cell.x + cell.w && y >= cell.y && y <= cell.y + cell.h) { S.signSide = 1 - S.signSide; S.signT0 = now(); sfx.click(); }
    return;
  }
  const s = V[lab.view];
  if (s.play && !s.play.done) { s.play.t0 -= 1e4; return; } // tap to skip the show
  if (lab.view === 'cut' && !s.play) {
    const t = S.tags.find((q) => Math.hypot(q.x - x, q.y - y) < 26);
    if (t) { s.sel = t.k; sfx.tick(); render(); }
  }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act="sec"]'); if (!b) return;
  const k = b.dataset.k;
  if (!secret.unlocked()) return secret.open();
  sec = sec === k ? null : k;
  if (sec === 'sign') S.signT0 = now();
  sfx.click(); render();
});
$('overlay').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const v = lab.view, s = V[v], act = b.dataset.act, k = b.dataset.k;
  if (act === 'sel') { s.sel = +k; sfx.tick(); }
  else if (act === 'go') { if (s.sel === null) return; reveal(s.sel); }
  else if (act === 'ans') reveal(+k);
  else if (act === 'next') {
    if (s.i >= 3) { V[v] = mkV(); sfx.click(); } else { s.i++; s.ans = null; s.sel = null; s.play = null; s.res = s.res.slice(0, s.i); sfx.click(); }
  }
  render();
});
function reveal(a) {
  const v = lab.view, s = V[v];
  s.ans = a;
  if (v === 'cut') {
    const round = CUT_ROUNDS[s.i], cuts = [round.cuts[a]];
    if (a !== round.right) cuts.push(round.cuts[round.right]);
    s.res[s.i] = a === round.right; s.play = { t0: now(), cuts, total: planTotal(cuts.length, true), done: false };
  } else if (v === 'fair') {
    const round = FAIR_ROUNDS[s.i];
    s.res[s.i] = (a === 1) === round.yes; s.play = { t0: now(), total: planTotal(1, false), done: false };
  } else {
    const round = GROUP_ROUNDS[s.i];
    s.res[s.i] = a === round.right; s.play = { t0: now(), total: groupTimes(round.n).total, done: false };
  }
  sfx.click(); showStage();
}

// --- one render per change: question, buttons, readout and the state card ---------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, s = V[v], q = $('hfQ'), bot = $('hfBot');
  document.body.dataset.v = sec ? 'sec' : v;
  $('secCut').style.display = v === 'cut' ? '' : 'none';
  const open = secret.unlocked();
  const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = chip('mirror', '🦋') + chip('sign', '½');
  if (sec) {
    lab.setGlow('rgba(150, 110, 230, .28)');
    q.hidden = false; q.innerHTML = `<div class="hf-t">${esc(t.secrets[sec][1])}</div>`; bot.innerHTML = '';
    lab.setReadout(sec === 'mirror' ? '🦋' : '½', t.secrets[sec][0], '', '#a37ee6');
    lab.setState({ emo: sec === 'mirror' ? '🦋' : '½', title: t.secrets[sec][0], lead: sec === 'mirror' ? t.sec.mirrorText : t.sec.signText, body: '', extra: '' });
    measure(); return;
  }
  const done = !!(s.play && s.play.done), fin = s.i >= 3 && done, round = v === 'group' ? GROUP_ROUNDS[s.i] : null;
  lab.setGlow(v === 'cut' ? 'rgba(217, 160, 78, .28)' : v === 'fair' ? 'rgba(76, 195, 138, .22)' : 'rgba(229, 72, 77, .22)');
  const dots = [0, 1, 2, 3].map((i) => (i < s.i ? '●' : i === s.i ? '◉' : '○')).join(' ');
  const score = s.res.filter(Boolean).length;
  lab.setReadout(fin ? `${score}/4` : `${s.i + 1}/4`, dots, '', v === 'cut' ? PAL.crust : v === 'fair' ? PAL.green : PAL.red);
  const st = t.st[v][fin ? 'f' : 'n'];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
  // top card: the question while the child predicts, the verdict after the show
  q.hidden = false;
  if (done) {
    const ok = s.res[s.i], why = (v === 'cut' ? t.c.why : v === 'fair' ? t.f.why : t.g.why)[s.i];
    q.innerHTML = `<div class="hf-v" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${ok ? '✅' : '🤔'} ${esc(ok ? t.right : t.wrong)}</div><p>${esc(why)}</p>`;
    bot.innerHTML = `<button class="hf-b go" data-act="next">${esc(s.i >= 3 ? t.again : t.next)}</button>`;
  } else {
    q.innerHTML = `<div class="hf-t">${esc(v === 'cut' ? t.c.q : v === 'fair' ? t.f.q : t.g.q(round.n))}</div>`;
    const dis = s.play ? ' disabled' : '';
    if (v === 'cut') bot.innerHTML = [0, 1, 2].map((j) => `<button class="hf-b l ${s.sel === j ? 'on' : ''}" data-act="sel" data-k="${j}"${dis}>${'ABC'[j]}</button>`).join('')
      + `<button class="hf-b go" data-act="go"${s.sel === null || s.play ? ' disabled' : ''}>${esc(t.cutBtn)}</button>`;
    else if (v === 'fair') bot.innerHTML = [[1, t.yes], [0, t.no]].map(([k, l]) => `<button class="hf-b ${s.ans === k ? 'on' : ''}" data-act="ans" data-k="${k}"${dis} style="min-width:96px">${esc(l)}</button>`).join('');
    else bot.innerHTML = round.opts.map((o, j) => `<button class="hf-b ${s.ans === j ? 'on' : ''}" data-act="ans" data-k="${j}"${dis}>${esc(o === 3.5 ? t.g.oHalf : String(o))}</button>`).join('');
  }
  measure();
}
render();
</script>
