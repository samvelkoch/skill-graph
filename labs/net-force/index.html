    const ro = S.rope, rt = t.rope, L = sum(S.L), R = sum(S.R), d = R - L, tot = `◀ ${nn(L)} · ${nn(R)} ▶`;
    glow = 'rgba(80,170,110,.28)'; col = '#5aaa68';
    if (ro.stage === 'build') { r = ['?', tot, '']; st = { emo: '🪢', ...rt.st }; }
    else if (ro.stage === 'ask') { r = ['?', tot, '']; st = { emo: '🤔', title: rt.ask.q, lead: rt.askLead, body: '' }; }
    else { const x = rt.res(L, R, fmt); r = [`${nn(Math.abs(d))}${d ? (d > 0 ? ' ▶' : ' ◀') : ''}`, tot, ro.ok ? t.ok : t.no]; st = { emo: ro.ok ? '✅' : '🤔', title: ro.stage === 'done' && x.win ? x.win : x.title, lead: x.lead, body: x.body }; }
  } else if (sc === 'ice') {
    const I = S.ice, ic = t.ice, f = iceForces(I), a = f.net / I.m; glow = 'rgba(90,170,230,.3)'; col = '#6cc4ff';
    if (I.stage === 'ask') { r = [`${fmt(I.v, 1)} ${u.ms}`, '', '']; st = { emo: '🤔', title: ic.ask.q, lead: ic.askLead, body: '' }; }
    else {
      r = [`${fmt(I.v, 1)} ${u.ms}`, ic.sub(f.net, a, fmt), I.verdict ? (I.ok ? t.ok : t.no) : ''];
      let s, emo = '🛷';
      if (f.net > 0) s = ic.speed(f.F, f.fr, f.net, a, I.m, fmt);
      else if (f.net < 0 && f.F > 0) s = ic.slow(f.F, f.fr, f.net, a, I.m, fmt);
      else if (f.net < 0) s = ic.coastF(f.fr, FRIC / I.m, fmt);
      else if (I.v > 0 && f.F > 0) s = ic.bal;
      else if (I.v > 0) { s = I.answer !== null ? ic.coast0 : ic.neutral; emo = I.answer !== null ? '🧊' : '👀'; }
      else if (f.F > 0) { s = ic.stuck; emo = '🧱'; }
      else s = ic.idle;
      st = { emo, title: s.title, lead: s.lead, body: s.body ?? '' };
    }
  } else if (sc === 'angle') {
    const A = S.ang, an = t.ang, Gm = angGeom(G.w, G.h), f1 = A.f1.len, f2 = A.f2.len; glow = 'rgba(120,150,230,.3)'; col = '#ffd45e';
    if (A.stage === 'ask') { r = ['?', `F₁ ${nn(f1)} · F₂ ${nn(f2)}`, '']; st = { emo: '🤔', title: an.ask.q, lead: an.askLead, body: '' }; }
    else {
      r = [nn(Gm.r.len), `F₁ ${nn(f1)}, ${fmt(A.f1.ang)}° · F₂ ${nn(f2)}, ${fmt(A.f2.ang)}°`, A.fresh ? (A.ok ? t.ok : t.no) : (Gm.r.len > 0.5 ? `∠ ${fmt(Gm.r.ang)}°` : '')];
      st = { emo: A.fresh ? (A.ok ? '✅' : '🤔') : '🧭', ...an.free(f1, f2, Gm.r.len, Gm.th, fmt) };
    }
  } else if (sc === 'probe') {
    const P = S.probe, pr = t.probe; glow = 'rgba(110,80,200,.3)'; col = '#a98bff';
    if (!P.used) { r = [`0 ${u.kms}`, '', '']; st = { emo: '🛰️', ...pr.st0 }; }
    else if (P.burn > 0) { r = [`${fmt(P.v, 1)} ${u.kms}`, pr.subOn, '']; st = { emo: '🔥', ...pr.on, body: '' }; }
    else { r = [`${fmt(P.v, 1)} ${u.kms}`, pr.subOff(distText(P.dist)), P.yrs > 0 ? pr.yr(Math.floor(P.yrs)) : '']; st = { emo: '🛰️', ...pr.coast }; }
  } else {
    const K = S.sky, sk = t.sky, drag = skyC() * K.v * K.v, R = 800 - drag; glow = 'rgba(70,140,220,.32)'; col = '#6cc4ff';
    if (!K.jumped) { r = [`0 ${u.ms}`, '', '']; st = { emo: '🪂', ...sk.st0 }; }
    else {
      r = [`${fmt(K.v, 1)} ${u.ms}`, `≈ ${fmt(K.v * 3.6)} ${u.kmh}`, sk.pill(Math.abs(R) < 8 ? 0 : R, fmt)];
      const s = Math.abs(R) < 8 && K.v > 2 ? sk.bal(K.v, K.v * 3.6, fmt) : R < 0 ? sk.slow(drag, Math.abs(R), fmt) : sk.fall(drag, R, fmt);
      st = { emo: R < 0 ? '🪂' : '⬇️', ...s };
    }
  }
  const facts = v === 'rope' ? t.facts.rope : v === 'ice' ? (S.ice.answer !== null ? t.facts.ice : []) : t.facts.angle;
  const key = JSON.stringify([lang, r, st, facts.length, col]);
  if (key === lastKey) return;
  lastKey = key;
  lab.setGlow(glow); lab.setReadout(esc(r[0]), r[1], r[2], col); lab.setState({ ...st, extra: '' }); lab.setFacts(facts);
}

canvasLoop($('cv'), (ctx, w, h, dt) => {
  G.w = w; G.h = h;
  const sc = scene();
  if (sc === 'rope') drawRope(ctx, w, h, dt); else if (sc === 'ice') drawIce(ctx, w, h, dt); else if (sc === 'angle') drawAngle(ctx, w, h, dt);
  else if (sc === 'probe') drawProbe(ctx, w, h, dt); else drawSky(ctx, w, h, dt);
  upd();
});
render();
</script>
</body>
</html>
