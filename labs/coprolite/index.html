  const cx = w / 2, cy = (40 + pillsTop) / 2;
  shadowUnder(c, cx, cy, SS); drawOuter(c, sp, cx, cy, SS); drawFace(c, sp, cx, cy, SS);
  const rows = [t.labels.size + ': ' + cs.size, t.labels.place + ': ' + cs.place, t.labels.inside + ': ' + cs.inside];
  rows.forEach((s, k) => pill(c, s, w / 2, topH - 6 - 14 - (2 - k) * 29, w, { fs: 13 }));
  if (S.shown) pill(c, t.caseK(S.ci + 1), w / 2, 22, w);
  else pill(c, `${t.caseK(S.ci + 1)} · ${t.qT}`, w / 2, 22, w, { bg: 'rgba(224,176,80,.92)', fg: '#1b1410', stroke: '#fff' });
  // three dinosaur cards
  const gap = 8, cw = (w - gap * 4) / 3, cy0 = topH + 8, ch = cardsH - 2, target = CASES[S.ci].ans;
  for (let k = 0; k < 3; k++) {
    const x = gap + k * (cw + gap), isT = S.shown && k === target, isP = S.pick === k;
    c.save();
    if (isT) { c.shadowColor = 'rgba(61,220,151,.65)'; c.shadowBlur = 14; }
    c.beginPath(); c.roundRect(x, cy0, cw, ch, 14); c.fillStyle = lg(c, 0, cy0, 0, cy0 + ch, '#242c44', '#161b2c'); c.fill(); c.restore();
    c.lineWidth = isT ? 3 : isP ? 2.5 : 1.2; c.strokeStyle = isT ? '#3ddc97' : isP && S.shown ? '#f5c84c' : 'rgba(190,205,255,.3)'; c.beginPath(); c.roundRect(x, cy0, cw, ch, 14); c.stroke();
    const kk = Math.min((cw - 14) / 100, (ch - 58) / 64);
    DINO_FN[k](c, x + (cw - 100 * kk) / 2, cy0 + 10, kk);
    c.font = FONT(800, 12.5); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#EDEFF7';
    wrap(c, t.cards[k], cw - 12).slice(0, 2).forEach((ln, j) => c.fillText(ln, x + cw / 2, cy0 + ch - 30 + j * 15));
    if (S.shown && isT) badge(c, x + cw - 15, cy0 + 15, 'ok');
    else if (S.shown && isP) badge(c, x + cw - 15, cy0 + 15, 'no');
    if (!S.shown) HIT.push({ x, y: cy0, w: cw, h: ch, kind: 'card', i: k });
  }
}

// --- view 3 ------------------------------------------------------------------------------------------------------
function drawClues(c, w, h) {
  const t = T[lang].k, pad = 10, cw = (w - pad * 3) / 2, ch = (h - pad * 3) / 2;
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#1c2233'); bg.addColorStop(1, '#10131f'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 4; i++) {
    const x = pad + (i % 2) * (cw + pad), y = pad + (i >> 1) * (ch + pad), sel = S.c === i, a = S.a[i];
    const good = S.checked && a === ANS3[i], bad = S.checked && a !== ANS3[i];
    c.save(); if (sel) { c.shadowColor = 'rgba(224,176,80,.55)'; c.shadowBlur = 12; }
    c.beginPath(); c.roundRect(x, y, cw, ch, 16); c.fillStyle = lg(c, 0, y, 0, y + ch, '#2d2119', '#1f1611'); c.fill(); c.restore();
    c.lineWidth = sel || S.checked ? 2.6 : 1.2; c.strokeStyle = good ? '#3ddc97' : bad ? '#f5c84c' : sel ? '#e0b050' : 'rgba(190,205,255,.3)';
    c.beginPath(); c.roundRect(x, y, cw, ch, 16); c.stroke();
    c.save(); c.beginPath(); c.roundRect(x + 4, y + 4, cw - 8, ch - 8, 12); c.clip();
    CLUE_PIC[i](c, x + 10, y + 12, cw - 20, ch - 52);
    c.restore();
    c.font = FONT(800, 13); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#EDEFF7';
    c.fillText(t.clues[i], x + cw / 2, y + ch - 20, cw - 16);
    // the letter of the question chosen for this clue (and the right one after checking)
    const bx = x + cw - 18, by = y + 18;
    if (a !== null) {
      c.fillStyle = good ? '#3ddc97' : S.checked ? '#f5c84c' : '#e0b050'; c.strokeStyle = 'rgba(10,12,20,.8)'; c.lineWidth = 1.5; c.beginPath(); c.arc(bx, by, 13, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = '#10141f'; c.font = FONT(900, 14); c.fillText(LETTER[a], bx, by + 0.5);
    } else { c.strokeStyle = 'rgba(190,205,255,.4)'; c.setLineDash([3, 3]); c.lineWidth = 1.3; c.beginPath(); c.arc(bx, by, 13, 0, TAU); c.stroke(); c.setLineDash([]); }
    if (bad) { const rx = bx - 30; c.fillStyle = '#3ddc97'; c.strokeStyle = 'rgba(10,12,20,.8)'; c.lineWidth = 1.5; c.beginPath(); c.arc(rx, by, 13, 0, TAU); c.fill(); c.stroke(); c.fillStyle = '#10141f'; c.font = FONT(900, 14); c.fillText(LETTER[ANS3[i]], rx, by + 0.5); }
    if (!S.checked) HIT.push({ x, y, w: cw, h: ch, kind: 'clue', i });
  }
}

// --- input --------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const cvPos = (ev) => { const r = $('cv').getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top, r.width, r.height]; };
$('cv').addEventListener('pointerdown', (ev) => {
  S.touch = ev.pointerType === 'touch';
  const [x, y, w, h] = cvPos(ev), hit = HIT.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h && q.kind !== 'name') || HIT.find((q) => q.kind === 'name' && x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
  const v = lab.view;
  if (v === 'cut') {
    if (hit?.kind === 'slot') { S.sel = hit.i; S.name = false; S.drag = false; S.auto = false; sfx.click(); render(); return; }
    if (S.name) { S.nameGo = !S.nameGo; sfx.click(); render(); return; }
    const i = S.sel, L = layout1(w, h, i === 3);
    if (S.done[i]) { S.lensDrag = true; moveLens(x, y, L); $('cv').setPointerCapture?.(ev.pointerId); return; }
    if (S.g[i] === null) { S.nudge = now(); sfx.bad(); return; }
    S.drag = true; S.lastX = x; S.sawTX = x; S.p[i] = Math.min(1, S.p[i] + 0.06); sfx.tick(); $('cv').setPointerCapture?.(ev.pointerId); renderControlsOnly();
  } else if (v === 'who') {
    if (hit?.kind === 'card' && !S.shown) { S.pick = hit.i; S.shown = true; S.res[S.ci] = hit.i === CASES[S.ci].ans; (S.res[S.ci] ? sfx.good : sfx.bad)(); render(); showStage(); }
  } else if (hit?.kind === 'clue' && !S.checked) { S.c = hit.i; sfx.tick(); tryAssign(); render(); }
});
function moveLens(x, y, L) {
  if (S.touch) y -= 58; // on touch the lens rides above the finger
  let u = (x - L.cx) / L.S, v = (y - L.cy) / L.S; const k = Math.hypot(u / 1.4, v / 0.9); if (k > 1) { u /= k; v /= k; }
  S.lens = { u, v };
}
$('cv').addEventListener('pointermove', (ev) => {
  if (lab.view !== 'cut') return;
  const [x, y, w, h] = cvPos(ev), i = S.sel, L = layout1(w, h, i === 3);
  if (S.lensDrag && S.done[i]) { moveLens(x, y, L); return; }
  if (!S.drag || S.done[i]) return;
  const dx = x - S.lastX; S.lastX = x; S.sawTX = x;
  S.p[i] = Math.min(1, S.p[i] + Math.abs(dx) / (L.sw * 3.2));
  if (Math.abs(dx) > 1) spawnDust(clamp(x, L.cx - L.S * 1.3, L.cx + L.S * 1.3), L.cy);
});
const endDrag = () => { S.drag = false; S.lensDrag = false; };
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag); $('cv').addEventListener('pointerleave', () => { S.lensDrag = false; });

function tryAssign() {
  if (S.q === null || S.c === null) return;
  const j = S.a.indexOf(S.q); if (j >= 0) S.a[j] = null; // a question goes with one clue only
  S.a[S.c] = S.q; S.q = null; S.c = null; sfx.snap();
}
function renderControlsOnly() { /* the guess chips lock once sawing starts */ document.querySelectorAll('#gChips .chip').forEach((b) => { b.disabled = true; }); }

$('ctrlBody').addEventListener('click', (ev) => {
  const q = ev.target.closest('[data-q]');
  if (q) { if (S.checked) return; const k = +q.dataset.q; S.q = S.q === k ? null : k; sfx.tick(); tryAssign(); render(); return; }
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = S.sel;
  if (act === 'guess') { if (S.p[i] === 0) { S.g[i] = b.dataset.g; sfx.click(); } }
  else if (act === 'saw') { if (S.g[i] !== null && !S.done[i]) { S.auto = true; S.name = false; sfx.push(); } }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (k === 'king') { S.sel = S.sel === 3 ? 0 : 3; S.name = false; } else S.name = !S.name;
    S.auto = false; S.drag = false; sfx.click();
  } else if (act === 'next') { if (S.ci === 1) { S.ci = 0; S.res = [null, null]; } else S.ci = 1; S.pick = null; S.shown = false; sfx.click(); }
  else if (act === 'check') { if (S.a.every((x) => x !== null)) { S.checked = true; S.q = null; S.c = null; const k = S.a.filter((x, j) => x === ANS3[j]).length; (k === 4 ? sfx.good : sfx.bad)(); showStage(); } }
  else if (act === 'clear') { S.a = [null, null, null, null]; S.q = null; S.c = null; S.checked = false; sfx.click(); }
  render();
});

// --- render: controls, readout and the state card -----------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secCut').hidden = v !== 'cut'; $('secWho').hidden = v !== 'who'; $('secClues').hidden = v !== 'clues';
  if (v === 'cut') render1(t); else if (v === 'who') render2(t); else render3(t);
}
function render1(t) {
  const i = S.sel, sp = SP[i], c1 = t.c, f = t.facts, g = S.g[i], done = S.done[i], n = S.done.slice(0, 3).filter(Boolean).length, allCut = S.done[0] && S.done[1] && S.done[2];
  const open = secret.unlocked(), src = (u) => u;
  lab.setGlow('rgba(201, 143, 90, .26)');
  $('gChips').innerHTML = [['meat', c1.gMeat], ['plant', c1.gPlant]].map(([k, l]) => `<button class="chip ${g === k ? 'on' : ''}" data-act="guess" data-g="${k}"${S.p[i] > 0 || S.name ? ' disabled' : ''}>${esc(l)}</button>`).join('');
  $('sawB').textContent = c1.saw; $('sawB').disabled = g === null || done || S.name;
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${(k === 'king' ? i === 3 && !S.name : S.name) ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('king', '🦖') + sc('name', '🏛️');
  if (S.name) {
    lab.setReadout('κόπρος + λίθος', '', '', '#c98f5a');
    lab.setState(S.nameGo ? { emo: '🏛️', title: c1.nameDone, lead: c1.nameDL, body: '', extra: '' } : { emo: '🏛️', title: c1.nameT, lead: c1.nameL, body: '', extra: '' });
    lab.setFacts([{ emo: '🏛️', text: f.greek, src: src(SRC.cop) }]);
    return;
  }
  const pillTxt = done ? `${sp.kind === 'meat' ? '🥩' : '🌿'} ${c1.gl[sp.kind]}` : '';
  lab.setReadout(`${n}/3`, i === 3 ? c1.kingSub : c1.cutSub, pillTxt, '#c98f5a');
  if (!done) {
    if (g === null) lab.setState({ emo: '🤔', title: c1.q, lead: i === 3 ? c1.qK : c1.qL(i + 1), body: '', extra: '' });
    else lab.setState({ emo: '✂️', title: c1.sawT, lead: c1.sawL, body: c1.guessIs(c1.gl[g]), extra: '' });
    lab.setFacts([{ emo: '📏', text: f.size, src: src(SRC.cop) }]);
    return;
  }
  const ok = g === sp.kind;
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? c1.right : c1.wrong, lead: i === 3 ? c1.kingL : sp.kind === 'meat' ? c1.meatL : c1.plantL, body: allCut ? c1.trace : c1.lensTip, extra: '' });
  lab.setFacts(i === 3 ? [{ emo: '🦖', text: f.king1, src: src(SRC.nature) }, { emo: '📍', text: f.king2, src: src(SRC.sask) }]
    : [{ emo: '🔎', text: f.anning, src: src(SRC.anning) }, { emo: '📏', text: f.size, src: src(SRC.cop) }]);
}
function render2(t) {
  const w = t.w, f = t.facts, ci = S.ci;
  lab.setGlow('rgba(95, 168, 160, .24)');
  $('nextB').hidden = !S.shown; $('nextB').textContent = ci === 1 ? w.again : w.next;
  if (!S.shown) {
    lab.setReadout(`${ci + 1}/2`, w.sub, '', '#5fa8a0');
    lab.setState({ emo: '🔍', title: w.qT, lead: w.qL, body: '', extra: '' });
    lab.setFacts([{ emo: '📜', text: f.buckland, src: SRC.cop }]);
    return;
  }
  const ok = S.pick === CASES[ci].ans;
  lab.setReadout(`${ci + 1}/2`, w.sub, w.pill(w.cards[CASES[ci].ans]), '#5fa8a0');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? w.ok : w.bad, lead: w.lead[ci], body: w.body[ci], extra: '' });
  lab.setFacts([{ emo: '❓', text: f.rarely, src: SRC.cop }]);
}
function render3(t) {
  const k = t.k, f = t.facts, set = S.a.filter((x) => x !== null).length, right = S.a.filter((x, j) => x === ANS3[j]).length;
  lab.setGlow('rgba(224, 176, 80, .24)');
  $('qList').innerHTML = k.qs.map((q, j) => {
    const at = S.a.indexOf(j), cls = ['cp-q', S.q === j ? 'on' : '', at >= 0 ? 'set' : '', S.checked && at >= 0 ? (ANS3[at] === j ? 'ok' : 'no') : ''].join(' ');
    return `<button class="${cls}" data-q="${j}"${S.checked ? ' disabled' : ''}><span class="l">${LETTER[j]}</span><span class="t">${esc(q)}</span>${at >= 0 ? `<span class="s">${CLUE_EMO[at]}</span>` : ''}</button>`;
  }).join('');
  $('chkB').textContent = S.checked ? k.again : k.check; $('chkB').dataset.act = S.checked ? 'clear' : 'check';
  $('chkB').disabled = !S.checked && set < 4;
  $('clrB').textContent = k.clear; $('clrB').hidden = S.checked;
  if (!S.checked) {
    lab.setReadout(`${set}/4`, k.sub, '', '#e0b050');
    lab.setState({ emo: '🧩', title: k.preT, lead: k.preL, body: '', extra: '' });
    lab.setFacts([{ emo: '⛏️', text: f.phos, src: SRC.cop }]);
    return;
  }
  lab.setReadout(`${right}/4`, k.sub, k.res(right), '#e0b050');
  lab.setState({ emo: right === 4 ? '🏆' : '🧩', title: k.res(right), lead: k.resL, body: '',
    extra: `<ul class="cp-ex">${k.expl.map((e, j) => `<li>${CLUE_EMO[j]} ${esc(e)}</li>`).join('')}</ul>` });
  lab.setFacts([{ emo: '🦷', text: f.sil, src: SRC.cop }, { emo: '🦴', text: f.bite, src: SRC.trex }]);
}
render();
</script>
