// --- drawing: people ---------------------------------------------------------------------------------------
// pose angles: from straight down, positive = towards where the person looks; n = near arm, f = far arm; [upper arm, forearm]
const POSE = { idle: { n: [0.1, 0.18], f: [-0.08, -0.04] }, offer: { n: [0.95, 1.55], f: [-0.08, -0.04] }, think: { n: [0.55, 2.55], f: [-0.1, -0.05] } };
function person(c, x, y, H, o) {
  const kid = o.kid !== false, hf = kid ? 0.2 : 0.143, tf = kid ? 0.3 : 0.32, lf = kid ? 0.47 : 0.507; // head 1/5 of the height for a child, 1/7 for an adult
  const r = H * hf / 2, hip = y - H * lf, sh = hip - H * tf, hy = sh - H * 0.03 - r * 0.9, sw = H * (kid ? 0.27 : 0.25);
  const look = o.look || 1, skin = o.skin, pose = POSE[o.pose || 'idle'], mood = o.mood || 'neutral';
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round'; c.globalAlpha = 1;

  c.fillStyle = sg; c.beginPath(); c.ellipse(x, y + 1, sw * 1.2, Math.max(1, sw * 0.3), 0, 0, Math.PI * 2); c.fill();

    const g = c.createLinearGradient(0, hy - r, 0, hy + r * 2); g.addColorStop(0, adj(o.hair, 0.12)); g.addColorStop(1, adj(o.hair, -0.25));
    c.fillStyle = g; c.beginPath(); c.roundRect(x - r * 1.08, hy - r * 0.3, r * 2.16, r * 1.3 + H * 0.09, r * 0.9); c.fill();
  }

  for (const s of [-1, 1]) {
    const lx = x + s * sw * 0.2, g = c.createLinearGradient(lx - lw / 2, 0, lx + lw / 2, 0);
    g.addColorStop(0, adj(o.pants, 0.14)); g.addColorStop(1, adj(o.pants, -0.22));
    c.fillStyle = g; c.beginPath(); c.roundRect(lx - lw / 2, hip - H * 0.02, lw, y - hip - H * 0.012, lw * 0.4); c.fill();
    c.fillStyle = '#232842'; c.beginPath(); c.ellipse(lx + look * lw * 0.18, y - H * 0.016, lw * 0.7, H * 0.03, 0, 0, Math.PI * 2); c.fill();

  const tg = c.createLinearGradient(x - sw / 2, sh, x + sw / 2, hip);
  tg.addColorStop(0, adj(o.shirt, 0.2)); tg.addColorStop(1, adj(o.shirt, -0.2));
  c.fillStyle = tg; c.strokeStyle = adj(o.shirt, -0.4); c.lineWidth = 1.2;
  c.beginPath(); c.roundRect(x - sw / 2, sh, sw, H * tf + H * 0.02, sw * 0.32); c.fill(); c.stroke();
  // neck
  c.fillStyle = adj(skin, -0.14); c.beginPath(); c.roundRect(x - r * 0.28, sh - H * 0.045, r * 0.56, H * 0.07, r * 0.2); c.fill();
  // arms: sleeve to the elbow, skin below
  const ua = H * 0.15, fa = H * 0.14;
  for (const near of [false, true]) {
    const s = near ? look : -look, ang = near ? pose.n : pose.f;
    const sx = x + s * (sw / 2 - H * 0.022), sy = sh + H * 0.04, a1 = ang[0] * look, a2 = ang[1] * look;
    const ex = sx + Math.sin(a1) * ua, ey = sy + Math.cos(a1) * ua, hx = ex + Math.sin(a2) * fa, hyy = ey + Math.cos(a2) * fa;
    c.strokeStyle = adj(o.shirt, -0.08); c.lineWidth = H * 0.068; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke();
    c.strokeStyle = skin; c.lineWidth = H * 0.052; c.beginPath(); c.moveTo(ex, ey); c.lineTo(hx, hyy); c.stroke();
    c.fillStyle = adj(o.shirt, -0.08); c.beginPath(); c.arc(ex, ey, H * 0.034, 0, Math.PI * 2); c.fill();
    c.fillStyle = skin; c.beginPath(); c.arc(hx, hyy, H * 0.03, 0, Math.PI * 2); c.fill();
  }

  const hg = c.createRadialGradient(x - r * 0.4, hy - r * 0.4, r * 0.1, x, hy, r * 1.2);
  hg.addColorStop(0, adj(skin, 0.18)); hg.addColorStop(1, adj(skin, -0.12));
  c.fillStyle = adj(skin, -0.1); for (const s of [-1, 1]) { c.beginPath(); c.arc(x + s * r * 0.97, hy + r * 0.05, r * 0.17, 0, Math.PI * 2); c.fill(); }
  c.fillStyle = hg; c.strokeStyle = adj(skin, -0.35); c.lineWidth = 1.1;

    c.beginPath(); c.moveTo(tx, ty); c.quadraticCurveTo(tx + r * 0.14, ty + r * 0.2, tx, ty + r * 0.3); c.quadraticCurveTo(tx - r * 0.14, ty + r * 0.2, tx, ty); c.fill(); c.stroke();

  c.restore();
}

function pill(c, w, text, cx, cy, size, fill, color) {
  c.save(); c.font = `800 ${size}px Nunito, sans-serif`; c.textAlign = 'left'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + 18, x = clamp(cx - tw / 2, 6, Math.max(6, w - 6 - tw));
  c.fillStyle = fill || 'rgba(10,12,20,.8)'; c.beginPath(); c.roundRect(x, cy - size * 0.85, tw, size * 1.7, size * 0.85); c.fill();
  c.fillStyle = color || '#EDEFF7'; c.fillText(text, x + 9, cy + 1); c.restore();
}

function sceneBG(c, w, h, tint, fy, H) {
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#171c3a'); g.addColorStop(1, '#262c58'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  const r = c.createRadialGradient(w * 0.2, h * 0.08, 10, w * 0.2, h * 0.08, w * 0.95); r.addColorStop(0, tint + '55'); r.addColorStop(1, tint + '00'); c.fillStyle = r; c.fillRect(0, 0, w, h);
  const f = c.createLinearGradient(0, fy - H * 0.1, 0, fy + H * 0.14); f.addColorStop(0, '#363d78'); f.addColorStop(1, '#252a54');
  c.fillStyle = f; c.beginPath(); c.ellipse(w / 2, fy + 4, w * 0.47, H * 0.13, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(190,205,255,.16)'; c.lineWidth = 1; c.stroke();
}

// --- drawing: props of view 2 --------------------------------------------------------------------------------
function drawPhone(c, x, y, k, filled, tint) {
  c.save(); c.translate(x, y); c.scale(k, k);
  c.fillStyle = '#0f1224'; c.strokeStyle = '#8f9bd0'; c.lineWidth = 2; c.beginPath(); c.roundRect(-26, -46, 52, 92, 10); c.fill(); c.stroke();
  const g = c.createLinearGradient(0, -40, 0, 40); g.addColorStop(0, '#34457f'); g.addColorStop(1, '#222d58');
  c.fillStyle = g; c.beginPath(); c.roundRect(-22, -38, 44, 76, 6); c.fill();
  [['#e0a458', -14], ['#5fa8a0', -3], ['#d9825f', 8]].forEach(([col, ax]) => { c.fillStyle = col; c.beginPath(); c.arc(ax, -28, 4.5, 0, Math.PI * 2); c.fill(); });
  c.beginPath(); c.arc(19 - 2, -28, 4.5, 0, Math.PI * 2);
  if (filled) { c.fillStyle = tint; c.fill(); } else { c.setLineDash([2, 2]); c.strokeStyle = '#c6cde0'; c.lineWidth = 1.2; c.stroke(); c.setLineDash([]); }
  [[-14, -12, 26, '#6d7fc0'], [-2, 2, 28, '#e0a458'], [-14, 16, 22, '#6d7fc0']].forEach(([bx, by, bw, col]) => { c.fillStyle = col; c.beginPath(); c.roundRect(bx, by, bw, 10, 5); c.fill(); });
  c.restore();
}
function drawWallet(c, x, y, k) {
  c.save(); c.translate(x, y); c.scale(k, k);
  c.fillStyle = '#6fb36f'; c.beginPath(); c.roundRect(-12, -22, 24, 12, 3); c.fill();
  const g = c.createLinearGradient(0, -14, 0, 14); g.addColorStop(0, '#b0683a'); g.addColorStop(1, '#6a3b20');
  c.fillStyle = g; c.strokeStyle = '#3d2112'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(-22, -14, 44, 28, 7); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(255,220,180,.35)'; c.beginPath(); c.moveTo(-18, -6); c.lineTo(18, -6); c.stroke();
  c.fillStyle = '#e0b050'; c.beginPath(); c.arc(14, 2, 4, 0, Math.PI * 2); c.fill();
  c.restore();
}
function drawPaper(c, x, y, k) {
  c.save(); c.translate(x, y); c.scale(k, k);
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.roundRect(-20, -26, 44, 56, 4); c.fill();
  const g = c.createLinearGradient(0, -28, 0, 28); g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#e9e2cf');
  c.fillStyle = g; c.strokeStyle = '#8a8470'; c.lineWidth = 1.2; c.beginPath(); c.roundRect(-22, -28, 44, 56, 4); c.fill(); c.stroke();
  c.fillStyle = '#e0b050'; c.strokeStyle = '#a77c1e'; c.lineWidth = 1.2; c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 5.5 : 12; c[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, -8 + Math.sin(a) * rr); }
  c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = '#a6a08c'; c.lineWidth = 1.5; [12, 18, 24].forEach((ly, i) => { c.beginPath(); c.moveTo(-14, ly); c.lineTo(i === 2 ? 2 : 14, ly); c.stroke(); });

function swapArrows(c, xa, xb, y, a) {
  if (a < 0.02) return;
  c.save(); c.globalAlpha = a; c.strokeStyle = '#e0b050'; c.fillStyle = '#e0b050'; c.lineWidth = 3; c.lineCap = 'round';
  const mid = (xa + xb) / 2;
  const arrow = (x0, x1, yy, dy) => {
    c.beginPath(); c.moveTo(x0, yy); c.quadraticCurveTo(mid, yy + dy, x1, yy); c.stroke();
    const an = Math.atan2(-dy, x1 - mid); c.save(); c.translate(x1, yy); c.rotate(an); c.beginPath(); c.moveTo(4, 0); c.lineTo(-8, -7); c.lineTo(-8, 7); c.closePath(); c.fill(); c.restore();
  };
  arrow(Math.min(xa, xb) + 10, Math.max(xa, xb) - 10, y - 26, -34);
  arrow(Math.max(xa, xb) - 10, Math.min(xa, xb) + 10, y + 26, 34);

// --- drawing: the three views --------------------------------------------------------------------------------
function drawGlobe(c, cx, cy, gr, time, glow) {
  const halo = c.createRadialGradient(cx, cy, gr * 0.8, cx, cy, gr * 1.9); halo.addColorStop(0, `rgba(95,168,210,${0.30 + glow * 0.25})`); halo.addColorStop(1, 'rgba(95,168,210,0)');
  c.fillStyle = halo; c.beginPath(); c.arc(cx, cy, gr * 1.9, 0, Math.PI * 2); c.fill();
  const g = c.createRadialGradient(cx - gr * 0.4, cy - gr * 0.45, gr * 0.1, cx, cy, gr * 1.05);
  g.addColorStop(0, '#7fd0e6'); g.addColorStop(0.5, '#2f7fae'); g.addColorStop(1, '#0d2a4d');
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, Math.max(0, gr), 0, Math.PI * 2); c.fill();
  c.save(); c.beginPath(); c.arc(cx, cy, Math.max(0, gr), 0, Math.PI * 2); c.clip();
  c.strokeStyle = 'rgba(255,255,255,.17)'; c.lineWidth = 1;
  for (let k = 0; k < 6; k++) { const rx = Math.abs(Math.cos(time * 0.25 + k * Math.PI / 6)) * gr; c.beginPath(); c.ellipse(cx, cy, Math.max(0.5, rx), gr, 0, 0, Math.PI * 2); c.stroke(); }
  for (const lat of [-60, -30, 0, 30, 60]) {
    const s = Math.sin(lat * Math.PI / 180), q = Math.cos(lat * Math.PI / 180) * gr;
    c.beginPath(); c.ellipse(cx, cy + s * gr, Math.max(0.5, q), Math.max(0.5, q * 0.1), 0, 0, Math.PI * 2); c.stroke();
  }
  const sh = c.createRadialGradient(cx + gr * 0.5, cy + gr * 0.5, gr * 0.3, cx + gr * 0.5, cy + gr * 0.5, gr * 1.4); sh.addColorStop(0, 'rgba(0,0,20,0)'); sh.addColorStop(1, 'rgba(0,0,20,.45)');
  c.fillStyle = sh; c.fillRect(cx - gr, cy - gr, gr * 2, gr * 2);
  c.restore();
  c.strokeStyle = 'rgba(190,225,255,.5)'; c.lineWidth = 1.5; c.beginPath(); c.arc(cx, cy, Math.max(0, gr), 0, Math.PI * 2); c.stroke();
}

function drawWords(c, w, h, dt, time) {
  const t = T[lang], reveal = S.guess !== null;
  if (reveal) S.ringT += dt;
  const R = Math.max(64, Math.min(w / 2 - 50, h / 2 - 26)), cx = w / 2, cy = h / 2, e = ease(S.ringT / 0.8), gr = lerp(R * 0.64, R * 0.5, e);
  const bg = c.createRadialGradient(cx, cy, 10, cx, cy, Math.max(w, h) * 0.75); bg.addColorStop(0, '#232a5a'); bg.addColorStop(1, '#0c1027'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const pulse = S.sec ? 0.5 + 0.5 * Math.sin(time * 3) : 0;
  drawGlobe(c, cx, cy, gr, time, pulse);
  if (!reveal) { // only the globe and a question mark: the ring would show how many
    c.save(); c.fillStyle = '#fff'; c.font = '900 44px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 10;
    c.fillText('?', cx, cy + 2); c.restore(); geoP = []; return;
  }
  if (S.sec === 'glob') { c.save(); c.strokeStyle = `rgba(245,200,76,${0.35 + 0.3 * pulse})`; c.lineWidth = 3; c.shadowColor = '#f5c84c'; c.shadowBlur = 14; c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.stroke(); c.restore(); }
  const pts = [];
  for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 7; pts.push([cx + Math.cos(a) * R, cy + Math.sin(a) * R, a]); }
  c.lineWidth = 1.2;
  pts.forEach(([px, py, a], i) => { const s = clamp01((S.ringT - i * 0.1) / 0.5);
    c.strokeStyle = `rgba(190,215,255,${0.2 * s})`; c.beginPath(); c.moveTo(cx + Math.cos(a) * gr, cy + Math.sin(a) * gr); c.lineTo(px - Math.cos(a) * 26, py - Math.sin(a) * 18); c.stroke(); });
  geoP = [];
  pts.forEach(([px, py], i) => {
    const s = back((S.ringT - i * 0.1) / 0.5); if (s < 0.01) { geoP[i] = null; return; }
    geoP[i] = { x: px - PW / 2, y: py - PH / 2, w: PW, h: PH };
    const sel = S.sel === i, k = sort(i), sc = s * (sel ? 1.06 : 1);
    c.save(); c.translate(px, py); c.scale(sc, sc);
    const cols = k === 'pos' ? ['#f6c566', '#d98f2b', '#2a1a05'] : k === 'neg' ? ['#6fd6cb', '#2b8f9a', '#05242a'] : ['#4a5a9c', '#2c376c', '#EDEFF7'];
    const g = c.createLinearGradient(0, -PH / 2, 0, PH / 2); g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]);
    c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
    c.fillStyle = g; c.beginPath(); c.roundRect(-PW / 2, -PH / 2, PW, PH, 12); c.fill();
    c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
    c.lineWidth = sel ? 2.6 : 1.4; c.strokeStyle = sel ? '#fff' : 'rgba(255,255,255,.28)'; c.stroke();
    c.fillStyle = cols[2]; c.textAlign = 'center'; c.textBaseline = 'middle';
    let fs = 13; c.font = `800 ${fs}px Nunito, sans-serif`; const tw = c.measureText(t.q[i].short).width;
    if (tw > PW - 14) { fs = Math.max(12, fs * (PW - 14) / tw); c.font = `800 ${fs}px Nunito, sans-serif`; }
    c.fillText(t.q[i].short, 0, 1);
    c.restore();
  });
  if (S.sec) pill(c, w, t.sx[S.sec].pill, cx, cy, 17, 'rgba(10,12,20,.82)', '#f5c84c');
}
const sort = (i) => S.sort[i];

function drawTurn(c, w, h, dt, time) {
  const t = T[lang].tr, H = Math.min(h * 0.5, 175), fy = h * 0.84, L = w * 0.27, Rr = w * 0.73;
  sceneBG(c, w, h, '#e0a458', fy, H);
  S.swap += clamp((S.ph >= 2 ? 1 : 0) - S.swap, -dt / 0.7, dt / 0.7);
  const s = ease(S.swap), yx = lerp(L, Rr, s), ox = lerp(Rr, L, s), done = S.sc >= 3;
  const sc = T[lang].tr.sc[Math.min(S.sc, 2)], act = S.act === null ? null : sc.acts[S.act];
  const doerX = S.ph >= 2 ? ox : yx, recX = S.ph >= 2 ? yx : ox;
  // prop of the scene
  const bob = Math.sin(time * 1.6) * 3, ky = H / 150, py = h * 0.3 + bob;
  if (!done) {
    if (S.sc === 0) drawPhone(c, w / 2, py, 0.62 * ky + 0.25, S.act === 1, CAST.sam.shirt);
    else if (S.sc === 1) {
      const tx = S.act === null ? w / 2 : S.act === 0 ? lerp(doerX, recX, 0.2) : S.act === 1 ? lerp(doerX, recX, 0.8) : w / 2;
      S.propX = S.propX === null ? tx : S.propX + (tx - S.propX) * Math.min(1, dt * 5);
      drawWallet(c, S.propX, fy - H * 0.04, 0.8 * ky + 0.2);
    } else drawPaper(c, w / 2, py, 0.8 * ky + 0.2);
  }
  // who feels what
  let youMood = 'neutral', otherMood = 'neutral';
  if (done) { youMood = 'happy'; otherMood = 'happy'; }
  else if (S.ph === 1 && act) otherMood = act.mood;
  else if (S.ph >= 3 && S.feel) youMood = S.feel;
  const lookYou = yx < ox ? 1 : -1;
  person(c, ox, fy, H, { ...CAST.sam, look: -lookYou, mood: otherMood, pose: S.ph === 1 ? 'offer' : 'idle' });
  person(c, yx, fy, H, { ...CAST.you, look: lookYou, mood: youMood, pose: S.ph === 0 && S.act !== null ? 'offer' : 'idle' });
  pill(c, w, t.you, yx, fy - H - 20, 13, 'rgba(224,164,88,.92)', '#2a1a05');
  pill(c, w, t.nm, ox, fy - H - 20, 13);
  swapArrows(c, L, Rr, fy - H * 0.55, Math.sin(Math.PI * S.swap));
}

function drawChoice(c, w, h, dt, time) {
  const tt = T[lang].ch, dilN = Math.min(S.d, 2), done = S.d >= 3, H = Math.min(h * 0.43, 160), fy = h * 0.86;
  sceneBG(c, w, h, '#5fa8a0', fy, H);
  if (S.pick !== null) S.dT += dt; else S.dT = 0;
  const L = w * 0.27, Rr = w * 0.73, other = [CAST.neighbour, CAST.friend, CAST.fresh][dilN], oH = dilN === 0 ? H * 1.15 : H;
  const mood = done ? 'happy' : S.pick === null ? 'neutral' : S.pick === tt.dil[dilN].ok ? 'happy' : 'neutral';
  person(c, Rr, fy, oH, { ...other, look: -1, mood, pose: 'idle' });
  person(c, L, fy, H, { ...CAST.you, look: 1, mood: done ? 'happy' : 'neutral', pose: S.pick === null ? 'think' : 'idle' });
  pill(c, w, T[lang].tr.you, L, fy - H - 18, 13, 'rgba(224,164,88,.92)', '#2a1a05');
  pill(c, w, tt.tags[dilN], Rr, fy - oH - 18, 13);
  if (done) return;
  const bubble = (bx, by, glyph, pop, q) => {
    c.save(); c.translate(bx, by); c.scale(Math.max(0.01, pop), Math.max(0.01, pop));
    c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 10; c.shadowOffsetY = 3;
    const g = c.createLinearGradient(0, -26, 0, 26); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#dfe5ff');
    c.fillStyle = g; c.beginPath(); c.roundRect(-32, -26, 64, 52, 22); c.fill();
    c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
    c.fillStyle = '#e8ecff'; c.beginPath(); c.arc(-8, 36, 6, 0, Math.PI * 2); c.fill(); c.beginPath(); c.arc(-12, 46, 3.5, 0, Math.PI * 2); c.fill();
    c.textAlign = 'center'; c.textBaseline = 'middle';
    if (q) { c.fillStyle = '#5a5f86'; c.font = '900 30px Nunito, sans-serif'; c.fillText('?', 0, 2); }
    else { c.fillStyle = '#222'; c.font = `28px ${FONT}`; c.fillText(glyph, 0, 2); }
    c.restore();
  };
  const GL = [['🎵', '😴'], ['🎉', '🍰'], ['👋', '💬']][dilN];
  const topY = (hh) => Math.max(40, fy - hh - 82);
  bubble(L + 6, topY(H) + Math.sin(time * 1.4) * 2, GL[0], 1, false);
  const reveal = S.pick !== null;
  bubble(Rr + 6, topY(oH) + Math.sin(time * 1.4 + 1) * 2, GL[1], reveal ? back(S.dT / 0.45) : 1, !reveal);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'words') drawWords(c, w, h, dt, time); else if (v === 'turn') drawTurn(c, w, h, dt, time); else drawChoice(c, w, h, dt, time);
});

// --- input -----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'words' || S.guess === null) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const i = geoP.findIndex((p) => p && x >= p.x - 4 && x <= p.x + p.w + 4 && y >= p.y - 4 && y <= p.y + p.h + 4);
  if (i >= 0) { S.sel = i; sfx.click(); render(); }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'guess') { S.guess = b.dataset.g; S.ringT = 0; (S.guess === 'many' ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'pick') { S.sel = i; sfx.click(); }
  else if (act === 'sort') { const k = b.dataset.k; if (S.sort[S.sel] === null) { if (k === KIND[S.sel]) sfx.good(); else { S.miss++; sfx.bad(); } S.sort[S.sel] = KIND[S.sel]; S.guessed[S.sel] = k; } }
  else if (act === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); }
  // view 2
  else if (act === 'act') { S.act = i; S.ph = 1; sfx.click(); }
  else if (act === 'swap') { S.ph = 2; sfx.snap(); showStage(); }
  else if (act === 'feel') { S.feel = b.dataset.m; S.ph = 3; sfx.click(); }
  else if (act === 'same') { S.ph = 4; sfx.good(); }
  else if (act === 'chg') { S.ph = 0; S.act = null; S.feel = null; sfx.click(); }
  else if (act === 'nextsc') { S.sc++; S.ph = 0; S.act = null; S.feel = null; S.propX = null; sfx.click(); }
  else if (act === 'sagain') { S.sc = 0; S.ph = 0; S.act = null; S.feel = null; S.propX = null; sfx.click(); }
  // view 3
  else if (act === 'dpick') {
    S.pick = i; const ok = i === T[lang].ch.dil[Math.min(S.d, 2)].ok; S.right[S.d] = ok; (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'dnext') { S.d++; S.pick = null; sfx.click(); }
  else if (act === 'dagain') { S.d = 0; S.pick = null; S.right = []; sfx.click(); }
  render();
});

// --- render ----------------------------------------------------------------------------------------------------
function render() {
  const v = lab.view;
  $('secWords').hidden = v !== 'words'; $('secTurn').hidden = v !== 'turn'; $('secChoice').hidden = v !== 'choice';
  if (v === 'words') renderWords(); else if (v === 'turn') renderTurn(); else renderChoice();
}

function renderWords() {
  const t = T[lang], w = t.w, el = $('secWords');
  lab.setGlow('rgba(78, 168, 255, .26)');
  const n = S.sort.filter(Boolean).length;
  if (S.guess === null) {
    el.innerHTML = `<div class="gr-q">${esc(w.q)}</div><div class="gr-row"><button class="gr-b mid" data-act="guess" data-g="one">${esc(w.one)}</button><button class="gr-b mid" data-act="guess" data-g="many">${esc(w.many)}</button></div>`;
    lab.setReadout('?', '', '', '#4ea8ff');
    lab.setState({ emo: '🌍', title: w.askTitle, lead: w.askLead, body: w.askBody });
    lab.setFacts([]); return;
  }
  const i = S.sel, chips = t.q.map((q, k) => `<button class="gr-chip${k === i ? ' on' : ''}" data-act="pick" data-i="${k}">${esc(q.short)}</button>`).join('');
  let card = `<div class="gr-hint">${esc(w.tap)}</div>`;
  if (i !== null) {
    const q = t.q[i], k = S.sort[i];
    let tail;
    if (k === null) tail = `<div class="gr-fb" style="margin-bottom:8px">${esc(w.sortQ)}</div><div class="gr-row"><button class="gr-b mid" data-act="sort" data-k="pos">${esc(w.doB)}</button><button class="gr-b mid" data-act="sort" data-k="neg">${esc(w.dontB)}</button></div>`;
    else { const mine = S.guessed[i], ok = mine === k; tail = `<div class="gr-fb">${esc(ok ? (k === 'pos' ? w.okDo : w.okDont) : (k === 'pos' ? w.noDo : w.noDont))}</div>`; }
    card = `<div class="gr-quote"><div class="gr-trad">${esc(q.trad)}</div><p class="gr-text">“${esc(q.text)}”</p><div class="gr-src">${esc(q.src)}</div>${tail}</div>`;
  }
  const legend = n ? `<div class="gr-legend"><span><i class="gr-dot pos"></i>${esc(w.pos)}</span><span><i class="gr-dot neg"></i>${esc(w.neg)}</span></div>` : '';
  const open = secret.unlocked(), sc = (k, emo) => `<button class="gr-chip sec${open ? ' open' : ''}${S.sec === k ? ' on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  el.innerHTML = `<div class="gr-chips">${chips}</div>${card}${legend}<div class="gr-chips">${sc('name', '🏷️')}${sc('glob', '🌍')}</div><div class="fine">${esc(w.fine)}</div>`;
  lab.setReadout(`${n}/7`, w.sub, '', '#4ea8ff');
  const ver = S.guess === 'many' ? w.okMany : w.noOne;
  if (S.sec) { const s = t.sx[S.sec]; lab.setState({ emo: S.sec === 'name' ? '🏷️' : '🌍', title: s.title, lead: s.lead, body: s.body }); }
  else if (n === 7) lab.setState({ emo: '✅', title: w.allTitle, lead: w.allLead, body: '' });
  else if (i === null) lab.setState({ emo: S.guess === 'many' ? '✅' : '🌍', title: ver, lead: w.revLead, body: w.revBody });
  else lab.setState({ emo: '📜', title: t.q[i].trad, lead: S.sort[i] === null ? w.selLead : (S.sort[i] === 'pos' ? w.doneLead : w.dontLead), body: '' });
  lab.setFacts(t.facts.w);
}

function renderTurn() {
  const t = T[lang].tr, el = $('secTurn'), sc = t.sc[Math.min(S.sc, 2)], done = S.sc >= 3, nm = t.nm;
  lab.setGlow('rgba(224, 164, 88, .26)');
  const mood = (m) => t.moods[m];
  if (done) {
    el.innerHTML = `<div class="gr-row"><button class="gr-b go" data-act="sagain">${esc(t.again)}</button></div>`;
    lab.setReadout('3/3', t.sub, '', '#e0a458');
    lab.setState({ emo: '🏆', title: t.endTitle, lead: t.endLead, body: '' });
    lab.setFacts(T[lang].facts.t); return;
  }
  const act = S.act === null ? null : sc.acts[S.act];
  let ctl = '', st;
  if (S.ph === 0) {
    ctl = `<div class="gr-q">${esc(t.q0)}</div><div class="gr-col">${sc.acts.map((a, k) => `<button class="gr-b" data-act="act" data-i="${k}">${esc(a.a)}</button>`).join('')}</div>`;
    st = { emo: '🔁', title: sc.t, lead: sc.setup, body: t.q0 };
  } else if (S.ph === 1) {
    ctl = `<div class="gr-fb" style="margin-bottom:10px">${esc(act.a)}</div><div class="gr-row"><button class="gr-b go" data-act="swap">${esc(t.swap)}</button></div>`;
    st = { emo: '👀', title: t.feels(nm, mood(act.mood)), lead: act.res, body: t.ph1b };
  } else if (S.ph === 2) {
    ctl = `<div class="gr-q">${esc(t.feelQ)}</div><div class="gr-row">${MOOD_ORDER.map((m) => `<button class="gr-b mid" data-act="feel" data-m="${m}">${m === 'sad' ? '😞' : m === 'happy' ? '😊' : '😐'} ${esc(cap(mood(m)))}</button>`).join('')}</div>`;
    st = { emo: '🔄', title: t.swapTitle, lead: act.done, body: t.feelQ };
  } else if (S.ph === 3) {
    const same = S.feel === act.mood;
    ctl = `<div class="gr-q">${esc(t.sameQ)}</div><div class="gr-row"><button class="gr-b mid" data-act="same">${esc(t.same)}</button><button class="gr-b mid" data-act="chg">${esc(t.chg)}</button></div>`;
    st = { emo: '💭', title: t.cmp(nm, mood(act.mood), mood(S.feel)), lead: same ? t.cmpSame : t.cmpDiff, body: t.sameQ };
  } else {
    ctl = `<div class="gr-row"><button class="gr-b go" data-act="nextsc">${esc(t.next)}</button></div>`;
    st = { emo: '🌱', title: t.doneTitle, lead: sc.next, body: '' };
  }
  el.innerHTML = ctl;
  lab.setReadout(`${S.sc + 1}/3`, sc.t, '', '#e0a458');
  lab.setState({ ...st, extra: '' });
  lab.setFacts(T[lang].facts.t);
}

function renderChoice() {
  const t = T[lang].ch, el = $('secChoice'), done = S.d >= 3;
  lab.setGlow('rgba(95, 168, 160, .26)');
  if (done) {
    const k = S.right.filter(Boolean).length;
    el.innerHTML = `<div class="gr-row"><button class="gr-b go" data-act="dagain">${esc(t.again)}</button></div>`;
    lab.setReadout(`${k}/3`, t.sub, '', '#5fa8a0');
    lab.setState({ emo: '🏆', title: t.end(k), lead: t.endLead, body: '' });
    lab.setFacts(T[lang].facts.c); return;
  }
  const dl = t.dil[S.d], p = S.pick;
  const opts = dl.opts.map((o, k) => {
    const cls = p === null ? '' : k === dl.ok ? ' ok' : k === p ? ' no' : '';
    return `<button class="gr-b${cls}" data-act="dpick" data-i="${k}"${p !== null ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  el.innerHTML = `<div class="gr-q">${esc(t.q)}</div><div class="gr-col">${opts}</div>${p !== null ? `<div class="gr-row" style="margin-top:12px"><button class="gr-b go" data-act="dnext">${esc(t.next)}</button></div>` : ''}`;
  lab.setReadout(`${S.d + 1}/3`, dl.t, '', '#5fa8a0');
  if (p === null) lab.setState({ emo: '🤔', title: dl.t, lead: dl.setup, body: t.q });
  else if (p === dl.ok) lab.setState({ emo: '✅', title: t.right, lead: dl.reveal, body: dl.next });
  else lab.setState({ emo: '🤔', title: t.wrong, lead: dl.why[p], body: `${dl.reveal} ${dl.next}` });
  lab.setFacts(p === null ? [] : T[lang].facts.c);
}
render();
</script>
