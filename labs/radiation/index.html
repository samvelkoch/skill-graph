  else lab.setState({ emo: '⚛️', title: gated ? a.q : a.preTitle(nameNow, now3.Z, now3.N), lead: gated ? a.preLead[0] : a.preLead[S.cs] ?? a.hint, body: gated ? '' : a.hint, extra: '' });
  lab.setFacts(t.facts.atom);
}
render();
</script>
