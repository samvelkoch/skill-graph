// --- drawing: wood and wooden letter blocks -------------------------------------------------------------------
function wood(c, x, y, w, h, r, dark, seed) {
  const g = c.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, dark ? mix(WOOD, INK, .45) : lite(WOOD, .05)); g.addColorStop(1, dark ? mix(WOOD2, INK, .55) : WOOD2);
  rr(c, x, y, w, h, r); c.fillStyle = g; c.fill();
  c.save(); rr(c, x, y, w, h, r); c.clip();
  const R = rng(seed); c.lineWidth = 1;
  for (let i = 0, n = Math.max(6, (h / 7) | 0); i < n; i++) {
    const yy = y + R() * h, a = .04 + R() * .07;
    c.strokeStyle = R() < .5 ? `rgba(40,20,5,${a})` : `rgba(255,220,170,${a * .8})`;
    c.beginPath(); c.moveTo(x, yy); c.bezierCurveTo(x + w * .3, yy + (R() - .5) * 6, x + w * .65, yy + (R() - .5) * 6, x + w, yy + (R() - .5) * 4); c.stroke();
  }

}

// One tile for everything: x, y = top-left, w, h = size. l = the letter (empty: a blank block), kind = two | long | rare | plain.

function drawTile(c, x, y, w, h, l, kind, o = {}) {

  const col = KC[kind] ?? null, face = col ? mix(CREAM, col, .3 * tint) : CREAM, edge = col ? mix('#CDB27F', col, tint) : '#CDB27F';

  rr(c, L, T, w, h - d, r); c.fillStyle = g; c.fill(); c.lineWidth = col ? 1.6 : 1; c.strokeStyle = edge; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1; c.beginPath(); // light from the top left
  c.moveTo(L + 1.6, T + h - d - r); c.lineTo(L + 1.6, T + r); c.quadraticCurveTo(L + 1.6, T + 1.6, L + r, T + 1.6); c.lineTo(L + w - r, T + 1.6); c.stroke();
  if (l) {

}

  });

// when each tile glows after it has landed: first the gold ones, then the blue ones
const LAND = 43 * .07 + .8, GLOW = new Map();

function drawShelf(c, w, h, t, still, skipRare) {
  const G = shelfGeo(w, h);
  c.drawImage(G.cv, 0, 0, w, h);
  if (!S.sh.on && !still) return;
  for (const q of G.tiles) {
    const i = q.e.i;
    if (skipRare && q.e.kind === 'rare') continue;
    let p = (t - S.sh.t0 - i * .07) / .7;
    if (still) p = 1;
    if (p <= 0) continue;
    const fall = (1 - bounce(clamp01(p))) * (q.h * 1.7 + 24), gs = GLOW.get(i);
    const glow = still || gs === undefined ? 0 : Math.sin(Math.PI * clamp01((t - S.sh.t0 - gs) / 1));
    drawTile(c, q.x, q.y - fall, q.w, q.h, q.e.l, q.e.kind, { tilt: tilt(i), alpha: clamp01(p * 8), glow });

// --- tokens (a word as tiles) and word cards ------------------------------------------------------------------
// the word's letters as small tiles inside a block r; `decide` = the token to outline
function drawTokens(c, r, word, decide, alpha, oa) {
  const toks = split(word), n = toks.length, gap = 2, sum = toks.reduce((s, k) => s + facOf(k), 0);
  const th = r.h * .62, d = Math.max(2, r.h * .1), u = Math.min((r.w - 12 - gap * (n - 1)) / sum, th / 1.1);
  const rowW = sum * u + gap * (n - 1), y = r.y + (r.h - d - th) / 2;
  let x = r.x + (r.w - rowW) / 2;
  toks.forEach((k, j) => {
    const tw = u * facOf(k);
    drawTile(c, x, y, tw, th, k, kindOf(k), { alpha, shadow: false });
    if (j === decide && oa > 0) { c.save(); c.globalAlpha = alpha * oa; rr(c, x - 2.5, y - 2.5, tw + 5, th + 5, 6); c.lineWidth = 2.5; c.strokeStyle = RIBBON; c.stroke(); c.restore(); }
    x += tw + gap;
  });
}
// the picture on a word card: emoji + word (in a low card: side by side)
function cardFace(c, r, word, emoji, alpha) {
  if (alpha <= 0) return;
  c.save(); c.globalAlpha = alpha; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = INK;
  const d = Math.max(2, r.h * .1), fh = r.h - d;
  if (r.h < 60) {
    c.font = `${fh * .5}px ${EMOJI}`; c.fillText(emoji, r.x + r.h * .6, r.y + fh / 2 + 1);
    let fs = fh * .46; c.font = `700 ${fs}px ${SERIF}`; const maxW = r.w - r.h * 1.05 - 8, mw = c.measureText(word).width; if (mw > maxW) { fs *= maxW / mw; c.font = `700 ${fs}px ${SERIF}`; }
    c.fillText(word, r.x + r.h * 1.0 + maxW / 2, r.y + fh / 2 + fs * .04);
  } else {
    c.font = `${fh * .36}px ${EMOJI}`; c.fillText(emoji, r.x + r.w / 2, r.y + fh * .31);
    let fs = Math.min(fh * .3, 30); c.font = `700 ${fs}px ${SERIF}`; const maxW = r.w * .86, mw = c.measureText(word).width; if (mw > maxW) { fs *= maxW / mw; c.font = `700 ${fs}px ${SERIF}`; }
    c.fillText(word, r.x + r.w / 2, r.y + fh * .72 + fs * .04);
  }

}
// a card flying from `a` (a word card) to `b` (a slip in the book): p 0..1
function flyCard(c, a, b, p, word, emoji, decide) {
  const q = ease(p), r = { x: lerp(a.x, b.x, q), y: lerp(a.y, b.y, q) - Math.sin(Math.PI * q) * 26, w: lerp(a.w, b.w, q), h: lerp(a.h, b.h, q) };

// --- the dictionary: an open book with thumb tabs, a ribbon and cream pages ----------------------------------------

  rr(c, L.x, L.y, L.w, L.h, [8, 0, 0, 8]); c.fillStyle = g; c.fill();
  g = c.createLinearGradient(R.x, 0, R.x + R.w, 0); g.addColorStop(0, shade(CREAM, .08)); g.addColorStop(1, '#FFF9EA');
  rr(c, R.x, R.y, R.w, R.h, [0, 8, 8, 0]); c.fillStyle = g; c.fill();
  c.strokeStyle = 'rgba(43,33,64,.08)'; c.lineWidth = 1; c.beginPath();

  const cards = puz ? [0, 1, 2, 3].map((i) => ({ x: m + (i % 2) * (cw + cg), y: top + (i >> 1) * (cardH + 10), w: cw, h: cardH }))

  const L = { x: bx + cb, y: by + cb, w: pw, h: bh - 2 * cb }, R = { x: bx + bw / 2, y: by + cb, w: pw, h: bh - 2 * cb };

// --- view 2: a word is a strip until you look closer ---------------------------------------------------------------

// --- secret: find the word in a dictionary by its guide words ---------------------------------------------------

    : `${verdict(C.guess === d.ok, t)}<p>${esc(t.c.why[C.i])}</p><button class="ha-b ha-go" data-a="${end ? 'again' : 'next'}">${esc(end ? t.again : t.next)}</button>`;
  const st = t.st[end ? 'count1' : 'count0']; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
}
function renderOrder(t) {
  const O = S.O, puz = O.i >= 5, done = O.done, round = ORD[Math.min(O.i, 4)], firstW = (round.first ? round.b : round.a)[0];
  lab.setGlow('rgba(91, 141, 239, .24)');
  lab.setReadout(puz ? (done ? '⭐' : `${O.placed.length}/4`) : O.rev ? firstW : '?', puz ? '' : dots(O.i), '', GOLD);
  askEl.style.display = '';
  if (puz) askEl.innerHTML = done ? `<div class="ha-v" style="color:var(--ok)">⭐ ${esc(t.right)}</div><p>${esc(t.o.done)}</p><button class="ha-b ha-go" data-a="again">${esc(t.again)}</button>`
    : `<div class="q">${esc(t.o.sortQ)}</div>`;
  else askEl.innerHTML = !O.rev ? `<div class="q">${esc(t.o.q)}</div>`
    : `${verdict(O.right[O.i], t)}<p>${esc(t.o.why[O.i])}</p><button class="ha-b ha-go" data-a="next">${esc(t.next)}</button>`;
  const st = t.st[done ? 'order1' : 'order0']; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: `<div class="fine">${esc(t.fine)}</div>` });
}
render();
</script>
