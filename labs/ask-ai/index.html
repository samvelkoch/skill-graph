function replyHTML(t, sl) {
  const A = t.ask;
  if (sl.g < 0 || sl.t < 0) return `<p>${A.r.vague.map(esc).join('</p><p>')}</p>`;
  const G = A.gl[sl.g], n = sl.l >= 0 ? A.o.l[sl.l].n : 3, items = G.lines.slice(0, n);
  let h = `<div class="ai-ht">${esc(G.head)} — ${esc(A.o.t[sl.t].n)}</div>`;
  if (sl.f === 0) h += `<ul>${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
  else if (sl.f === 1) h += `<ol>${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>`;
  else h += `<p class="ai-dense">${esc(items.join(' '))}</p>`;
  if (sl.l < 0) h += `<p class="ai-dim">${esc(A.r.ramble)}</p>`;
  h += sl.w >= 0 ? `<p class="ai-dim">💬 ${esc(A.o.w[sl.w].note)}</p>` : `<p class="ai-dim">${esc(A.r.guess)}</p>`;
  return h;
}

  const miss = SLOTS.filter((k) => S.sl[k] < 0).map((k) => A.slotMiss[k]);
  const ctl = `<div>${SLOTS.map((k) => `<div class="ai-slot"><div class="ai-sl">${esc(A.slotLbl[k])}</div><div class="chips">${A.o[k].map((o, i) =>
    `<button type="button" class="chip ai-chip${S.sl[k] === i ? ' on' : ''}" data-act="slot" data-k="${k}" data-i="${i}">${esc(o.c)}</button>`).join('')}</div></div>`).join('')}</div>
    <div class="ai-ctlrow"><button type="button" class="chip ai-chip" data-act="reset">↺ ${esc(A.reset)}</button></div>${secs}`;
  return {
    body: meMsg(reqText(t, S.sl), 'rq') + botMsg(replyHTML(t, S.sl), 'rp'),
    meters: [{ label: A.meterLbl, frac: n / 5, color: n === 5 ? '#3ddc97' : '#5fd6c8', txt: `${pct}%` }], ctl,
    state: { emo: n === 5 ? '✅' : '✍️', title: A.bt[tr], lead: miss.length ? A.missing(miss.join(', ')) : A.full, body: A.body, extra: `<div class="ai-fine">${esc(t.fine)}</div>` },
    ro: [`${pct}%`, A.sub, A.tiers[tr], n === 5 ? '#3ddc97' : '#5fd6c8'], facts, glow: 'rgba(95, 214, 200, .24)',
  };
}
function elizaView(t) {
  const E = t.ask.eliza, last = S.elLog.length ? E.s[S.elLog[S.elLog.length - 1]] : null;
  const log = S.elLog.map((i, k) => meMsg(E.s[i][0], `em${k}`) + `<div class="ai-row"><div class="ai-tty${pop(`er${k}`)}">${esc(E.s[i][1])}</div></div>`).join('');
  return {
    badge: '⌨️', name: E.name, sub: E.sub, noInput: true,
    body: `<div class="ai-row"><div class="ai-tty">${esc(E.greet)}</div></div>${log}`,
    ctl: `<div class="ai-q">${esc(E.pick)}</div><div class="ai-opts">${E.s.map((s, i) => optBtn('eliza', `data-i="${i}"`, s[0])).join('')}</div>
      <div class="ai-sec"><div class="chips"><button type="button" class="chip ai-chip on" data-act="secA">⌨️ ${esc(E.back)}</button></div></div>`,
    state: { emo: '⌨️', title: E.title, lead: last ? `${E.rule} ${last[2]}` : E.lead, body: last ? E.lead : '', extra: `<div class="ai-fine">${esc(E.fine)}</div>` },
    ro: [E.val, E.valSub, '', '#7dffb0'], facts: [{ emo: '⌨️', text: t.facts.el1[0], src: t.facts.el1[1] }, { emo: '🚪', text: t.facts.el2[0], src: t.facts.el2[1] }], glow: 'rgba(125, 255, 176, .2)',
  };
}

function viewCheck(t) {
  const C = t.chk, locked = S.marks.filter(Boolean).length, done = locked === 4, p = S.pred2 !== null;
  if (S.word) return wordView(t);
  const secs = `<div class="ai-sec"><div class="chips">${secChip('secC', '🎲', C.secName, false)}</div></div>`;
  const rows = C.facts.map((f, i) => {
    const L = S.marks[i], cls = L ? (FACT_OK[i] ? ' good' : ' bad') : '';
    const mk = L ? `<span class="ai-tag ${FACT_OK[i] ? 'tog' : 'me'}">${FACT_OK[i] ? '✔' : '✖'}</span>`
      : p ? `<div class="ai-mk"><button type="button" data-act="mark" data-i="${i}" data-v="1">${esc(C.btns[0])}</button><button type="button" data-act="mark" data-i="${i}" data-v="0">${esc(C.btns[1])}</button></div>` : '';
    return `<div class="ai-fr${cls}"><b class="n">${i + 1}</b><span class="tx">${esc(f)}</span>${mk}${L ? `<div class="fb">${esc(C.fbR[i])}</div>` : ''}</div>`;
  }).join('');
  const srcs = p ? `<div class="ai-srcs">${C.src.map((s, j) => `<button type="button" class="ai-src s${j}${S.open[j] ? ' open' : ''}" data-act="src" data-j="${j}">
      <span class="h"><em>${s.e}</em>${esc(s.n)}</span>${S.open[j] ? `<span class="tx">${esc(s.t)}</span>` : `<span class="tap">${esc(C.tapOpen)}</span>`}</button>`).join('')}</div>` : '';
  const meters = [{ label: C.mSure, frac: 1, color: '#f5c84c', txt: '100%' }];
  if (done) meters.push({ label: C.mRight, frac: 0.75, color: '#3ddc97', txt: '3/4' });
  let state, ctl;
  if (!p) {
    ctl = `<div class="ai-q">${esc(C.predQ)}</div><div class="ai-opts">${optBtn('pred2', 'data-v="yes"', C.opts[0])}${optBtn('pred2', 'data-v="no"', C.opts[1])}</div>${secs}`;
    state = { emo: '💯', title: C.sureT, lead: C.read, body: '', extra: `<div class="ai-fine">${esc(t.fine)} ${esc(C.fineSrc)}</div>` };
  } else if (done) {
    ctl = `<div class="ai-q">${esc(C.doneT)}<small>${esc(C.slips(S.slips))}</small></div>${secs}`;
    state = { emo: '🏆', title: C.doneT, lead: C.doneL, body: C.slips(S.slips), extra: `<div class="ai-fine">${esc(t.fine)} ${esc(C.fineSrc)}</div>` };
  } else {
    ctl = `<div class="ai-q">${esc(C.task)}</div>${secs}`;
    const f = S.fb, first = f === null;
    state = { emo: first ? (S.pred2 === 'yes' ? '✅' : '🤔') : f.ok ? '✅' : '🤔', title: first ? (S.pred2 === 'yes' ? C.right : C.no) : f.ok ? C.good : C.look,
      lead: first ? C.lead : f.text, body: first ? C.task : '', extra: `<div class="ai-fine">${esc(t.fine)} ${esc(C.fineSrc)}</div>` };
  }
  const facts = done ? ['h1', 'h2', 'h3'].map((k, i) => ({ emo: ['💬', '🎯', '⚖️'][i], text: t.facts[k][0], src: t.facts[k][1] })) : [];
  return {
    body: meMsg(C.userQ, 'u') + botMsg(esc(C.bot1), 'b') + `<div style="display:grid;gap:8px">${rows}</div>${srcs}`,
    meters, ctl, state, facts, glow: 'rgba(245, 200, 76, .22)',
    ro: p ? [`${locked}/4`, C.sub, '', '#f5c84c'] : ['?', '', '', '#f5c84c'],
  };
}
function wordView(t) {
  const W = t.chk.wd, last = S.draws[S.draws.length - 1], k = S.draws.filter((d) => d === 0).length;
  const rows = W.words.map((w, i) => `<div class="ai-wr${last === i ? ' hit' : ''}"><span>${esc(w)}</span><div class="bar"><i style="width:${W.w[i]}%"></i></div><span>${W.w[i]}%</span></div>`).join('');
  const chips = S.draws.map((d) => `<span class="ai-dr ${d === 0 ? 'r' : 'w'}">${esc(W.words[d])} · ${esc(d === 0 ? W.r : W.w2)}</span>`).join('');
  return {
    badge: '🎲', name: t.chk.secName, sub: W.hd, noInput: true,
    body: `<div class="ai-wd"><p class="ai-sen">${esc(W.pre)} <mark>${last === undefined ? '…' : esc(W.words[last])}</mark> ${esc(W.post)}</p>${rows}
      <div class="ai-draws">${chips}</div><div class="ai-note">${esc(W.illus)}</div></div>`,
    ctl: `<div class="ai-q">${esc(W.pick)}</div><div class="ai-ctlrow"><button type="button" class="btn" data-act="draw">🎲 ${esc(W.draw)}</button></div>
      <div class="ai-sec"><div class="chips"><button type="button" class="chip ai-chip on" data-act="secC">🎲 ${esc(W.back)}</button></div></div>`,
    state: { emo: '🎲', title: last === undefined ? t.chk.secName : last === 0 ? W.lr : W.lw, lead: S.draws.length ? W.tally(S.draws.length, k) : W.pick, body: W.lead, extra: `<div class="ai-fine">${esc(W.illus)}</div>` },
    ro: [W.val, S.draws.length ? W.tally(S.draws.length, k) : W.valSub, '', '#8fb7ff'],
    facts: [{ emo: '🧠', text: t.facts.h2[0], src: t.facts.h2[1] }, { emo: '📚', text: t.facts.llm[0], src: t.facts.llm[1] }], glow: 'rgba(143, 183, 255, .24)',
  };
}

function viewShare(t) {
  const R = t.shr, sorting = S.si < 6, locked = S.sort.filter(Boolean).length;
  const rows = R.steps.map((s, i) => `<li class="ai-st${i === S.si && sorting ? ' cur' : ''}"><b>${i + 1}</b><span>${esc(s)}</span>${S.sort[i] ? `<em class="ai-tag ${S.sort[i]}">${esc(R.b[S.sort[i]])}</em>` : ''}</li>`).join('');
  const sel = S.note.map((x, i) => (x ? i : -1)).filter((i) => i >= 0);
  const noteTxt = `${R.notePre} ${sel.length ? sel.map((i) => R.short[i]).join(', ') : R.noteNone}${sel.length ? '.' : ''}${S.note[2] ? ` ${R.checkedF}` : ''}`;
  const noteCard = !sorting ? `<div class="ai-notecard${pop('nc')}"><h4>${esc(R.noteH)}</h4><p>${esc(noteTxt)}</p></div>` : '';
  const meters = [{ label: R.mLbl, frac: locked / 6, color: '#7ee6c4', txt: `${locked}/6` }];
  const body = `<p class="ai-task">📋 ${esc(R.task)}</p><ul class="ai-sts">${rows}</ul>${noteCard}`;
  const facts = [{ emo: '📖', text: t.facts.llm2[0], src: t.facts.llm2[1] }];
  if (S.pred2 !== null) facts.push({ emo: '🔎', text: t.facts.h4[0], src: t.facts.h4[1] });
  if (sorting) {
    const i = S.si, right = S.fb3 === 'right';
    const btns = ['ai', 'tog', 'me'].map((b) => `<button type="button" class="ai-opt${S.wr >= 2 && b === ANS[i] && !right ? ' ai-hintb' : ''}" data-act="sort" data-b="${b}"${right ? ' disabled' : ''}>${esc(R.b[b])}</button>`).join('');
    const ctl = `<div class="ai-q">${esc(R.q)}<small>${esc(R.steps[i])}</small></div><div class="ai-opts three">${btns}</div>
      ${right ? `<div class="ai-ctlrow"><button type="button" class="btn" data-act="next">${esc(i === 5 ? R.toNote : R.next)}</button></div>` : ''}`;
    const state = right ? { emo: '✅', title: R.right, lead: R.reasons[i], body: '', extra: `<div class="ai-fine">${esc(R.b[ANS[i]])}</div>` }
      : S.fb3 === 'wrong' ? { emo: '🤔', title: R.wrong, lead: R.wrongHint, body: '', extra: '' }
      : { emo: '📋', title: R.stepOf(i + 1, 6), lead: R.steps[i], body: R.q, extra: '' };
    return { body, meters, ctl, state, facts, ro: [`${locked}/6`, R.mLbl, '', '#7ee6c4'], glow: 'rgba(126, 230, 196, .22)' };
  }
  const miss = USED.filter((i) => !S.note[i]), extra = sel.filter((i) => !USED.includes(i));
  const ok = !miss.length && !extra.length;
  const state = !sel.length ? { emo: '📝', title: R.noteTitle, lead: R.noteTap, body: '', extra: '' }
    : ok ? { emo: '✅', title: R.noteOk, lead: R.teacher, body: '', extra: '' }
    : { emo: '🤔', title: R.noteTitle, lead: extra.length ? R.noteExtra(extra.map((i) => R.short[i]).join(', ')) : R.noteMiss(miss.map((i) => R.short[i]).join(', ')), body: '', extra: '' };
  const ctl = `<div class="ai-q">${esc(R.noteQ)}</div><div class="chips">${R.short.map((s, i) => `<button type="button" class="chip ai-chip${S.note[i] ? ' on' : ''}" data-act="note" data-i="${i}">${esc(s)}</button>`).join('')}</div>
    <div class="ai-ctlrow"><button type="button" class="chip ai-chip" data-act="again3">↺ ${esc(R.again)}</button></div>`;
  return { body, meters, ctl, state, facts, ro: [ok ? '✔' : '…', R.noteH, '', ok ? '#3ddc97' : '#7ee6c4'], glow: 'rgba(126, 230, 196, .22)', noteMeters: true };
}

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const t = T0(), v = lab.view;
  const r = v === 'ask' ? viewAsk(t) : v === 'check' ? viewCheck(t) : viewShare(t);
  document.body.dataset.v = v;
  $('aiPane').innerHTML = winHTML(t, r);
  $('ctrlBody').innerHTML = r.ctl;
  lab.setGlow(r.glow);
  lab.setReadout(...r.ro);
  lab.setState(r.state);
  lab.setFacts(r.facts);
  S.pop.clear();
  lab.checkStage();
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

// --- actions -------------------------------------------------------------------------------------------------------
function onAct(ev) {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, d = b.dataset;
  if (a === 'pick') { S.pick = (S.flip ? ['v', 'c'] : ['c', 'v'])[+d.i]; S.phase = 'reveal'; S.pop = new Set(['m0', 'b0', 'm1', 'b1']); (S.pick === 'c' ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  if (a === 'tobuild') { S.phase = 'build'; sfx.click(); }
  else if (a === 'slot') { const k = d.k, i = +d.i; S.sl[k] = S.sl[k] === i ? -1 : i; S.pop.add('rp'); sfx.tick(); }
  else if (a === 'reset') { S.sl = { ...BLANK }; S.pop.add('rp'); sfx.click(); }
  else if (a === 'secA') { if (!secret.unlocked()) return secret.open(); S.eliza = !S.eliza; sfx.click(); }
  else if (a === 'eliza') { S.elLog.push(+d.i); S.pop.add(`em${S.elLog.length - 1}`).add(`er${S.elLog.length - 1}`); sfx.click(); }
  else if (a === 'pred2') { S.pred2 = d.v; (d.v === 'yes' ? sfx.good : sfx.bad)(); }
  else if (a === 'src') { S.open[+d.j] = !S.open[+d.j]; sfx.tick(); }
  else if (a === 'mark') {
    const i = +d.i, C = T0().chk;
    if (!S.open.some(Boolean)) { S.fb = { ok: false, text: C.openFirst }; sfx.bad(); }
    else if ((d.v === '1') === FACT_OK[i]) { S.marks[i] = true; S.fb = { ok: true, text: C.fbR[i] }; sfx.good(); }
    else { S.slips++; S.fb = { ok: false, text: C.fbW[i] }; sfx.bad(); }
  }
  else if (a === 'secC') { if (!secret.unlocked()) return secret.open(); S.word = !S.word; sfx.click(); }
  else if (a === 'draw') {
    const w = T0().chk.wd.w; let x = Math.random() * w.reduce((p, q) => p + q, 0), i = 0;
    while (i < w.length - 1 && x >= w[i]) { x -= w[i]; i++; }
    S.draws.push(i); (i === 0 ? sfx.good : sfx.bad)();
  }
  else if (a === 'sort') {
    if (b.dataset.b === ANS[S.si]) { S.sort[S.si] = ANS[S.si]; S.fb3 = 'right'; sfx.good(); } else { S.wr++; S.fb3 = 'wrong'; sfx.bad(); }
  }
  else if (a === 'next') { S.si++; S.fb3 = null; S.wr = 0; S.pop.add('nc'); sfx.click(); }
  else if (a === 'note') { S.note[+d.i] = !S.note[+d.i]; sfx.tick(); }
  else if (a === 'again3') { S.sort = S.sort.map(() => null); S.si = 0; S.fb3 = null; S.wr = 0; S.note = S.note.map(() => false); sfx.click(); }
  render();
}
$('ctrlBody').addEventListener('click', onAct);
$('aiPane').addEventListener('click', onAct);
render();
</script>
</body>
