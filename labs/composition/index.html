const cen = (k, o) => (k === 'tree' ? [o.x, o.y - 80 * o.s] : k === 'house' ? [o.x, o.y - 32 * o.s] : k === 'sun' ? [o.x, o.y] : [o.x, o.y - 20 * o.s]);

function rank(sc) { // big, bright and lonely first; a fox half hidden behind the tree loses weight
  const ks = Object.keys(sc.o).filter((k) => sc.o[k].show), cs = ks.map((k) => cen(k, sc.o[k]));
  return ks.map((k, i) => {
    const o = sc.o[k];
    let md = 1e9;
    cs.forEach((p, j) => { if (j !== i) md = Math.min(md, Math.hypot(p[0] - cs[i][0], p[1] - cs[i][1]) / W0); });
    const iso = ks.length > 1 ? clamp(md / .25, 0, 1) : 1;

    if (k === 'fox' && tr && tr.show && o.y < tr.y && Math.abs(o.x - tr.x) < 34 * tr.s) occl = .55;

    pill(c, (reveal && i === correct ? '✓ ' : '') + labels[i], R.x + W0 * R.k / 2, R.y + H0 * R.k + R.bw + 20, labels[i].length > 12 ? 12 : 14, reveal && i === correct ? '#3ddc97' : '#fff');
  });
  LAY.t = rs.map((R) => ({ x0: R.x - R.bw - 4, x1: R.x + W0 * R.k + R.bw + 4, y0: R.y - R.bw - 4, y1: R.y + H0 * R.k + R.bw + 34 }));
}
function seesaw(c, w, h, R, sc) {
  const bottom = R.y + H0 * R.k + R.bw, below = h - bottom, fh = clamp(below * .36, 22, 38);
  const px = w / 2, py = h - 10 - fh, half = R.k * 200 + 6, a = S.bal.deg * Math.PI / 180, th = 10;
  const lvl = isLevel(balF(sc));
  c.save();
  const sg = c.createRadialGradient(px, h - 8, 1, px, h - 8, half); sg.addColorStop(0, 'rgba(0,0,0,.4)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  c.translate(0, h - 8); c.scale(1, .08); c.translate(0, -(h - 8)); c.fillStyle = sg; c.beginPath(); c.arc(px, h - 8, half, 0, 7); c.fill();
  c.restore();
  c.save(); c.lineJoin = 'round';
  c.fillStyle = lg(c, px - fh, py, px + fh, py + fh, [[0, '#aeb9d6'], [1, '#6a7599']]); c.strokeStyle = '#2c3350'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(px, py); c.lineTo(px + fh * .8, h - 8); c.lineTo(px - fh * .8, h - 8); c.closePath(); c.fill(); c.stroke();
  c.translate(px, py); c.rotate(a);
  c.fillStyle = lg(c, 0, -th, 0, 0, [[0, '#d9a96c'], [1, '#8c5c32']]); c.strokeStyle = lvl ? '#3ddc97' : '#4a2c14'; c.lineWidth = 2;
  c.beginPath(); c.roundRect(-half, -th, half * 2, th, 4); c.fill(); c.stroke();
  c.restore();
  c.fillStyle = lvl ? '#3ddc97' : '#3a4262'; c.strokeStyle = '#141a30'; c.lineWidth = 1.5;
  c.beginPath(); c.arc(px, py - 1, 4.5, 0, 7); c.fill(); c.stroke();
  // each object rides the plank at the same left-right place as in the picture; its ball grows with its weight
  const items = ['tree', 'sun'].filter((k) => sc.o[k].show).map((k) => {
    const o = sc.o[k], d = clamp((o.x - 200) / 200, -1, 1), mx = d * half, r = 6 + wgt(k, o) * 80, my = -th - r + 1;
    const X = px + mx * Math.cos(a) - my * Math.sin(a), Y = py + mx * Math.sin(a) + my * Math.cos(a), cp = cen(k, o);
    return { k, X, Y, r, cx: R.x + cp[0] * R.k, cy: R.y + cp[1] * R.k };
  });
  c.save(); c.setLineDash([3, 4]); c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 1.2;
  for (const it of items) { c.beginPath(); c.moveTo(it.cx, it.cy + (it.k === 'tree' ? 55 : 28)); c.lineTo(it.X, it.Y - it.r); c.stroke(); }
  c.restore();
  for (const it of items) {
    const g = c.createRadialGradient(it.X - it.r * .35, it.Y - it.r * .4, 1, it.X, it.Y, it.r);
    if (it.k === 'tree') { g.addColorStop(0, '#5eaa6b'); g.addColorStop(1, '#1a4a2f'); } else { g.addColorStop(0, '#fff3b0'); g.addColorStop(1, '#f0a81c'); }
    c.fillStyle = g; c.strokeStyle = it.k === 'tree' ? '#0f3220' : '#b8780c'; c.lineWidth = 1.6;
    c.beginPath(); c.arc(it.X, it.Y, Math.max(0, it.r), 0, 7); c.fill(); c.stroke();
  }
  items.forEach((it, i) => {
    const crowded = items.length > 1 && Math.abs(items[0].X - items[1].X) < 56 && i === 1;
    pill(c, T[lang].objects[it.k], it.X, it.Y - it.r - (crowded ? 28 : 13), 12);
  });
}
function paintMain(c, w, h) {
  LAY.w = w; LAY.h = h; LAY.t = []; LAY.main = null;
  const v = lab.view;
  if (S.sec === 'icarus' || S.sec === 'wave') {
    const R = place(8, 8, w - 16, h - 16); LAY.main = R;
    if (S.sec === 'icarus') drawIcarus(c, R, S.found); else drawWave(c, R, clamp(S.swap, 0, 1.08));
    return;
  }
  if (v === 'eye') {
    if (!S.eye.play) twoUp(c, w, h, [SC.a, SC.b], ['A', 'B'], !!S.eye.ans, 1, !!S.eye.ans);
    else { const R = place(8, 8, w - 16, h - 16); LAY.main = R; paintScene(c, SC.play, R); drawGaze(c, SC.play, R, false); }
  } else if (v === 'thirds') {
    if (S.th.step === 2) twoUp(c, w, h, [SC.c1, SC.c2], T[lang].centreOpts, false, 1, false);
    else {
      const R = place(8, 8, w - 16, h - 16); LAY.main = R; paintScene(c, SC.th, R);
      if (S.th.grid && S.th.step !== 0) drawGrid(c, R);
    }
  } else {
    const sh = clamp(h * .3, 96, 150), R = place(8, 6, w - 16, h - sh - 12, true); LAY.main = R;
    paintScene(c, SC.bal, R); seesaw(c, w, h, R, SC.bal);

}
let frames = 0;
canvasLoop($('cv'), (c, w, h, dt, time) => {
  NOW = time;
  update(dt);
  paintMain(c, w, h);
  readout(false);
  if (++frames % 3 === 0) { const g = sig(); if (g !== S.sig) render(); }
});

// --- dragging --------------------------------------------------------------------------------------------------
const cv = $('cv');
const pos = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
function hitObj(R, o, k, px, py) {
  const wx = (px - R.x) / R.k, wy = (py - R.y) / R.k, [l, u, r, d] = BOX[k], pad = 14 / R.k;
  return wx >= o.x + l * o.s - pad && wx <= o.x + r * o.s + pad && wy >= o.y + u * o.s - pad && wy <= o.y + d * o.s + pad;
}
function grab(sc, keys, R, px, py, ev, hz) {
  if (!R) return false;
  for (const k of keys) {
    const o = sc.o[k];
    if (!o.show || !hitObj(R, o, k, px, py)) continue;
    drag = { sc, key: k, R, dx: (px - R.x) / R.k - o.x, dy: (py - R.y) / R.k - o.y, gx: o.x, gy: o.y };
    sc.gz = null; cv.setPointerCapture(ev.pointerId); sfx.tick(); return true;
  }
  if (hz && Math.abs(py - (R.y + sc.hz * R.k)) < 24 && px >= R.x - 10 && px <= R.x + W0 * R.k + 10) {
    drag = { sc, key: 'hz', R, dy: (py - R.y) / R.k - sc.hz };
    sc.hv = 0; cv.setPointerCapture(ev.pointerId); sfx.tick(); return true;
  }
  return false;
}
cv.addEventListener('pointerdown', (ev) => {
  const [px, py] = pos(ev), v = lab.view, R = LAY.main;
  if (S.sec === 'icarus') {
    if (R && !S.found) { const wx = (px - R.x) / R.k, wy = (py - R.y) / R.k; if (Math.hypot(wx - ICARUS[0], wy - (ICARUS[1] - 6)) < 30) { S.found = true; sfx.good(); render(); } }
    return;
  }
  if (S.sec) return;
  const th = LAY.t.findIndex((r) => px >= r.x0 && px <= r.x1 && py >= r.y0 && py <= r.y1);
  if (v === 'eye') {
    if (!S.eye.play) { if (th >= 0 && !S.eye.ans) answerEye(['A', 'B'][th]); } else grab(SC.play, ['fox'], R, px, py, ev, false);
  } else if (v === 'thirds') {
    if (S.th.step === 2) { if (th >= 0) answerCentre(th); }
    else if (S.th.step === 1) grab(SC.th, [], R, px, py, ev, true);
    else if (S.th.step === 3) grab(SC.th, ['tree'], R, px, py, ev, true);
  } else if (S.bal.step === 1) grab(SC.bal, ['sun'], R, px, py, ev, false);
  if (drag) { clearTimeout(S.bal.timer); if (v === 'balance') S.bal.dragged = true; }
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const [px, py] = pos(ev), { sc, key, R } = drag, wx = (px - R.x) / R.k, wy = (py - R.y) / R.k;
  if (key === 'hz') {
    let g = clamp(wy - drag.dy, 60, 250);
    if (S.th.step >= 1) for (const t of THIRD_Y) if (Math.abs(g - t) < 7) g = t;
    sc.hz = sc.hzT = g;
    const tr = sc.o.tree; if (tr && tr.y < g + 8) tr.y = g + 8;
    return;
  }
  drag.gx = wx - drag.dx; drag.gy = wy - drag.dy;
  if (key === 'fox') { drag.gx = clamp(drag.gx, 28, W0 - 28); drag.gy = clamp(drag.gy, sc.hz + 16, H0 - 8); }
  else if (key === 'tree') { drag.gx = clamp(drag.gx, 40, W0 - 40); drag.gy = clamp(drag.gy, sc.hz + 8, H0 - 6); }
  else if (key === 'sun') { drag.gx = clamp(drag.gx, 26, W0 - 26); drag.gy = clamp(drag.gy, 34, Math.max(40, sc.hz - 26)); }
});
function endDrag() {
  if (!drag) return;
  const { sc, key } = drag;
  drag = null;
  if (sc === SC.play && key === 'fox') startGaze(SC.play, .35);
  render();
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// --- answers -----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answerEye(a) {
  if (S.eye.ans) return;
  S.eye.ans = a; (a === 'B' ? sfx.good : sfx.bad)();
  startGaze(SC.a, .5); startGaze(SC.b, .5);
  render(); showStage();
}
function answerHorizon(i) {
  if (S.th.hAns !== null) return;
  S.th.hAns = i; S.th.step = 1; (i === 2 ? sfx.good : sfx.bad)();
  SC.th.hzT = 200; SC.th.stormT = 1;
  render(); showStage();
}
function answerCentre(i) {
  if (S.th.cAns !== null) return;
  S.th.cAns = i; S.th.step = 3; S.th.grid = true; (i === 1 ? sfx.good : sfx.bad)();
  const tr = SC.th.o.tree; tr.show = true; tr.x = 200; tr.tx = THIRD[1]; tr.y = Math.max(240, SC.th.hz + 30); tr.vx = 0;
  render(); showStage();
}
function answerBalance(i) {
  if (S.bal.ans !== null) return;
  S.bal.ans = i; S.bal.step = 1; (i === 2 ? sfx.good : sfx.bad)();
  const sun = SC.bal.o.sun; sun.tx = OPT_X[i]; sun.vx = 0;
  if (i !== 2) S.bal.timer = setTimeout(() => { sun.tx = OPT_X[2]; sun.vx = 0; render(); }, 1300);
  render(); showStage();
}
function setFox(col, sz) {
  const f = SC.play.o.fox;
  if (col) f.col = col;
  if (sz) f.s = FOXS[sz];
  f.y = Math.max(f.y, SC.play.hz + 16);
  startGaze(SC.play, .3); sfx.click(); render();
}

// --- controls ----------------------------------------------------------------------------------------------------
const opts = (act, list) => `<div class="cp-opts">${list.map((o, i) => `<button class="cp-opt" data-act="${act}" data-v="${i}">${esc(o)}</button>`).join('')}</div>`;
const verdict = (t, ok, ex) => `<div class="cp-v"><b class="${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.notQuite)}</b> ${esc(ex)}</div>`;
const gridChip = (t) => `<button class="cp-c ${S.th.grid ? 'on' : ''}" data-act="grid">${esc(t.showThirds)}</button>`;
function ctrlHtml(t, v) {
  if (S.sec) return S.sec === 'wave' ? `<div class="cp-row"><button class="cp-c ${S.swapT ? 'on' : ''}" data-act="swap">${esc(t.swap)}</button></div>` : '';
  if (v === 'eye') {
    if (!S.eye.ans) return `<div class="cp-q">${esc(t.eyeQ)}</div>${opts('eyeAns', t.eyeOpts)}`;
    if (!S.eye.play) return `${verdict(t, S.eye.ans === 'B', t.exEye)}<button class="btn" data-act="eyeGo">${esc(t.go)}</button>`;
    const f = SC.play.o.fox, sz = f.s < .8 ? 'S' : f.s < 1.2 ? 'M' : 'L';
    return `<div class="cp-q small">${esc(t.nowYou)}</div>
      <div class="cp-row">${['red', 'brown', 'grey'].map((k) => `<button class="cp-c ${f.col === k ? 'on' : ''}" data-act="col" data-v="${k}"><i class="cp-dot" style="background:${FOXC[k].dot}"></i>${esc(t.colours[k])}</button>`).join('')}</div>
      <div class="cp-row">${['S', 'M', 'L'].map((k) => `<button class="cp-c ${sz === k ? 'on' : ''}" data-act="sz" data-v="${k}">${esc(t.sizes[k.toLowerCase()])}</button>`).join('')}<button class="cp-c" data-act="replay">${esc(t.replay)}</button></div>`;
  }
  if (v === 'thirds') {
    const s = S.th.step;
    if (s === 0) return `<div class="cp-q">${esc(t.horizonQ)}</div>${opts('hAns', t.horizonOpts)}`;
    if (s === 1) return `${verdict(t, S.th.hAns === 2, t.exHorizon)}<div class="cp-row">${gridChip(t)}<button class="btn" data-act="nextQ">${esc(t.nextQ)}</button></div><p class="cp-hint">${esc(t.dragHz)}</p>`;
    if (s === 2) return `<div class="cp-q">${esc(t.centreQ)}</div>${opts('cAns', t.centreOpts)}`;
    return `${verdict(t, S.th.cAns === 1, t.exCentre)}<div class="cp-row">${gridChip(t)}</div><p class="cp-hint">${esc(t.dragTree)}</p>`;
  }
  if (!S.bal.step) return `<div class="cp-q">${esc(t.balanceQ)}</div>${opts('bAns', t.balanceOpts)}`;
  return `${verdict(t, S.bal.ans === 2, t.exBalance)}<p class="cp-hint" style="margin-top:0">${esc(t.dragSun)} ${esc(t.try2)}</p>`;
}
function secretsRow(t) {
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="row2 cp-sec">${sc('icarus', '🪶')}${sc('wave', '🌊')}</div>`;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'eyeAns') answerEye(['A', 'B'][+v]);
  else if (act === 'eyeGo') { S.eye.play = true; startGaze(SC.play, .5); sfx.click(); render(); showStage(); }
  else if (act === 'col') setFox(v, null);
  else if (act === 'sz') setFox(null, v);
  else if (act === 'replay') { startGaze(SC.play, .2); sfx.click(); }
  else if (act === 'hAns') answerHorizon(+v);
  else if (act === 'nextQ') { S.th.step = 2; sfx.click(); render(); showStage(); }
  else if (act === 'cAns') answerCentre(+v);
  else if (act === 'grid') { S.th.grid = !S.th.grid; sfx.click(); render(); }
  else if (act === 'bAns') answerBalance(+v);
  else if (act === 'swap') { S.swapT = S.swapT ? 0 : 1; sfx.click(); render(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) { secret.open(); return; }
    S.sec = S.sec === k ? null : k;
    if (S.sec === 'icarus') S.found = false;
    if (S.sec === 'wave') { S.swapT = 0; S.swap = 0; S.swv = 0; }
    sfx.click(); render(); showStage();
  }
});

// --- readout, state card, facts: one render per change ---------------------------------------------------------
function sig() {
  const v = lab.view;
  if (S.sec) return `sec|${S.sec}|${S.found}|${S.swapT}`;
  if (v === 'eye') { const f = SC.play.o.fox; return `eye|${S.eye.ans}|${S.eye.play}|${f.col}|${f.s}|${foxRank(SC.play)}`; }
  if (v === 'thirds') { const tr = SC.th.o.tree; return `th|${S.th.step}|${S.th.grid}|${tr.show && near3(tr.x)}|${tr.show && Math.abs(tr.x - 200) < 12}|${nearH(SC.th.hz)}|${S.th.hAns}|${S.th.cAns}`; }
  const f = balF(SC.bal);
  return `bal|${S.bal.step}|${S.bal.ans}|${isLevel(f)}|${SC.bal.o.sun.x < 190}|${S.bal.dragged}`;
}
function readout(force) {
  const t = T[lang], v = lab.view;
  let val = '?', sub = '', pill = '', col = '#e8662b';
  if (S.sec) {
    col = '#e0b050';
    if (S.sec === 'icarus') { val = S.found ? '✓' : '?'; sub = t.secrets.icarus[0]; } else { val = '🌊'; sub = t.secrets.wave[0]; }
  } else if (v === 'eye') {
    const f = SC.play.o.fox;
    if (S.eye.play) { col = FOXC[f.col].dot; val = t.seen(foxRank(SC.play)); sub = t.inPath; pill = t.colours[f.col]; }
  } else if (v === 'thirds') {
    col = '#e0b050';
    if (S.th.step > 0) {
      val = t.sky(Math.round(SC.th.hz / 3)); sub = t.ofPicture;
      const tr = SC.th.o.tree;
      if (S.th.step >= 3 && tr.show) pill = near3(tr.x) ? t.onThird : Math.abs(tr.x - 200) < 12 ? t.centre : '';
    }
  } else {
    col = '#5fa8a0';
    if (S.bal.step) {
      const f = balF(SC.bal), d = Math.max(1, Math.round(Math.abs(f) * 10));
      val = isLevel(f) ? t.level : f < 0 ? t.tiltL(d) : t.tiltR(d); sub = t.balanceWord;
      const heavy = ['tree', 'sun'].filter((k) => SC.bal.o[k].show).sort((p, q) => wgt(q, SC.bal.o[q]) - wgt(p, SC.bal.o[p]))[0];
      pill = t.heaviest(t.objects[heavy]);
    }
  }
  const key = [lang, val, sub, pill, col].join('|');
  if (!force && key === S.roKey) return;
  S.roKey = key; lab.setReadout(esc(val), sub, pill, col);
}
function stateCard(t, v) {
  if (S.sec === 'icarus') return { emo: '🪶', title: t.secrets.icarus[0], lead: S.found ? t.secretA : t.findLegs };
  if (S.sec === 'wave') return { emo: '🌊', title: t.secrets.wave[0], lead: t.secretB };
  if (v === 'eye') { const s = S.eye.ans ? t.state.eyeDone : t.state.eye0; return { emo: S.eye.ans ? '🎨' : '👁️', title: s[0], lead: s[1] }; }
  if (v === 'thirds') {
    const tr = SC.th.o.tree, done = S.th.step >= 3 && tr.show && near3(tr.x) && nearH(SC.th.hz), s = done ? t.state.thirdsDone : t.state.thirds0;
    return { emo: done ? '✨' : '#', title: s[0], lead: s[1] };
  }
  const one = S.bal.step && S.bal.dragged && SC.bal.o.sun.x < 190;
  if (one) { const i = t.unbalanced.indexOf('. '); return { emo: '🌀', title: t.unbalanced.slice(0, i + 1), lead: t.unbalanced.slice(i + 2) }; }
  const s = S.bal.step ? t.state.balanceDone : t.state.balance0;
  return { emo: '⚖️', title: s[0], lead: s[1] };
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = S.sec ? 'sec' : v;
  $('ctrlBody').innerHTML = ctrlHtml(t, v) + secretsRow(t);
  lab.setGlow(v === 'eye' ? 'rgba(224, 102, 43, .24)' : v === 'thirds' ? 'rgba(224, 176, 80, .24)' : 'rgba(95, 168, 160, .24)');
  const st = stateCard(t, v);
  lab.setState({ ...st, body: '', extra: S.sec ? '' : `<div class="fine">${esc(t.fine)}</div>` });
  lab.setFacts(S.sec ? [] : t.facts[v]);
  readout(true);
  S.sig = sig();
}
render();
