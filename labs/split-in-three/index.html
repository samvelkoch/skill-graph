  } else {
    h += `<div class="row2"><button class="btn" data-act="next"${g >= 4 ? ' disabled' : ''}>${esc(t.nextGen)}</button><button class="chip" data-act="rAgain">${esc(t.again)}</button></div>`;
    if (S.ruleDone) h += `<div class="sp-q">${esc(t.ruleQ)}</div><div class="sp-nums">${[...new Set([S.truth, S.truth + 2, S.truth - 2 >= 1 ? S.truth - 2 : S.truth + 4])].sort((a, b) => a - b).map((o) => `<button class="sp-num ${o === S.truth ? 'right' : o === S.guess ? 'wrong' : ''}" disabled>${o}</button>`).join('')}</div>${verdict(t, S.guess === S.truth, t.exRule)}`;
  }
  $('ru').innerHTML = h;
  lab.setReadout(`${t.kingdoms(n)} <span style="font-size:15px;font-weight:800;color:var(--soft)">${esc(t.kw(n))}</span>`, t.gen(g), t.rules[S.rule].replace(/^\S+\s/, ''), '#e8bd4f');
  const stt = S.ruleDone ? t.state.ruleDone : t.state.rule0;
  return { emo: S.ruleDone ? '🌳' : '👶', title: stt[0], lead: stt[1] };
}
function renderAfter(t) {
  const ans = S.aPick !== null, shown = ans && S.ai >= 1;
  $('afQ').innerHTML = `<div class="sp-q">${esc(t.afterQ)}</div><div class="sp-opts">${optsHTML(t.afterOpts, 'apick', S.aPick, 1, shown)}</div>`;
  $('afL').textContent = t.yearLbl;
  $('afR').disabled = !ans; $('afR').value = String(S.ai);
  $('afT').innerHTML = STOPS.map((s, i) => `<button class="sp-tick ${i === S.ai ? 'on' : ''}" data-act="stop" data-i="${i}"${ans ? '' : ' disabled'}>${s}</button>`).join('');
  $('afH').textContent = ans ? t.slideHint : t.pickFirst;
  $('afV').innerHTML = shown ? verdict(t, S.aPick === 1, t.exAfter) : '';
  lab.setReadout(STOPS[S.ai], t.onMap(KINGDOMS[S.ai]), t.years[YKEY[S.ai]], '#4f7cac');
  const stt = S.ai === 3 ? t.state.afterDone : t.state.after0;
  return { emo: S.ai === 3 ? '🗺️' : '🤔', title: stt[0], lead: stt[1] };
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  $('dv').style.display = !sec && v === 'divide' ? '' : 'none';
  $('ru').style.display = !sec && v === 'rule' ? '' : 'none';
  $('af').style.display = !sec && v === 'after' ? '' : 'none';
  $('scB').style.display = sec ? '' : 'none';
  let st;
  if (v === 'divide') st = renderDivide(t); else if (v === 'rule') st = renderRule(t); else st = renderAfter(t);
  if (sec === 'oath') {
    st = { emo: '🗣️', title: t.secrets.oath[0], lead: t.secretA };
    $('scB').innerHTML = `<p class="sp-hint">${esc(t.tapBrothers)}</p>`;
    lab.setReadout('842', t.secrets.oath[1], '', '#a34a3c');
  } else if (sec === 'loth') {
    st = { emo: '🏰', title: t.secrets.loth[0], lead: t.secretB };
    $('scB').innerHTML = '';
    lastRead = ''; syncSecretReadout(now());
  }
  lab.setState({ ...st, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  lab.setFacts(v === 'after' && S.aPick === null ? [] : t.facts[v]);
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('scChips').innerHTML = sc('oath', '🗣️') + sc('loth', '🏰');
}
newRun('all');
render();
</script>
