    if (h) { S.sel = h.i; sfx.tick(); render(); }
  } else if (lab.view === 'cones' && S.p3 !== null) {
    const h = hit.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
    if (h) { S.sel3 = h.i; sfx.tick(); render(); }
  }
});

// --- logic ---------------------------------------------------------------------------------------------------
const PERMS = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];
function check1() {
  let best = null;
  for (const p of PERMS) { const bad = PL.filter((id) => p[S.grp[id]] !== FAMS.indexOf(FAM_OF[id])); if (!best || bad.length < best.bad.length) best = { bad, p }; }
  S.ck1 = best; if (!best.bad.length) { S.done1 = true; S.map = best.p; sfx.good(); } else sfx.bad();
}
function check3() { const bad = TREES.filter((id) => S.grp3[id] !== TREE_G[id]); S.ck3 = { bad }; if (!bad.length) { S.done3 = true; sfx.good(); } else sfx.bad(); }
function check2() {
  const st = STEPS[S.step], sp = SPEC[st.f], b = S.bld;
  S.ck2 = { sep: b.sep === sp.sep, pet: b.pet === sp.pet, sta: b.sta === sp.sta };
  if (S.ck2.sep && S.ck2.pet && S.ck2.sta) { S.matched = true; sfx.good(); if (st.t === 'b') S.pickOk = true; } else sfx.bad();
}
function nextStep() { S.step++; S.bld = { sep: null, pet: null, sta: null }; S.ck2 = null; S.matched = false; S.pick = null; S.pickOk = false; sfx.click(); }
const nextUnassigned = (list, grp, from) => { for (let k = 1; k <= list.length; k++) { const j = (from + k) % list.length; if (grp[list[j]] === undefined) return j; } return from; };

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'pick1') { S.p1 = v; (v === 'radish' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'go1') { S.go = true; sfx.click(); }
  else if (a === 'bin') { if (S.done1) return; S.grp[PL[S.sel]] = +v; S.ck1 = null; S.sel = nextUnassigned(PL, S.grp, S.sel); sfx.snap(); }
  else if (a === 'check1') check1();
  else if (a === 'reset1') { S.grp = {}; S.ck1 = null; S.done1 = false; S.map = null; S.sel = 0; sfx.click(); }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === v ? null : v; sfx.click(); }
  else if (a === 'crop') { S.crop = +v; sfx.tick(); }
  else if (a === 'nod') { S.nod = v === '1'; sfx.click(); }
  else if (a === 'gosort') { document.querySelector('#views [data-view="sort"]')?.click(); return; }
  else if (a === 'bld') { if (S.matched) return; S.bld[b.dataset.k] = b.dataset.k === 'pet' ? v : +v; S.ck2 = null; sfx.tick(); }
  else if (a === 'check2') check2();
  else if (a === 'fam') { const st = STEPS[S.step]; S.pick = v; if (v === st.f) { S.pickOk = true; sfx.good(); showStage(); } else sfx.bad(); }
  else if (a === 'next2') nextStep();
  else if (a === 'again2') { S.step = 0; S.bld = { sep: null, pet: null, sta: null }; S.ck2 = null; S.matched = false; S.pick = null; S.pickOk = false; sfx.click(); }
  else if (a === 'pick3') { S.p3 = v; (v === 'yes' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'season') { S.svT = +v; sfx.click(); }
  else if (a === 'bin3') { if (S.done3) return; S.grp3[TREES[S.sel3]] = +v; S.ck3 = null; S.sel3 = nextUnassigned(TREES, S.grp3, S.sel3); sfx.snap(); }
  else if (a === 'check3') check3();
  else if (a === 'reset3') { S.grp3 = {}; S.ck3 = null; S.done3 = false; S.sel3 = 0; sfx.click(); }
  render();
});

// --- render: controls, readout and the state card --------------------------------------------------------------
const chip = (act, v, txt, on, extra = '') => `<button type="button" class="chip pf-chip ${on ? 'on' : ''}" data-act="${act}" data-v="${v}" ${extra}>${txt}</button>`;
function render() {
  const v = lab.view;
  $('v1').hidden = v !== 'sort'; $('v2').hidden = v !== 'flower'; $('v3').hidden = v !== 'cones';
  if (v === 'sort') renderSort(); else if (v === 'flower') renderFlower(); else renderCones();
}
function renderSort() {
  const t = T[lang], s = t.s1, box = $('v1'), asked = S.p1 !== null;
  lab.setGlow('rgba(79, 184, 165, .26)');
  const secRow = asked && S.go ? `<div class="pf-row"><span class="pf-lbl"></span><button type="button" class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === 'a' ? 'on' : ''}" data-act="sec" data-v="a">${secret.unlocked() ? esc(t.sec.chipA) : '🔒 ???'}</button><button type="button" class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === 'b' ? 'on' : ''}" data-act="sec" data-v="b">${secret.unlocked() ? esc(t.sec.chipB) : '🔒 ???'}</button></div>` : '';
  if (!asked) {
    box.innerHTML = `<p class="pf-q">${esc(s.q)}</p><div class="pf-opts pf-row">${chip('pick1', 'radish', esc(t.plant.radish))}${chip('pick1', 'pea', esc(t.plant.pea))}</div>`;
    lab.setReadout('?', s.rsub, '', '#4fb8a5'); lab.setState({ emo: '🤔', title: s.q, lead: s.askLead, body: s.askBody, extra: '' }); lab.setFacts([]); return;
  }
  if (!S.go) {
    const ok = S.p1 === 'radish';
    box.innerHTML = `<div class="pf-row"><button type="button" class="btn pf-btn" data-act="go1">${esc(s.go)}</button></div>`;
    lab.setReadout(esc(t.plant.radish), s.rsub, '', '#4fb8a5'); lab.setState({ emo: ok ? '✅' : '🌼', title: ok ? s.revYes : s.revNo, lead: s.revLead, body: s.revBody, extra: '' }); lab.setFacts(t.facts.sort); return;
  }
  const n = Object.keys(S.grp).length, allIn = n === 9;
  if (S.sec) {
    const a = S.sec === 'a', crops = a ? `<div class="pf-row">${t.sec.crops.map((nm, i) => chip('crop', i, esc(nm), S.crop === i)).join('')}</div>` : `<div class="pf-row">${chip('nod', 1, esc(t.sec.on), S.nod)}${chip('nod', 0, esc(t.sec.off), !S.nod)}</div>`;
    box.innerHTML = crops + secRow;
    lab.setReadout(a ? '🥦' : '🌱', a ? t.sec.aT : t.sec.bT, '', '#e0b030');
    lab.setState({ emo: a ? '🥦' : '🌱', title: a ? t.sec.aT : t.sec.bT, lead: a ? t.sec.aL : t.sec.bL, body: a ? t.sec.cropB[S.crop] : (S.nod ? t.sec.bB : t.sec.bOff), extra: '' }); lab.setFacts(a ? t.facts.a : t.facts.b); return;
  }
  const bins = [0, 1, 2].map((k) => {
    const cnt = Object.values(S.grp).filter((g) => g === k).length;
    const nm = S.done1 ? `${s.letters[k]} · ${t.fam[FAMS[S.map[k]]][0]}` : `${s.group} ${s.letters[k]}`;
    return `<button type="button" class="chip pf-chip pf-bin ${S.grp[PL[S.sel]] === k ? 'on' : ''}" data-act="bin" data-v="${k}" ${S.done1 ? 'disabled' : ''}><span class="pf-dot" style="background:${BIN[k]}"></span>${esc(nm)} · ${cnt}</button>`;
  }).join('');
  box.innerHTML = `<p class="pf-note">${esc(s.ask)}</p><div class="pf-row">${bins}</div><div class="pf-row"><button type="button" class="btn pf-btn" data-act="check1" ${allIn && !S.done1 ? '' : 'disabled'}>${esc(s.check)}</button><button type="button" class="btn ghost pf-btn" data-act="reset1">${esc(s.reset)}</button></div>` + secRow;
  lab.setReadout(`${n}/9`, s.sub, '', '#4fb8a5');
  const id = PL[S.sel], fam = FAM_OF[id];
  if (S.done1) lab.setState({ emo: '🎉', title: s.doneT, lead: [0, 1, 2].map((k) => `${s.letters[k]} = ${t.fam[FAMS[S.map[k]]][0]} (${t.fam[FAMS[S.map[k]]][1]})`).join(' · '), body: s.doneB, extra: '' });
  else if (S.ck1) lab.setState({ emo: '🔎', title: s.wrong(S.ck1.bad.length), lead: s.wrongB, body: '', extra: '' });
  else lab.setState({ emo: '🔍', title: t.plant[id], lead: `${t.part.sep}: ${t.sepK[fam]} · ${t.part.pet}: ${t.petK[fam]} · ${t.part.sta}: ${t.staK[fam]}`, body: `${t.part.fruit}: ${t.fr[id]}. ${allIn ? '' : n === 0 ? s.tap : s.left(9 - n)}`, extra: n === 0 ? `<div class="pf-note">${esc(s.three)}</div>` : '' });
  lab.setFacts(t.facts.sort);
}
function renderFlower() {
  const t = T[lang], s = t.s2, box = $('v2'), end = S.step >= STEPS.length;
  lab.setGlow('rgba(224, 122, 142, .24)');
  if (S.p1 === null) {
    box.innerHTML = `<p class="pf-note">${esc(s.gateL)}</p><div class="pf-row"><button type="button" class="btn pf-btn" data-act="gosort">${esc(s.gateGo)}</button></div>`;
    lab.setReadout('?', s.sub, '', '#e07a8e'); lab.setState({ emo: '🔒', title: s.gateT, lead: s.gateL, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (end) {
    box.innerHTML = `<div class="pf-row"><button type="button" class="btn pf-btn" data-act="again2">${esc(s.again)}</button></div>`;
    lab.setReadout('6/6', s.sub, '', '#e07a8e'); lab.setState({ emo: '🏆', title: s.endT, lead: s.endL, body: '', extra: '' }); lab.setFacts(t.facts.flower); return;
  }
  const st = STEPS[S.step], b = S.bld, locked = S.matched, ck = S.ck2, myst = st.t === 'm', ready = b.sep !== null && b.pet !== null && b.sta !== null;
  const group = (k, lbl, opts) => `<div class="pf-row"><span class="pf-lbl">${esc(lbl)}</span>${opts.map(([val, txt]) => `<button type="button" class="chip pf-chip ${b[k] === val ? 'on' : ''}" data-act="bld" data-k="${k}" data-v="${val}" ${locked ? 'disabled' : ''}>${esc(txt)}</button>`).join('')}</div>`;
  let html = group('sep', s.sep, [[4, '4'], [5, '5']]) + group('pet', s.pet, [['cross', s.petO.cross], ['five', s.petO.five], ['fly', s.petO.fly]]) + group('sta', s.sta, [[4, s.staO[4]], [6, s.staO[6]], [10, s.staO[10]], [99, s.staO[99]]]);
  const mk = (x) => (x ? '✓' : '✕');
  html += `<div class="pf-row">`;
  if (!locked) html += `<button type="button" class="btn pf-btn" data-act="check2" ${ready ? '' : 'disabled'}>${esc(s.check)}</button>` + (ck ? `<span class="pf-marks">${esc(s.marks(mk(ck.sep), mk(ck.pet), mk(ck.sta)))}</span>` : '');
  else if (myst && !S.pickOk) html += `<span class="pf-lbl" style="min-width:0">${esc(s.which)}</span>${FAMS.map((f) => `<button type="button" class="chip pf-chip ${S.pick === f ? 'on' : ''}" data-act="fam" data-v="${f}"> ${esc(t.fam[f][0])}</button>`).join('')}`;
  else html += `<button type="button" class="btn pf-btn" data-act="next2">${esc(s.next)}</button>`;
  html += `</div>`;
  box.innerHTML = html;
  lab.setReadout(`${S.step + 1}/6`, s.sub, '', '#e07a8e');
  let stt;
  if (!locked) stt = { emo: '🌼', title: myst ? s.myst : s.task[st.f], lead: ck ? s.marks(mk(ck.sep), mk(ck.pet), mk(ck.sta)) : s.lead(S.step + 1, 6), body: s.body };
  else if (!myst) stt = { emo: '✅', title: lang === 'en' ? 'Right!' : lang === 'ru' ? 'Верно!' : 'Így van!', lead: s.d[st.f], body: '' };
  else if (!S.pickOk) stt = { emo: '🤔', title: s.which, lead: S.pick ? s.pickNo : s.whichL, body: '' };
  else stt = { emo: '✅', title: lang === 'en' ? 'Right!' : lang === 'ru' ? 'Верно!' : 'Így van!', lead: s.mystOk(t.plant[st.m]), body: `${s.mystFam(`${t.fam[st.f][0]} (${t.fam[st.f][1]})`)} ${s.d[st.f]}` };
  lab.setState({ ...stt, extra: '' }); lab.setFacts(t.facts.flower);
}
function renderCones() {
  const t = T[lang], s = t.s3, box = $('v3');
  lab.setGlow('rgba(95, 154, 85, .26)');
  if (S.p3 === null) {
    box.innerHTML = `<p class="pf-q">${esc(s.q)}</p><div class="pf-opts pf-row">${chip('pick3', 'yes', esc(s.yes))}${chip('pick3', 'no', esc(s.no))}</div>`;
    lab.setReadout('?', s.sub, '', '#5f9a55'); lab.setState({ emo: '🤔', title: s.q, lead: s.askLead, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const n = Object.keys(S.grp3).length, id = TREES[S.sel3], ok = S.p3 === 'yes';
  const bins = [0, 1].map((k) => `<button type="button" class="chip pf-chip pf-bin ${S.grp3[id] === k ? 'on' : ''}" data-act="bin3" data-v="${k}" ${S.done3 ? 'disabled' : ''}><span class="pf-dot" style="background:${BIN[k]}"></span>${esc(s.g[k])}</button>`).join('');
  box.innerHTML = `<div class="pf-row"><span class="pf-lbl">${esc(s.season)}</span>${s.seasons.map((nm, i) => chip('season', i, esc(nm), Math.round(S.svT) === i)).join('')}</div>
    <p class="pf-note" style="margin-top:12px">${esc(s.ask)}</p><div class="pf-row">${bins}</div>
    <div class="pf-row"><button type="button" class="btn pf-btn" data-act="check3" ${n === 4 && !S.done3 ? '' : 'disabled'}>${esc(s.check)}</button><button type="button" class="btn ghost pf-btn" data-act="reset3">${esc(s.reset)}</button></div>`;
  lab.setReadout(`${n}/4`, s.sub, '', '#5f9a55');
  if (S.done3) lab.setState({ emo: '🎉', title: s.doneT, lead: s.doneL, body: '', extra: '' });
  else if (S.ck3) lab.setState({ emo: '🔎', title: s.wrong(S.ck3.bad.length), lead: s.wrongB, body: '', extra: '' });
  else if (n === 0) lab.setState({ emo: ok ? '✅' : '🌲', title: ok ? s.revYes : s.revNo, lead: s.revLead, body: s.revBody, extra: '' });
  else lab.setState({ emo: '🌲', title: t.s3.trees[id], lead: n < 4 ? s.left(4 - n) : '', body: s.selL, extra: '' });
  lab.setFacts(t.facts.cones);
}
render();
</script>
</body>
</html>
