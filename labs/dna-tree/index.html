// closest-pair clustering (UPGMA): join the two groups with the fewest differences, average over their members
function upgma(set) {
  const leaves = set.ids.map((id, i) => ({ m: [id], h: 0, leaf: id, o: i }));

    for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
      const d = avg(live[i], live[j]);
      if (!best || d < best.d - 1e-9) best = { i, j, d };

    const node = { m: X.m.concat(Y.m), kids, d: best.d, h: best.d, o: Math.min(X.o, Y.o), k: steps.length };
    steps.push(node);
    live = live.filter((_, i) => i !== best.i && i !== best.j);
    live.push(node);
  }

  const walk = (n) => { if (n.leaf) order.push(n.leaf); else n.kids.forEach(walk); };

const chipsHtml = (t) => ['chimp', 'fly'].map((k) => {
  const open = secret.unlocked(), emo = k === 'chimp' ? '🐒' : '🦇';
  return `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-v="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
}).join('');
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'g1') { S.g1 = v; S.anchor = 'dolphin'; S.tapped = false; S.rev1 = now(); S.litAt = now(); (v === 'hippo' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'g2') { S.g2 = v; S.sec = null; S.step = 1; (v === 'dh' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'g3') { S.g3 = +v; S.t3 = 60; S.moved = false; (+v === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'goto') { const tab = $('views').querySelector('[data-view="count"]'); if (tab) tab.click(); return; }
  else if (a === 'next') { S.step = Math.min(S.step + 1, UP[curKey()].steps.length); sfx.snap(); }
  else if (a === 'again') { S.step = 1; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === v ? null : v; S.tapped = false; S.litAt = now(); S.rev1 = -9;
    if (!curSet().ids.includes(S.anchor)) S.anchor = curSet().ids[0];
    if (lab.view === 'tree') S.step = 99;
    sfx.click();
  }
  render();
});
$('dtT').addEventListener('input', (ev) => { S.t3 = +ev.target.value; S.moved = true; sfx.tick(); render(); });
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'count' || S.g1 === null) return;
  const r = $('cv').getBoundingClientRect(), y = ev.clientY - r.top, row = S.rows.find((q) => y >= q.y0 && y < q.y1);
  if (!row) return;
  S.anchor = row.id; S.tapped = true; S.litAt = now(); sfx.click(); render();
});

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const v = lab.view, t = T[lang];
  $('secCount').hidden = v !== 'count'; $('secTree').hidden = v !== 'tree'; $('secClock').hidden = v !== 'clock';
  if (v === 'count') renderCount(t); else if (v === 'tree') renderTree(t); else renderClock(t);
}
const fine = (t) => `<div class="dt-fine">${esc(t.fine)}</div>`;
const SRC = {
  whale: 'en.wikipedia.org/wiki/Whippomorpha and /wiki/Dolphin', chimp6: 'en.wikipedia.org/wiki/Chimpanzee_genome_project',
  genome: 'sciencedaily.com/releases/2005/09/050901074102.htm', fish: 'en.wikipedia.org/wiki/Osteichthyes and /wiki/Chondrichthyes',
  conv: 'en.wikipedia.org/wiki/Convergent_evolution', clock: 'en.wikipedia.org/wiki/Molecular_clock',
};
const F = (t, id, emo, src) => ({ emo, text: t.f[id], src });

function renderCount(t) {
  const pre = S.g1 === null, key = curKey(), set = SETS[key];
  lab.setGlow('rgba(95, 208, 192, .24)');
  $('cAsk').hidden = !pre; $('cTools').hidden = pre;
  if (pre) {
    $('cAsk').innerHTML = askHtml(t.c.q, [['shark', cap(t.an.shark)], ['hippo', cap(t.an.hippo)], ['tuna', cap(t.an.tuna)]], 'g1');
    lab.setReadout('?', '', '', '#5fd0c0');
    lab.setState({ emo: '🤔', title: t.c.q, lead: t.c.lead0, body: '', extra: fine(t) });
    lab.setFacts([]);
    return;
  }
  if (!set.ids.includes(S.anchor)) S.anchor = set.ids[0];
  const ref = set.seq[S.anchor], L = ref.length, others = set.ids.filter((id) => id !== S.anchor);
  const ds = others.map((id) => [id, ham(set.seq[id], ref)]);
  const near = ds.reduce((p, q) => (q[1] < p[1] ? q : p)), farp = ds.reduce((p, q) => (q[1] > p[1] ? q : p));
  $('cHint').textContent = t.c.hint; $('cChips').innerHTML = chipsHtml(t);
  lab.setReadout(String(near[1]), t.c.sub(cap(t.an[S.anchor]), t.an[near[0]]), t.c.pill(L), '#5fd0c0');
  let st;
  if (key === 'chimp') { const d = ham(SEQ_CHIMP.human, SEQ_CHIMP.chimp); st = { emo: '🐒', title: t.c.pair(cap(t.an.human), t.an.chimp, d, t.dif(d)), lead: t.c.chimp[1], body: t.c.chimp[2] }; }
  else if (key === 'fly') { const x = t.c.fly(ham(SEQ_FLY.bat, SEQ_FLY.cow), ham(SEQ_FLY.bat, SEQ_FLY.bird)); st = { emo: '🦇', title: x[0], lead: x[1], body: x[2] }; }
  else if (!S.tapped) {
    const three = ['shark', 'hippo', 'tuna'].map((id) => [id, ham(SEQ_BASE[id], SEQ_BASE.dolphin)]).sort((p, q) => p[1] - q[1]);
    st = { emo: S.g1 === 'hippo' ? '✅' : '🤔', title: S.g1 === 'hippo' ? t.right : t.wrong, lead: t.c.counts(three.map(([id, d]) => `${t.an[id]} ${d}`).join(', ')), body: t.c.how };
  } else {
    st = { emo: '🧬', title: t.c.pair(cap(t.an[S.anchor]), t.an[near[0]], near[1], t.dif(near[1])), lead: t.c.far(t.an[near[0]], near[1], t.an[farp[0]], farp[1]), body: t.c.how };
  }
  lab.setState({ ...st, extra: fine(t) });
  lab.setFacts(key === 'chimp' ? [F(t, 'genome', '🐒', SRC.genome), F(t, 'chimp6', '🌍', SRC.chimp6)]
    : key === 'fly' ? [F(t, 'fly', '🦇', SRC.conv)]
      : [F(t, 'whale', '🦛', SRC.whale)]);
}

function matrixHtml(t, set, U, step) {
  let live = U.leaves.slice();
  for (let j = 0; j < step; j++) { live = live.filter((x) => !U.steps[j].kids.includes(x)); live.push(U.steps[j]); }
  const pos = (nd) => Math.min(...nd.m.map((id) => U.order.indexOf(id)));
  live.sort((p, q) => pos(p) - pos(q));
  const nxt = U.steps[step], lbl = (nd) => nd.m.slice().sort((p, q) => U.order.indexOf(p) - U.order.indexOf(q)).map((id) => EMO[id]).join('');
  const avg = (X, Y) => { let s = 0; for (const a of X.m) for (const b of Y.m) s += dist(set, a, b); return s / (X.m.length * Y.m.length); };
  const isMin = (X, Y) => nxt && ((X === nxt.kids[0] && Y === nxt.kids[1]) || (X === nxt.kids[1] && Y === nxt.kids[0]));
  const rows = live.map((X) => `<tr><th>${lbl(X)}</th>${live.map((Y) => (X === Y ? '<td class="dg">·</td>' : `<td class="${isMin(X, Y) ? 'min' : ''}">${num(avg(X, Y))}</td>`)).join('')}</tr>`).join('');
  return `<div class="dt-mx-cap">${esc(t.t.tbl)}</div><table class="dt-mx"><tr><th></th>${live.map((X) => `<th>${lbl(X)}</th>`).join('')}</tr>${rows}</table>${nxt ? `<div class="dt-fine">${esc(t.t.nextHint)}</div>` : ''}`;
}

function renderTree(t) {
  lab.setGlow('rgba(143, 127, 216, .26)');
  const gated = S.g1 === null, pre = S.g2 === null;
  if (gated || pre) {
    $('tTools').hidden = true; $('tAsk').hidden = false;
    lab.setReadout('?', '', '', '#8f7fd8');
    lab.setFacts([]);
    if (gated) {
      $('tAsk').innerHTML = `<div class="dt-q">${esc(t.t.gate[0])}</div><p class="dt-hint">${esc(t.t.gate[1])}</p><div class="dt-opts"><button type="button" data-act="goto">${esc(t.t.go)}</button></div>`;
      lab.setState({ emo: '🔢', title: t.t.gate[0], lead: t.t.gate[1], body: '', extra: fine(t) });
    } else {
      const pair = (a, b) => `${EMO[a]} + ${EMO[b]}  ${cap(t.an[a])} + ${t.an[b]}`;
      $('tAsk').innerHTML = askHtml(t.t.q, [['ct', pair('cow', 'human')], ['ts', pair('tuna', 'shark')], ['dh', pair('dolphin', 'hippo')]], 'g2');
      lab.setState({ emo: '🤔', title: t.t.q, lead: t.t.lead0, body: '', extra: fine(t) });
    }
    return;
  }
  $('tAsk').hidden = true; $('tTools').hidden = false;
  const key = curKey(), set = SETS[key], U = UP[key], n = U.steps.length;
  S.step = clamp(S.step, 1, n);
  const nd = U.steps[S.step - 1], last = S.step === n;
  const nm = (x) => x.m.slice().sort((p, q) => U.order.indexOf(p) - U.order.indexOf(q)).map((id) => EMO[id]).join('');
  $('tNext').textContent = t.t.next; $('tNext').disabled = last; $('tAgain').textContent = t.t.again;
  $('tMx').innerHTML = matrixHtml(t, set, U, S.step); $('tChips').innerHTML = chipsHtml(t);
  lab.setReadout(num(nd.d), t.t.axis, t.t.pill(S.step, n), '#8f7fd8');
  let st;
  if (last && key === 'chimp') st = { emo: '🐒', title: t.t.chimp[0], lead: t.t.chimp[1], body: '' };
  else if (last && key === 'fly') st = { emo: '🦇', title: t.t.fly[0], lead: t.t.fly[1], body: '' };
  else if (last) st = { emo: '🌳', title: t.t.doneTitle, lead: t.t.doneLead, body: t.t.doneBody };
  else if (S.step === 1 && key === 'base') st = { emo: S.g2 === 'dh' ? '✅' : '🤔', title: S.g2 === 'dh' ? t.right : t.wrong, lead: t.t.first(t.an[nd.kids[0].leaf], t.an[nd.kids[1].leaf], num(nd.d)), body: t.t.body };
  else st = { emo: '🔗', title: t.t.stepTitle(S.step, nm(nd.kids[0]), nm(nd.kids[1])), lead: t.t.stepLead(t.t.ap(nd.d), nd.m.length > 2), body: t.t.body };
  lab.setState({ ...st, extra: fine(t) });
  const fs = [];
  if (key === 'chimp') fs.push(F(t, 'genome', '🐒', SRC.genome));
  else if (key === 'fly') fs.push(F(t, 'fly', '🦇', SRC.conv));
  else { fs.push(F(t, 'rum', '🐄', SRC.whale)); if (last) fs.push(F(t, 'fish', '🦈', SRC.fish), F(t, 'conv', '🐬', SRC.conv)); }
  lab.setFacts(fs);
}

function renderClock(t) {
  lab.setGlow('rgba(242, 184, 75, .24)');
  const pre = S.g3 === null, tt = tgtT();
  $('kAsk').hidden = !pre; $('kTools').hidden = pre;
  const d = ham(...strips3(tt));
  if (pre) {
    $('kAsk').innerHTML = askHtml(t.k.q(TX, D_X, D_Y), [['0', t.k.opts[0]], ['1', t.k.opts[1]], ['2', t.k.opts[2]]], 'g3', true);
    lab.setReadout(String(d), t.k.sub, t.k.pillX, '#f2b84b');
    lab.setState({ emo: '⏳', title: t.k.xt(t.dif(d)), lead: t.k.lead0, body: '', extra: fine(t) });
    lab.setFacts([]);
    return;
  }
  $('kLbl').textContent = t.k.slider(tt);
  if ($('dtT').value !== String(S.t3)) $('dtT').value = String(S.t3);
  lab.setReadout(String(d), t.k.sub, t.k.pill(tt), '#f2b84b');
  const ok = S.g3 === 0;
  lab.setState(S.moved ? { emo: '⏳', title: t.k.moveT(tt, t.dif(d)), lead: t.k.moveL, body: t.k.moveB, extra: fine(t) }
    : { emo: ok ? '✅' : '🤔', title: `${ok ? t.right : t.wrong} ${t.k.afterT(TY)}`, lead: t.k.afterL(RATE), body: t.k.moveB, extra: fine(t) });
  lab.setFacts([F(t, 'z62', '🧪', SRC.clock), F(t, 'rates', '🐢', SRC.clock)]);
}
render();
</script>
