// --- geometry: the rule view -----------------------------------------------------------------------------------
const M_P = 12; // P keeps this many degrees away from A and B
function clampP(p, a, c) { // P stays on the long arc (from B round to A)
  const lo = a + c + M_P, span = 360 - c - 2 * M_P;
  let rel = wrap360(p - lo);
  if (rel > span) rel = rel - span < (360 - span) / 2 ? span : 0;
  return lo + rel;
}
function clampQ(q, a, c) { // Q stays on the gold arc
  const m = Math.min(10, c / 4), lo = a + m, span = c - 2 * m;
  let rel = wrap360(q - lo);
  if (rel > span) rel = rel - span < (360 - span) / 2 ? span : 0;
  return lo + rel;
}
function ruleGeo(r = RL) {
  const A = polar(r.a), B = polar(r.a + r.c), P = polar(r.p), Q = polar(r.q), O = [CX, CY];
  return { A, B, P, Q, O, cen: angleAt(O, A, B), ins: angleAt(P, A, B), insQ: angleAt(Q, A, B) };
}

    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2; c.beginPath(); c.rect(pA[0], m(0, -1.8)[1], pB[0] - pA[0], 1.8 * k); c.stroke();
    const dy = mp([0, 30])[1];
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.5; c.beginPath();
    c.moveTo(pA[0], dy); c.lineTo(pB[0], dy); c.moveTo(pA[0], dy - 5); c.lineTo(pA[0], dy + 5); c.moveTo(pB[0], dy - 5); c.lineTo(pB[0], dy + 5); c.stroke();
    pill(c, T[lang].goal, (pA[0] + pB[0]) / 2, mp([0, 14])[1], WHITE, { fixed: true });
    dot(c, pA, 6, WHITE, false); dot(c, pB, 6, WHITE, false);
  } else {
    const sea = c.createLinearGradient(0, 0, 0, h); sea.addColorStop(0, '#0f5d8c'); sea.addColorStop(1, '#0a3a60');
    c.save(); c.beginPath(); c.roundRect(mp([6, 8])[0], mp([6, 8])[1], (354 - 6) * s, (H - 16) * s, 16 * s); c.clip();
    c.fillStyle = sea; c.fillRect(0, 0, w, h);
    c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 1.5;
    for (let j = 0; j < 9; j++) for (let i = 0; i < 7; i++) {
      const x = mp([(i + (j % 2) * .5) * 56 + 14, 0])[0], y = mp([0, Y0 + 24 + j * 30])[1];
      c.beginPath(); c.arc(x, y, 9 * s, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
    }
    c.fillStyle = '#2b4a3f'; c.beginPath(); c.rect(0, 0, w, pA[1]); c.fill(); // the shore
    c.fillStyle = '#35594c'; c.fillRect(0, pA[1] - 5 * s, w, 5 * s);
    c.restore();
    lighthouse(c, pA, s); lighthouse(c, pB, s);
  }
  // ---- the circle through both posts, and the seats along its long arc
  c.save();
  const g2 = c.createRadialGradient(O[0], O[1], 0, O[0], O[1], Math.max(1, r)); g2.addColorStop(0, 'rgba(255,255,255,0)'); g2.addColorStop(1, 'rgba(255,255,255,.08)');
  c.fillStyle = g2; c.beginPath(); c.arc(O[0], O[1], Math.max(0, r), aB, aA, false); c.closePath(); c.fill();
  c.setLineDash([5, 5]); c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.5; c.beginPath(); c.arc(O[0], O[1], Math.max(0, r), aA, aB + TAU, false); c.stroke(); // the short arc behind the goal line
  c.setLineDash([]);
  c.lineCap = 'round'; c.strokeStyle = GOLD; c.shadowColor = GOLD; c.shadowBlur = ship ? 12 : 8; c.lineWidth = ship ? Math.max(4, 5 * s) : Math.max(8, 10 * s); c.globalAlpha = ship ? 1 : .35;
  c.beginPath(); c.arc(O[0], O[1], Math.max(0, r), aB, aA, false); c.stroke();
  c.restore();
  if (!ship) { // seat tiles along the arc
    const n = Math.floor((aA - aB) * r / (9 * s));
    c.save(); c.fillStyle = GOLD; c.strokeStyle = '#a97a10'; c.lineWidth = 1;
    for (let i = 0; i <= n; i++) {
      const a = aB + (aA - aB) * i / n, x = O[0] + Math.cos(a) * r, y = O[1] + Math.sin(a) * r;
      c.save(); c.translate(x, y); c.rotate(a + Math.PI / 2); c.beginPath(); c.roundRect(-3.5 * s - 1, -2.5 * s - 1, 7 * s + 2, 5 * s + 2, 2); c.fill(); c.stroke(); c.restore();
    }
    c.restore();
  }
  // ---- view cones (hidden while the child predicts)
  const seats = ST.seats, sp = seats.map((q) => m(q.x, q.y));
  if (!open) {
    for (let i = 0; i < seats.length; i++) {
      const on = i === ST.sel, al = (on ? 1 : .45) * rv;
      c.save(); c.globalAlpha = (on ? .22 : .1) * rv; c.fillStyle = CORAL; c.beginPath(); c.moveTo(sp[i][0], sp[i][1]); c.lineTo(pA[0], pA[1]); c.lineTo(pB[0], pB[1]); c.closePath(); c.fill(); c.restore();
      line(c, sp[i], pA, CORAL, on ? Math.max(2, 2.4 * s) : 1.5, al); line(c, sp[i], pB, CORAL, on ? Math.max(2, 2.4 * s) : 1.5, al);
      angleMark(c, sp[i], pA, pB, 20 * s, CORAL, 'arc', al);
    }
  }
  // ---- seats
  const order = seats.map((_, i) => i).sort((a, b) => (a === ST.sel) - (b === ST.sel)); // the selected one on top
  for (const i of order) {
    if (ship) boat(c, sp[i], s, true);
    else dot(c, sp[i], i === ST.sel ? 9.5 : 8.5, i === ST.sel ? CORAL : '#ffe9b3');
    if (!open) handle(c, String(i), ship ? [sp[i][0], sp[i][1] - 6] : sp[i], i === ST.sel ? CORAL : '#ffe9b3', time, S.hint && i === ST.sel);
  }
  if (!open) {
    for (let i = 0; i < seats.length; i++) {
      const a = Math.atan2((pA[1] + pB[1]) / 2 - sp[i][1], (pA[0] + pB[0]) / 2 - sp[i][0]);
      pill(c, `${Math.round(viewAngle(seats[i]))}°`, sp[i][0] + Math.cos(a) * 46 * s, sp[i][1] + Math.sin(a) * 46 * s, i === ST.sel ? CORAL : '#ffe9b3', { alpha: rv, dir: -1 });
    }
  }
}

// --- drawing: charts (small canvases in the controls) ---------------------------------------------------------------------
function chartText(c, text, x, y, col, align = 'left') {
  c.save(); c.font = '700 12px Nunito, sans-serif'; c.fillStyle = col; c.textAlign = align; c.textBaseline = 'middle'; c.fillText(text, x, y); c.restore();
}
function drawScatter(c, w, h, dt, time) {
  const t = T[lang], pr = S.pr.rule, L = 38, Rr = 14, Tp = 12, Bt = 42, pw = w - L - Rr, ph = h - Tp - Bt;
  const X = (x) => L + x / 180 * pw, Y = (y) => Tp + ph - y / 90 * ph;
  c.strokeStyle = 'rgba(130,145,190,.22)'; c.lineWidth = 1; c.beginPath();
  for (const x of [0, 90, 180]) { c.moveTo(X(x), Tp); c.lineTo(X(x), Tp + ph); chartText(c, `${x}°`, X(x), Tp + ph + 13, '#98A0B8', x === 0 ? 'left' : x === 180 ? 'right' : 'center'); }
  for (const y of [0, 45, 90]) { c.moveTo(L, Y(y)); c.lineTo(L + pw, Y(y)); chartText(c, `${y}°`, L - 6, Y(y), '#98A0B8', 'right'); }
  c.stroke();
  chartText(c, t.central, L + pw / 2, h - 10, TEAL, 'center');
  chartText(c, t.inscribed, L + 8, Tp + 10, CORAL, 'left');
  if (pr.st === 'done') { // the rule: y = x / 2
    const k = ease((time - pr.at - .25) / .9);
    c.save(); c.strokeStyle = GOLD; c.lineWidth = 2.5; c.setLineDash([7, 5]); c.lineCap = 'round';
    c.beginPath(); c.moveTo(X(0), Y(0)); c.lineTo(X(180 * k), Y(90 * k)); c.stroke(); c.restore();
  }
  for (let i = 0; i < RL.pairs.length; i++) {
    const [cx, iy] = RL.pairs[i], p = [X(cx), Y(iy)];
    c.save(); c.shadowColor = CORAL; c.shadowBlur = 8; c.fillStyle = CORAL; c.beginPath(); c.arc(p[0], p[1], 5.5, 0, TAU); c.fill(); c.restore();
    c.strokeStyle = WHITE; c.lineWidth = 1.2; c.beginPath(); c.arc(p[0], p[1], 5.5, 0, TAU); c.stroke();
  }
  if (pr.st !== 'open') { // where the picture is right now
    const g = ruleGeo(), p = [X(g.cen), Y(g.ins)], k = (time * 1.2) % 1;
    c.save(); c.strokeStyle = WHITE; c.lineWidth = 2; c.beginPath(); c.arc(p[0], p[1], 7, 0, TAU); c.stroke();
    c.globalAlpha = .5 * (1 - k); c.lineWidth = 1.5; c.beginPath(); c.arc(p[0], p[1], 7 + 9 * k, 0, TAU); c.stroke(); c.restore();
  }
}
function drawArcGraph(c, w, h, dt, time) {
  if (S.pr.stadium.st === 'open') return;
  const t = T[lang], arc = ST.arc, L = 38, Rr = 14, Tp = 12, Bt = 30, pw = w - L - Rr, ph = h - Tp - Bt;
  const x0 = -arc.R, x1 = 8, X = (x) => L + (clamp(x, x0, x1) - x0) / (x1 - x0) * pw, Y = (y) => Tp + ph - clamp(y, 0, 90) / 90 * ph;
  c.strokeStyle = 'rgba(130,145,190,.22)'; c.lineWidth = 1; c.beginPath();
  for (const y of [0, 45, 90]) { c.moveTo(L, Y(y)); c.lineTo(L + pw, Y(y)); chartText(c, `${y}°`, L - 6, Y(y), '#98A0B8', 'right'); }
  c.stroke();
  c.save(); c.setLineDash([5, 4]); c.strokeStyle = GOLD; c.globalAlpha = .6; c.lineWidth = 1.5; c.beginPath(); c.moveTo(X(0), Tp); c.lineTo(X(0), Tp + ph); c.moveTo(L, Y(ST.deg)); c.lineTo(L + pw, Y(ST.deg)); c.stroke(); c.restore();
  chartText(c, t.inside, L, h - 10, '#98A0B8', 'left'); chartText(c, t.onArc, X(0), h - 10, GOLD, 'center'); chartText(c, t.outside, L + pw, h - 10, '#98A0B8', 'right');
  const q = ST.seats[ST.sel], O = [0, arc.c], d = Math.hypot(q.x - O[0], q.y - O[1]) || 1, u = [(q.x - O[0]) / d, (q.y - O[1]) / d];
  c.save(); c.strokeStyle = CORAL; c.lineWidth = 2.5; c.lineJoin = 'round'; c.beginPath(); let pen = false;
  for (let sx = 0; sx <= arc.R + x1 + 1e-6; sx += .2) { // the viewing angle along the line from the circle's centre through the seat
    const P = [O[0] + u[0] * sx, O[1] + u[1] * sx];
    if (P[1] < .6 || P[1] > 18.4 || Math.abs(P[0]) > 11.5) { pen = false; continue; }
    const xx = X(sx - arc.R), yy = Tp + ph - angleAt(P, GA, GB) / 90 * ph;
    if (yy < Tp - 2) { pen = false; continue; }
    if (pen) c.lineTo(xx, yy); else c.moveTo(xx, yy);
    pen = true;
  }
  c.stroke(); c.restore();
  for (const tr of ST.trail) { c.save(); c.globalAlpha = .35; c.fillStyle = WHITE; c.beginPath(); c.arc(X(tr.d), Y(tr.a), 2.5, 0, TAU); c.fill(); c.restore(); }
  const cur = [X(distFromArc(q)), Y(viewAngle(q))];
  dot(c, cur, 6.5, CORAL);
  chartText(c, `${Math.round(viewAngle(q))}°`, clamp(cur[0] + 12, L + 14, L + pw - 14), clamp(cur[1] - 14, Tp + 6, Tp + ph), CORAL, cur[0] + 40 > L + pw ? 'right' : 'left');
}

// --- pointer: drag the handles --------------------------------------------------------------------------------------------
const cv = $('cv');
const pos = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
const nearest = (x, y) => { let best = null, bd = 1e9; for (const hd of G.hs) { const d = Math.hypot(hd.x - x, hd.y - y); if (d < bd) { bd = d; best = hd; } } return bd <= 30 ? best : null; };
function dragTo(id, x, y) {
  const v = lab.view, [dx, dy] = unmp(x, y);
  if (v === 'rule') {
    const phi = deg(Math.atan2(dy - CY, dx - CX));
    if (id === 'A') { const b = RL.a + RL.c; let cc = wrap360(b - snap2(phi)); if (cc > 180) cc = cc < 270 ? 180 : 20; cc = Math.max(20, cc); RL.a = b - cc; RL.c = cc; }
    else if (id === 'B') { let cc = wrap360(snap2(phi) - RL.a); if (cc > 180) cc = cc < 270 ? 180 : 20; cc = Math.max(20, cc); RL.c = cc; }
    else if (id === 'P') { RL.p = clampP(phi, RL.a, RL.c); pushTrail(RL.trail, RL.p); }
    else if (id === 'Q') RL.q = clampQ(phi, RL.a, RL.c);
    fixRule();
  } else if (v === 'thales') {
    TH.p = clampTh(deg(Math.atan2(dy - CY, dx - CX))); pushTrail(TH.trail, TH.p);
  } else {
    const i = +id, arc = ST.arc;
    let q = { x: clamp((dx - CX) / K, -11.4, 11.4), y: clamp((dy - Y0) / K, .7, 18.3) };
    const d = Math.hypot(q.x, q.y - arc.c);
    if (Math.abs(d - arc.R) * K * G.s < 12) { const k = arc.R / d; q = { x: q.x * k, y: arc.c + (q.y - arc.c) * k }; } // close to the arc: it clicks onto it
    q.y = Math.max(q.y, .3); ST.seats[i] = q;
    ST.sel = i;
    ST.trail.push({ d: distFromArc(ST.seats[i]), a: viewAngle(ST.seats[i]) }); if (ST.trail.length > 70) ST.trail.shift();
  }
}
cv.addEventListener('pointerdown', (ev) => {
  const [x, y] = pos(ev), hd = nearest(x, y); if (!hd) return;
  S.drag = hd.id; S.hint = false; try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
  if (lab.view === 'stadium') { ST.sel = +hd.id; render(); }
  dragTo(hd.id, x, y); ev.preventDefault();
});
cv.addEventListener('pointermove', (ev) => {
  const [x, y] = pos(ev);
  if (S.drag === null) { cv.style.cursor = nearest(x, y) ? 'grab' : 'default'; return; }
  cv.style.cursor = 'grabbing'; dragTo(S.drag, x, y);
});
const endDrag = () => { if (S.drag !== null) { S.drag = null; if (lab.view === 'stadium') render(); } };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls ---------------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function setSec(k) {
  const was = S.sec; S.sec = k;
  if ((was === 'ship') !== (k === 'ship')) { setArc(k === 'ship' ? 40 : 34); defaultSeats(); }
  if (k === 'opp') RL.q = RL.a + RL.c / 2;
}
function goView(v) { setSec(null); lab.view = v; lab.renderChrome(); lab.checkStage?.(); }
function pressSec(k) {
  if (!secret.unlocked()) return secret.open();
  const target = k === 'ship' ? 'stadium' : 'rule';
  if (lab.view !== target) { goView(target); if (S.pr[target].st === 'open') { render(); return; } } // the prediction comes first
  else if (S.pr[target].st === 'open') return;
  setSec(S.sec === k ? null : k); sfx.click(); render();
}
function startRulePrediction() {
  const { tg, ans } = ruleSetup(), pr = S.pr.rule;
  RL.tg = { ...tg, p: tg.p + 360 * Math.round((RL.p - tg.p) / 360) }; // glide the short way round
  pr.st = 'open'; pr.ans = ans; pr.pick = null; setSec(null);
  RL.trail.length = 0; sfx.snap();
}
function record() {
  const g = ruleGeo(), cen = Math.round(g.cen), ins = Math.round(g.ins);
  if (RL.pairs.some((q) => q[0] === cen && q[1] === ins)) { // the same pair twice teaches nothing
    sfx.bad(); const n = $('recNote'); n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); return;
  }
  RL.pairs.push([cen, ins]); sfx.snap();
  if (RL.pairs.length >= 3 && S.pr.rule.st === 'idle') { startRulePrediction(); render(); showStage(); return; }
  render();
}
function answer(v, i) {
  const pr = S.pr[v]; if (pr.st !== 'open') return;
  pr.pick = i; pr.st = 'done'; pr.at = nowS();
  (i === pr.ans ? sfx.good : sfx.bad)(); render(); showStage();
}
$('recBtn').addEventListener('click', record);
$('ctrlBody').addEventListener('click', (ev) => {
  const p = ev.target.closest('[data-pick]');
  if (p) return answer(p.dataset.v, +p.dataset.pick);
  const sc = ev.target.closest('[data-sec]');
  if (sc) pressSec(sc.dataset.sec);
});

// --- one render per change: controls, readout, state card ------------------------------------------------------------
function askHTML(v, t) {
  const pr = S.pr[v]; if (pr.st === 'idle') return '';
  const done = pr.st === 'done';
  const chips = t[`${v}Opts`].map((o, i) => {
    let cls = 'chip ia-c';
    if (done) cls += i === pr.ans ? ' good locked' : i === pr.pick ? ' bad locked' : ' dim locked';
    return `<button type="button" class="${cls}" data-v="${v}" data-pick="${i}">${esc(o)}</button>`;
  }).join('');
  const verdict = done ? `<div class="ia-verdict ${pr.pick === pr.ans ? 'ok' : 'no'}">${esc(pr.pick === pr.ans ? t[`${v}Right`] : t[`${v}Wrong`])}</div>` : '';
  const card = v === 'rule' && done ? `<div class="ia-formula">${esc(t.ruleCard)}</div>` : '';
  return `<div class="ia-ask"><div class="ia-q">${esc(t[`${v}Ask`])}</div><div class="ia-opts">${chips}</div>${verdict}${card}</div>`;
}
function render() {
  const t = T[lang], v = lab.view, pr = S.pr[v], st = t.st[v];
  $('secRule').style.display = v === 'rule' ? 'block' : 'none';
  $('secThales').style.display = v === 'thales' ? 'block' : 'none';
  $('secStadium').style.display = v === 'stadium' ? 'block' : 'none';
  $('askRule').innerHTML = askHTML('rule', t); $('askThales').innerHTML = askHTML('thales', t); $('askStadium').innerHTML = askHTML('stadium', t);
  $('gcStad').style.display = S.pr.stadium.st === 'done' ? 'block' : 'none';
  // rule: record button, count, note, table
  const n = RL.pairs.length, ruleOpen = S.pr.rule.st === 'open';
  $('recBtn').textContent = `＋ ${t.record}`; $('recBtn').disabled = ruleOpen;
  $('recCount').textContent = n ? t.recorded(n) : '';
  $('recNote').textContent = S.pr.rule.st === 'idle' && n < 3 ? t.needPairs : '';
  const last = RL.pairs.slice(-6);
  $('tabRule').innerHTML = n ? `<table class="ia-tab"><tr class="ce"><th>${esc(t.central)}</th>${last.map((q) => `<td>${q[0]}°</td>`).join('')}</tr><tr class="in"><th>${esc(t.inscribed)}</th>${last.map((q) => `<td>${q[1]}°</td>`).join('')}</tr></table>` : '';
  // secrets
  const open = secret.unlocked();
  const sc = (k, emo, key) => `<button type="button" class="chip secret ia-c ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('ship', '⛵', 'a') + sc('opp', '🔄', 'b');
  // state card
  let state;
  if (S.sec === 'ship') state = { emo: '⛵', title: t.secrets.a[0], lead: t.shipText, body: '' };
  else if (S.sec === 'opp') state = { emo: '🔄', title: t.secrets.b[0], lead: t.secrets.b[1], body: '' };
  else if (pr.st === 'done') state = { emo: st[0], title: st[1], lead: st[2], body: st[3] };
  else if (pr.st === 'open') state = { emo: st[0], title: t[`${v}Ask`], lead: '', body: '' };
  else state = { emo: st[0], title: t.findTitle, lead: st[2], body: '' }; // the rule view before the prediction: the rule itself stays hidden
  lab.setState({ ...state, extra: '' });
  lab.setFacts(t.facts[v]);
  lab.setGlow(v === 'rule' ? 'rgba(255, 107, 107, .22)' : v === 'thales' ? 'rgba(46, 196, 182, .24)' : 'rgba(255, 209, 102, .2)');
  roKey = ''; liveReadout();
}
let roKey = '';
function liveReadout() { // the readout follows the dragging, so it is also called every frame (it only touches the page when the text changes)
  const t = T[lang], v = lab.view, open = S.pr[v].st === 'open';
  let val, sub, pillT, col;
  if (v === 'rule') {
    const g = ruleGeo(), cen = Math.round(g.cen), ins = Math.round(g.ins);
    col = '#ff6b6b'; pillT = t.aob(cen); sub = t.inscribed;
    val = open ? '?' : S.sec === 'opp' ? t.oppText(ins, Math.round(g.insQ)) : t.apb(ins);
  } else if (v === 'thales') {
    col = '#1f9d92'; pillT = t.thales; sub = t.inscribed;
    val = open ? '?' : `${Math.round(angleAt(polar(TH.p), polar(180), polar(0)))}°`;
  } else {
    const q = ST.seats[ST.sel], d = distFromArc(q);
    col = '#d09a1f'; sub = '';
    val = open ? '?' : t.viewAngle(Math.round(viewAngle(q)));
    pillT = open ? '' : Math.abs(d) < .005 ? t.onArc : d < 0 ? t.inside : t.outside;
  }
  const key = [lang, v, val, sub, pillT].join('|');
  if (key === roKey) return;
  roKey = key; lab.setReadout(val, sub, pillT, col);
}

render();
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  (v === 'rule' ? drawRule : v === 'thales' ? drawThales : drawStadium)(c, w, h, dt, time);
  liveReadout();
});
canvasLoop($('gcRule'), (c, w, h, dt, time) => { if (lab.view === 'rule') drawScatter(c, w, h, dt, time); });
canvasLoop($('gcStad'), (c, w, h, dt, time) => { if (lab.view === 'stadium') drawArcGraph(c, w, h, dt, time); });
</script>
</body>
