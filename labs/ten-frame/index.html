// --- palette and small helpers -----------------------------------------------------------------------------
const WOOD = '#C9925A', RED = '#E5484D', GOLD = '#F2B04A', CREAM = '#FFF8EA', INK = '#2B2140', NAVY = '#1E2A4A', STICK = '#E8C38A';
const FONT = "'Nunito', ui-rounded, system-ui, sans-serif";
const TAU = Math.PI * 2;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };
const easeOutBack = (t) => { const k = 1.70158; t = clamp01(t) - 1; return 1 + (k + 1) * t * t * t + k * t * t; };
const easeOutBounce = (t) => {
  t = clamp01(t);
  if (t < 1 / 2.75) return 7.5625 * t * t;
  if (t < 2 / 2.75) { t -= 1.5 / 2.75; return 7.5625 * t * t + 0.75; }
  if (t < 2.5 / 2.75) { t -= 2.25 / 2.75; return 7.5625 * t * t + 0.9375; }
  t -= 2.625 / 2.75; return 7.5625 * t * t + 0.984375;
};
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = rgb(a), B = rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
const tint = (h, k) => mix(h, '#ffffff', k), shade = (h, k) => mix(h, '#000000', k);
const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };

// the ten-frame engine: F.n counters lie in the two frames, filled row by row, left to right
const F = { n: 0, drop: [], lift: [], fullAt: [null, null], timer: 0 };
function framesSet(n) {
  clearInterval(F.timer);
  F.n = n; F.drop = Array.from({ length: 20 }, (_, i) => (i < n ? -9 : null)); F.lift = [];
  F.fullAt = [n >= 10 ? -9 : null, n >= 20 ? -9 : null];
}
function framesAdd() {
  if (F.n >= 20) return false;
  F.drop[F.n] = now(); F.n++;
  if (F.n === 10) F.fullAt[0] = now() + 0.35;
  if (F.n === 20) { F.fullAt[0] = now() + 0.35; F.fullAt[1] = now() + 0.35; } // at 20 both frames glow
  return true;
}
function framesRemove() {
  if (F.n <= 0) return false;
  F.n--; F.lift.push({ i: F.n, t: now() }); F.drop[F.n] = null;
  if (F.n < 10) F.fullAt[0] = null;
  if (F.n < 20) F.fullAt[1] = null;
  return true;
}
// move to n counters, one every `gap` seconds
function framesTo(n, gap, done, snd, tick) {
  clearInterval(F.timer);
  F.timer = setInterval(() => {
    if (F.n < n) { framesAdd(); setTimeout(snd || sfx.click, 170); }
    else if (F.n > n) { framesRemove(); sfx.tick(); }
    else { clearInterval(F.timer); done?.(); return; }
    tick?.();
  }, gap * 1000);
}
// the sticks: SK[i].p goes 0 (in the heap) to 1 (in its bundle or in the loose row)
const SK = Array.from({ length: 40 }, () => ({ p: 0, d: 0 }));
const B = { n: 23, tied: false, bandAt: [null, null, null, null], squashed: [false, false, false, false] };
function setSticks(n, tied) {
  B.n = n; B.tied = tied;
  SK.forEach((s) => { s.p = tied ? 1 : 0; s.d = 0; });
  B.bandAt = [null, null, null, null].map(() => (tied ? -9 : null));
}
function tieStart(dir) {
  B.tied = dir > 0;
  const nb = Math.floor(B.n / 10);
  SK.forEach((s, i) => { s.d = dir > 0 ? Math.floor(i / 10) * 0.28 + (i % 10) * 0.035 : (i % 10) * 0.012; });
  if (dir < 0) B.bandAt = [null, null, null, null];
  return dir > 0 ? nb * 0.28 + 0.36 + 0.6 + 0.2 : 0;
}

function drawBg(c, w, h, mat) {
  const g = c.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, tint(NAVY, 0.1)); g.addColorStop(1, shade(NAVY, 0.25));
  c.fillStyle = g; c.beginPath(); c.roundRect(0, 0, w, h, 22); c.fill();
  const r = c.createRadialGradient(w * 0.3, h * 0.25, 10, w * 0.3, h * 0.25, Math.max(w, h) * 0.8);
  r.addColorStop(0, 'rgba(255,255,255,.07)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = r; c.beginPath(); c.roundRect(0, 0, w, h, 22); c.fill();
  c.lineWidth = 1; c.strokeStyle = 'rgba(255,255,255,.07)'; c.beginPath(); c.roundRect(0.5, 0.5, w - 1, h - 1, 22); c.stroke();
  if (mat) { // stitching of a desk mat
    c.save(); c.setLineDash([6, 6]); c.strokeStyle = 'rgba(255,255,255,.1)'; c.beginPath(); c.roundRect(8, 8, w - 16, h - 16, 16); c.stroke(); c.restore();
  }
}
// a glossy two-sided disc (counters and coins)
function drawDisc(c, x, y, r, base, o = {}) {
  r = Math.max(0, r); if (r < 1) return;
  const { dy = 0, alpha = 1, label = '', lc = INK, shadow = 1 } = o, by = y + dy;
  c.save();
  c.globalAlpha = alpha * shadow; c.fillStyle = 'rgba(25,10,0,.4)';
  c.beginPath(); c.ellipse(x + r * 0.1, y + r * 0.17, r * 0.98, r * 0.86, 0, 0, TAU); c.fill();
  c.globalAlpha = alpha;
  const g = c.createRadialGradient(x - r * 0.32, by - r * 0.38, r * 0.08, x, by, r * 1.02);
  g.addColorStop(0, tint(base, 0.6)); g.addColorStop(0.3, tint(base, 0.18)); g.addColorStop(0.72, base); g.addColorStop(1, shade(base, 0.32));

  const count = Array.from({ length: 10 }, (_, k) => (t >= dep(k) + 0.45 ? 1 : 0)).reduce((a, b) => a + b, 0);
  // the row of 1-coins (ghost circles where a coin has left)
  for (let k = 0; k < 10; k++) {
    const rx = w * 0.1 + (k + 0.5) * w * 0.8 / 10, q = (t - dep(k)) / 0.45;
    if (q >= 1) { c.strokeStyle = 'rgba(255,255,255,.14)'; c.setLineDash([3, 4]); c.lineWidth = 1; c.beginPath(); c.arc(rx, rowY, r, 0, TAU); c.stroke(); c.setLineDash([]); continue; }
    let x = rx, y = rowY, sc = 1;
    if (q > 0) { const e = ease(q), mxp = (rx + cx) / 2; x = (1 - e) * (1 - e) * rx + 2 * e * (1 - e) * mxp + e * e * cx; y = (1 - e) * (1 - e) * rowY + 2 * e * (1 - e) * (rowY - 24) + e * e * (my + 4); sc = 1 - 0.1 * e; }
    drawDisc(c, x, y, r * sc, WOOD, { label: '1' });
  }
  // the machine
  c.save();
  const shake = shakeT > 0 && shakeT < 1 ? Math.sin(t * 70) * 3 * (1 - shakeT) : 0; c.translate(shake, 0);
  c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 18; c.shadowOffsetY = 8;
  const g = c.createLinearGradient(mx, my, mx + mw, my + mh); g.addColorStop(0, tint(NAVY, 0.5)); g.addColorStop(1, tint(NAVY, 0.15));
  c.fillStyle = g; c.beginPath(); c.roundRect(mx, my, mw, mh, 18); c.fill();
  c.shadowColor = 'transparent'; c.lineWidth = 2; c.strokeStyle = tint(NAVY, 0.7); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.08)'; c.beginPath(); c.roundRect(mx + 6, my + 6, mw - 12, mh * 0.2, 12); c.fill();
  c.fillStyle = '#0d1226'; c.beginPath(); c.roundRect(cx - r * 1.5, my - 3, r * 3, 9, 4); c.fill(); // the slot
  const sw = mw * 0.5, sh = mh * 0.32, sxx = cx - sw / 2, syy = my + mh * 0.2; // the little screen
  c.fillStyle = '#0d1226'; c.beginPath(); c.roundRect(sxx, syy, sw, sh, 10); c.fill();
  c.fillStyle = count >= 10 && t > T1 ? GOLD : tint(GOLD, 0.2); c.font = `900 ${Math.max(16, sh * 0.7)}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(String(count), cx, syy + sh / 2 + 1);
  for (let k = 0; k < 10; k++) { // ten lamps
    const lx = cx - (4.5 - k) * Math.min(14, sw / 11), ly = syy + sh + mh * 0.14, on = k < count;
    c.fillStyle = on ? GOLD : 'rgba(255,255,255,.14)'; c.beginPath(); c.arc(lx, ly, Math.max(3.5, mh * 0.03), 0, TAU); c.fill();
  }
  c.fillStyle = '#0d1226'; c.beginPath(); c.roundRect(mx + mw - 10, my + mh * 0.62, 22, mh * 0.26, 5); c.fill(); // the chute
  c.restore();
  // the big gold 10-coin whooshes out
  const T2 = T1 + 0.6, q2 = (t - T2) / 0.9;
  if (q2 > 0) {
    const e = ease(q2), sx0 = mx + mw, sy0 = my + mh * 0.75, ex = w * 0.8, ey = my + mh * 0.5, R = Math.min(w * 0.11, 38) * (0.6 + 0.4 * e);
    const x = sx0 + (ex - sx0) * e, y = sy0 + (ey - sy0) * e - Math.sin(Math.PI * e) * 24;
    if (q2 < 1) for (let j = 1; j <= 4; j++) { c.strokeStyle = `rgba(242,176,74,${0.5 * (1 - q2) / j})`; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(x - R - j * 14, y + (j - 2.5) * 6); c.lineTo(x - R - j * 14 - 12, y + (j - 2.5) * 6); c.stroke(); }
    drawDisc(c, x, y, R, GOLD, { label: '10' });
    if (q2 >= 1) { const sw2 = clamp01(((t - T2 - 0.9) % 2.4) / 0.6); if (sw2 > 0 && sw2 < 1) { c.save(); c.globalAlpha = 0.5 * Math.sin(Math.PI * sw2); c.fillStyle = '#fff'; c.beginPath(); c.arc(x - R * 0.35 + R * 0.7 * sw2, y - R * 0.35, R * 0.09, 0, TAU); c.fill(); c.restore(); } }
  }
}
function miniBundle(c, cx, cy, bw, pitch, sc, band) {
  c.save(); c.translate(cx, cy); c.scale(sc, sc);
  for (let j = 0; j < 10; j++) {
    const yy = (j - 4.5) * pitch, base = mix(STICK, '#D9A96A', rnd(j, 4) * 0.6);
    const g = c.createLinearGradient(0, yy - pitch * 0.4, 0, yy + pitch * 0.4); g.addColorStop(0, tint(base, 0.35)); g.addColorStop(1, shade(base, 0.15));
    c.fillStyle = g; c.beginPath(); c.roundRect(-bw / 2, yy - pitch * 0.42, bw, pitch * 0.84, pitch * 0.4); c.fill();
    c.lineWidth = 0.8; c.strokeStyle = shade(base, 0.4); c.stroke();
  }
  if (band) drawBand(c, 0, 0, 10 * pitch + 4, Math.max(5, bw * 0.13));
  c.restore();
}
function drawHundred(c, w, h, time) {
  drawBg(c, w, h, true);
  const y0 = S.y0, rh = h - y0, t = time - S.secAt, cols = 5, gw = Math.min(w - 36, 560), cw = gw / cols, bw = Math.min(cw - 12, 74), pitch = bw / 8.5, ch = 10 * pitch + 32;
  const gx = (w - gw) / 2, gy = y0 + Math.max(14, (rh - 2 * ch - 90) / 2);
  const tb = 0.3 + 10 * 0.38 + 0.3;
  for (let k = 0; k < 10; k++) {
    const q = (t - (0.3 + k * 0.38)) / 0.35; if (q <= 0) continue;
    const cx = gx + (k % cols + 0.5) * cw, cy = gy + Math.floor(k / cols) * ch + 5 * pitch + 4;
    miniBundle(c, cx, cy, bw, pitch, Math.max(0.01, easeOutBack(q)), true);
    const a = clamp01(q - 0.3), txt = String(10 * (k + 1));
    c.save(); c.globalAlpha = a; c.font = `800 13px ${FONT}`; const tw = c.measureText(txt).width + 14;
    c.fillStyle = 'rgba(14,17,28,.8)'; c.beginPath(); c.roundRect(cx - tw / 2, cy + 5 * pitch + 6, tw, 20, 10); c.fill();
    c.fillStyle = GOLD; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, cx, cy + 5 * pitch + 16.5); c.restore();
  }
  const pb = clamp01((t - tb) / 0.8);
  if (pb > 0) { // the big band around ten bundles
    const bx = gx - 6, by = gy - 10, bW = gw + 12, bH = 2 * ch + 4, q = clamp01((t - tb - 0.8) / 0.4), per = 2 * (bW + bH);
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 8 * (pb < 1 ? 1 : 1.6 - 0.6 * easeOutBack(q)); c.strokeStyle = RED;
    c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 6; c.shadowOffsetY = 2; c.setLineDash(pb >= 1 ? [] : [per * pb, per]);
    c.beginPath(); c.roundRect(bx, by, bW, bH, 20); c.stroke(); c.restore();
  }
  const pc = easeOutBack((t - tb - 1.1) / 0.4);
  if (pc > 0.02) {
    const cwid = Math.min(w - 60, 200), chh = 62, x = (w - cwid) / 2, y = Math.min(h - chh - 16, gy + 2 * ch + 24);
    c.save(); c.translate(w / 2, y + chh / 2); c.scale(pc, pc); c.translate(-w / 2, -(y + chh / 2));
    c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 14; c.shadowOffsetY = 5;
    const g = c.createLinearGradient(0, y, 0, y + chh); g.addColorStop(0, tint(CREAM, 0.6)); g.addColorStop(1, shade(CREAM, 0.07));
    c.fillStyle = g; c.beginPath(); c.roundRect(x, y, cwid, chh, 16); c.fill(); c.shadowColor = 'transparent';
    c.lineWidth = 1.5; c.strokeStyle = shade(CREAM, 0.2); c.stroke();
    c.fillStyle = INK; c.font = `900 42px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('100', w / 2, y + chh / 2 + 2); c.restore();
  }
}

// --- the loop ----------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const ty = panel.offsetHeight + 20;
  S.y0 = S.y0 ? S.y0 + (ty - S.y0) * Math.min(1, dt * 12) : ty;
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (lab.view === 'fill' && S.sec === 'coins') return drawCoins(c, w, h, time);
  if (lab.view === 'fill' && S.sec === 'hundred') return drawHundred(c, w, h, time);
  const t = T[lang], v = lab.view, ft = S.fill, tn = S.teen;
  if (v === 'fill') {
    const n = ft.st === 'play' ? F.n : 14, [td, od] = digitsOf(n);
    const line = ft.st === 'play' ? (td !== null && od > 0 ? [['10', shade(GOLD, 0.22)], [' + ', INK], [String(od), RED], [` = ${n}`, INK]] : td === 2 ? [['10', shade(GOLD, 0.22)], [' + ', INK], ['10', shade(GOLD, 0.22)], [' = 20', INK]] : null)
      : [['10', shade(GOLD, 0.22)], [' + ', INK], ['4', RED], [' = 14', INK]];
    const pa = time - S.pulseAt, pulse = pa >= 0 && pa < 1.8 ? 1 + 0.28 * Math.abs(Math.sin(pa * Math.PI * 1.7)) : 1;
    drawFrameScene(c, w, h, dt, time, { digits: [td, od], line, pulse });
  } else if (v === 'teen') {
    const q = TEEN[tn.i], [td, od] = digitsOf(q.n);
    drawFrameScene(c, w, h, dt, time, { digits: [td, od], word: t.t.words[tn.i], wordA: clamp01((time - S.wordAt) / 0.35) });
  } else {
    const [td, od] = digitsOf(B.n);
    drawBundleScene(c, w, h, dt, time, { digits: [td, od], line: [[t.f.split(td || 0, od), INK]] });
  }
});

// --- controls ----------------------------------------------------------------------------------------------
// on a phone the stage can be partly off-screen: bring it back after an answer
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const later = (ms, fn) => { const tok = S.tok; setTimeout(() => { if (tok === S.tok) fn(); }, ms); };
const verdict = (ok) => (ok ? sfx.good : sfx.bad)();

function enterView() {
  S.tok++; clearInterval(F.timer); S.sec = null; S.link = [0, 0]; S.card = { show: false, at: 0 }; S.wordAt = 1e9; S.linkOn = false;
  const v = lab.view;
  if (v === 'fill') {
    const f = S.fill;
    if (f.st === 'q1a') f.st = 'q1'; else if (f.st === 'q2a') f.st = 'q2r';
    if (f.st === 'q1') framesSet(0); else if (f.st === 'play') { framesSet(f.n); S.card = { show: true, at: -9 }; } else { framesSet(14); S.card = { show: true, at: -9 }; }
    S.linkOn = f.st === 'q2r' || f.st === 'play'; if (S.linkOn) S.link = [1, 1];
  } else if (v === 'teen') {
    const tn = S.teen; if (tn.st === 'anim') tn.st = 'ask';
    if (tn.st === 'ask') startTeen(); else { framesSet(TEEN[tn.i].n); S.card = { show: true, at: -9 }; S.wordAt = -9; }
  } else {
    const b = S.bund; if (b.st === 'anim') b.st = 'ask';
    if (b.st === 'ask') setSticks(BQ[b.i].n, false);
    else if (b.st === 'done') { setSticks(BQ[b.i].n, true); S.card = { show: true, at: -9 }; }
    else { setSticks(b.free, false); }
  }
}
function startTeen() { framesSet(0); S.card = { show: false, at: 0 }; S.wordAt = 1e9; framesTo(TEEN[S.teen.i].n, 0.05, null, sfx.tick); }

function pickFill(j) {
  const f = S.fill;
  if (f.st === 'q1') {
    f.pj = j; f.ok = ORD1[j] === 0; f.st = 'q1a'; showStage();
    framesTo(14, 0.12, () => later(500, () => { S.card = { show: true, at: now() }; later(900, () => { f.st = 'q1r'; verdict(f.ok); render(); }); }));
  } else if (f.st === 'q2') {
    f.pj = j; f.ok = j === 1; f.st = 'q2a'; S.pulseAt = now(); S.linkOn = true; showStage();
    later(1500, () => { f.st = 'q2r'; verdict(f.ok); render(); });
  }
  render();
}
function pickTeen(j) {
  const tn = S.teen; if (tn.st !== 'ask') return;
  tn.pj = j; tn.ok = TEEN[tn.i].opts[j] === TEEN[tn.i].n; tn.st = 'anim'; S.card = { show: true, at: now() }; S.wordAt = now() + 0.65; showStage();
  later(1500, () => { tn.st = 'done'; verdict(tn.ok); render(); });
  render();
}
function pickBund(j) {
  const b = S.bund; if (b.st !== 'ask') return;
  b.pj = j; b.ok = BQ[b.i].opts[j] === BQ[b.i].ok; b.st = 'anim'; showStage();
  const d = tieStart(1); S.card = { show: true, at: now() + d };
  later((d + 0.7) * 1000, () => { b.st = 'done'; verdict(b.ok); render(); });
  render();
}
function nextStep() {
  const f = S.fill, tn = S.teen, b = S.bund, v = lab.view;
  if (v === 'fill') {
    if (f.st === 'q1r') { f.st = 'q2'; f.pj = null; } else if (f.st === 'q2r') { f.st = 'play'; f.n = F.n; }
  } else if (v === 'teen') {
    if (tn.st === 'done') { if (tn.i < 4) { tn.i++; tn.st = 'ask'; tn.pj = null; startTeen(); } else tn.st = 'end'; }
    else if (tn.st === 'end') { tn.i = 0; tn.st = 'ask'; tn.pj = null; startTeen(); }
  } else if (b.st === 'done') {
    if (b.i < 2) { b.i++; b.st = 'ask'; b.pj = null; setSticks(BQ[b.i].n, false); S.card = { show: false, at: 0 }; }
    else { b.st = 'free'; setSticks(b.free, false); S.card = { show: false, at: 0 }; }
  }
  sfx.click(); render();
}
function freeFill(act) {
  clearInterval(F.timer);
  if (act === 'plus') { if (framesAdd()) setTimeout(sfx.click, 170); } else if (act === 'minus') { if (framesRemove()) sfx.tick(); } else if (act === 'empty') { S.fill.n = 0; framesTo(0, 0.05, null, null, render); }
  S.fill.n = act === 'empty' ? 0 : F.n; render();
}

panel.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const v = lab.view;
  if (b.dataset.j !== undefined) { const j = +b.dataset.j; if (v === 'fill') pickFill(j); else if (v === 'teen') pickTeen(j); else pickBund(j); return; }
  const act = b.dataset.act;
  if (act === 'next') nextStep();
  else if (act === 'plus' || act === 'minus' || act === 'empty') freeFill(act);
  else if (act === 'again') { if (S.sec) { S.secAt = now(); sfx.click(); } else nextStep(); render(); }
  else if (act === 'tie') { const d = tieStart(1); S.card = { show: true, at: now() + d }; sfx.click(); render(); }
  else if (act === 'untie') { tieStart(-1); S.card = { show: false, at: 0 }; sfx.click(); render(); }
});
panel.addEventListener('input', (ev) => {
  if (ev.target.id !== 'bRange') return;
  const n = +ev.target.value; S.bund.free = n; setSticks(n, false); S.card = { show: false, at: 0 }; render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.sec; S.sec = S.sec === k ? null : k; S.secAt = now(); sfx.click(); render();
});

// --- render: panel, readout and state card -----------------------------------------------------------------
const qHtml = (q, labels, pj, locked) => `<div class="q">${esc(q)}</div><div class="tf-opts">${labels.map((l, j) => `<button data-j="${j}" class="${pj === j ? 'pk' : ''}"${locked ? ' disabled' : ''}>${esc(l)}</button>`).join('')}</div>`;
const vHtml = (t, ok, text, btn) => `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.wrong)}</div><p>${esc(text)}</p><button class="btn" data-act="${btn || 'next'}">${esc(btn === 'again' ? t.again : t.next)}</button>`;
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('ctrlBody').style.display = v === 'fill' ? '' : 'none';
  if (v === 'fill') renderFill(t); else if (v === 'teen') renderTeen(t); else renderBundle(t);
}
const card = (v, full) => { const [emo, title, lead, body] = SC[lang][v][full ? 'f' : 'n']; lab.setState({ emo, title, lead, body, extra: '' }); };

function renderFill(t) {
  const f = S.fill, st = f.st, open = secret.unlocked();
  $('secChips').innerHTML = [['coins', '🪙'], ['hundred', '💯']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setGlow('rgba(242, 176, 74, .22)');
  const revealed = st !== 'q1' && st !== 'q1a', full = st === 'q2r' || st === 'play';
  if (st === 'play') lab.setReadout(F.n, t.f.split(Math.floor(F.n / 10), F.n % 10), '', GOLD);
  else if (!revealed) lab.setReadout('?', '', '', GOLD);
  else lab.setReadout(14, st === 'q2r' ? t.f.split(1, 4) : '', '', GOLD);
  card('fill', full);
  if (S.sec) {
    const k = S.sec, emo = k === 'coins' ? '🪙' : '💯';
    setPanel('sec' + k, `<div class="tf-t">${emo} ${esc(t.secrets[k][0])}</div><p>${esc(t.sec[k + 'Text'])}</p><button class="btn" data-act="again">${esc(t.again)}</button>`);
    return;
  }
  if (st === 'q1' || st === 'q1a') setPanel('q1' + st + f.pj, qHtml(t.f.q1, ORD1.map((i) => t.f.o1[i]), f.pj, st === 'q1a'));
  else if (st === 'q1r') setPanel('q1r', vHtml(t, f.ok, t.f.r1));
  else if (st === 'q2' || st === 'q2a') setPanel('q2' + st + f.pj, qHtml(t.f.q2, t.f.o2, f.pj, st === 'q2a'));
  else if (st === 'q2r') setPanel('q2r', vHtml(t, f.ok, t.f.r2));
  else {
    setPanel('play', `<div class="tf-row"><button class="tf-sb" data-act="minus" id="pMinus" aria-label="−">−</button><b id="pNum"></b><button class="tf-sb" data-act="plus" id="pPlus" aria-label="+">+</button>
      <button class="chip" data-act="empty" id="pEmpty">${esc(t.f.empty)}</button></div>`);
    $('pNum').textContent = F.n; $('pMinus').disabled = F.n <= 0; $('pPlus').disabled = F.n >= 20; $('pEmpty').disabled = F.n <= 0;
  }
}

function renderTeen(t) {
  const tn = S.teen, q = TEEN[tn.i], st = tn.st, revealed = st === 'anim' ? false : st !== 'ask';
  lab.setGlow('rgba(229, 72, 77, .2)');
  const dots = [0, 1, 2, 3, 4].map((i) => (i < tn.i || (i === tn.i && st === 'end') ? '●' : i === tn.i ? '◉' : '○')).join(' ');
  lab.setReadout(revealed ? q.n : '?', dots, '', RED);
  card('teen', (st === 'done' && tn.i === 4) || st === 'end');
  if (st === 'ask' || st === 'anim') setPanel('ask' + tn.i + st + tn.pj, qHtml(t.t.q, q.opts.map(String), tn.pj, st === 'anim'));
  else if (st === 'done') setPanel('done' + tn.i, vHtml(t, tn.ok, t.t.why[tn.i]));
  else setPanel('end', `<p>${esc(t.t.fun)}</p><button class="btn" data-act="again">${esc(t.again)}</button>`);
}

function renderBundle(t) {
  const b = S.bund, st = b.st, q = BQ[b.i];
  lab.setGlow('rgba(201, 146, 90, .22)');
  const dots = [0, 1, 2].map((i) => (i < b.i || (i === b.i && (st === 'done' || st === 'free')) ? '●' : i === b.i ? '◉' : '○')).join(' ');
  const full = (st === 'done' && b.i === 2) || st === 'free';
  if (st === 'free') {
    const n = B.n, sub = B.tied ? t.f.split(Math.floor(n / 10), n % 10) : t.b.stickN(n);
    lab.setReadout(n, sub, '', STICK);
  } else if (st === 'done') lab.setReadout(q.n, t.f.split(Math.floor(q.n / 10), q.n % 10), '', STICK);
  else lab.setReadout(q.n, `${t.b.stickN(q.n)} · ${dots}`, '', STICK);
  card('bundle', full);
  if (st === 'ask' || st === 'anim') setPanel('ask' + b.i + st + b.pj, qHtml(t.b.q(q.n), q.opts.map(String), b.pj, st === 'anim'));
  else if (st === 'done') setPanel('done' + b.i, vHtml(t, b.ok, t.b.why[b.i]));
  else {
    setPanel('free', `<div class="tf-row"><b id="bNum"></b><input class="big" type="range" min="0" max="40" step="1" id="bRange" aria-label="${esc(t.b.sticks)}"></div>
      <div class="tf-row"><button class="btn" data-act="tie" id="bTie">${esc(t.b.tie)}</button><button class="chip" data-act="untie" id="bUntie">${esc(t.b.untie)}</button></div>`);
    $('bNum').textContent = B.n; if ($('bRange').value !== String(B.n)) $('bRange').value = B.n;
    $('bTie').disabled = B.tied || B.n < 10; $('bUntie').disabled = !B.tied;
  }
}

enterView();
render();
</script>
</body>
</html>
