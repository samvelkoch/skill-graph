// --- helpers -----------------------------------------------------------------------------------------------
const fmt = (s) => { const x = s.toFixed(1); return lang === 'en' ? x : x.replace('.', ','); };

// --- desk (canvas) -------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h) => {

  c.fillStyle = g; c.fillRect(0, 0, w, h);

  for (let i = 0; i < 12; i++) { const y = h * (i + .5) / 12; c.beginPath(); c.moveTo(0, y); c.bezierCurveTo(w * .3, y - 6, w * .7, y + 8, w, y); c.stroke(); }
  const l = c.createRadialGradient(w * .1, -h * .05, 0, w * .1, -h * .05, Math.max(1, h * .95)); l.addColorStop(0, 'rgba(255,214,140,.28)'); l.addColorStop(1, 'rgba(255,214,140,0)');
  c.fillStyle = l; c.fillRect(0, 0, w, h);
  c.save(); c.translate(w * .86, h * .965); c.rotate(-.35); c.lineWidth = 1.5; c.strokeStyle = '#2a1a08';
  const p = c.createLinearGradient(0, -5, 0, 5); p.addColorStop(0, '#ffd983'); p.addColorStop(1, '#c98a22');
  c.fillStyle = p; c.beginPath(); c.roundRect(-44, -4.5, 74, 9, 3); c.fill(); c.stroke();
  c.fillStyle = '#f1d9a8'; c.beginPath(); c.moveTo(30, -4.5); c.lineTo(46, 0); c.lineTo(30, 4.5); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#333'; c.beginPath(); c.moveTo(42, -1.5); c.lineTo(46, 0); c.lineTo(42, 1.5); c.fill(); c.restore();
  const v = c.createRadialGradient(w / 2, h / 2, Math.max(1, h * .3), w / 2, h / 2, Math.max(2, h * .85)); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.4)');
  c.fillStyle = v; c.fillRect(0, 0, w, h);

});
let lastW = '';
function tick() {

  lastW = f; $('tfWatch').textContent = `⏱ ${f} ${T[lang].sec}`;

}

// --- book pages ----------------------------------------------------------------------------------------------
function sentence(bk, si, k, txt, withBold) {

}
function pageHTML(bk, idx) {

  if (idx === 0) return `<div class="tf-bt">🦉 ${esc(t.bk)}</div><h3>${esc(t.toc)}</h3>` + t.secs.map((s, i) =>
    `<button class="tf-toc" data-a="go" data-p="${i + 1}">${esc(s.h)}<span class="ld"></span><i>${i + 2}</i></button>`).join('') +
    `<button class="tf-toc" data-a="go" data-p="5">${esc(t.idxT)} · ${esc(t.glT)}<span class="ld"></span><i>6</i></button>`;
  if (idx === 5) return `<h3>${esc(t.idxT)}</h3>` + sorted(t.ix, (x) => x[0]).map(([w, p]) =>
    `<button class="tf-toc" style="padding:4px 2px;min-height:34px" data-a="go" data-p="${p - 1}">${esc(w)}<span class="ld"></span><i>${p}</i></button>`).join('') +
    `<h3 style="margin-top:10px">${esc(t.glT)}</h3>` + t.gl.map(([w, d]) => `<p><b>${esc(w)}</b> — ${esc(d)}</p>`).join('');
  const s = t.secs[idx - 1];

}
let flipT = 0;
function showPage(animate) {
  const top = $('pgTop'), under = $('pgUnder'), want = { bk: S.bk, idx: S.pg[S.bk] }, old = S.shown;
  clearTimeout(flipT); top.style.transition = 'none'; top.classList.remove('flip'); under.innerHTML = '';
  if (old) top.innerHTML = pageHTML(old.bk, old.idx);
  void top.offsetWidth; top.style.transition = '';
  S.shown = want;
  if (!animate || !old || old.bk !== want.bk || old.idx === want.idx) { top.innerHTML = pageHTML(want.bk, want.idx); top.scrollTop = 0; return; }
  if (want.idx > old.idx) {
    under.innerHTML = pageHTML(want.bk, want.idx); top.classList.add('flip');
    flipT = setTimeout(() => { top.style.transition = 'none'; top.classList.remove('flip'); top.innerHTML = under.innerHTML; under.innerHTML = ''; top.scrollTop = 0; void top.offsetWidth; top.style.transition = ''; }, 560);
  } else {
    under.innerHTML = pageHTML(old.bk, old.idx); top.style.transition = 'none'; top.innerHTML = pageHTML(want.bk, want.idx); top.classList.add('flip');
    void top.offsetWidth; top.style.transition = ''; top.classList.remove('flip'); flipT = setTimeout(() => { under.innerHTML = ''; }, 560);
  }
}
const refreshPage = () => { if (S.shown) $('pgTop').innerHTML = pageHTML(S.shown.bk, S.shown.idx); };
const turn = (idx) => { if (S.ph === 'goA' || S.ph === 'goB') return; idx = clamp(idx, 0, NPG[S.bk] - 1); if (idx === S.pg[S.bk]) return; S.pg[S.bk] = idx; sfx.tick(); showPage(true); renderBookBits(); };

function renderBookBits() {
  const t = T[lang], ph = S.ph, running = ph === 'runA' || ph === 'runB', go = ph === 'goA' || ph === 'goB';
  $('tfTabs').innerHTML = [0, 1].map((i) => { const b = 'AB'[i]; return `<button class="tf-tab${S.bk === b ? ' on' : ''}${ph === 'done' || S.bk === b ? '' : ' lock'}" data-a="tab" data-b="${b}">${esc(t.tabs[i])}</button>`; }).join('');

// --- events: stage -------------------------------------------------------------------------------------------
$('overlay').addEventListener('click', (ev) => {
  const t = T[lang], s = ev.target.closest('.tf-s'), a = ev.target.closest('[data-a]'), w = ev.target.closest('.tf-w.can');
  if (w) { const k = `${w.dataset.w}|${w.dataset.p}`; S.ix.has(k) ? S.ix.delete(k) : S.ix.add(k); sfx.click(); return renderSec(); }
  if (a) {
    const k = a.dataset.a;
    if (k === 'guess') { S.guess = a.dataset.g; S.ph = 'goA'; S.bk = 'A'; S.shown = null; sfx.click(); render(); return; }
    if (k === 'start') { S.t0 = performance.now(); lastW = ''; S.ph = S.bk === 'A' ? 'runA' : 'runB'; sfx.click(); render(); return; }
    if (k === 'nextb') { S.bk = 'B'; S.ph = 'goB'; S.shown = null; sfx.click(); render(); return; }
    if (k === 'again') { Object.assign(S, { ph: 'ask', guess: null, bk: 'A', pg: { A: 0, B: 0 }, found: { A: false, B: false }, shown: null }); sfx.click(); render(); return; }
    if (k === 'tab') { if (S.ph !== 'done' || S.bk === a.dataset.b) return; S.bk = a.dataset.b; S.pg[S.bk] = ANS[S.bk]; sfx.click(); showPage(false); renderBookBits(); return; }

    if (k === 'go') { if (S.ph === 'runB' || S.ph === 'done') turn(+a.dataset.p); return; }
    if (k === 'feat') { if (S.jm !== 'explore') return; S.jf = a.dataset.f; S.seen[S.jf] = 1; sfx.click(); render(); return; }

    const b = S.bk; S.t[b] = (performance.now() - S.t0) / 1000; S.found[b] = true; sfx.good();

});

// --- sticker drag (make view) --------------------------------------------------------------------------------
$('tfTray').addEventListener('pointerdown', (ev) => {
  const b = ev.target.closest('.tf-stk'); if (!b) return;
  const k = b.dataset.k, sx = ev.clientX, sy = ev.clientY; let ghost = null;
  b.setPointerCapture(ev.pointerId);
  const mv = (e) => {
    if (!ghost && !S.mk[k] && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) { ghost = b.cloneNode(true); ghost.className = 'tf-stk tf-ghost'; document.body.append(ghost); }
    if (ghost) { ghost.style.left = `${e.clientX}px`; ghost.style.top = `${e.clientY}px`; }
  };
  const up = (e) => {

    ghost?.remove();

});
function setSticker(k, on) { S.mk[k] = on; S.mkNew = on ? k : null; S.mkRes = null; S.eyeTok++; S.mkRun = false; on ? sfx.snap() : sfx.tick(); render(); }

// --- events: controls ----------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); }
  else if (act === 'mode') { S.jm = b.dataset.m; S.jf = null; S.mans = false; if (S.jm === 'match' && S.mord.length === 0) startMatch(); sfx.click(); }
  else if (act === 'fb') answer(b.dataset.k);
  else if (act === 'jnext') { if (S.mi >= 5) startMatch(); else { S.mi++; S.mtry = 0; S.mans = false; S.jf = null; S.jwrong = ''; } sfx.click(); }
  else if (act === 'find') runEye();
  else if (act === 'mreset') { S.mk = {}; S.mkNew = null; S.mkRes = null; S.eyeTok++; S.mkRun = false; sfx.click(); }
  render();
});
function startMatch() { const a = [0, 1, 2, 3, 4, 5]; for (let i = 5; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } S.mord = a.slice(0, 5); S.mi = 0; S.mtry = 0; S.mres = []; S.mans = false; S.jf = null; S.jwrong = ''; }
function answer(k) {

}

// --- make: the eyes search the page --------------------------------------------------------------------------
function eyePath() {
  const pg = $('mkPage'), ans = pg.querySelector('[data-ans]'); let scope = pg; const path = [];
  if (S.mk.heading) { path.push(...pg.querySelectorAll('.tf-h')); scope = ans.closest('.tf-sec'); }
  const units = [...scope.querySelectorAll(S.mk.bold ? 'p b' : '.tf-s')], target = S.mk.bold ? ans.querySelector('b') : ans;
  path.push(...units.slice(0, units.indexOf(target) + 1));
  return path;
}
async function runEye() {

    return;
  }
  if (!S.shown || S.shown.bk !== S.bk) { S.pg[S.bk] = ph === 'goA' || ph === 'goB' ? 0 : S.pg[S.bk]; showPage(false); }
  if (langChanged) { refreshPage(); langChanged = false; }
  renderBookBits();
  if (ph === 'goA' || ph === 'goB') {
    const [a, b] = t.stGo(t.bookN[S.bk]); lab.setReadout(`0${lang === 'en' ? '.' : ','}0 ${t.sec}`, t.bookN[S.bk], '', '#e0a43a');
    lab.setState({ emo: '📘', title: a, lead: b, body: '', extra: '' });
  } else if (ph === 'runA' || ph === 'runB') {
    lab.setReadout(`${lastW || fmt(0)} ${t.sec}`, t.bookN[S.bk], '', '#e0a43a');
    lab.setState({ emo: '🔎', title: t.q, lead: t.stRun, body: t.stRunL, extra: '' });
  } else if (ph === 'foundA') {
    const [a, b] = t.stFound(`${fmt(S.t.A)} ${t.sec}`); lab.setReadout(`${fmt(S.t.A)} ${t.sec}`, t.bookN.A, '', '#3ddc97');
    lab.setState({ emo: '✅', title: a, lead: b, body: '', extra: '' });
  } else {
    const a = S.t.A, b = S.t.B, same = Math.abs(a - b) <= 0.15 * Math.max(a, b), res = same ? 'S' : a < b ? 'A' : 'B', ok = S.guess === (same ? 'same' : res);
    const gl = S.guess === 'same' ? t.optS : S.guess === 'A' ? t.optA : t.optB;
    lab.setReadout(`${fmt(a)} : ${fmt(b)} ${t.sec}`, `${t.tabs[0]} : ${t.tabs[1]}`, same ? t.pillS : t.pillF(res, fmt(Math.abs(a - b))), '#3ddc97');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.vOk : t.vNo, lead: res === 'B' ? t.resB : res === 'A' ? t.resA : t.resS, body: `${t.guessed} ${gl}`, extra: '' });
  }
}

function jobsHTML(t) {
  const c = (k) => `tf-f${S.jf === k ? ` sel${S.mans ? ' good' : ''}` : ''}`, nm = (k) => esc(t.jb.f[k][0]);
  const f = (k, inner, tag = 'div') => `<${tag} class="${c(k)}" data-a="feat" data-f="${k}" data-name="${nm(k)}">${inner}</${tag}>`;
  const sec = t.secs[1], ix = sorted(t.ix, (x) => x[0]);
  return f('toc', `<b>${esc(t.toc)}</b> ${t.secs.slice(0, 3).map((s, i) => `${esc(s.h)} ${i + 2}`).join(' · ')} …`).replace('class="tf-f', 'class="tf-strip tf-f') +
    f('heading', `<h3 style="margin:0 0 2px">${esc(sec.h)}</h3>`) +
    `<div class="tf-jtext"><div class="tf-pic"><i>${PICS[1]}</i>${f('caption', esc(sec.cap), 'small')}</div><p style="margin-top:6px">${esc(strip(sec.s[2]))} ${bold(sec.s[3], true).replace(/<b>(.+?)<\/b>/, (m, w) => f('bold', w, 'b'))}</p></div>` +
    f('glossary', `<em class="tf-gw">${esc(t.gl[0][0])}</em> — ${esc(t.gl[0][1])}`).replace('class="tf-f', 'class="tf-strip tf-f') +
    f('index', `<b>${esc(t.idxT)}:</b> ${ix.slice(0, 4).map(([w, p]) => `${esc(w)} ${p}`).join(' · ')}`).replace('class="tf-f', 'class="tf-strip tf-f');
}

function renderJobs(t) {
  lab.setGlow('rgba(95, 168, 160, .26)');
  const m = S.jm === 'match', seen = Object.keys(S.seen).length, ended = m && S.mi >= 5, cur = FK[S.mord[S.mi]];
  $('tfJobs').classList.toggle('tf-match', m);
  $('jPage').innerHTML = jobsHTML(t) + '<div class="tf-curl"></div>'; $('jPage').classList.toggle('tf-match', m);
  $('jSeg').innerHTML = [['explore', t.jb.explore], ['match', t.jb.match]].map(([k, l]) => `<button data-act="mode" data-m="${k}" class="${S.jm === k ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('jBtns').style.display = m && !ended ? '' : 'none';
  $('jBtns').innerHTML = FK.map((k) => `<button class="chip tf-fb" data-act="fb" data-k="${k}"${S.mans ? ' disabled' : ''}>${FE[k]} ${esc(t.jb.f[k][0])}</button>`).join('');
  $('jNext').style.display = m && (S.mans || ended) ? '' : 'none';
  $('jNext').textContent = ended ? t.jb.again : t.jb.next;
  if (!m) {
    lab.setReadout(`${seen}/6`, t.jb.seen, '', '#5fa8a0');
    const k = S.jf; lab.setState(k ? { emo: FE[k], title: t.jb.f[k][0], lead: t.jb.f[k][1], body: seen === 6 ? t.jb.sAll[0] + ' ' + t.jb.sAll[1] : '', extra: '' } : { emo: '👆', title: t.jb.s0[0], lead: t.jb.s0[1], body: '', extra: '' });
    return;
  }
  const k = S.mres.filter(Boolean).length; lab.setReadout(`${k}/5`, t.jb.first, '', '#5fa8a0');
  if (ended) lab.setState({ emo: '🏆', title: t.jb.end(k), lead: t.jb.endL, body: '', extra: '' });
  else if (S.mans) lab.setState({ emo: '✅', title: t.jb.right, lead: `${t.jb.f[cur][0]}: ${t.jb.f[cur][1]}`, body: '', extra: '' });
  else lab.setState({ emo: '❓', title: t.jb.qs[cur], lead: t.jb.qn(S.mi + 1), body: S.jwrong ? t.jb.wrong(t.jb.f[S.jwrong][0], t.jb.f[S.jwrong][1]) : '', extra: '' });
}

function renderMake(t) {
  lab.setGlow('rgba(217, 130, 95, .24)');
  const key = `${lang}|${JSON.stringify(S.mk)}`;
  if (key !== S.mkKey) { S.mkKey = key; $('mkPage').innerHTML = mkPageHTML() + '<div class="tf-curl"></div>'; $('mkPage').scrollTop = 0; $('mkWatch').textContent = `⏱ 0 ${t.sec}`; }
  $('tfTray').innerHTML = [['heading', '🏷️'], ['pic', '🖼️'], ['bold', '🅱️'], ['fact', '💡']].map(([k, e]) => `<button class="tf-stk${S.mk[k] ? ' used' : ''}" data-k="${k}"><span class="e">${S.mk[k] ? '✓' : e}</span>${esc(t.mk.sk[k])}</button>`).join('');
  $('mFind').textContent = t.mk.find(t.mq); $('mFind').disabled = S.mkRun; $('mReset').textContent = t.mk.reset; $('mHint').textContent = t.mk.hint;
  const plain = t.secs[0].s.length + 3, n = S.mkRes, m = S.mk;
  if (n === null) {
    lab.setReadout('—', t.mk.unit, `${t.mk.plain}: ${plain} ${t.sec}`, '#d9825f');
    lab.setState({ emo: '📄', title: t.mk.sT, lead: t.mk.sL, body: S.mkRun ? '' : t.mk.ready, extra: '' });
    return;
  }
  lab.setReadout(`${n} ${t.sec}`, t.mk.unit, `${t.mk.plain}: ${plain} ${t.sec}`, '#3ddc97');
  const why = m.heading && m.bold ? t.mk.rHB : m.heading ? t.mk.rH : m.bold ? t.mk.rB : (m.pic || m.fact) ? t.mk.rPF : t.mk.rN;
  lab.setState({ emo: n < plain ? '⚡' : '📄', title: t.mk.res(n, plain), lead: why, body: '', extra: '' });
}
render();
</script>
</body>
