function drawFamily(c, w, h) {
  const lit = famLit(S.fam), t = T[lang], boxes = [];
  c.font = '800 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const [k, n] of Object.entries(FAM)) {
    const bw = Math.max(64, c.measureText(t.sec.famNames[k]).width + 22), bh = 66;
    boxes.push({ k, bw, bh, x: clamp(n.at[0] * w, bw / 2 + 4, w - bw / 2 - 4), y: clamp(n.at[1] * h, bh / 2 + 4, h - bh / 2 - 4) });
  }
  const B = Object.fromEntries(boxes.map((b) => [b.k, b]));
  for (const b of boxes) for (const u of FAM[b.k].up) { // lines first, the boxes cover their ends
    const on = lit.has(b.k) && lit.has(u);
    c.lineWidth = on ? 3.5 : 2; c.strokeStyle = on ? '#f5c84c' : 'rgba(130,145,190,.3)';
    c.beginPath(); c.moveTo(b.x, b.y - b.bh / 2); c.lineTo(B[u].x, B[u].y + B[u].bh / 2); c.stroke();
  }
  for (const b of boxes) {
    const on = lit.has(b.k), sel = b.k === S.fam;
    c.globalAlpha = on ? 1 : .55; c.beginPath(); c.roundRect(b.x - b.bw / 2, b.y - b.bh / 2, b.bw, b.bh, 14);
    c.fillStyle = sel ? 'rgba(245,200,76,.28)' : on ? 'rgba(245,200,76,.12)' : 'rgba(20,24,38,.85)'; c.fill();
    c.lineWidth = sel ? 3 : 1.5; c.strokeStyle = on ? '#f5c84c' : 'rgba(130,145,190,.35)'; c.stroke();
    const f = mapper(b.x, b.y - 11, 13, 0); drawShape(c, { v: FAM[b.k].v }, f, on ? '#f5c84c' : '#98A0B8');
    c.lineWidth = 3; c.fillStyle = on ? '#fff' : '#98A0B8'; c.fillText(t.sec.famNames[b.k], b.x, b.y + b.bh / 2 - 13);
    c.globalAlpha = 1;
  }
  G.fam = boxes;
}
function drawRegular(c, w, h, dt) {
  const P = REG[S.ri], f = fit(P.sh, w, h, 0), V = P.sh.v.length;
  S.rr = clamp(S.rr + (S.rpick === null ? -dt : dt) / 0.5, 0, 1); // plain until the answer, then the clues fade in
  drawShape(c, P.sh, f, COL.regular);
  if (S.rr > 0) { const pts = P.sh.v.map(f); arcs(c, pts, P.p.angGroup, P.p.angs, S.rr); ticks(c, pts, P.p.lenGroup, S.rr); }
}
function drawLines(c, w, h, dt) {
  const L = LIN[S.li], sh = L.sh, V = sh.v.length, f = fit(sh, w, h, L.rot0), P = sh.v.map(f), col = COL.lines;
  G.lines = { P, w, h };
  S.lrev = clamp(S.lrev + (S.lchecked ? dt : -dt) / 0.5, 0, 1);
  const rev = S.lrev, mid = (i) => [(P[i][0] + P[(i + 1) % V][0]) / 2, (P[i][1] + P[(i + 1) % V][1]) / 2];
  const marks = [], good = [];
  const rel = L.q === 'par' ? isPar : isPerp, edge = (i) => [P[i], P[(i + 1) % V]];
  for (let i = 0; i < V; i++) for (let j = i + 1; j < V; j++) if (rel(sh, i, j)) good.push([i, j]);
  const goodEdges = new Set(good.flat());
  if (rev > 0) {
    // every side runs on, faint; the child's pair in its colours; the correct pair(s) in green on top
    for (let i = 0; i < V; i++) longLine(c, ...edge(i), '#9fb0ff', .3 * rev, 2);
    if (!S.lnone && S.lsel.length === 2) S.lsel.forEach((i, k) => longLine(c, ...edge(i), PICK[k], .9 * rev));
    for (const i of goodEdges) longLine(c, ...edge(i), '#3ddc97', .95 * rev, 4);
    for (const [a, b] of good) if (L.q === 'perp') { const X = isect(...edge(a), ...edge(b)); if (X) marks.push({ X, sq: [mid(a), mid(b)] }); }
    if (!S.lnone && S.lsel.length === 2) {
      const [a, b] = S.lsel;
      if (!good.some(([x, y]) => (x === a && y === b) || (x === b && y === a)) && !isPar(sh, a, b)) { const X = isect(...edge(a), ...edge(b)); if (X) marks.push({ X, sq: isPerp(sh, a, b) ? [mid(a), mid(b)] : null }); }
    }
    if (S.lnone && !good.length) { // nothing is parallel: show where the sides meet
      for (let i = 0; i < V; i++) for (let j = i + 2; j < V; j++) if (!(i === 0 && j === V - 1) && !isPar(sh, i, j)) { const X = isect(...edge(i), ...edge(j)); if (X) marks.push({ X }); }
    }
  }
  drawShape(c, sh, f, col);
  if (rev > 0) goodEdges.forEach((i) => { c.globalAlpha = rev; c.lineWidth = 9; c.strokeStyle = '#3ddc97'; c.beginPath(); c.moveTo(...P[i]); c.lineTo(...P[(i + 1) % V]); c.stroke(); c.globalAlpha = 1; });
  S.lsel.forEach((i, k) => { c.lineWidth = rev > 0 && goodEdges.has(i) ? 4 : 7; c.strokeStyle = PICK[k]; c.beginPath(); c.moveTo(...P[i]); c.lineTo(...P[(i + 1) % V]); c.stroke(); });
  for (const m of marks) { // where the lines meet; a little square when they meet at a right angle
    const [X, Y] = m.X; if (X < 0 || X > w || Y < 0 || Y > h) continue;
    c.globalAlpha = rev; c.lineWidth = 2.5; c.strokeStyle = '#fff';
    if (m.sq) {
      const u = unit(m.X, m.sq[0]), q = unit(m.X, m.sq[1]), k = 16;
      c.beginPath(); c.moveTo(X, Y); c.lineTo(X + u[0] * k, Y + u[1] * k); c.lineTo(X + (u[0] + q[0]) * k, Y + (u[1] + q[1]) * k); c.lineTo(X + q[0] * k, Y + q[1] * k); c.closePath();
      c.fillStyle = 'rgba(255,255,255,.3)'; c.fill(); c.stroke();
    } else { c.beginPath(); c.arc(X, Y, 8, 0, 7); c.stroke(); }
    c.globalAlpha = 1;
  }
}

// --- taps and drags on the stage -------------------------------------------------------------------------------
let drag = -1;
const where = (ev) => { const r = $('cv').getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
$('cv').addEventListener('pointerdown', (ev) => {
  const [X, Y] = where(ev), v = lab.view;
  if (v === 'name' && S.sec === 'family' && G.fam) {
    const b = G.fam.find((q) => Math.abs(X - q.x) <= q.bw / 2 && Math.abs(Y - q.y) <= q.bh / 2);
    if (b) { S.fam = b.k; sfx.click(); render(); }
  } else if (v === 'name' && !S.sec && S.mode === 'free' && G.free) {
    let best = -1, bd = 28;
    G.free.pts.forEach(([x, y], i) => { const d = Math.hypot(X - x, Y - y); if (d < bd) { bd = d; best = i; } });
    if (best >= 0) { drag = best; $('cv').setPointerCapture(ev.pointerId); sfx.tick(); }
  } else if (v === 'lines' && !S.lchecked && G.lines) {
    const { P } = G.lines, V = P.length; let best = -1, bd = 24;
    for (let i = 0; i < V; i++) {
      const A = P[i], B = P[(i + 1) % V], dx = B[0] - A[0], dy = B[1] - A[1];
      const t = clamp(((X - A[0]) * dx + (Y - A[1]) * dy) / (dx * dx + dy * dy), 0, 1), d = Math.hypot(X - A[0] - dx * t, Y - A[1] - dy * t);
      if (d < bd) { bd = d; best = i; }
    }
    if (best < 0) return;
    S.lnone = false;
    if (S.lsel.includes(best)) S.lsel = S.lsel.filter((i) => i !== best);
    else { if (S.lsel.length === 2) S.lsel.shift(); S.lsel.push(best); }
    sfx.tick(); render();
  }
});
$('cv').addEventListener('pointermove', (ev) => {
  if (drag < 0 || !G.free) return;
  const [X, Y] = where(ev); let q = G.free.f.inv(X, Y);
  const r = Math.hypot(q[0], q[1]); if (r > 1.5) q = [q[0] * 1.5 / r, q[1] * 1.5 / r];
  const cand = S.free.v.map((p, i) => (i === drag ? q : p));
  if (isSimple(cand)) { S.free.v = cand; S.free.moved = false; render(); }
});
const endDrag = () => { drag = -1; };
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag);

// --- controls ------------------------------------------------------------------------------------------------
// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const linesOK = () => { const L = LIN[S.li], [a, b] = S.lsel; return S.lnone ? !hasPair(L.sh, L.q) : S.lsel.length === 2 && (L.q === 'par' ? isPar : isPerp)(L.sh, a, b); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, F = S.free;
  if (act === 'mode') { S.mode = b.dataset.m; sfx.click(); }
  else if (act === 'pick') {
    if (S.pick !== null) return;
    S.pick = +b.dataset.i; (S.pick === PUZ[S.pi].ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'nnext') { S.pi = (S.pi + 1) % PUZ.length; S.pick = null; S.rv = 0; S.order = shuffled(); sfx.click(); }
  else if (act === 'fdec' || act === 'finc') {
    const n = clamp(F.n + (act === 'finc' ? 1 : -1), 3, 6); if (n === F.n) return;
    F.n = n; F.v = regPoly(n); F.moved = false; sfx.tick();
  } else if (act === 'freset') { F.v = regPoly(F.n); F.rot = 0; F.moved = false; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  } else if (act === 'rpick') {
    if (S.rpick !== null) return;
    S.rpick = b.dataset.y === '1'; (S.rpick === REG[S.ri].p.regular ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'rnext') { S.ri = (S.ri + 1) % REG.length; S.rpick = null; S.rr = 0; sfx.click(); }
  else if (act === 'lnone') { if (S.lchecked) return; S.lnone = !S.lnone; if (S.lnone) S.lsel = []; sfx.click(); }
  else if (act === 'lmain') {
    if (S.lchecked) { S.li = (S.li + 1) % LIN.length; S.lsel = []; S.lnone = false; S.lchecked = false; S.lrev = 0; sfx.click(); }
    else if (S.lnone || S.lsel.length === 2) { S.lchecked = true; (linesOK() ? sfx.good : sfx.bad)(); showStage(); }
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'fRot') { S.free.rot = +ev.target.value; S.free.moved = true; }
  else if (ev.target.id === 'mN') { S.many = +ev.target.value; sfx.tick(); }
  else return;
  render();
});

// --- one render per change: controls, readout, badges and the state card ---------------------------------------
function render() {
  const v = lab.view;
  document.body.dataset.v = v;
  document.body.classList.toggle('drag', v === 'name' && !S.sec && S.mode === 'free');
  $('secName').style.display = v === 'name' ? '' : 'none';
  $('secReg').style.display = v === 'regular' ? '' : 'none';
  $('secLines').style.display = v === 'lines' ? '' : 'none';
  lab.setGlow(GLOW[v]);
  bdEl.classList.remove('show');
  if (v === 'name') renderName(T[lang]); else if (v === 'regular') renderRegular(T[lang]); else renderLines(T[lang]);
}
const fineHTML = (t) => `<div class="fine">${esc(t.fine)}</div>`;
const card = (t, k, extra = {}) => { const [emo, title, lead, body] = t.cards[k]; return { emo, title, lead, body, extra: fineHTML(t), ...extra }; };

function renderName(t) {
  const n = t.n, col = COL.name, unlocked = secret.unlocked(), sec = S.sec, F = S.free;
  const chip = (k, emo) => `<button class="chip secret ${unlocked ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${unlocked ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = chip('family', '🪆') + chip('many', '⭕');
  $('nvTop').style.display = sec ? 'none' : '';
  $('nvPuz').style.display = !sec && S.mode === 'puz' ? '' : 'none';
  $('nvFree').style.display = !sec && S.mode === 'free' ? '' : 'none';
  $('nvMany').style.display = sec === 'many' ? '' : 'none';
  $('modeSeg').innerHTML = [['puz', n.puzzles], ['free', n.free]].map(([m, l]) => `<button data-act="mode" data-m="${m}" class="${S.mode === m ? 'on' : ''}">${esc(l)}</button>`).join('');
  if (sec === 'family') {
    lab.setReadout(esc(t.sec.famNames[S.fam]), '', '', col); bdEl.innerHTML = '';
    return lab.setState({ emo: '🪆', title: t.sec.famNames[S.fam], lead: t.sec.famText[S.fam], body: '', extra: fineHTML(t) });
  }
  if (sec === 'many') {
    if ($('mN').value !== String(S.many)) $('mN').value = S.many;
    $('mN').setAttribute('aria-label', t.secrets.many[0]);
    const p = props({ v: regPoly(S.many) });
    lab.setReadout(esc(t.sec.sidesN(S.many)), '', '', col); bdEl.innerHTML = badgesHTML(p);
    return lab.setState({ emo: '⭕', title: t.secrets.many[0], lead: t.sec.manyText, body: '', extra: fineHTML(t) });
  }
  if (S.mode === 'free') {
    $('fSidesL').textContent = n.sides; $('fN').textContent = F.n; $('fTurnL').textContent = n.turn; $('fReset').textContent = `↺ ${n.reset}`;
    $('fRot').setAttribute('aria-label', n.turn); if ($('fRot').value !== String(F.rot)) $('fRot').value = F.rot;
    document.querySelectorAll('#nvFree .sb').forEach((b) => { b.disabled = (b.dataset.act === 'fdec' && F.n <= 3) || (b.dataset.act === 'finc' && F.n >= 6); });
    const p = props({ v: F.v });
    lab.setReadout(esc(nameOf(p, F.v.length)), '', '', col); bdEl.innerHTML = badgesHTML(p);
    return lab.setState(card(t, 'name', F.moved ? { body: n.sameName } : {}));
  }
  const P = PUZ[S.pi], o = n.opts[P.key], rev = S.pick !== null, ok = S.pick === P.ok;
  $('nQ').textContent = n.q;
  $('nAns').innerHTML = S.order.map((i) => `<button data-act="pick" data-i="${i}" class="${rev ? (i === P.ok ? 'good' : i === S.pick ? 'bad' : '') : ''}"${rev ? ' disabled' : ''}>${esc(o[i])}</button>`).join('');
  $('nNext').style.display = rev ? '' : 'none'; $('nNext').textContent = t.next;
  if (!rev) { // the clues stay fully hidden behind an opaque card until the child answers
    lab.setReadout('?', '', '', col); bdEl.innerHTML = '<span class="bd cover">?</span>'; lab.setState(card(t, 'name'));
  } else {
    lab.setReadout(esc(o[P.ok].split(':')[0]), '', '', col); bdEl.innerHTML = badgesHTML(props(P.sh)); bdEl.classList.add('show');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? n.right_ : n.wrong, lead: n.why[P.key], body: '', extra: fineHTML(t) });
  }
}

function renderRegular(t) {
  const r = t.r, col = COL.regular, P = REG[S.ri], p = P.p, rev = S.rpick !== null, ok = S.rpick === p.regular;
  $('rQ').textContent = r.q;
  $('rAns').innerHTML = [[1, r.yes], [0, r.no]].map(([y, l]) => `<button data-act="rpick" data-y="${y}" class="${rev ? (!!y === p.regular ? 'good' : !!y === S.rpick ? 'bad' : '') : ''}"${rev ? ' disabled' : ''}>${esc(l)}</button>`).join('');
  $('rNext').style.display = rev ? '' : 'none'; $('rNext').textContent = t.next;
  if (!rev) { lab.setReadout('?', '', '', col); bdEl.innerHTML = ''; lab.setState(card(t, 'regular')); return; }
  lab.setReadout(esc(p.regular ? r.yes : r.no), '', '', col);
  bdEl.innerHTML = [[p.allEq, r.sides], [p.allAng, r.angles]].map(([y, l]) => `<span class="bd ${y ? 'y' : 'n'}"><b>${y ? '✓' : '✗'}</b>${esc(l)}</span>`).join('');
  bdEl.classList.add('show');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? r.right_ : r.wrong, lead: r.why[P.key], body: '', extra: fineHTML(t) });
}

function renderLines(t) {
  const l = t.l, col = COL.lines, L = LIN[S.li], ready = S.lnone || S.lsel.length === 2;
  bdEl.innerHTML = '';
  $('lQ').textContent = L.q === 'par' ? l.qPar : l.qPerp;
  $('lNone').textContent = l.none; $('lNone').classList.toggle('on', S.lnone); $('lNone').disabled = S.lchecked;
  $('lMain').textContent = S.lchecked ? t.next : t.check; $('lMain').disabled = !S.lchecked && !ready;
  lab.setReadout(L.q === 'par' ? '∥' : '⊥', '', '', col); // the symbol is the question, never the answer
  if (!S.lchecked) return lab.setState(card(t, 'lines'));
  const ok = linesOK();
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? l.right_ : l.wrong, lead: l.why[L.key], body: '', extra: fineHTML(t) });
}
render();
</script>
