const clock = () => performance.now() / 1000;
const sm = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
const hex = (s) => { const n = parseInt(s.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, k) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], k))).join(',')})`; };
const rng = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const font = (px, w = 800) => `${w} ${px}px Nunito, system-ui, sans-serif`;
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

const R1 = rng(7);
const CRACKS = Array.from({ length: 16 }, () => { let x = R1(), y = R1() * .8; const pts = [[x, y]]; for (let k = 0; k < 4; k++) { x += (R1() - .5) * .18; y += R1() * .14; pts.push([x, y]); } return pts; });
const FLECKS = Array.from({ length: 70 }, () => [R1(), R1(), R1()]);
const SPECK = Array.from({ length: 120 }, () => [R1(), R1(), R1()]);

function txt(c, s, x, y, px, color, align = 'left', alpha = 1, w = 800) {
  c.save(); c.globalAlpha = alpha; c.font = font(px, w); c.fillStyle = color; c.textAlign = align; c.textBaseline = 'middle'; c.fillText(s, x, y); c.restore();
}
function wrap(c, s, maxW, px) {
  c.save(); c.font = font(px);
  const out = []; let cur = '';
  for (const word of String(s).split(' ')) {
    const t = cur ? `${cur} ${word}` : word;
    if (cur && c.measureText(t).width > maxW) { out.push(cur); cur = word; } else cur = t;
  }
  if (cur) out.push(cur);
  c.restore(); return out;
}
// a block of wrapped lines, vertically centred on y when mid is true; returns the lines
function para(c, s, x, y, maxW, px, color, align = 'left', alpha = 1, mid = false) {
  const L = wrap(c, s, maxW, px), lh = px * 1.3, y0 = mid ? y - (L.length - 1) * lh / 2 : y;
  L.forEach((l, i) => txt(c, l, x, y0 + i * lh, px, color, align, alpha));
  return L.length;
}
function tag(c, s, x, y, px, align = 'left', alpha = 1) {
  c.save(); c.font = font(px);
  const tw = c.measureText(s).width + 14, h = px + 9, x0 = align === 'left' ? x : align === 'right' ? x - tw : x - tw / 2;
  c.globalAlpha = alpha; c.fillStyle = 'rgba(10,12,20,.82)'; c.beginPath(); c.roundRect(x0, y - h / 2, tw, h, h / 2); c.fill();
  c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(s, x0 + 7, y + 0.5); c.restore();
}
function emo(c, ch, x, y, px) {
  if (px < 2) return;
  c.save(); c.globalAlpha = 1; c.fillStyle = '#fff'; c.font = `${px}px ${EMO}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ch, x, y); c.restore();
}
function arrow(c, x1, y1, x2, y2, col, lw = 3, hd = 9) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  c.save(); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = lw; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2 - Math.cos(a) * hd * .6, y2 - Math.sin(a) * hd * .6); c.stroke();
  c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - Math.cos(a - .5) * hd, y2 - Math.sin(a - .5) * hd); c.lineTo(x2 - Math.cos(a + .5) * hd, y2 - Math.sin(a + .5) * hd); c.closePath(); c.fill(); c.restore();
}

// --- digging geometry ----------------------------------------------------------------------------------------
function digGeom(place, X, Y, W, H) {
  const ys = Y + H * 0.2, yb = Y + H;
  const L = place === 'field' ? [['topsoil', .05 * H, 0, .4], ['subsoil', .04 * H, .4, 1], ['rock', 0, 1, 30]]
    : place === 'sea' ? [['water', .25 * H, 0, 200], ['sediment', .07 * H, 200, 205], ['basalt', 0, 205, END.sea]]
    : [['foundation', .09 * H, 0, 3], ['topsoil', .05 * H, 3, 4], ['rock', 0, 4, 30]];
  let y = ys;
  const bands = L.map(([k, h, d0, d1]) => { const y0 = y; y = h ? y + h : yb; return { k, y0, y1: y, d0, d1 }; });
  return { ys, yb, bands };
}
const depthAt = (g, y) => { const b = g.bands.find((q) => y <= q.y1) ?? g.bands[g.bands.length - 1]; return lerp(b.d0, b.d1, clamp((y - b.y0) / (b.y1 - b.y0), 0, 1)); };
const digU = (W) => clamp(W / 375, .5, 1.3);
const digTip = (g, f, u) => g.ys + f * (g.yb - 12 * u - g.ys);

function rockRect(c, X, y0, W, hh, base, dark, u) {
  c.save(); c.beginPath(); c.rect(X, y0, W, hh); c.clip();
  c.fillStyle = base; c.fillRect(X, y0, W, hh);
  c.globalAlpha = .4; c.fillStyle = dark;
  for (const [a, b, s] of FLECKS) c.fillRect(X + a * W, y0 + b * hh, (2 + s * 4) * u, (1.5 + s * 3) * u);
  c.globalAlpha = 1; c.strokeStyle = dark; c.lineWidth = Math.max(1, 1.5 * u); c.lineJoin = 'round';
  for (const cr of CRACKS) {
    c.beginPath();
    cr.forEach(([x, y], i) => (i ? c.lineTo(X + x * W, y0 + y * hh) : c.moveTo(X + x * W, y0 + y * hh)));
    c.stroke();
  }
  c.restore();
}
function specks(c, X, W, y0, hh, col, n, u) {
  c.save(); c.fillStyle = col;
  for (let i = 0; i < n; i++) { const s = SPECK[i]; c.fillRect(X + s[0] * W, y0 + s[1] * hh, (1.5 + s[2] * 2.5) * u, (1.5 + s[2] * 2) * u); }
  c.restore();
}
function drawBand(c, b, X, W, u) {
  const hh = b.y1 - b.y0;
  if (b.k === 'water') {
    const gr = c.createLinearGradient(0, b.y0, 0, b.y1); gr.addColorStop(0, '#3a86c9'); gr.addColorStop(1, '#0f3c72');
    c.fillStyle = gr; c.fillRect(X, b.y0, W, hh);
  } else if (b.k === 'sediment') {
    c.fillStyle = '#c8a96b'; c.fillRect(X, b.y0, W, hh);
    c.fillStyle = '#a2834d'; for (let i = 1; i < 4; i++) c.fillRect(X, b.y0 + hh * i / 4, W, Math.max(1, hh * .06));
    specks(c, X, W, b.y0, hh, '#7c6038', 60, u);
  } else if (b.k === 'basalt') rockRect(c, X, b.y0, W, hh, '#2d3039', '#171a21', u);
  else if (b.k === 'rock') rockRect(c, X, b.y0, W, hh, '#707581', '#4a4e59', u);
  else if (b.k === 'topsoil') { c.fillStyle = '#4a2e1e'; c.fillRect(X, b.y0, W, hh); specks(c, X, W, b.y0, hh, '#2a170d', 50, u); specks(c, X, W, b.y0, hh, '#8a6a4a', 14, u); }
  else if (b.k === 'subsoil') { c.fillStyle = '#7e5737'; c.fillRect(X, b.y0, W, hh); specks(c, X, W, b.y0, hh, '#a8835a', 40, u); specks(c, X, W, b.y0, hh, '#5a3a22', 20, u); }
  else if (b.k === 'foundation') {
    c.fillStyle = '#8b8883'; c.fillRect(X, b.y0, W, hh);
    c.fillStyle = '#6e6b66'; for (const f of [.12, .3, .48]) c.fillRect(X + W * f, b.y0, 9 * u, hh);
    c.fillStyle = '#76736e'; c.fillRect(X, b.y0 + hh * .86, W, Math.max(1, hh * .05));
    const py = b.y0 + hh * .55;
    c.fillStyle = '#c2793e'; c.fillRect(X, py, W, 7 * u); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(X, py + 1.2 * u, W, 1.6 * u);
    c.fillStyle = '#7a4318'; for (let x = X + 20 * u; x < X + W; x += 60 * u) c.fillRect(x, py - 1.5 * u, 3 * u, 10 * u);
  }
}

// one cutaway of a place: sky, things on top, layers below. o: { f: drill progress or null, cover, labels, mini }
function drawScene(c, place, X, Y, W, H, o = {}) {
  const g = digGeom(place, X, Y, W, H), u = digU(W), sx = X + W * .68, ys = g.ys;
  const tip = o.f == null ? null : digTip(g, o.f, u);
  c.save(); c.beginPath(); c.rect(X, Y, W, H); c.clip();
  // sky and sun
  const sk = c.createLinearGradient(0, Y, 0, ys); sk.addColorStop(0, '#3d72bb'); sk.addColorStop(1, '#a9d3f1');
  c.fillStyle = sk; c.fillRect(X, Y, W, ys - Y + 1);
  c.fillStyle = '#ffd95a'; c.beginPath(); c.arc(X + W * .9, Y + H * .075, 9 * u, 0, 7); c.fill();
  // houses stand behind the road
  if (place === 'city') {
    const base = ys - 6 * u;
    for (const [fx, fw, fh, col] of [[.04, .17, .13, '#c9604a'], [.24, .14, .16, '#e0b050'], [.42, .16, .11, '#5f8fd0']]) {
      const hx = X + W * fx, hw = W * fw, hh = H * fh;
      c.fillStyle = col; c.fillRect(hx, base - hh, hw, hh);
      c.fillStyle = '#5b3a2e'; c.beginPath(); c.moveTo(hx - 3 * u, base - hh); c.lineTo(hx + hw / 2, base - hh - H * .035); c.lineTo(hx + hw + 3 * u, base - hh); c.closePath(); c.fill();
      c.fillStyle = '#ffe9a8'; c.fillRect(hx + hw * .18, base - hh * .72, hw * .22, hh * .26); c.fillRect(hx + hw * .6, base - hh * .72, hw * .22, hh * .26);
      c.fillStyle = '#4a2e22'; c.fillRect(hx + hw * .4, base - hh * .38, hw * .2, hh * .38);
    }
  }
  // the layers below
  for (const b of g.bands) drawBand(c, b, X, W, u);
  if (place === 'field') { // roots under the tree and a worm
    c.strokeStyle = '#a0794f'; c.lineWidth = Math.max(1, 1.8 * u); c.lineCap = 'round';
    const tx = X + W * .4;
    for (const [dx, dy] of [[-22, .08], [-8, .09], [10, .085], [26, .07]]) { c.beginPath(); c.moveTo(tx, ys); c.quadraticCurveTo(tx + dx * .4 * u, ys + dy * H * .5, tx + dx * u, ys + dy * H); c.stroke(); }
    emo(c, '🪱', X + W * .88, (g.bands[1].y0 + g.bands[1].y1) / 2, 18 * u);
  }
  if (place === 'city' && !o.mini) { // a small subway tunnel cut into the rock
    const rb = g.bands[2], ty = rb.y0 + (rb.y1 - rb.y0) * .5, tx0 = sx + 16 * u, tw = X + W - 8 * u - tx0, th = 36 * u;
    c.fillStyle = '#12141b'; c.beginPath(); c.roundRect(tx0, ty - th / 2, tw, th, th / 2); c.fill();
    c.strokeStyle = '#3b3e48'; c.lineWidth = 2; c.stroke();
    emo(c, '🚇', tx0 + tw / 2, ty, 22 * u);
    g.tunnel = { x: tx0 + tw / 2, y: ty, h: th };
  }
  // the unknown: dark grey with a question mark; it peels away as the drill goes down
  if (o.cover) {
    const start = place === 'sea' ? g.bands[0].y1 : ys, top = Math.max(start, tip ?? start);
    if (top < g.yb) {
      c.fillStyle = '#3a3d46'; c.fillRect(X, top, W, g.yb - top);
      c.fillStyle = '#555a68'; c.fillRect(X, top, W, 2);
      txt(c, '?', X + W / 2, Math.max(top + 36, (top + g.yb) / 2), 64, '#7d8294', 'center', 1, 900);
    }
  }
  // surface details
  if (place === 'field') { c.fillStyle = '#58b04d'; c.fillRect(X, ys - 3 * u, W, 4 * u); }
  if (place === 'city') {
    const ry = ys - 6 * u; c.fillStyle = '#3a3c44'; c.fillRect(X, ry, W, 6 * u + 1);
    c.fillStyle = '#e8e8ee'; for (let x = X + 6 * u; x < X + W; x += 30 * u) c.fillRect(x, ry + 2.5 * u, 14 * u, 1.4 * u);
  }
  if (place === 'sea') {
    c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 2 * u; c.beginPath();
    for (let x = 0; x <= W; x += 6) { const y = ys + Math.sin((x / W) * 18 + (o.time || 0) * 2) * 1.8 * u; x ? c.lineTo(X + x, y) : c.moveTo(X + x, y); }
    c.stroke();
    emo(c, '🐟', X + W * .22, ys + H * .1, 20 * u); emo(c, '🐠', X + W * .47, ys + H * .17, 18 * u);
  }
  // things on top
  if (place === 'field') { emo(c, '🐄', X + W * .17, ys - 15 * u, 34 * u); emo(c, '🌳', X + W * .4, ys - 20 * u, 46 * u); }
  if (place === 'sea') emo(c, '⛵', sx, ys - 15 * u, 36 * u);
  if (place === 'city') emo(c, '🚗', X + W * .3, ys - 20 * u, 26 * u);
  // the drill rig and shaft
  if (!o.mini) {
    const base = place === 'city' ? ys - 6 * u : ys;
    if (place !== 'sea') {
      c.fillStyle = '#b7bccb'; c.fillRect(sx - 3 * u, base - 46 * u, 6 * u, 44 * u);
      c.fillStyle = '#f5c84c'; c.fillRect(sx - 9 * u, base - 49 * u, 18 * u, 5 * u);
      c.beginPath(); c.roundRect(sx - 26 * u, base - 20 * u, 34 * u, 16 * u, 3); c.fill();
      c.fillStyle = '#2b2e38'; c.beginPath(); c.arc(sx - 19 * u, base - 3 * u, 4 * u, 0, 7); c.arc(sx + 1 * u, base - 3 * u, 4 * u, 0, 7); c.fill();
    }
    if (tip !== null) {
      const top = place === 'sea' ? ys : base;
      c.fillStyle = '#dfe3ee'; c.fillRect(sx - 5 * u, top, 10 * u, Math.max(0, tip - top));
      c.fillStyle = '#6a7080'; c.fillRect(sx - 5 * u, top, 1.2, Math.max(0, tip - top)); c.fillRect(sx + 5 * u - 1.2, top, 1.2, Math.max(0, tip - top));
      c.fillStyle = '#f5c84c'; c.strokeStyle = '#8a6a10'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(sx - 8 * u, tip - 6 * u); c.lineTo(sx + 8 * u, tip - 6 * u); c.lineTo(sx, tip + 10 * u); c.closePath(); c.fill(); c.stroke();

  if (o.labels && tip !== null) {
    const bd = T[lang].d.bands;
    for (const b of g.bands) {
      if (tip < b.y0 + 2 && o.f < 1) continue;
      const vis = Math.min(tip, b.y1), hh = b.y1 - b.y0;
      const yc = hh < 40 ? (b.y0 + vis) / 2 : b.y0 + Math.max(12, Math.min((vis - b.y0) / 2, hh * .2));
      tag(c, bd[b.k], X + 8, yc, 12.5);
    }
    if (g.tunnel && tip > g.tunnel.y) tag(c, bd.tunnel, g.tunnel.x, g.tunnel.y + g.tunnel.h / 2 + 12, 12.5, 'center');
  }
  c.restore();
  return { g, tip, u };
}

function drawCompare(c, w, h, time) {
  const pad = 8, gap = 6, cw = (w - 2 * pad - 2 * gap) / 3, hc = h * .6;
  c.fillStyle = '#10131f'; c.fillRect(0, 0, w, h);
  PLACES.forEach((p, i) => drawScene(c, p, pad + i * (cw + gap), pad, cw, hc, { mini: true, time }));
  const by = pad + hc, bh = h - by - pad;
  rockRect(c, pad, by, w - 2 * pad, bh, '#707581', '#4a4e59', 1);
  tag(c, T[lang].d.joined, w / 2, by + bh / 2, 14, 'center');
}

function drawDig(c, w, h, time) {
  const d = S.d, place = PLACES[d.r];
  if (d.all) return drawCompare(c, w, h, time);
  const f = d.ph === 'drill' ? sm((time - d.t0) / DIG_T) : d.ph === 'done' ? 1 : null;
  const { g, tip } = drawScene(c, place, 0, 0, w, h, { f, cover: d.ph !== 'done', labels: f !== null, time });
  if (d.ph === 'drill') {
    if (!d.hit && tip >= g.bands[2].y0) { d.hit = true; sfx.good(); }
    if (time - d.t0 >= DIG_T) { d.ph = 'done'; render(); showStage(); }
  }
}

// --- secret: the whole Earth ---------------------------------------------------------------------------------
const PCT = () => (lang === 'en' ? '0.2' : '0,2');
function drawDeep(c, w, h, dt, time) {
  const s = T[lang].sec;
  S.zoom += ((S.zoomOn ? 1 : 0) - S.zoom) * Math.min(1, dt * 2.4);
  const z = S.zoom < .002 ? 0 : S.zoom > .998 ? 1 : S.zoom;
  c.fillStyle = '#05070d'; c.fillRect(0, 0, w, h);
  const R = Math.min(w * .3, (h - 190) / 2), cx = w / 2, cy = 68 + R;
  const kmPx = R / 6371, tick = 12 * kmPx, crust = 35 * kmPx, K = Math.exp(z * Math.log(70 / tick));
  const Fy = cy - R, Sy = lerp(Fy, h * .34, z);
  c.save();
  c.translate(cx, Sy); c.scale(K, K); c.translate(-cx, -Fy);
  c.fillStyle = '#a07e59'; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.fill();
  const mg = c.createRadialGradient(cx, cy, R * .5, cx, cy, R); mg.addColorStop(0, '#ff9a2e'); mg.addColorStop(1, '#d9381e');
  c.fillStyle = mg; c.beginPath(); c.arc(cx, cy, R - crust, 0, 7); c.fill();
  c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(cx, cy, R * .546, 0, 7); c.fill();
  c.fillStyle = '#fff6c4'; c.beginPath(); c.arc(cx, cy, R * .19, 0, 7); c.fill();

  if (p > .02 && p < .34) {
    c.save(); c.globalAlpha = .8 * (1 - seg(p, .28, .34)); c.strokeStyle = '#8fc3ff'; c.lineWidth = 1.6; c.beginPath();
    for (let i = 0; i < 24; i++) { const s = SPECK[i], x = w * (.12 + .76 * s[0]), y = (time * 260 * (.8 + s[2] * .4) + s[1] * gy) % (gy * .95); c.moveTo(x, y); c.lineTo(x - 2, y + 10 * u); }
    c.stroke(); c.restore();
  }
  // stones, pebbles, sand
  for (const st of STAGES) {
    const a = sm(seg(p, st.in0, st.in0 + .1)) * (1 - (st.out0 == null ? 0 : sm(seg(p, st.out0, st.out0 + .08)))), mv = sm(seg(p, st.in0, st.in0 + .22));
    if (a < .01) continue;
    c.save(); c.globalAlpha = a;
    for (const q of st.parts) {
      const x0 = bx + (q.u - .5) * bw * .9, y0 = gy - 3 - q.v * bh * .9;
      const x1 = bx + (q.fu - .5) * bw * st.spread, y1 = gy - 2 - q.fv * st.mh * bh * (1 - (2 * (q.fu - .5)) ** 2);
      const r = st.rad ? bw * st.rad * (.7 + .5 * q.j) : 2.3 * u * (.7 + .6 * q.j);
      c.fillStyle = st.rad ? mix('#8a8f9b', '#5b6070', q.sh) : mix('#c9ae7c', '#9a8260', q.sh);
      c.beginPath(); c.arc(lerp(x0, x1, mv), lerp(y0, y1, mv), r, 0, 7); c.fill();
      if (st.rad) { c.strokeStyle = '#3b3f49'; c.lineWidth = 1; c.stroke(); }
    }
    c.restore();
  }
  // leaves fall and rot into dark humus; a worm mixes it in
  const MH = .3 * bh, sw = 1.95 * bw, top = (x) => { const t = clamp((x - (bx - sw / 2)) / sw, 0, 1); return gy - 2 - MH * (1 - (2 * t - 1) ** 2); };
  const hc = sm(seg(p, .78, .95));
  if (hc > 0) {
    c.fillStyle = '#3b2616'; c.beginPath();
    const n = 24; for (let i = 0; i <= n; i++) { const x = bx - sw / 2 + sw * i / n; i ? c.lineTo(x, top(x)) : c.moveTo(x, top(x)); }
    for (let i = n; i >= 0; i--) { const x = bx - sw / 2 + sw * i / n, t = i / n; c.lineTo(x, top(x) + .45 * MH * hc * (1 - (2 * t - 1) ** 2 * .3)); }
    c.closePath(); c.fill();
  }
  for (let j = 0; j < 7; j++) {
    const tl = .74 + j * .03, ph = seg(p, tl - .13, tl), x = bx + (j - 3) * bw * .22 + Math.sin(time * 3 + j) * 6 * (1 - ph);
    const sz = 20 * u * (1 - sm(seg(p, tl, tl + .08)));
    if (ph > 0) emo(c, '🍂', x, lerp(h * .05, top(x) - 4, ph), sz);
  }
  if (p > .86) emo(c, '🪱', bx + Math.sin(time * 1.3) * bw * .5, gy - MH * .3, 18 * u);
  if (p > .94) { // what soil is made of
    const a = seg(p, .94, 1), t = T[lang].o;
    c.save(); c.globalAlpha = a; c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.2; c.beginPath();
    c.moveTo(w * .2, gy - MH - 50); c.lineTo(bx - sw * .2, gy - 6); c.moveTo(w * .8, gy - MH - 24); c.lineTo(bx + sw * .15, top(bx + sw * .15) + 6); c.stroke(); c.restore();
    tag(c, t.rock, 8, gy - MH - 52, 12.5, 'left', a);
    tag(c, t.humus, w - 8, gy - MH - 26, 12.5, 'right', a);
  }
}

// the soil jar: everything is mixed at first; heavy grains settle first, clay last, leaves float
const JAR = (() => {
  const r = rng(31), out = [];
  [[14, 0], [40, 1], [55, 2], [70, 3], [16, 4]].forEach(([n, k]) => { for (let i = 0; i < n; i++) out.push({ k, x: r(), y: r(), z: r() }); });
  return out;
})();
const JAR_COL = ['#8b8d94', '#d8bd82', '#b79a72', '#b5603f', '#3e2a1b'], JAR_R = [3.6, 2.4, 1.6, 1, 2.2];
const JAR_FRAC = [.1, .14, .13, .14], JAR_T = [.38, .55, .75, 1];
function soilJar(c, w, h, p, time) {
  const u = clamp(w / 375, .6, 1.3);
  c.fillStyle = '#10131f'; c.fillRect(0, 0, w, h);
  const jw = Math.min(w * .46, 230), jx = 14, jy = h * .12, jh = h * .76;
  const shake = p > 0 && p < .15 ? Math.sin(time * 40) * 5 * (1 - p / .15) : 0;
  c.save(); c.translate(shake, 0);
  const wt = jy + jh * .08, wb = jy + jh - 8, wh = wb - wt;
  c.fillStyle = 'rgba(70,120,170,.35)'; c.beginPath(); c.roundRect(jx, wt, jw, wh, [0, 0, 14, 14]); c.fill();
  for (const q of JAR) {
    const x = jx + 8 + q.x * (jw - 16), r = JAR_R[q.k] * u;
    let y0 = wt + 6 + q.y * (wh - 12), y1, s;
    if (q.k === 4) { y1 = wt + 4 + q.z * 8; s = sm(seg(p, .12, .6)); }
    else {
      const below = JAR_FRAC.slice(0, q.k).reduce((a, b) => a + b, 0);
      y1 = wb - 4 - (below + q.z * JAR_FRAC[q.k]) * (jh * .8); s = sm(seg(p, .12, JAR_T[q.k]));
    }
    const jit = p < .12 ? Math.sin(time * 3 + q.z * 20) * 2 : 0;
    c.fillStyle = JAR_COL[q.k]; c.beginPath();
    if (q.k === 4) c.ellipse(x + jit, lerp(y0, y1, s), r * 1.6, r * .7, q.z * 3, 0, 7); else c.arc(x + jit, lerp(y0, y1, s) + jit, r, 0, 7);
    c.fill();
  }
  // the water stays cloudy until the clay has settled
  c.fillStyle = `rgba(150,115,80,${.12 + .5 * (1 - sm(seg(p, .3, 1)))})`; c.beginPath(); c.roundRect(jx, wt, jw, wh, [0, 0, 14, 14]); c.fill();
  c.strokeStyle = 'rgba(207,228,255,.75)'; c.lineWidth = 3; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(jx + 8, jy); c.lineTo(jx, jy + 12); c.lineTo(jx, jy + jh - 14); c.quadraticCurveTo(jx, jy + jh, jx + 14, jy + jh); c.lineTo(jx + jw - 14, jy + jh);
  c.quadraticCurveTo(jx + jw, jy + jh, jx + jw, jy + jh - 14); c.lineTo(jx + jw, jy + 12); c.lineTo(jx + jw - 8, jy); c.stroke();
  c.fillStyle = '#c9ced9'; c.beginPath(); c.roundRect(jx + 6, jy - 8, jw - 12, 9, 3); c.fill();
  c.restore();
  // a label on each layer
  const la = seg(p, .8, 1), L = T[lang].o.layers, jx2 = jx + jw + 12;
  if (la > 0) {
    for (let k = 0; k < 5; k++) {
      let yc;
      if (k === 4) yc = wt + 8; else { const below = JAR_FRAC.slice(0, k).reduce((a, b) => a + b, 0); yc = wb - 4 - (below + JAR_FRAC[k] / 2) * (jh * .8); }
      c.save(); c.globalAlpha = la; c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1; c.beginPath(); c.moveTo(jx + jw - 6, yc); c.lineTo(jx2 - 4, yc); c.stroke(); c.restore();
      c.fillStyle = JAR_COL[k]; c.save(); c.globalAlpha = la; c.beginPath(); c.arc(jx2 + 5, yc, 5, 0, 7); c.fill(); c.restore();
      para(c, L[k], jx2 + 16, yc, w - jx2 - 24, 12.5, '#fff', 'left', la, true);
    }
  }
}

function soilRuler(c, w, h, p, time) {
  const u = clamp(w / 375, .6, 1.3), gy = h * .74, cm = h * .2, f = sm(seg(p, .03, 1));
  soilGround(c, w, h, gy);
  const x0 = w * .1, sw = w * .5, th = cm * f;
  if (th > 0) { // new soil builds up on the rock, very slowly
    c.fillStyle = '#8a6a48'; c.fillRect(x0, gy - th, sw, th);
    c.fillStyle = '#3b2616'; c.fillRect(x0, gy - th, sw, th * .32);
    specks(c, x0, sw, gy - th, th, '#c9ae7c', 30, u); specks(c, x0, sw, gy - th, th, '#5a3a22', 20, u);
  }
  for (let j = 0; j < 3 && p > .02 && p < 1; j++) { // leaves keep falling
    const ph = (p * 8 + j * .37) % 1; emo(c, '🍂', x0 + sw * (.2 + j * .3), lerp(h * .08, gy - th - 6, ph), 14 * u);
  }
  // a 1 cm ruler
  const rx = w * .7, rw = 24 * u;
  c.fillStyle = '#e8d9a8'; c.fillRect(rx, gy - cm - 8, rw, cm + 8);
  c.fillStyle = '#6b5a2a';
  for (let i = 0; i <= 10; i++) c.fillRect(rx + rw - (i % 5 === 0 ? 14 : 8) * u, gy - cm * i / 10, (i % 5 === 0 ? 14 : 8) * u, 1.5);
  c.strokeStyle = '#ff7a59'; c.lineWidth = 2; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(x0 + sw + 4, gy - cm); c.lineTo(rx + rw + 8, gy - cm); c.stroke(); c.setLineDash([]);
  txt(c, `1 ${T[lang].cm}`, rx + rw + 12, gy - cm - 10, 14, '#fff');
}

// readout and what the soil picture does in time
const soilP = (time) => { const o = S.o; return o.ph === 'ask' ? 0 : o.ph === 'done' ? 1 : clamp((time - o.t0) / SOIL_T[o.q], 0, 1); };
function drawSoil(c, w, h, time) {
  const o = S.o, p = soilP(time);
  [soilBoulder, soilJar, soilRuler][o.q](c, w, h, p, time);
  if (o.ph === 'play' && p >= 1) { o.ph = 'done'; render(); showStage(); }
}

// --- one canvas loop; the readout is NOT updated here only: render() calls it too -----------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'dig') { if (S.sec === 'deep') drawDeep(c, w, h, dt, time); else if (S.sec === 'cycle') drawCycle(c, w, h, time); else drawDig(c, w, h, time); }
  else if (v === 'make') drawMake(c, w, h, time); else drawSoil(c, w, h, time);
  readout(time);
});

$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'make' && S.m.free) { S.m.t0[clamp(Math.floor(y / (r.height / 3)), 0, 2)] = clock(); sfx.click(); }
  else if (lab.view === 'dig' && S.sec === 'cycle') {
    const i = cycleNodes(r.width, r.height).findIndex(([px, py]) => Math.hypot(x - px, y - py) < NR + 8);
    if (i >= 0) { S.node = S.node === i ? -1 : i; sfx.click(); render(); }
  }
});

// --- readout (#val): computed from the state and the clock, so render() and the loop share it -----------------
let roKey = '';
function ro(val, sub = '') {
  const k = `${lang}|${lab.view}|${val}|${sub}`;
  if (k === roKey) return;
  roKey = k; lab.setReadout(esc(val), sub, '', VC[lab.view]);
}
function readout(time = clock()) {
  const t = T[lang], v = lab.view;
  if (v === 'dig') {
    const d = S.d, place = PLACES[d.r];
    if (S.sec === 'deep') return ro(`≈ ${PCT()} %`, '12 / 6371');
    if (S.sec === 'cycle') return ro('🔁', S.node >= 0 ? RES[S.node].map(nm).join(' · ') : '');
    if (d.all) return ro('3 / 3', t.d.joined);
    if (d.ph === 'ask') return ro('?');
    if (d.ph === 'done') return ro(`${END[place]} ${t.d.m}`, t.d.bands[LAST[place]]);
    const r = $('cv').getBoundingClientRect(), W = r.width || 375, H = r.height || 440, g = digGeom(place, 0, 0, W, H);
    const tip = digTip(g, sm((time - d.t0) / DIG_T), digU(W)), b = g.bands.find((q) => tip <= q.y1) ?? g.bands[2];
    return ro(`${Math.round(depthAt(g, tip))} ${t.d.m}`, t.d.bands[b.k]);
  }
  if (v === 'make') {
    const m = S.m, M = t.m;
    if (m.free) return m.pick ? ro(nm(m.pick), M.samples[m.pick]) : ro('🌋');
    if (m.ph === 'ask') return ro('?');
    if (m.ph === 'play') return ro('…');
    return m.q === 0 ? ro(nm('limestone'), M.kinds[1]) : ro(cap(M.o2[1]));
  }
  const o = S.o, p = soilP(time);
  if (o.ph === 'ask') return ro('?');
  if (o.q === 0) return ro(t.o.years(o.ph === 'done' ? 1000 : (() => { const n = Math.round(10 ** (3 * p)); return n < 100 ? n : Math.round(n / 10) * 10; })()));
  if (o.q === 1) return o.ph === 'play' ? ro('…') : ro('🫙');
  return ro(t.o.years(o.ph === 'done' ? 500 : Math.round(500 * seg(p, .03, 1) / 10) * 10), t.o.upTo);
}

// --- controls ------------------------------------------------------------------------------------------------
function qBlock(q, labels, pick, ok, mode, swatches) {
  const cls = (i) => (mode === 'done' ? (i === ok ? 'ok' : i === pick ? 'no' : '') : i === pick ? 'sel' : '');
  return `<div class="q">${esc(q)}</div><div class="qo">${labels.map((l, i) =>
    `<button class="qb ${cls(i)}" data-act="pick" data-i="${i}"${mode === 'ask' ? '' : ' disabled'}>${swatches ? `<i class="sw sw-${swatches[i]}"></i>` : ''}${esc(l)}</button>`).join('')}</div>`;
}
const verdict = (good, text) => `<div class="verdict ${good ? 'ok' : 'no'}">${esc(good ? T[lang].right : T[lang].wrong)}</div><p class="vtext">${esc(text)}</p>`;
const btn = (act, label, dis = false) => `<div class="row2"><button class="btn" data-act="${act}"${dis ? ' disabled' : ''}>${esc(label)}</button></div>`;
const setCard = ([e, title, lead = '', body = '']) => lab.setState({ emo: e, title, lead, body, extra: `<div class="fine">${esc(T[lang].fine)}</div>` });

function renderDig(t) {
  const d = S.d, place = PLACES[d.r], q = t.d, open = secret.unlocked();
  lab.setGlow('rgba(217, 130, 95, .26)');
  let qa = '';
  if (d.all) qa = btn('again', t.again);
  else {
    qa = qBlock(q.q[place], q.o[place], d.pick, q.ok[place], d.ph === 'ask' ? 'ask' : d.ph === 'drill' ? 'lock' : 'done');
    if (d.ph === 'ask') qa += btn('dig', t.dig, d.pick === null);
    if (d.ph === 'done') qa += verdict(d.pick === q.ok[place], q.why[place]) + btn('next', d.r < 2 ? t.next : q.all);
  }
  $('qa').innerHTML = qa;
  const sc = (k, e) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('more').innerHTML = `<div class="row2"><div class="chips">${sc('deep', '🌍')}${sc('cycle', '🔁')}${S.sec === 'deep' ? `<button class="chip ${S.zoomOn ? 'on' : ''}" data-act="zoom">${esc(t.sec.zoom)}</button>` : ''}</div></div>`;
  if (S.sec === 'deep') setCard(['🌍', t.secrets.deep[0], t.sec.deepText]);
  else if (S.sec === 'cycle') setCard(['🔁', t.secrets.cycle[0], t.sec.cycleText]);
  else setCard(d.all || (d.r === 2 && d.ph === 'done') ? t.cards.dig1 : t.cards.dig0); // the later cards would hint at the next rounds
}
function renderMake(t) {
  const m = S.m, M = t.m, q = m.q + 1;
  lab.setGlow('rgba(232, 104, 58, .24)');
  let qa = '', more = '';
  if (m.free) {
    more = `<div class="chips">${SAMPLE_KEYS.map((k) => `<button class="chip ${m.pick === k ? 'on' : ''}" data-act="sample" data-k="${k}"><i class="sw sw-${k}"></i>${esc(nm(k))}</button>`).join('')}</div>${btn('again', t.again)}`;
  } else {
    qa = qBlock(M[`q${q}`], M[`o${q}`], m.a[m.q], 1, m.ph === 'ask' ? 'ask' : m.ph === 'play' ? 'lock' : 'done', m.q === 0 ? ['granite', 'limestone', 'marble'] : null);
    if (m.ph === 'done') qa += verdict(m.a[m.q] === 1, M[`r${q}`]) + btn('next', t.next);
  }
  $('qa').innerHTML = qa; $('more').innerHTML = more;
  setCard(m.free || m.q > 0 || m.ph === 'done' ? t.cards.mk1 : t.cards.mk0);
}
function renderSoil(t) {
  const o = S.o, O = t.o, q = o.q + 1, ok = [1, 0, 2][o.q];
  lab.setGlow('rgba(111, 179, 111, .24)');
  let qa = qBlock(O[`q${q}`], O[`o${q}`], o.a[o.q], ok, o.ph === 'ask' ? 'ask' : o.ph === 'play' ? 'lock' : 'done');
  if (o.ph === 'done') qa += verdict(o.a[o.q] === ok, O[`r${q}`]) + btn(o.q < 2 ? 'next' : 'again', o.q < 2 ? t.next : t.again);
  $('qa').innerHTML = qa; $('more').innerHTML = '';
  const done = (i) => o.q > i || (o.q === i && o.ph === 'done'), c1 = t.cards.so1; // reveal each line only after its question
  setCard(done(0) ? [c1[0], c1[1], done(1) ? c1[2] : '', done(2) ? c1[3] : ''] : t.cards.so0);
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v === 'dig' && S.sec ? 'sec' : v;
  if (v === 'dig') renderDig(t); else if (v === 'make') renderMake(t); else renderSoil(t);
  readout();
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i, v = lab.view, now = clock();
  if (act === 'pick') {
    if (v === 'dig') { if (S.d.ph !== 'ask') return; S.d.pick = i; sfx.tick(); }
    else if (v === 'make') {
      const m = S.m; if (m.ph !== 'ask') return;
      m.a[m.q] = i; m.ph = 'play'; sfx.click();
      if (m.q === 0) m.t0 = [now, now, now]; else m.tq = now;
      showStage();
    } else { const o = S.o; if (o.ph !== 'ask') return; o.a[o.q] = i; o.ph = 'play'; o.t0 = now; sfx.click(); showStage(); }
  } else if (act === 'dig') {
    const d = S.d; if (d.pick === null || d.ph !== 'ask') return;
    S.sec = null; d.ph = 'drill'; d.t0 = now; d.hit = false; sfx.push(); showStage();
  } else if (act === 'next') {
    if (v === 'dig') { if (S.d.r < 2) { S.d.r++; S.d.pick = null; S.d.ph = 'ask'; S.d.hit = false; } else S.d.all = true; }
    else if (v === 'make') { if (S.m.q === 0) { S.m.q = 1; S.m.ph = 'ask'; } else { S.m.free = true; S.m.pick = null; } }
    else { S.o.q++; S.o.ph = 'ask'; }
    sfx.click();
  } else if (act === 'again') {
    if (v === 'dig') S.d = newD(); else if (v === 'make') S.m = newM(); else S.o = newO();
    sfx.click();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null;
    else { S.sec = k; S.zoom = 0; S.zoomOn = false; S.node = -1; } // each secret sets up its own scene
    sfx.click();
  } else if (act === 'zoom') { S.zoomOn = !S.zoomOn; sfx.click(); }
  else if (act === 'sample') {
    S.m.pick = b.dataset.k; S.m.t0[KIND_OF[S.m.pick]] = now; sfx.click();
  }
  render();
});
render();
</script>
