// --- colour helpers ------------------------------------------------------------------------------------------
const hex2rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, t) => { const x = hex2rgb(a), y = hex2rgb(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * clamp(t, 0, 1)).toString(16).padStart(2, '0')).join(''); };

const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const back = (x) => { x = clamp(x, 0, 1); return 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2); }; // eased stretch with a little overshoot
const frac = (x) => x - Math.floor(x);
const rnd = (i) => frac(Math.sin(i * 12.9898 + 4.1) * 43758.5453);

// --- the picture: a grey forest by a river that the word cards paint -------------------------------------------
const W = 360, H = 300;
const TREES = [
  { x: 40, b: 214, r: 29, th: 30, v: 0 }, { x: 102, b: 224, r: 35, th: 40, v: 1 }, { x: 172, b: 216, r: 30, th: 34, v: 2 },
  { x: 238, b: 226, r: 35, th: 42, v: 0 }, { x: 298, b: 228, r: 29, th: 36, v: 1, oak: true },
];
const GOLD = [['#ffe07d', '#f4b13c', '#c97a20'], ['#ffd06c', '#ec9a2e', '#b9651b'], ['#ffc064', '#e5742f', '#a8481a']];
const GREY = ['#b6bcc8', '#8f96a4', '#6d7482'];
const riverY = (x, hth) => 270 + 6 * Math.sin(x / 55) - (hth - 15) * 0.15;
function crown(c, cx, cy, r, tones) {
  const parts = [[-0.55, 0.12, 0.72], [0.55, 0.16, 0.68], [0, -0.38, 0.88], [0, 0.3, 0.82]];
  for (const [dx, dy, k] of parts) { c.beginPath(); c.arc(cx + dx * r, cy + dy * r, Math.max(0, r * k + 1.8), 0, 6.283); c.fillStyle = tones[2]; c.fill(); }
  for (const [dx, dy, k] of parts) {
    const x = cx + dx * r, y = cy + dy * r, rr = Math.max(0.5, r * k), g = c.createRadialGradient(x - rr * 0.38, y - rr * 0.42, rr * 0.1, x, y, rr * 1.05);
    g.addColorStop(0, tones[0]); g.addColorStop(0.6, tones[1]); g.addColorStop(1, tones[2]);

}
function face(c, x, y, s, a, happy) { // a round friendly face: eyes with a white highlight, a smile and blush
  c.save(); c.globalAlpha = a;
  for (const d of [-1, 1]) {
    c.beginPath(); c.ellipse(x + d * s * 0.5, y - s * 0.12, Math.max(0.5, s * 0.17), Math.max(0.5, s * 0.22), 0, 0, 6.283); c.fillStyle = '#2b2433'; c.fill();
    c.beginPath(); c.arc(x + d * s * 0.5 - s * 0.06, y - s * 0.2, Math.max(0.5, s * 0.07), 0, 6.283); c.fillStyle = '#fff'; c.fill();
    c.beginPath(); c.arc(x + d * s * 0.85, y + s * 0.2, Math.max(0.5, s * 0.2), 0, 6.283); c.fillStyle = 'rgba(255,120,130,.45)'; c.fill();
  }

  c.restore();
}
function drawTree(c, tr, time, e) {
  const gold = e.E0, p = e.P1, g1 = tr.oak ? e.H0 : 0;
  const th = tr.th + 92 * g1, r = Math.max(4, tr.r + 21 * g1), tw = 9 * (1 + 0.7 * g1);

  const tg = c.createLinearGradient(-tw / 2, 0, tw / 2, 0);

  c.beginPath(); c.moveTo(-tw / 2, 3); c.quadraticCurveTo(-tw * 0.35, -th * 0.5, -tw * 0.3, -th); c.lineTo(tw * 0.3, -th); c.quadraticCurveTo(tw * 0.35, -th * 0.5, tw / 2, 3); c.closePath();
  c.fillStyle = tg; c.fill(); c.strokeStyle = mix('#444a57', '#4a2a12', gold); c.lineWidth = 1.4; c.stroke();
  const cy = -th - r * 0.35;

}
function windFace(c, time, a) {
  const x = 150 + Math.sin(time * 0.7) * 38, y = 60 + Math.sin(time * 1.3) * 5;
  c.save(); c.globalAlpha = a;
  for (const [dx, dy, r] of [[-17, 4, 13], [17, 4, 13], [0, -6, 17], [0, 8, 16]]) {
    const g = c.createRadialGradient(x + dx - r * 0.3, y + dy - r * 0.4, 1, x + dx, y + dy, r * 1.1);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#c9d2e6'); c.beginPath(); c.arc(x + dx, y + dy, r, 0, 6.283); c.fillStyle = g; c.fill();
  }
  for (const d of [-1, 1]) { c.beginPath(); c.arc(x + d * 8, y + 1, 4, 1.15 * Math.PI, 1.85 * Math.PI); c.strokeStyle = '#2b2433'; c.lineWidth = 2; c.lineCap = 'round'; c.stroke();
    c.beginPath(); c.arc(x + d * 14, y + 8, 3.2, 0, 6.283); c.fillStyle = 'rgba(255,120,130,.45)'; c.fill(); }
  c.beginPath(); c.ellipse(x + 3, y + 10, 3.6, 4.4, 0, 0, 6.283); c.fillStyle = '#2b2433'; c.fill();
  for (let i = 0; i < 3; i++) { const k = (time * 0.9 + i / 3) % 1, nx = x + 26 + k * 70, ny = y + 8 - k * 26 - i * 4; // music notes drift away on the wind
    c.save(); c.globalAlpha = a * (1 - k); c.fillStyle = '#7a5bd6'; c.strokeStyle = '#7a5bd6'; c.lineWidth = 1.8;
    c.beginPath(); c.ellipse(nx, ny, 4.2, 3.2, -0.4, 0, 6.283); c.fill();
    c.beginPath(); c.moveTo(nx + 3.6, ny - 1); c.lineTo(nx + 3.6, ny - 12); c.lineTo(nx + 8, ny - 9); c.stroke(); c.restore(); }
  c.restore();

function star4(c, x, y, s, col) { c.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? s * 0.28 : s; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } c.closePath(); c.fillStyle = col; c.fill(); }

function drawScene(c, time, e) {
  const warm = e.E0, sil = e.E1, ice = e.E2, wide = e.H1;
  // sky, sun and clouds
  let g = c.createLinearGradient(0, 0, 0, 215);
  g.addColorStop(0, mix('#8f96a6', '#f2ad63', warm * 0.9)); g.addColorStop(1, mix('#c9cdd6', '#fff0cc', warm));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const sunC = mix('#eceff5', '#ffd75e', warm);
  g = c.createRadialGradient(66, 62, 4, 66, 62, 66); g.addColorStop(0, rgba(sunC, 0.55)); g.addColorStop(1, rgba(sunC, 0)); c.fillStyle = g; c.fillRect(0, 0, 150, 140);
  g = c.createRadialGradient(60, 56, 2, 66, 62, 24); g.addColorStop(0, mix('#ffffff', '#fff6c8', warm)); g.addColorStop(1, sunC);
  c.beginPath(); c.arc(66, 62, 22, 0, 6.283); c.fillStyle = g; c.fill();
  for (const [cx, cy, k] of [[240 + Math.sin(time * 0.2) * 8, 52, 1], [310 + Math.sin(time * 0.17 + 1) * 6, 92, 0.7]]) {
    c.fillStyle = mix('#d9dce3', '#ffe3c4', warm); c.beginPath();
    for (const [dx, dy, r] of [[-20, 4, 12], [-4, -4, 16], [16, 2, 13], [4, 6, 12]]) { c.moveTo(cx + (dx + r) * k, cy + dy * k); c.arc(cx + dx * k, cy + dy * k, r * k, 0, 6.283); }
    c.fill();
  }
  // wind streaks behind the trees; the icy wind is stronger and blue
  const nst = 3 + Math.round(5 * ice);
  c.lineCap = 'round';
  for (let i = 0; i < nst; i++) {
    const x0 = ((time * (34 + i * 7) + i * 97) % 470) - 70, y0 = 78 + (i % 5) * 20 + Math.sin(time + i) * 3;
    c.strokeStyle = ice > 0.05 ? rgba(mix('#ffffff', '#bfe6ff', ice), 0.35 + 0.35 * ice) : 'rgba(255,255,255,.32)'; c.lineWidth = 2 + ice;
    c.beginPath(); c.moveTo(x0, y0); c.bezierCurveTo(x0 + 24, y0 - 8, x0 + 44, y0 + 8, x0 + 70, y0 - 2); c.stroke();
  }
  // hills and ground
  c.beginPath(); c.moveTo(0, 205); c.bezierCurveTo(60, 150, 120, 150, 190, 190); c.bezierCurveTo(240, 215, 290, 160, 360, 185); c.lineTo(360, 230); c.lineTo(0, 230); c.closePath();
  g = c.createLinearGradient(0, 150, 0, 225); g.addColorStop(0, mix('#a3aab7', '#e0ad66', warm)); g.addColorStop(1, mix('#8b92a0', '#c4914c', warm)); c.fillStyle = g; c.fill();
  c.beginPath(); c.moveTo(0, 222); c.bezierCurveTo(80, 196, 170, 214, 250, 200); c.bezierCurveTo(300, 192, 340, 200, 360, 204); c.lineTo(360, H); c.lineTo(0, H); c.closePath();
  g = c.createLinearGradient(0, 195, 0, H); g.addColorStop(0, mix('#8e95a3', '#bd9446', warm)); g.addColorStop(1, mix('#6f7684', '#8a6a2f', warm)); c.fillStyle = g; c.fill();
  // trees (soft shadows first, then the trees)
  for (const tr of TREES) { c.beginPath(); c.ellipse(tr.x + 8, tr.b + 3, tr.r * 0.9 * (tr.oak ? 1 + 0.5 * e.H0 : 1), 5, 0, 0, 6.283); c.fillStyle = 'rgba(30,34,46,.22)'; c.fill(); }
  TREES.slice().sort((a, b) => a.b - b.b).forEach((tr) => drawTree(c, tr, time, e));
  // river: a wavy band that widens into a sea
  const hth = lerp(15, 33, wide), pts = [];
  for (let x = -6; x <= W + 6; x += 12) pts.push([x, riverY(x, hth)]);

  for (let i = 0; i < 5; i++) { const x0 = ((time * 12 + i * 80) % 420) - 30, y0 = riverY(x0, hth) + (i % 3 - 1) * hth * 0.5; c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(x0 + 9, y0 - 3, x0 + 18, y0); c.stroke(); }
  if (sil > 0.02) for (let i = 0; i < 8; i++) { const x = 24 + i * 45 + Math.sin(time + i) * 6, tw = Math.max(0, Math.sin(time * 3 + i * 1.7) * 0.5 + 0.5); star4(c, x, riverY(x, hth) + Math.sin(i * 2.3) * hth * 0.4, 2 + 4 * tw * sil, rgba('#ffffff', 0.9 * sil)); }

    c.beginPath(); c.moveTo(0, -1); c.lineTo(0, -26); c.strokeStyle = '#6e4a24'; c.stroke();
    c.beginPath(); c.moveTo(2, -25); c.lineTo(2, -4); c.lineTo(15, -4); c.closePath(); c.fillStyle = '#f6f7fb'; c.fill(); c.strokeStyle = '#b8bfd0'; c.stroke();

  }

}

// --- fixed epithets pop up over the forest -------------------------------------------------------------------------
function drawPops(c, w, h, time, ox, oy, s) {
  c.save(); c.font = '800 15px Nunito, system-ui, sans-serif'; c.textBaseline = 'middle';
  S.pops = S.pops.filter((p) => time - p.t0 < 3.6);
  for (const p of S.pops) {
    const a = time - p.t0, k = clamp(a / 0.4, 0, 1), sc = 0.6 + 0.4 * back(k), fade = clamp((3.6 - a) / 0.8, 0, 1);
    const [pre, ep, post] = p.words, wd = [pre, ep, post].map((x) => c.measureText(x).width), tw = wd[0] + wd[1] + wd[2], pw = tw + 24, ph = 30;
    const cx = clamp(ox + p.x * s, pw / 2 + 6, w - pw / 2 - 6), cy = oy + (p.y - a * 10) * s;
    c.save(); c.globalAlpha = fade; c.translate(cx, cy); c.scale(sc, sc);
    c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 8; c.shadowOffsetY = 2;
    c.beginPath(); c.roundRect(-pw / 2, -ph / 2, pw, ph, 15); c.fillStyle = 'rgba(14,17,28,.86)'; c.fill();
    c.shadowColor = 'transparent'; c.strokeStyle = rgba(COL.E, 0.7); c.lineWidth = 1.5; c.stroke();
    let x = -tw / 2; c.textAlign = 'left';
    c.fillStyle = '#fff'; c.fillText(pre, x, 1); x += wd[0];
    c.fillStyle = COL.E; c.fillText(ep, x, 1); x += wd[1];
    c.fillStyle = '#fff'; c.fillText(post, x, 1);
    c.restore();
  }
  c.restore();
}

// --- targets of the cards in each view -----------------------------------------------------------------------------
function targets() {
  const t = Object.fromEntries(KEYS.map((k) => [k, 0])), v = lab.view;
  const set = (...ks) => ks.forEach((k) => { t[k] = 1; });
  const tool = (k) => { if (k === 'E') set('E0', 'E1', 'E2'); else if (k === 'P') set('P0', 'P1', 'P2'); else if (k === 'H') set('H0', 'H2'); };
  if (v === 'paint') KEYS.forEach((k) => { if (S.on[k]) t[k] = 1; });
  else if (v === 'which') { if (S.wi >= 8) set('E0', 'E1', 'P1', 'H0'); else if (S.wpick !== null) tool(T[lang].which[S.wi][1]); }
  else { const it = T[lang].poems[S.pi]; if (!it) set('E0', 'E1', 'P1', 'H0'); else if (S.pchecked) { tool(it[2]); (it[4] || []).forEach((g) => tool(g[1])); } }
  return t;
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view, tg = targets();
  for (const k of KEYS) A[k] += clamp(tg[k] - A[k], -dt / 0.9, dt / 0.9);
  const e = Object.fromEntries(KEYS.map((k) => [k, ease(A[k])])); e.H0 = back(A.H0);
  const top = v === 'paint' ? 0 : (cardEl.offsetHeight || 80) + 16;
  const rx = 8, ry = top + 6, rw = w - 16, rh = h - ry - 8, s = Math.max(0.2, Math.min(rw / W, rh / H));
  const ox = rx + (rw - W * s) / 2, oy = ry + (rh - H * s) / 2;
  c.save(); c.translate(ox, oy); c.scale(s, s);
  c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 16; c.shadowOffsetY = 5; c.beginPath(); c.roundRect(0, 0, W, H, 18); c.fillStyle = '#6d7482'; c.fill();
  c.shadowColor = 'transparent'; c.save(); c.beginPath(); c.roundRect(0, 0, W, H, 18); c.clip();
  drawScene(c, time, e);
  c.restore(); c.beginPath(); c.roundRect(0, 0, W, H, 18); c.strokeStyle = 'rgba(20,24,36,.7)'; c.lineWidth = 2; c.stroke();
  c.restore();
  if (v === 'paint') drawPops(c, w, h, time, ox, oy, s);
});

function resetPoems() { S.pi = 0; S.pword = null; S.ptool = null; S.pchecked = false; S.pright = []; }
const nOn = () => KEYS.filter((k) => S.on[k]).length;
$('ctrlBody').addEventListener('click', (ev) => {

  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (k === 'fixed') S.sec = S.sec === 'fixed' ? null : 'fixed';
    else if (S.sec === 'much') S.sec = null;
    else { KEYS.forEach((x) => { S.on[x] = true; }); S.sec = 'much'; S.last = null; }
    sfx.click();
  } else if (act === 'fix') {
    const w = T[lang].fixed[+b.dataset.i];
    S.pops.push({ words: w, x: 80 + ((S.popN * 83) % 200), y: 96 + (S.popN % 3) * 30, t0: performance.now() / 1000 }); S.popN++; sfx.good();
  } else if (act === 'wtool') {
    if (S.wpick !== null) return;
    S.wpick = k; const ok = k === T[lang].which[S.wi][1]; S.wright[S.wi] = ok; (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'wnext') {
    if (S.wi >= 8) { S.wi = 0; S.wright = []; S.wpick = null; } else if (S.wpick !== null) { S.wi++; S.wpick = null; } else return;
    sfx.click();
  } else if (act === 'ptool') { if (S.pchecked) return; S.ptool = k; sfx.tick(); }
  else if (act === 'pmain') {
    const n = T[lang].poems.length;
    if (S.pi >= n) { resetPoems(); sfx.click(); }
    else if (!S.pchecked) {
      if (S.pword === null || S.ptool === null) return;
      const it = T[lang].poems[S.pi], g = groupOf(it, S.pword), ok = g.idx.includes(S.pword) && S.ptool === g.tool;
      S.pright[S.pi] = ok; S.pchecked = true; (ok ? sfx.good : sfx.bad)(); showStage();
    } else { S.pi++; S.pword = null; S.ptool = null; S.pchecked = false; sfx.click(); }
  }
  render();
});
cardEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('.ep-tok'); if (!b || S.pchecked) return;
  S.pword = +b.dataset.i; sfx.tick(); render();
});

// --- render: controls, readout, state card and facts in every view ----------------------------------------------------
const segs = (str) => str.split(/\[\[|\]\]/).map((txt, i) => [txt, i % 2 === 1]);
const toolBtns = (act, picked, right, checked) => ORDER.map((k) => {
  const cls = ['ep-tool'];
  if (checked) { if (k === right) cls.push('ok'); else if (k === picked) cls.push('bad'); } else if (k === picked) cls.push('pick');
  return `<button type="button" class="${cls.join(' ')}" style="--tc:${COL[k]}" data-act="${act}" data-k="${k}"${checked ? ' disabled' : ''}>${EMO[k]} ${esc(T[lang].tools[k])}</button>`;
}).join('');

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secPaint').style.display = v === 'paint' ? '' : 'none';
  $('secWhich').style.display = v === 'which' ? '' : 'none';
  $('secPoems').style.display = v === 'poems' ? '' : 'none';
  cardEl.style.display = v === 'paint' ? 'none' : '';
  lab.setFacts(t.facts[v]);
  if (v === 'paint') renderPaint(t); else if (v === 'which') renderWhich(t); else renderPoems(t);
}

function renderPaint(t) {
  const n = nOn(), cnt = Object.fromEntries(ORDER.map((k) => [k, KEYS.filter((x) => x[0] === k && S.on[x]).length]));
  $('sent').innerHTML = t.sent(S.on).map(([txt, k]) => (k ? `<span class="ep-h" style="color:${COL[k]};border-color:${COL[k]}">${esc(txt)}</span>` : esc(txt))).join('');
  $('rows').innerHTML = ORDER.map((k) => `<div class="ep-row"><span class="ep-lbl" style="color:${COL[k]}">${EMO[k]} ${esc(t.tools[k])}</span><div class="chips">${
    t.chips[k].map((lbl, i) => `<button type="button" class="chip ep-chip ${S.on[k + i] ? 'on' : ''}" style="--tc:${COL[k]}" data-act="chip" data-k="${k + i}" aria-pressed="${!!S.on[k + i]}">${esc(lbl)}</button>`).join('')}</div></div>`).join('');
  const open = secret.unlocked();
  $('secRow').innerHTML = [['fixed', '🧵'], ['much', '🤪']].map(([k, emo]) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('fixRow').innerHTML = S.sec === 'fixed' && open ? t.fixed.map((w, i) => `<button type="button" class="chip ep-chip" style="--tc:${COL.E}" data-act="fix" data-i="${i}">${esc(w.join(''))}</button>`).join('') : '';
  $('fixRow').style.display = $('fixRow').innerHTML ? '' : 'none';
  lab.setGlow('rgba(240, 184, 74, .24)');
  lab.setReadout(n, t.of9, ORDER.map((k) => `${EMO[k]} ${cnt[k]}`).join(' · '), COL[S.last || 'E']);
  let st;
  if (S.sec === 'fixed') st = { emo: '🧵', title: t.fix[0], lead: t.fix[1] };
  else if (S.sec === 'much') st = n >= 7 ? { emo: '🤪', title: t.much[0], lead: t.much[1] } : n >= 4 ? { emo: '🤔', title: t.better[0], lead: t.better[1] } : { emo: '😌', title: t.good[0], lead: t.good[1] };
  else if (S.last && n > 0) st = { emo: EMO[S.last], title: t.tool[S.last][0], lead: t.tool[S.last][1] };
  else st = { emo: '🍂', title: t.start[0], lead: t.start[1] };
  lab.setState({ ...st, body: '', extra: '' });
}

function renderWhich(t) {
  const i = S.wi, end = i >= 8, k = S.wright.filter(Boolean).length;
  lab.setGlow('rgba(168, 140, 240, .24)');
  if (end) {
    cardEl.innerHTML = `<div class="ep-sent">${esc(t.wend(k))}</div>`;
    $('wTools').innerHTML = '';
    $('wNext').style.display = ''; $('wNext').textContent = t.again;
    lab.setReadout(`${k}/8`, t.sentence, '', COL.E);
    lab.setState({ emo: '🏆', title: t.wend(k), lead: t.wendLead, body: '', extra: '' });
    return;
  }
  const [str, right] = t.which[i], picked = S.wpick !== null;
  cardEl.innerHTML = `<div class="ep-sent">${segs(str).map(([txt, key]) => (key && picked
    ? `<span class="ep-h" style="color:${COL[right]};border-color:${COL[right]}">${esc(txt)}</span>` : esc(txt))).join('')}</div>`;
  $('wTools').innerHTML = toolBtns('wtool', S.wpick, right, picked);
  $('wNext').style.display = picked ? '' : 'none'; $('wNext').textContent = t.next;
  lab.setReadout(`${i + 1}/8`, t.sentence, picked ? `✓ ${k}` : '', picked ? COL[right] : COL.E);
  if (!picked) lab.setState({ emo: '🔍', title: t.wq, lead: t.wlead, body: '', extra: '' });
  else lab.setState({ emo: S.wpick === right ? '✅' : '🤔', title: S.wpick === right ? t.wright : t.wwrong(t.tools[right]), lead: t.tool[right][1], body: '', extra: '' });
}

function renderPoems(t) {
  const items = t.poems, n = items.length, i = S.pi, end = i >= n, k = S.pright.filter(Boolean).length, pm = t.pm;
  lab.setGlow('rgba(240, 100, 92, .22)');
  if (end) {
    cardEl.innerHTML = `<div class="ep-sent">${esc(pm.end(k, n))}</div>`;
    $('pTools').innerHTML = ''; $('pMain').textContent = t.again; $('pMain').disabled = false;
    lab.setReadout(`${k}/${n}`, '', '', COL.H);
    lab.setState({ emo: '🏆', title: pm.end(k, n), lead: pm.endLead, body: '', extra: '' });
    return;
  }
  const [text, tgt0, tool0, src, alts = []] = items[i], gs = [{ idx: tgt0, tool: tool0 }, ...alts.map(([idx, tool]) => ({ idx, tool }))], toks = text.split(' '), ch = S.pchecked;
  cardEl.innerHTML = `<div class="ep-toks">${toks.map((w, j) => `<button type="button" class="ep-tok ${ch && gs.some((g) => g.idx.includes(j)) ? 'lit' : ''} ${!ch && S.pword === j ? 'sel' : ''}" style="--tc:${COL[(gs.find((g) => g.idx.includes(j)) || gs[0]).tool]}" data-i="${j}"${ch ? ' disabled' : ''}>${esc(w)}</button>`).join('')}</div><div class="ep-src">${esc(src)}</div>`;
  $('pTools').innerHTML = toolBtns('ptool', S.ptool, groupOf(items[i], S.pword).tool, ch);
  $('pMain').textContent = ch ? t.next : pm.check; $('pMain').disabled = !ch && (S.pword === null || S.ptool === null);
  lab.setReadout(`${i + 1}/${n}`, '', ch ? `✓ ${k}` : '', ch ? COL[groupOf(items[i], S.pword).tool] : COL.H);
  if (!ch) lab.setState({ emo: '📜', title: pm.q, lead: pm.tap, body: '', extra: '' });
  else {
    const g = groupOf(items[i], S.pword), wOk = gs.some((x) => x.idx.includes(S.pword)), tOk = S.ptool === g.tool, words = g.idx.map((j) => toks[j]).join(' ').replace(/[!?,.]+$/, '');
    lab.setState({ emo: wOk && tOk ? '✅' : '🤔', title: wOk && tOk ? pm.right : wOk ? pm.wordsOnly : tOk ? pm.toolOnly : pm.none, lead: `“${words}”: ${t.tools[g.tool]}.`, body: '', extra: '' });
  }
}
render();
</script>
