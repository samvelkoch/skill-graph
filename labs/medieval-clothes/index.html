const lerpN = (a, b, t) => a + (b - a) * t;
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

}

  else if (act === 'clear') { S.worn[S.cls] = []; S.fly = null; S.bnc = null; sfx.click(); }
  else if (act === 'again') { S.on = [false, false, false, false, false, false]; sfx.click(); }
  else if (act === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); }
  else if (act === 'secgo') {
    if (S.sec === 'law') { S.law = (S.law + 1) % 3; sfx.click(); }
    else { S.btn = (S.btn + 1) % 9; S.btnT = now; (S.btn === 8 ? sfx.good : sfx.snap)(); }
  }
  render();
});

function render() {
  const t = T[lang], v = lab.view, sec = S.sec, show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  show('mcD', !sec && v === 'dress'); show('mcY', !sec && v === 'dye'); show('mcA', !sec && v === 'armour'); show('mcSec', !!sec);
  $('mcAskD').innerHTML = askHTML('D', t.askD, t.optsD, 1, S.ansD, t.rightD, t.wrongD);
  $('mcAskY').innerHTML = askHTML('Y', t.askY, t.optsY, 0, S.ansY, t.rightY, t.wrongY);
  $('mcAskA').innerHTML = askHTML('A', t.askA, t.optsA, 0, S.ansA, t.rightA, t.wrongA);
  show('mcDAct', S.askedD); show('mcAAct', S.askedA); $('mcYHint').style.display = S.askedY ? 'block' : 'none';
  $('mcDRow').innerHTML = ['peasant', 'noble'].map((k) => `<button type="button" class="chip mc-c${S.cls === k ? ' on' : ''}" data-act="cls" data-c="${k}">${k === 'noble' ? '👑' : '🧑‍🌾'} ${esc(t.cls[k])}</button>`).join('')
    + `<button type="button" class="chip mc-c" data-act="clear">${esc(t.clear)}</button>`;
  $('mcDHint').textContent = t.tapD; $('mcYHint').textContent = t.tapY; $('mcAHint').textContent = t.tapA;
  $('mcARow').innerHTML = `<button type="button" class="chip mc-c" data-act="again">↺ ${esc(t.aAgain)}</button>`;
  const open = secret.unlocked();
  $('mcSecs').innerHTML = [['law', '📜'], ['btn', '🔘']].map(([k, e]) => `<button type="button" class="chip mc-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const ask = (q) => { lab.setReadout('?', '', '', '#7a8bd1'); lab.setState({ emo: '🤔', title: q, lead: '', body: '', extra: '' }); lab.setFacts([]); };
  if (sec === 'law') {
    lab.setGlow('rgba(220,180,90,.26)'); $('mcSecGo').textContent = t.lawNext; lab.setReadout(`${S.law + 1} / 3`, '', '📜', '#e8b94a');
    lab.setState({ emo: '📜', title: t.lawTitle, lead: t.lawLead, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (sec === 'btn') {
    lab.setGlow('rgba(80,130,240,.28)'); $('mcSecGo').textContent = S.btn === 8 ? t.btnAgain : t.btnAct; lab.setReadout(`${S.btn} / 8`, t.btnSub, '🔘', '#e8b94a');
    lab.setState({ emo: '🔘', title: t.secrets.btn[0], lead: t.btnLead, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (v === 'dress') {
    lab.setGlow('rgba(150,110,220,.28)');
    if (!S.askedD) return ask(t.askD);
    const n = S.worn[S.cls].length, bnc = S.bnc === S.cls;
    lab.setReadout(`${n}/${S.cls === 'noble' ? 5 : 3}`, t.dOn, S.bounced ? t.bounced(S.bounced) : '', S.bounced ? '#ff8a5e' : '#3ddc97');
    const w = S.worn[S.cls], fine = S.cls === 'noble' && (w.includes('wool') || w.includes('linen'));
    const st = bnc ? [t.bnc[S.cls][0], t.bnc[S.cls][1], ''] : fine ? [t.dState.noble[0], t.nobleNote, t.dState.noble[2]] : t.dState[S.cls];
    lab.setState({ emo: bnc ? '🙅' : S.cls === 'noble' ? '👑' : '🧑‍🌾', title: st[0], lead: st[1], body: st[2], extra: '' }); lab.setFacts(t.facts.dress);
  } else if (v === 'dye') {
    lab.setGlow('rgba(60,170,150,.26)');
    if (!S.askedY) return ask(t.askY);
    const n = S.tried.filter(Boolean).length, i = S.lastDye < 0 ? 1 : S.lastDye, d = DYES[i];
    lab.setReadout(`${n} / 4`, t.tried, '', n === 4 ? '#3ddc97' : '#e8b94a');
    lab.setState({ emo: d.e, title: t.dInfo[i][0], lead: t.dInfo[i][1], body: t.dBody, extra: '' }); lab.setFacts(t.facts.dye);
  } else {
    lab.setGlow('rgba(120,140,200,.28)');
    if (!S.askedA) return ask(t.askA);
    const n = S.on.filter(Boolean).length, kg = S.on.reduce((s, o, i) => s + (o ? LAYERS[i].kg : 0), 0), st = n === 6 ? t.aState.full : n === 0 ? t.aState.none : t.aState.part;
    lab.setReadout(`${kg} ${t.kg}`, t.aSub, t.aPill(n), n === 6 ? '#ff8a5e' : '#3ddc97');
    lab.setState({ emo: n === 0 ? '🧍' : '🛡️', title: st[0], lead: st[1], body: st[2], extra: '' }); lab.setFacts(t.facts.armour);
  }
}

const BGS = { dress: ['#4a3a63', '#1c1730'], dye: ['#2e463f', '#131f1d'], armour: ['#38405a', '#161b2b'], sec: ['#5b4630', '#2a1d10'] };
canvasLoop(cv, (c, w, h, dt) => {
  const now = nowS(), v = lab.view, [c1, c2] = S.sec ? BGS.sec : BGS[v], f = fitBox(w, h);
  const floorY = S.sec ? undefined : v === 'dress' ? f.oy + (DOLL.y + 1) * f.sc : v === 'armour' ? f.oy + FLOOR * f.sc : undefined;
  backdrop(c, w, h, c1, c2, floorY);
  c.save(); c.translate(f.ox, f.oy); c.scale(f.sc, f.sc);
  if (S.sec) drawSecret(c, now);
  else if (v === 'dress') drawDress(c, now);
  else if (v === 'dye') drawDye(c, now);
  else drawArmour(c, now, dt);
  c.restore();
});
render();
</script>
</body>
</html>
