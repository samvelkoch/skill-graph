  round: '<path d="M16 34V14h16v20z" fill="#b9b3a3" stroke="#3a362e" stroke-width="1.5"/><path d="M13 14L24 2l11 12z" fill="#b8604a" stroke="#3a362e" stroke-width="1.5"/><rect x="22.5" y="20" width="3" height="8" fill="#2a241c"/>',
  taller: '<path d="M14 36V6h20v30z" fill="#b9b3a3" stroke="#3a362e" stroke-width="1.5"/><path d="M14 6V2h5v4zm7 0V2h6v4zm9 0V2h4v4z" fill="#b9b3a3" stroke="#3a362e" stroke-width="1.2"/><rect x="21" y="14" width="6" height="10" rx="3" fill="#2a241c"/>',
  window: '<path d="M10 36V10h28v26z" fill="#b9b3a3" stroke="#3a362e" stroke-width="1.5"/><rect x="15" y="14" width="18" height="18" rx="9" fill="#2a241c"/><path d="M24 14v18M15 23h18" stroke="#b9b3a3" stroke-width="1.5"/>',
  wall: '<rect x="14" y="4" width="22" height="30" fill="#b9b3a3" stroke="#3a362e" stroke-width="1.5"/><path d="M6 36L16 4M12 36L22 4" stroke="#8f5f37" stroke-width="2"/>',
  gate: '<rect x="4" y="12" width="40" height="24" fill="#b9b3a3" stroke="#3a362e" stroke-width="1.5"/><path d="M15 36V24q9-12 18 0v12z" fill="#2a241c"/>',
  rings: '<rect x="3" y="8" width="42" height="26" rx="4" fill="none" stroke="#b9b3a3" stroke-width="3"/><rect x="12" y="14" width="24" height="14" rx="3" fill="none" stroke="#e0b050" stroke-width="3"/>',
  tall: '<path d="M18 36V3h12v33z" fill="#b9b3a3" stroke="#3a362e" stroke-width="1.5"/>',
  sloped: '<path d="M3 34l11-14h20l11 14z" fill="#c8684c" stroke="#3a362e" stroke-width="1.5"/><path d="M12 20h24" stroke="#6d9a52" stroke-width="3"/>',
  slits: '<rect x="8" y="6" width="32" height="28" fill="#b9b3a3" stroke="#3a362e" stroke-width="1.5"/><path d="M16 12v14M24 12v14M32 12v14" stroke="#2a241c" stroke-width="3"/>',
};
const ICONS = [['logs', 'stone', 'fence'], ['round', 'taller', 'window'], ['wall', 'gate', 'rings'], ['tall', 'sloped', 'slits']];
const svg = (k) => `<svg viewBox="0 0 48 38" aria-hidden="true">${OPT_ICON[k]}</svg>`;

function render() {
  const v = lab.view;
  $('secTime').style.display = v === 'time' ? '' : 'none';
  $('secWeak').style.display = v === 'weak' ? '' : 'none';
  $('secEnd').style.display = v === 'end' ? '' : 'none';
  $('cv').style.touchAction = v === 'end' && S.es === 3 ? 'none' : 'pan-y';
  if (v === 'time') renderTime(); else if (v === 'weak') renderWeak(); else renderEnd();
}
function renderTime() {
  const t = T[lang], tl = t.tl, s = S.s, asking = S.s === S.max && S.max < 4 && S.sec === null, open = secret.unlocked();
  lab.setGlow('rgba(224, 176, 80, .24)');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`;
  put($('secChips'), sc('pig', '🐷') + sc('days', '⏱️'));
  $('tlBox').style.display = S.sec === null ? '' : 'none';
  $('tlBox').innerHTML = `<div class="ca-tl">${[0, 1, 2, 3, 4].map((i) => `<button class="ca-stop ${i === s ? 'on' : i <= S.max ? 'past' : ''}" data-act="stop" data-i="${i}" ${i > S.max ? 'disabled' : ''}
    aria-label="${i > S.max ? esc(tl.locked) : esc(tl.stages[i])}"><i>${i > S.max ? '?' : i + 1}</i><span>${i > S.max ? '' : YEARS[i]}</span></button>`).join('')}</div>`;
  const playing = S.ps[S.max] !== undefined, ready = playing && S.clock - S.ps[S.max] >= DUR[Math.min(S.max, 3)];
  put($('tlAsk'), asking && !playing ? `<div class="row2"><button class="btn" data-act="watch">${esc(tl.watch)}</button></div>` : asking && !ready ? `<div class="ca-fine">${esc(tl.watching)}</div>` : asking ? `<div class="ca-q">${esc(tl.q)}</div><div class="ca-opts">${tl.opts[S.max].map((o, i) => `<button class="ca-opt" data-act="opt" data-i="${i}" ${(S.wr[S.max] || []).includes(i) ? 'disabled' : ''}>${svg(ICONS[S.max][i])}<span>${esc(o[0])}</span></button>`).join('')}</div>` : '');
  const sb = $('secBody');
  if (S.sec === 'pig') {
    put(sb, `<div class="row2"><button class="btn" data-act="pig">${esc(t.pig.btn[S.pig])}</button></div>`);
    const cd = t.pig.cards[Math.min(S.pig, 3)];
    lab.setReadout('1215', t.pig.sub, '', '#d9825f'); lab.setGlow('rgba(217, 130, 95, .26)');
    lab.setState({ emo: ['🏰', '⛏️', '🔥', '🏗️'][Math.min(S.pig, 3)], title: cd[0], lead: cd[1], body: '', extra: '' });
    lab.setFacts([{ emo: '🐷', text: t.facts.roch[0], src: t.facts.roch[1] }]);
  } else if (S.sec === 'days') {
    const d = S.days, dd = t.dy;
    put(sb, `<div class="row2"><label class="lbl" for="dayRng" style="margin:0">${esc(dd.slider)}</label></div><input class="ca-rng" id="dayRng" type="range" min="0" max="8" step="1" aria-label="${esc(dd.slider)}">`);
    $('dayRng').value = d;
    lab.setReadout(String(d), dd.sub, '', '#e0b050'); lab.setGlow('rgba(224, 176, 80, .26)');
    lab.setState({ emo: '⏱️', title: dd.title(d), lead: dd.lead, body: dd.body, extra: '' });
    lab.setFacts([{ emo: '🪵', text: t.facts.dover[0], src: t.facts.dover[1] }]);
  } else {
    put(sb, '');
    lab.setReadout(`${tl.approx} ${YEARS[s]}`, tl.stages[s], tl.sub(s + 1), '#e0b050');
    const lead = S.msg ? `🤔 ${S.msg}` : s === 0 ? tl.intro0 : `${t.tl.right} ${tl.fix[s]}`;
    const body = s < 4 ? `${tl.prob[s][0]} ${tl.prob[s][1]}` : tl.final;
    lab.setState({ emo: EMO[s], title: `${tl.stages[s]} · ${tl.approx} ${YEARS[s]}`, lead, body, extra: '' });
    const F = t.facts, fx = (k, emo) => ({ emo, text: F[k][0], src: F[k][1] });
    lab.setFacts(s === 0 ? [fx('motte', '🪵')] : s === 1 ? [fx('ten', '⏳')] : s === 2 ? [fx('roch', '🐷')] : s === 3 ? [fx('conc', '🏯'), fx('beau', '🏴')] : [fx('yedi', '⭐'), fx('amst', '💰')]);
  }
}
function renderWeak() {
  const t = T[lang], wk = t.wk, R = WEAK[S.wi], done = S.wpick !== null, fin = done && S.wi === 3;
  lab.setGlow('rgba(255, 90, 72, .2)');
  const dots = [0, 1, 2, 3].map((i) => (S.wres[i] === true ? '✅' : S.wres[i] === false ? '❌' : i === S.wi ? '◉' : '○')).join(' ');
  put($('secWeak'), `<div class="ca-q">${esc(wk.q)}</div><div class="ca-dots">${dots}</div>${done ? `<div class="row2"><button class="btn" data-act="wnext">${esc(S.wi >= 3 ? wk.again : wk.next)}</button></div>` : ''}`);
  lab.setReadout(done ? `${S.wscore}/${S.wi + 1}` : '?', wk.ask(S.wi + 1), '', '#ff6a58');
  if (!done) lab.setState({ emo: '🔍', title: wk.q, lead: wk.ask(S.wi + 1), body: '', extra: '' });
  else {
    const ok = S.wpick === R.ok;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? wk.right : wk.miss, lead: wk.lead(wk.spots[S.wi][R.ok]), body: wk.why[S.wi] + (fin ? ` ${wk.end(S.wscore)} ${wk.endLead}` : ''), extra: '' });
  }
  const F = t.facts, fx = (k, emo) => ({ emo, text: F[k][0], src: F[k][1] });
  lab.setFacts(done && S.wi >= 1 ? [fx('roch', '🐷')] : [fx('ten', '⏳'), fx('yedi', '⭐')]);
}
function renderEnd() {
  const t = T[lang], e = t.en, F = t.facts, fx = (k, emo) => ({ emo, text: F[k][0], src: F[k][1] });
  lab.setGlow('rgba(224, 120, 80, .22)');
  const el = $('secEnd');
  if (S.es === 0) {
    put(el, `<div class="ca-q">${esc(e.q0)}</div><div class="ca-two">${e.pick.map((p, i) => `<button class="ca-opt" data-act="epick" data-i="${i}"><span>${esc(p)}</span></button>`).join('')}</div>`);
    lab.setReadout('?', e.shotsub, '', '#e07850'); lab.setState({ emo: '🧱', title: e.s0[0], lead: e.s0[1], body: '', extra: '' });
    lab.setFacts([fx('amst', '💰')]);
  } else if (S.es === 1) {
    const fell = S.shots >= 3, busy = S.clock - S.shotAt <= 1.15 && S.shots > 0, shown = S.shots - (S.clock - S.shotAt < .35 ? 1 : 0) >= 3;
    put(el, `<div class="row2" style="margin-top:0"><button class="btn" data-act="fire" ${busy ? 'disabled' : ''}>${busy ? e.wait : e.fire}</button>${S.shots >= 5 ? `<button class="btn ghost" data-act="enext">${esc(e.next)}</button>` : ''}</div><div class="ca-fine">${esc(e.modelNote)}</div>`);
    lab.setReadout(String(S.shots), e.shotsub, shown ? e.pillFell : '', '#e07850');
    if (!shown) lab.setState({ emo: '🔥', title: e.s0[0], lead: e.s1a(e.pick[S.eguess].toLowerCase()), body: '', extra: '' });
    else lab.setState({ emo: S.eguess === 0 ? '✅' : '🤔', title: S.eguess === 0 ? t.tl.right : e.s3no, lead: e.s1done(S.shots), body: `${e.s1why} ${S.shots < 5 ? '' : ''}`.trim(), extra: '' });
    lab.setFacts(shown ? [fx('yedi', '⭐')] : [fx('amst', '💰')]);
    void fell;
  } else if (S.es === 2) {
    put(el, `<div class="ca-q">${esc(e.q2)}</div><div class="ca-two">${e.forts.map((p, i) => `<button class="ca-opt" data-act="fpick" data-i="${i}"><span>${esc(p)}</span></button>`).join('')}</div>`);
    lab.setReadout('?', e.deadSub, '', '#e07850'); lab.setState({ emo: '🛰️', title: e.s2[0], lead: e.s2[1], body: '', extra: '' });
    lab.setFacts([fx('amst', '💰')]);
  } else {
    const st = fortStatus(), ok = S.fguess === 1;
    put(el, `<div class="row2" style="margin-top:0"><button class="btn ghost" data-act="eagain">${esc(T[lang].wk.again)}</button></div><div class="ca-fine">${esc(e.modelNote)}</div>`);
    const m = { seen: [e.seenT, e.seenL, '🎯'], hid: [e.hidT, e.hidL, '🙈'], far: [e.farT, e.farL, '↔️'], in: [e.inT, e.inL, '🏰'] }[st];
    lab.setReadout(st === 'seen' ? e.seen : st === 'hid' ? e.hidden : st === 'in' ? e.inside : e.far, e.deadSub, '', '#e07850');
    lab.setState({ emo: m[2], title: m[0], lead: m[1], body: `${ok ? e.s3ok : e.s3no} ${e.s3}`, extra: '' });
    lab.setFacts([fx('dead', '🛰️'), fx('amst', '💰')]);
  }
}
render();
</script>
