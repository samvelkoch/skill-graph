const TAU = Math.PI * 2;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const eio = (x) => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const outq = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const lin = (t, a, b) => clamp01((t - a) / (b - a));

const shade = (h, k) => (k < 0 ? mix(h, '#000000', -k) : mix(h, '#ffffff', k));
const rgba = (h, a) => { const p = rgbOf(h); return `rgba(${p[0]},${p[1]},${p[2]},${a})`; };
const lg = (c, x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };

const smooth = (c, p) => {

};

  c.strokeStyle = '#0A1122'; c.lineWidth = 2.4; for (let x = 120; x < E.x1 + 20; x += 34) { c.beginPath(); c.moveTo(x, 236); c.lineTo(x + 1, 218); c.stroke(); }
  c.lineWidth = 1.6; c.beginPath(); c.moveTo(118, 223); c.lineTo(E.x1 + 20, 221); c.moveTo(118, 230); c.lineTo(E.x1 + 20, 229); c.stroke();
  c.strokeStyle = '#08101E'; c.lineWidth = 1.6; c.lineCap = 'round';
  for (let i = 0; i < 70; i++) { const x = E.x0 + R(i) * W, y = 232 + R(i + 3) * (E.y1 - 226), h = 10 + R(i + 6) * 16, sw = Math.sin(time * 1.3 + i) * 2; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + sw * .5, y - h * .6, x + sw + (R(i + 8) - .5) * 6, y - h); c.stroke(); }
  // a pigeon flaps past, loudly
  const pu = lin(t, .3, 2.5);
  if (pu > 0 && pu < 1) {
    const px = mx(E.x0 - 50, E.x1 + 50, pu), py = 126 + Math.sin(t * 3) * 8;
    c.strokeStyle = 'rgba(240,245,255,.55)'; c.lineWidth = 1.6; c.lineCap = 'round';
    for (let k = 0; k < 5; k++) { const yy = py - 14 + k * 7, l = 16 + R(k) * 18; c.beginPath(); c.moveTo(px - 30 - l * 0, yy); c.lineTo(px - 30 - l, yy + (k - 2) * .6); c.stroke(); }
    pigeonDraw(c, px, py, time);
  }
  // the owl glides in, and nothing moves in the air around it
  const ox = mx(E.x0 - 80, 230, outq(lin(t, 2.5, 5.4))), oy = 112 + Math.sin(time * 1.2) * 4;
  if (t > 2.4) { c.save(); c.translate(ox, oy); c.scale(1.25, 1.25); c.shadowColor = 'rgba(244,235,201,.45)'; c.shadowBlur = 14; owlDraw(c, time); c.restore(); }
  if (t > 5.4) {
    const k = ramp(t, 5.4, 6.2), lr = 62 * k, lx = 172, ly = 136;
    if (lr > 3) {
      featherZoom(c, lx, ly, lr); lensRing(c, lx, ly, lr);
      if (k > .9) { pillV(c, e, T[lang].lens.comb, lx - lr * .6, ly + lr + 18, { color: '#FFD166' }); pillV(c, e, T[lang].lens.fringe, lx + lr * .75, ly + lr + 46, { color: '#BDE3FF' }); }
    }
  }
}

// --- secret 2: a jumping spider ---------------------------------------------------------------------------------------------
function jumperDraw(c, x, y, s, look, rot, spread) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.lineCap = 'round'; c.lineJoin = 'round';
  for (const sg of [-1, 1]) for (let k = 0; k < 4; k++) {
    const ox = sg * 9, oy = 2 + k * 3.2, kx = sg * (22 + spread * 6 + k * 1.5), ky = -7 + k * 6 - spread * 5, fx = sg * (30 + spread * 8), fy = 9 + k * 5 - spread * 6;
    c.strokeStyle = '#231B17'; c.lineWidth = 4.2; c.beginPath(); c.moveTo(ox, oy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
    c.strokeStyle = '#D9C7A0'; c.lineWidth = 1.3; c.beginPath(); c.moveTo(mx(ox, kx, .4), mx(oy, ky, .4)); c.lineTo(kx, ky); c.stroke();
  }
  ell(c, 0, 17, 14, 12); fillStroke(c, lg(c, 0, 5, 0, 29, [[0, '#5A463A'], [1, '#2E241E']]), '#150F0C', 1.2);
  c.strokeStyle = 'rgba(217,199,160,.8)'; c.lineWidth = 1.6; for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(-8 + i * .5, 12 + i * 6); c.lineTo(8 - i * .5, 12 + i * 6); c.stroke(); }
  ell(c, 0, 0, 17, 13.5); fillStroke(c, lg(c, 0, -13, 0, 13, [[0, '#4A3A31'], [1, '#2A211C']]), '#150F0C', 1.2);
  c.fillStyle = 'rgba(235,222,190,.85)'; for (let i = 0; i < 14; i++) { circ(c, -14 + i * 2.1, -11 + Math.abs(i - 6.5) * .5 + (i % 2), .9); c.fill(); }
  for (const sg of [-1, 1]) {
    circ(c, sg * 12.5, -5, 2.5); c.fillStyle = '#0E0B09'; c.fill(); circ(c, sg * 12, -5.6, .7); c.fillStyle = '#fff'; c.fill();
    circ(c, sg * 6.8, -1, 6.4); fillStroke(c, '#0E0B09', '#000', 1); circ(c, sg * 6.8 + look * 1.6, -1, 4.3); c.fillStyle = '#5A3B1E'; c.fill();
    circ(c, sg * 6.8 + look * 2.2, -1, 2.6); c.fillStyle = '#050403'; c.fill();
    circ(c, sg * 6.8 + look * 1.6 - 1.8, -3.2, 1.9); c.fillStyle = '#fff'; c.fill(); circ(c, sg * 6.8 + look * 1.6 + 1.5, .8, .8); c.fillStyle = 'rgba(255,255,255,.8)'; c.fill();
  }
  ell(c, 0, 10, 7, 3.2); fillStroke(c, '#3A2D26', '#150F0C', 1);
  for (const sg of [-1, 1]) { ell(c, sg * 8, 11, 3.4, 2.6); fillStroke(c, '#C9B58A', '#150F0C', .8); }
  c.restore();
}
function jumperScene(c, e) {
  const { t, time, E } = e, W = E.x1 - E.x0;
  fillAll(c, E, lg(c, 0, E.y0, 0, E.y1, [[0, '#CFE8A8'], [.5, '#8FC273'], [1, '#4B8445']]));
  for (let i = 0; i < 14; i++) { const x = E.x0 + R(i) * W, y = E.y0 + R(i + 9) * (E.y1 - E.y0), r = 20 + R(i + 4) * 44; c.fillStyle = rg(c, x, y, 0, r, [[0, rgba(['#F4F6C8', '#A8D48A', '#6FAF5A'][i % 3], .5)], [1, 'rgba(255,255,255,0)']]); circ(c, x, y, r); c.fill(); }
  bokeh(c, E, time, ['#FFF6C8', '#DDF0A8'], 8);
  // a big leaf to sit on
  c.save(); c.translate(196, 214); c.rotate(-.06);
  c.beginPath(); c.moveTo(-200, 4); c.bezierCurveTo(-120, -80, 110, -78, 205, -2); c.bezierCurveTo(110, 76, -120, 80, -200, 4); c.closePath(); fillStroke(c, lg(c, 0, -66, 0, 66, [[0, '#86C66A'], [.5, '#55A04F'], [1, '#2F7440']]), '#245C30', 1.6);
  c.fillStyle = 'rgba(30,70,30,.18)'; for (let i = 0; i < 40; i++) { circ(c, -150 + R(i + 400) * 300, -40 + R(i + 401) * 80, .8 + R(i + 402)); c.fill(); }
  c.strokeStyle = 'rgba(214,240,170,.75)'; c.lineWidth = 3; c.beginPath(); c.moveTo(-186, 2); c.quadraticCurveTo(0, -8, 186, 2); c.stroke();
  c.strokeStyle = 'rgba(214,240,170,.38)'; c.lineWidth = 1.4;
  for (let i = -6; i <= 6; i++) { c.beginPath(); c.moveTo(i * 26, -2); c.quadraticCurveTo(i * 26 + 16, -26, i * 26 + 34, -50 + Math.abs(i) * 2); c.moveTo(i * 26, -2); c.quadraticCurveTo(i * 26 + 16, 24, i * 26 + 30, 46 - Math.abs(i) * 2); c.stroke(); }
  c.restore();
  // the fly hovers; the spider's big eyes follow it
  const hover = [262 + Math.sin(time * 1.3) * 30, 118 + Math.sin(time * 2.1) * 12 + Math.cos(time * .9) * 8];
  const A = [118, 190], u = ramp(t, 3, 4.3);
  const kf = ramp(t, 3, 3.4), fly = [mx(hover[0], 276, kf), mx(hover[1], 118, kf)];
  const look = clamp((fly[0] - A[0]) / 120, -1, 1);
  let sp, rot = 0, sc = 1, spread = 0;
  if (t < 3) { sp = A; sc = 1 - .1 * ramp(t, 2.5, 3); rot = look * .06; }
  else { sp = [mx(A[0], fly[0] - 24, u), mx(A[1] + 0, fly[1] + 12, u) - 70 * Math.sin(Math.PI * u)]; spread = Math.sin(Math.PI * u); rot = mx(.06, .5, u) * (look >= 0 ? 1 : -1); sc = mx(.9, .75, u); }
  // the silk safety line, pinned where the pounce began
  if (t > 3) { c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(A[0], A[1] + 8); c.quadraticCurveTo((A[0] + sp[0]) / 2, Math.max(A[1], sp[1]) + 22 * u, sp[0], sp[1] + 14 * sc); c.stroke(); }
  flyDraw(c, fly[0], fly[1], time, Math.PI * .9 + Math.sin(time * 6) * .1, 1.7);
  jumperDraw(c, sp[0], sp[1], sc * 1.5, look, rot, spread);
}

const SC = { croc: river, cheetah: plain, wolves: wolvesScene, spider: webScene, lions, antlion, falcon: falconScene, cham: chameleonScene, howl, owl: owlScene, jumper: jumperScene };

// =====================================================================================================================
// STATE, CONTROLS, RENDER
// =====================================================================================================================
const nowS = () => performance.now() / 1000;
const V = Object.fromEntries(Object.keys(ROUNDS).map((v) => [v, { i: 0, pick: null, t: 0, playing: false, said: false, free: false, fsc: 0, fplay: false, born: nowS() }]));
const S = { sec: null }; // a secret scene: { id, t, playing, born }
const lab = shell({ key: 'predators', T, topics: TOPICS, views: ['hunt', 'tools', 'more'], onLang: render, onView: (v) => { if (V[v].pick === null) V[v].born = nowS(); render(); } });
const secret = secretLab('predators', () => ({
  secrets: [{ emo: '🦉', title: T[lang].secrets.owl[0], desc: T[lang].secrets.owl[1] }, { emo: '🕷️', title: T[lang].secrets.jumper[0], desc: T[lang].secrets.jumper[1] }],
  questions: T[lang].quiz,
}), () => render());

const nameOf = (v, i, r) => (v === 'more' ? T[lang].m.who[i] : T[lang].names[r.nm]);
function cur() {
  const v = lab.view, P = V[v];
  if (v === 'hunt' && S.sec) return { id: S.sec.id, body: false, P: S.sec, secret: true, round: null, name: T[lang].names[S.sec.id] };
  if (v === 'hunt' && P.free) { const r = ROUNDS.hunt[P.fsc]; return { id: r.sc, body: false, P, round: r, free: true, name: T[lang].names[r.nm] }; }
  const r = ROUNDS[v][P.i];
  return { id: r.sc, body: !!r.body, P, round: r, name: nameOf(v, P.i, r) };
}

// --- the magnifier (view 2): slides over the part, shows it bigger, shrinks away when the reveal starts -----------------
// [x, y, zoom, radius] of the lens when it rests on the part
const LENSPOS = { croc: [203, 172, 1.9, 52], spider: [200, 150, 2, 48], cheetah: [54, 207, 1.8, 50], wolves: () => [...muzzleAt(SPECIES.wolf, -.25, HOWL[0].s, 1, HOWL[0].p0[0], HOWL[0].p0[1]), 2, 48] };
function drawLens(c, env, k, time) {
  const P = k.P; let pos = LENSPOS[k.round.lens]; if (typeof pos === 'function') pos = pos();
  const Z = pos[2] ?? 2.4, RR = pos[3] ?? 46;
  const slide = outq((time - P.born - .2) / .9), vis = 1 - lin(P.t, 0, .45);
  if (vis < .03) return;
  const r = RR * outq(vis), lx = pos[0] + (1 - slide) * 130, ly = pos[1] - (1 - slide) * 80;
  c.save(); circ(c, lx, ly, r); c.clip(); c.fillStyle = '#14181F'; c.fillRect(lx - r, ly - r, 2 * r, 2 * r);
  c.translate(lx, ly); c.scale(Z, Z); c.translate(-lx, -ly);
  SC[k.id](c, { ...env, t: 0, lens: true });
  c.restore();
  lensRing(c, lx, ly, r);
  if (slide > .85 && vis > .9) pillV(c, env, T[lang].lens[k.round.lens], lx, ly + r + 18);
}

// --- the loop ---------------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const k = cur(), P = k.P;
  if (P.playing) {
    const d = durOf(k.id, k.body);
    P.t = Math.min(d, P.t + dt); if (P.t >= d) P.playing = false;
    if (!k.secret && !k.free && P.pick !== null && !P.said && P.t >= d * .6) { P.said = true; render(); }
  }
  const s = Math.min(w / 400, h / 300), ox = (w - 400 * s) / 2, oy = (h - 300 * s) / 2, base = c.getTransform();
  const E = { x0: -ox / s, y0: -oy / s, x1: (w - ox) / s, y1: (h - oy) / s };
  const env = { t: P.t, time, E, body: k.body, sc: { base, s, ox, oy, w } };
  c.save(); c.translate(ox, oy); c.scale(s, s);
  try { SC[k.id](c, env); if (k.body && k.round?.lens) drawLens(c, env, k, time); } catch (err) { console.error(err); }
  c.restore(); c.setTransform(base);
  c.fillStyle = rg(c, w / 2, h * .45, Math.min(w, h) * .45, Math.hypot(w, h) * .62, [[0, 'rgba(10,12,24,0)'], [1, 'rgba(10,12,24,.32)']]); c.fillRect(0, 0, w, h);
  pill(c, k.name, 12, 18, { left: true, w });
});

// --- controls -------------------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const resetRound = (P) => { P.pick = null; P.said = false; P.t = 0; P.playing = false; P.born = nowS(); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view, P = V[v];
  if (act === 'pick') {
    if (P.pick !== null) return;
    const r = ROUNDS[v][P.i];
    P.pick = +b.dataset.j; P.t = 0; P.playing = true; (P.pick === r.ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'replay') { P.t = 0; P.playing = true; sfx.click(); showStage(); }
  else if (act === 'next') {
    if (P.i < 3) P.i++;
    else if (v === 'hunt') { P.free = true; P.fsc = 0; P.fplay = false; }
    else P.i = 0;
    resetRound(P); sfx.click();
  } else if (act === 'restart') { P.i = 0; P.free = false; P.fplay = false; S.sec = null; resetRound(P); sfx.click(); }
  else if (act === 'sc') { S.sec = null; P.fsc = +b.dataset.k; P.t = 0; P.playing = true; P.fplay = true; sfx.click(); showStage(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = { id: k, t: 0, playing: true, born: nowS() }; sfx.click(); if (k === 'owl') setTimeout(() => sfx.push(), 450); showStage();
  }
  render();
});

// --- render: controls, readout and state card -----------------------------------------------------------------------------
const dots = (i) => [0, 1, 2, 3].map((j) => (j < i ? '●' : j === i ? '◉' : '○')).join(' ');
const HUNTER_EMO = { cheetah: '🐆', spider: '🕸️', croc: '🐊', wolves: '🐺' };
function quizHtml(v) {
  const t = T[lang], P = V[v], i = P.i, r = ROUNDS[v][i];
  const q = v === 'tools' ? t.b.q[i] : t.h.q, opts = v === 'tools' ? t.b.o[i] : t.h.o, picked = P.pick !== null;
  let html = `<div class="pr-q">${esc(q)}</div><div class="pr-opts ${opts.length === 3 ? 'pr-one' : ''}">`;
  html += opts.map((o, j) => {
    let cls = 'pr-o'; if (picked) cls += j === r.ok ? ' pr-good' : j === P.pick ? ' pr-bad' : ' pr-dim';
    return `<button class="${cls}" data-act="pick" data-j="${j}"${picked ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('') + '</div>';
  if (P.said) {
    const ok = P.pick === r.ok, why = v === 'tools' ? t.b.why[i] : v === 'hunt' ? t.h.why[i] : t.m.why[i];
    html += `<div class="pr-fb"><div class="pr-vd" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.wrong)}</div><p>${esc(why)}</p></div>`;
    html += `<div class="pr-row"><button class="chip" data-act="replay">${esc(t.h.replay)}</button><button class="btn pr-push" data-act="next">${esc(i === 3 && v !== 'hunt' ? t.again : t.next)}</button></div>`;
  }
  return html;
}
function freeHtml() {
  const t = T[lang], P = V.hunt, open = secret.unlocked();
  const scenes = ROUNDS.hunt.map((r, k) => `<button class="chip ${P.fplay && !S.sec && P.fsc === k ? 'on' : ''}" data-act="sc" data-k="${k}">${HUNTER_EMO[r.nm]} ${esc(t.names[r.nm])}</button>`).join('');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec?.id === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="pr-chips">${scenes}</div><div class="pr-row"><div class="chips">${sc('owl', '🦉')}${sc('jumper', '🕷️')}</div><button class="chip pr-push" data-act="restart">${esc(t.again)}</button></div>`;
}
function renderCtrl() {
  const v = lab.view, P = V[v];
  $('ctrlBody').innerHTML = v === 'hunt' && (S.sec || P.free) ? freeHtml() : quizHtml(v);
}
function renderReadout() {
  const k = cur(), t = T[lang], v = lab.view, P = V[v], ac = ACCENT[k.id] ?? ACCENT.croc;
  lab.setGlow(ac[1]);
  let sub = '';
  if (k.secret) sub = '';
  else if (k.free) sub = V.hunt.fplay ? t.h.o[k.round.ok] : '';
  else if (v === 'tools') sub = dots(P.i);
  else sub = P.said ? t.h.o[k.round.ok] : dots(P.i);
  lab.setReadout(esc(k.name), sub, '', ac[0]);
}
function renderState() {
  const t = T[lang], v = lab.view, P = V[v];
  if (v === 'hunt' && S.sec) {
    const id = S.sec.id; lab.setState({ emo: id === 'owl' ? '🦉' : '🕷️', title: t.secrets[id][0], lead: t.secrets[id][1], body: t.sec[id + 'Text'], extra: '' }); return;
  }
  const done = v === 'hunt' ? P.free : (P.i === 3 && P.said);
  const [emo, title, lead, body] = t.st[v][done ? 1 : 0];
  lab.setState({ emo, title, lead, body, extra: '' });
}
function render() { renderCtrl(); renderReadout(); renderState(); }
render();
</script>
