// --- sound: own little synth; the context is made on the first tap ----------------------------------------------
let AC = null, master = null;
function actx() {

    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); master = AC.createGain(); master.gain.value = 0.9;
      master.connect(comp); comp.connect(AC.destination);

    return AC;
  } catch { return null; }
}
const soundOn = () => store.get('sound', false);
['pointerdown', 'pointerup', 'touchend', 'keydown', 'click'].forEach((e) => addEventListener(e, () => { if (soundOn()) { unmuteIOS(); actx(); } }, { passive: true }));
// a tap on a sound button turns the shell's sound on; a first touch on the picture does too, unless the visitor switched it off before
function forceSound() { if (!soundOn()) $('sound').click(); unmuteIOS(); actx(); }

const PARTS = [[1, 1], [2, 0.22], [3, 0.07]]; // a soft "ooh": the note, a quiet octave and a very quiet twelfth
const V = {}; // voices held while they sound, by name
function hold(name, f, vol = 0.15) {
  if (!soundOn()) return;
  const x = actx(); if (!x) return; const t = x.currentTime;
  let v = V[name];
  if (!v) {
    const g = x.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.setTargetAtTime(vol, t, 0.02); g.connect(master);
    const os = PARTS.map(([m, a]) => { const o = x.createOscillator(), og = x.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f * m, t); og.gain.value = a; o.connect(og).connect(g); o.start(t); return [o, m]; });
    V[name] = { g, os };
  } else {
    v.os.forEach(([o, m]) => o.frequency.setTargetAtTime(f * m, t, 0.015));
    v.g.gain.setTargetAtTime(vol, t, 0.03);
  }
}
function release(name) {
  const v = V[name]; if (!v) return; delete V[name];
  try { const t = AC.currentTime; v.g.gain.cancelScheduledValues(t); v.g.gain.setTargetAtTime(0.0001, t, 0.04); v.os.forEach(([o]) => o.stop(t + 0.3)); } catch { /* already gone */ }
}
function blip(f, dur = 0.6, vol = 0.2) { // one struck note: soft attack, long fade
  if (!soundOn()) return;
