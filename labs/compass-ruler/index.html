      pill = kind === 'out' ? q.pillOut : kind === 'in' ? q.pillIn : q.pillOn;
      ro = [`${R} ${cm}`, q.ro1, pill];
      if (!K.touched && K.g !== null) { const good = K.g === q.ok; st = { emo: good ? '✅' : '🤔', title: good ? q.yes : q.no, lead: q.outLead(R, NAMES[idx], mx), body: q.outBody }; }
      else if (kind === 'out') { const e = q.outS(R, NAMES[idx], mx); st = { emo: '🧭', title: e[0], lead: e[1], body: q.drag }; }
      else if (kind === 'in') { const e = q.inS(R, mx); st = { emo: '🧭', title: e[0], lead: e[1], body: q.drag }; }
      else { const e = q.sideS(R); st = { emo: '🧭', title: e[0], lead: e[1], body: q.drag }; }
      void live;
    }
  }
  lab.setReadout(ro[0], ro[1], ro[2], '#5fa864');
  lab.setState({ ...st, body: st.body ?? '', extra: '' });
  lab.setFacts(t.f3);
}

// --- the loop: one picture per view, and a render when an animation reaches the point where the text changes -----
canvasLoop(cv, (c, w, h, dt) => {
  const v = lab.view;
  if (v === 'halve') drawH(c, w, h, dt); else if (v === 'angle') drawN(c, w, h, dt); else drawK(c, w, h, dt);
  const key = [H.t >= 2, H.lt >= 1, N.t >= 1, N.u >= 2, N.u >= 3, K.T >= 3, K.T >= 7, K.Tmax].join('|');
  if (key !== syncKey) { syncKey = key; render(); }
});
render();
</script>
