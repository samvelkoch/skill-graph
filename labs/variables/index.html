// a tiny evaluator: "name = a", "name = a + b", "name = a * 2" (left to right is enough for these programs)
class NameErr { constructor(name) { this.name = name; } }
const assignOf = (src) => { const m = /^\s*([A-Za-z_]\w*)\s*=\s*(.+)$/.exec(src); return m && { tgt: m[1], expr: m[2] }; };
function evalExpr(expr, vars) {
  const toks = expr.match(/[A-Za-z_]\w*|\d+(?:\.\d+)?|[-+*]/g);
  const val = (t) => { if (/^\d/.test(t)) return +t; if (!(t in vars)) throw new NameErr(t); return vars[t]; };
  let acc = val(toks[0]);
  for (let i = 1; i < toks.length; i += 2) { const b = val(toks[i + 1]); acc = toks[i] === '+' ? acc + b : toks[i] === '*' ? acc * b : acc - b; }
  return acc;
}
// run the first `upto` lines; thrown = how many old values were overwritten (they go to the bin)
function runProg(lines, init, upto) {
  const vars = { ...init }; let thrown = 0;
  for (let i = 0; i < upto && i < lines.length; i++) {
    const a = assignOf(lines[i]); let v;
    try { v = evalExpr(a.expr, vars); } catch (e) { if (e instanceof NameErr) return { vars, thrown, err: { i, name: e.name } }; throw e; }
    if (a.tgt in vars) thrown++;
    vars[a.tgt] = v;
  }
  return { vars, thrown };
}
const loopVars = (n) => { // n = presses so far: 0 nothing, 1 total = 0, then one round per press
  const o = {}; if (n >= 1) o.total = n === 1 ? 0 : ((n - 1) * n) / 2; if (n >= 2) o.i = n - 1;
  return { vars: o, thrown: n >= 2 ? (n - 1) + (n - 2) : 0 };
};

  return out;
}

function mode() {
  const v = lab.view;
  if (S.sec === 'loop') {
    const n = S.lp.n, lv = loopVars(n);
    return { kind: 'code', lines: LOOP, pc: n === 0 ? 0 : n < 6 ? 1 : -1, ...lv, label: 'main.py' };
  }
  if (S.sec === 'arrow') {
    const a = ARROW[S.ar.k ?? 0];
    return { kind: 'code', lines: [a[0]], pc: 0, vars: S.ar.played ? { x: 5 } : {}, thrown: 0, label: a[1] };
  }
  if (v === 'step') {
    const s = S.st, P = PROG[s.prog], r = runProg(P.lines, {}, s.pc);
    return { kind: 'code', lines: P.lines, pc: s.pc < P.lines.length ? s.pc : -1, ...r, label: 'main.py' };
  }
  if (v === 'swap') {
    const s = S.sw;
    if (s.phase === 'q') {
      const r = s.qDone ? runProg(Q_LINES, SW_INIT, 2) : { vars: { ...SW_INIT }, thrown: 0 };
      return { kind: 'code', lines: Q_LINES, pc: -1, ...r, label: 'main.py' };
    }
    const r = s.res ? runProg(s.lines, SW_INIT, s.lines.length) : { vars: { ...SW_INIT }, thrown: 0 };
    return { kind: 'code', lines: s.lines, pc: -1, ...r, err: r.err ? r.err.i : -1, rm: true, minLines: 4, label: 'main.py' };
  }
  return { kind: 'types' };
}

// --- animation ----------------------------------------------------------------------------------------------
const tf = (p, s, r) => `translate(${p.x}px,${p.y}px) scale(${s}) rotate(${r}deg)`;
function flight(el, a, b, { ms = 500, arc = -36, s0 = 1, s1 = 1, r0 = 0, r1 = 0, o1 = 1, ease = 'cubic-bezier(.25,.85,.3,1)' } = {}) {
  const mid = { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) + arc };
  return el.animate([
    { transform: tf(a, s0, r0), opacity: 1, offset: 0 },
    { transform: tf(mid, (s0 + s1) / 2, (r0 + r1) / 2), opacity: 1, offset: .5 },
    { transform: tf(b, s1, r1), opacity: o1, offset: 1 },
  ], { duration: ms, easing: ease, fill: 'forwards' }).finished;
}
function ghost(v, at) {
  fly.insertAdjacentHTML('beforeend', cardHTML(v, 'g'));
  const g = fly.lastElementChild; g.style.transform = tf(at, 1, 0); return g;
}
const squash = (el) => el.animate([{ transform: 'rotate(-1.5deg) scale(1.14,.82)' }, { transform: 'rotate(-1.5deg) scale(.95,1.07)', offset: .6 }, { transform: 'rotate(-1.5deg) scale(1)' }], { duration: 320, easing: 'ease-out' });
const moveArrow = (i) => {
  vb.querySelectorAll('.vb-arrow, .vb-hl').forEach((e) => { e.style.transform = `translateY(${i * LH}px)`; e.style.opacity = 1; });
};

// run one line: read the variables (ghost cards fly to the code), the result card flies to the box, the old card goes in the bin
// spec: { tgt, value, spans (default: the variable names after the first one on the line), anchor (selector of the element the result starts from) }
async function animLine(id, idx, before, spec) {
  const alive = () => id === RUN, line = lineEl(idx);
  if (!line) return;
  moveArrow(idx); await sleep(280); if (!alive()) return;
  const spans = spec.spans ?? [...line.querySelectorAll('[data-v]')].slice(1);
  for (const sp of spans) {
    const nm = sp.dataset.v, box = boxEl(nm);
    if (!box || !(nm in before)) continue;
    const a = rel(box.querySelector('.vb-card')), b = rel(sp);
    const g = ghost(before[nm], a);
    await flight(g, a, { x: b.x + b.w / 2 - 32, y: b.y + b.h / 2 - 27 }, { ms: 460, arc: -30, s1: .55 });
    if (!alive()) return;
    g.remove(); sp.textContent = fmt(before[nm]); sp.classList.add('got'); sfx.tick();
    await sleep(130); if (!alive()) return;
  }
  const anc = (spec.anchor ? line.querySelector(spec.anchor) : null) ?? line.querySelector('.vb-src').lastElementChild, ar = rel(anc);
  const start = { x: ar.x + ar.w / 2 - 32, y: ar.y + ar.h / 2 - 27 };
  let box = boxEl(spec.tgt);
  if (!box) { // a new variable: a new box appears on the shelf
    $('vbShelf').querySelector('.vb-boxes').insertAdjacentHTML('beforeend', boxHTML(spec.tgt));
    box = boxEl(spec.tgt);
  }
  const card = box.querySelector('.vb-card'), slot = rel(card), bin = rel($('vbBin'));
  if (!before || !(spec.tgt in before)) box.animate([{ transform: 'translateY(-16px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }], { duration: 320, easing: 'cubic-bezier(.2,1.4,.4,1)' });
  const res = ghost(spec.value, start);
  await res.animate([{ transform: tf(start, 0.2, 0), opacity: 0 }, { transform: tf(start, 1.1, -4), opacity: 1, offset: .65 }, { transform: tf(start, 1, 0), opacity: 1 }], { duration: 260, easing: 'ease-out', fill: 'forwards' }).finished;
  if (!alive()) return;
  sfx.click();
  let outP = null;
  if (!card.classList.contains('empty')) { // the old value is thrown away
    const old = ghost(before[spec.tgt], slot); card.style.visibility = 'hidden';
    const to = { x: bin.x + bin.w / 2 - 32, y: bin.y - 6 };
    outP = flight(old, slot, to, { ms: 560, arc: -46, s1: .45, r1: 38, o1: .9, ease: 'cubic-bezier(.4,.1,.6,1)' }).then(() => { old.remove(); sfx.push(); });
    await sleep(140); if (!alive()) return;
  }
  await flight(res, start, slot, { ms: 520, arc: -30, ease: 'cubic-bezier(.3,.9,.4,1.18)' });
  if (!alive()) return;
  card.outerHTML = cardHTML(spec.value); res.remove();
  const nc = box.querySelector('.vb-card'); squash(nc);
  let tag = box.querySelector('.vb-bty');
  if (!tag) { box.querySelector('.vb-front').insertAdjacentHTML('beforeend', '<span class="vb-bty"></span>'); tag = box.querySelector('.vb-bty'); }
  tag.className = `vb-bty t-${tyOf(spec.value)}`; tag.textContent = tyOf(spec.value);
  if (outP) {
    await outP;
    if (!alive()) return;
    const nj = vb.querySelectorAll('.vb-junk').length;
    if (nj < 3) $('vbBin').insertAdjacentHTML('afterbegin', `<i class="vb-junk t-${JUNK_TY[nj]}" style="left:${JUNK[nj][0]}px;transform:rotate(${JUNK[nj][1]}deg)"></i>`);
  }
  await sleep(200);
}

// play a swap program from `init`; returns { vars } or { err: { i, name } } (null when cancelled)
async function playProg(id, lines, init) {
  let cur = { ...init };
  for (let i = 0; i < lines.length; i++) {
    const a = assignOf(lines[i]); let v;
    try { v = evalExpr(a.expr, cur); } catch (e) {
      if (!(e instanceof NameErr)) throw e;
      moveArrow(i); await sleep(320); if (id !== RUN) return null;
      lineEl(i)?.classList.add('err'); sfx.bad(); await sleep(350);
      return id === RUN ? { err: { i, name: e.name } } : null;
    }
    await animLine(id, i, cur, { tgt: a.tgt, value: v });
    if (id !== RUN) return null;
    cur = { ...cur, [a.tgt]: v };
  }
  return { vars: cur };
}

// run an async scene: controls locked while it plays; render() always follows (unless something else re-rendered meanwhile)
async function play(fn) {
  if (S.busy) return;
  S.busy = true; $('ctrlBody').querySelectorAll('button').forEach((b) => { b.disabled = true; });
  const id = ++RUN;
  try { await fn(id); } catch (e) { console.error(e); }
  if (id === RUN) { S.busy = false; render(); }
}

// --- controls -----------------------------------------------------------------------------------------------
function drawCtrl() {
  const t = T[lang], v = lab.view;
  const c = S.sec === 'loop' ? ctrlLoop(t) : S.sec === 'arrow' ? ctrlArrow(t) : v === 'step' ? ctrlStep(t) : v === 'swap' ? ctrlSwap(t) : ctrlTypes(t);
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('ctrlBody').innerHTML = `${c.h}<div class="row2"><div class="chips">${sc('loop', '⏱️')}${sc('arrow', '🧾')}</div></div>`;
  lab.setReadout(c.val, c.sub, c.pill, '#b8651b');
  lab.setState({ ...c.st, extra: `<div class="fine">${esc(t.fine)}</div>` });
  lab.setFacts(t.facts[v] ?? []);
  lab.setGlow('rgba(210, 140, 60, .26)');
}
function render() {
  RUN++; S.busy = false; fly.innerHTML = '';
  drawStage(); drawCtrl();
}
const reset = {
  step: () => { const p = S.st.prog; S.st = { prog: p, pc: 0, guess: null, right: [], last: null, link: null }; },
  swap: () => { S.sw = { phase: 'build', guess: S.sw.guess, qDone: true, lines: [], res: null, errName: null }; },
  types: () => { S.ty = { i: 0, guess: null, picks: [null, null, null], rev: false, right: [], last: '' }; },
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled || S.busy) return;
  const act = b.dataset.act, i = +b.dataset.i, v = lab.view;
  sfx.click();
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k;
    if (S.sec === 'loop') S.lp = { n: 0, guess: null }; else if (S.sec === 'arrow') S.ar = { k: null, played: false };
    return render();
  }
  if (act === 'pick') { (S.sec === 'loop' ? S.lp : S.st).guess = i; return render(); }
  if (act === 'run') return S.sec === 'loop' ? runLoop() : runStep();
  if (act === 'link') { const ok = b.dataset.a === 'no'; S.st.link = b.dataset.a; S.st.last = { ok, kind: 'link' }; (ok ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  if (act === 'plus') { S.st = { prog: S.st.prog === 'A' ? 'B' : 'A', pc: 0, guess: null, right: [], last: null, link: null }; return render(); }
  if (act === 'restart') {
    if (S.sec === 'loop') S.lp = { n: 0, guess: null }; else if (S.sec === 'arrow') S.ar = { k: null, played: false }; else reset[v]();
    return render();
  }
  if (act === 'swq') return pickSwapQ(i);
  if (act === 'build') { S.sw.phase = 'build'; S.sw.lines = []; S.sw.res = null; return render(); }
  if (act === 'add') { if (S.sw.lines.length < 4) { S.sw.lines.push(PALETTE[i]); S.sw.res = null; } return render(); }
  if (act === 'runswap') return runSwap();
  if (act === 'tpick') { S.ty.guess = i; return runTypes(); }
  if (act === 'mpick') {
    const r = +b.dataset.r, c = +b.dataset.c, p = S.ty.picks;
    for (let k = 0; k < 3; k++) if (k !== r && p[k] === c) p[k] = null;
    p[r] = p[r] === c ? null : c; return render();
  }
  if (act === 'runty') return runTypes();
  if (act === 'next') { const s = S.ty; S.ty = { ...s, i: s.i + 1, guess: null, picks: [null, null, null], rev: false }; return render(); }
  if (act === 'arr') return playArrow(i);
});
// tap a line of the swap program to remove it
vb.addEventListener('click', (ev) => {
  const ln = ev.target.closest('.vb-line[data-rm]'); if (!ln || S.busy || lab.view !== 'swap' || S.sec) return;
  S.sw.lines.splice(+ln.dataset.i, 1); S.sw.res = null; sfx.click(); render();
});

render();
</script>
</body>
</html>
