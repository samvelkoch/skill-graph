// --- secret scenes -----------------------------------------------------------------------------------------
function drawRose(c, bx, t) {

}
function drawAxis(c, bx, base) {

// --- the main loop -----------------------------------------------------------------------------------------
let geo = null;

}
canvasLoop($('cv'), (c, w, h, dt, time) => {

function drawWhich(c, w, h, time) {
  if (S.wq >= 6) { panel(c, 8, 8, w - 16, h - 16); pill(c, '🏆', w / 2, h / 2, { size: 40, bg: 'rgba(0,0,0,0)' }); return; }
  const q = QS[S.wq], y0 = (qEl.offsetHeight || 80) + 16, gap = 10, aw = Math.min(w - 16, 620), ax = (w - aw) / 2, ah = h - y0 - 8;
  const cw = (aw - gap) / 2, ch = (ah - gap) / 2, rev = ease(S.wRev), cards = [];
  TYPES.forEach((ty, i) => {
    const x = ax + (i % 2) * (cw + gap), y = y0 + Math.floor(i / 2) * (ch + gap);
    cards.push({ ty, x, y, w: cw, h: ch });
    panel(c, x, y, cw, ch, 16);
    if (S.wRev > 0) {
      c.save(); c.globalAlpha = rev;

      c.restore();

    }

      const g = c.createLinearGradient(-cw / 2, -ch / 2, cw / 2, ch / 2); g.addColorStop(0, '#5a62c4'); g.addColorStop(1, '#2c3278');
      c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 12; c.shadowOffsetY = 4;
      c.fillStyle = g; c.beginPath(); c.roundRect(-cw / 2, -ch / 2, cw, ch, 16); c.fill();
      c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
      c.lineWidth = 2; c.strokeStyle = '#1a1e4a'; c.stroke();

      if (best) { c.strokeStyle = '#f5c84c'; c.shadowColor = 'rgba(245,200,76,.8)'; c.shadowBlur = 14; c.beginPath(); c.roundRect(cd.x - 2, cd.y - 2, cd.w + 4, cd.h + 4, 18); c.stroke(); c.shadowBlur = 0; }

      c.restore();

      else if (ok) pill(c, T[lang].wAlso, cd.x + cd.w / 2, cd.y + cd.h - 12, { bg: '#3ddc97', fg: '#06241a', size: 12, pad: 14 });

function drawWrong(c, w, h) {

  return { html, val: `×${fmt(ratio)}`, sub: a.sub, pill: a.pill, color: '#5aa0e0', glow: 'rgba(90,160,224,.26)', state: { emo: '📏', title: z ? a.t0 : a.t20, lead: z ? a.l0 : a.l20, body: a.body, extra: '' }, facts: [] };
}
render();
</script>
