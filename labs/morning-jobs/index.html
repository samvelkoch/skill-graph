  c.fillStyle = lin(c, 0, py - 17, 0, py + 17, [[0, '#ffe486'], [0.5, '#ffd034'], [1, '#d89a14']]); c.strokeStyle = '#8a5f0a'; c.lineWidth = 1.8; rr(c, 76, py - 17, 196, 34, 3); c.fill(); c.stroke(); c.restore();
  c.strokeStyle = 'rgba(138,95,10,.45)'; c.lineWidth = 1.2; for (const dy of [-6, 5]) { c.beginPath(); c.moveTo(78, py + dy); c.lineTo(270, py + dy); c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,.45)'; rr(c, 84, py - 14, 180, 4, 2); c.fill();
  c.fillStyle = lin(c, 0, py - 17, 0, py + 17, [[0, '#f6dcb2'], [1, '#d6a96c']]); c.strokeStyle = '#8a5a30'; c.lineWidth = 1.8; c.beginPath(); c.moveTo(76, py - 17); c.lineTo(40, py - 3); c.lineTo(40, py + 3); c.lineTo(76, py + 17); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#34343e'; c.strokeStyle = '#17171c'; c.beginPath(); c.moveTo(48, py - 5); c.lineTo(34, py); c.lineTo(48, py + 5); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = lin(c, 0, py - 17, 0, py + 17, [[0, '#f4f6fa'], [0.5, '#a8b0bc'], [1, '#6f7886']]); c.strokeStyle = '#4a525e'; c.lineWidth = 1.6; rr(c, 272, py - 18, 34, 36, 3); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(60,70,84,.7)'; for (const dx of [282, 296]) { c.beginPath(); c.moveTo(dx, py - 16); c.lineTo(dx, py + 16); c.stroke(); }
  c.fillStyle = lin(c, 0, py - 16, 0, py + 16, [[0, '#ffb3bd'], [1, '#e0788a']]); c.strokeStyle = '#a2404f'; rr(c, 306, py - 16, 26, 32, 8); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.5)'; rr(c, 311, py - 12, 14, 4, 2); c.fill();
  // workers: id, x, y, pencil point
  const W5 = [['miner', 60, 100, 40, py], ['chemist', 178, 100, 178, py - 17], ['smelter', 296, 100, 289, py - 18], ['forester', 108, 336, 90, py + 17], ['grower', 280, 336, 319, py + 16]];
  W5.forEach(([id, x, y, px, pyy], i) => {
    const e = easeOut(clamp((time - S.secAt - i * 0.15) / 0.45, 0, 1)); if (e <= 0) return;
    c.save(); c.globalAlpha = e; c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.6; c.setLineDash([4, 5]);
    c.beginPath(); c.moveTo(x, y < py ? y + 76 : y - 22); c.lineTo(px, pyy); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#fff'; circ(c, px, pyy, 3.4); c.fill();
    person(c, x, y, 0.95, id, time, { nobadge: false });
    const part = t.sp.parts[['miner', 'forester', 'chemist', 'grower', 'smelter'].indexOf(id)];
    pill(c, `${part}: ${t.J[id]}`, x, y < py ? y + 62 : y + 62, { f: 12 }); c.restore();
  });
}

// --- the main loop -----------------------------------------------------------------------------------------
let geo = { k: 1, ox: 0, oy: 0 };
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const k = Math.min(w / W, h / H), ox = (w - W * k) / 2, oy = (h - H * k) / 2; geo = { k, ox, oy };
  S.shown += clamp(S.sold - S.shown, -dt * 28, dt * 28);
  c.save(); c.translate(ox, oy); c.scale(k, k); c.lineJoin = 'round'; c.lineCap = 'round';
  if (S.sec === 'jobs') drawJobsSecret(c, time);
  else if (S.sec === 'pen') drawPencil(c, time);
  else if (lab.view === 'parade') { drawParade(c, time); drawKitchen(c, time); }
  else if (lab.view === 'likes') drawLikes(c, time);
  else drawPay(c, time);
  c.restore();
});
$('cv').addEventListener('click', (ev) => {
  if (S.sec || lab.view !== 'parade') return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - geo.ox) / geo.k, y = (ev.clientY - r.top - geo.oy) / geo.k;
  let best = null, bd = 1e9;
  for (const it of ITEMS) { const d = Math.hypot(x - it.x, y - it.y); if (d < it.r + 6 && d < bd) { best = it; bd = d; } }
  if (!best) return;
  S.sel = best.id; S.tapAt = now(); if (S.g[best.id] !== undefined) S.revealAt = now(); sfx.click(); render();
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'g1') { if (S.sel === null || S.g[S.sel] !== undefined) return; S.g[S.sel] = +b.dataset.i; S.revealAt = now(); (+b.dataset.i === bucket(ITEMS.find((i) => i.id === S.sel).jobs.length) ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'int') {
    const k = b.dataset.k; if (S.picks.includes(k)) S.picks = S.picks.filter((x) => x !== k); else S.picks = [...S.picks, k].slice(-2);
    S.pickAt = now(); sfx.tick();
  } else if (act === 'g3') { if (S.pred !== null) return; S.pred = +b.dataset.i; S.sold = 0; S.moved = false; (S.pred === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.secAt = now(); sfx.click();
  }
  render();
});
$('sold').addEventListener('input', (ev) => { if (S.pred === null) return; S.sold = +ev.target.value; S.moved = true; render(); });

// --- one render per change -------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  if (S.lastV !== v) { S.lastV = v; S.sec = null; }
  const sc = S.sec;
  $('mj1').style.display = !sc && v === 'parade' ? '' : 'none';
  $('mj2').style.display = !sc && v === 'likes' ? '' : 'none';
  $('mj3').style.display = !sc && v === 'pay' ? '' : 'none';
  $('secRow').innerHTML = [['jobs', '🕰️'], ['pen', '✏️']].map(([k, e]) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setFacts([{ emo: FACT[['parade', 'likes', 'pay'].indexOf(v)].emo, text: t.facts[['parade', 'likes', 'pay'].indexOf(v)], src: FACT[['parade', 'likes', 'pay'].indexOf(v)].src }]);
  if (sc === 'jobs') { lab.setGlow('rgba(78, 168, 255, .24)'); lab.setReadout('', '', '', '#4ea8ff'); lab.setState({ emo: '🕰️', title: t.sj.t, lead: t.sj.l, body: '', extra: '' }); return; }
  if (sc === 'pen') { lab.setGlow('rgba(245, 200, 76, .24)'); lab.setReadout('', '', '', '#f5c84c'); lab.setState({ emo: '✏️', title: t.sp.t, lead: t.sp.l, body: '', extra: '' }); return; }
  if (v === 'parade') renderParade(t); else if (v === 'likes') renderLikes(t); else renderPay(t);
}
function renderParade(t) {
  lab.setGlow('rgba(224, 160, 90, .26)');
  const it = ITEMS.find((i) => i.id === S.sel), g = it ? S.g[it.id] : undefined, done = g !== undefined, seen = Object.keys(S.g).length;
  $('q1').textContent = it ? t.v1.q : t.v1.tap;
  $('o1').style.display = it ? '' : 'none';
  const win = it ? bucket(it.jobs.length) : -1;
  $('o1').innerHTML = ['1', '2–3', '4+'].map((l, i) => `<button data-act="g1" data-i="${i}" ${done ? 'disabled' : ''} class="${done ? (i === win ? 'good' : i === g ? 'bad' : '') : ''}">${l}</button>`).join('');
  if (!it) { lab.setReadout('?', '', t.v1.seen(seen), '#e0a05a'); lab.setState({ emo: '🥣', title: t.v1.none, lead: t.v1.noneLead, body: '', extra: '' }); return; }
  if (!done) { lab.setReadout('?', t.items[it.id], t.v1.seen(seen), '#e0a05a'); lab.setState({ emo: it.e, title: t.items[it.id], lead: t.v1.q, body: '', extra: '' }); return; }
  const n = it.jobs.length;
  lab.setReadout(n, t.items[it.id], t.v1.seen(seen), '#e0a05a');
  lab.setState({ emo: g === win ? '✅' : '🤔', title: g === win ? t.right : t.notq, lead: `${t.items[it.id]}: ${t.jobsN(n)}.`, body: it.jobs.map((j) => t.J[j]).join(' → '), extra: `<div class="fine">${esc(t.v1.body)}</div>` });
}
function renderLikes(t) {
  lab.setGlow('rgba(245, 200, 76, .22)');
  $('ints').innerHTML = INTS.map(([k, e]) => `<button class="mj-int ${S.picks.includes(k) ? 'on' : ''}" data-act="int" data-k="${k}"><span>${e}</span>${esc(t.ints[k])}</button>`).join('');
  const n = S.picks.length; lab.setReadout(t.v2.pick(n), '', '', '#f5c84c');
  if (n < 2) lab.setState({ emo: '💛', title: n ? t.ints[S.picks[0]] : t.v2.none, lead: n ? t.v2.oneLead : t.v2.noneLead, body: '', extra: '' });
  else lab.setState({ emo: '💛', title: `${t.ints[S.picks[0]]} + ${t.ints[S.picks[1]]}`, lead: t.v2.lead, body: '', extra: '' });
}
function renderPay(t) {
  lab.setGlow('rgba(79, 197, 138, .22)');
  const done = S.pred !== null;
  $('q3').textContent = t.v3.q;
  $('o3').innerHTML = t.v3.opts.map((l, i) => `<button data-act="g3" data-i="${i}" ${done ? 'disabled' : ''} class="${done ? (i === 1 ? 'good' : i === S.pred ? 'bad' : '') : ''}">${esc(l)}</button>`).join('');
  const sl = $('sold'); sl.disabled = !done; if (+sl.value !== S.sold) sl.value = S.sold;
  $('slL').textContent = `${t.v3.sl}: ${S.sold}`;
  const till = S.sold * 3, wage = Math.max(0, till - 40);
  lab.setReadout(done ? wage : '', done ? t.v3.wage : '', done ? `🪙 ${till}` : '', '#4fc58a');
  if (!done) { lab.setState({ emo: '🥖', title: t.v3.t0, lead: t.v3.l0, body: '', extra: '' }); return; }
  if (!S.moved) lab.setState({ emo: S.pred === 1 ? '✅' : '🤔', title: S.pred === 1 ? t.right : t.notq, lead: t.v3.rv, body: '', extra: '' });
  else lab.setState({ emo: '🪙', title: wage > 0 ? t.v3.w(wage) : t.v3.w0, lead: t.v3.calc(S.sold, till, wage), body: '', extra: '' });
}
render();
</script>
