  c.save(); c.setLineDash([4, 4]); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.6; dline(); c.stroke(); c.restore();
  if (!live) { pill(c, t.pressRun, (L + R) / 2, (Tp + B) / 2, w); return; }
  c.save(); c.beginPath(); c.rect(L - 1, Tp - 6, Math.max(0, xOf(upto) - L + 1), B - Tp + 12); c.clip();
  const pts = (f) => { const a = [[xOf(0), f(rows[0])]]; for (const q of rows) a.push([xOf(q.t + 0.125), f(q)]); a.push([xOf(span), f(rows[rows.length - 1])]); return a; };
  for (let j = 0; j < 9; j++) {
    const hi = pts((q) => q.cum[j]), lo = j ? pts((q) => q.cum[j - 1]) : null;
    c.beginPath(); hi.forEach(([px, v], i) => (i ? c.lineTo(px, yOf(v)) : c.moveTo(px, yOf(v))));
    for (let i = hi.length - 1; i >= 0; i--) c.lineTo(hi[i][0], lo ? yOf(lo[i][1]) : B);
    c.closePath();
    const col = COL[KEYS[j]];
    if (j < 7) { const gr = c.createLinearGradient(0, Tp, 0, B); gr.addColorStop(0, col); gr.addColorStop(1, mixh(col, '#0A0C14', 0.45)); c.fillStyle = gr; }

  const bad = new Set(); for (const q of rows) if (q.short > 0.05) bad.add(Math.floor(q.t));
  c.fillStyle = `rgba(255,59,48,${0.16 + 0.1 * Math.sin(tm * 6)})`; for (const hh of bad) c.fillRect(xOf(hh), Tp, xOf(hh + 1) - xOf(hh), B - Tp);

    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.2; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(px, Tp - 4); c.lineTo(px, B); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#fff'; c.beginPath(); c.arc(px, yOf(q.D), 3.5, 0, 6.283); c.fill();
    pill(c, t.made(hhmm(cur % 24), nf(q.D - q.short), nf(q.D)), px, Tp + 8, w, { line: q.short > 0.05 ? '#FF3B30' : 'rgba(255,255,255,.25)' });
  }
}

// --- drawing: the 100 years --------------------------------------------------------------------------------
function drawYears(c, w, h, dt, tm) {
  const t = T[lang], q = yrs(S.f / 100), Y = S.y, sh = h * 0.42, f = S.f / 100;
  const fc = Number.isFinite(q.tc) ? clamp(1 - Y / q.tc, 0, 1) : 1, fg = Number.isFinite(q.tg) ? clamp(1 - Y / q.tg, 0, 1) : 1;

  const gy = sh - 30;
  const gg = c.createLinearGradient(0, gy, 0, sh); gg.addColorStop(0, '#3A8A5E'); gg.addColorStop(1, '#1F5A44'); c.fillStyle = gg; c.fillRect(0, gy, w, sh - gy);
  // coal heap
  const hx = w * 0.2;

    const s = 0.22 + 0.78 * Math.sqrt(fc), W = w * 0.3 * s, H = (gy - 24) * 0.9 * s;
    const g = c.createLinearGradient(0, gy - H, 0, gy); g.addColorStop(0, '#6A5E57'); g.addColorStop(1, '#1B1816'); c.fillStyle = g;
    c.beginPath(); c.moveTo(hx - W / 2, gy + 2); c.bezierCurveTo(hx - W * 0.28, gy - H * 1.25, hx + W * 0.28, gy - H * 1.25, hx + W / 2, gy + 2); c.closePath(); c.fill();
    for (let k = 0; k < 10; k++) { const a = hash(k * 5.1), b = hash(k * 2.3); c.fillStyle = `rgba(${k % 2 ? '255,255,255' : '0,0,0'},.16)`; c.beginPath(); c.arc(hx + (a - 0.5) * W * 0.6, gy - 3 - b * H * 0.6, Math.max(0, 1.5 + a * 2.5 * s), 0, 6.283); c.fill(); }
  } else { c.fillStyle = 'rgba(20,18,16,.55)'; c.beginPath(); c.ellipse(hx, gy + 3, w * 0.07, 3, 0, 0, 6.283); c.fill(); }
  // gas tank
  const tx = w * 0.5, tw = w * 0.16, th = gy - 30;
  c.fillStyle = 'rgba(255,255,255,.35)'; rr(c, tx - tw / 2, gy - th, tw, th, 9); c.fill();
  c.save(); rr(c, tx - tw / 2, gy - th, tw, th, 9); c.clip();
  const lg = c.createLinearGradient(tx - tw / 2, 0, tx + tw / 2, 0); lg.addColorStop(0, '#FFB45C'); lg.addColorStop(0.5, '#FF9A3C'); lg.addColorStop(1, '#D9731F'); c.fillStyle = lg; c.fillRect(tx - tw / 2, gy - th * fg, tw, th * fg + 2);
  c.fillStyle = 'rgba(255,255,255,.28)'; c.fillRect(tx - tw / 2 + 4, gy - th, 4, th); c.restore();
  c.strokeStyle = '#6B7392'; c.lineWidth = 2; rr(c, tx - tw / 2, gy - th, tw, th, 9); c.stroke();
  // sun and turbine that refill every day
  const sx = w * 0.76, sy = sh * 0.3;
  const pulse = (px, py, col) => { for (let k = 0; k < 2; k++) { const ph = (tm * 0.7 + k / 2) % 1; c.strokeStyle = rgba(col, (1 - ph) * 0.6); c.lineWidth = 2; c.beginPath(); c.arc(px, py, Math.max(0, 14 + ph * 30), 0, 6.283); c.stroke(); } };
  pulse(sx, sy, [255, 226, 120]);
  const sd = c.createRadialGradient(sx - 4, sy - 4, 1, sx, sy, 15); sd.addColorStop(0, '#FFF6C9'); sd.addColorStop(1, '#FFC93C'); c.fillStyle = sd; c.beginPath(); c.arc(sx, sy, 14, 0, 6.283); c.fill();
  const wx = w * 0.9, wyb = gy, wh = sh * 0.5, wyh = wyb - wh; G.rot += dt * 3;
  pulse(wx, wyh, [255, 255, 255]);
  c.fillStyle = '#F4F6FC'; c.beginPath(); c.moveTo(wx - 2.5, wyb); c.lineTo(wx + 2.5, wyb); c.lineTo(wx + 1, wyh); c.lineTo(wx - 1, wyh); c.closePath(); c.fill();
  for (let k = 0; k < 3; k++) { c.save(); c.translate(wx, wyh); c.rotate(G.rot + k * 2.094); c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(3, -wh * 0.2, 0.6, -wh * 0.5); c.quadraticCurveTo(-1.8, -wh * 0.2, 0, 0); c.fill(); c.restore(); }
  c.restore();
  pill(c, fc > 0 ? t.y.heap(nf(C0 * fc / 1e6, 1)) : `${t.y.lgCoal} · ${t.y.emptyL}`, hx, sh - 14, w);

  pill(c, t.y.refill, (sx + wx) / 2, sh - 14, w);
  pill(c, t.y.toy, w / 2, 14, w, { color: '#FFD58A' });
  // chart
  const x = 5, y = sh + 8, pw = w - 10, ph = h - y - 5, L = x + 38, R = x + pw - 12, Tp = y + 32, B = y + ph - 24;
  rr(c, x, y, pw, ph, 16); c.fillStyle = 'rgba(14,17,28,.9)'; c.fill(); c.strokeStyle = 'rgba(130,145,190,.22)'; c.lineWidth = 1; c.stroke();
  G.chart = { L, R, T: y, B, span: 100 };
  const xOf = (v) => L + (R - L) * v / 100, yOf = (v) => B - (B - Tp) * v;
  c.font = '800 12px Nunito, sans-serif'; c.textBaseline = 'middle'; c.fillStyle = '#98A0B8';
  c.textAlign = 'right'; for (const v of [0, 0.5, 1]) { c.strokeStyle = 'rgba(130,145,190,.16)'; c.beginPath(); c.moveTo(L, yOf(v)); c.lineTo(R, yOf(v)); c.stroke(); c.fillText(`${v * 100}%`, L - 5, yOf(v)); }

  line((v) => (Number.isFinite(q.tc) ? clamp(1 - v / q.tc, 0, 1) : 1), '#C9B8A8');
  line((v) => (Number.isFinite(q.tg) ? clamp(1 - v / q.tg, 0, 1) : 1), '#FF9A3C');
  const px = xOf(Y); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.2; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(px, Tp - 4); c.lineTo(px, B); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#fff'; c.beginPath(); c.arc(px, yOf(covAt(f, Y, q)), 3.5, 0, 6.283); c.fill();
  pill(c, t.y.year(Math.round(Y)), px, Tp - 6, w);
}

// --- the canvas loop ---------------------------------------------------------------------------------------
function frame(c, w, h, dt, tm) {
  const m = mode();
  if (m === 'years') {
    if (S.play) {
      S.y = Math.min(100, S.y + dt * 12.5); const sl = $('pgY'); if (sl) sl.value = S.y;
      if (S.y >= 100) { S.play = false; const b = $('pgPlay'); if (b) b.textContent = T[lang].y.play; }
      paintInfo();
    }
    drawYears(c, w, h, dt, tm); return;
  }
  const r = RUN[m], sm = simOf(m);
  if (r.running) {
    r.clock += dt * (sm.span / (sm.days > 1 ? 11 : 8));
    if (r.clock >= sm.span) { r.clock = sm.span; r.running = false; r.done = true; finishRun(m); } else paintInfo();
  }
  const env = envOf(m), sh = h * 0.4;
  drawTown(c, w, sh, env, dt, tm, m === 'store' || m === 'island' ? 'store' : 'day');
  drawChart(c, w, h, m, env, tm);
}
canvasLoop($('cv'), frame);

function scrubAt(ev) {
  if (!G.chart) return;
  const m = mode(), cv = $('cv').getBoundingClientRect(), px = ev.clientX - cv.left, py = ev.clientY - cv.top;
  if (py < G.chart.T) return;
  const v = clamp((px - G.chart.L) / (G.chart.R - G.chart.L), 0, 0.999) * G.chart.span;
  if (m === 'years') { S.y = v; S.play = false; const sl = $('pgY'); if (sl) sl.value = v; const b = $('pgPlay'); if (b) b.textContent = T[lang].y.play; paintInfo(); return; }
  if (RUN[m].done) RUN[m].scrub = v;
}
let drag = false;
$('cv').addEventListener('pointerdown', (ev) => { drag = true; $('cv').setPointerCapture?.(ev.pointerId); scrubAt(ev); });
$('cv').addEventListener('pointermove', (ev) => { if (drag) scrubAt(ev); });
$('cv').addEventListener('pointerup', () => { drag = false; });
$('cv').addEventListener('pointercancel', () => { drag = false; });

// --- panels ------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function startRun(m) { const r = RUN[m]; r.clock = 0; r.running = true; r.done = false; r.scrub = null; sfx.click(); showStage(); render(); }
function finishRun(m) {
  const tl = tally(simOf(m), 1e9), goodEnd = m === 'island' ? tl.black === 0 : m === 'store' ? tl.eve < 0.05 : tl.black === 0;
  (goodEnd ? sfx.good : sfx.bad)(); render();
}
const stepper = (k, val, t) => `<div class="pg-pl"><div class="pg-pn"><span>${t.pl[k][0]} ${esc(t.pl[k][1])}</span><small>${nf(MWU[k])} ${k === 'bat' || k === 'lake' ? t.mwh : t.mw}</small></div>
  <div class="pg-st"><button class="pg-sb" data-act="dec" data-k="${k}" ${val <= 0 ? 'disabled' : ''} aria-label="−">−</button><b>${val}</b><button class="pg-sb" data-act="inc" data-k="${k}" ${val >= CAP[k] ? 'disabled' : ''} aria-label="+">+</button></div></div>`;
const legend = (keys, t) => `<div class="pg-legend">${keys.map((k) => `<span><i style="background:${k === 'waste' ? 'repeating-linear-gradient(135deg,#C9D2EC 0 2px,transparent 2px 4px)' : k === 'dem' ? '#fff' : COL[k]}"></i>${esc(t.lg[k])}</span>`).join('')}</div>`;
const chips = (act, opts, cur, t) => opts.map((o) => `<button class="chip pg-c ${cur === o ? 'on' : ''}" data-act="${act}" data-v="${o}">${esc(t[act === 'season' ? 'seasons' : act === 'sky' ? 'skies' : 'winds'][o])}</button>`).join('');
function secRow(t) {

}
function ctrlHTML(m, t) {

    return `<div class="pg-sl"><label for="pgF" id="pgFl">${esc(t.y.fossil(S.f))}</label>
      <input type="range" class="big" id="pgF" min="0" max="100" step="5" value="${S.f}" style="--track:linear-gradient(90deg,#3ddc97,#ffc93c,#ff7a4a)"><div class="ends"><span>${esc(t.y.e0)}</span><span>${esc(t.y.e1)}</span></div>
      <label for="pgY" id="pgYl">${esc(t.y.year(Math.round(S.y)))}</label><input type="range" class="big" id="pgY" min="0" max="100" step="0.1" value="${S.y}" style="--track:linear-gradient(90deg,#4ea8ff,#98a0b8)"></div>

      ${week ? `<button class="chip pg-c" data-act="back">${esc(t.dk.back)}</button>` : ''}</div>${secRow(t)}`;
  }

    <div class="pg-plants">${['solar', 'wind', 'bat', 'lake'].map((k) => stepper(k, c.u[k], t)).join('')}</div>

function paintInfo() {
  const t = T[lang], m = mode();
  if (m === 'years') {
    const f = S.f / 100, q = yrs(f), Y = S.y, ce = Y >= q.tc, ge = Y >= q.tg, cov = Math.round(covAt(f, Y, q) * 100);
    const fc = Number.isFinite(q.tc) ? Math.round(clamp(1 - Y / q.tc, 0, 1) * 100) : 100, fg = Number.isFinite(q.tg) ? Math.round(clamp(1 - Y / q.tg, 0, 1) * 100) : 100;
    const tit = f === 0 ? t.y.tNever : q.tc > 100 ? t.y.tLong : t.y.tYears(Math.ceil(q.tc));
    lab.setState({ emo: ce || ge ? '🛑' : '⛏️', title: tit, lead: ce && ge ? t.y.leadCG(cov) : ce ? t.y.leadC(cov) : ge ? t.y.leadG(cov) : t.y.lead(Math.round(Y), fc, fg), body: t.y.body });
    lab.setReadout(f === 0 ? t.y.valNever : q.tc > 100 ? '100+' : nf(Math.ceil(q.tc)), f === 0 ? t.y.subNever : q.tc > 100 ? t.y.sub100 : t.y.sub, t.y.pill(nf(q.co2, 1)), ce || ge ? '#ff7a4a' : '#3ddc97');
    const l1 = $('pgFl'), l2 = $('pgYl'); if (l1) l1.textContent = t.y.fossil(S.f); if (l2) l2.textContent = t.y.year(Math.round(S.y));
    return;
  }
  const r = RUN[m], sm = simOf(m), idle = !r.running && !r.done, tl = tally(sm, r.done ? 1e9 : r.clock), env = envOf(m), c = SC[m];
  let extra = '';
  if (m === 'day' || m === 'dunk') extra = Object.keys(t.note).filter((k) => c.u[k] > 0).map((k) => `<p class="pg-ex">${esc(t.note[k])}</p>`).join('');
  if (m === 'day' && !S.asked) {
    lab.setState({ emo: '🌫️', title: t.d.askTitle, lead: t.d.askLead, body: t.d.askBody }); lab.setReadout('—', t.d.hidden, ''); return;
  }
  const clr = tl.black > 0 ? '#ff5a4f' : '#3ddc97';
  if (m === 'day' || m === 'dunk') {
    const wk = m === 'dunk';
    if (S.showPred && r.done && m === 'day') {
      const q = sm.rows[76];
      lab.setState({ emo: '🌙', title: S.guess === 'no' ? t.d.right : t.d.wrong, lead: `${t.d.q} ${t.d.said(S.guess === 'yes' ? t.d.yes : t.d.no)}`, body: `${t.d.rev(nf(q.D), nf(q.D - q.short))} ${t.d.next}`, extra });
    } else if (idle) lab.setState({ emo: wk ? '🌑' : '🏙️', title: wk ? t.dk.title : t.d.idleTitle, lead: wk ? t.dk.body : t.d.idleLead, body: wk ? '' : t.d.body, extra });
    else if (r.running) lab.setState({ emo: '⏱️', title: wk ? t.dk.title : t.d.runTitle, lead: wk ? t.dk.runLead(Math.floor(r.clock / 24) + 1, hhmm(r.clock % 24)) : t.d.runLead(hhmm(r.clock)), body: wk ? t.dk.body : t.d.body, extra });
    else if (wk) lab.setState({ emo: tl.miss > 0.5 ? '🌑' : '🌟', title: t.dk.title, lead: tl.miss > 0.5 ? t.dk.miss(nf(tl.peak), nf(tl.miss)) : t.dk.ok, body: `${t.dk.body} ${t.d.scrub}`, extra });
    else if (tl.black > 0) {

      lab.setState({ emo: '🕯️', title: t.d.badTitle(tl.black), lead: t.d.badLead(hhmm(worst.t), nf(worst.D), nf(worst.D - worst.short)), body: `${t.d.body} ${t.d.scrub}`, extra });
    } else lab.setState({ emo: '🌟', title: t.d.okTitle, lead: t.d.okLead(nf(tl.co2, 1), Math.round(tl.ren * 100)), body: `${t.d.body} ${t.d.scrub}`, extra });
    if (idle) lab.setReadout('—', wk ? t.dk.title : t.d.idleTitle, '');
    else lab.setReadout(String(tl.black), wk ? `${t.hw(tl.black)} · ${t.dk.sub(nf(tl.peak))}` : `${t.hw(tl.black)} · ${nf(tl.co2, 1)} ${t.ton} CO₂`, wk ? (tl.miss > 0.5 ? t.dk.pill(nf(tl.miss)) : t.dk.pillOk) : t.pillRen(Math.round(tl.ren * 100)), clr);
    return;
  }
  // storage view and the island
  const isl = m === 'island', socNow = env.row ? Math.round(env.row.soc * 100) : 0, ok = isl ? tl.black === 0 : tl.eve < 0.05;
  if (idle) lab.setState({ emo: isl ? '🏝️' : '🔋', title: isl ? t.st.isTitle : t.st.title, lead: isl ? t.st.isLead : t.st.lead, body: isl ? t.st.isBody : t.st.body });
  else {
    const res = r.running ? '' : ok ? (isl ? t.st.isOk : t.st.ok) : (isl ? t.st.isNo(tl.black) : t.st.no(nf(tl.eve)));
    lab.setState({ emo: r.running ? '⏱️' : ok ? '🎯' : (isl ? '🏝️' : '🔋'), title: isl ? t.st.isTitle : t.st.title, lead: r.running ? (isl ? t.st.isLead : t.st.lead) : res, body: isl ? t.st.isBody : t.st.body,
      extra: r.running ? '' : `<div class="pg-goal ${ok ? 'pg-good' : ''}">${esc(isl ? t.st.isLead : t.st.lead)}</div>` });
  }
  if (idle) lab.setReadout('—', isl ? t.st.isLead : t.st.lead, '');
  else lab.setReadout(`${socNow}%`, `${t.st.stored} · ${tl.black} ${t.hw(tl.black)}`, isl ? (ok ? t.st.isPillOk : t.st.isPill(tl.black)) : (ok ? t.st.pillOk : t.st.pill(nf(tl.eve))), tl.black > 0 || !ok ? '#ffb347' : '#3ddc97');
}

function render() {
  const t = T[lang], m = mode();
  document.body.dataset.v = lab.view;
  const asking = m === 'day' && !S.asked;
  askEl.style.display = asking ? '' : 'none';
  if (asking) askEl.innerHTML = `<div class="pg-q">${esc(t.d.q)}</div><p class="pg-pre">${esc(t.d.preset)}</p><div class="pg-yn"><button data-a="yes">${esc(t.d.yes)}</button><button data-a="no">${esc(t.d.no)}</button></div>`;
  $('ctrlBody').innerHTML = ctrlHTML(m, t);
  paintInfo();
  lab.setFacts(m === 'years' ? t.facts.years : lab.view === 'store' ? t.facts.store : asking ? [] : t.facts.day);
}

askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-a]'); if (!b) return;
  S.guess = b.dataset.a; S.asked = true; S.showPred = true; store.set('pg:asked', true);
  (S.guess === 'no' ? sfx.good : sfx.bad)(); startRun('day');
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, m = mode(), c = SC[m];
  if (act === 'inc' || act === 'dec') { const k = b.dataset.k, n = clamp(c.u[k] + (act === 'inc' ? 1 : -1), 0, CAP[k]); if (n === c.u[k]) return; c.u[k] = n; S.showPred = false; sfx.tick(); }
  else if (act === 'season') { c.summer = b.dataset.v === 'summer'; S.showPred = false; sfx.click(); }
  else if (act === 'sky') { c.cloud = b.dataset.v === 'cloudy'; S.showPred = false; sfx.click(); }
  else if (act === 'wind') { c.wind = b.dataset.v; S.showPred = false; sfx.click(); }
  else if (act === 'run') { S.showPred = false; return startRun(m); }
  else if (act === 'play') { if (S.y >= 100) S.y = 0; S.play = !S.play; sfx.click(); }
  else if (act === 'back') { if (S.dunk) { S.dunk = false; RUN.dunk = newRun(); } if (S.isl) { S.isl = false; RUN.island = newRun(); } sfx.click(); }
  else if (act === 'sdk' || act === 'sis') {
    if (!secret.unlocked()) return secret.open();
    S.asked = true; store.set('pg:asked', true);
    if (act === 'sdk') {
      if (S.dunk) { S.dunk = false; RUN.dunk = newRun(); return render(); }
      S.dunk = true; lab.view = 'day'; lab.renderChrome(); return startRun('dunk');
    }
    if (S.isl) { S.isl = false; RUN.island = newRun(); return render(); }
    S.isl = true; lab.view = 'store'; lab.renderChrome(); return startRun('island');
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'pgF') { S.f = +ev.target.value; paintInfo(); }
  else if (ev.target.id === 'pgY') { S.y = +ev.target.value; S.play = false; const b = $('pgPlay'); if (b) b.textContent = T[lang].y.play; paintInfo(); }
});
render();
</script>
</body>
</html>
