const modeOf = (c) => { const e = Object.entries(c).sort((a, b) => b[1] - a[1]); return e.length > 1 && e[0][1] === e[1][1] ? null : { v: +e[0][0], n: e[0][1] }; };
function genBasket(seed) {
  for (let s = seed; ; s++) {
    const a = genArr(rng(s * 7919 + 13), 16, 7.6, 1.6, 4, 11), c = countsOf(a), md = modeOf(c);
    const mn = Math.min(...a), mx = Math.max(...a), k = a.filter((v) => v >= 9).length;
    if (md && md.n >= 3 && md.n <= 6 && mx - mn >= 4 && mx - mn <= 7 && k >= 2 && k <= 6) return { seed: s, arr: a, c, mode: md.v, lo: mn, hi: mx, k, d: mx - mn, dk: Object.keys(c).filter((v) => +v >= 9).length };
  }
}
function genGardens(seed) {
  for (let s = seed; ; s++) {
    const r = rng(s * 104729 + 7), sun = genArr(r, 16, 9.2, 0.9, 3, 12), shade = genArr(r, 16, 6.2, 1.8, 3, 12);
    const m = (a) => a.reduce((x, y) => x + y, 0) / a.length, rg = (a) => Math.max(...a) - Math.min(...a);
    const cs = countsOf(sun), ch = countsOf(shade);

  }
}

function geom(R, vmin, vmax, maxStack, pad = 22, topPad = 28) {

  const G = { R, vmin, vmax, base, top, per, r, step, pad, xv: (v) => R.x + pad + (v - vmin) * per };
  G.slot = (v, i) => ({ x: G.xv(v), y: base - 3 - r - i * step });
  G.nearest = (x) => clamp(Math.round(vmin + (x - R.x - pad) / per), vmin, vmax);
  return G;
}

  else if (m.auto) st = { emo: '⏱️', title: tm.auto[0], lead: tm.auto[1] };
  else if (ph === 'ok' || ph === 'out') st = { emo: '✅', title: tm.right, lead: tm.rightLead(L) };
  else if (m.msg === 'off' && !m.al) st = { emo: '🔴', title: tm.off[0], lead: tm.off[1] };
  else if (m.msg === 'wrong') st = { emo: '🤔', title: tm.wrong[0], lead: tm.wrong[1] };
  else if (m.al && ph === 'idle') st = { emo: '📍', title: tm.ready[0], lead: tm.ready[1] };
  else st = { emo: '🫛', title: tm.inn[0], lead: tm.inn[1] };
  if (ph === 'idle' && !m.auto) { pillT = m.al ? tm.pillOk : tm.pillOff; color = m.al ? '#7cc443' : '#e5484d'; }
  if (ph === 'done') lab.setReadout(`${n}`, tm.subDone, '', color);
  else if (ph === 'gate') lab.setReadout(`${m.i}/${n}`, '', '', color);
  else if (m.auto || m.right) lab.setReadout(`${L} ${t.cm}`, tm.sub, '', color);
  else lab.setReadout('?', tm.sub, pillT, color);
  lab.setState({ ...st, body: '', extra: '' });
}
function renderP(t) {
  const p = S.p, b = p.b, tp = t.p;
  lab.setGlow('rgba(78, 168, 255, .24)');
  const opts = $('bpPOpts'); opts.innerHTML = '';
  let st, main = '', mainOn = true;
  if (p.phase === 'pred') {
    st = { emo: '🧺', title: tp.pred[0], lead: tp.pred[1] }; main = tp.show; mainOn = p.guess !== null;
    lab.setReadout('?', p.guess === null ? '' : tp.guess(p.guess), '', '#4ea8ff');
  } else if (p.phase === 'reveal') {
    const [ti, le] = p.guess === b.mode ? tp.hit(b.mode) : tp.miss(p.guess, b.mode);
    st = { emo: p.guess === b.mode ? '✅' : '🔎', title: ti, lead: le }; main = tp.go;
    lab.setReadout(`${b.mode}`, tp.tall, '', '#4ea8ff');
  } else {
    const qi = p.qi, ans = p.ans, q = tp.q[qi];
    let nums = [];
    if (qi === 1) nums = [...new Set([b.k, b.dk, b.k + 1, b.k - 1].filter((x) => x > 0))].slice(0, 3); // right, the count of columns, and neighbours
    if (qi === 1 && !nums.includes(b.k)) nums[0] = b.k;
    if (qi === 2) nums = [b.d - 1, b.d, b.d + 1];
    nums.sort((x, y) => x - y);
    const right = qi === 0 ? b.mode : qi === 1 ? b.k : b.d;
    if (qi > 0) opts.innerHTML = nums.map((x) => `<button class="bp-ch ${ans !== null && x === right ? 'good' : ''} ${ans === x && x !== right ? 'bad' : ''}" data-act="pans" data-v="${x}" ${ans !== null ? 'disabled' : ''}>${x}</button>`).join('');
    if (ans === null) { st = { emo: '❓', title: q[0], lead: q[1] }; lab.setReadout('?', tp.qn(qi + 1), '', '#4ea8ff'); }
    else {
      const ok = ans === right, line = qi === 0 ? tp.r[0](b.mode) : qi === 1 ? tp.r[1](b.k) : tp.r[2](b.lo, b.hi, b.d);
      st = { emo: ok ? '✅' : '🤔', title: ok ? tp.ok : tp.no, lead: line };
      lab.setReadout(qi === 1 ? `${right}` : `${right} ${t.cm}`, tp.qn(qi + 1), ok ? '✓' : '', '#4ea8ff');
    }
    main = qi < 2 ? tp.next : tp.newB; mainOn = ans !== null;
  }
  $('bpPMain').textContent = main; $('bpPMain').disabled = !mainOn;
  lab.setState({ ...st, body: '', extra: '' });
}
function renderG(t) {
  const g = S.g, tg = t.g, done = g.ans !== null;
  lab.setGlow('rgba(255, 200, 80, .2)');
  $('bpGOpts').innerHTML = [['sun', tg.sunBtn], ['shade', tg.shadeBtn]].map(([k, l]) => `<button class="bp-ch wide ${done && k === g.topIs ? 'good' : ''} ${done && g.ans === k && k !== g.topIs ? 'bad' : ''}" data-act="gpick" data-t="${k}" ${done ? 'disabled' : ''}>${esc(l)}</button>`).join('');
  $('bpGNew').textContent = tg.newG; $('bpGNew').style.display = done ? '' : 'none';
  if (!done) { lab.setReadout('?', '', '', '#ffc850'); lab.setState({ emo: '🌱', title: tg.q[0], lead: tg.q[1], body: '', extra: '' }); }
  else {
    const ok = g.ans === g.topIs, rg = (a) => `${Math.min(...a)}–${Math.max(...a)}`;
    lab.setReadout(rg(g.sun), tg.sub, `🌥️ ${rg(g.shade)} ${t.cm}`, '#ffc850');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? tg.ok : tg.no, lead: tg.lead, body: '', extra: '' });
  }
}
startPod();
render();
</script>
