  const fx = 90, fy = by + 6; c.fillStyle = rad(c, fx, fy - 10, 0, 60, [[0, 'rgba(255,200,100,.35)'], [1, 'rgba(255,200,100,0)']]); c.fillRect(fx - 60, fy - 70, 120, 120);
  c.fillStyle = '#f4ecd6'; c.fillRect(fx - 5, fy, 10, 24); c.fillStyle = '#ffb020'; c.beginPath(); c.ellipse(fx, fy - 6 + Math.sin(time * 9) * 1, 4, 8, 0, 0, 7); c.fill();
  c.restore();
}

// --- main draw -------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec === 'cof') return drawCoffee(c, w, h, dt, time);
  if (S.sec === 'jos') return drawJoseph(c, w, h, dt, time);
  const v = lab.view;
  if (v === 'book') drawBook(c, w, h, dt, time); else if (v === 'think') drawThink(c, w, h, dt, time); else drawKing(c, w, h, dt, time);
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'think') return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.s, y = (ev.clientY - r.top - G.oy) / G.s;
  const ti = ORDER.findIndex((k, i) => Math.hypot(x - PX(i), y - PY) < PR + 14 || (Math.abs(x - PX(i)) < 42 && y > PY + PR && y < PY + PR + 42));
  const pi = PCARDS.findIndex((k, i) => x > 12 && x < 348 && y > CARD_Y(i) && y < CARD_Y(i) + 56);
  if (ti >= 0 && y < 122) { S.sel = S.sel === ORDER[ti] ? null : ORDER[ti]; sfx.click(); S.msg = null; tryPair(); }
  else if (pi >= 0 && !S.done[pi]) { S.selP = S.selP === pi ? null : pi; sfx.click(); S.msg = null; tryPair(); }
  render();
});
function tryPair() {
  if (S.sel === null || S.selP === null) return;
  const card = PCARDS[S.selP], tk = S.sel, pi = S.selP, tm = now();
  if (Object.values(S.done).includes(tk)) { S.sel = null; return; }
  if (tk === card) { S.done[pi] = tk; S.sceneK = tk; S.sceneAt = tm; S.msg = 'ok:' + tk; sfx.good(); }
  else if (card === 'ro' && tk === 'lo') { S.msg = 'part'; sfx.tick(); }
  else { S.msg = 'bad'; S.shakeP = pi; S.flash = pi; S.shakeAt = tm; sfx.bad(); }
  S.sel = null; S.selP = null;
}

// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function startRun(mode) {
  const bans = mode === 1 ? new Set() : mode === 2 ? new Set(['fr']) : new Set(S.my), m = sim(bans);
  S.mode = mode; S.cur = { ...m, mode, ser: series(m), parisBan: bans.has('fr') }; S.t = 0; S.running = true; S.fin = false;
  if (mode === 1) S.ref = S.cur.ser;
  sfx.click(); showStage(); render();
}
function finishRun() {
  if (S.cur.mode === 1) S.seen1 = true;
  if (S.cur.bans.has('fr') && S.verdict === null) S.verdict = S.pred === 'yes' ? 'right' : 'wrong';
  S.fin = true; (S.cur.bans.has('fr') && S.verdict === 'right' ? sfx.good : sfx.tick)(); render();
}
function bookReadout() {
  const t = T[lang].bk;
  if (S.pred === null || !S.cur) { lab.setReadout('?', t.sub, '', '#ffd479'); return; }
  const k = Math.min(Math.floor(Math.min(S.t, 20) / STEP), 80), v = S.cur.ser.tot[k];
  lab.setReadout(`${Math.round(v * 100)} %`, `${t.sub} ${S.t >= 20 ? t.subBy : t.subSo}`, `${1750 + Math.floor(S.t)}`, '#ffd479');
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, d = b.dataset;
  if (a === 'pred') { S.pred = d.v; sfx.click(); }
  else if (a === 'run') startRun(+d.m);
  else if (a === 'gate') { S.my.has(d.s) ? S.my.delete(d.s) : S.my.add(d.s); if (S.mode !== 3 || S.cur) { S.mode = 3; S.cur = null; S.t = -1; S.running = false; } sfx.tick(); }
  else if (a === 'mon') { S.mon = +d.i; S.k = 0; S.ans = []; S.ansAt = -9; sfx.click(); }
  else if (a === 'ans') { S.ans[S.k] = d.v === '1'; S.ansAt = now(); (S.ans[S.k] === RF[S.k] ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'next') { S.k++; sfx.click(); }
  else if (a === 'again') { S.mon = (S.mon + 1) % 3; S.k = 0; S.ans = []; S.ansAt = -9; sfx.click(); }
  else if (a === 'pay') {
    const cf = S.cf, tm = now(); cf.n++; cf.coins.push(tm); sfx.snap();
    const used = new Set(cf.ppl.map((p) => p.slot)); let slot = [0, 1, 2, 3, 4, 5, 6, 7].find((s) => !used.has(s));
    if (slot === undefined) { slot = cf.ppl.shift().slot; }
    cf.ppl.push({ slot, col: (cf.n * 3) % 8, at: tm, x: 350, y: 220 });
  } else if (a === 'jgo') { S.jo.at = now(); sfx.push(); }
  render();
});
$('secRow').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-k]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.k;
  if (S.sec === k) S.sec = null;
  else { S.sec = k; if (k === 'jos') S.jo.at = -1; if (k === 'cof' && !S.cf.ppl.length) { const tm = now(); S.cf.n = 1; S.cf.ppl.push({ slot: 0, col: 3, at: tm, x: 350, y: 200 }, { slot: 5, col: 1, at: tm + 0.2, x: 350, y: 270 }); } }
  sfx.click(); showStage(); render();
});

// --- render --------------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
  show('vBook', !sec && v === 'book'); show('vThink', !sec && v === 'think'); show('vKing', !sec && v === 'king'); show('vCof', sec === 'cof'); show('vJos', sec === 'jos');
  const open = secret.unlocked();
  $('secRow').innerHTML = [['cof', '☕'], ['jos', '🕯️']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-k="${k}" style="min-height:36px">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec === 'cof') renderCof(t); else if (sec === 'jos') renderJos(t);
  else if (v === 'book') renderBook(t); else if (v === 'think') renderThink(t); else renderKing(t);
}
function renderBook(t) {
  const b = t.bk, asking = S.pred === null;
  lab.setGlow('rgba(255, 212, 121, .24)');
  show2('bkAsk', asking); show2('bkRun', !asking);
  $('bkQ').textContent = b.q; $('bkYes').textContent = b.yes; $('bkNo').textContent = b.no;
  $('bkRuns').innerHTML = b.run.map((l, i) => `<button class="en-b ${S.mode === i + 1 ? 'on' : ''}" data-a="run" data-m="${i + 1}" ${S.running ? 'disabled' : ''}>${esc(l)}</button>`).join('');
  $('bkGl').textContent = b.gates;
  $('bkGates').innerHTML = STATES.map((s) => `<button class="en-b gt ${S.my.has(s) ? 'on' : ''}" data-a="gate" data-s="${s}" ${S.running ? 'disabled' : ''}>🚧 ${esc(b.st[s])}</button>`).join('');
  bookReadout();
  lab.setFacts(t.facts.book);
  let st;
  if (asking) st = { emo: '📖', title: b.preT, lead: b.preL, body: '', extra: `<div class="en-fine">${esc(t.fine)}</div>` };
  else if (!S.cur) st = { emo: '📖', title: b.preT, lead: b.preL, body: '', extra: '' };
  else if (!S.fin) st = { emo: '🚚', title: b.goT, lead: b.goL, body: '', extra: '' };
  else {
    const m = S.cur, base = sim(new Set());
    if (m.mode === 1 || !m.bans.size) { const mx = Math.max(...m.res.map((r) => r.A)); st = { emo: '💡', title: b.d1T, lead: b.d1L(Math.max(1, Math.round(mx))), body: '', extra: '' }; }
    else if (!m.press.length) st = { emo: '✍️', title: b.d0T, lead: b.d0L, body: '', extra: '' };
    else {
      let bi = 0, bd = -1; m.res.forEach((r, i) => { const d = r.A - base.res[i].A; if (d > bd) { bd = d; bi = i; } });
      const list = m.press.map((p) => b.city[p.c.id]).join(', ');
      st = { emo: '🚧', title: b.dbT, lead: b.dbL(list, b.city[CITY[bi].id], Math.max(1, Math.round(bd))), body: '', extra: '' };
    }
    if (m.bans.has('fr') && S.verdict) st = { emo: S.verdict === 'right' ? '✅' : '🤔', title: S.verdict === 'right' ? verdictWord() : b.wrongT, lead: S.verdict === 'right' ? b.rightL : b.wrongL, body: `${st.title}. ${st.lead}`, extra: '' };
  }
  lab.setState(st);
}
function renderThink(t) {
  const h = t.th, n = Object.keys(S.done).length;
  lab.setGlow('rgba(143, 127, 208, .26)');
  $('thHint').textContent = h.hint;
  lab.setReadout(`${n}/4`, h.sub, '', '#8f7fd0');
  lab.setFacts(t.facts.think);
  let st;
  const m = S.msg || '';
  if (n === 4 && m.startsWith('ok')) st = { emo: '🏆', title: h.endT, lead: h.endL, body: h.done[m.slice(3)], extra: '' };
  else if (m.startsWith('ok')) st = { emo: '✅', title: verdictWord(), lead: h.done[m.slice(3)], body: '', extra: '' };
  else if (m === 'part') st = { emo: '🤏', title: h.partT, lead: h.partL, body: '', extra: '' };
  else if (m === 'bad') st = { emo: '🤔', title: h.badT, lead: h.badL, body: '', extra: '' };
  else if (S.sel) st = { emo: '💬', title: h.list[S.sel][0] + ', ' + h.list[S.sel][1], lead: h.list[S.sel][2], body: '', extra: '' };
  else st = { emo: '🧠', title: t.views.think.replace(/^\S+\s/, ''), lead: h.hint, body: '', extra: '' };
  lab.setState(st);
}
function renderKing(t) {
  const g = t.kg, k = S.k, fin = k >= 6, a = S.ans[k];
  lab.setGlow('rgba(217, 169, 60, .26)');
  $('kgMon').innerHTML = g.mon.map((n, i) => `<button class="en-b ${S.mon === i ? 'on' : ''}" data-a="mon" data-i="${i}">${esc(n)}</button>`).join('');
  const right = S.ans.filter((x, i) => x === RF[i]).length;
  $('kgAct').innerHTML = fin ? `<button class="en-b go" data-a="again">${esc(g.again)}</button>`
    : a === undefined ? `<button class="en-b" data-a="ans" data-v="1">${esc(g.acc)}</button><button class="en-b" data-a="ans" data-v="0">${esc(g.ref)}</button>`
      : `<button class="en-b go" data-a="next">${esc(k === 5 ? g.pat : g.next)}</button>`;
  lab.setReadout(`${right}/6`, g.sub, '', '#d9a93c');
  lab.setFacts(t.facts.king);
  let st;
  if (fin) st = { emo: '👑', title: g.patT, lead: g.patL, body: `${g.patB} ${g.score(right)}`, extra: `<div class="en-fine">${esc(g.fine)}</div>` };
  else if (a === undefined) st = { emo: '🎩', title: g.monFull[S.mon], lead: g.monL[S.mon], body: `${g.phil}: ${k + 1}/6`, extra: '' };
  else { const ok = a === RF[k]; st = { emo: ok ? '✅' : '🤔', title: ok ? verdictWord() : g.no, lead: `${RF[k] ? g.accepted : g.refused}. ${g.R[k][2]}`, body: '', extra: '' }; }
  lab.setState(st);
}
function renderCof(t) {
  const c = t.cf; lab.setGlow('rgba(217, 130, 95, .26)'); $('cfPay').textContent = c.pay;
  lab.setReadout(S.cf.n, c.sub, '', '#d9825f'); lab.setFacts([]);
  lab.setState({ emo: '☕', title: S.cf.n * 2 >= 15 ? c.many : c.t, lead: c.l, body: '', extra: '' });
}
function renderJos(t) {
  const j = t.js; lab.setGlow('rgba(143, 127, 208, .26)'); const el = S.jo.at < 0 ? -1 : now() - S.jo.at, fin = el >= 4 * 0.9 + 0.8;
  $('jsGo').textContent = S.jo.at < 0 ? j.go : j.again;
  lab.setReadout(fin ? 3 : 7, j.sub, '', '#8f7fd0'); lab.setFacts([]);
  lab.setState(S.jo.at < 0 ? { emo: '🕯️', title: j.t0, lead: j.l0, body: '', extra: '' } : { emo: '📜', title: j.t1, lead: j.l1, body: '', extra: '' });
  if (S.jo.at >= 0 && !fin) setTimeout(() => { if (S.sec === 'jos') render(); }, (4 * 0.9 + 0.8 - el) * 1000 + 50);
}
render();
</script>
