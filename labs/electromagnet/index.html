}
function rB(t) {
  const B = S.b, k = t.sb, tipN = B.pol > 0;
  lab.setGlow('rgba(255, 110, 100, .2)');
  $('bOn').textContent = B.on ? t.swOff : t.swOn; $('bFlip').textContent = k.flip;
  lab.setReadout(B.on ? t.pole[tipN ? 'N' : 'S'] : '–', k.sub, B.on ? (tipN ? k.pulls : k.pushes) : t.off, tipN && B.on ? '#3ddc97' : '#ffb04c');
  lab.setState({ emo: '🔄', title: t.secrets.b[0], lead: !B.on ? k.off : tipN ? k.att : k.rep, body: '', extra: '' });
  lab.setFacts([]);
}

// --- the loop -------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  SC = Math.min(w / DW, h / DH);
  GEO.sc = SC; GEO.ox = (w - DW * SC) / 2; GEO.oy = (h - DH * SC) / 2;
  c.save(); c.translate(GEO.ox, GEO.oy); c.scale(SC, SC);
  const mode = curMode();
  if (mode === 'uses') drawCrane(c, dt, time);
  else if (mode === 'seca') drawOrsted(c, dt, time);
  else if (mode === 'secb') drawSwap(c, dt, time);
  else drawMain(c, dt, time, mode);
  c.restore();
});
render();
</script>
