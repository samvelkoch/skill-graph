      const x = V0.x + Math.sin(u * 22) * 3, a = Math.sin(u * Math.PI);
      drawToolBy(c, A.tool, x, A.tool === 'filter' ? 80 : 100, 0, a, 1.1, t);
    } else if (A.tool === 'sieve') { const q = poseSieve(u); drawSieve(c, q.x, q.y, q.rot, q.a); }
    else if (A.tool === 'magnet') { const q = poseMagnet(u); drawMagnet(c, q.x, q.y, q.rot, q.a); }
    else if (A.tool === 'filter') {
      const fa = Math.min(eio(u / .1), 1 - eio((u - .82) / .14));
      drawFunnel(c, FX, 130, fa, 1);
      if (u > .12 && u < .75) { // the pour from the lip of the beaker into the funnel
        c.save(); c.globalAlpha = Math.min(1, (u - .12) / .08) * (1 - eio((u - .62) / .13)) * .8; c.strokeStyle = 'rgba(140,200,240,.9)'; c.lineWidth = 4; c.lineCap = 'round';
        c.setLineDash([9, 6]); c.lineDashOffset = -t * 40; c.beginPath(); c.moveTo(V0.x + 49, 124); c.quadraticCurveTo(V0.x + 100, 100, FX - 8, 140); c.stroke(); c.restore();
      }
    } else { // evaporate: wisps of steam over the dish
      for (let i = 0; i < 6; i++) {
        const ph = (t * .45 + i * .17) % 1, on = eio((u - .22) / .1) * (1 - eio((u - .8) / .15));
        c.save(); c.globalAlpha = on * (1 - ph) * .5; c.strokeStyle = '#fff'; c.lineWidth = 3; c.lineCap = 'round';
        const sx = V0.x - 40 + i * 16, sy = V0.by - V0.lift - 34 - ph * 70; c.beginPath(); c.moveTo(sx, sy + 14); c.bezierCurveTo(sx - 8, sy + 6, sx + 8, sy - 4, sx, sy - 14); c.stroke(); c.restore();
      }
    }
  }
  drawKinds(true);
}
function drawPure(c, dt, t, K) {
  const i = Math.min(S.pi, 5), done = S.pi >= 6, rev = !done && S.pa[S.pi] !== undefined;
  S.lens += (((rev || done) ? 1 : 0) - S.lens) * Math.min(1, dt * 4);
  if (done) {
    pill(c, `${T[lang].pure.end(S.pa.filter((a, k) => a === PURE[k]).length)[0]}`, DW / 2, 150, K, '#fff', 17); return;
  }
  sampleObj(c, i, 78, 214, t, K);
  pill(c, T[lang].pure.names[i], 78, 236 + 22, K, '#fff');
  c.strokeStyle = 'rgba(190,205,255,.18)'; c.lineWidth = 1; c.setLineDash([4, 5]);
  c.beginPath(); c.moveTo(112, 190); c.lineTo(200, 114); c.moveTo(112, 220); c.lineTo(214, 196); c.stroke(); c.setLineDash([]);
  lens(c, i, 262, 150, 66, S.lens > .02 ? S.lens : 0, t, K);
  if (rev) pill(c, PURE[i] ? T[lang].pure.pureB : T[lang].pure.mixB, 262, 238, K, PURE[i] ? '#3ddc97' : '#f5c84c');
}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-tool], [data-wt]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (b.dataset.tool) { S.sec = null; useTool(b.dataset.tool); showStage(); return; }
  if (b.dataset.wt) { S.wsel = S.wsel === b.dataset.wt ? null : b.dataset.wt; S.wbad = -1; S.wmsg = null; sfx.tick(); }
  else if (act === 'reset') { resetPuzzle(); S.sec = null; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.secT = 0; sfx.click(); if (S.sec) showStage();
  } else if (act === 'replay') { S.secT = 0; sfx.click(); }
  else if (act === 'pa') { S.pa[S.pi] = b.dataset.a === '1'; (S.pa[S.pi] === PURE[S.pi] ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'pnext') { if (S.pi >= 6) { S.pi = 0; S.pa = []; } else S.pi++; S.lens = 0; sfx.click(); }
  render();
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.a) { S.pred = b.dataset.a; (S.pred === 'evap' ? sfx.good : sfx.bad)(); }
  else { S.started = true; sfx.click(); showStage(); }
  render();
});
whyEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-col]'); if (!b) return;
  const col = +b.dataset.col, t = T[lang].why;
  if (!S.wsel) { S.wmsg = t.pick; S.wbad = -1; sfx.bad(); }
  else if (COL[S.wsel] === col) { S.wm[S.wsel] = true; S.wmsg = t.right[S.wsel]; S.wbad = -1; S.wlast = S.wsel; S.wsel = null; sfx.good(); }
  else { S.wbad = col; S.wmsg = t.wrong[S.wsel]; sfx.bad(); }
  render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------
function render() {
  const t = T[lang], v = lab.view, asking = v === 'puzzle' && !S.started;
  document.body.dataset.v = asking ? 'ask' : v;
  $('secPuzzle').hidden = !(v === 'puzzle' && S.started);
  $('secWhy').hidden = v !== 'why'; $('secPure').hidden = v !== 'pure';
  askEl.hidden = !asking; whyEl.hidden = v !== 'why';
  if (v === 'puzzle') renderPuzzle(t, asking); else if (v === 'why') renderWhy(t); else renderPure(t);
}
function renderPuzzle(t, asking) {
  lab.setGlow('rgba(80, 150, 220, .26)');
  if (asking) {
    const p = S.pred;
    askEl.innerHTML = p === null
      ? `<div class="q">${esc(t.pred.q)}</div><div class="opts">${['filter', 'magnet', 'evap'].map((k) => `<button data-a="${k}">${TICON[k]} ${esc(t.pred.opts[k])}</button>`).join('')}</div>`
      : `<div class="verdict" style="color:${p === 'evap' ? 'var(--ok)' : 'var(--wip)'}">${esc(p === 'evap' ? t.pred.ok : t.pred.no)}</div>
         <div class="opts">${['filter', 'magnet', 'evap'].map((k) => `<button disabled class="${k === 'evap' ? 'good' : k === p ? 'bad' : ''}">${TICON[k]} ${esc(t.pred.opts[k])}</button>`).join('')}</div>
         <p>${esc(t.pred.why)}</p><button class="go">${esc(t.pred.go)} →</button>`;
    lab.setReadout('?', '', '', '#4ea8ff');
    lab.setState({ emo: '🤔', title: t.pred.q, lead: '', body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const n = score().size, busy = !!Z.anim, A = Z.anim;
  $('toolChips').innerHTML = TOOLS.map((k) => `<button class="chip sp-tool ${Z.used[k] ? 'done' : ''}" data-tool="${k}"${Z.used[k] || busy ? ' disabled' : ''}>${TICON[k]} ${esc(t.tools[k])}</button>`).join('');
  $('rstB').textContent = t.pz.reset; $('rstB').disabled = busy;
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('a', '🌈') + sc('b', '🧲') + (S.sec ? `<button class="chip" data-act="replay">${esc(t.sec.replay)}</button>` : '');
  lab.setReadout(`${n}/5`, t.pz.sub, t.pz.pill(Z.order.length), '#4ea8ff');
  lab.setFacts([{ emo: '🧂', text: t.facts.pz, src: FACT_SRC.pz }]);
  if (S.sec) { lab.setState({ emo: S.sec === 'a' ? '🌈' : '🧲', title: t.sec[S.sec][0], lead: t.sec[S.sec][1], body: '', extra: '' }); return; }
  if (busy) { lab.setState({ emo: TICON[A.tool], title: t.tools[A.tool], lead: '', body: '', extra: '' }); return; }
  if (Z.msg) {
    const done = Z.order.length >= 4 || n === 5;
    const base = { emo: TICON[Z.msg.tool], title: t.tools[Z.msg.tool], lead: msgText(), body: '', extra: '' };
    if (n === 5) lab.setState({ emo: '🏆', title: t.pz.all[0], lead: t.pz.all[1], body: msgText(), extra: '' });
    else if (done) lab.setState({ emo: '🤔', title: t.pz.part(n)[0], lead: t.pz.part(n)[1], body: msgText(), extra: '' });
    else lab.setState(base);
  } else lab.setState({ emo: '🧪', title: t.pz.start[0], lead: t.pz.start[1], body: '', extra: '' });
}
function renderWhy(t) {
  const w = t.why, m = S.wm, got = Object.keys(m).length;
  lab.setGlow('rgba(95, 168, 160, .24)');
  const rows = ['gravel', 'sand', 'iron', 'salt', 'water'];
  const cell = (r, col) => {
    let txt;
    if (col === 0) txt = w.size[r];
    else if (col === 1) txt = r === 'iron' ? '✓' : '✗';
    else if (col === 2) txt = r === 'salt' ? '✓' : r === 'water' ? '—' : '✗';
    else txt = r === 'water' ? '✓' : '✗';
    const hl = KEYROW[col] === r && Object.keys(m).some((k) => COL[k] === col);
    return `<td class="${hl ? 'hl' : ''}">${esc(txt)}</td>`;
  };
  whyEl.innerHTML = `<div class="ask">${esc(w.ask)}</div><table><thead><tr><th></th>${w.cols.map((cn, i) => {
    const mt = TOOLS.find((k) => m[k] && COL[k] === i);
    return `<th><button class="hb ${mt ? 'ok' : ''} ${S.wbad === i ? 'bad' : ''}" data-col="${i}"${mt ? ' disabled' : ''}>${esc(cn)}${mt ? ` ${TICON[mt]}` : ''}</button></th>`;
  }).join('')}</tr></thead><tbody>${rows.map((r) => `<tr><td class="nm">${esc(t.parts[r])}</td>${[0, 1, 2, 3].map((i) => cell(r, i)).join('')}</tr>`).join('')}</tbody></table>`;
  $('whyChips').innerHTML = TOOLS.map((k) => `<button class="chip sp-tool ${S.wsel === k ? 'on' : ''}" data-wt="${k}"${m[k] ? ' disabled' : ''}>${TICON[k]} ${esc(t.tools[k])}${m[k] ? ' ✓' : ''}</button>`).join('');
  lab.setReadout(`${got}/4`, w.sub, '', '#5fa8a0');
  lab.setFacts([{ emo: '🌈', text: t.facts.why, src: FACT_SRC.why }]);
  if (got === 4 && S.wbad < 0) lab.setState({ emo: '🏆', title: w.done[0], lead: S.wmsg || '', body: w.done[1], extra: '' });
  else if (S.wmsg) { const bad = S.wbad >= 0 || S.wmsg === w.pick; lab.setState({ emo: bad ? '🤔' : TICON[S.wlast], title: bad ? w.start[0] : t.tools[S.wlast], lead: S.wmsg, body: '', extra: '' }); }
  else lab.setState({ emo: '🔍', title: w.start[0], lead: w.start[1], body: '', extra: '' });
}
function renderPure(t) {
  const p = t.pure, i = S.pi, done = i >= 6, rev = !done && S.pa[i] !== undefined;
  lab.setGlow('rgba(150, 120, 220, .24)');
  const k = S.pa.filter((a, n) => a === PURE[n]).length;
  lab.setReadout(`${k}/6`, p.sub, done ? '' : p.which(i + 1), '#a78bfa');
  $('pureBtns').innerHTML = done ? `<button class="sp-big main" data-act="pnext">${esc(p.again)}</button>`
    : rev ? `<button class="sp-big main" data-act="pnext">${esc(i === 5 ? p.end(k)[0] : p.next)}</button>`
    : `<button class="sp-big main" data-act="pa" data-a="1">${esc(p.pureB)}</button><button class="sp-big main" data-act="pa" data-a="0">${esc(p.mixB)}</button>`;
  const gold = S.pa[4] !== undefined;
  lab.setFacts(gold || done ? [{ emo: '💍', text: t.facts.pure, src: FACT_SRC.pure }] : []);
  if (done) lab.setState({ emo: '🏆', title: p.end(k)[0], lead: p.end(k)[1], body: '', extra: '' });
  else if (rev) { const ok = S.pa[i] === PURE[i]; lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.pred.ok : t.pred.no, lead: `${p.names[i]}: ${PURE[i] ? p.pureB : p.mixB}. ${p.expl[i]}`, body: p.base, extra: '' }); }
  else lab.setState({ emo: '🔍', title: p.q, lead: p.names[i], body: '', extra: '' });
}
render();
</script>
