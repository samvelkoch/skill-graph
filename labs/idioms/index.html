  if (K.pred === null || K.i >= 6 || nowS() < K.entT + .2) return;
  const idx = K.order[K.i];
  if (KIND[idx] === ch) { const t0 = nowS(); K.placed.push({ idx, t: t0 }); K.i++; K.entT = t0 + .75; K.msg = false; K.last = idx; sfx.good(); }
  else { K.wrongT = nowS(); K.msg = true; sfx.bad(); }
  render();
}
function kindsAgain() { K.order = K.order === KORDER ? KORDER2 : KORDER; K.i = 0; K.placed = []; K.entT = nowS() + .05; K.msg = false; K.last = null; sfx.click(); render(); }
function matchAgain() { S.matched = {}; S.mp = S.mm = null; S.mMsg = false; sfx.click(); render(); }

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'sec') {
    const k = b.dataset.k; if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click(); render(); return;
  }
  if (a === 'pick') pickMeaning(b.dataset.id);
  else if (a === 'next') nextPhrase();
  else if (a === 'mm') matchPick('m', b.dataset.k);
  else if (a === 'mag') matchAgain();
  else if (a === 'kpred') kindPred(b.dataset.id);
  else if (a === 'ksort') sortTo(b.dataset.id);
  else if (a === 'kag') kindsAgain();
});

// --- one render per change: controls, readout and the state card ------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = S.sec || v;
  const sc = (key, emo, n) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-act="sec" data-k="${key}">${open ? `${emo} ${esc(t.secrets[n][0])}` : '🔒 ???'}</button>`;
  $('idSec').innerHTML = `<div class="chips">${sc('rain', '🌧️', 'a')}${sc('ice', '🧊', 'b')}</div>`;
  $('idMain').style.display = S.sec ? 'none' : '';
  if (S.sec) renderSecret(t); else if (v === 'literal') renderLiteral(t); else if (v === 'meaning') renderMatch(t); else renderKinds(t);
}
function renderSecret(t) {
  const rain = S.sec === 'rain', n = rain ? 'a' : 'b';
  lab.setGlow(rain ? 'rgba(110, 150, 230, .3)' : 'rgba(127, 224, 255, .26)');
  lab.setReadout(rain ? '🌧️' : '🧊', t.secrets[n][0], '', rain ? '#6e9be6' : '#7fe0ff');
  lab.setState({ emo: rain ? '🌧️' : '🧊', title: t.secrets[n][0], lead: t.secrets[n][1], body: (rain ? t.facts.meaning : t.facts.literal)[0].text, extra: '' });
  lab.setFacts([]);
}
const verdict = (cls, txt) => `<div class="id-verdict ${cls}">${esc(txt)}</div>`;
function renderLiteral(t) {
  const key = KEYS[S.li], st = L[key], n = KEYS.filter((k) => L[k].done).length, s = t.st.literal;
  lab.setGlow('rgba(242, 183, 5, .22)');
  lab.setReadout(t.count(n), '', t.notEqual, '#f2b705');
  const txt = { r: t.meanings[key], l: t.wrongLiteral[key], o: t.wrongOther[key] };
  const opts = ORDER3[key].map((id) => {
    let cls = 'id-opt', dis = '';
    if (st.done) { cls += id === 'r' ? ' ok' : st.wrong.includes(id) ? ' no' : ' dim'; dis = ' disabled'; }
    else if (st.wrong.includes(id)) { cls += ' no'; dis = ' disabled'; }
    return `<button class="${cls}" data-act="pick" data-id="${id}"${dis}>${esc(cap(txt[id]))}</button>`;
  }).join('');
  const vd = st.done ? verdict('ok', st.shown ? t.litShown : t.litRight) : st.wrong.length ? verdict('no', t.litWrong) : '';
  $('idMain').innerHTML = `<div class="id-q">${esc(t.litAsk)}</div><div class="id-chips">${opts}</div>${vd}`
    + (n === 6 && st.done ? verdict('ok', t.allDone) : '') + (st.done ? `<div class="id-act"><button class="btn" data-act="next">${esc(t.nextPhrase)} →</button></div>` : '');
  lab.setState(n > 0 ? { emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' } : { emo: s[0], title: s[1], lead: t.stWait.literal[0], body: t.stWait.literal[1], extra: '' });
  lab.setFacts(t.facts.literal);
}
function renderMatch(t) {
  const n = Object.keys(S.matched).length, s = t.st.meaning;
  lab.setGlow('rgba(121, 194, 255, .22)');
  lab.setReadout(t.pairs(n), '', n === 6 ? t.allPairs : '', '#79c2ff');
  const chips = MEAN_ORDER.map((k) => {
    const done = S.matched[k], bad = S.bad && S.bad.m === k, on = S.mm === k;
    return `<button class="id-opt ${done ? 'ok' : bad ? 'no' : on ? 'on' : ''}" data-act="mm" data-k="${k}"${done ? ' disabled' : ''}>${done ? `<i class="id-dot" style="background:${PAIRCOL[k]}"></i>` : ''}${esc(cap(t.meanings[k]))}</button>`;
  }).join('');
  $('idMain').innerHTML = `<div class="id-q">${esc(t.matchAsk)}</div><div class="id-two">${chips}</div>`
    + (S.mMsg ? verdict('no', t.matchWrong) : n === 6 ? verdict('ok', t.allPairs) : '') + (n === 6 ? `<div class="id-act"><button class="btn" data-act="mag">↻ ${esc(t.again)}</button></div>` : '');
  lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' });
  lab.setFacts(t.facts.meaning);
}
function renderKinds(t) {
  const s = t.st.kinds, waiting = K.pred === null, right = K.right;
  lab.setGlow('rgba(224, 106, 85, .22)');
  const clueTxt = K.last === null ? '' : KIND[K.last] === 's' ? t.clue(t.clueWord) : t.noClue;
  lab.setReadout(t.count(K.placed.length), '', clueTxt, '#e0a050');
  // the prediction chips: the right one is not always first
  let h = `<div class="id-q">${esc(t.kindsAsk)}</div><div class="id-two">`
    + [['m', t.kindsOpts[1]], ['s', t.kindsOpts[0]]].map(([id, lbl]) => {
      let cls = 'id-opt', dis = '';
      if (!waiting) { dis = ' disabled'; cls += id === right ? ' ok' : id === K.pred ? ' no' : ' dim'; }
      return `<button class="${cls}" data-act="kpred" data-id="${id}"${dis}>${esc(cap(lbl))}</button>`;
    }).join('') + '</div>';
  if (!waiting) h += verdict(K.pred === right ? 'ok' : 'no', K.pred === right ? t.kindsRight : t.kindsWrong);
  if (!waiting && K.i < 6) {
    h += `<div class="id-q id-gap">${esc(t.sortAsk)}</div><div class="id-two"><button class="id-opt id-bk s" data-act="ksort" data-id="s">${esc(t.simile)}</button><button class="id-opt id-bk m" data-act="ksort" data-id="m">${esc(t.metaphor)}</button></div>`;
    if (K.msg) h += verdict('no', t.kindsWrong);
  }
  if (K.i >= 6) h += `<div class="id-act"><button class="btn" data-act="kag">↻ ${esc(t.again)}</button></div>`;
  $('idMain').innerHTML = h;
  lab.setState(waiting ? { emo: s[0], title: s[1], lead: t.stWait.kinds[0], body: t.stWait.kinds[1], extra: '' } : { emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' });
  lab.setFacts(t.facts.kinds);
}
render();
</script>
