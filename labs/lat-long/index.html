  } else if (!drag && Math.abs(V.vlon) + Math.abs(V.vlat) > 1) {

    const f = Math.exp(-3.2 * dt); V.vlon *= f; V.vlat *= f;
  }
  if (Sn.anim) {
    const K = Sn.anim.keys, el = t - Sn.anim.t0;
    if (el >= K[K.length - 1][0]) { Sn.th = K[K.length - 1][1]; Sn.anim = null; render(); }
    else if (el > 0) { for (let i = 0; i < K.length - 1; i++) if (el <= K[i + 1][0]) { Sn.th = lerp(K[i][1], K[i + 1][1], easeIO((el - K[i][0]) / (K[i + 1][0] - K[i][0]))); break; } }
  } else if (Sn.play) { Sn.th += dt * 24; if (Sn.th - TH0 > 320) Sn.th -= 360; }
}
function syncSun() { // slider, degree label and readout follow the turning Earth
  const d = Math.round(((Sn.th - TH0 + 40) % 360 + 360) % 360 - 40), lonC = CITY[Sn.city][1], known = Sn.city === 'bud' || Sn.ans !== null;
  const tm = known ? hhmm(sunHours(lonC)) : '?', key = `${lang}|${d}|${Sn.city}|${Sn.ans}|${tm}`;
  if (+$('snRange').value !== d) $('snRange').value = d;
  if (key === Sn.key) return;
  Sn.key = key;
  $('snDeg').textContent = T[lang].turned(d);
  lab.setReadout(tm, T[lang].cities[Sn.city], T[lang].rule15, '#ffb82e');
}

// --- interaction -------------------------------------------------------------------------------------------
function turnTo(lat, lon, dur = 1.1) {
  V.vlon = V.vlat = 0;
  V.tw = { t0: nowS(), dur, from: [V.lon, V.lat], dl: (((lon - V.lon + 540) % 360) + 360) % 360 - 180, to: [lon, lat] };
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const editablePin = () => (S.sec ? null : lab.view === 'lines' ? L.pin : lab.view === 'find' && !F.checked && F.i < 5 ? F.pin : null);
function enterView() {
  S.sec = null; Sn.play = false; drag = null;
  if (lab.view === 'find' && !F.moved && !F.checked && F.i < 5) { F.pin.lat = HOME.lat; F.pin.lon = HOME.lon; F.pin.t0 = nowS() + 0.5; turnTo(HOME.lat, HOME.lon, 0.9); }
  render();
}
const cv = $('cv');
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec === 'er' || (lab.view === 'sun' && !S.sec)) return;
  const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top, g = lay(r.width, r.height), pin = editablePin();
  setView(V.lon, V.lat); V.tw = null; V.vlon = V.vlat = 0;
  let mode = 'rot', off = [0, 0];
  if (pin && pin.show) {
    const s = pinPos(pin, g);
    if (s && (Math.hypot(px - s.x, py - (s.y - 28)) < 26 || Math.hypot(px - s.x, py - s.y) < 18)) { mode = 'pin'; off = [s.x - px, s.y - py]; }
  }
  drag = { id: ev.pointerId, mode, off, x: px, y: py, moved: 0, t: performance.now(), lt: ev.timeStamp };
  try { cv.setPointerCapture(ev.pointerId); } catch { /* no capture */ }
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag || drag.id !== ev.pointerId) return;
  const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top, g = lay(r.width, r.height);
  const dx = px - drag.x, dy = py - drag.y; drag.x = px; drag.y = py; drag.moved += Math.abs(dx) + Math.abs(dy);
  setView(V.lon, V.lat);
  if (drag.mode === 'pin') {
    const ll = unproj(px + drag.off[0], py + drag.off[1], g, true), pin = editablePin();
    if (ll && pin) { pin.lat = ll[0]; pin.lon = ll[1]; pin.t0 = -9; F.moved = true; if (lab.view === 'lines') readoutLines(); }
  } else if (drag.moved > 6) {
    const k = DEG / g.R, dt = Math.max(0.008, (ev.timeStamp - drag.lt) / 1000); drag.lt = ev.timeStamp;
    V.lon -= dx * k; V.lat = clamp(V.lat + dy * k, -90, 90);
    V.vlon = V.vlon * 0.5 - (dx * k / dt) * 0.5; V.vlat = V.vlat * 0.5 + (dy * k / dt) * 0.5;
  }
});
const endDrag = (ev) => {
  if (!drag || drag.id !== ev.pointerId) return;
  const d = drag; drag = null;
  if (d.mode === 'rot') {
    if (d.moved < 8 && performance.now() - d.t < 600) { // a tap: drop the pin here
      const r = cv.getBoundingClientRect(), g = lay(r.width, r.height), pin = editablePin();
      setView(V.lon, V.lat);
      const ll = pin ? unproj(d.x, d.y, g, false) : null;
      if (ll) { pin.lat = ll[0]; pin.lon = ll[1]; pin.show = true; pin.t0 = nowS(); F.moved = true; sfx.click(); render(); }
      V.vlon = V.vlat = 0;
    } else if (ev.type === 'pointercancel') { V.vlon = V.vlat = 0; }
  } else { sfx.tick(); render(); }
};
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'mode') { L.mode = L.mode === b.dataset.k ? null : b.dataset.k; sfx.tick(); }
  else if (act === 'zero' && L.step === 0) {
    L.zeroAns = i; L.step = 1; (i === 1 ? sfx.good : sfx.bad)();
    turnTo(5, 0, 1.2); Object.assign(L.pin, { lat: 0, lon: 0, show: true, t0: nowS() + 1.3 }); showStage();
  } else if (act === 'lnext') { L.step = 2; sfx.click(); }
  else if (act === 'meet' && L.step === 2) {
    L.meetAns = i; L.step = 3; L.mode = 'mer'; (i === 1 ? sfx.good : sfx.bad)(); turnTo(90, V.lon, 1.4); showStage();
  } else if (act === 'lagain') { L.step = 0; L.zeroAns = null; L.meetAns = null; L.mode = null; L.pin.show = false; sfx.click(); turnTo(25, 15, 1); }
  else if (act === 'fmain') findMain();
  else if (act === 'sunq' && Sn.ans === null) {
    Sn.ans = i; Sn.city = 'mos'; (i === 2 ? sfx.good : sfx.bad)();
    Sn.anim = { t0: nowS(), keys: [[0, TH0], [1.5, -CITY.mos[1]], [2.4, -CITY.mos[1]], [4, TH0]] }; showStage();
  } else if (act === 'city') { if (Sn.ans === null && b.dataset.k !== 'bud') return; Sn.city = b.dataset.k; sfx.tick(); }
  else if (act === 'play') { if (Sn.ans === null) return; Sn.anim = null; Sn.play = !Sn.play; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; Sn.play = false; sfx.click();
    if (S.sec === 'gw') turnTo(30, 0, 1.1);
  }
  render();
});
$('snRange').addEventListener('input', (ev) => { Sn.th = TH0 + +ev.target.value; Sn.anim = null; Sn.play = false; Sn.key = ''; render(); });
$('erRange').addEventListener('input', (ev) => { S.er = +ev.target.value; render(); });
function findMain() {
  if (F.i >= 5) { F.i = 0; F.res = []; F.checked = false; F.moved = false; sfx.click(); resetPin(); return; }
  if (!F.checked) {
    const k = ROUNDS[F.i], km = Math.round(dist([F.pin.lat, F.pin.lon], CITY[k])), st = km <= 500 ? 3 : km <= 1500 ? 2 : 1;
    F.res[F.i] = { km, st }; F.checked = true; (st === 3 ? sfx.good : st === 2 ? sfx.snap : sfx.bad)();
    const m = toVec(F.pin.lat, F.pin.lon), q = toVec(CITY[k][0], CITY[k][1]), s = [m[0] + q[0], m[1] + q[1], m[2] + q[2]], l = Math.hypot(...s);
    if (l > 0.05) turnTo(Math.asin(s[1] / l) * DEG, Math.atan2(s[0], s[2]) * DEG, 1.0); else turnTo(CITY[k][0], CITY[k][1], 1.0);
    showStage();
  } else { F.i++; F.checked = false; F.moved = false; sfx.click(); if (F.i < 5) resetPin(); }
}
function resetPin() { Object.assign(F.pin, { lat: HOME.lat, lon: HOME.lon, show: true, t0: nowS() + 0.7 }); turnTo(HOME.lat, HOME.lon, 0.9); }

// --- one render per change: controls, readout and the state card --------------------------------------------------
const optsHtml = (list, act, ok, ans) => `<div class="ll-opts">${list.map((o, i) => `<button class="ll-opt${ans === null ? '' : i === ok ? ' good' : i === ans ? ' miss' : ' dim'}" data-act="${act}" data-i="${i}"${ans === null ? '' : ' disabled'}>${esc(o)}</button>`).join('')}</div>`;
const verdictHtml = (t, okFlag, ex) => `<div class="ll-verdict" style="color:${okFlag ? 'var(--ok)' : 'var(--wip)'}">${esc(okFlag ? t.right : t.notQuite)}</div><p class="ll-ex">${esc(ex)}</p>`;
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec === 'er' ? 'erato' : v;
  $('secLines').style.display = !sec && v === 'lines' ? '' : 'none';
  $('secFind').style.display = !sec && v === 'find' ? '' : 'none';
  $('secSun').style.display = !sec && v === 'sun' ? '' : 'none';
  $('secEr').style.display = sec === 'er' ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo, nm) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(nm)}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('gw', '🧭', t.secrets.greenwich[0]) + sc('er', '📏', t.secrets.eratos[0]);
  const showF = !sec && v === 'find' && F.i < 5;
  fcard.style.display = showF ? '' : 'none';
  if (showF) { const [la, lo] = CITY[ROUNDS[F.i]]; fcard.innerHTML = `<div class="r">${esc(t.round(F.i + 1))}</div><div class="q">${esc(t.findCard(t.fl(la), t.fo(lo)))}</div>`; }
  if (sec === 'gw') renderGw(t); else if (sec === 'er') renderEr(t);
  else if (v === 'lines') renderLines(t); else if (v === 'find') renderFind(t); else renderSun(t);
  lab.setFacts(t.facts[v] || []);
}
function readoutLines() {
  const t = T[lang], p = L.pin;
  lab.setReadout(p.show ? `<span class="ll-co">${esc(t.coord(p.lat, p.lon))}</span>` : '?', t.latLon, p.show ? t.hemi(t.ns[p.lat >= 0 ? 0 : 1], t.ew[p.lon >= 0 ? 0 : 1]) : '', '#4ea8ff');
}
function renderLines(t) {
  lab.setGlow('rgba(78, 168, 255, .3)');
  const s = L.step;
  $('lnQ').innerHTML = s === 0 ? `<div class="ll-q">${esc(t.zeroQ)}</div>${optsHtml(t.zeroOpts, 'zero', 1, null)}`
    : s === 1 ? `<div class="ll-q">${esc(t.zeroQ)}</div>${optsHtml(t.zeroOpts, 'zero', 1, L.zeroAns)}${verdictHtml(t, L.zeroAns === 1, t.exZero)}<button class="btn" data-act="lnext">${esc(t.next)}</button>`
    : s === 2 ? `<div class="ll-q">${esc(t.meetQ)}</div>${optsHtml(t.meetOpts, 'meet', 1, null)}`
    : `<div class="ll-q">${esc(t.meetQ)}</div>${optsHtml(t.meetOpts, 'meet', 1, L.meetAns)}${verdictHtml(t, L.meetAns === 1, t.exMeet)}<button class="btn ghost" data-act="lagain">${esc(t.again)}</button>`;
  $('lnChips').innerHTML = ['par', 'mer'].map((k) => `<button class="chip ${L.mode === k ? 'on' : ''}" data-act="mode" data-k="${k}">${esc(k === 'par' ? t.parallels : t.meridians)}</button>`).join('');
  $('lnHint').textContent = t.tapHint;
  readoutLines();
  const [ti, le] = s === 3 ? t.state.linesDone : t.state.lines0;
  lab.setState({ emo: '🌐', title: ti, lead: le, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
}
function renderFind(t) {
  const i = F.i, end = i >= 5, total = F.res.reduce((a, r) => a + r.st, 0);
  $('fMain').textContent = end ? t.again : F.checked ? t.next : t.here;
  $('fRes').innerHTML = F.res.length ? `<div class="ll-res">${F.res.map((r, k) => `<div><b>${esc(t.cities[ROUNDS[k]])}</b> · ${'⭐'.repeat(r.st)} · ${esc(t.km(r.km))}</div>`).join('')}</div>` : '';
  lab.setGlow('rgba(229, 72, 77, .28)');
  lab.setReadout(`⭐ ${total}`, t.stars, t.round(Math.min(i + 1, 5)), '#e5484d');
  if (end) { const [ti, le] = t.state.findDone; lab.setState({ emo: '🏆', title: `${'⭐'.repeat(Math.min(3, Math.round(total / 5)))} ${total} / 15`.trim(), lead: ti, body: le, extra: `<div class="fine">${esc(t.fine)}</div>` }); }
  else if (F.checked) { const r = F.res[i]; lab.setState({ emo: '📍', title: `${t.cities[ROUNDS[i]]}: ${t.km(r.km)}`, lead: '⭐'.repeat(r.st), body: '', extra: `<div class="fine">${esc(t.fine)}</div>` }); }
  else { const [ti, le] = t.state.find0; lab.setState({ emo: '📍', title: ti, lead: le, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` }); }
}
function renderSun(t) {
  lab.setGlow('rgba(255, 184, 46, .3)');
  const a = Sn.ans;
  $('snQ').innerHTML = a === null ? `<div class="ll-q">${esc(t.sunQ)}</div>${optsHtml(t.sunOpts, 'sunq', 2, null)}`
    : `<div class="ll-q">${esc(t.sunQ)}</div>${optsHtml(t.sunOpts, 'sunq', 2, a)}${verdictHtml(t, a === 2, t.exSun)}`;
  $('snCtl').style.display = a === null ? 'none' : '';
  $('snCities').innerHTML = SUNC.map((k) => `<button class="chip ll-chip ${Sn.city === k ? 'on' : ''}" data-act="city" data-k="${k}"${a === null && k !== 'bud' ? ' disabled' : ''}><span class="ll-dot" style="background:${CCOL[k]}"></span>${esc(t.cities[k])}</button>`).join('');
  $('snPlay').textContent = Sn.play ? t.pause : t.play;
  $('snPlay').disabled = !!Sn.anim;
  $('snRange').disabled = false; $('snRange').setAttribute('aria-label', t.views.sun);
  Sn.key = ''; syncSun();
  const [ti, le] = a === null ? t.state.sun0 : t.state.sunDone;
  lab.setState({ emo: '☀️', title: ti, lead: le, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
}
function renderGw(t) {
  lab.setGlow('rgba(78, 168, 255, .3)');
  lab.setReadout('0°', t.greenwich, t.latLon.split(', ')[1], '#4ea8ff');
  lab.setState({ emo: '🧭', title: t.secrets.greenwich[0], lead: t.secretA, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
}
function renderEr(t) {
  lab.setGlow('rgba(255, 210, 77, .3)');
  const a = ANGLES[S.er], n = Math.round(360 / a);
  $('erLbl').textContent = t.angle; $('erVal').textContent = `${dec(a)}°`; $('erRange').value = S.er; $('erRange').setAttribute('aria-label', t.angle);
  lab.setReadout(`× ${n}`, `${t.angle} ${dec(a)}°`, `360° ÷ ${dec(a)}°`, '#ffd24d');
  lab.setState({ emo: '📏', title: t.secrets.eratos[0], lead: t.secretB, body: t.eraLine(dec(a), n), extra: `<div class="fine">${esc(t.fine)}</div>` });
}
render();
canvasLoop($('cv'), (c, w, h, dt, t) => {
  CW = w; CH = h;
  stepAnims(dt, t);
  if (S.sec === 'er') drawEratos(c, w, h);
  else if (S.sec === 'gw' || lab.view !== 'sun') drawGlobeView(c, w, h, t);
  else { drawSun(c, w, h, t); syncSun(); }
});
</script>
