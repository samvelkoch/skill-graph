  lab.setGlow('rgba(76, 195, 138, .24)');
  $('a3').innerHTML = pre ? `<p class="sb-q">${esc(p.q)}</p><div class="chips">${optBtns('p3', p.opts, null, p.ok)}</div>` : ''; $('a3').hidden = !pre; $('b3').hidden = pre;
  if (pre) { lab.setReadout('?', '', '', '#4cc38a'); lab.setFacts([]); lab.setState({ emo: '🏝️', title: p.q, lead: p.pre, body: '', extra: '' }); return; }
  $('segB').innerHTML = ['map', 'beaks'].map((m, i) => `<button data-act="seg3" data-m="${m}" class="${S.part3 === m ? 'on' : ''}">${esc(p.seg[i])}</button>`).join('');
  const beaks = S.part3 === 'beaks', done = S.bk.done.filter(Boolean).length, tk = p.task;
  $('beakCtl').hidden = !beaks;
  $('beakChips').innerHTML = [0, 1, 2].map((i) => `<button class="chip sb-tap${S.bk.sel === i ? ' on' : ''}${S.bk.done[i] ? ' sb-done' : ''}" data-act="beak" data-i="${i}"${S.bk.done[i] ? ' disabled' : ''}>${i + 1}</button>`).join('');
  $('foodChips').innerHTML = tk.foods.map((n, i) => `<button class="chip sb-tap" data-act="food" data-i="${i}">${FOOD_EMO[i]} ${esc(n)}</button>`).join('');
  const f = [...t.facts.birds]; if (done === 3) f.push(t.facts.beakDone); lab.setFacts(f);
  if (!beaks) {
    lab.setReadout(p.val, p.sub, '', '#4cc38a');
    lab.setState({ emo: S.p3 === p.ok ? '✅' : '🤔', title: `${S.p3 === p.ok ? t.right : t.notq}`, lead: p.lead, body: '', extra: '' }); return;
  }
  lab.setReadout(`${done}/3`, tk.unit, done === 3 ? '✓' : '', '#4cc38a');
  let st;
  if (done === 3) st = { emo: '🌵', title: tk.done[0], lead: tk.done[1], body: '', extra: '' };
  else if (S.bkMsg && S.bkMsg.pick) st = { emo: '👆', title: tk.pick, lead: tk.lead, body: '', extra: '' };
  else if (S.bkMsg && S.bkMsg.ok) st = { emo: '✅', title: t.right, lead: tk.rights[S.bkMsg.i], body: '', extra: '' };
  else if (S.bkMsg && S.bkMsg.ok === false) st = { emo: '🤔', title: tk.bad, lead: tk.badLead, body: '', extra: '' };
  else st = { emo: '🐦', title: tk.title, lead: tk.lead, body: '', extra: '' };
  lab.setState(st);
}
render();
</script>
</body>
</html>
