  c.moveTo(pts[0][0], pts[0][1]);
  if (pts.length < 3) { for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); return; }

}

  const n = pts.length, m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s = m(pts[n - 1], pts[0]);
  c.moveTo(s[0], s[1]);

}

  const words = String(text).split(' '), lines = []; let cur = '';

    if (ticked && !S.checked) { c.strokeStyle = '#d6322b'; c.lineWidth = 2.4; c.lineCap = 'round'; [0, 1].forEach((k) => { c.beginPath(); c.ellipse(cx + k * .8, y + ch * .52 + k * .6, cw * .43, ch * .4, tilt * 2 + k * .05, 0, TAU * .96); c.stroke(); }); }
    if (S.checked) {
      const e = ease((time - S.checkAt - i * .2) / .3), end = ENDED[i];
      if (end) { c.fillStyle = `rgba(60,40,20,${.14 * e})`; c.beginPath(); c.roundRect(x, y, cw, ch, 6); c.fill(); }
      if (e > 0) {
        const txt = end ? L.ended : L.stayed, col2 = end ? '#c23b2f' : '#2d6f94';
        let fs = 15; c.font = `900 ${fs}px Nunito, sans-serif`; const tw = c.measureText(txt).width; if (tw > cw - 20) { fs = Math.max(11, fs * (cw - 20) / tw); c.font = `900 ${fs}px Nunito, sans-serif`; }
        const sw = c.measureText(txt).width + 12;
        c.save(); c.translate(cx, y + ch * .52); c.rotate(-.24); c.scale(1 + .3 * (1 - e), 1 + .3 * (1 - e)); c.globalAlpha = .94 * e;
        c.strokeStyle = col2; c.fillStyle = col2; c.lineWidth = 2.6; c.beginPath(); c.roundRect(-sw / 2, -13, sw, 26, 5); c.stroke(); c.lineWidth = 1; c.beginPath(); c.roundRect(-sw / 2 + 3, -10, sw - 6, 20, 3); c.stroke();
        c.fillText(txt, 0, 1); c.restore();
        const ok = S.tick[i] === end;
        c.save(); c.globalAlpha = e; c.fillStyle = ok ? '#3ddc97' : '#f5a623'; c.beginPath(); c.arc(x + cw - 12, y + 13, 10, 0, TAU); c.fill(); c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1; c.stroke();
        c.fillStyle = '#1b2230'; c.font = '900 13px Nunito, sans-serif'; c.fillText(ok ? '✓' : '✗', x + cw - 12, y + 13.5); c.restore();
      }
    }
    c.restore();
  }
}

// --- one canvas loop for the three views -------------------------------------------------------------------------------
function pill(c, text, cx, cy, sign) {
  c.font = `800 ${sign ? 13 : 12.5}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + 16, x = clamp(cx - tw / 2, 4, Math.max(4, G.w - tw - 4)), y = clamp(cy - 11, 4, Math.max(4, G.h - 26));
  c.fillStyle = sign ? 'rgba(43,33,24,.92)' : 'rgba(12,14,24,.82)'; c.beginPath(); c.roundRect(x, y, tw, 22, 11); c.fill();
  if (sign) { c.strokeStyle = '#e0b34c'; c.lineWidth = 1.2; c.stroke(); }
  c.fillStyle = sign ? '#ffd96a' : '#fff'; c.fillText(text, x + tw / 2, y + 11.5);
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  if (v === 'law') { drawLaw(c, w, h, dt, time); return; }
  G.w = w; G.h = h; G.sc = Math.min(w / DW, h / DH); G.ox = (w - DW * G.sc) / 2; G.oy = (h - DH * G.sc) / 2;
  LABELS = [];
  c.save(); c.translate(G.ox, G.oy); c.scale(G.sc, G.sc);
  if (v === 'cross') drawCross(c, dt, time); else drawToll(c, dt, time);
  c.restore();
  LABELS.forEach((l) => pill(c, l.text, G.ox + l.x * G.sc, G.oy + l.y * G.sc, l.sign));
});

// --- controls ------------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function resetSec() { S.sec = null; }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-p1],[data-p2],[data-act],[data-rule]'); if (!b || b.disabled) return;
  if (b.dataset.p1 !== undefined) { // predict, view 1: the reveal is winter on the river
    S.p1 = +b.dataset.p1; S.season = 2; $('season').value = '2'; (S.p1 === T[lang].c.ok ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (b.dataset.p2 !== undefined) { // predict, view 2: the reveal is the gate itself
    S.p2 = +b.dataset.p2; (S.p2 === T[lang].o.ok ? sfx.good : sfx.bad)(); startToll('chain'); render(); showStage(); return;
  }
  if (b.dataset.rule !== undefined) { if (!S.checked) { const i = +b.dataset.rule; S.tick[i] = !S.tick[i]; sfx.click(); render(); } return; }
  const act = b.dataset.act;
  if (act === 'build') { resetSec(); S.build = S.build >= 3 ? 0 : S.build + 1; sfx.snap(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (k === 'eng') { if (S.sec === 'eng') S.sec = null; else { S.sec = 'eng'; S.season = 0; $('season').value = '0'; S.build = 3; } }
    else if (S.sec === 'years') S.yr = (S.yr + 1) % 3;
    else { S.sec = 'years'; S.yr = 0; S.season = 0; $('season').value = '0'; S.build = 3; }
    sfx.click();
  }
  else if (act === 'mode') startToll(b.dataset.m);
  else if (act === 'again') startToll(S.mode);
  else if (act === 'check') {
    if (S.checked) { S.tick = S.tick.map(() => false); S.checked = false; sfx.click(); }
    else if (S.tick.some(Boolean)) { S.checked = true; S.checkAt = performance.now() / 1000; (S.tick.every((x, i) => x === ENDED[i]) ? sfx.good : sfx.bad)(); showStage(); }
  }
  render();
});
$('season').addEventListener('input', () => { S.season = +$('season').value; resetSec(); sfx.tick(); render(); });
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'law' || S.checked) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const i = LAW_GEO.findIndex((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
  if (i < 0) return;
  S.tick[i] = !S.tick[i]; sfx.click(); render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('sCross').hidden = v !== 'cross'; $('sToll').hidden = v !== 'toll'; $('sLaw').hidden = v !== 'law';
  if (v === 'cross') renderCross(t); else if (v === 'toll') renderToll(t); else renderLaw(t);
}
function renderCross(t) {
  const c = t.c, asking = S.p1 === null;
  lab.setGlow('rgba(90, 160, 200, .26)');
  $('c1Play').hidden = asking;
  if (asking) {
    $('c1Ask').innerHTML = `<p class="cb-q">${esc(c.q)}</p>${c.opts.map((o, i) => `<button class="cb-opt" data-p1="${i}">${esc(o)}</button>`).join('')}`;
    lab.setReadout('?', '', '', '#58b0c2'); lab.setState({ emo: '🤔', title: c.stAsk, lead: c.ask, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const right = S.p1 === c.ok;
  $('c1Ask').innerHTML = `<div class="cb-verdict"><b style="color:${right ? 'var(--ok)' : 'var(--wip)'}">${esc(right ? t.right : t.notq)}</b>${esc(c.vt[S.p1])}</div>`;
  $('season').value = String(S.season);
  [0, 1, 2].forEach((i) => { $(`e${i}`).textContent = c.seasons[i]; });
  $('bBuild').textContent = S.build >= 3 ? c.again : c.build[S.build];
  const sc = (k, emo) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('eng', '👷') + sc('yrs', '⏳');
  let ro, st, body = '';
  const chainDone = S.build >= 3, open = chainDone || S.season < 2;
  if (S.sec === 'eng') { ro = [c.eng.val, c.eng.sub, '']; st = ['👷', c.eng.title, c.eng.lead]; }
  else if (S.sec === 'years') { const y = c.yrs[S.yr]; ro = [['1849', '1945', '1949'][S.yr], c.yrSub, '']; st = y; }
  else {
    ro = [open ? c.open : c.shut, chainDone ? c.subChain : open ? c.subBoat : c.subCut, S.build > 0 ? c.pill(S.build) : ''];
    if (S.build >= 3) st = [c.done[0], c.done[1], S.season === 2 ? c.done[2] : c.done[3]];
    else if (S.build >= 1) { st = c.p[S.build - 1]; if (S.season === 2) body = c.late; }
    else st = S.season === 0 ? c.sum : S.season === 1 ? c.aut : c.win;
  }
  lab.setReadout(ro[0], ro[1], ro[2], '#58b0c2');
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body, extra: '' });
  lab.setFacts(c.facts);
}
function renderToll(t) {
  const q = t.o, asking = S.p2 === null;
  lab.setGlow('rgba(224, 176, 80, .24)');
  $('c2Play').hidden = asking;
  if (asking) {
    $('c2Ask').innerHTML = `<p class="cb-q">${esc(q.q)}</p>${q.opts.map((o, i) => `<button class="cb-opt" data-p2="${i}">${esc(o)}</button>`).join('')}`;
    lab.setReadout('?', '', '', '#e0b050'); lab.setState({ emo: '🤔', title: q.stAsk, lead: q.ask, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const right = S.p2 === q.ok;
  $('c2Ask').innerHTML = S.done
    ? `<div class="cb-verdict"><b style="color:${right ? 'var(--ok)' : 'var(--wip)'}">${esc(right ? t.right : t.notq)}</b>${esc(q.vt[S.p2])}</div>`
    : `<p class="cb-wait">${esc(q.watch)}</p>`;
  $('modeRow').innerHTML = ['chain', 'old'].map((m, i) => `<button class="chip ${S.mode === m ? 'on' : ''}" data-act="mode" data-m="${m}">${esc(q.modes[i])}</button>`).join('') + `<button class="chip" data-act="again">${esc(q.again)}</button>`;
  lab.setReadout(`${S.paid}/3`, q.paid, q.modes[S.mode === 'chain' ? 0 : 1], '#e0b050');
  const st = !S.done ? q.run : S.mode === 'chain' ? q.doneChain : q.doneOld;
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' });
  lab.setFacts(S.done ? q.facts : []);
}
function renderLaw(t) {
  const L = t.law, n = S.tick.filter(Boolean).length, k = S.tick.filter((x, i) => x === ENDED[i]).length;
  lab.setGlow('rgba(190, 70, 80, .24)');
  $('lawHead').textContent = L.head;
  $('rules').innerHTML = L.rules.map((r, i) => {
    const cls = S.checked ? (S.tick[i] === ENDED[i] ? 'good' : 'miss') : S.tick[i] ? 'on' : '';
    return `<button class="cb-rule ${cls}" data-rule="${i}"${S.checked ? ' disabled' : ''}><span class="bx">${S.tick[i] ? '✓' : ''}</span>
      <span class="tx">${esc(r.text)}${S.checked ? `<span class="why">${esc(r.why)}</span>` : ''}</span>${S.checked ? `<span class="mk">${S.tick[i] === ENDED[i] ? '✓' : '✗'}</span>` : ''}</button>`;
  }).join('');
  $('bCheck').textContent = S.checked ? L.again : L.check; $('bCheck').disabled = !S.checked && n === 0;
  if (!S.checked) {
    lab.setReadout(`${n}/6`, L.tickedSub, '', '#d6504a'); lab.setState({ emo: '📜', title: L.stAsk, lead: L.lead, body: '', extra: '' }); lab.setFacts([]);
  } else {
    lab.setReadout(`${k}/6`, L.rightSub, '', '#d6504a'); lab.setState({ emo: k === 6 ? '🏆' : '📜', title: L.end(k), lead: L.endLead, body: '', extra: '' }); lab.setFacts(L.facts);
  }
}
render();
</script>
