    if (solved) { cloud(c, cx, y, 52, 1, t); emoji(c, MOLS[i].emo, cx, y - 6, 30, 1); pill(c, T[lang].m[i].smellShort || T[lang].m[i].smell, cx, y + 30, { fs: 12 }); }
    else mystery(c, cx, y, 60, 56, '', t);
  });
}
function drawAroma(c, w, h, dt, t) {
  panel(c, w, h, '#1a1830', '#0e0f20', 'rgba(240,179,74,.12)');
  const t3 = T[lang].a;
  if (S.p1 === null) { // the molecules would give view 1's guess away
    const ry = h * 0.2, wd = Math.min(w * 0.36, 130);
    mystery(c, w * 0.27, ry, wd, 70, cap(t3.acid), t); mystery(c, w * 0.73, ry, wd, 70, cap(t3.alc), t);
    c.save(); c.fillStyle = '#eef1fb'; c.font = '900 22px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('+', w / 2, ry); c.restore();
    mystery(c, w / 2, h * 0.72, Math.min(w * 0.7, 230), 74, '', t);
    return;
  }
  if (S.sec === 'free') {
    const n = A.fn, m = A.fm, jp = A.fjoined ? clamp((t - A.fjt) / 1.8, 0, 1) : 0, tt = T[lang];
    return drawReact(c, w, h, t, { acid: cachedSkel(acidTk(n), 'acid'), alc: cachedSkel(alcTk(m), 'alc'), est: cachedSkel(estTk(n, m), 'est'), p: jp, cloud: false, emo: null,
      names: [tt.nm(n, 'COOH'), tt.nm(m, 'OH'), tt.estName(m, n)], water: tt.a.water });
  }
  if (A.mode === 'match') return drawMatch(c, w, h, t);
  const i = A.mix, m = MOLS[i], tm = T[lang].m[i], jp = A.joined[i] ? clamp((t - A.jt[i]) / 1.8, 0, 1) : 0;
  drawReact(c, w, h, t, { acid: m.acid, alc: m.alc, est: m.est, p: jp, cloud: true, emo: m.emo, names: [tm.acid, tm.alc, tm.est], water: t3.water });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w;
  c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'build') drawBuild(c, w, h, dt, time); else if (v === 'test') drawTest(c, w, h, dt, time); else drawAroma(c, w, h, dt, time);
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const goView = (v) => { document.querySelector(`#views [data-view="${v}"]`)?.click(); };
const seenKey = () => S.seen.add(S.n + S.g);
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, d = b.dataset;
  if (act === 'b-pick') {
    if (S.p1 !== null) return;
    S.p1 = d.g; store.set('fruit-smells:p1', d.g); S.n = 2; S.g = 'OH'; S.gAt = now(); seenKey(); S.verdict = true; S.needGuess = false;
    (d.g === 'OH' ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'b-n') {
    S.n = clamp(S.n + +d.s, 1, 3); S.gAt = now(); seenKey(); S.verdict = false; if (S.sec === 'iso') S.sec = null; sfx.tick();
  } else if (act === 'b-g') {
    S.g = d.g; S.gAt = now(); seenKey(); S.verdict = false; if (S.sec === 'iso') S.sec = null; sfx.click();
  } else if (act === 't-pick') {
    if (S.tp !== null) return;
    S.tp = +d.i; S.revT = now(); S.focus = 1; S.dipOn = [true, true, true]; S.tverdict = true; (S.tp === 1 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 't-mode') {
    S.tmode = d.m; S.tverdict = false; sfx.click();
  } else if (act === 'goBuild') {
    goView('build'); return;
  } else if (act === 'a-mix') {
    if (+d.i > 0 && !A.joined[0]) return;
    A.mix = +d.i; A.mode = 'mix'; S.sec = S.sec === 'free' ? null : S.sec; A.showVerdict = false; sfx.click();
  } else if (act === 'a-pick') {
    if (A.pred !== null) return;
    A.pred = +d.i; A.joined[0] = true; A.jt[0] = now(); A.showVerdict = true; (A.pred === 1 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'a-join') {
    if (S.sec === 'free') { A.fjoined = true; A.fjt = now(); } else { A.joined[A.mix] = true; A.jt[A.mix] = now(); A.showVerdict = false; }
    sfx.snap(); showStage();
  } else if (act === 'a-match') {
    A.mode = 'match'; S.sec = S.sec === 'free' ? null : S.sec; sfx.click();
  } else if (act === 'a-opt') {
    const tk = A.task, i = +d.i;
    if (tk.done) return;
    if (i === A.ORDER[tk.qi]) { tk.solved[i] = true; if (!tk.bad) tk.first++; tk.qi++; tk.wrong = new Set(); tk.bad = false; if (tk.qi >= 3) tk.done = true; sfx.good(); }
    else { tk.wrong.add(i); tk.bad = true; sfx.bad(); }
  } else if (act === 'a-again') {
    A.task = { qi: 0, wrong: new Set(), first: 0, solved: [false, false, false], done: false, bad: false }; sfx.click();
  } else if (act === 'a-fn' || act === 'a-fm') {
    const k = act === 'a-fn' ? 'fn' : 'fm'; A[k] = clamp(A[k] + +d.s, 1, 3); A.fjoined = false; A.fjt = -9; sfx.tick();
  } else if (act === 'sec') {
    const k = d.k;
    if (!secret.unlocked()) return secret.open();
    const view = k === 'iso' ? 'build' : 'aroma';
    goView(view);
    if (S.p1 === null) { S.needGuess = true; render(); return; }
    if (k === 'iso') S.sec = S.sec === 'iso' ? null : 'iso';
    else { S.sec = S.sec === 'free' ? null : 'free'; A.mode = 'mix'; A.fjoined = false; A.fjt = -9; }
    sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => { if (ev.target.id === 'tConc') { S.conc = +ev.target.value; render(); } });
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'test' || S.tp === null || S.tmode !== 'lit') return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (y < TG.top - 80 || y > TG.bot + 30) return;
  const i = TG.xs.findIndex((tx) => Math.abs(x - tx) < Math.max(TG.tw, 36));
  if (i < 0) return;
  S.focus = i; S.dipOn[i] = !S.dipOn[i]; S.tverdict = false;
  sfx.tick(); render();
});

// --- one render per change: controls, readout and the state card ------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('secBuild').hidden = v !== 'build'; $('secTest').hidden = v !== 'test'; $('secAroma').hidden = v !== 'aroma';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button type="button" class="chip fs-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('iso', '🔀') + sc('free', '🧪');
  if (v === 'build') renderBuild(t); else if (v === 'test') renderTest(t); else renderAroma(t);
}
const opt = (act, attrs, text, cls = '') => `<button type="button" class="fs-opt ${cls}" data-act="${act}" ${attrs}>${esc(text)}</button>`;

function renderBuild(t) {
  const asked = S.p1 !== null, b = t.b;
  lab.setGlow('rgba(79, 195, 176, .24)');
  $('bAsk').hidden = asked; $('bFree').hidden = !asked;
  if (!asked) {
    $('bAsk').innerHTML = `<p class="fs-q">${esc(b.q)}</p><div class="fs-opts">${['COOH', 'H', 'OH'].map((g) => opt('b-pick', `data-g="${g}"`, cap(t.nm(2, g)))).join('')}</div>${S.needGuess ? `<p class="fs-note">${esc(b.need)}</p>` : ''}`;
    lab.setReadout('?', b.qSub, '', ACC.build);
    lab.setState({ emo: '🤔', title: b.q, lead: b.lead0, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const mol = chain(S.n, S.g), name = t.nm(S.n, S.g), alt = S.tp !== null ? t.alt(S.n, S.g) : '', f = formulaOf(mol);
  $('bStep').innerHTML = `<span class="fs-lbl">${esc(b.steps)}</span><span class="fs-step"><button type="button" class="fs-sb" data-act="b-n" data-s="-1" aria-label="−"${S.n <= 1 ? ' disabled' : ''}>−</button><b>${S.n}</b><button type="button" class="fs-sb" data-act="b-n" data-s="1" aria-label="+"${S.n >= 3 ? ' disabled' : ''}>+</button></span>`;
  $('bGroups').innerHTML = ['H', 'OH', 'COOH'].map((g) => `<button type="button" class="chip fs-c ${S.sec !== 'iso' && S.g === g ? 'on' : ''}" data-act="b-g" data-g="${g}">${esc(b.groups[g])}</button>`).join('');
  if (S.sec === 'iso') {
    lab.setReadout('C₂H₆O', `${t.iso.eth} · ${t.iso.dme}`, b.found(S.seen.size), '#8c9fe6');
    lab.setState({ emo: '🔀', title: t.iso.title, lead: t.iso.lead, body: t.iso.body, extra: '' });
    lab.setFacts(t.facts.iso);
    return;
  }
  lab.setReadout(esc(cap(name)), alt ? `${f} · ${alt}` : f, b.found(S.seen.size), { H: '#8d97b5', OH: ACC.build, COOH: '#f0b34a' }[S.g]);
  let st;
  if (S.verdict) st = { emo: S.p1 === 'OH' ? '✅' : '🤔', title: S.p1 === 'OH' ? b.right : b.wrong(t.nm(2, S.p1)), lead: `${cap(name)} (${f}): ${b.lead1}`, body: b.body1 };
  else st = { emo: { H: '⛓️', OH: '💧', COOH: '🔶' }[S.g], title: cap(name), lead: b[{ H: 'stH', OH: 'stOH', COOH: 'stCOOH' }[S.g]],
    body: [b[{ H: 'bodyH', OH: 'bodyOH', COOH: 'bodyCOOH' }[S.g]], alt ? b.also(alt) : ''].filter(Boolean).join(' ') };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(S.tp !== null ? t.facts.build : t.facts.build.slice(0, 1));
}

function renderTest(t) {
  const rev = S.tp !== null, t2 = t.t, keys = ['eth', 'vin', 'wat'];
  lab.setGlow('rgba(229, 72, 77, .2)');
  $('tAsk').hidden = rev; $('tFree').hidden = !rev;
  if (!rev) {
    $('tAsk').innerHTML = `<p class="fs-q">${esc(t2.q)}</p><div class="fs-opts">${keys.map((k, i) => opt('t-pick', `data-i="${i}"`, cap(t2.liq[k]))).join('')}</div>`;
    lab.setReadout('?', '', '', ACC.test);
    lab.setState({ emo: '🤔', title: t2.q, lead: t2.lead0, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  $('tMode').innerHTML = ['lit', 'ion'].map((m) => `<button type="button" data-act="t-mode" data-m="${m}" class="${S.tmode === m ? 'on' : ''}">${esc(t2.modes[m])}</button>`).join('');
  const ion = S.tmode === 'ion';
  $('tIon').hidden = !ion; $('tTip').hidden = ion;
  $('tConcL').textContent = t2.concLbl; $('tE0').textContent = t2.concEnds[0]; $('tE1').textContent = t2.concEnds[1]; $('tFine').textContent = t2.concFine; $('tTip').textContent = t2.tip;
  $('tConc').value = S.conc;
  if (ion) {
    const c0 = Math.pow(10, -3 + 3 * S.conc / 100), hA = hAcetic(c0), a = 100 * hA / c0;
    lab.setReadout(`pH ${fmt(-Math.log10(hA), 1)}`, `${t2.ionNames[0]}, ${fmt(c0, c0 < 0.01 ? 3 : 2)} mol/L`, `${t2.ionNames[1]}: pH ${fmt(-Math.log10(c0), 1)}`, '#ffcf5a');
    lab.setState({ emo: '⚛️', title: t2.ion.title, lead: t2.ion.lead(fmt(a, a < 10 ? 1 : 0)), body: t2.ion.body, extra: '' });
  } else {
    const i = S.focus, k = keys[i], red = i === 1;
    lab.setReadout(esc(red ? t2.red : t2.notRed), cap(t2.liq[k]), red ? 'pH ≈ 2.6' : '', red ? ACC.test : '#8d97b5');
    let st;
    if (S.tverdict) st = { emo: S.tp === 1 ? '✅' : '🤔', title: S.tp === 1 ? t2.right : t2.wrong(t2.liq[keys[S.tp]]), lead: t2.vin[1], body: S.p1 !== null ? t2.vinLink : '' };
    else st = { emo: red ? '🔴' : '🟣', title: t2[k][0], lead: t2[k][1], body: red && S.p1 !== null ? t2.vinLink : t2.tip };
    lab.setState({ ...st, extra: '' });
  }
  lab.setFacts(t.facts.test);
}

function renderAroma(t) {
  const a = t.a, locked = S.p1 === null, free = !locked && S.sec === 'free', match = !locked && !free && A.mode === 'match';
  lab.setGlow('rgba(240, 179, 74, .22)');
  $('aLock').hidden = !locked; $('aAsk').hidden = true; $('aFree').hidden = true; $('aTask').hidden = true;
  if (locked) {
    $('aLockT').textContent = a.lock; $('aGo').textContent = a.goBuild;
    lab.setReadout('?', '', '', ACC.aroma);
    lab.setState({ emo: '🤔', title: t.b.q, lead: a.lock, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const allJoined = A.joined.every(Boolean);
  const chips = [0, 1, 2].map((i) => `<button type="button" class="chip fs-c ${!free && A.mode === 'mix' && A.mix === i ? 'on' : ''}" data-act="a-mix" data-i="${i}"${i > 0 && !A.joined[0] ? ' disabled' : ''}>${esc(a.mix)} ${i + 1}${A.joined[i] ? ' ✓' : ''}</button>`).join('')
    + `<button type="button" class="chip fs-c ${match ? 'on' : ''}" data-act="a-match"${allJoined ? '' : ' disabled'}>${esc(a.match)}</button>`;
  const facts = A.joined[0] ? t.facts.aroma : [];
  if (free) {
    const n = A.fn, m = A.fm, jp = A.fjoined;
    $('aFree').hidden = false; $('aMixes').innerHTML = '';
    const stp = (lab_, k, v) => `<span class="fs-step"><span class="fs-lbl">${esc(lab_)}</span><button type="button" class="fs-sb" data-act="a-${k}" data-s="-1" aria-label="−"${v <= 1 ? ' disabled' : ''}>−</button><b>${v}</b><button type="button" class="fs-sb" data-act="a-${k}" data-s="1" aria-label="+"${v >= 3 ? ' disabled' : ''}>+</button></span>`;
    $('aStep').innerHTML = stp(a.free.acid, 'fn', n) + stp(a.free.alc, 'fm', m);
    $('aJoin').textContent = a.join; $('aJoin').hidden = false; $('aJoin').disabled = jp;
    const fe = fmla(n + m, 2 * (n + m), 2);
    lab.setReadout(jp ? fe : '?', `${fmla(n, 2 * n, 2)} + ${fmla(m, 2 * m + 2, 1)}`, jp ? '− H₂O' : '', ACC.aroma);
    lab.setState(jp ? { emo: '🧪', title: a.free.title(t.estName(m, n)), lead: a.free.lead(t.nm(n, 'COOH'), t.nm(m, 'OH')), body: a.free.body, extra: `<div class="fs-fine">${esc(a.note)}</div>` }
      : { emo: '🧪', title: `${cap(t.nm(n, 'COOH'))} + ${t.nm(m, 'OH')}`, lead: a.pre, body: '', extra: `<div class="fs-fine">${esc(a.note)}</div>` });
    lab.setFacts(facts);
    return;
  }
  $('aFree').hidden = false; $('aMixes').innerHTML = chips; $('aStep').innerHTML = '';
  if (match) {
    const tk = A.task, q = A.ORDER[tk.qi];
    $('aJoin').hidden = true; $('aTask').hidden = false;
    if (tk.done) {
      $('aTask').innerHTML = `<div class="fs-row first"><button type="button" class="btn fs-btn" data-act="a-again">${esc(a.again)}</button></div>`;
      lab.setReadout(`${tk.first}/3`, '', '', ACC.aroma);
      lab.setState({ emo: '🏆', title: a.mat.end(tk.first), lead: a.mat.endLead, body: '', extra: `<div class="fs-fine">${esc(a.note)}</div>` });
    } else {
      const sm = t.m[q].smellShort || t.m[q].smell;
      $('aTask').innerHTML = `<p class="fs-q">${esc(a.mat.q(sm))}</p><div class="fs-opts">${[0, 1, 2].map((i) => `<button type="button" class="fs-opt ${tk.wrong.has(i) ? 'no' : ''}" data-act="a-opt" data-i="${i}"${tk.wrong.has(i) ? ' disabled' : ''}>${esc(cap(t.m[i].est))}</button>`).join('')}</div>`;
      lab.setReadout(`${tk.qi}/3`, '', '', ACC.aroma);
      lab.setState({ emo: '🎯', title: a.mat.q(sm), lead: a.mat.lead, body: '', extra: `<div class="fs-fine">${esc(a.note)}</div>` });
    }
    lab.setFacts(facts);
    return;
  }
  const i = A.mix, tm = t.m[i], mm = MOLS[i], j = A.joined[i];
  if (i === 0 && !j) { // the prediction
    $('aJoin').hidden = true; $('aMixes').innerHTML = chips; $('aAsk').hidden = false;
    $('aAsk').innerHTML = `<p class="fs-q">${esc(a.q)}</p><div class="fs-opts">${a.opts.map((o, k) => opt('a-pick', `data-i="${k}"`, cap(o))).join('')}</div>`;
    lab.setReadout(mm.f[0], `+ ${mm.f[1]}`, '', ACC.aroma);
    lab.setState({ emo: '🤔', title: a.q, lead: `${cap(tm.acid)} + ${tm.alc}.`, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  $('aJoin').hidden = j; $('aJoin').textContent = a.join; $('aJoin').disabled = false;
  if (j) lab.setReadout(mm.f[2], '+ H₂O', tm.smellShort || tm.smell, ACC.aroma); else lab.setReadout(mm.f[0], `+ ${mm.f[1]}`, '', ACC.aroma);
  let st;
  if (i === 0 && A.showVerdict) st = { emo: A.pred === 1 ? '✅' : '🤔', title: A.pred === 1 ? a.right : a.wrong(a.opts[A.pred]), lead: `${cap(tm.est)}. ${a.smellIs(tm.smell)}`, body: a.afterBody };
  else if (j) st = { emo: mm.emo, title: cap(tm.est), lead: a.smellIs(tm.smell), body: a.afterBody };
  else st = { emo: '🧪', title: `${cap(tm.acid)} + ${tm.alc}`, lead: a.pre, body: a.preBody };
  lab.setState({ ...st, extra: `<div class="fs-fine">${esc(a.note)}</div>` });
  lab.setFacts(facts);
}
render();
</script>
</body>
