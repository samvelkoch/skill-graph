    else if (id === 'nan' || id === 'fan') { const k = id[0], a = ik(R.hip, [wx, Math.max(0.3, wy)], AL.th, AL.sk, -1); P[`${k}l1`] = a[0]; P[`${k}l2`] = a[1]; }
    else if (id === 'nkn') { const a1 = Math.atan2(wx - R.hip[0], -(wy - R.hip[1])) / D2R, rel = P.nl2 - P.nl1; P.nl1 = a1; P.nl2 = a1 + rel; }
    const R3 = rig(P, 0);
    if (Math.min(R3.low, R3.nwr[1], R3.fwr[1], R3.nel[1], R3.fel[1], R3.ntip[1], R3.ftip[1], R3.nkn[1], R3.fkn[1]) < -0.02) Object.assign(P, old);
    render();
  }
}

// --- controls ----------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function toQ2() { S.hp = 'q2'; S.age = 0; S.stackT = -1; S.tickN = 0; S.revShown = false; render(); }
function toFree() { S.hp = 'free'; S.stackT = 999; S.tickN = 99; S.revShown = false; store.set('heads-tall:hp', true); render(); }
const err = { eyes: () => Math.abs(S.eyeY - 0.5), body: () => { const L = lmk(7.5), g = [0.5, L.el / 7.5, L.tip / 7.5]; return S.mk.reduce((a, m, i) => a + Math.abs(m - g[i]), 0) / 3; } };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, j = +b.dataset.j;
  if (act === 'ans') {
    if (S.hp === 'q1') { S.ans[0] = j; S.hp = 'rev1'; S.stackT = 0; S.tickN = 0; S.revShown = false; showStage(); }
    else if (S.hp === 'q2') { S.ans[1] = j; S.hp = 'rev2'; S.stackT = 0; S.tickN = 0; S.revShown = false; showStage(); }
  } else if (act === 'ans3') {
    if (S.p3 !== 'q') return;
    S.ans3 = j; S.p3 = 'free'; store.set('heads-tall:p3', true); toPreset('sit'); S.v3 = j; S.v3Shown = false; showStage();
  } else if (act === 'secA') {
    if (!secret.unlocked()) return secret.open();
    S.swap = !S.swap; sfx.click();
  } else if (act === 'secB') {
    if (!secret.unlocked()) return secret.open();
    S.vit = !S.vit; S.step = 'body'; sfx.click();
  } else if (act === 'step') { S.step = b.dataset.k; S.vit = false; sfx.click(); }
  else if (act === 'chk') {
    if (S.step === 'eyes') { if (!S.moved) return; S.eyeDone = true; S.fRev = 0; (err.eyes() <= 0.06 ? sfx.good : sfx.bad)(); }
    else { if (!S.mvd.every(Boolean)) return; S.bodyDone = true; S.bRev = 0; (err.body() <= 0.06 ? sfx.good : sfx.bad)(); }
    showStage();
  } else if (act === 'pre') { toPreset(b.dataset.k); sfx.click(); }
  render();
});
$('age').addEventListener('input', () => { if (S.hp !== 'free') return; S.age = +$('age').value; sfx.tick(); render(); });

// --- one render per change: controls, readout, state card and facts ---------------------------------------------------
let roKey = '';
function setRO(val, sub, pillText, color) {
  const k = `${val}|${sub}|${pillText}|${color}`;
  if (k === roKey) return; roKey = k;
  lab.setReadout(val, sub, pillText, color);
}
const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  show('s1', v === 'heads'); show('s2', v === 'face'); show('s3', v === 'pose');
  if (v === 'heads') renderHeads(t); else if (v === 'face') renderFace(t); else renderPose(t);
}
const chipsOf = (opts, order, right, ans, reveal, act, wait) => order.map((j) => `<button class="ht-c ${reveal ? (j === right ? 'ht-ok' : j === ans ? 'ht-no' : 'ht-off') : wait ? (j === ans ? 'on' : 'ht-off') : ''}" data-act="${act}" data-j="${j}" type="button">${esc(opts[j])}</button>`).join('');
const secChip = (act, emo, name, on) => `<button class="ht-c ht-sec ${secret.unlocked() ? 'open' : ''} ${on ? 'on' : ''}" data-act="${act}" type="button">${secret.unlocked() ? `${emo} ${esc(name)}` : '🔒 ???'}</button>`;

function renderHeads(t) {
  const free = S.hp === 'free', first = S.hp === 'q1' || S.hp === 'rev1', building = S.hp === 'rev1' || S.hp === 'rev2', rev = building && S.revShown;
  lab.setGlow('rgba(124, 196, 255, .26)');
  show('q1', !free); show('sl1', free && !S.swap);
  if (!free) {
    const ans = S.ans[first ? 0 : 1];
    $('q1').innerHTML = `<div class="ht-q">${esc(first ? t.qAdult : t.qBaby)}</div><div class="ht-row" style="margin-top:0">${chipsOf(t.optsHeads, S.ord[first ? 'a' : 'b'], first ? 2 : 0, ans, rev, 'ans', building)}</div>`;
  }
  $('ageLbl').innerHTML = `${esc(t.age)}: <b>${esc(t.ages[S.age])}</b>`;
  if (+$('age').value !== S.age) $('age').value = S.age;
  $('age').setAttribute('aria-label', t.age); $('e0').textContent = t.ages[0]; $('e1').textContent = t.ages[5];
  $('c1').innerHTML = free ? secChip('secA', '👶', t.secrets.a[0], S.swap) : '';
  const Hn = HV[S.age];
  if (!free && !rev) setRO('?', '', '', '#7cc4ff');
  else if (free && S.swap) setRO('4 · 7½', t.headsTall('').replace(/\s*·\s*$/, ''), '', '#7cc4ff');
  else setRO(fmtH(Hn), t.headsTall(t.ages[S.age]), '', '#7cc4ff');
  if (!free) {
    if (rev) {
      const ok = first ? S.ans[0] === 2 : S.ans[1] === 0;
      lab.setState({ emo: ok ? '✅' : '📏', title: ok ? t.right : t.notQuite, lead: `${fmtH(Hn)} ${t.headsTall(t.ages[S.age])}`, body: '', extra: '' });
    } else lab.setState({ emo: '📏', title: first ? t.qAdult : t.qBaby, lead: '', body: '', extra: '' });
    lab.setFacts([]);
  } else if (S.swap) { lab.setState({ emo: '👶', title: t.secrets.a[0], lead: t.secrets.a[1], body: '', extra: '' }); lab.setFacts(t.facts.heads); }
  else { const st = t.state.heads; lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body, extra: '' }); lab.setFacts(t.facts.heads); }
}

function renderFace(t) {
  lab.setGlow('rgba(255, 122, 89, .22)');
  const eyes = S.step === 'eyes', done = eyes ? S.eyeDone : S.bodyDone;
  $('c2').innerHTML = S.eyeDone || S.bodyDone
    ? `<button class="ht-c ${eyes ? 'on' : ''}" data-act="step" data-k="eyes" type="button">${esc(t.eyeLine)}</button><button class="ht-c ${!eyes ? 'on' : ''}" data-act="step" data-k="body" type="button">${esc(t.landmarks)}</button>` : '';
  const chk = $('chk');
  chk.textContent = t.check; chk.style.display = done || S.vit ? 'none' : 'inline-block'; chk.dataset.act = 'chk';
  chk.disabled = eyes ? !S.moved : !S.mvd.every(Boolean);
  $('c2b').innerHTML = secChip('secB', '🏛️', t.secrets.b[0], S.vit);
  // readout and state
  if (S.vit) {
    setRO('7½', t.headsTall(t.ages[5]), '', '#ff7a59');
    lab.setState({ emo: '🏛️', title: t.secrets.b[0], lead: t.secrets.b[1], body: '', extra: '' }); lab.setFacts(t.facts.face); return;
  }
  setRO(done ? t.offBy(Math.round(err[eyes ? 'eyes' : 'body']() * 100)) : '?', eyes ? t.eyeLine : t.landmarks, '', '#ff7a59');
  if (eyes) {
    if (!done) lab.setState({ emo: '👁️', title: t.dragEyes, lead: '', body: '', extra: '' });
    else if (S.bodyDone) { const st = t.state.face; lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body, extra: '' }); }
    else lab.setState({ emo: err.eyes() <= 0.06 ? '✅' : '👁️', title: err.eyes() <= 0.06 ? t.right : t.notQuite, lead: S.eyeY < 0.4 ? t.eyesHigh : t.eyesGood, body: '', extra: '' });
  } else if (!done) lab.setState({ emo: '📐', title: t.landmarks, lead: '', body: '', extra: '' });
  else lab.setState({ emo: err.body() <= 0.06 ? '✅' : '📐', title: err.body() <= 0.06 ? t.right : t.notQuite, lead: t.landmarksWhy, body: '', extra: '' });
  lab.setFacts(t.facts.face);
}

function renderPose(t) {
  lab.setGlow('rgba(232, 195, 158, .24)');
  const free = poseOpen(), R = rig(S.P, 0), val = R.top[1].toFixed(1);
  show('q3', S.p3 === 'q' || S.v3 !== null);
  if (S.p3 === 'q' || S.v3 !== null) $('q3').innerHTML = `<div class="ht-q">${esc(t.qSit)}</div><div class="ht-row" style="margin-top:0">${chipsOf(t.optsSit, S.ord.s, 0, S.ans3, S.v3Shown, 'ans3', S.p3 === 'free')}</div>`;
  $('pre').style.display = free ? 'flex' : 'none';
  $('pre').innerHTML = free ? Object.keys(PRE).map((k) => `<button class="ht-c ${S.pname === k ? 'on' : ''}" data-act="pre" data-k="${k}" type="button">${esc(t.presets[k])}</button>`).join('') : '';
  if (!free) { setRO('?', '', '', '#e8c39e'); lab.setState({ emo: '🤸', title: t.qSit, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  setRO(val, t.inPose, '', '#e8c39e');
  if (S.v3 !== null) { const ok = S.ans3 === 0; lab.setState({ emo: ok ? '✅' : '🤸', title: ok ? t.right : t.notQuite, lead: `${val} ${t.inPose}`, body: '', extra: '' }); }
  else { const st = t.state.pose; lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body, extra: '' }); }
  lab.setFacts(t.facts.pose);
}

canvasLoop(cv, (c, w, h, dt, time) => {
  CW = w; CH = h;
  paper(c, w, h);
  const v = lab.view;
  if (v === 'heads') drawHeads(c, w, h, dt);
  else if (v === 'face') { if (S.step === 'eyes') drawEyes(c, w, h, dt); else drawBody(c, w, h, dt); }
  else { drawPose(c, w, h, dt, time); if (poseOpen()) setRO(S.top3.toFixed(1), T[lang].inPose, '', '#e8c39e'); }
});
render();
</script>
</body>
