  c.fillStyle = '#fff'; c.font = '900 18px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(`🥞 ${t.pan.title}`, 170, 32);
  PAN.forEach((it, i) => {
    const y = 72 + i * 31, n = it.n * k;
    c.font = '24px sans-serif'; c.textAlign = 'left'; c.fillStyle = '#000'; c.fillText(it.emo, 34, y);
    c.font = '800 16px Nunito, sans-serif'; c.fillStyle = '#4a3522'; c.fillText(t.pan.n[it.k], 68, y);
    const unit = it.u ? ` ${u[it.u]}` : '';
    c.textAlign = 'right'; c.fillStyle = x2 ? '#1f8a55' : '#4a3522'; c.font = '900 16px Nunito, sans-serif';
    c.fillText(x2 ? `2 × ${it.n} = ${n}${unit}` : `${it.n}${unit}`, 306, y);
    if (i < 3) { c.strokeStyle = 'rgba(120,90,50,.18)'; c.lineWidth = 1; c.beginPath(); c.moveTo(32, y + 15.5); c.lineTo(308, y + 15.5); c.stroke(); }
  });
  drawScale(c, 92, 428, 0.75, { needle: A.needle, lid: 0, items: [{ col: C.flour, amt: 200 * k }], pt: A.pt });
  drawJug(c, 258, 428, 0.75, { level: A.lvl, col: C.milk, cloth: 0, tilt: 0 });
  pill(c, `${t.pan.n.flour}: ${200 * k} ${u.g}`, 92, 224, { maxW: 150 });
  pill(c, `${t.pan.n.milk}: ${300 * k} ${u.ml}`, 258, 224, { maxW: 150 });
}
function drawTrap(c, tm) {
  const t = T[lang], tr = S.trap, u = t.u, on = tr.on, ta = A.t;
  hits = [];
  c.save(); c.translate(170, 66); c.rotate(-0.025); c.shadowColor = 'rgba(50,28,10,.4)'; c.shadowBlur = 10; c.shadowOffsetY = 4;
  rr(c, -140, -46, 280, 92, 10); c.fillStyle = lg(c, 0, -46, 0, 46, [[0, '#ffe370'], [1, '#f2c230']]); c.fill(); c.shadowColor = 'transparent'; c.strokeStyle = '#8a6a0c'; c.lineWidth = 2; c.stroke();
  c.textBaseline = 'middle'; c.textAlign = 'center'; c.fillStyle = '#000'; c.font = '30px sans-serif'; c.fillText('⚠️', -112, 0);
  const txt = `1 ${u.kg} + 200 ${u.g} = 201 ?`; c.fillStyle = '#4a3300'; c.font = '900 22px Nunito, sans-serif'; c.fillText(txt, 14, 0);
  if (on && ta > 0.9) {
    c.strokeStyle = '#d6201a'; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(-86, -22); c.lineTo(112, 22); c.moveTo(-86, 22); c.lineTo(112, -22); c.stroke();
  }
  c.restore();
  drawScale(c, 170, 408, 0.92, { needle: A.needle, lid: 0, items: scene().items, pt: A.pt });
  const bag = (id, label, x0, y0) => {
    const e = on ? sm(0, 0.7, ta) : 0, tx = 170 - 24, ty = 214;
    const x = x0 + (tx - x0) * e, y = y0 + (ty - y0) * e - Math.sin(e * Math.PI) * 30, a = on ? 1 - sm(0.55, 0.75, ta) : 1;
    if (a > 0.02) drawPacket(c, id, x, y, 48, 62, label, a);
  };
  bag('flour', `1 ${u.kg}`, 14, 320); bag('sugar', `200 ${u.g}`, 278, 320);
  if (on && ta > 1.0) pill(c, t.trap.fix(u), 170, 128, { maxW: 320, bg: 'rgba(16,70,48,.9)' });
}

const cv = $('cv');
canvasLoop(cv, (c, w, h, dt, tm) => {
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  G = { ox, oy, s };
  step(dt);
  drawBg(c, w, h, s, ox, oy);
  c.save(); c.translate(ox, oy); c.scale(s, s);
  const v = S.sec || lab.view;
  ({ weigh: drawWeigh, pour: drawPour, cut: drawCut, pan: drawPan, trap: drawTrap })[v](c, tm);
  c.restore();
});
cv.addEventListener('pointerdown', (ev) => {
  const r = cv.getBoundingClientRect(), px = (ev.clientX - r.left - G.ox) / G.s, py = (ev.clientY - r.top - G.oy) / G.s;
  const h = hits.find((q) => px >= q.x && px <= q.x + q.w && py >= q.y && py <= q.y + q.h);
  if (h) doPick(h.k);
});

// --- actions -------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const canWeigh = (it) => S.w.total + it.a <= 2000;
const canPour = (d) => (d.id === 'out' ? S.p.level >= d.a : S.p.level + d.a <= 1000);
function doPick(k) {
  const v = S.sec || lab.view;
  if (v === 'weigh') {
    const it = ING.find((i) => i.id === k); if (!it || !canWeigh(it)) { sfx.bad(); return; }
    S.w.pend = k; S.w.done = false; S.w.g = null; A.t = 99; sfx.click();
  } else if (v === 'pour') {
    const d = DR.find((i) => i.id === k); if (!d || !canPour(d)) { sfx.bad(); return; }
    S.p.pend = k; S.p.done = false; S.p.g = null; A.t = 99; if (k === 'out') S.p.glass = false; sfx.click();
  } else return;
  render();
}
function check() {
  const v = S.sec || lab.view;
  if (v === 'weigh') {
    const w = S.w, it = ING.find((i) => i.id === w.pend); if (!it || w.done || w.g === null) return;
    const tot = w.total + it.a, ok = w.g === tot;
    w.last = { prev: w.total, amt: it.a, tot, g: w.g, ok }; w.prev = w.total; w.total = tot; w.items = [...w.items, { col: C[it.id], amt: it.a }]; w.done = true;
    A.t = 0; (ok ? sfx.good : sfx.bad)();
  } else if (v === 'pour') {
    const p = S.p, d = DR.find((i) => i.id === p.pend); if (!d || p.done || p.g === null) return;
    const out = d.id === 'out', tot = out ? p.level - d.a : p.level + d.a, ok = p.g === tot;
    p.last = { prev: p.level, amt: d.a, tot, g: p.g, ok, out }; p.prev = p.level;
    if (out) { p.glassCol = mixCol(p.mix); const f = p.level > 0 ? tot / p.level : 0; for (const q of ['milk', 'juice', 'water']) p.mix[q] *= f; p.glass = true; }
    else p.mix[d.id] += d.a;
    p.level = tot; p.done = true; A.t = 0; (ok ? sfx.good : sfx.bad)();
  } else if (v === 'cut') {
    const c = S.c; if (c.done || c.g === null) return;
    c.done = true; A.t = 0; (c.g === (c.task === 0 ? 65 : 115) ? sfx.good : sfx.bad)();
  }
  showStage(); render();
}
$('ctrlBody').innerHTML = `<div class="km-chips" id="kmChips"></div>
  <div class="km-ask" id="kmAsk"><div class="km-q" id="kmQ"></div><div class="km-in"><input id="gi" type="number" inputmode="numeric" min="0" max="99999" autocomplete="off"><span class="km-u" id="gu"></span><button class="btn" id="cMain" data-act="check"></button></div></div>
  <div class="km-act" id="kmAct"></div>
  <div class="km-sec" id="kmSec"></div>`;
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = b.dataset.k, v = S.sec || lab.view;
  if (act === 'pick') return doPick(k);
  if (act === 'check') return check();
  if (act === 'reset') {
    if (v === 'weigh') S.w = { total: 0, prev: 0, items: [], pend: null, done: false, g: null, last: null };
    else S.p = { level: 0, prev: 0, mix: { milk: 0, juice: 0, water: 0 }, pend: null, done: false, g: null, last: null, glass: false, glassCol: '#8fd0f0' };
    A.t = 99; sfx.click();
  } else if (act === 'task') { S.c = { task: +k, g: null, done: false }; A.t = 99; sfx.click(); }
  else if (act === 'again') { S.c.done = false; S.c.g = null; A.t = 99; sfx.click(); }
  else if (act === 'x') { S.pan.x2 = k === '2'; sfx.click(); }
  else if (act === 'weighbags') { S.trap.on = !S.trap.on; A.t = 0; A.needle = 0; A.nv = 0; A.pt = 0; sfx.click(); if (S.trap.on) showStage(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { S.sec = k; S.pan.x2 = false; S.trap.on = false; A.t = 99; A.needle = 0; A.nv = 0; A.pt = 0; A.lvl = 0; A.cloth = 0; A.tilt = 0; A.gl = 0; }
    sfx.click(); showStage();
  }
  render();
});
const cur = () => ({ weigh: S.w, pour: S.p, cut: S.c })[S.sec || lab.view];
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'gi') return;
  const o = cur(); if (!o || o.done) return;
  o.g = ev.target.value === '' ? null : clamp(Math.round(+ev.target.value), 0, 99999); render();
});
$('ctrlBody').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.id === 'gi') { ev.preventDefault(); check(); } });

// --- one render per change: controls, readout and the state card ----------------------------------------------
const chip = (act, k, label, on, dis) => `<button class="chip${on ? ' on' : ''}" data-act="${act}" data-k="${k}"${dis ? ' disabled' : ''}>${label}</button>`;
function render() {
  const t = T[lang], v = S.sec || lab.view, u = t.u;
  document.body.dataset.v = v;
  let r;
  if (v === 'weigh') r = rWeigh(t); else if (v === 'pour') r = rPour(t); else if (v === 'cut') r = rCut(t); else if (v === 'pan') r = rPan(t); else r = rTrap(t);
  $('kmChips').innerHTML = r.chips || '';
  $('kmAct').innerHTML = r.acts || '';
  $('kmAsk').style.display = r.ask ? '' : 'none';
  if (r.ask) {
    $('kmQ').textContent = r.ask.q; $('gu').textContent = r.ask.unit;
    const gi = $('gi'); gi.setAttribute('aria-label', r.ask.q);
    if ((gi.value === '' ? null : +gi.value) !== r.ask.g) gi.value = r.ask.g === null ? '' : String(r.ask.g);
    $('cMain').textContent = t.check; $('cMain').disabled = r.ask.g === null;
  }
  const sc = (k, emo, name) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''}${S.sec === k ? ' on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(name)}` : '🔒 ???'}</button>`;
  $('kmSec').innerHTML = sc('pan', '🥞', t.sec.a[0]) + sc('trap', '⚠️', t.sec.b[0]);
  lab.setReadout(r.val, r.sub, r.pill, COL[v]); lab.setGlow(GLOW[v]);
  lab.setState(r.state); lab.setFacts(r.facts || []);
}
const F = (t, ...ks) => ks.map((k) => ({ emo: { kg: '⚖️', pood: '🏛️', cup: '🥣' }[k], text: t.facts[k], src: { kg: 'BIPM: the kilogram', pood: 'Encyclopaedia Britannica: pood', cup: 'NIST: US customary units (cooking)' }[k] }));

function rWeigh(t) {
  const w = S.w, u = t.u, it = ING.find((i) => i.id === w.pend), phase = !w.pend ? 'pick' : w.done ? 'rev' : 'ask';
  const chips = ING.map((i) => chip('pick', i.id, `${i.emo} ${esc(t.weigh.ing[i.id])} ${i.a} ${u.g}`, w.pend === i.id, !canWeigh(i))).join('');
  const acts = `<button class="btn ghost" data-act="reset"${w.total === 0 && !w.pend ? ' disabled' : ''}>${esc(t.weigh.empty)}</button>`;
  const stuck = ING.every((i) => !canWeigh(i));
  const o = { chips, acts, facts: F(t, 'kg', 'pood') };
  if (phase === 'pick') {
    o.val = fm(w.total, 'mass'); o.sub = t.weigh.inBowl; o.pill = '';
    o.state = { emo: '⚖️', title: t.weigh.pickT, lead: w.total ? (stuck ? t.weigh.full : t.weigh.pickLn(fm(w.total, 'mass'))) : t.weigh.pickL, body: '', extra: '' };
  } else if (phase === 'ask') {
    const q = `${t.weigh.ctx(w.total ? fm(w.total, 'mass') : '', t.weigh.ingA[it.id], fm(it.a, 'mass'))} ${t.weigh.tail}`;
    o.ask = { q, unit: u.g, g: w.g }; o.val = '?'; o.sub = `+ ${it.a} ${u.g}`; o.pill = '';
    o.state = { emo: it.emo, title: t.weigh.ing[it.id], lead: q, body: '', extra: '' };
  } else {
    const l = w.last, kg = big(l.tot, 'mass');
    o.val = fm(l.tot, 'mass'); o.sub = kg ? `= ${kg}` : ''; o.pill = l.ok ? t.right : t.notqS;
    const sum = l.prev ? `${fm(l.prev, 'mass')} + ${fm(l.amt, 'mass')} = ${fm(l.tot, 'mass')}${kg ? ` = ${kg}` : ''}` : t.weigh.first(fm(l.tot, 'mass'));
    o.state = { emo: l.ok ? '✅' : '🤔', title: l.ok ? t.right : t.notq(fm(l.g, 'mass'), fm(l.tot, 'mass')), lead: sum, body: '', extra: '' };
  }
  return o;
}
function rPour(t) {
  const p = S.p, u = t.u, d = DR.find((i) => i.id === p.pend), phase = !p.pend ? 'pick' : p.done ? 'rev' : 'ask';
  const chips = DR.map((i) => chip('pick', i.id, `${i.emo} ${esc(t.pour.ing[i.id])} ${i.id === 'out' ? '−' : '+'}${i.a} ${u.ml}`, p.pend === i.id, !canPour(i))).join('');
  const acts = `<button class="btn ghost" data-act="reset"${p.level === 0 && !p.pend ? ' disabled' : ''}>${esc(t.pour.empty)}</button>`;
  const o = { chips, acts, facts: F(t, 'cup') };
  if (phase === 'pick') {
    o.val = fm(p.level, 'vol'); o.sub = p.level >= 1000 ? `= ${big(p.level, 'vol')}` : t.pour.inJug; o.pill = '';
    o.state = { emo: '🫗', title: t.pour.pickT, lead: p.level ? t.pour.pickLn(fm(p.level, 'vol')) : t.pour.pickL, body: '', extra: '' };
  } else if (phase === 'ask') {
    const cur_ = p.level ? fm(p.level, 'vol') : '', q = `${d.id === 'out' ? t.pour.ctxOut(cur_, fm(d.a, 'vol')) : t.pour.ctx(cur_, t.pour.ingA[d.id], fm(d.a, 'vol'))} ${t.pour.tail}`;
    o.ask = { q, unit: u.ml, g: p.g }; o.val = '?'; o.sub = `${d.id === 'out' ? '−' : '+'} ${d.a} ${u.ml}`; o.pill = '';
    o.state = { emo: d.emo, title: t.pour.ing[d.id], lead: q, body: '', extra: '' };
  } else {
    const l = p.last, b = big(l.tot, 'vol');
    o.val = fm(l.tot, 'vol'); o.sub = b ? `= ${b}` : ''; o.pill = l.ok ? t.right : t.notqS;
    const sum = l.out ? `${fm(l.prev, 'vol')} − ${fm(l.amt, 'vol')} = ${fm(l.tot, 'vol')}` : l.prev ? `${fm(l.prev, 'vol')} + ${fm(l.amt, 'vol')} = ${fm(l.tot, 'vol')}${b ? ` = ${b}` : ''}` : t.pour.first(fm(l.tot, 'vol'));
    o.state = { emo: l.ok ? '✅' : '🤔', title: l.ok ? t.right : t.notq(fm(l.g, 'vol'), fm(l.tot, 'vol')), lead: sum, body: '', extra: '' };
  }
  return o;
}
function rCut(t) {
  const c = S.c, u = t.u, ans = c.task === 0 ? 65 : 115;
  const o = { chips: t.cut.tasks.map((n, i) => chip('task', i, `🎀 ${esc(n)}`, c.task === i, false)).join(''), facts: [] };
  if (!c.done) {
    o.ask = { q: t.cut.q[c.task], unit: u.cm, g: c.g }; o.val = '?'; o.sub = t.cut.sub[c.task]; o.pill = '';
    o.state = { emo: '🎀', title: t.cut.tasks[c.task], lead: t.cut.q[c.task], body: '', extra: '' };
  } else {
    const b = big(ans, 'len'), ok = c.g === ans;
    o.acts = `<button class="btn" data-act="again">${esc(t.again)}</button>`;
    o.val = fm(ans, 'len'); o.sub = b ? `= ${b}` : ''; o.pill = ok ? t.right : t.notqS;
    const ex = c.task === 0 ? `1 ${u.m} = 100 ${u.cm}. 100 ${u.cm} − 35 ${u.cm} = 65 ${u.cm}.` : `45 ${u.cm} + 70 ${u.cm} = 115 ${u.cm} = ${b}.`;
    o.state = { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq(fm(c.g, 'len'), fm(ans, 'len')), lead: ex, body: '', extra: '' };
  }
  return o;
}
function rPan(t) {
  const x2 = S.pan.x2, u = t.u;
  return { chips: '', acts: `<div class="seg" role="group"><button data-act="x" data-k="1" class="${x2 ? '' : 'on'}">×1</button><button data-act="x" data-k="2" class="${x2 ? 'on' : ''}">×2</button></div>`,
    val: x2 ? '×2' : '×1', sub: x2 ? t.pan.sub2 : t.pan.sub1, pill: '', facts: F(t, 'cup'),
    state: { emo: '🥞', title: t.pan.title, lead: x2 ? t.pan.lead2(u) : t.pan.lead1, body: '', extra: '' } };
}
function rTrap(t) {
  const on = S.trap.on, u = t.u;
  return { chips: '', acts: `<button class="btn" data-act="weighbags">${esc(on ? t.trap.btnOff : t.trap.btn)}</button>`,
    val: on ? fm(1200, 'mass') : `1 ${u.kg} + 200 ${u.g}`, sub: on ? t.trap.sub1 : t.trap.sub0, pill: '', facts: F(t, 'kg'),
    state: on ? { emo: '⚖️', title: t.trap.t1(`${fm(1200, 'mass')} = ${big(1200, 'mass')}`), lead: t.trap.l1(u), body: '', extra: '' } : { emo: '⚠️', title: t.trap.t0, lead: t.trap.l0, body: '', extra: '' } };
}
render();
</script>
