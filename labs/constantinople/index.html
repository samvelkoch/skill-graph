const clamp01 = (x) => Math.max(0, Math.min(1, x));

function smooth(c, pts, closed = true) {

    for (let i = 0; i < n; i++) { const m = mid(pts[i], pts[(i + 1) % n]); c.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); }

// text pills with a simple "first free spot" placement, in screen pixels (12 px bold on a dark rounded pill)

function updateCross(dt) {
  if (S.pred.cross === null) return;
  S.reveal = Math.min(1, S.reveal + dt / 0.9);
  S.ring = Math.max(0, S.ring - dt * 2.2);
  S.pops = S.pops.filter((p) => (p.t += dt) < 1.2);
  if (!S.move && !S.drag) { // home again once the toggle is off
    const dx = HOME[0] - S.city.x, dy = HOME[1] - S.city.y, k = Math.min(1, dt * 7);
    if (Math.abs(dx) + Math.abs(dy) > 0.2) { S.city.x += dx * k; S.city.y += dy * k; } else { S.city.x = HOME[0]; S.city.y = HOME[1]; }
  }
  S.spawn -= dt; if (S.spawn <= 0) { S.units.push({ r: SEQ[S.si++ % SEQ.length], d: 0, paid: false }); S.spawn += 1.5; }
  for (const u of S.units) {
    const r = ROUTES[u.r]; u.d += SPEED[r.kind] * dt;
    if (!u.paid) {
      const [x, y] = posAt(r, u.d);
      if (Math.hypot(x - S.city.x, y - S.city.y) < RT) {
        u.paid = true; S.coins += TOLL[r.kind]; if (r.kind === 'ship') S.ships++; else S.cars++;

  const away = Math.hypot(S.city.x - HOME[0], S.city.y - HOME[1]) > 24;

}

function updateJust(dt) {
  if (S.anim) {
    S.anim.t += dt; S.year = lerp(S.anim.from, S.anim.to, ease(S.anim.t / S.anim.dur)); $('cpYear').value = S.year;
    if (S.anim.t >= S.anim.dur) S.anim = null;
  }
  const fy = Math.floor(S.year); if (fy !== S.lastYr) { S.lastYr = fy; renderReadout(); }
}
canvasLoop(cv, (c, w, h, dt, t) => {
  const v = lab.view;
  if (v === 'crossroads') { updateCross(dt); drawCross(c, w, h, dt, t); if (S.dirty) { S.dirty = false; renderReadout(); } }
  else if (v === 'walls') { updateWalls(dt); drawWalls(c, w, h, dt, t); }
  else { updateJust(dt); drawJust(c, w, h, dt, t); }
});

// --- one render per change: controls, readout and the state card ----------------------------------------------
function predHTML(v) {
  const t = T[lang], [qk, ok, rk, wk] = PRED[v], a = S.pred[v], right = RIGHT[v];
  const opts = t[ok].map((o, i) => `<button class="cp-opt${a !== null && i === right ? ' ok' : a === i ? ' bad' : ''}" data-pred="${i}" data-v="${v}"${a !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = a === null ? '' : `<p class="cp-verdict" style="color:${a === right ? 'var(--ok)' : 'var(--wip)'}">${esc(a === right ? t[rk] : t[wk])}</p>`;
  return `<p class="cp-q">${esc(t[qk])}</p><div class="cp-opts">${opts}</div>${verdict}`;
}
function renderReadout() {
  const t = T[lang], v = lab.view, col = '#6b2fa0';
  if (v === 'crossroads') {
    if (S.pred.cross === null) lab.setReadout('?', '', '', col); else lab.setReadout(t.coins(S.coins), t.tollSub, t.traffic(S.ships, S.cars), col);
  } else if (v === 'walls') {
    if (S.pred.walls === null) { lab.setReadout('?', '', '', col); return; }
    const ph = S.atk ? phaseAt(S.atk.k, S.atk.t) : null;
    lab.setReadout(t.strength(Math.round(S.strength)), '', ph ? (ph.name ? t.layers[ph.name] : ph.done ? t.held : '') : '', col);
  } else if (S.pred.just === null) lab.setReadout('?', '', '', col);
  else lab.setReadout(String(Math.floor(S.year)), '', S.proj ? `${PROJ_EMO[S.proj]} ${t.projects[S.proj]}` : '', col);
}
function render() {
  const t = T[lang], v = lab.view, ask = S.pred;
  lab.setGlow('rgba(120, 60, 180, .34)');
  $('cpCross').style.display = v === 'crossroads' ? 'block' : 'none';
  $('cpWalls').style.display = v === 'walls' ? 'block' : 'none';
  $('cpJust').style.display = v === 'justinian' ? 'block' : 'none';
  cv.classList.toggle('cp-drag', v === 'crossroads' && S.move && ask.cross !== null);
  const key = v === 'crossroads' ? 'cross' : v === 'walls' ? 'walls' : 'just';
  document.querySelector(`.cp-pred[data-v=${key}]`).innerHTML = predHTML(key);
  let st, facts = [];
  if (v === 'crossroads') {
    const asked = ask.cross !== null, s0 = t.st.crossroads;
    $('cpCrossCtl').style.display = asked ? 'block' : 'none';
    $('cpMove').className = `chip${S.move ? ' on' : ''}`; $('cpMove').textContent = t.moveCity;
    st = !asked ? { emo: '🤔', title: t.crossAsk, lead: '' } : S.away ? { emo: '🧭', title: t.movedTitle, lead: t.movedLead } : { emo: s0[0], title: s0[1], lead: s0[2], body: s0[3] };
    if (asked) facts = t.facts.crossroads;
  } else if (v === 'walls') {
    const asked = ask.walls !== null, s0 = t.st.walls, open = secret.unlocked();
    $('cpWallsCtl').style.display = asked ? 'block' : 'none';
    $('cpAtkLbl').textContent = t.attackFrom;
    $('cpAtk').innerHTML = ['sea', 'horn', 'land'].map((k) => `<button class="chip${S.atk?.k === k ? ' on' : ''}" data-act="atk" data-k="${k}">${esc(t.attacks[k])}</button>`).join('');
    $('cpSec').innerHTML = [['chain', '⛓️', 'a'], ['fire', '🔥', 'b']].map(([k, emo, sk]) => `<button class="chip secret${open ? ' open' : ''}${S.sec === k ? ' on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[sk][0])}` : '🔒 ???'}</button>`).join('');
    const path = { sea: ['current', 'seaWall'], horn: ['chain', 'seaWall'], land: ['moat', 'outer', 'inner'] };
    if (!asked) st = { emo: '🤔', title: t.wallsAsk, lead: '' };
    else if (S.sec === 'chain') st = { emo: '⛓️', title: t.secrets.a[0], lead: t.chainText };
    else if (S.sec === 'fire') st = { emo: '🔥', title: t.secrets.b[0], lead: t.fireText };
    else if (S.atk?.done) st = { emo: '🏰', title: t.held, lead: path[S.atk.k].map((x) => t.layers[x]).join(' → ') };
    else st = { emo: s0[0], title: s0[1], lead: s0[2], body: s0[3] };
    if (asked) facts = t.facts.walls;
  } else {
    const asked = ask.just !== null, s0 = t.st.justinian;
    $('cpJustCtl').style.display = asked ? 'block' : 'none';
    $('cpProj').innerHTML = PROJ_KEYS.map((k) => `<button class="chip${S.proj === k ? ' on' : ''}" data-act="proj" data-k="${k}">${PROJ_EMO[k]} ${esc(t.projects[k])}</button>`).join('');
    st = !asked ? { emo: '🤔', title: t.justAsk, lead: '' } : { emo: s0[0], title: s0[1], lead: s0[2], body: s0[3] };
    if (asked) facts = t.facts.justinian;
  }
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body ?? '', extra: '' });
  lab.setFacts(facts);
  renderReadout();
}
render();
</script>
</body>
</html>
