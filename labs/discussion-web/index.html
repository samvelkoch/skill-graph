const mkSim = () => ({ th: [], bulbs: [], ideas: 0, built: 0, talk: [0, 0, 0, 0, 0, 0], spoke: [0, 0, 0, 0, 0, 0], rv: [0, 0, 0, 0, 0, 0],
  gl: [0, 0, 0, 0, 0, 0], dm: [0, 0, 0, 0, 0, 0], dimUntil: [0, 0, 0, 0, 0, 0], pulse: [-9, -9, -9, -9, -9, -9] });
function act(sim, f, t, o = {}) {
  const t0 = now();
  if (f != null) { sim.talk[f] += o.talk ?? 1; sim.spoke[f] = 1; sim.pulse[f] = t0; }
  if (f != null && t != null && o.thread !== false) {
    const old = sim.th.find((x) => !x.cut && ((x.a === f && x.b === t) || (x.a === t && x.b === f)));
    if (old) { old.w++; old.pulse = t0; } else sim.th.push({ a: f, b: t, w: 1, t0, pulse: t0, cut: 0 });
  }
  if (o.idea) { sim.ideas++; sim.bulbs.push({ born: t0 }); }
  if (o.b) sim.built++;
}
function cutLast(sim) {
  for (let i = sim.th.length - 1; i >= 0; i--) if (!sim.th[i].cut) { sim.th[i].cut = now(); sim.built = Math.max(0, sim.built - 1); return; }
}
const dimOthers = (sim, keep, secs) => { for (let i = 0; i < 6; i++) if (i !== keep) sim.dimUntil[i] = now() + secs; };
function heardOf(s) {
  const tot = s.talk.reduce((a, b) => a + b, 0);
  if (!tot) return 0;
  const sp = s.spoke.reduce((a, b) => a + b, 0) / 6, share = Math.max(...s.talk) / tot, ex = clamp((share - 1 / 6) / (5 / 6), 0, 1);
  return sp * (1 - ex * 0.9);
}
function shapeOf(sim) {
  const cnt = [0, 0, 0, 0, 0, 0]; let tot = 0, n = 0;
  for (const t of sim.th) { if (t.cut) continue; cnt[t.a] += t.w; cnt[t.b] += t.w; tot += 2 * t.w; n++; }
  if (!tot || n < 3) return 'thin';
  if (Math.max(...cnt) / tot >= 0.4) return 'star';
  return n >= 5 ? 'web' : 'thin';
}

function drawKid(c, x, y, sc, K, o) {
  const r = 18, look = o.look || [0, 1], mood = o.mood ?? 1, tn = o.tn || 0;
  c.save(); c.translate(x, y); c.scale(sc, sc); c.lineJoin = 'round'; c.lineCap = 'round';
  if (o.glow > 0.02) {
    const g = c.createRadialGradient(0, 4, r * 0.5, 0, 4, r * 2.6);
    g.addColorStop(0, rgba(K.col, 0.6 * o.glow)); g.addColorStop(1, rgba(K.col, 0));
    c.fillStyle = g; c.beginPath(); c.arc(0, 4, r * 2.6, 0, 6.3); c.fill();
  }
  c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(2, 39, 24, 6, 0, 0, 6.3); c.fill();
  const hairG = c.createLinearGradient(-r, -r, r, r); hairG.addColorStop(0, light(K.hair, 0.28)); hairG.addColorStop(1, K.hair);
  const oln = shade(K.hair, 0.4);
  const behind = (fn) => { c.fillStyle = hairG; c.strokeStyle = oln; c.lineWidth = 1.4; c.beginPath(); fn(); c.fill(); c.stroke(); };
  if (K.acc === 'long') behind(() => c.ellipse(0, 6, r + 5, r + 10, 0, 0, 6.3));
  if (K.acc === 'pony') { behind(() => c.arc(r + 5, -2, 7, 0, 6.3)); c.fillStyle = '#ff6b6b'; c.beginPath(); c.arc(r + 0.5, -4, 2.6, 0, 6.3); c.fill(); }
  if (K.acc === 'bun' || K.acc === 'gran') behind(() => c.arc(0, -r - 3, 7.5, 0, 6.3));
  // shirt
  const bg = c.createLinearGradient(-24, 12, 24, 40); bg.addColorStop(0, light(K.shirt, 0.3)); bg.addColorStop(1, K.shirt);
  c.fillStyle = bg; c.strokeStyle = shade(K.shirt, 0.4); c.lineWidth = 1.6;
  c.beginPath(); c.ellipse(0, 28, 24, 14, 0, 0, 6.3); c.fill(); c.stroke();
  if (K.acc === 'gran') { c.strokeStyle = light(K.shirt, 0.5); c.lineWidth = 2; c.beginPath(); c.arc(0, 14, 15, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke(); }
  // head
  const hg = c.createRadialGradient(-6, -7, 2, 0, 0, r + 6); hg.addColorStop(0, light(K.skin, 0.4)); hg.addColorStop(0.55, K.skin); hg.addColorStop(1, shade(K.skin, 0.14));
  c.fillStyle = hg; c.strokeStyle = shade(K.skin, 0.35); c.lineWidth = 1.4; c.beginPath(); c.arc(0, 0, r, 0, 6.3); c.fill(); c.stroke();
  // hair cap with a fringe
  if (K.acc === 'beanie') {
    const bgd = c.createLinearGradient(-r, -r, r, 0); bgd.addColorStop(0, '#6fb0f0'); bgd.addColorStop(1, '#3567a8');
    c.fillStyle = bgd; c.strokeStyle = '#1d3d68'; c.lineWidth = 1.4; c.beginPath(); c.arc(0, -1, r + 1.5, Math.PI, 2 * Math.PI); c.lineTo(r + 1.5, -5); c.lineTo(-r - 1.5, -5); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#2d5a95'; rr(c, -r - 2, -9, 2 * r + 4, 6, 3); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, -r - 3, 4, 0, 6.3); c.fill(); c.strokeStyle = '#9aa6bd'; c.stroke();
  } else {
    c.fillStyle = hairG; c.strokeStyle = oln; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(-r - 1, 0); c.arc(0, 0, r + 1, Math.PI, 2 * Math.PI); c.quadraticCurveTo(0, -r * 0.55, -r - 1, 0); c.closePath(); c.fill(); c.stroke();
    if (K.acc === 'curly') for (let i = 0; i < 6; i++) { const a = Math.PI * (1.08 + i * 0.168); c.beginPath(); c.arc(Math.cos(a) * (r + 1), Math.sin(a) * (r + 1), 4.6, 0, 6.3); c.fill(); c.stroke(); }
  }
  // face
  const lk = Math.hypot(look[0], look[1]) || 1, lx = look[0] / lk * 1.3, ly = look[1] / lk * 1.1;
  for (const sx of [-1, 1]) {
    c.fillStyle = '#fff'; c.strokeStyle = 'rgba(40,30,40,.35)'; c.lineWidth = 0.8; c.beginPath(); c.arc(sx * 6.2, 3.5, 3.9, 0, 6.3); c.fill(); c.stroke();
    c.fillStyle = '#25202e'; c.beginPath(); c.arc(sx * 6.2 + lx, 3.5 + ly, 2.2, 0, 6.3); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(sx * 6.2 + lx + 0.8, 3.5 + ly - 0.8, 0.85, 0, 6.3); c.fill();
    c.fillStyle = 'rgba(255,110,130,.3)'; c.beginPath(); c.arc(sx * 11, 9, 2.8, 0, 6.3); c.fill();
  }
  c.strokeStyle = '#7a3b2e'; c.lineWidth = 1.5;
  if (o.talk && Math.sin(tn * 14) > 0) { c.fillStyle = '#7a2f3a'; c.beginPath(); c.ellipse(0, 10.5, 3.3, 2.7, 0, 0, 6.3); c.fill(); }
  else if (mood === 0) { c.beginPath(); c.arc(0, 14.5, 4, 1.2 * Math.PI, 1.8 * Math.PI); c.stroke(); }
  else { c.beginPath(); c.arc(0, 8, 4.8, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke(); }
  if (K.acc === 'glasses' || K.acc === 'gran') {
    c.strokeStyle = '#3a3040'; c.lineWidth = 1.3;
    for (const sx of [-1, 1]) { c.beginPath(); c.arc(sx * 6.2, 3.5, 5.4, 0, 6.3); c.stroke(); }
    c.beginPath(); c.moveTo(-1, 3); c.lineTo(1, 3); c.stroke();
  }
  if (K.acc === 'phones') {
    c.strokeStyle = '#1f2433'; c.lineWidth = 3.4; c.beginPath(); c.arc(0, -1, r + 3, Math.PI * 1.04, Math.PI * 1.96); c.stroke();
    for (const sx of [-1, 1]) { c.fillStyle = '#e8ecf5'; c.strokeStyle = '#1f2433'; c.lineWidth = 1.4; c.beginPath(); c.ellipse(sx * (r + 3), 3, 4, 6.2, 0, 0, 6.3); c.fill(); c.stroke(); }
  }
  if (o.name) {
    const fs = o.fs || 12.5; c.font = `800 ${fs}px Nunito, ui-rounded, system-ui, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    const tw = c.measureText(o.name).width + 8;
    c.fillStyle = 'rgba(10,12,20,.6)'; rr(c, -tw / 2, 28 - fs * 0.62, tw, fs * 1.24, fs * 0.62); c.fill();
    c.fillStyle = '#fff'; c.fillText(o.name, 0, 28.5);

  c.restore();
}

// --- lightbulb, thread, talk ring ---------------------------------------------------------------------------------
function drawBulb(c, x, y, sc, glow) {
  c.save(); c.translate(x, y); c.scale(sc, sc);
  const g = c.createRadialGradient(0, 0, 2, 0, 0, 22); g.addColorStop(0, `rgba(255,220,100,${0.5 * glow})`); g.addColorStop(1, 'rgba(255,220,100,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, 22, 0, 6.3); c.fill();
  c.fillStyle = '#8b8fa0'; c.strokeStyle = '#4b4f60'; c.lineWidth = 1; rr(c, -3.6, 6, 7.2, 5, 1.5); c.fill(); c.stroke();
  const b = c.createRadialGradient(-2.5, -3, 1, 0, 0, 9); b.addColorStop(0, '#fffbd0'); b.addColorStop(0.6, '#ffd84a'); b.addColorStop(1, '#f0a81c');
  c.fillStyle = b; c.strokeStyle = '#b57a0a'; c.lineWidth = 1.2; c.beginPath(); c.arc(0, 0, 7.6, 0, 6.3); c.fill(); c.stroke();
  c.restore();
}
const ptq = (P1, C, P2, u) => [(1 - u) * (1 - u) * P1[0] + 2 * (1 - u) * u * C[0] + u * u * P2[0], (1 - u) * (1 - u) * P1[1] + 2 * (1 - u) * u * C[1] + u * u * P2[1]];
function drawThread(c, th, tn) {
  const P1 = KP[th.a], P2 = KP[th.b], dx = P2[0] - P1[0], dy = P2[1] - P1[1], L = Math.hypot(dx, dy) || 1;
  const bow = th.a < th.b ? 16 : -16;
  const C = [CX + ((P1[0] + P2[0]) / 2 - CX) * 0.3 - dy / L * bow, CY + ((P1[1] + P2[1]) / 2 - CY) * 0.3 + dx / L * bow];
  const u0 = Math.min(0.3, 22 / L), u1 = 1 - u0;
  const run = (ua, ub) => { c.beginPath(); for (let i = 0; i <= 22; i++) { const [X, Y] = ptq(P1, C, P2, ua + (ub - ua) * i / 22); if (i) c.lineTo(X, Y); else c.moveTo(X, Y); } };
  if (th.cut) {
    const k = clamp((tn - th.cut) / 2, 0, 1); c.save(); c.globalAlpha = 1 - k; c.setLineDash([4, 5]); c.lineWidth = 2; c.strokeStyle = 'rgba(170,175,195,.8)';
    run(u0, 0.44); c.stroke(); run(0.56, u1); c.stroke(); c.restore(); return;
  }
  const prog = easeOut((tn - th.t0) / 0.45), ue = u0 + (u1 - u0) * prog, wd = 2 + Math.min(th.w - 1, 4) * 0.9;
  const g = c.createLinearGradient(P1[0], P1[1], P2[0], P2[1]); g.addColorStop(0, KS[th.a].col); g.addColorStop(1, KS[th.b].col);
  c.save(); c.lineCap = 'round';
  c.globalAlpha = 0.22; c.strokeStyle = g; c.lineWidth = wd + 6; run(u0, ue); c.stroke();
  c.globalAlpha = 1; c.lineWidth = wd; run(u0, ue); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1; run(u0, ue); c.stroke();
  const age = tn - th.pulse;
  if (age < 0.7 && prog >= 1) { const [X, Y] = ptq(P1, C, P2, u0 + (u1 - u0) * (age / 0.7)); c.fillStyle = '#fff'; c.shadowColor = '#fff'; c.shadowBlur = 8; c.beginPath(); c.arc(X, Y, 3.2, 0, 6.3); c.fill(); }

}
function drawRing(c, x, y, K, rv, tn, pulse) {
  if (rv < 0.05) return;
  const R = 23 + Math.min(rv, 12) * 1.55 + Math.max(0, 1 - (tn - pulse) / 0.5) * 3;
  c.save(); c.strokeStyle = rgba(K.col, 0.9); c.shadowColor = K.col; c.shadowBlur = 9; c.lineWidth = 2 + Math.min(rv, 12) * 0.28;
  c.beginPath(); c.arc(x, y + 2, M0(R), 0, 6.3); c.stroke(); c.restore();
}

// --- the table scene (views 1-3 and the talking stick) -----------------------------------------------------------------
function drawTable(c, s, dt, tn, sim, hi, marker) {
  for (let i = 0; i < 6; i++) {
    sim.rv[i] += (sim.talk[i] - sim.rv[i]) * Math.min(1, dt * 4);
    sim.gl[i] += (((hi === i) ? 1 : 0) - sim.gl[i]) * Math.min(1, dt * 8);
    sim.dm[i] += ((tn < sim.dimUntil[i] ? 1 : 0) - sim.dm[i]) * Math.min(1, dt * 6);
  }
  sim.th = sim.th.filter((t) => !t.cut || tn - t.cut < 2.2);
  const kid = (i) => {
    const [x, y] = KP[i], K = KS[i];
    drawRing(c, x, y, K, sim.rv[i], tn, sim.pulse[i]);
    const bounce = hi === i ? Math.sin(tn * 5) * 1.2 : 0;
    drawKid(c, x, y + bounce, 1 + 0.1 * sim.gl[i], K, { look: [CX - x, CY - y], glow: Math.max(sim.gl[i], 0.7 * Math.max(0, 1 - (tn - sim.pulse[i]) / 0.9)),
      name: T[lang].kids[i], fs: 12.5 / s, tn, talk: hi === i && tn - sim.pulse[i] < 1.4 });
    if (sim.dm[i] > 0.02) { c.fillStyle = `rgba(14,12,24,${0.55 * sim.dm[i]})`; c.beginPath(); c.arc(x, y, 20, 0, 6.3); c.fill(); c.beginPath(); c.ellipse(x, y + 28, 24, 14, 0, 0, 6.3); c.fill(); }
  };
  TOPSET.forEach(kid);
  // table, warm wood with a soft shadow
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 22; c.shadowOffsetY = 10;
  const wg = c.createLinearGradient(CX - 70, CY - 60, CX + 70, CY + 70); wg.addColorStop(0, '#d9a066'); wg.addColorStop(0.5, '#b97c43'); wg.addColorStop(1, '#8a5a2e');
  c.fillStyle = wg; c.beginPath(); c.ellipse(CX, CY, 88, 71, 0, 0, 6.3); c.fill(); c.restore();
  c.strokeStyle = '#5e3a1b'; c.lineWidth = 2; c.beginPath(); c.ellipse(CX, CY, 88, 71, 0, 0, 6.3); c.stroke();
  c.strokeStyle = 'rgba(255,230,190,.28)'; c.lineWidth = 1.2; c.beginPath(); c.ellipse(CX, CY, 82, 65, 0, 3.4, 5.5); c.stroke();
  c.strokeStyle = 'rgba(70,40,15,.22)'; c.lineWidth = 1;
  for (const k of [18, 34, 50]) { c.beginPath(); c.ellipse(CX, CY, k * 1.55, k * 1.22, 0, 0.3, 2.6); c.stroke(); c.beginPath(); c.ellipse(CX, CY, k * 1.4, k * 1.1, 0, 3.6, 5.9); c.stroke(); }
  for (const th of sim.th) drawThread(c, th, tn);
  sim.bulbs.slice(0, 14).forEach((b, i) => {
    const a = clamp((tn - b.born) / 0.7, 0, 1), e = easeBack(a), rad = Math.sqrt(i + 0.5) * 14.5;
    const bx = CX + Math.cos(i * 2.399) * Math.min(rad * 1.12, 62), by = CY + Math.sin(i * 2.399) * Math.min(rad * 0.82, 48);
    drawBulb(c, bx, by - (1 - easeOut(a)) * 36, M0(0.35 + 0.65 * e), 0.7 + 0.5 * Math.max(0, 1 - a));
  });
  BOTSET.forEach(kid);
  if (marker === 'arrow' && hi >= 0) {
    const [x, y] = KP[hi], by = Math.sin(tn * 5) * 2.5;
    c.save(); c.fillStyle = '#ffd84a'; c.strokeStyle = '#8a6a0a'; c.lineWidth = 1.5; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(x - 7, y - 40 + by); c.lineTo(x + 7, y - 40 + by); c.lineTo(x, y - 30 + by); c.closePath(); c.fill(); c.stroke(); c.restore();
  }
  if (marker === 'stick' && S.stick) {
    const st = S.stick, [tx, ty] = KP[st.holder];
    st.sx += (tx + 24 - st.sx) * Math.min(1, dt * 5); st.sy += (ty + 8 - st.sy) * Math.min(1, dt * 5);
    c.save(); c.translate(st.sx, st.sy); c.rotate(0.45 + Math.sin(tn * 3) * 0.04);
    const sg = c.createLinearGradient(-4, 0, 4, 0); sg.addColorStop(0, '#d9a066'); sg.addColorStop(1, '#8a5a2e');
    c.fillStyle = sg; c.strokeStyle = '#4a2c12'; c.lineWidth = 1.4; rr(c, -3.6, -30, 7.2, 60, 3.6); c.fill(); c.stroke();
    ['#ff6b6b', '#ffd84a', '#5fd0a0'].forEach((col, i) => { c.fillStyle = col; c.beginPath(); c.ellipse(5, -24 + i * 6, 3.4, 5.2, 0.5, 0, 6.3); c.fill(); });
    c.restore();
  }
}

// --- the secret scene: Gran and Sam with two thought bubbles ----------------------------------------------------------
function drawGen(c, s, dt, tn) {
  const G = S.gen, t = T[lang].gen, tx = (i) => (i === 0 ? 92 : 268);
  for (let side = 0; side < 2; side++) {
    const x0 = side === 0 ? 8 : 184, K = side === 0 ? GRAN : SAM, ideas = side === 0 ? G.gi : G.ti, pool = side === 0 ? t.ideasG : t.ideasT;
    const shake = G.flash && G.flash.side === side && tn - G.flash.at < 0.6 ? Math.sin((tn - G.flash.at) * 40) * 3 : 0;
    c.save(); c.translate(shake, 0);
    c.fillStyle = 'rgba(255,255,255,.07)'; c.strokeStyle = G.flash && G.flash.side === side && tn - G.flash.at < 1.4 ? '#ff8fa3' : rgba(K.col, 0.6); c.lineWidth = 2;
    rr(c, x0, 46, 168, 150, 26); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.07)'; c.beginPath(); c.arc(tx(side), 208, 6, 0, 6.3); c.fill(); c.stroke(); c.beginPath(); c.arc(tx(side) + 2, 226, 3.5, 0, 6.3); c.fill(); c.stroke();
    if (!ideas.length) { c.font = `800 ${14 / s}px Nunito, sans-serif`; c.fillStyle = 'rgba(200,205,225,.5)'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('…', x0 + 84, 120); }
    ideas.forEach((id, i) => {
      const a = easeBack((tn - id.born) / 0.5), txt = pool[id.k];
      c.font = `800 ${12.5 / s}px Nunito, ui-rounded, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
      const w = Math.min(152, c.measureText(txt).width + 16), cx = x0 + 84, cy = 66 + i * 32;
      c.save(); c.translate(cx, cy); c.scale(M0(a), M0(a));
      const pg = c.createLinearGradient(0, -12, 0, 12); pg.addColorStop(0, light(K.shirt, 0.15)); pg.addColorStop(1, shade(K.shirt, 0.25));
      c.fillStyle = pg; c.strokeStyle = K.col; c.lineWidth = 1.4; rr(c, -w / 2, -12, w, 24, 12); c.fill(); c.stroke();
      c.fillStyle = '#fff'; c.fillText(txt, 0, 0.5, w - 10); c.restore();
    });
    c.restore();
  }
  const frown = G.flash && tn - G.flash.at < 1.4 ? G.flash.side : -1;
  drawKid(c, 92, 276, 1.55, GRAN, { look: [1, 0.2], mood: frown === 0 ? 0 : 1, glow: G.speaker === 0 ? 0.8 : 0, name: t.names[0], fs: 12.5 / (s * 1.55), tn, talk: G.speaker === 0 && !G.over });
  drawKid(c, 268, 276, 1.55, SAM, { look: [-1, 0.2], mood: frown === 1 ? 0 : 1, glow: G.speaker === 1 ? 0.8 : 0, name: t.names[1], fs: 12.5 / (s * 1.55), tn, talk: G.speaker === 1 && !G.over });
}

// --- main loop --------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt) => {
  const tn = now(), s = Math.min(w / W0, h / H0), m = mode();
  S.dt = dt;
  const g = c.createRadialGradient(w / 2, h * 0.5, 10, w / 2, h * 0.5, Math.max(w, h) * 0.7); g.addColorStop(0, '#2b2036'); g.addColorStop(1, '#0d0b16');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  // view 1 playback
  const v = S.v1;
  if (v.play && m === 'star') {
    const pl = v.play; pl.acc += dt;
    if (pl.acc >= STEP && pl.i < EV[pl.which].length) {
      pl.acc -= STEP; const e = EV[pl.which][pl.i++], sim = v.sims[pl.which];
      act(sim, e[0], e[1], { idea: e[2], talk: e[3], b: e[4] }); v.cur = e[0]; (e[2] ? sfx.good : sfx.tick)(); renderStats();
    } else if (pl.i >= EV[pl.which].length && pl.acc >= 0.9) { finishPlay(); }
  }
  c.save(); c.translate((w - W0 * s) / 2, (h - H0 * s) / 2); c.scale(s, s);
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (m === 'gen') drawGen(c, s, dt, tn);
  else drawTable(c, s, dt, tn, curSim(), curHi(), m === 'stick' ? 'stick' : (m === 'move' || m === 'talk') ? 'arrow' : null);
  c.restore();
});

// --- view 1 logic ----------------------------------------------------------------------------------------------------
function startPlay(which) {
  const v = S.v1; v.sims[which] = mkSim(); v.show = which; v.play = { which, i: 0, acc: 0.3 }; v.cur = -1;
  v.phase = which === 'A' && v.phase !== 'done' ? 'playA' : 'playB'; sfx.click(); render();
}
function finishPlay() {
  const v = S.v1, w = v.play.which; v.play = null; v.cur = -1;
  if (w === 'A' && v.phase === 'playA') v.phase = 'predict'; else v.phase = 'done';
  if (v.phase === 'done') sfx.good();
  render();
}

// --- view 2 logic ----------------------------------------------------------------------------------------------------
function reset2() {
  const sim = mkSim(); act(sim, 0, null, { idea: 1, talk: 1 });
  S.v2 = { sim, k: 0, prev: 0, over: false, last: null };
  setSay(0, T[lang].v2.open);
}
function quietest(sim, not) {
  let best = -1;
  for (let i = 0; i < 6; i++) if (i !== not && (best < 0 || sim.talk[i] < sim.talk[best])) best = i;
  return best;
}
function move2(key) {
  const v = S.v2, t = T[lang].v2, sp = SP2[v.k], p = v.prev, sim = v.sim;
  let say;
  if (key === 'build') { act(sim, sp, p, { idea: 1, talk: 1, b: 1 }); v.prev = sp; say = t.moves.build[1]; sfx.good(); }
  else if (key === 'disagree') { act(sim, sp, p, { idea: 1, talk: 1, b: 1 }); v.prev = sp; say = t.moves.disagree[1]; sfx.good(); }
  else if (key === 'ask') {
    const q = quietest(sim, sp), kn = T[lang].kids[q];
    act(sim, sp, q, { talk: 0.5, b: 1 }); act(sim, q, sp, { idea: 1, talk: 1, b: 1 }); v.prev = q; say = t.moves.ask(kn)[1]; sfx.good();
    const me = v; setTimeout(() => { if (S.v2 === me && S.say && S.say.i === sp) setSay(q, t.reply); }, 1300);
  } else if (key === 'subject') { act(sim, sp, null, { idea: 1, talk: 1 }); cutLast(sim); v.prev = sp; say = t.moves.subject[1]; sfx.bad(); }
  else if (key === 'repeat') { act(sim, sp, null, { talk: 2.5 }); dimOthers(sim, sp, 3); v.prev = sp; say = t.moves.repeat[1]; sfx.bad(); }
  else { act(sim, sp, null, { talk: 2 }); sim.dimUntil[p] = now() + 3; cutLast(sim); say = t.moves.interrupt[1]; v.prev = sp; sfx.bad(); }
  v.last = key; setSay(sp, say);
  v.k++; if (v.k >= 6) v.over = true;
  render();
}

// --- view 3 logic ----------------------------------------------------------------------------------------------------
function reset3() { S.v3 = { sim: mkSim(), i: 0, ans: null, ok: 0, over: false, hi: -1 }; showCard3(); }
function showCard3() {
  const v = S.v3; if (v.i >= 10) return;
  const ci = ORDER3[v.i]; v.hi = C3[ci][1]; v.ans = null;
  setSay(v.hi, T[lang].v3.cards[ci][0]);
}
function answer3(builds) {
  const v = S.v3, ci = ORDER3[v.i], c3 = C3[ci], right = (c3[0] === 1) === builds, sim = v.sim;
  v.ans = builds ? 'b' : 's'; if (right) v.ok++;
  if (c3[0] === 1) {
    act(sim, c3[1], c3[2], { idea: c3[3], talk: 1, b: 1 });
    if (ci === 4) act(sim, 1, 0, { idea: 1, talk: 1, b: 1 });
  } else {
    act(sim, c3[1], c3[2], { talk: ci === 7 ? 2.5 : 1 }); cutLast(sim);
    if (ci === 7) dimOthers(sim, c3[1], 2.5);
  }
  (right ? sfx.good : sfx.bad)(); render();
}

// --- secret: the talking stick -----------------------------------------------------------------------------------------
function resetStick() { S.stick = { sim: mkSim(), holder: 0, passes: 0, sx: KP[0][0] + 24, sy: KP[0][1] + 8 }; S.say = null; sayEl.hidden = true; }
function passStick() {
  const st = S.stick; if (st.passes >= 12) return;
  const prev = (st.holder + 5) % 6;
  act(st.sim, st.holder, st.passes ? prev : null, { idea: 1, talk: 1, b: st.passes ? 1 : 0 });
  setSay(st.holder, T[lang].stick.sayText); st.holder = (st.holder + 1) % 6; st.passes++; sfx.good(); render();
}

// --- secret: Gran and Sam -----------------------------------------------------------------------------------------------
function resetGen() { S.gen = { r: 0, gi: [], ti: [], listens: 0, speaker: 1, over: false, flash: null }; S.say = null; sayEl.hidden = true; }
function pickGen(i) {
  const G = S.gen, t = T[lang].gen, opt = t.rounds[G.r][i], sp = G.speaker, tn = now();
  setSay(sp, opt[0], true);
  if (opt[1]) { G.gi.push({ k: G.listens, born: tn }); G.ti.push({ k: G.listens, born: tn }); G.listens++; G.lastOk = true; sfx.good(); }
  else { G.flash = { side: 1 - sp, at: tn }; G.lastOk = false; sfx.bad(); }
  G.r++; G.speaker = 1 - sp; if (G.r >= 4) G.over = true;
  render();
}

// --- controls ---------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v1 = S.v1;
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) { S.sec = null; S.say = null; }
    else { S.sec = k; if (k === 'stick') resetStick(); else resetGen(); sfx.click(); }
    render(); return;
  }
  if (a === 'playA') { startPlay('A'); showStage(); }
  else if (a === 'guess') { v1.guess = b.dataset.g; startPlay('B'); showStage(); }
  else if (a === 'replay') { const w = b.dataset.w, ph = v1.phase; startPlay(w); v1.phase = ph === 'done' || ph === 'playB' ? 'playB' : v1.phase; v1.replay = true; }
  else if (a === 'again1') { v1.phase = 'start'; v1.guess = null; v1.sims = { A: null, B: null }; v1.show = 'A'; v1.play = null; sfx.click(); render(); }
  else if (a === 'mv') { move2(b.dataset.k); showStage(); }
  else if (a === 'again2') { reset2(); sfx.click(); render(); }
  else if (a === 'card') { answer3(b.dataset.k === 'b'); showStage(); }
  else if (a === 'next3') { S.v3.i++; if (S.v3.i >= 10) { S.v3.over = true; S.v3.hi = -1; S.say = null; sfx.good(); } else showCard3(); sfx.click(); render(); }
  else if (a === 'again3') { reset3(); sfx.click(); render(); }
  else if (a === 'pass') passStick();
  else if (a === 'again4') { resetStick(); sfx.click(); render(); }
  else if (a === 'gpick') { pickGen(+b.dataset.i); showStage(); }
  else if (a === 'again5') { resetGen(); sfx.click(); render(); }
});

// --- readouts, ctrl panels, state card ----------------------------------------------------------------------------------------
function statsOf() {
  const m = mode(), t = T[lang];
  if (m === 'gen') { const G = S.gen; return { ideas: G.gi.length + G.ti.length, built: G.listens, heard: G.listens / 4 }; }
  const sim = curSim(); return { ideas: sim.ideas, built: sim.built, heard: heardOf(sim) };
}
function renderStats() {
  const t = T[lang], st = statsOf();
  lab.setReadout(String(st.ideas), t.stIdeas, t.builtPill(st.built), '#f2b84b');
  $('dwHL').textContent = t.stHeard; $('dwHF').style.width = `${Math.round(st.heard * 100)}%`; $('dwHP').textContent = `${Math.round(st.heard * 100)}%`;
}
function cmpHTML(t) {
  const v = S.v1, ks = v.phase === 'done' ? ['A', 'B'] : v.phase === 'predict' ? ['A'] : [];
  if (!ks.length) return '';
  return `<div class="dw-cmp">${ks.map((k) => { const sim = v.sims[k];
    return `<div><h4>${esc(t.v1.cmp(k))}</h4><div class="n">${sim.ideas}</div><div class="u">${esc(t.v1.ideasU)}</div>
      <div class="bars">${sim.talk.map((x, i) => `<i style="height:${Math.round(clamp(x / 12, 0.04, 1) * 40)}px;background:${KS[i].col}" title="${esc(t.kids[i])}"></i>`).join('')}</div>
      <div class="u">${esc(t.v1.timeU)}</div></div>`; }).join('')}</div>`;
}
function render() {
  const t = T[lang], m = mode(), v = lab.view;
  const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
  show('dwV1', m === 'star'); show('dwV2', m === 'move'); show('dwV3', m === 'talk'); show('dwSt', m === 'stick'); show('dwGn', m === 'gen');
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}" style="min-height:36px">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('dwSec').innerHTML = sc('stick', '🪵') + sc('gen', '👵');
  if (m === 'star') renderV1(t); else if (m === 'move') renderV2(t); else if (m === 'talk') renderV3(t); else if (m === 'stick') renderStick(t); else renderGen(t);
  const f = t.facts[v]; lab.setFacts([{ emo: '💡', text: f.text, src: f.src }]);
  renderStats(); drawSay();
}
function renderV1(t) {
  const v = S.v1, q = t.v1, el = $('dwV1');
  sayEl.hidden = true; S.say = null;
  if (v.phase === 'start') {
    lab.setState({ emo: '🕸️', title: q.t0, lead: q.l0(t.q), body: '', extra: '' });
    el.innerHTML = `<p class="dw-note">${esc(t.q)}</p><div class="dw-opts one"><button class="dw-b" data-act="playA">${esc(q.watchA)}</button></div>`;
  } else if (v.phase === 'playA' || v.phase === 'playB') {
    lab.setState({ emo: '👀', title: q.watching(v.show), lead: v.guess ? q.guessed(q.opts[v.guess]) + ' ' + q.watchingL : q.watchingL, body: '', extra: '' });
    el.innerHTML = `${cmpHTML(t)}<p class="dw-note">${esc(q.note)}</p>`;
  } else if (v.phase === 'predict') {
    lab.setState({ emo: '🤔', title: q.askT, lead: q.askL, body: '', extra: '' });
    el.innerHTML = `${cmpHTML(t)}<p class="dw-q">${esc(q.askQ)}</p><div class="dw-opts three">${['A', 'B', 'S'].map((g) => `<button class="dw-b" data-act="guess" data-g="${g}">${esc(q.opts[g])}</button>`).join('')}</div>`;
  } else {
    const ok = v.guess === 'B', a = v.sims.A.ideas, b = v.sims.B.ideas;
    lab.setState({ emo: ok ? '✅' : '🕸️', title: ok ? q.right : q.wrong, lead: q.done(a, b), body: '', extra: '' });
    el.innerHTML = `${cmpHTML(t)}<div class="row2" style="margin-top:0"><button class="chip" data-act="replay" data-w="A" style="min-height:36px">${esc(q.replay('A'))}</button><button class="chip" data-act="replay" data-w="B" style="min-height:36px">${esc(q.replay('B'))}</button><button class="chip" data-act="again1" style="min-height:36px">${esc(q.again)}</button></div>`;
  }
}
function renderV2(t) {
  if (!S.v2) reset2();
  const v = S.v2, q = t.v2, el = $('dwV2');
  if (!v.over) {
    const sp = SP2[v.k], n = t.kids[sp], prev = t.kids[v.prev];
    const res = v.last ? q.res[v.last] : null;
    const sp1 = res ? res[0].indexOf(' ') : 0;
    lab.setState(res ? { emo: res[0].slice(0, sp1), title: res[0].slice(sp1 + 1), lead: res[1] + ' ' + q.turnL(n, v.k + 1, prev), body: '', extra: '' }
      : { emo: '🧵', title: q.turnT(n), lead: q.turnL(n, v.k + 1, prev), body: '', extra: '' });
    const quiet = t.kids[quietest(v.sim, sp)];
    el.innerHTML = `<p class="dw-q">${esc(q.turnT(n))}</p><div class="dw-opts">${MOVESETS[v.k].map((k) => {
      const lbl = k === 'ask' ? q.moves.ask(quiet)[0] : q.moves[k][0];
      return `<button class="dw-b" data-act="mv" data-k="${k}">${esc(lbl)}</button>`; }).join('')}</div>`;
  } else {
    const sh = shapeOf(v.sim), n = v.sim.th.filter((x) => !x.cut).reduce((a, x) => a + 1, 0), e = q.end[sh](t.th(n), t.idw(v.sim.ideas));
    lab.setState({ emo: sh === 'web' ? '🕸️' : sh === 'star' ? '⭐' : '🧶', title: e[0], lead: e[1], body: '', extra: '' });
    el.innerHTML = `<div class="row2" style="margin-top:0"><button class="chip" data-act="again2" style="min-height:36px">${esc(q.again)}</button></div>`;
  }
}
function renderV3(t) {
  if (!S.v3) reset3();
  const v = S.v3, q = t.v3, el = $('dwV3');
  if (v.over) {
    lab.setState({ emo: '🏆', title: q.endT(v.ok), lead: q.endL, body: '', extra: '' });
    el.innerHTML = `<div class="row2" style="margin-top:0"><button class="chip" data-act="again3" style="min-height:36px">${esc(q.again)}</button></div>`;
    return;
  }
  const ci = ORDER3[v.i], isB = C3[ci][0] === 1, done = v.ans !== null;
  const cls = (k) => !done ? '' : ((k === 'b') === isB ? ' ok' : v.ans === k ? ' bad' : '');
  el.innerHTML = `<p class="dw-prog">${v.i + 1} / 10</p><div class="dw-card">“${esc(q.cards[ci][0])}”</div>
    <div class="dw-opts"><button class="dw-b${cls('b')}" data-act="card" data-k="b"${done ? ' disabled' : ''}>🧵 ${esc(q.builds)}</button><button class="dw-b${cls('s')}" data-act="card" data-k="s"${done ? ' disabled' : ''}>✂️ ${esc(q.stops)}</button></div>
    ${done ? `<div class="row2"><button class="btn" data-act="next3">${esc(q.next)}</button></div>` : ''}`;
  if (!done) setSay(v.hi, q.cards[ci][0]);
  if (!done) lab.setState({ emo: '💬', title: q.q, lead: `${t.kids[C3[ci][1]]}: “${q.cards[ci][0]}”`, body: '', extra: '' });
  else { const ok = (v.ans === 'b') === isB; lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? q.right : q.wrong, lead: `${isB ? q.isB : q.isS} ${q.cards[ci][1]}`, body: '', extra: '' }); }
}
function renderStick(t) {
  const st = S.stick, q = t.stick, el = $('dwSt'), done = st.passes >= 12;
  if (st.passes === 0) lab.setState({ emo: '🪵', title: q.t0, lead: q.l0, body: '', extra: '' });
  else if (st.passes === 6) lab.setState({ emo: '🤝', title: q.endT, lead: q.endL, body: '', extra: '' });
  else if (done) lab.setState({ emo: '🤝', title: q.end2, lead: q.end2L, body: '', extra: '' });
  else lab.setState({ emo: '🪵', title: q.holds(t.kids[st.holder]), lead: q.mid(Math.min(st.passes, 6)), body: '', extra: '' });
  el.innerHTML = `<div class="dw-opts one">${done ? '' : `<button class="dw-b" data-act="pass">${esc(q.pass)}</button>`}</div>
    <div class="row2"><button class="chip" data-act="again4" style="min-height:36px">${esc(q.again)}</button></div>`;
}
function renderGen(t) {
  const G = S.gen, q = t.gen, el = $('dwGn');
  if (G.r === 0) lab.setState({ emo: '👵', title: q.t0, lead: `${q.q} ${q.l0}`, body: '', extra: '' });
  else if (G.over) lab.setState({ emo: '🌱', title: q.endT(G.listens), lead: q.endL(G.listens), body: '', extra: '' });
  else lab.setState(G.lastOk ? { emo: '🌱', title: q.listenT, lead: q.listenL, body: '', extra: '' } : { emo: '😕', title: q.skipT, lead: q.skipL, body: '', extra: '' });
  if (G.over) el.innerHTML = `<div class="row2" style="margin-top:0"><button class="chip" data-act="again5" style="min-height:36px">${esc(q.again)}</button></div>`;
  else el.innerHTML = `<p class="dw-q">${esc(q.q)}</p><p class="dw-note">${esc(q.turn(q.names[G.speaker], G.r + 1))}</p>
    <div class="dw-opts one">${q.rounds[G.r].map((o, i) => `<button class="dw-b" data-act="gpick" data-i="${i}">${esc(o[0])}</button>`).join('')}</div>`;
}

reset2(); reset3(); resetStick(); resetGen(); S.say = null;
render();
</script>
