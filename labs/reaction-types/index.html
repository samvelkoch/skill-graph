let SC = 1, DW = 343, DH = 300;
function pill(c, text, x, y, o = {}) {
  const fs = 12 / SC, lines = Array.isArray(text) ? text : [text];
  c.save(); c.font = `800 ${fs}px Nunito, system-ui, sans-serif`; c.textBaseline = 'middle';
  const lw = Math.max(...lines.map((l) => c.measureText(l).width)), pw = lw + 14 / SC, lh = fs + 2 / SC, ph = lines.length * lh + 8 / SC;
  let px = o.align === 'left' ? x : o.align === 'right' ? x - pw : x - pw / 2;
  px = clamp(px, 3 / SC, Math.max(3 / SC, DW - pw - 3 / SC));
  const py = clamp(y - ph / 2, 3 / SC, Math.max(3 / SC, DH - ph - 3 / SC));
  c.fillStyle = o.bg || 'rgba(10,12,22,.8)'; rr(c, px, py, pw, ph, Math.min(ph / 2, 10 / SC)); c.fill();
  c.fillStyle = o.color || '#EDEFF7'; c.textAlign = 'center';
  lines.forEach((l, i) => c.fillText(l, px + pw / 2, py + 4 / SC + lh * (i + 0.5)));
  c.restore();
}

// --- the loop ------------------------------------------------------------------------------------------------
let WH = 220;

  S.cloth = appr(S.cloth, S.ans.rust != null ? 1 : 0, dt * 1.0);
  if (S.delay > 0) S.delay -= dt;
  else {
    if (S.airT != null) { S.air = appr(S.air, S.airT, dt * 0.4); if (S.air === S.airT) S.airT = null; }
    if (S.daysT != null) { S.days = appr(S.days, S.daysT, dt * 1.4); if (S.days === S.daysT) S.daysT = null; }
    if (S.heatT != null) { S.heat = appr(S.heat, S.heatT, dt * 0.22); if (S.heat === S.heatT) S.heatT = null; }
    if (S.tpT != null) { S.tp = appr(S.tp, S.tpT, dt * (m === 'thermite' ? 0.13 : m === 'flask' ? 0.11 : 0.2)); if (S.tp === S.tpT) S.tpT = null; }

  if (wh !== WH) { WH = wh; $('stage').style.setProperty('--wh', wh + 'px'); }
  const sh = h - WH, s = clamp(Math.min(w / 343, sh / 300), 0.8, 1.4), m = mode();
  c.save(); rr(c, 0, 0, w, h, 18); c.clip(); c.fillStyle = '#0a0d18'; c.fillRect(0, 0, w, h);
  c.save(); c.beginPath(); c.rect(0, 0, w, sh); c.clip(); c.scale(s, s); SC = s; DW = w / s; DH = sh / s;

  else if (m === 'swap') sceneSwap(c, DW, DH, t, dt); else if (m === 'thermite') sceneThermite(c, DW, DH, t, dt); else sceneFlask(c, DW, DH, t, dt);

function chip(act, v, label, on, extra = '', dis = false) { return `<button class="chip xx-chip ${on ? 'on' : ''}" data-act="${act}" data-v="${v}"${dis ? ' disabled' : ''}>${extra}${esc(label)}</button>`; }
function eqHTML(R) {
  const t = T[lang], ui = t.ui, bc = countOf(R.b), ac = countOf(R.a), els = ELORD.filter((e) => bc[e] || ac[e]);
  const word = R.word ? R.word[lang] : `${wordOf(R.b)} → ${wordOf(R.a)}`;
  const note = R.wax ? t.notes.flask : R === RX.rust ? t.notes.rust : '';
  return `<p class="xx-ln"><small>${esc(ui.eqWord)}</small>${esc(word)}</p>
    <p class="xx-ln sym"><small>${esc(ui.eqSym)}</small>${esc(symOf(R.b))} → ${esc(symOf(R.a))}</p>
    <table class="xx-tab"><tr><th>${esc(ui.cols[0])}</th><th>${esc(ui.cols[1])}</th><th>${esc(ui.cols[2])}</th><th></th></tr>
    ${els.map((e) => `<tr><td><i class="xx-dot" style="background:${EL[e].c}"></i><b>${e}</b>${esc(t.el[e])}</td><td>${bc[e] || 0}</td><td>${ac[e] || 0}</td><td class="t">${(bc[e] || 0) === (ac[e] || 0) ? '✓' : ''}</td></tr>`).join('')}</table>${note ? `<div class="xx-note">${esc(note)}</div>` : ''}`;
}
function render() {
  const t = T[lang], ui = t.ui, m = mode(), v = lab.view, asking = isAsking(), open = secret.unlocked();
  S.rk = rKey(); S.hudKey = '';
  document.querySelectorAll('.xx-c').forEach((el) => { el.hidden = !el.dataset.m.split(' ').includes(m); });
  const txt = (id, s) => { const e = $(id); if (e) e.textContent = s; };
  txt('lAir', ui.air); txt('eAir0', ui.airE[0]); txt('eAir1', ui.airE[1]); txt('lScr', ui.scrub); txt('eScr0', ui.scrubE[0]); txt('eScr1', ui.scrubE[1]); txt('bRep', ui.replay);
  txt('lDay', ui.days); txt('eDay0', ui.daysE[0]); txt('eDay1', ui.daysE[1]); txt('lHeat', ui.heat); txt('eHeat0', ui.heatE[0]); txt('eHeat1', ui.heatE[1]);
  txt('lTime', ui.time); txt('eTim0', ui.timeE[0]); txt('eTim1', ui.timeE[1]); txt('bIgn', ui.ignite);
  $('xAir').disabled = asking; $('xScrub').disabled = false; $('xDays').disabled = asking; $('xHeat').disabled = asking; $('xTime').disabled = m === 'swap' && asking;
  $('gTube').innerHTML = `<span class="xx-lbl">${esc(ui.tube)}</span>` + chip('tube', 'open', ui.tOpen, S.tube === 'open', '', asking) + chip('tube', 'bal', ui.tBal, S.tube === 'bal', '', asking);
  $('gSub').innerHTML = `<span class="xx-lbl">${esc(ui.subs)}</span>` + chip('sb', 'cu', ui.cu, S.sb === 'cu', '', asking) + chip('sb', 'ca', ui.ca, S.sb === 'ca', '', asking);
  $('gMet').innerHTML = `<span class="xx-lbl">${esc(ui.strip)}</span>` + ['Mg', 'Zn', 'Fe', 'Cu'].map((e) => chip('met', e, e, S.m === e, `<i class="xx-dot" style="background:${LADC[e]}"></i>`)).join('');
  $('gSol').innerHTML = `<span class="xx-lbl">${esc(ui.sol)}</span>` + ['Cu', 'Zn', 'Mg'].map((e) => chip('sol', e, MOL[e + 'SO4'].n[lang], S.sol === e, `<i class="xx-dot" style="background:${e === 'Cu' ? '#2f74e0' : '#cfe9f5'}"></i>`)).join('');
  $('gSeal').innerHTML = chip('seal', '1', ui.sealed, S.sealed) + chip('seal', '0', ui.openF, !S.sealed);
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-v="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('xxSec').innerHTML = sc('thermite', '🔥') + sc('flask', '⚖️');
  $('xxEq').hidden = asking; if (!asking) $('xxEq').innerHTML = eqHTML(curR());
  // the question, or the verdict
  askEl.style.display = asking ? '' : 'none';
  if (asking) {
    const q = t.pred[v];
    askEl.innerHTML = `<div class="xx-q">${esc(q.q)}</div>${v === 'swap' ? `<div class="xx-sub">${esc(ui.strip)}: ${esc(swN(S.m))} · ${esc(ui.sol)}: ${esc(swN(S.sol + 'SO4'))}</div>` : ''}
      <div class="xx-opts ${q.opts.length === 2 ? 'two' : ''}">${q.opts.map((o, i) => `<button class="xx-opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  }
  const a = S.ans[v];
  if (!S.sec && a != null) {
    const ok = isRight(v, a), q = t.pred[v];
    const why = v === 'swap' ? (swapReacts() ? q.yes(swN(S.m), swN(S.sol)) : S.m === S.sol ? q.same(swN(S.m)) : q.no(swN(S.m), swN(S.sol))) : q.why;
    verEl.style.display = ''; verEl.innerHTML = `<b class="${ok ? 'ok' : 'no'}">${esc(ok ? ui.ok : ui.no)}</b> ${esc(why)}`;
  } else verEl.style.display = 'none';
  hud();
}

// --- events ----------------------------------------------------------------------------------------------------
askEl.addEventListener('click', (ev) => { const b = ev.target.closest('.xx-opt'); if (b) answer(+b.dataset.i); });
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'xAir') { S.air = v / 100; S.airT = null; S.delay = 0; S.pAuto = true; S.pt = 0; }
  else if (id === 'xScrub') { S.pAuto = false; S.p = v / 100; }
  else if (id === 'xDays') { S.days = v / 100 * 7; S.daysT = null; S.delay = 0; }
  else if (id === 'xHeat') { S.heat = v / 100; S.heatT = null; S.delay = 0; }
  else if (id === 'xTime') { S.tp = v / 100; S.tpT = null; S.delay = 0; }
  else return;
  sfx.tick();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'replay') { S.pAuto = true; S.pt = 0; }
  else if (a === 'tube') { S.tube = v; S.heat = 0; S.heatT = 1; S.delay = 0.2; S.wisps = []; }
  else if (a === 'sb') { S.sb = v; S.heat = 0; S.heatT = 1; S.delay = 0.2; S.wisps = []; }
  else if (a === 'met') { S.m = v; resetSwap(); }
  else if (a === 'sol') { S.sol = v; resetSwap(); }
  else if (a === 'ign') { S.tp = 0; S.tpT = 1; S.delay = 0.2; S.sparks = []; }
  else if (a === 'seal') { S.sealed = v === '1'; S.tp = 0; S.tpT = 1; S.delay = 0.2; S.wisps = []; }
  else if (a === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    S.sec = S.sec === v ? null : v; S.tp = 0; S.delay = 0.3; S.sparks = []; S.wisps = [];
    S.tpT = S.sec ? 1 : (lab.view === 'swap' && S.ans.swap != null ? 1 : null); if (v === 'flask') S.sealed = true;
    if (S.sec) showStage();
  }
  sfx.click(); render();
});
render();
</script>
</body>
</html>
