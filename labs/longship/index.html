// --- logic ---------------------------------------------------------------------------------------------------
function row() {
  const s = S.s;
  if (s.ans === null || s.wind || S.sec) return;
  s.v = Math.min(.75, s.v + .24); s.strokes++;
  if (s.stroke > .7) s.stroke = .0001;
  sfx.tick();
}
function tripTo(id) {
  const t = S.t;
  if (t.ans === null || S.sec) return;
  t.sail = { id, d: 0, dur: clamp(PIN[id].len / 95, 1.8, 5.5) };
  sfx.click();
  render();
}
function step(dt, time) {
  const F = S.f, s = S.s, t = S.t;
  // float: the ship follows the pointer, but not past what the river allows
  const lim = MAXX[F.ship], tgt = Math.min(clamp(F.goal, START, 400), lim);
  F.x += (tgt - F.x) * Math.min(1, dt * 7);
  if (Math.abs(tgt - F.x) < .02) F.x = tgt;
  const at = F.x >= lim - 1.5 && F.goal >= lim - 1;
  if (at && !F.at && F.ans !== null && lab.view === 'float') {
    F.tried[F.ship] = true; F.mark[F.ship] = lim;
    if (F.ship === 'deep') {
      F.shake = 1; sfx.push();
      for (let i = 0; i < 16; i++) F.puffs.push({ x: lim + 6 + Math.random() * 14, y: WY + DRAFT.deep + 2, vx: (Math.random() - .5) * 26, vy: -14 - Math.random() * 22, life: .7 + Math.random() * .6, age: 0, r: 2 + Math.random() * 3 });
    } else sfx.good();
  }
  F.at = at;
  F.shake = Math.max(0, F.shake - dt * 1.6);
  for (const p of F.puffs) { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy *= .97; p.r += dt * 3; }
  F.puffs = F.puffs.filter((p) => p.age < p.life);
  // sail
  s.wk += ((s.wind ? 1 : 0) - s.wk) * Math.min(1, dt * 3);
  if (s.stroke > 0 && s.stroke < 1) s.stroke = Math.min(1, s.stroke + dt / .5);
  if (s.wind) s.v += (1.8 - s.v) * Math.min(1, dt * 1.4); else s.v *= Math.exp(-1.15 * dt);
  if (s.v < .004) s.v = 0;
  s.dist += s.v * dt;
  // trip
  if (t.ans !== null) t.popT += dt;
  if (t.sail) {
    t.sail.d += dt;
    if (t.sail.d >= t.sail.dur) { t.at = t.sail.id; t.visited[t.sail.id] = true; t.sail = null; sfx.good(); }
  }
  // shields
  const SH = S.sh;
  for (let i = 0; i < 6; i++) SH.av[i] += ((SH.on[i] ? 1 : 0) - SH.av[i]) * Math.min(1, dt * 7);
  SH.bg += ((SH.shore ? 1 : 0) - SH.bg) * Math.min(1, dt * 4);
  // sun
  const U = S.sun; U.cx += (U.tx - U.cx) * Math.min(1, dt * 6); U.cy += (U.ty - U.cy) * Math.min(1, dt * 6);
  const inSky = U.ty < 165 && Math.hypot(U.tx - U.cx, U.ty - U.cy) < 14;
  U.f += ((inSky ? 1 : 0) - U.f) * Math.min(1, dt * 3);
}

  const st = floatStatus(), both = F.tried.deep && F.tried.long, deep = F.ship === 'deep';
  const s = st === 'hit' ? (deep ? t.fStuck : t.fLand) : t.fIdle;
  lab.setState({ emo: st === 'hit' ? (deep ? '🚢' : '⛵') : '🌊', title: s[0], lead: s[1], body: both ? (F.ans === OK.float ? t.fRight : t.fWrong) : '', extra: '' });
  lab.setReadout(t.depth[depthIdx()], deep ? t.pick[0] : t.pick[1], st === 'hit' ? (deep ? t.pillStuck : t.pillLand) : '', '#4ea8c8');
  lab.setFacts(both ? [{ emo: '🚢', text: t.fact.float, src: SRC.float }] : []);
}
function renderSail(t) {
  const s = S.s;
  lab.setGlow('rgba(95, 168, 214, .26)');
  askRender('sAsk', t.sq, t.so, s.ans);
  $('sCtl').hidden = s.ans === null;
  $('wOn').textContent = t.wOn; $('wOff').textContent = t.wOff; $('rowB').textContent = t.row;
  $('wOn').classList.toggle('on', s.wind); $('wOff').classList.toggle('on', !s.wind);
  $('rowB').hidden = s.wind;
  if (s.ans === null) {
    lab.setReadout('?', '', '', '#5fa8d6');
    lab.setState({ emo: '🤔', title: t.sq, lead: '', body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const done = s.strokes >= 4, n = Math.floor(s.dist);
  const st = s.wind ? t.sWind : s.v > .1 ? t.sRow : t.sIdle;
  lab.setState({ emo: s.wind ? '💨' : s.v > .1 ? '🚣' : '🌫️', title: st[0], lead: st[1], body: done ? (s.ans === OK.sail ? t.sRight : t.sWrong) : '', extra: '' });
  lab.setReadout(String(n), t.lenSub(n), t.spd[spdClass()], '#5fa8d6');
  lab.setFacts(done ? [{ emo: '🌊', text: t.fact.sail, src: SRC.sail }] : []);
}
function renderTrip(t) {
  const q = S.t;
  lab.setGlow('rgba(242, 193, 78, .24)');
  askRender('tAsk', t.tq, t.to, q.ans);
  $('tCtl').hidden = q.ans === null;
  PLACE_IDS.forEach((id) => {
    const b = $(`pl_${id}`), p = t.places[id];
    b.textContent = q.ans === null ? '' : `${q.visited[id] ? '✓ ' : ''}${p[2]} ${p[0]}`;
    b.classList.toggle('on', (q.sail ? q.sail.id : q.at) === id); b.classList.toggle('seen', !!q.visited[id]);
  });
  if (q.ans === null) {
    lab.setReadout('?', '', '', '#f2c14e');
    lab.setState({ emo: '🤔', title: t.tq, lead: '', body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const id = q.sail ? q.sail.id : q.at, n = Object.keys(q.visited).length;
  if (!id) {
    const r = q.ans === OK.trip ? t.tRight : t.tWrong;
    lab.setState({ emo: q.ans === OK.trip ? '✅' : '🗺️', title: r[0], lead: r[1], body: '', extra: '' });
  } else {
    const p = t.places[id];
    lab.setState({ emo: p[2], title: p[0], lead: p[1], body: '', extra: '' });
  }
  lab.setReadout(String(n), t.tSub, id ? t.places[id][0] : '', '#f2c14e');
  lab.setFacts([{ emo: '🏕️', text: t.fact.trip, src: SRC.trip }]);
}
function renderShield(t) {
  const SH = S.sh, n = SH.on.filter(Boolean).length, [val, sub] = t.shN(n);
  lab.setGlow('rgba(200, 57, 46, .24)');
  $('shoreB').textContent = t.shore; $('seaB').textContent = t.sea; $('shHint').textContent = t.shHint;
  $('shoreB').classList.toggle('on', SH.shore); $('seaB').classList.toggle('on', !SH.shore);
  const st = SH.shore ? t.shShore : t.shSea;
  lab.setState({ emo: '🛡️', title: st[0], lead: st[1], body: '', extra: '' });
  lab.setReadout(val, sub, SH.shore ? '🏝️' : '🌊', '#c8392e'); lab.setFacts([]);
}
function renderSun(t) {
  const found = S.sun.f > .5;
  lab.setGlow('rgba(255, 224, 140, .3)');
  $('sunHint').textContent = t.sunHint; $('sunB').textContent = t.sunAgain;
  const st = found ? t.sun1 : t.sun0;
  lab.setState({ emo: '🧭', title: st[0], lead: st[1], body: '', extra: '' });
  lab.setReadout(found ? '☀️' : '☁️', found ? t.sunSub : '', '', '#f5c84c'); lab.setFacts([]);
}
render();
</script>
