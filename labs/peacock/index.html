// --- the model: 200 males, tail t inherited from the father ±0.05 --------------------------------------------------
function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function measure(pop, ch, pr) { // stats of one generation: mean tail, survival, weights = survival × mating weight, share of the longest 10%
  const w = new Float64Array(N); let sum = 0, sv = 0, tot = 0;
  for (let i = 0; i < N; i++) { const t = pop[i], p = surv(t, pr); sum += t; sv += p; w[i] = p * mate(t, ch); tot += w[i]; }
  const order = Array.from(pop.keys()).sort((a, b) => pop[b] - pop[a]);
  let top = 0; for (let k = 0; k < N / 10; k++) top += w[order[k]];
  return { mean: sum / N, surv: sv / N, share: top / tot, w, t90: pop[order[N / 10 - 1]] };
}
function newRun(ch, pr) {
  const r = mulberry((Math.random() * 2147483647) | 0), pop = new Float64Array(N);
  for (let i = 0; i < N; i++) pop[i] = clamp(0.7 + 0.3 * (r() + r() + r() + r() - 2) * 1.732, 0, TMAX);
  const m = measure(pop, ch, pr);
  return { pop, r, g: 0, ch, pr, m, hist: [m.mean] };
}
function advance(R) { // fathers are drawn by survival × mating weight; each chick's tail = father's ± 0.05
  const cum = new Float64Array(N), np = new Float64Array(N); let s = 0;
  for (let i = 0; i < N; i++) { s += R.m.w[i]; cum[i] = s; }
  for (let k = 0; k < N; k++) {
    const x = R.r() * s; let lo = 0, hi = N - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < x) lo = mid + 1; else hi = mid; }
    np[k] = clamp(R.pop[lo] + (R.r() * 2 - 1) * MUT, 0, TMAX);
  }
  R.pop = np; R.g++; R.m = measure(np, R.ch, R.pr); R.hist.push(R.m.mean);
}

const TAU = Math.PI * 2;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => t * t * (3 - 2 * t);
function fe(c, x, y, rx, ry, fill, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); c.fillStyle = fill; c.fill(); }
function pill(c, text, x, y, w, o = {}) { // dark rounded pill with text, clamped inside the canvas
  c.save(); const size = o.size || 13; c.font = `800 ${size}px Nunito, sans-serif`;
  const tw = c.measureText(text).width, pw = Math.min(w - 8, tw + 22), ph = size + 12, px = clamp(x - pw / 2, 4, Math.max(4, w - pw - 4));
  c.fillStyle = o.fill || 'rgba(8, 16, 12, .82)'; c.beginPath(); c.roundRect(px, y - ph / 2, pw, ph, ph / 2); c.fill();

}
const LAYERS = {};
function layer(key, w, h, paint) { // a cached background: painted once per size
  const d = Math.min(window.devicePixelRatio || 1, 2), sig = `${Math.round(w)}x${Math.round(h)}@${d}`;
  let L = LAYERS[key];

}

// --- the Evolve picture: charts the line (tail vs generation) and the histogram on one scale ---------------------
function drawChart(c, w, h) {
  const R = S.run, t = T[lang], e = t.ev, hw = clamp(w * 0.2, 54, 86), padL = 38, padT = 12, padB = 22;
  const px0 = padL, px1 = w - hw - 14, py0 = padT, py1 = h - padB;
  const X = (g) => px0 + (g / GENS) * (px1 - px0), Y = (v) => py1 - (v / TMAX) * (py1 - py0);
  c.font = '700 12px Nunito, sans-serif'; c.textBaseline = 'middle';
  [[0, LO, 'rgba(120,200,255,.07)'], [LO, HI, 'rgba(120,255,180,.06)'], [HI, TMAX, 'rgba(255,200,100,.07)']].forEach(([a, b, col]) => { c.fillStyle = col; c.fillRect(px0, Y(b), px1 - px0, Y(a) - Y(b)); });
  c.lineWidth = 1; c.textAlign = 'right';
  for (const v of [0, 0.5, 1, 1.5]) { c.strokeStyle = 'rgba(200,225,210,.16)'; c.beginPath(); c.moveTo(px0, Y(v)); c.lineTo(px1, Y(v)); c.stroke(); c.fillStyle = 'rgba(210,230,215,.8)'; c.fillText(fm(v, v % 1 ? 1 : 0), px0 - 6, Y(v)); }
  c.textAlign = 'center'; c.fillStyle = 'rgba(210,230,215,.8)';
  for (const g of [0, 50, 100]) c.fillText(String(g), clamp(X(g), 12, w - 12), h - 9);
  c.textAlign = 'right'; c.fillStyle = 'rgba(230,240,225,.5)';
  [[0, LO], [LO, HI], [HI, TMAX]].forEach(([a, b], i) => c.fillText(e.cats[i], px1 - 5, Y((a + b) / 2)));
  // the run before this one, as a faint ghost, only once this run has started
  if (S.phase !== 'idle' && S.prev) { c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1.5; c.setLineDash([4, 4]); c.beginPath(); S.prev.forEach((v, g) => (g ? c.lineTo(X(g), Y(v)) : c.moveTo(X(g), Y(v)))); c.stroke(); c.setLineDash([]); }
  // the guess marker
  if (S.guess !== null) {
    const gy = Y(S.guess); c.strokeStyle = '#7fe3ff'; c.lineWidth = 1.5; c.setLineDash([6, 4]); c.beginPath(); c.moveTo(px0, gy); c.lineTo(px1, gy); c.stroke(); c.setLineDash([]);
    pill(c, `${e.mine} ${fm(S.guess)}`, px0 + 62, clamp(gy - 13, py0 + 8, py1 - 8), w, { color: '#8fe3ff', stroke: 'rgba(127,227,255,.6)' });
  }
  // the mean tail per generation
  const hist = R.hist, last = hist.length - 1;
  c.strokeStyle = '#ffd166'; c.lineWidth = 2.6; c.lineJoin = 'round'; c.beginPath(); hist.forEach((v, g) => (g ? c.lineTo(X(g), Y(v)) : c.moveTo(X(g), Y(v)))); c.stroke();
  const ex = X(last), ey = Y(hist[last]);
  c.save(); c.shadowColor = 'rgba(255,209,102,.9)'; c.shadowBlur = 10; fe(c, ex, ey, 4.5, 4.5, '#ffe9a8'); c.restore();
  // histogram of all tails, same vertical scale
  const hx0 = w - hw - 4, hx1 = w - 8, B = 15, cnt = new Array(B).fill(0);
  for (let i = 0; i < N; i++) cnt[Math.min(B - 1, Math.floor(R.pop[i] / (TMAX / B)))]++;
  const mx = Math.max(30, ...cnt), t90 = R.m.t90;
  c.strokeStyle = 'rgba(200,225,210,.3)'; c.lineWidth = 1; c.beginPath(); c.moveTo(hx0, py0); c.lineTo(hx0, py1); c.stroke();
  for (let b = 0; b < B; b++) {
    if (!cnt[b]) continue;
    const y1 = Y((b + 1) * (TMAX / B)), y0 = Y(b * (TMAX / B)), len = (cnt[b] / mx) * (hx1 - hx0 - 2);
    const gold = (b + 1) * (TMAX / B) > t90;
    const g = c.createLinearGradient(hx0, 0, hx0 + len, 0); g.addColorStop(0, gold ? '#b8892a' : '#2a7fb0'); g.addColorStop(1, gold ? '#ffd166' : '#4fd0b8');
    c.fillStyle = g; c.beginPath(); c.roundRect(hx0 + 1, y1 + 0.5, Math.max(2, len), Math.max(1, y0 - y1 - 1), 2); c.fill();
  }
  c.strokeStyle = 'rgba(255,209,102,.4)'; c.lineWidth = 1; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(ex, ey); c.lineTo(hx1, ey); c.stroke(); c.setLineDash([]);
  c.textAlign = 'center'; c.fillStyle = 'rgba(210,230,215,.8)'; c.fillText(e.hist, (hx0 + hx1) / 2, h - 9);
}

const W0 = 480, H0 = 320;

function antler(c, m) { // a branched antler (red deer), base on the head at (±14, 186)
  c.save(); c.translate(m * 14, 186); c.scale(m, 1);
  const P = [[0, 0], [34, -22], [58, -80], [34, -160]];
  const bz = (t) => { const u = 1 - t; return [u * u * u * P[0][0] + 3 * u * u * t * P[1][0] + 3 * u * t * t * P[2][0] + t * t * t * P[3][0], u * u * u * P[0][1] + 3 * u * u * t * P[1][1] + 3 * u * t * t * P[2][1] + t * t * t * P[3][1]]; };
  const pass = (col, wb) => {
    c.strokeStyle = col; c.lineCap = 'round';
    for (let i = 0; i < 24; i++) { const a = bz(i / 24), b = bz((i + 1) / 24); c.lineWidth = lerp(wb, wb * 0.45, i / 24); c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); }
    for (const [t, len, ang] of TINES) {
      const [x, y] = bz(t), [x2, y2] = bz(Math.min(1, t + 0.02)), d = Math.atan2(y2 - y, x2 - x) + ang;
      c.lineWidth = wb * 0.5; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(d) * len, y + Math.sin(d) * len); c.stroke();
    }
  };
  pass('#8a7048', 9); pass('#e8d6ab', 6); c.restore();
}

    const fin = S.final, up = fin - R.hist[0] > 0.1, down = fin - R.hist[0] < -0.1;
    const body = up ? (fin >= 1.4 ? e.bCap : e.bUp) : down ? (S.ch === 0 ? e.bNone : e.bDown) : e.bFlat;
    lab.setState({ emo: '⚖️', title: S.ok ? e.vOk : e.vNo, lead: e.done(fm(S.guess), e.cats[bandOf(S.guess)], fm(fin), e.cats[bandOf(fin)]), body: `${body} ${e.tryAgain}`, extra: '' });
    lab.setFacts(t.facts.evolve);
  }
}

function renderOthers(t) {
  const o = t.or, i = S.oi, done = i >= 4;
  lab.setGlow('rgba(200, 150, 70, .22)');
  $('orSort').hidden = done; $('orNextRow').hidden = !done && S.oAns[i] === null;
  $('orDots').textContent = dotsOf(4, i);
  const answered = S.oAns.filter((a) => a !== null).length;
  if (done) {
    const k = [0, 1, 2, 3].filter((j) => gradeOf(j) !== 'no').length;
    $('orQ').textContent = ''; $('orNext').textContent = o.again;
    lab.setReadout(`${k}/4`, o.sumSub, '', '#d9a441');
    lab.setState({ emo: '🧭', title: o.sumTitle, lead: o.sumLead(k), body: o.sumBody, extra: '' }); lab.setFacts(t.facts.others); return;
  }
  const card = o.cards[i], ans = S.oAns[i], rev = ans !== null;
  $('orQ').innerHTML = `<b>${esc(card.name)}</b>: ${esc(card.trait)}<br>${esc(o.q)}`;
  const btns = $('orSort').querySelectorAll('button'), keys = ['fight', 'pick'], g = rev ? gradeOf(i) : null;
  btns.forEach((b, j) => {
    b.textContent = o[keys[j]]; b.disabled = rev; b.classList.remove('good', 'bad');
    if (rev) { const fair = g === 'either' || keys[j] === CARDS[i].ok; if (fair) b.classList.add('good'); else if (keys[j] === ans && g !== 'half') b.classList.add('bad'); }
  });
  $('orNext').textContent = i === 3 ? o.last : o.next;
  lab.setReadout(`${answered}/4`, o.sorted, rev ? tagOf(i) : '', '#d9a441');
  if (!rev) lab.setState({ emo: '🤔', title: card.name, lead: card.trait, body: o.q, extra: '' });
  else lab.setState({ emo: g === 'no' ? '🤔' : g === 'half' ? '🟡' : '✅', title: o[g], lead: g === 'half' && card.halfWhy ? card.halfWhy : card.why, body: '', extra: '' });
  lab.setFacts(t.facts.others);
}
// --- the main loop: the run ticks here, then the scene is drawn --------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (S.phase === 'run') {
    S.acc += dt; let n = 0;
    while (S.acc >= STEP && S.run.g < GENS) { advance(S.run); S.acc -= STEP; n++; }
    if (S.run.g >= GENS) finish(); else if (n) render();
  }
  S.vt += (S.run.m.mean - S.vt) * Math.min(1, dt * 4);
  if (v === 'others') drawOthers(c, w, h, time); else drawClearing(c, w, h, dt, time);
  if (v === 'evolve') {
    const r = chartEl.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2), cw = Math.round(r.width * d), chh = Math.round(r.height * d);
    if (r.width > 0 && r.height > 0) {
      if (chartEl.width !== cw || chartEl.height !== chh) { chartEl.width = cw; chartEl.height = chh; }
      const cc = chartEl.getContext('2d'); cc.setTransform(d, 0, 0, d, 0, 0); cc.clearRect(0, 0, r.width, r.height); drawChart(cc, r.width, r.height);
    }
  }
});

render();
</script>
</body>
