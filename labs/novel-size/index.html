    c.fillStyle = '#3a2d14'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `800 ${F(16)}px Nunito, sans-serif`;
    const ls = wrap(c, T[lang].w.flash.text, 112); ls.forEach((l, i) => c.fillText(l, -1, -14 + i * 22 - (ls.length - 3) * 8));
    c.restore();
  }
  // time strip and places under the shelf
  for (let i = 0; i < 12; i++) {
    const on = i < Math.round(A.cal);
    c.fillStyle = on ? lin(c, 0, 273, 0, 289, [[0, '#f5d27a'], [1, '#d4a43a']]) : 'rgba(130,145,190,.18)'; c.strokeStyle = on ? '#8a6a1c' : 'rgba(130,145,190,.35)'; c.lineWidth = 1;
    rr(c, 14 + i * 10, 273, 9, 16, 2); c.fill(); c.stroke();
  }
  pill(c, `📅 ${T[lang].w.spans[flash ? 0 : S.t]}`, 175, 281, 12, 'rgba(10,12,24,.82)');
  const np = Math.ceil(A.pl - 0.001);
  for (let i = 0; i < np; i++) {
    const s = easeOut(clamp01(A.pl - i)), x = 262 + i * 15; c.save(); c.translate(x, 288); c.scale(s, s);
    c.fillStyle = lin(c, -5, -16, 5, 0, [[0, '#ff7a6e'], [1, '#c4362c']]); c.strokeStyle = '#8a1f18'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(-7, -9, -6, -16, 0, -16); c.bezierCurveTo(6, -16, 7, -9, 0, 0); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, -10.5, 2, 0, 6.3); c.fill(); c.restore();
  }

}

// --- scene 2: card and baskets --------------------------------------------------------------------------------
const BX = [10, 126, 242];
function scene2(c, tm) {
  const t = T[lang], end = S.i2 >= 6, now = performance.now() / 1000;
  // baskets
  for (let i = 0; i < 3; i++) {
    const x = BX[i], top = 216, g = S.picked !== null && !end ? (CARDS[S.i2].includes(i) ? 'ok' : S.picked === i ? 'bad' : null) : null;
    // cards poking out
    for (let k = 0; k < Math.min(5, S.placed2[i]); k++) {
      c.save(); c.translate(x + 30 + k * 11, top + 4); c.rotate((k - 2) * 0.12);
      c.fillStyle = lin(c, 0, -26, 0, 4, [[0, '#fffaf0'], [1, '#e8dcc0']]); c.strokeStyle = '#b9a97c'; c.lineWidth = 1; rr(c, -9, -26, 18, 30, 2); c.fill(); c.stroke();
      c.fillStyle = 'rgba(80,70,50,.35)'; c.fillRect(-6, -21, 12, 1.6); c.fillRect(-6, -16, 9, 1.6); c.restore();
    }
    if (g) { c.save(); c.shadowColor = g === 'ok' ? '#3ddc97' : '#ff6b6b'; c.shadowBlur = 16; c.strokeStyle = g === 'ok' ? '#3ddc97' : '#ff6b6b'; c.lineWidth = 3; rr(c, x - 3, top - 3, 114, 80, 14); c.stroke(); c.restore(); }
    c.fillStyle = 'rgba(0,0,0,.3)'; rr(c, x + 4, top + 74, 100, 8, 4); c.fill();
    c.fillStyle = lin(c, x, top, x + 108, top + 76, [[0, '#d39a58'], [1, '#8b5a2b']]); c.strokeStyle = '#5e3a18'; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(x, top + 4); c.lineTo(x + 108, top + 4); c.lineTo(x + 98, top + 76); c.lineTo(x + 10, top + 76); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(60,30,8,.3)'; c.lineWidth = 1; for (let k = 1; k < 6; k++) { c.beginPath(); c.moveTo(x + 1 + k * 0.5, top + 4 + k * 12); c.lineTo(x + 107 - k * 1.5, top + 4 + k * 12); c.stroke(); }
    c.fillStyle = lin(c, 0, top - 2, 0, top + 10, [[0, '#e6b676'], [1, '#b07a3c']]); c.strokeStyle = '#5e3a18'; c.lineWidth = 1.6; rr(c, x - 3, top - 3, 114, 13, 6); c.fill(); c.stroke();
    bookIcon(c, x + 52, top + 54, [18, 26, 38][i], 34, KCOL[i], [3, 8, 16][i]);
    pill(c, t.w.kinds[i], x + 54, top + 68, 12.5);
  }
  if (end) {
    const k = S.res.filter(Boolean).length;
    c.save(); c.fillStyle = 'rgba(10,12,24,.82)'; rr(c, 60, 50, 240, 120, 22); c.fill(); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = `900 ${F(54)}px Nunito, sans-serif`; c.fillText(`${k}/6`, 180, 96); c.font = `800 ${F(14)}px Nunito, sans-serif`; c.fillText(`🧺 ${t.s.sorted}`, 180, 142); c.restore();
    return;
  }
  // the card
  c.save(); c.font = '800 17px Nunito, sans-serif';
  const lines = wrap(c, t.s.cards[S.i2], 262), h = Math.max(90, lines.length * 24 + 38), cx = 180, cy = 14 + h / 2;
  let p = 0, tx = cx, ty = cy; if (S.fly) { p = clamp01((now - S.fly.t0) / 0.45); p = p * p; tx = lerp2(cx, BX[S.fly.to] + 54, p); ty = lerp2(cy, 210, p); }
  const s = 1 - 0.78 * p;
  c.translate(tx, ty); c.scale(s, s); c.rotate(Math.sin(tm * 1.1) * 0.01 * (1 - p));
  c.fillStyle = 'rgba(0,0,0,.32)'; rr(c, -150, -h / 2 + 6, 306, h, 10); c.fill();
  c.fillStyle = lin(c, -150, -h / 2, 150, h / 2, [[0, '#fffaf0'], [1, '#ecdfc0']]); c.strokeStyle = '#b9a97c'; c.lineWidth = 1.6; rr(c, -153, -h / 2, 306, h, 10); c.fill(); c.stroke();
  c.fillStyle = 'rgba(230,100,90,.75)'; rr(c, -22, -h / 2 - 7, 44, 13, 3); c.fill();
  c.fillStyle = '#2f2616'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `800 ${F(17)}px Nunito, sans-serif`;
  lines.forEach((l, i) => c.fillText(l, 0, (i - (lines.length - 1) / 2) * 24 + 4));
  c.restore();
}
const lerp2 = (a, b, t) => a + (b - a) * t;

// --- scene 3: the ruler -----------------------------------------------------------------------------------------
function scene3(c, tm) {
  const t = T[lang], now = performance.now() / 1000, ry = 172;
  // ruler
  c.fillStyle = 'rgba(0,0,0,.3)'; rr(c, 12, ry + 6, 336, 26, 6); c.fill();
  c.fillStyle = lin(c, 0, ry, 0, ry + 24, [[0, '#f0dca8'], [1, '#d3b878']]); c.strokeStyle = '#8f7438'; c.lineWidth = 1.6; rr(c, 10, ry, 340, 24, 5); c.fill(); c.stroke();
  c.strokeStyle = '#6b5524'; c.fillStyle = '#4a3a14';
  for (const [dec, m] of [[1000, 1], [10000, 1], [100000, 1], [1000000, 1]]) { const x = xOfWords(dec); c.lineWidth = 2; c.beginPath(); c.moveTo(x, ry); c.lineTo(x, ry + 17); c.stroke(); }
  c.lineWidth = 1; for (let dec = 100; dec < 1000000; dec *= 10) for (let m = 2; m < 10; m++) { const wd = dec * m; if (wd < LO) continue; const x = xOfWords(wd); c.beginPath(); c.moveTo(x, ry); c.lineTo(x, ry + (m === 5 ? 11 : 7)); c.stroke(); }
  [1000, 10000, 100000, 1000000].forEach((wd) => pill(c, fmt(wd), xOfWords(wd), ry + 44, 12.5, 'rgba(10,12,24,.82)'));
  pill(c, t.r.cap, 180, 284, 12.5, 'rgba(10,12,24,.6)', '#d3d9e8');
  // placed books
  const n = S.i3, ck = S.ck3, upto = ck ? n + 1 : n;
  for (let i = 0; i < upto && i < 5; i++) {
    const bk = BOOKS[i], cur = ck && i === n, drop = cur ? easeBounce((now - S.dropAt) / 0.8) : 1;
    const xt = bk.w ? xOfWords(bk.w) : xOfWords(Math.sqrt(bk.lo * bk.hi));
    const off = i === 3 ? -13 : i === 4 ? 13 : 0, bxp = clamp(xt + off, 22, 338), yb = ry - 2 - (1 - drop) * 110;
    if (bk.lo) { c.fillStyle = 'rgba(111,179,111,.85)'; c.strokeStyle = '#3f7a3f'; c.lineWidth = 1.2; rr(c, xOfWords(bk.lo), ry - 8, xOfWords(bk.hi) - xOfWords(bk.lo), 8, 3); c.fill(); c.stroke(); }
    else { c.fillStyle = bk.col; c.strokeStyle = shade(bk.col, 0.5); c.lineWidth = 1.2; c.beginPath(); c.moveTo(xt, ry + 2); c.lineTo(xt - 5, ry - 6); c.lineTo(xt + 5, ry - 6); c.closePath(); c.fill(); c.stroke(); }
    bookIcon(c, bxp, yb - (bk.lo ? 8 : 6), 22, 36, bk.col, 4);
    pill(c, t.r.short[i], bxp, yb - 56 - (i === 4 ? 18 : i === 2 ? 18 : 0), 12.5);
  }
  // the guess: pin on the ruler and the book to place hovering over it
  if (n < 5) {
    const gx = xOfWords(wordsOf(S.g)), col = BOOKS[n].col, bob = ck ? 0 : Math.sin(tm * 3) * 2.5;
    c.save(); c.strokeStyle = 'rgba(255,255,255,.55)'; c.setLineDash([4, 4]); c.lineWidth = 1.4; c.beginPath(); c.moveTo(gx, ry - 4); c.lineTo(gx, 118); c.stroke(); c.restore();
    c.fillStyle = lin(c, gx - 6, ry - 18, gx + 6, ry, [[0, '#ff8a7e'], [1, '#c4362c']]); c.strokeStyle = '#8a1f18'; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(gx, ry + 1); c.bezierCurveTo(gx - 9, ry - 10, gx - 8, ry - 22, gx, ry - 22); c.bezierCurveTo(gx + 8, ry - 22, gx + 9, ry - 10, gx, ry + 1); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(gx - 1.5, ry - 14, 2.6, 0, 6.3); c.fill();
    if (!ck) bookIcon(c, gx, 116 + bob, 22, 36, col, 4);
    pill(c, t.r.words(fmt(wordsOf(S.g))).replace('≈ ', '≈ '), gx, ry + 70, 12.5, 'rgba(255,255,255,.92)', '#14182a');
    pill(c, `📖 ${t.r.names[n]}`, 180, 26, 13);
  }
}

// --- draw loop ---------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, tm) => {
  wall(c, w, h);
  K = Math.min(w / W, h / H);
  c.save(); c.translate((w - W * K) / 2, (h - H * K) / 2); c.scale(K, K);
  const v = lab.view;
  if (v === 'weave') scene1(c, dt, tm); else if (v === 'sort') scene2(c, tm); else scene3(c, tm);
  c.restore();
});

// --- one render per change: controls, readout, state card, facts ----------------------------------------------------
function secretRow(t) {
  const open = secret.unlocked(), sc = (k, emo, i) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[i][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('flash', '⚡', 'a') + sc('letters', '✉️', 'b');
}
const chips = (arr, on, act, dis, cls = '') => arr.map((l, j) => `<button class="nz-pick ${j === on ? 'on' : ''} ${cls}" data-act="${act}" data-j="${j}"${dis ? ' disabled' : ''}>${esc(l)}</button>`).join('');
function render() {
  const t = T[lang], v = lab.view;
  $('nzW').style.display = v === 'weave' ? 'block' : 'none';
  $('nzS').style.display = v === 'sort' ? 'block' : 'none';
  $('nzR').style.display = v === 'ruler' ? 'block' : 'none';
  secretRow(t);
  lab.setGlow(v === 'weave' ? 'rgba(80,130,220,.3)' : v === 'sort' ? 'rgba(210,150,80,.26)' : 'rgba(110,180,120,.24)');
  lab.setFacts(t.facts[v === 'weave' ? 'w' : v === 'sort' ? 's' : 'r'].map((f) => ({ ...f })));
  if (v === 'weave') renderWeave(t); else if (v === 'sort') renderSort(t); else renderRuler(t);
}
function renderWeave(t) {
  const w = t.w, flash = S.sec === 'flash', letters = S.sec === 'letters', kind = kindOf();
  $('wSl').textContent = w.sl; $('wSlV').textContent = S.s; $('wCh').textContent = w.ch; $('wChV').textContent = S.c; $('wSp').textContent = w.sp; $('wGuess').textContent = w.guess;
  if (+$('rS').value !== S.s) $('rS').value = S.s;
  if (+$('rC').value !== S.c) $('rC').value = S.c;
  $('spans').innerHTML = chips(w.spans, S.t, 'span', false);
  $('picks').innerHTML = chips(w.kinds, S.pred, 'pred', S.checked, '');
  $('wCheck').textContent = w.check; $('wCheck').disabled = S.pred === null || S.checked || flash;
  $('nzW').querySelector('#picks').style.opacity = flash ? 0.4 : 1;
  if (flash) {
    lab.setReadout('6', t.wordsUnit, w.flash.pill, '#e0b050');
    lab.setState({ emo: '⚡', title: w.flash.title, lead: w.flash.lead, body: w.flash.body, extra: '' });
  } else if (!S.checked) {
    lab.setReadout('?', w.sub(S.s, S.c, w.spans[S.t]), '', '#5b8bd6');
    lab.setState(letters ? { emo: '✉️', title: w.let.title, lead: w.let.lead, body: w.let.body, extra: '' } : { emo: w.pre[0], title: w.pre[1], lead: w.pre[2], body: '', extra: '' });
  } else {
    const right = S.pred === kind;
    lab.setReadout(esc(w.kinds[kind]), w.sub(S.s, S.c, w.spans[S.t]), right ? '✓' : '', KCOL[kind]);
    lab.setState({ emo: right ? '✅' : '🤔', title: right ? w.ok : w.no, lead: `${w.res(w.kinds[kind].toLowerCase())} ${w.why[kind]}`,
      body: `${w.fuzzy}${nearBorder() ? ' ' + w.near : ''}${letters ? ' ' + w.let.body : ''}`, extra: '' });
  }
}
function renderSort(t) {
  const s = t.s, end = S.i2 >= 6, k = S.res.filter((x) => x !== undefined).length;
  $('sPicks').style.display = end ? 'none' : '';
  $('sPicks').innerHTML = chips(s.kinds ?? t.w.kinds, S.picked, 'spick', S.picked !== null || !!S.fly, '');
  if (!end && S.picked !== null) { // colour the right basket green and a wrong pick red
    const ok = CARDS[S.i2];
    $('sPicks').querySelectorAll('.nz-pick').forEach((b, j) => { b.classList.toggle('good', ok.includes(j)); b.classList.toggle('bad', j === S.picked && !ok.includes(j)); b.classList.toggle('on', false); });
  }
  const main = $('sMain'); main.textContent = end ? s.again : s.next; main.style.display = end || S.picked !== null ? '' : 'none'; main.disabled = !!S.fly;
  if (end) {
    const r = S.res.filter(Boolean).length;
    lab.setReadout(`${r}/6`, s.sorted, '', '#d39a58');
    lab.setState({ emo: '🏆', title: s.endTitle(r), lead: s.endLead, body: '', extra: '' });
    return;
  }
  lab.setReadout(`${k}/6`, s.sorted, '', '#d39a58');
  if (S.picked === null) lab.setState({ emo: '🧺', title: s.q, lead: s.pre, body: '', extra: '' });
  else {
    const ok = S.res[S.i2];
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? s.ok : s.no, lead: s.why[S.i2], body: CARDS[S.i2].length > 1 ? s.both : '', extra: '' });
  }
}
function renderRuler(t) {
  const r = t.r, n = S.i3, end = n >= 5, ck = S.ck3, wd = wordsOf(S.g);
  $('rG').disabled = ck || end; $('rG').style.display = end ? 'none' : '';
  if (+$('rG').value !== S.g) $('rG').value = S.g;
  $('rGuess').textContent = end ? '' : r.guess(r.words(fmt(wd)));
  $('rMain').textContent = end ? r.again : ck ? r.next : r.check;
  if (end) {
    lab.setReadout(`${S.res3.filter(Boolean).length}/5`, '', '', '#6fb36f');
    lab.setState({ emo: '🏆', title: r.endTitle, lead: r.endLead, body: '', extra: '' });
    return;
  }
  const bk = BOOKS[n];
  if (!ck) {
    lab.setReadout('?', r.words(fmt(wd)), '', '#6fb36f');
    lab.setState({ emo: '📏', title: r.q(r.names[n]), lead: r.pre, body: '', extra: '' });
  } else {
    const ok = S.res3[n], words = bk.lo ? r.words(`${fmt(bk.lo)}–${fmt(bk.hi)}`) : r.words(fmt(bk.w)), pg = r.words ? `≈ ${pagesFmt(bk.pages)} ${t.pagesUnit}` : '';

    if (!ok) { const ratio = bk.lo ? (wd < bk.lo ? bk.lo / wd : wd / bk.hi) : Math.max(wd / bk.w, bk.w / wd); if (ratio >= 2) far = r.far(Math.round(ratio)); }
    lab.setReadout(`≈ ${pagesFmt(bk.pages)}`, t.pagesUnit, '', bk.col);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? r.ok : r.no, lead: r.res(words, pg), body: [far, n === 4 ? r.sameAlice : ''].filter(Boolean).join(' '), extra: '' });
  }
}
render();
