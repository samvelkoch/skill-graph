// --- pointers: flags (view 1), columns (view 2) ----------------------------------------------------------------
const cv = $('cv');
const pos = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
const xOf = (ma) => G1.l + (MA0 - ma) / MA0 * G1.pw, maOf = (x) => clamp(MA0 - (x - G1.l) / G1.pw * MA0, 1, MA0 - 1);
cv.addEventListener('pointerdown', (ev) => {
  const p = pos(ev), v = lab.view;
  if (v === 'dates' && G1) {
    if (S.revealed) {
      let best = -1, bd = 26;
      EV.forEach((e, i) => { const d = Math.abs(xOf(e.ma - 1) - p.x); if (d < bd) { bd = d; best = i; } });
      if (best >= 0 && !S.named[best]) { S.sel = best; S.msg = ''; sfx.tick(); render(); }
      return;
    }
    let best = -1, bd = 24;
    S.flags.forEach((m, i) => { if (m !== null) { const d = Math.abs(xOf(m) - p.x); if (d < bd) { bd = d; best = i; } } });
    if (best < 0 && p.y >= G1.t - 4 && p.y <= G1.b + 4) {
      const i = S.flags.indexOf(null);
      if (i >= 0) { S.flags[i] = maOf(p.x); best = i; sfx.click(); }
    }
    if (best >= 0) { S.drag = best; S.over = false; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ } render(); }
  } else if (v === 'causes' && G2) {
    const i = Math.floor((p.x - G2.padX) / G2.colW);
    if (i < 0 || i > 4) return;
    if (S.pick < 0) pickDeadliest(i);
    else if (!S.matched[i]) { S.sel2 = i; S.msg2 = ''; sfx.tick(); render(); }
  }
});
cv.addEventListener('pointermove', (ev) => {
  if (S.drag < 0 || !G1) return;
  const p = pos(ev); S.over = p.y < G1.t - 6;
  S.flags[S.drag] = maOf(p.x); render();
});
const endDrag = () => {
  if (S.drag < 0) return;
  if (S.over) { S.flags[S.drag] = null; sfx.tick(); }
  S.drag = -1; S.over = false; render();
};
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- actions -----------------------------------------------------------------------------------------------
// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function lift() {
  if (S.revealed || S.flags.some((m) => m === null)) return;
  S.sorted = [...S.flags].sort((a, b) => b - a); // the oldest flag meets the oldest drop: the best possible pairing
  S.offs = S.sorted.map((m, i) => Math.round(Math.abs(m - EV[i].ma)));
  S.pts = S.offs.reduce((s, d) => s + (d <= 15 ? 3 : d <= 40 ? 2 : d <= 80 ? 1 : 0), 0);
  S.revealed = true; S.rv = 0; S.sel = 0; S.msg = ''; sfx.good(); showStage();
}
function nameIt(k) {
  if (S.named[S.sel] || S.tried[S.sel].includes(k) || S.named.some((n, i) => n && i === k)) return;
  if (k === S.sel) {
    S.named[k] = true; S.msg = 'ok'; sfx.good();
    const nx = [1, 2, 3, 4, 5].map((d) => (S.sel + d) % 5).find((i) => !S.named[i]);
    S.last = k;
    if (nx !== undefined) S.sel = nx; else S.allT = true;
  } else { S.tried[S.sel].push(k); S.msg = 'bad'; sfx.bad(); }
}
function pickDeadliest(i) { S.pick = i; S.bar = 0; S.sel2 = 0; S.msg2 = ''; (i === DEEP ? sfx.good : sfx.bad)(); showStage(); render(); }
function matchIt(cause) {
  const i = S.sel2;
  if (S.matched[i] || S.tried2[i].includes(cause)) return;
  if (EV[i].cause === cause) {
    S.matched[i] = true; S.matchT[i] = performance.now() / 1000; S.msg2 = 'ok'; S.last2 = i; sfx.good();
    const nx = [1, 2, 3, 4, 5].map((d) => (i + d) % 5).find((j) => !S.matched[j]);
    if (nx !== undefined) S.sel2 = nx;
  } else { S.tried2[i].push(cause); S.msg2 = 'bad'; S.shake = performance.now() / 1000; sfx.bad(); }
}
function setScen(k) { S.scen = k; S.sec = null; }
function answer(j) {
  const k = S.scen; if (S.ans[k] !== null) return;
  S.ans[k] = j; (j === SC[k].right ? sfx.good : sfx.bad)(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {

  else if (a === 'again1') { S.flags = [null, null, null, null, null]; S.revealed = false; S.rv = 0; S.band = 0; S.named = [false, false, false, false, false]; S.tried = [[], [], [], [], []]; S.sel = 0; S.msg = ''; S.allT = false; sfx.click(); }

// --- one render per change: controls, readout, state card and facts ----------------------------------------

const stateOf = (emo, title, lead, body = '', extra = '') => ({ emo, title, lead, body, extra });

  const a = t.a, k = S.scen, q = SC[k], ans = S.ans[k], sec = S.sec;
  lab.setGlow('rgba(67, 198, 176, .22)');
  $('aScen').innerHTML = ['k', 't'].map((x) => `<button class="chip ex-n${x === k && !sec ? ' on' : ''}" data-act="scen" data-k="${x}">${esc(a.scen[x])}</button>`).join('');
  const open = secret.unlocked();
  const sc = (x, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === x ? 'on' : ''}" data-act="sec" data-k="${x}">${open ? `${emo} ${esc(t.sec[x][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('six', '🌍') + sc('iri', '🔬');
  $('aAsk').hidden = ans !== null || !!sec; $('aSlide').hidden = ans === null && !sec;
  const rng = $('aRange'), want = sec === 'six' ? S.six : sec === 'iri' ? S.iri : S.s[k];
  if (+rng.value !== want) rng.value = want;
  rng.disabled = false;
  if (ans === null && !sec) {
    const [qt, ql, opts] = a.ask[k];
    $('aQ').textContent = ql;
    $('aOpts').innerHTML = opts.map((o, j) => `<button class="ex-btn" data-act="ans" data-j="${j}">${esc(o)}</button>`).join('');
    lab.setReadout('?', a.sub, '', '#43c6b0'); lab.setFacts([]);
    lab.setState(stateOf('🤔', qt, ql, '', `<div class="fine">${esc(a.model)}</div>`));
    return;
  }
  if (sec === 'six') {
    const val = Math.pow(10, 3 * S.six / 1000);
    $('aSlideQ').textContent = t.sec.sixQ; $('aE0').textContent = '×1'; $('aE1').textContent = '×1000';
    lab.setReadout(`×${fmtX(val)}`, t.sec.sixSub, val >= 100 ? t.sec.sixIn : '', '#ff7a45'); lab.setFacts(t.facts.six);
    lab.setState(stateOf('🌍', t.sec.sixT, t.sec.sixL, t.sec.sixB)); return;
  }
  if (sec === 'iri') {
    const mx = Math.max(...IRI.map((_, i) => iriRead(i, S.iri)));
    $('aSlideQ').textContent = t.sec.iriB; $('aE0').textContent = t.sec.up; $('aE1').textContent = t.sec.down;
    lab.setReadout(`×${fmtX(mx)}`, t.sec.iriSub, '', '#ffd36b'); lab.setFacts(t.facts.iri);
    lab.setState(stateOf('🔬', t.sec.iriT, t.sec.iriL, t.sec.iriB, `<div class="fine">${esc(t.sec.iriX)}</div>`)); return;
  }
  const ma = cursorMa(k, S.s[k]), { no, nn, ne } = cellsAt(k, ma), good = ans === q.right;
  $('aSlideQ').textContent = a.slide; $('aE0').textContent = a.just; $('aE1').textContent = q.to === 0 ? t.now : `${q.to} ${t.mya}`;
  lab.setReadout(`+${Math.round(q.ma0 - ma)}`, a.sub, `${a.empty}: ${ne}`, '#43c6b0');
  lab.setFacts(t.facts[k]);
  const st = ne > 12 ? 0 : ne > 4 ? 1 : 2, line = a.line(a.g[k][1], nn, ne, a.empty);
  const intro = S.s[k] < 40;
  lab.setState(intro ? stateOf(good ? '✅' : '🤔', good ? a.okT : a.noT, good ? a.okL[k] : a.noL, line, `<div class="fine">${esc(a.model)}</div>`)
    : stateOf(['🕳️', '🌱', '🌿'][st], a.stage[st], line, no ? `${a.g[k][0]}: ${no} / 20` : '', `<div class="fine">${esc(a.model)}</div>`));
}
render();
</script>
