    if (isB) st = { emo: '🏎️', title: t.rolling, lead: '', body: '' };
    else if (W.mode === 'pair') {
      const done = W.runs.every((r) => r && r.done), rs = t.w.res[W.pair];
      st = done ? { emo: '🔎', title: rs[0], lead: `A: ${W.runs[0].cm} ${t.cm}, B: ${W.runs[1].cm} ${t.cm}`, body: rs[1] } : { emo: '🏎️', title: rs[0], lead: '', body: '' };
    } else if (W.ans !== null) st = { emo: W.ans === 2 ? '🎯' : '🤷', title: W.ans === 2 ? t.w.right : t.w.wrong, lead: t.w.lead, body: t.w.body };
    else if (W.ran) st = { emo: t.w.look[0], title: t.w.look[1], lead: t.w.look[2], body: t.w.look[3] };
    else st = { emo: e0, title: t0, lead: l0, body: b0 };
  } else if (v === 'test') {
    $('tQs').innerHTML = KEYS.map((k) => `<button class="chip ${cv.q === k ? 'on' : ''}" data-act="tq" data-k="${k}">${esc(t.t.qs[k])}</button>`).join('');
    $('tRun').textContent = t.run; $('tRun').disabled = isB;
    $('tTab').innerHTML = cv.rows.length ? `<table class="ft-tab"><tr>${t.t.th.map((x) => `<th>${esc(x)}</th>`).join('')}</tr>${cv.rows.map((r) =>
      `<tr><td>${esc(t.t.short[r.q])}</td><td>${r.a} ${t.cm}</td><td>${r.b} ${t.cm}</td><td class="${r.fair ? 'y' : 'n'}">${r.fair ? '✔' : '✘'}</td></tr>`).join('')}</table>` : '';
    if (isB) st = { emo: '🏎️', title: t.rolling, lead: '', body: '' };
    else if (cv.last) {
      const r = cv.last, lead = `A: ${r.a} ${t.cm}, B: ${r.b} ${t.cm}`;
      if (!r.fair) st = { emo: '🙅', title: t.t.unfairT, lead, body: t.t.unfairB };
      else {
        const clear = Math.abs(r.a - r.b) / Math.max(r.a, r.b) > 0.15;
        st = { emo: clear ? '✅' : '🟰', title: t.ban.ok, lead, body: `${(clear ? t.t.yes : t.t.no)[r.q]} ${clear ? t.t.bodyYes : t.t.bodyNo}` };
      }
    } else st = { emo: t.t.idle[0], title: t.t.idle[1], lead: t.t.idle[2], body: t.t.idle[3] };
  } else {
    const R = cv, ds = R.hist[0].filter((r) => tn >= stopAt(r)).map((r) => r.cm), full = ds.length >= 5;
    $('rQ').textContent = t.r.q;
    $('rOpts').innerHTML = t.r.opts.map((o, j) => {
      const cls = full ? (j === 1 ? 'good' : j === R.ans ? 'bad' : '') : j === R.ans ? 'on' : '';
      return `<button class="chip ${cls}" data-act="ropt" data-j="${j}" ${R.ans !== null || isB ? 'disabled' : ''}>${esc(o)}</button>`;
    }).join('');
    $('rRun').textContent = full ? t.r.newS : t.r.run(ds.length + 1);
    $('rRun').disabled = isB || R.ans === null;
    const sorted = [...ds].sort((a, b) => a - b), md = full ? sorted[2] : null; let mdUsed = false;
    $('rDs').innerHTML = ds.length ? `<span class="lbl">${esc(t.r.dist)}</span>${ds.map((x) => { const m = full && x === md && !mdUsed; if (m) mdUsed = true; return `<span class="ft-d ${m ? 'med' : ''}">${x}</span>`; }).join('')}${full ? `<span class="ft-d med">${esc(t.r.med)} ${md}</span>` : ''}` : '';
    if (full) st = { emo: R.ans === 1 ? '🎯' : '🤷', title: R.ans === 1 ? t.r.right : t.r.wrong, lead: t.r.end(sorted[0], sorted[4]), body: t.r.endB(md) };
    else if (isB || ds.length) st = { emo: '🔁', title: t.r.prog(ds.length), lead: ds.length ? t.r.soFar(ds.join(', ')) : t.r.watch, body: t.r.watch };
    else st = { emo: t.r.idle[0], title: t.r.idle[1], lead: t.r.idle[2], body: t.r.idle[3] };
  }
  lab.setState(st);
  $('secChips').innerHTML = ['a', 'b'].map((k) => {
    const open = secret.unlocked(), emo = k === 'a' ? '⚖️' : '🍋', on = (k === 'a' && SEC === 'weight') || (k === 'b' && SEC === 'lemon');
    return `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  }).join('');
  updReadout();
  lab.setFacts(t.facts[v]);
}
render();
</script>
</body>
</html>
