function wrapText(c, text, maxW) {

}

// a thread bobbin standing on (x, y), h tall; ph turns the stripes
function bobbin(c, x, y, h, wd, ph) {

}

}

}

}

  <div id="vDay"><div id="dyAsk"></div><div class="in-sec" id="dyMain"><div class="chips" id="dyTog"></div><div class="in-leg" id="dyLeg"></div></div></div>

  <div id="vRock"><div class="chips"><button class="chip in-chip" data-act="race" id="rockAgain"></button></div></div>
  <div class="row2" id="secRow"></div>`;

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const now = () => performance.now() / 1000;
const askHTML = (tx, a, ans, ok, act) => `<div class="in-qt">${esc(a.q)}</div><div class="in-opts">${a.opts.map((o, i) => `<button class="in-opt${ans === null ? '' : i === ok ? ' good' : i === ans ? ' bad' : ''}" data-act="${act}" data-i="${i}"${ans === null ? '' : ' disabled'}>${esc(o)}</button>`).join('')}</div>${ans === null ? '' : `<div class="in-v ${ans === ok ? 'good' : 'bad'}">${esc(ans === ok ? tx.right : tx.wrong)}</div>`}`;

// --- one render per change: controls, readout and the state card --------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec || v;
  $('gauge').style.display = 'none';
  $('vSpin').hidden = !(!sec && v === 'spin'); $('vCity').hidden = !(!sec && v === 'city'); $('vDay').hidden = !(!sec && v === 'day');
  $('vEng').hidden = sec !== 'engine'; $('vRock').hidden = sec !== 'rocket';
  const open = secret.unlocked(), sc = (k, id) => `<button class="chip secret ${open ? 'open' : ''} ${sec === id ? 'on' : ''}" data-act="sec" data-k="${id}">${open ? esc(t.secChip[k]) : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('eng', 'engine') + sc('rock', 'rocket');
  if (sec === 'engine') renderEngine(t); else if (sec === 'rocket') renderRocket(t);
  else if (v === 'spin') renderSpin(t); else if (v === 'city') renderCity(t); else renderDay(t);
}
const thinking = (t) => lab.setState({ emo: '🤔', title: t.think[0], lead: t.think[1], body: '', extra: '' });

function renderSpin(t) {
  const asking = S.mode !== 'wheel' && S.ansS === null, m = S.mode, ok = 0;
  lab.setGlow('rgba(214, 160, 90, .26)');
  $('spModes').innerHTML = ['wheel', 'jenny', 'frame', 'mill'].map((k) => `<button class="chip in-chip ${k === m ? 'on' : ''}" data-act="mode" data-m="${k}">${esc(t.modes[k])}</button>`).join('');
  $('spAsk').innerHTML = m === 'jenny' && (asking || S.ansS !== null) ? askHTML(t, t.askS, S.ansS, ok, 'sAns') : '';
  $('spSteamRow').hidden = !(m === 'mill' && !asking);
  $('spSteam').textContent = t.steam; $('spSteam').classList.toggle('on', S.steam);
  if (asking) { lab.setReadout('?', t.sub1, '', '#d6a05a'); thinking(t); }
  else {
    const val = m === 'wheel' ? '1' : m === 'jenny' ? '8' : esc(t.many[m]), pill = m === 'mill' ? (S.steam ? t.pillS.millS : t.pillS.millW) : t.pillS[m];
    lab.setReadout(val, m === 'wheel' || m === 'jenny' ? t.sub1 : t.sub2, pill, '#d6a05a');
    const [emo, title, lead] = t.cardS[m === 'mill' ? (S.steam ? 'millS' : 'millW') : m];
    lab.setState({ emo, title, lead, body: '', extra: '' });
  }
  lab.setFacts([{ emo: '💧', text: t.facts.arkwright, src: SRC.arkwright }]);
}

const phaseOf = (y) => (y < 1780 ? 0 : y < 1830 ? 1 : y < 1851 ? 2 : 3);
function cityUI() {
  const t = T[lang], answered = S.ansCity !== null, y = Math.round(S.yr);
  $('yr').value = y;
  if (!answered) { lab.setReadout('1750', t.region, '', '#c9a56a'); return; }
  const sh0 = shareOf(S.yr), town = S.yr >= 1851;
  lab.setReadout(String(y), town ? t.moreTown : t.moreCountry, '', '#c9a56a');
  const ph = phaseOf(y), key = lang + ph;
  if (key !== S.cityKey) { S.cityKey = key; const [emo, title, lead] = t.cityPh[ph]; lab.setState({ emo, title, lead, body: t.cityBody, extra: '' }); }
}
function renderCity(t) {
  const answered = S.ansCity !== null;
  lab.setGlow('rgba(201, 165, 106, .24)');
  $('ctAsk').innerHTML = askHTML(t, t.cityAsk, S.ansCity, 0, 'cAns');
  $('yr').disabled = !answered; $('ctMain').style.display = answered ? '' : 'none';
  $('ctPlay').textContent = S.play ? t.pause : t.play;
  S.cityKey = '';
  if (!answered) { lab.setReadout('1750', t.region, '', '#c9a56a'); thinking(t); lab.setFacts([]); }
  else { cityUI(); lab.setFacts([{ emo: '🏙️', text: t.facts.census, src: SRC.census }, { emo: '🚂', text: t.facts.east, src: SRC.east }]); }
}
function setYear(y) { S.yr = clamp(y, 1750, 1900); if (!S.sec && lab.view === 'city') cityUI(); }

function renderDay(t) {
  const answered = S.ansDay !== null;
  lab.setGlow('rgba(214, 120, 70, .24)');
  $('dyAsk').innerHTML = askHTML(t, t.dayAsk, S.ansDay, 0, 'dAns');
  $('dyMain').style.display = answered ? '' : 'none';
  $('dyTog').innerHTML = t.togs.map((l, i) => `<button class="chip in-chip ${!!i === S.after ? 'on' : ''}" data-act="tog" data-a="${i}">${esc(l)}</button>`).join('');
  $('dyLeg').innerHTML = ['work', 'brk', 'home', 'sleep'].map((k, i) => `<span><i style="background:${DAYC[k]}"></i>${esc(t.dayLeg[i])}</span>`).join('');
  if (!answered) { lab.setReadout('?', t.hours, '', '#d67846'); thinking(t); lab.setFacts([]); return; }
  const [emo, title, lead, body] = S.after ? t.day33 : t.day30;
  lab.setReadout(`${workHours(S.after)} ${esc(t.hrs)}`, t.hours, S.after ? t.togs[1] : t.togs[0], '#d67846');
  lab.setState({ emo, title, lead, body, extra: '' });
  lab.setFacts([{ emo: '📜', text: t.facts.act, src: SRC.act }]);
}

function renderEngine(t) {
  const e = t.eng; lab.setGlow('rgba(255, 140, 60, .28)');
  $('engCond').textContent = e.cond; $('engCond').classList.toggle('on', S.cond);
  lab.setReadout(S.cond ? e.valOn : e.valOff, e.sub, S.cond ? e.pillOn : e.pillOff, '#ff9a3c');
  const [emo, title, lead] = S.cond ? e.on : e.off;
  lab.setState({ emo, title, lead, body: '', extra: '' }); lab.setFacts([{ emo: '💧', text: t.facts.arkwright, src: SRC.arkwright }]);
}
function renderRocket(t) {
  const r = t.rock; lab.setGlow('rgba(240, 184, 74, .26)');
  $('rockAgain').textContent = r.again;
  lab.setReadout(r.val, r.sub, S.race < RACE_T ? r.run : r.fin, '#f0b84a');
  lab.setState({ emo: r.card[0], title: r.card[1], lead: r.card[2], body: r.card[3], extra: '' });
  lab.setFacts([{ emo: '🛤️', text: t.facts.rocket, src: SRC.rocket }]);
}

// --- controls ---------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'mode') {
    let m = b.dataset.m; if (m !== 'wheel' && S.ansS === null) m = 'jenny';
    if (m !== S.mode) { S.mode = m; S.stripAt = now(); sfx.click(); }
  } else if (act === 'steam') { S.steam = !S.steam; S.stripAt = now(); sfx.click(); }
  else if (act === 'sAns') { S.ansS = i; S.stripAt = now(); (i === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'cAns') {
    S.ansCity = i; (i === 0 ? sfx.good : sfx.bad)(); S.auto = { from: S.yr, to: 1851, t0: now(), dur: 4.2 }; showStage();
  } else if (act === 'play') { if (S.play) S.play = false; else { S.auto = null; if (S.yr >= 1899) setYear(1750); S.play = true; } sfx.click(); }
  else if (act === 'dAns') { S.ansDay = i; S.dayRev = now(); (i === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'tog') { S.after = b.dataset.a === '1'; sfx.click(); }
  else if (act === 'cond') { S.cond = !S.cond; sfx.click(); }
  else if (act === 'race') { S.race = 0; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.race = 0; S.play = false; sfx.click(); if (S.sec) showStage();
  }
  render();
});
$('yr').addEventListener('input', (ev) => { S.auto = null; S.play = false; setYear(+ev.target.value); $('ctPlay').textContent = T[lang].play; sfx.tick(); });
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'day' || S.ansDay === null) return;
  const r = $('cv').getBoundingClientRect(), W = r.width, H = r.height, panelH = clamp(H * 0.2, 84, 112), ch = H - panelH - 10;
  const cx = W / 2, cy = ch / 2 + 4, dx = ev.clientX - r.left - cx, dy = ev.clientY - r.top - cy;
  if (Math.hypot(dx, dy) > Math.min(W * 0.44, ch / 2 - 4) * 1.05) return;
  S.hr = ((((Math.atan2(dy, dx) - Math.PI / 2) / TAU) * 24) % 24 + 24) % 24; sfx.tick();
});

// --- time and drawing -------------------------------------------------------------------------------------------
function tick(dt, t) {
  S.hr = (S.hr + dt * 1.1) % 24;
  if (S.sec === 'engine') S.eng += dt * 2.2;
  if (S.sec === 'rocket' && S.race < RACE_T) { const was = S.race; S.race = Math.min(RACE_T, S.race + dt); if (was < RACE_T && S.race >= RACE_T) renderRocket(T[lang]); }
  S.condT += clamp((S.cond ? 1 : 0) - S.condT, -dt / 0.9, dt / 0.9);
  S.dayM += clamp((S.after ? 1 : 0) - S.dayM, -dt / 0.9, dt / 0.9);
  if (S.auto) { const p = (t - S.auto.t0) / S.auto.dur; setYear(lerp(S.auto.from, S.auto.to, ease(p))); if (p >= 1) { S.auto = null; render(); } }
  else if (S.play) { setYear(S.yr + dt * 14); if (S.yr >= 1900) { S.play = false; render(); } }
}
canvasLoop($('cv'), (c, w, h, dt, t) => {
  tick(dt, t);
  c.save(); rr(c, 0, 0, w, h, 16); c.clip();
  const v = S.sec || lab.view;
  if (v === 'engine') sceneEngine(c, w, h, t);
  else if (v === 'rocket') sceneRocket(c, w, h, t);
  else if (v === 'city') sceneCity(c, w, h, t);
  else if (v === 'day') sceneDay(c, w, h, t);
  else {
    const tx = T[lang], stripH = clamp(h * 0.25, 70, 120), sh = h - stripH, m = S.mode, hidden = m !== 'wheel' && S.ansS === null;
    c.save(); c.beginPath(); c.rect(0, 0, w, sh); c.clip();
    let g = null;
    if (m === 'wheel') sceneWheel(c, w, sh, t); else if (m === 'jenny') sceneJenny(c, w, sh, t);
    else g = sceneMill(c, w, sh, t, m === 'mill', m === 'mill' && S.steam);
    if (g) {
      const lbl = (s, x, y) => pill(c, s, g.ox + x * g.k, g.oy + y * g.k, w, sh);
      if (m === 'mill' && S.steam) lbl(tx.engineL, 66, 250); else lbl(tx.wheelL, 84, 258);
      lbl(tx.shaft, 240, m === 'mill' ? 52 : 82);
    }
    c.restore();
    strip(c, 8, sh + 4, w - 16, stripH - 12, STRIP_N[m], hidden, t, m === 'wheel' ? -99 : S.stripAt, tx.strip, m === 'frame' || m === 'mill' ? tx.many[m] : String(STRIP_N[m]));
  }
  c.restore();
});
render();
</script>
</body>
</html>
