  c.save(); c.globalAlpha *= mT; ell(c, x, y + r * .78, r * .82, r * .55, '#b0343a', '#5e1418', 1.5); ell(c, x, y + r * .38, r * .52, r * .17, '#f6f2ea', '#8c8368', 1); c.restore();
  c.save(); c.globalAlpha *= 1 - mT; ell(c, x, y + r * .78, r * .82, r * .55, '#2f3a5c', '#151a30', 1.5); poly(c, [[x - r * .22, y + r * .36], [x + r * .22, y + r * .36], [x, y + r * .8]], '#f6f2ea', null); poly(c, [[x - r * .06, y + r * .4], [x + r * .06, y + r * .4], [x + r * .05, y + r * .75], [x, y + r * .85], [x - r * .05, y + r * .75]], '#d9453f', null); c.restore();

  c.beginPath(); c.arc(x, y - r * .02, r * .12, .25, Math.PI - .25); c.lineWidth = 1.5; c.strokeStyle = '#a8523f'; c.stroke();
  c.save(); c.globalAlpha *= mT; // the crown
  const cy2 = y - r * .42; c.beginPath(); c.moveTo(x - r * .28, cy2); c.lineTo(x - r * .3, cy2 - r * .3); c.lineTo(x - r * .14, cy2 - r * .14); c.lineTo(x, cy2 - r * .36); c.lineTo(x + r * .14, cy2 - r * .14); c.lineTo(x + r * .3, cy2 - r * .3); c.lineTo(x + r * .28, cy2); c.closePath(); fs(c, lin(c, 0, cy2 - r * .36, 0, cy2, [[0, '#ffe27a'], [1, '#d09a22']]), '#8f6c1c', 1.3);
  for (const dx of [-.3, 0, .3]) circ(c, x + dx * r, cy2 - r * (dx ? .32 : .38), r * .05, '#d9453f'); c.restore();

function arrow(c, x0, y0, x1, y1, col, lw) {

function drawForms(c, w, h, dt, time) {

    const a1 = i < 4 ? SPOKE[i + 1] : SPOKE[0] + TAU; c.beginPath(); c.moveTo(ox, oy);
    for (let j = 0; j <= 12; j++) { const a = lerp(a0, a1, j / 12); c.lineTo(ox + Math.cos(a) * rx * 1.4, oy + Math.sin(a) * ry * 1.4); }
    c.closePath(); c.globalAlpha = fT * .85; fs(c, TINT[i], null); c.globalAlpha = 1;
  });

  }

    circ(c, 0, 0, 34, lin(c, -30, -30, 30, 30, [[0, '#fff3c4'], [1, '#e2b552']]), '#8f6c1c', 2.5); emoji(c, JOBS.find((j) => j[0] === S.job)[1], 0, 0, 36); c.restore();
    tag(c, t.jobs[S.job], jx, 100, { pad: 14 });

}

// --- secrets ---------------------------------------------------------------------------------------------------------
function drawSecret(c, w, h, dt, time) {
  const z = easeOut(c01((time - S.secAt) / 1.5)), t = T[lang];
  if (S.sec === 'a') {
    c.fillStyle = '#8f8670'; c.fillRect(0, 0, w, h);
    c.save(); const k = .42 + .58 * z, my = h * .5; c.translate(w / 2, my); c.scale(k, k); c.translate(-w / 2, -my); // zoom in from the city around
    if (z < .995) for (let gx = Math.floor((w / 2 - w / 2 / k) / 46) * 46; gx < w / 2 + w / 2 / k; gx += 46) for (let gy = Math.floor((my - h / 2 / k) / 38) * 38; gy < my + h / 2 / k; gy += 38) { const n = Math.abs(Math.sin(gx * .13 + gy * .07)); c.fillStyle = ['#b9a98a', '#a99a7d', '#c8b99b', '#9d8f74'][Math.floor(n * 4) % 4]; c.fillRect(gx + 3, gy + 3, 40, 32); }
    c.save(); rr(c, 0, 0, w, h, 18); c.clip(); SCENES[0](c, 0, 0, w, h, time, true); c.restore(); rr(c, 0, 0, w, h, 18); c.lineWidth = 3 / k; c.strokeStyle = '#e2b552'; c.stroke();
    c.restore();

    const e = easeOut(c01((time - S.secAt) / 1.1)), pw = Math.min(w - 32, 340), ph = h * .82, x = (w - pw) / 2, y = h * .09 + (1 - e) * h;
    ell(c, w / 2, y + ph + 10, pw * .5, 10, 'rgba(0,0,0,.35)');
    rr(c, x, y, pw, ph, 6); fs(c, lin(c, x, y, x + pw, y + ph, [[0, '#f7ecce'], [1, '#e6d5a6']]), '#9a8352', 1.5);
    for (const ry2 of [y - 8, y + ph - 8]) { rr(c, x - 8, ry2, pw + 16, 16, 8); fs(c, lin(c, 0, ry2, 0, ry2 + 16, [[0, '#f4e7c4'], [.5, '#d4bf8a'], [1, '#b8a06a']]), '#8a7444', 1.5); }

      c.textAlign = 'left'; c.fillStyle = '#3b2c18'; c.font = '800 16px Nunito, sans-serif'; c.fillText(`${i + 1}. ${cap(t.pieces[k])}`, x + 70, ly - 9, pw - 90);
      c.fillStyle = '#6b5638'; c.font = '600 13px Nunito, sans-serif'; c.fillText(t.pieceHint[k], x + 70, ly + 11, pw - 90); c.restore();
    });
    seal(c, x + pw - 46, y + ph - 40, 24);

}

// --- the draw loop -----------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  V.w = w; V.h = h; c.lineJoin = 'round'; c.lineCap = 'round';
  if (S.sec) return drawSecret(c, w, h, dt, time);
  const v = lab.view;
  if (v === 'build') drawBuild(c, w, h, dt, time); else if (v === 'test') drawTest(c, w, h, dt, time); else drawForms(c, w, h, dt, time);
});

// --- controls ----------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = b.dataset.k;
  if (act === 'row') { if (S.done) takeAway(k); else if (S.have[k]) sfx.tick(); else place(k); return; }
  if (act === 'put') { if (S.missing) place(S.missing); return; }
  if (act === 'flag') { S.flag = +b.dataset.i; sfx.click(); }
  else if (act === 'yn') {
    if (S.ans !== null) return;
    const pi = S.order[S.pi], ok = (b.dataset.v === 'y') === T[lang].places[pi].ok;
    S.ans = b.dataset.v; S.ansAt = now(); S.right[S.pi] = ok; S.rev.add(pi); (ok ? sfx.good : sfx.bad)(); render(); showStage(); return;
  } else if (act === 'next') {
    if (S.pi >= 6) { S.pi = 0; S.right = []; S.rev = new Set(); } else S.pi++;
    S.ans = null; sfx.click();
  } else if (act === 'mon') { S.mon = b.dataset.v === '1'; S.ex = null; sfx.click(); }
  else if (act === 'fed') { S.fed = b.dataset.v === '1'; S.ex = null; sfx.click(); }
  else if (act === 'ex') {
    if (S.fq === null && (k === 'ru' || k === 'de')) { const q = $('waPq'); q.classList.remove('wa-shake'); void q.offsetWidth; q.classList.add('wa-shake'); sfx.bad(); return; }
    S.ex = k; S.mon = !!EX[k].mon; S.fed = !!EX[k].fed; sfx.click();
  } else if (act === 'fq') { if (S.fq !== null) return; S.fq = +b.dataset.o; (S.fq === 0 ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  else if (act === 'job') { S.job = S.job === k ? null : k; S.jobAt = now(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.secAt = now(); sfx.click();

});

// --- one render per change: controls, readout, state card, facts ---------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = S.sec ? 'sec' : v;
  $('waBuild').style.display = v === 'build' ? 'block' : 'none';
  $('waTest').style.display = v === 'test' ? 'block' : 'none';
  $('waForms').style.display = v === 'forms' ? 'block' : 'none';
  askEl.style.display = v === 'test' && !S.sec && S.pi < 6 ? 'block' : 'none';
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret wa-t ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('waSecChips').innerHTML = sc('a', '🏰') + sc('b', '📜');
  if (v === 'build') renderBuild(t); else if (v === 'test') renderTest(t); else renderForms(t);
  if (S.sec) { const [ti, de] = t.secrets[S.sec]; lab.setState({ emo: S.sec === 'a' ? '🏰' : '📜', title: ti, lead: de, body: '', extra: '' }); }
}
function renderBuild(t) {
  const n = KEYS.filter((k) => S.have[k]).length;

  $('waRowLbl').textContent = S.done ? t.takeAway : '';
  $('waRowLbl').parentElement.style.display = S.done ? 'flex' : 'none';
  $('waRows').innerHTML = KEYS.map((k) => `<button class="wa-row ${S.have[k] ? 'in' : S.done ? 'gone' : ''}" data-act="row" data-k="${k}"><span class="e">${EMO_P[k]}</span><span><b>${esc(cap(t.pieces[k]))}</b><i>${esc(t.pieceHint[k])}</i></span><span class="m">${S.have[k] ? '✓' : S.done ? '✗' : '+'}</span></button>`).join('');
  $('waFlagRow').style.display = S.done ? 'flex' : 'none'; $('waFlagLbl').textContent = t.pickFlag;
  $('waSws').innerHTML = FLAGS.map((f, i) => `<button class="${i === S.flag ? 'on' : ''}" data-act="flag" data-i="${i}" aria-label="${esc(t.pickFlag)} ${i + 1}" style="background:linear-gradient(${f[0]} 0 33.3%, ${f[1]} 33.3% 66.6%, ${f[2]} 66.6% 100%)"></button>`).join('');

}
function renderTest(t) {

  lab.setGlow('rgba(78, 168, 255, .26)'); lab.setReadout(`${k} / 6`, t.judged, '', '#5fa8d0');
  if (p) askEl.innerHTML = `<span class="wa-n">${S.pi + 1} / 6</span><b>${esc(p.name)}</b><p>${esc(p.d)}</p>`;

  const ok = p && ans !== null && (ans === 'y') === p.ok;
  $('waRes').innerHTML = p && ans !== null ? `<b style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.notQuite)}</b>${esc(p.why)}` : '';

    return `<button class="chip wa-t ${S.ex === k ? 'on' : ''} ${locked ? 'wa-lock' : ''} ${match ? 'wa-match' : ''} ${answered && (k === 'ru' || k === 'de') && S.ex !== k ? 'wa-hint' : ''}" data-act="ex" data-k="${k}">${esc(t.examples[k])}</button>`;
  }).join('');
  $('waNote').textContent = t.simplified;
  $('waJobsT').textContent = t.jobsTitle;
  $('waJobs').innerHTML = JOBS.map(([k, e]) => `<button class="chip wa-t ${S.job === k ? 'on' : ''}" data-act="job" data-k="${k}">${e} ${esc(t.jobs[k])}</button>`).join('');
  $('waJobLine').textContent = S.job ? t.jobLines[S.job] : '';
  lab.setState({ ...t.state.forms, extra: '' });
  lab.setFacts(answered ? t.facts.forms : []);
