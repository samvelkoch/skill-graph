      if (S.prev) return;
      S.ppick = i; S.prev = true; S.prt = now();
      const ok = plateRight(S.pi, i); S.pres[S.pi] = ok; (ok ? sfx.good : sfx.bad)();
    }
    showStage(); render(); return;
  }
  if (act === 'next') {
    sfx.click();
    if (v === 'skulls') {
      if (S.r >= ROUNDS.length - 1) { S.r = 0; S.res = []; } else S.r++;
      S.pick = null; S.rev = false; S.turnAt = now();
    } else if (v === 'mine') {
      if (S.mi >= FOODS.length - 1) { S.mi = 0; S.mres = []; } else S.mi++;
      S.mpick = null; S.mrev = false; S.msel = null;
    } else {
      if (S.pi >= 2) { S.pi = 0; S.pres = []; } else S.pi++;
      S.ppick = null; S.prev = false;
    }
    render();
  }
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
const dots = (res, cur, n) => Array.from({ length: n }, (_, i) => (res[i] !== undefined ? (res[i] ? '✔' : '✘') : i === cur ? '◉' : '○')).join(' ');
const verdictHtml = (ok, t) => `<div class="verdict ${ok ? 'ok' : 'no'}">${ok ? '✅' : '🤔'} ${esc(ok ? t.right : t.wrong)}</div>`;
const nextBtn = (last, t) => `<div class="row2"><button class="btn" data-act="next">${esc(last ? t.again : t.next)}</button></div>`;
const fineHtml = (t) => `<div class="fine">${esc(t.fine)}</div>`;
const cardOf = (t, k) => { const [emo, title, lead, body] = t.cards[k]; return { emo, title, lead, body }; };
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v === 'skulls') renderSkulls(t); else if (v === 'mine') renderMine(t); else renderPlate(t);
}

function renderSkulls(t) {
  const open = secret.unlocked();
  const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  const chips = `<div class="row2 secrow">${chip('shark', '🦈')}${chip('elephant', '🐘')}</div>`;
  if (S.sec === 'shark') {
    lab.setGlow('rgba(95, 168, 200, .26)');
    lab.setReadout(`🦷 ${S.shark.lost}`, '', '', '#5fa8c8');
    $('ctrlBody').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn" data-act="bite">${esc(t.sec.bite)}</button></div>${chips}`;
    lab.setState({ emo: '🦈', title: t.secrets.shark[0], lead: t.sec.sharkText, body: '', extra: '' });
    return;
  }
  if (S.sec === 'elephant') {
    lab.setGlow('rgba(200, 170, 110, .26)');
    lab.setReadout(`${S.eleph.kt + 1} / 6`, '', '', '#c8aa6e');
    $('ctrlBody').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn" data-act="eleph">${esc(S.eleph.kt >= 5 ? t.again : t.sec.next)}</button></div>${chips}`;
    lab.setState({ emo: '🐘', title: t.secrets.elephant[0], lead: t.sec.elephantText, body: '', extra: '' });
    return;
  }
  const key = ROUNDS[S.r], right = DIET[key], n = ROUNDS.length, rev = S.rev;
  const btns = ANSWERS.map((k, i) => {
    const cls = !rev ? '' : k === right ? 'ok' : i === S.pick ? 'no' : 'dim';
    return `<button class="ans ${cls}" data-act="ans" data-i="${i}"${rev ? ' disabled' : ''}>${esc(t.s[k])}</button>`;
  }).join('');
  $('ctrlBody').innerHTML = `<div class="qline">${esc(t.s.q)}</div><div class="ansrow">${btns}</div>${rev ? verdictHtml(S.res[S.r], t) + nextBtn(S.r === n - 1, t) : ''}${chips}`;
  const sub = dots(S.res, S.r, n);
  if (!rev) {
    lab.setGlow('rgba(217, 190, 130, .22)');
    lab.setReadout('?', sub, '', '#4ea8ff');
    lab.setState({ ...cardOf(t, 'skulls'), extra: fineHtml(t) });
  } else {
    lab.setGlow('rgba(217, 190, 130, .22)');
    lab.setReadout(esc(t.s.names[key]), sub, t.s[right], DCOL[right]);
    lab.setState({ emo: S.res[S.r] ? '✅' : '🤔', title: S.res[S.r] ? t.right : t.wrong, lead: t.s.why[key], body: key === 'gorilla' ? t.s.gorilla : '', extra: fineHtml(t) });
  }
}

function renderMine(t) {
  const food = FOODS[S.mi], right = MRIGHT[food], n = FOODS.length, rev = S.mrev;
  lab.setGlow('rgba(224, 150, 160, .22)');
  const btns = MPERM[food].map((i) => {
    const cls = !rev ? '' : i === right ? 'ok' : i === S.mpick ? 'no' : 'dim';
    return `<button class="ans ${cls}" data-act="ans" data-i="${i}"${rev ? ' disabled' : ''}>${esc(t.m.opts[i])}</button>`;
  }).join('');
  const info = S.msel !== null && TEETH[S.msel] ? t.m.types[TEETH[S.msel].type] : t.m.tap;
  $('ctrlBody').innerHTML = `<div class="qline">${esc(t.m.q(food))}</div><div class="ansrow">${btns}</div>
    <div class="tapinfo">${esc(info)}</div>${rev ? verdictHtml(S.mres[S.mi], t) + nextBtn(S.mi === n - 1, t) : ''}`;
  const sub = dots(S.mres, S.mi, n);
  if (!rev) {
    lab.setReadout('?', sub, '', '#e0b050');
    lab.setState(cardOf(t, 'mine'));
  } else {
    lab.setReadout(MEMO[food], sub, t.m.opts[right], '#e0b050');
    lab.setState({ emo: S.mres[S.mi] ? '✅' : '🤔', title: S.mres[S.mi] ? t.right : t.wrong, lead: t.m.why[food], body: '', extra: '' });
  }
}

function renderPlate(t) {
  const q = S.pi, n = 3, rev = S.prev;
  const qs = [t.p.q1, t.p.q2, t.p.q3], opts = [t.p.groups, t.p.o2, t.p.o3][q], rs = [t.p.r1, t.p.r2, t.p.r3][q];
  lab.setGlow('rgba(111, 179, 111, .22)');
  const btns = opts.map((o, i) => {
    const ok = plateRight(q, i), cls = !rev ? '' : ok ? 'ok' : i === S.ppick ? 'no' : 'dim';
    const dot = q === 0 ? `<span class="dot" style="background:${PCOL[i]}"></span>` : '';
    const pc = q === 0 && rev ? `<span class="pc">≈ ${PPCT[i]}%</span>` : '';
    return `<button class="ans ${cls}" data-act="ans" data-i="${i}"${rev ? ' disabled' : ''}>${dot}<span>${esc(o)}</span>${pc}</button>`;
  }).join('');
  const verdict = rev ? `<div class="verdict ${S.pres[q] ? 'ok' : 'no'}">${S.pres[q] ? '✅' : '🤔'} ${esc(S.pres[q] ? t.right : t.p.look)}</div>` : '';
  $('ctrlBody').innerHTML = `<div class="qline">${esc(qs[q])}</div><div class="ansrow list">${btns}</div>${verdict}${rev ? nextBtn(q === n - 1, t) : ''}`;
  const sub = dots(S.pres, q, n);
  if (!rev) {
    lab.setReadout('?', sub, '', '#6fb36f');
    lab.setState({ ...cardOf(t, 'plate'), extra: fineHtml(t) });
  } else {
    lab.setReadout(PEMO[q], sub, '', '#6fb36f');
    lab.setState({ emo: S.pres[q] ? '✅' : '🤔', title: S.pres[q] ? t.right : t.p.look, lead: rs, body: '', extra: q === 0 ? fineHtml(t) : '' });
  }
}
render();
</script>
