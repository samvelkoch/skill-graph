    const fg = c.createLinearGradient(0, YT, 0, YB); fg.addColorStop(0, 'rgba(255,214,90,.34)'); fg.addColorStop(1, 'rgba(255,214,90,0)'); c.fillStyle = fg; c.fill();
    c.shadowColor = 'rgba(255,214,90,.8)'; c.shadowBlur = 8; c.lineWidth = 4; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#ffd35a'; c.beginPath(); pts.forEach(([x, y], k) => (k ? c.lineTo(x, y) : c.moveTo(x, y))); c.stroke(); c.restore();
  }
  // faces at reached points; a moving face at the head
  for (let i = 0; i < 4; i++) if (P >= i - 1e-6 && i < S.n) { const [x, y] = i === 0 || P >= i ? [COLX[i], VY(DAY.v[i])] : curveAt(P); if (i < Math.floor(P + 1e-3) + 1) { c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 6; head(c, x, y, 17, '#ffd86b', DAY.mood[i], tm); c.restore(); } }
  if (P < S.n - 1 - 1e-3) { const [x, y] = curveAt(P), k = P - Math.floor(P), nm = DAY.mood[Math.min(3, Math.floor(P) + 1)]; c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 6; head(c, x, y, 17, '#ffd86b', k > .5 ? nm : DAY.mood[Math.floor(P)], tm); c.restore(); }
  else if (S.n === 1) { /* only the morning face, drawn above */ }
}

// --- secrets: dog park and inside sky --------------------------------------------------------------------------
function friend(c, x, y, skin, shirt, mood, tm, hair, sc = 1) {
  c.save(); c.translate(x, y); c.scale(sc, sc);
  shadow(c, 0, 1, 24, 6, .22);
  blob(c, -7, -3, 7, 4.5, '#5a4a7a'); blob(c, 7, -3, 7, 4.5, '#5a4a7a');
  blob(c, -18, -26, 5, 10, shirt); blob(c, 18, -26, 5, 10, shirt);
  blob(c, 0, -23, 17, 21, shirt);
  head(c, 0, -52, 18, skin, mood, tm, hair);
  c.restore();
}
function dog(c, x, y, tm, excited, bark) {
  const hop = excited ? Math.abs(Math.sin(tm * 9)) * 14 : 0, wag = Math.sin(tm * (excited ? 22 : 6)) * (excited ? .55 : .28);
  shadow(c, x, y + 2, 30 - hop * .3, 6, .22);
  c.save(); c.translate(x, y - hop);
  c.save(); c.translate(24, -26); c.rotate(-.5 + wag); blob(c, 8, 0, 11, 4.5, '#c98d4a'); c.restore();
  blob(c, -12, -3, 6, 4.5, '#c98d4a'); blob(c, 12, -3, 6, 4.5, '#c98d4a');
  blob(c, 0, -19, 25, 19, '#d9a15f');
  blob(c, -18, -44, 8, 14, '#8a5a2e'); blob(c, 18, -44, 8, 14, '#8a5a2e');
  blob(c, 0, -43, 19, 18, '#e0ad6a');
  blob(c, 0, -35, 11, 7.5, '#f6dfb8', false); blob(c, 0, -39.5, 4.6, 3.3, '#2b2233', false);
  [-1, 1].forEach((s) => { blob(c, s * 8, -48, 3, 3, '#2b2233', false); c.fillStyle = '#fff'; c.beginPath(); c.arc(s * 8 - 1, -49, 1, 0, Math.PI * 2); c.fill(); });
  c.strokeStyle = '#2b2233'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(0, -36); c.lineTo(0, -33); c.stroke(); c.beginPath(); c.arc(-3.2, -33, 3.2, 0, Math.PI * .9); c.arc(3.2, -33, 3.2, Math.PI * .1, Math.PI); c.stroke();
  if (excited) blob(c, 0, -29, 3.4, 4.6, '#f27f90', false);
  c.restore();
  if (bark) pill(c, bark, x, y - 80, { px: 13 });
}
function drawDogs(c, tm) {
  const t = T[lang], since = S.tm - S.dogT, ex = since < 3.2, k = ex ? Math.exp(-since * .25) : 0;
  let g = c.createLinearGradient(0, -80, 0, 250); g.addColorStop(0, '#79bdf0'); g.addColorStop(1, '#d9f0fb'); c.fillStyle = g; c.fillRect(-400, -400, W + 800, 650);
  cloud(c, ((60 + tm * 6) % (W + 100)) - 20, 52, 1, '#ffffff', .9); cloud(c, ((250 + tm * 4) % (W + 100)) - 20, 84, .8, '#ffffff', .85);
  blob(c, 60, 250, 170, 44, '#86c996', false); blob(c, 320, 254, 190, 50, '#6eb685', false);
  // tree
  rrect(c, 308, 168, 14, 70, 5, '#8a5a2e'); blob(c, 315, 150, 40, 36, '#4fa66a'); blob(c, 296, 170, 24, 20, '#5fb87a'); blob(c, 336, 168, 22, 20, '#5fb87a');
  g = c.createLinearGradient(0, 244, 0, 430); g.addColorStop(0, '#7ccb8b'); g.addColorStop(1, '#4b9a68'); c.fillStyle = g; c.fillRect(-400, 262, W + 800, 400);
  for (let i = 0; i < 9; i++) { const x = 6 + i * 42; rrect(c, x, 232, 10, 36, 4, '#f1e6cf'); }
  rrect(c, 0, 241, W, 6, 3, '#e7d9bb'); rrect(c, 0, 254, W, 6, 3, '#e7d9bb');
  // friends: Nina (left, loves dogs), Ben (right, steps back)
  const benX = 296 + k * 22, ninaX = 64 - k * 4;
  friend(c, ninaX, 360, '#f6d3b0', '#f27fa4', 'happy', tm, '#3b2a45', 1.25);
  friend(c, benX, 360, '#d9a273', '#5f8fd0', 'scared', tm, '#2f2438', 1.25);
  dog(c, 180 + (ex ? Math.sin(tm * 2.2) * 14 * k : 0), 352, tm, ex, ex && since < 1.6 ? t.sc.woof : null);
  // hearts for Nina, sweat for Ben
  for (let i = 0; i < 3; i++) { const f = ((tm * .5 + i / 3) % 1), x = ninaX + 20 + i * 10 + Math.sin(f * 6 + i) * 4, y = 296 - f * 50; c.save(); c.globalAlpha = (1 - f) * (ex ? 1 : .6); c.font = `${14 + i * 2}px sans-serif`; c.textAlign = 'center'; c.fillStyle = '#000'; c.fillText('💗', x, y); c.restore(); }
  pill(c, '😍', ninaX, 268, { px: 14 }); pill(c, '😨', benX, 268, { px: 14 });
}
function drawSkyWin(c, x, y, w, h, kind, tm) {
  c.save(); c.beginPath(); c.roundRect(x, y, w, h, 16); c.clip();
  const pal = { sun: ['#4aa3f0', '#cfeaff'], cloud: ['#7a93b8', '#cdd8e8'], rain: ['#4b5875', '#8d9ab3'] }[kind];
  const g = c.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]); c.fillStyle = g; c.fillRect(x, y, w, h);
  if (kind === 'sun') { const sx = x + w * .5, sy = y + h * .42; const gl = c.createRadialGradient(sx, sy, 4, sx, sy, 55); gl.addColorStop(0, 'rgba(255,240,170,.9)'); gl.addColorStop(1, 'rgba(255,240,170,0)'); c.fillStyle = gl; c.fillRect(x, y, w, h); c.strokeStyle = 'rgba(255,224,110,.9)'; c.lineWidth = 3; c.lineCap = 'round'; for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + tm * .3; c.beginPath(); c.moveTo(sx + Math.cos(a) * 22, sy + Math.sin(a) * 22); c.lineTo(sx + Math.cos(a) * 31, sy + Math.sin(a) * 31); c.stroke(); } blob(c, sx, sy, 17, 17, '#ffd54a'); }
  if (kind === 'cloud') { cloud(c, x + 38 + Math.sin(tm * .6) * 6, y + 42, 1, '#ffffff', .95); cloud(c, x + 66 - Math.sin(tm * .5) * 6, y + 68, .8, '#e8eef7', .9); }
  if (kind === 'rain') { cloud(c, x + 50, y + 28, 1.1, '#5d6a86', 1); c.strokeStyle = 'rgba(200,225,255,.85)'; c.lineWidth = 1.6; c.lineCap = 'round'; c.beginPath(); for (let i = 0; i < 16; i++) { const dx = x + 8 + rnd(i, 1) * (w - 16), dy = y + 44 + ((tm * 120 * (.8 + rnd(i, 2) * .4) + rnd(i, 3) * 80) % (h - 44)); c.moveTo(dx, dy); c.lineTo(dx - 2, dy + 8); } c.stroke(); }
  c.restore(); c.lineWidth = 3; c.strokeStyle = '#f3ead6'; c.beginPath(); c.roundRect(x, y, w, h, 16); c.stroke(); c.lineWidth = 1.5; c.strokeStyle = '#8a7a5a'; c.beginPath(); c.roundRect(x - 1.5, y - 1.5, w + 3, h + 3, 17); c.stroke();
}
function drawInside(c, tm) {
  const t = T[lang];
  let g = c.createLinearGradient(0, -80, 0, 300); g.addColorStop(0, '#5a4a86'); g.addColorStop(1, '#8c6f9e'); c.fillStyle = g; c.fillRect(-400, -400, W + 800, 700);
  g = c.createLinearGradient(0, 296, 0, 430); g.addColorStop(0, '#b9854f'); g.addColorStop(1, '#7a5230'); c.fillStyle = g; c.fillRect(-400, 296, W + 800, 400);
  const i0 = SKY.indexOf(S.sky), seq = [S.sky, SKY[(i0 + 1) % 3], SKY[(i0 + 2) % 3]], lbl = [t.sc.now, t.sc.later, t.sc.night];
  seq.forEach((k, i) => {
    const cx = 62 + i * 118, x = cx - 50;
    drawSkyWin(c, x, 24, 100, 100, k, tm);
    pill(c, `${lbl[i]}: ${t.sc.sk[k]}`, cx, 144, { px: 12 });
    friend(c, cx, 366, '#f6d3b0', ['#f2bd4a', '#7fc4a0', '#8f7fd0'][i], SKY_MOOD[k], tm, '#6b4528', 1.25);
    if (i < 2) { c.fillStyle = 'rgba(255,255,255,.85)'; c.font = `900 ${fz(20)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('›', cx + 59, 76); }
  });
}

// --- the loop ---------------------------------------------------------------------------------------------------
let GEO = { ox: 0, oy: 0 };
canvasLoop($('cv'), (c, w, h, dt, tm) => {
  SC = Math.min(w / W, h / H); GEO = { ox: (w - W * SC) / 2, oy: (h - H * SC) / 2 };
  S.tm += dt;
  if (S.rev) { S.rt += dt; S.wt = ease(S.rt / 1.6); }
  const cur = S.cur; if (S.cards[cur] && S.pr[cur] < 1) S.pr[cur] = Math.min(1, S.pr[cur] + dt / 1.1);
  if (S.cards[cur] && S.pr[cur] >= 1 && lab.view === 'because') { S.hold += dt; if (S.hold > 1.5) { const nx = S.cards.findIndex((f, i) => !f && i !== cur); S.hold = -99; if (nx >= 0) { S.cur = nx; S.cardAt = S.tm; render(); } } }
  const dd = S.n - 1 - S.p; if (Math.abs(dd) > 1e-4) S.p += clamp(dd, -dt * .85, dt * .85);
  c.save(); c.translate(GEO.ox, GEO.oy); c.scale(SC, SC);
  if (S.sec === 'dogs') drawDogs(c, S.tm); else if (S.sec === 'sky') drawInside(c, S.tm);
  else if (lab.view === 'faces') drawVillage(c, S.tm); else if (lab.view === 'because') drawMachine(c, S.tm, dt); else drawDay(c, S.tm, dt);
  c.restore();
});

// --- input ---------------------------------------------------------------------------------------------------------
function loc(ev) { const r = $('cv').getBoundingClientRect(); return [(ev.clientX - r.left - GEO.ox) / SC, (ev.clientY - r.top - GEO.oy) / SC]; }
$('cv').addEventListener('pointerdown', (ev) => {
  const [x, y] = loc(ev);
  if (S.sec === 'dogs') { callDog(); return; }
  if (S.sec) return;
  if (lab.view === 'faces') {
    let best = null, bd = 1e9;
    NB.forEach((nb) => { const d = Math.hypot(x - nb.x, y - (nb.y - 36)); if (d < bd) { bd = d; best = nb; } });
    if (best && bd < 44 && (S.rev || ASK[S.wx].includes(best.id))) { S.sel = best.id; sfx.tick(); render(); }
  } else if (lab.view === 'because') {
    const cw = 62, gap = 8, x0 = (W - (5 * cw + 4 * gap)) / 2;
    for (let i = 0; i < 5; i++) { const cx = x0 + i * (cw + gap); if (x >= cx && x <= cx + cw && y >= 250 && y <= 352) { if (S.cur !== i) { S.cur = i; S.cardAt = S.tm; S.hold = 0; sfx.click(); render(); } break; } }
  }
});
function callDog() { S.dogT = S.tm; sfx.click(); render(); }
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function newRound(wx) { S.wx = wx; S.g = {}; S.rev = false; S.rt = 0; S.wt = 0; S.sel = ASK[wx][0]; }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'wx') { if (S.wx === v && !S.rev) return; newRound(v); S.sec = null; sfx.click(); }
  else if (a === 'f1') {
    if (S.rev) return;
    S.g[S.sel] = v; sfx.tick();
    const nx = ASK[S.wx].find((id) => !S.g[id]); if (nx) S.sel = nx;
  } else if (a === 'go') {
    if (S.rev) { newRound(S.wx); sfx.click(); }
    else if (ASK[S.wx].every((id) => S.g[id])) { S.rev = true; S.rt = 0; const k = ASK[S.wx].filter((id) => S.g[id] === TR[S.wx][id]).length; (k === 3 ? sfx.good : sfx.snap)(); showStage(); }
  } else if (a === 'f2') {
    S.cards[S.cur] = v; S.pr[S.cur] = 0; S.hold = 0; sfx.push(); showStage();
  } else if (a === 'dir') {
    if (S.n >= 4 || S.p < S.n - 1 - .02) return;
    const up = DAY.v[S.n] > DAY.v[S.n - 1], ok = (v === 'up') === up; S.res.push(ok); S.n++; (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'again3') { S.n = 1; S.p = 0; S.res = []; sfx.click(); }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === v ? null : v; sfx.click(); if (S.sec) showStage(); }
  else if (a === 'dog') callDog();
  else if (a === 'sky') { S.sky = v; sfx.tick(); }
  render();
});

// --- render: controls, readout and state card -----------------------------------------------------------------
const faceChips = (act, list, disabled) => list.map((m) => `<button class="chip sr" data-act="${act}" data-v="${m}"${disabled ? ' disabled' : ''}>${EMO[m]} ${esc(T[lang].fl[m])}</button>`).join('');
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
  show('s1', v === 'faces' && !sec); show('s2', v === 'because' && !sec); show('s3', v === 'day' && !sec);
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-v="${k}">${open ? `${emo} ${esc(t.sc[k])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('dogs', '🐕') + sc('sky', '🌤️');
  $('secExtra').innerHTML = sec === 'dogs' ? `<div class="row2"><button class="chip sr" data-act="dog">${esc(t.sc.dogCall)}</button></div>`
    : sec === 'sky' ? `<div class="who">${esc(t.sc.pick)}</div><div class="chips">${SKY.map((k) => `<button class="chip sr ${S.sky === k ? 'on' : ''}" data-act="sky" data-v="${k}">${{ sun: '☀️', cloud: '☁️', rain: '🌧️' }[k]} ${esc(t.sc.sk[k])}</button>`).join('')}</div>` : '';
  if (sec) {
    lab.setGlow(sec === 'dogs' ? 'rgba(120,190,120,.26)' : 'rgba(143,127,208,.28)');
    lab.setReadout(sec === 'dogs' ? '🐕' : EMO[SKY_MOOD[S.sky]], '', '', sec === 'dogs' ? '#6fb36f' : '#8f7fd0');
    lab.setState(sec === 'dogs' ? { emo: '🐕', title: t.sc.dogTitle, lead: t.sc.dogLead, body: '', extra: '' } : { emo: '🌤️', title: t.sc.skyTitle, lead: t.sc.skyLead, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  const fc = t.facts[{ faces: 'faces', because: 'because', day: 'day' }[v]], fe = T.en.facts[{ faces: 'faces', because: 'because', day: 'day' }[v]];
  lab.setFacts([{ emo: v === 'faces' ? '🌍' : v === 'because' ? '🗣️' : '📈', text: fc.text, src: fc.src || fe.src }]);
  if (v === 'faces') renderFaces(t); else if (v === 'because') renderBecause(t); else renderDay(t);
}
function renderFaces(t) {
  lab.setGlow('rgba(95,168,220,.26)');
  const ask = ASK[S.wx], done = ask.filter((id) => S.g[id]).length, rev = S.rev;
  $('wxRow').innerHTML = ['sun', 'rain', 'snow', 'wind'].map((k) => `<button class="chip sr ${S.wx === k ? 'on' : ''}" data-act="wx" data-v="${k}">${WXEMO[k]} ${esc(t.wx[k])}</button>`).join('');
  $('who1').style.display = rev ? 'none' : ''; $('fRow1').style.display = rev ? 'none' : '';
  $('who1').textContent = t.v1.who(t.nb[S.sel]);
  $('fRow1').innerHTML = faceChips('f1', FACE5, false);
  const goB = $('goB'); goB.textContent = rev ? t.v1.again : t.v1.go; goB.disabled = !rev && done < 3;
  if (!rev) {
    lab.setReadout('?', t.v1.sub(done), '', '#5fa8dc');
    lab.setState({ emo: '🤔', title: t.v1.qTitle, lead: t.v1.qLead, body: '', extra: '' });
    return;
  }
  const k = ask.filter((id) => S.g[id] === TR[S.wx][id]).length;
  lab.setReadout(`${k}/3`, '', `${WXEMO[S.wx]} ${t.wx[S.wx]}`, '#5fa8dc');
  const lis = ask.map((id) => { const f = TR[S.wx][id], mine = S.g[id]; return `<li><b>${EMO[f]} ${esc(t.nb[id])}</b> · ${esc(t.fw[f])}: ${esc(t.why[S.wx][id])}${mine === f ? ' ✓' : ` <span style="color:var(--faint)">(${esc(t.v1.you)}: ${EMO[mine]})</span>`}</li>`; }).join('');
  lab.setState({ emo: k === 3 ? '✅' : '🌦️', title: k === 3 ? t.v1.right : t.v1.some(k), lead: k === 3 ? t.v1.allLead : t.v1.someLead, body: '', extra: `<ul class="sr-list">${lis}</ul><div class="sr-fine">${esc(t.v1.sec)}</div><div class="sr-fine">${esc(t.fine)}</div>` });
}
function renderBecause(t) {
  lab.setGlow('rgba(95,180,190,.26)');
  const cur = S.cur, f = S.cards[cur], n = S.cards.filter((x, i) => x && S.pr[i] > 0).length;
  $('who2').textContent = t.v2.who; $('fRow2').innerHTML = faceChips('f2', MOODS, false);
  $('fRow2').querySelectorAll('.chip').forEach((b) => b.classList.toggle('on', b.dataset.v === f));
  lab.setReadout(`${n}/5`, t.v2.sub, f ? EMO[f] : '', '#5fb3c0');
  if (!f) lab.setState({ emo: '💬', title: t.v2.qTitle, lead: t.v2.qLead(t.v2.card[cur]), body: '', extra: '' });
  else if (n === 5) lab.setState({ emo: '🖨️', title: t.v2.allTitle, lead: t.v2.allLead, body: '', extra: `<ul class="sr-list">${S.cards.map((x, i) => `<li>${EMO[x]} ${esc(t.v2.sent(t.fw[x], t.v2.trig[i]))}</li>`).join('')}</ul>` });
  else lab.setState({ emo: '🖨️', title: t.v2.printed, lead: t.v2.sent(t.fw[f], t.v2.trig[cur]), body: '', extra: '' });
}
function renderDay(t) {
  lab.setGlow('rgba(240,180,58,.24)');
  const n = S.n, end = n >= 4;
  $('who3').textContent = end ? '' : t.v3.who; $('who3').style.display = end ? 'none' : '';
  $('dRow').innerHTML = end ? `<button class="chip sr" data-act="again3">${esc(t.v3.again)}</button>`
    : `<button class="chip sr" data-act="dir" data-v="up">${esc(t.v3.up)}</button><button class="chip sr" data-act="dir" data-v="down">${esc(t.v3.down)}</button>`;
  lab.setReadout(`${n}/4`, t.v3.sub, '', '#f0b43a');
  if (n === 1) lab.setState({ emo: '🌅', title: t.v3.qTitle(t.v3.ev[1]), lead: `${t.v3.lead0} ${t.v3.qLead}`, body: '', extra: '' });
  else {
    const ok = S.res[S.res.length - 1], i = n - 1;
    if (end) lab.setState({ emo: '🌙', title: t.v3.endTitle, lead: `${t.v3.why[i]} ${t.v3.endLead}`, body: '', extra: '' });
    else lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.v3.right : t.v3.wrong, lead: `${t.v3.why[i]} ${t.v3.qTitle(t.v3.ev[n])}. ${t.v3.qLead}`, body: '', extra: '' });
  }
}
render();
</script>
