// --- actions -----------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function addLayer() {
  if (S.layers >= 4 || S.rainT !== null) return;
  S.lT[S.layers] = now(); S.layers++; sfx.snap();
  if (S.layers === 4) {
    sfx.good();
    S.timers.push(setTimeout(() => { S.rainT = now(); render(); }, 1500));
    S.timers.push(setTimeout(() => { S.rainDone = true; sfx.click(); render(); }, 1500 + 4300));
  }
}
function resetRoad() {
  S.timers.forEach(clearTimeout); S.timers = [];
  S.layers = 0; S.lT = [0, 0, 0, 0]; S.rainT = null; S.rainDone = false; S.drops = []; S.splash = []; S.run = []; sfx.click();
}
function startWalk(id) {
  if (S.active) return;
  S.active = { id, t0: now(), rep: S.drawn[id] }; S.cur = 0; S.last = id; S.atB = false; sfx.click();
}
function finishWalk() {
  const id = S.active.id;
  S.drawn[id] = true; S.done[id] = true; S.cur = TOTAL[id]; S.active = null; S.atB = true; sfx.good(); render();
}
function toggleLock() { S.locked = !S.locked; if (S.locked) S.seen = true; sfx.snap(); render(); }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'pred') { S.p[v] = +b.dataset.k; (+b.dataset.k === OK[v] ? sfx.good : sfx.click)(); showStage(); }
  else if (act === 'layer') addLayer();
  else if (act === 'again') resetRoad();
  else if (act === 'walkW') startWalk('w');
  else if (act === 'walkS') startWalk('s');
  else if (act === 'lock') { toggleLock(); return; }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  }
  render();
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, v = lab.view;
  if (S.sec === 'mile') {
    let best = -1, bd = 70; S.stones.forEach((s, i) => { const d = Math.hypot(x - s.x, y - s.y); if (d < bd) { bd = d; best = i; } });
    if (best >= 0) { S.mile = best; S.mileT = now(); sfx.tick(); render(); }
  } else if (S.sec === 'rome') {
    let best = -1, bd = 46; S.towns.forEach((s, i) => { const d = Math.hypot(x - s.x, y - s.y); if (d < bd) { bd = d; best = i; } });
    if (best >= 0) { S.rome = best; S.romeT = now(); sfx.click(); render(); }

// --- view 1: the road, in cross-section ------------------------------------------------------------------------------------
function drawRoad(ctx, w, h, dt, t) {

  const rwid = sp * 1.08, rs = easeIO(clamp((S.kV - 0.3) / 0.6, 0, 1)), rise = (1 - rs) * Hs * 0.35;
  for (let i = 0; i < 3; i++) roofShield(ctx, (xs[i] + xs[i + 1]) / 2, row2 + rise * 1.1, rwid * 0.96, rh, rs);
  for (let i = 0; i < 4; i++) roofShield(ctx, xs[i], row1 + rise, rwid, rh, rs);
  // side shields at the two ends
  const sideW = Sw * 0.4 * k;
  if (sideW > 2) for (const s of [-1, 1]) scutum(ctx, s < 0 ? xs[0] - sp * 0.56 : xs[3] + sp * 0.56, gy - Sh * 0.52, sideW, Sh * 1.02);
  // the shields in front
  for (let i = 0; i < 4; i++) {
    const off = -Sw * 0.64 * (1 - k);
    ctx.save(); ctx.translate(xs[i] + off, gy - 1); ctx.rotate(-0.1 * (1 - k)); scutum(ctx, 0, -Sh / 2, Sw, Sh); ctx.restore();
  }
  // arrows and sparks
  for (const a of S.arrows) {
    const ang = a.st === 1 ? a.ang : Math.atan2(a.vy, a.vx), L = Hs * 0.24, al = a.st === 1 ? 1 - a.age / 0.8 : a.st === 2 ? 1 - a.age / 0.25 : 1;
    ctx.save(); ctx.globalAlpha = Math.max(0, al); ctx.translate(a.x, a.y); ctx.rotate(ang); ctx.lineCap = 'round';
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-L, 0); ctx.lineTo(0, 0); ctx.stroke();
    ctx.fillStyle = '#d4d9e0'; ctx.strokeStyle = '#4c525c'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-1, -3.2); ctx.lineTo(-1, 3.2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f0e8d6'; ctx.beginPath(); ctx.moveTo(-L, 0); ctx.lineTo(-L - 5, -3.4); ctx.lineTo(-L + 3, -1.2); ctx.moveTo(-L, 0); ctx.lineTo(-L - 5, 3.4); ctx.lineTo(-L + 3, 1.2); ctx.fill();
    ctx.restore();
  }
  for (const f of S.fx) {
    const a = (t - f.t0) / 0.5;
    if (f.type === 's') { // a spark where the arrow bounced
      const r = 4 + 12 * ease(a * 1.4); ctx.save(); ctx.translate(f.x, f.y); ctx.fillStyle = `rgba(255,232,140,${1 - a})`; ctx.beginPath();
      for (let j = 0; j < 8; j++) { const rad = j % 2 ? r * 0.35 : r, an = (j * Math.PI) / 4; ctx.lineTo(Math.cos(an) * rad, Math.sin(an) * rad); } ctx.closePath(); ctx.fill(); ctx.restore();
    } else { // a startled "!" over the helmet
      const y = f.y - 12 - 8 * a; ctx.save(); ctx.globalAlpha = 1 - a * 0.6; ctx.fillStyle = '#d8402f'; ctx.beginPath(); ctx.arc(f.x, y, 9, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '900 14px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', f.x, y + 1); ctx.restore();
    }
  }
}

// --- secret: milestones ---------------------------------------------------------------------------------------------------------
function drawMile(ctx, w, h, dt, t) {
  const hy = h * 0.38, cx = w / 2, qh = h - hy;
  skyBg(ctx, w, h, hy, 0);
  // Rome, far away at the end of the road
  for (let i = 0; i < 9; i++) { const bw = 5 + rnd(i) * 7, bh = 7 + rnd(i + 20) * 15, bx = cx - 40 + i * 9; const g = ctx.createLinearGradient(bx, hy - bh, bx + bw, hy); g.addColorStop(0, '#e3cfa4'); g.addColorStop(1, '#b49a6c'); ctx.fillStyle = g; ctx.fillRect(bx, hy - bh, bw, bh); }
  const dg = ctx.createRadialGradient(cx - 2, hy - 28, 1, cx, hy - 24, 14); dg.addColorStop(0, '#f6e3b4'); dg.addColorStop(1, '#b8996a'); ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(cx, hy - 20, 13, Math.PI, 2 * Math.PI); ctx.fill(); ctx.fillRect(cx - 13, hy - 20, 26, 20);
  ctx.fillStyle = 'rgba(255,236,190,.3)'; ctx.fillRect(0, hy - 30, w, 31);
  // fields and the road in perspective
  const fg = ctx.createLinearGradient(0, hy, 0, h); fg.addColorStop(0, '#7fb05a'); fg.addColorStop(1, '#4b7f3b'); ctx.fillStyle = fg; ctx.fillRect(0, hy, w, qh);
  const half = (y) => w * 0.02 + w * 0.42 * ((y - hy) / qh);
  ctx.beginPath(); ctx.moveTo(cx - half(hy), hy); ctx.lineTo(cx + half(hy), hy); ctx.lineTo(cx + half(h), h); ctx.lineTo(cx - half(h), h); ctx.closePath();
  const rg = ctx.createLinearGradient(0, hy, 0, h); rg.addColorStop(0, '#b9bec6'); rg.addColorStop(1, '#7a818c'); ctx.fillStyle = rg; ctx.fill();
  ctx.strokeStyle = 'rgba(70,76,86,.55)'; ctx.lineWidth = 1.2;
  for (let k = 1; k <= 9; k++) { const y = hy + qh * Math.pow(k / 9, 1.8); ctx.beginPath(); ctx.moveTo(cx - half(y), y); ctx.lineTo(cx + half(y), y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(235,238,244,.8)'; ctx.lineWidth = 2; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(cx + s * half(hy), hy); ctx.lineTo(cx + s * half(h), h); ctx.stroke(); }
  // the milestones, nearest first: V, IV, III, II, I
  const Q = [0.72, 0.52, 0.37, 0.26, 0.17];
  for (let i = 4; i >= 0; i--) {
    const q = Q[i], y = hy + q * qh, sc = 0.12 + 0.88 * q, H = h * 0.34 * sc, Wd = H * 0.36, x = cx + half(y) + Wd * 0.9 + 6, sel = S.mile === i;
    S.stones[i] = { x, y: y - H * 0.5 };
    const lift = sel ? -3 * Math.abs(Math.sin(clamp((t - S.mileT) * 5, 0, Math.PI))) : 0;
    shadow(ctx, x, y + 1, Wd * 1.1);
    if (sel) { const g = ctx.createRadialGradient(x, y - H * 0.5, 2, x, y - H * 0.5, H * 0.9); g.addColorStop(0, 'rgba(255,224,130,.55)'); g.addColorStop(1, 'rgba(255,224,130,0)'); ctx.fillStyle = g; ctx.fillRect(x - H, y - H * 1.5, H * 2, H * 2); }
    ctx.save(); ctx.translate(x, y + lift);
    const bg = ctx.createLinearGradient(-Wd * 1.2, 0, Wd * 1.2, 0); bg.addColorStop(0, '#d8d0bb'); bg.addColorStop(1, '#8c846f'); ctx.fillStyle = bg; rr(ctx, -Wd * 0.75, -H * 0.1, Wd * 1.5, H * 0.1, 2); ctx.fill();
    const cg = ctx.createLinearGradient(-Wd / 2, 0, Wd / 2, 0); cg.addColorStop(0, '#f1ebdb'); cg.addColorStop(0.45, '#d5cdb7'); cg.addColorStop(1, '#8f8772'); ctx.fillStyle = cg; ctx.strokeStyle = '#5f5844'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-Wd / 2, -H * 0.1); ctx.lineTo(-Wd / 2, -H * 0.85); ctx.quadraticCurveTo(0, -H * 1.02, Wd / 2, -H * 0.85); ctx.lineTo(Wd / 2, -H * 0.1); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(70,60,40,.6)'; ctx.lineWidth = Math.max(1, Wd * 0.07); for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.moveTo(-Wd * 0.28, -H * (0.62 - j * 0.12)); ctx.lineTo(Wd * 0.28, -H * (0.62 - j * 0.12)); ctx.stroke(); }
    ctx.restore();
    pill(ctx, NUMERALS[i], x, y + 17, w);
    if (sel) pill(ctx, `≈ ${fmt((5 - i) * 1.5)} km`, x, y - H - 16, w);
  }
  pill(ctx, 'ROMA', cx, hy - 40, w);
}

// --- secret: all roads lead to Rome ---------------------------------------------------------------------------------------------
function drawRome(ctx, w, h, dt, t) {
  const cx = w / 2, cy = h * 0.5, rx = w * 0.38, ry = h * 0.34, F = [0.9, 0.78, 0.95, 0.74, 0.92, 0.8, 0.96, 0.76];
  const towns = F.map((f, i) => {
    const a = (i * Math.PI) / 4 + 0.35, x = cx + Math.cos(a) * rx * f, y = cy + Math.sin(a) * ry * f, dx = cx - x, dy = cy - y, s = (i % 2 ? 1 : -1) * 0.16;
    return { x, y, qx: (x + cx) / 2 - dy * s, qy: (y + cy) / 2 + dx * s };
  });
  S.towns = towns;
  const bz = (T0, u) => { const v = 1 - u; return [v * v * T0.x + 2 * v * u * T0.qx + u * u * cx, v * v * T0.y + 2 * v * u * T0.qy + u * u * cy]; };
  const sea = ctx.createLinearGradient(0, 0, 0, h); sea.addColorStop(0, '#1c3860'); sea.addColorStop(1, '#2d6389'); ctx.fillStyle = sea; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(160,210,240,.12)'; ctx.lineWidth = 1.2; for (let i = 0; i < 14; i++) { const x = rnd(i) * w, y = rnd(i + 30) * h; ctx.beginPath(); ctx.arc(x, y, 8, Math.PI * 1.1, Math.PI * 1.9); ctx.arc(x + 14, y, 8, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  const land = () => { ctx.beginPath(); for (let i = 0; i <= 60; i++) { const a = (i / 60) * 2 * Math.PI, r = 1 + 0.06 * Math.sin(3 * a + 1) + 0.05 * Math.sin(5 * a + 2); ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * w * 0.47 * r, cy + Math.sin(a) * h * 0.45 * r); } ctx.closePath(); };
  land(); ctx.strokeStyle = 'rgba(150,205,235,.3)'; ctx.lineWidth = 12; ctx.stroke();
  land(); const lg = ctx.createRadialGradient(cx, cy, 10, cx, cy, w * 0.5); lg.addColorStop(0, '#efdfb2'); lg.addColorStop(1, '#c5a96f'); ctx.fillStyle = lg; ctx.fill(); ctx.strokeStyle = '#8c7549'; ctx.lineWidth = 2; ctx.stroke();
  for (let i = 0; i < 90; i++) { ctx.fillStyle = 'rgba(120,96,50,.18)'; ctx.fillRect(cx + (rnd(i) - 0.5) * w * 0.8, cy + (rnd(i + 70) - 0.5) * h * 0.76, 1.6, 1.6); }
  towns.forEach((T0, i) => { // roads
    ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(T0.x, T0.y); ctx.quadraticCurveTo(T0.qx, T0.qy, cx, cy); ctx.strokeStyle = '#7c5a35'; ctx.lineWidth = 6; ctx.stroke();
    ctx.strokeStyle = '#dcb982'; ctx.lineWidth = 3.4; ctx.stroke();
    const age = t - S.romeT;
    if (S.rome === i && age < 3) { ctx.strokeStyle = `rgba(255,222,120,${0.6 * (1 - age / 3)})`; ctx.lineWidth = 9; ctx.stroke(); }
  });
  towns.forEach((T0, i) => { // pulses of light running to Rome
    const u = easeIO(((t * 0.28 + i * 0.125) % 1));
    for (let j = 0; j < 6; j++) { const [px, py] = bz(T0, Math.max(0, u - j * 0.024)), r = Math.max(0, 4.2 - j * 0.5), g = ctx.createRadialGradient(px, py, 0, px, py, r * 2.2); g.addColorStop(0, `rgba(255,236,150,${0.9 - j * 0.14})`); g.addColorStop(1, 'rgba(255,220,120,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, r * 2.2, 0, 7); ctx.fill(); }
  });
  const age = t - S.romeT;
  if (S.rome !== null && age < 2.4) { // the tapped town sends a big light
    const T0 = towns[S.rome], u = ease(age / 1.6), [px, py] = bz(T0, u), g = ctx.createRadialGradient(px, py, 0, px, py, 16); g.addColorStop(0, 'rgba(255,248,200,1)'); g.addColorStop(1, 'rgba(255,210,100,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, 16, 0, 7); ctx.fill();
    if (age > 1.5) { const a = (age - 1.5) / 0.9; ctx.strokeStyle = `rgba(255,230,140,${1 - a})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, 14 + 40 * a, 0, 7); ctx.stroke(); }
  }
  towns.forEach((T0, i) => { const sel = S.rome === i && age < 0.5 ? 1 + 0.3 * Math.sin((age / 0.5) * Math.PI) : 1; town(ctx, T0.x, T0.y, 0.55 * sel); });
  const gr = Math.min(w, h) * 0.2 * (1 + 0.05 * Math.sin(t * 2)), rg = ctx.createRadialGradient(cx, cy, 2, cx, cy, gr); rg.addColorStop(0, 'rgba(255,226,140,.85)'); rg.addColorStop(1, 'rgba(255,214,120,0)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(cx, cy, gr, 0, 7); ctx.fill();
  const u = Math.min(w, h) * 0.07; ctx.save(); ctx.translate(cx, cy + u * 0.7); // a little temple
  const tg = ctx.createLinearGradient(-u, 0, u, 0); tg.addColorStop(0, '#fff2c4'); tg.addColorStop(1, '#d1a64e'); ctx.fillStyle = tg; ctx.strokeStyle = '#7b5a1c'; ctx.lineWidth = 1;
  ctx.fillRect(-u * 1.15, -u * 0.12, u * 2.3, u * 0.24); ctx.strokeRect(-u * 1.15, -u * 0.12, u * 2.3, u * 0.24);
  for (let i = 0; i < 4; i++) { ctx.fillRect(-u * 0.9 + i * u * 0.6, -u * 1.05, u * 0.24, u * 0.93); ctx.strokeRect(-u * 0.9 + i * u * 0.6, -u * 1.05, u * 0.24, u * 0.93); }
  ctx.beginPath(); ctx.moveTo(-u * 1.1, -u * 1.05); ctx.lineTo(0, -u * 1.7); ctx.lineTo(u * 1.1, -u * 1.05); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  pill(ctx, 'ROMA', cx, cy + u * 1.7 + 8, w);
}

canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  if (S.sec === 'mile') return drawMile(ctx, w, h, dt, t);
  if (S.sec === 'rome') return drawRome(ctx, w, h, dt, t);
  const v = lab.view; (v === 'road' ? drawRoad : v === 'straight' ? drawStraight : drawTort)(ctx, w, h, dt, t);
});
render();
</script>
