  R.forEach((rr, i) => pts.push([hx - i * 9, hy + Math.sin(S.lzPh * 0.7 + i * 0.55) * (2 + i * 0.35) * (0.3 + rel)]));
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(hx - 56, hy + 16, 70, 6, 0, 0, TAU); c.fill();
  c.strokeStyle = '#3d6b2e'; c.lineWidth = 4; c.lineCap = 'round';
  for (const [li, side] of [[3, 0], [3, 1], [8, 0], [8, 1]]) {
    const [bx, by] = pts[li], ph = S.lzPh + (side ? Math.PI : 0) + li, sw = Math.sin(ph) * 7;
    c.beginPath(); c.moveTo(bx, by + 4); c.quadraticCurveTo(bx + sw, by + 14, bx + sw * 1.3, by + 16 + (side ? 0 : -2)); c.stroke();
  }
  for (let i = R.length - 1; i >= 0; i--) { c.fillStyle = '#2f5a24'; c.beginPath(); c.arc(pts[i][0], pts[i][1], R[i] + 1.6, 0, TAU); c.fill(); }
  for (let i = R.length - 1; i >= 0; i--) { c.fillStyle = i % 2 ? '#6fae4c' : '#7dbd58'; c.beginPath(); c.arc(pts[i][0], pts[i][1], R[i], 0, TAU); c.fill(); }
  for (let i = 1; i < 11; i++) { c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.arc(pts[i][0] + 1, pts[i][1] - R[i] * 0.35, R[i] * 0.45, 0, TAU); c.fill(); }
  c.fillStyle = '#fff'; c.beginPath(); c.arc(hx + 2, hy - 3, 3.4, 0, TAU); c.fill(); c.fillStyle = '#102010'; c.beginPath(); c.arc(hx + 3, hy - 3, 1.6, 0, TAU); c.fill();
  // graph: how fast the reactions run at each body temperature
  const L = 46, gx0 = L, gx1 = w - 14, gy0 = h * 0.66, gy1 = h - 34, YM = 140, X = (v) => gx0 + (gx1 - gx0) * (v - 5) / 35, Y = (v) => gy1 - (gy1 - gy0) * v / YM;
  c.fillStyle = 'rgba(14,17,28,.6)'; c.strokeStyle = 'rgba(130,145,190,.2)'; c.lineWidth = 1; c.beginPath(); c.roundRect(4, gy0 - 22, w - 8, gy1 - gy0 + 22 + 32, 14); c.fill(); c.stroke();
  c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.textBaseline = 'middle'; c.textAlign = 'right';
  for (const v of [0, 50, 100]) { c.strokeStyle = v ? 'rgba(130,145,190,.14)' : 'rgba(190,205,255,.45)'; c.beginPath(); c.moveTo(gx0, Y(v)); c.lineTo(gx1, Y(v)); c.stroke(); c.fillText(String(v), gx0 - 6, Y(v)); }
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (const v of [10, 20, 30, 40]) c.fillText(String(v), X(v), gy1 + 4);
  c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(t.lzG.y, 14, gy0 - 11);
  c.textAlign = 'right'; c.fillText(t.lzG.x, gx1, h - 9);
  c.strokeStyle = '#ffb04a'; c.lineWidth = 3; c.lineJoin = 'round'; c.beginPath();
  for (let i = 0; i <= 70; i++) { const v = 5 + 35 * i / 70, px = X(v), py = Y(100 * rel35(v)); if (i) c.lineTo(px, py); else c.moveTo(px, py); }
  c.stroke();
  const mxp = X(T_), myp = Y(100 * rel);
  c.strokeStyle = 'rgba(255,255,255,.4)'; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(mxp, gy1); c.lineTo(mxp, myp); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#fff'; c.beginPath(); c.arc(mxp, myp, 6, 0, TAU); c.fill();
  CW = w; pill(c, `${Math.round(rel * 100)} %`, mxp, myp - 18);
}
function drawRule(c, w, h) {
  const t = T[lang].sec, ea = EAS[S.ea], temps = [20, 30, 40, 50, 60], rates = temps.map((T_) => fT(T_, ea)), mx = Math.max(...rates);
  const x0 = 16, x1 = w - 16, y0 = h * 0.17, y1 = h * 0.82, bw = (x1 - x0) / 5, H = (v) => (y1 - y0) * 0.9 * v / mx;
  c.font = '800 13px Nunito, sans-serif'; c.fillStyle = '#C6CDE0'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t.ruTitle, w / 2, 16);
  c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.fillText(t.ruSub, w / 2, 34);
  c.strokeStyle = 'rgba(190,205,255,.45)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x0, y1); c.lineTo(x1, y1); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.5)'; c.setLineDash([6, 5]); c.beginPath(); c.moveTo(x0, y1 - H(2)); c.lineTo(x1, y1 - H(2)); c.stroke(); c.setLineDash([]);
  CW = w; pill(c, `×2 · ${t.dbl}`, x1, y1 - H(2) - 14, { align: 'right' });
  temps.forEach((T_, i) => {
    const bx = x0 + i * bw + bw * 0.17, bwid = bw * 0.66, bh = Math.max(3, H(rates[i])), g = c.createLinearGradient(0, y1 - bh, 0, y1);
    g.addColorStop(0, mixc([255, 150, 70], [255, 190, 110], 0)); g.addColorStop(1, mixc([80, 160, 255], [255, 150, 70], i / 4));
    c.fillStyle = g; c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(bx, y1 - bh, bwid, bh, 6); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.roundRect(bx + 3, y1 - bh + 3, 5, Math.max(0, bh - 6), 3); c.fill();
    c.font = '900 15px Nunito, sans-serif'; c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(`×${fmtX(rates[i])}`, bx + bwid / 2, y1 - bh - 12);
    c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.fillText(`${T_} °C`, bx + bwid / 2, y1 + 16);
  });
  pill(c, t.ruBar[S.ea], w / 2, y1 + 44, { color: '#ffb04a' });
}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
};
const unset = () => { if (S.phase === 'done') S.phase = 'set'; };
function resetRx(k) { Object.assign(S, { rx: k, T: 20, ci: 1, pi: 1, cat: k === 'p' ? 1 : 0, runs: [], cur: null, phase: 'set', t: 0, fb: [], fizz: 0 }); }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = b.dataset.k, i = +b.dataset.i;
  if (act === 'rx') { if (k !== S.rx) { resetRx(k); sfx.click(); } }
  else if (act === 'acid') { S.ci = i; unset(); sfx.tick(); }
  else if (act === 'pcs') { S.pi = i; unset(); sfx.tick(); }
  else if (act === 'cat') { S.cat = i; unset(); sfx.tick(); }
  else if (act === 'pick') { if (S.phase === 'set') startRun(k); return; }
  else if (act === 'clear') { S.runs = []; S.cur = null; S.phase = 'set'; sfx.click(); }
  else if (act === 'g2') { if (S.g2 === null) { S.g2 = k; S.T2 = 30; S.free2 = false; (k === 's' ? sfx.good : sfx.bad)(); showStage(); } }
  else if (act === 'cat2') { S.cat2 = !S.cat2; S.free2 = true; sfx.click(); }
  else if (act === 'again2') { S.g2 = null; S.T2 = 20; S.cat2 = false; S.free2 = false; sfx.click(); }
  else if (act === 'f3') {
    if (S.pick3 === null && S.i3 < 5) { S.pick3 = k; const ok = k === ITEMS[S.i3].ans; S.right3[S.i3] = ok; (ok ? sfx.good : sfx.bad)(); showStage(); }
  } else if (act === 'next3') { if (S.i3 >= 5) { S.i3 = 0; S.right3 = []; } else S.i3++; S.pick3 = null; simA.ps = []; simB.ps = []; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; if (S.sec === 'lz') { S.lz = 12; S.lzX = 40; } sfx.click();
  } else if (act === 'ea') { S.ea = i; sfx.tick(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'tSl') { S.T = +ev.target.value; unset(); }
  else if (id === 't2Sl') { S.T2 = +ev.target.value; S.free2 = true; }
  else if (id === 'lzSl') S.lz = +ev.target.value;
  else return;
  render();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
const chipH = (cls, attrs, label, dis) => `<button class="chip ${cls}" ${attrs}${dis ? ' disabled' : ''}>${esc(label)}</button>`;
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  $('sec1').hidden = !!sec || v !== 'knobs'; $('sec2').hidden = !!sec || v !== 'hits'; $('sec3').hidden = !!sec || v !== 'life';
  $('secLz').hidden = sec !== 'lz'; $('secRule').hidden = sec !== 'rule';
  const open = secret.unlocked();
  $('secRow').innerHTML = [['lz', '🦎'], ['rule', '📏']].map(([k, e]) => chipH(`secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}`, `data-act="sec" data-k="${k}"`, open ? `${e} ${t.sec[k][0]}` : '🔒 ???')).join('');
  if (sec === 'lz') renderLz(t); else if (sec === 'rule') renderRule(t);
  else if (v === 'knobs') render1(t); else if (v === 'hits') render2(t); else render3(t);
}
function render1(t) {
  const run = S.phase === 'run', m = S.rx === 'm', ph = S.phase;
  lab.setGlow('rgba(255, 176, 74, .22)');
  $('rxChips').innerHTML = ['m', 'p'].map((k) => chipH(S.rx === k ? 'on' : '', `data-act="rx" data-k="${k}"`, t.rx[k], run)).join('');
  $('rxNote').textContent = t.note[S.rx];
  $('tLab').textContent = t.kn.temp; $('tVal').textContent = `${S.T} °C`; $('tSl').value = S.T; $('tSl').disabled = run;
  $('m1').hidden = !m; $('p1').hidden = m;
  $('acidLab').textContent = t.kn.acid; $('pcsLab').textContent = t.kn.pcs; $('catLab').textContent = t.kn.cat;
  $('acidChips').innerHTML = t.acid.map((s, i) => chipH(S.ci === i ? 'on' : '', `data-act="acid" data-i="${i}"`, s, run)).join('');
  $('pcsChips').innerHTML = t.pcs.map((s, i) => chipH(S.pi === i ? 'on' : '', `data-act="pcs" data-i="${i}"`, s, run)).join('');
  $('catChips').innerHTML = t.catO.map((s, i) => chipH(S.cat === i ? 'on' : '', `data-act="cat" data-i="${i}"`, s, run)).join('');
  $('predBox').hidden = ph !== 'set'; $('doneBox').hidden = ph !== 'done';
  $('hint1').textContent = t.hint1; $('clearB').textContent = t.clear;
  lab.setFacts(t.facts.k);
  if (ph === 'set') {
    S.tiles = tilesFor();
    $('q1').textContent = t.q1; $('q1s').textContent = t.q1s;
    $('tiles').innerHTML = S.tiles.map((k) => `<button class="rr-tile" data-act="pick" data-k="${k}">${tileSvg(k)}<span>${esc(t.tile[k])}</span></button>`).join('');
    lab.setState({ emo: '🤔', title: t.s1[0], lead: t.s1[1], body: t.s1b[S.rx], extra: '' });
    lab.setReadout('?', t.rdSet, '', '#ffd166');
  } else if (ph === 'run') {
    lab.setState({ emo: '⏱️', title: t.run[0], lead: t.run[1], body: t.run[2], extra: '' });
    lastRd = ''; updRun();
  } else {
    const cu = S.cur, r = cu.ratio, lead = cu.correct === 'same' ? t.dSame : cu.correct === 'fastSame' ? t.dFast(fmtX(r)) : t.dSlow(fmtX(r));
    const half = Math.LN2 / cu.k;
    let body = (cu.rx === 'm' ? t.dbM : t.dbP)(cu.vmax);
    if (half > 3600) body += ` ${t.slowNote(fmtTime(half, t.u))}`;
    const extra = cu.rx === 'p' && cu.cat ? `<div>${esc(t.catAfter(num(MNO2)))}</div>` : '';
    lab.setState({ emo: cu.ok ? '✅' : '🤔', title: cu.ok ? t.ok : t.no, lead, body, extra });
    lab.setReadout(fmtTime(half, t.u), t.rdDone, t.pillVs(fmtX(r)), '#ffd166');
  }
}
function render2(t0) {
  const t = t0.v2, g = S.g2, T2 = S.T2, cat = S.cat2;
  lab.setGlow('rgba(255, 140, 40, .2)');
  $('g2Box').hidden = g !== null; $('free2').hidden = g === null;
  $('q2').textContent = t.ask;
  $('g2Opts').innerHTML = ORDER2.map((k) => chipH('', `data-act="g2" data-k="${k}"`, t[k])).join('');
  $('t2Lab').textContent = t.temp; $('t2Val').textContent = `${T2} °C`; $('t2Sl').value = T2;
  $('cat2B').textContent = t.cat; $('cat2B').classList.toggle('on', cat); $('again2B').textContent = t.again;
  const { hits, succ } = counts(T2, cat);
  lab.setFacts(t0.facts.h);
  if (g === null) {
    lab.setState({ emo: '🤔', title: t.s0[0], lead: t.s0[1], body: `${t.s0[2]} ${t.cv.schem}`, extra: '' });
    lab.setReadout('100', t.rdSet, '', '#ffb04a');
  } else {
    const pc = num(+((Math.sqrt(303.15 / T0) - 1) * 100).toFixed(1)), x = num(+fT(30).toFixed(1)), ok = g === 's';
    if (!S.free2) lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t0.ok : t0.no, lead: t.res(pc, x), body: `${t.resB} ${t.cv.schem}`, extra: '' });
    else lab.setState({ emo: '💥', title: t.play, lead: t.playL(T2, Math.round(hits), Math.round(succ)), body: `${cat ? t.bar1 : t.bar0} ${t.cv.schem}`, extra: '' });
    lab.setReadout(String(Math.round(succ)), t.rd, t.pillH(Math.round(hits)), '#ffb04a');
  }
}
function render3(t0) {
  const t = t0.v3, i = S.i3, end = i >= 5, ans = S.pick3 !== null, it = ITEMS[Math.min(i, 4)], tx = t.items[Math.min(i, 4)], k = S.right3.filter(Boolean).length;
  lab.setGlow('rgba(61, 220, 151, .16)');
  $('q3').textContent = end ? '' : t.q;
  $('f3Opts').hidden = end;
  $('f3Opts').innerHTML = end ? '' : ['temp', 'conc', 'surf', 'cat'].map((f) => {
    const cls = ans ? (f === it.ans ? 'good' : f === S.pick3 ? 'bad' : '') : '';
    return chipH(cls, `data-act="f3" data-k="${f}"`, t.f[f], ans);
  }).join('');
  $('go3').hidden = !(ans || end); $('next3B').textContent = end ? t.again : t.next;
  if (end) {
    lab.setReadout(`${k}/5`, t.rd, '', '#3ddc97');
    lab.setState({ emo: '🏆', title: t.endT(k), lead: t.endL, body: '', extra: '' }); lab.setFacts([]);
  } else if (!ans) {
    lab.setReadout(`${k}/5`, t.item(i + 1), '', '#3ddc97');
    lab.setState({ emo: '🤔', title: t.q, lead: tx.desc, body: '', extra: '' }); lab.setFacts([]);
  } else {
    const ok = S.pick3 === it.ans;
    lab.setReadout(`${k}/5`, t.item(i + 1), ok ? t0.ok : t0.no, '#3ddc97');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t0.ok : t0.no, lead: ok ? tx.why : `${t.wrong(t.f[it.ans])} ${tx.why}`, body: t.look, extra: '' });
    lab.setFacts(t0.facts.i[i]);
  }
}
function renderLz(t0) {
  const t = t0.sec, T_ = S.lz, pc = Math.round(100 * rel35(T_)), st = T_ < 18 ? 0 : T_ < 30 ? 1 : 2;
  lab.setGlow('rgba(255, 190, 90, .2)');
  $('lzLab').textContent = t.lzT; $('lzVal').textContent = `${T_} °C`; $('lzSl').value = T_;
  lab.setReadout(`${pc} %`, t.lzG.y, `${T_} °C`, '#ffb04a');
  lab.setState({ emo: '🦎', title: t.lzS[st], lead: t.lzLead(T_, pc), body: t.lzBody, extra: '' });
  lab.setFacts(t0.facts.lz);
}
function renderRule(t0) {
  const t = t0.sec, x = fT(30, EAS[S.ea]) / fT(20, EAS[S.ea]), xs = fmtX(x);
  lab.setGlow('rgba(255, 140, 40, .2)');
  $('eaChips').innerHTML = t.ruBar.map((s, i) => chipH(S.ea === i ? 'on' : '', `data-act="ea" data-i="${i}"`, s)).join('');
  lab.setReadout(`×${xs}`, t.ruS(xs), '', '#ffb04a');
  lab.setState({ emo: '📏', title: t.ruS(xs), lead: t.ruL[x < 1.8 ? 0 : x > 2.4 ? 2 : 1], body: '', extra: '' });
  lab.setFacts([]);
}

// --- the loop ----------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w;
  if (S.sec === 'lz') drawLizard(c, w, h, dt, time);
  else if (S.sec === 'rule') drawRule(c, w, h);
  else if (lab.view === 'knobs') drawKnobs(c, w, h, dt, time);
  else if (lab.view === 'hits') drawHits(c, w, h, dt, time);
  else drawLife(c, w, h, dt, time);
});
render();
</script>
