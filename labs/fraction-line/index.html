const TOPICS = [
  { id: 'mt_Kr3IyA6m-O', en: 'Fractions on a number line', ru: 'Дроби на числовой прямой', hu: 'Törtek a számegyenesen' },

// --- data ----------------------------------------------------------------------------------------------------
// ribbon questions: the fraction n/d, how many ribbons it needs, and the right answer
const RQ = [{ n: 3, d: 4, units: 1, ok: 1 }, { n: 5, d: 4, units: 2, ok: 1 }, { n: 4, d: 4, units: 1, ok: 0 }];
// place it: [top, bottom, ruler length]
const PL = [[1, 2, 1], [1, 3, 1], [2, 3, 1], [3, 4, 1], [3, 2, 2], [5, 4, 2]];
// snail race: fraction of snail A, of snail B, index of the right answer (0 = A, 1 = B, 2 = the same)
const RC = [{ a: [1, 3], b: [1, 4], ok: 0 }, { a: [2, 3], b: [3, 4], ok: 1 }, { a: [2, 4], b: [1, 2], ok: 2 }, { a: [5, 4], b: [1, 1], ok: 0 }];

const GOLD = '#FFC94A', GOOD = '#5BD38A', BAD = '#FF6B6B', PINK = '#E8578C';
const FONT = 'Nunito, sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const TH = 22, FLOAT = 84, LANE_GAP = 62; // ribbon thickness, height of the floating ribbon, distance between two lanes
const SC_ROT = Math.PI; // the scissors emoji is turned so that its blades point down at the ribbon
const DPR = () => Math.min(window.devicePixelRatio || 1, 2);

// --- small helpers ---------------------------------------------------------------------------------------------
const ease = (p) => (p < .5 ? 2 * p * p : 1 - ((-2 * p + 2) ** 2) / 2);
const easeOut = (p) => 1 - (1 - p) ** 3;
const rgb = (c) => (c[0] === '#' ? [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)] : c.match(/\d+/g).map(Number));
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
const gcd = (a, b) => (b ? gcd(b, a % b) : a);
// HTML stacked fraction (a whole number when the bottom is 1); fx() turns every "3/4" of a plain string into one
const fr = (n, d) => (d === 1 ? `${n}` : `<span class="fr"><i>${n}</i><i>${d}</i></span>`);
const fx = (s) => esc(s).replace(/(\d+)\/(\d+)/g, (_, n, d) => fr(n, d));
const where = (t, n, d) => { const a = Math.floor(n / d); return t.r.where(a, a + 1, n % d === 0 ? n / d : null); };

// --- state ---------------------------------------------------------------------------------------------------

  sec: null, // null | 'zoom' | 'clock' (secret experiments live in the ribbon view)

// --- the picture: scene, ribbons (lanes), snails ------------------------------------------------------------
// a lane is one ribbon cut into d parts per unit; every unit {a: opacity, h: height above the ruler, cut: finished cuts, sq: squash}
const newLane = (d, units, row = 0) => ({ d, row, U: Array.from({ length: units }, () => ({ a: 0, h: 0, cut: 0, sq: 0 })) });
const newScene = (Rt, R = Rt) => ({ R, Rt, lanes: [], sc: null, fx: 0, fa: 0, hop: 0, wob: 0, glow: 0, nh: 0, eq: 0, counted: 0, showCount: false, lbl: null,
  free: false, mode: '', snails: [], rf: 0, rl: 0, tg: 0, tgx: 0, br: 0, faces: 0 });
const laneBase = (G, lane) => G.rt - 3 - TH - lane.row * LANE_GAP; // top of a landed ribbon

// --- a tiny sequencer: steps run one after another, f(p) gets 0..1 -------------------------------------------
function play(steps) { seq = { steps, i: 0, t: 0, started: false }; }
function tickSeq(dt) {
  const s = seq; if (!s) return;
  const st = s.steps[s.i];
  if (!st) { seq = null; return; }
  if (!s.started) { s.started = true; st.init?.(); }
  s.t += dt;
  const p = st.d ? clamp(s.t / st.d, 0, 1) : 1;
  st.f?.(p);
  if (p >= 1) { s.i++; s.t = 0; s.started = false; st.done?.(); }
}
const units = (lanes) => lanes.flatMap((L) => L.U);
const enterStep = (lanes) => ({ d: .7, f(p) { const e = easeOut(p); for (const U of units(lanes)) { U.a = e; U.h = FLOAT + 50 * (1 - e); } } });
const landH = (p) => (p < .5 ? FLOAT * (1 - (p / .5) ** 2) : p < .75 ? 9 * Math.sin((p - .5) / .25 * Math.PI) : 3 * Math.sin((p - .75) / .25 * Math.PI));
const landStep = (lanes) => ({ d: .85,
  f(p) { const sq = Math.min(1, Math.max(0, 1 - Math.abs(p - .52) / .08) + .4 * Math.max(0, 1 - Math.abs(p - .77) / .06)); for (const U of units(lanes)) { U.h = landH(p); U.sq = sq; } },
  done() { for (const U of units(lanes)) { U.h = 0; U.sq = 0; } sfx.click(); } });
// scissors fly to every cut point of every unit of one lane and snip
function cutSteps(idx) {
  const L = Z.lanes[idx], st = [];
  if (L.d < 2) return st;
  L.U.forEach((U, u) => {
    for (let k = 1; k < L.d; k++) {
      const to = u + k / L.d; let from = to;
      st.push({ d: .2, init() { if (!Z.sc || Z.sc.lane !== idx || Z.sc.u !== u) Z.sc = { lane: idx, u, x: to - .3 / L.d, a: 0, open: 0 }; from = Z.sc.x; },
        f(p) { Z.sc.x = lerp(from, to, ease(p)); Z.sc.a = Math.max(Z.sc.a, easeOut(Math.min(1, p * 2.5))); Z.sc.open = 0; } });
      st.push({ d: .14, init() { sfx.snap(); }, f(p) { U.cut = (k - 1) + ease(p); Z.sc.open = Math.sin(p * Math.PI); } });
    }
  });
  st.push({ d: .25, f(p) { if (Z.sc) Z.sc.a = 1 - p; }, done() { Z.sc = null; } });
  return st;
}
const flagInStep = () => ({ d: .35, f(p) { Z.fa = easeOut(p); Z.fx = 0; Z.hop = 22 * (1 - easeOut(p)); } });
const walkSteps = (n, d) => Array.from({ length: n }, (_, k) => ({ d: .38, init() { sfx.tick(); },
  f(p) { Z.fx = (k + ease(p)) / d; Z.hop = Math.sin(p * Math.PI) * 14; }, done() { Z.counted = k + 1; Z.hop = 0; } }));
const plantStep = (n, d) => ({ d: .6, init() { sfx.snap(); Z.lbl = { n, d, k: n / d }; },
  f(p) { Z.wob = Math.sin(p * Math.PI * 3) * .2 * (1 - p); Z.glow = ease(clamp(p * 1.5, 0, 1)); } });

// --- scene starters --------------------------------------------------------------------------------------------
function startRibbon() {
  seq = null;
  const R = S.r;
  if (S.sec === 'zoom') {
    Z = newScene(1); Z.mode = 'zoom'; const L = newLane(1, 1); L.U[0].a = 1; Z.lanes = [L]; S.zm = { L: 0, t0: -9 };

  const Q = S.s, r = RC[Q.i], [an, ad] = r.a, [bn, bd] = r.b, ok = Q.pick === r.ok;
  lab.setGlow('rgba(127, 184, 255, .2)');
  lab.setState(card(t, t.cards.race[Q.asked ? 1 : 0]));
  const dot = (c) => `<i class="dot" style="background:${c}"></i>`;
  const labels = [`${dot('#FFB547')}${fr(an, ad)}`, `${dot('#7FB8FF')}${fr(bn, bd)}`, esc(t.s.same)];
  const opts = labels.map((l, i) => {
    let cls = '';
    if (Q.done) cls = i === r.ok ? 'good' : i === Q.pick ? 'bad' : '';
    else if (i === Q.pick) cls = 'pick';
    return `<button class="ob ${cls}" data-act="rpick" data-i="${i}"${Q.pick !== null ? ' disabled' : ''}>${l}</button>`;
  }).join('');
  const res = Q.done ? `<div class="verdict" style="color:${ok ? GOOD : BAD}">${esc(ok ? t.right : t.wrong)}</div><p class="ptxt">${fx(t.s.r[Q.i])}</p><button class="btn" data-act="rnext">${esc(t.next)}</button>` : '';
  $('ctrlBody').innerHTML = `<p class="q">${t.s.q(fr(an, ad), fr(bn, bd))}</p><div class="obs">${opts}</div>${res}`;
  const cmp = an * bd - bn * ad, sign = cmp > 0 ? '&gt;' : cmp < 0 ? '&lt;' : '=';
  lab.setReadout(`${fr(an, ad)}&nbsp;${Q.done ? sign : '?'}&nbsp;${fr(bn, bd)}`, RC.map((_, i) => (i === Q.i ? '●' : '○')).join(' '), '', '#7FB8FF');
}

startRibbon();
render();
</script>
</body>
</html>
