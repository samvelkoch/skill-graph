  const a = S.g1.t >= 0, g = S.c2.g, b = g.t >= 0;
  S.g1 = mkG1(); if (a) S.g1.t = 0;
  S.c2.g = mkG2(g.say, g.fast); if (b) S.c2.g.t = 0;
}
function startChain(needChange) { S.g1 = mkG1(needChange); S.g1.t = 0; S.endE = 0; sfx.click(); }
function startCheck() { S.c2.queue = []; S.c2.g = mkG2(S.c2.sw, false); S.c2.g.t = 0; sfx.click(); }
function playTen(sb) { S.c2.queue = Array.from({ length: 10 }, () => ({ sb })); nextQueued(); sfx.click(); }
function answer(key, i) {
  if (S.pred[key] !== null) return;
  S.pred[key] = i; (i === OK[key] ? sfx.good : sfx.bad)();
  if (key === 'chain') { S.noise = 1; startChain(true); } // the first game shows the idea: at least one word changes
  else if (key === 'check') {
    S.c2.tally = { no: [0, 0], yes: [0, 0] }; S.c2.disp = { no: 0, yes: 0 };
    S.c2.queue = [...Array.from({ length: 10 }, () => ({ sb: false })), ...Array.from({ length: 10 }, () => ({ sb: true }))]; nextQueued();
  } else { S.t3.reveal = 0; S.t3.can = false; rollMasks(); }
  showStage(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const o = ev.target.closest('[data-pk]');
  if (o) { answer(o.dataset.pk, +o.dataset.i); return; }
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, c2 = S.c2, t3 = S.t3;
  if (act === 'start1') startChain();
  else if (act === 'newp') { S.pi = (S.pi + 1) % 3; S.g1 = mkG1(); S.g1.t = 0; S.endE = 0; c2.g = mkG2(c2.sw, false); sfx.click(); }
  else if (act === 'start2') startCheck();
  else if (act === 'play10') playTen(c2.sw);
  else if (act === 'sw2') { c2.sw = !c2.sw; sfx.click(); }
  else if (act === 'sw3') {
    t3.stick = !t3.stick; t3.mode = t3.stick ? 'seq' : 'both'; t3.seqT = 0;
    if (!t3.stick) { rollMasks(); t3.reveal = 0; t3.can = false; } sfx.click();
  } else if (act === 'again3') { t3.seqT = 0; if (!t3.stick) { rollMasks(); t3.reveal = 0; t3.can = false; } sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    S.sec = S.sec === k ? null : k; S.sT = 0; S.stickAt = 0; S.stickT = 0; sfx.click(); if (S.sec) showStage();
  }
  render();
});
$('poNoise').addEventListener('input', (ev) => { S.noise = +ev.target.value; ticks(); });
$('poNoise').addEventListener('change', () => { if (S.pred.chain !== null) startChain(); render(); });
$('cv').addEventListener('pointerdown', () => {
  if (S.sec === 'a') S.sT = 0;
  else if (S.sec === 'b') { S.stickT = 0; S.stickAt = (S.stickAt + 1) % 6; sfx.tick(); }
});

// --- one render per change: controls, readout and the state card ----------------------------------------------------
const ticks = () => { const t = T[lang]; $('poTicks').innerHTML = t.noiseNames.map((n, i) => `<span class="${i === S.noise ? 'on' : ''}">${esc(n)}</span>`).join(''); };
function askHTML(key, q, opts, right, wrong) {
  const pick = S.pred[key], done = pick !== null;
  const btns = opts.map((o, i) => `<button type="button" class="po-o${done ? (i === OK[key] ? ' good' : i === pick ? ' bad' : '') : ''}" data-pk="${key}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = done ? `<div class="po-v ${pick === OK[key] ? 'ok' : 'no'}">${pick === OK[key] ? '✓ ' : ''}${esc(pick === OK[key] ? right : wrong)}</div>` : '';
  return `<div class="po-q">${esc(q)}</div><div class="po-opts">${btns}</div>${verdict}`;
}
function readout() {
  const t = T[lang], v = lab.view, col = COLORS[v];
  if (S.sec) { const k = S.sec; lab.setReadout(k === 'a' ? '✈️' : '🪶', t.secrets[k][0], '', col); return; }
  if (v === 'chain') {
    const g = S.g1, asked = S.pred.chain !== null, noiseName = t.noiseNames[S.noise];
    if (!asked || g.t < 0) return lab.setReadout('?', '', noiseName, col);
    const n = changedN(frameOf(g, g.t).text);
    lab.setReadout(g.done && n === 0 ? t.perfect : t.changed(n), '', noiseName, col);
  } else if (v === 'check') {
    const c2 = S.c2, asked = S.pred.check !== null, say = c2.g.say;
    if (!asked) return lab.setReadout('?', '', '', col);
    const [k, n] = c2.tally.yes;
    lab.setReadout(n ? t.score(k, n) : '—', '', t.perChild(say ? 2 : 1), col);
  } else {
    const t3 = S.t3, asked = S.pred.turns !== null;
    if (!asked) return lab.setReadout('?', '', '', col);
    lab.setReadout(t.understood(Math.round((t3.bars[0] + t3.bars[1]) * 50)), '', t3.stick ? t.oneAtATime : t.bothAtOnce, col);
  }
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  lab.setGlow(GLOW[v]);
  ['chain', 'check', 'turns'].forEach((k) => { $('po' + k[0].toUpperCase() + k.slice(1)).classList.toggle('on', !sec && v === k); });
  const sc = (k, emo) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('poSecRow').innerHTML = sc('a', '✈️') + sc('b', '🪶');
  readout();
  if (sec) {
    const k = sec;
    lab.setFacts([]);
    lab.setState({ emo: k === 'a' ? '✈️' : '🪶', title: t.secrets[k][0], lead: k === 'a' ? t.secrets.a[1] : t.stickText, body: '', extra: '' });
    return;
  }
  const answered = S.pred[v] !== null, st = t.st[v];
  const state = answered ? { emo: st[0], title: st[1], lead: st[2], body: st[3] } : { emo: '🤔', title: t[v + 'Ask'], lead: '', body: '' };
  if (v === 'chain') {
    $('poAskChain').innerHTML = askHTML('chain', t.chainAsk, t.chainOpts, t.chainRight, t.chainWrong); $('poAskChain').classList.toggle('done', answered);
    $('poCtlChain').classList.toggle('lock', !answered);
    $('poNoise').value = S.noise; $('poNoise').disabled = !answered; $('poNoiseL').textContent = t.noise; ticks();
    $('poStart1').textContent = S.g1.t < 0 ? t.start : t.again; $('poStart1').disabled = !answered;
    $('poNew').textContent = t.newPhrase; $('poNew').disabled = !answered;
    if (answered && S.g1.done && changedN(S.g1.states[5]) === 0) { state.emo = '🍀'; state.title = t.lucky; }
    lab.setFacts(t.facts.chain);
  } else if (v === 'check') {
    const c2 = S.c2, lock = !answered || busy2();
    $('poAskCheck').innerHTML = askHTML('check', t.checkAsk, t.checkOpts, t.checkRight, t.checkWrong); $('poAskCheck').classList.toggle('done', answered);
    $('poCtlCheck').classList.toggle('lock', !answered);
    $('poSw2').setAttribute('aria-checked', String(c2.sw)); $('poSw2').disabled = lock; $('poSw2L').textContent = t.sayBack;
    $('poStart2').textContent = t.start; $('poStart2').disabled = lock;
    $('poPlay10').textContent = t.play10; $('poPlay10').disabled = lock;
    lab.setFacts(answered ? t.facts.check : []);
  } else {
    const t3 = S.t3;
    $('poAskTurns').innerHTML = askHTML('turns', t.turnsAsk, t.turnsOpts, t.turnsRight, t.turnsWrong); $('poAskTurns').classList.toggle('done', answered);
    $('poCtlTurns').classList.toggle('lock', !answered);
    $('poSw3').setAttribute('aria-checked', String(t3.stick)); $('poSw3').disabled = !t3.can; $('poSw3L').textContent = t.stick;
    $('poAgain3').textContent = t.again; $('poAgain3').disabled = !t3.can;
    lab.setFacts(answered ? t.facts.turns : []);
  }
  lab.setState({ ...state, extra: '' });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  update(dt);
  if (S.sec === 'a') drawPilot(c, w, h, time);
  else if (S.sec === 'b') drawStick(c, w, h, time);
  else if (lab.view === 'turns') drawTurns(c, w, h, time);
  else drawChain(c, w, h, time, lab.view);
});
render();
</script>
</body>
</html>
