// ---- 2. Constants, helpers, state -------------------------------------------------------------------------
const LB = 0.45359237, OZ = 28.349523;                       // pound and ounce in kg / g
const TREE0 = 5 * LB, TREE1 = 169 * LB, SOIL0 = 200 * LB, LOSS_G = 2 * OZ;   // van Helmont, as reported

const hex = (x, i) => parseInt(x.slice(1 + i * 2, 3 + i * 2), 16);
const mixc = (a, b, t) => `rgb(${[0, 1, 2].map((i) => Math.round(lerp(hex(a, i), hex(b, i), t))).join(',')})`;

  if (!secret.unlocked()) return secret.open();

}

    if (S.playing && S.year >= 5 && v === 'pot') S.year = 0;
  } else if (k === 'y0') { S.year = 0; S.playing = false; }
  else if (k === 'y5') { S.year = 5; S.playing = false; }
  else if (k.startsWith('p:')) { Object.assign(S, PRESETS[k.slice(2)]); buildCtrl(); }
  else if (k.startsWith('j:')) { S.jar = k.slice(2); S.day = 0; S.playing = true; }

});

  } else if (S.secret === 's2') {

    ? `<div class="q">${esc(t.ask)}</div><div class="opts">${t.opts.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="q" style="color:${S.answer === 2 ? 'var(--ok)' : 'var(--wip)'}">${esc(S.answer === 2 ? t.right : S.answer === 0 ? t.wrongSoil : t.wrongWater)}</div><div class="opts"><button>${esc(t.go)} →</button></div>`;
  update(true);
}

// ---- 5. Models --------------------------------------------------------------------------------------------
// Leaf: the factory works only as fast as its scarcest ingredient (a simplified model).
function leafM() {
  const co2 = S.secret === 's1' && lab.view === 'leaf' ? 100 : S.co2, w = S.warm;
  const tf = w <= 10 ? 0 : w < 45 ? (w - 10) / 35 : w <= 75 ? 1 : 1 - (w - 75) / 25 * 0.8;
  const lv = { light: S.light, water: S.water, co2, warm: tf * 100 };
  let k = 'light', m = lv.light;
  for (const q of ['water', 'co2', 'warm']) if (lv[q] < m) { m = lv[q]; k = q; }
  if (k === 'warm') k = w < 50 ? 'cold' : 'hot';
  return { co2, m, k, rate: m / 100 };
}
// Jar: fresh-air level over time, a simplified picture.
function jarAir(mode, day) {
  return mode === 'alone' ? 1 - 0.9 * clamp(day / 9, 0, 1) : mode === 'light' ? 1 - 0.05 * clamp(day / 14, 0, 1) : 1 - 0.95 * clamp(day / 7, 0, 1);
}
const mood = (L) => (L > 0.55 ? 'ok' : L > 0.25 ? 'tired' : 'sleepy');

// ---- 6. Readout + state card (only touches the DOM when something changed) ---------------------------------
let lastSig = '';
function update(force) {
  const v = lab.view, t = T[lang];
  const sig = [lang, v, S.secret, Math.round(S.year * 20), Math.round(S.day * 10), S.light, S.water, S.co2, S.warm, S.preds.join(''), S.jar].join('|');
  if (!force && sig === lastSig) return;
  lastSig = sig;
  // keep the time slider in step with Play and the Start / Year 5 chips (but never fight a drag in progress)
  const yr = $('yr'), dy = $('dy');
  if (yr && document.activeElement !== yr) yr.value = String(Math.round(S.year * 100));
  if (dy && document.activeElement !== dy) dy.value = String(Math.round(S.day * 10));
  lab.setGlow('rgba(80,200,110,.2)');
  if (v === 'pot') {
    const p = t.pot, u = S.year / 5, wt = lerp(TREE0, TREE1, Math.pow(u, 1.4));
    const ph = S.year < 0.05 ? p.s0 : S.year >= 4.95 ? p.s2 : p.s1;
    lab.setReadout(`${kgs(wt)} ${esc(p.unit)}`, p.sub, p.year(nf(Math.round(S.year * 10) / 10, 1)), '#5dd16f');
    lab.setState({ emo: ph.emo, title: ph.title,
      lead: ph === p.s0 ? ph.lead(kgs(TREE0), kgs(SOIL0)) : ph === p.s2 ? ph.lead(kgs(GAIN), nf(LOSS_G)) : ph.lead,
      body: ph === p.s2 ? ph.body(nf(RATIO)) : ph.body, extra: `<div class="fine">${esc(p.fine)}</div>` });
  } else if (v === 'leaf') {
    const L = t.leaf, m = leafM(), st = m.m >= 70 ? 'run' : m.m >= 5 ? 'low' : 'stop';
    const on = (x) => (x ? '' : ' off');
    const eq = `<div class="eq"><span class="t c${on(m.co2 >= 5)}">${esc(L.eq.co2)}</span>+<span class="t w${on(S.water >= 5)}">${esc(L.eq.h2o)}</span>`
      + `<span class="arr">— ${esc(L.eq.light)} →</span><span class="t s${on(m.rate >= 0.05)}">${esc(L.eq.sug)}</span>+<span class="t o${on(m.rate >= 0.05)}">${esc(L.eq.o2)}</span></div>`;
    let s;
    if (S.secret === 's1') s = { emo: '💨', title: L.breath.title, lead: L.breath.lead, body: L.breath.body };
    else if (st === 'run') s = { emo: '🍃', title: L.ok.title, lead: L.ok.lead, body: L.ok.body };
    else { const [ti, le] = (st === 'stop' ? L.zero : L.low)[m.k]; s = { emo: st === 'stop' ? '⛔' : '🐢', title: ti, lead: le, body: L.bodyLow }; }
    lab.setReadout(`${Math.round(m.rate * 100)}%`, L.sub, L.pills[st], '#7bd96a');
    lab.setState({ ...s, extra: eq + `<div class="fine">${esc(L.fine)}</div>` });
  } else if (S.secret === 's2') {
    const J = t.test.jar, d = Math.round(S.day), a = J[S.jar], md = mood(jarAir(S.jar, S.day));
    lab.setReadout(esc(t.test.day(nf(d))), t.test.sub, J.moods[md], '#7bd96a');
    lab.setState({ emo: '🐭', title: a.title, lead: a.lead, body: a.body, extra: `<div class="fine">${esc(J.fine)}</div>` });
  } else {
    const X = t.test, d = Math.round(S.day), done = S.day >= 13.95;
    const score = POTS.reduce((n, _, i) => n + (S.preds[i] && (S.preds[i] === 1) === GROWS[i] ? 1 : 0), 0);

// A weeping-willow tree: recursive branches, grown smoothly by `dyn` (1 = trunk only … 6 = full tree).
function branch(c, x, y, a, len, wid, d, dyn, time) {

}

function drawPot(c, w, h, dt, time) {
  const p = T[lang].pot, u = S.year / 5, g = Math.pow(u, 1.4), wt = lerp(TREE0, TREE1, g);
  const fs = clamp(w / 34, 10, 15), sw = w * 0.56, cx = sw * 0.5, base = h * 0.88;
  const pw = Math.min(sw * 0.46, h * 0.34), ph = pw * 0.62, top = base - ph;
  // rain while the years run

    for (let i = 0; i < 16; i++) { const x = (i * 37.7) % sw, y = (time * 230 + i * 53) % (h * 0.85); c.moveTo(x, y); c.lineTo(x - 2, y + 9); } c.stroke(); }

  c.strokeStyle = 'rgba(150,160,190,.35)'; c.setLineDash([3, 4]); c.lineWidth = 1; c.beginPath(); c.moveTo(w * 0.58, bt); c.lineTo(w * 0.99, bt); c.stroke(); c.setLineDash([]);

}

// ---- leaf factory ----

function drawLeaf(c, w, h, dt, time) {

  const dx = Tp.x - Sp.x, dy = Tp.y - Sp.y, len = Math.hypot(dx, dy), lw = { x: dy / len, y: -dx / len }, W = Math.min(w * 0.2, h * 0.26);

  c.strokeStyle = '#3d8a45'; c.lineWidth = Math.max(6, w / 55); c.lineCap = 'round'; c.beginPath(); c.moveTo(Sp.x, Sp.y); c.quadraticCurveTo(w * 0.8, h * 0.88, w * 0.875, h * 0.945); c.stroke();

  const gr = c.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sr * 3); gr.addColorStop(0, `rgba(255,211,77,${0.5 * lf})`); gr.addColorStop(1, 'rgba(255,211,77,0)');

  c.fillStyle = mixc('#4a4f66', '#ffd34d', lf); c.beginPath(); c.arc(sun.x, sun.y, sr, 0, 6.3); c.fill();
  if (lf > 0.02) {

    else { c.fillStyle = '#7ee8d6'; c.beginPath(); c.arc(pos.x - rr * 0.7, pos.y, rr * 0.8, 0, 6.3); c.arc(pos.x + rr * 0.7, pos.y, rr * 0.8, 0, 6.3); c.fill(); }

  text(c, t.labels.o2, w * 0.03, h * 0.45, fs, '#7ee8d6', 'left');
  text(c, t.labels.h2o, w - 6, h * 0.915, fs * 0.95, '#6db6ff', 'right');

}

// ---- test pots ----
function plantAt(c, x, base, kind, day, H, cw, time) {
  let hh, wilt = 0, col, ls = 1;
  if (kind === 'all') { hh = 1 - Math.exp(-day / 5); col = '#3fbf5f'; }
  else if (kind === 'dark') { hh = 0.55 * (1 - Math.exp(-day / 3)); wilt = clamp((day - 6) / 8, 0, 1) * 0.6; col = '#e3dc9a'; ls = 0.45; }
  else if (kind === 'dry') { hh = 0.22 * (1 - Math.exp(-day / 2)); wilt = clamp((day - 3) / 6, 0, 1); col = mixc('#3fbf5f', '#9a7b4f', wilt); }
  else { hh = 0.05 * (1 - Math.exp(-day / 2)); col = '#7fc0b4'; ls = 0.7; }
  if (day < 0.05) return;
  const ph = H * 0.5 * hh + 3, dx = wilt * cw * 0.2 * (kind === 'dry' ? 1 : 0.7), ty = base - ph + wilt * ph * 0.35;
  const cxp = x, cyp = base - ph * 0.7, sway = Math.sin(time * 1.3) * (kind === 'all' ? 2 : 0.6);
  const pt = (q) => ({ x: (1 - q) * (1 - q) * x + 2 * (1 - q) * q * cxp + q * q * (x + dx + sway), y: (1 - q) * (1 - q) * base + 2 * (1 - q) * q * cyp + q * q * ty });

  c.beginPath(); c.moveTo(x, base); c.quadraticCurveTo(cxp, cyp, x + dx + sway, ty); c.stroke();
  const pairs = kind === 'cold' ? 1 : 1 + Math.floor(hh * 4);
  c.fillStyle = col;
  for (let i = 0; i < pairs; i++) {
    const q = pairs === 1 ? 1 : 0.35 + 0.65 * i / (pairs - 1), p = pt(q), ll = cw * 0.13 * (0.5 + hh) * ls;
    for (const s of [-1, 1]) { c.beginPath(); c.ellipse(p.x + s * ll * 0.75, p.y + wilt * ll * 0.5, ll, ll * 0.42, s * (-0.35 + wilt * 1.1), 0, 6.3); c.fill(); }
  }
}
function pot(c, x, base, cw) {
  const pw = cw * 0.5, ph = pw * 0.7;
  c.fillStyle = '#b5653a'; c.beginPath(); c.moveTo(x - pw / 2, base - ph); c.lineTo(x + pw / 2, base - ph); c.lineTo(x + pw * 0.36, base); c.lineTo(x - pw * 0.36, base); c.closePath(); c.fill();
  c.fillStyle = '#c97a4a'; rrect(c, x - pw * 0.55, base - ph * 1.1, pw * 1.1, ph * 0.22, 4); c.fill();
  c.fillStyle = '#4a3426'; c.beginPath(); c.ellipse(x, base - ph * 1.02, pw * 0.5, ph * 0.08, 0, 0, 6.3); c.fill();

}
function drawTest(c, w, h, dt, time) {
  const X = T[lang].test, cw = w / 4, fs = clamp(cw / 7.5, 9.5, 14), base = h * 0.84, done = S.day >= 13.95;
  POTS.forEach((kind, i) => {
    const x0 = cw * i, x = x0 + cw / 2;
    c.save(); c.beginPath(); rrect(c, x0 + 3, 6, cw - 6, h - 12, 14); c.clip();
    c.fillStyle = kind === 'dark' ? 'rgba(5,6,12,.75)' : kind === 'cold' ? 'rgba(80,140,200,.16)' : 'rgba(130,145,190,.07)'; c.fillRect(x0, 0, cw, h);
    c.textAlign = 'center'; c.font = `${cw * 0.2}px serif`; c.fillStyle = '#fff';
    const iy = h * 0.14 + cw * 0.1;
    if (kind === 'dark') c.fillText('🌙', x, iy);
    else if (kind === 'dry') { c.fillText('🏜️', x, iy); }
    else if (kind === 'cold') c.fillText('🥶', x, iy);
    else { c.fillText('☀️', x - cw * 0.16, iy); c.fillText('💧', x + cw * 0.16, iy); }
    if (kind === 'cold') { c.fillStyle = 'rgba(210,235,255,.8)'; for (let k = 0; k < 6; k++) text(c, '❄', x0 + ((k * 41 + 13) % (cw - 14)) + 7, ((time * 25 + k * 57) % (h * 0.7)) + h * 0.22, cw * 0.1, 'rgba(210,235,255,.75)', 'left', 500); }

    if (kind === 'dry') { c.strokeStyle = 'rgba(20,12,8,.7)'; c.lineWidth = 1.3; c.beginPath(); c.moveTo(x - cw * 0.1, top); c.lineTo(x - cw * 0.03, top + 4); c.moveTo(x + cw * 0.08, top); c.lineTo(x + cw * 0.14, top + 3); c.stroke(); }
    plantAt(c, x, top, kind, S.day, h * 0.72, cw, time);
    text(c, X.pots[kind], x, h * 0.95, fs, '#D3D9E8');
    c.restore();
    if (done && S.preds[i]) {
      const ok = (S.preds[i] === 1) === GROWS[i];
      c.fillStyle = ok ? '#3ddc97' : '#ff6b5e'; c.beginPath(); c.arc(x0 + cw - 16, 20, 11, 0, 6.3); c.fill();
      text(c, ok ? '✓' : '✗', x0 + cw - 16, 25, 14, '#0A0C14');
    }
  });
}

// ---- Priestley's jar ----
function drawJar(c, w, h, dt, time) {
  const J = T[lang].test.jar, fs = clamp(w / 36, 10, 14), L = jarAir(S.jar, S.day), md = mood(L);
  const jw = Math.min(w * 0.42, h * 0.62), jh = jw * 1.15, jx = w * 0.4, jt = h * 0.2, jb = jt + jh;
  if (S.jar === 'dark') { c.fillStyle = 'rgba(5,6,12,.45)'; c.fillRect(0, 0, w, h); }
  c.textAlign = 'center'; c.font = `${jw * 0.2}px serif`; c.fillStyle = '#fff'; c.fillText(S.jar === 'dark' ? '🌙' : '☀️', jx, jt - jw * 0.12);
  // air dots
  const nO = Math.round(L * 18);
  for (let i = 0; i < 18; i++) {
    const px = jx - jw * 0.4 + ((i * 0.618 + Math.sin(time * 0.6 + i) * 0.04) % 1) * jw * 0.8, py = jt + jh * 0.12 + ((i * 0.381 + Math.cos(time * 0.5 + i * 1.7) * 0.04) % 1) * jh * 0.62;
    c.fillStyle = i < nO ? 'rgba(126,232,214,.85)' : 'rgba(170,179,200,.85)'; c.beginPath(); c.arc(px, py, 2.6, 0, 6.3); c.fill();
  }
  // plant
  if (S.jar !== 'alone') plantAt(c, jx + jw * 0.22, jb - jh * 0.06, 'all', 10, jh * 1.1, jw * 0.9, time);
  // mouse
  const my = jb - jh * 0.1, ms = jw * 0.26;
  c.save(); c.translate(jx - jw * 0.15, my);
  if (md === 'ok') c.translate(0, -Math.abs(Math.sin(time * 5)) * ms * 0.25);
  if (md === 'sleepy') c.rotate(1.5);
  c.font = `${ms}px serif`; c.textAlign = 'center'; c.fillStyle = '#fff'; c.fillText('🐭', 0, 0); c.restore();
  if (md === 'sleepy') text(c, 'z z', jx - jw * 0.15 + ms * 0.4, my - ms * 0.8 - Math.sin(time * 2) * 3, fs * 1.2, '#98A0B8');
  // glass jar + lid
  c.strokeStyle = 'rgba(200,225,255,.65)'; c.lineWidth = 3; rrect(c, jx - jw / 2, jt, jw, jh, jw * 0.12); c.stroke();
  c.fillStyle = 'rgba(200,225,255,.06)'; rrect(c, jx - jw / 2, jt, jw, jh, jw * 0.12); c.fill();
  c.fillStyle = '#7a8296'; rrect(c, jx - jw * 0.5, jt - 8, jw, 11, 4); c.fill();
  // fresh-air bar
  const bx = w * 0.74, bw = Math.min(w * 0.09, 36);
  c.fillStyle = 'rgba(130,145,190,.12)'; rrect(c, bx - bw / 2, jt, bw, jh, 6); c.fill();
  c.fillStyle = mixc('#e0605a', '#7ee8d6', clamp(L * 1.2 - 0.1, 0, 1)); rrect(c, bx - bw / 2, jb - jh * L, bw, jh * L, 6); c.fill();
  c.strokeStyle = 'rgba(150,160,190,.4)'; c.lineWidth = 1.5; rrect(c, bx - bw / 2, jt, bw, jh, 6); c.stroke();
  text(c, J.air, bx, jb + fs * 1.6, fs * 0.9, '#98A0B8');
  // legend
  c.fillStyle = '#7ee8d6'; c.beginPath(); c.arc(w * 0.08, h * 0.95, 4, 0, 6.3); c.fill(); text(c, J.leg[0], w * 0.08 + 9, h * 0.95 + 4, fs * 0.85, '#98A0B8', 'left');
  c.fillStyle = '#aab3c8'; c.beginPath(); c.arc(w * 0.3 + 14, h * 0.95, 4, 0, 6.3); c.fill(); text(c, J.leg[1], w * 0.3 + 23, h * 0.95 + 4, fs * 0.85, '#98A0B8', 'left');
}

// ---- 8. The loop ------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (S.playing) {
    if (v === 'pot') { S.year = Math.min(5, S.year + dt * 5 / 9); const e = $('yr'); if (e) e.value = Math.round(S.year * 100); if (S.year >= 5) { S.playing = false; sfx.good(); render(); } }
    else if (v === 'test') { S.day = Math.min(14, S.day + dt * 14 / 9); const e = $('dy'); if (e) e.value = Math.round(S.day * 10); if (S.day >= 14) { S.playing = false; render(); } }
  }
  update();
  if (v === 'pot') drawPot(c, w, h, dt, time);
  else if (v === 'leaf') drawLeaf(c, w, h, dt, time);
  else if (S.secret === 's2') drawJar(c, w, h, dt, time);
  else drawTest(c, w, h, dt, time);
});

buildCtrl();
render();
</script>
