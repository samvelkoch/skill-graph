  const hand = (frac, len, wd, col, tail) => {
    const a = frac * TAU - Math.PI / 2; c.strokeStyle = col; c.lineWidth = wd;
    c.beginPath(); c.moveTo(cx - Math.cos(a) * tail, cy - Math.sin(a) * tail); c.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len); c.stroke();
  };
  hand((tt / 3600 % 12) / 12, Rc * .5, 7, '#2b2b3d', 6); hand((tt / 60 % 60) / 60, Rc * .74, 5, '#2b2b3d', 8); hand((tt % 60) / 60, Rc * .86, 2.2, '#e5484d', 14);
  c.fillStyle = '#e5484d'; c.beginPath(); c.arc(cx, cy, 5, 0, TAU); c.fill(); c.restore();
  pill(c, `${total} ${t.cl.s}`, cx, cy + Rc + 28, { size: 14 });
  const cellW = (w - 36) / 3, cellH = 96, y0 = cy + Rc + 48, vals = [hh, mm, ss], mult = ['× 3600', '× 60', '× 1'];
  vals.forEach((v, i) => {
    const x0 = 12 + i * (cellW + 6) - (i ? 0 : 0), ccx = x0 + cellW / 2;
    rr(c, x0, y0, cellW, cellH, 12); const gg = c.createLinearGradient(0, y0, 0, y0 + cellH); gg.addColorStop(0, '#f8edd4'); gg.addColorStop(1, '#e3cfa4');
    c.fillStyle = gg; c.fill(); c.lineWidth = 2; c.strokeStyle = '#8a5a2b'; c.stroke();
    pill(c, t.cl.units[i], ccx, y0 + 16, { size: 12, bg: 'rgba(60,38,14,.82)' });
    c.fillStyle = '#3b2a14'; c.font = '900 36px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(v), ccx, y0 + 52);
    pill(c, mult[i], ccx, y0 + cellH - 14, { size: 12, bg: 'rgba(60,38,14,.82)' });
  });
  if (u >= 1) {
    const hh2 = Math.floor(total / 3600), mm2 = Math.floor(total / 60) % 60, ss2 = total % 60, parts = [];
    if (hh2) parts.push(`${hh2} × 3600`); if (mm2) parts.push(`${mm2} × 60`); if (ss2) parts.push(String(ss2));
    pill(c, `${total} = ${parts.join(' + ')}`, w / 2, y0 + cellH + 28, { size: 14, bg: 'rgba(255,208,74,.95)', fg: '#3a2a00' });
  }
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w;
  if (S.sec === 'clock') return drawClock(c, w, h, dt);
  if (S.sec === 'letters') return drawLetters(c, w, h, dt);
  if (lab.view === 'lamps') return drawLamps(c, w, h, dt);
  drawPacks(c, w, h, dt, time);
});

// --- one render per change: controls, readout and the state card --------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, packs = !sec && v !== 'lamps';
  $('stepRow').style.display = packs ? '' : 'none';
  $('vPack').style.display = !sec && v === 'pack' ? '' : 'none';
  $('vSize').style.display = !sec && v === 'size' ? '' : 'none';
  $('vLamps').style.display = !sec && v === 'lamps' ? '' : 'none';
  $('vSec').style.display = sec ? '' : 'none';
  if (packs) {
    $('stepRow').innerHTML = `<span class="lbl">${esc(t.step)}</span>
      <button class="pk-sb sm" data-act="dec5" aria-label="−5"${S.n <= 1 ? ' disabled' : ''}>−5</button><button class="pk-sb" data-act="dec" aria-label="−"${S.n <= 1 ? ' disabled' : ''}>−</button>
      <b class="pk-n">${S.n}</b>
      <button class="pk-sb" data-act="inc" aria-label="+"${S.n >= 40 ? ' disabled' : ''}>+</button><button class="pk-sb sm" data-act="inc5" aria-label="+5"${S.n >= 40 ? ' disabled' : ''}>+5</button>`;
  }
  if (sec) renderSec(t); else if (v === 'pack') renderPack(t); else if (v === 'size') renderSize(t); else renderLamps(t);
  const un = secret.unlocked();
  $('secRow').innerHTML = [['clock', '⏰', t.secrets.a[0]], ['letters', '💡', t.secrets.b[0]]].map(([k, e, n]) =>
    `<button class="chip secret ${un ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${un ? `${e} ${esc(n)}` : '🔒 ???'}</button>`).join('');
}
const small = (html) => `<span style="font:800 19px/1.3 var(--sans);letter-spacing:0">${html}</span>`;

function renderPack(t) {
  const p = S.pk, n = S.n, loose = n % 3, d = toBase(n, 3);
  lab.setGlow('rgba(240, 170, 90, .28)'); lab.setFacts(t.facts.pack);
  const opt = (i) => {
    const cls = p.st === 'ask' ? (p.ans === i ? 'on' : '') : i === loose ? 'ok' : i === p.ans ? 'bad' : '';
    return `<button class="pk-opt ${cls}" data-act="guess" data-i="${i}"${p.st !== 'ask' ? ' disabled' : ''}>${i}</button>`;
  };
  $('vPack').innerHTML = `<div class="pk-q">${esc(t.pk.q)}</div><div class="pk-opts">${[0, 1, 2].map(opt).join('')}</div>
    <div class="row2">${p.st === 'done' ? `<button class="pk-b main" data-act="again">${esc(t.pk.again)}</button>`
      : `<button class="pk-b main" data-act="pack"${p.ans === null || p.st !== 'ask' ? ' disabled' : ''}>📦 ${esc(t.pk.go)}</button>`}</div>`;
  if (p.st === 'ask') {
    lab.setReadout('?', t.sw(n), '', '#f0aa5a');
    lab.setState(p.ans === null ? { emo: '🍬', title: `${t.pk.pile}: ${t.sw(n)}`, lead: t.pk.askL, body: '' } : { emo: '🍬', title: t.pk.readyT(p.ans), lead: t.pk.readyL, body: '' });
  } else if (p.st === 'run') {
    lab.setReadout('?', t.sw(n), '', '#f0aa5a'); lab.setState({ emo: '📦', title: t.pk.runT, lead: t.pk.runL, body: '' });
  } else {
    lab.setReadout(small(`${n} = ${esc(partsText(n, t))} = <b style="font-size:26px">${d}</b> ${esc(t.pk.inThrees)}`), '', t.pk.inTens(n), '#f0aa5a');
    lab.setState({ emo: p.ans === loose ? '✅' : '🤔', title: p.ans === loose ? t.right : t.notq, lead: t.pk.doneL(loose), body: t.pk.doneB(n, partsText(n, t), d),
      extra: esc(t.pk.tensX(tensText(n, t), n)) });
  }
}
function renderSize(t) {
  const z = S.sz, b = z.base, n = S.n, x = t.bn[b], right = toBase(n, b), tried = [2, 3, 4, 5, 10].filter((k) => z.tried[k]);
  lab.setGlow('rgba(95, 168, 160, .28)'); lab.setFacts(t.facts.size);
  const opt = (o, i) => {
    const cls = z.st === 'ask' ? '' : o.ok ? 'ok' : i === z.pick ? 'bad' : '';
    return `<button class="pk-opt ${cls}" data-act="szopt" data-i="${i}"${z.st !== 'ask' ? ' disabled' : ''}>${o.s}</button>`;
  };
  $('vSize').innerHTML = `<div class="row2"><span class="lbl">${esc(t.sz.lbl)}</span>${[2, 3, 4, 5, 10].map((k) =>
    `<button class="chip ${k === b ? 'on' : ''}" data-act="base" data-b="${k}"${z.st === 'run' ? ' disabled' : ''}>${k}${z.tried[k] ? ' ✓' : ''}</button>`).join('')}</div>
    <div class="pk-q">${esc(t.sz.qf(x))}</div><div class="pk-opts">${z.opts.map(opt).join('')}</div>`;
  if (tried.length) lab.setReadout(small(`${n} = ${tried.map((k) => `${toBase(n, k)} <span style="font-weight:600;color:var(--mut)">(${esc(t.bn[k])})</span>`).join(' = ')}`), '', '', '#5fa8a0');
  else lab.setReadout('?', t.sw(n), '', '#5fa8a0');
  if (z.st === 'ask') lab.setState({ emo: '🧺', title: t.sz.askT(b), lead: t.sz.askL, body: '' });
  else if (z.st === 'run') lab.setState({ emo: '📦', title: t.sz.runT, lead: t.sz.runL(b), body: '' });
  else {
    const ok = z.opts[z.pick].ok;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: t.sz.doneL(n, x, right), body: eqText(n, b, false), extra: tried.length === 5 ? esc(t.sz.all5) : '' });
  }
}
function renderLamps(t) {
  const L = S.lm, done = L.st === 'done', make = L.mode === 'make';
  lab.setGlow('rgba(255, 208, 74, .26)'); lab.setFacts(t.facts.lamps);
  const sumNow = valOf(L.bits), right = make ? sumNow === L.target : L.opts[L.pick]?.ok;
  const modes = `<div class="row2" style="margin-top:0">${[['make', t.lm.make], ['read', t.lm.read]].map(([m, n]) => `<button class="chip ${L.mode === m ? 'on' : ''}" data-act="mode" data-m="${m}">${esc(n)}</button>`).join('')}</div>`;
  let ctl;
  if (make) ctl = `<div class="row2">${done ? `<button class="pk-b main" data-act="newnum">${esc(t.lm.newNum)}</button>`
    : `<button class="pk-b main" data-act="check">${esc(t.lm.check)}</button><button class="pk-b" data-act="clear">${esc(t.lm.clear)}</button>`}</div>`;
  else ctl = `<div class="pk-q">${esc(t.lm.bRead)}</div><div class="pk-opts">${L.opts.map((o, i) => {
    const cls = !done ? '' : o.ok ? 'ok' : i === L.pick ? 'bad' : '';
    return `<button class="pk-opt ${cls}" data-act="lmopt" data-i="${i}"${done ? ' disabled' : ''}>${o.v}</button>`;
  }).join('')}</div>${done ? `<div class="row2"><button class="pk-b main" data-act="newnum">${esc(t.lm.newNum)}</button></div>` : ''}`;
  $('vLamps').innerHTML = modes + ctl;
  const bs = L.bits.join('').replace(/^0+(?=\d)/, '');
  lab.setReadout(bs, done ? `${t.lm.inTwos} = ${lampEq(L.bits)}` : t.lm.inTwos, make ? t.lm.askMakeT(L.target) : '', '#ffd04a');
  if (!done) lab.setState(make ? { emo: '💡', title: t.lm.askMakeT(L.target), lead: t.lm.askMakeL, body: t.lm.body } : { emo: '💡', title: t.lm.askReadT, lead: t.lm.askReadL, body: t.lm.body });
  else if (make) lab.setState({ emo: right ? '✅' : '🤔', title: right ? t.right : t.notq, lead: right ? lampEq(L.bits) : t.lm.wrongMake(sumNow, L.target), body: right ? t.lm.body : `${t.lm.needed} ${lampEq(bitsOf(L.target))}` });
  else lab.setState({ emo: right ? '✅' : '🤔', title: right ? t.right : t.notq, lead: right ? lampEq(L.bits) : t.lm.wrongRead(L.target), body: right ? t.lm.body : lampEq(L.bits) });
}
function renderSec(t) {
  lab.setFacts([]);
  if (S.sec === 'clock') {
    const tot = CLK[S.clk.i % CLK.length], h = Math.floor(tot / 3600), m = Math.floor(tot / 60) % 60, s = tot % 60;
    $('vSec').dataset.key = '';
    $('vSec').innerHTML = `<div class="row2" style="margin-top:0"><button class="pk-b main" data-act="clkrun">▶ ${esc(t.cl.run)}</button><button class="pk-b" data-act="clkother">🔀 ${esc(t.cl.other)}</button></div>`;
    lab.setGlow('rgba(243, 220, 154, .26)');
    lab.setReadout(`${h} | ${m} | ${s}`, t.cl.units.join(' | '), '', '#f3dc9a');
    lab.setState({ emo: '⏰', title: t.secrets.a[0], lead: t.cl.lead(tot, h, m, s), body: t.cl.body });
  } else {
    const key = 'letters' + lang;
    if ($('vSec').dataset.key !== key) {
      $('vSec').dataset.key = key;
      $('vSec').innerHTML = `<div class="row2" style="margin-top:0"><label class="lbl" for="wordIn">${esc(t.lt.lbl)}</label>
        <input id="wordIn" class="pk-in" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(S.ltr.word)}">
        <button class="pk-b main" data-act="ltshow">${esc(t.lt.show)}</button></div>`;
    }
    lab.setGlow('rgba(255, 208, 74, .26)');
    const w = S.ltr.word;
    lab.setReadout(w, [...w].map((ch) => ch.charCodeAt(0) - 64).join(' · '), '', '#ffd04a');
    lab.setState({ emo: '💡', title: t.secrets.b[0], lead: w, body: t.lt.body });
  }
}

enterView();
