const sil = document.createElement('canvas'), sctx = sil.getContext('2d');

      <button class="btn ghost" type="button" data-act="again" id="jAgain" hidden></button>
      <div class="chips" id="picChips" hidden></div>
    </div>
  </div>
  <div id="sTurn" hidden>
    <div class="cs-q" id="tQ"></div>
    <div class="cs-opts" id="tOpts"></div>
    <div class="row2"><span class="cs-lbl" id="hoursLbl"></span></div>
    <input type="range" class="big cs-hours" id="hours" min="0" max="8" step="0.05" value="0" style="--track:linear-gradient(90deg,#4d6bd6,#101c46)">
    <div class="ends"><span>20:00</span><span>04:00</span></div>
    <div class="cs-verdict" id="tVerdict" hidden></div>
    <button class="btn" type="button" data-act="play" id="playB" hidden></button>
  </div>
  <div id="sFind" hidden>
    <div class="cs-task" id="fTask"></div>
    <div class="cs-dots" id="fDots"></div>
    <button class="btn ghost" type="button" data-act="fagain" id="fAgain" hidden></button>
  </div>
  <div class="row2 cs-sec" id="secRow" hidden><div class="chips" id="secChips"></div></div>`;

const goView = (v) => $('views').querySelector(`[data-view="${v}"]`)?.click();
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

// --- drawing the three views ------------------------------------------------------------------------------------
function drawJoin(c, w, h, dt, time) {
  const b = box(w, h), k = b.k;
  flatBg(c, w, h, time);
  const P = JP.map((p) => [b.ox + p.x * k, b.oy + p.y * k]), st = GR.dip.stars, rr = st.map((q) => starR(q.mag) * k);
  S.hit = P.map(([x, y]) => ({ x, y }));
  const U = Math.hypot(P[3][0] - P[1][0], P[3][1] - P[1][1]), picsOn = S.sec === 'pics' && S.joinDone;
  if (S.joinDone) {
    const gt = time - S.doneAt;
    const ga = gt > 0 && gt < 1.7 && !picsOn ? Math.sin(Math.PI * gt / 1.7) * 0.9 : 0; // the ladle glows
    if (ga > 0.01) drawSil(c, w, h, picShapes('ladle', P, U), ga, '255,226,150', 0.12);
    S.bearA += (((!picsOn && gt > 1.0) ? 1 : 0) - S.bearA) * Math.min(1, dt * 1.8); // then the bear fades in around it
    if (S.bearA > 0.02) drawSil(c, w, h, bearShapes(P, U), S.bearA * 0.62, '190,214,255', 0.07);
  } else S.bearA = 0;
  for (const kd of PICS) {
    S.picA[kd] += (((picsOn && S.pic === kd) ? 1 : 0) - S.picA[kd]) * Math.min(1, dt * 7);
    if (S.picA[kd] > 0.02) { drawSil(c, w, h, picShapes(kd, P, U), S.picA[kd] * 0.7, '255,226,150', 0.09); picDetails(c, kd, P, U, S.picA[kd]); }
  }
  for (const sg of S.segs) goldLine(c, P[sg.a][0], P[sg.a][1], P[sg.b][0], P[sg.b][1], (time - sg.t0) / 0.45, rr[sg.a], rr[sg.b]);
  for (let i = 0; i < 7; i++) {
    const on = i < S.joined || S.joinDone;
    drawStar(c, P[i][0], P[i][1], rr[i] * (on ? 1.1 : 1), on ? '255,232,170' : st[i].rgb, on ? 1.5 : 1.25, twOf(i, time));
  }
  if (S.pick !== null && !S.joinDone && S.joined < 7) { // the next star pulses
    const i = S.joined, ph = Math.sin(time * 5.5), pr = rr[i] * 2.2 + (3 + 2 * ph) * k;
    c.strokeStyle = `rgba(255,226,150,${0.6 + 0.35 * ph})`; c.lineWidth = 2.2; c.beginPath(); c.arc(P[i][0], P[i][1], pr, 0, TAU); c.stroke();
    const gg = c.createRadialGradient(P[i][0], P[i][1], 0, P[i][0], P[i][1], pr * 1.6);
    gg.addColorStop(0, 'rgba(255,226,150,.22)'); gg.addColorStop(1, 'rgba(255,226,150,0)');
    c.fillStyle = gg; c.beginPath(); c.arc(P[i][0], P[i][1], pr * 1.6, 0, TAU); c.fill();
    const ne = time - S.nudge;
    if (ne >= 0 && ne < 0.6) { c.strokeStyle = `rgba(255,255,255,${0.7 * (1 - ne / 0.6)})`; c.lineWidth = 2; c.beginPath(); c.arc(P[i][0], P[i][1], pr + ne * 40 * k, 0, TAU); c.stroke(); }
  }
}

function drawTurn(c, w, h, dt, time) {
  if (S.playing) {
    S.h = Math.min(8, S.h + dt * 8 / 7); S.hv = S.h;
    $('hours').value = S.h;
    if (S.h >= 8) { S.playing = false; render(); }
    checkReveal();
  } else S.hv += (S.h - S.hv) * Math.min(1, dt * 10);
  if (S.h !== S.lastH) { S.lastH = S.h; turnReadout(); }
  const cx = w / 2, cy = h * 0.43, s = Math.min((w / 2 - 14) / 0.8, (h * 0.84 - cy - 6) / 0.8, (cy - 10) / 0.8), kk = clamp(w / 343, 0.8, 1.5);
  const ang = S.hv * 15, sp = (ra, dec) => {
    const r = 2 * Math.tan((90 - dec) * R / 2), a = (ra + OFF + ang) * R;
    return [cx + s * r * Math.cos(a), cy - s * r * Math.sin(a), r];
  };
  const trails = S.sec === 'trails' && S.turnAns !== null;
  const answered = S.turnAns !== null;
  if (answered && !trails) { // faint circles: the sky turns around the middle
    c.strokeStyle = 'rgba(170,190,255,.10)'; c.lineWidth = 1; c.setLineDash([3, 6]);
    for (const rad of [0.35, 0.7]) { c.beginPath(); c.arc(cx, cy, rad * s, 0, TAU); c.stroke(); }
    c.setLineDash([]);
  }
  if (trails) { // star trails: every star draws an arc around the North Star
    c.lineCap = 'butt';
    const arc = (ra, dec, col, lw) => {
      const r = 2 * Math.tan((90 - dec) * R / 2), a0 = (ra + OFF) * R, a1 = (ra + OFF + ang) * R;
      if (ang < 0.05) return;
      c.strokeStyle = col; c.lineWidth = lw; c.beginPath(); c.arc(cx, cy, Math.max(0.5, s * r), -a0, -a1, true); c.stroke();
    };
    for (const b of BGS) if (b.colat < 66 && b.r > 0.55) arc(b.ra, 90 - b.colat, `rgba(200,220,255,${0.18 + b.a * 0.25})`, 1);
    for (const q of GR.dip.stars) arc(q.ra, q.dec, 'rgba(255,224,138,.6)', 1.6);
    arc(POLARIS.ra, POLARIS.dec, 'rgba(255,247,224,.8)', 1.6);
  }
  for (const b of BGS) {
    const [x, y] = sp(b.ra, 90 - b.colat);
    if (x < -4 || x > w + 4 || y < -4 || y > h) continue;
    dot(c, x, y, b, time);
  }
  const P = GR.dip.stars.map((q) => sp(q.ra, q.dec)), rr = GR.dip.stars.map((q) => starR(q.mag) * kk), pp = sp(POLARIS.ra, POLARIS.dec);
  for (const [a, bb] of GR.dip.lines) goldLine(c, P[a][0], P[a][1], P[bb][0], P[bb][1], 1, rr[a], rr[bb]);
  if (S.revealed) { // the two pointer stars, and a dotted arrow to the North Star
    for (const i of [0, 1]) { c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1.6; c.beginPath(); c.arc(P[i][0], P[i][1], rr[i] * 2.4 + 2, 0, TAU); c.stroke(); }
    const dx = pp[0] - P[0][0], dy = pp[1] - P[0][1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, sx = P[0][0] + ux * (rr[0] * 2.4 + 6), sy = P[0][1] + uy * (rr[0] * 2.4 + 6);
    const ex = pp[0] - ux * 12, ey = pp[1] - uy * 12;
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2.2; c.lineCap = 'round'; c.setLineDash([1, 7]);
    c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke(); c.setLineDash([]);
    c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath(); c.moveTo(ex + ux * 8, ey + uy * 8); c.lineTo(ex - uy * 5, ey + ux * 5); c.lineTo(ex + uy * 5, ey - ux * 5); c.closePath(); c.fill();
  }
  GR.dip.stars.forEach((q, i) => drawStar(c, P[i][0], P[i][1], rr[i], q.rgb, 1.2, twOf(i, time)));
  drawStar(c, pp[0], pp[1], starR(POLARIS.mag) * kk, POLARIS.rgb, 1.3, twOf(9, time));
  if (S.revealed) pill(c, T[lang].north, pp[0] + 52 * kk, pp[1] - 18 * kk, w);
}

function drawFind(c, w, h, dt, time) {
  const b = box(w, h), k = b.k;
  flatBg(c, w, h, time);
  S.hit = [];
  let n = 0;
  for (const g of ['dip', 'cas', 'ori']) {
    const st = GR[g].stars, P = FP[g].map((p) => [b.ox + p.x * k, b.oy + p.y * k]), rr = st.map((q) => starR(q.mag) * k), t0 = S.foundAt[g], found = t0 >= 0;
    if (found) GR[g].lines.forEach(([a, bb], li) => goldLine(c, P[a][0], P[a][1], P[bb][0], P[bb][1], (time - t0 - li * 0.14) / 0.45, rr[a], rr[bb]));
    st.forEach((q, i) => {
      S.hit.push({ x: P[i][0], y: P[i][1], g, i });
      const belt = g === 'ori' && found && BELT.includes(i);
      drawStar(c, P[i][0], P[i][1], rr[i] * (found ? 1.1 : 1), found ? '255,232,170' : q.rgb, found ? 1.5 : 1.0, twOf(n++, time));
      if (belt) { const ph = Math.sin(time * 4 + i); c.strokeStyle = `rgba(255,226,150,${0.5 + 0.3 * ph})`; c.lineWidth = 2; c.beginPath(); c.arc(P[i][0], P[i][1], rr[i] * 2.2 + 3 + ph, 0, TAU); c.stroke(); }
      const we = time - S.wrong.t;
      if (S.wrong.g === g && we >= 0 && we < 0.7) { c.strokeStyle = `rgba(255,255,255,${0.6 * (1 - we / 0.7)})`; c.lineWidth = 2; c.beginPath(); c.arc(P[i][0], P[i][1], rr[i] * 2 + 4 + we * 14, 0, TAU); c.stroke(); }
    });
    if (found && time - t0 > 0.5) {
      const xs = P.map((p) => p[0]), ys = P.map((p) => p[1]);
      pill(c, T[lang].names[g], (Math.min(...xs) + Math.max(...xs)) / 2, Math.min(...ys) - 22, w);
    }
  }
  const me = time - S.miss.t;
  if (me >= 0 && me < 0.5) { c.strokeStyle = `rgba(255,255,255,${0.35 * (1 - me / 0.5)})`; c.lineWidth = 1.5; c.beginPath(); c.arc(S.miss.x, S.miss.y, 6 + me * 40, 0, TAU); c.stroke(); }
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  sky(c, w, h);
  if (lab.view === 'join') drawJoin(c, w, h, dt, time);
  else if (lab.view === 'turn') drawTurn(c, w, h, dt, time);
  else drawFind(c, w, h, dt, time);
  ground(c, w, h, time);
});

// --- taps --------------------------------------------------------------------------------------------------------
function joinTap(x, y) {
  if (S.pick === null || S.joinDone || S.joined >= 7) return;
  const p = S.hit[S.joined];
  if (!p) return;
  if (Math.hypot(x - p.x, y - p.y) > 28) { S.nudge = now(); return; } // tolerant: 28 px around the next star
  S.joined++;
  if (S.joined > 1) S.segs.push({ a: S.joined - 2, b: S.joined - 1, t0: now() });
  if (S.joined === 7) { S.segs.push({ a: 3, b: 0, t0: now() + 0.3 }); S.doneAt = now() + 0.8; S.joinDone = true; sfx.good(); showStage(); }
  else sfx.click();
  render();
}
function findTap(x, y) {
  if (S.task >= 3) return;
  let best = null, bd = 30;
  for (const p of S.hit) { const d = Math.hypot(x - p.x, y - p.y); if (d < bd) { bd = d; best = p; } }
  if (!best) { S.miss = { x, y, t: now() }; return; }
  if (S.foundAt[best.g] >= 0) { sfx.tick(); return; }
  if (best.g === TASKS[S.task]) {
    S.foundAt[best.g] = now(); S.fMsg = best.g; S.task++; sfx.good();
  } else { S.wrong = { g: best.g, t: now() }; S.fMsg = 'no'; sfx.bad(); }
  render();
}
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'join') joinTap(x, y); else if (lab.view === 'find') findTap(x, y);
});
function checkReveal() {
  if (S.revealed || S.turnAns === null || S.h < 4) return;
  S.revealed = true; (S.turnAns === 'same' ? sfx.good : sfx.click)(); render();
}
$('hours').addEventListener('input', (ev) => { S.h = +ev.target.value; S.playing = false; checkReveal(); turnReadout(); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.pick) { S.pick = b.dataset.pick; sfx.click(); }
  else if (b.dataset.ans) { S.turnAns = b.dataset.ans; sfx.click(); }
  else if (b.dataset.pic) { S.pic = b.dataset.pic; sfx.click(); }
  else if (b.dataset.act === 'again') { S.joined = 0; S.segs = []; S.joinDone = false; S.doneAt = -1; S.bearA = 0; S.sec = null; sfx.click(); }
  else if (b.dataset.act === 'fagain') { S.task = 0; S.foundAt = { cas: -1, ori: -1, dip: -1 }; S.fMsg = null; sfx.click(); }
  else if (b.dataset.act === 'play') { S.h = 0; S.hv = 0; S.playing = true; $('hours').value = 0; sfx.click(); }
  else if (b.dataset.act === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    const kd = b.dataset.k, home = kd === 'pics' ? 'join' : 'turn';
    if (lab.view !== home) { S.sec = kd; goView(home); return; }
    S.sec = S.sec === kd ? null : kd;
    if (kd === 'trails' && S.sec) { S.h = 0; S.hv = 0; S.playing = false; $('hours').value = 0; }
    sfx.click();
  } else return;
  render();
});

// --- render: controls, readout, state card and facts -----------------------------------------------------------------
function turnReadout() {
  if (lab.view !== 'turn') return;
  const t = T[lang];
  lab.setReadout(fmtTime(S.h), t.turned(Math.round(S.h * 15)), '', '#6f8cf0');
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('sJoin').hidden = v !== 'join'; $('sTurn').hidden = v !== 'turn'; $('sFind').hidden = v !== 'find';
  let secDone;
  if (v === 'join') secDone = renderJoin(t); else if (v === 'turn') secDone = renderTurn(t); else secDone = renderFind(t);
  $('secRow').hidden = !secDone;
  const open = secret.unlocked(), sc = (kd, emo, label) => `<button class="chip secret ${open ? 'open' : ''} ${(S.sec === kd && ((kd === 'pics' && v === 'join') || (kd === 'trails' && v === 'turn'))) ? 'on' : ''}" data-act="sec" data-k="${kd}">${open ? `${emo} ${esc(label)}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('pics', '🛒', t.chipA) + sc('trails', '🧭', t.chipB);
}
function renderJoin(t) {
  const picked = S.pick !== null, done = S.joinDone, picsOn = S.sec === 'pics' && done;
  lab.setGlow('rgba(80, 120, 220, .28)');
  $('jAsk').hidden = picked; $('jGo').hidden = !picked;
  if (!picked) {
    $('jQ').textContent = t.jq;
    $('jOpts').innerHTML = [['ladle', '🥄'], ['fish', '🐟'], ['house', '🏠']].map(([id, e]) => `<button class="cs-pick" type="button" data-pick="${id}"><span class="e">${e}</span><span>${esc(t.pick[id])}</span></button>`).join('');
    lab.setReadout('7', t.brightStars, '', '#ffd978');
    lab.setState({ emo: '🤔', title: t.jSt0[0], lead: t.jSt0[1], body: '' });
    lab.setFacts([]);
    return false;
  }
  $('jStep').hidden = done; $('jDots').hidden = done;
  $('jStepT').textContent = t.tapNext;
  $('jDots').innerHTML = [0, 1, 2, 3, 4, 5, 6].map((i) => `<i class="${i < S.joined ? 'on' : ''}"></i>`).join('');
  const right = S.pick === 'ladle';
  $('jVerdict').hidden = !done || picsOn; $('jVerdict').className = `cs-verdict ${right ? 'ok' : 'no'}`; $('jVerdict').textContent = done ? (right ? t.jRightV : t.jWrongV) : ''; // no answer in the DOM before the stars are joined
  $('jAgain').hidden = !done || picsOn; $('jAgain').textContent = t.again;
  $('picChips').hidden = !picsOn;
  $('picChips').innerHTML = PICS.map((kd) => `<button class="chip cs-chip ${S.pic === kd ? 'on' : ''}" type="button" data-pic="${kd}">${t.pics[kd][0]} ${esc(t.pics[kd][1])}</button>`).join('');
  lab.setReadout(`${S.joined}/7`, t.joinedSub, '', '#ffd978');
  if (picsOn) {
    const p = t.pics[S.pic];
    lab.setState({ emo: p[0], title: p[2], lead: p[3], body: t.picBody });
  } else if (done) {
    lab.setState({ emo: '🥄', title: right ? t.jRightV : t.jWrongV, lead: t.jDone, body: t.jBear });
  } else lab.setState({ emo: '👆', title: t.jSt1[0], lead: t.jSt1[1], body: '' });
  lab.setFacts(done ? t.facts.join : []);
  return done;
}
function renderTurn(t) {
  const ans = S.turnAns, rev = S.revealed, trails = S.sec === 'trails' && ans !== null;
  lab.setGlow('rgba(90, 120, 230, .28)');
  $('tQ').textContent = t.tq;
  $('tOpts').innerHTML = ['diff', 'same', 'gone'].map((id) => {
    const cls = rev ? (id === 'same' ? 'good' : id === ans ? 'bad' : '') : (id === ans ? 'sel' : '');
    return `<button class="cs-opt ${cls}" type="button" data-ans="${id}"${ans !== null ? ' disabled' : ''}>${esc(t.tOpts[id])}</button>`;
  }).join('');
  $('hoursLbl').textContent = t.hoursLbl;
  const sl = $('hours'); sl.disabled = ans === null; sl.setAttribute('aria-label', t.hoursLbl);
  if (document.activeElement !== sl) sl.value = S.h;
  $('tVerdict').hidden = !rev; $('tVerdict').className = `cs-verdict ${ans === 'same' ? 'ok' : 'no'}`; $('tVerdict').textContent = rev ? (ans === 'same' ? t.tRight : t.tWrong) : ''; // no answer in the DOM before the reveal
  $('playB').hidden = !trails; $('playB').textContent = S.h > 0 ? t.replay : t.play; $('playB').disabled = S.playing;
  turnReadout(); S.lastH = S.h;
  if (trails) lab.setState({ emo: '🧭', title: t.trail[0], lead: t.trail[1], body: '' });
  else if (rev) lab.setState({ emo: '🔄', title: t.tRev[0], lead: t.tRev[1], body: t.tRev[2] });
  else if (ans !== null) lab.setState({ emo: '🌙', title: t.tSt1[0], lead: t.tSt1[1], body: '' });
  else lab.setState({ emo: '🤔', title: t.tSt0[0], lead: t.tSt0[1], body: '' });
  lab.setFacts(rev ? t.facts.turn : []);
  return rev;
}
function renderFind(t) {
  const all = S.task >= 3, nf = TASKS.filter((g) => S.foundAt[g] >= 0).length;
  lab.setGlow('rgba(80, 120, 220, .28)');
  $('fTask').hidden = all;
  $('fTask').innerHTML = all ? '' : `<span class="n">${S.task + 1}/3</span><span>${esc(t.tasks[S.task])}</span>`;
  $('fDots').innerHTML = [0, 1, 2].map((i) => `<i class="${i < nf ? 'on' : ''}"></i>`).join('');
  $('fAgain').hidden = !all; $('fAgain').textContent = t.again;
  lab.setReadout(`${nf}/3`, t.foundSub, '', '#ffd978');
  if (all) lab.setState({ emo: '🎉', title: t.fAll[0], lead: t.fAll[1], body: '' });
  else if (S.fMsg === 'no') lab.setState({ emo: '🔍', title: t.tasks[S.task], lead: t.fNo, body: '' });
  else if (S.fMsg) lab.setState({ emo: '✅', title: t.fYes[S.fMsg][0], lead: t.fYes[S.fMsg][1], body: t.tasks[S.task] });
  else lab.setState({ emo: '🔍', title: t.tasks[S.task], lead: t.fPick, body: '' });
  lab.setFacts(S.foundAt.ori >= 0 ? t.facts.find : []);
  return all;
}
render();
</script>
</body>
