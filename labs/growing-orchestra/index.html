  c.fillStyle = '#8a5a30'; c.strokeStyle = '#1c1008'; c.lineWidth = 1.6; c.beginPath(); c.arc(wx, wy, 26, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = '#4a2f18'; c.beginPath(); c.arc(wx, wy, 19, 0, TAU); c.fill();
  c.strokeStyle = '#8a5a30'; c.lineWidth = 2.2; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; c.beginPath(); c.moveTo(wx, wy); c.lineTo(wx + Math.cos(a) * 19, wy + Math.sin(a) * 19); c.stroke(); }
  c.strokeStyle = '#2a2a30'; c.lineWidth = 2.4; c.beginPath(); c.arc(wx, wy, 26, 0, TAU); c.stroke();
  c.fillStyle = '#2a2a30'; c.beginPath(); c.arc(wx, wy, 5, 0, TAU); c.fill();
  c.restore();
  const mx = px + dx * 66, my = py + dy * 66;
  if (fr >= 0 && fr < .16) { const q = 1 - fr / .16; glow(c, mx + 6, my, 46 * q + 14, '#ffb03a', .95); glow(c, mx + 4, my, 24 * q + 6, '#fff6c8', 1); }
  for (let j = 0; j < 9; j++) {
    const a = fr - j * .05; if (a <= 0 || a > 2.4) continue;
    const e = eOut(a / 1.4), x = mx + 12 + dx * 56 * e + a * 10 + j * 3, y = my + dy * 56 * e - a * 16 - j * 2, r = 9 + 24 * e + j * 1.6, al = .6 * (1 - a / 2.4);
    glow(c, x, y, r, '#d8d8e2', al * 1.4);
  }
  // beat dots
  for (let i = 0; i < 4; i++) {
    const x = 150 + i * 20, on = i <= m; c.fillStyle = i === 3 ? (on ? '#ff5a4a' : 'rgba(255,90,74,.25)') : (on ? '#ffe8b0' : 'rgba(255,232,176,.25)');
    c.beginPath(); c.arc(x, 26, 6, 0, TAU); c.fill(); c.strokeStyle = 'rgba(0,0,0,.5)'; c.lineWidth = 1; c.stroke();
  }
  pill(c, t.secrets.b[0], 12, 56, { edge: 'rgba(255,232,176,.5)' });
  pill(c, t.secrets.b[1], 180, 280, { al: 'c' });
  c.restore();
}

// --- the animation loop: a year that plays, then the active scene ----------------------------------------------
function tick(dt, time) {
  if (S.play) {
    const u = clamp01((time - S.play.t0) / S.play.dur);
    S.year = 1720 + 190 * eIO(u);
    if (u >= 1) S.play = null;
  }
  S.n = countsAt(Math.round(S.year));
  syncStage();
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  tick(dt, time);
  if (S.sec === 'a') return drawPalace(c, w, h, dt, time);
  if (S.sec === 'b') return drawCannon(c, w, h, dt, time);
  const v = lab.view;
  if (v === 'stage') drawStage(c, w, h, dt, time);
  else if (v === 'composers') drawComposers(c, w, h, dt, time);
  else drawInstruments(c, w, h, dt, time);
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function startPlay() { S.year = 1720; S.play = { t0: now(), dur: 8 }; }
function answer(v, i) {
  if (P[v] !== null) return;
  P[v] = i; const ok = i === ASK[v].right; (ok ? sfx.good : sfx.bad)();
  if (v === 'stage') startPlay();
  else if (v === 'composers') { S.comp = 'liszt'; S.compT0 = now(); }
  else { S.instT0 = now(); S.inst = 'tuba'; }
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.p !== undefined) return answer(lab.view, +b.dataset.p);
  if (b.dataset.c) { S.comp = S.comp === b.dataset.c ? null : b.dataset.c; S.compT0 = now(); sfx.click(); return render(); }
  if (b.dataset.i) { playInst(b.dataset.i); return render(); }
  const act = b.dataset.act;
  if (act === 'replay') { startPlay(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (sndOn()) audio();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.secT0 = now(); S.beat = -1; S.fire = -9; S.hit = -9; sfx.click();
    render();
  }
});
function playInst(k) {
  S.inst = S.inst === k ? null : k;
  if (S.inst) { sfx.tick(); note(IFAM[k] === 'keys' && k === 'celesta' ? 'bell' : IFAM[k] === 'keys' ? 'keys' : IFAM[k], IHZ[k]); }
}
$('goYear').addEventListener('pointerdown', () => { S.play = null; });
$('goYear').addEventListener('input', (ev) => { S.play = null; S.year = +ev.target.value; });
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - V.ox) / V.s, y = (ev.clientY - r.top - V.oy) / V.s, v = lab.view;
  if (v === 'composers' && P.composers !== null) {
    const i = Math.floor((y - TL.y0) / TL.row);
    if (i >= 0 && i < COMP.length) { const id = COMP[i].id; S.comp = S.comp === id ? null : id; S.compT0 = now(); sfx.click(); render(); return; }
    for (const k of COMP) for (const cid of k.cities) { const [px, py] = PIN[cid]; if (Math.hypot(x - px, y - py) < 14 && (!S.comp || k.id !== S.comp)) { S.comp = k.id; S.compT0 = now(); sfx.click(); render(); return; } }
  } else if (v === 'instruments' && P.instruments !== null) {
    let best = null, bd = 1e9;
    for (const k of INST) { const p = INSTPOS[k]; if (!p) continue; const d = Math.hypot(x - p.x, y - p.y); if (d < Math.max(p.r + 6, 22) && d < bd) { best = k; bd = d; } }
    if (best) { playInst(best); render(); }
  }
});

// --- render: controls, readout and the state card -----------------------------------------------------------
function legend() {
  const t = T[lang];
  $('goLeg').innerHTML = FK.map((f) => `<span class="go-li"><i style="background:${FAM[f].c}"></i>${esc(t.families[f])} <b id="goN_${f}">${S.n[f]}</b></span>`).join('');
}
function syncStage() {
  const t = T[lang], yr = Math.round(S.year), n = S.n, total = FK.reduce((a, f) => a + n[f], 0), key = `${yr}|${lang}|${lab.view}|${S.sec}|${P.stage}`;
  if (key === S.key) return;
  S.key = key;
  for (const f of FK) { const e = $('goN_' + f); if (e) e.textContent = n[f]; }
  const yv = $('goYear'); if (yv && +yv.value !== yr) yv.value = yr;
  if (lab.view === 'stage' && !S.sec) {
    const who = composerNear(yr), doc = yr <= 1721 || yr >= 1910;
    lab.setReadout(t.players(total), who ? `${yr} · ${t.short[who]}` : `${yr}`, doc ? t.documented : t.approx, '#c8862e');
  }
}
function renderAsk(v) {
  const t = T[lang], k = ASK[v], pick = P[v];
  $('goAsk').innerHTML = `<div class="go-q">${esc(t[k.q])}</div><div class="go-opts">${t[k.o].map((o, i) => {
    const cls = pick === null ? '' : i === k.right ? 'ok' : i === pick ? 'no' : 'dim';
    return `<button type="button" class="go-opt ${cls}" data-p="${i}"${pick !== null ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('')}</div>${pick !== null ? `<div class="go-v ${pick === k.right ? 'ok' : 'no'}">${esc(pick === k.right ? t[k.ok] : t[k.no])}</div>` : ''}`;
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, ans = P[v] !== null;
  document.body.dataset.v = v;
  $('goAsk').style.display = sec ? 'none' : 'block';
  $('goStage').style.display = !sec && v === 'stage' ? 'block' : 'none';
  $('goComp').style.display = !sec && v === 'composers' ? 'block' : 'none';
  $('goInst').style.display = !sec && v === 'instruments' ? 'block' : 'none';
  if (!sec) renderAsk(v);
  $('goRp').disabled = P.stage === null; $('goYear').disabled = P.stage === null; $('goYear').setAttribute('aria-label', t.year);
  legend();
  $('goCompChips').innerHTML = COMP.map((k) => `<button type="button" class="go-cc${S.comp === k.id ? ' on' : ''}" data-c="${k.id}"${P.composers === null ? ' disabled' : ''}><i style="background:${k.col}"></i>${esc(t.short[k.id])}</button>`).join('');
  $('goInstChips').innerHTML = INST.map((k) => `<button type="button" class="go-cc${S.inst === k ? ' on' : ''}" data-i="${k}"${P.instruments === null ? ' disabled' : ''}><i style="background:${FAM[IFAM[k]].c}"></i>${esc(t.instr[k])}</button>`).join('');
  const open = secret.unlocked();
  $('goSec').innerHTML = [['a', '🏰'], ['b', '💥']].map(([k, emo]) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  S.key = '';
  if (sec) {
    lab.setGlow(sec === 'a' ? 'rgba(242, 193, 78, .26)' : 'rgba(212, 73, 92, .26)');
    lab.setReadout(esc(t.secrets[sec][0]), '', '', sec === 'a' ? '#f2c14e' : '#d4495c');
    lab.setState({ emo: sec === 'a' ? '🏰' : '💥', title: t.secrets[sec][0], lead: sec === 'a' ? t.palaceText : t.cannonText, body: '' });
    lab.setFacts([]);
    return;
  }
  const st = t.st[v], ask = t[ASK[v].q];
  if (v === 'stage') { lab.setGlow('rgba(242, 193, 78, .24)'); syncStage(); }
  else if (v === 'composers') {
    lab.setGlow('rgba(95, 164, 99, .24)');
    const k = COMP.find((x) => x.id === S.comp);
    if (k && ans) lab.setReadout(esc(t.short[k.id]), `${t.composers[k.id]} · ${k.b}–${k.d}`, k.cities.map((id) => t.cities[id]).join(' · '), '#5fa463');
    else lab.setReadout(ans ? '—' : '?', '', '', '#5fa463');
  } else {
    lab.setGlow('rgba(155, 127, 212, .26)');
    const k = S.inst;
    if (k && ans) lab.setReadout(esc(t.instr[k]), t.years[k], t.families[IFAM[k]], FAM[IFAM[k]].c);
    else lab.setReadout(ans ? '—' : '?', '', '', '#9b7fd4');
  }
  // while the guess is open the cards say nothing that answers it
  if (!ans) { lab.setState({ emo: '🤔', title: ask, lead: '', body: '' }); lab.setFacts([]); }
  else { lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] }); lab.setFacts(t.facts[v]); }
}
render();
</script>
