    update();
  }
  const busy = !!(S.anim || S.jobs.length || S.flights.length);
  if (busy !== S.busy) { S.busy = busy; render(); }

  c.save();
  c.translate((w - W * sc) / 2, (h - H * sc) / 2); c.scale(sc, sc);
  // panels
  const pg = c.createLinearGradient(8, 6, 352, 232); pg.addColorStop(0, '#26335a'); pg.addColorStop(1, '#131a33');
  rr(c, 4, 4, 352, 230, 18); c.fillStyle = pg; c.fill(); c.strokeStyle = 'rgba(140,160,215,.3)'; c.lineWidth = 1.2; c.stroke();
  c.save(); rr(c, 4, 4, 352, 230, 18); c.clip(); const lg = c.createRadialGradient(40, 20, 4, 40, 20, 220); lg.addColorStop(0, 'rgba(160,190,255,.28)'); lg.addColorStop(1, 'rgba(160,190,255,0)'); c.fillStyle = lg; c.fillRect(4, 4, 352, 230); c.restore();
  const qg = c.createLinearGradient(8, 240, 352, 476); qg.addColorStop(0, '#1b2646'); qg.addColorStop(1, '#0e1429');
  rr(c, 4, 240, 352, 236, 18); c.fillStyle = qg; c.fill(); c.strokeStyle = 'rgba(140,160,215,.3)'; c.stroke();

  drawJar(c, cx.pop, cx.frost, S.clock);
  drawTray(c); drawBeadsInTray(c, S.tray);
  if (S.tray && S.tray.f >= 1) {                                          // the share bar and its label above the tray
    const s = S.tray.sm; rr(c, TR.x + 6, 90, TR.w - 12, 11, 5.5); c.fillStyle = '#2c3658'; c.fill();
    c.save(); rr(c, TR.x + 6, 90, TR.w - 12, 11, 5.5); c.clip(); const bg = c.createLinearGradient(0, 90, 0, 101); bg.addColorStop(0, '#ff8a7c'); bg.addColorStop(1, '#c8302a');
    c.fillStyle = bg; c.fillRect(TR.x + 6, 90, (TR.w - 12) * s.share / 100, 11); c.restore();
    rr(c, TR.x + 6, 90, TR.w - 12, 11, 5.5); c.strokeStyle = 'rgba(200,215,255,.5)'; c.lineWidth = 1.2; c.stroke();
    pill(c, t.sc(s.reds, s.n, dec(s.share, 0)), TR.x + TR.w / 2, 74, { size: 13 });
  }
  drawScoopTool(c, tool.x, tool.y, tool.rot, bowl && bowl.length ? Array.from(bowl.slice(0, 12)) : null);

  // --- the dot plot
  const R = cx.rows.length, rowH = (PB_ - PT) / R;
  for (let p = 0; p <= 100; p += 25) {
    const x = PX(p); c.strokeStyle = 'rgba(150,170,220,.16)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, PT - 4); c.lineTo(x, PB_ + 2); c.stroke();
    c.fillStyle = '#c6cde0'; c.font = `700 ${fs(12)}px Nunito, system-ui, sans-serif`; c.textAlign = p === 0 ? 'left' : p === 100 ? 'right' : 'center'; c.textBaseline = 'alphabetic';
    c.fillText(`${p}%`, p === 0 ? x - 6 : p === 100 ? x + 6 : x, 468);
  }
  if (cx.band) { const x0 = PX(cx.truth - 3.1), x1 = PX(cx.truth + 3.1); c.fillStyle = 'rgba(245,200,76,.16)'; c.fillRect(x0, PT - 4, x1 - x0, PB_ - PT + 6); c.strokeStyle = 'rgba(245,200,76,.6)'; c.setLineDash([3, 3]); c.strokeRect(x0, PT - 4, x1 - x0, PB_ - PT + 6); c.setLineDash([]); }
  cx.rows.forEach((row, i) => {
    const top = PT + i * rowH, base = top + rowH - 9;
    if (i % 2 === 0 && R > 1) { rr(c, 10, top + 1, 340, rowH - 2, 8); c.fillStyle = 'rgba(130,150,210,.07)'; c.fill(); }
    c.strokeStyle = 'rgba(190,205,245,.5)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(PX(0) - 8, base); c.lineTo(PX(100) + 8, base); c.stroke();
    const d = dotsOf(row.key), bins = new Map(), pos = [];
    for (const v of d) { const b = Math.round(v / 2); const k = bins.get(b) || 0; bins.set(b, k + 1); pos.push([b, k]); }
    const mx = Math.max(1, ...bins.values()), cap = rowH - 22, rad = R > 2 ? 2.7 : 3.4, step = Math.min(rad * 1.9, mx > 1 ? (cap - rad) / (mx - 1) : 99);
    pos.forEach(([b, k]) => c.drawImage(SP.red, b * 2 * 3.12 + 24 - rad, base - 2 - rad * 2 - k * step, rad * 2, rad * 2));
    const st = stats(row.key);
    if (st && st.n >= 8) {
      rr(c, PX(st.lo), base + 2.5, Math.max(3, PX(st.hi) - PX(st.lo)), 4.5, 2.2); c.fillStyle = 'rgba(79,209,255,.9)'; c.fill(); c.strokeStyle = '#1d6e92'; c.lineWidth = 1; c.stroke();
      rr(c, PX(st.mean) - 1.2, base - 3, 2.4, 14, 1.2); c.fillStyle = '#fff'; c.fill(); c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = .8; c.stroke();
    }
    if (row.label && R > 1) pill(c, row.label, 14, top + 11, { size: 12, align: 'l', bg: 'rgba(10,14,30,.72)' });
  });
  if (cx.show) {                                                           // the true share, dashed
    const x = PX(cx.truth); c.strokeStyle = '#f5c84c'; c.lineWidth = 2; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(x, PT - 4); c.lineTo(x, PB_ + 2); c.stroke(); c.setLineDash([]);
    pill(c, t.trueL(dec(cx.truth, 0)), x, 252, { size: 12, fg: '#ffe9a8', line: '#f5c84c' });
  }
  if (cx.guess) {                                                          // the child's guess: a flag
    const x = PX(S.guess); c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, 262); c.lineTo(x, PB_ + 2); c.stroke();
    pill(c, t.guessL(S.guess), x, 252, { size: 12, bg: '#fff', fg: '#10162a' });
  }
  // dots in flight: from the bar above the tray down to their place on the axis
  for (const f of S.flights) {
    const u = f.t / f.dur, x0 = TR.x + 6 + (TR.w - 12) * f.share / 100, y0 = 95, x1 = PX(Math.round(f.share / 2) * 2), cx2 = cx.rows.findIndex((r) => r.key === f.key);
    if (cx2 < 0) continue;
    const base = PT + (cx2 + 1) * rowH - 9, y1 = base - 6, e = u * u, X = x0 + (x1 - x0) * ease(clamp(u * 1.15, 0, 1)), Y = y0 + (y1 - y0) * e;
    c.strokeStyle = 'rgba(255,200,190,.28)'; c.setLineDash([2, 4]); c.beginPath(); c.moveTo(X, Y); c.lineTo(X, y1 + 4); c.stroke(); c.setLineDash([]);
    const sq = u > .85 ? 1 - (u - .85) / .15 * .25 : 1, r = 4.6;
    c.drawImage(SP.red, X - r, Y - r * sq, r * 2, r * 2 * sq);
  }
  c.restore();
});

// --- the page ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').innerHTML = '<div id="sjMain"></div><div class="row2" id="sjSec"></div>';

function render() {
  const t = T[lang], c = ctx(), v = lab.view, dis = S.busy ? ' disabled' : '';
  // progress of the predictions
  if (!S.busy) {
    if (S.p1 === 0 && dotsOf('sc').length >= 1) { S.p1 = 1; S.first1 = dotsOf('sc')[0]; }
    if (S.p2 === 0 && dotsOf('sz100').length >= 50) S.p2 = 1;
    if (S.p3 === 0 && dotsOf('bi0').length >= 50) S.p3 = 1;
  }
  const opts = (list, ok, a, act) => `<div class="chips">${list.map((o, i) => `<button type="button" class="chip sj-opt${a !== null ? (i === ok ? ' good' : a === i ? ' bad' : '') : ''}" data-act="${act}" data-i="${i}"${a !== null || S.busy ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
  const runRow = (extra = '') => `<div class="row2" style="margin-top:0">${extra}<button type="button" class="chip sj-run" data-act="run"${dis}>${esc(t.run)}</button><button type="button" class="chip" data-act="clear"${dis}>${esc(t.clear)}</button></div>`;
  const rowChips = (cx) => `<div class="chips" style="margin-bottom:10px">${cx.rows.map((r) => `<button type="button" class="chip${r.key === curRow(cx).key ? ' on' : ''}" data-act="row" data-k="${r.key}">${esc(r.label)}</button>`).join('')}</div>`;
  let h = '';
  if (S.sec === 'a') h = runRow();
  else if (S.sec === 'b') h = rowChips(c) + runRow();
  else if (v === 'scoop') {
    if (S.p1 === 0) h = `<div class="row2" style="margin-top:0"><button type="button" class="btn sj-run" data-act="one"${dis}>${esc(t.run25)}</button></div>`;
    else if (S.p1 === 1) h = `<div class="sj-ask"><div class="sj-q">${esc(t.q1)}</div>${opts(t.o1, 1, null, 'a1')}</div>`;
    else {
      h = `<div class="row2" style="margin-top:0"><button type="button" class="chip sj-run" data-act="one"${dis}>${esc(t.one)}</button><button type="button" class="chip sj-run" data-act="x20"${dis}>${esc(t.x20)}</button><button type="button" class="chip" data-act="clear"${dis}>${esc(t.clear)}</button></div>`;
      if (c.guess) h += `<div class="sj-guess"><label>${esc(t.gl)}: <b id="sjGv">${esc(pct(S.guess))}</b></label><input type="range" class="big" id="sjGuess" min="0" max="100" step="1" value="${S.guess}" aria-label="${esc(t.gl)}"><div class="row2"><button type="button" class="btn sj-run" data-act="open"${dis}>${esc(t.open)}</button></div></div>`;
    }
  } else if (v === 'sizes') {
    if (S.p2 === 0) h = runRow();
    else if (S.p2 === 1) h = `<div class="sj-ask"><div class="sj-q">${esc(t.zq)}</div>${opts(t.zo, 1, null, 'a2')}</div>`;
    else h = rowChips(c) + runRow();
  } else {
    if (S.p3 === 0) h = runRow();
    else if (S.p3 === 1) h = `<div class="sj-ask"><div class="sj-q">${esc(t.bq)}</div>${opts(t.bo, 1, null, 'a3')}</div>`;
    else h = rowChips(c) + runRow();
  }
  $('sjMain').innerHTML = h;
  const un = secret.unlocked();
  $('sjSec').innerHTML = [['a', '🎯'], ['b', '🌀']].map(([k, emo]) => `<button type="button" class="chip secret ${un ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${un ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  update();
}

function update() {
  const t = T[lang], c = ctx(), v = lab.view, row = curRow(c), st = stats(row.key);
  lab.setGlow(S.sec ? 'rgba(245,200,76,.22)' : { scoop: 'rgba(110,150,255,.28)', sizes: 'rgba(60,170,160,.26)', bias: 'rgba(230,90,80,.26)' }[v]);
  const asking = !S.sec && ((v === 'scoop' && S.p1 === 1) || (v === 'sizes' && S.p2 === 1) || (v === 'bias' && S.p3 === 1));
  if (st) lab.setReadout(esc(pct(st.mean, 1)), t.mean(st.n), t.mid(dec(st.lo), dec(st.hi)), '#e5483e');
  else lab.setReadout('–', t.none, '', '#e5483e');
  let card = null, facts = [];
  const L = (e, ti, le, bo = '') => ({ emo: e, title: ti, lead: le, body: bo, extra: '' });
  const wd = (k) => { const s = stats(k); return s ? s.w : null; };
  if (S.sec === 'a') {
    const d = dotsOf('ma'), k = d.filter((x) => Math.abs(x - 52) <= 3.1).length, [ti, le] = t.ma(52);
    card = L('🎯', ti, le, d.length ? t.mak(k, d.length) : '');
  } else if (S.sec === 'b') {
    const [ti, le] = t.nb, ds = c.rows.filter((r) => dotsOf(r.key).length >= 8).map((r) => `${r.label}: ${pct(stats(r.key).mean)}`).join(' · ');
    card = L('🌀', ti, le, (ds ? ds + '. ' : '') + (c.rows.every((r) => dotsOf(r.key).length >= 8) ? t.nbb : ''));
  } else if (v === 'scoop') {
    const d = dotsOf('sc'), n = d.length;
    if (S.p1 === 0) card = L('🫙', ...t.s0);
    else if (S.p1 === 1) card = L('🤔', ...t.s1);
    else if (n < 2 && S.busy) card = L('🥄', t.watch, '');
    else if (n === 2) { card = L(S.a1 === 1 ? '✅' : '🤔', S.a1 === 1 ? t.right : t.notq, t.s1v(dec(Math.abs(d[1] - d[0]), 0))); }
    else if (!S.rev && n < 20) card = L('🥄', t.s2[0], t.s2[1](n), t.s2[2]);
    else if (!S.rev) card = L('🚩', t.s3[0], t.s3[1], t.s2[2]);
    else { const ok = Math.abs(S.guess - 37) <= 5; card = L(ok ? '✅' : '🤔', ok ? t.right : t.notq, t.s4(37, S.guess, dec(st ? st.mean : 37, 0)), t.s2[2]); }
    if (S.p1 === 2 && n >= 3) facts = t.facts.scoop;
  } else if (v === 'sizes') {
    const a = stats('sz100'), b = stats('sz400');
    if (S.p2 === 0) card = L('🥄', ...t.z0);
    else if (S.p2 === 1) card = L('🤔', t.z1[0], t.z1[1](dec(a.lo), dec(a.hi), dec(a.w)));
    else if (!a || !b || a.n < 150 || b.n < 150) card = L('🥄', t.running, '');
    else card = L(S.a2 === 1 ? '✅' : '🤔', S.a2 === 1 ? t.right : t.notq, t.zv(dec(a.w), dec(b.w), dec(b.w / a.w, 2)), st && st.n >= 8 && row.n !== 100 && row.n !== 400 ? t.zc(row.n, dec(st.mean), dec(st.lo), dec(st.hi), dec(st.w)) : t.zb);
    if (S.p2 === 2) facts = t.facts.sizes;
  } else {
    const a = stats('bi0'), b = stats('bi2');
    if (S.p3 === 0) card = L('🧲', ...t.b0);
    else if (S.p3 === 1) card = L('🤔', t.b1[0], t.b1[1](dec(a.mean)));
    else if (!b || b.n < 150) card = L('🧲', t.running, '');
    else card = L(S.a3 === 1 ? '✅' : '🤔', S.a3 === 1 ? t.right : t.notq, t.bv(dec(a.mean), dec(b.mean), 30), t.bb);
    if (S.p3 === 2) facts = t.facts.bias;
  }
  if (asking) facts = [];
  lab.setState(card); lab.setFacts(facts);
}

// --- input -------------------------------------------------------------------------------------------------
const clearRows = (c) => c.rows.forEach((r) => { S.dots[r.key] = []; });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled || S.busy) return;
  const act = b.dataset.act, c = ctx(), row = curRow(c), i = +b.dataset.i;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
    if (S.sec === 'a' || S.sec === 'b') { const c2 = ctx(); if (S.sec === 'b') S.sel.b = 'nb0'; if (!c2.rows.some((r) => dotsOf(r.key).length)) enqueue(c2, curRow(c2), 50, true); }
    render(); return;
  }
  if (act === 'one') { sfx.click(); enqueue(c, row, 1, false); }
  else if (act === 'x20') { sfx.click(); enqueue(c, row, 20, true, .05); }
  else if (act === 'run') { sfx.click(); enqueue(c, row, 50, true, .03); }
  else if (act === 'clear') { clearRows(c); sfx.click(); }
  else if (act === 'row') { S.sel[c.sel] = b.dataset.k; sfx.tick(); }
  else if (act === 'a1') { S.a1 = i; S.p1 = 2; (i === 1 ? sfx.good : sfx.bad)(); enqueue(c, row, 1, false); showStage(); }
  else if (act === 'a2') {
    S.a2 = i; S.p2 = 2; (i === 1 ? sfx.good : sfx.bad)();
    const all = ctx(); S.sel.sizes = 'sz400';
    enqueue(all, all.rows.find((r) => r.n === 100), Math.max(0, 150 - dotsOf('sz100').length), true, .012);
    enqueue(all, all.rows.find((r) => r.n === 400), 150, true, .012); showStage();
  } else if (act === 'a3') {
    S.a3 = i; S.p3 = 2; (i === 1 ? sfx.good : sfx.bad)(); S.sel.bias = 'bi2';
    const all = ctx(); enqueue(all, all.rows.find((r) => r.key === 'bi2'), 150, true, .012); showStage();
  } else if (act === 'open') { S.rev = true; sfx.good(); showStage(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'sjGuess') return;
  S.guess = +ev.target.value; const g = $('sjGv'); if (g) g.textContent = pct(S.guess);
});
render();
</script>
</body>
