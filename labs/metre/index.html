// --- sound: a soft drum (low thump) and a light tick, scheduled on the audio clock ---------------------------
let AC = null, master = null;

    lab.setState({ emo: st.ok ? '✅' : '🤔', title: st.ok ? t.right : t.notq, lead: lines[0], body: [...lines.slice(1), v === 'two' ? t.huNote1 : t.huNote2].filter(Boolean).join(' '), extra: '' });
  }
  if (S.sec) $('mPr').innerHTML = '';
  else if (st.rev) $('mPr').innerHTML = '';
  $('mQ').textContent = q; $('mBt').innerHTML = btns;
  $('mPr').querySelectorAll('.chip').forEach((b) => { b.disabled = false; });
  lab.setReadout(val, sub, pill, '#f2c04c');
  if (S.autoRun) { S.autoRun = false; startRun(S.sc, DT[v] || 0.38, S.sc.mode === 'brk' ? 0.5 : 0.95); }
}
function renderMeaning(t) {
  const v3 = S.v3, tot = 3, end = v3.r >= tot, ri = Math.min(v3.r, tot - 1), key = SCN[v3.order[ri]], right = SCENE_RH[key], sc = t.v3.scenes[key];
  S.sc = null;
  $('mGl').hidden = true; $('mNm').hidden = true; $('mPr').innerHTML = '';
  const chips = Object.keys(RH).map((k) => {
    const done = v3.ph === 'run' && v3.shown && k === right;
    return `<button class="chip ${v3.pick === k ? 'on' : ''} ${done ? 'mt-ok' : ''}" data-act="rh" data-k="${k}">${esc(t.v3.rh[k])}</button>`;
  }).join('');
  if (end) {
    const k = v3.res.filter(Boolean).length;
    $('mQ').textContent = ''; $('mRh').innerHTML = ''; $('mBt').innerHTML = `<button class="btn" data-act="again3">${esc(t.again)}</button>`;
    lab.setReadout(`${k}/${tot}`, '', '', '#f09060');
    lab.setState({ emo: '🏆', title: t.v3.endT(k, tot), lead: t.v3.endL, body: '', extra: '' });
    return;
  }
  $('mQ').textContent = t.v3.q; $('mRh').innerHTML = chips;
  const last = v3.r >= tot - 1;
  $('mBt').innerHTML = v3.ph === 'pick'
    ? `<button class="btn" data-act="play3"${v3.pick === null ? ' disabled' : ''}>${esc(t.v3.play)}</button>`
    : `<button class="btn" data-act="${last ? 'again3' : 'next3'}"${v3.shown ? '' : ' disabled'}>${esc(last ? t.again : t.next)}</button>`;
  const ok = v3.pick === right;
  if (v3.ph === 'run' && v3.shown) {
    lab.setReadout(ok ? '✓' : '✗', t.v3.sub(v3.r + 1, tot), `${t.v3.rh[right].slice(3)}`, '#f09060');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.v3.okT : t.v3.badT, lead: ok ? t.v3.okL(t.v3.rh[right].slice(3), sc[1]) : t.v3.badL, body: last ? t.v3.endL : '', extra: '' });
  } else {
    lab.setReadout('?', t.v3.sub(v3.r + 1, tot), '', '#f09060');
    lab.setState({ emo: sc[0], title: t.v3.sceneT(v3.r + 1, tot, sc[1]), lead: v3.ph === 'run' ? sc[2] : `${sc[2]} ${t.v3.pickT}`, body: '', extra: '' });
  }
}
render();
