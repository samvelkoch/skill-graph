// solids: an isometric box, its flat net, and the two picked faces laid over each other
const CARD = ['#e8cb9c', '#c9a171'], GROUP = ['#4aa3df', '#f0a23c', '#6fcf7f', '#c28cf0'];
function drawSolids(c, w, h, dt) {

  desk(c, w, h);
  const poly2 = (pts) => { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); };
  // the box
  c.save(); c.globalAlpha = 1 - X.fade * 0.97;
  const hex = [P3(0, 0, cz), P3(a, 0, cz), P3(a, 0, 0), P3(a, b, 0), P3(0, b, 0), P3(0, b, cz)];
  c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 14; c.shadowOffsetX = 5; c.shadowOffsetY = 7; poly2(hex); c.fillStyle = '#b88e5b'; c.fill(); c.restore();
  const shade = [['#f0d6aa', '#dfbb86'], ['#d6af7a', '#c19662'], ['#bf9460', '#a9814f']];
  c.lineJoin = 'round';
  GS.iso.forEach((pts, i) => {
    const r = bb(pts), g = c.createLinearGradient(r[0], r[1], r[2], r[3]); g.addColorStop(0, shade[i][0]); g.addColorStop(1, shade[i][1]);
    poly2(pts); c.fillStyle = g; c.fill();
    if (X.fade > 0.02) { c.globalAlpha = 0.55 * X.fade; c.fillStyle = gcol(i); c.fill(); c.globalAlpha = 1 - X.fade * 0.97; }
    if (X.picks.includes(i)) { c.fillStyle = 'rgba(255,214,74,.38)'; c.fill(); }
    poly2(pts); c.lineWidth = X.picks.includes(i) ? 3.2 : 1.6; c.strokeStyle = X.picks.includes(i) ? '#ffd24a' : '#8b6238'; c.stroke();
  });
  const tape = [P3(a * 0.45, 0, cz), P3(a * 0.55, 0, cz), P3(a * 0.55, b, cz), P3(a * 0.45, b, cz)]; poly2(tape); c.fillStyle = 'rgba(255,255,255,.3)'; c.fill();
  GS.iso.forEach((pts, i) => badge(c, i + 1, pts.reduce((m, p) => m + p[0], 0) / 4, pts.reduce((m, p) => m + p[1], 0) / 4));

  // the net
  c.lineJoin = 'round';
  GS.net.forEach(([x, y, rw, rh], i) => {
    const g = c.createLinearGradient(x, y, x + rw, y + rh); g.addColorStop(0, CARD[0]); g.addColorStop(1, CARD[1]);
    c.save(); c.shadowColor = 'rgba(0,0,0,.3)'; c.shadowBlur = 5; c.shadowOffsetY = 2; rr(c, x, y, rw, rh, 3); c.fillStyle = g; c.fill(); c.restore();
    if (X.fade > 0.02) { rr(c, x, y, rw, rh, 3); c.save(); c.globalAlpha = 0.6 * X.fade; c.fillStyle = gcol(i); c.fill(); c.restore(); }
    if (X.picks.includes(i)) { rr(c, x, y, rw, rh, 3); c.fillStyle = 'rgba(255,214,74,.38)'; c.fill(); }
    rr(c, x, y, rw, rh, 3); c.lineWidth = X.picks.includes(i) ? 3.2 : 1.5; c.strokeStyle = X.picks.includes(i) ? '#ffd24a' : '#8b6238'; c.stroke();

    const f2 = rot ? [d2[1], d2[0]] : d2, mw = Math.max(d1[0], f2[0]), mh = Math.max(d1[1], f2[1]), s2 = Math.min(w * 0.55 / mw, hIso * 0.62 / mh, 60);
    const cx = w / 2, cy = y0 + hIso * 0.48, tx = cx - mw * s2 / 2, ty = cy - mh * s2 / 2, e = X.lt * X.lt * (3 - 2 * X.lt), lp = (u, v) => u + (v - u) * e;
    const n1 = GS.net[i1], n2 = GS.net[i2], c1 = [n1[0] + n1[2] / 2, n1[1] + n1[3] / 2], c2 = [n2[0] + n2[2] / 2, n2[1] + n2[3] / 2];
    const e1 = [lp(c1[0], tx + d1[0] * s2 / 2), lp(c1[1], ty + d1[1] * s2 / 2)], e2 = [lp(c2[0], tx + f2[0] * s2 / 2), lp(c2[1], ty + f2[1] * s2 / 2)], sc1 = lp(q, s2);
    const cols = same ? ['#2fbf84', '#2fbf84', '#b6f2d6'] : ['#ff4d4f', '#ff9f0a', '#ffe9a8'], lift = 5 + 14 * Math.sin(Math.PI * X.lt);

    c.restore();

  }
}
function badge(c, n, x, y) {

  c.fillStyle = '#3b2a16'; c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(n), x, y + 0.5); c.restore();
}

canvasLoop(cv, (c, w, h, dt) => {
  c.save(); rr(c, 0, 0, w, h, 18); c.clip();
  if (lab.view === 'solids') drawSolids(c, w, h, dt); else drawPaperScene(c, w, h, dt);
  c.restore();
});

// --- one render per change: controls, readout and the state card ---------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sc = scene(), c_ = v === 'solids' ? X : cur(), sol = v === 'solids', on = paperOn();
  document.body.dataset.v = v;
  const ask = !SEC && (v === 'match' ? M.ans === null && M.i < 8 : v === 'moves' ? V.ans === null : !X.rev);
  askEl.hidden = !ask;
  $('tpQ').textContent = t.qs[v];
  $('tpO').innerHTML = sol ? '' : `<button class="tp-ab" data-a="y">${esc(t.yes)}</button><button class="tp-ab" data-a="n">${esc(t.no)}</button>`;
  $('tpPaper').hidden = sol;
  const locked = !on || c_.rev;
  $('tpPaper').querySelectorAll('[data-act]').forEach((b) => { b.disabled = locked; });
  $('tpPaper').querySelector('[data-act=L]').setAttribute('aria-label', t.aL); $('tpPaper').querySelector('[data-act=R]').setAttribute('aria-label', t.aR);
  $('tpF').textContent = t.flip;
  $('tpMv').hidden = v !== 'moves' || !on;
  $('tpMv').innerHTML = V.moves.map((m) => `<i>${esc(mvTxt(m, t))}</i>`).join('') || `<span class="tp-hint">${esc(t.nomv)}</span>`;
  $('tpHint').textContent = on && !c_.rev && !sol ? t.hold : '';
  const go_ = $('tpGo'); let lbl = '', dis = false;
  if (sol) { lbl = t.nextBox; dis = !X.rev; }
  else if (SEC) lbl = SX.rev ? t.again : t.check;
  else if (v === 'match') { lbl = M.i >= 8 ? t.again : !M.rev ? t.check : t.next; dis = M.ans === null && M.i < 8; }
  else { lbl = V.rev ? t.next : t.show; dis = V.ans === null; }
  go_.textContent = lbl; go_.disabled = dis;
  for (const k of ['a', 'b']) {
    const b = $('tpSec').querySelector(`[data-k=${k}]`), open = secret.unlocked();
    b.textContent = `${open ? '' : '🔒 '}${SEC_EMO[k]} ${t.secrets[k][0]}`;
    b.classList.toggle('open', open); b.classList.toggle('on', open && SEC === k);
  }
  const fl = FACTS[v].map((f, i) => ({ ...f, text: t.facts[v][i] }));
  lab.setFacts(fl);
  const guessTxt = (a) => a ? t.guess(a === 'y' ? t.yes : t.no) : '';
  const clr = { match: '#4aa3df', moves: '#f0a23c', solids: '#c9a171' }[v];
  lab.setGlow(`${clr}44`);
  if (sol) {
    const right = X.right, rev = X.rev;
    lab.setReadout(rev ? (right ? '≅' : '≇') : '?', BOXES[X.bi].join(' × '), rev ? '' : `${X.picks.length}/2`, clr);
    lab.setState(!rev ? { emo: '📦', title: t.s.t, lead: X.picks.length === 1 ? t.s.one : t.s.q, body: '', extra: '' }
      : { emo: right ? '✅' : '🤔', title: right ? t.right : t.notq, lead: right ? t.s.ok : t.s.no, body: t.s.b, extra: '' });
    return;
  }
  if (SEC) {
    const s = t.secrets[SEC];
    lab.setReadout(SX.rev ? (SX.m ? '≅' : '≇') : '?', '', '', clr);
    lab.setState({ emo: SEC_EMO[SEC], title: s[0], lead: s[1], body: SX.rev ? t.sec[SEC + 'D'] : t.sec[SEC], extra: '' });

  }

    }
    lab.setReadout(M.rev ? (M.m ? '≅' : '≇') : '?', t.round(M.i + 1, 8), guessTxt(M.ans), clr);
    if (M.ans === null) lab.setState({ emo: '🤔', title: t.m.qT, lead: t.m.qL, body: '', extra: '' });
    else if (!M.rev) lab.setState({ emo: '🧻', title: t.m.tT, lead: t.m.tL, body: '', extra: '' });
    else {
      const right = (M.ans === 'y') === sc.cong;

}
