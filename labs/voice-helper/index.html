function enter(r, ph) {

  if (ph === 'done') {
    if (r.kind === 'wake-hey') S.awake = true;

    if (r.kind === 'v1') (r.pick === r.job ? sfx.good : sfx.bad)();
    else if (r.kind === 'v2') (r.wrong ? sfx.bad : sfx.good)();

}

function stepRun(dt) {

}

const effNoise = () => (S.noise !== 'none' && !S.close ? S.noise : null);

function sayPhrase(i) {
  if (busy()) return;

    else if (!S.awake) startRun({ kind: 'wake-ignored', say, nolight: true, seq: ['fly', 'done'] });

}

const rr = (c, x, y, w, h, r) => {

  $('c3').style.display = v === 'sort' ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k && v === 'four' ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('same', '🌧️') + sc('wake', '🔔');
  if (v === 'four') render1(t); else if (v === 'noise') render2(t); else render3(t);
}
const phaseState = (t, ph) => ({ fly: ['🗣️', ...t.s.fly], hear: ['👂', ...t.s.hear], words: ['🔤', ...t.s.words], wait: ['🤔', ...t.s.wait], guess: ['🎯', ...t.s.guess], answer: ['💬', ...t.s.answer] })[ph];
const st = (a) => lab.setState({ emo: a[0], title: a[1], lead: a[2], body: a[3] || '', extra: '' });

function render1(t) {
  const r = S.run, sec = S.sec;
  lab.setGlow('rgba(78, 168, 255, .28)');
  const list = sec === 'same' ? t.sm.cards : sec === 'wake' ? t.wk.cards : t.phr;
  $('cards').innerHTML = list.map((p, i) => `<button class="vh-card" data-act="say" data-i="${i}"${busy() ? ' disabled' : ''}>${esc(p)}</button>`).join('');
  const wait = r && r.ph === 'wait';
  $('pred1').innerHTML = wait ? `<p class="vh-q">${esc(t.pq)}</p><div class="vh-pick">${JOBS.map((j) => `<button data-act="pick" data-j="${j}">${JEMO[j]} ${esc(t.jobs[j])}</button>`).join('')}</div>` : '';
  const n = litCount();
  lab.setFacts(sec ? [] : t.facts.four);
  // readout: only what has happened so far; the job appears when its window has opened
  if (r && r.kind === 'v1' && r.ph === 'done') {
    const ok = r.pick === r.job;
    lab.setReadout(JEMO[r.job], t.jobs[r.job], ok ? t.pill.ok : t.pill.no, '#4ea8ff');
  } else lab.setReadout(`${n}/4`, t.wins, '', '#4ea8ff');
  if (!r) {
    if (sec === 'same') st(['🌧️', ...t.sm.idle]);
    else if (sec === 'wake') st(S.awake ? ['👂', ...t.wk.awake] : ['😴', ...t.wk.asleep]);
    else st(['🗣️', ...t.s.idle]);
    return;
  }
  if (r.ph !== 'done') { st(phaseState(t, r.ph)); return; }
  if (r.kind === 'v1') {
    const ok = r.pick === r.job, j = t.jobs[r.job];
    st(ok ? ['✅', t.right, t.s.right(j), r.job === 'weather' ? t.pretend : r.job === 'timer' ? t.demo : ''] : ['🎯', t.s.wrong(j), t.s.wrongL]);
  } else if (r.kind === 'same') {
    st(S.sameDone.length >= 2 ? ['🌧️', ...t.sm.both] : ['☀️', ...t.sm.one]);
  } else if (r.kind === 'wake-hey') st(['👂', ...t.wk.awake]);
  else if (r.kind === 'wake-ignored') st(['😴', ...t.wk.ignored]);
  else st(r.noJob ? ['🤷', ...t.wk.noJob] : ['😴', ...t.wk.done]);
}

function render2(t) {
  const r = S.run;
  lab.setGlow('rgba(255, 169, 77, .26)');
  lab.setFacts(t.facts.noise);
  $('nzChips').innerHTML = ['none', 'tv', 'vac', 'dog'].map((k) => `<button class="chip ${S.noise === k ? 'on' : ''}" data-act="noise" data-k="${k}"${busy() ? ' disabled' : ''}>${NEMO[k]} ${esc(t.nz[k])}</button>`).join('');
  $('ask2').innerHTML = S.ask2 ? `<p class="vh-q">${esc(t.nzq[S.noise])}</p><div class="vh-pick"><button data-act="ans2" data-j="yes">${esc(t.yes)}</button><button data-act="ans2" data-j="no">${esc(t.no)}</button></div>` : '';
  const done = r && r.ph === 'done';
  $('act2').innerHTML = `<button class="btn vh-act" data-act="say2"${busy() || S.ask2 ? ' disabled' : ''}>${esc(r ? t.again : t.say)}</button>`
    + (done && r.wrong ? `<button class="chip" data-act="closer"${S.close ? ' disabled' : ''}>${esc(t.closer)}</button><button class="chip" data-act="off">${esc(t.off)}</button>` : '');
  const nm = S.noise === 'none' ? t.nz.none : t.nz[S.noise];
  if (done) lab.setReadout(NEMO[S.noise], nm, r.wrong ? t.n.pillBad : t.n.pillOk, '#ffa94d');
  else lab.setReadout(NEMO[S.noise], nm, '', '#ffa94d');
  if (S.ask2) { st(['🤔', t.n.ask, t.nzq[S.noise]]); return; }
  if (!r) { st(['📺', ...(S.noise === 'none' ? t.n.idle0 : t.n.idle1)]); return; }
  if (r.ph !== 'done') { st(phaseState(t, r.ph)); return; }
  if (!r.wrong) { st(['✅', t.n.cleanT, S.close && S.noise !== 'none' ? t.n.closeL : t.n.cleanL]); return; }
  const right = r.pred === 'no';
  st([right ? '✅' : '🤔', right ? t.right : t.n.notQuite, r.partial ? t.n.vacL : t.n.badL(r.words), t.n.fix]);
}

function render3(t) {
  lab.setGlow('rgba(61, 220, 151, .22)');
  lab.setFacts([]);
  const all = S.placed.every((p, i) => p || S.locked[i]), done = S.locked.every(Boolean);
  const placed = S.placed.filter(Boolean).length;
  $('sortList').innerHTML = ORDER.map((ci, n) => {
    const lk = S.locked[ci], p = lk ? TRUTH[ci] : S.placed[ci];
    return `<div class="vh-row ${lk ? 'ok' : ''} ${S.wig[ci] ? 'wig' : ''}"><div class="tx"><i style="background:${PAL6[ci]}"></i>${n + 1}. ${esc(t.sort.cards[ci])}</div>
      <div class="bt"><button data-act="place" data-i="${ci}" data-v="t" class="${p === 't' ? 'on' : ''}">${esc(t.sort.t)}</button><button data-act="place" data-i="${ci}" data-v="f" class="${p === 'f' ? 'on' : ''}">${esc(t.sort.f)}</button></div>
      ${S.why[ci] ? `<div class="why">${esc(S.why[ci])}</div>` : ''}</div>`;
  }).join('');
  $('act3').innerHTML = done ? `<button class="btn vh-act" data-act="reset3">${esc(t.sort.again)}</button>`
    : `<button class="btn vh-act" data-act="check"${all ? '' : ' disabled'}>${esc(t.sort.check)}</button>`;
  S.wig = {};
  const k = S.locked.filter(Boolean).length;
  lab.setReadout(`${S.lastK !== null ? k : placed}/6`, S.lastK !== null ? t.sort.right : t.sort.placed, done ? t.sort.full[0] : '', '#3ddc97');
  if (done) st(['✅', ...t.sort.full]);
  else if (S.lastK === null && placed === 0) st(['🧩', ...t.sort.idle]);
  else if (S.lastK !== null && Object.keys(S.why).length && placed === k) st(['🤔', ...t.sort.part(k)]);
  else st(['🧩', ...t.sort.wait]);
}
render();
</script>
</body>
</html>
