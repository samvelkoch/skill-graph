    c.lineWidth = 3; c.beginPath(); c.moveTo(-2, -14); c.lineTo(20, -10); c.stroke();
    c.lineWidth = 3; c.beginPath(); c.arc(30, -10, 24, Math.PI * 0.62, Math.PI * 1.38); c.stroke();
    c.lineWidth = 1.5; c.beginPath(); c.moveTo(30 + 24 * Math.cos(Math.PI * 0.62), -10 + 24 * Math.sin(Math.PI * 0.62)); c.lineTo(30 + 24 * Math.cos(Math.PI * 1.38), -10 + 24 * Math.sin(Math.PI * 1.38)); c.stroke();
  } else { c.lineWidth = 4; c.beginPath(); c.rect(-22, -22, 44, 44); c.stroke(); c.beginPath(); c.moveTo(-22, -22); c.lineTo(22, 22); c.moveTo(22, -22); c.lineTo(-22, 22); c.stroke(); c.lineWidth = 1.6; c.setLineDash([3, 5]); c.beginPath(); c.arc(0, 0, r - 16, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); }
  c.restore();
  // 20 silver coins = one gold coin
  const n = D.n;
  txt(c, '= 20 ×', 232, 62, 14, '#d3d9e8', { weight: 800 });
  for (let k = 0; k < 20; k++) {
    const px = 196 + (k % 5) * 28, py = 92 + Math.floor(k / 5) * 28, sg = c.createRadialGradient(px - 3, py - 3, 1, px, py, 12);
    sg.addColorStop(0, '#ffffff'); sg.addColorStop(0.6, '#cfd5e0'); sg.addColorStop(1, '#8a92a4'); c.fillStyle = sg; c.beginPath(); c.arc(px, py, 11, 0, Math.PI * 2); c.fill(); c.lineWidth = 1.2; c.strokeStyle = '#5c6478'; c.stroke();
  }
  const w = n * DARIC_G;
  pill(c, `${fmt(w)} g`, 112, 230, { size: 14, bg: 'rgba(168,118,28,.9)' });
  pill(c, `${fmt(w * DARIC_PURE)} g · 95,83 %`.replace('95,83', lang === 'en' ? '95.83' : '95,83'), 250, 230, { size: 12, bg: 'rgba(8,12,22,.82)' });
}

// --- page: controls, state card, facts -----------------------------------------------------------------------------
const lab = shell({ key: 'persia-tribute', T, topics: TOPICS, views: ['gifts', 'rule', 'map'], onLang: render, onView: () => { S.sec = null; render(); } });
const secret = secretLab('persia-tribute', () => ({
  secrets: [{ emo: '📜', title: T[lang].s.cyl[0], desc: T[lang].s.cyl[1] }, { emo: '🪙', title: T[lang].s.dar[0], desc: T[lang].s.dar[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="vG"></div><div id="vR"></div>
  <div id="vM"><div id="mAsk"></div><div id="mPost" hidden>
    <input id="mRange" class="big" type="range" min="0" max="5" step="1" value="0">
    <div class="pt-ends"><span id="mE0"></span><span id="mE1"></span></div><div class="chips" id="mRegs"></div></div></div>
  <div id="vS"></div>
  <div class="row2 pt-sec" id="secRow"></div>`;

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const count = (arr, f) => arr.filter(f).length;
const gRight = () => count(S.g.picks, (p, i) => p === ROUNDS[i].ok);
const rRight = () => count(S.r.picks, (p, i) => p !== null && p === CARD_BIN[i]);
const fact = (e, f) => ({ emo: e, text: f[0], src: f[1] });
const REGY = [START, 546, 539, 525, 500];

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = S.sec ?? lab.view, H = v === 'gifts' ? H1 : v === 'rule' ? H2 : v === 'map' ? H3 : H2;
  S.g.picks.forEach((p, i) => { if (p !== null) S.g.rev[i] = Math.min(1, S.g.rev[i] + dt * 1.5); });
  const sc = Math.min(w / 360, h / H);
  c.save(); c.translate((w - 360 * sc) / 2, (h - H * sc) / 2); c.scale(sc, sc); CW = 360;
  if (v === 'gifts') drawGifts(c, time); else if (v === 'rule') drawRule(c, time, dt); else if (v === 'map') drawMap(c, time, dt);
  else if (v === 'cyl') drawCyl(c, time, dt); else drawDaric(c, time, dt);
  c.restore();
});

// one click handler for all the controls
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, j = +b.dataset.j;
  if (act === 'gpick') {
    const G = S.g; if (G.picks[G.i] !== null) return;
    G.picks[G.i] = j; (j === ROUNDS[G.i].ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'gnext') S.g.i++;
  else if (act === 'gagain') S.g = { i: 0, picks: Array(6).fill(null), rev: Array(6).fill(0) };
  else if (act === 'rpick') {
    const R = S.r; if (R.picks[R.i] !== null) return;
    R.picks[R.i] = j; (j === CARD_BIN[R.i] ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'rnext') S.r.i++;
  else if (act === 'ragain') S.r = { i: 0, picks: Array(6).fill(null), fly: Array(6).fill(0) };
  else if (act === 'mpick') {
    if (S.m.guess !== null) return;
    S.m.guess = j; S.m.step = 0; (j === T[lang].m.ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'mreg') { S.m.reg = S.m.reg === j ? null : j; sfx.tick(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; sfx.click(); if (S.sec) showStage();
  } else if (act === 'close') S.sec = null;
  else if (act === 'cline') { S.cyl.line = j; S.cyl.glow = 0; sfx.tick(); }
  else if (act === 'dn') { S.dar.n = clamp(S.dar.n + j, 1, 10); sfx.tick(); }
  else if (act === 'dflip') { S.dar.flipT = S.dar.flipT >= 1 ? 0 : 1; sfx.click(); }
  render();
});
$('mRange').addEventListener('input', (ev) => {
  if (S.m.guess === null) return;
  S.m.step = +ev.target.value; S.m.reg = null; sfx.tick(); render();
});

function render() {
  const t = T[lang], v = S.sec ?? lab.view;
  document.body.dataset.v = S.sec ? 'sec' : lab.view;
  $('vG').style.display = v === 'gifts' ? '' : 'none';
  $('vR').style.display = v === 'rule' ? '' : 'none';
  $('vM').style.display = v === 'map' ? '' : 'none';
  $('vS').style.display = S.sec ? '' : 'none';
  const open = secret.unlocked();
  $('secRow').style.display = lab.view === 'rule' && !S.sec && S.r.i < 6 ? 'none' : ''; // their names would answer the cards
  $('secRow').innerHTML = [['cyl', '📜'], ['dar', '🪙']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.s[k][0])}` : '🔒 ???'}</button>`).join('');
  if (S.sec === 'cyl') renderCyl(t); else if (S.sec === 'dar') renderDar(t);
  else if (v === 'gifts') renderG(t); else if (v === 'rule') renderR(t); else renderM(t);
}

function renderG(t) {
  const G = S.g, i = G.i, ac = count(G.picks, (p) => p !== null), k = gRight(), g = t.g;
  lab.setGlow('rgba(224, 176, 80, .26)');
  const pill = ac ? `✓ ${k}` : '';
  if (i >= 6) {
    $('vG').innerHTML = `<div class="pt-go"><button class="btn pt-btn" data-act="gagain">${esc(t.again)}</button></div>`;
    lab.setReadout('6/6', '', pill, '#e0b050');
    lab.setState({ emo: '🏆', title: g.doneT(k), lead: g.doneL, body: '', extra: `<div class="pt-fine">${esc(t.m.credit)}</div>` });
    lab.setFacts([fact('💰', g.ftrib), fact('🏛️', g.f23), fact('🏺', g.f72)]);
    return;
  }
  const R = ROUNDS[i], pk = G.picks[i], done = pk !== null;
  $('vG').innerHTML = `<p class="pt-q">${esc(g.q(g.names[i]))}</p>${done ? '' : `<p class="pt-tip">${esc(g.tip)}</p>`}
    <div class="pt-opts">${R.opts.map((id, j) => `<button class="pt-opt ${done ? (j === R.ok ? 'good' : j === pk ? 'bad' : '') : ''}" data-act="gpick" data-j="${j}"${done ? ' disabled' : ''}>${esc(g.gifts[id])}</button>`).join('')}</div>
    ${done ? `<div class="pt-go"><button class="btn pt-btn" data-act="gnext">${esc(t.next)}</button></div>` : ''}`;
  lab.setReadout(`${ac}/6`, g.names[i], pill, '#e0b050');
  if (!done) {
    lab.setState(i === 0 ? { emo: '🏺', title: g.introT, lead: g.introL, body: '', extra: '' } : { emo: '🎁', title: g.names[i], lead: g.tip, body: '', extra: '' });
    lab.setFacts([fact('🏛️', g.f23), fact('🏺', g.f72)]);
  } else {
    const ok = pk === R.ok;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ok : t.no, lead: g.rev[i], body: '', extra: `<div class="pt-fine">${esc(t.m.credit)}</div>` });
    lab.setFacts([fact('🗺️', g.f[i]), fact('🏛️', g.f23), fact('🏺', g.f72)]);
  }
}

function renderR(t) {
  const R = S.r, j = R.i, ac = count(R.picks, (p) => p !== null), k = rRight(), r = t.r;
  lab.setGlow('rgba(143, 127, 208, .24)');
  const nA = count(R.picks, (p, x) => p !== null && CARD_BIN[x] === 0), nP = ac - nA;
  const sub = ac ? `${r.bins[0]} ${nA} · ${r.bins[1]} ${nP}` : '';
  if (j >= 6) {
    $('vR').innerHTML = `<div class="pt-go"><button class="btn pt-btn" data-act="ragain">${esc(t.again)}</button></div>`;
    lab.setReadout('6/6', sub, `✓ ${k}`, '#8f7fd0');
    lab.setState({ emo: '⚖️', title: r.doneT, lead: r.doneL, body: '', extra: '' });
    lab.setFacts(r.fEnd.map((f, x) => fact(x ? '💰' : '🕊️', f)));
    return;
  }
  const card = r.cards[j], pk = R.picks[j], done = pk !== null;
  $('vR').innerHTML = `<div class="pt-card"><span class="e">${card.e}</span>${esc(card.t)}</div>
    <p class="pt-q">${esc(r.q)}</p>
    <div class="pt-opts row">${[0, 1].map((b) => `<button class="pt-opt ${done ? (b === CARD_BIN[j] ? 'good' : b === pk ? 'bad' : '') : ''}" data-act="rpick" data-j="${b}"${done ? ' disabled' : ''}>${esc(r.bins[b])}</button>`).join('')}</div>
    ${done ? `<div class="pt-go"><button class="btn pt-btn" data-act="rnext">${esc(t.next)}</button></div>` : ''}`;
  lab.setReadout(`${ac}/6`, sub, ac ? `✓ ${k}` : '', '#8f7fd0');
  if (!done) {
    lab.setState(j === 0 ? { emo: '⚖️', title: r.introT, lead: r.introL, body: '', extra: '' } : { emo: card.e, title: r.q, lead: '', body: '', extra: '' });
    lab.setFacts([]);
  } else {
    const ok = pk === CARD_BIN[j];
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ok : t.no, lead: `${ok ? '' : r.fits(r.bins[CARD_BIN[j]]) + ' '}${card.why}`, body: '', extra: '' });
    lab.setFacts([fact('📚', r.f[j])]);
  }
}

function renderM(t) {
  const Mp = S.m, m = t.m, guessed = Mp.guess !== null;
  lab.setGlow('rgba(95, 168, 160, .26)');
  $('mAsk').style.display = guessed ? 'none' : '';
  $('mPost').hidden = !guessed;
  if (!guessed) {
    $('mAsk').innerHTML = `<p class="pt-q">${esc(m.q)}</p><p class="pt-tip">${esc(m.tip)}</p><div class="pt-opts">${m.opts.map((o, j) => `<button class="pt-opt" data-act="mpick" data-j="${j}">${esc(o)}</button>`).join('')}</div>`;
    lab.setReadout('?', '', '', '#5fa8a0');
    lab.setState({ emo: '⏳', title: m.introT, lead: m.introL, body: '', extra: `<div class="pt-fine">${esc(m.credit)}</div>` });
    lab.setFacts(m.f.map((f, x) => fact(x ? '💰' : '🛣️', f)));
    return;
  }
  const si = Mp.step, right = Mp.guess === m.ok;
  $('mRange').value = String(si); $('mRange').setAttribute('aria-label', m.steps[si][0]);
  $('mE0').textContent = t.bc(START); $('mE1').textContent = t.bc(END);
  $('mRegs').innerHTML = REG.map((r, i) => (i <= Math.min(si, 4) ? `<button class="chip ${Mp.reg === i ? 'on' : ''}" data-act="mreg" data-j="${i}" style="border-color:${r.col};min-height:36px">${esc(m.regs[i])}</button>` : '')).join('');
  lab.setReadout(bcY(STEP_Y[si], si === 4), m.steps[si][1], si === 4 ? t.km2 : '', '#5fa8a0');
  const emo = ['👑', '🏛️', '🏺', '🌾', '🌍', '⚔️'][si], reg = Mp.reg !== null && Mp.reg <= Math.min(si, 4) ? Mp.reg : null;
  let st;
  if (reg !== null) st = { emo: '🗺️', title: m.regs[reg], lead: reg === 0 || reg === 4 ? m.regNote[reg] : `${m.regAt(bcY(REGY[reg]))} ${m.regNote[reg]}`, body: '' };
  else if (si === 0) st = { emo: right ? '✅' : '🤔', title: right ? t.ok : t.no, lead: m.right(YEARS), body: m.lead };
  else st = { emo, title: m.steps[si][0], lead: m.steps[si][1], body: si === 5 ? m.end : '' };
  const link = si === 5 && reg === null ? `<a class="pt-link" href="../alexander/?lang=${lang}">${esc(m.link)} →</a>` : '';
  lab.setState({ ...st, extra: `${link}<div class="pt-fine">${esc(m.credit)}</div>` });
  lab.setFacts(si === 5 ? [fact('⚔️', m.fEnd), fact('🌍', m.f2[0])] : [fact('🌍', m.f2[0]), ...m.f.map((f, x) => fact(x ? '💰' : '🛣️', f))]);
}

function renderCyl(t) {
  const s = t.s, Y = S.cyl;
  $('vS').innerHTML = `<div class="chips">${s.cylLines.map((l, j) => `<button class="chip ${Y.line === j ? 'on' : ''}" data-act="cline" data-j="${j}" style="min-height:40px;min-width:40px;justify-content:center">${j + 1}</button>`).join('')}</div>
    <div class="pt-go"><button class="btn ghost pt-btn" data-act="close">${esc(s.back)}</button></div>`;
  lab.setGlow('rgba(201, 143, 31, .26)');
  lab.setReadout('45', s.cylSub, s.cylPill, '#c98f1f');
  lab.setState({ emo: '📜', title: s.cylLines[Y.line][0], lead: s.cylLines[Y.line][1], body: '', extra: '' });
  lab.setFacts([fact('🏺', s.cylF)]);
}
function renderDar(t) {
  const s = t.s, D = S.dar, n = D.n, w = n * DARIC_G;
  $('vS').innerHTML = `<div class="pt-step"><span class="pt-ends" style="margin:0">${esc(s.n)}</span><button data-act="dn" data-j="-1"${n <= 1 ? ' disabled' : ''} aria-label="−">−</button><b>${n}</b><button data-act="dn" data-j="1"${n >= 10 ? ' disabled' : ''} aria-label="+">+</button>
    <button class="chip" data-act="dflip" style="min-height:40px">${esc(s.flip)}</button></div>
    <div class="pt-go"><button class="btn ghost pt-btn" data-act="close">${esc(s.back)}</button></div>`;
  lab.setGlow('rgba(232, 185, 78, .3)');
  lab.setReadout(`${fmt(w)} g`, s.darSub(n), s.darPill, '#e8b94e');
  lab.setState({ emo: '🪙', title: s.darT(n), lead: s.darL(fmt(w), fmt(w * DARIC_PURE)), body: s.darB(n), extra: '' });
  lab.setFacts([fact('🏹', s.darF)]);
}
render();
</script>
</body>
