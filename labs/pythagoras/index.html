const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const poly = (c, pts) => { c.beginPath(); pts.forEach(([X, Y], i) => (i ? c.lineTo(X, Y) : c.moveTo(X, Y))); c.closePath(); };
const addPoly = (c, pts) => { pts.forEach(([X, Y], i) => (i ? c.lineTo(X, Y) : c.moveTo(X, Y))); c.closePath(); };
const bounds = (pts) => {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  return [x0, y0, x1, y1];
};
const shade = (hex, k) => { // hex in, rgb() out; k > 0 darker, k < 0 lighter
  const n = parseInt(hex.slice(1), 16), f = k < 0 ? 255 : 0, m = Math.abs(k);
  const mix = (v) => Math.round(v + (f - v) * m);
  return `rgb(${mix((n >> 16) & 255)},${mix((n >> 8) & 255)},${mix(n & 255)})`;
};
const hash = (n) => { n = Math.imul(n ^ (n >>> 15), 1 | n); n ^= n + Math.imul(n ^ (n >>> 7), 61 | n); return ((n ^ (n >>> 14)) >>> 0) / 4294967296; };
const fmtBig = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fmt1 = (x) => String(Math.round(x * 10) / 10);
const cos2 = (a, b, deg) => a * a + b * b - 2 * a * b * Math.cos(deg * Math.PI / 180); // c² for a corner of `deg` degrees
const GOOD = '#3ddc97', WARM = '#ffb84d', ROSE = '#ff7a8a';

// a label on a dark rounded pill, kept inside the canvas
function pill(c, W, H, text, x, y, o = {}) {
  const size = Math.max(12, o.size ?? 13);
  c.save();
  c.font = `800 ${size}px Nunito, sans-serif`;
  const tw = c.measureText(text).width, dot = o.dot ? size * 0.9 : 0, pw = tw + size * 1.1 + dot, ph = size * 1.75;
  const px = clamp(x - pw / 2, 4, Math.max(4, W - 4 - pw)), py = clamp(y - ph / 2, 4, Math.max(4, H - 4 - ph));
  c.fillStyle = o.bg ?? 'rgba(8,16,30,.84)'; c.strokeStyle = o.border ?? 'rgba(160,190,230,.38)'; c.lineWidth = 1;
  c.beginPath(); c.roundRect(px, py, pw, ph, ph / 2); c.fill(); c.stroke();
  if (o.dot) { c.fillStyle = o.dot; c.beginPath(); c.arc(px + size * 0.8, py + ph / 2, size * 0.28, 0, 7); c.fill(); }
  c.fillStyle = o.fg ?? '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText(text, px + size * 0.55 + dot, py + ph / 2 + 0.5);
  c.restore();
  return { x: px, y: py, w: pw, h: ph };
}

function bg(c, w, h) {
  c.fillStyle = '#0f1a2b'; c.fillRect(0, 0, w, h);
  const g = c.createRadialGradient(w * 0.5, h * 0.42, 0, w * 0.5, h * 0.42, Math.max(w, h) * 0.75);
  g.addColorStop(0, 'rgba(46,92,160,.30)'); g.addColorStop(1, 'rgba(15,26,43,0)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = 'rgba(170,200,255,.07)';
  for (let x = 14; x < w; x += 24) for (let y = 14; y < h; y += 24) c.fillRect(x, y, 1.5, 1.5);
}

// --- the glass: shared by the tanks of view 1 and the big square of view 2 --------------------------------------
function glassBase(c, outer, r) { // the thick wall seen from above: a dark slab and a soft shadow
  c.save();
  c.shadowColor = 'rgba(2,8,18,.6)'; c.shadowBlur = r * 4; c.shadowOffsetX = r * 0.9; c.shadowOffsetY = r * 1.8;
  c.fillStyle = '#0b1c30';
  poly(c, outer.map(([x, y]) => [x + r * 0.5, y + r * 0.8])); c.fill();
  c.restore();
}
function innerShade(c, outer, inner, r) { // the walls shade the floor, strongest under the top-left walls
  c.save(); poly(c, inner); c.clip();
  c.shadowColor = 'rgba(2,10,24,.72)'; c.shadowBlur = r * 3.2; c.shadowOffsetX = r * 0.9; c.shadowOffsetY = r * 1.1;
  c.fillStyle = '#000'; c.beginPath(); addPoly(c, outer); addPoly(c, inner); c.fill('evenodd');

function poolGeom(a, b, deg) {

  const cen = [(P[0] + Q[0]) / 3, (P[1] + Q[1]) / 3];

    const dx = V[0] - U[0], dy = V[1] - U[1], L = Math.hypot(dx, dy), ex = [dx / L, dy / L];

    if (S.row >= 0) {
      const [a, b, cc] = TABLET[S.row];
      lab.setReadout(`${fmtBig(a * a)} + ${fmtBig(b * b)} = ${fmtBig(cc * cc)}`, t.tabletRow(a, b, cc), '✓', '#1f9d6e');
    } else lab.setReadout('—', '', '', '#c39358');
    lab.setState({ emo: '🏺', title: t.secrets.a[0], lead: t.secrets.a[1], body: '', extra: '' });
  } else {
    const W = 55 * 16 / Math.hypot(16, 9), H = 55 * 9 / Math.hypot(16, 9);
    lab.setReadout('55″', t.tvLabel(W.toFixed(1), H.toFixed(1)), '16 : 9', '#2a9df4');
    lab.setState({ emo: '📺', title: t.secrets.b[0], lead: t.secrets.b[1], body: '', extra: '' });
  }
}

function renderPools(t) {
  const a = S.a, b = S.b, ang = S.ang, a2 = a * a, b2 = b * b, c2 = cos2(a, b, ang);
  const asking = S.ps === 'ask1' || S.ps === 'ask2', locked = S.ps !== 'free' && S.ps !== 'rev2';
  lab.setGlow('rgba(42, 157, 244, .28)');
  setSl('pyA', t.sideA, a, String(a), locked); setSl('pyB', t.sideB, b, String(b), locked); setSl('pyG', t.angle, ang, `${ang}°`, locked);
  if (S.ps === 'free') setAsk(null);
  else if (S.ps === 'ask1' || S.ps === 'rev1') setAsk({ q: t.ask1, opts: t.opts, guess: S.g1, ok: 0, done: S.ps === 'rev1', rightText: t.right, wrongText: t.wrong });
  else setAsk({ q: t.ask2, opts: t.opts, guess: S.g2, ok: 2, done: S.ps === 'rev2', rightText: t.right, wrongText: t.wrong });
  $('pyPour').textContent = `💧 ${t.pour}`; $('pyEmpty').textContent = t.reset;
  $('pyPour').style.display = S.ps === 'free' || S.ps === 'rev2' ? 'inline-flex' : 'none';
  $('pyEmpty').style.display = S.ps === 'free' || S.ps === 'rev2' || (S.ps === 'rev1' && S.done) ? 'inline-flex' : 'none';
  $('pyEmpty').disabled = S.ps === 'free' && S.pt < 0;
  const res = poolResult();
  if (asking && !S.done) lab.setReadout('?', '', '', '#2a9df4');
  else {
    const val = ang === 90 ? `${a2} + ${b2} = ${a2 + b2}` : `${a2} + ${b2} ≠ ${fmt1(c2)}`;
    const col = res.kind === 'exact' ? '#1f9d6e' : res.kind === 'over' ? '#c97a12' : '#c24560';
    lab.setReadout(val, t.sumsSub, S.done ? poolText(t, res) : '', S.done ? col : '#2a9df4');
  }
  if (S.ps === 'ask1' || S.ps === 'ask2') lab.setState({ emo: '🤔', title: S.ps === 'ask1' ? t.ask1 : t.ask2, lead: '', body: '', extra: '' });
  else if (S.ps === 'rev1') lab.setState({ emo: S.g1 === 0 ? '✅' : '🤔', title: poolText(t, res), lead: S.g1 === 0 ? t.right : t.wrong, body: '', extra: '' });
  else lab.setState({ emo: t.st.pools[0], title: t.st.pools[1], lead: t.st.pools[2], body: t.st.pools[3], extra: '' });
}

function renderCut(t) {
  const a = S.ca, b = S.cb, asked = S.cg !== null, shown = asked && S.cutDone;
  lab.setGlow('rgba(233, 196, 106, .26)');
  setSl('pyCa', t.sideA, a, String(a), false); setSl('pyCb', t.sideB, b, String(b), false);
  if (!asked || S.cutShowAsk) setAsk({ q: t.cutAsk, opts: t.cutOpts, guess: S.cg, ok: 2, done: shown, rightText: t.cutRight, wrongText: t.cutWrong }); else setAsk(null);
  $('pyRe').textContent = `✂️ ${t.rearrange}`;
  $('pyRe').style.display = asked ? 'inline-flex' : 'none';
  if (!asked || !S.cutDone) lab.setReadout('?', '', '', '#2a9df4');
  else lab.setReadout(`c² = ${a * a + b * b}`, '', `a² + b² = ${a * a} + ${b * b} = ${a * a + b * b}`, '#2a9df4');
  if (!asked || !S.cutDone) lab.setState({ emo: '🤔', title: t.cutAsk, lead: '', body: '', extra: '' });
  else lab.setState({ emo: t.st.cut[0], title: t.st.cut[1], lead: t.st.cut[2], body: t.st.cut[3], extra: '' });
}

function renderCity(t) {
  const E = S.E, N = S.N, D = Math.hypot(E, N), Dr = Math.round(D), phase = S.cityPhase, shown = phase === 'shown', locked = phase !== 'shown';
  lab.setGlow('rgba(53, 208, 232, .26)');
  setSl('pyE', t.east, E, `${E} ${t.unit}`, locked); setSl('pyN', t.north, N, `${N} ${t.unit}`, locked);
  if (phase === 'ask' || S.cityShowAsk) setAsk({ q: t.cityAsk, opts: t.cityOpts, guess: S.yg, ok: 1, done: shown, rightText: t.cityRight, wrongText: t.cityWrong }); else setAsk(null);
  lab.setReadout(shown ? `${Dr} ${t.unit}` : '?', shown ? t.straight : '', `${t.streets}: ${E + N} ${t.unit}`, '#c97a12');
  if (!shown) lab.setState({ emo: '🤔', title: t.cityAsk, lead: '', body: '', extra: '' });
  else lab.setState({ emo: t.st.city[0], title: t.st.city[1], lead: t.st.city[2], body: t.st.city[3], extra: '' });
}

canvasLoop($('cv'), frame);
render();
</script>
</body>
