const BASE = [6, 8, 6, 5, 3];            // seconds per car for each step

const soloRate = () => 5 * 3600 / SOLO_T;

function mkSim(mode, ks, o = {}) {
  const s = { mode, ks: ks.slice(), t: 0, made: 0, q: [[], [], [], [], []], ws: [], ship: [], stamps: [], series: [0], nextS: 1, n: 0,
    rot: !!o.rot, nextRot: ROT, rotAt: -9, keep: !!o.keep, on: false, done: false };
  if (mode === 'solo') for (let j = 0; j < 5; j++) s.ws.push({ id: j, ph: -2, wait: j * SOLO_T / 5, rem: 0, car: null });
  else ks.forEach((k, st) => { for (let n = 0; n < k; n++) s.ws.push({ id: s.ws.length, st, to: -1, walk: 0, car: null, rem: 0, tot: 0, carry: 0, nov: 0, tir: 0 }); });
  return s;
}
const newCar = (s) => ({ col: s.n++ % 4, level: 0, t0: -9, from: 0 });
function shipCar(s, car) {
  s.made++; s.stamps.push(s.t); s.ship.push({ t0: rt(), col: car.col });
  if (s.ship.length > 24) s.ship.splice(0, s.ship.length - 24);
  if (s.stamps.length > 3000) s.stamps.splice(0, 1500);
}
function soloStep(s, w, d) {
  if (w.ph === -2) {
    w.wait -= d; if (w.wait > 0) return;
    d = -w.wait;
    if (w.id === 0) { w.ph = 0; w.rem = BASE[0]; w.car = newCar(s); } else { w.ph = -1; w.rem = SW; }
  }
  w.rem -= d;
  while (w.rem <= 0) {
    const carry = -w.rem, p = w.ph;
    if (p === -1) { w.ph = 0; w.car = newCar(s); w.rem = BASE[0] - carry; continue; }
    if (p % 2 === 0) { const i = p / 2; w.car.level = i + 1; if (i === 4) { shipCar(s, w.car); w.car = newCar(s); } }
    w.ph = (p + 1) % 10;
    w.rem = (w.ph % 2 === 0 ? BASE[w.ph / 2] : SW) - carry;
  }
}
const pull = (s, st) => (st === 0 ? newCar(s) : s.q[st].shift() ?? null);
function startJob(s, w) {
  const car = pull(s, w.st); if (!car) { w.carry = 0; return false; }
  w.car = car; w.tot = w.nov > 0 ? BASE[w.st] : stepT(w.st); w.rem = w.tot - w.carry; w.carry = 0;
  return true;
}
function lineStep(s, w, d) {
  w.tir = Math.min(1, w.tir + TIRE / stepT(w.st) * d);
  if (w.walk > 0) { w.walk -= d; if (w.walk > 0) return; w.carry = -w.walk; w.walk = 0; w.st = w.to; w.to = -1; }
  if (!w.car) {
    if (w.to >= 0) { if (w.to !== w.st) { w.walk = SW; w.nov = 1; return; } w.to = -1; }
    if (!startJob(s, w)) return;
  }
  w.rem -= d;
  while (w.car && w.rem <= 0) {
    w.carry = -w.rem;
    const car = w.car; car.level = w.st + 1;
    if (w.st < 4) { car.t0 = rt(); car.from = w.st; s.q[w.st + 1].push(car); } else shipCar(s, car);
    if (w.nov > 0) w.nov--;
    w.car = null; w.rem = 0;
    if (w.to >= 0) break;
    startJob(s, w);
  }
}
function rotate(s) {
  s.nextRot += ROT; s.rotAt = rt();
  const sts = s.ws.map((w) => (w.to >= 0 ? w.to : w.st));
  s.ws.forEach((w, i) => { w.to = sts[(i + 1) % sts.length]; w.tir *= 0.35; });
}
function advance(s, dt) {
  let left = dt, n = 0;
  while (left > 1e-9 && n++ < 2000) {
    const d = Math.min(0.05, left); left -= d; s.t += d;
    if (s.mode === 'solo') s.ws.forEach((w) => soloStep(s, w, d)); else s.ws.forEach((w) => lineStep(s, w, d));
    if (s.rot && s.t >= s.nextRot) rotate(s);
    while (s.t >= s.nextS) { if (s.keep) s.series.push(s.made); s.nextS++; }
  }
}
const measured = (s) => { // cars per hour counted over the last minutes of the model, for the job-rotation secret
  if (s.t < 60) return lineRate(s.ks);
  const win = Math.min(s.t, 240); let n = 0;
  for (let i = s.stamps.length - 1; i >= 0 && s.stamps[i] > s.t - win; i--) n++;
  return n / win * 3600;
};

function drawFloor(c, x, y, w, h) {
  c.save(); rr(c, x, y, w, h, 18); c.clip();

// a toy car at a given stage: 1 cut wood, 2 painted, 3 wheels, 4 windows, 5 in its box
function drawCar(c, x, y, s, level, col) {
  c.save(); c.globalAlpha = 1; c.lineJoin = 'round'; c.lineWidth = 1;
  const cc = CARCOL[col % 4];

    const bw = s * 1.25, bh = s * 0.85, g = c.createLinearGradient(x - bw / 2, y - bh / 2, x + bw / 2, y + bh / 2);

    rr(c, x - bw / 2, y - bh / 2, bw, bh, 2); c.fillStyle = g; c.fill(); c.strokeStyle = '#7a5628'; c.stroke();
    c.fillStyle = '#efdcb0'; c.fillRect(x - 1.3, y - bh / 2, 2.6, bh);
    c.restore(); return;
  }
  const bw = s, bh = s * 0.4, by = y;
  if (level <= 1) {
    const g = c.createLinearGradient(x, by - bh / 2, x, by + bh / 2); g.addColorStop(0, '#eab97c'); g.addColorStop(1, '#c58c4e');
    rr(c, x - bw / 2, by - bh / 2, bw, bh * 1.1, 2); c.fillStyle = g; c.fill(); c.strokeStyle = '#7a4d24'; c.stroke();

  rr(c, x - bw / 2, by - bh / 2, bw, bh, 3); c.fillStyle = g; c.fill(); c.strokeStyle = shade(cc, -0.5); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.4)'; c.fillRect(x - bw * 0.4, by - bh * 0.4, bw * 0.5, 1.2);

}

  const d = drag; drag = null;
  compEl.querySelectorAll('.pf-zone').forEach((e) => e.classList.remove('pf-hot'));
  try { d.el.releasePointerCapture(ev.pointerId); } catch { /* already released */ }
  d.el.classList.remove('pf-drag'); d.el.style.transform = '';
  if (cancel) return;
  if (!d.moved) { S.selC = S.selC === d.i ? null : d.i; sfx.tick(); render(); return; }
  const z = zoneAt(ev.clientX, ev.clientY);
  if (z) place(d.i, z);
};
compEl.addEventListener('pointerup', (ev) => endDrag(ev, false));
compEl.addEventListener('pointercancel', (ev) => endDrag(ev, true));
compEl.addEventListener('click', (ev) => {
  const z = ev.target.closest('.pf-zone'); if (!z || S.selC === null) return;
  place(S.selC, z.dataset.z);
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'start' });
};
function startRun(mode) { S.sims[mode] = mkSim(mode, ONES, { keep: true }); S.mode = mode; S.running = true; }
function restart2() { S.sim2 = mkSim('line', S.ks, { rot: S.sec === 'tired' && S.rotate }); S.sim2.on = S.askedB; }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'optA') {
    S.pickA = i; S.askedA = true; store.set('pf:askedA', true); S.chain = ['line']; startRun('solo'); (i === 0 ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (a === 'optB') {
    S.pickB = i; S.askedB = true; S.revB = false; S.predT = 0; store.set('pf:askedB', true); S.ks[i]++; restart2(); (i === BEST ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (a === 'mode') { if (!S.running) S.mode = b.dataset.m; sfx.click(); }
  else if (a === 'run') { if (!S.running) { S.chain = []; startRun(S.mode); sfx.click(); } }
  else if (a === 'fast') { S.fast = !S.fast; sfx.click(); }
  else if (a === 'reset') {
    if (lab.view === 'workshop') { S.sims = {}; S.running = false; S.chain = []; }
    else { S.ks = ONES.slice(); restart2(); }
    sfx.click();
  } else if (a === 'rot') { S.rotate = !S.rotate; restart2(); sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k === 'a' ? 'pins' : 'tired';
    S.sec = S.sec === k ? null : k; if (k === 'tired') { S.rotate = false; restart2(); }
    sfx.click();
  }
  render();
});
stepsEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const i = +b.dataset.i; S.ks[i] += b.dataset.act === 'inc' ? 1 : -1; restart2(); sfx.tick(); render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, N = S.placed.filter(Boolean).length;
  document.body.dataset.v = v;
  lab.setGlow(v === 'workshop' ? 'rgba(255, 190, 80, .22)' : v === 'bottleneck' ? 'rgba(255, 90, 80, .2)' : 'rgba(120, 150, 230, .24)');
  const tot = S.ks.reduce((a, b) => a + b, 0);
  show(stepsEl, v === 'bottleneck' && S.askedB, 'grid');
  show(compEl, v === 'company', 'flex');
  stepsEl.innerHTML = S.ks.map((k, i) => `<div class="pf-sc"><button class="pf-sb" data-act="inc" data-i="${i}" aria-label="+"${k >= 3 || tot >= 8 ? ' disabled' : ''}>+</button><b>${k}</b><button class="pf-sb" data-act="dec" data-i="${i}" aria-label="−"${k <= 0 || tot <= 5 ? ' disabled' : ''}>−</button></div>`).join('');
  const open = secret.unlocked();
  const secBtn = (k, ch, on) => `<button class="chip pf-c secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}" type="button">${open ? `${ch} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  const chip = (act, i, label) => `<button class="chip pf-c" data-act="${act}" data-i="${i}" type="button">${esc(label)}</button>`;
  const ver = (ok, text, extra = '') => `<div class="pf-ver ${ok ? 'ok' : 'no'}"><b>${esc(ok ? t.right : t.notQuite)}</b> ${esc(text)}${extra}</div>`;
  let h = '';
  if (v === 'workshop') {
    if (!S.askedA) {
      h = `<div class="pf-ask"><div class="pf-q">${esc(t.qMode)}</div><div class="chips">${S.ordA.map((i) => chip('optA', i, t.optsMode[i])).join('')}</div></div>`;
      lab.setReadout('—', t.model, '', '#ffc83d');
      lab.setState({ ...t.stAsk, extra: '' }); lab.setFacts([]);
    } else {
      if (S.pickA !== null) h += ver(S.pickA === 0, t.modeWhy);
      if (S.sec !== 'pins') {
        h += `<div class="chips">${['solo', 'line'].map((m) => `<button class="chip pf-c ${S.mode === m ? 'on' : ''}" data-act="mode" data-m="${m}" type="button"${S.running ? ' disabled' : ''}>${esc(t[m])}</button>`).join('')}</div>
          <div class="row2"><button class="chip pf-c" data-act="run" type="button"${S.running ? ' disabled' : ''}>▶ ${esc(t.run)}</button><button class="chip pf-c ${S.fast ? 'on' : ''}" data-act="fast" type="button">⏩ ×4</button><button class="chip pf-c" data-act="reset" type="button">${esc(t.reset)}</button></div>`;
      }
      h += `<div class="row2">${secBtn('a', '📌', S.sec === 'pins')}</div><div class="pf-note">${esc(t.model)}</div>`;
      if (S.sec === 'pins') {
        roKey = ''; lab.setState({ emo: '📌', title: t.secrets.a[0], lead: t.secrets.a[1], body: t.pinsBody, extra: '' });
      } else {
        lab.setReadout(fmt(S.mode === 'solo' ? soloRate() : lineRate(ONES)), `${t.perHour} · ${t.model}`, t[S.mode], '#ffc83d');
        lab.setState({ ...t.state.workshop, extra: '' });
      }
      lab.setFacts(t.facts.workshop);
    }
  } else if (v === 'bottleneck') {
    const hot = bnecks(S.ks).map((i) => t.steps[STEPS[i]]).join(', ');
    if (!S.askedB) {
      h = `<div class="pf-ask"><div class="pf-q">${esc(t.qExtra)}</div><div class="chips">${S.ordB.map((i) => chip('optB', i, t.steps[STEPS[i]])).join('')}</div></div>`;
      lab.setReadout('—', t.model, '', '#ff5a4f');
      lab.setState({ ...t.stAsk, extra: '' });
    } else {
      if (S.pickB !== null && S.revB) {
        const mk = (p) => lineRate(ONES.map((k, i) => k + (i === p ? 1 : 0)));
        const yours = t.yours(t.steps[STEPS[S.pickB]], fmt(mk(S.pickB))), best = S.pickB === BEST ? '' : `<p>${esc(t.best(t.steps[STEPS[BEST]], fmt(mk(BEST))))}</p>`;
        h += ver(S.pickB === BEST, t.extraWhy, `<p>${esc(yours)}</p>${best}`);
      }
      h += `<div class="row2"><button class="chip pf-c" data-act="reset" type="button">${esc(t.reset)}</button><button class="chip pf-c ${S.fast ? 'on' : ''}" data-act="fast" type="button">⏩ ×4</button>${secBtn('b', '🥱', S.sec === 'tired')}`;
      if (S.sec === 'tired') h += `<button class="chip pf-c ${S.rotate ? 'on' : ''}" data-act="rot" type="button">🔄 ${esc(t.rotate)}</button>`;
      h += `</div><div class="pf-note">${esc(t.model)}</div>`;
      if (S.revB) lab.setReadout(fmt(S.sec === 'tired' ? measured(S.sim2) : lineRate(S.ks)), `${t.perHour} · ${t.model}`, t.bottleneckLine(hot), '#ff5a4f');
      else lab.setReadout('?', t.model, '', '#ff5a4f');
      lab.setState(S.sec === 'tired' ? { emo: '🥱', title: t.secrets.b[0], lead: t.secrets.b[1], body: t.tiredBody, extra: '' } : { ...t.state.bottleneck, extra: '' });
    }
    lab.setFacts(t.facts.bottleneck);
  } else {
    h = `<p class="pf-hint">${esc(t.hintSort)}</p>`;
    renderComp(t);
    lab.setReadout(`${N} / 6`, t.sorted, N === 6 ? t.right : '', '#ffc83d');
    lab.setState({ ...t.state.company, extra: '' }); lab.setFacts(t.facts.company);
  }
  $('ctrlBody').innerHTML = h;
}

// --- the loop: advance the simulations, then draw ------------------------------------------------------------
let roT = 0;
function tick(dt, time) {
  const sp = (S.fast ? 200 : 50) * dt; // 1 simulated minute is 1.2 real seconds (x4 with the fast chip)
  if (S.running) {
    const sim = S.sims[S.mode];
    advance(sim, Math.min(sp, RUN - sim.t));
    if (sim.t >= RUN - 1e-6) {
      sim.done = true; S.running = false;
      if (S.chain.length) startRun(S.chain.shift());
      render();
    }
  }
  if (S.sim2.on && lab.view === 'bottleneck') {
    advance(S.sim2, sp);
    if (!S.revB) { S.predT += sp; if (S.predT >= RUN) { S.revB = true; render(); } }
    if (S.revB && S.sec === 'tired' && time - roT > 0.5) { roT = time; lab.setReadout(fmt(measured(S.sim2)), `${T[lang].perHour} · ${T[lang].model}`, T[lang].bottleneckLine(bnecks(S.ks).map((i) => T[lang].steps[STEPS[i]]).join(', ')), '#ff5a4f'); }
  }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w;
  tick(dt, time);
  const v = lab.view;
  if (v === 'company') return;
  if (v === 'workshop') { if (S.sec === 'pins') drawPins(c, w, h, time); else drawView1(c, w, h, time); }
  else drawView2(c, w, h, time);
});
render();
</script>
