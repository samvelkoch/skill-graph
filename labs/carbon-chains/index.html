    if (S.guess === null) return;
    S.predDone = true; S.pend = false; S.ghost = S.guess; S.n = PRED_N; S.up = true; S.changeAt = now(); S.fresh = true; S.sel = null;
    (Math.abs(S.guess - BP[PRED_N - 1]) <= 20 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.sel = null; S.flip = 0; S.flipA = 0; S.heat = 0; S.heatA = 0; sfx.click();
  } else if (act === 'flip') { S.flip = S.flip ? 0 : 1; sfx.snap(); }
  else if (act === 'turn') { S.turn += 1; sfx.click(); }
  else if (act === 'sg') {
    S.sGuess = b.dataset.v; S.sAt = now(); S.sel = null; (S.sGuess === 'diff' ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'chip') { S.ci = +b.dataset.i; S.sel = null; sfx.tick(); }
  else if (act === 'gg') {
    S.gGuess[S.ci] = b.dataset.v; S.gDone[S.ci] = true; S.gAt[S.ci] = now(); S.sel = null;
    ((b.dataset.v === 'mix') === (S.ci > 0) ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'gnext') {
    if (allDone()) { S.gGuess = [null, null, null]; S.gDone = [false, false, false]; S.ci = 0; }
    else { for (let k = 1; k <= 3; k++) { const j = (S.ci + k) % 3; if (!S.gDone[j]) { S.ci = j; break; } } }
    S.sel = null; sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'gs') { S.guess = +ev.target.value; render(); }
  else if (ev.target.id === 'heat') { S.heat = +ev.target.value / 100; render(); }
});

// --- render: controls, readout and state card for the current view ---------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('s_chain').hidden = v !== 'chain'; $('s_shape').hidden = v !== 'shape'; $('s_group').hidden = v !== 'group';
  if (v === 'chain') renderChain(t); else if (v === 'shape') renderShape(t); else renderGroup(t);
}
const tapNote = () => `<div class="fine">${esc(T[lang].tapTip)}</div>`;
function renderChain(t) {
  lab.setGlow('rgba(110, 150, 230, .26)');
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('ring', '🐍') + sc('urea', '⚗️');
  const inSec = !!S.sec;
  $('stepRow').hidden = inSec || S.pend; $('predRow').hidden = inSec || !S.pend; $('secBox').hidden = !inSec;
  if (inSec) return renderSecret(t);
  const n = S.n, nm = t.names[n - 1], bp = BP[n - 1];
  $('nLbl').textContent = t.c.nC(n); $('remB').disabled = n <= 1; $('remB').setAttribute('aria-label', t.c.rem);
  $('addB').textContent = n >= 6 ? t.c.max : t.c.add; $('addB').disabled = n >= 6;
  if (S.pend) {
    $('predQ').textContent = t.c.pq; $('gv').textContent = S.guess === null ? t.c.noGuess : t.c.guess(fmtN(S.guess)); $('chkB').textContent = t.c.check; $('chkB').disabled = S.guess === null;
    if (S.guess !== null) $('gs').value = S.guess;
  }
  lab.setReadout(subf(n, 2 * n + 2), t.c.sub(n, nm), t.bp(fmtN(bp)), '#7fb4ff');
  const rows = []; for (let i = 0; i < n; i++) rows.push(`<tr class="${i === n - 1 ? 'cur' : ''}"><td>${i + 1}</td><td>${esc(t.names[i])}</td><td>${subf(i + 1, 2 * i + 4)}</td><td>${fmtN(BP[i])}</td></tr>`);
  const table = `<table class="cc-tab"><tr>${t.c.head.map((x) => `<th>${esc(x)}</th>`).join('')}</tr>${rows.join('')}</table>`;
  let st;
  if (S.pend) st = { emo: '🤔', title: t.c.pq, lead: t.c.plead, body: '' };
  else if (S.fresh && n === PRED_N) {
    const d = Math.abs(S.ghost - bp), ok = d <= 20;
    st = { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: ok ? t.c.vOk(bp) : t.c.vNo(bp, d), body: bp < ROOM ? t.c.gas : t.c.liq };
  } else st = { emo: '⛓️', title: nm[0].toUpperCase() + nm.slice(1), lead: t.c.lead(n), body: bp < ROOM ? t.c.gas : t.c.liq };
  lab.setState({ ...st, extra: table + tapNote() });
  lab.setFacts(S.predDone ? [t.facts.organic, t.facts.pentane] : [t.facts.organic]);
}
function renderSecret(t) {
  const ring = S.sec === 'ring', bk = `${S.sec}|${lang}`;
  if (S.boxFor !== bk) { // built once per secret and language, so the slider keeps its drag
    S.boxFor = bk;
    $('secBox').innerHTML = ring
      ? `<div class="cc-row"><button class="btn" data-act="flip">${esc(t.sec.flip)}</button><button class="chip" data-act="sec" data-k="ring">${esc(t.sec.back)}</button></div>`
      : `<div class="cc-q" id="heatL"></div><input id="heat" class="big" type="range" min="0" max="100" step="1" value="${Math.round(S.heat * 100)}" aria-label="${esc(t.sec.heat)}">
         <div class="cc-row"><button class="chip" data-act="sec" data-k="urea">${esc(t.sec.back)}</button></div>`;
  }
  if (!ring) $('heatL').textContent = `${t.sec.heat}: ${Math.round(lerp(20, 60, S.heat))} °C`;
  if (ring) {
    lab.setReadout(subf(6, 6), t.sec.benz, '', '#4fae6a'); lab.setGlow('rgba(79, 174, 106, .26)');
    lab.setState({ emo: '🐍', title: t.sec.ringT, lead: t.sec.ringL, body: t.sec.ringB, extra: tapNote() });
    lab.setFacts([t.facts.snake, t.facts.benz]);
  } else {
    const done = S.heat >= 0.5;
    lab.setReadout(subf(1, 4, 1).replace('CH<sub>4</sub>O', 'CH<sub>4</sub>N<sub>2</sub>O'), done ? t.sec.nb : t.sec.na, `${Math.round(lerp(20, 60, S.heat))} °C`, '#ffb067'); lab.setGlow('rgba(255, 176, 103, .24)');
    lab.setState(done ? { emo: '⚗️', title: t.sec.ureaT2, lead: t.sec.ureaL2, body: t.sec.ureaB, extra: tapNote() } : { emo: '🧂', title: t.sec.ureaT1, lead: t.sec.ureaL1, body: '', extra: tapNote() });
    lab.setFacts(done ? [t.facts.wohler, t.facts.myth] : [t.facts.wohler]);
  }
}
function renderShape(t) {
  lab.setGlow('rgba(197, 139, 255, .22)');
  const rev = S.sGuess !== null;
  $('shPred').hidden = rev; $('sgSame').textContent = t.s.same; $('sgDiff').textContent = t.s.diff; $('turnB').textContent = t.turn;
  lab.setReadout(subf(4, 10), rev ? `${t.s.a} · ${t.s.b}` : 'A · B', rev ? `${fmtN(BUT_BP)} / ${fmtN(ISO_BP)} °C` : '', '#c58bff');
  if (!rev) lab.setState({ emo: '🤔', title: t.s.q, lead: t.s.lead, body: '', extra: tapNote() });
  else {
    const ok = S.sGuess === 'diff';
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: `${t.s.right} ${t.s.lead2(fmtN(BUT_BP), fmtN(ISO_BP))}`, body: t.s.why, extra: tapNote() });
  }
  lab.setFacts(rev ? [t.facts.kekule, t.facts.branch] : [t.facts.kekule]);
}
function renderGroup(t) {
  lab.setGlow('rgba(255, 176, 103, .22)');
  const i = S.ci, nm = t.g.names[i], done = S.gDone[i], ok = done && ((S.gGuess[i] === 'mix') === (i > 0));
  $('gChips').innerHTML = t.g.names.map((x, j) => `<button class="chip ${j === i ? 'on' : ''}" data-act="chip" data-i="${j}"><span class="cc-dot" style="background:${COLG[j]}"></span>${S.gDone[j] ? (((S.gGuess[j] === 'mix') === (j > 0)) ? '✓ ' : '✗ ') : ''}${esc(x)}</button>`).join('');
  $('gPred').hidden = done; $('gNextRow').hidden = !done;
  $('ggMix').textContent = t.g.mixes; $('ggApart').textContent = t.g.apart; $('gNext').textContent = allDone() ? t.g.again : t.g.next;
  const fm = [subf(2, 6), subf(2, 6, 1), subf(2, 4, 2)][i];
  lab.setReadout(fm, nm, done ? t.bp(fmtN(GBP[i])) : '', COLG[i]);
  if (!done) lab.setState({ emo: '🧪', title: t.g.q(nm), lead: t.g.lead, body: '', extra: tapNote() });
  else lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: t.g.why[i], body: allDone() ? t.g.done : '', extra: tapNote() });
  lab.setFacts(S.gDone.some(Boolean) ? [t.facts.oh, t.facts.wohler] : [t.facts.wohler]);
}
render();
</script>
