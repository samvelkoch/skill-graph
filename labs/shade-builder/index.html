// --- model -----------------------------------------------------------------------------------------------
// Side view of a sandpit. Light is a fraction `tau` that a roof lets through (the order net > thin cloth > leaves > cardboard
// is real; the exact shares are illustrative and never shown). The roof's shadow on the ground is its two ends projected along
// the Sun's rays: x_ground = x + height * cot(Sun height angle). Warmth never drops below the air temperature (0.15).
const W = 360, H = 300, GY = 170, YB = 246, PX = 180, HR = 92;
const TAU = { none: 1, net: 0.55, cloth: 0.35, leaf: 0.12, card: 0.02, thick: 0.03 };
const SURF = { sand: 0.85, white: 0.55, dark: 1 };
const AIR = 0.15;
const warmOf = (light, surf = SURF.sand) => AIR + (1 - AIR) * light * surf;
const levelOf = (w) => (w > 0.75 ? 0 : w > 0.5 ? 1 : w > 0.3 ? 2 : 3);
const ROOFEMO = { none: '☀️', net: '🕸️', cloth: '🏳️', leaf: '🌿', card: '📦' };
const KID_AT = (i, n) => PX + (i - (n - 1) / 2) * 66;

const S = { p1: null, p2: null, roof: 'none', rays: false, sec: null, sheet: 'white', t: 0.5, tT: null, tx: PX, txT: PX, tilt: 0,
  done: { m: false, n: false, e: false }, moved: false, w3: 80, kids: 3, ok3: false, heat: { t: 0.87, k: [0.87, 0.87, 0.87] }, key: '', doneAll: false };
const gated = () => lab.view !== 'build' && S.p1 === null;

const hex2 = (n) => Math.round(clamp(n, 0, 255)).toString(16).padStart(2, '0');
const mixHex = (a, b, k) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return '#' + A.map((x, i) => hex2(x + (B[i] - x) * k)).join(''); };
const heatCol = (w) => mixHex('#4ea8ff', '#ff4a3a', clamp((w - AIR) / 0.75, 0, 1));
const rnd = (i, k) => { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); };

function scene(tm) {
  const v = lab.view, g = gated();
  let kind = 'none', t = 0.5, tilt = 0, a = 50;
  if (v === 'build') kind = S.sec ? 'none' : S.roof;
  else if (!g) { kind = 'thick'; if (v === 'day') { t = S.t; tilt = S.tilt * Math.PI / 12; a = 42; } else a = S.w3 / 2; }
  const phi = Math.PI * (0.2 + 0.6 * t), cot = Math.cos(phi) / Math.sin(phi), dh = Math.sin(tilt) * a, dx = Math.cos(tilt) * a;
  const L = { x: PX - dx, h: HR - dh }, R = { x: PX + dx, h: HR + dh };
  const sh = kind === 'none' ? null : [Math.min(L.x + L.h * cot, R.x + R.h * cot), Math.max(L.x + L.h * cot, R.x + R.h * cot)];
  const cloud = v === 'build' && S.sec === 'cloud' ? -100 + ((tm * 55) % 560) : null;
  const cov1 = (x) => (sh ? clamp(0.5 + Math.min(x - sh[0], sh[1] - x) / 10, 0, 1) : 0);
  const covX = (x) => (cov1(x - 10) + cov1(x) + cov1(x + 10)) / 3;
  const cloudCov = (x) => (cloud === null ? 0 : clamp(0.5 + Math.min(x - (cloud - 75), cloud + 75 - x) / 20, 0, 1));
  const lightX = (x) => (1 - covX(x) * (1 - TAU[kind])) * (1 - cloudCov(x) * (1 - 0.3));
  const o = { v, g, kind, t, phi, cot, tilt, a, L, R, sh, cloud, kids: null, teddy: null };
  if (v === 'build' || v === 'day') {
    const x = v === 'day' ? S.tx : PX, light = lightX(x), surf = v === 'build' && S.sec === 'sheet' ? SURF[S.sheet] : SURF.sand, warm = warmOf(light, surf);
    o.teddy = { x, light, cov: covX(x), warm, level: levelOf(warm), inShade: covX(x) >= 0.85, surf };
  }
  if (v === 'size') {
    o.kids = Array.from({ length: S.kids }, (_, i) => { const x = KID_AT(i, S.kids), light = lightX(x), warm = warmOf(light); return { x, light, warm, level: levelOf(warm), inShade: covX(x) >= 0.85 }; });
  }
  return o;
}

const rr = (c, x, y, w, h, r) => { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };

const rgr = (c, x0, y0, r0, x1, y1, r1, stops) => { const g = c.createRadialGradient(x0, y0, Math.max(0, r0), x1, y1, Math.max(0, r1)); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const SKY = [['#8fc3f0', '#ffd9ac'], ['#3f9cf0', '#c4e8ff'], ['#7b8ccf', '#ffb487']];
const skyAt = (t) => { const a = t < 0.5 ? 0 : 1, k = t < 0.5 ? t * 2 : t * 2 - 1; return [mixHex(SKY[a][0], SKY[a + 1][0], k), mixHex(SKY[a][1], SKY[a + 1][1], k)]; };

function paintBackground(c, ex, ey, sc, tm) {

  const low = 1 - Math.sin(sc.phi), core = mixHex('#fff6c2', '#ffb347', low), rim = mixHex('#ffd447', '#ff8a3a', low);

canvasLoop($('cv'), (c, w, h, dt, tm) => {
  // easing of the time, the teddy and the thermometers
  if (S.tT !== null) { S.t += (S.tT - S.t) * (1 - Math.exp(-dt * 3.2)); if (Math.abs(S.tT - S.t) < 0.003) { S.t = S.tT; S.tT = null; } }
  S.tx += (S.txT - S.tx) * (1 - Math.exp(-dt * 9)); if (Math.abs(S.txT - S.tx) < 0.2) S.tx = S.txT;
  const sc = scene(tm), k = 1 - Math.exp(-dt * 2.2);
  if (sc.teddy) S.heat.t += (sc.teddy.warm - S.heat.t) * k;
  if (sc.kids) sc.kids.forEach((kd, i) => { S.heat.k[i] += (kd.warm - S.heat.k[i]) * k; });
  // task progress
  if (sc.v === 'day' && !sc.g && S.p2 !== null && sc.teddy.inShade) {
    const d = S.done, was = d.m + d.n + d.e;
    if (Math.abs(sc.t - 0.5) > 0.12) S.moved = true;
    if (sc.t <= 0.2) d.m = true; if (S.moved && Math.abs(sc.t - 0.5) <= 0.06) d.n = true; if (sc.t >= 0.92) d.e = true;
    if (d.m + d.n + d.e > was) { (d.m && d.n && d.e ? sfx.good : sfx.snap)(); }
  }
  if (sc.v === 'size' && sc.kids.length === 3 && sc.kids.every((kd) => kd.inShade) && !S.ok3) { S.ok3 = true; sfx.good(); }
  const key = [sc.v, sc.g, S.p1, S.p2, sc.teddy ? sc.teddy.level + (sc.teddy.inShade ? 's' : 'o') : '', sc.kids ? sc.kids.map((kd) => kd.level + (kd.inShade ? 's' : 'o')).join('') : '', sc.v === 'day' ? (S.tT === null) + phaseOf(sc.t) + [+S.done.m, +S.done.n, +S.done.e].join('') : ''].join('|');
  if (key !== S.key) { S.key = key; render(); }
  if (S.tT !== null && sc.v === 'day') { const el = $('sbTime'); if (el && Math.abs(+el.value - S.t * 100) > 0.6) el.value = String(Math.round(S.t * 100)); }

  // paint, scaled to fit the design box
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2, ex = ox / s, ey = oy / s;
  G = { sc: s, ox, oy };
  c.save(); c.translate(ox, oy); c.scale(s, s);
  paintBackground(c, ex, ey, sc, tm);
