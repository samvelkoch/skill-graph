const G = 2, RW = 0.22, HTOP = 14, SP = 0.9, ST = 0.3, A_TRACK = -0.30, ROLL = Math.PI / 2 + A_TRACK;

function railLayout(w, h) {
  const m = w < 520 ? 26 : 34;
  const g = clamp(Math.min(w, h) * 0.21, 42, 84), PPU = g / G;
  const half = Math.min((w / 2 - m) / Math.abs(Math.cos(A_TRACK)), (h / 2 - m) / Math.abs(Math.sin(A_TRACK)));
  return { w, h, m, g, PPU, half, ZH: Math.max(3, (half - 36) / PPU), ext: half / PPU + 1.2, cx: w / 2, cy: h / 2 };
}
// the view from straight above: world (X across, Z along the track) -> stage pixels (X > 0 is the upper-left side of the track)
function topPt(L, X, Z) {
  const x = -L.PPU * X, y = -L.PPU * Z, ca = Math.cos(ROLL), sa = Math.sin(ROLL);
  return [L.cx + x * ca - y * sa, L.cy + x * sa + y * ca];
}
function topInv(L, sx, sy) {
  const dx = sx - L.cx, dy = sy - L.cy, ca = Math.cos(-ROLL), sa = Math.sin(-ROLL);
  return [-(dx * ca - dy * sa) / L.PPU, -(dx * sa + dy * ca) / L.PPU];
}
function railCam(L, p) {
  const e = ease(p), phi = lerp(0.12, Math.PI / 2, e), F = L.PPU * HTOP;
  return { e, phi, sp: Math.sin(phi), cp: Math.cos(phi), hc: lerp(1.15, HTOP, e), cz: lerp(-3.2, 0, e), F, cx: L.cx,
    cy: lerp(L.h * 0.44 + F * Math.tan(0.12), L.cy, e), roll: ROLL * e };
}
function proj(k, X, Z) {
  const zr = Z - k.cz, yc = -k.hc * k.cp + zr * k.sp, zc = k.hc * k.sp + zr * k.cp;
  return [k.cx - k.F * X / zc, k.cy - k.F * yc / zc, zc];
}
function quadP(c, k, pts) {
  c.beginPath();

  c.closePath();
}

  rails(0, xs - 34, gl); rails(xs + 34, w, gr);
  // buffer stops
  c.fillStyle = RED; c.fillRect(xs - 38, cy - gl / 2 - 5, 7, gl + 10); c.fillRect(xs + 31, cy - gr / 2 - 5, 7, gr + 10);
  // timeline
  const xStop = xs - 44 - WL / 2, xNew = xs + 44 + WL / 2;
  let wx, lift = 0, craneX = xs, bumped = 0;
  if (tt < 4) wx = lerp(-WL, xStop, easeOut(tt / 4));
  else if (tt < 5.6) { const u = (tt - 4) / 1.6; wx = xStop + 14 * Math.sin(u * Math.PI); bumped = Math.sin(u * Math.PI); }
  else if (tt < 7.2) wx = xStop;
  else if (tt < 9.6) wx = lerp(xStop, xNew, ease((tt - 7.2) / 2.4));
  else if (tt < 11) wx = xNew;
  else wx = lerp(xNew, w + WL, ease((tt - 11) / 3));
  if (tt < 5.6) craneX = xs; else if (tt < 6.4) craneX = lerp(xs, xStop, ease((tt - 5.6) / 0.8));
  else if (tt < 7.2) craneX = xStop; else if (tt < 9.6) craneX = wx; else craneX = lerp(xNew, xs, ease((tt - 9.6) / 1.4));
  if (tt >= 6.4 && tt < 7.2) lift = ease((tt - 6.4) / 0.8); else if (tt >= 7.2 && tt < 9.6) lift = 1; else if (tt >= 9.6 && tt < 10.4) lift = 1 - ease((tt - 9.6) / 0.8);
  // wheel sets
  const wheelset = (x, g, alpha, tint) => {
    c.save(); c.globalAlpha = alpha;
    for (const dx of [-WL * 0.3, WL * 0.3]) {
      c.fillStyle = '#2B3138'; c.fillRect(x + dx - 3, cy - g / 2, 6, g);
      for (const s of [-1, 1]) { c.fillStyle = tint || '#4A525C'; rrect(c, x + dx - 9, cy + s * g / 2 - 4, 18, 8, 3); c.fill(); c.strokeStyle = '#14181D'; c.lineWidth = 1; c.stroke(); }
    }
    c.restore();
  };
  const oldX = tt < 6.4 ? wx : xStop, oldA = tt > 11 ? clamp01(1 - (tt - 11)) : 1;
  const newMoves = tt >= 10.4, newX = newMoves ? wx : xNew, newA = tt > 14 ? clamp01((tt - 14) / 1.5) : 1;
  wheelset(oldX, gl, oldA);
  wheelset(newX, gr, tt > 14 || tt < 11 || newMoves ? newA : 1);
  if (tt >= 4 && tt < 6) { // the wheels do not fit the wider track
    c.save(); c.globalAlpha = 0.6 + 0.4 * Math.sin(tt * 16);
    c.strokeStyle = RED; c.lineWidth = 3; c.lineCap = 'round';
    for (const s of [-1, 1]) { const y = cy + s * gr / 2, x = xs + 52; c.beginPath(); c.moveTo(x - 9, y - 9); c.lineTo(x + 9, y + 9); c.moveTo(x + 9, y - 9); c.lineTo(x - 9, y + 9); c.stroke(); }
    c.restore();
  }
  // wagon body
  const sc = 1 + 0.1 * lift;
  c.save(); c.translate(wx, cy); c.scale(sc, sc);
  c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 6 + 18 * lift; c.shadowOffsetY = 3 + 22 * lift;
  const bgx = c.createLinearGradient(0, -WW / 2, 0, WW / 2); bgx.addColorStop(0, '#C7584A'); bgx.addColorStop(0.5, '#A8402F'); bgx.addColorStop(1, '#7E2E22');
  c.fillStyle = bgx; rrect(c, -WL / 2, -WW / 2, WL, WW, 6); c.fill();
  c.shadowBlur = 0; c.shadowColor = 'transparent'; c.shadowOffsetY = 0;
  c.strokeStyle = 'rgba(30,8,4,.7)'; c.lineWidth = 1.2; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 1.5; c.beginPath();
  for (let x = -WL / 2 + 14; x < WL / 2 - 8; x += 16) { c.moveTo(x, -WW / 2 + 3); c.lineTo(x, WW / 2 - 3); }
  c.stroke();
  c.fillStyle = 'rgba(255,255,255,.18)'; rrect(c, -WL / 2 + 4, -WW / 2 + 3, WL - 8, 3, 1.5); c.fill();
  c.restore();
  // crane: runways along both sides, a bridge across the track and cables to the wagon
  const cyTop = cy - gr / 2 - 48, cyBot = cy + gr / 2 + 48;
  c.strokeStyle = 'rgba(20,28,34,.55)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, cyTop); c.lineTo(w, cyTop); c.moveTo(0, cyBot); c.lineTo(w, cyBot); c.stroke();
  c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 8; c.shadowOffsetX = 3 + 6 * lift; c.shadowOffsetY = 3 + 6 * lift;
  const cg = c.createLinearGradient(craneX - 6, 0, craneX + 6, 0); cg.addColorStop(0, shade(YEL, 0.3)); cg.addColorStop(1, shade(YEL, -0.3));
  c.fillStyle = cg; c.fillRect(craneX - 6, cyTop - 6, 12, cyBot - cyTop + 12);
  c.restore();
  c.fillStyle = '#2B3138'; c.fillRect(craneX - 9, cyTop - 9, 18, 12); c.fillRect(craneX - 9, cyBot - 3, 18, 12);
  if (lift > 0) {
    c.strokeStyle = 'rgba(20,24,28,.8)'; c.lineWidth = 1.5; c.beginPath();
    for (const [dx, dy] of [[-WL * 0.4, -WW * 0.4], [-WL * 0.4, WW * 0.4], [WL * 0.4, -WW * 0.4], [WL * 0.4, WW * 0.4]]) { c.moveTo(craneX, cy); c.lineTo(wx + dx * sc, cy + dy * sc); }
    c.stroke();
    c.fillStyle = '#2B3138'; c.beginPath(); c.arc(craneX, cy, 7, 0, 7); c.fill(); c.strokeStyle = YEL; c.lineWidth = 2; c.stroke();
  }
  // gauge brackets and labels
  for (const [x, g, txt, col] of [[xs * 0.5, gl, '1435 mm', GREEN], [xs + (w - xs) * 0.55, gr, '1520 mm', YEL]]) {
    c.strokeStyle = col; c.lineWidth = 2; c.beginPath(); c.moveTo(x, cy - g / 2 + 5); c.lineTo(x, cy + g / 2 - 5); c.stroke();
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(x, cy + s * (g / 2 - 5)); c.lineTo(x - 4, cy + s * (g / 2 - 11)); c.moveTo(x, cy + s * (g / 2 - 5)); c.lineTo(x + 4, cy + s * (g / 2 - 11)); c.stroke(); }
    tag(c, txt, x, cy - g / 2 - 62, w, h, col, 14);
  }
  c.restore();
}

function globePt(lat, lon, rot, tilt) {
  const x = Math.cos(lat) * Math.sin(lon + rot), y = Math.sin(lat), z = Math.cos(lat) * Math.cos(lon + rot);
  return [x, y * Math.cos(tilt) - z * Math.sin(tilt), y * Math.sin(tilt) + z * Math.cos(tilt)];
}
function drawGlobe(c, w, h, time) {
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.37, rot = (time - S.secT0) * 0.4, tilt = 0.42, kind = S.r.kind;
  c.save(); rrect(c, 0, 0, w, h, 18); c.clip();
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#12202B'); bg.addColorStop(1, '#0B151D'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const rnd = rng(3); c.fillStyle = 'rgba(255,255,255,.5)';
  for (let i = 0; i < 40; i++) { c.globalAlpha = 0.2 + rnd() * 0.5; c.fillRect(rnd() * w, rnd() * h, 1.4, 1.4); }
  c.globalAlpha = 1;
  const halo = c.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 1.25); halo.addColorStop(0, 'rgba(110,190,255,.35)'); halo.addColorStop(1, 'rgba(110,190,255,0)');
  c.fillStyle = halo; c.beginPath(); c.arc(cx, cy, R * 1.25, 0, 7); c.fill();
  const sg = c.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R);
  sg.addColorStop(0, '#4A9AD0'); sg.addColorStop(0.6, '#255F8C'); sg.addColorStop(1, '#0E3452');
  c.fillStyle = sg; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.fill();
  const line = (pts, col, lw) => {
    c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.beginPath();
    let pen = false;
    for (const p of pts) {
      if (p[2] <= 0) { pen = false; continue; }
      const sx = cx + R * p[0], sy = cy - R * p[1];
      if (pen) c.lineTo(sx, sy); else { c.moveTo(sx, sy); pen = true; }
    }
    c.stroke();
  };
  const latOn = kind === 'lat', lonOn = kind === 'lon';
  const latCol = latOn ? TEAL : rgba('#E6EBF0', lonOn ? 0.18 : 0.5), lonCol = lonOn ? YEL : rgba('#E6EBF0', latOn ? 0.18 : 0.5);
  for (const la of [-60, -30, 0, 30, 60]) {
    const pts = []; for (let lo = 0; lo <= 360; lo += 5) pts.push(globePt(la * D, lo * D, rot, tilt));
    if (latOn) { c.save(); c.shadowColor = TEAL; c.shadowBlur = 10; line(pts, latCol, 3); c.restore(); } else line(pts, latCol, 1.4);
  }
  for (let lo = 0; lo < 360; lo += 30) {
    const pts = []; for (let la = -90; la <= 90; la += 4) pts.push(globePt(la * D, lo * D, rot, tilt));
    if (lonOn) { c.save(); c.shadowColor = YEL; c.shadowBlur = 10; line(pts, lonCol, 3); c.restore(); } else line(pts, lonCol, 1.4);
  }
  for (const la of [90, -90]) {
    const p = globePt(la * D, 0, rot, tilt);
    if (p[2] > 0) {
      const sx = cx + R * p[0], sy = cy - R * p[1], on = lonOn;
      c.save(); c.shadowColor = YEL; c.shadowBlur = on ? 16 : 0; c.fillStyle = on ? YEL : rgba('#E6EBF0', 0.6); c.beginPath(); c.arc(sx, sy, on ? 6 : 3.5, 0, 7); c.fill(); c.restore();
    }
  }
  // soft terminator for volume
  const sh = c.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.4, cx, cy, R * 1.02);
  sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,10,20,.55)'); c.fillStyle = sh; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.fill();
  if (kind) tag(c, T[lang].sec[kind === 'lat' ? 'lat' : 'lon'], cx, cy + R + 26, w, h, kind === 'lat' ? TEAL : YEL, 14);
  c.restore();
}

// --- the one loop -------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  c.fillStyle = BG; rrect(c, 0, 0, w, h, 18); c.fill();
  if (v === 'rails') {
    if (S.r.step === 'free' && S.r.sec === 'gauge') { handle.style.display = 'none'; drawGauge(c, w, h, time); }
    else if (S.r.step === 'free' && S.r.sec === 'globe') { handle.style.display = 'none'; drawGlobe(c, w, h, time); }
    else drawRails(c, w, h, time);
  } else {
    handle.style.display = 'none';
    if (v === 'corner') drawCorner(c, w, h, time); else drawFind(c, w, h, time);
  }
});

// =================================================================================================================
// controls
// =================================================================================================================
function qa(t, q, opts, right, pick, done, text, nextLabel, nextAct) {
  const asked = pick !== null;
  let html = `<div class="pl-qt">${esc(q)}</div><div class="pl-os">${opts.map((o, i) =>
    `<button class="pl-o ${asked ? (i === right ? 'ok' : i === pick ? 'no' : 'dim') : ''}" data-pick="${i}"${asked ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
  if (asked) html += `<div class="pl-v ${pick === right ? 'ok' : 'no'}">${esc(pick === right ? t.right : t.wrong)}</div>`;
  if (asked && done) html += `<p class="pl-tx">${esc(text)}</p><button class="btn" data-act="${nextAct}">${esc(nextLabel)}</button>`;
  return html;
}
const stateOf = (arr) => ({ emo: arr[0], title: arr[1], lead: arr[2], body: arr[3], extra: '' });

function railsReadout() {
  const t = T[lang], R = S.r;
  lab.setGlow('rgba(61, 214, 198, .24)');
  if (R.step === 'free' && R.sec === 'gauge') return lab.setReadout('1435 · 1520', 'mm', '', TEAL);
  if (R.step === 'free' && R.sec === 'globe') return lab.setReadout('🌐', R.kind ? t.sec[R.kind] : '', '', TEAL);
  if (R.step === 'free') {
    const info = freeInfo(stageLayout());
    return lab.setReadout(t.r.gaps(info.a.toFixed(1), info.b.toFixed(1)), info.par ? t.r.para : t.r.notPara, info.par ? t.r.para : info.meet ? '' : t.r.far, TEAL);
  }
  if ((R.step === 'a1' || R.step === 'a2') && R.done) return lab.setReadout(t.r.gaps('1.0', '1.0'), t.r.para, t.r.para, TEAL);
  lab.setReadout('?', '', '', TEAL);
}
function renderRails(t) {
  const R = S.r, body = $('plBody');
  if (R.step === 'q1') body.innerHTML = qa(t, t.r.q1, t.r.o1, 1, null, false, '', '', '');
  else if (R.step === 'a1') body.innerHTML = qa(t, t.r.q1, t.r.o1, 1, R.pick, R.done, t.r.r1, t.next, 'next');
  else if (R.step === 'q2') body.innerHTML = qa(t, t.r.q2, t.r.o2, 0, null, false, '', '', '');
  else if (R.step === 'a2') body.innerHTML = qa(t, t.r.q2, t.r.o2, 0, R.pick, R.done, t.r.r2, t.next, 'next');
  else {
    const open = secret.unlocked();
    const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${R.sec === k ? 'on' : ''}" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    body.innerHTML = `${R.sec ? '' : `<div class="pl-hint">${esc(t.r.drag)}</div>`}
      <div class="row2" style="margin-top:2px"><div class="chips">${sc('gauge', '🚆')}${sc('globe', '🌐')}<button class="chip" data-act="again">${esc(t.again)}</button></div></div>
      ${R.sec === 'globe' ? `<div class="row2"><div class="chips">${['lat', 'lon'].map((k) => `<button class="chip ${R.kind === k ? 'on' : ''}" data-g="${k}">${esc(t.sec[k])}</button>`).join('')}</div></div>` : ''}`;
  }
  railsReadout();
  let st;
  if (R.step === 'free' && R.sec) st = { emo: R.sec === 'gauge' ? '🚆' : '🌐', title: t.secrets[R.sec][0], lead: t.sec[R.sec + 'Text'], body: '', extra: '' };
  else st = stateOf((R.step === 'free' || (R.step === 'a2' && R.done)) ? t.st.rails.f : t.st.rails.n);
  lab.setState(st);
}

const C_RIGHT = [0, 1, 0];
function renderCorner(t) {
  const C = S.c, body = $('plBody');
  lab.setGlow('rgba(255, 209, 102, .2)');
  if (C.i === 0) body.innerHTML = qa(t, t.c.q1, t.c.o1, 1, C.pick, C.done, t.c.r1, t.next, 'cnext');
  else body.innerHTML = qa(t, t.c.q, t.c.o, C_RIGHT[C.i - 1], C.pick, C.done, t.c.why[C.i - 1], C.i < 3 ? t.next : t.again, C.i < 3 ? 'cnext' : 'cagain');
  lab.setReadout(C.pick !== null && C.done ? (C.i === 0 ? '90°' : ROUNDS[C.i - 1].angle) : '?', '', '', YEL);
  lab.setState(stateOf(C.i === 3 && C.done ? t.st.corner.f : t.st.corner.n));
}
const F_RIGHT = [2, 0, 1];
function renderFind(t) {
  const F = S.f, body = $('plBody');
  lab.setGlow('rgba(61, 214, 198, .22)');
  if (!F.free) {
    body.innerHTML = qa(t, t.f.q, t.f.o, F_RIGHT[F.i], F.pick, F.doneFlag, t.f.why[F.i], t.next, 'fnext');
    const lt = LET[QS_LETTERS[F.i]];
    lab.setReadout(F.doneFlag ? `${lt.par.length ? '∥' : ''}${lt.par.length && lt.sq.length ? ' ' : ''}${lt.sq.length ? '∟' : ''}` : '?', '', '', TEAL);
    lab.setState(stateOf(F.i === 2 && F.doneFlag ? t.st.find.f : t.st.find.n));
  } else {
    body.innerHTML = `<div class="row2" style="margin-top:0"><span class="lbl">${esc(t.f.more)}</span><div class="chips">${FREE_LETTERS.map((l) =>
      `<button class="chip ${F.letter === l ? 'on' : ''}" data-letter="${l}">${l}</button>`).join('')}<button class="chip" data-act="fagain">${esc(t.again)}</button></div></div>`;
    const lt = LET[F.letter];
    lab.setReadout(`${lt.par.length ? '∥' : ''}${lt.par.length && lt.sq.length ? ' ' : ''}${lt.sq.length ? '∟' : ''}`, '', '', TEAL);
    lab.setState(stateOf(t.st.find.f));
  }
}
function render() {
  const t = T[lang], v = lab.view;
  handle.setAttribute('aria-label', t.r.drag);
  if (v === 'rails') renderRails(t); else if (v === 'corner') renderCorner(t); else renderFind(t);
}

function resetRails() {
  Object.assign(S.r, { step: 'q1', pick: null, done: false, p: 1, cam: null, rev: null, dashK: 0, zEnd: 900, zA: null, dn: 0, sec: null, kind: null });
}
function pick(i) {
  const v = lab.view, ok = (r) => (i === r ? sfx.good() : sfx.bad());
  if (v === 'rails') {
    const R = S.r;
    if (R.step === 'q1') { R.pick = i; R.step = 'a1'; R.done = false; R.rev = { k: 1, t0: now() }; ok(1); }
    else if (R.step === 'q2') { R.pick = i; R.step = 'a2'; R.done = false; R.cam = { a: 0, b: 1, t0: now(), d: 1.8 }; R.rev = { k: 2, t0: now() + 1.8 }; ok(0); }
    else return;
  } else if (v === 'corner') {
    const C = S.c; if (C.pick !== null) return;
    C.pick = i; C.done = false; C.snapped = false; C.rev = { t0: now() }; ok(C.i === 0 ? 1 : C_RIGHT[C.i - 1]);
  } else {
    const F = S.f; if (F.pick !== null || F.free) return;
    F.pick = i; F.done = true; F.doneFlag = false; F.ticked = {}; F.t0 = now(); ok(F_RIGHT[F.i]);
  }
  render(); showStage();
}
function act(a) {
  sfx.click();
  const R = S.r, C = S.c, F = S.f;
  if (a === 'next') {
    if (R.step === 'a1') { R.step = 'q2'; R.pick = null; R.done = false; R.rev = null; R.dashK = 0; R.cam = { a: 1, b: 0, t0: now(), d: 1.1 }; }
    else if (R.step === 'a2') { R.step = 'free'; R.pick = null; R.rev = null; R.dn = 0; R.dashK = 1; R.zA = { t0: now() }; R.sec = null; R.kind = null; handle.classList.add('idle'); }
  } else if (a === 'again') resetRails();
  else if (a === 'cnext') { C.i++; C.pick = null; C.done = false; C.rev = null; }
  else if (a === 'cagain') Object.assign(C, { i: 0, pick: null, done: false, rev: null });
  else if (a === 'fnext') {
    if (F.i < 2) { F.i++; F.pick = null; F.done = false; F.doneFlag = false; } else { F.free = true; F.letter = 'E'; F.t0 = now(); F.ticked = {}; }
  } else if (a === 'fagain') Object.assign(F, { i: 0, pick: null, done: false, doneFlag: false, free: false });
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.pick !== undefined) return pick(+b.dataset.pick);
  if (b.dataset.act) return act(b.dataset.act);
  if (b.dataset.k) {
    if (!secret.unlocked()) return secret.open();
    const R = S.r; R.sec = R.sec === b.dataset.k ? null : b.dataset.k; R.kind = null; S.secT0 = now(); sfx.click(); render(); showStage(); return;
  }
  if (b.dataset.g) { const R = S.r; R.kind = R.kind === b.dataset.g ? null : b.dataset.g; sfx.tick(); render(); return; }
  if (b.dataset.letter) { const F = S.f; F.letter = b.dataset.letter; F.t0 = now(); F.ticked = {}; sfx.click(); render(); }
});

// dragging the far end of the upper rail
let dragging = false, snapped = true;
function setTilt(dn, L) {
  const R = S.r; dn = clamp(dn, -0.8, 0.8);
  const near = Math.abs(dn) * L.g < 7;
  if (near) { dn = 0; if (!snapped) sfx.tick(); }
  snapped = near;
  R.dn = dn; railsReadout();
}
handle.addEventListener('pointerdown', (ev) => { dragging = true; handle.setPointerCapture(ev.pointerId); handle.classList.remove('idle'); ev.preventDefault(); });
handle.addEventListener('pointermove', (ev) => {
  if (!dragging) return;
  const r = $('stage').getBoundingClientRect(), L = railLayout(r.width, r.height), [X] = topInv(L, ev.clientX - r.left, ev.clientY - r.top);
  setTilt((X - G / 2) / G, L);
});
const endDrag = () => { dragging = false; };
handle.addEventListener('pointerup', endDrag); handle.addEventListener('pointercancel', endDrag);
handle.addEventListener('keydown', (ev) => {
  const d = ev.key === 'ArrowRight' || ev.key === 'ArrowUp' ? 0.05 : ev.key === 'ArrowLeft' || ev.key === 'ArrowDown' ? -0.05 : 0;
  if (!d) return;
  ev.preventDefault(); handle.classList.remove('idle');
  const L = stageLayout(); setTilt(S.r.dn + d, L);
});
render();
</script>
