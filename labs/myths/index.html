  ring(c, 'thunder', 88, 66, 46, time); ring(c, 'rainbow', 285, 124, 30, time); ring(c, 'winter', 200, 104, 40, time);
  // the god's medallion
  const k = S.ph && S.seen[S.ph] ? S.ph : null;
  if (k) {
    const [mx, my] = MED[k], pop = outBack((time - S.revT) / 0.55);
    c.save(); c.translate(mx, my); c.scale(Math.max(0.01, pop), Math.max(0.01, pop));
    const mg = c.createRadialGradient(-6, -8, 2, 0, 0, 26); mg.addColorStop(0, '#3a4487'); mg.addColorStop(1, '#171c45');
    c.shadowColor = 'rgba(255,214,120,.7)'; c.shadowBlur = 16; c.fillStyle = mg; c.beginPath(); c.arc(0, 0, 25, 0, TAU); c.fill(); c.shadowBlur = 0;
    c.strokeStyle = '#f0c970'; c.lineWidth = 2.4; c.stroke(); c.scale(1.1, 1.1); EMB[PEOPLE[k][S.pi[k]]](c); c.restore();
  }
  c.restore();
  if (fl > 0) { c.fillStyle = `rgba(225,235,255,${0.34 * fl * fl})`; c.fillRect(0, 0, w, h); }
  if (k) pill(c, w, t.ppl[PEOPLE[k][S.pi[k]]].name, ox + MED[k][0] * s, oy + (MED[k][1] + 38) * s, '#ffe2a8', 14);
}

// --- sorting picture -----------------------------------------------------------------------------------------------
let geoS = null;
function drawSort(c, w, h, dt, time) {
  const t = T[lang], i = S.ci, end = i >= 5, card = CARDS[Math.min(i, 4)], tc = t.cards[card.id], P = t.sort;
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#141a3a'); g.addColorStop(1, '#2a3266');
  c.fillStyle = g; c.fillRect(0, 0, w, h); stars(c, w, h * 0.6, time, 0.5);
  const x0 = 58, x1 = w - 58, ty = h - 86, mid = (x0 + x1) / 2;
  geoS = { x0, x1, y: ty };
  for (let k = 0; k < 5; k++) {
    c.fillStyle = k < i ? (S.res[k] ? '#3ddc97' : '#f5c84c') : k === i && !end ? '#fff' : 'rgba(255,255,255,.22)';
    c.beginPath(); c.arc(w / 2 + (k - 2) * 20, 16, 5, 0, TAU); c.fill();
  }
  // the card
  const avail = ty - 34 - 34, ch = clamp(avail, 80, 150), cw = Math.min(w - 80, 240), cy0 = 34 + Math.max(0, (avail - ch) / 2);
  if (!end) {
    const pop = outBack((time - S.cardT) / 0.45);
    c.save(); c.translate(w / 2, cy0 + ch / 2); c.scale(Math.max(0.01, pop), Math.max(0.01, pop));
    const cg = c.createLinearGradient(0, -ch / 2, 0, ch / 2); cg.addColorStop(0, '#3e4a90'); cg.addColorStop(1, '#222a5c');
    c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 16; c.shadowOffsetY = 6; c.fillStyle = cg; c.beginPath(); c.roundRect(-cw / 2, -ch / 2, cw, ch, 18); c.fill();
    c.shadowBlur = 0; c.shadowOffsetY = 0; c.strokeStyle = '#f0c970'; c.lineWidth = 2; c.stroke();
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.font = `${Math.round(Math.min(52, ch * 0.4))}px sans-serif`; c.fillText(card.emo, 0, -ch * 0.16);
    c.font = '500 24px "EB Garamond", Georgia, serif'; c.fillText(tc.name, 0, ch * 0.28, cw - 20);
    c.restore();
  } else {
    const k = S.res.filter(Boolean).length;
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#ffd98a'; c.font = '500 54px "EB Garamond", Georgia, serif'; c.fillText(`${k}/5`, w / 2, cy0 + ch * 0.3);
    CARDS.forEach((cd, j) => {
      const x = w / 2 + (j - 2) * 46, y = cy0 + ch * 0.72;
      c.fillStyle = 'rgba(255,255,255,.08)'; c.beginPath(); c.arc(x, y, 19, 0, TAU); c.fill();
      c.strokeStyle = S.res[j] ? '#3ddc97' : '#f5c84c'; c.lineWidth = 3; c.stroke();
      c.fillStyle = '#fff'; c.font = '20px sans-serif'; c.fillText(cd.emo, x, y + 1);
    });
  }
  // the scale
  c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 10; c.shadowOffsetY = 3;
  const tg = c.createLinearGradient(x0, 0, x1, 0); tg.addColorStop(0, '#4f9d8f'); tg.addColorStop(0.5, '#7188b4'); tg.addColorStop(1, '#8d7ad8');
  c.fillStyle = tg; c.beginPath(); c.roundRect(x0 - 14, ty - 8, x1 - x0 + 28, 16, 8); c.fill(); c.restore();
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x0 - 6, ty - 3); c.lineTo(x1 + 6, ty - 3); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.5)'; for (let k = 1; k < 8; k++) { c.beginPath(); c.arc(lerp(x0, x1, k / 8), ty + 3, 1.4, 0, TAU); c.fill(); }
  // end icons: a tower for legends, a stormy sky for myths
  c.save(); c.translate(26, ty + 2);
  const tgd = c.createLinearGradient(-9, 0, 9, 0); tgd.addColorStop(0, '#d6dae8'); tgd.addColorStop(1, '#8c93b0');
  c.fillStyle = tgd; c.beginPath(); c.roundRect(-9, -26, 18, 32, 2); c.fill();
  c.fillStyle = '#b9bfd6'; [-9, -3, 3].forEach((x) => c.fillRect(x, -31, 6, 6));
  c.fillStyle = '#4a4a6a'; c.beginPath(); c.roundRect(-3, -4, 6, 10, [3, 3, 0, 0]); c.fill();
  c.strokeStyle = '#d6dae8'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, -31); c.lineTo(0, -42); c.stroke();
  c.fillStyle = '#e5484d'; c.beginPath(); c.moveTo(0, -42); c.quadraticCurveTo(7, -41, 11, -38); c.quadraticCurveTo(6, -36, 0, -36); c.fill(); c.restore();
  c.save(); c.translate(w - 26, ty);
  c.fillStyle = '#aeb8e8'; [[-9, -12, 8], [0, -17, 10], [10, -12, 8]].forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); });
  c.translate(1, 8); c.scale(0.9, 0.9); EMB.zeus(c); c.restore();
  // labels
  c.textBaseline = 'alphabetic'; c.textAlign = 'left'; c.font = '800 15px Nunito, sans-serif'; c.fillStyle = '#8fd6c8'; c.fillText(P.legendT, 14, ty + 30);
  c.textAlign = 'right'; c.fillStyle = '#c1b2f2'; c.fillText(P.mythT, w - 14, ty + 30);
  c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#c6cde0';
  wrap(c, P.legendD, w / 2 - 26).slice(0, 3).forEach((ln, j) => { c.textAlign = 'left'; c.fillText(ln, 14, ty + 46 + j * 14); });
  wrap(c, P.mythD, w / 2 - 26).slice(0, 3).forEach((ln, j) => { c.textAlign = 'right'; c.fillText(ln, w - 14, ty + 46 + j * 14); });
  if (end) return;
  // where it really belongs, only after the child has placed it
  const ok = S.res[i];
  if (S.placed) {
    const zx = card.kind === 'myth' ? mid : x0 - 18, zw = card.kind === 'myth' ? x1 + 18 - mid : mid - x0 + 18, a = sm((time - S.revT) / 0.4);
    c.fillStyle = `rgba(61,220,151,${0.28 * a})`; c.beginPath(); c.roundRect(zx, ty - 28, zw, 56, 28); c.fill();
    c.strokeStyle = `rgba(61,220,151,${0.85 * a})`; c.lineWidth = 2; c.stroke();
    c.globalAlpha = a; pill(c, w, `${ok ? '✓' : '✗'} ${card.kind === 'myth' ? P.mythT : P.legendT}`, zx + zw / 2, ty - 46, ok ? '#3ddc97' : '#f5c84c', 13); c.globalAlpha = 1;
  }
  // the token
  const px = lerp(x0, x1, S.pos);
  if (!S.placed) {
    c.fillStyle = '#fff'; c.font = '900 22px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.globalAlpha = 0.85;
    c.fillText('‹', px - 33, ty - 1); c.fillText('›', px + 33, ty - 1); c.globalAlpha = 1;
    if (!S.moved) { c.strokeStyle = '#fff'; c.lineWidth = 2; c.globalAlpha = 0.5 - 0.3 * Math.sin(time * 4); c.beginPath(); c.arc(px, ty, 25 + 3 * Math.sin(time * 4), 0, TAU); c.stroke(); c.globalAlpha = 1; }
  }
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 10; c.shadowOffsetY = 3;
  const kg = c.createRadialGradient(px - 6, ty - 8, 2, px, ty, 22); kg.addColorStop(0, '#fff3c6'); kg.addColorStop(1, '#e0a93f');
  c.fillStyle = kg; c.beginPath(); c.arc(px, ty, 21, 0, TAU); c.fill(); c.restore();
  c.strokeStyle = S.placed ? (ok ? '#3ddc97' : '#f5c84c') : '#fff'; c.lineWidth = 3; c.beginPath(); c.arc(px, ty, 21, 0, TAU); c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '22px sans-serif'; c.fillStyle = '#fff'; c.fillText(card.emo, px, ty + 1);
}

// --- shell ---------------------------------------------------------------------------------------------------------
const lab = shell({ key: 'myths', T, topics: TOPICS, views: ['nat', 'sort', 'make'], onLang: render, onView: () => { S.sec = null; render(); } });
const secret = secretLab('myths', () => ({
  secrets: [{ emo: '🌊', title: T[lang].secrets.flood[0], desc: T[lang].secrets.flood[1] }, { emo: '🗣️', title: T[lang].secrets.words[0], desc: T[lang].secrets.words[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="secNat">
    <div class="chips" id="phChips"></div>
    <div id="pred"></div>
    <div id="peeps"></div>
  </div>
  <div id="secSort">
    <div class="row2" style="margin-top:0"><button class="mf-sb" data-act="mv" data-d="-1" aria-label="◀">◀</button><button class="mf-sb" data-act="mv" data-d="1" aria-label="▶">▶</button><button class="btn mf-push" data-act="main" id="sMain"></button></div>
    <div class="ends" style="margin-top:12px;margin-bottom:0"><span id="sEndL"></span><span id="sEndR"></span></div>
  </div>
  <div id="secMake">
    <div class="row2" style="margin-top:0"><span class="lbl mf-lbl" id="lS"></span><div class="chips" id="cS"></div></div>
    <div class="row2"><span class="lbl mf-lbl" id="lW"></span><div class="chips" id="cW"></div></div>
    <div class="row2"><span class="lbl mf-lbl" id="lR"></span><div class="chips" id="cR"></div></div>
    <div class="row2"><button class="btn" data-act="sci" id="sciB"></button></div>
  </div>
  <div id="secPanel" class="mf-sec" hidden><div class="chips" id="panelChips"></div></div>
  <div class="row2" id="secRow"></div>`;

// --- input ---------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const showCtrl = () => { const r = $('ctrl').getBoundingClientRect(); if (r.bottom > innerHeight) $('ctrl').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
function selectPh(k) {
  S.ph = k; sfx.click();
  if (k === 'thunder') S.flashT = now();
  render(); showCtrl();
}
function answer(pos) {
  const k = S.ph; if (!k || S.seen[k]) return;
  const opt = PERM[k][pos];
  S.pick[k] = opt; S.seen[k] = true; S.revT = now();
  if (k === 'thunder') S.flashT = now();
  (opt === 0 ? sfx.good : sfx.tick)();
  render(); showStage();
}
function sortMain() {
  if (S.ci >= 5) { S.ci = 0; S.res = []; S.placed = false; S.moved = false; S.pos = 0.5; S.cardT = now(); sfx.click(); return; }
  if (!S.placed) {
    if (!S.moved) return;
    const ok = (CARDS[S.ci].kind === 'myth') === (S.pos >= 0.5);
    S.res[S.ci] = ok; S.placed = true; S.revT = now(); (ok ? sfx.good : sfx.bad)(); showStage();
  } else { S.ci++; S.placed = false; S.moved = false; S.pos = 0.5; S.cardT = now(); sfx.click(); }
}
const setPos = (clientX) => {
  if (!geoS) return;
  const r = $('cv').getBoundingClientRect();
  S.pos = clamp((clientX - r.left - geoS.x0) / (geoS.x1 - geoS.x0), 0, 1); S.moved = true; render();
};
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const r = $('cv').getBoundingClientRect(), v = lab.view;
  if (v === 'nat') {
    const { s, ox, oy } = G(r.width, r.height), k = hit((ev.clientX - r.left - ox) / s, (ev.clientY - r.top - oy) / s);
    if (k) selectPh(k);
  } else if (v === 'sort' && !S.placed && S.ci < 5 && geoS && Math.abs(ev.clientY - r.top - geoS.y) < 48) {
    S.drag = true; try { $('cv').setPointerCapture(ev.pointerId); } catch { /* not supported */ }
    setPos(ev.clientX);
  }
});
$('cv').addEventListener('pointermove', (ev) => { if (S.drag) setPos(ev.clientX); });
['pointerup', 'pointercancel'].forEach((e) => $('cv').addEventListener(e, () => { S.drag = false; }));
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, d = b.dataset;
  if (act === 'ph') return selectPh(d.k);
  if (act === 'opt') return answer(+d.i);
  if (act === 'ppl') { S.pi[S.ph] = +d.i; S.revT = now(); sfx.tick(); }
  else if (act === 'mv') { let p = S.pos + 0.1 * +d.d; if (Math.abs(p - 0.5) < 1e-6) p += 0.1 * +d.d; S.pos = clamp(p, 0, 1); S.moved = true; sfx.tick(); }
  else if (act === 'main') sortMain();
  else if (act === 'subj') { S.subj = +d.i; S.sci = false; sfx.click(); }
  else if (act === 'who') { S.who = +d.i; sfx.click(); }
  else if (act === 'why') { S.why = +d.i; sfx.click(); }
  else if (act === 'sci') { S.sci = true; sfx.good(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === d.k ? null : d.k; sfx.click();
  } else if (act === 'fl') { S.fl = +d.i; sfx.tick(); }
  else if (act === 'wd') { S.wd = +d.i; sfx.tick(); }
  render();
});

// --- one render per change: controls, readout and the state card ------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = v;
  $('secNat').hidden = v !== 'nat' || !!S.sec;
  $('secSort').hidden = v !== 'sort' || !!S.sec;
  $('secMake').hidden = v !== 'make' || !!S.sec;
  $('secPanel').hidden = !S.sec;
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('flood', '🌊') + sc('words', '🗣️');
  if (S.sec) renderSecret(t);
  else if (v === 'nat') renderNat(t);
  else if (v === 'sort') renderSort(t);
  else renderMake(t);
}
function renderSecret(t) {
  if (S.sec === 'flood') {
    const f = t.flood;
    lab.setGlow('rgba(95, 143, 208, .26)');
    $('panelChips').innerHTML = f.n.map((n, i) => `<button class="chip${S.fl === i ? ' on' : ''}" data-act="fl" data-i="${i}">${esc(n)}</button>`).join('');
    lab.setReadout(`${S.fl + 1}/5`, f.sub, f.pill, '#5f8fd0');
    lab.setState({ emo: '🌊', title: f.title, lead: f.line[S.fl], body: f.lead, extra: '' });
    lab.setFacts(factsOf('flood'));
  } else {
    const wd = t.words;
    lab.setGlow('rgba(217, 130, 95, .26)');
    $('panelChips').innerHTML = wd.n.map((n, i) => `<button class="chip${S.wd === i ? ' on' : ''}" data-act="wd" data-i="${i}">${esc(n)}</button>`).join('');
    lab.setReadout(wd.n[S.wd], wd.sub, wd.pill, '#d9825f');
    lab.setState({ emo: S.wd ? '😱' : '🗣️', title: wd.n[S.wd], lead: wd.lead[S.wd], body: '', extra: '' });
    lab.setFacts(factsOf(S.wd ? 'wPanic' : 'wEcho'));
  }
}
function renderNat(t) {
  const N = t.nat, k = S.ph, done = PH.filter((x) => S.seen[x]).length, revealed = !!(k && S.seen[k]);
  lab.setGlow('rgba(232, 185, 87, .24)');
  $('phChips').innerHTML = PH.map((x) => `<button class="chip${S.ph === x ? ' on' : ''}" data-act="ph" data-k="${x}">${esc(N.chips[x])}${S.seen[x] ? ' ✓' : ''}</button>`).join('');
  if (!k) {
    $('pred').innerHTML = ''; $('peeps').innerHTML = '';
    lab.setReadout(`${done}/3`, N.sub, '', '#e8b957');
    lab.setState({ emo: '👆', title: N.tapT, lead: N.tapL, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const pick = S.pick[k];
  $('pred').innerHTML = `<div class="mf-q">${esc(N.ask[k])}</div><div class="mf-opts">${PERM[k].map((o, pos) => {
    const cls = revealed ? `${o === 0 ? ' good' : ''}${o === pick ? ' pick' : ''}` : '';
    return `<button class="mf-opt${cls}" data-act="opt" data-i="${pos}"${revealed ? ' disabled' : ''}>${revealed && o === 0 ? '✓ ' : ''}${esc(N.opts[k][o])}</button>`;
  }).join('')}</div>${revealed ? `<div class="mf-fb"><b>${esc(pick === 0 ? N.right : N.wrong)}</b>${esc(N.fb[pick])}</div>` : ''}`;
  if (!revealed) {
    $('peeps').innerHTML = '';
    lab.setReadout(`${done}/3`, N.sub, '', '#e8b957');
    lab.setState({ emo: '🤔', title: N.ask[k], lead: '', body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const ids = PEOPLE[k], p = t.ppl[ids[S.pi[k]]];
  $('peeps').innerHTML = ids.length > 1 ? `<div class="row2" style="margin-top:0"><span class="lbl">${esc(N.whose)}</span><div class="chips">${ids.map((id, i) => `<button class="chip${S.pi[k] === i ? ' on' : ''}" data-act="ppl" data-i="${i}">${esc(t.ppl[id].tag)}</button>`).join('')}</div></div>` : '';
  lab.setReadout(`${done}/3`, N.sub, p.tag, '#e8b957');
  lab.setState({ emo: p.emo, title: p.title, lead: p.text, body: '', extra: '' });
  lab.setFacts(factsOf(k));
}
function renderSort(t) {
  const P = t.sort, i = S.ci, end = i >= 5, card = CARDS[Math.min(i, 4)], tc = t.cards[card.id], k = S.res.filter(Boolean).length;
  lab.setGlow('rgba(141, 122, 216, .26)');
  $('sEndL').textContent = `◀ ${P.defL}`; $('sEndR').textContent = `${P.defM} ▶`;
  document.querySelectorAll('#secSort .mf-sb').forEach((b) => { b.disabled = S.placed || end; });
  const main = $('sMain');
  main.textContent = end ? P.again : S.placed ? P.next : P.place; main.disabled = !end && !S.placed && !S.moved;
  if (end) {
    lab.setReadout(`${k}/5`, P.subEnd, '', '#8d7ad8');
    lab.setState({ emo: '🏆', title: P.endT(k), lead: P.endL, body: '', extra: '' }); lab.setFacts([]);
  } else if (!S.placed) {
    lab.setReadout(`${i}/5`, P.sub, '', '#8d7ad8');
    lab.setState({ emo: card.emo, title: P.title(tc.name), lead: tc.clue, body: P.hint, extra: '' }); lab.setFacts([]);
  } else {
    const ok = S.res[i];
    lab.setReadout(`${i + 1}/5`, P.sub, ok ? P.right : P.wrong, '#8d7ad8');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? P.right : `${P.wrong} ${P.kindIs[card.kind]}`, lead: tc.why, body: ok ? P.kindIs[card.kind] : '', extra: '' });
    lab.setFacts(factsOf(card.id));
  }
}
function renderMake(t) {
  const M = t.make, sj = SUBJ[S.subj], w = WHO[S.who], y = WHY[S.why];
  lab.setGlow('rgba(95, 168, 160, .26)');
  $('lS').textContent = M.lblS; $('lW').textContent = M.lblW; $('lR').textContent = M.lblR;
  const chips = (list, key, cur, act) => list.map((x, i) => `<button class="chip${cur === i ? ' on' : ''}" data-act="${act}" data-i="${i}">${esc(M[key][x])}</button>`).join('');
  $('cS').innerHTML = chips(SUBJ, 'subj', S.subj, 'subj'); $('cW').innerHTML = chips(WHO, 'who', S.who, 'who'); $('cR').innerHTML = chips(WHY, 'why', S.why, 'why');
  $('sciB').textContent = M.sciBtn; $('sciB').hidden = S.sci;
  lab.setReadout(M.short[sj], `${noEmo(M.who[w])} · ${noEmo(M.why[y])}`, M.pill, '#5fa8a0');
  lab.setState({ emo: '✍️', title: M.q[sj], lead: M.build(sj, w, y).join(' '), body: S.sci ? `${M.sciK}: ${M.sci[sj]}` : '', extra: S.sci ? `<div class="fine">${esc(M.both)}</div>` : '' });
  lab.setFacts(factsOf(sj));
}

// --- the picture loop --------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec === 'flood') return sceneFlood(c, w, h, dt, time);
  if (S.sec === 'words') return S.wd ? scenePanic(c, w, h, time) : sceneEcho(c, w, h, time, 0);
  const v = lab.view;
  if (v === 'nat') drawNat(c, w, h, dt, time);
  else if (v === 'sort') drawSort(c, w, h, dt, time);
  else [sceneEcho, sceneMoon, sceneSea][S.subj](c, w, h, time, S.who);
});
render();
</script>
</body>
