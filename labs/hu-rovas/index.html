  return `<button class="hr-o${cl}" data-q="${j}"${pick === null ? '' : ' disabled'}>${esc(o)}</button>`;
}).join('')}</div>`;
const verdict = (t, good, text) => `<div class="hr-verdict" style="color:${good ? 'var(--ok)' : 'var(--wip)'}">${esc(good ? t.right : t.wrong)}</div><p class="hr-text">${esc(text)}</p>`;
const goBtn = (act, label) => `<button class="btn hr-go" data-act="${act}">${esc(label)}</button>`;

$('ctrlBody').addEventListener('click', (ev) => {
  const v = lab.view, b = ev.target.closest('[data-q], [data-act], [data-sec]'); if (!b) return;
  if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; sfx.click(); return render();
  }
  const j = b.dataset.q === undefined ? -1 : +b.dataset.q, act = b.dataset.act;
  if (v === 'family') {
    const f = S.f;
    if (j >= 0 && f.a1 === null) { f.a1 = j; (j === 1 ? sfx.good : sfx.bad)(); showStage(); }
    else if (j >= 0 && f.cards && f.a2 === null) { f.a2 = j; (j === 1 ? sfx.good : sfx.bad)(); showStage(); }
    else if (act === 'next') { f.cards = true; S.sec = null; sfx.click(); }
    else if (act === 'again') { S.f = freshF(); S.sec = null; sfx.click(); }
  } else if (v === 'rovas') {
    const R = S.r;
    if (j >= 0 && R.a === null) { R.a = j; (j === 1 ? sfx.good : sfx.bad)(); startCarve('magyar'); showStage(); }
  } else {
    const L = S.l;
    if (j >= 0 && L.a === null) { L.a = j; L.ph = 'qfly'; L.A = { t0: clock(), kind: 'q', target: 0 }; (j === 0 ? sfx.good : sfx.bad)(); showStage(); }
    else if (act === 'next') { if (L.ph === 'res') L.i++; L.ph = 'sort'; sfx.click(); }
    else if (act === 'again') { S.l = freshL(); sfx.click(); }
  }
  render();
});
$('carveB').addEventListener('click', () => { if (startCarve($('nm').value)) { sfx.click(); showStage(); render(); } else sfx.bad(); });
$('nm').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); $('carveB').click(); } });
$('overlay').addEventListener('click', (ev) => { if (ev.target.closest('.hr-x')) { S.sec = null; sfx.click(); render(); } });

// --- one render per change ------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], x = X[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secRow').style.display = v === 'family' ? '' : 'none';
  $('carveRow').style.display = v === 'rovas' && S.r.a !== null && fontOk !== false ? '' : 'none';
  $('nm').placeholder = t.r.input; $('nm').setAttribute('aria-label', t.r.input); $('carveB').textContent = t.r.carve;
  const open = secret.unlocked();
  $('secChips').innerHTML = [['nikols', '📜'], ['numbers', '🔢']].map(([k, e]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const panel = (id, on, html) => { const el = $(id); el.classList.toggle('on', on); if (on && html !== undefined) el.innerHTML = html; };
  const f = S.f, r = S.r, L = S.l;
  let full = false, val = '?', col = '#D9A93E', glow = 'rgba(217, 169, 62, .26)', qa = '';
  panel('hr-cards', false); panel('hr-bub', false); panel('hr-sp', false);
  $('hr-pills').style.display = 'none'; $('hr-msg').textContent = '';
  if (v === 'family') {
    if (f.a1 === null) qa = qBlock(t.f.q1, t.f.o1, null, 1);
    else if (!f.cards) qa = qBlock(t.f.q1, t.f.o1, f.a1, 1) + verdict(t, f.a1 === 1, t.f.r1) + goBtn('next', t.next);
    else if (f.a2 === null) qa = qBlock(t.f.q2, t.f.o2, null, 1);
    else qa = qBlock(t.f.q2, t.f.o2, f.a2, 1) + verdict(t, f.a2 === 1, t.f.r2) + goBtn('again', t.again);
    val = f.cards || f.a2 !== null ? '2/2' : '1/2';
    full = f.a2 !== null;
    const cards = ROWS.map(([e, a, b, c2], i) => `<div class="hr-wc-row" style="animation-delay:${i * .12}s"><span class="e">${e}</span><span class="hr-tile">${a}</span><span class="hr-tile">${b}</span><span class="hr-tile">${c2}</span></div>`).join('');
    if (S.sec === 'nikols') panel('hr-sp', true, nikolsHTML(t, x));
    else if (S.sec === 'numbers') panel('hr-sp', true, numbersHTML(t, x));
    else if (f.cards && f.a2 === null) panel('hr-cards', true, `<div class="hr-wc-h">${esc(t.f.cards)}</div><div class="hr-wc-cols"><i></i><b>magyar</b><b>finn</b><b>észt</b></div>${cards}`);
    else if (f.a2 !== null) panel('hr-bub', true, bubblesHTML(t, x));
  } else if (v === 'rovas') {
    col = '#B07A45'; glow = 'rgba(176, 122, 69, .3)';
    qa = r.a === null ? qBlock(t.r.q, t.r.o, null, 1) : qBlock(t.r.q, t.r.o, r.a, 1) + verdict(t, r.a === 1, t.r.r);
    val = r.a === null ? '?' : esc(r.word);
    full = r.a !== null;
    if (fontOk === false) $('hr-msg').textContent = t.r.nofont;
    if (r.carve && fontOk !== false) {
      $('hr-pills').style.display = '';
      if (S.pk !== `${r.nonce}${lang}`) { S.pk = `${r.nonce}${lang}`; $('hr-pills').innerHTML = r.carve.pills.map((p) => (p.gap ? '<span class="hr-gap"></span>' : `<span class="hr-pill" style="animation-delay:${p.delay}s">${esc(p.txt)}</span>`)).join(''); }
    }
  } else {
    col = '#5F93C2'; glow = 'rgba(95, 147, 194, .3)';
    const ph = L.ph;
    val = ph === 'q' || ph === 'qfly' || ph === 'qdone' ? '0/10' : `${L.solved}/10`;
    if (ph === 'q') qa = qBlock(t.l.q, t.l.o, null, 0);
    else if (ph === 'qfly') qa = qBlock(t.l.q, t.l.o, L.a, 0) + verdict(t, L.a === 0, t.l.r);
    else if (ph === 'qdone') qa = qBlock(t.l.q, t.l.o, L.a, 0) + verdict(t, L.a === 0, t.l.r) + goBtn('next', t.next);
    else if (ph === 'sort' || ph === 'busy') qa = `<p class="hr-text">${esc(x.tap)}</p>`;
    else if (ph === 'res') qa = verdict(t, L.ok, t.l.why[L.i]) + goBtn('next', t.next);
    else qa = `<p class="hr-text">${esc(t.l.sum)}</p>` + goBtn('again', t.again);
    full = ph === 'sum';
  }
  $('qa').innerHTML = qa;
  lab.setReadout(val, '', '', col); lab.setGlow(glow);
  const [emo, title, lead] = X[lang].st[full ? 'f' : 'n'][{ family: 'family', rovas: 'rovas', loan: 'loan' }[v]];
  lab.setState({ emo, title, lead, body: '', extra: v === 'family' ? '' : `<div class="fine">${esc(t.fine)}</div>` });
}

const ROWS = [['✋', 'kéz', 'käsi', 'käsi'], ['💧', 'víz', 'vesi', 'vesi'], ['🐟', 'hal', 'kala', 'kala'], ['🩸', 'vér', 'veri', 'veri'], ['🪨', 'kő', 'kivi', 'kivi']];
const closeX = (x) => `<button class="hr-x" aria-label="${esc(x.close)}">✕</button>`;
function bubblesHTML(t, x) {
  return `<div class="hr-bub">
    <div class="hr-say"><div class="hr-who"><span>🧑</span>${esc(t.lang.magyar)}</div><div class="hr-bubble"><span class="k">Viz</span>et iszom.${x.gloss ? `<small>${esc(x.gloss)}</small>` : ''}</div></div>
    <div class="hr-say r"><div class="hr-who"><span>🧑‍🦰</span>${esc(t.lang.finn)}</div><div class="hr-bubble">Juon <span class="k">vet</span>tä.${x.gloss ? `<small>${esc(x.gloss)}</small>` : ''}</div></div></div>`;
}
const NIK = ['a', 'á', 'b', 'c', 'cs', 'd', 'dz', 'dzs', 'e', 'é', 'f', 'g', 'gy', 'h', 'i', 'í', 'j', 'k', 'l', 'ly', 'm', 'n', 'ny', 'o', 'ó', 'ö', 'ő', 'p', 'r', 's', 'sz', 't', 'ty', 'u', 'ú', 'ü', 'v', 'z', 'zs'];
function nikolsHTML(t, x) {
  if (fontOk === false) return `${closeX(x)}<p class="hr-pt">${esc(t.r.nofont)}</p>`;
  const cell = (k, i) => `<div class="hr-nc${RUNE[k].length > 2 || k === 'ü' ? ' w2' : ''}" style="animation-delay:${i * .03}s"><i>${RUNE[k]}</i><b>${k === 'ü' ? 'ü ű' : k}</b></div>`;
  return `${closeX(x)}<div class="hr-nik">${NIK.map(cell).join('')}</div><p class="hr-pt">${esc(t.sec.nikolsText)}</p>`;
}
const NUMS = [[2, 'kettő', 'kaksi', 'kaks'], [3, 'három', 'kolme', 'kolm'], [4, 'négy', 'neljä', 'neli'], [6, 'hat', 'kuusi', 'kuus']];
const fold = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
function numbersHTML(t, x) {
  const rows = NUMS.map(([n, ...ws], r) => {
    const tiles = ws.map((wd, i) => { // a letter glows gold when another word of the row has it too
      const others = new Set(ws.filter((_, j) => j !== i).flatMap((o) => [...fold(o)]));
      return `<div class="hr-nw" style="animation-delay:${r * .7 + i * .15}s">${[...wd].map((ch) => (others.has(fold(ch)) ? `<span class="g">${ch}</span>` : ch)).join('')}</div>`;
    }).join('');
    return `<div class="hr-num"><b>${n}</b>${tiles}</div>`;
  }).join('');
  return `${closeX(x)}<div style="margin-top:34px">${rows}</div><p class="hr-pt">${esc(t.sec.numText)}</p>`;
}

loadFont();
render();
</script>
</body>
</html>
