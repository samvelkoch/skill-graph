    c.save(); c.translate(0, -lift); RB(c, x - 3, 238, 66, 30, 10, KC[j][0], KC[j][1]); c.globalAlpha = 1; c.fillStyle = '#fff'; c.font = `19px ${EMO}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(KE[j], x + 30, 254); c.restore();
    c.font = `800 12px ${FONT}`; c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(T[lang].kinds[j], x + 30, 322, 56);
    if (cnt && !K.checked) { CI(c, x + 52, 278, 8, '#fff', '#e8e8f0'); c.fillStyle = '#2a2040'; c.font = `900 11px ${FONT}`; c.fillText(cnt, x + 52, 279); }
    if (cur === j) { c.globalAlpha = .6 + .4 * Math.sin(t * 5); path(c, x - 4, 234 - lift, 68, 110 + lift, 12); c.lineWidth = 3.5; c.strokeStyle = '#46d27a'; c.stroke(); c.globalAlpha = 1; }
  }

}
function drawFix(c, t) {
  const F = S.F; if (!F) return;
  path(c, 14, 46, 332, 306, 22); c.save(); c.clip();
  if (F.i >= 5) { c.fillStyle = lg(c, 0, 46, 0, 352, '#2c3355', '#1a1f3a'); c.fillRect(14, 46, 332, 306); c.restore();
    F.ids.forEach((id, i) => thumb(c, HID[id], BX(i), 100, 60, 60, F.res[i] ? '#46d27a' : '#e9b52a'));
    RB(c, 110, 214, 140, 76, 18, '#2a6fd0', '#1b4fa0', '#fff'); c.font = `900 46px ${FONT}`; c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('112', 180, 254); return; }
  const h = HID[F.ids[F.i]], k = RC[h.room]; c.fillStyle = lg(c, 0, 46, 0, 280, k.w[0], k.w[1]); c.fillRect(14, 46, 332, 240); c.fillStyle = lg(c, 0, 280, 0, 352, k.f[0], k.f[1]); c.fillRect(14, 280, 332, 72); RB(c, 14, 276, 332, 8, 2, '#fffaf0', '#e6dcc4', null);
  const m = F.pick === null ? 0 : ease((now() - F.t0) / .7), sc = Math.min(2.4, 100 / h.e * 1.05);

}

// --- pointer ------------------------------------------------------------------------------------------------
const cv = $('cv'), pt = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - V.ox) / V.s, (e.clientY - r.top - V.oy) / V.s]; };
let down = null;
cv.addEventListener('pointerdown', (e) => {
  const p = pt(e); down = { x: e.clientX, y: e.clientY, tx: S.tx, ty: S.ty }; try { cv.setPointerCapture(e.pointerId); } catch { /* ok */ }
  if (!S.sec && lab.view === 'find') { S.drag = true; S.touched = true; S.gx = p[0]; S.gy = p[1]; }
});
cv.addEventListener('pointermove', (e) => { if (S.sec || lab.view !== 'find') return; if (S.drag || e.pointerType === 'mouse') { const p = pt(e); S.gx = p[0]; S.gy = p[1]; S.touched = true; } });
cv.addEventListener('pointercancel', () => { S.drag = false; down = null; });
cv.addEventListener('pointerup', (e) => {
  const d = down; down = null; S.drag = false; if (!d || S.sec || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 10) return;
  const [x, y] = pt(e);
  if (lab.view === 'find') {
    const dark = S.lightT[S.room] < .5; let best = null, bd = 9;
    for (const h of HZ) { if (h.room !== S.room || S.found[h.id]) continue; const dd = Math.max(Math.abs(x - h.x) / h.hx, Math.abs(y - h.y) / h.hy); if (dd < 1 && dd < bd && (!dark || Math.hypot(h.x - d.tx, h.y - d.ty) < 84 + Math.min(h.hx, h.hy) * .6)) { best = h; bd = dd; } }
    if (best) { S.found[best.id] = now(); S.last = best.id; sfx.good(); if (HZ.filter((h) => h.room === S.room).every((h) => S.found[h.id])) S.lit[S.room] = 1; render(); }
  } else if (lab.view === 'kind' && S.K) {
    const K = S.K;
    if (y >= 188 && y <= 236) { const i = Math.floor((x - 10) / 68); if (i >= 0 && i < 5) { K.sel = i; K.t0 = now(); sfx.tick(); render(); } }
    else if (y >= 232 && y <= 346 && !K.checked) { const j = Math.floor((x - 10) / 68); if (j >= 0 && j < 5) {
      K.asg[K.sel] = j; sfx.snap(); const nx = [1, 2, 3, 4, 5].map((o) => (K.sel + o) % 5).find((i) => K.asg[i] < 0); if (nx !== undefined) { K.sel = nx; K.t0 = now(); } render(); } }
  }
});

// --- controls and text ---------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const optBtns = (texts, perm, pick, act) => `<div class="hs-opts">${perm.map((p, j) => {
  const good = pick !== null && p === 0, bad = pick === j && p !== 0;
  return `<button class="hs-opt ${good ? 'good' : ''} ${bad ? 'bad' : ''}" data-act="${act}" data-j="${j}" ${pick !== null ? 'disabled' : ''}>${esc(texts[p])}</button>`; }).join('')}</div>`;
const secChips = (t) => `<div class="hs-row chips">${['night', 'call'].map((k) => { const open = secret.unlocked(); return `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'night' ? '🌙' : '📞'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`; }).join('')}</div>`;
function render() {
  const t = T[lang], v = lab.view; phone.style.display = S.sec === 'call' ? 'block' : 'none';
  if (S.sec === 'night') rNight(t); else if (S.sec === 'call') rCall(t); else if (v === 'find') rFind(t); else if (v === 'kind') rKind(t); else rFix(t);
  lab.setFacts(t.facts[v]);
}
function rFind(t) {
  const r = S.room, hs = HZ.filter((h) => h.room === r), n = hs.filter((h) => S.found[h.id]).length, done = n === hs.length, lit = S.lit[r], tried = n > 0 || S.tried[r] || lit;
  $('ctrlBody').innerHTML = `<div class="hs-row chips">${t.rooms.map((x, i) => `<button class="chip ${i === r ? 'on' : ''}" data-act="room" data-i="${i}">${ICON[i]} ${esc(x)}</button>`).join('')}</div>
    <div class="hs-row">${lit || done ? (r < 2 ? `<button class="btn hs-main" data-act="nextroom">${esc(t.ui.nextRoom)}</button>` : `<button class="btn hs-main" data-act="restart">${esc(t.ui.again)}</button>`)
      : `<button class="btn hs-main" data-act="light" ${tried ? '' : 'disabled'}>${esc(t.ui.light)}</button>`}</div>${secChips(t)}`;
  lab.setReadout(`${n}/${hs.length}`, t.ui.found, `${ICON[r]} ${t.rooms[r]}`, '#e9b52a');
  const lastH = S.last && HID[S.last] && HID[S.last].room === r ? HID[S.last] : null;
  if (done) lab.setState({ emo: '🎉', title: t.find.done[0], lead: t.find.done[1], body: '', extra: '' });
  else if (lit) lab.setState({ emo: '💡', title: t.find.lit[0], lead: t.find.lit[1], body: t.find.body, extra: '' });
  else if (lastH) lab.setState({ emo: KE[lastH.k], title: t.haz[lastH.id], lead: `${KE[lastH.k]} ${t.kinds[lastH.k]}`, body: t.find.body, extra: '' });
  else lab.setState({ emo: '🔦', title: t.rooms[r], lead: t.find.lead, body: t.find.body, extra: '' });
}
function rKind(t) {
  if (!S.K) dealK(); const K = S.K, n = K.asg.filter((a) => a >= 0).length, ok = K.ids.filter((id, i) => K.asg[i] === HID[id].k).length;
  $('ctrlBody').innerHTML = `<div class="hs-row">${K.checked ? `<button class="btn hs-main" data-act="newk">${esc(t.ui.newCards)}</button>` : `<button class="btn hs-main" data-act="check" ${n < 5 ? 'disabled' : ''}>${esc(t.ui.check)}</button>`}</div>`;
  const cur = HID[K.ids[K.sel]];
  if (K.checked) { lab.setReadout(`${ok}/5`, t.ui.ok, '', '#e9b52a'); lab.setState({ emo: '🗂️', title: t.kind.res(ok), lead: `${t.haz[cur.id]}: ${KE[cur.k]} ${t.kinds[cur.k]}`, body: t.kind.resLead, extra: '' }); }
  else { lab.setReadout(`${n}/5`, t.ui.sorted, '', '#e9b52a'); lab.setState({ emo: '🗂️', title: t.kind.title, lead: t.haz[cur.id], body: t.kind.lead, extra: '' }); }
}
function rFix(t) {
  if (!S.F) dealF(); const F = S.F, good = F.res.filter(Boolean).length;
  if (F.i >= 5) { $('ctrlBody').innerHTML = `<div class="hs-row"><button class="btn hs-main" data-act="newf">${esc(t.ui.again)}</button></div>`; lab.setReadout(`${good}/5`, t.ui.safe, '', '#46b46e');
    lab.setState({ emo: '🚑', title: t.fix.end(good), lead: t.fix.endLead, body: '', extra: '' }); return; }
  const h = HID[F.ids[F.i]], done = F.pick !== null, right = done && F.perm[F.pick] === 0;
  $('ctrlBody').innerHTML = `${optBtns(t.opts[h.id], F.perm, F.pick, 'fopt')}${done ? `<div class="hs-row"><button class="btn hs-main" data-act="fnext">${esc(t.ui.next)}</button></div>` : ''}`;
  lab.setReadout(`${good}/5`, t.ui.safe, '', '#46b46e');
  if (!done) lab.setState({ emo: '🧐', title: t.haz[h.id], lead: t.fix.lead, body: '', extra: '' });
  else lab.setState(right ? { emo: '✅', title: t.right, lead: t.fix.rightLead, body: '', extra: '' } : { emo: '🤔', title: t.fix.wrong, lead: t.fix.wrongLead, body: t.fix.rightLead, extra: '' });
}
function rNight(t) {
  const N = S.N, n = t.night, done = N.pick !== null, right = done && N.perm[N.pick] === 0;
  $('ctrlBody').innerHTML = `<div class="hs-row"><button class="chip" data-act="close">${esc(t.ui.close)}</button></div>${optBtns(n.opts, N.perm, N.pick, 'nopt')}${done ? `<div class="hs-row"><button class="btn hs-main" data-act="nagain">${esc(t.ui.again)}</button></div>` : ''}`;
  lab.setReadout('🔔', n.sub, '', '#e9b52a');
  lab.setState(!done ? { emo: '🚨', title: n.title, lead: n.lead, body: '', extra: '' } : { emo: right ? '✅' : '🤔', title: right ? t.right : n.wrong, lead: n.lead2, body: '', extra: '' });
}
function rCall(t) {
  const C = S.C, c = t.call, st = C.step;
  const cur = st >= 1 && st <= 3 ? c.steps[st - 1] : null, bub = [];
  for (let i = 0; i < Math.min(st, 3); i++) { bub.push(`<p class="hs-b op">${esc(c.steps[i].q)}</p>`); if (C.res[i]) bub.push(`<p class="hs-b me ${C.res[i].ok ? 'good' : 'bad'}">${esc(c.steps[i].opts[C.res[i].p])}</p>`); }
  if (st === 4) bub.push(`<p class="hs-b op">${esc(c.op)}</p>`);
  if (st === 0) phone.innerHTML = `<div class="hs-scr"><div class="hs-num ${C.shake ? 'hs-shake' : ''}">${esc(C.dial) || '&nbsp;'}</div></div><div class="hs-keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '📞'].map((k) => `<button data-k="${k}" class="${k === '📞' ? 'go' : ''}">${k}</button>`).join('')}</div>`;
  else phone.innerHTML = `<div class="hs-scr" style="min-height:230px">${bub.join('')}</div>`;
  $('ctrlBody').innerHTML = `<div class="hs-row"><button class="chip" data-act="close">${esc(t.ui.close)}</button></div>${cur ? optBtns(cur.opts, C.perm, C.pick, 'copt') : ''}`
    + `${cur && C.pick !== null ? `<div class="hs-row"><button class="btn hs-main" data-act="cnext">${esc(t.ui.next)}</button></div>` : ''}${st === 4 ? `<div class="hs-row"><button class="btn hs-main" data-act="cagain">${esc(t.ui.again)}</button></div>` : ''}`;
  lab.setReadout(st === 0 ? (C.dial || '☎') : '112', '', '', '#46b46e');
  if (st === 0) lab.setState({ emo: '📞', title: c.title, lead: C.shake ? c.bad : c.lead, body: '', extra: '' });
  else if (st === 4) lab.setState({ emo: '🚑', title: c.final[0], lead: c.final[1], body: '', extra: '' });
  else if (C.pick !== null) { const ok = C.perm[C.pick] === 0; lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.fix.wrong, lead: ok ? '' : c.wrongLead, body: '', extra: '' }); }
  else lab.setState({ emo: '📞', title: c.title, lead: cur.q, body: '', extra: '' });
}
phone.addEventListener('click', (e) => {
  const b = e.target.closest('[data-k]'); if (!b || S.C.step !== 0) return; const C = S.C, k = b.dataset.k; sfx.tick();
  if (k === '⌫') C.dial = C.dial.slice(0, -1);
  else if (k === '📞') { if (C.dial === '112') { C.step = 1; C.pick = null; C.perm = shuf([0, 1, 2]); sfx.good(); } else { C.dial = ''; C.shake = 1; sfx.bad(); setTimeout(() => { C.shake = 0; render(); }, 900); } }
  else if (C.dial.length < 5) { C.dial += k; C.shake = 0; }
  render();
});
$('ctrlBody').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return; const act = b.dataset.act, j = +b.dataset.j; sfx.click();
  if (act === 'room') { S.room = +b.dataset.i; S.last = null; S.moveT = 0; }
  else if (act === 'light') { S.lit[S.room] = 1; }
  else if (act === 'nextroom') { S.room = Math.min(2, S.room + 1); S.last = null; S.moveT = 0; }
  else if (act === 'restart') { S.found = {}; S.lit = [0, 0, 0]; S.lightT = [0, 0, 0]; S.tried = [false, false, false]; S.room = 0; S.last = null; S.moveT = 0; }
  else if (act === 'sec') { const k = b.dataset.k; if (!secret.unlocked()) return secret.open(); S.sec = S.sec === k ? null : k;
    if (S.sec === 'night') S.N = { pick: null, t0: 0, perm: shuf([0, 1, 2]) }; if (S.sec === 'call') S.C = { dial: '', step: 0, pick: null, perm: shuf([0, 1, 2]), res: [], shake: 0 }; }
  else if (act === 'close') S.sec = null;
  else if (act === 'check') { S.K.checked = true; const okn = S.K.ids.filter((id, i) => S.K.asg[i] === HID[id].k).length; (okn >= 3 ? sfx.good : sfx.bad)(); render(); return showStage(); }
  else if (act === 'newk') dealK();
  else if (act === 'fopt') { const F = S.F; F.pick = j; F.t0 = now(); F.res[F.i] = F.perm[j] === 0; (F.perm[j] === 0 ? sfx.good : sfx.bad)(); render(); return showStage(); }
  else if (act === 'fnext') { const F = S.F; F.i++; F.pick = null; F.perm = shuf([0, 1, 2]); }
  else if (act === 'newf') dealF();
  else if (act === 'nopt') { S.N.pick = j; S.N.t0 = now(); (S.N.perm[j] === 0 ? sfx.good : sfx.bad)(); render(); return showStage(); }
  else if (act === 'nagain') S.N = { pick: null, t0: 0, perm: shuf([0, 1, 2]) };
  else if (act === 'copt') { const C = S.C; C.pick = j; C.res[C.step - 1] = { p: C.perm[j], ok: C.perm[j] === 0 }; (C.perm[j] === 0 ? sfx.good : sfx.bad)(); }
  else if (act === 'cnext') { const C = S.C; C.step++; C.pick = null; C.perm = shuf([0, 1, 2]); }
  else if (act === 'cagain') S.C = { dial: '', step: 0, pick: null, perm: shuf([0, 1, 2]), res: [], shake: 0 };
  render();
});
render();
