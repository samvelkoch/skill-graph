  const i = Math.min(S.ti, 4), ex = TB[i], rev = S.tG !== null || S.ti >= 5, rows = ex.rows, n = rows.length, t = T[lang], lb = t.tab.labs[i];
  const lw = 72, rh = 42, cw = Math.min(64, (w - 24 - lw) / n), x0 = (w - lw - n * cw) / 2, y0 = 12;
  c.textBaseline = 'middle'; c.textAlign = 'center';
  for (let r = 0; r < 2; r++) {
    const y = y0 + r * (rh + 4);
    c.fillStyle = 'rgba(130,145,190,.14)'; rr(c, x0, y, lw - 4, rh, 10); c.fill();
    c.fillStyle = '#fff'; c.font = '800 13px Nunito, sans-serif'; c.fillText(lb[r], x0 + lw / 2 - 2, y + rh / 2 - 7);
    c.fillStyle = '#98A0B8'; c.font = '700 12px Nunito, sans-serif'; c.fillText(r ? t.output : t.input, x0 + lw / 2 - 2, y + rh / 2 + 9);
    rows.forEach(([x, v], k) => {

      c.fillStyle = { bad: 'rgba(255,77,94,.45)', same: 'rgba(245,200,76,.36)', ok: 'rgba(61,220,151,.24)', none: r ? 'rgba(224,176,80,.15)' : 'rgba(95,168,224,.2)' }[st];
      rr(c, cx + 1.5, y, cw - 3, rh, 9); c.fill(); c.lineWidth = 1; c.strokeStyle = st === 'bad' ? '#ff4d5e' : 'rgba(130,145,190,.28)'; c.stroke();
      c.fillStyle = '#fff'; c.font = '800 15px Nunito, sans-serif'; c.fillText(nf(val), cx + cw / 2, y + rh / 2 + 1);
    });
  }

    ex.bad.forEach((x) => { c.strokeStyle = 'rgba(255,77,94,.7)'; c.beginPath(); c.moveTo(f.X(x), gy + 4); c.lineTo(f.X(x), gy + gh - 4); c.stroke(); });
    if (ex.fn) ex.same.forEach((y) => { c.strokeStyle = 'rgba(245,200,76,.7)'; c.beginPath(); c.moveTo((w - gw) / 2 + 4, f.Y(y)); c.lineTo((w + gw) / 2 - 4, f.Y(y)); c.stroke(); });
    c.setLineDash([]);
  }
  rows.forEach(([x, y]) => dot(c, f.X(x), f.Y(y), !rev ? '#8fc1ff' : ex.bad.has(x) ? '#ff4d5e' : ex.fn ? (ex.same.has(y) ? '#f5c84c' : '#3ddc97') : '#8fc1ff', 6));
}

// --- graph view: a vertical line across a graph ----------------------------------------------------------------
function drawGraph(c, w, h, dt, time) {
  const side = Math.min(w - 16, h - 16), r = { x: (w - side) / 2, y: (h - side) / 2, w: side, h: side };
  if (S.sec) return drawSecret(c, r, dt);
  const gi = Math.min(S.gi, 4), G = GR[gi], on = S.gG !== null || S.gi >= 5;
  const f = frame(c, r, [-4, 4], [-4, 4], { xs: [-4, -3, -2, -1, 0, 1, 2, 3, 4], ys: [-4, -3, -2, -1, 0, 1, 2, 3, 4], lx: [-3, -2, 2, 3], ly: [-3, -2, 2, 3] });
  GEO = { x: r.x, w: r.w };
  c.font = 'italic 800 14px Nunito, sans-serif'; c.fillStyle = '#C6CDE0'; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText('x', r.x + r.w - 16, f.Y(0) - 12); c.fillText('y', f.X(0) + 8, r.y + 14);
  const path = (pts) => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(f.X(x), f.Y(y)) : c.moveTo(f.X(x), f.Y(y)))); };
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.save(); c.globalAlpha = 0.2; c.strokeStyle = '#a99bff'; c.lineWidth = 11; G.paths.forEach((p) => { path(p); c.stroke(); }); c.restore();
  c.strokeStyle = '#d2c9ff'; c.lineWidth = 3.6; G.paths.forEach((p) => { path(p); c.stroke(); });
  if (G.k === 'step') for (let k = -4; k <= 3; k++) { dot(c, f.X(k), f.Y(k), '#d2c9ff', 5); dot(c, f.X(k + 1), f.Y(k), '#d2c9ff', 5, true); }
  if (!on) return;
  if (Math.abs(S.gx - S.gxT) < 0.002) S.gx = S.gxT; else if (!drag) S.gx += (S.gxT - S.gx) * Math.min(1, dt * 7);
  const X = clamp(f.X(S.gx), r.x + 2, r.x + r.w - 2), hits = hitsOf(G.k, S.gx), pulse = 0.5 + 0.5 * Math.sin(time * 6);
  c.save(); c.shadowColor = 'rgba(255,255,255,.6)'; c.shadowBlur = 8; c.strokeStyle = 'rgba(255,255,255,.92)'; c.lineWidth = 2.2;
  c.beginPath(); c.moveTo(X, r.y + 6); c.lineTo(X, r.y + r.h - 6); c.stroke(); c.restore();
  if (G.k === 'step' && Math.abs(S.gx - Math.round(S.gx)) < 0.01 && Math.round(S.gx) > -4) dot(c, X, f.Y(Math.round(S.gx) - 1), '#ffffff', 5.5, true);
  hits.forEach((y) => dot(c, X, f.Y(y), hits.length > 1 ? '#ff4d5e' : '#3ddc97', hits.length > 1 ? 6.5 + 2 * pulse : 6.5));
  c.fillStyle = '#fff'; c.beginPath(); c.arc(X, r.y + 20, 13, 0, 6.283); c.fill(); c.lineWidth = 2; c.strokeStyle = '#0c0e1a'; c.stroke();
  c.fillStyle = '#12162c'; c.font = '900 15px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('↔', X, r.y + 21);
}
function drawSecret(c, r, dt) {
  GEO = null;
  const t = T[lang], f = frame(c, r, [-3.6, 3.6], [-1.6, 10.6], { xs: [-3, -2, -1, 0, 1, 2, 3], ys: [0, 2, 4, 6, 8, 10], lx: [-3, -2, -1, 1, 2, 3], ly: [2, 4, 6, 8, 10] });
  S.sxA += (S.sx - S.sxA) * Math.min(1, dt * 9); if (Math.abs(S.sx - S.sxA) < 0.002) S.sxA = S.sx;
  const a = S.sxA, pts = sampleX((x) => x * x, -3.2, 3.2);
  c.lineCap = 'round'; c.lineJoin = 'round';
  const path = (pp) => { c.beginPath(); pp.forEach(([x, y], i) => (i ? c.lineTo(f.X(x), f.Y(y)) : c.moveTo(f.X(x), f.Y(y)))); };
  c.save(); c.globalAlpha = 0.2; c.strokeStyle = '#a99bff'; c.lineWidth = 11; path(pts); c.stroke(); c.restore();
  c.strokeStyle = '#d2c9ff'; c.lineWidth = 3.6; path(pts); c.stroke();
  const PX = f.X(a), PY = f.Y(a * a), xi = S.sx;
  if (S.sec === 'fx') {
    c.setLineDash([5, 4]); c.lineWidth = 2;
    c.strokeStyle = '#5fa8e0'; c.beginPath(); c.moveTo(PX, PY); c.lineTo(PX, f.Y(0)); c.stroke();
    c.strokeStyle = '#f5c84c'; c.beginPath(); c.moveTo(PX, PY); c.lineTo(f.X(0), PY); c.stroke(); c.setLineDash([]);
    tag(c, `x = ${nf(xi)}`, PX, f.Y(0) + (xi === 0 ? 18 : 16), { col: '#8fc1ff' });
    tag(c, `f(${nf(xi)}) = ${xi * xi}`, Math.max(f.X(0) + 10, r.x + 8), PY - (xi === 0 ? 18 : 0), { al: 'l', col: '#f5c84c' });
  } else {
    const k = 2 * a, dx = 1.3;

    c.beginPath(); c.moveTo(f.X(a - dx), f.Y(a * a - k * dx)); c.lineTo(f.X(a + dx), f.Y(a * a + k * dx)); c.stroke(); c.restore();
    tag(c, `${t.slope} ${nf(2 * xi)}`, clamp(PX, r.x + 50, r.x + r.w - 50), clamp(PY - 26, r.y + 16, r.y + r.h - 16), { col: '#f5c84c' });
  }

}

// --- shell ---------------------------------------------------------------------------------------------------
const lab = shell({ key: 'one-output', T, topics: TOPICS, views: ['machine', 'tables', 'graph'], onLang: render, onView: render });
const secret = secretLab('one-output', () => ({
  secrets: [{ emo: '🧮', title: T[lang].secrets.name[0], desc: T[lang].secrets.name[1] }, { emo: '✍️', title: T[lang].secrets.fx[0], desc: T[lang].secrets.fx[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div class="ob-keys" id="keysRow">${[...BTN].map((b, i) => `<button class="ob-key" data-k="${i}">${b}</button>`).join('')}</div>
  <div id="askBox">
    <p class="ob-cap" id="qCap"></p><p class="ob-q" id="qTxt"></p>
    <div class="ob-yn"><button class="ob-b" id="yes" data-g="1"></button><button class="ob-b" id="no" data-g="0"></button></div>
    <p class="ob-need" id="need" hidden></p>
  </div>
  <div class="ob-slide" id="slideRow" hidden><input type="range" id="xs" min="-4" max="4" step="0.05" value="0"><p id="slideTxt"></p></div>
  <div class="ob-step" id="stepRow" hidden><button class="ob-sb" data-st="-1" aria-label="−">−</button><b id="stV"></b><button class="ob-sb" data-st="1" aria-label="+">+</button></div>
  <div class="row2" id="nextRow" hidden><button class="btn" id="nextB" data-act="next"></button></div>
  <div class="row2" id="secRow" hidden></div>`;

canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v !== 'graph') GEO = null;
  if (v === 'machine') { const lw = w >= 640 ? w * 0.4 : w * 0.45; drawMachine(c, { x: 0, y: 0, w: lw, h }, time); drawDiagram(c, { x: lw + 4, y: 8, w: w - lw - 12, h: h - 16 }, time); }
  else if (v === 'tables') drawTable(c, w, h);
  else drawGraph(c, w, h, dt, time);
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function press(b) {
  if (S.mi >= 3) return;
  const m = MACH[S.mi], o = m.map[b], d = Array.isArray(o) ? o[S.cnt[b]++ % o.length] : o;
  S.mLog.push({ b, d });
  if (!S.seen.some((s) => s.b === b && s.d === d)) S.seen.push({ b, d, t0: now() });
  S.drop = { d, t0: now() }; S.lit = { b, t0: now() }; sfx.push(); render();
}
function guess(g) {
  const v = lab.view, want = !!g;
  if (v === 'machine') { if (S.mG !== null || S.mLog.length < MIN) return; S.mG = want; S.revT = now(); S.mRes[S.mi] = want === MACH[S.mi].fn; (S.mRes[S.mi] ? sfx.good : sfx.bad)(); }
  else if (v === 'tables') { if (S.tG !== null) return; S.tG = want; S.tRes[S.ti] = want === TB[S.ti].fn; (S.tRes[S.ti] ? sfx.good : sfx.bad)(); }
  else {
    if (S.gG !== null) return;
    S.gG = want; S.gRes[S.gi] = want === GR[S.gi].fn; S.gxT = GR[S.gi].x0; S.gx = clamp(S.gxT + 1.6, -4, 3.99); (S.gRes[S.gi] ? sfx.good : sfx.bad)();
  }
  showStage(); render();
}
function nextStep() {
  const v = lab.view;
  if (v === 'machine') {
    if (S.mi >= 3) S.mRes = [];
    S.mi = S.mi >= 3 ? 0 : S.mi + 1; S.mLog = []; S.seen = []; S.cnt = [0, 0, 0, 0, 0]; S.mG = null; S.drop = null; S.lit = null;
  } else if (v === 'tables') { if (S.ti >= 5) { S.ti = 0; S.tRes = []; } else S.ti++; S.tG = null; }
  else { if (S.gi >= 5) { S.gi = 0; S.gRes = []; } else S.gi++; S.gG = null; }
  sfx.click(); render();
}
function setX(x) {
  const G = GR[Math.min(S.gi, 4)];
  x = clamp(x, -4, G.k === 'step' ? 3.999 : 4);
  if (Math.abs(x - Math.round(x)) < 0.1 && (G.k === 'step' || Math.abs(x) < 0.1)) x = Math.round(x);
  S.gx = S.gxT = x; render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.k !== undefined) press(+b.dataset.k);
  else if (b.dataset.g !== undefined) guess(+b.dataset.g);
  else if (b.dataset.act === 'next') nextStep();
  else if (b.dataset.st) { S.sx = clamp(S.sx + +b.dataset.st, -3, 3); sfx.tick(); render(); }
  else if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; sfx.click(); render();
  }
});
$('xs').addEventListener('input', (ev) => setX(+ev.target.value));
const gxOf = (ev) => { const r = $('cv').getBoundingClientRect(); return GEO ? (ev.clientX - r.left - GEO.x) / GEO.w * 8 - 4 : 0; };
const canDrag = () => lab.view === 'graph' && S.gG !== null && !S.sec && S.gi < 5 && GEO;
$('cv').addEventListener('pointerdown', (ev) => { if (!canDrag()) return; drag = true; try { $('cv').setPointerCapture(ev.pointerId); } catch { /* fine */ } setX(gxOf(ev)); });
$('cv').addEventListener('pointermove', (ev) => { if (drag && canDrag()) setX(gxOf(ev)); });
['pointerup', 'pointercancel'].forEach((e) => $('cv').addEventListener(e, () => { drag = false; }));

// --- one render per change: controls, readout and the state card ---------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('yes').textContent = t.fn; $('no').textContent = t.nfn;
  lab.setGlow({ machine: 'rgba(255,122,89,.24)', tables: 'rgba(95,168,224,.24)', graph: 'rgba(169,155,255,.26)' }[v]);
  $('keysRow').hidden = true; $('need').hidden = true; $('slideRow').hidden = true; $('stepRow').hidden = true; $('secRow').hidden = v !== 'graph';
  $('qCap').hidden = true;
  if (v === 'machine') rMachine(t); else if (v === 'tables') rTables(t); else rGraph(t);
}
function rMachine(t) {
  const m = t.mach, mi = Math.min(S.mi, 2), end = S.mi >= 3, rev = end || S.mG !== null, k = S.mRes.filter(Boolean).length, left = Math.max(0, MIN - S.mLog.length), last = S.mLog[S.mLog.length - 1];
  $('keysRow').hidden = end; $('askBox').hidden = end || rev; $('qTxt').textContent = m.q;
  $('yes').disabled = $('no').disabled = left > 0; $('need').hidden = left === 0; $('need').textContent = m.need(left);
  $('nextRow').hidden = !rev; $('nextB').textContent = end ? t.again : mi === 2 ? t.fin : m.nextB;
  lab.setReadout(end ? `${k}/3` : last ? `${BTN[last.b]} → ${esc(t.drinks[last.d])}` : '?', end ? '' : `${m.name(mi + 1)} · ${t.presses(S.mLog.length)}`, rev && !end ? verdict(t, MACH[mi].fn) : '', ACC.machine);
  if (end) lab.setState({ emo: '🏆', title: m.end(k), lead: m.endLead, body: '' });
  else if (rev) lab.setState({ emo: S.mRes[mi] ? '✅' : '🤔', title: S.mRes[mi] ? t.right : t.miss, lead: m.rev[mi], body: '' });
  else lab.setState({ emo: '🥤', title: m.name(mi + 1), lead: m.lead, body: m.rule });
  lab.setFacts(t.facts.m);
}
function rTables(t) {
  const m = t.tab, i = Math.min(S.ti, 4), end = S.ti >= 5, rev = end || S.tG !== null, k = S.tRes.filter(Boolean).length, fine = `<div class="ob-fine">${esc(m.fine)}</div>`;
  $('askBox').hidden = end || rev; $('qCap').hidden = false; $('qCap').textContent = m.caps[i]; $('qTxt').textContent = m.q;
  $('yes').disabled = $('no').disabled = false;
  $('nextRow').hidden = !rev; $('nextB').textContent = end ? t.again : i === 4 ? t.fin : m.nextB;
  lab.setReadout(end ? `${k}/5` : `${i + 1}/5`, end ? '' : `${m.labs[i][0]} → ${m.labs[i][1]}`, rev && !end ? verdict(t, TB[i].fn) : '', ACC.tables);
  if (end) lab.setState({ emo: '🏆', title: m.end(k), lead: m.endLead, body: '', extra: fine });
  else if (rev) lab.setState({ emo: S.tRes[i] ? '✅' : '🤔', title: S.tRes[i] ? t.right : t.miss, lead: m.rev[i], body: '', extra: fine });
  else lab.setState({ emo: '📋', title: m.name(i + 1), lead: m.lead, body: '', extra: fine });

function rGraph(t) {
  const g = t.grf, i = Math.min(S.gi, 4), end = S.gi >= 5, rev = end || S.gG !== null, k = S.gRes.filter(Boolean).length, open = secret.unlocked();
  $('secRow').innerHTML = [['name', '🧮'], ['fx', '✍️']].map(([key, emo]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-sec="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`).join('');
  lab.setFacts(t.facts.g);
  if (S.sec) {
    $('askBox').hidden = true; $('nextRow').hidden = true; $('stepRow').hidden = false; $('stV').textContent = `${t.sc.stepper} = ${nf(S.sx)}`;
    const x = S.sx, s = S.sec === 'name' ? t.sc.nm(nf(x), nf(2 * x)) : t.sc.fx(nf(x), x * x);
    lab.setReadout(`x = ${nf(x)}`, '', '', ACC.graph);
    lab.setState({ emo: S.sec === 'name' ? '🧮' : '✍️', title: s.title, lead: s.lead, body: s.body });
    return;
  }
  $('askBox').hidden = end || rev; $('qTxt').textContent = g.q;
  $('yes').disabled = $('no').disabled = false;
  $('slideRow').hidden = end || S.gG === null; $('slideTxt').textContent = g.after;
  if (+$('xs').value !== S.gxT) $('xs').value = S.gxT; $('xs').setAttribute('aria-label', 'x');
  $('nextRow').hidden = !rev; $('nextB').textContent = end ? t.again : i === 4 ? t.fin : g.nextB;
