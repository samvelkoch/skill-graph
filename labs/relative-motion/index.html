// --- drawing helpers ---------------------------------------------------------------------------------------------
let VB = { x0: 0, x1: 360, y0: 0, y1: 270 }; // the part of the 360 x 270 design box that is on screen
const hsh = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const mod = (a, n) => ((a % n) + n) % n;
const sm = (t) => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); };
const lin = (c, x0, y0, x1, y1, st) => { const g = c.createLinearGradient(x0, y0, x1, y1); st.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rad = (c, x0, y0, r0, x1, y1, r1, st) => { const g = c.createRadialGradient(x0, y0, Math.max(0, r0), x1, y1, Math.max(0, r1)); st.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, 7); };
const fv = (v) => `${v > 0 ? '→ ' : v < 0 ? '← ' : ''}${fm(v)} ${T[lang].km}`;
const fvHtml = (v) => `${v > 0 ? '→ ' : v < 0 ? '← ' : ''}${fm(v)} <small style="font-size:.5em;font-weight:700">${T[lang].km}</small>`;
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function hud(c, rows) {
  c.save(); c.font = '800 13px Nunito, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left';
  let y = VB.y0 + 8;
  for (const [txt, col] of rows) {
    const w = Math.min(c.measureText(txt).width + 16, VB.x1 - VB.x0 - 16), x = VB.x0 + 8;
    rr(c, x, y, w, 20, 10); c.fillStyle = 'rgba(10,12,22,.82)'; c.fill(); c.lineWidth = 1.3; c.strokeStyle = col; c.stroke();
    c.fillStyle = '#fff'; c.fillText(txt, x + 8, y + 10.5, w - 12);
    y += 24;
  }
  c.restore();
}
function tag(c, txt, x, y, col = '#fff') { // small name pill, centered on x, clamped inside the picture
  c.save(); c.font = '800 13px Nunito, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left';
  const w = c.measureText(txt).width + 14, px = clamp(x - w / 2, VB.x0 + 3, VB.x1 - w - 3);
  rr(c, px, y - 10, w, 20, 10); c.fillStyle = 'rgba(10,12,22,.82)'; c.fill(); c.lineWidth = 1.3; c.strokeStyle = col; c.stroke();
  c.fillStyle = '#fff'; c.fillText(txt, px + 7, y + 0.5); c.restore();
}
function arrow(c, x0, y0, x1, y1, col, lw = 3) {
  const a = Math.atan2(y1 - y0, x1 - x0), hl = 7 + lw;
  c.save(); c.strokeStyle = 'rgba(10,12,22,.7)'; c.fillStyle = col; c.lineWidth = lw + 2.5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1 - Math.cos(a) * hl * 0.6, y1 - Math.sin(a) * hl * 0.6); c.stroke();
  c.strokeStyle = col; c.lineWidth = lw; c.stroke();
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x1 - Math.cos(a - 0.45) * hl, y1 - Math.sin(a - 0.45) * hl); c.lineTo(x1 - Math.cos(a + 0.45) * hl, y1 - Math.sin(a + 0.45) * hl); c.closePath();
  c.lineWidth = 1.5; c.strokeStyle = 'rgba(10,12,22,.7)'; c.fill(); c.stroke(); c.restore();
}

// --- the shared landscape: sky, sun, clouds, three ridges, trees ---------------------------------------------------
const HP = 1440;
const ridge = (x, sd) => { const k = Math.PI * 2 / HP; return Math.sin(k * 3 * x + sd) * 0.5 + Math.sin(k * 7 * x + sd * 2.1) * 0.3 + Math.sin(k * 17 * x + sd * 3.7) * 0.2; };
const HILLS = [
  { par: 0.06, base: 140, amp: 34, sd: 1, a: '#7a76b4', b: '#9a8fbb' },
  { par: 0.16, base: 154, amp: 28, sd: 4, a: '#4e5896', b: '#6a6ea6' },
  { par: 0.34, base: 168, amp: 20, sd: 7, a: '#34486f', b: '#3f5d76' },
];
function sky(c, hz = 172) {
  c.fillStyle = lin(c, 0, VB.y0, 0, hz, [[0, '#2b3a78'], [0.55, '#7a73b4'], [1, '#f4b98a']]);
  c.fillRect(VB.x0, VB.y0, VB.x1 - VB.x0, hz - VB.y0 + 1);
  c.fillStyle = rad(c, 300, 124, 4, 300, 124, 74, [[0, 'rgba(255,232,176,.95)'], [0.25, 'rgba(255,212,150,.5)'], [1, 'rgba(255,200,140,0)']]);
  circ(c, 300, 124, 74); c.fill();
  c.fillStyle = '#ffeabd'; circ(c, 300, 124, 15); c.fill();
}
function clouds(c, cam) {
  for (let i = 0; i < 5; i++) {
    const x = mod(i * 190 + hsh(i) * 60 - cam * 0.05, 960) - 140, y = 28 + hsh(i + 5) * 62, s = 0.8 + hsh(i + 9) * 0.7;
    c.fillStyle = 'rgba(255,236,230,.2)';
    [[0, 0, 34, 8], [22, -5, 22, 7], [-20, -3, 20, 6]].forEach(([dx, dy, rx, ry]) => { c.beginPath(); c.ellipse(x + dx * s, y + dy * s, rx * s, ry * s, 0, 0, 7); c.fill(); });
  }
}
function hills(c, cam) {
  for (const L of HILLS) {
    c.beginPath(); c.moveTo(VB.x0, VB.y1);
    for (let x = VB.x0; x <= VB.x1 + 6; x += 6) c.lineTo(x, L.base - L.amp * (0.55 + ridge(x + cam * L.par, L.sd) * 0.6));
    c.lineTo(VB.x1 + 6, VB.y1); c.closePath();
    c.fillStyle = lin(c, 0, L.base - L.amp, 0, L.base + 14, [[0, L.b], [1, L.a]]); c.fill();
  }
}
function tree(c, x, y, s) {
  c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(x + 3 * s, y, 13 * s, 3 * s, 0, 0, 7); c.fill();
  c.fillStyle = '#4a3a2c'; c.fillRect(x - 2 * s, y - 13 * s, 4 * s, 13 * s);
  [[0, -26, 12], [-8, -18, 9], [8, -18, 9.5]].forEach(([dx, dy, r]) => {
    c.fillStyle = rad(c, x + dx * s - 3 * s, y + dy * s - 4 * s, 1, x + dx * s, y + dy * s, r * s, [[0, '#6bb178'], [0.55, '#3f8458'], [1, '#27573f']]);
    circ(c, x + dx * s, y + dy * s, r * s); c.fill();
  });
}
function trees(c, cam, baseY) {
  const par = 0.6, P = 104, i0 = Math.floor((cam * par + VB.x0) / P) - 1, i1 = Math.ceil((cam * par + VB.x1) / P) + 1;
  for (let i = i0; i <= i1; i++) { if (hsh(i) < 0.3) continue; tree(c, i * P + hsh(i + 7) * 40 - cam * par, baseY, 0.75 + hsh(i + 3) * 0.55); }
}
function groundFill(c, y0) {
  c.fillStyle = lin(c, 0, y0, 0, VB.y1, [[0, '#35564f'], [1, '#1f3636']]); c.fillRect(VB.x0, y0, VB.x1 - VB.x0, VB.y1 - y0 + 1);
}
// a stretch of rails: gravel bed, sleepers that slide with the camera, a steel rail
function track(c, cam, railY, sc) {
  c.fillStyle = lin(c, 0, railY, 0, railY + 30 * sc, [[0, '#7d766a'], [1, '#554f47']]); c.fillRect(VB.x0, railY, VB.x1 - VB.x0, 30 * sc);
  const P = 22 * sc, i0 = Math.floor((cam + VB.x0) / P) - 1;
  c.fillStyle = '#463a2e';
  for (let i = i0; i * P - cam < VB.x1 + P; i++) c.fillRect(i * P - cam, railY + 3 * sc, 12 * sc, 5 * sc);
  c.fillStyle = lin(c, 0, railY - 1, 0, railY + 3 * sc, [[0, '#e3e8f1'], [1, '#7c8394']]); c.fillRect(VB.x0, railY - 1, VB.x1 - VB.x0, 3.2 * sc);
}

// --- trains, wheels, people ------------------------------------------------------------------------------------
function wheel(c, x, y, r, ang) {
  c.save(); c.translate(x, y);
  c.fillStyle = lin(c, -r, -r, r, r, [[0, '#e1e5ee'], [1, '#7c8394']]); circ(c, 0, 0, r); c.fill(); c.lineWidth = 1.4; c.strokeStyle = '#23283a'; c.stroke();
  c.rotate(ang); c.strokeStyle = '#4a5166'; c.lineWidth = 1.7; c.beginPath();
  for (let i = 0; i < 3; i++) { const a = i * 2.0944; c.moveTo(0, 0); c.lineTo(Math.cos(a) * r * 0.82, Math.sin(a) * r * 0.82); }
  c.stroke(); c.fillStyle = '#2b3042'; circ(c, 0, 0, 2.3); c.fill(); c.restore();
}
// one carriage, local box 240 wide, the rail at y = 0, drawn upward. o: { col:[light,dark], cut, inner(c), ang, letter }

  });
  rr(c, 0, -96, 240, 80, 11); c.fillStyle = lin(c, 0, -96, 0, -16, [[0, o.col[0]], [1, o.col[1]]]); c.fill(); c.lineWidth = 1.6; c.strokeStyle = 'rgba(12,16,28,.85)'; c.stroke();
  rr(c, 5, -103, 230, 14, 7); c.fillStyle = lin(c, 0, -103, 0, -89, [[0, '#3a4b66'], [1, '#1c2a3f']]); c.fill();
  c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(14, -101, 212, 1.6);
  c.fillStyle = '#f6e7c1'; c.fillRect(1, -41, 238, 5); c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(1, -36, 238, 1.6);
  rr(c, 0, -22, 240, 6, 2); c.fillStyle = 'rgba(12,16,28,.55)'; c.fill();
  if (o.cut) {
    rr(c, 12, -90, 216, 56, 7); c.save(); c.clip();
    c.fillStyle = lin(c, 0, -90, 0, -34, [[0, '#ffeab4'], [1, '#f2a05a']]); c.fillRect(12, -90, 216, 56);
    c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(12, -90, 216, 6);          // luggage shelf light
    c.fillStyle = lin(c, 0, -37, 0, -33, [[0, '#9c6b3f'], [1, '#6b4526']]); c.fillRect(12, -37, 216, 4); // floor
    o.inner(c); c.restore();
    rr(c, 12, -90, 216, 56, 7); c.lineWidth = 2.4; c.strokeStyle = '#17202f'; c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(18, -86); c.lineTo(222, -86); c.stroke();
  } else {
    for (let i = 0; i < 4; i++) {
      const wx = 18 + i * 56;
      rr(c, wx, -88, 40, 40, 7); c.fillStyle = lin(c, 0, -88, 0, -48, [[0, '#ffe6a8'], [1, '#f2a35b']]); c.fill();

  $('rmWatch').textContent = t.watch;
  const cur = v === 'ball' ? (S.ball.pend || S.ball.frame) : v === 'trains' ? S.trains.frame : S.river.frame;
  $('rmFrame').innerHTML = FRAME_KEYS[v].map((k, i) => `<button type="button" data-act="frame" data-k="${k}" class="${cur === k ? 'on' : ''}"${ans ? '' : ' disabled'}>${esc(t.frames[v][i])}</button>`).join('');
  if (v === 'ball') {
    const b = S.ball, vb = b.vT + b.thr, ben = cur === 'ben';
    $('rmWho').innerHTML = t.who.map((n, i) => `<button type="button" data-act="who" data-m="${i}" class="${!!i === b.machine ? 'on' : ''}"${ans ? '' : ' disabled'}>${esc(n)}</button>`).join('');
    setSl('rmVT', t.sp.train, `${nf(b.vT)} ${t.km}`, { val: b.vT, dis: !ans });
    setSl('rmThr', b.machine ? t.sp.mach : t.sp.thr, `${fm(b.thr)} ${t.km}`, b.machine ? { min: -120, max: 120, step: 5, val: b.thr, dis: !ans } : { min: -20, max: 20, step: 1, val: b.thr, dis: !ans });
    lab.setGlow('rgba(244, 180, 120, .26)');
    if (!ans) {
      lab.setReadout('?', `${t.hud.ball} · ${t.fs.ball[0]}`, '', '#ffd23f');
      lab.setState({ emo: '🤔', title: t.ask.ball[0], lead: '', body: '', extra: '' }); lab.setFacts([]);
    } else {
      lab.setReadout(fvHtml(ben ? vb : b.thr), `${t.hud.ball} · ${t.fs.ball[ben ? 0 : 1]}`, `${t.fs.ball[ben ? 1 : 0]}: ${fv(ben ? b.thr : vb)}`, '#ffd23f');
      const st = vb === 0 && b.vT > 0 ? t.st.ball.zero(b.vT, b.thr) : b.vT === 0 ? t.st.ball.still(b.vT, b.thr) : b.thr === 0 ? t.st.ball.drop(b.vT) : t.st.ball.gen(b.vT, b.thr, vb);
      lab.setState({ emo: vb === 0 && b.vT > 0 ? '⬇️' : '🚆', title: st[0], lead: st[1], body: st[2], extra: '' });
      lab.setFacts(t.facts.ball);
    }
  } else if (v === 'trains') {
    const r = S.trains, rel = r.vB - r.vA;
    setSl('rmVA', t.sp.a, `${fm(r.vA)} ${t.km}`, { val: r.vA, dis: !ans }); setSl('rmVB', t.sp.b, `${fm(r.vB)} ${t.km}`, { val: r.vB, dis: !ans });
    $('rmPre').innerHTML = t.pre.map((n, i) => `<button type="button" class="chip" data-act="pre" data-k="${i}"${ans ? '' : ' disabled'}>${esc(n)}</button>`).join('');
    lab.setGlow('rgba(95, 168, 176, .28)');
    if (!ans) {
      lab.setReadout('?', x.seen, '', '#7fe3d6');
      lab.setState({ emo: '🤔', title: t.ask.trains[0], lead: '', body: '', extra: '' }); lab.setFacts([]);
    } else {
      lab.setReadout(fvHtml(rel), x.seen, '', '#7fe3d6');
      const S2 = t.st.trains;
      const st = r.vA === 0 && r.vB === 0 ? S2.none() : r.vA === 0 ? S2.station(r.vB) : r.vB === 0 ? S2.parked(r.vA) : r.vA === r.vB ? S2.same(r.vA) : r.vA * r.vB < 0 ? S2.opp(r.vA, r.vB) : S2.diff(r.vA, r.vB);
      lab.setState({ emo: r.vA === 0 && r.vB !== 0 ? '🚉' : '🚆', title: st[0], lead: st[1], body: st[2], extra: '' });
      lab.setFacts(t.facts.trains);
    }
  } else {
    const r = S.river, c = r.c, vg = Math.sqrt(9 + c * c), d = c * 20;
    setSl('rmC', t.sp.cur, `${nf(c, c % 1 ? 1 : 0)} ${t.ms}`, { val: c, dis: !ans });
    $('rmFine').textContent = t.fine;
    lab.setGlow('rgba(80, 170, 230, .28)');
    if (!ans) {
      lab.setReadout('?', '', '', '#6fd0ff');
      lab.setState({ emo: '🤔', title: t.ask.river[0], lead: '', body: '', extra: '' }); lab.setFacts([]);
    } else {
      lab.setReadout(`${nf(vg, 1)} <small style="font-size:.5em;font-weight:700">${t.ms}</small>`, c > 0 ? `√(3² + ${nf(c, c % 1 ? 1 : 0)}²) · ${x.ground}` : x.ground, c > 0 ? x.land(nf(d, d % 1 ? 1 : 0)) : x.landZ, '#6fd0ff');
      const st = c > 0 ? t.st.river.post(c, vg, d) : t.st.river.zero();
      lab.setState({ emo: '🌊', title: st[0], lead: st[1], body: st[2], extra: '' });
      lab.setFacts(t.facts.river);
    }
  }
}

canvasLoop($('cv'), (c, w, h, dt) => {
  const s = Math.min(w / 360, h / 270), ox = (w - 360 * s) / 2, oy = (h - 270 * s) / 2;
  VB = { x0: -ox / s, x1: (w - ox) / s, y0: -oy / s, y1: (h - oy) / s };
  S.t += dt;
  c.save(); c.translate(ox, oy); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  if (S.sec === 'earth') drawEarth(c, dt); else if (S.sec === 'tank') drawTank(c, dt);
  else if (lab.view === 'ball') drawBall(c, dt); else if (lab.view === 'trains') drawTrains(c, dt); else drawRiver(c, dt);
  c.restore();
});
render();
</script>
</body>
</html>
