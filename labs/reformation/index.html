  c.save(); c.lineCap = 'round'; c.lineWidth = 7; const g = c.createLinearGradient(10, 0, 390, 0); g.addColorStop(0, '#e6a74d'); g.addColorStop(1, '#d9604f'); c.strokeStyle = g; c.globalAlpha = .55;
  c.beginPath(); for (let x = 20; x <= 380; x += 3) { const y = slotY(x); if (x === 20) c.moveTo(x, y); else c.lineTo(x, y); } c.stroke(); c.restore();
  EVORDER.forEach((id, i) => {
    const x = slotX(i), y = slotY(x), done = S.ord.includes(id), ev = t.ev[id], dir = i % 2 === 0 ? -1 : 1;
    if (!done) {
      const sh = Math.sin((time - S.shakeAt) * 40) * 3 * Math.max(0, 1 - (time - S.shakeAt) * 3);
      c.fillStyle = 'rgba(14,17,30,.88)'; c.beginPath(); c.arc(x + sh, y, 17, 0, 7); c.fill(); c.strokeStyle = 'rgba(180,190,225,.5)'; c.lineWidth = 1.6; c.setLineDash([4, 3]); c.stroke(); c.setLineDash([]);
      fnt(c, 14, 800); c.fillStyle = '#aab2d0'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(i + 1), x + sh, y + 1);
      return;
    }
    const u = ease((time - (S.snapAt[id] ?? -9)) / .6), r = 17 * (1 + .35 * Math.sin(Math.PI * u));
    const gg = c.createRadialGradient(x - 5, y - 6, 2, x, y, r + 2); gg.addColorStop(0, '#fff1c8'); gg.addColorStop(1, '#e0a24a'); c.fillStyle = gg; c.beginPath(); c.arc(x, y, Math.max(0, r), 0, 7); c.fill(); c.strokeStyle = '#8a5c18'; c.lineWidth = 1.5; c.stroke();
    c.font = `${F(18)}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000'; c.fillText(ev[2], x, y + 1);
    // label: the name wrapped to at most two lines, the years under it, on one dark box above or below the dot
    fnt(c, 12, 700); const lines = wrapText(c, ev[0], 112).concat(ev[1]), lh = F(16), bw = Math.max(...lines.map((l) => c.measureText(l).width)) + F(16), bh = lines.length * lh + F(10);
    const m = F(10), bx = Math.min(LAY.DW - m - bw, Math.max(m, x - bw / 2)), by = dir < 0 ? y - 26 - bh : y + 26;
    c.save(); c.globalAlpha = u; c.fillStyle = 'rgba(10,12,22,.84)'; rr(c, bx, by, bw, bh, F(9)); c.fill();
    c.strokeStyle = 'rgba(224,162,74,.55)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x, y + dir * 18); c.lineTo(x, dir < 0 ? by + bh : by); c.stroke();
    c.textAlign = 'center'; c.textBaseline = 'middle';
    lines.forEach((l, k) => { const last = k === lines.length - 1; c.fillStyle = last ? '#f0c56a' : '#fff'; c.fillText(l, bx + bw / 2, by + F(5) + lh * (k + .5)); });
    c.restore();
  });
  const a = easeIO((time - S.popAt) / .8);
  if (S.ord.length === 5 && a > 0) {
    c.save(); c.globalAlpha = a;
    const gap = 36, x0 = 38, fy = 292, h = 58, lostTrue = 4, g2 = S.pop;
    pill(c, t.y1600, 200, 214, { px: 12, wt: 800 });
    for (let i = 0; i < 10; i++) {
      const x = x0 + i * gap, fromEnd = 9 - i, guessed = fromEnd < g2;
      if (S.popRev && fromEnd < lostTrue) { const u = ease((time - S.popAt - 1.1 - fromEnd * .12) / .6); figure(c, x, fy, h, '#e2d7c4', null, 1 - u); figure(c, x, fy, h, '#3a3f55', 'rgba(150,160,200,.7)', u); }
      else figure(c, x, fy, h, '#e2d7c4', null, !S.popRev && guessed ? .3 : 1);
      if (guessed && (!S.popRev || g2 !== lostTrue)) figure(c, x, fy, h, null, '#f5c84c', .9);
    }
    if (S.popRev) {
      pill(c, t.y1650, 120, 320, { px: 12 });
      if (g2 !== lostTrue) pill(c, `${t.pguess}: ${g2}`, 322, 320, { px: 12, bg: 'rgba(245,200,76,.95)', color: '#2a1a06' });
      pill(c, `${t.lost} ≈ 4/10`, 322, g2 !== lostTrue ? 346 : 320, { px: 12, bg: 'rgba(58,63,85,.95)' });
    } else pill(c, t.ten, 200, 324, { px: 12, wt: 700, bg: 'rgba(10,12,22,.7)', color: '#aab2d0' });
    c.restore();
  }
}

// --- the shell -------------------------------------------------------------------------------------------------------
const lab = shell({ key: 'reformation', T, topics: TOPICS, views: ['theses', 'prince', 'wars'], onLang: () => render(), onView: () => render() });
const secret = secretLab('reformation', () => ({
  secrets: [{ emo: '📖', title: T[lang].sec.calvin[0], desc: T[lang].sec.calvin[1] }, { emo: '🏔️', title: T[lang].sec.torda[0], desc: T[lang].sec.torda[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="c1">
    <div class="row2" style="margin-top:0"><button class="chip" data-a="pay" id="payB"></button><button class="chip" data-a="again1" id="again1"></button></div>
    <div id="q1"><div class="rf-q" id="q1t"></div><div class="rf-opts" id="q1o"></div></div>
    <div class="chips" id="pts" style="margin-top:2px"></div>
  </div>
  <div id="c2">
    <div class="chips" id="fch"></div>
    <div id="q2"><div class="rf-q" id="q2t"></div><div class="rf-opts" id="q2o"></div></div>
    <div class="row2" id="secChips"></div>
  </div>
  <div id="c3">
    <div class="chips rf-deck" id="deck"></div>
    <div id="pop"><div class="rf-q" id="pq" style="margin-top:2px"></div>
      <input class="big" type="range" id="pg" min="0" max="10" step="1" aria-label="0–10">
      <div class="ends"><span>0</span><span>10</span></div>
      <div class="rf-guess"><button class="btn" data-a="chk" id="chkB"></button><span class="sub" id="pgv" style="color:var(--mut);font-weight:800"></span></div></div>
    <div class="row2" id="againRow"><button class="chip" data-a="again3" id="again3"></button></div>
  </div>`;

// --- render: one call per change ------------------------------------------------------------------------------------
const landName = (i) => T[lang].lands[i];
function nearestOther(from, f) { // the nearest land with faith f; else the nearest undecided; else the nearest of all
  const order = LANDS.map((l, i) => i).filter((i) => i !== from).sort((a, b) => dist(LANDS[from], LANDS[a]) - dist(LANDS[from], LANDS[b]));
  return order.find((i) => S.faith[i] === f) ?? order.find((i) => S.faith[i] === 0) ?? order[0];
}
function setFaith(i, f) {
  if (S.faith[i] !== f) { S.prev[i] = S.faith[i]; S.faith[i] = f; S.chAt[i] = now(); }
  S.vAns = null; S.vTo = -1;
}
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const optBtns = (arr) => arr.map((o, j) => `<button class="rf-opt" data-j="${j}">${esc(o)}</button>`).join('');

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v === 'prince' && S.sec === 'torda' ? 'torda' : v;
  $('c1').hidden = v !== 'theses'; $('c2').hidden = v !== 'prince'; $('c3').hidden = v !== 'wars';
  if (v === 'theses') renderTheses(t); else if (v === 'prince') renderPrince(t); else renderWars(t);
}
function renderTheses(t) {
  const th = t.th, rev = S.thAns !== null;
  lab.setGlow('rgba(224, 160, 90, .26)');
  $('payB').textContent = th.pay; $('payB').hidden = rev; $('again1').hidden = !rev; $('again1').textContent = th.again;
  $('q1').hidden = rev; $('q1t').textContent = th.q; $('q1o').innerHTML = optBtns(th.opts);
  $('pts').hidden = !rev; $('pts').innerHTML = !rev ? '' : th.chips.map((c, i) => `<button class="chip ${S.pt === i ? 'on' : ''}" data-a="pt" data-i="${i}">${esc(c)}</button>`).join('');
  if (!rev) {
    lab.setReadout(`🪙 ${S.coins}`, th.coins, S.coins ? th.letters(S.coins) : '', '#e0a05a');
    lab.setState({ emo: th.s0[0], title: th.s0[1], lead: th.s0[2], body: '', extra: '' });
    lab.setFacts([]);
  } else {
    lab.setReadout('95', th.sub, '1517', '#e0a05a');
    if (S.pt === null) lab.setState({ emo: S.thAns === th.ok ? '✅' : '🤔', title: S.thAns === th.ok ? th.right : th.wrong, lead: th.lead, body: th.body, extra: '' });
    else lab.setState({ emo: th.pts[S.pt][0], title: th.pts[S.pt][1], lead: th.pts[S.pt][2], body: '', extra: '' });
    lab.setFacts(th.f.map(([emo, text, src]) => ({ emo, text, src })));
  }
}
function renderPrince(t) {
  const p = t.pr, i = S.sel, f = S.faith[i], sec = S.sec;
  lab.setGlow('rgba(74, 163, 224, .24)');
  const fl = sec === 'calvin' ? [1, 2, 3] : [1, 2];
  $('fch').hidden = sec === 'torda';
  $('fch').innerHTML = fl.map((k) => `<button class="chip ${f === k ? 'on' : ''}" data-a="faith" data-f="${k}"><span class="rf-sw" style="background:${FC[k]}"></span>${esc(t.faith[k])}</button>`).join('');
  const un = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${un ? 'open' : ''} ${sec === k ? 'on' : ''}" data-a="sec" data-k="${k}">${un ? `${emo} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('calvin', '📖') + sc('torda', '🏔️');
  const asking = !sec && f && S.vAns === null;
  $('q2').hidden = !asking; if (asking) { $('q2t').textContent = p.q(landName(i)); $('q2o').innerHTML = optBtns(p.opts); }
  if (sec === 'torda') {
    const d = t.td, n = S.tf.length; lab.setReadout(n, d.val, d.sub, '#4fcfa8');
    lab.setState({ emo: d.s0[0], title: d.s0[1], lead: d.s0[2], body: d.s0[3], extra: '' });
    lab.setFacts(d.f.map(([emo, text, src]) => ({ emo, text, src }))); return;
  }
  const dec = S.faith.filter(Boolean).length, nl = S.faith.filter((x) => x === 1).length, nc = S.faith.filter((x) => x === 2).length, nr = S.faith.filter((x) => x === 3).length;
  lab.setReadout(`${dec}/${LANDS.length}`, p.val, `${t.faith[1]} ${nl} · ${t.faith[2]} ${nc}${nr ? ` · ${t.faith[3]} ${nr}` : ''}`, '#4aa3e0');
  if (sec === 'calvin' && S.geneva) { const g = t.cv.g; lab.setState({ emo: g[0], title: g[1], lead: g[2], body: g[3], extra: '' }); }
  else if (sec === 'calvin' && f === 3) { const r = t.cv.r(landName(i)); lab.setState({ emo: r[0], title: r[1], lead: r[2], body: '', extra: '' }); }
  else if (sec === 'calvin' && !f) lab.setState({ emo: t.cv.s0[0], title: t.cv.s0[1], lead: t.cv.s0[2], body: '', extra: '' });
  else if (!f) lab.setState({ emo: p.s0[0], title: p.s0[1](landName(i)), lead: p.s0[2], body: '', extra: `<div class="rf-note">${esc(p.inn.bc)}</div>` });
  else if (S.vAns === null) { const s = p.s1(landName(i), f); lab.setState({ emo: s[0], title: s[1], lead: s[2], body: sec ? '' : p.s1b, extra: `<div class="rf-note">${esc(p.inn.bc)} ${esc(p.inn.caps[f])}</div><div class="rf-note">${esc(p.map)}</div>` }); }
  else lab.setState({ emo: S.vAns === p.ok ? '✅' : '🤔', title: S.vAns === p.ok ? p.right : p.wrong, lead: p.rl, body: p.rb, extra: `<div class="rf-note">${esc(p.inn.bc)} ${esc(p.inn.caps[f])}</div>` });
  const fs = sec === 'calvin' ? t.cv.f : (S.vAns === null ? p.f.slice(0, 1) : p.f);
  lab.setFacts(fs.map(([emo, text, src]) => ({ emo, text, src })));
}
function renderWars(t) {
  const w = t.wr, k = S.ord.length, all = k === 5;
  lab.setGlow('rgba(217, 96, 79, .24)');
  $('deck').hidden = all; $('deck').innerHTML = S.deck.filter((id) => !S.ord.includes(id)).map((id) => `<button class="chip" data-a="ev" data-id="${id}">${w.ev[id][2]} ${esc(w.ev[id][0])}</button>`).join('');
  $('pop').hidden = !all; $('pq').textContent = w.pq; $('pg').value = S.pop; $('pg').disabled = S.popRev; $('pgv').textContent = w.pg(S.pop);
  $('chkB').textContent = w.chk; $('chkB').hidden = S.popRev;
  $('againRow').hidden = !all; $('again3').textContent = w.again;
  if (!all) {
    lab.setReadout(`${k}/5`, w.val, '', '#d9604f');
    const last = S.ord[k - 1];
    if (S.noMsg) lab.setState({ emo: w.no[0], title: w.no[1], lead: w.no[2], body: '', extra: '' });
    else if (last) lab.setState({ emo: w.ev[last][2], title: `${w.ev[last][0]} · ${w.ev[last][1]}`, lead: w.ev[last][3], body: '', extra: '' });
    else lab.setState({ emo: w.w0[0], title: w.w0[1], lead: w.w0[2], body: '', extra: '' });
    lab.setFacts([]);
  } else if (!S.popRev) {
    lab.setReadout(w.pg(S.pop), w.pguess, '', '#d9604f');
    lab.setState({ emo: w.done[0], title: w.done[1], lead: w.done[2], body: '', extra: '' });
    lab.setFacts(w.f.map(([emo, text, src]) => ({ emo, text, src })));
  } else {
    const okG = Math.abs(S.pop - 4) <= 1;
    lab.setReadout('≈ 4 / 10', w.rsub, '≈ 40%', '#d9604f');
    lab.setState({ emo: okG ? '✅' : '🤔', title: (okG ? w.right : w.wrong)(4), lead: w.rl, body: '', extra: '' });
    lab.setFacts(w.f2.map(([emo, text, src]) => ({ emo, text, src })));
  }
}

// --- controls -------------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const a = b.dataset.a, th = T[lang].th, p = T[lang].pr;
  if (a === 'pay') { S.coins++; S.flights.push({ t0: now() }); sfx.click(); setTimeout(() => sfx.tick(), 650); }
  else if (b.classList.contains('rf-opt') && b.closest('#q1')) { S.thAns = +b.dataset.j; S.revAt = now(); S.pt = null; (S.thAns === th.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'pt') { S.pt = +b.dataset.i; sfx.click(); }
  else if (a === 'again1') { resetTheses(); sfx.click(); }
  else if (a === 'faith') { setFaith(S.sel, +b.dataset.f); S.geneva = false; sfx.snap(); }
  else if (b.classList.contains('rf-opt') && b.closest('#q2')) {
    S.vAns = +b.dataset.j; S.vAt = now(); S.vTo = nearestOther(S.sel, S.faith[S.sel] === 1 ? 2 : 1);
    const want = S.faith[S.vTo] ? S.faith[S.vTo] : 0, other = S.faith[S.sel] === 1 ? 2 : 1;
    if (want !== other) { S.prev[S.vTo] = S.faith[S.vTo]; S.faith[S.vTo] = other; S.chAt[S.vTo] = now() + 1.6; }
    (S.vAns === p.ok ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'sec') {
    const k = b.dataset.k; if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.geneva = false; S.vAns = null; sfx.click();
  } else if (a === 'ev') {
    const id = b.dataset.id, k = S.ord.length;
    if (EVORDER[k] === id) { S.ord.push(id); S.snapAt[id] = now(); S.noMsg = false; sfx.good(); if (S.ord.length === 5) { S.popAt = now() + .3; showStage(); } }
    else { S.noMsg = true; S.shakeAt = now(); sfx.bad(); }
  } else if (a === 'chk') { S.popRev = true; S.popAt = Math.min(S.popAt, now() - 1); S.popAt = now() - 1; (Math.abs(S.pop - 4) <= 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'again3') { newDeck(); S.popAt = -9; sfx.click(); }
  render();
});
$('pg').addEventListener('input', (ev) => { S.pop = +ev.target.value; render(); });

// tapping the picture: pick a land / Geneva (prince), cycle a village (Torda)
$('cv').addEventListener('click', (ev) => {
  if (lab.view !== 'prince') return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - LAY.ox) / LAY.K, y = (ev.clientY - r.top - LAY.oy) / LAY.K, pt = { x, y };
  if (S.sec === 'torda') {
    let best = -1, bd = 60; VILL.forEach(([vx, vy], i) => { const d = Math.hypot(x - vx, y - vy); if (d < bd) { bd = d; best = i; } });
    if (best < 0) return; S.tSel = best; S.tf[best] = (S.tf[best] + 1) % 4; S.tAt[best] = now(); sfx.snap(); render(); return;
  }
  if (S.sec === 'calvin' && dist(pt, GENEVA) < 28) { S.geneva = true; sfx.click(); render(); return; }
  let best = -1, bd = 1e9; LANDS.forEach((l, i) => { const d = dist(pt, l); if (d < bd) { bd = d; best = i; } });
  if (best < 0 || (bd > 80 && !inPoly(x, y))) return;
  S.sel = best; S.geneva = false; S.vAns = null; sfx.tick(); render();
});

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'theses') framed(c, w, h, 'theses', () => drawTheses(c, now()));
  else if (v === 'prince') framed(c, w, h, S.sec === 'torda' ? 'torda' : 'prince', () => (S.sec === 'torda' ? drawTorda(c, now()) : drawMap(c, now())));
  else framed(c, w, h, 'wars', () => drawWars(c, now()));
});
render();
</script>
