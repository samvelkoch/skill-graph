  } else {
    $('pcLl').textContent = t.light; $('pcLv').textContent = `${S.light} %`;
    $('pcL').disabled = !predicted; $('pcL').value = S.light;
    if (predicted) lab.setReadout(esc(t.sugar(sugarOf())), t.illus, t.roots0, ACCENT.light);
    else lab.setReadout('?', '', '', ACCENT.light);
  }

  // the state card never gives the answer while a prediction is open
  if (S.sec) {
    const a = S.sec === 'a';
    lab.setState({ emo: a ? '🔬' : '🧅', title: t.secrets[S.sec][0], lead: a ? t.hookeText : t.onionText, body: '', extra: '' });
  } else if (!predicted) lab.setState({ emo: '🤔', title: t[PRED[v].ask], lead: '', body: '', extra: '' });
  else { const [emo, title, lead, body] = t.st[v]; lab.setState({ emo, title, lead, body, extra: '' }); }
  lab.setFacts(predicted ? t.facts[v] : []);
}
render();
</script>
