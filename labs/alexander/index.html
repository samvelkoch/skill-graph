const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function toDesign(ev) { const r = $('cv').getBoundingClientRect(); return [(ev.clientX - r.left - LAYOUT.ox) / LAYOUT.s, (ev.clientY - r.top - LAYOUT.oy) / LAYOUT.s]; }
$('cv').addEventListener('pointerdown', (ev) => {
  const key = VIEWKEY(), [x, y] = toDesign(ev);
  if (key === 'march') {
    if (!S.p1) { for (const k of ['egypt', 'persia', 'india']) { const [gx, gy] = GUESS_AT[k]; if (Math.hypot(x - gx, y - gy) < 26) return pick1(k); } }
    else if (y > 236 && y < 280) { S.E = clamp(E0 + (x - 24) / 312 * (EMAX - E0), E0, EMAX); S.playing = false; sfx.tick(); syncMarch(); render(); }
  } else if (key === 'queen' && S.p3) {
    for (let i = 0; i < 5; i++) if (Math.hypot(x - NODEX(i), y - 262) < 26) { setNode(i); return; }
  } else if (key === 'secb') {
    for (const a of ALEX) if (Math.hypot(x - a.p[0], y - a.p[1]) < 24) { if (!S.found.includes(a.id)) { S.found.push(a.id); S.foundT[a.id] = now(); sfx.good(); render(); } return; }
  }
});

function pick3(k) { if (S.p3) return; S.p3 = k; store.set(KEY + 'p3', k); S.node = 3; S.nodeT = now(); (k === 'first' ? sfx.good : sfx.bad)(); showStage(); render(); }

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'g1') pick1(v);
  else if (a === 'g2') pick2(v);
  else if (a === 'g3') pick3(v);
  else if (a === 'play') { if (S.E >= EMAX - 0.01) { S.E = E0; S.playing = true; } else S.playing = !S.playing; sfx.click(); }
  else if (a === 'stage') { S.st = +v; sfx.click(); }
  else if (a === 'cprev') setNode(S.node - 1);
  else if (a === 'cnext') setNode(S.node + 1);
  else if (a === 'golock') { const to = lockOf(lab.view); $('views').querySelector(`[data-view="${to}"]`)?.click(); return; }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === v ? null : v; sfx.click(); }
  else if (a === 'night') { S.night = !S.night; sfx.click(); }
  else if (a === 'lib') { S.lib = !S.lib; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'eR') { S.E = clamp(+ev.target.value, E0, EMAX); S.playing = false; render(); }
  else if (ev.target.id === 'sR') { S.st = clamp(+ev.target.value, 0, 2); render(); }
});

// --- render: controls, readout, state card and facts for the current picture ----------------------------------------
const optBtns = (act, order, labels, mine) => order.map((k) => `<button class="al-opt${mine === k ? ' mine' : ''}" data-act="${act}" data-v="${k}"${mine ? ' disabled' : ''}>${esc(labels[k])}</button>`).join('');
function render() {
  const t = T[lang], key = VIEWKEY(), v = lab.view;
  document.body.dataset.v = key;
  $('vMarch').hidden = key !== 'march'; $('vAfter').hidden = key !== 'after'; $('vQueen').hidden = key !== 'queen'; $('vLock').hidden = key !== 'lock';
  $('vSecA').hidden = key !== 'seca'; $('vSecB').hidden = key !== 'secb';
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-v="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('a', '🗼') + sc('b', '🏙️');
  if (key === 'seca') renderSecA(t); else if (key === 'secb') renderSecB(t);
  else if (key === 'lock') renderLock(t, v);
  else if (key === 'march') renderMarch(t); else if (key === 'after') renderAfter(t); else renderQueen(t);
}
function renderLock(t, v) {
  const need = lockOf(v);
  lab.setGlow('rgba(143, 127, 208, .26)');
  $('lkQ').textContent = t.lock.msg; $('lkGo').textContent = `${t.lock.go}: ${t.views[need]}`;
  lab.setReadout('🔒', '', '', '#8f7fd0');
  lab.setState({ emo: '🔒', title: t.lock.card, lead: t.lock.cardLead, body: '', extra: '' });
  lab.setFacts([]);
}
function renderMarch(t) {
  const m = t.m, asked = !!S.p1;
  lab.setGlow('rgba(95, 168, 160, .26)');
  $('mQ').hidden = asked; $('mOpts').hidden = asked; $('mPlay').hidden = !asked;
  if (!asked) {
    $('mQ').textContent = m.q;
    $('mOpts').innerHTML = optBtns('g1', ['egypt', 'persia', 'india'], t.places, null);
    lab.setReadout('?', m.preSub, '', '#e0b050');
    lab.setState({ emo: '🤔', title: m.preT, lead: m.preL, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  const ok = S.p1 === 'india', y = yearOf(S.E);
  $('mV').className = `al-verdict ${ok ? 'good' : 'bad'}`;
  $('mV').textContent = `${ok ? m.right : m.wrong} ${ok ? m.rightL : m.wrongL} (${m.yours}: ${t.places[S.p1]})`;
  $('eL').textContent = m.year; $('eV').textContent = bcY(y);
  $('playB').textContent = S.playing ? m.pause : S.E >= EMAX - 0.01 ? m.again : m.play;
  syncMarch();
  lab.setState({ emo: y === 323 ? '⚰️' : '🐎', title: bcY(y), lead: m.ev[y], body: '', extra: '' });
  lab.setFacts(t.facts.m);
  refreshMarch();
}
function refreshMarch() {
  const t = T[lang], m = t.m; if (!S.p1) return;
  const km = fmt(distAt(S.E)), y = yearOf(S.E);
  lab.setReadout(m.km(km < 50 ? 0 : numFmt(km)), m.sub, bcY(y), '#e0b050');
}
function renderAfter(t) {
  const a = t.a, asked = !!S.p2;
  lab.setGlow('rgba(143, 127, 208, .26)');
  $('aQ').hidden = asked; $('aOpts').hidden = asked; $('aPlay').hidden = !asked;
  if (!asked) {
    $('aQ').textContent = a.q;
    $('aOpts').innerHTML = optBtns('g2', ['stay', 'split', 'persia'], a.opts, null);
    lab.setReadout('?', '', '', '#8f7fd0');
    lab.setState({ emo: '🤔', title: a.preT, lead: a.preL, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  const ok = S.p2 === 'split', idx = Math.round(clamp(S.st, 0, 2));
  $('aV').className = `al-verdict ${ok ? 'good' : 'bad'}`;
  $('aV').textContent = `${ok ? a.right : a.wrong} ${ok ? a.rightL : a.wrongL}`;
  $('sL').textContent = t.m.year; $('sV').textContent = a.yrs[idx];
  const sr = $('sR'); if (+sr.value !== S.st) sr.value = S.st;
  $('sChips').innerHTML = a.chips.map((l, i) => `<button class="chip ${i === idx ? 'on' : ''}" data-act="stage" data-v="${i}">${esc(l)}</button>`).join('');
  lab.setReadout(a.yrs[idx], '', t.approx, '#8f7fd0');
  const extra = idx === 2 ? `<div class="al-fine" style="margin-top:0">${esc(a.wordsHead)}</div><div class="al-words">${a.words.map(([g, l]) => `<span class="al-w"><i>${g}</i> → ${esc(l)}</span>`).join('')}</div>` : '';
  lab.setState({ emo: ['🏛️', '⚔️', '🗺️'][idx], title: a.st[idx][0], lead: a.st[idx][1], body: '', extra });
  lab.setFacts(t.facts.a);
}
function renderQueen(t) {
  const q = t.c, asked = !!S.p3;
  lab.setGlow('rgba(217, 130, 95, .26)');
  $('cQ').hidden = asked; $('cOpts').hidden = asked; $('cPlay').hidden = !asked;
  if (!asked) {
    $('cQ').textContent = q.q;
    $('cOpts').innerHTML = optBtns('g3', ['all', 'first', 'none'], q.opts, null);
    lab.setReadout('?', '', '', '#d9825f');
    lab.setState({ emo: '🤔', title: q.preT, lead: q.preL, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  const ok = S.p3 === 'first', nd = q.nodes[S.node];
  $('cV').className = `al-verdict ${ok ? 'good' : 'bad'}`;
  $('cV').textContent = `${ok ? q.right : q.wrong} ${ok ? q.rightL : q.wrongL}`;
  $('cPrev').textContent = q.prev; $('cNext').textContent = q.next;
  $('cPrev').disabled = S.node <= 0; $('cNext').disabled = S.node >= 4; $('cFine').textContent = q.not;
  lab.setReadout(nd.y, nd.n, '', '#d9825f');
  lab.setState({ emo: ['🤴', '📚', '📉', '👑', '🦅'][S.node], title: nd.n, lead: nd.t, body: nd.y, extra: '' });
  lab.setFacts(t.facts.c);
}
function renderSecA(t) {
  const s = t.sa;
  lab.setGlow('rgba(224, 176, 80, .26)');
  $('saChips').innerHTML = `<button class="chip ${S.night ? '' : 'on'}" data-act="night">${esc(S.night ? s.night : s.day)}</button><button class="chip ${S.lib ? 'on' : ''}" data-act="lib">${esc(S.lib ? s.libC : s.lib)}</button>`;
  lab.setReadout(S.lib ? '📜' : '🗼', '', '', '#e0b050');
  lab.setState(S.lib ? { emo: '📜', title: s.lT, lead: s.lL, body: '', extra: '' } : { emo: '🗼', title: s.tT, lead: s.tL, body: '', extra: '' });
  lab.setFacts(t.facts.sa);
}
function renderSecB(t) {
  const sb = t.sb, k = S.found.length, n = ALEX.length, done = k === n;
  lab.setGlow('rgba(95, 168, 160, .26)');
  $('sbQ').textContent = sb.found(k, n);
  const list = S.found.map((id) => `<div>${esc(sb.names[id])}</div>`).join('');
  lab.setReadout(`${k}/${n}`, sb.found(k, n), '', '#5fa8a0');
  lab.setState(done ? { emo: '🏙️', title: sb.doneT, lead: sb.doneL, body: '', extra: list }
    : { emo: '🔎', title: sb.t, lead: sb.l, body: '', extra: list });
  lab.setFacts(done ? t.facts.sb : []);
}

// --- the loop ---------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  // animation of state
  if (S.playing && lab.view === 'march' && !S.sec && S.p1) {
    S.E = Math.min(EMAX, S.E + dt * 0.95);
    if (S.E >= EMAX) { S.playing = false; render(); }
    else { syncMarch(); const k = yearOf(S.E); if (k !== S.yk) { S.yk = k; render(); } else refreshMarch(); }
  }
  S.stv += (S.st - S.stv) * Math.min(1, dt * 6);
  S.nightV += ((S.night ? 1 : 0) - S.nightV) * Math.min(1, dt * 4);
  S.libV += ((S.lib ? 1 : 0) - S.libV) * Math.min(1, dt * 5);
  const key = VIEWKEY(), [W, H] = DESIGN[key], s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  LAYOUT = { s, ox, oy };
  backdrop(c, w, h, BG[key][0], BG[key][1]);
  CW = W;
  c.save(); c.translate(ox, oy); c.scale(s, s);
  c.lineJoin = 'round'; c.lineCap = 'round';
  DRAW[key](c, W, H, time);
  c.restore();
});
render();
</script>
</body>
