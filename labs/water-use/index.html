  if (fk > 0) { c.save(); c.globalAlpha = fk; c.font = '26px "Apple Color Emoji", "Segoe UI Emoji", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000';
    c.fillText('🐟', cx - rx * .3 + Math.cos(time * .8) * 14, cy + Math.sin(time * 1.3) * 6); c.fillText('🐟', cx + rx * .15 + Math.cos(time * .6 + 2) * 12, cy + ry * .3 + Math.sin(time + 1) * 5); c.restore(); }
  c.restore();
  pill(c, '2005', 14, 20, { size: 15, align: 'left' });

function drawShip(c, w, h, dt, time) {
  const sh = S.sh; if (sh.go) sh.t = Math.min(1, sh.t + dt / 3.6);
  if (sh.go && sh.t >= 1 && !sh.done) { sh.done = true; render(); }
  const hz = h * .55, p = ease.inOut(sh.t);
  c.save(); rr(c, 0, 0, w, h, 18); c.clip();
  let g = c.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, '#6fb8ee'); g.addColorStop(1, '#d9f0ff'); c.fillStyle = g; c.fillRect(0, 0, w, hz);
  g = c.createLinearGradient(0, hz, 0, h); g.addColorStop(0, '#2f8ad8'); g.addColorStop(1, '#17508f'); c.fillStyle = g; c.fillRect(0, hz, w, h - hz);
  c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1.5; for (let r = 0; r < 4; r++) for (let k = 0; k < 6; k++) { const px = ((k * 0.19 + r * .07 + time * .01 * (r + 1)) % 1.05) * w, py = hz + 14 + r * (h - hz - 20) / 4; c.beginPath(); c.moveTo(px, py); c.quadraticCurveTo(px + 8, py - 3 + Math.sin(time * 2 + k + r) * 1.5, px + 16, py); c.stroke(); }
  // wet country on the left: hill, wheat, rain
  g = c.createLinearGradient(0, hz - 30, 0, hz + 20); g.addColorStop(0, '#7fcf5c'); g.addColorStop(1, '#3f8f3a'); c.fillStyle = g; c.beginPath(); c.moveTo(0, hz - 34); c.quadraticCurveTo(w * .15, hz - 40, w * .27, hz + 6); c.lineTo(w * .27, hz + 12); c.lineTo(0, hz + 12); c.fill();
  c.strokeStyle = '#e8c04a'; c.lineWidth = 2; for (let k = 0; k < 9; k++) { const px = 8 + k * 9, py = hz - 14 + Math.min(10, k * 1.2); c.beginPath(); c.moveTo(px, py + 10); c.lineTo(px + Math.sin(time * 2 + k) * 1.2, py - 6); c.stroke(); c.fillStyle = '#f2d466'; c.beginPath(); c.ellipse(px, py - 8, 2, 4, 0, 0, 7); c.fill(); }
  c.fillStyle = '#f2f6fc'; for (const [dx, dy, r] of [[0, 0, 15], [16, -5, 18], [34, 1, 14], [18, 6, 15]]) { dot(c, w * .1 + dx, 34 + dy, r); c.fill(); }
  c.strokeStyle = '#6fb0f0'; c.lineWidth = 2; c.lineCap = 'round'; for (let k = 0; k < 8; k++) { const q = (time * .9 + k / 8) % 1, px = w * .1 - 6 + k * 7; c.beginPath(); c.moveTo(px, 52 + q * 40); c.lineTo(px - 2, 60 + q * 40); c.stroke(); }
  // dry country on the right: dunes, sun, cracks
  g = c.createLinearGradient(0, hz - 20, 0, hz + 20); g.addColorStop(0, '#e8c98e'); g.addColorStop(1, '#c79a5e'); c.fillStyle = g; c.beginPath(); c.moveTo(w, hz - 30); c.quadraticCurveTo(w * .84, hz - 36, w * .74, hz + 6); c.lineTo(w * .74, hz + 12); c.lineTo(w, hz + 12); c.fill();
  c.strokeStyle = 'rgba(120,80,40,.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(w * .8, hz); c.lineTo(w * .84, hz - 6); c.lineTo(w * .9, hz - 2); c.moveTo(w * .84, hz - 6); c.lineTo(w * .86, hz - 14); c.stroke();
  const sg = c.createRadialGradient(w * .86, 34, 2, w * .86, 34, 40); sg.addColorStop(0, '#fff3a8'); sg.addColorStop(.35, '#ffd24a'); sg.addColorStop(1, 'rgba(255,210,74,0)'); c.fillStyle = sg; c.fillRect(w * .6, 0, w * .4, 90);
  // the grain ship
  const sw = Math.min(120, w * .3), sx = lerp(w * .06, w * .94 - sw, p), sy = hz + 16 + Math.sin(time * 2) * 2, sc = sw / 120;
  c.save(); c.translate(sx, sy); c.scale(sc, sc);
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(60, 30, 56, 5, 0, 0, 7); c.fill();
  const hg = c.createLinearGradient(0, 0, 0, 28); hg.addColorStop(0, '#c0413a'); hg.addColorStop(1, '#7a2220'); c.fillStyle = hg;
  c.beginPath(); c.moveTo(0, 2); c.lineTo(120, 2); c.lineTo(104, 28); c.lineTo(14, 28); c.closePath(); c.fill(); c.lineWidth = 2; c.strokeStyle = '#3d1210'; c.stroke();
  c.fillStyle = '#f4f4f4'; c.fillRect(8, 8, 104, 3);
  const gg = c.createLinearGradient(0, -22, 0, 2); gg.addColorStop(0, '#ffe58a'); gg.addColorStop(1, '#d9a93a'); c.fillStyle = gg; c.beginPath(); c.moveTo(6, 2); c.quadraticCurveTo(34, -34, 74, 2); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#9a7220'; c.stroke();
  c.fillStyle = '#f4f6fa'; c.fillRect(82, -20, 26, 22); c.strokeStyle = '#7d8ba6'; c.lineWidth = 1.5; c.strokeRect(82, -20, 26, 22); c.fillStyle = '#e5484d'; c.fillRect(88, -30, 8, 10); c.fillStyle = '#3d6fa8'; for (let k = 0; k < 3; k++) c.fillRect(86 + k * 7, -14, 5, 5);
  c.restore();
  c.restore();
  pill(c, T[lang].tons, sx + sw * .35, sy - 38 * sc - 8, { size: 12 });
  if (sh.go) { pill(c, T[lang].bn(Math.round(110 * p)), w / 2, 22, { size: 16, bg: 'rgba(8,10,18,.88)' }); if (!sh.done) lab.setReadout(T[lang].bn(Math.round(110 * p)), '', '🚢', '#5fd0c8'); }
}

// --- loop ----------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h; c.lineJoin = 'round';
  if (S.sec === 'dam') drawDam(c, w, h, dt, time);
  else if (S.sec === 'ship') drawShip(c, w, h, dt, time);
  else if (lab.view === 'split') drawSplit(c, w, h, dt, time);
  else if (lab.view === 'hidden') drawHidden(c, w, h, dt, time);
  else drawAral(c, w, h, dt, time);
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('spSlide').addEventListener('input', (ev) => { S.sp.guess = +ev.target.value; $('spGuess').textContent = T[lang].farmsGuess(S.sp.guess); sfx.tick(); });
$('arSlide').addEventListener('input', (ev) => { if (S.ar.run) return; S.ar.t = +ev.target.value; sfx.tick(); render(); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, sp = S.sp, hd = S.hd, ar = S.ar;
  if (act === 'check') { if (sp.revealed) return; sp.revealed = true; sp.ok = Math.abs(sp.guess - 69) <= 10; (sp.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'region') { sp.region = b.dataset.k; sp.switched = true; sfx.click(); }
  else if (act === 'hpick') { if (hd.pick !== null) return; hd.pick = +b.dataset.k; hd.T = 0; hd.pop = 0; hd.done = false; sfx.click(); showStage(); }
  else if (act === 'hnext') {
    if (hd.i >= 6) { Object.assign(hd, { i: 0, pick: null, T: 0, done: false, pop: 0, chartT: 0 }); sfx.click(); }
    else { hd.i++; hd.pick = null; hd.T = 0; hd.done = false; hd.pop = 0; hd.chartT = 0; sfx.click(); }
  }
  else if (act === 'apick') { if (ar.pick !== null) return; ar.pick = +b.dataset.k; ar.run = true; ar.clock = 0; sfx.click(); showStage(); }
  else if (act === 'dam') { S.dam.built = true; sfx.snap(); showStage(); }
  else if (act === 'spick') { if (S.sh.pick !== null) return; S.sh.pick = +b.dataset.k; sfx.click(); }
  else if (act === 'sail') { if (S.sh.pick === null || S.sh.go) return; S.sh.go = true; sfx.push(); showStage(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null;
    else {
      S.sec = k; const v = k === 'dam' ? 'aral' : 'hidden';
      if (lab.view !== v) { lab.view = v; lab.renderChrome(); }
      if (k === 'dam') S.dam = { built: false, t: 0 }; else S.sh = { pick: null, go: false, t: 0, done: false };
    }
    sfx.click(); showStage();
  }
  render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------------
const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
function optButtons(id, labels, act, picked, right, reveal = true) {
  $(id).innerHTML = labels.map((l, i) => {
    const cls = picked === null ? '' : !reveal ? (i === picked ? ' sel' : ' dim') : i === right ? ' good' : i === picked ? ' bad' : ' dim';
    return `<button class="wu-opt${cls}" data-act="${act}" data-k="${i}"${picked === null ? '' : ' disabled'}>${esc(l)}</button>`;
  }).join('');
}
function readHidden(frac) { // litres run up while the tubs fill
  const t = T[lang], hd = S.hd, P = PRODUCTS[hd.i], N = P.L / TUB, f = clamp01(frac);
  const n = N * f, txt = N < 10 ? dec(Math.round(n * 10) / 10) : Math.round(n);
  lab.setReadout(t.litres(fmt(P.L * f)), cap(t.products[P.k]), t.tubCount(txt), '#5fd0c8');
}
function render() {
  const t = T[lang], v = lab.view, sp = S.sp, hd = S.hd, ar = S.ar;

  document.body.dataset.v = S.sec ? 'sec-' + S.sec : v;
  const sec = S.sec;
  show('wuSplit', !sec && v === 'split'); show('wuHidden', !sec && v === 'hidden'); show('wuAral', !sec && v === 'aral'); show('wuDam', sec === 'dam'); show('wuShip', sec === 'ship');
  const open = secret.unlocked();
  $('wuSecs').innerHTML = [['dam', '🧱'], ['ship', '🚢']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  let st, extra = `<div class="wu-fine">${esc(t.fine)}</div>`;
  if (sec === 'dam') {
    const d = S.dam; show('damBtn', true); $('damBtn').textContent = t.buildDam; $('damBtn').disabled = d.built; $('damTxt').textContent = d.built ? t.secretA : t.secrets.dam[1];
    lab.setReadout('2005', '', '🧱', '#e0a24a'); st = { emo: '🧱', title: t.secrets.dam[0], lead: d.built ? t.secretA : t.secrets.dam[1] };
    $('damTxt').style.display = '';
  } else if (sec === 'ship') {
    const sh = S.sh; $('shQ').textContent = t.shipQ; optButtons('shOpts', t.shipOpts, 'spick', sh.pick, 1, sh.done);
    show('sailBtn', true); $('sailBtn').textContent = t.sail; $('sailBtn').disabled = sh.pick === null || sh.go; show('shAfter', sh.done);
    $('shVerdict').textContent = sh.pick === 1 ? t.right : t.notQuite; $('shVerdict').className = 'wu-verdict ' + (sh.pick === 1 ? 'ok' : 'no');
    $('shMath').textContent = `${t.shipMath(fmt(6e7), fmt(1827), 110)}. ${t.secretB}`;
    lab.setReadout(sh.go ? t.bn(sh.done ? 110 : '…') : '?', '', '🚢', '#5fd0c8');
    st = { emo: '🚢', title: t.secrets.ship[0], lead: sh.done ? t.secretB : t.secrets.ship[1] };
  } else if (v === 'split') {
    show('spAsk', !sp.revealed); show('spDone', sp.revealed);
    $('spQ').textContent = t.splitQ; $('spGuess').textContent = t.farmsGuess(sp.guess); $('spCheck').textContent = t.check; $('spSlide').value = sp.guess;
    $('spVerdict').textContent = sp.ok ? t.right : t.notQuite; $('spVerdict').className = 'wu-verdict ' + (sp.ok ? 'ok' : 'no'); $('spEx').textContent = t.exSplit;
    $('spRegions').innerHTML = Object.entries(t.regions).map(([k, l]) => `<button class="chip ${sp.region === k ? 'on' : ''}" data-act="region" data-k="${k}">${esc(l)}</button>`).join('');
    $('spExR').textContent = sp.switched ? t.exRegion : ''; $('spExR').style.display = sp.switched ? '' : 'none';
    if (sp.revealed) lab.setReadout(`${SPLIT[sp.region][0]}%`, t.toFarms, t.regions[sp.region], '#3b9cf0'); else lab.setReadout('?', '', '', '#3b9cf0');
    st = { emo: '🚰', title: t.state[sp.revealed ? 'splitDone' : 'split0'][0], lead: t.state[sp.revealed ? 'splitDone' : 'split0'][1] };
  } else if (v === 'hidden') {
    const P = PRODUCTS[Math.min(hd.i, 5)], chart = hd.i >= 6, answered = hd.pick !== null;
    show('hdQ', !chart); show('hdOpts', !chart); $('hdQ').textContent = t.hiddenQ(t.products[P.k]);

    $('hdEx').textContent = chart ? '' : t.exHidden(cap(t.products[P.k]), fmt(P.L)); show('hdEx', !chart);
    $('hdDots').textContent = PRODUCTS.map((_, i) => (i < hd.i ? '●' : i === hd.i && !chart ? '◉' : '○')).join(' ');
    show('hdNext', chart || (answered && hd.done)); $('hdNext').textContent = chart ? t.again : t.next;
    if (chart) { const m = PRODUCTS[5]; lab.setReadout(t.litres(fmt(m.L)), cap(t.products[m.k]), t.tubCount(Math.round(m.L / TUB)), '#5fd0c8'); }
    else if (!answered) lab.setReadout('?', cap(t.products[P.k]), '', '#5fd0c8'); else readHidden(hd.done ? 1 : clamp01(hd.T / 3));
    st = { emo: '💧', title: t.state[chart ? 'hiddenDone' : 'hidden0'][0], lead: t.state[chart ? 'hiddenDone' : 'hidden0'][1] };

    $('arQ').textContent = t.aralQ; optButtons('arOpts', t.aralOpts, 'apick', null, 2);
    $('arSlide').disabled = ar.run || !asked; $('arSlide').value = ar.t;
    $('arTicks').innerHTML = YEARS.map((y) => `<span>${y}</span>`).join('');
    $('arVerdict').textContent = ar.pick === 2 ? t.right : t.notQuite; $('arVerdict').className = 'wu-verdict ' + (ar.pick === 2 ? 'ok' : 'no'); $('arEx').textContent = t.exAral;
    const i = Math.round(ar.t), nIcons = Math.ceil(FIELD_N[i] / 5), area = i === 0 ? `${t.area}: ${t.about68}` : i === 4 ? `${t.area}: ${t.km98}` : '—';
    lab.setReadout(String(YEARS[i]), area, t.cotton.replace('🌱', '🌱'.repeat(nIcons)), '#e0a24a');
    st = { emo: '🏜️', title: t.state[ar.done ? 'aralDone' : 'aral0'][0], lead: t.state[ar.done ? 'aralDone' : 'aral0'][1] };
  }
  lab.setState({ ...st, body: '', extra });
  lab.setFacts(t.facts[v]);
}
render();
