  [1000, 2000, 3000, 4000, 5000, ALT1].forEach((a) => { const y = yA(a); stroke(c, [[mx0 - 8, y], [mx0 - 2, y]], 1.5, 'rgba(255,255,255,.8)'); pill(c, `${a} m`, 4, y, { al: 'l', size: 12 }); });
  // 0 °C line, once the top has been shown
  if (S.mAns !== null) { const y = yA(ALT0 + T0 / LAPSE * 1000); c.setLineDash([5, 4]); stroke(c, [[mx0 + 30, y], [w - 6, y]], 1.3, 'rgba(150,230,255,.9)'); c.setLineDash([]); pill(c, T[lang].mt.zero, w - 6, y - 12, { al: 'r', col: '#a8e6ff' }); }
  // band names
  BANDS.forEach((b) => { const mid = (b.a + Math.min(b.b, ALT1)) / 2; if (S.mAns === null && mid > ALT_PRE - 50) return; pill(c, T[lang].mt.b[b.k][0], cx1 - W * 0.04, yA(mid), { size: 12 }); });
  // the cloud on the summits
  if (S.cloud > 0.003) {
    c.save(); c.globalAlpha = S.cloud;
    const cl = (cx, hwv, top) => {
      const yb = yA(CLOUD_ALT), x0 = cx - hwv - 10, x1 = cx + hwv + 10;
      c.fillStyle = LG(c, 0, top, 0, yb, [[0, '#f4f8fb'], [1, '#d9e4ec']]); c.fillRect(x0, top, x1 - x0, yb - top);
      const n = Math.max(3, Math.round((x1 - x0) / 26));
      for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n, r = 17 + 5 * Math.sin(i * 2.1 + t * 0.8); circ(c, x, yb, r, RG(c, x - r * 0.3, yb - r * 0.3, r * 0.1, x, yb, r, [[0, '#ffffff'], [1, '#cfdbe5']])); circ(c, x, top, r * 0.9, '#f4f8fb'); }
      for (let i = 0; i < 4; i++) { const y = top + (yb - top) * (i + 0.5) / 4; circ(c, x0, y, 15, '#eef3f8'); circ(c, x1, y, 15, '#eef3f8'); }
    };
    cl(cx1, hw1(af(CLOUD_ALT)), topY - 24); cl(cx2, hw2(af(CLOUD_ALT) / FM), yA(ALT0 + FM * (ALT1 - ALT0)) - 22);
    c.restore();
    if (S.cloud > 0.4) pill(c, T[lang].mt.cloud, cx1, topY + (yA(CLOUD_ALT) - topY) * 0.45, { size: 14 });
  }
  // the climber at the current height
  const f = af(S.altW), y = yA(S.altW), x = Math.min(w - 18, cx1 + hw1(f) - 5);
  c.setLineDash([4, 4]); stroke(c, [[mx0 - 2, y], [x - 8, y]], 1.2, 'rgba(255,255,255,.65)'); c.setLineDash([]);
  walker(c, x, y + 1, 0.95, 0, true);
  const info = `${Math.round(S.altW)} m · ${fmt(tempAt(S.altW))} °C`;
  pill(c, info, w - 6, clamp(y - 22, topY + 6, h - 20), { al: 'r', size: 13 });
}

// --- drawing: the secrets -------------------------------------------------------------------------------------------
function drawHot(c, w, h, dt, t) {
  const [hh, mm] = S.hot, zk = HOT[hh - 1][mm - 1], z = ZBY[zk];
  const hP = Math.round(clamp(h * 0.34, 130, 240));
  S.hotX += ((z.xa + z.xb) / 2 - S.hotX) * Math.min(1, dt * 6);
  const P = drawPano(c, w, hP, S.hotX); P.end();
  pill(c, T[lang].zn[zk][0], 12, 18, { al: 'l', size: 13 });
  const top = hP + 28, availH = h - top - 30, cs = Math.floor(clamp(Math.min(availH / 5, (w - 40) / 5), 28, 64));
  const ox = Math.round((w - cs * 5) / 2), oy = Math.round(top + (availH - cs * 5) / 2);
  S.grid = { ox, oy, cs };
  pill(c, T[lang].hot.ax[0], ox, oy - 14, { al: 'l' }); pill(c, T[lang].hot.ax[1], ox + cs * 5, oy + cs * 5 + 16, { al: 'r' });
  for (let r = 0; r < 5; r++) for (let q = 0; q < 5; q++) {
    const k = HOT[4 - r][q], zz = ZBY[k], x = ox + q * cs, y = oy + r * cs, on = 4 - r + 1 === hh && q + 1 === mm;
    rr(c, x + 1.5, y + 1.5, cs - 3, cs - 3, 8); c.fillStyle = LG(c, x, y, x + cs, y + cs, [[0, lite(zz.col, 0.22)], [1, dark(zz.col, 0.15)]]); c.fill();
    c.save(); c.globalAlpha = 1; c.font = `${Math.round(cs * 0.46)}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
    c.fillText(zz.emo, x + cs / 2, y + cs / 2 + 1); c.restore();
    if (on) { rr(c, x + 0.5, y + 0.5, cs - 1, cs - 1, 9); c.strokeStyle = '#fff'; c.lineWidth = 3.2; c.stroke(); rr(c, x - 2, y - 2, cs + 4, cs + 4, 11); c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.stroke(); }
  }
}
function blob(c, cx, cy, r, sd) {
  c.beginPath();
  for (let i = 0; i <= 64; i++) { const a = i / 64 * TAU, k = 1 + 0.1 * Math.sin(3 * a + sd) + 0.06 * Math.sin(5 * a + sd * 2) + 0.03 * Math.sin(9 * a + sd); const x = cx + Math.cos(a) * r * k, y = cy + Math.sin(a) * r * k * 0.92; if (i) c.lineTo(x, y); else c.moveTo(x, y); }
  c.closePath();
}
function drawIce(c, w, h, dt, t) {
  S.iceT += ((S.iceYear === 2007 ? 1 : 0) - S.iceT) * Math.min(1, dt * 4);
  c.fillStyle = LG(c, 0, 0, 0, h, [[0, '#0f1620'], [1, '#1d2636']]); c.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h * 0.5, R = Math.min(w, h) * 0.34;
  blob(c, cx, cy + 6, R * 1.62, 1); c.fillStyle = RG(c, cx - R * 0.4, cy - R * 0.5, R * 0.2, cx, cy, R * 1.7, [[0, '#4d4038'], [1, '#2a231f']]); c.fill();
  [1.5, 1.38].forEach((k, i) => { blob(c, cx, cy + 4, R * k, 1 + i); c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 1.2; c.stroke(); });
  blob(c, cx, cy, R * 1.24, 2); c.fillStyle = RG(c, cx - R * 0.5, cy - R * 0.6, R * 0.1, cx, cy, R * 1.3, [[0, '#8a7767'], [0.7, '#66564a'], [1, '#43372f']]); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1.5; c.stroke();
  const sc = Math.sqrt(lerp(1, 0.15, easeIO(S.iceT))), r2 = Math.sqrt(0.15);
  blob(c, cx, cy, R * sc, 3);
  c.fillStyle = RG(c, cx - R * 0.35 * sc, cy - R * 0.4 * sc, R * 0.05, cx, cy, R * sc * 1.1, [[0, '#ffffff'], [0.6, '#dcedf8'], [1, '#9ec6e2']]); c.fill();
  c.strokeStyle = 'rgba(90,140,180,.6)'; c.lineWidth = 1.2; c.stroke();
  c.save(); blob(c, cx, cy, R * sc, 3); c.clip();
  for (let i = 0; i < 7; i++) stroke(c, [[cx - R * 0.8 * sc + i * R * 0.27 * sc, cy - R * 0.9 * sc], [cx - R * 0.6 * sc + i * R * 0.27 * sc, cy + R * 0.9 * sc]], 1, 'rgba(120,170,210,.45)');
  c.restore();
  c.setLineDash([6, 5]); blob(c, cx, cy, R, 3); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.8; c.stroke();
  blob(c, cx, cy, R * r2, 3); c.strokeStyle = 'rgba(120,220,255,.95)'; c.stroke(); c.setLineDash([]);
  pill(c, '1912', cx, cy - R * 1.02 - 14, { size: 13 }); pill(c, '2007', cx, cy + R * r2 * 0.95 + 16, { size: 13, col: '#a8e6ff' });
  pill(c, T[lang].ice.note, cx, h - 18, { size: 12 });
}

function draw(c, w, h, dt, t) {
  CW = w; CH = h;
  // tweens
  const x0 = latToX(S.latW); S.latW += (S.lat - S.latW) * Math.min(1, dt * 9); if (Math.abs(S.lat - S.latW) < 0.01) S.latW = S.lat;
  S.phase += Math.abs(latToX(S.latW) - x0) * 0.35;
  if (S.go !== null) { const d = S.go - S.lat, st = 12 * dt; S.lat = Math.abs(d) <= st ? S.go : S.lat + Math.sign(d) * st; if (S.lat === S.go) S.go = null; S.dirty = true; $('nzWSl').value = 80 - S.lat; }
  if (S.wAns !== null && S.fog > 0) S.fog = Math.max(0, S.fog - dt * 1.3);
  S.altW += (S.alt - S.altW) * Math.min(1, dt * 10); if (Math.abs(S.alt - S.altW) < 0.5) S.altW = S.alt;
  if (S.mgo !== null) { const d = S.mgo - S.alt, st = 1100 * dt; S.alt = Math.abs(d) <= st ? S.mgo : S.alt + Math.sign(d) * st; if (S.alt === S.mgo) S.mgo = null; S.dirty = true; $('nzMSl').value = S.alt; }
  if (S.mAns !== null && S.cloud > 0) S.cloud = Math.max(0, S.cloud - dt * 1.2);
  S.pStripe += ((S.checked ? 1 : 0) - S.pStripe) * Math.min(1, dt * 3);
  if (S.dirty) { S.dirty = false; render(); }
  if (S.sec === 'hot') drawHot(c, w, h, dt, t);
  else if (S.sec === 'ice') drawIce(c, w, h, dt, t);
  else if (lab.view === 'walk') drawWalk(c, w, h, dt, t);
  else if (lab.view === 'place') drawPlace(c, w, h, dt, t);
  else drawMtn(c, w, h, dt, t);
}
canvasLoop($('cv'), draw);
render();
</script>
