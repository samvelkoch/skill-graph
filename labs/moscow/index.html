$('moYsG').addEventListener('input', (ev) => { if (S.gp !== 'free') return; S.y = +ev.target.value; S.playG = false; render(); });
$('moYsB').addEventListener('input', (ev) => { if (S.bp !== 'free') return; S.t = +ev.target.value; S.playB = false; render(); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-way], [data-jump], [data-sec], [data-kr]'); if (!b) return;
  if (b.dataset.way) { S.way = S.way === b.dataset.way ? null : b.dataset.way; sfx.click(); }
  else if (b.dataset.jump) { S.t = +b.dataset.jump; S.playB = false; sfx.click(); }
  else if (b.dataset.kr) { S.kr = +b.dataset.kr; sfx.click(); }
  else if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; S.kr = 0; S.krT = 0; sfx.click();
  } else if (b.dataset.act === 'playG') {
    if (S.gp !== 'free') return;
    if (S.playG) S.playG = false; else { if (S.y >= 1533) S.y = 1300; S.playG = true; }
    sfx.click();
  } else if (b.dataset.act === 'playB') {
    if (S.bp !== 'free') return;
    if (S.playB) S.playB = false; else { if (S.t >= 1480) { S.t = 1240; S.coins = []; } S.playB = true; }
    sfx.click();
  } else if (b.dataset.act === 'again') {
    Object.assign(W, { order: shuffled(7), idx: 0, cnt: { A: 0, B: 0 }, blocks: [], msg: null, busy: false }); sfx.click();
  }
  render();
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const v = lab.view;
  if (b.dataset.a !== undefined) { // an answer: index into the spec's list, where 0 is the right one
    if (v === 'gather') { S.ansG = +b.dataset.a; S.gp = 'ans'; } else { S.ansB = +b.dataset.a; S.bp = 'ans'; }
    (+b.dataset.a === 0 ? sfx.good : sfx.bad)();
  } else if (v === 'gather') { S.gp = 'run'; S.revT = nowS(); sfx.click(); showStage(); }
  else { S.bp = 'free'; S.playB = true; S.t = 1380; S.coins = []; S.spawn = 0; sfx.click(); showStage(); }
  render();
});

// --- one render per change: controls, readout and the state card ---------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  $('moG').style.display = v === 'gather' && !sec ? 'block' : 'none';
  $('moB').style.display = v === 'battles' && !sec ? 'block' : 'none';
  $('moW').style.display = v === 'why' && !sec ? 'block' : 'none';
  $('moA').style.display = sec === 'a' ? 'block' : 'none';
  $('moSec').innerHTML = [['a', '🏰'], ['b', '🦅']].map(([k, e]) => `<button class="chip mo-c secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('moKr').innerHTML = [[0, '1367'], [1, '1485–1495']].map(([k, l]) => `<button class="chip mo-c ${S.kr === k ? 'on' : ''}" data-kr="${k}">${l}</button>`).join('');
  askEl.hidden = true; whyEl.hidden = true;
  if (sec) {
    lab.setGauge(0, [], ''); lab.setFacts([]);
    lab.setGlow(sec === 'a' ? 'rgba(220, 215, 190, .22)' : 'rgba(201, 58, 46, .32)');
    lab.setReadout(sec === 'a' ? (S.kr ? '1485–1495' : '1367') : '1462–1505', '', '', sec === 'a' ? '#e8e0c4' : '#e8b84a');
    lab.setState({ emo: sec === 'a' ? '🏰' : '🦅', title: t.secrets[sec][0], lead: t.secrets[sec][1], body: '' });
    return;
  }
  if (v === 'gather') renderGather(t); else if (v === 'battles') renderBattles(t); else renderWhy(t);
}
const verdict = (ok, t) => `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.notQuite)}</div>`;
function renderGather(t) {
  const yr = yrOf(), free = S.gp === 'free', asking = S.gp === 'ask' || S.gp === 'ans';
  lab.setGlow('rgba(179, 38, 30, .26)');
  $('moYlG').textContent = `${t.year} ${asking ? '?' : yr}`;
  const ys = $('moYsG'); ys.disabled = !free; ys.value = String(clamp(yr, 1300, 1533)); ys.style.setProperty('--p', `${(clamp(yr, 1300, 1533) - 1300) / 233 * 100}%`);
  $('moPlayG').disabled = !free; $('moPlayG').textContent = `${S.playG ? '⏸' : '▶'} ${t.play}`;
  $('moWays').innerHTML = ['buy', 'inherit', 'war'].map((k) => `<button class="chip mo-c ${S.way === k ? 'on' : ''}" data-way="${k}">${esc(t.ways[k])}</button>`).join('');
  askEl.hidden = !asking;
  if (S.gp === 'ask') askEl.innerHTML = `<div class="q">${esc(t.qNext)}</div><div class="opts">${S.ordN.map((i) => `<button data-a="${i}">${esc(t.optsNext[i])}</button>`).join('')}</div>`;
  else if (S.gp === 'ans') askEl.innerHTML = `${verdict(S.ansG === 0, t)}<p>${esc(t.nextWhy)}</p><button class="btn" data-go="1">▶ ${esc(t.play)}</button>`;
  const last = [...JOINS].reverse().find((l) => l.at <= yr);
  if (asking) lab.setReadout('?', '', '', '#e0584f');
  else lab.setReadout(yr, last ? t.joins(t.lands[last.id]) : t.lands.moscow, '', '#e0584f');
  if (!free && !asking) lab.setState({ emo: S.ansG === 0 ? '✅' : '🤔', title: S.ansG === 0 ? t.right : t.notQuite, lead: t.nextWhy, body: '' });
  else lab.setState({ ...t.state.gather, body: t.state.gather.body });
  lab.setFacts(t.facts.gather);
}
function renderBattles(t) {
  const free = S.bp === 'free', asking = !free, tt = Math.floor(S.t);
  lab.setGlow('rgba(245, 200, 76, .2)');
  $('moYlB').textContent = `${t.year} ${asking ? '?' : tt}`;
  const ys = $('moYsB'); ys.disabled = !free; ys.value = String(clamp(tt, 1240, 1480)); ys.style.setProperty('--p', `${(clamp(tt, 1240, 1480) - 1240) / 240 * 100}%`);
  $('moPlayB').disabled = !free; $('moPlayB').textContent = `${S.playB ? '⏸' : '▶'} ${t.play}`;
  $('moJumps').innerHTML = free ? [[1380, '⚔️ 1380'], [1382, '🔥 1382'], [1480, '🏹 1480']].map(([y, l]) => `<button class="chip mo-c" data-jump="${y}">${l}</button>`).join('') : '';
  askEl.hidden = !asking;
  if (S.bp === 'ask') askEl.innerHTML = `<div class="q">${esc(t.qTribute)}</div><div class="opts">${S.ordT.map((i) => `<button data-a="${i}">${esc(t.optsTribute[i])}</button>`).join('')}</div>`;
  else if (S.bp === 'ans') askEl.innerHTML = `${verdict(S.ansB === 0, t)}<p>${esc(t.tributeWhy)}</p><button class="btn" data-go="1">▶ ${esc(t.play)}</button>`;
  if (asking) {
    lab.setReadout('?', '', '', '#f5c84c');
    lab.setState(S.bp === 'ask' ? { emo: '🤔', title: t.qTribute, lead: '', body: '' } : { emo: S.ansB === 0 ? '✅' : '🤔', title: S.ansB === 0 ? t.right : t.notQuite, lead: t.tributeWhy, body: '' });
    lab.setFacts([]);
  } else {
    lab.setReadout(tt, tt >= 1480 ? t.endDependence : t.tribute, '', '#f5c84c');
    lab.setState({ ...t.state.battles });
    lab.setFacts(tt >= 1480 ? t.facts.battles : []);
  }
}
function renderWhy(t) {
  const ci = cur(), done = W.idx >= 7, n = W.idx;
  lab.setGlow('rgba(95, 168, 160, .24)');
  whyEl.hidden = false;
  $('moAgain').textContent = `↻ ${t.again}`;
  $('moBinA').innerHTML = `<span>${esc(t.helped)}</span><i>${W.cnt.A}</i>`; $('moBinB').innerHTML = `<span>${esc(t.notMuch)}</span><i>${W.cnt.B}</i>`;
  $('moHint').textContent = done ? '' : t.drag; $('moHint').hidden = done;
  card.hidden = done; if (!done) $('moCardT').textContent = t.cards[ci].t;
  const m = $('moMsg');
  if (done) { m.hidden = false; m.className = 'mo-msg ok'; m.innerHTML = `<b>🏰 ${esc(t.done)}</b>`; }
  else if (W.msg) { m.hidden = false; m.className = `mo-msg ${W.msg.ok ? 'ok' : 'bad'}`; m.innerHTML = `<b>${esc(W.msg.ok ? t.right : t.notQuite)}</b> ${esc(t.cards[W.msg.ci].why)}`; }
  else m.hidden = true;
  lab.setReadout(`${n} / 7`, t.sorted, '', '#3ddc97');
  if (done) { lab.setState({ ...t.state.why }); lab.setFacts(t.facts.why); }
  else {
    lab.setFacts([]);
    lab.setState(W.msg ? { emo: W.msg.ok ? '✅' : '🤔', title: W.msg.ok ? t.right : t.notQuite, lead: t.cards[W.msg.ci].why, body: '' } : { emo: t.state.why.emo, title: t.state.why.title, lead: t.drag, body: '' });
  }
}
render();
</script>
