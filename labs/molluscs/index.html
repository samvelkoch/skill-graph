    c.fillStyle = pg; c.beginPath(); c.arc(194, 200, Math.max(1, r), 0, TAU); c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(80,50,100,.6)'; c.stroke();
    if (S.layers === 0) { c.fillStyle = '#2a1a12'; c.beginPath(); c.arc(194, 200, 3, 0, TAU); c.fill(); }
    // cross-section
    const R = 34, cx = 348, cy = 64;
    c.fillStyle = '#2a1c36'; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fill();
    for (let l = S.layers; l >= 1; l--) {
      const rl = Math.min(R - 3, 5 + Math.min(S.layerA, l) * 2.6);
      const lgd = c.createRadialGradient(cx - rl * 0.3, cy - rl * 0.3, 1, cx, cy, rl); lgd.addColorStop(0, l % 2 ? '#fbf4fb' : '#e6d7ea'); lgd.addColorStop(1, l % 2 ? '#cdbad6' : '#f3e8f2');
      c.fillStyle = lgd; c.beginPath(); c.arc(cx, cy, Math.max(0.5, rl), 0, TAU); c.fill(); c.lineWidth = 0.8; c.strokeStyle = 'rgba(100,70,120,.5)'; c.stroke();
    }
    c.fillStyle = '#2a1a12'; c.beginPath(); c.arc(cx, cy, 3.4, 0, TAU); c.fill();
    c.lineWidth = 2.4; c.strokeStyle = '#e9d7b0'; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke();
    tag(c, T[lang].v3.cross, cx, cy + R + 14, f.s);
  }

}
function wrap(c, text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? `${cur} ${w}` : w; if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function drawMatch(c, w, h, time) {
  const f = S.fit; sea(c, w, h, time); c.save(); c.translate(f.ox, f.oy); c.scale(f.s, f.s); sand(c, f);
  const xs = [67, 200, 333], t = T[lang];
  if (!S.mDone) {
    const fs = 16 / f.s, lh = 22 / f.s; c.font = `700 ${fs}px Nunito, sans-serif`;
    const lines = wrap(c, t.v3.stm[STM_ORDER[S.mi]], 350), ph = lines.length * lh + 14 / f.s;
    c.fillStyle = 'rgba(10,14,24,.78)'; rr(c, 15, 12, 370, ph, 14 / f.s); c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    lines.forEach((l, i) => c.fillText(l, 200, 12 + 7 / f.s + lh * (i + 0.5)));
  }
  for (let i = 0; i < 3; i++) {
    const hit = S.mHit === i, picked = S.mAns === i;
    if (S.mAns !== null && (hit || picked)) {
      c.save(); c.lineWidth = 4; c.strokeStyle = hit ? '#3ddc97' : '#ff6b6b'; rr(c, xs[i] - 60, 170, 120, 92, 16); c.stroke(); c.fillStyle = hit ? 'rgba(61,220,151,.16)' : 'rgba(255,107,107,.12)'; c.fill(); c.restore();
    }
    drawAnimal(c, i, xs[i], 211, 0.3, { time });
    tag(c, t.an[i], xs[i], 264, f.s);
  }
  c.restore();
}

// --- main loop ---------------------------------------------------------------------------------------------------
let lastKey = '', lastRo = '';
canvasLoop(cv, (c, w, h, dt, time) => {
  step(dt); S.fit = fit(w, h);
  const v = lab.view;
  if (v === 'body') drawBody(c, w, h, time);
  else if (v === 'eat') { if (S.sc2 === 'mussel') drawTank(c, w, h, time); else if (S.sc2 === 'snail') drawSnail(c, w, h, time); else drawHunt(c, w, h, time); }
  else if (S.sc3 === 'col') drawColours(c, w, h, time);
  else if (S.sc3 === 'jar') drawJar(c, w, h, time);
  else if (S.sc3 === 'pearl') drawPearl(c, w, h, time);
  else drawMatch(c, w, h, time);
  if (v === 'body' && S.g1 !== null) { const sl = $('mSl'); if (Math.abs(+sl.value - S.m * 100) > 1.5) sl.value = S.m * 100; }
  const key = [v, S.sc2, S.sc3, S.run, S.hours >= 3, S.oc.st, S.jar.run, S.jar.res, S.auto, S.drag].join('|');
  if (key !== lastKey) { lastKey = key; render(); } else liveReadout();
});

// --- readout, state card, controls -------------------------------------------------------------------------------
function ro() {
  const t = T[lang], v = lab.view;
  if (v === 'body') {
    if (S.g1 === null) return ['?', '', '', '#d9825f'];
    const n = PART_KEYS.filter((k) => S.colT[k] > 0.5).length;
    return [`${n}/4`, t.v1.ro, t.an[Math.round(S.mT)], '#9a58d4'];
  }
  if (v === 'eat') {
    if (S.sc2 === 'mussel') return S.g2 === null ? ['?', '', '', '#2fa6c9'] : [`${Math.round(S.clear * 100)}%`, t.v2.after(num(S.hours)), t.v2.nm(S.nm), '#2fa6c9'];
    if (S.sc2 === 'snail') return [`${Math.round((S.cleanN / CELLS) * 100)}%`, t.v2.clean, t.v2.radula, '#6fb36f'];
    return [String(S.oc.n), t.v2.caught(S.oc.n), t.v2.beakW, '#d9825f'];
  }
  const t3 = t.v3;
  if (S.sc3 === 'col') return [`${hiddenPct()}%`, t3.hid, S.cam ? t3.camP[0] : t3.camP[1], '#d9a23f'];
  if (S.sc3 === 'jar') {
    if (S.g3 === null) return ['?', '', '', '#5f8fd0'];
    const J = S.jar, p = J.res === 'out' ? t3.jp[1] : J.res === 'stuck' ? t3.jp[2] : J.run ? t3.jp[0] : '';
    return [`${Math.round((S.hole / JDISC[8]) * 100)}%`, t3.jro, p, '#5f8fd0'];
  }
  if (S.sc3 === 'pearl') return [String(S.layers), t3.layers(S.layers), S.speck ? t3.pp : '', '#b9a9c8'];
  return [`${S.mRight}/6`, '', t3.mt, '#3ddc97'];
}
function liveReadout() { const r = ro(), k = r.join('|'); if (k === lastRo) return; lastRo = k; lab.setReadout(r[0], r[1], r[2], r[3]); }
const fx = (arr) => arr.map(([text, src], i) => ({ emo: ['💡', '🔬', '🐚'][i % 3], text, src }));
const chipRow = (id, items) => { $(id).innerHTML = items.map(([act, v, label, on, extra = '']) => `<button class="chip ${on ? 'on' : ''}" data-act="${act}" data-v="${v}" ${extra}>${label}</button>`).join(''); };
const optRow = (id, act, opts, ok, g) => { $(id).innerHTML = opts.map((o, i) => `<button data-act="${act}" data-v="${i}" class="${g !== null ? (i === ok ? 'good' : i === g ? 'bad' : '') : ''}">${o}</button>`).join(''); };

function render() {
  const t = T[lang], v = lab.view;
  $('s1').hidden = v !== 'body'; $('s2').hidden = v !== 'eat'; $('s3').hidden = v !== 'tricks';
  cv.style.touchAction = v === 'eat' && S.sc2 === 'snail' ? 'none' : 'pan-y';
  if (v === 'body') renderBody(t); else if (v === 'eat') renderEat(t); else renderTricks(t);
  lastRo = ''; liveReadout();
}
function renderBody(t) {
  const q = t.v1, pre = S.g1 === null;
  $('s1p').hidden = !pre; $('s1m').hidden = pre;
  lab.setGlow('rgba(154, 88, 212, .26)');
  if (pre) {
    $('q1').textContent = q.q; optRow('o1', 'g1', q.opts.map(([e, l]) => `${e} ${esc(l)}`), q.ok, null);
    lab.setState({ emo: '🐙', title: q.q, lead: q.pre, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const open = secret.unlocked(), k = Math.round(S.mT);

  $('e0').textContent = t.an[0]; $('e1').textContent = t.an[1]; $('e2').textContent = t.an[2];
  $('mSl').setAttribute('aria-label', q.slide); if (Math.abs(+$('mSl').value - S.m * 100) > 1) $('mSl').value = S.m * 100;
  $('partC').innerHTML = PART_KEYS.map((p, i) => `<button class="chip ${S.colT[p] > 0.5 ? 'on' : ''}" data-act="part" data-k="${p}"><span class="mo-dot" style="background:${OVL[p]}"></span>${esc(t.parts[i])}</button>`).join('');
  $('secC').innerHTML = [['slug', '🐌', S.slugT], ['shut', '🦪', S.shutT]].map(([key, emo, on]) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${key}">${open ? `${emo} ${esc(q.secrets[key][0])}` : '🔒 ???'}</button>`).join('');

  else if (f === 'slug') lab.setState({ emo: '🐌', title: q.slug[0], lead: q.slug[1], body: q.slug[2], extra: '' });
  else if (f === 'shut') lab.setState({ emo: '🦪', title: q.shut[0], lead: q.shut[1], body: q.shut[2], extra: '' });
  else lab.setState({ emo: S.g1 === q.ok ? '✅' : '🤔', title: verdict, lead: q.post, body: q.postB, extra: '' });

}
function renderEat(t) {
  const v2 = t.v2, sc = S.sc2, mus = sc === 'mussel', pre = mus && S.g2 === null;
  $('sc2C').innerHTML = [['snail', '🐌', 0], ['mussel', '🦪', 1], ['oct', '🐙', 2]].map(([key, emo, i]) => `<button class="chip ${sc === key ? 'on' : ''}" data-act="sc2" data-k="${key}">${emo} ${esc(t.an[i])}</button>`).join('');
  $('s2mp').hidden = !pre; $('s2m').hidden = !mus || pre; $('s2s').hidden = sc !== 'snail'; $('s2o').hidden = sc !== 'oct';
  if (mus) {
    lab.setGlow('rgba(47, 166, 201, .26)');

      $('q2').textContent = v2.g.q; optRow('o2', 'g2', v2.g.opts.map(esc), v2.g.ok, null);

    lab.setFacts(fx(v2.facts.mussel));
  } else if (sc === 'snail') {

    lab.setState({ emo: '🐌', title: v2.snail[0], lead: v2.snail[1], body: v2.snail[2], extra: '' }); lab.setFacts(fx(v2.facts.snail));
  } else {
    lab.setGlow('rgba(217, 130, 95, .26)');
    $('s2ob').innerHTML = `<button class="mo-btn" data-act="hunt" ${S.oc.st !== 'walk' ? 'disabled' : ''}>${v2.hunt}</button>`;
    lab.setState({ emo: '🐙', title: v2.oct[0], lead: v2.oct[1], body: v2.oct[2], extra: '' }); lab.setFacts(fx(v2.facts.oct));
  }
}
function renderTricks(t) {
  const v3 = t.v3, sc = S.sc3;
  $('sc3C').innerHTML = [['col', '🎨', 0], ['jar', '🫙', 1], ['pearl', '🦪', 2], ['match', '🧩', 3]].map(([key, emo, i]) => `<button class="chip ${sc === key ? 'on' : ''}" data-act="sc3" data-k="${key}">${emo} ${esc(v3.sc[i])}</button>`).join('');
  const jpre = sc === 'jar' && S.g3 === null;
  $('s3c').hidden = sc !== 'col'; $('s3jp').hidden = !jpre; $('s3j').hidden = sc !== 'jar' || jpre; $('s3p').hidden = sc !== 'pearl'; $('s3m').hidden = sc !== 'match';

    }

    $('holeSl').setAttribute('aria-label', v3.hole); if (+$('holeSl').value !== S.hole) $('holeSl').value = S.hole;
    const J = S.jar, verdict = S.g3 === v3.jok ? v3.right : v3.wrong;
    if (J.res === 'out') lab.setState({ emo: '🐙', title: `${verdict} ${v3.jtitle[0]}`, lead: v3.jlead[0], body: v3.jbody, extra: '' });
    else if (J.res === 'stuck') lab.setState({ emo: '😬', title: v3.jtitle[1], lead: v3.jlead[1], body: v3.jbody, extra: '' });
    else lab.setState({ emo: '🫙', title: `${verdict}`, lead: v3.jidle, body: '', extra: '' });

    lab.setFacts(fx(v3.facts.pearl));

    $('mo').hidden = done;
    $('mo').innerHTML = t.an.map((n, i) => `<button data-act="mt" data-v="${i}" ${S.mAns !== null ? 'disabled' : ''} class="${S.mAns !== null ? (i === STM_ANS[item] ? 'good' : i === S.mAns ? 'bad' : '') : ''}">${['🐌', '🦪', '🐙'][i]} ${esc(n)}</button>`).join('');

    if (done) lab.setState({ emo: '🏆', title: v3.mend(S.mRight), lead: S.g1 === null ? '' : v3.mendL, body: '', extra: '' });
    else if (S.mAns === null) lab.setState({ emo: '🧩', title: v3.mt, lead: v3.mlead, body: '', extra: '' });
    else lab.setState({ emo: S.mAns === STM_ANS[item] ? '✅' : '🤔', title: S.mAns === STM_ANS[item] ? v3.mright : v3.mwrong, lead: v3.ans(t.an[STM_ANS[item]].toLowerCase()), body: '', extra: '' });
    lab.setFacts(fx(v3.facts.match));
  }
}
