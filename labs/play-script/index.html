  const stroke = b.kind === 'flat' ? '#7a8296' : b.kind === 'shout' ? '#e0a020' : '#c9bb98';

}

  at(0, () => { W.key.held = 2; W.key.x = W.lina.x + 16; W.key.y = W.lina.y - 30; tw(W.key, 'x', 285, 400); tw(W.key, 'y', 214, 400); }); t += 500;
  at(0, () => { tw(W.chest, 'open', 1, 800, out); sfx.good(); fx('✨', 285, 170); l.face = 'laugh'; }); t += 1200;
  at(0, () => { S.busy = false; S.objDone = pick === 'key'; render(); });
}

// --- controls ---------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'mk') { if (S.busy) return; S.mark[+b.dataset.i] = b.dataset.v === '1'; S.played = null; S.res = null; sfx.tick(); }
  else if (a === 'play') { sfx.click(); perform(S.mark, 'mine'); return; }
  else if (a === 'right') { sfx.click(); const keep = S.res; perform(TRUTH, 'right'); S.res = keep; return; }
  else if (a === 'reset1') { stopAll(); S.mark.fill(null); S.played = null; S.res = null; enter(); sfx.click(); }
  else if (a === 'set') { if (S.busy) return; S.d[b.dataset.k] = b.dataset.v; S.pred = null; S.acted = false; stopAll(); const tn = S.d.time === 'night' ? 1 : 0;
    if (b.dataset.k === 'time') { enter(); W.night = 1 - tn; tw(W, 'night', tn, 500); } else enter(); sfx.tick(); }
  else if (a === 'pred') { if (S.busy) return; S.pred = b.dataset.v; sfx.tick(); }
  else if (a === 'act') { sfx.click(); act(); return; }
  else if (a === 'card') { if (S.busy) stopAll(); S.sel = +b.dataset.i; const keepC = S.checked; resetWorld(); setCard(S.sel); S.checked = keepC; sfx.tick(); }
  else if (a === 'gap') { if (S.checked || S.busy) return; const g = +b.dataset.g; S.cut[g] = !S.cut[g]; sfx.tick(); }
  else if (a === 'check') { S.checked = true; sfx.click(); runScenes(); showStage(); }
  else if (a === 'reset3') { stopAll(); S.cut.fill(false); S.checked = false; S.sel = 0; enter(); sfx.click(); }
  else if (a === 'sec') { const k = b.dataset.k; if (!secret.unlocked()) return secret.open(); S.sec = S.sec === k ? null : k; S.pick = null; S.objDone = null; S.bearDone = false; sfx.click(); enter(); }
  else if (a === 'bear') { sfx.click(); playBear(); return; }
  else if (a === 'pick') { if (S.busy) return; S.pick = b.dataset.v; S.objDone = null; sfx.tick(); }
  else if (a === 'obj') { sfx.click(); playObj(); return; }
  else if (a === 'obj0') { S.pick = null; S.objDone = null; enter(); sfx.click(); }
  render();
});

// --- render ------------------------------------------------------------------------------------------------
const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  show('s1', !sec && v === 'spoken'); show('s2', !sec && v === 'dirs'); show('s3', !sec && v === 'scenes'); show('sx', !!sec);
  const open = secret.unlocked();
  $('secChips').innerHTML = ['bear', 'obj'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'bear' ? '🐻' : '🔑'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec === 'bear') rBear(t); else if (sec === 'obj') rObj(t); else if (v === 'spoken') r1(t); else if (v === 'dirs') r2(t); else r3(t);
  const fk = v;
  lab.setFacts(t.facts[fk].map((f, i) => ({ emo: ['🎭', '🎬', '🔫'][['spoken', 'dirs', 'scenes'].indexOf(fk)] || '💡', text: f.t, src: f.s })));
  if (v === 'spoken' && (S.played || S.busy)) markRow(S.busy ? S.row : -1);
}

function r1(t) {
  const s = t.s1, n = S.mark.filter((x) => x !== null).length, all = n === 7, p = S.played, res = S.res;
  const rows = LINES.map((L, i) => {
    const sc = s.script[i], m = S.mark[i];
    const txt = L.k === 'd' ? `<span class="ps-dir">(${esc(sc.t)})</span>` : `<span class="ps-who">${esc(t.who[L.who])}</span> ${sc.i ? `<span class="ps-dir">(${esc(sc.i)})</span> ` : ''}${esc(sc.t)}`;
    const tg = `<div class="ps-tg"><button data-act="mk" data-i="${i}" data-v="1" class="${m === true ? 'on' : ''}" aria-label="${esc(s.say)}" ${S.busy ? 'disabled' : ''}>🗣️</button><button data-act="mk" data-i="${i}" data-v="0" class="${m === false ? 'on' : ''}" aria-label="${esc(s.no)}" ${S.busy ? 'disabled' : ''}>🎬</button></div>`;
    const rs = res ? `<span class="ps-res">${res[i] ? '✓' : `✗ ${TRUTH[i] ? '🗣️' : '🎬'}`}</span>` : '';
    return `<div class="ps-row ${res ? 'has-res ' + (res[i] ? 'ok' : 'bad') : ''}" data-i="${i}"><div>${txt}</div>${tg}${rs}</div>`;
  }).join('');
  const k = res ? res.filter(Boolean).length : 0;
  $('s1').innerHTML = `<div class="ps-paper"><div class="ps-title">${esc(s.paper)}</div><div class="ps-leg">${esc(s.legend)}</div>${rows}</div>
    <div class="row2">
      ${p === 'mine' ? `${k < 7 ? `<button class="btn" data-act="right">${esc(t.rightWay)}</button>` : ''}<button class="btn ghost" data-act="reset1">${esc(t.again)}</button>`
        : p === 'right' ? `<button class="btn" data-act="reset1">${esc(t.again)}</button>`
        : `<button class="btn" data-act="play" ${all && !S.busy ? '' : 'disabled'}>${esc(S.busy ? t.busy : t.play)}</button>`}
    </div>`;
  if (S.busy) { lab.setReadout(`${n}/7`, s.readout, '', '#e0b050'); lab.setState({ emo: '🎬', title: t.busy, lead: s.busyLead, body: '', extra: '' }); }
  else if (!p) { lab.setReadout(`${n}/7`, s.readout, '', '#e0b050'); lab.setState({ emo: '📜', title: s.intro[0], lead: s.intro[1], body: '', extra: '' }); }
  else {
    lab.setReadout(`${k}/7`, s.readout2, '', k === 7 ? '#3ddc97' : '#e0b050');
    if (p === 'right') lab.setState({ emo: '✨', title: s.right[0], lead: s.right[1], body: '', extra: '' });
    else {
      const readOut = S.mark.some((m, i) => m === true && !TRUTH[i]), skipped = S.mark.some((m, i) => m === false && TRUTH[i]);
      lab.setState({ emo: k === 7 ? '✅' : '🤔', title: s.res(k), lead: k === 7 ? s.all : readOut && skipped ? s.both : readOut ? s.read : s.skip, body: '', extra: '' });
    }
  }
}

function r2(t) {
  const s = t.s2, d = S.d, dis = S.busy ? 'disabled' : '';
  const opts = (key, list) => `<div class="ps-opts">${Object.keys(list).map((v) => `<button class="ps-opt ${d[key] === v ? 'on' : ''}" data-act="set" data-k="${key}" data-v="${v}" ${dis}>${esc(list[v])}</button>`).join('')}</div>`;
  $('s2').innerHTML = `<div class="ps-paper"><div class="ps-title">${esc(s.paper)}</div>
    <div class="ps-lbl">${esc(s.lbl.t)}</div><div class="ps-row" style="min-height:0"><div class="ps-dir">(${esc(s.dirT[d.time])})</div></div>${opts('time', s.time)}
    <div class="ps-row" style="min-height:0"><div><span class="ps-who">${esc(t.who.tom)}</span> ${esc(s.lines[0])}</div></div>
    <div class="ps-lbl">${esc(s.lbl.h)}</div><div class="ps-row" style="min-height:0"><div><span class="ps-who">${esc(t.who.lina)}</span> <span class="ps-dir">(${esc(s.dirH[d.how])})</span> ${esc(s.lines[1])}</div></div>${opts('how', s.how)}
    <div class="ps-row" style="min-height:0"><div><span class="ps-who">${esc(t.who.tom)}</span> ${esc(s.lines[2])}</div></div>
    <div class="ps-lbl">${esc(s.lbl.m)}</div><div class="ps-row" style="min-height:0"><div class="ps-dir">(${esc(s.dirM[d.mv])})</div></div>${opts('mv', s.mv)}
  </div>
  <div class="ps-pred"><div class="q">${esc(s.pred)}</div>${['sc', 'fu', 'sa'].map((m) => `<button class="chip ${S.pred === m ? 'on' : ''}" data-act="pred" data-v="${m}" ${dis}>${s.emo[m]} ${esc(s.moods[m])}</button>`).join('')}
    <button class="btn push" style="margin-left:auto" data-act="act" ${S.pred && !S.busy ? '' : 'disabled'}>${esc(S.busy ? s.busyT : s.act)}</button></div>`;
  if (S.acted) {
    const m = S.mood, ok = S.pred === m, r = ok ? s.right(s.moods[m]) : s.wrong(s.moods[m]);
    lab.setReadout(s.emo[m], s.mood, '', ok ? '#3ddc97' : '#e0b050'); lab.setState({ emo: ok ? '✅' : '🤔', title: r[0], lead: r[1], body: '', extra: '' });
  } else {
    lab.setReadout('?', s.mood, '', '#e0b050');
    if (S.busy) lab.setState({ emo: '🎭', title: s.busyT, lead: s.intro[1], body: '', extra: '' });
    else if (S.pred) lab.setState({ emo: '🎭', title: s.intro[0], lead: s.intro[1], body: '', extra: '' });
    else lab.setState({ emo: '🎭', title: s.ready[0], lead: s.ready[1], body: '', extra: '' });
  }
}

function r3(t) {
  const s = t.s3, chk = S.checked, cuts = S.cut.filter(Boolean).length;
  let html = '<div class="ps-list">';
  CARDS.forEach((k, i) => {
    if (chk && (i === 0 || i === 4)) html += `<div class="ps-act">${esc(s.act)} ${ACT_OF[i] + 1}</div>`;
    html += `<button class="ps-card ${S.sel === i ? 'sel' : ''}" data-act="card" data-i="${i}"><span class="e">${k.emo}</span><span>${esc(s.cards[i])}</span></button>`;
    if (i < 7) {
      const g = i, on = S.cut[g], right = CUT[g];
      if (!chk) html += `<button class="ps-gap ${on ? 'on' : ''}" data-act="gap" data-g="${g}">${esc(on ? s.gapOn : s.gapAdd)}</button>`;
      else if (right) html += `<div class="ps-gap ${on ? 'good' : 'miss'}">${on ? '🎭 ✓' : '🎭'} ${esc(s.why[SCENE_OF[g]])}</div>`;
      else if (on) html += `<div class="ps-gap wrong">${esc(s.gapOn)}</div>`;
      else html += '<div style="height:6px"></div>';
    }
  });
  html += `</div><div class="row2">${chk ? `<button class="btn ghost" data-act="reset3">${esc(t.again)}</button>` : `<button class="btn" data-act="check">${esc(s.check)}</button>`}</div>`;
  $('s3').innerHTML = html;
  if (chk) {
    const f = CUT.filter((r, g) => r && S.cut[g]).length, extra = S.cut.filter((c2, g) => c2 && !CUT[g]).length, ok = f === 3 && !extra;
    lab.setReadout(`${f}/3`, s.readout2, '', ok ? '#3ddc97' : '#e0b050');
    lab.setState({ emo: ok ? '✅' : '🤔', title: s.res(f), lead: ok ? s.done : [f < 3 ? s.miss : '', extra ? s.extra : '', s.done].filter(Boolean).join(' '), body: '', extra: '' });
  } else {
    lab.setReadout(String(cuts), s.readout, '', '#e0b050');
    lab.setState({ emo: '🎬', title: s.intro[0], lead: s.intro[1], body: '', extra: '' });
  }
}

function rBear(t) {
  const b = t.bear;
  $('sx').innerHTML = `<div class="ps-paper"><div class="ps-title">${esc(b.paper)}</div><div class="ps-row" style="min-height:56px"><div class="ps-dir" style="font-size:18px">(${esc(b.dir)})</div></div></div>
    <div class="row2"><button class="btn" data-act="bear" ${S.busy ? 'disabled' : ''}>${esc(S.busy ? t.busy : t.play)}</button></div>`;
  lab.setReadout('🐻', '', '', '#d9825f');
  lab.setState({ emo: '🐻', title: b.t0, lead: S.bearDone ? b.l1 : b.l0, body: '', extra: '' });
}
function rObj(t) {
  const o = t.obj, done = S.objDone !== null;
  $('sx').innerHTML = `<div class="ps-paper"><div class="ps-title">${esc(o.paper)}</div><div class="ps-lbl">${esc(o.ask)}</div>
    <div class="ps-opts">${Object.keys(o.items).map((k) => `<button class="ps-opt ${S.pick === k ? 'on' : ''}" data-act="pick" data-v="${k}" ${S.busy || done ? 'disabled' : ''}>${esc(o.items[k])}</button>`).join('')}</div></div>
    <div class="row2">${done ? `<button class="btn ghost" data-act="obj0">${esc(o.again)}</button>` : `<button class="btn" data-act="obj" ${S.pick && !S.busy ? '' : 'disabled'}>${esc(S.busy ? o.busy : o.go)}</button>`}</div>`;
  lab.setReadout('🔑', '', '', '#e0b050');
  if (done) { const r = S.objDone ? o.yes : o.no; lab.setState({ emo: S.objDone ? '✅' : '🤔', title: r[0], lead: r[1], body: '', extra: '' }); }
  else lab.setState({ emo: '🔍', title: S.busy ? o.busy : o.t0, lead: o.l0, body: '', extra: '' });
}

resetWorld(); W.pan.vis = 1;
render();
</script>
</body>
</html>
