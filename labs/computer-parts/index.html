  const lit = B.checked && B.ok ? clamp01((t - B.checkAt) / 1.2) : 0;
  B.picks.forEach((id, i) => {
    const [sx, sy] = SLOTS[i], P = slotCab(sx, sy);
    cable(c, P, lit > 0 ? ease(lit * 1.3 - i * 0.05) : 0, CIN, 1, lit > 0 && lit < 1);
  });
  c.save(); c.translate(180, 131); c.scale(0.76, 0.76); c.translate(-180, -244);
  const ok = B.checked && B.ok, op = ok ? ease((t - B.checkAt) / 0.6) : 0;
  computer(c, op, ok ? 0.85 + 0.15 * Math.sin(t * 10) : 0, t); c.restore();
  B.picks.forEach((id, i) => {
    const [sx, sy] = SLOTS[i], k = back((t - (B.at[id] || -9)) / 0.4);
    c.save(); c.translate(sx, sy); c.scale(k, k); drawIcon(c, id, 0, 0, 44); c.restore();
  });
  // the answer: what is missing is shown as ghosts
  if (B.checked && !B.ok) {
    B.miss.forEach((g, j) => {
      const [sx, sy] = SLOTS[B.picks.length + j], pulse = 0.5 + 0.5 * Math.sin(t * 5);
      c.save(); circ(c, sx, sy, 25); c.setLineDash([5, 4]); c.lineWidth = 2; c.strokeStyle = `rgba(255,200,87,${0.6 + 0.4 * pulse})`; c.stroke(); c.setLineDash([]);
      c.globalAlpha = 0.4 + 0.2 * pulse; drawIcon(c, GHOST[g], sx, sy, 38, true); c.restore();
      label(c, tb.grp[g], sx, sy + 33, { maxW: 110, bg: 'rgba(120,80,0,.88)' });
    });
  }
  if (B.checked) pill(c, ok ? job.pill : job.miss[B.miss[0]], 180, 258, { maxW: 344, col: ok ? '#8ff5c8' : '#ffd58a' });
  // shelf
  SHELF.forEach((id, i) => {
    const p = shelfPos(i), on = B.picks.includes(id);
    shadowed(c, () => fillG(c, p.x, p.y, p.w, p.h, 11, on ? '#2f5a56' : '#262f56', on ? '#173a3a' : '#161c38', on ? '#62e6a3' : '#3a4676', on ? 2 : 1.2), 6, 2, 0.35);
    drawIcon(c, id, p.x + p.w / 2, p.y + 17, 30, true);
    c.font = fnt(12, 700); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = on ? '#d6fff0' : '#dfe5f5';
    const lines = wrapText(c, T[lang].parts[id], p.w - 6);
    lines.slice(0, 2).forEach((l, j) => c.fillText(l, p.x + p.w / 2, p.y + (lines.length > 1 ? 37 : 43) + j * 13));
  });
}
function tapBuild(x, y) {
  for (let i = 0; i < B.picks.length; i++) { const [sx, sy] = SLOTS[i]; if (Math.hypot(x - sx, y - sy) < 26) { B.picks.splice(i, 1); B.checked = false; sfx.click(); render(); return; } }
  SHELF.forEach((id, i) => {
    const p = shelfPos(i);
    if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) {
      const at = B.picks.indexOf(id);
      if (at >= 0) B.picks.splice(at, 1); else if (B.picks.length < SLOTS.length) { B.picks.push(id); B.at[id] = now(); }
      B.checked = false; sfx.tick(); render();
    }
  });
}

// --- secrets ----------------------------------------------------------------------------------------------
function woodMouse(c, x, y, rot) {
  c.save(); c.translate(x, y);
  c.beginPath(); c.ellipse(0, 34, 46, 6, 0, 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,.35)'; c.fill();
  // wheel seen from the side (turns as the mouse rolls) and a wheel seen edge-on
  c.save(); c.translate(-20, 20); circ(c, 0, 0, 13); c.fillStyle = lg(c, -12, -12, 12, 12, [[0, '#f4f7fc'], [1, '#7f8aa6']]); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#3d4666'; c.stroke();
  c.rotate(rot); c.strokeStyle = '#59658a'; c.lineWidth = 2; for (let i = 0; i < 3; i++) { c.rotate(Math.PI / 3); c.beginPath(); c.moveTo(-11, 0); c.lineTo(11, 0); c.stroke(); }
  circ(c, 0, 0, 3); c.fillStyle = '#3d4666'; c.fill(); c.restore();
  fillG(c, 12, 8, 9, 26, 3, '#e6ebf6', '#7f8aa6', '#3d4666');
  fillG(c, -38, -26, 76, 40, 6, '#e0ad6e', '#8d5f2f', '#4f3318', 1.8);
  c.save(); rr(c, -38, -26, 76, 40, 6); c.clip(); c.strokeStyle = 'rgba(79,51,24,.3)'; c.lineWidth = 1;
  for (let i = 0; i < 6; i++) { c.beginPath(); c.moveTo(-40, -20 + i * 7); c.bezierCurveTo(-10, -23 + i * 7, 10, -17 + i * 7, 40, -20 + i * 7); c.stroke(); }
  c.globalAlpha = 0.35; c.fillStyle = '#fff'; c.fillRect(-36, -25, 72, 6); c.restore();
  c.save(); c.shadowColor = '#ff5a4d'; c.shadowBlur = 8; circ(c, 20, -12, 5.5); c.fillStyle = '#ff5a4d'; c.fill(); c.restore(); circ(c, 18.5, -13.5, 1.8); c.fillStyle = 'rgba(255,255,255,.7)'; c.fill();
  c.beginPath(); c.moveTo(-38, -8); c.bezierCurveTo(-70, -8, -64, -34, -92, -34); c.lineWidth = 3; c.strokeStyle = '#1a1208'; c.stroke();
  c.restore();
}
function newMouse(c, x, y) {
  c.save(); c.translate(x, y);
  c.beginPath(); c.ellipse(0, 30, 42, 5, 0, 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,.35)'; c.fill();
  const g = c.createLinearGradient(-8, 14, 8, 38); g.addColorStop(0, 'rgba(255,60,60,.7)'); g.addColorStop(1, 'rgba(255,60,60,0)');
  c.beginPath(); c.moveTo(-6, 14); c.lineTo(-20, 34); c.lineTo(20, 34); c.lineTo(6, 14); c.closePath(); c.fillStyle = g; c.fill();
  fillG(c, -40, -22, 80, 38, 19, '#f7f9fd', '#a7b2cc', '#58637f', 1.6);
  c.beginPath(); c.moveTo(-10, -21); c.lineTo(-10, -4); c.moveTo(-36, -4); c.lineTo(40, -4); c.lineWidth = 1.2; c.strokeStyle = '#7b87a6'; c.stroke();
  fillG(c, -3, -17, 6, 11, 3, '#4a557a', '#1a2036', null);
  c.beginPath(); c.moveTo(-40, -2); c.bezierCurveTo(-70, -2, -64, -28, -92, -28); c.lineWidth = 3; c.strokeStyle = '#1a2036'; c.stroke();
  c.restore();
}
const mouseX = (i, t) => lerp(MM[i].from, MM[i].to, ease((t - MM[i].at) / 0.9));
function drawMouseSecret(c, t) {
  desk(c, 0);
  const tm = T[lang].mouse;
  // little monitor with the pointer
  shadowed(c, () => fillG(c, 110, 12, 140, 100, 10, '#4a557a', '#161c32', '#0b0e1c'), 10, 4, 0.4);
  fillG(c, 117, 19, 126, 74, 4, '#1b3d78', '#0a1a3c', null);
  fillG(c, 168, 112, 24, 8, 2, '#aab5cf', '#6a7597', null);
  const m = S.cur, mx = mouseX(m, t);
  c.save(); rr(c, 117, 19, 126, 74, 4); c.clip(); arrow(c, clamp(180 + mx * 0.7, 126, 230), m === 0 ? 40 : 58, 1, m === 0 ? '#ffd58a' : '#bfe4ff'); c.restore();
  [['old', 150, 0], ['now', 296, 1]].forEach(([k, y, i]) => {
    shadowed(c, () => fillG(c, 14, y, 332, 124, 16, '#2e3a66', '#182041', '#0e1226'), 10, 4, 0.35);
    pill(c, tm[k], 58, y + 16, { maxW: 90, sz: 13 });
    const x = 180 + mouseX(i, t);
    if (i === 0) woodMouse(c, x, y + 66, mouseX(i, t) / 13); else newMouse(c, x, y + 66);
  });
  pill(c, tm.hint, 180, 448, { maxW: 300, bg: 'rgba(10,13,26,.7)' });
}
function tapMouse(x, y) {
  const i = y > 140 && y < 280 ? 0 : y >= 290 && y < 430 ? 1 : -1; if (i < 0) return;
  const t = now(), cur = mouseX(i, t);
  MM[i].from = cur; MM[i].to = MM[i].to > 0 ? -70 : 70; MM[i].at = t; S.cur = i; sfx.push();
}

const QW = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
const LAYOUTS = [QW, ['QWERTZUIOP', 'ASDFGHJKL', 'YXCVBNM'], ['ЙЦУКЕНГШЩЗХ', 'ФЫВАПРОЛДЖЭ', 'ЯЧСМИТЬБЮ']];
function drawKbSecret(c, t) {
  desk(c, 0);
  const tk = T[lang].kb, kb = S.kb;
  c.font = fnt(40, 900); c.textAlign = 'center'; c.textBaseline = 'middle'; c.save(); c.shadowColor = 'rgba(120,170,255,.6)'; c.shadowBlur = 18; c.fillStyle = '#fff'; c.fillText(tk.names[kb], 180, 52); c.restore();
  pill(c, tk.who[kb], 180, 92, { maxW: 240, sz: 13 });
  shadowed(c, () => fillG(c, 6, 118, 348, 214, 16, '#2e3a66', '#182041', '#0e1226'), 12, 5, 0.4);
  const pitch = 31.2;
  LAYOUTS[kb].forEach((row, r) => {
    const n = LAYOUTS[kb][r].length, x0 = 180 - (n * pitch) / 2 + 1.5 + (r === 2 ? 6 : 0), y = 134 + r * 46;
    [...row].forEach((ch, i) => {
      const old = LAYOUTS[S.kbPrev][r][i] || '', k = (t - S.kbAt - i * 0.025) / 0.4;
      const shown = k < 0.5 ? old : ch, sx = k <= 0 ? 1 : k >= 1 ? 1 : Math.abs(2 * k - 1);
      const diff = kb > 0 && (QW[r][i] || '') !== ch;
      c.save(); c.translate(x0 + i * pitch + 14, y + 20); c.scale(sx, 1);
      shadowed(c, () => fillG(c, -14, -20, 28, 40, 6, diff ? '#ffe9a0' : '#ffffff', diff ? '#e8b64a' : '#d5dcea', diff ? '#a8741c' : '#8590ad', 1.2), 4, 2, 0.3);
      c.font = fnt(16, 900); c.fillStyle = '#2b3350'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(shown, 0, 1); c.restore();
    });
  });
  fillG(c, 94, 276, 172, 26, 7, '#ffffff', '#d5dcea', '#8590ad', 1.2);
  if (kb > 0) pill(c, tk.legend, 180, 362, { maxW: 320, bg: 'rgba(120,80,0,.88)' });
}

// --- main draw & input ------------------------------------------------------------------------------------
const cv = $('cv');
canvasLoop(cv, (c, w, h, dt, t) => {
  backdrop(c, w, h);
  SC = Math.min(w / WW, h / WH); OX = (w - WW * SC) / 2; OY = (h - WH * SC) / 2;
  c.save(); c.translate(OX, OY); c.scale(SC, SC);
  if (S.sec === 'mouse') drawMouseSecret(c, t);
  else if (S.sec === 'kb') drawKbSecret(c, t);
  else if (lab.view === 'follow') drawFollow(c, t);
  else if (lab.view === 'sort') drawSort(c, t);
  else drawBuild(c, t);
  c.restore();
});
cv.addEventListener('pointerdown', (ev) => {
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left - OX) / SC, y = (ev.clientY - r.top - OY) / SC;
  if (S.sec === 'mouse') return tapMouse(x, y);
  if (S.sec === 'kb') return;
  if (lab.view === 'follow') tapFollow(x, y); else if (lab.view === 'sort') tapSort(x, y); else tapBuild(x, y);
});

// --- controls ---------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').innerHTML = `
  <div id="cpF"><div id="cpAsk"></div><div class="row2"><button class="chip" data-act="print" id="cpPrint"></button></div></div>
  <div id="cpS"><div class="row2" style="margin-top:0"><button class="btn" data-act="again" id="cpAgain"></button></div></div>
  <div id="cpB"><div class="chips" id="cpJobs"></div><div class="row2"><button class="btn" data-act="check" id="cpCheck"></button><button class="chip" data-act="clear" id="cpClear"></button></div><div class="cp-note" id="cpNote"></div></div>
  <div id="cpKb" class="row2"></div>
  <div id="cpSec" class="row2"></div>`;
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'ans') {
    if (F.ans !== null) return;
    F.ans = +b.dataset.i; (F.ans === 1 ? sfx.good : sfx.bad)();
    const h = KEYS.find((k) => k.ch === 'H'); startTrip('key', h.ch); showStage();
  } else if (act === 'print') { if (F.text && !(F.trip && tripState(F.trip, now()).st !== 'done')) startTrip('print'); }
  else if (act === 'again') { SO.items = newItems(); SO.sel = 0; SO.last = -1; SO.flash = [null, null, null]; sfx.click(); }
  else if (act === 'job') { B.job = +b.dataset.i; B.picks = []; B.checked = false; sfx.click(); }
  else if (act === 'clear') { B.picks = []; B.checked = false; sfx.click(); }
  else if (act === 'check') {
    const r = evalBuild(); B.miss = r.miss; B.ok = r.miss.length === 0; B.checked = true; B.checkAt = now(); (B.ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click();
  } else if (act === 'kb') {
    const i = +b.dataset.i; if (i !== S.kb) { S.kbPrev = S.kb; S.kb = i; S.kbAt = now(); sfx.snap(); }
  }
  render();
});

// --- one render per change: controls, readout, state card, facts --------------------------------------------
function stageVal(t, act) {
  return t.stages.map((s, i) => `<span class="cp-st ${['in', 'think', 'out'][i] === act ? 'on' : ''}">${esc(s)}</span>`).join(' <span class="cp-ar">→</span> ');
}
function followUI() {
  const t = T[lang], f = t.f, tr = F.trip;
  const ts = tr ? tripState(tr, now()) : null, st = ts ? ts.st : null, act = st === 'done' ? 'out' : st;
  lab.setReadout(stageVal(t, act), tr ? f.path[tr.kind] : '', '', { in: CIN, think: CTH, out: COUT }[act] || '#4ea8ff');
  lab.setGlow('rgba(78,168,255,.28)');
  if (F.ans === null) lab.setState({ emo: '🤔', title: f.q, lead: f.qLead, body: '', extra: '' });
  else if (!tr) lab.setState({ emo: '👆', title: f.idle, lead: f.idleLead, body: '', extra: '' });
  else if (st === 'in') lab.setState({ emo: tr.kind === 'print' ? '🖨️' : '📥', title: f.in[tr.kind], lead: f.inLead, body: '', extra: '' });
  else if (st === 'think') lab.setState({ emo: '🧠', title: f.think, lead: f.thinkLead, body: '', extra: '' });
  else lab.setState({ emo: '📤', title: f.out[tr.kind], lead: f.outLead, body: '', extra: '' });
}
function renderAsk() {
  const f = T[lang].f, a = $('cpAsk');
  if (F.ans === null) a.innerHTML = `<div class="cp-q">${esc(f.q)}</div><div class="cp-opts">${f.opts.map((o, i) => `<button data-act="ans" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  else { const ok = F.ans === 1; a.innerHTML = `<div class="cp-v ${ok ? 'ok' : 'no'}">${esc(ok ? f.ok : f.no)}</div><p>${esc(f.after)}</p>`; }
}
function sortUI() {
  const ts = T[lang].s, placed = SO.items.filter((q) => q.guess !== null), right = placed.filter((q) => q.ok).length, all = placed.length === 12;
  lab.setReadout(`${placed.length} / 12`, ts.sub, placed.length ? ts.pill(right) : '', '#b78bff');
  lab.setGlow('rgba(183,139,255,.26)');
  if (all) lab.setState({ emo: '🎉', title: ts.done(right), lead: ts.doneLead, body: '', extra: '' });
  else if (SO.last >= 0) { const q = SO.items[SO.last]; lab.setState({ emo: q.ok ? '✅' : '🤔', title: q.ok ? ts.ok : ts.no, lead: ts.why[q.id], body: '', extra: '' }); }
  else lab.setState({ emo: '🗂️', title: ts.title, lead: ts.lead, body: '', extra: '' });
  $('cpAgain').textContent = ts.again;
}
function buildUI() {
  const tb = T[lang].b, job = tb.jobs[jobKey()];
  $('cpJobs').innerHTML = JOBS.map((k, i) => `<button class="chip ${i === B.job ? 'on' : ''}" data-act="job" data-i="${i}">${tb.jobs[k].emo} ${esc(tb.jobs[k].name)}</button>`).join('');
  $('cpCheck').textContent = tb.check; $('cpClear').textContent = tb.clear;
  $('cpNote').textContent = '';
  lab.setReadout(String(B.picks.length), tb.picked, B.checked ? (B.ok ? '✓' : `${tb.need}: ${B.miss.length}`) : '', B.checked && B.ok ? COUT : '#ff9f5a');
  lab.setGlow('rgba(255,159,90,.26)');
  if (!B.checked) lab.setState({ emo: job.emo, title: job.name, lead: tb.lead, body: '', extra: '' });
  else if (B.ok) {
    const r = evalBuild();
    lab.setState({ emo: '✅', title: tb.okT, lead: job.ok, body: r.extra.length ? tb.extra(r.extra.map((p) => T[lang].parts[p]).join(', ')) : '', extra: '' });
  } else lab.setState({ emo: '🔍', title: tb.noT, lead: B.miss.map((g) => job.miss[g]).join(' '), body: tb.missing(B.miss.map((g) => tb.grp[g]).join(', ')), extra: '' });
}
function secUI() {
  const t = T[lang];
  if (S.sec === 'mouse') {
    lab.setReadout('1964', t.mouse.sub, '', '#e0ad6e'); lab.setGlow('rgba(224,173,110,.28)');
    lab.setState({ emo: '🖱️', title: t.mouse.title, lead: t.mouse.lead, body: '', extra: '' });
  } else {
    lab.setReadout(esc(t.kb.names[S.kb]), t.kb.who[S.kb], '', '#ffc857'); lab.setGlow('rgba(255,200,87,.26)');
    lab.setState({ emo: '⌨️', title: t.kb.names[S.kb], lead: t.kb.lead[S.kb], body: '', extra: '' });
  }
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  document.body.dataset.v = v;
  const allSorted = SO.items.every((q) => q.guess !== null);
  $('cpF').style.display = v === 'follow' && !sec ? '' : 'none';
  $('cpS').style.display = v === 'sort' && !sec && allSorted ? '' : 'none';
  $('cpB').style.display = v === 'build' && !sec ? '' : 'none';
  $('cpKb').style.display = sec === 'kb' ? '' : 'none';
  $('cpKb').innerHTML = t.kb.names.map((n, i) => `<button class="chip ${S.kb === i ? 'on' : ''}" data-act="kb" data-i="${i}">${esc(n)}</button>`).join('');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('cpSec').innerHTML = sc('mouse', '🖱️') + sc('kb', '⌨️');
  renderAsk();
  const f = $('cpPrint'); f.textContent = F.text ? t.f.print : t.f.printNeed; f.disabled = !F.text;
  if (sec) secUI(); else if (v === 'follow') followUI(); else if (v === 'sort') sortUI(); else buildUI();
  lab.setFacts([{ emo: v === 'follow' ? '🖱️' : v === 'sort' ? '⌨️' : '💾', ...t.facts[v] }]);
}
render();
