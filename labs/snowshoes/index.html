const sinkCm = (p) => clamp((p - 5) / 4 * 10, 0, 60);  // d = clamp((p - 5 kPa) / 4 kPa * 10 cm, 0, 60 cm)
const nearest = (vals, r) => vals.reduce((b, v, i) => (Math.abs(Math.log(v / r)) < Math.abs(Math.log(vals[b] / r)) ? i : b), 0);
const rightIdx = (key) => {                            // the lab decides which chip is right, from the model
  if (key === 'snow') return nearest([1, 2, 8], pKPa(50, AREA.boots) / pKPa(50, AREA.snowshoes));

  const r = pKPa(HEEL.m, HEEL.A) / pKPa(ELE.m, ELE.A);
  return Math.abs(Math.log(r)) < 0.05 ? 2 : r > 1 ? 1 : 0;
};

const vToA = (v) => 0.01 * Math.pow(50, v / 1000);

const fmtI = (v) => String(Math.round(v));
const fmtA = (A) => dec(String(+A.toFixed(A < 0.001 ? 4 : 3)));
const fmtN = (F) => String(Math.round(F)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

    rr(c, 201, 204, 122, 86, 12); c.fillStyle = '#141a36'; c.fill(); c.setLineDash([5, 4]); c.lineWidth = 1.5; c.strokeStyle = 'rgba(130,145,190,.5)'; c.stroke(); c.setLineDash([]);
    c.font = '900 46px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#8391cc'; c.fillText('?', 262, 247);
  }
}

// --- secret A: a blunt and a sharp blade on a tomato ---------------------------------------------------------------
function drawKnife(c, time) {
  const t = T[lang], u = (time - S.secAt) % 3.6 / 3.6;
  const press = ease(u / 0.42) * (1 - ease((u - 0.72) / 0.22));
  const cutKeep = u < 0.97 ? easeOut(u / 0.42) : 0;
  c.fillStyle = lg(c, 0, 0, 0, 300, [[0, '#222949'], [1, '#383e68']]); c.fillRect(-1000, -1000, 2360, 2300);
  c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 16; c.shadowOffsetY = 6;
  rr(c, 14, 150, 332, 144, 18); c.fillStyle = lg(c, 0, 150, 0, 294, [[0, '#dcae74'], [1, '#a9763f']]); c.fill(); c.restore();
  c.strokeStyle = 'rgba(110,70,30,.35)'; c.lineWidth = 1.2; c.beginPath(); for (let i = 0; i < 9; i++) { const yy = 160 + i * 15; c.moveTo(22, yy); c.bezierCurveTo(120, yy - 5, 240, yy + 6, 338, yy - 2); } c.stroke();
  rr(c, 14, 150, 332, 144, 18); c.lineWidth = 1.5; c.strokeStyle = '#7e5226'; c.stroke();
  for (const [i, x] of [[0, 95], [1, 265]]) {
    const sharp = i === 1, edge = 160 + press * (sharp ? 58 : 22), dd = Math.max(0, edge - 172);
    // tomato
    c.save(); c.translate(x, 264); c.scale(1 + (sharp ? 0 : dd * 0.004), 1 - (sharp ? 0 : dd * 0.007)); c.translate(-x, -264);
    c.fillStyle = 'rgba(0,0,0,.3)'; ell(c, x + 4, 266, 50, 8); c.fill();
    c.fillStyle = rg(c, x - 15, 198, 4, 66, [[0, '#ff8b72'], [0.55, '#e23a2e'], [1, '#a61d1f']]); ell(c, x, 218, 47, 46); c.fill(); c.lineWidth = 1.6; c.strokeStyle = '#7d1316'; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.5)'; ell(c, x - 22, 198, 9, 5, -0.7); c.fill();
    c.fillStyle = '#4a9a3c'; for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2 - 0.6; ell(c, x - 16 + Math.cos(a) * 7, 177 + Math.sin(a) * 3.5, 6, 2.4, a); c.fill(); }
    if (!sharp && dd > 0) { c.fillStyle = 'rgba(110,20,20,.55)'; ell(c, x, 173 + dd * 0.35, 24, dd * 0.55 + 1); c.fill(); }
    if (sharp) {
      const cd = (cutKeep > 0 ? Math.max(cutKeep * 46, 0) : 0), g = 1 + cd * 0.07;
      if (cd > 1) { c.fillStyle = '#6a0e14'; poly(c, [[x - g, 172], [x + g, 172], [x + 0.6, 172 + cd], [x - 0.6, 172 + cd]]); c.fill(); }
      if (cd > 18) { c.fillStyle = '#d42b2b'; for (const [dx, dy, r] of [[-9, 171, 2.2], [11, 170, 1.8], [18, 172, 1.4]]) { ell(c, x + dx, dy, r, r); c.fill(); } }
    }
    c.restore();
    // the blade: same width at the top, a rounded edge or a sharp one
    const hw = sharp ? 1.2 : 11, off = edge - 160;
    c.save(); c.translate(0, off);
    c.fillStyle = lg(c, x - 28, 0, x + 28, 0, [[0, '#f6f8fc'], [0.5, '#c5d0e0'], [1, '#8896ae']]);
    c.beginPath(); c.moveTo(x - 28, 62); c.lineTo(x + 28, 62); c.lineTo(x + hw, 160 - (sharp ? 0 : 6)); if (!sharp) c.quadraticCurveTo(x, 164, x - hw, 154); else c.lineTo(x - hw, 160); c.closePath(); c.fill();
    c.lineWidth = 1.5; c.strokeStyle = '#56627a'; c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(x - 22, 66); c.lineTo(x - hw - 1.5, 155); c.stroke();
    c.fillStyle = lg(c, x - 20, 0, x + 20, 0, [[0, '#7a5036'], [1, '#3e2819']]); rr(c, x - 20, 28, 40, 38, 9); c.fill(); c.lineWidth = 1.4; c.strokeStyle = '#2a190e'; c.stroke();
    c.fillStyle = '#d7dde9'; ell(c, x - 8, 47, 2.4, 2.4); c.fill(); ell(c, x + 8, 47, 2.4, 2.4); c.fill();
    c.restore();
    // the same push on both: one arrow each
    c.fillStyle = '#f5c84c'; poly(c, [[x - 4, 4], [x + 4, 4], [x + 4, 16], [x + 10, 16], [x, 28], [x - 10, 16], [x - 4, 16]]); c.fill(); c.lineWidth = 1.2; c.strokeStyle = '#a77d12'; c.stroke();
    txt(c, 'F', x + 16, 14, 'left', '#ffe08a', 900);
    pill(c, `${sharp ? t.edgeSharp : t.edgeBlunt} · ${sharp ? dec('0.01') : '1'} ${t.mm2}`, x, 283, { stroke: sharp ? '#ff8d7e' : '#cfd6ea' });
  }
}

// --- secret B: wide padded camel feet and hooves on sand ---------------------------------------------------------------
function drawLegs(c, xs, topY, endY, wLeg, dark) {
  for (const [x, far] of xs) {
    c.fillStyle = far ? dark[1] : lg(c, x - wLeg / 2, 0, x + wLeg / 2, 0, [[0, dark[2]], [1, dark[0]]]);
    rr(c, x - wLeg / 2, topY, wLeg, endY - topY, wLeg / 2.2); c.fill(); c.lineWidth = 1.3; c.strokeStyle = dark[3]; c.stroke();
  }
}
function drawCamelScene(c, time) {
  const t = T[lang], u = ease((time - S.secAt) / 1.5), SY = 222;
  c.fillStyle = lg(c, 0, 0, 0, 215, [[0, '#2b2c60'], [0.55, '#b0647e'], [1, '#f2b97c']]); c.fillRect(-1000, -1000, 2360, 1215);
  c.fillStyle = rg(c, 180, 190, 6, 70, [[0, 'rgba(255,230,160,.95)'], [1, 'rgba(255,200,120,0)']]); c.fillRect(100, 120, 160, 100);
  c.fillStyle = '#ffe9a8'; ell(c, 180, 196, 19, 19); c.fill();
  c.fillStyle = lg(c, 0, 150, 0, 222, [[0, '#cf8f6a'], [1, '#e9b57a']]);
  c.beginPath(); c.moveTo(-1000, 222); c.lineTo(-1000, 188); c.lineTo(0, 188); c.bezierCurveTo(80, 160, 150, 200, 230, 176); c.bezierCurveTo(290, 160, 330, 190, 360, 182); c.lineTo(1360, 182); c.lineTo(1360, 222); c.closePath(); c.fill();
  // the sand, cut open
  c.fillStyle = lg(c, 0, SY, 0, 300, [[0, '#f3d49a'], [1, '#cf9f5c']]); c.fillRect(-1000, SY, 2360, 1100);
  c.strokeStyle = 'rgba(160,110,50,.3)'; c.lineWidth = 1; for (let i = 1; i < 4; i++) { c.beginPath(); for (let q = -10; q <= 370; q += 8) { const yy = SY + i * 22 + Math.sin(q * 0.1 + i * 2) * 1.8; q > -10 ? c.lineTo(q, yy) : c.moveTo(q, yy); } c.stroke(); }
  c.lineWidth = 2; c.strokeStyle = '#fff2cf'; c.beginPath(); c.moveTo(-1000, SY); c.lineTo(1360, SY); c.stroke();
  const camel = { x: 98, s: 0.92, notchW: 28, depth: 5 * u }, horse = { x: 262, s: 0.98, notchW: 11, depth: 29 * u };
  const camelLegs = [[-34, 0], [-24, 1], [20, 1], [30, 0]], horseLegs = [[-30, 0], [-21, 1], [19, 1], [28, 0]];
  const notches = (a, legs) => { for (const [lx] of legs) { const x = a.x + lx * a.s * (a === horse ? -1 : 1); const w = a.notchW / 2, d = a.depth; c.fillStyle = '#b98a4c'; poly(c, [[x - w - d * 0.12, SY], [x - w, SY + d], [x + w, SY + d], [x + w + d * 0.12, SY]]); c.fill(); } };
  notches(camel, camelLegs); notches(horse, horseLegs);
  // the camel
  const CD = ['#c8965c', '#9d7044', '#e2b680', '#7d5530'];
  c.save(); c.translate(camel.x, SY); c.scale(camel.s, camel.s); c.lineJoin = 'round'; c.lineCap = 'round';
  const cdep = camel.depth / camel.s;
  drawLegs(c, camelLegs.filter((l) => l[1]).map(([x, f]) => [x, f]), -62, cdep, 9, CD);
  c.fillStyle = '#8f6238'; for (const [x, f] of camelLegs) if (f) { ell(c, x, cdep + 1, 13, 3.6); c.fill(); }
  c.lineWidth = 3; c.strokeStyle = '#7d5530'; c.beginPath(); c.moveTo(-52, -92); c.quadraticCurveTo(-60, -80, -56, -62); c.stroke();
  c.fillStyle = lg(c, -40, -100, 40, -60, [[0, '#e2b680'], [1, '#b88450']]); ell(c, 0, -84, 54, 25); c.fill(); c.lineWidth = 1.6; c.strokeStyle = CD[3]; c.stroke();
  c.fillStyle = lg(c, -22, -130, 6, -96, [[0, '#e8c08c'], [1, '#b88450']]); ell(c, -9, -108, 19, 17); c.fill(); c.stroke();
  c.lineWidth = 15; c.strokeStyle = CD[3]; c.beginPath(); c.moveTo(38, -92); c.bezierCurveTo(60, -100, 52, -126, 66, -136); c.stroke();
  c.lineWidth = 12; c.strokeStyle = '#d9a96f'; c.beginPath(); c.moveTo(38, -92); c.bezierCurveTo(60, -100, 52, -126, 66, -136); c.stroke();
  c.fillStyle = lg(c, 58, -150, 90, -128, [[0, '#e8c08c'], [1, '#b88450']]); ell(c, 76, -141, 15, 9.5, 0.28); c.fill(); c.lineWidth = 1.5; c.strokeStyle = CD[3]; c.stroke();
  c.fillStyle = '#c8965c'; ell(c, 62, -150, 4, 6, -0.3); c.fill(); c.stroke();
  c.fillStyle = '#2a2230'; ell(c, 73, -144, 2.2, 2.4); c.fill(); c.fillStyle = '#fff'; ell(c, 73.7, -144.8, 0.8, 0.8); c.fill();
  drawLegs(c, camelLegs.filter((l) => !l[1]).map(([x, f]) => [x, f]), -62, cdep, 9.5, CD);
  c.fillStyle = lg(c, 0, -2 + cdep, 0, 5 + cdep, [[0, '#c08c55'], [1, '#8f6238']]); c.lineWidth = 1.3; c.strokeStyle = CD[3];
  for (const [x, f] of camelLegs) if (!f) { ell(c, x, cdep + 1, 14.5, 4.4); c.fill(); c.stroke(); }
  c.restore();
  // the horse (facing the camel)
  const HD = ['#8f5e3f', '#5e3b27', '#b5805c', '#3b2316'];
  c.save(); c.translate(horse.x, SY); c.scale(-horse.s, horse.s); c.lineJoin = 'round'; c.lineCap = 'round';
  const hdep = horse.depth / horse.s;
  drawLegs(c, horseLegs.filter((l) => l[1]).map(([x, f]) => [x, f]), -62, hdep, 6.5, HD);
  c.fillStyle = '#2a1c14'; for (const [x, f] of horseLegs) if (f) { rr(c, x - 4.2, hdep - 6, 8.4, 7, 2); c.fill(); }
  c.strokeStyle = '#2d1b10'; c.lineWidth = 5; c.beginPath(); c.moveTo(-44, -88); c.bezierCurveTo(-64, -80, -66, -56, -58, -38); c.stroke();
  c.fillStyle = lg(c, -40, -100, 40, -60, [[0, '#b5805c'], [1, '#7a4b30']]); ell(c, 0, -80, 46, 22); c.fill(); c.lineWidth = 1.6; c.strokeStyle = HD[3]; c.stroke();
  c.lineWidth = 15; c.strokeStyle = HD[3]; c.beginPath(); c.moveTo(34, -88); c.lineTo(52, -126); c.stroke();
  c.lineWidth = 12; c.strokeStyle = '#a06c48'; c.beginPath(); c.moveTo(34, -88); c.lineTo(52, -126); c.stroke();
  c.strokeStyle = '#2d1b10'; c.lineWidth = 5; c.beginPath(); c.moveTo(30, -98); c.quadraticCurveTo(42, -116, 48, -134); c.stroke();
  c.fillStyle = lg(c, 46, -144, 82, -112, [[0, '#b5805c'], [1, '#7a4b30']]); ell(c, 64, -130, 18, 9, 0.62); c.fill(); c.lineWidth = 1.5; c.strokeStyle = HD[3]; c.stroke();
  c.fillStyle = '#7a4b30'; poly(c, [[48, -136], [50, -150], [56, -138]]); c.fill(); c.stroke();
  c.fillStyle = '#2a2230'; ell(c, 59, -134, 2.1, 2.3); c.fill(); c.fillStyle = '#fff'; ell(c, 59.6, -134.8, 0.8, 0.8); c.fill();
  drawLegs(c, horseLegs.filter((l) => !l[1]).map(([x, f]) => [x, f]), -62, hdep, 7, HD);
  c.fillStyle = '#2a1c14'; for (const [x, f] of horseLegs) if (!f) { rr(c, x - 5, hdep - 7, 10, 8, 2.4); c.fill(); }
  c.restore();
  pill(c, t.camel, 98, 283, { stroke: '#e8b070' }); pill(c, t.horse, 262, 283, { stroke: '#cfd6ea' });
}

// --- the loop ------------------------------------------------------------------------------------------------------
function tick(dt) {
  const k = 1 - Math.exp(-dt * 5), kd = 1 - Math.exp(-dt * 3.2);
  S.mv += (S.m - S.mv) * k;
  S.dep += ((S.pick.snow !== null ? sinkCm(pKPa(S.m, AREA[S.fw])) : 0) - S.dep) * kd;
  S.depC += ((S.pick.curve !== null ? sinkCm(pKPa(S.m, S.A)) : 0) - S.depC) * kd;
  S.cT = clamp(S.cT + (S.pick.curve !== null ? dt / 1.1 : -dt * 3), 0, 1);
  S.sT = clamp(S.sT + (S.pick.sharp !== null ? dt / 1.2 : -dt * 3), 0, 1);
  S.ym += (Math.ceil(pKPa(S.m, 0.01) / 10 - 1e-9) * 10 - S.ym) * k;
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  tick(dt);
  const v = S.sec || lab.view, [W, H] = DESIGN[v], sc = Math.min(w / W, h / H, 1.7);
  GEO = { ox: (w - W * sc) / 2, oy: (h - H * sc) / 2, sc };
  FS = Math.max(13, 12.4 / sc);
  c.save(); c.translate(GEO.ox, GEO.oy); c.scale(sc, sc);
  if (v === 'snow') drawSnow(c, time); else if (v === 'curve') drawCurveView(c, time); else if (v === 'sharp') drawSharpView(c, time);
  else if (v === 'knife') drawKnife(c, time); else drawCamelScene(c, time);
  c.restore();
});

// dragging the marker along the curve
const cv = $('cv');
const toDesign = (ev) => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left - GEO.ox) / GEO.sc, y: (ev.clientY - r.top - GEO.oy) / GEO.sc }; };
const setArea = (A) => { const k = snapKind(A); S.A = k ? AREA[k] : clamp(A, 0.01, 0.5); render(); };
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'curve') return;
  const p = toDesign(ev); if (p.y < 112 || p.x < PLOT.x0 - 14) return;
  dragging = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine without capture */ }
  setArea(0.01 * Math.pow(50, clamp01((p.x - PLOT.x0) / (PLOT.x1 - PLOT.x0))));
});
cv.addEventListener('pointermove', (ev) => { if (dragging) setArea(0.01 * Math.pow(50, clamp01((toDesign(ev).x - PLOT.x0) / (PLOT.x1 - PLOT.x0)))); });
['pointerup', 'pointercancel'].forEach((e) => cv.addEventListener(e, () => { dragging = false; }));

// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => {                       // on a phone the controls sit below the picture: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(key, i) {
  if (S.pick[key] !== null) return;
  S.pick[key] = i; (i === rightIdx(key) ? sfx.good : sfx.bad)();
  if (key === 'snow') {                         // the person steps out of boots into snowshoes
    S.fw = 'boots'; clearTimeout(S.tm);
    S.tm = setTimeout(() => { S.fw = 'snowshoes'; S.hopAt = now(); render(); }, 1700);
  }
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-ask], [data-fw]'); if (!b) return;
  if (b.dataset.ask) answer(b.dataset.ask, +b.dataset.i);
  else if (b.dataset.fw && b.dataset.fw !== S.fw) { clearTimeout(S.tm); S.fw = b.dataset.fw; S.hopAt = now(); sfx.click(); render(); }
});
$('ssSec').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.sec; S.sec = S.sec === k ? null : k; S.secAt = now(); sfx.click(); render();
});
const onMass = (ev) => { S.m = +ev.target.value; sfx.tick(); render(); };
$('ssMassA').addEventListener('input', onMass); $('ssMassB').addEventListener('input', onMass);
$('ssArea').addEventListener('input', (ev) => { sfx.tick(); setArea(vToA(+ev.target.value)); });

// --- one render per change: controls, readout and the state card ------------------------------------------------------
const ASK = (t, key) => ({
  snow: { q: t.snowAsk, opts: t.snowOpts, right: t.snowRight, wrong: t.snowWrong },
  curve: { q: t.curveAsk, opts: t.curveOpts, right: t.curveRight, wrong: t.curveWrong },
  sharp: { q: t.sharpAsk, opts: t.sharpOpts, right: t.sharpRight, wrong: t.sharpWrong },
})[key];
function askHtml(t, key) {                      // the chips stay after the answer: the right one green, a wrong tap red
  const a = ASK(t, key), pick = S.pick[key], ok = rightIdx(key);
  const chips = a.opts.map((o, i) => `<button class="chip ss-opt${pick === null ? '' : i === ok ? ' good' : i === pick ? ' bad' : ' dim'}" data-ask="${key}" data-i="${i}"${pick === null ? '' : ' disabled'}>${esc(o)}</button>`).join('');
  const verdict = pick === null ? '' : `<div class="ss-verdict ${pick === ok ? 'ok' : 'no'}">${esc(pick === ok ? a.right : a.wrong)}</div>`;
  return `<div class="ss-q">${esc(a.q)}</div><div class="chips">${chips}</div>${verdict}`;
}
const neutral = (t, key) => ({ emo: '🤔', title: ASK(t, key).q, lead: '', body: '', extra: '' });   // no answers on the card while predicting
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec || v;
  for (const k of ['snow', 'curve', 'sharp']) $('ss-' + k).style.display = !sec && v === k ? 'block' : 'none';
  $('ssMassLA').textContent = $('ssMassLB').textContent = `${t.mass}: ${S.m} ${t.kg}`;
  $('ssGA').textContent = $('ssGB').textContent = t.g;
  $('ssMassA').value = $('ssMassB').value = String(S.m);
  $('ssMassA').setAttribute('aria-label', t.mass); $('ssMassB').setAttribute('aria-label', t.mass);
  $('ssSec').innerHTML = [['knife', '🔪', 'a'], ['camel', '🐪', 'b']].map(([k, emo, s]) => {
    const open = secret.unlocked();
    return `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[s][0])}` : '🔒 ???'}</button>`;
  }).join('');
  lab.setFacts(t.facts[v]);
  if (sec) return renderSecret(t, sec);
  if (v === 'snow') renderSnow(t); else if (v === 'curve') renderCurve(t); else renderSharp(t);
}
function renderSecret(t, sec) {
  lab.setGlow(sec === 'knife' ? 'rgba(207, 216, 232, .22)' : 'rgba(224, 161, 90, .26)');
  if (sec === 'knife') {
    lab.setReadout('100×', t.pressure, t.formula, '#cfd8e8');
    lab.setState({ emo: '🔪', title: t.secrets.a[0], lead: t.knifeText, body: '', extra: '' });
  } else {
    lab.setReadout('🐪 · 🐴', '', t.formula, '#e0a15a');
    lab.setState({ emo: '🐪', title: t.secrets.b[0], lead: t.camelText, body: '', extra: '' });
  }
}
function renderSnow(t) {
  const shown = S.pick.snow !== null, A = AREA[S.fw], p = pKPa(S.m, A), d = Math.round(sinkCm(p));
  lab.setGlow('rgba(110, 170, 232, .28)');
  $('ssAskSnow').innerHTML = askHtml(t, 'snow');
  $('ssCtlSnow').style.display = shown ? 'block' : 'none';
  $('ssFw').innerHTML = KINDS.map((k) => `<button class="chip ss-fw ${S.fw === k ? 'on' : ''}" data-fw="${k}">${esc(t.footwear[k])}</button>`).join('');
  if (shown) {
    lab.setReadout(esc(t.kPa(fmtP(p / 1))), t.pSub, t.sinks(d), '#6fb0e8');
    const [emo, title, lead, body] = t.st.snow; lab.setState({ emo, title, lead, body, extra: '' });
  } else {
    lab.setReadout('?', '', '', '#6fb0e8'); lab.setState(neutral(t, 'snow'));
  }
}
function renderCurve(t) {
  const shown = S.pick.curve !== null, p = pKPa(S.m, S.A);
  lab.setGlow('rgba(91, 141, 239, .28)');
  $('ssAskCurve').innerHTML = askHtml(t, 'curve');
  $('ssAreaL').textContent = `${t.area}: ${fmtA(S.A)} ${t.m2}`;
  $('ssArea').value = String(aToV(S.A)); $('ssArea').setAttribute('aria-label', t.area);
  $('ssCtlCurve').style.display = shown ? 'block' : 'none';
  if (shown) {
    lab.setReadout(esc(t.kPa(fmtP(p))), t.pressure, t.formula, '#5b8def');
    const [emo, title, lead, body] = t.st.curve; lab.setState({ emo, title, lead, body, extra: '' });
  } else {
    lab.setReadout('?', '', '', '#5b8def'); lab.setState(neutral(t, 'curve'));
  }
}
function renderSharp(t) {
  const shown = S.pick.sharp !== null;
  lab.setGlow('rgba(232, 100, 124, .28)');
  $('ssAskSharp').innerHTML = askHtml(t, 'sharp');
  if (shown) {
    lab.setReadout(esc(t.vs(fmtI(pKPa(HEEL.m, HEEL.A)), fmtI(pKPa(ELE.m, ELE.A)))), '', t.notWeight, '#e8647c');
    const [emo, title, lead, body] = t.st.sharp; lab.setState({ emo, title, lead, body, extra: '' });
  } else {
    lab.setReadout('?', '', '', '#e8647c'); lab.setState(neutral(t, 'sharp'));
  }
}
render();
