  c.fillStyle = C.col; c.strokeStyle = '#C88F1E'; c.lineWidth = 1; path(q); c.fill(); c.stroke(); c.restore();
  const a = time - HU.landAt, sy = a >= 0 && a < 0.5 ? 1 - 0.12 * Math.exp(-a * 8) * Math.cos(a * 18) : 1;
  c.save(); c.fillStyle = 'rgba(10,5,25,.3)'; c.beginPath(); c.ellipse(base[0], base[1] + 0.05 * s, 0.7 * s, 0.26 * s, 0, 0, Math.PI * 2); c.fill(); c.restore();
  drawFrog(c, base[0], base[1] + 0.12 * s, s * 1.8, 1 + (1 - sy) * 0.8, sy, [0, 1]);
  // floor labels on the right
  for (let f = 0; f < NF; f++) {
    const [rx, ry] = P(10, 0, f * GZ + SL), on = Math.abs(f - fl) < 0.5, txt = `${f * 100 + 1}–${f * 100 + 100}`;
    c.save(); c.font = `800 12px Nunito, sans-serif`; const tw = c.measureText(txt).width + 12, X = Math.min(rx + 8, w - tw - 4), Y = ry + 0.5 * s;
    c.fillStyle = on ? C.col : 'rgba(20,14,36,.8)'; c.beginPath(); c.roundRect(X, Y - 8, tw, 16, 8); c.fill();
    c.fillStyle = on ? '#2A2045' : '#D3D9E8'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, X + tw / 2, Y + 0.5); c.restore();
  }
}

// --- the frame loop: advance the frog and the timed effects, then draw ------------------------------------------
function tickAnim(time) {
  if (S.hl.length) S.hl = S.hl.filter((e) => time < e.born + e.ttl);
  const g = S.ghost;
  if (g) { const k = clamp(Math.floor((performance.now() - g.t0) / g.per), 0, g.cells.length); if (k !== g.k) { g.k = k; renderCnt(); } }
  if (S.sec === 'gauss' && GA.k < 50) {
    const k = Math.min(50, Math.floor((performance.now() / 1000 - GA.t0) / 0.16) + 1);
    if (k > GA.k) {
      while (GA.k < k) { GA.k++; for (const n of [GA.k, 101 - GA.k]) glowCell(n, pairColor(GA.k), false); sfx.tick(); }
      readout();
      if (GA.k === 50) { sfx.good(); render(); }
    }
  }
  if (S.sec === 'hundred' && HU.moving) {
    const u = (performance.now() / 1000 - HU.t0) / 0.9;
    HU.fl = lerp(HU.from, HU.to, eio(u));
    if (u >= 1) { const prev = HU.floor * 100 + HU.n; HU.moving = false; HU.fl = HU.floor = HU.to; HU.landAt = time; sfx.tick(); render(); readout(prev); }
  }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  S.time = time;
  tickFrog(dt); tickAnim(time);
  if (S.sec === 'hundred') drawStack(c, w, h, time); else drawBoard(c, w, h, time);
});

// tap a number on the board
$('cv').addEventListener('pointerdown', (ev) => {
  if (!BG || S.sec) return;
  const r = $('cv').getBoundingClientRect(), col = Math.floor((ev.clientX - r.left - BG.ox) / BG.p), row = Math.floor((ev.clientY - r.top - BG.oy) / BG.p);
  if (col < 0 || col > 9 || row < 0 || row > 9) return;
  const n = row * 10 + col + 1, v = lab.view;
  if (v === 'jump' && J.free) { if (n === F.goal) return; S.hl = []; hop(n, { onLand: (m) => { J.pos = m; readout(); } }); sfx.click(); render(); }
  else if (v === 'diag' && D.stage === 'free') {
    if (busy()) return;
    S.hl = []; S.feet = []; S.line = null; D.start = n; S.ring = n; hop(n, { dur: 0.3, leave: false, onLand: () => readout() }); sfx.click(); render();
  }
});

// --- controls ----------------------------------------------------------------------------------------------------
// on a phone the controls sit below the board: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const hopBtns = (order, goal, t, off) => `<div class="hops">${order.map((k) => {
  const d = HOP[k], to = goal + d;
  return `<button class="hopb ${Math.abs(d) === 10 ? 'v' : 'h'}" data-act="hop" data-d="${d}"${to >= 1 && to <= 100 && !off ? '' : ' disabled'}>${esc(t.hop[k])}</button>`;
}).join('')}</div>`;
const ansBtns = (opts, okI, ph) => `<div class="ans-row">${opts.map((o, i) => {
  const cls = ph === 'done' ? (i === okI ? 'good' : i === A.pickShown ? 'bad' : '') : ph === 'run' && i === A.pickShown ? 'pick' : '';
  return `<button class="ans ${cls}" data-act="pick" data-i="${i}"${ph === 'ask' || ph === 'play' ? '' : ' disabled'}>${esc(o)}</button>`;
}).join('')}</div>`;
const verdictHTML = (ok, text, extra = '') => `<div class="verdict ${ok ? 'good' : 'bad'}">${esc(ok ? T[lang].right : T[lang].wrong)}</div>${extra}<p class="rtext">${esc(text)}</p>`;
const chipRow = (t) => {
  const open = secret.unlocked();
  const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="row2"><div class="chips">${chip('hundred', '🏢')}${chip('gauss', '🧠')}</div></div>`;
};

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i, v = lab.view;
  if (act === 'sec') return onSec(b.dataset.k);
  if (act === 'up100') return up100();
  if (act === 'again') return again();
  if (act === 'pick') { if (v === 'jump') jReveal(i); else if (v === 'add') (A.stage === 'q0' ? aRevealQ0(i) : aSpecial(i)); else dReveal(i); }
  else if (act === 'next') { sfx.click(); if (v === 'jump') jNext(); else if (v === 'add') aNext(); else dNext(); }
  else if (act === 'hop') { if (v === 'jump') jFree(+b.dataset.d); else aHop(+b.dataset.d); }
  else if (act === 'done') aDone();
  else if (act === 'chain') dChain(+b.dataset.st);
});

// --- view 1: jumps -----------------------------------------------------------------------------------------------
function jStart(i) { S.tok++; clearScene(); S.feetCap = Infinity; place(JR[i].s); J.round = i; J.ph = 'ask'; J.pick = null; A.pickShown = null; render(); }
function jReveal(k) {
  const i = J.round, { s, d } = JR[i], ok = k === T.en.j.rounds[i].ok, tok = ++S.tok;
  J.ph = 'run'; J.pick = A.pickShown = k; render(); showStage();
  let n = s;
  d.forEach((st) => { const prev = n; n += st; hop(n, { onLand: () => readout(prev) }); });
  const end = n;
  afterIdle(() => {
    if (i === 3) { glowRow(3, 3); glowRow(4, 3); } else glowCol(colOf(end));
    setTimeout(() => {
      if (tok !== S.tok) return;
      J.ph = 'done'; S.seen.jump = true; (ok ? sfx.good : sfx.bad)(); render();
    }, 750);
  });
}
function jNext() {
  if (J.round < 3) return jStart(J.round + 1);
  S.tok++; clearScene(); S.feetCap = 14; J.free = true; J.pos = F.goal; render();
}
function jFree(d) {
  const to = F.goal + d; if (to < 1 || to > 100) return;
  S.hl = []; sfx.click();
  hop(to, { onLand: (m) => { J.pos = m; if (Math.abs(d) === 10) glowCol(colOf(m)); else glowRow(rowOf(m), 1.6); readout(m - d); } });
  render();
}
function ctrlJump(t) {
  let h = '';
  if (S.sec === 'hundred') h += `<p class="note">${esc(t.sec.hundredText)}</p><div class="row2"><button class="btn" data-act="up100"${HU.floor >= 9 || HU.moving ? ' disabled' : ''}>${esc(t.sec.up100)}</button></div>`;
  else if (S.sec === 'gauss') h += `<p class="note">${esc(t.sec.gaussText)}</p><div class="row2"><button class="chip" data-act="again">${esc(t.again)}</button></div>`;
  else if (!J.free) {
    const r = t.j.rounds[J.round];
    h += `<div class="q">${esc(t.j.q(r.s, r.st))}</div>${ansBtns(r.o, r.ok, J.ph)}`;
    if (J.ph === 'done') h += verdictHTML(J.pick === r.ok, t.j.r[J.round]) + `<button class="btn" data-act="next">${esc(t.next)}</button>`;
  } else h += `<p class="note" style="margin-bottom:10px">${esc(t.j.free)}</p>${hopBtns(['up', 'down', 'left', 'right'], F.goal, t)}<div class="row2"><button class="chip" data-act="again">${esc(t.again)}</button></div>`;
  return h + chipRow(t);
}

// --- the two secrets ---------------------------------------------------------------------------------------------
function onSec(k) {
  if (!secret.unlocked()) return secret.open();
  sfx.click(); S.tok++; clearScene(); F.hide = false;
  S.sec = S.sec === k ? null : k;
  if (S.sec === 'hundred') { Object.assign(HU, { floor: 3, n: 45, fl: 3, from: 3, to: 3, moving: false, landAt: -9 }); }
  else if (S.sec === 'gauss') { F.hide = true; GA.k = 0; GA.t0 = performance.now() / 1000; }
  else enterJump();
  render();
}
function up100() {
  if (HU.moving || HU.floor >= 9) return;
  HU.from = HU.floor; HU.to = HU.floor + 1; HU.t0 = performance.now() / 1000; HU.moving = true; sfx.snap(); render();
}
function again() {
  sfx.click();
  const v = lab.view;
  if (S.sec === 'gauss') { S.hl = []; GA.k = 0; GA.t0 = performance.now() / 1000; render(); }
  else if (v === 'jump') { J.free = false; jStart(0); }
  else if (v === 'add') aStartRound(A.ph === 'done' && A.round === 3 ? 0 : A.round);
}

// --- view 2: add -------------------------------------------------------------------------------------------------
function aStartQ0() { S.tok++; clearScene(); S.feetCap = Infinity; A.stage = 'q0'; A.ph = 'ask'; A.pick = A.pickShown = null; A.start = 47; A.cB = 0; place(47); render(); }
function aStartRound(i) {
  S.tok++; clearScene(); S.feetCap = Infinity;
  A.stage = 'play'; A.round = i; A.ph = 'play'; A.steps = []; A.pick = A.pickShown = null; A.start = AR[i].a; place(A.start); render();
}
function aRevealQ0(k) {
  const tok = ++S.tok, per = 70;
  A.ph = 'run'; A.pick = A.pickShown = k; A.cB = 0; render(); showStage();
  S.ghost = { cells: Array.from({ length: 25 }, (_, i) => 48 + i), t0: performance.now(), per, k: 0, dimAt: 0 };
  setTimeout(() => {
    if (tok !== S.tok) return;
    S.ghost.dimAt = performance.now();
    let n = 47;
    [10, 10, 1, 1, 1, 1, 1].forEach((d) => { const prev = n; n += d; hop(n, { onLand: () => { A.cB++; renderCnt(); readout(prev); } }); });
    afterIdle(() => setTimeout(() => {
      if (tok !== S.tok) return;
      A.ph = 'done'; S.seen.add = true; (k === 1 ? sfx.good : sfx.bad)(); render();
    }, 600));
  }, 25 * per + 500);
}
function aHop(d) {
  if (A.ph !== 'play') return;
  const to = F.goal + d; if (to < 1 || to > 100) return;
  A.steps.push(d); sfx.click();
  hop(to, { onLand: (m) => readout(m - d) });
  render();
}
function aDone() {
  if (A.ph !== 'play') return;
  A.ph = 'check'; render();
  afterIdle(() => aVerdict(F.goal === AR[A.round].ans));
}
function aSpecial(k) { if (A.ph === 'play') { A.pick = A.pickShown = k; aVerdict(k === 0); } }
function aVerdict(ok) {
  const i = A.round;
  A.ph = 'done'; A.ok = ok; S.seen.add = true;
  S.ring = AR[i].ans; S.guides = AR[i].paths.map((segs) => ({ cells: pathCells(AR[i].a, segs), t0: S.time }));
  (ok ? sfx.good : sfx.bad)(); render(); showStage();
}
function aNext() { if (A.stage === 'q0') aStartRound(0); else if (A.round < 3) aStartRound(A.round + 1); }
const exprText = () => {
  const st = A.steps, tail = st.slice(-8).map((d) => OPS[d]).join(' ');
  return `${A.start}${st.length > 8 ? ' …' : ''}${tail ? ' ' + tail : ''}`;
};
function renderCnt() {
  const a = $('cntA'), b = $('cntB'); if (!a || !b) return;
  a.textContent = T[lang].a.hops(S.ghost ? S.ghost.k : 0); b.textContent = T[lang].a.hops(A.cB);
}
function ctrlAdd(t) {
  const a = t.a;
  if (A.stage === 'q0') {
    let h = `<div class="q">${esc(a.q0)}</div>${ansBtns(a.o0, 1, A.ph)}`;
    if (A.ph !== 'ask') h += `<div class="cnts"><span class="cp a"><i></i><b id="cntA">${esc(a.hops(S.ghost ? S.ghost.k : 0))}</b></span><span class="cp b"><i></i><b id="cntB">${esc(a.hops(A.cB))}</b></span></div>`;
    if (A.ph === 'done') h += verdictHTML(A.pick === 1, a.r0) + `<button class="btn" data-act="next">${esc(t.next)}</button>`;
    return h;
  }
  const R = AR[A.round], special = A.round === 3;
  let h = `<div class="q">${esc(special ? a.howFar : a.task(R.a, R.op, R.b))}</div>`;
  if (A.ph === 'done') {
    h += verdictHTML(A.ok, a.r[A.round]);
    h += A.round < 3 ? `<button class="btn" data-act="next">${esc(t.next)}</button>` : `<button class="btn" data-act="again">${esc(t.again)}</button>`;
    return h;
  }
  const off = A.ph !== 'play';
  h += hopBtns(['down', 'right', 'up', 'left'], F.goal, t, off);
  const again = `<button class="chip" data-act="again"${off ? ' disabled' : ''}>${esc(t.again)}</button>`;
  if (special) return h + `<div class="ans-row" style="margin-top:12px">${['3', '13', '7'].map((o, i) => `<button class="ans" data-act="pick" data-i="${i}"${off ? ' disabled' : ''}>${o}</button>`).join('')}</div><div class="row2">${again}</div>`;
  return h + `<div class="row2"><button class="btn" data-act="done"${off ? ' disabled' : ''}>${esc(a.done)}</button>${again}</div>`;
}

// --- view 3: shortcuts -------------------------------------------------------------------------------------------
const DQ = { 1: { st: 11, start: 23, ok: 1, eq: '+10 +1 = +11' }, 2: { st: 9, start: 28, ok: 0, eq: '+10 −1 = +9' } };
const dq = () => (D.stage === 'q2' ? 2 : 1);
function dStart(q) { S.tok++; clearScene(); S.feetCap = Infinity; D.stage = 'q' + q; D.ph = 'ask'; D.pick = A.pickShown = null; place(DQ[q].start); render(); }
function dReveal(k) {
  const q = dq(), { st, start, ok } = DQ[q], col = STEPC[st], tok = ++S.tok;
  D.ph = 'run'; D.pick = A.pickShown = k; render(); showStage();
  S.line = { color: col, cells: [start] }; glowCell(start, col);
  let n = start;
  for (let i = 0; i < 4; i++) { const prev = n; n += st; const m = n; hop(m, { onLand: () => { glowCell(m, col); S.line?.cells.push(m); readout(prev); } }); }
  afterIdle(() => setTimeout(() => {
    if (tok !== S.tok) return;
    D.ph = 'done'; S.seen.diag = true; (k === ok ? sfx.good : sfx.bad)(); render();
  }, 700));
}
function dNext() {
  if (D.stage === 'q1') return dStart(2);
  S.tok++; clearScene(); S.feetCap = 30; D.stage = 'free'; place(D.start); S.ring = D.start; render();
}
function dChain(st) {
  if (busy()) return;
  const col = STEPC[st], list = []; let n = D.start;
  for (let i = 0; i < 10; i++) {
    const c0 = colOf(n), nx = n + st;
    if (nx > 100 || (st === 9 && c0 === 0) || (st === 11 && c0 === 9)) break;
    list.push(nx); n = nx;
  }
  if (!list.length) return sfx.bad();
  sfx.click(); S.tok++;
  if (F.goal !== D.start) hop(D.start, { dur: 0.3, leave: false });
  glowCell(D.start, col);
  let prev = D.start;
  list.forEach((m) => { const pv = prev; prev = m; hop(m, { dur: 0.3, onLand: () => { glowCell(m, col); readout(pv); } }); });
}
function ctrlDiag(t) {
  const d = t.d;
  if (D.stage === 'free') {
    return `<p class="note" style="margin-bottom:10px">${esc(d.free)}</p><div class="chips">${[9, 10, 11, 1].map((s) => `<button class="chip step" data-act="chain" data-st="${s}" style="--c:${STEPC[s]}">+${s}</button>`).join('')}</div>`;
  }
  const q = dq(), opts = d['o' + q];
  let h = `<div class="q">${esc(d['q' + q])}</div>${ansBtns(opts, DQ[q].ok, D.ph)}`;
  if (D.ph === 'done') h += verdictHTML(D.pick === DQ[q].ok, d['r' + q], `<div class="eq">${DQ[q].eq}</div>`) + `<button class="btn" data-act="next">${esc(t.next)}</button>`;
  return h;
}

// --- one render per change ---------------------------------------------------------------------------------------
// digits keep their place colours (ones white, tens gold, hundreds orange); a digit that changed flashes
function numHTML(n, prev) {
  const s = String(n), p = prev == null ? null : String(prev).padStart(s.length, ' ');
  return [...s].map((ch, i) => `<span class="dg ${['o', 't', 'h'][Math.min(s.length - 1 - i, 2)]}${p && p[i] !== ch ? ' fl' : ''}">${ch}</span>`).join('');
}
function readout(prev) {
  const v = lab.view, t = T[lang];
  if (S.sec === 'hundred') { lab.setGlow('rgba(255, 201, 74, .22)'); return lab.setReadout(numHTML(HU.floor * 100 + HU.n, prev), '', '', C.col); }
  if (S.sec === 'gauss') {
    lab.setGlow('rgba(255, 143, 177, .2)');
    return lab.setReadout(GA.k >= 50 ? '50 × 101 = 5050' : `${GA.k} × 101`, t.sec.pairs(GA.k), '', C.d9);
  }
  if (v === 'add' && A.stage === 'play') {
    lab.setGlow('rgba(255, 201, 74, .2)');
    return lab.setReadout(esc(exprText()), `🐸 ${F.n}`, '', C.col);
  }
  lab.setGlow(v === 'jump' ? 'rgba(108, 192, 112, .22)' : v === 'add' ? 'rgba(255, 201, 74, .2)' : 'rgba(255, 159, 90, .2)');
  lab.setReadout(numHTML(F.n, prev), '', '', v === 'jump' ? C.path : v === 'add' ? C.col : C.d11);
}
function state() {
  const t = T[lang], v = lab.view;
  if (S.sec) {
    const k = S.sec;
    return lab.setState({ emo: k === 'hundred' ? '🏢' : '🧠', title: t.secrets[k][0], lead: t.secrets[k][1], body: '', extra: k === 'gauss' ? `<div class="fine">${esc(t.fine)}</div>` : '' });
  }
  const [emo, title, lead, body] = t.st[v][S.seen[v] ? 1 : 0];
  lab.setState({ emo, title, lead, body, extra: '' });
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('ctrlBody').innerHTML = v === 'jump' ? ctrlJump(t) : v === 'add' ? ctrlAdd(t) : ctrlDiag(t);
  readout(); state();
}
function enterJump() { F.hide = false; if (J.free) { S.feetCap = 14; place(J.pos); } else jStart(J.round); }
function enter(v) {
  S.tok++; clearScene(); S.sec = null; F.hide = false; S.feetCap = Infinity; HU.moving = false;
  if (v === 'jump') enterJump();
  else if (v === 'add') (A.stage === 'q0' ? aStartQ0() : aStartRound(A.round));
  else if (D.stage === 'free') { S.feetCap = 30; place(D.start); S.ring = D.start; } else dStart(dq());
  render();
}
enter('jump');
</script>
</body>
