        c.fillStyle = '#d6c8a0'; circ(c, gx + 30, 96, 10); c.fill(); circ(c, gx + 56, 100, 8); c.fill();
        ell(c, gx + 112, 96, 22, 12); fs(c, '#94694a', '#43301c', 1.2); c.restore(); }
    }
  }
  c.restore(); rr(c, 0.75, 0.75, 298.5, 198.5, 14); c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1.5; c.stroke();
}
const CT = [[8, 40], [186, 40], [8, 206], [186, 206]], CS = 0.553;
const tileAt = (x, y) => CT.findIndex(([tx, ty]) => x >= tx && x <= tx + 166 && y >= ty && y <= ty + 142);
function drawClues(c, tm) {
  const t = T[lang]; c.fillStyle = lg(c, 0, 0, 0, L.h, [[0, '#191c30'], [1, '#0f1222']]); c.fillRect(0, 0, L.w, L.h);
  if (S.clue === null) {
    c.save(); c.translate(L.ox, L.oy); c.scale(L.s, L.s);
    CT.forEach(([x, y], k) => {
      c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 10; c.shadowOffsetY = 4; c.translate(x, y); c.scale(CS, CS); drawClue(c, k, S.cRev[k], tm); c.restore();
      tag(c, `${S.cDone[k] ? '✓ ' : ''}${t.clueName[k]}`, x + 83, y + 128, { f: 13, bd: S.cDone[k] ? '#3ddc97' : 'rgba(255,215,130,.7)' });
    });
    c.restore(); return;
  }
  const ah = askEl.offsetHeight + 16, avail = L.h - ah - 10, sc = Math.min((L.w - 16) / 300, avail / 200, 1.5);
  if (sc <= 0) return;
  c.save(); c.translate(L.w / 2 - 150 * sc, ah + (avail - 200 * sc) / 2); c.scale(sc, sc); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 14; drawClue(c, S.clue, S.cRev[S.clue], tm); c.restore();
}

// --- loop ----------------------------------------------------------------------------------------------------------
let L = { s: 1, ox: 0, oy: 0, w: 360, h: 380 };
function step(dt) {
  for (let i = puffs.length - 1; i >= 0; i--) { const p = puffs[i]; p.l += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.l >= p.life) puffs.splice(i, 1); }
  PL.forEach((p, i) => {
    const y = S.slideY[i]; if (y === null) return;
    const ny = Math.min(306, y + 300 * dt); ac.globalCompositeOperation = 'destination-out'; ac.fillStyle = '#000'; ac.fillRect(p.x0 - 1, y - 1, p.w + 2, ny - y + 3); ac.globalCompositeOperation = 'source-over';
    if (Math.random() < 0.8) puff(p.x0 + Math.random() * p.w, ny, 1); S.slideY[i] = ny >= 306 ? null : ny;
  });
  for (let k = 0; k < 4; k++) if (S.cDone[k]) S.cRev[k] = Math.min(1, S.cRev[k] + dt * 0.8);
  if (S.todTarget !== null) {
    S.tod += (S.todTarget - S.tod) * Math.min(1, dt * 3); S.todTween = true;
    if (Math.abs(S.todTarget - S.tod) < 0.002) { S.tod = S.todTarget; S.todTarget = null; S.todTween = false; }
    const el = $('tod'); if (el) el.value = Math.round(S.tod * 1000);
  }
  if (lab.view === 'day') { const ph = phaseOf(S.tod); if (ph !== S.lastPh && S.dayAsk.ans !== null) { S.lastPh = ph; info(); } }
  if (S.sec === 'eruption' && lab.view === 'dig' && S.E < 1) {
    S.E = Math.min(1, S.E + dt / 26); const ph = S.E < 0.22 ? 0 : S.E < 0.45 ? 1 : S.E < 0.78 ? 2 : S.E < 0.9 ? 3 : 4;
    if (ph !== S.ephase) { S.ephase = ph; info(); } if (Math.floor(S.E * 50) !== S.eTick) { S.eTick = Math.floor(S.E * 50); info(true); }
  }
  if (S.mos) S.mos.tiles.forEach((t) => {
    const dragging = S.mos.drag && S.mos.drag.t === t, inGrid = t.cx > GX - 10 && t.cx < GX + 3 * TS + 10 && t.cy > GY - 10 && t.cy < GY + 3 * TS + 10;
    t.sc += ((t.placed || dragging || inGrid ? 1 : 0.75) - t.sc) * Math.min(1, dt * 14);
    if (t.placed) { t.cx += (t.tx - t.cx) * Math.min(1, dt * 18); t.cy += (t.ty - t.cy) * Math.min(1, dt * 18); }
    t.pop = Math.max(0, t.pop - dt * 3);
  });
}
canvasLoop($('cv'), (c, w, h, dt, tm) => {
  const s = Math.min(w / W, h / H); L = { s, ox: (w - W * s) / 2, oy: (h - H * s) / 2, w, h };
  step(dt); c.fillStyle = '#0d1020'; c.fillRect(0, 0, w, h);
  const v = lab.view;
  if (v === 'clues') return drawClues(c, tm);
  c.save(); c.translate(L.ox, L.oy); c.scale(s, s); rr(c, 0, 0, W, H, 16); c.clip();
  if (v === 'dig' && S.sec === 'eruption') drawEruption(c, S.E, tm); else if (v === 'dig' && S.sec === 'mosaic' && S.mos) drawMosaic(c, tm);
  else if (v === 'dig') drawDig(c, tm); else drawDay(c, tm);
  c.restore();
});

// --- pointer ---------------------------------------------------------------------------------------------------------
const cv = $('cv'); let drag = null;
const toDesign = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - L.ox) / L.s, (ev.clientY - r.top - L.oy) / L.s]; };
function brush(x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(d / 5));
  for (let i = 1; i <= n; i++) { const x = lerp(x0, x1, i / n), y = lerp(y0, y1, i / n); erase(x, y, 19); if (i % 3 === 0 && y > 100) puff(x, y, 1); }
}
function checkCover() {
  if (S.ask || lab.view !== 'dig' || S.sec) return;
  for (let i = 0; i < 5; i++) if (!S.found[i] && cover(i) >= 0.4) { S.ask = { i, ans: null }; drag = null; if (S.ptr) S.ptr.down = false; sfx.tick(); render(); return; }
}
cv.addEventListener('pointerdown', (ev) => {
  const [x, y] = toDesign(ev), v = lab.view;
  if (v === 'dig' && !S.sec) { if (S.ask) return; drag = { lx: x, ly: y, lc: performance.now() }; S.ptr = { x, y, down: true }; S.hinted = true; cv.setPointerCapture(ev.pointerId); brush(x, y, x, y); sfx.tick(); }
  else if (v === 'dig' && S.sec === 'mosaic') { cv.setPointerCapture(ev.pointerId); mosDown(x, y); }
  else if (v === 'clues' && S.clue === null) { const k = tileAt(x, y); if (k >= 0) openClue(k); }
});
cv.addEventListener('pointermove', (ev) => {
  const [x, y] = toDesign(ev);
  if (drag && !S.ask) { S.ptr = { x, y, down: true }; brush(drag.lx, drag.ly, x, y); drag.lx = x; drag.ly = y; if (performance.now() - drag.lc > 220) { drag.lc = performance.now(); checkCover(); } }
  else if (S.sec === 'mosaic') mosMove(x, y);
});
const up = () => { if (drag) { drag = null; if (S.ptr) S.ptr.down = false; checkCover(); } if (S.mos) mosUp(); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

// --- controls and the ask card -----------------------------------------------------------------------------------------
const askEl = Object.assign(document.createElement('div'), { className: 'pm-ask' });
$('overlay').append(askEl);
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function openClue(k) { S.clue = k; sfx.click(); render(); }
function optsHtml(list, ans, ok, mode) {
  return `<div class="${mode === 'row' ? 'pm-row' : 'pm-list'}">${list.map((o, j) => {
    const cls = ans === null ? '' : j === ok ? 'ok' : j === ans ? 'bad' : '';
    return `<button class="pm-o ${cls}" data-o="${j}"${ans === null ? '' : ' disabled'}>${Array.isArray(o) ? `<span class="e">${o[0]}</span><span>${esc(o[1])}</span>` : esc(o)}</button>`;
  }).join('')}</div>`;
}
const verdictHtml = (t, good, text, btn) => `<div class="pm-v" style="color:${good ? 'var(--ok)' : 'var(--wip)'}">${esc(good ? t.right : t.bad)}</div><p class="pm-t">${esc(text)}</p><button class="pm-go" data-go>${esc(btn)}</button>`;
function askHtml(t) {
  const v = lab.view;
  if (v === 'dig' && !S.sec && S.ask) {
    const a = S.ask, p = t.pl[a.i], ok = PLX[a.i].ok;
    return `<div class="q">${esc(t.askQ)}</div>${optsHtml(p.o.map((l, j) => [PLX[a.i].oe[j], l]), a.ans, ok, 'row')}${a.ans === null ? '' : verdictHtml(t, a.ans === ok, `${t.sign} ${p.n}`, t.go)}`;
  }
  if (v === 'day' && S.dayAsk.ans !== null && S.dayAsk.closed) return '';
  if (v === 'day') { const a = S.dayAsk.ans; return `<div class="q">${esc(t.dayQ)}</div>${optsHtml(t.dayO.map((l, j) => [DAYE[j], l]), a, DAYOK, 'row')}${a === null ? '' : verdictHtml(t, a === DAYOK, t.dayA, t.go)}`; }
  if (v === 'clues' && S.clue !== null) {
    const k = S.clue, a = S.cAns[k];
    return `<div class="q">${esc(t.clueQ)}</div><div class="sub">${CLI[k]} ${esc(t.clueName[k])}</div>${optsHtml(t.clueO[k], a, CLOK[k], 'list')}${a === null ? '' : verdictHtml(t, a === CLOK[k], t.clueE[k], t.back)}`;
  }

}
function ctrlHtml(t) {
  const v = lab.view, open = secret.unlocked();
  if (v === 'dig') {
    if (S.sec === 'eruption') return `<div class="row2"><button class="chip" data-act="replay">${esc(t.replay)}</button><button class="chip" data-act="close">${esc(t.close)}</button></div>`;
    if (S.sec === 'mosaic') return `<div class="row2"><button class="chip" data-act="shuffle">${esc(t.shuffle)}</button><button class="chip" data-act="close">${esc(t.close)}</button></div>`;
    const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    return `<div class="row2"><button class="chip" data-act="reset">${esc(t.reset)}</button></div><div class="row2"><span class="lbl">${esc(t.secLbl)}</span><div class="chips">${sc('eruption', '🌋')}${sc('mosaic', '🐕')}</div></div>`;
  }
  if (v === 'day') {
    return `<input type="range" class="big pm-sl" id="tod" min="0" max="1000" step="1" value="${Math.round(S.tod * 1000)}"${S.dayAsk.ans === null ? ' disabled' : ''} aria-label="${esc(t.dayT)}"
      style="--track:linear-gradient(90deg,#f6b58a,#7fc4f4 25%,#f2e3a8 65%,#f0a070 88%,#3b4a8f)"><div class="ends"><span>${esc(t.ends[0])}</span><span>${esc(t.ends[1])}</span></div>`;
  }
  return `<div class="pm-grid">${CLI.map((e, k) => `<button class="chip ${S.cDone[k] ? 'done' : ''}" data-act="clue" data-k="${k}">${S.cDone[k] ? '✓' : e} ${esc(t.clueName[k])}</button>`).join('')}</div>`;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = b.dataset.k; sfx.click();
    if (S.sec === 'eruption') { S.E = 0; S.ephase = -1; S.eTick = -1; } else mosInit();
    render(); showStage();
  } else if (act === 'close') { S.sec = null; S.mos = null; sfx.click(); render(); }
  else if (act === 'replay') { S.E = 0; S.ephase = -1; sfx.click(); info(); }
  else if (act === 'shuffle') { mosInit(); sfx.click(); info(); }
  else if (act === 'reset') {
    S.found = [false, false, false, false, false]; S.slideY = [null, null, null, null, null]; S.last = -1; S.ask = null; S.hinted = false; puffs.length = 0; paintAsh(); sfx.click(); render();
  } else if (act === 'clue') { openClue(+b.dataset.k); showStage(); }
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'tod') return;
  S.tod = +ev.target.value / 1000; S.todTarget = null; S.todTween = false; const ph = phaseOf(S.tod); if (ph !== S.lastPh) { S.lastPh = ph; sfx.tick(); } info();
});
askEl.addEventListener('click', (ev) => {
  const o = ev.target.closest('[data-o]'), g = ev.target.closest('[data-go]'), v = lab.view;
  if (o) {
    const j = +o.dataset.o;
    if (v === 'dig' && S.ask && S.ask.ans === null) {
      const i = S.ask.i; S.ask.ans = j; S.found[i] = true; S.slideY[i] = 98; S.last = i; (j === PLX[i].ok ? sfx.good : sfx.bad)(); render(); showStage();
    } else if (v === 'day' && S.dayAsk.ans === null) { S.dayAsk.ans = j; S.todTarget = 0.75; S.lastPh = -1; (j === DAYOK ? sfx.good : sfx.bad)(); render(); showStage(); }
    else if (v === 'clues' && S.clue !== null && S.cAns[S.clue] === null) { const k = S.clue; S.cAns[k] = j; S.cDone[k] = true; (j === CLOK[k] ? sfx.good : sfx.bad)(); render(); showStage(); }
  } else if (g) {
    sfx.click();
    if (v === 'dig') { S.ask = null; render(); checkCover(); } else if (v === 'day') { S.dayAsk.closed = true; render(); } else { S.clue = null; render(); }
  }
});

// --- readout, state card, facts ----------------------------------------------------------------------------------------
function info(light) {
  const t = T[lang], v = lab.view;
  if (v === 'dig' && S.sec === 'eruption') {
    const m = pumiceM(S.E), e = t.er[S.ephase < 0 ? 0 : S.ephase];
    lab.setReadout(`${m.toFixed(1).replace('.', t.dec)} m`, t.erSub, '', '#c8643c');
    if (!light) { lab.setState({ emo: e[0], title: e[1], lead: e[2], body: '' }); lab.setFacts(t.facts.dig); }
    return;
  }
  if (light) return;
  if (v === 'dig' && S.sec === 'mosaic') {
    const n = S.mos ? S.mos.tiles.filter((q) => q.placed).length : 0, win = S.mos && S.mos.win;
    lab.setReadout(`${n}/9`, t.mo.sub, win ? '🐕' : '', '#c8643c'); lab.setState({ emo: '🐕', title: win ? t.mo.wt : t.mo.t, lead: win ? t.mo.wl : t.mo.l, body: '' }); lab.setFacts(t.facts.dig); return;
  }
  if (v === 'dig') {
    const n = S.found.filter(Boolean).length, open = S.ask && S.ask.ans === null; let st;
    lab.setReadout(`${n}/5`, t.found, n === 5 ? t.allFound : '', '#d9824a');
    if (open) st = { emo: '🤔', title: t.askQ, lead: t.askLead, body: '' };
    else if (S.last >= 0) st = { emo: PLX[S.last].e, title: cap(t.pl[S.last].n), lead: t.pl[S.last].d, body: n === 5 ? t.allLead : '' };
    else st = { emo: '🖌️', title: t.digT, lead: t.digL, body: '' };
    lab.setState(st); lab.setFacts(open ? [] : t.facts.dig); return;
  }
  if (v === 'day') {
    if (S.dayAsk.ans === null) { lab.setReadout('?', '', '', '#f0b060'); lab.setState({ emo: '🤔', title: t.dayT, lead: t.dayL, body: '' }); }
    else { const p = t.ph[phaseOf(S.tod)]; lab.setReadout(esc(p.v), '', '', '#f0b060'); lab.setState({ emo: p.emo, title: p.title, lead: p.lead, body: '' }); }
    lab.setFacts(t.facts.day); return;
  }
  const n = S.cDone.filter(Boolean).length, k = S.clue;
  lab.setReadout(`${n}/4`, t.read, n === 4 ? t.allRead : '', '#c8a060');
  if (k === null) lab.setState({ emo: '🔍', title: t.clueT, lead: t.clueL, body: '' });
  else if (S.cAns[k] === null) lab.setState({ emo: CLI[k], title: t.clueName[k], lead: t.clueOpen, body: '' });
  else lab.setState({ emo: CLI[k], title: t.clueName[k], lead: t.clueE[k], body: '' });
  lab.setFacts(t.facts.clues);
}
function render() {
  const t = T[lang], html = askHtml(t);
  lab.setGlow('rgba(214,120,60,.28)');
  $('ctrlBody').innerHTML = ctrlHtml(t);
  askEl.innerHTML = html; askEl.style.display = html ? '' : 'none';
  info();
}
paintRoad(); paintAsh(); paintMosaic(); render();
</script>
