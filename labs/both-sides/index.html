  const [x, op, y] = arr, txt = arr.join(' ');
  if (!op) return { txt, val: x, cols: Array(x).fill(COL.gold), fly: 0 };

      const visited = n >= d.s && n <= reach, px = X(n);
      const pg = ctx.createRadialGradient(px - 2, y - 1, 1, px, y + 2, 9); pg.addColorStop(0, visited ? '#b4ffbf' : '#7fdc96'); pg.addColorStop(1, visited ? '#37b564' : '#2c9a5a');
      ctx.fillStyle = pg; ctx.beginPath(); ctx.ellipse(px, y + 3, 7.3, 4.4, 0, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#1e7040'; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.save(); ctx.font = FONT(700, 12); ctx.fillStyle = 'rgba(215,232,255,.85)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const sumDone = L && t >= L.end;
    for (const n of [0, 5, 10, 15, 20]) { if (Math.abs(n - d.s) <= 1 || (sumDone && Math.abs(n - sum) <= 1)) continue; ctx.fillText(String(n), X(n), y + 28); }
    ctx.restore();
    pill(ctx, w, String(d.s), X(d.s), y + 28, { px: 12, bg: 'rgba(245,200,76,.95)', color: '#2a1d00' });
    const fin = L && t >= L.end;
    pill(ctx, w, T[lang].t3.lane(d.s, d.n), w / 2, y - 70, {});
    if (fin) {
      pill(ctx, w, String(sum), X(sum), y + 28, { px: 12, bg: 'rgba(61,220,151,.95)', color: '#032414' });
      ctx.save(); ctx.strokeStyle = '#6af5b4'; ctx.lineWidth = 2; ctx.shadowColor = '#3ddc97'; ctx.shadowBlur = 8; ctx.beginPath(); ctx.ellipse(X(sum), y + 3, 10, 6.2, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      pill(ctx, w, T[lang].t3.hops(d.n), w - 52, y - 70, { stroke: '#4fe3a0' });
    }
    // the frog
    let fx = X(d.s), fy = y + 3, sx = 1, sy = 1, count = 0;
    if (L && t >= L.start) {
      if (fp >= d.n) { fx = X(d.s + d.n); count = d.n; }
      else {
        const i = Math.floor(fp), f = fp - i; fx = lerp(X(d.s + i), X(d.s + i + 1), ease.io(f)); fy = y + 3 - Math.sin(Math.PI * f) * 17;
        if (f < 0.15) sy = 0.86 + f * 0.9; else if (f > 0.88) sy = 0.9 + (1 - f) * 0.5; else { sy = 1.08; sx = 0.94; }
        count = i + (f > 0.5 ? 1 : 0);
      }
    }
    shadow(ctx, fx, y + 5, 9, 0.4);
    frog(ctx, fx, fy + 1, sx, sy);
    if (count > 0) pill(ctx, w, String(count), fx, fy - 30, { px: 13, bg: 'rgba(245,200,76,.95)', color: '#2a1d00' });
  });
}

// --- secret 1: take away won't turn ---------------------------------------------------------------------------
function subTimes() { const st = S.sub, k = st.step === 0 ? 3 : 5, n = st.step === 0 ? 5 : 3, m = Math.min(n, k); return { n, k, m, end: st.at + 0.3 + (m - 1) * 0.6 + 0.75 + 0.35 }; }
function drawSub(ctx, w, h, dt, t) {
  const st = S.sub, { n, k, m } = subTimes(), yb = h * 0.82, u = clamp(Math.min(w * 0.13, (yb - h * 0.16) / 6), 12, 56), xT = w * 0.27, xR = w * 0.74;
  room(ctx, w, h);
  ctx.save(); const pg = ctx.createLinearGradient(0, yb, 0, yb + 9); pg.addColorStop(0, '#e6c48e'); pg.addColorStop(1, '#a87b45'); ctx.fillStyle = pg; rr(ctx, xR - u * 1.1, yb, u * 2.2, 9, 4); ctx.fill(); ctx.restore();
  shadow(ctx, xT, yb + 3, u * 0.75, 0.5);
  const flyP = (j) => (st.at < 0 ? 0 : c01((t - (st.at + 0.3 + j * 0.6)) / 0.75));
  const items = [];
  for (let i = 0; i < n; i++) { const j = n - 1 - i, mine = j < m; items.push({ c: mine ? COL.red : COL.gold, age: t - st.b - i * 0.06, hide: mine && flyP(j) > 0 }); }
  stack(ctx, xT, yb, u, items);
  for (let j = 0; j < k; j++) {
    const sx = xR, sy = yb - j * u;
    if (j < m) {
      const p = flyP(j);
      if (p >= 1) { const age = DROP + (t - (st.at + 0.3 + j * 0.6 + 0.75)); const q = age < DROP + SQ ? Math.sin((age - DROP) / SQ * Math.PI) : 0; cube(ctx, sx, sy, u, COL.red, { sy: 1 - q * 0.13, sx: 1 + q * 0.07 }); }
      else if (p > 0) {
        const e = ease.io(p), fromY = yb - (n - 1 - j) * u;
        cube(ctx, lerp(xT, sx, e), lerp(fromY, sy, e) - Math.sin(Math.PI * p) * u * 2.6, u, COL.red, { stud: false });
      } else ghost(ctx, sx, sy, u, 1, '');
    } else ghost(ctx, sx, sy, u, 1, st.fin ? '?' : '');
  }
  sign(ctx, w / 2, h * 0.58, w * 0.12, '−', 'n');
  pill(ctx, w, T[lang].sb.tray(k), xR, Math.max(16, yb - k * u - 18), {});
}

// --- secret 2: three towers -----------------------------------------------------------------------------------
function drawThree(ctx, w, h, dt, t) {
  const yb = h * 0.82, TOT = 17, u = clamp(Math.min(w * 0.07, (yb - h * 0.14) / TOT), 8, 40), cw = 1.5, cwid = u * cw;
  const xs = [w * 0.1, w * 0.25, w * 0.4], xS = w * 0.78;
  room(ctx, w, h);
  for (let g = 0; g < 3; g++) S.pos[g] += (S.order.indexOf(g) - S.pos[g]) * (1 - Math.exp(-dt * 9));
  const off = GROUPS.map((G, g) => GROUPS.reduce((s, H, k) => (k === g ? s : s + H.n * c01(S.pos[g] - S.pos[k] + 0.5)), 0));
  const topG = S.order[2], topY = yb - TOT * u;
  GROUPS.forEach((G, g) => {
    const x = xs[0] + S.pos[g] * (xs[1] - xs[0]), age = t - S.b4 - g * 0.15;
    shadow(ctx, x, yb + 3, cwid * 0.75, 0.45);
    const items = []; for (let i = 0; i < G.n; i++) items.push({ c: G.c, age: age - i * 0.04 }); stack(ctx, x, yb, u, items, { cw });
    badge(ctx, x, yb + (h - yb) * 0.5, String(G.n), G.c);
  });
  shadow(ctx, xS, yb + 3, cwid * 0.75, 0.5);
  GROUPS.forEach((G, g) => { for (let i = 0; i < G.n; i++) cube(ctx, xS, yb - (off[g] + i) * u, u, G.c, { cw, stud: g === topG && i === G.n - 1 }); });
  GROUPS.forEach((G, g) => badge(ctx, xS + cwid / 2 + 16, yb - (off[g] + G.n / 2) * u, String(G.n), G.c));
  const p2 = S.order.indexOf(0), p8 = S.order.indexOf(2);
  if (Math.abs(p2 - p8) === 1) {
    const y0 = yb - Math.max(off[0] + GROUPS[0].n, off[2] + GROUPS[2].n) * u, y1 = yb - Math.min(off[0], off[2]) * u, bx = xS - cwid / 2 - 10;
    ctx.save(); ctx.strokeStyle = '#6af5b4'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.shadowColor = '#3ddc97'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.moveTo(bx, y0 + 3); ctx.lineTo(bx, y1 - 3); ctx.stroke(); ctx.restore();
    pill(ctx, w, '10', bx - 22, (y0 + y1) / 2, { stroke: '#4fe3a0' });
  }
  level(ctx, xs[0] - cwid, xS + cwid, topY, 'g');
  sign(ctx, w * 0.59, h * 0.62, w * 0.1, '=', 'g');
  pill(ctx, w, `17 ${T[lang].th.total}`, (xs[0] + xS) / 2, Math.max(16, topY - 17), { stroke: '#4fe3a0' });
}

// --- loop ---------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  const v = S.sec || lab.view;
  if (v === 'turn') { if (S.revealAt >= 0 && !S.fin1 && t >= S.revealAt + FLIGHT + 0.5) { S.fin1 = true; (S.g1 === 'same' ? sfx.good : sfx.bad)(); render(); } drawTurn(ctx, w, h, dt, t); }
  else if (v === 'truth') { if (S.sch && !S.fin2 && t >= S.sch.end) { S.fin2 = true; ((S.tg === (S.sch.sl.val === S.sch.sr.val)) ? sfx.good : sfx.bad)(); render(); } drawTruth(ctx, w, h, dt, t); }
  else if (v === 'hop') { if (S.hAt >= 0 && !S.fin3 && t >= lanes().end) { S.fin3 = true; (S.g3 === 'big' ? sfx.good : sfx.bad)(); render(); } drawHop(ctx, w, h, dt, t); }
  else if (v === 'sub') { if (S.sub.at >= 0 && !S.sub.fin && t >= subTimes().end) { S.sub.fin = true; sfx.snap(); render(); } drawSub(ctx, w, h, dt, t); }
  else drawThree(ctx, w, h, dt, t);
});

// --- controls -------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'step') {
    const k = b.dataset.k, n = clamp(S[k] + +b.dataset.s, 1, 9); if (n === S[k]) return;
    S[k] = n; resetV1(); sfx.tick();
  } else if (act === 'g1') { if (S.revealAt < 0) { S.g1 = b.dataset.g; sfx.click(); } }
  else if (act === 'turn') { if (S.g1 && S.revealAt < 0) { S.revealAt = now(); S.fin1 = false; sfx.push(); showStage(); } }
  else if (act === 'again1') { resetV1(); sfx.click(); }
  else if (act === 'g2') { if (S.tAt < 0) { S.tg = b.dataset.g === '1'; S.tAt = now(); S.sch = schedule(CARDS[S.ti], S.tAt); S.fin2 = false; sfx.click(); showStage(); } }
  else if (act === 'next2') { S.ti = (S.ti + 1) % CARDS.length; resetV2(); sfx.click(); }
  else if (act === 'g3') { if (S.hAt < 0) { S.g3 = b.dataset.g; sfx.click(); } }
  else if (act === 'hop') { if (S.g3 && S.hAt < 0) { S.hAt = now(); S.fin3 = false; sfx.push(); showStage(); } }
  else if (act === 'next3') { S.hi = (S.hi + 1) % PAIRS.length; resetV3(); sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click();
    if (S.sec === 'sub') S.sub = { step: 0, at: -1, fin: false, b: now() };
    if (S.sec === 'three') { S.order = [0, 1, 2]; S.pos = [0, 1, 2]; S.sel = -1; S.b4 = now(); }
  } else if (act === 'sbgo') {
    const st = S.sub;
    if (st.at < 0) { st.at = now(); st.fin = false; sfx.push(); showStage(); }
    else if (st.step === 0) S.sub = { step: 1, at: -1, fin: false, b: now() };
    else S.sub = { step: 0, at: -1, fin: false, b: now() };
  } else if (act === 'ord') {
    const p = +b.dataset.p;
    if (S.sel < 0) S.sel = p; else if (S.sel === p) S.sel = -1; else { [S.order[S.sel], S.order[p]] = [S.order[p], S.order[S.sel]]; S.sel = -1; sfx.snap(); }
  }
  render();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
const opt = (act, g, text, { on, good, bad, dis }) => `<button class="bs-opt ${good ? 'good' : bad ? 'bad' : on ? 'on' : ''}" data-act="${act}" data-g="${g}"${dis ? ' disabled' : ''}>${esc(text)}</button>`;
function render() {
  const t = T[lang], v = S.sec || lab.view, map = { turn: 'bsV1', truth: 'bsV2', hop: 'bsV3', sub: 'bsSub', three: 'bsThree' };
  for (const id of Object.values(map)) $(id).style.display = id === map[v] ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('bsSecs').innerHTML = sc('sub', '🔄') + sc('three', '🧱');
  lab.setGlow('rgba(242, 182, 50, .22)');
  ({ turn: renderTurn, truth: renderTruth, hop: renderHop, sub: renderSub, three: renderThree })[v](t);
}
function renderTurn(t) {
  const { a, b } = S, q = t.t1, asked = S.revealAt >= 0, fin = S.fin1;
  const stp = (k, name, col) => `<div class="bs-stp"><span class="bs-lbl"><i style="background:${col[1]}"></i>${esc(name)}</span><span class="bs-v">
    <button class="bs-sb" data-act="step" data-k="${k}" data-s="-1" aria-label="−"${S[k] <= 1 || (asked && !fin) ? ' disabled' : ''}>−</button><b>${S[k]}</b>
    <button class="bs-sb" data-act="step" data-k="${k}" data-s="1" aria-label="+"${S[k] >= 9 || (asked && !fin) ? ' disabled' : ''}>+</button></span></div>`;
  const g = S.g1, lockd = asked;
  $('bsV1').innerHTML = `<div class="bs-steps">${stp('a', t.red, COL.red)}${stp('b', t.blue, COL.blue)}</div>
    <p class="bs-q">${esc(q.q)}</p>
    <div class="bs-opts">${['taller', 'shorter', 'same'].map((k) => opt('g1', k, q.opts[k], { on: g === k && !fin, good: fin && k === 'same', bad: fin && g === k && k !== 'same', dis: lockd })).join('')}</div>
    <div class="row2">${asked ? `<button class="btn" data-act="again1"${fin ? '' : ' disabled'}>${esc(q.again)}</button>` : `<button class="btn" data-act="turn"${g ? '' : ' disabled'}>${esc(q.go)}</button>`}</div>`;
  if (fin) {
    lab.setReadout(`${a} + ${b} = ${b} + ${a}`, q.sub(a + b), '', '#f2b632');
    lab.setState({ emo: g === 'same' ? '🟰' : '🤔', title: g === 'same' ? t.right : t.notq, lead: q.lead(a, b), body: q.body(a, b), extra: '' });
  } else {
    lab.setReadout(`${a} + ${b}`, '', '', '#f2b632');
    const [ti, le] = q.pre(a, b); lab.setState({ emo: '🧱', title: ti, lead: le, body: '', extra: '' });
  }
  lab.setFacts([t.facts.plus, t.facts.wid]);
}
function renderTruth(t) {
  const q = t.t2, card = CARDS[S.ti], sl = sideOf(card.L), sr = sideOf(card.R), eqv = sl.val === sr.val, asked = S.tAt >= 0, fin = S.fin2;
  $('bsV2').innerHTML = `<p class="bs-q">${esc(q.q)}</p>
    <div class="bs-opts">${[[true, q.t], [false, q.f]].map(([k, txt]) => `<button class="bs-opt bs-tf ${fin && k === eqv ? 'good' : fin && S.tg === k ? 'bad' : S.tg === k ? 'on' : ''}" data-act="g2" data-g="${k ? 1 : 0}"${asked ? ' disabled' : ''}>${esc(txt)}</button>`).join('')}</div>
    <div class="row2"><button class="btn" data-act="next2"${fin ? '' : ' disabled'}>${esc(q.next)} →</button></div>`;
  if (fin) {
    lab.setReadout(`${sl.val} and ${sr.val}`.replace('and', { en: 'and', ru: 'и', hu: 'és' }[lang]), eqv ? q.same : q.notSame, '', '#f2b632');
    lab.setState({ emo: S.tg === eqv ? '✅' : '🤔', title: S.tg === eqv ? t.right : t.notq, lead: eqv ? q.yes(sl.val) : q.no(sl.val, sr.val), body: card.n ? q.notes[card.n] : '', extra: '' });
  } else {
    lab.setReadout(`${sl.txt} = ${sr.txt}`, '', '', '#f2b632');
    lab.setState({ emo: '⚖️', title: q.pre[0], lead: q.pre[1], body: '', extra: '' });
  }
  lab.setFacts([t.facts.rec1, t.facts.rec2]);
}
function renderHop(t) {
  const q = t.t3, [a, b] = PAIRS[S.hi], asked = S.hAt >= 0, fin = S.fin3, g = S.g3;
  const os = [['small', q.opts.small(a)], ['big', q.opts.big(b)], ['same', q.opts.same]];
  $('bsV3').innerHTML = `<p class="bs-q">${esc(q.q(a, b))}</p>
    <div class="bs-opts">${os.map(([k, txt]) => opt('g3', k, txt, { on: g === k && !fin, good: fin && k === 'big', bad: fin && g === k && k !== 'big', dis: asked })).join('')}</div>
    <div class="row2">${asked ? `<button class="btn" data-act="next3"${fin ? '' : ' disabled'}>${esc(q.next)} →</button>` : `<button class="btn" data-act="hop"${g ? '' : ' disabled'}>${esc(q.go)}</button>`}</div>`;
  if (asked) lab.setReadout(`${q.hops(b)} ${q.vs} ${q.hops(a)}`, fin ? q.both(a + b) : '', '', '#f2b632');
  else lab.setReadout(`${a} + ${b}`, '', '', '#f2b632');
  if (fin) lab.setState({ emo: g === 'big' ? '🐸' : '🤔', title: g === 'big' ? t.right : t.notq, lead: q.lead(a, b, q.hops), body: q.body, extra: '' });
  else lab.setState({ emo: '🐸', title: q.pre[0], lead: q.pre[1], body: '', extra: '' });
  lab.setFacts([t.facts.wid]);
}
function renderSub(t) {
  const q = t.sb, st = S.sub, ran = st.at >= 0, fin = st.fin, k = st.step === 0 ? 3 : 5;
  const label = !ran ? q.go(k) : !fin ? q.go(k) : st.step === 0 ? q.turn : q.again;
  $('bsSub').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn" data-act="sbgo"${ran && !fin ? ' disabled' : ''}>${esc(label)}</button></div>`;
  const pre = st.step === 0 ? q.t0 : q.t1, post = st.step === 0 ? q.d0 : q.d1;
  lab.setReadout(fin ? (st.step === 0 ? '5 − 3 = 2' : '3 − 5 = ?') : pre[0], '', '', '#f2b632');
  lab.setState({ emo: st.step === 0 ? '🔄' : (fin ? '🚫' : '🔄'), title: fin ? post[0] : pre[0], lead: fin ? post[1] : pre[1], body: fin && st.step === 1 ? q.body : '', extra: '' });
  lab.setFacts([t.facts.wid]);
}
function renderThree(t) {
  const q = t.th, nums = S.order.map((g) => GROUPS[g]);
  $('bsThree').innerHTML = `<div class="bs-eq">${S.order.map((g, p) => `${p ? '<span>+</span>' : ''}<button class="bs-num ${S.sel === p ? 'sel' : ''}" data-act="ord" data-p="${p}" style="background:linear-gradient(160deg,${GROUPS[g].c[0]},${GROUPS[g].c[1]})">${GROUPS[g].n}</button>`).join('')}<span>= 17</span></div>
    <p class="bs-hint">${esc(q.hint)}</p>`;
  lab.setReadout(`${nums.map((G) => G.n).join(' + ')} = 17`, '', '', '#f2b632');
  const ten = Math.abs(S.order.indexOf(0) - S.order.indexOf(2)) === 1;
  lab.setState({ emo: '🧱', title: q.title, lead: ten ? q.ten : '', body: '', extra: '' });
  lab.setFacts([t.facts.plus]);
}
render();
</script>
