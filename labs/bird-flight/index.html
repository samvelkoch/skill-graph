const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };

$('cv').addEventListener('click', (ev) => {
  const [x, y] = toDesign(ev), v = lab.view;
  if (v === 'bones') {
    const b = S.b;
    if (b.step === 'cut' && !b.cutGuess) { pickCut(x < 200 ? geo.bones[0].k : geo.bones[1].k); }
    else if (b.step === 'tour') {
      let best = null, bd = 34 / G.s; // 34 screen px

    for (const q of geo.wings) if (x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h) { pickWing(q.kind); break; }
  } else if (v === 'feathers') {
    for (const q of geo.feathers) if (x >= q.x && x <= q.x + q.w && y < 192 && S.f.all) { S.f.sel = q.i; S.f.zoom = 0; sfx.tick(); render(); break; }

// --- actions ----------------------------------------------------------------------------------------------------------
function pickCut(k) { const b = S.b; if (b.cutGuess) return; b.cutGuess = k; b.cutAt = nowS(); (k === 'pigeon' ? sfx.good : sfx.bad)(); render(); setTimeout(showStage, 1100); }

function pickScale(i) { const b = S.b; if (b.scaleGuess !== null) return; b.scaleGuess = i; b.scaleAt = nowS(); (i === 1 ? sfx.good : sfx.bad)(); render(); setTimeout(showStage, 1300); }

  W.choice = kind; W.at = nowS(); W.res[W.i] = kind === W.rounds[W.i]; (W.res[W.i] ? sfx.good : sfx.bad)(); render(); showStage();
}

  F.guess = j; F.res[F.i] = j === JOB[F.i]; F.sel = F.i; F.zoom = 0; (F.res[F.i] ? sfx.good : sfx.bad)(); render(); showStage();

$('ctrlBody').addEventListener('click', (ev) => {

  const a = bt.dataset.act, d = bt.dataset;

  else if (a === 'toscale') { S.b.step = 'scale'; sfx.click(); render(); }

  else if (a === 'frestart') { S.f = newF(); sfx.click(); render(); }

      : { emo: '🔎', title: tb.tourT, lead: tb.tourL, body: '', extra: `<div class="bf-fine">${esc(tb.barNote)}</div>` };
    rd = k ? [esc(tb.vals[hk]), tb.readSub[hk], '', '#5fa8c8'] : [esc(tb.vals.feat), tb.readSub.feat, '', '#5fa8c8'];
    if (!k) rd = ['?', tb.tourT, '', '#5fa8c8'];
    facts = ['only', 'frigate', 'loon', 'dumont'];
  }
  $('secBones').innerHTML = html;
  lab.setReadout(rd[0], rd[1], rd[2], rd[3]); lab.setState(st); lab.setFacts(factsOf(facts, t));
}
function legend(tb, withFeat, hl) {
  const items = [['skel', 'skel'], ['feat', 'feat'], ['mus', 'mus'], ['rest', null]].filter(([k]) => withFeat || k !== 'feat');
  return `<div class="bf-leg">${items.map(([k, vk]) => `<span class="${hl && hl !== k ? 'dim' : ''}"><i style="background:${BAR_COL[k]}"></i>${esc(tb.bar[k])}${vk ? ` <b>${esc(tb.vals[vk])}</b>` : ''}</span>`).join('')}</div>`;
}

function renderWings(t) {
  const W = S.w, tw = t.wings;
  lab.setGlow('rgba(95, 140, 210, .26)');
  let html = '', st, rd, facts = [];
  if (S.sec) {
    const sec = S.sec, tt = t[sec];
    const chips = `<div class="bf-row">${['hum', 'peng'].map((k) => `<button class="bf-opt ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${k === 'hum' ? '🌺' : '🐧'} ${esc(t.secrets[k][0])}</button>`).join('')}</div>`;
    if (sec === 'hum') {
      html = chips + `<div class="bf-row">${tt.speeds.map((s, i) => opt('hspeed', `data-i="${i}"`, s, S.hum === i ? 'on' : '')).join('')}</div>`;
      st = { emo: '🌺', title: tt.title, lead: tt.lead, body: tt.body, extra: '' }; rd = ['52', tt.sub, tt.speeds[S.hum], '#3cc08a']; facts = ['hum'];
    } else {
      html = chips + `<div class="bf-row">${[[0, tt.water], [1, tt.air]].map(([a, l]) => opt('env', `data-air="${a}"`, l, (S.air ? 1 : 0) === a ? 'on' : '')).join('')}</div>`;
      st = { emo: '🐧', title: tt.title, lead: S.air ? tt.leadAir : tt.lead, body: S.air ? '' : tt.body, extra: '' };
      rd = S.air ? ['0', tt.subA, '', '#5fa8c8'] : ['36', tt.subW, '', '#5fa8c8']; facts = ['peng'];
    }
    html += `<div class="bf-row"><button class="bf-go ghost" data-act="sec" data-k="${sec}">${esc(t.hum.back)}</button></div>`;
  } else {
    const over = W.i >= 4, k = S.w.res.filter(Boolean).length, open = secret.unlocked();
    const sc = (key, emo) => `<button class="bf-opt ${open ? '' : ''}" data-act="sec" data-k="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
    if (over) {
      html = `<div class="bf-row"><button class="bf-go" data-act="wrestart">${esc(t.again)}</button></div>`;
      st = { emo: '🏆', title: tw.end(k), lead: tw.endLead, body: '', extra: '' }; rd = [`${k}/4`, '', '', '#6a9ad8']; facts = ['alb', 'albLock', 'swift'];
    } else {
      const round = W.rounds[W.i], ans = W.choice !== null, K = tw.kinds;
      if (ans) html = `<div class="bf-row"><button class="bf-go" data-act="wnext">${esc(tw.next)}</button></div>`;
      else html = `<p class="bf-tip">${esc(tw.tap)}</p>`;
      if (!ans) st = { emo: '🕊️', title: K[round].q, lead: tw.tap, body: '', extra: '' };
      else if (W.choice === round) st = { emo: '✅', title: t.right, lead: `${K[round].name}: ${K[round].why}`, body: '', extra: '' };
      else st = { emo: '🤔', title: t.wrong, lead: `${K[round].name}: ${K[round].why}`, body: `${tw.picked}: ${K[W.choice].name}. ${K[W.choice].why}`, extra: '' };
      rd = [ans ? `${k}/${W.i + 1}` : '?', `${W.i + 1} / 4`, '', '#6a9ad8'];
      facts = ans ? (round === 'alb' ? ['alb', 'albLock'] : round === 'swift' ? ['swift'] : []) : [];
    }
    html += `<div class="bf-row">${sc('hum', '🌺')}${sc('peng', '🐧')}</div>`;
  }
  $('secWings').innerHTML = html;
  lab.setReadout(rd[0], rd[1], rd[2], rd[3]); lab.setState(st); lab.setFacts(factsOf(facts, t));
}

function renderFeathers(t) {
  const F = S.f, tf = t.feathers;
  lab.setGlow('rgba(224, 170, 110, .24)');
  const k = F.res.filter(Boolean).length;
  let html = '', st, rd;
  if (F.all) {
    html = `<div class="bf-row">${tf.zoomNames.map((n, z) => opt('zoom', `data-z="${z}"`, `🔍 ${n}`, F.zoom === z ? 'on' : '')).join('')}</div><div class="bf-row"><button class="bf-go ghost" data-act="frestart">${esc(t.again)}</button></div>`;
    const kind = FEA_KEYS[F.sel], z = F.zoom;
    st = z === 0 ? { emo: '🏆', title: tf.end, lead: tf.endLead, body: tf.res[JOB[F.sel]] }
      : { emo: '🔍', title: tf.names[JOB[F.sel]], lead: (z === 1 ? tf.z1 : tf.z2)[kind === 'down' ? 1 : 0], body: '' };
    st.extra = ''; rd = [`${k}/3`, z ? tf.zoomNames[z] : tf.names[JOB[F.sel]], '', '#e0aa6e'];
  } else {
    const done = F.guess !== null, i = F.i, kind = FEA_KEYS[i], correct = JOB[i];
    html = `<div class="bf-row">${tf.jobs.map((j, n) => opt('fpick', `data-j="${n}"`, j, done ? (n === correct ? 'good' : F.guess === n ? 'bad' : '') : '')).join('')}</div>`;
    if (done) html += `<div class="bf-row">${tf.zoomNames.map((n, z) => opt('zoom', `data-z="${z}"`, `🔍 ${n}`, F.zoom === z ? 'on' : '')).join('')}</div>`
      + `<div class="bf-row"><button class="bf-go" data-act="fnext">${esc(t.next)}</button></div>`;
    if (!done) st = { emo: '🪶', title: tf.q(i + 1), lead: tf.lead0, body: '', extra: '' };
    else if (F.zoom === 0) st = { emo: F.res[i] ? '✅' : '🤔', title: `${F.res[i] ? t.right : t.wrong} ${tf.names[JOB[i]]}`, lead: tf.res[JOB[i]], body: tf.zoomHint, extra: '' };
    else st = { emo: '🔍', title: tf.names[JOB[i]], lead: (F.zoom === 1 ? tf.z1 : tf.z2)[kind === 'down' ? 1 : 0], body: '', extra: '' };
    rd = [done ? `${k}/3` : '?', done ? (F.zoom ? tf.zoomNames[F.zoom] : tf.names[JOB[i]]) : `${i + 1} / 3`, '', '#e0aa6e'];
  }
  $('secFeathers').innerHTML = html;
  lab.setReadout(rd[0], rd[1], rd[2], rd[3]); lab.setState(st); lab.setFacts(factsOf(['dens'], t));
}
render();
</script>
