    for (let i = S.items.length - 1; i >= 0 && hit < 0; i--) { const it = S.items[i], sh = stampShape(it.t, it.sz); if (Math.abs(u - it.x) <= sh.hw + 6 && Math.abs(w - it.y) <= sh.hh + 6) hit = i; }
    if (hit >= 0) { const it = S.items[hit]; S.items.push(S.items.splice(hit, 1)[0]); S.sel = S.items.length - 1; drag = { it, ox: it.x - u, oy: it.y - w }; S.sz = it.sz; S.col = it.col; sfx.tick(); }
    else S.sel = -1;
    render();
  } else if (m === 'draw') {
    const [u, w] = onPaper(ev);
    if (u < 0 || u > 320 || w < 0 || w > 290) return;
    S.live = { k: S.brush, raw: [[u, w]] }; drag = { live: true };
  } else if (m === 'cut') {
    const [px, py] = local(ev), K = cutLayout(cv.clientWidth, cv.clientHeight);
    for (let i = S.cut.length - 1; i >= 0; i--) {
      const it = S.cut[i], x = K.sx + it.fx * K.sw, y = K.sy + it.fy * K.sh;
      if (Math.hypot(px - x, py - y) < K.big * 1.05) { S.cut.push(S.cut.splice(i, 1)[0]); drag = { it, dx: x - px, dy: y - py, sx: px, sy: py, tap: true }; sfx.tick(); return; }
    }
    if (py >= K.ty && px >= K.tx && px <= K.tx + K.tw) {
      const i = clamp(Math.floor((px - K.tx) / (K.tw / 8)), 0, 7), it = { t: CUT_TPL[i][0], col: colOfTpl(i), fx: (px - K.sx) / K.sw, fy: (py - K.sy) / K.sh, rot: (Math.random() - 0.5) * 1.2 };
      S.cut.push(it); drag = { it, dx: 0, dy: 0, sx: px, sy: py, tap: false, spawn: true }; sfx.click();
    }
  }
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const m = mode();
  if (m === 'build' && drag.it) { const [u, w] = onPaper(ev); drag.it.x = clamp(u + drag.ox, 8, 312); drag.it.y = clamp(w + drag.oy, 8, 282); }
  else if (m === 'draw' && drag.live && S.live) {
    const [u, w] = onPaper(ev), last = S.live.raw[S.live.raw.length - 1];
    if (Math.hypot(u - last[0], w - last[1]) > 1.5) S.live.raw.push([clamp(u, 2, 318), clamp(w, 2, 288)]);
  } else if (m === 'cut' && drag.it) {
    const [px, py] = local(ev), K = cutLayout(cv.clientWidth, cv.clientHeight);
    if (Math.hypot(px - drag.sx, py - drag.sy) > 5) { drag.tap = false; drag.moved = true; }
    drag.it.fx = clamp((px + drag.dx - K.sx) / K.sw, 0, 1); drag.it.fy = clamp((py + drag.dy - K.sy) / K.sh, 0, 1);
    drag.it.del = py > K.ty - 4;
  }
});
const endDrag = () => {
  if (!drag) return;
  if (drag.live && S.live) {
    const st = S.live; st.poly = brushPoly(st.k, st.raw); S.strokes.push(st); if (S.strokes.length > 60) S.strokes.shift(); S.live = null;
  }
  if (drag.it && S.sec === 'scissors') {
    if (drag.spawn && !drag.moved) { drag.it.fx = 0.25 + Math.random() * 0.5; drag.it.fy = 0.25 + Math.random() * 0.5; } // a plain tap on the tray puts the piece on the sheet
    else if (drag.it.del) S.cut.splice(S.cut.indexOf(drag.it), 1);
    else if (drag.tap) drag.it.rot += 0.45;
    drag.it.del = false;
  }
  drag = null;
};
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls -----------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const qaOf = (v, i) => { const t = T[lang]; return v === 'shapes' ? [t.s.q[i], t.s.o[i], t.s.why[i]] : v === 'lines' ? [t.l.q[i], t.l.o[i], t.l.why[i]] : [t.k['q' + (i + 1)], t.k['o' + (i + 1)], t.k['r' + (i + 1)]]; };
const iconOf = (v, i, j) => v === 'shapes' ? SHAPE_OPTS[i][j].map(shapeIcon).join('') : v === 'lines' ? lineIcon(LINE_OPTS[i][j]) : LOOK_ICONS[i][j];
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view, q = Q[v];
  if (act === 'pick') {
    if (q.pick !== null) return;
    const j = +b.dataset.j; q.pick = j; q.t0 = nowS(); (j === RIGHT[v][q.i] ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next') { q.i++; q.pick = null; q.born = nowS(); sfx.click(); }
  else if (act === 'again') {
    if (S.sec === 'upside') S.up = { t0: nowS(), doneAt: null, target: 0, fe: 0, manual: false };
    else { Q[v] = mkQ(); if (v === 'look') S.ang = 25; }
    sfx.click();
  } else if (act === 'clear') {
    if (S.sec === 'scissors') S.cut = []; else if (v === 'shapes') { S.items = []; S.sel = -1; } else S.strokes = [];
    sfx.click();
  } else if (act === 'flip') { S.up.target = S.up.target ? 0 : 1; S.up.manual = true; sfx.click(); }
  else if (act === 'stamp') {
    const it = { t: b.dataset.t, x: 160 + (Math.random() - 0.5) * 70, y: 145 + (Math.random() - 0.5) * 60, sz: S.sz, col: S.col };
    S.items.push(it); S.sel = S.items.length - 1; if (S.items.length > 60) S.items.shift(); sfx.snap();
  } else if (act === 'col') { S.col = b.dataset.c; if (S.sel >= 0 && S.items[S.sel]) S.items[S.sel].col = S.col; sfx.tick(); }
  else if (act === 'brush') { S.brush = b.dataset.k; sfx.tick(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'upside') S.up = { t0: nowS(), doneAt: null, target: 0, fe: 0, manual: false }; }
    sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'saSz') { S.sz = +ev.target.value; if (S.sel >= 0 && S.items[S.sel]) S.items[S.sel].sz = S.sz; }
  else if (ev.target.id === 'saAng') { S.ang = +ev.target.value; renderReadout(); }
});

function renderReadout() {
  const t = T[lang], v = lab.view, q = Q[v], free = q.i >= N[v];
  const txt = (s) => { $('val').classList.add('sa-txt'); lab.setReadout(esc(s), '', '', ACC[v]); };
  lab.setGlow(GLOW[v]);
  if (S.sec && v === 'shapes') return txt(t.secrets[S.sec][0]);
  if (!free) { $('val').classList.remove('sa-txt'); return lab.setReadout(`${q.i + 1} / ${N[v]}`, '', '', ACC[v]); }
  txt(v === 'shapes' ? t.s.build : v === 'lines' ? t.l.draw : t.k.angle(S.ang));
}
const ACC = { shapes: '#3DD6C6', lines: '#9B7BFF', look: '#4F86E0' };
const GLOW = { shapes: 'rgba(61, 214, 198, .24)', lines: 'rgba(155, 123, 255, .26)', look: 'rgba(79, 134, 224, .3)' };

function render() {
  const t = T[lang], v = lab.view, q = Q[v], free = q.i >= N[v], sec = v === 'shapes' ? S.sec : null, quiz = !free && !sec;
  const show = (id, on) => { $(id).hidden = !on; };
  show('saQa', quiz); show('saShapes', v === 'shapes' && free && !sec); show('saLines', v === 'lines' && free); show('saLook', v === 'look' && free); show('saChipRow', v === 'shapes');
  show('saFlip', sec === 'upside');
  show('saClr', (v === 'shapes' && free && !sec) || sec === 'scissors' || (v === 'lines' && free));
  show('saAgain', (free && !sec) || sec === 'upside');
  show('saActs', !$('saFlip').hidden || !$('saClr').hidden || !$('saAgain').hidden);
  $('saFlip').textContent = t.sec.flip; $('saClr').textContent = t.s.clear; $('saAgain').textContent = t.again;
  // the question and its three answers
  if (quiz) {
    const [qt, opts, why] = qaOf(v, q.i), right = RIGHT[v][q.i], done = q.pick !== null;
    $('saQ').textContent = qt;
    $('saOpts').innerHTML = opts.map((o, j) => `<button class="sa-opt ${done ? (j === right ? 'good' : j === q.pick ? 'bad' : 'dim') : ''}" data-act="pick" data-j="${j}"${done ? ' disabled' : ''}><span class="sa-ico">${iconOf(v, q.i, j)}</span><span>${esc(o)}</span></button>`).join('');
    $('saRes').innerHTML = done ? `<div class="sa-verdict ${q.pick === right ? 'ok' : 'no'}">${esc(q.pick === right ? t.right : t.wrong)}</div><p>${esc(why)}</p><button class="btn" data-act="next">${esc(t.next)}</button>` : '';
  }
  // build a picture
  if (v === 'shapes' && free && !sec) {
    $('saStamps').innerHTML = STAMPS.map((k) => `<button class="sa-stamp" data-act="stamp" data-t="${k}" aria-label="${esc(t.shp[k === 'tri' ? 'triangle' : k === 'curve' ? 'curve' : k])}">${shapeIcon(k)}</button>`).join('');
    $('saSzL').textContent = t.s.size; const sz = $('saSz'); if (+sz.value !== S.sz) sz.value = S.sz;
    $('saCols').innerHTML = COLS.map((k) => `<button class="sa-sw ${k === S.col ? 'on' : ''}" data-act="col" data-c="${k}" style="background:${k}" aria-label="${k}"></button>`).join('');
  }
  if (v === 'lines' && free) $('saBrushes').innerHTML = ['straight', 'wavy', 'zig', 'spiral'].map((k) => { const [a, b] = LINE_NAME[k], nm = t.l.o[a][b]; return `<button class="chip sa-brush ${S.brush === k ? 'on' : ''}" data-act="brush" data-k="${k}" aria-label="${esc(nm)}" title="${esc(nm)}">${lineIcon(k, S.brush === k ? INK : BRUSH_COL[k], 56, 22)}</button>`; }).join('');
  if (v === 'look' && free) { $('saSide').textContent = t.k.side; $('saAbove').textContent = t.k.above; const sl = $('saAng'); if (+sl.value !== S.ang) sl.value = S.ang; }
  // secret chips (view 1 only)
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('scissors', '✂️') + sc('upside', '🙃');
  renderReadout();
  // the state card: neutral until the view's last round has been answered
  let st;
  if (sec) st = { emo: sec === 'scissors' ? '✂️' : '🙃', title: t.secrets[sec][0], lead: t.secrets[sec][1], body: sec === 'scissors' ? t.sec.scissorsText : t.sec.upsideText };
  else { const complete = free || (q.i === N[v] - 1 && q.pick !== null), [emo, title, lead, body] = t.st[v][complete ? 'f' : 'n']; st = { emo, title, lead, body }; }
  lab.setState({ ...st, extra: '' });
}
render();
</script>
