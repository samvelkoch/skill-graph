  c.fillStyle = '#e8b78e'; c.beginPath(); c.ellipse(0, r * .86, r * .3, r * .2, 0, 0, Math.PI); c.fill(); // neck

    inBin[bi].forEach((j, n) => {
      const [tx, ty] = slot(bi, n), u = j === P.i && shown ? c01((time - P.flyT) / .55) : 1;
      if (u <= 0) return;
      const fx = lerp(cx, tx, eio(u)), fy = lerp(cTop + 52, ty, eio(u)) - Math.sin(Math.PI * u) * 24, sz = lerp(34, 20, eio(u));
      c.fillStyle = PAPER; c.strokeStyle = P.picks[j] === MODEL[ORDER[j]] ? '#b4bde0' : BAD; c.lineWidth = P.picks[j] === MODEL[ORDER[j]] ? 1 : 2;
      c.beginPath(); c.roundRect(fx - sz / 2, fy - sz / 2, sz, sz, 6); c.fill(); c.stroke();
      emoji(c, ICON[ORDER[j]], fx, fy, sz * .66);
    });
  });
  GEO = { bins: BOXES.map((b, bi) => [BINX[bi], BINY, BINW, BINH, b]) };
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  backdrop(c, w, h);
  const v = lab.view;
  K = Math.min(w / DW, h / DH); OX = (w - DW * K) / 2; OY = (h - DH * K) / 2;
  GEO = null;
  if (v === 'settings') return;
  c.save(); c.translate(OX, OY); c.scale(K, K); c.lineJoin = 'round'; c.lineCap = 'round';
  if (v === 'day') drawDay(c, time, dt); else drawPro(c, time);
  c.restore();
});

// --- actions -------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function tapMoment(i) {
  const D = S.day; if (D.ans === null || D.tapT[i] >= 0) return;
  D.tapT[i] = now(); D.last = i; D.lastT = now(); sfx.click();
  if (D.tapT.every((x) => x >= 0)) { D.revealAt = now() + 1.35; setTimeout(() => sfx.good(), 1350); }
  render(); showStage();
}
function pick(box) {
  const P = S.pro; if (lab.view !== 'profile' || P.phase !== 'pick' || P.i >= 12) return;
  P.picks[P.i] = box; P.phase = 'shown'; P.flyT = now();
  (box === MODEL[ORDER[P.i]] ? sfx.good : sfx.bad)();
  render(); showStage();
}
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - OX) / K, y = (ev.clientY - r.top - OY) / K;
  if (lab.view === 'day') { for (let i = 0; i < 6; i++) if (Math.hypot(x - NODEX[i], y - NODEY) <= 28) { tapMoment(i); break; } }
  else if (lab.view === 'profile' && GEO) { for (const [bx, by, bw, bh, b] of GEO.bins) if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) { pick(b); break; } }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'dans') { if (S.day.ans !== null) return; S.day.ans = +b.dataset.j; (S.day.ans === 1 ? sfx.good : sfx.bad)(); render(); }
  else if (act === 'nextm') {
    if (S.day.tapT.every((x) => x >= 0)) { const keep = S.day.ans; S.day = newDay(); S.day.ans = keep; sfx.click(); render(); }
    else tapMoment(S.day.tapT.findIndex((x) => x < 0));
  }
  else if (act === 'pbox') pick(b.dataset.b);
  else if (act === 'pnext') {
    const P = S.pro;
    if (P.i >= 12) { S.pro = newPro(); S.pro.swapT = now(); sfx.click(); }
    else if (P.phase === 'shown') { P.i++; P.phase = 'pick'; P.swapT = now(); sfx.click(); }
    render();
  }
  else if (act === 'sans') { if (S.set.ans !== null) return; S.set.ans = +b.dataset.j; (S.set.ans === 0 ? sfx.good : sfx.bad)(); render(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click();
    if (S.sec === 'a') S.a = { flip: false, removed: false };
    if (S.sec === 'b') S.b = [false, false, false, false];
    render();
  }
});
$('overlay').addEventListener('click', (ev) => {
  const row = ev.target.closest('.dt-row');
  if (row) {
    const k = row.dataset.tk; if (S.set.ans === null) return;
    S.set.on[k] = !S.set.on[k]; S.set.last = k; sfx.tick(); render(); return;
  }
  if (ev.target.closest('[data-x]')) { S.sec = null; sfx.tick(); render(); return; }
  if (ev.target.closest('#dtFlip')) { S.a.flip = !S.a.flip; sfx.click(); render(); return; }
  if (ev.target.closest('#dtRemLoc')) { if (S.a.removed) return; S.a.flip = true; S.a.removed = true; sfx.snap(); render(); return; }
  const ck = ev.target.closest('[data-ck]');
  if (ck) { const i = +ck.dataset.ck; S.b[i] = !S.b[i]; (S.b[i] ? sfx.good : sfx.tick)(); render(); }
});

// --- one render per change: controls, readout, state card and facts ------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('dtSecDay').style.display = v === 'day' ? '' : 'none';
  $('dtSecPro').style.display = v === 'profile' ? '' : 'none';
  $('dtSecSet').style.display = v === 'settings' ? '' : 'none';
  $('dtSet').style.display = v === 'settings' ? 'block' : 'none';
  if (setLang !== lang) buildSet(t);
  if (S.secLang !== lang) buildSecrets(t);
  const open = secret.unlocked();
  $('dtSecrets').innerHTML = [['a', '📍'], ['b', '🧑‍🤝‍🧑']].map(([k, e]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('dtSpA').style.display = S.sec === 'a' ? 'flex' : 'none';
  $('dtSpB').style.display = S.sec === 'b' ? 'flex' : 'none';
  $('dtFlip').classList.toggle('on', S.a.flip);
  $('dtLoc').classList.toggle('gone', S.a.removed);
  $('dtRemLoc').disabled = S.a.removed;
  document.querySelectorAll('.dt-ck').forEach((el, i) => el.classList.toggle('on', S.b[i]));
  $('dtCn').textContent = `${S.b.filter(Boolean).length} / 4`;
  if (v === 'day') renderDay(t); else if (v === 'profile') renderPro(t); else renderSet(t);
  fitSet();
}
const optHtml = (opts, ans, right, act) => opts.map((o, j) =>
  `<button class="chip dt-opt ${ans === null ? '' : j === right ? 'dt-ok' : j === ans ? 'dt-bad' : ''}" data-act="${act}" data-j="${j}">${esc(o)}</button>`).join('');

function renderDay(t) {
  const D = S.day, n = D.tapT.filter((x) => x >= 0).length, done = n === 6, ans = D.ans;
  lab.setGlow('rgba(233, 184, 114, .25)');
  $('dtDayQ').textContent = t.dayAsk;
  $('dtDayOpts').innerHTML = optHtml(t.dayOpts, ans, 1, 'dans');
  $('dtDayV').textContent = ans === null ? '' : ans === 1 ? t.dayRight : t.dayWrong;
  $('dtDayV').className = `dt-v ${ans === null ? '' : ans === 1 ? 'ok' : 'bad'}`;
  $('dtDayRow').style.display = ans === null ? 'none' : '';
  $('dtNextM').textContent = done ? t.again : t.nextM;
  lab.setReadout(t.crumbsN(n), '', done ? t.pillDay : '', '#c98a3c');
  if (ans === null) lab.setState({ emo: '🤔', title: t.dayAsk, lead: '', body: '' });
  else if (!done) lab.setState({ emo: '🍪', title: t.tapMoment, lead: D.last >= 0 ? t.crumbs[D.last] : '', body: '' });
  else lab.setState({ emo: t.st.day[0], title: t.st.day[1], lead: t.st.day[2], body: t.st.day[3] });
  lab.setFacts(ans === null ? [] : t.facts.day);
}

function renderPro(t) {
  const P = S.pro, ended = P.i >= 12, shown = P.phase === 'shown' && !ended, k = ORDER[Math.min(P.i, 11)], pk = P.picks[P.i];
  lab.setGlow('rgba(46, 196, 182, .24)');
  $('dtBins').innerHTML = BOXES.map((b) => {
    const cls = shown ? (b === MODEL[k] ? 'dt-ok' : b === pk ? 'dt-bad' : 'dt-dim') : ended ? 'dt-dim' : '';
    return `<button class="dt-bin ${cls}" data-act="pbox" data-b="${b}" style="--c:${BOXCOL[b]}"><span class="i">${BOXICON[b]}</span><span>${esc(t.boxes[b])}</span></button>`;
  }).join('');
  $('dtNext').textContent = ended ? t.again : t.next;
  $('dtNext').style.visibility = shown || ended ? 'visible' : 'hidden';
  const li = shown ? P.i : P.i - 1, dots = Array.from({ length: 12 }, (_, j) => (j < P.i ? '●' : j === P.i && !ended ? '◉' : '○')).join(' ');
  lab.setReadout(t.sorted(proRight()), dots, li >= 0 ? t.items[ORDER[li]][2] : '', '#1f9e93');
  if (ended) lab.setState({ emo: t.st.profile[0], title: t.st.profile[1], lead: t.st.profile[2], body: t.st.profile[3] });
  else lab.setState({ emo: '🗂️', title: t.st.profile[1], lead: t.sortLead, body: '' });
  lab.setFacts(t.facts.profile);
}

function seesPct() {
  const o = S.set.on;
  return 20 + (!o.public ? 20 : 0) + (o.location ? 20 : 0) + (o.photoLoc ? 20 : 0) + (o.birthdayT ? 10 : 0) + (o.strangers ? 10 : 0);
}
const exposed = (k) => (k === 'public' ? !S.set.on.public : S.set.on[k]);
function renderSet(t) {
  const s = S.set, p = seesPct(), o = s.on;
  lab.setGlow('rgba(255, 107, 107, .22)');
  $('dtSetQ').textContent = t.setAsk;
  $('dtSetOpts').innerHTML = optHtml(t.setOpts, s.ans, 0, 'sans');
  $('dtSetV').textContent = s.ans === null ? '' : s.ans === 0 ? t.setRight : t.setWrong;
  $('dtSetV').className = `dt-v ${s.ans === null ? '' : s.ans === 0 ? 'ok' : 'bad'}`;
  $('dtSetH').textContent = s.ans === null ? '' : t.tryIt;
  $('dtRows').classList.toggle('dt-lock', s.ans === null);
  document.querySelectorAll('.dt-row').forEach((el) => {
    const k = el.dataset.tk; el.setAttribute('aria-checked', String(!!o[k])); el.classList.toggle('ex', exposed(k));
  });
  const gone = { about: o.public, loc: !o.location, bday: !o.birthdayT, msg: !o.strangers };
  document.querySelectorAll('.dt-slot[data-s]').forEach((el) => el.classList.toggle('gone', gone[el.dataset.s]));
  $('dtPhoto').classList.toggle('notag', !o.photoLoc);
  $('dtMT').textContent = t.sees(p);
  $('dtMF').style.width = `${100 - p}%`;
  lab.setReadout(t.sees(p), '', s.last ? `${exposed(s.last) ? '👁️' : '🔒'} ${t.toggles[s.last]}` : '', '#e5484d');
  if (s.ans === null) lab.setState({ emo: '🤔', title: t.setAsk, lead: '', body: '' });
  else lab.setState({ emo: t.st.settings[0], title: t.st.settings[1], lead: t.st.settings[2], body: t.st.settings[3] });
  lab.setFacts(t.facts.settings);
}
render();
</script>
