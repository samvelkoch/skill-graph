  const key = drag.key, at = pointerValue(key, ev) + drag.off;
  let raw, v;
  if (key === 'th') { raw = clamp(at, THMIN, THMAX); v = Math.abs(raw - 90) <= SNAPA ? 90 : raw; }
  else { raw = clamp(at, LMIN, LMAX); v = snapLen(key, raw); }
  const sn = v !== raw;
  if (sn && !drag.sn) sfx.snap();
  drag.sn = sn;
  if (v !== M[key]) { M[key] = v; D[key] = v; afterChange(); }
}
function afterChange() {
  if (lab.view === 'build' && !S.sec && S.bt < 3 && S.ph === 'build' && classify(M) === BT[S.bt].name) { S.ph = 'done'; S.shown = false; drag = null; sfx.good(); }
  render();
}

$('bSlider').addEventListener('input', (ev) => {
  let v = +ev.target.value;
  if (S.sec === 'frame') { if (Math.abs(v - 90) <= 2) v = 90; S.fphi = v; } else if (S.sec === 'kite') { if (Math.abs(v - 40) <= 1) v = 40; S.kt = v; }
  ev.target.value = v; render();
});

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = b.dataset.k;
  if (act === 'bp') { S.pred[k] = !S.pred[k]; sfx.tick(); }
  else if (act === 'lock') { S.ph = 'build'; sfx.click(); }
  else if (act === 'show') { Object.assign(M, PRESET[BT[S.bt].name]); S.ph = 'done'; S.shown = true; sfx.click(); }
  else if (act === 'next') { S.bt++; S.ph = 'predict'; S.pred = { eq: false, half: false, perp: false }; S.shown = false; Object.assign(M, NEUTRAL); sfx.click(); }
  else if (act === 'reset') { Object.assign(M, NEUTRAL); sfx.click(); }
  else if (act === 'again') { S.bt = 0; S.ph = 'predict'; S.pred = { eq: false, half: false, perp: false }; S.shown = false; Object.assign(M, NEUTRAL); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k;
    const sl = $('bSlider');
    if (S.sec === 'frame') { sl.min = 55; sl.max = 125; sl.value = S.fphi; } else if (S.sec === 'kite') { sl.min = 20; sl.max = 40; sl.value = S.kt; }
    sfx.click();
  } else if (act === 'tsel') { S.tsel = +b.dataset.r; S.tview = 'ask'; sfx.tick(); }
  else if (act === 'tcell') {
    const r = +b.dataset.r, c = +b.dataset.c; if (S.tchk[r]) return;
    S.tsel = r; S.tview = 'ask'; S.tc[r][c] = (S.tc[r][c] + 1) % 3; sfx.tick();
  } else if (act === 'tcheck') {
    const r = S.tsel; if (S.tchk[r] || S.tc[r].some((x) => !x)) return;
    S.tchk[r] = true; S.tview = 'result'; S.tlast = r; S.tshape = ROWS[r]; Object.assign(M, PRESET[ROWS[r]]);
    const ok = S.tc[r].every((x, i) => (x === 1) === !!TRUTH[ROWS[r]][i]); (ok ? sfx.good : sfx.bad)();
    const nx = ROWS.findIndex((_, i) => !S.tchk[i]); if (nx >= 0) S.tsel = nx;
  } else if (act === 'tagain') {
    S.tc = ROWS.map(() => [0, 0, 0]); S.tchk = ROWS.map(() => false); S.tsel = 0; S.tview = 'ask'; S.tlast = -1; S.tshape = null; Object.assign(M, NEUTRAL); sfx.click();
  } else if (act === 'rc') {
    if (S.rsolved) return;
    if (k === 'one' && S.rc.half) return;
    S.rc[k] = !S.rc[k]; if (k === 'half' && S.rc.half) S.rc.one = false; S.rrun = false; sfx.tick();
  } else if (act === 'rrun') runMachine();
  else if (act === 'rshow') {
    const set = RT[S.rt].set; S.rc = { eq: set.includes('eq'), half: set.includes('half'), perp: set.includes('perp'), one: set.includes('one') };
    S.rshown = true; runMachine();
  } else if (act === 'rnext') { S.rt++; resetRule(); sfx.click(); }
  else if (act === 'ragain') { S.rt = 0; resetRule(); sfx.click(); }
  render();
});
function resetRule() { S.rc = { eq: false, half: false, perp: false, one: false }; S.rrun = false; S.rsolved = false; S.rshown = false; S.rkind = null; S.rtries = 0; S.rfam = null; }
function runMachine() {
  const c = normRc(S.rc), task = RT[S.rt], rnd = rng(++S.rseed * 7919 + S.rt * 131);
  S.rsamp = [0, 1, 2].map(() => makeSample(c, rnd)); S.rrun = true; S.rt0 = now(); S.rtries++; S.rfam = famOf(c);
  const same = sameSet(PK.concat('one').filter((x) => c[x]), task.set);
  if (S.rfam === task.name && same) { S.rkind = 'right'; S.rsolved = true; sfx.good(); }
  else if (S.rfam === task.name) { S.rkind = 'extra'; sfx.bad(); }
  else { S.rkind = S.rfam ? 'fam' : 'mixed'; sfx.bad(); }
}

// --- render: controls, readout and the state card of the current view ---------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secBuild').style.display = v === 'build' ? '' : 'none';
  $('secTable').style.display = v === 'table' ? '' : 'none';
  $('secRule').style.display = v === 'rule' ? '' : 'none';
  if (v === 'build') renderBuild(t); else if (v === 'table') renderTable(t); else renderRule(t);
  document.body.dataset.drag = canDrag() ? 'on' : 'off';
}
const liveChip = (t, key, ok) => `<span class="chip dg-chip dg-live ${ok ? 'dg-ok' : 'dg-no'}">${esc(t.chips[key])} ${ok ? '✔' : '✖'}</span>`;
const btn = (act, label, extra = '') => `<button class="btn" data-act="${act}" ${extra}>${esc(label)}</button>`;

function renderBuild(t) {
  lab.setGlow('rgba(217, 164, 91, .24)');
  const open = secret.unlocked();
  $('bSecs').innerHTML = ['frame', 'kite'].map((k) => `<button class="chip dg-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'frame' ? '📐' : '🪁'} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`).join('');
  $('bSliderBox').hidden = !S.sec; $('bMain').style.display = S.sec ? 'none' : '';
  if (S.sec) return renderSecret(t);
  const task = S.bt < 3 ? t.bt[S.bt] : null, predict = !!task && S.ph === 'predict', name = classify(M), p = props(M);
  if (predict) {
    $('bChips').innerHTML = PK.map((k) => `<button class="chip dg-chip ${S.pred[k] ? 'on' : ''}" data-act="bp" data-k="${k}" aria-pressed="${S.pred[k]}">${esc(t.chips[k])}</button>`).join('');
    $('bBtns').innerHTML = btn('lock', t.b.lock);
    lab.setReadout('?', '', '', '#b9803a');
    lab.setState({ emo: '🤔', title: task.make, lead: task.ask, body: t.terms, extra: '' });
  } else {
    $('bChips').innerHTML = PK.map((k) => liveChip(t, k, p[k])).join('') + `<span class="chip dg-chip dg-nm">${esc(cap(t.shapes[name]))}</span>`;
    const d1 = (M.p1 + M.p2) / 10, d2 = (M.q1 + M.q2) / 10;
    lab.setReadout(`<span style="color:#f1d193">${num(d1)}</span> · <span style="color:#e39a78">${num(d2)}</span>`, t.cm, `${Math.round(M.th)}°`, '#b9803a');
    if (!task) {
      $('bBtns').innerHTML = `<button class="chip dg-chip" data-act="reset">${esc(t.b.reset)}</button><button class="chip dg-chip" data-act="again">${esc(t.b.again)}</button>`;
      lab.setState({ emo: '🔧', title: cap(t.shapes[name]), lead: t.info[name], body: t.b.freeBody, extra: '' });
    } else if (S.ph === 'build') {
      $('bBtns').innerHTML = `<button class="chip dg-chip" data-act="show">${esc(t.b.show)}</button>`;
      const special = (name === 'square' && S.bt !== 1) || (S.bt === 1 && (name === 'rhombus' || name === 'square'));
      lab.setState({ emo: '🔧', title: task.make, lead: special ? task.sq : t.b.lead, body: special ? '' : t.b.now(cap(t.shapes[name])), extra: '' });
    } else {
      $('bBtns').innerHTML = btn('next', S.bt < 2 ? t.b.next : t.b.free);
      const need = BT[S.bt].need, g = PK.filter((k) => S.pred[k]), lbl = (a) => (a.length ? a.map((k) => t.chips[k]).join(' + ') : t.b.none);
      const cmp = sameSet(g, need) ? t.b.same : t.b.diff(lbl(g), lbl(need));
      lab.setState({ emo: S.shown ? '👀' : '✅', title: S.shown ? t.b.shown : t.b.right, lead: task.rule, body: cmp, extra: '' });
    }
  }
  lab.setFacts(t.facts.build);
}
function renderSecret(t) {
  const sl = $('bSlider'), k = S.sec;
  $('bSliderLbl').textContent = t.fr && k === 'frame' ? t.fr.lbl : t.kt.lbl;
  if (+sl.value !== (k === 'frame' ? S.fphi : S.kt)) sl.value = k === 'frame' ? S.fphi : S.kt;
  if (k === 'frame') {
    lab.setGlow('rgba(217, 164, 91, .24)');
    const { d1, d2 } = frameDiag(), on = Math.abs(d1 - d2) < 0.05;
    lab.setReadout(`<span style="color:#ffd166">${num(d1)}</span> · <span style="color:#6ec1ff">${num(d2)}</span>`, t.cm, `${Math.round(S.fphi)}°`, '#b9803a');
    lab.setState({ emo: on ? '✅' : '📐', title: on ? t.fr.onT : t.fr.offT, lead: on ? t.fr.onL(num(d1)) : t.fr.offL(num(d1), num(d2)), body: on ? '' : t.fr.body, extra: '' });
    lab.setFacts(t.facts.frame);
  } else {
    lab.setGlow('rgba(90, 140, 238, .26)');
    const a = S.kt, b = 80 - S.kt, on = a === b;
    lab.setReadout(`${a} + ${b}`, t.cm, cap(t.shapes[on ? 'rhombus' : 'kite']), '#3f6bc4');
    lab.setState({ emo: on ? '✅' : '🪁', title: on ? t.kt.onT : t.kt.offT(a, b), lead: on ? t.kt.onL : t.kt.offL(50), body: t.kt.body, extra: '' });
    lab.setFacts(t.facts.kite);
  }
}

function renderTable(t) {
  lab.setGlow('rgba(110, 193, 255, .22)');
  const allDone = S.tchk.every(Boolean), nDone = S.tchk.filter(Boolean).length;
  let right = 0;
  ROWS.forEach((r, i) => { if (S.tchk[i]) right += S.tc[i].filter((x, j) => (x === 1) === !!TRUTH[r][j]).length; });
  $('tGrid').innerHTML = `<div></div>${t.tb.heads.map((h) => `<div class="dg-h">${esc(h)}</div>`).join('')}` + ROWS.map((r, i) =>
    `<button class="dg-rn ${S.tsel === i && !allDone ? 'on' : ''} ${S.tchk[i] ? 'done' : ''}" data-act="tsel" data-r="${i}">${esc(cap(t.shapes[r]))}</button>` +
    [0, 1, 2].map((j) => {
      const g = S.tc[i][j];
      if (S.tchk[i]) { const truth = TRUTH[r][j], ok = (g === 1) === !!truth; return `<button class="dg-cell ${ok ? 'good' : 'miss'}" disabled>${truth ? '✔' : '✖'}</button>`; }
      return `<button class="dg-cell ${g ? '' : 'q'} ${S.tsel === i ? 'on' : ''}" data-act="tcell" data-r="${i}" data-c="${j}" aria-label="${esc(t.tb.heads[j])}">${g === 1 ? '✔' : g === 2 ? '✖' : '?'}</button>`;
    }).join('')).join('');
  const sel = ROWS[S.tsel];
  $('tBtns').innerHTML = allDone ? btn('tagain', t.tb.again) : btn('tcheck', t.tb.check(t.shapes[sel]), S.tchk[S.tsel] || S.tc[S.tsel].some((x) => !x) ? 'disabled' : '');
  lab.setReadout(nDone ? `${right}/${nDone * 3}` : '?', t.tb.sub(nDone), '', '#3f8fd0');
  if (allDone) {
    lab.setState({ emo: '🏆', title: t.tb.endT(right), lead: t.tb.endL, body: S.tview === 'result' && S.tlast >= 0 ? t.tb.rows[ROWS[S.tlast]] : '', extra: '' });
  } else if (S.tview === 'result' && S.tlast >= 0) {
    const r = ROWS[S.tlast], n = S.tc[S.tlast].filter((x, j) => (x === 1) === !!TRUTH[r][j]).length;
    lab.setState({ emo: n === 3 ? '✅' : '🤔', title: t.tb.verdict(n), lead: t.tb.rows[r], body: '', extra: '' });
  } else {
    lab.setState({ emo: '📋', title: t.tb.preT, lead: t.tb.preL(t.shapes[sel]), body: t.terms, extra: '' });
  }
  lab.setFacts(t.facts.table);
}

function renderRule(t) {
  lab.setGlow('rgba(98, 214, 189, .22)');
  const end = S.rt >= RT.length;
  if (end) {
    $('rChips').innerHTML = ''; $('rBtns').innerHTML = btn('ragain', t.rl.again);
    lab.setReadout('4/4', '', '', '#2fb59b');
    lab.setState({ emo: '🏆', title: t.rl.endT, lead: t.rl.endL, body: '', extra: '' });
    lab.setFacts(t.facts.rule);
    return;
  }
  const task = RT[S.rt], name = t.shapes[task.name], c = normRc(S.rc);
  $('rChips').innerHTML = ['eq', 'half', 'perp', 'one'].map((k) => {
    const implied = k === 'one' && S.rc.half, on = implied || S.rc[k];
    return `<button class="chip dg-chip ${on ? 'on' : ''} ${implied || S.rsolved ? 'dg-imp' : ''}" data-act="rc" data-k="${k}" aria-pressed="${on}">${esc(t.chips[k])}</button>`;
  }).join('');
  $('rBtns').innerHTML = S.rsolved
    ? btn('rnext', t.rl.next)
    : btn('rrun', t.rl.run) + (S.rtries ? `<button class="chip dg-chip" data-act="rshow">${esc(t.rl.show)}</button>` : '');
  lab.setReadout(S.rtries ? String(S.rtries) : '?', t.rl.tries, cap(name), '#2fb59b');
  const rule = t.rl.rules[task.name];
  if (!S.rrun) lab.setState({ emo: '🔎', title: t.rl.ask(name), lead: t.rl.lead, body: t.rl.body, extra: '' });
  else if (S.rshown) lab.setState({ emo: '💡', title: t.rl.shownT, lead: rule, body: '', extra: '' });
  else if (S.rkind === 'right') lab.setState({ emo: '✅', title: t.rl.right, lead: rule, body: '', extra: '' });
  else if (S.rkind === 'extra') lab.setState({ emo: '🤏', title: t.rl.extraT, lead: t.rl.extraL, body: '', extra: '' });
  else if (S.rkind === 'fam') lab.setState({ emo: '🤔', title: t.rl.wrongT(t.plural[S.rfam]), lead: t.rl.wrongL(name), body: '', extra: '' });
  else lab.setState({ emo: '🤔', title: t.rl.mixT, lead: t.rl.mixL, body: '', extra: '' });
  void c;
  lab.setFacts(t.facts.rule);
}

canvasLoop($('cv'), draw);
render();
</script>
</body>
