<style>
  :root {
    --bg: #0A0E18; --panel: rgba(16, 21, 34, .82); --panel2: rgba(26, 32, 50, .9);
    --stroke: rgba(130, 145, 190, .16); --stroke2: rgba(130, 145, 190, .35);
    --ink: #EDEFF7; --body: #C6CDE0; --mut: #98A0B8; --faint: #646C84;
    --red: #FF3B30; --ok: #3ddc97; --wip: #f5c84c; --blue: #4cc3f5; --teal: #22b8b0; --violet: #a98bff;
    --park: #8fdc5e; --park2: #1f9d55;
    --serif: 'EB Garamond', Georgia, serif; --sans: 'Nunito', ui-rounded, ui-sans-serif, system-ui, sans-serif;
    --z: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% 30%, rgba(34, 184, 176, .16), transparent 70%), var(--bg);
    color: var(--body); font: 600 16px/1.45 var(--sans); min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }

  header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }
  #brand { font: 900 24px/1 var(--sans); letter-spacing: -.035em; text-transform: uppercase; color: #fff; text-decoration: none; }
  #brand i { font-style: normal; color: var(--red); }
  #brand small { display: block; font: 700 10.5px/1.2 var(--sans); letter-spacing: .14em; color: var(--mut); margin-top: 4px; }
  .tag { display: none; font: 500 24px/1.1 var(--serif); color: var(--ink); margin-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tag i, h1 i { color: var(--teal); font-style: normal; }
  .grow { flex: 1; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--stroke); border-radius: 999px; padding: 4px; gap: 2px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 14px; color: var(--mut); white-space: nowrap; }
  .seg button.on { background: var(--teal); color: #fff; }
  .iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--stroke); background: var(--panel); font-size: 17px; }
  .foot { padding: 4px 24px 30px; max-width: 1400px; margin: 0 auto; color: var(--faint); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .foot b { color: var(--mut); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: 10.5px; }
  .foot a { color: var(--body); text-decoration: none; border-bottom: 1px solid var(--stroke2); }
  .foot .lic { flex-basis: 100%; font-size: 11px; }

  .hero { padding: 8px 24px 0; max-width: 1400px; margin: 0 auto; }

  .lead { color: var(--mut); margin: 0; max-width: 680px; }

  main { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; padding: 14px 24px 28px; max-width: 1400px; margin: 0 auto; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--stroke); border-radius: 22px; padding: 18px; backdrop-filter: blur(10px); }
  .kick { font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .card h2 { font: 500 30px/1.1 var(--serif); color: var(--ink); margin: 4px 0 12px; }

  .fact .kick { color: var(--blue); display: flex; gap: 8px; align-items: center; }

  .fact .src { display: block; color: var(--faint); font-size: 11.5px; margin-top: 4px; }
  #info.fit1 .fact, #info.fit2 .intro { display: none; }
  .tagpill { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 900; letter-spacing: .04em; background: rgba(143, 220, 94, .18); color: var(--park); }
  .tagpill.new { background: rgba(31, 157, 85, .3); color: #6ee7a4; }
  .tagpill.sight { background: rgba(76, 195, 245, .16); color: var(--blue); }
  .plist { list-style: none; margin: 6px 0 4px; padding: 0; display: grid; gap: 5px; }
  .plist button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid transparent; background: var(--panel2); border-radius: 12px; padding: 6px 10px; color: var(--ink); font-weight: 800; font-size: 15px; line-height: 1.2; }
  .plist button:hover { border-color: var(--stroke2); }
  .plist .no { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 900; background: var(--park); color: #0b2410; }
  .plist .em { flex: none; width: 24px; text-align: center; }
  .sub { font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 12px 0 2px; }
  .back { border: 0; background: none; color: var(--mut); font-weight: 800; padding: 0; margin-top: 10px; }
  .bigemo { font-size: 44px; line-height: 1; }

  .scene { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .goal { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 16px; background: linear-gradient(90deg, rgba(34, 184, 176, .18), rgba(34, 184, 176, .04)); border: 1px solid rgba(34, 184, 176, .45); color: var(--ink); font-weight: 800; font-size: 19px; line-height: 1.25; min-height: 54px; }
  .goal .em { font-size: 26px; }
  .goal .tx { flex: 1; }
  .goal small { display: block; font-size: 12px; color: var(--mut); font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
  .goal.good { border-color: rgba(61, 220, 151, .7); background: linear-gradient(90deg, rgba(61, 220, 151, .22), rgba(61, 220, 151, .04)); }
  .boardwrap { position: relative; background: rgba(8, 12, 22, .65); border: 1px solid var(--stroke); border-radius: 26px; padding: 10px; overflow: hidden; }
  svg.board { display: block; width: 100%; height: auto; max-height: 64vh; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .ctrls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ctl { border: 1px solid var(--stroke2); background: var(--panel2); border-radius: 999px; padding: 9px 16px; font-weight: 900; color: var(--ink); white-space: nowrap; }
  .ctl.go { background: var(--ok); color: #05210f; border-color: transparent; }
  .ctl.teal { background: var(--teal); color: #fff; border-color: transparent; }
  .ctl.lock { color: var(--mut); }
  .ctl:disabled { opacity: .4; cursor: default; }
  .ctl.pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(61, 220, 151, .22); } }

  /* map */
  .pin { cursor: pointer; }
  .pin .pb { stroke: #fff; stroke-width: 3; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .5)); transition: r .2s; }
  .pin.unit .pb { fill: #2e7d3b; } .pin.sight .pb { fill: #1d5f8a; } .pin.new .pb { fill: #136b3b; }
  .pin .pe { font-size: 18px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .pin .bd circle { fill: var(--wip); stroke: #0A0E18; stroke-width: 2; }
  .pin .bd text { font: 900 11px var(--sans); fill: #0A0E18; text-anchor: middle; dominant-baseline: central; }
  .pin.sel .pb { stroke: var(--wip); stroke-width: 5; }
  .pin .ring { fill: none; stroke: var(--wip); stroke-width: 3; opacity: 0; }
  .pin.sel .ring { animation: ring 1.6s ease-out infinite; }
  @keyframes ring { 0% { opacity: .9; r: 18; } 100% { opacity: 0; r: 34; } }
  .pin:hover .pb { stroke: var(--wip); }
  .find .pin .pb { fill: #3a4568; }
  .find .pin .pe { font: 900 18px var(--sans); fill: #fff; }
  .pin.right .pb { fill: var(--ok) !important; stroke: #fff; }
  .pin.wrong .pb { fill: var(--red) !important; }
  .pin.wrong { animation: shake .4s; }
  @keyframes shake { 25% { transform: translate(calc(var(--x) * 1px - var(--k) * 6px), calc(var(--y) * 1px)) scale(var(--s)); } 75% { transform: translate(calc(var(--x) * 1px + var(--k) * 6px), calc(var(--y) * 1px)) scale(var(--s)); } }
  .newg { transition: opacity .8s, transform .9s cubic-bezier(.2, 1.4, .4, 1); transform-box: fill-box; transform-origin: center; }
  .y1997 .newg { opacity: 0; transform: scale(.2); pointer-events: none; }
  .night .pin:not([data-pin="stars"]), .night .lbl { opacity: 0; pointer-events: none; transition: opacity .6s; }
  .nightg { opacity: 0; transition: opacity 1.2s; pointer-events: none; }
  .night .nightg { opacity: 1; }
  .twinkle { animation: tw 2.4s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .35; } }
  .mapnote { position: absolute; right: 18px; bottom: 14px; font-size: 12px; color: rgba(237, 239, 247, .7); text-shadow: 0 1px 3px #000; pointer-events: none; }
  /* the map fills its frame: the SVG is laid over the padding box, so its size never depends on its content */
  .boardwrap.mapwrap { --bp: 10px; padding: var(--bp); aspect-ratio: 1.4 / 1; }
  .boardwrap.mapwrap svg.board { position: absolute; left: var(--bp); top: var(--bp); width: calc(100% - 2 * var(--bp)); height: calc(100% - 2 * var(--bp)); max-height: none; }
  .legend { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--mut); font-weight: 800; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }

  /* hill */
  svg.board .sway { transform-box: fill-box; transform-origin: 50% 100%; }
  svg.board.windy .sway { animation: hsway 2.6s ease-in-out both; }
  svg.board.windy .swayb { animation-delay: .25s; }
  @keyframes hsway { 0%, 100% { transform: skewX(0); } 22% { transform: skewX(-4.5deg); } 48% { transform: skewX(2.5deg); } 74% { transform: skewX(-1.5deg); } }
  .concept.witness { border-left-color: var(--wip); margin-top: 12px; }

  /* answers (hill prediction, secret quiz) */
  .opts { display: grid; gap: 8px; margin: 10px 0; }
  .opts button { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--stroke2); background: var(--panel2); border-radius: 14px; padding: 10px 12px; font-weight: 800; color: var(--ink); line-height: 1.25; }
  .opts button .l { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--wip); color: #0A0E18; display: grid; place-items: center; font-weight: 900; }
  .opts button.right { background: rgba(61, 220, 151, .25); border-color: var(--ok); }

  .opts button:disabled { cursor: default; }
  .verdict { padding: 10px 12px; border-radius: 14px; background: rgba(76, 195, 245, .1); border: 1px solid rgba(76, 195, 245, .4); color: var(--ink); }
  .stagechips { display: flex; gap: 6px; flex-wrap: wrap; }
  .stagechips button { border: 1px solid var(--stroke2); background: var(--panel2); border-radius: 999px; padding: 7px 13px; font-weight: 800; color: var(--mut); white-space: nowrap; }
  .stagechips button.on { background: #fff; color: #0A0E18; border-color: #fff; }
  .stagechips button:disabled { opacity: .35; cursor: default; }
  @media (min-width: 1000px) and (min-height: 600px) { .stagechips button:not(.on) .st { display: none; } }

  /* who am I */
  .who { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 14px; padding: 6px; width: 100%; }
  .who .wcard { flex: 0 0 calc((100% - 28px) / 3); max-width: 300px; }
  .wcard { position: relative; border: 2px solid var(--stroke2); background: var(--panel2); border-radius: 20px; padding: 8px 8px 10px; color: var(--ink); text-align: center; font-weight: 900; font-size: 16px; line-height: 1.15; transition: transform .25s, border-color .2s, opacity .3s; }
  .wcard svg { display: block; width: 100%; height: auto; border-radius: 14px; margin-bottom: 8px; }
  .wcard:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--wip); }
  .wcard.no { opacity: .35; text-decoration: line-through; }
  .wcard.no::after { content: '✕'; position: absolute; top: 8px; right: 12px; color: var(--red); font-size: 26px; }
  .wcard.yes { border-color: var(--ok); box-shadow: 0 0 0 4px rgba(61, 220, 151, .25), 0 0 30px rgba(61, 220, 151, .35); transform: scale(1.04); }
  .wcard:disabled { cursor: default; }
  .clues { list-style: none; padding: 0; margin: 8px 0 10px; display: grid; gap: 8px; counter-reset: c; }
  .clues li { counter-increment: c; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: var(--panel2); color: var(--ink); font-weight: 800; font-size: 17px; line-height: 1.3; animation: pop .35s ease-out; }
  .clues li::before { content: counter(c); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--violet); color: #120a2a; display: grid; place-items: center; font-size: 14px; font-weight: 900; }
  .clues li.hidden { color: var(--faint); background: none; border: 1px dashed var(--stroke2); animation: none; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } }
  .stars { font-size: 22px; letter-spacing: 2px; }
  .stars .off { opacity: .2; }

  /* class quiz */
  .quiz { display: none; margin: 14px 24px 28px; max-width: 1352px; padding: 22px 26px; }
  .quizmode .quiz { display: flex; flex-direction: column; }
  .quizmode main, .quizmode .hero { display: none; }
  .qz-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .qz-head .kick { font-size: 13px; color: var(--mut); }
  .qz-dots { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  .qz-dots span { width: 14px; height: 14px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--stroke2); }
  .qz-dots .r { background: var(--ok); border-color: var(--ok); }
  .qz-dots .w { background: var(--red); border-color: var(--red); }
  .qz-dots .cur { border-color: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .2); }
  .qz-body { flex: 1; min-height: 0; display: flex; align-items: center; margin-top: 14px; }
  .qz-main { max-width: 920px; width: 100%; margin: 0 auto; }
  .qz-main .qem { font-size: 46px; line-height: 1; margin-bottom: 8px; }
  .quiz h2 { font: 500 clamp(26px, 2.9vw, 42px)/1.12 var(--serif); margin: 0 0 18px; color: var(--ink); }
  .qz-ans { display: grid; gap: 10px; }
  .qz-ans button { display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--stroke2); background: var(--panel2); border-radius: 16px; padding: 12px 16px; font-weight: 800; font-size: 20px; line-height: 1.25; color: var(--ink); }
  .qz-ans button .l { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--wip); color: #0A0E18; display: grid; place-items: center; font-weight: 900; }
  .qz-ans button:disabled { cursor: default; opacity: .55; }
  .qz-ans button.right { background: rgba(61, 220, 151, .25); border-color: var(--ok); opacity: 1; }
  .qz-ans button.right .l { background: var(--ok); }
  .qz-ans button.wrong { background: rgba(255, 59, 48, .2); border-color: var(--red); opacity: 1; text-decoration: line-through; }
  .qz-why { margin-top: 14px; padding: 12px 16px; border-radius: 16px; background: rgba(76, 195, 245, .1); border: 1px solid rgba(76, 195, 245, .4); color: var(--ink); font-size: 18px; line-height: 1.35; }
  .qz-foot { display: flex; align-items: center; gap: 14px; margin-top: 14px; min-height: 46px; color: var(--mut); font-size: 15px; }
  .qz-foot .big { margin-left: auto; }
  .big { border: 0; background: #fff; color: #0A0E18; border-radius: 999px; padding: 11px 24px; font-weight: 900; white-space: nowrap; }
  .big.alt { background: var(--panel2); color: var(--ink); border: 1px solid var(--stroke2); }
  .qz-end { margin: auto; text-align: center; }
  .qz-end .cup { font-size: 80px; line-height: 1; }
  .qz-end h2 { margin: 10px 0 8px; }
  .qz-end p { font-size: 19px; color: var(--body); margin: 0 0 20px; }
  .qz-end .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .qz-n { display: grid; gap: 2px; min-width: 120px; padding: 14px 20px; border-radius: 20px; }
  .qz-n b { font: 500 44px/1 var(--serif); }
  .qz-n small { font-size: 13px; font-weight: 800; }

  /* modal */
  .modal { position: fixed; inset: 0; background: rgba(4, 6, 12, .7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal.open { display: flex; }
  .dlg { zoom: var(--z); background: #111727; border: 1px solid var(--stroke2); border-radius: 24px; padding: 26px; width: min(560px, 100%); text-align: center; }
  .dlg h3 { font: 500 30px/1.15 var(--serif); color: var(--ink); margin: 8px 0 18px; }
  .dlg .opts { text-align: left; }
  .dlg .big { margin-top: 14px; }
  .dlg .prize { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dlg .prize div { background: var(--panel2); border-radius: 16px; padding: 14px; border: 1px solid var(--stroke2); color: var(--ink); font-weight: 800; }
  .dlg .prize b { display: block; font-size: 30px; }
  .dots { margin-top: 14px; letter-spacing: 4px; color: var(--faint); }

  /* big screen (projector): the whole lab on one screen, no page scroll */
  @media (min-width: 1000px) and (min-height: 600px) {
    html, body { height: 100%; overflow: hidden; }

    header { padding: 10px 20px 8px; flex-wrap: nowrap; }
    .hero { display: none; }
    .tag { display: block; flex: 0 1 auto; }
    main { flex: 1; min-height: 0; width: 100%; max-width: none; margin: 0; padding: 0 20px 8px; align-items: stretch;
      grid-template-columns: clamp(300px, 30vw, 420px) minmax(0, 1fr); }
    #info { min-height: 0; overflow: auto; }
    .scene { min-height: 0; }
    .boardwrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .boardwrap.mapwrap { aspect-ratio: auto; }
    svg.board { flex: 1; min-width: 0; min-height: 0; height: 100%; max-height: none; }
    .who { height: 100%; }
    .who .wcard { flex-basis: auto; width: calc(((100vh / var(--z)) - 420px) / 2 * 1.2 + 16px); max-width: calc((100% - 28px) / 3); }
    .quiz { flex: 1; min-height: 0; margin: 0 20px 8px; max-width: none; overflow: auto; }
    .foot { flex: none; width: 100%; max-width: none; margin: 0; padding: 0 20px 8px; flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
    .foot .lic { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .ctrls { flex-wrap: nowrap; }
    .ctrls .legend { flex-wrap: wrap; min-width: 0; gap: 2px 12px; font-size: 12.5px; line-height: 1.2; }
    /* the place list fits without scrolling: two columns, tighter text */
    #info { padding: 14px 16px; }
    #info h2 { font-size: 26px; margin: 2px 0 8px; }
    #info .concept { font-size: 15px; }
    #info p { margin-bottom: 8px; }
    #info .mission { display: none; }
    #info .sub { margin: 8px 0 2px; }
    #info .plist { grid-template-columns: 1fr 1fr; gap: 5px; margin: 4px 0 2px; }
    #info .plist button { font-size: 14px; padding: 5px 8px; gap: 8px; }

  }
  @media (min-width: 1000px) and (min-height: 600px) and (max-height: 760px) {
    .fact, #info .mission { display: none; }

    #info .plist button { padding: 3px 8px; font-size: 13.5px; line-height: 1.15; }
    #info .sub { margin: 6px 0 2px; }

  @media (min-width: 1000px) and (min-height: 600px) and (max-height: 680px) {
    #info .concept.intro, .ctrls .legend { display: none; }

  @media (min-width: 1000px) and (max-width: 1499px) { .tag { display: none; } }
  @media (min-width: 1600px) and (min-height: 900px) { :root { --z: 1.3; } }
  @media (min-width: 2300px) and (min-height: 1300px) { :root { --z: 1.75; } }

  /* phones and small screens: a scrolling page, picture first */

// =====================================================================================================
// HILL: a cross-section from volcano to witness hill
// =====================================================================================================
// ---- geometry: one place for the ground outline, used by the first build and by every erosion frame ----
// The old ground level is y = 300. Under the basalt cap it never changes; around it the plain sinks by up to 130 and
// the cap's flanks spread into talus slopes. e = 0 (flat ground) .. 1 (today).
const HW = 960, HG0 = 300, HCL = 352, HCR = 608, HCT = 266, HDROP = 130, HSPREAD = 140;
const HLINE = 300; // y of the dashed "old ground level" line and of the far witness-hill tops (the cap's top is HCT)

  const tag = o.t ? 'animateTransform' : 'animate';

function hFlank(e) { // left flank as cubic Bézier control points, from the toe on the plain up to the cap corner

    ` M${HCR},${HG0} C${hf(m(p[2][0]))},${hf(p[2][1])} ${hf(m(p[1][0]))},${hf(p[1][1])} ${hf(m(tl))},${hf(yP)} L${HW},${hf(yP)}`;

    : `M${HCR},${HG0} C${hf(m(p[2][0]))},${hf(p[2][1])} ${hf(m(p[1][0]))},${hf(p[1][1])} ${hf(m(tl))},${hf(yP)} L${HCR},${hf(yP)} Z`;

const HSCREE = [[-1, 0.93, 1, 12, 0.1], [1, 0.95, 0.9, -10, 0.14], [-1, 0.84, 1.15, -8, 0.2], [1, 0.86, 1, 14, 0.27], [-1, 0.76, 0.85, 20, 0.34], [1, 0.74, 1.1, -16, 0.42], [-1, 0.66, 1, 6, 0.5], [1, 0.64, 0.85, -6, 0.58], [-1, 0.57, 0.8, 10, 0.66], [1, 0.56, 0.9, -12, 0.74]];

const hBlock = `<path d="M-5,0 L-4,-5 L1,-8 L6,-4 L5,0 Z" fill="#7d8596" stroke="#1c2028" stroke-width="1"/><path d="M1,-8 L6,-4 L5,0 L1,0 Z" fill="#3a404c"/><path d="M-4,-5 L1,-8" stroke="#b3bccd" stroke-width="1" fill="none"/>`;

}
function renderQuiz() {
  const box = $('quiz');
  if (!qz.set) {
    const last = store.get('quizN', 10);
    box.innerHTML = `<div class="qz-end"><div class="cup">🏆</div><h2>${esc(u.cqHow)}</h2><p>${esc(u.cqHowSub)}</p>
      <div class="row">${CQ_SIZES.map((n) => `<button class="big${n === last ? '' : ' alt'} qz-n" data-cqn="${n}"><b>${n}</b><small>${esc(u.cqN(n).replace(/^\d+\s*/, ''))}</small></button>`).join('')}</div></div>`;
    return;
  }
  const N = qz.set.length;
  if (qz.i >= N) {
    const r = qz.marks.filter(Boolean).length;
    box.innerHTML = `<div class="qz-end"><div class="cup">🏆</div><h2>${esc(u.cqDone)}</h2><p>${esc(u.cqEnd(r, N))}</p>${qz.unlockedNow ? `<p>${esc(u.cqUnlock)}</p>` : ''}
      <div class="row"><button class="big alt" data-cq="again">↺ ${esc(u.again)}</button><button class="big" data-v="map">🗺️ ${esc(u.cqBack)}</button></div></div>`;
    return;
  }
  const qid = qz.set[qz.i], [em, q, ans, why] = u.cq[qid], ok = CQ_OK[qid], done = qz.picked != null;
  const dots = qz.set.map((_, i) => `<span class="${i < qz.marks.length ? (qz.marks[i] ? 'r' : 'w') : ''}${i === qz.i ? ' cur' : ''}"></span>`).join('');
  const cls = (i) => (!done ? '' : i === ok ? ' class="right"' : i === qz.picked ? ' class="wrong"' : '');
  box.innerHTML = `<div class="qz-head"><span class="kick">🏆 ${esc(u.quizTab)} · ${esc(u.cqOf(qz.i + 1, N))}</span><div class="qz-dots">${dots}</div></div>
    <div class="qz-body"><div class="qz-main"><div class="qem">${em}</div><h2>${esc(q)}</h2>
      <div class="qz-ans">${ans.map((a, i) => `<button data-cqa="${i}"${cls(i)}${done ? ' disabled' : ''}><span class="l">${i + 1}</span><span>${esc(a)}</span></button>`).join('')}</div>
      ${done ? `<div class="qz-why">${qz.picked === ok ? '✅ ' + esc(u.right) : '💡'} ${esc(why)}</div>` : ''}
      <div class="qz-foot">${done ? `<button class="big" data-cq="next">${esc(qz.i + 1 < N ? u.next : u.cqFinish)} →</button>` : `<span>🙋 ${esc(u.cqVote)}</span>`}</div>
    </div></div>`;
}
function quizAnswer(i) {
  if (!qz.set || qz.picked != null || qz.i >= qz.set.length || i >= 3) return;
  qz.picked = i; qz.marks[qz.i] = i === CQ_OK[qz.set[qz.i]];
  if (qz.marks[qz.i]) good(); else bad();
  renderQuiz();
}
function quizNext() {
  if (!qz.set || qz.picked == null) return;
  qz.i++; qz.picked = null;
  if (qz.i >= qz.set.length) { tune([523, 659, 784, 1046, 1318]); if (!unlocked) { unlock(0); qz.unlockedNow = true; } }
  renderQuiz();
}

// =====================================================================================================
// SECRET QUIZ (3 questions) → unlocks the train and the night sky, marks the lab's topics "learning"
// =====================================================================================================
function ymd() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function unlock(wrong) {
  unlocked = true; store.set('unlocked', true);
  try {
    localStorage.setItem('sg-lab:done:balaton-park', JSON.stringify({ d: ymd(), w: wrong }));
    const p = JSON.parse(localStorage.getItem('skillgraph.progress') || '{}') || {};
    let n = 0;
    for (const t of TOPICS) if (!p[t.id]) { p[t.id] = 'learning'; n++; }
    if (n) localStorage.setItem('skillgraph.progress', JSON.stringify(p));
  } catch { /* private mode */ }
}
let si = -1, sWrong = 0;
function openSecret() {
  si = -1;
  $('dlg').innerHTML = `<div class="kick">🔬 ${esc(u.secT)}</div><h3>${esc(u.secH)}</h3>
    <div class="prize"><div><b>${u.s1[0]}</b>${esc(u.s1[1])}</div><div><b>${u.s2[0]}</b>${esc(u.s2[1])}</div></div>
    <p style="margin-top:16px">${esc(u.secP)}</p><button class="big" data-sq="next">${esc(u.secStart)}</button>`;
  $('modal').classList.add('open');
}
function secretNext() {
  si++;
  if (si >= SECRET_Q.length) {
    unlock(sWrong); tune([523, 659, 784, 1046, 1318]);
    $('dlg').innerHTML = `<div class="kick">🔓 ${esc(u.secT)}</div><h3>🎉 ${esc(u.secOpen)}</h3><button class="big" data-sq="close">${esc(u.close)}</button>`;
    if (mode === 'map') renderMap();
    return;
  }
  if (si === 0) sWrong = 0;
  const qid = SECRET_Q[si], [em, q, ans] = u.cq[qid];
  $('dlg').innerHTML = `<div class="kick">🔬 ${esc(u.secT)} · ${esc(u.secOf(si + 1, SECRET_Q.length))}</div><h3>${em} ${esc(q)}</h3>
    <div class="opts">${ans.map((a, i) => `<button data-sa="${i}"><span class="l">${i + 1}</span><span>${esc(a)}</span></button>`).join('')}</div>
    <div class="dots">${SECRET_Q.map((_, i) => `<span class="${i <= si ? 'on' : ''}">●</span>`).join('')}</div>`;
}
function secretAnswer(i) {
  const ok = CQ_OK[SECRET_Q[si]];
  document.querySelectorAll('.dlg .opts button').forEach((b) => (b.disabled = true));
  document.querySelector(`.dlg [data-sa="${ok}"]`).classList.add('right');
  if (i === ok) { good(); setTimeout(secretNext, 700); }
  else {
    document.querySelector(`.dlg [data-sa="${i}"]`).classList.add('wrong'); bad(); sWrong++;
    $('dlg').insertAdjacentHTML('beforeend', `<p style="margin-top:12px">${esc(u.secWrong)}</p><button class="big" data-sq="restart">${esc(u.again)}</button>`);
  }
}

// =====================================================================================================
// chrome, modes, events
// =====================================================================================================
function renderStatic() {
  document.documentElement.lang = lang;
  document.title = `${u.name} · Skill Graph`;
  $('brand').href = graphLink(TOPICS[0].id); $('brand').title = u.back;
  $('brand').innerHTML = `Skill Graph<i>.</i><small>${esc(u.brand)}</small>`;
  $('foot').innerHTML = `<b>${esc(u.topicsT)}</b>${TOPICS.map((t) => `<a href="${graphLink(t.id)}">${esc(t[lang])}</a>`).join('')}<span class="lic" title="${esc(u.lic)}">${esc(u.lic)}</span>`;
  $('h1').innerHTML = u.h1; $('lead').textContent = u.lead; $('tag').innerHTML = u.h1;
  [...$('view').children].forEach((b) => { b.textContent = u.tabs[b.dataset.v]; b.classList.toggle('on', b.dataset.v === mode); });
  $('snd').textContent = sound ? '🔊' : '🔇';
  $('langs').innerHTML = ['hu', 'en', 'ru'].filter((k) => T[k]).map((k) => `<button data-lang="${k}" class="${k === lang ? 'on' : ''}">${k.toUpperCase()}</button>`).join('');
}
function render() {
  renderStatic();
  $('boardwrap').classList.remove('mapwrap'); // renderMap() sets it again
  document.body.classList.toggle('quizmode', mode === 'quiz');
  if (mode === 'map') renderMap();
  else if (mode === 'hill') renderHill();
  else if (mode === 'who') renderWho();
  else renderQuiz();
}
function setMode(v) {
  if (hillAnim) { cancelAnimationFrame(hillAnim); hillAnim = null; if (stage === 2 && hillPick != null) erosion = 1; }
  if (v !== 'map') stopTrain();
  mode = v; factI = 0;
  if (v === 'quiz') qz = { set: null, i: 0, marks: [], picked: null };
  const p = new URLSearchParams(location.search); if (v === 'map') p.delete('view'); else p.set('view', v); p.delete('n');
  history.replaceState(null, '', '?' + p);
  render();
}

document.addEventListener('click', (e) => {
  const pin = e.target.closest('.pin');
  if (pin && mode === 'map') {
    const id = pin.dataset.pin;
    if (find && !find.done) findTap(id);
    else { sel = sel === id ? null : id; beep(660, 0.05); if (night && id === 'stars') night = false; renderMap(); }
    return;
  }
  const el = e.target.closest('button');
  if (!el) { if (e.target === $('modal')) $('modal').classList.remove('open'); return; }
  const d = el.dataset;
  if (d.lang) { lang = d.lang; u = T[lang]; const p = new URLSearchParams(location.search); p.set('lang', lang); history.replaceState(null, '', '?' + p); render(); }
  else if (d.v) setMode(d.v);
  else if (d.year) { year = +d.year; if (year === 1997 && sel && byId[sel].g === 'new') sel = null; stopTrain(); beep(year === 2026 ? 784 : 523, 0.12); renderMap(); }
  else if (d.sel) { sel = d.sel; if (byId[sel].g === 'new') year = 2026; beep(660, 0.05); renderMap(); }
  else if (d.back) { sel = null; renderMap(); }
  else if (d.find === 'start') findStart();
  else if (d.find === 'stop') { find = null; renderMap(); }
  else if (d.find === 'next') findNext();
  else if (d.secret) {
    if (!unlocked) openSecret();
    else if (d.secret === 'train') startTrain();
    else { night = !night; stopTrain(); sel = night ? 'stars' : null; find = null; beep(night ? 330 : 660, 0.2); renderMap(); }
  }
  else if (d.fact) { factI++; render(); }
  else if (d.stage) setStage(+d.stage);
  else if (d.hillnext) setStage(Math.min(3, stage + 1));
  else if (d.hpick) hillPickAns(+d.hpick);
  else if (d.wind) wind();
  else if (d.wpick) whoPick(d.wpick);
  else if (d.who === 'clue') { if (who.clues < 3) { who.clues++; beep(520, 0.06); renderWho(); } }
  else if (d.who === 'next') { who.i++; who.clues = 1; who.no = []; who.solved = false; if (who.i >= who.order.length) tune([523, 659, 784, 1046]); renderWho(); }
  else if (d.who === 'again') { who = { order: who.order, i: 0, clues: 1, no: [], solved: false, stars: [] }; renderWho(); }
  else if (d.cqa) quizAnswer(+d.cqa);
  else if (d.cq === 'next') quizNext();
  else if (d.cq === 'again') setMode('quiz');
  else if (d.cqn) quizStart(+d.cqn);
  else if (d.sq === 'next') secretNext();
  else if (d.sq === 'restart') { si = -1; secretNext(); }
  else if (d.sq === 'close') $('modal').classList.remove('open');
  else if (d.sa) secretAnswer(+d.sa);
  el.blur();
});
$('snd').onclick = () => { sound = !sound; store.set('sound', sound); $('snd').textContent = sound ? '🔊' : '🔇'; if (sound) beep(660, 0.08); };
// keyboard, for the teacher at the laptop: 1–3 answer, Enter / → next
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { $('modal').classList.remove('open'); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || $('modal').classList.contains('open')) return;
  const onBtn = e.target.tagName === 'BUTTON' || e.target.tagName === 'A';
  const nextKey = (e.key === 'Enter' && !onBtn) || e.key === 'ArrowRight';
  if (mode === 'quiz') { if ('123'.includes(e.key)) quizAnswer(+e.key - 1); else if (nextKey) quizNext(); }
  else if (mode === 'hill') { if (stage === 2 && hillPick == null && '123'.includes(e.key)) hillPickAns(+e.key - 1); else if (nextKey && stage < 3 && !(stage === 2 && (hillPick == null || hillAnim))) setStage(stage + 1); }
  else if (mode === 'who') { if (nextKey && who.solved) document.querySelector('[data-who="next"]')?.click(); else if (e.key === ' ' && !onBtn && !who.solved) { e.preventDefault(); document.querySelector('[data-who="clue"]')?.click(); } }
  else if (mode === 'map' && find && nextKey) document.querySelector('[data-find="next"]')?.click();
});

render();
if (mode === 'quiz' && params.get('n')) quizStart(+params.get('n'));
</script>
