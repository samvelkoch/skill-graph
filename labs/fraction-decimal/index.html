}
function smTap(px, py) {
  const s = S.sm, g = G.sm; if (!s.rev || !g) return;
  for (const z of g.pills) if (px >= z.x && px <= z.x + z.w && py >= z.y && py <= z.y + z.h) { s.sel = { t: 'g', k: z.key }; s.msg = null; sfx.tick(); render(); return; }
  if (py < g.yR - 34 || py > g.yR + g.RH + 10) return;
  let best = null, bd = 1e9;
  for (const m of g.marks) { const d = Math.abs(px - m.x); if (d < bd) { bd = d; best = m; } }
  if (!best || bd > 26) return;
  if (s.sel && s.sel.t === 'c') {
    const cd = cardBy(s.sel.id);
    if (best.key === cd.g) {
      s.placed[cd.id] = tnow(); s.sel = { t: 'g', k: cd.g }; s.msg = { ok: true, text: T[lang].sm.good }; sfx.snap();
    } else { s.msg = { ok: false, text: T[lang].sm.wrong }; sfx.bad(); }
  } else if (!best.notch) { s.sel = { t: 'g', k: best.key }; s.msg = null; sfx.tick(); }
  else { s.msg = { ok: false, text: T[lang].sm.selFirst }; sfx.bad(); }
  render();
}
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec) return; const [px, py] = posOf(ev);
  if (lab.view === 'share') { if (shFlag(px, py, false)) { drag = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ } sfx.tick(); render(); } }
  else if (lab.view === 'same') smTap(px, py);
});
cv.addEventListener('pointermove', (ev) => { if (!drag) return; const [px, py] = posOf(ev); shFlag(px, py, true); render(); });
const dragEnd = () => { drag = false; };
cv.addEventListener('pointerup', dragEnd); cv.addEventListener('pointercancel', dragEnd);

function revealSm() {
  const s = S.sm, n0 = tnow();
  s.rev = true; s.ok = s.order.join() === 'g30pc,g13fr,g35dec';
  TRIO.forEach((cd, i) => { s.placed[cd.id] = n0 + 0.15 + i * 0.35; });
  s.zoomed = true; s.sel = { t: 'g', k: 'g13' }; s.msg = null; (s.ok ? sfx.good : sfx.bad)(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const bt = ev.target.closest('[data-act],[data-d]'); if (!bt || bt.disabled) return;
  if (bt.dataset.d) {
    const g = bt.dataset.g, k = bt.dataset.d, st = g === 'sh' ? S.sh : S.rp, [lo, hi] = LIM[g][k], n = clamp(st[k] + +bt.dataset.s, lo, hi);
    if (n === st[k]) return; st[k] = n; (g === 'sh' ? resetSh : resetRp)(); sfx.tick(); render(); return;
  }
  const act = bt.dataset.act;
  if (act === 'shcut') {
    const s = S.sh;
    if (s.phase === 0 && s.guess !== null) { s.phase = 1; s.p = 0; sfx.push(); showStage(); } else if (s.phase === 2) { resetSh(); sfx.click(); }
  } else if (act === 'shzoom') { if (S.sh.phase === 2) { S.sh.zoom = (S.sh.zoom + 1) % 3; sfx.click(); } }
  else if (act === 'pre') { S.rp.a = +bt.dataset.a; S.rp.b = +bt.dataset.b; resetRp(); sfx.click(); }
  else if (act === 'rpstep') {
    const r = S.rp, N = ld(r.a, r.b).dig.length;
    if (r.ans === null) return;
    if (r.n >= N && r.sub < 0) { r.n = 0; r.run = false; sfx.click(); } else if (r.sub < 0) { r.sub = 0; sfx.tick(); showStage(); }
  } else if (act === 'rprun') {
    const r = S.rp, N = ld(r.a, r.b).dig.length;
    if (r.ans === null) return;
    if (r.n >= N && r.sub < 0) { r.n = 0; r.run = true; } else r.run = !r.run;
    sfx.click(); if (r.run) showStage();
  } else if (act === 'card') {
    const s = S.sm, id = bt.dataset.id;
    if (!s.rev) { if (!s.order.includes(id) && s.order.length < 3) { s.order.push(id); sfx.tick(); } }
    else { s.sel = { t: 'c', id }; s.zoomed = false; s.msg = null; sfx.click(); }
  } else if (act === 'unslot') { S.sm.order.splice(+bt.dataset.i, 1); sfx.tick(); }
  else if (act === 'check') { if (S.sm.order.length === 3) revealSm(); }
  else if (act === 'smzoom') { S.sm.zoomed = !S.sm.zoomed; sfx.click(); }
  else if (act === 'sec') {
    const k = bt.dataset.k; if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k;
    if (S.sec === 's1') S.wh = { k: 1, n: 0, av: 0 }; else if (S.sec === 's2') S.nn = { s: 0, t: 0 };
    sfx.click();
  } else if (act === 'whk') { S.wh.k = +bt.dataset.k; S.wh.n = 0; S.wh.av = 0; sfx.tick(); }
  else if (act === 'whstep') { S.wh.n = Math.min(13, S.wh.n + 1); sfx.tick(); }
  else if (act === 'whreset') { S.wh.n = 0; sfx.click(); }
  else if (act === 'nnext') { S.nn.s = Math.min(3, S.nn.s + 1); sfx.click(); }
  else if (act === 'nreset') { S.nn.s = 0; sfx.click(); }
  else if (act === 'secx') { S.sec = null; sfx.click(); }
  render();
});
askEl.addEventListener('click', (ev) => {
  const bt = ev.target.closest('[data-ans]'); if (!bt) return;
  const r = S.rp, L = ld(r.a, r.b);
  r.ans = bt.dataset.ans; r.ok = (r.ans === 'stop') === (L.rep < 0); (r.ok ? sfx.good : sfx.bad)(); render();
});

// --- one render per change: controls, readout, state card, facts --------------------------------------------------
const stepper = (g, k, label, val) => {
  const [lo, hi] = LIM[g][k], off = g === 'sh' && S.sh.phase === 1;
  return `<div class="fd-stp"><span class="fd-lbl">${esc(label)}</span><div>
    <button class="fd-sb" data-g="${g}" data-d="${k}" data-s="-1" aria-label="−"${val <= lo || off ? ' disabled' : ''}>−</button><b>${val}</b>
    <button class="fd-sb" data-g="${g}" data-d="${k}" data-s="1" aria-label="+"${val >= hi || off ? ' disabled' : ''}>+</button></div></div>`;
};
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  for (const [id, on] of [['fdSh', !sec && v === 'share'], ['fdRp', !sec && v === 'repeat'], ['fdSm', !sec && v === 'same'], ['fdSc', !!sec]]) $(id).style.display = on ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('s1', '🔄') + sc('s2', '♾️');
  askEl.style.display = !sec && v === 'repeat' && S.rp.ans === null ? '' : 'none';
  if (sec) renderSec(t); else if (v === 'share') renderShare(t); else if (v === 'repeat') renderRepeat(t); else renderSame(t);
}

function renderShare(t) {
  const s = S.sh, { a, b } = s, L = ld(a, b), dec = decText(L), xe = a / b;
  lab.setGlow('rgba(255, 111, 159, .22)');
  $('shSteps').innerHTML = stepper('sh', 'a', t.sh.ribbons, a) + stepper('sh', 'b', t.sh.kids, b);
  $('shCut').textContent = s.phase === 2 ? t.again : t.sh.cut; $('shCut').disabled = s.phase === 1 || (s.phase === 0 && s.guess === null);
  $('shZoom').textContent = s.zoom >= 2 ? t.sh.zout : t.sh.zin; $('shZoom').disabled = s.phase !== 2;
  lab.setFacts(t.facts.share);
  if (s.phase === 2) {
    lab.setReadout(`${a} ÷ ${b} = ${dec}`, '', t.sh.names[s.zoom], '#ff6f9f');
    const gap = Math.abs(s.guess - xe);
    const verdict = gap <= 0.05 ? `${t.rt} ${gap < 0.005 ? t.sh.spot : t.sh.near(fnum(gap, 2))}` : `${t.no} ${t.sh.far(fnum(gap, 2))}`;
    lab.setState({ emo: '🎀', title: t.sh.doneT(dec), lead: `${t.sh.doneL(a, b, dec)}. ${verdict}`, body: t.sh.body + (L.rep >= 0 ? ' ' + t.sh.rep : ''), extra: '' });
    setQ(`${a} ÷ ${b} = ${dec}`);
  } else if (s.phase === 1) {
    lab.setReadout(`${a} ÷ ${b} = ?`, '', '', '#ff6f9f');
    lab.setState({ emo: '✂️', title: t.sh.cutting, lead: '', body: '', extra: '' }); setQ('');
  } else {
    lab.setReadout(`${a} ÷ ${b} = ?`, '', '', '#ff6f9f');
    lab.setState({ emo: '🎀', title: t.sh.stT(a, b), lead: t.sh.stL, body: '', extra: '' }); setQ(t.sh.q(a, b));
  }
}

function renderRepeat(t) {
  const r = S.rp, { a, b } = r, L = ld(a, b), N = L.dig.length, ans = r.ans !== null, fin = ans && r.n >= N && r.sub < 0;
  lab.setGlow('rgba(255, 212, 94, .2)');
  $('rpSteps').innerHTML = stepper('rp', 'a', t.rp.top, a) + stepper('rp', 'b', t.rp.bottom, b);
  $('rpTry').textContent = t.rp.try;
  $('rpPre').innerHTML = [[1, 8], [1, 3], [1, 7], [5, 6]].map(([x, y]) => `<button class="chip ${a === x && b === y ? 'on' : ''}" data-act="pre" data-a="${x}" data-b="${y}">${x}/${y}</button>`).join('');
  $('rpStep').textContent = fin ? t.again : t.rp.step; $('rpStep').disabled = !ans || (!fin && (r.sub >= 0 || r.run));
  $('rpRun').textContent = r.run ? t.rp.pause : t.rp.run; $('rpRun').disabled = !ans;
  askEl.innerHTML = `<button class="btn" data-ans="stop">${esc(t.rp.stop)}</button><button class="btn" data-ans="never">${esc(t.rp.never)}</button>`;
  lab.setFacts(ans ? t.facts.repeat : []);
  if (!ans) {
    lab.setReadout('?', `${a} ÷ ${b}`, '', '#ffd45e');
    lab.setState({ emo: '🔁', title: `${a} ÷ ${b}`, lead: t.rp.stL, body: '', extra: '' }); setQ(t.rp.q(a, b));
  } else if (fin) {
    lab.setReadout(ovHTML(L), L.rep >= 0 ? `= ${decText(L)}` : '', L.rep >= 0 ? t.rp.pillRep : t.rp.pillStop, '#ffd45e');
    lab.setState({ emo: '🔁', title: `${a} ÷ ${b} = ${decText(L)}`, lead: `${r.ok ? t.rt : t.no} ${L.rep < 0 ? t.rp.endStop : t.rp.endRep(L.rem[N])}`, body: L.rep >= 0 ? t.rp.endBody : '', extra: '' });
    setQ(t.rp.q(a, b));
  } else {
    const digs = L.dig.slice(0, r.n).join('');
    lab.setReadout(dstr(L.ip, digs, true), `${a} ÷ ${b}`, '', '#ffd45e');
    lab.setState({ emo: r.ok ? '✅' : '🤔', title: r.ok ? t.rt : t.no, lead: t.rp.runL, body: '', extra: '' }); setQ(t.rp.q(a, b));
  }
}

function renderSame(t) {
  const s = S.sm, cardBtn = (cd) => `<button class="chip fd-card ${s.sel && s.sel.t === 'c' && s.sel.id === cd.id ? 'on' : ''}" data-act="card" data-id="${cd.id}">${esc(cardText(cd))}</button>`;
  lab.setGlow('rgba(95, 214, 160, .2)'); lab.setFacts(t.facts.same);
  let html;
  if (!s.rev) {
    const slots = [0, 1, 2].map((i) => { const id = s.order[i]; return id ? `<button class="fd-slot" data-act="unslot" data-i="${i}">${esc(cardText(cardBy(id)))}</button>` : `<div class="fd-slot">${i + 1}</div>`; }).join('');
    html = `<div class="fd-slots">${slots}</div><div class="fd-ends"><span>◀ ${esc(t.sm.small)}</span><span>${esc(t.sm.big)} ▶</span></div>
      <div class="chips">${['g13fr', 'g35dec', 'g30pc'].filter((id) => !s.order.includes(id)).map((id) => cardBtn(cardBy(id))).join('')}</div>
      <div class="row2"><button class="btn" data-act="check"${s.order.length < 3 ? ' disabled' : ''}>${esc(t.sm.check)}</button></div>`;
    lab.setReadout('?', '', '', '#5fd6a0');
    lab.setState({ emo: '🤔', title: t.sm.stT, lead: t.sm.stL, body: '', extra: '' }); setQ(t.sm.q);
  } else {
    const left = TRAY.map(cardBy).filter((cd) => s.placed[cd.id] === undefined), all = left.length === 0;
    html = `<div class="chips">${left.map(cardBtn).join('')}</div><div class="row2"><button class="chip" data-act="smzoom">${s.zoomed ? t.sm.zout : t.sm.zin}</button></div>`;
    let val = '?';
    if (s.sel && s.sel.t === 'g' && ALLC.some((cd) => cd.g === s.sel.k && s.placed[cd.id] !== undefined)) val = forms(s.sel.k);
    else if (s.sel && s.sel.t === 'c') val = `${cardText(cardBy(s.sel.id))} = ?`;
    lab.setReadout(val, '', '', '#5fd6a0');
    if (s.msg) lab.setState({ emo: s.msg.ok ? '✅' : '🤔', title: s.msg.ok ? t.rt : t.no, lead: s.msg.text, body: all ? '' : t.sm.place, extra: '' });
    else if (all) lab.setState({ emo: '🟰', title: t.sm.allT, lead: t.sm.allL, body: '', extra: '' });
    else lab.setState({ emo: s.ok ? '✅' : '🤔', title: s.ok ? t.rt : t.no, lead: t.sm.lead, body: t.sm.place, extra: '' });
    setQ(all ? '' : t.sm.place);
  }
  $('smBody').innerHTML = html;
}

function renderSec(t) {
  const v = lab.view, facts = v === 'repeat' ? (S.rp.ans !== null ? t.facts.repeat : []) : t.facts[v];
  lab.setFacts(facts);
  if (S.sec === 's1') {
    const { k, n } = S.wh, L = ld(k, 7); let digs = ''; for (let i = 0; i < n; i++) digs += L.dig[i % 6];
    lab.setGlow('rgba(93, 184, 255, .22)');
    $('fdSc').innerHTML = `<div class="chips">${[1, 2, 3, 4, 5, 6].map((q) => `<button class="chip ${q === k ? 'on' : ''}" data-act="whk" data-k="${q}">${q}/7</button>`).join('')}</div>
      <div class="row2"><button class="btn" data-act="whstep"${n >= 13 ? ' disabled' : ''}>${esc(t.wh.step)}</button><button class="chip" data-act="whreset">${esc(t.again)}</button><button class="chip push" data-act="secx">${esc(t.back)}</button></div>`;
    lab.setReadout(`${k} ÷ 7 = ${dstr(0, digs, true)}`, '', '', '#5db8ff');
    lab.setState({ emo: '🔄', title: `${k}/7 = ${decText(L)}`, lead: t.wh.lead, body: n >= 6 ? t.wh.body : '', extra: '' });
    setQ(t.secrets.s1[1]);
  } else {
    const st = S.nn.s;
    lab.setGlow('rgba(255, 212, 94, .2)');
    $('fdSc').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn" data-act="nnext"${st >= 3 ? ' disabled' : ''}>${esc(t.next)}</button><button class="chip" data-act="nreset">${esc(t.again)}</button><button class="chip push" data-act="secx">${esc(t.back)}</button></div>`;
    lab.setReadout(t.nn[st][0], '', '', '#ffd45e');
    lab.setState({ emo: '♾️', title: t.nn[st][0], lead: t.nn[st][1], body: '', extra: '' });
    setQ(t.secrets.s2[1]);
  }
}
render();
</script>
</body>
</html>
