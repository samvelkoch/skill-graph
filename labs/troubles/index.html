}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; const v = lab.view;
  if (v === 'throne') drawThrone(c, w, h, dt);
  else if (v === 'famine') drawFamine(c, w, h, dt, time);
  else if (S.sec === 'unity') drawUnity(c, w, h);
  else if (S.sec === 'susanin') drawForest(c, w, h, time);
  else if (S.sub === 'march') drawMap(c, w, h, dt);
  else drawHall(c, w, h);
  if (v === 'throne') { const k = (S.rev1 ? phaseOf(S.y) + Math.floor(S.y) : 'x') + S.playing; if (k !== S.pk) { S.pk = k; render(); } }
  if (v === 'hall' && S.sub === 'march' && !S.sec) { const z = zoneOf() + Math.round(S.p * TOTAL); if (z !== S.pk) { S.pk = z; render(); } }
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-y], [data-g], [data-s], [data-k]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'g1m') { S.g1 = clamp(S.g1 - 1, 0, 12); sfx.tick(); }
  else if (act === 'g1p') { S.g1 = clamp(S.g1 + 1, 0, 12); sfx.tick(); }
  else if (act === 'show1') { S.rev1 = true; S.y = Y0; S.playing = true; S.cur = 'empty0'; S.prev = null; S.slide = 1; sfx.click(); showStage(); }
  else if (act === 'play1') { if (S.playing) S.playing = false; else { if (S.y >= YEND - .01) S.y = Y0; S.playing = true; } sfx.click(); }
  else if (act === 'back1' || act === 'fwd1') { S.playing = false; let i = 0; while (i < PB.length - 2 && S.y >= PB[i + 1]) i++; S.y = clamp((act === 'fwd1' ? PB[i + 1] : S.y - PB[i] > .03 ? PB[i] : PB[Math.max(0, i - 1)]) + .01, Y0, YEND); $('yr').value = S.y; sfx.click(); }
  else if (act === 'show2') { S.rev2 = true; S.yr = 1602; (Math.abs(S.g2 - 300) <= 60 ? sfx.good : sfx.bad)(); showStage(); }
  else if (b.dataset.y) { S.yr = +b.dataset.y; sfx.tick(); }
  else if (b.dataset.s) { S.sub = b.dataset.s; S.sec = null; S.pk = ''; sfx.click(); }
  else if (act === 'next') { const st = [0, F_Y, 1], nx = st.find((x) => x > S.pT + .01); S.pT = nx === undefined ? 0 : nx; sfx.click(); }
  else if (b.dataset.g) { const g = b.dataset.g; if (S.pick.has(g)) S.pick.delete(g); else S.pick.add(g); sfx.tick(); }
  else if (act === 'show3') { S.rev3 = true; const ok = [...REAL].every((g) => S.pick.has(g)); (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (b.dataset.k) {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'yr') { S.y = +ev.target.value; S.playing = false; if (!S.rev1) return; }
  else if (id === 'g2') S.g2 = +ev.target.value;
  else if (id === 'pm') { S.p = S.pT = +ev.target.value / 1000; }
  render();
});

// --- render: controls, readout, state card and facts for the current view ---------------------------------------------
function render() {
  const v = lab.view, t = T[lang];
  $('s1').hidden = v !== 'throne'; $('s2').hidden = v !== 'famine'; $('s3').hidden = v !== 'hall';
  if (v === 'throne') renderThrone(t); else if (v === 'famine') renderFamine(t); else renderHall(t);
}
function renderThrone(t) {
  const a = t.t1, ph = S.rev1 ? phaseOf(S.y) : 'x', n = R.slice(0, 4).filter((r) => S.rev1 && S.y >= r.a).length;
  lab.setGlow('rgba(200, 120, 60, .26)');
  $('q1').textContent = a.q; $('g1v').textContent = S.g1; $('go1').textContent = a.go;
  $('ask1').hidden = S.rev1; $('run1').hidden = !S.rev1;
  $('play1').textContent = S.playing ? a.pause : S.y >= YEND - .01 ? a.again : a.play;
  if (!S.rev1) {
    lab.setReadout('?', '', '', '#e0b34a'); lab.setState({ emo: '🤔', title: a.askT, lead: a.askL, body: a.askB, extra: '' }); lab.setFacts([]); return;
  }
  lab.setReadout(n, a.sub, String(Math.floor(clamp(S.y, Y0, 1613))), '#e0b34a');
  if (ph === 'end') {
    const ok = S.g1 === 4;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? a.right : a.wrong(S.g1), lead: a.endL, body: a.endB, extra: '' }); lab.setFacts(t.facts.throne);
  } else { const c = a.cards[ph]; lab.setState({ emo: c[0], title: c[1], lead: c[2], body: c[3], extra: '' }); lab.setFacts(S.y > R[3].a ? t.facts.throne : []); }
}
function renderFamine(t) {
  const a = t.t2, y = S.yr - 1600;
  lab.setGlow('rgba(150, 170, 90, .22)');
  $('q2').textContent = a.q; $('g2').value = S.g2; $('g2v').textContent = S.g2; $('go2').textContent = a.go;
  $('ask2').hidden = S.rev2;
  $('yrs').innerHTML = a.yrs.map((l, i) => `<button class="chip${y === i ? ' on' : ''}" data-y="${1600 + i}"${i >= 2 && !S.rev2 ? ' disabled' : ''}>${esc(l)}</button>`).join('');
  const vr = $('v2'); vr.hidden = !S.rev2;
  if (S.rev2) { const ok = Math.abs(S.g2 - 300) <= 60; vr.className = `tr-v${ok ? '' : ' no'}`; vr.innerHTML = `<b>${esc(ok ? a.right : a.near(S.g2))}</b> ${esc(a.rl)}`; }
  const vv = a.val[y]; lab.setReadout(vv[0], vv[1], vv[2], '#c9a64a');
  const c = a.cards[y];
  lab.setState({ emo: c[0], title: c[1], lead: c[2], body: y === 1 && !S.rev2 ? a.ask1 : c[3], extra: '' });
  lab.setFacts(S.rev2 ? t.facts.famine : []);
}
function renderHall(t) {
  const a = t.t3, sec = S.sec;
  lab.setGlow('rgba(80, 150, 170, .24)');
  $('subSeg').innerHTML = ['march', 'hall'].map((k) => `<button data-s="${k}" class="${S.sub === k && !sec ? 'on' : ''}">${esc(a[k])}</button>`).join('');
  $('march').hidden = S.sub !== 'march'; $('hallC').hidden = S.sub !== 'hall';
  $('nextB').textContent = a.next; $('pm').value = Math.round(S.p * 1000); $('q3').textContent = a.q; $('go3').textContent = a.go; $('go3').hidden = S.rev3; $('go3').disabled = S.pick.size === 0;
  $('grp').innerHTML = GROUPS.map(([g]) => `<button class="chip${S.pick.has(g) ? ' on' : ''}" data-g="${g}"${S.rev3 ? ' disabled' : ''}>${esc(a.g[g])}</button>`).join('');
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('unity', '📅') + sc('susanin', '🌲');
  if (sec) { const c = t.sec[sec], vl = sec === 'unity' ? t.sec.valU : t.sec.valS; lab.setReadout(vl[0], vl[1], '', '#d6a04a'); lab.setState({ emo: c[0], title: c[1], lead: c[2], body: c[3], extra: '' }); lab.setFacts(t.facts[sec]); return; }
  if (S.sub === 'march') {
    const z = zoneOf(), zi = +z.slice(1), km = Math.round(S.p * TOTAL), c = a.cards[zi];
    lab.setReadout(`${km} ${a.km}`, a.kmSub, a.pills[zi], '#e0b34a'); lab.setState({ emo: c[0], title: c[1], lead: c[2], body: c[3], extra: '' }); lab.setFacts(t.facts.hall.slice(1, 2));
    return;
  }
  if (!S.rev3) {
    lab.setReadout(S.pick.size, a.picked, '', '#e0b34a'); lab.setState({ emo: '🤔', title: a.askT, lead: a.askL, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const ok = [...REAL].every((g) => S.pick.has(g));
  lab.setReadout('5', a.seats, '', '#e0b34a');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? a.right : a.wrong, lead: a.endL, body: a.endB, extra: '' }); lab.setFacts([t.facts.hall[0], t.facts.hall[2]]);
}
render();
</script>
