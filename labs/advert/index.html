const expo = (dt, k) => 1 - Math.exp(-dt * k);

  const tgt = S.sec ? 0 : v === 'build' ? wantBuild() : v === 'turn' ? wantTurn() : 0;

    const sp = S.sp[S.ad], zs = ADS[S.ad].zones, A = T[lang].spot;
    frame(c, () => {
      AD_DRAW[S.ad](c, time, { brand: A.brand, gift: A.gift, run: A.run, hurry: A.hurry, free: A.free, play: A.play, iap: A.iap, crowd: A.crowd });
      zs.forEach((z, i) => {
        const found = sp.found.includes(i), shown = sp.shown && !found;
        if (!found && !shown) return;
        const k = found ? ease((time - (sp.at[i] ?? time)) / 0.35) : 1, pulse = 1 + 0.04 * Math.sin(time * 4 + i);
        c.save(); c.setLineDash(found ? [] : [6, 5]); c.lineWidth = 3.5; c.strokeStyle = found ? '#3ddc97' : '#f5c84c';
        circ(c, z.x, z.y, z.r * 0.86 * k * pulse); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 5; c.stroke(); c.restore();
        const nm = A.t[z.k][0], up = z.y - z.r * 0.86 - 14 > 22;
        c.save(); c.globalAlpha = k; pill(c, `${TEMO[z.k]} ${nm}`, z.x, up ? z.y - z.r * 0.86 - 14 : z.y + z.r * 0.86 + 14, { minX: 0, maxX: PW, minY: 2, maxY: PH - 2, bg: found ? 'rgba(10,60,40,.9)' : 'rgba(70,50,0,.9)' }); c.restore();
      });
      if (sp.miss && time - sp.miss.t < 0.8) { const a = 1 - (time - sp.miss.t) / 0.8; c.save(); c.globalAlpha = a; c.strokeStyle = '#fff'; c.lineWidth = 3; c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 4; const { x, y } = sp.miss; c.beginPath(); c.moveTo(x - 7, y - 7); c.lineTo(x + 7, y + 7); c.moveTo(x + 7, y - 7); c.lineTo(x - 7, y + 7); c.stroke(); c.restore(); }
    });
    // the three tricks of this ad as slots
    zs.forEach((z, i) => {
      const cy = 76 + i * 72, found = sp.found.includes(i), shown = sp.shown && !found;
      circ(c, 290, cy, 25); c.fillStyle = found ? rgr(c, 284, cy - 6, 2, 28, [[0, '#7dffbf'], [1, '#169e66']]) : 'rgba(20,24,40,.85)'; c.fill();
      c.lineWidth = 2; c.strokeStyle = found ? '#0b5c3b' : shown ? '#f5c84c' : 'rgba(130,145,190,.5)'; c.setLineDash(found ? [] : [4, 4]); c.stroke(); c.setLineDash([]);
      c.textAlign = 'center'; c.textBaseline = 'middle';
      if (found || shown) { c.globalAlpha = 1; c.fillStyle = '#fff'; c.font = '22px Nunito, sans-serif'; c.fillText(TEMO[z.k], 290, cy + 1); }
      else { c.fillStyle = '#98A0B8'; c.font = '900 22px Nunito, sans-serif'; c.fillText('?', 290, cy + 1); }
    });
  }
  c.restore();
});

// tapping tricks on the ad
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'spot' || S.sec) return;
  const sp = S.sp[S.ad];
  if (sp.g === null || sp.shown || sp.found.length >= 3) return;
  const r = $('cv').getBoundingClientRect();
  const lx = (ev.clientX - r.left - G.ox) / G.s - FX, ly = (ev.clientY - r.top - G.oy) / G.s - FY;
  if (lx < 0 || ly < 0 || lx > PW || ly > PH) return;
  let best = -1, bd = 9;
  ADS[S.ad].zones.forEach((z, i) => { if (sp.found.includes(i)) return; const d = Math.hypot(lx - z.x, ly - z.y) / z.r; if (d <= 1 && d < bd) { bd = d; best = i; } });
  if (best >= 0) { sp.found.push(best); sp.at[best] = now(); sfx.good(); }
  else { sp.miss = { x: lx, y: ly, t: now() }; sfx.tick(); }
  render();
  if (best >= 0 && sp.found.length >= 3) showStage();
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const wantBuild = () => 0.05 + S.tr.reduce((a, on, i) => a + on * WEIGHT[i], 0);
const wantTurn = () => (S.honest ? 0.04 : 0.1 + S.pick.reduce((a, i) => a + TW[i], 0));
const popcount = (n) => n.toString(2).replace(/0/g, '').length;
let revealTimer = 0;
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'tr') { S.tr[i] = S.tr[i] ? 0 : 1; S.flipped |= 1 << i; S.last = i; sfx.click(); }
  else if (act === 'guess') {
    if (S.guess !== null) return;
    S.guess = i; S.zoomOn = true; (i === T[lang].build.ok ? sfx.good : sfx.bad)(); showStage();
    clearTimeout(revealTimer);
    revealTimer = setTimeout(() => { S.zoomOn = false; S.revealed = true; S.real = true; render(); showStage(); }, 2400);
  } else if (act === 'real') { S.real = !S.real; sfx.click(); }
  else if (act === 'again') { clearTimeout(revealTimer); S.guess = null; S.zoomOn = false; S.revealed = false; S.real = false; sfx.click(); }
  else if (act === 'ad') { S.ad = i; sfx.click(); }
  else if (act === 'sg') { const sp = S.sp[S.ad]; if (sp.g === null) { sp.g = i; sfx.click(); } }
  else if (act === 'show') { S.sp[S.ad].shown = true; sfx.click(); showStage(); }
  else if (act === 'next') { S.ad = (S.ad + 1) % 3; sfx.click(); }
  else if (act === 'again2') { S.sp = [0, 1, 2].map(() => ({ g: null, found: [], shown: false, at: {}, miss: null })); S.ad = 0; sfx.click(); }
  else if (act === 'obj') { S.obj = i; sfx.click(); }
  else if (act === 'pick') {
    if (S.honest) S.honest = false;
    if (S.pick.includes(i)) S.pick = S.pick.filter((k) => k !== i);
    else if (S.pick.length < 3) S.pick = [...S.pick, i]; else { sfx.bad(); return; }
    S.last = i; sfx.click();
  } else if (act === 'honest') { S.honest = !S.honest; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; if (k === 'thirty' && S.sec) S.t30 = null; sfx.click();
  } else if (act === 'play30') { S.t30 = now(); sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => { if (ev.target.id === 'foodR') { S.food = +ev.target.value; render(); } });

// --- one render per change: controls, readout and the state card -----------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  const secOn = !!S.sec;
  $('secBuild').style.display = !secOn && v === 'build' ? '' : 'none';
  $('secSpot').style.display = !secOn && v === 'spot' ? '' : 'none';
  $('secTurn').style.display = !secOn && v === 'turn' ? '' : 'none';
  $('secSec').style.display = secOn ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('food', '🍔') + sc('thirty', '⏱️');
  lab.setFacts(t.facts[['build', 'spot', 'turn'].indexOf(v)]);
  if (secOn) return renderSecret(t);
  if (v === 'build') renderBuild(t); else if (v === 'spot') renderSpot(t); else renderTurn(t);
}
function renderSecret(t) {
  if (S.sec === 'food') {
    const f = t.food;
    $('secSec').innerHTML = `<div class="ad-q" style="margin-top:0"><div class="qt">${esc(f.slide)}</div><input id="foodR" class="ad-range" type="range" min="0" max="100" value="${S.food}" aria-label="${esc(f.slide)}"></div>`;
    lab.setReadout('🍔', f.adv + ' / ' + f.box, '', '#f5a04a');
    lab.setState({ emo: '🍔', title: f.title, lead: f.lead, body: f.body, extra: '' });
  } else {
    const h = t.th;
    $('secSec').innerHTML = `<div class="ad-q" style="margin-top:0"><button class="btn" data-act="play30">${esc(h.go)}</button></div>`;
    lab.setReadout('12', h.ad, '', '#ff6a5e');
    lab.setState({ emo: '⏱️', title: h.title, lead: h.lead, body: h.body, extra: '' });
  }
}
function renderBuild(t) {
  const b = t.build, n = S.tr.filter(Boolean).length, flips = popcount(S.flipped), pct = Math.round(wantBuild() * 100);
  let html = `<div class="ad-sw">${t.tricks.map((tk, i) => `<button class="${S.tr[i] ? 'on' : ''}" data-act="tr" data-i="${i}" aria-pressed="${!!S.tr[i]}"><span>${tk.emo}</span><span>${esc(tk.name)}</span><span class="kn"></span></button>`).join('')}</div>`;
  if (S.guess === null) {
    html += flips < 3 ? `<div class="ad-q"><div class="qt mut">${esc(b.ask0)}</div></div>`
      : `<div class="ad-q"><div class="qt">${esc(b.q)}</div><div class="chips">${b.opts.map((o, i) => `<button class="chip" data-act="guess" data-i="${i}">${esc(o)}</button>`).join('')}</div></div>`;
  } else {
    html += `<div class="ad-q"><div class="qt">${esc(b.q)}</div><div class="chips">${b.opts.map((o, i) => `<button class="chip ${i === S.guess ? 'on' : ''}" disabled>${esc(o)}</button>`).join('')}</div>`;
    if (S.revealed) html += `<div class="row2"><button class="btn" data-act="real">${esc(S.real ? b.poster : b.real)}</button><button class="chip" data-act="again">${esc(b.again)}</button></div>`;
    html += '</div>';
  }
  $('secBuild').innerHTML = html;
  lab.setReadout(`${pct}%`, t.meter, S.revealed ? b.size : b.onN(n), '#ff6a5e');
  if (S.revealed) lab.setState({ emo: S.guess === b.ok ? '✅' : '🤔', title: S.guess === b.ok ? b.yes : b.no, lead: b.rvLead, body: b.rvBody + ' ' + t.tricks[0].tipR, extra: '' });
  else if (S.guess !== null) lab.setState({ emo: '👀', title: b.look, lead: b.lookLead, body: '', extra: '' });
  else if (S.last !== null) { const tk = t.tricks[S.last]; lab.setState({ emo: tk.emo, title: tk.name, lead: tk.tip, body: '', extra: '' }); }
  else lab.setState({ emo: '📣', title: b.title, lead: b.lead, body: '', extra: '' });
}
function renderSpot(t) {
  const A = t.spot, sp = S.sp[S.ad], total = S.sp.reduce((a, x) => a + x.found.length, 0), done = sp.found.length >= 3 || sp.shown;
  let html = `<div class="chips">${A.ads.map((nm, i) => `<button class="chip ${i === S.ad ? 'on' : ''}" data-act="ad" data-i="${i}">${esc(nm)}${S.sp[i].found.length >= 3 ? ' ✓' : ''}</button>`).join('')}</div>`;
  if (sp.g === null) html += `<div class="ad-q"><div class="qt">${esc(A.q)}</div><div class="chips">${[1, 2, 3, 4, 5].map((k) => `<button class="chip" data-act="sg" data-i="${k}" style="min-width:44px;justify-content:center">${k}</button>`).join('')}</div></div>`;
  else {
    html += `<div class="ad-q"><div class="qt mut">${esc(done ? '' : A.tap)}</div><div class="row2" style="margin-top:0">`;
    if (!done) html += `<button class="chip" data-act="show">${esc(A.show)}</button>`;
    else html += `<button class="btn" data-act="${S.sp.every((x) => x.found.length >= 3 || x.shown) ? 'again2' : 'next'}">${esc(S.sp.every((x) => x.found.length >= 3 || x.shown) ? A.again : A.next)}</button>`;
    html += '</div></div>';
  }
  $('secSpot').innerHTML = html;
  lab.setReadout(`${total} / 9`, A.found, sp.g === null ? '' : A.of(sp.found.length), '#3ddc97');
  const last = sp.found.length ? ADS[S.ad].zones[sp.found[sp.found.length - 1]].k : null;
  const allDone = S.sp.every((x) => x.found.length >= 3 || x.shown);
  if (sp.g === null) lab.setState({ emo: '🔎', title: A.title, lead: A.lead, body: A.q, extra: '' });
  else if (done) lab.setState({ emo: sp.g === 3 ? '✅' : '🤔', title: sp.g === 3 ? A.yes : A.no, lead: sp.g === 3 ? A.sumYes : A.sumNo(sp.g), body: allDone ? `${A.allEnd(total)} ${A.allLead}` : '', extra: '' });
  else if (last) lab.setState({ emo: TEMO[last], title: A.t[last][0], lead: A.t[last][1], body: '', extra: '' });
  else lab.setState({ emo: '👆', title: A.tap, lead: A.lead, body: '', extra: '' });
}
function renderTurn(t) {
  const U2 = t.turn, k = S.pick.length, pct = Math.round(wantTurn() * 100);
  $('secTurn').innerHTML = `<div class="chips">${U2.objs.map((o, i) => `<button class="chip ${i === S.obj ? 'on' : ''}" data-act="obj" data-i="${i}">${esc(o)}</button>`).join('')}</div>
    <div class="ad-rowlbl">${esc(U2.n(k))}</div>
    <div class="ad-sw">${U2.tricks.map((nm, i) => `<button class="${S.pick.includes(i) && !S.honest ? 'on' : ''}" data-act="pick" data-i="${i}"><span>${U2.tEmo[i]}</span><span>${esc(nm)}</span><span class="kn"></span></button>`).join('')}</div>
    <div class="row2"><button class="chip ${S.honest ? 'on' : ''}" data-act="honest">🧾 ${esc(U2.honest)}</button></div>`;
  lab.setReadout(`${pct}%`, t.meter, U2.n(k), '#ff6a5e');
  const mood = pct < 25 ? [U2.s0, U2.st0] : pct < 65 ? [U2.s1, U2.st1] : [U2.s2, U2.st2];
  if (S.honest) lab.setState({ emo: '🧾', title: U2.honest, lead: U2.honLead, body: U2.honBody, extra: '' });
  else lab.setState({ emo: k ? '🛍️' : '🎬', title: k ? mood[1] : U2.title, lead: k ? mood[0] : U2.lead, body: k ? U2.pickLead : '', extra: '' });
}
render();
</script>
