function box(c, r, DW, DH, fn) {

function zigRange(c, xa, xb, y, amp, step, a, col, lw = 2.4) {

  c.beginPath(); c.moveTo(xa, y); let i = 0;

  c.lineTo(xb, y); c.stroke(); c.restore();
}
function waveRange(c, xa, xb, y, amp, a, col, time, dir = 1, lw = 2.4) {
  if (a < 0.02 || xb <= xa) return;

  for (let x = xa; x <= xb; x += 2) { const yy = y + amp * Math.sin((x - dir * time * 45) * 0.52); x === xa ? c.moveTo(x, yy) : c.lineTo(x, yy); }

}
function head(c, x, y, dirx, diry, size, col, a) {
  c.save(); c.globalAlpha = a; c.fillStyle = col; c.translate(x, y); c.rotate(Math.atan2(diry, dirx));
  c.beginPath(); c.moveTo(0, 0); c.lineTo(-size, -size * 0.6); c.lineTo(-size, size * 0.6); c.closePath(); c.fill(); c.restore();
}
function curlArrow(c, x0, y0, len, a, time, col1, col2, flip = 1) { // a rising trochoid with an arrow head
  if (a < 0.02) return;
  c.save(); c.globalAlpha = a; c.lineWidth = 2.6; c.lineCap = 'round'; c.lineJoin = 'round';
  const N = 36, pts = [];

  const w = t.w, i = S.sc, sc = w.sc[i], g = S.g[i], right = i === 2 ? 1 : 0, vac = S.vac[i];
  lab.setGlow(['rgba(255, 140, 60, .26)', 'rgba(106, 183, 255, .26)', 'rgba(255, 90, 77, .26)'][i]);
  $('wSc').innerHTML = w.sc.map((s, j) => `<button type="button" class="chip${j === i ? ' on' : ''}" data-act="sc" data-k="${j}">${S.g[j] === null ? '' : S.g[j] === (j === 2 ? 1 : 0) ? '✓ ' : '✗ '}${esc(s.n)}</button>`).join('');
  $('wQ').innerHTML = g === null
    ? `<p class="th-q" style="margin-top:12px">${esc(w.q)}</p><div class="th-opts"><button type="button" class="th-opt" data-act="gw" data-k="y">${esc(w.yes)}</button><button type="button" class="th-opt" data-act="gw" data-k="n">${esc(w.no)}</button></div>`
    : `<p class="th-q" style="margin-top:12px">${esc(w.q)}</p><div class="th-opts"><button type="button" class="th-opt ${right === 1 ? 'good' : g === 1 ? 'bad' : 'dim'}" disabled>${esc(w.yes)}</button><button type="button" class="th-opt ${right === 0 ? 'good' : g === 0 ? 'bad' : 'dim'}" disabled>${esc(w.no)}</button></div>
       <div class="th-row"><button type="button" class="btn ghost" data-act="vac">${esc(vac ? sc.off : sc.on)}</button></div>`;
  lab.setReadout(['🥄', '🍵', '🔥'][i], sc.kind, g === null ? '' : vac ? w.pillOn : w.pillOff, ['#ff9a3d', '#6ab7ff', '#ff5a4d'][i]);
  if (g === null) lab.setState({ emo: ['🥄', '🍵', '🔥'][i], title: sc.t, lead: sc.set, body: '', extra: '' });
  else if (vac) lab.setState({ emo: g === right ? '✅' : '🤔', title: `${g === right ? t.ok : t.no} ${sc.r[0]}`, lead: sc.r[1], body: '', extra: '' });
  else lab.setState({ emo: ['🥄', '🍵', '🔥'][i], title: sc.t, lead: sc.norm, body: '', extra: '' });
  const fx = [t.facts.foil]; if (S.g[2] !== null) fx.push(t.facts.sun);
  lab.setFacts(fx);
}

function renderHouse(t) {
  const h = t.h, m = houseModel(), asked = S.g3 !== null, right = ans3();
  lab.setGlow(S.cam ? 'rgba(255, 130, 60, .28)' : 'rgba(95, 140, 230, .26)');
  const d = fmt(tsurf(UW.double)), s = fmt(tsurf(UW.single));
  $('hQ').innerHTML = !asked
    ? `<div class="th-k">${esc(h.k)}</div><p class="th-q">${esc(h.q)}</p>${optsHtml('g3', ['c', 'w', 's'], h.o, null)}`
    : `<p class="th-q">${esc(h.q)}</p>${optsHtml('g3', ['c', 'w', 's'], h.o, S.g3, right)}`;
  $('hTog').hidden = !asked;
  $('hTog').innerHTML = `<button type="button" class="chip${S.cam ? ' on' : ''}" data-act="cam">${esc(h.cam)}</button>
    <button type="button" class="chip${S.win[0] ? ' on' : ''}" data-act="win" data-k="0">${esc(h.winL(S.win[0]))}</button>
    <button type="button" class="chip${S.win[1] ? ' on' : ''}" data-act="win" data-k="1">${esc(h.winR(S.win[1]))}</button>
    <button type="button" class="chip${S.loft ? ' on' : ''}" data-act="loft">${esc(h.loft)}</button>
    <button type="button" class="chip${S.curt ? ' on' : ''}" data-act="curt">${esc(h.curt)}</button>`;
  $('hLeg').hidden = !asked;
  $('hLeg').innerHTML = (S.cam ? `<span>${esc(h.cold)} <i class="th-strip"></i> ${esc(h.warm)}</span>` : '') + Object.keys(m.parts).map((k) => `<span><i class="th-dot" style="background:${PCOL[k]}"></i>${esc(h.parts[k])} ${Math.round(m.parts[k] / m.base * 100)}%</span>`).join('');
  $('hFine').textContent = h.fine; $('hFine').hidden = !asked;
  if (!asked) {
    lab.setReadout('?', '', '', '#5f8fd0');
    lab.setState({ emo: '🪟', title: h.ask[0], lead: h.ask[1], body: '', extra: '' });
    lab.setFacts([]); return;
  }
  lab.setReadout(`${m.pct}%`, h.sub, h.pill, S.cam ? '#ff9a3d' : '#5f8fd0');
  // the verdict stays until the child changes something
  const fresh = !S.loft && !S.curt && S.win[0] === 0 && S.win[1] === 1;
  if (fresh) { const [a, b] = h.rev(S.g3 === right ? t.ok : t.no, d, s); lab.setState({ emo: S.g3 === right ? '✅' : '🤔', title: a, lead: b, body: '', extra: '' }); }
  else lab.setState({ emo: '🏠', title: h.free(h.parts[m.top]), lead: h.freeLead, body: '', extra: '' });
  lab.setFacts(t.facts.house);
}
render();
</script>
