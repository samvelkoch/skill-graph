// --- helpers -------------------------------------------------------------------------------------------------
const TAU = Math.PI * 2;
const MUM = '#5B8DEF', DAD = '#FF9F5A', INH = '#9B7BE0', TEAL = '#4CC3B5', GOLD = '#f5c84c';
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const easeInOut = (t) => { t = clamp01(t); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);
const backOut = (t) => { t = clamp01(t); const k = 1.70158; return 1 + (k + 1) * Math.pow(t - 1, 3) + k * Math.pow(t - 1, 2); };
const mulberry = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
const nowS = () => performance.now() / 1000;
let CW = 400, CH = 400; // canvas size of the current frame

// a dark rounded label that stays inside the canvas
function pill(c, text, x, y, o = {}) {
  c.save();
  c.font = o.font || '800 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const hh = o.h ?? 24, w = c.measureText(text).width + (o.padX ?? 10) * 2, px = clamp(x, w / 2 + 4, Math.max(w / 2 + 4, CW - w / 2 - 4));
  c.globalAlpha = o.alpha ?? 1;
  c.fillStyle = o.bg || 'rgba(10,14,30,.82)'; c.beginPath(); c.roundRect(px - w / 2, y - hh / 2, w, hh, hh / 2); c.fill();
  if (o.stroke) { c.lineWidth = 1.5; c.strokeStyle = o.stroke; c.stroke(); }
  c.fillStyle = o.fg || '#fff'; c.fillText(text, px, y + 1);
  c.restore();
}
function burst(c, x, y, r, p, color = GOLD) { // a ring of little rays that fades
  if (p <= 0 || p >= 1) return;
  c.save(); c.globalAlpha = 1 - p; c.strokeStyle = color; c.lineWidth = 3; c.lineCap = 'round';
  for (let k = 0; k < 8; k++) {
    const a = k * TAU / 8, r0 = r * (0.5 + 0.8 * easeOut(p)), r1 = r0 + r * 0.35;
    c.beginPath(); c.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); c.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); c.stroke();
  }
  c.restore();
}

// --- the scenery: night sky and a grassy hill ----------------------------------------------------------------
function sky(c, w, h) {
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#1D2547'); g.addColorStop(1, '#2B3668');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.save();
  for (let i = 0; i < 26; i++) {
    const x = hash(i + 1) * w, y = hash(i + 50) * h * 0.3, tw = 0.5 + 0.5 * Math.sin(nowS() * 1.5 + i * 2.1);
    c.globalAlpha = 0.25 + 0.4 * tw; c.fillStyle = '#E8ECFF'; c.beginPath(); c.arc(x, y, 0.8 + hash(i + 90) * 1.1, 0, TAU); c.fill();
  }
  c.restore();
}
function hill(c, w, h, top = 0.2) {
  c.save();
  const ry = h * 0.58, cy = h * top + ry, g = c.createRadialGradient(w * 0.5, cy - ry * 0.9, 10, w * 0.5, cy, ry * 1.1);
  g.addColorStop(0, '#9EDD7C'); g.addColorStop(0.55, '#8CCB6A'); g.addColorStop(1, '#5E9E47');
  c.fillStyle = g; c.beginPath(); c.ellipse(w * 0.5, cy, w * 0.66, ry, 0, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 2; c.beginPath(); c.ellipse(w * 0.5, cy, w * 0.66 - 1, ry - 1, 0, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
  // tufts and tiny flowers, in fixed places
  for (let i = 0; i < 46; i++) {
    const x = hash(i * 3 + 7) * w, y = h * top + 18 + hash(i * 5 + 3) * (h * (1 - top) - 26);
    const dx = (x - w * 0.5) / (w * 0.66), edge = cy - ry * Math.sqrt(Math.max(0, 1 - dx * dx));
    if (y < edge + 10) continue;
    if (i % 5 === 0) { c.fillStyle = i % 10 === 0 ? '#FFF1B8' : '#FFD0D8'; c.beginPath(); c.arc(x, y, 2.2, 0, TAU); c.fill(); continue; }
    c.strokeStyle = '#6FB352'; c.lineWidth = 1.6; c.lineCap = 'round'; c.beginPath();
    c.moveTo(x - 4, y); c.lineTo(x - 5.5, y - 6); c.moveTo(x, y); c.lineTo(x, y - 8); c.moveTo(x + 4, y); c.lineTo(x + 5.5, y - 6); c.stroke();
  }
  c.restore();
}

function genGarden(seed, forced) {

  for (const sd of [-1, 1]) {
    c.beginPath(); c.ellipse(sd * 13, -195, 6.5, 7.5, 0, 0, TAU); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 1.4; c.stroke();
    c.beginPath(); c.arc(sd * 13 + 1, -195, 4.2, 0, TAU); c.fillStyle = '#2A1B14'; c.fill();
    c.beginPath(); c.arc(sd * 13 + 2.4, -197, 1.6, 0, TAU); c.fillStyle = '#fff'; c.fill();
    c.beginPath(); c.arc(sd * 23, -184, 6, 0, TAU); c.fillStyle = 'rgba(255,120,140,.3)'; c.fill();
  }
  c.beginPath(); c.arc(0, -186, 10, Math.PI * 0.15, Math.PI * 0.85); c.lineWidth = 2.2; c.strokeStyle = '#2A1B14'; c.stroke();
  c.strokeStyle = '#2A2250'; c.lineWidth = 2.2;
  // hair in front: a bob with a fringe, or a short spiky cut
  c.fillStyle = hairG;
  if (!o.cut) {
    c.beginPath(); c.ellipse(0, -210, 38, 26, 0, Math.PI, TAU); c.quadraticCurveTo(12, -198, -6, -210); c.quadraticCurveTo(-22, -200, -38, -210); c.closePath(); c.fill(); c.stroke();
  } else {
    c.beginPath(); c.ellipse(0, -212, 37, 24, 0, Math.PI, TAU); c.quadraticCurveTo(24, -206, 14, -214); c.quadraticCurveTo(0, -200, -14, -214); c.quadraticCurveTo(-24, -206, -37, -212); c.closePath(); c.fill(); c.stroke();
    const topY = (xx) => -212 - 24 * Math.sqrt(Math.max(0, 1 - (xx / 37) ** 2)) + 5;
    for (let q = -2; q <= 2; q++) { const x0 = q * 13; c.beginPath(); c.moveTo(x0 - 8, topY(x0 - 8)); c.lineTo(x0, topY(x0) - 17); c.lineTo(x0 + 8, topY(x0 + 8)); c.closePath(); c.fill(); c.stroke(); }
  }
  if (o.hat > 0) { // sunhat dropping on
    const dy = (1 - backOut(o.hat)) * -70;
    c.save(); c.translate(0, dy); c.globalAlpha = clamp01(o.hat * 3);
    const bg = c.createLinearGradient(0, -240, 0, -214); bg.addColorStop(0, '#FBE7A8'); bg.addColorStop(1, '#E3C070');
    c.beginPath(); c.ellipse(0, -222, 56, 12, 0, 0, TAU); c.fillStyle = bg; c.fill(); c.strokeStyle = '#B8923F'; c.stroke();
    c.beginPath(); c.ellipse(0, -224, 31, 25, 0, Math.PI, TAU); c.closePath(); c.fillStyle = bg; c.fill(); c.stroke();
    c.beginPath(); c.roundRect(-31, -230, 62, 9, 3); c.fillStyle = DAD; c.fill(); c.strokeStyle = '#B8662A'; c.lineWidth = 1.5; c.stroke();
    c.restore();
  }
  c.restore();
}
function drawTwins(c, w, h, time) {
  sky(c, w, h); hill(c, w, h, 0.34);
  const s = Math.min((h - 44) / 258, w * 0.4 / 112), fy = h - 26, xs = [w * 0.3, w * 0.7];
  const lu = S.twins ? time - S.twinsT0 : -1;
  const hatP = lu < 0 ? 0 : clamp01(lu / 0.8), tanP = lu < 0 ? 0 : easeInOut((lu - 0.6) / 1), cut = lu > 1.8, plP = lu > 2.6 ? backOut((lu - 2.6) / 0.35) : 0;
  xs.forEach((x, n) => {
    c.save(); c.translate(x, fy); c.scale(1, 0.15); const sg = c.createRadialGradient(0, 0, 0, 0, 0, 70 * s); sg.addColorStop(0, 'rgba(10,25,10,.5)'); sg.addColorStop(1, 'rgba(10,25,10,0)'); c.fillStyle = sg; c.beginPath(); c.arc(0, 0, 70 * s, 0, TAU); c.fill(); c.restore();
    drawKid(c, x, fy, s, { t: time, phase: n * 1.4, tan: n === 0 ? tanP : 0, hat: n === 0 ? hatP : 0, cut: n === 1 && cut, plaster: n === 1 ? plP : 0 });
  });
  pill(c, lu > 2.8 ? '≠' : '=', w / 2, fy - 130 * s, { bg: GOLD, fg: '#1D2547', h: 34, padX: 14, font: '900 22px Nunito, sans-serif' });
  if (lu >= 0) {
    burst(c, xs[0], fy - 222 * s, 50 * s, (lu - 0.7) / 0.6);
    burst(c, xs[1], fy - 214 * s, 50 * s, (lu - 1.8) / 0.6);
    burst(c, xs[1] + 14 * s, fy - 48 * s, 26 * s, (lu - 2.6) / 0.6);
  }
}

// --- the frame ---------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  c.save(); c.beginPath(); c.roundRect(0, 0, w, h, 20); c.clip();
  const v = lab.view;
  if (v === 'pups') { if (S.sec === 'peas') drawPeas(c, w, h, time); else if (S.sec === 'twins') drawTwins(c, w, h, time); else { sky(c, w, h); drawPups(c, w, h, time); } }
  else if (v === 'seeds') drawSeeds(c, w, h, time);
  else drawLife(c, w, h, time);
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function onView(v) {
  S.sec = null;
  if (v === 'life' && !S.life.ans) S.life.t0 = nowS();
  render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.secT0 = nowS(); S.twins = false; sfx.click();
  } else if (act === 'life') { S.twins = true; S.twinsT0 = nowS(); sfx.good(); }
  else if (act === 'pick') pick(v, +b.dataset.i);
  else if (act === 'next') next(v);
  else if (act === 'again') again(v);
  render();
});
function pick(v, i) {
  const now = nowS();
  if (v === 'pups') {
    const P = S.pups; if (P.ans) return;
    P.ans = true; P.sel = i;
    if (P.step === 0) { P.shown = true; P.t0 = now; P.litterDone = false; }
    else { P.pair = mostSimilar(P.litter); P.pairT0 = now; P.pairDone = false; }
    (i === 1 ? sfx.good : sfx.bad)();
  } else if (v === 'seeds') {
    const D = S.seeds; if (D.ans) return;
    D.ans = true; D.sel = i;
    if (D.step === 0) { D.t0 = now; D.done = false; } else { D.q2T0 = now; D.q2Done = false; }
    (i === 1 ? sfx.good : sfx.bad)();
  } else {
    const Lf = S.life; if (Lf.ans) return;
    Lf.ans = true; Lf.sel = i; Lf.tFly = now; Lf.landed = false;
    const ok = (i === 0) === LIFE[Lf.i][1]; Lf.right[Lf.i] = ok; (ok ? sfx.good : sfx.bad)();
  }
  showStage();
}
function next(v) {
  sfx.click();
  if (v === 'pups') { const P = S.pups; P.step++; P.ans = false; P.sel = null; if (P.step >= 2) P.pair = null; }
  else if (v === 'seeds') { const D = S.seeds; D.step++; D.ans = false; D.sel = null; }
  else { const Lf = S.life; Lf.i++; Lf.ans = false; Lf.sel = null; Lf.landed = false; Lf.t0 = nowS(); }
}
function again(v) {
  sfx.click();
  if (v === 'pups') { const P = S.pups; P.seed = Math.floor(Math.random() * 1e9); P.litter = makeLitter(P.seed); P.t0 = nowS(); P.litterDone = false; }
  else if (v === 'seeds') { const D = S.seeds; D.garden = genGarden(Math.floor(Math.random() * 1e6) + 20, false); D.t0 = nowS(); D.done = false; D.q2T0 = 0; }
  else { S.life = { i: 0, ans: false, sel: null, t0: nowS(), tFly: 0, landed: false, right: [], basket: { inh: [], life: [] }, hit: null, tLand: 0 }; }
}

// --- one render per change: controls, readout and the state card ----------------------------------------------
function card(k, full, extra = '') {
  const [emo, title, lead, body] = CARDS[k][full ? 'f' : 'n'][lang];
  lab.setState({ emo, title, lead, body, extra });
}
function qa(o) {
  const t = T[lang];
  let h = `<div class="qt">${esc(o.q)}</div><div class="ans ${o.cls || ''}">` + o.opts.map((txt, i) => {
    let k = o.kinds?.[i] || '';
    if (o.ans) k += i === o.ok ? ' good' : i === o.sel ? ' bad' : '';
    return `<button class="ab ${k}" data-act="pick" data-i="${i}"${o.ans ? ' disabled' : ''}>${esc(txt)}</button>`;
  }).join('') + '</div>';
  if (o.ans) h += `<div class="vd ${o.sel === o.ok ? 'ok' : 'no'}">${esc(o.sel === o.ok ? t.right : t.wrong)}</div>`;
  if (o.ans && o.done) h += `<div class="vt">${esc(o.text)}</div>`;
  if (o.ans && o.done && o.next) h += `<div class="row2" style="margin-top:6px"><button class="btn" data-act="next">${esc(t.next)}</button></div>`;
  return h;
}
function renderChips(t) {
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('peas', '🫛') + sc('twins', '👯');
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secRow').style.display = v === 'pups' ? '' : 'none';
  $('secArea').innerHTML = '';
  $('qArea').style.display = '';
  if (v === 'pups') renderPups(t); else if (v === 'seeds') renderSeeds(t); else renderLife(t);
}
function renderPups(t) {
  const P = S.pups, p = t.p;
  lab.setGlow('rgba(91, 141, 239, .28)');
  renderChips(t);
  if (S.sec) {
    const k = S.sec, emo = k === 'peas' ? '🫛' : '👯';
    $('qArea').style.display = 'none';
    if (k === 'twins') $('secArea').innerHTML = `<button class="btn" data-act="life"${S.twins ? ' disabled' : ''}>${esc(t.sec.life)}</button>`;
    lab.setReadout(emo, t.secrets[k][0], '', k === 'peas' ? '#8CCB6A' : INH);
    lab.setState({ emo, title: t.secrets[k][0], lead: t.sec[k === 'peas' ? 'peasText' : 'twinsText'], body: '', extra: '' });
    return;
  }
  const doneNow = P.step === 0 ? P.litterDone : P.step === 1 ? P.pairDone : true;
  let h = '';
  if (P.step === 0) h = qa({ q: p.q1, opts: p.o1, ok: 1, sel: P.sel, ans: P.ans, done: doneNow, text: p.r1, next: true });
  else if (P.step === 1) h = qa({ q: p.q2, opts: p.o2, ok: 1, sel: P.sel, ans: P.ans, done: doneNow, text: p.r2, next: true });
  else h = `<button class="btn" data-act="again">${esc(p.again)}</button>`;
  if (P.shown) h += `<div><span class="lg"><i style="background:${MUM}"></i>${esc(p.mum)}</span><span class="lg"><i style="background:${DAD}"></i>${esc(p.dad)}</span></div>`;
  $('qArea').innerHTML = h;
  if (P.shown && P.litterDone) { const [m, d] = countsOf(P.litter); lab.setReadout(`<span style="font-size:19px">${esc(p.count(m, d))}</span>`, '', '', MUM); }
  else lab.setReadout('?', '', '', MUM);
  card('pups', P.ans || P.step >= 1, `<div class="fine">${esc(t.fine)}</div>`);
}
function renderSeeds(t) {
  const D = S.seeds, s = t.s;
  lab.setGlow('rgba(255, 159, 90, .26)');
  const doneNow = D.step === 0 ? D.done : D.q2Done;
  if (D.step === 0) $('qArea').innerHTML = qa({ q: s.q, opts: s.o, ok: 1, sel: D.sel, ans: D.ans, done: doneNow, text: s.r, next: true });
  else if (D.step === 1) $('qArea').innerHTML = qa({ q: s.q2, opts: s.o2, ok: 1, sel: D.sel, ans: D.ans, done: doneNow, text: s.r2, next: true });
  else $('qArea').innerHTML = `<button class="btn" data-act="again">${esc(s.again)}</button>`;
  const G = D.garden;
  if (D.step >= 1 || D.done) lab.setReadout(`${Math.round(G.mean)} ${esc(s.cm)}`, s.middle, `${Math.min(...G.v)}–${Math.max(...G.v)} ${s.cm}`, DAD);
  else lab.setReadout('?', '', '', DAD);
  card('seeds', D.ans || D.step >= 1);
}
function renderLife(t) {
  const Lf = S.life, l = t.l;
  lab.setGlow('rgba(155, 123, 224, .28)');
  const end = Lf.i >= 6, k = Lf.right.filter(Boolean).length;
  if (end) {
    $('qArea').innerHTML = `<div class="qt">${esc(l.end(k))}</div><div class="row2" style="margin-top:6px"><button class="btn" data-act="again">${esc(l.again)}</button></div>`;
    lab.setReadout(`${k}/6`, '', '', INH);
    card('life', true);
    return;
  }
  const inh = LIFE[Lf.i][1], ok = Lf.sel === null ? null : (Lf.sel === 0) === inh;
  let h = `<div class="qt">${esc(l.q(l.feats[Lf.i]))}</div><div class="ans two">` + [l.inh, l.life].map((txt, i) => {
    let c = i === 0 ? 'k-inh' : 'k-life';
    if (Lf.ans) c += (i === 0) === inh ? ' good' : i === Lf.sel ? ' bad' : '';
    return `<button class="ab ${c}" data-act="pick" data-i="${i}"${Lf.ans ? ' disabled' : ''}>${esc(txt)}</button>`;
  }).join('') + '</div>';
  if (Lf.ans) h += `<div class="vd ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.wrong)}</div>`;
  if (Lf.ans && Lf.landed) h += `<div class="vt">${esc(l.why[Lf.i])}</div><div class="row2" style="margin-top:6px"><button class="btn" data-act="next">${esc(t.next)}</button></div>`;
  $('qArea').innerHTML = h;
  const n = Lf.basket.inh.length + Lf.basket.life.length;
  lab.setReadout(n ? `${Lf.right.slice(0, n).filter(Boolean).length}/${n}` : '?', '', '', INH);
  card('life', false);
}
render();
</script>
