  render();
});

// --- one render per change: controls, readout and the state card --------------------------------------------------
function render() {
  const v = lab.view, t = T[lang];
  $('jtS1').hidden = v !== 'inside'; $('jtS2').hidden = v !== 'shapes'; $('jtS3').hidden = v !== 'leg';
  cv.style.touchAction = (v === 'inside' && S.g1 !== null) || (v === 'shapes' && S.g2 !== null) ? 'none' : 'pan-y';
  if (v === 'inside') renderInside(t); else if (v === 'shapes') renderShapes(t); else renderLeg(t);
}
function opts(act, list) { return `<div class="jt-opts">${list.map((o, i) => `<button class="jt-opt" type="button" data-act="${act}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`; }

function renderInside(t) {
  const q = t.v1, g = S.g1, el = $('jtS1');
  lab.setGlow('rgba(217, 100, 90, .24)');
  if (g === null) {
    el.innerHTML = `<p class="jt-q">${esc(q.q)}</p>${opts('g1', q.qo)}`;
    lab.setReadout('?', '', '', '#e8675f'); S.rk = '';
    lab.setState({ emo: '🦵', title: q.t0, lead: q.l0, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const verdict = g === 1 ? ['ok', q.right] : g === 0 ? ['no', q.noSkin] : ['no', q.noTendon];
  const hand = S.sec === 'hand', open = secret.unlocked();
  const secBtn = (k, emo, tk) => `<button class="chip secret jt-c ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" type="button" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[tk][0])}` : '🔒 ???'}</button>`;
  const knee = `
    <div class="row2" style="margin-top:2px"><span class="jt-lbl">${esc(q.nameIt)}</span><div class="chips">${LAYERS.map((k) => `<button class="chip jt-c ${S.layer === k ? 'on' : ''}" type="button" data-act="layer" data-k="${k}">${esc(q.layers[k][0])}</button>`).join('')}</div></div>
    <div class="row2"><span class="jt-lbl">${esc(q.takeAway)}</span><div class="chips">
      ${[['cart', S.noCart], ['fluid', S.noFluid], ['lig', S.noLig]].map(([k, on]) => `<button class="chip jt-c ${on ? 'on' : ''}" type="button" data-act="take" data-k="${k}"${k === 'cart' && S.sec === 'implant' ? ' disabled' : ''}>${esc(q.rm[k])}</button>`).join('')}
      <button class="chip jt-c" type="button" data-act="push">${esc(q.push)}</button></div></div>`;
  const handCtl = `<div class="row2" style="margin-top:2px"><button class="chip jt-c" type="button" data-act="hand">↺ ${esc(t.hand.again)}</button></div>`;
  el.innerHTML = `<p class="jt-verdict ${verdict[0]}">${verdict[0] === 'ok' ? '✓ ' : ''}${esc(verdict[1])}</p><p class="jt-note">${esc(hand ? t.hand.t0[1] : q.drag)}</p>${hand ? handCtl : knee}
    <div class="jt-secs">${secBtn('hand', '✋', 'a')}${secBtn('implant', '🔩', 'b')}</div>`;
  // state card and facts
  const fr = S.noCart && S.noFluid ? q.sBoth : S.noCart ? q.sCart : S.noFluid ? q.sFluid : null;
  let st;
  if (hand) {
    const n = S.lit.size, all = n === HAND.length;
    st = all ? (() => { const d = t.hand.done(HAND.length, ...HC); return { emo: '✋', title: d[0], lead: d[1], body: d[2] }; })() : { emo: '✋', title: t.hand.t0[0], lead: t.hand.t0[1], body: '' };
    lab.setReadout(n, t.hand.sub, '', '#e8675f'); lab.setFacts(all ? fl(['thumb']) : []);
    lab.setState({ ...st, extra: '' }); return;
  }
  if (S.sec === 'implant') st = { emo: '🔩', title: q.impl[0], lead: q.impl[1], body: '' };
  else if (S.note === 'verdict') st = { emo: g === 1 ? '✅' : '🤔', title: verdict[1], lead: g === 1 ? q.rightL : g === 0 ? q.noSkinL : q.noTendonL, body: '' };
  else if (S.note === 'layer' && S.layer) st = { emo: { bone: '🦴', cartilage: '💎', fluid: '💧', ligament: '🎗️', tendon: '🧵', muscle: '💪' }[S.layer], title: q.layers[S.layer][0], lead: q.layers[S.layer][1], body: '' };
  else if (S.note === 'push') st = S.noLig ? { emo: '😬', title: q.pNo[0], lead: q.pNo[1], body: '' } : { emo: '🎗️', title: q.pOk[0], lead: q.pOk[1], body: '' };
  else if (S.note === 'take' && (fr || S.noLig)) st = fr ? { emo: '🔥', title: fr[0], lead: fr[1], body: '' } : { emo: '🎗️', title: q.sNoLig[0], lead: q.sNoLig[1], body: '' };
  else if (S.note === 'bend') st = { emo: '💪', title: q.sBend[0], lead: q.sBend[1], body: q.sBend[2] };
  else st = { emo: '🦵', title: q.sDef[0], lead: q.sDef[1], body: '' };
  const deg = Math.round(S.th * 180 / Math.PI);
  lab.setReadout(`${deg}°`, t.bend, frWord(frictionOf()), '#e8675f'); S.rk = `${deg}|${frWord(frictionOf())}`;
  lab.setState({ ...st, extra: '' });
  lab.setFacts(S.sec === 'implant' ? fl(['impl']) : fl(['syn', 'vol', 'men']));
}

function renderShapes(t) {
  const q = t.v2, g = S.g2, el = $('jtS2');
  lab.setGlow('rgba(95, 168, 160, .26)');
  if (g === null) {
    el.innerHTML = `<p class="jt-q">${esc(q.q)}</p>${opts('g2', q.qo)}`;
    lab.setReadout('?', '', '', '#5fa8a0');
    lab.setState({ emo: '🔄', title: q.t0, lead: q.l0, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const verdict = g === 1 ? ['ok', q.right] : g === 0 ? ['no', q.noElbow] : ['no', q.noBoth];
  const kinds = ['hinge', 'ball', 'pivot'], ki = kinds.indexOf(S.m), M = S[S.m];
  el.innerHTML = `<p class="jt-verdict ${verdict[0]}">${verdict[0] === 'ok' ? '✓ ' : ''}${esc(verdict[1])}</p>
    <div class="row2" style="margin-top:6px"><div class="chips">${kinds.map((k, i) => `<button class="chip jt-c ${S.m === k ? 'on' : ''}" type="button" data-act="model" data-k="${k}">${esc(q.joints[i])}${S[k].cov.size >= 9 ? ' ✓' : ''}</button>`).join('')}</div></div>`;
  const pct = Math.round(M.cov.size / 24 * 100);
  lab.setReadout(`${pct}%`, q.of, q.types[ki], '#5fa8a0');
  const st = M.cov.size === 0 ? { emo: '🖐️', title: q.prompt[0], lead: q.prompt[1] } : { emo: ['🚪', '🏐', '🙂'][ki], title: q[S.m][0], lead: q[S.m][1] };
  lab.setState({ ...st, body: '', extra: '' });
  lab.setFacts(fl(['shoulder', 'atlas', 'dens']));
}

function renderLeg(t) {
  const q = t.v3, el = $('jtS3');
  lab.setGlow('rgba(224, 176, 80, .24)');
  if (S.g1 === null) {
    el.innerHTML = `<div class="jt-lock"><p>${esc(q.lockL)}</p><button class="btn" type="button" data-act="goto1">${esc(q.lockB)} →</button></div>`;
    lab.setReadout('?', '', '', '#e0b050');
    lab.setState({ emo: '🔒', title: q.lockT, lead: q.lockL, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const okN = S.straps.filter((s, i) => s === NEED[i]).length, full = S.straps.every((s) => s !== null);
  el.innerHTML = `<div class="jt-slots">${q.slots.map((s, i) => { const r = S.straps[i] ? (S.straps[i] === NEED[i] ? 'ok' : 'no') : ''; return `<button class="jt-slot ${S.sel === i ? 'on' : ''} ${r}" type="button" data-act="slot" data-i="${i}"><i>${r === 'ok' ? '✓' : r === 'no' ? '✕' : i + 1}</i><span>${esc(s)}</span></button>`; }).join('')}</div>
    <div class="jt-straps"><button class="jt-strap" type="button" data-act="strap" data-k="tendon"${S.sel === null ? ' disabled' : ''}><span class="jt-sw t"></span>${esc(q.straps[0])}</button>
    <button class="jt-strap" type="button" data-act="strap" data-k="ligament"${S.sel === null ? ' disabled' : ''}><span class="jt-sw l"></span>${esc(q.straps[1])}</button></div>
    <div class="row2"><button class="chip jt-c" type="button" data-act="reset3">↺ ${esc(q.reset)}</button></div>`;
  lab.setReadout(`${okN}/4`, q.sub, '', '#e0b050');
  let st;
  if (okN === 4) { const r = S.last !== null && S.straps[S.last] ? q.res[S.last].ok : null; st = r ? { emo: '🏆', title: q.all[0], lead: r[1], body: q.all[1] } : { emo: '🏆', title: q.all[0], lead: q.all[1] }; }
  else if (S.last !== null && S.straps[S.last]) { const i = S.last, r = q.res[i][S.straps[i] === NEED[i] ? 'ok' : 'no']; st = { emo: S.straps[i] === NEED[i] ? '✅' : '🤔', title: r[0], lead: r[1] }; }
  else if (S.sel !== null) st = { emo: '👆', title: `${q.gap} ${S.sel + 1}`, lead: `${q.slots[S.sel]}. ${q.pick}` };
  else st = { emo: '🧩', title: q.start[0], lead: q.start[1] };
  lab.setState({ body: '', ...st, extra: '' });
  const key = full ? ['thick', 'load', 'sprain'] : ['thick', 'sprain'];
  lab.setFacts(fl(key));
}

canvasLoop(cv, (ctx, w, h, dt, t) => {
  try {
    const v = lab.view;
    if (v === 'inside') { ctx.save(); try { frameSet(ctx, w, h); if (S.sec === 'hand') drawHand(ctx, dt, t); else drawKnee(ctx, dt, t); } finally { ctx.restore(); } }
    else if (v === 'shapes') drawShapes(ctx, w, h, dt, t);
    else drawLeg(ctx, w, h, dt, t);
  } catch (e) { console.error(e); }
});
render();
</script>
</body>
</html>
