function mk(id, steps) {
  let top = YB, first = true, eroded = false, total = 0;
  steps.forEach((s, i) => {
    s.i = i;
    s.dur ??= s.k === 'dep' ? 1.5 : s.k === 'vein' ? 2.2 : s.k === 'fault' ? 2.4 : 2.8;
    s.t0 = total; total += s.dur;
    if (s.k === 'dep') {
      s.first = first; s.gb = first ? YB : top; s.bot = first ? YB + 700 : top; s.wavy = eroded; s.wk ??= 1;
      first = false; eroded = false; top = s.top;
    } else if (s.k === 'vein') s.vtop = top;
    else if (s.k === 'fault') { s.surf = top; top += s.d; eroded = true; }
    else if (s.k === 'tilt') { top = s.ye; eroded = true; s.y0 ??= 10; }
  });
  steps.forEach((s, i) => {
    if (s.k !== 'dep') return;
    s.fi = steps.findIndex((t, j) => j > i && t.k === 'fault');
    s.ti = steps.findIndex((t, j) => j > i && t.k === 'tilt');
  });
  let n = 0; steps.forEach((s) => { if (s.k === 'dep') s.num = ++n; });
  return { id, steps, total, top };
}

    const k = Math.max(1, Math.min(4, cur + 1)), s = sc.steps[k - 1];
    lab.setReadout(String(Math.min(4, cnt)), tv.subBuild, '', '#d9825f');
    lab.setState({ emo: '🏞️', title: a.phase === 'curtain' ? tv.curtain : tv.buildT, lead: tv.buildL(k, t.lay[s.ty]), body: tv.buildB, extra: '' }); lab.setFacts([]);
  } else if (a.phase === 'ask') {

  } else if (!done) {
    const s = sc.steps[cur];
    lab.setReadout(`${cur + 1} / ${n}`, t.ev[s.ev], '', '#d9825f');
    lab.setState({ emo: s.k === 'vein' ? '🌋' : '🏞️', title: t.ev[s.ev], lead: t.say[s.k], body: '', extra: '' }); lab.setFacts([]);
  } else {

    lab.setFacts(t.f.v1);

}
function renderV2(t) {
  lab.setGlow('rgba(224,176,80,.28)');

  if (S.ckey !== key) { S.ckey = key; buildCards(); }

  const last = S.pz === PZ.length - 1;

    : !S.checked ? `<button class="btn push" data-act="check">${esc(tv.check)}</button>`
      : S.rdone ? `${S.ok ? '' : `<button class="chip" data-act="again">${esc(tv.again)}</button>`}<button class="btn push" data-act="next">${esc(last ? tv.fin : tv.next)}</button>` : '';
  $('rsV2Row').innerHTML = btns;
  const done = S.checked && S.rdone;
  if (S.end) {
    const k = S.first.filter(Boolean).length;
    lab.setReadout(`${k} / ${PZ.length}`, tv.sub, '', '#e0b050');
    lab.setState({ emo: '🏆', title: tv.endT(k), lead: tv.endL, body: '', extra: '' }); lab.setFacts(t.f.v2);
  } else if (!S.checked) {
    lab.setReadout(`${S.pz + 1} / ${PZ.length}`, tv.sub, tv.pill(n), '#e0b050');
    lab.setState({ emo: '🧩', title: tv.title(S.pz + 1), lead: tv.lead, body: tv.body, extra: '' }); lab.setFacts([]);
  } else if (!done) {
    const pos = posT(sc, S.rt), cur = Math.min(n - 1, Math.floor(pos)), s = sc.steps[cur];

    lab.setState({ emo: '🎬', title: tv.replaying, lead: t.ev[s.ev], body: t.say[s.k], extra: '' }); lab.setFacts([]);

    void names; lab.setFacts(t.f.v2);

}
function renderV3(t) {

  const ageLine = (i) => (i === 0 ? tv.ageS : CAN[i - 1].age.length === 2 ? tv.ageR(CAN[i - 1].age[0], CAN[i - 1].age[1]) : tv.ageA(nf(CAN[i - 1].age[0])));
  const gb = dec(GAP_BIL), extra = esc(tv.depth(nf(1857)));

    else lab.setState({ emo: '🏜️', title: tv.title, lead: tv.lead, body: tv.body, extra });
    lab.setFacts([]);
  } else {
    if (sel !== null) {
      const a = sel === 0 ? nf(SCHIST_AGE) : CAN[sel - 1].age.length === 2 ? `${CAN[sel - 1].age[0]}–${CAN[sel - 1].age[1]}` : nf(CAN[sel - 1].age[0]);
      lab.setReadout(a, `${tv.unit} · ${t.can[names[sel]]}`, '', '#c4684b');
      lab.setState({ emo: '🪨', title: t.can[names[sel]], lead: ageLine(sel), body: '', extra });
    } else {

      lab.setState({ emo: g === 2 ? '✅' : '🔍', title: g === 2 ? `${t.right} ${tv.resT(gb)}` : `${t.not} ${tv.resT(gb)}`, lead: tv.resL(dec('1.75'), SAND_AGE, nf(GAP_MIL)), body: tv.resB, extra });
    }

}
