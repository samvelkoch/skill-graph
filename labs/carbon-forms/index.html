  secrets: [{ emo: '🩹', title: T[lang].secrets.gp[0], desc: T[lang].secrets.gp[1] }, { emo: '💥', title: T[lang].secrets.ck[0], desc: T[lang].secrets.ck[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="pred"></div>
  <div id="v1c" class="cf-row"><button class="chip" data-act="mat" data-m="d" id="bD"></button><button class="chip" data-act="mat" data-m="g" id="bG"></button>
    <button class="chip" data-act="push" id="bPush"></button><button class="chip secret" data-act="gp" id="bGp"></button></div>
  <div id="v2c" class="cf-tbl"></div>
  <div id="v3c"><div class="cf-row" style="margin-top:4px"><button class="chip" data-act="sub" data-s="salt" id="bSalt"></button><button class="chip" data-act="sub" data-s="sugar" id="bSugar"></button>
    <button class="chip secret" data-act="ck" id="bCk"></button></div>
    <div class="cf-slide"><span class="cf-lbl" id="dl"></span><input id="days" class="big" type="range" min="0" max="7" step="0.05" value="0"><b class="cf-dv" id="dv"></b></div></div>`;

const cv = $('cv');
canvasLoop(cv, (ctx, w, h, dt, t) => {
  const v = lab.view;
  if (!S.dragging && now() - S.idle > 2.5 && S.sel < 0 && v !== 'tests') S.yaw += dt * .3;
  S.slide += (S.slideTo - S.slide) * Math.min(1, dt * 5); S.gp += (S.gpTo - S.gp) * Math.min(1, dt * 4);
  if (v === 'grow') growTick(dt);
  if (v === 'atoms') drawAtoms(ctx, w, h, t); else if (v === 'tests') drawTests(ctx, w, h, t); else drawGrow(ctx, w, h, t);
});
function growTick(dt) {
  const sub = S.sub;
  if (S.gpick[sub] === null) return;
  if (S.auto[sub] && S.days[sub] < 7 && !S.ck) { S.days[sub] = Math.min(7, S.days[sub] + dt * .8); $('days').value = S.days[sub]; }
  const d = S.days[sub], ph = d < 2 ? 0 : d < 3.6 ? 1 : 2;
  $('dv').textContent = Math.round(d);
  if (ph !== S.phase || Math.round(d) !== S.lastDay) { S.phase = ph; S.lastDay = Math.round(d); render(); }
}

// --- input -------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
let pd = null;
cv.addEventListener('pointerdown', (ev) => { pd = { x: ev.clientX, y: ev.clientY, yaw: S.yaw, moved: false }; });
cv.addEventListener('pointermove', (ev) => {
  if (!pd) return; const dx = ev.clientX - pd.x, dy = ev.clientY - pd.y;
  if (!pd.moved && Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)) { pd.moved = true; S.dragging = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ } }
  if (pd.moved) { S.yaw = pd.yaw + dx * .012; S.idle = now(); }
});
const endPtr = (ev) => {
  if (!pd) return; const d = pd; pd = null; S.dragging = false; S.idle = now();
  if (!d.moved && ev.type === 'pointerup' && lab.view === 'atoms') tapAtom(ev.clientX - cv.getBoundingClientRect().left, ev.clientY - cv.getBoundingClientRect().top);
};
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
function tapAtom(x, y) {
  if (S.apick === null) return;
  const M = S.mat === 'g' ? MG : MD; if (!M.scr) return;
  let best = -1, bn = -1e9;
  M.scr.forEach((p, i) => { if (S.mat === 'g' && S.gp > .5 && M.at[i].l > 0) return; if (Math.hypot(p[0] - x, p[1] - y) <= M.rpx[i] + 8 && p[2] > bn) { bn = p[2]; best = i; } });
  S.sel = best === S.sel ? -1 : best; if (best >= 0) sfx.tick(); render();
}
function pick(i) {
  const v = lab.view;
  if (v === 'atoms') { if (S.apick !== null) return; S.apick = i; (i === 1 ? sfx.good : sfx.bad)(); }
  else if (v === 'tests') { const key = S.tmat + S.test; if (S.tpick[key] !== undefined) return; S.tpick[key] = i; S.t0 = now(); (i === (TRUTH[key] ? 0 : 1) ? sfx.good : sfx.bad)(); }
  else { const sub = S.sub; if (S.gpick[sub] !== null) return; S.gpick[sub] = i; S.days[sub] = 0; S.auto[sub] = true; S.phase = -1; (i === (sub === 'salt' ? 0 : 1) ? sfx.good : sfx.bad)(); }
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const o = ev.target.closest('.cf-opt'); if (o) return pick(+o.dataset.i);
  const c = ev.target.closest('.cf-cell'); if (c) { S.tmat = c.dataset.m; S.test = c.dataset.k; S.t0 = now(); sfx.click(); render(); return; }
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'mat') { S.mat = b.dataset.m; S.sel = -1; S.slideTo = 0; if (S.mat === 'd') S.gpTo = 0; sfx.click(); }
  else if (act === 'push') {
    if (S.mat === 'g') S.slideTo = S.slideTo ? 0 : 1; else S.shake = now();
    sfx.push();
  } else if (act === 'gp') {
    if (!secret.unlocked()) return secret.open();
    S.mat = 'g'; S.sel = -1; S.gpTo = S.gpTo ? 0 : 1; S.slideTo = 0; sfx.click();
  } else if (act === 'sub') { S.sub = b.dataset.s; S.ck = false; S.phase = -1; sfx.click(); }
  else if (act === 'ck') {
    if (!secret.unlocked()) return secret.open();
    if (S.gpick.salt === null) return;
    S.sub = 'salt'; S.days.salt = Math.max(S.days.salt, 6); S.auto.salt = false; $('days').value = S.days.salt; S.ck = !S.ck; S.ckT0 = now(); sfx.snap();
  }
  render();
});
$('days').addEventListener('input', (ev) => { const sub = S.sub; if (S.gpick[sub] === null) return; S.days[sub] = +ev.target.value; S.auto[sub] = false; S.ck = false; render(); });

// --- one render per change ----------------------------------------------------------------------------------
function predHTML(q, opts, picked, okI, vOk, vNo, extra = '') {
  const done = picked !== null && picked !== undefined;
  return `<div class="cf-q">${esc(q)}</div><div class="cf-opts">${opts.map((o, i) => `<button class="cf-opt${done ? (i === okI ? ' good' : i === picked ? ' bad' : ' dim') : ''}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>${done
    ? `<div class="cf-v ${picked === okI ? 'ok' : 'no'}">${esc(picked === okI ? vOk : vNo)}</div>${extra}` : ''}`;
}
const F = (t, ...ks) => ks.map((k) => ({ emo: t.f[k][0], text: t.f[k][1], src: t.f[k][2] }));
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('v1c').hidden = v !== 'atoms' || S.apick === null; $('v2c').hidden = v !== 'tests'; $('v3c').hidden = v !== 'grow';
  if (v === 'atoms') renderAtoms(t); else if (v === 'tests') renderTests(t); else renderGrow(t);
  lab.checkStage();
}
function renderAtoms(t) {
  const a = t.a, ans = S.apick; lab.setGlow('rgba(120, 140, 220, .28)');
  $('pred').innerHTML = predHTML(a.q, a.opts, ans, 1, t.ok, t.no, ans === null ? '' : `<p class="cf-p">${esc(a.rev)}</p>`);
  if (ans === null) {
    lab.setReadout('?', '', '', '#8fa0e0');
    lab.setState({ emo: '🤔', title: a.q, lead: a.hint, body: '', extra: '' }); lab.setFacts(F(t, 'pencil', 'borrow')); return;
  }
  const g = S.mat === 'g', M = g ? MG : MD, un = secret.unlocked();
  $('bD').textContent = a.d; $('bG').textContent = a.g; $('bD').classList.toggle('on', !g); $('bG').classList.toggle('on', g);
  $('bPush').textContent = g && S.slideTo ? a.back : a.push;
  $('bGp').textContent = un ? `🩹 ${t.secrets.gp[0]}` : '🔒 ???'; $('bGp').classList.toggle('open', un); $('bGp').classList.toggle('on', un && S.gpTo > 0);
  const n = S.sel >= 0 ? M.nb[S.sel] : 0;
  let st;
  if (g && S.gpTo) st = a.peel;
  else if (g && S.slideTo) st = a.pushG;
  else if (S.sel >= 0) st = g ? a.selG(n) : a.selD(n);
  else st = g ? a.idleG : a.idleD;
  if (g && S.gpTo) lab.setReadout(a.peelVal, a.peelSub, 'C', '#8fa0e0');
  else if (S.sel >= 0) lab.setReadout(n, a.nb(n), 'C', '#8fa0e0');
  else lab.setReadout('C', a.every, '', '#8fa0e0');
  lab.setState({ emo: g ? '✏️' : '💎', title: st[0], lead: st[1], body: '', extra: '' });
  lab.setFacts(g && S.gpTo ? F(t, 'graphene') : F(t, 'pencil', 'borrow'));
}
function renderTests(t) {
  const q = t.t, key = S.tmat + S.test, ans = S.tpick[key], truth = TRUTH[key], okI = truth ? 0 : 1; lab.setGlow('rgba(110, 200, 220, .26)');
  $('pred').innerHTML = predHTML(q.q[S.test](q.nm[S.tmat]), [q.yes, q.nope], ans, okI, t.ok, t.no, `<p class="cf-p">${esc(q.tapRow)}</p>`);
  $('v2c').innerHTML = `<span></span>${['s', 'w', 'e'].map((k) => `<span class="h">${esc(q.cols[k])}</span>`).join('')}` + ['d', 'g'].map((m) => `<span class="r">${esc(q.rows[m])}</span>` +
    ['s', 'w', 'e'].map((k) => { const r = S.tpick[m + k], on = m === S.tmat && k === S.test; return `<button class="cf-cell${on ? ' on' : ''}${r === undefined ? '' : TRUTH[m + k] ? ' y' : ' n'}" data-m="${m}" data-k="${k}" aria-label="${esc(q.rows[m] + ' · ' + q.cols[k])}">${r === undefined ? '?' : TRUTH[m + k] ? '✔' : '✘'}</button>`; }).join('')).join('');
  const done = Object.keys(S.tpick).length;
  if (ans === undefined) {
    lab.setReadout(`${done}/6`, q.done, '', '#6ec8dc'); lab.setState({ emo: '🤔', title: q.q[S.test](q.nm[S.tmat]), lead: q.go, body: '', extra: '' });
  } else {
    lab.setReadout(`${done}/6`, q.done, truth ? '✔' : '✘', '#6ec8dc'); const r = q.res[key];
    lab.setState({ emo: S.test === 's' ? '🪟' : S.test === 'w' ? '✏️' : '💡', title: r[0], lead: r[1], body: '', extra: '' });
  }
  const sc = S.tpick.ds !== undefined || S.tpick.gs !== undefined;
  lab.setFacts(F(t, 'graphene', ...(sc ? ['cleave', 'mohs'] : [])));
}
function renderGrow(t) {
  const g = t.g, sub = S.sub, pk = S.gpick[sub], rev = pk !== null, days = rev ? S.days[sub] : 0, okI = sub === 'salt' ? 0 : 1, un = secret.unlocked(); lab.setGlow('rgba(245, 200, 76, .22)');
  $('pred').innerHTML = predHTML(g.q[sub], g.opts[sub], pk, okI, t.ok, t.no);
  $('bSalt').textContent = g.subs.salt; $('bSugar').textContent = g.subs.sugar; $('bSalt').classList.toggle('on', sub === 'salt'); $('bSugar').classList.toggle('on', sub === 'sugar');
  $('bSugar').hidden = S.gpick.salt === null;
  $('bCk').textContent = un ? `💥 ${t.secrets.ck[0]}` : '🔒 ???'; $('bCk').classList.toggle('open', un); $('bCk').classList.toggle('on', un && S.ck); $('bCk').disabled = un && S.gpick.salt === null;
  $('days').disabled = !rev; $('days').value = days; $('dl').textContent = g.days; $('dv').textContent = rev ? Math.round(days) : '';
  if (!rev) {
    lab.setReadout('?', '', '', '#f5c84c'); lab.setState({ emo: '🤔', title: g.q[sub], lead: g.go, body: '', extra: '' }); lab.setFacts(F(t, 'halcol')); return;
  }
  const n = Math.round(days); lab.setReadout(n, g.dsub(n), '', '#f5c84c');
  let st; if (S.ck && sub === 'salt') st = g.crack; else if (days < 2) st = g.ph0; else if (days < 3.6) st = g.ph1; else st = g.res[sub];
  lab.setState({ emo: S.ck ? '💥' : sub === 'salt' ? '🧂' : '🍬', title: st[0], lead: st[1], body: '', extra: '' });
  const fl = ['halcol']; if (S.gpick.salt !== null) fl.push('halcube', 'six'); if (S.gpick.sugar !== null) fl.push('sucrose'); if (S.ck) fl.unshift('brittle');
  lab.setFacts(F(t, ...fl));
}
render();
</script>
