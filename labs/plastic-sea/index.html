    lab.setState({ emo: jr.s[0][0], title: jr.s[0][1], lead: ans === null ? jr.s[0][2] : jr.t[ans], body: '', extra: '' });

  $('yLbl').textContent = jr.yrs; $('yVal').textContent = jr.y(y); $('yr').value = String(y); $('yr').setAttribute('aria-label', jr.yrs);
  const unl = secret.unlocked();
  const chip = (k, emo) => `<button class="chip ps-chip secret ${unl ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${unl ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('jChips').innerHTML = chip('mm', '📏') + chip('duck', '🦆');
  if (S.sec === 'duck') {
    const d = t.duck, i = y < 1 ? 0 : y < 5 ? 1 : 2;
    lab.setReadout(fmt(28800), d.val, d.later(y), '#f2b320');
    lab.setState({ emo: d.s[i][0], title: d.s[i][1], lead: d.s[i][2], body: '', extra: '' });
  } else {
    lab.setReadout(fmt(n), jr.pcs(n), jr.y(y), '#58b9d0');
    if (S.sec === 'mm') {
      const L = sizeMm(y), m = t.mm, Ls = L >= 10 ? String(Math.round(L)) : L.toFixed(1);
      lab.setState({ emo: '📏', title: m.size(Ls), lead: L < 5 ? m.small : m.big, body: m.note, extra: '' });
    } else {
      const i = y < 1 ? 0 : y < 5 ? 1 : y < 20 ? 2 : y < 80 ? 3 : 4, s = jr.s[i];
      lab.setState({ emo: s[0], title: s[1], lead: s[2], body: i >= 2 ? jr.model : '', extra: '' });
    }
  }
  lab.setFacts(S.sec === 'duck' ? [] : t.facts.journey);
}

function renderLunch(t) {
  const ln = t.ln, a = ANI[S.an], an = ln.an[a.k], g = S.lun[a.k], doneN = ANI.filter((x) => S.lun[x.k] !== null).length;
  lab.setGlow('rgba(80, 170, 130, .26)');
  $('lq').textContent = g === null ? an.q : doneN < 3 ? ln.next : ln.all;
  $('lChips').innerHTML = ANI.map((x, i) => `<button class="chip ps-chip ${i === S.an ? 'on' : ''} ${S.lun[x.k] !== null ? 'ps-done' : ''}" data-act="an" data-i="${i}">${x.emo} ${esc(ln.an[x.k].chip)}${S.lun[x.k] !== null ? ' ✓' : ''}</button>`).join('')
    + (doneN === 3 ? `<button class="chip ps-chip" data-act="again">${esc(ln.again)}</button>` : '');
  lab.setReadout(`${S.an + 1}/3`, ln.animal, `✓ ${doneN}/3`, '#5fb88a');
  if (g === null) lab.setState({ emo: a.emo, title: an.name, lead: ln.hunt, body: ln.tap, extra: '' });
  else if (g === a.ok) lab.setState({ emo: '✅', title: ln.right, lead: an.why, body: doneN === 3 ? ln.all : '', extra: '' });
  else lab.setState({ emo: '🤔', title: ln.miss, lead: an.why, body: ln.missBody, extra: '' });
  lab.setFacts(g === null ? [] : t.facts.lunch);
}

function renderHelp(t) {
  const hp = t.hp;
  lab.setGlow('rgba(70, 160, 140, .26)');
  const on = LEV.filter((k) => S.L[k]), hasM = S.L.mpa;
  if (!S.hGo) {
    const ans = S.hAns, ok = ans === 'bottles', one = (k) => Math.round(100 - total({ [k]: true }));
    askEl.innerHTML = ans === null
      ? `<div class="q">${esc(hp.ask)}</div><div class="opts">${LEV.map((k) => `<button data-h="${k}">${LEMO[k]} ${esc(hp.opt[k])}</button>`).join('')}</div>`
      : `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? hp.vOk : hp.vNo)}</div>
         <p class="alone">${esc(hp.alone)} ${LEV.map((k) => `${LEMO[k]} −${one(k)}`).join(' · ')}</p><div class="opts"><button data-go="1">${esc(hp.go)}</button></div>`;
    lab.setReadout('100', hp.unit, '', '#46a08c');
    lab.setState({ emo: hp.intro[0], title: hp.intro[1], lead: hp.intro[2], body: ans === null ? '' : hp.why, extra: '' });
    lab.setFacts([]);
    return;
  }
  $('levers').innerHTML = [...LEV, 'mpa'].map((k) => `<button class="chip ps-chip ${S.L[k] ? 'on' : ''}" data-act="lev" data-k="${k}" aria-pressed="${S.L[k]}">${LEMO[k]} ${esc(hp.lev[k])}</button>`).join('');
  const r = calc(S.L), tot = Math.round(total(S.L));
  $('hbars').innerHTML = `<div class="t">${esc(hp.bars)}</div>
    <div class="ps-track">${['river', 'beach', 'boats'].map((k) => `<i style="width:${r[k]}%;background:${SCOL[k]}"></i>`).join('')}</div>
    <div class="ps-leg">${['river', 'beach', 'boats'].map((k) => `<span style="--c:${SCOL[k]}">${esc(hp.src[k])} ${Math.round(r[k])}</span>`).join('')}</div>`;
  lab.setReadout(String(tot), hp.unit, on.length ? `−${100 - tot}` : '', '#46a08c');
  let st;
  if (on.length === 0) st = hasM ? hp.mpaOnly : hp.s0;
  else st = on.length === 1 ? hp.s1(tot) : on.length === 2 ? hp.s2(tot) : hp.s3(tot);
  const body = on.length === 1 && on[0] === 'bottles' ? hp.habit : on.length && hasM ? hp.mpaPlus : '';
  const needs = [...on, ...(hasM ? ['mpa'] : [])];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body, extra: needs.length ? `<ul class="ps-needs">${needs.map((k) => `<li>${LEMO[k]} ${esc(hp.need[k])}</li>`).join('')}</ul>` : '' });
  lab.setFacts(t.facts.help);
}
render();
</script>
</body>
</html>
