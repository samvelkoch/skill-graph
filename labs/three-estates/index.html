  const key = `${w | 0}x${h | 0}`; let L = courtCache.get(key); if (L) return L;
  const r = rng(11), figs = [], K = 12, per = 48;
  for (let k = 0; k < K; k++) {
    const tt = k / (K - 1), yk = h * 0.47 + Math.pow(tt, 1.15) * h * 0.37, wk = w * (0.5 + 0.46 * tt), sp = wk / per;
    for (let i = 0; i < per; i++) {
      figs.push({ x: w / 2 - wk / 2 + (i + 0.5 + (k & 1) * 0.4 - 0.2) * sp + (r() - 0.5) * sp * 0.5, y: yk + (r() - 0.5) * sp * 0.6, pw: sp * 1.4, col: COURT_COL[Math.floor(r() * 6)], dly: 0, rx: r() });
    }
  }
  for (const f of figs) f.dly = (f.x / w) * 0.9 + (f.y / h) * 0.3 + f.rx * 0.15;
  L = { figs, seat: { x: w * 0.17, y: h * 0.965, pw: Math.max(15, w * 0.065) } };
  courtCache.set(key, L);
  return L;
}
// o: { t0 (seconds when the oath starts, or null), spot 0..1, name }; returns how many hands are up
function drawCourt(c, x, y, w, h, o) {
  const L = courtLayout(w, h), tt = o.t0 === null ? -1 : now() - o.t0;
  c.save(); c.translate(x, y); rr(c, 0, 0, w, h, 18); c.clip();
  let g = c.createLinearGradient(0, 0, 0, h * 0.48); g.addColorStop(0, '#4f3b29'); g.addColorStop(0.18, '#8a6d4b'); g.addColorStop(1, '#d6c49c'); c.fillStyle = g; c.fillRect(0, 0, w, h * 0.5);
  c.fillStyle = 'rgba(25,15,8,.45)'; for (let i = 0; i < 3; i++) c.fillRect(0, h * 0.025 + i * h * 0.03, w, 4);
  for (const wx of [0.22, 0.5, 0.78]) { // tall arched windows
    const ww = w * 0.12, x0 = w * wx - ww / 2, y0 = h * 0.12, hh = h * 0.2;
    c.beginPath(); c.moveTo(x0, y0 + hh); c.lineTo(x0, y0 + ww / 2); c.arc(x0 + ww / 2, y0 + ww / 2, ww / 2, Math.PI, 0); c.lineTo(x0 + ww, y0 + hh); c.closePath();
    const wg = c.createLinearGradient(0, y0, 0, y0 + hh); wg.addColorStop(0, '#fff6d8'); wg.addColorStop(1, '#f1d48a'); c.fillStyle = wg; c.fill(); c.strokeStyle = '#4a3624'; c.lineWidth = 2; c.stroke();
    c.beginPath(); c.moveTo(x0 + ww / 2, y0); c.lineTo(x0 + ww / 2, y0 + hh); c.moveTo(x0, y0 + hh * 0.5); c.lineTo(x0 + ww, y0 + hh * 0.5); c.stroke();
  }
  // galleries with spectators
  const rg = rng(5);
  for (const gx of [0, w * 0.7]) {
    const gw = w * 0.3, gy = h * 0.34;
    for (let i = 0; i < 11; i++) { const px = gx + gw * (i + 0.5) / 11 + (rg() - 0.5) * 4; c.fillStyle = COURT_COL[Math.floor(rg() * 6)]; c.beginPath(); c.arc(px, gy - 6, w * 0.014, 0, 7); c.fill(); c.fillRect(px - w * 0.012, gy - 4, w * 0.024, 6); }
    g = c.createLinearGradient(0, gy, 0, gy + h * 0.05); g.addColorStop(0, '#8a6540'); g.addColorStop(1, '#5a3f26'); c.fillStyle = g; c.fillRect(gx, gy, gw, h * 0.05);
    c.fillStyle = 'rgba(30,18,8,.5)'; c.fillRect(gx, gy, gw, 2);
  }
  // floor, converging plank lines
  const fy = h * 0.4;
  g = c.createLinearGradient(0, fy, 0, h); g.addColorStop(0, '#b98a5a'); g.addColorStop(1, '#7b5434'); c.fillStyle = g; c.fillRect(0, fy, w, h - fy);
  c.strokeStyle = 'rgba(60,35,15,.3)'; c.lineWidth = 1; c.beginPath();
  for (let i = -4; i <= 14; i++) { c.moveTo(w / 2 + (i - 5) * w * 0.02, fy); c.lineTo(i * w / 10, h); }
  c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.14)'; c.beginPath(); for (const f of [0.1, 0.3, 0.6]) { const yy = fy + Math.pow(f, 1.3) * (h - fy); c.moveTo(0, yy); c.lineTo(w, yy); } c.stroke();
  // the crowd
  let up = 0;
  for (const f of L.figs) {
    const ph = f.pw * 1.5, k = tt < 0 ? 0 : eBack((tt - f.dly) / 0.28, 1.2);
    c.drawImage(pawn(f.col), f.x - f.pw / 2, f.y - ph * 0.92, f.pw, ph);
    if (k > 0.02) {
      if (tt - f.dly > 0.12) up++;
      const sx = f.x + f.pw * 0.16, sy = f.y - ph * 0.6, len = ph * 0.6 * k;
      c.strokeStyle = '#f1cfa6'; c.lineWidth = Math.max(1.1, f.pw * 0.2); c.lineCap = 'round'; c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx + f.pw * 0.1 * k, sy - len); c.stroke();
      c.fillStyle = '#f7dcb8'; c.beginPath(); c.arc(sx + f.pw * 0.1 * k, sy - len, Math.max(1.2, f.pw * 0.21), 0, 7); c.fill();
    }
  }
  // the one who sat
  const s = L.seat, sph = s.pw * 1.5;
  rr(c, s.x - s.pw * 0.55, s.y - sph * 0.95, s.pw * 1.1, sph * 0.7, 3); c.fillStyle = '#6a4727'; c.fill(); c.strokeStyle = '#3a2410'; c.lineWidth = 1.2; c.stroke();
  c.drawImage(pawn('#4a5a85'), s.x - s.pw / 2, s.y - sph * 0.92, s.pw, sph);
  rr(c, s.x - s.pw * 0.3, s.y - sph * 0.42, s.pw * 0.6, s.pw * 0.38, 2); c.fillStyle = '#fbf3dc'; c.fill(); c.strokeStyle = '#8a7a50'; c.lineWidth = 1; c.stroke();
  if (o.spot > 0.01) {
    const px = s.x, py = s.y - sph * 0.5;
    const cone = c.createLinearGradient(0, 0, 0, py); cone.addColorStop(0, `rgba(255,244,200,${0.4 * o.spot})`); cone.addColorStop(1, `rgba(255,244,200,${0.1 * o.spot})`);
    c.fillStyle = cone; c.beginPath(); c.moveTo(px - 6, 0); c.lineTo(px + 6, 0); c.lineTo(px + s.pw * 1.1, py + sph * 0.45); c.lineTo(px - s.pw * 1.1, py + sph * 0.45); c.closePath(); c.fill();
    const rad = Math.max(60, w * 0.24), dg = c.createRadialGradient(px, py, rad * 0.3, px, py, rad * 1.5);
    dg.addColorStop(0, 'rgba(0,0,0,0)'); dg.addColorStop(1, `rgba(0,0,0,${0.55 * o.spot})`); c.fillStyle = dg; c.fillRect(0, 0, w, h);
  }
  c.restore();
  if (o.name && o.spot > 0.3) {
    const bx = x + s.x + s.pw * 0.3, by = y + s.y - sph - 14;
    const bb = pill(c, T[lang].martin, bx + 40, by, { alpha: o.spot });
    c.save(); c.globalAlpha = o.spot; c.strokeStyle = '#ff6a5f'; c.lineWidth = 2.5; c.lineCap = 'round'; const cx = bb.x + bb.w + 12, cy = by; c.beginPath(); c.moveTo(cx - 5, cy - 5); c.lineTo(cx + 5, cy + 5); c.moveTo(cx + 5, cy - 5); c.lineTo(cx - 5, cy + 5); c.stroke(); c.restore();
  }
  return up;
}

// --- the Bastille, 14 July ---------------------------------------------------------------------------------------
const BAS_COL = ['#3a2f3a', '#5a3a2e', '#2f3a4a', '#4a2f2f', '#c0392b', '#2a4b9b'];
function drawBastille(c, x, y, w, h, t) {
  c.save(); c.translate(x, y); rr(c, 0, 0, w, h, 18); c.clip();
  let g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#4a4a7a'); g.addColorStop(0.5, '#d0805a'); g.addColorStop(1, '#f2c27a'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  g = c.createRadialGradient(w * 0.72, h * 0.58, 4, w * 0.72, h * 0.58, w * 0.5); g.addColorStop(0, 'rgba(255,230,170,.7)'); g.addColorStop(1, 'rgba(255,230,170,0)'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  // roofs of Paris far away
  c.fillStyle = 'rgba(92,60,86,.65)'; c.beginPath(); c.moveTo(0, h * 0.66);
  for (let i = 0; i <= 20; i++) { const rx = w * i / 20; c.lineTo(rx, h * 0.62 - ((i * 37) % 5) * h * 0.012); c.lineTo(rx + w * 0.025, h * 0.62 - ((i * 37) % 5) * h * 0.012); }
  c.lineTo(w, h * 0.7); c.lineTo(0, h * 0.7); c.closePath(); c.fill();
  const tower = (cx, baseY, tw, th, tone) => {
    const tg = c.createLinearGradient(cx - tw / 2, 0, cx + tw / 2, 0); tg.addColorStop(0, mix(tone, '#ffffff', 0.25)); tg.addColorStop(0.5, tone); tg.addColorStop(1, mix(tone, '#000000', 0.4));
    c.fillStyle = tg; c.strokeStyle = mix(tone, '#000000', 0.55); c.lineWidth = 1.5;
    c.fillRect(cx - tw / 2, baseY - th, tw, th); c.strokeRect(cx - tw / 2, baseY - th, tw, th);
    c.fillStyle = mix(tone, '#000000', 0.3); c.fillRect(cx - tw / 2 - 3, baseY - th - 5, tw + 6, 8); c.strokeRect(cx - tw / 2 - 3, baseY - th - 5, tw + 6, 8);
    for (let i = 0; i < 4; i++) { const mx = cx - tw / 2 - 3 + i * (tw + 6 - 6) / 3; c.fillStyle = tg; c.fillRect(mx, baseY - th - 11, 6, 7); c.strokeRect(mx, baseY - th - 11, 6, 7); }
    c.fillStyle = 'rgba(20,12,14,.7)'; c.fillRect(cx - 2, baseY - th * 0.72, 4, th * 0.12); c.fillRect(cx - 2, baseY - th * 0.42, 4, th * 0.12);
  };
  const tw = w * 0.14, back = [0.19, 0.4, 0.61, 0.82], front = [0.1, 0.37, 0.63, 0.9];
  for (const f of back) tower(w * f, h * 0.66, tw * 0.85, h * 0.3, '#9d8f9a');
  // smoke
  for (let s = 0; s < 3; s++) for (let k = 0; k < 7; k++) {
    const age = (t * 0.3 + k / 7 + s * 0.31) % 1, cx = w * (0.28 + 0.22 * s) + Math.sin(k * 2 + s) * 8 + age * 34, cy = h * 0.5 - age * h * 0.34, r = 8 + age * 26, a = (1 - age) * 0.5 * c01(t / 1.2);
    c.fillStyle = `rgba(62,54,60,${a})`; c.beginPath(); c.arc(cx, cy, Math.max(0, r), 0, 7); c.fill();
  }
  // curtain wall and gate
  const wallTop = h * 0.5, wallBase = h * 0.8;
  g = c.createLinearGradient(0, wallTop, 0, wallBase); g.addColorStop(0, '#8d7e82'); g.addColorStop(1, '#6a5c60'); c.fillStyle = g; c.fillRect(w * 0.1, wallTop, w * 0.8, wallBase - wallTop);
  c.strokeStyle = '#3e3236'; c.lineWidth = 1.5; c.strokeRect(w * 0.1, wallTop, w * 0.8, wallBase - wallTop);
  for (let i = 0; i < 16; i++) { const mx = w * 0.1 + i * w * 0.8 / 16; c.fillStyle = '#8d7e82'; c.fillRect(mx + 1, wallTop - 6, w * 0.8 / 16 - 4, 7); c.strokeRect(mx + 1, wallTop - 6, w * 0.8 / 16 - 4, 7); }
  c.fillStyle = 'rgba(20,12,14,.7)'; for (const f of [0.26, 0.74]) for (let r = 0; r < 2; r++) c.fillRect(w * f - 2, wallTop + h * 0.06 + r * h * 0.09, 4, h * 0.05);
  const gx = w * 0.5, gw = w * 0.11;
  c.beginPath(); c.moveTo(gx - gw, wallBase); c.lineTo(gx - gw, wallTop + h * 0.13); c.arc(gx, wallTop + h * 0.13, gw, Math.PI, 0); c.lineTo(gx + gw, wallBase); c.closePath(); c.fillStyle = '#1e1418'; c.fill(); c.stroke();
  const fire = 0.55 + 0.15 * Math.sin(t * 7); g = c.createRadialGradient(gx, wallBase - 4, 2, gx, wallBase - 4, gw * 2.4); g.addColorStop(0, `rgba(255,170,70,${fire})`); g.addColorStop(1, 'rgba(255,170,70,0)'); c.fillStyle = g; c.fillRect(gx - gw * 3, wallBase - gw * 3, gw * 6, gw * 3.4);
  c.fillStyle = '#7a5230'; c.strokeStyle = '#3a2410'; c.beginPath(); c.moveTo(gx - gw, wallBase - 2); c.lineTo(gx + gw, wallBase - 2); c.lineTo(gx + gw * 1.5, h * 0.92); c.lineTo(gx - gw * 1.5, h * 0.92); c.closePath(); c.fill(); c.stroke();

  // ground and the crowd
  g = c.createLinearGradient(0, h * 0.85, 0, h); g.addColorStop(0, '#5a4636'); g.addColorStop(1, '#3a2c22'); c.fillStyle = g; c.fillRect(0, h * 0.87, w, h * 0.13);

  }
  c.restore();
}

// --- the staircase from vote to emperor --------------------------------------------------------------------------
function drawCrown(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s);
  const g = c.createLinearGradient(0, -22, 0, 0); g.addColorStop(0, '#ffe58a'); g.addColorStop(1, '#c99521');
  c.fillStyle = g; c.strokeStyle = '#7a5a10'; c.lineWidth = 1.6; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(-14, 0); c.lineTo(-16, -18); c.lineTo(-8, -9); c.lineTo(-4, -22); c.lineTo(0, -10); c.lineTo(4, -22); c.lineTo(8, -9); c.lineTo(16, -18); c.lineTo(14, 0); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#d4423f'; for (const jx of [-9, 0, 9]) { c.beginPath(); c.arc(jx, -4, 2.2, 0, 7); c.fill(); }
  c.fillStyle = '#fff'; for (const [jx, jy] of [[-16, -19], [-4, -23], [4, -23], [16, -19]]) { c.beginPath(); c.arc(jx, jy, 1.6, 0, 7); c.fill(); }
  c.restore();
}
function drawLadder(c, x, y, w, h, t) {
  const L = T[lang].ladder;
  c.save(); c.translate(x, y); rr(c, 0, 0, w, h, 18); c.clip();
  let g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#2c3150'); g.addColorStop(0.6, '#6a4f6e'); g.addColorStop(1, '#d89a6a'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  const dx = (w - 28) / 5.6, sh = Math.min(66, (h - 80) / 5.4), base = h - 14, tops = [];
  for (let i = 0; i < 5; i++) {
    const rise = eBack((t - i * 0.35) / 0.5, 1.1), top = base - (i + 1) * sh * rise, sx = 14 + i * dx;
    tops.push(top);
    if (rise <= 0.01) continue;
    const sg = c.createLinearGradient(sx, top, sx + dx, base); sg.addColorStop(0, '#efdfb8'); sg.addColorStop(1, '#a58c62');
    c.save(); c.shadowColor = 'rgba(20,10,30,.45)'; c.shadowBlur = 8; c.shadowOffsetX = 3; c.fillStyle = sg; c.fillRect(sx, top, dx + 1, base - top); c.restore();
    c.strokeStyle = '#6b5636'; c.lineWidth = 1.5; c.strokeRect(sx, top, dx + 1, base - top);
    c.fillStyle = 'rgba(255,248,224,.8)'; c.fillRect(sx + 1, top + 1, dx - 1, 3);
    c.font = '900 15px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#3d2c1a'; c.fillText(L[i][0], sx + dx / 2, top + 20);
  }
  c.restore();
  CW = w;
  for (let i = 0; i < 5; i++) {
    const rise = c01((t - i * 0.35) / 0.4); if (rise <= 0.05) continue;
    const sx = x + 14 + i * dx, ty = y + tops[i], py = ty - (i === 4 ? 52 : 15);
    pill(c, L[i][1], sx + dx / 2, py, { alpha: rise, size: 12 });
  }
  const cdt = (t - 2.1) / 0.8;
  if (cdt > 0) {
    const sx = x + 14 + 4 * dx + dx / 2, ty = y + tops[4] - 4, cy = -40 + (ty + 40) * eBounce(cdt);
    if (cdt > 1) { const gl = c.createRadialGradient(sx, ty - 12, 2, sx, ty - 12, 44); gl.addColorStop(0, 'rgba(255,225,120,.5)'); gl.addColorStop(1, 'rgba(255,225,120,0)'); c.fillStyle = gl; c.fillRect(sx - 50, ty - 60, 100, 100); }
    drawCrown(c, sx, cy, Math.min(1.5, dx / 40));
  }

// --- June view: the illustration panel above the timeline --------------------------------------------------------
const predicting = () => (S.stop === 1 || S.stop === 2) && S.pj[S.stop] === null;
function drawJune(c, w, h) {
  const hh = h - 54, t = now() - S.stopT0;
  if (predicting()) {
    const g = c.createLinearGradient(0, 0, 0, hh); g.addColorStop(0, '#efe3c7'); g.addColorStop(1, '#e2d2ad'); rr(c, 0, 0, w, hh, 18); c.fillStyle = g; c.fill();
    c.font = '500 120px "EB Garamond", Georgia, serif'; c.fillStyle = 'rgba(110,80,40,.22)'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', w / 2, hh * 0.5);
    return;
  }
  if (S.stop === 0) drawHall(c, 0, 0, w, hh, { labels: true });
  else if (S.stop === 1) { const k = eIO(t / 0.9); drawHall(c, 0, 0, w, hh, { labels: true, dimTop: k, glow3: k, banner: k }); }
  else if (S.stop === 2) drawCourt(c, 0, 0, w, hh, { t0: S.stopT0 + 0.3, spot: 0, name: false });
  else if (S.stop === 3) { const j = eIO((t - 0.3) / 1.8); drawHall(c, 0, 0, w, hh, { labels: true, j, banner: c01((j - 0.85) / 0.15) }); }
  else drawBastille(c, 0, 0, w, hh, t);
}

// --- one animation loop -----------------------------------------------------------------------------------------
const livePill = (s) => { if (S.lp !== s) { S.lp = s; const p = $('pill'); p.style.display = ''; p.textContent = s; } };
canvasLoop($('cv'), (c, w, h, dt) => {
  CW = w;
  const v = lab.view;
  if (S.sec === 'sat') {
    const tt = S.oathT0 < 0 ? -1 : now() - S.oathT0, spot = eOut((tt - 1.9) / 0.8);
    const up = drawCourt(c, 0, 0, w, h, { t0: S.oathT0 < 0 ? null : S.oathT0, spot, name: true });
    if (tt > 0) livePill(`✋ ${up}`);
    if (tt > 2 && !S.oathShown) { S.oathShown = true; render(); }
  } else if (S.sec === 'ladder') drawLadder(c, 0, 0, w, h, now() - S.ladT0);
  else if (v === 'crowd') drawCrowd(c, w, h, dt);
  else if (v === 'vote') drawVote(c, w, h);
  else drawJune(c, w, h);
});

// --- controls --------------------------------------------------------------------------------------------------
const free = () => S.p2 !== null;
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const startSort = () => { S.sortOn = true; S.sortP = 0; S.sortDone = false; S.tax = false; S.taxP = 0; sfx.snap(); };
const startRun = (mode, instant) => { S.run = { mode, t0: now() + 0.15, instant, done: instant }; S.lv = null; };
function goStop(i) { S.stop = i; S.reach = Math.max(S.reach, i); S.stopT0 = now(); sfx.click(); render(); }

function answer(kind, i) {
  const t = T[lang];
  if (kind === 'share') { S.pc = i; startSort(); (i === 0 ? sfx.good : sfx.bad)(); }
  else if (kind === 'p1') { S.p1 = i; S.vd = 'p1'; startRun('estate', false); (i === 1 ? sfx.good : sfx.bad)(); }
  else if (kind === 'p2') { S.p2 = i; S.vd = 'p2'; startRun('head', false); (i === 0 ? sfx.good : sfx.bad)(); }
  else if (kind === 'stop') { S.pj[S.stop] = i; S.stopT0 = now(); (i === t.stops[S.stop].ok ? sfx.good : sfx.bad)(); }
  render(); showStage();
}
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-i]'); if (!b || !S.ask) return;
  answer(S.ask.kind, +b.dataset.i);
});
tlEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-s]'); if (!b || b.disabled) return;
  const i = +b.dataset.s; if (i !== S.stop && i <= S.reach) goStop(i);
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'sort') startSort();
  else if (a === 'tax') { S.tax = !S.tax; S.taxP = 0; S.lp = null; sfx.click(); }
  else if (a === 'rule') {
    const m = b.dataset.m; if (m === S.mode || (m === 'head' && S.p1 === null)) return;
    S.mode = m; sfx.click();
    if (free()) { startRun(m, true); S.vd = 'free'; }
    else if (m === 'head') S.run = null;
    else startRun('estate', true);
  }
  else if (a === 'run') { startRun(S.mode, false); sfx.click(); }
  else if (a === 'next') { if (S.stop >= 4) { S.stop = 0; S.reach = 0; S.pj = [null, null, null, null, null]; S.stopT0 = now(); sfx.click(); } else { goStop(S.stop + 1); return; } }
  else if (a === 'sec') {
    const k = b.dataset.k; if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.lp = null; sfx.click();
    if (S.sec === 'sat') { S.oathT0 = -1; S.oathShown = false; }
    if (S.sec === 'ladder') S.ladT0 = now();
  }
  else if (a === 'secgo') {
    if (S.sec === 'sat') { S.oathT0 = now(); S.oathShown = false; S.lp = null; sfx.good(); }
    else if (S.sec === 'ladder') { S.ladT0 = now(); sfx.click(); }
  }
  render();
});
$('n3').addEventListener('input', (ev) => {
  S.third = +ev.target.value; S.vd = 'free';
  if (free()) startRun(S.mode, true);
  render();
});

// --- one render per change: controls, readout and the state card ------------------------------------------------
const vd = (ok, title, text, hint) => `${title ? `<div class="v ${ok ? 'ok' : 'no'}">${esc(title)}</div>` : ''}${text ? `<p>${esc(text)}</p>` : ''}${hint ? `<p class="hint">${esc(hint)}</p>` : ''}`;
function askFor() {
  const t = T[lang], v = lab.view;
  if (S.sec) return null;
  if (v === 'crowd' && S.pc === null) return { kind: 'share', q: t.qShare, opts: t.shareOpts, pos: 'bot' };
  if (v === 'vote') {
    if (S.mode === 'estate' && S.p1 === null) return { kind: 'p1', q: t.q1, opts: t.q1Opts, pos: 'bot' };
    if (S.mode === 'head' && S.p1 !== null && S.p2 === null) return { kind: 'p2', q: t.q2, opts: t.q2Opts, pos: 'bot' };
  }
  if (v === 'june' && predicting()) { const s = t.stops[S.stop]; return { kind: 'stop', q: s.q, opts: s.opts, pos: 'top' }; }
  return null;
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  S.lv = null; S.lp = null;
  document.body.dataset.v = v;
  $('secCrowd').style.display = !sec && v === 'crowd' ? '' : 'none';
  $('secVote').style.display = !sec && v === 'vote' ? '' : 'none';
  $('secJune').style.display = !sec && v === 'june' ? '' : 'none';
  $('secSec').style.display = sec ? '' : 'none';
  S.ask = askFor();
  askEl.style.display = S.ask ? '' : 'none';
  askEl.className = `te-ask card ${S.ask ? S.ask.pos : 'bot'}`;
  if (S.ask) askEl.innerHTML = `<div class="q">${esc(S.ask.q)}</div><div class="opts">${S.ask.opts.map((o, i) => `<button type="button" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  tlEl.style.display = !sec && v === 'june' ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('sat', '✋') + sc('ladder', '🪜');
  if (sec) renderSecret(t); else if (v === 'crowd') renderCrowd(t); else if (v === 'vote') renderVote(t); else renderJune(t);
  lab.setFacts(t.facts[v]);
}
function renderCrowd(t) {
  lab.setGlow('rgba(196, 139, 60, .26)');
  $('bSort').textContent = t.sort; $('bSort').disabled = S.pc === null;
  $('bTax').textContent = t.pays; $('bTax').disabled = !S.sortDone; $('bTax').classList.toggle('on', S.tax);
  if (S.pc === null) {
    lab.setReadout(t.people(NF), '', '', '#9b4a2f');
    lab.setState({ emo: '👥', title: t.state.crowd0[0], lead: t.state.crowd0[1], body: '', extra: '' });
    $('vdCrowd').innerHTML = '';
    return;
  }
  const right = S.pc === 0;
  lab.setReadout(t.people(NF), t.shares.join(' · '), S.tax ? t.sacks(0) : '', '#9b4a2f');
  $('vdCrowd').innerHTML = vd(right, right ? t.ok : t.no, t.exShare);
  if (S.tax) lab.setState({ emo: '💰', title: t.state.crowdTax[0], lead: t.state.crowdTax[1], body: '', extra: '' });
  else lab.setState({ emo: right ? '✅' : '🤔', title: right ? t.ok : t.no, lead: t.exShare, body: '', extra: '' });
}
function renderVote(t) {
  lab.setGlow('rgba(42, 75, 155, .3)');
  const mode = S.mode, fr = free(), asking = !!S.ask;
  $('ruleSeg').innerHTML = [['estate', t.perEstate], ['head', t.perHead]].map(([m, l]) => `<button data-act="rule" data-m="${m}" class="${m === mode ? 'on' : ''}"${m === 'head' && S.p1 === null ? ' disabled' : ''}>${esc(l)}</button>`).join('');
  $('bRun').textContent = t.run; $('bRun').style.display = S.p1 !== null && !asking ? '' : 'none';
  $('slBox').style.display = fr ? '' : 'none';
  $('slLbl').textContent = t.thirdN; $('slVal').textContent = S.third; $('slTick').textContent = t.mark1789;
  if ($('n3').value !== String(S.third)) $('n3').value = S.third;
  const run = S.run, done = !!run && run.done, rule = mode === 'estate' ? t.perEstate : t.perHead;
  const r = done ? resultOf(run.mode, S.third) : null;
  const winText = r ? (r.third === null ? t.tie : r.third ? t.wins(lc(t.estates.third)) : t.winsOthers) : '';
  const color = !r ? '#2a4b9b' : r.third === null ? '#7a6420' : r.third ? '#1f7a4f' : '#8a2c24';
  if (!run) lab.setReadout('?', rule, '', '#2a4b9b');
  else if (!done) lab.setReadout(t.tally(0, 0), rule, '', '#2a4b9b');
  else lab.setReadout(t.tally(r.a, r.b), rule, winText, color);
  let html = '';
  if (S.vd === 'p1' && S.p1 !== null) html = vd(S.p1 === 1, S.p1 === 1 ? t.ok : t.no, t.ex1, mode === 'estate' ? t.switchHint : '');
  else if (S.vd === 'p2' && S.p2 !== null) html = vd(S.p2 === 0, S.p2 === 0 ? t.ok : t.no, t.ex2, t.freeHint);
  else if (S.vd === 'free') html = vd(true, '', '', t.freeHint);
  $('vdVote').innerHTML = html;
  if (!done) lab.setState({ emo: '🗳️', title: t.state.vote0[0], lead: t.state.vote0[1], body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  else {
    const lead = S.third === N3 ? (run.mode === 'estate' ? t.ex1 : t.ex2) : t.tally(r.a, r.b);
    lab.setState({ emo: '🗳️', title: winText, lead, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  }
}
function renderJune(t) {
  lab.setGlow('rgba(168, 116, 42, .28)');
  const i = S.stop, s = t.stops[i], pr = predicting();
  tlEl.innerHTML = t.tl.map((l, k) => `<button type="button" data-s="${k}" class="${k === i ? 'on' : k <= S.reach ? 'done' : ''}"${k > S.reach ? ' disabled' : ''}>${esc(l)}</button>`).join('');
  $('bNext').textContent = i >= 4 ? t.replay : t.next; $('bNext').disabled = pr;
  lab.setReadout(esc(s.d), `${i + 1} / 5`, '', '#a8742a');
  $('stText').textContent = pr ? '' : s.t;
  const guess = S.pj[i];
  $('vdJune').innerHTML = guess !== null && s.q ? vd(guess === s.ok, guess === s.ok ? t.ok : t.no, '', '') : '';
  if (pr) lab.setState({ emo: '🤔', title: s.q, lead: '', body: '', extra: '' });
  else if (i === 0) lab.setState({ emo: '📅', title: t.state.june0[0], lead: t.state.june0[1], body: '', extra: '' });
  else lab.setState({ emo: i === 1 ? '📜' : i === 2 ? '✋' : i === 3 ? '🤝' : '🏰', title: guess !== null && s.q ? `${guess === s.ok ? t.ok : t.no} ${s.d}` : s.d, lead: s.t, body: '', extra: '' });
}
function renderSecret(t) {
  const k = S.sec;
  lab.setGlow('rgba(224, 178, 58, .3)');
  $('bSecGo').textContent = k === 'sat' ? t.swear : t.replay;
  if (k === 'sat') {
    lab.setReadout('576 + 1', t.people(577), '', '#8a6a1a');
    lab.setState({ emo: '✋', title: t.secrets.sat[0], lead: S.oathShown ? t.satText : t.secrets.sat[1], body: '', extra: '' });
  } else {
    lab.setReadout('1789 → 1804', '', '', '#8a6a1a');
    lab.setState({ emo: '🪜', title: t.secrets.ladder[0], lead: t.ladderText, body: '', extra: '' });
  }
}
render();
</script>
