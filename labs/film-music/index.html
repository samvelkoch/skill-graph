function drawMood(c, w, h, time) {
  const Tm = sceneT();

    // the child
    const walk = e3(cl((Tm - 0.2) / 4.4)), moving = Tm > 0.2 && Tm < 4.6 ? Math.min(1, (Tm - 0.2) * 3, (4.6 - Tm) * 3) : 0;
    const rec = e3(cl((Tm - JUMP) / 0.35)), relax = e3(cl((Tm - 7.6) / 1.5));

    if (Tm >= JUMP + 0.5 && Tm < JUMP + 0.75) { const q = Math.sin(Math.PI * (Tm - JUMP - 0.5) / 0.25); sy = 1 - 0.1 * q; sx = 1 + 0.08 * q; }

    const armUp = e3(cl((Tm - JUMP) / 0.2)) * (1 - e3(cl((Tm - 7) / 0.8)));

    // the cat
    if (Tm >= JUMP && Tm < JUMP + 0.7) {
      const u = (Tm - JUMP) / 0.7, air = 52 * 4 * u * (1 - u), by = lerp(212, 228, u), cx = lerp(226, 186, u);
      const dy = 16 - 208 * (1 - 2 * u), rot = clamp(Math.atan2(-dy * 0.35, 33), -0.7, 0.7);

      drawCat(c, 186, 228, { face: -1, pose: 'sit', sx: 1 + 0.2 * q, sy: 1 - 0.22 * q, tail: Tm * 2.6, blink: mod(Tm, 3.1) > 2.95 ? 1 : 0, look: 0.6 });

function drawBuild(c, w, h, time) {

    if (H.phase === 'round') {

        c.save(); c.translate(236, 228); c.scale(Math.max(0.01, sc), Math.max(0.01, sc)); c.translate(-236, -228);
        if (key === 'kid') drawKid(c, 236, 228, {}); else if (key === 'cat') drawCat(c, 236, 228, { tail: time * 2 }); else drawOwl(c, 236, 228, { blink: mod(time, 3.4) > 3.25 ? 1 : 0 });

}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = b.dataset.k;
  if (act === 'guess') { M.guess = k; (k === 'no' ? sfx.good : sfx.click)(); render(); showStage(); return; }
  if (act === 'play') { if (M.cur === k && M.playing) { stopMusic(); M.playing = false; M.ended = false; render(); } else playMood(k); return; }
  if (act === 'face') { if (M.cur) { M.rate[M.cur] = +k; sfx.click(); } render(); return; }
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (k === 'piano') playMood('piano');
    else { M.leit = !M.leit; playMood(M.cur && M.cur !== 'piano' ? M.cur : 'scary'); }
    return;
  }
  if (act === 'scene') { B.scene = k; sfx.click(); render(); return; }
  if (act === 'mode') { B.major = k === '1'; sfx.click(); render(); return; }
  if (act === 'bplay') { if (B.playing) { stopMusic(); B.playing = false; } else startBuild(); render(); return; }
  if (act === 'hear') { H.heard[k] = true; playChar(k); render(); return; }
  if (act === 'start') { startStory(); render(); showStage(); return; }
  if (act === 'pick') {
    const r = H.rounds[H.ri]; H.guess = k; H.revealAt = performance.now() / 1000; H.done++;
    if (k === r.c) { H.score++; sfx.good(); } else sfx.bad();
    render(); showStage(); return;
  }
  if (act === 'again') { playRound(); return; }
  if (act === 'next') {
    H.ri++; H.guess = null;
    if (H.ri >= H.rounds.length) { H.phase = 'end'; stopMusic(); } else playRound();
    render(); return;
  }
});

  let html = '';
  if (!asked) {
    html = `<div class="fm-q">${esc(m.q)}</div><div class="fm-row"><button class="fm-btn" data-act="guess" data-k="yes">${esc(m.yes)}</button><button class="fm-btn" data-act="guess" data-k="no">${esc(m.no)}</button></div>`;
  } else {
    html = `<div class="fm-row">${three.map((k) => `<button class="fm-btn ${cur === k ? 'on' : ''}" data-act="play" data-k="${k}">${cur === k && M.playing ? '■' : emo[k]} ${esc(m.sName[k])}${M.rate[k] !== undefined ? ' ' + m.faces[M.rate[k]][0] : ''}</button>`).join('')}</div>`;
    if (M.ended && cur && cur !== 'piano' && M.rate[cur] === undefined) {
      html += `<div class="fm-lbl">${esc(m.rate)}</div><div class="fm-faces">${m.faces.map((f, i) => `<button class="fm-face" data-act="face" data-k="${i}"><span class="e">${f[0]}</span>${esc(f[1])}</button>`).join('')}</div>`;
    }
    const open = secret.unlocked();
    const sc = (k, e) => `<button class="chip secret ${open ? 'open' : ''} ${(k === 'piano' && cur === 'piano') || (k === 'leit' && M.leit) ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(m.chip[k])}` : '🔒 ???'}</button>`;
    html += `<div class="row2">${sc('piano', '🎹')}${sc('leit', '🎼')}</div>`;
  }
  $('secMood').innerHTML = html;
  lab.setFacts(asked ? [{ emo: '🎹', text: t.facts[0], src: SRC[0] }] : []);
  if (!asked) {
    lab.setReadout('?', '', '', ACC.mood); lab.setGlow(GLOW.build);
    lab.setState({ emo: '🤔', title: m.q, lead: m.lead0, body: '', extra: '' });
    return;
  }
  if (!cur) {
    lab.setReadout('♪', m.pickSub, '', ACC.mood); lab.setGlow(GLOW.scary);
    const right = M.guess === 'no';
    lab.setState({ emo: '🎬', title: right ? m.right : m.wrong, lead: right ? m.vRight : m.vWrong, body: '', extra: '' });
    return;
  }
  const info = MOOD[cur];
  lab.setReadout(info.bpm, m.bpmSub, cur === 'piano' ? m.live : info.minor ? m.keyMinor : m.keyMajor, ACC[cur]); lab.setGlow(GLOW[cur]);
  if (rated && !M.playing) {
    lab.setState({ emo: '🎭', title: m.doneT, lead: m.doneL, body: m.doneB(three.map((k) => `${emo[k]} ${m.faces[M.rate[k]][0]}`).join(' · ')), extra: '' });
  } else {
    const body = cur === 'piano' ? m.infoPiano : M.leit ? m.infoLeit : '';
    lab.setState({ emo: emo[cur], title: m.sTitle[cur], lead: m.sInfo[cur], body: cur === 'piano' && M.leit ? `${m.infoPiano} ${m.infoLeit}` : body, extra: '' });
  }
}

function renderBuild(t) {
  const b = t.b, mk = moodKey(B.bpm, B.major), regW = b.regW[B.reg < 2 ? 0 : B.reg > 2 ? 2 : 1];
  lab.setGlow(GLOW.build);
  $('bScenes').innerHTML = ['chase', 'sunrise', 'sneak'].map((k) => `<button class="chip ${B.scene === k ? 'on' : ''}" data-act="scene" data-k="${k}" style="min-height:40px">${{ chase: '🏃', sunrise: '🌅', sneak: '🤫' }[k]} ${esc(b.scenes[k])}${B.fit[k] ? ' ✔' : ''}</button>`).join('');
  $('lT').textContent = b.tempo; $('vT').textContent = `${B.bpm} ${b.unit}`; $('eTL').textContent = b.slow; $('eTR').textContent = b.fast;
  $('lR').textContent = b.reg; $('vR').textContent = regW; $('eRL').textContent = b.low; $('eRR').textContent = b.high;
  if ($('sT').value !== String(B.bpm)) $('sT').value = B.bpm;
  if ($('sR').value !== String(B.reg)) $('sR').value = B.reg;
  $('bMode').innerHTML = [[1, b.major], [0, b.minor]].map(([k, l]) => `<button data-act="mode" data-k="${k}" class="${!!k === B.major ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('bPlay').textContent = B.playing ? b.stop : b.play;
  $('bPlay').classList.toggle('pulse', !B.heard);
  const fit = fitOf(B.scene);
  if (fit && B.heard) B.fit[B.scene] = true;
  lab.setReadout(B.bpm, `${b.unit} · ${B.major ? b.major : b.minor} · ${regW}`, b.pill[mk], ACC.build);
  const reg = B.reg <= 1 ? b.regLow : B.reg >= 3 ? b.regHigh : '';
  let title, lead;
  if (!B.heard) { title = b.scenes[B.scene]; lead = b.press; }
  else if (fit) { title = b.fitT[B.scene]; lead = B.scene === 'chase' ? (B.major ? b.chaseMajor : b.chaseMinor) : b.usually(b.mood[mk]); }
  else { title = b.noFit; lead = b.hint(hintOf(B.scene).map((k) => b.pieces[k])); }
  lab.setState({ emo: { chase: '🏃', sunrise: '🌅', sneak: '🤫' }[B.scene], title, lead, body: B.heard ? `${b.usually(b.mood[mk])} ${reg}`.trim() : '', extra: '' });
  lab.setFacts(['chase', 'sunrise', 'sneak'].every((k) => B.fit[k]) ? [{ emo: '🎚️', text: t.facts[2], src: SRC[2] }] : []);
}

function renderTheme(t) {
  const th = t.th, n = H.rounds.length || 5;
  lab.setGlow(GLOW.theme);
  let html = '';
  if (H.phase === 'meet') {
    const k = KEYS.filter((x) => H.heard[x]).length;
    html = `<div class="fm-cards">${KEYS.map((key) => `<button class="fm-card ${H.heard[key] ? 'heard' : ''}" data-act="hear" data-k="${key}"><span class="e">${MOTIFS[key].emo}</span><b>${esc(th.chars[key][0])}${H.heard[key] ? ' ✓' : ''}</b><i>${esc(th.chars[key][1])}</i></button>`).join('')}</div>
      <div class="row2"><button class="fm-btn go ${k === 3 ? 'pulse' : ''}" data-act="start" ${k < 3 ? 'disabled' : ''}>${esc(th.start)}</button><span class="fm-note">${esc(th.heard(k))}</span></div>`;
    lab.setReadout(`${k}/3`, th.heardSub, '', ACC.theme);
    lab.setState({ emo: '🎼', title: th.meetT, lead: th.meetL, body: '', extra: '' });
    lab.setFacts([]);
  } else if (H.phase === 'round') {
    const r = H.rounds[H.ri], done = H.guess !== null, last = H.ri === n - 1;
    html = `<div class="fm-q">${esc(th.q)}</div><div class="fm-row">${KEYS.map((key) => {
      const cls = done ? (key === r.c ? 'good' : key === H.guess ? 'bad' : '') : '';
      return `<button class="fm-btn ${cls}" data-act="pick" data-k="${key}" ${done ? 'disabled' : ''}>${MOTIFS[key].emo} ${esc(th.chars[key][0])}</button>`;
    }).join('')}</div>
      <div class="row2"><button class="chip" data-act="again" style="min-height:40px">${esc(th.again)}</button>${done ? `<button class="fm-btn go" data-act="next">${esc(last ? th.finish : th.next)}</button>` : ''}</div>`;
    lab.setReadout(`${H.ri + 1}/${n}`, th.roundSub, `⭐ ${H.score}`, ACC.theme);
    if (!done) lab.setState({ emo: '🌙', title: th.roundOf(H.ri + 1, n), lead: r.d ? th.disL : th.roundL, body: '', extra: '' });
    else {
      const ok = H.guess === r.c;
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? th.ok : th.no(th.of[r.c]), lead: r.d ? th.rLD : th.rL, body: '', extra: '' });
    }
    lab.setFacts(done ? [{ emo: '🎼', text: t.facts[1], src: SRC[1] }] : []);
  } else {
    html = `<div class="row2" style="margin-top:0"><button class="fm-btn go" data-act="start">${esc(th.restart)}</button></div>`;
    lab.setReadout(`${H.score}/${n}`, th.roundSub, '', ACC.theme);
    lab.setState({ emo: '🏆', title: th.endT(H.score, n), lead: th.endL, body: '', extra: '' });
    lab.setFacts([{ emo: '🎼', text: t.facts[1], src: SRC[1] }]);
  }
  $('secTheme').innerHTML = html;
}
render();
</script>
</body>
</html>
