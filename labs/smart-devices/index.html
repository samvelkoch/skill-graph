function update(dt, time) {

function tapDevice(id, fromCanvas) {
  const v = lab.view;
  if (v === 'change' && S.phase === 'pick') { if (S.sel.has(id)) S.sel.delete(id); else S.sel.add(id); S.focus = id; sfx.tick(); }
  else {
    if (v !== 'make') S.focus = id;
    if (fromCanvas || v === 'sense') manual(id);
  }
  render();
}
function manual(id) { if (id === 'lamp') tapLamp(); else if (id === 'toaster') pressToaster(); else if (id === 'clock') windClock(); }

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'chg') { const k = b.dataset.k; if (S.chg.has(k)) S.chg.delete(k); else S.chg.add(k); sfx.tick(); }
  else if (act === 'dev') { if (v === 'sense') { S.focus = b.dataset.id; S.stage = -1; sfx.tick(); } else tapDevice(b.dataset.id, false); return v === 'sense' ? render() : undefined; }
  else if (act === 'go') apply();
  else if (act === 'next') newRound();
  else if (act === 'walk') startWalk();
  else if (act === 'clap') clap();
  else if (act === 'crumbs') spill();
  else if (act === 'sensor') { S.rule.sensor = S.rule.sensor === b.dataset.k ? null : b.dataset.k; S.fires = 0; S.ruleAt = -99; S.senseAt = -99; sfx.click(); S.prevDark = S.night > 0.58; }
  else if (act === 'action') { S.rule.action = S.rule.action === b.dataset.k ? null : b.dataset.k; S.fires = 0; S.ruleAt = -99; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.cliffPh = ''; sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'rN') S.nightT = +ev.target.value / 100;
  else if (id === 'rT') S.tempT = +ev.target.value;
  else if (id === 'rB') S.bt = +ev.target.value / 100;
  else return;
  render();
});

function apply() {
  if (!S.chg.size) return;
  const react = new Set([...S.chg].map((k) => REACT[k])), res = {}; let k = 0;
  DEVS.forEach((d) => {
    const sel = S.sel.has(d.id), re = react.has(d.id);
    res[d.id] = sel && re ? 'ok' : !sel && re ? 'miss' : sel && !re ? 'bad' : 'rest';
    if (sel === re) k++;
  });
  S.res = res; S.last = k; S.phase = 'done'; S.round++;
  if (S.chg.has('dark')) S.nightT = 1;
  if (S.chg.has('cold')) S.tempT = 8;
  if (S.chg.has('walk')) startWalk();
  if (S.chg.has('clap')) clap();
  if (S.chg.has('crumbs')) spill();
  syncSliders(); (k === 8 ? sfx.good : sfx.bad)(); showStage();
}
function newRound() { resetWorld(); S.sel = new Set(); S.chg = new Set(); S.phase = 'pick'; S.res = null; sfx.click(); }
function onView() { if (lab.view === 'change' && S.phase === 'pick') { resetWorld(); } S.stage = -1; S.sec = null; render(); }
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

// --- render --------------------------------------------------------------------------------------------------------
const names = (ids) => ids.map((id) => T[lang].dev[id]).join(', ');
function paintSense() {
  if (lab.view !== 'sense') return;
  const t = T[lang], d = DEVS.find((x) => x.id === S.focus), dv = t.dv[d.id], st = stageOf(d.id), steps = t.sn.steps;
  const cells = d.smart ? [dv[0], dv[1], dv[2]] : [t.sn.none, t.sn.noRule, dv[2]];
  const icons = d.smart ? ['👁️', '🧠', '⚙️'] : ['🚫', '🚫', '✋'];
  $('strip').innerHTML = [0, 1, 2].map((i) => `<div class="sd-st ${st > i ? 'lit' : ''} ${d.smart ? '' : 'off'}"><span class="e">${icons[i]}</span><b>${esc(steps[i])}</b><span>${esc(cells[i])}</span></div>`)
    .join('<div class="sd-ar">→</div>');
  lab.setReadout(d.smart ? `${st}/3` : st ? '✋' : '—', d.smart ? (st ? steps[st - 1] : t.sn.rdWait) : t.sn.rdOff, '', '#6fe3ff');
  let lead;
  if (!d.smart) lead = st ? dv[2] : t.sn.dead;
  else if (!st) lead = t.sn.wait;
  else lead = `${steps[st - 1]}: ${dv[st - 1]}`;
  lab.setState({ emo: d.emo, title: t.dev[d.id], lead, body: d.smart ? '' : '', extra: '' });
}
function render() {
  const t = T[lang], v = lab.view, ph = S.phase;
  lab.setGlow(S.night > 0.5 ? 'rgba(70, 90, 200, .28)' : 'rgba(255, 190, 100, .24)');
  const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
  show('blkChg', v === 'change'); show('blkDev', v === 'change' || v === 'sense'); show('blkStrip', v === 'sense'); show('blkMake', v === 'make');
  show('blkGo', v === 'change'); show('blkWorld', v !== 'change' || ph === 'done'); show('blkBt', S.sec === 'bm');
  // world controls
  $('lN').textContent = '☀️ ' + t.w.night + ' 🌙'; $('vN').textContent = '';
  $('lT').textContent = t.w.temp; $('vT').textContent = `${Math.round(S.tempT)}°C`;
  $('bWalk').textContent = S.walk === 'inside' || S.walk === 'out' ? t.w.walkOut : t.w.walkIn; $('bClap').textContent = t.w.clap; $('bCrumbs').textContent = t.w.crumbs;
  $('lB').textContent = t.bm.slider + ' (' + t.bm.cold + ' → ' + t.bm.warm + ')'; $('vB').textContent = `${Math.round(8 + S.bt * 20)}°C`;
  // secrets
  const open = secret.unlocked();
  const sc = (k, emo, i) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.sec[i][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('bm', '🌡️', 'a') + sc('cl', '🤖', 'b');
  lab.setFacts([{ emo: v === 'change' ? '🚪' : v === 'sense' ? '📱' : '🌡️', text: t.facts[v], src: t.src[v] }]);
  if (S.sec) return renderSecret(t);
  if (v === 'change') renderChange(t); else if (v === 'sense') { S.stage = stageOf(S.focus); paintSense(); renderDevChips(t); } else renderMake(t);
}
function renderDevChips(t) {
  const v = lab.view, done = v === 'change' && S.phase === 'done';
  $('devChips').innerHTML = DEVS.map((d) => {
    let cls = '';
    if (v === 'change') cls = done ? (S.res[d.id] === 'rest' ? '' : S.res[d.id]) : S.sel.has(d.id) ? 'on' : '';
    else cls = S.focus === d.id ? 'on' : '';
    return `<button class="sd-chip ${cls} ${done ? 'dim' : ''}" data-act="dev" data-id="${d.id}"${done ? ' disabled' : ''}><span class="e">${d.emo}</span>${esc(t.dev[d.id])}</button>`;
  }).join('');
}
function renderChange(t) {
  const c = t.chg, done = S.phase === 'done';
  $('q1').textContent = c.q1; $('q2').textContent = c.q2;
  $('chgChips').innerHTML = CHG.map(([k, e]) => `<button class="sd-chip ${S.chg.has(k) ? 'on' : ''} ${done ? 'dim' : ''}" data-act="chg" data-k="${k}"${done ? ' disabled' : ''}><span class="e">${e}</span>${esc(c[k])}</button>`).join('');
  renderDevChips(t);
  $('goB').textContent = done ? c.next : c.go; $('goB').dataset.act = done ? 'next' : 'go'; $('goB').disabled = !done && !S.chg.size;
  if (!done) {
    lab.setReadout('?', c.rd0, '', '#ffd36b');
    lab.setState({ emo: '🤔', title: c.pick0, lead: c.pick0b, body: '', extra: '' });
    return;
  }
  const react = DEVS.filter((d) => S.res[d.id] === 'ok' || S.res[d.id] === 'miss').map((d) => d.id);
  const miss = DEVS.filter((d) => S.res[d.id] === 'miss').map((d) => d.id), bad = DEVS.filter((d) => S.res[d.id] === 'bad').map((d) => d.id);
  const perfect = S.last === 8;
  lab.setReadout(`${S.last}/8`, c.rdK, c.round(S.round), perfect ? '#3ddc97' : '#ffb04a');
  lab.setState({
    emo: perfect ? '✅' : '🤔', title: perfect ? c.right : c.part(S.last), lead: `${c.noticed}: ${names(react)}.`,
    body: [miss.length ? `${c.missed}: ${names(miss)}.` : '', bad.length ? `${c.extra}: ${names(bad)}.` : '', c.idea].filter(Boolean).join(' '), extra: '',
  });
}
function renderMake(t) {
  const m = t.mk, r = S.rule;
  $('mq1').textContent = m.q1; $('mq2').textContent = m.q2;
  $('senChips').innerHTML = ['dark', 'move', 'sound'].map((k) => `<button class="sd-chip ${r.sensor === k ? 'on' : ''}" data-act="sensor" data-k="${k}">${esc(m.s[k])}</button>`).join('');
  $('actChips').innerHTML = ['lamp', 'toaster', 'door', 'speaker', 'vacuum'].map((k) => `<button class="sd-chip ${r.action === k ? 'on' : ''}" data-act="action" data-k="${k}">${esc(m.a[k])}</button>`).join('');
  $('actChips').style.gridTemplateColumns = 'repeat(3, 1fr)';
  const sTxt = r.sensor ? `<b>${esc(m.st[r.sensor])}</b>` : `<u>${m.blank}</u>`, aTxt = r.action ? `<b>${esc(m.at[r.action])}</b>` : `<u>${m.blank}</u>`;
  $('ruleBox').innerHTML = `${esc(m.ifw)} ${sTxt}${lang === 'en' ? '' : ','} ${esc(m.thenw)} ${aTxt}`;
  $('ruleBox').classList.toggle('hit', S.ruleHit);
  lab.setReadout(r.sensor && r.action ? `×${S.fires}` : '?', r.sensor && r.action ? m.rd : '', '', '#ffd36b');
  let st;
  if (!r.sensor && !r.action) st = { emo: '💡', title: m.n0[0], lead: m.n0[1] };
  else if (!r.sensor || !r.action) st = { emo: '🧩', title: m.n1[0], lead: m.n1[1] };
  else if (r.action === 'lamp') st = { emo: '✨', title: m.nLamp[0], lead: m.nLamp[1], body: m.test };
  else st = { emo: '🤪', title: m.nSilly[0], lead: m.nSilly[1], body: m.test };
  lab.setState({ body: '', extra: '', ...st });
}
function renderSecret(t) {
  if (S.sec === 'bm') {
    const closed = S.bt * 20 + 8 < 18, n = closed ? t.bm.nOn : t.bm.nOff;
    lab.setReadout(closed ? '🔥' : '❄️', closed ? t.bm.rdOn : t.bm.rdOff, '', '#ffb070');
    lab.setState({ emo: '🌡️', title: n[0], lead: n[1], body: '', extra: '' });
  } else {
    const ph = S.cliffPh || 'drive', n = t.cl.n[ph];
    lab.setReadout(ph === 'lost' ? '✕' : '✓', ph === 'lost' ? t.cl.rdNo : t.cl.rdOk, '', ph === 'lost' ? '#ff6b6b' : '#6fe3ff');
    lab.setState({ emo: '🤖', title: n[0], lead: n[1], body: '', extra: '' });
  }
}
syncSliders();
render();
</script>
</body>
</html>
