// --- camera and drawing helpers ------------------------------------------------------------------------------

const X = (x) => cam.w / 2 + (x - cam.cx) * cam.s;

function path(ctx, pts) { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); }

// --- scenes -------------------------------------------------------------------------------------------------
function slideU(now) {
  const s = S.s;
  if (!s.go) return 0;
  const a = now - s.t0;
  if (!s.done) return back(seg(a, 1.5, 2.7));
  const P = 4.8, c = (((now - s.loop) % P) + P) % P;
  let u = c < 1.2 ? 0 : c < 2.3 ? back(seg(c, 1.2, 2.3)) : c < 3.8 ? 1 : 1 - eio(seg(c, 3.8, 4.8));
  if (s.blend) {
    const k = eio(seg(now, s.blend.t, s.blend.t + 0.35));
    u = lerp(s.blend.from, u, k);
    if (k >= 1) s.blend = null;
  }
  s.ud = u;
  return u;
}
function sceneSlide(ctx, now, L) {
  const s = S.s, ln = s.lean, tx = T[lang], u = slideU(now);
  const a = s.go ? now - s.t0 : -1;
  const hl = !s.go ? 0 : s.done ? 1 : seg(a, 1.0, 1.5);
  const colB = !s.go ? 0 : s.done ? 1 : seg(a, 1.0, 1.4);
  const cutP = s.go && !s.done ? eout(seg(a, 0.2, 1.0)) : 0;
  const whole = !s.go || a < 1.0;
  if (whole) card(ctx, [[0, 0], [6, 0], [6 + ln, 4], [ln, 4]], TEAL);
  else {
    card(ctx, [[ln, 0], [6, 0], [6 + ln, 4], [ln, 4]], TEAL);
    if (ln > 0) card(ctx, [[6 * u, 0], [ln + 6 * u, 0], [ln + 6 * u, 4]], mixPal(TEAL, CORAL, colB), { lift: c01(4 * u * (1 - u)) });
  }
  if (s.go && !s.done && hl < 1) {
    line(ctx, [ln, 4], [ln, 4 - 4 * cutP], '#ffffff', 2.5, [7, 6], 1 - hl);
    if (a < 1.0 && cutP > 0) L.push({ kind: 'emoji', text: '✂️', x: ln, y: 4 - 4 * cutP, dy: -2 });
  }
  if (hl > 0) {
    line(ctx, [ln, 0], [ln, 4], '#ffd166', 2.5, [7, 5], hl);
    corner(ctx, ln, 0, 1, 1, '#ffd166', hl);
    L.push({ text: `4 ${tx.cm}`, x: ln, y: 2, dx: -30, col: '#ffd166', a: hl });
  }
  const slant = dec(Math.round(Math.hypot(4, ln) * 10) / 10), len = Math.hypot(4, ln);
  L.push({ text: `6 ${tx.cm}`, x: 3, y: 0, dy: 20 });
  L.push({ text: `${slant} ${tx.cm}`, x: 6 + ln / 2 + (4 / len) * 0.9, y: 2 - (ln / len) * 0.9, a: 1 - c01(2 * u) });
}
function sceneHalf(ctx, now, L, any) {
  const hs = S.h, p = hs.p, tx = T[lang], a = hs.go ? now - hs.t0 : -1;
  const tri = [[0, 0], [6, 0], [p, 4]], M = [(6 + p) / 2, 2];
  let theta = 0, cA = 0, lift = 0, hl = 1, pivot = 0;
  if (!any) {
    if (hs.done) { theta = Math.PI; cA = 1; hl = 1; }
    else if (hs.go) {
      cA = eout(seg(a, 0, 0.5)); theta = Math.PI * back(seg(a, 0.6, 1.9));
      lift = Math.max(seg(a, 0, 0.4) * (1 - seg(a, 1.7, 2.1)), Math.sin(Math.PI * seg(a, 0.6, 1.9)));
      hl = seg(a, 1.9, 2.4); pivot = seg(a, 0.3, 0.6) * (1 - seg(a, 1.8, 2.0));
    } else hl = 0;
  }
  card(ctx, tri, CORAL);
  if (cA > 0) {
    const c = Math.cos(theta), sn = Math.sin(theta);
    card(ctx, tri.map(([x, y]) => { const dx = x - M[0], dy = y - M[1]; return [M[0] + dx * c - dy * sn, M[1] + dx * sn + dy * c]; }), TEAL, { alpha: cA, lift });
  }
  if (pivot > 0.01) {
    const k = 1 / cam.s;
    ctx.save(); ctx.globalAlpha = pivot; ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(10,12,20,.7)'; ctx.lineWidth = 1.5 * k;
    ctx.beginPath(); ctx.arc(M[0], M[1], Math.max(0, 5 * k), 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();

function sceneL(ctx, now, L) {

  } else {
    const f = seg(a, 0.2, 0.8);

    ctx.save(); ctx.globalAlpha = f * 0.9;
    path(ctx, [[3, 3], [7, 3], [7, 5], [3, 5]]); ctx.fillStyle = 'rgba(255,138,101,.22)'; ctx.fill(); ctx.restore();
    line(ctx, [3, 5], [7, 5], CORAL[0], 2, [6, 5], f); line(ctx, [7, 5], [7, 3], CORAL[0], 2, [6, 5], f);
    L.push({ text: '7 × 5 = 35', x: 3.5, y: 1.5, a: f }, { text: '4 × 2 = 8', x: 5, y: 4, col: CORAL[0], a: f });
  }
  L.push({ text: `7 ${tx.cm}`, x: 3.5, y: 0, dy: 20 }, { text: `5 ${tx.cm}`, x: 0, y: 2.5, dx: -28 });
  if (m !== 'fill') {
    L.push({ text: `4 ${tx.cm}`, x: 5 + (m === 'down' ? gap : 0), y: 3, dy: -17 });
    L.push({ text: `2 ${tx.cm}`, x: 3, y: 4 + (m === 'across' ? gap : 0), dx: 30 });
  }
}
function sceneTangram(ctx, now, dt, L) {
  const g = S.g;
  TG_KEYS.forEach((k, i) => {
    const to = TG_POSE[g.fig][k], from = g.from[k];
    const pr = eio(seg(now - g.t0 - i * 0.07, 0, 0.9));
    const d = Math.atan2(Math.sin(to.a - from.a), Math.cos(to.a - from.a));
    g.cur[k] = { x: lerp(from.x, to.x, pr), y: lerp(from.y, to.y, pr), a: from.a + d * pr, lift: Math.sin(Math.PI * pr) };
  });
  for (const k of TG_KEYS) {
    const c = g.cur[k], hc = TG_HC[k], co = Math.cos(c.a), si = Math.sin(c.a);
    const pts = TG_HOME[k].map(([x, y]) => { const dx = x - hc[0], dy = y - hc[1]; return [c.x + dx * co - dy * si, c.y + dx * si + dy * co]; });
    card(ctx, pts, TG_PAL[k], { lift: c.lift });
    L.push({ kind: 'num', text: String(TG_AREA[k]), x: c.x, y: c.y });
  }
}

function boxFor() {
  if (S.sec === 'tangram') return [-1.6, 5.6, -1.6, 5.6];
  if (S.sec === 'any') return [-7.2, 13.2, -1.8, 5.9];
  if (lab.view === 'slide') return [-1.2, 11.2, -1.4, 5.9];
  if (lab.view === 'half') {
    const p = S.h.p;
    let x0 = Math.min(0, p) - 1.2, x1 = Math.max(6, 6 + p) + 1.2;
    if (x1 - x0 < 9) { const m = (x0 + x1) / 2; x0 = m - 4.5; x1 = m + 4.5; }
    return [x0, x1, -1.4, 5.9];
  }
  return [-1.5, 8.6, -1.5, 6.4];
}

function tick(now) {
  const s = S.s, h = S.h;
  if (s.go && !s.done && now - s.t0 >= 2.9) { s.done = true; s.loop = now - 2.3; (s.guess === 1 ? sfx.good : sfx.bad)(); render(); }
  if (h.go && !h.done && now - h.t0 >= 2.4) { h.done = true; sfx.snap(); (h.guess === 1 ? sfx.good : sfx.bad)(); render(); }
}

canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  cam.w = w; cam.h = h;
  tick(t);
  const b = boxFor(), s = Math.min(w / (b[1] - b[0]), h / (b[3] - b[2])), cx = (b[0] + b[1]) / 2, cy = (b[2] + b[3]) / 2;
  if (cam.snap || !cam.ok) { cam.s = s; cam.cx = cx; cam.cy = cy; cam.snap = false; cam.ok = true; }
  else { const k = 1 - Math.exp(-dt * 7); cam.s += (s - cam.s) * k; cam.cx += (cx - cam.cx) * k; cam.cy += (cy - cam.cy) * k; }
  // board and squared paper
  const bg = ctx.createRadialGradient(w * 0.4, h * 0.35, 10, w / 2, h / 2, Math.max(w, h) * 0.75);
  bg.addColorStop(0, '#242c3f'); bg.addColorStop(1, '#131824');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(230,225,210,.16)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = Math.floor(cam.cx - w / 2 / cam.s); x <= Math.ceil(cam.cx + w / 2 / cam.s); x++) { ctx.moveTo(X(x), 0); ctx.lineTo(X(x), h); }
  for (let y = Math.floor(cam.cy - h / 2 / cam.s); y <= Math.ceil(cam.cy + h / 2 / cam.s); y++) { ctx.moveTo(0, Y(y)); ctx.lineTo(w, Y(y)); }
  ctx.stroke();
  const L = [];
  ctx.save();
  ctx.translate(w / 2, h / 2); ctx.scale(cam.s, -cam.s); ctx.translate(-cam.cx, -cam.cy);
  if (S.sec === 'tangram') sceneTangram(ctx, t, dt, L);
  else if (S.sec === 'any') sceneHalf(ctx, t, L, true);
  else if (lab.view === 'slide') sceneSlide(ctx, t, L);
  else if (lab.view === 'half') sceneHalf(ctx, t, L, false);
  else sceneL(ctx, t, L);
  ctx.restore();
  drawLabels(ctx, w, h, L);
  drawLegend(ctx, w, h);
});

// drag the apex in the "Any triangle" secret
const cv = $('cv');
let drag = false;
const apexX = (ev) => { const r = cv.getBoundingClientRect(); return (ev.clientX - r.left - cam.w / 2) / cam.s + cam.cx; };
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec !== 'any') return;
  const r = cv.getBoundingClientRect();
  if (Math.hypot(ev.clientX - r.left - X(S.h.p), ev.clientY - r.top - Y(4)) < 32) { drag = true; cv.setPointerCapture(ev.pointerId); }
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  S.h.p = clamp(Math.round(apexX(ev) * 2) / 2, -6, 12); syncSliders(); render();
});
const endDrag = () => { drag = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls -------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function syncSliders() {
  const a = $('lean'), b = $('top');
  if (a) { a.value = S.s.lean; $('leanV').textContent = dec(S.s.lean); }
  if (b) { b.value = S.h.p; $('topV').textContent = dec(S.h.p); }
}
function toggleSec(k) {
  if (!secret.unlocked()) return secret.open();
  if (S.sec === k) { S.sec = null; lab.view = S.back; S.h.p = clamp(S.h.p, 0, 8); }
  else {
    if (!S.sec) S.back = lab.view;
    S.sec = k; lab.view = null;
    if (k === 'tangram') { S.g.fig = 'square'; S.g.from = JSON.parse(JSON.stringify(S.g.cur)); S.g.t0 = clock(); }
  }
  lab.renderChrome(); cam.snap = true; sfx.click(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'pick') {
    const i = +b.dataset.i;
    if (v === 'slide' && !S.s.go) S.s.guess = i; else if (v === 'half' && !S.h.go) S.h.guess = i; else if (v === 'lshape' && !S.l.mode) S.l.guess = i;
    sfx.click();
  } else if (act === 'go') {
    if (v === 'slide') { S.s.go = true; S.s.done = false; S.s.t0 = clock(); }
    else { S.h.go = true; S.h.done = false; S.h.t0 = clock(); }
    sfx.push(); showStage();
  } else if (act === 'cut') {
    const first = !S.l.mode;
    S.l.mode = b.dataset.m; S.l.t0 = clock(); sfx.push();
    if (first) (S.l.guess === 1 ? sfx.good : sfx.bad)();
    showStage();
  } else if (act === 'sec') return toggleSec(b.dataset.k);
  else if (act === 'fig') {
    S.g.from = JSON.parse(JSON.stringify(S.g.cur)); S.g.fig = b.dataset.f; S.g.t0 = clock(); sfx.snap();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'lean') {
    S.s.lean = +ev.target.value; S.s.blend = { from: S.s.ud ?? 1, t: clock() }; S.s.loop = clock(); sfx.tick();
  } else if (ev.target.id === 'top') { S.h.p = +ev.target.value; sfx.tick(); } else return;
  syncSliders(); render();
});

function chipsHtml(items, guess, locked, done) {
  return `<div class="cs-ans">${items.map((c, i) => `<button type="button" class="chip${i === guess ? ' on' : ''}${done && i === 1 ? ' good' : ''}${done && i === guess && i !== 1 ? ' bad' : ''}" data-act="pick" data-i="${i}"${locked ? ' disabled' : ''}>${esc(c)}</button>`).join('')}</div>`;
}
function sliderHtml(id, label, min, max, val, ends) {
  return `<div class="cs-sl"><label>${esc(label)} <b id="${id}V">${dec(val)}</b></label>
    <input id="${id}" class="big" type="range" min="${min}" max="${max}" step="0.5" value="${val}" style="--track:linear-gradient(90deg,#2bb3a3,#ff8a65)">
    <div class="cs-ends"><span>${ends[0]}</span><span>${ends[1]}</span></div></div>`;
}
function buildCtrl() {
  const tx = T[lang], v = lab.view, un = secret.unlocked();
  let h = '';
  if (S.sec === 'tangram') {
    h = `<div class="cs-figs">${Object.entries(tx.tg.figs).map(([f, n]) => `<button type="button" class="chip${S.g.fig === f ? ' on' : ''}" data-act="fig" data-f="${f}">${esc(n)}</button>`).join('')}</div>`;
  } else if (S.sec === 'any') {
    h = sliderHtml('top', tx.h.top, -6, 12, S.h.p, ['−6', '12']);
  } else if (v === 'slide') {
    const s = S.s;
    h = `<div class="cs-q">${esc(tx.s.q)}</div>${chipsHtml(tx.s.chips, s.guess, s.go, s.done)}`;
    if (!s.go) h += s.guess !== null ? `<div class="cs-go"><button type="button" class="btn" data-act="go">${esc(tx.s.go)}</button></div>` : `<div class="cs-hint">${esc(tx.pickHint)}</div>`;
    if (s.done) h += sliderHtml('lean', tx.s.lean, 0, 4, s.lean, ['0', '4']);
  } else if (v === 'half') {
    const hs = S.h;
    h = `<div class="cs-q">${esc(tx.h.q)}</div>${chipsHtml(tx.h.chips, hs.guess, hs.go, hs.done)}`;
    if (!hs.go) h += hs.guess !== null ? `<div class="cs-go"><button type="button" class="btn" data-act="go">${esc(tx.h.go)}</button></div>` : `<div class="cs-hint">${esc(tx.pickHint)}</div>`;
    if (hs.done) h += `<div class="cs-go"><button type="button" class="btn ghost" data-act="go">↻ ${esc(tx.h.again)}</button></div>`;
    h += sliderHtml('top', tx.h.top, 0, 8, hs.p, ['0', '8']);
  } else {
    const l = S.l;
    h = `<div class="cs-q">${esc(tx.l.q)}</div>${chipsHtml(tx.l.chips, l.guess, !!l.mode, !!l.mode)}`;
    if (l.guess === null) h += `<div class="cs-hint">${esc(tx.pickHint)}</div>`;
    else h += `<div class="cs-go">${['across', 'down', 'fill'].map((m) => `<button type="button" class="btn${l.mode === m ? '' : ' ghost'}" data-act="cut" data-m="${m}">${esc(tx.l[m])}</button>`).join('')}</div>`;
  }
  h += `<div class="cs-sec">${[['tangram', '✂️', tx.secrets.a[0]], ['any', '🔺', tx.secrets.b[0]]].map(([k, e, n]) => `<button type="button" class="chip secret${un ? ' open' : ''}${S.sec === k ? ' on' : ''}" data-act="sec" data-k="${k}">${un ? e : '🔒'} ${esc(n)}</button>`).join('')}</div>`;
  return h;
}

// --- one render per change: controls, readout, state card, facts ----------------------------------------------
let lastSig = '';
function render() {
  const tx = T[lang], v = lab.view, s = S.s, h = S.h, l = S.l;
  const sig = [lang, v, S.sec, secret.unlocked(), s.guess, s.go, s.done, h.guess, h.go, h.done, l.guess, l.mode, S.g.fig].join('|');
  if (sig !== lastSig) { lastSig = sig; $('ctrlBody').innerHTML = buildCtrl(); }
  syncSliders();
  let val = '?', st, facts = tx.facts.half;
  const verdict = (ok) => ({ emo: ok ? '✅' : '🤔', title: ok ? tx.okT : tx.noT });
  const card2 = (arr) => ({ emo: arr[0], title: arr[1], lead: arr[2], body: '' });
  if (S.sec === 'tangram') {
    val = `16 ${tx.cm2}`; st = { emo: '✂️', title: tx.secrets.a[0], lead: tx.secrets.a[1], body: tx.tg.body };
  } else if (S.sec === 'any') {
    val = `6 × 4 ÷ 2 = 12 ${tx.cm2}`; st = { emo: '🔺', title: tx.secrets.b[0], lead: tx.secrets.b[1], body: tx.any.body };
  } else if (v === 'slide') {
    facts = tx.facts.slide;
    if (s.done) { val = `6 × 4 = 24 ${tx.cm2}`; st = { ...verdict(s.guess === 1), lead: s.guess === 1 ? tx.s.ok : s.guess === 0 ? tx.s.bad0 : tx.s.bad2, body: tx.s.after }; }
    else st = card2(s.go ? tx.s.busy : s.guess === null ? tx.s.idle : tx.s.ready);
  } else if (v === 'half') {
    if (h.done) { val = `6 × 4 ÷ 2 = 12 ${tx.cm2}`; st = { ...verdict(h.guess === 1), lead: h.guess === 1 ? tx.h.ok : h.guess === 0 ? tx.h.bad0 : tx.h.bad2, body: tx.h.after }; }
    else st = card2(h.go ? tx.h.busy : h.guess === null ? tx.h.idle : tx.h.ready);
  } else {
    facts = tx.facts.lshape;
    if (l.mode) {
      val = ({ across: '21 + 6', down: '15 + 12', fill: '35 − 8' })[l.mode] + ` = 27 ${tx.cm2}`;
      const note = l.guess === 0 ? tx.l.note0 : l.guess === 2 ? tx.l.note2 : '';
      st = { ...verdict(l.guess === 1), lead: tx.l.lead[l.mode], body: `${note} ${tx.l.after}`.trim() };
    } else st = card2(l.guess === null ? tx.l.idle : tx.l.ready);
  }
  lab.setReadout(val, tx.unitSq, '', '#2bb3a3');
  lab.setState({ ...st, extra: '' });
  lab.setFacts(facts);
}
render();
</script>
</body>
