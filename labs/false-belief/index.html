canvasLoop($('cv'), (c, w, h, dt, time) => {
  K = Math.min(w / W, h / H); OX = (w - W * K) / 2; OY = (h - H * K) / 2;
  c.save(); c.translate(OX, OY); c.scale(K, K);
  const t = now();
  if (secKey === 'hide') hideScene(c, t);
  else if (secKey === 'trick') trickScene(c, t);
  else if (lab.view === 'ball') ballScene(c, t);
  else if (lab.view === 'tube') tubeScene(c, t);
  else giftScene(c, t);
  c.restore();
});

// --- controls and text ----------------------------------------------------------------------------------------
const opt = (act, data, label, cls = '', dis = false) => `<button class="fb-opt ${cls}" data-act="${act}" ${data}${dis ? ' disabled' : ''}>${label}</button>`;
const verdict = (ok, title, lead) => `<div class="fb-verdict ${ok ? 'ok' : 'no'}">${esc(title)}</div><p class="fb-lead">${esc(lead)}</p>`;
const setSt = (emo, [title, lead]) => lab.setState({ emo, title, lead, body: '', extra: '' });

function renderBall(t) {
  const b = t.ball, { round: r, bs } = B, busy = bs > 0 && now() - B.t0 < DUR_B[bs] - .02, caps = r === 1 ? b.cap : b.cap2;
  lab.setGlow('rgba(239, 122, 106, .26)');
  let html;
  if (bs <= 4 && !(bs === 4 && !busy)) {
    setSt(['⚽', '🧺', '🚪', '🐱', '🚶'][bs], caps[bs]);
    html = `<button class="btn" data-act="bnext"${busy || bs === 4 ? ' disabled' : ''}>${esc(t.next)}</button>`;
    if (busy) later(DUR_B[bs] - (now() - B.t0));
    lab.setReadout('?', b.saw, b.round(r), '#ef7a6a');
  } else if (bs === 4) {
    lab.setState({ emo: '🤔', title: b.q, lead: '', body: '', extra: '' });
    html = `<div class="fb-q">${esc(b.q)}</div><div class="fb-opts">${opt('bans', 'data-v="basket"', `🧺 ${esc(b.basket)}`)}${opt('bans', 'data-v="box"', `📦 ${esc(b.box)}`)}</div>`;
    lab.setReadout('?', b.saw, b.round(r), '#ef7a6a');
  } else {
    const right = r === 1 ? 'basket' : 'box', ok = B.guess === right, v = (r === 1 ? b.v1 : b.v2)[ok ? 'good' : 'bad'];
    setSt(ok ? '✅' : '💡', v);
    html = `<div class="fb-q">${esc(b.q)}</div><div class="fb-opts">${['basket', 'box'].map((k) => opt('', '', `${k === 'basket' ? '🧺' : '📦'} ${esc(b[k])}`, k === right ? 'good' : k === B.guess ? 'bad' : '', true)).join('')}</div>${verdict(ok, v[0], v[1])}
      <div class="fb-row"><button class="btn" data-act="${r === 1 ? 'btwist' : 'bagain'}">${esc(r === 1 ? t.twist : t.again)}</button></div>`;
    lab.setReadout(r === 1 ? '✖' : '✔', b.saw, b.round(r), r === 1 ? '#ffb36b' : '#3ddc97');
  }
  $('fbMain').innerHTML = html;
  lab.setFacts(t.facts.ball);
}
function renderTube(t) {
  const u = t.tube, ts = Tb.ts, busy = ts > 0 && now() - Tb.t0 < DUR_T[ts] - .02;
  lab.setGlow('rgba(247, 197, 72, .24)');
  const guess = u.o1[Tb.guess ?? 0];
  let html = '', val = '?', sub = u.inSub, pill = '';
  if (ts >= 1) { val = u.peb; sub = u.pebSub; }
  if (ts >= 3) pill = `${u.leoSaw}: ✖`;
  if (ts === 0) {
    lab.setState({ emo: '🤔', title: u.q1, lead: '', body: '', extra: '' });
    html = `<div class="fb-q">${esc(u.q1)}</div><div class="fb-opts">${u.o1.map((o, i) => opt('t1', `data-i="${i}"`, esc(o))).join('')}</div>`;
  } else if (ts === 1) {
    setSt('🪨', u.surprise); html = `<button class="btn" data-act="tnext"${busy ? ' disabled' : ''}>${esc(t.next)}</button>`; if (busy) later(DUR_T[1] - (now() - Tb.t0));
  } else if (ts === 2 && busy) {
    setSt('🚶', u.comes); html = `<button class="btn" data-act="tnext" disabled>${esc(t.next)}</button>`; later(DUR_T[2] - (now() - Tb.t0));
  } else if (ts === 2) {
    lab.setState({ emo: '🤔', title: u.q2, lead: '', body: '', extra: '' });
    html = `<div class="fb-q">${esc(u.q2)}</div><div class="fb-opts">${u.o2.map((o, i) => opt('t2', `data-i="${i}"`, esc(o))).join('')}</div>`;
  } else if (ts === 3) {
    const ok = Tb.a2 === 1, v = u.v2[ok ? 'good' : 'bad'];
    setSt(ok ? '✅' : '💡', v);
    html = `<div class="fb-q">${esc(u.q2)}</div><div class="fb-opts">${u.o2.map((o, i) => opt('', '', esc(o), i === 1 ? 'good' : i === Tb.a2 ? 'bad' : '', true)).join('')}</div>${verdict(ok, v[0], v[1])}
      <div class="fb-row"><button class="btn" data-act="tnext">${esc(t.next)}</button></div>`;
  } else if (ts === 4) {
    lab.setState({ emo: '🤔', title: u.q3, lead: '', body: '', extra: '' });
    const labels = Tb.ord ? [u.peb[0].toUpperCase() + u.peb.slice(1), guess] : [guess, u.peb[0].toUpperCase() + u.peb.slice(1)];
    html = `<div class="fb-q">${esc(u.q3)}</div><div class="fb-opts">${labels.map((o, i) => opt('t3', `data-i="${i}"`, esc(o))).join('')}</div>`;
  } else {
    const okIdx = Tb.ord ? 1 : 0, ok = Tb.a3 === okIdx, v = u.v3[ok ? 'good' : 'bad'](guess);
    const labels = Tb.ord ? [u.peb[0].toUpperCase() + u.peb.slice(1), guess] : [guess, u.peb[0].toUpperCase() + u.peb.slice(1)];
    setSt(ok ? '✅' : '💡', v);
    html = `<div class="fb-q">${esc(u.q3)}</div><div class="fb-opts">${labels.map((o, i) => opt('', '', esc(o), i === okIdx ? 'good' : i === Tb.a3 ? 'bad' : '', true)).join('')}</div>${verdict(ok, v[0], v[1])}
      <div class="fb-row"><button class="btn" data-act="tagain">${esc(t.again)}</button></div>`;
  }
  lab.setReadout(val, sub, pill, '#f7c548');
  $('fbMain').innerHTML = html;
  lab.setFacts(ts >= 1 ? t.facts.tube : []);
}
function renderGift(t) {
  const g = t.gift, { gs } = G, busy = gs === 1 && now() - G.t0 < DUR_G[1] - .02, n = G.ans.filter((a) => a !== null).length;
  lab.setGlow('rgba(176, 138, 224, .26)');
  let html = '';
  if (gs === 0) { setSt('🎁', g.cap0); html = `<button class="btn" data-act="gnext">${esc(t.next)}</button>`; }
  else if (busy) { setSt('🛋️', g.hide); html = `<button class="btn" disabled>${esc(t.next)}</button>`; later(DUR_G[1] - (now() - G.t0)); }
  else {
    const chips = `<div class="fb-who">${g.names.map((nm, i) => `<button class="chip ${G.sel === i ? 'on' : ''} ${G.ans[i] !== null ? 'done' : ''}" data-act="gsel" data-i="${i}">${['👵', '👦', '👧'][i]} ${esc(nm)}</button>`).join('')}</div>`;
    const sel = G.sel;
    if (n === 3 && sel === null) { setSt('🎁', g.end); html = chips + `<div class="fb-row"><button class="btn" data-act="gagain">${esc(t.again)}</button></div>`; }
    else if (sel === null) { lab.setState({ emo: '🎁', title: g.askT, lead: g.tap, body: '', extra: '' }); html = `${chips}<p class="fb-tip">${esc(g.tap)}</p>`; }
    else if (G.ans[sel] === null) {
      lab.setState({ emo: '🤔', title: g.q[sel], lead: '', body: '', extra: '' });
      html = `${chips}<div class="fb-q">${esc(g.q[sel])}</div><div class="fb-opts">${opt('gans', 'data-a="yes"', esc(t.yes))}${opt('gans', 'data-a="no"', esc(t.no))}</div>`;
    } else {
      const right = sel < 2 ? 'yes' : 'no', ok = G.ans[sel] === right, title = ok ? t.ball.v1.good[0] : g.wrongT;
      if (n === 3) setSt('🎁', g.end); else lab.setState({ emo: ok ? '✅' : '💡', title, lead: g.why[sel], body: '', extra: '' });
      html = `${chips}<div class="fb-q">${esc(g.q[sel])}</div><div class="fb-opts">${['yes', 'no'].map((k) => opt('', '', esc(t[k]), k === right ? 'good' : k === G.ans[sel] ? 'bad' : '', true)).join('')}</div>${verdict(ok, title, g.why[sel])}`;
      if (n === 3) html += `<div class="fb-row"><button class="btn" data-act="gagain">${esc(t.again)}</button></div>`;
    }
  }
  lab.setReadout(`${n}/3`, g.sub, '', '#b08ae0');
  $('fbMain').innerHTML = html;
  lab.setFacts(t.facts.gift);
}
function renderHide(t) {
  const h = t.hide, who = SH.who, ans = SH.ans;
  lab.setGlow('rgba(255, 210, 122, .22)');
  let html = `<div class="fb-q">${esc(h.q[who])}</div>`;
  if (ans === null) {
    lab.setState({ emo: '🙈', title: h.q[who], lead: '', body: '', extra: '' });
    html += `<div class="fb-opts">${opt('hans', 'data-a="yes"', esc(t.yes))}${opt('hans', 'data-a="no"', esc(t.no))}</div>`;
    lab.setReadout('?', h.sub, '', '#ffd27a');
  } else {
    const ok = ans === 'yes', title = ok ? t.ball.v1.good[0] : t.gift.wrongT;
    lab.setState({ emo: ok ? '✅' : '💡', title, lead: h.why[who], body: '', extra: '' });
    html += `<div class="fb-opts">${['yes', 'no'].map((k) => opt('', '', esc(t[k]), k === 'yes' ? 'good' : k === ans ? 'bad' : '', true)).join('')}</div>${verdict(ok, title, h.why[who])}
      <div class="fb-row"><button class="btn" data-act="hother">${esc(h.other)}</button></div>`;
    lab.setReadout('✔', h.sub, '', '#3ddc97');
  }
  $('fbMain').innerHTML = html;
  lab.setFacts([]);
}
function renderTrick(t) {
  const k = t.trick, busyG = now() - ST.gt0 < .8, ph = ST.phase;
  lab.setGlow('rgba(240, 138, 122, .24)');
  const lockLeo = ph !== 0 || busyG;
  let html = `<div class="fb-who"><span class="fb-tip" style="margin:0 4px 0 0;align-self:center">${esc(k.leo)}:</span>
    <button class="chip ${ST.leo === 'watch' ? 'on' : ''}" data-act="leo" data-v="watch"${lockLeo ? ' disabled' : ''}>${esc(k.watch)}</button>
    <button class="chip ${ST.leo === 'away' ? 'on' : ''}" data-act="leo" data-v="away"${lockLeo ? ' disabled' : ''}>${esc(k.away)}</button></div>`;
  let val = '?';
  if (ph === 0) {
    lab.setState({ emo: '🎭', title: k.t0, lead: k.lead0, body: '', extra: '' });
    html += `<div class="fb-row" style="margin-top:0"><button class="btn" data-act="move"${busyG ? ' disabled' : ''}>${esc(k.move)}</button><button class="btn ghost" data-act="look"${busyG ? ' disabled' : ''}>${esc(k.look)}</button></div>`;
    if (busyG) later(.8 - (now() - ST.gt0));
  } else {
    const done = ph === 2 || now() - ST.t0 >= 1.3, found = ST.belief === ST.gift;
    if (!done) { lab.setState({ emo: '🚶', title: k.t0, lead: '', body: '', extra: '' }); html += `<div class="fb-row" style="margin-top:0"><button class="btn" disabled>${esc(k.look)}</button></div>`; later(1.3 - (now() - ST.t0)); }
    else {
      const v = found ? k.found : k.miss; val = found ? '✔' : '✖';
      lab.setState({ emo: found ? '✅' : '😮', title: v[0], lead: v[1], body: '', extra: '' });
      html += `${verdict(found, v[0], v[1])}<div class="fb-row"><button class="btn" data-act="treset">${esc(k.again ?? t.again)}</button></div>`;
    }
  }
  lab.setReadout(val, k.sub, '', '#f08a7a');
  $('fbMain').innerHTML = html;
  lab.setFacts([]);
}
function render() {
  const t = T[lang];
  if (secKey === 'hide') renderHide(t); else if (secKey === 'trick') renderTrick(t);
  else if (lab.view === 'ball') renderBall(t); else if (lab.view === 'tube') renderTube(t); else renderGift(t);
  const open = secret.unlocked();
  $('fbSecs').innerHTML = [['hide', '🙈'], ['trick', '🎭']].map(([k, emo]) => `<button class="chip secret ${open ? 'open' : ''} ${secKey === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.checkStage?.();
}

// --- events ------------------------------------------------------------------------------------------------------
const go = (obj, key, v) => { obj[key] = v; obj.t0 = now(); };
function pickGift(i) { G.sel = i; sfx.click(); render(); }
$('fbSecs').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act="sec"]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.k; sfx.click();
  if (secKey === k) { secKey = null; render(); return; }
  secKey = k;
  if (k === 'hide') { SH.who = 0; SH.ans = null; }
  else { ST.gift = 0; ST.belief = 0; ST.leo = 'watch'; ST.phase = 0; ST.gt0 = -99; }
  render(); showStage();
});
$('fbMain').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, d = b.dataset;
  if (act === 'bnext') { if (B.bs < 4) { go(B, 'bs', B.bs + 1); sfx.click(); } }
  else if (act === 'bans') { B.guess = d.v; go(B, 'bs', 5); const ok = d.v === (B.round === 1 ? 'basket' : 'box'); (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'btwist') { B.round = 2; B.guess = null; go(B, 'bs', 0); sfx.click(); }
  else if (act === 'bagain') { B.round = 1; B.guess = null; go(B, 'bs', 0); sfx.click(); }
  else if (act === 't1') { Tb.guess = +d.i; Tb.ord = Math.random() < .5 ? 0 : 1; go(Tb, 'ts', 1); sfx.click(); showStage(); }
  else if (act === 'tnext') { go(Tb, 'ts', Tb.ts + 1); sfx.click(); }
  else if (act === 't2') { Tb.a2 = +d.i; go(Tb, 'ts', 3); (Tb.a2 === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 't3') { Tb.a3 = +d.i; go(Tb, 'ts', 5); (Tb.a3 === (Tb.ord ? 1 : 0) ? sfx.good : sfx.bad)(); }
  else if (act === 'tagain') { Tb.guess = null; Tb.a2 = null; Tb.a3 = null; go(Tb, 'ts', 0); sfx.click(); }
  else if (act === 'gnext') { go(G, 'gs', 1); G.sel = null; sfx.click(); }
  else if (act === 'gsel') { pickGift(+d.i); return; }
  else if (act === 'gans') {
    G.ans[G.sel] = d.a; G.pt = G.pt || []; G.pt[G.sel] = now();
    const ok = d.a === (G.sel < 2 ? 'yes' : 'no'); (ok ? sfx.good : sfx.bad)(); showStage();
    if (G.ans.every((a) => a !== null)) { /* all asked: the end card shows when the chip is deselected */ }
  }
  else if (act === 'gagain') { G.ans = [null, null, null]; G.pt = []; G.sel = null; go(G, 'gs', 0); sfx.click(); }
  else if (act === 'hans') { SH.ans = d.a; SH.t0 = now(); (d.a === 'yes' ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'hother') { SH.who = 1 - SH.who; SH.ans = null; sfx.click(); }
  else if (act === 'leo') { ST.leo = d.v; sfx.tick(); }
  else if (act === 'move') { ST.gfrom = ST.gift; ST.gift = 1 - ST.gift; ST.gt0 = now(); if (ST.leo === 'watch') ST.belief = ST.gift; sfx.push(); }
  else if (act === 'look') { ST.phase = 1; ST.t0 = now(); sfx.click(); showStage(); setTimeout(() => { if (ST.phase === 1) { ST.phase = 2; render(); } }, 1350); }
  else if (act === 'treset') { ST.phase = 0; ST.belief = ST.gift; ST.leo = 'watch'; sfx.click(); }
  render();
});
// tapping a person in the picture works like the chips
$('cv').addEventListener('pointerdown', (ev) => {
  if (secKey || lab.view !== 'gift' || G.gs !== 1 || now() - G.t0 < DUR_G[1]) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - OX) / K, y = (ev.clientY - r.top - OY) / K;
  if (y < 160) return;
  const i = x < 66 ? 0 : x < 124 ? 1 : x > 262 ? 2 : -1;
  if (i >= 0 && !(i === 2 && y < 215)) pickGift(i);
});
render();
</script>
