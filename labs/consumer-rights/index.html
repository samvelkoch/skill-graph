const DW = 360, DH = 340;
let SC = 1;
const ease = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);

const lg = (c, x0, y0, x1, y1, st) => { const g = c.createLinearGradient(x0, y0, x1, y1); for (const [o, col] of st) g.addColorStop(o, col); return g; };
const rg = (c, x, y, r0, r1, st) => { const g = c.createRadialGradient(x, y, Math.max(0, r0), x, y, Math.max(0.01, r1)); for (const [o, col] of st) g.addColorStop(o, col); return g; };
const shade = (hex, k) => {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = k < 0 ? 0 : 255, a = Math.abs(k);
  r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
};
const rr = (c, x, y, w, h, r) => {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));

};

};

function person(c, x, y, r, o) {

}

  const tt = T[lang], reg = S.reg, g = S.sa[reg], rev = g !== null;
  c.fillStyle = lg(c, 0, -60, 0, 340, [[0, '#dcebf3'], [1, '#b9d3df']]); c.fillRect(-500, -500, 1360, 1200);
  const usual = reg === 'eu' ? 14 / 30.4 : 7 / 30.4, end = reg === 'eu' ? 12.5 : 3;
  strip(c, { cap: tt.sa.cap, range: 13, ticks: [0, 3, 6, 9, 12], usual, mark: null, bands: rev ? [{ a: usual, b: end, col: KIND, text: reg === 'eu' ? tt.sa.capEu : tt.sa.capRu }] : [], e: S.e });
  pill(c, tt.sa.usual, 90, 124, { size: 12, stroke: 'rgba(255,255,255,.5)', fit: true });
  const hop = Math.abs(Math.sin(t * 2)) * 4;
  parcel(c, 110, 262 - hop * .5);
  c.save(); shadowOn(c, 6, 3); c.fillStyle = '#fffdf6'; c.translate(250, 215); c.rotate(.08); rr(c, -42, -48, 84, 96, 6); c.fill(); shadowOff(c);
  c.fillStyle = 'rgba(75,70,56,.35)'; for (let i = 0; i < 5; i++) rr(c, -30, -34 + i * 12, 60 - (i % 2) * 14, 4, 2), c.fill();
  c.strokeStyle = BAD; c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); c.moveTo(-26, -34); c.lineTo(26, 34); c.moveTo(26, -34); c.lineTo(-26, 34); c.stroke();
  c.restore();
  pill(c, tt.sa.lead, 180, 312, { size: 13, stroke: KIND });
}

// --- secret b: who helps -----------------------------------------------------------------------------------------
const SHORT = {
  en: ['Fogyasztóvédelmi hatóság', 'Rospotrebnadzor', 'European Consumer Centres'],
  ru: ['Fogyasztóvédelmi hatóság', 'Роспотребнадзор', 'Европейские потребительские центры'],
  hu: ['Fogyasztóvédelmi hatóság', 'Roszpotrebnadzor', 'Európai Fogyasztói Központok'],
};
const PINS = [{ x: 190, y: 172, col: '#e0584a' }, { x: 288, y: 108, col: '#3b82c4' }, { x: 96, y: 168, col: '#2b4fb3' }];
function pin(c, p, bounce, eu) {
  const y = p.y - bounce;
  c.save(); c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(p.x, p.y + 2, 9, 3.5, 0, 0, 7); c.fill();
  c.fillStyle = lg(c, p.x - 12, y - 36, p.x + 12, y, [[0, shade(p.col, .35)], [1, p.col]]); c.strokeStyle = shade(p.col, -.45); c.lineWidth = 1.5;
  c.beginPath(); c.arc(p.x, y - 26, 13, Math.PI * .85, Math.PI * .15, false); c.lineTo(p.x, y); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(p.x, y - 26, 6, 0, 7); c.fill();
  if (eu) { c.fillStyle = '#f5c84c'; for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283; c.beginPath(); c.arc(p.x + Math.cos(a) * 3.4, y - 26 + Math.sin(a) * 3.4, 1, 0, 7); c.fill(); } }
  c.restore();
}
function drawSecB(c, dt, t) {
  const tt = T[lang], i = S.sb.i, rev = S.sb.g[i] !== null;
  c.fillStyle = lg(c, 0, -60, 0, 340, [[0, '#6aa7d8'], [1, '#3b6ea8']]); c.fillRect(-500, -500, 1360, 1200);
  c.save(); shadowOn(c, 8, 4); c.fillStyle = lg(c, 0, 50, 0, 260, [[0, '#cfe8c4'], [1, '#98c88f']]);
  const pts = [[24, 210], [40, 170], [70, 150], [80, 120], [120, 100], [150, 70], [210, 60], [280, 50], [340, 70], [350, 130], [340, 200], [300, 250], [240, 255], [200, 230], [170, 260], [140, 240], [120, 262], [90, 240], [60, 250], [30, 235]];
  c.beginPath(); c.moveTo((pts[0][0] + pts[pts.length - 1][0]) / 2, (pts[0][1] + pts[pts.length - 1][1]) / 2);
  pts.forEach((p, k) => { const q = pts[(k + 1) % pts.length]; c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); });
  c.closePath(); c.fill(); shadowOff(c); c.strokeStyle = '#6b9a63'; c.lineWidth = 2; c.stroke(); c.restore();
  c.save(); c.globalAlpha = .45;
  c.fillStyle = '#e0584a'; c.beginPath(); c.ellipse(190, 176, 17, 11, 0, 0, 7); c.fill();
  c.fillStyle = '#3b82c4'; c.beginPath(); c.ellipse(290, 118, 56, 46, 0, 0, 7); c.fill();
  c.fillStyle = '#f5c84c'; c.beginPath(); c.ellipse(112, 172, 50, 44, 0, 0, 7); c.fill();
  c.restore();
  const k = back(Math.min(1, (S.t - (S.sb.t0 || 0)) * 1.6));
  PINS.forEach((p, j) => { if (j === i) pin(c, p, Math.max(0, (1 - k)) * 40 + Math.abs(Math.sin(t * 3)) * 2, j === 2); else { c.save(); c.globalAlpha = .35; pin(c, p, 0, j === 2); c.restore(); } });
  if (rev && S.e > .3) pill(c, SHORT[lang][i], PINS[i].x, clamp(PINS[i].y + 22, 20, 320), { size: 12.5, stroke: GOOD, fit: true });
}

// --- loop and input ----------------------------------------------------------------------------------------
const cv = $('cv');
canvasLoop(cv, (c, w, h, dt, t) => {
  SC = Math.min(w / DW, h / DH); OX = (w - DW * SC) / 2; OY = (h - DH * SC) / 2; S.t = t; hits = [];
  if (S.e < 1) S.e = Math.min(1, S.e + dt * 1.7);
  c.save();
  try {
    rr(c, 0, 0, w, h, 18); c.clip(); c.translate(OX, OY); c.scale(SC, SC);
    if (S.sec === 'a') drawSecA(c, dt, t); else if (S.sec === 'b') drawSecB(c, dt, t);
    else if (lab.view === 'counter') drawCounter(c, dt, t); else if (lab.view === 'calendar') drawCalendar(c, dt, t); else drawShopper(c, dt, t);
  } catch (err) { console.error(err); }
  c.restore();
});
const ptr = (ev) => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left - OX) / SC, y: (ev.clientY - r.top - OY) / SC }; };
const calIdx = (p) => {
  if (p.x < CAL.x0 || p.x > CAL.x0 + 320 || p.y < CAL.y0 || p.y >= CAL.y0 + CAL.rh * 5) return -1;
  return clamp(Math.floor((p.y - CAL.y0) / CAL.rh), 0, 4) * 7 + clamp(Math.floor((p.x - CAL.x0) / CAL.cw), 0, 6);
};
const calMove = (i) => {
  const k = S.cal, was = k.pf + ':' + k.rf;
  if (k.sel === 'pf') { k.pf = clamp(i, 0, 20); if (k.rf < k.pf) k.rf = k.pf; } else k.rf = clamp(i, k.pf, 34);
  return was !== k.pf + ':' + k.rf;
};
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const p = ptr(ev);
  if (lab.view === 'calendar') {
    if (S.cal.done[calKey()]) return;
    const i = calIdx(p); if (i < 0) return;
    const k = S.cal;
    if (i === k.pf && i !== k.rf) k.sel = 'pf'; else if (i === k.rf && i !== k.pf) k.sel = 'rf'; else calMove(i);
    k.drag = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ }
    sfx.tick(); render();
  } else if (lab.view === 'shopper') {
    for (let i = hits.length - 1; i >= 0; i--) { const q = hits[i]; if (p.x >= q.x && p.x <= q.x + q.w && p.y >= q.y && p.y <= q.y + q.h) { q.fn(); return; } }
  }
});
cv.addEventListener('pointermove', (ev) => {
  if (!S.cal.drag) return;
  const i = calIdx(ptr(ev)); if (i < 0) return;
  if (calMove(i)) { sfx.tick(); render(); }
});
const endDrag = () => { S.cal.drag = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- actions -----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function shToggle(kind, k) {
  const sh = S.sh;
  if (kind === 'keep') { if (sh.keepRev) return; sh.keep.has(k) ? sh.keep.delete(k) : sh.keep.add(k); }
  else { if (sh.signRev) return; sh.signs.has(k) ? sh.signs.delete(k) : sh.signs.add(k); }
  sfx.tick(); render();
}
const keepOk = () => S.sh.keep.has('receipt') && S.sh.keep.has('card');
const signsOk = () => S.sh.signs.size === 2 && S.sh.signs.has(0) && S.sh.signs.has(1);
function calCheck(none) {
  const k = S.cal, lim = LIM[k.type][S.reg], n = k.rf - k.pf;
  const ok = none ? lim == null : lim != null && n === lim;
  k.done[calKey()] = { ok, none, n }; S.e = 0; (ok ? sfx.good : sfx.bad)(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i, k = b.dataset.k, sh = S.sh;
  if (a === 'reg') { S.reg = k; S.e = 1; sfx.click(); }
  else if (a === 'case') { S.ci = i; S.e = 1; sfx.click(); }
  else if (a === 'opt') { S.guess[ck()] = i; S.e = 0; (i === CASES[S.ci].ans[S.reg] ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'next') { S.ci = (S.ci + 1) % CASES.length; S.e = 1; sfx.click(); }
  else if (a === 'ctype') { S.cal.type = k; S.e = 1; sfx.click(); }
  else if (a === 'csel') { S.cal.sel = k; sfx.click(); }
  else if (a === 'ccheck') calCheck(false);
  else if (a === 'cnone') calCheck(true);
  else if (a === 'cagain') { delete S.cal.done[calKey()]; S.e = 1; sfx.click(); }
  else if (a === 'kcheck') { sh.keepRev = true; S.e = 0; (keepOk() ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'knext') { sh.ph = 'signs'; S.e = 1; sfx.click(); }
  else if (a === 'scheck') { sh.signRev = true; S.e = 0; (signsOk() ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'sagain') { S.sh = { ph: 'keep', keep: new Set(), keepRev: false, signs: new Set(), signRev: false }; S.e = 1; sfx.click(); }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === k ? null : k; S.e = 1; if (k === 'b') S.sb.t0 = S.t; sfx.click(); }
  else if (a === 'bk') { S.sec = null; S.e = 1; sfx.click(); }
  else if (a === 'saopt') { S.sa[S.reg] = i; S.e = 0; (i === (S.reg === 'eu' ? 2 : 1) ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'sbround') { S.sb.i = i; S.sb.t0 = S.t; S.e = 1; sfx.click(); }
  else if (a === 'sbopt') { S.sb.g[S.sb.i] = i; S.e = 0; (i === S.sb.i ? sfx.good : sfx.bad)(); showStage(); }
  render();
});

// --- render: controls, readout, state card and facts ------------------------------------------------------------
const regRow = (t) => `<div class="cr-row" style="margin-top:0">${['eu', 'ru'].map((k) => `<button class="cr-c ${S.reg === k ? 'on' : ''}" data-act="reg" data-k="${k}">${k === 'eu' ? '🇪🇺' : '🇷🇺'} ${esc(k === 'eu' ? t.regEU : t.regRU)}</button>`).join('')}</div>`;
function opts(list, act, rev, win, guess) {
  return `<div class="cr-opts">${list.map((o, i) => `<button class="cr-opt ${i === guess ? 'cr-pick' : ''} ${rev ? (i === win ? 'cr-good' : i === guess ? 'cr-bad' : '') : ''}" data-act="${act}" data-i="${i}" ${rev ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
}
const verdict = (ok, t) => `<div class="cr-v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.no)}</div>`;
const btn = (act, label, dis) => `<button class="btn" data-act="${act}" ${dis ? 'disabled' : ''}>${esc(label)}</button>`;
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = S.sec ? 'sec' : v;
  let html;
  if (S.sec === 'a') html = rSecA(t); else if (S.sec === 'b') html = rSecB(t);
  else if (v === 'counter') html = rCounter(t); else if (v === 'calendar') html = rCal(t); else html = rShop(t);
  const open = secret.unlocked(), sc = (k, emo) => `<button class="cr-c cr-sec ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('ctrlBody').innerHTML = `${html}<div class="cr-row cr-sep">${sc('a', '📬')}${sc('b', '📍')}${S.sec ? `<button class="cr-c" data-act="bk">← ${esc(t.back)}</button>` : ''}</div>`;
  const F = (k) => ({ emo: k === 'shopper' ? '🏛️' : k === 'counter' ? '🧾' : '📅', text: t.facts[k], src: FACT_SRC[k] });
  lab.setFacts(S.sec ? [] : v === 'counter' ? [F('counter')] : v === 'calendar' ? [F('cal1'), F('cal2')] : [F('shopper')]);
}
function rCounter(t) {
  const ci = S.ci, cs = CASES[ci], g = S.guess[ck()], rev = g !== undefined, ans = cs.ans[S.reg], ok = rev && g === ans, law = t.law[S.reg][ci];
  const lbl = cs.mode === 'm' ? t.monL(cs.n) : t.dayL(cs.n), disc = `<p class="cr-fine">${esc(t.disc)}</p>`;
  if (!rev) {
    lab.setReadout(`${cs.emo} ${esc(t.caseName[ci])}`, lbl, '', '#4ea8ff');
    lab.setState({ emo: cs.emo, title: t.caseName[ci], lead: t.pre, body: '', extra: disc });
  } else {
    lab.setReadout(esc(t.copts[ans]), lbl, ok ? '✓' : '', ANSCOL[ans]);
    lab.setState({ emo: ok ? '✅' : '🔎', title: ok ? t.right : t.no, lead: law[0], body: law[1], extra: disc });
  }
  const dots = CASES.map((_, i) => { const gg = S.guess[`${i}:${S.reg}`]; return `<button class="cr-dot ${i === ci ? 'on' : ''} ${gg === undefined ? '' : gg === CASES[i].ans[S.reg] ? 'ok' : 'no'}" data-act="case" data-i="${i}">${i + 1}</button>`; }).join('');
  return `${regRow(t)}<div class="cr-row">${dots}</div><p class="cr-claim" style="margin-top:12px">${esc(t.caseDesc[ci])}</p><div class="cr-q">${esc(t.cq)}</div>${opts(t.copts, 'opt', rev, ans, g)}
    ${rev ? `${verdict(ok, t)}${btn('next', t.next)}` : ''}`;
}
function rCal(t) {
  const { type, pf, rf, sel } = S.cal, d = S.cal.done[calKey()], lim = LIM[type][S.reg], n = rf - pf, rk = type + S.reg;
  const dn = t.cal.dayN(n).replace(/^\d+\s*/, '');
  if (!d) {
    lab.setReadout(String(n), dn, '', '#f0892a');
    lab.setState({ emo: '📅', title: type === 'online' ? t.cal.online : t.cal.shop, lead: t.cal.flagHint, body: '', extra: '' });
  } else {
    lab.setReadout(String(n), dn, d.ok ? '✓' : '', d.ok ? GOOD : BAD);
    lab.setState({ emo: d.ok ? '✅' : '🔎', title: d.ok ? t.right : t.no, lead: t.cal.res[rk], body: d.ok || lim == null ? '' : d.none ? t.cal.missNone : t.cal.miss(lim), extra: '' });
  }
  const types = ['online', 'shop'].map((k) => `<button class="cr-c ${type === k ? 'on' : ''}" data-act="ctype" data-k="${k}">${k === 'online' ? '📦' : '🏬'} ${esc(t.cal[k])}</button>`).join('');
  const flags = [['pf', t.cal.fPur], ['rf', t.cal.fRet]].map(([k, l]) => `<button class="cr-c ${sel === k && !d ? 'on' : ''}" data-act="csel" data-k="${k}" ${d ? 'disabled' : ''}>${esc(l)}</button>`).join('');
  return `${regRow(t)}<div class="cr-row">${types}</div><p class="cr-claim" style="margin-top:12px">${esc(type === 'online' ? t.cal.taskOnline : t.cal.taskShop)}</p>
    <div class="cr-row">${flags}</div>
    ${d ? `${verdict(d.ok, t)}${btn('cagain', t.again)}` : `<div class="cr-row">${btn('ccheck', t.chk)}<button class="cr-c" data-act="cnone">${esc(t.cal.none)}</button></div>`}`;
}
function rShop(t) {
  const sh = S.sh, name = t.views.shopper.replace(/^\S+\s/, '');
  if (sh.ph === 'keep') {
    const ok = keepOk();
    if (!sh.keepRev) {
      lab.setReadout('🧾', t.sh.picks(sh.keep.size), '', '#4ea8ff');
      lab.setState({ emo: '🛍️', title: name, lead: t.sh.keepQ, body: '', extra: '' });
    } else {
      lab.setReadout(esc(ok ? t.right : t.no), name, ok ? '✓' : '', ok ? GOOD : BAD);
      lab.setState({ emo: ok ? '✅' : '🔎', title: ok ? t.right : t.no, lead: ok ? t.sh.keepOk : t.sh.keepMiss, body: '',
        extra: `<ul class="cr-why">${KEEP.map((k, i) => `<li><b>${esc(t.sh.keepName[k])}</b>: ${esc(t.sh.keepNote[i])}</li>`).join('')}</ul>` });
    }
    return `<div class="cr-q" style="margin-top:0">${esc(t.sh.keepQ)}</div>${sh.keepRev ? `${verdict(ok, t)}${btn('knext', t.sh.toNext)}` : btn('kcheck', t.chk, !sh.keep.size)}`;
  }
  const ok = signsOk();
  if (!sh.signRev) {
    lab.setReadout('🪧', t.sh.picks(sh.signs.size), '', '#4ea8ff');
    lab.setState({ emo: '🪧', title: name, lead: t.sh.signsQ, body: '', extra: '' });
  } else {
    lab.setReadout(esc(ok ? t.right : t.no), name, ok ? '✓' : '', ok ? GOOD : BAD);
    lab.setState({ emo: ok ? '✅' : '🔎', title: ok ? t.right : t.no, lead: ok ? t.sh.signsOk : t.sh.signsMiss, body: '',
      extra: `<ol class="cr-why">${t.sh.signs.map((s, i) => `<li><b>${esc(s)}</b> ${esc(t.sh.signWhy[i])}</li>`).join('')}</ol>` });
  }
  return `<div class="cr-q" style="margin-top:0">${esc(t.sh.signsQ)}</div>${sh.signRev ? `${verdict(ok, t)}${btn('sagain', t.again)}` : btn('scheck', t.chk, !sh.signs.size)}`;
}
function rSecA(t) {
  const g = S.sa[S.reg], rev = g !== null, win = S.reg === 'eu' ? 2 : 1, ok = rev && g === win;
  lab.setReadout('📬', S.reg === 'eu' ? t.regEU : t.regRU, rev ? (ok ? '✓' : '') : '', rev ? (ok ? GOOD : BAD) : '#f5c84c');
  if (!rev) lab.setState({ emo: '📬', title: t.secrets.a[0], lead: t.secrets.a[1], body: '', extra: '' });
  else lab.setState({ emo: ok ? '✅' : '🔎', title: ok ? t.right : t.no, lead: S.reg === 'eu' ? t.sa.resEu : t.sa.resRu, body: '', extra: '' });
  return `${regRow(t)}<div class="cr-q">${esc(t.sa.q)}</div>${opts(t.sa.opts, 'saopt', rev, win, g)}${rev ? verdict(ok, t) : ''}`;
}
function rSecB(t) {
  const i = S.sb.i, g = S.sb.g[i], rev = g !== null, ok = rev && g === i;
  lab.setReadout('📍', t.sb.round(i + 1), rev ? (ok ? '✓' : '') : '', rev ? (ok ? GOOD : BAD) : '#f5c84c');
  if (!rev) lab.setState({ emo: '📍', title: t.secrets.b[0], lead: t.secrets.b[1], body: '', extra: '' });
  else lab.setState({ emo: ok ? '✅' : '🔎', title: ok ? t.right : t.no, lead: t.sb.names[i], body: t.sb.lead, extra: '' });
  const dots = [0, 1, 2].map((k) => `<button class="cr-dot ${k === i ? 'on' : ''} ${S.sb.g[k] === null ? '' : S.sb.g[k] === k ? 'ok' : 'no'}" data-act="sbround" data-i="${k}">${k + 1}</button>`).join('');
  return `<div class="cr-row" style="margin-top:0">${dots}</div><div class="cr-q">${esc(t.sb.q(t.sb.places[i]))}</div>${opts(t.sb.names, 'sbopt', rev, i, g)}${rev ? verdict(ok, t) : ''}`;
}
render();
</script>
