const TABLE = '#C98B5B', PORC = '#FFF6E8', BAND = '#3DD6C6', RUG = '#5A6FB8', CHAIR = '#B9824F', RED = '#FF6B6B', BLUE = '#4C7DFF',

// --- small helpers -----------------------------------------------------------------------------------------
const TAU = Math.PI * 2;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => t * t * (3 - 2 * t);
const backOut = (t) => { const c1 = 1.70158, c3 = c1 + 1, u = t - 1; return 1 + c3 * u * u * u + c1 * u * u; };
const nowS = () => performance.now() / 1000;
const parse = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const toHex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = parse(a), B = parse(b); return toHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); };
const shade = (h, k) => (k >= 0 ? mix(h, '#000000', k) : mix(h, '#ffffff', -k)); // k > 0 darker, k < 0 lighter (hex in, hex out)

// a dark rounded label on the canvas; pop 0..1 scales it in
function pill(c, text, x, y, w, h, pop = 1, color = PINK) {
  if (pop <= 0) return;
  c.save(); c.globalAlpha = 1;
  c.font = '800 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + 24, bh = 28;
  const px = clamp(x, tw / 2 + 6, w - tw / 2 - 6), py = clamp(y, bh / 2 + 6, h - bh / 2 - 6);
  c.translate(px, py); c.scale(Math.max(0.01, backOut(clamp01(pop))), Math.max(0.01, backOut(clamp01(pop))));
  c.fillStyle = 'rgba(20, 16, 32, .84)'; c.strokeStyle = color; c.lineWidth = 2;
  c.beginPath(); c.roundRect(-tw / 2, -bh / 2, tw, bh, bh / 2); c.fill(); c.stroke();
  c.fillStyle = '#ffffff'; c.fillText(text, 0, 1);
  c.restore();
}
// one pill per leftover (two at most), else one under the middle of the group; pts: [{x, y}]
function leftPills(c, text, pts, dy, w, h, pop) {
  if (!pts.length) return;
  if (pts.length <= 2) pts.forEach((p) => pill(c, text, p.x, p.y + dy, w, h, pop));
  else pill(c, text, pts.reduce((s, p) => s + p.x, 0) / pts.length, Math.max(...pts.map((p) => p.y)) + dy, w, h, pop);
}
function sparkle(c, x, y, age, s) { // a little burst of four-point stars
  if (age <= 0 || age >= 1) return;
  c.save(); c.globalAlpha = 1 - age;
  for (let i = 0; i < 5; i++) {
    const a = i * TAU / 5 + 0.6, d = s * (0.25 + 0.55 * age), r = Math.max(0.5, s * 0.11 * (1 - age * 0.5)), px = x + Math.cos(a) * d, py = y + Math.sin(a) * d * 0.8;
    c.fillStyle = i % 2 ? '#ffffff' : THREAD;
    c.beginPath();
    for (let j = 0; j < 8; j++) { const rr = j % 2 ? r * 0.35 : r, aa = j * Math.PI / 4 - Math.PI / 2; c.lineTo(px + Math.cos(aa) * rr, py + Math.sin(aa) * rr); }
    c.closePath(); c.fill();
  }
  c.restore();
}
function glowAt(c, x, y, rad, rgb, a) {
  if (a <= 0) return;
  const g = c.createRadialGradient(x, y, 0, x, y, rad);
  g.addColorStop(0, `rgba(${rgb}, ${0.6 * a})`); g.addColorStop(1, `rgba(${rgb}, 0)`);
  c.save(); c.globalAlpha = 1; c.fillStyle = g; c.fillRect(x - rad, y - rad, rad * 2, rad * 2); c.restore();
}

  const v = V[view], d = DATA[view][v.ri];

  if (view === 'cups') Object.assign(v, { nc: d[0], ns: d[1], pairStart: 0.25, badge: false, sec: null, played: 0 });

  if (view === 'rows') Object.assign(v, { nt: d[0], nb: d[1], L: null, slide: 0, ticks: 0 });
}
function start(view) { // play the reveal now
  const v = V[view];
  v.t0 = nowS(); v.revealed = false;
  if (view === 'cups') v.played = 0;
  if (view === 'chairs') { v.stopped = false; v.sat = 0; v.beat = -1; }

}

function drawTable(c, w, h) {
  c.save(); c.globalAlpha = 1;
  let g = c.createLinearGradient(0, 0, 0, h);

function cupsLayout(w, h, nc, ns) {
  const pad = Math.max(16, w * 0.05), maxN = Math.max(nc, ns, 3);
  const s = Math.min(78, (w - 2 * pad) / (1.3 * maxN + 0.1), h * 0.17);
  const lo = pad + s * 0.7, hi = w - pad - s * 0.7;
  const xs = (n) => Array.from({ length: n }, (_, i) => (n === 1 ? (lo + hi) / 2 : lo + (hi - lo) * i / (n - 1))); // both rows span the same width
  return { s, cx: xs(nc), sx: xs(ns), y1: h * 0.26, y2: h * 0.60 };
}
const cupCounts = (v) => (v.sec === 'count' ? v.s : v);
const cupsTimes = (v) => {
  const { nc, ns } = cupCounts(v), np = Math.min(nc, ns), after = v.pairStart + np * 0.6 + 0.15;
  return { np, after, end: after + 1.4 };

function cupPose(k, T, L, ps, np) {
  const hx = L.cx[k], hyb = L.y1 + 0.3 * L.s, home = { x: hx, yb: hyb, sx: 1, sy: 1, rot: 0, landed: false, home: true };
  if (k >= np || T < 0) return home;

  const tx = L.sx[k], tyb = L.y2 - 0.02 * L.s, e = ease(u);
  if (u < 1) {
    const st = Math.sin(Math.PI * u) * 0.1;
    return { x: lerp(hx, tx, e), yb: lerp(hyb, tyb, e) - Math.sin(Math.PI * u) * L.s * 1.0, sx: 1 - st * 0.8, sy: 1 + st, rot: Math.sin(u * TAU) * 0.1, landed: false };
  }

  const k = Math.max(0.01, backOut(clamp01(pop))) * (hot ? 1.2 + 0.1 * Math.sin(time * 6) : 1);

  c.fillStyle = BG; c.font = `900 ${Math.round(r * 1.25)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(String(n), 0, 1);

function drawCups(c, w, h, time) {
  const v = V.cups;
  if (v.sec === 'sheep') return drawSheep(c, w, h, time);
  const { nc, ns } = cupCounts(v), tm = cupsTimes(v), L = cupsLayout(w, h, nc, ns), s = L.s;
  const T = v.t0 === null ? -1 : time - v.t0;

  if (landedN > v.played) { v.played = landedN; sfx.snap(); }

  poses.sort((a, b) => a.yb - b.yb);

      glowAt(c, p.x, cy, s * 0.9, '255, 143, 177', clamp01((T - tm.after) / 0.3) * 0.7);

// drawing: musical chairs

const SHIRT = [RED, BLUE, BAND, THREAD, PINK, shade(BLUE, -0.25), shade(BAND, 0.25), shade(RED, 0.2)];

function drawChair(c, x, y, u, glow, time) { // y is the middle of the seat
  c.save(); c.globalAlpha = 1;

  c.beginPath(); c.roundRect(x - 0.7 * u, y - 1.65 * u, 1.4 * u, 1.35 * u, 0.2 * u); c.fill(); c.stroke();

// a round-faced child; (x, yf) are the feet. o: { bob, sway, sq, look, wow, step }
function drawKid(c, x, yf, u, k, o = {}) {
  const shirt = SHIRT[k % SHIRT.length], hair = HAIR[k % HAIR.length], skin = SKIN[(k * 2 + 1) % SKIN.length];

  let g = c.createLinearGradient(-0.5 * u, -1.5 * u, 0.5 * u, -0.5 * u);
  g.addColorStop(0, shade(shirt, -0.22)); g.addColorStop(1, shade(shirt, 0.1));
  c.fillStyle = g; c.strokeStyle = shade(shirt, 0.4); c.lineWidth = 1.3;
  c.beginPath(); c.roundRect(-0.5 * u, -1.5 * u, 1.0 * u, 1.0 * u, 0.3 * u); c.fill(); c.stroke();
  // head: hair behind, face in front
  c.fillStyle = hair; c.beginPath(); c.arc(0, hy - 0.07 * u, 0.64 * u, 0, TAU); c.fill();
  if (k % 3 === 0) { c.beginPath(); c.arc(0, hy - 0.68 * u, 0.2 * u, 0, TAU); c.fill(); } // a tuft
  g = c.createRadialGradient(-0.2 * u, hy - 0.15 * u, 0.05 * u, 0, hy, 0.6 * u);
  g.addColorStop(0, shade(skin, -0.2)); g.addColorStop(1, shade(skin, 0.06));
  c.fillStyle = g; c.strokeStyle = shade(skin, 0.4); c.lineWidth = 1;

    c.fillStyle = BG; c.beginPath(); c.arc(ex * u + lk, hy + 0.03 * u, er * 0.58, 0, TAU); c.fill();
    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(ex * u + lk - er * 0.2, hy - 0.005 * u, er * 0.22, 0, TAU); c.fill();
  }

  c.strokeStyle = BG; c.lineWidth = Math.max(1.2, 0.055 * u); c.lineCap = 'round';

function drawNotes(c, w, h, time, alpha) {
  if (alpha <= 0.01) return;
  c.save(); c.textAlign = 'center'; c.textBaseline = 'middle';

  }

function drawChairs(c, w, h, time, dt) {
  const v = V.chairs, nk = v.nk, nch = v.nch, L = chairsLayout(w, h, nch), u = L.u, tm = chairsTimes(v);
  const T = v.t0 === null ? -1 : time - v.t0;
  const th0 = (k) => k * TAU / nk;
  const kidAt = (k) => { const th = th0(k) + v.walkA; return { x: L.cx + L.rxW * Math.cos(th), y: L.cy + L.ryW * Math.sin(th) }; };
  const seatFeet = (i) => ({ x: L.pos[i].x, y: L.pos[i].y + 0.35 * u });
  if (T < tm.stop) v.walkA += 0.55 * dt;
  if (T >= 0 && T < tm.stop) { const b = Math.floor(T / 0.32); if (b !== v.beat) { v.beat = b; sfx.tick(); } }
  if (T >= tm.stop && !v.stopped) { // the music stops: every child runs to the nearest free chair
    v.stopped = true;
    const pairs = [];
    for (let k = 0; k < nk; k++) { const p = kidAt(k); for (let i = 0; i < nch; i++) pairs.push({ k, i, d: Math.hypot(p.x - L.pos[i].x, p.y - L.pos[i].y) }); }
    pairs.sort((a, b) => a.d - b.d);
    const seat = new Array(nk).fill(-1), rank = new Array(nk).fill(0), taken = new Array(nch).fill(false);
    let r = 0;
    for (const p of pairs) if (seat[p.k] < 0 && !taken[p.i]) { seat[p.k] = p.i; taken[p.i] = true; rank[p.k] = r++; }
    v.seat = seat; v.rank = rank; v.empty = taken.map((t, i) => (t ? -1 : i)).filter((i) => i >= 0);
    v.sat = 0;
  }
  if (T >= tm.end && !v.revealed && v.t0 !== null) { v.revealed = true; render(); }

  drawRug(c, w, h);
  const items = [];
  const after = T >= tm.stop && v.stopped;
  for (let i = 0; i < nch; i++) {
    const glow = after && v.empty.includes(i) ? clamp01((T - tm.runEnd) / 0.5) : 0;
    items.push({ y: L.pos[i].y + 0.3 * u, f: () => drawChair(c, L.pos[i].x, L.pos[i].y, u, glow, time) });
  }
  // children
  const kids = [], standing = [];
  let sitsDone = 0;
  for (let k = 0; k < nk; k++) {
    let x, y, o = { bob: 0, step: 0, sway: 0, sq: 0, look: 0, wow: false };
    if (!after) {
      const p = kidAt(k); x = p.x; y = p.y;
      o.bob = 0.14 * Math.abs(Math.sin(time * 5 + k)); o.step = Math.sin(time * 10 + k * 2); o.sway = Math.sin(time * 5 + k) * 0.05;
    } else if (v.seat[k] >= 0) {
      const a = kidAt(k), b = seatFeet(v.seat[k]), ph = T - tm.stop - 0.05 * v.rank[k], u01 = clamp01(ph / 0.85), e = ease(u01);
      x = lerp(a.x, b.x, e); y = lerp(a.y, b.y, e);
      if (u01 < 1) { o.bob = Math.abs(Math.sin(u01 * Math.PI * 3)) * 0.3; o.step = Math.sin(time * 18 + k) * 1.5; }
      else { const d = ph - 0.85; o.sq = Math.exp(-d * 9) * Math.cos(d * 24) * 0.16; sitsDone++; }
    } else { // no chair: stands where the music stopped and looks around
      const p = kidAt(k); x = p.x; y = p.y;
      const since = T - tm.runEnd + 0.3;
      if (since > 0) { o.wow = true; o.look = Math.sin(time * 2.4) * 2; o.sway = Math.sin(time * 3) * 0.03; }
      standing.push({ k, x, y });
    }
    kids.push({ k, x, y, o });
  }
  if (sitsDone > v.sat) { v.sat = sitsDone; sfx.snap(); }
  // the friendly ending: a neighbour brings a cushion
  let cush = null;
  if (after && tm.lc === 1 && standing.length === 1) {
    const sk = standing[0], kid = kids.find((q) => q.k === sk.k);
    let best = null;
    kids.forEach((q) => { if (v.seat[q.k] >= 0) { const d = Math.hypot(q.x - sk.x, q.y - sk.y); if (!best || d < best.d) best = { d, q }; } });
    const seated = T >= tm.sit;
    if (seated) { kid.o.wow = false; kid.o.look = 0; const e = ease(clamp01((T - tm.sit) / 0.3)), d = T - tm.sit; kid.o.sq = Math.exp(-d * 9) * Math.cos(d * 24) * 0.1; kid.y += 0.3 * u * e; }
    if (best && T >= tm.cush) {
      const f = clamp01((T - tm.cush) / 0.8), e = ease(f), sx = best.q.x, sy = best.q.y - 1.0 * u, ex = sk.x, ey = sk.y - 0.05 * u;
      cush = { x: lerp(sx, ex, e), y: lerp(sy, ey, e) - Math.sin(Math.PI * f) * 1.6 * u, rot: (1 - f) * -2.2 };
      items.push({ y: kid.y - 0.02, f: () => drawCushion(c, cush.x, cush.y, u, cush.rot) });
    }
  }
  kids.forEach((q) => items.push({ y: q.y, f: () => drawKid(c, q.x, q.y, u, q.k, q.o) }));
  items.sort((a, b) => a.y - b.y);
  items.forEach((it) => it.f());
  drawNotes(c, w, h, time, T < tm.stop ? 1 : clamp01(1 - (T - tm.stop) / 0.25));

  if (after && T >= tm.runEnd + 0.2) {
    const t = T_(), pop = (T - tm.runEnd - 0.2) / 0.3;
    if (tm.lc > 0) {
      const showPill = !(tm.lc === 1 && T >= tm.sit); // the cushion gives the last child a seat
      if (showPill) leftPills(c, t.left, standing.map((q) => ({ x: q.x, y: q.y })), 0.55 * u + 22, w, h, pop);
      if (tm.lc === 1 && T >= tm.bub && T < tm.cush + 0.5) { // a friendly speech bubble
        const q = standing[0], bx = q.x, by = q.y - 2.7 * u - 20;
        c.save(); c.globalAlpha = 1; c.font = '800 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        const tw = c.measureText(t.h.more).width + 26, bh = 30, px = clamp(bx, tw / 2 + 6, w - tw / 2 - 6), py = Math.max(bh / 2 + 6, by);
        const sc = Math.max(0.01, backOut(clamp01((T - tm.bub) / 0.3)));
        c.translate(px, py); c.scale(sc, sc);
        c.fillStyle = '#ffffff'; c.strokeStyle = BG; c.lineWidth = 1.5;
        c.beginPath(); c.roundRect(-tw / 2, -bh / 2, tw, bh, 15); c.fill(); c.stroke();
        c.beginPath(); c.moveTo(clamp(bx - px, -tw / 2 + 14, tw / 2 - 14) - 6, bh / 2 - 1); c.lineTo(clamp(bx - px, -tw / 2 + 14, tw / 2 - 14), bh / 2 + 9); c.lineTo(clamp(bx - px, -tw / 2 + 14, tw / 2 - 14) + 6, bh / 2 - 1); c.fill();
        c.fillStyle = BG; c.fillText(t.h.more, 0, 1);
        c.restore();
      }
    }
    if (v.empty.length) leftPills(c, t.left, v.empty.map((i) => ({ x: L.pos[i].x, y: L.pos[i].y })), 0.85 * u + 22, w, h, pop);
  }
}

  }

  let g = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);

  c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * 0.76, 0, TAU); c.fill();
  c.lineWidth = 1; c.strokeStyle = shade(col, 0.32); c.stroke();
  c.strokeStyle = shade(col, 0.5); c.lineWidth = Math.max(1, r * 0.08); c.lineCap = 'round';
  c.beginPath(); c.moveTo(-r * 0.2, -r * 0.2); c.lineTo(r * 0.2, r * 0.2); c.moveTo(r * 0.2, -r * 0.2); c.lineTo(-r * 0.2, r * 0.2); c.stroke();

function drawThread(c, x1, y1, x2, y2, p) { // wool curving from (x1, y1) down to (x2, y2), drawn up to the fraction p
  if (p <= 0) return;
  const dy = (y2 - y1) * 0.55, n = 24, m = Math.max(1, Math.round(n * clamp01(p)));
  const pt = (t) => {
    const a = 1 - t;
    return [a * a * a * x1 + 3 * a * a * t * x1 + 3 * a * t * t * x2 + t * t * t * x2,
      a * a * a * y1 + 3 * a * a * t * (y1 + dy) + 3 * a * t * t * (y2 - dy) + t * t * t * y2];
  };
  c.save(); c.globalAlpha = 1; c.lineCap = 'round'; c.lineJoin = 'round';
  for (const [col, wd] of [[shade(THREAD, 0.4), 5], [THREAD, 3], [shade(THREAD, -0.4), 1]]) {
    c.strokeStyle = col; c.lineWidth = wd; c.beginPath();
    for (let i = 0; i <= m; i++) { const [px, py] = pt(p >= 1 ? i / m : p * i / m); if (i) c.lineTo(px, py); else c.moveTo(px, py); }
    c.stroke();
  }
  c.restore();
}

function rowsGeo(w, h, v) {
  const r = clamp(w * 0.055, 14, 26), sp = 2 * r + 2, pad = 14;
  return { r, sp, cx: w / 2, yT: h * 0.27, yB: h * 0.60, Lmax: w - 2 * pad - 2 * r, Lmin: Math.max(0, (v.nb - 1) * sp) };
}
const rowsTimes = (v) => {
  const np = Math.min(v.nt, v.nb), after = 0.3 + np * 0.4 + 0.3, slide = after + 0.5;
  return { np, after, slide, end: slide + 1.1 + 1.0 };
};

function drawRows(c, w, h, time, dt) {
  const v = V.rows, G = rowsGeo(w, h, v), { r, sp, cx, yT, yB } = G, tm = rowsTimes(v);
  const T = v.t0 === null ? -1 : time - v.t0, free = v.free;
  const L = clamp(v.L ?? G.Lmax, G.Lmin, G.Lmax);
  if (!free && T >= 0) v.slide = ease(clamp01((T - tm.slide) / 1.1));
  else if (free) v.slide += (0 - v.slide) * Math.min(1, dt * 5);
  else v.slide = 0;
  const row = (n, len) => Array.from({ length: n }, (_, k) => (n === 1 ? cx : cx - len / 2 + len * k / (n - 1)));
  const nmax = Math.max(v.nt, v.nb), al = Array.from({ length: nmax }, (_, k) => cx + (k - (nmax - 1) / 2) * sp);
  const tx0 = row(v.nt, (v.nt - 1) * sp), bx0 = row(v.nb, L);
  const tx = tx0.map((x, k) => lerp(x, al[k], v.slide)), bx = bx0.map((x, k) => lerp(x, al[k], v.slide));
  const tp = (k) => (free ? 1 : clamp01((T - (0.3 + k * 0.4)) / 0.5));
  const threadsDone = !free && T >= 0 ? Math.min(tm.np, Math.max(0, Math.floor((T - 0.3 - 0.5) / 0.4) + 1)) : 0;
  if (threadsDone > v.ticks) { v.ticks = threadsDone; sfx.tick(); }
  if (T >= tm.end && !v.revealed && v.t0 !== null) { v.revealed = true; render(); }

  drawLinen(c, w, h);
  for (let k = 0; k < tm.np; k++) drawThread(c, tx[k], yT, bx[k], yB, tp(k));
  const over = free || T >= tm.after;
  const pulse = over ? clamp01(free ? 1 : (T - tm.after) / 0.3) : 0;
  for (let k = 0; k < v.nt; k++) drawButton(c, tx[k], yT, r, RED, k >= tm.np ? pulse : 0, time);
  for (let k = 0; k < v.nb; k++) drawButton(c, bx[k], yB, r, BLUE, k >= tm.np ? pulse : 0, time);
  if (over) {
    const pop = free ? 1 : (T - tm.after - 0.2) / 0.3;
    if (v.nt > v.nb) leftPills(c, T_().left, tx.slice(tm.np).map((x) => ({ x, y: yT })), -r - 22, w, h, pop);
    if (v.nb > v.nt) leftPills(c, T_().left, bx.slice(tm.np).map((x) => ({ x, y: yB })), r + 22, w, h, pop);
  }

  const xR = bx[v.nb - 1], hy = yB + r + 62;

    c.save(); c.strokeStyle = THREAD; c.lineWidth = 3; c.lineCap = 'round'; c.setLineDash([2, 6]);
    c.beginPath(); c.moveTo(xR, yB + r); c.lineTo(xR, hy - 22); c.stroke(); c.restore();
    handle.style.display = 'flex'; handle.style.left = `${xR - 28}px`; handle.style.top = `${hy - 23}px`;
  } else handle.style.display = 'none';
  v.geo = G;
}

const SH = { M0: 0.6, GAP: 0.8, WALK: 1.6, LWALK: 2.0 };

function drawPen(c, x0, y0, x1, y1, u, front) {

    rail(x0, y0 - 0.5 * u, x0, y1 - 0.5 * u);
    post(x0, (y0 + y1) / 2); post(x1, y0 + (y1 - y0) * 0.1);
    rail(x1, y0 - 0.5 * u, x1, gate - 0.5 * u); // right side, above the gate
  } else {
    rail(x0, y1 - 0.5 * u, x1, y1 - 0.5 * u); rail(x0, y1 - 0.95 * u, x1, y1 - 0.95 * u);
    for (let x = x0; x <= x1 + 1; x += (x1 - x0) / 4) post(x, y1);
    rail(x1, gate2 - 0.5 * u, x1, y1 - 0.5 * u); // right side, below the gate
    rail(x1, gate2 - 0.5 * u, x1 + 1.5 * u, gate2 - 1.6 * u); // the gate, swung open
  }
  c.restore();
}

function drawSack(c, bx, by, bw, count, time, extra) { // extra: {hot, fly}
  const pr = bw * 0.13, mx = bx, my = by - bw * 0.92;
  c.save(); c.globalAlpha = 1;
  c.fillStyle = 'rgba(10, 30, 10, .28)'; c.beginPath(); c.ellipse(bx, by, bw * 0.55, bw * 0.13, 0, 0, TAU); c.fill();
  c.fillStyle = shade(TABLE, 0.45); c.beginPath(); c.ellipse(mx, my, bw * 0.4, bw * 0.12, 0, 0, TAU); c.fill(); // dark inside
  for (let j = 0; j < Math.min(count, 6); j++) pebble(c, mx + SLOTS[j][0] * pr, my + SLOTS[j][1] * pr, pr, 1);
  if (extra.hot) { // the last pebble: a pink ring
    const p = 0.5 + 0.5 * Math.sin(time * 5);
    c.strokeStyle = PINK; c.lineWidth = 3; c.globalAlpha = 0.5 + 0.5 * p;
    c.beginPath(); c.arc(mx + SLOTS[0][0] * pr, my + SLOTS[0][1] * pr, Math.max(1, pr * (1.7 + 0.2 * p)), 0, TAU); c.stroke(); c.globalAlpha = 1;
  }
  const body = new Path2D();
  body.moveTo(mx - bw * 0.4, my); body.bezierCurveTo(mx - bw * 0.62, by - bw * 0.55, mx - bw * 0.55, by, bx, by);
  body.bezierCurveTo(mx + bw * 0.55, by, mx + bw * 0.62, by - bw * 0.55, mx + bw * 0.4, my);
  body.bezierCurveTo(mx + bw * 0.25, my + bw * 0.16, mx - bw * 0.25, my + bw * 0.16, mx - bw * 0.4, my);
  const g = c.createLinearGradient(bx - bw * 0.5, 0, bx + bw * 0.5, 0);
  g.addColorStop(0, shade(TABLE, -0.2)); g.addColorStop(1, shade(TABLE, 0.2));
  c.fillStyle = g; c.fill(body); c.strokeStyle = shade(TABLE, 0.5); c.lineWidth = 1.5; c.stroke(body);
  c.strokeStyle = 'rgba(80, 40, 15, .3)'; c.lineWidth = 1;
  for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(bx + i * bw * 0.2, by - bw * 0.7); c.quadraticCurveTo(bx + i * bw * 0.28, by - bw * 0.35, bx + i * bw * 0.2, by - bw * 0.05); c.stroke(); }
  c.restore();
}
function pebble(c, x, y, r, a) {
  c.save(); c.globalAlpha = a;
  const g = c.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, '#E4E6EE'); g.addColorStop(1, '#8F95AA');
  c.fillStyle = g; c.strokeStyle = '#5A6078'; c.lineWidth = 1;
  c.beginPath(); c.ellipse(x, y, r, r * 0.88, 0.3, 0, TAU); c.fill(); c.stroke();
  c.restore();
}

function drawSheep(c, w, h, time) {
  const v = V.cups, T = v.t0 === null ? 0 : time - v.t0, u = Math.min(w, h * 1.1) * 0.052;
  if (T >= SH.end && !v.revealed && v.t0 !== null) { v.revealed = true; render(); }
  const ev = ease(clamp01((T - SH.tM) / 1.0));
  // sky, sun, ground
  let g = c.createLinearGradient(0, 0, 0, h * 0.5);
  g.addColorStop(0, mix('#8EC5FF', RUG, ev)); g.addColorStop(1, mix('#FFE9C2', '#FF9E80', ev));
  c.save(); c.globalAlpha = 1; c.fillStyle = g; c.fillRect(0, 0, w, h);
  const sx = lerp(w * 0.16, w * 0.84, ev), sy = lerp(h * 0.14, h * 0.34, ev);
  glowAt(c, sx, sy, u * 5, '255, 220, 140', 0.9);
  c.fillStyle = mix(THREAD, '#FF8A5C', ev); c.beginPath(); c.arc(sx, sy, u * 1.3, 0, TAU); c.fill();
  c.fillStyle = 'rgba(255, 255, 255, .8)';
  for (const [cx, cy, s] of [[0.3, 0.12, 1], [0.62, 0.2, 0.8]]) for (const [dx, dy, rr] of [[-1, 0.2, 0.9], [0, 0, 1.2], [1.1, 0.2, 0.8]]) {
    c.globalAlpha = 0.85 - 0.4 * ev; c.beginPath(); c.arc(w * cx + dx * u * s * 1.2, h * cy + dy * u * s, rr * u * s, 0, TAU); c.fill();
  }
  c.globalAlpha = 1;
  g = c.createLinearGradient(0, h * 0.4, 0, h);
  g.addColorStop(0, mix('#7DC46A', '#4E8B66', ev)); g.addColorStop(1, mix('#4F9A52', '#2F6648', ev));
  c.fillStyle = g; c.beginPath(); c.moveTo(0, h * 0.46); c.bezierCurveTo(w * 0.3, h * 0.38, w * 0.65, h * 0.5, w, h * 0.42); c.lineTo(w, h); c.lineTo(0, h); c.closePath(); c.fill();
  // the pen floor
  const px0 = w * 0.04, px1 = w * 0.33, py0 = h * 0.56, py1 = h * 0.86, gate = { x: px1, y: py0 + (py1 - py0) * 0.55 };
  g = c.createLinearGradient(0, py0, 0, py1); g.addColorStop(0, mix('#B58A5C', '#7A5A45', ev)); g.addColorStop(1, mix('#9C7449', '#654A3A', ev));
  c.fillStyle = g; c.beginPath(); c.roundRect(px0, py0 - 0.4 * u, px1 - px0, py1 - py0 + 0.4 * u, 8); c.fill();
  c.restore();
  drawPen(c, px0, py0, px1, py1, u, false);

  // where every animal is
  const pen = (i) => ({ x: px0 + (px1 - px0) * (0.2 + 0.3 * (i % 3)), y: py0 + (py1 - py0) * (0.5 + 0.34 * Math.floor(i / 3)) });
  const bush = { x: w * 0.86, y: h * 0.62 };
  const spot = (i) => (i < 5 ? { x: w * PASTURE[i][0], y: h * PASTURE[i][1] } : { x: bush.x, y: bush.y - 1.5 * u });
  const leg = (a, b, f) => ({ x: lerp(a.x, b.x, f), y: lerp(a.y, b.y, f) });
  const animals = [];
  for (let i = 0; i < 6; i++) {
    const P = pen(i), S = spot(i), tm = SH.M0 + i * SH.GAP, te = i < 5 ? SH.E0 + i * SH.GAP : SH.tLamb, wk = i < 5 ? SH.WALK : SH.LWALK;
    let p = P, dir = 1, walking = false;
    if (T < tm) p = P;
    else if (T < tm + SH.WALK) { // out of the pen, through the gate, to the pasture
      const f = (T - tm) / SH.WALK; walking = true;
      if (f < 0.3) { p = leg(P, gate, f / 0.3); dir = gate.x >= P.x ? 1 : -1; } else { p = leg(gate, S, (f - 0.3) / 0.7); dir = S.x >= gate.x ? 1 : -1; }
    } else if (T < te) p = S;
    else if (T < te + wk) { // home again
      const f = (T - te) / wk; walking = true;
      if (f < 0.7) { p = leg(S, gate, f / 0.7); dir = gate.x >= S.x ? 1 : -1; } else { p = leg(gate, P, (f - 0.7) / 0.3); dir = P.x >= gate.x ? 1 : -1; }
    } else p = P;
    const lamb = i === 5;
    const ears = lamb && T >= SH.tM + 0.3 && T < te ? Math.sin(time * 7) : 0;
    animals.push({ y: p.y, f: () => drawSheepBody(c, p.x, p.y, u, dir, walking ? Math.abs(Math.sin(time * 9 + i)) * 0.12 : 0, lamb ? 0.72 : 1, ears) });
  }
  animals.push({ y: bush.y, f: () => drawBush(c, bush.x, bush.y, u) });
  animals.sort((a, b) => a.y - b.y).forEach((a) => a.f());
  drawPen(c, px0, py0, px1, py1, u, true);

  // the bag, and the pebbles dropping in (morning) and coming out (evening)
  const bw = Math.max(46, w * 0.15), bag = { x: w * 0.455, y: h * 0.9 }, mouth = { x: bag.x, y: bag.y - bw * 0.92 }, pr = bw * 0.13;
  const drops = Array.from({ length: 6 }, (_, i) => SH.M0 + i * SH.GAP + 0.3 * SH.WALK);
  const pops = [0, 1, 2, 3, 4].map((j) => SH.E0 + j * SH.GAP + 0.7 * SH.WALK).concat([SH.tLamb + 0.7 * SH.LWALK]);
  const inBag = drops.filter((t) => T >= t + 0.6).length - pops.filter((t) => T >= t).length;
  const hot = inBag === 1 && T >= SH.E0 + 4 * SH.GAP + SH.WALK && T < pops[5];
  // sounds on landings and pops
  const ev2 = drops.filter((t) => T >= t + 0.6).length + pops.filter((t) => T >= t).length;
  if (ev2 > (v.played || 0)) { v.played = ev2; (ev2 > 6 ? sfx.click : sfx.tick)(); }
  drawSack(c, bag.x, bag.y, bw, inBag, time, { hot });
  drops.forEach((t, i) => { // falling in
    const f = (T - t) / 0.6;
    if (f > 0 && f < 1) { const sx0 = gate.x, sy0 = gate.y - 1.8 * u, ex = mouth.x + SLOTS[i][0] * pr, ey = mouth.y + SLOTS[i][1] * pr; pebble(c, lerp(sx0, ex, ease(f)), lerp(sy0, ey, f * f) - Math.sin(Math.PI * f) * u * 1.2, pr, 1); }
  });
  pops.forEach((t, j) => { // rising out
    const f = (T - t) / 0.7;
    if (f > 0 && f < 1) {
      const slot = SLOTS[5 - j], sx0 = mouth.x + slot[0] * pr, sy0 = mouth.y + slot[1] * pr, ex = gate.x - 0.4 * u, ey = gate.y - 2.4 * u, e = ease(f);
      pebble(c, lerp(sx0, ex, e), lerp(sy0, ey, e) - Math.sin(Math.PI * f) * u * 1.5, pr * (1 - 0.3 * f), 1 - f);
      sparkle(c, ex, ey, f, u * 1.2);
    }
  });
  if (T >= SH.end - 0.9) sparkle(c, px0 + (px1 - px0) / 2, py0 + (py1 - py0) / 2, clamp01((T - (SH.end - 0.9)) / 0.9), u * 3);
}

// ============================================================================================================
// the draw loop
// ============================================================================================================
const loop = canvasLoop($('cv'), (c, w, h, dt, time) => {
  const view = lab.view;
  if (view === 'cups') drawCups(c, w, h, time);
  else if (view === 'chairs') drawChairs(c, w, h, time, dt);
  else drawRows(c, w, h, time, dt);
});

// --- the stretch handle -------------------------------------------------------------------------------------
let dragging = false;
const setL = (clientX) => {
  const v = V.rows, G = v.geo; if (!G) return;
  const r = $('cv').getBoundingClientRect();
  const nl = clamp(2 * (clientX - r.left - G.cx), G.Lmin, G.Lmax);
  if (Math.abs(nl - (v.L ?? G.Lmax)) > 18) sfx.tick();
  v.L = nl;
};
handle.addEventListener('pointerdown', (ev) => { dragging = true; handle.setPointerCapture(ev.pointerId); sfx.click(); ev.preventDefault(); });
handle.addEventListener('pointermove', (ev) => { if (dragging) setL(ev.clientX); });
const endDrag = () => { dragging = false; };
handle.addEventListener('pointerup', endDrag); handle.addEventListener('pointercancel', endDrag);
handle.addEventListener('keydown', (ev) => {
  const v = V.rows, G = v.geo; if (!G || !['ArrowLeft', 'ArrowRight'].includes(ev.key)) return;
  v.L = clamp((v.L ?? G.Lmax) + (ev.key === 'ArrowRight' ? 14 : -14), G.Lmin, G.Lmax); sfx.tick(); ev.preventDefault();
});

// --- controls -----------------------------------------------------------------------------------------------
const showStage = () => { // on a phone the options sit below the picture: bring the picture into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function startSecret(k) {
  const v = V.cups; v.sec = k;
  if (k === 'count') { v.s = { nc: 5, ns: 4 }; v.badge = true; v.pairStart = 0.3 + 0.4 * 9 + 0.6; }
  start('cups'); showStage();
}
function step(view, key, d) {
  const v = V[view], lim = [1, 8];
  const tgt = view === 'cups' && v.sec === 'count' ? v.s : v;
  tgt[key] = clamp(tgt[key] + d, lim[0], lim[1]);
  v.t0 = null; v.revealed = false; v.played = 0;
  if (view === 'chairs') { v.stopped = false; v.sat = 0; v.beat = -1; }
  if (view === 'cups' && v.sec === 'count') { v.pairStart = 0.3 + 0.4 * (v.s.nc + v.s.ns) + 0.6; start('cups'); }
  sfx.tick();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const view = lab.view, v = V[view], act = b.dataset.act;
  if (act === 'pick') {
    if (v.t0 !== null) return;
    v.guess = +b.dataset.i; start(view); sfx.click(); showStage();
  } else if (act === 'next') {
    if (v.ri < 2) { v.ri++; load(view); } else { // after the last round: free play
      v.free = true; v.t0 = null; v.revealed = false; v.guess = null;
      if (view === 'cups') v.played = 0;
      if (view === 'chairs') { v.stopped = false; v.sat = 0; v.beat = -1; }
    }
    sfx.click();
  } else if (act === 'again') {
    V[view] = fresh[view](); load(view); sfx.click();
  } else if (act === 'step') step(view, b.dataset.k, +b.dataset.d);
  else if (act === 'play') {
    if (view === 'cups' && v.sec === 'count') startSecret('count');
    else { if (view === 'cups') v.pairStart = 0.25; start(view); sfx.click(); showStage(); }
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (v.sec === k) { v.sec = null; v.badge = false; v.pairStart = 0.25; v.t0 = null; v.revealed = false; v.played = 0; sfx.click(); }
    else { startSecret(k); sfx.click(); }
  }
  render();
});

// --- one render per change: controls, readout, state card -----------------------------------------------------
function qHTML(view) {
  const v = V[view], t = T[lang], qt = t[QKEY[view]], right = DATA[view][v.ri][2], asked = v.t0 !== null;
  const dots = [0, 1, 2].map((i) => `<i class="${i < v.ri || (i === v.ri && v.revealed) ? 'done' : i === v.ri ? 'cur' : ''}"></i>`).join('');
  const opts = qt.o.map((o, i) => {
    const cls = v.revealed ? (i === right ? 'right' : i === v.guess ? 'wrong' : '') : (i === v.guess ? 'pick' : '');
    return `<button class="mf-o ${cls}" data-act="pick" data-i="${i}"${asked ? ' disabled' : ''}><span class="mf-ic">${ICONS[view][i]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  let html = `<div class="mf-dots">${dots}</div><div class="mf-q">${esc(qt.q)}</div><div class="mf-opts">${opts}</div>`;
  if (v.revealed) {
    const ok = v.guess === right;
    html += `<div class="mf-v ${ok ? 'ok' : 'no'}"><b>${esc(ok ? t.right : t.wrong)}</b>${esc(qt.why[v.ri])}</div>`
      + `<div class="mf-act"><button class="btn" data-act="next">${esc(t.next)}</button></div>`;
  }
  return html;
}
const stepper = (key, emo, dis) => `<div class="mf-row" style="margin-top:0"><button class="mf-st" data-act="step" data-k="${key}" data-d="-1"${dis[0] ? ' disabled' : ''}>− ${emo}</button>`
  + `<button class="mf-st" data-act="step" data-k="${key}" data-d="1"${dis[1] ? ' disabled' : ''}>+ ${emo}</button></div>`;
const lim = (x) => [x <= 1, x >= 8];
const card = (view, full) => { const k = T[lang].cards[view][full ? 'f' : 'n']; lab.setState({ emo: k[0], title: k[1], lead: k[2], body: k[3], extra: '' }); };

function render() {
  const t = T[lang], view = lab.view, v = V[view];
  document.body.dataset.v = view;
  lab.setGlow(GLOW[view]);
  handle.style.display = view === 'rows' && v.free ? handle.style.display : 'none';
  $('mfQ').innerHTML = ''; $('mfF').innerHTML = ''; $('mfS').innerHTML = '';
  const full = v.free || (v.ri === 2 && v.revealed);
  if (view === 'cups') {
    const sheep = v.sec === 'sheep', cn = cupCounts(v);
    if (!v.free) { $('mfQ').innerHTML = qHTML('cups'); lab.setReadout('', '', ''); card('cups', full); return; }
    if (sheep) {
      $('mfF').innerHTML = `<div class="mf-row"><button class="btn" data-act="play">${v.revealed ? esc(t.again) : '▶'}</button></div>`;
      lab.setReadout('', '', '');
    } else {
      $('mfF').innerHTML = `<div class="mf-row">${stepper('nc', '☕', lim(cn.nc))}${stepper('ns', '🍽️', lim(cn.ns))}</div>`
        + `<div class="mf-row"><button class="btn" data-act="play">${esc(t.c.pair)}</button><button class="chip" data-act="again">${esc(t.again)}</button></div>`;
      const r = cn.nc > cn.ns ? 'more' : cn.nc < cn.ns ? 'fewer' : 'same';
      lab.setReadout(t.c.count(cn.nc, cn.ns), v.revealed ? t.c.result(r) : '', '');
    }
    const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${v.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    $('mfS').innerHTML = `<div class="chips mf-chips">${sc('sheep', '🐑')}${sc('count', '🔢')}</div>`;
    if (v.sec) lab.setState({ emo: v.sec === 'sheep' ? '🐑' : '🔢', title: t.secrets[v.sec][0], lead: t.sec[v.sec === 'sheep' ? 'sheepText' : 'countText'], body: '', extra: '' });
    else card('cups', true);
  } else if (view === 'chairs') {
    if (!v.free) { $('mfQ').innerHTML = qHTML('chairs'); lab.setReadout('', '', ''); card('chairs', full); return; }
    $('mfF').innerHTML = `<div class="mf-row">${stepper('nk', '🧒', lim(v.nk))}${stepper('nch', '🪑', lim(v.nch))}</div>`
      + `<div class="mf-row"><button class="btn" data-act="play">${esc(t.h.play)}</button><button class="chip" data-act="again">${esc(t.again)}</button></div>`;
    lab.setReadout(`🧒 ${v.nk} · 🪑 ${v.nch}`, '', '');
    card('chairs', true);
  } else {
    if (!v.free) { $('mfQ').innerHTML = qHTML('rows'); lab.setReadout('', '', ''); card('rows', full); return; }
    $('mfF').innerHTML = `<div class="mf-row"><span class="mf-hint">⟷ ${esc(t.r.drag)}</span><button class="chip" data-act="again">${esc(t.again)}</button></div>`;
    lab.setReadout(t.r.state, '', '');
    card('rows', true);
  }
}
['cups', 'chairs', 'rows'].forEach((k) => load(k));
render();
</script>
</body>
</html>
