const hexv = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hexv(a), B = hexv(b), u = clamp(t, 0, 1); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * u).toString(16).padStart(2, '0')).join(''); };
const ease = (t) => { const u = clamp(t, 0, 1); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); };
const inR = (r, x, y) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
const place = (el, r) => { el.style.left = r.x + 'px'; el.style.top = r.y + 'px'; el.style.width = r.w + 'px'; el.style.height = r.h + 'px'; };
function pill(c, text, x, y, maxX, o = {}) {

  const w = c.measureText(text).width + 18, px = clamp(x, 4, Math.max(4, maxX - w - 4));

  c.fillStyle = o.fg || '#fff'; c.fillText(text, px + 9, y + 12.5); c.restore();
}
function wrap(c, text, maxW) {
  const out = []; let line = '';
  for (const w of text.split(' ')) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line);

// --- a tiny 3D camera: the garden is real 3D, the photo is its perspective projection ---------------------------
// world: x forward along the path (to the house), y up, z to the right. The camera moves in the x-y plane and looks at a point on the cat.
const mkCam = (ex, ey, tx, ty, X, Y, W, H) => {
  let fx = tx - ex, fy = ty - ey; const L = Math.hypot(fx, fy) || 1; fx /= L; fy /= L;
  return { ex, ey, fx, fy, ux: -fy, uy: fx, X, Y, W, H, cx: X + W / 2, cy: Y + H / 2, F: H / 2 / TANV };
};
const dep = (k, x, y) => (x - k.ex) * k.fx + (y - k.ey) * k.fy;
const pj = (k, x, y, z) => { const rx = x - k.ex, ry = y - k.ey, d = rx * k.fx + ry * k.fy; return [k.cx + z / d * k.F, k.cy - (rx * k.ux + ry * k.uy) / d * k.F, d]; };
function poly3(k, pts) { // clip against the near plane, then project
  const out = [], dd = pts.map((p) => dep(k, p[0], p[1]));
  for (let i = 0; i < pts.length; i++) {
    const j = (i + 1) % pts.length, a = pts[i], b = pts[j], da = dd[i], db = dd[j];
    if (da >= NEAR) out.push(a);
    if ((da >= NEAR) !== (db >= NEAR)) { const t = (NEAR - da) / (db - da); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]); }
  }
  return out.map((p) => pj(k, p[0], p[1], p[2]));
}
function fp(c, k, pts, fill, stroke, lw = 1) {
  const p = poly3(k, pts); if (p.length < 3) return;
  c.beginPath(); p.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath();
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.lineJoin = 'round'; c.stroke(); }
}
function ln(c, k, a, b, col, lw) {
  const da = dep(k, a[0], a[1]), db = dep(k, b[0], b[1]); if (da < NEAR && db < NEAR) return;
  let A = a, B = b; const t = (NEAR - da) / (db - da);

  else if (db < NEAR) B = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

}
function ball(c, k, x, y, z, r, col, o = {}) {

  const R = Math.max(0, r / d * k.F); if (R < 0.25 || sx + R < k.X || sx - R > k.X + k.W || sy + R < k.Y || sy - R > k.Y + k.H) return null;

const ell3 = (x, z, rx, rz, y = 0.003, n = 18) => Array.from({ length: n }, (_, i) => [x + Math.cos(i / n * TAU) * rx, y, z + Math.sin(i / n * TAU) * rz]);

// cat face: features only when that spot of the head faces the camera
function face(c, k) {
  const H = [-0.01, 0.37, 0], r = 0.088, dH = Math.max(NEAR, dep(k, H[0], H[1]));

  const sp = (a, b, z) => { const L = Math.hypot(a, b, z); return [H[0] + a / L * r, H[1] + b / L * r, H[2] + z / L * r]; };

  for (const s of [-1, 1]) { // stripes on the forehead, eyes
    const a = sp(-0.45, 0.9, s * 0.28), b = sp(-0.12, 1, s * 0.2);
    if (vis(a, nr(a)) > 0.05) ln(c, k, a, b, '#c4701f', lw(0.007));
    const e = sp(-1, 0.18, s * 0.46), v = vis(e, nr(e));
    if (v > 0.12) {
      const [sx, sy, d] = pj(k, e[0], e[1], e[2]), R = 0.021 / d * k.F, hx = R * clamp(v * 1.1, 0.35, 1);
      if (R > 0.8) {
        c.fillStyle = '#ffffff'; c.beginPath(); c.ellipse(sx, sy, Math.max(0, hx), Math.max(0, R), 0, 0, TAU); c.fill();
        c.fillStyle = '#7acb68'; c.beginPath(); c.ellipse(sx, sy, Math.max(0, hx * 0.74), Math.max(0, R * 0.82), 0, 0, TAU); c.fill();
        c.fillStyle = '#14201a'; c.beginPath(); c.ellipse(sx, sy, Math.max(0, hx * 0.3), Math.max(0, R * 0.62), 0, 0, TAU); c.fill();
        c.fillStyle = '#ffffff'; c.beginPath(); c.arc(sx - hx * 0.25, sy - R * 0.3, Math.max(0, R * 0.2), 0, TAU); c.fill();

    const m1 = sp(-1, -0.34, 0);

    const b = [-0.092, 0.347 + dy, s * 0.03], t = [-0.115, 0.347 + dy * 2 - 0.01, s * 0.15];

  }
}

function lathe(add, c, k, cx, cz, y0, y1, r0, r1, col, N = 12) { // a pot made of strips; light from the top left

      c.fillStyle = 'rgba(130,145,190,.1)'; rr(c, sx, y, tw, th, 6); c.fill(); c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.stroke();
      if (item) { c.save(); rr(c, sx, y, tw, th, 6); c.clip(); c.drawImage(item.cv, sx, y, tw, th); c.restore(); c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.5; rr(c, sx, y, tw, th, 6); c.stroke(); }
    }
    if (S.fly) {
      const e = ease(S.fly.t), a = L.vf, b = { x: x0, y, w: tw, h: th }, r = { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e), w: lerp(a.w, b.w, e), h: lerp(a.h, b.h, e) };
      c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 10; c.fillStyle = '#f6f1e6'; rr(c, r.x - 2, r.y - 2, r.w + 4, r.h + 4, 6); c.fill(); c.restore(); c.save(); rr(c, r.x, r.y, r.w, r.h, 5); c.clip(); c.drawImage(S.fly.item.cv, r.x, r.y, r.w, r.h); c.restore();
    }
  }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (!S.L || S.L.w !== w || S.L.h !== h || S.L.v !== lab.view) relayout();
  if (!S.L) return;
  step(dt);
  if (lab.view === 'story') drawStory(c, S.L, time); else drawMain(c, S.L, time);
});

// --- actions -------------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function shoot() {
  const cam = getCam(), cv = document.createElement('canvas'); cv.width = 160; cv.height = 120;
  scene(cv.getContext('2d'), mkCam(cam[0], cam[1], cam[2], cam[3], 0, 0, 160, 120), sceneOpts());
  S.flash = 1; sfx.snap();
  if (S.fly) { S.gal.unshift(S.fly.item); S.gal.length = Math.min(S.gal.length, 4); }
  S.fly = { t: 0, item: { cv } };
}
function setSec(k) {
  if (!secret.unlocked()) return secret.open();
  const same = S.sec === k; S.sec = same ? null : k; lab.view = 'angle'; lab.renderChrome(); sfx.click(); if (!same && k === 'drone') S.pdr = 0; relayout(); render(); showStage();
}
function resetAngle() { S.round = 0; S.phase = 'ask'; S.guess = null; S.moved = false; S.vdOff = false; S.phi = S.phiT = 0.4; }
function setTask(i) { S.ti = i; S.tphase = 'ask'; S.tGuess = null; S.tMsg = null; S.D = START[i]; $('caD').value = Math.log(S.D / 0.3) / Math.log(30); }
function dragTo(x, y) {
  const m = S.map; if (!m) return;
  const wx = m.win.x0 + (x - m.ox) / m.sc, wy = m.win.y0 + (m.oy - y) / m.sc;
  S.phiT = clamp(Math.atan2((wy - Y0) / RY, -wx / RX), 0, Math.PI / 2); S.dragged = true; S.moved = true; S.vdOff = true;
}
const cvEl = $('cv');
const pos = (ev) => { const r = cvEl.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cvEl.addEventListener('pointerdown', (ev) => {
  const [x, y] = pos(ev), L = S.L, v = lab.view; if (!L) return;
  if (v === 'angle' && !S.sec && S.phase !== 'ask' && S.phase !== 'move' && inR(L.dg, x, y)) { S.dragging = true; cvEl.setPointerCapture(ev.pointerId); dragTo(x, y); render(); }
  else if (v === 'story') {
    const st = S.st;
    if (st.phase === 'pick' && !st.pick) { for (const id of ['w', 'c']) if (inR(L.sp[id], x, y)) { st.pick = id; (id === 'w' ? sfx.good : sfx.bad)(); render(); showStage(); } }
    else if (st.phase === 'crop' && inR(L.P, x, y)) { st.drag = true; st.moved = true; cvEl.setPointerCapture(ev.pointerId); st.cx = (x - L.P.x) / L.P.w; st.cy = (y - L.P.y) / L.P.h; render(); }
  }
});
cvEl.addEventListener('pointermove', (ev) => {
  const [x, y] = pos(ev), L = S.L;
  if (S.dragging) dragTo(x, y);
  else if (S.st.drag && L?.P) { S.st.cx = (x - L.P.x) / L.P.w; S.st.cy = (y - L.P.y) / L.P.h; render(); }
});
const release = () => { S.dragging = false; S.st.drag = false; };
cvEl.addEventListener('pointerup', release); cvEl.addEventListener('pointercancel', release);

$('overlay').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.g !== undefined) { // angle: the guess; the camera then moves and the photo appears
    S.guess = +b.dataset.g; S.ok = S.guess === (S.round === 0 ? 0 : 1); S.phiT = S.round === 0 ? 0 : 0.98; S.phase = 'move'; S.moved = false; S.vdOff = false;
    (S.ok ? sfx.good : sfx.bad)(); showStage();
  } else if (b.dataset.t !== undefined) { S.tGuess = +b.dataset.t; S.tOk = S.tGuess === DIRS[S.ti]; S.tphase = 'play'; (S.tOk ? sfx.good : sfx.bad)(); }
  else if (b.id === 'caShut') {
    if (lab.view === 'frame' && S.tphase === 'ask') return;
    shoot();
    if (lab.view === 'frame' && S.tphase === 'play') { const r = judge(S.ti, S.Dv); S.tMsg = r; if (r === 'ok') { S.tphase = 'done'; sfx.good(); } else sfx.bad(); }
  } else if (b.id === 'caNext') {
    const v = lab.view; sfx.click();
    if (v === 'angle') { S.round = 1; S.phase = 'ask'; S.guess = null; S.vdOff = false; }
    else if (v === 'frame') { if (S.ti >= 2) setTask(0); else setTask(S.ti + 1); }
    else { S.st.phase = 'crop'; S.st.moved = false; relayout(); }
  }
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'sec') setSec(b.dataset.k);
  else if (a === 'again') { sfx.click(); if (lab.view === 'angle') { S.sec = null; resetAngle(); } render(); }
  else if (a === 'sz') { S.st.size = +b.dataset.n; sfx.tick(); render(); }
  else if (a === 'back') { S.st.phase = 'pick'; sfx.click(); relayout(); render(); }
});
$('caD').addEventListener('input', (ev) => { if (S.tphase === 'ask') return; S.D = 0.3 * Math.pow(30, +ev.target.value); S.tMsg = null; render(); });

// --- one render per change: controls, overlays, readout and the state card ---------------------------------------------
function render() {
  const t = T[lang], v = lab.view, L = relayout() || S.L; if (!L) return;
  document.body.dataset.v = v;
  const asking = v === 'angle' && !S.sec && S.phase === 'ask';
  $('caSecA').hidden = v !== 'angle' || asking; $('caSecF').hidden = v !== 'frame'; $('caSz').parentElement.hidden = v !== 'story' || S.st.phase !== 'crop';
  $('caTip').textContent = t.an.tip;
  const open = secret.unlocked(), chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k === 'ant' ? 'a' : 'b'][0])}` : '🔒 ???'}</button>`;
  $('caSec').innerHTML = chip('ant', '🐜') + chip('drone', '🛸');
  $('caSz').innerHTML = (S.st.phase === 'crop' ? [0, 1, 2].map((n) => `<button class="chip ${S.st.size === n ? 'on' : ''}" data-act="sz" data-n="${n}">${esc(t.sy.sizes[n])}</button>`).join('') + `<button class="chip" data-act="back">${esc(t.sy.back)}</button>` : '');
  $('caE0').textContent = t.fr.ends[0]; $('caE1').textContent = t.fr.ends[1]; $('caD').disabled = S.tphase === 'ask'; $('caD').setAttribute('aria-label', t.fr.ends.join(' / '));
  $('caShut').setAttribute('aria-label', t.snap); $('caShut').title = t.snap;
  const task = $('caTask'), cover = $('caCover'), vd = $('caVd'), row = $('caRow'), q2 = $('caQ2'), next = $('caNext'), again = $('caAgain');
  task.hidden = v === 'angle'; task.className = 'ca-task'; cover.hidden = true; vd.hidden = true; next.hidden = true; again.hidden = true; row.hidden = v === 'story'; q2.hidden = true; $('caShut').hidden = false;
  const verdict = (ok, text) => { vd.hidden = false; vd.className = 'ca-vd' + (ok ? '' : ' ca-no'); vd.textContent = text; };
  lab.setGlow('rgba(240,170,80,.25)');
  let st;
  if (v === 'angle') {
    again.hidden = !(S.sec || S.phase === 'shown' && S.round === 1); again.textContent = t.again;
    if (S.sec) { const k = S.sec === 'ant' ? 'a' : 'b'; st = { emo: S.sec === 'ant' ? '🐜' : '🛸', title: t.secrets[k][0], lead: t.secrets[k][1], body: t.secrets[k + 'Body'] }; }
    else if (asking) {
      cover.hidden = false; $('caShut').hidden = true; row.hidden = true;
      cover.innerHTML = `<div class="ca-q">${esc(t.an.q[S.round])}</div>${t.an.opts.map((o, i) => `<button data-g="${i}">${esc(o)}</button>`).join('')}`;
      st = { emo: '🤔', title: t.an.ask[0], lead: t.an.q[S.round], body: t.an.ask[1] };
    } else if (S.phase === 'move') { st = { emo: '📷', title: t.an.ask[0], lead: t.an.q[S.round], body: '' }; }
    else {
      if (S.guess !== null && !S.vdOff) verdict(S.ok, S.ok ? t.yes : t.no);
      if (S.round === 0 && S.guess !== null && !S.vdOff) { next.hidden = false; next.textContent = t.an.go2; }
      else if (S.round === 0 && S.phase === 'shown') { next.hidden = false; next.textContent = t.an.go2; }
      if (S.moved) { const y = eyeOf(S.phi)[1], f = t.an.free[y < 0.5 ? 'low' : y > 1.5 ? 'high' : 'eye']; st = { emo: '📷', title: f[0], lead: f[1], body: t.an.tip }; }
      else { const r = t.an.r[S.round]; st = { emo: '🔭', title: r[0], lead: r[1], body: r[2] }; }
    }
    lab.setFacts([t.facts.angle]);
  } else if (v === 'frame') {
    const i = S.ti, f = t.fr, msg = S.tMsg;
    task.innerHTML = `<b>📋 ${esc(f.label)} ${i + 1}/3</b><span>${esc(f.tasks[i])}</span>`; task.className = 'ca-task' + (S.tphase === 'done' ? ' ca-ok' : '');
    if (S.tphase === 'ask') { $('caShut').hidden = true; q2.hidden = false; q2.innerHTML = `<div class="t">${esc(f.q)}</div><div class="ca-o2">${f.opts.map((o, j) => `<button data-t="${j}">${esc(o)}</button>`).join('')}</div>`; }
    if (msg) verdict(msg === 'ok', msg === 'ok' ? f.good : f.bad[msg]);
    else if (S.tGuess !== null) verdict(S.tOk, S.tOk ? t.yes : t.no);
    if (S.tphase === 'done') { next.hidden = false; next.textContent = i >= 2 ? t.next2 : f.next; }
    st = S.tphase === 'ask' ? { emo: '📋', title: f.tasks[i], lead: f.q, body: '' } : S.tphase === 'done' ? { emo: '🎬', title: f.done[i][0], lead: f.done[i][1], body: '' } : { emo: '🎬', title: f.tasks[i], lead: msg && msg !== 'ok' ? f.bad[msg] : f.play, body: msg ? f.play : '' };
    lab.setFacts([t.facts.frame]);
  } else {
    const y = t.sy, s = S.st;
    if (s.phase === 'pick') {
      if (!s.pick) { task.innerHTML = `<span>🖼️ ${esc(y.q)}</span>`; st = { emo: '🖼️', title: y.ask[0], lead: y.q, body: y.ask[1] }; }
      else { const ok = s.pick === 'w'; task.className = 'ca-task ' + (ok ? 'ca-ok' : 'ca-no'); task.innerHTML = `<span>${esc(ok ? t.yes : t.no)}</span>`; next.hidden = false; next.textContent = y.crop; st = { emo: '🖼️', title: y.after[0], lead: y.after[1], body: y.after[2] }; }
    } else { const cs = cropState(), r = y.res[cs]; task.className = 'ca-task ' + (cs === 'cat' ? 'ca-ok' : cs === 'both' ? '' : 'ca-no'); task.innerHTML = `<span>✂️ ${esc(r[0])}</span>`; st = { emo: '✂️', title: r[0], lead: r[1], body: y.after[2] }; }
    lab.setFacts([t.facts.story]);
  }
  lab.setState(st); S.rk = ''; readout();
}
$('caD').value = Math.log(S.D / 0.3) / Math.log(30);
render();
</script>
