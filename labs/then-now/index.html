const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);

const tone = (a, k) => rgb(k >= 0 ? mixc(a, [255, 255, 255], k) : mixc(a, [0, 0, 0], -k));
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));

function screen(c, x, y, w, h, gray, r) {

  const bx = x + w * (0.12 + 0.76 * ((TM * 0.17) % 1)), by = y + h * 0.84 - Math.abs(Math.sin(TM * 3.2)) * h * 0.34;

}

// generic drag: a ghost follows the finger; a drop on [data-drop] calls onDrop(key, element), a plain tap calls onTap(key, element)
function dragger(root, { sel, can, onTap, onDrop }) {
  let d = null, ghost = null, over = null;
  const clear = () => { ghost?.remove(); ghost = null; over?.classList.remove('tn-over'); over = null; d?.el.classList.remove('tn-lift', 'lift'); d = null; };
  const target = (x, y) => document.elementsFromPoint(x, y).find((e) => e.dataset && e.dataset.drop !== undefined && root.contains(e)) ?? null;
  root.addEventListener('pointerdown', (ev) => {
    const el = ev.target.closest(sel); if (!el || !root.contains(el) || (can && !can(el))) return;
    d = { el, key: el.dataset.drag, x0: ev.clientX, y0: ev.clientY, moved: false };
    try { el.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
  });
  root.addEventListener('pointermove', (ev) => {
    if (!d) return;
    if (!d.moved && Math.hypot(ev.clientX - d.x0, ev.clientY - d.y0) > 8) {
      d.moved = true; ghost = d.el.cloneNode(true); ghost.classList.add('tn-ghost'); ghost.style.width = `${d.el.getBoundingClientRect().width}px`; document.body.append(ghost);
      d.el.classList.add('lift');
    }
    if (d.moved) {
      ghost.style.transform = `translate(${ev.clientX - 24}px, ${ev.clientY - 28}px) rotate(-3deg)`;
      const t = target(ev.clientX, ev.clientY); if (t !== over) { over?.classList.remove('tn-over'); over = t; over?.classList.add('tn-over'); }
    }
  });
  root.addEventListener('pointerup', (ev) => {
    if (!d) return;
    const { key, el, moved } = d, t = moved ? target(ev.clientX, ev.clientY) : null; clear();
    if (moved) { if (t) onDrop(key, t); } else onTap?.(key, el);
  });
  root.addEventListener('pointercancel', clear);
}

const dayLeft = () => DAY.length - S.di;
function pickDay(choice) {
  if (S.dpick !== null || S.di >= DAY.length) return;
  const c = DAY[S.di], ok = (choice === 'changed') === c.ch;
  S.dpick = choice; S.dres.push({ k: c.k, e: c.e, ok, ch: c.ch }); (ok ? sfx.good : sfx.bad)(); render();
}
dragger($('tnDay'), { sel: '.tn-card[data-drag]', can: () => S.dpick === null && S.di < DAY.length, onDrop: (_, t) => { if (t.dataset.drop === 'bin') pickDay(t.dataset.bin); } });
$('tnDay').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-bin], [data-dact]'); if (!b) return;
  if (b.dataset.bin) return pickDay(b.dataset.bin);
  if (b.dataset.dact === 'next') { S.di++; S.dpick = null; sfx.click(); }
  else if (b.dataset.dact === 'again') { S.di = 0; S.dres = []; S.dpick = null; sfx.click(); }
  render();
});

// Years
const placed = (key) => S.lslots.indexOf(key);
function lineDrop(key, el) {
  if (S.lchecked) return;
  const from = placed(key);
  if (el.dataset.drop === 'tray') { if (from >= 0) S.lslots[from] = null; }
  else { const to = +el.dataset.i, occ = S.lslots[to]; if (from >= 0) S.lslots[from] = occ === key ? null : occ; S.lslots[to] = key; }
  S.lsel = null; sfx.snap(); render();
}
dragger($('tnLine'), {
  sel: '.tn-tile[data-drag]', can: () => !S.lchecked,
  onDrop: lineDrop,
  onTap: (key) => {
    const from = placed(key);
    if (from >= 0) { if (S.lsel) return lineDrop(S.lsel, $('tnLine').querySelector(`.tn-slot[data-i="${from}"]`)); S.lslots[from] = null; sfx.tick(); }
    else S.lsel = S.lsel === key ? null : key, sfx.tick();
    render();
  },
});
$('tnLine').addEventListener('click', (ev) => {
  const slot = ev.target.closest('.tn-slot');
  if (slot && !ev.target.closest('.tn-tile') && S.lsel && !S.lchecked) return lineDrop(S.lsel, slot);
  const b = ev.target.closest('[data-lact]'); if (!b) return;
  if (b.dataset.lact === 'check') {
    if (S.lslots.some((x) => !x)) return;
    S.lok = S.lslots.map((k, i) => k === TRUTH[i]); S.lslots = TRUTH.slice(); S.lchecked = true; S.lsel = null; (S.lok.every(Boolean) ? sfx.good : sfx.bad)();
  } else { S.lslots = [null, null, null, null, null]; S.lsel = null; S.lchecked = false; S.lok = []; sfx.click(); }
  render();
});

// Room controls
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-o], [data-a], [data-act]'); if (!b) return;
  if (b.dataset.o) { S.sel = S.revealed && S.sel === b.dataset.o ? null : b.dataset.o; sfx.tick(); }
  else if (b.dataset.a) {
    if (!S.sel || S.revealed) return;
    S.guess[S.sel] = b.dataset.a === 'yes'; sfx.click();
    const next = OBJ.find((o) => S.guess[o.k] === undefined);
    if (next) S.sel = next.k;
    else { S.revealed = true; S.sel = null; setTimeout(() => { S.yr = 0; sfx.good(); render(); }, 650); }
  } else if (b.dataset.act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'tnYr' || !S.revealed) return;
  S.yr = +ev.target.value; sfx.tick(); render();
});
$('tnAsk').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-q]'); if (!b) return;
  S.ask[+b.dataset.q] = !S.ask[+b.dataset.q]; sfx.tick(); render();
});

// --- render ---------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, mode = v === 'room' ? (S.sec === 'desk' ? 'desk' : S.sec === 'ask' ? 'ask' : 'room') : v;
  document.body.dataset.v = mode;
  $('secRoom').hidden = v !== 'room'; $('secDay').hidden = v !== 'day'; $('secLine').hidden = v !== 'line';
  $('tnDay').hidden = v !== 'day'; $('tnLine').hidden = v !== 'line'; $('tnAsk').hidden = mode !== 'ask';
  if (v === 'room') renderRoom(t, mode); else if (v === 'day') renderDay(t); else renderLine(t);
  lab.checkStage();
}

function renderRoom(t, mode) {
  const r = t.room, n = Object.keys(S.guess).length, asking = !S.revealed;
  lab.setGlow('rgba(224, 170, 100, .26)');
  const yr = $('tnYr'); yr.disabled = asking; yr.value = S.yr;
  $('tnEnds').innerHTML = r.ends.map((e) => `<span>${esc(e)}</span>`).join('');
  $('tnLock').textContent = r.lock; $('tnLock').hidden = !asking;
  $('tnObjs').innerHTML = OBJ.map((o) => {
    const g = S.guess[o.k], mark = g === undefined ? '' : asking ? ` <span class="tn-g">· ${esc(g ? r.yes : r.no)}</span>` : (g === o.had ? ' <span class="tn-ok">✓</span>' : ' <span class="tn-no">✗</span>');
    return `<button class="chip tn-obj ${S.sel === o.k ? 'on' : ''}" data-o="${o.k}">${o.emo} ${esc(t.objs[o.k])}${mark}</button>`;
  }).join('');
  const sel = OBJ.find((o) => o.k === S.sel);
  $('tnQ').hidden = !asking;
  $('tnQ').innerHTML = !asking ? '' : sel
    ? `<div class="tn-qt"><b>${sel.emo} ${esc(t.objs[sel.k])}</b> · ${esc(r.askT)}</div><div class="tn-yn"><button data-a="yes" class="${S.guess[sel.k] === true ? 'on' : ''}">${esc(r.yes)}</button><button data-a="no" class="${S.guess[sel.k] === false ? 'on' : ''}">${esc(r.no)}</button></div>`
    : `<div class="tn-qt tn-dim">${esc(r.pickOne)}</div>`;
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('desk', '🖋️') + sc('ask', '👵');
  if (mode === 'desk') {
    lab.setGlow('rgba(95, 119, 184, .26)');
    lab.setReadout(`${Math.round(S.ink * 100)}%`, t.desk.ink, S.ink < 0.15 ? t.desk.dip : '', '#5f77b8');
    lab.setState({ emo: '🖋️', title: t.desk.title, lead: t.desk.lead, body: t.desk.body, extra: '' }); lab.setFacts(t.facts.desk); return;
  }
  if (mode === 'ask') {
    const k = S.ask.filter(Boolean).length, a = t.askp;
    lab.setGlow('rgba(61, 220, 151, .2)');
    lab.setReadout(`${k}/3`, a.asked, '', '#3ddc97');
    $('tnAsk').innerHTML = `<h3>${esc(a.title)}</h3><p>${esc(a.lead)}</p>${a.qs.map((q, i) => `<button class="tn-q ${S.ask[i] ? 'on' : ''}" data-q="${i}"><span class="box">${S.ask[i] ? '✓' : ''}</span><span>${esc(q)}</span></button>`).join('')}${k === 3 ? `<div class="tn-askdone">${esc(a.done)}</div>` : ''}`;
    lab.setState({ emo: '👵', title: a.title, lead: k === 3 ? a.done : a.lead, body: a.n(k), extra: '' }); lab.setFacts([]); return;
  }
  if (asking) {
    lab.setReadout('?', r.count(n), '', '#e0aa64');
    lab.setState({ emo: '🤔', title: r.askQ, lead: r.askLead, body: r.count(n), extra: '' }); lab.setFacts([]); return;
  }
  const k = OBJ.filter((o) => S.guess[o.k] === o.had).length;
  lab.setReadout(r.years[S.yr], r.slide, S.yr < 2 ? r.diff(CHANGED, OBJ.length - CHANGED) : r.res(k), '#e0aa64');
  if (sel) lab.setState({ emo: sel.emo, title: r.story[sel.k][0], lead: r.story[sel.k][1], body: r.res(k), extra: '' });
  else { const e = r.era[S.yr]; lab.setState({ emo: ['👵', '📼', '📱'][S.yr], title: e[0], lead: e[1], body: e[2], extra: '' }); }
  lab.setFacts(t.facts.room);
}

function renderDay(t) {
  const d = t.day, n = DAY.length, done = S.di >= n, k = S.dres.filter((x) => x.ok).length, cur = DAY[Math.min(S.di, n - 1)];
  lab.setGlow('rgba(143, 220, 182, .2)');
  const picked = S.dpick !== null, last = S.dres[S.dres.length - 1];
  const dots = DAY.map((_, i) => `<i class="${i < S.dres.length ? (S.dres[i].ok ? 'ok' : 'no') : i === S.di ? 'now' : ''}"></i>`).join('');
  const bin = (key, cls) => `<button class="tn-bin ${cls}" data-bin="${key}" data-drop="bin" ${picked || done ? 'disabled' : ''}><b>${key === 'changed' ? '🔄' : '🧸'} ${esc(d[key === 'changed' ? 'changed' : 'same'])}</b>
    <div class="tn-mini">${S.dres.filter((x) => x.ch === (key === 'changed')).map((x) => `<span class="${x.ok ? '' : 'no'}">${x.e}</span>`).join('')}</div></button>`;
  const body = done
    ? `<div class="tn-end"><div style="font-size:42px">${k >= n - 1 ? '🌟' : '👍'}</div><div class="big">${esc(d.res(k, n))}</div><p>${esc(d.resLead)}</p><button class="tn-btn" data-dact="again">${esc(d.again)}</button></div>`
    : `<div class="tn-cardwrap"><div class="tn-card ${picked ? 'done' : ''}" ${picked ? '' : `data-drag="card"`}><span class="e">${cur.e}</span><span class="t">${esc(d.cards[cur.k][0])}</span>${picked ? `<span class="stamp ${last.ok ? 'ok' : 'no'}">${last.ok ? '✓' : '✗'}</span>` : ''}</div></div>
       ${picked ? `<div class="tn-fb"><div class="v ${last.ok ? 'ok' : 'no'}">${esc(last.ok ? d.right : last.ch ? d.wrongC : d.wrongS)}</div><p>${esc(d.cards[cur.k][1])}</p><button class="tn-btn" data-dact="next">${esc(S.di === n - 1 ? d.last : d.next)}</button></div>` : `<div class="tn-ask">${esc(d.ask)}</div>`}`;
  $('tnDay').innerHTML = `<div class="tn-top"><span class="tn-k">${esc(done ? d.res(k, n) : d.kick(S.di + 1, n))}</span><span class="tn-dots">${dots}</span></div>${body}<div class="tn-bins">${bin('changed', 'c')}${bin('same', 's')}</div>`;
  $('tnDayTip').textContent = d.tip;
  lab.setReadout(S.dres.length ? `${k}/${S.dres.length}` : '–', d.soFar, '', '#8fdcb6');
  if (done) { lab.setState({ emo: '🌟', title: d.res(k, n), lead: d.resLead, body: '', extra: '' }); lab.setFacts(t.facts.day); }
  else if (picked) { lab.setState({ emo: last.ok ? '✅' : '🤔', title: last.ok ? d.right : last.ch ? d.wrongC : d.wrongS, lead: d.cards[cur.k][1], body: '', extra: '' }); lab.setFacts([]); }
  else { lab.setState({ emo: cur.e, title: d.sortedT, lead: d.sortedL, body: d.kick(S.di + 1, n), extra: '' }); lab.setFacts([]); }
}

function renderLine(t) {
  const L = t.line, chk = S.lchecked, full = S.lslots.every(Boolean), nPlaced = S.lslots.filter(Boolean).length, k = S.lok.filter(Boolean).length;
  lab.setGlow('rgba(111, 176, 214, .22)');
  const tile = (key, fixed) => `<div class="tn-tile ${S.lsel === key ? 'sel' : ''} ${fixed ? 'fixed' : ''}" data-drag="${key}"><span class="ic">${ICON[key]}</span><span class="nm">${esc(L.items[key][0])}</span></div>`;
  const rows = S.lslots.map((key, i) => {
    const cls = chk ? (S.lok[i] ? 'ok' : 'no') : S.lsel && !key ? 'pick' : '';
    const yr = chk && key ? `<span class="tn-yr"><b>${L.items[key][2]}</b><small>${esc(L.items[key][1])}</small></span>` : '';
    return `<div class="tn-row"><span class="tn-n">${i + 1}</span><div class="tn-slot ${cls} ${S.lsel ? 'pick' : ''}" data-drop="slot" data-i="${i}">${key ? tile(key, chk) : esc(L.drop)}</div>${yr}</div>`;
  }).join('');
  const tray = START.filter((key) => placed(key) < 0);
  $('tnLine').innerHTML = `<p class="tn-hint">${esc(L.hint)}</p><div class="tn-lab"><span>↑ ${esc(L.old)}</span><span>${esc(L.newest)} ↓</span></div><div class="tn-rows">${rows}</div>
    <div class="tn-tray" data-drop="tray"><div class="cap">${esc(L.tray)}</div>${tray.map((key) => tile(key, false)).join('')}</div>
    <div class="tn-act"><button class="tn-btn" data-lact="${chk ? 'again' : 'check'}" ${!chk && !full ? 'disabled' : ''}>${esc(chk ? L.again : L.check)}</button></div>`;
  $('tnLineTip').textContent = L.tip;
  if (chk) {
    const span = YEAR[TRUTH[4]] - YEAR[TRUTH[0]];
    lab.setReadout(`${k}/5`, L.right, '', '#6fb0d6');
    lab.setState({ emo: k === 5 ? '🌟' : '📏', title: L.res(k), lead: L.resLead, body: L.span(span), extra: '' }); lab.setFacts(t.facts.line);
  } else {
    lab.setReadout(`${nPlaced}/5`, L.on, '', '#6fb0d6');
    lab.setState({ emo: '📏', title: L.askT, lead: L.askL, body: '', extra: '' }); lab.setFacts([]);
  }
}
render();
</script>
</body>
</html>
