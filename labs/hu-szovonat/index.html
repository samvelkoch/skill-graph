const hex3 = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const toHex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hex3(a), B = hex3(b); return toHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); };
const shade = (h, k) => (k >= 0 ? mix(h, '#ffffff', k) : mix(h, '#000000', -k));
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeIn = (p) => p * p * p;
const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const backOut = (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2))); };

function addWagon(tr, text, kind, t0, extra = {}) {

const hy = (x, base, amp, wl, ph) => base - amp * (0.55 + 0.3 * Math.sin(x / wl + ph) + 0.15 * Math.sin(x / (wl * 0.43) + ph * 2.1));

  c.fillStyle = '#D9D3C6'; c.fillRect(x0, gy, x1 - x0, 3.6 * s);

}
function drawBackdrop(c, w, h, time, gy, full = true) {
  c.save();
  c.fillStyle = lg(c, 0, 0, 0, gy, [[0, SKY], [1, '#DDF1FF']]); c.fillRect(0, 0, w, h);
  const sx = w * 0.85, sy = Math.min(70, gy * 0.2);
  const sg = c.createRadialGradient(sx, sy, 2, sx, sy, 80);
  sg.addColorStop(0, 'rgba(255,250,220,1)'); sg.addColorStop(0.18, 'rgba(255,244,190,.85)'); sg.addColorStop(1, 'rgba(255,244,190,0)');
  c.fillStyle = sg; c.fillRect(sx - 90, sy - 90, 180, 180);
  c.fillStyle = 'rgba(255,255,255,.88)';
  [[0.1, 0.3, 1, 5], [0.5, 0.16, 0.8, 3.5], [0.8, 0.42, 0.7, 4.5]].forEach(([fx, fy, k, sp]) => {
    const x = ((fx * (w + 200) + time * sp) % (w + 200)) - 100, y = gy * fy + 14;
    [[0, 0, 16], [18, -7, 20], [40, 0, 16], [20, 4, 18]].forEach(([dx, dy, r]) => { disk(c, x + dx * k, y + dy * k, r * k); c.fill(); });
  });
  const layers = [
    { base: gy - 30, amp: 46, wl: 70, ph: 1.2, a: mix(GRASS, SKY, 0.55), b: mix(GRASS, SKY, 0.3) },
    { base: gy - 8, amp: 36, wl: 55, ph: 3.4, a: mix(GRASS, '#ffffff', 0.18), b: GRASS },

  layers.forEach((L, li) => {
    c.fillStyle = lg(c, 0, L.base - L.amp, 0, gy + 10, [[0, L.a], [1, L.b]]);
    c.beginPath(); c.moveTo(0, h);
    for (let x = 0; x <= w + 6; x += 6) c.lineTo(x, hy(x, L.base, L.amp, L.wl, L.ph));
    c.lineTo(w, h); c.closePath(); c.fill();

      const x = w * fx, y = hy(x, L.base, L.amp, L.wl, L.ph) + 3;

  c.fillStyle = 'rgba(255,255,255,.2)'; c.fillRect(0, gy - 6, w, 3);
  if (full) rail(c, -4, w + 4, gy, 1);
  c.restore();
}

function drawWheel(c, cx, cy, r, ang, red) {
  c.save(); c.translate(cx, cy);
  const g = c.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  g.addColorStop(0, red ? '#F57A7E' : '#5A4A86'); g.addColorStop(1, red ? RED : INK);
  c.fillStyle = g; disk(c, 0, 0, r); c.fill();
  c.lineWidth = Math.max(1.5, r * 0.1); c.strokeStyle = red ? '#7F2228' : '#120C20'; c.stroke();
  disk(c, 0, 0, r * 0.86); c.lineWidth = Math.max(1, r * 0.12); c.strokeStyle = red ? 'rgba(43,33,64,.8)' : 'rgba(255,248,234,.2)'; c.stroke();
  c.rotate(ang); c.strokeStyle = CREAM; c.lineWidth = Math.max(1.4, r * 0.11); c.lineCap = 'round';
  c.beginPath();
  for (let k = 0; k < 6; k++) { const a = (k * Math.PI) / 3; c.moveTo(Math.cos(a) * r * 0.2, Math.sin(a) * r * 0.2); c.lineTo(Math.cos(a) * r * 0.78, Math.sin(a) * r * 0.78); }
  c.stroke();

  c.restore();
}

function plateInfo(text) {

  return { fs, x0: 36 + (pw - mctx.measureText(text).width) / 2 };

// the little text on a wagon plate; a wagon with a `hop` plays the morph and the hop-off of one extra letter
function plateText(c, wg, cx, cy, time) {
  const maxW = WW - 30, hop = wg.hop, s0 = wg.text;
  const longest = hop && hop.morph ? hop.to + s0.slice(1) : s0;
  c.save();
  c.textBaseline = 'alphabetic'; c.textAlign = 'left'; c.fillStyle = INK;
  mctx.font = `500 26px ${FONT_S}`;
  const m26 = Math.max(mctx.measureText(s0).width, mctx.measureText(longest).width), fs = Math.min(26, (26 * maxW) / Math.max(1, m26));
  c.font = `500 ${fs}px ${FONT_S}`;
  const mw = (str) => c.measureText(str).width, base = cy + fs * 0.32, x0 = cx - mw(s0) / 2, w0 = mw(s0[0]), q = time - wg.cAt;
  if (!hop || q < (hop.morph ? hop.morphAt : hop.hopAt)) c.fillText(s0, x0, base);
  else {
    const rest = s0.slice(1), g1 = hop.morph ? hop.to : s0[0], hp = clamp01((q - hop.hopAt) / 0.75);
    const mp = hop.morph ? clamp01((q - hop.morphAt) / 0.5) : 1, gcx = x0 + w0 / 2, gcy = base - fs * 0.3;
    c.fillText(rest, lerp(x0 + w0, cx - mw(rest) / 2, easeInOut(hp)), base);
    const glyph = (g, px, py, k, ang, col) => {
      c.save(); c.translate(px, py); c.rotate(ang); c.scale(Math.max(0.001, k), Math.max(0.001, k));
      c.fillStyle = col; c.fillText(g, -mw(g) / 2, fs * 0.3); c.restore();
    };
    if (hp <= 0) {
      if (hop.morph && mp < 1) { glyph(s0[0], gcx, gcy, 1 - mp, 0, INK); glyph(hop.to, gcx, gcy, mp, 0, RED); }
      else glyph(g1, gcx, gcy, 1, 0, hop.morph ? RED : INK);
    } else if (hp < 1) {
      glyph(g1, gcx + 50 * easeOut(hp), gcy - 40 * easeOut(hp) - 40 * Math.sin(Math.PI * hp), 1 + 0.3 * Math.sin(Math.PI * hp), 6 * hp, RED);
    } else {
      const pq = (q - hop.hopAt - 0.75) / 0.35;
      if (pq < 1) {

  c.textAlign = 'left'; c.font = '800 12px Nunito, sans-serif'; c.fillStyle = '#6A5F82'; c.fillText(r.lab ? t.r[r.lab] : t.r.sounds, px + 84, py + ph / 2 - 20); // round 4 shows the parts, not the sound (it would be the answer)

  const fs = Math.min(30, (30 * (pw - 84 - 12)) / Math.max(1, mctx.measureText(quote).width));

function drawThreeScene(c, w, h, dt, time) {

function drawTreeScene(c, w, h, dt, time) {
  const tt = time - scene.sec.t0, sE = Math.min(0.8, (w * 0.5) / EW), gxE = (w - EW * sE) / 2, gyE = h - 46;
  drawBackdrop(c, w, h, time, gyE, false);

  const topY = 14, botY = gyE - 124 * sE - 34, rp = (botY - topY) / 3, gyR = [botY - 30, botY - rp - 30, botY - 2 * rp - 30];

    c.strokeStyle = TRACK; c.lineWidth = 8; c.stroke();
    c.strokeStyle = shade(TRACK, 0.25); c.lineWidth = 2; c.beginPath(); c.moveTo(tx - 2, yB); c.lineTo(tx - 2, yT); c.stroke();
    c.restore();
  }

    const row = i < 2 ? 0 : i < 4 ? 1 : 2, left = i % 2 === 0, bt = [1.0, 1.7, 2.6, 3.3, 4.2][i];
    const L = (EW + (b.p.length - 1) * (WW + GAP)) * sm, halfW = w / 2 - 25;

      const tg = easeOut(clamp01((tt - (bt - 0.35)) / 0.3));

        const xe = left ? x0 + L + 8 : x0 - 8, xs = lerp(tx, xe, tg);

      }
    }
    const k = backOut(clamp01((tt - bt) / 0.45));
    if (tt < bt || k <= 0) return;
    const kk = Math.max(0.05, k);
    rail(c, x0 - 8 * kk + (L * (1 - kk)) / 2, x0 + L * kk + 8 * kk + (L * (1 - kk)) / 2, gy, sm * kk);
    drawTrain(c, scene.branches[i], { gx: x0 + (L * (1 - kk)) / 2, gy, s: sm * kk, w, time, labels: false });
    if (k > 0.9) pill(c, `${b.w} · ${b.g[lang]}`, x0 + L / 2, gy + 30, null, w);
  });
  // the big engine in the middle of the trunk
  drawTrain(c, scene.trains[0], { gx: gxE, gy: gyE, s: sE, w, time });
  // a few leaves on the trunk
  c.save(); c.fillStyle = KC.kepzo;
  [[0.25, -8], [0.5, 8], [0.75, -8]].forEach(([f, d]) => {
    const y = lerp(yB, yT, f); if (yT >= yB - 1) return;
    c.save(); c.translate(tx + d, y); c.rotate(d > 0 ? 0.6 : -0.6); c.beginPath(); c.ellipse(d > 0 ? 8 : -8, 0, 9, 4, 0, 0, Math.PI * 2); c.fill(); c.restore();
  });
  c.restore();
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  try {
    const v = lab.view;
    if (v === 'train') {
      if (S.sec === 'tree' && scene.sec) drawTreeScene(c, w, h, dt, time);
      else if (S.sec === 'three' && scene.sec) drawThreeScene(c, w, h, dt, time);

});

// --- scenes: building, revealing ---------------------------------------------------------------------------------
function loadScene() {
  scene.timers.forEach(clearTimeout);
  Object.assign(scene, { timers: [], trains: [], sign: null, bubs: [], bubX: null, drip: null, stamp: null, sec: null, stamps: false, branches: null });
  const v = lab.view;
  if (v === 'train') {
    if (S.sec) return startSecret();
    const st = S.tr;
    if (st.free) {
      scene.trains = [restTrain(st.stem, st.parts.map((p) => [p, KIND_OF[p]]))];
      scene.bubs = [{ t: -99, word: st.stem + st.parts.join('') }];
    } else {
      const q = TQ[st.i];
      if (st.pick == null) scene.sign = { text: q.word, parts: q.parts, t0: null };
      else {
        scene.trains = [restTrain(q.parts[0], q.parts.slice(1).map((p) => [p, KIND_OF[p]]))];
        scene.bubs = [{ t: -99, word: q.word }];
      }
    }
  } else if (v === 'harmony') {
    const st = S.hm, r = HR[st.i], tr = mkTrain(r.stem, st.pick == null ? now() : -99);
    scene.trains = [tr];
    if (st.pick != null) { // already answered: the finished picture
      const col = FRONT_SUF.includes(r.right) ? FRONTC : BACKC;
      tr.eng.paintT0 = -99;
      const wg = addWagon(tr, r.right, 'rag', -99, { col: NEUTRAL });
      wg.paint = { col, t0: -99 };
      if (r.right === 'höz') wg.lip = { t0: -99 };
    }
  } else {
    const st = S.rl;
    if (st.end) { scene.stamps = true; scene.stamps0 = now(); return; }
    const r = RR[st.i];
    if (st.pick != null) {
      scene.trains = [restTrain(r.stem, r.wag ? [[r.wag.hop ? 'al' : r.wag.text, r.wag.kind]] : [])];
      scene.stamp = { t0: -99 };
    }
  }
}
function revealTrain() {
  const q = TQ[S.tr.i], T0 = now();
  scene.timers.forEach(clearTimeout); scene.timers = []; scene.bubs = []; scene.bubX = null;
  scene.sign = { text: q.word, parts: q.parts, t0: T0 };
  const eT = T0 + 1.3, tr = mkTrain(q.parts[0], eT);
  scene.trains = [tr];
  scene.bubs.push({ t: eT + ENG_IN, word: q.parts[0] });
  let t = eT + ENG_IN + 0.25, word = q.parts[0];
  q.parts.slice(1).forEach((p) => {
    const wg = addWagon(tr, p, KIND_OF[p], t); word += p;
    scene.bubs.push({ t: wg.cAt, word }); t = wg.cAt + 0.3;
    later(wg.t0 - T0, sfx.push); later(wg.cAt - T0, sfx.snap);
  });
  later(0, sfx.tick); later(0.5, sfx.click); later(eT - T0, sfx.push);
}
function startFree() {
  const st = S.tr; st.free = true; st.stem = 'ház'; st.parts = [];
  engineIn('ház');
}
function engineIn(stem) {
  const t0 = now();
  scene.timers.forEach(clearTimeout); scene.timers = []; scene.sign = null;
  scene.trains = [mkTrain(stem, t0)]; scene.bubs = [{ t: t0 + ENG_IN, word: stem }]; scene.bubX = null;
  sfx.push();
}
function freeAdd(w) {
  const st = S.tr, tr = scene.trains[0];
  if (!tr || !WORDS[st.stem + st.parts.join('') + w]) return;
  const live = tr.wagons.filter((x) => x.oAt == null), last = live[live.length - 1];
  if ((last && now() < last.cAt) || now() < tr.eng.cAt) return;
  const wg = addWagon(tr, w, KIND_OF[w], now());
  st.parts.push(w);
  scene.bubs.push({ t: wg.cAt, word: st.stem + st.parts.join('') });
  sfx.push(); later(IN_DUR, sfx.snap);
  render();
}
function freeUndo() {
  const st = S.tr, tr = scene.trains[0], live = tr ? tr.wagons.filter((x) => x.oAt == null) : [], last = live[live.length - 1];
  if (!last || now() < last.cAt) return;
  last.oAt = now(); st.parts.pop();
  scene.bubs.push({ t: now(), word: st.stem + st.parts.join('') });
  sfx.click(); render();
}
function revealHarmony() {
  const st = S.hm, r = HR[st.i], T0 = now(), tr = scene.trains[0];
  const col = FRONT_SUF.includes(r.right) ? FRONTC : BACKC;
  tr.eng.paintT0 = T0 + 0.1;
  const wg = addWagon(tr, r.right, 'rag', T0 + 1.0, { col: NEUTRAL });
  const d0 = wg.cAt + 0.25, dur = 1.0;

  later(0.1, sfx.tick); later(wg.t0 - T0, sfx.push); later(wg.cAt - T0, sfx.snap); later(d0 - T0, sfx.click); later(d0 + dur - T0, sfx.good);
}
function revealRules() {
  const st = S.rl, r = RR[st.i], T0 = now();
  const tr = mkTrain(r.stem, T0 + 0.1);
  scene.trains = [tr];
  let tDone = T0 + 0.1 + ENG_IN;
  later(0.1, sfx.push);
  if (r.wag) {
    const wg = addWagon(tr, r.wag.text, r.wag.kind, tDone + 0.2, r.wag.hop ? { hop: { ...r.wag.hop } } : {});
    later(wg.t0 - T0, sfx.push); later(wg.cAt - T0, sfx.snap);
    tDone = wg.cAt + (r.wag.hop ? 3.0 : 0.5);
    if (r.wag.hop) { later(wg.cAt - T0 + r.wag.hop.morphAt, sfx.tick); later(wg.cAt - T0 + r.wag.hop.hopAt + 0.75, sfx.click); }

}
function startSecret() {
  const T0 = now(), k = S.sec;
  scene.sec = { t0: T0, k };
  if (k === 'tree') {
    scene.trains = [mkTrain('ír', T0)];
    scene.branches = BR.map((b) => restTrain(b.p[0], b.p.slice(1).map((p) => [p, KIND_OF[p]])));
    later(0, sfx.push); [1.0, 1.7, 2.6, 3.3, 4.2].forEach((bt) => later(bt, sfx.snap));
  } else {
    const a = mkTrain('sakk', T0), b = mkTrain('toll', T0 + 5.6);
    const wa = addWagon(a, 'kör', null, T0 + ENG_IN + 0.25, { hop: { morph: false, to: '', morphAt: 0, hopAt: 1.4 } });
    const wb = addWagon(b, 'val', 'rag', b.eng.cAt + 0.25, { hop: { morph: true, to: 'l', morphAt: 0.6, hopAt: 1.8 } });
    scene.trains = [a, b];
    later(0, sfx.push); later(wa.cAt - T0, sfx.snap); later(wa.cAt - T0 + 1.4 + 0.75, sfx.click);
    later(wb.t0 - T0, sfx.push); later(wb.cAt - T0, sfx.snap); later(wb.cAt - T0 + 0.6, sfx.tick); later(wb.cAt - T0 + 1.8 + 0.75, sfx.click);
  }
}

$('ctrlBody').innerHTML = `<div id="szMain"></div><div class="row2" id="szSecRow"><div class="chips" id="szChips"></div></div>`;

$('ctrlBody').addEventListener('click', (ev) => {

  const a = b.dataset.act, v = lab.view;
  if (a === 'sec') {

    loadScene(); render(); return;
  }
  if (v === 'train') {

    if (a === 'pick' && st.pick == null) { st.pick = +b.dataset.j; (st.pick === TQ[st.i].right ? sfx.good : sfx.bad)(); revealTrain(); showStage(); }
    else if (a === 'next') { sfx.click(); if (st.i === 0) { st.i = 1; st.pick = null; loadScene(); } else startFree(); }
    else if (a === 'again') { sfx.click(); Object.assign(st, { i: 0, pick: null, free: false, stem: 'ház', parts: [] }); loadScene(); }
    else if (a === 'eng') { if (st.stem === b.dataset.e && !st.parts.length) return; st.stem = b.dataset.e; st.parts = []; engineIn(st.stem); }

    else if (a === 'next') { sfx.click(); st.i++; st.pick = null; loadScene(); }
    else if (a === 'again') { sfx.click(); Object.assign(st, { started: false, i: 0, pick: null }); loadScene(); }
  } else {
    const st = S.rl;
    if (a === 'pick' && st.pick == null) { st.pick = +b.dataset.j; (st.pick === RR[st.i].right ? sfx.good : sfx.bad)(); revealRules(); showStage(); }
    else if (a === 'next') { sfx.click(); if (st.i < 3) { st.i++; st.pick = null; } else st.end = true; loadScene(); }
    else if (a === 'again') { sfx.click(); Object.assign(st, { i: 0, pick: null, end: false }); loadScene(); }

// --- one render per change: controls, readout and the state card -----------------------------------------------

const verdict = (ok) => `<div class="sz-verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? T[lang].right : T[lang].wrong)}</div>`;

  lab.setReadout(esc(done ? EXAMPLES[st.i] : quoteL(r.sounds)), dots(st.i, 4), '', KC.rag);
  setCard('rules', last && done, fine);
  $('szMain').innerHTML = `<div class="sz-q">${esc(t.r.q)}</div>
    <div class="sz-opts">${r.opts.map((o, j) => `<button class="sz-b serif ${done ? (j === r.right ? 'good' : j === st.pick ? 'bad' : '') : ''}" data-act="pick" data-j="${j}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>
    ${done ? `${verdict(st.pick === r.right)}<span class="sz-pname" style="background:${STAMP_COL[st.i]}">${esc(t.r.p[st.i])}</span><p class="sz-why">${esc(t.r.why[st.i])}</p><button class="btn sz-next" data-act="next">${esc(t.next)}</button>` : ''}`;
}
loadScene();
render();
</script>
</body>
</html>
