function label(c, str, x, y, o = {}) {

function arrow(c, x0, y0, x1, y1, col, lw = 4, hd = 11) {

// a 3-D box seen from the upper right (cabinet projection)
const OK = 0.42, OM = 0.28;
function box(c, x, y, w, h, d, base) {

function drawHomo(c, t) {
  const cx = 180, lift = ease(S.liftT) * 34, th = S.hth;

    return pts.map(([u, y]) => [cx + u * Math.cos(th), y, u * Math.sin(th)]);

    c.restore();
  };

// --- Secret: two wires -------------------------------------------------------------------------------------
function drawWires(c, t) {
  const y = 126, x1 = 110 + S.wx, x2 = 250 - S.wx, s1 = 1, s2 = S.w2, I = S.Iw, d = x2 - x1;
  bgGlow(c, 180, 126, 200, 'rgba(160,90,220,.13)');
  // faint circular field lines round each wire; the big arc is the field of one wire where the other one sits
  const circ = (x, sd, rr_) => {
    c.save(); c.setLineDash([4, 6]); c.lineDashOffset = -sd * t * 10; c.strokeStyle = 'rgba(89,169,255,.35)'; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, rr_, 0, TAU); c.stroke(); c.setLineDash([]);
    c.fillStyle = 'rgba(89,169,255,.7)';
    for (const [px, py, dirx] of [[x, y - rr_, -sd], [x, y + rr_, sd]]) { c.beginPath(); c.moveTo(px + dirx * 6, py); c.lineTo(px - dirx * 3, py - 4.5); c.lineTo(px - dirx * 3, py + 4.5); c.closePath(); c.fill(); }
    c.restore();
  };
  circ(x1, s1, 34); circ(x2, s2, 34); circ(x1, s1, 58); circ(x2, s2, 58);
  const big = (xc, sd, xo) => {
    c.save(); c.strokeStyle = COL.fld; c.lineWidth = 3; c.lineCap = 'round'; c.shadowColor = COL.fld; c.shadowBlur = 8;
    const R = Math.abs(xo - xc); c.beginPath(); c.arc(xc, y, R, xo > xc ? -0.7 : Math.PI - 0.7, xo > xc ? 0.7 : Math.PI + 0.7); c.stroke(); c.restore();

    arrow(c, ax, ay + (up ? 9 : -9), ax, ay + (up ? -9 : 9), COL.fld, 3, 9); letter(c, 'B', ax + 14, ay, COL.fld, 15);
  };
  big(x1, s1, x2); big(x2, s2, x1);
  wireDisc(c, x1, y, 17, s1 > 0, '#f08a3c'); wireDisc(c, x2, y, 17, s2 > 0, '#e6c46a');
  const attract = s1 * s2 > 0, Lf = clamp(8 + 0.9 * I, 8, Math.max(8, d / 2 - 28));
  {
    const f1 = attract ? 1 : -1, f2 = -f1;
    arrow(c, x1 + f1 * 22, y, x1 + f1 * (22 + Lf), y, COL.frc, 4.5, 12); arrow(c, x2 + f2 * 22, y, x2 + f2 * (22 + Lf), y, COL.frc, 4.5, 12);
    letter(c, 'F', x1 + f1 * (22 + Lf + 12), y - 13, COL.frc, 15); letter(c, 'F', x2 + f2 * (22 + Lf + 12), y - 13, COL.frc, 15);
  }
  const wl = T[lang].sec.wLab; label(c, wl[0], x1, y + 56); label(c, wl[1], x2, y + 56);
  legend(c, 272, ['B', 'F']);
}

  else if (a === 'w2') { S.w2 = -S.w2; sfx.click(); }
  else if (a === 'secback') { S.sec = null; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; if (S.sec) { S.lift = false; S.w2 = 1; } sfx.click();
  } else return;
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'rI1') { S.I = v / 2; S.fresh = false; }
  else if (id === 'rI2') { S.I2 = v / 2; S.fresh2 = false; }
  else if (id === 'rF') { S.freq = v; S.fresh3 = false; toneSet(); }
  else if (id === 'rA') { S.ampT = v / 10; S.fresh3 = false; toneSet(); }
  else if (id === 'rE') S.e = v / 100;
  else if (id === 'rIw') S.Iw = v;
  else return;
  render();
});
$('cv').addEventListener('pointerdown', (ev) => { // fan motor: tap a part
  if (lab.view !== 'inside' || S.dev !== 'fan' || activeSec()) return;
  const r = $('cv').getBoundingClientRect();
  const k = fanHit((ev.clientX - r.left - G.ox) / G.s, (ev.clientY - r.top - G.oy) / G.s);
  if (!k) return;
  S.fnames[k] = true;
  if (S.fq < 3) {
    if (k === FAN_TASKS[S.fq]) { S.fq++; S.fmsg = { ok: true, k }; sfx.good(); if (S.fq >= 3) FAN_TASKS.forEach((x) => { S.fnames[x] = true; }); }
    else { S.fmsg = { ok: false, k }; sfx.bad(); }
  } else { S.fmsg = { ok: true, k, info: true }; sfx.tick(); }
  render();
});

// --- render: controls, readout and the state card ------------------------------------------------------------
function askHTML(t, q, opts, act, chosen, correct) {
  if (chosen === null) return `<div class="me-q">${esc(q)}</div><div class="me-opts">${opts.map(([k, l]) => `<button class="me-opt" data-act="${act}" data-k="${k}">${esc(l)}</button>`).join('')}</div>`;
  const ok = chosen === correct, lb = opts.find(([k]) => k === chosen)[1];
  return `<div class="me-ans ${ok ? 'good' : 'bad'}">${ok ? '✓ ' + esc(t.right) : esc(t.notq)} · ${esc(t.you(lb))}</div>`;
}
const ends = (a, b, x, y) => { $(a).textContent = x; $(b).textContent = y; };
const setSlider = (id, v) => { const el = $(id); if (el.value !== String(v)) el.value = String(v); };
const tg = (id, on) => $(id).classList.toggle('on', on);

function renderSwing(t) {
  const q = t.sw, u = t.u, asked = S.p1 !== null;
  $('meAsk').innerHTML = askHTML(t, q.q, [['N', q.o.N], ['S', q.o.S], ['out', q.o.out], ['inn', q.o.inn]], 'pick1', S.p1, 'out');
  $('cSw').hidden = !asked;
  $('bSw').textContent = S.on ? q.sw[1] : q.sw[0]; tg('bSw', S.on);
  $('bRev').textContent = q.rev; $('bFlip').textContent = q.flip;
  $('lI1').textContent = `${q.cur}: ${fmt(S.I)} ${u.A}`; setSlider('rI1', S.I * 2); ends('eI1a', 'eI1b', `${fmt(0.5)} ${u.A}`, `5 ${u.A}`);
  $('nSw').textContent = q.fine;
  const Ie = S.on ? S.I : 0;
  lab.setReadout(`${fmt(5 * Ie)} ${u.mN}`, `${fmt(0.1)} ${u.T} × ${fmt(Ie)} ${u.A} × ${fmt(0.05, 2)} ${u.m}`, S.on ? `${fmt(S.I)} ${u.A}` : q.offPill, '#3ddc97');
  lab.setGlow('rgba(61, 220, 151, .2)');
  let st;
  if (!asked) st = { emo: '🤔', title: q.q, lead: q.hint, body: '' };
  else if (S.fresh) { const ok = S.p1 === 'out'; st = { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: { out: q.vOut, N: q.vPole, S: q.vPole, inn: q.vIn }[S.p1], body: q.body }; }
  else if (!S.on) st = { emo: q.off[0], title: q.off[1], lead: q.off[2], body: q.body };
  else {
    const flips = (S.dir < 0 ? 1 : 0) + (S.mag < 0 ? 1 : 0), p = flips === 2 ? q.two : flips === 1 ? q.pushIn : q.pushOut;
    st = { emo: p[0], title: p[1], lead: p[2], body: q.body };
  }
  lab.setState({ ...st, extra: '' });
  lab.setFacts(asked ? [t.facts.fleming] : []);
}
const coilMode = () => {
  if (S.p2 === null || !S.run2) return 'ask';
  if (S.comm) return 'spin';
  return Math.abs(S.w) < 0.1 && Math.abs(Math.cos(S.phi)) < 0.1 ? 'stop' : 'rock';
};
function coilReadout(t) { lab.setReadout(fmt(S.wS / TAU, 1), t.cl.sub, `${fmt(S.I2)} ${t.u.A}`, '#ffa02e'); }
function renderCoil(t) {
  const q = t.cl, u = t.u, asked = S.p2 !== null;
  $('meAsk').innerHTML = askHTML(t, q.q, [['spin', q.o.spin], ['stop', q.o.stop], ['still', q.o.still]], 'pick2', S.p2, 'stop');
  $('cCl').hidden = !asked;
  $('bComm').textContent = S.comm ? q.comm[0] : q.comm[1]; tg('bComm', S.comm);
  $('bRev2').textContent = q.rev; $('bRst').textContent = q.rst;
  $('lI2').textContent = `${q.cur}: ${fmt(S.I2)} ${u.A}`; setSlider('rI2', S.I2 * 2); ends('eI2a', 'eI2b', `1 ${u.A}`, `5 ${u.A}`);
  $('nCl').textContent = S.p1 === null ? q.gate : '';
  coilReadout(t); lab.setGlow('rgba(255, 160, 46, .18)');
  const m = S.m2 = coilMode();
  let st;
  if (m === 'ask') st = { emo: '🤔', title: q.q, lead: q.hint, body: '' };
  else if (S.fresh2 && !S.comm) { const ok = S.p2 === 'stop'; st = { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: { stop: q.vStop, spin: q.vSpin, still: q.vStill }[S.p2], body: '' }; }
  else st = { emo: q[m][0], title: q[m][1], lead: q[m][2], body: m === 'spin' ? q.spinBody : '' };
  lab.setState({ ...st, extra: '' });
  lab.setFacts([t.facts.jacobi]);
}
function renderInside(t) {
  const q = t.ins, u = t.u, spk = S.dev === 'spk';
  $('cIn').hidden = false;
  $('bSpk').textContent = q.dev.spk; $('bFan').textContent = q.dev.fan; tg('bSpk', spk); tg('bFan', !spk);
  $('cSpk').hidden = !(spk && S.p3 !== null); $('cFan').hidden = spk;
  if (spk) {
    $('meAsk').innerHTML = askHTML(t, q.q, [['often', q.o.often], ['far', q.o.far], ['rev', q.o.rev]], 'pick3', S.p3, 'far');
    $('bTone').textContent = S.tone ? q.tone[1] : q.tone[0]; tg('bTone', S.tone);
    $('lF').textContent = `${q.pitch}: ${S.freq} ${u.Hz}`; setSlider('rF', S.freq); ends('eFa', 'eFb', q.pitchEnds[0], q.pitchEnds[1]);
    $('lA').textContent = `${q.loud}: ±${fmt(S.ampT)} ${u.A}`; setSlider('rA', Math.round(S.ampT * 10)); ends('eAa', 'eAb', q.loudEnds[0], q.loudEnds[1]);
    $('nSpk').textContent = '';
    lab.setReadout(`${S.freq} ${u.Hz}`, q.sub, `±${fmt(S.ampT)} ${u.A}`, '#59a9ff'); lab.setGlow('rgba(89, 169, 255, .2)');
    let st;
    if (S.p3 === null) st = { emo: '🤔', title: q.q, lead: q.hint, body: '', extra: '' };
    else if (S.fresh3) { const ok = S.p3 === 'far'; st = { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: { far: q.vFar, often: q.vOften, rev: q.vRev }[S.p3], body: '', extra: '' }; }
    else { const p = q.play(S.freq); st = { emo: p[0], title: p[1], lead: p[2], body: q.body, extra: `<div class="me-fine">${esc(q.peak(fmt(S.ampT), fmt(6 * S.ampT, 1)))}</div>` }; }
    lab.setState(st);
    lab.setFacts(S.p3 === null ? [] : [t.facts.onePct, t.facts.lodge]);
  } else {
    const k = S.fq;
    $('meAsk').innerHTML = k < 3 ? `<div class="me-fine" style="margin:0 0 4px">${esc(q.taskOf(k + 1))}</div><div class="me-q">${esc(q.tasks[k])}</div>` : `<div class="me-ans good">${esc(q.done[1])}</div>`;
    $('lE').textContent = q.explode; setSlider('rE', Math.round(S.e * 100)); ends('eEa', 'eEb', q.explodeEnds[0], q.explodeEnds[1]);
    lab.setReadout(`${S.fq}/3`, q.found, '', '#59a9ff'); lab.setGlow('rgba(89, 169, 255, .2)');
    let st;
    const m = S.fmsg;
    if (m) {
      const nm = q.names[m.k], ds = q.desc[m.k];
      st = m.info ? { emo: '🔍', title: nm, lead: ds, body: '' } : m.ok ? { emo: '✅', title: t.right, lead: `${nm}: ${ds}.`, body: S.fq >= 3 ? q.done[2] : '' } : { emo: '🤔', title: q.notThat, lead: `${nm}: ${ds}.`, body: '' };
    } else if (k < 3) st = { emo: '🔍', title: q.tasks[k], lead: q.fanHint, body: '' };
    else st = { emo: q.done[0], title: q.done[1], lead: q.done[2], body: '' };
    lab.setState({ ...st, extra: '' });
    lab.setFacts([t.facts.jedlik]);
  }
}
function homoReadout(t) { lab.setReadout(fmt(S.hS / TAU, 1), t.sec.hSub, '', '#c084fc'); }
function renderSec(t, sec) {
  const q = t.sec, u = t.u;
  lab.setGlow('rgba(192, 132, 252, .2)');
  if (sec === 'homo') {
    $('cHo').hidden = false;
    $('bHB').textContent = q.flipB; $('bHM').textContent = q.flipM; $('bHL').textContent = S.lift ? q.lift[1] : q.lift[0]; tg('bHL', S.lift); $('bHK').textContent = t.back;
    $('nHo').textContent = q.hBody;
    homoReadout(t);
    const st = S.lift ? q.hLift : q.hSt;
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: q.hBody, extra: '' });
    lab.setFacts([t.facts.faraday]);
  } else {
    $('cWi').hidden = false;
    $('bW2').textContent = q.wRev; $('bWK').textContent = t.back;
    $('lW').textContent = `${q.wCur}: ${S.Iw} ${u.A}`; setSlider('rIw', S.Iw); ends('eWa', 'eWb', `1 ${u.A}`, `20 ${u.A}`);
    $('nWi').textContent = q.wBody;
    lab.setReadout(fmt(0.01 * S.Iw * S.Iw, 2), q.wSub, q.wPill, '#c084fc');
    const st = S.w2 > 0 ? q.wSame : q.wOpp;
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: q.wBody, extra: '' });
    lab.setFacts([]);
  }
}
function renderSecRow(t) {
  const open = secret.unlocked(), sec = activeSec(), n = t.sec;
  const chip = (k, emo) => `<button class="chip secret me-b ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(n[k][0])}` : esc(t.locked)}</button>`;
  $('secRow').innerHTML = chip('homo', '🌀') + chip('wires', '🔗');
}
function render() {
  const t = T[lang], v = lab.view, sec = activeSec();
  for (const id of ['cSw', 'cCl', 'cIn', 'cHo', 'cWi']) $(id).hidden = true;
  $('meAsk').innerHTML = '';
  if (sec) renderSec(t, sec); else if (v === 'swing') renderSwing(t); else if (v === 'coil') renderCoil(t); else renderInside(t);
  renderSecRow(t);
  if ((v !== 'inside' || S.dev !== 'spk' || sec) && S.tone) toneOff();
  lab.checkStage();
}

// --- the loop ------------------------------------------------------------------------------------------------
let lastLive = 0;
canvasLoop($('cv'), (c, w, h, dt, t) => {
  G.s = Math.min(w / DW, h / DH); G.ox = (w - DW * G.s) / 2; G.oy = (h - DH * G.s) / 2; G.w = w; G.h = h;
  step(dt);
  const sec = activeSec();
  c.save(); c.translate(G.ox, G.oy); c.scale(G.s, G.s);
  if (sec === 'homo') drawHomo(c, t); else if (sec === 'wires') drawWires(c, t);
  else if (lab.view === 'swing') drawSwing(c, t); else if (lab.view === 'coil') drawCoil(c, t);
  else if (S.dev === 'spk') drawSpeaker(c, t); else drawFan(c, t);
  c.restore();
  if (t - lastLive > 0.12) { // the readouts that move on their own
    lastLive = t;
    if (sec === 'homo') homoReadout(T[lang]);
    else if (!sec && lab.view === 'coil') { if (coilMode() !== S.m2) render(); else coilReadout(T[lang]); }
  }
});
render();
</script>
</body>
</html>
