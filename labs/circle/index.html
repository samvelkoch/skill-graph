const TAU = Math.PI * 2;
const COL = { rad: '#5B8DEF', dia: '#FF9F5A', non: '#9AA0B5', gold: '#FFC94A', trample: '#D9E58A', rope: '#A0703F', peg: '#8A5A2B', tyre: '#2E2E3A', red: '#FF5A5A' };
const KCOL = [COL.rad, COL.dia, COL.non];
const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const easeOut = (x) => 1 - (1 - clamp(x, 0, 1)) ** 3;
const bounce = (x) => { // easeOutBounce
  x = clamp(x, 0, 1);
  if (x < 1 / 2.75) return 7.5625 * x * x;
  if (x < 2 / 2.75) { x -= 1.5 / 2.75; return 7.5625 * x * x + 0.75; }
  if (x < 2.5 / 2.75) { x -= 2.25 / 2.75; return 7.5625 * x * x + 0.9375; }
  x -= 2.625 / 2.75; return 7.5625 * x * x + 0.984375;
};

// --- drawing helpers ---------------------------------------------------------------------------------------
const R_ = rng(11);
const TICKS = Array.from({ length: 38 }, () => ({ x: R_(), y: R_(), dx: (R_() - 0.5) * 4, l: 4 + R_() * 4 }));
const FLOWERS = Array.from({ length: 7 }, () => ({ x: 0.06 + R_() * 0.88, y: 0.06 + R_() * 0.88 }));
const SPARK = Array.from({ length: 26 }, () => ({ x: R_(), y: R_(), l: 8 + R_() * 14 }));

function meadow(c, w, h) {
  const g = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.hypot(w, h) / 2);
  g.addColorStop(0, '#8FD16E'); g.addColorStop(1, '#5DAA4E');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.save(); c.strokeStyle = '#4C9544'; c.lineWidth = 1.6; c.lineCap = 'round'; c.beginPath();
  for (const k of TICKS) {
    const x = k.x * w, y = k.y * h;
    c.moveTo(x, y); c.lineTo(x + k.dx, y - k.l);
    c.moveTo(x + 3.5, y + 1); c.lineTo(x + 3.5 + k.dx * 0.6, y + 1 - k.l * 0.7);
  }
  c.stroke(); c.restore();
  c.save(); c.globalAlpha = 1; c.fillStyle = '#fff'; c.font = '15px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const f of FLOWERS) c.fillText('🌼', f.x * w, f.y * h);
  c.restore();
}
// a text label on a dark pill, kept inside the canvas
function pill(c, text, x, y, o = {}) {
  c.save(); c.globalAlpha = o.alpha ?? 1; c.font = '800 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + 18, th = 24;
  const bx = clamp(x - tw / 2, 6, Math.max(6, CW - tw - 6)), by = clamp(y - th / 2, 6, Math.max(6, CH - th - 6));
  c.fillStyle = 'rgba(16,19,32,.82)'; c.beginPath(); c.roundRect(bx, by, tw, th, th / 2); c.fill();
  if (o.bd) { c.lineWidth = 2; c.strokeStyle = o.bd; c.stroke(); }
  c.fillStyle = '#fff'; c.fillText(text, bx + tw / 2, by + th / 2 + 1);
  c.restore();
}
function seg(c, x1, y1, x2, y2, col, lw, o = {}) {
  c.save(); c.globalAlpha = o.alpha ?? 1; c.lineCap = 'round';
  if (o.under) { c.strokeStyle = 'rgba(20,24,36,.4)'; c.lineWidth = lw + 3.5; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
  if (o.glow) { c.shadowColor = col; c.shadowBlur = o.glow; }
  if (o.dash) c.setLineDash(o.dash);
  c.strokeStyle = col; c.lineWidth = lw; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  c.restore();
}
// the trampled band: a 10 px stroke with soft edges
function ring(c, cx, cy, r, a0, sweep) {
  if (sweep <= 0.001) return;
  c.save(); c.lineCap = 'round'; c.lineWidth = 10; c.strokeStyle = COL.trample; c.shadowColor = COL.trample; c.shadowBlur = 9;
  c.beginPath();
  if (sweep >= TAU - 0.001) c.arc(cx, cy, Math.max(0, r), 0, TAU); else c.arc(cx, cy, Math.max(0, r), a0, a0 + sweep);
  c.stroke(); c.restore();
}
function peg(c, x, y, gold) {
  c.save(); c.globalAlpha = 1;
  c.fillStyle = 'rgba(30,50,20,.3)'; c.beginPath(); c.ellipse(x + 2, y + 3, 9.5, 7, 0, 0, TAU); c.fill();
  const g = c.createRadialGradient(x - 2.5, y - 2.5, 1, x, y, 9);
  g.addColorStop(0, '#B98650'); g.addColorStop(1, COL.peg);

// the part of the canvas below the question card
const askH = () => (askEl.hidden ? 0 : askEl.offsetHeight + 20);

// --- view 1: the goat --------------------------------------------------------------------------------------
const G = { cx: 0, cy: 0, ppm: 0, init: false };

  meadow(c, w, h);

// --- view 2: radius or diameter? ---------------------------------------------------------------------------
const rad = (deg) => (deg * Math.PI) / 180;

  { kind: 2, a: [-0.4, -0.9165], b: [-0.4, 0.9165], ghost: { kind: 1, a: [0, -1], b: [0, 1] } },

// --- view 3: the wheel -------------------------------------------------------------------------------------

WT.total = WT.sticks + 3 * WT.drop + 0.5 + WT.tail;

  c.fillStyle = 'rgba(0,0,0,.32)'; c.beginPath(); c.ellipse(x, y + R + 1, R * 0.85, Math.max(2, R * 0.07), 0, 0, TAU); c.fill();

  ty.addColorStop(0, '#4D4D60'); ty.addColorStop(0.7, COL.tyre); ty.addColorStop(1, '#1D1D27');

  c.lineCap = 'round'; c.lineWidth = Math.max(1.6, R * 0.05); c.strokeStyle = '#4A4A5E';
  c.beginPath();

  c.lineWidth = 1.2; c.strokeStyle = '#6F7A90'; c.stroke();
  const well = c.createLinearGradient(x - R * 0.5, y - R * 0.5, x + R * 0.5, y + R * 0.5);
  well.addColorStop(0, '#8E98AC'); well.addColorStop(1, '#D5DAE5');
  c.fillStyle = well; c.beginPath(); c.arc(x, y, R * 0.57, 0, TAU); c.fill();

    c.strokeStyle = '#6F7A90'; c.lineWidth = Math.max(2.4, R * 0.075); c.beginPath(); c.moveTo(x + ca * R * 0.16, y + sa * R * 0.16); c.lineTo(x + ca * R * 0.58, y + sa * R * 0.58); c.stroke();
    c.strokeStyle = '#E6E9F0'; c.lineWidth = Math.max(1, R * 0.03); c.beginPath(); c.moveTo(x + ca * R * 0.16, y + sa * R * 0.16); c.lineTo(x + ca * R * 0.58, y + sa * R * 0.58); c.stroke();

}
function stick(c, x, y, len, hgt, label) {

function sceneWheel(c, w, h, dt, time) {

  const e = wh.ans === null ? -1 : time - wh.t0;
  if (!wh.rdone && e >= WT.total) { wh.rdone = true; wh.free = true; render(); }

  c.fillStyle = wood; c.fillRect(-4, yG, w + 8, plankH);
  c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(-4, yG, w + 8, 1.5);
  c.fillStyle = '#7A5530'; c.fillRect(-4, yG + plankH - 1, w + 8, 1);
  c.strokeStyle = '#6B4A24'; c.lineWidth = 1; c.beginPath();

  const mark = (x, a) => { c.save(); c.globalAlpha = a; c.fillStyle = COL.red; c.strokeStyle = '#B53636'; c.lineWidth = 1; c.beginPath(); c.roundRect(x - 2.5, yG, 5, 12, 2); c.fill(); c.stroke(); c.beginPath(); c.arc(x, yG + 1, 3.6, 0, TAU); c.fill(); c.stroke(); c.restore(); };
  mark(x0, 1);

  const th = e < 0 ? 0 : TAU * ease(e / WT.roll), xc = e < 0 ? x0 : x0 + R * th;
  if (e >= WT.roll) {
    mark(xe, ease((e - WT.roll) / 0.2));
    const sp = ease((e - WT.roll) / WT.seg), gx = x0 + (xe - x0) * sp;     // the two marks joined
    seg(c, x0, yG + 6, gx, yG + 6, COL.gold, 5, { glow: 10 });
    const ga = ease((e - WT.roll - 0.1) / WT.seg);
    c.save(); c.globalAlpha = ga * 0.8; c.setLineDash([4, 4]); c.strokeStyle = COL.gold; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x0, yG + plankH); c.lineTo(x0, yL + stickH / 2 + 6); c.moveTo(xe, yG + plankH); c.lineTo(xe, yL + stickH / 2 + 6); c.stroke(); c.restore();
  }
  // diameter sticks drop into the lane under the segment: 1, 2, 3 and a little leftover
  const left = (Math.PI - 3) * D, drop = yL - (yG + 6);
  for (let i = 0; i < 4; i++) {
    const ti = e - (WT.sticks + i * WT.drop);
    if (ti <= 0) continue;
    const pr = clamp(ti / 0.5, 0, 1), dy = -(1 - bounce(pr)) * drop * 0.6 - (1 - ease(pr * 3)) * 6;
    c.save(); c.globalAlpha = clamp(pr * 4, 0, 1);
    if (i < 3) stick(c, x0 + i * D, yL + dy, D, stickH, String(i + 1)); else stick(c, x0 + 3 * D, yL + dy, left, stickH, '');
    c.restore();
  }
  const tl = e - (WT.sticks + 3 * WT.drop + 0.4);
  if (tl > 0) {
    const a = ease(tl / 0.4), lx = x0 + 3 * D + left / 2, ly = yL + stickH / 2 + 18;
    seg(c, lx, yL + stickH / 2 + 2, lx, ly - 12, '#fff', 1.5, { alpha: a * 0.7 });
    pill(c, LEFT(), lx, ly, { alpha: a, bd: COL.dia });
    pill(c, `3 + ${LEFT()} = ${PI2()}`, (x0 + xe) / 2, ly + 30, { alpha: ease((tl - 0.3) / 0.4) });
  }
  // the wheel itself, with its diameter drawn as an orange stick
  wheelBody(c, xc, yG - R, R, th);
  seg(c, xc - R, yG - R, xc + R, yG - R, COL.dia, 4, { under: true, alpha: 0.95 });
  seg(c, xc - R, yG - R - 6, xc - R, yG - R + 6, COL.dia, 3, { under: true });
  seg(c, xc + R, yG - R - 6, xc + R, yG - R + 6, COL.dia, 3, { under: true });
}

// --- secret 1: ripples on a pond ---------------------------------------------------------------------------
function scenePond(c, w, h, time) {
  const gt = T[lang].g;
  const bg = c.createLinearGradient(0, 0, w, h); bg.addColorStop(0, '#3F7FBF'); bg.addColorStop(1, '#2A5E99');
  c.fillStyle = bg; c.fillRect(0, 0, w, h);
  c.save(); c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 1.5; c.lineCap = 'round'; c.beginPath();
  for (const s of SPARK) { c.moveTo(s.x * w, s.y * h); c.lineTo(s.x * w + s.l, s.y * h); }
  c.stroke(); c.restore();
  const ppm = Math.min(w, h) / 8, speed = 1.05;
  S.rip = S.rip.filter((r) => time - r.t0 < 4.6);
  for (const r of S.rip) {
    const age = time - r.t0, x = r.x * w, y = r.y * h;
    if (age < 0.35) { c.save(); c.globalAlpha = 1 - age / 0.35; c.fillStyle = '#D4E3F5'; c.beginPath(); c.arc(x, y, Math.max(0, 5 * (1 - age / 0.35) + 1), 0, TAU); c.fill(); c.restore(); }
    for (let k = 0; k < 4; k++) {
      const ag = age - k * 0.34; if (ag <= 0) continue;
      const al = Math.pow(Math.max(0, 1 - ag / 3.9), 1.4) * (1 - k * 0.18);
      c.save(); c.strokeStyle = `rgba(255,255,255,${(al * 0.9).toFixed(3)})`; c.lineWidth = 3 - k * 0.5;
      c.beginPath(); c.arc(x, y, Math.max(0, ag * speed * ppm), 0, TAU); c.stroke(); c.restore();
    }
    if (age > 0.25 && age < 3.9) {
      const rm = age * speed, rp = rm * ppm;
      pill(c, `${gt.radius} = ${fix(rm, 1)} ${gt.m}`, x + rp * 0.7, y - rp * 0.7, { alpha: clamp(Math.pow(1 - age / 3.9, 0.6), 0, 1) });
    }
  }
  const last = S.rip[S.rip.length - 1], v = last ? Math.min(3.9, time - last.t0) * speed : 0;
  const txt = `r = ${fix(v, 1)} ${gt.m}`;
  if (txt !== S.lastVal) { S.lastVal = txt; lab.setReadout(txt, '', '', '#3F7FBF'); }
}

// --- secret 2: the same number for a coin, a plate and a hoop ----------------------------------------------
const PI_UNITS = [1, 3, 8];
function piItem(c, kind, cx, cy, R) {
  c.save(); c.globalAlpha = 1;
  c.fillStyle = 'rgba(20,50,20,.28)'; c.beginPath(); c.ellipse(cx + R * 0.05, cy + R * 0.12, R * 1.02, R * 0.98, 0, 0, TAU); c.fill();
  if (kind === 0) {
    const g = c.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.1, cx, cy, R);
    g.addColorStop(0, '#FFE69E'); g.addColorStop(0.6, COL.gold); g.addColorStop(1, '#C99422');
    c.fillStyle = g; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fill(); c.lineWidth = 2; c.strokeStyle = '#9A6F12'; c.stroke();
    c.lineWidth = 1.5; c.strokeStyle = 'rgba(154,111,18,.6)'; c.beginPath(); c.arc(cx, cy, R * 0.78, 0, TAU); c.stroke();
  } else if (kind === 1) {
    const g = c.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.1, cx, cy, R);
    g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#DDD7CA');
    c.fillStyle = g; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#B2ADA3'; c.stroke();
    c.lineWidth = R * 0.07; c.strokeStyle = COL.rad; c.beginPath(); c.arc(cx, cy, R * 0.86, 0, TAU); c.stroke();
    c.lineWidth = 1.5; c.strokeStyle = '#C8C2B5'; c.beginPath(); c.arc(cx, cy, R * 0.6, 0, TAU); c.stroke();
  } else {
    const lw = R * 0.13;
    c.lineWidth = lw + 3; c.strokeStyle = '#8C2B2B'; c.beginPath(); c.arc(cx, cy, R - lw / 2, 0, TAU); c.stroke();
    c.lineWidth = lw; c.strokeStyle = COL.red; c.beginPath(); c.arc(cx, cy, R - lw / 2, 0, TAU); c.stroke();
    c.lineWidth = lw * 0.28; c.strokeStyle = '#FFB1B1'; c.beginPath(); c.arc(cx, cy, R - lw / 2, rad(200), rad(260)); c.stroke();
  }
  c.restore();
}
function scenePi(c, w, h, time) {
  const t = T[lang], pi = S.pi, idx = pi.idx;
  let e = time - pi.t0;
  if (e > 7.4) { pi.idx = (idx + 1) % 3; pi.t0 = time; e = 0; }
  const i = pi.idx;
  if (e > WT_PI.table && !pi.done[i]) { pi.done[i] = true; render(); }
  meadow(c, w, h);
  // sizes 1 : 3 : 8 at the top, the one on show is ringed
  const u = 6, gap = 10, tot = u * 12 + gap * 2;
  let sx = (w - tot) / 2;
  pill(c, t.items[i], w / 2, 18, { bd: COL.gold });
  for (let k = 0; k < 3; k++) {
    const dd = u * PI_UNITS[k], cxk = sx + dd / 2;
    c.save(); c.globalAlpha = k === i ? 1 : 0.55;
    piItem(c, k, cxk, 58, dd / 2);
    if (k === i) { c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.beginPath(); c.arc(cxk, 58, dd / 2 + 4, 0, TAU); c.stroke(); }
    c.restore();
    sx += dd + gap;
  }
  const d = Math.max(60, Math.min((w - 48) / Math.PI, h - 92 - 170, 170)), R = d / 2, cx = w / 2, cy = 96 + R;
  const xs = (w - Math.PI * d) / 2, yb = cy + R + 34, ys = yb + 28, sh = clamp(d * 0.15, 12, 18);
  piItem(c, i, cx, cy, R);
  // the string wraps the edge, then is pulled straight
  const p = ease((e - 0.8) / 2.3), ra = R + (i === 2 ? 1.5 : 2);
  const intro = ease(e / 0.5);
  const a1 = -Math.PI / 2 + TAU * p;
  if (p < 0.999) {
    c.save(); c.globalAlpha = intro; c.lineCap = 'round';
    c.strokeStyle = 'rgba(20,24,36,.45)'; c.lineWidth = 6; c.beginPath(); c.arc(cx, cy, Math.max(0, ra), a1, -Math.PI / 2 + TAU); c.stroke();
    c.strokeStyle = '#F7F3EA'; c.lineWidth = 3.5; c.beginPath(); c.arc(cx, cy, Math.max(0, ra), a1, -Math.PI / 2 + TAU); c.stroke();
    c.restore();
  }
  if (p > 0.001) {
    const xe = xs + p * Math.PI * d;
    seg(c, xs, yb, xe, yb, '#F7F3EA', 3.5, { under: true });
    c.save(); c.fillStyle = '#fff'; c.strokeStyle = '#1E2230'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(xe, yb, 4.5, 0, TAU); c.fill(); c.stroke();
    if (p < 0.999) { c.beginPath(); c.arc(cx + Math.cos(a1) * ra, cy + Math.sin(a1) * ra, 4.5, 0, TAU); c.fill(); c.stroke(); }
    c.restore();
  }
  // three diameter sticks and a little leftover, laid next to the string
  const left = (Math.PI - 3) * d;
  for (let k = 0; k < 4; k++) {
    const ti = e - (WT_PI.sticks + k * 0.55);
    if (ti <= 0) continue;
    const pr = clamp(ti / 0.5, 0, 1), dy = -(1 - bounce(pr)) * 26;
    c.save(); c.globalAlpha = clamp(pr * 4, 0, 1);
    if (k < 3) stick(c, xs + k * d, ys + dy, d, sh, String(k + 1)); else stick(c, xs + 3 * d, ys + dy, left, sh, '');
    c.restore();
  }
  const tl = e - WT_PI.label;
  if (tl > 0) {
    const a = ease(tl / 0.4), lx = xs + 3 * d + left / 2, ly = ys + sh / 2 + 20;
    seg(c, lx, ys + sh / 2 + 2, lx, ly - 12, '#fff', 1.5, { alpha: a * 0.7 });
    pill(c, LEFT(), lx, ly, { alpha: a, bd: COL.dia });
    pill(c, `3 + ${LEFT()} = ${PI2()}`, w / 2, ly + 30, { alpha: ease((tl - 0.3) / 0.4) });
  }
}
const WT_PI = { sticks: 3.3, label: 5.3, table: 5.3 };

// --- the loop ----------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'goat') {
    if (S.sec === 'ripples') scenePond(c, w, h, time);
    else if (S.sec === 'pi') scenePi(c, w, h, time);
    else sceneGoat(c, w, h, dt, time);
  } else if (v === 'parts') sceneParts(c, w, h, dt, time);
  else sceneWheel(c, w, h, dt, time);
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'goat') return;
  const r = $('cv').getBoundingClientRect();
  if (S.sec === 'ripples') {
    S.rip.push({ x: (ev.clientX - r.left) / r.width, y: (ev.clientY - r.top) / r.height, t0: now() });
    if (S.rip.length > 4) S.rip.shift();
    sfx.tick();
  } else if (S.sec === 'pi') { S.pi.idx = (S.pi.idx + 1) % 3; S.pi.t0 = now(); sfx.click(); }
});

// --- questions and controls --------------------------------------------------------------------------------
// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function cardHTML(q, opts, ans, okIdx, showVerdict, text, btn) {
  const t = T[lang];
  const o = opts.map((l, i) => `<button class="ob ${ans === null ? '' : i === okIdx ? 'ok' : i === ans ? 'no' : 'dim'}" data-k="${i}"${ans === null ? '' : ' disabled'}>${esc(l)}</button>`).join('');
  const v = showVerdict
    ? `<div class="verdict ${ans === okIdx ? 'good' : 'warn'}">${esc(ans === okIdx ? t.right : t.wrong)}</div><p>${esc(text)}</p>${btn ? `<button class="btn" data-go="${btn[0]}">${esc(btn[1])}</button>` : ''}` : '';
  return `<div class="q">${esc(q)}</div><div class="opts">${o}</div>${v}`;
}
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const v = lab.view;
  if (b.dataset.k !== undefined) {
    const k = +b.dataset.k, o = v === 'goat' ? S.g : v === 'parts' ? S.p : S.w;
    if (o.ans !== null) return;
    const ok = v === 'goat' ? (S.g.q === 1 ? 0 : 1) : v === 'parts' ? ROUNDS[S.p.i].kind : 2;
    o.ans = k; o.t0 = now(); o.rdone = false;
    if (v === 'parts') S.p.right[S.p.i] = k === ok;
    (k === ok ? sfx.good : sfx.bad)();
    if (v !== 'parts') showStage();
  } else if (b.dataset.go === 'next') {
    sfx.click();
    if (v === 'goat') Object.assign(S.g, { q: 2, ans: null, rdone: false, free: false, moved: false });
    else { S.p.i++; S.p.ans = null; if (S.p.i >= 6) S.p.endAt = now(); }
  } else if (b.dataset.go === 'again') {
    sfx.click();
    if (v === 'parts') S.p = { i: 0, ans: null, t0: 0, right: [], endAt: 0 };
    else { S.w.t0 = now(); S.w.rdone = false; showStage(); }
  }
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.sec;
  S.sec = S.sec === k ? null : k;
  if (S.sec === 'ripples') { S.rip = [{ x: 0.5, y: 0.5, t0: now() }]; S.lastVal = ''; }
  if (S.sec === 'pi') { S.pi.idx = 0; S.pi.t0 = now(); S.lastVal = ''; }
  sfx.click(); showStage(); render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'rope') { // the goat re-walks the new circle live
    const g = S.g; g.rope = +ev.target.value; g.a0 = g.a; g.sweep = 0; g.moved = true; sfx.tick(); render();
  } else if (ev.target.id === 'wsize') {  // the finished roll, redrawn at the new size
    S.w.sz = +ev.target.value; S.w.t0 = now() - 100; S.w.rdone = true; sfx.tick(); render();
  }
});

// --- one render per change: controls, readout and the state card -------------------------------------------
const stateOf = (a) => ({ emo: a[0], title: a[1], lead: a[2], body: '', extra: a[3] ? esc(a[3]) : '' });
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('goatCtl').hidden = v !== 'goat';
  $('wheelCtl').hidden = v !== 'wheel' || !S.w.free;
  askEl.hidden = v === 'goat' && S.sec !== null;
  if (v === 'goat') renderGoat(t); else if (v === 'parts') renderParts(t); else renderWheel(t);
}
function renderGoat(t) {
  const g = S.g, gt = t.g, open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('ripples', '💧') + sc('pi', '🍕');
  $('ropeBox').hidden = !g.free || S.sec !== null;
  $('ropeLbl').textContent = gt.rope; $('ropeVal').textContent = `${num(g.rope)} ${gt.m}`;
  $('ropeMin').textContent = `1 ${gt.m}`; $('ropeMax').textContent = `5 ${gt.m}`; $('rope').setAttribute('aria-label', gt.rope);
  lab.setGlow('rgba(93, 170, 78, .26)');
  if (S.sec === 'ripples') {
    lab.setReadout(`r = ${fix(0, 1)} ${gt.m}`, '', '', '#3F7FBF'); S.lastVal = '';
    lab.setState({ emo: '💧', title: t.secrets.ripples[0], lead: t.secrets.ripples[1], body: t.sec.ripplesText, extra: '' });
    return;
  }
  if (S.sec === 'pi') {
    lab.setReadout(`<span style="font-size:.55em;font-weight:800;color:var(--soft)">${esc(t.w.ratio)} =</span> ${PI2()}`, '', '', COL.gold);
    const rows = t.items.map((n, i) => `<tr><td>${['🪙', '🍽️', '⭕'][i]} ${esc(n)}</td><td>${S.pi.done[i] ? PI2() : '…'}</td></tr>`).join('');
    lab.setState({ emo: '🍕', title: t.secrets.pi[0], lead: t.secrets.pi[1], body: t.sec.piText,
      extra: `<table class="pt"><tr><th></th><th>${esc(t.w.ratio)}</th></tr>${rows}</table><div class="fine" style="margin-top:10px">${esc(t.fine)}</div>` });
    return;
  }
  const done = g.q === 2 && g.rdone;
  askEl.innerHTML = cardHTML(gt['q' + g.q], gt['o' + g.q], g.ans, g.q === 1 ? 0 : 1, g.rdone, gt['r' + g.q], g.q === 1 ? ['next', t.next] : null);
  lab.setReadout(done ? `r = ${num(g.rope)} ${gt.m} · d = ${num(2 * g.rope)} ${gt.m}` : `${num(g.rope)} ${gt.m}`, done ? '' : gt.rope, '', '#8FD16E');
  lab.setState(stateOf(done ? t.st.goat.f : t.st.goat.n));
}
function renderParts(t) {
  const p = S.p, k = p.right.filter(Boolean).length;
  lab.setGlow('rgba(91, 141, 239, .26)');
  const dots = [0, 1, 2, 3, 4, 5].map((i) => (i < p.i ? '●' : i === p.i ? '◉' : '○')).join(' ');
  lab.setReadout(`${k}/6`, dots, '', COL.rad);
  if (p.i >= 6) {
    askEl.innerHTML = `<div class="verdict good" style="margin-top:0">${k}/6</div><p>${esc(t.p.sum)}</p><button class="btn" data-go="again">${esc(t.again)}</button>`;
  } else {
    const rd = ROUNDS[p.i];
    askEl.innerHTML = cardHTML(t.p.q, t.p.o, p.ans, rd.kind, p.ans !== null, t.p.why[p.i], ['next', t.next]);
  }
  lab.setState(stateOf(p.ans !== null || p.i > 0 ? t.st.parts.f : t.st.parts.n));
}
function renderWheel(t) {
  const w = S.w;
  lab.setGlow('rgba(255, 159, 90, .24)');
  $('szLbl').textContent = t.w.size; $('wsize').setAttribute('aria-label', t.w.size);
  askEl.innerHTML = cardHTML(t.w.q, t.w.o, w.ans, 2, w.rdone, t.w.r, ['again', t.again]);
  if (w.free) lab.setReadout(`<span style="font-size:.55em;font-weight:800;color:var(--soft)">${esc(t.w.ratio)} =</span> ${PI2()}`, '', '', COL.dia);
  else lab.setReadout('?', '', '', COL.dia);
  lab.setState(stateOf(w.free ? t.st.wheel.f : t.st.wheel.n));
  $('stExtra').innerHTML = w.free ? `<div class="fine">${esc(t.fine)}</div>` : '';
}
render();
</script>
</body>
