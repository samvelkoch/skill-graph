  } else {
    const s = t.sb, f = S.form, rv = true;
    mount('v-sb', `${lang}`, () => `<div class="bt-form" id="sbForms">${s.forms.map((n, k) => `<button type="button" class="bt-chip" data-act="form" data-k="${k}">${esc(n)}</button>`).join('')}</div>
      <div class="bt-same">${s.same.map((x) => `<span>${esc(x)}</span>`).join('')}</div><div id="sbCard" style="width:100%"></div><div class="bt-line" id="sbWhy"></div>`);
    document.querySelectorAll('#sbForms .bt-chip').forEach((b) => b.classList.toggle('on', +b.dataset.k === f));
    const key = `${lang}|${f}`;
    if ($('sbCard').dataset.k !== key) {
      $('sbCard').dataset.k = key;
      const x = s.texts[f];
      $('sbCard').innerHTML = f === 0 ? `<div class="bt-fc sheet"><h4>${esc(t.fx.h)}</h4><p>${fmt(x, rv)}</p></div>` : f === 1 ? `<div class="bt-fc tale" style="text-align:left"><span class="vig">🦊</span><p>${fmt(x, rv)}</p></div>` : `<div class="bt-fc poster"><span class="no">🔊</span><p>${fmt(x, rv)}</p></div>`;
    }
    $('sbWhy').innerHTML = `<b>${esc(s.rs[f])}</b>`;
    lab.setReadout(['🔎', '📖', '✋'][f], s.forms[f], '', '#ffd27a');
    lab.setState({ emo: '🔁', title: s.t, lead: s.lead, body: s.rs[f] });
  }
}

// --- events -----------------------------------------------------------------------------------------------
$('overlay').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = +b.dataset.k, s = S.sh, c = S.cv, f = S.fx;
  if (a === 'sh' && s.pick === null) { s.pick = k; s.ok[s.i] = k === BOOKS[s.i].k; (s.ok[s.i] ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'shNext') { s.sorted.push(s.i); s.fresh = s.i; s.i++; s.pick = null; sfx.snap(); setTimeout(() => { s.fresh = -1; render(); }, 800); }
  else if (a === 'shAgain') { S.sh = { i: 0, pick: null, sorted: [], ok: [], fresh: -1 }; sfx.click(); }
  else if (a === 'nm') {
    if (c.wp === null) { c.wp = k; c.bad = k === 0 ? null : k; (k === 0 ? sfx.good : sfx.bad)(); }
    else if (c.pp === null) { c.pp = k; c.bad = k === 1 ? null : k; (k === 1 ? sfx.good : sfx.bad)(); }
  }
  else if (a === 'tg') { if (b.dataset.k === 'w') c.words = !c.words; else c.pics = !c.pics; sfx.click(); }
  else if (a === 'fx' && f.pick === null) { f.pick = k; f.ok[f.i] = k === f.i; (f.ok[f.i] ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'fxNext') { f.i++; f.pick = null; sfx.click(); }
  else if (a === 'vw' && f.view === null) { f.view = k; sfx.snap(); }
  else if (a === 'fxAgain') { S.fx = { i: 0, pick: null, ok: [], view: null }; sfx.click(); }
  else if (a === 'look') { S.look = !S.look; sfx.click(); }
  else if (a === 'form') { S.form = k; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act=sec]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); render();
});

// --- one render per change --------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  document.body.dataset.v = sec ? 'sec' : v;
  $('v-shelf').hidden = !!sec || v !== 'shelf'; $('v-cover').hidden = !!sec || v !== 'cover'; $('v-fox').hidden = !!sec || v !== 'fox';
  $('v-sa').hidden = sec !== 'a'; $('v-sb').hidden = sec !== 'b';
  const sc = (k, emo) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('btSec').innerHTML = sc('a', '🎩') + sc('b', '🔁');
  lab.setFacts(t.facts[v]);
  if (sec) renderSecrets(t); else if (v === 'shelf') renderShelf(t); else if (v === 'cover') renderCover(t); else renderFox(t);
}
render();
</script>
</body>
</html>
