// --- constants and small helpers ----------------------------------------------------------------------------
const TAU = Math.PI * 2;
const SW = 450, SH = 400; // the scene is drawn in these units and scaled to the stage
const P = { wood: '#B9824F', woodD: '#7A5232', brass: '#E0B354', glow: '#FFD166', skin: '#F2C6A0', shirt: '#4FA3E0', lemon: '#F7DC4A',
  flower: '#FF8FB1', ink: '#2B2140', bg: '#1E1B33', leaf: '#6FBF73', red: '#E5484D' };
const hex2 = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, k) => { const A = hex2(a), B = hex2(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
const shade = (h, k) => mix(h, '#000000', k);
const tint = (h, k) => mix(h, '#ffffff', k);
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeOutBack = (x) => { x = clamp01(x); const s = 1.5; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); };
const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); };
const poly = (c, pts) => { c.beginPath(); pts.forEach(([X, Y], i) => (i ? c.lineTo(X, Y) : c.moveTo(X, Y))); c.closePath(); };
const cap = (c, x1, y1, x2, y2, w, fill, line) => {
  c.lineCap = 'round';
  if (line) { c.strokeStyle = line; c.lineWidth = w + 3; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
  c.strokeStyle = fill; c.lineWidth = w; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
};
const nowS = () => performance.now() / 1000;
let SC = 1; // scene scale of the current frame: lets text keep a real size in screen pixels

// text on a dark rounded pill, clamped inside the scene; px is the on-screen font size
function pill(c, text, x, y, px = 13, o = {}) {
  c.save(); c.globalAlpha = o.a ?? 1; c.font = `800 ${px / SC}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const pw = c.measureText(text).width + 18 / SC, ph = (px + 10) / SC;
  x = clamp(x, pw / 2 + 3, SW - pw / 2 - 3);
  c.fillStyle = o.bg ?? 'rgba(20,18,40,.84)'; c.strokeStyle = o.line ?? 'rgba(255,209,102,.9)'; c.lineWidth = 1.3 / SC;
  c.beginPath(); c.roundRect(x - pw / 2, y - ph / 2, pw, ph, ph / 2); c.fill(); c.stroke();
  c.fillStyle = o.fg ?? '#fff'; c.fillText(text, x, y + 0.5 / SC);
  c.restore();

// --- clue paths: a stream of small symbols from the box to a body part ---------------------------------------
function flow(c, kind, A, B, prog, time, col) {
  const C = [(A[0] + B[0]) / 2, Math.min(A[1], B[1]) - 46], head = smooth(prog), N = 9;
  const at = (u) => [(1 - u) ** 2 * A[0] + 2 * (1 - u) * u * C[0] + u * u * B[0], (1 - u) ** 2 * A[1] + 2 * (1 - u) * u * C[1] + u * u * B[1]];
  c.save(); c.globalAlpha = 1; c.lineCap = 'round'; c.lineJoin = 'round';
  if (kind === 'light' && head > 0.02) { // a soft beam widening towards the eyes
    const pts = [], pts2 = [];
    for (let k = 0; k <= 16; k++) {
      const u = k / 16 * head, [x, y] = at(u), [x2, y2] = at(Math.min(1, u + 0.02)), L = Math.hypot(x2 - x, y2 - y) || 1;
      const nx = -(y2 - y) / L, ny = (x2 - x) / L, wd = 3 + 15 * u;
      pts.push([x + nx * wd, y + ny * wd]); pts2.push([x - nx * wd, y - ny * wd]);
    }
    const bg = c.createLinearGradient(A[0], A[1], B[0], B[1]); bg.addColorStop(0, 'rgba(255,209,102,.55)'); bg.addColorStop(1, 'rgba(255,209,102,.14)');
    poly(c, [...pts, ...pts2.reverse()]); c.fillStyle = bg; c.fill();
  }
  for (let k = 0; k < N; k++) {
    const u = (k / N + time * 0.32) % 1; if (u > head || u < 0.02) continue;
    const [x, y] = at(u), [x2, y2] = at(Math.min(1, u + 0.02)), ang = Math.atan2(y2 - y, x2 - x);
    c.save(); c.translate(x, y); c.rotate(kind === 'touch' ? 0 : ang); c.globalAlpha = Math.min(1, u * 8, (1 - u) * 8);
    if (kind === 'sound') {
      c.strokeStyle = tint(P.shirt, 0.55); c.lineWidth = 2.6;
      for (const r of [5, 10]) { c.beginPath(); c.arc(-2, 0, r, -0.95, 0.95); c.stroke(); }
    } else if (kind === 'scent') {
      c.strokeStyle = col ?? P.flower; c.lineWidth = 3.2; c.beginPath();
      for (let s = -10; s <= 10; s += 2) { const yy = Math.sin(s * 0.55 + time * 6) * 3.4; s === -10 ? c.moveTo(s, yy) : c.lineTo(s, yy); }
      c.stroke();
    } else if (kind === 'touch') {
      drawHand(c, 0, 4, 0, 0.5, P.skin, shade(P.skin, 0.32));
    } else if (kind === 'taste') {
      drawSpoon(c, 0, 0, 0, 0.5, false);
    } else { // light: a four-point sparkle
      c.fillStyle = P.glow; c.beginPath();
      for (let s = 0; s < 8; s++) { const r = s % 2 ? 2.2 : 6.5, a = s * Math.PI / 4; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      c.closePath(); c.fill();
    }
    c.restore();
  }
  c.restore();
}

  pill(c, T[lang].m.places[place], cx, cy - R - 20, 13);
}
const fmtCm = (v) => `${(Math.round(v * 10) / 10).toFixed(1).replace('.', lang === 'en' ? '.' : ',')} ${T[lang].cm}`;
function drawMapScene(c, time) {
  const M = S.map, free = M.ph >= 2, place = M.ph < 1 ? 0 : M.ph < 2 ? 4 : M.place, d = free ? M.d : 1, rev = free || M.pick !== null;
  drawOutline(c, place === 4, place, time);
  if (!rev) { // two small pencils hover over the touched place; the lens stays closed
    const [sx, sy] = SITE[place];
    c.save(); c.translate(sx, sy); c.scale(0.24, 0.24);
    pencil(c, -14, -6, -0.35); pencil(c, 14, -6, 0.35); c.restore();
  }
  const zt = rev ? clamp01((time - M.tR) / 0.9) : 0;
  drawLens(c, time, place, d, !rev, free ? 1 : zt);
}

// --- secret 1: hold your nose -----------------------------------------------------------------------------------------
function drawNose(c, time, dt) {
  const N = S.nose, t0 = time - N.t0, T_ = T[lang], hold = N.hold;
  N.a = lerp(N.a, hold ? 0.08 : 0.92, Math.min(1, dt * 4));
  drawChild(c, time, { pinch: hold, squint: hold ? 0.35 : undefined, chew: t0 > 1.4, look: -2 });
  drawTable(c);
  // the apple and its slice fly to the mouth
  const fly = smooth((t0 - 0.3) / 1.1);
  c.save(); c.globalAlpha = 1;
  ell(c, 78, 340, 52, 8); c.fillStyle = 'rgba(10,8,25,.4)'; c.fill();
  const pg = c.createLinearGradient(0, 326, 0, 346); pg.addColorStop(0, '#F3F5FB'); pg.addColorStop(1, '#AEB9D6'); ell(c, 78, 336, 50, 9); c.fillStyle = pg; c.fill(); c.strokeStyle = '#7f8db0'; c.lineWidth = 1.4; c.stroke();
  const ag = c.createRadialGradient(66, 306, 3, 78, 316, 32); ag.addColorStop(0, tint(P.red, 0.45)); ag.addColorStop(0.6, P.red); ag.addColorStop(1, shade(P.red, 0.4));
  c.beginPath(); c.ellipse(70, 318, 19, 22, 0, 0, TAU); c.ellipse(88, 318, 19, 22, 0, 0, TAU); c.fillStyle = ag; c.fill(); c.strokeStyle = shade(P.red, 0.55); c.lineWidth = 1.5; c.stroke();
  c.strokeStyle = shade(P.woodD, 0.2); c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(79, 298); c.quadraticCurveTo(80, 290, 86, 285); c.stroke();
  ell(c, 90, 290, 10, 4.5, -0.5); c.fillStyle = P.leaf; c.fill();
  if (fly < 1) { // the slice: a half moon with red skin
    const x = lerp(104, 322, fly), y = lerp(310, 186, fly) - Math.sin(fly * Math.PI) * 60;
    c.save(); c.translate(x, y); c.rotate(fly * 2.5); c.beginPath(); c.arc(0, 0, 14, 0, Math.PI); c.closePath(); c.fillStyle = '#FBF1D0'; c.fill();
    c.beginPath(); c.arc(0, 0, 14, 0, Math.PI); c.strokeStyle = P.red; c.lineWidth = 3.6; c.lineCap = 'round'; c.stroke(); c.restore();
  }
  c.restore();
  // the flavour meter
  const mk = smooth((t0 - 1.5) / 0.8), bars = [[T_.sec.sweet, 0.82, P.flower], [T_.sec.apple, N.a, P.red]];
  c.save(); c.globalAlpha = 1;
  c.beginPath(); c.roundRect(14, 64, 212, 150, 16); c.fillStyle = 'rgba(20,18,40,.78)'; c.fill(); c.strokeStyle = 'rgba(255,209,102,.55)'; c.lineWidth = 1.6; c.stroke();
  bars.forEach(([label, v, col], k) => {
    const y = 84 + k * 62;
    c.font = `800 ${14 / SC}px Nunito, sans-serif`; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillStyle = '#fff'; c.fillText(label, 30, y + 2);
    c.beginPath(); c.roundRect(30, y + 10, 180, 22, 11); c.fillStyle = 'rgba(130,145,190,.18)'; c.fill();
    const w = Math.max(0, 180 * v * mk);
    if (w > 4) { const g = c.createLinearGradient(30, 0, 210, 0); g.addColorStop(0, tint(col, 0.3)); g.addColorStop(1, col); c.beginPath(); c.roundRect(30, y + 10, w, 22, 11); c.fillStyle = g; c.fill(); c.fillStyle = 'rgba(255,255,255,.3)'; c.beginPath(); c.roundRect(34, y + 13, Math.max(0, w - 8), 5, 3); c.fill(); }
  });
  c.restore();
}

// --- secret 2: reading with the fingers ------------------------------------------------------------------------------
const BRAILLE = { a: [1], b: [1, 2], c: [1, 4], d: [1, 4, 5], e: [1, 5] }, LETTERS = ['a', 'b', 'c', 'd', 'e'];
const DOT = (n, cx, cy, gap) => [cx + (n > 3 ? gap / 2 : -gap / 2), cy + ((n - 1) % 3 - 1) * gap];
function raisedDot(c, x, y, r, lit) {
  if (lit) { const hg = c.createRadialGradient(x, y, 0, x, y, r * 2.8); hg.addColorStop(0, 'rgba(255,209,102,.7)'); hg.addColorStop(1, 'rgba(255,209,102,0)'); circ(c, x, y, r * 2.8); c.fillStyle = hg; c.fill(); }
  ell(c, x + r * 0.2, y + r * 0.35, r, r * 0.9); c.fillStyle = 'rgba(0,0,0,.35)'; c.fill();
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.05); g.addColorStop(0, tint(P.brass, 0.7)); g.addColorStop(0.55, P.brass); g.addColorStop(1, shade(P.brass, 0.4));
  circ(c, x, y, r); c.fillStyle = g; c.fill(); c.strokeStyle = shade(P.brass, 0.55); c.lineWidth = 1; c.stroke();
}
function drawBraille(c, time) {
  const Br = S.br, y0 = 262, x0 = COLX[0], x1 = COLX[4];
  const auto = x0 + (x1 - x0) * (0.5 - 0.5 * Math.cos(time * 0.55));
  const fx = time < Br.until || Br.drag ? clamp(Br.x, 20, SW - 20) : auto; Br.cur = fx;
  let lit = -1; LETTERS.forEach((_, k) => { if (Math.abs(fx - COLX[k]) < 36) lit = k; });
  c.save(); c.globalAlpha = 1; c.lineJoin = 'round';
  // the big cell for the lit letter
  const cx = 225, cy = 112, gap = 36;
  c.beginPath(); c.roundRect(cx - 78, 44, 156, 140, 18); const bg = c.createLinearGradient(0, 44, 0, 184); bg.addColorStop(0, '#39345f'); bg.addColorStop(1, '#2a2650'); c.fillStyle = bg; c.fill(); c.strokeStyle = lit >= 0 ? P.glow : 'rgba(130,145,190,.45)'; c.lineWidth = lit >= 0 ? 2.6 : 1.6; c.stroke();
  const set = lit >= 0 ? BRAILLE[LETTERS[lit]] : [];
  for (let n = 1; n <= 6; n++) {
    const [dx, dy] = DOT(n, cx, cy + 6, gap);
    if (set.includes(n)) raisedDot(c, dx, dy, 11, true);
    else { circ(c, dx, dy, 8); c.fillStyle = 'rgba(0,0,0,.35)'; c.fill(); c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1.2; c.stroke(); }
    c.font = `800 ${12 / SC}px Nunito, sans-serif`; c.fillStyle = 'rgba(200,210,235,.75)'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(n), dx + (n > 3 ? 26 : -26), dy);
  }
  // the strip with five small cells
  c.beginPath(); c.roundRect(14, y0 - 56, SW - 28, 112, 16); const sg = c.createLinearGradient(0, y0 - 56, 0, y0 + 56); sg.addColorStop(0, shade(P.wood, 0.12)); sg.addColorStop(1, shade(P.woodD, 0.1)); c.fillStyle = sg; c.fill(); c.strokeStyle = shade(P.woodD, 0.5); c.lineWidth = 1.6; c.stroke();
  LETTERS.forEach((L, k) => {
    const x = COLX[k], on = k === lit;
    c.beginPath(); c.roundRect(x - 28, y0 - 46, 56, 70, 10); c.fillStyle = on ? tint(P.wood, 0.28) : tint(P.wood, 0.1); c.fill(); c.strokeStyle = shade(P.woodD, 0.35); c.lineWidth = 1.2; c.stroke();
    for (const n of BRAILLE[L]) { const [dx, dy] = DOT(n, x, y0 - 12, 14); raisedDot(c, dx, dy, 4.6, on); }
    c.font = `900 ${22 / SC}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = on ? P.glow : 'rgba(255,255,255,.55)'; c.fillText(L, x, y0 + 40);
  });
  // the fingertip
  const fy = y0 - 6;
  c.save(); c.translate(fx, fy); c.rotate(-0.1);
  const fg = c.createLinearGradient(-13, 0, 13, 0); fg.addColorStop(0, shade(P.skin, 0.15)); fg.addColorStop(0.4, tint(P.skin, 0.2)); fg.addColorStop(1, shade(P.skin, 0.2));
  c.beginPath(); c.moveTo(-13, 118); c.lineTo(-13, 12); c.quadraticCurveTo(-13, -14, 0, -14); c.quadraticCurveTo(13, -14, 13, 12); c.lineTo(13, 118); c.closePath();
  c.fillStyle = fg; c.fill(); c.strokeStyle = shade(P.skin, 0.38); c.lineWidth = 1.6; c.stroke();
  ell(c, 0, 4, 6, 8); c.fillStyle = 'rgba(255,255,255,.25)'; c.fill(); c.restore();
  c.restore();
}

// --- main draw ---------------------------------------------------------------------------------------------------------
const G = { ox: 0, oy: 0, sc: 1 };
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const sc = Math.min(w / SW, h / SH, 1.5); SC = sc; G.sc = sc; G.ox = (w - SW * sc) / 2; G.oy = (h - SH * sc) / 2;
  c.save(); c.translate(G.ox, G.oy); c.scale(sc, sc); c.lineJoin = 'round';
  const v = lab.view;
  if (v === 'box') {
    if (S.sec === 'nose') drawNose(c, time, dt);
    else if (S.sec === 'braille') drawBraille(c, time);
    else if (S.box.done) drawSummary(c, time);
    else drawBoxScene(c, time);
  } else if (v === 'which') drawWhichScene(c, time);
  else drawMapScene(c, time);
  c.restore();
});

// --- pointer: replay a clue, pick a thing, drag the finger --------------------------------------------------------------
const toScene = (ev) => { const r = $('cv').getBoundingClientRect(); return [(ev.clientX - r.left - G.ox) / G.sc, (ev.clientY - r.top - G.oy) / G.sc]; };
$('cv').addEventListener('pointerdown', (ev) => {
  const [x, y] = toScene(ev), B = S.box;
  if (lab.view !== 'box') return;
  if (S.sec === 'braille') { S.br.drag = true; S.br.x = x; S.br.until = nowS() + 3; $('cv').setPointerCapture?.(ev.pointerId); sfx.tick(); return; }
  if (S.sec) return;
  if (B.done) {
    const k = COLX.findIndex((cx) => Math.abs(x - cx) < 40);
    if (k >= 0 && y > 60 && y < 310) { B.sel = k; B.tSel = nowS(); sfx.click(); render(); }
  } else if (B.pick === null && x > 20 && x < 240 && y > 150 && y < 345) replay();
});
$('cv').addEventListener('pointermove', (ev) => { if (S.br.drag) { S.br.x = toScene(ev)[0]; S.br.until = nowS() + 3; } });
addEventListener('pointerup', () => { S.br.drag = false; });
addEventListener('pointercancel', () => { S.br.drag = false; });
function replay() { S.box.tC = nowS(); sfx.tick(); }

// --- controls --------------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view, j = +b.dataset.j;
  if (act === 'pick') {
    if (v === 'box') { const B = S.box; if (B.pick !== null) return; B.pick = j; B.tR = nowS(); B.right[B.i] = j === BOX_OK[B.i]; (B.right[B.i] ? sfx.good : sfx.bad)(); showStage(); }
    else if (v === 'which') { const Wh = S.which; if (Wh.pick !== null) return; Wh.pick = j; Wh.tR = nowS(); Wh.right[Wh.i] = j === W_OK[Wh.i]; if (Wh.i >= 3) Wh.done = true; (Wh.right[Wh.i] ? sfx.good : sfx.bad)(); showStage(); }
    else { const M = S.map; if (M.pick !== null) return; M.pick = j; M.tR = nowS(); (j === (M.ph < 1 ? 1 : 0) ? sfx.good : sfx.bad)(); showStage(); }
  } else if (act === 'next') {
    sfx.click();
    if (v === 'box') { const B = S.box; if (B.i >= 4) { B.done = true; B.sel = -1; } else { B.i++; B.pick = null; B.tC = nowS(); } }
    else if (v === 'which') { const Wh = S.which; Wh.i++; Wh.pick = null; }
    else { const M = S.map; M.ph++; M.pick = null; if (M.ph === 2) { M.place = 0; M.d = 1; } }
  } else if (act === 'again') {
    sfx.click();
    if (v === 'box') S.box = { i: 0, pick: null, tC: nowS(), tR: 0, done: false, right: [], sel: -1, tSel: 0 };
    else if (v === 'which') S.which = { i: 0, pick: null, tR: 0, right: [], done: false };
  } else if (act === 'restart') { S.map = { ph: 0, pick: null, tR: 0, place: 0, d: 1 }; sfx.click(); }
  else if (act === 'replay') replay();
  else if (act === 'place') { S.map.place = j; sfx.tick(); }
  else if (act === 'sec') {
    const k = b.dataset.k; if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click();
    if (S.sec === 'nose') { S.nose.hold = false; S.nose.a = 0.92; S.nose.t0 = nowS(); }
    if (S.sec === 'braille') S.br.until = 0;
  } else if (act === 'hold') { S.nose.hold = !S.nose.hold; sfx.click(); }
  render();
});
$('snD').addEventListener('input', (ev) => { S.map.d = +ev.target.value; renderMapFree(); });

// --- one render per change: controls, readout and the state card ----------------------------------------------------------------
const dotsOf = (n, i) => Array.from({ length: n }, (_, k) => (k < i ? '●' : k === i ? '◉' : '○')).join(' ');
const optsHtml = (list, ok, pick) => `<div class="sn-opts">${list.map((o, j) => `<button class="sn-opt${pick === null ? '' : j === ok ? ' good' : j === pick ? ' bad' : ''}" data-act="pick" data-j="${j}"${pick === null ? '' : ' disabled'}>${esc(o)}</button>`).join('')}</div>`;
const verdictHtml = (t, right, why, btn) => `<div class="sn-v ${right ? 'ok' : 'no'}">${esc(right ? t.right : t.wrong)}</div><p class="sn-why">${esc(why)}</p>${btn}`;
const nextBtn = (t, label) => `<button class="btn" data-act="next">${esc(label ?? t.next)}</button>`;
const againBtn = (t) => `<button class="btn" data-act="again">${esc(t.again)}</button>`;
const setState = (arr) => lab.setState({ emo: arr[0], title: arr[1], lead: arr[2], body: arr[3] });

function render() {
  const t = T[lang], v = lab.view;
  lab.setGlow('rgba(255, 209, 102, .16)');
  const sec = v === 'box' ? S.sec : null;
  $('snQA').hidden = !!sec || (v === 'map' && S.map.ph >= 2);
  $('snSecCtl').hidden = !sec;
  const free = v === 'map' && S.map.ph >= 2;
  $('snFree').hidden = !free;
  if (!free) $('snRestart').textContent = '';
  $('snSecRow').style.display = v === 'box' ? '' : 'none';
  if (v === 'box') renderBox(t); else if (v === 'which') renderWhich(t); else renderMap(t);
}

function renderBox(t) {
  const B = S.box, i = B.i, k = B.right.filter(Boolean).length, open = secret.unlocked();
  $('snSecRow').innerHTML = [['nose', '👃'], ['braille', '⠿']].map(([key, emo]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-act="sec" data-k="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`).join('');
  if (S.sec) {
    const key = S.sec, hold = S.nose.hold;
    $('snSecCtl').innerHTML = key === 'nose' ? `<button class="chip sn-hold ${hold ? 'sn-on' : ''}" data-act="hold">${esc(t.sec.hold)}</button>` : '';
    lab.setReadout(key === 'nose' ? `${esc(t.sec.sweet)}${hold ? '' : ' + ' + esc(t.sec.apple)}` : '⠿', '', '', P.glow);
    $('val').style.fontSize = '22px';
    lab.setState({ emo: key === 'nose' ? '👃' : '⠿', title: t.secrets[key][0], lead: t.secrets[key][1], body: key === 'nose' ? t.sec.noseText : t.sec.brailleText });
    return;
  }
  $('val').style.fontSize = '';
  if (B.done) {
    lab.setReadout(`${k}/5`, dotsOf(5, 5), '', P.glow);
    $('snQA').innerHTML = `<p class="sn-tap">${esc(t.b.tap)}</p>` + (B.sel >= 0 ? `<div class="sn-v ok">${esc(t.b.items[B.sel])}</div><p class="sn-why">${esc(t.b.why[B.sel])}</p>` : '') + `<div class="sn-row">${againBtn(t)}</div>`;
    setState(t.st.boxF); return;
  }
  const rev = B.pick !== null;
  lab.setReadout(`${i + 1}/5`, dotsOf(5, i), '', P.glow);
  $('snQA').innerHTML = `<div class="sn-clue">${esc(t.b.q[i])}</div>` + (rev ? '' : `<div class="sn-row" style="margin:0 0 6px"><button class="chip" data-act="replay" aria-label="${esc(t.replay)}" title="${esc(t.replay)}">🔁</button></div>`) +
    `<div class="sn-ask">${esc(t.b.ask)}</div>` + optsHtml(t.b.o[i], BOX_OK[i], B.pick) +
    (rev ? verdictHtml(t, B.right[i], t.b.why[i], nextBtn(t)) : '');
  setState(rev && i === 4 ? t.st.boxF : t.st.box);
}

function renderWhich(t) {
  const Wh = S.which, i = Math.min(Wh.i, 3), rev = Wh.pick !== null, k = Wh.right.filter(Boolean).length;
  $('val').style.fontSize = '';
  lab.setReadout(Wh.done ? `${k}/4` : `${i + 1}/4`, dotsOf(4, Wh.done ? 4 : i), '', P.glow);
  $('snQA').innerHTML = `<div class="sn-clue">${esc(t.w.q[i])}</div>` + optsHtml(t.w.o[i], W_OK[i], Wh.pick) +
    (rev ? verdictHtml(t, Wh.right[i], t.w.why[i], Wh.done ? againBtn(t) : nextBtn(t)) : '');
  setState(Wh.done ? t.st.whichF : t.st.which);
}

function renderMap(t) {
  const M = S.map, ph = M.ph;
  if (ph >= 2) { renderMapFree(); setState(t.st.mapF); return; }
  $('val').style.fontSize = '';
  const q = ph < 1, rev = M.pick !== null, ok = q ? 1 : 0, right = M.pick === ok;
  lab.setReadout(`${ph + 1}/2`, dotsOf(2, ph), '', P.glow);
  $('snQA').innerHTML = `<div class="sn-clue">${esc(q ? t.m.q1 : t.m.q2)}</div>` + optsHtml(t.m.o, ok, M.pick) +
    (rev ? verdictHtml(t, right, q ? t.m.r1 : t.m.r2, nextBtn(t)) : '');
  setState(ph === 1 && rev ? t.st.mapF : t.st.map);
}
function renderMapFree() {
  const t = T[lang], M = S.map, n = pointCount(M.place, M.d);
  $('snDl').textContent = t.m.dist; $('snDv').textContent = fmtCm(M.d); $('snD').value = M.d; $('snNote').textContent = t.m.note;
  $('snRestart').textContent = t.again;
  $('snPlaces').innerHTML = t.m.places.map((p, j) => `<button class="chip ${j === M.place ? 'on' : ''}" data-act="place" data-j="${j}">${esc(p)}</button>`).join('');
  $('val').style.fontSize = '22px';
  lab.setReadout(esc(t.m.feel(n)), '', '', P.glow);
}
render();
</script>
