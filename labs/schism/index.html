    c.strokeStyle = g; c.lineWidth = 28 * u; c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 2; c.setLineDash([3, 14]); c.lineDashOffset = -now() * 16; c.stroke(); c.setLineDash([]);
  });
  c.restore();
  tag(c, w, h, [t.west], cx - off, top - 18, 'c', { edge: COL.W }); tag(c, w, h, [t.east], cx + off, top - 18, 'c', { edge: COL.E });
  tag(c, w, h, [t.y1], cx, top + 10, 'c');
  // the long wait: a break mark and the number of years
  const my = h * 0.42;
  c.save(); c.strokeStyle = '#0c1124'; c.lineWidth = 12; [cx - off, cx + off].forEach((x) => { c.beginPath(); c.moveTo(x - 24 * u, my + 6); c.lineTo(x + 24 * u, my - 6); c.stroke(); }); c.restore();
  tag(c, w, h, [t.mid(YEARS)], cx, my, 'c');
  // the bridge, drawn on from the left stream to the right
  const by = h * 0.74;
  c.save(); c.lineCap = 'round';
  const bg = c.createLinearGradient(cx - off, 0, cx + off, 0); bg.addColorStop(0, COL.W); bg.addColorStop(1, COL.E);
  c.strokeStyle = bg; c.lineWidth = 9 * u; c.shadowColor = 'rgba(255,255,255,.35)'; c.shadowBlur = 10;
  const half = off * k; c.beginPath(); c.moveTo(cx - off, by); c.bezierCurveTo(cx - off * 0.5, by - 34 * u, cx + off * 0.5, by - 34 * u, cx + off, by);
  c.setLineDash([off * 2.6 * k + 0.01, off * 8]); c.stroke(); c.restore();
  tag(c, w, h, [t.date, t.who], cx, by - 62 * u, 'c', { a: clamp01((k - 0.5) * 2), edge: '#fff' });
  tag(c, w, h, [t.y2], cx, bot - 4, 'c');
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec === 'a') { drawSecA(c, w, h, dt, time); return; }
  if (S.sec === 'b') { drawSecB(c, w, h, dt, time); return; }
  const v = lab.view;
  if (v === 'river') drawRiver(c, w, h, dt, time); else if (v === 'split') drawSplit(c, w, h, dt, time); else drawStreet(c, w, h, dt, time);
});

// --- controls ---------------------------------------------------------------------------------------------------
// one question block: text, answer chips (they stay after the tap), verdict, then the "next" button
function blockHTML({ q, opts, pick, right, bad, next, dots }) {
  const t = T[lang], done = pick !== null;
  const chips = opts.map((o, i) => `<button class="sc-opt${done ? (i === right ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="opt" data-i="${i}"${done ? ' disabled' : ''}>${dots ? `<span class="sc-dot" style="background:${dots[i]}"></span>` : ''}${esc(o)}</button>`).join('');
  const verdict = done ? `<div class="sc-verdict ${pick === right ? 'good' : 'bad'}">${esc(pick === right ? t.right : bad)}</div>` : '';
  return `<div class="sc-q">${esc(q)}</div><div class="sc-opts">${chips}</div>${verdict}${done ? `<button class="sc-go" data-act="next">${esc(next)}</button>` : ''}`;
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(i) {
  const v = lab.view;
  if (v === 'river') {
    const k = S.ev; if (S.pick[k] !== null) return;
    S.pick[k] = i; S.revT[k] = now();
    (EV[k].side === (i === 0 ? 'W' : 'E') ? sfx.good : sfx.bad)();
  } else if (v === 'split') {
    const k = S.ci; if (S.cpick[k] !== null) return;
    const side = ['W', 'B', 'E'][i]; S.cpick[k] = side; S.crevT[k] = now();
    (CARD_SIDE[k] === side ? sfx.good : sfx.bad)();
  } else {
    const k = S.ti; if (S.tpick[k] !== null) return;
    S.tpick[k] = i === 0 ? 'W' : 'E'; S.trevT[k] = now();
    (TASKS[k].side === S.tpick[k] ? sfx.good : sfx.bad)();
  }
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v = lab.view;
  if (a === 'opt') return answer(+b.dataset.i);
  if (a === 'start') { S.started = true; S.startT = now(); sfx.click(); }
  else if (a === 'next') {
    sfx.click();
    if (v === 'river') S.ev++; else if (v === 'split') S.ci++; else S.ti++;
  } else if (a === 'again') {
    sfx.click();
    if (v === 'river') { S.ev = 0; S.pick = EV.map(() => null); S.started = true; S.startT = now() - 5; }
    else if (v === 'split') { S.ci = 0; S.cpick = CARD_SIDE.map(() => null); }
    else { S.ti = 0; S.tpick = TASKS.map(() => null); }
  } else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.secT = now(); sfx.click(); showStage();
  }
  render();
});

// --- one render per change: controls, readout, state card and facts ---------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('scSecs').innerHTML = sc('a', '📜') + sc('b', '🤝');
  let box = '';
  const sideOf = (s) => (s === 'W' ? t.rome : t.cpl);
  if (S.sec) {
    const sd = S.sec === 'a' ? t.secA : t.secB;
    box = `<p class="sc-note">${esc(sd.st[1])}</p>`;
    lab.setReadout(S.sec === 'a' ? '863' : t.secB.y2, S.sec === 'a' ? t.secrets.a[0] : t.secrets.b[1], '', S.sec === 'a' ? '#ffd27a' : '#cfd5e8');
    lab.setState({ emo: S.sec === 'a' ? '📜' : '🤝', title: sd.st[0], lead: sd.st[1], body: typeof sd.st[2] === 'function' ? sd.st[2](YEARS) : sd.st[2], extra: '' });
    lab.setFacts(sd.facts.map(([emo, text, src]) => ({ emo, text, src })));
    $('scBox').innerHTML = box; lab.setGlow('rgba(255, 210, 122, .22)');
    return;
  }
  if (v === 'river') {
    const done = S.ev >= EV.length, cur = EV[S.ev], pk = done ? null : S.pick[S.ev];
    const facts = EV.map((e, i) => (S.pick[i] !== null ? t.riverFacts[e.k] : null)).filter(Boolean).slice(-3).map(([emo, text, src]) => ({ emo, text, src }));
    lab.setFacts(facts);
    lab.setGlow('rgba(227, 169, 63, .24)');
    if (!S.started) {
      box = `<p class="sc-note">${esc(t.intro[2])}</p><button class="sc-go sc-first" data-act="start">${esc(t.start)}</button>`;
      lab.setReadout(t.introRead[0], t.introRead[1], t.introRead[2], '#e3a93f');
      lab.setState({ emo: t.intro[0], title: t.intro[1], lead: t.intro[2], body: t.intro[3], extra: '' });
    } else if (done) {
      const right = EV.filter((e, i) => S.pick[i] === (e.side === 'W' ? 0 : 1)).length;
      box = `<div class="sc-q">${esc(t.sum[1])}</div><button class="sc-go sc-first" data-act="again">${esc(t.again)}</button>`;
      lab.setReadout(`${right} / ${EV.length}`, '', t.sum[0], '#cfd5e8');
      lab.setState({ emo: '🗺️', title: t.sum[0], lead: t.sum[1], body: t.sum[2], extra: '' });
    } else {
      const trueIdx = cur.side === 'W' ? 0 : 1;
      box = blockHTML({ q: t.q[cur.k], opts: [t.rome, t.cpl], pick: pk, right: trueIdx, bad: t.wrongC(sideOf(cur.side)), next: S.ev === EV.length - 1 ? t.sum[0] + ' →' : t.next, dots: [COL.W, COL.E] });
      const prog = `${S.ev + 1} / ${EV.length}`;
      if (pk === null) {
        lab.setReadout('?', `${t.place[cur.k]} · ${t.yr[cur.k]}`, prog, '#8b94ad');
        lab.setState({ emo: '🤔', title: `${t.place[cur.k]} · ${t.yr[cur.k]}`, lead: t.ask, body: '', extra: '' });
      } else {
        const r = t.res[cur.k];
        lab.setReadout(sideOf(cur.side), `${t.place[cur.k]} · ${t.yr[cur.k]}`, prog, COL[cur.side]);
        lab.setState({ emo: cur.side === 'W' ? '🟡' : '🔵', title: r[0], lead: pk === trueIdx ? t.right : t.wrongC(sideOf(cur.side)), body: r[1], extra: '' });
      }
    }
  } else if (v === 'split') {
    const done = S.ci >= CARD_SIDE.length, k = S.ci, pk = done ? null : S.cpick[k];
    lab.setFacts(t.splitFacts.map(([emo, text, src]) => ({ emo, text, src })));
    lab.setGlow('rgba(207, 213, 232, .22)');
    const nPlaced = S.cpick.filter((x) => x !== null).length, nRight = S.cpick.filter((x, i) => x === CARD_SIDE[i]).length;
    if (done) {
      box = `<div class="sc-q">${esc(t.splitSum[1])}</div><button class="sc-go sc-first" data-act="again">${esc(t.again)}</button>`;
      lab.setReadout(`${nRight} / ${CARD_SIDE.length}`, '', t.splitSum[0], '#cfd5e8');
      lab.setState({ emo: '✂️', title: t.splitSum[0], lead: t.splitSum[1], body: t.splitSum[2], extra: '' });
    } else {
      const side = CARD_SIDE[k];
      box = blockHTML({ q: t.cardQ(t.cards[k][0]), opts: [t.west, t.both, t.east], pick: pk === null ? null : ['W', 'B', 'E'].indexOf(pk), right: ['W', 'B', 'E'].indexOf(side), bad: t.wrongS(t.sideName[side]), next: k === CARD_SIDE.length - 1 ? t.splitSum[0] + ' →' : t.next, dots: [COL.W, COL.B, COL.E] });
      const prog = `${nPlaced} / ${CARD_SIDE.length}`;
      if (pk === null) {
        lab.setReadout(`${nPlaced} / ${CARD_SIDE.length}`, t.splitRead[0], t.sides.W + ' · ' + t.sides.B + ' · ' + t.sides.E, '#8b94ad');
        lab.setState({ emo: '🃏', title: t.splitAsk[0], lead: t.splitAsk[1], body: '', extra: '' });
      } else {
        const cd = t.cards[k];
        lab.setReadout(t.sides[side], t.splitRead[0] ? `${prog} ${t.splitRead[0]}` : prog, '', COL[side]);
        lab.setState({ emo: side === 'W' ? '🟡' : side === 'E' ? '🔵' : '⚪', title: cd[1], lead: pk === side ? t.right : t.wrongS(t.sideName[side]), body: `${cd[2]} ${cd[3]}`, extra: '' });
      }
    }
  } else {
    const done = S.ti >= TASKS.length, k = S.ti, pk = done ? null : S.tpick[k];
    const nDone = S.tpick.filter((x) => x !== null).length;
    lab.setGlow('rgba(108, 143, 240, .22)');
    lab.setFacts(done ? t.todayFacts.map(([emo, text, src]) => ({ emo, text, src })) : []);
    if (done) {
      const right = TASKS.filter((tk, i) => S.tpick[i] === tk.side).length;
      box = `<div class="sc-q">${esc(t.todaySum[1])}</div><button class="sc-go sc-first" data-act="again">${esc(t.again)}</button>`;
      lab.setReadout(`${right} / ${TASKS.length}`, '', t.todaySum[0], '#cfd5e8');
      lab.setState({ emo: '⛪', title: t.todaySum[0], lead: t.todaySum[1], body: t.todaySum[2], extra: '' });
    } else {
      const tk = TASKS[k], tr = t.tasks[k], trueIdx = tk.side === 'W' ? 0 : 1, name = tk.side === 'W' ? t.catholic : t.orthodox;
      box = blockHTML({ q: tk.c === -1 ? t.tqCal : t.tq, opts: [t.catholic, t.orthodox], pick: pk === null ? null : (pk === 'W' ? 0 : 1), right: trueIdx, bad: t.wrongC(name), next: k === TASKS.length - 1 ? t.todaySum[0] + ' →' : t.next, dots: [COL.W, COL.E] });
      if (pk === null) {
        lab.setReadout(`${nDone} / ${TASKS.length}`, t.todayRead[0], '?', '#8b94ad');
        lab.setState({ emo: '🔎', title: t.tqT, lead: tk.c === -1 ? t.tqCal : t.tq, body: t.todayAsk, extra: '' });
      } else {
        lab.setReadout(name, `${nDone} / ${TASKS.length} ${t.todayRead[0]}`, '', COL[tk.side]);
        lab.setState({ emo: tk.side === 'W' ? '🟡' : '🔵', title: tr[0], lead: tr[1], body: typeof tr[2] === 'function' ? tr[2](GAP13) : tr[2], extra: '' });
      }
    }
  }
  $('scBox').innerHTML = box;
}
render();
</script>
