  pill(c, T_.america, x(0.1), t0 + 20, { w, a: clamp(p * 4, 0, 1) });
  pill(c, T_.africa, x(0.9), t0 + 20, { w, a: clamp(p * 4, 0, 1) });
  if (p > 0.55) pill(c, T_.ridge, x(0.33), yAt(0.33) - 20, { w, a: clamp((p - 0.55) * 6, 0, 1) });
  if (t > 4.6) pill(c, T_.valley, x(0.5), yAt(0.5) + 30, { w, a: clamp((t - 4.6) * 2, 0, 1), color: '#ffcf70' });
  pill(c, 'Marie Tharp · 1952', w / 2, h - 24, { w });
}

// --- the canvas ----------------------------------------------------------------------------------------------
const cv = $('cv');
canvasLoop(cv, (c, w, h, dt, time) => {
  if (S.sec === 'tharp') { drawTharp(c, w, h, time); return; }
  const L = layout(w, h), v = lab.view, r = clamp(L.mw / 100, 3, 5.2);
  c.drawImage(base(w, h, L), 0, 0, w, h);
  c.save(); c.beginPath(); c.roundRect(L.x0, L.y0, L.mw, L.mh, 14); c.clip();
  if (S.sec === 'hawaii') {
    const a = eo((time - S.secT) / 1);
    drawEdges(c, L, a, time);
    ORDER.forEach((d, i) => drawDot(c, L, d, 99, r * 0.85, 0.55));
    const t = time - S.secT - 0.8, hx = px(L, KILAUEA.lon), hy = py(L, KILAUEA.lat), ex = px(L, HI_NEAR.lon), ey = py(L, HI_NEAR.lat);
    if (t > 0) {
      c.save(); c.setLineDash([4, 5]); c.lineDashOffset = -time * 8; c.strokeStyle = `rgba(255,255,255,${0.7 * eo(t / 0.8)})`; c.lineWidth = 1.4;
      c.beginPath(); c.moveTo(hx, hy); c.lineTo(hx + (ex - hx) * eo(t / 0.8), hy + (ey - hy) * eo(t / 0.8)); c.stroke(); c.restore();
      const g = c.createRadialGradient(hx, hy, 0, hx, hy, 26 + Math.sin(time * 3) * 3); g.addColorStop(0, 'rgba(255,90,30,.55)'); g.addColorStop(1, 'rgba(255,90,30,0)');
      c.fillStyle = g; c.beginPath(); c.arc(hx, hy, 30, 0, 7); c.fill();
      drawDot(c, L, KILAUEA, t, r * 1.35);
    }
    c.restore();
    if (t > 0.6) {
      pill(c, T[lang].secrets.hawaii[0] + ' 🌺', hx, hy - 24, { w });
      pill(c, T[lang].x.hot, hx, hy + 22, { w, color: '#ff9a5c', a: clamp((t - 0.6) * 2, 0, 1) });
    }
    pill(c, T[lang].x.pplate, px(L, -150), py(L, -14), { w, a: clamp((t + 0.8) * 1.5, 0, 1) });
    return;
  }
  if (v === 'dots') {
    if (S.rev.dots) drawEdges(c, L, eo((time - S.revT.dots) / 1.1), time);
    for (let i = 0; i < S.n; i++) drawDot(c, L, ORDER[i], time - S.born[i], r);
    c.restore();
    for (const f of S.flags) drawFlag(c, L, f, time);
    drawLabel(c, L, w, time);
  } else if (v === 'trace') {
    ORDER.forEach((d) => drawDot(c, L, d, 99, r));
    drawStrokes(c, L);
    if (S.rev.trace) drawEdges(c, L, eo((time - S.revT.trace) / 1.1), time);
    c.restore();
    drawLabel(c, L, w, time);
  } else {
    const round = ROUNDS[S.w.r], pick = S.w.pick;
    if (pick !== null) { const f = round.c[round.ok]; drawEdges(c, L, eo((time - S.w.revT) / 1.1), time, { lat: f[1], lon: f[2] }); }
    c.restore();
    drawPins(c, L, time);
  }
});

// --- input -----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const curL = () => { const r = cv.getBoundingClientRect(); return layout(r.width, r.height); };
const pt = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
function labelNear(x, y, n) {
  const L = curL(); let best = -1, bd = 20;
  for (let i = 0; i < n; i++) { const d = Math.hypot(px(L, ORDER[i].lon) - x, py(L, ORDER[i].lat) - y); if (d < bd) { bd = d; best = i; } }
  if (best >= 0) { S.label = { i: best, t: nowS() }; sfx.tick(); return true; }
  return false;
}
let drawing = false;
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const [x, y] = pt(ev), L = curL(), v = lab.view;
  if (v === 'dots') {
    if (!S.flagRev && S.n === 3) {
      if (!inMap(L, x, y)) return;
      if (S.flags.length >= 3) S.flags.shift();
      S.flags.push({ lat: unpy(L, y), lon: unpx(L, x), born: nowS(), close: false }); sfx.snap(); render();
    } else labelNear(x, y, S.n);
  } else if (v === 'trace') {
    if (!inMap(L, x, y)) return;
    drawing = true; cv.setPointerCapture(ev.pointerId);
    S.cur = [[(x - L.x0) / L.mw, (y - L.y0) / L.mh]]; S.curLen = 0; S.curX = x; S.curY = y; S.curX0 = x; S.curY0 = y;
  } else if (v === 'where' && S.w.pick === null) {
    let best = -1, bd = 24;
    S.pins.forEach((p) => { const d = Math.hypot(p.bx - x, p.by - y); if (d < bd) { bd = d; best = p.i; } });
    if (best >= 0) pickCity(best);
  }
});
cv.addEventListener('pointermove', (ev) => {
  if (!drawing || !S.cur) return;
  const [x, y] = pt(ev), L = curL();
  const cx = clamp(x, L.x0, L.x0 + L.mw), cy = clamp(y, L.y0, L.y0 + L.mh);
  if (Math.hypot(cx - S.curX, cy - S.curY) < 2.5) return;
  S.curLen += Math.hypot(cx - S.curX, cy - S.curY); S.curX = cx; S.curY = cy;
  S.cur.push([(cx - L.x0) / L.mw, (cy - L.y0) / L.mh]);
});
const endStroke = (ev) => {
  if (!drawing) return; drawing = false;
  const cur = S.cur; S.cur = null;
  if (!cur) return;
  if (S.curLen < 8) { labelNear(S.curX0, S.curY0, TOTAL); }
  else { S.strokes.push(cur); sfx.tick(); }
  render();
};
cv.addEventListener('pointerup', endStroke); cv.addEventListener('pointercancel', endStroke);

function pickCity(i) {
  S.w.pick = i; S.w.revT = nowS(); (i === ROUNDS[S.w.r].ok ? sfx.good : sfx.bad)(); render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a === 'more') {
    if (!S.flagRev) {
      S.flagRev = true; S.flagT = nowS();
      const t = nowS(); for (let i = 3; i < 13; i++) S.born[i] = t + (i - 3) * 0.12;
      S.near = 0;
      for (const f of S.flags) { f.close = ORDER.slice(3, 13).some((d) => degDist(f.lat, f.lon, d.lat, d.lon) <= 12); if (f.close) S.near++; }
      S.n = 13; sfx.push();
    } else {
      const t = nowS(), to = Math.min(TOTAL, S.n + 5);
      for (let i = S.n; i < to; i++) S.born[i] = t + (i - S.n) * 0.1;
      S.n = to; sfx.snap();
    }
    showStage();
  } else if (a === 'rule' || a === 'edges') {
    const k = lab.view === 'trace' ? 'trace' : 'dots';
    if (!S.rev[k]) { S.rev[k] = true; S.revT[k] = nowS(); sfx.good(); showStage(); }
  } else if (a === 'clear') { S.strokes = []; sfx.click(); }
  else if (a === 'pick') { if (S.w.pick === null) pickCity(+b.dataset.i); return; }
  else if (a === 'next') { S.w.r = (S.w.r + 1) % ROUNDS.length; S.w.pick = null; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    S.sec = S.sec === k ? null : k; S.secT = nowS(); sfx.click(); if (S.sec) showStage();
  }
  render();
});

// --- render ----------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, ask = !S.sec;
  document.body.dataset.v = v;
  const open = secret.unlocked();
  let ctrl = '', cap = '', state, ro, facts = t.facts[v];
  if (v === 'dots') {
    const flagPhase = !S.flagRev, canMore = flagPhase ? S.flags.length >= 3 : S.n < TOTAL;
    ctrl = `<div class="qk-row">${S.n < TOTAL || flagPhase ? `<button class="btn" data-a="more" ${canMore ? '' : 'disabled'}>${esc(flagPhase ? t.more : t.add5)}</button>` : ''}
      ${S.rev.dots ? '' : `<button class="chip qk-c" data-a="rule">${esc(t.showRule)}</button>`}</div>
      <div class="qk-row"><div class="qk-prog"><i style="width:${(S.n / TOTAL * 100).toFixed(1)}%"></i></div></div>`;
    cap = flagPhase ? `${esc(t.flagsAsk)} <span style="color:var(--mut)">(${S.flags.length}/3)</span>` : '';
    ro = [esc(t.dotsN(S.n)), '', ''];
    if (S.rev.dots) state = { emo: '📏', title: t.ruleTitle, lead: t.rule, body: '', extra: '' };
    else if (flagPhase) state = { emo: '🌋', title: t.sd.lead, lead: t.sd.body, body: '', extra: '' };
    else if (S.n === 13) { const ok = S.near >= 2; state = { emo: ok ? '✅' : '😮', title: ok ? t.right : t.surprise, lead: t.flagsRes(S.near), body: t.sd.body, extra: '' }; }
    else if (S.n >= TOTAL) state = { emo: '🌋', title: t.dotsN(S.n), lead: t.sd.body50, body: '', extra: '' };
    else state = { emo: '🔎', title: t.dotsN(S.n), lead: t.sd.body, body: '', extra: '' };
  } else if (v === 'trace') {
    ctrl = `<div class="qk-row">${S.rev.trace ? '' : `<button class="btn" data-a="edges">${esc(t.edges)}</button>`}
      <button class="chip qk-c" data-a="clear" ${S.strokes.length ? '' : 'disabled'}>${esc(t.clear)}</button></div>`;
    ro = [esc(t.dotsN(TOTAL)), '', ''];
    state = S.rev.trace ? { emo: '📏', title: t.ruleTitle, lead: t.rule, body: '', extra: `<div class="qk-fine">${esc(t.st.fine)}</div>` }
      : { emo: '✏️', title: t.st.lead, lead: t.st.body, body: '', extra: `<div class="qk-fine">${esc(t.st.fine)}</div>` };
  } else {
    const r = ROUNDS[S.w.r], pk = S.w.pick, done = pk !== null;
    ctrl = `<div class="qk-row">${r.c.map(([id], i) => `<button class="chip qk-c qk-city ${done ? (i === r.ok ? 'ok' : i === pk ? 'bad' : '') : ''}" data-a="pick" data-i="${i}" ${done ? 'disabled' : ''}><i style="background:${PIN_COL[i]}">${i + 1}</i> ${esc(t.cities[id])}</button>`).join('')}</div>
      ${done ? `<div class="qk-row"><button class="btn" data-a="next">${esc(t.next)}</button></div>` : ''}`;
    cap = done ? '' : esc(t.whereAsk);
    ro = [done ? esc(t.cities[r.c[r.ok][0]]) : '?', `${S.w.r + 1}/${ROUNDS.length}`, ''];
    if (done) { const ok = pk === r.ok; state = { emo: ok ? '✅' : '😮', title: ok ? t.right : t.surprise, lead: t.reasons[r.why], body: t.rule, extra: '' }; }
    else state = { emo: '🧭', title: t.sw.lead, lead: t.sw.body, body: '', extra: '' };
  }
  if (S.sec) {
    state = { emo: SEC_EMO[S.sec], title: t.secrets[S.sec][0], lead: t.done[S.sec], body: '', extra: '' };
    ro = [esc(t.secrets[S.sec][0]), '', ''];
    cap = '';
  }
  const showLegend = !cap && !(v === 'where' && !S.sec) && S.sec !== 'tharp';
  ctrl += `<div class="qk-row">${['hawaii', 'tharp'].map((k) => `<button class="chip secret qk-c ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-a="sec" data-k="${k}">${open ? `${SEC_EMO[k]} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('')}</div>`;
  $('ctrlBody').innerHTML = ctrl;
  const capEl = $('qkCap');
  capEl.hidden = !(cap || showLegend);
  capEl.innerHTML = cap || (showLegend ? `<span class="lg"><i></i>${esc(t.legend.q)}</span><span class="lg"><i class="v"></i>${esc(t.legend.v)}</span>` : '');
  lab.setGlow('rgba(255, 110, 60, .26)');
  lab.setReadout(ro[0], ro[1], ro[2], '#ff7a3c');
  lab.setState(state);
  lab.setFacts(facts);
}
render();
</script>
</body>
</html>
