  const v = lab.view, t = T[lang];
  // secrets: the time slider eases; a first demo slide runs by itself until the child takes the slider
  if (S.sec && v === 'then') {
    if (S.secAuto) { S.secV = Math.max(0, S.secV - dt / 5); if (S.secV <= 0) S.secAuto = false; syncSecSlider(); }
    S.secP += (1 - S.secV - S.secP) * Math.min(1, dt * 7);
  }
  const target = revealedNow() ? 1 : 0; S.m += clamp(target - S.m, -dt / 1.9, dt / 1.9);
  if (v === 'up' && S.g3 !== null && S.m >= 0.999 && S.playing) { S.t3 = Math.min(1, S.t3 + dt / 9); if (S.t3 >= 1) S.playing = false; syncUp(); }
  const e = sm(0, 1, S.m), s = Math.min(w / W, h / H) * 0.97, x0 = (w - W * s) / 2, y0 = (h - H * s) / 2;
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 24; c.shadowOffsetY = 8; c.fillStyle = '#000'; c.beginPath(); c.roundRect(x0, y0, W * s, H * s, 22 * s); c.fill(); c.restore();
  c.save(); c.translate(x0, y0); c.scale(s, s); c.beginPath(); c.roundRect(0, 0, W, H, 22); c.clip();
  let label = t.today;
  if (v === 'then') {
    if (S.sec === 'ant') {
      const p = S.secP; nowIce(c, time, false); c.globalAlpha = sm(0.08, 0.92, p); forestScene(c, time, null); c.globalAlpha = 1; label = p > 0.5 ? t.ago : t.today;
    } else if (S.sec === 'pan') {
      const p = S.secP; plainScene(c, time); const lv = sm(0.1, 0.32, p); if (lv > 0.001) waterRise(c, time, lv); label = p > 0.2 ? t.ago : t.today;
    } else {
      const it = FINDS[S.i1];
      morph(c, () => NOWF[it.now](c, time, true), () => { thenScene(c, it.env, it.subj, time); }, FX, FY, e); label = e > 0.5 ? t.ago : t.today;
    }
  } else if (v === 'clues') {
    const it = CLUES[S.i2];
    morph(c, () => nowSlab(c, it.kind, time), () => thenScene(c, it.env, it.subj, time), 200, C2Y, e); label = e > 0.5 ? t.ago : t.today;
  } else {
    if (S.g3 !== null && S.m >= 0.999) { drawUp(c, S.t3, time); label = S.t3 < 0.5 ? t.ago : t.today; }
    else morph(c, () => nowMount(c, time, true), () => drawUp(c, 0, time), FX, FY, e);

});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function itemsOf(v) { return v === 'then' ? { L: FINDS, G: S.g1, i: S.i1, tx: T[lang].f } : { L: CLUES, G: S.g2, i: S.i2, tx: T[lang].c }; }
function verdictOf(v) { // the headline after an answer
  const t = T[lang], { L, G, i, tx } = itemsOf(v), it = L[i], g = G[i], ok = g === it.env;
  if (ok) return { ok: true, text: `${t.right} ${tx[i].ans}` };
  if (it.near && g === it.near && tx[i].near) return { ok: false, near: true, text: `${t.nearTitle} ${tx[i].near}` };
  return { ok: false, text: `${t.notq} ${tx[i].ans}` };
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'item') {
    if (v === 'then') { S.i1 = +b.dataset.i; S.sec = null; } else S.i2 = +b.dataset.i;
    S.m = 0; sfx.click();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = b.dataset.k; S.secV = 1; S.secP = 0; S.secAuto = true; S.m = 0; sfx.click();
  } else if (act === 'opt') {
    const { L, G, i } = itemsOf(v), k = b.dataset.k; if (G[i] !== null) return;
    G[i] = k; S.m = 0; (k === L[i].env ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next') {
    const { G, i } = itemsOf(v);
    let n = -1; for (let d = 1; d <= 4; d++) { const k = (i + d) % 4; if (G[k] === null) { n = k; break; } }
    if (n < 0) { G.fill(null); n = 0; }
    if (v === 'then') S.i1 = n; else S.i2 = n;
    S.m = 0; sfx.click();
  } else if (act === 'g3') {
    if (S.g3 !== null) return;
    S.g3 = b.dataset.k; S.t3 = 0; S.ph = -1; S.playing = true; S.m = 0; (S.g3 === UP.ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'replay') { S.t3 = 0; S.ph = -1; S.playing = true; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'upR') { S.t3 = clamp(+ev.target.value / 100, 0, 1); S.playing = false; syncUp(); }
  else if (ev.target.id === 'secR') { S.secV = clamp(+ev.target.value / 100, 0, 1); S.secAuto = false; renderSecState(T[lang], false); }
});
function syncSecSlider() { const el = $('secR'); if (el) el.value = Math.round(S.secV * 100); renderSecState(T[lang], false); }
function syncUp() {
  const el = $('upR'); if (el && document.activeElement !== el) el.value = Math.round(S.t3 * 100);
  const ph = phaseOf(S.t3); if (ph !== S.ph) { S.ph = ph; renderUpState(T[lang]); }
}

// --- one render per change: controls, readout and the state card ----------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('fcPick').hidden = v === 'up'; $('fcUp').hidden = v !== 'up';
  if (v === 'up') renderUp(t); else renderPick(t, v);
}
function renderPick(t, v) {
  const { L, G, i, tx } = itemsOf(v), secOn = v === 'then' && S.sec !== null, it = L[i], g = G[i], done = g !== null, open = secret.unlocked();
  lab.setGlow('rgba(224, 176, 80, .24)');
  const chips = L.map((x, k) => `<button class="fc-find ${!secOn && k === i ? 'on' : ''} ${G[k] !== null ? 'done' : ''}" data-act="item" data-i="${k}" aria-label="${esc(tx[k].n)}">${x.emo}</button>`).join('');
  const sc = v === 'then' ? `<span class="fc-sep"></span>` + [['ant', '🐧'], ['pan', '🌊']].map(([k, e]) =>
    `<button class="fc-find sec ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('') : '';
  let body = '';
  if (secOn) {
    body = `<div class="fc-slide"><input type="range" class="big" id="secR" min="0" max="100" value="${Math.round(S.secV * 100)}" aria-label="${esc(t.up.slider)}" style="--track: linear-gradient(90deg, #2f8fb0, #6fbf6a, #e8e8ee)"><div class="fc-tl"><span>${esc(t.up.from)}</span><span>${esc(t.up.to)}</span></div></div>`;
  } else {
    const opts = (v === 'then' ? t.opt : t.opt2), vd = done ? verdictOf(v) : null;
    body = `<div class="fc-q">${esc(v === 'then' ? t.q1 : t.q2)}</div><div class="fc-opts">${it.order.map((k) => {
      const cls = !done ? '' : k === it.env ? 'good' : k === g ? 'bad' : 'dim';
      return `<button class="fc-opt ${cls}" data-act="opt" data-k="${k}"${done ? ' disabled' : ''}><span class="e">${ENVEMO[k]}</span>${esc(opts[k])}</button>`;
    }).join('')}</div>`;
    if (done) {
      const all = G.every((x) => x !== null);
      body += `<div class="fc-fb ${vd.ok ? 'good' : 'bad'}">${esc(vd.text)}</div><button class="fc-go${all ? ' ghost' : ''}" data-act="next">${esc(all ? t.again : t.next)}</button>`;
    }
  }
  $('fcPick').innerHTML = `<div class="fc-chips">${chips}${sc}</div>${body}`;
  if (secOn) { renderSecState(t); return; }
  const facts = done ? tx[i].facts.map((x, k) => ({ emo: '💡', text: x, src: it.src[k] })) : [];

    lab.setReadout('?', v === 'then' ? t.q1 : t.q2, '', '#e0b050');

  } else {
    const vd = verdictOf(v), col = ENVCOL[it.env];
    lab.setGlow(col + '44'); lab.setReadout(ENVEMO[it.env], `${t.ago}: ${t.envN[it.env]}`, vd.ok ? t.right : t.youSaid((v === 'then' ? t.opt : t.opt2)[g]), col);
    lab.setState({ emo: ENVEMO[it.env], title: vd.text, lead: tx[i].why, body: '' });
  }

}
function renderSecState(t, force = true) {
  const k = S.sec, sc = t.sc[k], p = 1 - S.secV, st = p < 0.12 ? ['0', k === 'ant' ? '🧊' : '🌾'] : p > 0.88 ? ['2', k === 'ant' ? '🌳' : '🌊'] : ['1', '⏳'];
  const n = st[0], key = k + (k === 'pan' ? (p > 0.32 ? 'S' : n) : n) + (p > 0.5 ? 'f' : '');

  lab.setGlow(k === 'ant' ? 'rgba(111, 191, 106, .26)' : 'rgba(63, 182, 210, .26)');
  if (k === 'pan') { // the sea is there from about the middle of the slide

    lab.setReadout(sea ? '🌊' : '🌾', sea ? t.ago : t.today, '', sea ? '#3fb6d2' : '#e0b050');
    lab.setState({ emo: sea ? '🌊' : p < 0.12 ? '🌾' : '⏳', title: sea ? sc.t2 : p < 0.12 ? sc.t0 : sc.t1, lead: sea ? sc.l2 : p < 0.12 ? sc.l0 : sc.l1, body: sea ? sc.b2 : '' });
  } else {
    lab.setReadout(n === '2' ? '🌳' : n === '0' ? '🧊' : '⏳', n === '0' ? t.today : t.ago, '', n === '2' ? '#6fbf6a' : '#9fc9e6');
    lab.setState({ emo: st[1], title: sc['t' + n], lead: sc['l' + n], body: n === '2' ? sc.b2 : '' });
  }
  lab.setFacts(p > 0.5 ? (k === 'ant' ? t.sc.antF : t.sc.panF).map((x) => ({ emo: '💡', text: x, src: k === 'ant' ? SRC.gloss : SRC.pan })) : []);
}
function renderUp(t) {
  const u = t.up, done = S.g3 !== null; let body = '';
  lab.setGlow('rgba(95, 168, 160, .26)');
  const ok = S.g3 === UP.ok;
  body = `<div class="fc-q">${esc(u.q)}</div><div class="fc-opts">${UP.order.map((k) => {
    const cls = !done ? '' : k === UP.ok ? 'good' : k === S.g3 ? 'bad' : 'dim';
    return `<button class="fc-opt ${cls}" data-act="g3" data-k="${k}"${done ? ' disabled' : ''}>${esc(u.opts[k])}</button>`;
  }).join('')}</div>`;
  if (done) {
    body += `<div class="fc-fb ${ok ? 'good' : 'bad'}">${esc(ok ? u.right : u.wrong)}<p>${esc(u.why[S.g3])}</p></div>
      <div class="fc-slide"><input type="range" class="big" id="upR" min="0" max="100" value="${Math.round(S.t3 * 100)}" aria-label="${esc(u.slider)}" style="--track: linear-gradient(90deg, #2a8fb8, #c9a273, #8d8579)"><div class="fc-tl"><span>${esc(u.from)}</span><span>${esc(u.to)}</span></div></div>
      <button class="fc-go ghost" data-act="replay">${esc(t.replay)}</button>`;

function syncUpState(t) { S.ph = phaseOf(S.t3); renderUpState(t); }
function renderUpState(t) {
