  /* no gauge in this lab */

  .stop { position: absolute; transform: translate(-50%, -50%); min-width: 46px; height: 46px; padding: 0 6px; border-radius: 23px; border: 2px solid var(--stroke2);

const shuffleOrder = () => { let r; do r = shuffled([0, 1, 2, 3, 4, 5]); while (r.every((v, i) => v === i)); return r; };

// --- the mountain: drawing -----------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  // the hedgehog walks along the path from stop to stop
  const d = S.hogTarget - S.hogT, moving = Math.abs(d) > 0.001;
  if (moving) { S.hogT += Math.sign(d) * Math.min(Math.abs(d), dt * 1.8); S.face = d > 0 ? -1 : 1; }
  const i = Math.min(4, Math.floor(S.hogT)), f = S.hogT - i, a = STOP[i], b = STOP[i + 1];
  const hx = lerp(a[0], b[0], f) * w, hy = lerp(a[1], b[1], f) * h - 38 - (moving ? Math.abs(Math.sin(time * 14)) * 5 : 0);
  $('hog').style.transform = `translate(${hx}px, ${hy}px) translate(-50%, -50%) scaleX(${S.face})`;
  if (lab.view !== 'mountain') return;

  const X = (x) => x * w, Y = (y) => y * h;
  const slopeL = (y) => lerp(-.05, .68, (.92 - y) / .84), slopeR = (y) => lerp(1.05, .68, (.92 - y) / .84);
  c.save(); c.globalAlpha = 1; c.lineJoin = 'round'; c.lineCap = 'round';
  // far ridges
  c.fillStyle = 'rgba(70, 85, 140, .35)';
  c.beginPath(); c.moveTo(X(-.05), Y(.92)); c.lineTo(X(.18), Y(.45)); c.lineTo(X(.40), Y(.92)); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(X(.78), Y(.92)); c.lineTo(X(.97), Y(.50)); c.lineTo(X(1.1), Y(.92)); c.closePath(); c.fill();
  // the mountain
  const g = c.createLinearGradient(0, Y(.08), 0, Y(.92));
  g.addColorStop(0, '#5a6a9c'); g.addColorStop(1, '#262e50');
  c.fillStyle = g; c.strokeStyle = 'rgba(190, 205, 255, .35)'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(X(-.05), Y(.92)); c.lineTo(X(.68), Y(.08)); c.lineTo(X(1.05), Y(.92)); c.closePath(); c.fill(); c.stroke();
  // snow on the top
  c.fillStyle = 'rgba(240, 245, 255, .9)';
  c.beginPath(); c.moveTo(X(.68), Y(.08)); c.lineTo(X(slopeR(.2)), Y(.2));
  c.lineTo(X(.74), Y(.17)); c.lineTo(X(.69), Y(.22)); c.lineTo(X(.63), Y(.17)); c.lineTo(X(slopeL(.2)), Y(.2)); c.closePath(); c.fill();
  // ground
  c.fillStyle = '#1b2a22'; c.fillRect(0, Y(.9), w, h - Y(.9));
  c.fillStyle = '#2c4636'; c.fillRect(0, Y(.9), w, 3);
  // the path
  c.setLineDash([1, 10]); c.lineWidth = 5; c.strokeStyle = 'rgba(245, 230, 180, .8)';
  c.beginPath(); STOP.forEach(([x, y], k) => (k ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y)))); c.stroke(); c.setLineDash([]);
  // the flag on the peak
  const fx = X(STOP[4][0]), fy = Y(STOP[4][1]) - 25, pole = Math.min(26, fy - 4);
  c.strokeStyle = '#EDEFF7'; c.lineWidth = 2; c.beginPath(); c.moveTo(fx, fy); c.lineTo(fx, fy - pole); c.stroke();
  c.fillStyle = '#FF3B30'; c.beginPath(); c.moveTo(fx, fy - pole); c.lineTo(fx + 15, fy - pole + 5); c.lineTo(fx, fy - pole + 10); c.closePath(); c.fill();
  // a few trees
  c.fillStyle = '#fff'; c.font = '18px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const [x, e] of [[.30, '🌲'], [.40, '🌲'], [.52, '🌲'], [.76, '🌲'], [.03, '🌲']]) c.fillText(e, X(x), Y(.955));
  c.restore();
});

// --- the mountain: story, stops and cards --------------------------------------------------------------------
const sceneText = (i) => (S.sec === 'ending' && S.climax !== null && i >= 4 ? T[lang].sec.alt[S.climax][i - 4] : T[lang].scenes[i]);
const sceneEmo = (i) => (S.sec === 'ending' && S.climax !== null && i >= 4 ? ALT_EMO[S.climax][i - 4] : SCENE_EMO[i]);
const minePics = () => { const hero = HERO_E[S.mine[0]]; return [[hero, PLACE_E[S.mine[1]]], [hero, PROB_E[S.mine[2]]], [hero, '🔁'], [hero, '😰'], [hero, '🤝'], [hero, '😊']]; };
const mineLines = () => { const t = T[lang].sec, [h, p, pr] = S.mine, fem = !!t.heroesFem?.[h]; return t.tpl(t.heroes[h], t.places[p], fem ? t.problemsFem[pr] : t.problems[pr], fem); };

function stopView(i) {
  if (S.sec === 'ending') return { emo: sceneEmo(i), cls: 'full' };
  if (S.sec === 'mine') return { emo: minePics()[i], cls: 'full' };
  if (S.checked) return S.disp[i] === null || S.disp[i] === undefined ? { emo: null, cls: '' } : { emo: SCENE_EMO[S.disp[i]], cls: 'full ok' };
  const c = S.slots[i];
  return c === null ? { emo: null, cls: S.selCard !== null ? 'want' : S.selStop === i ? 'sel' : '' } : { emo: SCENE_EMO[c], cls: 'full' };
}
const emoHtml = (e) => `<span class="em">${e.map((x) => `<span>${x}</span>`).join('')}</span>`;

function stopAll() { // stop every running animation and show the finished state
  clearTimeout(S.tm); S.run++; $('flies').innerHTML = '';
  S.reading = false; S.lit = -1;
  if (S.anim) { S.anim = false; S.disp = [0, 1, 2, 3, 4, 5]; }
}
function walk(order, ms, onStep) { // the hedgehog visits the stops; each one lights up in turn
  stopAll(); S.hogT = S.hogTarget = 0; S.reading = true; S.focus = null;
  let k = 0;
  const step = () => {
    if (k >= order.length) { S.reading = false; S.lit = -1; render(); return; }
    const i = order[k++];
    S.lit = i; S.hogTarget = i; sfx.tick(); onStep?.(i); render();
    S.tm = setTimeout(step, ms);
  };
  step();
}

function doCheck() {
  S.checked = true; S.focus = null; S.selCard = S.selStop = null; S.anim = true;
  S.disp = S.slots.slice();
  const wrong = [];
  S.slots.forEach((c, i) => { if (c !== i) wrong.push({ c, from: i }); });
  S.k = 6 - wrong.length;
  wrong.forEach((m) => { S.disp[m.from] = null; });
  wrong.sort((p, q) => p.c - q.c);
  const run = ++S.run, fl = $('flies');
  const els = wrong.map((m) => {
    const el = document.createElement('div');
    el.className = 'fly bad'; el.innerHTML = emoHtml(SCENE_EMO[m.c]);
    el.style.left = `${STOP[m.from][0] * 100}%`; el.style.top = `${STOP[m.from][1] * 100}%`;
    fl.append(el); return el;
  });
  S.k === 6 ? sfx.good() : sfx.bad();
  render(); showStage();
  wrong.forEach((m, n) => {
    const t0 = 700 + n * 800;
    setTimeout(() => { if (run !== S.run) return; els[n].style.left = `${STOP[m.c][0] * 100}%`; els[n].style.top = `${STOP[m.c][1] * 100}%`; sfx.push(); }, t0);
    setTimeout(() => { if (run !== S.run) return; els[n].remove(); S.disp[m.c] = m.c; sfx.snap(); render(); }, t0 + 650);
  });
  setTimeout(() => { if (run !== S.run) return; S.anim = false; render(); }, 700 + wrong.length * 800 + 100);
}
function resetPuzzle() {
  stopAll();
  Object.assign(S, { order: shuffleOrder(), slots: Array(6).fill(null), selCard: null, selStop: null, checked: false, disp: [], focus: null, hogT: 0, hogTarget: 0 });
}
function readStep(i) { S.focus = i; }

$('vMountain').addEventListener('click', (ev) => {

});

$('secBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-r]'); if (!b) return;
  const r = +b.dataset.r, j = +b.dataset.j; sfx.click();
  if (S.sec === 'ending') { S.climax = j; walk([0, 1, 2, 3, 4, 5], 2600); }
  else { S.mine[r] = j; S.focus = null; render(); }
});

function renderMountain(t) {
  const sec = S.sec, puzzle = !sec, placed = S.slots.filter((c) => c !== null).length;
  lab.setGlow('rgba(127, 176, 105, .22)');
  // stops
  $('stops').innerHTML = STOP.map(([x, y], i) => {
    const v = stopView(i), lit = i === S.lit ? ' lit' : (sec || S.checked) && S.focus === i && !S.reading ? ' lit' : '';
    return `<button class="stop ${v.cls}${lit}" data-i="${i}" style="left:${x * 100}%;top:${y * 100}%" aria-label="${i + 1}. ${esc(t.stages[i])}">
      <span class="n">${i + 1}</span>${v.emo ? emoHtml(v.emo) : ''}<span class="lb ${i < 4 ? 'L' : i === 4 ? 'C' : 'R'}">${esc(t.stages[i])}</span></button>`;
  }).join('');
  // tray with the scenes that are still waiting
  const showTray = puzzle && !S.checked;
  $('mHint').style.display = showTray ? '' : 'none'; $('mHint').textContent = t.m.tray;
  const tray = $('tray'), sl = tray.scrollLeft;
  tray.style.display = showTray ? '' : 'none';
  tray.innerHTML = S.order.filter((id) => !S.slots.includes(id)).map((id) =>
    `<button class="scard ${S.selCard === id ? 'sel' : ''}" data-c="${id}"><div class="pic">${SCENE_EMO[id].map((e) => `<span>${e}</span>`).join('')}</div><p>${esc(plain(t.scenes[id]))}</p></button>`).join('');
  tray.scrollLeft = sl;
  // buttons
  const main = $('mMain');
  main.textContent = puzzle && !S.checked ? t.m.check : t.m.read;
  main.disabled = puzzle ? (!S.checked ? placed < 6 : S.anim || S.reading) : S.reading;
  main.style.display = puzzle && !S.checked && placed < 6 ? 'none' : '';
  $('mAgain').style.display = puzzle && S.checked ? '' : 'none'; $('mAgain').textContent = t.again;
  // secret rows
  const row = (r, lbl, items) => `<div class="row2"><span class="rowlbl">${esc(lbl)}</span><div class="chips">${items.map((x, j) =>
    `<button class="chip ${j === (r === 9 ? S.climax : S.mine[r]) ? 'cur' : ''}" data-r="${r}" data-j="${j}">${esc(x)}</button>`).join('')}</div></div>`;
  const tt = t.sec;
  $('secBody').innerHTML = sec === 'ending' ? row(9, t.stages[4], tt.climaxes)
    : sec === 'mine' ? row(0, tt.rows[0], tt.heroes.map((x, j) => `${HERO_E[j]} ${x}`)) + row(1, tt.rows[1], tt.places.map((x, j) => `${PLACE_E[j]} ${x}`))
      + row(2, tt.rows[2], tt.problems.map((x, j) => `${PROB_E[j]} ${x}`)) : '';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('ending', '🔀') + sc('mine', '✍️');
  // readout
  if (sec) lab.setReadout(sec === 'ending' ? '🔀' : '✍️', t.secrets[sec][0], '', '#7fb069');
  else if (!S.checked) lab.setReadout(`${placed}/6`, '', '', '#7fb069');
  else lab.setReadout(`${S.k}/6`, t.m.score(S.k), S.k === 6 && !S.anim ? t.right : '', '#7fb069');
  // state card
  const fine = `<div class="fine">${esc(t.fine)}</div>`;
  const fi = S.reading ? S.lit : S.focus;
  if (fi !== null && fi >= 0 && (sec || S.checked) && !(sec === 'mine')) {
    lab.setState({ emo: sceneEmo(fi).join(''), title: `${fi + 1}. ${cap(t.stages[fi])}`, lead: t.m.meaning[fi], body: plain(sceneText(fi)), extra: fine });
  } else if (sec === 'ending') {
    const k = S.climax;
    lab.setState({ emo: '🔀', title: t.secrets.ending[0], lead: k === null ? t.secrets.ending[1] : t.sec.endText, body: k === null ? '' : `${t.sec.alt[k][0]} ${t.sec.alt[k][1]}`, extra: fine });
  } else if (sec === 'mine') {
    const on = fi !== null && fi >= 0 ? LINE_OF[fi] : -1;
    const lines = mineLines();
    lab.setState({ emo: '✍️', title: t.secrets.mine[0], lead: t.secrets.mine[1], body: '',
      extra: `<ol class="lines">${lines.map((l, n) => `<li class="${n === on ? 'on' : ''}"><b>${esc(t.stages[LINE_STAGE[n]])}:</b> ${esc(l)}</li>`).join('')}</ol>${fine}` });
  } else {
    const [emo, title, lead, body] = t.st.mountain;
    lab.setState({ emo, title, lead, body, extra: fine });
  }
}

// --- who, where, what -----------------------------------------------------------------------------------------
// move chips with a short slide (FLIP): measure, change the page, then play from the old place to the new one
function flip(change, stagger) {
  const root = $('vParts'), before = new Map([...root.querySelectorAll('[data-chip]')].map((e) => [e.dataset.chip, e.getBoundingClientRect()]));
  change();
  let n = 0;
  root.querySelectorAll('[data-chip]').forEach((e) => {
    const o = before.get(e.dataset.chip), r = e.getBoundingClientRect();
    if (!o || (Math.abs(o.left - r.left) < 1 && Math.abs(o.top - r.top) < 1)) return;
    e.style.transition = 'none'; e.style.transform = `translate(${o.left - r.left}px, ${o.top - r.top}px)`; e.style.position = 'relative'; e.style.zIndex = 4;
    const delay = n++ * stagger;
    void e.offsetWidth;
    e.style.transition = `transform .7s ease-in-out ${delay}s`; e.style.transform = '';
    setTimeout(() => { e.style.transition = ''; e.style.position = ''; e.style.zIndex = ''; }, 800 + delay * 1000);
  });
}
$('vParts').addEventListener('click', (ev) => {
  const P = S.p, ch = ev.target.closest('[data-chip]'), bx = ev.target.closest('[data-box]'), msg = ev.target.closest('[data-msg]');
  if (msg) {
    if (P.ans !== null) return;
    P.ans = +msg.dataset.msg; (P.ans === 1 ? sfx.good : sfx.bad)(); render(); return;
  }
  if (P.checked) return;
  if (ch && P.place[ch.dataset.chip] === undefined) { P.sel = P.sel === ch.dataset.chip ? null : ch.dataset.chip; sfx.tick(); render(); return; }
  if (bx && P.sel) { P.place[P.sel] = +bx.dataset.box; P.sel = null; sfx.snap(); render(); return; }
  if (ch) { delete P.place[ch.dataset.chip]; sfx.click(); render(); }
});
$('pMain').onclick = () => {
  const P = S.p;
  if (P.checked) { S.p = newParts(); sfx.click(); render(); return; }
  if (CHIPS.some((id) => P.place[id] === undefined)) return;
  P.checked = true; P.sel = null; P.k = CHIPS.filter((id) => P.place[id] === BOX[id]).length;
  P.k === CHIPS.length ? sfx.good() : sfx.bad();
  flip(() => { CHIPS.forEach((id) => { if (P.place[id] !== BOX[id]) P.moved.add(id); P.place[id] = BOX[id]; }); render(); }, .25);
  showStage(true);
};

function renderParts(t) {
  const P = S.p, n = CHIPS.filter((id) => P.place[id] !== undefined).length;
  lab.setGlow('rgba(224, 176, 80, .22)');
  const chip = (id) => `<button class="pchip ${P.checked ? 'ok' : ''} ${P.moved.has(id) ? 'moved' : ''} ${P.sel === id ? 'sel' : ''}" data-chip="${id}">${esc(t.p.chips[id])}</button>`;
  const pool = P.pool.filter((id) => P.place[id] === undefined);
  const boxes = [0, 1, 2].map((b) => `<div class="pbox ${P.sel && !P.checked ? 'want' : ''}" data-box="${b}"><h4>${esc(t.p.boxes[b])}</h4>
    <div class="pin">${(P.checked ? CHIPS : P.pool).filter((id) => P.place[id] === b).map(chip).join('')}</div></div>`).join('');
  let after = '';
  if (P.checked) {
    const ans = P.ans;
    after = `<p class="why">${esc(t.p.why)}</p><div class="fq">${esc(t.p.q2)}</div><div class="fopts">${P.msgs.map((o) =>
      `<button class="fo ${ans !== null ? (o === 1 ? 'good' : o === ans ? 'bad' : '') : ''}" data-msg="${o}"${ans !== null ? ' disabled' : ''}>${esc(t.p.msgs[o])}</button>`).join('')}</div>`;
  }
  $('vParts').innerHTML = `${P.checked ? '' : `<div class="pool">${pool.map(chip).join('')}</div>`}<div class="pboxes">${boxes}</div>${after}`;
  $('pMain').textContent = P.checked ? t.again : t.p.check;
  $('pMain').disabled = !P.checked && n < CHIPS.length;
  lab.setReadout(P.checked ? `${P.k}/${CHIPS.length}` : `${n}/${CHIPS.length}`, '', P.checked && P.ans !== null ? (P.ans === 1 ? t.right : t.wrong) : '', '#e0b050');
  const [emo, title, lead, body] = t.st.parts;
  lab.setState({ emo, title, lead, body, extra: `<div class="fine">${esc(t.fine)}</div>` });
}

// --- feelings -------------------------------------------------------------------------------------------------
// split a scene into words; words inside [[ ]] belong to an evidence phrase (g = its number, -1 for the rest)
function tokens(text) {
  const out = []; let g = -1, prevTrail = false;
  text.split(/(\[\[.*?\]\])/).forEach((part) => {
    if (!part) return;
    const ev = part.startsWith('[['); if (ev) g++;
    const s = ev ? part.slice(2, -2) : part, lead = /^\s/.test(s);
    s.split(/\s+/).filter(Boolean).forEach((w, j) => out.push({ w, g: ev ? g : -1, sp: out.length > 0 && (j > 0 || lead || prevTrail) }));
    prevTrail = /\s$/.test(s);
  });
  return out;
}
$('vFeel').addEventListener('click', (ev) => {
  const F = S.f, o = ev.target.closest('[data-o]'), w = ev.target.closest('.w.tap');
  if (o && F.pick === null) {
    F.pick = +o.dataset.o; F.right[F.i] = F.pick === FEEL_OK[F.i]; F.phase = 'find';
    (F.right[F.i] ? sfx.good : sfx.bad)(); render(); return;
  }
  if (!w || F.phase !== 'find') return;
  const g = +w.dataset.g, groups = Math.max(...tokens(T[lang].scenes[FEEL_SCENE[F.i]]).map((x) => x.g)) + 1;
  if (g >= 0) {
    if (F.found.has(g)) return;
    F.found.add(g); sfx.good();
    if (F.found.size >= groups) F.phase = 'done';
    render();
  } else {
    F.wrong++; sfx.bad();
    if (F.wrong >= 2) { for (let q = 0; q < groups; q++) F.found.add(q); F.phase = 'done'; render(); }
    else { w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake'); }
  }
});
$('fMain').onclick = () => {
  const F = S.f; sfx.click();
  if (F.i >= 3) S.f = newFeel();
  else if (F.phase === 'done') Object.assign(F, { i: F.i + 1, pick: null, phase: 'q', wrong: 0, found: new Set() });
  render(); if (S.f.i < 3) showStage(true);
};

function renderFeel(t) {
  const F = S.f, i = F.i, end = i >= 3, k = F.right.filter(Boolean).length;
  lab.setGlow('rgba(143, 127, 208, .24)');
  const dots = [0, 1, 2].map((q) => (q < i ? '●' : q === i ? '◉' : '○')).join(' ');
  $('fMain').style.display = end || F.phase === 'done' ? '' : 'none';
  $('fMain').textContent = end ? t.again : t.next;
  const [emo, title, lead, body] = t.st.feelings, fine = `<div class="fine">${esc(t.fine)}</div>`;
  lab.setState({ emo, title, lead, body, extra: fine });
  if (end) {
    lab.setReadout(`${k}/3`, dots, k === 3 ? t.right : '', '#8f7fd0');
    $('vFeel').innerHTML = `<div class="sum">${[0, 1, 2].map((q) => `<div class="sumrow ${F.right[q] ? 'good' : 'bad'}"><span>${SCENE_EMO[FEEL_SCENE[q]].join('')}</span><span>${t.f.opts[q][FEEL_OK[q]].split(' ')[0]}</span><span class="mk">${F.right[q] ? '✓' : '✗'}</span></div>`).join('')}</div>`;
    return;
  }
  lab.setReadout(`${i + 1}/3`, dots, '', '#8f7fd0');
  const sc = FEEL_SCENE[i], words = tokens(t.scenes[sc]);
  const text = words.map((x, n) => `${x.sp ? ' ' : ''}<span class="w ${F.phase === 'q' ? '' : 'tap'} ${x.g >= 0 && F.found.has(x.g) ? 'ev' : ''}" data-g="${x.g}" data-n="${n}">${esc(x.w)}</span>`).join('');
  const opts = t.f.opts[i].map((o, j) => `<button class="fo ${F.pick === null ? '' : j === FEEL_OK[i] ? 'good' : j === F.pick ? 'bad' : ''}" data-o="${j}"${F.pick !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = F.pick === null ? '' : `<div class="verdict ${F.right[i] ? 'good' : 'bad'}">${esc(F.right[i] ? t.right : t.wrong)}</div>`;
  const find = F.phase === 'q' ? '' : `<div class="fprompt">${esc(F.phase === 'done' ? t.f.found : t.f.find)}</div>${F.phase === 'done' && i === 0 ? `<div class="fnote">${esc(t.f.story)}</div>` : ''}`;
  $('vFeel').innerHTML = `<div class="fcard"><div class="fpic">${SCENE_EMO[sc].map((e) => `<span>${e}</span>`).join('')}</div><p class="ftext">${text}</p></div>
    <div class="fq">${esc(t.f.q(i))}</div><div class="fopts">${opts}</div>${verdict}${find}`;
}

// --- one render per change ------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('vMountain').style.display = v === 'mountain' ? '' : 'none';
  $('vParts').style.display = v === 'parts' ? '' : 'none';
  $('vFeel').style.display = v === 'feelings' ? '' : 'none';
  $('vMC').style.display = v === 'mountain' ? '' : 'none';
  $('vPC').style.display = v === 'parts' ? '' : 'none';
  $('vFC').style.display = v === 'feelings' ? '' : 'none';
  if (v === 'mountain') renderMountain(t); else if (v === 'parts') renderParts(t); else renderFeel(t);
}
render();
</script>
