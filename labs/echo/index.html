function newFeed(seed) {
  const r = rng(seed * 7919 + 13), f = S.f;
  const rep = new Set([...shuffle([0, 1, 2, 3, 4, 5], r).slice(0, 3), ...shuffle([6, 7, 8, 9, 10, 11], r).slice(0, 3)]);
  let list = [];
  for (let c = 0; c < 12; c++) for (let v = 0; v < (rep.has(c) ? 3 : 1); v++) list.push({ c, v });
  for (let tries = 0; tries < 400; tries++) {
    shuffle(list, r);
    if (list.every((p, i) => !list.slice(Math.max(0, i - 2), i).some((q) => q.c === p.c))) break;
  }
  const names = shuffle(NAMES.slice(), r);
  list = list.map((p, i) => ({ ...p, name: names[i % names.length], av: (i * 3 + Math.floor(r() * 8)) % 8, likes: 3 + Math.floor(r() * 40), shares: Math.floor(r() * 9) }));
  Object.assign(f, { seed, rep, list, order: shuffle([...Array(12).keys()], r), phase: 'scroll', idx: 0, pos: 0, last: performance.now() / 1000, playing: true, ratings: new Array(12).fill(0), ri: 0, revT: 0 });
}

const NN = 40, STEPS = 26;
const NET = (() => {
  const r = rng(77), pts = [];
  for (let tries = 0; pts.length < NN && tries < 4000; tries++) {
    const p = [0.05 + r() * 0.9, 0.06 + r() * 0.88];
    if (pts.every((q) => Math.hypot(p[0] - q[0], p[1] - q[1]) > 0.115)) pts.push(p);
  }
  while (pts.length < NN) pts.push([r(), r()]);
  const adj = pts.map(() => new Set());
  pts.forEach((p, i) => {
    pts.map((q, j) => [Math.hypot(p[0] - q[0], p[1] - q[1]), j]).filter((x) => x[1] !== i).sort((a, b) => a[0] - b[0]).slice(0, 3).forEach(([, j]) => { adj[i].add(j); adj[j].add(i); });
  });
  const comp = pts.map((_, i) => i), find = (x) => (comp[x] === x ? x : (comp[x] = find(comp[x])));
  adj.forEach((s, i) => s.forEach((j) => { comp[find(i)] = find(j); }));
  for (let guard = 0; guard < 40; guard++) {
    let best = null;
    for (let i = 0; i < NN; i++) for (let j = i + 1; j < NN; j++) if (find(i) !== find(j)) { const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]); if (!best || d < best[0]) best = [d, i, j]; }
    if (!best) break;
    adj[best[1]].add(best[2]); adj[best[2]].add(best[1]); comp[find(best[1])] = find(best[2]);
  }
  return { pts, adj: adj.map((s) => [...s]) };
})();
function simulate(seed, delay, pC, style) {

  let newR = [Math.floor(r() * NN)], newC = [], gave = 0;
  st[newR[0]] |= 1;
  const frames = [st.slice()], R = [1], C = [0];
  for (let t = 1; t < STEPS; t++) {
    const nextR = [], nextC = [], snap = st.slice();
    for (const u of newR) {
      const nb = shuffle(NET.adj[u].slice(), r).slice(0, 2);
      for (const v of nb) if (r() < 0.7 && !(snap[v] & 1) && !(snap[v] & 2)) { if (!(st[v] & 1)) { st[v] |= 1; nextR.push(v); } }
    }
    for (const u of newC) {
      const nb = shuffle(NET.adj[u].slice(), r).slice(0, 2);
      for (const v of nb) if (r() < pC && !(st[v] & 2)) {
        st[v] |= 2; nextC.push(v);
        if (style === 1 && !(snap[v] & 1)) { st[v] |= 1; gave++; nextR.push(v); }
      }
    }
    if (t === delay) { const s0 = Math.floor(r() * NN); if (!(st[s0] & 2)) { st[s0] |= 2; nextC.push(s0); if (style === 1 && !(st[s0] & 1)) { st[s0] |= 1; gave++; nextR.push(s0); } } }
    newR = nextR; newC = nextC;
    frames.push(st.slice());
    R.push(st.reduce((n, x) => n + (x & 1 ? 1 : 0), 0)); C.push(st.reduce((n, x) => n + (x & 2 ? 1 : 0), 0));
  }
  const rF = Math.round((R[STEPS - 1] / NN) * 100), cF = Math.round((C[STEPS - 1] / NN) * 100);
  return { frames, R, C, delay, rF, cF, caught: C[STEPS - 1] >= R[STEPS - 1], gave, start: frames[0].findIndex((x) => x & 1) };
}

function clearSim() { const r = S.r; r.sim = null; r.t = 0; r.done = false; }
$('trSl').addEventListener('input', () => { S.t.guess = +$('trSl').value; $('trV').textContent = S.t.guess; render(); });
$('trGo').onclick = () => { const t = S.t; if (t.go || t.guess === null) return; t.go = true; t.prog = 0; sfx.push(); render(); };
$('trAgain').onclick = () => { const t = S.t; t.round++; t.seed++; newRound(); $('trSl').value = 10; $('trV').textContent = '?'; sfx.click(); render(); };
$('rcD').addEventListener('input', () => { S.r.delay = +$('rcD').value; clearSim(); render(); });
$('rcP').addEventListener('input', () => { S.r.catchy = +$('rcP').value; clearSim(); render(); });
$('rcRun').onclick = () => {
  const r = S.r; if (r.pred === null) return;
  r.seed++; r.sim = simulate(r.seed, r.delay, r.catchy / 100, r.style); r.t = 0; r.done = false; sfx.push(); render();
};
function openSecret(k) { S.sec = k; S.quoteAns = false; if (k === 'own') { S.own = { i: 0, pick: [], opts: [], done: false }; } sfx.click(); render(); }

function renderSecrets() {
  const t = T[lang], open = secret.unlocked();
  $('ecSecs').innerHTML = [['quote', '💬'], ['own', '📣']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
}
function renderOverlay() {
  const t = T[lang];
  ov.style.display = S.sec ? '' : 'none';
  if (!S.sec) return;
  if (S.sec === 'quote') {
    const q = t.quote;
    ov.innerHTML = `<h3>${esc(q.title)}</h3><div class="ec-quote">“${esc(q.text)}”<small>${esc(q.sub)}</small></div>
      <p><b>${esc(q.ask)}</b></p><div class="ec-opts">${q.who.map((w, i) => `<button data-q="${i}" ${S.quoteAns ? 'disabled' : ''}>${esc(w)}</button>`).join('')}</div>
      ${S.quoteAns ? `<p>${esc(q.ans)}</p>` : ''}<button class="btn ghost" data-close="1" style="align-self:flex-start">${esc(q.back)}</button>`;
  } else {
    const o = t.own, f = S.f, ow = S.own;
    let falses = [...Array(12).keys()].filter((c) => !TRUTH[c]);
    const rated = f.ratings.every((x) => x > 0);
    falses = rated ? falses.sort((a, b) => f.ratings[b] - f.ratings[a] || f.seed % 3 - 1).slice(0, 3) : falses.slice(0, 3);
    if (ow.i >= 3 || ow.done) { ov.innerHTML = `<h3>${esc(o.title)}</h3><p>${esc(o.done)}</p><button class="btn ghost" data-close="1" style="align-self:flex-start">${esc(o.back)}</button>`; return; }
    const claim = falses[ow.i], base = [{ k: 0, txt: t.claims[claim][1] }, { k: 1, txt: o.myth(t.claims[claim][0]) }, { k: 2, txt: o.bare }];
    if (!ow.opts[ow.i]) ow.opts[ow.i] = shuffle(base, rng(claim * 13 + f.seed));
    const picked = ow.pick[ow.i];
    ov.innerHTML = `<h3>${esc(o.title)} · ${esc(o.n(ow.i + 1, 3))}</h3>${rated ? '' : `<p style="color:var(--mut);font-size:12.5px">${esc(o.note)}</p>`}
      <div class="ec-quote">“${esc(t.claims[claim][0])}”</div>
      <div class="ec-opts">${ow.opts[ow.i].map((x, j) => `<button data-o="${j}" class="${picked === undefined ? '' : x.k === 0 ? 'good' : picked === j ? 'bad' : ''}" ${picked === undefined ? '' : 'disabled'}>${esc(x.txt)}</button>`).join('')}</div>
      ${picked === undefined ? `<p>${esc(o.lead)}</p>` : `<p><b>${esc(ow.opts[ow.i][picked].k === 0 ? o.good : o.bad)}</b></p><button class="btn" data-nx="1" style="align-self:flex-start">${esc(o.next)}</button>`}
      <button class="btn ghost" data-close="1" style="align-self:flex-start">${esc(o.back)}</button>`;
  }
}
ov.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.close) { S.sec = null; sfx.click(); }
  else if (b.dataset.q !== undefined) { S.quoteAns = true; sfx.click(); }
  else if (b.dataset.o !== undefined) { const ow = S.own; ow.pick[ow.i] = +b.dataset.o; (ow.opts[ow.i][+b.dataset.o].k === 0 ? sfx.good : sfx.bad)(); }
  else if (b.dataset.nx) { S.own.i++; sfx.click(); }
  render();
});

// --- render --------------------------------------------------------------------------------------------------
function render() {
  document.body.dataset.v = S.sec || lab.view; // the layout follows the view (see the CSS)
  const t = T[lang], v = lab.view;
  $('ecFeed').style.display = v === 'feed' ? '' : 'none';
  $('ecTrace').style.display = v === 'trace' ? '' : 'none';
  $('ecRace').style.display = v === 'race' ? '' : 'none';
  lab.setGlow('rgba(124, 92, 255, .28)');
  renderSecrets(); renderOverlay();
  if (v === 'feed') renderFeed(t); else if (v === 'trace') renderTrace(t); else renderRace(t);
}
function renderFeed(t) {
  const f = S.f, ft = t.feed;
  lab.setFacts(t.facts.feed);
  if (f.phase === 'scroll') {
    const last = f.idx === f.list.length - 1;
    $('ecFeed').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn" data-act="next">${esc(last ? ft.last : ft.next)}</button><button class="chip" data-act="play">${esc(f.playing ? ft.pause : ft.play)}</button></div>`;
    lab.setReadout(`${f.idx + 1}/${f.list.length}`, ft.postN(f.idx + 1, f.list.length), '', '#9a8cff');
    lab.setState({ emo: '📱', title: ft.sTitle, lead: ft.sLead, body: '', extra: '' });
  } else if (f.phase === 'rate') {
    const cols = ['#ef7f8e', '#f2a07a', '#e8d27a', '#a6d98a', '#5fd1a0'];
    $('ecFeed').innerHTML = `<div class="ec-q">${esc(ft.rQ)}</div><div class="ec-rate">${[1, 2, 3, 4, 5].map((n) => `<button data-act="rate" data-v="${n}" style="background:${cols[n - 1]}" aria-label="${n}">${n}</button>`).join('')}</div>
      <div class="ec-cap"><span>${esc(ft.lo)}</span><span>${esc(ft.hi)}</span></div>`;
    lab.setReadout('?', ft.rateN(f.ri + 1, 12), '', '#9a8cff');
    lab.setState({ emo: '🤔', title: ft.rTitle, lead: ft.rLead, body: '', extra: '' });
  } else {
    const a = avgRep(), b = avgOnce();
    $('ecFeed').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn" data-act="newfeed">${esc(ft.again)}</button></div>` +
      [...Array(12).keys()].map((c) => `<div class="ec-row"><div class="h"><span class="${TRUTH[c] ? 'ok' : 'no'}">${TRUTH[c] ? '✓' : '✗'}</span><span>${esc(t.claims[c][0])}</span></div>
        <div class="w"><b>${esc(TRUTH[c] ? ft.t : ft.f)}.</b> ${esc(t.claims[c][1])}</div>
        <div class="m">${esc(ft.you)}: ${f.ratings[c]} · ${esc(ft.seen(f.rep.has(c) ? 3 : 1))}</div></div>`).join('');
    lab.setReadout(`${num1(a)} · ${num1(b)}`, ft.avg(num1(a), num1(b)), '', '#9a8cff');
    lab.setState({ emo: a > b ? '🔁' : '🤷', title: a > b ? ft.yes : ft.no, lead: ft.vLead, body: '', extra: '' });
  }
}
function renderTrace(t) {
  const tr = t.trace, s = S.t, src = tr.src[s.struct], k = src.length;
  lab.setFacts(t.facts.trace);
  $('trQ').textContent = tr.q; $('trGo').textContent = tr.go; $('trAgain').textContent = tr.round;
  $('trSl').disabled = s.go; $('trGo').disabled = s.go || s.guess === null; $('trAgain').style.display = s.go && s.prog >= 1 ? '' : 'none';
  $('trV').textContent = s.guess === null ? '?' : s.guess;
  $('trLeg').innerHTML = s.go && s.prog >= 1 ? src.map((x, i) => `<span><i style="background:${SRC_COL[i % 5]}"></i>${x[0]} ${esc(x[1])}: ${x[2]}</span>`).join('') : (s.guess === null ? `<span style="border:0;color:var(--mut)">${esc(tr.drag)}</span>` : '');
  if (!s.go) {
    lab.setReadout('?', tr.of, '', '#f5c84c');
    lab.setState({ emo: '🗣️', title: tr.tTitle, lead: tr.tLead, body: '', extra: '' });
  } else {
    const done = s.prog >= 1;
    lab.setReadout(done ? k : '…', tr.of, '', '#f5c84c');
    lab.setState({ emo: done ? '🌳' : '🔎', title: done ? tr.rTitle(k) : tr.tTitle, lead: done ? tr.close(s.guess, k) : tr.rLead, body: done ? tr.rLead : '', extra: '' });
  }
  // sources keep their names in the current language
  if (s.go && s.prog >= 1) $('trLeg').innerHTML = tr.src[s.struct].map((x, i) => `<span><i style="background:${SRC_COL[i % 5]}"></i>${x[0]} ${esc(x[1])}: ${x[2]}</span>`).join('');
}
function renderRace(t) {
  const rc = t.race, r = S.r;
  lab.setFacts(t.facts.race);
  $('rcQ').textContent = rc.q;
  $('rcPred').innerHTML = [[1, rc.yes], [0, rc.no]].map(([val, l]) => `<button class="chip ${r.pred === val ? 'on' : ''}" data-act="pred" data-v="${val}" ${r.sim && !r.done ? 'disabled' : ''}>${esc(l)}</button>`).join('');
  $('rcDL').textContent = rc.d; $('rcDV').textContent = r.delay; $('rcPL').textContent = rc.p; $('rcPV').textContent = `${r.catchy} %`;
  $('rcStyle').innerHTML = rc.style.map((l, i) => `<button class="chip ${r.style === i ? 'on' : ''}" data-act="style" data-v="${i}">${esc(l)}</button>`).join('');
  $('rcRun').textContent = r.sim ? rc.again : rc.run; $('rcRun').disabled = r.pred === null || (r.sim && !r.done);
  if (r.pred === null) $('rcRun').textContent = rc.pickFirst;
  const sim = r.sim;
  if (!sim) { lab.setReadout('?', rc.chart, '', '#ef6b63'); lab.setState({ emo: '📣', title: rc.idle, lead: rc.idleLead, body: '', extra: `<div class="fine" style="font-size:11px;color:var(--faint)">${esc(rc.fine)}</div>` }); }
  else if (!r.done) { lab.setReadout('…', rc.chart, '', '#ef6b63'); lab.setState({ emo: '🏃', title: rc.running, lead: rc.runLead, body: '', extra: '' }); }
  else {
    const ok = r.pred === (sim.caught ? 1 : 0);
    lab.setReadout(`${sim.rF} % · ${sim.cF} %`, rc.key[0] + ' · ' + rc.key[1], '', sim.caught ? '#3ddc97' : '#ef6b63');
    lab.setState({ emo: sim.caught ? '✅' : '🏁', title: `${ok ? rc.rightV : rc.wrongV} ${sim.caught ? rc.won : rc.lost}`, lead: rc.res(sim.rF, sim.cF),
      body: (sim.caught ? rc.tipWon : rc.tipLost) + (r.style === 1 && sim.gave > 0 ? ' ' + rc.myth(sim.gave) : ''), extra: '' });
  }
}
render();
</script>
</body>
</html>
