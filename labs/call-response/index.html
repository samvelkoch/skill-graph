const TOPICS = [{ id: 'sg_art_66', en: 'Improvising Rhythms and Tunes', ru: 'Импровизация ритмов и мелодий', hu: 'Ritmusok és dallamok rögtönzése' }];

// --- music data: C major pentatonic (C D E G A), the home note is C --------------------------------------------
const PITCH = [523.25, 587.33, 659.25, 783.99, 880.0]; // C5 D5 E5 G5 A5
const PCOL = ['#f0b94d', '#a4d36f', '#5cc08f', '#5aa9cc', '#9d92e6'];
const BEAT = 0.55, RQ = [1, 0.5, 0.5, 2], RS = [0, 1, 1.5, 2]; // the rhythm of the question and of every answer, in beats
const QN = [2, 3, 4, 3]; // the question: E G A G, it ends up high on G
const HOME = 0, HIGH = 4;
const PATS = [[0, 2, 4, 6], [0, 2, 3, 6], [0, 1, 2, 4], [0, 3, 4, 6], [0, 1, 4, 5, 6]]; // clap patterns on a grid of 8 eighth-slots
const SLOT = 0.4;
// story scenes: n sounds, base interval in seconds
const SC = [{ n: 6, iv: 0.5 }, { n: 16, iv: 0.12 }, { n: 3, iv: 0.9 }, { n: 6, iv: 0.45 }];
const TF = { slow: 1.6, fast: 0.55 }, VF = { quiet: 0.3, loud: 1 };
const SUN = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
const FACE = [1, -1, -1];
const BCOL = [
  { hi: '#ffb98a', body: '#e07b4f', lo: '#a64a3a', belly: '#f8dcb4', wing: '#b85b3f' },
  { hi: '#9ad8e8', body: '#4fa3b8', lo: '#2f6f89', belly: '#d4edf1', wing: '#37829c' },
  { hi: '#ffe590', body: '#e8c04a', lo: '#b58a2a', belly: '#fff0c0', wing: '#c69a34' },
];

// --- state: ALL of it is declared before shell() and the canvas loop ------------------------------------------
const nowS = () => performance.now() / 1000;
const mkBird = (cx) => ({ cx, vis: 1, sing: 0, hop: 0, flap: 0, tilt: 0, mood: null, moodT: 0 });
const S = {
  echo: { ri: 0, phase: 'idle', taps: [], litAt: [], res: null, won: [], timer: 0 },
  ans: [2, 1, 2], pred: null, rev: false, ver: null, hi: null, busy: false,
  st: { sel: 0, ch: [{ l: null, f: null }, { l: null, f: null }, { l: null, f: null }, { l: null, f: null }], play: false, idx: -1, t0: 0, dur: 1, pulse: 0, flash: 0, done: false },
  sec: null, hey: { taps: [], busy: false, timer: 0, n: 0 }, round: { playing: false },
  leaves: [], bubbles: [], glow: 0, queue: [], autoSnd: false, rounds: 0,
};
const BIRDS = [mkBird(0.28), mkBird(0.72), mkBird(0.5)];
BIRDS[2].vis = 0;
const STARS = (() => { let a = 7; const r = () => (a = (a * 16807) % 2147483647) / 2147483647; return Array.from({ length: 46 }, () => ({ x: -120 + r() * 600, y: -80 + r() * 230, r: 0.5 + r() * 1.2, ph: r() * 6 })); })();
const ease = (u) => (u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u));
const bez = (a, c, b, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * c + u * u * b;
const branchY = (x) => { // the branch: a gentle arch from (-10, 226) to (370, 226)
  if (x < -10) return 226 + 0.19 * (-10 - x);
  if (x > 370) return 226 + 0.19 * (x - 370);
  const t = (x + 10) / 380; return 226 - 72 * t * (1 - t);
};
const COT = { x: 322, y: 292 }; // the little house on the hill
const q0 = RS.map((s, i) => ({ p: QN[i], at: s, dur: RQ[i] }));
const ansNotes = (last) => [...S.ans, last].map((p, i) => ({ p, at: RS[i], dur: RQ[i] }));

// --- timeline: sound is scheduled up front, pictures run from this queue in the canvas loop --------------------
const at = (delay, fn) => S.queue.push({ t: nowS() + delay, fn });
const runQueue = (time) => { for (let i = 0; i < S.queue.length;) { if (S.queue[i].t <= time) { const q = S.queue.splice(i, 1)[0]; q.fn(); } else i++; } };

// --- sound: own small synth (the shell's sfx are for clicks); plays only when the 🔊 button is on ---------------
const A = { ctx: null, bus: null, comp: null, noise: null };
let tapped = false; // sound plays after the child's own tap in this lab, whatever the shell's 🔊 button says
const audioOn = () => tapped;
function newBus() { A.bus = A.ctx.createGain(); A.bus.gain.value = 0.9; A.bus.connect(A.comp); }
function ac() {
  if (!A.ctx) {
    A.ctx = new (window.AudioContext || window.webkitAudioContext)();
    A.comp = A.ctx.createDynamicsCompressor(); A.comp.connect(A.ctx.destination); newBus();
    const n = A.ctx.sampleRate, b = A.ctx.createBuffer(1, n, A.ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    A.noise = b;
  }
  unmuteIOS(); if (A.ctx.state !== 'running') A.ctx.resume().catch(() => {});
  return A.ctx;
}
function silence() {
  if (!A.ctx) return;
  const old = A.bus; old.gain.setTargetAtTime(0, A.ctx.currentTime, 0.02);
  setTimeout(() => { try { old.disconnect(); } catch { /* gone */ } }, 400); newBus();
}
const snd = (fn) => { if (!audioOn()) return; try { const x = ac(); fn(x, x.currentTime + 0.03); } catch { /* no audio: stay silent */ } };
// called inside the child's tap: this lab is about sound, so make and resume our own AudioContext right there (the shell's setting is left alone)
function ensureSound() { tapped = true; try { ac(); } catch { /* no audio: stay silent */ } }
const bell = (f, when = 0, dur = 0.4, vol = 0.14, wave = 'sine') => snd((x, t0) => {
  const t = t0 + when, g = x.createGain(); g.connect(A.bus);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(vol * 0.45, t + Math.max(0.05, dur * 0.6)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.18);
  [[wave, 1, 1], ['triangle', 1, 0.3], ['sine', 2, 0.1]].forEach(([w, m, k]) => {
    const o = x.createOscillator(), gg = x.createGain(); o.type = w; o.frequency.value = f * m; gg.gain.value = k; o.connect(gg).connect(g); o.start(t); o.stop(t + dur + 0.22);
  });
});
const burst = (when, dur, kind, freq, q, vol) => snd((x, t0) => {
  const t = t0 + when, s = x.createBufferSource(), f = x.createBiquadFilter(), g = x.createGain();
  s.buffer = A.noise; f.type = kind; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(A.bus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
});
const thump = (when, vol, f0 = 190, f1 = 60, dur = 0.14) => snd((x, t0) => {
  const t = t0 + when, o = x.createOscillator(), g = x.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.04);
  o.connect(g).connect(A.bus); o.start(t); o.stop(t + dur + 0.08);
});
const clapS = (when, vol) => { burst(when, 0.07, 'bandpass', 1700, 1.2, vol); bell(900, when, 0.05, vol * 0.12, 'triangle'); };
const drumS = (when, vol) => { thump(when, vol, 210, 70, 0.16); burst(when, 0.03, 'highpass', 2500, 0.7, vol * 0.2); };

// --- actions common to all views ------------------------------------------------------------------------------
function setMood(i, m) { BIRDS[i].mood = m; BIRDS[i].moodT = 2.8; }
function cancelPlay() {
  S.queue.length = 0; silence(); S.hi = null; S.busy = false; S.ver = null;
  BIRDS.forEach((b) => { b.mood = null; });
  if (S.echo.phase === 'playing') S.echo.phase = 'idle';
  S.hey.busy = false; S.round.playing = false; S.st.play = false; S.st.idx = -1;
}
function fly(from, to, pi, o = {}) {
  const a = beakPos(from), b = headPos(to);
  S.leaves.push({ t0: nowS(), a, b, up: 26 + pi * 13, dur: o.dur ?? 0.85, col: o.col ?? PCOL[pi], size: o.size ?? 6, end: o.end ?? 'fade', fired: false });
}
function bubble(i, text) { S.bubbles.push({ i, text, t0: nowS() }); }
const beakPos = (i) => { const b = BIRDS[i], x = b.cx * 360; return { x: x + FACE[i] * 35, y: branchY(x) - 51 }; };
const headPos = (i) => { const b = BIRDS[i], x = b.cx * 360; return { x: x + FACE[i] * 16, y: branchY(x) - 58 }; };
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };

// one phrase: bird `who` sings notes to bird `to`; returns the time its last note ends (seconds from now)
function phrase(who, to, notes, o = {}) {
  const { vol = 0.15, startAt = 0, end = 'fade', lane = null, mult = 1 } = o; let last = 0;
  notes.forEach((n, i) => {
    const when = startAt + n.at * BEAT, dur = n.dur * BEAT;
    bell(PITCH[n.p] * mult, when, Math.min(dur * 0.95, 1.4), vol);
    at(when, () => {
      const b = BIRDS[who]; b.sing = 1; b.hop = 1; b.flap = 0.6;
      if (lane) S.hi = { lane, i };
      fly(who, to, n.p, { dur: 0.85, col: PCOL[n.p], size: 5 + Math.min(4, n.dur * 3), end: i === notes.length - 1 ? end : 'fade' });
    });
    last = Math.max(last, when + dur);
  });
  if (lane) at(last, () => { if (S.hi && S.hi.lane === lane) S.hi = null; });
  return last;
}

// --- echo -----------------------------------------------------------------------------------------------------
function echoListen() {
  ensureSound(); cancelPlay();
  const e = S.echo, pat = PATS[e.ri]; clearTimeout(e.timer);
  e.phase = 'playing'; e.taps = []; e.res = null; e.litAt = [];
  pat.forEach((sl) => {
    const when = 0.35 + sl * SLOT; clapS(when, 0.55);
    at(when, () => { e.litAt[sl] = nowS(); const b = BIRDS[0]; b.flap = 1; b.sing = 0.7; b.hop = 0.6; fly(0, 1, 2, { dur: 0.8, col: '#f0b94d', size: 6 }); });
  });
  at(0.35 + pat[pat.length - 1] * SLOT + 0.7, () => { if (e.phase === 'playing') e.phase = 'ready'; render(); });
  render();
}
function drumTap() {
  const e = S.echo; if (e.phase !== 'ready' && e.phase !== 'taps') return;
  ensureSound(); drumS(0, 0.6);
  const b = BIRDS[1]; b.hop = 1; b.flap = 1; b.sing = 0.5; fly(1, 0, 1, { dur: 0.8, col: '#5cc08f', size: 6 });
  e.taps.push(nowS()); e.phase = 'taps'; clearTimeout(e.timer);
  if (e.taps.length >= PATS[e.ri].length) evaluate(); else e.timer = setTimeout(evaluate, 1700);
  render();
}
function evaluate() {
  const e = S.echo; clearTimeout(e.timer); if (e.phase !== 'taps') return;
  const pat = PATS[e.ri], n = e.taps.length, exp = pat.length, span = e.taps[n - 1] - e.taps[0];
  const ref = n >= exp ? pat[exp - 1] - pat[0] : (pat[n - 1] - pat[0]) || 1;
  const slot = n >= 2 && span > 0.05 ? span / ref : SLOT; // the child's own tempo: copy the rhythm, not the speed
  const slots = e.taps.map((t) => clamp(Math.round((t - e.taps[0]) / slot), 0, 7)), bad = [];
  if (n === exp) for (let i = 1; i < n; i++) { const iv = (e.taps[i] - e.taps[i - 1]) / slot; if (Math.abs(iv - (pat[i] - pat[i - 1])) > 0.6) bad.push(i); }
  const ok = n === exp && bad.length === 0;
  e.res = { ok, n, exp, slots, bad }; e.phase = 'done';
  if (ok) e.won[e.ri] = true;
  (ok ? sfx.good : sfx.bad)(); render(); showStage();
}

// --- answer ---------------------------------------------------------------------------------------------------
function hearQuestion() { ensureSound(); cancelPlay(); phrase(0, 1, q0, { lane: 'q' }); render(); }
function hearMine() {
  ensureSound(); cancelPlay();
  phrase(1, 0, ansNotes(0).slice(0, 3), { lane: 'a' }); render();
}
function playVersion(ver) {
  ensureSound(); cancelPlay(); S.busy = true; S.ver = ver;
  const qe = phrase(0, 1, q0, { lane: 'q' }), ae = phrase(1, 0, ansNotes(ver === 'home' ? HOME : HIGH), { lane: 'a', startAt: qe + 0.5, end: ver === 'home' ? 'home' : 'hang' });
  at(ae + 0.15, () => setMood(1, ver === 'home' ? 'rest' : 'wait'));
  at(ae + 1.4, () => { S.busy = false; render(); }); render();
}
function reveal() {
  ensureSound(); cancelPlay(); S.busy = true; S.rev = true; let t0 = 0;
  [['home', HOME], ['high', HIGH]].forEach(([ver, last]) => {
    at(t0, () => { S.ver = ver; setMood(1, null); render(); });
    const qe = phrase(0, 1, q0, { lane: 'q', startAt: t0 }), ae = phrase(1, 0, ansNotes(last), { lane: 'a', startAt: qe + 0.5, end: ver === 'home' ? 'home' : 'hang' });
    at(ae + 0.15, () => setMood(1, ver === 'home' ? 'rest' : 'wait'));
    t0 = ae + 1.9;
  });
  at(t0 - 0.5, () => { S.busy = false; S.ver = null; render(); }); render();
}

// --- story ----------------------------------------------------------------------------------------------------
function storyPlay() {
  ensureSound(); cancelPlay(); const s = S.st; s.play = true; s.done = false; let T0 = 0.2;
  for (let i = 0; i < 4; i++) {
    const ch = s.ch[i], iv = SC[i].iv * (TF[ch.f] ?? 1), vf = VF[ch.l] ?? 0.6, n = SC[i].n, t0 = T0;
    at(t0, () => { s.idx = i; s.sel = i; s.t0 = nowS(); s.dur = n * iv + 0.5; render(); });
    for (let k = 0; k < n; k++) {
      const w = t0 + k * iv;
      if (i === 0) { thump(w, 0.5 * vf + 0.04, 170, 70, 0.1); burst(w, 0.05, 'lowpass', 500, 0.7, 0.18 * vf + 0.02); }
      else if (i === 1) burst(w, 0.04, 'bandpass', 2500 + (k * 733) % 3000, 1.5, 0.2 * vf + 0.02);
      else if (i === 2) { burst(w, 1.3, 'lowpass', 260, 0.7, 0.9 * vf + 0.05); thump(w, 0.6 * vf + 0.04, 70, 38, 0.9); }
      else bell(SUN[k], w, iv * 0.9, 0.18 * vf + 0.03);
      at(w, () => { s.pulse = 1; if (i === 2) s.flash = vf; });
    }
    T0 += n * iv + 0.5;
  }
  at(T0, () => { s.play = false; s.idx = -1; s.done = true; render(); }); render(); showStage();
}

// --- secrets ---------------------------------------------------------------------------------------------------
function heyTap() {
  const h = S.hey; if (h.busy) return;

  h.taps.push(nowS()); h.n++; clearTimeout(h.timer);

}
function heyReply() {
  const h = S.hey; if (!h.taps.length || h.busy) return; h.busy = true; clearTimeout(h.timer);
  const rel = h.taps.map((t) => t - h.taps[0]), base = 0.5;
  rel.forEach((r) => {
    const w = base + r;
    [261.63, 329.63, 392].forEach((f) => bell(f, w, 0.3, 0.09, 'triangle'));
    at(w, () => [1, 2].forEach((i) => { BIRDS[i].sing = 1; BIRDS[i].hop = 1; bubble(i, T[lang].hey.resp); fly(i, 0, 0, { col: '#5cc08f', dur: 0.8, size: 6 }); }));

}

const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
function pillText(c, text, x, y, size = 13) {

  c.beginPath(); c.moveTo(-10, -2); c.bezierCurveTo(-8, -14, 12, -14, 14, -4); c.quadraticCurveTo(26, 0, 25, 4); c.quadraticCurveTo(12, 9, -5, 8); c.quadraticCurveTo(-12, 6, -10, -2); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#fff4e4'; c.beginPath(); c.moveTo(3, 6); c.quadraticCurveTo(14, 8, 24, 4); c.quadraticCurveTo(14, 12, 3, 9); c.closePath(); c.fill();

function drawStory(c, w, h, dt) {
  const s = S.st, sc = s.play ? s.idx : s.sel;
  s.pulse = Math.max(0, s.pulse - dt * 4); s.flash = Math.max(0, s.flash - dt * 3.2);
  const skies = [[[0, '#14123a'], [0.5, '#3a2a68'], [0.8, '#b0587a'], [1, '#f0a06a']], [[0, '#2c3446'], [0.6, '#4b5a70'], [1, '#7a8aa0']], [[0, '#0e0c20'], [0.6, '#241a40'], [1, '#3a2c58']], [[0, '#3a4a8a'], [0.5, '#e9a07a'], [1, '#ffd98a']]];
  sky(c, w, h, skies[Math.max(0, sc)]);
}
function drawStoryBody(c, v, time) {
  const s = S.st, sc = Math.max(0, s.play ? s.idx : s.sel), ch = s.ch[sc] || s.ch[0], tf = 1 / (TF[ch.f] ?? 1), vf = VF[ch.l] ?? 0.6;
  const p = s.play && s.idx >= 0 ? clamp((time - s.t0) / s.dur, 0, 1) : 0.5;
  if (sc === 0) {
    stars(c, time, 0.8); const m = c.createRadialGradient(290, 80, 2, 290, 80, 30); m.addColorStop(0, '#fff6dc'); m.addColorStop(1, 'rgba(255,240,200,0)'); c.fillStyle = m; c.fillRect(250, 40, 80, 80);
    hills(c, v, ['#3a2e5e', '#2a2248', '#241c3e', '#120f26']);
    const x = s.play ? lerp(-10, 330, p) : 120, ph = s.play ? time * 5.5 * tf : 0.6; fox(c, x, 276, ph, s.play);
    c.strokeStyle = 'rgba(30,60,50,.8)'; c.lineWidth = 2; c.lineCap = 'round'; for (let i = 0; i < 18; i++) { const gx = ((i * 61) % 460) - 50, gy = 292 + ((i * 17) % 28); c.beginPath(); c.moveTo(gx, gy); c.quadraticCurveTo(gx + 2, gy - 8, gx + 5 + Math.sin(time + i) * 1.5, gy - 12); c.stroke(); }
  } else if (sc === 1) {
    [[70, 70, 1], [190, 56, 1.2], [300, 76, 0.95]].forEach(([x, y, k]) => cloud(c, x, y, k, '#8896ac', '#5a687e'));
    hills(c, v, ['#4a5a6a', '#364454', '#2b3846', '#1c2632']);
    const n = Math.round(20 + 50 * vf); c.lineCap = 'round'; c.strokeStyle = 'rgba(190,215,255,.7)'; c.lineWidth = 1.6; c.beginPath();
    for (let i = 0; i < n; i++) { const x = ((i * 53.7) % 480) - 60, y = (time * 200 * tf + i * 37.3) % 360 - 20; c.moveTo(x, y); c.lineTo(x - 3, y + 11); }
    c.stroke();
    c.strokeStyle = 'rgba(190,215,255,.5)'; c.lineWidth = 1.2; for (let i = 0; i < 5; i++) { const ph = (time * tf * 1.4 + i * 0.37) % 1; c.globalAlpha = 1 - ph; c.beginPath(); c.ellipse(50 + i * 62, 300 + (i % 2) * 14, 3 + ph * 14, 1.2 + ph * 4, 0, 0, 7); c.stroke(); }
    c.globalAlpha = 1;
  } else if (sc === 2) {
    cloud(c, 130, 70, 1.5, '#3a3358', '#1e1936'); cloud(c, 260, 60, 1.3, '#433a66', '#241e40');
    hills(c, v, ['#2a2248', '#1e1838', '#161230', '#0c0a1c']);
    const a = 0.2 + 0.8 * clamp(s.flash, 0, 1);
    c.save(); c.globalAlpha = a; c.lineJoin = 'round'; c.shadowColor = '#ffe9a0'; c.shadowBlur = 18 * a; c.strokeStyle = '#fff3c4'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(200, 96); c.lineTo(178, 150); c.lineTo(198, 156); c.lineTo(166, 232); c.lineTo(184, 238); c.lineTo(152, 296); c.stroke(); c.restore();
    if (s.flash > 0.05) { c.fillStyle = `rgba(255,245,210,${0.28 * s.flash})`; c.fillRect(v.x0 - 30, v.y0 - 30, v.x1 - v.x0 + 60, v.y1 - v.y0 + 60); }
  } else {
    const rise = s.play ? ease(p) : 0.55, sy = 300 - 150 * rise, sx = 180;
    const gl = c.createRadialGradient(sx, sy, 10, sx, sy, 140); gl.addColorStop(0, 'rgba(255,230,150,.85)'); gl.addColorStop(1, 'rgba(255,200,120,0)'); c.fillStyle = gl; c.fillRect(sx - 150, sy - 150, 300, 300);
    c.save(); c.translate(sx, sy); c.rotate(time * 0.15); c.strokeStyle = 'rgba(255,236,170,.65)'; c.lineWidth = 3; c.lineCap = 'round';
    for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, r1 = 40, r2 = 52 + 8 * s.pulse + (i % 2) * 10; c.beginPath(); c.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); c.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); c.stroke(); }
    c.restore();
    const sg = c.createRadialGradient(sx - 8, sy - 8, 3, sx, sy, 36); sg.addColorStop(0, '#fffbe0'); sg.addColorStop(0.6, '#ffd860'); sg.addColorStop(1, '#f0a83a'); c.fillStyle = sg; c.beginPath(); c.arc(sx, sy, 34, 0, 7); c.fill();
    cloud(c, 80 + Math.sin(time * 0.3) * 6, 90, 0.9, '#fff0e0', '#f2c9a8'); cloud(c, 290 - Math.sin(time * 0.3) * 6, 70, 0.8, '#fff0e0', '#f2c9a8');
    hills(c, v, ['#6a8a5a', '#4a6a44', '#3a5a3a', '#25402c']);

  for (let i = 0; i < 4; i++) {
    const x = 20 + i * 82, on = i === sc, st = S.st.ch[i];
    c.fillStyle = on ? 'rgba(10,8,28,.75)' : 'rgba(10,8,28,.45)'; rr(c, x, 10, 74, 40, 14); c.fill(); c.lineWidth = on ? 2 : 1; c.strokeStyle = on ? '#fff' : 'rgba(255,255,255,.2)'; c.stroke();
    c.save(); c.globalAlpha = 1; c.fillStyle = '#fff'; c.font = '24px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(names[i], x + 37, 31); c.restore();
    if (st.l && st.f) { c.fillStyle = '#3ddc97'; c.beginPath(); c.arc(x + 66, 18, 4, 0, 7); c.fill(); }
  }
}
function cloud(c, x, y, k, hi, lo) {
  c.save(); c.translate(x, y); c.scale(k, k);
  const g = c.createLinearGradient(0, -22, 0, 18); g.addColorStop(0, hi); g.addColorStop(1, lo); c.fillStyle = g;
  c.beginPath(); c.moveTo(-50, 14); c.bezierCurveTo(-64, 14, -64, -8, -46, -8); c.bezierCurveTo(-46, -26, -18, -30, -10, -14); c.bezierCurveTo(0, -30, 30, -26, 30, -8); c.bezierCurveTo(52, -10, 62, 12, 44, 14); c.closePath(); c.fill();
  c.restore();
}

let V = { x0: 0, x1: 360, y0: 0, y1: 340 };
canvasLoop($('cv'), (c, w, h, dt, time) => {
  runQueue(time);
  const sc = Math.min(w / 360, h / 340), ox = (w - 360 * sc) / 2, oy = (h - 340 * sc) / 2;
  V = { x0: -ox / sc, x1: 360 + ox / sc, y0: -oy / sc, y1: 340 + oy / sc };
  // birds: smooth positions and poses
  const lay = S.sec ? [0.2, 0.5, 0.8] : [0.28, 0.72, 0.5], k = Math.min(1, dt * 5);
  BIRDS.forEach((b, i) => {
    b.cx += (lay[i] - b.cx) * k; b.vis += (((i < 2 || S.sec) ? 1 : 0) - b.vis) * k;
    b.sing = Math.max(0, b.sing - dt * 3.2); b.hop *= Math.exp(-dt * 7); b.flap = Math.max(0, b.flap - dt * 3.5);
    b.moodT = Math.max(0, b.moodT - dt); if (b.moodT === 0) b.mood = null;
    b.tilt += ((b.mood === 'wait' ? 0.38 : 0) - b.tilt) * Math.min(1, dt * 6);
  });
  S.glow = Math.max(0, S.glow - dt * 0.35);
  const v = lab.view;
  if (v === 'story' && !S.sec) { drawStory(c, w, h, dt); } else sky(c, w, h, [[0, '#14123a'], [0.5, '#3a2a68'], [0.78, '#b0587a'], [1, '#f0a06a']]);
  c.save(); c.translate(ox, oy); c.scale(sc, sc);
  if (v === 'story' && !S.sec) drawStoryBody(c, V, time);
  else {
    drawBirdsView(c, V, time);
    if (!S.sec && v === 'answer') drawRoll(c, time);
    if (!S.sec && v === 'echo') drawDots(c, time);
  }
  c.restore();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  $('secEcho').hidden = !(v === 'echo' && !sec); $('secAns').hidden = !(v === 'answer' && !sec); $('secStory').hidden = !(v === 'story' && !sec);
  $('secHey').hidden = sec !== 'hey'; $('secRound').hidden = sec !== 'round';
  const sc = (k, emo, tk) => `<button type="button" class="chip cr-c secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[tk][0])}` : '🔒 ???'}</button>`;
  $('crSecs').innerHTML = sc('hey', '📣', 'a') + sc('round', '🔁', 'b');
  if (sec === 'hey') renderHey(t); else if (sec === 'round') renderRound(t);
  else if (v === 'echo') renderEcho(t); else if (v === 'answer') renderAnswer(t); else renderStory(t);
  lab.checkStage();
}
function renderEcho(t) {
  const e = S.echo, ph = e.phase, r = e.res, E = t.echo, won = e.won.filter(Boolean).length;
  lab.setGlow('rgba(224, 123, 79, .26)');
  $('crListen').textContent = ph === 'idle' ? E.listen : E.again; $('crListen').disabled = ph === 'playing';
  $('crNext').textContent = E.next; $('crNext').hidden = ph !== 'done';
  const pad = $('crPad'); pad.disabled = !(ph === 'ready' || ph === 'taps');
  pad.textContent = ph === 'ready' || ph === 'taps' ? `🥁 ${E.padGo}` : ph === 'playing' || ph === 'idle' ? `🥁 ${E.padWait}` : `🥁 ${E.pad}`;
  lab.setReadout(ph === 'idle' || ph === 'playing' ? '?' : String(e.taps.length), E.sub(e.taps.length), won ? `✓ ${won}` : '', '#e07b4f');
  let st;
  if (ph === 'idle') st = E.s0; else if (ph === 'playing') st = E.s1; else if (ph === 'ready' || ph === 'taps') st = E.s2;
  else st = r.ok ? ['✅', E.okT, E.okL, ''] : ['🤔', E.badT, r.n !== r.exp ? E.cnt(r.exp, r.n) : E.off, E.retry];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] || '', extra: '' });
  lab.setFacts(t.facts.echo);
}
function renderAnswer(t) {
  const A_ = t.ans, rev = S.rev;
  lab.setGlow('rgba(79, 163, 184, .26)');
  $('crHearQ').textContent = A_.hearQ; $('crHearMine').textContent = A_.hearMine; $('crCap').textContent = A_.cap;
  let gh = '';
  for (let r = 4; r >= 0; r--) {
    gh += `<div class="cr-rail">${r === 0 ? '🏠' : ''}</div>`;
    for (let c = 0; c < 3; c++) gh += `<button type="button" class="cr-cell ${S.ans[c] === r ? 'on' : ''}" style="--c:${PCOL[r]};grid-column:${c + 2};grid-row:${5 - r}" data-act="cell" data-c="${c}" data-p="${r}" aria-label="${c + 1}/${r + 1}"></button>`;
  }
  gh += `<div class="cr-last">?</div>`;
  $('crGrid').innerHTML = gh;
  $('crGrid').querySelectorAll('.cr-rail').forEach((el, i) => { el.style.gridColumn = 1; el.style.gridRow = i + 1; });
  const pk = S.pred;
  $('crPred').innerHTML = `<div class="cr-q">${esc(A_.q)}</div><div class="cr-opts">${[['home', A_.home], ['high', A_.high]].map(([k, l]) => `<button type="button" class="cr-opt ${pk === k ? 'pick' : ''} ${rev && k === 'home' ? 'right' : ''}" data-act="pred" data-k="${k}"${rev ? ' disabled' : ''}>${esc(l)}</button>`).join('')}</div>`;
  $('crAgain').innerHTML = rev ? `<button type="button" class="chip cr-c" data-act="verH">${esc(A_.pH)}</button><button type="button" class="chip cr-c" data-act="verHi">${esc(A_.pHi)}</button><button type="button" class="chip cr-c" data-act="redo">${esc(A_.redo)}</button>` : '';
  lab.setReadout(rev ? '3 + 1' : '3 + ?', A_.sub, '', '#4fa3b8');
  if (!rev) { lab.setState({ emo: A_.s0[0], title: A_.s0[1], lead: A_.s0[2], body: '', extra: '' }); lab.setFacts(t.facts.pent); }
  else {
    const ok = pk === 'home';
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? A_.okT : A_.noT, lead: ok ? A_.okL : A_.noL, body: '', extra: '' });

}
function renderStory(t) {
  const s = S.st, Y = t.story, ch = s.ch[s.sel], planned = s.ch.filter((x) => x.l && x.f).length;
  lab.setGlow('rgba(176, 88, 122, .26)');

  $('crSName').textContent = Y.names[s.sel];
  const seg = (act, a, b) => [a, b].map((k) => `<button type="button" class="${ch[act] === k ? 'on' : ''}" data-act="${act}" data-k="${k}">${esc(Y[k])}</button>`).join('');

function renderHey(t) {

  $('crHeyPad').textContent = `📣 ${H.pad}`; $('crHeyPad').disabled = h.busy;
  lab.setReadout(String(h.n), H.sub(h.n), '', '#f0b94d');
  const st = h.busy ? H.s1 : H.s0; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' }); lab.setFacts([]);

function renderRound(t) {
