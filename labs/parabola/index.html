    c.strokeStyle = 'rgba(111, 224, 242, .6)'; c.lineWidth = 2; c.beginPath(); c.moveTo(X(0), Y(rowv(0))); c.lineTo(X(8), Y(rowv(8))); c.stroke();
    c.save(); glowStroke(c, 'rgba(255,200,87,.6)', 8); c.strokeStyle = 'rgba(255, 224, 138, .85)'; c.lineWidth = 2; c.beginPath();
    for (let v = 0; v <= 8.001; v += 0.02) (v ? c.lineTo : c.moveTo).call(c, X(v), Y(sqv(v)));
    c.stroke(); c.restore();
  }
  for (let m = 1; m <= nMaxKnown('row'); m++) dot(c, X(m), Y(rowv(m)), m === n ? 5.5 : 3.8, GC.cyan[0], '#10142a', 1.3);
  for (let m = 1; m <= nMaxKnown('sq'); m++) dot(c, X(m), Y(sqv(m)), m === n ? 5.5 : 3.8, GC.gold[0], '#10142a', 1.3);
  c.restore();
  c.strokeStyle = 'rgba(210,220,255,.55)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(gx, gy); c.lineTo(gx, gy + gh); c.lineTo(gx + gw, gy + gh); c.stroke();
  c.fillStyle = '#aab3d4'; c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'right';
  for (let v = ystep; v <= S.ym + 0.01; v += ystep) c.fillText(nf(v, 0), gx - 5, Y(v));
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (let v = 1; v <= Math.floor(S.xm); v++) c.fillText(String(v), X(v), gy + gh + 4);
  c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = '#c8d0ee'; c.fillText(t.tiles, 4, gy - 2);
  c.textAlign = 'right'; c.fillText(t.n, w - 6, gy + gh + 12);
  // legend and, in free play, which is the line and which the curve
  const lg = (txt, col, yy) => { dot(c, gx + 12, yy, 4, col, '#10142a', 1); c.textAlign = 'left'; c.fillStyle = '#d9defa'; c.fillText(txt, gx + 22, yy); };
  lg(S.gs === 2 ? `n × n — ${t.curve}` : 'n × n', GC.gold[0], gy + 8); lg(S.gs === 2 ? `2n + 1 — ${t.line}` : '2n + 1', GC.cyan[0], gy + 26);
}

// --- one canvas, three pictures --------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.aAnim) { S.aShow = mix(1, -1, ease(clamp01((time - S.aAt) / 0.9))); if (time - S.aAt >= 0.9) { S.aAnim = false; S.aShow = -1; } }
  else if (S.as === 2) S.aShow = S.a;
  c.lineJoin = 'round';
  if (lab.view === 'throw') drawThrow(c, w, h, dt, time); else if (lab.view === 'abc') drawAbc(c, w, h, dt, time); else drawGrow(c, w, h, dt, time);
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const goView = (v) => { if (lab.view !== v) $('views').querySelector(`[data-view="${v}"]`)?.click(); };
const resetThrow = () => { if (S.tp === 'done') S.ghost = { v: S.v, th: S.th }; S.tp = 'predict'; S.tap = null; S.sel = null; S.gal = false; };
function startThrow() {
  if (S.tp === 'done') { resetThrow(); sfx.click(); return; }
  if (S.tp !== 'predict' || !S.tap) return;
  S.tp = 'fly'; S.t = 0; S.sel = null; sfx.push(); showStage();
}
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), cx = ev.clientX - r.left, cy = ev.clientY - r.top;
  if (lab.view !== 'throw' || !TG) return;
  const wx = (cx - TG.ox) / TG.sc, wy = (TG.oy - cy) / TG.sc;
  if (S.tp === 'predict') { S.tap = { x: clamp(wx, 0, HOOPX - 1), y: clamp(wy, 0, YH) }; sfx.tick(); render(); }
  else if (S.tp === 'done') { const f = flightNow(); S.sel = clamp(Math.round(wx), 0, Math.floor(f.R)); sfx.tick(); render(); }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'go') startThrow();
  else if (act === 'sel') { S.sel = +b.dataset.x; sfx.tick(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (k === 'gal') { goView('throw'); S.gal = !S.gal; if (S.gal && S.tp !== 'done') { S.tp = 'done'; S.t = flightNow().T; S.landAt = now() - 5; } }
    else { goView('abc'); S.dish = !S.dish; if (S.dish) { if (S.as < 2) { S.as = 2; S.a1 = S.a1 ?? 0; S.aAnim = false; S.a = 1; S.b = 0; S.c = 0; } else if (S.a === 0) S.a = 1; } }
    sfx.click();
  } else if (act === 'ab0') {
    if (S.a0 !== null) return;
    S.a0 = b.dataset.k; S.aAnim = true; S.aAt = now(); (S.a0 === 'down' ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'ab1') {
    if (S.a1 !== null) return;
    S.a1 = +b.dataset.i; (S.a1 === Q1_OK ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'abNext') {
    if (S.as === 0) { S.as = 1; S.a = Q1.a; S.b = Q1.b; S.c = Q1.c; } else { S.as = 2; S.a = Q1.a; S.b = Q1.b; S.c = Q1.c; }
    sfx.click();
  } else if (act === 'gr0') { if (S.gq === null) { S.gq = +b.dataset.i; (S.gq === SQ_OK ? sfx.good : sfx.bad)(); } }
  else if (act === 'gr1') { if (S.gr === null) { S.gr = +b.dataset.i; (S.gr === ROW_OK ? sfx.good : sfx.bad)(); } }
  else if (act === 'grNext') { S.gs++; sfx.click(); }
  else if (act === 'nstep') { const n = clamp(S.n + +b.dataset.s, 1, nMaxFree()); if (n !== S.n) { S.n = n; sfx.tick(); } }
  render();
});
const nMaxFree = () => (S.gs === 2 ? 8 : 5);
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'thV' || id === 'thA') {
    if (S.tp !== 'predict') resetThrow();
    if (id === 'thV') S.v = v; else S.th = v;
  } else if (id === 'abA') S.a = v; else if (id === 'abB') S.b = v; else if (id === 'abC') S.c = v;
  else return;
  sfx.tick(); render();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
function render() {
  const v = lab.view, t = T[lang];
  document.body.dataset.v = v;
  $('vThrow').hidden = v !== 'throw'; $('vAbc').hidden = v !== 'abc'; $('vGrow').hidden = v !== 'grow';
  const open = secret.unlocked();
  $('secRow').innerHTML = ['gal', 'dish'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${(k === 'gal' ? S.gal && v === 'throw' : S.dish && v === 'abc' && S.as === 2) ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'gal' ? '📜' : '📡'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (v === 'throw') renderThrow(t); else if (v === 'abc') renderAbc(t); else renderGrow(t);
}
function renderThrow(t) {
  const th = t.th, f = flightNow();
  lab.setGlow('rgba(232, 116, 44, .26)');
  $('thVl').textContent = th.vl; $('thAl').textContent = th.al;
  $('thVv').textContent = `${nf(S.v)} ${lang === 'ru' ? 'м/с' : 'm/s'}`; $('thAv').textContent = `${S.th}°`;
  if ($('thV').value !== String(S.v)) $('thV').value = S.v;
  if ($('thA').value !== String(S.th)) $('thA').value = S.th;
  const fly = S.tp === 'fly';
  $('thQ').textContent = S.tp === 'predict' ? th.q : '';
  $('thQ').hidden = S.tp !== 'predict';
  $('thGo').textContent = S.tp === 'done' ? th.again : th.go; $('thGo').disabled = fly || (S.tp === 'predict' && !S.tap);
  $('thCap').textContent = S.tp === 'done' ? th.tab : ''; $('thCap').hidden = S.tp !== 'done';
  const model = th.model(nf(G, 2));
  if (S.tp === 'done') {
    const n = Math.floor(f.R);
    $('thTab').innerHTML = `<div class="pb-grid">${Array.from({ length: n + 1 }, (_, x) => `<button class="pb-cell ${x === S.sel ? 'on' : ''}" data-act="sel" data-x="${x}"><small>${x}</small><b>${nf(f.h(x))}</b></button>`).join('')}</div>`;
  } else $('thTab').innerHTML = `<div class="pb-wait">${esc(th.wait)}</div>`;
  if (S.tp === 'predict') {
    lab.setReadout('?', th.sub(nf(S.v), S.th), '', '#e8742c');
    lab.setState(S.tap ? { emo: '📍', title: th.s1[0], lead: th.s1[1], body: model, extra: '' } : { emo: '🎯', title: th.s0[0], lead: th.s0[1], body: model, extra: '' });
  } else if (fly) {
    lab.setReadout('…', th.sub(nf(S.v), S.th), '', '#e8742c');
    lab.setState({ emo: '🏀', title: th.fly[0], lead: th.fly[1], body: model, extra: '' });
  } else {
    lab.setReadout(`${nf(f.hm)} ${lang === 'ru' ? 'м' : 'm'}`, th.hi, th.range(nf(f.R)), '#e8742c');
    if (S.gal) {
      const ds = galDrops(f), r = ds.map((d) => Math.round(d / ds[0]));
      lab.setState({ emo: '📜', title: th.gal[0], lead: th.gal[1](nf(DT_GAL, 2), nf(f.vx * DT_GAL, 2)), body: th.gal[2](ds.map((d) => nf(d, 2)).join(' · '), r.join(' : ')), extra: '' });
    } else {
      const g = S.tap ? S.tap.x : null, ok = g !== null && Math.abs(g - f.xv) <= 1;
      const d = Math.min(1, f.xv / 2), xl = f.xv - d, xr = f.xv + d, hh = f.h(xr);
      const title = g === null ? th.top : ok ? th.right : th.miss(nf(g), nf(f.xv));
      lab.setState({ emo: g === null ? '🏆' : ok ? '✅' : '🤔', title, lead: th.lead(nf(f.xv), nf(f.hm)), body: th.sym(nf(d), nf(xl), nf(xr), nf(hh), nf(f.R)), extra: `<div class="fine">${th.fn(nt(f.a, 3), nt(f.b, 3))}</div>` });
    }
  }
  lab.setFacts(t.facts.throw);
}
function renderAbc(t) {
  const ab = t.ab, stage = S.as;
  lab.setGlow('rgba(255, 200, 87, .22)');
  $('abFree').hidden = stage !== 2; $('abAsk').hidden = stage === 2;
  const free = stage === 2;
  const a = free ? S.a : stage === 0 ? (S.a0 === null ? 1 : -1) : Q1.a, b = free ? S.b : stage === 0 ? 0 : Q1.b, c = free ? S.c : stage === 0 ? 0 : Q1.c;
  // question card (stages 0 and 1)
  if (stage === 0) {
    const ans = S.a0, right = ans === 'down';
    $('abAsk').innerHTML = `<p class="pb-ql">${esc(ab.q0)}</p><div class="pb-opts">${['up', 'down'].map((k) => `<button class="pb-opt ${ans !== null ? (k === 'down' ? 'ok' : (k === ans ? 'no' : '')) : ''}" data-act="ab0" data-k="${k}" ${ans !== null ? 'disabled' : ''}>${esc(ab[k])}</button>`).join('')}</div>${ans !== null ? `<div class="row2"><button class="btn pb-go" data-act="abNext">${esc(ab.next)}</button></div>` : ''}`;
    lab.setReadout(esc(fterm(ans === null ? 1 : -1, 0, 0)), `a = ${nt(ans === null ? 1 : -1)}`, '', '#ffc857');
    lab.setState(ans === null ? { emo: '🤔', title: ab.s0[0], lead: ab.s0[1], body: '', extra: '' }
      : { emo: right ? '✅' : '🤔', title: right ? ab.r0[0] : ab.w0[0], lead: right ? ab.r0[1] : ab.w0[1], body: ab.l0, extra: '' });
  } else if (stage === 1) {
    const ans = S.a1, f = fterm(Q1.a, Q1.b, Q1.c);
    $('abAsk').innerHTML = `<p class="pb-ql">${esc(ab.q1(f))}</p><div class="pb-opts">${Q1_OPTS.map((o, i) => `<button class="pb-opt ${ans !== null ? (i === Q1_OK ? 'ok' : (i === ans ? 'no' : '')) : ''}" data-act="ab1" data-i="${i}" ${ans !== null ? 'disabled' : ''}>${nt(o)}</button>`).join('')}</div>${ans !== null ? `<div class="row2"><button class="btn pb-go" data-act="abNext">${esc(ab.start)}</button></div>` : ''}`;
    lab.setReadout(esc(f), '', '', '#ffc857');
    lab.setState(ans === null ? { emo: '🤔', title: ab.s1[0], lead: ab.s1[1], body: '', extra: '' }
      : { emo: ans === Q1_OK ? '✅' : '🤔', title: ans === Q1_OK ? ab.r1 : ab.w1(nt(Q1_OPTS[ans]), nt(Q1.c)), lead: ab.l1(nt(Q1.c)), body: '', extra: '' });
  } else {
    $('abAl').textContent = ab.al; $('abBl').textContent = ab.bl; $('abCl').textContent = ab.cl;
    $('abAv').textContent = nt(S.a); $('abBv').textContent = nt(S.b); $('abCv').textContent = nt(S.c);
    if ($('abA').value !== String(S.a)) $('abA').value = S.a; if ($('abB').value !== String(S.b)) $('abB').value = S.b; if ($('abC').value !== String(S.c)) $('abC').value = S.c;
    const f = fterm(S.a, S.b, S.c), li = S.a === 0;
    const xv = li ? 0 : -S.b / (2 * S.a), yv = li ? 0 : qy(S.a, S.b, S.c, xv), disc = S.b * S.b - 4 * S.a * S.c;
    lab.setReadout(esc(f), li ? ab.pillLine : `${ab.vert} ${pt(nt(xv), nt(yv))}`, li ? '' : S.a > 0 ? ab.pillUp : ab.pillDown, '#ffc857');
    const head = li ? ab.heads[2] : S.a > 0 ? ab.heads[0] : ab.heads[1];
    let lead = li ? ab.line : ab.vx(nt(xv), nt(yv)), body;
    if (li) body = S.b !== 0 ? ab.lineRoot(nt(-S.c / S.b)) : ab.lineNone;
    else body = disc > 0 ? ab.roots2(nt((-S.b - Math.sqrt(disc)) / (2 * S.a)), nt((-S.b + Math.sqrt(disc)) / (2 * S.a))) : disc === 0 ? ab.roots1(nt(xv)) : ab.roots0;
    let extra = `<div class="fine">${ab.fm(esc(f))}</div>`;
    if (S.dish && !li) {
      const fo = 1 / (4 * Math.abs(S.a));
      lead = ab.dish[1](nt(fo, 3), nt(Math.abs(S.a)), ab.side);
      body = ab.dish[2];
    }
    lab.setState({ emo: S.dish && !li ? '📡' : li ? '➖' : S.a > 0 ? '⌣' : '⌢', title: S.dish && !li ? ab.dish[0] : head, lead, body, extra });
  }
  // table of values, x = −3 … 3 (hidden until the y-axis question is answered)
  const showTab = stage !== 1 || S.a1 !== null;
  const xs = [-3, -2, -1, 0, 1, 2, 3], ys = xs.map((x) => qy(a, b, c, x));
  const pairs = {};
  if (showTab && a !== 0) ys.forEach((y, i) => { const key = Math.round(y * 1000); (pairs[key] ||= []).push(i); });
  const colorOf = {}; let ci = 0;
  Object.values(pairs).forEach((g) => { if (g.length > 1) { g.forEach((i) => { colorOf[i] = ci % 3; }); ci++; } });
  $('abCap').textContent = showTab ? ab.tab + (ci ? ' ' + ab.pairs : '') : ab.wait;
  $('abTab').innerHTML = showTab ? `<div class="pb-grid seven">${xs.map((x, i) => `<div class="pb-cell ${colorOf[i] !== undefined ? 'p' + colorOf[i] : ''}"><small>${nt(x)}</small><b>${nt(ys[i], 1)}</b></div>`).join('')}</div>` : '';
  lab.setFacts(t.facts.abc);
}
function renderGrow(t) {
  const gr = t.gr, gs = S.gs;
  lab.setGlow('rgba(79, 195, 217, .22)');
  const n = S.n;
  // questions
  const ask = (q, opts, ans, ok, act) => `<p class="pb-ql">${esc(q)}</p><div class="pb-opts">${opts.map((o, i) => `<button class="pb-opt ${ans !== null ? (i === ok ? 'ok' : (i === ans ? 'no' : '')) : ''}" data-act="${act}" data-i="${i}" ${ans !== null ? 'disabled' : ''}>${o}</button>`).join('')}</div>`;
  let html = '';
  if (gs === 0) html = ask(gr.q0, SQ_OPTS, S.gq, SQ_OK, 'gr0') + (S.gq !== null ? `<div class="row2"><button class="btn pb-go" data-act="grNext">${esc(gr.next)}</button></div>` : '');
  else if (gs === 1) html = ask(gr.q1, ROW_OPTS, S.gr, ROW_OK, 'gr1') + (S.gr !== null ? `<div class="row2"><button class="btn pb-go" data-act="grNext">${esc(gr.free_btn)}</button></div>` : '');
  $('grAsk').innerHTML = html; $('grAsk').hidden = gs === 2;
  $('grStep').hidden = false;
  $('grStep').innerHTML = `<span>${esc(gr.st)}</span><button class="sb" data-act="nstep" data-s="-1" aria-label="−" ${n <= 1 ? 'disabled' : ''}>−</button><b>${n}</b><button class="sb" data-act="nstep" data-s="1" aria-label="+" ${n >= nMaxFree() ? 'disabled' : ''}>+</button>`;
  $('grNote').textContent = gr.note;
  // table with first and second differences; unknown cells show "?"
  const rows = gs === 2 ? 8 : 6, known = (kind, m) => m <= 5 || gs === 2 || (m === 6 && (kind === 'sq' ? S.gq : S.gr) !== null);
  const cell = (kind, f, m, d) => {
    if (m < d + 1) return '<div>·</div>';
    if (!known(kind, m)) return '<div class="q">?</div>';
    const v = d === 0 ? f(m) : d === 1 ? d1(f, m) : d2(f, m);
    return `<div class="${m === n ? 'cur' : ''}">${v}</div>`;
  };
  let tab = `<div class="pb-tab"><div class="h"></div><div class="h g1">${esc(gr.sq)}</div><div class="h g2">${esc(gr.row)}</div><div class="h">${esc(gr.n)}</div>`
    + ['', 'Δ₁', 'Δ₂'].map((s, i) => `<div class="h">${i ? s : esc(gr.tiles)}</div>`).join('') + ['', 'Δ₁', 'Δ₂'].map((s, i) => `<div class="h">${i ? s : esc(gr.tiles)}</div>`).join('');
  for (let m = 1; m <= rows; m++) tab += `<div class="h ${m === n ? 'cur' : ''}" style="padding-top:5px">${m}</div>` + [0, 1, 2].map((d) => cell('sq', sqv, m, d)).join('') + [0, 1, 2].map((d) => cell('row', rowv, m, d)).join('');
  $('grTab').innerHTML = tab + '</div>';
  // readout and state card
  lab.setReadout(sqv(n), gr.sub(n), gr.pill(n), '#4fc3d9');
  const seq = (f, last) => Array.from({ length: last - 1 }, (_, i) => d1(f, i + 2));
  if (gs === 0) {
    if (S.gq === null) lab.setState({ emo: '🧩', title: gr.s0[0], lead: gr.s0[1], body: '', extra: '' });
    else {
      const ok = S.gq === SQ_OK, ds = seq(sqv, 5), nx = d1(sqv, 6);
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? gr.r : gr.w(SQ_OPTS[S.gq], sqv(6)), lead: gr.l0(ds.join(', '), d2(sqv, 5), nx, sqv(5), sqv(6)), body: '', extra: '' });
    }
  } else if (gs === 1) {

      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? gr.r : gr.w(ROW_OPTS[S.gr], rowv(6)), lead: gr.l1(ds.join(', '), d2(rowv, 5), nx, rowv(5), rowv(6)), body: '', extra: '' });
    }
  } else lab.setState({ emo: '📈', title: gr.free(n), lead: gr.freeL, body: n > 1 ? gr.body(n) : gr.bodyOne, extra: '' });
  lab.setFacts(t.facts.grow);
}
render();
