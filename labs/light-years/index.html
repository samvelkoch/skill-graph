  c.fillStyle = g; c.beginPath(); c.moveTo(lx - 60, ly); c.lineTo(lx, ly - 3); c.lineTo(lx, ly + 3); c.closePath(); c.fill();
  glow(c, lx, ly, 15, 'rgba(255,236,170,.95)', [0.35, 'rgba(255,215,110,.4)']);
  c.globalCompositeOperation = 'source-over';
  pill(c, `✨ ${t.yrs(1)}`, X0, ly - 28, { align: 'l', color: '#fff3c4', border: 'rgba(255,210,90,.45)' });
  if (loop > 3.2) pill(c, '✓', X1, ly - 28, { align: 'r', color: '#3ddc97', border: 'rgba(61,220,151,.5)' });
  // car lane
  const cyy = 214;
  c.fillStyle = '#1b2038'; c.strokeStyle = 'rgba(150,165,215,.35)'; c.lineWidth = k; c.beginPath(); c.roundRect(X0 - 8, cyy - 9, W + 16, 18, 6); c.fill(); c.stroke();
  c.setLineDash([9, 8]); c.strokeStyle = '#e0c070'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(X0, cyy); c.lineTo(X1, cyy); c.stroke(); c.setLineDash([]);
  drawCar(c, X0 + 14 + (W - 28) * pc, cyy + 6);
  pill(c, `🚗 ${t.kmh}`, X0, cyy - 30, { align: 'l' });
  const done = pc >= 0.999;
  if (loop > 3.4) pill(c, `⏩ ${t.yrs(yrs)}`, 180, 262, { size: 14, h: 26, color: done ? '#3ddc97' : '#fff3c4', border: done ? 'rgba(61,220,151,.55)' : 'rgba(255,210,90,.45)' });
}
function drawSecretB(c, tt, time) {
  const t = T[lang], loop = tt % 13, u = ease(clamp01((loop - 1) / 8)), fade = clamp01(Math.min(loop / 0.8, (13 - loop) / 1.2));
  const sep = lerp(150, 50, u), xm = 180 - sep / 2, xa = 180 + sep / 2, cy = 140;
  c.globalAlpha = fade;
  glow(c, xm, cy, 110, 'rgba(120,150,255,.22)'); glow(c, xa, cy, 96, 'rgba(150,130,255,.2)');
  drawBmp(c, MW, xm, cy, 74, time * 0.05, -0.32, 0.56);
  drawBmp(c, ANDRO, xa, cy, 64, -time * 0.05, 0.4, 0.46);
  if (u > 0.55) {                                                         // stars flung out as they near each other
    const q = rng(3);
    for (let i = 0; i < 70; i++) { const p = q(), a = (u - 0.55) * 2.2 * q(), x = lerp(xm, xa, p) + (q() - 0.5) * 20, yy = cy + (q() - 0.5) * 34 * Math.sin(p * Math.PI); c.globalAlpha = fade * clamp01(a) * (0.5 + 0.5 * Math.sin(time * 3 + i)); c.fillStyle = '#dfe6ff'; c.fillRect(x, yy, 1.3, 1.3); }
    c.globalAlpha = fade;
  }
  c.strokeStyle = 'rgba(255,225,140,.7)'; c.lineWidth = 2.5; c.lineCap = 'round'; c.lineJoin = 'round';           // Andromeda comes this way
  for (let i = 0; i < 3; i++) { const x = 324 - i * 11 - ((time * 12) % 11); c.globalAlpha = fade * (0.9 - i * 0.28); c.beginPath(); c.moveTo(x + 5, 232); c.lineTo(x, 238); c.lineTo(x + 5, 244); c.stroke(); }
  c.globalAlpha = 1;
  pill(c, t.mw, 14, 262, { align: 'l' }); pill(c, t.objs.andromeda, 346, 262, { align: 'r' });
}

// --- the loop ----------------------------------------------------------------------------------------------
const target = () => { const v = lab.view; return v === 'zoom' && A.zoom === null ? 1 : v === 'past' && A.past === null ? 5 : S.zi; };
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view, tg = target();
  if (S.zTo !== tg) { S.zFrom = S.zf; S.zTo = tg; S.zT = 0; S.zD = 0.8 + 0.22 * Math.abs(tg - S.zf); }
  const prev = S.zf;
  if (S.zT < 1) { S.zT = Math.min(1, S.zT + dt / S.zD); S.zf = lerp(S.zFrom, S.zTo, ease(S.zT)); }
  S.zv = dt > 0 ? (S.zf - prev) / dt : 0;
  const i0 = Math.min(4, Math.floor(S.zf)), P = lerp(STOPS[i0].P, STOPS[i0 + 1].P, S.zf - i0);
  S.ph = (S.ph + dt / P) % 1;
  S.rot += dt * 0.018;
  if (S.sec) S.secT += dt;
  drawBackdrop(c, w, h, time);
  const [W, H] = S.sec ? DIM.zoom : DIM[v], sc = Math.min(w / W, h / H), ox = (w - W * sc) / 2, oy = (h - H * sc) / 2;
  SC = sc; c.save(); c.translate(ox, oy); c.scale(sc, sc);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const asking = A[v] === null;
  G.on = false;
  if (S.sec === 'a') drawSecretA(c, S.secT, false);
  else if (S.sec === 'b') drawSecretB(c, S.secT, time);
  else if (v === 'zoom') drawScene(c, 128, false, asking, time);
  else if (v === 'past') drawPast(c, time, asking);
  else { G.ox = ox; G.oy = oy; G.s = sc; G.on = true; drawGalaxy(c, time, asking); }
  c.restore();
});

// --- dragging the marker in the galaxy ---------------------------------------------------------------------
const setDist = (r) => {
  r = clamp(Math.round(r / 100) * 100, 0, 50000);
  if (Math.abs(r - 26000) <= 1500) r = 26000;                            // a little magnet at the Sun's real place
  if (Math.floor(r / 5000) !== Math.floor(S.r / 5000)) sfx.tick();
  S.r = r;
};
let dragging = false;
function dragTo(ev) {
  const b = $('cv').getBoundingClientRect(), x = (ev.clientX - b.left - G.ox) / G.s, y = (ev.clientY - b.top - G.oy) / G.s;
  if (y < 312) { setDist(Math.hypot(x - TX, y - TY) / KPX); if (S.r > 0) S.ang = Math.atan2(y - TY, x - TX) - S.rot; }
  else setDist(Math.abs(x - TX) / KPX);
  render();
}
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'galaxy' || A.galaxy === null || S.sec || !G.on) return;
  dragging = true; $('cv').setPointerCapture?.(ev.pointerId); dragTo(ev);
});
$('cv').addEventListener('pointermove', (ev) => { if (dragging) dragTo(ev); });
['pointerup', 'pointercancel'].forEach((e) => $('cv').addEventListener(e, () => { dragging = false; }));

// --- controls ---------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const setStop = (i) => { if (i === S.zi) return; S.zi = i; sfx.tick(); render(); };
$('lyRange').addEventListener('input', (ev) => setStop(+ev.target.value));
$('lyDist').addEventListener('input', (ev) => { setDist(+ev.target.value); render(); });
$('ctrlBody').addEventListener('click', (ev) => {
  const v = lab.view;
  const o = ev.target.closest('.ly-opt');
  if (o) {
    if (A[v] !== null) return;
    A[v] = +o.dataset.i; (A[v] === RIGHT[v] ? sfx.good : sfx.bad)();
    if (v === 'zoom') S.zi = 1; else if (v === 'past') S.zi = 5;
    render(); showStage(); return;
  }
  const st = ev.target.closest('.ly-stop'); if (st) { setStop(+st.dataset.i); return; }
  if (ev.target.closest('#lyHome')) { S.r = 26000; S.ang = armTh(K_MW)(ARMS_MW[3].a, 0.52); sfx.click(); render(); return; }
  const sc = ev.target.closest('[data-act=sec]');
  if (sc) {
    if (!secret.unlocked()) return secret.open();
    const k = sc.dataset.k;
    S.sec = S.sec === k ? null : k; S.secT = 0; sfx.click(); render(); showStage();
  }
});

// --- one render per change: controls, readout and the state card ------------------------------------------
const valHtml = (s) => { const m = s.match(/^(about |около |kb\. )(.*)$/); return m ? `<span style="font-size:.5em;font-weight:800;color:var(--mut)">${esc(m[1])}</span>${esc(m[2])}` : esc(s); };
function render() {
  const t = T[lang], v = lab.view, a = A[v], asking = a === null;
  document.body.dataset.v = v;
  $('cv').style.touchAction = v === 'galaxy' && !asking && !S.sec ? 'none' : '';
  const q = { zoom: t.zoomAsk, past: t.pastAsk, galaxy: t.galAsk }[v], opts = { zoom: t.zoomOpts, past: t.pastOpts, galaxy: t.galOpts }[v];
  const verdict = a === null ? '' : a === RIGHT[v] ? { zoom: t.zoomRight, past: t.pastRight, galaxy: t.galRight }[v] : { zoom: t.zoomWrong, past: t.pastWrong, galaxy: t.galWrong }[v];
  $('lyAsk').innerHTML = `<div class="ly-q">${esc(q)}</div><div class="chips">${opts.map((o, i) => `<button type="button" class="chip ly-opt${a !== null && i === RIGHT[v] ? ' good' : a === i ? ' bad' : ''}" data-i="${i}"${a !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>${a !== null ? `<div class="ly-verdict ${a === RIGHT[v] ? 'ok' : 'no'}">${esc(verdict)}</div>` : ''}`;
  $('lyStops').style.display = (v === 'zoom' || v === 'past') && !asking ? 'block' : 'none';
  $('lyGal').style.display = v === 'galaxy' && !asking ? 'block' : 'none';
  $('lyRange').value = S.zi; $('lyRange').setAttribute('aria-label', t.zoomLbl);
  document.querySelectorAll('.ly-stop').forEach((b) => { const i = +b.dataset.i; b.classList.toggle('on', i === S.zi); b.setAttribute('aria-label', t.objs[STOPS[i].k]); });
  $('lyDist').value = S.r; $('lyDist').setAttribute('aria-label', t.fromCentre); $('lyEnd0').textContent = `0 · ${t.ctr}`; $('lyEnd1').textContent = `${nb(50000)} · ${t.edge}`; $('lyHome').textContent = t.home;
  const open = secret.unlocked();
  $('lySecRow').innerHTML = [['a', '🛰️'], ['b', '🌌']].map(([k, emo]) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (S.sec) {                                                            // a secret is on: its own readout and caption
    lab.setGlow('rgba(255,210,90,.25)');
    lab.setReadout(S.sec === 'a' ? '🛰️' : '🌌', t.secrets[S.sec][0], '', '#b8741e');
    lab.setState(S.sec === 'a' ? { emo: '🛰️', title: t.secrets.a[0], lead: t.kmText, body: '', extra: '' }
      : { emo: '🌌', title: t.secrets.b[0], lead: t.meetText, body: '', extra: `<div class="ly-src">${esc(SRC_B)}</div>` });
    lab.setFacts([]); return;
  }
  if (asking) {                                                           // while the child predicts, the answer stays hidden everywhere
    lab.setGlow({ zoom: 'rgba(255,210,90,.22)', past: 'rgba(201,138,58,.22)', galaxy: 'rgba(110,130,255,.3)' }[v]);
    lab.setReadout('?', '', v === 'zoom' ? t.objs.sun : v === 'galaxy' ? t.across : '', v === 'galaxy' ? '#5b6cff' : '#b8741e');
    lab.setState({ emo: '🤔', title: q, lead: '', body: '', extra: '' });
    lab.setFacts([]); return;
  }
  const [emo, title, lead, body] = t.st[v];
  lab.setState({ emo, title, lead, body, extra: '' }); lab.setFacts(t.facts[v]);
  if (v === 'zoom') {
    const key = STOPS[S.zi].k;
    lab.setGlow('rgba(255,210,90,.22)'); lab.setReadout(valHtml(t.times[key]), t.lightSub, t.objs[key], '#b8741e');
  } else if (v === 'past') {
    const key = STOPS[S.zi].k; let nk = null, nd = 99;
    if (LG[S.zi] >= 4) MARKS.forEach((m) => { const d = Math.abs(m.L - LG[S.zi]); if (d < nd) { nd = d; nk = m.k; } });
    lab.setGlow('rgba(201,138,58,.22)'); lab.setReadout(valHtml(t.ago(t.times[key])), t.objs[key], nk ? t.marks[nk] : t.now, '#b8741e');
  } else {
    lab.setGlow('rgba(110,130,255,.3)'); lab.setReadout(esc(t.ly(S.r)), t.fromCentre, t.across, '#5b6cff');
  }
}
render();
