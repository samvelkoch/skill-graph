  c.save(); c.font = FONT(800, size); const tw = c.measureText(text).width, pw = tw + 16 + (dot ? 12 : 0);

    rr(c, x, y, cw, chh, 14); c.fillStyle = 'rgba(25,14,6,.34)'; c.fill();
    const sel = S.shipPick === i;
    c.lineWidth = sel ? 3 : 1.2; c.strokeStyle = sel ? '#fff' : 'rgba(255,230,190,.2)';
    if (S.shipDone && ok) { c.strokeStyle = '#3ddc97'; c.lineWidth = 3.5; } else if (S.shipDone && sel) { c.strokeStyle = '#f5c84c'; }
    c.stroke();
    const [em, ...rest] = cure.split(' ');
    emoji(c, em, x + cw / 2, y + 20, 24);
    const r = Math.min(15, cw / 7), u = ok ? ease.inout(c01((p - .38) / .45)) : 0, sy = y + chh * .5;
    sailor(c, x + cw / 2 - r * 1.25, sy, r, u, time, i * 2); sailor(c, x + cw / 2 + r * 1.25, sy, r, u, time, i * 2 + 1);
    c.font = FONT(800, 12); const lines = wrapLines(c, rest.join(' '), cw - 12).slice(0, 3), ly = y + chh - 10 - (lines.length - 1) * 14;
    const lw = Math.max(...lines.map((l) => c.measureText(l).width)) + 12;
    rr(c, x + cw / 2 - lw / 2, ly - 11, lw, lines.length * 14 + 6, 9); c.fillStyle = 'rgba(10,12,20,.78)'; c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; lines.forEach((l, j) => c.fillText(l, x + cw / 2, ly + j * 14 + 1));
    if (S.shipDone && ok) { c.beginPath(); c.arc(x + cw - 10, y + 10, 9, 0, 7); c.fillStyle = '#3ddc97'; c.fill(); c.fillStyle = '#0a0c14'; c.font = FONT(900, 12); c.textAlign = 'center'; c.fillText('✓', x + cw - 10, y + 11); }
  });
  if (S.lastDay !== day) { S.lastDay = day; lab.setReadout(`${day} / 6`, t.days, S.shipDone ? '🙂 2 / 12' : '', '#e0b050'); }
  if (S.shipRun && !S.shipDone && p >= 1) { S.shipDone = true; render(); }
}

// --- drawing: fuel test -----------------------------------------------------------------------------------
function flame(c, x, yb, hh, time, seed) {
  const fl = Math.sin(time * 13 + seed) * hh * .05, wd = hh * .3;
  for (const [sc, col, a] of [[1, '#ff7a1a', .95], [.72, '#ffb13b', .95], [.42, '#fff0b0', .95]]) {
    const hh2 = hh * sc + fl * sc, w2 = wd * sc;
    c.beginPath(); c.moveTo(x, yb); c.bezierCurveTo(x - w2 * 1.3, yb - hh2 * .25, x - w2 * .5, yb - hh2 * .7, x + fl, yb - hh2);
    c.bezierCurveTo(x + w2 * .5, yb - hh2 * .7, x + w2 * 1.3, yb - hh2 * .25, x, yb); c.globalAlpha = a; c.fillStyle = col; c.fill(); c.globalAlpha = 1;
  }
}
function drawFuel(c, w, h, dt, time) {
  const t = T[lang], topH = (E.obSTop.offsetHeight || 64) + 12, botH = 62, capH = 62;
  const colW = w / 3, H = h - topH - botH - capH, p = S.fuelRun ? c01((time - S.fuelT0) / FUEL_DUR) : 0;
  const bh = H * .34, bw = Math.min(64, colW * .5), by0 = topH + 6, flameZ = H * .26, bowlY = by0 + bh + flameZ + 6, baseY = bowlY + H * .3;
  geoFuel = [];
  FUEL_KJ.forEach((kj, i) => {
    const cx = colW * (i + .5), sel = S.fuelPick === i, ok = i === 0;
    geoFuel.push({ x: colW * i + 4, y: topH, w: colW - 8, h: h - topH - botH });
    if (sel || (S.fuelDone && ok)) { rr(c, colW * i + 5, topH - 2, colW - 10, baseY + 64 - topH, 16); c.lineWidth = 2.5; c.strokeStyle = S.fuelDone && ok ? '#3ddc97' : '#fff'; c.stroke(); }
    // beaker
    const ix = cx - bw / 2, lvl = S.fuelRun ? ease.inout(p) * (kj / 37) : 0;
    c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(cx, by0 + bh + 3, bw * .55, 4, 0, 0, 7); c.fill();
    c.save(); rr(c, ix + 2, by0 + 2, bw - 4, bh - 4, 8); c.clip();
    const wg = c.createLinearGradient(0, by0 + bh * .3, 0, by0 + bh); wg.addColorStop(0, mix('#9dd4f2', '#f2c9a0', lvl * .6)); wg.addColorStop(1, mix('#4f9fd6', '#d98a55', lvl * .5));
    c.fillStyle = wg; c.fillRect(ix, by0 + bh * .3, bw, bh); c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(ix, by0 + bh * .3, bw, 2); c.restore();
    rr(c, ix, by0, bw, bh, 9); c.lineWidth = 2.5; c.strokeStyle = 'rgba(225,238,255,.75)'; c.stroke();
    rr(c, ix + 6, by0 + 8, 4, bh * .6, 2); c.fillStyle = 'rgba(255,255,255,.4)'; c.fill();
    // thermometer
    const tx = ix + bw + 10, th = bh * .92, tt = by0 - 2;
    rr(c, tx - 4, tt, 8, th, 4); c.fillStyle = 'rgba(14,17,28,.85)'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(225,238,255,.7)'; c.stroke();
    c.beginPath(); c.arc(tx, tt + th + 3, 7, 0, 7); c.fillStyle = '#e0453a'; c.fill(); c.strokeStyle = 'rgba(225,238,255,.7)'; c.stroke();
    const fh = (th - 8) * (.08 + lvl * .88); rr(c, tx - 2, tt + th - fh - 2, 4, fh + 4, 2); c.fillStyle = '#ff5a4d'; c.fill();
    c.strokeStyle = 'rgba(225,238,255,.5)'; c.lineWidth = 1; for (let q = 1; q < 5; q++) { const yy = tt + 4 + (th - 8) * q / 5; c.beginPath(); c.moveTo(tx + 6, yy); c.lineTo(tx + 10, yy); c.stroke(); }
    // fuel in a spoon on a stand
    const s = S.fuelRun ? 1 - (kj > 0 ? .62 : .9) * ease.out(p) : 1;
    c.strokeStyle = '#4a4f63'; c.lineWidth = 5; c.beginPath(); c.moveTo(cx + 18, bowlY + 3); c.lineTo(cx + 40, bowlY + (baseY - bowlY) * .55); c.stroke();
    c.strokeStyle = '#8a90a8'; c.lineWidth = 3; c.stroke();
    c.fillStyle = '#3a3f52'; rr(c, cx + 34, bowlY + (baseY - bowlY) * .4, 12, baseY - bowlY - (baseY - bowlY) * .4, 4); c.fill();
    rr(c, cx + 22, baseY, 30, 9, 4); c.fillStyle = '#4a4f63'; c.fill(); c.lineWidth = 1.3; c.strokeStyle = '#1b1e2c'; c.stroke();
    const bgS = c.createLinearGradient(0, bowlY - 4, 0, bowlY + 8); bgS.addColorStop(0, '#d8dcea'); bgS.addColorStop(1, '#7f869e');
    c.beginPath(); c.ellipse(cx, bowlY + 2, 21, 8, 0, 0, 7); c.fillStyle = bgS; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#3a3f52'; c.stroke();
    c.save(); c.translate(cx, bowlY - 2); c.scale(s, s);
    if (i === 0) { rr(c, -11, -13, 22, 15, 4); const g = c.createLinearGradient(0, -13, 0, 2); g.addColorStop(0, '#ffe98a'); g.addColorStop(1, '#e0b83a'); c.fillStyle = g; c.fill(); c.lineWidth = 1.3; c.strokeStyle = '#8a6a14'; c.stroke(); rr(c, -8, -11, 10, 3, 1.5); c.fillStyle = 'rgba(255,255,255,.6)'; c.fill(); }
    else if (i === 1) { for (let q = 0; q < 14; q++) { const gx = ((q * 53) % 23) - 11, gy = -((q * 37) % 11) - (Math.abs(gx) < 6 ? 3 : 0); c.fillStyle = q % 3 ? '#fff' : '#dfe8f4'; c.fillRect(gx, gy, 4, 4); } }
    else { c.beginPath(); c.ellipse(0, -2, 15, 5, 0, 0, 7); c.fillStyle = 'rgba(95,180,232,.9)'; c.fill(); c.strokeStyle = '#2c6e9c'; c.lineWidth = 1.3; c.stroke(); }
    c.restore();
    if (S.fuelRun && p < 1) {
      const inten = p < .1 ? p / .1 : p > .86 ? (1 - p) / .14 : 1, sc = kj / 37;
      if (kj > 0) { const gl = c.createRadialGradient(cx, bowlY - 14, 4, cx, bowlY - 14, 54); gl.addColorStop(0, `rgba(255,170,60,${.35 * inten * (sc + .3)})`); gl.addColorStop(1, 'rgba(255,170,60,0)'); c.fillStyle = gl; c.fillRect(cx - 60, bowlY - 70, 120, 100);
        flame(c, cx, bowlY - 4, flameZ * (.45 + .5 * sc) * inten + 2, time, i * 3); }
      else for (let q = 0; q < 4; q++) { // the water spoon only steams
        const ph = (time * .7 + q / 4) % 1, yy = bowlY - 8 - ph * flameZ * 1.1, xx = cx + Math.sin(ph * 7 + q) * 7;
        c.beginPath(); c.arc(xx, yy, 5 + ph * 6, 0, 7); c.fillStyle = `rgba(225,235,250,${.4 * (1 - ph) * inten})`; c.fill();
      }
    }
    // captions
    const cy = baseY + 24;
    pillText(c, t.fuels[i], cx, cy, { align: 'c' });
    if (S.fuelDone) pillText(c, t.kj(kj), cx, cy + 24, { align: 'c', fg: kj ? '#ffcf5a' : '#98A0B8' });
  });
  if (S.fuelRun && !S.fuelDone && p >= 1) { S.fuelDone = true; render(); }
}

// --- one drawing loop for all scenes ----------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; c.lineJoin = 'round'; c.lineCap = 'round';
  const v = S.sec || lab.view;
  if (v === 'inside') drawInside(c, w, h, dt, time);
  else if (v === 'jobs') drawJobs(c, w, h, dt, time);
  else if (v === 'lunch') drawLunch(c, w, h, dt, time);
  else if (v === 'ship') drawShip(c, w, h, dt, time);
  else if (v === 'fuel') drawFuel(c, w, h, dt, time);
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, hit = (g) => x >= g.x && x <= g.x + g.w && y >= g.y && y <= g.y + g.h;
  if (S.sec === 'ship' && !S.shipRun) { const i = geoShip.findIndex(hit); if (i >= 0) { S.shipPick = i; sfx.tick(); render(); } }
  else if (S.sec === 'fuel' && !S.fuelRun) { const i = geoFuel.findIndex(hit); if (i >= 0) { S.fuelPick = i; sfx.tick(); render(); } }
  else if (!S.sec && lab.view === 'lunch' && S.lq !== null && geoLunch) { const i = geoLunch.findIndex(hit); if (i >= 0 && S.box[i]) { S.box[i] = null; sfx.tick(); render(); } }
});

// --- events ------------------------------------------------------------------------------------------------
$('overlay').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.food) { S.food = d.food; S.t0 = now(); sfx.click(); }
  else if (d.ans) { S.ans[S.food] = d.ans; S.t0 = now(); (d.ans === biggestOf(S.food) ? sfx.good : sfx.bad)(); }
  else if (d.tok) { S.jsel = d.tok; sfx.tick(); }
  else if (d.job) { if (S.jans[S.jsel] !== undefined) return; S.jans[S.jsel] = d.job; S.jT[S.jsel] = now(); (JOB_OK[S.jsel].includes(d.job) ? sfx.good : sfx.bad)(); }
  else if (d.next !== undefined) {
    const open = NUTS.filter((n) => S.jans[n] === undefined);
    if (open.length) S.jsel = open.find((n) => NUTS.indexOf(n) > NUTS.indexOf(S.jsel)) || open[0]; else { S.jans = {}; S.jT = {}; S.jsel = 'carbs'; }
    sfx.click();
  } else if (d.lfood) lunchTap(d.lfood);
  else if (d.run !== undefined) {
    if (S.sec === 'ship' && S.shipPick !== null && !S.shipRun) { S.shipRun = true; S.shipT0 = now(); S.lastDay = -1; sfx.push(); }
    else if (S.sec === 'fuel' && S.fuelPick !== null && !S.fuelRun) { S.fuelRun = true; S.fuelT0 = now(); sfx.push(); }
  }
  render();
});
function lunchTap(k) {
  if (S.lq === null) { // the prediction
    S.lq = k; S.box = [k === 'none' ? 'almonds' : k, null, null]; S.lunchAt = now(); S.popAt = [now(), -9, -9]; S.flashAt = now();
    const pct = BARS.map((b) => (FOODS[k === 'none' ? 'almonds' : k][b.f] / b.ref) * 100);
    S.flash = k === 'none' ? [] : pct.map((v, i) => (v < 50 ? i : -1)).filter((i) => i >= 0);
    (k === 'none' ? sfx.good : sfx.bad)(); return;
  }
  const at = S.box.indexOf(k);
  if (at >= 0) { S.box[at] = null; sfx.tick(); return; }
  const free = S.box.indexOf(null);
  if (free < 0) { sfx.bad(); return; }
  S.box[free] = k; S.popAt[free] = now(); sfx.snap();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const k = b.dataset.k;
  if (b.dataset.act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'ship') Object.assign(S, { shipPick: null, shipRun: false, shipDone: false, lastDay: -1 }); else Object.assign(S, { fuelPick: null, fuelRun: false, fuelDone: false }); showStage(); }
    sfx.click();
  } else if (b.dataset.act === 'again') {
    if (S.sec === 'ship') Object.assign(S, { shipPick: null, shipRun: false, shipDone: false, lastDay: -1 }); else Object.assign(S, { fuelPick: null, fuelRun: false, fuelDone: false });
    sfx.click(); showStage();
  }
  render();
});

// --- render: one pass per change --------------------------------------------------------------------------
const show = (el, on) => { el.style.display = on ? '' : 'none'; };
function render() {
  const t = T[lang], v = S.sec || lab.view;
  document.body.dataset.v = v;
  show(E.obFoods, v === 'inside'); show(E.obAsk, v === 'inside'); show(E.obJobs, v === 'jobs'); show(E.obLTop, v === 'lunch'); show(E.obLFoods, v === 'lunch');
  show(E.obSTop, !!S.sec); show(E.obSBot, !!S.sec && !(S.sec === 'ship' ? S.shipRun : S.fuelRun));
  show($('cLunch'), v === 'lunch' && S.lq !== null); show($('cSec'), !!S.sec && (S.sec === 'ship' ? S.shipDone : S.fuelDone));
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('ship', '⛵') + sc('fuel', '🔥');
  const fine = `<div class="fine">${esc(t.fine)}</div>`;
  if (S.sec) { lab.setFacts([]); return renderSecret(t); }
  lab.setFacts(t.facts[lab.view] || []);
  if (v === 'inside') renderInside(t, fine); else if (v === 'jobs') renderJobs(t, fine); else renderLunch(t, fine);
}
const keepScroll = (el, html) => { const sl = el.scrollLeft; el.innerHTML = html; el.scrollLeft = sl; };

function renderInside(t, fine) {
  const k = S.food, a = k && S.ans[k], n = Object.keys(S.ans).length;
  keepScroll(E.obFoods, ORDER.map((f) => `<button class="ob-food ${f === k ? 'on' : ''} ${S.ans[f] ? 'done' : ''}" data-food="${f}"><span class="e">${FOODS[f].emo}</span>${esc(t.foods[f])}</button>`).join(''));
  if (!k) E.obAsk.innerHTML = `<div class="ob-hint">${esc(t.pickFood)}</div>`;
  else if (!a) E.obAsk.innerHTML = `<div class="q">${esc(t.biggestQ(t.foods[k]))}</div><div class="ob-opts">${['water', 'sugar', 'protein', 'fat', 'fibre'].map((q) => `<button class="ob-ans" style="--c:${COL[q]}" data-ans="${q}">${esc(t.parts[q])}</button>`).join('')}</div>`;
  else {
    const big = biggestOf(k), ok = a === big;
    E.obAsk.innerHTML = `<div class="ob-verdict" style="color:var(${ok ? '--ok' : '--wip'})">${esc(ok ? t.right : t.notQuite)}</div><p>${esc(t.exInside(t.parts[big], num(layersOf(k)[big])))}</p>`;
  }
  if (a) lab.setReadout(t.kj(FOODS[k].kj), t.in100, t.parts[biggestOf(k)], '#5fb4e8'); else lab.setReadout('?', '', '', '#5fb4e8');
  const [ti, le] = n >= 3 ? t.state.inside3 : t.state.inside0;
  lab.setGlow('rgba(95, 180, 232, .26)'); lab.setState({ emo: '🧪', title: ti, lead: le, body: '', extra: fine });
}

function renderJobs(t, fine) {
  const sel = S.jsel, got = S.jans[sel], cnt = Object.keys(S.jans).length, last = NUTS.filter((n) => S.jT[n] !== undefined).sort((a, b) => S.jT[b] - S.jT[a])[0];
  E.obToks.innerHTML = NUTS.map((n) => {
    const j = S.jans[n], cls = [n === sel ? 'cur' : '', j === undefined ? '' : JOB_OK[n].includes(j) ? 'ok' : 'bad'].join(' ');
    return `<button class="ob-tok ${cls}" data-tok="${n}" aria-label="${esc(t.nutrients[n])}" title="${esc(t.nutrients[n])}">${NEMO[n]}</button>`;
  }).join('');
  if (got === undefined) E.obJq.innerHTML = `<div class="q">${esc(t.jobQ(t.nutrients[sel]))}</div><div class="ob-jopts">${JOBS.map((j) => `<button class="ob-jb" data-job="${j}">${esc(t.jobs[j])}</button>`).join('')}</div>`;
  else {
    const ok = JOB_OK[sel].includes(got);
    E.obJq.innerHTML = `<div class="ob-verdict" style="color:var(${ok ? '--ok' : '--wip'})">${esc(ok ? t.right : t.notQuite)}</div>
      <div><span class="ob-rightjob">${JOB_OK[sel].map((j) => esc(t.jobs[j])).join(' / ')}</span></div><p>${esc(t.exJob[sel])}</p>
      <div><button class="btn" data-next>${esc(cnt >= 7 ? t.again : t.next)}</button></div>`;
  }
  lab.setReadout(t.answered(cnt), t.jobsLbl, last ? t.perg(KJG[last]) : '', '#ffb347');
  const [ti, le] = cnt >= 7 ? t.state.jobsDone : t.state.jobs0;
  lab.setGlow('rgba(255, 140, 60, .24)'); lab.setState({ emo: '🛠️', title: ti, lead: le, body: '', extra: fine });
}

function renderLunch(t, fine) {
  const pred = S.lq !== null, pct = boxPct(), sum = boxSum(), ge = pct.filter((v) => v >= 25).length, filled = S.box.filter(Boolean).length;
  const done = pred && filled === 3 && ge === 5;
  if (done && !S.done) { S.doneAt = now(); sfx.good(); }
  S.done = done;
  E.obLTop.innerHTML = `<div class="ob-line">${esc(pred ? t.lunchGoal : t.lunchQ)}</div><div class="ob-sub">${esc(t.ofRef)}</div>`;
  keepScroll(E.obLFoods, (pred ? '' : `<button class="ob-food none" data-lfood="none">${esc(t.noneChip)}</button>`)
    + ORDER.map((f) => `<button class="ob-food ${S.box.includes(f) ? 'on' : ''}" data-lfood="${f}"><span class="e">${FOODS[f].emo}</span>${esc(t.foods[f])}</button>`).join(''));
  const ok = S.lq === 'none';
  $('cLunch').innerHTML = pred ? `<div class="ob-verdict" style="color:var(${ok ? '--ok' : '--wip'})">${esc(ok ? t.right : t.notQuite)}</div><p>${esc(t.exLunch)}</p>${done ? `<p><b>${esc(t.done)}</b></p>` : `<p class="fine">${esc(t.tapSlot)}</p>`}` : '';
  lab.setReadout(t.kj(Math.round(sum.kj)), t.inBox, pred ? `${ge} / 5` : '', '#53cbb9');
  const [ti, le] = done ? t.state.lunchDone : t.state.lunch0;
  lab.setGlow('rgba(83, 203, 185, .24)'); lab.setState({ emo: '🍱', title: ti, lead: le, body: '', extra: fine });
}

function renderSecret(t) {
  const ship = S.sec === 'ship', run = ship ? S.shipRun : S.fuelRun, done = ship ? S.shipDone : S.fuelDone, pick = ship ? S.shipPick : S.fuelPick;
  E.obSTop.innerHTML = `<div class="ob-line">${esc(ship ? t.shipQ : t.fuelQ)}</div><div class="ob-sub">${esc(ship ? t.tapPick : t.tapSpoon)}</div>`;
  E.obSBot.innerHTML = `<button class="btn" data-run ${pick === null ? 'disabled' : ''}>${esc(ship ? t.run6 : t.burn)}</button>`;
  const right = ship ? S.shipPick === SHIP_OK : S.fuelPick === 0;
  $('cSec').innerHTML = done ? `<div class="ob-verdict" style="color:var(${right ? '--ok' : '--wip'})">${esc(right ? t.right : t.notQuite)}</div><p>${esc(ship ? t.secretA : t.secretB)}</p><button class="chip" data-act="again">${esc(t.again)}</button>` : '';
  if (ship) { S.lastDay = -1; lab.setReadout(`${done ? 6 : 0} / 6`, t.days, done ? '🙂 2 / 12' : '', '#e0b050'); }
  else lab.setReadout(done ? t.kj(37) : run ? '…' : '?', '', done ? t.fuels[0] : '', '#ff8a3d');
  lab.setGlow(ship ? 'rgba(224, 176, 80, .24)' : 'rgba(255, 138, 61, .26)');
  lab.setState({ emo: ship ? '⛵' : '🔥', title: done ? (right ? t.right : t.notQuite) : t.secrets[S.sec][0], lead: done ? (ship ? t.secretA : t.secretB) : (ship ? t.shipQ : t.fuelQ), body: '', extra: '' });
}
render();
