<style>
  #gauge { display: none; }
  .lab { grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); grid-template-areas: 'hero stage' 'state stage' 'state ctrl'; }
  #stage canvas { touch-action: pan-y; cursor: pointer; }
  .readout .val small { font-size: 15px; font-weight: 800; color: var(--mut); letter-spacing: 0; }
  .fine { margin-top: 8px; font-size: 11px; color: var(--faint); }
  .ripples { display: grid; gap: 4px; }
  .ripples .up { color: var(--ok); font-weight: 900; }
  .ripples .down { color: #ff7a6b; font-weight: 900; }
  .calm { color: var(--mut); }
  .ask { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: min(560px, calc(100% - 16px)); padding: 14px 16px;
    text-align: center; }
  .ask .q { font: 500 22px/1.2 var(--serif); color: #fff; margin-bottom: 10px; text-wrap: balance; }
  .ask .opts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .ask button { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--stroke2); background: rgba(130, 145, 190, .1);
    font-weight: 800; cursor: pointer; }
  .ask button:hover { background: rgba(130, 145, 190, .25); }
  .ask button.link { border: 0; background: none; color: var(--mut); font-size: 12px; text-decoration: underline; padding: 6px 8px; margin-top: 4px; }
  .ask p { margin: 0 0 10px; color: var(--soft); font-size: 13px; }
  .ask .verdict { font-weight: 900; margin-bottom: 4px; }
  .ask .nums { font-weight: 900; color: #fff; margin-bottom: 6px; }
  .ask.mini { top: auto; bottom: 8px; padding: 8px 14px; font-size: 12.5px; color: var(--soft); font-weight: 700; }
  .toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 16px); padding: 9px 14px;
    font-size: 12.5px; font-weight: 800; color: #fff; border-color: rgba(255, 59, 48, .55); text-align: center; transition: opacity .4s; }
  .toast.hide { opacity: 0; pointer-events: none; }
  .ask.mini ~ .toast { bottom: 52px; }
  .lbl2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin: 12px 0 6px; }
  .sp { margin-top: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--stroke); background: rgba(20, 24, 38, .45); }
  .sp .hint { color: var(--mut); font-size: 12.5px; font-weight: 700; }
  .sp .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sp .nm { font-weight: 900; color: #fff; font-size: 15px; }
  .sp .cnt { font-weight: 900; font-size: 15px; }
  .sp .role { font-size: 12.5px; color: var(--soft); margin-top: 4px; }
  .sp .rel { font-size: 12.5px; color: var(--mut); margin-top: 2px; }
  .sp .rel b { color: var(--soft); font-weight: 800; }
  .sp .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; font-size: 11.5px; color: var(--mut); font-weight: 700; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  #play { min-width: 92px; justify-content: center; }
  @media (max-width: 1100px) {
    .lab { grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); }
  }
  @media (max-width: 760px) {
    #stage { height: min(118vw, 500px); }
    .ask .q { font-size: 18px; } .ask { padding: 10px 12px; }
  }
</style>

    chains: [['grass', 'hopper', 'bird', 'owl'], ['grass', 'rabbit', 'fox'], ['grass', 'mouse', 'owl'], ['grass', 'mouse', 'fox']],
    pyramid: [['grass'], ['hopper', 'mouse', 'rabbit'], ['bird', 'fox', 'owl'], ['owl']],
  },
  kelp: {
    sp: [
      { k: 'kelp', emo: '🌿', col: '#5fbf6a', N: 100, s: 0.5, w: 1, prod: true, lvl: 0, x: 0.5, y: 0.86 },
      { k: 'urchin', emo: '🟣', col: '#b06ae8', N: 200, s: 0.05, w: 0.5, lvl: 1, x: 0.5, y: 0.5 },
      { k: 'otter', emo: '🦦', col: '#d39a6a', N: 12, s: 0.4, w: 0.525, lvl: 3, x: 0.5, y: 0.14 },
    ],
    ed: [['kelp', 'urchin', 1.0], ['urchin', 'otter', 0.8]],
    chains: [['kelp', 'urchin', 'otter']],
    pyramid: [['kelp'], ['urchin'], ['otter']],
  },
};
function compile(web) {
  const n = web.sp.length, id = Object.fromEntries(web.sp.map((s, i) => [s.k, i]));
  const M = web.sp.map((s, i) => web.sp.map((_, j) => (i === j ? -s.s : 0)));
  web.links = web.ed.map(([a, b, g]) => {
    const i = id[a], j = id[b], l = web.sp[j].w * g / web.sp[i].w;
    M[j][i] += g; M[i][j] -= l;
    return { from: i, to: j, g, l };
  });
  web.M = M; web.id = id; web.n = n;
  web.b0 = M.map((row) => -row.reduce((a, v) => a + v, 0)); // own growth rate with nothing else around
  web.chainIdx = web.chains.map((c) => c.map((k) => id[k]));
  return web;
}
Object.values(WEBS).forEach(compile);
const DT = 0.005, YPS = 0.35, SEASON = 0.08; // years per sub-step, model years per second at 1×, seasonal wiggle
const K1 = new Float64Array(8), K2 = new Float64Array(8), TMP = new Float64Array(8);
function rates(web, y, t, env, out) {
  const { M, n, sp } = web;
  for (let i = 0; i < n; i++) {
    if (y[i] <= 0) { out[i] = 0; continue; }
    let r = 0;
    for (let j = 0; j < n; j++) if (M[i][j]) r += M[i][j] * (y[j] - 1);
    if (sp[i].prod) r += (SEASON * Math.sin(2 * Math.PI * t) - env.drought) * web.b0[i];
    if (env.kill[sp[i].k]) r -= env.kill[sp[i].k];
    out[i] = y[i] * r;
  }
}
// one Heun (RK2) sub-step of 0.005 years, clamped to [0, 5 × normal] as a backstop
function step(web, y, t, env) {
  const n = web.n;
  rates(web, y, t, env, K1);
  for (let i = 0; i < n; i++) TMP[i] = Math.min(5, Math.max(0, y[i] + DT * K1[i]));
  rates(web, TMP, t + DT, env, K2);
  for (let i = 0; i < n; i++) y[i] = Math.min(5, Math.max(0, y[i] + DT * 0.5 * (K1[i] + K2[i])));
}

  noRabbit: { web: 'meadow', target: 'fox', win: 5, apply: () => removeSp('rabbit', false) },
  pest: { web: 'meadow', target: 'bird', win: 6, apply: () => { S.env.kill.hopper = 3; } },

  drought: { web: 'meadow', target: 'fox', win: 6, apply: () => { S.env.drought = 0.5; } },

function resetWeb(key = S.webKey) {
  S.webKey = key; S.y = new Float64Array(W().n).fill(1); S.t = 0; S.acc = 0; S.nextRec = 0;
  S.hist = []; S.events = []; S.env = { drought: 0, kill: {} }; S.exp = null; S.pred = null; S.removed = new Set(); parts.length = 0;
  if (S.sel !== null && S.sel >= W().n) S.sel = null;
  if (S.chain !== null && S.chain >= W().chains.length) S.chain = null;
  record();
}
function record() { S.hist.push({ t: S.t, y: Array.from(S.y) }); if (S.hist.length > 320) S.hist.shift(); S.nextRec = S.t + 0.05; }
function event(emo) { S.events.push({ t: S.t, emo }); if (S.events.length > 40) S.events.shift(); }
function removeSp(k, cancel = true) {
  const i = W().id[k]; if (S.y[i] <= 0) return;
  S.y[i] = 0; S.removed.add(i); event('✕' + W().sp[i].emo);
  if (cancel) S.pred = null;
}
function showToast(msg) { S.toast = msg; S.toastT = 5; renderOverlay(); }

// run the model forward by `years`, in fixed 0.005-year sub-steps
function advance(years) {
  const web = W();
  S.acc += years;
  while (S.acc >= DT) {
    step(web, S.y, S.t, S.env); S.t += DT; S.acc -= DT;
    web.sp.forEach((s, i) => {
      if (!s.prod && S.y[i] > 0 && S.y[i] * s.N < 1) { // below one individual: gone
        S.y[i] = 0; event('💀' + s.emo); showToast(`💀 ${T[lang].extinct(lang === 'hu' ? T.hu.sp[s.k].pa : nameOf(i, 'A'))}`); sfx.bad();
      }
    });
    if (S.t >= S.nextRec) record();
  }
  watchPrediction();
}

// --- predictions: the guess is checked against what the model actually does ----------------------------------
function startPrediction(key, guess) {
  const e = EXPS[key];
  resetWeb(e.web); S.exp = key; e.apply(); event(EXP_EMO[key]);
  const ti = W().id[e.target];
  S.pred = { key, guess, ti, t0: S.t, y0: S.y[ti] || 1, min: S.y[ti], max: S.y[ti], done: false, opening: false };
  if (key === 'mow') S.pred.y0 = 1;
  S.playing = true; S.speed = Math.max(S.speed, 2); S.sel = null; S.chain = null; sfx.click();
}
function startOpening(guess) {
  resetWeb('meadow'); S.exp = 'noFox'; removeSp('fox', false);
  const ti = W().id.rabbit;
  S.pred = { key: 'noFox', guess, ti, t0: S.t, y0: 1, peak: 1, low: 1, done: false, opening: true, min: 1, max: 1 };
  S.playing = true; S.speed = Math.max(S.speed, 2); sfx.click();
}
function watchPrediction() {
  const p = S.pred; if (!p || p.done) return;
  const y = S.y[p.ti];
  p.min = Math.min(p.min, y); p.max = Math.max(p.max, y);
  if (p.opening) {
    // the rabbits: boom, then wait until the crash has bottomed out
    if (y > p.peak) { p.peak = y; p.low = y; }
    if (y < p.low) p.low = y;
    const crashed = p.peak > 1.3 && p.low < 0.8 * p.peak && y > p.low + 0.01;
    if (crashed || y === 0 || S.t - p.t0 > 8) {
      p.done = true; p.result = y === 0 ? 'die' : crashed ? 'boom' : 'happy';
      p.ok = p.result === p.guess; (p.ok ? sfx.good : sfx.snap)(); render();
    }
    return;
  }
  if (S.t - p.t0 >= EXPS[p.key].win) {
    const up = p.max / p.y0 - 1, down = 1 - p.min / p.y0;
    p.result = Math.max(up, down) < 0.15 ? 'same' : up > down ? 'up' : 'down';
    p.extreme = p.result === 'up' ? p.max : p.min;
    p.done = true; p.ok = p.result === p.guess; (p.ok ? sfx.good : sfx.snap)(); render();
  }
}

// --- why is each population changing? the biggest term in its growth rate, read off the model -----------------
function ripples() {
  const web = W(), y = S.y, out = [];
  for (let i = 0; i < web.n; i++) {
    if (y[i] <= 0) continue;
    const terms = [];
    for (let j = 0; j < web.n; j++) {
      const m = web.M[i][j]; if (!m) continue;
      if (j === i) terms.push({ kind: 'self', v: m * (y[i] - 1) });
      else terms.push({ kind: m < 0 ? 'pred' : 'food', j, v: m * (y[j] - 1) });
    }
    if (web.sp[i].prod && S.env.drought) terms.push({ kind: 'drought', v: -S.env.drought * web.b0[i] });
    if (S.env.kill[web.sp[i].k]) terms.push({ kind: 'pest', v: -S.env.kill[web.sp[i].k] });
    const r = terms.reduce((a, x) => a + x.v, 0);
    if (Math.abs(r) < 0.3) continue;
    const top = terms.filter((x) => Math.sign(x.v) === Math.sign(r)).sort((a, b) => Math.abs(b.v) - Math.abs(a.v))[0];
    out.push({ i, r, top });
  }
  return out.sort((a, b) => Math.abs(b.r) - Math.abs(a.r)).slice(0, 3);
}
function rippleText({ i, r, top }) {
  const t = T[lang], R = t.ripple, prod = W().sp[i].prod;
  let why = '';
  if (top.kind === 'self') why = r < 0 ? R.crowd : R.room;
  else if (top.kind === 'pest') why = R.pest;
  else if (top.kind === 'drought') why = R.drought;
  else {
    const B = t.sp[W().sp[top.j].k], gone = S.y[top.j] <= 0;
    if (top.kind === 'pred') why = r > 0 ? (gone ? R.predNone(B, prod) : R.predLess(B, prod)) : R.predMore(B, prod);
    else why = r > 0 ? R.foodMore(B) : (gone ? R.foodNone(B) : R.foodLess(B));
  }
  return `<div>${W().sp[i].emo} <b>${esc(nameOf(i, 'A'))}</b> <span class="${r > 0 ? 'up' : 'down'}">${r > 0 ? '▲' : '▼'}</span> — ${esc(why)}</div>`;
}
function status() {
  const web = W(), tmp = new Float64Array(web.n);
  rates(web, S.y, 0, S.env, tmp); // at t = 0 the seasonal term is sin(0) = 0, so only the real pressures count
  let rmax = 0, dev = 0;
  for (let i = 0; i < web.n; i++) if (S.y[i] > 0) { rmax = Math.max(rmax, Math.abs(tmp[i] / S.y[i])); dev = Math.max(dev, Math.abs(S.y[i] - 1)); }
  const lost = S.y.some((v) => v <= 0);
  return rmax > 0.3 ? 'moving' : dev < 0.15 && !lost ? 'calm' : 'settled';
}

      <div class="rel"><b>${esc(t.eatenBy)}:</b> ${esc(eaten.length ? eaten.join(', ') : t.nobody)}</div>
      <div class="rel"><b>${esc(t.chainsHere)}:</b> ${esc(chains.join('  ·  '))}</div>
      <div class="acts">${alive ? `<button class="chip" data-a="fewer">${esc(t.fewer)}</button><button class="chip" data-a="more">${esc(t.more)}</button><button class="chip" data-a="remove">${esc(t.remove)}</button>`
        : `<button class="chip" data-a="back">${esc(t.back)}</button>`}</div>`);
    $('spCnt').textContent = alive ? countOf(i) : t.gone;
  }

  // readout
  const st = status(), alive = Array.from(S.y).filter((v) => v > 0).length;
  const COL = { calm: '#3ddc97', moving: '#f5a524', settled: '#4ea8ff' };
  lab.setReadout(t.years(nf(S.t, 1)), `${t.inModel} · ${t.alive(alive, web.n)}`, t.status[st], COL[st]);
  lab.setGlow(S.webKey === 'kelp' ? 'rgba(40,120,200,.32)' : st === 'moving' ? 'rgba(245,165,36,.24)' : 'rgba(61,220,151,.20)');

  // state card: a chain, an experiment, the pyramid or the meadow — plus what is changing right now and why
  const rip = ripples();
  const ripHtml = rip.length ? `<div class="ripples"><div class="calm">${esc(t.whatNow)}</div>${rip.map(rippleText).join('')}</div>` : `<div class="calm">${esc(st === 'settled' ? t.settled : t.calm)}</div>`;
  let fine = t.fine;
  if (lab.view === 'pyramid') fine += ' ' + t.finePyr;
  if (S.webKey === 'kelp') fine += ' ' + t.fineKelp;
  const fineHtml = `<div class="fine">${esc(fine)}</div>`;
  let emo = '🕸️', title, lead, body;
  if (S.chain !== null) {
    const c = web.chainIdx[S.chain], C = t.chainT, last = c[c.length - 1];
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    title = C.title; emo = '⛓️';
    lead = cap(c.map((i) => nameOf(i, 'low')).join(' → '));
    const parts = c.map((i, pos) => C.is(nameOf(i, 'subj'), C.role[pos]));
    if (!web.links.some((l) => l.from === last)) parts.push(C.apex(nameOf(last, 'subj'), t.sp[web.sp[last].k]));
    body = `${parts.join(' ')} ${C.tail} ${web.chains.length > 1 ? C.web : ''}`;
  } else if (S.exp && S.pred?.key === S.exp && !S.pred.asking) {
    const E = t.exp[S.exp]; emo = EXP_EMO[S.exp]; title = E.name; lead = E.did;
    body = S.pred.done ? (S.pred.opening ? t.open.why : E.why) : '';
  } else if (S.exp && !S.pred) {
    const E = t.exp[S.exp]; emo = EXP_EMO[S.exp]; title = E.name; lead = E.did; body = '';
  } else if (lab.view === 'pyramid') { emo = '🔺'; ({ title, lead, body } = t.pyr); body += ' ' + (S.webKey === 'meadow' ? t.pyr.also : ''); }
  else { const I = S.webKey === 'kelp' ? t.kelpIntro : t.intro; emo = S.webKey === 'kelp' ? '🌊' : '🌾'; ({ title, lead, body } = I); }
  lab.setState({ emo, title, lead, body, extra: ripHtml + fineHtml });
  renderOverlay();
}

// --- drawing ------------------------------------------------------------------------------------------------
const EMOJI = (px) => `${px}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
let geo = {};
function hash(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function drawUrchin(c, x, y, r) {
  c.strokeStyle = '#c58cf2'; c.lineWidth = Math.max(1, r * 0.08);
  for (let k = 0; k < 18; k++) { const a = k / 18 * 2 * Math.PI; c.beginPath(); c.moveTo(x + Math.cos(a) * r * 0.5, y + Math.sin(a) * r * 0.5); c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); c.stroke(); }
  c.fillStyle = '#8b3fd0'; c.beginPath(); c.arc(x, y, r * 0.55, 0, 7); c.fill();
}
function icon(c, s, x, y, px) {
  if (s.k === 'urchin') return drawUrchin(c, x, y, px * 0.55);
  c.font = EMOJI(px); c.fillText(s.emo, x, y + px * 0.05);
}
function inChain(i) { return S.chain === null || W().chainIdx[S.chain].includes(i); }
function linkInChain(l) {
  if (S.chain === null) return true;
  const c = W().chainIdx[S.chain];
  return c.some((v, p) => v === l.from && c[p + 1] === l.to);
}

function drawWeb(c, w, h, time) {
  const t = T[lang], web = W(), kelp = S.webKey === 'kelp';
  const strip = h >= 470 && w >= 420, webH = strip ? h * 0.74 : h;
  // background: meadow ground or sea
  const bg = c.createLinearGradient(0, 0, 0, webH);
  if (kelp) { bg.addColorStop(0, 'rgba(40,110,190,.18)'); bg.addColorStop(1, 'rgba(10,40,90,.35)'); }
  else { bg.addColorStop(0, 'rgba(60,110,200,.05)'); bg.addColorStop(0.8, 'rgba(61,220,151,.04)'); bg.addColorStop(1, 'rgba(61,220,151,.12)'); }
  c.fillStyle = bg; c.beginPath(); c.roundRect ? c.roundRect(0, 0, w, webH, 18) : c.rect(0, 0, w, webH); c.fill();
  // the plant cover along the bottom: tufts of grass or kelp fronds, as many as the plant's amount
  const plantY = S.y[0], tufts = Math.round(clamp(plantY, 0, 3) * 16);
  for (let k = 0; k < 48; k++) {
    if (k >= tufts) break;
    const x = 8 + hash(k) * (w - 16), base = webH - 4, sway = Math.sin(time * 1.3 + k) * (kelp ? 6 : 2);
    const hh = (kelp ? 34 : 14) + hash(k + 99) * (kelp ? 30 : 10);
    c.strokeStyle = kelp ? 'rgba(120,170,80,.55)' : 'rgba(61,220,151,.55)'; c.lineWidth = kelp ? 3 : 2; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x, base); c.quadraticCurveTo(x + sway * 0.5, base - hh * 0.5, x + sway, base - hh); c.stroke();
    if (!kelp) { c.beginPath(); c.moveTo(x + 3, base); c.quadraticCurveTo(x + 4 + sway, base - hh * 0.4, x + 6 + sway, base - hh * 0.75); c.stroke(); }
  }
  // the arrow note
  const fs = clamp(w * 0.03, 10.5, 13);
  c.font = `800 ${fs}px Nunito, sans-serif`; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = '#C6CDE0';
  let note = [t.arrowNote];
  if (c.measureText(t.arrowNote).width > w - 24) { const k = t.arrowNote.indexOf(': '); note = [t.arrowNote.slice(0, k + 1), t.arrowNote.slice(k + 2)]; }
  note.forEach((ln, j) => c.fillText(ln, 12, 14 + j * (fs + 3)));
  // node positions
  const R = clamp(Math.min(w, webH) * 0.068, 17, 32), padX = R * 1.9, top = 30 + (note.length - 1) * (fs + 3) + R, bot = R * 1.6 + 18;
  const nodes = web.sp.map((s) => ({ x: padX + s.x * (w - 2 * padX), y: top + (s.y - 0.1) / 0.8 * (webH - top - bot), r: R }));
  geo.nodes = nodes;
  // links: from the eaten to the eater, with energy dots running along them
  web.links.forEach((l) => {
    const a = nodes[l.from], b = nodes[l.to], dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const x0 = a.x + ux * (R + 3), y0 = a.y + uy * (R + 3), x1 = b.x - ux * (R + 5), y1 = b.y - uy * (R + 5);
    const live = S.y[l.from] > 0 && S.y[l.to] > 0, on = linkInChain(l) && (S.sel === null || l.from === S.sel || l.to === S.sel);
    const flow = live ? clamp(S.y[l.from] * S.y[l.to], 0, 4) : 0;
    c.globalAlpha = on ? 1 : 0.18;
    c.strokeStyle = live ? 'rgba(237,239,247,.45)' : 'rgba(130,145,190,.35)'; c.lineWidth = live ? 1.4 + Math.min(2, flow * 0.7) : 1.2;
    c.setLineDash(live ? [] : [4, 5]);
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); c.setLineDash([]);
    // arrowhead at the eater
    const ah = clamp(R * 0.42, 7, 12);
    c.fillStyle = live ? '#EDEFF7' : 'rgba(130,145,190,.5)';
    c.beginPath(); c.moveTo(x1 + ux * 2, y1 + uy * 2); c.lineTo(x1 - ux * ah - uy * ah * 0.55, y1 - uy * ah + ux * ah * 0.55); c.lineTo(x1 - ux * ah + uy * ah * 0.55, y1 - uy * ah - ux * ah * 0.55); c.closePath(); c.fill();
    if (live) {
      c.fillStyle = '#ffd25a';
      for (let k = 0; k < 3; k++) {
        const f = (S.anim * 0.7 + k / 3 + l.from * 0.13) % 1, px = lerp(x0, x1 - ux * ah, f), py = lerp(y0, y1 - uy * ah, f);
        c.beginPath(); c.arc(px, py, clamp(1.6 + 1.4 * Math.sqrt(flow), 1.5, 4.5), 0, 7); c.fill();
      }
    }
    c.globalAlpha = 1;
  });
  // nodes, each with a little herd of icons circling it (more icons = more animals)
  c.textAlign = 'center'; c.textBaseline = 'middle';
  web.sp.forEach((s, i) => {
    const n = nodes[i], y = S.y[i], alive = y > 0, dim = !inChain(i);
    c.globalAlpha = dim ? 0.25 : 1;
    if (!s.prod && alive) {
      const k = clamp(Math.round(y * 4), 1, 14), rr = R * 1.42, px = clamp(R * 0.48, 10, 15);
      for (let j = 0; j < k; j++) {
        const a = j / k * 2 * Math.PI + S.anim * 0.35 * (i % 2 ? 1 : -1) + i, bob = Math.sin(time * 3 + j * 1.7) * 1.5;
        c.globalAlpha = (dim ? 0.2 : 0.75);
        icon(c, s, n.x + Math.cos(a) * rr, n.y + Math.sin(a) * rr * 0.8 + bob, px);
      }
      c.globalAlpha = dim ? 0.25 : 1;
    }
    // disc and role ring
    c.fillStyle = 'rgba(14,17,28,.92)'; c.beginPath(); c.arc(n.x, n.y, R, 0, 7); c.fill();
    c.strokeStyle = alive ? ROLE_COL[s.lvl] : 'rgba(130,145,190,.45)'; c.lineWidth = S.sel === i ? 5 : 3;
    c.beginPath(); c.arc(n.x, n.y, R, 0, 7); c.stroke();
    if (S.sel === i) { c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.beginPath(); c.arc(n.x, n.y, R + 5, 0, 7); c.stroke(); }
    c.globalAlpha = alive ? (dim ? 0.25 : 1) : 0.3;
    icon(c, s, n.x, n.y, R * 1.05);
    c.globalAlpha = dim ? 0.25 : 1;
    if (!alive) { c.strokeStyle = '#ff3b30'; c.lineWidth = 3; c.beginPath(); c.moveTo(n.x - R * 0.6, n.y - R * 0.6); c.lineTo(n.x + R * 0.6, n.y + R * 0.6); c.moveTo(n.x + R * 0.6, n.y - R * 0.6); c.lineTo(n.x - R * 0.6, n.y + R * 0.6); c.stroke(); }
    // label: name · count
    const lf = clamp(R * 0.42, 10.5, 13), ly = n.y + R * 1.42 + lf * 0.9;
    const txt = `${nameOf(i)} · ${alive ? countOf(i) : '0'}`;
    c.font = `800 ${lf}px Nunito, sans-serif`;
    const tw = c.measureText(txt).width;
    const lx = clamp(n.x, tw / 2 + 4, w - tw / 2 - 4);
    c.fillStyle = 'rgba(10,12,20,.78)'; c.beginPath(); c.roundRect ? c.roundRect(lx - tw / 2 - 6, ly - lf * 0.75, tw + 12, lf * 1.5, 8) : c.rect(lx - tw / 2 - 6, ly - lf * 0.75, tw + 12, lf * 1.5); c.fill();
    c.fillStyle = alive ? '#EDEFF7' : '#98A0B8'; c.fillText(txt, lx, ly + 0.5);
    c.globalAlpha = 1;
  });
  if (strip) drawChart(c, 8, webH + 10, w - 16, h - webH - 14, true);
}

// populations as % of normal over the last 12 years
function drawChart(c, X, Y, Wd, Hd, mini = false) {
  const t = T[lang], web = W(), H = S.hist;
  if (!mini) { c.fillStyle = 'rgba(14,17,28,.55)'; c.beginPath(); c.roundRect ? c.roundRect(X, Y, Wd, Hd, 16) : c.rect(X, Y, Wd, Hd); c.fill(); }
  const padL = mini ? 30 : 40, padR = mini ? 24 : 34, padT = mini ? 6 : 30, padB = mini ? 14 : 26;
  const x0 = X + padL, x1 = X + Wd - padR, y0 = Y + padT, y1 = Y + Hd - padB;
  const tEnd = Math.max(S.t, mini ? 6 : 10), tStart = Math.max(0, tEnd - (mini ? 6 : 12));
  const vis = H.filter((p) => p.t >= tStart);
  let vmax = 2; vis.forEach((p) => p.y.forEach((v) => { vmax = Math.max(vmax, v); }));
  vmax = Math.ceil(vmax * 2) / 2;
  const px = (tt) => x0 + (tt - tStart) / (tEnd - tStart) * (x1 - x0), py = (v) => y1 - v / vmax * (y1 - y0);
  // grid
  c.font = `700 ${mini ? 9.5 : 10.5}px Nunito, sans-serif`; c.textBaseline = 'middle';
  for (let v = 0; v <= vmax + 1e-9; v += vmax > 3 ? 1 : 0.5) {
    if (mini && v !== 0 && v !== 1 && v !== vmax) continue;
    c.strokeStyle = v === 1 ? 'rgba(237,239,247,.4)' : 'rgba(130,145,190,.15)'; c.lineWidth = 1; c.setLineDash(v === 1 ? [5, 5] : []);
    c.beginPath(); c.moveTo(x0, py(v)); c.lineTo(x1, py(v)); c.stroke(); c.setLineDash([]);
    c.fillStyle = v === 1 ? '#EDEFF7' : '#646C84'; c.textAlign = 'right'; c.fillText(`${nf(v * 100)}%`, x0 - 5, py(v));
  }
  if (!mini) {
    c.fillStyle = '#98A0B8'; c.textAlign = 'left'; c.fillText(`100% = ${t.normal}`, x0 + 4, py(1) - 9);
    c.font = '800 12px Nunito, sans-serif'; c.fillStyle = '#C6CDE0'; c.fillText(t.pct, x0, Y + 15);
    c.font = '700 10.5px Nunito, sans-serif'; c.fillStyle = '#646C84'; c.textAlign = 'center';
    for (let k = Math.ceil(tStart); k <= tEnd; k += tEnd - tStart > 8 ? 2 : 1) c.fillText(String(k), px(k), y1 + 12);
    c.textAlign = 'right'; c.fillText(t.yrs, x1 + padR - 4, y1 + 12);
  }
  // events
  c.textAlign = 'center';
  S.events.filter((e) => e.t >= tStart).forEach((e) => {
    const ex = px(e.t);
    c.strokeStyle = 'rgba(255,255,255,.25)'; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(ex, y0); c.lineTo(ex, y1); c.stroke(); c.setLineDash([]);
    if (!mini) { c.font = EMOJI(12); c.fillText(e.emo, ex, y0 - 8); }
  });
  // lines
  const ends = [];
  web.sp.forEach((s, i) => {
    const hl = S.sel === null ? (S.chain === null || inChain(i)) : S.sel === i;
    c.strokeStyle = s.col; c.globalAlpha = hl ? 1 : 0.3; c.lineWidth = (S.sel === i ? 3.5 : 2) * (mini ? 0.8 : 1); c.lineJoin = 'round';
    c.beginPath(); vis.forEach((p, k) => { const xx = px(p.t), yy = py(p.y[i]); k ? c.lineTo(xx, yy) : c.moveTo(xx, yy); }); c.stroke();
    c.globalAlpha = 1;
    if (vis.length) ends.push({ i, y: py(vis[vis.length - 1].y[i]), hl });
  });
  // emoji at the end of each line, nudged apart so they don't overlap
  ends.sort((a, b) => a.y - b.y);
  const gap = mini ? 11 : 15;
  for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < gap) ends[k].y = ends[k - 1].y + gap;
  const over = ends.length ? ends[ends.length - 1].y - y1 : 0;
  if (over > 0) ends.forEach((e) => { e.y -= over; });
  c.textBaseline = 'middle';
  ends.forEach((e) => { c.globalAlpha = e.hl ? 1 : 0.45; icon(c, web.sp[e.i], x1 + (mini ? 11 : 15), e.y, mini ? 11 : 14); });
  c.globalAlpha = 1;
}

// the energy pyramid: a rule-of-thumb picture, not the model. Of every 10 energy packets, about 1 goes up a level.
const parts = [];
function drawPyramid(c, w, h, dt) {
  const t = T[lang], P = t.pyr, web = W(), levels = web.pyramid;
  const nL = levels.length, top = 46, bot = h - 12, lh = (bot - top) / nL, maxW = Math.min(w - 24, 620), cx = w / 2;
  const tf = clamp(w * 0.034, 15, 22);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = '#fff'; c.font = `500 ${tf}px "EB Garamond", serif`; c.fillText(P.top, cx, 18);
  const bars = levels.map((sp, L) => {
    const bw = maxW * (1 - L / (nL + 0.4)), y = bot - (L + 1) * lh + 4;
    return { x: cx - bw / 2, y, w: bw, h: lh - 8, sp };
  });
  bars.forEach((b, L) => {
    c.fillStyle = ROLE_COL[Math.min(L, 3)] + '33'; c.strokeStyle = ROLE_COL[Math.min(L, 3)]; c.lineWidth = 2;
    c.beginPath(); c.roundRect ? c.roundRect(b.x, b.y, b.w, b.h, 10) : c.rect(b.x, b.y, b.w, b.h); c.fill(); c.stroke();
    const lf = clamp(b.h * 0.2, 10, 13), ef = clamp(b.h * 0.34, 14, 26);
    c.fillStyle = '#EDEFF7'; c.font = `800 ${lf}px Nunito, sans-serif`;
    c.fillText(P.levels[L], cx, b.y + b.h * 0.27);
    const em = b.sp.map((k) => web.sp[web.id[k]]);
    em.forEach((s, j) => icon(c, s, cx + (j - (em.length - 1) / 2) * ef * 1.35, b.y + b.h * 0.65, ef));
    // energy number: 10 000, 1 000, 100, 10
    const units = nf(10000 / Math.pow(10, L));
    c.font = `900 ${lf}px Nunito, sans-serif`; c.fillStyle = '#ffd25a';
    if (b.w > 260) { c.textAlign = 'right'; c.fillText(units, b.x + b.w - 10, b.y + b.h * 0.5); c.textAlign = 'center'; }
    else { c.textAlign = 'left'; c.fillText(units, b.x + b.w + 8, b.y + b.h * 0.5); c.textAlign = 'center'; }
  });
  c.font = `700 ${clamp(w * 0.022, 9.5, 11.5)}px Nunito, sans-serif`; c.fillStyle = '#98A0B8';
  c.fillText(`${P.units}  ·  ${P.heat}`, cx, 38);
  // energy packets
  for (let k = 0; k < (dt * 40 | 0) + (Math.random() < (dt * 40) % 1 ? 1 : 0); k++) {
    const b = bars[0]; parts.push({ x: b.x + 10 + Math.random() * (b.w - 20), y: b.y + b.h - 6, L: 0, heat: false, a: 1, vx: 0 });
  }
  for (let k = parts.length - 1; k >= 0; k--) {
    const p = parts[k];
    if (!bars[p.L]) { parts.splice(k, 1); continue; }
    if (p.heat) { p.x += p.vx * dt; p.y -= 12 * dt; p.a -= dt * 0.9; }
    else {
      p.y -= 38 * dt;
      const b = bars[p.L];
      if (p.y < b.y + 4) {
        if (p.L + 1 < bars.length && Math.random() < 0.1) { p.L++; const nb = bars[p.L]; p.x = clamp(p.x, nb.x + 8, nb.x + nb.w - 8); }
        else { p.heat = true; p.vx = (p.x < cx ? -1 : 1) * (20 + Math.random() * 30); }
      }
    }
    if (p.a <= 0 || p.y < 0) { parts.splice(k, 1); continue; }
    c.globalAlpha = Math.max(0, p.a);
    c.fillStyle = p.heat ? '#ff6a3d' : '#ffd25a';
    c.beginPath(); c.arc(p.x, p.y, p.heat ? 1.8 : 2.6, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  if (parts.length > 900) parts.splice(0, parts.length - 900);
}

let uiClock = 0;
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.playing) { advance(dt * YPS * S.speed); S.anim += dt * S.speed; }
  if (S.toast) { S.toastT -= dt; if (S.toastT <= 0) { S.toast = null; renderOverlay(); } }
  uiClock += dt;
  if (S.playing && uiClock > 0.25) { uiClock = 0; render(); }
  if (lab.view === 'web') drawWeb(c, w, h, time);
  else if (lab.view === 'chart') drawChart(c, 0, 0, w, h);
  else drawPyramid(c, w, h, dt);
});
resetWeb('meadow');
S.playing = S.asked;
render();
</script>
</body>
</html>
