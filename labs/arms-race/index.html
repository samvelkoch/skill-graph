// model: 30 years, 1 token = 100 in the model. Every year each side sets its stock to fear × the other side's stock, ±3 % noise.
// Both sides update at the same time, so on every second year the balance is exactly the starting balance (100 : 80) times the noise:
// the safety meter is read on those years, which keeps it steady instead of flipping between 1.25 and 0.8.
const START = [100, 80], TY = 15, YEARS = 30;
const NOISE = (() => { // fixed ±3 % noise, so a run always looks the same
  let s = 20261101;
  const rnd = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  return Array.from({ length: YEARS }, () => [1 + (rnd() * 2 - 1) * 0.03, 1 + (rnd() * 2 - 1) * 0.03]);
})();
function simulate(fear, treaty) {
  const B = [START[0]], R = [START[1]];
  for (let t = 0; t < YEARS; t++) {
    const f = treaty && t + 1 >= TY ? 0.9 : fear;
    B.push(f * R[t] * NOISE[t][0]); R.push(f * B[t] * NOISE[t][1]);
  }
  const max = Math.max(...B, ...R), p = 10 ** Math.floor(Math.log10(max * 1.05)), m = (max * 1.05) / p;
  const yMax = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  // tokens per drawn disc, shared by both piles, chosen from the biggest stock of the run
  const steps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000, 2000000, 5000000];
  const k = steps.find((x) => max / 100 / x <= 36) || steps[steps.length - 1];
  return { B, R, yMax, k };
}

// --- small helpers -------------------------------------------------------------------------------------------
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);
const easeBack = (t) => { t = clamp01(t); const s = 1.70158; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const chase = (v, target, rate, dt) => v + (target - v) * (1 - Math.exp(-dt * rate));
const fmt = (n) => { n = Math.round(n); return n < 1000 ? String(n) : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, lang === 'en' ? ',' : ' '); };
const fmtC = (n) => { // compact for big model numbers
  if (n < 10000) return fmt(n);
  try { return new Intl.NumberFormat(lang === 'ru' ? 'ru-RU' : lang === 'hu' ? 'hu-HU' : 'en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(n); } catch { return fmt(n); }
};
const dec = (x, d = 2) => { const s = x.toFixed(d); return lang === 'en' ? s : s.replace('.', ','); };
const val = (arr, y) => { const i = Math.min(arr.length - 1, Math.floor(y)), j = Math.min(arr.length - 1, i + 1), f = y - i; return arr[i] * (1 - f) + arr[j] * f; };
const showStage = () => {

};

function pill(c, text, x, y, o = {}) { // text on a dark rounded pill, kept inside the canvas
  c.save();
  c.font = `${o.weight || 800} ${o.size || 12}px Nunito, sans-serif`;
  const pw = c.measureText(text).width + 16, ph = 22;
  let px = o.align === 'right' ? x - pw : o.align === 'left' ? x : x - pw / 2, py = o.top ? y : y - ph / 2;
  px = clamp(px, 4, Math.max(4, CW - pw - 4)); py = clamp(py, 4, Math.max(4, CH - ph - 4));
  c.fillStyle = o.bg || 'rgba(12,15,26,.82)'; c.beginPath(); c.roundRect(px, py, pw, ph, 11); c.fill();
  if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = 1.2; c.stroke(); }
  c.fillStyle = o.col || '#EDEFF7'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(text, px + 8, py + ph / 2 + 0.5);
  c.restore();
}
function blob(c, pts, ox, oy, sx, sy) { // closed smooth shape through the midpoints of a polygon
  const P = pts.map(([x, y]) => [ox + x * sx, oy + y * sy]), n = P.length;
  c.beginPath(); c.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
  for (let i = 0; i < n; i++) { const p = P[i], q = P[(i + 1) % n]; c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
  c.closePath();
}
function panel(c, x, y, w, h, r = 14) { // a dark rounded chart panel
  const g = c.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, '#171d36'); g.addColorStop(1, '#0d1122');
  c.fillStyle = g; c.beginPath(); c.roundRect(x, y, w, h, r); c.fill();
  c.strokeStyle = 'rgba(130,145,190,.28)'; c.lineWidth = 1; c.stroke();
}
function dot(c, x, y, r, col) { // a glowing dot with a white rim
  c.save(); c.fillStyle = 'rgba(12,15,26,.8)'; c.beginPath(); c.arc(x, y, Math.max(0, r + 2.5), 0, TAU); c.fill();
  c.fillStyle = col; c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); c.fill();
  c.fillStyle = 'rgba(255,255,255,.75)'; c.beginPath(); c.arc(x - r * 0.3, y - r * 0.3, Math.max(0, r * 0.32), 0, TAU); c.fill();
  c.restore();
}

// --- picture 1: forts, token piles, the two lines --------------------------------------------------------------
function fort(c, x, base, s, col, dark, flagDir, time) {
  const W = 64 * s, H = 46 * s;
  c.save(); c.lineJoin = 'round'; c.lineWidth = 1.5; c.strokeStyle = '#262c42';
  c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(x + 4 * s, base + 2 * s, W * 0.62, 7 * s, 0, 0, TAU); c.fill();
  const stone = c.createLinearGradient(x - W / 2, base - H, x + W / 2, base);
  stone.addColorStop(0, '#b3bbcf'); stone.addColorStop(1, '#6a738d');
  const part = (px, py, pw, ph) => { c.fillStyle = stone; c.beginPath(); c.roundRect(px, py, pw, ph, 3 * s); c.fill(); c.stroke(); };
  const tw = W * 0.26;
  part(x - W * 0.36, base - H * 0.68, W * 0.72, H * 0.68);        // wall
  part(x - W / 2, base - H, tw, H);                               // left tower
  part(x + W / 2 - tw, base - H, tw, H);                          // right tower
  c.fillStyle = stone;                                            // battlements
  for (const bx of [x - W / 2, x + W / 2 - tw]) for (let i = 0; i < 3; i++) { c.beginPath(); c.rect(bx + i * tw * 0.4, base - H - 5 * s, tw * 0.22, 5 * s); c.fill(); c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(x - W / 2 + 2, base - H + 3, 3 * s, H - 8);   // light from the top left
  c.fillStyle = col; c.beginPath(); c.roundRect(x - W * 0.17, base - H * 0.62, W * 0.34, 8 * s, 2); c.fill(); c.stroke(); // banner in the side colour
  c.fillStyle = '#161a2c'; c.beginPath(); c.moveTo(x - W * 0.11, base); c.lineTo(x - W * 0.11, base - H * 0.2); c.quadraticCurveTo(x, base - H * 0.42, x + W * 0.11, base - H * 0.2); c.lineTo(x + W * 0.11, base); c.closePath(); c.fill(); // gate
  const px = x + flagDir * (W / 2 - tw / 2), top = base - H - 5 * s;    // flag
  c.strokeStyle = '#262c42'; c.lineWidth = 2; c.beginPath(); c.moveTo(px, top); c.lineTo(px, top - 18 * s); c.stroke();
  const wv = Math.sin(time * 3 + flagDir) * 2 * s;
  c.fillStyle = col; c.lineWidth = 1.2; c.strokeStyle = dark; c.beginPath();
  c.moveTo(px, top - 18 * s); c.quadraticCurveTo(px + flagDir * 9 * s, top - 20 * s + wv, px + flagDir * 17 * s, top - 15 * s + wv); c.quadraticCurveTo(px + flagDir * 9 * s, top - 11 * s - wv, px, top - 8 * s); c.closePath(); c.fill(); c.stroke();
  c.restore();
}
function disc(c, x, y, rx, th) { // a grey token: a short cylinder
  const ry = rx * 0.42;
  c.save(); c.lineWidth = 1; c.strokeStyle = '#2a3046';
  const g = c.createLinearGradient(x - rx, 0, x + rx, 0);
  g.addColorStop(0, '#b4bccf'); g.addColorStop(0.45, '#8e98ad'); g.addColorStop(1, '#5f677e');
  c.fillStyle = g;
  c.beginPath(); c.ellipse(x, y + th, rx, ry, 0, 0, TAU); c.fill(); c.stroke();
  c.fillRect(x - rx, y, rx * 2, th);
  c.beginPath(); c.moveTo(x - rx, y); c.lineTo(x - rx, y + th); c.moveTo(x + rx, y); c.lineTo(x + rx, y + th); c.stroke();
  c.beginPath(); c.ellipse(x, y + th, rx - 0.5, ry - 0.3, 0, 0, Math.PI); c.fillStyle = g; c.fill();
  c.fillStyle = '#c9d0e0'; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.ellipse(x - rx * 0.25, y - ry * 0.2, rx * 0.4, ry * 0.35, 0, 0, TAU); c.fill();

}
$('arFear').addEventListener('input', (ev) => {
  S.fear = +ev.target.value; S.series = simulate(S.fear, S.treaty); S.yr = YEARS; S.playing = false; S.meterKey = '';
  $('arFearV').textContent = dec(S.fear); lastRead = '';
});
$('arYear').addEventListener('input', (ev) => {
  if (S.auto !== null) { ev.target.value = S.year; return; }
  let y = +ev.target.value; const gate = S.q1 === null ? 1960 : S.q2 === null ? 1986 : Y1;
  if (y > gate) { y = gate; ev.target.value = y; }
  S.year = y; S.yearF = y; render();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'real') {
    let best = null, bd = 24;
    for (const p of GEO.pins) { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } }
    if (best) { S.sel = S.sel === best.year ? null : best.year; sfx.click(); render(); }
  } else if (lab.view === 'crisis') {
    let best = null, bd = 22;
    for (const n of GEO.nodes) { const d = Math.hypot(n.x - x, n.y - y); if (n.ok && d < bd) { bd = d; best = n; } }
    if (best && best.i !== S.step) goStep(best.i);
  }
});

// --- one render per change ---------------------------------------------------------------------------------------
const thumb = (i) => {
  const lines = [
    [['M6 46 L24 45 L42 46 L60 44 L84 45', BLUE], ['M6 49 L24 48 L42 48 L60 47 L84 48', RED]],
    [['M6 43 C28 41 52 28 84 8', BLUE], ['M6 45 C28 47 52 50 84 51', RED]],
    [['M6 45 C38 44 60 38 84 7', BLUE], ['M6 48 C40 47 64 42 84 12', RED]],
  ][i];
  return `<svg viewBox="0 0 90 58" aria-hidden="true"><rect x="1" y="1" width="88" height="56" rx="8" fill="#10152a" stroke="rgba(130,145,190,.35)"/><path d="M6 53 H84 M6 53 V6" stroke="rgba(190,205,255,.35)" fill="none" stroke-width="1"/>${lines.map(([d, col]) => `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round"/>`).join('')}</svg>`;
};
function qHTML(t, q, opts, ans, ok, act, extra, ex) { // a question with its options; after the answer the right one turns green
  const done = ans !== null;
  return `<div class="ar-q">${esc(q)}</div><div class="ar-opts">${opts.map((o, i) => `<button class="ar-opt ${done ? (i === ok ? 'right' : i === ans ? 'wrong' : '') : ''}" data-act="${act}" data-i="${i}"${extra}${done ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`
    + (done ? `<div class="ar-vd"><div class="v ${ans === ok ? 'ok' : 'no'}">${esc(ans === ok ? t.right : t.notQuite)}</div><p>${esc(ex)}</p></div>` : '');
}
function renderSpiral(t) {
  $('arRule').textContent = t.rule;
  const asked = S.sAns !== null, done = S.ran && !S.playing;
  if (!asked) {
    $('arSpQ').innerHTML = `<div class="ar-q">${esc(t.spiralQ)}</div><div class="ar-opts ar-opts3">${t.spiralOpts.map((o, i) => `<button class="ar-opt" data-act="sopt" data-i="${i}">${thumb(i)}<span>${esc(o)}</span></button>`).join('')}</div>`;
  } else if (!S.ran) {
    $('arSpQ').innerHTML = `<div class="ar-opts ar-opts3">${t.spiralOpts.map((o, i) => `<button class="ar-opt ${i === 2 ? 'right' : i === S.sAns ? 'wrong' : ''}" disabled>${thumb(i)}<span>${esc(o)}</span></button>`).join('')}</div>
      <div class="ar-vd"><div class="v ${S.sAns === 2 ? 'ok' : 'no'}">${esc(S.sAns === 2 ? t.right : t.notQuite)}</div></div>
      <div class="ar-nav"><button class="btn" data-act="run">${esc(t.run30)}</button></div>`;
  } else $('arSpQ').innerHTML = '';
  $('arSpDone').hidden = !S.ran;
  $('arSpVd').innerHTML = done ? `<p>${esc(t.exSpiral)}</p>` : '';
  $('arSafeTxt').textContent = done ? t.exSafety : '';
  $('arFearL').textContent = t.fear; $('arFearV').textContent = dec(S.fear);
  $('arFear').disabled = !done; $('arTreaty').disabled = !done; $('arReplay').disabled = !done;
  $('arTreaty').textContent = t.treaty; $('arTreaty').classList.toggle('on', S.treaty); $('arReplay').textContent = t.replay;
  $('arTreatyTxt').textContent = S.treaty && done ? t.exTreaty : '';
  S.meterKey = ''; if (S.ran) liveMeters();
  return done ? { emo: '🌀', title: t.state.spiralDone[0], lead: t.state.spiralDone[1] } : { emo: '🌀', title: t.state.spiral0[0], lead: t.state.spiral0[1] };
}
function renderReal(t) {
  $('arYL').textContent = t.yearLbl; $('arYV').textContent = String(S.year);
  const yi = $('arYear'); if (+yi.value !== S.year) yi.value = S.year;
  const p1 = S.q1 === null && S.year === 1960 && S.auto === null, q1show = S.q1 !== null && S.q2 === null, q2on = S.q1 !== null && (S.year === 1986 || S.q2 !== null);
  let h = '';
  if (p1 || (S.q1 !== null && !q2on)) h = qHTML(t, t.realQ1, t.realOpts1, S.q1, 1, 'ropt', ' data-q="1"', t.exReal1);
  else if (q1show || S.q2 !== null) {
    if (S.q1 !== null) h += `<div class="ar-vd" style="margin:0 0 10px"><p>${esc(t.exReal1)}</p></div>`;
    h += qHTML(t, t.realQ2, t.realOpts2, S.q2, 1, 'ropt', ' data-q="2"', t.exReal2);
  }
  $('arReQ').innerHTML = h;
  const vis = EVENTS.filter(([y]) => y <= S.year && evOpen(y));
  $('arEv').innerHTML = S.sel !== null && S.sel <= S.year ? `<div class="ar-ev">📌 ${esc(realEvent(S.sel))}</div>` : vis.length ? `<div class="ar-hint">${esc(t.pinHint)}</div>` : '';
  const end = S.q2 !== null && S.auto === null && S.year === Y1;
  return end ? { emo: '📉', title: t.state.realDone[0], lead: t.state.realDone[1] } : { emo: '📈', title: t.state.real0[0], lead: t.state.real0[1] };
}
function renderCrisis(t) {
  const st = STEPS[S.step], q = st.q, ans = q ? S.ans[q] : null, pend = q && ans === null, last = S.step === STEPS.length - 1;
  let h = '';
  if (q) h += qHTML(t, t[q], t[q + 'Opts'], ans, 1, 'copt', ` data-q="${q}"`, t[q === 'q3' ? 'ex3' : 'ex5']);
  h += `<div class="ar-nav"><button class="chip ar" data-act="cprev" aria-label="${esc(t.prev)}" title="${esc(t.prev)}"${S.step ? '' : ' disabled'}>◀</button>`
    + (last ? `<button class="btn" data-act="cagain">${esc(t.replay)}</button>` : `<button class="btn" data-act="cnext"${pend ? ' disabled' : ''}>${esc(t.next)}</button>`) + '</div>';
  $('arCr').innerHTML = h;
  if (last) return { emo: '🌍', title: t.state.crisisDone[0], lead: t.steps.s6, body: t.state.crisisDone[1] };
  if (pend) return { emo: '📅', title: t.state.crisis0[0], lead: q === 'q5' ? t.dateLong(st.d) : t.steps[st.k], body: '' }; // a neutral emoji while the answer is hidden
  return { emo: st.emo, title: t.state.crisis0[0], lead: t.steps[st.k], body: S.step === 0 ? t.state.crisis0[1] : '' };
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  $('arSp').style.display = !sec && v === 'spiral' ? '' : 'none';
  $('arRe').style.display = !sec && v === 'real' ? '' : 'none';
  $('arCr').style.display = !sec && v === 'crisis' ? '' : 'none';
  const st = v === 'spiral' ? renderSpiral(t) : v === 'real' ? renderReal(t) : renderCrisis(t);
  const info = sec === 'a' ? { emo: '☎️', title: t.secrets.hotline[0], lead: t.secretA, body: '' } : sec === 'b' ? { emo: '🫡', title: t.secrets.arkhipov[0], lead: t.secretB, body: '' } : st;
  lab.setState({ ...info, body: info.body || '', extra: `<div class="ar-fine">${esc(t.fine)}</div>` });
  lab.setFacts(v === 'real' && S.q2 === null ? [] : t.facts[v]); // the real-view facts name the 1986 peak and the treaties, so they wait for the answer
  lab.setGlow(v === 'spiral' ? 'rgba(90, 150, 255, .26)' : v === 'real' ? 'rgba(255, 110, 90, .22)' : 'rgba(70, 150, 190, .26)');
  const open = secret.unlocked();
  const sc = (k, emo, key) => `<button class="chip ar secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('arSec').innerHTML = sc('a', '☎️', 'hotline') + sc('b', '🫡', 'arkhipov');
  $('arLeg').innerHTML = sec ? '' : v === 'real' ? `<span><i style="background:${BLUE}"></i>${esc(t.legUS)}</span><span><i style="background:${RED}"></i>${esc(t.legSU)}</span>`
    : v === 'crisis' ? `<span><i style="background:#6fa8ff"></i>${esc(t.shipsUS)}</span><span><i style="background:#ff8a7a"></i>${esc(t.shipsSU)}</span>` : '';
  lastRead = ''; syncReadout();
}

// --- the loop (last, so every const above exists before the first frame) ------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  if (S.sec === 'a') return sceneHotline(c, w, h, time);
  if (S.sec === 'b') return sceneSub(c, w, h, time);
  const v = lab.view;
  if (v === 'spiral') drawSpiral(c, w, h, dt, time); else if (v === 'real') drawReal(c, w, h, dt, time); else drawCrisis(c, w, h, dt, time);
});
render();
</script>
</body>
</html>
