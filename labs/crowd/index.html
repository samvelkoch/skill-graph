function drawLife(c, time) {

  let aloud = 0;

    if (flipped) aloud++;

    person(c, x(i), hy, r, i, { look: act && act !== 'silent' && time > at + 0.2 ? [yx, yy] : [180, 400], mood: flipped ? 'smile' : doubter ? 'hmm' : 'smile', hop: dt > 0 && dt < 0.3 ? 5 * Math.sin(dt / 0.3 * Math.PI) : 0 });

let LAY = { s: 1, ox: 0, oy: 0 };
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  LAY = { s, ox, oy };
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#343a6b'); bg.addColorStop(1, '#1c2040');
  c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const rg = c.createRadialGradient(w * 0.2, 0, 0, w * 0.2, 0, w * 0.9); rg.addColorStop(0, 'rgba(255,255,255,.12)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = rg; c.fillRect(0, 0, w, h);

  c.lineJoin = 'round'; c.lineCap = 'round';

let drag = false;

  const r = $('cv').getBoundingClientRect(), y = (ev.clientY - r.top - LAY.oy) / LAY.s;
  const g = S.g, p = clamp(Math.round((PL.y1 - y) / (PL.y1 - PL.y0) * 100), 0, 100);

};
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'group' || S.world || S.g.ran || S.g.running) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - LAY.ox) / LAY.s, y = (ev.clientY - r.top - LAY.oy) / LAY.s;
  if (x < PL.x0 - 24 || x > PL.x1 + 14 || y < PL.y0 - 20 || y > PL.y1 + 14) return;

});
$('cv').addEventListener('pointermove', (ev) => { if (drag) { setPred(ev); render(); } });
const endDrag = () => { drag = false; };
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag);

$('crSlide').addEventListener('input', (ev) => { S.g.n = +ev.target.value; resetG(); sfx.tick(); render(); });

function runSim() {
  const g = S.g; if (g.pred === null || g.running || g.ran) return;
  const p = pctOf(g.n, g.mode, S.priv); g.k = sim(p);
  g.cells = Array.from({ length: 100 }, (_, i) => i < g.k).sort(() => Math.random() - 0.5);
  g.running = true; g.runT = now(); sfx.push();
  clearTimeout(S.gtm);
  S.gtm = setTimeout(() => { g.running = false; g.ran = true; (S.runs[mkey()] ||= {})[g.n] = g.k; sfx.snap(); render(); }, 1450);
}
function runAll() {
  const g = S.g; if (!g.ran) return;
  const m = (S.runs[mkey()] ||= {});
  for (let n = 0; n <= 8; n++) m[n] = sim(pctOf(n, g.mode, S.priv));
  g.k = m[g.n]; g.cells = Array.from({ length: 100 }, (_, i) => i < g.k).sort(() => Math.random() - 0.5); sfx.snap();
}
function answer(i) {
  if (!S.ready || S.ans !== null) return;
  S.ans = i; S.ansT = now(); S.picks[S.r] = { ans: i }; sfx.snap(); render();
  setTimeout(render, 900);
}
function mainBtn() {
  if (S.end) { S.r = 0; S.picks = []; S.end = false; startRound(); }
  else if (S.ans === null) return;
  else if (S.r === 5) { S.end = true; }
  else { S.r++; startRound(); }
  sfx.click(); render();
}
function showStage() {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function doAct(a) {
  S.act = a; S.actT = now(); S.aloudShown = -1; sfx.click(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'ans') answer(+b.dataset.i);
  else if (act === 'main') { mainBtn(); return; }
  else if (act === 'mode') { S.g.mode = +b.dataset.m; resetG(); sfx.click(); }
  else if (act === 'run') { runSim(); }
  else if (act === 'all') { runAll(); }
  else if (act === 'sit') { S.sit = +b.dataset.i; S.act = null; S.aloudShown = -1; sfx.click(); }
  else if (act === 'do') doAct(b.dataset.a);
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'priv') {
      const was = S.priv;
      if (lab.view !== 'group') { S.priv = true; $('views').querySelector('[data-view="group"]')?.click(); }

});

  lab.setReadout(`${S.r + 1}/6`, '', '', '#4ea8ff');
  if (S.ans === null) { lab.setState({ emo: '🪑', title: s.round(S.r + 1), lead: S.ready ? s.turn : s.wait, body: s.ask, extra: '' }); return; }
  const rd = ROUNDS[S.r], a = S.ans;
  const o = a === rd.g && !critical(rd) ? ['🤝', s.same] : a === rd.g ? ['👥', s.with] : a === rd.ok ? ['👁️', s.held] : ['🔤', s.third];
  lab.setState({ emo: o[0], title: o[1][0], lead: o[1][1], body: '', extra: `<div class="fine">${esc(s.fine)}</div>` });
}
function renderGroup(t) {
  const q = t.grp, g = S.g; lab.setGlow('rgba(240, 166, 74, .26)');
  $('crWho').textContent = q.who; $('crN').textContent = g.n; $('crSlide').value = g.n;
  $('crSlide').disabled = g.running;
  $('crPart').innerHTML = q.partner.map((l, i) => `<button class="chip ${g.mode === i ? 'on' : ''}" data-act="mode" data-m="${i}">${esc(l)}</button>`).join('');
  $('crQ2').textContent = g.ran ? '' : q.q; $('crQ2').style.display = g.ran ? 'none' : '';
  $('crRun').textContent = q.run; $('crRun').disabled = g.pred === null || g.running || g.ran;
  $('crAll').textContent = q.all; $('crAll').style.display = g.ran ? '' : 'none';
  const setting = q.set(g.n) + q.setP[g.mode] + (S.priv ? q.setPriv : '');
  const pill = [q.pill[g.mode], S.priv ? q.priv : ''].filter(Boolean).join(' · ');
  if (g.ran) {
    lab.setReadout(g.k, `/ 100 ${q.unit}`, pill, '#f0a64a');
    lab.setState({ emo: '📊', title: q.res(g.k), lead: q.vs(g.pred, g.k), body: setting, extra: `<div class="fine">${esc(q.fine)}</div>` });
  } else {
    lab.setReadout(g.running ? '…' : '?', `100 ${q.unit}`, pill, '#f0a64a');
    lab.setState({ emo: g.running ? '⏳' : '🎯', title: g.running ? q.running : q.guess, lead: g.running ? '' : q.guessLead, body: setting, extra: '' });
  }
}
function renderLife(t) {
  const q = t.life; lab.setGlow('rgba(95, 208, 176, .24)');
  $('crSit').innerHTML = q.sits.map((s, i) => `<button class="chip ${S.sit === i ? 'on' : ''}" data-act="sit" data-i="${i}">${esc(s.chip)}</button>`).join('');
  $('crAct').innerHTML = Object.entries(q.acts).map(([k, l]) => `<button class="chip ${S.act === k ? 'on' : ''}" data-act="do" data-a="${k}">${esc(l)}</button>`).join('');
  const sit = q.sits[S.sit], emo = ['💬', '📝', '🎬', '🚦'][S.sit];
  if (!S.act) { lab.setReadout('0/7', q.aloud, '', '#5fd0b0'); S.aloudShown = 0; lab.setState({ emo, title: sit.t, lead: sit.mine, body: q.pre, extra: '' }); }
  else { S.aloudShown = -1; const e = q.eff[S.act]; lab.setState({ emo: '👁️', title: e[0], lead: e[1], body: sit.t, extra: `<div class="fine">${esc(q.fine)}</div>` }); }
}
render();
</script>
