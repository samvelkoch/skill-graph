const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function runAvg() {
  const G = S.g; G.seed = G.phase === 'predict' ? 2 : G.seed + 1; G.pairs = genPairs(G.seed);
  const gap = G.phase === 'predict' ? GAP0 : G.gap; G.gap = gap;
  G.cum = []; let w = 0; G.pairs.forEach(([a, b]) => { if (tB(b, gap) < tG(a)) w++; G.cum.push(w); });
  G.phase = 'run'; G.t = 0; G.k = 0; G.stale = false; sfx.click(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, M = S.m, R = S.r;
  if (a === 'grun') { if (S.g.phase !== 'run') runAvg(); }
  else if (a === 'mmode') { M.mode = b.dataset.m; sfx.click(); }
  else if (a === 'mpick') { if (M.mode === 'meet') M.pick = +b.dataset.i; else M.gpick = +b.dataset.i; sfx.tick(); }
  else if (a === 'mgo') {
    if (M.mode === 'meet') {
      if (!M.rev) { if (M.pick === null) return; M.rev = true; (M.pick === 2 ? sfx.good : sfx.bad)(); showStage(); }
      else { M.pi = (M.pi + 1) % 6; M.pick = null; M.rev = false; sfx.click(); }
    } else if (!M.grev) {
      if (M.gpick === null) return; M.grev = true; if (GAME[M.gr].tr.includes(GAME[M.gr].opts[M.gpick])) { M.hits++; sfx.good(); } else sfx.bad(); showStage();
    } else if (M.gr < 2) { M.gr++; M.gpick = null; M.grev = false; sfx.click(); }
    else { M.gr = 0; M.gpick = null; M.grev = false; M.hits = 0; sfx.click(); }
  } else if (a === 'rrule') { if (!R.run) { R.rule = b.dataset.r; sfx.click(); } }
  else if (a === 'rpred') { R.pred = +b.dataset.i; sfx.tick(); }
  else if (a === 'rrun') {
    if (R.run) return;
    if (R.rule === 'green' && R.pred === null && !R.res.green) return;
    R.run = R.rule; R.t = 0; R.res[R.rule] = null; sfx.click(); showStage();
  } else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.sm = { stage: 0, t: 0 }; S.mx.week = 0; S.mx.wk = 0; sfx.click();
  } else if (a === 'sgo') {
    if (S.sec === 'a') { if (S.sm.stage < 2) { S.sm.stage++; S.sm.t = 0; sfx.click(); } }
    else if (S.mx.week < 6) { S.mx.week++; sfx.click(); }
  } else if (a === 'sreset') { S.sm = { stage: 0, t: 0 }; S.mx.week = 0; S.mx.wk = 0; sfx.click(); }
  render();
});
