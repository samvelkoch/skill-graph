  rr(c, 8, 8, 344, 338, 18); const g = c.createLinearGradient(0, 8, 0, 346); g.addColorStop(0, 'rgba(36,44,84,.85)'); g.addColorStop(1, 'rgba(20,26,52,.85)'); c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(160,175,230,.25)'; c.lineWidth = 1; c.stroke();
  pill(c, t.head, 180, 28, { px: 13 });
  c.beginPath(); c.moveTo(24, base); c.lineTo(338, base); c.strokeStyle = 'rgba(220,230,255,.5)'; c.lineWidth = 1.5; c.stroke();
  for (let y = 0; y <= 5; y++) {
    const x = 28 + y * 54 + 0, v = 1000 * Math.pow(1.2, y), u = clamp01(ta - y + 1), h = v * sc * ease(u);
    if (u <= 0) continue;
    const col = mix('#f2c14e', 0xe5484d, y / 5.5), bg = c.createLinearGradient(x, base - h, x + bw, base);
    bg.addColorStop(0, lit(col.startsWith('#') ? col : '#f2a14e', 0.1)); bg.addColorStop(1, col);
    rr(c, x, base - h, bw, h, 6); c.fillStyle = col; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#2a1a10'; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.28)'; rr(c, x + 3, base - h + 3, 7, Math.max(0, h - 8), 3); c.fill();
    pill(c, fmt(v), x + bw / 2, base - h - 12, { px: 12.5, fg: '#ffe08a' }); pill(c, t.year(y), x + bw / 2, base + 16, { px: 12, bg: 'rgba(12,16,32,0)', fg: '#98A0B8' });
  }
  c.setLineDash([5, 4]); c.beginPath(); for (let y = 0; y <= 5; y++) { const x = 28 + y * 54 + bw / 2, yy = base - (1000 + 200 * y) * sc; y ? c.lineTo(x, yy) : c.moveTo(x, yy); } c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2; c.stroke(); c.setLineDash([]);
  pill(c, `${t.simple} · 2 000`, 130, base - 2000 * sc - 20, { px: 12.5 });
}
function drawSecB(c, tm) {
  const t = T[lang].sb, cols = ['#4a8fe0', '#e0883a', '#4cb46a'];
  let g = c.createLinearGradient(0, 0, 0, 350); g.addColorStop(0, '#3a79a8'); g.addColorStop(1, '#245d86'); rr(c, 8, 8, 344, 338, 18); c.fillStyle = g; c.fill();
  c.save(); rr(c, 8, 8, 344, 338, 18); c.clip();
  c.beginPath(); c.ellipse(180, 215, 165, 110, 0, 0, 7); g = c.createRadialGradient(130, 150, 10, 180, 215, 180); g.addColorStop(0, '#f6e4b0'); g.addColorStop(1, '#c9a86a'); c.fillStyle = g; c.fill(); c.strokeStyle = '#8a6a3a'; c.lineWidth = 2; c.stroke(); c.restore();
  emo(c, '🌴', 52, 150, 40); emo(c, '🌴', 312, 158, 36);
  // the stone: a thick disc with a hole
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(184, 262, 66, 10, 0, 0, 7); c.fill();
  g = c.createRadialGradient(160, 165, 8, 180, 195, 80); g.addColorStop(0, '#eceae2'); g.addColorStop(0.6, '#b7b3a8'); g.addColorStop(1, '#7f7b72'); c.beginPath(); c.arc(180, 200, 62, 0, 7); c.fillStyle = g; c.fill(); c.lineWidth = 2; c.strokeStyle = '#4f4c46'; c.stroke();
  c.beginPath(); c.arc(180, 200, 14, 0, 7); c.fillStyle = '#7ac0e8'; c.fill(); c.stroke();
  c.beginPath(); c.arc(180, 200, 50, 3.6, 4.7); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 3; c.stroke();
  // owners
  const pos = [[60, 290], [180, 318], [300, 290]];
  pos.forEach(([x, y], i) => {
    if (i === S.own) { c.beginPath(); c.ellipse(x, y + 2, 26, 8, 0, 0, 7); c.fillStyle = 'rgba(255,224,138,.55)'; c.fill(); }
    person(c, x, y, { r: 14, body: cols[i], skin: ['#f0c49a', '#d9a070', '#e8b48a'][i], hat: ['cap', 'scarf', 'straw'][i], hatCol: ['#2a4a7a', '#d96b8f', '#e8c76a'][i], mood: i === S.own ? 'happy' : 'ok', look: 0 });
  });
  const [ox, oy] = pos[S.own]; // a flag on the stone in the owner's colour
  c.beginPath(); c.moveTo(180, 138); c.lineTo(180, 100); c.strokeStyle = '#4a3a2a'; c.lineWidth = 2.5; c.stroke();
  const fl = Math.sin(tm * 4) * 2; c.beginPath(); c.moveTo(180, 100); c.quadraticCurveTo(196, 96 + fl, 212, 104); c.lineTo(180, 118); c.closePath(); c.fillStyle = cols[S.own]; c.fill(); c.strokeStyle = dark(cols[S.own], 0.5); c.lineWidth = 1.3; c.stroke();
  if (S.tok) { const u = ease(S.tokT), a = pos[S.tok.from], b = pos[S.tok.to]; emo(c, '🤝', lerp(a[0], b[0], u), lerp(a[1] - 40, b[1] - 40, u) - 40 * Math.sin(u * Math.PI), 24); }
  pill(c, t.head, 180, 30, { px: 13 }); pill(c, t.stay, 180, 84 - 0, { px: 12.5 });
}

// --- the picture ---------------------------------------------------------------------------------------------
let hit = null;
canvasLoop($('cv'), (c, w, h, dt, tm) => {
  K = Math.min(w / W, h / H); OX = (w - W * K) / 2; OY = (h - H * K) / 2; hit = { OX, OY, K };
  backdrop(c, w, h); c.save(); c.translate(OX, OY); c.scale(K, K); c.lineJoin = 'round'; c.lineCap = 'round';
  dt = Math.min(dt, 0.05); const v = lab.view;
  if (S.sec === 'a') { S.ta = Math.min(5, S.ta + dt * 0.9); drawSecA(c, tm); }
  else if (S.sec === 'b') { if (S.tok) { S.tokT += dt / 0.9; if (S.tokT >= 1) { S.tok = null; } } drawSecB(c, tm); }
  else if (v === 'barter') { update1(dt); drawBarter(c, tm); }
  else if (v === 'money') { update2(dt); drawMoney(c, tm); }
  else { update3(dt); drawBank(c, tm); }
  c.restore();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'barter' || S.sec || !hit) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - hit.OX) / hit.K, y = (ev.clientY - r.top - hit.OY) / hit.K;
  let best = -1, bd = 40;
  TR.forEach((t, i) => { const d = Math.hypot(x - t.x, y - (t.y - 22)); if (d < bd) { bd = d; best = i; } });
  if (best >= 0) tapTrader(best);
});

// --- controls ------------------------------------------------------------------------------------------------
$('ctrlBody').innerHTML = `
  <div id="sec-barter" class="bl-sec"><div id="b1"></div></div>
  <div id="sec-money" class="bl-sec"><div class="chips" id="m1"></div><div class="chips bl-tests" id="m2"></div></div>
  <div id="sec-bank" class="bl-sec">
    <div id="k1"></div>
    <div id="k2">
      <div class="bl-sl"><label><span id="l_r"></span><b id="v_r"></b></label><input class="big" type="range" id="sl_r" min="0" max="20" step="1" style="--track:linear-gradient(90deg,#3b82f6,#f5c84c,#ef4444)"><small id="be"></small></div>
      <div class="bl-sl"><label><span id="l_s"></span><b id="v_s"></b></label><input class="big" type="range" id="sl_s" min="0" max="10" step="1" style="--track:linear-gradient(90deg,#2b4a3a,#3ddc97)"></div>
      <div class="bl-sl"><label><span id="l_d"></span><b id="v_d"></b></label><input class="big" type="range" id="sl_d" min="0" max="20" step="5" style="--track:linear-gradient(90deg,#3ddc97,#ef4444)"></div>
      <div class="row2" style="margin-top:6px"><button class="chip bl-chip" data-act="sec3" id="secB3"></button><button class="chip bl-chip" data-act="replay3" id="rep3"></button></div>
      <p class="bl-note" id="k_note" style="margin:8px 0 0"></p>
    </div>
  </div>
  <div id="sec-a" class="bl-sec"><div class="row2" style="margin-top:0"><button class="chip bl-chip" data-act="replayA" id="repA"></button></div></div>
  <div id="sec-b" class="bl-sec"><div class="row2" style="margin-top:0"><button class="chip bl-chip" data-act="passB" id="passB"></button></div></div>
  <div class="row2" id="secRow"></div>`;
const showSec = (id, on) => $(id).classList.toggle('on', on);

const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'b-guess') { S1.guess = i; reset1(false); S1.say = { k: 'start' }; sfx.click(); showStage(); }
  else if (a === 'b-shells') { reset1(true); sfx.click(); }
  else if (a === 'b-again') { reset1(false); sfx.click(); }
  else if (a === 'm-item') { S2.item = i; S2.test = -1; S2.queue = []; sfx.tick(); }
  else if (a === 'm-test') { S2.queue = []; startTest(i); sfx.click(); }
  else if (a === 'm-all') { S2.queue = [1, 2, 3]; startTest(0); sfx.click(); }
  else if (a === 'k-guess') { S3.ask = false; S3.d = 10; S3.guess = i; restart3(); (i === 2 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'sec3') { S3.sec = !S3.sec; restart3(); sfx.click(); }
  else if (a === 'replay3') { restart3(); sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k;
    if (k === 'a') S.ta = 0;
    sfx.click(); showStage();
  } else if (a === 'replayA') { S.ta = 0; sfx.click(); }
  else if (a === 'passB') { if (!S.tok) { const from = S.own; S.own = (S.own + 1) % 3; S.tok = { from, to: S.own }; S.tokT = 0; sfx.snap(); } }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id; if (!/^sl_[rsd]$/.test(id)) return;
  S3[id.slice(3)] = +ev.target.value; restart3(); render();
});

// --- render --------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  showSec('sec-barter', !sec && v === 'barter'); showSec('sec-money', !sec && v === 'money'); showSec('sec-bank', !sec && v === 'bank');
  showSec('sec-a', sec === 'a'); showSec('sec-b', sec === 'b');
  const open = secret.unlocked(), sc = (k, emo_) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo_} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('a', '📈') + sc('b', '🗿');
  if (sec === 'a') renderA(t); else if (sec === 'b') renderB(t);
  else if (v === 'barter') renderBarter(t); else if (v === 'money') renderMoney(t); else renderBank(t);
  const f = sec ? [] : v === 'barter' ? [{ emo: '🤝', text: t.facts.barter, src: SRC.barter }]
    : v === 'money' ? [{ emo: '🪙', text: t.facts.money1, src: SRC.money1 }, { emo: '💵', text: t.facts.money2, src: SRC.money2 }]
    : [{ emo: '🗿', text: t.facts.bank, src: SRC.bank }];
  lab.setFacts(f);
}
const nameOf = (e) => ({ '🐐': 0, '🍞': 1, '🏺': 2, '🧶': 3, '🐟': 4, '👟': 5, '🐚': 6 })[e];
function renderBarter(t) {
  const b = t.b, s = S1, say = s.say; lab.setGlow('rgba(224, 176, 80, .26)');
  const body = $('b1');
  if (s.phase === 'ask') {
    body.innerHTML = `<p class="bl-q">${esc(b.q)}</p><p class="bl-note">${esc(b.note)}</p><div class="bl-opts">${[1, 3, 5, 7].map((n) => `<button data-act="b-guess" data-i="${n}">${n}</button>`).join('')}</div>`;
    lab.setReadout('?', b.swaps, '', '#e0b050'); lab.setState({ emo: '🐐', title: b.q, lead: b.note, body: '', extra: '' });
  } else {
    const done = s.phase === 'done' || s.phase === 'sdone';
    body.innerHTML = `<p class="bl-note" style="margin:0 0 8px">${esc(b.q)}</p><div class="row2" style="margin-top:0">${s.phase === 'done' ? `<button class="chip bl-chip" data-act="b-shells">${esc(b.shBtn)}</button>` : ''}${s.phase !== 'ask' && (s.swaps > 0 || done || s.shells) ? `<button class="chip bl-chip" data-act="b-again">${esc(b.again)}</button>` : ''}</div>`;
    lab.setReadout(s.swaps, lang === 'ru' ? ruPlural(s.swaps, 'обмен', 'обмена', 'обменов') : b.swaps, '', '#e0b050');
    let st;
    if (say.k === 'start') st = { emo: '🐐', title: b.startT, lead: b.startL(s.guess) };
    else if (say.k === 'ok') st = { emo: '🔁', title: b.okT(say.a, say.b), lead: b.okL };
    else if (say.k === 'no') st = { emo: '🙅', title: b.noT, lead: b.noL(say.w, say.h) };
    else if (say.k === 'shno') st = { emo: '👟', title: b.shNo, lead: b.shNoL };
    else if (say.k === 'sh') st = { emo: '🐚', title: b.shT, lead: b.shL };
    else if (say.k === 'done') st = { emo: '👟', title: s.guess === s.swaps ? b.right : b.wrong, lead: b.doneL(s.swaps, s.guess) };
    else st = { emo: '🐚', title: b.shDoneT, lead: b.shDoneL(5) };
    lab.setState({ ...st, body: '', extra: '' });
  }
}
function renderMoney(t) {
  const m = t.m; lab.setGlow('rgba(95, 168, 160, .26)');
  $('m1').innerHTML = IT.map((x, i) => `<button class="chip bl-chip ${i === S2.item ? 'on' : ''}" data-act="m-item" data-i="${i}" aria-label="${esc(m.items[i])}" title="${esc(m.items[i])}">${x.e}</button>`).join('');
  $('m2').innerHTML = m.tests.map((n, j) => `<button class="chip bl-chip" data-act="m-test" data-i="${j}">${TEMO[j]} ${esc(n)}</button>`).join('') + `<button class="chip bl-chip" data-act="m-all">${esc(m.all)}</button>`;
  const r = S2.res[S2.item], done = r.filter((x) => x !== null).length, pass = r.filter((x) => x).length, name = m.items[S2.item];
  lab.setReadout(done ? `${pass}/${done}` : '?', name, '', '#5fa8a0');
  const k = S2.test;
  if (k < 0 || !S2.rec) {
    if (k < 0) lab.setState({ emo: IT[S2.item].e, title: done === 4 ? m.score(name, pass) : m.idleT, lead: done === 4 ? '' : m.idleL, body: '', extra: '' });
    return;
  }
  const ok = !!IT[S2.item].r[k];
  lab.setState({ emo: ok ? '✅' : '❌', title: `${name}: ${(ok ? m.okT : m.noT)[k]}`, lead: (ok ? m.ok : m.no)[k](name), body: done === 4 ? m.score(name, pass) : '', extra: '' });
}
function renderBank(t) {
  const k = t.k; lab.setGlow('rgba(245, 200, 76, .24)');
  $('k1').style.display = S3.ask ? '' : 'none'; $('k2').style.display = S3.ask ? 'none' : '';
  const final = pf(S3.r, S3.s, S3.d, S3.sec);
  if (S3.ask) {
    $('k1').innerHTML = `<p class="bl-q">${esc(k.q)}</p><div class="bl-opts">${k.opts.map((o, i) => `<button data-act="k-guess" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    lab.setReadout('?', k.profit, '', '#f5c84c'); lab.setState({ emo: '🏦', title: k.askT, lead: k.askL, body: '', extra: '' });
    return;
  }
  $('l_r').textContent = k.rate; $('l_s').textContent = k.save; $('l_d').textContent = k.lost;
  $('v_r').textContent = `${S3.r}%`; $('v_s').textContent = `${S3.s}%`; $('v_d').textContent = `${S3.d}%`;
  for (const id of ['r', 's', 'd']) if ($('sl_' + id).value !== String(S3[id])) $('sl_' + id).value = S3[id];
  $('secB3').textContent = k.sec(S3.sec); $('secB3').classList.toggle('on', S3.sec); $('rep3').textContent = k.replay;
  const be = beOf(S3.s, S3.d, S3.sec); $('be').textContent = be === null ? k.beMax : k.be(be); $('k_note').textContent = k.note;
  lab.setReadout(sgn(final), k.profit, k.repay(fmt(1000 + 10 * S3.r)), final >= 0 ? '#3ddc97' : '#e5484d');
  let st;
  if (S3.fresh !== false && S3.guess !== undefined && S3.d === 10 && S3.r === 8 && S3.s === 2 && !S3.sec && !S3.moved) st = { emo: S3.guess === 2 ? '✅' : '🤔', title: S3.guess === 2 ? k.right : k.wrong, lead: be === null ? k.revLmax : k.revL(be) };
  else if (final > 0) st = { emo: '🛡️', title: k.safeT, lead: k.safeL };
  else if (final === 0) st = { emo: '⚖️', title: k.zeroT, lead: k.zeroL };
  else st = { emo: '📉', title: k.lossT, lead: k.lossL };
  lab.setState({ ...st, body: S3.sec ? k.secOn : '', extra: '' });
}
function renderA(t) {
  const a = t.sa; lab.setGlow('rgba(245, 100, 76, .26)'); $('repA').textContent = a.replay;
  const y = Math.floor(S.ta + 1e-6); lab.setReadout(fmt(1000 * Math.pow(1.2, 5)), t.coins, '', '#e5484d');
  lab.setState({ emo: '📈', title: a.t, lead: a.l, body: '', extra: '' });
}
function renderB(t) {
  const b = t.sb; lab.setGlow('rgba(74, 143, 224, .26)'); $('passB').textContent = b.pass;
  lab.setReadout('🗿', b.head, '', '#4a8fe0');
  lab.setState({ emo: '🗿', title: b.t, lead: S.tok || S.own ? b.now(b.own[S.own]) : b.l, body: '', extra: '' });
}
// the bank view remembers whether the sliders were touched after the reveal
['sl_r', 'sl_s', 'sl_d'].forEach((id) => $(id).addEventListener('input', () => { S3.moved = true; }));
$('ctrlBody').addEventListener('click', (ev) => { if (ev.target.closest('[data-act=sec3]')) S3.moved = true; });
render();
</script>
