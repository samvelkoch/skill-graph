  const t = T[lang], v = lab.view, open = secret.unlocked(), done = S.step >= 7;
  document.body.dataset.v = v;
  $('pcThrone').hidden = v !== 'throne'; $('pcLaw').hidden = v !== 'law'; $('pcMap').hidden = v !== 'map';
  const unlockedUI = open && done; // the secrets (and the quiz) stay shut until every ruler has been met
  const sc = (k, emo) => `<button class="chip secret ${unlockedUI ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${unlockedUI ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('pcSecs').innerHTML = sc('a', '🖋️') + sc('b', '👶');
  $('pcSecCtl').hidden = !S.sec;
  $('pcSecCtl').innerHTML = S.sec ? `<button class="chip on" data-act="secstep">${esc(S.sec === 'a' ? (S.sa >= 3 ? t.sa.again : t.sa.btn) : t.sb.btn)}</button>` : '';
  const lockHTML = `<div class="pc-lock"><span>🔒 ${esc(t.lockThrone)}</span><button class="pc-go" data-act="go1">${esc(t.lockBtn)}</button></div>`;
  const glow = { throne: 'rgba(217, 169, 63, .24)', law: 'rgba(91, 134, 201, .24)', map: 'rgba(74, 165, 117, .22)' };
  lab.setGlow(glow[v]);
  // the secret scenes replace the state card in every view
  if (S.sec) {
    const sa = S.sec === 'a';
    lab.setState({ emo: sa ? '🖋️' : '👶', title: sa ? t.sa.t : t.sb.t, lead: sa ? t.sa.lead : t.sb.lead[S.sb], body: '', extra: '' });
    lab.setFacts([{ emo: sa ? '🖋️' : '👶', text: sa ? t.sa.f : t.sb.f, src: sa ? t.sa.src : t.sb.src }]);
    lab.setReadout(sa ? `${S.sa}/3` : t.rn[4], sa ? '' : t.sb.steps[S.sb], '', '#d9a93f');
    renderViewControls(t, v, done, lockHTML);
    return;
  }
  renderViewControls(t, v, done, lockHTML);
  if (v === 'throne') {
    const k = S.asking ? S.step : S.at > 0 ? S.at - 1 : -1;
    $('pcPred1').innerHTML = k >= 0 ? predHTML(t.asks[k].q, t.asks[k].o, S.pick[k] ?? null, ASK_OK[k], t.right, S.pick[k] !== undefined ? t.wrong(t.rn[k + 1]) : '', 'opt1') : '';
    $('pcNext').hidden = S.asking || S.step >= 7; $('pcNext').textContent = t.next;
    $('pcSlider').value = S.asking ? S.step : S.at; $('pcSlider').setAttribute('aria-label', t.slider);
    $('pcYrs').innerHTML = t.yrs.map((y, i) => `<span class="${i > S.step ? 'off' : i === S.at && !S.asking ? 'on' : ''}">${i > S.step ? '·' : esc(y)}</span>`).join('');
    if (S.asking) {
      lab.setState({ emo: '🤔', title: t.asks[S.step].q, lead: '', body: '', extra: '' });
      lab.setReadout('?', t.yrs[S.step + 1], '❓', '#d9a93f');
    } else if (S.at === 0) {
      lab.setState({ emo: '🕯️', title: t.s0[0], lead: t.s0[1], body: '', extra: '' });
      lab.setReadout(t.yrs[0], t.rn[0], '', '#d9a93f');
    } else {
      const r = RUL[S.at], rv = t.rev[S.at - 1];
      lab.setState({ emo: '👑', title: rv[0], lead: rv[1], body: `${t.decided}: ${byTxt(r)}`, extra: `<div class="pc-fine">${esc(t.fine)}</div>` });
      lab.setReadout(t.yrs[S.at], t.rn[S.at], byTxt(r), BYC[r.by[0]].c);
    }
    lab.setFacts(S.asking ? [] : t.facts.throne.filter((f) => S.step >= f.n && S.at >= f.n - 0).map((f) => ({ emo: f.emo, text: f.text, src: f.src })));
  } else if (v === 'law') {
    if (!done) {
      lab.setState({ emo: '🔒', title: t.lockT, lead: t.lockThrone, body: '', extra: '' }); lab.setReadout('🔒', '', '', '#5b86c9'); lab.setFacts([]);
    } else {
      const ans = S.lawPick !== null, names = t.law.o.map((i) => t.rn[i]);
      $('pcPred2').innerHTML = predHTML(t.law.q, names, S.lawPick, LAW_OK, t.law.right, t.law.wrong(t.rn[6]), 'opt2');
      $('pcRules').innerHTML = t.law.rules.map((n, i) => `<button class="pc-rule${S.rule === i ? ' on' : ''}" data-act="rule" data-i="${i}">${esc(n)}</button>`).join('');
      $('pcRuleTxt').textContent = S.rule === 0 ? t.law.r0 : t.law.r1;
      if (!ans) {
        lab.setState({ emo: '⏱️', title: t.law.q, lead: '', body: '', extra: '' }); lab.setReadout('?', '', '⏱️', '#5b86c9'); lab.setFacts([]);
      } else {
        lab.setState({ emo: t.law.st[0], title: t.law.st[1], lead: `${t.rn[6]}: ${dur(6)}. ${t.rn[4]}: ${dur(4)}. ${t.rn[5]}: ${dur(5)}.`, body: '', extra: '' });
        lab.setReadout(dur(6), t.rn[6], t.law.short, '#5b86c9'); lab.setFacts(t.facts.law);
      }
    }
  } else {
    if (!done) {
      lab.setState({ emo: '🔒', title: t.lockT, lead: t.lockThrone, body: '', extra: '' }); lab.setReadout('🔒', '', '', '#4aa575'); lab.setFacts([]);
    } else {
      const m = t.map, ans = S.mapPick !== null;
      $('pcPred3').innerHTML = predHTML(m.q, m.o, S.mapPick, 2, m.right, m.wrong, 'opt3');
      $('pcYears').innerHTML = ['1762', '1796'].map((y, i) => `<button class="pc-rule${S.mapTgt === i ? ' on' : ''}" data-act="yr" data-i="${i}"${ans ? '' : ' disabled'}>${y}</button>`).join('');
      $('pcLayers').innerHTML = m.layers.map((n, i) => `<button class="pc-rule${S.layer === ['prov', 'pug'][i] ? ' on' : ''}" data-act="layer" data-k="${['prov', 'pug'][i]}"${ans ? '' : ' disabled'}>${esc(n)}</button>`).join('');
      if (!ans) {
        lab.setState({ emo: '🗺️', title: m.q, lead: '', body: '', extra: '' }); lab.setReadout('?', '', m.pillQ, '#4aa575'); lab.setFacts([]);
      } else {
        const L = S.layer ? m[S.layer] : null;
        lab.setState(L ? { emo: S.layer === 'prov' ? '🏘️' : '🔥', title: L[0], lead: L[1], body: '', extra: '' } : { emo: m.st[0], title: m.st[1], lead: m.st[2], body: '', extra: '' });
        lab.setReadout(S.mapTgt ? '1796' : '1762', m.sub, '', '#4aa575'); lab.setFacts(t.facts.map);
      }
    }
  }
}
function renderViewControls(t, v, done, lockHTML) {
  $('pcLock2').innerHTML = !done ? lockHTML : ''; $('pcLawBody').hidden = !done;
  $('pcLock3').innerHTML = !done ? lockHTML : ''; $('pcMapBody').hidden = !done;
}
render();
</script>
</body>
</html>
