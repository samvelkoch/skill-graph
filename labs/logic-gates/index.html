function sceneBuild(c) {
  const t = T[lang], i = S.bi, st = STM[i], V = S.V, root = treeOf(i);
  const leaves = [];
  (function walk(n) { if (n.t === 'leaf') leaves.push(n); else n.kids.forEach(walk); })(root);
  const LY = leaves.length === 3 ? [55, 150, 245] : [90, 210];
  leaves.forEach((l, k) => { l.y = LY[k]; });
  (function place(n, d) {
    if (n.t === 'leaf') { n.ox = 78; n.oy = n.y; n.val = n.key ? V[n.key] : null; return; }
    n.kids.forEach((k) => place(k, d + 1));
    if (n.t === 'not') { n.x = 96; n.w = 44; n.y = n.kids[0].oy; }
    else { n.x = 224 - 66 * d; n.w = 52; n.y = n.kids.reduce((s, k) => s + k.oy, 0) / n.kids.length; }
    n.ox = n.x + n.w; n.oy = n.y; n.val = evalNode(n, V);
  })(root, 0);
  const pieces = [], boxes = [];
  const wire = (kid, n, py) => {
    const x2 = n.x, xm = x2 - 8, on = kid.val === 1;
    pieces.push({ pts: kid.oy === py ? [[kid.ox, kid.oy], [x2, py]] : [[kid.ox, kid.oy], [xm, kid.oy], [xm, py], [x2, py]], on });
  };
  (function walk(n) {
    if (n.t === 'leaf') { pieces.push({ pts: [[6, n.y], [16, n.y]], on: !!n.key && n.val === 1 }); return; }
    n.kids.forEach(walk);
    const ports = n.t === 'not' ? [n.y] : [n.y - 11, n.y + 11];
    n.kids.forEach((k, j) => wire(k, n, ports[j]));
    boxes.push({ n, ports });
  })(root);
  pieces.push({ pts: [[root.ox, root.oy], [289, root.oy]], on: root.val === 1 });
  trace(c, [[6, LY[0]], [6, LY[LY.length - 1]]], false);
  pieces.forEach((p) => trace(c, p.pts, p.on));
  pill(c, '+', 6, LY[0] - 24, '#ffd45e');
  leaves.forEach((l) => {
    const tag = l.key ? { text: t.inputs[l.key], col: l.val === 1 ? '#6ff0b0' : '#fff' } : { text: '?', col: '#9fb3c8' };
    drawSwitch(c, `leaf-${l.slot}`, l.key, 16, l.y, l.val === 1, tag, { left: true, dim: !l.key });
  });
  boxes.forEach(({ n, ports }) => {
    const label = n.t === 'not' ? t.gates.not : n.g ? t.gates[n.g] : null;
    drawGate(c, n.x, n.y, n.w, 40, label, n.val === 1 && !!label, ports);

function isLocked() {
  const v = view();
  if (v === 'series') return S.pred[S.mode] === null;
  if (v === 'table') return S.pend !== null;
  if (v === 'build') return S.bst[S.bi].phase === 'predict';
  return false;
}
const litCount = (m) => [0, 1, 2, 3].filter((i) => serOut(m, i >> 1, i & 1)).length;
const showStage = () => {

};

// moving into a view (or a secret): switches back to zero, nothing half-answered
function enter() {
  S.V.A = S.V.B = S.V.C = 0; S.pend = null; S.pendK = null; S.sel = null; S.verdict = null;
  const v = view();
  if (v === 'series') observeSeries(); else if (v === 'table') observeTable(false);
  render();
}
function observeSeries() { if (S.pred[S.mode] !== null) S.tried[S.mode][sidx(S.V.A, S.V.B)] = 1; }
function startBox(b) {
  S.box = b; S.rows[b] = new Array(1 << BOXES[b].n).fill(null); S.pend = null; S.verdict = null; S.lid = 0;
  S.V.A = S.V.B = S.V.C = 0;
  observeTable(false);
}
function observeTable(flipped = true) {
  const b = S.box, rows = S.rows[b];
  if (!boxRowsReady(b)) return;
  const key = rowKey(BOXES[b].n);
  if (rows[key] !== null) return;
  rows[key] = boxOut(b);
  if (b === 3 && boxFilled(b) === rows.length) { S.opened[3] = true; sfx.good(); }
}
function flip(k) {
  if (isLocked() || !(k in S.V)) return;
  const v = view();
  if (v === 'table') { // the third setting is predicted BEFORE the switch moves: hold the flip, ask, then flip
    const b = S.box, n = BOXES[b].n;
    if (b < 3 && boxRowsReady(b) && !S.predBox[b] && boxFilled(b) === Math.min(2, S.rows[b].length - 1)) {
      let key = 0; for (let i = 0; i < n; i++) key = key * 2 + (KEYS[i] === k ? 1 - S.V[k] : S.V[KEYS[i]]);
      if (S.rows[b][key] === null) { S.pend = key; S.pendK = k; S.verdict = null; sfx.click(); render(); return; }
    }
  }
  S.V[k] ^= 1; sfx.click();
  if (v === 'series') {
    const was = S.tried[S.mode].every(Boolean); observeSeries();
    if (!was && S.tried[S.mode].every(Boolean)) (S.pred[S.mode] === litCount(S.mode) ? sfx.good : sfx.bad)();
  } else if (v === 'table') { S.verdict = null; observeTable(true); }
  else if (v === 'stairs') { const was = S.stTried.every(Boolean); S.stTried[sidx(S.V.A, S.V.B)] = 1; if (!was && S.stTried.every(Boolean)) sfx.good(); }
  render();
}
$('cv').addEventListener('pointerdown', (ev) => {

    const d = Math.hypot(x - (h.x + h.w / 2), y - (h.y + h.h / 2));

  if (best) flip(best.key);
});

function checkBuild() {
  const i = S.bi, st = STM[i], B = S.bst[i];
  if (!slotsFull(i)) return;
  const tree = treeOf(i), n = st.ins.length, bad = [];
  for (let m = 0; m < (1 << n); m++) {
    const V = {}; maskOf(n, m).forEach((x, j) => { V[st.ins[j]] = x; });
    if ((evalNode(tree, V) & 1) !== (st.f(V) & 1)) bad.push(m);
  }
  B.bad = bad;
  if (!bad.length) { B.phase = 'done'; st.ins.forEach((k) => { S.V[k] = 0; }); Object.assign(S.V, st.kase); sfx.good(); showStage(); }
  else { B.wrong++; sfx.bad(); }
}

  } else if (act === 'tname') {
    if (d.g === BOXES[S.box].id) { S.opened[S.box] = true; S.verdict = { ok: true }; sfx.good(); showStage(); }
    else { S.wrongNames[S.box].push(d.g); S.verdict = { ok: false }; sfx.bad(); }
  } else if (act === 'tnext') { startBox(S.box + 1); sfx.click(); }
  else if (act === 'rowsq') { S.rowsAns = +d.n; S.verdict = { ok: +d.n === 8, rows: true }; (+d.n === 8 ? sfx.good : sfx.bad)(); observeTable(false); showStage(); }
  else if (act === 'bpred') { const B = S.bst[S.bi]; B.ans = +d.j; B.phase = 'build'; sfx.click(); }
  else if (act === 'slot') { const B = S.bst[S.bi]; if (B.slots[d.k]) { B.slots[d.k] = null; B.bad = null; } S.sel = d.k; sfx.tick(); }
  else if (act === 'not') { const B = S.bst[S.bi]; B.nots[d.k] = B.nots[d.k] ? 0 : 1; B.bad = null; sfx.tick(); }
  else if (act === 'pick') {
    const st = STM[S.bi], B = S.bst[S.bi], isG = d.kind === 'g', mine = slotOrder(st).filter((k) => (k[0] === 'g') === isG);
    const tgt = S.sel && mine.includes(S.sel) ? S.sel : mine.find((k) => !B.slots[k]) ?? mine[0];
    B.slots[tgt] = d.k; B.bad = null; S.sel = null; sfx.snap();
  } else if (act === 'check') checkBuild();
  else if (act === 'solve') { const st = STM[S.bi], B = S.bst[S.bi]; B.slots = { ...st.sol.slots }; B.nots = { ...st.sol.nots }; B.bad = null; S.sel = null; sfx.snap(); }
  else if (act === 'bnext') { S.bi = Math.min(2, S.bi + 1); S.sel = null; S.V.A = S.V.B = S.V.C = 0; STM[S.bi].ins.forEach((k) => { S.V[k] = 0; }); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    S.sec = S.sec === d.k ? null : d.k; if (S.sec === 'stairs') S.stTried = [1, 0, 0, 0];
    sfx.click(); enter(); void t; return;
  }
  render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------------
function render() {
  const t = T[lang], v = view();
  document.body.dataset.v = v;
  if (v === 'series') renderSeries(t); else if (v === 'table') renderTable(t); else if (v === 'build') renderBuild(t); else if (v === 'stairs') renderStairs(t); else renderAdder(t);
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('lgSec').innerHTML = sc('stairs', '🪜') + sc('adder', '➕');
  lab.setFacts(t.facts[lab.view] ?? []);
}
const setSt = (t, emo, title, lead) => lab.setState({ emo, title, lead, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
const swChips = (keys, labelFn) => keys.map((k) => `<button class="chip lg-c ${S.V[k] ? 'on' : ''}" data-act="sw" data-k="${k}">${labelFn(k)}</button>`).join('');
const verdictLine = (ok, text) => `<div class="lg-sub"><b class="lg-v ${ok ? 'ok' : 'bad'}">${esc(ok ? T[lang].right : T[lang].notQuite)}</b>${text ? ` ${esc(text)}` : ''}</div>`;
function tblHTML(heads, rows) { // rows: [{ bits, out (0/1/'?'/null), cur, bad }]
  return `<table class="lg-t"><tr>${heads.map((h) => `<th>${esc(h)}</th>`).join('')}</tr>${rows.map((r) =>
    `<tr class="${r.cur ? 'cur' : ''} ${r.bad ? 'badrow' : ''}">${r.bits.map((x) => `<td>${x}</td>`).join('')}<td class="${r.out === null || r.out === '?' ? 'un' : r.out === 1 ? 'on' : 'off'}">${r.out === null ? '·' : r.out}</td></tr>`).join('')}</table>`;
}
const clearPanels = () => { $('lgTop').innerHTML = ''; $('lgQ').innerHTML = ''; $('lgSw').innerHTML = ''; $('lgBuild').innerHTML = ''; $('lgTbl').innerHTML = ''; };

function renderSeries(t) {
  const m = S.mode, p = S.pred[m], tr = S.tried[m], done = p !== null && tr.every(Boolean), a = S.V.A, b = S.V.B, lit = litCount(m);
  lab.setGlow('rgba(255, 200, 80, .24)'); clearPanels();
  $('lgTop').innerHTML = `<div class="lg-q"><div class="chips">${['and', 'or'].map((k) => `<button class="chip lg-c ${k === m ? 'on' : ''}" data-act="mode" data-m="${k}">${esc(t.modes[k])}</button>`).join('')}</div></div>`;
  if (p === null) {
    $('lgQ').innerHTML = `<div class="lg-q"><div class="lg-qt">${esc(t.seriesQ)}</div><div class="chips">${[0, 1, 2, 3, 4].map((n) => `<button class="chip lg-c" data-act="spred" data-n="${n}">${n}</button>`).join('')}</div></div>`;
    lab.setReadout('?', '', t.modes[m], '#e0a63a');
  } else {
    $('lgQ').innerHTML = done ? verdictLine(p === lit, m === 'and' ? t.exAnd : t.exOr) : `<div class="lg-sub">${esc(t.tryAll)}</div>`;
    $('lgSw').innerHTML = swChips(['A', 'B'], (k) => `${k} · ${S.V[k] ? t.on : t.off}`);
    const cell = (i) => (tr[i] ? `<td class="${i === sidx(a, b) ? 'cur' : ''}">✓ ${serOut(m, i >> 1, i & 1) ? '💡' : '⚫'}</td>` : `<td class="${i === sidx(a, b) ? 'cur' : ''}">·</td>`);
    $('lgTbl').innerHTML = `<table class="lg-grid"><tr><th></th><th>B = 0</th><th>B = 1</th></tr><tr><th>A = 0</th>${cell(0)}${cell(1)}</tr><tr><th>A = 1</th>${cell(2)}${cell(3)}</tr></table>`;
    lab.setReadout(serOut(m, a, b) ? t.lampOn : t.lampOff, t.setting(a, b), t.modes[m], '#e0a63a');
  }
  const both = ['and', 'or'].every((k) => S.pred[k] !== null && S.tried[k].every(Boolean));
  if (both) setSt(t, '🔌', t.state.seriesDone[0], t.state.seriesDone[1]);
  else if (done) setSt(t, p === lit ? '✅' : '🤔', p === lit ? t.right : t.notQuite, m === 'and' ? t.exAnd : t.exOr);
  else setSt(t, '🔌', t.state.series0[0], t.state.series0[1]);
}

function renderTable(t) {
  const b = S.box, n = BOXES[b].n, tot = 1 << n, ready = boxRowsReady(b), filled = ready ? boxFilled(b) : 0, complete = ready && filled === tot, opened = S.opened[b];
  lab.setGlow('rgba(78, 168, 255, .26)'); clearPanels();
  const vl = S.verdict ? verdictLine(S.verdict.ok, S.verdict.rows ? t.exRows : S.verdict.lamp !== undefined ? (S.verdict.lamp ? t.lampOn : t.lampOff) : '') : '';
  let q = '';
  if (S.pend !== null) q = `<div class="lg-q"><div class="lg-qt">${esc(t.predictRow)}</div><div class="chips"><button class="chip lg-c" data-act="tpred" data-v="1">${esc(t.on)}</button><button class="chip lg-c" data-act="tpred" data-v="0">${esc(t.off)}</button></div></div>`;
  else if (!ready) q = `<div class="lg-q"><div class="lg-qt">${esc(t.rowsQ)}</div><div class="chips">${[3, 6, 8, 9].map((k) => `<button class="chip lg-c" data-act="rowsq" data-n="${k}">${k}</button>`).join('')}</div></div>`;
  else if (complete && !opened) q = `${vl}<div class="lg-q"><div class="lg-qt">${esc(t.nameBox)}</div><div class="chips">${['and', 'or', 'not', 'xor'].map((g) => `<button class="chip lg-c ${S.wrongNames[b].includes(g) ? 'bad' : ''}" data-act="tname" data-g="${g}">${esc(t.gates[g])}</button>`).join('')}</div></div>`;
  else if (opened) q = `${vl}<div class="lg-sub"><b class="lg-v ok">${esc(t.opened)}</b></div>${b < 3 ? `<div class="lg-btns"><button class="btn" data-act="tnext">${esc(t.next)}</button></div>` : ''}`;
  else q = vl;
  $('lgQ').innerHTML = q;
  if (S.pend === null) $('lgSw').innerHTML = swChips(KEYS.slice(0, n), (k) => `${k} · ${S.V[k] ? t.on : t.off}`);
  if (ready) {
    const cur = rowKey(n), rows = S.rows[b];
    $('lgTbl').innerHTML = tblHTML([...KEYS.slice(0, n), '💡'], Array.from({ length: tot }, (_, m) => ({
      bits: maskOf(n, m), cur: S.pend !== null ? m === S.pend : m === cur, out: S.pend === m ? '?' : rows[m] === null ? null : rows[m] })));
  }
  lab.setReadout(ready ? t.rowsFilled(filled, tot) : '?', t.tableWord, t.box(b + 1), '#4ea8ff');
  if (allDoneTable()) setSt(t, '📋', t.state.tableDone[0], t.state.tableDone[1]);
  else if (opened) setSt(t, '📦', t.opened, '');
  else if (b === 3 && S.rowsAns !== null) setSt(t, S.rowsAns === 8 ? '✅' : '🤔', S.rowsAns === 8 ? t.right : t.notQuite, t.exRows);
  else setSt(t, '🕵️', t.state.table0[0], t.state.table0[1]);
}

function renderBuild(t) {
  const i = S.bi, st = STM[i], B = S.bst[i], sid = st.id, built = builtCount(), ok = t.caseOk[sid], n = st.ins.length;
  lab.setGlow('rgba(61, 220, 151, .22)'); clearPanels();
  let pillText = '';
  if (B.phase === 'predict') {
    $('lgQ').innerHTML = `<div class="lg-q"><div class="lg-qt">${esc(t.buildQ(t.stmts[sid]))}</div><div class="lg-sub">${esc(t.cases[sid])}</div><div class="chips">${t.caseOpts[sid].map((o, j) => `<button class="chip lg-c" data-act="bpred" data-j="${j}">${esc(o)}</button>`).join('')}</div></div>`;
  } else {
    $('lgTop').innerHTML = `<div class="lg-stmt">${esc(t.stmts[sid])}</div>`;
    $('lgSw').innerHTML = swChips(st.ins, (k) => `${emojiOf(k)} ${S.V[k] ? t.on : t.off}`);
    pillText = formulaText(i);
    if (B.phase === 'build') {
      const slotBtn = (k) => {
        const v = B.slots[k], label = v ? (k[0] === 'g' ? t.gates[v] : t.inputs[v]) : '?';
        return `<button class="lg-slot ${v ? 'full' : ''} ${S.sel === k ? 'sel' : ''} ${k[0] === 'g' ? 'g' : ''}" data-act="slot" data-k="${k}">${esc(label)}</button>`;
      };
      const leafUI = (k) => `<span class="lg-leaf"><button class="lg-not ${B.nots[k] ? 'on' : ''}" data-act="not" data-k="${k}">${esc(t.gates.not)}</button>${slotBtn(k)}</span>`;
      const tokens = st.shape === 'flat' ? [leafUI('l1'), slotBtn('g1'), leafUI('l2')]
        : [leafUI('l1'), slotBtn('g1'), '<span class="lg-par">(</span>', leafUI('l2'), slotBtn('g2'), leafUI('l3'), '<span class="lg-par">)</span>'];
      const pal = st.ins.map((k) => `<button class="chip lg-c" data-act="pick" data-kind="in" data-k="${k}">${esc(t.inputs[k])}</button>`).join('')
        + ['and', 'or'].map((g) => `<button class="chip lg-c lg-gate" data-act="pick" data-kind="g" data-k="${g}">${esc(t.gates[g])}</button>`).join('');
      $('lgBuild').innerHTML = `<div class="lg-tpl">${tokens.join('')}</div><div class="chips lg-pal">${pal}</div>
        <div class="lg-btns"><button class="btn" data-act="check" ${slotsFull(i) ? '' : 'disabled'}>${esc(t.check)}</button>${B.wrong >= 2 ? `<button class="btn ghost" data-act="solve">${esc(t.solve)}</button>` : ''}</div>`;
      if (B.bad && B.bad.length) $('lgQ').innerHTML = verdictLine(false, '');
    } else {
      $('lgQ').innerHTML = verdictLine(B.ans === ok, `${t.cases[sid]} → ${t.caseOpts[sid][ok]}`);
      if (i < 2) $('lgBuild').innerHTML = `<div class="lg-btns"><button class="btn" data-act="bnext">${esc(t.next)}</button></div>`;
    }
    if (B.phase === 'done' || (B.bad && B.bad.length)) {
      const tree = treeOf(i), bad = B.bad || [];
      $('lgTbl').innerHTML = tblHTML([...st.ins.map(emojiOf), '▶'], Array.from({ length: 1 << n }, (_, m) => {
        const bits = maskOf(n, m), V = {}; bits.forEach((x, j) => { V[st.ins[j]] = x; });
        return { bits, out: evalNode(tree, V), bad: bad.includes(m), cur: st.ins.every((k, j) => S.V[k] === bits[j]) };
      }));
    }
  }
  lab.setReadout(`${built} / 3`, t.built, pillText, '#3ddc97');
  if (built === 3) setSt(t, '💡', t.state.buildDone[0], t.state.buildDone[1]);
  else if (B.phase === 'done') setSt(t, B.ans === ok ? '✅' : '🤔', B.ans === ok ? t.right : t.notQuite, `${t.cases[sid]} → ${t.caseOpts[sid][ok]}`);
  else setSt(t, '🧩', t.state.build0[0], t.state.build0[1]);
}

function renderStairs(t) {
  const A = S.V.A, B = S.V.B, lit = (A ^ B) === 1, done = S.stTried.every(Boolean);
  lab.setGlow('rgba(255, 200, 80, .24)'); clearPanels();
  $('lgQ').innerHTML = `<div class="lg-sub">${esc(done ? t.secretA : t.tryAll)}</div>`;
  $('lgSw').innerHTML = swChips(['A', 'B'], (k) => `${k} · ${S.V[k] ? '↑' : '↓'}`);
  $('lgTbl').innerHTML = tblHTML(['A', 'B', '💡'], [0, 1, 2, 3].map((m) => { const bits = maskOf(2, m); return { bits, cur: sidx(A, B) === m, out: S.stTried[m] ? bits[0] ^ bits[1] : null }; }));
  lab.setReadout(lit ? t.lampOn : t.lampOff, t.setting(A, B), t.secrets.stairs[0], '#e0a63a');
  setSt(t, '🪜', t.secrets.stairs[0], done ? t.secretA : t.secrets.stairs[1]);
}

function renderAdder(t) {
  const A = S.V.A, B = S.V.B, sum = A ^ B, carry = A & B;
  lab.setGlow('rgba(181, 140, 255, .24)'); clearPanels();
  $('lgQ').innerHTML = `<div class="lg-sub">${esc(t.secretB)}</div>`;
  $('lgSw').innerHTML = swChips(['A', 'B'], (k) => `${k} · ${S.V[k] ? t.on : t.off}`);
  lab.setReadout(`${carry}${sum}`, `${A} + ${B}`, '', '#b58cff');
  setSt(t, '➕', `${A} + ${B} = ${carry}${sum}`, t.secrets.adder[1]);
}

startBox(0);
render();
</script>
</body>
</html>
