const PZ = {

  p2: { l: [1, -3], r: [0, 5], v: 8, sym: '?' },

const ORDER = ['p1', 'p2', 'p3', 'p4', 'p5'];

            mk: { a: 3, b: 5, d: 0, c: 26 }, done: store.get('equations:done', []) };

const copy = (s) => ({ lx: s.lx, ln: s.ln, rx: s.rx, rn: s.rn });
const weights = (s) => [s.lx * S.xv + s.ln, s.rx * S.xv + s.rn];
const isBal = (s = S.st) => { const [a, b] = weights(s); return a === b; };
const isSolved = () => S.st.lx === 1 && S.st.ln === 0 && S.st.rx === 0 && isBal();
const term = (c, sym) => (c === 0 ? '' : c === 1 ? sym : sym === '?' ? `${num(c)} × ?` : `${num(c)}${sym}`);

const eqHtml = (s) => { const [a, b] = weights(s), cmp = a === b ? '=' : a > b ? '&gt;' : '&lt;';
  return `${esc(sideTxt(s.lx, s.ln))} <span style="color:${a === b ? 'inherit' : 'var(--wip)'}">${cmp}</span> ${esc(sideTxt(s.rx, s.rn))}`; };
const eqPlain = (s) => eqHtml(s).replace(/<[^>]+>/g, '').replace(/&gt;/g, '>').replace(/&lt;/g, '<');
const puzLabel = (id) => { const p = PZ[id], old = S.sym; S.sym = p.sym; const r = `${sideTxt(p.l[0], p.l[1])} = ${sideTxt(p.r[0], p.r[1])}`; S.sym = old; return r; };

function mkSol() {
  const { a, b, d, c } = S.mk;
  if (a === d) return b === c ? { k: 'any' } : { k: 'never' };

}

}
function addFx(side, txt) { S.fx.push({ s: side, txt, t0: performance.now() / 1000 }); }

  let why = op === 'div' && k < 2 ? 'one' : null;
  for (const sd of sides) {
    const [kx, kn] = key(sd), x = S.st[kx], n = S.st[kn];
    if (op === 'sub' && !S.neg && n < k) why = why || 'noW';

    else if (op === 'box') S.st[kx] -= k; else { S.st[kx] /= k; S.st[kn] /= k; }

  }
  S.hs.push(copy(S.st)); S.rec = null;
  const bal = isBal();
  S.note = { kind: bal ? (was ? 'ok' : 'fixed') : 'tilt', op, k, side };
  if (bal) { S.vel += 0.3; sfx.snap(); } else sfx.push();

  }

function suggest(st) {
  if (!isBal(st)) return null;

  if (lx === 0) return null;
  if (ln > 0) return { op: 'sub', k: ln };

function noteText(t) {
  const n = S.note, st = t.st;
  if (lab.view === 'make') return { emo: '🛠', title: t.mk.title, lead: t.mk.lead, body: t.mk.body, extra: '' };
  if (lab.view === 'check') return chkText(t);

    const sp = S.puz === 's1' ? st.solved1 : S.puz === 's2' ? st.solved2 : null;
    r = { emo: '🎉', title: st.solved, lead: sp ? sp[0] : eqPlain(S.st), body: sp ? sp[1] : st.solvedBody, go: true };
  } else if (S.pre) r = { emo: '🎁', title: st.pre[0], lead: st.pre[1], body: st.pre[2] };
  else if (n.kind === 'start' || n.kind === 'intro2') { const a = st[n.kind === 'intro2' ? 'intro2' : 'start']; r = { emo: n.kind === 'intro2' ? '🎈' : '⚖️', title: a[0], lead: a[1], body: a[2] }; }
  else if (n.kind === 'ok') r = { emo: '✅', title: st.ok, lead: t.act(n.op, n.k, n.side), body: t.why[n.op] };
  else if (n.kind === 'fixed') r = { emo: '✅', title: st.fixed, lead: t.act(n.op, n.k, n.side), body: st.fixedBody };
  else if (n.kind === 'tilt') { const [a, b] = weights(S.st); r = { emo: '⚠️', title: st.tilt, lead: t.act(n.op, n.k, n.side), body: st.tiltBody(st.heavy[a > b ? 'l' : 'r']) }; }
  else if (n.kind === 'block') r = { emo: '🚫', title: st.block, lead: st.why[n.why], body: st.blockBody };
  else if (n.kind === 'hint') r = { emo: '💡', title: st.hint, lead: t.tip(n.op, n.k), body: st.hintBody };
  else r = { emo: '💡', title: st.hint, lead: st.noHint, body: st.hintBody };

  const go = r.go ? `<button class="btn ghost" data-go="1">🔍 ${esc(st.check)}</button>` : '';

function chkVals() {

function chkExpr(x, n, g) {

function render() {

    : `<div class="q" style="color:${S.answer === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(t.fb[S.answer])}</div><div class="opts"><button>${esc(t.go)} →</button></div>`;
}

function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function drawBox(c, cx, by, s, col, label, open) {
  const hh = s * 0.8, x = cx - s / 2, y = by - hh;
  const g = c.createLinearGradient(0, y, 0, by); g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
  c.fillStyle = g; rr(c, x, y, s, hh, s * 0.1); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.3)'; c.lineWidth = Math.max(1, s * 0.04); c.stroke();
  c.fillStyle = col[2];
  if (!open) { rr(c, x - s * 0.05, y - s * 0.16, s * 1.1, s * 0.2, s * 0.06); c.fill(); }
  else { c.save(); c.translate(x - s * 0.04, y); c.rotate(-0.55); rr(c, 0, -s * 0.2, s * 1.08, s * 0.2, s * 0.06); c.fill(); c.restore();
         c.fillStyle = 'rgba(15,20,40,.55)'; rr(c, x + s * 0.1, y + s * 0.1, s * 0.8, hh - s * 0.2, s * 0.08); c.fill(); }
  c.fillStyle = open ? '#fff' : '#3a2300'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = `900 ${s * (open && label.length > 2 ? 0.36 : 0.5)}px Nunito, sans-serif`; c.fillText(label, cx, y + hh * 0.52);
}
function drawPan(c, sd, px, py, o, time) {
  const nbx = sd.x + (sd.y || 0), nw = Math.max(0, sd.n), nl = Math.max(0, -sd.n);
  const rowsB = Math.ceil(nbx / 4), rowsW = Math.ceil(nw / 10), hB = rowsB * (BX + 3), hW = rowsW * (DS + 2), hL = nl ? 62 : 0;
  const f = Math.min(1, CAP / Math.max(1, hB + hW + hL)), bs = BX * f, ds = DS * f;
  for (let i = 0; i < nbx; i++) {
    const row = Math.floor(i / 4), cnt = Math.min(4, nbx - row * 4), col = i % 4;
    const bx = px + (col - (cnt - 1) / 2) * (bs + 4 * f), by = py - row * (bs * 0.8 + 3 * f) - 1;
    const teal = o.teal || i >= sd.x;
    drawBox(c, bx, by, bs, teal ? TEAL : ORANGE, o.open ? num(o.g) : (teal && o.lab2 ? o.lab2 : o.lab), !!o.open);
  }
  const yW = py - rowsB * (bs * 0.8 + 3 * f) - 1;
  for (let r = 0; r < rowsW; r++) {
    const cnt = Math.min(10, nw - r * 10);
    for (let j = 0; j < cnt; j++) {
      const dx = px + (j - (cnt - 1) / 2) * (ds + f), dy = yW - (r + 0.5) * (ds + 2 * f);
      const g = c.createRadialGradient(dx - ds * 0.2, dy - ds * 0.25, 1, dx, dy, ds * 0.6);
      g.addColorStop(0, '#dbe7ff'); g.addColorStop(1, '#4a6fc4');
      c.fillStyle = g; c.beginPath(); c.arc(dx, dy, ds / 2, 0, 7); c.fill();
    }
  }
  if (nl) {
    const yB = yW - rowsW * (ds + 2 * f) - 4 * f, per = 6;
    for (let i = 0; i < nl; i++) {
      const row = Math.floor(i / per), cnt = Math.min(per, nl - row * per), col = i % per;
      const bx = px + (col - (cnt - 1) / 2) * 22 * f, by = yB - 26 * f - row * 24 * f + Math.sin(time * 1.6 + i) * 2 * f;
      c.strokeStyle = 'rgba(220,225,245,.55)'; c.lineWidth = 1; c.beginPath(); c.moveTo(px, yB + 4 * f); c.lineTo(bx, by + 12 * f); c.stroke();
      const g = c.createRadialGradient(bx - 3 * f, by - 4 * f, 1, bx, by, 13 * f);
      g.addColorStop(0, '#ffb3c0'); g.addColorStop(1, '#e0405e');
      c.fillStyle = g; c.beginPath(); c.ellipse(bx, by, 9.5 * f, 12 * f, 0, 0, 7); c.fill();
    }
  }
}
// local coordinates: pivot at (0,0), the beam is 2 x BEAM wide, the stand reaches y = 256
function drawScale(c, x0, y0, s, ang, Ls, Rs, o, time) {
  c.save(); c.translate(x0, y0); c.scale(s, s);
  const ca = Math.cos(ang), sa = Math.sin(ang), ends = [[-BEAM * ca, BEAM * sa], [BEAM * ca, -BEAM * sa]];
  const level = Math.abs(ang) < 0.012 && o.level;
  c.fillStyle = '#262e4a'; rr(c, -7, 0, 14, 250, 5); c.fill(); rr(c, -78, 240, 156, 16, 8); c.fill();
  [Ls, Rs].forEach((sd, i) => {
    const [ex, ey] = ends[i], py = ey + HANG;
    c.strokeStyle = 'rgba(200,210,235,.5)'; c.lineWidth = 2; c.beginPath();
    c.moveTo(ex, ey); c.lineTo(ex - PLATE / 2 + 6, py); c.moveTo(ex, ey); c.lineTo(ex + PLATE / 2 - 6, py); c.stroke();
    const g = c.createLinearGradient(0, py, 0, py + 20); g.addColorStop(0, '#e8c36a'); g.addColorStop(1, '#a8741f');
    c.fillStyle = g; c.beginPath(); c.moveTo(ex - PLATE / 2, py); c.lineTo(ex + PLATE / 2, py);
    c.quadraticCurveTo(ex + PLATE / 2 - 16, py + 20, ex, py + 20); c.quadraticCurveTo(ex - PLATE / 2 + 16, py + 20, ex - PLATE / 2, py); c.fill();
    drawPan(c, sd, ex, py, o, time);
    if (o.tot) { c.fillStyle = '#EDEFF7'; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.font = '900 24px Nunito, sans-serif'; c.fillText(num(o.tot[i]), ex, py + 46); }
  });
  const g = c.createLinearGradient(0, -8, 0, 8); g.addColorStop(0, '#f5d27a'); g.addColorStop(1, '#b07d22');
  c.strokeStyle = g; c.lineWidth = 9; c.lineCap = 'round'; c.beginPath(); c.moveTo(ends[0][0], ends[0][1]); c.lineTo(ends[1][0], ends[1][1]); c.stroke();
  c.fillStyle = '#f5d27a'; for (const [ex, ey] of ends) { c.beginPath(); c.arc(ex, ey, 6, 0, 7); c.fill(); }
  // needle + fixed mark
  const th = -ang * 2.2;
  c.strokeStyle = level ? '#3ddc97' : '#ff8a3d'; c.lineWidth = 4; c.beginPath(); c.moveTo(0, 0); c.lineTo(-Math.sin(th) * -42, -Math.cos(th) * 42); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.moveTo(-6, -58); c.lineTo(6, -58); c.lineTo(0, -48); c.fill();
  c.fillStyle = level ? '#3ddc97' : '#f5d27a'; c.beginPath(); c.arc(0, 0, 11, 0, 7); c.fill();
  c.restore();
}

let geo = { ox: 0, oy: 0, u: 1 };
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view, t = T[lang];
  let Ls, Rs, Lw = 0, Rw = 0, o = { lab: S.sym, level: true };
  if (v === 'balance') {
    Ls = { x: S.st.lx, n: S.st.ln }; Rs = { x: S.st.rx, n: S.st.rn }; [Lw, Rw] = weights(S.st);
    if (S.puz === 's1') { o.teal = true; }
  } else if (v === 'check') {
    const e = S.eq0, { g, L, R } = chkVals();
    Ls = { x: e.lx, n: e.ln }; Rs = { x: e.rx, n: e.rn }; Lw = L; Rw = R; o = { ...o, open: true, g, tot: [L, R], teal: S.puz === 's1' };
  } else {
    const { a, b, d, c: cc } = S.mk;
    Ls = { x: a, n: b }; Rs = { x: d, n: cc }; o.lab = 'x';
  }
  const pre = v === 'balance' && S.pre;
  // spring: the beam tips by the difference and wobbles into place
  const target = pre ? 0 : 0.24 * Math.tanh((Lw - Rw) / 4);
  for (let i = 0; i < 2; i++) { S.vel += (-90 * (S.ang - target) - 6 * S.vel) * dt / 2; S.ang += S.vel * dt / 2; }
  // layout
  const askH = !S.answered && v === 'balance' ? ask.offsetHeight + 14 : 0;
  const SW = 640, SH = 335, u = Math.min(1.25, w / SW, (h - askH - 8) / SH);
  const topT = askH ? 6 : Math.max(6, (h - SH * u) / 2);
  S.top = lerp(S.top, topT, Math.min(1, dt * 8));
  const ox = w / 2, oy = S.top + 70 * u;
  geo = { ox, oy, u };
  if (pre) {
    const mini = 0.52;
    drawScale(c, ox - 160 * u, oy + 10 * u, u * mini, 0, { x: 1, y: 1, n: 0 }, { x: 0, n: 10 }, { lab: 'x', lab2: 'y', level: true }, time);
    drawScale(c, ox + 160 * u, oy + 10 * u, u * mini, 0, { x: 1, n: 0 }, { x: 0, y: 1, n: 2 }, { lab: 'x', lab2: 'y', level: true }, time);
    c.fillStyle = '#EDEFF7'; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.font = `900 ${Math.max(13, 24 * u)}px Nunito, sans-serif`;
    c.fillText('x + y = 10', ox - 160 * u, oy + 10 * u + 300 * u * mini); c.fillText('x = y + 2', ox + 160 * u, oy + 10 * u + 300 * u * mini);
  } else drawScale(c, ox, oy, u, S.ang, Ls, Rs, o, time);
  // floating "−5 ●" labels over the pans
  const now = time;
  S.fx = S.fx.filter((f) => now - f.t0 < 1.3);
  for (const f of S.fx) {
    const age = (now - f.t0) / 1.3;
    c.globalAlpha = 1 - age; c.fillStyle = '#ffd36b'; c.textAlign = 'center'; c.font = `900 ${Math.max(16, 26 * u)}px Nunito, sans-serif`;
    c.fillText(f.txt, ox + f.s * BEAM * 0.95 * u, oy + (HANG - 40 - 70 * age) * u);
    c.globalAlpha = 1;
  }
});
load('p4');
render();
</script>
