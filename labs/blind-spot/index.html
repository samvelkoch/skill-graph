  drawKid(c, X, Y, 0, Math.max(30, Math.min(40, cam.s * 2.6)), { ring: true, dash: moving, alpha: moving ? 0.6 : 1, ringColor: hitNow ? '#ff4d4d' : safeNow ? '#3ddc97' : undefined, ringFill: hitNow ? `rgba(255,60,60,${0.2 + 0.2 * Math.sin(time * 9)})` : undefined });

  if (tn.ans !== null) { const w1 = pill(c, t.turn.front, 8, 8, { sw: '#4ea8ff' }); pill(c, t.turn.back, 8 + w1 + 6, 8, { sw: '#ff9f43' }); }
  if (hitNow) flash(c, w, h, time, tn.hitT, t.turn.hit);
}
function drawFaceView(c, cam, w, h, time) {
  const t = T[lang], idx = Math.min(S.fs.i, 3), sc = SCENES[idx], pick = S.fs.picks[idx], V = VEH[sc.type];
  drawSceneBg(c, cam, w, h, sc);
  if (pick !== undefined) { paintVision(c, cam, w, h, sc.type, V.h, sc.pose, 1); coneEdges(c, cam, sc.pose, conesOf(sc.type, V.h)); }
  if (sc.arrow) arrowDraw(c, cam, sc.arrow[0], sc.arrow[1], sc.arrow[2], sc.arrow[3], 'rgba(255,214,102,.95)');
  drawVehicle(c, cam, sc.type, sc.pose, pick !== undefined);
  if (sc.bg === 'leave') { const [x, y] = toWorld(sc.pose, -1.15, 0.1), [X, Y] = cam.p(x, y), a = 0.5 + 0.5 * Math.sin(time * 6); c.save(); c.fillStyle = `rgba(255,170,30,${0.35 + 0.5 * a})`; c.beginPath(); c.arc(X, Y, 0.45 * cam.s, 0, TAU); c.fill(); c.restore(); }
  const right = sc.spots.findIndex((p) => p.ok);
  sc.spots.forEach((p, j) => {
    const [X, Y] = cam.p(p.x, p.y), L = ['A', 'B', 'C'][j];
    if (pick === undefined) drawSpot(c, X, Y, L, 'idle', time);
    else if (j === pick) { drawKid(c, X, Y, 0, 34, { ring: false }); badge(c, X, Y, p.ok, ''); }
    else if (j === right) drawSpot(c, X, Y, L, 'ok', time);
    else drawSpot(c, X, Y, L, 'dim', time);
  });
  if (pick !== undefined) legend(c, t.hide.seeT, t.hide.hidT);
}
const VAN_POSE = (y) => ({ x: 0, y, psi: Math.PI });
function drawBeep(c, cam, w, h, dt, time) {
  const t = T[lang], bp = S.bp, f = S.bf;
  if (bp.mode === 'run') {
    bp.y -= dt * 1.0; bp.beep -= dt;
    if (bp.beep <= 0) { bp.beep = 0.5; sfx.tick(); }
    const [u, v] = toLocal(VAN_POSE(bp.y), f.x, f.y);
    if (Math.hypot(Math.max(Math.abs(u) - 1.0, 0), v > 0 ? v : v < -5.2 ? -5.2 - v : 0) < 0.55) { bp.mode = 'hit'; bp.t = time; sfx.bad(); render(); }
    else if (bp.y <= 5.0) { bp.mode = 'done'; sfx.good(); render(); }
  }
  const pose = VAN_POSE(bp.y), pulse = bp.mode === 'hit' || bp.mode === 'done' ? 1 : 0.62 + 0.38 * Math.sin(time * 8);
  drawDrive(c, cam, w, h);
  paintVision(c, cam, w, h, 'van', VEH.van.h, pose, pulse); coneEdges(c, cam, pose, conesOf('van', VEH.van.h));
  drawVehicle(c, cam, 'van', pose, true);
  if (bp.mode === 'idle') arrowDraw(c, cam, 0, 4.6, 0, 2.6, 'rgba(255,214,102,.95)');
  if (bp.mode === 'run' && bp.beep > 0.22) { const [x, y] = toWorld(pose, 1.9, -6.2), [X, Y] = cam.p(x, y); pill(c, 'BEEP!', X, Y - 10, { center: true, size: 14, bg: 'rgba(240,170,30,.95)', color: '#2a1c00' }); }
  const [X, Y] = cam.p(f.x, f.y), hid = hiddenAt('van', VEH.van.h, pose, f.x, f.y);
  drawKid(c, X, Y, 0, Math.max(30, Math.min(40, cam.s * 2.6)), { ring: true, ringColor: hid ? '#ff6b5e' : '#3ddc97' });
  legend(c, t.hide.seeT, t.hide.hidT);
  if (bp.mode === 'hit') flash(c, w, h, time, bp.t, t.beep.hit);
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  const cam = camFor(BOX[curKey()], w, h), v = lab.view;
  if (S.sec === 'beep') drawBeep(c, cam, w, h, dt, time);
  else if (S.sec === 'glass') drawHide(c, cam, w, h, time, true);
  else if (v === 'hide') drawHide(c, cam, w, h, time, false);
  else if (v === 'turn') drawTurn(c, cam, w, h, dt, time);
  else drawFaceView(c, cam, w, h, time);
});

// --- pointer: drag the cyclists (Hide, secrets) or tap a spot (Face) ------------------------------------------------
const cv = $('cv');
let drag = null;
const figsNow = () => (S.sec === 'beep' ? [S.bf] : S.sec === 'glass' ? [S.gf] : lab.view === 'hide' && !S.sec ? S.figs : []);
function showStage() { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
cv.addEventListener('pointerdown', (ev) => {
  const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top, cam = camFor(BOX[curKey()], r.width, r.height);
  if (lab.view === 'face' && !S.sec) {
    const fs = S.fs; if (fs.i > 3 || fs.picks[fs.i] !== undefined) return;
    const sc = SCENES[fs.i]; let best = -1, bd = 1e9;
    sc.spots.forEach((p, j) => { const [X, Y] = cam.p(p.x, p.y), d = Math.hypot(px - X, py - Y); if (d < bd) { bd = d; best = j; } });
    if (best < 0 || bd > 30) return;
    fs.picks[fs.i] = best; fs.res[fs.i] = sc.spots[best].ok; (sc.spots[best].ok ? sfx.good : sfx.bad)(); render(); showStage();
    return;
  }
  let best = null, bd = 1e9;
  for (const f of figsNow()) { const [X, Y] = cam.p(f.x, f.y), d = Math.hypot(px - X, py - Y); if (d < bd) { bd = d; best = f; } }
  if (!best || bd > 30) return;
  const [wx, wy] = cam.inv(px, py);
  drag = { f: best, dx: best.x - wx, dy: best.y - wy }; cv.setPointerCapture(ev.pointerId); ev.preventDefault();
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const r = cv.getBoundingClientRect(), b = BOX[curKey()], cam = camFor(b, r.width, r.height), [wx, wy] = cam.inv(ev.clientX - r.left, ev.clientY - r.top), f = drag.f;
  f.x = clamp(wx + drag.dx, b.x0 + 0.8, b.x1 - 0.8); f.y = clamp(wy + drag.dy, b.y0 + 0.8, b.y1 - 0.8);
  if (S.sec === 'beep') pushOut(f, 'van', VAN_POSE(S.bp.y), 0.5); else pushOut(f, S.sec === 'glass' ? 'lorry' : S.veh, POSE_HIDE, 0.55);
  if (!f.moved) { f.moved = true; render(); }
});
const endDrag = () => { drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls ------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, tn = S.tn, fs = S.fs;
  if (act === 'veh') { S.veh = b.dataset.v; S.figs.forEach((f) => pushOut(f, S.veh, POSE_HIDE, 0.55)); sfx.click(); }
  else if (act === 'check') {
    if (S.checked) { S.checked = false; S.eyes = false; S.figs = figs0(); sfx.click(); }
    else if (S.figs.every((f) => f.moved)) { S.checked = true; S.eyes = true; sfx.snap(); showStage(); }
  } else if (act === 'eyes') { S.eyes = !S.eyes; sfx.click(); }
  else if (act === 'ans') { if (tn.ans === null) { tn.ans = +b.dataset.j; (tn.ans === 2 ? sfx.good : sfx.bad)(); } }
  else if (act === 'tgo') { tn.mode = 'run'; tn.i = 0; sfx.click(); showStage(); }
  else if (act === 'tsafe') { tn.mode = 'slide'; tn.slide = 0; sfx.click(); }
  else if (act === 'tagain') { tn.mode = 'idle'; tn.i = 0; tn.bike = BIKE0.slice(); tn.safe = false; tn.slide = 0; sfx.click(); }
  else if (act === 'fnext') { fs.i++; sfx.click(); }
  else if (act === 'fagain') { S.fs = { i: 0, picks: [], res: [] }; sfx.click(); }
  else if (act === 'bgo') { S.bf.x = 0.2; S.bf.y = 0.3; S.bp = { mode: 'run', y: 10.4, beep: 0, t: 0 }; sfx.click(); showStage(); }
  render();
});
$('bsSecs').addEventListener('click', (ev) => {
  const k = ev.target.closest('[data-k]')?.dataset.k; if (!k) return;
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === k ? null : k; sfx.click();
  if (S.sec === 'glass') { S.gf.x = 1.1; S.gf.y = 1.8; }
  if (S.sec === 'beep') { S.bp = { mode: 'idle', y: 10.4, beep: 0, t: 0 }; S.bf.x = 0.2; S.bf.y = 0.3; }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => { if (ev.target.id === 'bsCab') { S.cabH = +ev.target.value; render(); } });

// --- one render per change: panels, readout and the state card -----------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  cv.style.touchAction = (v === 'hide' && !sec) || sec ? 'none' : 'pan-y';
  $('bsHide').hidden = !(v === 'hide' && !sec); $('bsTurn').hidden = !(v === 'turn' && !sec); $('bsFace').hidden = !(v === 'face' && !sec);
  $('bsGlass').hidden = sec !== 'glass'; $('bsBeep').hidden = sec !== 'beep';
  const open = secret.unlocked();
  $('bsSecs').innerHTML = [['glass', '👀'], ['beep', '🔊']].map(([k, e]) => `<button type="button" class="chip bs-c secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-k="${k}">${open ? `${e} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec === 'glass') renderGlass(t); else if (sec === 'beep') renderBeep(t);
  else if (v === 'hide') renderHide(t); else if (v === 'turn') renderTurn(t); else renderFace(t);
}
function renderHide(t) {
  const H = t.hide, type = S.veh, V = VEH[type], placed = S.figs.filter((f) => f.moved).length, fb = frontBlind(type, V.h);
  lab.setGlow('rgba(61, 220, 151, .2)');
  $('bsHideQ').textContent = H.q;
  $('bsVeh').innerHTML = ['car', 'bus', 'lorry'].map((k) => `<button type="button" class="chip bs-c ${k === type ? 'on' : ''}" data-act="veh" data-v="${k}">${esc(t.veh[k])}</button>`).join('');
  const ck = $('bsCheck'); ck.textContent = S.checked ? H.again : H.check; ck.disabled = !S.checked && placed < 3; ck.style.opacity = ck.disabled ? 0.4 : '';
  const ey = $('bsEyes'); ey.hidden = !S.checked; ey.textContent = t.eyes; ey.classList.toggle('on', S.eyes);
  if (!S.checked) {
    lab.setReadout(`${placed}/3`, H.placedSub, '', '#3ddc97');
    lab.setState({ emo: '🤔', title: H.stT, lead: H.stL, body: '' }); lab.setFacts([]);
  } else {
    const n = S.figs.filter((f) => figHidden(type, V.h, f)).length;
    lab.setReadout(H.res(n), H.resSub, H.pill(num(fb)), '#3ddc97');
    lab.setState({ emo: '🚚', title: H.title(n), lead: H.lead[type], body: H.body[type](num(fb)) }); lab.setFacts(t.facts.hide);
  }
}
function renderTurn(t) {
  const U = t.turn, tn = S.tn, answered = tn.ans !== null;
  lab.setGlow('rgba(255, 159, 67, .22)');
  $('bsTurnQ').textContent = U.q;
  $('bsTurnOpts').innerHTML = U.opts.map((o, j) => `<button type="button" class="bs-opt ${answered ? (j === 2 ? 'good' : j === tn.ans ? 'bad' : 'dim') : ''}" data-act="ans" data-j="${j}"${answered ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  let res = '';
  if (answered) res += `<p class="bs-verdict ${tn.ans === 2 ? 'ok' : 'no'}">${esc(tn.ans === 2 ? t.right : U.wrong)} ${esc(U.expl)}</p>`;
  if (tn.mode === 'hit') res += `<p class="bs-verdict no">${esc(U.hit)} ${esc(U.hitL)}</p>`;
  if (tn.safe) res += `<p class="bs-verdict ok">${esc(U.safeL)}</p>`;
  $('bsTurnRes').innerHTML = res;
  const btn = (act, label, cls = 'btn') => `<button type="button" class="${cls}" data-act="${act}">${esc(label)}</button>`;
  let b = '';
  if (answered && tn.mode === 'idle') b = btn('tgo', U.go);
  else if (tn.mode === 'hit') b = btn('tsafe', U.safeBtn) + btn('tagain', U.again, 'btn ghost');
  else if (tn.mode === 'run' || tn.mode === 'done') b = btn('tagain', U.again, 'btn ghost');
  $('bsTurnBtns').innerHTML = b;
  if (!answered) { lab.setReadout('?', '', '', '#ff9f43'); lab.setState({ emo: '↪️', title: U.stT, lead: U.stL, body: '' }); lab.setFacts([]); return; }
  lab.setReadout(`${num(CUT)} ${t.m}`, U.sub, '', '#ff9f43');
  const st = tn.mode === 'hit' ? U.hitSt : tn.safe && tn.mode === 'done' ? U.safeSt : U.stR;
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] }); lab.setFacts(t.facts.turn);
}
function renderFace(t) {
  const F = t.face, fs = S.fs, end = fs.i > 3, idx = Math.min(fs.i, 3), sc = F.scenes[idx], pick = fs.picks[idx], k = fs.res.filter(Boolean).length, done = fs.res.length;
  lab.setGlow('rgba(61, 220, 151, .18)');
  $('bsFaceDots').textContent = [0, 1, 2, 3].map((i) => (i < fs.i || (i === fs.i && pick !== undefined) ? (fs.res[i] ? '✓' : '✗') : i === fs.i ? '◉' : '○')).join(' ');
  $('bsFaceQ').textContent = end ? F.end(k) : sc.q;
  let res = '';
  if (!end && pick !== undefined) {
    const spots = SCENES[idx].spots, ok = spots[pick].ok, right = spots.findIndex((p) => p.ok);
    res = `<p class="bs-verdict ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : F.wrong)} ${esc(sc.why[pick])}</p>` + (ok ? '' : `<p class="bs-verdict ok">${esc(F.safe)} ${esc(sc.why[right])}</p>`);
  } else if (end) res = `<p class="bs-verdict ok">${esc(F.endL)}</p>`;
  $('bsFaceRes').innerHTML = res;
  $('bsFaceBtns').innerHTML = end ? `<button type="button" class="btn ghost" data-act="fagain">${esc(F.again)}</button>`
    : pick !== undefined ? `<button type="button" class="btn" data-act="fnext">${esc(idx < 3 ? F.next : F.see)}</button>` : '';
  lab.setReadout(done ? `${k}/${done}` : '?', done ? F.found : '', '', '#3ddc97');
  if (!done) lab.setState({ emo: '👀', title: F.stT, lead: F.stL, body: '' });
  else lab.setState({ emo: F.rule[0], title: F.rule[1], lead: F.rule[2], body: F.rule[3] });
  lab.setFacts(t.facts.face);
}
function renderGlass(t) {
  const G = t.glass, fb = frontBlind('lorry', S.cabH);
  lab.setGlow('rgba(61, 220, 151, .22)');
  $('bsGlassQ').textContent = G.q; $('bsCabL').textContent = G.cab; $('bsCabV').textContent = `${num(S.cabH)} ${t.m}`;
  const el = $('bsCab'); if (+el.value !== S.cabH) el.value = S.cabH;
  lab.setReadout(`${num(fb)} ${t.m}`, G.sub, '', '#3ddc97');
  lab.setState({ emo: G.st[0], title: G.st[1], lead: G.st[2], body: G.st[3] }); lab.setFacts([]);
}
function renderBeep(t) {
  const B = t.beep, bp = S.bp;
  lab.setGlow('rgba(255, 90, 90, .22)');
  $('bsBeepQ').textContent = B.q;
  $('bsBeepRes').innerHTML = bp.mode === 'hit' ? `<p class="bs-verdict no">${esc(B.hit)} ${esc(B.hitL)}</p>` : bp.mode === 'done' ? `<p class="bs-verdict ok">${esc(t.right)} ${esc(B.ok)}</p>` : '';
  $('bsBeepBtns').innerHTML = `<button type="button" class="btn" data-act="bgo">${esc(bp.mode === 'idle' ? B.go : B.again)}</button>`;
  lab.setReadout(bp.mode === 'idle' ? '🔊' : bp.mode === 'run' ? 'BEEP BEEP' : bp.mode === 'hit' ? '⚠️' : '✓', bp.mode === 'idle' ? B.val : '', '', '#ff5a5a');
  const st = bp.mode === 'hit' ? [B.st[0], B.hit, B.hitL, ''] : bp.mode === 'done' ? ['✅', B.ok, B.okL, ''] : B.st;
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] }); lab.setFacts([]);
}
render();
</script>
