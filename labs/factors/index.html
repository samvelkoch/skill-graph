    lab.setState({ emo: '🥖', title: s.title, lead: s.lead, body: '', extra: '' });
  } else {
    lab.setReadout(out, s.perDay, `⚠ ${names}`, '#e0903f');
    const right = S.guess === out, showRule = S.ruleOk && right || S.miss >= 2;
    const calc = s.calc(f, b, o, cp[0], cp[1], cp[2]).map((x) => `<div class="fx-def">${esc(x)}</div>`).join('');
    lab.setState(right
      ? { emo: '✅', title: s.right, lead: s.neck(names), body: showRule ? s.rule : s.next, extra: calc }
      : { emo: '🤔', title: s.wrong(S.guess, out), lead: s.neck(names), body: showRule ? `${s.rule} ${s.next}` : s.look, extra: calc });
  }
}
function rBuy(t) {
  const u = t.bu;
  lab.setGlow('rgba(95, 143, 208, .26)');
  const end = S.r >= 3;
  $('shop').style.display = end ? 'none' : ''; $('coinsL').parentElement.style.display = end ? 'none' : '';
  $('coinsL').textContent = u.coins; $('coinsV').textContent = BUDGET - spent();
  const nm = { o: u.oven, b: u.baker, f: u.flour };
  $('shop').innerHTML = SHOP.map((s) => `<button class="fx-buy ${S.buy[s.k] ? 'on' : ''}" data-act="buy" data-k="${s.k}"${S.rev3 || (!S.buy[s.k] && spent() + s.price > BUDGET) ? ' disabled' : ''}><span class="e">${s.e}</span><span>${esc(nm[s.k])}</span><span class="p">${s.price}</span></button>`).join('');
  $('mainB').textContent = end ? u.again : S.rev3 ? (S.r === 2 ? u.finish : u.next) : u.open;
  if (end) {
    const k = S.hits.filter(Boolean).length;
    lab.setReadout(`${k}/3`, '', '', '#5f8fd0');
    lab.setState({ emo: '🏆', title: u.endT(k), lead: u.endLead, body: '', extra: '' });
    return;
  }
  const R = ROUNDS[S.r], c = cur3(), now = outOf(R.f, R.b, R.o), after = outOf(c.f, c.b, c.o);
  if (!S.rev3) {
    lab.setReadout(now, `${t.sh.perDay} · ${u.now}`, '', '#5f8fd0');
    lab.setState({ emo: '💰', title: u.round(S.r + 1), lead: u.lead, body: '', extra: '' });
    return;
  }
  const best = bestOf(R), hit = after === best.out, acc = { o: u.ovenA, b: u.bakerA, f: u.flourA };
  const bought = SHOP.some((s) => S.buy[s.k]);
  const lim = limiters(c.f, c.b, c.o).map((i) => t.sh.names[KEYS[i]]).join(t.sh.and);
  const notb = SHOP.filter((s) => !S.buy[s.k]).map((s) => `${nm[s.k]} (${s.price})`).join(', ');
  const bestList = SHOP.filter((s) => best.mask & (s.k === 'o' ? 1 : s.k === 'b' ? 2 : 4)).map((s) => `${acc[s.k]} (${s.price})`).join(' + ');
  lab.setReadout(after, `${t.sh.perDay} · ${now} → ${after}`, `⚠ ${lim}`, '#5f8fd0');
  lab.setState({
    emo: hit ? '✅' : '🤔', title: hit ? u.right : u.notBest,
    lead: !bought ? u.nothing : after === now ? u.same(now) : u.change(now, after),
    body: hit ? u.neck(lim) : `${u.bestWas(best.out, bestList)} ${u.neck(lim)}`,
    extra: notb ? `<div class="fx-def">${esc(u.ghost(notb))}</div><div class="fx-def">${esc(u.opp)}</div>` : '',
  });
}

// --- the picture ------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  TIME = time;
  const v = lab.view, t = T[lang];
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  geo = { ox, oy, s };
  let o, out = 0, revealed = false;
  if (v === 'short') { o = { f: S.f, b: S.b, o: S.o }; out = outOf(S.f, S.b, S.o); revealed = S.rev; }
  else if (v === 'buy') {
    const c3 = S.r < 3 ? cur3() : { ...ROUNDS[2], f: ROUNDS[2].f + 4, b: ROUNDS[2].b + 1 };
    o = { ...c3 }; revealed = S.rev3 && S.r < 3; out = outOf(c3.f, c3.b, c3.o);
    if (S.r < 3) {
      const R = ROUNDS[S.r]; o.fresh = { f: S.buy.f * 4, b: S.buy.b, o: S.buy.o };
      if (revealed) o.ghost = { f: !S.buy.f, b: !S.buy.b, o: !S.buy.o };
      if (!revealed) out = outOf(R.f, R.b, R.o);
    }
  } else o = { f: 4, b: 3, o: 3 };
  S.revT += dt;
  S.barT = clamp(S.barT + (revealed ? dt / 0.7 : -dt / 0.2), 0, 1);
  const tgt = revealed ? out : 0;
  S.disp += (tgt - S.disp) * Math.min(1, dt * 5);
  const bar = ease(S.barT);
  o.hot = revealed && v !== 'sort';
  if (v !== 'sort' && S.r < 3) {
    o.panel = true; o.caps = revealed ? caps(o.f, o.b, o.o) : null;
    o.pulse = revealed && S.revT > 0.6 ? limiters(o.f, o.b, o.o) : [];
    o.cnt = v === 'buy' && !revealed ? `${out} ${t.sh.perShort} · ${t.bu.now}` : revealed ? `${Math.round(S.disp)} ${t.sh.perShort}` : `? ${t.sh.perShort}`;
  } else if (v === 'buy') { o.panel = false; o.cnt = null; }
  if (v === 'short' || v === 'buy') o.boss = S.sec === 'boss';
  // loaves popping out of the ovens
  if (o.hot && out > 0) {
    S.acc += dt * Math.min(5, out / 70);
    while (S.acc >= 1) { S.acc -= 1; const i = Math.floor(Math.random() * Math.min(5, o.o)); S.parts.push({ x: 218 + i * 28, y: 214, vx: 18 + Math.random() * 30, vy: -70 - Math.random() * 25, l: 1.3 }); }
  } else S.acc = 0;
  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 190 * dt; p.l -= dt * .8; }
  S.parts = S.parts.filter((p) => p.l > 0);
  const bars = o;
  c.save();
  c.fillStyle = '#161c2e'; c.fillRect(0, 0, w, h);
  c.translate(ox, oy); c.scale(s, s);
  rr(c, 0, 0, W, H, 16); c.clip();
  const saveBar = S.barT; S.barT = bar;
  drawWorld(c, time, v === 'sort' ? { f: 4, b: 3, o: 3 } : bars);
  S.barT = saveBar;
  if (v === 'sort') drawSort(c, t, time);
  c.restore();
});
render();
</script>
