  if (p < 0 || p >= tune.len * passes) return null;
  const x = p % tune.len, k = Math.floor(p / tune.len);

  return null;
}
const statsCache = new Map();
// clash rule: at every half-beat take every pair of sounding notes; the pair clashes if it is 1, 2, 6, 10 or 11 semitones apart
function stats(tune, d, k, passes) {
  const key = `${tune.id}|${d}|${k}|${passes}`;
  if (statsCache.has(key)) return statsCache.get(key);
  let total = 0, pairs = 0;
  const end = (k - 1) * d + tune.len * passes;
  for (let t = 0; t < end; t += 0.5) {
    const ns = [];
    for (let v = 0; v < k; v++) { const n = voiceNote(tune, v * d, t, passes); if (n) ns.push(n); }
    for (let i = 0; i < ns.length; i++) for (let j = i + 1; j < ns.length; j++) { pairs++; if (rubs(ns[i].m, ns[j].m)) total++; }
  }
  const r = { total, pairs, share: pairs ? total / pairs : 0 };
  statsCache.set(key, r);
  return r;
}

const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); };

// --- sound: soft voices (sine + a little triangle), each with its own pan ---------------------------------------
function actx() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); master = AC.createGain(); master.gain.value = 0.9;
      master.connect(comp); comp.connect(AC.destination);
    }
    if (AC.state !== 'running') AC.resume().catch(() => {});
    return AC;
  } catch { return null; }
}
['pointerdown', 'pointerup', 'touchend', 'keydown', 'click'].forEach((e) => addEventListener(e, () => { if (store.get('sound', false)) { unmuteIOS(); actx(); } }, { passive: true }));
// a music lab: the first tap that makes a sound turns the shell's sound on, unless the visitor switched it off before
function wantSound() { if (store.get('sound', null) === null) $('sound').click(); return store.get('sound', false); }
const soundOn = () => store.get('sound', false);
function sing(m, voice, beats, bpm) {
  if (!soundOn()) return;
  unmuteIOS();
  const x = actx(); if (!x) return;
  const f = 440 * 2 ** ((m - 69) / 12), t = x.currentTime, dur = Math.max(0.12, beats * 60 / bpm * 0.92), peak = 0.15;
  const g = x.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + 0.03);
  g.gain.linearRampToValueAtTime(peak * 0.72, t + 0.16); g.gain.setValueAtTime(peak * 0.72, t + Math.max(0.17, dur - 0.1));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.1);
  if (x.createStereoPanner) { const p = x.createStereoPanner(); p.pan.value = PAN[voice] ?? 0; g.connect(p); p.connect(master); } else g.connect(master);
  [['sine', 1], ['triangle', 0.22]].forEach(([ty, v]) => {
    const o = x.createOscillator(), og = x.createGain(); o.type = ty; o.frequency.value = f; og.gain.value = v;
    o.connect(og).connect(g); o.start(t); o.stop(t + dur + 0.15);
  });
  for (let i = live.length - 1; i >= 0; i--) if (live[i].until < t) live.splice(i, 1);
  live.push({ g, until: t + dur + 0.15 });
}
function stopAudio() {
  if (!AC) { live.length = 0; return; }
  const t = AC.currentTime;
  for (const l of live) { try { l.g.gain.cancelScheduledValues(t); l.g.gain.setValueAtTime(Math.max(0.0001, l.g.gain.value), t); l.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07); } catch { /* ignore */ } }
  live.length = 0;
}

// --- what the picture shows now -------------------------------------------------------------------------------
function cfg() {
  const v = lab.view;
  if (S.sec === 'minor') return { tune: MINOR, k: 4, d: 8, passes: 2, scroll: true };
  if (v === 'voices') return { tune: JAC, k: S.n, d: 8, passes: 2, scroll: true };
  if (v === 'freeze') return { tune: S.tune === 'scale' ? SCALE : JAC, k: 4, d: S.delay === 'beat1' ? 1 : 8, passes: 2, scroll: true };
  return { tune: JAC, k: 2, d: S.d, passes: 1, scroll: false };
}
const endBeat = (c) => (c.k - 1) * c.d + c.tune.len * c.passes;
function soundingAt(c, t) {
  const r = [];
  for (let i = 0; i < c.k; i++) { const n = voiceNote(c.tune, i * c.d, t, c.passes); if (n) r.push({ i, n }); }
  return r;
}
const liveSnd = (c) => (S.mode === 'idle' || S.mode === 'ended' ? [] : soundingAt(c, S.t));
function clashPairs(snd) {
  let a = 0, b = 0;
  for (let i = 0; i < snd.length; i++) for (let j = i + 1; j < snd.length; j++) { b++; if (rubs(snd[i].n.m, snd[j].n.m)) a++; }
  return { clash: a, pairs: b };
}
const namesOf = (snd) => [...new Set(snd.map((s) => s.n.m))].sort((a, b) => a - b).map(nameOf).filter((x, i, arr) => arr.indexOf(x) === i);

// the question on screen now, with its computed right answer (null: none)
function curQ() {
  if (S.sec) return null;
  const v = lab.view, t = T[lang];
  if (v === 'voices' && S.n === 1 && S.askV && S.ans.voices === null) {
    return { key: 'voices', text: t.voicesQ, opts: t.voicesOpts, ok: stats(JAC, 8, 2, 1).share < WORKS_BELOW ? 1 : 0, col: true };
  }
  if (v === 'freeze') {
    if (S.ask === 'freeze') {
      const c = { tune: JAC, k: 4, d: 8, passes: 2 }, kinds = new Set(soundingAt(c, FREEZE_AT).map((s) => s.n.m % 12)).size;
      return { key: 'freeze', text: t.freezeQ, opts: ['1', '2', '3', '4'], ok: kinds - 1 };
    }
    if (S.ans.freeze !== null && S.tune === 'scale' && S.delay === 'beat1' && S.ans.scale === null) {
      return { key: 'scale', text: t.scaleQ, opts: [t.yes, t.no], ok: stats(SCALE, 1, 4, 1).share < WORKS_BELOW ? 0 : 1 };
    }
  }
  if (v === 'delay' && S.ans.delay === null) {
    return { key: 'delay', text: t.delayQ, opts: t.delayOpts, ok: stats(JAC, 1, 2, 1).total <= stats(JAC, 8, 2, 1).total ? 0 : 1 };
  }

}

// --- transport -----------------------------------------------------------------------------------------------
function stopTransport() { stopAudio(); S.mode = 'idle'; S.t = 0; S.t0 = 0; S.last = [-1, -1, -1, -1]; S.ask = null; }
function startPlay() { stopTransport(); wantSound(); S.mode = 'play'; }
function holdChord(c) { for (const { i, n } of soundingAt(c, S.t)) sing(n.m, i, 2.4, c.tune.bpm); }
function trigger(c) {
  for (let i = 0; i < c.k; i++) {
    const n = voiceNote(c.tune, i * c.d, S.t, c.passes), key = n ? n.k * 100 + n.i : -1;
    if (key === S.last[i]) continue;
    S.last[i] = key;
    if (!n) continue;
    sing(n.m, i, n.e - n.s, c.tune.bpm); S.pulse[i] = 1;
    S.parts.push({ i, x: S.birdX + 18, y: S.birdY[i] - 12, vx: 10 + Math.random() * 10, vy: -26 - Math.random() * 12, life: 1 });
  }
}
function update(dt) {
  const c = cfg();
  S.dv += (S.d - S.dv) * Math.min(1, dt * 12); if (Math.abs(S.d - S.dv) < 0.003) S.dv = S.d;
  if (S.mode === 'play') {
    let nt = S.t + dt * c.tune.bpm / 60, hitFreeze = false, ended = false;
    if (lab.view === 'freeze' && !S.sec && S.ans.freeze === null && nt >= FREEZE_AT) { nt = FREEZE_AT; hitFreeze = true; }
    else if (nt >= endBeat(c)) { nt = endBeat(c); ended = true; }
    S.t = nt; trigger(c);
    if (hitFreeze) { S.mode = 'frozen'; S.ask = 'freeze'; stopAudio(); holdChord(c); renderBody(); readout(true); showStage(); }
    else if (ended) { S.mode = 'ended'; renderBody(); readout(true); }
  }
  const tgt = c.scroll && S.mode !== 'idle' ? Math.max(0, S.t - WIN * 0.6) : 0;
  S.t0 += (tgt - S.t0) * Math.min(1, dt * 7);
  const snd = liveSnd(c);
  for (let i = 0; i < 4; i++) {
    const on = snd.some((s) => s.i === i);
    S.beak[i] += ((on ? 1 : 0) - S.beak[i]) * Math.min(1, dt * 16);
    S.pulse[i] = Math.max(0, S.pulse[i] - dt * 4);
  }
  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 0.9; }
  S.parts = S.parts.filter((p) => p.life > 0);
  liveUI(c, snd, dt);
  readout(false, c, snd);
}

// --- readout, chips and meter (DOM text, so it can be read without hearing) ---------------------------------------
function readout(force, c = cfg(), snd = liveSnd(c)) {
  const t = T[lang], v = S.sec ? 'sec' : lab.view, q = curQ();
  let val = '', sub = '', pill = '', col = '#f0c04a';
  if (v === 'sec') {
    if (S.sec === 'oldest') { val = '≈ 1250'; col = '#d9a95a'; }
    else { val = '4'; sub = t.voicesWord; col = '#8f7fd0'; pill = t.bar(S.mode === 'idle' ? 1 : Math.floor(S.t / 4) % (c.tune.len / 4) + 1); }
  } else if (v === 'voices') {
    val = String(S.n); sub = t.voicesWord; col = '#f0c04a';
    pill = t.bar(S.mode === 'idle' || S.mode === 'ended' ? 1 : Math.floor(S.t / 4) % (c.tune.len / 4) + 1);
  } else if (v === 'freeze') {
    col = '#4f8fe5';
    if (q) val = '?';
    else { val = snd.length ? namesOf(snd).join(' · ') : '–'; sub = t.soundingNow; pill = t.clashes(clashPairs(snd).clash); }
  } else {
    col = '#e5594f'; val = t.delayN(S.d); sub = t.beats;
    if (!q) pill = t.clashes(stats(JAC, S.d, 2, 1).total);
  }
  const key = [val, sub, pill, lang, col].join('|');

  S.rdKey = key; lab.setReadout(val, sub, pill, col);
}
function liveUI(c, snd, dt) {
  const show = lab.view === 'freeze' && !S.sec && !curQ();
  const box = $('rdMeterBox');
  if (box.hidden === show) box.hidden = !show;
  if (!show) return;
  const { clash, pairs } = clashPairs(snd);
  S.meter += ((pairs ? clash / pairs : 0) - S.meter) * Math.min(1, dt * 6);
  const m = $('rdMeter');
  m.style.width = `${6 + 94 * clamp(S.meter * 2, 0, 1)}%`;
  m.style.background = `hsl(${Math.round(140 * (1 - clamp(S.meter * 2, 0, 1)))} 75% 52%)`;
  const html = snd.map((s) => `<span class="rd-nchip" style="border-color:${COLS[s.i]}">${esc(nameOf(s.n.m))}</span>`).join('');
  if (html !== S.nowKey) { S.nowKey = html; $('rdNow').innerHTML = html; }
}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {

};
function changeView() { stopTransport(); S.sec = null; S.fb = null; S.ask = null; S.askV = S.ans.voices !== null ? S.askV : false; render(); }
function answer(i) {
  const q = curQ(); if (!q) return;
  const t = T[lang], ok = i === q.ok;
  S.ans[q.key] = i; (ok ? sfx.good : sfx.bad)();
  if (q.key === 'voices') { S.fb = { ok, text: t.exVoices }; S.n = 2; startPlay(); }
  else if (q.key === 'freeze') {

  } else if (q.key === 'scale') { S.fb = { ok, text: t.exScale }; startPlay(); }

    S.d = q.ok === 0 ? 1 : 8; S.tried.add(1); S.tried.add(8);

$('ctrlBody').addEventListener('click', (ev) => {

// --- drawing -------------------------------------------------------------------------------------------------
function drawSky(c, w, h, time) {
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#3a4a82'); g.addColorStop(0.55, '#26305c'); g.addColorStop(1, '#1b2244');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const sx = Math.max(40, w * 0.1), sy = 38, sg = c.createRadialGradient(sx, sy, 4, sx, sy, 130);
  sg.addColorStop(0, 'rgba(255,214,120,.55)'); sg.addColorStop(1, 'rgba(255,214,120,0)');
  c.fillStyle = sg; c.fillRect(0, 0, w, h);
  c.save(); c.shadowColor = 'rgba(255,200,90,.8)'; c.shadowBlur = 18;
  const dg = c.createRadialGradient(sx - 4, sy - 4, 1, sx, sy, 16); dg.addColorStop(0, '#fff6c8'); dg.addColorStop(1, '#ffc547');
  c.fillStyle = dg; circ(c, sx, sy, 15); c.fill(); c.restore();
  c.fillStyle = 'rgba(255,255,255,.06)';
  for (const [cx, cy, k] of [[0.5, 30, 1], [0.82, 52, 0.8]]) {
    const x = ((cx * w + time * 4 * k) % (w + 120)) - 60;
    c.beginPath(); c.ellipse(x, cy, 34 * k, 10 * k, 0, 0, Math.PI * 2); c.ellipse(x + 20 * k, cy - 6 * k, 22 * k, 9 * k, 0, 0, Math.PI * 2); c.ellipse(x - 18 * k, cy - 3 * k, 18 * k, 8 * k, 0, 0, Math.PI * 2); c.fill();
  }
}
function drawBird(c, x, y, r, col, open, ghost, bob) {
  c.save();
  if (ghost) c.globalAlpha = 0.28;
  c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(x + 1, y + r * 1.08, r * 0.85, r * 0.2, 0, 0, Math.PI * 2); c.fill();
  y -= bob;
  const dark = tint(col, -0.55), mid = tint(col, -0.22);
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.fillStyle = mid; c.strokeStyle = dark; c.lineWidth = 1.5; // tail
  c.beginPath(); c.moveTo(x - r * 0.7, y + r * 0.05); c.quadraticCurveTo(x - r * 1.5, y - r * 0.5, x - r * 1.65, y - r * 0.15); c.quadraticCurveTo(x - r * 1.5, y + r * 0.35, x - r * 0.7, y + r * 0.4); c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = mid; c.lineWidth = 2.4; // crest
  for (const k of [-1, 0, 1]) { c.beginPath(); c.moveTo(x + k * r * 0.12, y - r * 0.9); c.quadraticCurveTo(x + k * r * 0.2 - r * 0.15, y - r * 1.25, x + k * r * 0.34 - r * 0.2, y - r * 1.4); c.stroke(); }
  const bg = c.createRadialGradient(x - r * 0.4, y - r * 0.45, r * 0.1, x, y, r * 1.2); // body
  bg.addColorStop(0, tint(col, 0.5)); bg.addColorStop(0.5, col); bg.addColorStop(1, tint(col, -0.35));
  c.fillStyle = bg; c.strokeStyle = dark; c.lineWidth = 1.6; circ(c, x, y, r); c.fill(); c.stroke();
  c.save(); circ(c, x, y, r - 0.5); c.clip(); // belly
  c.fillStyle = 'rgba(255,244,220,.92)'; c.beginPath(); c.ellipse(x + r * 0.15, y + r * 0.55, r * 0.7, r * 0.55, 0, 0, Math.PI * 2); c.fill(); c.restore();
  c.fillStyle = mid; c.strokeStyle = dark; c.lineWidth = 1.2; // wing
  c.beginPath(); c.ellipse(x - r * 0.28, y + r * 0.12, r * 0.55, r * 0.36, -0.5, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,120,120,.4)'; circ(c, x + r * 0.28, y + r * 0.1, r * 0.14); c.fill();
  c.fillStyle = '#fff'; c.strokeStyle = dark; c.lineWidth = 1; circ(c, x + r * 0.4, y - r * 0.24, r * 0.27); c.fill(); c.stroke(); // eye
  c.fillStyle = '#1b1f33'; circ(c, x + r * 0.46, y - r * 0.22, r * 0.14); c.fill();
  c.fillStyle = '#fff'; circ(c, x + r * 0.5, y - r * 0.27, r * 0.05); c.fill();
  const o = clamp(open, 0, 1), bx = x + r * 0.8; // beak: opens on every note
  c.lineWidth = 1.2; c.strokeStyle = '#8a4a16';
  if (o > 0.08) { c.fillStyle = '#7a1f2b'; c.beginPath(); c.moveTo(bx, y - r * 0.02); c.lineTo(bx + r * 0.55, y - r * 0.02 - o * r * 0.16); c.lineTo(bx + r * 0.5, y + r * 0.08 + o * r * 0.28); c.lineTo(bx, y + r * 0.14); c.closePath(); c.fill(); }
  const bgr = c.createLinearGradient(0, y - r * 0.3, 0, y + r * 0.3); bgr.addColorStop(0, '#ffc15a'); bgr.addColorStop(1, '#e8832a');
  c.fillStyle = bgr;
  c.beginPath(); c.moveTo(bx, y + r * 0.06); c.lineTo(bx + r * 0.62, y + r * 0.1 + o * r * 0.3); c.lineTo(bx, y + r * 0.3); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(bx, y - r * 0.3); c.lineTo(bx + r * 0.75, y - r * 0.04 - o * r * 0.18); c.lineTo(bx, y + r * 0.04); c.closePath(); c.fill(); c.stroke();

}
function drawParchment(c, w, h) {
  const bg = c.createLinearGradient(0, 0, w, h); bg.addColorStop(0, '#2b2f55'); bg.addColorStop(1, '#171b36'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const px = 14, py = 14, pw = w - 28, ph = h - 28;
  c.save(); c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 20; c.shadowOffsetY = 6;
  const g = c.createLinearGradient(px, py, px + pw, py + ph); g.addColorStop(0, '#f3e4b8'); g.addColorStop(0.5, '#e2c88f'); g.addColorStop(1, '#cfae72');
  c.fillStyle = g; rr(c, px, py, pw, ph, 12); c.fill(); c.restore();
  const v = c.createRadialGradient(w / 2, h / 2, Math.min(pw, ph) * 0.3, w / 2, h / 2, Math.max(pw, ph) * 0.7);
  v.addColorStop(0, 'rgba(120,80,30,0)'); v.addColorStop(1, 'rgba(120,80,30,.4)'); c.fillStyle = v; rr(c, px, py, pw, ph, 12); c.fill();
  c.strokeStyle = '#8a6a3b'; c.lineWidth = 2; rr(c, px, py, pw, ph, 12); c.stroke();
  c.fillStyle = '#5a3a1e'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = `italic 500 ${clamp(w * 0.06, 17, 28)}px 'EB Garamond', Georgia, serif`; c.fillText('Sumer is icumen in', w / 2, py + 34);
  const sysH = (ph - 80) / 3, left = px + 18, right = px + pw - 18, step = 15;
  for (let s = 0; s < 3; s++) {
    const y0 = py + 62 + s * sysH, gap = Math.min(8, sysH / 6);
    c.strokeStyle = 'rgba(162,65,47,.85)'; c.lineWidth = 1.3;
    for (let l = 0; l < 4; l++) { c.beginPath(); c.moveTo(left, y0 + l * gap); c.lineTo(right, y0 + l * gap); c.stroke(); }
    c.fillStyle = '#2f2113';
    for (let x = left + 10, k = s * 7; x < right - 8; x += step, k++) {
      const li = Math.round(1.5 + 1.5 * Math.sin(k * 0.9 + s)), ny = y0 + li * gap;
      c.fillRect(x - 3.5, ny - 3.2, 7, 6.4);

}
const pill = (c, text, x, y, color = '#fff') => {
  c.font = `800 12px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const w = c.measureText(text).width + 14;
  c.fillStyle = 'rgba(14,17,30,.82)'; rr(c, x - w / 2, y - 10, w, 20, 10); c.fill();
  c.fillStyle = color; c.fillText(text, x, y + 0.5);
};

canvasLoop($('cv'), (c, w, h, dt, time) => {
  update(dt);
  c.save(); rr(c, 0, 0, w, h, 20); c.clip();
  if (S.sec === 'oldest') { drawParchment(c, w, h); c.restore(); return; }
  drawSky(c, w, h, time);
  const cf = cfg(), v = S.sec ? 'sec' : lab.view, q = curQ();
  const nS = v === 'delay' ? 2 : 4, delayV = v === 'delay';
  const padL = 8, top = 12, bot = h - 26, avail = bot - top - (delayV ? 20 : 0);
  const laneH = Math.min(86, avail / nS), lanesH = laneH * nS, y0 = top + (avail - lanesH) / 2;
  const r = clamp(laneH * 0.24, 9, 16), x0 = padL + r * 2.9 + 4, x1 = w - 10;
  const win = cf.scroll ? WIN : cf.tune.len + S.dv, ppb = (x1 - x0) / win, dd = delayV ? S.dv : cf.d;
  const nh = Math.min(10, (laneH - 12) / 6), usable = laneH - 12 - nh;
  const noteY = (m, lt) => lt + 6 + usable * (1 - clamp((m - PITCH_LO) / (PITCH_HI - PITCH_LO), 0, 1));
  const active = S.mode === 'frozen' || S.mode === 'play';
  const snd = liveSnd(cf), hidePatch = v === 'freeze' && S.ask === 'freeze';
  const hideClash = hidePatch || q !== null;
  S.birdX = padL + r + 3;

  // lanes
  for (let i = 0; i < nS; i++) {
    const lt = y0 + i * laneH, on = i < cf.k, col = COLS[i];
    c.fillStyle = on ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.025)'; rr(c, padL, lt + 2, w - padL * 2, laneH - 4, 12); c.fill();
    if (on) { c.fillStyle = col; c.globalAlpha = 0.09; rr(c, padL, lt + 2, w - padL * 2, laneH - 4, 12); c.fill(); c.globalAlpha = 1; }
    c.strokeStyle = on ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.08)'; c.lineWidth = 1;
    if (!on) c.setLineDash([4, 4]);
    rr(c, padL, lt + 2, w - padL * 2, laneH - 4, 12); c.stroke(); c.setLineDash([]);
    S.birdY[i] = lt + laneH / 2;
    if (!on) { drawBird(c, S.birdX, lt + laneH / 2, r, '#9aa4cc', 0, true, 0); continue; }
    c.strokeStyle = 'rgba(255,255,255,.07)';
    for (let l = 1; l <= 3; l++) { const yy = lt + 2 + (laneH - 4) * l / 4; c.beginPath(); c.moveTo(x0, yy); c.lineTo(x1, yy); c.stroke(); }
  }
  // bars of the first voice
  c.font = `700 12px ${FONT}`; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  for (let b = Math.floor(S.t0 / 4); b * 4 < S.t0 + win; b++) {
    const bx = x0 + (b * 4 - S.t0) * ppb;
    if (bx < x0 - 1 || bx > x1) continue;
    c.strokeStyle = 'rgba(255,255,255,.1)'; c.beginPath(); c.moveTo(bx, y0 + 2); c.lineTo(bx, y0 + lanesH - 2); c.stroke();
    c.fillStyle = 'rgba(215,225,255,.68)'; c.fillText(String(b % (cf.tune.len / 4) + 1), bx + 3, h - 8);
  }
  // notes: the same blocks, shifted right for every later voice
  for (let i = 0; i < cf.k; i++) {
    const lt = y0 + i * laneH, col = COLS[i], st = i * dd;
    c.save(); c.beginPath(); c.rect(x0 - 1, lt, x1 - x0 + 2, laneH); c.clip();
    for (let k = 0; k < cf.passes; k++) {
      const base = st + k * cf.tune.len;
      if (base >= S.t0 + win || base + cf.tune.len <= S.t0) continue;
      for (const n of cf.tune.a) {
        const x = x0 + (base + n.s - S.t0) * ppb, wd = (n.e - n.s) * ppb - 1.6;
        if (x + wd < x0 || x > x1) continue;
        const y = noteY(n.m, lt), now = active && S.t >= base + n.s && S.t < base + n.e, past = active && S.t >= base + n.e;
        c.save(); c.globalAlpha = past ? 0.45 : 1;
        if (now && !hidePatch) { c.shadowColor = col; c.shadowBlur = 14; }
        c.fillStyle = col; c.strokeStyle = tint(col, -0.55); c.lineWidth = 1.2;
        rr(c, x, y - (now ? 1 : 0), wd, nh + (now ? 2 : 0), nh * 0.45); c.fill(); c.shadowBlur = 0; c.stroke();
        c.fillStyle = 'rgba(255,255,255,.38)'; rr(c, x + 1.5, y + 1.2, wd - 3, nh * 0.34, 2); c.fill();
        c.restore();
      }
    }
    c.restore();
  }
  // birds
  for (let i = 0; i < cf.k; i++) {
    const open = S.beak[i] * (0.65 + 0.35 * S.pulse[i]), bob = ease(S.pulse[i]) * 3;
    drawBird(c, S.birdX, S.birdY[i], r, COLS[i], open, false, bob);
  }
  // playhead
  const px = clamp(x0 + (S.t - S.t0) * ppb, x0, x1);
  c.save(); c.globalAlpha = active ? 1 : 0.45;
  c.shadowColor = 'rgba(255,230,150,.9)'; c.shadowBlur = 10;
  const pg = c.createLinearGradient(0, y0, 0, y0 + lanesH); pg.addColorStop(0, '#fff'); pg.addColorStop(1, '#ffd36a');
  c.strokeStyle = pg; c.lineWidth = 2.5; c.beginPath(); c.moveTo(px, y0 - 2); c.lineTo(px, y0 + lanesH + 2); c.stroke(); c.restore();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(px - 5, y0 - 5); c.lineTo(px + 5, y0 - 5); c.lineTo(px, y0 + 2); c.closePath(); c.fill();
  // what sounds at the playhead: a red zigzag where two notes rub, a gold glow where they agree
  if (active && !hideClash) {
    for (let k = 0; k + 1 < snd.length; k++) {
      const a = snd[k], b = snd[k + 1], ya = noteY(a.n.m, y0 + a.i * laneH) + nh / 2, yb = noteY(b.n.m, y0 + b.i * laneH) + nh / 2;
      if (rubs(a.n.m, b.n.m)) {
        c.save(); c.strokeStyle = '#ff4d4d'; c.lineWidth = 3; c.lineJoin = 'round'; c.lineCap = 'round'; c.shadowColor = '#ff2d2d'; c.shadowBlur = 10;
        c.beginPath(); c.moveTo(px, ya);
        const len = yb - ya, steps = Math.max(2, Math.round(Math.abs(len) / 7));
        for (let s = 1; s < steps; s++) c.lineTo(px + (s % 2 ? 5 : -5), ya + len * s / steps);
        c.lineTo(px, yb); c.stroke(); c.restore();
      } else {
        c.save(); c.strokeStyle = 'rgba(255,214,102,.55)'; c.lineWidth = 6; c.lineCap = 'round'; c.shadowColor = 'rgba(255,214,102,.9)'; c.shadowBlur = 14;
        c.beginPath(); c.moveTo(px, ya); c.lineTo(px, yb); c.stroke();

      }

  if (hidePatch) {
    for (const s of snd) {

      c.fillStyle = '#1d2346'; c.strokeStyle = COLS[s.i]; c.lineWidth = 2; rr(c, cx - pw / 2, lt + 3, pw, laneH - 6, 8); c.fill(); c.stroke();
      c.fillStyle = '#fff'; c.font = `900 14px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', cx, lt + laneH / 2 + 1);
    }
  }
  // note names at the frozen moment
  if (v === 'freeze' && S.mode === 'frozen' && !hidePatch && !q) {
    for (const s of snd) pill(c, nameOf(s.n.m), clamp(px + 22, x0 + 18, x1 - 18), noteY(s.n.m, y0 + s.i * laneH) + nh / 2);
  }
  // delay view: one strip with every half-beat of the pass: red where the two voices clash, green where they agree
  if (delayV && S.ans.delay !== null) {
    const sy = y0 + lanesH + 5, end = S.d + cf.tune.len;
    c.fillStyle = 'rgba(255,255,255,.05)'; rr(c, x0, sy, x1 - x0, 12, 6); c.fill();
    for (let t = 0; t < end; t += 0.5) {
      const a = voiceNote(JAC, 0, t, 1), b = voiceNote(JAC, S.d, t, 1);
      if (!a || !b) continue;
      const x = x0 + t * (x1 - x0) / end, cw = 0.5 * (x1 - x0) / end;
      c.fillStyle = rubs(a.m, b.m) ? '#ff4d4d' : 'rgba(61,220,151,.7)'; c.fillRect(x, sy + 1, Math.max(1, cw - 0.4), 10);
    }
  }
  // little notes floating up from the singers
  c.font = `800 16px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const p of S.parts) { c.globalAlpha = clamp(p.life, 0, 1); c.fillStyle = COLS[p.i]; c.fillText('♪', p.x, p.y); }
  c.globalAlpha = 1;
  c.restore();
});
render();
</script>
