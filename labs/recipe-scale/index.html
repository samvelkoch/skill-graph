// --- dragging the milk -------------------------------------------------------------------------------------------

  } else if (act === 'm-go') { M.phase = 'play'; M.fryAt = -1; sfx.click(); }

  else if (act === 'm-fry') { M.fryAt = now(); M.cmp = false; sfx.click(); showStage(); setTimeout(render, FRY_DUR * 1000 + 60); }
  else if (act === 'm-cmp') { if (!secret.unlocked()) return secret.open(); M.cmp = !M.cmp; sfx.click(); }

function runningNow() { return O.runAt >= 0 && O.sim && !runDone(); }

// --- one render per change ------------------------------------------------------------------------------------------
function render() {
  const v = lab.view, t = T[lang];
  $('rcM').hidden = v !== 'measure'; $('rcO').hidden = v !== 'order'; $('rcS').hidden = v !== 'scale';
  $('cv').style.touchAction = canDrag() ? 'none' : 'pan-y';
  if (v === 'measure') renderMeasure(t); else if (v === 'order') renderOrder(t); else renderScale(t);
}

function renderMeasure(t) {
  const ph = M.phase, mt = t.m, v = verdictOf(), done = fryDone(), open = secret.unlocked();
  lab.setGlow('rgba(224, 170, 90, .26)');
  let ctrl = '';
  if (ph === 'predict') {
    ctrl = `<div class="rc-q"><div class="q">${esc(mt.q)}</div><div class="rc-opts">${mt.opts.map((o, i) => `<button data-act="m-guess" data-g="${mt.ids[i]}">${esc(o)}</button>`).join('')}</div></div>`;
    lab.setReadout('?', mt.yours, '', '#e0aa5a');
    lab.setState({ emo: '🥣', title: mt.predTitle, lead: mt.q, body: mt.setup, extra: '' });
  } else {
    const tog = (key, on, lblKey) => `<div class="rc-tog"><span class="lbl">${esc(mt[lblKey])}</span>
      <button class="chip ${!on ? 'on' : ''}" data-act="m-${key}" data-v="l">${esc(mt.level)}</button><button class="chip ${on ? 'on' : ''}" data-act="m-${key}" data-v="h">${esc(mt.heaped)}</button></div>`;
    if (ph === 'reveal') {
      ctrl = done ? `<div class="rc-main"><button class="btn" data-act="m-go">${esc(mt.go)}</button></div>` : '';
    } else {
      ctrl = `${tog('flour', M.flourH, 'flour')}
        <div class="rc-tog"><span class="lbl">${esc(mt.milk)}</span><button class="rc-sb" data-act="m-milk" data-d="-1" aria-label="−"${M.milk <= 0 ? ' disabled' : ''}>−</button>
          <button class="rc-sb" data-act="m-milk" data-d="1" aria-label="+"${M.milk >= 1.2 ? ' disabled' : ''}>+</button></div>
        ${tog('sugar', M.sugarH, 'sugar')}
        <div class="rc-main"><button class="btn" data-act="m-fry">${esc(mt.fry)}</button>
          <button class="chip secret ${open ? 'open' : ''} ${M.cmp ? 'on' : ''}" data-act="m-cmp">${open ? `⚖️ ${esc(t.secrets.cmp[0])}` : '🔒 ???'}</button></div>
        <div class="rc-hint">${esc(mt.drag)}</div>`;
    }
    const val = `${dec(flourMult())} : ${dec(M.milk)}`;
    lab.setReadout(val, mt.ratio, done ? mt.v[v][0] : '', '#e0aa5a');
    if (M.cmp && ph === 'play') lab.setState({ emo: '⚖️', title: mt.cmpT, lead: mt.cmpL, body: '', extra: '' });
    else if (ph === 'reveal') {
      if (!done) lab.setState({ emo: '🔥', title: mt.frying, lead: '', body: '', extra: '' });
      else { const ok = M.guess === 'thick'; lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : mt.notq, lead: mt.v[v][0], body: mt.v[v][1], extra: '' }); }
    } else if (!done) lab.setState({ emo: '🥄', title: mt.fixTitle, lead: mt.fixLead, body: '', extra: '' });
    else lab.setState({ emo: v === 'good' ? '✅' : '🤔', title: mt.v[v][0], lead: mt.v[v][1], body: v === 'good' ? mt.next : '', extra: '' });
  }
  $('rcM').innerHTML = ctrl;
  lab.setFacts(t.facts.measure);
}

function renderOrder(t) {
  const ot = t.o, running = runningNow(), fin = O.runAt >= 0 && O.sim && runDone();
  lab.setGlow('rgba(95, 168, 160, .26)');
  const cur = running ? sceneFrame().cap : -1;
  $('rcO').innerHTML = `${O.order.map((st, i) => `<div class="rc-row ${st === cur ? 'cur' : ''}"><span class="n">${i + 1}</span><span class="e">${STEP_EMO[st]}</span><span class="tx">${esc(ot.steps[st])}</span>
      <button class="rc-ar" data-act="o-mv" data-i="${i}" data-d="-1" aria-label="up"${i === 0 || running ? ' disabled' : ''}>▲</button>
      <button class="rc-ar" data-act="o-mv" data-i="${i}" data-d="1" aria-label="down"${i === 6 || running ? ' disabled' : ''}>▼</button></div>`).join('')}
    <div class="rc-main"><button class="btn" data-act="o-cook"${running ? ' disabled' : ''}>${esc(ot.cook)}</button><button class="chip" data-act="o-reset"${running ? ' disabled' : ''}>${esc(ot.reset)}</button></div>
    <div class="rc-hint">${esc(ot.hint)}</div>`;
  lab.setReadout(fin ? (O.sim.fail === 'ok' ? '7/7' : `${O.sim.at + 1}/7`) : '?', '', '', '#5fa8a0');
  if (O.runAt < 0) lab.setState({ emo: '📋', title: ot.title0, lead: ot.lead0, body: '', extra: '' });
  else if (!fin) lab.setState({ emo: '🍳', title: ot.running, lead: '', body: '', extra: '' });
  else { const r = ot.res[O.sim.fail]; lab.setState({ emo: O.sim.fail === 'ok' ? '✅' : '🤔', title: r[0], lead: r[1], body: O.sim.fail === 'ok' ? '' : ot.at(O.sim.at + 1), extra: '' }); }
  lab.setFacts(t.facts.order);
}

function renderScale(t) {
  const st = t.s, a = amounts(), k = G.k, open = secret.unlocked(), pred = G.guess === null;
  lab.setGlow('rgba(217, 130, 95, .24)');
  const n = Math.max(1, Math.round(4 * k));
  let ctrl;
  if (pred) {
    ctrl = `<div class="rc-q"><div class="q">${esc(st.q)}</div><div class="rc-opts">${st.opts.map((o, i) => `<button data-act="s-guess" data-g="${i}">${esc(o)}</button>`).join('')}</div></div>`;
    lab.setReadout(4, st.pc(4).replace(/^\d+\s*/, ''), '', '#d9825f');
    lab.setState({ emo: '🍽️', title: st.predTitle, lead: st.q, body: st.base, extra: '' });
  } else {
    const ks = [1, 2, 3, 4];
    ctrl = `<div class="rc-tog"><span class="lbl">${esc(st.times)}</span>${ks.map((x) => `<button class="chip ${G.k === x ? 'on' : ''}" data-act="s-k" data-k="${x}">×${x}</button>`).join('')}
        <button class="chip secret ${open ? 'open' : ''} ${G.smallOn ? 'on' : ''}" data-act="s-small">${open ? `🥚 ${esc(t.secrets.small[0])}` : '🔒 ???'}</button></div>
      ${k >= 1 ? `<div class="rc-tog">${['mul', 'flour', 'add'].map((m) => `<button class="chip ${G.mode === m ? 'on' : ''}" data-act="s-mode" data-m="${m}">${esc(st.modes[m])}</button>`).join('')}</div>` : ''}
      <div class="rc-tab"><div class="h">${esc(st.tab.ing)}</div><div class="h">${esc(st.tab.rec)}</div><div class="h">${esc(st.tab.now)}</div>
      ${ING.map(([key, unit]) => {
        const nowV = a[key], want = BASE[key] * k, off = Math.abs(nowV - want) > 1e-9 && k >= 1;
        return `<div class="nm">${esc(st.ing[key])}</div><div class="rec">${esc(amt(key, unit, BASE[key]))}</div><div class="now ${off ? 'off' : ''}">${esc(amt(key, unit, nowV))}${key === 'flour' ? ` · ${Math.round(nowV * FLOUR_G)} ${esc(st.grams)}` : key === 'milk' ? ` · ${Math.round(nowV * CUP_ML)} ${UN[lang].ml}` : ''}</div>`;
      }).join('')}</div>`;
    const flourGrams = `${Math.round(a.flour * FLOUR_G)} ${st.grams}`;
    lab.setReadout(n, st.pc(n).replace(/^\d+\s*/, ''), `${flourGrams}`, '#d9825f');
    const guessMsg = G.guess === 1 ? `${t.right} ${st.rightMsg}` : st.wrongMsg;
    let s;
    if (k < 1) s = k === 0.5 ? { emo: '🥚', title: st.smallT, lead: st.smallL(n) } : { emo: '🥚', title: st.small2T, lead: st.small2L };
    else if (k === 1) s = { emo: '🥞', title: st.baseT, lead: st.baseL };
    else if (G.mode === 'mul') s = { emo: '✅', title: st.mulT, lead: st.mulL(k, n) };
    else if (G.mode === 'flour') s = { emo: '🌾', title: st.floT, lead: st.floL };
    else s = { emo: '🥚', title: st.addT, lead: st.addL(a.eggs, 2 * k) };
    lab.setState({ ...s, body: guessMsg, extra: '' });
  }
  $('rcS').innerHTML = ctrl;
  lab.setFacts(t.facts.scale);
}
render();
</script>
</body>
</html>
