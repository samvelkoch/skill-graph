function revealStep() {
  const A = S.a, st = STEPS[A.i], e = Object.fromEntries(st.ch.map(([k, d]) => [k, Math.sign(d)]));
  const pk = Object.keys(A.pick);
  A.ok = pk.length === st.ch.length && pk.every((k) => A.pick[k] === e[k]);
  addCh(A.vals, st.ch); A.phase = 'done'; S.flashT = performance.now() / 1000;
  (A.ok ? sfx.good : sfx.bad)(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const A = S.a, chip = ev.target.closest('[data-k]'), deal = ev.target.closest('[data-deal]'), go = ev.target.closest('[data-act]'), ln = ev.target.closest('[data-ln]'), sc = ev.target.closest('[data-sec]');
  if (chip && A.phase === 'ask' && A.i < STEPS.length) {
    const k = chip.dataset.k, c = A.pick[k];
    if (c === undefined) A.pick[k] = 1; else if (c === 1) A.pick[k] = -1; else delete A.pick[k];
    sfx.tick();
  } else if (go?.dataset.act === 'aGo') {
    if (A.i >= STEPS.length) { S.a = { i: 0, phase: 'ask', pick: {}, vals: zero(), ok: null }; sfx.click(); }
    else if (A.phase === 'ask') { if (!Object.keys(A.pick).length) return; revealStep(); }
    else { A.i++; A.phase = 'ask'; A.pick = {}; A.ok = null; sfx.click(); }
  } else if (go?.dataset.act === 'pGo') {
    const P = S.p;

  } else if (deal && !S.m.fixed) {
    const j = +deal.dataset.deal;
    if (j === wrongOf(S.m.i)) { S.m.fixed = true; S.flashT = performance.now() / 1000; sfx.good(); showStage(); }

});

    c.textAlign = 'left'; c.fillText(bn(a), 50, y); c.textAlign = 'right'; c.fillText(String(av), 160, y);
    c.textAlign = 'left'; c.fillText(bn(b), 182, y); c.textAlign = 'right'; c.fillText(String(bv), 304, y);
    c.setLineDash([1, 3]); c.strokeStyle = 'rgba(74,47,26,.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(50, y + 13); c.lineTo(160, y + 13); c.moveTo(182, y + 13); c.lineTo(304, y + 13); c.stroke(); c.setLineDash([]);
  });
  c.beginPath(); c.strokeStyle = 'rgba(74,47,26,.75)'; c.lineWidth = 1.4; c.moveTo(30, 206); c.lineTo(310, 206); c.stroke();
  c.fillStyle = ink; c.font = `500 15px ${SERIF}`; c.textAlign = 'center';
  wrap(c, tt.pac.note, 264).forEach((ln, i) => c.fillText(ln, 170, 228 + i * 18));
  c.restore();
}

canvasLoop($('cv'), (c, w, h, dt, t) => {
  const s = Math.min(w / W, h / H);
  c.save(); c.translate((w - W * s) / 2, (h - H * s) / 2); c.scale(s, s);
  if (S.sec === 'pac') drawPacioli(c);
  else if (lab.view === 'profit' && !S.sec) drawProfit(c, dt);
  else { drawShop(c, vShop(), S.disp, t); drawSheet(c, dt, t); }
  c.restore();
});
function vShop() { const v = sheetVals(); return { cash: v.cash, tools: v.tools, parts: v.parts, owed: v.owed }; }

// --- one render per change: controls, readout and the state card ------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v;
  $('vA').style.display = v === 'start' && !sec ? '' : 'none';
  $('vP').style.display = v === 'profit' && !sec ? '' : 'none';
  $('vM').style.display = v === 'mistake' && !sec ? '' : 'none';
  $('vL').style.display = sec === 'loan' ? '' : 'none';
  const open = secret.unlocked();
  const scb = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" style="min-height:38px" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = scb('pac', '📜') + scb('loan', '🏦');
  lab.setFacts(t.facts[v].map((f) => ({ ...f })));
  if (sec === 'pac') {
    lab.setGlow('rgba(214,180,110,.24)'); lab.setReadout('500 = 500', t.pac.d + ' = ' + t.pac.c, '', '#d6b46e');
    lab.setState({ emo: '📜', title: t.pac.title, lead: t.pac.lead, body: t.pac.body, extra: '' }); return;
  }
  if (sec === 'loan') { renderLoan(t); return; }
  if (v === 'start') renderStart(t); else if (v === 'profit') renderProfit(t); else renderMistake(t);
}
const eqReadout = (vals, color) => { const a = sumOf(vals, ASSET), s = sumOf(vals, SRC); return [`${a} ${a === s ? '=' : '≠'} ${s}`, color]; };

function renderStart(t) {
  const A = S.a, end = A.i >= STEPS.length, st = STEPS[Math.min(A.i, STEPS.length - 1)], done = A.phase === 'done';
  lab.setGlow('rgba(47,158,114,.26)');
  $('aSay').textContent = end ? '' : `💬 ${t.steps[A.i]}`; $('aSay').style.display = end ? 'none' : '';
  const e = end ? {} : Object.fromEntries(st.ch.map(([k, d]) => [k, Math.sign(d)]));
  const chip = (k) => {
    const d = A.pick[k]; let cls = d === 1 ? 'up' : d === -1 ? 'dn' : '', shown = d;
    if (done && !end) { if (e[k] && d === e[k]) cls = 'ok ' + cls; else if (d && d !== e[k]) cls = 'bad ' + cls; else if (e[k] && !d) { cls = 'miss'; shown = e[k]; } }
    return `<button class="tw-chip ${cls}" style="--c:${COL[k]}" data-k="${k}"${done || end ? ' disabled' : ''}>${EMO[k]} ${esc(bn(k))}${shown ? ` ${arrow(shown)}` : ''}</button>`;
  };
  $('aChips').innerHTML = `<div class="tw-grp"><span class="lbl">${esc(t.hdrA)}</span>${ASSET.map(chip).join('')}</div><div class="tw-grp"><span class="lbl">${esc(t.hdrS)}</span>${SRC.map(chip).join('')}</div>`;
  $('aChips').style.display = end ? 'none' : '';
  $('aGo').textContent = end ? t.again : done ? t.next : t.check;
  $('aGo').disabled = !end && !done && !Object.keys(A.pick).length; $('aGo').style.opacity = $('aGo').disabled ? 0.35 : 1;
  const [val] = eqReadout(A.vals), ruleOn = A.i > 2 || (A.i === 2 && done);
  const rule = ruleOn ? `<div class="tw-rule">📌 ${esc(t.rule)}</div>` : '';
  lab.setReadout(val, t.eq, end ? '' : t.dealOf(parseInt(st.d, 10)), '#3fd09a');
  if (end) lab.setState({ emo: '🏪', title: t.endTitle, lead: t.endLead(sumOf(A.vals, ASSET)), body: '', extra: rule });
  else if (!done) lab.setState({ emo: '💬', title: t.dealOf(st.d), lead: t.steps[A.i], body: t.tap, extra: rule });
  else lab.setState({ emo: A.ok ? '✅' : '🤔', title: A.ok ? t.right : t.notQuite, lead: t.why[A.i], body: t.chg + st.ch.map(([k, d]) => entry(k, d)).join(', '), extra: rule });
}

function renderProfit(t) {
  const P = S.p, tt = t.pr, p = P.price, n = P.revealed ? P.n : 10, inc = n * p, ex = n * PART + RENT, prof = inc - ex;
  lab.setGlow('rgba(201,138,43,.26)');
  const r1 = $('pR1');
  if (P.mode !== P.revealed) { P.mode = P.revealed; r1.value = P.revealed ? P.n : P.guess; }
  $('pR2').value = p; $('pBox2').style.display = P.revealed ? '' : 'none';
  $('pSay').textContent = tt.say(p); $('pQ').textContent = P.revealed ? '' : tt.q; $('pQ').style.display = P.revealed ? 'none' : '';
  $('pL1').textContent = P.revealed ? tt.reps(P.n) : tt.guess(P.guess); $('pL2').textContent = tt.price(p);
  $('pGo').textContent = P.revealed ? tt.again : t.check;
  const first = firstOf(p), be = fmt(beOf(p));
  if (!P.revealed) {
    lab.setReadout('?', '', '', '#e0a84a');
    lab.setState({ emo: '🤔', title: tt.askT, lead: tt.q, body: tt.askB, extra: '' }); return;
  }
  lab.setReadout(`${prof >= 0 ? '' : '−'}${Math.abs(prof)}`, `${tt.inc} ${inc} − ${tt.exp} ${ex}`, prof >= 0 ? tt.profit : tt.loss, prof >= 0 ? '#3fd09a' : '#e4574f');
  if (P.say === 'verdict') lab.setState(P.ok ? { emo: '✅', title: t.right, lead: tt.okLead(be, first), body: prof >= 0 ? tt.bP : tt.bL, extra: '' } : { emo: '🤔', title: t.notQuite, lead: tt.noLead(P.guess, profitAt(P.guess, p), be, first), body: '', extra: '' });
  else lab.setState({ emo: prof >= 0 ? '💰' : '📉', title: prof >= 0 ? tt.tP(prof) : tt.tL(-prof), lead: tt.lead(n, p, inc, ex), body: prof >= 0 ? tt.bP : tt.bL, extra: '' });
}

function renderMistake(t) {
  const M = S.m, tt = t.mk, z = PUZ[M.i], wi = wrongOf(M.i), vals = puzVals(M.i, M.fixed), a = sumOf(vals, ASSET), s = sumOf(vals, SRC);
  lab.setGlow('rgba(204,91,112,.24)');
  $('mSay').textContent = tt.say;
  $('mDeals').innerHTML = z.deals.map((d, j) => {
    const cls = M.fixed && j === wi ? 'good' : M.bad.includes(j) ? 'bad' : '';
    const wrote = d.ch.map(([k, x]) => entry(k, x)).join(', ');
    const fix = M.fixed && j === wi ? `<small class="fix">＋ ${esc(entry(d.miss[0], d.miss[1]))}</small>` : '';
    return `<button class="tw-deal ${cls}" data-deal="${j}"${M.fixed ? ' disabled' : ''}><b>${j + 1}</b><span>${esc(tt.pz[M.i][j])}<small>✍️ ${esc(tt.wrote)}${esc(wrote)}</small>${fix}</span></button>`;
  }).join('');
  $('mGo').hidden = !M.fixed; $('mGo').textContent = tt.next;
  lab.setReadout(`${a} ${a === s ? '=' : '≠'} ${s}`, t.eq, a === s ? '' : tt.gap(Math.abs(a - s)), a === s ? '#3fd09a' : '#e4574f');
  if (M.fixed) { const d = z.deals[wi]; lab.setState({ emo: '✅', title: t.right, lead: tt.okLead(entry(d.miss[0], d.miss[1])), body: tt.okBody, extra: '' }); }
  else if (M.bad.length) lab.setState({ emo: '🤔', title: tt.bad, lead: tt.badLead, body: '', extra: '' });
  else lab.setState({ emo: '⚖️', title: tt.title(M.i + 1), lead: tt.say, body: '', extra: '' });
}

function renderLoan(t) {
  const L = t.ln, inc = S.loanAs === 'income';
  lab.setGlow('rgba(204,91,112,.24)');
  $('lSay').textContent = L.say;
  $('lChips').innerHTML = [['income', L.income], ['debt', L.debt]].map(([k, l]) => `<button class="chip ${S.loanAs === k ? 'on' : ''}" style="min-height:38px" data-ln="${k}">${esc(l)}</button>`).join('');
  const v = loanVals();
  lab.setReadout(`${sumOf(v, ASSET)} = ${sumOf(v, SRC)}`, t.eq, inc ? L.pI : L.pD, inc ? '#e0b84a' : '#3fd09a');
  lab.setState(inc ? { emo: '🏦', title: L.tI, lead: L.lI, body: L.bI, extra: '' } : { emo: '🏦', title: L.tD, lead: L.lD, body: L.bD, extra: '' });
}
render();
</script>
