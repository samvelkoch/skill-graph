const lerpn = (a, b, t) => a + (b - a) * t;
const rnd = (i, k = 0) => { const x = Math.sin(i * 127.1 + k * 311.7 + 7.7) * 43758.5453; return x - Math.floor(x); };
const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const lighten = (h, k) => mix(h, '#ffffff', k);
const shade = (h, k) => mix(h, '#000000', k);
const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };
const lin = (c, x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rad = (c, x, y, r0, r1, stops) => { const g = c.createRadialGradient(x, y, Math.max(0, r0), x, y, Math.max(0.01, r1)); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0.01, w), Math.max(0.01, h), Math.max(0, Math.min(r, w / 2, h / 2))); };
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); };
const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, Math.PI * 2); };
const nowS = () => performance.now() / 1000;
const GROUND_GREY = mix(C.snow, C.ink, 0.42);

// a dark pill with text (wraps into lines), clamped inside the canvas
function pillText(c, text, cx, top, maxW, W, size = 12.5) {
  c.save();
  c.font = `800 ${size}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  let lines = [text];
  if (c.measureText(text).width > maxW - 20) {
    lines = []; let cur = '';
    for (const w of String(text).split(' ')) {
      const t2 = cur ? `${cur} ${w}` : w;
      if (c.measureText(t2).width > maxW - 20 && cur) { lines.push(cur); cur = w; } else cur = t2;
    }
    lines.push(cur);
  }
  const lh = size * 1.25, wmax = Math.max(...lines.map((l) => c.measureText(l).width)), pw = wmax + 22, ph = lines.length * lh + 10;
  const x = Math.min(W - pw / 2 - 4, Math.max(pw / 2 + 4, cx));
  rr(c, x - pw / 2, top, pw, ph, Math.min(14, ph / 2)); c.fillStyle = 'rgba(29,36,51,.84)'; c.fill();
  c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 1; c.stroke();
  c.fillStyle = '#fff'; lines.forEach((l, i) => c.fillText(l, x, top + 5 + lh * (i + 0.5)));
  c.restore();
  return ph;
}
// the green ✓ badge, popping in
function badge(c, x, y, r, u) {
  if (u <= 0) return;
  const k = 1 + 0.25 * Math.sin(c01(u) * Math.PI) * (1 - c01(u)) * 2, R = r * k * sstep(u * 1.5);
  c.save();
  c.fillStyle = rad(c, x - R * 0.3, y - R * 0.3, 1, R * 1.2, [[0, '#7CF0BD'], [1, '#2DBE82']]); circ(c, x, y, R); c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = Math.max(1, R * 0.12); c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = R * 0.24; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(x - R * 0.42, y + R * 0.02); c.lineTo(x - R * 0.1, y + R * 0.34); c.lineTo(x + R * 0.46, y - R * 0.3); c.stroke();
  c.restore();
}
function cloud(c, x, y, sc, col, a) {
  c.save(); c.globalAlpha = a;
  const g = lin(c, 0, y - 20 * sc, 0, y + 14 * sc, [[0, lighten(col, 0.25)], [1, shade(col, 0.12)]]);
  c.fillStyle = g;
  [[0, 0, 20], [-24, 7, 14], [24, 6, 16], [-8, -9, 15], [12, -6, 13]].forEach(([dx, dy, r]) => { circ(c, x + dx * sc, y + dy * sc, r * sc); c.fill(); });
  rr(c, x - 38 * sc, y + 2 * sc, 76 * sc, 15 * sc, 7 * sc); c.fill();
  c.restore();
}

// WEATHER VIEW: two houses, same weather

const WALL = 56, STILT = 34, DUR = 4.4;
const winOf = (cfg) => { const y0 = cfg.stilts ? -STILT : 0, big = !cfg.thick; return { x: 23, y: y0 - 34, w: big ? 30 : 14, h: big ? 24 : 12 }; };
const copes = (cfg, kind) => (kind === 'snow' ? cfg.steep : kind === 'flood' ? cfg.stilts : kind === 'storm' ? cfg.shutters : cfg.thick);
const scoreOf = (cfg) => WKINDS.filter(([k]) => copes(cfg, k)).length;
const heatLevel = (cfg, e) => 0.16 + (cfg.thick ? 0.28 : 0.78) * sstep(e / 3.4);
const heatCol = (l, a = 1) => `hsla(${Math.round(52 - 52 * c01(l))},92%,55%,${a})`;
const T_FLY = 0.8, T_HIT = 1.9, SLIDE_AT = [1.5, 2.1, 2.7];

function wLayout(W, H, two) {
  const gy = H * 0.73;
  const s = two ? Math.min(W * 0.39 / 128, H * 0.5 / 150) : Math.min(W * 0.5 / 128, H * 0.58 / 150);
  return { gy, s, xs: two ? [W * 0.25, W * 0.75] : [W * 0.5], tx: two ? [W * 0.045, W * 0.5] : [W * 0.1] };
}

function drawTree(c, x, y, s, bend, gs) {
  const tx = x + bend * 26 * s, ty = y - 64 * s;
  c.save(); c.lineCap = 'round';
  c.strokeStyle = shade(C.wood, 0.45); c.lineWidth = 8.5 * s; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + bend * 3 * s, y - 34 * s, tx, ty); c.stroke();
  c.strokeStyle = C.wood; c.lineWidth = 6 * s; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + bend * 3 * s, y - 34 * s, tx, ty); c.stroke();
  const gc = mix(shade(C.grass, 0.15), C.snow, 0.7 * gs);
  [[0, 0, 19], [-15, 9, 14], [15, 9, 14], [0, 16, 13]].forEach(([bx, by, br]) => {
    const X = tx + (bx + bend * 6) * s, Y = ty + (by - 4) * s;
    c.fillStyle = rad(c, X - br * 0.35 * s, Y - br * 0.4 * s, 1, br * s, [[0, lighten(gc, 0.3)], [1, shade(gc, 0.22)]]);
    circ(c, X, Y, br * s); c.fill();
  });
  c.restore();
}

function drawWeatherScene(c, W, H, L, kind, e, time) {
  const gy = L.gy, hy = gy - H * 0.07;
  const skS = kind === 'snow' ? sstep(e / 0.8) : 0;
  const skT = kind === 'storm' ? sstep(e / 0.5) * (1 - 0.5 * sstep((e - 3.5) / 0.8)) : 0;
  const skF = kind === 'flood' ? 0.4 * sstep(e / 1.5) : 0;
  const gs = kind === 'snow' ? sstep(e / 3.8) : 0;
  const ht = kind === 'heat' ? sstep(e / 1.4) : 0;
  const stE = kind === 'storm' ? sstep(e / 0.5) * (1 - sstep((e - 3.5) / 0.8)) : 0;
  // sky
  c.fillStyle = lin(c, 0, 0, 0, hy, [[0, shade(C.sky, 0.08)], [1, lighten(C.sky, 0.5)]]); c.fillRect(0, 0, W, hy + 2);
  const tint = (col, a) => { if (a > 0.004) { c.fillStyle = rgba(col, a); c.fillRect(0, 0, W, hy + 2); } };
  tint('#AEB9C6', 0.6 * skS); tint('#444E60', 0.72 * skT); tint('#9DAFB6', skF); tint('#FFD9A0', 0.55 * ht);
  // sun (heat)
  if (ht > 0.01) {
    const R = Math.min(W, H) * 0.13, sx = W * 0.5, sy = lerpn(-R, H * 0.2, ht);
    c.save();
    c.fillStyle = rad(c, sx, sy, R * 0.5, R * 3.4, [[0, `rgba(255,236,150,${0.7 * ht})`], [1, 'rgba(255,200,80,0)']]); c.fillRect(0, 0, W, hy);
    c.translate(sx, sy); c.rotate(time * 0.15);
    for (let i = 0; i < 14; i++) {
      c.rotate(Math.PI * 2 / 14); c.fillStyle = `rgba(255,222,120,${0.75 * ht})`;
      c.beginPath(); c.moveTo(-R * 0.16, -R * 1.18); c.lineTo(R * 0.16, -R * 1.18); c.lineTo(0, -R * (1.75 + 0.12 * Math.sin(time * 3 + i))); c.closePath(); c.fill();
    }
    c.restore();
    c.fillStyle = rad(c, sx - R * 0.25, sy - R * 0.25, R * 0.1, R * 1.05, [[0, '#FFF6C4'], [0.6, '#FFD84F'], [1, '#FFB834']]);
    circ(c, sx, sy, R); c.fill();
  }
  // clouds
  const cl = Math.max(skS, skT, skF);
  if (cl > 0.01) {
    const col = mix('#FFFFFF', '#566174', Math.max(0.3 * skS, 0.75 * skT, 0.45 * skF) / Math.max(0.01, cl));
    for (let i = 0; i < 5; i++) cloud(c, ((W * (0.05 + 0.24 * i) + time * (6 + i * 2)) % (W + 200)) - 90, H * (0.1 + 0.05 * (i % 2)), Math.max(0.5, H / 330), col, Math.min(1, cl * 1.4));
  }
  // hills and ground
  const gcol = (col) => mix(mix(col, C.snow, 0.85 * gs), '#E0B96E', 0.55 * ht);
  [[0.6, 16, 0.012, 1.0], [0.38, 9, 0.02, 2.1]].forEach(([k, amp, fr, ph]) => {
    c.beginPath(); c.moveTo(0, hy + 2);
    for (let x = 0; x <= W + 8; x += 10) c.lineTo(x, hy - amp - amp * 0.8 * Math.sin(x * fr + ph) - amp * 0.4 * Math.sin(x * fr * 2.7));
    c.lineTo(W, hy + 2); c.closePath();
    c.fillStyle = gcol(mix(C.grass, C.sky, k)); c.fill();
  });
  c.fillStyle = lin(c, 0, hy, 0, H, [[0, gcol(lighten(C.grass, 0.25))], [0.35, gcol(C.grass)], [1, gcol(shade(C.grass, 0.3))]]);
  c.fillRect(0, hy, W, H - hy);
  if (gs < 0.8) {
    c.strokeStyle = rgba(shade(C.grass, 0.35), 0.45 * (1 - gs)); c.lineWidth = 1.3; c.lineCap = 'round'; c.beginPath();
    for (let i = 0; i < 46; i++) { const x = W * rnd(i), y = hy + (H - hy) * (0.12 + 0.85 * rnd(i, 1)); c.moveTo(x, y); c.lineTo(x - 2, y - 5); c.moveTo(x, y); c.lineTo(x + 2.5, y - 4); }
    c.stroke();
  }
  // trees
  L.tx.forEach((x, k) => drawTree(c, x, gy - 5, L.s * 0.9, 0.9 * stE + 0.04 * Math.sin(time * 1.3 + k), gs));
}

// ---- one house, in its own local units (100 wide walls; ground at y = 0, up is negative) -------------------------
function drawHouse(c, cfg, cx, gy, s, kind, e, time) {
  const y0 = cfg.stilts ? -STILT : 0, eave = y0 - WALL, win = winOf(cfg), flat = !cfg.steep, sn = kind === 'snow';
  const th = flat && sn ? 26 * sstep(e / 3.4) : 0, sag = th * 0.42;
  const layer = !flat && sn ? 4.5 * sstep(e / 1.5) * (1 - 0.65 * sstep((e - 1.6) / 1.4)) : 0;
  c.save(); c.translate(cx, gy); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  // soft shadow on the grass
  c.save(); c.translate(8, 2); c.scale(1, 0.13); c.fillStyle = rad(c, 0, 0, 0, 80, [[0, 'rgba(15,20,10,.42)'], [1, 'rgba(15,20,10,0)']]); circ(c, 0, 0, 80); c.fill(); c.restore();

  // stilts, deck and steps
  if (cfg.stilts) {
    const post = (x) => { c.fillStyle = lin(c, x - 2.8, 0, x + 2.8, 0, [[0, lighten(C.wood, 0.28)], [1, shade(C.wood, 0.25)]]); c.beginPath(); c.rect(x - 2.8, y0, 5.6, -y0); c.fill(); c.strokeStyle = shade(C.wood, 0.5); c.lineWidth = 0.9; c.stroke(); };
    c.strokeStyle = shade(C.wood, 0.35); c.lineWidth = 2; c.beginPath();
    c.moveTo(-44, y0 + 6); c.lineTo(-16, -6); c.moveTo(-16, y0 + 6); c.lineTo(-44, -6); c.moveTo(16, y0 + 6); c.lineTo(44, -6); c.moveTo(44, y0 + 6); c.lineTo(16, -6); c.stroke();
    [-44, -16, 16, 44].forEach(post);
    c.fillStyle = GROUND_GREY; [-44, -16, 16, 44].forEach((x) => { ell(c, x, 0.5, 6, 2.3); c.fill(); });
    for (let i = 0; i < 5; i++) {
      const x = -64 + i * 6, top = -(i + 1) * STILT / 5;
      c.fillStyle = lin(c, x, top, x + 6, 0, [[0, lighten(C.wood, 0.3)], [1, shade(C.wood, 0.15)]]); c.beginPath(); c.rect(x, top, 6, -top); c.fill();
      c.strokeStyle = shade(C.wood, 0.5); c.lineWidth = 0.8; c.stroke();
    }
    c.fillStyle = lin(c, 0, y0, 0, y0 + 5, [[0, lighten(C.wood, 0.25)], [1, shade(C.wood, 0.2)]]); c.beginPath(); c.rect(-55, y0, 110, 5); c.fill(); c.strokeStyle = shade(C.wood, 0.5); c.lineWidth = 0.9; c.stroke();
  }

  // walls
  c.fillStyle = lin(c, -50, eave, 50, y0, [[0, lighten(C.wall, 0.45)], [0.55, C.wall], [1, shade(C.wall, 0.14)]]);
  c.beginPath(); c.rect(-50, eave, 100, WALL); c.fill();
  c.fillStyle = 'rgba(110,80,40,.14)';
  for (let i = 0; i < 28; i++) { circ(c, -48 + 96 * rnd(i, 3), eave + 4 + (WALL - 8) * rnd(i, 4), 0.55 + 0.4 * rnd(i, 5)); c.fill(); }
  if (cfg.thick) { // corner stones: the wall is deep
    for (let i = 0; i < 7; i++) {
      const yy = eave + i * 8, w = i % 2 ? 9 : 6.5;
      c.fillStyle = lighten(C.wall, 0.3); c.strokeStyle = rgba(shade(C.wall, 0.5), 0.55); c.lineWidth = 0.7;
      c.beginPath(); c.rect(-50, yy, w, 8); c.fill(); c.stroke();
      c.beginPath(); c.rect(50 - w, yy, w, 8); c.fill(); c.stroke();
    }
  }
  c.strokeStyle = shade(C.wall, 0.45); c.lineWidth = 1.2; c.beginPath(); c.rect(-50, eave, 100, WALL); c.stroke();
  c.fillStyle = lin(c, 0, eave, 0, eave + 10, [[0, 'rgba(40,25,10,.34)'], [1, 'rgba(40,25,10,0)']]); c.fillRect(-50, eave, 100, 10);
  if (!cfg.stilts) { c.fillStyle = lin(c, 0, y0 - 5, 0, y0, [[0, lighten(GROUND_GREY, 0.2)], [1, shade(GROUND_GREY, 0.25)]]); c.beginPath(); c.rect(-51, y0 - 5, 102, 5); c.fill(); c.strokeStyle = shade(GROUND_GREY, 0.5); c.lineWidth = 0.8; c.stroke(); }

  // door
  c.fillStyle = lin(c, -32, 0, -8, 0, [[0, lighten(C.wood, 0.32)], [0.5, C.wood], [1, shade(C.wood, 0.28)]]);
  rr(c, -32, y0 - 38, 24, 38, 4); c.fill(); c.strokeStyle = shade(C.wood, 0.55); c.lineWidth = 1.2; c.stroke();
  c.strokeStyle = shade(C.wood, 0.38); c.lineWidth = 0.9;
  c.beginPath(); c.rect(-28, y0 - 33, 7.5, 13); c.rect(-18.5, y0 - 33, 7.5, 13); c.rect(-28, y0 - 17, 7.5, 13); c.rect(-18.5, y0 - 17, 7.5, 13); c.stroke();
  c.fillStyle = '#F3D98B'; circ(c, -11.5, y0 - 19, 1.9); c.fill(); c.strokeStyle = shade(C.wood, 0.6); c.lineWidth = 0.6; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.85)'; circ(c, -12, y0 - 19.6, 0.55); c.fill();

  // window
  {
    const { x, y, w, h } = win, hot = kind === 'heat' ? heatLevel(cfg, e) : 0;
    if (cfg.thick) { c.fillStyle = shade(C.wall, 0.32); rr(c, x - w / 2 - 6, y - h / 2 - 6, w + 12, h + 12, 3); c.fill(); c.fillStyle = lin(c, 0, y - h / 2 - 6, 0, y - h / 2 + 3, [[0, 'rgba(0,0,0,.35)'], [1, 'rgba(0,0,0,0)']]); c.fillRect(x - w / 2 - 6, y - h / 2 - 6, w + 12, 9); }
    c.fillStyle = C.wood; rr(c, x - w / 2 - 2.4, y - h / 2 - 2.4, w + 4.8, h + 4.8, 1.6); c.fill(); c.strokeStyle = shade(C.wood, 0.55); c.lineWidth = 0.9; c.stroke();
    c.fillStyle = lin(c, x - w / 2, y - h / 2, x + w / 2, y + h / 2, [[0, lighten(C.glass, 0.55)], [1, C.glass]]); c.beginPath(); c.rect(x - w / 2, y - h / 2, w, h); c.fill();
    if (hot > 0.25) { c.fillStyle = heatCol(hot, 0.62 * c01((hot - 0.25) / 0.6)); c.fillRect(x - w / 2, y - h / 2, w, h); }
    c.save(); c.beginPath(); c.rect(x - w / 2, y - h / 2, w, h); c.clip();
    c.fillStyle = 'rgba(255,255,255,.5)';
    c.beginPath(); c.moveTo(x - w / 2 + w * 0.12, y + h / 2); c.lineTo(x - w / 2 + w * 0.34, y - h / 2); c.lineTo(x - w / 2 + w * 0.46, y - h / 2); c.lineTo(x - w / 2 + w * 0.24, y + h / 2); c.fill();
    c.beginPath(); c.moveTo(x - w / 2 + w * 0.5, y + h / 2); c.lineTo(x - w / 2 + w * 0.64, y - h / 2); c.lineTo(x - w / 2 + w * 0.7, y - h / 2); c.lineTo(x - w / 2 + w * 0.56, y + h / 2); c.fill();
    c.restore();
    c.strokeStyle = C.wood; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, y - h / 2); c.lineTo(x, y + h / 2); c.moveTo(x - w / 2, y); c.lineTo(x + w / 2, y); c.stroke();
    c.fillStyle = lighten(C.wall, 0.2); c.strokeStyle = shade(C.wall, 0.5); c.lineWidth = 0.8; c.beginPath(); c.rect(x - w / 2 - 4, y + h / 2 + 2.4, w + 8, 2.8); c.fill(); c.stroke();
    if (cfg.shutters) { // two closed wooden leaves
      const lw = (w + 5.6) / 2, top = y - h / 2 - 2.8, hh = h + 5.6;
      [x - w / 2 - 2.8, x].forEach((lx, i) => {
        c.fillStyle = lin(c, lx, 0, lx + lw, 0, [[0, i ? C.wood : lighten(C.wood, 0.22)], [1, i ? shade(C.wood, 0.26) : C.wood]]);
        c.beginPath(); c.rect(lx, top, lw, hh); c.fill(); c.strokeStyle = shade(C.wood, 0.55); c.lineWidth = 0.9; c.stroke();
        c.strokeStyle = shade(C.wood, 0.4); c.lineWidth = 0.7; c.beginPath();
        for (let yy = top + 3.2; yy < top + hh - 1; yy += 3.4) { c.moveTo(lx + 0.8, yy); c.lineTo(lx + lw - 0.8, yy); }
        c.stroke();
      });
      c.fillStyle = '#3B3550'; c.beginPath(); c.rect(x - 1.2, y - 1.6, 2.4, 3.2); c.fill();
    } else if (kind === 'storm' && e >= T_HIT) { // cracked glass
      const t = c01((e - T_HIT) / 0.12), r = Math.min(w, h) * 0.62 * t, ix = x - w * 0.12, iy = y - h * 0.05;
      c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 0.9; c.beginPath();
      for (let i = 0; i < 8; i++) {

    let tl, trr;
    if (kind === 'sq') { const dx = Math.sin(th) * a, hh = Math.cos(th) * a; tl = [bl[0] + dx, by - hh]; trr = [br[0] + dx, by - hh]; stick(c, bl[0], bl[1], tl[0], tl[1], 9); stick(c, br[0], br[1], trr[0], trr[1], 9); stick(c, tl[0], tl[1], trr[0], trr[1], 9); stick(c, bl[0], bl[1], br[0], br[1], 9); [bl, br, tl, trr].forEach((q) => pin(c, q[0], q[1], 6)); }
    else { const ax = cx + Math.sin(time * 38) * 0.9 * t.p, ay = by - a * 0.866; stick(c, bl[0], bl[1], ax, ay, 9); stick(c, br[0], br[1], ax, ay, 9); stick(c, bl[0], bl[1], br[0], br[1], 9); [bl, br, [ax, ay]].forEach((q) => pin(c, q[0], q[1], 6)); tl = [ax, ay]; }
    // the hand that pushes the top corner
    const hx = tl[0] - 30 - (1 - sstep(t.p * 3)) * 22;
    c.font = `${Math.round(Math.min(34, a * 0.34))}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.globalAlpha = 1; c.fillStyle = '#000'; c.fillText('👉', hx, tl[1] + 1);
    c.restore();
  });
  // a roof truss and a bridge show up after the first push
  if (t.rv > 0.01) {
    c.save(); c.globalAlpha = sstep(t.rv);
    const y0 = H * 0.9, w2 = W * 0.4, x1 = W * 0.27, x2 = W * 0.73;
    // roof truss
    const rh = Math.min(H * 0.2, w2 * 0.45);
    c.fillStyle = rgba(C.roof, 0.9); c.beginPath(); c.moveTo(x1 - w2 / 2 - 8, y0 + 2); c.lineTo(x1, y0 - rh - 8); c.lineTo(x1 + w2 / 2 + 8, y0 + 2); c.lineTo(x1 + w2 / 2 - 3, y0 + 2); c.lineTo(x1, y0 - rh + 4); c.lineTo(x1 - w2 / 2 + 3, y0 + 2); c.closePath(); c.fill();
    [[x1 - w2 / 2, y0, x1 - w2 / 4, y0 - rh / 2, x1, y0], [x1, y0, x1 + w2 / 4, y0 - rh / 2, x1 + w2 / 2, y0]].forEach(([ax, ay, bx, by2, cx2, cy2]) => { c.fillStyle = 'rgba(247,215,116,.2)'; c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by2); c.lineTo(cx2, cy2); c.closePath(); c.fill(); });
    stick(c, x1 - w2 / 2, y0, x1 + w2 / 2, y0, 6); stick(c, x1 - w2 / 2, y0, x1, y0 - rh, 6); stick(c, x1 + w2 / 2, y0, x1, y0 - rh, 6); stick(c, x1, y0, x1, y0 - rh, 5);
    stick(c, x1 - w2 / 4, y0, x1, y0 - rh, 4); stick(c, x1 + w2 / 4, y0, x1, y0 - rh, 4);
    // bridge
    const bh = Math.min(H * 0.13, 56), n = 4, seg = w2 / n;
    c.fillStyle = lin(c, 0, y0 + 2, 0, y0 + 24, [[0, rgba(C.flood, 0.8)], [1, rgba(shade(C.flood, 0.4), 0.9)]]); c.fillRect(x2 - w2 / 2 - 14, y0 + 6, w2 + 28, 20);
    c.fillStyle = GROUND_GREY; c.fillRect(x2 - w2 / 2 - 14, y0 - 4, 14, 30); c.fillRect(x2 + w2 / 2, y0 - 4, 14, 30);
    for (let i = 0; i < n; i++) { const xa = x2 - w2 / 2 + i * seg; c.fillStyle = 'rgba(247,215,116,.18)'; c.beginPath(); if (i % 2) { c.moveTo(xa, y0 - bh); c.lineTo(xa + seg, y0 - bh); c.lineTo(xa, y0); } else { c.moveTo(xa, y0); c.lineTo(xa + seg, y0); c.lineTo(xa + seg, y0 - bh); } c.closePath(); c.fill(); }
    stick(c, x2 - w2 / 2, y0, x2 + w2 / 2, y0, 6); stick(c, x2 - w2 / 2, y0 - bh, x2 + w2 / 2, y0 - bh, 6);
    for (let i = 0; i < n; i++) { const xa = x2 - w2 / 2 + i * seg; if (i % 2) stick(c, xa, y0 - bh, xa + seg, y0, 4); else stick(c, xa, y0, xa + seg, y0 - bh, 4); }
    stick(c, x2 - w2 / 2, y0, x2 - w2 / 2, y0 - bh, 4); stick(c, x2 + w2 / 2, y0, x2 + w2 / 2, y0 - bh, 4);
    c.restore();
  }
}

function drawQuake(c, W, H, time, dt) {
  const q = S.quake;
  q.env += ((q.on ? 1 : 0) - q.env) * Math.min(1, dt * 4);
  const env = q.env, gy = H * 0.8, bw = Math.min(W * 0.22, 96), bh = Math.min(H * 0.58, 280), padH = 13;
  const osc = Math.sin(time * 17) + 0.6 * Math.sin(time * 29 + 1);
  const g = 7 * env * osc;                                  // how far the ground moves
  const free = g + 20 * env * Math.sin(time * 9.5 - 1.1);  // a building on the ground: the top swings far
  const padTop = 3.2 * env * Math.sin(time * 9.5 - 1.1);
  c.fillStyle = lin(c, 0, 0, 0, gy, [[0, shade(C.sky, 0.05)], [1, lighten(C.sky, 0.55)]]); c.fillRect(0, 0, W, gy);
  c.beginPath(); c.moveTo(0, gy); for (let x = 0; x <= W + 8; x += 10) c.lineTo(x, gy - 26 - 14 * Math.sin(x * 0.012 + 0.5) - 7 * Math.sin(x * 0.03)); c.lineTo(W, gy); c.closePath(); c.fillStyle = mix(C.grass, C.sky, 0.5); c.fill();
  const building = (cx, base, lift, topOff) => {
    c.save(); c.translate(cx + base, gy - lift); c.transform(1, 0, -(topOff - base) / bh, 1, 0, 0);
    c.fillStyle = lin(c, -bw / 2, -bh, bw / 2, 0, [[0, lighten(C.wall, 0.4)], [0.6, C.wall], [1, shade(C.wall, 0.18)]]); c.fillRect(-bw / 2, -bh, bw, bh);
    c.strokeStyle = shade(C.wall, 0.45); c.lineWidth = 1.5; c.strokeRect(-bw / 2, -bh, bw, bh);
    const rows = 7, cols = 3, cw = bw / (cols + 1) * 0.62, ch = bh / (rows + 1) * 0.55;
    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
      const wx = -bw / 2 + (k + 1) * bw / (cols + 1) - cw / 2, wy = -bh + (r + 0.55) * bh / (rows + 0.6);
      c.fillStyle = lin(c, wx, wy, wx + cw, wy + ch, [[0, lighten(C.glass, 0.5)], [1, C.glass]]); c.fillRect(wx, wy, cw, ch);
      c.strokeStyle = C.wood; c.lineWidth = 1.2; c.strokeRect(wx, wy, cw, ch);
      c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.moveTo(wx + 2, wy + ch); c.lineTo(wx + cw * 0.4, wy); c.lineTo(wx + cw * 0.55, wy); c.lineTo(wx + cw * 0.17, wy + ch); c.fill();
    }
    c.fillStyle = lin(c, -7, 0, 7, 0, [[0, lighten(C.wood, 0.25)], [1, shade(C.wood, 0.3)]]); rr(c, -7, -bh * 0.1, 14, bh * 0.1, 3); c.fill();
    c.fillStyle = shade(C.roof, 0.1); rr(c, -bw / 2 - 3, -bh - 6, bw + 6, 8, 3); c.fill(); c.strokeStyle = shade(C.roof, 0.5); c.lineWidth = 1; c.stroke();
    c.restore();
  };
  const lx = W * 0.27, rx = W * 0.73;
  // the ground slab shakes
  c.save(); c.translate(g, 0);
  c.fillStyle = lin(c, 0, gy, 0, H, [[0, lighten(C.grass, 0.1)], [0.08, C.grass], [0.1, mix(C.wood, '#000000', 0.15)], [1, mix(C.wood, '#000000', 0.55)]]); c.fillRect(-30, gy, W + 60, H - gy + 4);
  c.restore();
  building(lx, g, 0, free);
  // rubber and steel pads
  c.fillStyle = shade(C.wood, 0.5); c.fillRect(rx - bw / 2 + g - 4, gy - 2, bw + 8, 3);
  const nPad = 3;
  for (let i = 0; i < nPad; i++) {
    const px = rx - bw / 2 + bw * (i + 0.5) / nPad, pw = bw / nPad * 0.7, xb = px + g, xt = px + g * 0.25;
    c.fillStyle = lin(c, xb - pw / 2, 0, xb + pw / 2, 0, [[0, '#3C3550'], [0.5, C.ink], [1, '#1B1530']]);
    c.beginPath(); c.moveTo(xb - pw / 2, gy - 2); c.lineTo(xb + pw / 2, gy - 2); c.lineTo(xt + pw / 2, gy - padH); c.lineTo(xt - pw / 2, gy - padH); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(200,210,225,.75)'; c.lineWidth = 1.5; c.beginPath(); for (let k = 1; k < 4; k++) { const u = k / 4, y = lerpn(gy - 2, gy - padH, u), xo = lerpn(g, g * 0.25, u); c.moveTo(px + xo - pw / 2, y); c.lineTo(px + xo + pw / 2, y); } c.stroke();
  }
  building(rx, g * 0.25, padH, g * 0.25 + padTop);
  c.fillStyle = '#B8C0CC'; c.fillRect(rx - bw / 2 + g * 0.25 - 3, gy - padH - 2.5, bw + 6, 3);
  const k = lang;
  pillText(c, T[k].sec.noPads, lx, gy + 18, W * 0.42, W); pillText(c, T[k].sec.pads, rx, gy + 18, W * 0.42, W);
}

// ================================================================================================================
// controls, readouts and the state cards
// ================================================================================================================
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const dots = (i, n, done) => Array.from({ length: n }, (_, k) => (k < i || done ? '●' : k === i ? '◉' : '○')).join(' ');
const quizHtml = (t, opts, pick, ok, three) => {
  const rev = pick !== null;
  return `<div class="bd-opts ${three ? 'three' : ''}">${opts.map((o, j) => `<button class="bd-btn ${rev ? (j === ok ? 'good' : j === pick ? 'bad' : '') : ''}" data-act="pick" data-j="${j}"${rev ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
};
const fbHtml = (t, pick, ok, why) => `<div class="bd-fb"><b style="color:${pick === ok ? 'var(--ok)' : 'var(--wip)'}">${esc(pick === ok ? t.right : t.wrong)}</b>${esc(why)}</div>`;
const secChips = (t) => {
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="row2" style="margin-top:0"><div class="chips">${sc('triangle', '🔺')}${sc('quake', '🫨')}</div></div>`;
};
const card = (arr) => lab.setState({ emo: arr[0], title: arr[1], lead: arr[2], body: arr[3], extra: '' });
const setQ = (emo, html) => { qEl.style.display = html ? '' : 'none'; qEl.innerHTML = html ? `<span class="e">${emo}</span><span class="t">${html}</span>` : ''; };

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  document.body.dataset.tap = v === 'weather' && S.sec === 'triangle' ? 'on' : 'off';
  if (v === 'weather') renderWeather(t); else if (v === 'parts') renderParts(t); else renderWorld(t);
}

function renderWeather(t) {
  const w = S.w;
  lab.setGlow('rgba(143, 198, 234, .3)');
  if (S.sec) {
    const k = S.sec, emo = k === 'triangle' ? '🔺' : '🫨', st = k === 'triangle' ? t.sec.triText : t.sec.quakeText;
    const btn = k === 'triangle' ? `<button class="btn bd-go" data-act="push">${esc(t.sec.push)}</button>` : `<button class="btn bd-go ${S.quake.on ? '' : ''}" data-act="shake">${esc(t.sec.shake)}${S.quake.on ? ' ✓' : ''}</button>`;
    $('ctrlBody').innerHTML = btn + secChips(t);
    lab.setReadout(emo, t.secrets[k][0], '', '#F7D774');
    lab.setState({ emo, title: t.secrets[k][0], lead: t.secrets[k][1], body: st, extra: '' });
    setQ('', '');
    return;
  }
  if (w.free) {
    const n = scoreOf(w.cfg), tg = t.w.toggles, cfg = w.cfg;
    const row = (key, cur, labels) => `<div class="bd-tg"><div class="card seg small">${labels.map((l, j) => `<button data-act="tog" data-k="${key}" data-v="${j}" class="${cur === j ? 'on' : ''}">${esc(l)}</button>`).join('')}</div></div>`;
    $('ctrlBody').innerHTML = row('steep', cfg.steep ? 1 : 0, tg.roof) + row('stilts', cfg.stilts ? 1 : 0, tg.base) + row('shutters', cfg.shutters ? 1 : 0, tg.win) + row('thick', cfg.thick ? 1 : 0, tg.walls)
      + `<div class="chips bd-wx">${WKINDS.map(([k, emo]) => `<button class="chip ${w.fk === k ? 'on' : ''}" data-act="wx" data-k="${k}">${emo}</button>`).join('')}</div>`
      + `<button class="btn ghost bd-go" data-act="again">${esc(t.again)}</button>` + secChips(t);
    lab.setReadout(esc(t.w.score(n)), '', '', '#8FC6EA');
    setQ('', '');
    card(t.st.weather.f);
    return;
  }
  const r = WR[w.i], rev = w.pick !== null;
  const last = w.i === 3;
  $('ctrlBody').innerHTML = quizHtml(t, t.w.o[w.i], w.pick, r.ok, false)
    + (rev ? fbHtml(t, w.pick, r.ok, t.w.why[w.i]) + `<button class="btn bd-go" data-act="next">${esc(last ? t.w.build : t.next)}</button>` : '')
    + secChips(t);
  lab.setReadout(`${w.i + 1}/4`, dots(w.i, 4, false), '', '#8FC6EA');
  setQ(r.emo, esc(t.w.q[w.i]));
  card(w.finished ? t.st.weather.f : t.st.weather.n);
}

function renderParts(t) {
  const p = S.p, fin = p.i >= 4;
  lab.setGlow('rgba(192, 88, 63, .26)');
  if (fin) {
    $('ctrlBody').innerHTML = `<button class="btn ghost bd-go" data-act="again">${esc(t.again)}</button>`;
    lab.setReadout(p.sel ? esc(t.p.names[p.sel]) : '4/4', '', '', '#C0583F');
    setQ('🔧', p.sel ? `<b>${esc(t.p.names[p.sel])}</b><i>${esc(t.p.jobs[p.sel])}</i>` : esc(t.p.tap));
    card(t.st.parts.f);
    return;
  }
  const r = PR[p.i], rev = p.pick !== null;
  $('ctrlBody').innerHTML = quizHtml(t, t.p.o[p.i], p.pick, r.ok, true)
    + (rev ? fbHtml(t, p.pick, r.ok, t.p.why[p.i]) + `<button class="btn bd-go" data-act="next">${esc(t.next)}</button>` : '');
  lab.setReadout(`${p.i + 1}/4`, dots(p.i, 4, false), '', '#C0583F');
  setQ('🔧', esc(t.p.q[p.i]));
  card(p.finished ? t.st.parts.f : t.st.parts.n);
}

function renderWorld(t) {
  const h = S.h, r = HR[h.i], rev = h.pick !== null, last = h.i === 3;
  lab.setGlow('rgba(95, 163, 90, .26)');
  $('ctrlBody').innerHTML = quizHtml(t, t.h.o[h.i], h.pick, r.ok, true)
    + (rev ? fbHtml(t, h.pick, r.ok, t.h.why[h.i]) + `<button class="btn bd-go ${last ? 'ghost' : ''}" data-act="${last ? 'again' : 'next'}">${esc(last ? t.again : t.next)}</button>` : '');
  lab.setReadout(`${h.i + 1}/4`, dots(h.i, 4, false), '', '#5FA35A');
  setQ('🌍', esc(t.h.q));
  card(h.finished ? t.st.world.f : t.st.world.n);
}

// --- actions -------------------------------------------------------------------------------------------------
function pickWeather(j) {
  const w = S.w; if (w.pick !== null || w.free || S.sec) return;
  w.pick = j; w.t0 = nowS(); if (w.i === 3) w.finished = true;
  (j === WR[w.i].ok ? sfx.good : sfx.bad)(); showStage(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'pick') {
    const j = +b.dataset.j;
    if (v === 'weather') return pickWeather(j);
    const o = v === 'parts' ? S.p : S.h; if (o.pick !== null) return;
    o.pick = j; o.t0 = nowS();
    const ok = (v === 'parts' ? PR : HR)[o.i].ok;
    if (o.i === 3) o.finished = true;
    (j === ok ? sfx.good : sfx.bad)(); if (v === 'parts') setTimeout(() => sfx.snap(), 650); showStage(); render();
  } else if (act === 'next') {
    sfx.click();
    if (v === 'weather') { if (S.w.pick === null) return; if (S.w.i < 3) { S.w.i++; S.w.pick = null; } else { S.w.free = true; S.w.fk = null; } }
    else if (v === 'parts') { if (S.p.pick === null) return; S.p.i++; S.p.pick = null; S.p.sel = null; }
    else if (S.h.pick !== null && S.h.i < 3) { S.h.i++; S.h.pick = null; }
    render();
  } else if (act === 'again') {
    sfx.click();
    if (v === 'weather') Object.assign(S.w, { i: 0, pick: null, free: false, fk: null, finished: false });
    else if (v === 'parts') Object.assign(S.p, { i: 0, pick: null, sel: null, finished: false });
    else Object.assign(S.h, { i: 0, pick: null, finished: false });
    render();
  } else if (act === 'tog') {
    S.w.cfg[b.dataset.k] = b.dataset.v === '1'; sfx.tick();
    if (S.w.fk) S.w.ft0 = nowS();
    render();
  } else if (act === 'wx') { S.w.fk = b.dataset.k; S.w.ft0 = nowS(); sfx.click(); showStage(); render(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.tri.p = S.tri.tp = 0; S.tri.shown = false; S.tri.rv = 0; S.quake.on = false; sfx.click(); showStage(); render();
  } else if (act === 'push') {
    S.tri.tp = 1; sfx.push(); setTimeout(() => { if (!S.tri.drag) S.tri.tp = 0; }, 1300);
  } else if (act === 'shake') { S.quake.on = !S.quake.on; sfx.push(); render(); }
});

// taps and drags on the picture
const cv = $('cv');
cv.addEventListener('pointerdown', (ev) => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, v = lab.view;
  if (v === 'weather' && S.sec === 'triangle') {
    S.tri.drag = true; S.tri.x0 = x; cv.setPointerCapture?.(ev.pointerId);
  } else if (v === 'parts' && S.p.i >= 4 && G.parts) {
    const k = partAt((x - G.parts.gx) / G.parts.s, (y - G.parts.gy) / G.parts.s);
    if (k) { S.p.sel = k; sfx.tick(); render(); }
  }
});
cv.addEventListener('pointermove', (ev) => {
  if (!S.tri.drag) return;
  const r = cv.getBoundingClientRect(); S.tri.tp = Math.min(1, Math.max(0, (ev.clientX - r.left - S.tri.x0) / (G.tri.a * 0.7)));
});
const endDrag = () => { if (S.tri.drag) { S.tri.drag = false; S.tri.tp = 0; } };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

canvasLoop(cv, (c, W, H, dt, time) => {
  const v = lab.view;
  if (v === 'weather') {
    if (S.sec === 'triangle') drawTriangle(c, W, H, time, dt);
    else if (S.sec === 'quake') drawQuake(c, W, H, time, dt);
    else drawWeatherView(c, W, H, time);
  } else if (v === 'parts') drawPartsView(c, W, H, time);
  else drawWorldView(c, W, H, time);
});
render();
</script>
</body>
