}

// the wooden table: a warm gradient, plank seams, soft grain
const rg = mulberry(11);
const GRAIN = Array.from({ length: 44 }, () => ({ x: rg() * 0.9 - 0.1, y: rg(), len: 0.25 + rg() * 0.5, wob: (rg() - 0.5) * 0.02, a: 0.04 + rg() * 0.07 }));
function table(c, w, h) {
  const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#c79a69'); g.addColorStop(1, '#a87a4c');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.lineWidth = 1; c.lineCap = 'round';
  for (const k of GRAIN) {

  }
  for (let i = 1; i < 4; i++) { c.fillStyle = 'rgba(70, 42, 18, .22)'; c.fillRect(0, (h * i) / 4 - 1, w, 1.5); c.fillStyle = 'rgba(255, 235, 200, .07)'; c.fillRect(0, (h * i) / 4 + 0.5, w, 1); }
  const v = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
  v.addColorStop(0, 'rgba(40, 22, 8, 0)'); v.addColorStop(1, 'rgba(40, 22, 8, .38)');

function paperRect(c, x, y, w, h, lift = 0) {

}

function linoPanel(c, x, y, w, h, r = 12) {
  c.save();
  c.shadowColor = 'rgba(40, 24, 8, .5)'; c.shadowBlur = 14; c.shadowOffsetY = 6;
  const g = c.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, '#a89480'); g.addColorStop(1, '#78665a');
  c.fillStyle = g; rr(c, x, y, w, h, r); c.fill();
  c.restore();
  c.save(); c.strokeStyle = '#54453a'; c.lineWidth = 1.8; rr(c, x, y, w, h, r); c.stroke();
  c.strokeStyle = 'rgba(255, 240, 220, .28)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x + r, y + 1.5); c.lineTo(x + w - r, y + 1.5); c.stroke(); c.restore();
}

// --- view 1: the 9 x 9 block --------------------------------------------------------------------------------
const N = 9, CELL = 22, PNL = N * CELL + 20;     // panel 218
const rowsToGrid = (rows) => Uint8Array.from(rows.join(''), (ch) => (ch === '#' ? 1 : 0));
const GLYPH = {
  R: rowsToGrid(['.######..', '.##...##.', '.##...##.', '.##...##.', '.######..', '.##.##...', '.##..##..', '.##...##.', '.##...##.']),
  N: rowsToGrid(Array.from({ length: N }, (_, r) => { const d = 2 + Math.round((r * 3) / 8); return Array.from({ length: N }, (_, c) => ((c === 1 || c === 2 || c === 6 || c === 7 || c === d || c === d + 1) ? '#' : '.')).join(''); })),
  heart: rowsToGrid(['..##.##..', '.#######.', '#########', '#########', '#########', '.#######.', '..#####..', '...###...', '....#....']),
  clear: new Uint8Array(N * N),

const mirrorGrid = (g) => { const o = new Uint8Array(N * N); for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) o[r * N + c] = g[r * N + (N - 1 - c)]; return o; };

function drawBlock(c, x, y, g, inkAt) {
  linoPanel(c, x, y, PNL, PNL, 12);
  for (let r = 0; r < N; r++) for (let k = 0; k < N; k++) {
    const X = x + 10 + k * CELL, Y = y + 10 + r * CELL;
    if (g[r * N + k]) {
      c.fillStyle = LINO; c.fillRect(X + 0.5, Y + 0.5, CELL - 1, CELL - 1);
      const a = inkAt ? inkAt(Y + CELL / 2) : 0;
      if (a > 0.01) {
        c.fillStyle = `rgba(29, 29, 31, ${a})`; c.fillRect(X + 0.5, Y + 0.5, CELL - 1, CELL - 1);
        c.fillStyle = `rgba(255, 255, 255, ${0.17 * a})`; c.fillRect(X + 2, Y + 2, CELL - 5, 2); c.fillRect(X + 2, Y + 2, 2, CELL - 5);
      } else {
        c.fillStyle = 'rgba(255, 245, 225, .24)'; c.fillRect(X + 0.5, Y + 0.5, CELL - 1, 2); c.fillRect(X + 0.5, Y + 0.5, 2, CELL - 1);
        c.fillStyle = 'rgba(30, 18, 8, .26)'; c.fillRect(X + 0.5, Y + CELL - 2.5, CELL - 1, 2); c.fillRect(X + CELL - 2.5, Y + 0.5, 2, CELL - 1);
      }
    } else {
      c.fillStyle = CARVED; c.fillRect(X, Y, CELL, CELL);
      c.fillStyle = 'rgba(80, 58, 34, .36)'; c.fillRect(X, Y, CELL, 3); c.fillRect(X, Y, 3, CELL);
      c.fillStyle = 'rgba(255, 250, 235, .3)'; c.fillRect(X, Y + CELL - 1, CELL, 1); c.fillRect(X + CELL - 1, Y, 1, CELL);
    }
  }
}
function drawPrintCells(c, x, y, g, alpha = 0.96) {
  c.fillStyle = `rgba(29, 29, 31, ${alpha})`;
  for (let r = 0; r < N; r++) for (let k = 0; k < N; k++) if (g[r * N + k]) c.fillRect(x + 10 + k * CELL - 0.3, y + 10 + r * CELL - 0.3, CELL + 0.6, CELL + 0.6);
}
function dottedAxis(c, x, y, col) {
  c.save(); c.strokeStyle = col; c.lineWidth = 1.5; c.setLineDash([2, 5]); c.beginPath(); c.moveTo(x + PNL / 2, y + 5); c.lineTo(x + PNL / 2, y + PNL - 5); c.stroke(); c.restore();

function roller(c, x0, x1, y) {                          // a horizontal roller with a frame handle
  c.save();
  c.strokeStyle = '#3e3e45'; c.lineWidth = 3.5; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(x0 - 2, y); c.lineTo(x0 - 2, y - 14); c.lineTo(x1 + 2, y - 14); c.lineTo(x1 + 2, y); c.stroke();
  c.strokeStyle = '#9b5a34'; c.lineWidth = 6; c.beginPath(); c.moveTo(x0 + (x1 - x0) * 0.3, y - 14); c.lineTo(x0 + (x1 - x0) * 0.7, y - 14); c.stroke();
  c.shadowColor = 'rgba(0, 0, 0, .45)'; c.shadowBlur = 8; c.shadowOffsetX = 2; c.shadowOffsetY = 4;
  const g = c.createLinearGradient(0, y - 9, 0, y + 9); g.addColorStop(0, '#141416'); g.addColorStop(0.35, '#4a4a53'); g.addColorStop(0.62, '#26262b'); g.addColorStop(1, '#0e0e10');
  c.fillStyle = g; rr(c, x0, y - 9, x1 - x0, 18, 9); c.fill();

  c.strokeStyle = '#0c0c0e'; c.lineWidth = 1.2; rr(c, x0, y - 9, x1 - x0, 18, 9); c.stroke(); c.restore();
}

// --- view 2: the picture, one block per colour -------------------------------------------------------------
// picture space is 240 x 240; the sea has a boat-shaped hole, so the red block fits it exactly
function layerShape(c, i) {
  if (i === 0) {                                        // sun and rays
    c.beginPath(); c.arc(158, 92, 30, 0, TAU); c.fill();
    for (let k = 0; k < 12; k++) {
      const a = (k * Math.PI) / 6 + 0.13;
      c.beginPath(); c.moveTo(158 + Math.cos(a - 0.1) * 38, 92 + Math.sin(a - 0.1) * 38);
      c.lineTo(158 + Math.cos(a) * 56, 92 + Math.sin(a) * 56); c.lineTo(158 + Math.cos(a + 0.1) * 38, 92 + Math.sin(a + 0.1) * 38); c.closePath(); c.fill();
    }
  } else if (i === 1) {                                 // sea with a notch for the hull
    c.beginPath(); c.moveTo(0, 150); c.lineTo(40, 150); c.lineTo(56, 176); c.lineTo(94, 176); c.lineTo(108, 150); c.lineTo(240, 150); c.lineTo(240, 240); c.lineTo(0, 240); c.closePath(); c.fill();
  } else {                                              // boat: hull, mast, sail, jib, pennant
    c.beginPath(); c.moveTo(40, 150); c.lineTo(108, 150); c.lineTo(94, 176); c.lineTo(56, 176); c.closePath(); c.fill();
    c.fillRect(70, 84, 5, 66);
    c.beginPath(); c.moveTo(77, 90); c.lineTo(77, 146); c.lineTo(106, 146); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(67, 96); c.lineTo(67, 146); c.lineTo(46, 146); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(75, 84); c.lineTo(75, 94); c.lineTo(92, 89); c.closePath(); c.fill();
  }
}
function seaWaves(c, col) {
  c.save(); c.strokeStyle = col; c.lineWidth = 2.8; c.lineCap = 'round';
  for (const [y, xs] of [[190, [20, 100, 170]], [207, [52, 132]], [224, [10, 92, 176]]]) for (const x of xs) { c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 16, y - 8, x + 32, y); c.stroke(); }
  c.restore();
}
function marks(c, col, lw) {
  c.save(); c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'butt'; c.lineJoin = 'miter';
  for (const [cx, cy, sx, sy] of [[0, 0, -1, -1], [240, 0, 1, -1], [0, 240, -1, 1], [240, 240, 1, 1]]) {
    const ox = cx + sx * 8, oy = cy + sy * 8;
    c.beginPath(); c.moveTo(ox - sx * 12, oy); c.lineTo(ox, oy); c.lineTo(ox, oy - sy * 12); c.stroke();
  }
  c.restore();
}
// o: { col, alpha, cut (colour of carved-away lines), marks, mcol, mw, shift:[dx,dy], mul }
function artLayer(c, i, x, y, k, o) {
  c.save();
  c.translate(x + (o.shift ? o.shift[0] * k : 0), y + (o.shift ? o.shift[1] * k : 0)); c.scale(k, k);
  c.globalAlpha *= o.alpha ?? 1;
  c.fillStyle = o.col;
  c.globalCompositeOperation = o.mul === false ? 'source-over' : 'multiply';
  layerShape(c, i);
  if (o.marks) marks(c, o.mcol || o.col, o.mw || 2.2);
  c.globalCompositeOperation = 'source-over';

}
const TILE = 96;
function drawTile(c, x, y, i, inked, shift) {
  c.save();
  c.shadowColor = 'rgba(40, 24, 8, .5)'; c.shadowBlur = 10; c.shadowOffsetY = 5;
  const g = c.createLinearGradient(x, y, x + TILE, y + TILE); g.addColorStop(0, '#d4c3a8'); g.addColorStop(1, '#bba88c');
  c.fillStyle = g; rr(c, x, y, TILE, TILE, 9); c.fill();
  c.restore();
  c.save(); c.strokeStyle = '#6e5e4d'; c.lineWidth = 1.6; rr(c, x, y, TILE, TILE, 9); c.stroke(); c.restore();
  artLayer(c, i, x + 8, y + 8, 1 / 3, { col: inked ? LCOL[i] : LINO, cut: CARVED, marks: true, mcol: inked ? LCOL[i] : '#5d4e40', mw: 6, shift, mul: false });
}

// --- view 3: the fish block and its edition -----------------------------------------------------------------
function fishFill(c) {                                   // fish in a 100 x 90 box
  c.beginPath(); c.ellipse(46, 50, 34, 22, 0, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(74, 50); c.lineTo(98, 28); c.quadraticCurveTo(91, 50, 98, 72); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(34, 31); c.quadraticCurveTo(48, 4, 64, 33); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(44, 69); c.lineTo(36, 86); c.lineTo(58, 71); c.closePath(); c.fill();
}
function fishCuts(c, col) {
  c.save(); c.fillStyle = col; c.strokeStyle = col; c.lineWidth = 2.2; c.lineCap = 'round';
  c.beginPath(); c.arc(26, 45, 4.2, 0, TAU); c.fill();
  c.beginPath(); c.arc(38, 50, 15, -1.0, 1.0); c.stroke();
  c.beginPath(); c.moveTo(52, 33); c.quadraticCurveTo(57, 50, 52, 67); c.stroke();
  c.beginPath(); c.moveTo(62, 35); c.quadraticCurveTo(67, 50, 62, 65); c.stroke();
  c.restore();
}
function drawFishBlock(c, x, y, size) {
  linoPanel(c, x, y, size, size, 10);
  c.save(); rr(c, x + 5, y + 5, size - 10, size - 10, 6); c.clip();
  c.fillStyle = CARVED; c.fillRect(x, y, size, size);
  c.fillStyle = 'rgba(80, 58, 34, .3)'; c.fillRect(x, y, size, 4); c.fillRect(x, y, 4, size);
  const k = (size - 16) / 100;
  c.translate(x + size / 2, y + 8 + (size - 16 - 90 * k) / 2); c.scale(-k, k); c.translate(-50, 0);   // a block carries the mirror image
  c.fillStyle = INK; fishFill(c);
  c.fillStyle = 'rgba(255, 255, 255, .16)'; c.beginPath(); c.ellipse(46, 40, 24, 8, 0, 0, TAU); c.fill();
  fishCuts(c, CARVED);
  c.restore();
}
function makePrint(seed, i) {
  const r = mulberry(seed * 131 + i * 977 + 7);
  return {
    dx: (r() - 0.5) * 5, dy: (r() - 0.5) * 5, rot: (r() - 0.5) * 0.06, ink: 0.82 + r() * 0.18,
    blots: Array.from({ length: 3 + ((r() * 3) | 0) }, () => ({ x: 14 + r() * 80, y: 14 + r() * 66, r: 4 + r() * 9, a: 0.14 + r() * 0.26 })),
    specks: Array.from({ length: (r() * 3) | 0 }, () => ({ x: 6 + r() * 88, y: 6 + r() * 80, r: 0.8 + r() * 1.4 })),

// one print on a sheet; label = the pencil number; px = canvas text size in design units
function drawCopy(c, x, y, w, h, p, label, px, alpha = 1) {
  c.save(); c.globalAlpha *= alpha;
  paperRect(c, x, y, w, h);
  const k = (w * 0.84) / 100, ax = x + w * 0.08, ay = y + h * 0.08;
  c.save(); c.translate(ax + p.dx * k, ay + p.dy * k); c.translate(50 * k, 45 * k); c.rotate(p.rot); c.scale(k, k); c.translate(-50, -45);
  c.fillStyle = `rgba(29, 29, 31, ${p.ink})`; fishFill(c);

  c.restore();
  c.fillStyle = 'rgba(29, 29, 31, .8)';
  for (const sp of p.specks) { c.beginPath(); c.arc(ax + (sp.x / 100) * w * 0.84, ay + (sp.y / 100) * w * 0.84, sp.r * k * 1.4, 0, TAU); c.fill(); }
  c.fillStyle = '#6a6a72'; c.font = `700 ${px}px Nunito, sans-serif`; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.fillText(label, x + w * 0.1, y + h - h * 0.045);
  c.restore();
}

// --- secrets: the wave and the potato ------------------------------------------------------------------------
function waveBody(c) { c.beginPath(); c.moveTo(100, 220); c.bezierCurveTo(112, 168, 150, 126, 192, 98); c.bezierCurveTo(214, 82, 226, 60, 224, 38); c.bezierCurveTo(250, 34, 278, 42, 300, 60); c.lineTo(300, 220); c.closePath(); }
function waveLip(c) { c.beginPath(); c.moveTo(224, 62); c.lineTo(224, 36); c.bezierCurveTo(212, 4, 172, 6, 158, 38); c.bezierCurveTo(172, 24, 196, 30, 204, 62); c.closePath(); }
function farSea(c) { c.beginPath(); c.moveTo(0, 138); c.quadraticCurveTo(75, 130, 150, 136); c.quadraticCurveTo(225, 142, 300, 132); c.lineTo(300, 220); c.lineTo(0, 220); c.closePath(); }
function waveArt(c, i, alpha) {                         // picture space 300 x 220
  if (alpha < 0.003) return;
  c.save(); c.globalAlpha = alpha; c.lineJoin = 'round'; c.lineCap = 'round';
  if (i === 0) {                                        // block 1: the sky, darker at the top
    const g = c.createLinearGradient(0, 0, 0, 140); g.addColorStop(0, 'rgba(246, 189, 22, .9)'); g.addColorStop(1, 'rgba(246, 189, 22, .12)');
    c.globalCompositeOperation = 'multiply'; c.fillStyle = g; c.fillRect(0, 0, 300, 140);
    c.globalCompositeOperation = 'source-over'; c.fillStyle = CREAM; c.beginPath(); c.arc(62, 54, 21, 0, TAU); c.fill();
  } else if (i === 1) {                                 // block 2: the deep sea
    c.globalCompositeOperation = 'multiply'; c.fillStyle = BLUE;
    c.globalAlpha = alpha * 0.5; farSea(c); c.fill();
    c.globalAlpha = alpha * 0.93; waveBody(c); c.fill(); waveLip(c); c.fill();
  } else if (i === 2) {                                 // block 3: the foam, a pale tint
    c.globalCompositeOperation = 'multiply'; c.strokeStyle = 'rgba(29, 78, 137, .3)'; c.fillStyle = 'rgba(29, 78, 137, .3)';
    c.lineWidth = 9; c.beginPath(); c.moveTo(224, 36); c.bezierCurveTo(212, 4, 172, 6, 158, 38); c.stroke();
    c.lineWidth = 8; c.beginPath(); c.moveTo(224, 38); c.bezierCurveTo(250, 34, 278, 42, 300, 60); c.stroke();
    c.lineWidth = 5; for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(188 - k * 12, 106 + k * 16); c.quadraticCurveTo(204 - k * 10, 96 + k * 16, 224 - k * 8, 100 + k * 18); c.stroke(); }
    for (const [x, y, r] of [[150, 44, 5], [140, 54, 3.5], [132, 40, 3], [146, 62, 2.5], [166, 52, 3], [126, 50, 2], [158, 58, 4], [120, 62, 2], [136, 30, 2.5]]) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
  } else {                                              // block 4: the black outline, last
    c.strokeStyle = INK; c.fillStyle = INK; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(100, 220); c.bezierCurveTo(112, 168, 150, 126, 192, 98); c.bezierCurveTo(214, 82, 226, 60, 224, 38); c.bezierCurveTo(250, 34, 278, 42, 300, 60); c.stroke();
    c.beginPath(); c.moveTo(224, 36); c.bezierCurveTo(212, 4, 172, 6, 158, 38); c.bezierCurveTo(172, 24, 196, 30, 204, 62); c.stroke();
    c.lineWidth = 1.5;
    for (const [a, b, d, e, f, g2] of [[150, 150, 168, 128, 200, 112], [142, 176, 166, 150, 206, 130], [150, 200, 180, 172, 226, 150]]) { c.beginPath(); c.moveTo(a, b); c.quadraticCurveTo(d, e, f, g2); c.stroke(); }
    c.beginPath(); c.moveTo(0, 138); c.quadraticCurveTo(75, 130, 150, 136); c.stroke();
    for (const [x, y] of [[14, 168], [44, 184], [20, 202], [66, 210]]) { c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 9, y - 6, x + 18, y); c.stroke(); }
    c.lineWidth = 1.8; c.beginPath(); c.arc(62, 54, 21, 0, TAU); c.stroke();
    c.beginPath(); c.moveTo(44, 150); c.lineTo(44, 118); c.lineTo(66, 150); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(38, 152); c.lineTo(72, 152); c.lineTo(66, 161); c.lineTo(44, 161); c.closePath(); c.fill();
  }
  c.restore();
}
function shapePath(c, kind, r) {                        // stamp shapes, centred at 0,0

  else { for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + (k * TAU) / 5; c.moveTo(Math.cos(a) * r * 0.52 + r * 0.4, Math.sin(a) * r * 0.52); c.arc(Math.cos(a) * r * 0.52, Math.sin(a) * r * 0.52, r * 0.4, 0, TAU); } c.moveTo(r * 0.28, 0); c.arc(0, 0, r * 0.28, 0, TAU); }
}
function drawPotato(c, x, y, k, shape, ink) {
  c.save(); c.translate(x, y); c.scale(k, k);

  const g = c.createLinearGradient(-62, -50, 62, 50); g.addColorStop(0, '#d0a766'); g.addColorStop(1, '#9a7238');
  c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, 62, 50, -0.1, 0, TAU); c.fill();
  c.shadowColor = 'transparent'; c.strokeStyle = '#6f5026'; c.lineWidth = 2; c.stroke();
  const f = c.createLinearGradient(-50, -40, 50, 40); f.addColorStop(0, '#f6ecc6'); f.addColorStop(1, '#e0cb92');
  c.fillStyle = f; c.beginPath(); c.ellipse(0, 0, 53, 41, -0.1, 0, TAU); c.fill();

    }
    return render();
  }
  if (a === 'ink') { if (busy()) return; go(['ink']); }
  else if (a === 'print') { if (busy()) return; go(S.inked ? ['print'] : ['ink', 'print']); }
  else if (a === 'preset') { if (busy()) return; S.g = GLYPH[b.dataset.p].slice(); S.inked = false; sfx.click(); }
  else if (a === 'blk') return blockTap(+b.dataset.i);
  else if (a === 'mis') { S.misOn = !S.misOn; sfx.click(); }
  else if (a === 'p10') { printEdition(); }
  else if (a === 'wv') { const i = +b.dataset.i; S.wvOn[i] = !S.wvOn[i]; if (S.wvOn[i] && S.wvT < i * 1.2) S.wvT = i * 1.2; sfx.tick(); }
  else if (a === 'pink') { S.pInk = +b.dataset.i; sfx.tick(); }
  else if (a === 'pshape') { S.pShape = +b.dataset.i; sfx.tick(); }
  else if (a === 'pclear') { S.pst.fill(null); sfx.click(); }
  render();
});

// --- one render per change: controls, readout and the state card --------------------------------------------
function askHTML(k, t) {
  const A = ASK[k], ans = S.ans[k];
  const chips = t[A.o].map((o, j) => {
    const cls = `pm-opt${ans !== null && j === A.r ? ' good' : ans === j ? ' bad' : ''}`;
    return `<button class="${cls}" data-act="opt" data-k="${k}" data-j="${j}"${ans !== null ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  const verdict = ans === null ? '' : `<div class="pm-verdict ${ans === A.r ? 'good' : 'bad'}">${esc(ans === A.r ? t[A.ok] : t[A.no])}</div>`;
  return `<div class="pm-q">${esc(t[A.q])}</div><div class="pm-chips">${chips}</div>${verdict}`;
}
const askState = (t, k) => ({ emo: '🤔', title: t[ASK[k].q], lead: '', body: '' });
function show(id, on) { $(id).style.display = on ? 'block' : 'none'; }

function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  show('pmV1', !sec && v === 'stamp'); show('pmV2', !sec && v === 'colours'); show('pmV3', !sec && v === 'copies');
  show('pmWv', sec === 'wave'); show('pmPt', sec === 'potato');
  cv.style.touchAction = sec === 'potato' || (!sec && v === 'stamp') ? 'none' : 'pan-y';
  const open = secret.unlocked();
  $('rowSec').innerHTML = [['wave', '🌊', t.secrets.a[0]], ['potato', '🥔', t.secrets.b[0]]].map(([k, emo, name]) =>
    `<button class="pm-chip pm-lock${open ? ' open' : ''}${sec === k ? ' on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(name)}` : '🔒 ???'}</button>`).join('');
  if (sec === 'wave') return renderWave(t);
  if (sec === 'potato') return renderPotato(t);
  if (v === 'stamp') renderStamp(t); else if (v === 'colours') renderColours(t); else renderCopies(t);
}

function renderStamp(t) {
  const asking = S.ans.stamp === null, off = asking || busy();
  lab.setGlow('rgba(141, 123, 104, .3)');
  $('ask1').innerHTML = askHTML('stamp', t);
  $('row1').innerHTML = `<button class="btn" data-act="ink"${off ? ' disabled' : ''}>🖌️ ${esc(t.ink)}</button><button class="btn" data-act="print"${off ? ' disabled' : ''}>🖨️ ${esc(t.print)}</button>`;
  $('pre1').innerHTML = ['R', 'N', 'heart', 'clear'].map((k) => `<button class="pm-chip" data-act="preset" data-p="${k}"${off ? ' disabled' : ''}>${esc(t.presets[k])}</button>`).join('');
  if (asking) { lab.setReadout('?', '', '', '#8d7b68'); lab.setState(askState(t, 'stamp')); lab.setFacts([]); return; }
  lab.setReadout(`<span class="pm-vsm">${esc(t.mirrorVal)}</span>`, '', t.raised, '#8d7b68');
  const [emo, title, lead, body] = t.st.stamp; lab.setState({ emo, title, lead, body }); lab.setFacts(t.facts.stamp);
}
function renderColours(t) {
  const asking = S.ans.colours === null, off = asking || busy() || !S.reveal;
  lab.setGlow('rgba(29, 78, 137, .3)');
  $('ask2').innerHTML = askHTML('colours', t);
  $('row2').innerHTML = asking ? '' : LKEY.map((k, i) => `<button class="pm-bb${S.on[i] ? ' on' : ''}" style="--c:${LCOL[i]}" data-act="blk" data-i="${i}"${off ? ' disabled' : ''}><i class="pm-dot"></i>${esc(t.blocks[k])}${S.on[i] ? ' ✓' : ''}</button>`).join('');
  $('mis2').innerHTML = asking ? '' : `<button class="pm-chip${S.misOn ? ' on' : ''}" data-act="mis">↔ ${esc(t.misreg)}</button>`;
  if (asking) { lab.setReadout('?', '', '', '#f6bd16'); lab.setState(askState(t, 'colours')); lab.setFacts([]); return; }
  lab.setReadout(esc(t.layers(S.on.filter(Boolean).length)), '', S.misOn ? t.lineUp : '', '#f6bd16');
  const [emo, title, lead, body] = t.st.colours; lab.setState({ emo, title, lead, body }); lab.setFacts(t.facts.colours);
}
function renderCopies(t) {
  const asking = S.ans.copies === null;
  lab.setGlow('rgba(201, 183, 156, .28)');
  $('ask3').innerHTML = askHTML('copies', t);
  $('row3').innerHTML = `<button class="btn" data-act="p10"${asking ? ' disabled' : ''}>📚 ${esc(t.print10)}</button>`;
  if (asking) { lab.setReadout('?', '', '', '#c9b79c'); lab.setState(askState(t, 'copies')); lab.setFacts([]); return; }
  lab.setReadout(esc(t.nPrints(S.count)), '', t.edition, '#c9b79c');
  const [emo, title, lead, body] = t.st.copies; lab.setState({ emo, title, lead, body }); lab.setFacts(t.facts.copies);
}
function renderWave(t) {
  lab.setGlow('rgba(29, 78, 137, .32)');
  const sw = [YEL, BLUE, '#9db8d8', INK];
  $('rowWv').innerHTML = sw.map((col, i) => `<button class="pm-sw${S.wvOn[i] ? ' on' : ' off'}" style="--c:${col}" data-act="wv" data-i="${i}" aria-label="${i + 1}"></button>`).join('');
  lab.setReadout(esc(t.secrets.a[0]), '', t.inStyle, '#4ea8ff');
  lab.setState({ emo: '🌊', title: t.secrets.a[0], lead: t.waveText, body: '' }); lab.setFacts([]);
}
function renderPotato(t) {
  lab.setGlow('rgba(201, 164, 107, .32)');
  $('rowPt').innerHTML = INKS.map((col, i) => `<button class="pm-sw${S.pInk === i ? ' on' : ''}" style="--c:${col}" data-act="pink" data-i="${i}" aria-label="${i + 1}"></button>`).join('')
    + '<span class="pm-sep"></span>'
    + SHAPES.map((k, i) => `<button class="pm-chip${S.pShape === i ? ' on' : ''}" data-act="pshape" data-i="${i}" aria-label="${k}">${SVG[k]}</button>`).join('')
    + `<button class="pm-chip" data-act="pclear">${esc(t.presets.clear)}</button>`;
  lab.setReadout(esc(t.secrets.b[0]), '', '', '#c9a46b');
  lab.setState({ emo: '🥔', title: t.secrets.b[0], lead: t.potatoText, body: '' }); lab.setFacts([]);
}
render();
</script>
