}

cv.addEventListener('pointerdown', (ev) => {

    S.drag = inside ? { dx: p.x - S.tx, dy: p.y - S.ty } : { dx: 0, dy: 0 };
    if (!inside) { S.tx = p.x; S.ty = p.y; clampFrame(); }

  } else if (lab.view === 'sort') {

  lab.setReadout(t.fill(Math.round(fillOf(SUB_A[k], pk) * 100)), `${done} / 3`, '', ok ? '#3ddc97' : '#ff9a90');
  lab.setState({ emo: t.stH[0], title: t.stH[1], lead: t.stH[2], body: t.stH[3], extra: '' }); lab.setFacts(t.facts.shape);
}
render();
</script>
