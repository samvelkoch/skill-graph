const GDUR = 0.42, PDUR = 0.17;
function initPredict() { placeEnt(P, 2, 3, [0, 1]); placeEnt(G, 2, 4, [0, -1]); R.queue = []; R.wp = 1; R.pc = false; R.hold = 0; R.fired = null; R.sees = true; }
function resetRulesScene() { placeEnt(P, START[0], START[1], [1, 0]); placeEnt(G, 4, 4, [1, 0]); R.queue = []; R.wp = 1; R.pc = false; R.hold = 0.5; R.flash = 0; }

    if (!R.on[id]) continue;
    if (id === 'chase' && sees) return { rule: id, sees };
    if (id === 'patrol') return { rule: id, sees }; // the “If not” card is the “otherwise” card: it fires when no card above it did
    if (id === 'home' && far) return { rule: id, sees };

    n = stepToward(G.x, G.y, idx(t[0], t[1]), G.face);

  if (A.t >= 0 && lvl >= A.dT && A.path.length > 1) {
    c.save(); c.strokeStyle = '#ffc93c'; c.lineWidth = Math.max(3, ts * 0.16); c.lineCap = 'round'; c.lineJoin = 'round'; c.shadowColor = 'rgba(255,201,60,.7)'; c.shadowBlur = 8;
    c.beginPath(); A.path.forEach(([x, y], k) => (k ? c.lineTo(px(x + 0.5), py(y + 0.5)) : c.moveTo(px(x + 0.5), py(y + 0.5)))); c.stroke(); c.restore();
  }
  let gp = [PGUARD[0], PGUARD[1]];
  if (A.path.length > 1) {
    const k = Math.min(Math.floor(u), A.path.length - 2), f = u - k, a0 = A.path[k], a1 = A.path[k + 1];
    gp = [a0[0] + (a1[0] - a0[0]) * f, a0[1] + (a1[1] - a0[1]) * f];
    if (u > 0 && (a1[0] !== a0[0] || a1[1] !== a0[1])) G.face = [Math.sign(a1[0] - a0[0]), Math.sign(a1[1] - a0[1])];
  }
  actors(c, [{ e: { x: A.target[0], y: A.target[1], trail: [], a: 1, face: [0, 1] }, kind: 'robot' }, { e: { x: gp[0], y: gp[1], trail: [], a: 1, face: G.face, fa: G.fa }, kind: 'fox', col: PCOL }], time);
}
function livePath() {
  const p = T[lang].pf; lab.setGlow('rgba(78, 200, 190, .24)');
  $('gaARun').textContent = A.ph === 0 ? p.run : p.again;
  let st;
  if (A.ph === 0) st = p.t0; else if (A.ph === 1) st = p.t1;
  else {
    const m = Math.abs(A.target[0] - PGUARD[0]) + Math.abs(A.target[1] - PGUARD[1]);
    st = A.ph === 2 ? p.t2(A.dT, m) : p.t3(A.dT);
  }
  lab.setState({ emo: '🗺️', title: st[0], lead: st[1], body: '', extra: '' });
  lab.setReadout(A.ph >= 2 ? String(A.dT) : '?', p.sub, A.ph >= 1 ? p.pill(A.cnt) : '', '#4ec8be');
  lab.setFacts([T[lang].facts.path]);
}

// --- Secret: the guard that learns -------------------------------------------------------------------------
function itinerary(start, order, hide) {
  const cells = [[start[0], start[1]]]; let cur = start, checks = 0;
  for (const b of order) {
    const [bx, by] = BUSH[b], p = pathTo(cur[0], cur[1], idx(bx, by));
    cells.push(...p.slice(1), [bx, by], [bx, by]); checks++; cur = [bx, by];
    if (b === hide) break;
  }
  return { cells, checks };
}
const learnerOrder = () => (L.round < 3 ? [0, 1, 2, 3] : [0, 1, 2, 3].sort((a, b) => L.hist[b] - L.hist[a] || a - b));
function initLearn() { L.hist = [0, 0, 0, 0]; L.round = 0; L.hide = null; L.phase = 'pick'; L.t = 0; L.sumR = 0; L.sumL = 0; L.last = null; placeEnt(LA, LSTART[0][0], LSTART[0][1], [1, 0]); placeEnt(LB, LSTART[1][0], LSTART[1][1], [1, 0]); }
function pickBush(k) {
  if (L.phase === 'run') return;
  L.orderL = learnerOrder(); L.hide = k;
  const a = itinerary(LSTART[0], [0, 1, 2, 3], k), b = itinerary(LSTART[1], L.orderL, k);
  L.itR = a.cells; L.itL = b.cells; L.chR = a.checks; L.chL = b.checks; L.t = 0; L.phase = 'run'; sfx.click(); renderRules(T[lang]);
}
function updLearn(dt) {
  if (L.phase !== 'run') return;
  L.t += dt;
  if (L.t * LRATE >= Math.max(L.itR.length, L.itL.length) - 1 + 0.8) {
    const learned = L.round >= 3, fav = L.orderL[0];
    L.hist[L.hide]++; L.round++; L.sumR += L.chR; L.sumL += L.chL; L.phase = 'done'; L.last = { learned, fav };
    (L.chL <= L.chR ? sfx.good : sfx.bad)(); liveLearn();
  }
}
function along(cells, u) {
  const n = cells.length - 1; if (n <= 0) return cells[0];
  const k = clamp(u, 0, n), i = Math.min(n - 1, Math.floor(k)), f = k - i;
  return [cells[i][0] + (cells[i + 1][0] - cells[i][0]) * f, cells[i][1] + (cells[i + 1][1] - cells[i][1]) * f];
}
function drawLearn(c, w, h, t, time) {
  const u = L.t * LRATE, run = L.phase !== 'pick';
  BUSH.forEach(([x, y], k) => bush(c, x, y, k, time, L.phase === 'pick', run && L.hide === k && u > 1 && u < Math.min(L.itR.length, L.itL.length) ? 'shake' : ''));
  const ts = LY.ts;
  L.hist.forEach((n, k) => { // what the learner remembers
    if (!n) return;
    const X = px(BUSH[k][0] + 0.5) + ts * 0.3, Y = py(BUSH[k][1] + 0.5) + ts * 0.32;
    c.save(); c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#8f67ee'; rr(c, X - 14, Y - 9, 28, 18, 9); c.fill(); c.fillStyle = '#fff'; c.fillText(`×${n}`, X, Y + 1); c.restore();
  });
  if (L.hide !== null) { // the robot's antenna sticks out of its bush
    const X = px(BUSH[L.hide][0] + 0.5), Y = py(BUSH[L.hide][1] + 0.5);
    c.save(); c.strokeStyle = '#173a85'; c.lineWidth = 2; c.beginPath(); c.moveTo(X + ts * 0.14, Y - ts * 0.3); c.lineTo(X + ts * 0.14, Y - ts * 0.52); c.stroke();
    c.fillStyle = '#ffb347'; c.beginPath(); c.arc(X + ts * 0.14, Y - ts * 0.54, ts * 0.06, 0, 7); c.fill(); c.restore();
  }
  const pa = run ? along(L.itR, u) : LSTART[0], pb = run ? along(L.itL, u) : LSTART[1];
  const dir = (cells, uu, e) => { const n = cells.length - 1, i = Math.min(Math.max(n - 1, 0), Math.floor(clamp(uu, 0, n))); if (n > 0) { const fx = Math.sign(cells[i + 1][0] - cells[i][0]), fy = Math.sign(cells[i + 1][1] - cells[i][1]); if (fx || fy) e.face = [fx, fy]; } };
  if (run) { dir(L.itR, u, LA); dir(L.itL, u, LB); }
  const foundR = run && u >= L.itR.length - 1, foundL = run && u >= L.itL.length - 1;
  const list = [{ e: { x: pa[0], y: pa[1], trail: [], a: 1, face: LA.face, fa: LA.fa }, kind: 'fox', col: PCOL }, { e: { x: pb[0], y: pb[1], trail: [], a: 1, face: LB.face, fa: LB.fa }, kind: 'fox', col: VCOL }];
  if ((foundR || foundL) && L.hide !== null) list.push({ e: { x: BUSH[L.hide][0] + 0.55, y: BUSH[L.hide][1] + 0.25, trail: [], a: 1, face: [0, 1] }, kind: 'robot' });
  actors(c, list, time);
  const q = T[lang].ln, lt = L.round < 3 ? `${q.learner} ${L.round}/3` : `${q.learner} ★`;
  bubble(c, w, px(pa[0] + 0.5), py(pa[1] + 0.5) - ts * 1.15, foundR ? `❗ ${q.rule}` : q.rule);
  bubble(c, w, px(pb[0] + 0.5), py(pb[1] + 0.5) - ts * 1.15 - (Math.abs(pa[0] - pb[0]) < 1.6 && Math.abs(pa[1] - pb[1]) < 1.6 ? 28 : 0), foundL ? `❗ ${lt}` : lt);
}
function liveLearn() {
  const q = T[lang].ln; lab.setGlow('rgba(143, 103, 238, .26)');
  let st;
  if (L.phase === 'pick' && L.round === 0) st = q.t0;
  else if (L.phase === 'run') st = q.t1;
  else {
    const info = L.last, lead = L.round <= 3 && !info.learned ? q.learning(L.round) : L.chL < L.chR ? q.learned(info.fav + 1) : L.chL === L.chR ? q.same : q.fooled;
    st = [q.t2(L.chR, L.chL), lead];
  }
  lab.setState({ emo: '🧠', title: st[0], lead: st[1], body: '', extra: '' });
  const avg = (s) => (L.round ? dec(Math.round(s / L.round * 10) / 10) : '–');
  lab.setReadout(String(L.round), q.sub, L.round ? q.pill(avg(L.sumR), avg(L.sumL)) : '', '#8f67ee');
  lab.setFacts([T[lang].facts.arcade]);
}

// --- views, input, one render ------------------------------------------------------------------------------
function enterView(v) {
  S.sec = null;
  if (v === 'rules') { if (R.ans === null) initPredict(); else resetRulesScene(); }
  else if (v === 'guess') { if (!Gm.order.length) newGame(); }
  else if (v === 'fair') initFair();
  render();
}
function render() {
  const v = lab.view, t = T[lang];
  document.body.dataset.v = v;
  $('gaRules').hidden = v !== 'rules'; $('gaGuess').hidden = v !== 'guess'; $('gaFair').hidden = v !== 'fair';
  if (v === 'rules') renderRules(t); else if (v === 'guess') renderGuess(t); else renderFair(t);
}
function padMove(dx, dy) {
  const v = lab.view;
  if (v === 'rules' && !S.sec && R.ans !== null) { if (P.a >= 0.6 && !R.pc) { R.queue = []; if (!walkPlayer(P.x + dx, P.y + dy)) sfx.tick(); } }
  else if (v === 'guess') guessStep(dx, dy);
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'pad') { padMove(+b.dataset.dx, +b.dataset.dy); return; }
  if (a === 'rp') answerRules(+b.dataset.i);
  else if (a === 'tg') { R.on[id] = !R.on[id]; sfx.click(); }
  else if (a === 'up' || a === 'dn') {
    const i = R.order.indexOf(id), j = i + (a === 'up' ? -1 : 1);
    if (j < 0 || j > 2) return;
    [R.order[i], R.order[j]] = [R.order[j], R.order[i]]; sfx.snap();
  } else if (a === 'reset') { R.caught = 0; resetRulesScene(); sfx.click(); }
  else if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) { secret.open(); return; }
    S.sec = S.sec === k ? null : k; sfx.click();
    if (S.sec === 'path') initPath(); else if (S.sec === 'learn') initLearn(); else resetRulesScene();
  } else if (a === 'arun') { runPath(); sfx.click(); }
  else if (a === 'hide') pickBush(+b.dataset.k);
  else if (a === 'gready') { Gm.phase = 'predict'; sfx.click(); }
  else if (a === 'gname') {
    const r = b.dataset.r;
    if (r === Gm.rule) { Gm.phase = 'solved'; if (!Gm.wrong.length) Gm.firstTry++; sfx.good(); } else { Gm.wrong.push(r); sfx.bad(); }
  } else if (a === 'gnext') { Gm.round++; if (Gm.round >= 4) Gm.phase = 'end'; else startRound(); sfx.click(); }
  else if (a === 'gagain') { newGame(); sfx.click(); }
  else if (a === 'fp') answerFair(+b.dataset.i);
  else if (a === 'fxray') { F.xray = !F.xray; F.seed = 0; newSim(); sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'fsSpeed') F.si = clamp(+ev.target.value, 0, 4);
  else if (ev.target.id === 'fsVis') F.vis = clamp(+ev.target.value, 1, 6);
  else return;
  F.seed = 0; newSim(); sfx.tick(); render();
});
$('cv').addEventListener('click', (ev) => {
  const r = $('cv').getBoundingClientRect(), gx = Math.floor((ev.clientX - r.left - LY.ox) / LY.ts), gy = Math.floor((ev.clientY - r.top - LY.oy) / LY.ts);
  if (gx < 0 || gy < 0 || gx >= N || gy >= N) return;
  const v = lab.view;
  if (v === 'rules' && S.sec === 'path') {
    if (!isFloor(gx, gy) || (gx === PGUARD[0] && gy === PGUARD[1])) return;
    A.target = [gx, gy]; initPath(); sfx.click(); render();
  } else if (v === 'rules' && S.sec === 'learn') {
    const k = BUSH.findIndex(([x, y]) => x === gx && y === gy); if (k >= 0) pickBush(k);
  } else if (v === 'rules' && R.ans !== null && !R.pc) {
    if (!isFloor(gx, gy) || (gx === P.x && gy === P.y)) return;
    R.queue = pathTo(P.x, P.y, idx(gx, gy)).slice(1); sfx.tick();
  } else if (v === 'guess') guessTile(gx, gy);
});
addEventListener('keydown', (ev) => {
  const m = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[ev.key];
  if (!m || ev.target.closest?.('input, textarea, select') || $('secret').classList.contains('open')) return;
  if (lab.view === 'guess' || (lab.view === 'rules' && !S.sec)) { ev.preventDefault(); padMove(m[0], m[1]); }
});

canvasLoop($('cv'), (c, w, h, dt, time) => {
  layout(w, h);
  for (const e of [P, G, QP, QG, FP, FG, LA, LB]) advance(e, dt);
  const v = lab.view, t = T[lang];
  if (v === 'rules') { if (S.sec === 'path') updPath(dt); else if (S.sec === 'learn') updLearn(dt); else updRules(dt); }
  else if (v === 'fair') updFair(dt);
  c.drawImage(bg(w, h), 0, 0, w, h);
  if (v === 'rules') { if (S.sec === 'path') drawPath(c, w, h, t, time); else if (S.sec === 'learn') drawLearn(c, w, h, t, time); else drawRules(c, w, h, t, time); }
  else if (v === 'guess') drawGuess(c, w, h, t, time);
  else drawFair(c, w, h, t, time);
});
initPredict();
render();
</script>
