function tapSlot(i) {

  if (S.placed[i]) { S.detail = i; S.note = null; sfx.tick(); }
  else if (S.sel === null) { S.note = { type: 'first' }; sfx.tick(); }
  else if (S.sel === i) { S.placed[i] = true; S.popAt[i] = now(); S.boost = 1; S.detail = i; S.note = null; S.sel = null; sfx.good(); showStage(); }
  else { S.shake = { i, t0: now() }; S.note = { type: 'wrong', dir: S.sel > i ? 'later' : 'earlier' }; sfx.bad(); }
  render();
}

function showStage() {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'p1') {
    S.p1 = b.dataset.k; S.placed[0] = true; S.popAt[0] = now(); S.boost = 1; (S.p1 === 'ussr' ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'card') { S.sel = S.sel === i ? null : i; S.note = null; S.detail = null; sfx.click(); }
  else if (act === 'again1') { S.placed = [true, false, false, false, false, false]; S.sel = null; S.note = null; S.detail = null; sfx.click(); }
  else if (act === 'g2' || act === 'g3') { S[act === 'g2' ? 'v2' : 'v3'][i] = b.dataset.v; sfx.click(); }
  else if (act === 'check2') { S.v2done = true; const k = S.v2.filter((g, j) => g === TRUTH2[j]).length; (k === 4 ? sfx.good : sfx.snap)(); showStage(); }
  else if (act === 'check3') { S.v3done = true; const k = S.v3.filter((g, j) => g === TRUTH3[j]).length; (k === 4 ? sfx.good : sfx.snap)(); showStage(); }
  else if (act === 'again2') { S.v2 = [null, null, null, null]; S.v2done = false; sfx.click(); }
  else if (act === 'again3') { S.v3 = [null, null, null, null]; S.v3done = false; sfx.click(); }
  else if (act === 'goto2') { $('views').querySelector('[data-view="where"]')?.click(); return; }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { S.sec = k; S.st = 0; S.play = true; S.secKey = ''; $('secR').max = SECMAX[k]; $('secR').step = k === 'a' ? 1 : 0.25; }
    sfx.click();
  } else if (act === 'play') { S.play = !S.play; sfx.tick(); }
  render();
});
$('secR').addEventListener('input', () => { S.st = +$('secR').value; S.play = false; syncSec(true); $('csPlay').textContent = '▶'; });

// --- one render per change: controls, readout and the state card -------------------------------------------------
function rows(key, names, guesses, done, truth, lp, lr) {
  return `<div class="sr-rows">${names.map((nm, i) => {
    const g = guesses[i], ok = done && g === truth[i];
    const cls = (v) => `sr-pick${g === v ? ' on' : ''}${done ? (truth[i] === v ? ' good' : g === v ? ' bad' : '') : ''}`;
    return `<div class="sr-row"><div class="nm">${done ? (ok ? '✓ ' : '✗ ') : ''}${esc(nm)}</div>
      <button class="${cls('p')}" data-act="${key}" data-i="${i}" data-v="p"${done ? ' disabled' : ''}>${esc(lp)}</button>
      <button class="${cls('r')}" data-act="${key}" data-i="${i}" data-v="r"${done ? ' disabled' : ''}>${esc(lr)}</button></div>`;
  }).join('')}</div>`;
}
function render() {
  const t = T[lang], v = lab.view, sec = !!S.sec;
  document.body.dataset.v = v;
  $('c1').hidden = sec || v !== 'order'; $('c2').hidden = sec || v !== 'where'; $('c3').hidden = sec || v !== 'now';
  $('cs').hidden = !sec;
  const open = secret.unlocked();
  $('secChips').innerHTML = ['a', 'b'].map((k, j) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${['⏱️', '🔁'][j]} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec) return renderSecret(t);
  if (v === 'order') renderOrder(t); else if (v === 'where') renderWhere(t); else renderNow(t);
}
function renderSecret(t) {
  const a = S.sec === 'a', x = a ? t.sa : t.sb;
  $('csLab').textContent = x.lab; $('csPlay').textContent = S.play ? '⏸' : '▶'; $('secR').value = S.st;
  syncSec(true); lab.setGlow(a ? 'rgba(255,170,90,.24)' : 'rgba(80,170,255,.26)');
  lab.setState({ emo: a ? '⏱️' : '🔁', title: x.t, lead: x.l, body: x.b });
  lab.setFacts(a ? t.factsA : t.factsB);
}
function renderOrder(t) {
  lab.setGlow('rgba(255,150,80,.24)');
  const n = S.placed.filter(Boolean).length, all = n === 6;
  if (S.p1 === null) {
    $('c1').innerHTML = `<div class="sr-q">${esc(t.q1)}</div><div class="sr-opts">${[['usa', t.o1[0]], ['ussr', t.o1[1]]].map(([k, l]) => `<button class="sr-opt" data-act="p1" data-k="${k}">${esc(l)}</button>`).join('')}</div>`;
    lab.setReadout('?', '', '', '#ffb25c'); lab.setFacts([]);
    lab.setState({ emo: '🛰️', title: t.q1, lead: t.p1lead, body: '' });
    return;
  }
  const left = [1, 2, 3, 4, 5].filter((i) => !S.placed[i]);
  $('c1').innerHTML = all
    ? `<button class="sr-opt" data-act="again1" style="width:100%">↻ ${esc(t.again)}</button>`
    : `<div class="sr-lbl">${esc(t.tray)}</div><div class="sr-cards">${left.map((i) => `<button class="sr-card${S.sel === i ? ' on' : ''}" data-act="card" data-i="${i}"><span class="ic">${ICONS[i]}</span><span><b>${esc(t.ev[i].n)}</b><small>${esc(t.ev[i].c)}</small></span></button>`).join('')}</div>`;
  lab.setReadout(`${n}/6`, t.onRocket, '', '#ffb25c');
  const facts = [t.f1[0]]; if (S.placed[3]) facts.push(t.f1[1]); if (S.placed[4]) facts.push(t.f1[2]);
  lab.setFacts(facts);
  const nt = S.note, ev = (i) => t.ev[i];
  let st;
  if (nt && nt.type === 'wrong') st = { emo: '🤔', title: t.nope, lead: nt.dir === 'later' ? t.goLater : t.goEarlier, body: S.sel !== null ? `${ev(S.sel).n}: ${ev(S.sel).c}` : '' };
  else if (nt && nt.type === 'first') st = { emo: '👆', title: t.pickFirst, lead: t.v1how, body: '' };
  else if (S.sel !== null) st = { emo: ICONS[S.sel], title: ev(S.sel).n, lead: t.pick, body: ev(S.sel).c };
  else if (S.detail !== null) { const i = S.detail; st = { emo: ICONS[i], title: i === 0 ? `${S.p1 === 'ussr' ? t.v1ok : t.v1no} ${ev(i).n}` : ev(i).n, lead: `${YEARS[i]} · ${t.tags[i]}`, body: ev(i).d }; }
  else if (all) st = { emo: '🏆', title: t.done, lead: t.doneLead, body: t.doneBody };
  else st = { emo: S.p1 === 'ussr' ? '✅' : '🛰️', title: S.p1 === 'ussr' ? t.v1ok : t.v1no, lead: t.v1lead, body: t.v1how };
  lab.setState(st);
}
function renderWhere(t) {
  lab.setGlow('rgba(110,170,255,.26)');
  const g = S.v2, set = g.filter(Boolean).length, done = S.v2done, k = g.filter((x, i) => x === TRUTH2[i]).length;
  $('c2').innerHTML = `<div class="sr-q">${esc(t.q2)}</div>${rows('g2', t.tg2, g, done, TRUTH2, t.bP, t.bR)}
    <div class="sr-go">${done ? `<button class="btn ghost" data-act="again2">↻ ${esc(t.again)}</button>` : `<button class="btn" data-act="check2"${set < 4 ? ' disabled' : ''}>${esc(t.check)}</button>`}</div>`;
  if (!done) {
    lab.setReadout(`${set}/4`, t.guesses, '', '#7fb3ff'); lab.setFacts([]);
    lab.setState({ emo: '🌍', title: t.w0t, lead: t.w0, body: '' });
    return;
  }
  lab.setReadout(`${k}/4`, t.rightSub, '', '#7fb3ff'); lab.setFacts(t.f2);
  lab.setState({ emo: '🤖', title: t.w1t, lead: `${k === 4 ? t.right + ' ' : t.res(k) + ' '}${t.w1l}`, body: '', extra: `<div class="sr-ex">${t.tg2.map((nm, i) => `<div><b>${esc(nm)}.</b> ${esc(t.det2[i])}</div>`).join('')}</div>` });
}
function renderNow(t) {
  lab.setGlow('rgba(120,220,200,.24)');
  if (!S.v2done) {
    $('c3').innerHTML = `<div class="sr-lock"><p>${esc(t.gateL)}</p><button class="btn" data-act="goto2">${esc(t.gateB)} →</button></div>`;
    lab.setReadout('🔒', '', '', '#8fe0c8'); lab.setFacts([]);
    lab.setState({ emo: '🔒', title: t.gateT, lead: t.gateL, body: '' });
    return;
  }
  const g = S.v3, set = g.filter(Boolean).length, done = S.v3done, k = g.filter((x, i) => x === TRUTH3[i]).length;
  $('c3').innerHTML = `<div class="sr-q">${esc(t.q3)}</div>${rows('g3', t.tg3, g, done, TRUTH3, t.bP3, t.bR3)}
    <div class="sr-go">${done ? `<button class="btn ghost" data-act="again3">↻ ${esc(t.again)}</button>` : `<button class="btn" data-act="check3"${set < 4 ? ' disabled' : ''}>${esc(t.check)}</button>`}</div>`;
  if (!done) {
    lab.setReadout(`${set}/4`, t.guesses, '', '#8fe0c8'); lab.setFacts([]);
    lab.setState({ emo: '🛰️', title: t.n0t, lead: t.n0, body: '' });
    return;
  }
  lab.setReadout(`${k}/4`, t.rightSub, '', '#8fe0c8'); lab.setFacts(t.f3);
  lab.setState({ emo: '🚀', title: t.n1t, lead: `${k === 4 ? t.right + ' ' : t.res(k) + ' '}${t.n1l}`, body: '', extra: `<div class="sr-ex">${t.tg3.map((nm, i) => `<div><b>${esc(nm)}.</b> ${esc(t.det3[i])}</div>`).join('')}<div>${esc(t.artemis)}</div></div>` });
}
render();
</script>
</body>
</html>
