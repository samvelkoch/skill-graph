  c.bezierCurveTo(tx + 4 * u, sh * 0.25, tx + 6 * u, sh * 0.4, tx + 8 * u, sh * 0.6); c.closePath(); c.fill();
  c.strokeStyle = '#4a3a2d'; c.lineWidth = 3.4 * u; c.beginPath(); c.moveTo(tx - 1 * u, sh * 0.2); c.quadraticCurveTo(tx - w * 0.06, sh * 0.2, tx - w * 0.11, sh * 0.15); c.stroke();
  c.lineWidth = 2.4 * u; c.beginPath(); c.moveTo(tx - 6 * u, sh * 0.2); c.quadraticCurveTo(tx - w * 0.1, sh * 0.19, tx - w * 0.14, sh * 0.23); c.stroke();

  c.restore();

  // mud and pebbles

  g = c.createLinearGradient(0, sh - 20 * u, 0, sh); g.addColorStop(0, '#3a4a40'); g.addColorStop(1, '#1b2622'); c.fillStyle = g; c.fill();

    c.fillStyle = g; c.beginPath(); c.arc(x, y, Math.max(0, 2.6 * u), 0, TAU); c.fill();
    c.strokeStyle = 'rgba(160,230,140,.5)'; c.lineWidth = 0.8 * u; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x - 2 * u, y + 2 * u, x - 4 * u + Math.sin(time * 3 + ph) * u, y + 4 * u); c.stroke();
    const k = st.n[0] - i; if (k > 0) dot(c, x, y, 1.3 * u, Math.min(1, k));
  }

  // small fish

    const pull = Math.sin(Math.PI * sp[1]) * (PX - fx * w) * 0.45;

  });

  const bigPos = BIG.map(([fx, fy, d], i) => {
    const tgt = smallPos[i * 2], pull = Math.sin(Math.PI * sp[2]) * (tgt[0] - fx * w) * 0.5, pullY = Math.sin(Math.PI * sp[2]) * (tgt[1] - fy * sh) * 0.5;

// --- view 2 chart ----------------------------------------------------------------------------------------------
function drawCurveChart(c, w, y0, h, t, time) {
  c.fillStyle = '#0c1322'; c.fillRect(0, y0, w, h);
  const g = c.createLinearGradient(0, y0, 0, y0 + 8); g.addColorStop(0, 'rgba(0,0,0,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, y0, w, 8);
  const L = 14, R = w - 14, T0 = y0 + 30, B = y0 + h - 24, X = (yr) => L + (R - L) * yr / 20, Y = (f) => B - (B - T0) * f;
  c.save(); c.font = `700 12px ${FONT}`; c.textBaseline = 'middle'; c.fillStyle = '#c6cde0'; c.textAlign = 'left'; c.fillText(t.c2.ylab, L, y0 + 16);

    c.beginPath(); for (let i = 0; i <= 80; i++) { const yr = 20 * i / 80; if (yr > upto) break; const f = lvl(type, 3, yr) / 100; const px = X(yr), py = Y(f); if (i === 0) c.moveTo(px, py); else c.lineTo(px, py); }

  };

  // the other poison's curve, once guessed

  // the guess, dashed
  c.save(); c.setLineDash([5, 5]); c.strokeStyle = '#ffd27a'; c.lineWidth = 2; c.beginPath();
  for (let i = 0; i <= 60; i++) { const x = i / 60, px = X(20 * x), py = Y(SHAPES[guess](x)); if (i === 0) c.moveTo(px, py); else c.lineTo(px, py); } c.stroke(); c.restore();
  const col = S.type === 'stay' ? '#ff5a4f' : '#4fd1c5';
  trace(S.type, S.years, col, 3.4);
  const f = lvl(S.type, 3, S.years) / 100, px = X(S.years), py = Y(f);

  c.save(); c.font = `700 12px ${FONT}`; c.textBaseline = 'middle'; c.textAlign = 'left';
  const lx = Math.max(L, R - 150); c.fillStyle = '#ffd27a'; c.fillRect(lx, y0 + 12, 14, 3); c.fillStyle = '#c6cde0'; c.fillText(t.c2.mine, lx + 19, y0 + 13);
  c.fillStyle = col; c.fillRect(lx, y0 + 26, 14, 3); c.fillStyle = '#c6cde0'; c.fillText(t.c2.model, lx + 19, y0 + 27);
  c.restore();
}

// --- view 3: eagles, eggs and the timeline --------------------------------------------------------------------

    const yr = Math.round(S.years), val = Math.round(lvl(type, 3, S.years)), ok = g === TRUE_SHAPE[type];
    lab.setReadout(String(val), c2.sub(yr), c2.pill[type], type === 'stay' ? '#ff5a4f' : '#4fd1c5');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? c2.ok : c2.no, lead: c2.lead[type], body: c2.body, extra: '' });
    lab.setFacts(t.facts.v2);
  } else {
    const c3 = t.c3, placed = S.ev.filter((y) => y !== null).length;
    lab.setGlow('rgba(255,196,80,.2)');
    if (!S.seen) { lab.setReadout('?', '', '', '#ffc450'); lab.setState({ emo: '🔒', title: t.c2.gateT, lead: t.c2.gateL, body: '', extra: '' }); lab.setFacts([]); return; }
    if (!S.checked) { lab.setReadout(`${placed}/3`, c3.sub(placed), '', '#ffc450'); lab.setState({ emo: '🧩', title: c3.stT, lead: c3.stL, body: c3.stB, extra: `<div class="fine">${esc(c3.fine)}</div>` }); lab.setFacts(t.facts.v3a); return; }
    const k = S.ev.filter((y, i) => Math.abs(y - EVY[i]) <= TOL).length;
    lab.setReadout(`${k}/3`, c3.sub(3), '', '#ffc450');
    lab.setState({ emo: k === 3 ? '✅' : '🤔', title: c3.res(k), lead: c3.resL, body: c3.resB(EVY), extra: `<div class="fine">${esc(c3.fine)}</div>` });
    lab.setFacts([...t.facts.v3a, ...t.facts.v3b]);
  }
}

// --- events ---------------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a === 'g1') { S.g1 = +k; S.p = 0; S.playing = true; sfx.click(); showStage(); render(); }
  else if (a === 'replay') { S.p = 0; S.playing = true; S.sec = null; sfx.click(); render(); }
  else if (a === 'sec') { if (!secret.unlocked()) { secret.open(); return; } S.sec = S.sec === k ? null : k; secOpenT = performance.now() / 1000; sfx.click(); showStage(); render(); }
  else if (a === 'type') { S.type = k; S.years = 0; S.play2 = S.g2[k] !== null; sfx.click(); render(); }
  else if (a === 'g2') { S.g2[S.type] = +k; S.years = 0; S.play2 = true; (+k === TRUE_SHAPE[S.type] ? sfx.good : sfx.bad)(); showStage(); render(); }
  else if (a === 'play2') { S.years = 0; S.play2 = true; sfx.click(); }
  else if (a === 'go1') { document.querySelector('#views [data-view="chain"]')?.click(); }
  else if (a === 'ev') { if (S.checked) return; S.sel = +k; sfx.tick(); render(); }
  else if (a === 'check') { S.checked = true; const k3 = S.ev.filter((y, i) => Math.abs(y - EVY[i]) <= TOL).length; (k3 === 3 ? sfx.good : sfx.bad)(); render(); showStage(); }
  else if (a === 'again3') { S.ev = [null, null, null]; S.sel = 0; S.checked = false; sfx.click(); render(); }
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'rng1') { S.p = +ev.target.value / 100; S.playing = false; }
  else if (ev.target.id === 'rng2') { S.years = +ev.target.value / 5; S.play2 = false; }
});
$('cv').addEventListener('pointerup', (ev) => {
  if (lab.view !== 'ddt' || S.checked || !S.seen) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (y < 50 || y > r.height - 40) return;
  const L = 18, R = r.width - 18, yr = Math.round(clamp(Y0 + (x - L) / (R - L) * (Y1 - Y0), Y0, Y1));
  S.ev[S.sel] = yr; sfx.snap();
  const next = S.ev.findIndex((v) => v === null); if (next >= 0) S.sel = next;
  render();
});
render();
</script>
