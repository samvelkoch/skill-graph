  c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(AD.x0 + w * .75, AD.y0 + 70, 62, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.arc(AD.x0 + 30, AD.y1 - 90, 48, 0, 7); c.fill();
  const u = 27, cxm = (AD.x0 + AD.x1) / 2, fy = AD.y1 - 16;
  const model = { kind: 'adult', u, x: cxm, fy, skin: SKIN[1], hair: { style: 'long', color: '#3b2a22' }, wf: 1, wa: lerp(1, .76, e), legs: lerp(1, 1.16, e), freckle: 1 - e, gloss: e,
    mouth: 'smile', look: 0, arms: [[.2, .12], [.2, .12]], outfit: { type: 'tee', top: '#e86a92', bottom: '#3c4f80', bottomType: 'trousers' } };
  if (S.g3 !== null && e < .985) {
    // markers of the real waist and the real height
    const topR = fy - u * 7, g0 = { sy: topR + u * 1.12, hy: topR + u * 3.5 }, wyR = g0.sy + (g0.hy - g0.sy) * .55, wR = u * .52;
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.4; c.setLineDash([4, 3]);
    c.beginPath(); c.moveTo(cxm - wR, wyR - 14); c.lineTo(cxm - wR, wyR + 14); c.moveTo(cxm + wR, wyR - 14); c.lineTo(cxm + wR, wyR + 14); c.stroke();
    c.beginPath(); c.moveTo(AD.x0 + 8, topR); c.lineTo(AD.x1 - 8, topR); c.stroke(); c.setLineDash([]);
  }
  person(c, model);
  c.restore();
  if (S.g3 !== null && e < .985) {
    const topR = fy - u * 7, wyR = topR + u * 1.12 + (u * 3.5 - u * 1.12) * .55;
    pill(c, T_.realH, AD.x0 + 52, topR - 11, { px: 12.5 }); pill(c, T_.realW, AD.x0 + 52, wyR, { px: 12.5, fg: '#fff' });
  }
  pill(c, T_.ad, AD.x0 + 34, AD.y0 + 18, { bg: '#e86a92', px: 12.5 });
}

// --- secrets ---------------------------------------------------------------------------------------------------
function drawPants(c, t, T_) {
  c.fillStyle = vgrad(c, -300, 420, [[0, '#17323a'], [1, '#1f4a52']]); c.fillRect(-900, -300, 2160, 800);
  const L = 'PANTS', tw = 60, gap = 6, x0 = (DW - (tw * 5 + gap * 4)) / 2;
  for (let k = 0; k < 5; k++) {
    const on = S.pl === k, x = x0 + k * (tw + gap), y = 30 + (on ? -6 : 0);
    c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
    c.fillStyle = on ? vgrad(c, y, y + 70, [[0, '#ffe48c'], [1, '#f5c84c']]) : vgrad(c, y, y + 70, [[0, '#3f7f88'], [1, '#2b5c64']]); rrect(c, x, y, tw, 70, 12); c.fill(); c.restore();
    c.fillStyle = on ? '#3a2a00' : '#e6f5f6'; c.font = '900 40px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(L[k], x + tw / 2, y + 37);
  }
  const k = S.pl, ap = ease(c01((t - S.td) / .35));
  c.save(); c.translate(0, (1 - ap) * 10); c.globalAlpha = ap;
  c.fillStyle = 'rgba(255,255,255,.08)'; c.strokeStyle = 'rgba(255,228,140,.5)'; c.lineWidth = 1.5; rrect(c, 20, 124, 320, 190, 18); c.fill(); c.stroke();
  c.fillStyle = '#ffe48c'; c.font = '900 64px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(L[k], 180, 168);
  let px = 24; c.font = `800 ${px}px Nunito, sans-serif`; let lines = wrapText(c, T_.pants[k], 280);
  while (lines.length * px * 1.25 > 110 && px > 14) { px -= 1; c.font = `800 ${px}px Nunito, sans-serif`; lines = wrapText(c, T_.pants[k], 280); }
  c.fillStyle = '#fff'; lines.forEach((l, j) => c.fillText(l, 180, 232 + (j - (lines.length - 1) / 2) * px * 1.25)); c.restore();
  const f = fs(12.5); c.font = `700 ${f}px Nunito, sans-serif`; c.fillStyle = '#a9c9cc'; c.textAlign = 'center';
  wrapText(c, T_.pantsNote, 320).forEach((l, j) => c.fillText(l, 180, 340 + j * f * 1.25));
}
function drawDoc(c, t, T_) {
  bgClinic(c);
  const st = S.dst, d = T_.doc, kp = { ...KID(), x: 100, fy: FY, outfit: TEEKID, mouth: 'smile' };
  person(c, { ...MUM(316), mouth: 'smile' });
  person(c, { ...DOCTOR(), x: 222, fy: FY, mouth: 'talk' });
  const k = person(c, kp);
  if (st >= 1) bubble(c, d.say[Math.min(st, 3) - 1], 218, 76, 222, FY - 262 - 4, { w: 200, a: ease(c01((t - S.td) / .3)) });
  if (st >= 4) bubble(c, d.kid, 86, 150, 100, k.top - 4, { w: 150, a: ease(c01((t - S.td) / .3)) });
}

// --- shell ---------------------------------------------------------------------------------------------------------
const lab = shell({ key: 'my-body', T, topics: TOPICS, views: ['private', 'secret', 'image'], onLang: render, onView: () => { S.sec = null; render(); } });
const secret = secretLab('my-body', () => ({
  secrets: [{ emo: '🦖', title: T[lang].secrets.pants[0], desc: T[lang].secrets.pants[1] }, { emo: '🩺', title: T[lang].secrets.doc[0], desc: T[lang].secrets.doc[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="c1"><p class="mb-q" id="q1"></p><div class="mb-ans" id="a1"></div><div class="mb-row" id="r1"></div><div class="mb-row" id="sc1"></div></div>
  <div id="c2"><p class="mb-q" id="q2"></p><div class="mb-ans" id="a2"></div><div class="mb-row" id="r2"></div></div>
  <div id="c3"><p class="mb-q" id="q3"></p><div class="mb-ans" id="a3"></div>
    <div class="mb-sl" id="sl3" hidden><div class="ends"><span id="sl3a"></span><span id="sl3b"></span></div><input id="sl3i" type="range" min="0" max="100" value="100"></div></div>
  <div id="cs"><div class="mb-letters" id="csl"></div><div class="mb-row" id="csr"></div></div>`;

const V_DH = { image: 440 };
function tickEdit() { // after the guess the picture eases from the advert to the real person
  if (S.anim < 0) return;
  const k = c01((clock() - S.anim - .5) / 1.6); S.e = 1 - ease(k); if (k >= 1) S.anim = -1;
  $('sl3i').value = Math.round(S.e * 100); renderImage(T[lang], true);
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  tickEdit();
  const T_ = T[lang], mode = S.sec ? S.sec : lab.view, dh = mode === 'image' ? V_DH.image : 400;
  V.dh = dh; V.s = Math.min(w / DW, h / dh); V.ox = (w - DW * V.s) / 2; V.oy = (h - dh * V.s) / 2;
  c.save(); c.translate(V.ox, V.oy); c.scale(V.s, V.s);
  if (mode === 'pants') drawPants(c, time, T_); else if (mode === 'doc') drawDoc(c, time, T_);
  else if (mode === 'private') drawScene1(c, time, T_); else if (mode === 'secret') drawScene2(c, time, T_); else drawScene3(c, time, T_);
  c.restore();
});

// --- interaction ---------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'image' || S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - V.ox) / V.s, y = (ev.clientY - r.top - V.oy) / V.s;
  FR.forEach((f, k) => { if (Math.abs(x - f.x) < 34 && y > FRY - f.h - 6 && y < FRY + 6) { S.kid = k; S.tk = clock(); sfx.click(); render(); } });
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'g1') { S.g1 = v; S.t1 = clock(); const ok = (v === 'ok') === (S.i1 !== 1); S.sc1[S.i1] = ok; (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'alt') { S.alt = +v; S.t1 = clock(); sfx.click(); }
  else if (act === 'n1') { if (S.i1 >= 3) { S.i1 = 0; S.sc1 = []; } else S.i1++; S.g1 = null; S.alt = 0; sfx.click(); }
  else if (act === 'g2') { const card = T[lang].cards[S.i2], ok = card.kind === v; S.g2 = v; S.t2 = clock(); S.sc2[S.i2] = ok; (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'n2') { if (S.i2 >= 5) { S.i2 = 0; S.sc2 = []; } else S.i2++; S.g2 = null; sfx.click(); }
  else if (act === 'g3') { S.g3 = v; S.t3 = clock(); S.e = 1; S.anim = clock(); (v === 'no' ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = b.dataset.k; S.pl = 0; S.dst = 0; S.td = clock(); sfx.click(); }
  else if (act === 'pl') { S.pl = +v; S.td = clock(); sfx.tick(); }
  else if (act === 'dnext') { S.dst = S.dst >= 4 ? 0 : S.dst + 1; S.td = clock(); sfx.click(); }
  else if (act === 'back') { S.sec = null; sfx.click(); }
  render();
});
$('sl3i').addEventListener('input', (ev) => { S.anim = -1; S.e = +ev.target.value / 100; renderImage(T[lang], true); });

// --- render ------------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = S.sec ? 'secret-' + S.sec : v;
  $('c1').hidden = !!S.sec || v !== 'private'; $('c2').hidden = !!S.sec || v !== 'secret'; $('c3').hidden = !!S.sec || v !== 'image'; $('cs').hidden = !S.sec;
  if (S.sec) renderSecret(t); else if (v === 'private') renderPrivate(t); else if (v === 'secret') renderCards(t); else renderImage(t, false);
  lab.checkStage();
}
const btn = (act, v, label, cls = '') => `<button type="button" data-act="${act}" data-v="${v}" class="${cls}">${esc(label)}</button>`;

function renderPrivate(t) {
  const i = S.i1, end = i >= 3, rev = S.g1 !== null, sc = t.s1[Math.min(i, 2)], k = S.sc1.filter(Boolean).length;
  lab.setGlow('rgba(43, 179, 166, .26)');
  $('a1').hidden = end || rev; $('q1').hidden = end || rev;
  $('q1').textContent = end ? '' : sc.q;
  $('a1').innerHTML = btn('g1', 'ok', t.ok) + btn('g1', 'no', t.no);
  const alt = !end && rev && i === 0 ? `<div class="chips">${sc.alt.map((l, j) => `<button type="button" class="chip ${S.alt === j ? 'on' : ''}" data-act="alt" data-v="${j}">${esc(l)}</button>`).join('')}</div>` : '';
  $('r1').innerHTML = alt + (end || rev ? `<button type="button" class="btn push" data-act="n1">${esc(end ? t.again : t.next)}</button>` : '');
  const open = secret.unlocked(), sb = (key, emo) => `<button type="button" class="chip secret ${open ? 'open' : ''}" data-act="sec" data-k="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('sc1').innerHTML = sb('pants', '🦖') + sb('doc', '🩺');
  if (end) {
    lab.setReadout(`${k}/3`, t.scenesW, '', '#2bb3a6'); lab.setFacts([]);
    lab.setState({ emo: '🏆', title: t.end1(k), lead: t.end1l, body: '', extra: '' });
  } else if (!rev) {
    lab.setReadout(`${i + 1}/3`, t.scenesW, '', '#2bb3a6'); lab.setFacts([]);
    lab.setState({ emo: '🤔', title: sc.q, lead: t.pick, body: '', extra: '' });
  } else {
    const right = S.sc1[i];
    lab.setReadout(`${i + 1}/3`, t.scenesW, right ? '✓' : '', '#2bb3a6');
    lab.setFacts([{ emo: '💡', text: t.f1[i], src: SRC.n }]);
    lab.setState({ emo: right ? '✅' : '🤔', title: `${right ? t.right : t.notq} ${sc.truth}`, lead: sc.why, body: '', extra: '' });
  }
}

function renderCards(t) {
  const i = S.i2, end = i >= 5, rev = S.g2 !== null, card = t.cards[Math.min(i, 4)], k = S.sc2.filter(Boolean).length;
  lab.setGlow('rgba(143, 127, 208, .28)');
  $('q2').hidden = end || rev; $('a2').hidden = end || rev;
  $('q2').textContent = t.cq;
  $('a2').innerHTML = btn('g2', 's', t.btnS) + btn('g2', 't', t.btnT);
  $('r2').innerHTML = end || rev ? `<button type="button" class="btn push" data-act="n2">${esc(end ? t.again : t.next)}</button>` : '';
  if (end) {
    lab.setReadout(`${k}/5`, t.cardsW, '', '#8f7fd0'); lab.setFacts(t.f2.map((x) => ({ emo: '💡', text: x, src: SRC.n })));
    lab.setState({ emo: '🎁', title: t.end2, lead: t.end2l, body: '', extra: '' });
  } else if (!rev) {
    lab.setReadout(`${i + 1}/5`, t.cardsW, '', '#8f7fd0'); lab.setFacts([]);
    lab.setState({ emo: '🃏', title: t.cq, lead: card.t, body: '', extra: '' });
  } else {
    const right = S.sc2[i];
    lab.setReadout(`${i + 1}/5`, t.cardsW, right ? '✓' : '', '#8f7fd0'); lab.setFacts([]);
    lab.setState({ emo: right ? '✅' : '🤔', title: `${right ? t.right : t.notq} ${card.kind === 's' ? t.isS : t.isT}`, lead: card.why, body: '', extra: '' });
  }
}

function renderImage(t, fromSlider) {
  const pre = S.g3 === null, e = pre ? 1 : S.e;
  if (!fromSlider) {
    lab.setGlow('rgba(232, 106, 146, .26)');
    $('q3').hidden = !pre; $('a3').hidden = !pre; $('q3').textContent = t.imgQ;
    $('a3').innerHTML = btn('g3', 'yes', t.imgYes) + btn('g3', 'no', t.imgNo);
    $('sl3').hidden = pre; $('sl3a').textContent = pre ? '' : t.sl[0]; $('sl3b').textContent = pre ? '' : t.sl[1]; if (pre) $('sl3i').removeAttribute('aria-label'); else $('sl3i').setAttribute('aria-label', t.slAria);
    if (!pre && +$('sl3i').value !== Math.round(S.e * 100)) $('sl3i').value = Math.round(S.e * 100);
  }
  if (pre) {
    lab.setReadout('?', '', '', '#e86a92'); lab.setFacts([]);
    lab.setState({ emo: S.kid >= 0 ? '😊' : '🧒', title: S.kid >= 0 ? t.kids[S.kid] : t.imgIntro[0], lead: t.imgIntro[1], body: '', extra: '' });
  } else {
    lab.setReadout(e < .08 ? t.sl[0] : e > .92 ? t.sl[1] : `${Math.round(e * 100)}%`, t.ed(e), '', '#e86a92');
    lab.setFacts([{ emo: '🖼️', text: t.f3[0], src: SRC.p }, { emo: '🇳🇴', text: t.f3[1], src: SRC.p }, { emo: '💪', text: t.f3[2], src: SRC.b }]);
    lab.setState({ emo: S.g3 === 'no' ? '✅' : '🤔', title: S.g3 === 'no' ? t.imgRight : t.imgNotq, lead: t.imgLead, body: t.imgPoint, extra: '' });
  }
}

function renderSecret(t) {
  const back = `<button type="button" class="btn ghost" data-act="back">${esc(t.back)}</button>`;
  lab.setGlow('rgba(255, 214, 102, .26)');
  if (S.sec === 'pants') {
    $('csl').innerHTML = ['P', 'A', 'N', 'T', 'S'].map((l, k) => `<button type="button" class="chip ${S.pl === k ? 'on' : ''}" data-act="pl" data-v="${k}" aria-label="${esc(t.pants[k])}">${l}</button>`).join('');
    $('csr').innerHTML = back;
    lab.setReadout('PANTS', `${S.pl + 1}/5`, '', '#ffd166'); lab.setFacts([{ emo: '🦖', text: t.f1[0], src: SRC.n }]);
    lab.setState({ emo: '🦖', title: t.pants[S.pl], lead: t.pantsNote, body: '', extra: '' });
  } else {
    const d = t.doc, st = S.dst;
    $('csl').innerHTML = d.chips.map((l, k) => `<span class="chip ${st > k ? 'on' : ''}">${esc(l)}</span>`).join('');
    $('csr').innerHTML = back + `<button type="button" class="btn push" data-act="dnext">${esc(st >= 4 ? t.again : t.next)}</button>`;
    lab.setReadout(`${Math.min(st, 3)}/3`, '', '', '#ffd166'); lab.setFacts(st >= 4 ? [{ emo: '🩺', text: t.f1[2], src: SRC.n }] : []);
    lab.setState(st === 0 ? { emo: '🩺', title: d.lead, lead: '', body: '', extra: '' }
      : st < 4 ? { emo: '🩺', title: d.title[st - 1], lead: d.say[st - 1], body: '', extra: '' }
      : { emo: '✅', title: d.rule, lead: d.ruleL, body: '', extra: '' });
  }
}
render();
</script>
