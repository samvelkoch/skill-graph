  $('bQ').innerHTML = q ? `<div class="pt-q">${esc(q.id === 'li' ? t.qLi : t.qNa)}</div>${optsHTML(t.buildOpts, 'bopt', 1, q.state === 'done' ? q.pick : null)}${
    q.state === 'done' ? `<div class="pt-verdict ${q.pick === 1 ? 'ok' : 'no'}">${esc(q.pick === 1 ? t.right : t.notQuite)}</div><div class="pt-ex">${esc(t.exBuild)}</div>` : ''}` : '';
  lab.setReadout(`${esc(t.names[z - 1])} · ${SYM[z - 1]}`, t.sub(z, sh), open ? '' : t.outer(n), '#5ab0ff');
  const st = !open && S.maxZ >= 3 ? t.state.buildRow : t.state.build0;
  lab.setState({ emo: '⚛️', title: st[0], lead: st[1], body: '', extra: fineHTML(t) });
}

function renderFamily(t) {
  const F = S.fam, all3 = F.shown.Li && F.shown.Na && F.shown.K, asking = all3 && !F.rbDone && !F.piece, busy = !!F.piece;
  lab.setGlow('rgba(242, 132, 58, .26)');
  $('fLbl1').textContent = t.lblMetals; $('fLbl2').textContent = t.lblGases;
  const metals = ['Li', 'Na', 'K'].concat(F.rbDone ? ['Rb'] : []);
  $('fMetals').innerHTML = metals.map((m) => `<button class="chip pt-el" data-act="drop" data-s="${m}"${busy || asking ? ' disabled' : ''}>${m}</button>`).join('');
  $('fGases').innerHTML = ['He', 'Ne', 'Ar'].map((m) => `<button class="chip pt-el" data-act="gas" data-s="${m}">${m}</button>`).join('');
  $('fQ').innerHTML = asking ? `<div class="pt-q">${esc(t.qRb)}</div>${optsHTML(t.rbOpts, 'ropt', 2, null)}`
    : F.rbDone && F.rbPick != null ? `${optsHTML(t.rbOpts, 'none', 2, F.rbPick).replace(/<div class="pt-opts">/, `<div class="pt-q" style="font-size:15px">${esc(t.qRb)}</div><div class="pt-opts">`)}<div class="pt-verdict ${F.rbPick === 2 ? 'ok' : 'no'}">${esc(F.rbPick === 2 ? t.right : t.notQuite)}</div><div class="pt-ex">${esc(t.exRb)}</div>` : '';
  // readout
  const last = F.last, gas = F.gasLast, dots = (n) => '●'.repeat(n) + '○'.repeat(4 - n);
  if (last) {
    const z = last === 'Rb' ? 21 : SYM.indexOf(last) + 1;
    lab.setReadout(`${esc(t.names[z - 1])} · ${last}`, `${t.outerLbl}: 1`, `${t.react} ${dots(METAL[last].lv)}`, '#f2843a');
  } else if (gas) {
    const z = SYM.indexOf(gas) + 1;
    lab.setReadout(`${esc(t.names[z - 1])} · ${gas}`, `${t.outerLbl}: ${gas === 'He' ? 2 : 8}`, `${t.react} ${dots(0)}`, '#8b5cf6');
  } else lab.setReadout('Li · Na · K', '', '', '#f2843a');
  let st = { emo: '🧪', title: t.state.family0[0], lead: t.state.family0[1] };
  if (gas && !last) st = { emo: '💨', title: t.names[SYM.indexOf(gas)], lead: t.noble };
  else if (F.rbDone && F.rbPick != null && last === 'Rb') st = { emo: F.rbPick === 2 ? '✅' : '🤔', title: F.rbPick === 2 ? t.right : t.notQuite, lead: t.exRb };
  lab.setState({ ...st, body: '', extra: '' });
}

function renderGaps(t) {
  const G = S.g, e = G.sealed ? now() - G.sealAt : -1, revealed = G.sealed && e >= TIMES.verdict, ok = Math.abs(G.v - REAL) <= 0.6;
  lab.setGlow('rgba(217, 164, 65, .24)');
  ov.innerHTML = gapsHTML(t);
  $('gPre').style.display = G.sealed ? 'none' : '';
  $('gQ').textContent = t.qDensity; $('gSeal').textContent = t.seal;
  $('gEnd0').textContent = `2 ${t.unit}`; $('gEnd1').textContent = `8 ${t.unit}`;
  $('gV').textContent = `${fmt(G.v, 1)} ${t.unit}`; $('gRange').value = G.v;
  let msg = '';
  if (revealed) {
    const sw = G.swap;
    msg += `<div class="pt-verdict ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.closeGap)}</div>`;
    msg += `<div class="pt-sep"><div class="pt-q">${esc(t.qSwap)}</div>${optsHTML(t.swapOpts, 'swap', 1, sw ? sw.pick : null)}</div>`;
    if (sw) msg += `<div class="pt-verdict ${sw.pick === 1 ? 'ok' : 'no'}">${esc(sw.pick === 1 ? t.right : t.notQuite)}</div><div class="pt-ex">${esc(t.exSwap)}</div>`;
    msg += `<div class="pt-btns" style="margin-top:12px"><button class="btn ghost" data-act="again">${esc(t.again)}</button></div>`;
  }
  $('gMsg').innerHTML = msg;
  lab.setReadout(`${fmt(G.v, 1)} ${esc(t.unit)}`, t.ekaAl, e >= TIMES.pin2 ? `Ga ${fmt(REAL, 2)}` : '', '#d9a441');
  let st = { emo: '📜', title: t.state.gaps0[0], lead: t.state.gaps0[1] };
  if (G.swap) st = { emo: G.swap.pick === 1 ? '✅' : '🤔', title: G.swap.pick === 1 ? t.right : t.notQuite, lead: t.exSwap };
  else if (revealed) st = ok ? { emo: '✅', title: t.right, lead: t.found } : { emo: '🤔', title: t.notQuite, lead: t.closeGap };
  lab.setState({ ...st, body: '', extra: fineHTML(t) });
  scheduleGaps();
}
render();
</script>
</body>
