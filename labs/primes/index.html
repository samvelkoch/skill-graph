const TOPICS = [
  { id: 'mt_y1XCVsIelg', en: 'Prime numbers', ru: 'Простые числа', hu: 'Prímszámok' },

];

// ---- 2. Maths (tiny numbers, computed live) ----------------------------------------------------------
const divisors = (n) => { const r = []; for (let d = 1; d <= n; d++) if (n % d === 0) r.push(d); return r; };
const isPrime = (n) => { if (n < 2) return false; for (let d = 2; d * d <= n; d++) if (n % d === 0) return false; return true; };
const pairsOf = (n) => divisors(n).filter((d) => d * d <= n).map((d) => [d, n / d]);
const twinPairs = (N) => { const r = []; for (let p = 2; p + 2 <= N; p++) if (isPrime(p) && isPrime(p + 2)) r.push([p, p + 2]); return r; };
const TOTAL = Array.from({ length: 100 }, (_, i) => i + 1).filter(isPrime).length; // primes up to 100, computed independently of the sieve
const hash = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const rr = (c, x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
const font = (px, wt = 800) => `${wt} ${Math.round(px)}px Nunito, ui-rounded, system-ui, sans-serif`;
const now = () => performance.now() / 1000;
const MODE_COL = { rect: ['#ff8a3d', 'rgba(255,138,61,.22)'], sieve: ['#f5c84c', 'rgba(245,200,76,.2)'], common: ['#4ea8ff', 'rgba(78,168,255,.22)'], root: ['#3ddc97', 'rgba(61,220,151,.2)'], twin: ['#ff6fa8', 'rgba(255,111,168,.2)'] };
const SIEVE_HUE = { 2: 20, 3: 200, 5: 140, 7: 290 };
const TWIN_HUE = [200, 330, 150, 30, 270, 90];

// ---- 3. State + shell --------------------------------------------------------------------------------
const S = { n: 13, pi: 0, shown: 1, auto: false, autoT: 0, flip: false, tiles: [], ts: 0, hit: [], main: null,
  cross: [], sieved: new Set(), done: false, smsg: null, shake: null,
  a: 24, b: 36, cT: 0, t: 97, rT: 0, tn: 50,

function resetSieve() { S.cross = Array(101).fill(null); S.cross[1] = { by: 0, at: -99 }; S.sieved = new Set(); S.done = false; S.smsg = null; }
resetSieve();

const mode = () => S.secret || lab.view;
const lab = shell({ key: 'primes', T, topics: TOPICS, views: ['rect', 'sieve', 'common'], onLang: () => render(), onView: () => { S.secret = null; if (lab.view === 'common') S.cT = 0; render(); } });
const secret = secretLab('primes', () => ({

$('ctrlBody').innerHTML = `<div id="sl"></div><div class="chips" id="chips"></div>`;
let slKey = '';
const SLIDERS = { rect: [['n', 1, 60, 'slN']], sieve: [], common: [['a', 2, 48, 'slA'], ['b', 2, 48, 'slB']], root: [['t', 2, 200, 'slT']], twin: [['tn', 10, 100, 'slU']] };

function setN(v) { S.n = v; S.pi = 0; S.shown = 1; S.auto = true; S.autoT = 0; S.flip = false; }

// ---- sieve logic ----
function nextCand() { for (let n = 2; n <= 100; n++) if (!S.cross[n] && !S.sieved.has(n)) return n; return null; }
const standing = () => { let k = 0; for (let n = 2; n <= 100; n++) if (!S.cross[n]) k++; return k; };
function sieveStep(n) {
  let k = 0; const t0 = now(); S.sieved.add(n);
  for (let m = 2 * n; m <= 100; m += n) if (!S.cross[m]) { S.cross[m] = { by: n, at: t0 + k * 0.06 }; k++; }
  const nx = nextCand(); if (nx === null || nx > 10) S.done = true;
  S.smsg = { k: S.done ? 'done' : 'cross', n, c: k, nx }; sfx.snap(); render();
}
function sieveTap(n) {
  if (S.done || n < 1 || n > 100) return;
  const nx = nextCand();
  if (n === nx) return sieveStep(n);
  S.shake = { n, t: now() }; S.smsg = { k: S.cross[n] ? 'gone' : 'hint', nx }; sfx.bad(); render();
}

// ---- render: all text + controls ----
function render() {
  const t = T[lang], m = mode(), open = secret.unlocked();
  const [col, glow] = MODE_COL[m]; lab.setGlow(glow);
  const sc = (k) => `<button class="chip secret ${open ? 'open' : ''} ${S.secret === k ? 'on' : ''}" data-k="${k}">${open ? esc(t.secrets[k][0]) : '🔒 ???'}</button>`;
  const ch = (k, label, on) => `<button class="chip ${on ? 'on' : ''}" data-k="${k}">${esc(label)}</button>`;
  let mid = '';
  if (m === 'rect') mid = [1, 13, 24, 36, 49].map((v) => ch(`n:${v}`, F(v), S.n === v)).join('') + ch('turn', t.turn, S.flip) + ch('replay', t.replay, false);
  else if (m === 'sieve') mid = ch('next', t.next, false) + ch('reset', t.reset, false);
  else if (m === 'common') mid = [[24, 36], [6, 8], [36, 48], [7, 5]].map(([a, b]) => ch(`ab:${a}:${b}`, `${a} & ${b}`, S.a === a && S.b === b)).join('');
  else if (m === 'root') mid = [97, 91, 89, 51, 169].map((v) => ch(`t:${v}`, F(v), S.t === v)).join('');
  else mid = [30, 50, 75, 100].map((v) => ch(`tn:${v}`, F(v), S.tn === v)).join('');
  $('chips').innerHTML = sc('root') + mid + sc('twin');

  const key = m + lang;
  if (slKey !== key) {
    slKey = key;
    $('sl').innerHTML = SLIDERS[m].map(([k, lo, hi, lbl]) => `<label class="sl"><span>${esc(t[lbl])}</span><input type="range" class="big" data-s="${k}" min="${lo}" max="${hi}" value="${S[k]}"></label>`).join('');
  }
  $('sl').querySelectorAll('input').forEach((i) => { i.value = S[i.dataset.s]; });

  let st, extra = '', fine = '';
  if (m === 'rect') {
    const n = S.n, pairs = pairsOf(n), k = pairs.length, pr = isPrime(n);
    S.pi = Math.min(S.pi, k - 1);
    const [r, c] = pairs[S.pi];
    fine = t.fineRect;
    if (!S.answered) { st = { emo: '🤔', ...t.think }; lab.setReadout(F(n), t.tiles, '', col); st.body = ''; }
    else {
      st = n === 1 ? t.rect1 : pr ? t.rectPrime(n) : t.rectComp(n, k, L(divisors(n)), r, c);
      lab.setReadout(F(n), t.tiles, n === 1 ? t.pNot : pr ? t.pPrime : t.pRects(k), pr && n > 1 ? '#f5c84c' : col);
      st = { emo: n === 1 ? '🧩' : pr ? '✨' : '🧱', ...st };
      const shown = pairs.slice(0, S.auto ? S.shown : k);
      extra = `<div class="pairs">${shown.map(([a, b], j) => `<b style="--c:hsl(${pr ? 46 : 18 + j * 34} 90% 58%)">${a} × ${F(b)}</b>`).join('')}</div>`;
    }
  } else if (m === 'sieve') {
    const g = S.smsg, nx = nextCand();
    fine = t.fineSieve;
    const found = S.done ? standing() : S.sieved.size;
    lab.setReadout(F(found), t.sSub(TOTAL), S.done ? t.sPill : '', col);
    if (!g) st = { emo: '🔍', ...t.sStart };
    else if (g.k === 'cross') st = { emo: '✂️', ...t.sCross(g.n, g.c, g.nx, standing()) };
    else if (g.k === 'done') st = { emo: '🎉', ...t.sDone(found) };
    else if (g.k === 'gone') st = { emo: '🚫', ...t.sGone(nx) };

  } else if (m === 'common') {
    const a = S.a, b = S.b, com = divisors(a).filter((d) => b % d === 0), h = Math.max(...com), l = a * b / h;
    fine = t.fineCommon;
    lab.setReadout(F(h), t.cSub, t.cPill(h, l).split(' · ')[1], col);

    if (mm < 2) st = t.rootTiny(n);
    else if (pr) st = t.rootPrime(n, mm, new Intl.NumberFormat(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(s));

  }
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body, extra: extra + `<div class="fine">${esc(fine)}</div>` });

    ? `<div class="q">${esc(t.ask)}</div><div class="opts">${t.opts.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="q" style="color:${S.answer === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(S.answer === 1 ? t.right : S.answer === 0 ? t.wrongMany : t.wrongNone)}</div><div class="opts"><button>${esc(t.go)} →</button></div>`;

// ---- 4. Drawing --------------------------------------------------------------------------------------
function drawRect(c, w, h, dt) {
  const t = T[lang], n = S.n, pairs = pairsOf(n), m = pairs.length, pr = isPrime(n) && n > 1;
  if (S.answered && S.auto) {
    S.autoT += dt;
    if (S.autoT > 1.1) { S.autoT = 0; if (S.pi < m - 1) { S.pi++; S.shown = S.pi + 1; sfx.snap(); render(); } else { S.auto = false; S.shown = m; render(); } }
  }
  S.pi = Math.min(S.pi, m - 1);
  const stripH = S.answered ? clamp(h * 0.27, 70, 110) : 0, topH = 36;
  const ax = 10, ay = topH, aw = w - 20, ah = h - stripH - topH - 12;
  const [r0, c0] = pairs[S.pi], rows = S.flip ? c0 : r0, cols = S.flip ? r0 : c0;
  const pile = !S.answered;
  const ts = pile ? 26 : Math.min(aw / cols, ah / rows, 46);
  const ox = ax + (aw - ts * cols) / 2, oy = ay + (ah - ts * rows) / 2;
  while (S.tiles.length < n) S.tiles.push({ x: w / 2 + (Math.random() - .5) * 40, y: ay + ah / 2 });
  S.tiles.length = n;
  S.ts = S.ts ? lerp(S.ts, ts, 1 - Math.exp(-dt * 8)) : ts;
  const k = 1 - Math.exp(-dt * 9), hue = pr ? 46 : 18 + S.pi * 34;
  for (let i = 0; i < n; i++) {
    const tl = S.tiles[i];
    const tx = pile ? w / 2 + (hash(i) - .5) * Math.min(w * .5, 260) : ox + (i % cols) * ts + ts / 2;
    const ty = pile ? ay + ah * .62 + (hash(i + 99) - .5) * ah * .34 : oy + Math.floor(i / cols) * ts + ts / 2;
    tl.x += (tx - tl.x) * k; tl.y += (ty - tl.y) * k;
    const s = S.ts * 0.9;
    c.fillStyle = `hsl(${hue} 92% ${55 + (((i % cols) + Math.floor(i / cols)) % 2) * 6}%)`;
    rr(c, tl.x - s / 2, tl.y - s / 2, s, s, s > 8 ? s * 0.2 : 0); c.fill();
  }
  S.main = pile ? null : { x: ox, y: oy, w: ts * cols, h: ts * rows };
  if (!pile) {
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.font = font(clamp(w * 0.05, 16, 24));
    c.fillText(`${rows} × ${cols} = ${F(n)}`, w / 2, 20);
    // thumbnails of every rectangle
    const sy = h - stripH - 2, gap = 6, cw = (w - 20 - gap * (m - 1)) / m, shownN = S.auto ? S.shown : m;
    S.hit = [];
    for (let j = 0; j < m; j++) {
      const x = 10 + j * (cw + gap), [pr_, pc] = pairs[j], on = j === S.pi;
      rr(c, x, sy, cw, stripH, 10); c.fillStyle = 'rgba(130,145,190,.10)'; c.fill();
      c.strokeStyle = on ? '#fff' : 'rgba(130,145,190,.25)'; c.lineWidth = on ? 2 : 1; c.setLineDash(j < shownN ? [] : [4, 4]); c.stroke(); c.setLineDash([]);
      if (j >= shownN) continue;
      const bw = cw - 12, bh = stripH - 32, mt = Math.min(bw / pc, bh / pr_, 14), mx = x + (cw - mt * pc) / 2, my = sy + 8 + (bh - mt * pr_) / 2;
      c.fillStyle = `hsl(${pr ? 46 : 18 + j * 34} 92% 58%)`;
      for (let q = 0; q < n; q++) { const px = mx + (q % pc) * mt, py = my + Math.floor(q / pc) * mt; if (mt > 4) { rr(c, px + .5, py + .5, mt - 1, mt - 1, mt * .2); c.fill(); } else c.fillRect(px, py, mt, mt); }
      c.fillStyle = on ? '#fff' : '#C6CDE0'; c.font = font(clamp(cw * 0.19, 10, 14)); c.textAlign = 'center'; c.textBaseline = 'alphabetic';
      c.fillText(`${pr_} × ${F(pc)}`, x + cw / 2, sy + stripH - 8);
      S.hit.push({ x, y: sy, w: cw, h: stripH, j });
    }
  }
}

const gridGeom = (w, h) => { const cell = Math.min((w - 16) / 10, (h - 16) / 10); return { cell, x0: (w - cell * 10) / 2, y0: (h - cell * 10) / 2 }; };

function drawSieve(c, w, h, dt, time) {
  const { cell, x0, y0 } = gridGeom(w, h), nx = S.done ? null : nextCand();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let n = 1; n <= 100; n++) {
    let x = x0 + ((n - 1) % 10) * cell, y = y0 + Math.floor((n - 1) / 10) * cell;
    if (S.shake && S.shake.n === n && time - S.shake.t < 0.4) x += Math.sin((time - S.shake.t) * 50) * 4 * (1 - (time - S.shake.t) / 0.4);
    const cr = S.cross[n], p = cr ? clamp((time - cr.at) / 0.35, 0, 1) : 0;
    const prime = S.sieved.has(n) || (S.done && !cr);
    const g = cell * 0.06, bx = x + g, by = y + g, bs = cell - 2 * g;
    let fill = 'rgba(130,145,190,.13)', tc = '#EDEFF7', alpha = 1;
    if (prime) { fill = '#f5c84c'; tc = '#17120a'; }
    else if (p > 0) {
      const hue = SIEVE_HUE[cr.by] ?? (cr.by * 47) % 360;
      fill = cr.by ? `hsla(${hue} 70% 55% / ${0.14 * p})` : 'rgba(130,145,190,.05)'; alpha = 1 - 0.68 * p;
    }
    rr(c, bx, by, bs, bs, cell * 0.16); c.fillStyle = fill; c.fill();
    if (nx === n) { c.strokeStyle = `rgba(245,200,76,${0.55 + 0.45 * Math.sin(time * 5)})`; c.lineWidth = 2.5; c.stroke(); }
    c.globalAlpha = alpha; c.fillStyle = tc; c.font = font(cell * 0.4); c.fillText(String(n), x + cell / 2, y + cell / 2 + cell * 0.02); c.globalAlpha = 1;
    if (p > 0 && cr.by) {
      const hue = SIEVE_HUE[cr.by] ?? (cr.by * 47) % 360;
      c.strokeStyle = `hsl(${hue} 85% 62%)`; c.lineWidth = Math.max(1.5, cell * 0.07); c.lineCap = 'round'; c.beginPath();
      c.moveTo(bx + bs * 0.2, by + bs * 0.8); c.lineTo(bx + bs * (0.2 + 0.6 * p), by + bs * (0.8 - 0.6 * p)); c.stroke();
    }
  }
}

function drawCommon(c, w, h, dt) {
  const t = T[lang], a = S.a, b = S.b, fa = divisors(a), fb = divisors(b), com = fa.filter((d) => b % d === 0), hcf = Math.max(...com), Lc = a * b / hcf;
  S.cT = Math.min(1, S.cT + dt * 0.7);
  const pad = 12, fs = clamp(w * 0.036, 11, 15), mx = Math.max(fa.length, fb.length), gap = 4;
  const bs = clamp((w - 2 * pad - (mx - 1) * gap) / mx, 16, 42), COLA = '#4ea8ff', COLB = '#ff8a3d';
  const rowH = fs + 5 + bs + fs + 8, secH = fs + 8 + fs + 6 + 46 + fs + 6;
  let y = pad + Math.max(0, (h - (2 * rowH + secH + pad)) / 2 - pad) * 0.7;
  c.textBaseline = 'top'; c.textAlign = 'left';
  const row = (n, fl, colr) => {
    c.font = font(fs); c.fillStyle = colr; c.fillText(t.cFactors(n), pad, y); y += fs + 5;
    fl.forEach((d, i) => {
      const x = pad + i * (bs + gap), isC = com.includes(d);
      rr(c, x, y, bs, bs, 7); c.fillStyle = isC ? '#f5c84c' : 'rgba(130,145,190,.14)'; c.fill();
      if (d === hcf) { c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke(); }
      c.fillStyle = isC ? '#17120a' : '#EDEFF7'; c.font = font(bs * 0.42); c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(String(d), x + bs / 2, y + bs / 2 + 1);
      if (d === hcf) { c.fillStyle = '#f5c84c'; c.font = font(fs * 0.85); c.fillText(t.cHcf, x + bs / 2, y + bs + fs * 0.7); }
      c.textAlign = 'left'; c.textBaseline = 'top';
    });
    y += bs + fs + 8;
  };
  row(a, fa, COLA); row(b, fb, COLB);
  // multiples on two rails
  c.font = font(fs); c.textAlign = 'left'; c.textBaseline = 'top';
  const ta = t.cMult(a), tb = t.cMult(b); c.fillStyle = COLA; c.fillText(ta, pad, y); const wa = c.measureText(ta).width; c.fillStyle = COLB; c.fillText(tb, pad + wa + 18, y);
  y += fs + 8;
  const up = (3 * Lc / a <= 36 && 3 * Lc / b <= 36) ? 3 * Lc : Lc, x0 = pad + 10, W = w - 2 * pad - 20, X = (v) => x0 + W * v / up, lim = up * (1 - Math.pow(1 - S.cT, 2));
  const yA = y + fs + 6, yB = yA + 46;
  c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 2;
  for (const yy of [yA, yB]) { c.beginPath(); c.moveTo(x0, yy); c.lineTo(x0 + W, yy); c.stroke(); }
  const dotR = clamp(W * 0.5 / Math.max(up / a, up / b), 1.5, 6);
  const mult = (step, yy, colr, above) => {
    const label = W * step / up >= fs * 2.6;
    for (let v = step; v <= up && v <= lim; v += step) {
      const common = v % Lc === 0;
      c.beginPath(); c.arc(X(v), yy, common ? dotR + 2 : dotR, 0, 7); c.fillStyle = common ? '#f5c84c' : colr; c.fill();
      if (label && !common) { c.fillStyle = colr; c.font = font(fs * 0.85, 700); c.textAlign = 'center'; c.textBaseline = above ? 'bottom' : 'top'; c.fillText(F(v), X(v), above ? yy - dotR - 3 : yy + dotR + 3); }
    }
  };
  mult(a, yA, COLA, true); mult(b, yB, COLB, false);
  for (let v = Lc; v <= up && v <= lim; v += Lc) {
    const x = X(v); c.strokeStyle = 'rgba(245,200,76,.7)'; c.lineWidth = 1.5; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(x, yA); c.lineTo(x, yB); c.stroke(); c.setLineDash([]);
    const txt = F(v); c.font = font(fs, 900); const tw = c.measureText(txt).width + 14, px = clamp(x - tw / 2, 2, w - tw - 2), my = (yA + yB) / 2;
    rr(c, px, my - fs * 0.85, tw, fs * 1.7, 999); c.fillStyle = '#f5c84c'; c.fill();
    c.fillStyle = '#17120a'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, px + tw / 2, my + 1);
    if (v === Lc) { c.fillStyle = '#f5c84c'; c.font = font(fs * 0.8); c.textBaseline = 'top'; c.fillText(t.cLcm, clamp(x, 20, w - 20), yB + dotR + fs + 6); }
  }
}

function drawRoot(c, w, h, dt) {
  const t = T[lang], n = S.t, s = Math.sqrt(n), mm = Math.floor(s), pad = 12;
  S.rT += dt;
  const ds = []; for (let d = 2; d <= mm; d++) ds.push(d);
  const found = ds.find((d) => n % d === 0);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = '#fff'; c.font = font(clamp(w * 0.06, 20, 30)); c.fillText(t.rTitle(n, new Intl.NumberFormat(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(s)), w / 2, 26);
  c.fillStyle = '#98A0B8'; c.font = font(clamp(w * 0.03, 11, 13), 700); c.fillText(t.rLegend, w / 2, 52);
  const bs = clamp(w * 0.105, 34, 52), gap = 6, per = Math.max(1, Math.floor((w - 2 * pad + gap) / (bs + gap)));
  const rowsN = Math.ceil(ds.length / per); let y = 70;
  ds.forEach((d, i) => {
    const r = Math.floor(i / per), inRow = Math.min(per, ds.length - r * per), x = (w - (inRow * (bs + gap) - gap)) / 2 + (i % per) * (bs + gap), yy = y + r * (bs + gap);
    const al = clamp((S.rT - i * 0.14) / 0.2, 0, 1); if (al <= 0) return;
    const after = found && d > found, hit = n % d === 0;
    c.globalAlpha = al * (after ? 0.25 : 1);
    rr(c, x, yy, bs, bs, 8); c.fillStyle = hit ? '#f5c84c' : 'rgba(61,220,151,.16)'; c.fill();
    c.strokeStyle = hit ? '#fff' : 'rgba(61,220,151,.55)'; c.lineWidth = hit ? 2 : 1; c.stroke();
    c.fillStyle = hit ? '#17120a' : '#EDEFF7'; c.font = font(bs * 0.4); c.fillText(String(d), x + bs / 2, yy + bs * 0.38);
    c.fillStyle = hit ? '#17120a' : '#98A0B8'; c.font = font(bs * 0.27, 700); c.fillText(String(n % d), x + bs / 2, yy + bs * 0.77);
    c.globalAlpha = 1;
  });
  const reveal = clamp((S.rT - ds.length * 0.14 - 0.1) / 0.3, 0, 1), ry = y + rowsN * (bs + gap) + 22;
  if (reveal > 0 || ds.length === 0) {
    c.globalAlpha = ds.length === 0 ? 1 : reveal; c.fillStyle = found ? '#f5c84c' : '#3ddc97'; c.font = font(clamp(w * 0.06, 20, 28));
    c.fillText(found ? t.rootPair(n, found, n / found) : t.rootIs(n), w / 2, ry); c.globalAlpha = 1;
  }
  if (n > 3) {
    const bw = w - 2 * pad, by = h - 40, frac = Math.max((mm - 1) / (n - 2), 0.012);
    rr(c, pad, by, bw, 12, 6); c.fillStyle = 'rgba(130,145,190,.22)'; c.fill();
    rr(c, pad, by, Math.max(bw * frac, 6), 12, 6); c.fillStyle = '#3ddc97'; c.fill();
    c.font = font(clamp(w * 0.03, 10, 12), 700); c.textBaseline = 'bottom'; c.textAlign = 'left'; c.fillStyle = '#3ddc97'; c.fillText(`2…${mm}  ${t.rTested}`, pad, by - 4);
    c.textAlign = 'right'; c.fillStyle = '#98A0B8'; c.fillText(`${t.rSkip}  ${mm + 1}…${F(n - 1)}`, pad + bw, by - 4);
  }
}

function drawTwin(c, w, h, dt, time) {
  const { cell, x0, y0 } = gridGeom(w, h), N = S.tn, tp = twinPairs(N), first = {}, second = {};
  tp.forEach(([p, q], j) => { for (const v of [p, q]) { if (first[v] === undefined) first[v] = j; else second[v] = j; } });
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let n = 1; n <= 100; n++) {
    const x = x0 + ((n - 1) % 10) * cell, y = y0 + Math.floor((n - 1) / 10) * cell, g = cell * 0.06, bs = cell - 2 * g;
    const pr = isPrime(n), tw = first[n] !== undefined, inR = n <= N;
    let fill = null, tc = '#EDEFF7', al = inR ? 0.38 : 0.12;
    if (inR && pr) { fill = 'rgba(245,200,76,.2)'; tc = '#f5c84c'; al = 1; }
    if (inR && tw) { fill = `hsl(${TWIN_HUE[first[n] % 6]} 80% 62%)`; tc = '#17120a'; al = 1; }
    if (fill) { rr(c, x + g, y + g, bs, bs, cell * 0.16); c.fillStyle = fill; c.fill(); }
    if (inR && second[n] !== undefined) { rr(c, x + g, y + g, bs, bs, cell * 0.16); c.strokeStyle = `hsl(${TWIN_HUE[second[n] % 6]} 80% 62%)`; c.lineWidth = Math.max(2.5, cell * 0.1); c.stroke(); }
    c.globalAlpha = al; c.fillStyle = tc; c.font = font(cell * 0.4); c.fillText(String(n), x + cell / 2, y + cell / 2 + cell * 0.02); c.globalAlpha = 1;
  }
}

const cvLoop = canvasLoop($('cv'), (c, w, h, dt, time) => {
  const m = mode();
  if (m === 'rect') drawRect(c, w, h, dt);
  else if (m === 'sieve') drawSieve(c, w, h, dt, time);
  else if (m === 'common') drawCommon(c, w, h, dt);
  else if (m === 'root') drawRoot(c, w, h, dt);
  else drawTwin(c, w, h, dt, time);
});

$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, m = mode();
  if (m === 'rect' && S.answered) {
    const hit = S.hit.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
    if (hit) { S.pi = hit.j; S.auto = false; S.shown = S.hit.length; sfx.snap(); render(); }
    else if (S.main && x >= S.main.x && x <= S.main.x + S.main.w && y >= S.main.y && y <= S.main.y + S.main.h) { S.flip = !S.flip; sfx.click(); render(); }
  } else if (m === 'sieve') {
    const g = gridGeom(r.width, r.height), col = Math.floor((x - g.x0) / g.cell), row = Math.floor((y - g.y0) / g.cell);
    if (col >= 0 && col < 10 && row >= 0 && row < 10) sieveTap(row * 10 + col + 1);
  }
});
render();
</script>
