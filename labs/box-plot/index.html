      pill(ctx, w, `${e1 > 0 ? '+' : e1 < 0 ? '−' : '±'}${Math.abs(e1)}`, xv(st0.q1), y, Math.abs(e1) <= 5 ? '#3ddc97' : '#f5c84c');
      pill(ctx, w, `${e2 > 0 ? '+' : e2 < 0 ? '−' : '±'}${Math.abs(e2)}`, xv(st0.q3), y, Math.abs(e2) <= 5 ? '#3ddc97' : '#f5c84c');
    }
    drawDots(ctx, dp, kids, 3.6, selR, vis);
    if (selR >= 0) { const [dx, dy] = dp[selR]; pill(ctx, w, `${kids[selR].v} ${T[lang].unit}`, dx, dy - 16 * (R.dir < 0 ? 1 : -1) - 4 * (R.dir < 0 ? 1 : -1), '#fff'); }

      ctx.font = FONT; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(R.tag, 11, gy - 9); ctx.restore(); }

const tcol = (t) => (t < 0.33 ? mix('#4fa3ff', '#62d6a8', t / 0.33) : t < 0.66 ? mix('#62d6a8', '#ffc247', (t - 0.33) / 0.33) : mix('#ffc247', '#ff6552', (t - 0.66) / 0.34));

  background(ctx, w, h, -10, -10);
  const stackTop = yA - 72, boxC = stackTop - 26, bh = 28, boxTop = boxC - bh / 2, ya = 44, yb = boxTop - 34;
  const yc = (v) => lerp(yb, ya, (v - d0) / (d1 - d0));

  ctx.save(); ctx.strokeStyle = 'rgba(143,155,189,.35)'; ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.moveTo(ax0, yc(0)); ctx.lineTo(ax1, yc(0)); ctx.stroke(); ctx.restore();
  const bins = new Map(), lvls = YEAR.map((v) => { const k = Math.round(xv(v) / 3.4), l = bins.get(k) || 0; bins.set(k, l + 1); return l; });
  const sp = Math.min(3.4, 66 / Math.max(1, ...lvls));

const canvas = $('cv');
canvasLoop(canvas, (ctx, w, h, dt) => {

  if (G.tgt && G.gp < 1) G.gp = Math.min(1, G.gp + dt / 1.8); else if (!G.tgt && G.gp > 0) G.gp = Math.max(0, G.gp - dt / 1.8);

let lastKey = '';

// --- input: drag the two handles, tap a child or a dot ----------------------------------------------------------
let drag = -1;
const ptr = (ev) => { const r = canvas.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
canvas.addEventListener('pointerdown', (ev) => {
  if (!LY || mode() === 'year') return;
  const [px, py] = ptr(ev);
  if (LY.m === 'line' && !L1.checked && Math.abs(py - LY.yA) < 30) {
    const d = L1.h.map((v) => Math.abs(LY.xv(v) - px)), i = d[0] <= d[1] ? 0 : 1;
    if (d[i] < 26) { drag = i; canvas.setPointerCapture(ev.pointerId); sfx.tick(); return; }
  }
  let best = null, bd = 1e9;
  LY.rows.forEach((R, ci) => {
    R.pos.forEach(([x, y], r) => { if (!R.vis(r)) return; const dx = Math.abs(px - x); if (dx < Math.max(11, R.pitch * 0.55) && py > y - 80 * R.s && py < y + 10 && dx < bd) { bd = dx; best = { ci, r }; } });
    R.dp.forEach(([x, y], r) => { if (!R.vis(r)) return; const d = Math.hypot(px - x, py - y); if (d < 11 && d < bd) { bd = d; best = { ci, r }; } });

canvas.addEventListener('pointermove', (ev) => {

// --- controls ---------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {

  if (act === 'check') {
    const st = L1.cls.st; L1.err = [L1.h[0] - st.q1, L1.h[1] - st.q3]; L1.checked = true; L1.tl = 0; S.sel = null;
    (Math.max(Math.abs(L1.err[0]), Math.abs(L1.err[1])) <= 5 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'replay') { const o = tlObj(m); if (o) o.tl = 0; S.sel = null; sfx.click(); showStage(); }
  else if (act === 'newc') { const h = L1.h; L1 = newLine(); L1.cls = makeClass(randomVals(), Math.floor(Math.random() * 8)); L1.h = [...h]; S.sel = null; sfx.click(); }

});

// --- readout, table, state card ------------------------------------------------------------------------------
function curStats() { // what the readout and table show right now
  const m = mode(), t = T[lang];
  if (m === 'line' || m === 'even') { const L = m === 'line' ? L1 : E, P = PP1(L.tl); return { cols: [{ h: t.unit, st: L.cls.st, vis: (k) => ({ med: P.fm, q1: P.f1, q3: P.f3, iqr: P.box, range: P.box })[k] > 0.55 }], box: P.box > 0.55 }; }
  if (m === 'two') { const P = PP2(L2.tl); return { cols: [{ h: t.ab[0], st: L2.A.st, vis: () => P.box > 0.55 }, { h: t.ab[1], st: L2.B.st, vis: () => P.box > 0.55 }], box: P.box > 0.55 }; }
  if (m === 'giant') { const eg = ease(G.gp), mv = eg > 0.001 && eg < 0.999; return { cols: [{ h: t.bef, st: G.st0, vis: () => true }, { h: t.aft, st: lerpSt(G.st0, G.cls.st, eg), vis: () => G.gp > 0.02, round: mv }], box: true }; }

let tblKey = '', roKey = '';

  const html = `<table class="bp-t"><thead><tr><th></th>${cs.cols.map((c) => `<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${rows.map((k) => `<tr><th>${esc(t.st[k])}</th>${cs.cols.map((c) => c.vis(k) ? `<td>${nf(c.round ? Math.round(c.st[k]) : c.st[k])}</td>` : '<td class="bp-u">?</td>').join('')}</tr>`).join('')}</tbody></table>`;
  if (html !== tblKey) { tblKey = html; $('bpTbl').innerHTML = html; }
  const m = mode(), col = { line: '#3ddc97', two: '#b58cff', giant: '#ff8a3d', year: '#6fb7ff', even: '#ffd166' }[m], c0 = cs.cols[0], c1 = cs.cols[cs.cols.length - 1];

function render() {
  const t = T[lang], m = mode(), ph = phaseOf(), v = lab.view, btn = (a, txt, cls = '', k = '') => `<button class="bp-btn ${cls}" data-act="${a}"${k !== '' ? ` data-k="${k}"` : ''}>${esc(txt)}</button>`;
