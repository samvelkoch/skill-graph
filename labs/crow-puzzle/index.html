  c.beginPath(); c.moveTo(0.3, -2.1); c.lineTo(0.78, -2.0); c.lineTo(0.3, -1.85); c.closePath(); c.fillStyle = '#d8b878'; c.fill();
  circ(c, 0.8, -2.0, 0.06); c.fillStyle = '#2a1c18'; c.fill();
  ell(c, 0.28, -2.18, 0.18 * hs, 0.13 * hs, -0.3); c.fillStyle = '#3a2a1e'; c.fill(); circ(c, 0.31, -2.18, 0.045 * hs); c.fillStyle = '#fff'; c.fill();
  ell(c, -0.12, -2.4, 0.1, 0.12); c.fillStyle = '#3a2a1e'; c.fill();
  c.restore();
}
function sceneMeer(c, time, dt) {
  c.fillStyle = lg(c, 0, 0, 0, DH, [[0, '#f0c48a'], [1, '#c98a52']]); c.fillRect(0, 0, DW, DH);
  c.fillStyle = rgr(c, 290, 50, 2, 290, 50, 120, [[0, 'rgba(255, 244, 200, .9)'], [1, 'rgba(255, 244, 200, 0)']]); c.fillRect(0, 0, DW, DH);
  c.fillStyle = lg(c, 0, 226, 0, DH, [[0, '#d9b574'], [1, '#a47a40']]); c.beginPath(); c.moveTo(0, 240); c.quadraticCurveTo(180, 222, 360, 240); c.lineTo(360, DH); c.lineTo(0, DH); c.closePath(); c.fill();
  if (S.mphase === 'give') { S.mt += dt; if (S.mt > 2.2) { S.mphase = 'done'; sfx.good(); render(); } }
  const p = S.mphase === 'idle' ? 0 : S.mphase === 'done' ? 1 : ease(c01(S.mt / 1.1));
  ell(c, 98, 262, 36, 6); c.fillStyle = 'rgba(70, 40, 10, .3)'; c.fill(); ell(c, 262, 262, 24, 5); c.fill();
  meerkat(c, 98, 262, 40, { hold: 1 });
  meerkat(c, 262, 262, 26, { face: -1, pup: true });
  const sx = lerp(138, 224, p), sy = lerp(206, 252, p) - 14 * Math.sin(Math.PI * p);
  scorpion(c, sx, sy, 0.9, S.mage === 1, time);
}

// --- the shell -----------------------------------------------------------------------------------------------
const lab = shell({ key: 'crow-puzzle', T, topics: TOPICS, views: ['tube', 'tools', 'test'], onLang: () => render(), onView: () => { S.sec = null; render(); } });
const secret = secretLab('crow-puzzle', () => ({
  secrets: [{ emo: '🪝', title: T[lang].secrets.a[0], desc: T[lang].secrets.a[1] }, { emo: '🦂', title: T[lang].secrets.b[0], desc: T[lang].secrets.b[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div class="cp-sec" id="secTube">
    <div class="row2" style="margin-top:0"><span class="lbl" id="tbObjL"></span><div class="chips" id="tbObj"></div></div>
    <div class="row2"><span class="lbl" id="tbNL"></span><div class="cp-step"><button class="sb" data-act="ndec" aria-label="−">−</button><b id="tbN"></b><button class="sb" data-act="ninc" aria-label="+">+</button></div></div>
    <div class="row2"><button class="btn" data-act="go" id="tbGo"></button><button class="chip" data-act="again" id="tbAgain"></button><button class="chip" data-act="next" id="tbNext"></button></div>
  </div>
  <div class="cp-sec" id="secTools">
    <div class="row2" style="margin-top:0"><span class="lbl" id="tlAL"></span><div class="chips" id="tlA"></div></div>
    <div class="row2"><span class="lbl" id="tlTL"></span><div class="chips" id="tlT"></div></div>
    <div class="row2"><button class="btn" data-act="check" id="tlGo"></button><button class="chip" data-act="treset" id="tlReset"></button></div>
  </div>
  <div class="cp-sec" id="secTest">
    <div class="row2" style="margin-top:0"><span class="lbl" id="teAL"></span><div class="chips" id="teA"></div></div>
    <p class="cp-q" id="teQ"></p>
    <div class="cp-opts" id="teOpts"></div>
  </div>
  <div class="cp-sec" id="secWire">
    <div class="cp-slide"><span class="lbl" id="wrL" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700"></span><input type="range" class="big" id="wrS" min="0" max="100" value="0" step="1"><b id="wrV"></b></div>
    <div class="row2"><button class="btn" data-act="fish" id="wrGo"></button></div>
  </div>
  <div class="cp-sec" id="secMeer">
    <div class="row2" style="margin-top:0"><div class="chips" id="meAge"></div></div>
    <div class="row2"><button class="btn" data-act="give" id="meGo"></button></div>
  </div>
  <div class="row2" id="cpSecs"></div>`;

// --- input ---------------------------------------------------------------------------------------------------
function showStage() {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function resetTube(keepObj) {
  S.phase = 'predict'; S.runT = 0; S.levels = []; S.res = null; S.rk = '';
  S.wl = TUBES[S.ti].start; S.n = clamp(S.n, 1, maxOf(TUBES[S.ti]));
  if (!keepObj) S.obj = null;
}
const assign = (j) => {
  if (S.tchk) return;
  const i = S.tsel;
  if (S.tl[i] === j) { S.tl[i] = null; return; }
  S.tl = S.tl.map((g) => (g === j ? null : g)); S.tl[i] = j;
  const nxt = [1, 2, 3, 0].map((d) => (i + d) % 4).find((k) => S.tl[k] === null);
  if (nxt !== undefined) S.tsel = nxt;
};
function predict(p) {
  const i = S.ta; if (S.tdone[i]) return;
  S.tp[i] = p; S.tdone[i] = true; S.tt[i] = nowS();
  const good = i === 0 ? p === 'yes' : i === 2 ? p === 'no' : null;
  if (good === null) sfx.click(); else (good ? sfx.good : sfx.bad)();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, tb = TUBES[S.ti];
  if (a === 'obj' && S.phase === 'predict') { S.obj = b.dataset.o; sfx.tick(); }
  else if (a === 'ndec' && S.phase === 'predict') { S.n = clamp(S.n - 1, 1, maxOf(tb)); sfx.tick(); }
  else if (a === 'ninc' && S.phase === 'predict') { S.n = clamp(S.n + 1, 1, maxOf(tb)); sfx.tick(); }
  else if (a === 'go' && S.phase === 'predict' && S.obj) { S.levels = levelsFor(tb, S.obj, S.n); S.phase = 'run'; S.runT = 0; S.rk = ''; sfx.click(); }
  else if (a === 'again') { resetTube(true); sfx.click(); }
  else if (a === 'next') { S.ti = (S.ti + 1) % TUBES.length; resetTube(true); sfx.click(); }
  else if (a === 'animal') { S.tsel = +b.dataset.i; sfx.tick(); }
  else if (a === 'tool') { assign(+b.dataset.j); sfx.tick(); }
  else if (a === 'check' && !S.tchk && S.tl.every((g) => g !== null)) { S.tchk = true; S.tchkT = nowS(); (S.tl.filter((g, i) => g === i).length === 4 ? sfx.good : sfx.snap)(); showStage(); }
  else if (a === 'treset') { S.tl = [null, null, null, null]; S.tsel = 0; S.tchk = false; sfx.click(); }
  else if (a === 'tanimal') { S.ta = +b.dataset.i; sfx.tick(); }
  else if (a === 'pred') { predict(b.dataset.p); showStage(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k;
    if (S.sec === 'wire') { S.wphase = 'idle'; S.wt = 0; S.bend = 0; }
    if (S.sec === 'meer') { S.mphase = 'idle'; S.mt = 0; }
    sfx.click(); showStage();
  }
  else if (a === 'fish' && S.wphase !== 'fish') { S.wphase = 'fish'; S.wt = 0; S.wok = S.bend >= 70; sfx.click(); }
  else if (a === 'age') { S.mage = +b.dataset.v; S.mphase = 'idle'; S.mt = 0; sfx.tick(); }
  else if (a === 'give' && S.mphase !== 'give') { S.mphase = 'give'; S.mt = 0; sfx.click(); }
  render();
});
$('wrS').addEventListener('input', (ev) => { if (S.wphase === 'fish') return; S.bend = +ev.target.value; if (S.wphase === 'done') S.wphase = 'idle'; render(); });
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'tools' || S.tchk) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - V.ox) / V.k, y = (ev.clientY - r.top - V.oy) / V.k;
  const i = TILES.findIndex(([tx, ty]) => x >= tx && x <= tx + TW && y >= ty && y <= ty + TH);
  if (i >= 0) { S.tsel = i; sfx.tick(); render(); }
});

// --- the picture -------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const k = Math.min(w / DW, h / DH);
  V.k = k; V.ox = (w - DW * k) / 2; V.oy = (h - DH * k) / 2;
  c.save(); c.translate(V.ox, V.oy); c.scale(k, k);
  rr(c, 0, 0, DW, DH, 22); c.clip();
  if (S.sec === 'wire') sceneWire(c, time, dt);
  else if (S.sec === 'meer') sceneMeer(c, time, dt);
  else if (lab.view === 'tube') sceneTube(c, time, dt);
  else if (lab.view === 'tools') { c.fillStyle = lg(c, 0, 0, 0, DH, [[0, '#1b2035'], [1, '#0f1322']]); c.fillRect(0, 0, DW, DH); sceneTools(c, time); }
  else sceneTest(c, time);
  c.restore();
});

// --- one render per change: controls, readout and the state card ------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec || v;
  const on = (id, f) => $(id).classList.toggle('on', f);
  on('secTube', !sec && v === 'tube'); on('secTools', !sec && v === 'tools'); on('secTest', !sec && v === 'test'); on('secWire', sec === 'wire'); on('secMeer', sec === 'meer');
  const open = secret.unlocked();
  $('cpSecs').innerHTML = [['wire', '🪝', 'a'], ['meer', '🦂', 'b']].map(([k, e, s]) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[s][0])}` : '🔒 ???'}</button>`).join('');
  if (sec === 'wire') renderWire(t); else if (sec === 'meer') renderMeer(t);
  else if (v === 'tube') renderTube(t); else if (v === 'tools') renderTools(t); else renderTest(t);
}
function renderTube(t) {
  const q = t.tube, tb = TUBES[S.ti], pre = S.phase === 'predict', run = S.phase === 'run', done = S.phase === 'done', mx = maxOf(tb);
  lab.setGlow('rgba(79, 183, 230, .26)');
  $('tbObjL').textContent = q.objL; $('tbNL').textContent = q.nL;
  $('tbObj').innerHTML = ['stone', 'cork'].map((o) => `<button class="chip${S.obj === o ? ' on' : ''}" data-act="obj" data-o="${o}"${pre ? '' : ' disabled'}>${esc(q[o])}</button>`).join('');
  $('tbN').textContent = S.n;
  document.querySelectorAll('#secTube .sb').forEach((b) => { b.disabled = !pre || (b.dataset.act === 'ndec' ? S.n <= 1 : S.n >= mx); });
  $('tbGo').textContent = q.go; $('tbGo').hidden = !pre; $('tbGo').disabled = S.obj === null;
  $('tbAgain').textContent = q.again; $('tbAgain').hidden = !done;
  $('tbNext').textContent = q.next; $('tbNext').hidden = !done;
  const lvl = pre ? tb.start : done ? S.res.final : S.wl;
  lab.setReadout(`${fmt(lvl)} ${t.cm}`, q.water, q.reachPill(fmt(tb.reach)), '#4fb7e6');
  if (pre) { lab.setState({ emo: '🤔', title: q.ask, lead: q.askLead, body: '', extra: '' }); lab.setFacts([]); }
  else if (run) { lab.setState({ emo: '🐦‍⬛', title: q.runTitle, lead: q.runLead, body: '', extra: '' }); lab.setFacts([]); }
  else {
    const f = S.res.final, a = fmt(tb.start), b = fmt(f), need = needOf(tb);
    let st;
    if (S.obj === 'cork') st = { emo: '🪵', title: q.corks, lead: q.corkLead(S.n, a, b, t.cn), body: q.corkBody };
    else if (!S.res.ok) st = { emo: '💧', title: q.low, lead: q.lowLead(S.n, b, fmt(tb.reach), t.sn), body: q.lowBody(need, t.sn) };
    else if (S.n === need) st = { emo: '✅', title: q.exact, lead: q.exactLead(S.n, a, b, t.sn), body: q.okBody };
    else st = { emo: '✅', title: q.more, lead: q.moreLead(need, S.n - need, t.sn), body: q.okBody };
    lab.setState({ ...st, extra: '' }); lab.setFacts(q.facts);
  }
}
function renderTools(t) {
  const q = t.tools, k = S.tl.filter((g, i) => g === i).length, n = S.tl.filter((g) => g !== null).length;
  lab.setGlow('rgba(95, 190, 130, .24)');
  $('tlAL').textContent = q.aL; $('tlTL').textContent = q.tL;
  $('tlA').innerHTML = [0, 1, 2, 3].map((i) => `<button class="chip${S.tsel === i && !S.tchk ? ' on' : ''}" data-act="animal" data-i="${i}" aria-label="${esc(q.animals[i])}"${S.tchk ? ' disabled' : ''}>${ANIMAL_EMO[i]}${S.tl[i] !== null ? ' ✓' : ''}</button>`).join('');
  $('tlT').innerHTML = TOOL_ORDER.map((j) => `<button class="chip${S.tl[S.tsel] === j && !S.tchk ? ' on' : ''}${S.tl.includes(j) && S.tl[S.tsel] !== j ? ' used' : ''}" data-act="tool" data-j="${j}"${S.tchk ? ' disabled' : ''}>${TOOL_EMO[j]} ${esc(q.tool[j])}</button>`).join('');
  $('tlGo').textContent = q.check; $('tlGo').hidden = S.tchk; $('tlGo').disabled = n < 4;
  $('tlReset').textContent = q.again; $('tlReset').hidden = !S.tchk && n === 0;
  if (!S.tchk) {
    lab.setReadout(`${n}/4`, q.matched, '', '#5fbe82');
    lab.setState({ emo: '🔧', title: q.ask, lead: q.askLead, body: q.match(n), extra: '' }); lab.setFacts([]);
  } else {
    lab.setReadout(`${k}/4`, '✓', '', '#5fbe82');
    const lines = `<ul class="cp-lines">${[0, 1, 2, 3].map((i) => `<li>${ANIMAL_EMO[i]} <b>${esc(q.animals[i])}</b> (${esc(q.tool[i].toLowerCase())}) ${esc(q.what[i])}.</li>`).join('')}</ul>`;
    lab.setState({ emo: k === 4 ? '✅' : '🤔', title: k === 4 ? q.right4 : q.right(k), lead: q.lead, body: '', extra: lines }); lab.setFacts(q.facts);
  }
}
function renderTest(t) {
  const q = t.test, i = S.ta, d = S.tdone[i], n = S.tdone.filter(Boolean).length;
  lab.setGlow('rgba(210, 130, 140, .24)');
  $('teAL').textContent = q.aL;
  $('teA').innerHTML = [0, 1, 2].map((j) => `<button class="chip${j === i ? ' on' : ''}" data-act="tanimal" data-i="${j}" aria-label="${esc(q.animals[j])}">${TEST_EMO[j]} ${esc(q.animals[j])}${S.tdone[j] ? ' ✓' : ''}</button>`).join('');
  $('teQ').textContent = q.q;
  $('teOpts').innerHTML = `<button class="cp-opt" data-act="pred" data-p="yes"${d ? ' disabled' : ''}>${esc(q.yes)}</button><button class="cp-opt" data-act="pred" data-p="no"${d ? ' disabled' : ''}>${esc(q.no)}</button>`;
  lab.setReadout(`${n}/3`, q.tested, '', '#d2828c');
  if (!d) { lab.setState({ emo: '🪞', title: q.ask, lead: q.askLead, body: '', extra: '' }); lab.setFacts([]); return; }
  const p = S.tp[i], verdict = i === 1 ? q.mp[p === 'yes' ? 0 : 1] : (i === 0 ? p === 'yes' : p === 'no') ? q.good : q.bad;
  const ok = i === 1 ? '🤔' : verdict === q.good ? '✅' : '🤔';
  lab.setState({ emo: ok, title: q.res[i][0], lead: `${verdict} ${q.res[i][1]}`, body: '', extra: `<p class="cp-note">${esc(q.note)}</p>` });
  lab.setFacts(q.facts);
}
function renderWire(t) {
  const q = t.wire, ph = S.wphase;
  lab.setGlow('rgba(79, 183, 230, .26)');
  $('wrL').textContent = q.bend; $('wrV').textContent = `${S.bend}%`; $('wrS').value = S.bend; $('wrS').disabled = ph === 'fish';
  $('wrGo').textContent = q.fish; $('wrGo').disabled = ph === 'fish';
  lab.setReadout(`${S.bend}%`, q.sub, '', '#4fb7e6');
  if (ph === 'done') { lab.setState({ emo: S.wok ? '✅' : '🤔', title: S.wok ? q.ok : q.no, lead: S.wok ? q.okLead : q.noLead, body: '', extra: '' }); lab.setFacts(S.wok ? q.facts : []); }
  else if (ph === 'fish') { lab.setState({ emo: '🪝', title: q.run, lead: q.runLead, body: '', extra: '' }); lab.setFacts([]); }
  else { lab.setState({ emo: '🪝', title: q.ask, lead: q.askLead, body: '', extra: '' }); lab.setFacts([]); }
}
function renderMeer(t) {
  const q = t.meer, ph = S.mphase;
  lab.setGlow('rgba(240, 190, 110, .3)');
  $('meAge').innerHTML = [[0, q.young], [1, q.old]].map(([v, l]) => `<button class="chip${S.mage === v ? ' on' : ''}" data-act="age" data-v="${v}"${ph === 'give' ? ' disabled' : ''}>${esc(l)}</button>`).join('');
  $('meGo').textContent = q.give; $('meGo').disabled = ph === 'give';
  lab.setReadout(esc(q.pill[S.mage]), q.val, '', '#e0a458');
  const st = S.mage === 0 ? [q.youngT, q.youngL] : [q.oldT, q.oldL];
  lab.setState({ emo: '🦂', title: st[0], lead: st[1], body: ph === 'done' ? q.given : '', extra: '' });
  lab.setFacts(ph === 'done' ? q.facts : []);
}
render();
</script>
