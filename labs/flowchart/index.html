// run the algorithm to the end, remembering every box the ball visits (the ball is then animated over this list)

  if (k === 'question') {
    const p = QP[pi], ans = sm.ev.find((e) => e.ans !== null).ans;
    const g1 = { key: 'path', title: t.ask.path, right: ans ? 'yes' : 'no', opts: [{ v: 'yes', l: `${t.Yes} · ${opLabel(p.y)}` }, { v: 'no', l: `${t.No} · ${opLabel(p.n)}` }] };
    const out = outG([apply(ans ? p.n : p.y, n), n, sm.out + 1, sm.out - 1]);
    return S.g.path == null ? [g1] : [g1, out];
  }
  if (k === 'loop') {
    if (LP[pi].n === 0) return [{ key: 'stops', title: t.ask.stops, right: sm.done ? 'yes' : 'no', opts: [{ v: 'yes', l: t.stops[0] }, { v: 'no', l: t.stops[1] }] }];
    const steps = sm.ev.filter((e) => e.id === 'm'), last = steps[steps.length - 1], c = sm.loops;
    const lo = uniq([c, c + 1, c > 0 ? c - 1 : c + 2]);
    return [outG([last ? last.vIn : sm.out - 1, apply(LP[pi], sm.out), sm.out + 1, sm.out - 1]),
      { key: 'loops', title: t.ask.loops, right: c, opts: shuffled(lo, seed + 5).map((v) => ({ v, l: String(v) })) }];
  }
  return [];
}
function judge() {
  const k = kind(), sm = R.sim, g = S.g, n = curN();
  if (k === 'steps') return { ok: g.out === sm.out };
  if (k === 'question') { const y = sm.ev.find((e) => e.ans !== null).ans; return { pathOk: g.path === (y ? 'yes' : 'no'), outOk: g.out === sm.out, y, ok: g.path === (y ? 'yes' : 'no') && g.out === sm.out }; }
  if (LP[S.pi.loop].n === 0) return { ok: g.stops === (sm.done ? 'yes' : 'no') };
  return { outOk: g.out === sm.out, loopOk: g.loops === sm.loops, ok: g.out === sm.out && g.loops === sm.loops, n };
}
function pickOpt(gk, raw) {
  if (S.phase !== 'predict') return;
  S.g[gk] = gk === 'path' || gk === 'stops' ? raw : +raw; sfx.click();
  const k = kind(), need = k === 'steps' ? ['out'] : k === 'question' ? ['path', 'out'] : LP[S.pi.loop].n === 0 ? ['stops'] : ['out', 'loops'];
  if (need.every((x) => S.g[x] != null)) { S.phase = 'run'; startRun(simNow(), Infinity, 0); showStage(); }
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

// --- controls --------------------------------------------------------------------------------------------------
function setN(v) {
  const k = kind(), [lo, hi] = RANGE[k], n = clamp(Math.round(v), lo, hi);
  if (n === S.n[k]) return;
  S.n[k] = n; sfx.tick(); reset();
}
$('ctrlBody').addEventListener('input', (ev) => { if (ev.target.id === 'flRange') { setN(+ev.target.value); render(); } });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, k = kind();
  if (a === 'dec') setN(curN() - 1);
  else if (a === 'inc') setN(curN() + 1);
  else if (a === 'pre') { S.pi[k] = +b.dataset.i; sfx.click(); S.n[k] = clamp(S.n[k], ...RANGE[k]); reset(); }
  else if (a === 'opt') pickOpt(b.dataset.g, b.dataset.v);
  else if (a === 'step') { R.allow = R.i + 1; sfx.tick(); }
  else if (a === 'run') { R.allow = Infinity; sfx.click(); }
  else if (a === 'replay') { S.phase = 'run'; startRun(simNow(), Infinity, 0); sfx.click(); showStage(); }
  else if (a === 'fresh') {
    const [lo, hi] = RAND[k]; let n = S.n[k]; for (let i = 0; i < 20 && n === S.n[k]; i++) n = lo + Math.floor(Math.random() * (hi - lo + 1));
    S.n[k] = n; sfx.click(); reset();
  } else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
    if (S.sec === 'hidden') S.hd = { op: Math.floor(Math.random() * 3), tries: [], shown: false, pick: null };
    reset();
  } else if (a === 'czn') { S.n.collatz = +b.dataset.v; sfx.click(); reset(); }
  else if (a === 'czrun') {
    const s = simNow(); startRun(s, Infinity, clamp(9 / s.ev.length, 0.03, 0.4)); sfx.click(); showStage();
  } else if (a === 'try') { startRun(simNow(), Infinity, 0); sfx.click(); showStage(); }
  else if (a === 'hpick') {
    S.hd.pick = +b.dataset.i; S.hd.shown = true; sfx.click(); (S.hd.pick === S.hd.op ? sfx.good : sfx.bad)(); setProg();
  } else if (a === 'hnew') { S.hd = { op: (S.hd.op + 1 + Math.floor(Math.random() * 2)) % 3, tries: [], shown: false, pick: null }; sfx.click(); reset(); }
  render();
});
function fitStage() {
  const st = $('stage');
  st.style.height = innerWidth <= 760 ? `${Math.min(680, Math.round(PRG.H * (st.clientWidth || 343) / 300) + 4)}px` : '';
}
addEventListener('resize', fitStage);

// --- one render per change ------------------------------------------------------------------------------------
function readout() {
  const k = kind(), n = curN(), t = T[lang];
  if (k === 'hidden') {
    const l = S.hd.tries[S.hd.tries.length - 1];
    lab.setReadout(l ? `${l.x} → ${l.y}` : '? → ?', t.hd.tries(S.hd.tries.length), '', ACC);
  } else if (k === 'collatz') lab.setReadout(`${n} → ${R.reached ? R.val : '…'}`, `${R.sim ? R.steps : 0} ${t.cz.steps}`, '', ACC);
  else lab.setReadout(S.phase === 'predict' ? `${n} → ?` : `${n} → ${R.reached ? fmt(R.val) : '…'}`, k === 'loop' && S.phase !== 'predict' ? t.s.loopRan(R.loops) : '', '', ACC);
  const tr = k !== 'hidden' && (S.phase !== 'predict' || k === 'collatz') && R.vals.length ? `${t.trail}: ${R.vals.map(fmt).join(' → ')}` : '';
  if ($('flTrail').textContent !== tr) $('flTrail').textContent = tr;
}
const live = readout;

function stateFor(t) {
  const k = kind(), n = curN(), s = t.s;
  if (k === 'collatz') {
    if (R.finished && R.reached) { const [a, b] = t.cz.done(n, R.sim.steps, Math.max(...R.sim.seq)); return { emo: '🔁', title: a, lead: b }; }
    return R.sim ? { emo: '🔁', title: t.cz.rolling[0], lead: t.cz.rolling[1] } : { emo: '🔁', title: t.cz.ready[0], lead: t.cz.ready[1] };
  }
  if (k === 'hidden') {
    const h = S.hd, op = opLabel(HID[h.op]);
    if (h.pick != null) { const [a, b] = h.pick === h.op ? t.hd.right(op) : t.hd.wrong(op); return { emo: h.pick === h.op ? '✅' : '🤔', title: a, lead: b }; }
    if (h.tries.length >= 3) return { emo: '🕵️', title: t.hd.pickT, lead: t.hd.pickL };
    return { emo: '🕵️', title: t.hd.ready[0], lead: t.hd.ready[1] };
  }
  if (S.phase === 'predict') {
    if (k === 'steps') return { emo: '🧮', title: s.predSteps[0], lead: s.predSteps[1](n) };
    if (k === 'question') return S.g.path == null ? { emo: '🔷', title: s.predQ[0], lead: s.predQ[1](n) } : { emo: '🔷', title: s.predQ2[0], lead: s.predQ2[1] };
    return LP[S.pi.loop].n === 0 ? { emo: '🔁', title: s.predStop[0], lead: s.predStop[1](n) } : { emo: '🔁', title: s.predLoop[0], lead: s.predLoop[1](n) };
  }
  if (S.phase === 'run') return { emo: '🎱', title: s.rolling[0], lead: s.rolling[1] };
  const j = judge(), sm = R.sim, g = S.g, title = j.ok ? s.right : s.miss, emo = j.ok ? '✅' : '🤔';
  if (k === 'steps') {
    const rev = OPS_STEPS[S.pi.steps].slice().reverse().reduce((v, op) => apply(op, v), n);
    return { emo, title, lead: j.ok ? `${n} → ${sm.seq.join(' → ')}` : `${s.youSaid(g.out)} ${s.ballSays(sm.out)}`, body: s.order(rev) };
  }
  if (k === 'question') {
    const parts = [s.ans(j.y)];
    if (!j.pathOk) parts.push(s.youPath(g.path === 'yes' ? t.yes : t.no));
    if (!j.outOk) parts.push(s.youSaid(g.out), s.ballSays(sm.out));
    return { emo, title, lead: parts.join(' '), body: j.ok ? `${n} → ${sm.seq.join(' → ')}` : '' };
  }
  if (LP[S.pi.loop].n === 0) {
    if (!sm.done) return { emo: j.ok ? '✅' : '⚠️', title: j.ok ? `${s.right} ${s.neverTitle}` : s.neverTitle, lead: s.never, body: '' };
    return { emo, title, lead: s.zero, body: '' };
  }
  const parts = [];
  if (!j.outOk) parts.push(s.youSaid(g.out), s.ballSays(sm.out));
  if (!j.loopOk) parts.push(s.loopsSaid(g.loops));
  parts.push(s.loopRan(sm.loops));
  return { emo, title, lead: parts.join(' '), body: sm.loops === 0 ? s.zero : `${n} → ${sm.seq.join(' → ')}` };
}

function render() {
  const t = T[lang], k = kind(), reg = isReg(), unlocked = secret.unlocked();
  setProg(); fitStage();
  lab.setGlow('rgba(255, 190, 60, .2)');
  // presets
  $('flPre').style.display = reg ? '' : 'none';
  if (reg) {
    const items = k === 'steps' ? OPS_STEPS.map((ops) => ops.map(opLabel).join(' → ')) : k === 'question' ? QP.map((p) => t.q[p.qk].join(' ')) : LP.map(opLabel);
    $('flPre').innerHTML = `<span class="fl-lbl">${esc(k === 'steps' ? t.rowSteps : k === 'question' ? t.rowQ : t.rowRep)}</span><div class="chips">${items.map((l, i) =>
      `<button class="chip ${i === S.pi[k] ? 'on' : ''}" data-a="pre" data-i="${i}">${esc(l)}</button>`).join('')}</div>`;
  }
  // input
  const [lo, hi] = RANGE[k], n = curN(), busy = !R.finished;
  $('flInL').textContent = t.start;
  const rg = $('flRange');
  if (rg.min !== String(lo)) rg.min = lo;
  if (rg.max !== String(hi)) rg.max = hi;
  if (rg.value !== String(n)) rg.value = n;
  $('flNum').textContent = n;
  document.querySelectorAll('#flIn .fl-sb').forEach((b) => { b.disabled = (b.dataset.a === 'dec' && n <= lo) || (b.dataset.a === 'inc' && n >= hi); });
  // prediction groups
  let ask = '';
  if (reg) {
    for (const g of groups()) {
      ask += `<div class="fl-q"><div class="t">${esc(g.title)}</div><div class="fl-opts">${g.opts.map((o) => {
        const cls = S.phase === 'done' ? (o.v === g.right ? 'good' : S.g[g.key] === o.v ? 'bad' : '') : S.g[g.key] === o.v ? 'on' : '';
        return `<button class="fl-opt ${cls}" data-a="opt" data-g="${g.key}" data-v="${o.v}"${S.phase !== 'predict' ? ' disabled' : ''}>${esc(o.l)}</button>`;
      }).join('')}</div></div>`;
    }
  }
  $('flAsk').innerHTML = ask;
  $('flRun').innerHTML = reg && S.phase === 'run' ? `<button class="btn ghost" data-a="step">${esc(t.step)}</button><button class="btn" data-a="run">${esc(t.run)}</button>`
    : reg && S.phase === 'done' ? `<button class="btn ghost" data-a="replay">${esc(t.replay)}</button><button class="btn" data-a="fresh">${esc(t.fresh)}</button>` : '';
  $('flRun').style.display = $('flRun').innerHTML ? '' : 'none';
  // secret panels
  let sp = '';
  if (k === 'collatz') {
    sp = `<div class="fl-row"><div class="chips">${[7, 27].map((v) => `<button class="chip ${n === v ? 'on' : ''}" data-a="czn" data-v="${v}">${v}</button>`).join('')}</div>
      <button class="btn" data-a="czrun">${esc(R.sim ? t.replay : t.run)}</button></div>`;
  } else if (k === 'hidden') {
    const h = S.hd;
    sp = `<div class="fl-row"><button class="btn" data-a="try"${busy || h.pick != null ? ' disabled' : ''}>${esc(t.hd.try)}</button><button class="btn ghost" data-a="hnew">${esc(t.hd.fresh)}</button></div>
      <div class="fl-tries">${h.tries.map((r) => `<div>${r.x} → ${r.y}</div>`).join('')}</div>`;
    if (h.tries.length >= 3) sp += `<div class="fl-q"><div class="t">${esc(t.hd.pickT)}</div><div class="fl-opts">${HID.map((op, i) => {
      const cls = h.pick == null ? '' : i === h.op ? 'good' : h.pick === i ? 'bad' : '';
      return `<button class="fl-opt ${cls}" data-a="hpick" data-i="${i}"${h.pick != null ? ' disabled' : ''}>${esc(opLabel(op))}</button>`;
    }).join('')}</div></div>`;
  }
  $('flSecP').innerHTML = sp;
  const sc = (kk, emo, nm) => `<button class="chip secret ${unlocked ? 'open' : ''} ${S.sec === kk ? 'on' : ''}" data-a="sec" data-k="${kk}">${unlocked ? `${emo} ${esc(nm)}` : '🔒 ???'}</button>`;
  $('flSec').innerHTML = sc('collatz', '🔁', t.secrets.a[0]) + sc('hidden', '🕵️', t.secrets.b[0]);
  readout();
  lab.setState({ ...stateFor(t), body: stateFor(t).body ?? '', extra: '' });
  lab.setFacts([t.facts[FACT[k]]]);
}
reset(); render();
</script>
