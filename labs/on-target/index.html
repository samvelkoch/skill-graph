function newRound() {
  const r = mulberry((Math.random() * 1e9) | 0), kinds = [[1, 1], [1, 0], [0, 1], [0, 0]];
  for (let i = 3; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }
  S.round = kinds.map(([tight, tru]) => {
    const n = 6, sd = tight ? 0.07 : 0.3;
    let p = Array.from({ length: n }, () => [gauss(r), gauss(r)]);
    const mx = mean(p.map((q) => q[0])), my = mean(p.map((q) => q[1]));
    p = p.map((q) => [q[0] - mx, q[1] - my]);
    const rms = Math.sqrt(p.reduce((a, q) => a + q[0] ** 2 + q[1] ** 2, 0) / (2 * n)) || 1;
    const dir = r() < .5 ? -1 : 1, ox = tru ? 0 : dir * (0.52 + r() * 0.08), oy = tru ? 0 : (r() - .5) * 0.3;
    p = p.map((q) => { let x = q[0] / rms * sd + ox, y = q[1] / rms * sd + oy; const d = Math.hypot(x, y); if (d > 1.1) { x *= 1.1 / d; y *= 1.1 / d; } return [x, y]; });
    return { tight: !!tight, tru: !!tru, shots: p, say: { tight: null, tru: null } };
  });
  S.sel = 0; S.checked = false; S.t0 = now();
}

  $('th_ctl').innerHTML = `<div class="ot-row">${btn('dip', 'ice', k.ice)}${btn('dip', 'boil', k.boil)}${btn('dip', 'tea', k.tea)}</div>
    <div class="ot-row"><span class="ot-q" style="margin:0">${esc(k.fix)}</span>${btn('fix', -1, '−')}<b style="min-width:62px;text-align:center;font-size:16px">${esc(k.fixV(th.corr))}</b>${btn('fix', 1, '+')}</div>`;
  lab.setReadout(th.last === null ? '—' : `${th.last} °C`, th.last === null ? k.sub0 : k.sub, both ? `${k.errL} ${sgn(th.off, 0)} °C` : '', '#6eaaf0');
  let st;
  if (th.tea !== null) {
    const fixed = th.tea - th.corr;
    st = !both ? { emo: '☕', title: k.tTea(th.tea), lead: k.lNoD }
      : th.corr === th.off ? { emo: '✅', title: k.tTea(th.tea), lead: k.lOk(fixed) } : { emo: '☕', title: k.tTea(th.tea), lead: k.lNo };
  } else if (both) st = { emo: '🌡️', title: th.off > 0 ? k.hi(th.off) : k.lo(-th.off), lead: k.lBoth };
  else if (th.ice !== null) st = { emo: '🧊', title: k.tI(th.ice), lead: k.lI };
  else if (th.boil !== null) st = { emo: '♨️', title: k.tB(th.boil), lead: k.lB };
  else st = { emo: '🌡️', title: k.t0, lead: k.l0 };
  lab.setState({ ...st, body: th.last === null ? k.b0 : '', extra: '' });
  lab.setFacts([]);
}

function rOutlier(t) {
  const k = t.ou, wv = S.ou, all = [...BASE, wv], dm = mean(all) - mean(BASE), dd = median(all) - median(BASE);
  lab.setGlow('rgba(255, 210, 110, .22)');
  $('ou_l').textContent = k.slide; $('ou_v').textContent = loc(`${wv.toFixed(1)} ${t.u.g}`);
  lab.setReadout(`${mean(all).toFixed(2)} ${t.u.g}`, k.sub(median(all).toFixed(2)), `${k.meanL} ${sgn(dm, 2)} · ${k.medL} ${sgn(dd, 2)}`, '#ffd27a');
  lab.setState(Math.abs(wv - 50) < 1.5 ? { emo: '🧮', title: k.t0, lead: k.l0, body: k.b0, extra: '' } : { emo: '🧮', title: k.tM, lead: k.lM(Math.abs(dm).toFixed(2), Math.abs(dd).toFixed(2)), body: k.bM, extra: '' });
  lab.setFacts([]);
}
render();
</script>
