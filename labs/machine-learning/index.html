  const gr = c.createLinearGradient(0, L.my, 0, L.my + L.mh); gr.addColorStop(0, fur(1)); gr.addColorStop(0.5, fur(0.5)); gr.addColorStop(1, fur(0));
  rr(c, 5, L.my + 4, 8, L.mh - 8, 4); c.fillStyle = gr; c.fill();
  c.fillStyle = '#98A0B8'; c.font = '700 10.5px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.save(); c.translate(21, L.my + L.mh / 2); c.rotate(-Math.PI / 2); c.fillText(t.axisY, 0, 0); c.restore();
  const ay = L.my + L.mh + 10;
  c.fillText(t.axisX, L.mx + L.mw / 2, ay);
  face(c, L.mx + 10, ay + 1, 5.5, 0, 0.6, 0.9); face(c, L.mx + L.mw - 10, ay + 1, 5.5, 1, 0.6, 0.9);

  // test animals (never used for teaching)
  if (lab.view !== 'teach') TEST.forEach((q, i) => {
    const x = sx(q.e), y = sy(q.l), ok = M.correct[i], spoiled = S.secret === 's1' && S.cmp && S.cmp.item === i && ex.some((z) => z.wrong);
    c.beginPath(); c.arc(x, y, 4.2, 0, 7); c.fillStyle = COL[q.lab]; c.fill();
    c.lineWidth = ok === false ? 2.2 : 1.6; c.strokeStyle = ok === null ? '#8890a8' : ok ? '#3ddc97' : '#ff5b5b';
    c.beginPath(); c.arc(x, y, 7, 0, 7); c.stroke();
    if (ok === false) { c.beginPath(); c.moveTo(x - 3, y - 3); c.lineTo(x + 3, y + 3); c.moveTo(x + 3, y - 3); c.lineTo(x - 3, y + 3); c.lineWidth = 1.4; c.strokeStyle = '#fff'; c.stroke(); }
    if (spoiled) { const k = (time * 1.4) % 1; c.beginPath(); c.arc(x, y, 9 + k * 16, 0, 7); c.strokeStyle = `rgba(255,91,91,${1 - k})`; c.lineWidth = 2.5; c.stroke(); }
  });

  // taught examples
  for (const g of ghosts) { c.globalAlpha = 1 - g.t; face(c, sx(g.e), sy(g.l), L.r * (1 + g.t * 0.5), g.e, g.l); c.globalAlpha = 1; }
  for (const q of ex) {
    const k = ease(q.t), x = lerp(q.fx, sx(q.e), k), y = lerp(q.fy, sy(q.l), k);
    c.beginPath(); c.arc(x, y, L.r + 2.4, 0, 7); c.fillStyle = 'rgba(10,12,20,.55)'; c.fill();
    c.lineWidth = 2.4; c.strokeStyle = COL[q.lab]; c.stroke();
    face(c, x, y, L.r * 0.88, q.e, q.l);
    if (q.wrong && k >= 1) { c.beginPath(); c.arc(x + L.r * 0.85, y - L.r * 0.95, 5.4, 0, 7); c.fillStyle = '#ff3b30'; c.fill(); c.fillStyle = '#fff'; c.font = '900 9px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('!', x + L.r * 0.85, y - L.r * 0.93); }
  }

  // the animal waiting in the tray, and where it sits on the map: the computer's guess
  const px = sx(card.e), py = sy(card.l), pr = predict(card.e, card.l, ex);
  c.setLineDash([4, 4]); c.lineWidth = 1.6; c.strokeStyle = 'rgba(255,255,255,.75)'; c.beginPath(); c.arc(px, py, L.r + 3, 0, 7); c.stroke(); c.setLineDash([]);
  face(c, px, py, L.r * 0.88, card.e, card.l, 0.6);
  bubble(c, px, py, pr, t);

  // tray
  const hot = (labv) => card.dragging && hit(L.basket[labv], { x: card.px, y: card.py });
  basket(c, 0, t, hot(0)); basket(c, 1, t, hot(1));
  c.fillStyle = 'rgba(152,160,184,.45)'; c.font = '700 16px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('◀', L.hx - L.cs / 2 - 16, L.hy); c.fillText('▶', L.hx + L.cs / 2 + 16, L.hy);
  const sc = card.dragging ? 1.12 : (0.6 + 0.4 * ease(card.pop));
  c.save(); c.translate(card.px, card.py); c.scale(sc, sc);
  if (card.dragging) { c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 18; c.shadowOffsetY = 6; }
  rr(c, -L.cs / 2, -L.cs / 2, L.cs, L.cs, 16); c.fillStyle = 'rgba(40,46,70,.95)'; c.fill(); c.shadowColor = 'transparent';
  c.lineWidth = 1.6; c.strokeStyle = 'rgba(255,255,255,.55)'; c.stroke();
  face(c, 0, L.cs * 0.04, L.cs * 0.27, card.e, card.l);
  c.restore();
  if (S.toast > 0) {
    c.font = '800 12px Nunito, sans-serif'; const tw = c.measureText(t.full).width + 22;
    rr(c, L.hx - tw / 2, L.my + L.mh - 34, tw, 26, 13); c.fillStyle = 'rgba(255,91,91,.92)'; c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t.full, L.hx, L.my + L.mh - 21);
  }
});

// ---------------------------------------------------------------------------------------------------------
// 7. Pointer: drag the animal into a basket, tap the map to probe, tap an example to remove it
// ---------------------------------------------------------------------------------------------------------
const cv = $('cv');
const pos = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
let drag = null;
function setProbe(p) {
  card.e = clamp((p.x - L.mx) / L.mw, 0.03, 0.97); card.l = clamp(1 - (p.y - L.my) / L.mh, 0.03, 0.97); card.pop = 0.3; sfx.tick();
}
cv.addEventListener('pointerdown', (ev) => {
  const p = pos(ev), half = L.cs / 2 + 8;
  if (Math.abs(p.x - card.px) < half && Math.abs(p.y - card.py) < half) {
    drag = { dx: card.px - p.x, dy: card.py - p.y }; card.dragging = true; cv.setPointerCapture(ev.pointerId); sfx.tick(); return;
  }
  for (const labv of [0, 1]) if (hit(L.basket[labv], p)) { addExample(card.e, card.l, labv, card.px, card.py); return; }
  if (!inMap(p)) return;
  let best = -1, bd = 1e9;
  ex.forEach((q, i) => { const d = Math.hypot(sx(q.e) - p.x, sy(q.l) - p.y); if (d < bd) { bd = d; best = i; } });
  if (best >= 0 && bd < L.r * 1.2) removeExample(best); else setProbe(p);
});
cv.addEventListener('pointermove', (ev) => { if (!drag) return; const p = pos(ev); card.px = p.x + drag.dx; card.py = p.y + drag.dy; });
const endDrag = (ev) => {
  if (!drag) return; const p = pos(ev); drag = null; card.dragging = false;
  for (const labv of [0, 1]) if (hit(L.basket[labv], p) || hit(L.basket[labv], { x: card.px, y: card.py })) { addExample(card.e, card.l, labv, card.px, card.py); return; }
  if (inMap(p)) setProbe(p);
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { drag = null; card.dragging = false; });

newCard(); compute(); render();
</script>
