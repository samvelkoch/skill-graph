const TAU = Math.PI * 2;
const TEAL = '#2fc3b0', ORANGE = '#ff8a2a', GREEN = '#3ddc97', GOLD = '#ffd34d';
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeBack = (x) => { const u = clamp01(x) - 1; return 1 + 2.7 * u * u * u + 1.7 * u * u; };
const hx = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const toHex = (a) => '#' + a.map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const p = hx(a), q = hx(b); return toHex(p.map((v, i) => v + (q[i] - v) * t)); };
const shade = (h, k) => (k >= 0 ? mix(h, '#ffffff', k) : mix(h, '#000000', -k));
const rgba = (h, a) => { const [r, g, b] = hx(h); return `rgba(${r},${g},${b},${a})`; };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const now = () => performance.now() / 1000;
const FONT = 'Nunito, system-ui, sans-serif';
function rr(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

const mode = () => S.sec || lab.view;
const X = (v) => v / G.step * G.sp;
const busy = () => !!(roo.job || roo.queue.length || joey.job || joey.queue.length);
const askEl = Object.assign(document.createElement('div'), { className: 'sk-ask card' });
$('overlay').append(askEl);

function mkRun(m) {
  const both = m === 'hop' && S.j.hop === 'both';
  const base = {
    hop: { step: 1, max: 100, j: both ? 8 : S.j.hop, dir: 1, start: 0 },
    big: { step: 50, max: 1000, j: S.j.big, dir: 1, start: S.bigStart },
    quarter: { step: 25, max: 200, j: 25, dir: 1, start: 0 },
    back: { step: 1, max: 100, j: 8, dir: -1, start: 96 },
  }[m];
  const r = { kind: m, both, ...base, cur: base.start, jcur: 0, n: 0, terms: base.start ? [base.start] : [], jterms: [], rings: {}, ask: null, verdict: null, glow: null, ended: false, lastAsked: false };

  r.ended = !canHop(r);
  return r;
}
const canHop = (r) => { const nx = r.cur + r.dir * r.j; return nx >= 0 && nx <= r.max; };
function mkTask(i) {
  const k = TASKS[i], right = k.total / k.j, opts = [right, k.total, k.total - k.j];
  for (let a = opts.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [opts[a], opts[b]] = [opts[b], opts[a]]; }
  return { ti: i, total: k.total, j: k.j, right, opts, guess: null, shown: false, done: false, n: 0, pos: 0, landed: [] };
}
function enter() {
  const m = mode();
  dust.length = 0; bags.length = 0;
  for (const k of Object.keys(pops)) delete pops[k];
  for (const a of [roo, joey]) { a.queue.length = 0; a.job = null; a.up = 0; a.sq = 0; a.tilt = 0; }
  roo.face = m === 'back' ? -1 : 1; joey.face = 1;
  if (m === 'groups') { Gp = mkTask(S.ti); R = null; } else { R = mkRun(m); Gp = null; }
  G.snap = true;
  render();
}

// --- hop engine --------------------------------------------------------------------------------------------
const dur1 = (d) => 0.15 + 0.42 + Math.min(0.3, d / 900) + 0.25;
const queueHop = (a, tx, spd, onLand) => a.queue.push({ tx, spd, onLand });
function puff(wx, n, col = [238, 200, 160]) {
  for (let i = 0; i < n; i++) dust.push({ x: wx + (Math.random() - 0.5) * 18, y: 2, vx: (Math.random() - 0.5) * 60, vy: 14 + Math.random() * 26, r: 3 + Math.random() * 4, life: 0, max: 0.5 + Math.random() * 0.3, col });
}
function stepActor(a, dt) {
  if (!a.job && a.queue.length) {
    const q = a.queue.shift(), d = Math.abs(q.tx - a.x);
    a.job = { fx: a.x, tx: q.tx, t: 0, onLand: q.onLand, arc: clamp(d * 0.42, G.K * 0.28, G.K * 0.72), tc: 0.15 * q.spd, tf: (0.42 + Math.min(0.3, d / 900)) * q.spd, tl: 0.25 * q.spd, took: false, landed: false };
    if (q.tx !== a.x) a.face = q.tx > a.x ? 1 : -1;
  }
  const j = a.job;
  if (!j) { a.sq = 0; a.up = 0; a.tilt = 0; return; }
  j.t += dt;
  if (j.t < j.tc) { a.sq = easeOut(j.t / j.tc); a.up = 0; a.tilt = 0; }
  else if (j.t < j.tc + j.tf) {
    const u = (j.t - j.tc) / j.tf;
    if (!j.took) { j.took = true; puff(a.x, 6); }
    a.x = lerp(j.fx, j.tx, u); a.up = j.arc * 4 * u * (1 - u);

    if (!j.landed) { j.landed = true; a.x = j.tx; a.up = 0; puff(j.tx, 8); j.onLand && j.onLand(); }

    if (!j.landed) { j.landed = true; a.x = j.tx; puff(j.tx, 8); j.onLand && j.onLand(); }

}
const ring = (v, k) => { R.rings[v] = Object.assign(R.rings[v] || {}, { [k]: true }); };

function mkAsk() {
  const cur = R.cur, right = cur + R.j;
  const d1 = R.kind === 'hop' ? cur + 2 : cur + 10;
  const d2 = R.kind === 'hop' ? cur / 2 : (R.j === 50 ? cur + 100 : cur + 50);
  const opts = [right, d1, d2];
  for (let a = opts.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [opts[a], opts[b]] = [opts[b], opts[a]]; }
  return { right, opts, guess: null };
}
function startHop() {
  const dir = R.dir, to = R.cur + dir * R.j;
  if (R.both) {
    const j1 = R.jcur + 4, j2 = R.jcur + 8;
    const dj = dur1(Math.abs(X(j1) - X(R.jcur))) * 0.55, dm = dur1(Math.abs(X(to) - X(R.cur)));

    queueHop(joey, X(j2), 0.55, () => { R.jcur = j2; R.jterms.push(j2); ring(j2, 'j'); sfx.tick(); render(); });
    queueHop(roo, X(to), (2 * dj) / dm, () => { R.cur = to; R.n++; R.terms.push(to); ring(to, 'm'); R.ended = !canHop(R); sfx.snap(); render(); });
  } else {
    queueHop(roo, X(to), 1, () => {

}
function pressHop() {
  if (!R || busy()) return;

  if (R.ended) { if (!R.n) S.bigStart = 0; R = mkRun(R.kind); sfx.click(); G.snap = false; render(); return; }
  R.verdict = null; R.glow = null; R.ask = null;
  const ask = R.kind === 'big' || (R.kind === 'hop' && !R.both && R.n >= 5 && (R.n === 5 || (!R.lastAsked && Math.random() < 0.45)));
  R.lastAsked = ask;

}
function pick(o) {

  if (!R || !R.ask || R.ask.guess !== null) return;
  R.ask.guess = o; sfx.click();

}
function showHops() {
  if (!Gp || Gp.guess === null || Gp.shown) return;
  Gp.shown = true; sfx.click();
  for (let i = 1; i <= Gp.right; i++) {
    queueHop(roo, X(i * Gp.j), 0.6, () => {
      const v = i * Gp.j;
      Gp.pos = v; Gp.n = i; Gp.landed.push(v); bags.push({ v, t0: now() }); pops[v] = now();

// --- controls ----------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k;

  else if (a === 'hop') pressHop();

// --- one render per change: controls, ask card, readout, state card, facts -----------------------------------
const optsHTML = (opts, guess, right, done) => `<div class="sk-opts">${opts.map((o) => `<button class="sk-opt ${done ? (o === right ? 'good' : o === guess ? 'bad' : '') : (o === guess ? 'pick' : '')}" data-o="${o}"${done ? ' disabled' : ''}>${o}</button>`).join('')}</div>`;
const verdictHTML = (t, ok, eq, opts, guess, right) =>
  `<div class="sk-v" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.wrong)}</div><div class="sk-eq">${esc(eq)}</div>${optsHTML(opts, guess, right, true)}`;

function render() {
  if (!R && !Gp) return;
  const t = T[lang], m = mode(), open = secret.unlocked(), isBusy = busy();
  document.body.dataset.v = m;
  let ctrl = '', card = '', st, facts;
  if (m === 'groups') {
    const g = Gp;
    const label = g.done ? (g.ti === TASKS.length - 1 ? t.again : t.next) : t.show;
    const dis = g.done ? false : (g.guess === null || g.shown);
    ctrl = `<div class="sk-row"><button class="btn sk-go" data-act="${g.done ? 'next' : 'show'}"${dis ? ' disabled' : ''}>${esc(label)}</button></div>`;
    if (!g.shown) card = `<div class="sk-q">${esc(t.st.q(g.total, g.j))}</div>${optsHTML(g.opts, g.guess, g.right, false)}`;
    else if (g.done) card = verdictHTML(t, g.guess === g.right, `${g.right} × ${g.j} = ${g.total}`, g.opts, g.guess, g.right);

  } else {
    const askOpen = R.ask && R.ask.guess === null;
    if (m === 'hop') {
      ctrl += `<div class="sk-row">${[4, 8, 'both'].map((k) => `<button class="chip ${S.j.hop === k ? 'on' : ''}" data-act="j" data-k="${k}">${esc(k === 'both' ? t.both : t.jumpN(k))}</button>`).join('')}</div>`;
    } else if (m === 'big') {
      ctrl += `<div class="sk-row">${[50, 100].map((k) => `<button class="chip ${S.j.big === k ? 'on' : ''}" data-act="j" data-k="${k}">${esc(t.jumpN(k))}</button>`).join('')}</div>`;
      ctrl += `<div class="sk-row"><span class="sk-lbl">${esc(t.startAt)}</span>${[0, 150, 350, 950].map((k) => `<button class="chip ${S.bigStart === k ? 'on' : ''}" data-act="start" data-k="${k}">${k}</button>`).join('')}</div>`;
    }
    ctrl += `<div class="sk-row"><button class="btn sk-go" data-act="hop"${isBusy || askOpen ? ' disabled' : ''}>${esc(R.ended ? t.again : t.hop)}</button></div>`;
    if (askOpen) card = `<div class="sk-q">${esc(t.ask)}</div>${optsHTML(R.ask.opts, null, R.ask.right, false)}`;
    else if (R.verdict) card = verdictHTML(t, R.verdict.ok, `${R.verdict.from} + ${R.j} = ${R.verdict.to}`, R.ask.opts, R.ask.guess, R.ask.right);
    const s = t.st;
    if (askOpen) st = ['🤔', ...s.ask];
    else if (m === 'hop' && R.both) st = R.n ? ['🦘', ...s.both(R.n)] : ['🦘', ...s.both0];
    else if (m === 'quarter') st = R.n ? ['🪙', ...s.quarterN(R.n, R.cur)] : ['🪙', ...s.quarter0];
    else if (m === 'back') st = R.n ? ['⏪', ...s.backN(R.cur)] : ['⏪', ...s.back0];
    else if (R.ended && R.n) st = m === 'big' && R.cur === R.max ? ['🏆', ...s.bigGold] : ['🏁', ...s.end];

}

  rr(c, x0 + 2, gy + 1.5, sw - 4, 6, 3); c.fillStyle = 'rgba(255,255,255,.4)'; c.fill();
  if (o.glow) { rr(c, x0, gy, sw, sh, 8); c.fillStyle = 'rgba(61,220,151,.28)'; c.fill(); }
  let tx = x;
  if (o.coin) {
    const cx = x0 + 12, cy = gy + sh / 2 + 1;
    const cg = c.createRadialGradient(cx - 2, cy - 2, 1, cx, cy, 8);
    cg.addColorStop(0, '#fff3b8'); cg.addColorStop(1, '#f0b73a');
    c.fillStyle = cg; c.beginPath(); c.arc(cx, cy, 7.5, 0, TAU); c.fill(); c.strokeStyle = '#8a5a0c'; c.lineWidth = 1.4; c.stroke();
    c.beginPath(); c.arc(cx, cy, 4.2, 0, TAU); c.strokeStyle = 'rgba(138,90,12,.55)'; c.lineWidth = 1; c.stroke();
    tx = x + 9;
  }
  c.font = `${o.big ? 900 : 700} ${o.big ? 15 : 13}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = o.big ? '#5a2a08' : '#5b4026'; c.fillText(String(v), tx, gy + sh * 0.58 + 1);
  if (o.flag) {
    const px = x0 + sw - 4, wv = Math.sin(t * 4) * 2.5;
    c.strokeStyle = '#6e4f33'; c.lineWidth = 2; c.beginPath(); c.moveTo(px, gy + 2); c.lineTo(px, gy - 36); c.stroke();
    c.fillStyle = GOLD; c.strokeStyle = '#a56d12'; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(px, gy - 36); c.quadraticCurveTo(px + 9, gy - 34 + wv, px + 18, gy - 30); c.quadraticCurveTo(px + 9, gy - 26 - wv, px, gy - 24); c.closePath(); c.fill(); c.stroke();
  }
  c.restore();
  if (o.gold) for (let k = 0; k < 3; k++) sparkle(c, x + (k - 1) * 20, gy - 12 - (k % 2) * 12, 6 + k, 0.5 + 0.5 * Math.sin(t * 3 + k * 2));
}
function drawCloud(c, cx, cy, wd, t) {
  c.save(); c.translate(cx, cy + Math.sin(t * 3) * 2);
  const g = c.createLinearGradient(0, -wd * 0.4, 0, wd * 0.3);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cfc9e6');
  c.beginPath();
  for (const [ax, ay, r] of [[-0.26, 0.02, 0.2], [0, -0.1, 0.27], [0.27, 0.02, 0.2], [0, 0.08, 0.26], [-0.12, -0.04, 0.22], [0.14, -0.04, 0.22]]) { c.moveTo(ax * wd + r * wd, ay * wd); c.arc(ax * wd, ay * wd, Math.max(0, r * wd), 0, TAU); }
  c.lineWidth = 3; c.strokeStyle = '#9d95c2'; c.stroke(); c.fillStyle = g; c.fill();
  c.font = `900 18px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#5d4f94'; c.fillText('?', 0, 2);
  c.restore();
}
function drawBag(c, x, y, wd, j) {
  const hg = wd * 1.25;
  c.save(); c.translate(x, y);
  c.fillStyle = 'rgba(40,12,16,.3)'; c.beginPath(); c.ellipse(4, hg * 0.5, Math.max(0, wd * 0.5), 3.5, 0, 0, TAU); c.fill();
  if (j > 8) { // carrot tops poke out of a big sack
    for (let k = -1; k <= 1; k++) {
      c.fillStyle = '#ff8a2a'; c.beginPath(); c.moveTo(k * wd * 0.14 - 3, -hg * 0.45); c.lineTo(k * wd * 0.14, -hg * 0.45 - 8); c.lineTo(k * wd * 0.14 + 3, -hg * 0.45); c.fill();
      c.fillStyle = '#4caf50'; c.beginPath(); c.ellipse(k * wd * 0.14, -hg * 0.45 - 10, 2, 4, k * 0.4, 0, TAU); c.fill();
    }
  }
  const g = c.createLinearGradient(-wd / 2, -hg / 2, wd / 2, hg / 2);
  g.addColorStop(0, '#ecc994'); g.addColorStop(1, '#b4854d');
  c.beginPath(); c.moveTo(-wd * 0.18, -hg * 0.5);
  c.bezierCurveTo(-wd * 0.5, -hg * 0.18, -wd * 0.62, hg * 0.2, -wd * 0.42, hg * 0.42);
  c.quadraticCurveTo(0, hg * 0.58, wd * 0.42, hg * 0.42);
  c.bezierCurveTo(wd * 0.62, hg * 0.2, wd * 0.5, -hg * 0.18, wd * 0.18, -hg * 0.5); c.closePath();
  c.fillStyle = g; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#6e4a22'; c.stroke();
  c.strokeStyle = '#7a4a22'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(-wd * 0.22, -hg * 0.34); c.lineTo(wd * 0.22, -hg * 0.34); c.stroke();
  if (j <= 8) { // exactly j carrots on the front: 4 per row
    const rows = j / 4, sx = 7, sy = 11, x0 = -1.5 * sx, y0 = -((rows - 1) * sy) / 2 + 3;
    for (let r = 0; r < rows; r++) for (let k = 0; k < 4; k++) {
      c.save(); c.translate(x0 + k * sx, y0 + r * sy); c.rotate(0.35);
      c.fillStyle = '#ff8a2a'; c.beginPath(); c.ellipse(0, 0, 2.3, 4.6, 0, 0, TAU); c.fill();
      c.fillStyle = '#4caf50'; c.beginPath(); c.ellipse(0, -5.4, 1.6, 2.4, 0, 0, TAU); c.fill();
      c.restore();
    }
  } else {
    c.font = `900 13px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#4a2c14'; c.fillText(String(j), 0, 4);
  }
  c.restore();
}

// --- the kangaroo ------------------------------------------------------------------------------------------
const TAIL = new Path2D(), BODY = new Path2D();
TAIL.moveTo(-16, -50); TAIL.bezierCurveTo(-46, -46, -82, -26, -98, 0); TAIL.bezierCurveTo(-92, 8, -78, 9, -66, 5);
TAIL.bezierCurveTo(-50, -6, -34, -16, -12, -22); TAIL.closePath();
BODY.moveTo(-22, -30); BODY.bezierCurveTo(-34, -56, -14, -80, 6, -92); BODY.bezierCurveTo(18, -98, 30, -92, 30, -80);
BODY.bezierCurveTo(32, -64, 34, -48, 22, -34); BODY.bezierCurveTo(10, -22, -12, -20, -22, -30); BODY.closePath();

function drawRoo(c, o) {
  const { pal, sq, tilt } = o;
  c.save();
  c.translate(o.x, o.y); c.scale(o.face * o.s, o.s);
  c.scale(1 + 0.14 * sq, 1 - 0.2 * sq);
  c.translate(0, -45); c.rotate(tilt); c.translate(0, 45);
  c.lineJoin = 'round'; c.lineCap = 'round'; c.lineWidth = 1.6; c.strokeStyle = pal.line;
  const fur = c.createLinearGradient(-30, -120, 34, -10);
  fur.addColorStop(0, pal.fur[0]); fur.addColorStop(1, pal.fur[1]);
  // tail
  const tg = c.createLinearGradient(-16, -40, -98, 0);
  tg.addColorStop(0, pal.fur[1]); tg.addColorStop(1, pal.dark);
  c.fillStyle = tg; c.fill(TAIL); c.stroke(TAIL);
  // body, with light from the top left, the pale belly and the pouch
  c.fillStyle = fur; c.fill(BODY);
  c.save(); c.clip(BODY);
  const hl = c.createRadialGradient(-6, -80, 2, -6, -80, 52);
  hl.addColorStop(0, 'rgba(255,240,210,.55)'); hl.addColorStop(1, 'rgba(255,240,210,0)');
  c.fillStyle = hl; c.fillRect(-60, -120, 120, 120);
  c.fillStyle = pal.belly; c.beginPath(); c.ellipse(20, -54, 13, 26, 0.12, 0, TAU); c.fill();
  const shd = c.createLinearGradient(-20, -90, 30, -20);
  shd.addColorStop(0, 'rgba(60,20,10,0)'); shd.addColorStop(1, 'rgba(60,20,10,.22)');
  c.fillStyle = shd; c.fillRect(-60, -120, 120, 120);
  c.restore();
  c.stroke(BODY);
  c.fillStyle = '#7a4326'; c.beginPath(); c.ellipse(20, -45, 10, 5.5, 0.1, 0, TAU); c.fill();
  if (o.peek) {
    c.fillStyle = '#f8d9b0'; c.strokeStyle = '#7a4a28'; c.lineWidth = 1.2;
    for (const [ex, er] of [[16, -0.3], [24, 0.3]]) { c.beginPath(); c.ellipse(ex, -57, 2.6, 6, er, 0, TAU); c.fill(); c.stroke(); }
    c.beginPath(); c.arc(20, -49, 7, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = '#24120c'; c.beginPath(); c.arc(23, -50, 1.6, 0, TAU); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(23.6, -50.6, 0.6, 0, TAU); c.fill();
    c.fillStyle = '#3a2018'; c.beginPath(); c.arc(26.2, -47.5, 1.3, 0, TAU); c.fill();
    c.fillStyle = pal.belly; c.beginPath(); c.ellipse(20, -45, 10.5, 6.5, 0.1, 0, Math.PI); c.fill();
    c.strokeStyle = pal.line; c.lineWidth = 1.6;
  }
  // hind leg: shin and long foot, then the thigh
  c.strokeStyle = pal.dark; c.lineWidth = 9; c.beginPath(); c.moveTo(6, -20); c.lineTo(-4, -8); c.stroke();
  const fg = c.createLinearGradient(0, -8, 0, 2);
  fg.addColorStop(0, pal.foot[0]); fg.addColorStop(1, pal.foot[1]);
  c.fillStyle = fg; c.strokeStyle = pal.line; c.lineWidth = 1.6;
  c.beginPath(); c.ellipse(10, -3.5, 24, 4.6, 0, 0, TAU); c.fill(); c.stroke();
  c.save(); c.translate(-6, -32); c.rotate(-0.35);
  const th = c.createLinearGradient(-20, -26, 20, 28);
  th.addColorStop(0, pal.fur[0]); th.addColorStop(1, pal.fur[1]);
  c.fillStyle = th; c.beginPath(); c.ellipse(0, 0, 21, 28, 0, 0, TAU); c.fill(); c.stroke();
  c.restore();
  // little arm
  c.lineWidth = 7.5; c.strokeStyle = pal.dark; c.beginPath(); c.moveTo(22, -78); c.quadraticCurveTo(34, -74, 40, -62); c.stroke();
  c.lineWidth = 5; c.strokeStyle = pal.fur[1]; c.beginPath(); c.moveTo(22, -78); c.quadraticCurveTo(34, -74, 40, -62); c.stroke();
  c.fillStyle = pal.dark; c.beginPath(); c.ellipse(41, -61, 4, 3, 0.5, 0, TAU); c.fill();
  // ears, head
  c.lineWidth = 1.6; c.strokeStyle = pal.line;
  c.fillStyle = pal.fur[1]; c.beginPath(); c.ellipse(23, -118, 5, 13, -0.25, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = fur; c.beginPath(); c.ellipse(31, -120, 5.5, 14, 0.1, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = pal.ear; c.beginPath(); c.ellipse(31, -120, 2.8, 9, 0.1, 0, TAU); c.fill();
  c.fillStyle = fur; c.beginPath(); c.ellipse(31, -103, 14, 11.5, -0.12, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = shade(pal.fur[0], 0.3); c.beginPath(); c.ellipse(43, -98, 11, 7.5, 0.15, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,140,120,.35)'; c.beginPath(); c.ellipse(36, -96, 4, 2.5, 0, 0, TAU); c.fill();
  c.fillStyle = '#3a2018'; c.beginPath(); c.ellipse(52.5, -99, 4.2, 3.4, 0.1, 0, TAU); c.fill();
  c.lineWidth = 1.2; c.strokeStyle = pal.line; c.beginPath(); c.moveTo(45, -93); c.quadraticCurveTo(50, -90, 54, -94); c.stroke();
  c.fillStyle = '#24120c'; c.beginPath(); c.ellipse(36.5, -105, 3.6, Math.max(0.3, 3.6 * (o.blink ? 0.15 : 1)), 0, 0, TAU); c.fill();
  if (!o.blink) { c.fillStyle = '#fff'; c.beginPath(); c.arc(37.7, -106.4, 1.2, 0, TAU); c.fill(); }
  if (pal.scarf) {
    c.lineWidth = 1.2; c.fillStyle = pal.scarf; c.strokeStyle = shade(pal.scarf, -0.35);
    c.beginPath(); c.ellipse(24, -91, 11, 4.2, 0.6, 0, TAU); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(20, -88); c.lineTo(15, -78); c.lineTo(24, -82); c.closePath(); c.fill(); c.stroke();
  }
  c.restore();
}
function drawActor(c, a, t, peek) {
  const sx = a.x - G.camX, gy = G.gy, s = G.K * a.k / 135;
  const lift = clamp(a.up / (G.K * 0.7), 0, 1);
  c.save(); c.fillStyle = `rgba(40,12,16,${0.34 * (1 - lift * 0.55)})`;
  c.beginPath(); c.ellipse(sx + 22 * s, gy + 2, Math.max(0, 54 * s * (1 - lift * 0.3)), Math.max(0, 5 * s * (1 - lift * 0.3)), 0, 0, TAU); c.fill(); c.restore();
  const idle = a.job ? 0 : 0.05 * Math.sin(t * 2.4 + a.ph);
  drawRoo(c, { x: sx, y: gy - a.up, s, face: a.face, sq: a.sq + idle, tilt: a.tilt, pal: a.pal, blink: ((t + a.ph) % 4.3) < 0.13, peek });
}

// --- the frame ---------------------------------------------------------------------------------------------
function geom(w, h) {
  const m = mode();
  G.w = w; G.h = h;
  G.gy = Math.round(h * (m === 'groups' ? 0.55 : 0.62));
  G.K = clamp(Math.min(h * 0.31, w * 0.34), 84, 175) * 0.6 * (m === 'groups' ? 0.9 : 1);
  if (m === 'groups') { G.mx = Math.max(clamp(w * 0.1, 26, 56), 98 * G.K / 135 + 12); G.step = 1; G.sp = (w - 2 * G.mx) / Gp.total; G.ss = Gp.j * G.sp; }
  else { G.step = R.step; G.sp = m === 'big' ? w / 5.4 : m === 'quarter' ? w / 5 : clamp(w / 12.5, 26, 44); G.ss = G.sp; }
}
function pill(c, text, x, y, o = {}) {
  c.font = o.font || `800 13px ${FONT}`;
  const px = 9, bw = c.measureText(text).width + px * 2, bh = o.h || 24;
  let bx = o.align === 'right' ? x - bw : o.align === 'center' ? x - bw / 2 : x;
  bx = clamp(bx, 4, Math.max(4, G.w - bw - 4));
  c.save(); c.fillStyle = o.bg || 'rgba(24,14,28,.82)'; rr(c, bx, y, bw, bh, bh / 2); c.fill();
  if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = 1.5; c.stroke(); }
  c.fillStyle = o.fg || '#fff'; c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillText(text, bx + px, y + bh / 2 + 0.5);
  c.restore();
}
function drawStrips(c, t) {
  const m = mode(), y0 = G.gy + 40, tt = T[lang];
  const rows = R.both ? [{ a: R.jterms, col: TEAL }, { a: R.terms, col: ORANGE }] : [{ a: R.terms, col: m === 'quarter' ? GOLD : ORANGE }];
  rows.forEach((row, i) => {
    const y = y0 + i * 30;
    c.font = `800 15px ${FONT}`;
    const arr = row.a.map(String), tail = R.ended ? '' : ', …';
    const build = (s) => ({ pre: s > 0 ? '…, ' : '', head: arr.slice(s, -1).map((x) => x + ', ').join(''), last: arr.length ? arr[arr.length - 1] : '', tail: arr.length ? tail : '0' });
    const width = (b) => c.measureText(b.pre + b.head + b.last + b.tail).width;
    let st = 0, b = build(0);
    while (width(b) > G.w - 20 - 20 && st < arr.length - 1) b = build(++st);
    const bw = width(b) + 20;
    c.save(); c.fillStyle = 'rgba(24,14,28,.82)'; rr(c, 10, y, bw, 26, 13); c.fill(); c.strokeStyle = rgba(row.col, 0.6); c.lineWidth = 1.5; c.stroke();
    let x = 20; c.textBaseline = 'middle'; c.textAlign = 'left';
    const put = (s, col) => { c.fillStyle = col; c.fillText(s, x, y + 13.5); x += c.measureText(s).width; };
    put(b.pre + b.head, '#fff'); put(b.last, row.col); put(b.tail, '#fff');
    c.restore();
  });
}
function drawCounter(c, n) {
  const tt = T[lang], text = `${tt.jumps}: ${n}`, y = G.h - 32;
  c.font = `800 13px ${FONT}`;
  const bw = c.measureText(text).width + 44;
  c.save(); c.fillStyle = 'rgba(24,14,28,.82)'; rr(c, 10, y, bw, 26, 13); c.fill();
  c.translate(18, y + 7);
  c.fillStyle = '#c98a4d'; c.strokeStyle = '#6e4a22'; c.lineWidth = 1.3;
  c.beginPath(); c.moveTo(0, 0); c.lineTo(14, 0); c.quadraticCurveTo(14, 13, 7, 13); c.quadraticCurveTo(0, 13, 0, 0); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#f8d9b0'; c.beginPath(); c.arc(7, 0, 3.6, 0, TAU); c.fill(); c.stroke();
  c.restore();
  c.save(); c.fillStyle = '#fff'; c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillText(text, 38, y + 13.5); c.restore();
}

let wasBusyFlag = false;
canvasLoop($('cv'), (c, w, h, dt, t) => {
  if (!R && !Gp) return;
  geom(w, h);
  const m = mode(), groups = m === 'groups';
  // idle actors stand on the stone they last landed on (also follows a resize)
  if (!roo.job && !roo.queue.length) roo.x = X(groups ? Gp.pos : R.cur);
  if (R && R.both && !joey.job && !joey.queue.length) joey.x = X(R.jcur);
  stepActor(roo, dt); if (R && R.both) stepActor(joey, dt);
  for (let i = dust.length - 1; i >= 0; i--) {
    const d = dust[i]; d.life += dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= 0.96; d.vy *= 0.95;
    if (d.life > d.max) dust.splice(i, 1);
  }
  const b = busy(); if (b !== wasBusyFlag) { wasBusyFlag = b; render(); }
  const tgt = groups ? -G.mx : roo.x - (roo.face > 0 ? 0.2 : 0.8) * w;
  if (G.snap) { G.camX = tgt; G.snap = false; } else G.camX += (tgt - G.camX) * (1 - Math.exp(-5 * dt));

  drawBackdrop(c, t);
  drawGround(c);

  // stones
  if (groups) {
    for (const v of new Set([0, Gp.total, ...Gp.landed])) {
      const age = pops[v] !== undefined ? now() - pops[v] : undefined;
      drawStone(c, v, X(v) - G.camX, t, { big: true, r: Gp.landed.includes(v) ? { m: true } : undefined, flag: v === Gp.total, pop: age !== undefined && age < 0.45 ? age : undefined });
    }
  } else {
    const iMax = R.max / R.step;
    const i0 = Math.max(0, Math.floor((G.camX - 40) / G.ss)), i1 = Math.min(iMax, Math.ceil((G.camX + w + 40) / G.ss));
    for (let i = i0; i <= i1; i++) {
      const v = i * R.step;
      drawStone(c, v, i * G.ss - G.camX, t, {
        big: !!R.rings[v] || v === R.start, r: R.rings[v], glow: R.glow === v, coin: m === 'quarter',
        gold: (m === 'big' || m === 'quarter') && v === R.max, flag: (m === 'hop' && v === R.max) || (m === 'back' && v === 0),
      });
    }
  }

  // bags that drop after each hop
  let bagBottom = G.gy + 30;
  if (groups) {
    const bw = clamp(Math.min(36, G.ss - 6), 20, 38), hg = bw * 1.25, rest = G.gy + 24 + 8 + hg / 2;
    bagBottom = rest + hg / 2;
    bags.forEach((bg, idx) => {
      const u = (now() - bg.t0) / 0.5, y0 = G.gy - 40;
      let y = rest;
      if (u < 0.6) y = lerp(y0, rest, (u / 0.6) * (u / 0.6)); else if (u < 1) y = rest - 8 * Math.sin(((u - 0.6) / 0.4) * Math.PI);
      const x = X(bg.v) - G.camX;
      drawBag(c, x, y, bw, Gp.j);
      if (u >= 0.6) {
        c.fillStyle = 'rgba(24,14,28,.82)'; c.beginPath(); c.arc(x, rest + hg / 2 + 12, 10, 0, TAU); c.fill();
        c.font = `800 12px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(String(idx + 1), x, rest + hg / 2 + 12.5);
      }
    });
  }

  // animals
  drawActor(c, roo, t, m === 'hop' && !R.both);
  if (R && R.both) drawActor(c, joey, t, false);

  // dust
  for (const d of dust) {
    const a = (1 - d.life / d.max) * 0.6, r = Math.max(0, d.r * (1 + d.life * 2.2));
    c.fillStyle = `rgba(${d.col[0]},${d.col[1]},${d.col[2]},${a})`; c.beginPath(); c.arc(d.x - G.camX, G.gy + 3 - d.y, r, 0, TAU); c.fill();
  }

  // the cloud over the stone the child is guessing
  if (R && R.ask && R.ask.guess === null) {
    const cw = clamp(clamp(G.ss - 4, 16, 46) + 14, 38, 70);
    drawCloud(c, X(R.ask.right) - G.camX, G.gy + 11, cw, t);
  }

  // strip with the count written out, pouch counter, equation
  if (groups) {
    if (Gp.shown && !Gp.done) pill(c, T[lang].guess(Gp.guess), 10, 10, { font: `800 14px ${FONT}` });
    if (Gp.done) pill(c, `${Gp.right} × ${Gp.j} = ${Gp.total}`, G.w / 2, bagBottom + 26, { align: 'center', font: `900 20px ${FONT}`, h: 32, stroke: GOLD });
    drawCounter(c, Gp.n);
  } else { drawStrips(c, t); drawCounter(c, R.n); }
});

enter();
</script>
