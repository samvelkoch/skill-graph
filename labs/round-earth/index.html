  c.fillStyle = '#d8d2c2'; c.beginPath(); c.arc(dx, dy - 85, 12.5, 0.15, Math.PI - 0.15); c.fill(); c.beginPath(); c.moveTo(dx - 11, dy - 91); c.quadraticCurveTo(dx - 12, dy - 100, dx - 4, dy - 100); c.lineTo(dx - 6, dy - 94); c.closePath(); c.fill();
  c.fillStyle = '#2d241a'; c.beginPath(); c.arc(dx + 5, dy - 91, 1.4, 0, TAU); c.fill();
  // arm with a wax tablet and the stylus
  const wob = Math.sin(time * 5) * 1.4;
  c.strokeStyle = rob; c.lineWidth = 8; c.lineCap = 'round'; c.beginPath(); c.moveTo(dx + 9, dy - 72); c.quadraticCurveTo(dx + 26, dy - 56, dx + 34, dy - 56); c.stroke();
  c.strokeStyle = '#8a7a58'; c.lineWidth = 1; c.stroke();
  c.fillStyle = '#7d5230'; c.beginPath(); c.roundRect(dx + 24, dy - 70, 24, 30, 3); c.fill(); c.strokeStyle = '#3a2113'; c.lineWidth = 1.1; c.stroke();
  c.fillStyle = '#e0c88a'; c.fillRect(dx + 27, dy - 67, 18, 24);
  c.strokeStyle = '#5a4222'; c.lineWidth = 1; c.beginPath(); [0, 5, 10, 15].forEach((o) => { c.moveTo(dx + 29, dy - 62 + o); c.lineTo(dx + 43 - (o % 10 ? 4 : 0), dy - 62 + o); }); c.stroke();
  c.strokeStyle = '#3a2113'; c.lineWidth = 2; c.beginPath(); c.moveTo(dx + 40 + wob, dy - 44); c.lineTo(dx + 33, dy - 62); c.stroke();
  // the three cards: look, listen, write
  const cards = [['👀', 0], ['👂', 1], ['✍️', 2]], items = [];
  cards.forEach(([emo, i]) => {
    const p = easeOut((T0 - 0.5 - i * 0.7) / 0.5); if (p <= 0.01) return;
    const x = 8 + i * 118, y = 42 - (1 - p) * 14, cw = 108, ch = 62;
    c.save(); c.globalAlpha = p; c.shadowColor = 'rgba(0, 0, 0, .3)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
    const g = c.createLinearGradient(0, y, 0, y + ch); g.addColorStop(0, '#fffdf6'); g.addColorStop(1, '#ece5d2'); c.fillStyle = g; c.beginPath(); c.roundRect(x, y, cw, ch, 8); c.fill();
    c.shadowBlur = 0; c.shadowOffsetY = 0; c.strokeStyle = '#c8553d'; c.lineWidth = 1.2; c.stroke();
    c.save(); c.beginPath(); c.roundRect(x, y, cw, ch, 8); c.clip(); c.strokeStyle = '#c8553d'; c.lineWidth = 1.2; c.beginPath();
    for (let k = x + 2; k < x + cw - 8; k += 10) { c.moveTo(k, y + 9); c.lineTo(k + 10, y + 9); c.moveTo(k + 2, y + 9); c.lineTo(k + 2, y + 3); c.lineTo(k + 8, y + 3); c.lineTo(k + 8, y + 7); }
    c.stroke(); c.restore();
    c.fillStyle = '#2a1c08'; c.font = `22px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(emo, x + cw / 2, y + 28);
    c.fillStyle = '#3a2a1c'; c.font = `800 ${12.5 / SC}px Nunito, sans-serif`; c.fillText(t.hipCards[i], x + cw / 2, y + 50);
    c.restore();
  });
  c.restore();
}

// --- the frame: update the models by real time, then draw the right scene ------------------------------------
function tick(dt) {
  const s = S.ship, sd = S.shadow, st = S.stars;
  let live = false;
  const ft = s.flat ? 0 : 1; if (s.fa !== ft) s.fa += clamp(ft - s.fa, -dt / 0.7, dt / 0.7);
  if (s.sail) {
    s.sail.t = Math.min(1, s.sail.t + dt / 6); s.d = lerp(s.sail.from, 30, ease(s.sail.t)); live = true;
    if (s.sail.t >= 1) { s.sail = null; s.d = 30; needRender = true; }
  }
  if (sd.pick !== null) {
    sd.rv = Math.min(1, sd.rv + dt / 0.9);
    const sl = sil(sd.shape, sd.turn), target = Math.max(-sl.hz + 0.4 * SW.RM / SW.F, -27);
    sd.moonZ += (target - sd.moonZ) * (1 - Math.exp(-dt * 2.2)); if (Math.abs(target - sd.moonZ) > 0.03 || sd.rv < 1) live = true;
    if (!sd.ready && Math.abs(sd.moonZ - target) < 0.6 && sd.rv >= 1) { sd.ready = true; needRender = true; }
  }
  if (st.walk) {
    st.walk.t = Math.min(1, st.walk.t + dt / 3.5); st.lat = lerp(st.walk.from, st.walk.to, ease(st.walk.t)); live = true;
    if (st.walk.t >= 1) { st.walk = null; st.lat = LAT.alex; needRender = true; }
  }
  if (S.sec) S.secT += dt;
  if (live) { syncControls(); readout(); }
}
function syncControls() {
  $('shipRange').value = S.ship.d; $('shipNum').textContent = `${fmtKm(S.ship.d)} ${T[lang].kmU}`;
  $('latRange').value = 40 - S.stars.lat; $('latNum').textContent = `${Math.round(S.stars.lat)}°`;
}
const fmtKm = (d) => { const r = S.ship.sail ? Math.round(d) : d; return fmtNum(r, Number.isInteger(r) ? 0 : 1); };

canvasLoop($('cv'), (c, w, h, dt, time) => {
  tick(dt);
  if (needRender) { needRender = false; render(); }
  c.save();
  if (S.sec === 'era') sceneEra(c, w, h, time);
  else if (S.sec === 'hip') sceneHip(c, w, h, time);
  else if (lab.view === 'ship') sceneShip(c, w, h, time);
  else if (lab.view === 'shadow') sceneShadow(c, w, h, time);
  else sceneStars(c, w, h, time);
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function pick(key, i) {
  const ok = i === PRED[key].right;
  (ok ? sfx.good : sfx.bad)();
  if (key === 'ship') { S.ship.pick = i; S.ship.sail = { t: 0, from: S.ship.d }; }
  else if (key === 'shadow') { S.shadow.pick = i; S.shadow.rv = 0; S.shadow.ready = false; }
  else { S.stars.pick = i; S.stars.walk = { t: 0, from: S.stars.lat, to: LAT.alex }; }
  showStage(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.pk) { pick(b.dataset.pk, +b.dataset.i); return; }
  const act = b.dataset.act;
  if (act === 'flat') { S.ship.flat = !S.ship.flat; sfx.click(); }
  else if (b.dataset.sh) { S.shadow.shape = b.dataset.sh; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.secT = 0; sfx.click(); if (S.sec) showStage();
  }
  render();
});
$('shipRange').addEventListener('input', (ev) => { S.ship.d = +ev.target.value; sfx.tick(); syncControls(); readout(); });
$('turnRange').addEventListener('input', (ev) => { S.shadow.turn = +ev.target.value; sfx.tick(); $('turnNum').textContent = `${S.shadow.turn}°`; readout(); });
$('latRange').addEventListener('input', (ev) => {
  let lat = 40 - +ev.target.value;
  for (const k of Object.keys(LAT)) if (Math.abs(lat - LAT[k]) < 0.45) { if (S.stars.lat !== LAT[k]) sfx.snap(); lat = LAT[k]; }
  S.stars.lat = lat; sfx.tick(); syncControls(); readout();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
function predHTML(key, q, opts, pk, okText, badText) {
  const done = pk !== null, right = PRED[key].right;
  const chips = opts.map((o, i) => `<button type="button" class="chip re-ch${done ? (i === right ? ' re-ok' : pk === i ? ' re-bad' : ' re-dim') : ''}" data-pk="${key}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = done ? `<div class="re-verdict" style="color:${pk === right ? 'var(--ok)' : 'var(--wip)'}">${esc(pk === right ? okText : badText)}</div>` : '';
  return `<p class="re-q">${esc(q)}</p><div class="re-chips">${chips}</div>${verdict}`;
}
const setOff = (id, off) => { $(id).classList.toggle('re-off', off); $(id).querySelector('input').disabled = off; };

function render() {
  const t = T[lang], v = lab.view, s = S.ship, sd = S.shadow, st = S.stars;
  document.body.dataset.v = v;
  ['ship', 'shadow', 'stars'].forEach((k) => { $('re-' + k).style.display = k === v ? 'block' : 'none'; });
  // ship
  $('shipPred').innerHTML = predHTML('ship', t.shipAsk, t.shipOpts, s.pick, t.shipRight, t.shipWrong);
  $('shipLbl').textContent = t.distance;
  setOff('shipSl', s.pick === null || !!s.sail);
  $('flatBtn').textContent = t.flatSea; $('flatBtn').classList.toggle('on', s.flat); $('flatBtn').disabled = s.pick === null || !!s.sail;
  // shadow
  $('shadowPred').innerHTML = predHTML('shadow', t.shadowAsk, t.shadowOpts, sd.pick, t.shadowRight, t.shadowWrong);
  $('shapeRow').innerHTML = ['ball', 'disc', 'cube'].map((k) => `<button type="button" class="chip re-ch${sd.pick !== null && sd.shape === k ? ' on' : ''}" data-sh="${k}"${sd.ready ? '' : ' disabled'}>${esc(t.shapes[k])}</button>`).join('');
  $('turnLbl').textContent = t.turn; $('turnNum').textContent = `${sd.turn}°`; setOff('turnSl', !sd.ready);
  // stars
  $('starsPred').innerHTML = predHTML('stars', t.starsAsk, t.starsOpts, st.pick, t.starsRight, t.starsWrong);
  $('latLbl').textContent = t.lat; setOff('latSl', st.pick === null || !!st.walk);
  // secrets
  const open = secret.unlocked();
  $('reSec').innerHTML = [['era', '📏', 'a'], ['hip', '⚕️', 'b']].map(([k, e, n]) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[n][0])}` : '🔒 ???'}</button>`).join('');
  syncControls(); readout();
  // state card and facts
  let card, facts = [];
  if (S.sec === 'era') card = { emo: '📏', title: t.secrets.a[0], lead: t.eraText, body: '' };
  else if (S.sec === 'hip') card = { emo: '⚕️', title: t.secrets.b[0], lead: t.hipText, body: '' };
  else if (v === 'ship') {
    if (s.pick === null) card = { emo: '🤔', title: t.shipAsk, lead: '', body: '' };
    else { const a = t.st.ship; card = { emo: a[0], title: a[1], lead: a[2], body: a[3] }; facts = t.facts.ship; }
  } else if (v === 'shadow') {
    if (sd.pick === null) card = { emo: '🤔', title: t.shadowAsk, lead: '', body: '' };
    else { const a = t.st.shadow; card = { emo: a[0], title: a[1], lead: a[2], body: a[3] }; facts = t.facts.shadow; }
  } else if (st.pick === null) card = { emo: '🤔', title: t.starsAsk, lead: '', body: '' };
  else { const a = t.st.stars; card = { emo: a[0], title: a[1], lead: a[2], body: a[3], aris: true }; facts = t.facts.stars; }
  const extra = (card.aris ? `<p class="re-q" style="margin:10px 0 0">${esc(t.aristotle)}</p>` : '') + MEAN;
  lab.setState({ emo: card.emo, title: card.title, lead: card.lead, body: card.body, extra });
  lab.setFacts(facts);
  lab.setGlow(S.sec === 'era' ? 'rgba(217, 164, 65, .3)' : S.sec === 'hip' ? 'rgba(200, 85, 61, .3)' : v === 'ship' ? 'rgba(74, 163, 216, .3)' : v === 'shadow' ? 'rgba(200, 85, 61, .28)' : 'rgba(242, 193, 78, .28)');
}
function readout() {
  const t = T[lang], v = lab.view, s = S.ship, sd = S.shadow, st = S.stars;
  if (S.sec === 'era') return lab.setReadout(esc(`${fmtNum(7.2, 1)}°`), '× 50', '', '#d9a441');
  if (S.sec === 'hip') return lab.setReadout('⚕️', '', '', '#c8553d');
  if (v === 'ship') {
    const asked = s.pick !== null, hid = s.flat || s.d <= D0 ? 0 : Math.min(MAST, Math.max(0, Math.round(hiddenM(s.d))));
    return lab.setReadout(asked ? esc(t.hidden(hid)) : '?', t.km(fmtKm(s.d)), asked && !s.flat ? t.horizon(Math.round(D0)) : '', '#4aa3d8');
  }
  if (v === 'shadow') {
    const asked = sd.pick !== null;
    return lab.setReadout(asked ? esc(t.shapes[sd.shape]) : '?', asked ? `${t.turn}: ${sd.turn}°` : '', asked ? t.shadowKind[shadowKind(sd.shape, sd.turn)] : '', '#c8553d');
  }
  const asked = st.pick !== null, near = Object.keys(LAT).find((k) => Math.abs(st.lat - LAT[k]) < 0.05), L = Math.round(st.lat);
  return lab.setReadout(asked ? esc(t.alt(fmtAlt(canAlt(st.lat)))) : '?', `${t.lat} ${L}°`, near ? t.placeLat(t.places[near], L) : '', '#f2c14e');
}
render();
