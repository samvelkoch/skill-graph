  secrets: [{ emo: '🏝️', title: T[lang].secrets.a[0], desc: T[lang].secrets.a[1] }, { emo: '🏯', title: T[lang].secrets.b[0], desc: T[lang].secrets.b[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="vPort"><p class="dj-q" id="ptQ"></p><div class="dj-opts" id="ptChips"></div><div class="row2"><button class="btn dj-btn" id="ptBtn" type="button"></button></div><div class="dj-verdict" id="ptV"></div><div class="dj-lines" id="ptLines"></div></div>
  <div id="vDoors"><p class="dj-q" id="drQ"></p><div class="dj-opts" id="drChips"></div><div class="dj-verdict" id="drV"></div><div class="dj-goods" id="drGoods"></div></div>
  <div id="vOpen"><p class="dj-q" id="opQ"></p><div class="dj-opts" id="opOpts"></div><div class="dj-verdict" id="opV"></div>
    <div class="dj-ctl"><div class="ends"><span id="yrL"></span><span id="yrV"></span></div><input type="range" class="big" id="yr" min="1600" max="1860" step="1" aria-label="Year"><div class="dj-nav"><button type="button" data-act="prev" id="evPrev"></button><button type="button" data-act="next" id="evNext"></button></div></div></div>
  <div id="vGate"><button class="btn dj-btn" type="button" data-act="gate" id="gateBtn"></button></div>
  <div id="vSecA"><p class="dj-q" id="aQ"></p><div class="dj-opts" id="aOpts"></div><div class="dj-verdict" id="aV"></div>
    <div class="dj-ctl" id="aCtl"><div class="ends"><span id="aL"></span><span id="aE"></span></div><input type="range" class="big" id="aS" min="0" max="100" step="1" aria-label="Canal"></div></div>
  <div id="vSecB"><p class="dj-q" id="bQ"></p><div class="dj-opts" id="bOpts"></div><div class="dj-verdict" id="bV"></div>
    <div class="dj-ctl" id="bCtl"><div class="ends"><span id="bL"></span><span id="bE"></span></div><input type="range" class="big" id="bS" min="0" max="100" step="1" aria-label="Journey"></div></div>
  <div class="row2" id="secRow"></div>`;

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const portOk = () => S.p.sel[1] && S.p.sel[2] && !S.p.sel[0] && !S.p.sel[3];
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'tog') { if (S.p.rev) return; S.p.sel[+v] = !S.p.sel[+v]; sfx.tick(); }
  else if (a === 'check') { if (S.p.rev || !S.p.sel.some(Boolean)) return; S.p.rev = true; S.p.at = now(); S.seen1 = true; (portOk() ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'again') { S.p = { sel: [false, false, false, false], rev: false, at: -9 }; sfx.click(); }
  else if (a === 'gate') { document.querySelector('#views [data-view="port"]')?.click(); return; }
  else if (a === 'door') {
    if (!S.d.rev) { S.d.pick = v; S.d.rev = true; S.d.door = 'in'; S.d.at = now(); (v === 'in' ? sfx.good : sfx.bad)(); showStage(); }
    else { S.d.door = v; S.d.touched = true; sfx.click(); }
  }
  else if (a === 'oopt') { if (S.o.rev) return; S.o.pick = +v; S.o.rev = true; S.o.at = now(); S.o.moved = false; (+v === T[lang].o.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'prev') { const p = [...EV].reverse().find((e) => e < S.o.year); if (p) { S.o.year = p; S.o.moved = true; sfx.tick(); } }
  else if (a === 'next') { const n = EV.find((e) => e > S.o.year); if (n) { S.o.year = n; S.o.moved = true; sfx.tick(); } }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === v ? null : v; sfx.click(); }
  else if (a === 'aopt') { if (S.a.pick !== null) return; S.a.pick = +v; S.a.at = now(); S.a.dig = 0; $('aS').value = 0; (+v === T[lang].sa.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'bopt') { if (S.b.pick !== null) return; S.b.pick = +v; S.b.at = now(); S.b.prog = 0; $('bS').value = 0; (+v === T[lang].sb.ok ? sfx.good : sfx.bad)(); showStage(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'yr') { S.o.year = clamp(Math.round(+ev.target.value), 1600, 1860); S.o.moved = true; }
  else if (id === 'aS') S.a.dig = clamp(+ev.target.value / 100, 0, 1);
  else if (id === 'bS') S.b.prog = clamp(+ev.target.value / 100, 0, 1);
  else return;
  render();
});

// --- one render per change: controls, readout, state card, facts -------------------------------------------------------------------
const optBtn = (act, v, label, state) => `<button type="button" class="dj-opt ${state ?? ''}" data-act="${act}" data-v="${esc(v)}"${state === 'good' || state === 'bad' || state === 'dim' ? ' disabled' : ''}>${esc(label)}</button>`;
function render() {
  const t = T[lang], key = viewKey(), sec = S.sec;
  document.body.dataset.v = key;
  $('vPort').hidden = key !== 'port'; $('vDoors').hidden = key !== 'doors'; $('vOpen').hidden = key !== 'open';
  $('vGate').hidden = key !== 'gate'; $('vSecA').hidden = key !== 'seca'; $('vSecB').hidden = key !== 'secb';
  const open = secret.unlocked(), sc = (k, emo) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" style="min-height:38px" data-act="sec" data-v="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('a', '🏝️') + sc('b', '🏯');
  if (key === 'seca') renderSecA(t); else if (key === 'secb') renderSecB(t); else if (key === 'gate') renderGate(t);
  else if (key === 'port') renderPort(t); else if (key === 'doors') renderDoors(t); else renderOpen(t);
}

function renderGate(t) {
  const g = t.gate;
  lab.setGlow('rgba(143, 127, 208, .22)');
  $('gateBtn').textContent = g.go;
  lab.setReadout(g.val, '', '', '#8f7fd0');
  lab.setState({ emo: g.emo, title: g.title, lead: g.lead, body: g.body, extra: '' });
  lab.setFacts([]);
}

function renderPort(t) {
  const p = t.p, P = S.p, rev = P.rev, n = P.sel.filter(Boolean).length, ok = portOk();
  lab.setGlow('rgba(217, 162, 94, .26)');
  $('ptQ').textContent = p.askBody;
  $('ptChips').innerHTML = KINDS.map((k, i) => {
    const inn = i === 1 || i === 2, st = !rev ? (P.sel[i] ? 'on' : '') : inn ? 'good' : P.sel[i] ? 'bad' : 'dim';
    return optBtn('tog', String(i), (P.sel[i] ? '✔ ' : '') + t.nat[k], st);
  }).join('');
  const btn = $('ptBtn');
  btn.textContent = rev ? p.again : p.check; btn.dataset.act = rev ? 'again' : 'check'; btn.disabled = !rev && n === 0; btn.style.opacity = btn.disabled ? '.45' : '';
  $('ptV').textContent = rev ? `${ok ? p.right : p.wrong} ${p.lead}` : '';
  $('ptV').className = 'dj-verdict' + (rev ? (ok ? ' good' : ' bad') : '');
  $('ptLines').innerHTML = rev ? ['pt', 'nl', 'cn', 'en'].map((k) => `<p style="--c:${NAT[k]}"><b>${esc(t.nat[k])}: ${esc(p.lines[k][0])}.</b> ${esc(p.lines[k][1])}</p>`).join('') : '';
  if (!rev) lab.setReadout(esc(p.valPre), p.subPre, n ? p.chosen(n) : '', '#d9a25e');
  else lab.setReadout(esc(p.valPost), p.subPost, p.pillPost, '#2e9e6e');
  if (!rev) lab.setState({ emo: '⚓', title: p.askTitle, lead: p.askLead, body: p.askBody, extra: '' });
  else lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? p.right : p.wrong, lead: p.lead, body: p.body, extra: '' });
  lab.setFacts(rev ? p.facts : []);
}

function renderDoors(t) {
  const d = t.d, D = S.d, rev = D.rev, ok = D.pick === 'in';
  lab.setGlow('rgba(224, 176, 80, .26)');
  $('drQ').textContent = rev ? d.pick : d.askBody;
  $('drChips').innerHTML = ['jp', 'cn', 'in'].map((k) => optBtn('door', k, d.doors[k], rev && k === D.door ? 'on' : '')).join('');
  $('drV').textContent = rev ? `${ok ? d.right : d.wrong} ${ok ? d.rightLead : d.wrongLead}` : '';
  $('drV').className = 'dj-verdict' + (rev ? (ok ? ' good' : ' bad') : '');
  const card = d.card[D.door];
  $('drGoods').innerHTML = rev ? `<b>${esc(d.outL)}:</b> ${esc(card.out)}${card.inn ? `<br><b>${esc(d.inL)}:</b> ${esc(card.inn)}` : ''}` : '';
  if (!rev) lab.setReadout(esc(d.valPre), d.subPre, '', '#e0b050');
  else lab.setReadout(esc(card.rd[0]), card.rd[1], card.rd[2], '#e0b050');
  if (!rev) lab.setState({ emo: '🚪', title: d.askTitle, lead: d.askLead, body: d.askBody, extra: '' });
  else if (!D.touched) lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? d.right : d.wrong, lead: ok ? d.rightLead : d.wrongLead, body: d.pick, extra: '' });
  else lab.setState({ emo: { jp: '🗾', cn: '🏮', in: '🐘' }[D.door], title: card.t, lead: card.lead, body: typeof card.body === 'function' ? card.body(boxRatio()) : card.body, extra: '' });
  lab.setFacts(rev ? d.facts[D.door] : []);
}

function renderOpen(t) {
  const o = t.o, O = S.o, y = O.year, rev = O.rev, ev = o.ev[evAt(y)], n = shipsAt(y), ok = O.pick === o.ok;
  lab.setGlow('rgba(242, 193, 78, .24)');
  $('opQ').textContent = o.q;
  $('opOpts').innerHTML = o.opts.map((l, i) => optBtn('oopt', String(i), l, !rev ? '' : i === o.ok ? 'good' : i === O.pick ? 'bad' : 'dim')).join('');
  $('opV').textContent = rev ? `${ok ? o.right : o.wrong} ${o.verdictLead}` : '';
  $('opV').className = 'dj-verdict' + (rev ? (ok ? ' good' : ' bad') : '');
  $('yrL').textContent = o.slider; $('yrV').textContent = y;
  if (+$('yr').value !== y) $('yr').value = y;
  const prev = [...EV].reverse().find((e) => e < y), next = EV.find((e) => e > y);
  $('evPrev').textContent = o.prev; $('evPrev').disabled = !prev; $('evPrev').style.opacity = prev ? '' : '.4';
  $('evNext').textContent = o.next; $('evNext').disabled = !next; $('evNext').style.opacity = next ? '' : '.4';
  lab.setReadout(String(y), ev[1], rev && n !== null ? o.pill(n) : '', '#f2c14e');
  if (rev && !O.moved) lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? o.right : o.wrong, lead: o.verdictLead, body: '', extra: '' });
  else lab.setState({ emo: ev[0], title: ev[1], lead: ev[2], body: '', extra: '' });
  lab.setFacts(rev ? o.facts : []);
}

function renderSecA(t) {
  const a = t.sa, A = S.a, asked = A.pick !== null, ok = A.pick === a.ok;
  lab.setGlow('rgba(224, 176, 80, .26)');
  $('aQ').textContent = a.q;
  $('aOpts').innerHTML = a.opts.map((l, i) => optBtn('aopt', String(i), l, !asked ? '' : i === a.ok ? 'good' : i === A.pick ? 'bad' : 'dim')).join('');
  $('aV').textContent = asked ? (ok ? a.right : a.wrong) : '';
  $('aV').className = 'dj-verdict' + (asked ? (ok ? ' good' : ' bad') : '');
  $('aCtl').hidden = !asked; $('aL').textContent = a.slider; $('aE').textContent = `${a.ends[0]} → ${a.ends[1]}`;
  lab.setReadout(asked ? (A.dig < 0.02 ? '≤ 1633' : String(1634 + Math.round(A.dig * 2))) : '?', asked ? a.val : '', asked ? `${Math.round(A.dig * 100)} %` : '', '#e0b050');
  if (!asked) lab.setState({ emo: '🏝️', title: a.askTitle, lead: a.askLead, body: '', extra: '' });
  else lab.setState({ emo: ok ? '✅' : '🤔', title: a.title, lead: a.lead, body: a.body, extra: '' });
  lab.setFacts(asked ? a.facts : []);
}

function renderSecB(t) {
  const b = t.sb, B = S.b, asked = B.pick !== null, ok = B.pick === b.ok;
  lab.setGlow('rgba(255, 214, 110, .22)');
  $('bQ').textContent = b.q;
  $('bOpts').innerHTML = b.opts.map((l, i) => optBtn('bopt', String(i), l, !asked ? '' : i === b.ok ? 'good' : i === B.pick ? 'bad' : 'dim')).join('');
  $('bV').textContent = asked ? (ok ? b.right : b.wrong) : '';
  $('bV').className = 'dj-verdict' + (asked ? (ok ? ' good' : ' bad') : '');
  $('bCtl').hidden = !asked; $('bL').textContent = b.slider; $('bE').textContent = `${b.ends[0]} → ${b.ends[1]}`;
  lab.setReadout(`${esc(b.ends[0])} → ${esc(b.ends[1])}`, asked ? `≈ ${NAG_EDO_KM} km, ${b.straight}` : '', asked ? b.title : '', '#ffd66e');
  if (!asked) lab.setState({ emo: '🏯', title: b.askTitle, lead: b.askLead, body: '', extra: '' });
  else lab.setState({ emo: ok ? '✅' : '🤔', title: b.title, lead: b.lead, body: b.body(NAG_EDO_KM), extra: '' });
  lab.setFacts(asked ? b.facts : []);
}

// the picture answers taps too: ships in the Port, doors and pins in the Doors view (same as the buttons below)
$('cv').addEventListener('click', (ev) => {
  const key = viewKey(), [W, H] = DESIGN[key], r = $('cv').getBoundingClientRect(), s = Math.min(r.width / W, r.height / H);
  const x = (ev.clientX - r.left - (r.width - W * s) / 2) / s, y = (ev.clientY - r.top - (r.height - H * s) / 2) / s;
  const press = (sel) => $('ctrlBody').querySelector(sel)?.click();
  if (key === 'port' && !S.p.rev) {
    let best = -1, bd = 46;
    HOME.forEach(([hx, hy], i) => { const d = Math.hypot(x - hx, y - (hy - 8)); if (d < bd) { bd = d; best = i; } });
    if (best >= 0) press(`[data-act="tog"][data-v="${best}"]`);
  } else if (key === 'doors' && !S.d.rev) {
    [['jp', 66], ['cn', 180], ['in', 294]].forEach(([k, dx]) => { if (Math.abs(x - dx) < 42 && y > 240 && y < 392) press(`[data-act="door"][data-v="${k}"]`); });
  } else if (key === 'doors') {
    const ks = { jp: ['nag'], cn: ['can'], in: ['goa', 'sur', 'mad', 'pon', 'cal'] };
    let best = null, bd = 18;
    Object.entries(ks).forEach(([door, arr]) => arr.forEach((k) => { const [px, py] = pp(k), d = Math.hypot(x - px, y - py); if (d < bd) { bd = d; best = door; } }));
    if (best) press(`[data-act="door"][data-v="${best}"]`);
  }
});

// --- start the picture and the first render ---------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const key = viewKey(), [W, H] = DESIGN[key], s = Math.min(w / W, h / H);
  const bg = BG[key]; backdrop(c, w, h, bg[0], bg[1]);
  CW = W;
  c.save(); c.translate((w - W * s) / 2, (h - H * s) / 2); c.scale(s, s);
  c.lineJoin = 'round'; c.lineCap = 'round';
  DRAW[key](c, W, H, time);
  c.restore();
});
render();
</script>
</body>
</html>
