// --- counters: each one has a list of moves; its place is worked out from the clock every frame --------------
// slot: { k: 'b1' | 'b2' | 'b2m' (box 2 mirrored) | 'tray', i, dy }
const B1 = (i, dy = 0) => ({ k: 'b1', i, dy });
const B2 = (i, dy = 0) => ({ k: 'b2', i, dy });
const B2M = (i) => ({ k: 'b2m', i, dy: 0 });
const TR = (i) => ({ k: 'tray', i, dy: 0 });
const cell = (i) => (i < 10 ? B1(i) : B2(i - 10));          // cells fill left to right, top row first, box 1 then box 2
const same = (p, q) => p.k === q.k && p.i === q.i && p.dy === q.dy;
const ease = (k) => (k < .5 ? 2 * k * k : 1 - 2 * (1 - k) * (1 - k));

function slotPos(s) {
  const dy = s.dy * L.c;
  if (s.k === 'tray') return [L.tray.x + L.tray.pad + (s.i + .5) * L.tray.sp, L.tray.y + L.tray.h / 2 + dy];
  const box = s.k === 'b1' ? L.b1 : L.b2;
  let row = s.i < 5 ? 0 : 1, col = s.i % 5;
  if (s.k === 'b2m') { if (L.wide) col = 4 - col; else row = 1 - row; }
  return [box.x + L.pad + (col + .5) * L.c, box.y + L.pad + (row + .5) * L.c + dy];
}
const mk = (col, slot) => ({ col, start: slot, segs: [], a: 1, glow: [], shake: [], pulse: false, dieAt: 0 });
const lastSlot = (c) => (c.segs.length ? c.segs[c.segs.length - 1].to : c.start);
const endOf = (c) => (c.segs.length ? c.segs[c.segs.length - 1].t0 + c.segs[c.segs.length - 1].dur : 0);
// move c to a slot: starts at t0, lasts dur; o.fade = [from, to] opacity, o.arc = jump height in cells
function go(c, to, t0, dur = .35, o = {}) {
  c.segs.push({ from: lastSlot(c), to, t0, dur, fade: o.fade, arc: o.arc ?? (o.fade ? 0 : .55) });
  return t0 + dur;
}
function appear(c, t0, dur = .3) { c.a = 0; go(c, lastSlot(c), t0, dur, { fade: [0, 1] }); }
function pose(c, t) {
  let p = slotPos(c.start), a = c.a;
  for (const s of c.segs) {
    if (t < s.t0) break;
    const k = clamp((t - s.t0) / s.dur, 0, 1), e = ease(k), f = slotPos(s.from), g = slotPos(s.to);
    p = [lerp(f[0], g[0], e), lerp(f[1], g[1], e) - Math.sin(Math.PI * k) * s.arc * L.c];
    if (s.fade) a = lerp(s.fade[0], s.fade[1], e);
    if (k < 1) break;
  }
  let dx = 0, glow = 0;
  for (const [t0, t1] of c.shake) if (t >= t0 && t <= t1) dx = Math.sin((t - t0) * 48) * .09 * L.c * (1 - (t - t0) / (t1 - t0));
  for (const [t0, t1] of c.glow) if (t >= t0 && t <= t1) glow = Math.sin(Math.PI * (t - t0) / (t1 - t0));
  if (c.pulse) glow = Math.max(glow, .5 + .5 * Math.sin(t * 6));
  return { x: p[0] + dx, y: p[1], a, glow };
}
// a new picture: spec = [{col, slot, pulse?}]; counters fade in
function build(spec, t0) {
  cs = spec.map((s, n) => { const c = mk(s.col, s.slot); c.pulse = !!s.pulse; appear(c, t0 + n * .025); return c; });
}
// the same counters walk to a new picture; missing ones fade in, extra ones fade out
function retarget(spec, t0) {
  const pool = { r: cs.filter((c) => c.col === 'r' && !c.dieAt), b: cs.filter((c) => c.col === 'b' && !c.dieAt) }, out = [];
  spec.forEach((s, n) => {
    const c = pool[s.col].shift(), tt = t0 + n * .05;
    if (c) { if (!same(lastSlot(c), s.slot)) go(c, s.slot, tt, .5); c.pulse = !!s.pulse; out.push(c); }
    else { const nc = mk(s.col, s.slot); nc.pulse = !!s.pulse; appear(nc, tt + .3); out.push(nc); }
  });
  for (const c of [...pool.r, ...pool.b]) { go(c, lastSlot(c), t0, .35, { fade: [1, 0] }); c.dieAt = t0 + .4; out.push(c); }
  cs = out;
}
const reds = () => cs.filter((c) => c.col === 'r' && !c.dieAt), blues = () => cs.filter((c) => c.col === 'b' && !c.dieAt);

  if (m.hide === 'r') for (let k = 0; k < b; k++) spec.push({ col: 'b', slot: B1(k) });
  else { for (let k = 0; k < a; k++) spec.push({ col: 'r', slot: B1(k) }); if (m.hide === 'all') for (let k = 0; k < b; k++) spec.push({ col: 'b', slot: B2(k) }); }
  retarget(spec, T0);
  at(T0 + 1.0, () => { if (F.phase === 'miss') lidT = 1; });
  render();
}
function revealMissing() {
  const [a, b] = FR[F.i], c = a + b, m = MISS[F.i], T0 = now() + .6;
  F.mg = F.n; F.phase = 'mrun'; lidT = 0; sfx.click(); showStage();
  let end = T0;
  if (m.hide === 'all') blues().forEach((k, i) => { end = Math.max(end, go(k, cell(a + i), T0 + i * .12)); at(T0 + i * .12 + .35, sfx.tick); });
  else {
    const col = m.hide, n = m.hide === 'r' ? a : b;
    for (let i = 0; i < n; i++) { const k = mk(col, B2(i)); appear(k, T0 + i * .12); cs.push(k); end = Math.max(end, endOf(k)); at(T0 + i * .12 + .2, sfx.tick); }
  }
  at(end + .1, () => {
    F.phase = 'mdone';
    (F.mg === m.ans(a, b, c) ? sfx.good : sfx.bad)();
    setLine(() => missEq(true));
    render();
  });
  render();
}

// --- controls ------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'jdec' || a === 'jinc') { if (J.phase !== 'ask') return; J.n = clamp(J.n + (a === 'jinc' ? 1 : -1), 0, 20); sfx.tick(); render(); }
  else if (a === 'jmain') { if (J.phase === 'ask') revealJoin(); else if (J.phase === 'done') { sfx.click(); newJoin((J.i + 1) % JT.length); } }
  else if (a === 'jagain') { sfx.click(); newJoin(J.i); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    sfx.click();
    if (X.sec === b.dataset.k) newTen(X.i); else startSecret(b.dataset.k);
  }
  else if (a === 'fdec' || a === 'finc') { if (F.phase !== 'miss') return; F.n = clamp(F.n + (a === 'finc' ? 1 : -1), 0, 20); sfx.tick(); render(); }
  else if (a === 'fcard') {
    if (F.phase !== 'cards') return;
    const id = b.dataset.id; F.sel.has(id) ? F.sel.delete(id) : F.sel.add(id); sfx.tick(); render();
  }
  else if (a === 'fmain') {
    if (F.phase === 'cards') { if (F.sel.size) revealCards(); }
    else if (F.phase === 'score') enterMissing();
    else if (F.phase === 'miss') revealMissing();
    else if (F.phase === 'mdone') { sfx.click(); newFam((F.i + 1) % FR.length); }
  }
});
card.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.pick) { if (X.phase === 'ask') revealTen(+b.dataset.pick); }
  else if (b.dataset.act === 'tnext') { sfx.click(); newTen((X.i + 1) % TT.length); }
  else if (b.dataset.act === 'tagain') { sfx.click(); newTen(X.i); }
  else if (b.dataset.act === 'snext') secretNext();
});
function enter(v) {
  evs = []; lid = lidT = 0; setLine(null); X.sec = null;
  if (v === 'join') newJoin(J.i); else if (v === 'ten') newTen(X.i); else newFam(F.i);
}

// --- render: cards, controls, readout and the state card --------------------------------------------------------
function renderFamCards() {
  const shown = F.phase === 'run' || F.phase === 'score';
  $('fCards').innerHTML = F.cards.map((cd, n) => {
    const seen = shown && n <= F.cur, dec = F.sel.has(cd.id) === cd.ok;
    const cls = [F.sel.has(cd.id) && !seen ? 'sel' : '', seen ? (dec ? 'ok' : 'no') : '', F.phase === 'run' && n === F.cur ? 'cur' : ''].join(' ');
    return `<button class="fc ${cls}" data-act="fcard" data-id="${cd.id}"${F.phase !== 'cards' ? ' disabled' : ''}>${cd.html}${seen ? `<i>${cd.ok ? '✔' : '✘'}</i>` : ''}</button>`;
  }).join('');
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secJoin').style.display = v === 'join' ? '' : 'none';
  $('secTen').style.display = v === 'ten' ? '' : 'none';
  $('secFam').style.display = v === 'family' ? '' : 'none';
  if (lineFn) lineEl.innerHTML = lineFn();
  if (v === 'join') renderJoin(t); else if (v === 'ten') renderTen(t); else renderFam(t);
}
const fine = () => `<div class="fine">${esc(T[lang].fine)}</div>`;
function stateOf(base, verdict) {
  lab.setState(verdict ? { emo: verdict[0] ? '✅' : '🤔', title: verdict[1], lead: base[2], body: base[3], extra: fine() }
    : { emo: base[0], title: base[1], lead: base[2], body: base[3], extra: fine() });
}

function renderJoin(t) {
  const [a, op, b] = JT[J.i], tot = op === '+' ? a + b : a - b, done = J.phase === 'done', e = expr(a, op, b, done ? tot : null);
  lab.setGlow('rgba(229, 72, 77, .22)');
  card.innerHTML = `<div class="expr">${e}</div>`;
  $('jn').textContent = J.n;
  document.querySelectorAll('#secJoin .sb').forEach((x) => { x.disabled = J.phase !== 'ask'; });
  $('jMain').textContent = done ? t.next : t.check; $('jMain').disabled = J.phase === 'run';
  $('jAgain').textContent = t.again; $('jAgain').hidden = !done;
  lab.setReadout(e, '', '', RED);
  stateOf(t.st.join, done ? joinVerdict(t) : null);
}

function renderTen(t) {
  const [a, op, b] = TT[X.i], tot = op === '+' ? a + b : a - b, open = secret.unlocked();
  lab.setGlow('rgba(245, 200, 76, .22)');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${X.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('doubles', '🪞') + sc('tens', '🚀');
  if (X.sec) {
    const s = t.secrets[X.sec], e = X.sec === 'doubles' ? DBL[X.d] : TENS[X.d];
    card.innerHTML = `<div class="q">${X.sec === 'doubles' ? '🪞' : '🚀'} ${esc(s[0])}</div><p>${esc(s[1])}</p><div class="opts"><button class="chip" data-act="snext">${esc(t.next)}</button></div>`;
    lab.setReadout(`${N(e[0], 'r')} + ${N(e[1], 'b')} = ${N(e[0] + e[1])}`, '', '', '#f5c84c');
    lab.setState({ emo: X.sec === 'doubles' ? '🪞' : '🚀', title: s[0], lead: s[1], body: '', extra: fine() });
    return;
  }
  const done = X.phase === 'done', ask = X.phase === 'ask', verdict = done ? tenVerdict(t) : null;
  if (done) card.innerHTML = `<div class="verdict" style="color:${verdict[0] ? 'var(--ok)' : 'var(--wip)'}">${esc(verdict[1])}</div>
    <div class="opts"><button class="chip" data-act="tagain">${esc(t.again)}</button><button class="chip on" data-act="tnext">${esc(t.next)}</button></div>`;
  else card.innerHTML = `<div class="q">${esc(op === '+' ? t.ten.qAdd(b) : t.ten.qSub(b))}</div>
    <div class="opts">${Array.from({ length: b }, (_, i) => i + 1).map((k) => `<button class="pick ${!ask && X.pick === k ? 'on' : ''}" data-pick="${k}"${ask ? '' : ' disabled'}>${k}</button>`).join('')}</div>`;
  lab.setReadout(expr(a, op, b, done ? tot : null), '', '', '#f5c84c');
  stateOf(t.st.ten, verdict);
}

function renderFam(t) {
  const [a, b] = FR[F.i], c = a + b, miss = F.phase === 'miss' || F.phase === 'mrun' || F.phase === 'mdone', done = F.phase === 'mdone';
  lab.setGlow('rgba(95, 143, 208, .28)');
  $('fCards').style.display = miss ? 'none' : '';
  $('fStep').style.display = miss ? '' : 'none';
  if (miss) {
    card.innerHTML = `<div class="q sm">${esc(t.family.missing)}</div><div class="expr">${missEq(done)}</div>`;
    $('fn').textContent = F.n;
    document.querySelectorAll('#fStep .sb').forEach((x) => { x.disabled = F.phase !== 'miss'; });
    lab.setReadout(missEq(done), '', '', '#5f8fd0');
  } else {
    card.innerHTML = `<div class="q" style="margin:0">${esc(t.family.ask)}</div>`;
    renderFamCards();
    lab.setReadout(`${N(a, 'r')} + ${N(b, 'b')}`, '', '', '#5f8fd0');
  }
  const m = $('fMain');
  m.textContent = F.phase === 'score' ? t.family.missing : done ? t.family.next : t.family.check;
  m.disabled = F.phase === 'run' || F.phase === 'mrun' || (F.phase === 'cards' && F.sel.size === 0);
  const base = t.st.family;
  if (done) stateOf(base, F.mg === MISS[F.i].ans(a, b, c) ? [true, t.family.right] : [false, t.join.wrong(MISS[F.i].ans(a, b, c))]);
  else if (F.phase === 'score' || miss) lab.setState({ emo: F.k === F.cards.length ? '✅' : '🤔', title: t.family.score(F.k, F.cards.length), lead: base[2], body: base[3], extra: fine() });
  else stateOf(base, null);
}

newJoin(0);
</script>
</body>
