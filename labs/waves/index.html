  sky(ctx, w, h, yb, t);
  const xs = [], ys = [], st = [];
  for (let x = 0; x <= w + 4; x += 4) { xs.push(x); ys.push(surf(x, tm)); st.push(Math.max(0, Math.sin(k * x - om * tm) - 0.45) / 0.55 * fade(x)); }

  foamStroke(ctx, xs, ys, st);
  // water particles
  if (S.showWater) {
    const cols = [0.12, 0.24, 0.5, 0.62, 0.74], deps = [18, 42, 66, 90];
    cols.forEach((c, ci) => deps.forEach((dp, ri) => {
      const px = c * w, py = yb + dp, th = k * px - om * tm, r = Apx * fade(px) * Math.exp(-0.45 * k * dp);
      const x = px + r * Math.cos(th), y = py - r * Math.sin(th), gold = ci === 2 && ri === 1;

        ctx.save(); ctx.strokeStyle = 'rgba(245, 200, 76, .8)'; ctx.lineWidth = 1.6; ctx.setLineDash([2, 5]); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(px, py, Math.max(0.5, r), 0, TAU); ctx.stroke(); ctx.restore();

        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 11, 0, TAU); ctx.fill();
        ctx.fillStyle = '#f5c84c'; ctx.strokeStyle = '#b88a10'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill(); ctx.stroke();
      } else { ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fill(); }
    }));

  const bp = [[0.62 * w, h], [0.82 * w, yb + 16], [w, yb - 14]], xsh = 0.82 * w + 0.18 * w * 16 / 30;
  const sandY = (x) => (x < bp[1][0] ? bp[0][1] + (bp[1][1] - bp[0][1]) * (x - bp[0][0]) / (bp[1][0] - bp[0][0]) : bp[1][1] + (bp[2][1] - bp[1][1]) * (x - bp[1][0]) / (bp[2][0] - bp[1][0]));
  ctx.save();

  const sg = ctx.createLinearGradient(0, yb - 20, 0, h); sg.addColorStop(0, '#f6dfa8'); sg.addColorStop(1, '#c9a363'); ctx.fillStyle = sg; ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle = 'rgba(11, 59, 102, .4)'; ctx.fillRect(0, yb + 2, xsh, h); ctx.restore();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    [-1, 1].forEach((sd) => { ctx.beginPath(); ctx.moveTo(x + sd * 4 * s, y - 8 * s - lift); ctx.lineTo(x + sd * (5.5 + 1.5 * u) * s, y - (8 + 9 * u) * s - lift); ctx.stroke(); });
  }
  ctx.fillStyle = jc; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; rr(ctx, x - 4.6 * s, y - 9 * s - lift, 9.2 * s, 12 * s, 3 * s); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(ctx, x - 3.4 * s, y - 8 * s - lift, 2.2 * s, 6 * s, 1 * s); ctx.fill();
  const hx = x, hy = y - 13.4 * s - lift, hr = 4.4 * s, hg = ctx.createRadialGradient(hx - hr * 0.4, hy - hr * 0.4, 0.5, hx, hy, hr * 1.2); hg.addColorStop(0, '#fff'); hg.addColorStop(0.01, sk); hg.addColorStop(1, sk);
  ctx.fillStyle = sk; ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.arc(hx, hy, hr, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx - 1.7 * s, hy + 0.3 * s, 1.15 * s, 0, TAU); ctx.arc(hx + 1.7 * s, hy + 0.3 * s, 1.15 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2a1a10'; ctx.beginPath(); ctx.arc(hx - 1.6 * s, hy + 0.45 * s, 0.6 * s, 0, TAU); ctx.arc(hx + 1.8 * s, hy + 0.45 * s, 0.6 * s, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a3a2a'; ctx.lineWidth = Math.max(1, 0.5 * s); ctx.beginPath(); ctx.arc(hx, hy + 1.6 * s, 1.4 * s, 0.2, Math.PI - 0.2); ctx.stroke();
  if (gold) {
    ctx.fillStyle = '#f5c84c'; ctx.strokeStyle = '#b88a10'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(hx, hy - 0.4 * s, hr * 1.05, Math.PI, TAU); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(hx + hr * 0.7, hy - 0.4 * s, hr * 0.9, 1.3 * s, 0, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function sceneStadium(ctx, w, h, dt, t) {
  if (S.sp === 'run') { S.st += dt; if (S.st > 14 / STAND_SPEED + 1.1) { S.sp = 'done'; render(); } }
  const bg = ctx.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#1b2a50'); bg.addColorStop(1, '#0d1530'); ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  [0.12, 0.38, 0.62, 0.88].forEach((fx) => {
    const x = w * fx, y = h * 0.06, g = ctx.createRadialGradient(x, y, 2, x, y, w * 0.32); g.addColorStop(0, 'rgba(255,244,205,.38)'); g.addColorStop(1, 'rgba(255,244,205,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h * 0.6);
    ctx.fillStyle = '#4a5578'; ctx.fillRect(x - 2, y, 4, h * 0.12);
    ctx.fillStyle = '#2c3556'; ctx.strokeStyle = '#6b779e'; ctx.lineWidth = 1.2; rr(ctx, x - 18, y - 12, 36, 24, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff6d8'; for (let a = 0; a < 3; a++) for (let b = 0; b < 2; b++) { ctx.beginPath(); ctx.arc(x - 11 + a * 11, y - 5 + b * 10, 3.2, 0, TAU); ctx.fill(); }
  });
  const standing = (r, i) => {
    if (S.sp === 'pred') return 0;
    const s = (S.st - i / STAND_SPEED - r * 0.05) / 1.0;
    if (s <= 0 || s >= 1) return 0;
    return sstep(0, 0.25, s) * (1 - sstep(0.6, 1, s));
  };
  for (let r = 0; r < 3; r++) {
    // tier band
    const a = seat(r, 0, w, h), tierG = ctx.createLinearGradient(0, a.y, 0, a.y + 40); tierG.addColorStop(0, '#3d4f80'); tierG.addColorStop(1, '#222f55');
    ctx.save(); ctx.beginPath();
    for (let i = 0; i < 14; i++) { const p = seat(r, i, w, h); i ? ctx.lineTo(p.x, p.y - 3 * p.s) : ctx.moveTo(p.x, p.y - 3 * p.s); }
    for (let i = 13; i >= 0; i--) { const p = seat(r, i, w, h); ctx.lineTo(p.x, p.y + 18 * p.s); }
    ctx.closePath(); ctx.fillStyle = tierG; ctx.fill(); ctx.restore();
    for (let i = 0; i < 14; i++) {
      const p = seat(r, i, w, h), gold = r === GR && i === GI;
      drawFan(ctx, p, standing(r, i), i, r, gold);
    }
    // front of the tier hides the lower body
    ctx.save(); ctx.beginPath();
    for (let i = 0; i < 14; i++) { const p = seat(r, i, w, h); i ? ctx.lineTo(p.x, p.y - 1.5 * p.s) : ctx.moveTo(p.x, p.y - 1.5 * p.s); }
    for (let i = 13; i >= 0; i--) { const p = seat(r, i, w, h); ctx.lineTo(p.x, p.y + 19 * p.s); }
    ctx.closePath(); ctx.fillStyle = tierG; ctx.fill();
    ctx.strokeStyle = 'rgba(160,180,230,.35)'; ctx.lineWidth = 1.2; ctx.beginPath(); for (let i = 0; i < 14; i++) { const p = seat(r, i, w, h); i ? ctx.lineTo(p.x, p.y - 1.5 * p.s) : ctx.moveTo(p.x, p.y - 1.5 * p.s); } ctx.stroke();
    ctx.restore();
  }
  // gold seat marker: it stays where it is
  const gp = seat(GR, GI, w, h);
  if (S.sp !== 'pred') {
    ctx.save(); ctx.strokeStyle = '#f5c84c'; ctx.lineWidth = 2; ctx.setLineDash([3, 4]); rr(ctx, gp.x - 7 * gp.s, gp.y - 16 * gp.s, 14 * gp.s, 22 * gp.s, 4); ctx.stroke(); ctx.restore();
  }
  // light front of the wave
  if (S.sp === 'run') {
    const fp = clamp(S.st * STAND_SPEED, 0, 13), i0 = Math.floor(fp), p = seat(1, i0, w, h);
    const g = ctx.createRadialGradient(p.x, p.y - 30, 2, p.x, p.y - 30, w * 0.16); g.addColorStop(0, 'rgba(255,240,170,.45)'); g.addColorStop(1, 'rgba(255,240,170,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
  if (S.sp === 'run') { const f = clamp(Math.floor(S.st * STAND_SPEED), 0, 14); ro(String(f), T[lang].s.rd, T[lang].s.rp, '#f5c84c'); }
}

// --- loop --------------------------------------------------------------------------------------------------
const modeOf = () => { const v = lab.view; return v === 'duck' ? (S.sec === 'a' ? 'beach' : S.sec === 'b' ? 'tide' : 'duck') : v; };
canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  CW = w; CH = h;
  const m = modeOf();
  if (m === 'duck') {
    if (S.dp !== 'pred') { S.tm += dt; if (S.dp === 'run' && S.tm >= 5 * PERIOD) { S.tm = 5 * PERIOD; S.dp = 'free'; render(); } }
    sceneDuck(ctx, w, h, t);
  } else if (m === 'beach') { S.tb += dt; sceneBeach(ctx, w, h, dt, t); }
  else if (m === 'tide') {
    if (S.play) { S.hour += dt * 1.5; if (S.hour >= 24) S.hour -= 24; $('bRange').value = String(S.hour); $('bSlV').textContent = hhmm(S.hour); const tt = tideTexts(T[lang]); ro(hhmm(S.hour), T[lang].b.clock, tt.label, '#8fb4ff'); }
    sceneTide(ctx, w, h, t);
  } else if (m === 'rope') sceneRope(ctx, w, h, dt, t);
  else sceneStadium(ctx, w, h, dt, t);
});
render();
</script>
