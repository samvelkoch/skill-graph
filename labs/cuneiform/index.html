function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, R(r)); }

  hl.addColorStop(0, 'rgba(255,240,215,.34)'); hl.addColorStop(1, 'rgba(255,240,215,0)');

// one wedge: wide head at (hx,hy), tip at (tx,ty); k grows it from the head
function wedge(c, hx, hy, tx, ty, wd, k = 1, a = 1) {

// --- items (signs and numbers) in cell units: 1 cell = one square of the tablet -----------------------------------
function glyphItem(ws) { const m = .86 / 100, o = .07; return { w: 1, recs: ws.map(([a, b, c2, d, wd]) => ({ hx: o + a * m, hy: o + b * m, tx: o + c2 * m, ty: o + d * m, wd: (wd || 10) * m })) }; }

}
const zeroItem = () => glyphItem([[26, 20, 52, 66], [50, 20, 76, 66]]);
const gapItem = () => ({ w: .6, recs: [] });
function letterWedges(ch) {
  const r = rng(ch.codePointAt(0) * 2654435761), n = 2 + Math.floor(r() * 3), out = [];

    if (k === 0) out.push([b, a + 10, b + L, a + 10]);
    else if (k === 1) out.push([a + 10, b, a + 10, b + L]);
    else if (k === 2) out.push([b, b, b + L * .8, b + L * .8]);

}

}
function place(items) {

    if (S.cur.row >= ROWS) { smoothClay(); }
    for (const r of it.recs) S.queue.push({ hx: r.hx + S.cur.col, hy: r.hy + S.cur.row, tx: r.tx + S.cur.col, ty: r.ty + S.cur.row, wd: r.wd });

  if (S.placed.length) S.fade = { recs: S.placed, t0: -1 };
  S.placed = []; S.queue = []; S.cur = { col: 0, row: 0 };

    const rn = rng(r * 977 + 13), nw = Math.floor(sw * .76 / 8), x0 = sx + sw * .12;
    for (let k = 0; k < nw; k++) {
      if (rn() < .12) continue;
      const x = x0 + k * (sw * .76 / nw), y = ry + rh * .2, ty2 = rh * .6, kind = Math.floor(rn() * 3), ww = 3.2;
      const draw = (ox, oy) => { c.beginPath(); if (kind === 0) { c.moveTo(x - ww + ox, y + oy); c.lineTo(x + ww + ox, y + oy); c.lineTo(x + ox, y + ty2 + oy); } else if (kind === 1) { c.moveTo(x - 4 + ox, y + ty2 * .4 + oy - ww / 2); c.lineTo(x - 4 + ox, y + ty2 * .4 + oy + ww / 2); c.lineTo(x + 4 + ox, y + ty2 * .4 + oy); } else { c.moveTo(x - ww + ox, y + oy); c.lineTo(x + ww + ox, y + oy); c.lineTo(x + ox, y + ty2 * .7 + oy); } c.closePath(); c.fill(); };
      c.fillStyle = 'rgba(255,255,255,.14)'; draw(.8, .8);
      c.fillStyle = ink ?? 'rgba(8,9,12,.62)'; draw(0, 0);
    }
  }
  c.restore();
  c.lineWidth = 1; c.strokeStyle = 'rgba(255,255,255,.08)'; c.beginPath(); c.roundRect(sx + 3, ty + 3, sw - 6, sh - 16, [sw * .42, sw * .42, 3, 3]); c.stroke();
  // number badges for the glowing rows
  GLOW.forEach((r, gi) => {
    const by = y1 + r * rh + rh / 2, bx = sx - 18;
    c.beginPath(); c.arc(bx, by, 11, 0, 6.3); c.fillStyle = S.read[gi] ? '#7bd9a8' : `rgba(255,211,122,${.75 + .25 * glowP})`; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#1a1b20'; c.stroke();
    c.fillStyle = '#1a1b20'; c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(gi + 1), bx, by + 1);
  });
  S.geoL = { sx, sw, y1, rh };
  // people: one child at first, a whole city once the question is answered
  viewer(c, sx - 52 * sc, base - 2, sc * 1.05, '#5f86a8');
  if (S.crowd > 0) {
    const e = eo(S.crowd), cols = ['#b5654a', '#8f7aa8', '#6aa27f', '#c79a4a', '#7a8fb5', '#a8546a'];
    for (let i = 0; i < 6; i++) {
      const left = i < 3, k = left ? i : i - 3, fx = left ? sx - 52 * sc - (k + 1) * 24 * sc : sx + sw + 34 * sc + k * 24 * sc, from = left ? -20 : w + 20;
      viewer(c, lerp(from, fx, e), base - 2 + (k % 2) * 2, sc * (1 - (k % 2) * .06), cols[i]);
    }
  }
}

// --- the canvas loop -------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, t) => {
  c.save(); c.beginPath(); c.roundRect(0, 0, w, h, 18); c.clip();
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#2d2a3f'); bg.addColorStop(1, '#1b1c30'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const v = lab.view;
  if (v === 'tokens') drawTokens(c, w, h, dt);
  else if (v === 'press') { const hg = c.createRadialGradient(w * .2, 0, 0, w * .2, 0, w * .8); hg.addColorStop(0, 'rgba(255,200,140,.12)'); hg.addColorStop(1, 'rgba(255,200,140,0)'); c.fillStyle = hg; c.fillRect(0, 0, w, h); drawPress(c, w, h, dt, t); }
  else drawLaw(c, w, h, dt, t);
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------------
$('ctrlBody').innerHTML = `
  <div id="cfTk" hidden>
    <div id="tkQ" class="cf-q" hidden></div>
    <div class="cf-row"><button class="chip" data-act="tkBack" id="tkBack"></button><button class="btn cf-push" data-act="tkNext" id="tkNext"></button></div>
  </div>
  <div id="cfPr" hidden>
    <div id="prQ" class="cf-q"></div>
    <div id="prMain">
      <div class="cf-row" style="margin-top:0"><div class="chips" id="prModes"></div></div>
      <div id="prSigns"><div class="chips" id="palette" style="margin-top:10px"></div>
        <div class="cf-sl"><label for="tm" id="tmL"></label><input class="big" id="tm" type="range" min="0" max="1000" step="1" value="0"><output id="tmO"></output></div></div>
      <div id="prNum"><div class="cf-sl"><button class="sb" data-act="ndec" aria-label="−">−</button><input class="big" id="nr" type="range" min="1" max="59" step="1" value="23"><button class="sb" data-act="ninc" aria-label="+">+</button><output id="nrO"></output></div></div>
      <div id="prB60"><div class="cf-sl"><label for="sx" id="sxL"></label><input class="big" id="sx" type="range" min="0" max="59" step="1" value="1"><output id="sxO"></output></div>
        <div class="cf-sl"><label for="so" id="soL"></label><input class="big" id="so" type="range" min="0" max="59" step="1" value="15"><output id="soO"></output></div></div>
      <div id="prName"><div class="cf-row"><input class="cf-in" id="nmIn" maxlength="14" autocomplete="off" spellcheck="false"></div><div class="cf-note" id="nmNote"></div></div>
      <div class="cf-row"><button class="btn" data-act="write" id="wr"></button><button class="chip" data-act="smooth" id="sm"></button></div>
    </div>
  </div>
  <div id="cfLw" hidden><div id="lwQ" class="cf-q"></div><div class="cf-law" id="lwTxt"></div></div>
  <div class="cf-sec" id="cfSec"></div>`;

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const goPress = () => { if (lab.view !== 'press') { lab.view = 'press'; lab.renderChrome(); } };
const writeNow = () => {
  if (S.pm === 'num' && S.n < 1) return;
  if (S.pm === 'b60' && S.hi + S.lo === 0) return;
  if (S.pm === 'name' && !/\p{L}/u.test(S.name)) return;
  place(itemsFor()); sfx.click();
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'tkNext') {
    if (S.tk === 1 && S.tkAns === null) return;
    S.tk = S.tk === 3 ? 0 : S.tk + 1; S.p = 0; if (S.tkAns !== null) S.rp = 1; sfx.click(); showStage();
  } else if (act === 'tkBack') { if (S.tk > 0) { S.tk--; S.p = 1; if (S.tkAns !== null) S.rp = 1; sfx.click(); } }
  else if (b.dataset.tk !== undefined) { if (S.tkAns !== null) return; S.tkAns = +b.dataset.tk; S.rp = 0; (S.tkAns === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (b.dataset.pq !== undefined) { if (S.pq !== null) return; S.pq = +b.dataset.pq; S.u = 0; $('tm').value = 0; (S.pq === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (b.dataset.lq !== undefined) { if (S.lq !== null) return; S.lq = +b.dataset.lq; (S.lq === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (b.dataset.pmode) { S.pm = b.dataset.pmode; sfx.click(); }
  else if (b.dataset.sign !== undefined) { S.sign = +b.dataset.sign; place([glyphItem(stageWedges(S.sign))]); sfx.click(); }
  else if (act === 'write') writeNow();
  else if (act === 'smooth') { smoothClay(); sfx.click(); }
  else if (act === 'ndec') { S.n = clamp(S.n - 1, 1, 59); sfx.tick(); }
  else if (act === 'ninc') { S.n = clamp(S.n + 1, 1, 59); sfx.tick(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k, want = k === 'a' ? 'b60' : 'name';
    if (S.pq === null) S.pq = 'skip';
    S.pm = lab.view === 'press' && S.pm === want ? 'signs' : want; goPress(); sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'tm') S.u = +ev.target.value / 1000;
  else if (id === 'nr') S.n = +ev.target.value;
  else if (id === 'sx') S.hi = +ev.target.value;
  else if (id === 'so') S.lo = +ev.target.value;
  else if (id === 'nmIn') S.name = ev.target.value;
  else return;
  render();
});
$('ctrlBody').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.id === 'nmIn') { ev.preventDefault(); writeNow(); } });
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'law' || !S.geoL) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, g = S.geoL;
  if (x < g.sx - 36 || x > g.sx + g.sw + 8) return;
  const gi = GLOW.findIndex((row) => y >= g.y1 + row * g.rh - 3 && y <= g.y1 + (row + 1) * g.rh + 3);
  if (gi < 0) return;
  S.read[gi] = true; S.open = gi; sfx.snap(); render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------------------
function chipsHtml(list, sel, right, attr) {
  return list.map((t, i) => `<button class="chip ${sel === null ? '' : i === right ? 'cf-good' : i === sel ? 'cf-bad' : ''}" data-${attr}="${i}"${sel === null ? '' : ' disabled'}>${esc(t)}</button>`).join('');
}
function qBlock(el, q, chips, sel, right, attr, why, t) {
  const fb = sel === null || sel === 'skip' ? '' : `<div class="cf-fb"><b class="${sel === right ? 'ok' : 'no'}">${esc(sel === right ? t.right : t.wrong)}</b>${esc(why)}</div>`;
  el.innerHTML = `<div class="cf-qt">${esc(q)}</div><div class="chips">${chipsHtml(chips, sel === 'skip' ? null : sel, right, attr)}</div>${fb}`;
}
function setVal(el, v) { if (el.value !== String(v)) el.value = v; }
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('cfTk').hidden = v !== 'tokens'; $('cfPr').hidden = v !== 'press'; $('cfLw').hidden = v !== 'law';
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${(S.pm === 'b60' && k === 'a' || S.pm === 'name' && k === 'b') && v === 'press' ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('cfSec').innerHTML = sc('a', '🔢') + sc('b', '🏺');
  lab.setFacts(t.facts[v]);
  if (v === 'tokens') renderTk(t); else if (v === 'press') renderPress(t); else renderLaw(t);
}
function renderTk(t) {
  const s = S.tk, k = t.tk, ans = S.tkAns;
  lab.setGlow('rgba(200,150,95,.26)');
  $('tkQ').hidden = s !== 1;
  if (s === 1) qBlock($('tkQ'), k.q[1], k.chips, ans, 1, 'tk', k.why, t);
  $('tkBack').textContent = '← ' + t.back; $('tkBack').disabled = s === 0; $('tkBack').style.opacity = s === 0 ? .35 : 1;
  $('tkNext').textContent = s === 3 ? t.again : t.next + ' →'; $('tkNext').disabled = s === 1 && ans === null;
  lab.setReadout('5', t.sheepSub, t.step(s + 1), '#c9a27a');
  const st = s === 0 ? k.s0 : s === 1 ? k.q : s === 2 ? k.s2 : k.s3;
  const emo = ['🐑', ans === null ? '🤔' : '🏺', '📜', '🔢'][s];
  if (s === 1 && ans !== null) lab.setState({ emo, title: { en: 'Marks on the skin', ru: 'Отпечатки на шаре', hu: 'Lenyomatok a héjon' }[lang], lead: k.why, body: '', extra: '' });
  else lab.setState({ emo, title: st[0], lead: st[1], body: '', extra: '' });
}
function renderPress(t) {
  const k = t.pr, ans = S.pq;
  lab.setGlow('rgba(200,150,95,.26)');
  qBlock($('prQ'), k.q, k.chips, ans, 0, 'pq', k.why, t);
  $('prQ').hidden = ans === 'skip';
  $('prMain').hidden = ans === null;
  const pm = S.pm;
  $('prModes').innerHTML = [['signs', t.mSigns], ['num', t.mNums]].map(([m, l]) => `<button class="chip ${pm === m ? 'on' : ''}" data-pmode="${m}">${esc(l)}</button>`).join('');
  $('prSigns').hidden = pm !== 'signs'; $('prNum').hidden = pm !== 'num'; $('prB60').hidden = pm !== 'b60'; $('prName').hidden = pm !== 'name';
  $('palette').innerHTML = SIGNS.map((_, i) => `<button class="chip ${S.sign === i ? 'on' : ''}" data-sign="${i}">${SIGN_EMO[i]} ${esc(t.signNames[i])}</button>`).join('');
  $('tmL').textContent = t.time; setVal($('tm'), Math.round(S.u * 1000));
  const yr = Math.round((3100 - S.u * 2450) / 10) * 10; $('tmO').textContent = t.bc(yr);
  setVal($('nr'), S.n); $('nrO').textContent = S.n;
  $('sxL').textContent = t.sixties; $('soL').textContent = t.ones; setVal($('sx'), S.hi); setVal($('so'), S.lo); $('sxO').textContent = S.hi; $('soO').textContent = S.lo;
  $('nmIn').placeholder = t.nameHint; $('nmNote').textContent = t.nameNote;
  $('wr').textContent = t.writeIt; $('sm').textContent = t.smooth;
  const parts = (a, b, ma, mb) => [a > 0 ? `${a} × ${ma}` : '', b > 0 ? `${b} × ${mb}` : ''].filter(Boolean).join(' + ') || '0';
  if (ans === null) { lab.setReadout('?', '', '', '#c9a27a'); lab.setState({ emo: '🤔', title: k.q, lead: '', body: '', extra: '' }); return; }
  let st;
  if (pm === 'signs') {
    const stage = S.u < .2 ? 0 : S.u < .6 ? 1 : 2;
    lab.setReadout(yr === 3100 ? t.bc(3100) : t.bc(yr), t.stages[stage], SIGNS[S.sign].rd, '#c9a27a'); st = ['✏️', k.signs[0], k.signs[1][stage]];
  } else if (pm === 'num') { lab.setReadout(String(S.n), '= ' + parts(Math.floor(S.n / 10), S.n % 10, 10, 1), '', '#c9a27a'); st = ['🔢', ...k.num]; }
  else if (pm === 'b60') { lab.setReadout(String(S.hi * 60 + S.lo), '= ' + parts(S.hi, S.lo, 60, 1), t.clock(S.hi, S.lo), '#e0b050'); st = ['⏱️', ...k.b60]; }
  else { const n = Array.from(S.name).filter((ch) => /\p{L}/u.test(ch)).slice(0, 14).length; lab.setReadout(String(n), t.signsN(n).replace(/^\d+\s*/, ''), '', '#e0b050'); st = ['🏺', ...k.name]; }
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' });
}
function renderLaw(t) {
  const k = t.law, ans = S.lq, n = S.read.filter(Boolean).length;
  lab.setGlow('rgba(160,150,190,.24)');
  qBlock($('lwQ'), k.q, k.chips, ans, 0, 'lq', k.why, t);
  $('lwTxt').textContent = S.open >= 0 ? k.rows[S.open] : k.s0[1];
  lab.setReadout(`${n} / 3`, t.lawsRead, t.bc(1754), '#a8a0c8');
  if (S.open >= 0) lab.setState({ emo: '⚖️', title: k.s1, lead: k.rows[S.open], body: '', extra: '' });
  else lab.setState({ emo: '🗿', title: k.s0[0], lead: k.s0[1], body: '', extra: '' });
}
render();
</script>
