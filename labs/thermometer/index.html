const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); };
function pill(c, text, x, y, o = {}) {
  const { size = 12, fg = '#fff', bg = 'rgba(10,16,34,.82)', align = 'center', padX = 10, h = 22 } = o;
  c.save(); c.font = `800 ${size}px ${FONT}`; c.textBaseline = 'middle'; c.textAlign = 'left';
  const pw = c.measureText(text).width + padX * 2;
  let px = align === 'center' ? x - pw / 2 : align === 'left' ? x : x - pw;
  if (o.cw) px = Math.max(4, Math.min(o.cw - pw - 4, px));
  rr(c, px, y - h / 2, pw, h, h / 2); c.fillStyle = bg; c.fill();
  c.fillStyle = fg; c.fillText(text, px + padX, y + 1); c.restore();
}
function emoji(c, ch, x, y, size) {
  c.save(); c.globalAlpha = 1; c.fillStyle = '#fff'; c.font = `${size}px ${EMOJI}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(ch, x, y); c.restore();
}
// split a label into at most two lines that fit maxW
function wrap2(c, text, maxW) {
  if (c.measureText(text).width <= maxW) return [text];
  const words = text.split(' ');
  let best = [text], bestW = Infinity;
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0, i).join(' '), b = words.slice(i).join(' '), m = Math.max(c.measureText(a).width, c.measureText(b).width);
    if (m < bestW) { bestW = m; best = [a, b]; }
  }
  return best;
}

// o: x (tube axis), yHot / yCold (where max / min sit), tw (tube width), br (bulb radius), min, max, val,
//    band, minor / major / every (tick steps in degrees), rot (the picture is rotated by this angle)
function drawThermo(c, o) {
  const { x, yHot, yCold, tw, br, min, max, val } = o, rot = o.rot || 0;
  const a = tw / 2, rb = br + 3, k = Math.sqrt(rb * rb - a * a);
  const yAt = (t) => yCold - (clamp(t, min, max) - min) / (max - min) * (yCold - yHot);
  const yb = yCold + br * 1.1, top = yHot - a * 1.4, L = x - a, Rr = x + a, cw = tw * 0.36;
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';

// --- motion of the thermometer in the cups scene -----------------------------------------------------------
function stepsTo(i, wait = 0) {
  const s = [];
  if (M.lift < 0.98) s.push({ k: 'lift', d: 0.5 });
  if (wait) s.push({ k: 'wait', d: wait });
  if (Math.abs(M.fx - CUPS[i].fx) > 0.001) s.push({ k: 'slide', to: CUPS[i].fx, d: 0.6 });
  s.push({ k: 'dip', cup: i, d: 0.55 });
  M.dest = i;
  return s;
}
function goCup(i) {
  if (S.sec) return;
  if (M.dest === i && !M.steps.length && M.lift < 0.02) return;
  M.steps = stepsTo(i); sfx.click(); render();
}

// one tick of everything that moves independently of the drawing
function tick(dt) {
  M.ph += dt * (1.3 + 10 * clamp01((M.reading - MIN) / (MAX - MIN)));
  const st = M.steps[0];
  if (st) {
    if (st.t === undefined) {
      st.t = 0; st.f0 = M.fx; st.l0 = M.lift;
      if (st.k === 'dip') M.cup = st.cup;
      if (st.k === 'lift') { if (M.lift < WET) M.drip = 0.7; sfx.push(); }
    }
    st.t += dt;
    const p = clamp01(st.t / st.d), e = ease(p);
    if (st.k === 'lift') M.lift = lerp(st.l0, 1, e);
    else if (st.k === 'slide') { M.fx = lerp(st.f0, st.to, e); M.tilt = Math.sin(p * Math.PI) * 0.1 * Math.sign(st.to - st.f0); }
    else if (st.k === 'dip') {
      M.lift = lerp(st.l0, 0, e);
      if (!st.rip && M.lift < WET) { st.rip = true; M.rip.push({ cup: M.cup, t: 0 }); sfx.click(); }
    }
    if (p >= 1) { M.steps.shift(); if (st.k === 'slide') M.tilt = 0; if (st.k === 'dip') M.lift = 0; }
  }
  if (M.lift < WET) M.target = CUPS[M.cup].t;
  const d = M.target - M.reading;
  M.reading = Math.abs(d) < 0.05 ? M.target : M.reading + d * (1 - Math.exp(-dt / 0.55));
  M.rip.forEach((r) => { r.t += dt / 0.9; }); M.rip = M.rip.filter((r) => r.t < 1);
  if (S.hold && !M.steps.length && Math.abs(M.target - M.reading) < 1) { S.hold = false; render(); }
  if (S.guess !== null && !S.shown && !M.steps.length && Math.abs(M.target - M.reading) < 1) {
    S.shown = true; (OKC[S.qi] === S.guess ? sfx.good : sfx.bad)(); render();
  }
  if (S.tg !== null && !S.tdone) {
    S.tt += dt;
    if (S.tt >= TT_END) { S.tdone = true; (S.tg === 2 ? sfx.good : sfx.bad)(); render(); }
  }
  if (S.checked) S.ct += dt;
  B.bl += (S.bt - B.bl) * (1 - Math.exp(-dt / 0.8));
  B.ha += ((S.bmode === 1 ? 1 : 0) - B.ha) * (1 - Math.exp(-dt / 0.35));
  B.ia += ((S.bmode === 2 ? 1 : 0) - B.ia) * (1 - Math.exp(-dt / 0.3));
  R.t += dt;
}

// --- records: the column runs down to the coldest and up to the hottest place --------------------------------
const REC_COLD = -89.2, REC_HOT = 56.7;
function recPhase(t) {
  const c = t % 12;
  if (c < 1) return { v: 20, cold: 0, hot: 0 };
  if (c < 3.4) return { v: lerp(20, REC_COLD, ease((c - 1) / 2.4)), cold: 0, hot: 0 };
  if (c < 5) return { v: REC_COLD, cold: (c - 3.4) / 1.6, hot: 0 };
  if (c < 8) return { v: lerp(REC_COLD, REC_HOT, ease((c - 5) / 3)), cold: 0, hot: 0 };
  if (c < 10) return { v: REC_HOT, cold: 0, hot: (c - 8) / 2 };
  return { v: lerp(REC_HOT, 20, ease((c - 10) / 2)), cold: 0, hot: 0 };
}

// --- readout (also called from the draw loop, so it never gets stuck) -------------------------------------------
let rdKey = '';
function readout() {
  const t = T[lang], v = lab.view;
  let val = '', sub = '', col = C.cold;
  if (v === 'cups') {
    if (S.sec === 'bottle') { val = `${fmt(Math.round(B.bl))} ${t.mm}`; col = C.red; }
    else if (S.sec === 'records') { const x = R.val; val = deg(x, 1); sub = t.c.word(x); col = fracColor((x + 90) / 150); }
    else { const x = Math.round(M.reading); val = deg(x); sub = t.c.word(x); col = tempColor(M.reading); }
  } else if (v === 'scale') {
    if (S.checked) { const it = ITEMS[S.selAfter]; val = deg(it[1]); sub = t.s.names[S.selAfter]; col = tempColor(it[1]); }
    else { val = `${S.pos.filter((p) => p !== null).length}/8`; sub = t.s.tap; col = C.cool; }
  } else {
    val = S.tg !== null && S.tt > 1.1 ? deg(20) : '?'; col = C.metal;
  }
  const key = `${val}|${sub}|${col}|${lang}`;
  if (key !== rdKey) { rdKey = key; lab.setReadout(val, sub, '', col); }
}

// --- drawing: a shared backdrop, then one scene per view ------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  tick(dt);
  c.save();
  rr(c, 0, 0, w, h, 20); c.clip();
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#1C2A4A'); g.addColorStop(1, '#24365C');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'cups') { if (S.sec === 'bottle') drawBottle(c, w, h, time); else if (S.sec === 'records') drawRecords(c, w, h); else drawCups(c, w, h, dt, time); }
  else if (v === 'scale') drawScale(c, w, h, dt);
  else drawTouch(c, w, h, dt, time);
  c.restore();
  readout();
});

// ----- view 1: cups -----------------------------------------------------------------------------------------
function cupsLayout(w, h) {
  const gh = h * 0.16, gw = clamp(w * 0.24, 70, 118), gb = h * 0.915;
  const br = clamp(h * 0.04, 12, 19), tw = clamp(h * 0.046, 15, 24), th = h * 0.68;
  const yb = gb - 6 - br, yCold = yb - br * 1.1, bottom = yb + br + 3;
  return { gh, gw, gb, br, tw, lift: h * 0.195, yb, yCold, yHot: bottom - th + tw * 0.7, waterY: gb - gh * 0.8, xs: CUPS.map((p) => p.fx * w) };
}

function glass(c, L, i, pass) {
  const cp = CUPS[i], x = L.xs[i], gw = L.gw, bw = gw * 0.78, gb = L.gb, gt = gb - L.gh, ry = gw * 0.5 * 0.15, bry = bw * 0.5 * 0.15;
  const wy = L.waterY, hww = lerp(bw / 2, gw / 2, (gb - bry - wy) / (gb - bry - gt)), sry = hww * 0.15;
  const wall = () => { c.beginPath(); c.moveTo(x - gw / 2, gt); c.lineTo(x - bw / 2, gb - bry); c.ellipse(x, gb - bry, bw / 2, bry, 0, Math.PI, 0, true); c.lineTo(x + gw / 2, gt); };
  const water = () => {
    c.beginPath(); c.moveTo(x - hww, wy); c.lineTo(x - bw / 2, gb - bry); c.ellipse(x, gb - bry, bw / 2, bry, 0, Math.PI, 0, true);
    c.lineTo(x + hww, wy); c.ellipse(x, wy, hww, sry, 0, 0, Math.PI); c.closePath();
  };
  c.save(); c.lineJoin = 'round';
  if (pass === 0) {
    c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(x + 4, gb + 1, bw * 0.6, bry * 1.7, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(x, gt, gw / 2, ry, 0, Math.PI, Math.PI * 2); c.strokeStyle = 'rgba(210,235,255,.4)'; c.lineWidth = 1.5; c.stroke();
    const wg = c.createLinearGradient(0, wy, 0, gb); wg.addColorStop(0, cp.w0); wg.addColorStop(1, cp.w1);
    water(); c.fillStyle = wg; c.fill();
    c.beginPath(); c.ellipse(x, wy, hww, sry, 0, 0, Math.PI * 2); c.fillStyle = cp.surf; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(255,255,255,.45)'; c.stroke();
  } else {
    wall(); c.closePath(); c.fillStyle = 'rgba(190,225,255,.07)'; c.fill();
    water(); c.fillStyle = cp.ov; c.fill();
    c.beginPath(); c.moveTo(x - gw / 2 + 7, gt + 8); c.lineTo(x - bw / 2 + 6, gb - bry - 10); c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 4; c.stroke();
    const sg = c.createLinearGradient(0, gt, 0, gb); sg.addColorStop(0, 'rgba(255,255,255,.8)'); sg.addColorStop(1, 'rgba(160,205,255,.35)');
    wall(); c.strokeStyle = sg; c.lineWidth = 2.5; c.stroke();
    c.beginPath(); c.ellipse(x, gt, gw / 2, ry, 0, 0, Math.PI); c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2; c.stroke();
    c.beginPath(); c.ellipse(x, gb - bry - 2, bw / 2 - 5, Math.max(0, bry - 2), 0, 0.15, Math.PI - 0.15); c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1.5; c.stroke();
  }
  c.restore();
}

function steam(c, L, time) {
  const x = L.xs[2], top = L.waterY - L.gh * 1.2;
  c.save(); c.lineWidth = 3.5; c.lineCap = 'round';
  const g = c.createLinearGradient(0, L.waterY, 0, top);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.15, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.strokeStyle = g;
  for (let k = 0; k < 3; k++) {
    const bx = x + (k - 1) * L.gw * 0.24;
    c.beginPath();
    for (let n = 0; n <= 14; n++) {
      const u = n / 14, X = bx + Math.sin(u * 6 + time * 1.7 + k * 2.1) * (3 + u * 9), Y = L.waterY - 6 - u * (L.waterY - 6 - top);
      if (n) c.lineTo(X, Y); else c.moveTo(X, Y);
    }
    c.stroke();
  }
  c.restore();
}

// the zoom bubble: liquid as particles that jiggle faster and spread out as it gets warmer
const PARTS = Array.from({ length: 25 }, (_, i) => ({ col: i % 5, row: (i / 5) | 0, jx: ((i * 37) % 11) / 11 - 0.5, jy: ((i * 53) % 13) / 13 - 0.5, p1: i * 1.7, p2: i * 2.9, k1: 1 + ((i * 7) % 5) * 0.09, k2: 1 + ((i * 11) % 5) * 0.07 }));
function drawBubble(c, cx, cy, R0, reading, ph) {
  const f = clamp01((reading - MIN) / (MAX - MIN)), r = R0 - 3;
  c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 14; c.shadowOffsetY = 4;
  c.beginPath(); c.arc(cx, cy, R0, 0, Math.PI * 2); c.fillStyle = '#0f1a33'; c.fill(); c.restore();
  c.save(); c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.clip();
  const bgG = c.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r); bgG.addColorStop(0, '#223a6b'); bgG.addColorStop(1, '#0f1a33');
  c.fillStyle = bgG; c.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  const boxW = r * 1.45, bottom = cy + r * 0.72, hf = r * 1.3 * lerp(0.34, 0.95, f), amp = lerp(0.6, 4.5, f) * (R0 / 56), pr = R0 * 0.062;
  const lq = c.createLinearGradient(0, bottom - hf, 0, bottom); lq.addColorStop(0, 'rgba(232,71,90,.30)'); lq.addColorStop(1, 'rgba(201,40,59,.16)');
  c.fillStyle = lq; c.fillRect(cx - r, bottom - hf - pr * 1.2, 2 * r, hf + pr * 1.2 + r);
  c.beginPath(); c.moveTo(cx - r, bottom - hf - pr * 1.2); c.lineTo(cx + r, bottom - hf - pr * 1.2); c.strokeStyle = 'rgba(255,150,160,.7)'; c.lineWidth = 2; c.stroke();
  for (const p of PARTS) {
    const hx = cx - boxW / 2 + (p.col + 0.5 + p.jx * 0.35) / 5 * boxW, hy = bottom - (p.row + 0.5 + p.jy * 0.35) / 5 * hf;
    const X = hx + amp * Math.sin(ph * p.k1 + p.p1) * Math.cos(ph * 0.7 + p.p2), Y = hy + amp * Math.cos(ph * p.k2 + p.p2) * Math.sin(ph * 0.6 + p.p1);
    c.beginPath(); c.arc(X, Y, pr, 0, Math.PI * 2); c.fillStyle = '#FF6B6B'; c.fill();
    c.beginPath(); c.arc(X - pr * 0.3, Y - pr * 0.3, pr * 0.35, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,.55)'; c.fill();
  }
  c.restore();
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.lineWidth = 3; c.strokeStyle = 'rgba(200,230,255,.8)'; c.stroke();
  c.beginPath(); c.arc(cx, cy, r - 6, Math.PI * 1.08, Math.PI * 1.45); c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.4)'; c.stroke();
}

function drawCups(c, w, h, dt, time) {
  const t = T[lang], L = cupsLayout(w, h), lp = M.lift * L.lift, px = M.fx * w, topY = L.yHot - L.tw * 0.7;
  G.cups = { xs: L.xs, top: h * 0.45 };
  // table
  const tg = c.createLinearGradient(0, L.gb - 6, 0, h); tg.addColorStop(0, '#2d3d68'); tg.addColorStop(1, '#1a2543');
  c.fillStyle = tg; c.fillRect(0, L.gb - 6, w, h - L.gb + 6);
  c.fillStyle = 'rgba(255,255,255,.1)'; c.fillRect(0, L.gb - 6, w, 1.5);
  CUPS.forEach((_, i) => glass(c, L, i, 0));
  // ripples where the bulb went in
  for (const r of M.rip) {
    const rx = lerp(6, L.gw * 0.4, ease(r.t));
    c.beginPath(); c.ellipse(L.xs[r.cup], L.waterY, rx, rx * 0.15, 0, 0, Math.PI * 2); c.strokeStyle = `rgba(255,255,255,${(1 - r.t) * 0.6})`; c.lineWidth = 1.5; c.stroke();
  }
  // the thermometer, swinging a little while it travels
  c.save(); c.translate(px, topY - lp); c.rotate(M.tilt); c.translate(-px, -topY);
  drawThermo(c, { x: px, yHot: L.yHot, yCold: L.yCold, tw: L.tw, br: L.br, min: MIN, max: MAX, val: M.reading, band: true, minor: 2, major: 10, every: 10 });
  c.restore();
  CUPS.forEach((_, i) => glass(c, L, i, 1));
  // drops falling off the bulb as it comes out
  const bx = px, by = L.yb + L.br + 3 - lp;
  if (M.drip > 0) {
    M.drip -= dt; M.dacc += dt;
    while (M.dacc > 0.035) { M.dacc -= 0.035; M.drops.push({ x: bx + (Math.random() - 0.5) * 9, y: by - 2, vy: 0, r: 2 + Math.random() * 1.8, life: 1 }); }
  }
  for (const d of M.drops) { d.vy += 900 * dt; d.y += d.vy * dt; d.life -= dt; }
  M.drops = M.drops.filter((d) => d.y < L.waterY + 2 && d.life > 0);
  c.fillStyle = CUPS[M.cup].drop;
  for (const d of M.drops) { c.beginPath(); c.ellipse(d.x, d.y, d.r * 0.75, d.r * 1.15, 0, 0, Math.PI * 2); c.fill(); }
  // ice cubes sit on the water of the icy glass, at full opacity
  const isz = Math.round(clamp(L.gw * 0.3, 20, 34)), bob = (k) => Math.sin(time * 1.3 + k * 2) * 2;
  emoji(c, '🧊', L.xs[0] - L.gw * 0.27, L.waterY + 3 + bob(0), isz);
  emoji(c, '🧊', L.xs[0] + L.gw * 0.26, L.waterY + 7 + bob(1), isz);
  if (Math.abs(M.fx - CUPS[0].fx) > 0.05 || M.lift > 0.6) emoji(c, '🧊', L.xs[0] - L.gw * 0.02, L.waterY + 9 + bob(2), Math.round(isz * 0.9));
  steam(c, L, time);
  // the zoom bubble sits on the side away from the thermometer
  M.side += ((M.dest === 2 ? -1 : 1) - M.side) * (1 - Math.exp(-dt * 6));
  const R0 = clamp(Math.min(w, h) * 0.14, 40, 66), bcx = clamp(px + M.side * (R0 + L.tw / 2 + 78), R0 + 10, w - R0 - 10), bcy = clamp(h * 0.27, R0 + 10, h);
  c.save(); c.setLineDash([3, 4]); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.5;
  c.beginPath(); c.arc(bx, L.yb - lp, L.br + 8, 0, Math.PI * 2); c.stroke();
  const ang = Math.atan2(bcy - (L.yb - lp), bcx - bx);
  c.beginPath(); c.moveTo(bx + Math.cos(ang) * (L.br + 8), L.yb - lp + Math.sin(ang) * (L.br + 8)); c.lineTo(bcx - Math.cos(ang) * R0, bcy - Math.sin(ang) * R0); c.strokeStyle = 'rgba(255,255,255,.3)'; c.stroke();
  c.restore();

  };
  c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 14; c.shadowOffsetY = 6; body(); c.fillStyle = 'rgba(200,230,255,.2)'; c.fill(); c.restore();
  c.save(); body(); c.clip();
  const wg = c.createLinearGradient(cx - bw, 0, cx + bw, 0); wg.addColorStop(0, '#F0687A'); wg.addColorStop(0.5, C.red); wg.addColorStop(1, '#B8283C');
  c.fillStyle = wg; c.fillRect(cx - bw, neckT, bw * 2, bodyB - neckT);

  c.restore();

  c.beginPath(); c.moveTo(cx - nw - 3, capTop); c.lineTo(cx + nw + 3, capTop); c.lineTo(cx + nw + 6, neckT + 2); c.lineTo(cx - nw - 6, neckT + 2); c.closePath();
  c.fillStyle = cg; c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(70,40,15,.7)'; c.stroke();

  // ice around the bottle

    spots.forEach(([dx, dy], n) => emoji(c, '🧊', cx + dx * bw, bodyB - 14 * dy - 6 - (n > 4 ? 28 : 0), Math.round(34 * s)));

    c.save(); c.translate(cx + bw + hs * 0.2 + (1 - e) * 70, y); c.scale(-1, 1); emoji(c, '🖐️', 0, 0, hs); c.restore();

}

// ----- secret 2: Earth's records --------------------------------------------------------------------------------------
const LAND = [
  [[-168, 66], [-160, 70], [-140, 70], [-125, 70], [-95, 72], [-80, 70], [-65, 60], [-55, 52], [-67, 45], [-76, 36], [-81, 25], [-97, 26], [-97, 18], [-87, 21], [-82, 9], [-92, 15], [-105, 20], [-117, 32], [-124, 40], [-125, 49], [-135, 58], [-150, 60], [-165, 62]],
  [[-55, 60], [-45, 60], [-20, 70], [-20, 82], [-60, 82], [-70, 76]],
  [[-78, 8], [-60, 10], [-50, 0], [-35, -6], [-40, -22], [-55, -35], [-66, -47], [-70, -55], [-75, -48], [-72, -30], [-70, -18], [-81, -5]],
  [[-17, 21], [-6, 36], [10, 37], [32, 31], [43, 12], [51, 12], [40, -5], [40, -16], [33, -26], [20, -35], [15, -28], [12, -12], [9, 4], [-8, 4], [-17, 14]],
  [[-10, 36], [-9, 43], [-1, 46], [-5, 50], [8, 54], [5, 60], [15, 68], [30, 71], [60, 69], [90, 76], [130, 72], [160, 69], [180, 66], [170, 60], [150, 58], [140, 45], [128, 35], [122, 30], [120, 22], [108, 10], [103, 1], [98, 15], [90, 22], [80, 10], [73, 20], [60, 25], [48, 30], [36, 35], [28, 36], [22, 38], [12, 44], [3, 43], [-5, 36]],
  [[114, -22], [125, -14], [137, -12], [143, -11], [153, -26], [150, -37], [140, -38], [130, -32], [115, -34]],
];
const ICE = [[-180, -70], [-120, -74], [-60, -72], [0, -70], [60, -68], [120, -66], [180, -70], [180, -90], [-180, -90]];
function blob(c, pts, P) { // a closed shape with smoothed corners
  const q = pts.map(([lo, la]) => P(lo, la)), n = q.length;
  c.beginPath(); c.moveTo((q[0][0] + q[n - 1][0]) / 2, (q[0][1] + q[n - 1][1]) / 2);
  for (let i = 0; i < n; i++) { const a = q[i], b = q[(i + 1) % n]; c.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
  c.closePath();
}
function pin(c, x, y, col, pulse) {
  if (pulse > 0) { c.beginPath(); c.arc(x, y, 6 + pulse * 22, 0, Math.PI * 2); c.strokeStyle = col; c.globalAlpha = 1 - pulse; c.lineWidth = 2.5; c.stroke(); c.globalAlpha = 1; }
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 6;
  c.beginPath(); c.moveTo(x, y); c.arc(x, y - 13, 7, 0.569, 2.572, true); c.closePath(); c.fillStyle = col; c.fill(); c.restore();
  c.lineWidth = 1.5; c.strokeStyle = '#fff'; c.beginPath(); c.moveTo(x, y); c.arc(x, y - 13, 7, 0.569, 2.572, true); c.closePath(); c.stroke();
  c.beginPath(); c.arc(x, y - 13, 2.6, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();
}
function drawRecords(c, w, h) {
  const t = T[lang], wide = w >= 560, ph = recPhase(R.t); R.val = ph.v;
  let map, thx, zoneTop, zoneBot;
  if (wide) { const mw = w - 366; map = { x: 350, y: (h - mw * 0.486) / 2, w: mw, h: mw * 0.486 }; thx = 70; zoneTop = 18; zoneBot = h - 18; }
  else { const mw = w - 28; map = { x: 14, y: 14, w: mw, h: mw * 0.486 }; thx = clamp(w * 0.2, 60, 110); zoneTop = map.y + map.h + 28; zoneBot = h - 16; }
  // the map
  const P = (lo, la) => [map.x + (lo + 180) / 360 * map.w, map.y + (85 - la) / 175 * map.h];
  c.save(); rr(c, map.x, map.y, map.w, map.h, 14); c.clip();
  const og = c.createLinearGradient(0, map.y, 0, map.y + map.h); og.addColorStop(0, '#1b3763'); og.addColorStop(1, '#102446'); c.fillStyle = og; c.fillRect(map.x, map.y, map.w, map.h);
  c.strokeStyle = 'rgba(190,215,255,.08)'; c.lineWidth = 1; c.beginPath();
  for (let la = -60; la <= 60; la += 30) { const [, y] = P(0, la); c.moveTo(map.x, y); c.lineTo(map.x + map.w, y); }
  for (let lo = -120; lo <= 120; lo += 60) { const [x] = P(lo, 0); c.moveTo(x, map.y); c.lineTo(x, map.y + map.h); }
  c.stroke();
  const lg = c.createLinearGradient(0, map.y, 0, map.y + map.h); lg.addColorStop(0, '#58799F'); lg.addColorStop(1, '#3A5A85');
  for (const pts of LAND) { blob(c, pts, P); c.fillStyle = lg; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(200,225,255,.4)'; c.stroke(); }
  blob(c, ICE, P); c.fillStyle = '#DCE9F8'; c.fill();
  c.restore();
  c.lineWidth = 1.5; c.strokeStyle = 'rgba(200,225,255,.35)'; rr(c, map.x, map.y, map.w, map.h, 14); c.stroke();
  const [vx, vy] = P(-116.9, 36.5), [ox, oy] = P(106.8, -78.5);

  // the big thermometer, −90 to 60 °C
  const tw = clamp(h * 0.05, 18, 26), br = tw * 0.85, yHot = zoneTop + tw * 1.4 + 6, yCold = zoneBot - br * 2.3 - 4;
  drawThermo(c, { x: thx, yHot, yCold, tw, br, min: -90, max: 60, val: ph.v, band: true, minor: 5, major: 30, every: 30 });
  const yAt = (v) => yCold - (v + 90) / 150 * (yCold - yHot);
  // the two record cards, tied to their place on the scale
  [[REC_HOT, C.hot, t.sec.valley, ph.hot], [REC_COLD, C.cold, t.sec.vostok, ph.cold]].forEach(([v, col, name, act]) => {
    const y = yAt(v), x = thx + tw / 2 + 62;
    c.save(); c.font = `900 20px ${FONT}`; const num = deg(v, 1), nw = c.measureText(num).width; c.font = `800 12px ${FONT}`;

    c.beginPath(); c.moveTo(thx - tw / 2 - 2, y); c.lineTo(thx + tw / 2 + 2, y); c.strokeStyle = col; c.lineWidth = 2; c.stroke();
    rr(c, x, cy, cwid, chh, 14); c.fillStyle = 'rgba(10,16,34,.85)'; c.fill(); c.lineWidth = 2 + act * 1.5; c.strokeStyle = col; c.stroke();
    c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.font = `900 20px ${FONT}`; c.fillText(num, x + 12, cy + 18);
    c.fillStyle = '#C6CDE0'; c.font = `800 12px ${FONT}`; c.fillText(name, x + 12, cy + 38);
    c.restore();

}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answerCups(i) {
  if (S.guess !== null) return;
  S.guess = i; S.shown = false; sfx.click();
  M.steps = S.qi === 2 ? stepsTo(0, 1.2) : stepsTo(S.qi === 0 ? 1 : 2);
  render(); showStage();
}
function answerTouch(i) {
  if (S.tg !== null) return;
  S.tg = i; S.tt = 0; S.tdone = false; HD.length = 0; sfx.click(); render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a === 'cq') return answerCups(+k);
  if (a === 'cnext') { S.qi++; S.guess = null; S.shown = false; sfx.click(); return render(); }
  if (a === 'cup') return goCup(+k);
  if (a === 'cagain') { S.qi = 0; S.guess = null; S.shown = false; S.hold = true; M.steps = stepsTo(0); sfx.click(); return render(); }
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k;
    if (S.sec === 'records') R.t = 0;
    if (S.sec === 'bottle') { S.bt = 10; B.bl = 10; S.bmode = 0; }
    sfx.click(); return render();
  }
  if (a === 'hands') { S.bt = 16; S.bmode = 1; sfx.push(); return render(); }
  if (a === 'ice') { S.bt = 4; S.bmode = 2; sfx.click(); return render(); }
  if (a === 'scheck') { if (S.pos.some((p) => p === null)) return; S.checked = true; S.ct = 0; S.selAfter = 0; S.sel = null; sfx.good(); render(); return showStage(); }
  if (a === 'sagain') { Object.assign(S, { order: shuffle(), pos: new Array(8).fill(null), sel: null, last: null, checked: false, ct: 0, selAfter: 0 }); sfx.click(); return render(); }
  if (a === 'tq') return answerTouch(+k);
  if (a === 'tagain') { S.tg = null; S.tt = 0; S.tdone = false; HD.length = 0; sfx.click(); return render(); }
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'cups' && !S.sec && S.qi >= 3 && G.cups && y > G.cups.top) {
    let best = 0; G.cups.xs.forEach((cx, i) => { if (Math.abs(cx - x) < Math.abs(G.cups.xs[best] - x)) best = i; });
    goCup(best);
  } else if (lab.view === 'scale') scaleTap(x, y);
});

// --- one render per change: controls, the state card, glow --------------------------------------------------------
function questionBlock(q, opts, ok, picked, shown, res, act, nextAct, hold = false) {
  const t = T[lang], done = picked !== null;
  let html = `<p class="q">${esc(q)}</p><div class="obs">${opts.map((o, i) =>
    `<button class="ob${done && shown && i === ok ? ' good' : ''}${done && shown && i === picked && i !== ok ? ' miss' : ''}" data-act="${act}" data-k="${i}"${done || hold ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
  if (done && shown) {
    html += `<div class="verdict" style="color:${picked === ok ? 'var(--ok)' : 'var(--wip)'}">${esc(picked === ok ? t.right : t.wrong)}</div><p class="explain">${esc(res)}</p>`;
    if (nextAct) html += `<button class="btn" data-act="${nextAct}">${esc(t.next)}</button>`;
  }
  return html;
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v === 'cups' && S.sec ? S.sec : v;
  $('secCups').style.display = v === 'cups' ? '' : 'none';
  $('secScale').style.display = v === 'scale' ? '' : 'none';
  $('secTouch').style.display = v === 'touch' ? '' : 'none';
  for (const id of ['secCups', 'secScale', 'secTouch']) if (id !== { cups: 'secCups', scale: 'secScale', touch: 'secTouch' }[v]) $(id).innerHTML = ''; // one set of buttons at a time
  let st;
  if (v === 'cups') st = renderCups(t); else if (v === 'scale') st = renderScale(t); else st = renderTouch(t);
  // the fine print names body temperature: keep it away from the scale puzzle until it is checked
  const extra = v === 'scale' && !S.checked ? '' : `<div class="fine">${esc(t.fine)}</div>`;
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra });
  readout();
}
function renderCups(t) {
  const free = S.qi >= 3, open = secret.unlocked(), c = t.c;
  const sc = (k, emo, last) => `<button class="chip secret${open ? ' open' : ''}${S.sec === k ? ' on' : ''}${last ? ' last' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  let main = '', mid = '';
  if (S.sec === 'bottle') main = `<div class="chips"><button class="chip" data-act="hands">${esc(t.sec.hands)}</button><button class="chip" data-act="ice">${esc(t.sec.ice)}</button></div>`;
  else if (!S.sec && !free) {
    const q = S.qi;
    main = questionBlock([c.q1, c.q2, c.q3][q], [c.o1, c.o2, c.o3][q], OKC[q], S.guess, S.shown, [c.r1, c.r2, c.r3][q], 'cq', 'cnext', S.hold);
  } else if (!S.sec) {
    mid = CUPS.map((cp, i) => `<button class="chip${M.dest === i ? ' on' : ''}" data-act="cup" data-k="${i}">${esc(c.cups[cp.key])}</button>`).join('') + `<button class="chip" data-act="cagain">↻ ${esc(t.again)}</button>`;
  }
  $('secCups').innerHTML = `${main}<div class="row2"><div class="chips" style="width:100%">${sc('bottle', '🍾')}${mid}${sc('records', '🌍', true)}</div></div>`;
  lab.setGlow(S.sec === 'records' ? 'rgba(255, 120, 90, .22)' : S.sec === 'bottle' ? 'rgba(232, 71, 90, .22)' : 'rgba(91, 168, 255, .28)');
  if (S.sec === 'bottle') return ['🍾', t.secrets.bottle[0], S.bmode ? t.sec.bottleText : t.secrets.bottle[1], ''];
  if (S.sec === 'records') return ['🌍', t.secrets.records[0], t.sec.recordsText, ''];
  return t.st.cups[S.qi > 1 || (S.qi === 1 && S.shown) ? 1 : 0]; // 'Up = hotter' would answer Q2
}
function renderScale(t) {
  const placed = S.pos.filter((p) => p !== null).length;
  $('secScale').innerHTML = S.checked
    ? `<p class="explain">${esc(t.s.r)}</p><button class="chip" data-act="sagain">↻ ${esc(t.again)}</button>`
    : `<p class="hint">${esc(t.s.tap)}</p><button class="btn" data-act="scheck"${placed < 8 ? ' disabled' : ''}>${esc(t.s.check)}</button>`;
  lab.setGlow('rgba(143, 211, 197, .24)');
  return t.st.scale[S.checked ? 1 : 0];
}
function renderTouch(t) {
  $('secTouch').innerHTML = questionBlock(t.t.q, t.t.o, 2, S.tg, S.tdone, t.t.r, 'tq', null) + (S.tdone ? `<div class="row2"><button class="chip" data-act="tagain">↻ ${esc(t.again)}</button></div>` : '');
  lab.setGlow('rgba(201, 149, 91, .24)');
  return t.st.touch[S.tdone ? 1 : 0];
}
render();
