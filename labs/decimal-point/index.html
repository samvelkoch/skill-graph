  }

  c.save(); c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(L.bx + 14, resY - 4); c.lineTo(L.bx + L.bw - 14, resY - 4); c.stroke(); c.restore();
  for (let q = 0; q < 3; q++) {
    const x = L.colX(q) + (L.cw - L.s) / 2;
    tile(c, x, subY + (L.rowH - L.s) / 2, L.s, L.s, String(TK_SUB[q]), C.violet, { alpha: K.done[q] ? 0.4 : 1 });
    const ty = resY + (L.rowH - L.s) / 2;
    if (K.done[q]) tile(c, x, ty, L.s, L.s, String(K.res[q]), C.green); else tile(c, x, ty, L.s, L.s, '?', C.green, { ghost: true });
  }
}

// --- one canvas, three views ---------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, t) => {
  CW = w; CH = h;
  if (lab.view === 'add') frameAdd(c, w, h, dt, t); else if (lab.view === 'places') framePl(c, w, h, dt, t); else frameTk(c, w, h, dt, t);
});

// --- input ---------------------------------------------------------------------------------------------------
const cv = $('cv');
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'add' || S.sec || !LAST || LAST.none) return;
  const K = calc(); if (K.mv < 0) return;
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, yy = LAST.ry0 + K.mv * LAST.rowH;
  if (y < yy - 6 || y > yy + LAST.rowH + 6 || x < LAST.bx || x > LAST.bx + LAST.bw) return;
  S.drag = { x0: x, v0: S.add.vis }; cv.setPointerCapture(ev.pointerId); sfx.tick();
});
cv.addEventListener('pointermove', (ev) => {
  if (!S.drag) return;
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left;
  S.add.vis = clamp(S.drag.v0 + (x - S.drag.x0) / (LAST.cw + LAST.pillW / 2), 0, 1);
  const sh = Math.round(S.add.vis); if (sh !== S.add.sh) { S.add.sh = sh; sfx.tick(); render(); }
});
const endDrag = () => { if (!S.drag) return; S.drag = null; S.add.sh = Math.round(S.add.vis); sfx.snap(); render(); };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function toggleSec(k) {
  const P = S.pl;
  if (S.sec === k) { S.sec = null; if (k === 'thousandths') { P.zoom = 2; P.v = Math.round(P.v / 10) * 10; } sfx.click(); return; }
  S.sec = k;
  if (k === 'jump') { lab.view = 'add'; S.jump.d = EX[S.add.ex].tot; S.jump.dv = S.jump.d; }
  else { lab.view = 'places'; P.phase = 'play'; P.zoom = 3; if (P.v % 10 === 0) P.v += P.v > 1990 ? -3 : 7; }
  lab.renderChrome(); sfx.click();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, P = S.pl;
  if (act === 'edge') { S.add.sh = 1; sfx.snap(); }
  else if (act === 'point') { S.add.sh = 0; sfx.snap(); }
  else if (act === 'next') { setEx((S.add.ex + 1) % EX.length); sfx.click(); }
  else if (act === 'sec') { if (!secret.unlocked()) return secret.open(); toggleSec(b.dataset.k); }
  else if (act === 'z') { if (S.sec === 'thousandths') { P.v = Math.round(P.v / 10) * 10; S.sec = null; } P.zoom = +b.dataset.z; sfx.tick(); }
  else if (act === 'zero') { P.zero = !P.zero; P.zeroAt = now(); sfx.click(); }
  else if (act === 'go') { P.phase = 'play'; sfx.click(); }
  else if (act === 'tk') tkAct();
  else if (act === 'jump') { const d = +b.dataset.d; S.jump.d = d === 0 ? EX[S.add.ex].tot : Math.min(999, S.jump.d + d); sfx.tick(); }
  render();
});
$('plS').addEventListener('input', (ev) => { S.pl.v = clamp(Math.round(+ev.target.value), 0, 2000); render(); });
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-a]'); if (!b) return;
  const i = +b.dataset.a, v = lab.view;
  if (v === 'add') { if (S.add.pick !== null) return; S.add.pick = i; (EX[S.add.ex].opts[i] && v100(EX[S.add.ex].opts[i]) === EX[S.add.ex].tot ? sfx.good : sfx.bad)(); }
  else if (v === 'places') { if (S.pl.pick !== null) return; S.pl.pick = i; S.pl.phase = 'cmp'; (i === 1 ? sfx.good : sfx.bad)(); }
  else { if (S.tk.pick !== null) return; S.tk.pick = i; (i === 1 ? sfx.good : sfx.bad)(); }
  showStage(); render();
});

// --- one render per change: controls, readout, state card and facts ------------------------------------------
function askCard(q, opts, pick, okIdx, verdict) {
  if (pick === null) return `<div class="q">${esc(q)}</div><div class="opts">${opts.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`;
  return `<div class="v ${pick === okIdx ? 'ok' : 'no'}">${esc(verdict)}</div><div class="opts">${opts.map((o, i) => `<button disabled class="${i === okIdx ? 'good' : i === pick ? 'bad' : ''}">${esc(o)}</button>`).join('')}</div>`;
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v;
  $('secAdd').style.display = v === 'add' && sec !== 'jump' ? '' : 'none';
  $('secJump').style.display = v === 'add' && sec === 'jump' ? '' : 'none';
  $('secPl').style.display = v === 'places' && S.pl.phase !== 'ask' ? '' : 'none';
  $('secTk').style.display = v === 'take' && S.tk.pick !== null ? '' : 'none';
  const open = secret.unlocked(), chip = (k, emo) => `<button class="chip dp-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = chip('jump', '🏅') + chip('thousandths', '🔍');
  askEl.style.display = 'none';
  if (v === 'add') (sec === 'jump' ? rJump : rAdd)(t); else if (v === 'places') rPl(t); else rTk(t);
}
function rAdd(t) {
  const A = S.add, K = calc(), e = K.e, ask = A.pick === null, okIdx = e.opts.findIndex((o) => v100(o) === e.tot);
  lab.setGlow('rgba(78,140,240,.28)');
  document.querySelector('[data-act=edge]').textContent = t.a.edge; document.querySelector('[data-act=point]').textContent = t.a.point;
  document.querySelector('[data-act=edge]').classList.toggle('on', A.sh === 1); document.querySelector('[data-act=point]').classList.toggle('on', A.sh === 0);
  $('nextRow').style.display = ask ? 'none' : ''; document.querySelector('[data-act=next]').textContent = t.a.next;
  askEl.style.display = '';
  const tot = fmt(e.tot / 100, 2);
  askEl.innerHTML = askCard(t.a.q(loc(e.a), loc(e.b)), e.opts.map(loc), A.pick, okIdx, A.pick === okIdx ? t.ok : t.a.no(loc(e.opts[A.pick] ?? ''), tot));
  if (ask) {
    lab.setReadout(`${loc(e.a)} + ${loc(e.b)}`, '', '', C.blue);
    lab.setState({ emo: '🤔', title: t.a.q(loc(e.a), loc(e.b)), lead: t.a.hint, body: '', extra: '' });
  } else {
    lab.setReadout(`${tot} ${t.m}`, '', K.aligned ? '✓' : `${fmt(K.sum / 100, 2)} ≠ ${tot}`, K.aligned ? C.green : C.orange);
    if (K.aligned) lab.setState({ emo: '✅', title: A.pick === okIdx ? t.ok : t.a.no(loc(e.opts[A.pick]), tot), lead: t.keyLead, body: '', extra: '' });
    else lab.setState({ emo: '⚠️', title: t.a.mTitle, lead: t.a.mLead(fmt(K.sum / 100, 2), tot), body: '', extra: '' });
  }
  lab.setFacts(t.facts.add);
}
function rJump(t) {
  const d = S.jump.d, gapC = 895 - d;
  lab.setGlow('rgba(224,176,48,.26)');
  $('jumpRow').innerHTML = t.j.steps.map((s, i) => `<button class="chip dp-chip" data-act="jump" data-d="${[1, 10, 100][i]}">${esc(s)}</button>`).join('') + `<button class="chip dp-chip" data-act="jump" data-d="0">${esc(t.j.reset)}</button>`;
  lab.setReadout(`${fmt(d / 100, 2)} ${t.m}`, t.j.your, '', '#e0b030');
  const lead = gapC > 0 ? t.j.lead(gapC, fmt(gapC / 100, 2)) : gapC === 0 ? t.j.equal : t.j.beat;
  lab.setState({ emo: '🏅', title: t.secrets.jump[0], lead, body: '', extra: '' });
  lab.setFacts(t.facts.jump);
}
function rPl(t) {
  const P = S.pl, sec = S.sec === 'thousandths';
  lab.setGlow('rgba(155,123,240,.26)');
  if (P.phase === 'ask' || P.phase === 'cmp') {
    askEl.style.display = '';
    const opts = t.p.opts(fmt(0.25, 2), fmt(0.5, 1)), ask = P.phase === 'ask';
    askEl.innerHTML = askCard(t.p.q(fmt(0.25, 2), fmt(0.5, 1)), opts, P.pick, 1, P.pick === 1 ? t.ok : t.p.no(fmt(0.5, 1)));
    $('plPlay').style.display = 'none'; $('goRow').style.display = ask ? 'none' : ''; document.querySelector('[data-act=go]').textContent = t.p.go;
    $('secPl').style.display = ask ? 'none' : '';
    if (ask) {
      lab.setReadout(`${fmt(0.25, 2)} ${t.m} · ${fmt(0.5, 1)} ${t.m}`, '', '', C.violet);
      lab.setState({ emo: '🤔', title: t.p.q(fmt(0.25, 2), fmt(0.5, 1)), lead: t.p.hint, body: '', extra: '' });
    } else {
      lab.setReadout(`${fmt(0.5, 1)} ${t.m}`, '>', `${fmt(0.25, 2)} ${t.m}`, C.green);
      lab.setState({ emo: '📏', title: P.pick === 1 ? t.ok : t.p.no(fmt(0.5, 1)), lead: t.p.cmp(fmt(0.25, 2), fmt(0.5, 1)), body: '', extra: '' });
    }
    lab.setFacts(t.facts.places); return;
  }
  $('plPlay').style.display = ''; $('goRow').style.display = 'none';
  const sl = $('plS'); sl.step = sec ? '1' : '10'; if (+sl.value !== P.v) sl.value = P.v;
  $('zl').textContent = t.p.zoom;
  $('zChips').innerHTML = [0, 1, 2].map((z) => `<button class="chip dp-chip ${P.zoom === z && !sec ? 'on' : ''}" data-act="z" data-z="${z}">🔍 ${esc(t.p.zz[z])}</button>`).join('');
  const { base, shown, zeroEff } = plShown();
  $('zeroB').hidden = base >= 3; $('zeroB').textContent = P.zero ? t.p.zeroDel : t.p.zeroAdd; $('zeroB').classList.toggle('on', P.zero);
  const n = P.v, o = Math.floor(n / 1000), tt = Math.floor(n / 100) % 10, hh = Math.floor(n / 10) % 10, th = n % 10;
  lab.setReadout(`${fmt(n / 1000, shown)} ${t.m}`, t.p.sub(o, tt, hh, th, sec || shown >= 3), zeroEff ? `${fmt(n / 1000, base)} = ${fmt(n / 1000, shown)}` : '', C.violet);
  if (zeroEff) { const z = t.p.zero(fmt(n / 1000, base), fmt(n / 1000, shown)); lab.setState({ emo: '0️⃣', title: z[0], lead: z[1], body: '', extra: '' }); }
  else { const lv = t.p.lv(sec ? 3 : P.zoom); lab.setState({ emo: sec ? '🔍' : '🔎', title: lv[0], lead: lv[1], body: '', extra: '' }); }
  lab.setFacts(t.facts.places);
}
function rTk(t) {
  const K = S.tk, ask = K.pick === null, nx = tkNext(), fin = !nx && !K.fx, a = fmt(5.03, 2), b = fmt(2.67, 2), r = fmt(2.36, 2);
  lab.setGlow('rgba(52,197,138,.24)');
  askEl.style.display = '';
  askEl.innerHTML = askCard(t.k.q(a, b), TKO.map(loc), K.pick, 1, K.pick === 1 ? t.ok : t.k.no(loc(TKO[K.pick] ?? ''), r));
  if (ask) {
    lab.setReadout(`${a} − ${b}`, '', '', C.green);
    lab.setState({ emo: '🤔', title: t.k.q(a, b), lead: t.k.hint, body: '', extra: '' });
  } else {
    lab.setReadout(`${r} ${t.m}`, '', '', C.green);
    const btn = $('tkB'); btn.disabled = !!K.fx;
    if (fin) {
      btn.textContent = t.k.again;
      lab.setState({ emo: '✅', title: t.k.done(r), lead: t.k.doneLead, body: '', extra: '' });
    } else if (nx.type === 'break') {
      btn.textContent = t.k.brk[nx.j === 0 && nx.c === 2 ? 0 : nx.j];
      lab.setState({ emo: '🧩', title: t.k.brk[nx.j], lead: t.k.need[nx.c] + t.k.needEnd, body: '', extra: '' });
    } else {
      btn.textContent = t.k.take[nx.c](TK_SUB[nx.c]);
      lab.setState({ emo: '✂️', title: t.k.take[nx.c](TK_SUB[nx.c]), lead: t.k.takeT, body: '', extra: '' });
    }
  }
  lab.setFacts(t.facts.take);
}
render();
</script>
