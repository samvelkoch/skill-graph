  else if (b.dataset.a === 'again') { S.oi = 0; S.oPick = null; S.oRight = []; S.oDone = []; sfx.click(); }
  render(); showStage();
});

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secStreet').hidden = v !== 'street';
  askEl.hidden = !(v === 'street' && !S.sec && S.guess === null);
  sortEl.hidden = v !== 'sort'; oldEl.hidden = v !== 'old';
  if (v === 'street') renderStreet(t); else if (v === 'sort') renderSort(t); else renderOld(t);
  lab.checkStage();
}
const fact = (emo, text, src) => ({ emo, text, src });
function renderStreet(t) {
  const s = t.s1, open = secret.unlocked(), col = '#e0a050';
  lab.setGlow('rgba(230, 150, 80, .26)');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('top', '📊') + sc('find', '🔎');
  $('againB').textContent = s.again; $('againB').hidden = S.guess === null && !S.sec;
  $('topRow').hidden = S.sec !== 'top'; $('findRow').hidden = S.sec !== 'find';
  $('topChips').innerHTML = ['en', 'ru', 'hu', 'de'].map((c) => `<button class="chip ${S.topC === c ? 'on' : ''}" data-act="country" data-c="${c}">${esc(t.top.lbl[c])}</button>`).join('');
  const groups = { en: [], ru: [], hu: [], de: [] };
  for (const n of Object.keys(NM)) if (!(NM[n].shop === 'tailor' && S.guess === null)) groups[NM[n].l].push(n); // the tailor's names wait for the guess
  $('findSel').innerHTML = `<option value="">${esc(t.find.optPick)}</option>` + ['en', 'ru', 'hu', 'de'].map((l) => `<optgroup label="${esc(t.find.grp[l])}">${groups[l].map((n) => `<option value="${esc(n)}"${S.findN === n ? ' selected' : ''}>${esc(n)}</option>`).join('')}</optgroup>`).join('');
  askEl.innerHTML = `<div class="q">${esc(s.ask)}</div>`;
  if (S.sec === 'top') {
    const rows = TOP[S.topC], r0 = rows[0], d = NM[r0.n];
    lab.setReadout(esc(r0.n), t.top.lbl[S.topC], '', '#e0b050');
    lab.setState({ emo: KIND[d.kind].emo, title: `${t.top.lbl[S.topC]}: ${r0.n}`, lead: meanOf(r0.n, t), body: rows.slice(1).map((r) => `${r.n}: ${meanOf(r.n, t)}`).join(' '), extra: `<div class="fine">${esc(t.fine)}</div>` });
    lab.setFacts([fact('📊', { en: 'The page gives percentages for England, Russia and Germany, and numbers of people for Hungary (January 2026).', ru: 'Страница даёт проценты для Англии, России и Германии и число людей для Венгрии (январь 2026).', hu: 'Az oldal Angliára, Oroszországra és Németországra százalékot, Magyarországra pedig az emberek számát adja (2026 januárja).' }[lang], 'en.wikipedia.org/wiki/List_of_most_common_surnames_in_Europe')]);
    return;
  }
  if (S.sec === 'find') {
    const n = S.findN, d = n && NM[n];
    lab.setReadout(n ? esc(n) : '?', n ? cap(t.kindNames[d.kind]) : t.find.pick, '', '#e0b050');
    lab.setState({ emo: d ? KIND[d.kind].emo : '🔎', title: d ? n : t.find.pick, lead: d ? meanOf(n, t) : '', body: d ? '' : t.find.t, extra: `<div class="fine">${esc(t.fine)}</div>` });
    lab.setFacts([]);
    return;
  }
  const seen = S.seen.size;
  if (S.guess === null) {
    lab.setReadout('?', s.subP, '', col);
    lab.setState({ emo: '🏘️', title: s.pTitle, lead: s.pLead, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  lab.setReadout(s.val(seen), s.sub, '', col);
  const sh = SHOP[S.picked], keys = [lang, ...['en', 'ru', 'hu', 'de'].filter((l) => l !== lang)].filter((l) => sh.names[l]);
  const names = keys.map((l) => sh.names[l]).join(' · ');
  let st;
  if (seen >= 7 && S.picked !== 'tailor') st = { emo: '🏆', title: s.allT, lead: s.allL, body: s.allB };
  else if (S.picked === 'tailor' && seen === 1) st = { emo: S.guess === 'tailor' ? '✅' : '🤔', title: S.guess === 'tailor' ? s.right : s.wrong, lead: s.reveal, body: s.more };
  else st = { emo: sh.emo, title: cap(tr(sh.trade)), lead: names, body: seen >= 7 ? s.allB : `${cap(tr(sh.what))}.` };
  lab.setState({ ...st, extra: `<div class="fine">${esc(t.fine)}</div>` });
  lab.setFacts([
    fact('🔨', { en: 'Smith is the most common surname in the UK. In Hungary Kovács, “smith”, is the second most common.', ru: 'Smith — самая частая фамилия в Великобритании. В Венгрии Kovács, «кузнец», на втором месте.', hu: 'Az Egyesült Királyságban a Smith a leggyakoribb családnév. Magyarországon a Kovács, vagyis „kovács”, a második leggyakoribb.' }[lang], 'en.wikipedia.org/wiki/Smith_(surname) · en.wikipedia.org/wiki/List_of_most_common_surnames_in_Europe'),
    fact('✂️', { en: 'The surname Taylor is first recorded in 1182 in Somerset, England.', ru: 'Фамилия Taylor впервые записана в 1182 году в Сомерсете, Англия.', hu: 'A Taylor családnevet először 1182-ben jegyezték fel az angliai Somersetben.' }[lang], 'en.wikipedia.org/wiki/Taylor_(surname)'),
  ]);
}
function renderSort(t) {
  const s = t.s2, n = DECK.length, end = S.si >= n, k = S.sRight.filter(Boolean).length;
  lab.setGlow('rgba(106, 168, 255, .24)');
  lab.setFacts([
    fact('📜', { en: 'In western Europe, people did not take hereditary surnames until the 11th century.', ru: 'В Западной Европе наследственные фамилии появились только в XI веке.', hu: 'Nyugat-Európában az öröklődő családnevek csak a 11. századtól terjedtek el.' }[lang], 'en.wikipedia.org/wiki/Surname'),
    fact('🏰', { en: 'In England, most families had a hereditary surname by 1400.', ru: 'В Англии у большинства семей к 1400 году уже была наследственная фамилия.', hu: 'Angliában 1400-ra a legtöbb családnak már öröklődő családneve volt.' }[lang], 'en.wikipedia.org/wiki/Surname'),
  ]);
  if (end) {
    lab.setReadout(`${k} / ${n}`, '', s.pill(k), '#6aa8ff');
    sortEl.innerHTML = `<div class="plq"><div class="emo">🏷️</div><div class="big">${esc(s.endT(k, n))}</div><p>${esc(s.endL)}</p><p>${esc(s.endB)}</p><button class="go" data-a="again">${esc(s.again)}</button></div>`;
    lab.setState({ emo: '🏆', title: s.endT(k, n), lead: s.endL, body: s.endB, extra: '' });
    return;
  }
  const name = DECK[S.si], d = NM[name], pick = S.sPick, ok = pick && pick === d.kind;
  lab.setReadout(`${S.si + 1} / ${n}`, s.sub(S.si + 1, n), k ? s.pill(k) : '', '#6aa8ff');
  const tiles = KINDS.map((kd) => {
    const cls = pick ? (kd === d.kind ? 'good' : kd === pick ? 'bad' : 'dim') : '';
    return `<button class="tile ${cls}" data-kind="${kd}"${pick ? ' disabled' : ''}><span class="e">${KIND[kd].emo}</span>${esc(s.kinds[kd])}</button>`;
  }).join('');
  const mean = meanOf(name, t);
  sortEl.innerHTML = `<div class="plq"><div class="big">${esc(name)}</div>${pick
    ? `<div class="vd ${ok ? 'ok' : 'no'}">${esc(ok ? s.right : s.wrong)}</div><p>${esc(mean)}</p><button class="go" data-a="next">${esc(S.si + 1 >= n ? '✓' : s.next)}</button>`
    : `<div class="ask2">${esc(s.q)}</div>`}</div><div class="tiles">${tiles}</div>`;
  lab.setState(pick ? { emo: ok ? '✅' : '🤔', title: ok ? s.right : s.wrong, lead: mean, body: '', extra: '' } : { emo: '🏷️', title: s.q, lead: s.pick, body: '', extra: '' });
}
function renderOld(t) {
  const s = t.s3, n = OLD.length, end = S.oi >= n, k = S.oRight.filter(Boolean).length;
  lab.setGlow('rgba(224, 176, 80, .26)');
  const facts = OLD.filter((it) => S.oDone.includes(it.k) && OLDFACT[it.k]).map((it) => fact(OLDFACT[it.k].emo, OLDFACT[it.k].text[lang], OLDFACT[it.k].src));
  lab.setFacts(facts);
  if (end) {
    lab.setReadout(`${k} / ${n}`, '', s.pill(k), '#e0b050');
    oldEl.innerHTML = `<div class="plq"><div class="emo">⏳</div><div class="big">${esc(s.endT(k, n))}</div><p>${esc(s.endL)}</p><button class="go" data-a="again">${esc(s.again)}</button></div>`;
    lab.setState({ emo: '🏆', title: s.endT(k, n), lead: s.endL, body: '', extra: '' });
    return;
  }
  const it = OLD[S.oi], pick = S.oPick, ok = pick && (pick === 'med') === it.med;
  lab.setReadout(`${S.oi + 1} / ${n}`, s.sub(S.oi + 1, n), k ? s.pill(k) : '', '#e0b050');
  const btn = (m, emo, label) => `<button class="tile ${pick ? ((m === 'med') === it.med ? 'good' : m === pick ? 'bad' : 'dim') : ''}" data-m="${m}"${pick ? ' disabled' : ''}><span class="e">${emo}</span>${esc(label)}</button>`;
  oldEl.innerHTML = `<div class="plq"><div class="emo">${it.emo}</div><div class="big">${esc(tr(it.name))}</div>${pick
    ? `<div class="vd ${ok ? 'ok' : 'no'}">${esc(ok ? s.right : s.wrong)} ${esc(it.med ? s.isMed : s.isMod)}</div><p>${esc(tr(it.when))}</p><button class="go" data-a="next">${esc(S.oi + 1 >= n ? '✓' : s.next)}</button>`
    : `<div class="ask2">${esc(s.q)}</div>`}</div><div class="pair">${btn('med', '🏰', s.med)}${btn('mod', '🚀', s.mod)}</div>`;
  lab.setState(pick ? { emo: ok ? '✅' : '🤔', title: `${ok ? s.right : s.wrong} ${it.med ? s.isMed : s.isMod}`, lead: tr(it.when), body: '', extra: '' } : { emo: it.emo, title: s.q, lead: tr(it.name), body: s.note, extra: '' });
}
render();
</script>
