// --- constants and small helpers ---------------------------------------------------------------------------
const TAU = Math.PI * 2;
const INK = '#2b2a3d', PAPER1 = '#f8f3e5', PAPER2 = '#efe6d0';
const ORANGE = '#e8742a', BLUE = '#2f6fdb', RED = '#e5383b', GREEN = '#2fa56a', PURPLE = '#7a4fd6';
const EMIN = 0.2, EMAX = 30, LNMIN = Math.log(0.12), LNMAX = Math.log(38);
const PRESET = { lie: 0.2, stand: 1.6, ladder: 4, tower: 30 };
const TH_MIN = 0.64, TH_MAX = 0.93; // how far the house may turn (radians) while the vanishing points stay on the paper
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const backOut = (x) => { x = clamp01(x); const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const eToS = (E) => Math.log(E / EMIN) / Math.log(EMAX / EMIN);
const sToE = (s) => EMIN * Math.pow(EMAX / EMIN, s);
const hzFrac = (E) => clamp(0.28 + 0.5 * eToS(E), 0.1, 0.92); // where the horizon sits on the paper (from the bottom), by eye height
const hexRGB = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const shade = (hex, k, a = 1) => { const [r, g, b] = hexRGB(hex); return `rgba(${Math.min(255, r * k) | 0},${Math.min(255, g * k) | 0},${Math.min(255, b * k) | 0},${a})`; };
const fmtN = (E) => String(E < 10 ? Math.round(E * 10) / 10 : Math.round(E)).replace('.', lang === 'en' ? '.' : ',');
const hzPct = (E) => Math.round(hzFrac(E) * 100);

// one-point and two-point perspective: camera c = { cx, hy, f, E }: the vanishing point of "straight ahead" is (cx, hy)
const PJ = (c, x, y, z) => { const zz = Math.max(0.05, z); return [c.cx + c.f * x / zz, c.hy + c.f * (c.E - y) / zz]; };

function drawHall(ctx, g) {

  let gr = ctx.createLinearGradient(0, iy0, 0, iy1); gr.addColorStop(0, '#6e5a44'); gr.addColorStop(1, '#2d2218'); ctx.fillStyle = gr; ctx.fillRect(ix0, iy0, iw, ih);

  const o0 = q(-1.7, 0, Zb), o1 = q(1.7, 0, Zb); ctx.moveTo(o0[0], o0[1]); arc.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(o1[0], o1[1]); ctx.closePath();
  gr = ctx.createLinearGradient(0, arc[8][1], 0, o0[1]); gr.addColorStop(0, '#a9d0e6'); gr.addColorStop(.7, '#f1e8c8'); gr.addColorStop(1, '#8db07a'); ctx.fillStyle = gr; ctx.fill(); ctx.strokeStyle = 'rgba(40,28,14,.8)'; ctx.lineWidth = 1.5; ctx.stroke();
  // side walls

    pathPts(ctx, [q(x0, 0, z0), q(x1, 0, z0), q(x1, 0, z1), q(x0, 0, z1)]); ctx.fillStyle = (i + j) % 2 ? '#e6d3a6' : '#8c6a45'; ctx.fill();
  }

  for (let j = 0; j <= 30; j++) { const a = q(-4.8, 0, 2 + j * .8), b = q(4.8, 0, 2 + j * .8); seg(ctx, a[0], a[1], b[0], b[1]); }

    const u = f / z, [bx, by] = q(x, 0, z), [, ty] = q(x, 5.4, z), [, cy] = q(x, 5.9, z);
    const cg = ctx.createLinearGradient(bx - u * .35, 0, bx + u * .35, 0); cg.addColorStop(0, '#f6edd6'); cg.addColorStop(.6, '#d8cbac'); cg.addColorStop(1, '#9d9074');
    ctx.fillStyle = cg; ctx.fillRect(bx - u * .35, ty, u * .7, by - ty); ctx.fillRect(bx - u * .5, cy, u, ty - cy); ctx.fillRect(bx - u * .48, by - u * .35, u * .96, u * .35);

function drawFind(ctx, L, dt, t) {

  ctx.save(); rr(ctx, L.x0, L.y0, L.pw, L.ph, 8);

  const fg = ctx.createLinearGradient(L.x0, L.y0, L.x1, L.y1); fg.addColorStop(0, '#8a5d33'); fg.addColorStop(1, '#4a2f18'); ctx.fillStyle = fg; ctx.fill(); ctx.restore();

    ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 5; seg(ctx, ax - dx * 260, ay - dy * 260, ax + dx * 420, ay + dy * 420);
    ctx.strokeStyle = col; ctx.lineWidth = 2.6; seg(ctx, ax - dx * 260, ay - dy * 260, ax + dx * 420, ay + dy * 420);
    dot(ctx, ax, ay, 4.5, '#2b2118', '#fff');

    dot(ctx, c.cx, c.hy, 6, RED);
    ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = '#3ddc97'; ctx.lineWidth = 2; const [fx, fy] = PJ(c, 0, 1.0, 7.5); ctx.beginPath(); ctx.arc(fx, fy, Math.max(0, c.f * .95 / 7.5), 0, TAU); ctx.stroke(); ctx.restore();

// --- pointer input ---------------------------------------------------------------------------------------------
const cv = $('cv');
const ptr = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
function groundAt(c, x, y) { if (y <= c.hy + 6) return null; const Z = c.f * c.E / (y - c.hy); return { X: (x - c.cx) * Z / c.f, Z }; }
function tapMeet(px, py) {
  const L = CUR; if (!L || px < L.x0 || px > L.x1 || py < L.y0 || py > L.y1) return;
  const g = meetGeo(L);
  if (M.ph === 0) {
    M.gax = px; M.gay = py; M.dA = dist(px, py, g.c.cx, g.c.hy); M.vA = verdictOf(M.dA, 20); M.ph = 1;
    (M.vA === 'off' ? sfx.bad : sfx.good)(); render();
  } else if (M.ph === 3) {
    const [tx, ty] = PJ(g.c, g.px, g.PH, 5 * g.z1);
    M.gbx = px; M.gby = py; M.dB = dist(px, py, tx, ty); M.vB = verdictOf(M.dB, 14); M.ph = 4; M.pr = 0;
    (M.vB === 'off' ? sfx.bad : sfx.good)(); render();
  }
}
cv.addEventListener('pointerdown', (ev) => {
  const L = CUR; if (!L) return;
  const [x, y] = ptr(ev);
  if (S.sec === 'find') {
    const g = hallGeo(L);
    for (let i = 0; i < 2; i++) {
      const [ax, ay] = g.anchors[i], l = FD.lines[i];
      if (dist(x, y, ax + Math.cos(l.ang) * 96, ay + Math.sin(l.ang) * 96) < 24) { DR = { kind: 'line', i, id: ev.pointerId }; cv.setPointerCapture(ev.pointerId); sfx.tick(); return; }
    }
  } else if (!S.sec && lab.view === 'boxes') {
    const c = boxGeo(L).c;
    if (BX.ans !== null && BX.mode === 'two') {
      const [x1, x2] = vpXs(c, BX.th);
      if (Math.abs(y - c.hy) < 20) {
        if (Math.abs(x - x1) < 22) { DR = { kind: 'vp', i: 0, id: ev.pointerId }; cv.setPointerCapture(ev.pointerId); return; }
        if (x2 !== null && Math.abs(x - x2) < 22) { DR = { kind: 'vp', i: 1, id: ev.pointerId }; cv.setPointerCapture(ev.pointerId); return; }
      }
    }
    const gp = groundAt(c, x, y);
    if (gp) { DR = { kind: 'box', dx: BX.X - gp.X, dz: BX.Z - gp.Z, id: ev.pointerId }; cv.setPointerCapture(ev.pointerId); }
  } else if (!S.sec && lab.view === 'meet') { DR = { kind: 'tap', x, y, id: ev.pointerId }; }
});
cv.addEventListener('pointermove', (ev) => {
  if (!DR || !CUR) return;

    const g = hallGeo(L), [ax, ay] = g.anchors[DR.i], l = FD.lines[DR.i];
    l.ang = Math.atan2(y - ay, x - ax);
    const err = Math.abs(((l.ang - g.ang[DR.i] + Math.PI / 2) % Math.PI + Math.PI) % Math.PI - Math.PI / 2);
    const was = FD.found;
    if (err < .045) { const a1 = g.ang[DR.i], a2 = a1 + Math.PI, dd = (u, v) => Math.abs(Math.atan2(Math.sin(u - v), Math.cos(u - v))); l.ang = dd(l.ang, a1) < dd(l.ang, a2) ? a1 : a2; if (!l.ok) sfx.snap(); l.ok = true; } else l.ok = false;

const endDrag = (ev) => {

};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { DR = null; });

// --- controls ----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const setEye = (E) => { EY.tgt = Math.log(clamp(E, EMIN, EMAX)); $('eSl').value = String(Math.round(eToS(clamp(E, EMIN, EMAX)) * 1000)); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'mbtn') {
    if (M.ph === 2) { M.ph = 3; sfx.click(); showStage(); } else if (M.ph === 5) { newRoad(); sfx.click(); }
  } else if (act === 'eans') {

  } else if (act === 'epre') { setEye(PRESET[b.dataset.k]); sfx.click(); }
  else if (act === 'bans') {
    BX.ans = +b.dataset.i; BX.ok = BX.ans === 1; BX.mode = 'two'; BX.tgt = BX.thU; (BX.ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'bmode') { BX.mode = b.dataset.m; BX.tgt = BX.mode === 'two' ? BX.thU : 0; sfx.click(); }
  else if (act === 'sec') {

    if (S.sec === 'find') { FD.init = false; FD.found = false; }

  } else if (act === 'mir') { MIR.on = b.dataset.m === '1'; sfx.click(); }

$('eSl').addEventListener('input', (ev) => { EY.tgt = Math.log(sToE(+ev.target.value / 1000)); render(); });

// --- one render per change: panels, state card, facts and the readouts that do not animate ------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  $('secMeet').style.display = !sec && v === 'meet' ? '' : 'none';
  $('secEye').style.display = !sec && v === 'eye' ? '' : 'none';
  $('secBox').style.display = !sec && v === 'boxes' ? '' : 'none';
  $('secMir').style.display = sec === 'mirror' ? '' : 'none';
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('mirror', '🪞') + sc('find', '🔎');
  lab.setFacts(t.facts[v === 'boxes' ? 'boxes' : v]);
  const fine = `<div class="vp-fine">${esc(t.fine)}</div>`;
  if (sec === 'mirror') {
    lab.setGlow('rgba(217, 178, 90, .24)');
    $('mirChips').innerHTML = [[1, t.mir.on], [0, t.mir.off]].map(([m, l]) => `<button class="chip ${!!m === MIR.on ? 'on' : ''}" data-act="mir" data-m="${m}">${esc(l)}</button>`).join('');
    lab.setReadout('🪞', t.secrets.mirror[1], '', '#d9b25a');
    lab.setState({ emo: '🪞', title: t.secrets.mirror[0], lead: t.secretA, body: '', extra: fine });
    return;
  }
  if (sec === 'find') {
    lab.setGlow('rgba(217, 178, 90, .24)');
    lab.setReadout('🔎', t.secrets.find[1], '', '#d9b25a');
    lab.setState({ emo: '🔎', title: t.secrets.find[0], lead: FD.found ? t.secretB : t.dragLines, body: '', extra: fine });
    return;
  }
  if (v === 'meet') renderMeet(t, fine); else if (v === 'eye') renderEye(t, fine); else renderBoxes(t, fine);
}
function renderMeet(t, fine) {
  lab.setGlow('rgba(232, 116, 42, .24)');

  const vt = { right: t.right, close: t.close, off: t.notQuite };
  const fb = $('mFb');
  if (ph === 2 || ph === 5) {

    fb.textContent = `${vt[vv]} ${t.off(Math.round(d))}`; fb.className = `vp-fb ${vv === 'off' ? 'wip' : 'ok'}`;
  } else { fb.textContent = ''; fb.className = 'vp-fb'; }
  const btn = $('mBtn');

  const d = ph >= 4 ? M.dB : M.dA;

  else lab.setReadout(t.off(Math.round(d)), t.yourGuess, ph >= 4 ? t.pole5 : t.vp, '#e8742a');
  if (ph === 0) lab.setState({ emo: '🛤️', title: t.state.meet0[0], lead: t.state.meet0[1], body: '', extra: fine });
  else if (ph < 5) lab.setState({ emo: '📍', title: t.state.meetDone[0], lead: t.exMeet, body: '', extra: fine });
  else lab.setState({ emo: '📍', title: t.state.meetDone[0], lead: t.exPole, body: t.state.meetDone[1], extra: fine });
}
function renderEye(t, fine) {
  lab.setGlow('rgba(78, 168, 255, .26)');
  const asked = EY.ans !== null;
  $('eAsk').style.display = asked ? 'none' : ''; $('eCtl').style.display = asked ? '' : 'none';
  $('eQ').textContent = t.eyeQ;
  $('eOpts').innerHTML = t.eyeOpts.map((o, i) => `<button class="vp-opt" data-act="eans" data-i="${i}">${esc(o)}</button>`).join('');
  $('eLbl').textContent = t.eyeLabel;
  $('eChips').innerHTML = Object.keys(PRESET).map((k) => `<button class="chip ${Math.abs(EY.tgt - Math.log(PRESET[k])) < .06 ? 'on' : ''}" data-act="epre" data-k="${k}">${esc(t.eyes[k])}</button>`).join('');
  const fb = $('eFb'); fb.textContent = asked ? (EY.ok ? t.right : t.notQuite) : ''; fb.className = `vp-fb ${asked ? (EY.ok ? 'ok' : 'wip') : ''}`;
  EY.last = ''; syncEye(Math.exp(EY.lg));
  if (asked) lab.setState({ emo: '👁️', title: t.state.eyeDone[0], lead: t.state.eyeDone[1], body: t.exEye, extra: fine });

function renderBoxes(t, fine) {
  lab.setGlow('rgba(167, 139, 250, .26)');
  const asked = BX.ans !== null;
  $('bAsk').style.display = asked ? 'none' : ''; $('bCtl').style.display = asked ? '' : 'none';
  $('bQ').textContent = t.boxQ;
  $('bOpts').innerHTML = [1, 2, 3].map((n, i) => `<button class="vp-opt num" data-act="bans" data-i="${i}">${n}</button>`).join('');
  $('bModes').innerHTML = ['one', 'two'].map((m) => `<button class="chip ${BX.mode === m ? 'on' : ''}" data-act="bmode" data-m="${m}">${esc(t.modes[m])}</button>`).join('');
  $('bTip').textContent = BX.mode === 'two' ? t.dragVP : '';
  const fb = $('bFb'); fb.textContent = asked ? (BX.ok ? t.right : t.notQuite) : ''; fb.className = `vp-fb ${asked ? (BX.ok ? 'ok' : 'wip') : ''}`;
  BX.last = ''; syncBox();
  if (asked) lab.setState({ emo: '📦', title: t.state.boxesDone[0], lead: t.state.boxesDone[1], body: t.exBox, extra: fine });
  else lab.setState({ emo: '🏠', title: t.state.boxes0[0], lead: t.state.boxes0[1], body: '', extra: fine });
}

render();
canvasLoop(cv, (ctx, w, h, dt, t) => {
  try {
    const L = lay(w, h); CUR = L;
    const v = lab.view;
    if (S.sec === 'mirror') drawMirror(ctx, L, dt);
    else if (S.sec === 'find') drawFind(ctx, L, dt, t);
    else if (v === 'meet') drawMeet(ctx, L, dt, t);
    else if (v === 'eye') drawEyeView(ctx, L, dt, t);
    else drawBoxesView(ctx, L, dt, t);
  } catch (e) { console.error(e); }
});
