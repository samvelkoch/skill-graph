    if (k > 0) for (let j = 0; j < 7; j++) { const a = c01(k / 1.4 - j * 0.1) * (0.7 + 0.3 * Math.sin(t * 4 + j)); c.fillStyle = `rgba(255,214,130,${a})`; c.beginPath(); c.arc(x + (rnd(j) - 0.5) * 14 * u, y - (6 + rnd(j, 2) * 20) * u, 1.8 * u, 0, TAU); c.fill(); }
  }
  if (k > 0) for (let j = 0; j < 4; j++) { // lanterns
    const [x, y] = quad(p0, p1, p2, 0.3 + j * 0.2), a = c01(k / 1.3 - j * 0.15) * (0.82 + 0.18 * Math.sin(t * 5 + j * 2 + side));
    const gl = c.createRadialGradient(x, y - 6 * u, 1, x, y - 6 * u, 30 * u); gl.addColorStop(0, `rgba(255,205,120,${0.55 * a})`); gl.addColorStop(1, 'rgba(255,205,120,0)');
    c.fillStyle = gl; c.fillRect(x - 32 * u, y - 38 * u, 64 * u, 64 * u);
    c.fillStyle = `rgba(255,226,150,${a})`; c.beginPath(); c.roundRect(x - 2.4 * u, y - 10 * u, 4.8 * u, 7 * u, 1.6 * u); c.fill();
  }
  c.restore();
}
function drawTruce(c, w, h, t) {
  const u = Math.min(w, h) / 380, hz = h * 0.46, gy = hz + (h - hz) * 0.5, k = S.cdT === null ? -1 : t - S.cdT;
  let g = c.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, '#080d24'); g.addColorStop(1, '#2d3d6e'); c.fillStyle = g; c.fillRect(0, 0, w, hz + 2);
  for (let i = 0; i < 46; i++) { c.fillStyle = `rgba(255,255,255,${0.35 + 0.45 * Math.sin(t * 1.3 + i)})`; c.beginPath(); c.arc(rnd(i) * w, rnd(i, 2) * hz * 0.85, 0.6 + rnd(i, 3) * 1.1, 0, TAU); c.fill(); }
  c.fillStyle = '#f4efd6'; c.beginPath(); c.arc(w * 0.8, h * 0.15, 15 * u, 0, TAU); c.fill();
  c.fillStyle = '#141c43'; c.beginPath(); c.arc(w * 0.8 + 6 * u, h * 0.15 - 3 * u, 13 * u, 0, TAU); c.fill();
  c.fillStyle = '#18234a'; c.beginPath(); c.moveTo(0, hz); c.quadraticCurveTo(w * 0.2, hz - 26 * u, w * 0.42, hz - 4 * u); c.quadraticCurveTo(w * 0.7, hz - 30 * u, w, hz - 6 * u); c.lineTo(w, hz + 4); c.lineTo(0, hz + 4); c.closePath(); c.fill();
  g = c.createLinearGradient(0, hz, 0, h); g.addColorStop(0, '#b4c2dd'); g.addColorStop(1, '#5d6f98'); c.fillStyle = g; c.fillRect(0, hz, w, h - hz);
  c.fillStyle = 'rgba(40,52,90,.22)';
  for (let i = 0; i < 4; i++) { c.beginPath(); c.ellipse(w * (0.36 + i * 0.09), gy + (14 + (i % 2) * 12) * u, 15 * u, 4 * u, 0, 0, TAU); c.fill(); }
  // barbed wire
  c.strokeStyle = '#242c40'; c.lineWidth = 1.4; c.lineCap = 'round';
  for (const side of [-1, 1]) {
    const bx = side < 0 ? w * 0.335 : w * 0.665;
    for (let j = 0; j < 3; j++) { const px = bx + side * j * 13 * u; c.beginPath(); c.moveTo(px, gy + 2 * u); c.lineTo(px, gy - 17 * u); c.stroke(); }
    c.beginPath(); for (let j = 0; j <= 16; j++) { const px = bx + side * (j * 2.5 * u), py = gy - (6 + (j % 2 ? 5 : -2)) * u; j ? c.lineTo(px, py) : c.moveTo(px, py); } c.stroke();
  }
  drawMound(c, w, h, gy, u, 1, k, t); drawMound(c, w, h, gy, u, -1, k, t);
  if (k > 0) { // warm light on the snow
    const a = c01(k / 2), gl = c.createRadialGradient(w / 2, gy, 4, w / 2, gy, 140 * u); gl.addColorStop(0, `rgba(255,200,120,${0.3 * a})`); gl.addColorStop(1, 'rgba(255,200,120,0)'); c.fillStyle = gl; c.fillRect(0, hz, w, h - hz);
  }
  if (k > 0.8) {
    const cx = w / 2, walk = easeInOut((k - 1.0) / 3.2), arm = easeOut((k - 4.3) / 0.5) * (1 - easeOut((k - 5.1) / 0.6)), apart = easeOut((k - 5.0) / 0.8);
    const gap = (20 + 12 * apart) * u, fy = gy + 6 * u, a = c01((k - 0.8) / 0.6), ph = k > 1.0 && k < 4.3 ? k * 8 : 0;
    drawFigure(c, lerp(w * 0.27, cx - gap, walk), fy, u, 1, ph, arm, true, a);
    drawFigure(c, lerp(w * 0.73, cx + gap, walk), fy, u, -1, ph + 1.5, arm, false, a);
    if (k > 4.5 && k < 5.4) { c.save(); c.globalAlpha = 1 - (k - 4.5) / 0.9; c.fillStyle = '#ffe9a8'; for (let j = 0; j < 6; j++) { const an = j * 1.05 + k * 3, r = (k - 4.5) * 22 * u; c.beginPath(); c.arc(cx + Math.cos(an) * r, fy - 38 * u + Math.sin(an) * r, 1.8 * u, 0, TAU); c.fill(); } c.restore(); }
    if (k > 5.2) { // a football rolls between them
      const m = k - 5.2, bx = cx + Math.sin(m * 1.7) * 14 * u, br = 4.6 * u, by = fy - br - Math.abs(Math.sin(m * 3.4)) * 4 * u;
      c.save(); c.translate(bx, by); c.rotate(bx / br);
      c.fillStyle = 'rgba(10,15,40,.3)'; c.beginPath(); c.ellipse(0, br + 1, br, br * 0.3, 0, 0, TAU); c.fill();
      c.fillStyle = '#f4f1e8'; c.beginPath(); c.arc(0, 0, br, 0, TAU); c.fill(); c.strokeStyle = '#2a2417'; c.lineWidth = 1; c.stroke();
      c.fillStyle = '#2a2417'; for (let j = 0; j < 3; j++) { const an = j * 2.1; c.beginPath(); c.arc(Math.cos(an) * br * 0.55, Math.sin(an) * br * 0.55, br * 0.27, 0, TAU); c.fill(); }
      c.restore();
    }
  }
  for (let i = 0; i < 70; i++) { // snow
    const sp = 14 + rnd(i, 4) * 22, x = (rnd(i) * w + Math.sin(t * 0.6 + i) * 10 * u) % w, y = (rnd(i, 2) * h + t * sp) % (h + 10);
    c.fillStyle = `rgba(255,255,255,${0.5 + 0.4 * rnd(i, 5)})`; c.beginPath(); c.arc(x, y, (0.8 + rnd(i, 3) * 1.4) * Math.max(0.8, u), 0, TAU); c.fill();
  }
  const vg = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75); vg.addColorStop(0, 'rgba(0,0,12,0)'); vg.addColorStop(1, 'rgba(0,0,12,.4)'); c.fillStyle = vg; c.fillRect(0, 0, w, h);
}

// --- the loop -------------------------------------------------------------------------------------------------
function layout(w, h) {
  const strip = S.sec ? 0 : STRIP[lab.view], mh = Math.max(100, Math.min(w, h - strip));
  return { strip, mh, my: Math.max(0, (h - strip - mh) / 2) };
}
let lastRead = '';
function readoutNow(t) {
  const tt = T[lang], v = lab.view;
  if (S.sec === 'crowns') return [String(crYear(t)), '', '', '#d9b44a'];
  if (S.sec === 'truce') return ['🎄', tt.secrets.truce[1], '1914', '#7aa2d8'];
  if (v === 'web') {
    const n = Object.keys(S.drawn).length;
    return [tt.threads(n), tt.threadsWord, S.last ? (S.last === 'rs' ? '🤝' : tt.treaties[S.last]) : '', '#c08a3e'];
  }
  if (v === 'crisis') {
    const w = S.cw; if (!w.date) return ['—', '', '', '#3f7f8c'];
    return [fmtShort(...w.date), tt.since(dayIdx(...w.date)), tt.atWar(w.war.size), '#3f7f8c'];
  }
  if (S.planT === null) return ['?', '', '', '#d9825f'];
  const wk = S.sepT !== null ? 7 : 1 + Math.min(5, Math.floor(planU(t) * 6));
  return [tt.week(wk), tt.ofWar, tt.fronts.west, '#d9825f'];
}
function syncReadout(t) {
  const r = readoutNow(t), key = r.join('|');
  if (key !== lastRead) { lastRead = key; lab.setReadout(r[0], r[1], r[2], r[3]); }
}
canvasLoop($('cv'), (c, w, h, dt, t) => {
  CW = w; CH = h;
  const v = lab.view;
  if (S.sec === 'truce') { drawTruce(c, w, h, t); syncReadout(t); return; }
  const L = layout(w, h), tz = v === 'plan' && !S.sec ? CAMP : CAMF, a = 1 - Math.exp(-dt * 4);
  cam.x += (tz.x - cam.x) * a; cam.y += (tz.y - cam.y) * a; cam.z += (tz.z - cam.z) * a;
  K = (L.mh / 400) * cam.z; OX = w / 2 - cam.x * K; OY = L.my + L.mh / 2 - cam.y * K;
  drawSea(c, w, h);
  c.save(); c.translate(OX, OY); c.scale(K, K);
  drawLand(c, t, dt);
  if (S.sec === 'crowns') drawNews(c, t);
  else if (v === 'web') drawWeb(c, t);
  else if (v === 'crisis') drawCrisis(c, t);
  else drawPlanScene(c, t);
  drawBadges(c, t);
  if (S.sec === 'crowns') drawCrowns(c, t);
  c.restore();
  flushLabels(c);
  if (S.sec === 'crowns') pill(c, String(crYear(t)), 10, 10, { size: 14, weight: 900 });
  else if (v === 'crisis') { pill(c, S.cw.date ? fmtLong(...S.cw.date) : '1914', 10, 10, { weight: 900 }); drawCalendar(c, w, h, L, t); }
  else if (v === 'plan') drawStripPlan(c, w, h, L, t);
  syncReadout(t);
});

// --- input ----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - OX) / K, y = (ev.clientY - r.top - OY) / K;
  let best = null, bd = 1e9;
  for (const k of POWERS) { const d = Math.hypot(x - B[k][0], y - B[k][1]); if (d < bd) { bd = d; best = k; } }
  if (!best || bd > Math.max(16, 20 / K)) return;
  S.tip = { k: best, t0: tnow() };
  if (lab.view === 'web' && Object.keys(S.drawn).length === 6 && !S.checked && CAND.includes(best)) { if (S.picks.has(best)) S.picks.delete(best); else S.picks.add(best); sfx.tick(); render(); } else sfx.tick();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k, t = tnow();
  if (a === 'thread') { S.drawn[k] = t; S.last = k; sfx.snap(); }
  else if (a === 'pick') { if (S.checked) return; if (S.picks.has(k)) S.picks.delete(k); else S.picks.add(k); S.tip = { k, t0: t }; sfx.tick(); }
  else if (a === 'check') {
    S.checked = true; S.chainT = t; S.found = RIGHT.filter((x) => S.picks.has(x)).length;
    S.wrong = [...S.picks].filter((x) => !RIGHT.includes(x)).length; S.trap = S.picks.has('IT');
    (S.found === 4 && !S.wrong ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'webAgain') { S.drawn = {}; S.last = null; S.picks = new Set(); S.checked = false; S.chainT = null; sfx.click(); }
  else if (a === 'next') nextStep();
  else if (a === 'opt') {
    const st = STEPS[S.step], ok = k === st.ok;
    S.verdict = { ok, ans: st.ok }; (ok ? sfx.good : sfx.bad)(); reveal();
  } else if (a === 'cAgain') { resetCrisis(); sfx.click(); }
  else if (a === 'popt') { S.planPick = +b.dataset.i; S.planT = t; S.gbT = null; (S.planPick === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'sept') { S.sepT = t; sfx.click(); showStage(); }
  else if (a === 'pAgain') { S.planPick = null; S.planT = null; S.sepT = null; S.gbT = null; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.cdT = null; S.crT = null; sfx.click(); showStage();
  } else if (a === 'candle') { S.cdT = t; sfx.click(); }
  else if (a === 'run') { S.crT = t; sfx.click(); }
  render();
});
function nextStep() {
  const st = STEPS[S.step]; if (!st || S.asking) return;
  S.verdict = null;
  if (st.pre) { applyFx(st.pre, tnow()); S.cw.date = [st.m, st.d]; }
  if (st.q) { S.asking = true; sfx.click(); return; }
  reveal();
}
function applyFx(fx, t) {
  const w = S.cw;
  for (const x of fx.arrows || []) w.arrows.push({ ...x, t0: t + x.dl });
  for (const [k, s] of Object.entries(fx.war || {})) { w.st[k] = s; w.pop[k] = t; w.war.add(k); }
  for (const k of fx.mob || []) { w.st[k] = 'm'; w.pop[k] = t; }
}
function reveal() {
  const st = STEPS[S.step], t = tnow();
  applyFx(st, t); S.cw.date = [st.m, st.d]; S.cw.marks.push(dayIdx(st.m, st.d)); S.stepT = t;
  if (st.sar) S.cw.sar = t;
  if (st.italy) S.cw.italy = t;
  if (st.later) {
    const tok = S.tok;
    setTimeout(() => { if (tok !== S.tok) return; S.cw.date = st.later; S.cw.marks.push(dayIdx(...st.later)); render(); }, 1100);
  }
  S.step++; S.asking = false; showStage();
}

// --- DOM per view ---------------------------------------------------------------------------------------------
const dot = (k, t) => `<i class="al-dot">${esc(t.short[k])}</i>`;
function renderWeb(t) {
  const n = Object.keys(S.drawn).length, all = n === 6, ck = S.checked;
  $('alChips').innerHTML = TORDER.map((k) => `<button class="chip al ${S.drawn[k] !== undefined ? 'on' : ''}" data-act="thread" data-k="${k}">${esc(t.treaties[k])}</button>`).join('');
  const card = $('alTreaty');
  card.style.setProperty('--c', S.last ? THREADS[S.last].col : '#98A0B8');
  card.innerHTML = S.last ? `<b>${esc(t.treaties[S.last])}</b> ${esc(t.treatyText[S.last])}` : esc(t.pullHint);
  let q = '';
  if (all) {
    q = `<div class="al-q">${esc(t.webQ)}</div><div class="chips">${CAND.map((k) => {
      const picked = S.picks.has(k), ok = RIGHT.includes(k);
      const cls = !ck ? (picked ? 'on' : '') : picked && ok ? 'right' : picked ? 'wrong' : ok ? 'miss' : '';
      return `<button class="chip al ${cls}" data-act="pick" data-k="${k}"${ck ? ' disabled' : ''}><b>${esc(t.short[k])}</b> ${esc(t.names[k])}</button>`;
    }).join('')}</div>`;
    if (!ck) q += `<div class="row2"><button class="btn" data-act="check"${S.picks.size ? '' : ' disabled'}>${esc(t.check)}</button></div>`;
    else {
      const perfect = S.found === 4 && !S.wrong;
      q += `<div class="al-vd"><div class="v ${perfect ? 'ok' : 'no'}">${esc(perfect ? t.right : t.notQuite)}</div>${perfect ? '' : `<p>${esc(t.found(S.found))}${S.trap ? ' ' + esc(t.italyTrap) : ''}</p>`}<p>${esc(t.exWeb)}</p></div>
        <div class="row2"><button class="chip al" data-act="webAgain">${esc(t.again)}</button></div>`;
    }
  }
  $('alWebQ').innerHTML = q;
  const [ti, le] = ck ? t.state.webDone : t.state.web0;
  return { emo: ck ? '🕸️' : '🗺️', title: ti, lead: le };
}
function renderCrisis(t) {
  const done = S.step >= 9, parts = [];
  if (S.asking) {
    const st = STEPS[S.step];
    parts.push(`<div class="al-q">★ ${esc(t[st.q])}</div><div class="al-opts ${st.yn ? 'two' : ''}">${st.yn
      ? ['yes', 'no'].map((k) => `<button class="al-opt" data-act="opt" data-k="${k}">${esc(t[k])}</button>`).join('')
      : st.opts.map((k) => `<button class="al-opt" data-act="opt" data-k="${k}">${dot(k, t)}${esc(t.names[k])}</button>`).join('')}</div>`);
  } else {
    if (S.verdict) {
      const v = S.verdict, lastQ = STEPS[S.step - 1], label = lastQ && lastQ.yn ? t[v.ans] : t.names[v.ans];
      parts.push(`<div class="al-vd"><div class="v ${v.ok ? 'ok' : 'no'}">${esc(v.ok ? t.right : t.notQuite)}</div>${v.ok ? '' : `<p>${esc(t.ans(label))}</p>`}</div>`);
    }
    parts.push(`<div class="row2">${done ? '' : `<button class="btn" data-act="next">${esc(t.nextStep)}</button>`}${S.step > 0 ? `<button class="chip al${done ? '' : ' push'}" data-act="cAgain">${esc(t.again)}</button>` : ''}</div>`);
  }
  $('alCrisis').innerHTML = parts.join('');
  if (S.step === 0) { const [ti, le] = t.state.crisis0; return { emo: '📅', title: ti, lead: le }; }
  if (done) { const [ti, le] = t.state.crisisDone; return { emo: '🌍', title: ti, lead: le }; }
  const st = STEPS[S.step - 1];
  return { emo: st.emo, title: fmtLong(st.m, st.d), lead: t.steps[st.line] };
}
function renderPlan(t) {
  const rv = S.planT !== null;
  let h = '';
  if (!rv) h = `<div class="al-q">${esc(t.planQ)}</div><div class="al-opts">${t.planOpts.map((o, i) => `<button class="al-opt" data-act="popt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  else {
    const ok = S.planPick === 1;
    h = `<div class="al-vd"><div class="v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.notQuite)}</div>${S.sepT !== null ? `<p>${esc(t.exPlan2)}</p>` : ''}</div>
      <div class="row2">${S.sepT === null ? `<button class="btn" data-act="sept">${esc(t.september)}</button>` : ''}<button class="chip al${S.sepT === null ? ' push' : ''}" data-act="pAgain">${esc(t.again)}</button></div>`;
  }
  $('alPlan').innerHTML = h;
  if (!rv) { const [ti, le] = t.state.plan0; return { emo: '🗺️', title: ti, lead: le }; }
  if (S.sepT === null) return { emo: '🚂', title: t.state.plan0[0], lead: t.exPlan };
  const [ti, le] = t.state.planDone; return { emo: '🪖', title: ti, lead: le };
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v;
  $('alWeb').style.display = !sec && v === 'web' ? '' : 'none';
  $('alCrisis').style.display = !sec && v === 'crisis' ? '' : 'none';
  $('alPlan').style.display = !sec && v === 'plan' ? '' : 'none';
  let st = v === 'web' ? renderWeb(t) : v === 'crisis' ? renderCrisis(t) : renderPlan(t);
  if (sec) st = sec === 'truce' ? { emo: '🎄', title: t.secrets.truce[0], lead: t.secretA } : { emo: '👑', title: t.secrets.crowns[0], lead: t.secretB };
  lab.setState({ ...st, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  lab.setFacts(t.facts[v]);
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip al secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('alSec').innerHTML = sc('truce', '🎄') + sc('crowns', '👑');
  $('alSecCtl').innerHTML = sec === 'truce' ? `<button class="btn" data-act="candle">${esc(t.christmas)}</button>` : sec === 'crowns' ? `<button class="btn" data-act="run">${esc(t.run1922)}</button>` : '';
  $('alLeg').innerHTML = POWERS.map((k) => `<span><b>${esc(t.short[k])}</b> ${esc(t.names[k])}</span>`).join('');
  lastRead = ''; syncReadout(tnow());
}
render();
</script>
