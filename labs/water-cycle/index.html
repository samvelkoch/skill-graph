function smooth(pts, n = 8) { // quadratic curve through the middles of a polyline
  const out = [pts[0]], mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];

  for (let i = 1; i < pts.length - 1; i++) {
    const end = i === pts.length - 2 ? pts[pts.length - 1] : mid(pts[i], pts[i + 1]);
    for (let s = 1; s <= n; s++) {
      const q = s / n, a = (1 - q) * (1 - q), b = 2 * (1 - q) * q, c = q * q;
      out.push([a * prev[0] + b * pts[i][0] + c * end[0], a * prev[1] + b * pts[i][1] + c * end[1]]);

function along(poly, f) { // point at fraction f of the polyline's length (measured in pixels)

function pose(ak, ap) {

}

// --- cycle: update and draw --------------------------------------------------------------------------------
function tickCycle(dt, time, po) {
  const parts = C.parts;
  if (C.mode !== 'snow' && C.phase === 'play') {
    C.p += dt / dur(C.k);
    if (C.p >= 1) {
      C.p = 1;
      if (C.k === 4) C.trips++;
      if (autoRunning()) { C.k = (C.k + 1) % 5; C.p = 0; } else C.phase = 'done';
      render();
    }
  }
  if (po.rain && po.cloud) {
    C.emit += dt * (C.mode === 'snow' ? 55 : 80);
    while (C.emit >= 1) {
      C.emit -= 1;
      const x = clamp(po.cloud.x + (Math.random() - 0.5) * 0.16 * po.cloud.size, 0.10, 0.36), y0 = po.cloud.y + 0.06, landY = mtnY(x);
      if (landY <= y0 + 0.02 || parts.length > 160) continue;
      const snow = C.mode === 'snow' ? C.temp < 0 : landY < 0.30;
      parts.push({ x, y: y0, vy: snow ? 0.10 + Math.random() * 0.05 : 0.75 + Math.random() * 0.25, snow, ph: Math.random() * 6, landY });
    }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.y += q.vy * dt; if (q.snow) q.x += Math.sin(time * 2 + q.ph) * 0.01 * dt * 3;
    if (q.y >= q.landY) { if (q.snow && C.mode === 'snow') C.pile = Math.min(1, C.pile + 0.012); parts.splice(i, 1); }
  }
  if (C.mode === 'snow' && C.temp > 0) C.pile = Math.max(0, C.pile - dt * 0.06);
  C.eraT += clamp((C.mode === 'old' ? C.era : 0) - C.eraT, -dt * 1.2, dt * 1.2);
}

  c.fillStyle = sg; c.beginPath(); c.arc(sx, sy, sr * 3.2, 0, 6.283); c.fill();
  c.fillStyle = '#ffe28a'; c.beginPath(); c.arc(sx, sy, sr, 0, 6.283); c.fill();

  c.fillStyle = '#d8c48a'; poly(c, [[px(0.72), py(0.64)], [px(0.80), py(0.64)], [px(0.78), h], [px(0.70), h]]); c.fill();
  const sea = c.createLinearGradient(0, py(0.64), 0, h); sea.addColorStop(0, '#3a86d0'); sea.addColorStop(1, '#14447c');
  c.fillStyle = sea; poly(c, [[px(0.77), py(0.64)], [w, py(0.64)], [w, h], [px(0.75), h]]); c.fill();

// --- earth: update and draw --------------------------------------------------------------------------------

});

// --- one render per change: controls, the question card, the state card -----------------------------------
const optsHTML = (list, cls, pick, locked) => `<div class="opts ${cls}">${list.map((o, j) => `<button class="opt${pick === j ? ' sel' : ''}" data-j="${j}"${locked ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
function verdict(t, ok, pickName, rightName, why) {
  return `<div class="verdict ${ok ? 'ok' : 'no'}">${ok ? '✓ ' : ''}${esc(ok ? t.right : t.wrong)}</div>
    <div>${ok ? '' : `<span class="ans bad">✗ ${esc(pickName)}</span>`}<span class="ans good">✓ ${esc(rightName)}</span></div>
    ${why ? `<p>${esc(why)}</p>` : ''}`;
}
const nextBtn = (t) => `<button class="btn" data-nx>${esc(t.next)}</button>`;

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secCycle').hidden = v !== 'cycle'; $('secEarth').hidden = v !== 'earth';
  $('ctrl').style.display = v === 'dry' ? 'none' : '';
  document.querySelector('.readout').style.display = v === 'earth' ? 'none' : '';
  lastRead = '';
  if (v === 'cycle') renderCycle(t); else if (v === 'dry') renderDry(t); else renderEarth(t);
}

function renderCycle(t) {
  const open = secret.unlocked(), k = C.k, m = C.mode, running = autoRunning();
  lab.setGlow('rgba(78, 168, 255, .28)');
  $('sunLbl').textContent = `☀️ ${t.c.sun}`; $('sun').value = C.sun; $('sun').setAttribute('aria-label', t.c.sun);
  $('tempBox').hidden = m !== 'snow'; $('tempLbl').textContent = t.sec.temp; $('temp').value = C.temp; $('temp').setAttribute('aria-label', t.sec.temp);
  $('tempVal').textContent = `${C.temp < 0 ? '−' : ''}${Math.abs(C.temp)} °C`;
  $('eraRow').hidden = m !== 'old';
  $('eraSeg').innerHTML = t.sec.eras.map((l, i) => `<button data-era="${i}" class="${i === C.era ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('autoB').hidden = !(C.trips > 0 || C.auto) || m !== null; $('autoB').textContent = C.auto ? t.c.stop : t.c.auto;
  const sc = (key, emo) => `<button class="chip secret ${open ? 'open' : ''} ${m === key ? 'on' : ''}" data-act="sec" data-k="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('snow', '🌨️') + sc('old', '🦕');
  // the question card
  if (m === 'snow') askEl.innerHTML = `<p>${esc(t.sec.snowText)}</p>`;
  else if (m === 'old') askEl.innerHTML = `<p>${esc(t.sec.oldText)}</p>`;
  else if (C.auto) askEl.innerHTML = `<p><b>${esc(t.c.why[k])}</b></p>`;
  else if (C.phase === 'done') {
    const ok = C.pick === OK[k], list = t.c['o' + (k + 1)];
    askEl.innerHTML = verdict(t, ok, list[C.pick], list[OK[k]], t.c.why[k]) + nextBtn(t);
  } else askEl.innerHTML = `<div class="q">${esc(t.c['q' + (k + 1)])}</div>${optsHTML(t.c['o' + (k + 1)], 'col1', C.pick, C.phase === 'play')}`;
  // the state card tells the story only as far as the child has seen it
  const [emo, title, lead, body] = t.cards.cycle, seen = C.trips > 0 || running || m !== null ? 9 : k + (C.phase === 'done' ? 1 : 0);
  lab.setState({ emo, title, lead: seen >= 2 ? lead : '', body: seen >= 5 ? body : '', extra: '' });
}

function renderDry(t) {
  const race = D.race, key = ['sunShade', 'windy', 'lid'][race], ord = order(), cases = t.d.cases[key];
  lab.setGlow('rgba(255, 200, 80, .22)');
  if (D.phase === 'done') {
    const ok = ord[D.pick] === WIN[race];
    askEl.innerHTML = verdict(t, ok, cases[ord[D.pick]], cases[WIN[race]], t.d.why[key]) + nextBtn(t);
  } else askEl.innerHTML = `<div class="q">${esc(t.d.q(race))}</div>${optsHTML(ord.map((i) => cases[i]), 'two', D.pick, D.phase === 'play')}`;
  const [emo, title, lead, body] = t.cards.dry, seen = race + (D.phase === 'done' ? 1 : 0);
  lab.setState({ emo, title, lead: seen >= 2 ? lead : '', body: seen >= 3 ? body : '', extra: '' });
}

function renderEarth(t) {
  const e = t.e, step = E.step, play = E.phase === 'play', done = E.phase === 'done';
  lab.setGlow('rgba(60, 120, 200, .3)');
  if (step === 0) askEl.innerHTML = `<div class="q">${esc(e.q1)}</div>${optsHTML(e.o1, '', E.pick, false)}`;
  else if (step === 1) {
    if (play) askEl.innerHTML = `<div class="q">${esc(e.q1)}</div>${optsHTML(e.o1, '', E.pick, true)}`;
    else askEl.innerHTML = verdict(t, E.pick === 1, e.o1[E.pick], e.o1[1], '') + nextBtn(t);
  } else if (step === 2) askEl.innerHTML = `<div class="q">${esc(e.q2)}</div>${optsHTML(e.o2, '', null, false)}`;
  else if (play) askEl.innerHTML = `<div class="q">${esc(e.q2)}</div>${optsHTML(e.o2, '', E.pick, true)}`;
  else askEl.innerHTML = verdict(t, E.pick === 1, e.o2[E.pick], e.o2[1], e.legend) + nextBtn(t);
  // legend of the cups
  const split = step === 3 && done;
  const rows = step >= 2 || (step === 1 && done)
    ? [[CUP.salt, e.salt, ''], ...(split ? [[CUP.ice, e.ice, ''], [CUP.ground, e.ground, '']] : [[CUP.fresh, e.fresh, '']]), [CUP.fresh, e.spoon, 'sp']] : [];
  $('legend').innerHTML = rows.map(([col, txt, cls]) => `<div class="lg"><i class="sw ${cls}" style="background:${col}"></i><span>${esc(txt)}</span></div>`).join('');
  $('ctrl').style.display = rows.length ? '' : 'none';
  const [emo, title, lead, body] = t.cards.earth, full = step === 3 && done;
  lab.setState({ emo, title: full ? title : step >= 2 ? e.q2 : e.q1, lead: step === 1 && !done ? '' : step >= 1 ? lead : '', body: full ? body : '', extra: full ? `<div class="fine">${esc(t.fine)}</div>` : '' });
}
render();
</script>
</body>
</html>
