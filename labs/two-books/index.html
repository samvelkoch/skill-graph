  c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(x + w / 2 - 1, y + 6, 3, h - 6);
  c.fillStyle = flag ? KC : VC; c.beginPath(); c.moveTo(x + w - 30, y + 4); c.lineTo(x + w - 14, y + 4); c.lineTo(x + w - 14, y + 34 + Math.sin(t * 2) * 1.5); c.lineTo(x + w - 22, y + 28); c.lineTo(x + w - 30, y + 34); c.closePath(); c.fill();
  c.restore();
}
function medal(c, i, x, y, r, state, t) { // state: 0 hidden, 1 used, 2 left out; colour by owner
  c.save(); c.translate(x, y);
  if (state === 0) { c.fillStyle = '#1b1d33'; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.strokeStyle = 'rgba(160,175,230,.4)'; c.lineWidth = 2; c.stroke(); c.fillStyle = 'rgba(200,210,255,.7)'; c.font = `900 ${r}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 0, 2); }
  else {
    c.fillStyle = state === 1 ? '#fff6dc' : '#3a3d52'; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
    c.save(); c.beginPath(); c.arc(0, 0, r - 2, 0, 7); c.clip(); obj(c, i, 0, 1, r / 38, state === 1 ? 1 : .28); c.restore();
    c.strokeStyle = state === 1 ? '#ffd35a' : '#6a6d82'; c.lineWidth = state === 1 ? 3 : 2; c.stroke();
    if (state === 1) { c.shadowColor = '#ffd35a'; c.shadowBlur = 10 + 4 * Math.sin(t * 4); c.stroke(); }
  }
  c.fillStyle = '#0c0e1a'; c.beginPath(); c.arc(-r * .8, -r * .8, r * .34, 0, 7); c.fill(); c.fillStyle = '#fff'; c.font = `800 ${r * .5}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(i + 1), -r * .8, -r * .78);
  c.restore();
}
function scoreOf() {
  let k = BASE, v = BASE, n = 0;
  S.pick.forEach((i) => { if (i < 8) { k += GAIN_K[i]; v += GAIN_V[i]; n++; } else { k += LOAD[i - 8][0]; v += LOAD[i - 8][1]; } });
  return { k: clamp(k, 0, 100), v: clamp(v, 0, 100), n, load: S.pick.filter((i) => i >= 8).length };
}
const moodOf = (val) => (val >= LINE ? 1 : val >= 45 ? 0 : -1);

// --- the main loop ----------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, t) => {
  SC = Math.min(w / W, h / H);
  const ox = (w - W * SC) / 2, oy = (h - H * SC) / 2;
  c.fillStyle = '#14162b'; c.fillRect(0, 0, w, h);
  c.save(); c.translate(ox, oy); c.scale(SC, SC); c.beginPath(); c.rect(0, 0, W, H); c.clip();
  const v = lab.view, k = 1 - Math.pow(.001, dt);
  if (S.sec === 'fire') {
    valley(c, t, { fire: true, night: true });
    c.fillStyle = 'rgba(8,8,24,.35)'; c.fillRect(0, 0, W, H);
    [[130, 440, KC, 0], [630, 440, VC, 1], [380, 470, '#b58cd0', 2]].forEach(([x, y, col, i]) => {
      const P = [{ age: 'adult', skin: '#e9b98a', hair: '#3a2418', hairStyle: 'short', top: '#2f8f86', outfit: 'jacket', mood: 'worried' }, { age: 'adult', skin: '#c98e5e', hair: '#7a3a20', hairStyle: 'bun', top: '#d9922a', outfit: 'cardigan', mood: 'thinking' }, { age: 'older', skin: '#f0c8a0', hair: '#dcdcdc', hairStyle: 'buzz', top: '#8a5aa8', outfit: 'sweater', mood: 'calm' }][i];
      c.save(); c.beginPath(); c.rect(x - 70, y - 60, 140, 560 - (y - 60)); c.clip(); person(c, x, y, 30, { ...P, look: i === 0 ? 1 : i === 1 ? -1 : 0, tilt: Math.sin(t * 3 + i) * .03 }); c.restore();
      const heard = S.heard.includes(i); c.fillStyle = heard ? 'rgba(255,246,220,.95)' : 'rgba(255,255,255,.85)'; rr(c, x - 22, y - 78, 44, 30, 10); c.fill(); c.fillStyle = '#2b2233'; c.font = '900 20px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(heard ? '“…”' : '?', x, y - 62);
    });
    pill(c, T[lang].fire.title, 380, 40, 13, '#ffd27a');
  } else if (S.sec === 'later') {
    c.fillStyle = lin(c, 0, 0, 0, H, [[0, '#2a2f5a'], [1, '#1a1c34']]); c.fillRect(0, 0, W, H);
    const L = T[lang].later;
    book(c, 40, 120, 300, 300, '#1d7f77', '#0f4a45', '', t, true); book(c, 420, 120, 300, 300, '#1d7f77', '#0f4a45', '', t, true);
    pill(c, L.old, 190, 90, 13); pill(c, L.neu, 570, 90, 13, '#9be8b4');
    c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 3; c.setLineDash([6, 6]); c.beginPath(); c.moveTo(350, 270); c.lineTo(410, 270); c.stroke(); c.setLineDash([]); c.beginPath(); c.moveTo(402, 262); c.lineTo(412, 270); c.lineTo(402, 278); c.stroke();
    flagK(c, 360, 200, 1.1, t); flagV(c, 400, 200, 1.1, t); // good neighbours
    pill(c, '50 ⟳', 380, 300, 13, '#ffd27a');
    pill(c, `${T[lang].bookK}`, 190, 470, 12); pill(c, `${T[lang].bookK}`, 570, 470, 12);
  } else if (v === 'src') {
    c.fillStyle = '#14162b'; c.fillRect(0, 0, W, H);
    valley(c, t, { ring: S.sel !== null ? RING[S.sel] : null, burn: S.sel === 4 });
    shelf(c, t); pill(c, T[lang].shelfCap, 380, 140, 12, '#e8d6b0');
  } else if (v === 'books') {
    c.fillStyle = lin(c, 0, 0, 0, H, [[0, '#2a2f5a'], [1, '#1a1c34']]); c.fillRect(0, 0, W, H);
    book(c, 40, 70, 300, 250, '#1d7f77', '#0f4a45', '', t, true); book(c, 420, 70, 300, 250, '#c58a1c', '#6a4608', '', t, false);
    pill(c, T[lang].bookK, 190, 40, 13, '#7fe0d4'); pill(c, T[lang].bookV, 570, 40, 13, '#ffd27a');
    for (let sd = 0; sd < 2; sd++) for (let i = 0; i < 8; i++) {
      const x = 62 + sd * 380 + (i % 4) * 72, y = 396 + Math.floor(i / 4) * 66, used = (sd ? USED_V : USED_K).includes(i);
      medal(c, i, x + 30, y, 26, S.rev ? (used ? 1 : 2) : 0, t);
    }
    if (S.rev) pill(c, T[lang].b.nm(4, 4), 380, 365, 12, '#ffe9a8');
  } else {
    c.fillStyle = lin(c, 0, 0, 0, H, [[0, '#2f2a5a'], [1, '#1b1a36']]); c.fillRect(0, 0, W, H);
    const sc = scoreOf(); S.kv = lerp(S.kv, sc.k, k); S.vv = lerp(S.vv, sc.v, k);
    const win = sc.k >= LINE && sc.v >= LINE && sc.n >= 6;
    if (win) { const g = c.createRadialGradient(380, 200, 20, 380, 200, 380); g.addColorStop(0, `rgba(255,224,120,${.25 + .1 * Math.sin(t * 3)})`); g.addColorStop(1, 'rgba(255,224,120,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H); }
    [[150, KC, S.kv, 'kn'], [610, VC, S.vv, 'vn']].forEach(([x, col, val, key], si) => {
      const m = moodOf(val), nod = m > 0 ? Math.sin(t * 5 + si) * 3 : m < 0 ? Math.sin(t * 9) * 1.2 : 0;
      c.save(); c.beginPath(); c.rect(x - 110, 0, 220, 244); c.clip(); person(c, x, 130 + nod, 56, si ? { age: 'child', skin: '#d9a577', hair: '#2a1c14', hairStyle: 'short', top: col, outfit: 'hoodie', mood: m > 0 ? 'smile' : m < 0 ? 'worried' : 'calm', look: -.6 } : { age: 'child', skin: '#e9b98a', hair: '#5a3420', hairStyle: 'bob', top: col, outfit: 'hoodie', mood: m > 0 ? 'smile' : m < 0 ? 'worried' : 'calm', look: .6 }); c.restore();
      c.fillStyle = 'rgba(8,10,24,.7)'; rr(c, x - 110, 250, 220, 24, 12); c.fill(); c.fillStyle = lin(c, x - 106, 0, x + 106, 0, [[0, '#c0532a'], [1, col]]); rr(c, x - 106, 254, 212 * clamp(val / 100, .02, 1), 16, 8); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.moveTo(x - 106 + 212 * LINE / 100, 246); c.lineTo(x - 106 + 212 * LINE / 100, 278); c.stroke();
      pill(c, T[lang].t[key], x, 220, 12, m > 0 ? '#9be8b4' : '#fff');
    });
    // the Orvan book with the lines picked so far
    book(c, 230, 350, 300, 150, '#6a4fb0', '#33245f', '', t, true);
    pill(c, T[lang].bookO, 380, 322, 12, '#cdb8ff');
    S.pick.slice(0, 8).forEach((ii, j) => { const col = ii >= 8 ? '#c0392b' : '#6b5a45'; c.fillStyle = col; rr(c, 252 + (j % 2) * 140, 385 + Math.floor(j / 2) * 24, 110, 8, 4); c.fill(); });
    pill(c, T[lang].t.facts(sc.n), 380, 532, 12, win ? '#9be8b4' : '#fff');

});
$('cv').addEventListener('click', (ev) => {
  if (lab.view !== 'src' || S.sec) return;
  const r = $('cv').getBoundingClientRect(), s = Math.min(r.width / W, r.height / H), x = (ev.clientX - r.left - (r.width - W * s) / 2) / s, y = (ev.clientY - r.top - (r.height - H * s) / 2) / s;
  if (y > 0 && y < 130 && x > 20 && x < W - 20) { const i = clamp(Math.floor((x - 28) / 88), 0, 7); openObj(i); }
});

// --- controls --------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function openObj(i) { S.sel = i; sfx.click(); if (!PREDICT.includes(i) && !S.seen.includes(i)) S.seen.push(i); render(); }
$('tbSec').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-k]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === b.dataset.k ? null : b.dataset.k; if (S.sec === 'fire') S.heard = []; sfx.click(); render(); if (S.sec) showStage();
});
$('tbMain').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, v = +b.dataset.v;
  if (a === 'obj') openObj(v);
  else if (a === 'kind') { const i = S.sel; S.guess[i] = KEYS[v]; if (!S.seen.includes(i)) S.seen.push(i); (KEYS[v] === T[lang].src[i].k ? sfx.good : sfx.bad)(); }
  else if (a === 'q1') S.q1 = v;
  else if (a === 'q2') S.q2 = v;
  else if (a === 'rev') { S.rev = true; sfx.good(); showStage(); }
  else if (a === 'pick') { const j = S.pick.indexOf(v); if (j >= 0) S.pick.splice(j, 1); else S.pick.push(v); sfx.tick(); }
  else if (a === 'wit') { if (!S.heard.includes(v)) S.heard.push(v); sfx.click(); }
  render();
});

const markup = (s, mode) => { // mode 'plain' strips the marks; 'book' glows and underlines; 'diffOld' strikes; 'diffNew' marks additions
  let h = esc(s);
  if (mode === 'plain') return h.replace(/\[\[|\]\]|\{\{|\}\}/g, '');
  if (mode === 'diffOld') return h.replace(/\[\[(.+?)\]\]/g, '<s>$1</s>').replace(/\{\{|\}\}/g, '');
  if (mode === 'diffNew') return h.replace(/\{\{(.+?)\}\}/g, '<ins>$1</ins>');
  return h.replace(/\[\[(.+?)\]\]/g, '<u class="tb-l">$1</u>').replace(/\{\{(.+?)\}\}/g, '<span class="tb-we">$1</span>');
};
const opt = (a, v, label, cls = '', dis = false) => `<button class="tb-opt ${cls}" data-a="${a}" data-v="${v}"${dis ? ' disabled' : ''}>${esc(label)}</button>`;

function render() {
  const t = T[lang], v = lab.view, main = $('tbMain'), open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-k="${k === 'later' ? 'later' : 'fire'}">${open ? `${emo} ${esc(t.secrets[k === 'later' ? 'a' : 'b'][0])}` : '🔒 ???'}</button>`;
  $('tbSec').innerHTML = sc('later', '🕰️') + sc('fire', '📁');
  lab.setGlow(S.sec === 'fire' ? 'rgba(255,120,60,.3)' : 'rgba(120,100,200,.3)');
  if (S.sec === 'later') {
    const L = t.later;
    main.innerHTML = `<div class="tb-books"><div class="tb-book k"><h4>${esc(L.old)}</h4>${markup(L.oldT, 'diffOld')}</div><div class="tb-book k"><h4>${esc(L.neu)}</h4>${markup(L.neuT, 'diffNew')}</div></div>
      <p class="tb-sub" style="margin-top:8px">${esc(L.legend)}</p>`;
    lab.setReadout('4 → 5', t.later.neu, '', '#2fb3a8'); lab.setState({ emo: L.st[0], title: L.st[1], lead: L.st[2], body: L.sum, extra: '' }); lab.setFacts([]); return;
  }
  if (S.sec === 'fire') {
    const F = t.fire, all = S.heard.length >= 3;
    main.innerHTML = `<p class="tb-sub">${esc(F.rec)}</p><p class="tb-sub">${esc(F.tap)}</p>` + F.w.map((w, i) => `<button class="tb-wit ${S.heard.includes(i) ? 'open' : ''}" data-a="wit" data-v="${i}"><b>${esc(w[0])}</b>${S.heard.includes(i) ? `<br>${esc(w[1])}` : ''}</button>`).join('') +
      (all ? `<div class="tb-card"><h4>${esc(F.end)}</h4><p>📚 ${esc(F.cK)}</p><p>📚 ${esc(F.cV)}</p><p><b>${esc(F.lesson)}</b></p></div>` : '');
    lab.setReadout(`${S.heard.length}/3`, F.title, '', '#ff7a3c'); lab.setState({ emo: F.st[0], title: F.st[1], lead: F.st[2], body: all ? F.end : '', extra: '' }); lab.setFacts([]); return;
  }
  lab.setFacts(t.facts[v]);
  if (v === 'src') {
    const i = S.sel, p = i !== null && PREDICT.includes(i) && !S.guess[i], d = i !== null ? t.src[i] : null;
    let h = `<div class="tb-shelf">${EMO.map((e, j) => `<button class="tb-sh ${i === j ? 'on' : ''} ${S.seen.includes(j) ? 'seen' : ''}" data-a="obj" data-v="${j}" aria-label="${esc(t.src[j].name)}">${e}</button>`).join('')}</div>`;
    if (i === null) h += `<p class="tb-sub">${esc(t.s1.tap)}</p>`;
    else if (p) h += `<div class="tb-card"><h4>${EMO[i]} ${esc(d.name)}</h4><p>${esc(d.desc)}</p></div><p class="tb-q" style="margin-top:10px">${esc(t.s1.ask)}</p><div class="tb-row">${KEYS.map((k, j) => opt('kind', j, t.kinds[k])).join('')}</div>`;
    else {
      const g = S.guess[i], ok = !g || g === d.k;
      h += `<div class="tb-card"><h4>${EMO[i]} ${esc(d.name)}</h4><p>${esc(d.desc)}</p>
        ${g ? `<p><b style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.s1.right : t.s1.wrong(t.kinds[d.k]))}</b></p>` : ''}
        <div class="k">${esc(t.s1.kindL)}</div><p><span class="tb-pill">${esc(t.kinds[d.k])}</span></p>
        <div class="k">${esc(t.s1.fact)}</div><p>${esc(d.fact)}</p>
        <div class="k">${esc(t.s1.cantL)}</div><p>${esc(d.cant)}</p></div>`;
    }
    main.innerHTML = h;
    lab.setReadout(`${S.seen.length}/8`, t.s1.opened(S.seen.length), '', '#c9a03a');
    lab.setState({ emo: t.st1[0], title: t.st1[1], lead: t.st1[2], body: '', extra: '' });
  } else if (v === 'books') {
    const b = t.b, ready = S.q1 !== null && S.q2 !== null, rv = S.rev;
    let h = `<div class="tb-books"><div class="tb-book k"><h4>${esc(t.bookK)}</h4>${markup(b.K, rv ? 'book' : 'plain')}</div><div class="tb-book v"><h4>${esc(t.bookV)}</h4>${markup(b.V, rv ? 'book' : 'plain')}</div></div>`;
    if (!rv) {
      h += `<p class="tb-q" style="margin-top:12px">${esc(b.q1)}</p><div class="tb-row">${b.q1o.map((o, j) => opt('q1', j, o, S.q1 === j ? 'on' : '')).join('')}</div>
        <p class="tb-q">${esc(b.q2)}</p><div class="tb-row">${b.q2o.map((o, j) => opt('q2', j, o, S.q2 === j ? 'on' : '')).join('')}</div>
        <div class="tb-row"><button class="btn" data-a="rev"${ready ? '' : ' disabled'}>${esc(b.go)}</button></div>`;
    } else {
      const ok1 = S.q1 === 1, ok2 = S.q2 === 1;
      h += `<div class="tb-card"><p><b style="color:${ok1 ? 'var(--ok)' : 'var(--wip)'}">${esc(ok1 ? t.s1.right : b.r1)}</b>${ok1 ? ' ' + esc(b.r1) : ''}</p>
        <p><b style="color:${ok2 ? 'var(--ok)' : 'var(--wip)'}">${esc(ok2 ? t.s1.right : b.r2)}</b>${ok2 ? ' ' + esc(b.r2) : ''}</p></div>
        <div class="k" style="margin:10px 0 2px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:800">${esc(b.legend)}</div>` +
        t.srcShort.map((s, i) => `<div class="tb-fl"><b>${i + 1}</b><span>${esc(s)}</span><i class="tb-dot k ${USED_K.includes(i) ? 'on' : ''}"></i><i class="tb-dot v ${USED_V.includes(i) ? 'on' : ''}"></i></div>`).join('') + `<p class="tb-sub" style="margin-top:8px">${esc(b.note)}</p>`;
    }
    main.innerHTML = h;
    lab.setReadout(rv ? '4 · 4' : '?', rv ? b.nm(4, 4) : '', '', '#2fb3a8');
    lab.setState(rv ? { emo: t.st2r[0], title: t.st2r[1], lead: t.st2r[2], body: '', extra: '' } : { emo: t.st2[0], title: t.st2[1], lead: t.st2[2], body: '', extra: '' });
  } else {
    const sc2 = scoreOf(), win = sc2.k >= LINE && sc2.v >= LINE && sc2.n >= 6, tt = t.t;
    main.innerHTML = `<p class="tb-sub">${esc(tt.lead)}</p><div class="tb-bank">${t.bank.map((s, i) => `<button class="tb-line ${S.pick.includes(i) ? 'on' : ''} ${i >= 8 ? 'ld' : ''}" data-a="pick" data-v="${i}"><span class="n">${i >= 8 ? '✦' : i + 1}</span>${esc(s)}</button>`).join('')}</div>`;
    const msg = S.pick.length === 0 ? tt.start : win ? tt.win(sc2.n) : sc2.k >= LINE && sc2.v >= LINE ? tt.thin : (sc2.k < LINE || sc2.v < LINE) && S.pick.some((i) => i >= 8) ? tt.lose : tt.goal;
    lab.setReadout(`${sc2.n}/8`, tt.facts(sc2.n), win ? '✓' : '', '#9b8be0');
    lab.setState({ emo: win ? '🎉' : t.st3[0], title: win ? tt.win(sc2.n) : t.st3[1], lead: win ? t.st3[2] : msg, body: tt.goal, extra: '' });
  }
}
render();
