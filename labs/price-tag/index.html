import { shell, canvasLoop, secretLab, sfx, $, esc, clamp, lang } from '../lab.js';

// --- number helpers: decimal comma in RU/HU, real minus, no float noise ----------------------------------------
const rnd = (v, d = 2) => Math.round(v * 10 ** d + 1e-9 * Math.sign(v)) / 10 ** d;
const N = (v, d = 2) => { const s = String(rnd(v, d)).replace('-', '−'); return lang === 'en' ? s : s.replace('.', ','); };
const F = (f) => N(f, 4); // a factor
const X = (f) => (Math.abs(f - rnd(f, 4)) > 1e-9 ? '≈\u00A0' : '') + '×' + N(f, 4); // "×factor"; "≈" only when it was rounded
const sg = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + N(Math.abs(v));
const pct = (v) => (lang === 'hu' ? `${v}%` : `${v} %`);

    const prev = rows[i - 1];
    if (!prev || r.mult == null || !prev._u || !r._u) return;
    const a = Math.min(prev._p, r._p), ya = yRow(i - 1) + rowH, yb = yRow(i), xa = bx0 + prev._d * sc - 8, xb = bx0 + r._d * sc - 8, cl = COL[r.kind];
    c.save(); c.globalAlpha = a; c.lineWidth = 2.2; c.strokeStyle = cl[0];
    c.beginPath(); c.moveTo(xa, ya + 1); c.bezierCurveTo(xa, ya + gap * 0.75, xb, yb - gap * 0.75, xb, yb - 3); c.stroke();
    c.beginPath(); c.moveTo(xb - 4.5, yb - 8); c.lineTo(xb, yb - 2); c.lineTo(xb + 4.5, yb - 8); c.stroke(); c.restore();
    pill(c, X(r.mult), clamp((xa + xb) / 2 + 26, bx0 + 28, w - 40), (ya + yb) / 2, w, { alpha: a, border: cl[1], fg: '#fff' });
  });
  if (single && lastChain) { // "or" and the size of the gap between the end of the chain and the single rise
    const i = rows.indexOf(single), ya = yRow(i - 1) + rowH, yb = yRow(i), d = lastChain.val - single.val;
    pill(c, t.or, bx0 + 22, (ya + yb) / 2, w, { alpha: single._p, fg: '#c9d2ee' });
    pill(c, T[lang].chain.diff(d), w - PAD - 26, (ya + yb) / 2, w, { alpha: single._p, fg: '#ffe28f', border: '#d89a1d' });
  }

  // lower panel
  if (lowH > 0) {
    const ly0 = h - lowH - 8, ly1 = h - 8;
    c.save(); rr(c, PAD, ly0, w - 2 * PAD, ly1 - ly0, 14); c.fillStyle = 'rgba(255,255,255,.04)'; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(130,145,190,.22)'; c.stroke(); c.restore();
    if (M.lower === 'eq') {
      c.save(); c.textAlign = 'center'; c.textBaseline = 'middle';
      if (!M.eq) { c.font = FONT(700, 13); c.fillStyle = '#98A0B8'; c.fillText(t.back.hint, w / 2, (ly0 + ly1) / 2, w - 40); }
      else {
        const step = Math.min(30, (ly1 - ly0 - 12) / M.eq.length), yy0 = (ly0 + ly1) / 2 - ((M.eq.length - 1) * step) / 2;
        M.eq.forEach(([s, col, sz], i) => { c.font = FONT(900, sz); c.fillStyle = col; c.fillText(s, w / 2, yy0 + i * step, w - 36); });
      }
      c.restore();
    } else drawGraph(c, w, ly0, ly1, M, rows, time, dt);
  }
};

function drawGraph(c, w, ly0, ly1, M, rows, time, dt) {
  const t = T[lang], gRows = rows.filter((r) => r.g), N_ = gRows.length;
  c.save(); c.font = FONT(700, 12); c.fillStyle = '#98A0B8'; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(t.gcap, PAD + 10, ly0 + 17, w - 2 * PAD - 20);
  const gx0 = PAD + 40, gx1 = w - PAD - 14, gy0 = ly0 + 30, gy1 = ly1 - 22;
  // range: before the answer only a fixed band around the start; then the real values (eased)
  const live = gRows.filter((r) => r._u).map((r) => r.val), sing = rows.find((r) => r.hline && r._u);
  const vals = live.concat(sing ? [sing.val] : []);
  let lo, hi;
  if (vals.length > 1) { lo = Math.min(...vals); hi = Math.max(...vals); const pd = 0.22 * Math.max(hi - lo, 6); lo -= pd; hi += pd; } else { lo = M.pre?.lo ?? 60; hi = M.pre?.hi ?? 140; }
  S.gl = S.gl ? S.gl + (lo - S.gl) * (1 - Math.exp(-dt * 5)) : lo; S.gh = S.gh ? S.gh + (hi - S.gh) * (1 - Math.exp(-dt * 5)) : hi;
  const yOf = (v) => gy1 - ((v - S.gl) / (S.gh - S.gl)) * (gy1 - gy0);
  // axes: ticks, labels
  c.font = FONT(700, 12); c.textAlign = 'right'; c.textBaseline = 'middle';
  for (const tv of niceTicks(S.gl, S.gh)) {
    const y = yOf(tv); if (y < gy0 - 4 || y > gy1 + 2) continue;
    c.strokeStyle = 'rgba(190,205,255,.12)'; c.lineWidth = 1; c.beginPath(); c.moveTo(gx0, y); c.lineTo(gx1, y); c.stroke();
    c.fillStyle = '#98A0B8'; c.fillText(N(tv, 1), gx0 - 6, y);
  }
  const step = (gx1 - gx0 - 28) / Math.max(1, N_ - 1), xs = gRows.map((_, i) => gx0 + 14 + i * step);
  // the start price, dashed
  const y100 = yOf(100); if (y100 > gy0 - 2 && y100 < gy1 + 2) { c.setLineDash([4, 4]); c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(gx0, y100); c.lineTo(gx1, y100); c.stroke(); c.setLineDash([]); }
  // the single rise as a dashed gold line, and the gap to the chain
  if (sing) {
    const ys = yOf(sing._d), a = sing._p; c.save(); c.globalAlpha = a; c.setLineDash([6, 4]); c.strokeStyle = '#ffe28f'; c.lineWidth = 2; c.beginPath(); c.moveTo(gx0, ys); c.lineTo(gx1, ys); c.stroke(); c.setLineDash([]);
    c.font = FONT(800, 12); c.fillStyle = '#ffe28f'; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(`${sing.st}`, gx0 + 4, ys + 14); c.restore();
  }
  // the staircase: price after each step; each riser is drawn in the colour of its bar
  const pts = gRows.map((r, i) => ({ x: xs[i], y: r._u ? yOf(r._d) : null, r }));
  c.lineWidth = 3.2;
  for (let i = 0; i < N_; i++) {
    const p = pts[i]; if (p.y === null) break;
    const nx = pts[i + 1] && pts[i + 1].y !== null ? pts[i + 1].x : p.x + Math.min(step * 0.45, 26);
    c.strokeStyle = COL[p.r.kind][0]; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(nx, p.y); c.stroke();
    if (i > 0) { const q = pts[i - 1]; c.save(); c.globalAlpha = p.r._p; c.strokeStyle = COL[p.r.kind][0]; c.beginPath(); c.moveTo(p.x, q.y); c.lineTo(p.x, p.y); c.stroke(); c.restore(); }
  }
  pts.forEach((p, i) => {
    c.font = FONT(700, 12); c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillStyle = p.y === null ? '#646C84' : '#C6CDE0';
    c.fillText(gRows[i].xl ?? gRows[i].st, p.x, gy1 + 16, Math.max(40, step - 4));
    if (p.y === null) return;
    c.save(); c.globalAlpha = i ? p.r._p : 1; c.shadowColor = COL[p.r.kind][0]; c.shadowBlur = i && p.r._p < 1 ? 12 : 0;
    c.beginPath(); c.arc(p.x, p.y, 5.5, 0, Math.PI * 2); c.fillStyle = COL[p.r.kind][1]; c.fill(); c.lineWidth = 2; c.strokeStyle = '#fff'; c.stroke(); c.restore();
  });
  c.restore();
}

// --- shell, secrets and controls (all state and helpers are above) ----------------------------------------------
const lab = shell({ key: 'price-tag', T, topics: TOPICS, views: ['up', 'back', 'chain'], onLang: () => render(), onView: () => { kick(); render(); } });
const secret = secretLab('price-tag', () => ({
  secrets: [{ emo: '↩️', title: T[lang].secrets.undo[0], desc: T[lang].secrets.undo[1] }, { emo: '🧾', title: T[lang].secrets.vat[0], desc: T[lang].secrets.vat[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="s1">
    <div id="s1pred"><p class="pt-q" id="s1q"></p><div class="pt-opts" id="s1opts"></div></div>
    <div class="pt-sl" id="s1sl"><span class="pt-lbl" id="xl"></span><input class="big" type="range" id="xs" min="10" max="50" step="5" style="--track:linear-gradient(90deg,#5fd0a5,#e0b050,#ff7b6b)"><b class="pt-v" id="xv"></b></div>
    <div class="pt-row" id="s1again"><button class="chip" data-act="again1" id="again1"></button></div>
    <div id="undoBox"><div class="pt-sl"><span class="pt-lbl" id="ul"></span><input class="big" type="range" id="us" min="5" max="60" step="5" style="--track:linear-gradient(90deg,#5fd0a5,#7cf0c0)"><b class="pt-v" id="uv"></b></div></div>
    <div id="vatBox">
      <div class="pt-sl"><span class="pt-lbl" id="gl"></span><input class="big" type="range" id="gs" min="40" max="300" step="10" style="--track:linear-gradient(90deg,#a9bde8,#5b74aa)"><b class="pt-v" id="gv"></b></div>
      <div class="pt-sl"><span class="pt-lbl" id="rl"></span><input class="big" type="range" id="rs" min="5" max="30" step="1" style="--track:linear-gradient(90deg,#ffe28f,#d89a1d)"><b class="pt-v" id="rv"></b></div>
    </div>
    <div class="pt-row pt-secs" id="secRow"></div>
  </div>
  <div id="s2">
    <p class="pt-q" id="s2q"></p>
    <div class="pt-row"><span class="pt-lbl" id="s2l"></span><input class="pt-in" id="gi" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn pt-push" id="mainBtn"></button></div>
  </div>
  <div id="s3">
    <div id="s3pred"><p class="pt-q" id="s3q"></p><div class="pt-opts" id="s3opts"></div></div>
    <div id="s3try">
      <div class="pt-row" style="margin-top:0"><span class="pt-lbl" id="s3tl"></span></div>
      <div class="pt-row"><span class="pt-lbl" id="s3rl"></span><div class="chips" id="pChips"></div></div>
      <div class="pt-row"><span class="pt-lbl" id="s3nl"></span><div class="chips" id="nChips"></div></div>
    </div>
  </div>`;

function kick() { S.kick = now(); }
// on a phone the controls sit below the picture: bring the reveal into view
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const optBtn = (id, label, st, cls = '') => `<button class="pt-opt ${cls}" data-act="pick" data-a="${id}"${st ? ' disabled' : ''}>${esc(label)}</button>`;

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'pick') {
    const a = b.dataset.a;
    if (v === 'up' && !S.rev1) { S.rev1 = true; S.at1 = { x: S.x, g: a }; S.t0 = now(); kick(); (a === 'less' ? sfx.good : sfx.bad)(); showStage(); }
    else if (v === 'chain' && !S.rev3) { S.rev3 = true; S.at3 = { n: S.n, p: S.p, g: a }; S.t0 = now(); kick(); (a === 'chain' ? sfx.good : sfx.bad)(); showStage(); }
  } else if (act === 'again1') { S.rev1 = false; S.at1 = null; S.t0 = -1e9; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; if (S.sec === 'undo') S.u = DOWN; S.t0 = now(); kick(); sfx.click();
  } else if (act === 'setp') { S.p = +b.dataset.v; S.t0 = -1e9; kick(); sfx.tick(); }
  else if (act === 'setn') { S.n = +b.dataset.v; S.t0 = -1e9; kick(); sfx.tick(); }
  render();
});
const bindRange = (id, key, after) => $(id).addEventListener('input', () => { S[key] = +$(id).value; kick(); sfx.tick(); after?.(); render(); });
bindRange('xs', 'x'); bindRange('us', 'u'); bindRange('gs', 'gross'); bindRange('rs', 'vat');
$('gi').addEventListener('input', () => { S.guess = $('gi').value; render(); });
$('gi').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); mainBtn(); render(); } });
$('mainBtn').addEventListener('click', () => { mainBtn(); render(); });
function mainBtn() { // view 2: check, next, again
  if (S.ti >= TASKS.length) { S.ti = 0; S.right = []; S.guess = ''; S.checked = false; sfx.click(); return; }
  if (!S.checked) {
    const g = parseG(); if (g === null) return;
    const ok = Math.abs(g - TASKS[S.ti].o) <= 0.005; S.right[S.ti] = ok; S.checked = true; S.t0 = now(); kick(); (ok ? sfx.good : sfx.bad)(); showStage();
  } else { S.ti++; S.guess = ''; S.checked = false; S.t0 = -1e9; sfx.click(); }
}

// --- one render per change: controls, readout and the state card ---------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('s1').hidden = v !== 'up'; $('s2').hidden = v !== 'back'; $('s3').hidden = v !== 'chain';
  if (v === 'up') renderUp(t); else if (v === 'back') renderBack(t); else renderChain(t);
}

function renderUp(t) {
  const u = t.up, open = secret.unlocked(), x = S.x / 100, sec = S.sec;
  lab.setGlow('rgba(95, 208, 165, .24)');
  $('s1pred').hidden = !!sec || (S.rev1 && S.at1.x !== S.x); $('s1sl').hidden = !!sec; $('s1again').hidden = !!sec || !S.rev1;
  $('undoBox').hidden = sec !== 'undo'; $('vatBox').hidden = sec !== 'vat';
  $('xl').textContent = u.xl; $('xs').value = S.x; $('xv').textContent = pct(S.x);
  $('ul').textContent = t.und.ul; $('us').value = S.u; $('uv').textContent = '+' + pct(S.u);
  $('gl').textContent = t.vat.gl; $('gs').value = S.gross; $('gv').textContent = N(S.gross);
  $('rl').textContent = t.vat.rl; $('rs').value = S.vat; $('rv').textContent = pct(S.vat);
  $('again1').textContent = u.again;
  $('s1q').textContent = u.q(S.x);
  $('s1opts').innerHTML = ['more', 'same', 'less'].map((k) => optBtn(k, u.opts[k], S.rev1, S.rev1 ? (k === 'less' ? 'good' : S.at1.g === k ? 'bad' : 'dim') : '')).join('');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('undo', '↩️') + sc('vat', '🧾');
  if (sec === 'undo') {
    const f = (1 - DOWN / 100) * (1 + S.u / 100), p2 = 80 * (1 + S.u / 100), win = Math.abs(f - 1) < 1e-9;
    lab.setReadout(N(p2), t.und.l(S.u, f), win ? '✓ ×1' : '', '#7cf0c0');
    lab.setState({ emo: win ? '🎯' : '↩️', title: win ? t.und.win : t.und.t(DOWN, S.u), lead: t.und.l(S.u, f), body: win ? t.und.bw(DOWN, 80) : t.und.b0 });
    lab.setFacts([]); return;
  }
  if (sec === 'vat') {
    const r = S.vat / 100, n = S.gross / (1 + r), tx = S.gross - n;
    lab.setReadout(N(n), `${N(S.gross)} ÷ ${F(1 + r)}`, t.vat.pill(tx), '#ffe28f');
    lab.setState({ emo: '🧾', title: t.vat.t(S.gross, n), lead: t.vat.l(S.gross, 1 + r, n), body: t.vat.b(tx, S.vat, n, S.gross) });
    lab.setFacts([]); return;
  }
  const p1 = 100 * (1 + x), p2 = p1 * (1 - x), d = p2 - 100, fs = `${X(1 + x)} × ${F(1 - x)} = ${X((1 + x) * (1 - x))}`;
  lab.setFacts(t.facts.up);
  if (!S.rev1) {
    lab.setReadout('100', `+${pct(S.x)} / −${pct(S.x)}`, '', '#5fd0a5');
    lab.setState({ emo: '🏷️', title: u.t0, lead: u.l0, body: u.b0 });
  } else if (S.at1.x === S.x) {
    const ok = S.at1.g === 'less';
    lab.setReadout(N(p2), fs, u.vs(d), '#5fd0a5');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? u.ok(p2) : u.no(p2), lead: fs, body: u.b(S.x, p1, d) });
  } else {
    lab.setReadout(N(p2), fs, u.vs(d), '#5fd0a5');
    lab.setState({ emo: '🏷️', title: u.neutral(p1, p2), lead: fs, body: u.b(S.x, p1, d) });
  }
}

function renderBack(t) {
  const b = t.back, end = S.ti >= TASKS.length, k = TASKS[Math.min(S.ti, TASKS.length - 1)], f = 1 + k.dir * k.p / 100, g = parseG(), nOk = S.right.filter(Boolean).length;
  lab.setGlow('rgba(169, 189, 232, .24)');
  lab.setFacts(t.facts.back);
  $('s2q').textContent = end ? b.end(nOk) : (k.dir < 0 ? b.qDown(k.p, k.e) : b.qUp(k.p, k.e));
  $('s2l').textContent = b.label;
  const gi = $('gi'); if (gi.value !== S.guess) gi.value = S.guess;
  gi.disabled = S.checked || end; gi.hidden = end; $('s2l').hidden = end;
  gi.setAttribute('aria-label', b.label);
  $('mainBtn').textContent = end ? b.again : S.checked ? b.next : b.check;
  $('mainBtn').disabled = !end && !S.checked && g === null;
  const dots = TASKS.map((_, i) => (i < S.ti ? '●' : i === S.ti ? '◉' : '○')).join(' ');
  if (end) {
    lab.setReadout(`${nOk}/${TASKS.length}`, dots, '', '#a9bde8');
    lab.setState({ emo: '🏆', title: b.end(nOk), lead: b.endLead, body: '' }); return;
  }
  const sign = k.dir > 0 ? '+' : '−';
  if (!S.checked) {
    lab.setReadout('?', `${sign}${pct(k.p)} → ${N(k.e)}`, '', '#a9bde8');
    lab.setState({ emo: '❓', title: k.dir < 0 ? b.qDown(k.p, k.e) : b.qUp(k.p, k.e), lead: b.lead0, body: '' });
    return;
  }
  const ok = Math.abs(g - k.o) <= 0.005, common = Math.abs(g - k.e * (1 - k.dir * k.p / 100)) <= 0.005;
  lab.setReadout(N(k.o), `${N(k.e)} ÷ ${F(f)} = ${N(k.o)}`, ok ? t.right : '', '#a9bde8');
  const slip = b.slip(b.errLine(k.e, k.p, k.dir, k.e * (1 - k.dir * k.p / 100)));
  if (ok) lab.setState({ emo: '✅', title: b.ok(k.e, f, k.o), lead: b.leadOk, body: slip });
  else if (common) lab.setState({ emo: '🤔', title: b.no(g), lead: k.dir < 0 ? b.errDown(k.e, k.p, g) : b.errUp(k.e, k.p, g), body: b.body(k.e, f, k.o) });
  else lab.setState({ emo: '🤔', title: b.no(g), lead: b.wrong(g, f, g * f, k.e), body: `${b.body(k.e, f, k.o)} ${slip}` });
}

function renderChain(t) {
  const c3 = t.chain, n = S.n, p = S.p, f1 = 1 + p / 100, chain = 100 * f1 ** n, single = 100 * (1 + n * p / 100), d = chain - single;
  lab.setGlow('rgba(255, 226, 143, .22)');
  lab.setFacts(t.facts.chain);
  const fresh = !S.rev3, same = S.rev3 && S.at3.n === n && S.at3.p === p;
  $('s3pred').hidden = !fresh && !same; $('s3try').hidden = fresh;
  $('s3q').textContent = c3.q(n, p);
  $('s3opts').innerHTML = ['chain', 'single', 'same'].map((k) => optBtn(k, c3.opts[k](n, p), S.rev3, S.rev3 ? (k === 'chain' ? 'good' : S.at3.g === k ? 'bad' : 'dim') : '')).join('');
  $('s3tl').textContent = c3.try; $('s3rl').textContent = c3.rl; $('s3nl').textContent = c3.nl;
  $('pChips').innerHTML = PS.map((q) => `<button class="chip ${q === p ? 'on' : ''}" data-act="setp" data-v="${q}">${esc(pct(q))}</button>`).join('');
  $('nChips').innerHTML = NS.map((q) => `<button class="chip ${q === n ? 'on' : ''}" data-act="setn" data-v="${q}">${q}</button>`).join('');
  if (fresh) {
    lab.setReadout('100', `${n} × (+${pct(p)}) / +${pct(n * p)}`, '', '#ffe28f');
    lab.setState({ emo: '🔗', title: c3.t0, lead: c3.l0, body: '' }); return;
  }
  const chainStr = ['×' + N(f1, 4)].concat(Array(n - 1).fill(N(f1, 4))).join(' × ');
  lab.setReadout(N(chain), `${t.vs} ${N(single)}`, `${X(f1 ** n)} ${t.vs} ${X(1 + n * p / 100)}`, '#ffe28f');
  const ok = same && S.at3.g === 'chain';
  lab.setState({ emo: same ? (ok ? '✅' : '🤔') : '🔗', title: same ? (ok ? c3.ok(chain, single) : c3.no(chain, single)) : c3.neutral(chain, single), lead: c3.lead(chainStr, n * p, f1 ** n, 1 + n * p / 100), body: c3.b(d) });
}
canvasLoop($('cv'), drawScene);
render();
</script>
