    setHTML($('cbN'), `<div class="on-row">${modeBtns}</div><div class="on-row">${sd.checked ? `<button class="on-btn main" data-act="again">${esc(t.so.again)}</button>`
      : `<button class="on-btn" data-act="undo"${sd.ans.length ? '' : ' disabled'}>${esc(t.so.undo)}</button><button class="on-btn main" data-act="open"${done ? '' : ' disabled'}>${esc(t.so.open)}</button>`}</div>`);
    renderSort(t);
    return;
  }
  setHTML($('cbN'), `<div class="on-row">${modeBtns}</div><div class="on-row"><button class="on-hold">${esc(n.hold)}</button><span class="on-hint">${esc(n.holdHint)}</span></div>`);
  const a = S.act, k = a ? KEYS.indexOf(a.k) : -1;
  if (S.hold) lab.setState({ emo: '🫁', title: n.holdT, lead: n.holdL, body: '', extra: '' });
  else if (a) lab.setState({ emo: EMO[k], title: n.acts[k], lead: n.fills[k], body: '', extra: '' });
  else if (g[KEYS[li]] < .42) lab.setState({ emo: EMO[li], title: n.lowT[li], lead: n.lowL[li], body: n.lowB, extra: '' });
  else lab.setState({ emo: '🔋', title: n.idleT, lead: n.idleL, body: '', extra: '' });
  lab.setFacts(t.facts.needs);
}
function renderSort(t) {
  const so = t.so, sd = S.sort, n = sd.ans.length;
  if (!sd.checked) {
    const c = CARDS[n];
    sortEl.innerHTML = `<div class="on-sq">${esc(so.q)}</div>${c ? `<div class="on-cur"><span class="e">${c[1]}</span><b>${esc(so.cards[c[0]])}</b></div>` : `<div class="on-cur" style="animation:none"><span class="e">🧺</span><b>${n} / 9</b></div>`}
      <div class="on-bks">${t.baskets.map((b, i) => `<button class="on-bk b${i}" data-b="${i}"${c ? '' : ' disabled'}><span class="e">${i ? '🧸' : '🍎'}</span>${esc(b)}</button>`).join('')}</div>
      <div class="on-dots">${CARDS.map((_, i) => `<i class="${i < n ? 'on' : ''} ${i === n ? 'cur' : ''}"></i>`).join('')}</div>`;
    lab.setState({ emo: '🧺', title: so.q, lead: so.lead, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const wrong = CARDS.filter((c, i) => sd.ans[i] !== (c[2] ? 0 : 1)), right = 9 - wrong.length;
  const col = (b) => CARDS.map((c, i) => [c, i]).filter(([c]) => (c[2] ? 0 : 1) === b).map(([c, i]) => `<span class="on-chip ${sd.ans[i] !== b ? 'mv' : ''}" style="--d:${.2 + i * .12}s">${c[1]} ${esc(so.cards[c[0]])}</span>`).join('');
  sortEl.innerHTML = `<div class="on-sq">${right === 9 ? esc(VD()) : esc(so.score(right))}</div>
    <div class="on-res"><div class="on-col c0"><h4>🍎 ${esc(t.baskets[0])}</h4><div class="on-chips">${col(0)}</div></div><div class="on-col c1"><h4>🧸 ${esc(t.baskets[1])}</h4><div class="on-chips">${col(1)}</div></div></div>`;
  const why = wrong.map((c) => `<div class="on-why"><span>${c[1]}</span><span><b>${esc(so.cards[c[0]])}.</b> ${esc(so.why[c[0]])}</span></div>`).join('');
  lab.setState(right === 9 ? { emo: '🎉', title: VD(), lead: so.score(9), body: so.allL, extra: '' }
    : { emo: '🧺', title: so.score(right), lead: so.moved, body: so.allL, extra: why });
  lab.setFacts(t.facts.needs);
}
function renderDay(t, g, li) {
  lab.setGlow('rgba(95,150,220,.28)');
  const d = t.dy, P = S.plan, plan = S.dayState === 'plan', has = (id) => SK.some((k) => P[k].includes(id)), bed = has('bed21') || has('bed23');
  const used = new Set(SK.flatMap((k) => P[k]));
  S.dayEv = []; SK.forEach((k) => P[k].forEach((id, i) => S.dayEv.push({ e: DC.find((x) => x[0] === id)[1], t: id === 'school' ? 9 : id === 'bed21' ? 21 : id === 'bed23' ? 22 : SLOT_T[k] + .45 * i, row: id === 'school' ? 1 : i % 2 })));
  const res = S.dayRes, opts = ['full', 'ok', 'worn'].map((k) => `<button class="on-btn ${res ? (k === res ? 'good' : S.guess === k ? 'mine' : '') : S.guess === k ? 'on' : ''}" data-act="guess" data-k="${k}"${plan ? '' : ' disabled'}>${esc(d.po[k])}</button>`).join('');
  const slots = SK.map((k, i) => `<div class="on-slot ${S.sel && plan ? 'hot' : ''}" data-s="${k}" data-act="slot"><div class="tm"><b>${esc(d.slots[i][1])}</b>${esc(d.slots[i][0])}</div><div class="in">${P[k].map((id) => `<button class="on-pc ${plan ? '' : 'lock'}" ${plan ? `data-act="unplace" data-id="${id}"` : 'tabindex="-1"'}>${DC.find((x) => x[0] === id)[1]} ${esc(d.cards[id])}</button>`).join('')}</div></div>`).join('');
  const tray = DC.filter((x) => !used.has(x[0])).map((x) => `<div class="on-card ${S.sel === x[0] ? 'sel' : ''}" data-id="${x[0]}"><span class="e">${x[1]}</span>${esc(d.cards[x[0]])}</div>`).join('');
  const ready = S.guess !== null && bed;
  setHTML($('cbD'), `<div class="on-pq"><div class="on-q">${esc(d.pq)}</div><div class="on-row">${opts}</div></div><div class="on-slots">${slots}</div>
    ${plan ? `<div class="on-tray">${tray}</div><div class="on-hint" style="margin-top:8px">${esc(S.sel ? d.sel(d.cards[S.sel]) : d.hint)}</div>` : ''}
    <div class="on-row" style="margin-top:12px">${plan ? `<button class="on-btn main" data-act="live"${ready ? '' : ' disabled'}>${esc(d.live)}</button>${ready ? '' : `<span class="on-hint">${esc(d.need)}</span>`}`
      : S.dayState === 'play' ? `<button class="on-btn" disabled>${esc(d.running)}</button>` : `<button class="on-btn main" data-act="replan">${esc(d.again)}</button>`}</div>`);
  if (S.dayState === 'play') lab.setState({ emo: '🕖', title: d.playT, lead: d.playL, body: '', extra: '' });
  else if (res) {
    const ok = S.guess === res, vd = VD();
    lab.setState({ emo: ok ? '🎉' : '🤔', title: ok ? vd : d.wrong, lead: d.at(d.res[res]), body: `${d.lowN(t.gauges[S.sim.low])} ${d.tips[S.sim.low]}`, extra: '' });
  } else lab.setState({ emo: '🗓️', title: d.planT, lead: d.planL, body: '', extra: '' });
  lab.setFacts(t.facts.day);
}
function renderWeek(t) {
  lab.setGlow('rgba(120,150,255,.3)');
  const w = t.wk, a = w.ask;
  document.querySelectorAll('#wSl input').forEach((inp, i) => {
    const k = ['sleep', 'act', 'drinks'][i], val = S.sl[k]; inp.value = val;
    $('wl' + i).textContent = w.sl[i]; $('wv' + i).textContent = [w.fs, w.fa, w.fd][i](val); $('wb' + i).textContent = '✓ ' + w.bands[i];
  });
  $('wSrc').textContent = w.src;
  setHTML($('wRec'), S.wkAns === null ? '' : `<span>${esc(w.guess)}</span> ${a.opts.map((o, i) => `<span class="on-btn ${i === a.ok ? 'good' : i === S.wkAns ? 'mine' : ''}" style="min-height:30px;padding:3px 10px;font-size:12px">${esc(o)}</span>`).join('')}`);
  $('wSl').style.display = $('wSrc').style.display = S.wkAns === null ? 'none' : '';
  if (S.wkAns === null) {
    askEl.innerHTML = `<div class="q">${esc(a.q)}</div><div class="opts">${a.opts.map((o, i) => `<button class="on-btn" data-a="${i}">${esc(o)}</button>`).join('')}</div>`;
    lab.setState({ emo: '🤔', title: a.q, lead: '', body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (!S.wkMoved) {
    const ok = S.wkAns === a.ok, vd = VD();
    lab.setState({ emo: ok ? '🎉' : '🤔', title: ok ? vd : t.dy.wrong, lead: a.opts[a.ok] + '.', body: a.why, extra: `<div class="on-fine">${esc(w.body)}</div>` });
  } else {
    const sl = S.sl, st = sl.sleep < 9 ? w.st.sleep : sl.act < 60 ? w.st.act : sl.drinks > 1 ? w.st.drinks : w.st.ok;
    lab.setState({ emo: sl.sleep < 9 ? '😴' : sl.act < 60 ? '🏃' : sl.drinks > 1 ? '🥤' : '🌟', title: st[0], lead: st[1], body: w.body, extra: '' });
  }
  lab.setFacts(t.facts.week);
}
render();
</script>
