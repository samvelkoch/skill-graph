  h: { good: 'all', city: null },
};
const mode = () => S.sec || lab.view;
const lab = shell({ key: 'market-town', T, topics: TOPICS, views: ['where', 'market', 'free'], onLang: render, onView: () => { S.sec = null; render(); } });
const secret = secretLab('market-town', () => ({
  secrets: [{ emo: '🪙', title: T[lang].secrets.toll[0], desc: T[lang].secrets.toll[1] }, { emo: '⛵', title: T[lang].secrets.hansa[0], desc: T[lang].secrets.hansa[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `<div class="mt-ctrl">
  <div id="mtWhere">
    <div class="mt-q" id="mtWQ"></div>
    <div class="mt-flags" id="mtFlags"></div>
    <div class="mt-year" id="mtYearRow"><span id="mtYL"></span><input id="mtYr" type="range" min="1100" max="1350" step="1" value="1100"><button class="chip" id="mtPlay" data-act="play"></button></div>
    <div class="row2" id="mtWRow"><button class="chip" data-act="wagain" id="mtWAgain"></button></div>
  </div>
  <div id="mtMarket">
    <div class="mt-q" id="mtMQ"></div>
    <div class="mt-opts" id="mtMOpts"></div>
    <div class="row2" id="mtMRow"><div class="chips" id="mtSteps"></div><button class="chip" data-act="magain" id="mtMAgain"></button></div>
  </div>
  <div id="mtFree">
    <div class="mt-q" id="mtFQ"></div>
    <div class="mt-opts" id="mtFOpts"></div>
    <div class="row2"><button class="btn" data-act="run" id="mtRun"></button><button class="chip" data-act="charter" id="mtCh"></button><button class="chip" data-act="fagain" id="mtFAgain"></button></div>
    <div class="mt-cmp" id="mtCmp"></div>
  </div>
  <div id="mtToll">
    <div class="mt-year" style="margin-top:0"><span id="mtTL"></span><input id="mtTr" type="range" min="0" max="6" step="1" value="3"><b id="mtTV"></b></div>
    <div class="row2"><button class="chip" data-act="tnew" id="mtTNew"></button></div>
  </div>
  <div id="mtHansa"><div class="chips" id="mtGoods"></div></div>
  <div class="row2"><div class="chips" id="mtSecs"></div></div>
</div>`;

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const optsHtml = (list, pick, ok, act) => list.map((o, i) => {
  const cls = pick === null ? '' : i === ok ? 'good' : i === pick ? 'bad' : '';
  return `<button class="mt-opt ${cls}" data-act="${act}" data-i="${i}"${pick === null ? '' : ' disabled'}>${esc(o)}</button>`;
}).join('');

function pickWhere(i) { const w = S.w; w.pick = i; w.year = 1100; w.playing = true; w.st = -1; w.revT = performance.now() / 1000; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
function whereReadout(t) {
  const w = S.w;
  if (w.pick === null) { lab.setReadout('?', '', '', '#e0b050'); return; }
  const p = progW(), n = cartN(p);
  lab.setReadout(String(Math.round(w.year)), t.w.pop(fmtN(popAt(p))), `${'🛒'.repeat(Math.min(n, 6))} ${t.w.carts}`, '#e0b050');
  const yr = $('mtYr'); if (+yr.value !== Math.round(w.year) && document.activeElement !== yr) yr.value = Math.round(w.year);
}
function renderWhere(t) {
  const w = S.w, pred = w.pick === null, tw = t.w;
  lab.setGlow('rgba(224,176,80,.24)');
  $('mtWQ').textContent = tw.q;
  $('mtFlags').innerHTML = [0, 1, 2, 3].map((i) => {
    const cls = pred ? '' : i === 1 ? 'good' : i === w.pick ? 'bad' : '';
    return `<button class="mt-opt mt-flag ${cls}" data-act="pick" data-i="${i}"${pred ? '' : ' disabled'}><b>${'ABCD'[i]}</b> ${esc(t.sites[i])}</button>`;
  }).join('');
  $('mtYearRow').style.display = pred ? 'none' : ''; $('mtWRow').style.display = pred ? 'none' : '';
  $('mtYL').textContent = tw.year; $('mtPlay').textContent = w.playing ? tw.pause : tw.play; $('mtWAgain').textContent = tw.again;
  $('mtYr').value = Math.round(w.year);
  whereReadout(t);
  if (pred) lab.setState({ emo: '📍', title: tw.q, lead: tw.lead, body: '', extra: '' });
  else {
    const st = stageOf(progW()); w.st = st;
    lab.setState({ emo: tw.st[st][0], title: tw.st[st][1], lead: tw.st[st][2], body: `${w.pick === 1 ? t.right : t.nq} ${w.pick === 1 ? tw.ok : tw.bad}`, extra: '' });
  }
  lab.setFacts([{ emo: '🌉', text: t.facts.bridge, src: SRC.bridge }, { emo: '🏠', text: t.facts.peter, src: SRC.peter }]);
}
function marketReadout(t) { const m = S.m; if (m.pick === null) lab.setReadout('5', t.m.sub1, '', '#d9825f'); else lab.setReadout('📜', t.m.sub2, '', '#d9825f'); }
function renderMarket(t) {
  const m = S.m, tm = t.m, pred = m.pick === null;
  lab.setGlow('rgba(217,130,95,.24)');
  $('mtMQ').textContent = tm.q;
  $('mtMOpts').innerHTML = optsHtml(tm.opts, m.pick, tm.ok, 'mopt');
  $('mtMRow').style.display = pred ? 'none' : '';
  $('mtSteps').innerHTML = tm.steps.map(([e, n], i) => `<button class="chip ${m.step === i ? 'on' : ''}" data-act="step" data-i="${i}">${e} ${esc(n)}</button>`).join('');
  $('mtMAgain').textContent = tm.again;
  marketReadout(t);
  if (m.sel !== null) lab.setState({ emo: m.sel === 5 ? '⚖️' : SIGNS[m.sel], title: m.sel === 5 ? tm.scale : tm.stalls[m.sel], lead: pred ? tm.pre[m.sel] : tm.post[m.sel], body: '', extra: '' });
  else if (pred) lab.setState({ emo: '🧺', title: tm.q, lead: tm.lead, body: '', extra: '' });
  else if (m.step !== null) lab.setState({ emo: tm.steps[m.step][0], title: tm.steps[m.step][1], lead: tm.stepLead[m.step], body: '', extra: '' });
  else { const ok = m.pick === tm.ok; lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.nq, lead: ok ? tm.okT : tm.badT, body: '', extra: '' }); }
  lab.setFacts([{ emo: '🌲', text: t.facts.bark, src: SRC.bark }]);
}
function freeReadout() { const t = T[lang], f = S.f; lab.setReadout(String(f.days), t.f.sub, f.ph === 4 ? t.f.pill : '', '#6aa7e0'); }
function renderFree(t) {
  const f = S.f, tf = t.f;
  lab.setGlow('rgba(106,167,224,.26)');
  $('mtFQ').textContent = f.ph >= 2 ? tf.q : '';
  $('mtFQ').style.display = f.ph >= 2 ? '' : 'none';
  $('mtFOpts').innerHTML = f.ph >= 2 ? optsHtml(tf.opts, f.ph === 4 ? f.pick : null, tf.ok, 'fopt').replace(/ disabled/g, f.ph === 4 ? ' disabled' : '') : '';
  if (f.ph === 3) $('mtFOpts').querySelectorAll('button').forEach((b) => { b.disabled = true; if (+b.dataset.i === f.pick) b.classList.add('on'); });
  $('mtRun').textContent = tf.run; $('mtRun').style.display = f.ph === 0 ? '' : 'none';
  $('mtCh').textContent = tf.charter; $('mtCh').classList.toggle('on', f.charter);
  $('mtFAgain').textContent = tf.again; $('mtFAgain').style.display = f.ph === 4 ? '' : 'none';
  $('mtCmp').innerHTML = `<div><b>🌾 ${esc(tf.vil)}</b>${tf.vL.map((x) => `<p>• ${esc(x)}</p>`).join('')}</div><div><b>🏘️ ${esc(tf.town)}</b>${tf.tL.map((x) => `<p>• ${esc(x)}</p>`).join('')}</div>`;
  freeReadout();
  let st;
  if (f.charter) st = { emo: '📜', title: tf.charterT[0], lead: tf.charterT[1], body: '' };
  else if (f.ph === 0) st = { emo: tf.s0[0], title: tf.s0[1], lead: tf.s0[2], body: '' };
  else if (f.ph === 1) st = { emo: tf.s1[0], title: tf.s1[1], lead: tf.s1[2], body: '' };
  else if (f.ph === 2) st = { emo: '🤔', title: tf.q, lead: tf.lead2, body: '' };
  else if (f.ph === 3) st = { emo: tf.s3[0], title: tf.s3[1], lead: tf.s3[2], body: '' };
  else { const ok = f.pick === tf.ok; st = { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.nq, lead: tf.lead4, body: ok ? tf.okT : tf.badT }; }
  lab.setState({ ...st, extra: '' });
  lab.setFacts(f.ph === 4 ? [{ emo: '🏙️', text: t.facts.stad, src: SRC.stad }, { emo: '🌲', text: t.facts.bark, src: SRC.bark }] : [{ emo: '🌲', text: t.facts.bark, src: SRC.bark }]);
}
function tollReadout() {
  const t = T[lang].tl, tl = S.tl, n = tl.hist.length, paid = tl.hist.filter(Boolean).length;
  lab.setReadout(`🪙 ${tl.toll}`, t.sub(paid, n), t.pill(Math.round(tl.wall * 100)), '#e0b050');
}
function renderToll(t) {
  const tl = S.tl, tt = t.tl;
  lab.setGlow('rgba(224,176,80,.26)');
  $('mtTL').textContent = tt.label; $('mtTV').textContent = `🪙 ${tl.toll}`; $('mtTr').value = tl.toll; $('mtTNew').textContent = tt.reset;
  tollReadout();
  const s = tl.toll === 0 ? 0 : tl.toll <= 2 ? 1 : tl.toll === 3 ? 2 : tl.toll <= 5 ? 3 : 4;
  lab.setState({ emo: '🪙', title: tt.title, lead: tt.s[s], body: tl.wall >= 1 ? tt.done : '', extra: '' });
  lab.setFacts([{ emo: '🌉', text: t.facts.bridge, src: SRC.bridge }]);
}
function renderHansa(t) {
  const h = S.h, th = t.h;
  lab.setGlow('rgba(78,168,255,.28)');
  $('mtGoods').innerHTML = ['all', 'furs', 'wax', 'wool', 'salt', 'fish'].map((k) => `<button class="chip ${h.good === k ? 'on' : ''}" data-act="good" data-k="${k}">${k === 'all' ? esc(th.all) : `${GOODEMO[k]} ${esc(th.goods[k])}`}</button>`).join('');
  lab.setReadout('⛵', th.sub, h.good === 'all' ? '' : `${GOODEMO[h.good]} ${th.goods[h.good]}`, '#4ea8ff');
  if (h.city !== null) lab.setState({ emo: '🏙️', title: th.cities[h.city], lead: th.cityInfo[h.city], body: h.good !== 'all' ? th.goodInfo[h.good] : '', extra: '' });
  else if (h.good !== 'all') lab.setState({ emo: GOODEMO[h.good], title: th.goods[h.good], lead: th.goodInfo[h.good], body: '', extra: '' });
  else lab.setState({ emo: '⛵', title: th.def[0], lead: th.def[1], body: '', extra: '' });
  lab.setFacts([{ emo: '🏠', text: t.facts.peter, src: SRC.peter }]);
}
function render() {
  const t = T[lang], md = mode();
  [['where', 'mtWhere'], ['market', 'mtMarket'], ['free', 'mtFree'], ['toll', 'mtToll'], ['hansa', 'mtHansa']].forEach(([k, id]) => { $(id).style.display = md === k ? '' : 'none'; });
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('mtSecs').innerHTML = sc('toll', '🪙') + sc('hansa', '⛵');
  if (md === 'where') renderWhere(t); else if (md === 'market') renderMarket(t); else if (md === 'free') renderFree(t); else if (md === 'toll') renderToll(t); else renderHansa(t);
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'pick') pickWhere(i);
  else if (a === 'play') { const w = S.w; if (w.year >= 1350) w.year = 1100; w.playing = !w.playing; w.st = -1; sfx.click(); }
  else if (a === 'wagain') { S.w = { pick: null, year: 1100, playing: false, st: -1, revT: 0 }; sfx.click(); }
  else if (a === 'mopt') { const m = S.m; m.pick = i; m.t = 0; m.sel = null; m.step = null; m.stage = 0; m.tokX = STAGEX[0]; (i === T[lang].m.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'step') { S.m.step = i; S.m.stage = i; S.m.sel = null; sfx.click(); }
  else if (a === 'magain') { S.m = { pick: null, sel: null, step: null, t: 0, stage: 0, tokX: STAGEX[0] }; sfx.click(); }
  else if (a === 'run') { S.f.ph = 1; S.f.t = 0; sfx.push(); showStage(); }
  else if (a === 'fopt') { S.f.pick = i; S.f.ph = 3; S.f.t = 0; S.f.days = 0; sfx.click(); showStage(); }
  else if (a === 'charter') { S.f.charter = !S.f.charter; sfx.click(); }
  else if (a === 'fagain') { S.f = { ph: 0, t: 0, days: 0, charter: false, cT: 0, pick: null, conf: [] }; sfx.click(); }
  else if (a === 'tnew') { Object.assign(S.tl, { wall: 0, fin: false, carts: [], hist: [], coins: [], k: 0, spawn: 0, m: 0.5 }); sfx.click(); }
  else if (a === 'good') { S.h.good = b.dataset.k; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'toll') Object.assign(S.tl, { toll: 3, wall: 0, fin: false, carts: [], hist: [], coins: [], k: 0, spawn: 0, m: 0.5 }); else Object.assign(S.h, { good: 'all', city: null }); showStage(); }
    sfx.click();
  }
  render();
});
$('mtYr').addEventListener('input', () => { S.w.year = +$('mtYr').value; S.w.playing = false; S.w.st = -1; render(); });
$('mtTr').addEventListener('input', () => { S.tl.toll = +$('mtTr').value; sfx.tick(); render(); });

$('cv').addEventListener('pointerdown', (ev) => {
  const md = mode(), [vx, vy] = toV(ev);
  if (md === 'where' && S.w.pick === null) {
    let best = -1, bd = 1e9;
    FLAGS.forEach((f, i) => { const d = Math.hypot(SX(f.x) - (ev.clientX - $('cv').getBoundingClientRect().left), SY(f.y - 14) - (ev.clientY - $('cv').getBoundingClientRect().top)); if (d < bd) { bd = d; best = i; } });
    if (best >= 0 && bd < 34) { pickWhere(best); render(); }
  } else if (md === 'market') {
    let sel = null;
    STX.forEach((x, i) => { if (Math.abs(vx - x) < 28 && vy > 74 && vy < 158) sel = i; });
    if (Math.hypot(vx - 160, vy - 190) < 28 && vy > 168) sel = 5;
    if (sel !== null) { S.m.sel = sel; S.m.step = null; sfx.tick(); render(); }
    else if (S.m.pick !== null && vy > 214) { STAGEX.forEach((x, i) => { if (Math.abs(vx - x) < 40) { S.m.stage = i; S.m.step = i; S.m.sel = null; sfx.click(); render(); } }); }
  } else if (md === 'hansa') {
    const r = $('cv').getBoundingClientRect();
    let best = -1, bd = 1e9;
    CITY.forEach(([x, y], i) => { const d = Math.hypot(SX(x) - (ev.clientX - r.left), SY(y) - (ev.clientY - r.top)); if (d < bd) { bd = d; best = i; } });
    S.h.city = bd < 30 ? best : null; if (bd < 30) sfx.tick(); render();
  }
});

canvasLoop($('cv'), (c, w, h, dt, t) => {
  CW = w; CH = h;
  const md = mode();
  if (md === 'where') drawWhere(c, dt, t); else if (md === 'market') drawMarket(c, dt, t); else if (md === 'free') drawFree(c, dt, t); else if (md === 'toll') drawToll(c, dt, t); else drawHansa(c, dt, t);
});
render();
</script>
</body>
</html>
