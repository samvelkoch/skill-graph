  if (Math.abs(S.pay.year - S.pay.shown) < .05) S.pay.shown = S.pay.year;
  S.roads.shown += (S.roads.day - S.roads.shown) * (1 - Math.exp(-dt * 8));
  drawBase(c, w, h, base);
  c.save(); c.beginPath(); c.rect(0, 0, w, mh); c.clip();
  if (v === 'rule') sceneRule(c, w, h, t, dt); else if (v === 'pay') scenePay(c, w, h, t); else sceneRoads(c, w, h, t);
  if (S.sec === 'word') sceneWord(c, w, h, t);
  c.restore();
  const tt = T[lang];
  if (v === 'rule') {
    legend(c, w, h, tt.horde);
    const d = S.rule.guess !== null; timeline(c, w, d, d ? [1328, 1331] : null, null);
  } else if (v === 'pay') {
    legend(c, w, h, tt.horde);
    const d = S.pay.guess !== null; timeline(c, w, d, null, S.pay.shown);
    if (d) pill(c, String(Math.round(S.pay.shown)), w - 12, 20, { align: 'right', fs: 15, color: '#f4c542' });
  } else {
    legend(c, w, h, tt.horde);
    if (S.roads.guess !== null) stageStrip(c, w, S.roads.shown);
  }
}

// --- controls -------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function predHTML(vk, v) {
  const g = S[vk].guess, done = g !== null;
  return `<p class="hr-q">${esc(v.q)}</p><div class="hr-opts">${v.opts.map((o, i) => `<button class="hr-opt ${done ? (i === v.ok ? 'good' : i === g ? 'bad' : 'dim') : ''}" data-pred="${vk}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.pred) {
    const vk = b.dataset.pred, i = +b.dataset.i, ok = T[lang][vk === 'rule' ? 'v1' : vk === 'pay' ? 'v2' : 'v3'].ok;
    S[vk].guess = i; (i === ok ? sfx.good : sfx.bad)();
    if (vk === 'rule') S.rule.t0 = now();
    showStage(); render(); return;
  }
  const a = b.dataset.act; if (!a) return;
  if (a === 'again') { S.rule.t0 = now(); S.rule.sel = null; sfx.click(); showStage(); }
  else if (a === 'year') { S.pay.year = +b.dataset.y; sfx.tick(); }
  else if (a === 'post') { S.roads.act = { kind: 'post', key: b.dataset.k }; S.roads.actT = now(); sfx.tick(); }
  else if (a === 'good') { const k = b.dataset.k; S.roads.act = S.roads.act?.key === k ? null : { kind: 'good', key: k }; S.roads.actT = now(); sfx.tick(); }
  else if (a === 'plague') { S.roads.act = S.roads.act?.kind === 'plague' ? null : { kind: 'plague', key: 'plague' }; S.roads.actT = now(); sfx.click(); }
  else if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (k === 'polo') { if (lab.view !== 'roads') $('views').querySelector('[data-view="roads"]')?.click(); S.sec = S.sec === 'polo' ? null : 'polo'; }
    else S.sec = S.sec === 'word' ? null : 'word';
    sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'hrYear') { S.pay.year = +ev.target.value; renderPay(T[lang], true); secState(T[lang]); }
  else if (ev.target.id === 'hrDay') { S.roads.day = +ev.target.value / 1000 * SUM; renderRoads(T[lang], true); secState(T[lang]); }
});
$('cv').addEventListener('pointerup', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  let best = null, bd = 28;
  for (const h of HIT) { const d = Math.hypot(h.x - x, h.y - y); if (d < bd) { bd = d; best = h; } }
  if (!best) return;
  if (lab.view === 'rule' && S.rule.guess !== null && T[lang].v1.info[best.key]) { S.rule.sel = S.rule.sel === best.key ? null : best.key; sfx.tick(); render(); }
  else if (lab.view === 'roads' && (best.key === 'kaffa' || best.key === 'tana')) { S.roads.act = { kind: 'post', key: best.key }; S.roads.actT = now(); sfx.tick(); render(); }
});

// --- render: controls, readout and state card for the current view ---------------------------------------------
function render() {
  const t = T[lang], v = lab.view; document.body.dataset.v = v;
  for (const k of ['rule', 'pay', 'roads']) $('hr-' + k).hidden = v !== k;
  const unlocked = secret.unlocked();
  $('hrSec').innerHTML = [['polo', '🧭'], ['word', '📜']].map(([k, e]) => `<button class="chip secret ${unlocked ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${unlocked ? `${e} ${esc(t.secrets[k][0])}` : t.lockedSec}</button>`).join('');
  if (v === 'rule') renderRule(t); else if (v === 'pay') renderPay(t); else renderRoads(t);
  secState(t);
}
function secState(t) { // a secret experiment replaces the state card while it is on
  if (S.sec === 'polo' && lab.view === 'roads') lab.setState({ emo: '🧭', title: t.polo[0], lead: t.polo[1], body: '', extra: '' });
  else if (S.sec === 'word') lab.setState({ emo: '📜', title: t.word[0], lead: t.word[1], body: '', extra: '' });
}
function verdict(vk, text, ok) { return `<div class="hr-verdict ${S[vk].guess === ok ? 'good' : 'bad'}">${esc(text)}</div>`; }
function renderRule(t) {
  const s = S.rule, v = t.v1, done = s.guess !== null;
  lab.setGlow('rgba(244, 197, 66, .24)');
  $('hr-rule').innerHTML = predHTML('rule', v) + (done ? verdict('rule', s.guess === v.ok ? v.right : v.wrong, v.ok)
    + `<div class="row2"><button class="chip hr-chip" data-act="again">${esc(t.again)}</button></div><div class="hr-fine">${esc(t.tapTown)}</div>` : '');
  if (!done) {
    lab.setReadout('?', '', '', '#f4c542'); lab.setState({ emo: '🤔', title: v.pred[0], lead: v.pred[1], body: '', extra: '' }); lab.setFacts(t.facts.rulePre); return;
  }
  lab.setReadout(v.val, v.sub, v.pill, '#f4c542');
  if (s.sel && v.info[s.sel]) lab.setState({ emo: '📍', title: t.places[s.sel], lead: v.info[s.sel], body: '', extra: '' });
  else lab.setState({ emo: '📜', title: v.title, lead: v.lead, body: v.body, extra: '' });
  lab.setFacts(t.facts.rule);
}
function renderPay(t, light) {
  const s = S.pay, v = t.v2, done = s.guess !== null;
  lab.setGlow('rgba(95, 168, 160, .26)');
  if (!light) $('hr-pay').innerHTML = predHTML('pay', v) + (done ? verdict('pay', s.guess === v.ok ? v.right : v.wrong, v.ok)
    + `<div class="hr-ctl"><input type="range" class="big" id="hrYear" min="1245" max="1480" step="1" value="${s.year}" aria-label="year"></div>
       <div class="row2"><div class="chips" id="hrYChips"></div></div>
       <div class="hr-fine">${esc(t.legendPay)}</div>` : '');
  if (done) {
    $('hrYChips').innerHTML = YEARS.map((y) => `<button class="chip hr-chip ${s.year === y ? 'on' : ''}" data-act="year" data-y="${y}">${y}</button>`).join('');
    if (+$('hrYear').value !== s.year) $('hrYear').value = s.year;
  }
  if (!done) {
    lab.setReadout('?', '', '', '#5fa8a0'); lab.setState({ emo: '🤔', title: v.pred[0], lead: v.pred[1], body: '', extra: '' }); lab.setFacts([t.facts.pay[2]]); return;
  }
  const e = v.era[era(s.year)];
  lab.setReadout(String(s.year), e[1], v.pill, '#5fa8a0');
  lab.setState({ emo: ['🔴', '🤝', '👑', '⚔️', '🏁'][era(s.year)], title: e[0], lead: e[2], body: '', extra: '' });
  lab.setFacts(t.facts.pay);
}
function renderRoads(t, light) {
  const s = S.roads, v = t.v3, done = s.guess !== null;
  lab.setGlow('rgba(224, 176, 80, .24)');
  const goods = ['silk', 'spices', 'furs', 'salt', 'grain', 'slaves'];
  if (!light) $('hr-roads').innerHTML = predHTML('roads', v) + (done ? verdict('roads', s.guess === v.ok ? v.right(SUM, MONTHS) : v.wrong(SUM, MONTHS), v.ok)
    + `<div class="hr-ctl"><input type="range" class="big" id="hrDay" min="0" max="1000" step="1" value="${Math.round(s.day / SUM * 1000)}" aria-label="${esc(v.slide)}"></div>
       <div class="row2"><div class="chips" id="hrGoods"></div></div>
       <div class="hr-fine">${esc(v.hint)}</div>` : '');
  if (done) {
    $('hrGoods').innerHTML = ['kaffa', 'tana'].map((k) => `<button class="chip hr-chip ${s.act?.kind === 'post' && s.act.key === k ? 'on' : ''}" data-act="post" data-k="${k}">⚓ ${esc(t.places[k])}</button>`).join('') + goods.map((k) => `<button class="chip hr-chip ${s.act?.kind === 'good' && s.act.key === k ? 'on' : ''}" data-act="good" data-k="${k}">${esc(v.goodNames[k])}</button>`).join('')
      + `<button class="chip hr-chip ${s.act?.kind === 'plague' ? 'on' : ''}" data-act="plague">🚢 ${esc(v.plagueChip)}</button>`;
  }
  if (!done) {
    lab.setReadout('?', '', '', '#e0b050'); lab.setState({ emo: '🤔', title: v.pred[0], lead: v.pred[1], body: '', extra: '' });
    lab.setFacts([{ ...t.facts.roads[0] }]); return;
  }
  const day = Math.min(SUM, Math.round(s.day)), r = roadAtDay(s.day), leg = r[4];
  lab.setReadout(String(day), v.readSub(SUM), v.pill, '#e0b050');
  const act = s.act;
  if (act && act.kind === 'post') lab.setState({ emo: '⚓', title: v.posts[act.key][0], lead: v.posts[act.key][1], body: '', extra: '' });
  else if (act && act.kind === 'good') lab.setState({ emo: '📦', title: v.goods[act.key][0], lead: v.goods[act.key][1], body: '', extra: '' });
  else if (act && act.kind === 'plague') lab.setState({ emo: '🚢', title: v.plague[0], lead: v.plague[1], body: '', extra: '' });
  else lab.setState({ emo: '🐫', title: v.day(day), lead: t.legLine(t.places[WAY[leg]], t.places[WAY[leg + 1]], LEGS[leg], t.modes[leg]), body: v.body, extra: '' });
  lab.setFacts(t.facts.roads);
}

canvasLoop($('cv'), drawScene);
render();
</script>
