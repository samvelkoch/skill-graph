  for (let i = 0; i <= nt; i++) { const a = -Math.PI / 2 + (i / nt) * (Math.PI / 2); c.beginPath(); c.moveTo(Cx + Math.cos(a) * (R - 8), Cy + Math.sin(a) * (R - 8)); c.lineTo(Cx + Math.cos(a) * (R + 5), Cy + Math.sin(a) * (R + 5)); c.stroke(); }
  // the first piece, drawn at least a few degrees long so it can be seen
  const span = Math.max(0.035, (Math.PI / 2) / Math.pow(10, S.mkA)), a0 = -Math.PI / 2;
  c.strokeStyle = '#ff9a3c'; c.lineWidth = 6; c.beginPath(); c.arc(Cx, Cy, R, a0, a0 + span); c.stroke();
  const px = Cx + Math.cos(a0 + span / 2) * R, py = Cy + Math.sin(a0 + span / 2) * R;
  c.fillStyle = '#fff'; c.beginPath(); c.arc(px, py, 4.5, 0, TAU); c.fill();
  // call-out
  const pieceM = QUAD_M / parts, label = pieceM >= 1000 ? `${big(pieceM / 1000)} km` : `${big(pieceM)} m`;
  c.strokeStyle = 'rgba(255, 154, 60, .7)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(px, py); c.quadraticCurveTo(px + 60, py - 30, 232, 46); c.stroke();
  c.fillStyle = 'rgba(12, 15, 28, .86)'; c.beginPath(); c.roundRect(232, 16, 160, 118, 14); c.fill();
  c.strokeStyle = 'rgba(255, 154, 60, .8)'; c.lineWidth = 1.5; c.stroke();
  txt(c, t.s.m.one, 312, 36, '#b9c0da', 13.5);
  txt(c, label, 312, 64, '#ffb56b', 26);
  if (S.mk === 7) {
    c.fillStyle = lgr(c, 0, 90, 0, 112, [[0, '#fcf0c6'], [1, '#e0c070']]); c.beginPath(); c.roundRect(252, 90, 120, 22, 3); c.fill();
    c.strokeStyle = '#8a6a22'; c.lineWidth = 1.2; for (let i = 0; i <= 10; i++) { const x = 252 + i * 12; c.beginPath(); c.moveTo(x, 90); c.lineTo(x, 90 + (i % 5 === 0 ? 11 : 6)); c.stroke(); }
    txt(c, t.s.m.metre, 312, 124, '#fff', 13.5);
  } else txt(c, `÷ ${big(parts)}`, 312, 104, '#d3d9e8', 14.5);
  pill(c, t.s.m.pole, 60, 52, { size: 13 });
  pill(c, t.s.m.eq, Cx + R - 20, Cy + 22, { size: 13 });
}
function drawSky(c, w, h, dt, time) {
  const t = T[lang];
  S.altA += (S.alt - S.altA) * Math.min(1, dt * 6);
  fitBox(c, w, h, 400, 300);
  c.fillStyle = lgr(c, 0, 0, 0, 280, [[0, '#0b1a44'], [0.55, '#2f6fb8'], [1, '#9fd3f0']]); c.fillRect(-600, -600, 1600, 880 + 600);
  for (let i = 0; i < 18; i++) { const x = (i * 83) % 330, y = (i * 41) % 90; c.fillStyle = `rgba(255, 255, 255, ${0.18 + 0.12 * Math.sin(time + i)})`; c.beginPath(); c.arc(x, y, 1.1, 0, TAU); c.fill(); }
  // clouds, fixed in the sky
  const cloud = (x, y, k) => { c.fillStyle = 'rgba(255, 255, 255, .8)'; c.beginPath(); c.ellipse(x, y, 30 * k, 9 * k, 0, 0, TAU); c.ellipse(x - 16 * k, y + 2 * k, 18 * k, 8 * k, 0, 0, TAU); c.ellipse(x + 17 * k, y + 3 * k, 20 * k, 8 * k, 0, 0, TAU); c.fill(); };
  cloud(60, 214, 1); cloud(250, 172, 0.9); cloud(110, 120, 0.7); cloud(240, 74, 0.55);
  // mountains and ground
  c.fillStyle = lgr(c, 0, 240, 0, 300, [[0, '#4d6a5a'], [1, '#2c3e34']]);
  c.beginPath(); c.moveTo(-20, 300); c.lineTo(-20, 268); c.quadraticCurveTo(40, 232, 90, 262); c.quadraticCurveTo(140, 236, 190, 266); c.quadraticCurveTo(240, 246, 290, 268); c.lineTo(420, 300); c.closePath(); c.fill();
  // the two scales on the right
  const yG = 268, yTop = 30, aX = 296, yOf = (ft) => yG - (ft / 40000) * (yG - yTop);
  c.strokeStyle = 'rgba(255, 255, 255, .85)'; c.lineWidth = 2; c.beginPath(); c.moveTo(aX, yG); c.lineTo(aX, yTop - 6); c.stroke();
  for (let ft = 0; ft <= 40000; ft += 10000) {
    const y = yOf(ft); c.strokeStyle = 'rgba(255, 255, 255, .85)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(aX - 8, y); c.lineTo(aX + 8, y); c.stroke();
    if (ft > 0) { txt(c, `${big(ft)} ${t.s.a.fu}`, aX - 12, y - 1, '#ffe0c8', 13, 'right'); txt(c, `${big(Math.round(ft * FT))} ${t.s.a.mu}`, aX + 12, y - 1, '#d4ecff', 13, 'left'); }
  }
  // the plane
  const alt = S.altA * 100, y = yOf(alt) - 12, px = 150;
  c.strokeStyle = 'rgba(255, 255, 255, .55)'; c.lineWidth = 1.4; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(px + 52, y + 12); c.lineTo(aX, yOf(alt)); c.stroke(); c.setLineDash([]);
  c.save(); c.translate(px, y + Math.sin(time * 1.4) * 1.2);
  c.fillStyle = 'rgba(0, 0, 0, .18)'; c.beginPath(); c.ellipse(4, 16, 46, 4, 0, 0, TAU); c.fill();
  c.fillStyle = lgr(c, 0, -10, 0, 12, [[0, '#ffffff'], [1, '#c5cde0']]);
  c.beginPath(); c.moveTo(-46, 0); c.quadraticCurveTo(-46, -9, -30, -10); c.lineTo(34, -9); c.quadraticCurveTo(54, -6, 56, 2); c.quadraticCurveTo(52, 10, 30, 11); c.lineTo(-30, 10); c.quadraticCurveTo(-46, 9, -46, 0); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(40, 55, 90, .6)'; c.lineWidth = 1.2; c.stroke();
  c.fillStyle = '#4a7fd0'; c.beginPath(); c.moveTo(-40, -6); c.quadraticCurveTo(-48, -22, -46, -28); c.lineTo(-34, -28); c.quadraticCurveTo(-28, -16, -20, -9); c.closePath(); c.fill();
  c.fillStyle = lgr(c, 0, 0, 0, 24, [[0, '#dfe5f3'], [1, '#97a3c4']]); c.beginPath(); c.moveTo(-6, 6); c.quadraticCurveTo(14, 12, 28, 26); c.lineTo(14, 26); c.quadraticCurveTo(0, 16, -14, 8); c.closePath(); c.fill();
  c.fillStyle = '#35507f'; for (let i = 0; i < 7; i++) { c.beginPath(); c.ellipse(-24 + i * 7.5, -3, 1.8, 2.2, 0, 0, TAU); c.fill(); }
  c.fillStyle = '#35507f'; c.beginPath(); c.ellipse(46, -2, 6, 3.6, 0.1, 0, TAU); c.fill();
  c.restore();
  pill(c, S.alt === 0 ? t.s.a.ground : `FL${String(Math.round(S.alt)).padStart(3, '0')}`, px, clamp(y - 24, 14, 270), { size: 14.5 });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  c.save(); // fitBox moves and scales the context: restore it so the next frame starts clean
  try {
    if (S.sec === 'metre') drawMetre(c, w, h, dt, time);
    else if (S.sec === 'sky') drawSky(c, w, h, dt, time);
    else if (lab.view === 'body') drawBody(c, w, h, dt, time);
    else if (lab.view === 'convert') drawConvert(c, w, h, dt);
  } finally { c.restore(); }
});

// --- controls --------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const startWalk = () => { S.t1 = 0; S.run = true; };
function askHTML(qn, q, opts, guess, ok, verdict) {
  const t = T[lang];
  return `<p class="ob-q">${esc(q)}</p><div class="ob-opts">${opts.map((o, j) => {
    const cls = guess === null ? '' : j === ok ? 'good' : j === guess ? 'bad' : 'dim';
    return `<button type="button" class="ob-opt ${cls}" data-q="${qn}" data-j="${j}"${guess === null ? '' : ' disabled'}>${esc(o)}</button>`;
  }).join('')}</div>${guess === null ? '' : `<p class="ob-verdict ${guess === ok ? 'ok' : 'no'}">${esc(guess === ok ? t.ok : t.no)} ${esc(verdict)}</p>`}`;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const o = ev.target.closest('.ob-opt');
  if (o && !o.disabled) {
    const q = o.dataset.q, j = +o.dataset.j, t = T[lang];
    if (q === '1') { S.g1 = j; S.mode = 'own'; startWalk(); (j === t.b.ok ? sfx.good : sfx.bad)(); }
    else if (q === '2') { S.g2 = j; S.val.ruler = 10; (j === t.c.ok ? sfx.good : sfx.bad)(); }
    else { S.g3 = j; (j === t.d.ok ? sfx.good : sfx.bad)(); }
    render(); showStage(); return;
  }
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'mode') { S.mode = b.dataset.m; startWalk(); sfx.click(); }
  else if (act === 'again') { startWalk(); sfx.click(); showStage(); }
  else if (act === 'inst') { S.inst = b.dataset.k; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click(); if (S.sec) showStage();
  }
  render();
});
$('obRange').addEventListener('input', (ev) => { if (S.g2 === null && S.inst !== 'ruler') return; S.val[S.g2 === null ? 'ruler' : S.inst] = +ev.target.value; sfx.tick(); render(); });
$('obSr').addEventListener('input', (ev) => { if (S.sec === 'metre') S.mk = +ev.target.value; else S.alt = +ev.target.value; sfx.tick(); render(); });
pane.addEventListener('click', (ev) => {
  const go = ev.target.closest('[data-go]');
  if (go) { $('views').querySelector(`[data-view="${go.dataset.go}"]`)?.click(); return; }
  const r = ev.target.closest('[data-u]'); if (!r) return;
  S.pick = S.pick === r.dataset.u ? null : r.dataset.u; sfx.tick(); render();
});

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  $('obV1').hidden = !!sec || v !== 'body';
  $('obV2').hidden = !!sec || v !== 'convert';
  $('obV3').hidden = !!sec || v !== 'old';
  $('obVs').hidden = !sec;
  $('cv').hidden = !sec && v === 'old';
  const gate = sec ? 0 : v === 'convert' && S.g1 === null ? 1 : v === 'old' ? (S.g1 === null ? 1 : S.g2 === null ? 2 : 0) : 0;
  document.body.dataset.v = sec ? 'sec' : gate || v === 'old' ? 'old' : v;
  if (gate) { $('obV2').hidden = true; $('obV3').hidden = true; $('cv').hidden = true; }
  pane.hidden = !!sec || (v !== 'old' && !gate);
  const open = secret.unlocked();
  $('obSecs').innerHTML = [['metre', '🌍'], ['sky', '✈️']].map(([k, emo]) => `<button type="button" class="chip ob-c secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.s[k][0])}` : '🔒 ???'}</button>`).join('');
  if (gate) renderGate(t, gate); else if (sec) renderSec(t); else if (v === 'body') renderBody(t); else if (v === 'convert') renderConvert(t); else renderOld(t);
  lab.checkStage();
}

function renderGate(t, n) {
  const g = t.gate;
  lab.setGlow('rgba(130, 145, 190, .22)');
  pane.innerHTML = `<div class="ob-gate"><div class="ob-lk">🔒</div><p class="ob-q" style="font-size:15px">${esc(g.t(n))}</p><p class="ob-note">${esc(g.d)}</p>
    <button type="button" class="chip ob-c" data-go="${n === 1 ? 'body' : 'convert'}" style="margin-top:12px">${esc(g.go(n))} →</button></div>`;
  lab.setReadout('🔒', '', '', '#9aa3c4');
  lab.setState({ emo: '🔒', title: g.t(n), lead: g.d, body: '', extra: '' }); lab.setFacts([]);
}
function renderBody(t) {
  lab.setGlow('rgba(95, 168, 160, .26)');
  const g = S.g1, b = t.b, asked = g !== null;
  $('obAsk1').innerHTML = askHTML('1', b.q, b.opts, g, b.ok, b.exp(num(STD)));
  $('obRow1').hidden = !asked;
  $('obRow1').innerHTML = `<div class="chips"><button type="button" class="chip ob-c ${S.mode === 'own' ? 'on' : ''}" data-act="mode" data-m="own">${esc(b.own)}</button>
    <button type="button" class="chip ob-c ${S.mode === 'std' ? 'on' : ''}" data-act="mode" data-m="std">${esc(b.std)}</button>
    <button type="button" class="chip ob-c" data-act="again">${esc(b.again)}</button></div>`;
  if (!asked) {
    lab.setReadout(b.mark, '', '', '#5fa8a0');
    lab.setState({ emo: '🤔', title: b.q, lead: b.lead0, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (S.mode === 'own') {
    lab.setReadout(`${N_DAD} · ${N_BOY}`, b.subOwn, b.pillOwn, '#5fa8a0');
    lab.setState({ emo: '🦶', title: b.stOwn[0], lead: b.stOwn[1](N_DAD, N_BOY), body: b.stOwn[2], extra: '' });
  } else {
    lab.setReadout(half(N_STD), b.subStd, b.pillStd, '#5fa8a0');
    lab.setState({ emo: '📏', title: b.stStd[0], lead: b.stStd[1](half(N_STD)), body: b.stStd[2](num(STD), TABLE), extra: '' });
  }
  lab.setFacts(t.facts.body);
}

function renderConvert(t) {
  lab.setGlow('rgba(224, 176, 80, .24)');
  const c = t.c, done = S.g2 !== null, inst = done ? S.inst : 'ruler', I = INST[inst], v = S.val[inst];
  $('obAsk2').innerHTML = askHTML('2', c.q, c.opts, S.g2, c.ok, c.exp);
  $('obInst').innerHTML = ['ruler', 'scale', 'jug'].map((k) => `<button type="button" class="chip ob-c ${inst === k ? 'on' : ''}" data-act="inst" data-k="${k}"${done || k === 'ruler' ? '' : ' disabled'}>${esc(c.inst[k])}</button>`).join('')
    + (done ? '' : `<p class="ob-note" style="flex-basis:100%">${esc(c.lock)}</p>`);
  const r = $('obRange');
  r.min = I.min; r.max = I.max; r.step = I.step; r.value = v;
  r.style.setProperty('--track', 'linear-gradient(90deg, #c4472f, #e0b050, #1e55b8)');
  $('obLo').textContent = `${num(I.min, 1)} ${c.sl[inst]}`; $('obHi').textContent = `${num(I.max, 1)} ${c.sl[inst]}`;
  const A = c.uA[inst](v);
  if (!done) {
    lab.setReadout(A, '', '', '#e0b050');
    lab.setState({ emo: '🤔', title: c.q, lead: c.lead0, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const rule = v * I.rule, ex = v * I.exact, bu = c.bu[inst];
  lab.setReadout(A, `≈ ${num(rule, I.dpR)} ${bu}`, `${c.more}: ${num(ex, I.dpE)} ${bu}`, '#e0b050');
  lab.setState({ emo: INST_ICON[inst], title: `${A} ≈ ${num(rule, I.dpR)} ${bu}`, lead: `${c.ruleL}: ${c.rule[inst]}.`,
    body: `${c.exactL}: ${c.exact[inst]}, ${lang === 'en' ? 'so' : lang === 'ru' ? 'значит' : 'tehát'} ${A} = ${num(ex, I.dpE)} ${bu}.`, extra: esc(c.dir[inst]) });
  lab.setFacts(t.facts.convert);
}

function nameOf(t, id) { return t.d.un[id]; }
function relLines(t, id) { return REL.filter(([, s, b]) => s === id || b === id).map(([n, s, b]) => `${nameOf(t, b)} = ${n} × ${nameOf(t, s)}`); }
function renderOld(t) {
  lab.setGlow('rgba(127, 179, 255, .24)');
  const d = t.d, asked = S.g3 !== null, cous = S.pick ? (COUSINS.find((g) => g.includes(S.pick)) ?? []) : [];
  $('obAsk3').innerHTML = askHTML('3', d.q, d.opts, S.g3, d.ok, d.exp(num(VERST_M / 1000, 2), num(MILE_M / 1000, 2), num(MILE_M / VERST_M, 1)));
  const row = (id) => {
    const u = UNITS[id], cls = id === S.pick ? 'sel' : cous.includes(id) ? 'co' : '';
    return `<button type="button" class="ob-r ${cls}" data-u="${id}"><span class="n">${esc(nameOf(t, id))}</span>
      <span class="ob-bw"><i style="width:${(u.cm / 220) * 100}%;background:linear-gradient(180deg, ${GCOL[u.g]}, ${GCOL[u.g]}aa)"></i></span><span class="v">${esc(lenText(u.cm))}</span></button>`;
  };
  const groups = ORDER[lang].map((g) => `<div class="ob-g"><div class="ob-gh" style="color:${GCOL[g]}"><i style="background:${GCOL[g]}"></i><span style="color:var(--soft)">${esc(d.grp[g])}</span></div>${GROUPS[g].map(row).join('')}</div>`).join('');
  const longHTML = asked
    ? `<div class="ob-long"><div class="ob-gh" style="margin-left:0"><span>${esc(d.long)}</span></div>
        ${[['mile', MILE_M, GCOL.br], ['verst', VERST_M, GCOL.ru]].map(([k, m, col]) => `<div class="ob-lr"><div class="t"><b>${esc(d.un[k])}</b><span>${num(m / 1000, 2)} km</span></div>
          <div class="ob-road"><i style="width:${(m / SPAN_M) * 100}%;background:linear-gradient(180deg, ${col}, ${col}aa)"></i><span class="ob-km" style="left:${(1000 / SPAN_M) * 100}%"></span></div></div>`).join('')}
        <div class="ob-axis"><span class="ob-kml" style="left:${(1000 / SPAN_M) * 100}%">${esc(d.km)}</span></div></div>`
    : `<div class="ob-long"><div class="ob-gh" style="margin-left:0"><span>${esc(d.long)}</span></div><div class="ob-qm" aria-hidden="true">?</div></div>`;
  pane.innerHTML = `<p class="ob-tip">${esc(d.tip)}</p>${groups}${longHTML}`;
  const pk = S.pick ? UNITS[S.pick] : null;
  lab.setReadout(pk ? lenText(pk.cm) : asked ? `${num(MILE_M / VERST_M, 1)}×` : '?', pk ? nameOf(t, S.pick) : '', '', '#7fb3ff');
  if (pk) {
    const cz = cous.filter((x) => x !== S.pick).map((x) => `${nameOf(t, x)} ${lenText(UNITS[x].cm)}`).join(' · ');
    lab.setState({ emo: '📜', title: `${nameOf(t, S.pick)}: ${lenText(pk.cm)}`, lead: relLines(t, S.pick).join(' · ') || d.stL, body: cz ? `${d.cous}: ${cz}` : '', extra: esc(d.note) });
  } else if (!asked) lab.setState({ emo: '🤔', title: d.q, lead: d.lead0, body: '', extra: '' });
  else lab.setState({ emo: '📜', title: d.stT, lead: d.stL, body: d.exp(num(VERST_M / 1000, 2), num(MILE_M / 1000, 2), num(MILE_M / VERST_M, 1)), extra: esc(d.note) });
  lab.setFacts(asked ? t.facts.old : []);
}

function renderSec(t) {
  const r = $('obSr');
  if (S.sec === 'metre') {
    lab.setGlow('rgba(255, 154, 60, .24)');
    r.min = 1; r.max = 7; r.step = 1; r.value = S.mk; r.style.setProperty('--track', 'linear-gradient(90deg, #ff9a3c, #ffe08a)');
    const parts = Math.pow(10, S.mk), pieceM = QUAD_M / parts, label = pieceM >= 1000 ? `${big(pieceM / 1000)} km` : `${big(pieceM)} m`, m = t.s.m;
    $('obSl').textContent = m.sl; $('obSv').textContent = big(parts);
    lab.setReadout(big(parts), m.pieces, `${m.one}: ${label}`, '#ff9a3c');
    lab.setState({ emo: '🌍', title: S.mk === 7 ? m.t[1] : m.t[0], lead: m.lead(big(parts), label), body: S.mk === 7 ? m.body[1] : m.body[0], extra: '' });
    lab.setFacts(t.facts.metre);
  } else {
    lab.setGlow('rgba(79, 147, 214, .26)');
    r.min = 0; r.max = 400; r.step = 10; r.value = S.alt; r.style.setProperty('--track', 'linear-gradient(90deg, #9fd3f0, #2f6fb8, #0b1a44)');
    const ft = S.alt * 100, fl = `FL${String(S.alt).padStart(3, '0')}`, mm = Math.round(ft * FT), a = t.s.a;
    $('obSl').textContent = a.sl; $('obSv').textContent = S.alt === 0 ? a.ground : fl;
    lab.setReadout(S.alt === 0 ? '0' : fl, `${big(ft)} ${a.fu}`, `≈ ${big(mm)} ${a.mu}`, '#4f93d6');
    lab.setState({ emo: '✈️', title: S.alt === 0 ? a.ground : `${a.sl}: ${S.alt}`, lead: a.lead(S.alt, big(ft), big(mm)), body: a.body, extra: '' });
    lab.setFacts(t.facts.sky);
  }
}
render();
</script>
</body>
</html>
