const atomById = (id) => B.atoms.find((a) => a.id === id);
const free = (id) => { const a = atomById(id); return a ? AT[a.s].v - B.bonds.filter((b) => b.a === id || b.b === id).reduce((x, b) => x + b.o, 0) : 0; };
const bondOf = (a, b) => B.bonds.find((x) => (x.a === a && x.b === b) || (x.a === b && x.b === a));
const radOf = (a) => AT[a.s].r * B.k;

function analyze() {
  const adj = new Map(B.atoms.map((a) => [a.id, []]));
  for (const bd of B.bonds) { adj.get(bd.a).push(bd.b); adj.get(bd.b).push(bd.a); }
  const seen = new Set(), comps = [];
  for (const a of B.atoms) {
    if (seen.has(a.id)) continue;
    const ids = [], st = [a.id]; seen.add(a.id);
    while (st.length) { const x = st.pop(); ids.push(x); for (const y of adj.get(x)) if (!seen.has(y)) { seen.add(y); st.push(y); } }
    const cnt = {}; let fr = 0;
    for (const id of ids) { const at = atomById(id); cnt[at.s] = (cnt[at.s] || 0) + 1; fr += free(id); }
    const k = keyOf(cnt);
    comps.push({ ids, cnt, free: fr, k, mol: fr === 0 ? MOLS.find((m) => m.k === k) ?? null : null, sig: ids.slice().sort((x, y) => x - y).join('.') });
  }
  B.comps = comps;
  const cur = new Set();
  for (const c of comps) {
    if (c.free === 0 && c.mol) {
      cur.add(c.sig);
      if (!B.cele.has(c.sig)) { B.cele.add(c.sig); B.flash[c.sig] = now(); sfx.good(); B.done.add(c.mol.id); }
    }
  }
  B.cele = new Set([...B.cele].filter((s) => cur.has(s)));
  B.cm = new Map(); comps.forEach((c, i) => c.ids.forEach((id) => B.cm.set(id, i)));
}
function addAtom(s) {
  const sz = loop.size(), t = T[lang];
  if (B.atoms.length >= 14) { B.msg = t.b.full; B.msgT = now(); sfx.bad(); render(); return; }
  const w = sz.w || 300, h = sz.h || 300, r = rng((B.nid * 7919) >>> 0);
  let best = null, bd = -1;
  for (let i = 0; i < 14; i++) {
    const x = 40 + r() * Math.max(10, w - 80), y = 50 + r() * Math.max(10, h - 110);
    const md = Math.min(1e9, ...B.atoms.map((a) => Math.hypot(a.x - x, a.y - y)));
    if (md > bd) { bd = md; best = [x, y]; }
  }
  const a = { id: B.nid++, s, x: best[0], y: best[1], vx: 0, vy: 0 };

}

}

  B.undo = B.undo.filter((u) => u.id !== id && u.a !== id && u.b !== id);

}
function undo() {

  else { const bd = bondOf(u.a, u.b); if (bd) { bd.o--; if (bd.o <= 0) B.bonds = B.bonds.filter((x) => x !== bd); } }
  sfx.click(); analyze(); render();
}
function tapAtom(id) {
  if (B.rm) return removeAtom(id);
  const t = T[lang];
  if (B.sel === null) { B.sel = id; B.focus = id; B.msg = ''; sfx.tick(); }
  else if (B.sel === id) B.sel = null;
  else {
    const a = B.sel;
    if (free(a) > 0 && free(id) > 0) { addBond(a, id); B.sel = null; B.focus = id; B.msg = ''; sfx.snap(); analyze(); }
    else { B.msg = t.b.noHand; B.msgT = now(); B.shake[a] = now(); B.shake[id] = now(); sfx.bad(); B.sel = id; B.focus = id; }

$('atTray').addEventListener('click', (ev) => { const b = ev.target.closest('[data-s]'); if (b) addAtom(b.dataset.s); });

  else { B.atoms = []; B.bonds = []; B.undo = []; B.sel = null; B.focus = null; B.cele = new Set(); sfx.click(); analyze(); render(); }

function handAngles(a, nFree) {
  const placed = [];
  for (const bd of B.bonds) {
    const o = bd.a === a.id ? atomById(bd.b) : bd.b === a.id ? atomById(bd.a) : null;
    if (o) for (let i = 0; i < bd.o; i++) placed.push(Math.atan2(o.y - a.y, o.x - a.x));
  }
  const res = [];
  for (let i = 0; i < nFree; i++) {
    let best = 0, bd = -1;
    for (let k = 0; k < 24; k++) {
      const ang = -Math.PI / 2 + k * Math.PI / 12; let md = 9;
      for (const q of placed) { const d = Math.abs(((ang - q + 3 * Math.PI) % TAU) - Math.PI); if (d < md) md = d; }
      if (md > bd + 1e-6) { bd = md; best = ang; }
    }
    res.push(best); placed.push(best);
  }
  return res;
}

function drawBuild(c, w, h, dt, t) {
  B.k = clamp(Math.min(w, h) / 330, .78, 1.15);
  const A = B.atoms, tm = now();
  // physics: springs on bonds, repulsion otherwise, a weak pull to the middle
  for (const a of A) { a.fx = (w / 2 - a.x) * .5; a.fy = (h / 2 - a.y - 10) * .5; }
  for (let i = 0; i < A.length; i++) for (let j = i + 1; j < A.length; j++) {
    const a = A[i], b = A[j]; let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || .01; dx /= d; dy /= d;
    const ra = radOf(a), rb = radOf(b), bd = bondOf(a.id, b.id);
    let f = 0;
    if (bd) f = (d - (ra + rb + 12 * B.k - (bd.o - 1) * 3)) * 60;
    else {
      const same = B.cm.get(a.id) === B.cm.get(b.id), minD = ra + rb + (same ? 26 : 16) * B.k;
      if (d < minD) f = -(minD - d) * 70;
    }
    a.fx += dx * f; a.fy += dy * f; b.fx -= dx * f; b.fy -= dy * f;
  }
  for (const a of A) {
    if (B.drag && B.drag.id === a.id && B.drag.moved) { a.vx = a.vy = 0; continue; }
    a.vx = (a.vx + a.fx * dt) * Math.exp(-6 * dt); a.vy = (a.vy + a.fy * dt) * Math.exp(-6 * dt);
    a.x += a.vx * dt; a.y += a.vy * dt;
  }
  for (const a of A) { const r = radOf(a) + 6; a.x = clamp(a.x, r, Math.max(r, w - r)); a.y = clamp(a.y, r + 22, Math.max(r + 22, h - r - 40)); }
  // halos and formula tags of molecules
  for (const cp of B.comps) {
    const ats = cp.ids.map(atomById); if (ats.length < 2) continue;
    const mx = ats.reduce((s, a) => s + a.x, 0) / ats.length, my = ats.reduce((s, a) => s + a.y, 0) / ats.length;
    const rad = Math.max(...ats.map((a) => Math.hypot(a.x - mx, a.y - my) + radOf(a))) + 20;
    if (cp.free === 0) {
      const el = Object.keys(cp.cnt).length === 1, col = el ? '78,168,255' : '255,200,87', fl = B.flash[cp.sig] ? tm - B.flash[cp.sig] : 9;
      const al = .16 + (fl < 1.3 ? .4 * (1 - fl / 1.3) : 0), rr2 = rad * (1 + (fl < 1.3 ? .25 * (1 - fl / 1.3) : 0));
      const g = c.createRadialGradient(mx, my, 0, mx, my, rr2); g.addColorStop(0, `rgba(${col},${al})`); g.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = g; c.beginPath(); c.arc(mx, my, Math.max(0, rr2), 0, TAU); c.fill();
    }
  }

  for (const bd of B.bonds) {
    const a = atomById(bd.a), b = atomById(bd.b); if (!a || !b) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, nx = -dy / d, ny = dx / d;
    for (let i = 0; i < bd.o; i++) {

      c.strokeStyle = '#2a3150'; c.lineWidth = 6 * B.k; c.lineCap = 'round'; c.beginPath(); c.moveTo(a.x + nx * off, a.y + ny * off); c.lineTo(b.x + nx * off, b.y + ny * off); c.stroke();
      c.strokeStyle = '#cdd6ee'; c.lineWidth = 3.4 * B.k; c.beginPath(); c.moveTo(a.x + nx * off, a.y + ny * off); c.lineTo(b.x + nx * off, b.y + ny * off); c.stroke();

    const x = a.x + sk, y = a.y;

        const g = c.createRadialGradient(x1, y1, 0, x1, y1, pr * 2.6); g.addColorStop(0, 'rgba(255,200,87,.55)'); g.addColorStop(1, 'rgba(255,200,87,0)');

    }

    c.save(); c.font = `900 ${Math.round(r * .78)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = a.s === 'H' ? '#2a3150' : '#fff'; c.fillText(a.s, x, y + 1); c.restore();
    if (B.sel === a.id) { c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.setLineDash([6, 4]); c.lineDashOffset = -tm * 14; c.beginPath(); c.arc(x, y, Math.max(0, r + 6), 0, TAU); c.stroke(); c.setLineDash([]); }
    if (B.rm) { c.strokeStyle = 'rgba(255,90,80,.9)'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, Math.max(0, r + 4), 0, TAU); c.stroke(); }
  }

}

    return `<div class="at-tg ${B.done.has(id) ? 'done' : ''}"><span>${emo}</span><span>${esc(cap(t.mol[id]))}</span><b>${fmt(m.c)}${B.done.has(id) ? ' ✓' : ''}</b></div>`;
  }).join('');
  $('bUndo').textContent = t.b.undo; $('bUndo').disabled = !B.undo.length; $('bUndo').style.opacity = B.undo.length ? 1 : .4;
  $('bRm').textContent = t.b.rm; $('bRm').classList.toggle('on', B.rm);
  $('bClear').textContent = t.b.clear;
  const cp = B.comps.find((x) => x.ids.includes(B.focus)) ?? B.comps[B.comps.length - 1];
  const anyDone = B.done.size > 0 || B.comps.some((x) => x.free === 0 && x.mol);
  lab.setFacts(anyDone ? [{ emo: '💧', text: t.facts.build[0], src: t.facts.build[1] }] : []);
  if (!cp) {
    lab.setReadout('—', t.b.sub0, '', '#ffc857');
    lab.setState({ emo: '🧩', title: t.b.sTitle, lead: t.b.sLead, body: t.b.sBody, extra: `<div class="at-fine">${esc(t.b.fine)}</div>` });
    return;
  }
  const f = fmt(cp.cnt), oneKind = Object.keys(cp.cnt).length === 1;
  if (cp.free > 0) {
    lab.setReadout(f, t.b.free(cp.free), '', '#ffc857');
    lab.setState({ emo: '🧩', title: f, lead: t.b.free(cp.free), body: t.b.sLead, extra: `<div class="at-fine">${esc(t.b.fine)}</div>` });
    return;
  }
  const col = oneKind ? '#4ea8ff' : '#f5c84c', badge = t.b.badge[oneKind ? 0 : 1];
  if (cp.mol) {
    lab.setReadout(f, cap(t.mol[cp.mol.id]), badge, col);
    lab.setState({ emo: oneKind ? '⚛️' : '🧪', title: `${f} · ${cap(t.mol[cp.mol.id])}`, lead: oneKind ? t.b.isEl : t.b.isCo, body: cp.mol.id === 'nacl' ? t.b.salt : t.b.sBody, extra: `<div class="at-fine">${esc(t.b.fine)}</div>` });
  } else {
    lab.setReadout(f, t.b.unk, badge, col);
    lab.setState({ emo: '❔', title: f, lead: t.b.unk, body: oneKind ? t.b.isEl : t.b.isCo, extra: `<div class="at-fine">${esc(t.b.fine)}</div>` });
  }
}
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

// pointer: tap an atom to select / bond, drag to move
const cv = $('cv');
const pt = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'build') return;
  const [x, y] = pt(ev); let hit = null;
  for (let i = B.atoms.length - 1; i >= 0; i--) { const a = B.atoms[i]; if (Math.hypot(a.x - x, a.y - y) <= Math.max(radOf(a) + 4, 22)) { hit = a; break; } }
  if (!hit) { if (B.sel !== null) { B.sel = null; render(); } return; }
  B.drag = { id: hit.id, ox: x - hit.x, oy: y - hit.y, sx: x, sy: y, moved: false };
  try { cv.setPointerCapture(ev.pointerId); } catch { /* no capture */ }
});
cv.addEventListener('pointermove', (ev) => {
  const d = B.drag; if (!d) return;
  const [x, y] = pt(ev);
  if (!d.moved && Math.hypot(x - d.sx, y - d.sy) > 6) d.moved = true;
  if (d.moved) { const a = atomById(d.id); if (a) { a.x = x - d.ox; a.y = y - d.oy; } }
});
const endDrag = (ev) => { const d = B.drag; B.drag = null; if (d && !d.moved && ev.type === 'pointerup') tapAtom(d.id); };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// === view 3: sort ===============================================================================================
const BOXES = [
  { f: 'He', kind: 0, parts: [['He', 9]] },
  { f: 'O₂', kind: 0, parts: [['O2', 5]] },
  { f: 'H₂O', kind: 1, parts: [['H2O', 5]] },
  { f: 'H₂ + O₂', kind: 2, parts: [['H2', 4], ['O2', 3]] },
  { f: 'N₂ + H₂O', kind: 2, parts: [['N2', 4], ['H2O', 4]] },
  { f: 'Fe + S', kind: 2, solid: 'mix', atoms: ['Fe', 'S'] },
  { f: 'FeS', kind: 1, solid: 'fes', atoms: ['Fe', 'S'] },
];
const BN = BOXES.length;
BOXES[0].atoms = ['He']; BOXES[1].atoms = ['O']; BOXES[2].atoms = ['H', 'O']; BOXES[3].atoms = ['H', 'O']; BOXES[4].atoms = ['N', 'H', 'O'];
const MD = {
  He: { a: [['He', 0, 0]], b: [] },
  O2: { a: [['O', -8.5, 0], ['O', 8.5, 0]], b: [[0, 1]] },
  H2: { a: [['H', -5, 0], ['H', 5, 0]], b: [[0, 1]] },
  N2: { a: [['N', -8, 0], ['N', 8, 0]], b: [[0, 1]] },
  H2O: { a: [['O', 0, -3], ['H', -10, 8], ['H', 10, 8]], b: [[0, 1], [0, 2]] },
};
const ER = { H: 6.5, He: 9, N: 9.5, O: 10.5 };
const PAT = ['FFSSSF', 'FFFSSS', 'SSFFSS', 'SSSFFF'];
const KCOL = ['#4ea8ff', '#f5c84c', '#b08cff'];
const SOLID = { cols: 6, rows: 4 };

function initBox(i) {
  const r = rng(i * 97 + 13), out = [];
  for (const [d, n] of BOXES[i].parts || []) for (let k = 0; k < n; k++) {
    const dir = r() * TAU, sp = 26 + r() * 22;
    out.push({ d, x: .12 + .76 * r(), y: .12 + .76 * r(), a: r() * TAU, w: (r() - .5) * 1.5, vx: Math.cos(dir) * sp, vy: Math.sin(dir) * sp });
  }
  return out;
}
function drawSort(c, w, h, dt, t) {
  const t8 = T[lang].s, i = Q.i, bx = 10, by = 10, bw = w - 20, bh = h - 20, B0 = BOXES[i], ans = Q.guess[i] !== null;
  Q.magV += (Q.mag - Q.magV) * (1 - Math.exp(-3.5 * dt));
  // the lens-like box
  const g = c.createLinearGradient(0, by, 0, by + bh); g.addColorStop(0, '#16224a'); g.addColorStop(1, '#0c1430');
  c.fillStyle = g; rr(c, bx, by, bw, bh, 22); c.fill();
  const vg = c.createRadialGradient(w / 2, h / 2, Math.min(bw, bh) * .2, w / 2, h / 2, Math.max(bw, bh) * .7); vg.addColorStop(0, 'rgba(90,130,230,.20)'); vg.addColorStop(1, 'rgba(0,0,0,.35)');
  c.fillStyle = vg; rr(c, bx, by, bw, bh, 22); c.fill();
  c.strokeStyle = 'rgba(150,175,255,.4)'; c.lineWidth = 2; rr(c, bx, by, bw, bh, 22); c.stroke();
  const x0 = bx + 10, x1 = bx + bw - 10, y0 = by + 40, y1 = by + bh - 38, W = x1 - x0, H = y1 - y0, s = clamp(Math.min(W, H) / 200, .95, 1.8);
  if (B0.solid) drawSolid(c, B0, x0, y0, W, H, t, i);
  else {
    if (!Q.mols[i]) Q.mols[i] = initBox(i);
    const ms = Q.mols[i], rad = 17 * s;
    for (const m of ms) {
      m.x += m.vx * dt / W; m.y += m.vy * dt / H; m.a += m.w * dt;
      const mx = rad / W, my = rad / H;
      if (m.x < mx) { m.x = mx; m.vx = Math.abs(m.vx); } if (m.x > 1 - mx) { m.x = 1 - mx; m.vx = -Math.abs(m.vx); }
      if (m.y < my) { m.y = my; m.vy = Math.abs(m.vy); } if (m.y > 1 - my) { m.y = 1 - my; m.vy = -Math.abs(m.vy); }
    }
    for (let a = 0; a < ms.length; a++) for (let b2 = a + 1; b2 < ms.length; b2++) {
      const p = ms[a], q = ms[b2]; let dx = (q.x - p.x) * W, dy = (q.y - p.y) * H; const d = Math.hypot(dx, dy) || .01;
      if (d < rad * 2) {
        dx /= d; dy /= d; const push = (rad * 2 - d) / 2;
        p.x -= dx * push / W; p.y -= dy * push / H; q.x += dx * push / W; q.y += dy * push / H;
        const rv = (q.vx - p.vx) * dx + (q.vy - p.vy) * dy;
        if (rv < 0) { p.vx += dx * rv; p.vy += dy * rv; q.vx -= dx * rv; q.vy -= dy * rv; }
      }
    }
    for (const m of ms) {
      const def = MD[m.d], cx = x0 + m.x * W, cy = y0 + m.y * H, co = Math.cos(m.a), si = Math.sin(m.a);
      const pos = def.a.map(([e, dx, dy]) => [e, cx + (dx * co - dy * si) * s, cy + (dx * si + dy * co) * s]);
      c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 5 * s; c.lineCap = 'round';
      for (const [u, v] of def.b) { c.beginPath(); c.moveTo(pos[u][1], pos[u][2]); c.lineTo(pos[v][1], pos[v][2]); c.stroke(); }
      for (const [e, px, py] of pos) ball(c, px, py, ER[e] * s, COL[e]);
    }
  }
  // labels
  if (ans) pill(c, `${B0.f} · ${t8.kinds[B0.kind]}`, bx + 12, by + 22, w, h, { align: 'left', line: KCOL[B0.kind], col: '#fff' });
  else pill(c, t8.box(i + 1, BN), bx + 12, by + 22, w, h, { align: 'left' });
  pill(c, '🔍 ' + t8.zoom, bx + bw - 12, by + 22, w, h, { align: 'right', col: '#9fc8ff' });
  let lx = bx + 12;
  for (const e of B0.atoms) { const tw = pill(c, '\u2003' + e, lx, by + bh - 20, w, h, { align: 'left' }); ball(c, lx + 14, by + bh - 20, 4.5, COL[e], false); lx += tw + 6; }
}
function drawSolid(c, b, x0, y0, W, H, t, idx) {
  const { cols, rows } = SOLID, lw = W * .6, cell = Math.min(lw / cols, H / rows), ox = x0 + (lw - cell * cols) / 2 + cell / 2, oy = y0 + (H - cell * rows) / 2 + cell / 2;
  const fes = b.solid === 'fes';
  const cells = [];
  for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) cells.push({ r, q, fe: fes ? (r + q) % 2 === 0 : PAT[r][q] === 'F' });
  const fe = cells.filter((x) => x.fe); fe.sort((a, b2) => b2.q - a.q || a.r - b2.r); fe.forEach((x, k) => { x.k = k; });
  const rf = cell * .44, rs = cell * .48;
  const pos = (x) => {
    let px = ox + x.q * cell + Math.sin(t * 2.1 + x.q * 1.7 + x.r) * cell * .04, py = oy + x.r * cell + Math.cos(t * 1.8 + x.r * 1.3 + x.q) * cell * .04;
    if (!fes && x.fe) {
      const e = ease(clamp(Q.magV * 1.5 - x.k * .05, 0, 1)), tx = x0 + W - 46 - Math.floor(x.k / 4) * cell * .95, ty = y0 + H / 2 + ((x.k % 4) - 1.5) * cell * .95;
      px = lerp(px, tx, e); py = lerp(py, ty, e);
    } else if (fes && Q.mag) { px += Math.sin(t * 30 + x.q) * 1.2; }
    return [px, py];
  };
  // bonds of the compound
  if (fes) {
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = Math.max(2, cell * .13); c.lineCap = 'round';
    for (const x of cells) for (const [dq, dr] of [[1, 0], [0, 1]]) {
      const y = cells.find((z) => z.q === x.q + dq && z.r === x.r + dr); if (!y) continue;
      const a = pos(x), b2 = pos(y); c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b2[0], b2[1]); c.stroke();
    }
  }
  // field lines of the magnet
  if (!fes && Q.magV > .05) {
    c.save(); c.globalAlpha = Math.min(1, Q.magV) * .5; c.strokeStyle = '#ff8a80'; c.lineWidth = 1.4; c.setLineDash([4, 5]); c.lineDashOffset = -t * 20;
    for (let k = -2; k <= 2; k++) { c.beginPath(); c.moveTo(x0 + W - 18, y0 + H / 2 + k * cell * .6); c.bezierCurveTo(x0 + W - 90, y0 + H / 2 + k * cell * 1.6, x0 + lw + 6, y0 + H / 2 + k * cell, x0 + lw - 10, y0 + H / 2 + k * cell * 1.3); c.stroke(); }
    c.restore();
  }
  for (const x of cells) { const [px, py] = pos(x); ball(c, px, py, x.fe ? rf : rs, x.fe ? COL.Fe : COL.S); }
  // the magnet slides in from the right
  if (Q.magV > .01) {
    const mx = lerp(x0 + W + 70, x0 + W - 6, ease(Q.magV)), my = y0 + H / 2, R = Math.min(34, H * .22);
    c.save(); c.lineCap = 'butt'; c.lineWidth = 14;
    c.strokeStyle = '#e5484d'; c.beginPath(); c.arc(mx, my, R, -Math.PI / 2, 0, false); c.stroke();
    c.strokeStyle = '#4f7fe0'; c.beginPath(); c.arc(mx, my, R, 0, Math.PI / 2, false); c.stroke();
    c.strokeStyle = '#e5484d'; c.beginPath(); c.moveTo(mx, my - R); c.lineTo(mx - 14, my - R); c.stroke();
    c.strokeStyle = '#4f7fe0'; c.beginPath(); c.moveTo(mx, my + R); c.lineTo(mx - 14, my + R); c.stroke();
    c.strokeStyle = '#dfe5f2'; c.beginPath(); c.moveTo(mx - 14, my - R); c.lineTo(mx - 24, my - R); c.moveTo(mx - 14, my + R); c.lineTo(mx - 24, my + R); c.stroke();
    c.restore();
  }
}

function nextBox() {
  for (let k = 1; k <= BN; k++) { const j = (Q.i + k) % BN; if (Q.guess[j] === null) { Q.i = j; return; } }
  Q.i = (Q.i + 1) % BN;
}
$('sDots').addEventListener('click', (ev) => { const b = ev.target.closest('[data-i]'); if (b) { Q.i = +b.dataset.i; Q.mag = 0; sfx.click(); render(); } });
$('atS').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-g],[data-act]'); if (!b) return;
  if (b.dataset.g !== undefined) {
    const g = +b.dataset.g; Q.guess[Q.i] = g; (g === BOXES[Q.i].kind ? sfx.good : sfx.bad)(); render(); showStage();
  } else if (b.dataset.act === 'next') { nextBox(); Q.mag = 0; sfx.click(); render(); }
  else if (b.dataset.act === 'mag') { Q.mag = Q.mag ? 0 : 1; sfx.push(); render(); showStage(); }
  else if (b.dataset.act === 'again') { Q.guess = Array(BN).fill(null); Q.i = 0; Q.mag = 0; sfx.click(); render(); }
});

function renderSort(t) {
  const s = t.s, i = Q.i, bx = BOXES[i], g = Q.guess[i], ans = g !== null, done = Q.guess.every((x) => x !== null), right = Q.guess.filter((x, j) => x === BOXES[j].kind).length;
  lab.setGlow('rgba(176, 140, 255, .22)');
  lab.setFacts([{ emo: '🌌', text: t.facts.sort[0], src: t.facts.sort[1] }]);
  $('sDots').innerHTML = BOXES.map((b, j) => {
    const gj = Q.guess[j], cls = gj === null ? '' : gj === b.kind ? 'right' : 'bad';
    return `<button class="at-dot ${cls} ${j === i ? 'cur' : ''}" data-i="${j}" aria-label="${esc(s.box(j + 1, BN))}">${j + 1}</button>`;
  }).join('');
  $('sGuess').innerHTML = s.kinds.map((k, j) => `<button class="at-g ${ans && j === bx.kind ? 'right' : ans && j === g ? 'bad' : ''}" data-g="${j}"${ans ? ' disabled' : ''}>${esc(k)}</button>`).join('');
  $('sGuess').style.display = '';
  const hasMag = ans && bx.solid;
  $('sRow').innerHTML = (hasMag ? `<button class="chip" data-act="mag">${esc(Q.mag ? s.magOff : s.magnet)}</button>` : '')
    + (ans && !done ? `<button class="btn" data-act="next">${esc(s.next)}</button>` : '') + (done ? `<button class="btn" data-act="again">${esc(s.again)}</button>` : '');
  if (!ans) {
    lab.setReadout('?', s.box(i + 1, BN), '', '#b08cff');
    lab.setState({ emo: '🔍', title: s.pre, lead: '', body: '', extra: `<div class="at-fine">${esc(s.fine)}</div>` });
    return;
  }
  const ok = g === bx.kind;
  lab.setReadout(bx.f, s.names[i], s.kinds[bx.kind], KCOL[bx.kind]);
  let lead = `${s.names[i]} · ${bx.f}: ${s.kindsL[bx.kind]}`, body = s.why[i];
  if (bx.solid && Q.mag) body = bx.solid === 'mix' ? s.magMix : s.magFes;
  else if (bx.solid) body += ` ${s.tryMag}`;
  const extra = done ? `<div class="at-note"><b>${esc(s.end(right, BN))}</b> ${esc(s.endL)}</div>` : '';
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? s.right : s.wrong, lead, body, extra: extra + `<div class="at-fine">${esc(s.fine)}</div>` });
}

// --- loop and render ----------------------------------------------------------------------------------------
const loop = canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (lab.view === 'atom') drawAtom(c, w, h, dt, time);
  else if (lab.view === 'build') drawBuild(c, w, h, dt, time);
  else drawSort(c, w, h, dt, time);
});

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v === 'atom' && askShown() ? 'atom-ask' : v;
  $('atA').style.display = v === 'atom' ? '' : 'none';
  $('atB').style.display = v === 'build' ? '' : 'none';
  $('atS').style.display = v === 'sort' ? '' : 'none';
  if (v !== 'atom') askEl.style.display = 'none';
  if (v === 'atom') renderAtom(t); else if (v === 'build') renderBuild(t); else renderSort(t);
}
analyze();
render();
</script>
</body>
