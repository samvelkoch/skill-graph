    body = k >= NB ? n.gone : n.wave(5 * k) + n.phases[k < 1 ? 0 : k < 4 ? 1 : 5 * k < 65 ? 2 : 3];
  } else if (P.ask !== null && P.res) body = (P.res.ok ? n.ok : n.no) + n.res(P.res.y, P.res.cls, pc(P.res.p));
  lab.setState({ emo: '🏫', title: n.title(sim.year), lead: `${n.tiles[0][0]} ${mil(cur.sch)} · ${n.tiles[1][0]} ${mil(cur.wrk)} · ${n.tiles[2][0]} ${mil(cur.pen)}`, body, extra: fineHTML(t.sm.fine) });
  lab.setFacts(P.done ? [{ emo: '🎂', text: t.facts.plan, src: SRC.plan }] : []);
}

render();
</script>
</body>
</html>
