  const X = (u) => L.x0 + (u / MAPW) * L.bw, Y = (v) => L.y0 + L.bh - (v / MAPH) * L.bh, P = MAPLAKE.P;
  // smooth outline: midpoints as curve ends
  c.beginPath();
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], m0 = mid(P[P.length - 1], P[0]);
  c.moveTo(X(m0[0]), Y(m0[1]));
  for (let i = 0; i < P.length; i++) { const m = mid(P[i], P[(i + 1) % P.length]); c.quadraticCurveTo(X(P[i][0]), Y(P[i][1]), X(m[0]), Y(m[1])); }
  c.closePath();
  const wg = c.createLinearGradient(0, Y(7), 0, Y(1)); wg.addColorStop(0, '#6fc3e8'); wg.addColorStop(1, '#2f7fb5');
  c.fillStyle = wg; c.fill(); c.strokeStyle = 'rgba(235,250,255,.75)'; c.lineWidth = 2; c.stroke();
  const cell = (g / MAPW) * L.bw, dots = mapDots(g), r = Math.max(2.5, Math.min(5, cell * 0.12));
  dots.forEach(([u, v, ins]) => {
    const px = X(u), py = Y(v);
    if (ins) { c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(px - cell / 2 + 1, py - cell / 2 + 1, cell - 2, cell - 2); }
    pin(c, px, py, r, ins ? 'i' : 'n');

  const n = dots.filter((d) => d[2]).length;
  pillRow(c, [{ text: tx.mapSub(n), dot: '#3ddc97' }]);
}
function drawTri(c, w, h, t) {
  const L = (LAY = lay(w, h, C4, C4)), tx = T[lang].s, P = S3.tri;
  board(c, L);
  if (P.length === 3) { shapeFill(c, L, [P]); band(c, L, [P]); }
  else if (P.length === 2) { c.save(); c.strokeStyle = '#d93f50'; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(L.X(P[0][0]), L.Y(P[0][1])); c.lineTo(L.X(P[1][0]), L.Y(P[1][1])); c.stroke(); c.restore(); }
  pins(c, L, (x, y) => (P.some((p) => p[0] === x && p[1] === y) ? 'e' : null));
  if (P.length === 3 && cross(P[0], P[1], P[2]) !== 0) {
    const d2 = (p, q) => (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2;
    pillRow(c, [{ text: `${d2(P[0], P[1])} · ${d2(P[1], P[2])} · ${d2(P[2], P[0])}` }]);

}
function r3(t) {
  const s = t.s, part = S3.part, lk = part === 'lake' || part === 'hole', gated = lk && !S.rule, un = secret.unlocked();
  lab.setGlow('rgba(217, 130, 95, .26)');
  const ruleBox = S.rule ? `<div class="ds-rule">${esc(t.r.formula)}</div>` : '';
  $('partSeg').innerHTML = ['lake', 'hole'].map((k) => `<button data-a="part" data-k="${k}" class="${part === k ? 'on' : ''}">${esc(s[k])}</button>`).join('');
  const sc = (id, k, emo) => { const b = $(id); b.className = `chip secret ${un ? 'open' : ''} ${part === k ? 'on' : ''}`; b.textContent = un ? `${emo} ${t.secrets[k][0]}` : '🔒 ???'; };
  sc('secA', 'map', '🗺️'); sc('secB', 'tri', '🔺');
  $('gate').hidden = !gated; $('gateL').textContent = s.gateL; $('gateGo').textContent = s.gateGo; $('gateShow').textContent = s.gateShow;
  $('p-lake').hidden = gated || part !== 'lake'; $('p-hole').hidden = gated || part !== 'hole';
  $('p-map').hidden = part !== 'map'; $('p-tri').hidden = part !== 'tri';
  if (gated) {
    lab.setReadout('?', '', '', '#d9825f');
    lab.setState({ emo: '🔒', title: s.gateT, lead: s.gateL, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  if (part === 'lake') {
    const { mi, mb } = lakeCounts(), done = mi === LAKE.I.length && mb === LAKE.E.length, sq = LAKE.sq;
    $('lAuto').textContent = s.auto; $('lMode').textContent = S3.sq ? s.toDots : s.toSq; $('lReset').textContent = s.reset;
    $('lAuto').hidden = S3.sq; $('lReset').hidden = S3.sq;
    if (S3.sq) {
      lab.setReadout(sq.W, s.sqSub, s.sqPill(sq.C), '#d9825f');
      lab.setState({ emo: '🟩', title: s.sqT, lead: s.sqL(sq.W, sq.C), body: '', extra: ruleBox });
    } else if (done) {
      lab.setReadout(fmtN(LAKE.A), `I ${mi} · B ${mb}`, '', '#d9825f');
      lab.setState({ emo: '🏞️', title: s.lakeDoneT(fmtN(LAKE.A)), lead: s.lakeDoneL(LAKE.nI, LAKE.B, fmtN(LAKE.A)), body: s.lakeDoneB, extra: ruleBox });
    } else {
      lab.setReadout('?', `I ${mi} · B ${mb}`, '', '#d9825f');
      lab.setState({ emo: '🏞️', title: s.lakeT, lead: s.lakeL, body: mi + mb ? s.lakeCount(mi, mb) : '', extra: ruleBox });
    }
    lab.setFacts([{ emo: '🔎', ...t.facts.pick }]);
  } else if (part === 'hole') {
    const hs = S3.hole, H = HOLE[hs.two ? 1 : 0], H1 = HOLE[0], asked = hs.pred !== null;
    $('hYes').textContent = s.yes; $('hNo').textContent = s.no; $('hYes').hidden = asked; $('hNo').hidden = asked;
    $('hTwo').hidden = !asked; $('hTwo').textContent = hs.two ? s.one : s.two;
    if (!asked) {
      lab.setReadout('?', `I ${H1.nI} · B ${H1.B}`, s.rulePill(fmtN(H1.R)), '#d9825f');
      lab.setState({ emo: '🕳️', title: s.holeT, lead: s.holeL(H1.nI, H1.B, fmtN(H1.R)), body: s.holeQ, extra: ruleBox });
      lab.setFacts([]);
    } else {
      const works = H1.d === 0, ok = (hs.pred === 'yes') === works;
      lab.setReadout(fmtN(H.A), `I ${H.nI} · B ${H.B}`, s.rulePill(fmtN(H.R)), '#d9825f');
      lab.setState({ emo: ok ? '✅' : '🤔', title: hs.two ? s.holeT : ok ? s.holeRight : s.holeWrong, lead: s.holeRes(fmtN(H.A), fmtN(H.R), fmtN(H.d)),
        body: H.d === H.h ? (H.h === 1 ? s.holeOne : s.holeMany(H.h, fmtN(H.d))) : '', extra: ruleBox });
      lab.setFacts([{ emo: '🔎', ...t.facts.holes }]);
    }
  } else if (part === 'map') {
    const g = S3.g, dots = mapDots(g), n = dots.filter((d) => d[2]).length, est = n * g * g, err = (Math.abs(est - MAPLAKE.A) / MAPLAKE.A) * 100;
    $('mapChips').innerHTML = [2, 1, 0.5].map((v) => `<button class="chip ${v === g ? 'on' : ''}" data-a="grid" data-g="${v}">${esc(s.grid(v))}</button>`).join('');
    lab.setReadout(fmt2(est), 'km²', s.mapSub(n), '#d9825f');
    lab.setState({ emo: '🗺️', title: s.mapT, lead: s.mapL, body: `${s.mapSum(n, g, est)} ${s.mapReal(MAPLAKE.A, err)}`,
      extra: `${esc(s.mapMore)} <a class="ds-link" href="../map-scale/${lang === 'en' ? '' : `?lang=${lang}`}">${esc(MAP_LAB[lang])}</a>` });
    lab.setFacts([]);
  } else {
    const P = S3.tri, d2 = (p, q) => (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2;
    $('tBest').textContent = s.best; $('tClear').textContent = s.clearTri;
    if (P.length < 3) {
      lab.setReadout('?', s.triSub0, '', '#d9825f');
      lab.setState({ emo: '🔺', title: s.triT, lead: s.triL, body: P.length ? '' : s.triNone, extra: '' });
    } else if (cross(P[0], P[1], P[2]) === 0) {
      lab.setReadout('0', s.triSub, '', '#d9825f');

    } else {
      const a = d2(P[0], P[1]), b = d2(P[1], P[2]), c_ = d2(P[2], P[0]);
      const isBest = BEST3.every((q) => P.some((p) => p[0] === q[0] && p[1] === q[1]));
      lab.setReadout(fmtN(area2(P) / 2), s.triSub, '', '#d9825f');
      lab.setState({ emo: '🔺', title: s.triT, lead: isBest ? s.triBest(a, b, c_) : s.sides(a, b, c_), body: s.triWhy, extra: '' });

}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const step = (cur, d) => clamp((cur ?? 0) + d, 0, 80);
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'g1d' || a === 'g1u') { S1.guess = step(S1.guess, a === 'g1u' ? 0.5 : -0.5); sfx.tick(); }
  else if (a === 'g2d' || a === 'g2u') { S2.guess = step(S2.guess, a === 'g2u' ? 0.5 : -0.5); sfx.tick(); }
  else if (a === 'm1') { main1(); return; }
  else if (a === 'cutnext') { const k = SH1[S1.i].cuts.findIndex((c_, j) => !S1.cut[j]); if (k >= 0) cutTri(k); return; }
  else if (a === 'log') {
    const info = shapeInfo([S2.P], C2, C2);
    if (!S2.log.some((x) => x[0] === info.nI && x[1] === info.B && x[2] === info.A)) { S2.log.unshift([info.nI, info.B, info.A]); sfx.snap(); } else sfx.tick();
  } else if (a === 'clear') { S2.log = []; sfx.click(); }
  else if (a === 'showrule') { S.rule = true; sfx.good(); }
  else if (a === 'predict') { S2.mode = 'ask'; S2.guess = null; S2.justRule = false; sfx.click(); }
  else if (a === 'check') { check2(); return; }
  else if (a === 'cont') { S2.mode = 'play'; S2.ch = (S2.ch + 1) % CH.length; S2.justRule = false; sfx.click(); }
  else if (a === 'part') { S3.part = b.dataset.k; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S3.part = S3.part === b.dataset.k ? 'lake' : b.dataset.k; sfx.click();
  } else if (a === 'gogate') { $('views').querySelector('[data-view="rule"]')?.click(); return; }
  else if (a === 'showrule3') { S.rule = true; sfx.good(); }
  else if (a === 'auto') { S3.queue = [...LAKE.I, ...LAKE.E].filter((p) => !S3.marks.has(keyOf(p))).sort((p, q) => q[1] - p[1] || p[0] - q[0]); sfx.click(); }
  else if (a === 'mode') { S3.sq = !S3.sq; sfx.click(); }
  else if (a === 'lreset') { S3.marks = new Set(); S3.queue = []; sfx.click(); }
  else if (a === 'pred') { S3.hole.pred = b.dataset.v; const ok = (b.dataset.v === 'yes') === (HOLE[0].d === 0); (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'two') { S3.hole.two = !S3.hole.two; sfx.click(); }
  else if (a === 'grid') { S3.g = +b.dataset.g; sfx.tick(); }
  else if (a === 'best') { S3.tri = BEST3.map((p) => p.slice()); sfx.click(); }
  else if (a === 'tclear') { S3.tri = []; sfx.click(); }

});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'g1' && ev.target.id !== 'g2') return;
  const v = ev.target.value === '' ? null : clamp(Math.round(+ev.target.value * 2) / 2, 0, 80);
  if (ev.target.id === 'g1') S1.guess = v; else S2.guess = v;
  render();
});
$('ctrlBody').addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter' || (ev.target.id !== 'g1' && ev.target.id !== 'g2')) return;
  ev.preventDefault(); if (ev.target.id === 'g1') main1(); else check2();
});

// the board: taps (views 1 and 3) and dragging corners (view 2)
const cv = $('cv');
cv.addEventListener('click', (ev) => {
  if (!LAY) return;
  const v = lab.view;
  if (v === 'area' && S1.phase === 'cut') {
    const g = gridPt(ev), sh = SH1[S1.i], k = sh.cuts.findIndex((tri, j) => !S1.cut[j] && inTri([g.gx, g.gy], tri));
    if (k >= 0) cutTri(k);
  } else if (v === 'test' && S3.part === 'lake' && S.rule && !S3.sq) {
    const p = tapPin(ev); if (!p) return;
    const k = classify(p, LAKE.rings);
    if (k === 'o') { S3.flash = { p, t: performance.now() }; sfx.bad(); }
    else if (!S3.marks.has(keyOf(p))) { S3.marks.add(keyOf(p)); sfx.tick(); } else return;
    render();
  } else if (v === 'test' && S3.part === 'tri') {
    const p = tapPin(ev); if (!p) return;
    if (S3.tri.length >= 3) S3.tri = [];
    if (S3.tri.some((q) => q[0] === p[0] && q[1] === p[1])) return;
    S3.tri.push(p); sfx.snap(); render();
  }
});
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'rule' || S2.mode !== 'play' || !LAY) return;
  const g = gridPt(ev), L = LAY;
  let hit = -1, best = 1e9;
  S2.P.forEach((p, i) => { const d = Math.hypot(L.X(p[0]) - g.px, L.Y(p[1]) - g.py); if (d < best) { best = d; hit = i; } });
  if (best < Math.max(20, L.s * 0.45)) { S2.drag = { i: hit, moved: false }; try { cv.setPointerCapture(ev.pointerId); } catch { /* no capture */ } ev.preventDefault(); return; }
  const pi = Math.round(g.gx), pj = Math.round(g.gy);
  if (pi >= 0 && pj >= 0 && pi < C2 && pj < C2 && Math.hypot(L.X(pi) - g.px, L.Y(pj) - g.py) < Math.max(18, L.s * 0.5)) { if (addCorner(pi, pj)) { sfx.snap(); render(); } else sfx.bad(); }
});
cv.addEventListener('pointermove', (ev) => {
  const d = S2.drag; if (!d || !LAY) return;
  const g = gridPt(ev), pi = clamp(Math.round(g.gx), 0, C2 - 1), pj = clamp(Math.round(g.gy), 0, C2 - 1), cur = S2.P[d.i];
  if (pi === cur[0] && pj === cur[1]) return;
  const cand = S2.P.map((p) => p.slice()); cand[d.i] = [pi, pj];

  const d = S2.drag; if (!d) return;

  render();
};
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- render ----------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('s1').hidden = v !== 'area'; $('s2').hidden = v !== 'rule'; $('s3').hidden = v !== 'test';
  if (v !== 'rule' || S2.mode !== 'play') cv.style.touchAction = 'pan-y';
  if (v === 'area') r1(t); else if (v === 'rule') r2(t); else r3(t);
  lab.checkStage?.();
}
canvasLoop(cv, (c, w, h, dt, t) => {
  CW = w; CH_ = h;
  const v = lab.view;
  if (v === 'area') draw1(c, w, h, dt, t); else if (v === 'rule') draw2(c, w, h, dt, t); else draw3(c, w, h, dt, t);
  if (needRender) { needRender = false; render(); }

render();
