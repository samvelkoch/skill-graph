function buildRegions() {
  const cv = document.createElement('canvas'); cv.width = W * 2; cv.height = H * 2;
  const g = cv.getContext('2d');
  const P2 = (lo, la) => { const p = Pc(lo, la); return [p[0] * 2, p[1] * 2]; };
  landPath(g, P2);
  g.fillStyle = '#e9d9aa'; g.fill();
  const rnd = mulberry(7), seeds = [];
  for (let tries = 0; tries < 5000 && seeds.length < 40; tries++) {
    const lo = 113 + rnd() * 41, la = -10.5 - rnd() * 33, [x, y] = P2(lo, la);
    if (!g.isPointInPath(x, y)) continue;
    const inland = lo > 122 && lo < 145 && la > -33 && la < -17, md = inland ? 74 : 46;
    if (seeds.some((s) => Math.hypot(s[0] - x, s[1] - y) < md)) continue;
    seeds.push([x, y, Math.floor(rnd() * 6)]);
  }
  const PAL = ['217,130,95', '224,176,80', '143,179,107', '95,168,168', '157,130,196', '217,112,143'];
  const STEP = 3, cols = Math.ceil(W * 2 / STEP), rows = Math.ceil(H * 2 / STEP), ids = new Int16Array(cols * rows);
  g.save(); g.clip();
  for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
    const x = q * STEP, y = r * STEP; let best = 0, bd = 1e9;
    for (let i = 0; i < seeds.length; i++) { const d = (seeds[i][0] - x) ** 2 + (seeds[i][1] - y) ** 2; if (d < bd) { bd = d; best = i; } }
    ids[r * cols + q] = best;
    g.fillStyle = `rgba(${PAL[(seeds[best][2] + best) % 6]},.62)`; g.fillRect(x, y, STEP, STEP);
  }
  g.fillStyle = 'rgba(70,40,24,.5)';
  for (let r = 0; r < rows - 1; r++) for (let q = 0; q < cols - 1; q++) { const id = ids[r * cols + q]; if (id !== ids[r * cols + q + 1] || id !== ids[(r + 1) * cols + q]) g.fillRect(q * STEP, r * STEP, STEP, STEP); }

}

  } else if (act === 'next') {

  }
  $('landCtl').style.display = '';
  setHTML($('landCtl'), `<button class="chip ${S.v4 === 'ship' && !S.map ? 'on' : ''}" data-act="v4" data-v="ship">🚢 ${esc(l.ship)}</button><button class="chip ${S.v4 === 'before' && !S.map ? 'on' : ''}" data-act="v4" data-v="before">🛶 ${esc(l.before)}</button><button class="chip ${S.map ? 'on' : ''}" data-act="map">${esc(S.map ? l.mapOff : l.map)}</button>`);
  lab.setReadout(S.map ? '🗺️' : S.v4 === 'before' ? '🛶' : '🚢', S.map ? l.cv.langs : S.v4 === 'before' ? l.cv.c0 : l.cv.c1, '', '#e8a05a');
  if (S.map) { const [emo, title, lead] = l.stMap; lab.setState({ emo, title, lead, body: l.law, extra: '' }); }
  else if (S.v4 === 'before') { const [emo, title, lead] = l.stBefore; lab.setState({ emo, title, lead, body: l.law, extra: '' }); }
  else { const [emo, title, lead] = l.stShip; lab.setState({ emo, title, lead, body: '', extra: '' }); }
  setFacts('land', t);
}
render();
</script>
</body>
