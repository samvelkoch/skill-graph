  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .35 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath(); c.fill();
}
function pill(c, text, cx, cy, W, fs = 14) {
  c.font = `800 ${fs}px ${FONT}`;
  const maxW = W - 28, words = text.split(' '), lines = [];
  let cur = '';
  for (const wd of words) { const tt = cur ? `${cur} ${wd}` : wd; if (c.measureText(tt).width > maxW && cur) { lines.push(cur); cur = wd; } else cur = tt; }
  lines.push(cur);
  const tw = Math.max(...lines.map((l) => c.measureText(l).width)), pw = tw + 22, ph = lines.length * fs * 1.3 + 12;
  const x = clamp(cx - pw / 2, 6, Math.max(6, W - 6 - pw)), y = Math.max(6, cy - ph / 2);
  c.fillStyle = 'rgba(8,12,24,.82)'; rrect(c, x, y, pw, ph, 14); c.fill();
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  lines.forEach((l, i) => c.fillText(l, x + pw / 2, y + 6 + fs * .65 + i * fs * 1.3));
}
const STARS = Array.from({ length: 34 }, (_, i) => [((i * 37) % 100) / 100, ((i * 61) % 100) / 100, i * .9]);

function update(dt) {
  const d = S.lbTarget - S.lbPos;
  if (Math.abs(d) > .001) { const sp = Math.max(4.5, Math.abs(d) * 6); S.lbPos += Math.sign(d) * Math.min(Math.abs(d), sp * dt); } else S.lbPos = S.lbTarget;
  for (let i = 0; i < S.glow.length; i++) if (S.glow[i] > 0) S.glow[i] = Math.max(0, S.glow[i] - dt * 1.1);
  for (const k of Object.keys(S.leaves)) { const lf = S.leaves[k]; lf.t += dt; if (lf.st === 'fly' && lf.t > .9) delete S.leaves[k]; }
  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; if (!p.smoke) p.vy += 260 * dt; p.l -= dt; }
  S.parts = S.parts.filter((p) => p.l > 0);
  if (S.grow) S.grow.t += dt;
  if (S.launch > 0) S.launch += dt;
  if (S.autoAsk) {
    S.trailWait -= dt;
    if (S.trailWait <= 0) {
      if (S.trail.length) { arrive(S.trail.shift()); S.trailWait = .5; sfx.tick(); render(); }
      else { S.autoAsk = false; step(); }
    }
  }
  if (S.jump.t < 1) {
    S.jump.t = Math.min(1, S.jump.t + dt / .85);
    if (S.jump.t >= 1) {
      const b = S.jump.b; S.pos = b; S.lbPos = b; S.lbTarget = b; S.seen[b] = true; S.glow[b] = 1; S.squash = 1; burst(b); sfx.good();
      if (b >= S.max) S.done = true;
      render();
    }
  }
  if (S.squash > 0) S.squash = Math.max(0, S.squash - dt * 4);
}

canvasLoop(cv, (c, w, h, dt, t) => {
  update(dt);
  const L = layout(w, h); S.lay = L;
  const { cell, pt, ptf } = L, R = cell * .54;
  drawBg(c, w, h, t);
  if (S.top) { // launch bay for the rocket
    const y0 = L.bottom + cell * .7;
    if (h - y0 > 60) {
      const g = c.createLinearGradient(0, y0, 0, h);
      g.addColorStop(0, '#0f2347'); g.addColorStop(1, '#1b3a6e');
      c.save(); rrect(c, 8, y0, w - 16, h - y0 - 8, 16); c.clip(); c.fillStyle = g; c.fillRect(0, y0, w, h);
      c.fillStyle = '#fff';
      for (const [fx, fy, ph] of STARS) { c.globalAlpha = .35 + .35 * Math.sin(t * 2 + ph); c.beginPath(); c.arc(8 + fx * (w - 16), y0 + fy * (h - y0), 1.4, 0, 7); c.fill(); }
      c.globalAlpha = 1; c.restore();
      const baseY = h - 22 - cell * .35, s = Math.min(cell * 1.05, (baseY - y0 - 12) / 3.8);
      const lk = S.launch > 0 ? clamp(S.launch / 2.4, 0, 1) : 0;
      const off = -(lk * lk) * (baseY + s * 5);
      c.fillStyle = '#5b6482'; rrect(c, w / 2 - s * 1.8, baseY - 2, s * 3.6, 12, 5); c.fill();
      c.fillStyle = '#7d87a6'; rrect(c, w / 2 - s * 1.8, baseY - 2, s * 3.6, 4, 2); c.fill();
      if (S.launch > 0 && lk < 1) { for (let i = 0; i < 2; i++) S.parts.push({ x: w / 2 + (Math.random() - .5) * s, y: baseY + off + s * .2, vx: (Math.random() - .5) * 60, vy: 40 + Math.random() * 50, l: .9, ml: .9, smoke: true, s: s * .3 }); }
      if (lk < 1) drawRocket(c, w / 2, baseY + off, s, S.launch > 0 ? Math.min(1, S.launch) : 0, t);
    }
  }
  c.lineCap = 'round';
  for (let i = 0; i < S.max; i++) {
    if (scaleOf(i + 1) <= .001) continue;
    const a = pt(i), b = pt(i + 1);
    c.strokeStyle = hsl(hue(dec(i + 1)), 45, 20); c.lineWidth = cell * .8;
    c.beginPath(); c.moveTo(a[0], a[1]);
    if (i % 10 === 9) { const o = (Math.floor(i / 10) % 2 ? -1 : 1) * cell * .55; c.bezierCurveTo(a[0] + o, a[1], b[0] + o, b[1], b[0], b[1]); } else c.lineTo(b[0], b[1]);
    c.stroke();
  }
  for (let n = 1; n <= S.max; n++) { const [x, y] = pt(n); drawSeg(c, n, x, y, R, t); }
  { const [x, y] = pt(0); drawHead(c, x, y, cell * .72); }
  for (const k of Object.keys(S.leaves)) {
    const n = +k, lf = S.leaves[k]; if (lf.t < 0) continue;
    const [x, y] = pt(n), r = n === 0 ? cell * .74 : R * 1.04, sway = Math.sin(t * 2 + n) * .05;
    if (lf.st === 'on') { const sc = Math.max(.001, easeBack(lf.t / .35)); drawLeaf(c, x, y, r * sc, -.5 + sway, 1, true); }
    else { const q = clamp(lf.t / .9, 0, 1), e = easeOut(q); drawLeaf(c, x + e * cell * 1.8, y - e * cell * 2.4, r * (1 - .25 * q), -.5 + q * 2.6, 1 - q * q, true); }
  }
  // the ladybird
  {
    const moving = Math.abs(S.lbTarget - S.lbPos) > .001, J = S.jump;
    let x, y, ang = S.lbAng, sz = cell * .27, hh = 4, sq = S.squash || 0;
    if (J.t < 1) {
      const a = pt(J.a), b = pt(J.b), e = easeIO(J.t);
      x = a[0] + (b[0] - a[0]) * e; y = a[1] + (b[1] - a[1]) * e - Math.sin(Math.PI * J.t) * cell * 2.4;
      ang = Math.atan2(b[1] - a[1], b[0] - a[0]); sz *= 1 + .25 * Math.sin(Math.PI * J.t);
    } else {
      const q = ptf(S.lbPos); x = q[0]; y = q[1] - cell * .06;
      if (moving) {
        const i = clamp(Math.floor(S.lbPos), 0, S.max - 1), A = pt(i), B = pt(i + 1), sg = Math.sign(S.lbTarget - S.lbPos);
        const want = Math.atan2((B[1] - A[1]) * sg, (B[0] - A[0]) * sg);
        let da = want - ang; da = Math.atan2(Math.sin(da), Math.cos(da)); ang += da * Math.min(1, dt * 14);
        y -= Math.abs(Math.sin(q[3] * Math.PI)) * cell * .16;
      }
      if (S.lbPos < 1) y -= cell * .5 * (1 - S.lbPos);
    }
    S.lbAng = ang;
    if (S.mode === 'jump') hh = hue(dec(J.t < 1 ? (J.t < .5 ? J.a : J.b) : S.pos));
    drawLadybird(c, x, y, sz, ang, t, hh, moving || J.t < 1, sq);
  }
  for (const p of S.parts) {
    const a = clamp(p.l / p.ml, 0, 1);
    if (p.smoke) { c.fillStyle = `rgba(225,228,240,${.32 * a})`; c.beginPath(); c.arc(p.x, p.y, Math.max(0, p.s * (2 - a)), 0, 7); c.fill(); }
    else { c.globalAlpha = a; c.fillStyle = p.c; star(c, p.x, p.y, p.s * 1.6); c.globalAlpha = 1; }
  }
  if (S.launch > 1.2) pill(c, T[lang].lift, w / 2, L.bottom + (h - L.bottom) * .5, w, 16);
});

// --- one render per change: controls, readout and the state card ----------------------------------------------------
function stateCard(t) {
  const m = S.mode;
  if (S.ask) return { emo: '🍃', title: t.ask.title, lead: t.ask.lead(S.pos), body: t.ask.body };
  if (S.done) { const d = t.done[m]; return { emo: '🎉', title: typeof d.title === 'function' ? d.title(S.start) : d.title, lead: d.lead, body: d.body }; }
  if (S.last) {
    const l = S.last, ex = explain(l.n, l.dir, l.prev);
    return { emo: l.ok ? '✅' : '🤔', title: l.ok ? t.right : (m === 'start' ? t.notThat : t.notQ(l.picked)), lead: ex, body: !l.ok && m === 'start' ? t.inOrder : '' };
  }
  if (m === 'jump' && S.jn > 0) return { emo: '🦘', title: t.intro.jump.title, lead: t.jumpAt(S.jn, S.pos), body: t.intro.jump.body };
  const i = t.intro[m];
  return { emo: m === 'rocket' ? '🚀' : m === 'jump' ? '🦘' : '🐛', title: i.title, lead: typeof i.lead === 'function' ? i.lead(S.start) : i.lead, body: i.body };
}
function controls(t) {
  const m = S.mode, open = secret.unlocked();
  let h = '';
  if (lab.view === 'back') {
    h += `<div class="xx-row xx-modes"><button class="chip ${m === 'any' ? 'on' : ''}" data-act="bm" data-k="any">${esc(t.anyChip)}</button>
      <button class="chip ${m === 'rocket' ? 'on' : ''}" data-act="bm" data-k="rocket">${esc(t.rocketChip)}</button></div>`;
  }
  const modes = h; h = '';
  if (S.ask) {
    h += `<p class="xx-q">${esc(S.dir > 0 ? t.qAfter(S.pos) : t.qBefore(S.pos))}</p><div class="xx-opts">${S.ask.opts.map((o, i) => `<button class="xx-opt" data-act="pick" data-i="${i}">${o}</button>`).join('')}</div>`;
  } else {
    if (S.last) h += `<p class="xx-verdict ${S.last.ok ? 'ok' : 'no'}">${esc(S.last.ok ? t.right : (m === 'start' ? t.notThat : t.notQ(S.last.picked)))}</p>`;
    const btn = (act, label, cls = '', dis = false) => `<button class="xx-btn ${cls}" data-act="${act}" ${dis ? 'disabled' : ''}>${esc(label)}</button>`;
    h += '<div class="xx-row">';
    if (m === 'on') h += btn('next', t.next, 'main', S.done) + btn('toTen', t.toTen, '', S.done || S.pos >= S.max - 1) + btn('again', t.again);
    else if (m === 'start') h += btn('again', t.newStart, S.done ? 'main' : '');
    else if (m === 'any') h += btn('next', S.autoAsk ? t.watch : t.next, 'main', S.done || S.autoAsk) + btn('again', t.newStart);
    else if (m === 'rocket') h += btn('next', t.next, 'main', S.done) + btn('again', t.again);
    else if (m === 'jump') h += btn('jump', t.jump, 'main', S.done || S.jump.t < 1) + btn('again', t.again) + btn('backOn', t.backOn);
    else if (m === 'grow') h += btn('next', t.next, 'main', S.done) + btn('again', t.again) + btn('backOn', t.backOn);
    h += '</div>';
  }
  const sc = (k, emo, sk) => `<button class="chip secret ${open ? 'open' : ''} ${S.mode === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[sk][0])}` : '🔒 ???'}</button>`;
  return `${h}${modes}<div class="xx-row xx-sec">${sc('jump', '🦘', 'a')}${sc('grow', '🚀', 'b')}</div>`;
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.big = S.max > 100 ? '1' : '';
  lab.setReadout(String(S.pos), t.tens(S.pos), S.ask ? `❓ ${t.under}` : (S.launch > 0 ? '🚀' : ''), hsl(hue(dec(S.pos)), 80, 62));
  lab.setState(stateCard(t));
  lab.setFacts(FACT_VIEW[v].map((k) => ({ emo: FACT_EMO[k], text: t.facts[k], src: SRC[k] })));
  $('ctrlBody').innerHTML = controls(t);
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'next') return step();
  if (act === 'toTen') return skip();
  if (act === 'pick') return answer(+b.dataset.i);
  if (act === 'jump') return jumpNext();
  if (act === 'again') { INIT[S.mode](); sfx.click(); return render(); }
  if (act === 'backOn') { INIT.on(); sfx.click(); return render(); }
  if (act === 'bm') { INIT[b.dataset.k](); sfx.click(); return render(); }
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    lab.view = 'on'; lab.renderChrome(); INIT[b.dataset.k](); sfx.click(); render(); showStage();
  }
});

initOn();
render();
</script>
