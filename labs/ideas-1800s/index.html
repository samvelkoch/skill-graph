  else if (lab.view === 'sort') drawSquare(c, w, h, dt, time);
  else if (lab.view === 'map') drawChart(c, w, h, dt, time);
  else drawTimeline(c, w, h, dt, time);
});
cv.addEventListener('click', (ev) => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (S.sec === 'a') { // jump to a city's date
    const F = europe(r.width, r.height); let best = null, bd = 40;
    for (const C of CITIES) { const d = Math.hypot(F.px(C.lon) - x, F.py(C.lat) - y); if (d < bd) { bd = d; best = C; } }
    if (best) { S.day = best.day; S.play = false; sfx.tick(); syncSlider(); render(); }
    return;
  }
  if (S.sec) return;
  if (lab.view === 'sort' && !sortDone()) {
    if (y > r.height * 0.3) pickMovement(nearestSpeaker(r, x));
  } else if (lab.view === 'sort' && S.fourShown && S.four === null) {
    pickMovement(nearestSpeaker(r, x));
  } else if (lab.view === 'laws' && !gated()) {
    let best = -1, bd = 34; LAWS.forEach((_, i) => { const p = lawNode(r.width, r.height, i), d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = i; } });
    if (best >= 0) { LW.i = best; sfx.click(); render(); }
  }
});
const nearestSpeaker = (r, x) => { const s = Math.min(r.width / 360, r.height / 300), ox = (r.width - 360 * s) / 2; return KEYS.reduce((a, k) => (Math.abs(ox + SPK[k] * s - x) < Math.abs(ox + SPK[a] * s - x) ? k : a), 'l'); };
let dragId = null;
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'map' || gated() || M.shown) return;
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, G = mapGeo(r.width, r.height);
  let best = null, bd = 34;
  for (const k of KEYS) { const p = tokPos(G, r.width, k), d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = k; } }
  if (!best) return;
  dragId = ev.pointerId; try { cv.setPointerCapture(dragId); } catch { /* ignore */ }
  M.drag = { k: best, x, y }; sfx.tick(); ev.preventDefault();
});
cv.addEventListener('pointermove', (ev) => {
  if (!M.drag || ev.pointerId !== dragId) return;
  const r = cv.getBoundingClientRect(); M.drag.x = clamp(ev.clientX - r.left, 8, r.width - 8); M.drag.y = clamp(ev.clientY - r.top, 8, r.height - 8);
});
const endDrag = (ev) => {
  if (!M.drag || ev.pointerId !== dragId) return;
  const r = cv.getBoundingClientRect(), G = mapGeo(r.width, r.height), d = M.drag, m = M[d.k];
  if (d.x >= G.x0 && d.x <= G.x1 && d.y >= G.y0 - 6 && d.y <= G.y1 + 6) { m.placed = true; m.fx = clamp((d.x - G.x0) / (G.x1 - G.x0), 0.02, 0.98); m.fy = clamp((G.y1 - d.y) / (G.y1 - G.y0), 0.02, 0.98); sfx.snap(); }
  else { m.placed = false; sfx.tick(); }
  M.drag = null; dragId = null; render();
};
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- actions ----------------------------------------------------------------------------------------------------
function pickMovement(k) {
  if (!sortDone()) {
    const i = S.pick.indexOf(null); S.pick[i] = k; S.lastIdx = i; S.active = k; S.popT = now(); sfx.snap();
    if (i === 8) { S.active = null; S.sortedOnce = true; store.set('ideas-1800s:sorted', true); sfx.good(); showStage(); }
  } else if (S.fourShown && S.four === null) { S.four = k; S.active = k; S.popT = now(); sfx.snap(); showStage(); }
  render();
}
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const resetSort = () => { S.pick.fill(null); S.four = null; S.fourShown = false; S.active = null; };
const resetMap = () => { for (const k of KEYS) M[k] = { fx: 0, fy: 0, placed: false }; M.shown = false; M.drag = null; };
const resetLaws = () => { LW.i = 0; LW.pick = LAWS.map(() => []); LW.checked = LAWS.map(() => false); LW.ok = LAWS.map(() => false); };
const lawOk = (i) => { const L = LAWS[i], p = LW.pick[i]; return L.must.every((k) => p.includes(k)) && p.every((k) => L.must.includes(k) || L.may.includes(k)); };
const names = (ks) => ks.map((k) => tt().mv[k].toLowerCase()).join(', ');
const mapSame = () => [
  M.c.fy < M.l.fy && M.c.fy < M.s.fy,
  M.l.fx < M.c.fx && M.l.fx < M.s.fx,
  M.s.fx > M.l.fx && M.s.fx > M.c.fx,
];

$('pane').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'pick') pickMovement(b.dataset.k);
  else if (a === 'undo') { const n = sortedCount(); if (n && !sortDone()) { S.pick[n - 1] = null; S.active = null; sfx.tick(); render(); } }
  else if (a === 'more') { S.fourShown = true; S.active = null; sfx.click(); render(); }
  else if (a === 'again') { if (lab.view === 'sort') resetSort(); else if (lab.view === 'map') resetMap(); else resetLaws(); sfx.click(); render(); }
  else if (a === 'gotosort') { document.querySelector('#views [data-view="sort"]')?.click(); }
  else if (a === 'show') { if (KEYS.every((k) => M[k].placed)) { M.shown = true; sfx.good(); showStage(); render(); } }
  else if (a === 'tog') { const i = LW.i; if (LW.checked[i]) return; const k = b.dataset.k, p = LW.pick[i]; LW.pick[i] = p.includes(k) ? p.filter((x) => x !== k) : [...p, k]; sfx.tick(); render(); }
  else if (a === 'check') { const i = LW.i; if (!LW.pick[i].length) return; LW.checked[i] = true; LW.ok[i] = lawOk(i); (LW.ok[i] ? sfx.good : sfx.bad)(); showStage(); render(); }
  else if (a === 'nav') { LW.i = clamp(LW.i + +b.dataset.d, 0, 4); sfx.click(); render(); }
});
$('secRow').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act="sec"]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.play = false; sfx.click(); if (S.sec) showStage(); render();
});
$('secPane').addEventListener('input', (ev) => {
  if (ev.target.id === 'sl') { if (S.sec === 'a') { S.day = +ev.target.value; S.play = false; } else S.hours = +ev.target.value; render(); }
});
$('secPane').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'play') { if (S.day >= DAYS) S.day = 0; S.play = !S.play; sfx.click(); render(); }
  else if (b.dataset.act === 'hrs') { S.hours = +b.dataset.h; sfx.snap(); syncSlider(); render(); }
});
function syncSlider() { const el = $('sl'); if (el && S.sec === 'a' && +el.value !== Math.round(S.day)) el.value = Math.round(S.day); else if (el && S.sec === 'b' && +el.value !== S.hours) el.value = S.hours; }

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const t = tt(), v = lab.view, open = secret.unlocked();
  $('secRow').innerHTML = ['a', 'b'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'a' ? '🗓️' : '🕗'} ${esc(t.secChip[k])}` : '🔒 ???'}</button>`).join('');
  cv.style.touchAction = !S.sec && v === 'map' && !gated() && !M.shown ? 'none' : 'pan-y';
  $('pane').hidden = !!S.sec; $('secPane').hidden = !S.sec;
  if (S.sec) return renderSec(t);
  if (v === 'sort') renderSort(t); else if (gated()) renderGate(t, v); else if (v === 'map') renderMap(t); else renderLaws(t);
}
function renderGate(t, v) {
  lab.setGlow(v === 'map' ? 'rgba(154, 134, 216, .26)' : 'rgba(232, 162, 74, .24)');
  $('pane').innerHTML = `<div class="id-card"><div class="id-q">${esc(t.gate[0])}</div><div class="id-small">${esc(t.gate[1])}</div><div class="id-act"><button class="btn" data-act="gotosort">${esc(t.gate[2])} →</button></div></div>`;
  lab.setReadout('🔒', '', '', '#9a86d8');
  lab.setState({ emo: '🔒', title: t.gate[0], lead: t.gate[1], body: '' });
  lab.setFacts([]);
}
function renderSort(t) {
  lab.setGlow('rgba(79, 179, 165, .26)');
  const n = sortedCount(), done = n === 9, st = t.sort, F = t.facts;
  let k = 0; S.pick.forEach((p, i) => { if (p === ST[i]) k++; });
  let h = '';
  const btns = (dis) => `<div class="id-btns">${KEYS.map((m) => `<button class="id-b" data-act="pick" data-k="${m}" style="--c:${COLS[m]}"${dis ? ' disabled' : ''}>${esc(t.mv[m])}</button>`).join('')}</div>`;
  if (!done) {
    h = `<div class="id-card"><div class="id-kick">${esc(st.kick(n + 1))}</div><div class="id-q">“${esc(t.st[n])}”</div></div>${btns(false)}
      <div class="id-act"><button class="chip" data-act="undo"${n ? '' : ' disabled'}>${esc(st.undo)}</button></div>`;
    lab.setReadout(`${n}/9`, st.sub, '', '#4fb3a5');
    lab.setState({ emo: '🗣️', title: st.stT, lead: st.stL, body: st.stB });
    lab.setFacts([{ emo: '🌍', text: F.f50, src: SRC.rev }, { emo: '🏛️', text: F.fMet, src: SRC.met }]);
  } else {
    if (S.fourShown && S.four === null) h += `<div class="id-card"><div class="id-kick">${esc(st.k4)}</div><div class="id-q">“${esc(st.s4)}”</div><div class="id-small">${esc(st.src4)}</div></div>${btns(false)}`;
    else if (!S.fourShown) h += `<div class="id-act"><button class="btn" data-act="more">${esc(st.more)}</button><button class="chip" data-act="again">${esc(st.again)}</button></div>`;
    else h += `<div class="id-act"><button class="chip" data-act="again">${esc(st.again)}</button></div>`;
    h += `<div class="id-kick" style="margin-top:12px">${esc(st.resH)}</div><ul class="id-res">${S.pick.map((p, i) => `<li class="${p === ST[i] ? 'ok' : 'no'}"><b>${p === ST[i] ? '✓' : '✗'}</b><span><i>${esc(t.st[i])}</i><small>${esc(t.mv[ST[i]])} · ${esc(t.src[i])}${p === ST[i] ? '' : ` (${esc(st.you(t.mv[p].toLowerCase()))})`}</small></span></li>`).join('')}</ul>`;
    lab.setReadout(`${k}/9`, st.sub, st.pill(k), '#4fb3a5');
    if (S.fourShown && S.four !== null) lab.setState({ emo: '✉️', title: st.r4T, lead: st.r4L, body: st.r4B });
    else lab.setState({ emo: k === 9 ? '✅' : '🗣️', title: st.doneT(k), lead: st.doneL, body: st.doneB });
    lab.setFacts([{ emo: '📖', text: F.fMan, src: SRC.man }, { emo: '🏘️', text: F.fOwen, src: SRC.owen }, { emo: '✒️', text: F.fChat, src: SRC.cons }]);
  }
  $('pane').innerHTML = h;
}
function renderMap(t) {
  lab.setGlow('rgba(154, 134, 216, .26)');
  const m = t.map, placed = KEYS.filter((k) => M[k].placed).length, all = placed === 3;
  let h = `<div class="id-card"><div class="id-q">${esc(m.q)}</div></div>`;
  if (!M.shown) h += `<div class="id-act"><button class="btn" data-act="show"${all ? '' : ' disabled'}>${esc(m.show)}</button>${all ? '' : `<span class="id-small" style="margin:0">${esc(m.need)}</span>`}</div>`;
  else {
    const same = mapSame(), k = same.filter(Boolean).length;
    h += `<div class="id-act"><button class="chip" data-act="again">${esc(m.again)}</button></div>
      <ul class="id-res">${m.claims.map((cl, i) => `<li><b>${same[i] ? '=' : '≠'}</b><span><i>${esc(cl)}</i><small>${esc(same[i] ? m.same : m.diff)}</small></span></li>`).join('')}</ul>
      <div class="id-leg">${KEYS.map((q) => `<span style="--c:${COLS[q]}"><i></i>${esc(t.mv[q])}</span>`).join('')}</div>`;
  }
  $('pane').innerHTML = h;
  if (!M.shown) {
    lab.setReadout(`${placed}/3`, m.sub, '', '#9a86d8');
    lab.setState({ emo: '🧭', title: m.stT, lead: m.stL, body: m.stB });
    lab.setFacts([{ emo: '🤝', text: t.facts.fCoal, src: SRC.rev }]);
  } else {
    const k = mapSame().filter(Boolean).length;
    lab.setReadout(`${placed}/3`, m.sub, m.pill(k), '#9a86d8');
    lab.setState({ emo: '🧭', title: m.doneT(k), lead: m.doneL, body: m.doneB, extra: `<b>${esc(m.noteH)}</b><br>${esc(m.note)}<br><small style="color:var(--faint)">${esc(SRC.soc)} · ${esc(SRC.man)}</small>` });
    lab.setFacts([{ emo: '📜', text: t.facts.fMan2, src: SRC.man }]);
  }
}
function renderLaws(t) {
  lab.setGlow('rgba(232, 162, 74, .24)');
  const L = t.laws, i = LW.i, LD = LAWS[i], chk = LW.checked[i], p = LW.pick[i], doneN = LW.checked.filter(Boolean).length, okN = LW.ok.filter((x, j) => x && LW.checked[j]).length;
  let h = `<div class="id-card"><div class="id-kick">${esc(L.kick(i + 1, LD.y))}</div><div class="id-q">${esc(L.w[i])}</div><div class="id-small">${esc(L.ask)}</div></div>
    <div class="id-chips">${KEYS.map((k) => `<button class="chip ${p.includes(k) ? 'on' : ''}" data-act="tog" data-k="${k}" style="--c:${COLS[k]}"${chk ? ' disabled' : ''}><span class="dot"></span>${esc(t.mv[k])}</button>`).join('')}</div>
    <div class="id-act"><button class="chip" data-act="nav" data-d="-1"${i === 0 ? ' disabled' : ''}>${esc(L.prev)}</button>`;
  h += chk ? `<button class="btn" data-act="nav" data-d="1"${i === 4 ? ' disabled' : ''}>${esc(L.next)}</button>` : `<button class="btn" data-act="check"${p.length ? '' : ' disabled'}>${esc(L.check)}</button>`;
  if (doneN === 5) h += `<button class="chip" data-act="again">${esc(t.sort.again)}</button>`;
  h += '</div>';
  $('pane').innerHTML = h;
  lab.setReadout(`${doneN}/5`, L.sub, doneN ? L.pill(okN) : '', '#e8a24a');
  const F = t.facts;
  if (!chk) {
    lab.setState({ emo: '📜', title: L.stT, lead: L.stL, body: L.stB });
    lab.setFacts([{ emo: '⏱️', text: F.fTen, src: SRC.ten }]);
  } else {
    const who = names(LD.must), also = LD.may.length ? ` · ${L.may(names(LD.may))}` : '';
    lab.setState({ emo: LW.ok[i] ? '✅' : '🤔', title: LW.ok[i] ? L.right : L.not, lead: `${L.by(who)}${also}`, body: L.x[i], extra: doneN === 5 ? `<b>${esc(L.allT)}</b><br>${esc(L.allL)} ${esc(L.allB)}` : '' });
    lab.setFacts([{ emo: ['🏭', '🌾', '🗳️', '🤫', '🏥'][i], text: F.law[i], src: [SRC.fa33, SRC.corn, SRC.fr48, `${SRC.secret} · ${SRC.lib}`, SRC.biz][i] }]);
  }
}
function renderSec(t) {
  const key = `${S.sec}|${lang}`;
  lab.setGlow(S.sec === 'a' ? 'rgba(255, 184, 107, .26)' : 'rgba(240, 178, 90, .26)');
  if (key !== S.secKey) { // rebuild the controls only when the secret or the language changes, so a slider being dragged keeps its place
    S.secKey = key;
    $('secPane').innerHTML = S.sec === 'a'
      ? `<div class="id-card"><div class="id-small" style="margin:0">${esc(t.s1.slide)}</div><input class="id-slide" id="sl" type="range" min="0" max="${DAYS}" step="1" value="${Math.round(S.day)}" aria-label="${esc(t.s1.slide)}"><div class="id-act" style="margin-top:2px"><button class="chip" data-act="play">${esc(S.play ? t.s1.pause : t.s1.play)}</button></div></div>`
      : `<div class="id-card"><div class="id-small" style="margin:0">${esc(t.s2.slide)}</div><input class="id-slide" id="sl" type="range" min="4" max="16" step="1" value="${S.hours}" aria-label="${esc(t.s2.slide)}"><div class="id-chips" style="margin-top:2px">${t.s2.pre.map(([hh, yr]) => `<button class="chip" data-act="hrs" data-h="${hh}">${hh} h · ${yr}</button>`).join('')}</div></div>`;
  }
  if (S.sec === 'a') {
    const pb = $('secPane').querySelector('[data-act=play]'); if (pb) pb.textContent = S.play ? t.s1.pause : t.s1.play;
    const day = Math.floor(S.day + 1e-6), lit = CITIES.filter((C) => day >= C.day), last = lit[lit.length - 1], F = t.facts;
    lab.setReadout(`${dateOf(day)}`, `${t.s1.n(lit.length)}`, t.s1.yr, '#ffb86b');
    lab.setState(last ? { emo: '🗓️', title: `${t.s1.city[last.k]} · ${dateOf(last.day)}`, lead: t.s1.ev[last.k], body: '' } : { emo: '🗓️', title: t.s1.noneT, lead: t.s1.noneL, body: '' });
    lab.setFacts([{ emo: '🔥', text: F.f1, src: SRC.rev }, { emo: '📰', text: F.f2, src: SRC.hun }, { emo: '🏛️', text: F.f3, src: SRC.met }]);
  } else {
    const hh = S.hours, n = t.s2.note[[8, 10, 12].includes(hh) ? hh : 0], F = t.facts;
    lab.setReadout(`${hh} h`, t.s2.work(hh) + ' · ' + t.s2.rest(24 - hh), '', '#f0b25a');
    lab.setState({ emo: '🕗', title: t.s2.title[[8, 10, 12].includes(hh) ? hh : 0], lead: n, body: '' });
    lab.setFacts([{ emo: '📣', text: F.g1, src: SRC.eight }, { emo: '⚒️', text: F.g2, src: SRC.eight }, { emo: '🦘', text: F.g3, src: SRC.eight }]);
  }
}
render();
</script>
