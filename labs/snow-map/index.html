// --- data: John Snow's table of fatal attacks by day of attack, 19 Aug - 20 Sep 1854 (HistData Snow.dates, Snow 1855 Table 1) -----
const DAYS = [[8, 19, 1], [8, 20, 1], [8, 21, 1], [8, 22, 0], [8, 23, 1], [8, 24, 1], [8, 25, 0], [8, 26, 1], [8, 27, 1], [8, 28, 1], [8, 29, 1], [8, 30, 8], [8, 31, 56],
  [9, 1, 143], [9, 2, 116], [9, 3, 54], [9, 4, 46], [9, 5, 36], [9, 6, 20], [9, 7, 28], [9, 8, 12], [9, 9, 11], [9, 10, 5], [9, 11, 5], [9, 12, 1],
  [9, 13, 3], [9, 14, 0], [9, 15, 1], [9, 16, 4], [9, 17, 2], [9, 18, 3], [9, 19, 0], [9, 20, 0]];
const CUM = []; DAYS.reduce((a, d, i) => (CUM[i] = a + d[2]), 0);
const SCALE = 5, YMAX = 150, HANDLE = 20 /* 8 Sep */, END_MAP = 24 /* 12 Sep */;
const dotsAt = (i) => Math.floor(CUM[i] / SCALE);
const NDOT = dotsAt(DAYS.length - 1), WH_DOT = 30;
const V1_FROM = 7, V1_TO = 13, V3_FROM = 10, V3_TO = 32;

// --- the simplified map (design units 100 x 70) -------------------------------------------------------------------
const MX = [8, 26, 50, 74, 92], MY = [6, 20, 35, 50, 64], SW = 1.6; // street centre lines and half width
const PUMPS = [{ L: 'A', x: 26, y: 20 }, { L: 'B', x: 50, y: 6 }, { L: 'C', x: 74, y: 35 }, { L: 'D', x: 50, y: 50 }, { L: 'E', x: 8, y: 50 }];
const TRUE = 2;
const BLOCKS = [], HOUSES = [];
for (let xi = 0; xi < 4; xi++) for (let yj = 0; yj < 4; yj++) {
  const x0 = MX[xi], x1 = MX[xi + 1], y0 = MY[yj], y1 = MY[yj + 1], kind = xi === 2 && yj === 1 ? 'work' : xi === 3 && yj === 2 ? 'brew' : 'house';
  BLOCKS.push({ x0, x1, y0, y1, kind });
  if (kind !== 'house') continue;
  const ix0 = x0 + SW + 0.8, ix1 = x1 - SW - 0.8, iy0 = y0 + SW + 0.8, iy1 = y1 - SW - 0.8, dd = 3.4;
  const nrow = Math.max(3, Math.floor((ix1 - ix0 + 0.5) / 4.9)), hw = (ix1 - ix0 - (nrow - 1) * 0.5) / nrow;
  for (let k = 0; k < nrow; k++) {
    const hx = ix0 + k * (hw + 0.5);
    HOUSES.push({ x: hx, y: iy0, w: hw, h: dd, cx: hx + hw / 2, cy: iy0 + dd / 2 }, { x: hx, y: iy1 - dd, w: hw, h: dd, cx: hx + hw / 2, cy: iy1 - dd / 2 });
  }
}
const WORK = { x: 50 + SW + 0.8, y: 20 + SW + 0.8, w: 24 - 2 * SW - 1.6, h: 15 - 2 * SW - 1.6 }, BREW = { x: 74 + SW + 0.8, y: 35 + SW + 0.8, w: 18 - 2 * SW - 1.6, h: 15 - 2 * SW - 1.6 };
const mulberry = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const DOTS = {};
function dotsFor(ci) { // invented dot positions: houses near the pump get most of them
  if (DOTS[ci]) return DOTS[ci];
  const rnd = mulberry(1854 + ci * 17), P = PUMPS[ci];
  const w = HOUSES.map((hs) => Math.exp(-((hs.cx - P.x) ** 2 + (hs.cy - P.y) ** 2) / (2 * 81)) + 0.012), out = [];
  for (let i = 0; i < NDOT; i++) {
    if (ci === TRUE && i === WH_DOT) { out.push({ x: WORK.x + WORK.w * 0.42, y: WORK.y + WORK.h * 0.62 }); continue; }
    const tot = w.reduce((a, b) => a + b, 0); let r = rnd() * tot, j = 0;
    for (; j < w.length - 1; j++) { r -= w[j]; if (r <= 0) break; }
    w[j] *= 0.55;
    const hs = HOUSES[j];
    out.push({ x: hs.x + 0.8 + rnd() * (hs.w - 1.6), y: hs.y + 0.8 + rnd() * (hs.h - 1.6) });
  }
  return (DOTS[ci] = out);
}

// --- drawing helpers -----------------------------------------------------------------------------------------
const F = (px, wt = 800) => `${wt} ${px}px Nunito, sans-serif`;
function pill(c, text, x, y, o = {}) { // dark rounded label centred on x,y, kept inside the canvas
  c.font = F(o.size || 12); const tw = c.measureText(text).width + 16, th = 22;
  const px = clamp(x - tw / 2, 4, Math.max(4, S.w - tw - 4)), py = clamp(y - th / 2, 4, Math.max(4, S.h - th - 4));
  c.fillStyle = o.bg || 'rgba(10,12,20,.84)'; c.beginPath(); c.roundRect(px, py, tw, th, 11); c.fill();
  if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = 1.2; c.stroke(); }
  c.fillStyle = o.fg || '#edeff7'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, px + tw / 2, py + th / 2 + 1);
  return { x: px, y: py, w: tw, h: th };
}
function panel(c, x, y, w, h) {
  c.beginPath(); c.roundRect(x, y, w, h, 14); c.fillStyle = 'rgba(14,17,28,.72)'; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(130,145,190,.30)'; c.stroke();
}

// bar chart (or a rose) of the daily cases from..to; `sh` is the day shown (a float), o = { vals, every, handle, hi, rose }
function drawChart(c, R, from, to, sh, o) {
  const t = T[lang];
  panel(c, R.x, R.y, R.w, R.h);
  c.font = F(12); c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = '#c6cde0';
  c.fillText(t.cv.chart, R.x + 12, R.y + 16);
  const n = to - from + 1, padL = 34, padR = 10, padT = 32, padB = 36;
  const px = R.x + padL, py = R.y + padT, pw = R.w - padL - padR, ph = R.h - padT - padB, base = py + ph, slot = pw / n;
  const showTick = (idx) => o.every || (idx - from) % 3 === 0;
  if (o.rose) {
    const cx = px + pw / 2, cy = py + ph / 2 + 2, Rr = Math.max(20, Math.min(pw / 2 - 18, ph / 2 - 6));
    c.strokeStyle = 'rgba(130,145,190,.22)'; c.lineWidth = 1;
    for (const v of [50, YMAX]) { c.beginPath(); c.arc(cx, cy, Rr * Math.sqrt(v / YMAX), 0, Math.PI * 2); c.stroke(); }
    const step = Math.PI * 2 / n;
    for (let k = 0; k < n; k++) {
      const idx = from + k, val = DAYS[idx][2], f = eo(sh - idx + 1), a0 = -Math.PI / 2 + k * step, a1 = a0 + step * 0.94, r = Math.max(0, Rr * Math.sqrt(val / YMAX) * f);
      if (r > 0.5) {
        const g = c.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, r)), after = o.handle !== undefined && idx >= o.handle;
        g.addColorStop(0, after ? '#2f7f95' : '#d8754a'); g.addColorStop(1, after ? '#6cc6d4' : '#f4c05a');
        c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, r, a0, a1); c.closePath(); c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(10,12,20,.55)'; c.lineWidth = 1; c.stroke();
      }
      if (showTick(idx)) {
        const am = (a0 + a1) / 2; c.font = F(12); c.fillStyle = '#98a0b8'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(String(DAYS[idx][1]), cx + Math.cos(am) * (Rr + 12), cy + Math.sin(am) * (Rr + 12));
      }
    }
    c.font = F(12); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#98a0b8'; c.fillText(t.cv.rose, R.x + R.w / 2, R.y + R.h - 12);
    return;
  }
  // grid and y labels
  c.font = F(12); c.textAlign = 'right'; c.textBaseline = 'middle';
  for (const v of [0, 50, 100, 150]) {
    const yy = base - ph * v / YMAX;
    c.strokeStyle = v === 0 ? 'rgba(190,205,255,.45)' : 'rgba(130,145,190,.16)'; c.lineWidth = 1; c.beginPath(); c.moveTo(px, yy); c.lineTo(px + pw, yy); c.stroke();
    c.fillStyle = '#98a0b8'; c.fillText(String(v), px - 6, yy);
  }
  const bw = slot * 0.7, tops = [];
  for (let k = 0; k < n; k++) {
    const idx = from + k, val = DAYS[idx][2], f = eo(sh - idx + 1), bx = px + k * slot + (slot - bw) / 2;
    let bh = ph * val / YMAX * f; if (val > 0 && f > 0.02) bh = Math.max(bh, 2);
    tops[k] = base - bh;
    if (bh > 0.5) {
      const after = o.handle !== undefined && idx >= o.handle, g = c.createLinearGradient(0, base - bh, 0, base);
      g.addColorStop(0, after ? '#6cc6d4' : '#f4c05a'); g.addColorStop(1, after ? '#2f7f95' : '#d8754a');
      const rr = Math.min(4, bw / 2, bh);
      c.fillStyle = g; c.beginPath(); c.roundRect(bx, base - bh, bw, bh, [rr, rr, 0, 0]); c.fill();
      c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(bx + 1, base - bh + 1, Math.max(1, bw * 0.22), Math.max(0, bh - 2));
    }
    c.textBaseline = 'alphabetic';
    if (o.vals && slot >= 30 && f > 0.95 && val > 0) { c.font = F(12, 900); c.fillStyle = '#edeff7'; c.textAlign = 'center'; c.fillText(String(val), bx + bw / 2, Math.max(R.y + 28, base - bh - 5)); }
    if (showTick(idx)) { c.font = F(12); c.fillStyle = '#98a0b8'; c.textAlign = 'center'; c.fillText(String(DAYS[idx][1]), bx + bw / 2, base + 15); }
    if (DAYS[idx][1] === 1 || k === 0) { c.font = F(12); c.fillStyle = '#c6cde0'; c.textAlign = 'left'; c.fillText(t.mon[DAYS[idx][0] - 8], bx - 2, base + 30); }
  }
  // the handle: a dashed marker at 8 Sep
  if (o.handle !== undefined) {
    const lx = px + (o.handle - from) * slot;
    c.setLineDash([4, 4]); c.strokeStyle = 'rgba(108,198,212,.9)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(lx, py - 4); c.lineTo(lx, base); c.stroke(); c.setLineDash([]);
    pill(c, t.cv.handleMark(dstr(o.handle)), lx + 70, base - ph * 0.42, { stroke: 'rgba(108,198,212,.8)' });
  }
  // after the answer: the fall that came before the handle
  if (o.hi) {
    const [a, b] = o.hi, xa = px + (a - from) * slot + slot / 2, xb = px + (b - from) * slot + slot / 2, ya = tops[a - from] - 6, yb = tops[b - from] - 6;
    c.setLineDash([5, 4]); c.strokeStyle = '#ffd66b'; c.lineWidth = 2; c.beginPath(); c.moveTo(xa + 4, ya); c.lineTo(xb, yb); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#ffd66b'; c.beginPath(); c.moveTo(xb + 5, yb + 1); c.lineTo(xb - 4, yb - 6); c.lineTo(xb - 4, yb + 7); c.closePath(); c.fill();
    pill(c, String(DAYS[a][2]), xa - 24, tops[a - from] + 12, { stroke: '#ffd66b', fg: '#ffd66b' });
    pill(c, String(DAYS[b][2]), xb, tops[b - from] - 18, { stroke: '#ffd66b', fg: '#ffd66b' });
    pill(c, t.cv.already, px + (a - from) * slot + slot * 1.5 + 56, py + 6, { stroke: '#ffd66b', fg: '#ffd66b' });
  }
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  S.w = w; S.h = h;
  const v = lab.view;
  if (S.play && S.play.v === v) { // timed replay: one more day every step
    S.play.t += dt;
    if (S.play.t >= (v === 'count' ? 0.6 : 0.2)) {
      S.play.t = 0;
      const k = v === 'count' ? 'd1' : 'd3', mx = v === 'count' ? V1_TO : V3_TO;
      if (S[k] < mx) { S[k]++; sfx.tick(); } else S.play = null;
      render();
    }
  }
  const sp = (a, b) => a + clamp(b - a, -dt * Math.max(2, Math.abs(b - a) * 5), dt * Math.max(2, Math.abs(b - a) * 5));
  S.sh1 = sp(S.sh1, S.d1); S.sh3 = sp(S.sh3, S.d3);
  S.dsh1 += clamp((S.p1 !== null ? dotsAt(S.d1) : 0) - S.dsh1, -dt * 30, dt * 30);

};

  else if (act === 'p3') { S.p3 = b.dataset.v; (S.p3 === 'no' ? sfx.good : sfx.bad)(); showStage(); }

});

  let best = -1, bd = 26;
  S.geo.pumps.forEach((p, i) => { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = i; } });

  if (S.rose) st = { emo: '🌹', title: t.rose.t, lead: t.rose.l, body: t.rose.b };

  else st = { emo: S.p1 === 'no' ? '✅' : '🤔', title: S.p1 === 'no' ? t.v1.rightT : t.v1.wrongT, lead: t.v1.lead, body: t.v1.body };
  lab.setState({ ...st, extra: fineBox(t) });
  lab.setFacts(S.rose ? [t.facts.rose1, t.facts.rose2] : [t.facts.start, t.facts.doc, t.facts.data]);
}
function renderMap(t) {
  lab.setGlow('rgba(217, 130, 95, .22)');
  const n2 = dotsAt(END_MAP), an = S.p2 !== null;
  let html;
  if (S.pumpMode) html = `<div class="sn-chips chips">${PUMPS.map((p, i) => `<button class="chip ${S.alt === i ? 'on' : ''}" type="button" data-act="pick" data-i="${i}">${esc(t.v2.pumpL(p.L))}</button>`).join('')}</div><div class="sn-chips chips">${secChip(t, 'pump', '🔀')}</div>`;
  else if (!an) html = `<div class="sn-q">${esc(t.v2.q)}</div><div class="sn-opts">${PUMPS.map((p, i) => `<button class="chip" type="button" data-act="pick" data-i="${i}">${esc(t.v2.pumpL(p.L))}</button>`).join('')}</div>`;
  else html = `<div class="sn-chips chips"><button class="chip ${S.sel === 'brew' ? 'on' : ''}" type="button" data-act="bld" data-k="brew">${esc(t.v2.brew)}</button><button class="chip ${S.sel === 'work' ? 'on' : ''}" type="button" data-act="bld" data-k="work">${esc(t.v2.work)}</button>${secChip(t, 'pump', '🔀')}</div>`;
  $('q2').innerHTML = html;
  lab.setReadout(n2, t.dotsSub(n2), an ? `📍 ${t.v2.pumpL(PUMPS[S.p2].L)}` : '', '#d9825f');
  let st;
  if (S.pumpMode) st = { emo: '🔀', title: t.alt.t(PUMPS[S.alt].L), lead: t.alt.l(PUMPS[S.alt].L), body: t.alt.b };
  else if (!an) st = { emo: '📍', title: t.v2.q, lead: t.v2.pre, body: '' };
  else if (S.sel === 'brew') st = { emo: '🍺', title: t.v2.brewT, lead: t.v2.brewL, body: t.v2.brewB };
  else if (S.sel === 'work') st = { emo: '🏠', title: t.v2.workT, lead: t.v2.workL, body: t.v2.workB };
  else { const ok = S.p2 === TRUE; st = { emo: ok ? '✅' : '🤔', title: ok ? t.v2.rightT : t.v2.wrongT(PUMPS[S.p2].L), lead: t.v2.lead, body: t.v2.body }; }
  lab.setState({ ...st, extra: fineBox(t) });
  lab.setFacts(an ? [t.facts.cells, t.facts.cess, t.facts.wh] : [t.facts.wh]);
}
function renderTest(t) {
  lab.setGlow('rgba(108, 198, 212, .22)');
  if ($('r3').value !== String(S.d3)) $('r3').value = S.d3;
  $('dl3').textContent = `${t.dayL}: ${dstr(S.d3)}`;
  const cards = t.v3.cards;
  $('q3').innerHTML = S.p3 === null ? yesNo('p3', t.v3.q, t.v3.yes, t.v3.no)
    : `<div class="sn-chips chips">${cards.map((k) => `<button class="chip ${S.card === k.k ? 'on' : ''}" type="button" data-act="card" data-k="${k.k}">${k.e} ${esc(k.n)}</button>`).join('')}</div><div class="sn-chips chips">${secChip(t, 'rose', '🌹')}</div>`;
  lab.setReadout(DAYS[S.d3][2], t.newCases(dstr(S.d3)), S.d3 >= HANDLE ? t.handleOff : t.handleOn, '#6cc6d4');
  const card = S.p3 !== null ? cards.find((k) => k.k === S.card) : null;
  let st;
  if (S.rose) st = { emo: '🌹', title: t.rose.t, lead: t.rose.l, body: t.rose.b };
  else if (S.p3 === null) st = { emo: '🔧', title: t.v3.q, lead: t.v3.pre, body: '' };
  else if (card) st = { emo: card.e, title: card.t, lead: card.l, body: card.b };
  else st = { emo: S.p3 === 'no' ? '✅' : '🤔', title: S.p3 === 'no' ? t.v3.rightT : t.v3.wrongT, lead: t.v3.lead, body: t.v3.body };
  lab.setState({ ...st, extra: fineBox(t) });
  lab.setFacts(S.rose ? [t.facts.rose1, t.facts.rose2] : S.p3 === null ? [t.facts.y1849] : [t.facts.flee, t.facts.germ]);
}
render();
