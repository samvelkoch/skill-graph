const TOPICS = [{ id: 'mt_oderfUBZPw', en: 'Histograms', ru: 'Гистограммы', hu: 'Hisztogramok' }];

// --- data: 60 heights, seeded, mean about 150 cm, sd about 9 -----------------------------------------------
const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const DATA = (() => { const r = rng(10), a = []; for (let i = 0; i < 60; i++) { const u = 1 - r(), v = r(); a.push(clamp(Math.round((150 + 9 * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v)) * 10) / 10, 121, 179)); } return a; })();
const MEAN = DATA.reduce((a, b) => a + b, 0) / 60, SD = Math.sqrt(DATA.reduce((a, b) => a + (b - MEAN) ** 2, 0) / 60);
const WS = [2, 3, 4, 5, 6, 10, 12, 15, 20]; // widths that divide 60 cm: every bin is equal
const countsOf = (w) => { const n = 60 / w, c = new Array(n).fill(0); DATA.forEach((x) => { c[Math.min(n - 1, Math.floor((x - 120) / w))]++; }); return c; };
const C10 = countsOf(10), TOP = C10.indexOf(Math.max(...C10));
const binName = (i) => `${120 + i * 10}–${130 + i * 10}`;
const SETS = [true, false, true, false]; // which of the four datasets are histograms
const FRUIT = [8, 5, 3, 6], FRUIT_C = ['#e0605f', '#e8c050', '#8f7fd0', '#e09050'], FRUIT_E = ['🍎', '🍌', '🍇', '🍊'];
const ease = (p) => 1 - (1 - p) ** 3;
const niceStep = (m) => [1, 2, 5, 10, 20].find((s) => m / s <= 5) || 20;

// --- state -------------------------------------------------------------------------------------------------

const B = { pick: null, phase: 'pick', t: 0, last: 0 }; // build: pick -> drop -> done
const V = { i: 0, ans: null, right: [] };
const SLOT = (() => { const k = new Array(6).fill(0); return DATA.map((x) => { const b = Math.min(5, Math.floor((x - 120) / 10)); return { b, k: k[b]++ }; }); })();
const DROP_GAP = 0.1, FALL = 0.55, DROP_END = 59 * DROP_GAP + FALL;

// --- drawing helpers ---------------------------------------------------------------------------------------
const tag = (c, txt, x, y, al = 'center', col = '#fff') => {
  c.save(); c.font = '700 12px Nunito, system-ui, sans-serif'; c.textBaseline = 'middle';
  const w = c.measureText(txt).width + 14; let x0 = al === 'center' ? x - w / 2 : al === 'left' ? x : x - w;
  c.fillStyle = 'rgba(10,14,28,.78)'; c.beginPath(); c.roundRect(x0, y - 10, w, 20, 10); c.fill();
  c.fillStyle = col; c.textAlign = 'left'; c.fillText(txt, x0 + 7, y + 1); c.restore();
};
const txt = (c, s, x, y, al = 'center', col = '#9aa6c8') => { c.fillStyle = col; c.font = '700 12px Nunito, system-ui, sans-serif'; c.textAlign = al; c.textBaseline = 'alphabetic'; c.fillText(s, x, y); };
const barFill = (c, y0, y1, a, b) => { const g = c.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; };
const panel = (c, x, y, w, h) => { c.fillStyle = barFill(c, y, y + h, 'rgba(36,46,80,.55)', 'rgba(18,24,46,.55)'); c.beginPath(); c.roundRect(x, y, w, h, 14); c.fill(); };
const xAxis = (c, x0, x1, y, ticks) => {
  c.strokeStyle = 'rgba(170,185,230,.6)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
  ticks.forEach((v) => { const x = x0 + ((v - 120) / 60) * (x1 - x0); c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 4); c.stroke(); txt(c, String(v), x, y + 17); });
};
const BAR_A = '#6cb6e6', BAR_B = '#3a78b4';

// --- the three pictures --------------------------------------------------------------------------------------
function drawBins(c, w, h, dt) {
  const wd = WS[S.wi], cs = countsOf(wd), n = cs.length;
  const x0 = 38, x1 = w - 14, y0 = 30, y1 = h - 40, pw = x1 - x0, ph = y1 - y0;
  panel(c, 6, 6, w - 12, h - 12);
  const peak = S.sec === 'bell' ? 60 * wd * Math.exp(0) / (SD * Math.sqrt(2 * Math.PI)) : 0;
  const yt = Math.max(...cs, peak) * 1.12;
  S.ym += (yt - S.ym) * Math.min(1, dt * 9);
  const step = niceStep(S.ym), Y = (v) => y1 - (v / S.ym) * ph;
  c.lineWidth = 1;
  for (let v = 0; v <= S.ym; v += step) { c.strokeStyle = 'rgba(160,175,220,.14)'; c.beginPath(); c.moveTo(x0, Y(v)); c.lineTo(x1, Y(v)); c.stroke(); if (v > 0) txt(c, String(v), x0 - 6, Y(v) + 4, 'right'); }
  tag(c, T[lang].axY, x0 - 4, 20, 'left');
  if (S.sec === 'rose') return drawRose(c, w, h, dt, cs);
  xAxis(c, x0, x1, y1, [120, 130, 140, 150, 160, 170, 180]);
  tag(c, T[lang].axX, x1, h - 11, 'right');
  const bw = pw / n;
  c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 8; c.shadowOffsetY = 2;
  cs.forEach((v, i) => { if (!v) return; c.fillStyle = barFill(c, Y(v), y1, BAR_A, BAR_B); c.fillRect(x0 + i * bw, Y(v), bw, y1 - Y(v)); });
  c.restore();
  c.strokeStyle = 'rgba(12,24,52,.85)'; c.lineWidth = bw > 6 ? 1.5 : 1;
  cs.forEach((v, i) => { if (v) c.strokeRect(x0 + i * bw, Y(v), bw, y1 - Y(v)); });
  c.fillStyle = 'rgba(255,255,255,.18)'; cs.forEach((v, i) => { if (v) c.fillRect(x0 + i * bw + 1, Y(v) + 1, Math.max(0, bw - 2), 3); });
  if (bw >= 26) cs.forEach((v, i) => { if (v && y1 - Y(v) > 20) txt(c, String(v), x0 + (i + 0.5) * bw, Y(v) + 15, 'center', '#fff'); });
  if (S.sec === 'bell') {
    c.beginPath(); c.strokeStyle = '#f0c050'; c.lineWidth = 3; c.lineJoin = 'round';
    for (let k = 0; k <= 120; k++) { const hh = 120 + k / 2, px = x0 + (k / 120) * pw, py = Y(60 * wd * Math.exp(-0.5 * ((hh - MEAN) / SD) ** 2) / (SD * Math.sqrt(2 * Math.PI))); k ? c.lineTo(px, py) : c.moveTo(px, py); }
    c.stroke();
  }
}
function drawRose(c, w, h, dt, cs) {
  S.roseT = Math.min(1.6, S.roseT + dt / 1.2);
  const n = cs.length, cx = w / 2, cy = h / 2 + 4, R = Math.min(w - 40, h - 40) / 2, mx = Math.max(...cs);
  c.strokeStyle = 'rgba(160,175,220,.2)'; c.lineWidth = 1;
  [0.33, 0.66, 1].forEach((f) => { c.beginPath(); c.arc(cx, cy, R * f, 0, 7); c.stroke(); });
  cs.forEach((v, i) => {
    const e = ease(clamp(S.roseT - (i / n) * 0.6, 0, 1)), r = Math.max(0, R * Math.sqrt(v / mx) * e), a0 = -Math.PI / 2 + (i / n) * Math.PI * 2, a1 = a0 + (Math.PI * 2) / n;
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, r)); g.addColorStop(0, `hsl(${340 + (i / n) * 50} 70% 48%)`); g.addColorStop(1, `hsl(${340 + (i / n) * 50} 78% 66%)`);
    c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, r, a0, a1); c.closePath(); c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(12,16,34,.8)'; c.lineWidth = 1.2; c.stroke();
  });
}
function drawBuild(c, w, h, dt, time) {
  const x0 = 14, x1 = w - 14, y1 = h - 40, y0 = 40, pw = x1 - x0, bw = pw / 6, d = Math.min(bw / 4, (y1 - y0) / 7.6);
  panel(c, 6, 6, w - 12, h - 12);
  const t = B.phase === 'pick' ? 0 : time - B.t, landed = new Array(6).fill(0);
  if (B.phase === 'drop' && t > DROP_END) { B.phase = 'done'; render(); }
  const prog = (i) => clamp((t - i * DROP_GAP) / FALL, 0, 1);
  DATA.forEach((_, i) => { if (B.phase !== 'pick' && prog(i) >= 1) landed[SLOT[i].b]++; });
  const done = B.phase === 'done', tot = landed.reduce((a, b) => a + b, 0);
  if (tot !== B.last) { B.last = tot; if (B.phase === 'drop') render(); }
  c.lineWidth = 1; c.strokeStyle = 'rgba(160,175,220,.12)';
  for (let i = 0; i <= 6; i++) { c.beginPath(); c.moveTo(x0 + i * bw, y0 - 14); c.lineTo(x0 + i * bw, y1); c.stroke(); }
  xAxis(c, x0, x1, y1, [120, 130, 140, 150, 160, 170, 180]);
  tag(c, T[lang].axX, x1, h - 11, 'right');
  for (let b = 0; b < 6; b++) { // bars that grow from the dots
    const rows = Math.ceil(landed[b] / 4); if (!rows) continue;
    const bx = x0 + b * bw, bh = rows * d; c.fillStyle = barFill(c, y1 - bh, y1, 'rgba(108,182,230,.35)', 'rgba(58,120,180,.5)'); c.fillRect(bx, y1 - bh, bw, bh);
    c.strokeStyle = 'rgba(12,24,52,.85)'; c.lineWidth = 1.5; c.strokeRect(bx, y1 - bh, bw, bh);
  }
  const pk = (b, col, dash) => { c.save(); c.strokeStyle = col; c.lineWidth = 2.5; c.setLineDash(dash); c.beginPath(); c.roundRect(x0 + b * bw + 2, y0 - 12, bw - 4, y1 - y0 + 12, 8); c.stroke(); c.restore(); };
  if (B.pick !== null) pk(B.pick, done && B.pick === TOP ? '#6fd08c' : '#f0c050', done ? [] : [6, 4]);
  if (done && B.pick !== TOP) pk(TOP, '#6fd08c', []);
  if (B.phase === 'pick' && B.pick === null) tag(c, '👆 ' + T[lang].bd.pick, w / 2, 24);
  DATA.forEach((_, i) => {
    const p = prog(i); if (B.phase === 'pick' || p <= 0) return;
    const { b, k } = SLOT[i], sx = x0 + b * bw + bw / 2 - 2 * d + (k % 4) * d + d / 2, sy = y1 - (Math.floor(k / 4) + 0.5) * d, fy = y0 - 12;
    const py = p < 1 ? lerp(fy, sy, p * p) : sy, r = Math.max(0, d * 0.4);
    c.save(); c.globalAlpha = 1; c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.arc(sx + 1, py + 2, r, 0, 7); c.fill();
    const g = c.createRadialGradient(sx - r * 0.35, py - r * 0.35, 0, sx, py, r); g.addColorStop(0, '#d6eeff'); g.addColorStop(1, '#4a8fd0');
    c.fillStyle = g; c.beginPath(); c.arc(sx, py, r, 0, 7); c.fill(); c.restore();
  });
}
function drawVs(c, w, h) {
  const t = T[lang].vs, half = h / 2, shown = V.ans !== null, correct = SETS[Math.min(V.i, 3)] ? 'hist' : 'bar';
  const region = (y, kind) => {
    const ok = shown && V.i < 4 && correct === kind;
    panel(c, 6, y + 4, w - 12, half - 8);
    if (ok) { c.save(); c.strokeStyle = '#6fd08c'; c.lineWidth = 2.5; c.beginPath(); c.roundRect(6, y + 4, w - 12, half - 8, 14); c.stroke(); c.restore(); }
    c.save(); c.beginPath(); c.rect(10, y + 6, w - 20, 20); c.clip(); txt(c, kind === 'bar' ? t.barT : t.histT, 18, y + 21, 'left', '#fff'); c.restore();
    if (V.right.length || V.ans !== null) tag(c, kind === 'bar' ? t.barN : t.histN, w - 14, y + 46, 'right', '#f0c050');
  };
  region(0, 'bar'); region(half, 'hist');
  const x0 = 24, x1 = w - 24, pw = x1 - x0;
  { // bar chart with gaps
    const y1 = half - 30, y0 = 62, slot = pw / 4, bw = slot * 0.6, mx = 8;
    c.strokeStyle = 'rgba(170,185,230,.6)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x0, y1); c.lineTo(x1, y1); c.stroke();
    FRUIT.forEach((v, i) => {
      const bh = (v / mx) * (y1 - y0), bx = x0 + i * slot + (slot - bw) / 2;
      c.save(); c.shadowColor = 'rgba(0,0,0,.3)'; c.shadowBlur = 6; c.shadowOffsetY = 2; c.fillStyle = barFill(c, y1 - bh, y1, FRUIT_C[i], '#2a3a66'); c.beginPath(); c.roundRect(bx, y1 - bh, bw, bh, [5, 5, 0, 0]); c.fill(); c.restore();
      c.font = '16px serif'; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.globalAlpha = 1; c.fillStyle = '#fff'; c.fillText(FRUIT_E[i], bx + bw / 2, y1 + 20);
    });
  }
  { // histogram: the same shape of drawing, bars touching
    const y1 = half + half - 38, y0 = half + 62, bw = pw / 6, mx = Math.max(...C10);
    c.strokeStyle = 'rgba(170,185,230,.6)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x0, y1); c.lineTo(x1, y1); c.stroke();
    C10.forEach((v, i) => { const bh = (v / mx) * (y1 - y0); c.fillStyle = barFill(c, y1 - bh, y1, BAR_A, BAR_B); c.fillRect(x0 + i * bw, y1 - bh, bw, bh); c.strokeStyle = 'rgba(12,24,52,.85)'; c.lineWidth = 1.5; c.strokeRect(x0 + i * bw, y1 - bh, bw, bh); });
    [120, 140, 160, 180].forEach((v) => { const x = x0 + ((v - 120) / 60) * pw; c.strokeStyle = 'rgba(170,185,230,.6)'; c.beginPath(); c.moveTo(x, y1); c.lineTo(x, y1 + 4); c.stroke(); txt(c, String(v), x, y1 + 17); });
  }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'bins') drawBins(c, w, h, dt); else if (v === 'build') drawBuild(c, w, h, dt, time); else drawVs(c, w, h);
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const resetBuild = () => { B.pick = null; B.phase = 'pick'; B.last = 0; };
$('hsW').addEventListener('input', (ev) => { S.wi = +ev.target.value; sfx.tick(); render(); });
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'build' || B.phase !== 'pick') return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, bw = (r.width - 28) / 6, b = Math.floor((x - 14) / bw);
  if (b >= 0 && b < 6) { B.pick = b; sfx.click(); render(); }
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-a]'); if (!b) return;
  S.answer = +b.dataset.a; S.asked = true; S.wi = 8; (S.answer === 3 ? sfx.good : sfx.bad)(); showStage(); render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; if (S.sec === 'rose') S.roseT = 0; sfx.click();
  } else if (act === 'drop' && B.pick !== null && B.phase === 'pick') { B.phase = 'drop'; B.t = performance.now() / 1000; sfx.click(); showStage(); }
  else if (act === 'again') { resetBuild(); sfx.click(); }
  else if (act === 'vsans') { if (V.ans !== null) return; V.ans = b.dataset.k; const ok = (V.ans === 'hist') === SETS[V.i]; V.right[V.i] = ok; (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'vsnext') { V.i++; V.ans = null; sfx.click(); }
  else if (act === 'vsagain') { V.i = 0; V.ans = null; V.right = []; sfx.click(); }
  render();
});

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secBins').style.display = v === 'bins' ? 'block' : 'none';
  $('secBuild').style.display = v === 'build' ? 'block' : 'none';
  $('secVs').style.display = v === 'vs' ? 'block' : 'none';
  askEl.style.display = v === 'bins' && !S.asked ? 'block' : 'none';
  lab.setFacts(t.facts);
  if (v === 'bins') renderBins(t); else if (v === 'build') renderBuild(t); else renderVs(t);
}
function renderBins(t) {
  const wd = WS[S.wi], n = 60 / wd, a = t.ask, open = secret.unlocked();
  lab.setGlow('rgba(95, 168, 208, .26)');
  $('hsW').value = S.wi; $('hsW').disabled = !S.asked; $('hsL').textContent = t.binW; $('hsV').textContent = t.cm(wd);
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('hsSec').innerHTML = sc('bell', '🔔') + sc('rose', '🌹');
  if (!S.asked) {
    askEl.innerHTML = `<div class="q">${esc(a.q)}</div><div class="opts">${a.opts.map((k) => `<button data-a="${k}">${esc(a.opt(k))}</button>`).join('')}</div>`;
    lab.setReadout('?', '', '', '#5fa8d0');
    lab.setState({ emo: '🤔', title: a.q, lead: '', body: '', extra: '' }); return;
  }
  lab.setReadout(n, t.sub(wd), t.pill(wd), '#5fa8d0');
  const first = S.answer !== null && wd === 20 && !S.sec;
  if (first) lab.setState({ emo: S.answer === 3 ? '✅' : '🤔', title: S.answer === 3 ? a.right : a.wrong, lead: a.lead(n, wd), body: '', extra: '' });
  else {
    const s = S.sec ? t.st[S.sec] : wd <= 3 ? t.st.thin : wd <= 6 ? t.st.good : wd <= 12 ? t.st.rough : t.st.wide;
    lab.setState({ emo: S.sec === 'bell' ? '🔔' : S.sec === 'rose' ? '🌹' : '📊', title: s[0], lead: s[1], body: '', extra: '' });
  }
}
function renderBuild(t) {
  const b = t.bd, ph = B.phase, nowT = performance.now() / 1000 - B.t, cnt = ph === 'pick' ? 0 : ph === 'done' ? 60 : DATA.filter((_, i) => nowT - i * DROP_GAP >= FALL).length;
  lab.setGlow('rgba(224, 176, 80, .24)');
  $('bDrop').textContent = b.drop; $('bDrop').disabled = B.pick === null || ph !== 'pick'; $('bAgain').textContent = b.again; $('bAgain').hidden = ph === 'pick';
  lab.setReadout(`${cnt}/60`, b.sub, '', '#e0b050');
  if (ph === 'pick') lab.setState({ emo: '🤔', title: b.pick, lead: B.pick === null ? b.lead : b.picked(binName(B.pick)), body: '', extra: '' });
  else if (ph === 'drop') lab.setState({ emo: '⬇️', title: b.falling, lead: '', body: '', extra: '' });
  else {
    const ok = B.pick === TOP;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? b.right : b.wrong, lead: ok ? b.res(binName(TOP), C10[TOP]) : b.resW(binName(TOP), C10[TOP], C10[B.pick]), body: '', extra: '' });
  }
}
function renderVs(t) {
  const q = t.vs, i = V.i, end = i >= 4, k = V.right.filter(Boolean).length, ans = V.ans;
  lab.setGlow('rgba(143, 127, 208, .26)');
  lab.setReadout(`${Math.min(i + (ans !== null ? 1 : 0), 4)}/4`, q.sub, '', '#8f7fd0');
  if (end) {
    $('secVs').innerHTML = `<div class="hs-pick fin"><button data-act="vsagain">${esc(q.again)}</button></div>`;
    lab.setState({ emo: '🏆', title: q.end(k), lead: q.endLead, body: '', extra: '' }); return;
  }
  const dis = ans !== null ? ' disabled' : '';
  $('secVs').innerHTML = `<div class="hs-name">${esc(q.sets[i])}</div><div class="hs-pick"><button data-act="vsans" data-k="bar"${dis}>${esc(q.bar)}</button><button data-act="vsans" data-k="hist"${dis}>${esc(q.hist)}</button></div>`
    + (ans !== null ? `<div class="hs-pick fin"><button data-act="vsnext">${esc(i === 3 ? '🏁' : q.next)}</button></div>` : '');
  if (ans === null) lab.setState({ emo: '🤔', title: q.q, lead: q.sets[i], body: '', extra: '' });
  else { const ok = V.right[i]; lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? q.right : q.wrong, lead: SETS[i] ? q.whyH : q.whyB, body: '', extra: '' }); }
}
render();
