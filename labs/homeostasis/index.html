function resetBody() {
  if (B.hist.length > 8) B.ghost = B.hist.slice();
  B.hist = []; B.t = 0; B.last = -1; B.Tc = 37; B.Tset = B.fever ? FEVER : 37; B.sw = B.vd = B.sh = B.gs = 0; drops.length = 0;
}
// minutes of body time; core temperature in °C, heat in watts
function stepBody(dt) {
  const b = B;
  b.Tset += ((b.fever ? FEVER : 37) - b.Tset) * Math.min(1, dt / 2);
  const s = (b.Tc - b.Tset) + 0.01 * (b.Tair - 24); // what the sensors report: core a bit off, and the skin feels the air
  const tSw = b.sweat ? clamp(s / 0.6, 0, 1) : 0, tVd = b.vess ? clamp(s / 0.5, -1, 1) : 0;
  const tSh = b.shiv ? clamp(-s / 1.2, 0, 1) : 0, tGs = b.goose ? clamp(-s / 0.6, 0, 1) : 0;
  const k = Math.min(1, dt / 0.8);
  b.sw += (tSw - b.sw) * k; b.vd += (tVd - b.vd) * k; b.sh += (tSh - b.sh) * k; b.gs += (tGs - b.gs) * k;
  const G = 8 * (1 + (b.vd > 0 ? 0.8 : 0.5) * b.vd) * (1 - 0.1 * b.gs); // W/K from core to air
  const hDry = G * (b.Tc - b.Tair), hEv = 1000 * b.sw * (b.humid ? 0.1 : 1);
  b.dry = hDry;
  b.Tc = clamp(b.Tc + (90 + (b.run ? 600 : 0) + 350 * b.sh - hDry - hEv) * dt * 60 / 245000, 30, 43);
  b.t += dt;
  if (b.t - b.last >= 0.25) { b.last = b.t; b.hist.push([b.t, b.Tc, b.Tair]); while (b.hist.length && b.hist[0][0] < b.t - 60) b.hist.shift(); }
}
function stepLoop(dt) {
  const p = LP;
  p.r += ((p.Tc - 37) - p.r) / 1.5 * dt;
  p.Tc = clamp(p.Tc + -p.sign * 0.2 * p.r * dt, 34, 42);
  p.t += dt;
  if (p.t - p.last >= 0.25) { p.last = p.t; p.hist.push([p.t, p.Tc]); while (p.hist.length && p.hist[0][0] < p.t - 60) p.hist.shift(); }
}
function stepSugar(dt) {
  const g = SG;
  const ab = 0.03 * g.gut; g.gut = Math.max(0, g.gut - ab * dt);
  g.I += (clamp((g.G - 5.2) / 2.5, 0, 1) - g.I) * Math.min(1, dt / 6);
  g.A += (clamp((4.8 - g.G) / 1.2, 0, 1) - g.A) * Math.min(1, dt / 6);
  const use = 0.02 + 0.12 * g.I * (g.G / 5) + (g.walk > 0 ? 0.06 : 0);
  const liver = 0.02 + 0.09 * g.A * clamp(g.store / 0.15, 0, 1);
  g.G = clamp(g.G + (ab + liver - use) * dt, 1.5, 14);
  g.store = clamp(g.store + (g.I * 0.012 - g.A * 0.012) * dt, 0, 1);
  g.walk = Math.max(0, g.walk - dt);
  g.t += dt; g.ab = ab;
  if (g.t - g.last >= 2) { g.last = g.t; g.hist.push([g.t, g.G]); while (g.hist.length && g.hist[0][0] < g.t - 800) g.hist.shift(); }
}

// --- shapes: graph ------------------------------------------------------------------------------------------
function curve(c, pts, X, Y, k) {
  c.beginPath(); c.moveTo(X(pts[0][0]), Y(pts[0][k]));
  for (let i = 1; i < pts.length - 1; i++) c.quadraticCurveTo(X(pts[i][0]), Y(pts[i][k]), (X(pts[i][0]) + X(pts[i + 1][0])) / 2, (Y(pts[i][k]) + Y(pts[i + 1][k])) / 2);
  const l = pts[pts.length - 1]; c.lineTo(X(l[0]), Y(l[k]));
}
// g: { t, win, lo, hi, ticks, bands, spans, ref:{v,label}, marks, series:[{pts,k,lo,hi,col,w,dash,dot}], r:{lo,hi,ticks}, xt:(a,b)=>[[t,label]], legend:[[col,label]] }
function graph(c, x, y, w, h, g) {
  const ML = 36, MR = g.r ? 36 : 10, MT = 24, MB = 22, px = x + ML, py = y + MT, pw = w - ML - MR, ph = h - MT - MB;
  const t0 = Math.max(0, g.t - g.win), X = (t) => px + (t - t0) / g.win * pw, Yp = (v, lo, hi) => py + ph - (v - lo) / (hi - lo) * ph;
  c.save();

  c.save(); c.beginPath(); c.rect(px, py, pw, ph); c.clip();
  for (const bd of g.bands || []) { c.fillStyle = bd.col; const ya = Yp(bd.b, g.lo, g.hi), yb = Yp(bd.a, g.lo, g.hi); c.fillRect(px, ya, pw, yb - ya); }
  for (const s of g.spans || []) { c.fillStyle = s.col; c.fillRect(X(s.a), py, X(s.b) - X(s.a), ph); }
  c.strokeStyle = 'rgba(190,205,255,.12)'; c.lineWidth = 1; c.beginPath();
  for (const v of g.ticks) { const yy = Math.round(Yp(v, g.lo, g.hi)) + 0.5; c.moveTo(px, yy); c.lineTo(px + pw, yy); }
  c.stroke();
  if (g.ref) { c.setLineDash([5, 5]); c.strokeStyle = 'rgba(237,239,247,.5)'; c.beginPath(); const yy = Yp(g.ref.v, g.lo, g.hi); c.moveTo(px, yy); c.lineTo(px + pw, yy); c.stroke(); c.setLineDash([]); }
  for (const m of g.marks || []) { c.setLineDash([3, 4]); c.strokeStyle = 'rgba(237,239,247,.45)'; c.beginPath(); c.moveTo(X(m.t), py); c.lineTo(X(m.t), py + ph); c.stroke(); c.setLineDash([]); }
  c.lineJoin = 'round'; c.lineCap = 'round';
  for (const s of g.series) {
    if (!s.pts || s.pts.length < 2) continue;
    const Ys = (v) => Yp(v, s.lo, s.hi);
    c.setLineDash(s.dash || []); c.strokeStyle = s.col; c.lineWidth = s.w || 2.5; c.globalAlpha = s.alpha ?? 1;
    curve(c, s.pts, X, Ys, s.k); c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
  }
  c.restore();
  // end dot of the live line
  for (const s of g.series) if (s.dot && s.pts && s.pts.length) {
    const l = s.pts[s.pts.length - 1], dx = X(l[0]), dy = Yp(l[s.k], s.lo, s.hi);
    c.fillStyle = s.col; c.globalAlpha = 0.25; c.beginPath(); c.arc(dx, dy, 8, 0, 7); c.fill(); c.globalAlpha = 1;
    c.beginPath(); c.arc(dx, dy, 4, 0, 7); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.stroke();
  }
  c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.textBaseline = 'middle'; c.textAlign = 'right';
  for (const v of g.ticks) c.fillText(String(v), px - 6, Yp(v, g.lo, g.hi));
  if (g.r) { c.textAlign = 'left'; for (const v of g.r.ticks) c.fillText(String(v), px + pw + 5, Yp(v, g.r.lo, g.r.hi)); }
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (const [tt, lb] of g.xt(t0, t0 + g.win)) { const xx = X(tt); if (xx > px + 14 && xx < px + pw - 10) c.fillText(lb, xx, py + ph + 4); }
  if (g.ref && g.ref.label) pill(c, g.ref.label, px + pw - 36, Yp(g.ref.v, g.lo, g.hi) - 13, px, px + pw);
  // legend
  c.textBaseline = 'middle'; c.textAlign = 'left'; let lx = px;
  for (const [col, lb] of g.legend) {
    c.fillStyle = col; c.beginPath(); c.arc(lx + 4, y + 12, 4, 0, 7); c.fill();
    c.fillStyle = '#D3D9E8'; c.fillText(lb, lx + 12, y + 13); lx += c.measureText(lb).width + 28;
  }
  c.restore();
}

// --- view 3: sugar ------------------------------------------------------------------------------------------
const GLY = Array.from({ length: 16 }, (_, i) => { const a = i * 2.39996, r = Math.sqrt((i + 0.5) / 16); return [Math.cos(a) * r * 0.82, Math.sin(a) * r * 0.72]; });
function spawn(kind, x0, y0, x1, y1, dur, end) {
  if (parts.length > 70) return;
  parts.push({ kind, x0, y0, x1, y1, cx: (x0 + x1) / 2 + (Math.random() - 0.5) * 50, cy: (y0 + y1) / 2 + (Math.random() - 0.5) * 18, t: 0, dur, end });
}
function drawSugar(c, w, h, time, dt) {
  const t = T[lang].s, g = SG, tubeH = clamp(h * 0.1, 24, 34), tubeY = h * 0.46, x0 = 10, x1 = w - 10;
  const pan = { x: w * 0.54, y: h * 0.17, rx: clamp(w * 0.13, 38, 66) }, meal = { x: w * 0.87, y: h * 0.16 };
  const cell = { x: w * 0.22, y: h * 0.8, rx: w * 0.15, ry: h * 0.1 }, liv = { x: w * 0.68, y: h * 0.79, rx: w * 0.2, ry: h * 0.115 };
  // background room
  const bgr = c.createLinearGradient(0, 0, 0, h); bgr.addColorStop(0, '#1a2038'); bgr.addColorStop(1, '#141830'); c.fillStyle = bgr; rr(c, 2, 2, w - 4, h - 4, 16); c.fill();
  // particles spawn
  g.spI += dt * g.I * 2.6; g.spA += dt * g.A * 2.6; g.spD += dt * clamp((g.ab || 0) * 40, 0, 12);
  while (g.spI >= 1) { g.spI -= 1; spawn('ins', pan.x - 10 + Math.random() * 20, pan.y + pan.rx * 0.3, cell.x - cell.rx * 0.4 + Math.random() * cell.rx * 0.8, cell.y - cell.ry, 1.7, () => {
    const toLiver = Math.random() < 0.4;
    spawn('dot', toLiver ? liv.x - 20 + Math.random() * 40 : cell.x - 20 + Math.random() * 40, tubeY + tubeH * 0.4, toLiver ? liv.x : cell.x, toLiver ? liv.y - liv.ry * 0.3 : cell.y - cell.ry * 0.2, 1.1);
  }); }
  while (g.spA >= 1) { g.spA -= 1; spawn('glu', pan.x + Math.random() * 20, pan.y + pan.rx * 0.3, liv.x - 20 + Math.random() * 40, liv.y - liv.ry, 1.9, () => {
    spawn('dot', liv.x, liv.y - liv.ry * 0.4, liv.x - 20 + Math.random() * 40, tubeY + tubeH * 0.45, 1.2); }); }
  while (g.spD >= 1) { g.spD -= 1; spawn('dot', meal.x - 8 + Math.random() * 16, meal.y + 24, meal.x - 8 + Math.random() * 16, tubeY - tubeH * 0.3, 1.0); }
  g.spI = Math.min(g.spI, 3); g.spA = Math.min(g.spA, 3); g.spD = Math.min(g.spD, 3);
  // blood vessel with glucose dots
  const tg = c.createLinearGradient(0, tubeY - tubeH / 2, 0, tubeY + tubeH / 2); tg.addColorStop(0, '#9a3040'); tg.addColorStop(0.5, '#702231'); tg.addColorStop(1, '#4e1824');
  c.fillStyle = tg; c.strokeStyle = '#2a0c14'; c.lineWidth = 2; rr(c, x0, tubeY - tubeH / 2, x1 - x0, tubeH, tubeH / 2); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,200,200,.16)'; rr(c, x0 + 10, tubeY - tubeH / 2 + 3, x1 - x0 - 20, 3, 2); c.fill();
  const cnt = g.G * 6;
  for (let i = 0; i < 64; i++) {
    const a = clamp(cnt - i, 0, 1); if (a <= 0) continue;
    const xx = x0 + 12 + ((i * 37.3 + time * (26 + 12 * hash(i))) % (x1 - x0 - 24)), yy = tubeY + (hash(i + 7) - 0.5) * (tubeH - 12);
    c.globalAlpha = a; c.fillStyle = '#f5c84c'; c.strokeStyle = '#8a6a10'; c.lineWidth = 1; c.beginPath(); c.arc(xx, yy, 3.4, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#fff6c8'; c.beginPath(); c.arc(xx - 1, yy - 1, 1, 0, 7); c.fill(); c.globalAlpha = 1;
  }
  // pancreas
  c.save(); c.translate(pan.x, pan.y); c.rotate(-0.12);
  const pg = c.createLinearGradient(0, -pan.rx * 0.4, 0, pan.rx * 0.4); pg.addColorStop(0, '#f6c3a0'); pg.addColorStop(1, '#d6876a');
  c.fillStyle = pg; c.strokeStyle = '#8a4a38'; c.lineWidth = 1.5; c.beginPath(); c.ellipse(0, 0, pan.rx, pan.rx * 0.38, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = 'rgba(150,70,60,.4)'; for (let i = 0; i < 9; i++) { c.beginPath(); c.arc((hash(i) - 0.5) * pan.rx * 1.5, (hash(i + 9) - 0.5) * pan.rx * 0.45, 2.4, 0, 7); c.fill(); }
  c.restore();
  // meal (the gut): a plate
  const bn = g.bounce > 0 ? Math.sin(g.bounce * 14) * 4 * g.bounce : 0; g.bounce = Math.max(0, g.bounce - dt * 1.5);
  c.fillStyle = 'rgba(255,255,255,.1)'; c.beginPath(); c.ellipse(meal.x, meal.y + 18, 28, 8, 0, 0, 7); c.fill();
  c.save(); c.globalAlpha = 1; c.fillStyle = '#fff'; c.font = '34px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🍝', meal.x, meal.y + bn); c.restore();
  // cells and liver

  cg.addColorStop(0, '#f2a6b8'); cg.addColorStop(1, '#b8506a'); c.fillStyle = cg; c.strokeStyle = '#6e2238'; c.lineWidth = 2; c.beginPath(); c.ellipse(cell.x, cell.y, cell.rx, cell.ry, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#7a2a48'; c.beginPath(); c.ellipse(cell.x + cell.rx * 0.2, cell.y + 2, cell.rx * 0.22, cell.ry * 0.4, 0, 0, 7); c.fill();
  const lg = c.createRadialGradient(liv.x - liv.rx * 0.3, liv.y - liv.ry * 0.4, 4, liv.x, liv.y, liv.rx);
  lg.addColorStop(0, '#b0603f'); lg.addColorStop(1, '#6e3220'); c.fillStyle = lg; c.strokeStyle = '#3a160c'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(liv.x - liv.rx, liv.y + liv.ry * 0.2); c.bezierCurveTo(liv.x - liv.rx, liv.y - liv.ry * 1.2, liv.x + liv.rx * 0.6, liv.y - liv.ry * 1.3, liv.x + liv.rx, liv.y - liv.ry * 0.1);
  c.bezierCurveTo(liv.x + liv.rx * 0.9, liv.y + liv.ry, liv.x - liv.rx * 0.4, liv.y + liv.ry * 1.1, liv.x - liv.rx, liv.y + liv.ry * 0.2); c.fill(); c.stroke();

    if (q.t >= q.dur) { parts.splice(i, 1); q.end?.(q); continue; }
    const px2 = m * m * q.x0 + 2 * m * u * q.cx + u * u * q.x1, py2 = m * m * q.y0 + 2 * m * u * q.cy + u * u * q.y1, al = q.kind === 'dot' ? 1 - 0.7 * u * u : 1;

    else { c.fillStyle = q.kind === 'ins' ? '#6aa7ff' : '#ff9b4a'; c.strokeStyle = '#10131f'; c.lineWidth = 1; c.beginPath(); c.moveTo(px2, py2 - 5.5); c.lineTo(px2 + 4.5, py2); c.lineTo(px2, py2 + 5.5); c.lineTo(px2 - 4.5, py2); c.closePath(); c.fill(); c.stroke(); }

// --- canvas loop --------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {

  let m = dt * SPEED[v];
  if (v === 'heat') { while (m > 0) { const d = Math.min(0.1, m); stepBody(d); m -= d; } }
  else if (v === 'loop') { while (m > 0) { const d = Math.min(0.1, m); stepLoop(d); m -= d; } }
  else { while (m > 0) { const d = Math.min(0.5, m); stepSugar(d); m -= d; } }

  c.lineJoin = 'round'; c.lineCap = 'round';
  if (v === 'heat') drawHeat(c, w, ht, time, dt);
  else if (v === 'loop') drawLoop(c, w, ht, time, dt);

      xt: (a, b) => { const o = []; for (let k = Math.ceil(a / 15); k * 15 <= b; k++) o.push([k * 15, `${k * 15}${T[lang].min}`]); return o; },

const secChip = (k, emo, on) => { const open = secret.unlocked(); return `<button class="hm-chip sec${open ? ' open' : ''}${on ? ' on' : ''}" data-a="sec" data-k="${k}">${open ? `${emo} ${esc(T[lang].secrets[k][0])}` : '🔒 ???'}</button>`; };

$('wx').addEventListener('input', (ev) => { B.Tair = +ev.target.value; B.touched = true; $('wv').textContent = `${B.Tair} °C`; });
$('ctrlBody').addEventListener('click', (ev) => {

    else body = `<div class="hm-row" style="margin-top:0"><span class="hm-lbl">${esc(l.sign)}</span>${chip('sign', l.neg, LP.sign < 0, 'data-s="-1"')}${chip('sign', l.pos, LP.sign > 0, 'data-s="1"')}</div>
      <div class="hm-row">${chip('bump', l.warm, false, 'data-d="1"')}${chip('bump', l.cool, false, 'data-d="-1"')}${chip('lrestart', l.restart, false)}</div>`;
    $('s2').innerHTML = body;
    lab.setFacts(t.facts.l);
  } else {
    const s = t.s, ask = SG.guess === null;
    $('s3').innerHTML = ask ? asked(s.q, s.opts, 'g3') : `<div class="hm-row" style="margin-top:0">${chip('meal', s.meal, false)}${chip('walk', s.walk, SG.walk > 0)}${chip('srestart', s.restart, false)}</div>`;
    lab.setFacts(ask ? [] : t.facts.s);
  }
  renderLive();
}
function renderLive() {
  const v = lab.view, t = T[lang];
  if (v === 'heat') {
    const h = t.h, b = B;
    lab.setReadout(`${fmt(b.Tc)} <small>${t.cs}</small>`, h.sub, h.pill(b.Tair), '#ff5a4d'); lab.setGlow('rgba(255, 90, 77, .25)');
    let st, body = b.sw > 0.05 || b.vd !== 0 ? h.vz[b.vd > 0.3 ? 'wide' : b.vd < -0.3 ? 'narrow' : 'mid'] : '';
    if (b.guess === null) { st = ['🤔', h.q, h.pre]; body = ''; }
    else if (!b.touched && b.t < 40) st = ['🧪', b.guess === 1 ? h.ok : h.no, h.rev];
    else if (b.fever && b.Tc < FEVER - 0.3) st = h.st.fup;
    else if (b.fever) st = h.st.fhold;
    else if (b.fevered && b.Tset > 37.3 && b.Tc > 37.6) st = h.st.fend;
    else if (b.desert && b.run && b.sw > 0.05) st = h.st.desert(fmt(litresPerHour()));
    else if (b.Tc > 40) st = h.st.hot;
    else if (b.Tc < 35.5) st = h.st.cold;
    else if (b.run && !b.sweat && b.Tc > 37.4) st = h.st.stuck;
    else if (b.sw > 0.2) st = b.humid ? h.st.wet : h.st.sweat;
    else if (b.sh > 0.2) st = h.st.shiver;
    else if (b.vd > 0.5) st = h.st.wide;
    else st = h.st.steady;
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body, extra: '' });
  } else if (v === 'loop') {
    const l = t.l, p = LP, done = p.placed.every(Boolean), n = p.placed.filter(Boolean).length - 1;
    lab.setGlow('rgba(143, 127, 208, .26)');
    let st;
    if (!done) {
      const prev = l.nodes[p.placed.indexOf(false) - 1][1];
      lab.setReadout(`${n}/4`, l.progress(n), '', '#8f7fd0');
      st = ['🧩', l.build, p.miss ? l.miss(prev) : l.next(prev)];
    } else if (p.guess === null) {
      lab.setReadout(`${fmt(p.Tc)} <small>${t.cs}</small>`, l.sub, '', '#8f7fd0');
      st = ['🤔', l.q, l.done[2]];
    } else {
      lab.setReadout(`${fmt(p.Tc)} <small>${t.cs}</small>`, l.sub, p.sign < 0 ? l.pillNeg : l.pillPos, '#8f7fd0');
      const dev = Math.abs(p.Tc - 37);
      if (!p.pushed) st = ['🧪', p.guess === 1 ? l.ok : l.no, l.rev];
      else if (p.sign < 0) st = dev > 0.15 ? l.st.negBack : l.st.negIdle;
      else st = dev > 0.15 ? l.st.posRun : l.st.posIdle;
    }
    const atCap = p.sign > 0 && (p.Tc >= 41.95 || p.Tc <= 34.05);
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: atCap ? l.cap : '', extra: '' });
  } else {
    const s = t.s, g = SG;
    lab.setReadout(`${fmt(g.G)} <small>${s.unit}</small>`, s.sub, s.pill(clock(g.t)), '#f5c84c'); lab.setGlow('rgba(245, 200, 76, .22)');
    let st, body = '';
    if (g.guess === null) st = ['🤔', s.q, s.pre];
    else {
      body = s.hor(Math.round(g.I * 100), Math.round(g.A * 100));
      if (!g.touched && g.t < g.tg + 120) st = ['🧪', g.guess === 1 ? s.ok : s.no, s.rev];
      else if (g.A > 0.15) st = s.st.glu;
      else if (g.I > 0.15 && g.G > 5.3) st = s.st.ins;
      else if (g.gut > 0.8) st = s.st.gut;
      else if (g.walk > 0) st = s.st.walk;
      else st = s.st.steady;
    }
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body, extra: '' });
  }
}
render();
</script>
