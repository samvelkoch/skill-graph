// --- drawing helpers -----------------------------------------------------------------------------------------
let G = { s: 1, ox: 0, oy: 0 };
const fs = (d) => Math.max(d, 12 / G.s);
const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, k) => { const x = hex(a), y = hex(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, r)); };
const ease = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const wrap = (c, text, maxW) => {
  const out = [];
  for (const para of text.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const tr = line ? line + ' ' + wd : wd;
      if (line && c.measureText(tr).width > maxW) { out.push(line); line = wd; } else line = tr;
    }

};
function pill(c, text, x, y, o = {}) {
  const size = fs(o.size || 13); c.save(); c.font = `800 ${size}px Nunito, sans-serif`;

}
// a strip of paper with text; frac = how far it has come out of the machine; cover = a blank "?" paper
function paper(c, x, y, w, h, lines, frac = 1, textA = 1, cover = false) {

  c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 14; c.shadowOffsetY = 5;
  const g = c.createLinearGradient(x, y, x + w * .4, y + h); g.addColorStop(0, '#fcf5e0'); g.addColorStop(1, '#e8d8b2');
  c.fillStyle = g; rr(c, x, y, w, h, 8); c.fill(); c.shadowColor = 'transparent';
  c.lineWidth = 1.4; c.strokeStyle = '#a58f5e'; c.stroke();

    c.fillStyle = '#b6a47a'; c.font = `500 ${fs(44)}px 'EB Garamond', Georgia, serif`; c.fillText('?', x + w / 2, y + h / 2 + 3);

}
function lamp(c, x, y, r, col, lv, q, ring) {

}
function brass(c, x, y, w, h, r) {

  const g = c.createLinearGradient(x, y, x + w * .6, y + h); g.addColorStop(0, '#e6b968'); g.addColorStop(.5, '#c28b3c'); g.addColorStop(1, '#8a5c22');

function lampRow(c, x0, y, gap, r, levels, qmark, rings, labelsOn, t) {

  c.save(); c.font = `800 ${fs(13)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#e8d6a8';
  for (let i = 0; i < 4; i++) c.fillText(t.lamps[i], 70 + i * 73.3, 199);
  c.restore();

  const cx = 180, cy = 262, R = 34;
  c.fillStyle = '#7a531d'; c.beginPath(); c.arc(cx, cy, R + 12, 0, TAU); c.fill(); c.strokeStyle = '#4d3210'; c.lineWidth = 2; c.stroke();

  pill(c, S.done1 ? d.outTags[S.pos] : d.outTags[0], 34, 336, { size: 12 });
}

function drawNames(c, t, dt, time) {
  const n = t.n;
  for (let i = 0; i < 4; i++) {
    const cx = i % 2 ? 265 : 95, cy = i < 2 ? 130 : 340, on = S.sel === i && !S.done2;
    S.selA[i] += ((on ? 1.1 : 1) - S.selA[i]) * Math.min(1, dt * 10);
    if (on) {
      c.save(); c.strokeStyle = '#fff'; c.globalAlpha = .55 + .35 * Math.sin(time * 4); c.lineWidth = 2.4; c.setLineDash([5, 6]); c.lineDashOffset = -time * 14;
      c.beginPath(); c.arc(cx, cy, 58, 0, TAU); c.stroke(); c.restore();
    }
    const bob = Math.sin(time * 1.7 + i * 1.3) * 2.2, blink = (time + i * 1.7) % 4 < .12;
    face(c, i, cx, cy + bob, 42, time, S.selA[i], blink);
    pill(c, n.names[i], cx, cy - 74, { center: true, size: 13, bd: on ? '#fff' : undefined });
    const okR = S.ru[i] === i, okH = S.hu[i] === i;
    const row = (lg, arr, name, ok, yy) => {
      const done = S.done2, label = done ? name : arr[i] === null ? '?' : name;
      pill(c, `${lg} · ${label}`, cx, yy, { center: true, size: 13, bg: done ? (ok ? 'rgba(30,110,75,.88)' : 'rgba(120,90,15,.88)') : undefined, bd: done ? (ok ? '#3ddc97' : '#f5c84c') : undefined });
    };
    row('RU', S.ru, S.done2 ? n.ru[i] : S.ru[i] === null ? '' : n.ru[S.ru[i]], okR, cy + 66);
    row('HU', S.hu, S.done2 ? n.hu[i] : S.hu[i] === null ? '' : n.hu[S.hu[i]], okH, cy + 92);
  }
}

function drawTwo(c, t, k) {
  const w = t.w;
  for (let j = 0; j < 2; j++) for (let i = 0; i < 4; i++) S.L3[j][i] += ((S.done3 ? LV3[j][i] : 0) - S.L3[j][i]) * k;
  paper(c, 30, 24, 300, 66, w.src, 1, 1, false); pill(c, w.origTag, 34, 18, { size: 12 });
  const blocks = [[w.A, w.tagA, 118], [w.B, w.tagB, 282]];
  blocks.forEach(([lines, tag, y], j) => {
    paper(c, 30, y, 300, 78, lines, 1, 1, false); pill(c, tag, 34, y - 6, { size: 12 });
    c.fillStyle = 'rgba(10,12,20,.55)'; rr(c, 30, y + 88, 300, 56, 14); c.fill(); c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.stroke();
    lampRow(c, 66, y + 107, 76, 11, S.L3[j], !S.done3, null, 'dark', t);
  });
}
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.s, y = (ev.clientY - r.top - G.oy) / G.s;
  if (S.sec) return;
  if (lab.view === 'names' && !S.done2 && x >= 0 && x <= W && y >= 0 && y <= H) { S.sel = (y < 235 ? 0 : 2) + (x < 180 ? 0 : 1); sfx.tick(); render(); }
  else if (lab.view === 'dial' && S.done1 && Math.hypot(x - 180, y - 262) < 62) { setPos((S.pos + 1) % 3); }
});

// --- actions ---------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function setPos(p) { if (p === S.pos) return; S.pos = p; S.u = 0; S.moved = true; sfx.snap(); render(); }
function assign(arr, idx) {
  const o = arr.indexOf(idx); if (o >= 0) arr[o] = null;
  arr[S.sel] = idx;
  if (S.ru[S.sel] !== null && S.hu[S.sel] !== null) {
    const nx = [1, 2, 3, 0].map((d) => (S.sel + d) % 4).find((j) => S.ru[j] === null || S.hu[j] === null);
    if (nx !== undefined) S.sel = nx;
  }
}
function mainBtn() {
  const v = lab.view;
  if (v === 'dial') {
    if (S.pred.size === 0) return;
    const truth = LV[0].map((x) => x >= .5);
    S.ok1 = truth.every((b, i) => b === S.pred.has(i)); S.done1 = true; S.u = 0; S.moved = false; (S.ok1 ? sfx.good : sfx.bad)(); showStage();
  } else if (v === 'names') {
    if (S.done2) { S.ru = [null, null, null, null]; S.hu = [null, null, null, null]; S.done2 = false; S.sel = 0; sfx.click(); return; }
    if (S.ru.includes(null) || S.hu.includes(null)) return;
    S.done2 = true; sfx.good(); showStage();
  } else {
    if (S.done3) { S.qr = null; S.qm = null; S.done3 = false; sfx.click(); return; }
    if (S.qr === null || S.qm === null) return;
    S.done3 = true; (S.qr === 0 && S.qm === 1 ? sfx.good : sfx.bad)(); showStage();
  }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'lamp') { if (S.pred.has(i)) S.pred.delete(i); else S.pred.add(i); sfx.tick(); }
  else if (a === 'pos') setPos(i);
  else if (a === 'ch') { S.sel = i; sfx.tick(); }
  else if (a === 'ru') { assign(S.ru, i); sfx.click(); }
  else if (a === 'hu') { assign(S.hu, i); sfx.click(); }
  else if (a === 'qr') { S.qr = i; sfx.click(); }
  else if (a === 'qm') { S.qm = i; sfx.click(); }
  else if (a === 'main') mainBtn();
  else if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.hop = 0; sfx.click();
  }
  render();
});
secEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'hop') { S.hop = Math.min(3, S.hop + 1); sfx.snap(); }
  else if (b.dataset.act === 'hopreset') { S.hop = 0; sfx.click(); }
  render();
});

// --- one render per change: controls, readout, state card, facts ------------------------------------------------
const chip = (act, i, label, on, extra = '', dis = false) => `<button class="chip ${on ? 'on' : ''} ${extra}" data-act="${act}" data-i="${i}"${dis ? ' disabled' : ''}>${label}</button>`;
function render() {
  const t = T[lang], v = lab.view;
  $('s1').style.display = v === 'dial' ? '' : 'none';
  $('s2').style.display = v === 'names' ? '' : 'none';
  $('s3').style.display = v === 'two' ? '' : 'none';
  secEl.style.display = S.sec ? '' : 'none';
  const open = secret.unlocked();
  $('secRow').innerHTML = [['back', '🔁'], ['hard', '🧩']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`).join('');
  if (v === 'dial') renderDial(t); else if (v === 'names') renderNames(t); else renderTwo(t);
  if (S.sec) renderSec(t);
  lab.setFacts(t.facts[v]);
  document.body.dataset.v = v;
}
function setMain(label, show, disabled) { const b = $('bMain'); b.hidden = !show || !!S.sec; b.textContent = label; b.disabled = !!disabled; }

function renderDial(t) {
  const d = t.d;
  lab.setGlow('rgba(217, 164, 65, .24)');
  $('q1').textContent = S.done1 ? '' : d.pqT; $('q1').style.display = S.done1 ? 'none' : '';
  $('lampChips').style.display = S.done1 ? 'none' : ''; $('posChips').style.display = S.done1 ? '' : 'none';
  $('lampChips').innerHTML = [0, 1, 2, 3].map((i) => chip('lamp', i, `<span class="tr-dot" style="color:${LC[i]};background:${LC[i]}"></span>${esc(t.lamps[i])}`, S.pred.has(i))).join('');
  $('posChips').innerHTML = [0, 1, 2].map((i) => chip('pos', i, esc(d.pos[i]), S.pos === i)).join('');
  setMain(t.check, !S.done1, S.pred.size === 0);
  if (!S.done1) {
    lab.setReadout('?', d.picked(S.pred.size), '', ACC.dial);
    lab.setState({ emo: '🔁', title: d.pqT, lead: d.pq, body: '', extra: '' });
  } else {
    const lit = LV[S.pos].filter((x) => x >= .5).length, [ti, le] = d.txt[S.pos];
    lab.setReadout(`${lit}/4`, d.lit, d.pos[S.pos], ACC.dial);
    const verdict = !S.moved && S.pos === 0;
    lab.setState({ emo: verdict ? (S.ok1 ? '✅' : '🤔') : '🔁', title: verdict ? (S.ok1 ? d.right : d.wrong) : ti, lead: le, body: d.gloss[S.pos], extra: '' });
  }
}

function renderNames(t) {
  const n = t.n, k = [0, 1, 2, 3].filter((i) => S.ru[i] === i && S.hu[i] === i).length, named = [0, 1, 2, 3].filter((i) => S.ru[i] !== null && S.hu[i] !== null).length;
  lab.setGlow('rgba(224, 166, 78, .24)');
  $('chChips').innerHTML = [0, 1, 2, 3].map((i) => chip('ch', i, esc(n.short[i]), S.sel === i, '', S.done2)).join('');
  $('ruChips').innerHTML = RU_ORDER.map((i) => chip('ru', i, esc(n.ru[i]), S.ru[S.sel] === i, S.ru.includes(i) && S.ru[S.sel] !== i ? 'tr-used' : '', S.done2)).join('');
  $('huChips').innerHTML = HU_ORDER.map((i) => chip('hu', i, esc(n.hu[i]), S.hu[S.sel] === i, S.hu.includes(i) && S.hu[S.sel] !== i ? 'tr-used' : '', S.done2)).join('');
  setMain(S.done2 ? t.again : t.check, true, !S.done2 && named < 4);
  if (!S.done2) {
    lab.setReadout('?', `${named}/4 ${n.named}`, '', ACC.names);
    lab.setState({ emo: '🐻', title: n.qT, lead: n.q, body: '', extra: '' });
  } else {
    lab.setReadout(`${k}/4`, n.right, '', ACC.names);
    const notes = n.notes.map((x, i) => `<p><b>${esc(n.names[i])}.</b> ${esc(x)}</p>`).join('');
    lab.setState({ emo: k === 4 ? '✅' : '🐻', title: k === 4 ? n.ok : `${k}/4 ${n.right}`, lead: n.lead, body: '', extra: notes });
  }
}

function renderTwo(t) {
  const w = t.w, ab = ['A', 'B'], got = (S.qr !== null) + (S.qm !== null), k = (S.qr === 0) + (S.qm === 1);
  lab.setGlow('rgba(95, 180, 255, .22)');
  $('lr').textContent = w.qr; $('lm').textContent = w.qm;
  $('rChips').innerHTML = ab.map((l, i) => chip('qr', i, l, S.qr === i, '', S.done3)).join('');
  $('mChips').innerHTML = ab.map((l, i) => chip('qm', i, l, S.qm === i, '', S.done3)).join('');
  setMain(S.done3 ? t.again : t.check, true, !S.done3 && got < 2);
  if (!S.done3) {
    lab.setReadout('?', `${got}/2 ${w.picked}`, '', ACC.two);
    lab.setState({ emo: '⚖️', title: w.qT, lead: w.q, body: '', extra: '' });
  } else {
    lab.setReadout(`${k}/2`, w.right, '', ACC.two);
    lab.setState({ emo: k === 2 ? '✅' : '⚖️', title: k === 2 ? w.ok : w.no, lead: w.lead, body: '', extra: '' });
  }
}

function renderSec(t) {
  if (S.sec === 'back') {
    const b = t.back, n = S.hop;
    secEl.innerHTML = `<h3>🔁 ${esc(b.title)}</h3><p class="tr-note">${esc(b.note)}</p>` + b.steps.slice(0, n + 1).map(([lg, tx], i) =>
      `${i ? `<div class="tr-arrow">${esc(b.arrow)}</div>` : ''}<div class="tr-step"><span class="tr-lg">${lg}</span><span>${esc(tx)}</span></div>`).join('')
      + (n < 3 ? `<button class="btn" data-act="hop">${esc(b.hop)}</button>` : `<div class="tr-mean">${esc(b.mean)}</div><button class="btn ghost" data-act="hopreset">${esc(b.reset)}</button>`);
    lab.setReadout('🔁', `${n + 1}/4`, '', '#d9a441');
    lab.setState({ emo: '🔁', title: b.title, lead: b.note, body: '', extra: '' });
  } else {
    const h = t.hard;
    secEl.innerHTML = `<h3>🧩 ${esc(h.title)}</h3><p class="tr-note">${esc(h.note)}</p>` + HARD.map((x) => {
      const own = x.l.toLowerCase(), rest = ['en', 'ru', 'hu'].filter((l) => l !== own && l !== lang);
      return `<div class="tr-hard"><div class="w">${esc(x.w)}<small>${x.l}</small></div><p>${esc(x.exp[lang])}</p>${rest.map((l) => `<p class="o"><b>${l.toUpperCase()}</b> ${esc(x.exp[l])}</p>`).join('')}</div>`;
    }).join('');
    lab.setReadout('🧩', '3', '', '#d9a441');
    lab.setState({ emo: '🧩', title: h.title, lead: h.note, body: '', extra: '' });
  }
}
render();
</script>
