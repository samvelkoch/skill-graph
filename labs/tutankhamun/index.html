  poly(c, [[0, h], [dx0, dy0 + dh], [dx0 + dw, dy0 + dh], [w, h]]); c.fillStyle = lg(c, 0, dy0 + dh, 0, h, [[0, '#5a4030'], [1, '#33241a']]); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.5)'; c.lineWidth = 2; c.beginPath(); for (let k = 1; k < 4; k++) { const f = k / 4, y = dy0 + dh + (h - dy0 - dh) * f * f; c.moveTo(dx0 - dx0 * f * f, y); c.lineTo(dx0 + dw + (w - dx0 - dw) * f * f, y); } c.stroke();
  // plaster, rows of seals, a crack
  c.fillStyle = lg(c, dx0, dy0, dx0 + dw, dy0 + dh, [[0, '#f4ead2'], [1, '#cdbb92']]); c.fillRect(dx0, dy0, dw, dh); c.lineWidth = 2; c.strokeStyle = '#6b563a'; c.strokeRect(dx0, dy0, dw, dh);
  for (let r = 0; r < 6; r++) for (let k = 0; k < 4; k++) {
    const x = dx0 + dw * (.14 + k * .24), y = dy0 + dh * (.3 + r * .12);
    c.beginPath(); c.ellipse(x, y, dw * .075, dh * .04, 0, 0, TAU); c.fillStyle = 'rgba(150,120,70,.55)'; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(90,65,30,.7)'; c.stroke();
    c.beginPath(); c.moveTo(x - dw * .03, y + dh * .008); c.lineTo(x - dw * .01, y - dh * .014); c.lineTo(x + dw * .012, y + dh * .008); c.lineTo(x + dw * .03, y - dh * .012); c.stroke();
  }
  c.strokeStyle = 'rgba(90,65,30,.5)'; c.lineWidth = 1.3; c.beginPath(); c.moveTo(dx0 + dw * .62, dy0); c.lineTo(dx0 + dw * .58, dy0 + dh * .12); c.lineTo(dx0 + dw * .64, dy0 + dh * .2); c.stroke();
  // the little hole
  c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fillStyle = '#050307'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#8a7650'; c.stroke();
  const fl = 1 + .12 * Math.sin(time * 17) + .08 * Math.sin(time * 29);
  if (can > .001) {
    const fx = hx - dw * .16, fy = hy + dw * .05, ch = dw * .24, cw_ = dw * .036;
    c.save(); c.globalAlpha = can; c.globalCompositeOperation = 'lighter'; c.fillStyle = rg(c, fx, fy, 2, dw * .62, [[0, `rgba(255,190,90,${.5 * fl})`], [1, 'rgba(255,170,70,0)']]); c.fillRect(0, 0, w, h); c.restore();
    c.save(); c.globalAlpha = can;
    c.strokeStyle = '#d8cfb8'; c.lineWidth = dw * .1; c.lineCap = 'round'; c.beginPath(); c.moveTo(-10, h + 10); c.lineTo(fx - dw * .02, fy + ch + dw * .12); c.stroke();
    c.fillStyle = '#f3ecd8'; c.beginPath(); c.roundRect(fx - cw_ / 2, fy, cw_, ch, 3); c.fill(); c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(fx, fy, cw_ / 2, ch);
    c.beginPath(); c.ellipse(fx, fy + ch + dw * .02, dw * .06, dw * .05, 0, 0, TAU); c.fillStyle = '#c98a5a'; c.fill(); c.lineWidth = 1; c.strokeStyle = '#7a4e2a'; c.stroke();
    c.beginPath(); c.ellipse(fx + dw * .03, fy + ch * .9, dw * .018, dw * .04, .3, 0, TAU); c.fill(); c.stroke();
    const fh = dw * .09 * fl, sway = Math.sin(time * 9) * dw * .008;
    c.beginPath(); c.moveTo(fx - cw_ * .9, fy - 1); c.quadraticCurveTo(fx - cw_ * 1.1, fy - fh * .55, fx + sway, fy - fh); c.quadraticCurveTo(fx + cw_ * 1.1, fy - fh * .5, fx + cw_ * .9, fy - 1); c.closePath();
    c.fillStyle = lg(c, 0, fy - fh, 0, fy, [[0, '#fff4a8'], [.5, '#ffa63a'], [1, '#e0541c']]); c.fill();
    c.beginPath(); c.ellipse(fx, fy - fh * .28, cw_ * .35, fh * .22, 0, 0, TAU); c.fillStyle = 'rgba(120,170,255,.85)'; c.fill();
    c.restore();
  }
  if (gl > .001) { // a round peek into the dark room: strange animals, statues, gold
    const bx = dx0 + dw * .7, by = dy0 + dh * .4, br = dw * .36, a = gl;
    c.save(); c.globalAlpha = a; c.setLineDash([3, 6]); c.strokeStyle = 'rgba(255,229,144,.8)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(hx + hr, hy); c.lineTo(bx - br * .75, by - br * .55); c.stroke(); c.setLineDash([]);
    c.beginPath(); c.arc(bx, by, br, 0, TAU); c.fillStyle = '#07050a'; c.fill();
    c.save(); c.clip();
    const pulse = .8 + .2 * Math.sin(time * 5);
    c.fillStyle = rg(c, bx, by, 2, br, [[0, `rgba(255,190,80,${.4 * pulse})`], [1, 'rgba(255,190,80,0)']]); c.fillRect(bx - br, by - br, br * 2, br * 2);
    const gold = (x, y, r) => lg(c, x - r, y - r, x + r, y + r, [[0, '#FFE590'], [.5, GOLD], [1, '#8a5f14']]);
    // a couch with an animal head
    c.beginPath(); c.roundRect(bx - br * .72, by + br * .18, br * .9, br * .16, 4); c.fillStyle = gold(bx, by, br); c.fill();
    for (const dx of [-.64, .1]) { c.fillRect(bx + br * dx, by + br * .3, br * .09, br * .2); }
    c.beginPath(); c.ellipse(bx - br * .76, by + br * .02, br * .13, br * .17, 0, 0, TAU); c.fill(); c.beginPath(); c.moveTo(bx - br * .85, by - br * .1); c.lineTo(bx - br * .82, by - br * .3); c.lineTo(bx - br * .72, by - br * .12); c.fill();
    // a standing statue
    c.beginPath(); c.roundRect(bx + br * .3, by - br * .1, br * .2, br * .5, 5); c.fillStyle = gold(bx + br * .4, by, br * .3); c.fill(); c.beginPath(); c.arc(bx + br * .4, by - br * .22, br * .1, 0, TAU); c.fill();
    c.beginPath(); c.moveTo(bx + br * .28, by - br * .18); c.lineTo(bx + br * .4, by - br * .46); c.lineTo(bx + br * .52, by - br * .18); c.fill();
    // a chest
    c.fillRect(bx - br * .3, by + br * .42, br * .42, br * .22);
    c.restore();
    for (let i = 0; i < 12; i++) { const ang = hash(i * 2.2) * TAU, rr = hash(i * 5.1) * br * .85; sparkle(c, bx + Math.cos(ang) * rr, by + Math.sin(ang) * rr, 3 + hash(i) * 4, .35 + .65 * Math.max(0, Math.sin(time * 3.2 + i * 2.1))); }
    c.beginPath(); c.arc(bx, by, br, 0, TAU); c.lineWidth = 4; c.strokeStyle = GOLD; c.stroke(); c.lineWidth = 1; c.strokeStyle = '#6e4a10'; c.stroke();
    c.restore();
  }
}
function drawTimeline(c, w, h, e) {
  const x0 = w * .1, x1 = w * .9, y = h * .9, px = x0 + (x1 - x0) * e, a = c01(e * 8);
  c.save(); c.globalAlpha = a;
  c.beginPath(); c.roundRect(w * .04, y - 52, w * .92, 76, 16); c.fillStyle = 'rgba(14,17,28,.88)'; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(232,185,49,.6)'; c.stroke();
  c.lineCap = 'round'; c.strokeStyle = '#646C84'; c.lineWidth = 3; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
  c.strokeStyle = GOLD; c.beginPath(); c.moveTo(x0, y); c.lineTo(px, y); c.stroke();
  const icons = ['📷', '✏️', '📦'];
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let i = 0; i <= 10; i++) {
    const x = x0 + (x1 - x0) * i / 10;
    c.strokeStyle = i * .1 <= e + .001 ? GOLD : '#646C84'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, y - 5); c.lineTo(x, y + 5); c.stroke();
    const q = c01((e * 10 - i) * 1.6 + .01), s = i > 0 && q > .01 ? Math.max(0, backOut(q)) : 0;
    if (s > 0) { c.save(); c.globalAlpha = a; c.translate(x, y - 24); c.scale(s, s); c.font = '18px sans-serif'; c.fillStyle = '#fff'; c.fillText(icons[(i - 1) % 3], 0, 0); c.restore(); }
  }
  c.font = '800 13px Nunito, sans-serif'; c.fillStyle = '#EDEFF7'; c.textBaseline = 'alphabetic';
  [[0, '1922'], [5, '1927'], [10, '1932']].forEach(([i, t]) => c.fillText(t, x0 + (x1 - x0) * i / 10, y + 19));
  c.beginPath(); c.arc(px, y, 7, 0, TAU); c.fillStyle = '#FFE590'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#6e4a10'; c.stroke();
  c.restore();
}
function drawDisc(c, w, h, time) {
  const D = S.d, gy = h * .46, dsec = cur('dsec'), dz = cur('dz'), dopen = cur('dopen'), dcan = cur('dcan'), dgl = cur('dgl');
  const zoomT = c01((dz - .35) / .55), fade = ease(zoomT);
  if (fade < .999) {
    c.save();
    const gg = stairGeom(w, h, gy), px = gg.xN, py = gg.yN - gg.cH / 2, k = 1 + .9 * dz; // push in on the door
    c.translate(px, py); c.scale(k, k); c.translate(-px, -py);
    surface(c, w, h, gy, time);
    const mx0 = w * .08, mx1 = w * .5;
    rubbleMound(c, mx0, mx1, gy, h * .075, 3);
    hut(c, w * .21, gy - h * .052, w * .1, h * .06); hut(c, w * .37, gy - h * .052, w * .08, h * .05);
    campfire(c, w * .62, gy - 2, h * .02, time);
    const g = section(c, w, h, gy, dsec, dopen, time, dgl);
    if (dopen > .05) { c.save(); c.globalAlpha = c01(dopen * 1.6); crates(c, w * .7, gy - 1, h * .035); tripod(c, w * .83, gy - 1, h * .045); c.restore(); }
    void g;
    c.restore();
  }
  if (zoomT > .001) { c.save(); c.globalAlpha = fade; drawDoorClose(c, w, h, time, dcan, dgl); c.restore(); }
  if (D.s === 2 && D.pick !== null) drawTimeline(c, w, h, c01((time - D.t0 - .3) / 4));
  // darkening at the edges
  c.fillStyle = rg(c, w / 2, h / 2, Math.min(w, h) * .45, Math.max(w, h) * .78, [[0, 'rgba(6,5,12,0)'], [1, 'rgba(6,5,12,.55)']]); c.fillRect(0, 0, w, h);
}

// --- the canvas: one loop, the picture depends on the view -------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (v === 'layers') { if (S.sec === 'name') drawName(c, w, h, time); else if (S.sec === 'wreath') drawWreath(c, w, h, time); else drawLayers(c, w, h, dt, time); }
  else if (v === 'afterlife') {
    const A = S.a;
    if (A.god) drawGod(c, w, h, time);
    else { shelfScene(c, w, h, A.r, time); finishRoom(c, w, h, time); if (A.pick !== null) drawFrame(c, w, h, time); }
  } else drawDisc(c, w, h, time);
});

// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => { // on a phone the controls sit below the picture: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const LAYER_KEYS = [...COVERS, 'bright'];
function startLayers() {
  clearTimers(); LAYER_KEYS.forEach((k) => delete TW[k]);
  Object.assign(S.l, { q: 0, pick: null, revealed: false, ready: false, done: false, closed: false, shown: -1, pill: 0, kg: false, sel: null });
  [0, 1, 2, 3].forEach((k) => later(500 + k * 1000, () => { tw('sh' + k, 1, .75); S.l.shown = 0; sfx.push(); }));
  later(4500, () => { tw('sarc', 1, .9); S.l.shown = 1; sfx.snap(); });
  later(5600, () => { S.l.ready = true; });
}
function pickLayer(j) {
  const L = S.l;
  if (!L.ready || L.pick !== null || L.done) return;
  L.pick = j; (j === OK_L[L.q] ? sfx.good : sfx.bad)();
  if (L.q === 0) { // the coffins open one inside another; the third stays closed
    tw('c0', 1, .8); L.shown = 2; L.pill = 1; sfx.snap();
    later(1000, () => { tw('c1', 1, .8); L.shown = 3; L.pill = 2; sfx.snap(); });
    later(1800, () => { L.shown = 4; L.pill = 3; });
    later(2300, () => { L.revealed = true; });
  } else if (L.q === 1) { tw('bright', 1, .9); L.kg = true; later(1300, () => { L.revealed = true; }); }
  else { tw('c2', 1, .9); L.shown = 5; later(1500, () => { L.done = true; L.revealed = true; }); }
  showStage();
}
function closeNest() {
  const L = S.l; clearTimers(); L.closed = true; L.sel = null; L.shown = -1; L.pill = 0; L.kg = false;
  [['c2', 0], ['c1', 700], ['c0', 1400], ['sarc', 2100], ['sh3', 2800], ['sh2', 3500], ['sh1', 4200], ['sh0', 4900]].forEach(([k, ms]) => later(ms, () => { tw(k, 0, .6); sfx.click(); }));
}
function pickA(j) {
  const A = S.a; if (A.pick !== null || A.god) return;
  A.pick = j; A.t0 = nowS(); A.revealed = false; (j === OK_A[A.r] ? sfx.good : sfx.bad)();
  later(1600, () => { A.revealed = true; }); showStage();
}
function pickD(j) {
  const D = S.d; if (D.pick !== null) return;
  D.pick = j; D.t0 = nowS(); D.revealed = false; (j === OK_D[D.s] ? sfx.good : sfx.bad)();
  if (D.s === 0) tw('dsec', 1, 1.8); else if (D.s === 1) { tw('dcan', 1, .6); tw('dgl', 1, 1.3); }
  later(D.s === 2 ? 5200 : 2300, () => { D.revealed = true; }); showStage();
}
function next() {
  const v = lab.view; sfx.click();
  if (v === 'layers') { const L = S.l; if (L.pick === null || !L.revealed || L.done) return; L.q++; L.pick = null; L.revealed = false; }
  else if (v === 'afterlife') { const A = S.a; if (A.pick === null || !A.revealed) return; if (A.r < 3) { A.r++; A.pick = null; A.revealed = false; } else A.god = true; }
  else { const D = S.d; if (D.pick === null || !D.revealed || D.s >= 2) return; D.s++; D.pick = null; D.revealed = false; if (D.s === 1) tw('dz', 1, 1.4); else { tw('dz', 0, 1.2); tw('dopen', 1, 1.2); } }
}
function again() {
  const v = lab.view; sfx.click();
  if (v === 'layers') startLayers();
  else if (v === 'afterlife') Object.assign(S.a, { r: 0, pick: null, revealed: false, god: false });
  else { ['dz', 'dsec', 'dopen', 'dcan', 'dgl'].forEach((k) => delete TW[k]); Object.assign(S.d, { s: 0, pick: null, revealed: false }); }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'sec') { if (!secret.unlocked()) { secret.open(); return; } const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.secT = nowS(); sfx.click(); }
  else if (act === 'pick') { const j = +b.dataset.j; if (v === 'layers') pickLayer(j); else if (v === 'afterlife') pickA(j); else pickD(j); }
  else if (act === 'next') next();
  else if (act === 'sel') { S.l.sel = +b.dataset.i; sfx.tick(); }
  else if (act === 'close') closeNest();
  else if (act === 'again') again();
  render();
});

// --- one render per change: controls, readout and the state card ---------------------------------------------------------
function qBlock(t, o) {
  const done = o.pick !== null;
  let h = o.pre ? `<p class="tk-txt">${esc(o.pre)}</p>` : '';
  h += `<div class="tk-q">${esc(o.q)}</div><div class="tk-opts">${o.opts.map((x, j) => `<button class="tk-o ${done ? (j === o.ok ? 'ok' : j === o.pick ? 'no' : 'dim') : ''}" data-act="pick" data-j="${j}"${done ? ' disabled' : ''}>${esc(x)}</button>`).join('')}</div>`;
  if (done) h += `<div class="tk-v" style="color:${o.pick === o.ok ? 'var(--ok)' : 'var(--wip)'}">${esc(o.pick === o.ok ? t.right : t.wrong)}</div><p class="tk-txt">${esc(o.why)}</p>`;
  return h;
}
const nextBtn = (t) => `<div class="tk-go"><button class="btn" data-act="next">${esc(t.next)}</button></div>`;
const againBtn = (t) => `<div class="tk-go"><button class="btn" data-act="again">${esc(t.again)}</button></div>`;

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v !== 'layers') S.sec = null;
  $('tkSec').style.display = v === 'layers' ? '' : 'none';
  if (v === 'layers') renderLayers(t); else if (v === 'afterlife') renderAfter(t); else renderDisc(t);
}
function renderLayers(t) {
  const L = S.l, l = t.l, open = secret.unlocked();
  lab.setGlow('rgba(232,185,49,.24)');
  let html;
  if (L.done) {
    html = `<p class="tk-txt">${esc(l.r3)}</p>`;
    html += L.closed ? againBtn(t) : `<div class="chips tk-lay">${l.names.map((n, i) => `<button class="chip ${L.sel === i ? 'on' : ''}" data-act="sel" data-i="${i}">${esc(n)}</button>`).join('')}</div><div class="tk-go"><button class="btn ghost" data-act="close">${esc(l.close)}</button></div>`;
  } else if (!L.ready) html = `<p class="tk-txt">${esc(L.shown < 1 ? l.shrines : l.sarc)}</p>`;
  else {
    const n = L.q + 1;
    html = qBlock(t, { pre: L.q === 0 && L.pick === null ? l.sarc : '', q: l['q' + n], opts: l['o' + n], ok: OK_L[L.q], pick: L.pick, why: l['r' + n] });
    if (L.pick !== null && L.revealed) html += nextBtn(t);
  }
  $('tkBody').innerHTML = html;
  $('tkSec').innerHTML = [['name', '📛'], ['wreath', '💐']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const pillTxt = L.kg && L.shown < 5 ? l.kg : L.pill && L.shown >= 2 && L.shown <= 4 ? l.coffin(L.pill) : '';
  lab.setReadout(L.shown < 0 ? '⚱️' : esc(l.names[L.shown]), '', pillTxt, '#B8821F');
  let st;
  if (S.sec) st = [S.sec === 'name' ? '📛' : '💐', t.secrets[S.sec][0], t.sec[S.sec + 'Text'], ''];
  else if (L.sel !== null && L.done && !L.closed) st = ['⚱️', l.names[L.sel], l.info[L.sel], ''];
  else st = t.st.layers[L.done ? 1 : 0];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] });
}
function renderAfter(t) {
  const A = S.a, a = t.a;
  lab.setGlow('rgba(63, 184, 175, .22)');
  $('tkBody').innerHTML = A.god ? `<p class="tk-txt">${esc(a.god)}</p>${againBtn(t)}`
    : qBlock(t, { pre: '', q: a.q, opts: a.o[A.r], ok: OK_A[A.r], pick: A.pick, why: a.why[A.r] }) + (A.pick !== null && A.revealed ? nextBtn(t) : '');
  lab.setReadout(A.god ? '🏺' : `${A.r + 1}/4`, A.god ? '' : a.things[A.r], '', '#2a8f89');
  const st = t.st.afterlife[A.god ? 1 : 0];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] });
}
function renderDisc(t) {
  const D = S.d, d = t.d, n = D.s + 1, last = D.s === 2 && D.pick !== null && D.revealed;
  lab.setGlow('rgba(217, 130, 82, .24)');
  $('tkBody').innerHTML = qBlock(t, { pre: d.steps[D.s], q: d['q' + n], opts: d['o' + n], ok: OK_D[D.s], pick: D.pick, why: d['r' + n] })
    + (D.pick !== null && D.revealed ? (D.s < 2 ? nextBtn(t) : againBtn(t)) : '');
  lab.setReadout(`${D.s + 1}/3`, '', '', '#c2652d');
  const st = t.st.discovery[last ? 1 : 0];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] });
}
startLayers();
render();
