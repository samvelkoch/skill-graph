  c.fillStyle = hl; c.beginPath(); c.moveTo(4, 290); c.bezierCurveTo(70, 240, 130, 280, 190, 262); c.bezierCurveTo(250, 244, 300, 280, 356, 256); c.lineTo(356, 300); c.lineTo(4, 300); c.closePath(); c.fill();
  drawTiles(c, ['Sr', 'Ba', 'Cu'], S.fireEl, () => '', (e) => rgbCss(FIRE[e].map((v) => v / 255)), false);
  F(c, 700, 13); textLines(c, t.s.hintF, 180, 374, 330, 15, '#9aa3bd');
}
function drawTiles(c, list, selected, st, tint, showQ) {
  const w = 52, h = 62, gap = 8, x0 = 180 - (list.length * w + (list.length - 1) * gap) / 2, y = 292;
  list.forEach((e, i) => {
    const x = x0 + i * (w + gap), on = e === selected, s = st(e);
    G.tiles.push({ x, y, w, h, el: e });
    c.beginPath(); c.roundRect(x, y, w, h, 12);
    const g = c.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, on ? 'rgba(60,68,110,.95)' : 'rgba(34,40,72,.92)'); g.addColorStop(1, 'rgba(18,22,44,.95)');
    c.fillStyle = g; c.fill();
    c.lineWidth = on ? 2.4 : 1.2;
    c.strokeStyle = s === 'found' ? '#3ddc97' : on ? tint(e) : 'rgba(150,165,215,.35)'; c.stroke();
    c.textAlign = 'center'; c.textBaseline = 'middle';
    F(c, 900, 22); c.fillStyle = s === 'absent' ? '#7c86a3' : '#fff'; c.fillText(e, x + w / 2, y + 26);
    F(c, 900, 15);
    if (s === 'found') { c.fillStyle = '#3ddc97'; c.fillText('✓', x + w / 2, y + 48); }
    else if (s === 'absent') { c.fillStyle = '#ff8a80'; c.fillText('✕', x + w / 2, y + 48); }
    else { c.fillStyle = 'rgba(160,172,210,.55)'; c.fillText(showQ ? '?' : '', x + w / 2, y + 48); }
  });
}
function matchInfo() {                                       // the selected barcode against the dark lines
  const red = S.sec === 'red', lines = EL[S.sel].lines, d = S.sh[S.sel];
  const ticks = lines.map(([w]) => red ? w * (1 + S.z) : w + d), dark = red ? GAL_DARK : STAR_DARK;
  const inWin = ticks.map((l) => l >= LO3 && l <= 700), hit = ticks.map((l, i) => inWin[i] && dark.some((q) => Math.abs(q - l) < .8));
  return { ticks, inWin, hit, k: hit.filter(Boolean).length, n: lines.length, all: hit.every(Boolean) };
}
function drawStar(c, time) {
  G.tiles = [];
  if (S.p1 === null) return drawLocked(c);
  if (S.sec === 'fire') return drawFire(c, time);
  const t = T[lang], red = S.sec === 'red', m = matchInfo(), bandY = STY + STH + 4;
  if (red) drawGalaxy(c, 52, 62, time); else drawSun(c, 52, 62, time);
  F(c, 800, 14); textLines(c, red ? t.s.capR : t.s.cap, 226, 62 - 9 * (wrap(c, red ? t.s.capR : t.s.cap, 232).length - 1), 232, 18, '#d3d9e8');
  strip(c, SX, STY, SW, STH, LO3, 700, red ? galB : starB, false);
  // the barcode of the selected element, under the star's spectrum
  c.beginPath(); c.roundRect(SX, bandY, SW, 38, 8); c.fillStyle = '#0a0d1a'; c.fill(); c.strokeStyle = 'rgba(180,195,240,.3)'; c.lineWidth = 1.2; c.stroke();
  const tick = EL[S.sel].tick;
  m.ticks.forEach((l, i) => {
    if (!m.inWin[i]) return;
    const X = xOf(l, LO3), ok = m.hit[i];
    c.save(); c.setLineDash(ok ? [] : [3, 3]); c.strokeStyle = ok ? 'rgba(61,220,151,.95)' : 'rgba(255,255,255,.55)'; c.lineWidth = ok ? 1.6 : 1; c.beginPath(); c.moveTo(X, STY + 2); c.lineTo(X, bandY + 2); c.stroke(); c.restore();
    c.save(); if (ok) { c.shadowColor = '#3ddc97'; c.shadowBlur = 8; }
    c.fillStyle = ok ? '#3ddc97' : tick; c.beginPath(); c.roundRect(X - 1.5, bandY + 4, 3, 30, 1.5); c.fill(); c.restore();
  });
  axis(c, LO3, bandY + 42);
  const stFn = (e) => (red ? (m.all && S.sel === e ? 'found' : '') : S.st[e]);
  const list = red ? ['H', 'Ca'] : TILES;
  drawTiles(c, list, S.sel, stFn, (e) => EL[e].tick, true);
  F(c, 700, 13); textLines(c, red ? t.s.hintR : t.s.hint, 180, 372, 330, 15, '#9aa3bd');
  if (S.cur !== null) marker(c, S.cur, LO3, STY, bandY + 38, STY - 16);
}

// --- the canvas loop ----------------------------------------------------------------------------------------
const lab = shell({ key: 'line-spectra', T, topics: TOPICS, views: ['bench', 'atom', 'star'], onLang: () => render(), onView: () => { S.cur = null; render(); } });
const secret = secretLab('line-spectra', () => ({
  secrets: [{ emo: '🔭', title: T[lang].secrets.red[0], desc: T[lang].secrets.red[1] }, { emo: '🎆', title: T[lang].secrets.fire[0], desc: T[lang].secrets.fire[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="v1" hidden>
    <div class="ls-q" id="q1"></div>
    <div class="row2"><span class="lbl" id="lSrc"></span><div class="chips" id="srcChips"></div></div>
    <div class="row2" id="gasRow"><span class="lbl" id="lGas"></span><div class="chips" id="gasChips"></div></div>
    <div class="ls-note" id="hint1"></div>
  </div>
  <div id="v2" hidden>
    <div class="ls-q" id="q2"></div>
    <div class="row2"><span class="lbl" id="lLv"></span><div class="chips" id="lvChips"></div></div>
  </div>
  <div id="v3" hidden>
    <div id="s3lock"></div>
    <div id="s3main">
      <div class="row2" style="margin-top:0"><span class="lbl" id="lSlide"></span><b class="ls-sv" id="shVal"></b></div>
      <input type="range" class="ls-slide" id="slide" min="-45" max="45" step="0.1" value="0">
      <div class="ls-scale"><span id="sc0"></span><span id="sc1"></span><span id="sc2"></span></div>
      <div class="ls-note" id="hint3"></div>
      <div class="row2"><div class="chips" id="secChips"></div></div>
    </div>
  </div>`;

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const sc = Math.min(w / DW, h / DH, 1.7), ox = (w - DW * sc) / 2, oy = (h - DH * sc) / 2;
  G.sc = sc; G.ox = ox; G.oy = oy;
  c.save(); c.translate(ox, oy); c.scale(sc, sc); c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'bench') drawBench(c, time); else if (v === 'atom') drawAtom(c, time); else drawStar(c, time);
  c.restore();
});

// --- pointer: read a wavelength off the strip, pick a tile ---------------------------------------------------
const toD = (ev) => { const r = $('cv').getBoundingClientRect(); return [(ev.clientX - r.left - G.ox) / G.sc, (ev.clientY - r.top - G.oy) / G.sc]; };
function setCur(ev) {
  const [x, y] = toD(ev), v = lab.view;
  let box;
  if (v === 'bench') box = [236, 376, 400]; else if (v === 'star' && S.p1 !== null && S.sec !== 'fire') box = [STY - 6, 276, LO3]; else return;
  if (x < SX - 4 || x > SX + SW + 4 || y < box[0] || y > box[1]) return;
  S.cur = clamp(box[2] + (x - SX) / SW * (700 - box[2]), box[2], 700);
}
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view === 'star' && S.p1 !== null) {
    const [x, y] = toD(ev), tl = G.tiles.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
    if (tl) { if (S.sec === 'fire') S.fireEl = tl.el; else S.sel = tl.el; S.touched = true; sfx.click(); render(); return; }
  }
  setCur(ev);
});
$('cv').addEventListener('pointermove', (ev) => { if (ev.buttons || ev.pointerType === 'mouse') setCur(ev); });

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function guess1(i) {
  S.p1 = i; S.src = 'absorb'; S.gas = 'Na';
  (i === 2 ? sfx.good : sfx.bad)(); render(); showStage();
}
function guess2(n) {
  S.p2 = n; (n === 6 ? sfx.good : sfx.bad)();
  dropFrom(6);
  clearTimeout(S.dropTimer);
  S.dropTimer = setTimeout(() => { if (S.p2 !== null) { dropFrom(3); render(); } }, 1900);
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = b.dataset.k;
  if (act === 'src') {
    if (k === 'absorb' && S.p1 === null) { const q = $('q1'); q.classList.remove('ls-nudge'); void q.offsetWidth; q.classList.add('ls-nudge'); sfx.bad(); return; }
    S.src = k; sfx.click();
  } else if (act === 'gas') { S.gas = k; sfx.click(); }
  else if (act === 'p1') { guess1(+b.dataset.i); return; }
  else if (act === 'p2') { guess2(+b.dataset.n); return; }
  else if (act === 'lv') { const n = +b.dataset.n; if (S.p2 === null) liftTo(n); else dropFrom(n); sfx.click(); }
  else if (act === 'clr') { S.drops = []; sfx.tick(); }
  else if (act === 'back') { document.querySelector('#views [data-view="bench"]')?.click(); return; }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k;
    if (S.sec === 'red' && S.sel !== 'H' && S.sel !== 'Ca') S.sel = 'H';
    sfx.click();
  }
  render();
});
$('slide').addEventListener('input', () => {
  let v = +$('slide').value;
  if (S.sec === 'red') { if (Math.abs(v - Z_TRUE) < .0012) v = Z_TRUE; S.z = v; }
  else { if (Math.abs(v) < 1.2) v = 0; S.sh[S.sel] = v; }
  S.touched = true; sfx.tick(); render();
});

// --- one render per change ----------------------------------------------------------------------------------
function render() {
  const v = lab.view;
  $('v1').hidden = v !== 'bench'; $('v2').hidden = v !== 'atom'; $('v3').hidden = v !== 'star';
  if (v === 'bench') renderBench(); else if (v === 'atom') renderAtom(); else renderStar();
}
function drawMini(cv, kind) {
  const c = cv.getContext('2d'), na = [[589.3, 1]];
  const B = kind === 0 ? contB : kind === 1 ? (l) => Math.min(1.25, lsum(l, na, 4) + .1 * lsum(l, na, 16)) : (l) => contB(l) * (1 - Math.min(.97, lsum(l, na, 4)));
  strip(c, 0, 0, cv.width, cv.height, 400, 700, B, kind === 1);
}
function renderBench() {
  const t = T[lang], b = t.b, g = EL[S.gas], ab = S.src === 'absorb', done = S.p1 !== null;
  lab.setGlow('rgba(240, 170, 80, .26)');
  $('lSrc').textContent = b.lblSrc; $('lGas').textContent = b.lblGas; $('hint1').textContent = b.hint;
  $('srcChips').innerHTML = ['cont', 'emit', 'absorb'].map((k) => `<button class="chip ls-chip ${S.src === k ? 'on' : ''} ${k === 'absorb' && !done ? 'dis' : ''}" data-act="src" data-k="${k}">${k === 'absorb' && !done ? '🔒 ' : ''}${esc(b.src[k])}</button>`).join('');
  $('gasRow').hidden = S.src === 'cont';
  $('gasChips').innerHTML = GASES.map((k) => `<button class="chip ls-chip ${S.gas === k ? 'on' : ''}" data-act="gas" data-k="${k}">${esc(t.el[k])}</button>`).join('');
  if (!done) {
    $('q1').innerHTML = `<p class="ls-qt">${esc(b.q)}</p><div class="ls-opts">${b.opts.map((o, i) => `<button class="ls-opt" data-act="p1" data-i="${i}" aria-label="${esc(o)}"><canvas width="200" height="72"></canvas><b>${'ABC'[i]}</b></button>`).join('')}</div>`;
    $('q1').querySelectorAll('canvas').forEach((cv, i) => drawMini(cv, i));
  } else {
    const ok = S.p1 === 2;
    $('q1').innerHTML = `<p class="ls-verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? b.right : b.wrong)}</p><p class="ls-lead">${esc(b.vlead)}</p>`;
  }
  const list = nmList(g.lines, g.lines.length > 5 ? 0 : 1), n = g.lines.length;
  let st, ro;
  if (S.src === 'cont') { st = b.cont; ro = b.rd.cont; }
  else if (S.src === 'emit') { st = b.emit(t.el[S.gas], list); ro = [`${n}`, b.rd.emit(n), t.el[S.gas]]; }
  else { st = b.absorb(t.el[S.gas], list); ro = [`${n}`, b.rd.absorb(n), t.el[S.gas]]; }
  lab.setReadout(ro[0], ro[1], ro[2], '#f5a44c');
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] || '', extra: '' });
  lab.setFacts(done ? [{ emo: '🔭', text: t.f.fr, src: SRC.fr }, { emo: '🔵', text: t.f.cs, src: SRC.cs }] : [{ emo: '🔵', text: t.f.cs, src: SRC.cs }]);
}
function renderAtom() {
  const t = T[lang], a = t.a, done = S.p2 !== null;
  lab.setGlow('rgba(95, 130, 230, .28)');
  $('lLv').textContent = done ? a.lblDrop : a.lblLift;
  if (!done) {
    $('q2').innerHTML = `<p class="ls-qt">${esc(a.q)}</p><div class="ls-opts two">${[3, 6].map((n, i) => `<button class="ls-opt txt" data-act="p2" data-n="${n}">${esc(a.opts[i])}</button>`).join('')}</div>`;
  } else {
    const ok = S.p2 === 6, l6 = balmer(6), l3 = balmer(3);
    $('q2').innerHTML = `<p class="ls-verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? a.right : a.wrong)}</p><p class="ls-lead">${esc(a.vlead([Math.round(l6), cname(l6)], [Math.round(l3), cname(l3)]))}</p>`;
  }
  $('lvChips').innerHTML = [3, 4, 5, 6].map((n) => `<button class="chip ls-chip ${!done && S.lvl === n ? 'on' : ''}" data-act="lv" data-n="${n}">n = ${n}</button>`).join('') + (done ? `<button class="chip ls-chip" data-act="clr">${esc(a.clear)}</button>` : '');
  let st, ro;
  const last = S.drops[S.drops.length - 1];
  if (!done) { st = a.pre(S.lvl); ro = [`n = ${S.lvl}`, a.rdLvl, '']; }
  else if (!last) { st = a.post0; ro = ['n = 2', a.rdLvl, '']; }
  else { const l = balmer(last.n); st = a.st(last.n, Math.round(l), cname(l)); ro = [`${Math.round(l)} nm`, `${last.n} → 2`, cap1(cname(l))]; }
  lab.setReadout(ro[0], ro[1], ro[2], '#7aa2ff');
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] || '', extra: last && done ? `<div class="fine">${esc(a.ly(Math.round(lyman2())))}</div>` : '' });
  lab.setFacts([{ emo: '🧮', text: t.f.bal1, src: SRC.bal }, { emo: '🔮', text: t.f.bal2, src: SRC.bal }]);
}
function renderStar() {
  const t = T[lang], s = t.s, red = S.sec === 'red', fire = S.sec === 'fire', locked = S.p1 === null;
  lab.setGlow(fire ? 'rgba(220, 90, 90, .24)' : 'rgba(255, 209, 102, .22)');
  $('s3lock').innerHTML = locked ? `<p class="ls-verdict" style="color:var(--wip)">${esc(s.lockT)}</p><p class="ls-lead">${esc(s.lockL)}</p><button class="btn" data-act="back">${esc(s.back)}</button>` : '';
  $('s3main').hidden = locked;
  if (locked) {
    lab.setReadout('🔒', '', '', '#ffd166');
    lab.setState({ emo: '🔒', title: s.lockT, lead: s.lockL, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  const open = secret.unlocked(), sl = $('slide');
  const sc = (k, emo) => `<button class="chip ls-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('red', '🔭') + sc('fire', '🎆');
  $('s3main').querySelector('.row2').hidden = fire; sl.hidden = fire; $('s3main').querySelector('.ls-scale').hidden = fire;
  $('hint3').textContent = fire ? s.hintF : red ? s.hintR : s.hint;
  if (fire) {
    const e = S.fireEl, rgb = FIRE[e], nmE = t.el[e];
    lab.setReadout(e, nmE, cap1(s.fire[e]), `rgb(${rgb.join(',')})`);
    const st = s.fireSt(nmE, s.fire[e]);
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
    lab.setFacts([{ emo: '🎆', text: t.f.fire, src: SRC.fire }]); return;
  }
  $('lSlide').textContent = red ? s.slideR : s.slide;
  const sc3 = red ? s.scaleR : s.scale;
  $('sc0').textContent = sc3[0]; $('sc1').textContent = sc3[1]; $('sc2').textContent = sc3[2];
  if (red) { sl.min = 0; sl.max = .1; sl.step = .001; sl.value = S.z; $('shVal').textContent = `z = ${fmt(S.z, 3)}`; }
  else { sl.min = -45; sl.max = 45; sl.step = .1; sl.value = S.sh[S.sel]; $('shVal').textContent = `${S.sh[S.sel] > 0 ? '+' : ''}${fmt(S.sh[S.sel], 1)} nm`; }
  const m = matchInfo(), name = t.el[S.sel], atTrue = !red && S.sh[S.sel] === 0;
  if (atTrue) S.st[S.sel] = m.all ? 'found' : 'absent';
  let st;
  if (red) {
    if (m.all) st = s.redFound(Math.round(Z_TRUE * 100), fmt(Z_TRUE, 2), (Math.round(C_KMS * Z_TRUE / 1000) * 1000).toLocaleString(lang));
    else st = S.touched ? s.redPart(fmt(S.z, 3), m.k, m.n) : s.redIdle;
  } else if (!S.touched && !atTrue) st = s.idle;
  else if (atTrue) st = m.all ? s.found(name, m.n) : s.absent(name);
  else if (m.all) st = s.fits();
  else st = s.part(name, m.k, m.n);
  const checked = Object.keys(S.st).length, foundN = Object.values(S.st).filter((x) => x === 'found').length;
  const ro = red ? [`z = ${fmt(S.z, 3)}`, '', ''] : s.rd(checked, foundN);
  lab.setReadout(ro[0], ro[1], ro[2], '#ffd166');
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] || '', extra: '' });
  lab.setFacts(red ? [{ emo: '🔭', text: t.f.red, src: SRC.red }] : [{ emo: '🧪', text: t.f.he, src: SRC.he }]);
}
render();
</script>
