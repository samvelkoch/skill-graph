function drawOrder(c, w, h, time) {

  c.strokeStyle = 'rgba(200,215,255,.45)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(bx + 6, Y(0)); c.lineTo(bx + bw - 6, Y(0)); c.stroke();

function balance(c, x0, y0, w, h, bp, d, v, t) {
  const cx = x0 + w / 2, half = Math.min(w - 40, 250) / 2, pivY = y0 + 20, ang = lerp(-.16, 0, ease(bp / .8));
  const hd = clamp(h * .3, 40, 60), kk = hd / d, strLen = hd + 36;

  const pg = c.createLinearGradient(cx - 5, 0, cx + 5, 0); pg.addColorStop(0, '#f1d28e'); pg.addColorStop(1, '#8d6128');
  c.fillStyle = pg; rr(c, cx - 4, pivY, 8, h - 28, 3); c.fill();
  c.fillStyle = '#8d6128'; rr(c, cx - 36, y0 + h - 12, 72, 10, 5); c.fill(); c.strokeStyle = '#4e3412'; c.lineWidth = 1.2; c.stroke();
  // a negative angle lowers the left end (d is heavier while the right pan is still empty)
  const L = { x: cx - half * Math.cos(ang), y: pivY - half * Math.sin(ang) }, R = { x: cx + half * Math.cos(ang), y: pivY + half * Math.sin(ang) };
  const pan = (E) => {
    const py = E.y + strLen, pw = 76;
    c.strokeStyle = 'rgba(255,225,160,.6)'; c.lineWidth = 1.2; c.beginPath();
    c.moveTo(E.x, E.y); c.lineTo(E.x - pw / 2, py); c.moveTo(E.x, E.y); c.lineTo(E.x + pw / 2, py); c.stroke();

    if (bh < 1) return;
    c.save(); c.globalAlpha = alpha;
    const bg = c.createLinearGradient(x - bw / 2, bot - bh, x + bw / 2, bot); bg.addColorStop(0, col[0]); bg.addColorStop(1, col[1]);
    c.fillStyle = bg; rr(c, x - bw / 2, bot - bh, bw, bh, 5); c.fill(); c.strokeStyle = col[2]; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.3)'; c.fillRect(x - bw / 2 + 3, bot - bh + 2, bw - 6, 2);
    if (bh >= 15) { c.fillStyle = '#1b1408'; c.font = FONT(12, 900); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, x, bot - bh / 2 + 1); }
    c.restore();
  };
  block(pl.x, pl.y, 52, d * kk, ['#f6d27a', '#c9892f', '#7a4f14'], fmt(d));
  if (bp <= 0) {
    c.save(); c.setLineDash([5, 4]); c.strokeStyle = 'rgba(160,230,215,.7)'; c.lineWidth = 2; rr(c, pr.x - 26, pr.y - 36, 52, 36, 5); c.stroke(); c.restore();
    c.fillStyle = 'rgba(160,230,215,.9)'; c.font = FONT(14, 900); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('? × v', pr.x, pr.y - 18);
  } else {

      block(pr.x, pr.y - acc - drop, 52, v * kk * part, ['#8fe0cf', '#3aa392', '#1c5e53'], fmt(v * part), qq);

    c.fillStyle = pg2; rr(c, pp.x - pp.pw / 2 - 2, pp.y, pp.pw + 4, 9, 4.5); c.fill(); c.strokeStyle = '#4e3412'; c.lineWidth = 1.2; c.stroke();
  }

  c.fillStyle = bgm; rr(c, -half - 8, -5, 2 * half + 16, 10, 5); c.fill(); c.strokeStyle = '#4e3412'; c.lineWidth = 1.2; c.stroke(); c.restore();

  c.fillStyle = '#c3cbe6'; c.font = FONT(13, 900); c.textAlign = 'center'; c.textBaseline = 'middle';

}

function drawTurn(c, w, h, time) {
  const t = T[lang].turn, X = EXS[S.ex3], { d, v, t: tt } = X, chk = S.checked;

  c.fillStyle = '#98A0B8'; c.font = FONT(12, 800); c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(u.fwd, mx + 6, 128);

    gears: [{ socket: true, label: shownTile ? TILE[shownTile].lab : null, good: chk, val: fmt(tt) }], out: { k: 't', v: `${fmt(tt)} ${u.h}`, ok: pr >= 1 }, cover: !chk, rot: pr * 3 }, pr, time);
  c.fillStyle = '#98A0B8'; c.font = FONT(12, 800); c.textAlign = 'left'; c.fillText(u.rev, mx + 6, 264);
  const sg = rg.gears[0], trayH = 70, trayY = h - trayH - 6;

  balance(c, 0, 276, w, trayY - 276 - 22, bp, d, v, tt);
  if (chk && bp > .9) pill(c, `${fmt(d)} = ${fmt(v)} × ${fmt(tt)}`, w / 2, trayY - 24, { size: 13, color: '#9dffb6' });

  const tw = Math.min(70, (w - 40 - 24) / 4), gap = 8, total = 4 * tw + 3 * gap, tx0 = (w - total) / 2, tileY = trayY + 14, th2 = 46;
  c.fillStyle = 'rgba(255,255,255,.045)'; rr(c, 8, trayY, w - 16, trayH, 14); c.fill();
  S.geo = { tiles: {}, socket: { cx: sg.cx, cy: sg.cy, r: sg.r } };

function tile(c, cx, cy, w, h, label, mode, k) {
  c.save(); c.translate(cx, cy); c.scale(k, k);
  c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 8 * k; c.shadowOffsetY = 3;
  const g = c.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, mode === 'bad' ? '#f0b3ad' : '#e4ebfa'); g.addColorStop(1, mode === 'bad' ? '#c0524b' : '#8d9fcc');
  c.fillStyle = g; rr(c, -w / 2, -h / 2, w, h, 12); c.fill(); c.shadowColor = 'transparent';
  c.strokeStyle = mode === 'bad' ? '#7a231e' : '#3d4a78'; c.lineWidth = 1.5; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(-w / 2 + 8, -h / 2 + 3, w - 16, 2);
  c.fillStyle = '#1c2340'; c.font = FONT(19, 900); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, 0, 1);

  c.restore();
}

function drawPend(c, w, h, time, dt) {
  const t = T[lang].pd, L = S.L, Tm = pendT(L), { mx, mw } = mgeo(w);

  machine(c, mx, 6, mw, 150, { inputs: [{ k: 'L', v: `${fmt(L, 2)} ${t.m}`, frac: (L - .25) / 2.75 }],
    gears: [{ op: '÷ g', val: fmt(L / G, 3) }, { op: '√', val: fmt(Math.sqrt(L / G), 3) }, { op: '× 2π', val: fmt(Tm, 2) }], out: { k: 'T', v: `${fmt(Tm, 2)} ${t.s}` }, cover: false, rot: S.ph * .5 }, 1, time);
  const top = 190, scale = (h - top - 46) / 3.1, px = w / 2, th = .3 * Math.cos(S.ph), len = L * scale;
  // bracket and ruler
  const bg = c.createLinearGradient(0, top - 10, 0, top); bg.addColorStop(0, '#f1d28e'); bg.addColorStop(1, '#8d6128');
  c.fillStyle = bg; rr(c, px - 52, top - 12, 104, 12, 6); c.fill(); c.strokeStyle = '#4e3412'; c.lineWidth = 1.2; c.stroke();
  c.fillStyle = '#98A0B8'; c.font = FONT(12, 800); c.textAlign = 'left'; c.textBaseline = 'middle';
  for (const m of [1, 2, 3]) {
    const y = top + m * scale; c.strokeStyle = 'rgba(200,215,255,.3)'; c.lineWidth = 1; c.beginPath(); c.moveTo(12, y); c.lineTo(34, y); c.stroke();
    c.fillText(`${m} ${t.m}`, 38, y);
  }
  c.strokeStyle = 'rgba(255,255,255,.1)'; c.lineWidth = 1; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(px, top); c.lineTo(px, top + len + 20); c.stroke(); c.setLineDash([]);

  c.strokeStyle = '#d9dff0'; c.lineWidth = 2; c.beginPath(); c.moveTo(px, top); c.lineTo(bx, by); c.stroke();

canvasLoop($('cv'), (c, w, h, dt, time) => {
  cw = w;
  S.dC += (S.C - S.dC) * Math.min(1, dt * 10);
  if (Math.abs(S.dC - S.C) < .005) S.dC = S.C;
  const v = lab.view;
  if (S.ans.plug !== null) S.run.plug = Math.min(1, S.run.plug + dt / 3.3);
  if (S.ans.order !== null) S.run.order = Math.min(1, S.run.order + dt / ((EXPR[S.ex].steps(S.a).length + 1) * 1.2));
  if (S.checked) S.run.turn = Math.min(1, S.run.turn + dt / 4.2);
  c.lineJoin = 'round'; c.lineCap = 'round';
  backdrop(c, w, h);
  if (S.sec === 'pend') drawPend(c, w, h, time, dt);
  else if (S.sec === 'scales' || v === 'plug') drawPlug(c, w, h, time, S.sec === 'scales');
  else if (v === 'order') drawOrder(c, w, h, time);
  else drawTurn(c, w, h, time);
});

// --- input -------------------------------------------------------------------------------------------------
const cv = $('cv');
const pos = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'turn' || S.checked || !S.geo) return;
  const [x, y] = pos(ev); let hit = null;
  for (const id of TILES) {
    const r = S.geo.tiles[id];
    if (S.tile !== id && r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { hit = { id, from: 'tray' }; break; }
  }
  if (!hit && S.tile) { const s = S.geo.socket; if (Math.hypot(x - s.cx, y - s.cy) <= s.r + 6) hit = { id: S.tile, from: 'slot' }; }
  if (!hit) return;
  S.drag = { ...hit, x, y, sx: x, sy: y, moved: false };
  try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
  sfx.tick();
});
cv.addEventListener('pointermove', (ev) => {
  if (!S.drag) return;
  const [x, y] = pos(ev); S.drag.x = x; S.drag.y = y;
  if (Math.hypot(x - S.drag.sx, y - S.drag.sy) > 6) S.drag.moved = true;
});
const endDrag = () => {
  const d = S.drag; if (!d) return; S.drag = null;
  const s = S.geo?.socket, over = s && Math.hypot(d.x - s.cx, d.y - s.cy) <= s.r + 24;
  if (d.from === 'tray') { if (over || !d.moved) { S.tile = d.id; sfx.snap(); } }
  else if (!d.moved || !over) { S.tile = null; sfx.click(); }
  render();
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { S.drag = null; });

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function dialRange() {
  const m = S.sec === 'pend' ? 'pend' : S.sec === 'scales' ? 'plug' : lab.view;
  return m === 'pend' ? { k: 'L', min: .25, max: 3, step: .05 } : m === 'order' ? { k: 'a', min: -5, max: 5, step: 1 } : { k: 'C', min: -40, max: 100, step: 1 };
}
function setDial(val) {
  const r = dialRange(); S[r.k] = clamp(Math.round(val / r.step) * r.step, r.min, r.max);
  if (r.k === 'C') { S.run.plug = 1; S.free.plug = true; }
  if (r.k === 'a') { S.run.order = 1; S.free.order = true; }
  if (r.k === 'C' && S.sec !== 'scales' && S.ans.plug === null) S.C = 37;
  sfx.tick(); render();
}
$('ctrlBody').addEventListener('input', (ev) => { if (ev.target.id === 'dSl') setDial(+ev.target.value); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const v = lab.view, act = b.dataset.act;
  if (b.dataset.pick !== undefined) {
    const k = v === 'plug' ? 'plug' : 'order', i = +b.dataset.pick;
    if (S.ans[k] !== null) return;
    S.ans[k] = i; S.run[k] = 0; S.free[k] = false;
    const ok = k === 'plug' ? i === 1 : i === 0; (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'dec' || act === 'inc') { const r = dialRange(); setDial(S[r.k] + (act === 'inc' ? r.step : -r.step)); return; }
  else if (b.dataset.expr !== undefined) { S.ex = +b.dataset.expr; S.run.order = 1; S.free.order = true; sfx.click(); }
  else if (b.dataset.ex !== undefined) { S.ex3 = +b.dataset.ex; S.tile = null; S.checked = false; S.run.turn = 0; sfx.click(); }
  else if (act === 'check') {
    if (S.checked) { S.checked = false; S.tile = null; S.run.turn = 0; sfx.click(); }
    else if (S.tile) { S.checked = true; S.run.turn = 0; (S.tile === 'div' ? sfx.good : sfx.bad)(); showStage(); }
  } else if (act === 'one') { S.L = 1; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) exitSec();
    else if (k === 'scales') { S.sec = 'scales'; S.C = 0; S.dC = 0; lab.view = 'plug'; lab.renderChrome(); }
    else { S.sec = 'pend'; S.L = 1; }
    sfx.click();
  }
  render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, mode = sec || v;
  document.body.dataset.v = mode === 'scales' ? 'plug' : mode;
  const predView = !sec && (v === 'plug' || v === 'order');
  $('fmAsk').style.display = predView ? '' : 'none';
  $('fmDial').style.display = mode === 'turn' ? 'none' : '';
  $('fmExpr').style.display = !sec && v === 'order' ? '' : 'none';
  $('fmTurn').style.display = mode === 'turn' ? '' : 'none';
  $('fmPend').style.display = sec === 'pend' ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`;
  $('fmSec').innerHTML = sc('scales', '🌡️') + sc('pend', '⏱️');
  if (mode === 'plug' || mode === 'scales') renderPlug(t, sec === 'scales');
  else if (mode === 'order') renderOrder(t);
  else if (mode === 'turn') renderTurn(t);
  else renderPend(t);
}
function setDialUi(label, val, locked) {
  const r = dialRange(), sl = $('dSl');
  sl.min = r.min; sl.max = r.max; sl.step = r.step; if (+sl.value !== val) sl.value = val;
  sl.disabled = locked; $('dLbl').textContent = label;
  document.querySelectorAll('#fmDial .fm-sb').forEach((b) => { b.disabled = locked; });
}
function predUi(q, opts, ok, ans) {
  $('fmAsk').innerHTML = `<div class="fm-q">${esc(q)}</div><div class="fm-opts">${opts.map((o, i) => `<button class="fm-opt ${ans === null ? '' : i === ok ? 'good' : i === ans ? 'bad' : ''}" data-pick="${i}"${ans !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
}
function renderPlug(t, sec) {
  const pl = t.plug, ans = S.ans.plug, pred = !sec && ans === null, C = pred ? 37 : S.C, F = C2F(C);
  lab.setGlow('rgba(255, 110, 80, .26)');
  const opts = [124.2, 98.6, 69].map((x) => `${fmt(x)} °F`);
  predUi(pl.q, opts, 1, ans);
  setDialUi(t.dial.C, C, pred);
  const facts = [{ emo: '🌡️', text: t.facts.fahr, src: 'Encyclopaedia Britannica: Fahrenheit temperature scale' }];
  if (!sec) facts.push({ emo: '✏️', text: t.facts.comma, src: 'school usage' });
  lab.setFacts(facts);
  if (sec) {
    const gap = F - C, found = Math.round(C) === -40;
    lab.setReadout(`${fmt(F)} °F`, `${fmt(C)} °C`, found ? t.sc.same : t.sc.gap(gap), '#4ea8ff');
    lab.setState(found ? { emo: '🎯', title: t.sc.found, lead: t.sc.foundLead, body: '', extra: '' } : { emo: '🌡️', title: t.sc.title, lead: t.sc.lead, body: '', extra: '' });
    return;
  }
  if (pred) {
    lab.setReadout('?', '', `${fmt(37)} °C`, '#ff7a59');
    lab.setState({ emo: '🤔', title: pl.q, lead: pl.rule, body: '', extra: '' });
  } else {
    lab.setReadout(S.run.plug < .62 && !S.free.plug ? '?' : `${fmt(F)} °F`, S.run.plug < .62 && !S.free.plug ? '' : `1.8 × ${br(C)} + 32`, `${fmt(C)} °C`, '#ff7a59');
    if (!S.free.plug) lab.setState({ emo: ans === 1 ? '✅' : '🤔', title: ans === 1 ? t.ok : t.no, lead: pl.why[ans](), body: ans === 1 ? '' : pl.why[1](), extra: '' });
    else lab.setState({ emo: '🌡️', title: pl.title(C, F), lead: pl.lead, body: pl.body, extra: '' });
  }
}
function renderOrder(t) {
  const od = t.order, ans = S.ans.order, pred = ans === null, a = pred ? -2 : S.a, E = EXPR[pred ? 0 : S.ex];
  lab.setGlow('rgba(224, 176, 80, .26)');
  predUi(od.q, ['8', '16', '−8'], 0, ans);
  setDialUi(t.dial.a, a, pred);
  $('fmExpr').innerHTML = EXPR.map((e, i) => `<button class="chip ${i === S.ex ? 'on' : ''}" data-expr="${i}"${pred ? ' disabled' : ''}>${esc(e.lab)}</button>`).join('');
  lab.setFacts([{ emo: '🔤', text: t.facts.viete, src: 'MacTutor History of Mathematics: François Viète' }, { emo: '⚡', text: t.facts.ein, src: 'Encyclopaedia Britannica: E = mc²' }]);
  if (pred) {
    lab.setReadout('?', '', `a = ${fmt(-2)}`, '#e0b050');
    lab.setState({ emo: '🤔', title: od.q, lead: od.rule, body: '', extra: '' });
  } else if (!S.free.order) {
    const done = S.run.order >= .67;
    lab.setReadout(done ? fmt(E.f(a)) : '?', done ? E.lab : '', `a = ${fmt(a)}`, '#e0b050');
    lab.setState({ emo: ans === 0 ? '✅' : '🤔', title: ans === 0 ? t.ok : t.no, lead: od.why[ans](), body: ans === 0 ? '' : od.why[0](), extra: '' });
  } else {
    lab.setReadout(fmt(E.f(a)), E.lab, `a = ${fmt(a)}`, '#e0b050');
    lab.setState({ emo: '🧮', title: `${E.lab} = ${fmt(E.f(a))}`, lead: `${od.note[S.ex]} ${od.lead}`, body: od.body, extra: '' });
  }
}
function renderTurn(t) {
  const tr = t.turn, X = EXS[S.ex3], chk = S.checked, done = chk && S.run.turn >= .45;
  lab.setGlow('rgba(95, 184, 168, .26)');
  lab.setFacts([{ emo: '⚡', text: t.facts.ein, src: 'Encyclopaedia Britannica: E = mc²' }, { emo: '✏️', text: t.facts.comma, src: 'school usage' }]);
  $('fmEx').innerHTML = tr.ex.map((e, i) => `<button class="chip ${i === S.ex3 ? 'on' : ''}" data-ex="${i}">${e.emo} ${esc(e.name)}</button>`).join('');
  $('fmTq').textContent = `${tr.ex[S.ex3].txt} ${tr.q}`;
  $('fmCheck').textContent = chk ? tr.again : tr.check; $('fmCheck').disabled = !chk && !S.tile;
  if (!chk) {
    lab.setReadout('?', 't', `d = ${fmt(X.d)} ${tr.km} · v = ${fmt(X.v)} ${tr.kmh}`, '#5fb8a8');
    lab.setState({ emo: '🔄', title: tr.q, lead: tr.ex[S.ex3].txt, body: tr.lead, extra: '' });
    return;
  }
  const ok = S.tile === 'div';
  lab.setReadout(done ? `${fmt(X.t)} ${tr.h}` : '?', done ? `${fmt(X.d)} ÷ ${fmt(X.v)}` : 't', '', '#5fb8a8');
  if (ok) lab.setState({ emo: '✅', title: T[lang].ok, lead: tr.okLead(X.d, X.v, X.t), body: '', extra: '' });
  else {
    const x = TILE[S.tile].f(X.d, X.v), y = sig3(X.d / x);
    lab.setState({ emo: '🤔', title: T[lang].no, lead: tr.noLead(X.d, X.v, TILE[S.tile].op, x, y), body: tr.noBody(X.d, X.v, X.t), extra: '' });
  }
}
function renderPend(t) {
  const pd = t.pd, L = S.L, Tm = pendT(L);
  lab.setGlow('rgba(150, 130, 230, .26)');
  lab.setFacts([]);
  setDialUi(t.dial.L, L, false);
  $('fmOne').textContent = pd.try1;
  lab.setReadout(`${fmt(Tm, 2)} ${pd.s}`, `2π × √(${fmt(L, 2)} ÷ ${fmt(G, 2)})`, pd.pill, '#b3a1ff');
  lab.setState({ emo: '⏱️', title: pd.title(L, Tm), lead: Math.abs(L - 1) < .001 ? pd.one : pd.lead, body: Math.abs(L - 1) < .001 ? pd.lead : '', extra: '' });
}
render();
</script>
