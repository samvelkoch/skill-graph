const anScore = () => ORDER.filter((k) => S.an.place[k] === ANS[k]).length;
function renderAnimals(t) {
  const A = S.an, T_ = t.an, card = (k) => `<button class="ac${A.sel === k ? ' sel' : ''}" data-k="${k}"><span class="em">${EMO[k]}</span><span class="nm">${esc(T_.names[k])}</span></button>`;
  const bins = ['inside', 'outside', 'none'].map((b) => {
    const inner = A.checked
      ? ORDER.filter((k) => ANS[k] === b).map((k) => { const ok = A.place[k] === b;
          return `<div class="xc ${ok ? 'ok' : 'mv'}">${XR[k]}<i class="mk">${ok ? '✓' : '↺'}</i><b>${esc(T_.names[k])}</b><span>${esc(T_.why[k])}</span></div>`; }).join('')
      : ORDER.filter((k) => A.place[k] === b).map(card).join('');
    return `<div class="bin b-${b}" data-bin="${b}"><div class="bh">${esc(T_[b])}</div>${inner}</div>`;
  }).join('');
  anEl.innerHTML = `<div class="anq">${esc(T_.q)}</div>${A.checked ? '' : `<div class="tray" id="tray">${ORDER.filter((k) => !A.place[k]).map(card).join('')}</div>`}<div class="bins" id="anBins">${bins}</div>`;
  $('anMain').textContent = A.checked ? t.again : t.check;
  $('anMain').disabled = !A.checked && placed() < 8;
  const c = t.card.animals;
  lab.setState({ emo: c[0], title: c[1], lead: c[2], body: c[3], extra: `<div class="fine">${esc(t.fine)}</div>` });
}
anEl.addEventListener('click', (ev) => {
  const A = S.an; if (A.checked) return;
  const cd = ev.target.closest('.ac'), bin = ev.target.closest('.bin');
  if (cd && A.sel && A.sel !== cd.dataset.k && bin) { A.place[A.sel] = bin.dataset.bin; A.sel = null; sfx.snap(); }
  else if (cd) { A.sel = A.sel === cd.dataset.k ? null : cd.dataset.k; sfx.tick(); }
  else if (A.sel && bin) { A.place[A.sel] = bin.dataset.bin; A.sel = null; sfx.snap(); }
  else if (A.sel && ev.target.closest('#tray')) { delete A.place[A.sel]; A.sel = null; sfx.tick(); }
  else return;
  render();
});

// --- controls ------------------------------------------------------------------------------------------------
function predHTML(t, q, opts, ok, pick, r, wr) {
  const done = pick !== null;
  return `<div class="pq">${esc(q)}</div><div class="pos">${opts.map((o, i) => `<button class="ob${done ? (i === ok ? ' good' : i === pick ? ' bad' : '') : ''}" data-pick="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`
    + (done ? `<div class="pv ${pick === ok ? 'yes' : 'no'}">${esc(pick === ok ? t.right : wr)}</div><p class="pr">${esc(r)}</p><button class="btn" data-act="next">${esc(t.next)}</button>` : '');
}
function pick(i) {
  const v = lab.view;
  if (v === 'arm') {
    const a = S.arm, first = a.ph === 'q1'; if (a.ph !== 'q1' && a.ph !== 'q2') return;
    a.pick = i; a.ph = first ? 'r1' : 'r2'; a.tgt = first ? 0 : 110; a.dir = first ? -1 : 1; a.lab = true; a.speed = 55;
    if (first) S.d.arm1 = true; else S.d.arm2 = true;
    (i === (first ? 1 : 0) ? sfx.good : sfx.bad)();
  } else {
    const k = S.sk, first = k.ph === 'q1'; if (k.ph !== 'q1' && k.ph !== 'q2') return;
    k.pick = i; k.ph = first ? 'r1' : 'r2'; k.jelly = 0; k.bone = 0;
    if (first) S.d.sk1 = true; else S.d.sk2 = true;
    (i === 1 ? sfx.good : sfx.bad)();
  }
  render(); showStage();
}
function next() {
  if (lab.view === 'arm') {
    const a = S.arm; a.pick = null; a.speed = 0; a.ang = a.tgt;
    if (a.ph === 'r1') { a.ph = 'q2'; a.lab = false; a.dir = 0; } else { a.ph = 'free'; }
  } else {
    const k = S.sk; k.pick = null; k.ph = k.ph === 'r1' ? 'q2' : 'free';
  }
  sfx.click(); render();
}
function restart() {
  if (lab.view === 'arm') S.arm = { ph: 'q1', pick: null, ang: 110, tgt: 110, dir: 0, lab: false, speed: 0, act: [0, 0] };
  else Object.assign(S.sk, { ph: 'q1', pick: null, part: null, jelly: 0, bone: 0 });
  S.sec = null; sfx.click(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-pick], [data-act], [data-part]'); if (!b) return;
  if (b.dataset.pick !== undefined) return pick(+b.dataset.pick);
  if (b.dataset.part) return setPart(b.dataset.part);
  const act = b.dataset.act;
  if (act === 'next') next();
  else if (act === 'again') restart();
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k;
    if (S.sec === 'count') S.grow = 0; else if (S.sec === 'mend') S.week = 0;
    $('secR').value = 0; sfx.click(); render();
  } else if (act === 'anmain') {
    const A = S.an;
    if (A.checked) { S.an = { sel: null, place: {}, checked: false }; sfx.click(); render(); return; }
    if (placed() < 8) return;
    A.checked = true; A.sel = null; anScore() === 8 ? sfx.good() : sfx.bad(); render();
    $('anBins').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});
$('bend').addEventListener('input', (ev) => {
  const a = S.arm, v = +ev.target.value;
  if (v !== a.tgt) { a.dir = v > a.tgt ? 1 : -1; a.lab = true; }
  a.tgt = v; a.speed = 0;
});
$('secR').addEventListener('input', (ev) => {
  const v = +ev.target.value;
  if (S.sec === 'count') S.grow = v; else if (S.sec === 'mend') S.week = v / 10;
});

// --- render: panels, hero, state card; the readout follows the animation in the loop ------------------------
function hero() {
  const t = T[lang], d = S.d, lines = [t.hero[lab.view]];
  if (d.sk1) lines.push(t.lines[0]);   // lines that give an answer away appear only after that reveal
  if (d.arm1) lines.push(t.lines[1]);
  if (d.arm2) lines.push(t.lines[2]);
  $('hero').innerHTML = `<h1>${esc(d.arm1 ? t.title : t.name)}<i>.</i></h1>${lines.map(([b, r]) => `<p><b>${esc(b)}</b> ${esc(r)}</p>`).join('')}`;
}
const setCard = (t, c, extra = true) => lab.setState({ emo: c[0], title: c[1], lead: c[2], body: c[3], extra: extra ? `<div class="fine">${esc(t.fine)}</div>` : '' });
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('pArm').hidden = v !== 'arm'; $('pSk').hidden = v !== 'skeleton'; $('pAn').hidden = v !== 'animals';
  hero(); S.rk = '';
  if (v === 'arm') renderArm(t); else if (v === 'skeleton') renderSkel(t); else renderAnimals(t);
}
function renderArm(t) {
  const a = S.arm, free = a.ph === 'free', open = secret.unlocked();
  const q1 = a.ph === 'q1' || a.ph === 'r1', ta = t.a;
  $('armPred').innerHTML = free ? '' : q1 ? predHTML(t, ta.q1, ta.o1, 1, a.ph === 'r1' ? a.pick : null, ta.r1, t.wrong) : predHTML(t, ta.q2, ta.o2, 0, a.ph === 'r2' ? a.pick : null, ta.r2, t.wrong);
  $('armFree').hidden = !(free && !S.sec);
  $('armSec').hidden = !S.sec;
  if (free && !S.sec) $('bend').value = Math.round(a.tgt);
  $('bend').setAttribute('aria-label', ta.bend);
  $('secL').textContent = S.sec === 'mend' ? t.sec.weeks(0) : t.sec.baby;
  $('secRt').textContent = S.sec === 'mend' ? t.sec.weeks(8) : t.sec.adult;
  $('secR').max = S.sec === 'mend' ? 80 : 100; $('secR').value = S.sec === 'mend' ? Math.round(S.week * 10) : S.grow;
  $('secR').setAttribute('aria-label', S.sec === 'mend' ? t.secrets.mend[0] : t.secrets.count[0]);
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}"${free ? '' : ' disabled'}>${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('count', '🔢') + sc('mend', '🩹') + (free ? `<button class="chip" data-act="again">↺ ${esc(t.again)}</button>` : '');
  if (S.sec === 'count') lab.setState({ emo: '🔢', title: t.secrets.count[0], lead: t.sec.countText, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  else if (S.sec === 'mend') lab.setState({ emo: '🩹', title: t.secrets.mend[0], lead: t.sec.mendText, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  else setCard(t, S.d.arm2 ? t.card.arm : t.neu.arm);
}
function renderSkel(t) {
  const k = S.sk, free = k.ph === 'free', ts = t.s, q1 = k.ph === 'q1' || k.ph === 'r1';
  $('skPred').innerHTML = free ? '' : q1 ? predHTML(t, ts.q1, ts.o1, 1, k.ph === 'r1' ? k.pick : null, ts.r1, t.wrongS) : predHTML(t, ts.q2, ts.o2, 1, k.ph === 'r2' ? k.pick : null, ts.r2, t.wrongS);
  $('partChips').innerHTML = k.ph === 'r2' ? '' : PARTS.map((p) => `<button class="chip${k.part === p ? ' on' : ''}" data-part="${p}">${esc(ts.names[p])}</button>`).join('') + (free ? `<button class="chip" data-act="again">↺ ${esc(t.again)}</button>` : '');
  if (k.part) lab.setState({ emo: '🩻', title: ts.names[k.part], lead: S.d.sk1 ? ts.jobs[k.part] : '', body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  else setCard(t, S.d.sk2 ? t.card.skeleton : t.neu.skeleton);
}
// the big number above the controls, kept in step with the animation
function readout() {
  const t = T[lang], v = lab.view; let r;
  if (v === 'arm') {
    const a = S.arm;
    if (S.sec === 'count') { const n = Math.round(300 - 94 * S.grow / 100); r = [String(n), t.sec.unit(n), S.grow < 50 ? t.sec.baby : t.sec.adult, '#ffd86b']; }
    else if (S.sec === 'mend') { const n = Math.round(S.week); r = [t.sec.weeks(n), n < 1 ? t.sec.broken : n < 4 ? t.sec.callus : t.sec.newbone, '', '#f19aa6']; }
    else r = [`${Math.round(a.ang)}°`, a.ph === 'free' ? t.a.bend : '', a.lab ? `${a.dir > 0 ? t.a.biceps : t.a.triceps} · ${t.a.pulling}` : '', '#ff5a5a'];
  } else if (v === 'skeleton') r = [S.sk.part ? t.s.names[S.sk.part] : '🩻', '', '', '#d8c9a8'];
  else r = [S.an.checked ? t.an.score(anScore()) : `${placed()}/8`, '', '', '#59c9ff'];
  const key = r.join('|') + lang;
  if (key !== S.rk) { S.rk = key; lab.setReadout(...r); }
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view; readout();
  if (v === 'arm') { if (S.sec === 'count') drawCount(c, w, h, time); else if (S.sec === 'mend') drawMend(c, w, h); else drawArm(c, w, h, dt); }
  else if (v === 'skeleton') drawSkeleton(c, w, h, dt, time);
});
render();
</script>
</body>
