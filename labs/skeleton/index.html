  .ob:hover:not(:disabled) { background: rgba(130, 145, 190, .22); }

  body:not([data-v=animals]) #anBox { display: none; }

  body[data-v=animals] #stage { height: auto; min-height: 0; }

  .tray { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; min-height: 76px; padding: 6px; border-radius: 16px; }
  .ac { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 4px; border-radius: 14px;

  .ac:hover { background: rgba(130, 145, 190, .22); }
  .ac .pic { display: block; width: 100%; max-width: 86px; }
  .ac .pic svg { display: block; width: 100%; height: auto; border-radius: 9px; }
  .ac .nm { font-size: 12px; font-weight: 800; color: var(--soft); }
  .ac.sel { background: #fff; border-color: #fff; transform: translateY(-2px); box-shadow: 0 0 0 2.5px #ffd86b; }
  .ac.sel .nm { color: var(--bg); }
  .bins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; scroll-margin-top: 76px; }
  .bin { border: 1.5px dashed var(--stroke2); border-radius: 16px; padding: 8px 6px; min-height: 150px; background: rgba(130, 145, 190, .05); cursor: pointer; }
  .bin .bh { font-weight: 900; font-size: 12.5px; text-align: center; margin-bottom: 8px; line-height: 1.2; min-height: 30px; }
  .bin.b-inside { border-color: #cfd6f5; } .bin.b-inside .bh { color: #cfd6f5; }
  .bin.b-outside { border-color: #ffb347; } .bin.b-outside .bh { color: #ffb347; }
  .bin.b-none { border-color: #59c9ff; } .bin.b-none .bh { color: #59c9ff; }
  .bin .ac { flex-direction: row; justify-content: flex-start; gap: 6px; width: 100%; min-height: 38px; padding: 4px 8px; margin-bottom: 5px; }
  .bin .ac .pic { width: 40px; flex: none; }
  .bin .ac .pic svg { border-radius: 6px; }
  .xc { position: relative; border-radius: 12px; border: 2px solid var(--ok); overflow: hidden; background: #1a1626; margin-bottom: 7px; cursor: default; }
  .xc.mv { border-color: var(--wip); }
  .xc svg { display: block; width: 100%; height: auto; }
  .xc b { display: block; font-size: 12.5px; padding: 4px 7px 0; }
  .xc span { display: block; font-size: 12px; line-height: 1.35; padding: 1px 7px 7px; color: var(--soft); }
  .xc .mk { position: absolute; top: 4px; right: 6px; font-style: normal; font-weight: 900; font-size: 14px; color: var(--ok); }
  .xc.mv .mk { color: var(--wip); }
  @media (max-width: 760px) {
    #stage { height: min(88vw, 400px); }
    body[data-v=skeleton] #stage { height: min(112vw, 470px); }
    body[data-v=animals] #stage { height: auto; }

    .bin { padding: 6px 4px; }
    .bin .ac { padding: 4px 5px; gap: 4px; }
    .bin .ac .nm { font-size: 12px; }

  else r = [S.an.checked ? t.an.score(anScore()) : `${placed()}/8`, '', '', '#59c9ff'];

  if (key !== S.rk) { S.rk = key; lab.setReadout(...r); }
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view; readout(); c.save();
  if (v === 'arm') { if (S.sec === 'count') drawCount(c, w, h, time); else if (S.sec === 'mend') drawMend(c, w, h); else drawArm(c, w, h, dt); }
  else if (v === 'skeleton') drawSkeleton(c, w, h, dt, time);
  c.restore();
});
render();
</script>
