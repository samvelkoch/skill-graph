const AREA = [0, 0.05, 0.15, 0.35], CHUTE_G = [0, 5, 8, 15], CHUTE_C = [0, 2, 3, 5];
const GROUPS = ['chute', 'straws', 'sponge', 'bubble', 'cone'];
const PCOST = { straws: 1, sponge: 3, bubble: 4, cone: 1 }, PMASS = { straws: 6, sponge: 10, bubble: 8, cone: 4 };
const costOf = (d) => CHUTE_C[d.chute] + d.straws * 1 + d.sponge * 3 + d.bubble * 4 + d.cone * 1;
const massOf = (d) => CHUTE_G[d.chute] + d.straws * 6 + d.sponge * 10 + d.bubble * 8 + d.cone * 4;
const limitOf = (d) => 2.5 + d.straws * 1.5 + d.sponge * 3.5 + d.bubble * 4.5 + d.cone * 1.5;

const cache = new Map();
function evalD(d, envKey) {
  const key = envKey + JSON.stringify(d);
  if (cache.has(key)) return cache.get(key);
  const e = ENVS[envKey], m = (60 + massOf(d)) / 1000, A = AREA[d.chute], k = 0.5 * e.rho * 1.5 * (A + 0.005) / m, dt = 1 / 240;
  let y = e.H, v = 0, t = 0; const ys = [y], vs = [0];
  while (y > 0 && t < 40) { v += (e.g - k * v * v) * dt; y -= v * dt; t += dt; ys.push(Math.max(0, y)); vs.push(v); }
  const vx = 2 * A, limit = limitOf(d), drift = vx * t, cost = costOf(d), mass = massOf(d);
  const r = { sim: { ys, vs, T: t, vx, v }, v, T: t, drift, limit, cost, mass, safe: v <= limit, near: drift <= 1, over: cost > 10 || mass > 50 };
  r.pass = r.safe && r.near;
  cache.set(key, r);
  return r;
}

function advance(r, dt) {
  if (r.phase === 'fall') {
    const left = r.sim.T - r.t;
    r.t = Math.min(r.sim.T, r.t + dt * (left < 0.3 ? 0.25 : 1));
    if (r.t >= r.sim.T) { r.phase = 'impact'; r.imp = 0; if (r.res.safe) sfx.click(); else sfx.snap(); }

function geo(w, h, v) {

  const gy = Math.round(h * 0.86), ly = gy + (h - gy) * 0.4;

  const mPx = (ly - relY) / e.H;

let lastRO = '';

  const st = v === 'build' ? S.b : S.i, run = st.run, d = v === 'build' ? S.b.d : S.i.cur, u = g.u;
  drawTarget(c, g.dropX, g.ly, g.pxm, true);
  drawSock(c, g.w - 22 * u, g.ly - 3 * u, u, tm);
  const childX = g.dropX - 52 * u, platTop = g.slabY, m = dims(d, u);
  if (run) {
    drawRun(c, run, g, tm, 0, t);
    drawChild(c, childX, platTop, u, { x: childX + 14 * u, y: platTop - 28 * u }, S.env === 'mars');
    if (run.phase === 'impact') drawStamps(c, g, t, run.res, (i) => (run.imp - 0.9 - 0.25 * i) / 0.2);
    if (run.phase === 'fall') {
      const s = fmt(poseOf(run, g).v), key = s + lang + v;
      if (key !== lastRO) { lastRO = key; lab.setReadout(`${s}<span class="ed-u">${t.ms}</span>`, t.nowV, '', '#ff7a59'); }
    }
  } else {
    const bob = Math.sin(tm * 2) * 1.5 * u;
    drawLander(c, g.dropX, g.relY + bob, d, u, { face: 'ok', tm });
    drawChild(c, childX, platTop, u, { x: g.dropX - m.ew - m.padR - 3 * u, y: g.relY - 12 * u + bob }, S.env === 'mars');
    if (v === 'improve' && same(S.i.cur, S.i.hist[S.i.hist.length - 1].d)) drawStamps(c, g, t, S.i.hist[S.i.hist.length - 1].res, () => 1);
  }
}
function drawTest(c, g, t, tm) {
  const u = g.u * 0.85;
  g.lanes.forEach((lx, i) => drawTarget(c, lx, g.ly, g.pxm, i === 0));
  drawSock(c, g.w - 20 * g.u, g.ly - 3 * g.u, g.u, tm);
  DES.forEach((d, i) => {
    const run = S.t.runs[i];
    if (run) drawRun(c, run, g, tm, i, t); else drawLander(c, g.lanes[i], g.relY, d, u, { face: 'ok', tm });
  });
}
function frame(c, w, h, dt, tm) {
  CW = w; CH = h;
  const v = lab.view, g = geo(w, h, v), t = T[lang];
  for (const r of allRuns()) advance(r, dt);
  if (v === 'improve') ensureImp();
  drawSky(c, w, h, g, tm);
  drawBuilding(c, g, v, tm);
  drawGround(c, w, h, g);
  if (v === 'test') drawTest(c, g, t, tm); else drawSingle(c, g, t, tm, v);
  drawTags(c, g, t);
}
canvasLoop($('cv'), frame);

// --- html builders for the controls ----------------------------------------------------------------------------
const coinI = '<i class="ed-coin"></i>';
function chipHTML(t, g, val, d, off) {
  const on = g === 'chute' ? d.chute === val : !!d[g];
  const cost = g === 'chute' ? CHUTE_C[val] : PCOST[g], mass = g === 'chute' ? CHUTE_G[val] : PMASS[g];
  const name = g === 'chute' ? t.part['c' + val] : t.part[g];
  return `<button class="chip ed-chip ${on ? 'on' : ''}" data-act="part" data-g="${g}" data-v="${val}"${off.has(g) ? ' disabled' : ''}>${esc(name)}<span class="ed-sm">${coinI}${cost} · ${mass} ${esc(t.g)}</span></button>`;
}
function partsHTML(t, d, off) {
  return `<div class="ed-grp"><span class="ed-lbl">${esc(t.pChute)}</span><div class="chips">${[1, 2, 3].map((k) => chipHTML(t, 'chute', k, d, off)).join('')}</div></div>
    <div class="ed-grp"><span class="ed-lbl">${esc(t.pPad)}</span><div class="chips">${['straws', 'sponge', 'bubble'].map((k) => chipHTML(t, k, 1, d, off)).join('')}</div></div>
    <div class="ed-grp"><span class="ed-lbl">${esc(t.pCone)}</span><div class="chips">${chipHTML(t, 'cone', 1, d, off)}</div></div>`;
}
function critHTML(t, res, d) {
  const cost = costOf(d), mass = massOf(d), li = (i, ok) => `<div class="ed-li ${res ? (ok ? 'ed-ok' : 'ed-bad') : ''}"><i>${res ? (ok ? '✔' : '✘') : '○'}</i><span>${esc(t.criteria[i])}</span></div>`;
  const meter = (txt, val, max, label) => `<div class="ed-m ${val > max ? 'ed-over' : ''}"><div class="ed-mt"><span>${esc(txt)}</span><b>${label}</b></div><div class="ed-mb"><i style="width:${clamp(val / max, 0, 1) * 100}%"></i></div></div>`;
  return `<div class="ed-crit"><div class="ed-h">${esc(t.critT)}</div>${li(0, res?.safe)}${li(1, res?.near)}
    <div class="ed-h">${esc(t.consT)}</div>${meter(t.constraints[0], cost, 10, `${cost} / 10`)}${meter(t.constraints[1], mass, 50, `${mass} / 50 ${esc(t.g)}`)}
    ${cost > 10 || mass > 50 ? `<div class="ed-warn">${esc(t.over)}</div>` : ''}</div>`;
}

// --- build view -------------------------------------------------------------------------------------------------
function setPart(d, g, v) { if (g === 'chute') d.chute = d.chute === v ? 0 : v; else d[g] = d[g] ? 0 : 1; }
function landedB(run) {
  if (S.b.run !== run) return;
  S.b.phase = 'done'; (run.res.safe ? sfx.good : sfx.bad)(); render(); showStage();
}
function renderBuild(t) {
  const B = S.b, d = B.d, res = B.phase === 'done' && B.run ? B.run.res : null, busy = B.phase === 'fall', cost = costOf(d), mass = massOf(d), over = cost > 10 || mass > 50;
  $('edB').innerHTML = critHTML(t, res, d) + partsHTML(t, d, busy ? new Set(GROUPS) : new Set())
    + `<div class="ed-act"><button class="btn" data-act="drop"${over || busy ? ' disabled' : ''}>${esc(t.drop)}</button><button class="chip" data-act="clear"${busy ? ' disabled' : ''}>${esc(t.clear)}</button></div>`;
  askEl.style.display = B.phase === 'ask' ? '' : 'none';
  if (B.phase === 'ask') askEl.innerHTML = `<div class="q">${esc(t.askQ)}</div><div class="opts"><button data-a="y">${esc(t.yes)}</button><button data-a="n">${esc(t.no)}</button></div>`;
  lab.setGlow('rgba(255,140,90,.26)');
  lab.setFacts(t.facts.build);
  if (res) {
    const right = B.guess === res.safe, tt = res.safe ? t.bSafe : t.bCrack;
    lab.setReadout(`${fmt(res.v)}<span class="ed-u">${t.ms}</span>`, t.landV, tt, res.safe ? '#2fbf84' : '#ff5a4f');
    lab.setState({ emo: res.safe ? '🎉' : '💥', title: tt, lead: `${t.land(fmt(res.v), fmt(res.limit))} ${t.off(fmt(res.drift))}`, body: `${right ? t.ok : t.miss} ${B.guess ? t.guessY : t.guessN}` });
  } else if (B.phase === 'fall') {
    lab.setReadout('…', t.nowV, '', '#ff7a59');
    lab.setState({ emo: '🪂', title: t.bAsk.title, lead: B.guess ? t.guessY : t.guessN, body: '' });
  } else {
    lab.setReadout(`${cost}<span class="ed-u"> / 10</span>`, `${t.coinsW} · +${mass} ${t.g}`, '', '#ff7a59');
    if (B.phase === 'ask') lab.setState({ emo: '🤔', title: t.bAsk.title, lead: t.bAsk.lead, body: '' });
    else lab.setState({ emo: '🛠️', title: t.b0.title, lead: t.b0.lead, body: t.b0.body });
  }
}
function actBuild(act, el) {
  const B = S.b;
  if (act === 'part' || act === 'clear') {
    if (B.phase === 'fall') return;
    if (act === 'part') setPart(B.d, el.dataset.g, +el.dataset.v); else B.d = mk(0, 0, 0, 0, 0);
    B.phase = 'edit'; B.run = null; B.guess = null; sfx.tick();
  } else if (act === 'drop') {
    if (B.phase === 'fall' || costOf(B.d) > 10 || massOf(B.d) > 50) return;
    B.phase = 'ask'; B.run = null; sfx.click();
  }
}
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (lab.view === 'build' && b.dataset.a) {
    const B = S.b; if (B.phase !== 'ask') return;
    B.guess = b.dataset.a === 'y'; B.phase = 'fall'; B.last = clone(B.d);
    B.run = startRun(B.d, -1, landedB); sfx.click(); lastRO = ''; render();
  } else if (lab.view === 'test' && b.dataset.t !== undefined) {
    const T_ = S.t; if (T_.phase !== 'rank') return;
    T_.guess = +b.dataset.t; T_.phase = 'fall';
    T_.runs = DES.map((d, i) => startRun(d, i, landedT)); sfx.click(); render();
  }
});

// --- fair test view ----------------------------------------------------------------------------------------------
function bestFor(goal) {
  const rs = DES.map((d) => evalD(d, S.env)); let best = null;
  rs.forEach((r, i) => {
    if (goal === 0) { if (r.pass && (best === null || r.cost < rs[best].cost)) best = i; }
    else if (r.safe && (best === null || Number(r.drift.toFixed(1)) < Number(rs[best].drift.toFixed(1)))) best = i;
  });
  return best;
}
function landedT() {
  const T_ = S.t;
  if (T_.runs.length && T_.runs.every((r) => r.landed) && T_.phase === 'fall') {
    T_.phase = 'done';
    const slow = DES.map((d) => evalD(d, S.env).v); T_.slow = slow.indexOf(Math.min(...slow));
    (T_.guess === T_.slow ? sfx.good : sfx.bad)(); render(); showStage();
  } else render();
}
function renderTest(t) {
  const T_ = S.t, rs = DES.map((d) => evalD(d, S.env)), done = T_.phase === 'done';
  askEl.style.display = T_.phase === 'rank' ? '' : 'none';
  if (T_.phase === 'rank') askEl.innerHTML = `<div class="q">${esc(t.tRank)}</div><div class="opts">${LET.map((L, i) => `<button data-t="${i}">${L}</button>`).join('')}</div>`;
  const nm = (d) => [d.chute ? t.part['c' + d.chute] : '', ...['sponge', 'straws', 'bubble', 'cone'].filter((k) => d[k]).map((k) => t.part[k])].filter(Boolean).join(' + ');
  let html = '';
  if (T_.phase === 'rank') {
    html = `<div class="ed-leg">${DES.map((d, i) => `<div class="ed-lr"><b>${LET[i]}</b><span>${esc(nm(d))}</span><em>${coinI}${costOf(d)} · ${massOf(d)} ${esc(t.g)}</em></div>`).join('')}</div>`;
  } else {
    const g = T_.goal, got = g !== null ? T_.got[g] : null, best = g !== null ? bestFor(g) : null;
    html = `<table class="ed-tab"><tr><th></th>${t.tCols.map((x) => `<th>${esc(x)}</th>`).join('')}</tr>${DES.map((d, i) => {
      const r = rs[i], on = T_.runs[i]?.landed, cls = got && i === got.best ? 'ed-good' : got && i === got.pick ? 'ed-wrong' : '';
      const can = done && g !== null && best !== null && !got;
      return `<tr class="${cls}"><td>${can ? `<button class="ed-L" data-act="row" data-i="${i}">${LET[i]}</button>` : `<b class="ed-L">${LET[i]}</b>`}</td>
        <td>${on ? `${fmt(r.v)} ${esc(t.ms)}` : '…'}</td><td class="${on ? (r.safe ? 'ed-y' : 'ed-n') : ''}">${on ? (r.safe ? '✔' : '✘') : '…'}</td>
        <td class="${on ? (r.near ? 'ed-y' : 'ed-n') : ''}">${on ? `${fmt(r.drift)} ${mU()}` : '…'}</td><td>${coinI} ${r.cost}</td></tr>`;
    }).join('')}</table>`;
    if (done) html += `<div class="ed-h">${esc(t.tGoalQ)}</div><div class="chips">${t.goals.map((x, i) => `<button class="chip ed-chip ${g === i ? 'on' : ''}" data-act="goal" data-i="${i}" style="flex-direction:row;align-items:center">${i ? '🎯' : '💰'} ${esc(x)}</button>`).join('')}</div>`;
  }
  html += `<div class="ed-act">${done ? `<button class="btn ghost" data-act="again">${esc(t.again)}</button>` : ''}</div>`;
  $('edT').innerHTML = html;
  lab.setGlow('rgba(80,150,230,.3)');
  lab.setFacts(t.facts.test);
  if (T_.phase === 'rank') {
    lab.setReadout('3', t.rdDes, '', '#4ea8ff');
    lab.setState({ emo: '⚖️', title: t.t0.title, lead: t.t0.lead, body: t.t0.body });
  } else if (T_.phase === 'fall') {
    lab.setReadout('…', t.nowV, '', '#4ea8ff');
    lab.setState({ emo: '⚖️', title: t.t0.title, lead: t.t0.lead, body: t.t0.body });
  } else {
    const mn = Math.min(...rs.map((r) => r.v)), g = T_.goal, got = g !== null ? T_.got[g] : null;
    lab.setReadout(`${fmt(mn)}<span class="ed-u">${t.ms}</span>`, t.rdSlow, '', '#4ea8ff');
    if (got) {
      const best = got.best, right = best !== null && got.pick === best;
      lab.setState({ emo: right ? '🎉' : '🤔', title: right ? t.ok : t.miss, lead: g === 0 ? t.bestMoney(LET[best]) : t.bestTarget(LET[best]), body: '' });
    } else if (g !== null && bestFor(g) === null) {
      lab.setState({ emo: '🔁', title: t.tPick.title, lead: t.noBest, body: '' });
    } else if (g !== null) {
      lab.setState({ emo: '🎯', title: t.goals[g], lead: t.tGoalQ, body: '' });
    } else {
      const right = T_.guess === T_.slow;
      lab.setState({ emo: right ? '🎉' : '🤔', title: right ? t.ok : t.miss, lead: t.tSlow(LET[T_.slow], fmt(rs[T_.slow].v)), body: t.tPick.body });
    }
  }
}
function actTest(act, el) {
  const T_ = S.t;
  if (act === 'goal' && T_.phase === 'done') { T_.goal = +el.dataset.i; sfx.click(); }
  else if (act === 'row' && T_.phase === 'done' && T_.goal !== null && !T_.got[T_.goal]) {
    const best = bestFor(T_.goal), pick = +el.dataset.i;
    T_.got[T_.goal] = { pick, best }; (pick === best ? sfx.good : sfx.bad)();
  } else if (act === 'again') { S.t = freshT(); sfx.click(); }
}

// --- improve view -----------------------------------------------------------------------------------------------
function ensureImp() {
  if (S.i && S.i.src === S.b.last && S.i.env === S.env) return;
  const base = clone(S.b.last || DEF_IMP);
  S.i = { src: S.b.last, env: S.env, cur: clone(base), hist: [{ d: base, res: evalD(base, S.env), chg: null }], run: null, busy: false };
}
const changedGroups = (im) => GROUPS.filter((k) => im.cur[k] !== im.hist[im.hist.length - 1].d[k]);
function chgText(t, a, b) {
  for (const k of GROUPS) if (a[k] !== b[k]) {
    const nm = (x) => (k === 'chute' ? t.part['c' + x] : t.part[k]);
    if (k === 'chute') return a.chute && b.chute ? t.chg.swap(nm(a.chute), nm(b.chute)) : b.chute ? t.chg.add(nm(b.chute)) : t.chg.rem(nm(a.chute));
    return b[k] ? t.chg.add(nm()) : t.chg.rem(nm());
  }
  return t.iStart;
}
function landedI(run) {
  const im = S.i; if (!im || im.run !== run) return;
  im.hist.push({ d: clone(run.d), res: run.res, chg: run.chg }); im.busy = false;
  (run.res.pass ? sfx.good : sfx.bad)(); render(); showStage();
}
function renderImp(t) {
  ensureImp();
  const im = S.i, last = im.hist[im.hist.length - 1], n = im.hist.length, ch = changedGroups(im), off = new Set(im.busy ? GROUPS : ch.length ? GROUPS.filter((k) => k !== ch[0]) : []);
  const cost = costOf(im.cur), mass = massOf(im.cur), over = cost > 10 || mass > 50, res = last.res;
  askEl.style.display = 'none';
  const rows = im.hist.slice(-6).map((h, k) => {
    const idx = im.hist.length > 6 ? im.hist.length - 6 + k : k;
    return `<div class="ed-hr"><b>v${idx + 1}</b><span class="ed-hc">${esc(h.chg ?? t.iStart)}</span><span class="${h.res.safe ? 'ed-y' : 'ed-n'}">🥚${h.res.safe ? '✔' : '✘'}</span><span class="${h.res.near ? 'ed-y' : 'ed-n'}">🎯${h.res.near ? '✔' : '✘'}</span><span class="ed-c">${coinI} ${h.res.cost}</span></div>`;
  }).join('');
  $('edI').innerHTML = critHTML(t, res, im.cur) + `<p class="ed-note">${esc(t.iOne)}</p>` + partsHTML(t, im.cur, off)
    + `<div class="ed-act"><button class="btn" data-act="retest"${!ch.length || over || im.busy ? ' disabled' : ''}>${esc(t.retest)}</button><button class="chip" data-act="back"${im.busy || n < 2 && !ch.length ? ' disabled' : ''}>${esc(t.iBack)}</button></div>`
    + `<div class="ed-hist"><div class="ed-h">${esc(t.iHist)}</div>${rows}</div>`;
  lab.setGlow('rgba(90,200,150,.26)');
  lab.setFacts(t.facts.improve);
  lab.setReadout(`${fmt(res.v)}<span class="ed-u">${t.ms}</span>`, `v${n} · ${t.coins(res.cost)}`, `${(res.safe ? 1 : 0) + (res.near ? 1 : 0)} / 2`, res.pass ? '#2fbf84' : '#ff7a59');
  if (im.busy) { lab.setReadout('…', t.nowV, '', '#ff7a59'); lab.setState({ emo: '🔁', title: `v${n + 1}`, lead: t.iOne, body: '' }); return; }
  const fails = []; if (!res.safe) fails.push(t.iFailEgg(fmt(res.v), fmt(res.limit))); if (!res.near) fails.push(t.iFailTgt(fmt(res.drift)));
  if (n === 1) {
    if (res.pass) lab.setState({ emo: '✅', title: t.iV1Pass.title, lead: t.iV1Pass.lead, body: t.iOne });
    else lab.setState({ emo: '🔁', title: t.iV1Fail, lead: fails.join(' '), body: t.iOne });
  } else {
    const prev = im.hist[n - 2].res;
    lab.setState({ emo: res.pass ? '🎉' : '🔁', title: res.pass ? t.vPass(n) : t.vFail(n), lead: t.speedChg(fmt(prev.v), fmt(res.v)), body: res.pass ? t.costNow(t.coins(res.cost)) : fails.join(' ') });
  }
}
function actImp(act, el) {
  const im = S.i; if (!im || im.busy) return;
  if (act === 'part') {
    const g = el.dataset.g, ch = changedGroups(im);
    if (ch.length && !ch.includes(g)) return;
    setPart(im.cur, g, +el.dataset.v); im.run = null; sfx.tick();
  } else if (act === 'retest') {
    const ch = changedGroups(im); if (!ch.length || costOf(im.cur) > 10 || massOf(im.cur) > 50) return;
    const last = im.hist[im.hist.length - 1].d, chg = chgText(T[lang], last, im.cur);
    im.busy = true; lastRO = ''; im.run = startRun(im.cur, -1, landedI, chg); sfx.click();
  } else if (act === 'back') {
    im.hist = [im.hist[0]]; im.cur = clone(im.hist[0].d); im.run = null; sfx.click();
  }
}

// --- secrets, events, render -------------------------------------------------------------------------------------
function setEnv(k) {
  S.env = S.env === k ? 'normal' : k;
  if (S.env === 'roof') { S.b.d = clone(DES[1]); S.b.last = clone(DES[1]); }
  if (S.env === 'mars') { S.b.d = clone(DES[0]); S.b.last = clone(DES[0]); }
  S.b.phase = 'edit'; S.b.run = null; S.b.guess = null; S.t = freshT(); S.i = null;
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const act = el.dataset.act, v = lab.view;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    setEnv(el.dataset.k); sfx.click();
  } else if (v === 'build') actBuild(act, el);
  else if (v === 'test') actTest(act, el);
  else actImp(act, el);
  render();
});
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = v;
  $('edB').style.display = v === 'build' ? '' : 'none';
  $('edT').style.display = v === 'test' ? '' : 'none';
  $('edI').style.display = v === 'improve' ? '' : 'none';
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.env === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('edS').innerHTML = sc('roof', '🏢') + sc('mars', '🔴');
  if (v === 'build') renderBuild(t); else if (v === 'test') renderTest(t); else renderImp(t);
}
render();
</script>
