// a round friendly character; key: Y amber, V violet, T teal, R rose
function ch(cx, cy, r, mood, key = 'Y') {
  const ey = cy - r * .12, ex = r * .34, er = r * .17, sw = Math.max(1, r * .09), f = (n) => +n.toFixed(2);
  const eye = (x) => `<ellipse cx="${f(x)}" cy="${f(ey)}" rx="${f(er)}" ry="${f(er * 1.2)}" fill="#2a2233"/><circle cx="${f(x - er * .35)}" cy="${f(ey - er * .5)}" r="${f(er * .42)}" fill="#fff"/>`;
  const brow = (x, d) => `<path d="M${f(x - er)},${f(ey - er * 1.9 + d)} L${f(x + er)},${f(ey - er * 1.9 - d)}" stroke="#5a3a2a" stroke-width="${f(sw)}" stroke-linecap="round"/>`;
  let mouth = `<path d="M${f(cx - r * .28)},${f(cy + r * .3)} Q${cx},${f(cy + r * .58)} ${f(cx + r * .28)},${f(cy + r * .3)}" fill="none" stroke="#6a2d36" stroke-width="${f(sw)}" stroke-linecap="round"/>`;
  let extra = '';
  if (mood === 'happy') mouth = `<path d="M${f(cx - r * .4)},${f(cy + r * .2)} Q${cx},${f(cy + r * .95)} ${f(cx + r * .4)},${f(cy + r * .2)} Z" fill="#8a2f3d" stroke="#6a2030" stroke-width="${f(sw * .6)}"/>`;
  else if (mood === 'shock') mouth = `<ellipse cx="${cx}" cy="${f(cy + r * .42)}" rx="${f(r * .14)}" ry="${f(r * .2)}" fill="#8a2f3d"/>`;
  else if (mood === 'sad') {
    mouth = `<path d="M${f(cx - r * .28)},${f(cy + r * .52)} Q${cx},${f(cy + r * .26)} ${f(cx + r * .28)},${f(cy + r * .52)}" fill="none" stroke="#6a2d36" stroke-width="${f(sw)}" stroke-linecap="round"/>`;
    extra = brow(cx - ex, r * .1) + brow(cx + ex, -r * .1) + `<ellipse cx="${f(cx + ex * 1.5)}" cy="${f(cy + r * .22)}" rx="${f(r * .08)}" ry="${f(r * .13)}" fill="#7ec8ff"/>`;
  } else if (mood === 'hmm') {
    mouth = `<path d="M${f(cx - r * .3)},${f(cy + r * .45)} q${f(r * .15)},${f(-r * .15)} ${f(r * .3)},0 t${f(r * .3)},0" fill="none" stroke="#6a2d36" stroke-width="${f(sw)}" stroke-linecap="round"/>`;
    extra = brow(cx - ex, r * .08) + brow(cx + ex, -r * .08);
  }
  return `<ellipse cx="${cx}" cy="${f(cy + r * 1.02)}" rx="${f(r * .8)}" ry="${f(r * .16)}" fill="rgba(0,0,0,.3)"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#piF${key})" stroke="rgba(60,30,30,.5)" stroke-width="${f(Math.max(1, r * .06))}"/>
    <ellipse cx="${f(cx - r * .38)}" cy="${f(cy - r * .55)}" rx="${f(r * .3)}" ry="${f(r * .14)}" fill="rgba(255,255,255,.35)" transform="rotate(-25 ${f(cx - r * .38)} ${f(cy - r * .55)})"/>
    <circle cx="${f(cx - ex * 1.55)}" cy="${f(cy + r * .22)}" r="${f(r * .14)}" fill="rgba(255,120,120,.35)"/><circle cx="${f(cx + ex * 1.55)}" cy="${f(cy + r * .22)}" r="${f(r * .14)}" fill="rgba(255,120,120,.35)"/>
    ${eye(cx - ex)}${eye(cx + ex)}${mouth}${extra}`;
}

    render(); showStage(); return;
  } else if (act === 'xnext') {
    if (S.ex < 2) S.ex++; else { S.ex = 0; S.exLocked = []; S.exFirst = []; }
    S.exBad = []; S.exOk = false; S.exWob = null; sfx.click();
  } else if (act === 'cmp') { S.two.shown = true; sfx.good(); showStage(); }
  else if (act === 'secoff') { S.sec = null; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'two') S.two = { pick: null, shown: false }; else S.mk = 2; }
    sfx.click();
  }
  render();
});

// --- one render per change ---------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec || v;
  const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
  show('secBridge', !sec && v === 'bridge'); show('secSays', !sec && v === 'says'); show('secExplain', !sec && v === 'explain');
  show('secTwo', sec === 'two'); show('secMarks', sec === 'marks');
  $('secLbl').textContent = t.secLbl;
  const un = secret.unlocked();
  $('secChips').innerHTML = [['two', '🔍', t.secrets.a[0]], ['marks', '“”', t.secrets.b[0]]].map(([k, e, n]) =>
    `<button type="button" class="chip secret${un ? ' open' : ''}${sec === k ? ' on' : ''}" data-act="sec" data-k="${k}">${un ? e : '🔒'} ${esc(n)}</button>`).join('');
  if (sec === 'two') renderTwo(t); else if (sec === 'marks') renderMarks(t);
  else if (v === 'bridge') renderBridge(t); else if (v === 'says') renderSays(t); else renderExplain(t);
  lab.setFacts((t.facts[v] ?? []).map((f) => ({ emo: '📚', text: f.text, src: f.src })));
  if (S.phase === 'anim') ensureLoop();
}
render();
</script>
