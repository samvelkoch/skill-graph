  // people on the platform
  for (const [k, dep] of [[0, 0.32], [1, 0.5], [2, 0.72]]) {
    const py = VPY + 4 + (Y0 + SH - VPY - 4) * dep, px = VPX - 24 - (VPX - 24 - (VPX - 100)) * dep - 14 - k * 10, sz = 0.4 + dep * 1.1;
    c.fillStyle = '#2a2a2a'; rr(c, px - 4 * sz, py - 20 * sz, 8 * sz, 16 * sz, 3 * sz); c.fill(); circ(c, px, py - 23 * sz, 3.6 * sz); c.fill();
    c.fillRect(px - 4 * sz, py - 5 * sz, 3 * sz, 6 * sz); c.fillRect(px + 1 * sz, py - 5 * sz, 3 * sz, 6 * sz);
  }
  // tracks
  c.strokeStyle = '#2a2a28'; c.lineWidth = 2; c.beginPath(); c.moveTo(VPX - 2, VPY); c.lineTo(VPX - 50, Y0 + SH); c.moveTo(VPX + 2, VPY); c.lineTo(VPX + 50, Y0 + SH); c.stroke();
  c.strokeStyle = '#5a5a56'; c.lineWidth = 1.2; for (let k = 1; k < 9; k++) { const q = Math.pow(k / 9, 1.8), yy = VPY + (Y0 + SH - VPY) * q, hw = 2 + 48 * q; c.beginPath(); c.moveTo(VPX - hw - 8 * q, yy); c.lineTo(VPX + hw + 8 * q, yy); c.stroke(); }
  // the locomotive grows as it arrives
  const by = VPY + 6 + 150 * Math.pow(f, 1.15), fa = u > 7.4 ? clamp01((cyc - u) / 1.1) : 1;
  c.globalAlpha = fa;
  const fx = VPX, k = f;
  const puff = (i) => { const p2 = ((time * 0.5 + i / 5) % 1); c.fillStyle = `rgba(235,235,228,${0.55 * (1 - p2)})`; circ(c, fx + 4 * k + p2 * 26 * k, by - 128 * k - p2 * 46 * k, (6 + p2 * 16) * k); c.fill(); };
  for (let i = 0; i < 5; i++) puff(i);
  c.fillStyle = '#1a1a19'; c.fillRect(fx - 52 * k, by - 108 * k, 104 * k, 100 * k);
  c.fillStyle = '#2e2e2c'; c.fillRect(fx - 56 * k, by - 116 * k, 112 * k, 10 * k);
  c.fillStyle = (() => { const g = c.createLinearGradient(fx - 44 * k, 0, fx + 44 * k, 0); g.addColorStop(0, '#6a6a66'); g.addColorStop(0.5, '#2c2c2a'); g.addColorStop(1, '#161615'); return g; })();
  circ(c, fx, by - 58 * k, 44 * k); c.fill();
  c.strokeStyle = '#8e8e88'; c.lineWidth = Math.max(0.6, 2 * k); c.stroke();
  c.fillStyle = '#3c3c3a'; circ(c, fx, by - 58 * k, 31 * k); c.fill(); c.strokeStyle = '#7a7a74'; c.lineWidth = Math.max(0.6, 1.4 * k); c.stroke();
  c.fillStyle = '#1b1b1a'; c.beginPath(); c.moveTo(fx - 9 * k, by - 100 * k); c.lineTo(fx - 13 * k, by - 128 * k); c.lineTo(fx + 13 * k, by - 128 * k); c.lineTo(fx + 9 * k, by - 100 * k); c.closePath(); c.fill();
  c.fillStyle = '#f4f2e6'; circ(c, fx, by - 70 * k, 6 * k); c.fill();
  c.fillStyle = '#242422'; c.fillRect(fx - 56 * k, by - 12 * k, 112 * k, 12 * k);
  c.fillStyle = '#bdbcb4'; circ(c, fx - 42 * k, by - 6 * k, 5 * k); c.fill(); circ(c, fx + 42 * k, by - 6 * k, 5 * k); c.fill();
  c.strokeStyle = '#3a3a38'; c.lineWidth = Math.max(0.6, 2.4 * k); c.beginPath(); c.moveTo(fx, by - 2 * k); c.lineTo(fx - 50 * k, by + 12 * k); c.moveTo(fx, by - 2 * k); c.lineTo(fx + 50 * k, by + 12 * k); c.stroke();
  c.globalAlpha = 1;
  // flicker, scratches, dust and a vignette
  c.fillStyle = `rgba(0,0,0,${0.04 + 0.12 * Math.abs(Math.sin(time * 31.7) * Math.sin(time * 13.1))})`; c.fillRect(X0 - 4, Y0 - 4, SW + 8, SH + 8);
  c.fillStyle = `rgba(255,255,255,${0.05 * Math.abs(Math.sin(time * 47))})`; c.fillRect(X0 - 4, Y0 - 4, SW + 8, SH + 8);
  c.strokeStyle = 'rgba(235,235,225,.4)'; c.lineWidth = 1; c.beginPath();
  for (let i = 0; i < 2; i++) { const sx = X0 + hsh(ph * 7 + i * 13) * SW; c.moveTo(sx, Y0); c.lineTo(sx + (hsh(ph + i) - 0.5) * 6, Y0 + SH); } c.stroke();
  c.fillStyle = 'rgba(230,230,220,.55)';
  for (let i = 0; i < 14; i++) { circ(c, X0 + hsh(ph * 11 + i) * SW, Y0 + hsh(ph * 17 + i * 3) * SH, 0.5 + hsh(i + ph) * 1.2); c.fill(); }
  const vg = c.createRadialGradient(W / 2, Y0 + SH / 2, 60, W / 2, Y0 + SH / 2, 190); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)');
  c.fillStyle = vg; c.fillRect(X0 - 4, Y0 - 4, SW + 8, SH + 8);
  c.restore();
  pill(c, T[lang].secrets.b[1], W / 2, 12, 'c', { stroke: '#8a8a84' });
  pill(c, '1896', W / 2, 296, 'c', { stroke: '#8a8a84' });
  c.restore();
}

// --- per-frame update ---------------------------------------------------------------------------------------------
function step(dt, time) {
  if (S.play) {
    S.play.t += dt;
    const u = clamp01(S.play.t / 10), e = u * u * (3 - 2 * u);
    S.year = 1880 + 30 * e; S.yd = S.year;
    if (u >= 1) { S.play = null; S.year = 1910; S.yd = 1910; render(); }
  } else {
    const d = S.year - S.yd;
    S.yd = Math.abs(d) < 0.003 ? S.year : S.yd + d * (1 - Math.exp(-dt * 7));
  }
  for (const k in THINGS) {
    const on = S.yd > THINGS[k] - 0.5;
    if (on && !S.on[k]) { S.tags[k] = time; if (k === 'car') S.carT = time; if (k === 'plane') S.planeT = time; if (lab.view === 'street' && !S.sec) sfx.tick(); }
    S.on[k] = on;
  }
  const ek = 1 - Math.exp(-dt * 15);
  for (let i = 0; i < 6; i++) {
    if (S.drag && S.drag.moved && S.drag.i === i) continue;
    if (time < O.hold[i]) continue;
    const [tx, ty] = targetOf(i), p = O.pos[i];
    p.x += (tx - p.x) * ek; p.y += (ty - p.y) * ek;
  }
  if (lab.view === 'street') streetUI(false);
}

// --- controls and rendering -----------------------------------------------------------------------------------
const cv = $('cv');
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(i) {
  const v = lab.view;
  if (S.pred[v] !== null) return;
  S.pred[v] = i; (i === RIGHT[v] ? sfx.good : sfx.bad)();
  if (v === 'street') { S.play = { t: 0 }; S.year = 1880; S.yd = 1880; }
  if (v === 'home') S.homeAt = performance.now() / 1000;
  render(); showStage();
}
function checkOrder() {
  if (S.checked || S.pred.order === null || O.slots.includes(-1)) return;
  const now = performance.now() / 1000;
  S.k = O.slots.filter((card, j) => card === j).length;
  for (let i = 0; i < 6; i++) O.was[i] = O.loc[i].k === 'slot' && O.loc[i].j === i;
  O.badge.fill(now);
  let n = 0;
  for (let i = 0; i < 6; i++) if (!O.was[i]) O.hold[i] = now + 0.7 + 0.12 * n++;
  O.slots = [0, 1, 2, 3, 4, 5]; O.pool = Array(6).fill(-1);
  for (let i = 0; i < 6; i++) O.loc[i] = { k: 'slot', j: i };
  S.checked = true; S.sel = -1; (S.k === 6 ? sfx.good : sfx.snap)();
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const o = ev.target.closest('.n9-opt');
  if (o) { if (!o.disabled) answer(+o.dataset.i); return; }
  const sc = ev.target.closest('[data-sec]');
  if (sc) {
    if (!secret.unlocked()) return secret.open();
    const k = sc.dataset.sec;
    S.sec = S.sec === k ? null : k; S.secAt = performance.now() / 1000; sfx.click(); render(); if (S.sec) showStage();
    return;
  }
  if (ev.target.closest('#n9Check')) { checkOrder(); return; }
  if (ev.target.closest('#n9Again')) { shuffleCards(); sfx.click(); render(); }
});
$('n9Yr').addEventListener('input', (ev) => {
  if (S.pred.street === null || S.play) return;
  S.year = +ev.target.value; streetUI(false);
});

// dragging the cards (or tap a card, then a slot)
const toDesign = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - G.ox) / G.s, (ev.clientY - r.top - G.oy) / G.s]; };
const hitCard = (x, y) => {
  const idx = [0, 1, 2, 3, 4, 5].filter((i) => i !== S.sel); if (S.sel >= 0) idx.push(S.sel);
  for (let n = idx.length - 1; n >= 0; n--) { const p = O.pos[idx[n]]; if (x >= p.x && x <= p.x + CW && y >= p.y && y <= p.y + CH) return idx[n]; }
  return -1;
};
const hitSlot = (x, y) => { for (let j = 0; j < 6; j++) { const [sx, sy] = slotXY(j); if (x >= sx - 4 && x <= sx + CW + 4 && y >= sy - 4 && y <= sy + CH + 4) return j; } return -1; };
const orderLive = () => lab.view === 'order' && !S.sec && S.pred.order !== null && !S.checked;
cv.addEventListener('pointerdown', (ev) => {
  if (!orderLive()) return;
  const [x, y] = toDesign(ev), i = hitCard(x, y);
  S.drag = { i, x0: x, y0: y, moved: false, dx: i >= 0 ? x - O.pos[i].x : 0, dy: i >= 0 ? y - O.pos[i].y : 0 };
  if (i >= 0) { try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ } }
});
cv.addEventListener('pointermove', (ev) => {
  const d = S.drag; if (!d) return;
  const [x, y] = toDesign(ev);
  if (!d.moved && Math.hypot(x - d.x0, y - d.y0) > 7) { d.moved = d.i >= 0; if (d.moved) { S.sel = -1; sfx.tick(); } }
  if (d.moved) { O.pos[d.i].x = x - d.dx; O.pos[d.i].y = y - d.dy; }
});
const endDrag = (ev, cancel) => {
  const d = S.drag; if (!d) return;
  S.drag = null;
  if (cancel || !orderLive()) { render(); return; }
  const [x, y] = toDesign(ev);
  if (d.moved) {
    const p = O.pos[d.i], cx = p.x + CW / 2, cy = p.y + CH / 2;
    let best = 44, j = -1;
    for (let q = 0; q < 6; q++) { const [sx, sy] = slotXY(q), dist = Math.hypot(cx - (sx + CW / 2), cy - (sy + CH / 2)); if (dist < best) { best = dist; j = q; } }
    if (j >= 0) placeCard(d.i, j); else if (cx > PX - 12) toPool(d.i);
  } else {
    const hit = hitCard(x, y);
    if (hit >= 0) {
      if (S.sel >= 0 && S.sel !== hit && O.loc[hit].k === 'slot') { placeCard(S.sel, O.loc[hit].j); S.sel = -1; }
      else { S.sel = S.sel === hit ? -1 : hit; sfx.tick(); }
    } else if (S.sel >= 0) {
      const j = hitSlot(x, y);
      if (j >= 0) { placeCard(S.sel, j); S.sel = -1; } else if (x > PX - 8) { toPool(S.sel); S.sel = -1; }
    }
  }
  render();
};
cv.addEventListener('pointerup', (ev) => endDrag(ev, false));
cv.addEventListener('pointercancel', (ev) => endDrag(ev, true));

function streetUI(force) {
  const t = T[lang], pred = S.pred.street !== null, yr = Math.round(S.yd), sy = Math.round(S.year);
  const key = `${lang}|${pred}|${yr}|${sy}|${S.play ? 1 : 0}|${S.sec}`;
  if (!force && key === S.uiKey) return;
  S.uiKey = key;
  const list = EV.filter((e) => e[0] <= yr), last = list[list.length - 1];
  if (!S.sec) lab.setReadout(String(yr), pred && last ? t.newest(t.events[last[1]]) : '', pred ? t.nNew(list.length) : '', '#e0a14a');
  const el = $('n9Yr'); if (+el.value !== sy) el.value = String(sy);
  el.disabled = !pred || !!S.play;
  el.setAttribute('aria-label', t.year);
  $('n9Evs').innerHTML = pred ? list.map((e) => `<span class="n9-ev${e === last ? ' new' : ''}">${e[2]} ${esc(t.events[e[1]])} <i>${e[0]}</i></span>`).join('') : '';
}

function renderAsk(t, v) {
  const q = { street: t.streetAsk, order: t.orderAsk, home: t.homeAsk }[v];
  const opts = { street: t.streetOpts, order: t.orderOpts, home: t.homeOpts }[v];
  const msg = { street: [t.streetRight, t.streetWrong], order: [t.orderRight, t.orderWrong], home: [t.homeRight, t.homeWrong] }[v];
  const p = S.pred[v], right = RIGHT[v];
  $('n9Ask').innerHTML = `<div class="n9-q">${esc(q)}</div><div class="n9-opts">${opts.map((o, i) => {
    const cls = p === null ? '' : i === right ? ' good' : i === p ? ' bad' : '';
    return `<button class="n9-opt${cls}" data-i="${i}"${p !== null ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('')}</div>${p === null ? '' : `<div class="n9-verd ${p === right ? 'ok' : 'bad'}">${esc(p === right ? msg[0] : msg[1])}</div>`}`;
}

function render() {
  const t = T[lang], v = lab.view, pred = S.pred[v] !== null;
  document.body.dataset.v = v;
  $('n9Street').style.display = v === 'street' ? '' : 'none';
  $('n9Order').style.display = v === 'order' ? '' : 'none';
  renderAsk(t, v);
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('n9Sec').innerHTML = sc('a', '☢️') + sc('b', '🎞️');
  $('n9E0').textContent = t.then; $('n9E1').textContent = t.now;
  cv.style.touchAction = orderLive() ? 'none' : '';
  const st = t.st[v];
  if (v === 'street') {
    lab.setGlow('rgba(224, 161, 74, .26)'); S.uiKey = ''; streetUI(true);
  } else if (v === 'order') {
    lab.setGlow('rgba(95, 168, 160, .24)');
    $('n9Check').textContent = t.check; $('n9Check').disabled = S.checked || !pred || O.slots.includes(-1);
    $('n9Again').style.display = S.checked ? '' : 'none';
    $('n9Check').style.display = S.checked ? 'none' : '';
    if (!S.sec) lab.setReadout(S.checked ? `<span class="n9-vs">${esc(t.places(S.k))}</span>` : '?', '', t.span, '#5fa8a0');
  } else {
    lab.setGlow('rgba(217, 130, 95, .24)');
    if (!S.sec) lab.setReadout(pred ? esc(t.nz) : '?', '', pred ? t.fi : '', '#d9825f');
  }
  if (S.sec) {
    const a = S.sec === 'a';
    lab.setReadout(a ? '1895' : '1896', t.secrets[S.sec][0], '', '#8fb8ff');
    lab.setState({ emo: a ? '☢️' : '🎞️', title: t.secrets[S.sec][0], lead: a ? t.xrayText : t.filmText, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  if (!pred) lab.setState({ emo: '🤔', title: { street: t.streetAsk, order: t.orderAsk, home: t.homeAsk }[v], lead: '', body: '', extra: '' });
  else if (v === 'order' && !S.checked) lab.setState({ emo: st[0], title: st[1], lead: t.dragHint, body: '', extra: '' });
  else lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
  lab.setFacts(pred ? t.facts[v] : []);
}

canvasLoop(cv, (c, w, h, dt, time) => {
  step(dt, time);
  if (S.sec === 'a') return drawXray(c, w, h, time);
  if (S.sec === 'b') return drawFilm(c, w, h, time);
  const v = lab.view;
  if (v === 'street') drawStreet(c, w, h, dt, time);
  else if (v === 'order') drawOrder(c, w, h, dt, time);
  else drawHome(c, w, h, dt, time);
});
render();
</script>
