  const bg = c.createLinearGradient(-10, 0, 10, 0); bg.addColorStop(0, '#9a6a3e'); bg.addColorStop(1, '#5a3720');
  const bucket = () => { c.beginPath(); c.moveTo(-10, -8); c.lineTo(10, -8); c.quadraticCurveTo(11, 9, 0, 11); c.quadraticCurveTo(-11, 9, -10, -8); c.closePath(); };
  bucket(); c.fillStyle = bg; c.fill(); c.strokeStyle = '#2a170b'; c.lineWidth = 1.6; c.stroke();
  if (S.full) { // water level goes down while it pours
    c.save(); bucket(); c.clip(); c.fillStyle = '#58aee6'; const lvl = -8 + 6 + S.tilt * 12; c.fillRect(-14, lvl, 28, 24); c.restore();
  }
  c.fillStyle = '#c8975a'; c.beginPath(); c.ellipse(0, -8, 10, 2.6, 0, 0, 7); c.fill(); c.strokeStyle = '#2a170b'; c.lineWidth = 1.2; c.stroke();
  c.restore();
  if (S.phase === 'pour' && S.tilt > 0.1) { // the stream falls into the trough
    const lx = A[0] + 12 * S.tilt, ly = A[1] + 8 + 6 * S.tilt;
    c.strokeStyle = 'rgba(130,205,250,.9)'; c.lineWidth = 3 * S.tilt + 1; c.beginPath(); c.moveTo(lx, ly); c.quadraticCurveTo(lx + 3, ly + (FL - ly) * 0.6, lx + 2, FL - 2); c.stroke();
  }
  // water: the river and, in the flood, the field
  c.save(); c.beginPath(); c.moveTo(XA, -300); c.lineTo(XB, -300); c.lineTo(XB, FL); c.lineTo(108, FL); c.bezierCurveTo(108, 200, 96, 225, 88, 262); c.lineTo(XA, 262); c.closePath(); c.clip();
  const wy = S.water, wg = c.createLinearGradient(0, wy, 0, wy + 120); wg.addColorStop(0, 'rgba(88,174,230,.86)'); wg.addColorStop(1, 'rgba(24,82,140,.95)');
  c.fillStyle = wg; c.fillRect(XA, wy, XB - XA, 700 - wy);
  c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.6; c.beginPath(); for (let x = XA; x <= XB; x += 8) { const y = wy + Math.sin(x * 0.08 + time * 2) * 1.2; if (x === XA) c.moveTo(x, y); else c.lineTo(x, y); } c.stroke();
  c.restore();
  c.restore();
  // the season strip and the two bars, in screen pixels
  const sx = 10, sw = w - 20, sy = 8, sh = 26, cols = { flood: '#2f78c4', grow: '#4ca34f', harvest: '#d3a63a' };
  ['flood', 'grow', 'harvest'].forEach((k, i) => {
    const x = sx + (sw / 3) * i, on = S.season === k;
    c.globalAlpha = on ? 1 : 0.5; c.fillStyle = cols[k]; c.beginPath(); c.roundRect(x + 1, sy, sw / 3 - 2, sh, 10); c.fill();
    if (on) { c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke(); }
    c.globalAlpha = 1; c.fillStyle = '#fff'; c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(tt.strip[k], x + sw / 6, sy + sh / 2 + 1);
  });
  pill(c, tt.year, w / 2, sy + sh + 16, { fs: 12, bg: 'rgba(12,16,28,.7)' });
  const hx = w - 146, hy = h - 54; // bottom right, over the soil
  c.fillStyle = 'rgba(12,16,28,.72)'; c.beginPath(); c.roundRect(hx, hy, 138, 44, 12); c.fill();
  c.font = '14px Nunito, sans-serif'; c.textAlign = 'left'; c.fillStyle = '#fff'; c.fillText('💧', hx + 6, hy + 14); c.fillText('🌾', hx + 6, hy + 32);
  for (const [k, val, col] of [[0, S.soil, '#58aee6'], [1, S.growth, '#8fd35a']]) {
    c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.roundRect(hx + 30, hy + 10 + k * 18, 100, 8, 4); c.fill();
    c.fillStyle = col; c.beginPath(); c.roundRect(hx + 30, hy + 10 + k * 18, Math.max(6, 100 * clamp01(val)), 8, 4); c.fill();
  }
}
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'shaduf') return;
  const r = $('cv').getBoundingClientRect(), y = ev.clientY - r.top, x = ev.clientX - r.left;
  if (y < 36) { setSeason(['flood', 'grow', 'harvest'][clamp(Math.floor(((x - 10) / (r.width - 20)) * 3), 0, 2)]); render(); return; }
  S.hold = true; $('holdB').classList.add('down');
});
const release = () => { S.hold = false; $('holdB').classList.remove('down'); };
addEventListener('pointerup', release); addEventListener('pointercancel', release);
const hb = $('holdB');
hb.addEventListener('pointerdown', (ev) => { ev.preventDefault(); S.hold = true; hb.classList.add('down'); });
hb.addEventListener('keydown', (ev) => { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); S.hold = true; hb.classList.add('down'); } });
hb.addEventListener('keyup', (ev) => { if (ev.key === ' ' || ev.key === 'Enter') release(); });
hb.addEventListener('contextmenu', (ev) => ev.preventDefault());

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'guess') { makeGuess(b.dataset.g); return; }
  if (act === 'boat') { S.tb = now(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'train') { S.train = !S.train; if (S.train) { S.trainP = 0; S.trainRun = true; S.trainKm = -1; } }
    else { S.pal = !S.pal; if (S.pal) { S.palSide = 0; S.palP = 0; } }
    sfx.click();
  } else if (act === 'train') { S.trainP = 0; S.trainRun = true; S.trainKm = -1; sfx.click(); }
  else if (act === 'crown') {
    if (S.cmode === 'explore') { if (S.crown !== b.dataset.c) { S.crown = b.dataset.c; S.cAt = now(); sfx.click(); } }
    else if (S.picked === null) {
      const right = CHAL[S.round], ok = b.dataset.c === right;
      S.picked = b.dataset.c; S.rights[S.round] = ok; S.crown = right; S.cAt = now(); (ok ? sfx.good : sfx.bad)(); showStage();
    }
  } else if (act === 'chal') {
    if (S.cmode === 'explore') { S.cmode = 'chal'; S.round = 0; S.picked = null; S.rights = []; S.crown = 'none'; S.cAt = now(); }
    else { S.cmode = 'explore'; S.crown = 'none'; S.cAt = now(); }
    sfx.click();
  } else if (act === 'next') {
    if (S.round >= 3) { S.round = 0; S.rights = []; } else S.round++;
    S.picked = null; S.crown = 'none'; S.cAt = now(); sfx.click();
  } else if (act === 'flip') { S.palSide = 1 - S.palSide; sfx.click(); }
  else if (act === 'season') { setSeason(b.dataset.s); }
  render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------------
function renderMapReadout() {
  const t = T[lang].map, k = S.found.filter(Boolean).length;
  if (S.train) lab.setReadout(`${fmt(S.trainP * NILE_KM)}`, t.train.km, `${Math.round(S.trainP * NILE_H)} ${t.train.hrs}`, '#f5c84c');
  else if (S.guess === null) lab.setReadout('?', '', '', '#5fa8c8');
  else lab.setReadout(`${k}/3`, t.found, t.flows, '#5fa8c8');
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v === 'map' && S.train ? 'train' : v;
  $('secMap').hidden = v !== 'map'; $('secCrowns').hidden = v !== 'crowns'; $('secShaduf').hidden = v !== 'shaduf';
  if (v === 'map') renderMap(t); else if (v === 'crowns') renderCrowns(t); else renderShaduf(t);
}
const secChip = (k, emo, on) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(T[lang].secrets[k][0])}` : '🔒 ???'}</button>`;
function renderMap(t) {
  const m = t.map, known = S.guess !== null, k = S.found.filter(Boolean).length;
  lab.setGlow('rgba(95, 168, 200, .26)');
  $('gN').textContent = m.gN; $('gS').textContent = m.gS; $('boatB').textContent = m.boat;
  $('mGuess').hidden = known; $('mAfter').hidden = !known; $('boatB').hidden = S.train; $('mTrain').hidden = !S.train;
  $('trainB').textContent = S.trainP >= 1 ? m.train.again : m.train.go;
  $('mChips').innerHTML = known ? secChip('train', '🚆', S.train) : '';
  renderMapReadout();
  if (!known) { lab.setState({ emo: '🧭', title: m.q, lead: m.qLead, body: m.qBody }); lab.setFacts([]); return; }
  if (S.train) {
    lab.setState({ emo: '🚆', title: m.train.title, lead: m.train.lead(NILE_H, NILE_D), body: m.train.body });
    lab.setFacts([factOf('nile')]); return;
  }
  const ok = S.guess === 'south', tk = m.tasks[Math.min(k, 2)], lm = S.lastMsg;
  let st;
  if (k >= 3) st = { emo: '🎉', title: m.all, lead: m.allLead, body: '' };
  else if (lm && lm.ok) st = { emo: '📍', title: m.tasks[lm.idx].t, lead: m.tasks[lm.idx].l, body: '' };
  else if (lm && !lm.ok) st = { emo: '🤔', title: m.no, lead: m.tasks[lm.idx].no, body: '' };
  else st = { emo: ok ? '✅' : '🤔', title: m.verdict(ok), lead: m.ans, body: m.ans2 };
  lab.setState({ ...st, extra: k < 3 ? `<div class="tl-task">📍 ${esc(tk.q)}</div>` : '' });
  lab.setFacts([factOf('names'), ...(S.found[0] ? [factOf('thebes')] : []), ...(S.found[1] ? [factOf('memphis')] : [])]);
}
function renderCrowns(t) {
  const c = t.crowns, chal = S.cmode === 'chal', known = S.guess !== null, pal = S.pal && known;
  lab.setGlow('rgba(224, 176, 80, .24)');
  if (!known) S.pal = false;
  $('cW').textContent = c.white; $('cR').textContent = c.red; $('cB').textContent = c.both; $('cChal').textContent = chal ? c.back : c.chal;
  $('cPick').hidden = pal; $('cMode').hidden = pal; $('cSec').hidden = !known; $('cFlip').hidden = !pal; $('cFlip').textContent = c.flip;
  $('cChips').innerHTML = known ? secChip('pal', '🪨', S.pal) : '';
  const nx = $('cNext'); nx.hidden = !(chal && (S.picked !== null || S.round >= 3)); nx.textContent = S.round >= 3 ? c.again : c.next;
  const right = chal && S.round < 3 && S.picked !== null ? CHAL[S.round] : null;
  for (const [id, key] of [['cW', 'white'], ['cR', 'red'], ['cB', 'both']]) {
    const b = $(id); b.disabled = chal && (S.picked !== null || S.round >= 3);
    b.classList.toggle('on', !chal && S.crown === key);
    b.classList.toggle('good', right !== null && key === right);
    b.classList.toggle('bad', right !== null && key === S.picked && key !== right);
  }
  const ev = `<div class="tl-ev"><b>${esc(c.legend)}</b>${esc(c.legendT)}</div><div class="tl-ev"><b>${esc(c.evidence)}</b>${esc(c.evidenceT)}</div>`;
  const facts = [factOf('pschent'), factOf('djet'), factOf('narmer')];
  if (pal) {
    const side = S.palSide;
    lab.setReadout('Narmer', c.palSub, `${side + 1} / 2`, '#e0b04a');
    lab.setState({ emo: '🪨', title: c.pal[side][0], lead: c.pal[side][1], body: c.palBody }); lab.setFacts([factOf('narmer')]); return;
  }
  if (chal) {
    const r = S.round;
    if (r >= 3) {
      const k = S.rights.filter(Boolean).length;
      lab.setReadout(`${k}/3`, c.roundSub, '', '#e0b04a'); lab.setState({ emo: '🏆', title: c.end(k), lead: c.endLead, body: '', extra: ev });
    } else if (S.picked === null) {
      lab.setReadout(`${r + 1}/3`, c.roundSub, '', '#e0b04a'); lab.setState({ emo: '❓', title: c.qs[r], lead: c.ask(r + 1), body: '' });
    } else {
      const ok = S.rights[r];
      lab.setReadout(c.names[CHAL[r]], c.lands[CHAL[r]], `${r + 1}/3`, '#e0b04a');
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? c.right : c.wrong, lead: c.why[r], body: ok ? '' : c.wrongTail });
    }
    lab.setFacts(facts); return;
  }
  const k = S.crown;
  if (k === 'none') { lab.setReadout('?', c.sub, '', '#e0b04a'); lab.setState({ emo: '👑', title: c.none[0], lead: c.none[1], body: '' }); }
  else {
    lab.setReadout(c.names[k], c.lands[k], '', '#e0b04a');
    lab.setState({ emo: k === 'white' ? '⚪' : k === 'red' ? '🔴' : '👑', title: c.card[k][0], lead: c.card[k][1], body: known ? c.geo[k] : '', extra: k === 'both' ? ev : '' });
  }
  lab.setFacts(facts);
}
function renderShaduf(t) {
  const s = t.shaduf, k = S.season;
  lab.setGlow('rgba(95, 176, 100, .24)');
  $('holdB').textContent = s.hold;
  document.querySelectorAll('#seasons button').forEach((b) => { b.textContent = s.seasons[b.dataset.s]; b.classList.toggle('on', b.dataset.s === k); });
  const ready = k === 'grow' && S.growth >= 1;
  document.querySelector('#seasons [data-s=harvest]').classList.toggle('pulse', ready);
  lab.setReadout(`🪣 ${S.buckets}`, s.sub, s.strip[k], '#8fd35a');
  const card = k === 'flood' ? s.flood : k === 'harvest' ? (S.growth >= 1 ? s.good : s.poor) : ready ? s.ready : S.soil < 0.25 ? s.thirsty : s.grow;
  lab.setState({ emo: k === 'flood' ? '🌊' : k === 'harvest' ? '🌾' : ready ? '🌾' : S.soil < 0.25 ? '🥀' : '🌱', title: card[0], lead: card[1], body: card[2] });
  lab.setFacts([factOf('shaduf1'), factOf('seasons'), factOf('shaduf2')]);
}

// --- start: everything above is declared, now the loop and the first render ----------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  const v = lab.view;
  if (v === 'map') { if (S.train) drawTrain(c, w, h, dt, time); else drawMap(c, w, h, dt, time); }
  else if (v === 'crowns') drawCrowns(c, w, h, dt, time);
  else drawShaduf(c, w, h, dt, time);
});
render();
</script>
