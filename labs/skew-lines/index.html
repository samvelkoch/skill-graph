    }

  if (!S.dragged && (wide || !planOn)) pillText(c, t.hint, wide && planOn ? reg[2] / 2 : w / 2, h - 16, { bg: 'rgba(10,12,24,.7)', fg: '#B9C1DA' });
}

// --- input: drag turns the room, a tap picks an edge or a label -----------------------------------------------
const cv = $('cv');
cv.addEventListener('pointerdown', (ev) => {
  cv.setPointerCapture(ev.pointerId);
  S.drag = { x: ev.clientX, y: ev.clientY, yaw: S.yaw, pitch: S.pitch, moved: false };
});
cv.addEventListener('pointermove', (ev) => {
  const d = S.drag; if (!d) return;
  const dx = ev.clientX - d.x, dy = ev.clientY - d.y;
  if (!d.moved && Math.hypot(dx, dy) > 7) { d.moved = true; S.dragged = true; S.yawT = null; S.pitchT = null; }
  if (d.moved) { S.yaw = d.yaw + dx * 0.01; S.pitch = clamp(d.pitch + dy * 0.008, 0.12, 1.1); }
});
const endDrag = (ev) => {
  const d = S.drag; S.drag = null;
  if (!d || d.moved || ev.type === 'pointercancel') return;
  const r = cv.getBoundingClientRect();
  tap(ev.clientX - r.left, ev.clientY - r.top);
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
function tap(x, y) {
  const v = lab.view;
  if (v === 'edges' && !S.sec) {
    let best = null, bd = 18;
    for (const e of geo.edges) {
      const dx = e.bx - e.ax, dy = e.by - e.ay, l2 = dx * dx + dy * dy || 1, u = clamp(((x - e.ax) * dx + (y - e.ay) * dy) / l2, 0, 1);
      const d = Math.hypot(x - (e.ax + u * dx), y - (e.ay + u * dy));
      if (d < bd) { bd = d; best = e.id; }
    }
    if (best !== null) selectEdge(best);
  } else if (v === 'planes') {
    const b = geo.badges.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
    if (b) selectPlane(b.i);
  }
}
const turnTo = (d) => { S.yawT = (S.yawT ?? S.yaw) + d; };
const nearYaw = (target) => { let d = target - S.yaw; d = ((d + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return S.yaw + d; };
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };

// --- actions -----------------------------------------------------------------------------------------------
function selectEdge(id) {
  if (S.ev || (S.ea !== null && S.eb !== null)) { S.ea = id; S.eb = null; S.ev = false; S.eg = null; }
  else if (S.ea === null) S.ea = id;
  else if (S.ea === id) S.ea = null;
  else S.eb = id;
  sfx.tick(); render();
}
function selectPlane(i) {
  if (S.pv || (S.pa !== null && S.pb !== null)) { S.pa = i; S.pb = null; S.pv = false; S.pg = null; }
  else if (S.pa === null) S.pa = i;
  else if (S.pa === i) S.pa = null;
  else S.pb = i;
  sfx.tick(); render();
}
function guessEdge(k) {
  if (S.ea === null || S.eb === null || S.ev) return;
  const kind = edgeKind(S.ea, S.eb);
  S.eg = k; S.ev = true; S.ef[kind].add(pairKey(S.ea, S.eb));
  (k === kind ? sfx.good : sfx.bad)(); render(); showStage();
}
function guessPlane(k) {
  if (S.pa === null || S.pb === null || S.pv) return;
  const kind = planeKind(S.pa, S.pb);
  S.pg = k; S.pv = true; S.pf[kind].add(pairKey(S.pa, S.pb));
  (k === kind ? sfx.good : sfx.bad)(); render(); showStage();
}
function guessPole(g) {
  if (S.tv) return;
  S.tg = g; S.tv = true; S.tmoved = false;
  S.yawT = nearYaw(-Math.PI / 2); S.pitchT = 0.4;
  (g === 'no' ? sfx.good : sfx.bad)(); render(); showStage();
}
function randomPair() {
  const all = []; for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) all.push([i, j]);
  const seen = new Set([...S.ef.cross, ...S.ef.par, ...S.ef.skew]), fresh = all.filter(([i, j]) => !seen.has(pairKey(i, j))), pool = fresh.length ? fresh : all;
  const [i, j] = pool[Math.floor(Math.random() * pool.length)];
  S.ea = i; S.eb = j; S.ev = false; S.eg = null; sfx.click(); render();
}
function againPole() {
  S.tilt0 = 10 + 2 * Math.floor(Math.random() * 5); S.lean0 = Math.random() < 0.5 ? 90 : 270;
  S.tilt = S.tilt0; S.lean = S.lean0; S.tg = null; S.tv = false; S.tmoved = false;
  S.yawT = nearYaw(0.06); S.pitchT = 0.5; sfx.click(); render();
}
function onView() {
  if (lab.view === 'pole' && !S.tv) { S.yawT = nearYaw(0.06); S.pitchT = 0.5; }
  render();
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'turn') { turnTo(Math.PI / 2); sfx.click(); return; }
  if (act === 'g1') guessEdge(b.dataset.k);
  else if (act === 'g2') guessPlane(b.dataset.k);
  else if (act === 'g3') guessPole(b.dataset.k);
  else if (act === 'rand') randomPair();
  else if (act === 'pl') selectPlane(+b.dataset.i);
  else if (act === 'lean') { S.lean = (S.lean + 45) % 360; S.tmoved = true; sfx.click(); render(); }
  else if (act === 'again') againPole();
  else if (act === 'pair') { S.pair = (S.pair + 1) % ANG.length; S.sl = 0; sfx.click(); render(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; if (S.sec === 'ang') { S.sl = 0; } sfx.click(); render();
  }
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'rFly') S.hb = +ev.target.value;
  else if (id === 'rAng') S.sl = +ev.target.value;
  else if (id === 'rTilt') { S.tilt = +ev.target.value; S.tmoved = true; }
  else return;
  render();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.querySelectorAll('[data-act=turn]').forEach((b) => { b.textContent = t.turn; });
  $('s1').hidden = v !== 'edges'; $('s2').hidden = v !== 'planes'; $('s3').hidden = v !== 'pole';
  if (v === 'edges') renderEdges(t); else if (v === 'planes') renderPlanes(t); else renderPole(t);
}
const fx = (list) => list.map(([k, e, s]) => ({ emo: e, text: T[lang].fx[k], src: SRC[s] }));
const gbtn = (act, k, label, col, cls, dis) => `<button class="tl-b ${cls || ''}" data-act="${act}" data-k="${k}"${dis ? ' disabled' : ''}><i style="background:${col}"></i>${esc(label)}</button>`;
const counts = (items) => items.map(([col, label, n]) => `<span><i style="background:${col}"></i>${esc(label)}<b>${n}</b></span>`).join('');

function renderEdges(t) {
  const sec = S.sec, open = secret.unlocked(), e = t.e;
  $('secChips').innerHTML = [['fly', '🌉'], ['ang', '📐']].map(([k, emo]) => `<button class="chip tl-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('sFly').hidden = sec !== 'fly'; $('sAng').hidden = sec !== 'ang'; $('bPair').hidden = sec !== 'ang';
  $('g1').hidden = $('c1').hidden = $('bRand').hidden = !!sec;
  if (sec === 'fly') {
    lab.setGlow('rgba(255, 184, 107, .2)');
    const m = S.hb, st = m === 0 ? t.fly.j : t.fly.f(m);
    $('lFly').textContent = t.fly.bridge; $('vFly').textContent = `${m} m`; if ($('rFly').value !== String(m)) $('rFly').value = m;
    lab.setReadout(`${m} m`, t.fly.bridge, m === 0 ? t.fly.pj : t.fly.pf, COL.B);
    lab.setState({ emo: '🌉', title: st[0], lead: st[1], body: '', extra: '' });
    lab.setFacts(fx([['hyp', '🌀', 'sk']]));
    return;
  }
  if (sec === 'ang') {
    lab.setGlow('rgba(199, 146, 255, .2)');
    const a = angOf(S.pair), done = S.sl >= 99, st = done ? t.ang.s1(a) : t.ang.s0;
    $('bPair').textContent = t.ang.pair;
    $('lAng').textContent = t.ang.slide; $('vAng').textContent = `${S.sl}%`; if ($('rAng').value !== String(S.sl)) $('rAng').value = S.sl;
    lab.setReadout(done ? `${a}°` : '?', t.ang.slide, '', COL.cross);
    lab.setState({ emo: '📐', title: st[0], lead: st[1], body: '', extra: '' });
    lab.setFacts(fx([['hyp', '🌀', 'sk']]));
    return;
  }
  lab.setGlow('rgba(124, 196, 255, .22)');
  const both = S.ea !== null && S.eb !== null, kind = both ? edgeKind(S.ea, S.eb) : null;
  $('bRand').textContent = t.rand;
  $('g1').innerHTML = ['cross', 'par', 'skew'].map((k) => gbtn('g1', k, t.kinds[k], COL[k], S.ev ? (k === kind ? 'ok' : k === S.eg ? 'no' : '') : '', !both || S.ev)).join('');
  const n = (k) => S.ef[k].size, total = n('cross') + n('par') + n('skew');
  $('c1').innerHTML = counts(['cross', 'par', 'skew'].map((k) => [COL[k], t.kinds[k], n(k)]));
  let st, body = '', emo = '📐';
  if (S.ev) {
    const ok = S.eg === kind, E1 = EDGES[S.ea], E2 = EDGES[S.eb], d1 = v3.sub(E1.b, E1.a), d2 = v3.sub(E2.b, E2.a);
    const vert = Math.hypot(d1[0], d1[1]) < 1e-9 || Math.hypot(d2[0], d2[1]) < 1e-9;
    emo = ok ? '✅' : '🤔'; st = [`${ok ? t.right : t.wrong} ${t.kname[kind]}`, e.res[kind]];
    body = kind === 'cross' ? (vert ? e.notes.crossDot : e.notes.crossTop) : kind === 'par' ? (vert ? e.notes.parDot : e.notes.parTop) : (topCross(E1.a, d1, E2.a, d2) ? e.notes.skewTop : e.notes.skewDot);
  } else st = S.ea === null ? e.p0 : S.eb === null ? e.p1 : e.ask;
  lab.setReadout(S.ev ? t.kinds[kind] : '?', t.pairs(total), S.ev ? (S.eg === kind ? t.right : t.wrong) : '', S.ev ? COL[kind] : COL.A);
  lab.setState({ emo, title: st[0], lead: st[1], body, extra: '' });
  const f = [['hyp', '🌀', 'sk']]; if (total > 0 && open) f.push(['dim', '🧭', 'sk']);
  lab.setFacts(fx(f));
}

function renderPlanes(t) {
  const p = t.p;
  lab.setGlow('rgba(255, 184, 107, .2)');
  $('plChips').innerHTML = PLAN_ORDER.map((i) => {
    const col = i === S.pa ? COL.A : i === S.pb ? COL.B : null;
    return `<button class="chip tl-chip ${col ? 'on' : ''}" data-act="pl" data-i="${i}"><span class="sw" style="background:${col || 'transparent'}"></span>${esc(p.names[PLANES[i].k])}</button>`;
  }).join('');
  const both = S.pa !== null && S.pb !== null, kind = both ? planeKind(S.pa, S.pb) : null;
  $('g2').innerHTML = ['par', 'int'].map((k) => gbtn('g2', k, p.b[k], COL[k === 'par' ? 'par' : 'cross'], S.pv ? (k === kind ? 'ok' : k === S.pg ? 'no' : '') : '', !both || S.pv)).join('');
  const n = (k) => S.pf[k].size, total = n('par') + n('int');
  $('c2').innerHTML = counts([[COL.par, p.b.par, n('par')], [COL.cross, p.b.int, n('int')]]);
  let st, body = '', emo = '🧱';
  if (S.pv) {
    const ok = S.pg === kind; emo = ok ? '✅' : '🤔';
    const r = kind === 'par' ? p.resPar : p.resInt;
    st = [`${ok ? t.right : t.wrong} ${r[0]}`, r[1]];
    if (kind === 'int') body = p.where[planeWhere(S.pa, S.pb)];
  } else st = S.pa === null ? p.p0 : S.pb === null ? p.p1 : p.ask;
  lab.setReadout(S.pv ? p.b[kind] : '?', t.pairs(total), S.pv ? (S.pg === kind ? t.right : t.wrong) : '', S.pv ? COL[kind === 'par' ? 'par' : 'cross'] : COL.B);
  lab.setState({ emo, title: st[0], lead: st[1], body, extra: '' });
  lab.setFacts(fx([['eu', '📜', 'eu'], ['dih', '📐', 'pe'], ['rb', '⏳', 'eu']]));
}

function renderPole(t) {
  const q = t.t, a1 = poleAng(S.tilt, S.lean, 1), a2 = poleAng(S.tilt, S.lean, 2), d1 = Math.round(a1.deg), d2 = Math.round(a2.deg);
  lab.setGlow('rgba(255, 138, 76, .2)');
  const rev = S.tv, ok = S.tg === 'no';
  $('g3').hidden = rev;
  $('g3').innerHTML = ['yes', 'no'].map((k) => gbtn('g3', k, q.b[k], COL.A, '', false)).join('');
  $('a3').hidden = !rev; $('bLean').hidden = !rev; $('bAgain').hidden = !rev;
  $('bLean').textContent = q.lean; $('bAgain').textContent = t.again;
  $('lTilt').textContent = q.tilt; $('vTilt').textContent = `${S.tilt}°`; if ($('rTilt').value !== String(S.tilt)) $('rTilt').value = S.tilt;
  let st, emo = '📏';
  if (!rev) { st = q.ask; lab.setReadout(`${d1}°`, q.sub0, '', COL.amber); }
  else {
    const straight = S.tilt === 0;
    if (!S.tmoved) { emo = ok ? '✅' : '🤔'; st = [`${ok ? t.right : t.wrong} ${q.rev[0]}`, q.rev[1](d2)]; }
    else if (straight) { emo = '✅'; st = q.straight; }
    else if (a1.right) { emo = '🤔'; st = q.one(1, 2, d2); }
    else if (a2.right) { emo = '🤔'; st = q.one(2, 1, d1); }
    else { emo = '🤔'; st = q.none; }
    lab.setReadout(`${d1}° · ${d2}°`, q.sub1, straight ? q.perp : '', straight ? COL.ok : COL.amber);
  }
  lab.setState({ emo, title: st[0], lead: st[1], body: '', extra: '' });
  const f = [['ax', '📐', 'pe']]; if (rev) f.push(['def', '📏', 'pe']);
  lab.setFacts(fx(f));
}

render();
canvasLoop(cv, frame);
</script>
