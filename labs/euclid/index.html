    let sx, sy, dx, dy;
    if (cu.dir === 'L') { sx = ox + cu.s * s; sy = oy; dx = 0; dy = 1; } else { sx = ox; sy = oy + cu.s * s; dx = 1; dy = 0; }
    const fade = clamp01(1 - (el - SC) / .25);
    c.save(); c.globalAlpha = fade; c.lineCap = 'round';
    c.strokeStyle = 'rgba(52,48,74,.55)'; c.lineWidth = 1.5; c.setLineDash([4, 4]);
    c.beginPath(); c.moveTo(sx + dx * q * len, sy + dy * q * len); c.lineTo(sx + dx * len, sy + dy * len); c.stroke(); c.setLineDash([]);
    c.strokeStyle = INK; c.lineWidth = 2.4; c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx + dx * q * len, sy + dy * q * len); c.stroke();
    const sc = clamp(len / 70, .6, 1), hx = sx + dx * q * len, hy = sy + dy * q * len;
    scissors(c, hx - dx * 26 * sc, hy - dy * 26 * sc, Math.atan2(dy, dx), .14 + .3 * (.5 + .5 * Math.sin(el * 30)), sc);
    c.restore();
  }
  tag(c, w, String(A), px + pw / 2, py - 12); tag(c, w, String(B), px - 17, py + ph / 2);
}

// --- the tiling scene (view 2) -----------------------------------------------------------------------------
// tiles of side t on an A × B sheet, whole tiles only, from the top left; what is left over is hatched red; a tile that does not fit sticks out
function drawTile(c, w, h, time, A, B, t, tAt, blank) {
  const m = 26, s = Math.max(2, Math.min((w - 2 * m) / A, (h - 26 - 22) / (B + 2.2), 44));
  const px = (w - A * s) / 2, py = (h - (22 + (B + 2.2) * s)) / 2 + 22, pw = A * s, ph = B * s;
  paper(c, w, h);
  slab(c, px, py, pw, ph, SHEET);
  unitGrid(c, px, py, pw, ph, s);
  const nx = Math.floor(A / t), ny = Math.floor(B / t), perfect = A % t === 0 && B % t === 0;
  if (!blank) {
    if (nx > 0 && ny > 0 && !perfect) {
      c.save(); c.beginPath(); c.rect(px, py, pw, ph); c.rect(px, py, nx * t * s, ny * t * s); c.clip('evenodd');
      c.fillStyle = 'rgba(217,84,76,.5)'; c.fillRect(px, py, pw, ph);
      c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 2; c.beginPath();
      for (let d = -ph; d < pw + ph; d += 10) { c.moveTo(px + d, py + ph); c.lineTo(px + d + ph, py); }
      c.stroke(); c.restore();
    }
    const ps = t * s;
    for (let iy = 0; iy < ny; iy++) for (let ix = 0; ix < nx; ix++) {
      const u = clamp01((time - tAt - (ix + iy) * .015) / .28), sc = Math.max(0, easeBack(u)), cx = px + (ix + .5) * ps, cy = py + (iy + .5) * ps, col = (ix + iy) % 2 ? '#f4a6a0' : '#f6c177';
      if (ps < 14) { c.fillStyle = col; c.fillRect(cx - ps / 2 * sc, cy - ps / 2 * sc, ps * sc, ps * sc); c.strokeStyle = 'rgba(52,48,74,.5)'; c.lineWidth = .6; c.strokeRect(cx - ps / 2 * sc, cy - ps / 2 * sc, ps * sc, ps * sc); }
      else sq(c, cx - ps * sc / 2, cy - ps * sc / 2, ps * sc, col, null, {});
    }
    if (nx === 0 || ny === 0) {
      c.save(); c.setLineDash([6, 4]); c.lineWidth = 2; c.strokeStyle = '#d9453c'; c.fillStyle = 'rgba(217,69,60,.2)';
      rr(c, px, py, t * s, t * s, 4); c.fill(); c.stroke(); c.restore();
    }
    if (perfect) {
      c.save(); c.shadowColor = 'rgba(61,220,151,.9)'; c.shadowBlur = 14; c.strokeStyle = '#2fbf80'; c.lineWidth = 3; rr(c, px - 1, py - 1, pw + 2, ph + 2, 4); c.stroke(); c.restore();
    }
  }
  tag(c, w, String(A), px + pw / 2, py - 12); tag(c, w, String(B), px - 17, py + ph / 2);
}

// --- the whole cut at once (view 3) ------------------------------------------------------------------------
function drawAll(c, w, h, time, A, B, o) {
  const m = 26, s = Math.max(1.5, Math.min((w - 2 * m) / A, (h - 26 - 22) / B, 44)), pw = A * s, ph = B * s, px = (w - pw) / 2, py = (h - 22 - ph) / 2 + 22;
  paper(c, w, h);
  slab(c, px, py, pw, ph, SHEET);
  if (o.blank) {
    c.fillStyle = 'rgba(255,255,255,.8)'; c.font = `900 ${Math.round(clamp(ph * .7, 16, 60))}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', px + pw / 2, py + ph / 2 + 2);
  } else {
    const a = clamp01(.35 + (time - o.chAt) / .25);
    c.save(); c.globalAlpha = a;
    for (const q of cutsFor(A, B)) {
      const X0 = px + q.x * s, Y0 = py + q.y * s, sz = q.s * s, col = PAL[q.g % PAL.length];
      if (sz < 9) { c.fillStyle = (q.x + q.y) % 2 ? shade(col, .12) : col; c.fillRect(X0, Y0, sz, sz); c.strokeStyle = 'rgba(52,48,74,.55)'; c.lineWidth = .7; c.strokeRect(X0, Y0, sz, sz); }
      else sq(c, X0, Y0, sz, col, q.s, {});
    }
    c.restore();
    if (o.sec === 'frac') {
      const g = gcd(A, B);
      c.save(); c.strokeStyle = INK; c.lineWidth = 1.6; c.setLineDash([3, 3]); c.beginPath();
      for (let i = g; i < A; i += g) { c.moveTo(px + i * s, py); c.lineTo(px + i * s, py + ph); }
      for (let j = g; j < B; j += g) { c.moveTo(px, py + j * s); c.lineTo(px + pw, py + j * s); }
      c.stroke(); c.restore();
    }
  }
  tag(c, w, String(A), px + pw / 2, py - 12); tag(c, w, String(B), px - 17, py + ph / 2);
}

// --- canvas loop -------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'cut') {
    const [A, B] = RECTS[S.v1.ri];
    drawCut(c, w, h, time, A, B, S.v1.k, S.v1.t0);
  } else if (v === 'tile') {
    const s2 = S.v2, p = s2.phase;
    if (p === 'explore') drawTile(c, w, h, time, EX[0], EX[1], s2.t, s2.tAt, false);
    else if (p === 'predict') drawTile(c, w, h, time, CK[0], CK[1], 1, s2.tAt, true);
    else if (s2.mode === 'cut') drawCut(c, w, h, time, CK[0], CK[1], s2.k, s2.t0);
    else drawTile(c, w, h, time, CK[0], CK[1], s2.t, s2.tAt, false);
  } else {
    const s3 = S.v3;
    drawAll(c, w, h, time, s3.a, s3.b, { blank: s3.pred === null, sec: s3.sec, chAt: s3.chAt });
  }
});

// --- controls ----------------------------------------------------------------------------------------------
function startCut(st) { // one more square: tap during an animation and it just goes on
  const [A, B] = st === S.v1 ? RECTS[S.v1.ri] : CK, n = cutsFor(A, B).length;
  if (st.k >= n) return false;
  st.k++; st.t0 = now(); sfx.snap();
  return st.k === n;
}
function track() { // view 3: record, and the slowest case
  const s3 = S.v3, n = stepsFor(s3.a, s3.b).length;
  s3.best = Math.max(s3.best, n);
  if (n === MAXSTEPS && !s3.found) { s3.found = true; sfx.good(); }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, s1 = S.v1, s2 = S.v2, s3 = S.v3;
  if (act === 'g1') { s1.guess = +b.dataset.g; sfx.click(); }
  else if (act === 'cut1') { if (startCut(s1) && s1.ri === 0 && s1.guess !== null) (s1.guess === cutsFor(...RECTS[0]).at(-1).s ? sfx.good : sfx.bad)(); }
  else if (act === 'again1') { s1.k = 0; s1.t0 = -9; sfx.click(); }
  else if (act === 'rect') { s1.ri = +b.dataset.i; s1.k = 0; s1.t0 = -9; sfx.click(); }
  else if (act === 'g2') { s2.guess = +b.dataset.g; s2.phase = 'check'; s2.mode = 'cut'; s2.k = 0; s2.t0 = -9; sfx.click(); }
  else if (act === 'cut2') { if (startCut(s2)) (s2.guess === cutsFor(...CK).at(-1).s ? sfx.good : sfx.bad)(); }
  else if (act === 'again2') { s2.k = 0; s2.t0 = -9; sfx.click(); }
  else if (act === 'tileWith') { s2.mode = 'tile'; s2.t = cutsFor(...CK).at(-1).s; s2.tAt = now(); sfx.click(); }
  else if (act === 'next2') { s2.phase = 'predict'; s2.t = 1; s2.tAt = now(); s2.guess = null; s2.k = 0; s2.mode = 'tile'; sfx.click(); }
  else if (act === 'tdec' || act === 'tinc') { setTile(clamp(s2.t + (act === 'tinc' ? 1 : -1), 1, +$('tr').max)); sfx.tick(); return; }
  else if (act === 'g3') { s3.pred = b.dataset.g; s3.fresh = true; s3.chAt = now(); (s3.pred === 'no' ? sfx.good : sfx.bad)(); track(); }
  else if (act === 'show3') { [s3.a, s3.b] = SLOW; s3.shown = true; s3.sec = null; s3.fresh = false; s3.chAt = now(); track(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    s3.fresh = false; s3.chAt = now();
    if (b.dataset.k === 'fib') { s3.fi = s3.sec === 'fib' ? (s3.fi + 1) % FIB.length : 0; s3.sec = 'fib'; [s3.a, s3.b] = FIB[s3.fi]; track(); }
    else if (s3.sec === 'frac') s3.sec = null;
    else { s3.sec = 'frac'; [s3.a, s3.b] = FRAC; }
    sfx.click();
  }
  render();
});
function setTile(t) {
  const s2 = S.v2, [A, B] = s2.phase === 'explore' ? EX : CK;
  if (t === s2.t) return;
  s2.t = t; s2.tAt = now();
  if (A % t === 0 && B % t === 0 && s2.phase === 'explore' && !s2.found.includes(t)) { s2.found.push(t); s2.found.sort((x, y) => x - y); sfx.good(); }
  render();
}
$('tr').addEventListener('input', () => setTile(+$('tr').value));
for (const [id, key] of [['sa', 'a'], ['sb', 'b']]) {
  $(id).addEventListener('input', () => {
    const s3 = S.v3; s3[key] = +$(id).value; if (s3.sec === 'fib') s3.sec = null; s3.fresh = false; s3.chAt = now(); track(); render();
  });
}

// --- one render per change: controls, readout and the state card ------------------------------------------
function cutState(t, A, B, k, guess, doneLead) {
  const cuts = cutsFor(A, B), n = cuts.length, v = t.v1;
  if (k === 0) return { emo: '✂️', title: v.start, lead: v.startLead(A, B), body: '' };
  const c = cuts[k - 1];
  if (k < n) return { emo: '✂️', title: v.step(k, c.s), lead: v.left(c.after.w, c.after.h), body: v.rule(c.before.w, c.before.h, c.s) };
  const g = cuts[n - 1].s, sides = v.sides(cuts.map((x) => x.s).join(', '));
  if (guess != null) {
    const ok = guess === g;
    return { emo: ok ? '✅' : '🤔', title: ok ? v.right : v.miss(guess), lead: doneLead ?? v.last(g), body: doneLead ? '' : `${sides} ${v.tryMore}` };
  }
  return { emo: '🏁', title: v.last(g), lead: sides, body: v.tryMore };
}
const optsHTML = (list, act) => list.map(([val, label]) => `<button class="eu-opt" data-act="${act}" data-g="${val}">${esc(label)}</button>`).join('');
const facts = (t, key) => t.f[key].map((text) => ({ emo: '💡', text, src: SRC }));

function render() {
  const t = T[lang], v = lab.view;
  $('sec1').hidden = v !== 'cut'; $('sec2').hidden = v !== 'tile'; $('sec3').hidden = v !== 'rule';
  if (v === 'cut') renderCut(t); else if (v === 'tile') renderTile(t); else renderRule(t);
}

function renderCut(t) {
  const s1 = S.v1, [A, B] = RECTS[s1.ri], cuts = cutsFor(A, B), n = cuts.length, k = s1.k, v = t.v1, pred = s1.guess === null;
  lab.setGlow('rgba(95, 168, 200, .26)');
  $('v1pred').hidden = !pred; $('v1play').hidden = pred;
  if (pred) {
    $('v1q').textContent = v.q; $('v1opts').innerHTML = optsHTML([[1, '1'], [3, '3'], [6, '6']], 'g1');
    lab.setReadout(X(A, B), v.sheet, '', '#6fb8c8');
    lab.setState({ emo: '🤔', title: v.q, lead: v.qlead(A, B), body: '', extra: '' });
    lab.setFacts(facts(t, 'cut'));
    return;
  }
  $('cut1').textContent = v.cut; $('cut1').disabled = k >= n;
  $('again1').textContent = v.again; $('again1').disabled = k === 0;
  $('rectLbl').textContent = v.other;
  $('rectChips').innerHTML = RECTS.map((r, i) => `<button class="chip eu-chip ${i === s1.ri ? 'on' : ''}" data-act="rect" data-i="${i}">${X(r[0], r[1])}</button>`).join('');
  const rem = k === 0 ? { w: A, h: B } : cuts[k - 1].after, g = cuts[n - 1].s;
  const act = k === n ? 'c' : rem.w > rem.h ? 'a' : rem.h > rem.w ? 'b' : 'c', f = v.flow;
  $('flow').innerHTML = `<div class="eu-fh"><b>${esc(f.h)}</b><span>${esc(k === n ? f.now(g, g) : f.now(rem.w, rem.h))}</span></div>`
    + [['a', 'a > b', f.a], ['b', 'b > a', f.b], ['c', 'a = b', f.c]].map(([id, cnd, txt]) => `<div class="eu-fr${id === act ? ' on' : ''}"><code>${cnd}</code><i>→</i><span>${esc(txt)}</span></div>`).join('');
  if (k === n) lab.setReadout(X(g, g), v.lastLbl, v.pill(k), '#6fb8c8');
  else lab.setReadout(X(rem.w, rem.h), v.sub0, k ? v.pill(k) : '', '#6fb8c8');
  lab.setState({ ...cutState(t, A, B, k, s1.ri === 0 ? s1.guess : null), extra: '' });
  lab.setFacts(facts(t, 'cut'));
}

function renderTile(t) {
  const s2 = S.v2, p = s2.phase, v = t.v2, v1 = t.v1;
  lab.setGlow('rgba(246, 193, 119, .26)');
  const cutMode = p === 'check' && s2.mode === 'cut', tileMode = p === 'explore' || (p === 'check' && s2.mode === 'tile');
  $('v2pred').hidden = p !== 'predict'; $('v2tile').hidden = !tileMode; $('v2cut').hidden = !cutMode;
  if (p === 'predict') {
    $('v2q').textContent = v.pq(...CK); $('v2opts').innerHTML = optsHTML([3, 6, 12, 18].map((x) => [x, String(x)]), 'g2');
    lab.setReadout(X(...CK), v1.sheet, '', '#f6c177');
    lab.setState({ emo: '🤔', title: v.pq(...CK), lead: v.plead, body: '', extra: '' });
    lab.setFacts(facts(t, 'tile'));
    return;
  }
  if (cutMode) {
    const [A, B] = CK, cuts = cutsFor(A, B), n = cuts.length, k = s2.k, g = cuts[n - 1].s;
    $('cut2').textContent = v.run; $('cut2').disabled = k >= n;
    $('again2').textContent = v1.again; $('again2').disabled = k === 0;
    $('tileWith').textContent = v.tileWith; $('tileWith').hidden = k < n;
    const rem = k === 0 ? { w: A, h: B } : cuts[k - 1].after;
    if (k === n) lab.setReadout(X(g, g), v1.lastLbl, v1.pill(k), '#f6c177'); else lab.setReadout(X(rem.w, rem.h), v1.sub0, k ? v1.pill(k) : '', '#f6c177');
    lab.setState({ ...cutState(t, A, B, k, s2.guess, v.doneT(g, A, B)), extra: '' });
    lab.setFacts(k === n ? [...facts(t, 'tile'), ...facts(t, 'tileDone')] : facts(t, 'tile'));
    return;
  }
  // tiles
  const [A, B] = p === 'explore' ? EX : CK, tt = s2.t, nx = Math.floor(A / tt), ny = Math.floor(B / tt), tiles = nx * ny, unc = A * B - tiles * tt * tt;
  const perfect = A % tt === 0 && B % tt === 0, tooBig = nx === 0 || ny === 0;
  const tr = $('tr'); tr.max = String(B + 2); if (+tr.value !== tt) tr.value = String(tt);
  $('v2found').hidden = p !== 'explore';
  $('foundTxt').textContent = s2.found.length ? v.found(s2.found.join(', ')) : v.foundNone;
  $('next2').textContent = v.next;
  lab.setReadout(X(tt, tt), v.fit(tiles), perfect ? v.pillOk : tooBig ? v.pillBig : v.pillGap(unc), '#f6c177');
  lab.setState({ emo: perfect ? '✅' : tooBig ? '🚫' : '🧩', title: perfect ? v.ok(tt) : tooBig ? v.big(tt) : v.gap(tt),
    lead: perfect ? v.okLead(nx, ny) : tooBig ? v.bigLead : v.gapLead(unc, A * B), body: p === 'explore' ? `${v.q(A, B)} ${v.lead}` : '', extra: '' });
  lab.setFacts(p === 'check' ? [...facts(t, 'tile'), ...facts(t, 'tileDone')] : facts(t, 'tile'));
}

function renderRule(t) {
  const s3 = S.v3, v = t.v3, a = s3.a, b = s3.b, pred = s3.pred === null;
  lab.setGlow('rgba(196, 167, 231, .26)');
  $('v3pred').hidden = !pred; $('v3play').hidden = pred;
  if (pred) {
    $('v3q').textContent = v.pq; $('v3opts').innerHTML = optsHTML([['yes', v.yes], ['no', v.no]], 'g3');
    lab.setReadout('?', '', '', '#c4a7e7');
    lab.setState({ emo: '🤔', title: v.pq, lead: v.plead, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  if (+$('sa').value !== a) $('sa').value = String(a);
  if (+$('sb').value !== b) $('sb').value = String(b);
  $('oa').textContent = a; $('ob').textContent = b;
  const rows = stepsFor(a, b), steps = rows.length, cuts = cutsFor(a, b), g = rows[rows.length - 1].small, slowest = steps === MAXSTEPS;
  $('tab').innerHTML = `<tr>${v.th.map((x) => `<th>${esc(x)}</th>`).join('')}</tr>` + rows.map((r, i) =>
    `<tr><td>${X(r.big, r.small)}</td><td><i class="eu-sw" style="background:${PAL[i % PAL.length]}"></i>${X(r.small, r.small)}${r.q > 1 ? ` <b>×${r.q}</b>` : ''}</td><td>${r.r ? X(r.r, r.small) : esc(v.none)}</td></tr>`).join('');
  $('stepDef').textContent = v.stepDef;
  $('v3task').textContent = `${v.task} ${v.rec(s3.best)}${s3.best >= 5 && !s3.found && !s3.shown ? ` ${v.hint}` : ''}`;
  $('show3').textContent = v.show; $('show3').hidden = s3.found || s3.shown;
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip eu-chip secret ${open ? 'open' : ''} ${s3.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('fib', '🌀') + sc('frac', '➗');
  lab.setReadout(steps, v.sub(a, b), v.pill(cuts.length), '#c4a7e7');
  let st;
  if (s3.fresh) st = { emo: s3.pred === 'no' ? '✅' : '🤔', title: s3.pred === 'no' ? v.right : v.miss, lead: v.why, body: v.task };
  else if (s3.sec === 'fib') st = { emo: '🌀', title: v.fibT(a, b, steps), lead: v.fibL, body: '' };
  else if (s3.sec === 'frac') {
    st = g === 1 ? { emo: '➗', title: v.fracOne(a, b), lead: v.fracOneL, body: '' }
      : { emo: '➗', title: v.fracT(a, b, a / g, b / g), lead: v.fracL(g), body: '' };
  } else if (slowest && (s3.found || s3.shown)) st = { emo: '🏆', title: v.foundT, lead: v.foundLead(a, b, steps), body: v.foundBody };
  else st = { emo: '🔁', title: v.stT(steps), lead: v.stLead(g), body: v.why };
  lab.setState({ ...st, extra: '' });
  lab.setFacts([...facts(t, 'rule'), ...(s3.found || s3.shown ? facts(t, 'fib') : [])]);
}
render();
