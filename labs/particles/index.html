  const x0 = HT.W / 2 - lw / 2, y0 = HT.H / 2 - (ZR.rows - 1) * dy / 2, pos = [];
  for (let r = 0; r < ZR.rows; r++) for (let c = 0; c < ZR.cols; c++) {
    const i = r * ZR.cols + c, a1 = i * 2.399, a2 = i * 1.713;
    pos.push([x0 + c * d + (r % 2 ? d / 2 : 0) + Math.sin(t * wv + a1) * A, y0 + r * dy + Math.sin(t * wv * 1.13 + a2) * A]);
  }
  ctx.strokeStyle = 'rgba(190,225,255,.35)'; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let r = 0; r < ZR.rows; r++) for (let c = 0; c < ZR.cols; c++) {
    const i = r * ZR.cols + c;
    for (const j of [c < ZR.cols - 1 ? i + 1 : -1, r < ZR.rows - 1 ? i + ZR.cols : -1, r < ZR.rows - 1 ? (r % 2 ? (c < ZR.cols - 1 ? i + ZR.cols + 1 : -1) : (c > 0 ? i + ZR.cols - 1 : -1)) : -1]) {
      if (j < 0) continue;
      ctx.moveTo(pos[i][0], pos[i][1]); ctx.lineTo(pos[j][0], pos[j][1]);
    }
  }
  ctx.stroke();
  for (const p of pos) blit(ctx, o, p[0], p[1]);
  rr(ctx, 0, 0, HT.W, HT.H, 10); ctx.strokeStyle = end ? 'rgba(150,200,255,.9)' : 'rgba(215,232,255,.6)'; ctx.lineWidth = 2.2 / k; ctx.stroke();
  ctx.restore();
  drawThermo(ctx, w - 22, by + 10, bh - 28, K / 293.15, [[0, nf(-273.15, 0) + '°'], [273.15 / 293.15, '0°']], '#59b6ff');
  barPill(ctx, `${tx.zrSpd}: ${K < .5 ? '≈ 0' : nf(100 * s)} %`, bx + bw / 2, by + bh + 24, Math.min(bw, 220), s, '#ff9d57');
  if (end) pill(ctx, tx.zrEnd, bx + bw / 2, by + bh + 64, { size: 13, bg: 'rgba(20,50,120,.92)', stroke: 'rgba(150,200,255,.8)' });
}

// === readout, state card, controls ====================================================================================================
let roKey = '';
function setRO(val, sub, pillTxt, col) {
  const k = [val, sub, pillTxt, col].join('|');
  if (k === roKey) return;
  roKey = k;
  lab.setReadout(val, sub, pillTxt, col);
}
function readout() {
  const tx = T[lang], v = lab.view;
  if (S.sec === 'pf') {
    const p = S.pf;
    return setRO(`${nf(p.t, 1)} s`, tx.timeTo, p.done ? '✓ ' + tx.reached : tx.spreading, '#ff6fb5');
  }
  if (S.sec === 'zr') {
    const tc = S.zr.v / 100, K = Math.max(0, tc + 273.15), end = S.zr.v <= -27315;
    return setRO(`${nf(tc, tc < -250 ? 2 : 0)} °C`, `= ${nf(K, K < 10 ? 2 : 0)} K`, end ? '' : `${tx.zrSpd} ${nf(100 * Math.sqrt(K / 293.15))} %`, '#59b6ff');
  }
  if (v === 'squeeze') {
    if (S.sq.ans === null) return setRO('?', '', '', '#ffb35c');
    const V = 60 - 40 * S.sq.push;
    return setRO(`${nf(V)} ${tx.ml}`, tx.sqSub(nf(60 / V, 1)), tx.sqPill, '#ffb35c');
  }
  if (v === 'heat') {
    if (S.ht.ans === null) return setRO('?', '', '', '#ff8a4a');
    const E = S.ht.E, tc = tempOf(E), si = stIdx(E), sp = Math.sqrt((tc + 273.15) / 233.15);
    const arrow = S.ht.run ? (si === 1 || si === 3 ? ' →' : ' ↑') : '';
    return setRO(`${nf(tc)} °C`, tx.st[si], `${tx.spd} ×${nf(sp, 2)}${arrow}`, '#ff8a4a');
  }
  const ic = S.ic;
  if (ic.ans === null) return setRO('?', '', '', '#6fc4ff');
  if (ic.part === 'glass') return setRO('9/10', tx.under[1], '', '#6fc4ff');
  if (ic.part === 'close') return setRO(`${nf(.92, 2)} ${tx.gcm}`, tx.bI, `${tx.bW} ${nf(1, 2)} ${tx.gcm}`, '#6fc4ff');
  return ic.cold < 50 ? setRO(tx.lkV[0], tx.lkV[1], '', '#6fc4ff') : setRO(tx.lkV[2], tx.lkV[3], '', '#6fc4ff');
}
const verdict = (ok) => `<b style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? T[lang].yes : T[lang].no)}</b>`;

function render() {
  const tx = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  document.body.dataset.v = sec || v;
  $('ptSecRow').innerHTML = [['pf', '🌸', tx.pfT], ['zr', '🥶', tx.zrT]].map(([k, emo, name]) =>
    `<button class="chip pt-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(name)}` : '🔒 ???'}</button>`).join('');
  const ans = sec ? 0 : v === 'squeeze' ? S.sq.ans : v === 'heat' ? S.ht.ans : S.ic.ans, asking = !sec && ans === null;
  $('ptAsk').hidden = !asking;
  $('ptSq').hidden = !(!sec && v === 'squeeze' && !asking);
  $('ptHt').hidden = !(!sec && v === 'heat' && !asking);
  $('ptIc').hidden = !(!sec && v === 'ice' && !asking);
  $('ptPf').hidden = sec !== 'pf';
  $('ptZr').hidden = sec !== 'zr';
  if (asking) {
    const q = v === 'squeeze' ? [tx.sqQ, tx.sqO] : v === 'heat' ? [tx.htQ, tx.htO] : [tx.icQ, tx.icO];
    $('ptQ').textContent = q[0];
    $('ptOpts').innerHTML = q[1].map((o, i) => `<button class="pt-opt" data-act="ans" data-i="${i}">${esc(o)}</button>`).join('');
    lab.setGlow(v === 'ice' ? 'rgba(110,200,255,.22)' : 'rgba(255,150,70,.2)');
    lab.setState({ emo: '🤔', title: tx.gT, lead: tx.gL, body: '', extra: '' });
    lab.setFacts(v === 'ice' ? [] : [{ emo: v === 'squeeze' ? '🔬' : '🥶', text: v === 'squeeze' ? tx.f.brown : tx.f.zero, src: v === 'squeeze' ? SRC.brown : SRC.zero }]);
    return readout();
  }
  if (sec === 'pf') {
    $('pfL').textContent = tx.room; $('pfT').value = S.pf.temp; $('pfE0').textContent = `${nf(-40)} °C`; $('pfE1').textContent = `${nf(140)} °C`; $('pfGo').textContent = tx.spray;
    lab.setGlow('rgba(255,111,181,.2)');
    lab.setState({ emo: '🌸', title: tx.pfT, lead: tx.pfLead, body: tx.pfBody, extra: '' });
    lab.setFacts([{ emo: '🔬', text: tx.f.brown, src: SRC.brown }]);
  } else if (sec === 'zr') {
    const end = S.zr.v <= -27315;
    $('zrL').textContent = tx.zrS; $('zrT').value = S.zr.v; $('zrE0').textContent = tx.zrE0; $('zrE1').textContent = tx.zrE1;
    lab.setGlow('rgba(89,182,255,.22)');
    lab.setState({ emo: '🥶', title: end ? tx.zrEnd.join(' ') : tx.zrT, lead: tx.zrLead, body: end ? tx.zrBody : '', extra: '' });
    lab.setFacts([{ emo: '🥶', text: tx.f.zero, src: SRC.zero }]);
  } else if (v === 'squeeze') {
    $('sqL').textContent = tx.push; $('sqE0').textContent = tx.pushE0; $('sqE1').textContent = tx.pushE1; $('sqPush').setAttribute('aria-label', tx.push);
    lab.setGlow('rgba(255,179,92,.2)');
    lab.setState({ emo: '💉', title: S.sq.ans === OK.squeeze ? tx.yes : tx.no, lead: tx.sqLead, body: tx.sqBody, extra: '' });
    lab.setFacts([{ emo: '🔬', text: tx.f.brown, src: SRC.brown }]);
  } else if (v === 'heat') {
    const hs = S.ht, si = stIdx(hs.E);
    $('htL').textContent = tx.htS; $('htE0').textContent = `${nf(-40)} °C`; $('htE1').textContent = `${nf(140)} °C`;
    $('htT').value = Math.round(tempOf(hs.E)); $('htT').setAttribute('aria-label', tx.htS);
    $('htRun').textContent = hs.run ? tx.pause : hs.E >= E5 - .01 ? tx.again : tx.run;
    lab.setGlow('rgba(255,138,74,.22)');
    lab.setState({ emo: ['🧊', '🧊', '💧', '♨️', '☁️'][si], title: tx.st[si], lead: tx.htLead[si], body: tx.htBody, extra: verdict(hs.ans === OK.heat) });
    lab.setFacts([{ emo: '🥶', text: tx.f.zero, src: SRC.zero }]);
  } else {
    const ic = S.ic;
    $('icParts').innerHTML = ['glass', 'close', 'lake'].map((k) => `<button class="chip pt-chip ${ic.part === k ? 'on' : ''}" data-act="part" data-k="${k}">${esc(tx.parts[k])}</button>`).join('');
    $('icGlassC').hidden = ic.part !== 'glass'; $('icLakeC').hidden = ic.part !== 'lake';
    $('icDrop').textContent = tx.drop; $('icL').textContent = tx.lakeS; $('icE0').textContent = tx.lakeE0; $('icE1').textContent = tx.lakeE1;
    lab.setGlow('rgba(110,200,255,.22)');
    if (ic.part === 'glass') lab.setState({ emo: '🧊', title: ic.ans === OK.ice ? tx.yes : tx.no, lead: tx.glLead, body: tx.glBody, extra: '' });
    else if (ic.part === 'close') lab.setState({ emo: '🔬', title: tx.clT, lead: tx.clLead, body: tx.clBody, extra: '' });
    else { const a = ic.cold < 50 ? tx.lkA : tx.lkW; lab.setState({ emo: ic.cold < 50 ? '🍂' : '❄️', title: a[0], lead: a[1], body: a[2], extra: '' }); }
    lab.setFacts([{ emo: '🧊', text: tx.f.ice, src: SRC.ice }, { emo: '🐟', text: tx.f.lake, src: SRC.lake }]);
  }
  readout();
}

// === events ================================================================================================================
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(i) {
  const v = lab.view;
  if (v === 'squeeze') { S.sq.ans = i; S.sq.target = .75; $('sqPush').value = 75; }
  else if (v === 'heat') { S.ht.ans = i; S.ht.E = 0; S.ht.maxE = 0; S.ht.run = true; }
  else { S.ic.ans = i; S.ic.part = 'glass'; S.ic.drop = 0; }
  (i === OK[v] ? sfx.good : sfx.bad)();
  render(); showStage();
}
function runBtn() {
  const hs = S.ht;
  if (hs.run) hs.run = false;
  else { if (hs.E >= E5 - .01) { hs.E = 0; hs.maxE = 0; } hs.run = true; }
  sfx.click();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'ans') return answer(+b.dataset.i);
  if (a === 'part') { S.ic.part = b.dataset.k; S.ic.drop = 0; sfx.click(); }
  else if (a === 'drop') { S.ic.drop = 0; sfx.click(); }
  else if (a === 'run') runBtn();
  else if (a === 'spray') { pfSpray(); sfx.tick(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k;
    if (S.sec === 'pf') { pfSpray(); }
    if (S.sec === 'zr') S.zr.v = 2000;
    sfx.click();
  }
  render();
});
$('sqPush').addEventListener('input', (ev) => { S.sq.target = +ev.target.value / 100; });
$('htT').addEventListener('input', (ev) => { const hs = S.ht; hs.E = energyOf(+ev.target.value); hs.run = false; hs.maxE = Math.max(hs.maxE, hs.E); render(); });
$('icCold').addEventListener('input', (ev) => { S.ic.cold = +ev.target.value; render(); });
$('pfT').addEventListener('input', (ev) => { S.pf.temp = +ev.target.value; pfSpray(); render(); });
$('zrT').addEventListener('input', (ev) => { S.zr.v = +ev.target.value; render(); });

// === the loop ===============================================================================================================
let lastSt = -1;
canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  CW = w; CH = h;
  try {
    if (S.sec === 'pf') { pfUpdate(dt); drawPf(ctx, w, h, t); }
    else if (S.sec === 'zr') drawZr(ctx, w, h, t);
    else if (lab.view === 'squeeze') { sqUpdate(dt, w, h); drawSqueeze(ctx, w, h, t); }
    else if (lab.view === 'heat') {
      if (!HT.sim) htInit();
      htUpdate(dt); drawHeat(ctx, w, h, t);
      const si = stIdx(S.ht.E);
      if (si !== lastSt) { lastSt = si; render(); }
      if (S.ht.run) $('htT').value = Math.round(tempOf(S.ht.E));
    } else { icUpdate(dt); drawIce(ctx, w, h, t); }
    readout();
  } catch (e) { console.error(e); }
});
render();
</script>
