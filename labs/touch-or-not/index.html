    pill(c, gap > 7 * g.s ? T[lang].f.pillN : T[lang].f.pillT, g.cx + g.R + 10, mid, w, gap > 7 * g.s ? '#9be7c4' : '#ffe27a', 'l');
  }
}

// --- Secret: the falling apple ------------------------------------------------------------------------------
const groundY = (w, h, x) => { const tt = x / w; return h * 0.6 + h * 0.014 * (1 - 4 * tt * (1 - tt)); };
function resetApple() { A.st = 'idle'; A.y = 0; A.vy = 0; A.b = 0; A.sq = 0; A.w = 0; }
function drawAppleShape(c, x, y, r, sq = 0, leaf = true) {
  c.save(); c.translate(x, y); c.scale(1 + sq * 0.14, 1 - sq * 0.14);
  c.fillStyle = lin(c, -r, -r, r, r, [[0, '#ff7d68'], [0.55, '#d8352a'], [1, '#8f1a14']]);
  c.beginPath(); c.moveTo(0, -r * 0.8); c.bezierCurveTo(r * 0.5, -r * 1.12, r * 1.2, -r * 0.5, r * 0.98, r * 0.3); c.bezierCurveTo(r * 0.8, r * 1.0, r * 0.3, r * 1.08, 0, r * 0.92);
  c.bezierCurveTo(-r * 0.3, r * 1.08, -r * 0.8, r * 1.0, -r * 0.98, r * 0.3); c.bezierCurveTo(-r * 1.2, -r * 0.5, -r * 0.5, -r * 1.12, 0, -r * 0.8); c.fill();
  c.strokeStyle = '#6e1410'; c.lineWidth = 1.5; c.stroke();
  c.strokeStyle = '#5b3a1c'; c.lineWidth = 2.4; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, -r * 0.78); c.quadraticCurveTo(r * 0.06, -r * 1.2, r * 0.22, -r * 1.35); c.stroke();
  if (leaf) { c.fillStyle = '#58b04a'; c.beginPath(); c.ellipse(r * 0.45, -r * 1.12, r * 0.34, r * 0.16, -0.4, 0, Math.PI * 2); c.fill(); }
  c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(-r * 0.4, -r * 0.35, r * 0.2, r * 0.32, 0.5, 0, Math.PI * 2); c.fill();
  c.restore();
}
function drawApple(c, w, h, dt, t) {
  const s = Math.min(w / 375, h / 420), r = Math.max(12, 20 * s), ax = w * 0.58, gy = groundY(w, h, ax), y0 = h * 0.3;
  if (A.w !== w) { A.w = w; A.y = y0; }
  if (A.st === 'fall') {
    A.vy += h * 0.9 * dt; A.y += A.vy * dt;
    if (A.y >= gy - r) {
      A.y = gy - r;
      if (A.b < 2 && A.vy > 60) { A.vy = -A.vy * 0.26; A.b++; A.sq = 1; sfx.tick(); } else { A.vy = 0; A.st = 'rest'; A.sq = 1; sfx.click(); render(); }
    }
  }
  A.sq = Math.max(0, A.sq - dt * 4);
  // sky
  c.fillStyle = lin(c, 0, 0, 0, h * 0.62, [[0, '#3f6fb8'], [1, '#bcd9f3']]); c.fillRect(0, 0, w, h);
  const sun = c.createRadialGradient(w * 0.1, 0, 4, w * 0.1, 0, w * 0.7); sun.addColorStop(0, 'rgba(255,245,200,.55)'); sun.addColorStop(1, 'rgba(255,245,200,0)'); c.fillStyle = sun; c.fillRect(0, 0, w, h);
  // tree
  const tx = w * 0.24, ty = h * 0.6;
  c.fillStyle = lin(c, tx - 18 * s, 0, tx + 18 * s, 0, [[0, '#7a5230'], [1, '#4a301a']]);
  c.beginPath(); c.moveTo(tx - 14 * s, ty + 6); c.quadraticCurveTo(tx - 8 * s, ty - h * 0.2, tx - 9 * s, ty - h * 0.3); c.lineTo(tx + 9 * s, ty - h * 0.3); c.quadraticCurveTo(tx + 8 * s, ty - h * 0.2, tx + 14 * s, ty + 6); c.fill();
  c.strokeStyle = '#5a3a1e'; c.lineWidth = 9 * s; c.lineCap = 'round'; c.beginPath(); c.moveTo(tx + 6 * s, ty - h * 0.31); c.quadraticCurveTo(tx + (ax - tx) * 0.5, ty - h * 0.37, ax, y0 - 22 * s); c.stroke();
  [[0, -0.42, 0.14], [-0.09, -0.36, 0.11], [0.1, -0.37, 0.11], [0.03, -0.5, 0.1], [0.14, -0.43, 0.08]].forEach(([dx, dy, rr], i) => {
    const X = tx + dx * h * 1.1, Y = ty + dy * h, Rr = rr * h;
    c.fillStyle = lin(c, X - Rr, Y - Rr, X + Rr, Y + Rr, [[0, i % 2 ? '#79c860' : '#8fd66f'], [1, '#2f7a3c']]); c.beginPath(); c.arc(X, Y, Math.max(0, Rr), 0, Math.PI * 2); c.fill();
  });
  // ground, soil and the pull
  const gl = groundY(w, h, 0), gr = groundY(w, h, w);
  c.fillStyle = lin(c, 0, h * 0.58, 0, h, [[0, '#7c5632'], [1, '#2e1d0f']]); c.beginPath(); c.moveTo(0, gl); c.quadraticCurveTo(w / 2, h * 0.6 - h * 0.014, w, gr); c.lineTo(w, h); c.lineTo(0, h); c.fill();
  c.strokeStyle = lin(c, 0, gl, 0, gl + 14, [[0, '#7ccf5c'], [1, '#3e8f3c']]); c.lineWidth = 9 * s; c.beginPath(); c.moveTo(0, gl + 2); c.quadraticCurveTo(w / 2, h * 0.6 - h * 0.014 + 2, w, gr + 2); c.stroke();
  const showPull = A.st !== 'idle', ay = A.st === 'idle' ? y0 + Math.sin(t * 1.6) * 1.5 : A.y;
  if (showPull) {
    c.save(); c.strokeStyle = '#ffd34d'; c.fillStyle = '#ffd34d'; c.lineWidth = 3; c.setLineDash([9, 7]); c.lineDashOffset = -t * 30; c.beginPath(); c.moveTo(ax, ay + r + 4); c.lineTo(ax, h - 14); c.stroke(); c.setLineDash([]);
    c.beginPath(); c.moveTo(ax, h - 3); c.lineTo(ax - 9, h - 18); c.lineTo(ax + 9, h - 18); c.closePath(); c.fill(); c.restore();
    pill(c, T[lang].a.arrow, ax - 12, h * 0.8, w, '#ffd34d', 'r');
  }
  // the apple, with a stalk while it hangs
  if (A.st === 'idle') { c.strokeStyle = '#5b3a1c'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(ax, y0 - 22 * s); c.lineTo(ax + 1, ay - r * 1.1); c.stroke(); }
  c.save(); c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(ax + 3, gy + 1, r * (A.st === 'rest' ? 1 : 0.4 + 0.6 * clamp((ay - y0) / (gy - r - y0), 0, 1)), r * 0.22, 0, 0, Math.PI * 2); c.fill(); c.restore();
  drawAppleShape(c, ax, ay, r, A.sq);
  // the lens: a close-up of the falling apple
  if (S.zoom && A.st === 'fall') {
    const lr = 46 * s, lxr = ax + lr + 52 * s, lx = lxr + lr + 8 > w ? ax - lr - 52 * s : lxr, ly = clamp(ay, lr + 8, gy - lr - 6);
    c.save(); c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.5; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(ax + (lx > ax ? r : -r), ay); c.lineTo(lx + (lx > ax ? -lr : lr), ly); c.stroke(); c.setLineDash([]);
    c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 10; c.fillStyle = '#d8eaff'; c.beginPath(); c.arc(lx, ly, lr, 0, Math.PI * 2); c.fill(); c.shadowColor = 'transparent';
    c.save(); c.beginPath(); c.arc(lx, ly, lr - 2, 0, Math.PI * 2); c.clip();

    c.strokeStyle = 'rgba(80,120,170,.5)'; c.lineWidth = 2; c.setLineDash([4, 5]); c.beginPath(); c.arc(lx, ly, r * 2.35, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
    drawAppleShape(c, lx, ly, r * 1.7, 0, true); c.restore();
    c.strokeStyle = '#7c8fa8'; c.lineWidth = 4; c.beginPath(); c.arc(lx, ly, lr, 0, Math.PI * 2); c.stroke();
    c.lineCap = 'round'; c.lineWidth = 6; c.beginPath(); c.moveTo(lx + lr * 0.7, ly + lr * 0.7); c.lineTo(lx + lr * 0.95, ly + lr * 0.95); c.stroke(); c.restore();
    pill(c, T[lang].a.lens, lx, ly + lr + 16, w);
  }
}

// --- the loop ------------------------------------------------------------------------------------------------
let lastRead = '';
canvasLoop($('cv'), (c, w, h, dt, t) => {
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (S.sec === 'float') drawFloat(c, w, h, dt, t);
  else if (S.sec === 'apple') drawApple(c, w, h, dt, t);
  else if (lab.view === 'reach') { stepReach(dt, t, w, h); drawReach(c, w, h, t); }
  else if (lab.view === 'through') { stepThrough(dt, w, h); drawThrough(c, w, h, t); }
  else drawRoom(c, w, h, true);
  const key = `${Math.round(R.gap * 10)}|${R.touched}|${Math.round(H.mx)}|${A.st}`;
  if (key !== lastRead) { lastRead = key; readout(); }
});

// --- input ---------------------------------------------------------------------------------------------------
const cv = $('cv');
let drag = null;
cv.addEventListener('pointerdown', (ev) => {
  drag = { x: ev.clientX };
  try { cv.setPointerCapture(ev.pointerId); } catch { /* no capture */ }
  if (S.sec === 'float') {
    const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
    let best = -1, bd = 1e9;
    F.hit.forEach((q, i) => { const d = Math.abs(py - q.y); if (Math.abs(px - q.x) < q.r * 1.15 && d < 26 && d < bd) { bd = d; best = i; } });
    if (best >= 0) flipRing(best);
  }
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const dx = ev.clientX - drag.x; drag.x = ev.clientX;
  if (S.sec) return;
  if (lab.view === 'reach' && S.rg !== null) R.ptx = clamp(R.ptx + dx, R.lo, R.hi);
  else if (lab.view === 'through' && S.mg !== null) H.mx = clamp(H.mx + dx, H.lo, H.hi);
});
['pointerup', 'pointercancel'].forEach((e) => cv.addEventListener(e, () => { drag = null; }));

// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function openSecret(k) {
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === k ? null : k;
  if (S.sec === 'float') resetFloat(); else if (S.sec === 'apple') resetApple();
  sfx.click(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'sec') return openSecret(b.dataset.k);
  if (a === 'pu') { S.pu = v; resetReach(); sfx.click(); }
  else if (a === 'tg') { S.tg = v; resetReach(); sfx.click(); }
  else if (a === 'mat') { S.mat = v; S.mg = null; S.md = null; H.w = 0; sfx.click(); }
  else if (a === 'check') checkSort();
  else if (a === 'flip') { flipRing(2); return; }
  else if (a === 'drop') { if (A.st === 'idle') { A.st = 'fall'; A.vy = 0; A.b = 0; sfx.click(); } else { resetApple(); sfx.click(); } }
  else if (a === 'zoom') { S.zoom = !S.zoom; sfx.click(); }
  render();
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const th = lab.view === 'through';
  if (b.dataset.a) { if (th) S.mg = b.dataset.a; else S.rg = b.dataset.a; sfx.click(); }
  else if (th) { S.mg = null; S.md = null; H.w = 0; sfx.click(); }
  else { resetReach(); sfx.click(); }
  render();
});
sortEl.addEventListener('click', (ev) => {
  const cd = ev.target.closest('[data-c]');
  if (cd) { const id = cd.dataset.c; S.sel = S.sel === id && !S.checked ? null : id; sfx.tick(); return render(); }
  const bk = ev.target.closest('[data-b]');
  if (bk && S.sel && !S.checked) {
    if (S.placed[S.sel] === bk.dataset.b) delete S.placed[S.sel]; else S.placed[S.sel] = bk.dataset.b;
    S.sel = null; sfx.click(); render();
  }
});
function checkSort() {
  if (S.checked) { S.placed = {}; S.was = {}; S.sel = null; S.checked = false; sfx.click(); return; }
  if (Object.keys(S.placed).length < 8) return;
  CARDS.forEach((c) => { S.was[c.id] = S.placed[c.id] === c.box; });
  const k = CARDS.filter((c) => S.was[c.id]).length;
  CARDS.forEach((c) => { S.placed[c.id] = c.box; });
  S.checked = true; S.sel = null; (k === 8 ? sfx.good : sfx.bad)(); showStage();
}

// --- readouts, controls, state card: one render per change ---------------------------------------------------------
function floatCount() { return [1, 2].filter((i) => repel(i)).length; }
function readout() {
  const t = T[lang], v = lab.view;
  if (S.sec === 'float') return lab.setReadout(`${floatCount()}/2`, t.f.sub, floatCount() === 2 ? t.f.pillN : floatCount() === 0 ? t.f.pillT : '', '#e5483d');
  if (S.sec === 'apple') return lab.setReadout('🍎', t.a['sub' + (A.st === 'idle' ? 0 : A.st === 'fall' ? 1 : 2)], '', '#d8352a');
  if (v === 'reach') {
    const touching = R.gap < 0.05;
    return lab.setReadout(`${num(R.gap)} ${t.cm}`, t.r.gap, touching ? t.r.pillT : t.r.pillN, '#4ea8ff');
  }
  if (v === 'through') {
    const m = MAT[S.mat];
    return lab.setReadout(thick(m), t.m.sub, S.mg !== null ? t.m[m.str] : '', '#e0b050');
  }
  const n = Object.keys(S.placed).length;
  return lab.setReadout(`${n}/8`, t.s.sub, '', '#e0b050');
}
function chipsHTML(map, cur, act) { return Object.entries(map).map(([k, l]) => `<button class="chip tn-chip ${k === cur ? 'on' : ''}" data-act="${act}" data-v="${k}">${esc(l)}</button>`).join(''); }

function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  $('tnReach').style.display = !sec && v === 'reach' ? '' : 'none';
  $('tnThrough').style.display = !sec && v === 'through' ? '' : 'none';
  $('tnSort').style.display = !sec && v === 'sort' ? '' : 'none';
  $('tnFloat').style.display = sec === 'float' ? '' : 'none';
  $('tnApple').style.display = sec === 'apple' ? '' : 'none';
  askEl.style.display = !sec && v !== 'sort' ? '' : 'none';
  sortEl.style.display = !sec && v === 'sort' ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret tn-chip ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('tnSecRow').innerHTML = sc('float', '🧲') + sc('apple', '🍎');
  if (sec === 'float') renderFloat(t); else if (sec === 'apple') renderApple(t);
  else if (v === 'reach') renderReach(t); else if (v === 'through') renderThrough(t); else renderSort(t);
  readout();
}
function verdictBox(ok, lead, body, extra) {
  return `<div class="v" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? T[lang].okV : T[lang].noV)}</div><p>${esc(lead)}</p>${extra ?? ''}<div class="o tn-again"><button data-again="1">${esc(T[lang].again)}</button></div>`;
}
function renderReach(t) {
  lab.setGlow('rgba(78, 168, 255, .28)');
  $('tnL1').textContent = t.lPu; $('tnL2').textContent = t.lTg;
  $('tnPu').innerHTML = chipsHTML(t.pusher, S.pu, 'pu'); $('tnTg').innerHTML = chipsHTML(t.target, S.tg, 'tg');
  const g = S.rg === 'y' ? t.yes : t.no, r = t.r;
  if (S.rg === null) {
    askEl.innerHTML = `<div class="q">${esc(r.q)}</div><div class="o"><button data-a="y">${esc(t.yes)}</button><button data-a="n">${esc(t.no)}</button></div>`;
    lab.setState({ emo: '🤔', title: r.pickT, lead: r.pickL, body: '', extra: '' });
  } else if (!S.rd) {
    askEl.innerHTML = `<p>${esc(r.guessed(g))}</p>`;
    lab.setState({ emo: '👋', title: r.waitT, lead: r.waitL, body: '', extra: '' });
  } else {
    const leap = S.rd === 'leap', ok = (S.rg === 'y') === leap;
    const lead = leap ? r.leapL : r.touchL, body = leap ? r.leapB : S.pu === 'magnet' && S.tg === 'ball' ? r.touchM : r.touchB;
    askEl.innerHTML = verdictBox(ok, lead, body);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.okV : t.noV, lead, body, extra: '' });
  }
  lab.setFacts([t.facts[0]]);
}
function renderThrough(t) {
  lab.setGlow('rgba(224, 176, 80, .26)');
  $('tnL3').textContent = t.lMat; $('tnMat').innerHTML = chipsHTML(t.mats, S.mat, 'mat');
  const m = t.m, mt = MAT[S.mat], g = S.mg === 'y' ? t.yes : t.no;
  if (S.mg === null) {
    askEl.innerHTML = `<div class="q">${esc(m.q)}</div><div class="o"><button data-a="y">${esc(t.yes)}</button><button data-a="n">${esc(t.no)}</button></div>`;
    lab.setState({ emo: '🤔', title: m.pickT, lead: m.pickL, body: '', extra: '' });
  } else if (!S.md) {
    askEl.innerHTML = `<p>${esc(m.guessed(g))}</p>`;
    lab.setState({ emo: '🧲', title: m.waitT, lead: m.waitL, body: '', extra: '' });
  } else {
    const follow = S.md === 'follow', ok = (S.mg === 'y') === follow, lead = follow ? m.followL : m.stayL;
    const body = mt.str === 'strong' ? m.strongB : mt.str === 'weak' ? m.weakB : m.farB;
    askEl.innerHTML = verdictBox(ok, lead, body);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.okV : t.noV, lead, body, extra: '' });
  }
  lab.setFacts([t.facts[2]]);
}
function renderSort(t) {
  lab.setGlow('rgba(224, 176, 80, .26)');
  const s = t.s, n = Object.keys(S.placed).length, cardH = (c, mini) => {
    const cls = mini ? `tn-mini ${S.sel === c.id ? 'sel' : ''} ${S.checked ? (S.was[c.id] ? 'ok' : 'no') : ''}` : `tn-card ${S.sel === c.id ? 'sel' : ''}`;
    return mini ? `<button class="${cls}" data-c="${c.id}" aria-label="${esc(t.cards[c.id][0])}">${c.art[0] === 'swing' ? SWING : c.art[0]}</button>`
      : `<button class="${cls}" data-c="${c.id}"><span class="tn-art">${artHTML(c)}</span><span class="tn-cap">${esc(t.cards[c.id][0])}</span></button>`;
  };
  const inB = (b) => CARDS.filter((c) => S.placed[c.id] === b).map((c) => cardH(c, true)).join('');
  const sel = CARDS.find((c) => c.id === S.sel);
  const hint = S.checked ? (sel ? `${t.cards[sel.id][0]}: ${t.cards[sel.id][1]}` : s.afterH) : s.hint;
  sortEl.innerHTML = `<div class="tn-hint">${esc(hint)}</div>
    <div class="tn-tray">${CARDS.filter((c) => !S.placed[c.id]).map((c) => cardH(c, false)).join('')}</div>
    <div class="tn-baskets"><div class="tn-bk" data-b="T"><span class="tn-bkh">${esc(s.bT)}</span><div class="tn-mini-row">${inB('T')}</div></div>
    <div class="tn-bk" data-b="N"><span class="tn-bkh">${esc(s.bN)}</span><div class="tn-mini-row">${inB('N')}</div></div></div>`;
  $('tnCheck').textContent = S.checked ? s.again : s.check; $('tnCheck').disabled = !S.checked && n < 8;
  if (S.checked) {
    const k = CARDS.filter((c) => S.was[c.id]).length;
    lab.setState({ emo: k === 8 ? '✅' : '🧺', title: k === 8 ? t.okV : s.score(k), lead: s.afterL, body: '', extra: '' });
    lab.setFacts(t.facts);
  } else {
    lab.setState(n === 8 ? { emo: '🧺', title: s.readyT, lead: s.readyL, body: '', extra: '' } : { emo: '🤔', title: s.preT, lead: s.preL, body: '', extra: '' });
    lab.setFacts([]);
  }
}
function renderFloat(t) {
  lab.setGlow('rgba(229, 72, 61, .26)');
  $('tnFlip').textContent = t.f.flip;
  const all = floatCount() === 2;
  lab.setState({ emo: all ? '🧲' : '💥', title: all ? t.f.floatT : t.f.snapT, lead: all ? t.f.floatL : t.f.snapL, body: '', extra: '' });
  lab.setFacts([t.facts[1]]);
}
function renderApple(t) {
  lab.setGlow('rgba(216, 53, 42, .24)');
  $('tnDrop').textContent = A.st === 'idle' ? t.a.drop : t.again; $('tnZoom').textContent = t.a.zoom; $('tnZoom').classList.toggle('on', S.zoom);
  const a = t.a, st = A.st;
  lab.setState(st === 'idle' ? { emo: '🍎', title: a.idleT, lead: a.idleL, body: '', extra: '' }
    : st === 'fall' ? { emo: '🔍', title: a.fallT, lead: a.fallL, body: '', extra: '' } : { emo: '🌍', title: a.doneT, lead: a.doneL, body: '', extra: '' });
  lab.setFacts([t.facts[2]]);
}
render();
</script>
