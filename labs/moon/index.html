function render() {
  if (lab.view !== 'day') S.chk = null; // leaving the view ends the check
  const t = T[lang], E = elong(S.day), k = litFrac(E), idx = phaseIdx(E), ec = ecl(E), north = S.hemi === 'n';
  $('slider').value = String(S.day); $('slider').setAttribute('aria-label', t.slider);
  $('ends').innerHTML = t.ends.map((s) => `<span>${esc(s)}</span>`).join('');
  // chips: the two secret eclipses at the ends, the eight phases in between
  const open = secret.unlocked();
  const sChip = (key) => `<button class="chip secret ${open ? 'open' : ''} ${S.eclipse === key ? 'on' : ''}" data-k="${key}">${open ? `${key === 'lunar' ? '🔴' : '🕶️'} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  const phaseChips = EMO.map((_, i) => {
    const d = i * P / 8, on = Math.abs(S.day - d) < 0.12 || (i === 0 && S.day > P - 0.12);
    const em = EMO[north ? i : (8 - i) % 8];
    return `<button class="chip ${on ? 'on' : ''}" data-k="p${i}" data-d="${d}" title="${esc(t.phases[i])}" aria-label="${esc(t.phases[i])}">${em}${on ? ` <span class="nm">${esc(t.phases[i])}</span>` : ''}</button>`;
  });

  $('tonight').textContent = t.tonight; $('tonight').title = t.tonightTip; $('tonight').classList.toggle('on', S.tonight);
  $('play').textContent = S.playing ? t.pause : t.play;
  cv.style.cursor = lab.view === 'space' ? 'grab' : lab.view === 'month' ? 'pointer' : lab.view === 'day' && S.chk ? 'default' : 'ew-resize';

  $('check').textContent = chk ? t.day.stop : t.day.check; $('check').classList.toggle('on', !!chk);
  for (const el of [$('slider'), $('hour'), $('play'), $('tonight'), ...$('chips').querySelectorAll('button')]) el.disabled = !!chk;

  // readout, gauge and glow

  const col = `rgb(${Math.round(lerp(70, 168, k))},${Math.round(lerp(82, 122, k))},${Math.round(lerp(160, 22, k))})`;
  lab.setReadout(`${esc(nf(S.day, 1))} <small>${esc(daysTxt(S.day).replace(nf(S.day, 1), '').trim())}</small>`, t.ageSub(nf(P, 1)), pill, col);
  lab.setGlow(`rgba(${Math.round(lerp(50, 210, k))},${Math.round(lerp(70, 190, k))},${Math.round(lerp(150, 120, k))},${(0.16 + 0.18 * k).toFixed(2)})`);

  const next = S.day < P / 2 ? t.nextFull(daysTxt(P / 2 - S.day)) : t.nextNew(daysTxt(P - S.day));
  const stats = `<div class="stats">

  } else {

      ? `<div class="q">${esc(t.ask)}</div><div class="opts">${['shadow', 'half', 'clouds'].map((a) => `<button data-a="${a}">${esc(t.answers[a])}</button>`).join('')}</div>`
      : `<div class="verdict" style="color:${S.answer === 'half' ? 'var(--ok)' : 'var(--wip)'}">${esc(S.answer === 'half' ? t.yesV : t.noV[S.answer])}</div>
         <p>${esc(S.answer === 'half' ? t.yesT : t.noT[S.answer])}</p><div class="opts"><button>${esc(t.go)} →</button></div>`;

// the "Moon by day" readout, state card and the check's overlay
function renderDay(t, col) {
  const D = t.day, di = dayInfo(), c = S.chk, time = fmtTime(S.hour), phase = t.phases[phaseIdx(di.E)];
  const [title, lead] = D.text[di.status], fine = `<div class="fine">${esc(D.fine)}</div>`;
  const dots = c ? [0, 1, 2, 3].map((i) => c.res[i] === true ? '✓' : c.res[i] === false ? '✗' : !c.done && i === c.i ? '●' : '○').join(' ') : '';
  const btn = (k, s) => `<button data-ck="${k}">${esc(s)}</button>`;
  let over = '', cur = false;
  if (!c) {
    lab.setReadout(esc(time), `${daysTxt(S.day)} · ${phase}`, D.pill[di.status], col);
    lab.setState({ emo: { day: '☀️', night: '🌙', below: '🌍', glare: '🙈' }[di.status], title, lead, body: D.body, extra: fine });
  } else if (c.done) {
    const k = c.res.filter(Boolean).length;
    lab.setReadout(esc(time), dots, '', col);
    lab.setState({ emo: '🎯', title: D.end(k), lead: D.endLead, body: '', extra: fine });
    over = `<div class="verdict">${esc(D.end(k))}</div><div class="opts">${btn('again', D.again)}</div>`;
  } else if (c.a === null) {
    cur = true;
    lab.setReadout(esc(time), dots, '?', col);
    lab.setState({ emo: '🤔', title: D.qTitle, lead: c.hint ? D.hintLead : D.task(c.i + 1, time, phase), body: '', extra: fine });
    over = `<div class="q">?</div><div class="opts">${btn('yes', D.yes)}${btn('no', D.no)}${c.hint ? '' : btn('hint', D.hint)}</div>`;
  } else {
    const ok = c.res[c.i], verdict = ok ? D.right : D.wrong;
    lab.setReadout(esc(time), dots, D.pill[di.status], col);
    lab.setState({ emo: ok ? '🎉' : '🤔', title: verdict, lead: `${title} ${lead}`, body: D.body, extra: fine });
    over = `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(verdict)}</div><div class="opts">${btn('next', D.next)}</div>`;
  }
  dayEl.className = `dayask${cur ? ' cur' : ''}`;
  dayEl.style.display = c ? 'flex' : 'none';
  dayEl.innerHTML = over;
}

// --- drawing ------------------------------------------------------------------------------------------------
// From space: looking down on the North Pole. Sunlight comes from the right; the Moon goes round anticlockwise.
function drawSpace(c, w, h, time) {
  const t = T[lang], E = elong(S.day), e = E * D2R, ec = ecl(E), north = S.hemi === 'n';
  const narrow = w < h * 1.25;
  const ri = clamp(Math.min(w, h) * (narrow ? 0.13 : 0.15), 30, 84);
  const R = Math.min(h * 0.37, w * 0.33);
  const cx = Math.min(w / 2 + ri * 0.5, w - R * 1.12 - 6), cy = h * 0.53;
  const Re = R * RE, Rm = R * RM, fs = clamp(w * 0.026, 10, 12.5);
  lay.space = { cx, cy };
  // the Sun, far away to the right
  const sg = c.createRadialGradient(w + 30, cy, 10, w + 30, cy, Math.min(w, h) * 0.45);
  sg.addColorStop(0, 'rgba(255,214,90,.55)'); sg.addColorStop(1, 'rgba(255,170,50,0)');
  c.fillStyle = sg; c.fillRect(0, 0, w, h);
  // parallel rays of sunlight; the ones that hit the Earth stop there
  c.strokeStyle = 'rgba(255,207,74,.22)'; c.lineWidth = 1.5; c.setLineDash([6, 9]); c.lineDashOffset = time * 30;
  for (let i = 0; i < 9; i++) {
    const y = h * (i + 0.5) / 9, dy = y - cy;
    const end = Math.abs(dy) < Re ? cx + Math.sqrt(Re * Re - dy * dy) : 0;
    c.beginPath(); c.moveTo(w, y); c.lineTo(end, y); c.stroke();
  }
  c.setLineDash([]);
  label(c, `← ${t.sunlight}`, w - 60, 18, w, 'rgba(255,214,120,.9)', `800 ${fs}px Nunito, sans-serif`);
  // the Earth's shadow: a band pointing away from the Sun
  const shg = c.createLinearGradient(cx, 0, 0, 0);
  shg.addColorStop(0, 'rgba(0,0,0,.55)'); shg.addColorStop(1, 'rgba(0,0,0,.18)');
  c.fillStyle = shg; c.fillRect(0, cy - Re, cx, 2 * Re);
  c.textBaseline = 'middle';
  label(c, t.shadow, cx - Re - (R - Re) * 0.5, cy, w, 'rgba(152,160,184,.85)', `800 ${fs - 1}px Nunito, sans-serif`);
  // the orbit, with a faint dot at each of the 8 phases
  c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1.5; c.setLineDash([4, 6]);
  c.beginPath(); c.arc(cx, cy, R, 0, 7); c.stroke(); c.setLineDash([]);
  c.fillStyle = 'rgba(130,145,190,.45)';
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; c.beginPath(); c.arc(cx + R * Math.cos(a), cy - R * Math.sin(a), 2.2, 0, 7); c.fill(); }
  // the Earth: day side toward the Sun
  const eg = c.createLinearGradient(cx - Re, 0, cx + Re, 0);
  eg.addColorStop(0, '#111a30'); eg.addColorStop(0.46, '#111a30'); eg.addColorStop(0.54, '#3f86e6'); eg.addColorStop(1, '#6aaaf2');
  c.fillStyle = eg; c.beginPath(); c.arc(cx, cy, Re, 0, 7); c.fill();
  c.strokeStyle = 'rgba(200,215,245,.35)'; c.lineWidth = 1; c.stroke();
  // the Moon
  const mx = cx + R * Math.cos(e), my = cy - R * Math.sin(e);
  // you, on the side of the Earth that faces the Moon, and your line of sight
  const yx = cx + Re * Math.cos(e), yy = cy - Re * Math.sin(e);
  c.strokeStyle = 'rgba(237,239,247,.4)'; c.setLineDash([2, 5]); c.lineWidth = 1.2;
  c.beginPath(); c.moveTo(yx, yy); c.lineTo(mx - Rm * Math.cos(e), my + Rm * Math.sin(e)); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#ff3b30'; c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.beginPath(); c.arc(yx, yy, 3.5, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#EDEFF7'; c.font = `800 ${fs - 1}px Nunito, sans-serif`; c.textAlign = 'center';
  c.fillText(t.you, yx - 15 * Math.sin(e), yy - 15 * Math.cos(e));
  // solar eclipse: the Moon's small shadow reaches the Earth
  if (ec?.kind === 'solar') {
    const dy = my - cy, hx = cx + Math.sqrt(Math.max(0, Re * Re - dy * dy));
    c.fillStyle = 'rgba(0,0,0,.6)'; c.beginPath(); c.moveTo(mx, my - Rm); c.lineTo(mx, my + Rm); c.lineTo(hx, my); c.closePath(); c.fill();
    c.fillStyle = '#000'; c.beginPath(); c.arc(hx, my, 3, 0, 7); c.fill();
  }
  // the Moon: its right half (toward the Sun) is always lit
  const mg = c.createLinearGradient(mx - Rm, 0, mx + Rm, 0);
  mg.addColorStop(0, '#2a2f3e'); mg.addColorStop(0.47, '#2a2f3e'); mg.addColorStop(0.53, '#ece8dc'); mg.addColorStop(1, '#fffbea');
  c.fillStyle = mg; c.beginPath(); c.arc(mx, my, Rm, 0, 7); c.fill();
  if (ec?.kind === 'lunar') { // the part inside the Earth's shadow turns coppery
    c.save(); c.beginPath(); c.arc(mx, my, Rm, 0, 7); c.clip();
    c.fillStyle = 'rgba(120,42,22,.85)'; c.fillRect(0, cy - Re, cx, 2 * Re); c.restore();
  }
  // the lit half (yellow) and the half that faces the Earth (blue): what we see is where they overlap
  c.lineWidth = 2.5; c.strokeStyle = 'rgba(255,207,74,.95)';
  c.beginPath(); c.arc(mx, my, Rm + 3, -Math.PI / 2, Math.PI / 2); c.stroke();
  const toE = Math.atan2(cy - my, cx - mx);
  c.strokeStyle = 'rgba(94,200,255,.95)'; c.setLineDash([4, 3]);
  c.beginPath(); c.arc(mx, my, Rm + 7, toE - Math.PI / 2, toE + Math.PI / 2); c.stroke(); c.setLineDash([]);
  // notes near the Moon when it crosses the Sun–Earth line without an eclipse
  const s = Math.sin(e), cE = Math.cos(e);
  if (!ec && Math.abs(s) < LUN_C && cE < 0) label(c, t.miss, mx, my - Rm - 16, w, 'rgba(245,200,76,.95)', `800 ${fs - 1}px Nunito, sans-serif`);
  if (!ec && Math.abs(s) < SOL_C && cE > 0) label(c, t.missSun, mx - 10, my - Rm - 16, w, 'rgba(245,200,76,.95)', `800 ${fs - 1}px Nunito, sans-serif`);
  if (!S.dragged) label(c, `↻ ${t.drag}`, mx, my + Rm + 20, w, `rgba(255,255,255,${0.55 + 0.35 * Math.sin(time * 3)})`, `900 ${fs}px Nunito, sans-serif`);
  // the inset: what you see from the Earth right now
  const ix = 12 + ri, iy = 30 + ri;
  c.fillStyle = '#060912'; c.strokeStyle = 'rgba(130,145,190,.45)'; c.lineWidth = 1.5;
  c.beginPath(); c.arc(ix, iy, ri, 0, 7); c.fill(); c.stroke();
  c.textAlign = 'left'; c.fillStyle = 'rgba(94,200,255,.95)'; c.font = `900 ${fs}px Nunito, sans-serif`; c.fillText(`👀 ${t.fromEarth}`, 12, 14);
  if (ec?.kind === 'solar') {
    c.save(); c.beginPath(); c.arc(ix, iy, ri - 1, 0, 7); c.clip();
    drawSolar(c, ix, iy, ri * 0.42, ec.sep, north ? 1 : -1, time); c.restore();
  } else {
    const dx = (E <= 180 ? 1 : -1) * (north ? 1 : -1);
    const sh = ec?.kind === 'lunar' ? { ox: -dx * Math.abs(s) / RM, oy: 0, rs: RE / RM } : null;
    drawMoon(c, ix, iy, ri * 0.74, E, dx, 0, !north, sh);
  }
  label(c, ec ? (ec.kind === 'lunar' && ec.total ? t.eclTotal : t.secrets[ec.kind][0]) : t.phases[phaseIdx(E)], ix, iy + ri + 14, w, '#fff', `900 ${fs + 0.5}px Nunito, sans-serif`);
  // legend
  c.textAlign = 'left'; c.font = `800 ${fs - 1}px Nunito, sans-serif`;
  const ly = h - 30;
  c.lineWidth = 2.5; c.strokeStyle = 'rgba(255,207,74,.95)'; c.beginPath(); c.arc(20, ly, 7, -Math.PI / 2, Math.PI / 2); c.stroke();
  c.fillStyle = 'rgba(237,239,247,.85)'; c.fillText(t.litHalf, 34, ly);
  c.strokeStyle = 'rgba(94,200,255,.95)'; c.setLineDash([4, 3]); c.beginPath(); c.arc(20, ly + 18, 7, Math.PI / 2, Math.PI * 1.5); c.stroke(); c.setLineDash([]);
  c.fillText(t.ourHalf, 34, ly + 18);
  c.textBaseline = 'alphabetic';
}

// In the sky: at sunset (waxing) or sunrise (waning), looking toward the equator. Toy model: the Moon's path goes over the top.
const STARS = Array.from({ length: 46 }, (_, i) => [((i * 0.6180339887) % 1), ((i * 0.7548776662 + 0.13) % 1) * 0.7, 0.4 + ((i * 37) % 10) / 16]);
function drawSky(c, w, h, time) {
  const t = T[lang], E = elong(S.day), ec = ecl(E), north = S.hemi === 'n', mW = north ? 1 : -1; // mW: the side where west is
  const pad = 8, top = 8, W = w - 2 * pad, hy = h * 0.8, cx = w / 2;
  const Ax = W / 2 * 0.84, Ay = (hy - top) * 0.8, fs = clamp(w * 0.026, 10, 12.5);
  lay.sky = { w };
  c.save(); c.beginPath(); c.roundRect ? c.roundRect(pad, top, W, h - top - 6, 16) : c.rect(pad, top, W, h - top - 6); c.clip();
  let caption;
  if (ec?.kind === 'solar') {
    // midday: the Moon slides over the Sun and the sky darkens
    const D = Math.abs(ec.sep), cover = D >= 2 ? 0 : (2 * Math.acos(D / 2) - (D / 2) * Math.sqrt(4 - D * D)) / Math.PI;
    const dim = 1 - 0.9 * cover ** 3;
    const sky = c.createLinearGradient(0, top, 0, hy);
    sky.addColorStop(0, `rgb(${40 * dim + 6},${110 * dim + 8},${200 * dim + 22})`); sky.addColorStop(1, `rgb(${150 * dim + 20},${190 * dim + 20},${235 * dim + 40})`);
    c.fillStyle = sky; c.fillRect(pad, top, W, hy - top);
    if (cover > 0.97) for (const [sx, sy, a] of STARS.slice(0, 8)) { c.fillStyle = `rgba(255,255,255,${a * 0.6})`; c.fillRect(pad + sx * W, top + sy * (hy - top), 1.6, 1.6); }
    drawSolar(c, cx, hy - Ay * 0.75, clamp(Math.min(w, h) * 0.07, 18, 40), ec.sep, mW, time);
    caption = t.midday;
  } else {
    const evening = E <= 180, phi = evening ? E : 360 - E, m = evening ? mW : -mW; // m: the side the Sun is on
    const sunX = cx + m * Ax;
    const sky = c.createLinearGradient(0, top, 0, hy);
    sky.addColorStop(0, '#0a1029'); sky.addColorStop(0.6, '#1b2552'); sky.addColorStop(1, '#4a3c6e');
    c.fillStyle = sky; c.fillRect(pad, top, W, hy - top);
    const glow = c.createRadialGradient(sunX, hy, 4, sunX, hy, W * 0.55);
    glow.addColorStop(0, 'rgba(255,150,70,.6)'); glow.addColorStop(1, 'rgba(255,120,60,0)');
    c.fillStyle = glow; c.fillRect(pad, top, W, hy - top);
    for (const [sx, sy, a] of STARS) {
      const x = pad + sx * W, y = top + sy * (hy - top);
      if (Math.hypot(x - sunX, y - hy) < W * 0.35) continue;
      c.fillStyle = `rgba(255,255,255,${a * 0.5})`; c.fillRect(x, y, 1.5, 1.5);
    }
    // the Moon's path across the sky, from the Sun to the other horizon
    c.strokeStyle = 'rgba(237,239,247,.22)'; c.lineWidth = 1.5; c.setLineDash([4, 7]);
    c.beginPath(); c.ellipse(cx, hy, Ax, Ay, 0, Math.PI, 2 * Math.PI); c.stroke(); c.setLineDash([]);
    sunDisc(c, sunX, hy + 4, clamp(Math.min(w, h) * 0.045, 10, 22), time);
    const mr = clamp(Math.min(w, h) * 0.075, 16, 44), p = phi * D2R;
    const mx = cx + m * Ax * Math.cos(p), my = Math.min(hy - Ay * Math.sin(p), hy - mr - 4); // keep a rising/setting Moon whole
    if (phi < 12) {
      c.strokeStyle = 'rgba(237,239,247,.3)'; c.setLineDash([3, 4]); c.lineWidth = 1;
      c.beginPath(); c.arc(mx, my, mr, 0, 7); c.stroke(); c.setLineDash([]);
      c.textBaseline = 'middle';
      label(c, t.glare, mx - m * mr * 4, my - mr * 2.2, w, 'rgba(255,230,180,.9)', `800 ${fs}px Nunito, sans-serif`);
      c.textBaseline = 'alphabetic';
    } else {
      // the direction toward the Sun along the path: the bright side faces it
      let dx = m * Ax * Math.sin(p), dy = -Ay * Math.cos(p); const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
      const sh = ec?.kind === 'lunar' ? { ox: -dx * Math.abs(Math.sin(E * D2R)) / RM, oy: -dy * Math.abs(Math.sin(E * D2R)) / RM, rs: RE / RM } : null;
      drawMoon(c, mx, my, mr, E, dx, dy, !north, sh);
    }
    caption = (evening ? t.evening : t.morning)(t.dirWord[north ? 's' : 'n']);
  }
  // the ground, a few houses and trees, and the compass points
  c.fillStyle = '#0a0e17'; c.fillRect(pad, hy, W, h - hy);
  const s = clamp(h * 0.05, 12, 26), night = ec?.kind !== 'solar';
  for (const f of [0.14, 0.24, 0.66]) {
    const x = pad + W * f;
    c.fillStyle = '#0a0e17'; c.fillRect(x, hy - s, s * 1.2, s); c.beginPath(); c.moveTo(x - s * 0.15, hy - s); c.lineTo(x + s * 0.6, hy - s * 1.6); c.lineTo(x + s * 1.35, hy - s); c.fill();
    if (night) { c.fillStyle = '#ffd25a'; c.fillRect(x + s * 0.4, hy - s * 0.65, s * 0.3, s * 0.3); }
  }
  for (const f of [0.36, 0.8, 0.88]) {
    const x = pad + W * f; c.fillStyle = '#0a0e17';
    c.beginPath(); c.moveTo(x, hy - s * 2.2); c.lineTo(x + s * 0.7, hy); c.lineTo(x - s * 0.7, hy); c.fill();
  }
  c.fillStyle = 'rgba(255,255,255,.75)'; c.font = `900 ${fs + 1}px Nunito, sans-serif`; c.textAlign = 'center';
  const gy = hy + Math.min(22, (h - hy) * 0.55);
  c.fillText(t.dirs[3], cx + mW * Ax, gy); c.fillText(t.dirs[1], cx - mW * Ax, gy); c.fillText(t.dirs[north ? 2 : 0], cx, gy);
  c.textAlign = 'left'; c.fillStyle = 'rgba(255,255,255,.8)'; c.font = `800 ${fs}px Nunito, sans-serif`;
  c.fillText(caption, pad + 12, top + 20);
  c.restore();
}

// Moon by day, two panels: from space (the Earth turns under you) and your sky (what you see at this time of day)
const rgbMix = (a, b, k) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',')})`;
function drawDay(c, w, h, time) {
  const di = dayInfo(), wide = w > h * 1.2, g = 6, hh = h * 0.45;
  const sp = wide ? { x: 0, y: 0, w: (w - g) / 2, h } : { x: 0, y: 0, w, h: hh - g / 2 };
  const sk = wide ? { x: (w + g) / 2, y: 0, w: (w - g) / 2, h } : { x: 0, y: hh + g / 2, w, h: h - hh - g / 2 };
  lay.day = { w };
  for (const [r, fn] of [[sp, drawDaySpace], [sk, drawDaySky]]) {
    c.save(); c.translate(r.x, r.y); c.beginPath(); c.roundRect ? c.roundRect(0, 0, r.w, r.h, 16) : c.rect(0, 0, r.w, r.h); c.clip();
    fn(c, r.w, r.h, time, di);
    c.restore();
    c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.beginPath(); c.roundRect ? c.roundRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1, 16) : c.rect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1); c.stroke();
  }
  const key = [sk.x, sk.y, sk.w, sk.h].map(Math.round).join(); // the check's overlay covers the sky panel
  if (dayEl.dataset.r !== key) { dayEl.dataset.r = key; Object.assign(dayEl.style, { left: `${sk.x}px`, top: `${sk.y}px`, width: `${sk.w}px`, height: `${sk.h}px` }); }
}
// panel 1: looking down on the North Pole like drawSpace. You stand on the Earth's rim, at the angle drawSpace gives an elongation equal to
// your hour angle: at noon you face the Sun, and the Earth turns the way the Moon goes round. Not to scale.
function drawDaySpace(c, w, h, time, di) {
  const t = T[lang], D = t.day, e = di.E * D2R, a = di.Hs * D2R, fs = clamp(w * 0.04, 10, 12.5), k = S.chk;
  const R = Math.min(w * 0.36, h * 0.36), cx = w * 0.46, cy = h * 0.54, Re = R * 0.3, Rm = R * 0.11;
  c.fillStyle = '#060912'; c.fillRect(0, 0, w, h);
  const sg = c.createRadialGradient(w + 20, cy, 10, w + 20, cy, Math.min(w, h) * 0.5);
  sg.addColorStop(0, 'rgba(255,214,90,.5)'); sg.addColorStop(1, 'rgba(255,170,50,0)');
  c.fillStyle = sg; c.fillRect(0, 0, w, h);
  c.strokeStyle = 'rgba(255,207,74,.22)'; c.lineWidth = 1.5; c.setLineDash([6, 9]); c.lineDashOffset = time * 30;
  for (let i = 0; i < 7; i++) {
    const y = h * (i + 0.5) / 7, dy = y - cy, end = Math.abs(dy) < Re ? cx + Math.sqrt(Re * Re - dy * dy) : 0;
    c.beginPath(); c.moveTo(w, y); c.lineTo(end, y); c.stroke();
  }
  c.setLineDash([]);
  label(c, `← ${t.sunlight}`, w - 50, 14, w, 'rgba(255,214,120,.9)', `800 ${fs}px Nunito, sans-serif`);
  c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1.5; c.setLineDash([4, 6]);
  c.beginPath(); c.arc(cx, cy, R, 0, 7); c.stroke(); c.setLineDash([]);
  const eg = c.createLinearGradient(cx - Re, 0, cx + Re, 0);
  eg.addColorStop(0, '#111a30'); eg.addColorStop(0.46, '#111a30'); eg.addColorStop(0.54, '#3f86e6'); eg.addColorStop(1, '#6aaaf2');
  c.fillStyle = eg; c.beginPath(); c.arc(cx, cy, Re, 0, 7); c.fill();
  c.strokeStyle = 'rgba(200,215,245,.35)'; c.lineWidth = 1; c.stroke();
  const mx = cx + R * Math.cos(e), my = cy - R * Math.sin(e);
  const mg = c.createLinearGradient(mx - Rm, 0, mx + Rm, 0);
  mg.addColorStop(0, '#2a2f3e'); mg.addColorStop(0.47, '#2a2f3e'); mg.addColorStop(0.53, '#ece8dc'); mg.addColorStop(1, '#fffbea');
  c.fillStyle = mg; c.beginPath(); c.arc(mx, my, Rm, 0, 7); c.fill();
  c.lineWidth = 2; c.strokeStyle = 'rgba(255,207,74,.95)'; c.beginPath(); c.arc(mx, my, Rm + 3, -Math.PI / 2, Math.PI / 2); c.stroke();
  // you: a dot and a tiny stick pointing straight up from the ground
  const nx = Math.cos(a), ny = -Math.sin(a), ox = cx + Re * nx, oy = cy + Re * ny;
  c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(ox, oy); c.lineTo(ox + nx * 8, oy + ny * 8); c.stroke();
  c.fillStyle = '#ff3b30'; c.beginPath(); c.arc(ox, oy, 3.5, 0, 7); c.fill(); c.stroke();
  c.textBaseline = 'middle';
  label(c, t.you, ox + nx * 19, oy + ny * 19, w, '#EDEFF7', `800 ${fs - 1}px Nunito, sans-serif`);
  // your horizon: the line through you, touching the Earth; always in explore mode, in a check only after Hint or the answer
  if (!k || k.hint || k.a !== null || k.done) {
    const L = w + h, tx = -ny, ty = nx; // along the ground: (sin a, cos a)
    c.strokeStyle = 'rgba(159,211,255,.8)'; c.lineWidth = 1.5; c.setLineDash([7, 5]);
    c.beginPath(); c.moveTo(ox - tx * L, oy - ty * L); c.lineTo(ox + tx * L, oy + ty * L); c.stroke(); c.setLineDash([]);
    const d = R * 0.95, ps = [1, -1].map((s) => [ox + s * tx * d, oy + s * ty * d]);
    const [lx, ly] = ps.reduce((best, p) => Math.min(p[0], w - p[0], p[1], h - p[1]) > Math.min(best[0], w - best[0], best[1], h - best[1]) ? p : best);
    label(c, D.horizon, lx + nx * 46, ly + ny * 10, w, '#9fd3ff', `800 ${fs - 1}px Nunito, sans-serif`);
  }
  c.textBaseline = 'alphabetic';
}
// panel 2: your sky. The Sun and the Moon ride one arc: an object with hour angle H is at x = sin H, height = cos H
function drawDaySky(c, w, h, time, di) {
  const t = T[lang], north = S.hemi === 'n', mW = north ? 1 : -1, fs = clamp(w * 0.04, 10, 12.5);
  if (S.chk && S.chk.a === null && !S.chk.done) { c.fillStyle = '#0b0f1c'; c.fillRect(0, 0, w, h); return; } // under the curtain: nothing of the sky
  const hy = h * 0.8, cx = w / 2, Ax = w / 2 * 0.84, Ay = hy * 0.8;
  const kd = clamp(0.5 + Math.cos(di.Hs * D2R) / 0.278, 0, 1); // 0 night, 1 day; the dusk mix is the 8 degrees round the horizon
  const at = (H) => [cx + mW * Ax * Math.sin(H * D2R), hy - Ay * Math.cos(H * D2R)];
  const sky = c.createLinearGradient(0, 0, 0, hy);
  sky.addColorStop(0, rgbMix([10, 16, 41], [61, 127, 208], kd)); sky.addColorStop(1, rgbMix([74, 60, 110], [156, 200, 239], kd));
  c.fillStyle = sky; c.fillRect(0, 0, w, hy);
  const [sx, sy] = at(di.Hs), dusk = 1 - Math.abs(2 * kd - 1);
  if (dusk > 0) {
    const glow = c.createRadialGradient(sx, hy, 4, sx, hy, w * 0.55);
    glow.addColorStop(0, `rgba(255,150,70,${(0.6 * dusk).toFixed(2)})`); glow.addColorStop(1, 'rgba(255,120,60,0)');
    c.fillStyle = glow; c.fillRect(0, 0, w, hy);
  }
  if (kd < 1) for (const [x, y, al] of STARS) { c.fillStyle = `rgba(255,255,255,${(al * 0.5 * (1 - kd)).toFixed(2)})`; c.fillRect(x * w, y * hy, 1.5, 1.5); }
  c.strokeStyle = 'rgba(237,239,247,.25)'; c.lineWidth = 1.5; c.setLineDash([4, 7]);
  c.beginPath(); c.ellipse(cx, hy, Ax, Ay, 0, Math.PI, 2 * Math.PI); c.stroke(); c.setLineDash([]);
  if (di.sunUp) sunDisc(c, sx, sy, clamp(Math.min(w, h) * 0.05, 9, 20), time);
  if (di.moonUp) {
    const mr = clamp(Math.min(w, h) * 0.085, 13, 34), [mx0, my0] = at(di.Hm), my = Math.min(my0, hy - mr - 4);
    if (di.status === 'glare') { // it is there, but you cannot see it
      c.strokeStyle = 'rgba(237,239,247,.7)'; c.lineWidth = 1.2; c.setLineDash([3, 4]);
      c.beginPath(); c.arc(mx0, my, mr, 0, 7); c.stroke(); c.setLineDash([]);
    } else {
      // the bright side faces the Sun, along the arc (y up, like drawSky)
      const sg = di.E <= 180 ? 1 : -1, H = di.Hm * D2R;
      let dx = sg * mW * Ax * Math.cos(H), dy = -sg * Ay * Math.sin(H); const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
      c.globalAlpha = di.sunUp ? 0.8 : 1;
      drawMoon(c, mx0, my, mr, di.E, dx, dy, !north, null, di.sunUp);
      c.globalAlpha = 1;
    }
  }
  c.fillStyle = rgbMix([10, 14, 23], [47, 93, 52], kd); c.fillRect(0, hy, w, h - hy);
  c.fillStyle = 'rgba(255,255,255,.75)'; c.font = `900 ${fs + 1}px Nunito, sans-serif`; c.textAlign = 'center';
  const gy = hy + Math.min(22, (h - hy) * 0.55);
  c.fillText(t.dirs[3], cx + mW * Ax, gy); c.fillText(t.dirs[1], cx - mW * Ax, gy); c.fillText(t.dirs[north ? 2 : 0], cx, gy);
  c.textAlign = 'left'; c.fillStyle = 'rgba(255,255,255,.9)'; c.font = `800 ${fs + 1}px Nunito, sans-serif`;
  c.fillText(fmtTime(S.hour), 12, 20);
}

// One month: the Moon on every day of one cycle
function drawMonth(c, w, h) {
  const t = T[lang], north = S.hemi === 'n';
  const cols = w >= 560 ? 10 : 6, rows = 30 / cols, foot = 50;
  const cell = Math.min((w - 12) / cols, (h - foot - 8) / rows);
  const x0 = (w - cell * cols) / 2, y0 = 6 + Math.max(0, (h - foot - 8 - cell * rows) / 2);
  lay.month = { x0, y0, cell, cols, rows };
  const cur = Math.round(S.day) % 30, keys = [0, 7, 15, 22];
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let i = 0; i < 30; i++) {
    const x = x0 + (i % cols) * cell, y = y0 + Math.floor(i / cols) * cell;
    if (i === cur || keys.includes(i)) {
      c.fillStyle = i === cur ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,0)';
      c.strokeStyle = i === cur ? 'rgba(255,255,255,.8)' : 'rgba(245,200,76,.35)'; c.lineWidth = i === cur ? 2 : 1;
      c.beginPath(); c.roundRect ? c.roundRect(x + 2, y + 2, cell - 4, cell - 4, 10) : c.rect(x + 2, y + 2, cell - 4, cell - 4); c.fill(); c.stroke();
    }
    const E = i / P * 360, dx = (E <= 180 ? 1 : -1) * (north ? 1 : -1);
    drawMoon(c, x + cell / 2, y + cell * 0.42, cell * 0.29, E, dx, 0, !north, null);
    c.fillStyle = i === cur ? '#fff' : 'rgba(152,160,184,.9)'; c.font = `800 ${clamp(cell * 0.17, 9, 13)}px Nunito, sans-serif`;
    c.fillText(String(i), x + cell / 2, y + cell * 0.86);
  }
  const by = y0 + rows * cell + 16, fs = clamp(w * 0.026, 10, 12.5);
  const keyLine = [0, 2, 4, 6].map((i) => `${EMO[north ? i : (8 - i) % 8]} ${nf(i * P / 8, 1)}`).join('   ·   ');
  c.fillStyle = 'rgba(245,200,76,.95)'; c.font = `800 ${fs}px Nunito, sans-serif`; c.fillText(keyLine, w / 2, by);
  label(c, t.repeat(nf(P, 1)), w / 2, by + 20, w, 'rgba(237,239,247,.85)', `800 ${fs}px Nunito, sans-serif`);
  c.textBaseline = 'alphabetic';
}

canvasLoop(cv, (c, w, h, dt, time) => {
  if (S.playing) {
    S.day = wrap(S.day + dt * 2);
    if (Math.floor(time * 6) !== Math.floor((time - dt) * 6)) render();
  }
  if (lab.view === 'space') drawSpace(c, w, h, time);
  else if (lab.view === 'sky') drawSky(c, w, h, time);
  else if (lab.view === 'day') drawDay(c, w, h, time);
  else drawMonth(c, w, h);
});
render();
</script>
</body>
</html>
