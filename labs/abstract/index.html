function flushPills(c, w, h) {
  for (const p of PILLS) {
    const px = VOX + p.x * VS, py = VOY + p.y * VS, size = p.size ?? 12.5;

  }
  PILLS = [];
}

function thumbDetail(c, w, h) {
  c.fillStyle = '#f7f1e0'; c.fillRect(0, 0, w, h);
  const r = rng(3);
  c.fillStyle = '#8fbf6a'; c.fillRect(0, h - 16, w, 16);
  const leaf = (x, y) => { for (let i = 0; i < 4; i++) { c.fillStyle = ['#4f9440', '#6fb04a', '#8cc45a', '#2f6f30'][Math.floor(r() * 4)]; c.save(); c.translate(x + (r() - 0.5) * 9, y + (r() - 0.5) * 9); c.rotate(r() * TAU); c.beginPath(); c.ellipse(0, 0, 4, 2.2, 0, 0, TAU); c.fill(); c.restore(); } };
  const grow = (x, y, ang, len, wd, depth) => {
    if (depth === 0 || len < 4) { leaf(x, y); if (r() < 0.25) { c.fillStyle = '#d7263d'; c.beginPath(); c.arc(x + 2, y + 3, 2.4, 0, TAU); c.fill(); } return; }
    const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
    c.strokeStyle = '#5a3d27'; c.lineWidth = wd; c.lineCap = 'round'; c.beginPath(); c.moveTo(x, y); c.lineTo(x2, y2); c.stroke();
    const kids = depth > 2 ? 2 + (r() < 0.4 ? 1 : 0) : 2;
    for (let k = 0; k < kids; k++) grow(x2, y2, ang + (k - (kids - 1) / 2) * (0.62 + r() * 0.2) + (r() - 0.5) * 0.2, len * (0.7 + r() * 0.06), wd * 0.68, depth - 1);
  };
  grow(w / 2, h - 12, -Math.PI / 2, h * 0.27, 7, 7);
}
function thumbPhoto(c, w, h) {
  c.fillStyle = '#f6f2ea'; c.fillRect(0, 0, w, h);
  c.save(); c.beginPath(); c.rect(10, 10, w - 20, w - 18); c.clip();
  c.drawImage(getR1(), 20 * R1K, 30 * R1K, 200 * R1K, 205 * R1K, 10, 10, w - 20, w - 18);
  c.fillStyle = 'rgba(255,190,110,.1)'; c.fillRect(10, 10, w - 20, w - 18); c.restore();
  c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 1; c.strokeRect(10, 10, w - 20, w - 18);
  c.globalAlpha = 1; c.fillStyle = '#222'; c.font = '26px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('📷', w / 2, h - 22);
}

function note(freq, dur, type, vol) {
  if (!store.get('sound', false)) return;
  try {
    ac ??= new (window.AudioContext || window.webkitAudioContext)();
    unmuteIOS(); if (ac.state !== 'running') ac.resume().catch(() => {});

    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch { /* no audio: stay silent */ }
}

const MPX = 60, MPY = 30; // the painting's top left in the design box while it is being made
const SIZES = { rect: [[90, 60], [40, 100], [56, 56], [110, 36]], circle: [[92, 92], [44, 44], [64, 64], [32, 32]], tri: [[64, 58], [40, 36], [52, 47], [30, 27]] };

}
const hits = (s, x, y) => {
  if (s.t === 'circle') return Math.hypot(x - s.x, y - s.y) <= s.w / 2 + 5;
  return Math.abs(x - s.x) <= s.w / 2 + 6 && Math.abs(y - s.y) <= s.h / 2 + 6;

$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'compose') return;

const GS = [[43, 12], [195, 12], [43, 192], [195, 192]], GSC = 0.46, GTT = 6;       // the four small paintings of the guessing step
function setView(w, h) {
  VS = Math.min(w / W, h / H); VOX = (w - W * VS) / 2; VOY = (h - H * VS) / 2;
  return { s: VS, ox: VOX, oy: VOY };
}
function drawLadder(c, w, h, dt, time) {
  const { s, ox, oy } = setView(w, h);
  S.u += (S.target - S.u) * (1 - Math.exp(-dt * 7)); if (Math.abs(S.u - S.target) < 0.0008) S.u = S.target;
  if (S.lAsked && time >= S.gridHold) S.gridT = Math.max(0, S.gridT - dt * 1.1);
  S.aT += ((S.secA ? 1 : 0) - S.aT) * (1 - Math.exp(-dt * 9)); if (Math.abs(S.aT - (S.secA ? 1 : 0)) < 0.004) S.aT = S.secA ? 1 : 0;

  c.save(); c.translate(ox, oy); c.scale(s, s);
  const e = sm(S.gridT), m = 1 - e;
  if (m > 0.01) { // spotlight on the single painting
    const g = c.createLinearGradient(0, 0, 0, 350); g.addColorStop(0, `rgba(255,236,190,${0.2 * m})`); g.addColorStop(1, 'rgba(255,236,190,0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(172, 4); c.lineTo(188, 4); c.lineTo(342, 350); c.lineTo(18, 350); c.closePath(); c.fill();
    c.fillStyle = '#3a3026'; rr(c, 156, 0, 48, 8, 4); c.fill(); c.fillStyle = '#ffe9b0'; rr(c, 164, 6, 32, 3, 1.5); c.fill();
  }

    c.save(); c.globalAlpha = e; frameWood(c, x, y, ow, oh, GTT); drawPainting(c, k, x + GTT, y + GTT, GSC); c.restore();
    addPill(String(k + 1), x + ow / 2, y + oh + 13, { a: e });
  }

  {
    const sc = lerp(GSC, 1, m), tt = lerp(GTT, 8, m), ow = PW * sc + 2 * tt, oh = PH * sc + 2 * tt;
    const x = lerp(GS[3][0], 52, m), y = lerp(GS[3][1], 22, m), L = !S.lAsked ? 0 : S.lAns === null ? 1 : clamp((time - S.liftAt) / 1.1, 0, 1); // answered in an earlier visit: no cloth

    if (L < 1) cloth(c, x, y, ow, oh, L);
