    S.cubeSw = { row: clamp(Math.floor((p.y - fy) / (NET.cell + NET.gap)), 0, 2), col: clamp(Math.floor((p.x - fx) / (NET.cell + NET.gap)), 0, 2), x0: p.x, y0: p.y };
    $('cv').setPointerCapture?.(ev.pointerId);
  } else if (v === 'how' && S.hw === 'pen' && S.hp.pen !== null) {
    if (p.x < PAPER.x || p.x > PAPER.x + PAPER.w || p.y < PAPER.y || p.y > PAPER.y + PAPER.h) return;
    const st = { tip: S.pen.tip, pts: [[p.x, p.y]], t1: null, smear: false }; S.pen.strokes.push(st); if (S.pen.strokes.length > 40) S.pen.strokes.shift(); S.pen.cur = st; S.pen.last = [p.x, p.y];
    $('cv').setPointerCapture?.(ev.pointerId); sfx.tick();
  }
});
$('cv').addEventListener('pointermove', (ev) => {
  const cur = S.pen.cur; if (!cur) return;
  const p = pt(ev), x = clamp(p.x, PAPER.x + 6, PAPER.x + PAPER.w - 6), y = clamp(p.y, PAPER.y + 6, PAPER.y + PAPER.h - 6), l = cur.pts[cur.pts.length - 1], d = Math.hypot(x - l[0], y - l[1]);
  if (d < 1.5) return; cur.pts.push([x, y]); S.pen.rot += d / 4;
});
const up = (ev) => {
  if (S.pen.cur) { S.pen.cur.t1 = now(); S.pen.cur = null; render(); }
  const sw = S.cubeSw; if (!sw) return; S.cubeSw = null;
  const p = pt(ev), dx = p.x - sw.x0, dy = p.y - sw.y0;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 14) return;
  if (Math.abs(dx) >= Math.abs(dy)) turnLayer('y', 1 - sw.row, dx > 0 ? 1 : -1); else turnLayer('x', sw.col - 1, dy < 0 ? 1 : -1);
  sfx.snap(); render();
};
$('cv').addEventListener('pointerup', up); $('cv').addEventListener('pointercancel', () => { S.cubeSw = null; if (S.pen.cur) { S.pen.cur.t1 = now(); S.pen.cur = null; } });

$('hmBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset, tt = T[langNow];
  if (d.g !== undefined) { // desk: yes / no
    const id = S.sel; if (!id || S.guess[id] !== undefined) return;
    S.guess[id] = d.g === '1'; S.rt[id] = now(); (S.guess[id] === OB[id].hu ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (d.act === 'next') { const id = LAYOUT.flat().find((k) => S.guess[k] === undefined); if (id) { S.sel = id; sfx.tick(); render(); } return; }
  if (d.act === 'go') { $('views').querySelector('[data-view="desk"]')?.click(); return; }
  if (d.hw) { S.hw = d.hw; if (d.hw !== 'cube' && S.sec === 'b') S.sec = null; sfx.tick(); render(); return; }
  if (d.hp !== undefined) { // a prediction on the inside view
    const k = S.hw, i = +d.hp; if (S.hp[k] !== null) return; S.hp[k] = i; const ok = i === tt.how[k].ok; (ok ? sfx.good : sfx.bad)();
    if (k === 'cube') S.cube.lastN = turnLayer('y', 1, 1); else if (k === 'match') strikeMatch(2, 'table');
    render(); showStage(); return;
  }
  if (d.act === 'scr') { for (let i = 0; i < 14; i++) turnLayer(Math.random() < .5 ? 'y' : 'x', Math.floor(Math.random() * 3) - 1, Math.random() < .5 ? 1 : -1); S.cube.hi = null; S.cube.turns = 0; sfx.push(); render(); return; }
  if (d.act === 'rst') { S.cube = newCube(); sfx.click(); render(); return; }
  if (d.tip !== undefined) { S.pen.tip = +d.tip; sfx.tick(); render(); return; }
  if (d.act === 'rub') { const t = now(); S.pen.rub = t; const wetT = [12, 0, 1]; for (const st of S.pen.strokes) if (st.t1 && t - st.t1 < wetT[st.tip]) st.smear = true; sfx.push(); render(); return; }
  if (d.act === 'clr') { S.pen.strokes = []; sfx.click(); render(); return; }
  if (d.mt !== undefined) { S.mt.type = +d.mt; S.mt.t0 = null; S.mt.surf = null; sfx.tick(); render(); return; }
  if (d.strike) { strikeMatch(S.mt.type, d.strike); (S.mt.type === 2 && d.strike === 'table' ? sfx.bad : sfx.good)(); render(); return; }
  if (d.ab) { S.ab = d.ab; S.sec = null; sfx.tick(); render(); return; }
  if (d.person) { S.person = d.person; if (!PQ[d.person] || S.pp[d.person] !== undefined) S.prt[d.person] = now(); sfx.tick(); render(); return; }
  if (d.pa !== undefined) { const id = S.person; if (!id || S.pp[id] !== undefined) return; S.pp[id] = +d.pa; S.prt[id] = now(); (PQ[id].opts[+d.pa] === PQ[id].opts[PQ[id].ok] ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  if (d.sp !== undefined) { if (S.sportPick !== null) return; S.sportPick = +d.sp; S.sportT = now(); (+d.sp === tt.ab.sport.ok ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  if (d.sec) { // the two secret experiments
    if (!secret.unlocked()) return secret.open();
    if (S.sec === d.sec) { S.sec = null; sfx.click(); render(); return; }
    S.sec = d.sec; sfx.click();
    if (d.sec === 'a') { const s = seen().includes(S.person) && OB[S.person].stops.length > 1 ? S.person : 'pen'; S.person = s; S.prt[s] = now(); }
    else { S.hw = 'cube'; }
    render(); showStage();
  }
});

// --- one render per change: controls, readout, state card, facts --------------------------------------------------------
const optsHTML = (opts, pick, ok, key) => `<div class="hm-opts">${opts.map((o, i) => `<button class="hm-opt${pick !== null ? (i === ok ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-${key}="${i}"${pick !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
const chipsHTML = (items, on, key) => `<div class="hm-chips">${items.map(([k, label]) => `<button class="chip${k === on ? ' on' : ''}" data-${key}="${k}">${esc(label)}</button>`).join('')}</div>`;
const secChip = (k, emo, name) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${secret.unlocked() ? `${emo} ${esc(name)}` : '🔒 ???'}</button>`;
const factsOf = (texts, emos, srcs) => texts.map((text, i) => ({ emo: emos[i], text, src: srcs[i] }));
function setSt(a, lead) { lab.setState({ emo: a[0], title: a[1], lead: lead ?? a[2], body: a[3] ?? '', extra: '' }); }

function render() {
  langNow = langOf();
  const t = T[langNow], v = lab.view;
  document.body.dataset.v = v;
  $('cv').style.touchAction = (v === 'how' && ((S.hw === 'cube' && S.hp.cube !== null) || (S.hw === 'pen' && S.hp.pen !== null))) ? 'none' : 'pan-y';
  if (v === 'desk') renderDesk(t); else if (v === 'how') renderHow(t); else renderAbroad(t);
}

function renderDesk(t) {
  const id = S.sel, o = id && t.ob[id], g = id ? S.guess[id] : undefined, done = g !== undefined;
  const n = Object.keys(S.guess).length, right = OBJ_IDS.filter((k) => S.guess[k] !== undefined && S.guess[k] === OB[k].hu).length;
  let h = '';
  if (!id) h = `<p class="hm-hint">${esc(t.ui.tap)}</p>`;
  else {
    h = `<div class="hm-q">${esc(o.q)}</div><div class="hm-opts">${[true, false].map((val) => `<button class="hm-opt${done ? (val === OB[id].hu ? ' good' : val === g ? ' bad' : ' dim') : ''}" data-g="${val ? 1 : 0}"${done ? ' disabled' : ''}>${esc(val ? t.ui.yes : t.ui.no)}</button>`).join('')}</div>`;
    if (done) h += `<div class="hm-verdict ${g === OB[id].hu ? 'good' : 'bad'}">${esc((g === OB[id].hu ? t.ui.right + ' ' : '') + o.t)}</div>`;
  }
  if (done && n < OBJ_IDS.length) h += `<div class="hm-btns"><button class="btn" data-act="next">${esc(t.ui.next)}</button></div>`;
  if (n === OBJ_IDS.length) h += `<p class="hm-note">${esc(t.ui.done)}</p>`;
  $('hmBody').innerHTML = h;
  lab.setReadout(`${n}<small style="font-size:.55em;opacity:.7"> / ${OBJ_IDS.length}</small>`, t.ui.checked, right ? t.ui.rightN(right) : '', '#e0a84a');
  lab.setGlow('rgba(224, 168, 74, .26)');
  if (!id) setSt(t.ui.s0); else if (!done) setSt(t.ui.sq); else lab.setState({ emo: OB[id].hu ? '💡' : '🧭', title: o.t, lead: o.l, body: o.b, extra: '' });
  lab.setFacts(done ? factsOf([o.f1, o.f2], OB[id].fe, OB[id].src) : []);
}

function renderHow(t) {
  const k = S.hw, h = t.how, pk = S.hp[k], done = pk !== null, cb = S.cube;
  let html = chipsHTML(['cube', 'pen', 'match'].map((x) => [x, h.chip[x]]), k, 'hw'), st, facts = [];
  html += `<div class="hm-q">${esc(h[k].q)}</div>` + optsHTML(h[k].o, pk, h[k].ok, 'hp');
  const ok = done && pk === h[k].ok;
  if (done) html += `<div class="hm-verdict ${ok ? 'good' : 'bad'}">${esc(k === 'cube' ? h.cube.v(cb.lastN ?? 21, ok) : h[k].v[ok ? 0 : 1])}</div>`;
  if (k === 'cube') {
    if (done) html += `<div class="hm-chips sub"><button class="chip" data-act="scr">${esc(h.cube.scr)}</button><button class="chip" data-act="rst">${esc(h.cube.reset)}</button>${secChip('b', '⏳', h.secB.t)}</div>`;
    else html += `<div class="hm-chips sub">${secChip('b', '⏳', h.secB.t)}</div>`;
    const faces = solvedFaces();
    lab.setReadout(String(cb.turns), h.cube.turns, done ? h.cube.faces(faces) : '', '#6fb6d4');
    st = S.sec === 'b' ? [h.secB.s, h.secB.title, h.secB.lead(dec(CUBE_Y), CUBE_R)] : done ? h.cube.s1 : h.cube.s0;
    facts = S.sec === 'b' ? factsOf(h.secB.facts, ['⏳', '🧊'], [WIKI + 'Age_of_the_universe', WIKI + 'Rubik%27s_Cube']) : done ? factsOf(h.cube.facts, ['🔢', '🧊'], [WIKI + 'Rubik%27s_Cube', WIKI + 'Rubik%27s_Cube']) : [];
  } else if (k === 'pen') {
    if (done) html += chipsHTML(h.pen.tips.map((x, i) => [String(i), x]), String(S.pen.tip), 'tip').replace('class="hm-chips"', 'class="hm-chips sub"') + `<div class="hm-btns"><button class="chip" data-act="rub">${esc(h.pen.rub)}</button><button class="chip" data-act="clr">${esc(h.pen.clear)}</button></div><p class="hm-note">${esc(h.pen.hint)}</p>`;
    lab.setReadout(done ? String(S.pen.strokes.length) : '–', h.pen.strokes, done ? h.pen.tips[S.pen.tip] : '', '#6fb6d4');
    st = done ? h.pen.tipS[S.pen.tip] : h.pen.s0; facts = done ? factsOf(h.pen.facts, ['🖊️', '⏱️'], [WIKI + 'Ballpoint_pen', WIKI + 'Ballpoint_pen']) : [];
  } else {
    if (done) html += chipsHTML(h.match.types.map((x, i) => [String(i), x]), String(S.mt.type), 'mt').replace('class="hm-chips"', 'class="hm-chips sub"') + `<div class="hm-btns"><button class="btn" data-strike="table">${esc(h.match.strike[0])}</button><button class="btn" data-strike="box">${esc(h.match.strike[1])}</button></div>`;
    lab.setReadout(done ? String(S.mt.n) : '–', h.match.strikes, done ? h.match.types[S.mt.type] : '', '#6fb6d4');
    const m = S.mt, key = m.t0 === null ? null : m.type === 0 ? 'early' : m.type === 1 ? 'quiet' : m.surf === 'table' ? 'safeTable' : 'safeBox';
    st = done ? (key ? h.match.res[key] : ['🔥', h.match.types[m.type], h.match.pick]) : h.match.s0; facts = done ? factsOf(h.match.facts, ['🧪', '🔴'], [WIKI + 'Safety_match', WIKI + 'Safety_match']) : [];
  }
  $('hmBody').innerHTML = html;
  lab.setGlow('rgba(80, 150, 200, .3)');
  setSt(st); lab.setFacts(facts);
}

function renderAbroad(t) {
  const a = t.ab, tabs = chipsHTML([['pl', a.chip.pl], ['sp', a.chip.sp]], S.ab, 'ab');
  lab.setGlow('rgba(224, 168, 74, .26)');
  if (S.ab === 'sp') {
    const sp = a.sport, pk = S.sportPick, done = pk !== null, ok = done && pk === sp.ok;
    $('hmBody').innerHTML = tabs + `<div class="hm-q">${esc(sp.q)}</div>` + optsHTML(sp.o, pk, sp.ok, 'sp') + (done ? `<div class="hm-verdict ${ok ? 'good' : 'bad'}">${esc(sp.v(ok, SPORT[0][1], SPORT[5][1]))}</div>` : '');
    lab.setReadout(done ? String(SPORT[0][1]) : '?', done ? `${sp.names.fen}` : '', done ? '2024' : '', '#e0a84a');
    setSt(done ? sp.s1(SPORT[0][1], SPORT[1][1], SPORT[2][1]) : sp.s0);
    lab.setFacts(done ? factsOf(sp.facts, ['🏅', '🤽'], SPORT_SRC) : []);
    return;
  }
  const people = travellers(); if (!S.person || !people.includes(S.person)) { S.person = people[0] ?? null; if (S.person && !S.prt[S.person]) S.prt[S.person] = now(); }
  const id = S.person, pr = id && a.pr[id], q = id && PQ[id], pk = id ? S.pp[id] : undefined, ans = pk !== undefined;
  let html = tabs;
  if (!people.length) {
    html += `<div class="hm-btns"><button class="btn" data-act="go">${esc(a.go)}</button></div><div class="hm-chips sub">${secChip('a', '🧭', a.secA.t)}</div>`;
    $('hmBody').innerHTML = html; lab.setReadout('?', '', '', '#e0a84a'); setSt(a.gate); lab.setFacts([]); return;
  }
  html += `<div class="hm-chips">${people.map((x) => `<button class="chip${x === id ? ' on' : ''}" data-person="${x}">${esc(a.names[x])}</button>`).join('')}</div>`;
  if (q) {
    html += `<div class="hm-q">${esc(pr.q)}</div>` + optsHTML(q.opts.map((r) => a.reasons[r]), ans ? pk : null, q.ok, 'pa');
    if (ans) html += `<div class="hm-verdict ${q.opts[pk] === q.opts[q.ok] ? 'good' : 'bad'}">${esc((pk === q.ok ? t.ui.right + ' ' : '') + pr.t)}</div>`;
  } else html += `<div class="hm-verdict good">${esc(pr.t)}</div>`;
  html += `<div class="hm-chips sub">${secChip('a', '🧭', a.secA.t)}</div>`;
  $('hmBody').innerHTML = html;
  const shown = routeShown(id), st = OB[id].stops, yrs = st.map((s) => s[1]).filter(Boolean);
  lab.setReadout(shown ? String(st.length) : '?', shown ? a.places : '', shown && yrs.length > 1 ? `${yrs[0]}–${yrs[yrs.length - 1]}` : '', '#e0a84a');
  if (S.sec === 'a' && st.length > 1) lab.setState({ emo: '🧭', title: a.secA.title, lead: a.secA.lead(a.names[id], fmtKm(routeKm(id))), body: a.secA.body, extra: '' });
  else if (q && !ans) setSt(a.pq); else lab.setState({ emo: '🧳', title: pr.t, lead: pr.l, body: pr.b, extra: '' });
  lab.setFacts(shown ? [{ emo: '📌', text: pr.f, src: PSRC[id] }] : []);
}
render();
</script>
</body>
</html>
