// 4. In a town: a grid of people, a sick one, neighbours. Results are computed by running the toy model.
// ---------------------------------------------------------------------------------------------------------
const COLS = 14, ROWS = 9, NP = COLS * ROWS, NBABY = 8, ZERO = 4 * COLS + 7, INF_STEPS = 3;

const shielded = () => Array.from({ length: NP }, (_, i) => i !== ZERO && !BABY.has(i) && RANK[i] < S.p);   // got the vaccine
const effective = (sh) => sh.map((v, i) => v && !(S.vr && LEAK[i] < 0.5));                                   // still protected (a variant fools half of them)
const spreadPars = () => ({ beta: 0.25 * (S.hw ? 0.55 : 1), mix: 0.6 * (S.hw ? 0.55 : 1) });

function runOutbreak(eff) { // quick, no animation: returns { total, babies }

const TW = { phase: 'idle', st: new Uint8Array(NP), tm: new Uint8Array(NP), flash: new Float32Array(NP), fx: [], acc: 0, sick: 1, total: 1, info: null, eff: [] };

  const k = ev.target.closest('.chip')?.dataset.k; if (!k) return;
  if (k === 's1' || k === 's2') {
    if (!secret.unlocked()) return secret.open();
    if (k === 's1') S.hw = !S.hw; else S.vr = !S.vr;
    townReset(); sfx.click(); return render();
  }
  if (k === 'arrive') startInfection();
  else if (k === 'vacc') startTrain();
  else if (k === 'reset') { bodyReset(); sfx.click(); }
  else if (k === 'outbreak') townStart();
  else if (k === 'x20') townBatch();
  else if (k === 'curve') townCurve();
  render();
});
const ask = Object.assign(document.createElement('div'), { className: 'ask card' });
$('overlay').append(ask);
ask.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.a) { S.answer = +b.dataset.a; (S.answer === 1 ? sfx.good : sfx.bad)(); }
  else { S.answered = true; store.set('immunity:asked', true); }
  render();
});

// ---------------------------------------------------------------------------------------------------------
// 6. Words on the page, live
// ---------------------------------------------------------------------------------------------------------
function legend(items) { return `<div class="lg">${items.join('')}</div>`; }
function bodyState() {
  const t = T[lang], b = t.b, r = B.run, L = t.leg;
  let s, body, extra = '';
  if (B.phase === 'arrive') s = b.arrive;
  else if (B.phase === 'train') s = b.train;
  else if (B.phase === 'run') { s = b[r.kind]; body = B.t > r.peakT ? b.fall : s[3]; }
  else if (B.after === 'blocked') s = b.blocked;
  else if (B.after === 'done' && r) {
    const pk = Math.round(r.peak), prev = B.hist.at(-1);
    s = ['✅', b.doneT, b.doneLead(pk, Math.round(r.clear)), `${pk >= ILL ? b.ill : b.mild}${prev ? ' ' + b.cmp(Math.round(prev.peak)) : ''} ${b.memNote}`];
  } else if (B.after === 'vacc') s = b.idleVacc;
  else s = b.idle0;
  const rows = [...B.hist, ...(r ? [r] : [])].slice(-4);
  const tbl = rows.length ? `<table class="rt"><tr><th></th><th>${esc(t.tbl.peak)}</th><th>${esc(t.tbl.gone)}</th></tr>${rows.map((q) => `<tr><td>${esc(t.runLbl[q.kind])}</td><td>${q.done || q !== r ? nf(Math.round(q.peak)) : '…'}</td><td>${q.done || q !== r ? nf(Math.round(q.clear)) : '…'}</td></tr>`).join('')}</table>` : '';
  const notes = (S.hw ? `<div class="note">🧼 ${esc(b.hw)}</div>` : '') + (S.vr ? `<div class="note">🧬 ${esc(b.vr)}</div>` : '');
  extra = legend([`<span><i style="background:#7be26a"></i>${esc(L.germ)}</span>`, `<span><i style="background:#e8f0ff"></i>${esc(L.cell)}</span>`, `<span><b style="color:#ffd24a">★</b>${esc(L.mem)}</span>`, `<span><b style="color:#7fb4ff">Y</b>${esc(L.ab)}</span>`]) + tbl + notes + `<div class="fine">${esc(t.fine)}</div>`;
  return { emo: s[0], title: s[1], lead: s[2], body: body ?? s[3], extra };
}
function townState() {
  const t = T[lang], w = t.tw, L = t.leg, i = TW.info;
  let s;
  if (TW.phase === 'run') s = w.run(nf(TW.sick));
  else if (i?.kind === 'run') {
    const f = i.size / NP, lead = f < 0.15 ? w.leadLow : f < 0.5 ? w.leadMid : w.leadHigh;
    s = ['📊', w.doneT(nf(i.size), nf(NP)), lead, w.babies(nf(i.babies), nf(NBABY))];
  } else if (i?.kind === 'avg') {
    const f = i.size / NP, lead = f < 0.15 ? w.leadLow : f < 0.5 ? w.leadMid : w.leadHigh;
    s = ['📊', w.avgT(i.r, nf(Math.round(i.size))), lead, w.avgBabies(nf(i.babies, 1), nf(NBABY))];
  } else if (i?.kind === 'curve') {
    const q = (p) => i.pts[p / 10];
    s = ['📈', w.curveT, w.curveLead(nf(Math.round(q(0).avg)), nf(Math.round(q(50).avg)), nf(Math.round(q(80).avg)), nf(Math.round(q(100).avg))), w.curveBody(nf(q(0).b, 1), nf(q(80).b, 1), nf(NBABY))];
  } else s = w.idle;
  const notes = (S.hw ? `<div class="note">🧼 ${esc(w.hw)}</div>` : '') + (S.vr ? `<div class="note">🧬 ${esc(w.vr)}</div>` : '');
  const extra = legend([`<span><svg width="11" height="12" viewBox="-1 -1 12 13" style="vertical-align:-2px;margin-right:4px"><path d="M5 0L10 2V6Q9 10 5 11Q1 10 0 6V2Z" fill="#4ea8ff" stroke="#fff"/></svg>${esc(L.shield)}</span>`,
    `<span><i style="background:#ffd36e"></i>${esc(L.baby)}</span>`, `<span><i style="background:#ff5a3c"></i>${esc(L.sick)}</span>`, `<span><i style="background:#5ed39a"></i>${esc(L.rec)}</span>`, `<span><i style="background:#9fb0d9"></i>${esc(L.ok)}</span>`])
    + notes + `<div class="fine">${esc(t.fineTown(nf(NP)))}</div>`;
  return { emo: s[0], title: s[1], lead: s[2], body: s[3], extra };
}
function renderState() {
  lab.setState(lab.view === 'body' ? bodyState() : townState());
}
function stateKey() {
  return lab.view === 'body' ? `b|${B.phase}|${B.after}|${B.run?.kind}|${B.phase === 'run' && B.t > B.run.peakT}|${B.hist.length}` : `t|${TW.phase}|${TW.phase === 'run' ? TW.sick : ''}`;
}
let roKey = '';
function renderReadout() {
  const t = T[lang];
  const key = lab.view === 'body' ? `b${lang}${B.germs.filter((q) => !q.dying).length}${B.mem}` : `t${lang}${S.p}${TW.info?.size ?? ''}`;
  if (key === roKey) return; roKey = key;
  if (lab.view === 'body') {
    const n = B.germs.filter((q) => !q.dying).length;
    lab.setReadout(nf(n), t.germsNow, B.mem ? t.memYes : t.memNo, '#7be26a'); lab.setGlow('rgba(123,226,106,.16)');
  } else {
    const last = TW.info?.kind === 'run' || TW.info?.kind === 'avg' ? t.last(nf(Math.round(TW.info.size))) : '';
    lab.setReadout(`${nf(Math.round(S.p * 100))}%`, t.vaccSub, last, '#ff8a3d'); lab.setGlow('rgba(255,138,61,.2)');
  }
}
function render() {
  const t = T[lang], open = secret.unlocked(), body = lab.view === 'body';
  const sc = (k, on) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-k="${k}">${open ? esc(t.secrets[k === 's1' ? 's1' : 's2'][0]) : '🔒 ???'}</button>`;
  const chip = (k, on = false) => `<button class="chip ${on ? 'on' : ''}" data-k="${k}">${esc(t.chips[k])}</button>`;
  $('chips').innerHTML = body
    ? [sc('s1', open && S.hw), chip('arrive', B.phase === 'arrive' || B.phase === 'run'), chip('vacc', B.phase === 'train'), chip('reset'), sc('s2', open && S.vr)].join('')
    : [sc('s1', open && S.hw), chip('outbreak', TW.phase === 'run'), chip('x20'), chip('curve'), sc('s2', open && S.vr)].join('');
  $('sliderRow').style.display = body ? 'none' : '';
  $('slider').value = Math.round(S.p * 100);
  const lines = body ? t.lines : t.linesTown;
  $('hero').innerHTML = `<h1>${t.title}<i>.</i></h1>${lines.map(([b, r]) => `<p><b>${esc(b)}</b> ${esc(r)}</p>`).join('')}`;
  renderState(); S.skey = stateKey(); renderReadout();
  ask.style.display = S.answered ? 'none' : '';
  if (!S.answered) ask.innerHTML = S.answer === null
    ? `<div class="q">${esc(t.ask)}</div><div class="opts">${t.opts.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="q" style="color:${S.answer === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(S.answer === 1 ? t.right : t.wrong)}</div><div class="opts"><button>${esc(t.go)} →</button></div>`;
}

// ---------------------------------------------------------------------------------------------------------
// 7. Go
// ---------------------------------------------------------------------------------------------------------
townReset();
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (lab.view === 'body') drawBody(c, w, h, dt, time); else drawTown(c, w, h, dt, time);
  const k = stateKey(); if (k !== S.skey) { S.skey = k; renderState(); }
  renderReadout();
});
render();
</script>
</body>
</html>
