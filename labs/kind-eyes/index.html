const hx = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

function pill(c, txt, cx, cy, o = {}) {

    for (let i = 1; i < ws.length; i++) { const d = Math.abs(ws.slice(0, i).join(' ').length - ws.slice(i).join(' ').length); if (d < bd) { bd = d; best = i; } }
    lines = [ws.slice(0, best).join(' '), ws.slice(best).join(' ')];

  const tw = Math.max(...lines.map((l) => c.measureText(l).width)), pw = tw + 20, lh = fs * 1.2, ph = lines.length * lh + 10;
  const x = Math.max(4, Math.min(W - 4 - pw, cx - pw / 2)), y = Math.max(4, Math.min(H - 4 - ph, cy - ph / 2));

}

        c.save(); ell(c, ps.x, ps.y - 28 * k.s, 40 * g, 40 * g, rg(c, ps.x, ps.y - 28 * k.s, 4, 40 * g, [[0, 'rgba(255,226,120,.55)'], [1, 'rgba(255,226,120,0)']])); c.restore();
        const by = ps.y - 70 * k.s - 4 + Math.sin(t * 2.6 + i) * 1.5, r = 11 * back(u / .4);
        c.save(); ell(c, ps.x, by, r, r, rg(c, ps.x - 3, by - 4, 1, 14, [[0, '#fff3b0'], [1, '#f2b84b']]), '#c98a1f', 1.6);
        c.fillStyle = '#5a3a08'; c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; if (r > 8) c.fillText(String(DEPTH[i] + 1), ps.x, by + 1); c.restore();
      }
    }
    if (e < .9) { const k = K[0], q = ease(e / .7); heart(c, k.x, lerp(k.y - 150, k.y - 84, q), 22 * (e > .7 ? 1 - (e - .7) * 4 : 1)); }
  }
}

// --- the two secret scenes -----------------------------------------------------------------------------------------
function art(c, pw, ph) {
  rrect(c, 0, 0, pw, ph, 3); c.fillStyle = '#fffdf4'; c.fill();
  ell(c, pw * .78, ph * .22, 9, 9, '#ffd25e'); ell(c, pw * .5, ph * 1.02, pw * .6, ph * .3, '#7cc576');
  rrect(c, pw * .18, ph * .45, pw * .26, ph * .3, 1.5); c.fillStyle = '#e8605a'; c.fill();
  c.beginPath(); c.moveTo(pw * .14, ph * .46); c.lineTo(pw * .31, ph * .26); c.lineTo(pw * .48, ph * .46); c.closePath(); c.fillStyle = '#8f5a3b'; c.fill();
  rrect(c, pw * .27, ph * .58, pw * .08, ph * .17, 1.5); c.fillStyle = '#ffe9a8'; c.fill();
}
function drawSecret(c, t) {
  const sw = S.sw, el = sw ? t - S.swT0 : 0, ok = sw && sw.pick === sw.ok;
  // soft ground
  rrect(c, 12, 150, 336, 224, 28); c.fillStyle = lg(c, 12, 150, 348, 374, [[0, '#f3e2b6'], [1, '#dcc58a']]); c.fill(); c.lineWidth = 2; c.strokeStyle = '#bfa66c'; c.stroke();
  if (S.sec === 'words') {
    const fix = ok ? ease((el - .6) / .8) : 0;
    // table
    ell(c, 186, 322, 120, 10, 'rgba(60,40,20,.22)');
    [96, 262].forEach((x) => { rrect(c, x, 262, 7, 56, 2); c.fillStyle = '#7a5535'; c.fill(); });
    rrect(c, 60, 236, 240, 30, 7); c.fillStyle = lg(c, 0, 236, 0, 266, [[0, '#e8c48e'], [1, '#b98a5a']]); c.fill(); c.lineWidth = 1.6; c.strokeStyle = '#7a5535'; c.stroke();
    ell(c, 80, 244, 20, 5, 'rgba(255,255,255,.3)');
    // Dani behind the table, and the friend on the left
    const dani = { x: 214, y: 246, s: 1.05, col: '#e0584a', skin: '#e0a47a', hair: '#2d2430', hs: 'curly' };
    person(c, dani, { x: dani.x, y: dani.y, t, i: 3, mood: fix > .5 ? 'happy' : 'sad', arms: ['hold', 'hold'], bob: Math.sin(t * 2) * .8 });
    const you = { x: 108, y: 280, s: 1, col: '#4fb3a9', skin: '#f0c29a', hair: '#7a4a2a', hs: 'short' };
    person(c, you, { x: you.x, y: you.y, t, i: 4, mood: 'happy', arms: ['down', sw && el < 1.2 ? 'wave' : 'down'], bob: Math.sin(t * 2.2) * .8 });
    // the drawing on the table
    c.save(); c.translate(142, 214); c.rotate(-.05);
    const pw = 76, ph = 54, gap = (1 - fix) * 10, zig = [[.5, 0], [.44, .2], [.56, .38], [.45, .58], [.55, .78], [.5, 1]];
    [0, 1].forEach((side) => {
      c.save(); c.translate(side ? gap / 2 : -gap / 2, 0); c.rotate((side ? 1 : -1) * (1 - fix) * .07);
      c.beginPath(); if (side === 0) { c.moveTo(0, 0); zig.forEach(([x, y]) => c.lineTo(x * pw, y * ph)); c.lineTo(0, ph); } else { c.moveTo(pw, 0); zig.forEach(([x, y]) => c.lineTo(x * pw, y * ph)); c.lineTo(pw, ph); }
      c.closePath(); c.shadowColor = 'rgba(0,0,0,.25)'; c.shadowBlur = 5; c.shadowOffsetY = 2; c.fillStyle = '#fffdf4'; c.fill(); c.shadowColor = 'transparent';
      c.clip(); art(c, pw, ph); c.restore();
    });
    if (fix > 0) { c.save(); c.globalAlpha = fix; c.translate(pw / 2, ph / 2); c.rotate(.2); rrect(c, -9, -24, 18, 48, 2); c.fillStyle = 'rgba(255,240,170,.8)'; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(190,150,60,.8)'; c.stroke(); c.restore(); }
    c.restore();
    if (sw) {
      const u = clamp01(el / .5), bx = 108, by = 218;
      c.save(); ell(c, bx, by, 18 * back(u), 18 * back(u), '#fff', '#c9b27c', 1.5); c.restore();
      emoji(c, T[lang].words.bubble[sw.pick], bx, by + 1, 22 * back(u));
      if (ok && fix > .5) [0, 1, 2].forEach((j) => { const e = clamp01((el - 1.2 - j * .15) / 1); heart(c, 186 + j * 22, 190 - e * 30, 16 * (1 - Math.pow(e, 3))); });
    }
  } else {
    const fix = ok ? ease((el - .5) / .7) : 0;
    // ice-cream cart
    ell(c, 276, 262, 60, 8, 'rgba(60,40,20,.22)');
    rrect(c, 236, 196, 80, 58, 7); c.fillStyle = lg(c, 236, 196, 316, 254, [[0, '#fff4f7'], [1, '#f7c9d4']]); c.fill(); c.lineWidth = 1.6; c.strokeStyle = '#c98a9a'; c.stroke();
    for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(232 + i * 18, 174); c.lineTo(250 + i * 18, 174); c.lineTo(250 + i * 18, 192); c.arc(241 + i * 18, 192, 9, 0, Math.PI); c.lineTo(232 + i * 18, 174); c.fillStyle = i % 2 ? '#ffffff' : '#e8605a'; c.fill(); }
    rrect(c, 228, 168, 96, 8, 3); c.fillStyle = '#c9473f'; c.fill();
    ell(c, 244, 262, 9, 9, '#4a4452', '#2a2430', 1.5); ell(c, 310, 262, 9, 9, '#4a4452', '#2a2430', 1.5);
    emoji(c, '🍦', 276, 222, 26);
    // Mia
    const mia = { x: 140, y: 290, s: 1.1, col: '#8f7fd0', skin: '#f0c29a', hair: '#8a4b25', hs: 'pony' };
    const mood = !sw ? 'sad' : ok ? 'happy' : 'cry';
    person(c, mia, { x: mia.x, y: mia.y, t, i: 5, mood: mood === 'cry' ? 'sad' : mood, arms: ok && fix > .6 ? ['down', 'hold'] : ['down', 'down'], bob: Math.sin(t * 2) * .8 });
    // the dropped ice cream
    const fall = sw ? 1 : clamp01(((t * .5) % 3) / .6);
    if (!ok || fix < .2) {
      ell(c, 196, 314, 20, 6, 'rgba(255,170,190,.9)', '#e38aa3', 1.2);
      c.beginPath(); c.moveTo(184, 306); c.lineTo(206, 304); c.lineTo(194, 330); c.closePath(); c.fillStyle = '#e0a860'; c.fill(); c.lineWidth = 1; c.strokeStyle = '#a8731b'; c.stroke();
      ell(c, 190, 306, 8, 6, '#ff9fc2', '#d9658f', 1); ell(c, 202, 309, 6, 5, '#ffe29a', '#d9a53a', 1);
    }
    if (ok && fix > .2) { const q = ease((fix - .2) / .8); emoji(c, '🍦', lerp(200, 164, q), lerp(318, 236, q) - Math.sin(Math.PI * q) * 12, 28); }
    if (!sw) { ell(c, 140, 214, 16, 14, '#fff', '#c9b27c', 1.5); emoji(c, '💭', 140, 214, 20); }
    else {
      const u = clamp01(el / .5);
      ell(c, 140, 214, 18 * back(u), 16 * back(u), '#fff', '#c9b27c', 1.5);
      emoji(c, ok ? '💛' : '💭', 140, 215, 22 * back(u));
      if (ok && fix > .6) [0, 1, 2].forEach((j) => { const e = clamp01((el - 1.3 - j * .15) / 1); heart(c, 120 + j * 20, 190 - e * 30, 16 * (1 - Math.pow(e, 3))); });
    }
  }
}

// --- controls ----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const gotoView = (v) => document.querySelector(`#views [data-view="${v}"]`)?.click();

$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view === 'spread') return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - geo.ox) / geo.sc, y = (ev.clientY - r.top - geo.oy) / geo.sc, t = now();
  let best = -1, bd = 1e9;
  K.forEach((k, i) => { const ps = posOf(i, t), d = Math.hypot(x - ps.x, y - (ps.y - 30 * k.s)); if (d < bd) { bd = d; best = i; } });
  if (best < 0 || bd > 32) return;
  if (lab.view === 'spot') {
    S.mag = { i: best, t0: t }; S.last = best;
    if (best < 4 && !S.found.includes(best)) { S.found.push(best); sfx.good(); } else sfx.click();
    if (best < 4 && S.pick === null) S.pick = best;
    render(); showStage();
  } else if (lab.view === 'help' && best < 4 && S.found.includes(best) && !S.act) { S.pick = best; sfx.click(); render(); }
});

function choose(opt) {
  const k = S.pick; if (k === null || S.act || S.res[k]) return;
  S.res[k] = { pick: opt };
  S.act = { k, seq: opt === P[k].ok ? [opt] : [opt, P[k].ok], t0: now() };
  (opt === P[k].ok ? sfx.good : sfx.bad)(); render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'pick') { if (S.act) return; S.pick = i; sfx.click(); }
  else if (a === 'opt') { if (S.sec) return secChoose(i); choose(i); return; }
  else if (a === 'next') { const nx = S.found.find((k) => !S.done[k] && k !== S.pick); if (nx !== undefined) S.pick = nx; sfx.click(); }
  else if (a === 'goSpot') { gotoView('spot'); return; }
  else if (a === 'goHelp') { gotoView('help'); return; }
  else if (a === 'guess') { S.guess = i; S.played = false; sfx.tick(); }
  else if (a === 'play') { if (S.guess === null) return; S.played = true; S.play0 = now(); (S.guess === litOf(S.n) ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  else if (a === 'again') { S.play0 = now(); sfx.click(); render(); return; }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null; else { S.sec = k; S.sw = null; }
    sfx.click(); render(); showStage(); return;
  } else if (a === 'retry') { S.sw = null; sfx.click(); }
  render();
});
$('kdRange').addEventListener('input', (ev) => { S.n = +ev.target.value; S.guess = null; S.played = false; render(); });
function secChoose(i) {
  if (S.sw) return;
  const d = T[lang][S.sec], ok = d.ok;
  S.sw = { pick: i, ok }; S.swT0 = now(); (i === ok ? sfx.good : sfx.bad)(); render(); showStage();
}

// --- one render per change ---------------------------------------------------------------------------------------
const optBtn = (e, txt, cls, dis, i) => `<button class="kd-opt ${cls}" data-act="opt" data-i="${i}"${dis ? ' disabled' : ''}><span class="e">${e}</span><span>${esc(txt)}</span></button>`;
function render() {
  const t = T[lang], v = lab.view;
  lab.setGlow('rgba(255, 200, 90, .3)');
  $('kdSlide').style.display = v === 'spread' && !S.sec ? '' : 'none';
  $('kdRange').setAttribute('aria-label', t.spread.slide);
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('kdSec').innerHTML = sc('words', '💬') + sc('self', '🍦');
  lab.setFacts(t.facts[v]);
  if (S.sec) return renderSecret(t);
  if (v === 'spot') renderSpot(t); else if (v === 'help') renderHelp(t); else renderSpread(t);
}
function renderSpot(t) {
  const s = t.spot, n = S.found.length, all = n === 4;
  $('kdQ').textContent = s.q; $('kdBody').innerHTML = all ? `<div class="kd-go"><button class="btn" data-act="goHelp">${esc(s.go)}</button></div>` : '';
  lab.setReadout(n, s.sub, all ? s.allPill : '', '#f2b84b');
  const l = S.last;
  if (l === null) lab.setState({ emo: '🔍', title: s.t0[0], lead: s.t0[1], body: '' });
  else if (l < 4) lab.setState({ emo: t.p[l].icon, title: t.p[l].clue, lead: all ? s.all[1] : s.hit, body: '' });
  else lab.setState({ emo: '🙂', title: s.ok[0], lead: s.ok[1], body: all ? s.all[1] : '' });
}
function renderHelp(t) {
  const h = t.help, found = S.found, doneN = S.done.filter(Boolean).length, all = found.length > 0 && doneN === found.length && found.length === 4;
  if (!found.length) {
    $('kdQ').textContent = h.q; $('kdBody').innerHTML = `<div class="kd-go" style="margin-top:0"><button class="btn" data-act="goSpot">${esc(h.goSpot)}</button></div>`;
    lab.setReadout(0, h.sub, '', '#f2b84b'); lab.setState({ emo: '🔍', title: h.none[0], lead: h.none[1], body: '' }); return;
  }
  if (S.pick === null || !found.includes(S.pick)) S.pick = found.find((k) => !S.done[k]) ?? found[0];
  const k = S.pick, res = S.res[k], pk = t.p[k], busy = !!S.act;
  $('kdQ').textContent = h.q;
  const who = found.map((i) => `<button class="chip ${S.pick === i ? 'on' : ''} ${S.done[i] ? 'done' : ''}" data-act="pick" data-i="${i}" aria-label="${esc(t.p[i].n)}">${t.p[i].icon} ${esc(t.p[i].n)}${S.done[i] ? ' ✓' : ''}</button>`).join('');
  const opts = pk.opts.map((o, i) => {
    const cls = res ? (i === P[k].ok ? 'good' : i === res.pick ? 'bad' : '') : '';
    return optBtn(P[k].em[i], o, cls, !!res || busy, i);
  }).join('');
  const nx = found.find((i) => !S.done[i] && i !== S.pick);
  $('kdBody').innerHTML = `<div class="kd-who">${who}</div><div class="kd-opts">${opts}</div>${res && S.done[k] && nx !== undefined ? `<div class="kd-go"><button class="btn" data-act="next">${esc(h.next)}</button></div>` : ''}`;
  lab.setReadout(doneN, h.sub, all ? h.allPill : '', '#f2b84b');
  if (all && !busy) lab.setState({ emo: '🎉', title: h.all[0], lead: h.all[1], body: '' });
  else if (!res) lab.setState({ emo: '🤝', title: h.t0[0], lead: h.t0[1], body: '' });
  else if (res.pick === P[k].ok) lab.setState({ emo: '✅', title: t.right, lead: pk.fb[res.pick], body: '' });
  else lab.setState({ emo: '🙂', title: h.no, lead: pk.fb[res.pick], body: '✓ ' + pk.fb[P[k].ok] });
}
function renderSpread(t) {
  const s = t.spread, n = S.n, lit = litOf(n);
  $('kdSlideT').textContent = s.slide; $('kdSlideV').textContent = n; $('kdRange').value = n;
  if (n === 0) {
    $('kdQ').textContent = ''; $('kdBody').innerHTML = '';
    lab.setReadout(0, s.sub, '', '#f2b84b'); lab.setState({ emo: '🌱', title: s.n0[0], lead: s.n0[1], body: '' }); return;
  }
  $('kdQ').textContent = s.q;
  const nums = [1, 2, 3, 4, 5, 6, 7, 8].map((k) => {
    const cls = S.played ? (k === lit ? 'good' : k === S.guess ? 'bad' : '') : (S.guess === k ? 'on' : '');
    return `<button class="chip ${cls}" data-act="guess" data-i="${k}">${k}</button>`;
  }).join('');
  $('kdBody').innerHTML = `<div class="kd-nums">${nums}</div><div class="kd-go" style="margin-top:0"><button class="btn" data-act="${S.played ? 'again' : 'play'}"${!S.played && S.guess === null ? ' disabled' : ''}>${esc(S.played ? s.again : s.play)}</button></div>`;
  if (!S.played) { lab.setReadout('?', s.sub, '', '#f2b84b'); lab.setState({ emo: '✨', title: s.pre[0], lead: s.pre[1], body: s.preBody }); return; }
  const ok = S.guess === lit;
  lab.setReadout(lit, s.sub, ok ? t.right : s.miss(S.guess, lit), '#f2b84b');
  lab.setState({ emo: ok ? '✅' : '✨', title: s.title(lit), lead: ok ? t.right : s.miss(S.guess, lit), body: s.body });
}
function renderSecret(t) {
  const k = S.sec, d = t[k], sw = S.sw;
  $('kdQ').textContent = d.q;
  const em = k === 'words' ? ['🗨️', '💛', '🗨️'] : ['💛', '😞', '🙈'];
  const opts = d.opts.map((o, i) => optBtn(em[i], o, sw ? (i === d.ok ? 'good' : i === sw.pick ? 'bad' : '') : '', !!sw, i)).join('');
  $('kdBody').innerHTML = `<div class="kd-opts">${opts}</div>${sw ? `<div class="kd-go"><button class="btn" data-act="retry">${esc(d.again)}</button></div>` : ''}`;
  lab.setReadout(k === 'words' ? '💬' : '🍦', d.title, sw ? (sw.pick === d.ok ? t.right : '') : '', '#f2b84b');
  if (!sw) lab.setState({ emo: k === 'words' ? '💬' : '🍦', title: d.title, lead: d.q, body: '' });
  else lab.setState({ emo: sw.pick === d.ok ? '✅' : '🙂', title: sw.pick === d.ok ? t.right : t.help.no, lead: d.fb[sw.pick], body: sw.pick === d.ok ? '' : '✓ ' + d.fb[d.ok] });
}
render();
</script>
