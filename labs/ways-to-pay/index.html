  c.beginPath(); c.roundRect(16, 14, 312, 320, 18); c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.5; c.stroke();
  c.beginPath(); c.roundRect(26, 24, 292, 80, 12); c.fillStyle = '#0b2a29'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#2f6f6a'; c.stroke();
  const done = K.pin.length >= 4;
  c.font = '800 13px Nunito, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = '#7ef0d0'; c.fillText('PIN', 40, 42);
  for (let k = 0; k < 4; k++) {

  if (!covered) { c.beginPath(); c.roundRect(KEYBOX.x - 3, KEYBOX.y - 3, KEYBOX.w + 6, KEYBOX.h + 6, 16); c.lineWidth = 3; c.strokeStyle = `rgba(255,214,102,${0.35 + 0.25 * Math.sin(clk * 4)})`; c.stroke(); }
  for (const k of KEYS) {

    const base = k.l === '✕' ? ['#f3b3b3', '#c97b7b'] : k.l === '✓' ? ['#b5ecc3', '#6fbf88'] : ['#e8edf5', '#a3adbf'];

  }

  c.beginPath(); c.roundRect(236, 150, 78, 20, 6); c.fillStyle = '#2a303c'; c.fill();

  c.save(); c.setLineDash([7, 6]); c.lineWidth = 2.5; c.strokeStyle = 'rgba(255,214,102,.85)'; c.beginPath(); c.moveTo(eye[0], eye[1]); c.lineTo(end[0], end[1]); c.stroke(); c.restore();
  // thought bubble
  c.beginPath(); c.roundRect(240, 184, 98, 56, 18); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#8c93ad'; c.stroke();
  c.beginPath(); c.arc(284, 250, 5, 0, TAU); c.fillStyle = '#fff'; c.fill(); c.stroke();
  c.beginPath(); c.arc(280, 261, 3.5, 0, TAU); c.fill(); c.stroke();
  c.font = '900 22px Nunito, sans-serif'; c.fillStyle = '#1d2240'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText([0, 1, 2, 3].map((i) => (covered ? '?' : K.pin[i] ?? '_')).join(' '), 289, 213);
  // the stranger, peeking over the shoulder
  const hx = 292, hy = 308, hr = 38;
  g = c.createRadialGradient(hx - 12, hy - 14, 6, hx, hy, hr + 6); g.addColorStop(0, '#f8d9b4'); g.addColorStop(1, '#dca072');
  c.fillStyle = g; c.lineWidth = 2; c.strokeStyle = '#7a4b2b';
  c.beginPath(); c.arc(hx - hr + 2, hy + 2, 8, 0, TAU); c.fill(); c.stroke();
  c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill(); c.stroke();
  c.beginPath(); c.arc(hx, hy - 3, hr + 2, Math.PI * 1.05, Math.PI * 1.95); c.closePath(); c.fillStyle = '#6d4fa0'; c.fill(); c.stroke();
  c.beginPath(); c.roundRect(hx - hr - 3, hy - 22, hr * 2 + 6, 13, 6.5); c.fillStyle = '#8a68c4'; c.fill(); c.stroke();
  c.beginPath(); c.arc(hx, hy - hr - 6, 6, 0, TAU); c.fillStyle = '#8a68c4'; c.fill(); c.stroke();
  const look = covered ? [-2, -4] : [-4, 3];
  for (const ex of [hx - 20, hx + 4]) {
    c.beginPath(); c.ellipse(ex, hy - 2, 10, 11.5, 0, 0, TAU); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#5a3a22'; c.stroke();
    c.beginPath(); c.arc(ex + look[0], hy - 2 + look[1], 5.5, 0, TAU); c.fillStyle = '#1d2240'; c.fill();
    c.beginPath(); c.arc(ex + look[0] - 1.8, hy - 2 + look[1] - 2, 1.9, 0, TAU); c.fillStyle = '#fff'; c.fill();
  }
  c.lineWidth = 2.5; c.strokeStyle = '#5a3a22'; c.beginPath();
  if (covered) { c.moveTo(hx - 30, hy - 17); c.lineTo(hx - 12, hy - 20); c.moveTo(hx - 6, hy - 20); c.lineTo(hx + 12, hy - 15); }
  else { c.moveTo(hx - 30, hy - 18); c.quadraticCurveTo(hx - 20, hy - 24, hx - 10, hy - 17); c.moveTo(hx - 6, hy - 17); c.quadraticCurveTo(hx + 4, hy - 22, hx + 12, hy - 17); }
  c.stroke();
  c.beginPath(); c.ellipse(hx - 8, hy + 8, 4, 3, 0, 0, TAU); c.fillStyle = '#c98a5e'; c.fill();
  c.beginPath(); c.arc(hx - 28, hy + 10, 5, 0, TAU); c.arc(hx + 14, hy + 10, 5, 0, TAU); c.fillStyle = 'rgba(240,120,120,.35)'; c.fill();
  c.lineWidth = 2.2; c.strokeStyle = '#5a3a22'; c.beginPath();

  // the child's shoulder

  g = c.createLinearGradient(0, 344, 0, H); g.addColorStop(0, '#4a96d8'); g.addColorStop(1, '#2f6aa8'); c.fillStyle = g; c.fill(); c.lineWidth = 2; c.strokeStyle = '#1e4670'; c.stroke();
  // the covering hand rises from the shoulder
  if (K.coverE > 0.01) {
    const e = ease.back(clamp(K.coverE, 0, 1)); c.save(); c.translate(225, 345); c.scale(e, e); c.translate(-225, -345);
    g = c.createLinearGradient(207, 0, 243, 0); g.addColorStop(0, '#4a96d8'); g.addColorStop(1, '#2f6aa8');
    c.beginPath(); c.roundRect(207, 250, 36, 98, 8); c.fillStyle = g; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#1e4670'; c.stroke();
    c.save(); c.translate(225, 222); palm(c); c.restore(); c.restore();
    if (e > 0.9) { c.beginPath(); c.arc(end[0], end[1], 10, 0, TAU); c.fillStyle = '#e5484d'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#fff'; c.stroke(); c.font = '900 13px Nunito, sans-serif'; c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('✕', end[0], end[1] + 1); }
  }

  const press = K.keyAt && clk - K.keyAt.t < 0.55, kk = press ? KEYS[K.keyAt.i] : null, tx = kk ? kk.x + kk.w / 2 : 70, ty = kk ? kk.y + kk.h / 2 : 326;
  K.hx += (tx - K.hx) * Math.min(1, dt * 14); K.hy += (ty - K.hy) * Math.min(1, dt * 14);

}

// --- loop and input --------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt) => {
  S.clock += dt; runFx();
  const v = lab.view; H = HV[v];
  const s = Math.min(w / W, h / H, 1.8); G.s = s; G.ox = (w - W * s) / 2; G.oy = (h - H * s) / 2;
  c.save(); c.translate(G.ox, G.oy); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  c.beginPath(); c.rect(0, 0, W, H); c.clip();
  if (v === 'pay') drawPay(c, dt); else if (v === 'month') drawMonth(c, dt); else drawSafe(c, dt);
  drawCoins(c);
  c.restore();
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.s, y = (ev.clientY - r.top - G.oy) / G.s, v = lab.view;
  if (v === 'month') { const it = MI.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + MH); if (it) buy(it); }
  else if (v === 'safe') { const k = KEYS.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h); if (k) pressKey(k); }
});
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'item') { S.item = b.dataset.id; sfx.tick(); }
  else if (a === 'meth') { S.method = b.dataset.m; sfx.tick(); }
  else if (a === 'pay') startPay();
  else if (a === 'opt') answerPred(+b.dataset.i);
  else if (a === 'again') again();
  else if (a === 'secA') secA();
  else if (a === 'guess') { M.guess = +$('moGuess').value; M.guessed = true; sfx.click(); }
  else if (a === 'secB') {
    if (!secret.unlocked()) return secret.open();
    M.guessed = true; M.credit = !M.credit; sfx.click();
  } else if (a === 'cover') { K.cover = !K.cover; sfx.click(); }
  else if (a === 'sit') pickSit(+b.dataset.v);
  else if (a === 'snext') { K.i++; K.picked = null; sfx.tick(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => { if (ev.target.id === 'moGuess') $('moGv').textContent = ev.target.value; });

// --- one render per change: controls, readout and the state card ---------------------------------------------------
function render() {
  const v = lab.view;
  document.body.dataset.v = v;
  for (const k of ['pay', 'month', 'safe']) $('v_' + k).style.display = k === v ? 'block' : 'none';
  const t = T[lang];
  if (v === 'pay') renderPay(t); else if (v === 'month') renderMonth(t); else renderSafe(t);
  lab.setFacts(t.facts[v]);
}
function renderPay(t) {
  const it = itemOf(), pr = S.pred;
  lab.setGlow('rgba(255, 209, 102, .22)');
  $('payAsk').style.display = pr ? 'block' : 'none'; $('payUi').style.display = pr ? 'none' : 'block';
  if (pr) {
    $('payQ').textContent = t.qCard(pr.p);
    const opts = t.optsCard(pr.p);
    $('payOpts').innerHTML = pr.perm.map((j) => `<button data-act="opt" data-i="${j}">${esc(opts[j])}</button>`).join('');
  }
  $('payItems').innerHTML = ITEMS.map((i) => `<button class="chip wp-c ${i.id === S.item ? 'on' : ''}" data-act="item" data-id="${i.id}">${i.e} ${esc(t.items[i.id])} ${i.p} 🪙</button>`).join('');
  $('payMeth').innerHTML = METHODS.map((m) => `<button class="chip wp-c ${m.id === S.method ? 'on' : ''}" data-act="meth" data-m="${m.id}">${m.e} ${esc(t.methods[m.id])}</button>`).join('');
  $('payGo').textContent = t.pay; $('payGo').disabled = S.busy;
  $('payAgain').textContent = t.startAgain;
  const open = secret.unlocked(), sb = $('secA');
  sb.className = `chip wp-c secret ${open ? 'open' : ''} ${S.follow ? 'on' : ''}`; sb.textContent = open ? `🔁 ${t.secrets.a[0]}` : '🔒 ???';
  const d = S.d;
  if (pr) lab.setReadout('?', t.inMyBank, '', '#e0a526');
  else lab.setReadout(`${d.my} 🪙`, `${t.inMyBank} · ${t.wallet}: ${d.wallet} 🪙`, '', '#e0a526');
  let st;
  if (pr) st = { emo: '🤔', title: t.qCard(pr.p), lead: '', body: '' };
  else if (S.follow) st = { emo: '🔁', title: t.secrets.a[0], lead: t.secrets.a[1], body: '' };
  else if (S.last) st = { emo: '🚫', title: t[S.last], lead: '', body: '' };
  else if (S.verdict) st = { emo: S.verdict.ok ? '✅' : '🤔', title: S.verdict.ok ? t.right : t.notQuite, lead: t.cardWhy(S.verdict.n), body: '' };
  else if (!S.predicted) st = { emo: it.e, title: `${t.items[it.id]} · ${it.p} 🪙`, lead: '', body: '' };
  else st = { ...t.state.pay };
  lab.setState({ ...st, extra: '' });
}
function renderMonth(t) {
  const m = M, guessing = !m.guessed;
  lab.setGlow('rgba(94, 200, 242, .22)');
  $('moGuessBox').style.display = guessing ? 'block' : 'none';
  $('moQ').textContent = t.qMonth; $('moGo').textContent = t.myGuess; $('moAgain').textContent = t.startAgain;
  $('moVs').textContent = m.vs ? t.guessVs(m.vs.g, m.vs.r) : '';
  const open = secret.unlocked(), sb = $('secB');
  sb.className = `chip wp-c secret ${open ? 'open' : ''} ${m.credit ? 'on' : ''}`; sb.textContent = open ? `🧾 ${t.credit}` : '🔒 ???';
  lab.setReadout(`${m.d} 🪙`, t.left(m.day), '', '#5ec8f2');
  const left = 30 - m.day, broke = m.jar < 2 && !m.credit;
  let st = { ...t.state.month };
  if (guessing) st = { emo: '🤔', title: t.qMonth, lead: '', body: '' };
  else if (m.credit && m.due) st = { emo: '🧾', title: t.secrets.b[0], lead: t.payBack(m.owe, m.due), body: '' };
  else if (m.credit && m.owe > 0) st = { emo: '🧾', title: t.secrets.b[0], lead: t.secrets.b[1], body: '' };
  else if (m.last === 'declined') st = { emo: '🚫', title: t.declined, lead: broke && left > 0 ? t.emptyDays(left) : t.state.month.lead, body: '' };
  else if (broke && left > 0) st = { emo: '📅', title: t.state.month.title, lead: t.emptyDays(left), body: t.state.month.body };
  lab.setState({ ...st, extra: '' });
}
function renderSafe(t) {
  const n = t.situations.length;
  lab.setGlow('rgba(167, 139, 250, .22)');
  $('saCover').className = `chip wp-c ${K.cover ? 'on' : ''}`; $('saCover').textContent = `✋ ${t.cover}`; $('saAgain').textContent = t.startAgain;
  const box = $('saSit'); let st;
  if (K.i >= n) {
    box.innerHTML = `<div class="wp-sum">${K.right} / ${n} ${esc(t.situationsWord)}</div>`;
    st = { ...t.state.safe };
  } else {
    const s = t.situations[K.i], pk = K.picked, ok = pk !== null && (pk === 1) === s.ok;
    const cls = (v) => (pk === null ? '' : (v === 1) === s.ok ? 'ok' : v === pk ? 'bad' : '');
    box.innerHTML = `<div class="wp-dots">${t.situations.map((_, i) => (i < K.i ? '●' : i === K.i ? '◉' : '○')).join(' ')}</div>
      <div class="wp-stxt">${esc(s.t)}</div>
      <div class="wp-sb"><button class="${cls(1)}" data-act="sit" data-v="1"${pk !== null ? ' disabled' : ''}>${esc(t.safeBtn)}</button><button class="${cls(0)}" data-act="sit" data-v="0"${pk !== null ? ' disabled' : ''}>${esc(t.notSafe)}</button></div>
      <div class="wp-why">${pk !== null ? `<b>${esc(ok ? t.right : t.notQuite)}</b> ${esc(s.why)}` : ''}</div>
      ${pk !== null ? '<button class="btn wp-next" data-act="snext" aria-label="→">→</button>' : ''}`;
    st = pk === null ? { emo: '🤔', title: s.t, lead: '', body: '' } : { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notQuite, lead: s.why, body: '' };
  }
  lab.setReadout(`${K.right} / ${n}`, t.situationsWord, '', '#a78bfa');
  lab.setState({ ...st, extra: '' });
}
render();
