// --- the model (all made-up units: a shade from 0 = palest to 1 = darkest) -----------------------------------
const N = 30;            // insects in every generation

const rnd = Math.random;

const mean = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
const nf = (x) => new Intl.NumberFormat(lang).format(x);
const pct = (x) => nf(Math.round(x * 100));

// colours: a moth's shade maps to a warm grey; a hoverfly's wasp-likeness to brown → wasp yellow
const mothRGB = (v) => { const L = 236 - 210 * v; return [L, L * 0.975, L * 0.93]; };

const rgb = ([r, g, b], a = 1) => `rgba(${r | 0},${g | 0},${b | 0},${a})`;
const toneOfL = (L) => clamp((236 - L) / 210, 0, 1);

// --- bark: painted once per size from a seeded random source, then sampled for the bird's contrast -----------
function blob(c, x, y, s, r, col) {

// the random features are always laid out over the same big virtual sheet (VW × VH), so a canvas of any size

const VW = 2400, VH = 1400;

  }
}
// average luminance of an image, read as a shade on the moth scale
function avgTone(img, W, H, step = 4) {

// the overall shade of each bark, measured on a reference patch
const TONE = {};
for (const k of ['birch', 'soot']) {

  const c = cv.getContext('2d', { willReadFrequently: true }); paintBark(c, 800, k);

}
const barks = {};
function getBark(kind, w, h) {

  if (barks[kind]?.key === key) return barks[kind];
  const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w * d)); cv.height = Math.max(1, Math.round(h * d));
  const c = cv.getContext('2d', { willReadFrequently: true }); c.setTransform(d, 0, 0, d, 0, 0);

}
// the shade of the bark right under an insect: what the bird compares it with
function localTone(bk, b, R) {
  let s = 0, n = 0;
  for (let i = -2; i <= 2; i++) for (let j = -1; j <= 1; j++) {
    const x = Math.round((b.x * bk.w + i * R * 0.4) * bk.d), y = Math.round((b.y * bk.h + j * R * 0.3) * bk.d);

}

// --- insects -------------------------------------------------------------------------------------------------
// v is fixed for life: only the young get new values
function bug(v, kind = 'bug') {
  const specks = Array.from({ length: 8 }, () => ({ u: (rnd() < 0.5 ? -1 : 1) * lerp(0.2, 0.85, rnd()), w: lerp(-0.22, 0.32, rnd()), r: lerp(0.06, 0.14, rnd()), d: rnd() < 0.75 ? -lerp(35, 90, rnd()) : lerp(15, 35, rnd()) }));

const bugR = (w, h) => clamp(Math.min(w, h) * 0.045, 10, 17);
function place(list, others = []) {
  const w = S.w || 600, h = S.h || 400, minD = bugR(w, h) * 2.6, placed = [...others];
  for (const b of list) {
    let best = null, bestD = -1;
    for (let k = 0; k < 60; k++) {
      const x = lerp(0.06, 0.94, rnd()), y = lerp(0.16, 0.94, rnd());
      let dmin = Infinity;
      for (const o of placed) dmin = Math.min(dmin, Math.hypot((o.x - x) * w, (o.y - y) * h));
      if (dmin > bestD) { bestD = dmin; best = [x, y]; }

  if (S.mode === 'mimic') {
    S.pop = Array.from({ length: N }, () => bug(clamp(0.22 + gauss() * 0.14, 0, 1)));
    S.wasps = Array.from({ length: 4 }, () => bug(1, 'wasp'));
  } else {
    // mostly pale moths that suit the birch bark, and three dark ones that were simply born that way
    S.pop = [...Array.from({ length: N - 3 }, () => bug(clamp(0.13 + gauss() * 0.08, 0, 1))), ...[0.8, 0.86, 0.9].map((v) => bug(v))];
    S.wasps = [];
  }
  place([...S.wasps, ...S.pop]);
  Object.assign(S, { hist: [], gen: 1, phase: 'idle', runLeft: 0, kids: null, bird: null, learned: false, since: 0, switched: null, nbSince: 0, puffs: [], flash: null });
  S.hist.push(record());
}

const lab = shell({ key: 'selection', T, topics: TOPICS, views: [], onLang: render });
const secret = secretLab('selection', () => ({
  secrets: [['mimic', '🐝'], ['nobird', '🚫']].map(([k, e]) => ({ emo: e, title: T[lang].secrets[k][0], desc: T[lang].secrets[k][1] })),
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div class="acts"><button class="btn" id="bHunt"></button><button class="chip" id="bAuto"></button><button class="chip" id="bFive"></button><button class="chip" id="bReset"></button></div>

  <canvas id="chart" aria-hidden="true"></canvas>`;

// --- the rounds ----------------------------------------------------------------------------------------------
const flash = (text) => { S.flash = { text, t: 1.8 }; };
const interval = () => (S.nobird ? (S.fast ? 0.07 : 0.16) : S.fast ? 0.15 : 0.42);
const breedDur = () => (S.fast ? 0.75 : 1.7);
function puff(b, kind) {
  const col = b.kind === 'wasp' ? [242, 194, 48] : S.mode === 'mimic' ? flyRGB(b.v) : mothRGB(b.v);
  S.puffs.push({ x: b.x, y: b.y, t: 0, col, kind });
}
function startHunt() {
  Object.assign(S, { phase: 'hunt', timeLeft: HUNT_TIME, caught: 0, eaten: [], fast: false, runLeft: 0 });
  sfx.click(); render();
}
function startAuto() {
  Object.assign(S, { phase: 'auto', caught: 0, eaten: [], bird: null });
  render();
}
function eat(b) { b.gone = true; S.eaten.push(b); S.caught++; puff(b, S.nobird ? 'fade' : 'eat'); }
function birdPos(B) {
  const p = smooth(B.t / B.dur), R = bugR(S.w, S.h);
  return { x: lerp(B.x0, B.x1, p), y: lerp(B.y0, B.y1, p) - Math.sin(p * Math.PI) * R * 2.5 };
}
function pickTarget() {
  const alive = S.pop.filter((b) => !b.gone);
  const best = (list, score) => { let m = null, ms = -Infinity; for (const b of list) { const s = score(b); if (s > ms) { ms = s; m = b; } } return m; };
  if (S.nobird) return alive[(rnd() * alive.length) | 0];
  if (S.mode === 'mimic') {
    // a young bird goes for whatever is most eye-catching; after one sting it avoids anything wasp-like
    if (!S.learned) return best([...alive, ...S.wasps], (b) => b.v + gauss() * 0.3);
    return best(alive, (b) => -(b.v + gauss() * 0.12));
  }
  // the auto bird: biggest contrast between the moth and the bark under it, plus a little imperfect eyesight
  const bk = getBark(S.bark, S.w, S.h), R = bugR(S.w, S.h);
  return best(alive, (b) => Math.abs(b.v - localTone(bk, b, R)) + gauss() * 0.07);
}
function nextTarget() {
  const tg = pickTarget(), from = S.bird ? birdPos(S.bird) : { x: S.w + 40, y: -40 };
  S.bird = { x0: from.x, y0: from.y, x1: tg.x * S.w, y1: tg.y * S.h, t: 0, dur: interval(), target: tg };
}
function act(b) {
  if (b.kind === 'wasp') { S.learned = true; b.shake = 0.6; puff(b, 'sting'); flash(T[lang].learn); sfx.bad(); render(); return; }
  eat(b); if (!S.fast) sfx.snap();
  if (S.caught >= AUTO_EAT) {
    const p = birdPos(S.bird);
    endRound(null);
    S.bird = S.nobird ? null : { x0: p.x, y0: p.y, x1: S.w + 60, y1: -60, t: 0, dur: 0.6, leaving: true };
  }
}
function endRound(msg) {
  const cur = S.hist[S.hist.length - 1], kept = S.pop.filter((b) => !b.gone);
  Object.assign(cur, { lost: S.eaten.map((b) => b.v), kept: kept.map((b) => b.v), nobird: S.nobird, env: S.mode === 'mimic' ? 'mimic' : S.bark, tone: envTone() });
  // survivors have the young: each young one gets its parent's value plus a small random difference
  const parents = (kept.length ? kept : S.pop).slice().sort(() => rnd() - 0.5);
  S.kids = Array.from({ length: N }, (_, i) => {
    const p = parents[i % parents.length], k = bug(rnd() < JUMP ? rnd() : clamp(p.v + gauss() * MUT, 0, 1), 'bug');
    k.parent = p; return k;
  });
  place(S.kids, S.wasps);
  S.phase = 'breed'; S.bt = 0; S.bird = null;
  if (msg) flash(T[lang][msg]);

}
function finalize() {
  S.pop = S.kids; S.kids = null; S.gen++; S.since++;
  if (S.nobird) S.nbSince++;
  S.hist.push(record()); if (S.hist.length > 300) S.hist.shift();
  if (S.runLeft > 0) S.runLeft--;
  if (S.runLeft > 0) startAuto(); else { S.phase = 'idle'; S.bird = null; sfx.good(); render(); }
}
function update(dt) {
  S.mix += clamp((S.bark === 'soot' ? 1 : 0) - S.mix, -dt * 1.4, dt * 1.4);
  for (const p of S.puffs) p.t += dt;
  S.puffs = S.puffs.filter((p) => p.t < 0.7);
  if (S.flash && (S.flash.t -= dt) <= 0) S.flash = null;
  for (const b of S.wasps) b.shake = Math.max(0, b.shake - dt);
  if (S.phase === 'hunt') {
    const before = Math.ceil(S.timeLeft);
    S.timeLeft -= dt;
    if (S.timeLeft <= 0) endRound('timeUp');
    else if (Math.ceil(S.timeLeft) !== before) { sfx.tick(); render(); }
  } else if (S.phase === 'auto') {
    if (!S.bird) nextTarget();
    S.bird.t += dt;
    if (S.bird.t >= S.bird.dur) { act(S.bird.target); if (S.phase === 'auto') nextTarget(); }
  } else if (S.phase === 'breed') {
    S.bt += dt;
    if (S.bird) S.bird.t += dt;
    if (S.bt >= breedDur()) finalize();
  }
}

// hand hunting: tap what you see
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.ask || S.nobird || (S.phase !== 'idle' && S.phase !== 'hunt')) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const R = bugR(S.w, S.h);
  let best = null, bd = Math.max(R * 1.5, 20);
  for (const b of [...S.pop.filter((q) => !q.gone), ...S.wasps]) { const d = Math.hypot(b.x * S.w - x, b.y * S.h - y); if (d < bd) { bd = d; best = b; } }
  if (!best) { S.puffs.push({ x: x / S.w, y: y / S.h, t: 0, kind: 'miss' }); return; }
  if (S.phase === 'idle') startHunt();
  if (best.kind === 'wasp') { S.timeLeft = Math.max(0.01, S.timeLeft - 3); best.shake = 0.6; puff(best, 'sting'); flash(T[lang].ouch); sfx.bad(); return; }
  eat(best); sfx.snap();

// --- words on the page ---------------------------------------------------------------------------------------
const ACCENT = { birch: '#7d9a5c', soot: '#e0662e', mimic: '#c98a06', nobird: '#6b7390' };
const GLOW = { birch: 'rgba(160,190,120,.22)', soot: 'rgba(255,122,61,.24)', mimic: 'rgba(242,194,48,.24)', nobird: 'rgba(130,145,190,.2)' };
function render() {
  const t = T[lang], mim = S.mode === 'mimic', busy = S.phase !== 'idle', open = secret.unlocked();
  const cur = S.hist[S.hist.length - 1], prev = S.hist.length > 1 ? S.hist[S.hist.length - 2] : null;
  const m = mean(cur.vals), tone = cur.tone;

  // buttons
  $('bHunt').textContent = S.nobird ? t.next : t.hunt; $('bHunt').disabled = busy || !!S.ask;
  $('bAuto').textContent = t.auto; $('bAuto').disabled = busy || !!S.ask; $('bAuto').style.display = S.nobird ? 'none' : '';
  $('bFive').textContent = S.runLeft > 1 ? t.stop : t.five; $('bFive').disabled = (busy && S.runLeft <= 1) || !!S.ask;
  $('bReset').textContent = t.reset;
  $('barkLbl').textContent = t.barkLbl;
  const sChip = (k) => `<button class="chip secret ${open ? 'open' : ''} ${(k === 'mimic' && mim) || (k === 'nobird' && S.nobird) ? 'on' : ''}" data-k="${k}" ${busy ? 'disabled' : ''}>${open ? `${k === 'mimic' ? '🐝' : '🚫'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('barks').innerHTML = [sChip('mimic'), ...['birch', 'soot'].map((k) => `<button class="chip ${S.bark === k ? 'on' : ''}" data-k="${k}" ${busy ? 'disabled' : ''}>${esc(t.barks[k])}</button>`), sChip('nobird')].join('');

  // readout, glow, gauge
  const envKey = S.nobird ? 'nobird' : mim ? 'mimic' : S.bark;
  lab.setReadout(esc(t.gen(S.gen)), t.sub(N, pct(m), mim), t.pills[envKey], ACCENT[envKey]);
  lab.setGlow(GLOW[envKey]);
  lab.setGauge(m, [{ f: 0, label: mim ? t.loM : t.lo }, { f: 1, label: mim ? t.hiM : t.hi }, ...(mim ? [] : [{ f: tone, label: `🌳 ${t.barkTick}` }])], t.gaugeCap);

  // state card: what just happened, and why
  const st = t.st;
  let s;
  const pack = (a, lead, body) => ({ emo: a[0], title: a[1], lead: lead ?? a[2], body: body ?? a[3] });
  const matching = cur.vals.filter((v) => Math.abs(v - tone) < 0.2).length;
  const adapted = !mim && !S.nobird && S.switched && S.since >= 3 && matching >= N * 0.7;
  const nudge = !mim && !S.nobird && !S.switched && S.since >= 1 && S.bark === 'birch' && matching >= N * 0.7;
  if (S.phase === 'hunt') s = pack(st.hunt, st.hunt[2](S.caught, Math.max(0, Math.ceil(S.timeLeft))), mim ? st.huntM : st.hunt[3]);
  else if (S.phase === 'breed' && !S.fast) s = pack(st.breed);
  else if (busy) s = S.nobird ? pack(st.chance) : mim ? pack(st.autoM, st.autoM[2](S.learned)) : pack(st.auto);
  else if (mim) s = pack(S.since === 0 ? st.mIntro : st.mRes);
  else if (S.nobird) s = pack(S.nbSince === 0 ? st.nbIntro : st.nbRes);
  else if (S.since === 0 && S.switched === 'soot') { const k = cur.vals.filter((v) => v > 0.6).length; s = pack(st.soot, st.soot[2](k), st.soot[3](k)); }

  else if (S.since === 0) s = pack(st.intro);
  else if (adapted) s = pack(st.adapted);
  else if (nudge) s = pack(st.nudge);
  else {
    const dl = prev?.lost?.length ? mean(prev.lost) - mean(prev.kept) : 0;
    const lead = Math.abs(dl) < 0.05 ? st.resSame : dl > 0 ? st.resDark : st.resPale;

  }
  let extra = '';
  if (!busy && prev?.lost?.length) {
    extra += `<div class="stats">${prev.nobird ? '🎲' : '🐦'} ${esc(prev.nobird ? t.lost : t.caught)}: <b>${pct(mean(prev.lost))}/100</b> · ${mim ? '🪰' : '🦋'} ${esc(t.surv)}: <b>${pct(mean(prev.kept))}/100</b><br>
      ${esc(mim ? t.avgM : t.avg)}: <b>${pct(mean(prev.vals))} → ${pct(m)}</b></div>`;
  }

  if (!mim && (S.bark === 'soot' || S.hist.some((h) => h.env === 'soot'))) extra += `<div class="story">${t.story}</div><div class="src">${esc(t.src)}</div>`;
  extra += `<div class="fine">${esc(mim ? t.fineM : t.fine)}</div>`;
  lab.setState({ ...s, extra });

  if (S.ask) {
    askEl.innerHTML = S.ask.answer === null
      ? `<div class="q">${esc(t.ask)}</div><div class="opts"><button data-a="each">${esc(t.a1)}</button><button data-a="pop">${esc(t.a2)}</button></div>`

         <p>${esc(S.ask.answer === 'pop' ? t.yesT : t.noT)}</p><div class="opts"><button>${esc(t.go)} →</button></div>`;

}

// --- drawing: insects ------------------------------------------------------------------------------------------
function drawMoth(c, b, R) {
  const [r, g, bl] = mothRGB(b.v), L = 236 - 210 * b.v;
  c.fillStyle = rgb([r, g, bl]);
  c.beginPath();
  c.moveTo(0, -R * 0.45);
  c.quadraticCurveTo(R * 0.75, -R * 0.62, R * 1.08, R * 0.2);
  c.quadraticCurveTo(R * 0.6, R * 0.62, 0, R * 0.5);
  c.quadraticCurveTo(-R * 0.6, R * 0.62, -R * 1.08, R * 0.2);
  c.quadraticCurveTo(-R * 0.75, -R * 0.62, 0, -R * 0.45);
  c.fill();
  // the "pepper": little specks, so a moth looks like bark, not like a flat sticker
  for (const s of b.specks) { const l = clamp(L + s.d, 0, 255); c.fillStyle = rgb([l, l * 0.975, l * 0.93]); c.beginPath(); c.arc(s.u * R, s.w * R, s.r * R, 0, 7); c.fill(); }
  const lb = clamp(L - 28, 0, 255); c.fillStyle = rgb([lb, lb * 0.97, lb * 0.92]);
  c.beginPath(); c.ellipse(0, R * 0.02, R * 0.13, R * 0.42, 0, 0, 7); c.fill();
  c.strokeStyle = c.fillStyle; c.lineWidth = Math.max(0.8, R * 0.06);
  for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(0, -R * 0.4); c.quadraticCurveTo(sd * R * 0.15, -R * 0.75, sd * R * 0.45, -R * 0.82); c.stroke(); }
}
function drawFly(c, b, R) {
  const m = b.v;
  c.fillStyle = 'rgba(225,232,240,.5)';
  for (const sd of [-1, 1]) { c.beginPath(); c.ellipse(sd * R * 0.48, -R * 0.02, R * 0.58, R * 0.22, sd * 0.45, 0, 7); c.fill(); }
  c.save();
  c.beginPath(); c.ellipse(0, R * 0.28, R * 0.36, R * 0.6, 0, 0, 7); c.fillStyle = rgb(flyRGB(m)); c.fill(); c.clip();
  c.fillStyle = `rgba(22,18,12,${0.92 * m})`;
  for (let k = 0; k < 3; k++) c.fillRect(-R, R * (0.02 + k * 0.28), 2 * R, R * 0.13);
  c.restore();
  c.fillStyle = rgb([lerp(84, 58, m), lerp(72, 48, m), lerp(56, 30, m)]);
  c.beginPath(); c.ellipse(0, -R * 0.36, R * 0.3, R * 0.26, 0, 0, 7); c.fill();
  c.fillStyle = '#5a2a1c'; for (const sd of [-1, 1]) { c.beginPath(); c.arc(sd * R * 0.15, -R * 0.66, R * 0.15, 0, 7); c.fill(); }
}
function drawWasp(c, b, R) {
  c.fillStyle = 'rgba(200,185,150,.45)';
  for (const sd of [-1, 1]) { c.beginPath(); c.ellipse(sd * R * 0.36, R * 0.05, R * 0.6, R * 0.16, sd * 1.05, 0, 7); c.fill(); }
  c.save();
  c.beginPath(); c.ellipse(0, R * 0.46, R * 0.33, R * 0.55, 0, 0, 7); c.fillStyle = '#f2c230'; c.fill(); c.clip();
  c.fillStyle = '#16120c'; for (let k = 0; k < 3; k++) c.fillRect(-R, R * (0.12 + k * 0.27), 2 * R, R * 0.13);
  c.restore();
  c.fillStyle = '#16120c';
  c.beginPath(); c.moveTo(-R * 0.08, R * 0.98); c.lineTo(0, R * 1.18); c.lineTo(R * 0.08, R * 0.98); c.fill();
  c.beginPath(); c.ellipse(0, -R * 0.3, R * 0.24, R * 0.26, 0, 0, 7); c.fill();
  c.fillStyle = '#f2c230'; c.beginPath(); c.ellipse(0, -R * 0.62, R * 0.2, R * 0.15, 0, 0, 7); c.fill();
  c.strokeStyle = '#16120c'; c.lineWidth = Math.max(0.8, R * 0.06);
  for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(sd * R * 0.06, -R * 0.74); c.quadraticCurveTo(sd * R * 0.2, -R * 1.05, sd * R * 0.45, -R * 1.1); c.stroke(); }
}
function drawBug(c, b, x, y, R, alpha, time) {

}
function drawBird(c, x, y, ang, s, time) {
  c.save(); c.translate(x, y); c.rotate(ang);

  c.fillStyle = '#15171f'; c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.5; c.lineJoin = 'round';
  for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(-s * 0.2, 0); c.lineTo(-s * 0.55, sd * s * (1.2 + flap)); c.lineTo(s * 0.35, sd * s * 0.2); c.closePath(); c.fill(); c.stroke(); }
  c.beginPath(); c.ellipse(0, 0, s * 0.9, s * 0.34, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#f5a524'; c.beginPath(); c.moveTo(s * 0.84, -s * 0.12); c.lineTo(s * 1.3, 0); c.lineTo(s * 0.84, s * 0.12); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(s * 0.55, -s * 0.1, s * 0.08, 0, 7); c.fill();
  c.restore();
}
function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function pill(c, text, x, y, fs, maxW, align = 'center', color = '#fff') {
  c.font = `800 ${fs}px Nunito, sans-serif`;
  let tw = c.measureText(text).width;
  if (tw + fs * 1.4 > maxW) { fs = Math.max(9, fs * (maxW - fs * 1.4) / tw); c.font = `800 ${fs}px Nunito, sans-serif`; tw = c.measureText(text).width; }
  const pw = tw + fs * 1.4, ph = fs * 2, x0 = align === 'center' ? x - pw / 2 : align === 'left' ? x : x - pw;
  c.fillStyle = 'rgba(10,12,20,.76)'; rrect(c, x0, y, pw, ph, ph / 2); c.fill();
  c.fillStyle = color; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(text, x0 + fs * 0.7, y + ph / 2 + 0.5);
}

function drawScene(c, w, h, time) {
  const t = T[lang], R = bugR(w, h);
  c.save(); rrect(c, 0, 0, w, h, 18); c.clip();
  if (S.mix < 1) c.drawImage(getBark('birch', w, h).cv, 0, 0, w, h);
  if (S.mix > 0) { c.globalAlpha = S.mix; c.drawImage(getBark('soot', w, h).cv, 0, 0, w, h); c.globalAlpha = 1; }
  const vg = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.4, w / 2, h / 2, Math.max(w, h) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.28)'); c.fillStyle = vg; c.fillRect(0, 0, w, h);

  const breeding = S.phase === 'breed', k = breeding ? S.bt / breedDur() : 0;
  for (const b of S.pop) {
    if (b.gone) continue;
    const a = breeding ? 1 - smooth((k - 0.5) / 0.35) : 1;
    if (breeding && k < 0.55) {
      c.strokeStyle = `rgba(255,255,255,${0.75 * (1 - k / 0.55)})`; c.lineWidth = 2;
      c.beginPath(); c.arc(b.x * w, b.y * h, R * (1.4 + k), 0, 7); c.stroke();
    }
    drawBug(c, b, b.x * w, b.y * h, R, a, time);
  }
  if (breeding && S.kids) for (const kd of S.kids) {
    const q = smooth((k - 0.3) / 0.6); if (q <= 0) continue;
    drawBug(c, kd, lerp(kd.parent.x, kd.x, q) * w, lerp(kd.parent.y, kd.y, q) * h, R * lerp(0.55, 1, q), q, time);
  }
  for (const b of S.wasps) drawBug(c, b, b.x * w, b.y * h, R, 1, time);

  // puffs: feathers of a catch, a sting star, a missed peck
  for (const p of S.puffs) {
    const x = p.x * w, y = p.y * h, q = p.t / 0.7;
    if (p.kind === 'miss') { c.strokeStyle = `rgba(255,255,255,${0.6 * (1 - q)})`; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, 6 + q * 12, 0, 7); c.stroke(); continue; }
    if (p.kind === 'sting') { c.strokeStyle = `rgba(255,80,60,${1 - q})`; c.lineWidth = 2.5; for (let i = 0; i < 8; i++) { const a = i / 8 * 2 * Math.PI; c.beginPath(); c.moveTo(x + Math.cos(a) * R * (1 + q), y + Math.sin(a) * R * (1 + q)); c.lineTo(x + Math.cos(a) * R * (1.5 + 2 * q), y + Math.sin(a) * R * (1.5 + 2 * q)); c.stroke(); } continue; }
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * 2 * Math.PI + p.x * 9, d = R * (0.3 + q * (p.kind === 'fade' ? 0.6 : 1.8));
      c.fillStyle = rgb(p.col, (1 - q) * 0.9); c.beginPath(); c.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, R * 0.22 * (1 - q * 0.5), 0, 7); c.fill();
    }
  }
  // the auto bird
  if (S.bird && !S.nobird) {
    const B = S.bird, p = birdPos(B), q = smooth(B.t / B.dur);
    if (!(B.leaving && B.t >= B.dur)) drawBird(c, p.x, p.y, Math.atan2(B.y1 - B.y0 - Math.cos(q * Math.PI) * R * 2.5, B.x1 - B.x0), R * 1.4, time);
  }

  // what is going on, at the top
  const fs = clamp(w * 0.034, 11.5, 15), top = 10, maxW = w - 20;
  if (S.phase === 'hunt') {
    pill(c, `${t.timer(Math.max(0, Math.ceil(S.timeLeft)))}   ${t.caughtN(S.caught)}`, w / 2, top, fs * 1.1, maxW, 'center', S.timeLeft < 3.5 ? '#ffb4a8' : '#fff');
  } else if (S.phase === 'auto') {
    pill(c, S.nobird ? `🎲 ${t.chanceHud}` : `🤖 ${S.caught}/${AUTO_EAT}`, w / 2, top, fs, maxW);
  } else if (S.phase === 'breed') {
    pill(c, `🐣 ${t.young}`, w / 2, top, fs, maxW);
  } else if (!S.ask) {
    pill(c, S.nobird ? t.nbHint : S.mode === 'mimic' ? t.tapM : t.tap, w / 2, top, fs, maxW, 'center', '#EDEFF7');
  }
  if (S.flash) {
    const a = clamp(S.flash.t / 0.4, 0, 1);
    c.globalAlpha = a; pill(c, S.flash.text, w / 2, h * 0.45, fs * 1.25, maxW, 'center', '#ffd25a'); c.globalAlpha = 1;
  }
  c.restore();
}

// --- drawing: the generations chart (histogram + average over time) -------------------------------------------
function drawChart(c, w, h) {
  const t = T[lang], mim = S.mode === 'mimic', H = S.hist, cur = H[H.length - 1], prev = H.length > 1 ? H[H.length - 2] : null;
  const col = (v) => rgb(mim ? flyRGB(v) : mothRGB(v));
  const side = w >= 480, gap = side ? 26 : 16;
  const A = side ? { x: 0, y: 0, w: (w - gap) * 0.46, h } : { x: 0, y: 0, w, h: (h - gap) / 2 };
  const B = side ? { x: A.w + gap, y: 0, w: w - A.w - gap, h } : { x: 0, y: A.h + gap, w, h: (h - gap) / 2 };
  const fs = 10.5, mut = '#98A0B8', faint = '#646C84', mark = '#f5c84c';
  c.font = `800 ${fs}px Nunito, sans-serif`; c.textBaseline = 'alphabetic';

  // A: how many insects of each shade in this generation (dashed: the previous one)
  c.textAlign = 'left'; c.fillStyle = mut; c.fillText(t.histT(S.gen), A.x, A.y + 10);
  const x0 = A.x, x1 = A.x + A.w, y0 = A.y + 22, y1 = A.y + A.h - 26, bins = 10, bw = (x1 - x0) / bins;
  const count = (vals) => { const k = new Array(bins).fill(0); for (const v of vals) k[Math.min(bins - 1, Math.floor(v * bins))]++; return k; };
  const kc = count(cur.vals), kp = prev ? count(prev.vals) : null, topN = Math.max(10, ...kc, ...(kp || [0]));
  const Y = (n) => y1 - n / topN * (y1 - y0);
  c.strokeStyle = 'rgba(130,145,190,.25)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x0, y1 + 0.5); c.lineTo(x1, y1 + 0.5); c.stroke();
  for (let i = 0; i < bins; i++) {
    if (!kc[i]) continue;
    c.fillStyle = col((i + 0.5) / bins); c.fillRect(x0 + i * bw + 1.5, Y(kc[i]), bw - 3, y1 - Y(kc[i]));
    c.strokeStyle = 'rgba(237,239,247,.4)'; c.strokeRect(x0 + i * bw + 2, Y(kc[i]) + 0.5, bw - 4, y1 - Y(kc[i]) - 1);
    c.fillStyle = '#EDEFF7'; c.textAlign = 'center'; c.fillText(String(kc[i]), x0 + (i + 0.5) * bw, Y(kc[i]) - 3);
  }
  if (kp) {
    c.strokeStyle = 'rgba(237,239,247,.55)'; c.setLineDash([3, 3]); c.lineWidth = 1.2; c.beginPath(); c.moveTo(x0, y1);
    for (let i = 0; i < bins; i++) { c.lineTo(x0 + i * bw, Y(kp[i])); c.lineTo(x0 + (i + 1) * bw, Y(kp[i])); }
    c.lineTo(x1, y1); c.stroke(); c.setLineDash([]);
    c.textAlign = 'right'; c.fillStyle = faint; c.fillText(`- - ${t.prevT}`, x1, A.y + 10);
  }
  const gr = c.createLinearGradient(x0, 0, x1, 0);
  for (let i = 0; i <= 10; i++) gr.addColorStop(i / 10, col(i / 10));
  c.fillStyle = gr; c.fillRect(x0, y1 + 4, x1 - x0, 6);
  c.fillStyle = mut; c.textAlign = 'left'; c.fillText(mim ? t.loM : t.lo, x0, y1 + 22);
  c.textAlign = 'right'; c.fillText(mim ? t.hiM : t.hi, x1, y1 + 22);
  // where the bark (or the wasp) sits on the same scale
  const mv = mim ? 1 : cur.tone, mx = x0 + mv * (x1 - x0);
  c.strokeStyle = mark; c.setLineDash([4, 3]); c.lineWidth = 1.5; c.beginPath(); c.moveTo(mx, y0 + 4); c.lineTo(mx, y1 + 10); c.stroke(); c.setLineDash([]);
  c.fillStyle = mark; c.textAlign = mv > 0.5 ? 'right' : 'left'; c.fillText(mim ? `🐝 ${t.waspTick}` : `🌳 ${t.barkTick}`, mx + (mv > 0.5 ? -4 : 4), y0 + 8);

  // B: the average, generation after generation, over the bark it lived on
  c.textAlign = 'left'; c.fillStyle = mut; c.fillText(mim ? t.lineTM : t.lineT, B.x, B.y + 10);
  const L0 = B.x, L1 = B.x + B.w, T0 = B.y + 22, T1 = B.y + B.h - 26;
  const show = H.slice(-30), n = Math.max(show.length, 8), first = S.gen - show.length + 1, cw = (L1 - L0) / n;
  const X = (i) => L0 + (i + 0.5) * cw, Yv = (v) => T1 - v * (T1 - T0);
  show.forEach((g, i) => {
    c.fillStyle = g.env === 'soot' ? 'rgba(0,0,0,.5)' : g.env === 'birch' ? 'rgba(236,232,222,.13)' : 'rgba(242,194,48,.08)';
    c.fillRect(L0 + i * cw, T0, cw + 0.5, T1 - T0);
  });
  c.strokeStyle = 'rgba(130,145,190,.25)'; c.lineWidth = 1; c.strokeRect(L0 + 0.5, T0 + 0.5, L1 - L0 - 1, T1 - T0 - 1);
  c.strokeStyle = mark; c.setLineDash([4, 3]); c.lineWidth = 1.5; c.beginPath();
  show.forEach((g, i) => { const y = Yv(mim ? 1 : g.tone); i ? c.lineTo(L0 + i * cw, y) : c.moveTo(L0, y); c.lineTo(L0 + (i + 1) * cw, y); });
  c.stroke(); c.setLineDash([]);
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath();
  show.forEach((g, i) => { const y = Yv(mean(g.vals)); i ? c.lineTo(X(i), y) : c.moveTo(X(i), y); });
  c.stroke();
  show.forEach((g, i) => {
    const v = mean(g.vals); c.beginPath(); c.arc(X(i), Yv(v), Math.min(4.5, cw * 0.32), 0, 7);
    if (g.nobird) { c.fillStyle = '#0A0C14'; c.fill(); c.strokeStyle = '#98A0B8'; c.lineWidth = 1.5; c.stroke(); }
    else { c.fillStyle = col(v); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 1.2; c.stroke(); }
  });
  c.fillStyle = faint; c.textAlign = 'left';
  c.fillText(mim ? t.hiM : t.hi, L0 + 4, T0 + 12); c.fillText(mim ? t.loM : t.lo, L0 + 4, T1 - 5);
  c.textAlign = 'left'; c.fillStyle = mut; c.fillText(String(first), L0, T1 + 14);
  c.textAlign = 'center'; c.fillStyle = faint; c.fillText(show.some((g) => g.nobird) ? `${t.genAxis} · ○ ${t.noBirdTag}` : t.genAxis, (L0 + L1) / 2, T1 + 14);
  c.textAlign = 'right'; c.fillStyle = mut; c.fillText(String(S.gen), X(show.length - 1) + 4, T1 + 14);
}

// --- go ------------------------------------------------------------------------------------------------------
{ const r = $('cv').getBoundingClientRect(); S.w = r.width || 600; S.h = r.height || 400; }
newPopulation();
canvasLoop($('cv'), (c, w, h, dt, time) => { S.w = w; S.h = h; update(dt); drawScene(c, w, h, time); });
canvasLoop($('chart'), (c, w, h) => drawChart(c, w, h));
render();
</script>
