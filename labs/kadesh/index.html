function pill(c, w, h, text, x, y, o = {}) {

  pill(c, w, h, t.lock.title, w / 2, h * 0.68, { size: 13 });
}

// --- view 3: the neighbours -------------------------------------------------------------------------------------
function drawTrade(c, w, h, dt, time) {
  const t = T[lang], M = getMap('B', w, h), pin = M.pin, placed = [];
  c.drawImage(M.base, 0, 0, w, h); legend(c, w, h, M, 'bl', placed);
  const treaty = S.mode === 'treaty';
  S.link += (((treaty && S.yrs >= YT) ? 1 : 0) - S.link) * Math.min(1, dt * 4);
  // trade arrows
  GOODS.forEach((g, i) => {
    if (!S.got[i]) return; S.arr[i] = Math.min(1, S.arr[i] + dt * 0.9);
    const R = M.tr[PLACES[i]], L = R.total * (1 - Math.pow(1 - S.arr[i], 3)), col = GCOL[g];
    c.save(); c.globalAlpha = treaty ? 0.4 : 1; c.lineCap = 'round'; c.lineJoin = 'round';
    partPath(c, R, L); c.lineWidth = 7; c.strokeStyle = 'rgba(12,22,34,.55)'; c.stroke();
    partPath(c, R, L); c.lineWidth = 4; c.strokeStyle = col; c.stroke();
    c.setLineDash([2, 10]); c.lineDashOffset = -time * 16; partPath(c, R, L); c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.85)'; c.stroke(); c.setLineDash([]);
    const e = posAt(R, L), a = Math.atan2(e.dy, e.dx); c.translate(e.x, e.y); c.rotate(a); c.beginPath(); c.moveTo(7, 0); c.lineTo(-5, -6); c.lineTo(-5, 6); c.closePath(); c.fillStyle = col; c.fill(); c.lineWidth = 1.2; c.strokeStyle = 'rgba(12,22,34,.8)'; c.stroke();
    c.restore();
  });
  // the treaty link between the two capitals' lands
  if (S.link > 0.02) {
    const a = pin.pi, b = pin.hattusa, mx = (a[0] + b[0]) / 2 + 40, my = (a[1] + b[1]) / 2;
    c.save(); c.lineCap = 'round'; c.setLineDash([6, 7]); c.lineDashOffset = -time * 14; c.beginPath(); c.moveTo(a[0], a[1]);
    const e = S.link; c.quadraticCurveTo(lerp(a[0], mx, e), lerp(a[1], my, e), lerp(a[0], b[0], e), lerp(a[1], b[1], e));
    c.lineWidth = 7; c.strokeStyle = 'rgba(12,22,34,.5)'; c.stroke(); c.lineWidth = 3.5; c.strokeStyle = GOLD; c.stroke(); c.restore();
    if (S.link > 0.9) placed.push(pill(c, w, h, `${t.d.treatyShort} ${t.d.date}`, mx - 6, my, { edge: GOLD }));
  }
  // Punt: only an area, its place is debated
  const pp = pin.punt; c.save(); c.setLineDash([4, 4]); c.beginPath(); c.ellipse(pp[0], pp[1], 26, 18, 0, 0, 7); c.fillStyle = 'rgba(210,138,196,.14)'; c.fill(); c.strokeStyle = 'rgba(240,190,226,.8)'; c.lineWidth = 1.5; c.stroke(); c.restore();
  const sel = S.gsel !== null && !S.got[S.gsel];
  const tg = { nubia: ['w', 'nw', 'sw'], punt: ['s', 'se', 'sw'], byblos: ['sw', 's', 'w'], cyprus: ['n', 'nw', 'ne'] };
  PLACES.forEach((k, i) => {
    const [px, py] = pin[k], got = S.got[i], col = got ? GCOL[GOODS[i]] : '#ffffff';
    if (sel && !got) { c.beginPath(); c.arc(px, py, 15 + 2.5 * Math.sin(time * 5), 0, 7); c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2; c.stroke(); }
    if (S.bad && S.bad.k === k && time - S.bad.t < 0.7) { c.beginPath(); c.arc(px, py, 17, 0, 7); c.strokeStyle = 'rgba(255,90,80,.95)'; c.lineWidth = 3; c.stroke(); }
    if (k !== 'punt' && k !== 'cyprus') dot(c, px, py, col, 5); else if (k === 'cyprus') dot(c, px, py, col, 4); else dot(c, px, py, got ? col : '#f0bee2', 4);
    HIT.push({ x: px, y: py, r: 26, act: 'place', k });
  });
  dot(c, pin.memphis[0], pin.memphis[1], GOLD, 5); dot(c, pin.pi[0], pin.pi[1], GOLD, 4); dot(c, pin.hattusa[0], pin.hattusa[1], HTC, 5); dot(c, pin.kadesh[0], pin.kadesh[1], '#fff', 3.5);
  place(c, w, h, t.pl.memphis, pin.memphis[0], pin.memphis[1], ['w', 'sw', 'nw'], placed); place(c, w, h, t.pl.pi, pin.pi[0], pin.pi[1], ['e', 'ne', 'se'], placed);
  place(c, w, h, t.pl.hattusa, pin.hattusa[0], pin.hattusa[1], ['e', 'ne', 'se'], placed); place(c, w, h, t.pl.kadesh, pin.kadesh[0], pin.kadesh[1], ['e', 'ne', 'se'], placed);
  PLACES.forEach((k, i) => place(c, w, h, k === 'punt' ? t.pl.punt : t.d.places[i], pin[k][0], pin[k][1], tg[k], placed, { edge: S.got[i] ? GCOL[GOODS[i]] : null }));
}

// --- state --------------------------------------------------------------------------------------------------------
const HIT = []; // tappable spots on the canvas, rebuilt every frame
const S = {
  step: 0, p: 0, pred: null, sec: null, side: null, yr: null,
  q: { i: 0, sel: null, right: 0, done: false }, flash: null,
  gsel: null, got: [false, false, false, false], arr: [0, 0, 0, 0], bad: null, last: null, mode: 'trade', yrs: 0, link: 0,
};
const lab = shell({ key: 'kadesh', T, topics: TOPICS, views: ['battle', 'texts', 'trade'], onLang: () => render(), onView: () => { S.sec = null; render(); } });
const secret = secretLab('kadesh', () => ({
  secrets: [{ emo: '📜', title: T[lang].secrets.a[0], desc: T[lang].secrets.a[1] }, { emo: '💍', title: T[lang].secrets.b[0], desc: T[lang].secrets.b[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `<div class="kd-body">
  <div class="kd-blk" id="kdB1"><div id="kdAsk"></div><div class="row2" id="kdNav"></div></div>
  <div class="kd-blk" id="kdB2"><div id="kdSort"></div></div>
  <div class="kd-blk" id="kdB3">
    <div class="row2" id="kdMode" style="margin-top:0"></div>
    <div id="kdTrade" style="margin-top:12px"><div class="kd-msg" id="kdMsg"></div><div class="kd-goods" id="kdGoods"></div><div class="kd-places" id="kdPlaces"></div></div>
    <div id="kdTreaty" style="margin-top:12px"><div class="kd-sh"><span class="kd-lbl" id="kdYL"></span><b id="kdYV"></b></div>
      <input id="kdYrs" class="big" type="range" min="0" max="20" step="1" value="0" style="--track: linear-gradient(90deg, #e9c46a, #b5523b)">
      <div class="ends"><span>0</span><span>20</span></div><div id="kdTInfo"></div></div>
  </div>
  <div class="kd-blk" id="kdB0"><div class="kd-lock"><p id="kdLockT"></p><button class="btn" type="button" data-act="tobattle" id="kdLockB"></button></div></div>
  <div class="row2" id="kdSec"></div>
</div>`;
const css = document.createElement('style'); css.textContent = '.chip:disabled { opacity: .35; pointer-events: none; }'; document.head.append(css);

// --- the frame loop and the taps ----------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  HIT.length = 0;
  if (S.sec === 'a') return drawSecA(c, w, h, time);
  if (S.sec === 'b') return drawSecB(c, w, h, time);
  const v = lab.view;
  if (v !== 'battle' && S.pred === null) return drawLock(c, w, h, time);
  if (v === 'battle') return drawBattle(c, w, h, dt, time);
  if (v === 'texts') return drawTexts(c, w, h, time);
  return drawTrade(c, w, h, dt, time);
});
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function act(a, el) {
  const t = T[lang];
  if (a === 'next') { if (S.step < 3 || (S.step < 4 && S.pred !== null)) S.step++; sfx.click(); }
  else if (a === 'back') { S.step = Math.max(0, S.step - 1); sfx.click(); }
  else if (a === 'replay') { S.step = 0; sfx.click(); }
  else if (a === 'pred') {
    if (S.pred !== null) return; const i = +el.dataset.i; S.pred = i; S.step = 4; (i === 2 ? sfx.good : sfx.bad)(); render(); showStage(); return;
  } else if (a === 'bucket') {
    const q = S.q; if (q.sel !== null) return; const i = +el.dataset.i, ok = t.x.st[q.i].ok;
    q.sel = i; if (i === ok) { q.right++; sfx.good(); } else sfx.bad();
    S.flash = { k: 'ehb'[ok], t: now() };
  } else if (a === 'snext') {
    const q = S.q; if (q.i < t.x.st.length - 1) { q.i++; q.sel = null; S.flash = null; } else q.done = true; sfx.click();
  } else if (a === 'sagain') { S.q = { i: 0, sel: null, right: 0, done: false }; S.flash = null; sfx.click(); }
  else if (a === 'good') { const i = +el.dataset.i; if (S.got[i]) return; S.gsel = S.gsel === i ? null : i; S.last = null; sfx.tick(); }
  else if (a === 'place') {
    if (S.gsel === null) return; const k = el.dataset.k, i = S.gsel;
    if (PLACES[i] === k) { S.got[i] = true; S.arr[i] = 0; S.gsel = null; S.last = { ok: true, i }; sfx.good(); if (S.got.every(Boolean)) { render(); showStage(); return; } }
    else { S.bad = { k, t: now() }; S.last = { ok: false }; sfx.bad(); }
  } else if (a === 'mode') { S.mode = el.dataset.m; sfx.click(); }
  else if (a === 'side') { S.side = el.dataset.k; sfx.click(); }
  else if (a === 'year') { S.yr = +el.dataset.k; sfx.click(); }
  else if (a === 'tobattle') { document.querySelector('#views [data-view="battle"]')?.click(); return; }
  render();
}
$('ctrlBody').addEventListener('click', (ev) => { const b = ev.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b); });
$('kdSec').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-k]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.side = null; S.yr = null; sfx.click(); render();
});
$('cv').addEventListener('click', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top; let best = null, bd = 1e9;
  for (const hz of HIT) {
    if (hz.rect) { const [rx, ry, rw, rh] = hz.rect; if (x >= rx && x <= rx + rw && y >= ry && y <= ry + rh) { best = hz; break; } continue; }
    const dd = Math.hypot(hz.x - x, hz.y - y); if (dd <= hz.r && dd < bd) { bd = dd; best = hz; }
  }
  if (!best) return;
  const fake = { dataset: { k: best.k } };
  if (best.act === 'place' || best.act === 'side' || best.act === 'year') act(best.act, fake);
});
$('kdYrs').addEventListener('input', (ev) => {
  const was = S.yrs; S.yrs = +ev.target.value; sfx.tick(); if (was < YT && S.yrs >= YT) sfx.good(); render();
});

// --- one render per change: controls, readout, state card and facts -------------------------------------------------
function show(id, on) { $(id).style.display = on ? 'block' : 'none'; }
function renderBattle(t) {
  const st = t.b.steps[S.step], asking = S.step === 3 && S.pred === null, done = S.pred !== null && S.step === 4;
  if (asking) $('kdAsk').innerHTML = `<div class="kd-q">${esc(t.b.q)}</div><div class="kd-opts">${t.b.opts.map((o, i) => `<button class="kd-opt" data-act="pred" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  else if (done) $('kdAsk').innerHTML = `<div class="kd-q">${esc(t.b.q)}</div><div class="kd-opts">${t.b.opts.map((o, i) => `<button class="kd-opt lock${i === 2 ? ' ok' : ''}${S.pred === i && i !== 2 ? ' no' : ''}">${esc(o)}</button>`).join('')}</div>`
    + `<div class="kd-verdict" style="color:${S.pred === 2 ? 'var(--ok)' : 'var(--wip)'}">${esc(S.pred === 2 ? t.b.right : S.pred === 0 ? t.b.wrongE : t.b.wrongH)}</div>`;
  else $('kdAsk').innerHTML = '';
  $('kdNav').innerHTML = `<button class="chip" data-act="back" ${S.step === 0 ? 'disabled' : ''}>${esc(t.b.back)}</button>`
    + (S.step === 4 ? `<button class="chip" data-act="replay">${esc(t.b.replay)}</button>` : asking ? '' : `<button class="btn" data-act="next">${esc(t.b.next)}</button>`);
  lab.setGlow('rgba(224, 169, 59, .26)'); lab.setReadout(`${S.step + 1} / 5`, st.n, '', '#e0a93b');
  lab.setState({ emo: st.e, title: st.t, lead: st.l, body: st.b, extra: '' });
  lab.setFacts(S.step === 4 ? [...t.facts.b1, ...t.facts.b2] : t.facts.b1);
}
function renderTexts(t) {
  const q = S.q, X = t.x, n = X.st.length;
  if (q.done) {
    $('kdSort').innerHTML = `<div class="kd-q">${esc(X.endT(q.right, n))}</div><div class="kd-hint" style="margin:0 0 10px">${esc(X.endL)}</div><button class="chip" data-act="sagain">${esc(X.again)}</button>`;
  } else {
    const s = X.st[q.i], ans = q.sel !== null;
    $('kdSort').innerHTML = `<div class="kd-prog">${esc(X.prog(q.i + 1, n))}</div><p class="kd-st">${esc(s.t)}</p><div class="kd-lbl">${esc(X.ask)}</div>
      <div class="kd-bk">${X.btn.map((b, i) => `<button class="kd-opt${ans ? ' lock' : ''}${ans && i === s.ok ? ' ok' : ''}${ans && q.sel === i && i !== s.ok ? ' no' : ''}" data-act="bucket" data-i="${i}">${esc(b)}</button>`).join('')}</div>`
      + (ans ? `<div class="kd-verdict" style="color:${q.sel === s.ok ? 'var(--ok)' : 'var(--wip)'}">${esc(q.sel === s.ok ? X.right : X.wrong(X.btn[s.ok]))} <span style="color:var(--soft);font-weight:700">${esc(s.w)}</span></div>
        <div class="row2"><button class="btn" data-act="snext">${esc(q.i < n - 1 ? X.next : X.fin)}</button></div>` : '');
  }
  lab.setGlow('rgba(233, 196, 106, .24)');
  lab.setReadout(`${Math.min(q.i + (q.sel !== null ? 1 : 0), n)} / ${n}`, X.ask, q.right ? `✓ ${q.right}` : '', '#b8892b');
  lab.setState({ emo: '📜', title: q.done ? X.endT(q.right, n) : X.askT, lead: q.done ? X.endL : X.askL, body: '', extra: '' });
  lab.setFacts(q.done ? t.facts.x : []);
}
function renderTrade(t) {
  const D = t.d, n = S.got.filter(Boolean).length, done = n === 4, treaty = S.mode === 'treaty';
  $('kdMode').innerHTML = D.modes.map((m, i) => `<button class="chip${(i === 1) === treaty ? ' on' : ''}" data-act="mode" data-m="${i ? 'treaty' : 'trade'}">${esc(m)}</button>`).join('');
  show('kdTrade', !treaty); show('kdTreaty', treaty);
  $('kdGoods').innerHTML = GOODS.map((g, i) => `<button class="kd-g${S.got[i] ? ' got' : ''}${S.gsel === i ? ' on' : ''}" data-act="good" data-i="${i}">${GEMO[i]} ${esc(D.goods[i])}${S.got[i] ? ' ✓' : ''}</button>`).join('');
  $('kdPlaces').innerHTML = PLACE_ORDER.map((k) => { const i = PLACES.indexOf(k); return `<button class="kd-p${S.got[i] ? ' got' : ''}" data-act="place" data-k="${k}" ${S.gsel === null || S.got[i] ? 'disabled' : ''}>📍 ${esc(D.places[i])}</button>`; }).join('');
  const msg = $('kdMsg'); msg.className = `kd-msg${S.last && !S.last.ok ? ' bad' : ''}`;
  msg.textContent = S.last ? (S.last.ok ? D.ok[S.last.i] : D.no) : S.gsel !== null ? D.pickSel(D.goods[S.gsel]) : done ? D.stDone[3] : D.pick;
  const y = S.yrs; $('kdYL').textContent = D.yrsL; $('kdYV').textContent = y; $('kdYrs').value = y;
  $('kdTInfo').innerHTML = y >= YT ? `<ul class="kd-prom">${D.prom.map((p) => `<li>${esc(p)}</li>`).join('')}</ul><div class="kd-hint">${esc(D.un)}</div>` : `<div class="kd-hint">${esc(y === 0 ? D.yrsHint : D.rivalB)}</div>`;
  if (treaty) {
    lab.setGlow('rgba(233, 196, 106, .26)'); lab.setReadout(D.yrsVal(y), D.yrsSub, y >= YT ? `${D.treatyShort} · ${D.date}` : '', '#e9c46a');
    if (y >= YT) lab.setState({ emo: '🤝', title: D.peaceT, lead: D.peaceL(YT), body: D.peaceB, extra: '' });
    else if (y === 0) lab.setState({ emo: '⏳', title: D.yrsL, lead: D.yrsHint, body: '', extra: '' });
    else lab.setState({ emo: '⚔️', title: D.rivalT, lead: D.rivalL, body: D.rivalB, extra: '' });
    lab.setFacts([...(y >= YT ? t.facts.tr : []), ...(done ? t.facts.gd : [])]);
  } else {
    lab.setGlow('rgba(95, 179, 111, .24)'); lab.setReadout(D.goodsVal(n), D.goodsSub, '', '#5fb36f');
    const st = done ? D.stDone : D.stTrade; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
    lab.setFacts(done ? t.facts.gd : []);
  }
}
function render() {
  const t = T[lang], v = lab.view, lk = v !== 'battle' && S.pred === null;
  document.body.dataset.v = S.sec ? 'sec' : lk ? 'lock' : v;
  show('kdB1', !S.sec && v === 'battle'); show('kdB2', !S.sec && !lk && v === 'texts'); show('kdB3', !S.sec && !lk && v === 'trade'); show('kdB0', !S.sec && lk);
  $('kdLockT').textContent = t.lock.text; $('kdLockB').textContent = t.lock.go;
  const open = secret.unlocked();
  $('kdSec').innerHTML = [['a', '📜'], ['b', '💍']].map(([k, emo]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (S.sec === 'a') {
    const s = t.sc, side = S.side, info = side === 'k' ? s.aK : side === 'h' ? s.aH : null;
    lab.setGlow('rgba(233, 196, 106, .26)'); lab.setReadout('📜', s.a[0], '', '#b8892b');
    lab.setState({ emo: '📜', title: info ? info[0] : s.a[0], lead: info ? info[1] : s.a[1], body: info ? '' : s.a[2], extra: '' });
    lab.setFacts([{ emo: '📜', text: t.facts.tr[0].text, src: t.facts.tr[0].src }]); return;
  }
  if (S.sec === 'b') {
    const s = t.sc, i = S.yr;
    lab.setGlow('rgba(233, 196, 106, .26)'); lab.setReadout('💍', s.b[0], '', '#b8892b');
    if (i === null) lab.setState({ emo: '💍', title: s.b[0], lead: s.b[1], body: s.b[2], extra: '' });
    else lab.setState({ emo: ['⚔️', '🕊️', '💍'][i], title: `${s.bY[i][0]} · ${s.bY[i][1]}`, lead: s.bY[i][2], body: '', extra: '' });
    lab.setFacts([]); return;
  }
  if (lk) {
    lab.setGlow('rgba(120, 130, 170, .2)'); lab.setReadout('🔒', '', '', '#8a93b0');
    lab.setState({ emo: '🔒', title: t.lock.title, lead: t.lock.text, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (v === 'battle') renderBattle(t); else if (v === 'texts') renderTexts(t); else renderTrade(t);
}
render();
</script>
