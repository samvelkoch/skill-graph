    const x = bx(Math.min(beat, LEN));
    c.save(); c.shadowColor = 'rgba(255,255,255,.75)'; c.shadowBlur = 9; c.strokeStyle = 'rgba(255,255,255,.92)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(x, ry + 2); c.lineTo(x, ry + rh - 2); c.stroke(); c.restore();
  }

  // labels: meter or badge at the top right, theme/variation and instrument/speed under the roll
  if (M.meter >= 0) {
    S.mv += (M.meter - S.mv) * (1 - Math.exp(-dt * 8));
    c.save(); c.font = '800 12px Nunito, sans-serif';
    const pwm = Math.max(130, c.measureText(t.sameTune).width + 22), x = w - 12 - pwm, y = 10;
    c.fillStyle = 'rgba(6,11,26,.84)'; c.strokeStyle = 'rgba(255,255,255,.13)'; c.beginPath(); c.roundRect(x, y, pwm, 42, 13); c.fill(); c.stroke();
    c.fillStyle = '#e8edfb'; c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillText(t.sameTune, x + 11, y + 14);
    const bw0 = pwm - 22; c.fillStyle = 'rgba(255,255,255,.12)'; c.beginPath(); c.roundRect(x + 11, y + 26, bw0, 8, 4); c.fill();
    const fw = Math.max(0, bw0 * S.mv);
    if (fw > 1) { c.fillStyle = rgb(mixc(GOLD, CORAL, 1 - S.mv)[1]); c.shadowColor = 'rgba(255,209,102,.6)'; c.shadowBlur = 8; c.beginPath(); c.roundRect(x + 11, y + 26, fw, 8, 4); c.fill(); }
    c.restore();
  } else if (M.badge) pill(c, w - 12, 12, t.changes[M.badge], { right: true, emo: BADGE[M.badge] });
  if (M.label) pill(c, rx, ry + rh + 8, t[M.label], { staff: M.label === 'theme' ? '#ffd166' : '#7cc4ff' });
  if (M.info) {
    const bw1 = pill(c, rx + rw, ry + rh + 8, `♩ = ${M.bpm}`, { right: true, tint: M.tintB });
    pill(c, rx + rw - bw1 - 6, ry + rh + 8, '', { right: true, emo: INST[M.inst].emo, tint: M.tintI });
  }
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => { // on a phone the controls sit below the picture: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const clearSec = () => { S.sec = null; };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, L = S.l, D = S.d, F = S.f, v = +b.dataset.v;
  if (a === 'playTheme') { clearSec(); L.mode = 'theme'; L.heardT = true; play(THEME_NOTES, 96, 0); }
  else if (a === 'playVar') { clearSec(); const V = VARS[L.qi]; L.mode = 'var'; L.heardV = true; play(V.notes, V.bpm, V.inst); }
  else if (a === 'guess') {
    clearSec(); L.guess = b.dataset.k; L.revealed = true; L.mode = 'var';
    const ok = L.guess === VARS[L.qi].key; if (ok) L.right++;
    (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'next') {
    clearSec(); stopPlay();
    if (L.qi >= VARS.length - 1) { L.qi = 0; L.right = 0; } else L.qi++;
    L.mode = 'theme'; L.heardV = false; L.revealed = false; L.guess = null; L.order = shuffled(KEYS); sfx.click();
  } else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = b.dataset.k; S.secNotes = S.sec === 'a' ? mozart() : backwards(); play(S.secNotes, 96, 0); sfx.click(); showStage();
  } else if (a === 'dial') { clearSec(); stopPlay(); D[b.dataset.k] = v; sfx.tick(); }
  else if (a === 'playDials') { clearSec(); play(build({ rhythm: D.rhythm, minor: D.mode === 1, extra: D.extra }), D.bpm, D.inst); }
  else if (a === 'askD') { D.choice = v; (v === 0 ? sfx.good : sfx.bad)(); }
  else if (a === 'askDPlay') {
    Object.assign(D, { rhythm: 0, mode: 1, bpm: 70, inst: 3, extra: 2, asked: true }); store.set('variations:askedD', true);
    play(build({ minor: true, extra: 2 }), 70, 3); showStage();
  } else if (a === 'askF') { F.choice = v; sfx.click(); }
  else if (a === 'askFPlay') {
    F.n = 7; F.asked = true; F.played = 7; F.info = true; store.set('variations:askedF', true);
    play(farNotes(7), 96, 0); showStage();
  } else if (a === 'playFar') { clearSec(); F.played = F.n; if (F.n >= 6 && F.n <= 8) F.info = true; play(farNotes(F.n), 96, 0); }
  else if (a === 'farAns') { F.ans[F.n] = b.dataset.k; sfx.click(); }
  else if (a === 'farCell') { clearSec(); stopPlay(); F.n = +b.dataset.n; sfx.tick(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'spd') S.d.bpm = +ev.target.value;
  else if (ev.target.id === 'fsl') S.f.n = +ev.target.value;
  else return;
  clearSec(); stopPlay(); render();
});

// --- one render per change: controls, readout and the state card ---------------------------------------------
const chip = (cls, act, attrs, label, dis) => `<button class="chip va-c ${cls}" type="button" data-act="${act}" ${attrs}${dis ? ' disabled' : ''}>${esc(label)}</button>`;
function render() {
  const t = T[lang], v = lab.view, D = S.d, F = S.f;
  const asking = (v === 'dials' && !D.asked) || (v === 'far' && !F.asked);
  document.body.dataset.v = v;
  $('vaAsk').style.display = asking ? 'block' : 'none';
  $('vaListen').style.display = v === 'listen' ? 'block' : 'none';
  $('vaDials').style.display = v === 'dials' && !asking ? 'block' : 'none';
  $('vaFar').style.display = v === 'far' && !asking ? 'block' : 'none';
  $('vaSecRow').style.display = asking ? 'none' : 'block';
  const open = secret.unlocked();
  $('secChips').innerHTML = [['a', '🎹'], ['b', '🔁']].map(([k, e]) =>
    `<button class="chip secret va-c ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" type="button" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setGlow('rgba(255, 209, 102, .2)');
  if (asking) renderAsk(t, v);
  else if (v === 'listen') renderListen(t);
  else if (v === 'dials') renderDials(t);
  else renderFar(t);
  if (S.sec && !asking) { // a secret is on the stage
    const k = S.sec;
    lab.setReadout(k === 'a' ? '🎹' : '🔁', t.secrets[k][0], '', '#7cc4ff');
    lab.setState({ emo: k === 'a' ? '🎹' : '🔁', title: t.secrets[k][0], lead: t.secrets[k][1], body: '', extra: '' });
  }
  lab.setFacts(asking ? [] : t.facts[v]);
}

function renderAsk(t, v) {
  const el = $('vaAsk'), D = S.d, F = S.f;
  if (v === 'dials') {
    const done = D.choice !== null;
    lab.setReadout('?', '', '', '#ffd166');
    lab.setState({ emo: '🤔', title: t.qDials, lead: '', body: '', extra: '' });
    el.innerHTML = `<div class="va-q">${esc(t.qDials)}</div>
      <div class="chips">${D.order.map((i) => chip(done ? (i === 0 ? 'va-ok' : D.choice === i ? 'va-bad' : '') : '', 'askD', `data-v="${i}"`, i === 0 ? t.yes : t.no, done)).join('')}</div>
      ${done ? `<div class="va-verdict" style="color:${D.choice === 0 ? 'var(--ok)' : 'var(--wip)'}">${esc(D.choice === 0 ? t.right : t.notQuite)}</div><p class="va-note">${esc(t.dialsWhy)}</p>
      <div class="va-btns"><button class="btn va-b" type="button" data-act="askDPlay">▶ ${esc(t.play)}</button></div>` : ''}`;
  } else {
    const done = F.choice !== null;
    lab.setReadout('?', '', '', '#ffd166');
    lab.setState({ emo: '🤔', title: t.qFar, lead: '', body: '', extra: '' });
    el.innerHTML = `<div class="va-q">${esc(t.qFar)}</div>
      <div class="chips">${F.order.map((i) => chip(done && F.choice === i ? 'on' : '', 'askF', `data-v="${i}"`, t.optsFar[i], done)).join('')}</div>
      ${done ? `<div class="va-row"><div class="va-btns"><button class="btn va-b" type="button" data-act="askFPlay">▶ ${esc(t.play)}</button></div></div>` : ''}`;
  }
}

function renderListen(t) {
  const L = S.l, V = VARS[L.qi], bn = $('bNext');
  $('bTheme').textContent = `▶ ${t.playTheme}`; $('bVar').textContent = `▶ ${t.playVar}`; $('bVar').disabled = !L.heardT;
  $('lQ').textContent = t.views.listen;
  $('lChips').innerHTML = L.order.map((k) => chip(L.revealed ? (k === V.key ? 'va-ok' : k === L.guess ? 'va-bad' : '') : '', 'guess', `data-k="${k}"`, t.changes[k], !L.heardV || L.revealed)).join('');
  bn.style.display = L.revealed ? 'inline-flex' : 'none';
  bn.textContent = L.qi >= VARS.length - 1 ? `↻ ${t.again}` : `→ ${t.next}`;
  const ok = L.revealed && L.guess === V.key;
  lab.setReadout(`${L.right} / ${VARS.length}`, t.heard, ok ? t.right : '', '#ffd166');
  if (!L.revealed) lab.setState({ ...t.state.listen, extra: '' });
  else lab.setState(ok ? { emo: '✅', title: t.right, lead: t.why[V.key], body: '', extra: '' } : { emo: '🎧', title: `${t.notQuite} ${t.changes[V.key]}`, lead: t.why[V.key], body: '', extra: '' });
}

function renderDials(t) {
  const D = S.d;
  DIAL_ROWS.forEach(([k, nm, list]) => {
    $(`dl_${k}`).textContent = k === 'speed' ? `${t.dialNames.speed} · ${D.bpm} ♩` : t.dialNames[nm];
    if (list) $(`dc_${k}`).innerHTML = t[list].map((label, i) => chip(D[k] === i ? 'on' : '', 'dial', `data-k="${k}" data-v="${i}"`, label, false)).join('');
  });
  if (+$('spd').value !== D.bpm) $('spd').value = D.bpm;
  $('bPlayD').textContent = `▶ ${t.play}`;
  const cnt = (D.rhythm ? 1 : 0) + (D.mode ? 1 : 0) + (D.bpm !== 96 ? 1 : 0) + (D.inst ? 1 : 0) + (D.extra ? 1 : 0);
  lab.setReadout(`${cnt} / 5`, t.dialsChanged, '', '#ffd166');
  lab.setState({ ...t.state.dials, extra: '' });
}

function renderFar(t) {
  const F = S.f, n = F.n;
  $('fsl').setAttribute('aria-label', t.changeMain);
  if (+$('fsl').value !== n) $('fsl').value = n;
  $('fLbl').textContent = `${t.changeMain} · ${n} / 14`;
  $('bPlayF').textContent = `▶ ${t.play}`;
  $('fAns').innerHTML = [['still', t.stillHear], ['new', t.newTune]].map(([k, label]) => chip(F.ans[n] === k ? 'on' : '', 'farAns', `data-k="${k}"`, label, F.played !== n)).join('');
  $('fCap').textContent = t.chartCap;
  $('fChart').innerHTML = Array.from({ length: 15 }, (_, i) => {
    const a = F.ans[i];
    return `<button class="va-cell ${a === 'still' ? 'va-s' : a === 'new' ? 'va-n' : ''} ${i === n ? 'va-cur' : ''}" type="button" data-act="farCell" data-n="${i}" aria-label="${i}">${a === 'still' ? '✓' : a === 'new' ? '✗' : i}</button>`;
  }).join('');
  lab.setReadout(`${n} / 14`, t.mainChanged, '', '#ffd166');
  const info = F.info && n >= 6 && n <= 8;
  lab.setState(info ? { emo: '🧩', title: t.state.far.title, lead: t.farInfo, body: t.state.far.lead, extra: '' } : { ...t.state.far, extra: '' });
}
render();
</script>
