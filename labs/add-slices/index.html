  if (v === 'take') drawTake(c, w, h, g, time); else if (v === 'split') drawSplit(c, w, h, g, time); else drawAdd(c, w, h, g, time);

  if (rv >= 0 && Math.min(L, n) >= n) { const tc = time - AD.t0 - (AD_START(n - 1) + AD_DUR); crown(c, g.C.x, g.C.y - g.C.R - 8, g.C.R * 0.22, 0.2 + 0.8 * backOut(tc / 0.5)); }
  cloth(c, g.C.x, g.C.y, g.C.R * 0.95, rv < 0 ? 0 : ease(rv / 0.7));
  // ghost pizza: slices of 1/(2n) are half as big
  if (AD.pick >= 0 && AD.opts[AD.pick] === 'den') {
    const e = rv - (AD_START(s - 1) + AD_DUR), al = e < 0 ? 0 : e < 0.4 ? e / 0.4 : e < 2.4 ? 1 : Math.max(0, 1 - (e - 2.4) / 0.5);
    if (al > 0.01) {
      const gx = g.X(0.5), gy = g.A.y, gr = g.W * 0.095;
      c.save(); c.globalAlpha = al * 0.85;
      c.beginPath(); c.arc(gx, gy, gr * 1.2, 0, TAU); c.fillStyle = 'rgba(255,255,255,.55)'; c.fill();
      for (let i = 0; i < 2 * n; i++) slice(c, gx, gy, gr, slotA(i, 2 * n), 2 * n, i, 1);
      c.restore(); c.save(); c.globalAlpha = al; pill(c, `1/${2 * n}`, gx, gy + gr + 20, w, h); c.restore();
    }
  }
  pill(c, `${a}/${n}`, g.A.x, g.A.y + g.A.R + 16, w, h); pill(c, `${b}/${n}`, g.B.x, g.B.y + g.B.R + 16, w, h);
  if (rv >= 0 && rv > 0.7) { pill(c, `${Math.min(L, n)}/${n}`, g.C.x, g.C.y + g.C.R + 14, w, h); if (showD && AD.dT > 0.9) pill(c, `${Math.max(0, L - n)}/${n}`, g.D.x, g.D.y + g.D.R + 14, w, h); }
}

function drawSplit(c, w, h, g, time) {
  const { n, t } = SP;
  plate(c, g.A); plate(c, g.B); plate(c, g.C);
  for (let i = 0; i < n; i++) { outline(c, g.C, n, i, i < t); outline(c, g.A, n, i, false); outline(c, g.B, n, i, false); }
  const hits = [], moving = [], cnt = { A: 0, B: 0, C: 0 };
  SP.pc.forEach((p, i) => {
    cnt[p.plate]++;
    const dst = pz(g[p.plate], p.slot, n), k = p.from ? (time - p.t0) / 0.5 : 1;
    const q = p.from && k < 1 ? mixPose(pz(g[p.from.plate], p.from.slot, n), dst, k, g.W * 0.1) : dst;
    (p.from && k < 1 ? moving : hits).push({ q, i, slot: p.slot });
  });
  SP.hits = [];
  for (const o of hits.concat(moving)) { slice(c, o.q.x, o.q.y, o.q.r, o.q.a, n, o.slot); const mid = o.q.a + Math.PI / n; SP.hits.push({ i: o.i, x: o.q.x + Math.cos(mid) * o.q.r * 0.55, y: o.q.y + Math.sin(mid) * o.q.r * 0.55, r: o.q.r * 0.5 + 12 }); }
  pill(c, `${cnt.A}/${n}`, g.A.x, g.A.y + g.A.R + 16, w, h); pill(c, `${cnt.B}/${n}`, g.B.x, g.B.y + g.B.R + 16, w, h); pill(c, `${cnt.C}/${n}`, g.C.x, g.C.y + g.C.R + 14, w, h);
}
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'split' || S.sec === 'unit' || !SP.hits) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  let best = null, bd = 1e9;
  for (const q of SP.hits) { const d = Math.hypot(q.x - x, q.y - y); if (d < q.r && d < bd) { bd = d; best = q; } }
  if (best) splitTap(best.i);
});
function splitTap(i) {
  const p = SP.pc[i], clock = now();
  if (clock - p.t0 < 0.25) return;
  if (p.plate === 'C') {
    const to = SP.send, used = new Set(SP.pc.filter((q) => q.plate === to).map((q) => q.slot)); let s = 0; while (used.has(s)) s++;
    p.from = { plate: 'C', slot: p.slot }; p.plate = to; p.slot = s;
  } else { p.from = { plate: p.plate, slot: p.slot }; p.plate = 'C'; p.slot = i; }
  p.t0 = clock; sfx.snap();
  const left = SP.pc.filter((q) => q.plate === 'C').length;
  if (left === 0) {
    const key = `${SP.pc.filter((q) => q.plate === 'A').length}+${SP.pc.filter((q) => q.plate === 'B').length}`;
    if (!SP.found.includes(key)) { SP.found.push(key); SP.msg = SP.found.length === SP.t + 1 ? 'all' : 'new'; sfx.good(); } else SP.msg = 'again';
  } else SP.msg = null;
  render();
}

function drawTake(c, w, h, g, time) {
  const { n, a } = TK, P = g.P, ct = g.cat, mouth = { x: ct.x, y: ct.y + ct.r * 0.45, r: P.R * PZ * 0.22 };
  plate(c, P);
  for (let i = 0; i < n; i++) outline(c, P, n, i, false);
  let open = 0; const moving = [];
  for (let k = 0; k < a; k++) {
    const j = a - 1 - k, st = TK.eat[j], home = pz(P, k, n);
    if (st === undefined || time < st) { slice(c, home.x, home.y, home.r, home.a, n, k); continue; }
    const p = (time - st) / 0.85;
    if (p >= 1) { open = Math.max(open, p < 1.35 ? Math.sin(Math.PI * Math.min(1, (p - 1) / 0.35)) * 0.5 : 0); continue; }
    open = Math.max(open, p > 0.45 ? Math.sin(Math.PI * (p - 0.45) / 0.8) : 0);
    moving.push({ q: mixPose(home, { x: mouth.x, y: mouth.y, r: mouth.r, a: home.a + 1.2 }, p, g.W * 0.14), k, al: p > 0.8 ? 1 - (p - 0.8) / 0.2 : 1 });
  }
  cat(c, ct.x, ct.y, ct.r, open);
  for (const o of moving) slice(c, o.q.x, o.q.y, o.q.r, o.q.a, n, o.k, Math.max(0, o.al));
  pill(c, TK.pick >= 0 ? `${a - TK.eat.length}/${n}` : `${a}/${n}`, P.x, P.y + P.R + 14, w, h);
}

function drawUnit(c, w, h, time) {
  const m = unitM(), n = unitN(), W = Math.min(w, h * 0.95), ox = (w - W) / 2;
  const cols = m <= 5 ? m : m <= 8 ? 4 : 5, rows = Math.ceil(m / cols), cw = (W - 16) / cols, rh = Math.min((h - 16) / rows, W * 0.5);
  const r = Math.max(10, Math.min(cw * 0.62, (rh - 36) * 0.95)), t0 = S.secT0;
  const sx = w / 2, sy = h * 0.5, sr = Math.min(W * 0.3, h * 0.3);
  const fade = 1 - ease((time - t0) / 0.5);
  if (fade > 0.01) { c.save(); c.globalAlpha = fade; plate(c, { x: sx, y: sy, R: sr / PZ }); c.restore(); }
  const top = (h - rows * rh) / 2;
  for (let i = 0; i < m; i++) {
    const col = i % cols, row = Math.floor(i / cols), rowCount = Math.min(cols, m - row * cols), x0 = (w - rowCount * cw) / 2;
    const ex = x0 + (col + 0.5) * cw, ey = top + row * rh + r + 10;
    const u = ease((time - t0 - 0.15 - i * 0.05) / 0.7);
    const q = { x: lerp(sx, ex, u), y: lerp(sy, ey, u) - Math.sin(Math.PI * u) * 14, r: lerp(sr, r, u), a: lerp(slotA(i % n, n), -Math.PI / 2 - Math.PI / n, u) };
    slice(c, q.x, q.y, q.r, q.a, n, i % n);
    if (u > 0.85) { c.save(); c.globalAlpha = (u - 0.85) / 0.15; pill(c, `1/${n}`, ex, ey + 20, w, h); c.restore(); }
  }
}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const stp = (g, k, label, v, lo, hi) => `<div class="as-stp"><span class="as-lbl">${esc(label)}</span><div>
  <button class="as-sb" data-act="step" data-g="${g}" data-k="${k}" data-s="-1" aria-label="−"${v <= lo ? ' disabled' : ''}>−</button><b>${v}</b>
  <button class="as-sb" data-act="step" data-g="${g}" data-k="${k}" data-s="1" aria-label="+"${v >= hi ? ' disabled' : ''}>+</button></div></div>`;
function stepVal(g, k, s) {
  const O = g === 'add' ? AD : g === 'split' ? SP : TK;
  if (k === 'n') {
    const i = clamp(NS.indexOf(O.n) + s, 0, NS.length - 1); O.n = NS[i];
    if (g === 'add') { AD.a = Math.min(AD.a, O.n); AD.b = Math.min(AD.b, O.n); }
    if (g === 'split') SP.t = Math.min(SP.t, O.n);
    if (g === 'take') { TK.a = Math.min(TK.a, O.n); TK.c = Math.min(TK.c, TK.a, O.n - 1); }
  } else if (g === 'add') O[k] = clamp(O[k] + s, 1, AD.n);
  else if (g === 'split') SP.t = clamp(SP.t + s, 2, SP.n);
  else if (k === 'a') { TK.a = clamp(TK.a + s, 1, TK.n); TK.c = Math.min(TK.c, TK.a, TK.n - 1); }
  else TK.c = clamp(TK.c + s, 1, Math.min(TK.a, TK.n - 1));
  S.sec = null;
  if (g === 'add') newAddOpts(); else if (g === 'split') resetSplit(); else newTakeOpts();
  sfx.tick();
}
function newProblem() {
  S.sec = null; sfx.click();
  if (lab.view === 'add') { AD.n = NS[rnd(0, 3)]; AD.a = rnd(1, AD.n - 1); AD.b = Math.random() < 0.3 ? rnd(Math.max(1, AD.n - AD.a + 1), AD.n) : rnd(1, Math.max(1, AD.n - AD.a)); newAddOpts(); }
  else if (lab.view === 'split') { SP.n = NS[rnd(0, 3)]; SP.t = rnd(2, SP.n); resetSplit(); }
  else { TK.n = NS[rnd(0, 3)]; TK.a = rnd(2, TK.n); TK.c = rnd(1, Math.min(TK.a, TK.n - 1)); newTakeOpts(); }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'step') stepVal(b.dataset.g, b.dataset.k, +b.dataset.s);
  else if (act === 'new') newProblem();
  else if (act === 'opt') {
    const i = +b.dataset.i;
    if (v === 'add') { AD.pick = i; AD.t0 = now(); AD.lastL = 0; (AD.opts[i] === 'ok' ? sfx.good : sfx.bad)(); }
    else { TK.pick = i; TK.eat = Array.from({ length: TK.c }, (_, j) => now() + 0.2 + j * 0.6); (TK.opts[i] === 'ok' ? sfx.good : sfx.bad)(); }
    S.sec = null; showStage();
  } else if (act === 'send') { SP.send = b.dataset.p; sfx.click(); }
  else if (act === 'back') { resetSplit(); sfx.click(); }
  else if (act === 'eat') { if (TK.a - TK.eat.length > 0) { TK.eat.push(now()); sfx.click(); } }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'whole') {
      if (v !== 'add') { lab.view = 'add'; lab.renderChrome(); }
      Object.assign(AD, { n: 8, a: 5, b: 6 }); AD.dT = 0; newAddOpts(); AD.pick = AD.opts.indexOf('ok'); AD.t0 = now(); AD.lastL = 0; S.sec = 'whole'; sfx.click(); showStage();
    } else { S.sec = S.sec === 'unit' ? null : 'unit'; S.secT0 = now(); sfx.click(); }
  }
  render();
});
const secRow = (t) => {
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="as-sec"><div class="chips">${sc('whole', '👑')}${sc('unit', '🧩')}</div></div>`;
};
const optBtns = (kinds, fracOf, pick, good) => `<div class="as-opts">${kinds.map((k, i) => { const [x, y] = fracOf(k); return pick < 0
  ? `<button class="as-opt" data-act="opt" data-i="${i}" aria-label="${x}/${y}">${fr(x, y)}</button>`
  : `<button class="as-opt ${k === good ? 'good' : i === pick ? 'bad' : ''}" disabled>${fr(x, y)}</button>`; }).join('')}</div>`;

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  let h = '';
  if (v === 'add') {
    const ans = AD.pick >= 0 && S.sec !== 'whole', ok = AD.pick >= 0 && AD.opts[AD.pick] === 'ok';
    if (S.sec !== 'whole') h += AD.pick < 0 ? `<div class="as-q">${esc(t.q)}</div>` : `<div class="as-v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.no)}</div>`;
    if (S.sec !== 'whole') h += optBtns(AD.opts, addFrac, AD.pick, 'ok');
    h += `<div class="as-steps">${stp('add', 'n', t.lbl.n, AD.n, 4, 8)}${stp('add', 'a', t.lbl.a, AD.a, 1, AD.n)}${stp('add', 'b', t.lbl.b, AD.b, 1, AD.n)}</div>`;
    h += `<div class="row2"><button class="as-ch" data-act="new">${esc(t.newSum)}</button></div>`;
    void ans;
  } else if (v === 'split') {
    const ways = SP.t + 1, found = [...SP.found].sort((p, q) => parseInt(p) - parseInt(q));
    h += `<div class="as-found">${found.map((k) => `<span>${k}</span>`).join('') || `<em>${esc(t.split.next)}</em>`}</div>`;
    h += `<div class="row2"><span class="as-lbl">${esc(t.sendTo)}</span><div class="card seg small">${['A', 'B'].map((p) => `<button data-act="send" data-p="${p}" class="${SP.send === p ? 'on' : ''}">${esc(p === 'A' ? t.plA : t.plB)}</button>`).join('')}</div>
      <button class="as-ch" data-act="back">${esc(t.putBack)}</button></div>`;
    h += `<div class="as-steps" >${stp('split', 'n', t.lbl.n, SP.n, 4, 8)}${stp('split', 't', t.lbl.t, SP.t, 2, SP.n)}</div>`;
    h += `<div class="row2"><button class="as-ch" data-act="new">${esc(t.newPlate)}</button></div>`;
    void ways;
  } else {
    const rem = TK.a - TK.eat.length;
    if (TK.pick < 0) h += `<div class="as-q">${esc(t.take.askLead(TK.n, TK.a, TK.c, t.sl))}</div>`;
    else h += `<div class="as-v ${TK.opts[TK.pick] === 'ok' ? 'ok' : 'no'}">${esc(TK.opts[TK.pick] === 'ok' ? t.right : t.no)}</div>`;
    h += optBtns(TK.opts, takeFrac, TK.pick, 'ok');
    if (TK.pick >= 0) h += `<div class="row2"><button class="as-ch" data-act="eat"${rem > 0 ? '' : ' disabled'}>${esc(t.eatMore)}</button></div>`;
    h += `<div class="as-steps">${stp('take', 'n', t.lbl.n, TK.n, 4, 8)}${stp('take', 'a', t.lbl.p, TK.a, 1, TK.n)}${stp('take', 'c', t.lbl.c, TK.c, 1, Math.min(TK.a, TK.n - 1))}</div>`;
    h += `<div class="row2"><button class="as-ch" data-act="new">${esc(t.newPlate)}</button></div>`;
  }
  $('ctrlBody').innerHTML = h + secRow(t);
  paintInfo();
}

// readout, state card and facts: also called while the slices land
function paintInfo() {
  const t = T[lang], v = lab.view, sl = t.sl;
  lab.setGlow('rgba(235, 150, 60, .26)');
  lab.setFacts([{ emo: FACT_EMO[v], text: t.facts[v], src: FACT_SRC[v] }]);
  if (S.sec === 'unit') {
    const m = unitM(), n = unitN(), terms = Array.from({ length: Math.min(m, 4) }, () => fr(1, n)).join(' + ') + (m > 4 ? ' + …' : '');
    lab.setReadout(`${fr(m, n)} = ${terms}`, '', '', ACC);
    lab.setState({ emo: '🧩', title: t.unitS.title, lead: t.unitS.lead(m, n, sl), body: '', extra: '' });
    return;
  }
  if (v === 'add') {
    const { a, b, n } = AD, s = a + b, L = adLanded(now());
    if (AD.pick < 0) {
      lab.setReadout(`${fr(a, n)} + ${fr(b, n)} = ?`, '', '', ACC);
      lab.setState({ emo: '🤔', title: t.add.askTitle, lead: t.add.askLead, body: '', extra: '' });
      return;
    }
    lab.setReadout(`${fr(a, n)} + ${fr(b, n)} = ${L >= s ? fr(s, n) : L > 0 ? fr(L, n) + ' …' : '…'}`, '', '', ACC);
    const kind = AD.opts[AD.pick], more = s > n ? t.add.more(s, n) : s === n ? t.add.whole(n) : '';
    if (S.sec === 'whole') lab.setState({ emo: '👑', title: t.wholeS.title, lead: t.wholeS.lead(s, n), body: t.wholeS.body(s, n), extra: '' });
    else if (kind === 'ok') lab.setState({ emo: '✅', title: t.right, lead: t.add.ok(a, b, s, n, sl), body: more, extra: '' });
    else lab.setState({ emo: '🤔', title: t.no, lead: t.add[kind](a, b, s, n), body: more, extra: '' });
  } else if (v === 'split') {
    const { n, t: tg } = SP, x = SP.pc.filter((q) => q.plate === 'A').length, y = SP.pc.filter((q) => q.plate === 'B').length, left = tg - x - y;
    lab.setReadout(`${fr(x, n)} + ${fr(y, n)}${left === 0 ? ` = ${fr(tg, n)}` : ''}`, t.split.found(SP.found.length, tg + 1), left === 0 ? '✓' : `${left}/${tg}`, ACC);
    const m = SP.msg ? t.split[SP.msg] : '';
    lab.setState({ emo: SP.msg === 'all' ? '🏆' : '✂️', title: SP.msg ? m : t.split.title, lead: t.split.lead(tg, n), body: left > 0 ? t.split.left(left) : '', extra: '' });
  } else {
    const { n, a, c } = TK, e = TK.eat.length, r = a - e;
    if (TK.pick < 0) {
      lab.setReadout(`${fr(a, n)} − ${fr(c, n)} = ?`, '', '', ACC);
      lab.setState({ emo: '🤔', title: t.take.askTitle, lead: t.take.askLead(n, a, c, sl), body: '', extra: '' });
      return;
    }
    lab.setReadout(`${fr(a, n)} − ${fr(e, n)} = ${fr(r, n)}`, '', '', ACC);
    const kind = TK.opts[TK.pick], rc = a - c;
    const body = r === 0 ? t.take.empty(n) : e > c ? t.take.more : '';
    if (e > c) lab.setState({ emo: '😺', title: `${a}/${n} − ${e}/${n} = ${r}/${n}`, lead: t.take.ok(a, e, r, n, sl), body, extra: '' });
    else if (kind === 'ok') lab.setState({ emo: '✅', title: t.right, lead: t.take.ok(a, c, rc, n, sl), body, extra: '' });
    else lab.setState({ emo: '🤔', title: t.no, lead: kind === 'zero' ? t.take.zero(rc, n) : t.take.nc(rc, n), body, extra: '' });
  }
}
render();
</script>
