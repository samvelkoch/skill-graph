  c.save(); c.translate(X0, Y0); c.beginPath(); c.roundRect(0, 0, w, h, 16); c.clip();
  const wall = c.createLinearGradient(0, 0, 0, h * .5); wall.addColorStop(0, '#5f452a'); wall.addColorStop(1, '#3a2917'); c.fillStyle = wall; c.fillRect(0, 0, w, h);
  c.strokeStyle = 'rgba(20,10,0,.25)'; c.lineWidth = 1; for (let k = 1; k < 9; k++) { c.beginPath(); c.moveTo(w * k / 9, 0); c.lineTo(w * k / 9, h * .45); c.stroke(); }
  const cg = c.createRadialGradient(w * .5, h * .32, 4, w * .5, h * .38, w * .62); cg.addColorStop(0, 'rgba(255,214,120,.55)'); cg.addColorStop(1, 'rgba(255,214,120,0)'); c.fillStyle = cg; c.fillRect(0, 0, w, h);
  const t0 = h * .42, t1 = h * .86;
  c.beginPath(); c.moveTo(w * .12, t0); c.lineTo(w * .88, t0); c.lineTo(w * .97, t1); c.lineTo(w * .03, t1); c.closePath();
  const tg = c.createLinearGradient(0, t0, 0, t1); tg.addColorStop(0, '#b5803f'); tg.addColorStop(1, '#85562a'); c.fillStyle = tg; c.fill(); c.strokeStyle = '#3d2610'; c.lineWidth = 1.5; c.stroke();
  c.save(); c.clip(); c.strokeStyle = 'rgba(60,30,5,.3)'; c.lineWidth = 1; for (let k = 1; k < 5; k++) { const yy = lerp(t0, t1, k / 5); c.beginPath(); c.moveTo(0, yy); c.lineTo(w, yy); c.stroke(); } c.restore();
  c.fillStyle = '#5d3a1b'; c.beginPath(); c.moveTo(w * .03, t1); c.lineTo(w * .97, t1); c.lineTo(w * .97, t1 + h * .05); c.lineTo(w * .03, t1 + h * .05); c.closePath(); c.fill(); c.stroke();
  const groups = [['🍞', .2, 2, 6, [[-.62, -.5], [0, -.62], [.62, -.5], [-.62, .4], [0, .3], [.62, .4]]], ['🍖', .5, 0, 3, [[-.5, 0], [.5, 0], [0, -.2]]], ['🍺', .8, 1, 4, [[-.55, -.3], [.55, -.3], [-.55, .55], [.55, .55]]]];
  const rx = w * .13, ry = h * .075, py = (t0 + t1) / 2 + h * .02, size = clamp(w * .07, 20, 30);
  for (const [em, gx, mn, mx, pos] of groups) {
    const cx = w * gx; c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(cx + 2, py + 4, rx, ry, 0, 0, TAU); c.fill();
    const pg = c.createLinearGradient(cx - rx, py - ry, cx + rx, py + ry); pg.addColorStop(0, '#fbf6e8'); pg.addColorStop(1, '#d8cfb6'); c.fillStyle = pg; c.strokeStyle = '#8a7a58'; c.lineWidth = 1.3;
    c.beginPath(); c.ellipse(cx, py, rx, ry, 0, 0, TAU); c.fill(); c.stroke();
    const cnt = lerp(mn, mx, p);
    pos.forEach(([ox, oy], i) => { const s = easeBack(cnt - i); if (s <= .02) return; c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(cx + ox * rx * .8, py + oy * ry * .8 + size * .35, size * .38 * s, size * .12 * s, 0, 0, TAU); c.fill(); emoji(c, em, cx + ox * rx * .8, py + oy * ry * .8 - size * .1 * s, size * s); });
  }
  pill(c, `🪙 ${Math.round(1350 + 50 * p)}`, w / 2, 20, { align: 'c', size: 15, pad: 20 });
  c.restore();
}
function drawRoseChart(c, x, y, w, h, t) { // secret b: no numbers, only the direction
  c.save(); c.fillStyle = 'rgba(14,17,28,.88)'; c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.beginPath(); c.roundRect(x, y, w, h, 14); c.fill(); c.stroke();
  const L = x + 24, R = x + w - 24, Tp = y + 34, B = y + h - 24, p = ease(S.tb);
  c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.textBaseline = 'middle'; c.textAlign = 'center';
  c.fillText('1350', L, B + 12); c.fillText('1400', R, B + 12);
  c.strokeStyle = 'rgba(130,145,190,.25)'; c.beginPath(); c.moveTo(L, B); c.lineTo(R, B); c.stroke();
  const ex = lerp(L, R, p), ey = lerp(B - 4, Tp + 6, p);
  if (p > .02) {
    c.strokeStyle = '#e6c25a'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(L, B - 4); c.lineTo(ex, ey); c.stroke();
    const a = Math.atan2(ey - (B - 4), ex - L); c.fillStyle = '#e6c25a'; c.beginPath();
    c.moveTo(ex + Math.cos(a) * 10, ey + Math.sin(a) * 10); c.lineTo(ex + Math.cos(a + 2.5) * 12, ey + Math.sin(a + 2.5) * 12); c.lineTo(ex + Math.cos(a - 2.5) * 12, ey + Math.sin(a - 2.5) * 12); c.closePath(); c.fill();
  }
  c.restore();
  pill(c, t.rose, x + 10, y + 15, { align: 'l', minX: x + 4, maxX: x + w - 4 });
}
function drawWageChart(c, x, y, w, h, t, tb) {
  if (tb) { drawRoseChart(c, x, y, w, h, t); return; }
  const x1 = 1390, ymax = 150, yrNow = S.yr;
  c.save(); c.fillStyle = 'rgba(14,17,28,.88)'; c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.beginPath(); c.roundRect(x, y, w, h, 14); c.fill(); c.stroke();
  const L = x + 38, R = x + w - 16, Tp = y + 32, B = y + h - 22, pw = R - L, ph = B - Tp;
  const X = (yr) => L + (yr - 1340) / (x1 - 1340) * pw, Y = (v) => B - (clamp(v, 90, ymax) - 90) / (ymax - 90) * ph;
  c.font = '700 12px Nunito, sans-serif'; c.textBaseline = 'middle'; c.lineWidth = 1;
  c.textAlign = 'right'; c.fillStyle = '#98A0B8';
  for (const v of [100, 120, 140]) { c.strokeStyle = v === 100 ? 'rgba(200,210,240,.45)' : 'rgba(130,145,190,.2)'; c.setLineDash(v === 100 ? [4, 4] : []); c.beginPath(); c.moveTo(L, Y(v)); c.lineTo(R, Y(v)); c.stroke(); c.fillText(String(v), L - 6, Y(v)); }
  c.setLineDash([]); c.textAlign = 'center';
  for (let yr = 1340; yr <= x1; yr += 10) c.fillText(String(yr), X(yr), B + 11);
  {
    c.save(); c.beginPath(); c.rect(L, Tp - 4, pw, ph + 4); c.clip();
    for (const [a, b] of S.lawIv) { const e = Math.min(b ?? S.yr, S.yr); if (e > a) { c.fillStyle = 'rgba(138,115,80,.3)'; c.fillRect(X(a), Tp, X(e) - X(a), ph); } }
    if (S.lawEver && S.yr > 1377) { const e = Math.min(S.yr, 1381); c.fillStyle = 'rgba(232,150,50,.3)'; c.fillRect(X(1377), Tp, X(e) - X(1377), ph); }
    if (S.revolt) { c.strokeStyle = '#ef5a4a'; c.lineWidth = 2; c.beginPath(); c.moveTo(X(1381), Tp); c.lineTo(X(1381), B); c.stroke(); }
    c.restore();
    if (S.lawIv.length) emoji(c, '📜', X(S.lawIv[0][0]) + 2, Tp + 8, 14);
    if (S.lawEver && S.yr > 1377) emoji(c, '💰', X(1377) + 8, Tp + 8, 13);
    if (S.revolt) emoji(c, '🔥', Math.min(X(1381) + 2, R - 8), Tp + 8, 15);
  }
  const f = wageAt, pts = [];
  for (let yr = 1340; yr <= yrNow + 1e-6; yr += .25) pts.push([X(yr), Y(f(Math.min(yr, yrNow)))]);
  if (S.lawIv.length) { // what the wage would be without the law
    c.strokeStyle = 'rgba(230,194,90,.55)'; c.lineWidth = 1.6; c.setLineDash([4, 4]); c.beginPath();
    let first = true; for (let yr = S.lawIv[0][0]; yr <= S.yr + 1e-6; yr += .25) { const px = X(yr), py = Y(freeWage(Math.min(yr, S.yr))); if (first) { c.moveTo(px, py); first = false; } else c.lineTo(px, py); }
    c.stroke(); c.setLineDash([]);
  }
  if (pts.length > 1) {
    c.strokeStyle = '#e6c25a'; c.lineWidth = 3; c.lineJoin = 'round'; c.lineCap = 'round'; c.beginPath(); pts.forEach(([a, b], i) => (i ? c.lineTo(a, b) : c.moveTo(a, b))); c.stroke();
    const [ex, ey] = pts[pts.length - 1];
    c.fillStyle = '#e6c25a'; c.strokeStyle = '#fff'; c.lineWidth = 1.6; c.beginPath(); c.arc(ex, ey, 4.4, 0, TAU); c.fill(); c.stroke();
    c.restore();
    pill(c, String(Math.round(f(Math.min(yrNow, x1)))), ex + 9, ey - 13, { align: 'l', minX: x + 4, maxX: x + w - 4, fill: 'rgba(110,80,10,.92)', pad: 10 });
  } else c.restore();
  pill(c, t.wageChart, x + 10, y + 15, { align: 'l', minX: x + 4, maxX: x + w - 4 });
}

// --- drawing: the timeline under the chain ------------------------------------------------------------------------
function drawTimeline(c, w, h, t) {
  const H = 190, y0 = h - H - 8, x0 = 8, ww = w - 16, L = x0 + 12, R = x0 + ww - 12, pw = R - L;
  const X = (yr) => L + (yr - 1330) / 130 * pw;
  c.save(); c.fillStyle = 'rgba(14,17,28,.88)'; c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.beginPath(); c.roundRect(x0, y0, ww, H, 14); c.fill(); c.stroke();
  c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let yr = 1330; yr <= 1460; yr += 10) { const big = yr % 20 === 0; c.strokeStyle = big ? 'rgba(130,145,190,.28)' : 'rgba(130,145,190,.12)'; c.lineWidth = 1; c.beginPath(); c.moveTo(X(yr), y0 + 28); c.lineTo(X(yr), y0 + H - 8); c.stroke(); if (big) c.fillText(String(yr), clamp(X(yr), x0 + 16, x0 + ww - 16), y0 + 15); }
  EVENTS.forEach(([k, a, b, col], i) => {
    const ry = y0 + 46 + i * 27, bx = X(a), bw = Math.max(7, X(b) - X(a)), name = t.timeline[k];
    c.fillStyle = col; c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = 1.2; c.beginPath(); c.roundRect(bx, ry - 6, bw, 12, 6); c.fill(); c.stroke();
    c.save(); c.font = '800 12px Nunito, sans-serif'; const lw = c.measureText(name).width + 12; c.restore();
    if (bw > lw + 10) pill(c, name, bx + 5, ry, { align: 'l', minX: x0 + 4, maxX: x0 + ww - 4, fill: 'rgba(16,13,10,.55)' });
    else if (bx + bw + 6 + lw <= x0 + ww - 4) pill(c, name, bx + bw + 6, ry, { align: 'l', minX: x0 + 4, maxX: x0 + ww - 4 });
    else pill(c, name, bx - 6, ry, { align: 'r', minX: x0 + 4, maxX: x0 + ww - 4 });
  });
  c.restore();
}

// --- the loop ---------------------------------------------------------------------------------------------------
function stepSpread(dt) {
  if (!S.playing) return;
  S.tm = Math.min(MONTH1, S.tm + dt * 4); S.maxT = Math.max(S.maxT, S.tm);
  if (S.tm >= MONTH1) S.playing = false;
}
function stepVillage(dt) {
  if (S.plague === 1) { S.pt += dt; S.yr = 1347 + 4 * ease(S.pt / 3.2); if (S.pt >= 3.4) { S.plague = 2; S.yr = 1351; } }
  if (S.law && S.plague === 2 && !S.revolt) S.yr = Math.min(1381, S.yr + dt * 4.5);
  const tgt = S.law ? angerAt(S.yr) : 0;
  S.anger += clamp(tgt - S.anger, -dt * .5, dt * .6);
  if (S.law && S.yr >= 1381 && S.anger >= .985 && !S.revolt) { S.revolt = true; S.rv = 0; sfx.push(); }
  if (S.revolt) S.rv = Math.min(1, S.rv + dt / 4.5);
  if (secB()) S.tb = Math.min(1, S.tb + dt / 7);
}
const keyOf = () => (lab.view === 'spread' ? [Math.floor(S.tm), S.playing, S.p1, S.p2, S.sec, S.maxT >= LAST].join()
  : lab.view === 'village' ? [S.plague, Math.round(curWage()), S.law, S.revolt, S.sec, S.pw, Math.round(S.yr), secB() ? Math.round(S.tb * 50) : 0].join() : [S.checked, S.fixed, S.sel].join());

// --- controls ---------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function toggleLaw() {
  if (S.plague !== 2) return;
  if (!S.law) {
    if (S.yr >= 1381) { S.yr = 1351; S.lawIv = []; S.revolt = false; S.rv = 0; }
    S.law = true; S.lawEver = true; S.lawIv.push([S.yr, null]);
  } else { S.law = false; const iv = S.lawIv[S.lawIv.length - 1]; if (iv) iv[1] = S.yr; S.revolt = false; S.rv = 0; }
  sfx.click();
}
function tapCard(i) {
  if (S.checked) return;
  if (S.sel === null) S.sel = i;
  else if (S.sel === i) S.sel = null;
  else { [S.order[S.sel], S.order[i]] = [S.order[i], S.order[S.sel]]; S.sel = null; sfx.snap(); return; }
  sfx.tick();
}
function checkChain() {
  if (S.checked) { S.order = derange(); S.sel = null; S.checked = false; S.fixed = false; sfx.click(); return; }
  S.score = S.order.filter((id, i) => id === i).length; S.checked = true; S.fixed = false; S.sel = null;
  (S.score === 6 ? sfx.good : sfx.bad)();
  setTimeout(() => { S.fixed = true; render(); }, 750);
  const r = $('stage').getBoundingClientRect(); if (r.top < 0) $('stage').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; if (S.sec === 'b') S.tb = 0; sfx.click();
  } else if (b.classList.contains('bd-chip')) {
    const i = +b.dataset.i, host = b.closest('.bd-ask').id;
    if (host === 'bdAsk1' && S.p1 === null) S.p1 = i; else if (host === 'bdAsk2' && S.p2 === null) S.p2 = i; else if (host === 'bdAskV' && S.pw === null) S.pw = i; else return;
    (i === 0 ? sfx.good : sfx.bad)();
  } else if (b.id === 'bdPlay') {
    if (S.p1 === null) return;
    if (S.playing) S.playing = false; else { if (S.tm >= MONTH1) { S.tm = MONTH0; } S.playing = true; showStage(); }
    sfx.click();
  } else if (b.id === 'bdPlague') {
    if (S.pw === null || S.plague > 0) return;
    S.plague = 1; S.pt = 0; sfx.push(); showStage();
  } else if (b.id === 'bdLaw') toggleLaw();
  else return;
  render();
});
$('bdSl').addEventListener('input', (ev) => { if (S.p1 === null) return; S.tm = +ev.target.value + MONTH0; S.playing = false; S.maxT = Math.max(S.maxT, S.tm); render(); });
$('bdChain').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'bdCheck') checkChain(); else if (b.dataset.i !== undefined) tapCard(+b.dataset.i);
  render();
});

// --- one render per change: controls, readout and the state card ------------------------------------------------------
const setHTML = (el, html) => { if (el._h !== html) { el._h = html; el.innerHTML = html; } };
const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
const secChip = (k, emo, on) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${on ? 'on' : ''}" data-sec="${k}">${secret.unlocked() ? `${emo} ${esc(T[lang].secrets[k][0])}` : '🔒 ???'}</button>`;
function askHTML(t, q, texts, order, picked, ok, done, why, hint) {
  const opts = order.map((i) => `<button class="bd-chip${picked === i ? ' on' : ''}${done && i === ok ? ' good' : ''}${done && picked === i && i !== ok ? ' bad' : ''}" data-i="${i}"${picked !== null ? ' disabled' : ''}>${esc(texts[i])}</button>`).join('');
  const vd = done ? `<div class="bd-vd ${picked === ok ? 'good' : 'bad'}"><b>${esc(picked === ok ? t.right : t.notQuite)}</b>${esc(why)}</div>` : '';
  return `<p class="bd-q">${esc(q)}</p><div class="bd-opts">${opts}</div>${vd}${hint ? `<p class="bd-h">${esc(hint)}</p>` : ''}`;
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  show('bdS', v === 'spread'); show('bdV', v === 'village'); show('bdC', v === 'chain'); show('bdChain', v === 'chain');
  if (v === 'spread') renderSpread(t); else if (v === 'village') renderVillage(t); else renderChain(t);
  S.rk = keyOf();
}
function renderSpread(t) {
  const cm = Math.floor(S.tm), locked = S.p1 === null, done1 = !locked && S.maxT >= LAST;
  lab.setGlow('rgba(179, 38, 30, .22)');
  setHTML($('bdAsk1'), askHTML(t, t.qFirst, t.optsFirst, S.perm1, S.p1, 0, done1, t.firstWhy, locked ? t.pickFirst : ''));
  show('bdAsk2', done1);
  setHTML($('bdAsk2'), done1 ? askHTML(t, t.qPorts, t.optsPorts, S.perm2, S.p2, 0, S.p2 !== null, t.portsWhy, '') : '');
  $('bdPlay').textContent = S.playing ? `⏸ ${t.pause}` : `▶ ${t.play}`; $('bdPlay').disabled = locked;
  const sl = $('bdSl'); sl.disabled = locked; if (+sl.value !== cm - MONTH0) sl.value = cm - MONTH0; sl.setAttribute('aria-label', dateOf(cm));
  setHTML($('bdSecA'), secChip('a', '🐀', secA()));
  lab.setReadout(dateOf(cm), t.reached(countAt(cm), NC), '', '#b3261e');
  const st = t.state.spread;
  if (secA()) lab.setState({ emo: '🐀', title: t.secrets.a[0], lead: t.secrets.a[1], body: '' });
  else lab.setState({ emo: st.emo, title: st.title, lead: S.p2 !== null ? st.lead : '', body: S.maxT >= LAST ? st.body : '' });
  lab.setFacts(t.facts.spread);
}
function renderVillage(t) {
  const done = S.plague === 2, locked = S.pw === null;
  lab.setGlow('rgba(230, 194, 90, .2)');
  setHTML($('bdAskV'), askHTML(t, t.qWage, t.optsWage, S.permW, S.pw, 0, done && !locked, t.wageWhy, locked ? t.pickFirstV : ''));
  $('bdPlague').textContent = t.plagueComes; $('bdPlague').disabled = locked || S.plague > 0;
  const law = $('bdLaw'); law.style.display = S.plague >= 1 ? 'inline-flex' : 'none'; law.disabled = !done; law.classList.toggle('on', S.law); law.setAttribute('aria-checked', S.law ? 'true' : 'false'); $('bdLawT').textContent = t.lordsLaw;
  setHTML($('bdSecB'), secChip('b', '🪙', secB()));
  if (secB()) lab.setReadout(String(Math.round(1350 + 50 * S.tb)), t.rose, '', '#e6c25a');
  else lab.setReadout(String(Math.round(curWage())), t.wageIndex, S.revolt ? t.revolt : '', '#e6c25a');
  const st = t.state.village;
  if (secB()) lab.setState({ emo: '🪙', title: t.secrets.b[0], lead: t.secrets.b[1], body: '' });
  else if (S.plague === 0) lab.setState({ emo: '🤔', title: t.qWage, lead: '', body: '' });
  else lab.setState({ emo: st.emo, title: st.title, lead: done ? st.lead : '', body: done ? st.body : '' });
  lab.setFacts(done ? t.facts.village : []);
}
function chainHTML(t) {
  let h = '';
  for (let i = 0; i < 6; i++) {
    const id = S.order[i], right = S.checked && id === i, wrong = S.checked && id !== i, shown = wrong && S.fixed ? i : id;
    const cls = ['bd-card', S.sel === i && !S.checked ? 'sel' : '', right ? 'lock' : '', wrong && !S.fixed ? 'wrong' : '', wrong && S.fixed ? 'fix' : ''].filter(Boolean).join(' ');
    h += `<div class="bd-row"><div class="bd-num">${i + 1}</div><button class="${cls}" data-i="${i}"${S.checked ? ' disabled' : ''}><span class="e">${EMO[shown]}</span><span class="x">${esc(t.cards[shown])}</span>${right ? '<span class="bd-tick">✓</span>' : ''}</button></div>`;
    if (i < 5) h += `<div class="bd-link${S.checked && S.order[i] === i && S.order[i + 1] === i + 1 ? ' on' : ''}"></div>`;
  }
  return `${h}<div style="text-align:center;margin-top:14px"><button class="btn" id="bdCheck">${esc(S.checked ? t.again : t.check)}</button></div>`;
}
function renderChain(t) {
  lab.setGlow('rgba(230, 150, 70, .2)');
  setHTML($('bdChain'), chainHTML(t));
  $('bdCHint').textContent = S.checked ? '' : t.chainHint; $('bdCHint').style.display = S.checked ? 'none' : '';
  lab.setReadout(S.checked ? `${S.score} / 6` : '? / 6', t.linksRight, '', '#e8873a');
  const st = t.state.chain;
  lab.setState({ emo: st.emo, title: st.title, lead: S.checked ? st.lead : '', body: S.checked ? st.body : '' });
  lab.setFacts(S.checked ? t.facts.chain : []);
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w;
  const v = lab.view, t = T[lang];
  if (v === 'spread') { stepSpread(dt); drawSpread(c, w, h, dt, time); }
  else if (v === 'village') {
    stepVillage(dt);
    const tb = secB(), chartH = clamp(h * .34, 110, 190), sh = h - chartH - 8;
    if (tb) drawTable(c, 0, 0, w, sh, S.tb, time); else drawScene(c, 0, 0, w, sh, time, t);
    drawWageChart(c, 0, sh + 8, w, chartH, t, tb);
  } else drawTimeline(c, w, h, t);
  const k = keyOf(); if (k !== S.rk) render();
});
render();
</script>
