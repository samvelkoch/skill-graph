// --- numbers -------------------------------------------------------------------------------------------------
// Fling model: the falling box (M tonnes, 6 m drop, half of the energy useful) speeds up the stone (m kg); the heavier the stone,
// the less the speed. v = LEVER * sqrt(2 g h * eff * M / (M + k m)); LEVER = sqrt(50) ≈ 7.07 is the speed gain of the long arm
// and the sling (without it the stone would fly about 5 m). Range at 45 degrees: v² sin(2 * 45°) / g.
const W = 400, H = 300, GY = 232;                       // design box of the picture and the ground line
const G = 9.81, DROP = 6, EFF = 0.5, KS = 25, LEVER2 = 50;
const STONES = [15, 50, 100], STONE_R = { 15: 3.4, 50: 4.9, 100: 6.5 };
const WALL_D = 220, WX = 312, MOATW = 26, WH = 80;       // the wall in the Fling picture: 220 m away
const PULL_KG = 15;                                      // one puller ≈ 15 kg of falling weight (≈ 300 N over 3 m)
function range(Mt, m) {                                  // Mt tonnes of falling weight, m kg stone
  const M = Mt * 1000, q = M / (M + KS * m);
  const v = Math.sqrt(LEVER2 * 2 * G * DROP * EFF * q);
  return { v, R: v * v / G };
}
const rad = (d) => d * Math.PI / 180;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const eOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);
const eIO = (t) => { t = clamp01(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, r)); };
const ln = (c, x0, y0, x1, y1) => { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); };

// the beam of the trebuchet (angles in radians, measured like on a graph: 90° = straight up)
const B0 = rad(228), B1 = rad(40), B2 = rad(14);         // long arm: cocked, release, after the swing
const S0 = rad(234.4), S1 = rad(20), S2 = rad(-35);      // sling: lying on the ground, at release, flapping after
const S0n = rad(-125.6);                                 // the same direction as S0, for the way back
function trebGeom(b, s, sc = 1, bx = 0) {
  const px = 78 + bx, py = GY - 72 * sc, L1 = 64 * sc, L2 = 16 * sc, LS = 30 * sc;
  const T1 = [px + L1 * Math.cos(b), py - L1 * Math.sin(b)];
  const Sh = [px - L2 * Math.cos(b), py + L2 * Math.sin(b)];
  return { px, py, sc, T: T1, Sh, S: [T1[0] + LS * Math.cos(s), T1[1] - LS * Math.sin(s)] };
}
const XR = trebGeom(B1, S1).S[0];                        // the stone leaves the sling here: 0 m
const KPX = (WX - XR) / WALL_D;                          // picture pixels per metre
const TH_HOLD = 0.3, TH_SWING = 0.75, TH_SETTLE = 0.8, TH_RESET = 1.1, TH_FLY = 1.6, TH_REL = TH_HOLD + TH_SWING;
function poseAt(t) {                                     // beam and sling t seconds after the latch is let go
  if (t < TH_HOLD) return { b: B0, s: S0, ph: 0, p: 0 };
  if (t < TH_REL) { const p = (t - TH_HOLD) / TH_SWING; return { b: B0 + (B1 - B0) * Math.pow(p, 1.6), s: S0 + (S1 - S0) * p * p * p, ph: 1, p }; }
  const q = t - TH_REL;
  if (q < TH_SETTLE) { const e = eOut(q / 0.7); return { b: B1 + (B2 - B1) * e, s: S1 + (S2 - S1) * e, ph: 2, p: 1 }; }
  const r = eIO((q - TH_SETTLE) / TH_RESET);
  return { b: B2 + (B0 - B2) * r, s: S2 + (S0n - S2) * r, ph: 3, p: 1 - r };
}

// --- the throw: a queue of throws, one at a time --------------------------------------------------------------
function enqueue(o) { TH.queue.push(o); }
function startThrow(o) {
  const gi = o.giant ? { sc: 1.35, bx: 14 } : { sc: 1, bx: 0 };
  const Mt = o.kind === 'r' ? o.n * PULL_KG / 1000 : o.M, r = range(Mt, o.m), rel = trebGeom(B1, S1, gi.sc, gi.bx).S, rs = STONE_R[o.m];
  const th = { ...o, ...gi, t: 0, v: r.v, R: r.R, rel: false, landed: false, xs: rel[0], ys: rel[1], rs, xl: XR + Math.min(r.R, 295) * KPX, yg: GY - rs };
  th.hit = th.R >= WALL_D;                               // the arc reaches the wall (it would fly on to 220 m or further)
  th.tauEnd = th.hit ? clamp01((WX - rs - 1 - th.xs) / (th.xl - th.xs)) : 1;
  th.fly = TH_FLY * th.tauEnd;
  th.end = TH_REL + TH_SETTLE + TH_RESET;
  TH.cur = th;
  render();
}
// the arc: the speed comes from the model, the height by gravity (45°), drawn on top of the straight line from release height to the ground
function flightXY(th, tau) {
  const vy = th.v * Math.SQRT1_2, tf = 2 * vy / G, t = tau * tf;
  const ym = vy * t - 0.5 * G * t * t;                   // metres above the release level
  return [lerp(th.xs, th.xl, tau), lerp(th.ys, th.yg, tau) - ym * KPX];
}
function land(th) {
  th.landed = true;
  const [x, y] = flightXY(th, th.tauEnd);
  if (th.hit) {
    spawn('chip', x, y, 9); spawn('dust', x, y, 6); spawn('spark', x, y, 5);
    TH.crack = Math.min(1, TH.crack + 0.5); TH.shake = 1; TH.tags.push({ x: WX - 30, y: GY - WH - 34, R: Math.round(th.R), t: 0 });
    sfx.push();
  } else {
    const moat = th.xl > WX - MOATW;
    spawn(moat ? 'splash' : 'dust', th.xl, GY, moat ? 12 : 8);
    if (moat) spawn('ring', th.xl, GY + 2, 1);
    TH.flags.push({ x: th.xl, R: Math.round(th.R), kind: th.flag || 'w', rs: th.rs, moat });

function stepTH(dt) {

  if (th.rel && !th.landed && th.t >= TH_REL + th.fly) land(th);

  const gD = { wx: WXD, wt, wh: WHD, kx: 330, kw: 46, kh: 150, ct: 380, fh: 70, ex: 410 };
  moat(c, WXD - MOATD, WXD, DA.moat);

  c.save(); c.translate(0, -12);
  c.fillStyle = '#7bb064'; c.beginPath(); c.ellipse(40, GY + 12, 52, 9, 0, 0, 7); c.fill();
  const ps = DM.treb >= 0 ? poseAt(DM.treb) : { b: B0, s: S0, ph: 0, p: 0 };
  const loadA = DM.treb >= 0 && DM.treb >= TH_REL && DM.treb < TH_REL + TH_SETTLE + TH_RESET * 0.6 ? 0 : 1;
  drawTreb(c, trebGeom(ps.b, ps.s, 0.55, -34), { M: 6, rope: false, pull: 0, load: { r: 3.4, a: loadA }, sway: 0 });
  c.restore();
  if (DM.ram) drawRam(c, DM.ram.x, DM.ram.sw, DM.ram.rot);
  if (DM.tower) {
    drawTower(c, DM.tower.x, DM.tower.a);

      const fx = DM.tower.x + 23, y = GY - WHD;

      ln(c, fx + 2, y - 10, fx + 2, y - 2); ln(c, WXD - 2, y - 10, WXD - 2, y - 2); c.restore();
    }
  }
  const crack = Math.min(1, (1 - S.d.hp) * 1.8);
  drawCastle(c, gD, { shake: Math.sin(time * 60) * 1.6 * TH.shake, dmg: crack, slits: DA.slits, t: time });
  if (DM.stone) drawStone(c, DM.stone.x, DM.stone.y, DM.stone.rs, time * 9);
  for (const a of AR) {                                  // arrows: in from the left, one out of the slit
    const p = a.hit ? 1 : clamp01(a.t / a.dur), x = a.hit ? a.x1 : lerp(a.x0, a.x1, p), arc = a.k === 'in' ? 16 : 6;
    const y = a.hit ? a.y1 : lerp(a.y0, a.y1, p) - arc * 4 * p * (1 - p);
    const dx = a.hit ? a.vx : (a.x1 - a.x0), dy = a.hit ? a.vy : (a.y1 - a.y0) + arc * 4 * (1 - 2 * p) * -1;
    c.save(); c.globalAlpha = a.hit ? clamp01(1 - a.t / 0.7) : 1; drawArrow(c, x, y, a.hit ? a.rot : Math.atan2(dy, dx)); c.restore();
  }

    pill(c, `🧱 ${Math.round(S.d.hp * 100)}%`, 8, 18, { align: 'l', size: 13 });
    if (t.d.phase[DM.phase]) pill(c, t.d.phase[DM.phase], W / 2 + 20, 18, { size: 13 });
  } else if (S.d.res && !r && S.d.demo === 2 && S.d.hp < 1) pill(c, `🧱 ${Math.round(S.d.hp * 100)}%`, 8, 18, { align: 'l', size: 13 });
}

function tent(c, x, base, w, h, c1, c2) {

  c.fillStyle = 'rgba(30,50,20,.28)'; c.beginPath(); c.ellipse(x + w * 0.15, base + 1, w * 0.6, 4, 0, 0, 7); c.fill();
  c.fillStyle = g; c.strokeStyle = '#4a3a2a'; c.lineWidth = 1.4; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(x - w / 2, base); c.lineTo(x, base - h); c.lineTo(x + w / 2, base); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(40,30,30,.18)'; c.beginPath(); c.moveTo(x, base - h); c.lineTo(x + w / 2, base); c.lineTo(x + w * 0.1, base); c.closePath(); c.fill();
  c.fillStyle = '#2b211c'; c.beginPath(); c.moveTo(x - w * 0.12, base); c.lineTo(x, base - h * 0.5); c.lineTo(x + w * 0.12, base); c.closePath(); c.fill();
  c.strokeStyle = '#4a3a28'; c.lineWidth = 1.2; ln(c, x, base - h, x, base - h - 9);
  c.fillStyle = '#d64545'; c.beginPath(); c.moveTo(x, base - h - 9); c.lineTo(x + 8 + Math.sin(NOW * 5 + x) * 1.2, base - h - 6.5); c.lineTo(x, base - h - 4); c.closePath(); c.fill();
}
function campfire(c, x, y) {
  const gl = c.createRadialGradient(x, y - 4, 1, x, y - 4, 26); gl.addColorStop(0, 'rgba(255,190,80,.5)'); gl.addColorStop(1, 'rgba(255,190,80,0)');
  c.fillStyle = gl; c.beginPath(); c.arc(x, y - 4, 26, 0, 7); c.fill();
  c.strokeStyle = '#4b3220'; c.lineWidth = 3; c.lineCap = 'round'; ln(c, x - 9, y + 1, x + 8, y - 3); ln(c, x - 8, y - 3, x + 9, y + 1);
  for (let i = 0; i < 3; i++) {
    const fl = 1 + Math.sin(NOW * 9 + i * 2) * 0.18, hh = (12 - i * 3) * fl, ww = 6 - i * 1.4;
    c.fillStyle = ['#e8742a', '#f5b63c', '#fff2a8'][i]; c.beginPath(); c.moveTo(x - ww, y - 2); c.quadraticCurveTo(x - ww * 0.6, y - hh * 0.6, x + Math.sin(NOW * 7 + i) * 1.5, y - hh); c.quadraticCurveTo(x + ww * 0.6, y - hh * 0.5, x + ww, y - 2); c.closePath(); c.fill();
  }
  for (let i = 0; i < 4; i++) {                          // smoke
    const q = ((NOW * 0.35 + i * 0.25) % 1), a = (1 - q) * 0.32;
    c.fillStyle = `rgba(90,90,100,${a})`; c.beginPath(); c.arc(x + Math.sin(q * 6 + i) * 5, y - 14 - q * 48, 3 + q * 7, 0, 7); c.fill();
  }
}
function well(c, x) {

  c.fillStyle = '#ddd3bf'; c.strokeStyle = '#5a4f3b'; c.lineWidth = 1.2; c.beginPath(); c.ellipse(x, top, 13, 4.5, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#3f9bc4'; c.beginPath(); c.ellipse(x, top, 9.5, 2.8, 0, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(x - 3 + Math.sin(NOW * 2) * 2, top - 0.3, 2.6, 0.7, 0, 0, 7); c.fill();
  c.strokeStyle = '#3d2814'; c.lineWidth = 2.6; ln(c, x - 11, top, x - 11, top - 24); ln(c, x + 11, top, x + 11, top - 24);
  c.fillStyle = '#a4553a'; c.strokeStyle = '#3a2216'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x - 17, top - 22); c.lineTo(x, top - 34); c.lineTo(x + 17, top - 22); c.closePath(); c.fill(); c.stroke();
  const by = top - 14 + Math.sin(NOW * 2) * 1.6;
  c.strokeStyle = '#6b5232'; c.lineWidth = 1; ln(c, x, top - 24, x, by); wood(c, x - 3.5, by, 7, 6, 1.5);
}
function sceneWait(c) {
  const t = T[lang], w = S.w, tot = waitTotal(), left = clamp01(1 - w.day / tot), out = w.day >= tot - 1e-6 && w.day > 0;
  const gW = { wx: 176, wt: 30, wh: 84, fh: 64, ex: 410 };
  tent(c, 32, GY + 4, 44, 36, '#efe3c4', '#c7b48a'); tent(c, 84, GY - 2, 36, 29, '#e8c9a0', '#b9855a'); tent(c, 132, GY + 3, 40, 32, '#d9e2ec', '#9db1c6');
  campfire(c, 106, GY + 20);
  flagPole(c, 14, GY - 2, 42, '#3e6bb0', NOW);
  drawCastle(c, gW, { shake: 0, dmg: 0, slits: 0, t: NOW });
  // the storehouse, cut open: shelves of sacks
  const sx = 296, sw2 = 70, sh = 56, sy = GY - sh;
  const gi = c.createLinearGradient(0, sy, 0, GY); gi.addColorStop(0, '#5a4026'); gi.addColorStop(1, '#2e2216');
  c.fillStyle = gi; c.strokeStyle = '#3d2814'; c.lineWidth = 1.6; c.fillRect(sx, sy, sw2, sh); c.strokeRect(sx, sy, sw2, sh);
  c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1; for (let i = 1; i < 6; i++) ln(c, sx + i * sw2 / 6, sy, sx + i * sw2 / 6, GY);
  c.fillStyle = '#9c5238'; c.strokeStyle = '#3a2216'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(sx - 7, sy + 1); c.lineTo(sx + sw2 / 2, sy - 19); c.lineTo(sx + sw2 + 7, sy + 1); c.closePath(); c.fill(); c.stroke();

  const bx = 38, bw = 140;

function pick(k, i) {
  const o = S[k]; if (o.pick !== null) return;
  o.pick = i; sfx.click();
  if (k === 'f') {
    const f = S.f; f.demo = 1; f.res = []; clearThrows();
    const done = (th) => { f.res.push(Math.round(th.R)); };
    enqueue({ kind: 'w', M: 3, m: 100, onLand: done });
    enqueue({ kind: 'w', M: 8, m: 100, onLand: (th) => { done(th); f.demo = 2; f.M = 3; f.si = 1; (f.pick === RIGHT.f ? sfx.good : sfx.bad)(); } });
  } else if (k === 'd') startDefendDemo();
  else startWaitDemo();
  showStage(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const bt = ev.target.closest('[data-act]'); if (!bt || bt.disabled) return;
  const a = bt.dataset.act, f = S.f, d = S.d, w = S.w, b = S.b;
  if (a === 'opt') { pick(bt.dataset.k, +bt.dataset.i); return; }
  if (a === 'fling') {
    if (isBusy()) return;
    enqueue({ kind: 'w', M: f.M, m: STONES[f.si], onLand: (th) => { f.last = { R: Math.round(th.R), M: th.M, m: th.m, hit: th.hit, moat: th.xl > WX - MOATW }; } });
    sfx.click(); showStage();
  } else if (a === 'upg') {
    if (d.run) return;
    d.up[bt.dataset.k] = !d.up[bt.dataset.k]; d.hp = 1; d.dmg = 0; sfx.click();
  } else if (a === 'attack') { if (d.run) return; startAttack(); sfx.click(); showStage(); }
  else if (a === 'play') {
    const tot = waitTotal();
    if (w.play) w.play = false; else { if (w.day >= tot - 1e-6) w.day = 0; w.play = true; }
    sfx.click(); showStage();
  } else if (a === 'warwolf') {
    if (isBusy()) return;
    enqueue({ kind: 'w', M: 10, m: 100, giant: true, onLand: (th) => { S.a.last = Math.round(th.R); } }); sfx.click(); showStage();
  } else if (a === 'sbmode') { if (isBusy()) return; b.mode = bt.dataset.m; sfx.click(); }
  else if (a === 'sbgo') {
    if (isBusy()) return;
    const rope = b.mode === 'rope', m = STONES[b.si];
    enqueue({ kind: rope ? 'r' : 'w', n: b.n, M: b.M, m, flag: rope ? 'r' : 'b', onLand: (th) => { b.last[rope ? 'rope' : 'weight'] = { R: Math.round(th.R), hit: th.hit }; } }); sfx.click(); showStage();
  } else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = bt.dataset.k; settle(); S.sec = S.sec === k ? null : k; sfx.click();
  }
  render();
});

  document.body.dataset.v = sec ? 'sec' + sec : v;
  $('tbF').hidden = !!sec || v !== 'fling'; $('tbD').hidden = !!sec || v !== 'defend'; $('tbW').hidden = !!sec || v !== 'wait';
  $('tbSA').hidden = sec !== 'a'; $('tbSB').hidden = sec !== 'b';

  $('tbSecs').innerHTML = [['a', '🐎'], ['b', '🔥']].map(([k, emo]) => `<button class="chip tb-c secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec === 'a') renderA(t); else if (sec === 'b') renderB(t); else if (v === 'fling') renderF(t); else if (v === 'defend') renderD(t); else renderW(t);

  $('wGo').textContent = w.play ? wt.pause : out ? wt.again : wt.play;
  if (!picked) {
    lab.setReadout('?', wt.roQ, '', '#e0b050');
    lab.setState({ emo: '🏰', title: wt.q, lead: wt.askLead, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (!ready) {
    lab.setReadout(wt.val(days), wt.sub(w.sacks, w.people), '', '#e0b050');
    lab.setState({ emo: '👀', title: wt.watchT, lead: wt.watchL, body: '', extra: '' }); lab.setFacts([]); return;
  }
  lab.setReadout(wt.val(days), wt.sub(w.sacks, w.people), out ? wt.pillOut : day > 0 ? wt.pillDay(day) : '', out ? '#ff6a5e' : '#e0b050');
  const st = out ? wt.stOut : day > 0 ? wt.stDay(day, Math.max(0, Math.round((1 - w.day / tot) * 100))) : wt.st(w.sacks, w.people, days);
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
  lab.setFacts([{ ...t.facts.w, src: FACT_SRC.w }]);
}

function renderA(t) {
  const sa = t.sa, R = S.a.last ?? Math.round(range(10, 100).R);
  lab.setGlow('rgba(214, 69, 69, .22)');
  $('saGo').textContent = sa.btn; $('saGo').disabled = isBusy();
  $('saFine').textContent = t.f.fine;
  lab.setReadout(S.a.last ? `${S.a.last} ${t.m}` : '10 t', S.a.last ? t.f.sub(10, 100) : sa.ro, S.a.last ? (S.a.last >= WALL_D ? t.f.pillHit : t.f.pillMiss(WALL_D - S.a.last)) : '', '#d64545');
  const [emo, title, lead, body] = sa.st(R);
  lab.setState({ emo, title, lead, body, extra: '' }); lab.setFacts([]);
}
function renderB(t) {
  const sb = t.sb, b = S.b, rope = b.mode === 'rope', m = STONES[b.si], names = t.f.names, busy = isBusy();
  lab.setGlow('rgba(232, 134, 58, .24)');
  $('sbMode').innerHTML = [['rope', 0], ['weight', 1]].map(([k, i]) => `<button class="chip tb-c${b.mode === k ? ' on' : ''}" data-act="sbmode" data-m="${k}"${busy ? ' disabled' : ''}>${i ? '🪨' : '🧑‍🤝‍🧑'} ${esc(sb.mode[i])}</button>`).join('');
  $('sbN').hidden = !rope; $('sbM').hidden = rope;
  $('sbL').innerHTML = rope ? `<span>${esc(sb.pull)}</span><b>${esc(sb.pullV(b.n))}</b>` : `<span>${esc(t.f.cw)}</span><b>${esc(t.f.cwV(b.M))}</b>`;
  $('sbStL').innerHTML = `<span>${esc(t.f.st)}</span><b>${esc(t.f.stV(m, names[b.si]))}</b>`;
  setVal($('sbN'), b.n); setVal($('sbM'), b.M); setVal($('sbSt'), b.si);
  $('sbGo').textContent = sb.go; $('sbGo').disabled = busy;
  $('sbFine').textContent = t.f.fine;
  const cur = b.last[b.mode], r = b.last.rope, wgt = b.last.weight, fm = (x) => (x ? `${x.R} ${t.m}` : '–');
  lab.setReadout(cur ? `${cur.R} ${t.m}` : '?', sb.res(fm(r), fm(wgt)), cur ? (cur.hit ? t.f.pillHit : t.f.pillMiss(WALL_D - cur.R)) : '', '#e8863a');
  lab.setState({ emo: sb.st[0], title: sb.st[1], lead: sb.st[2], body: rope ? sb.body(b.n) : '', extra: (r || wgt) ? `<div class="tb-cmp">${esc(sb.res(fm(r), fm(wgt)))}</div>` : '' });
  lab.setFacts([]);
}
render();
</script>
