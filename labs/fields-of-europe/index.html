  c.font = FONT(800, fs);
  const tw = c.measureText(text).width, pw = tw + 16, ph = fs + 10;
  let X = align === 'c' ? x - pw / 2 : align === 'r' ? x - pw : x;

  if (heat > 0.02) { c.strokeStyle = `rgba(255,${Math.round(140 + 60 * k)},60,${0.9 * heat})`; c.lineWidth = 3; c.beginPath(); c.moveTo(L, bot - 17); c.lineTo(R, bot - 17); c.stroke(); for (const lx of [110, 180, 250]) { const lg = c.createRadialGradient(lx, top + 14, 1, lx, top + 14, 54); lg.addColorStop(0, `rgba(255,230,150,${0.65 * heat})`); lg.addColorStop(1, 'rgba(255,230,150,0)'); c.fillStyle = lg; c.beginPath(); c.arc(lx, top + 14, 54, 0, 7); c.fill(); c.fillStyle = '#d8d8e0'; rr(c, lx - 7, top + 6, 14, 5, 2); c.fill(); } }
  c.restore();
  c.fillStyle = 'rgba(210,238,255,.2)'; c.beginPath(); c.moveTo(L, bot); c.lineTo(L, top); c.lineTo(180, apex); c.lineTo(R, top); c.lineTo(R, bot); c.closePath(); c.fill();
  c.strokeStyle = '#f2f6fa'; c.lineWidth = 2; c.lineJoin = 'round'; c.stroke();
  c.lineWidth = 1.1; c.strokeStyle = 'rgba(255,255,255,.8)'; c.beginPath(); for (let x = L + 22; x < R; x += 22) { c.moveTo(x, bot); c.lineTo(x, x < 180 ? top - ((x - L) / (180 - L)) * (top - apex) : top - ((R - x) / (R - 180)) * (top - apex)); } c.moveTo(L, top); c.lineTo(R, top); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.28)'; c.beginPath(); c.moveTo(L + 6, top - 4); c.lineTo(168, apex + 10); c.lineTo(176, apex + 4); c.lineTo(L + 16, top - 4); c.closePath(); c.fill();
  // snow in winter
  const sn = clamp01(1 - k * 2);
  if (sn > 0.02) for (let i = 0; i < 46; i++) { const x = (hsh(i, 3) * BW + Math.sin(time + i) * 8 + BW) % BW, y = (hsh(i, 4) * BH + time * (22 + hsh(i, 5) * 20)) % 290; c.fillStyle = `rgba(255,255,255,${0.9 * sn})`; c.beginPath(); c.arc(x, y, 1.6 + hsh(i, 6) * 1.2, 0, 7); c.fill(); }
  pill(c, BW, BH, `${T[lang].outside}: ${tOut} °C`, 10, 8, 'l', fs, '#fff');
  pill(c, BW, BH, `${T[lang].inside}: 20 °C`, 180, 292 + 6, 'c', fs, '#ffd98a');
  c.restore();
  c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1; rr(c, ox + 0.5, oy + 0.5, BW * s - 1, BH * s - 1, 14 * s); c.stroke();
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec === 'a') return drawPuszta(c, w, h, dt, time);
  if (S.sec === 'b') return drawGlass(c, w, h, dt, time);
  const v = lab.view;
  if (v === 'layers') drawMap(c, w, h, dt, time);
  else if (v === 'town') drawTown(c, w, h, dt, time);
  else drawField(c, w, h, dt, time);
});

// --- controls ---------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const LAYE = { temp: '☀️', rain: '🌧️', soil: '🌑', relief: '⛰️' };
function legendHTML() {
  const t = T[lang], v = S.v1, out = [];
  if (v.real) CLK.forEach((k) => out.push(`<div><i style="background:${CLC[k]}"></i>${esc(t.cls[k])}</div>`));
  else {
    if (v.layers.temp) out.push(`<div><span>${esc(t.tempLo)}</span><span class="fe-bar" style="background:linear-gradient(90deg,${TR.map((x) => x[1]).join(',')})"></span><span>${esc(t.tempHi)}</span></div><div style="color:var(--mut)">${esc(t.tempLeg)}</div>`);
    if (v.layers.rain) out.push(`<div><span>${esc(t.rainLo)}</span><span class="fe-bar" style="background:linear-gradient(90deg,${RR.map((x) => x[1]).join(',')})"></span><span>${esc(t.rainHi)}</span></div><div style="color:var(--mut)">${esc(t.rainLeg)}</div>`);
    if (v.layers.soil) out.push(`<div><i style="background:#33231a"></i>${esc(t.soilLeg)}</div>`);
    if (v.layers.relief) out.push(`<div><i style="background:#9a7d58"></i>${esc(t.reliefLeg)}</div>`);
  }
  return out.join('');
}
const st = (a) => ({ emo: a[0], title: a[1], lead: a[2], body: a[3], extra: '' });
const verdict = (ok, txt) => `<div class="fe-verdict ${ok ? 'good' : 'bad'}">${esc(txt)}</div>`;
const chipsHTML = (opts, pick, right, act, key) => opts.map((o, i) => `<button class="fe-opt${pick === null ? '' : i === right ? ' good' : i === pick ? ' bad' : ' dim'}" data-act="${act}" data-i="${i}"${pick === null ? '' : ' disabled'}>${esc(o)}</button>`).join('');

function render1() {
  const t = T[lang], v = S.v1;
  $('fe1Pred').hidden = v.done; $('fe1Play').hidden = !v.done;
  if (!v.done) {
    $('fe1Pred').innerHTML = `<div class="fe-q">${esc(t.q1)}</div><div class="fe-hint">${esc(v.pin ? t.q1pin : t.q1tap)}</div>
      <div class="fe-q">${esc(t.q2)}</div><div class="fe-opts">${t.q2o.map((o, i) => `<button class="fe-opt${v.q2 === i ? ' sel' : ''}" data-act="q2" data-i="${i}">${esc(o)}</button>`).join('')}</div>
      <button class="fe-go" data-act="check"${v.pin && v.q2 !== null ? '' : ' disabled'}>${esc(t.check)}</button>`;
    lab.setReadout('?', '', '', '#e8dcc0'); lab.setState(st(t.st1.pre)); lab.setFacts([]);
  } else {
    $('fe1Out').innerHTML = verdict(v.hit, v.hit ? t.olHit : t.olMiss) + verdict(v.vOk, v.vOk ? t.vnRight : t.vnWrong);
    $('feLayers').innerHTML = Object.keys(LAYE).map((k) => `<button class="chip${v.layers[k] && !v.real ? ' on' : ''}" data-act="layer" data-k="${k}">${LAYE[k]} ${esc(t.lay[k])}</button>`).join('');
    $('feLeg').innerHTML = legendHTML(); $('feLeg').hidden = !$('feLeg').innerHTML;
    $('feTrayHint').textContent = t.trayHint;
    $('feTray').innerHTML = TKEYS.map((k) => `<button class="chip fe-tk${v.sel === k ? ' on' : ''}" data-act="tk" data-k="${k}">${TOK[k][0]} ${esc(t.tk[k])}</button>`).join('');
    $('feActs').innerHTML = (v.tokens.length ? `<button class="chip" data-act="clear">↺ ${esc(t.clear)}</button>` : '') + `<button class="chip${v.real ? ' on' : ''}" data-act="real">🌍 ${esc(v.real ? t.realOff : t.real)}</button>`;
    const n = v.tokens.length, nf = v.tokens.filter((k) => FIT[k.type](k.lon, k.lat, classAt(k.lon, k.lat))).length;
    if (v.real && n) lab.setReadout(`${nf} / ${n}`, t.fitSub, t.realNote, '#8a9a3c'); else lab.setReadout(String(n), t.placed, v.real ? t.realNote : '', '#8a9a3c');
    lab.setState(st(v.real ? t.st1.real : v.last && v.layers[v.last] ? t.st1[v.last] : t.st1.done)); lab.setFacts(t.f1);
  }
  lab.setGlow('rgba(138, 154, 60, .26)');
}
function render2() {
  const t = T[lang], v = S.v2, ans = done2();
  $('fe2Pred').innerHTML = `<div class="fe-q">${esc(t.q3t)}</div><div class="fe-opts">${chipsHTML(t.q3o, v.pick, 0, 'opt3')}</div>${ans ? verdict(v.pick === 0, v.pick === 0 ? t.r3 : t.w3) : ''}`;
  $('fe2Play').hidden = !ans;
  $('feTcL').textContent = t.tcL; $('feTcA').textContent = t.tcA; $('feTcB').textContent = t.tcB;
  $('feTog').innerHTML = `<button class="chip${v.rail ? ' on' : ''}" data-act="rail">🚂 ${esc(t.rail)}</button><button class="chip${v.fridge ? ' on' : ''}" data-act="fridge">❄️ ${esc(t.fridge)}</button>`;
  $('feRentCap').textContent = t.rentCap; $('feRentAx').textContent = t.rentAx; $('feFlagTip').textContent = t.flagTip;
  if (ans) lab.setReadout(`${Math.round(ringTargets()[0])} km`, t.townSub, t.townPill, '#79c76a'); else lab.setReadout('?', '', '', '#79c76a');
  lab.setState(st(!ans ? t.st2.pre : v.rail && v.fridge ? t.st2.both : v.rail ? t.st2.rail : v.fridge ? t.st2.fridge : t.st2.base));
  lab.setFacts(ans ? t.f2 : []); lab.setGlow('rgba(121, 199, 106, .24)');
}
function render3() {
  const t = T[lang], v = S.v3, ans = done3();
  $('fe3Pred').hidden = ans; $('fe3Play').hidden = !ans;
  if (!ans) {
    const o = (a, k) => t.q4o.map((x, i) => `<button class="fe-opt${v[a] === i ? ' sel' : ''}" data-act="${k}" data-i="${i}">${esc(x)}</button>`).join('');
    $('fe3Pred').innerHTML = `<div class="fe-q">${esc(t.q4a)}</div><div class="fe-opts">${o('a1', 'a1')}</div><div class="fe-q">${esc(t.q4b)}</div><div class="fe-opts">${o('a2', 'a2')}</div>`;
    lab.setReadout('?', '', '', '#ff8a3d'); lab.setState(st(t.st3.pre)); lab.setFacts([]);
  } else {
    $('fe3Out').innerHTML = verdict(v.a1 === 0, v.a1 === 0 ? t.r4a : t.w4a) + verdict(v.a2 === 1, v.a2 === 1 ? t.r4b : t.w4b);
    $('feYrL').textContent = `${t.yrL} ${v.year}`;
    const rows = Object.keys(t.meas).map((k) => {
      const [i, e] = valsAt(k, v.year), on = v.meas === k ? ' on' : '', mu = t.meas[k];
      return `<button class="${on.trim()}" data-act="meas" data-k="${k}">${mu[0]} ${esc(mu[1])}</button><button class="v vi${on}" data-act="meas" data-k="${k}">${fmt(i, DEC[k])} ${esc(mu[2])}</button><button class="v ve${on}" data-act="meas" data-k="${k}">${fmt(e, DEC[k])} ${esc(mu[2])}</button>`;
    }).join('');
    $('feTable').innerHTML = `<div class="fe-tbl"><span></span><div class="h" style="color:#ffb070">${esc(t.meth.I[0])}<small>${esc(t.meth.I[1])}</small></div><div class="h" style="color:#7fe0ae">${esc(t.meth.E[0])}<small>${esc(t.meth.E[1])}</small></div>${rows}</div>`;
    $('feIllus').textContent = `${t.illus} ${t.measFull[v.meas]}.`;
    const [i, e] = valsAt(v.meas, v.year);
    lab.setReadout(`<span style="color:#ffb070">${fmt(i, DEC[v.meas])}</span> · <span style="color:#7fe0ae">${fmt(e, DEC[v.meas])}</span>`, `${t.meas[v.meas][2]}, ${t.yrL.toLowerCase()} ${v.year}`, t.illusPill, '#ff8a3d');
    lab.setState(st(t.st3.done)); lab.setFacts(t.f3);
  }
  lab.setGlow('rgba(255, 138, 61, .22)');
}
function renderSec() {
  const t = T[lang], a = S.sec === 'a', arr = a ? t.secA : t.secB, sl = a ? t.slA : t.slB;
  $('feSlA').textContent = sl[0]; $('feSlB').textContent = sl[1];
  if (a) {
    const pct = ((800 / 52000) * 100).toFixed(1).replace('.', lang === 'en' ? '.' : ',');
    lab.setReadout(S.sp > 0.5 ? t.puszta1 : t.puszta0, S.sp > 0.95 ? `${t.hortName} 800 km² · ${t.plain} ${grp(52000)} km² · ${pct} %` : '', '', '#b4c868'); lab.setFacts(t.fA);
  } else {
    lab.setReadout(`${t.outside} ${Math.round(2 + 20 * S.ss)} °C`, t.insideSub, '', '#6bb6ec'); lab.setFacts([t.f3[0]]);
  }
  lab.setState(st(arr)); lab.setGlow(a ? 'rgba(180, 200, 104, .26)' : 'rgba(107, 182, 236, .26)');
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v;
  $('fe1').hidden = !!sec || v !== 'layers'; $('fe2').hidden = !!sec || v !== 'town'; $('fe3').hidden = !!sec || v !== 'field'; $('feSecCtl').hidden = !sec;
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('feSecs').innerHTML = sc('a', '🐂') + sc('b', '🌷');
  if (sec) return renderSec();
  if (v === 'layers') render1(); else if (v === 'town') render2(); else render3();
}

// --- events -----------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v1 = S.v1, i = +b.dataset.i, k = b.dataset.k;
  if (a === 'q2') { v1.q2 = i; sfx.tick(); }
  else if (a === 'check') {
    if (!v1.pin || v1.q2 === null) return;
    v1.done = true; v1.hit = nearOlive(v1.pin.lon, v1.pin.lat); v1.vOk = v1.q2 === 0; v1.oliveOn = true; (v1.hit && v1.vOk ? sfx.good : sfx.bad)(); render(); showStage(); return;
  } else if (a === 'layer') {
    v1.real = false; v1.oliveOn = false; v1.layers[k] = !v1.layers[k]; if (v1.layers[k]) { v1.last = k; if (k === 'temp') v1.layers.rain = false; if (k === 'rain') v1.layers.temp = false; } sfx.click();
  } else if (a === 'tk') { v1.sel = v1.sel === k ? null : k; v1.oliveOn = false; sfx.tick(); }
  else if (a === 'clear') { v1.tokens = []; sfx.click(); }
  else if (a === 'real') { v1.real = !v1.real; v1.oliveOn = false; sfx.click(); }
  else if (a === 'opt3') { if (S.v2.pick !== null) return; S.v2.pick = i; S.v2.doneT = now(); (i === 0 ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  else if (a === 'rail') { S.v2.rail = !S.v2.rail; sfx.click(); }
  else if (a === 'fridge') { S.v2.fridge = !S.v2.fridge; sfx.click(); }
  else if (a === 'a1' || a === 'a2') { S.v3[a] = i; sfx.tick(); if (done3()) { S.v3.doneT = now(); (S.v3.a1 === 0 && S.v3.a2 === 1 ? sfx.good : sfx.bad)(); render(); showStage(); return; } }
  else if (a === 'meas') { S.v3.meas = k; sfx.tick(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.secT = now(); sfx.click();
    if (S.sec) { $('feSl').value = Math.round((S.sec === 'a' ? S.sp : S.ss) * 1000); showStage(); }
  }
  render();
});
$('feTc').addEventListener('input', (ev) => { S.v2.tc = ev.target.value / 100; render(); });
$('feYr').addEventListener('input', (ev) => { S.v3.year = +ev.target.value; render(); });
$('feSl').addEventListener('input', (ev) => { if (S.sec === 'a') S.sp = ev.target.value / 1000; else S.ss = ev.target.value / 1000; render(); });
$('cv').addEventListener('click', (ev) => {
  if (S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, w = r.width, h = r.height;
  if (lab.view === 'layers') {
    const v = S.v1, { s, ox, oy } = fit(w, h), dx = (x - ox) / s, dy = (y - oy) / s, lon = ilon(dx), lat = ilat(dy), onLand = LANDCTX.isPointInPath(LANDP, dx, dy);
    if (!v.done) { if (onLand) { v.pin = { lon, lat }; sfx.tick(); render(); } return; }
    const at = v.tokens.findIndex((tk) => Math.hypot(ox + px(tk.lon) * s - x, oy + py(tk.lat) * s - y) < 20);
    if (at >= 0) { v.tokens.splice(at, 1); v.oliveOn = false; sfx.click(); render(); return; }
    if (v.sel && onLand && v.tokens.length < 24) { v.tokens.push({ type: v.sel, lon, lat, t0: now() }); v.oliveOn = false; sfx.snap(); render(); }
  } else if (lab.view === 'town' && done2()) {
    const s = Math.min(w / 360, h / 360), ox = (w - 360 * s) / 2, oy = (h - 360 * s) / 2, dx = (x - ox) / s, dy = (y - oy) / s;
    if (Math.hypot(dx - CX, dy - CY) <= RMAX * KM + 6) { S.v2.flag = { x: dx, y: dy }; sfx.tick(); }
  }
});
render();
</script>
