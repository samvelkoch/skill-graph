  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ok : t.no, lead: g.expl[key], body: '', extra: '' });
}
function renderAon(t) {
  const q = AON, a = t.aon;
  statEl.innerHTML = `<div class="es-p">${esc(a.prompt)}</div><div class="es-s">${aonHtml(t, q)}</div>`;
  $('vAon').innerHTML = `<div class="row2" style="margin-top:0">${q.checked ? `<button class="es-b main" data-act="aonNext">${esc(a.next)}</button>`
    : `<button class="es-b main" data-act="aonCheck"${q.sel.size ? '' : ' disabled'}>${esc(a.check)}</button>`}</div>`;
  if (!q.checked) {
    lab.setReadout('?', a.fitsLbl, a.tapped(q.sel.size), '#3b82f6');
    return lab.setState({ emo: '👆', title: a.stT, lead: a.stL, body: '', extra: '' });
  }
  lab.setReadout(q.fits.size, a.fitsLbl, a.tapped(q.sel.size), '#3b82f6');
  lab.setState({ emo: q.ok ? '✅' : '🤔', title: q.ok ? t.ok : t.no, lead: a.res(q.hit, q.miss, q.wrong), body: q.orMiss ? a.orLead : a.notes[q.type], extra: '' });
}
function renderHp(t) {
  const h = t.hp, g = G[lang], N = hpN(), A = g.colH()[HP.c], B = g.shpH()[HP.s], nA = N.both + N.a, nB = N.both + N.b, u = nA + nB - N.both;
  $('vHp').innerHTML = `<div class="es-q">${h.q(esc(A), esc(B))}</div>` + (HP.rev
    ? `<div class="row2" style="margin-top:0">${['or', 'and', 'na', 'nb'].map((k) => `<button class="chip ${HP.mode === k ? 'on' : ''}" data-act="hpMode" data-m="${k}">${esc(h.chips[k])}</button>`).join('')}</div>
       <div class="row2"><button class="es-b main" data-act="hpNew">${esc(h.newTray)}</button></div>`
    : `<div class="es-step"><button class="es-sb" data-act="hpDec" aria-label="−"${(HP.guess ?? 0) <= 0 ? ' disabled' : ''}>−</button><b>${HP.guess ?? '?'}</b><button class="es-sb" data-act="hpInc" aria-label="+"${(HP.guess ?? 0) >= 12 ? ' disabled' : ''}>+</button>
       <button class="es-b main" data-act="hpCheck"${HP.guess === null ? ' disabled' : ''}>${esc(h.check)}</button><button class="es-b" data-act="hpNew">${esc(h.newTray)}</button></div>`);
  if (!HP.rev) { lab.setReadout('?', '', '', '#8b7bd8'); return lab.setState({ emo: '⭕', title: h.stT, lead: h.stL, body: '', extra: '' }); }
  const m = HP.mode;
  if (m === 'or') {
    lab.setReadout(u, `|A| + |B| − |A ${h.and} B| = ${nA} + ${nB} − ${N.both} = ${u}`, '', AMBER);
    return lab.setState({ emo: HP.ok ? '✅' : '🤔', title: HP.ok ? t.ok : t.no, lead: h.explain, body: h.notes.or, extra: '' });
  }
  const sub = m === 'and' ? `|A ${h.and} B| = ${N.both}` : m === 'na' ? `${h.chips.na}: ${N.N} − ${nA} = ${N.N - nA}` : `${h.chips.nb}: ${N.N} − ${nB} = ${N.N - nB}`;
  lab.setReadout(m === 'and' ? N.both : m === 'na' ? N.N - nA : N.N - nB, sub, '', MODECOL[m]);
  lab.setState({ emo: '⭕', title: h.chips[m], lead: h.notes[m], body: '', extra: '' });
}
function renderOwn(t) {
  const o = t.own, g = G[lang], q = OWN.res, qs = QS[OWN.q];
  statEl.innerHTML = `<div class="es-k">${esc(o.kick)}</div><div class="es-s">${esc(g.sent(qs, dOf(OWN.d), pOf(OWN.p)))}</div>`;
  const sel = (k, label, list, cur) => `<select class="es-sel" data-sel="${k}" aria-label="${esc(label)}">${list.map((x, i) => `<option value="${i}"${i === cur ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
  $('vOwn').innerHTML = `<div class="row2" style="margin-top:0">${sel('q', o.sq, g.qOpts, OWN.q)}${sel('d', o.sd, g.dOpts(), OWN.d)}${sel('p', o.sp, g.pOpts(), OWN.p)}</div>
    <div class="row2"><button class="es-b main" data-act="ownNew">${esc(o.newTray)}</button></div>`;
  lab.setReadout(q.truth ? t.tf.t : t.tf.f, '', '', q.truth ? GREEN : REDC);
  const key = (qs === 'every' ? 'every' : qs === 'some' ? 'some' : 'none') + (q.truth ? 'T' : 'F');
  lab.setState({ emo: '✍️', title: o.stT, lead: q.vac && qs !== 'some' ? o.vac : t.tf.expl[key], body: o.stL, extra: '' });
}
function renderNn(t) {
  const n = t.nn, N = NN.blocks.filter(nnFits).length;
  statEl.innerHTML = `<div class="es-k">${esc(n.kick)}</div><div class="es-s">${aonHtml(t, { c: NN.col }, NN.flips)}</div>`;
  $('vNn').innerHTML = `<div class="row2" style="margin-top:0"><button class="es-b main" data-act="nnSay">${esc(NN.flips >= 4 ? n.again : n.say)}</button><button class="es-b" data-act="nnOther">${esc(n.other)}</button></div>`;
  lab.setReadout(N, t.aon.fitsLbl, '', GREEN);
  lab.setState({ emo: '🔄', title: n.stT, lead: NN.flips === 0 ? n.l0 : NN.flips % 2 ? n.lOdd : n.lEven, body: '', extra: '' });
}
render();
</script>
