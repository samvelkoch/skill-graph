// --- secret B: a clock with Roman numerals ------------------------------------------------------------------
function drawClock(c, w, h, dt, t) {
  const g = fitBox(w, h, W5, H5); G = g;
  const K = S.clock, kk = 1 - Math.exp(-dt * 7); K.hA += (K.hT - K.hA) * kk; K.mA += (K.mT - K.mA) * kk;
  bgDusk(c, w, h);
  c.save(); c.translate(g.ox, g.oy); c.scale(g.s, g.s); c.lineJoin = 'round'; c.lineCap = 'round';
  const { x, y, R } = CK, pulse = 0.5 + 0.5 * Math.sin(t * 4);
  c.beginPath(); c.arc(x, y + 8, R + 6, 0, TAU); c.fillStyle = 'rgba(60,35,10,.3)'; c.fill();
  c.beginPath(); c.arc(x, y, R + 4, 0, TAU); c.fillStyle = lin(c, x - R, y - R, x + R, y + R, [[0, '#f6e3a0'], [.5, '#d4a93c'], [1, '#8f6a14']]); c.fill();
  c.beginPath(); c.arc(x, y, R - 6, 0, TAU); c.fillStyle = rad(c, x - 30, y - 40, 4, R, [[0, '#fffaf0'], [1, '#e4dccb']]); c.fill(); c.strokeStyle = '#a68e62'; c.lineWidth = 1.5; c.stroke();
  c.strokeStyle = '#6b5a44';
  for (let i = 0; i < 60; i++) { const a = i * PI / 30, big = i % 5 === 0, r0 = R - (big ? 24 : 15); c.lineWidth = big ? 2 : 1; c.beginPath(); c.moveTo(x + Math.sin(a) * r0, y - Math.cos(a) * r0); c.lineTo(x + Math.sin(a) * (R - 9), y - Math.cos(a) * (R - 9)); c.stroke(); }
  const hr = K.h % 12 === 0 ? 12 : K.h % 12, mi = K.m / 5 === 0 ? 12 : K.m / 5;
  for (let n = 1; n <= 12; n++) {
    const a = n * PI / 6, nx = x + Math.sin(a) * 86, ny = y - Math.cos(a) * 86, isH = n === hr, isM = n === mi;
    if (isM) { c.beginPath(); c.arc(nx, ny, 21 + 2 * pulse, 0, TAU); c.fillStyle = 'rgba(163,59,43,.2)'; c.fill(); c.strokeStyle = '#a33b2b'; c.lineWidth = 2.5; c.stroke(); }
    if (isH) { c.save(); c.shadowColor = 'rgba(255,214,90,.95)'; c.shadowBlur = 12 + 6 * pulse; c.beginPath(); c.arc(nx, ny, 19, 0, TAU); c.fillStyle = lin(c, nx - 19, ny - 19, nx + 19, ny + 19, [[0, '#fff0a8'], [1, '#d4a93c']]); c.fill(); c.restore(); }
    txt(c, CLOCKNUM[n - 1], nx, ny + 1, `700 ${n === 4 || n === 8 ? 20 : 23}px "EB Garamond", Georgia, serif`, isH ? '#2a1d0a' : isM ? '#a33b2b' : '#3b2e22');
  }
  const hand = (ang, len, wd, c1, c2, tail) => {
    const a = ang * PI / 180; c.save(); c.translate(x, y); c.rotate(a); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 5; c.shadowOffsetY = 3;
    c.beginPath(); c.moveTo(-wd, tail); c.lineTo(-wd * 0.5, -len); c.lineTo(wd * 0.5, -len); c.lineTo(wd, tail); c.closePath(); c.fillStyle = lin(c, -wd, 0, wd, 0, [[0, c1], [1, c2]]); c.fill(); c.restore();
  };
  hand(K.hA, 58, 5, '#c5503f', '#8a2f22', 10); hand(K.mA, 92, 3.4, '#e8c25c', '#a87a1c', 12);
  c.beginPath(); c.arc(x, y, 8, 0, TAU); c.fillStyle = lin(c, x - 8, y - 8, x + 8, y + 8, [[0, '#f6e3a0'], [1, '#8f6a14']]); c.fill(); c.strokeStyle = '#6b4a14'; c.lineWidth = 1; c.stroke();
  c.restore();
}

// --- the loop ----------------------------------------------------------------------------------------------
canvasLoop(cv, (c, w, h, dt, t) => {
  c.save(); c.beginPath(); c.roundRect(0, 0, w, h, 18); c.clip();
  const v = lab.view;
  if (S.sec === 'a') drawPantheon(c, w, h, dt, t);
  else if (S.sec === 'b') drawClock(c, w, h, dt, t);
  else if (v === 'street') drawStreet(c, w, h, dt, t);
  else if (v === 'words') drawWords(c, w, h, dt, t);
  else drawCal(c, w, h, dt, t);
  c.restore();
});

// --- input -----------------------------------------------------------------------------------------------------
let drag = null;
const toD = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - G.ox) / G.s, (ev.clientY - r.top - G.oy) / G.s]; };
const ang = (x, y) => Math.atan2(y - CC.y, x - CC.x) * 180 / PI;
cv.addEventListener('pointerdown', (ev) => {
  const v = lab.view;
  if (S.sec === 'b') { // tap a numeral to set the hour
    const [x, y] = toD(ev), dx = x - CK.x, dy = y - CK.y, r = Math.hypot(dx, dy);
    if (r > 60 && r < 116) { const n = Math.round(((Math.atan2(dx, -dy) * 180 / PI + 360) % 360) / 30) || 12; setClock(n, S.clock.m); sfx.click(); render(); }
    return;
  }
  if (S.sec) return;
  if (v === 'street' && S.pick.street !== null) { drag = { k: 'lens', id: ev.pointerId, sx: ev.clientX, sy: ev.clientY, moved: false, touch: ev.pointerType !== 'mouse' }; cv.setPointerCapture(ev.pointerId); }
  else if (v === 'calendar' && S.pick.calendar !== null) {
    const [x, y] = toD(ev), a = ang(x, y);
    drag = { k: 'wheel', id: ev.pointerId, sx: ev.clientX, sy: ev.clientY, moved: false, last: a };
    S.cal.drag = drag; S.cal.vel = 0; S.cal.velAt = performance.now(); S.cal.rotT = S.cal.rot; cv.setPointerCapture(ev.pointerId);
  }
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag || drag.id !== ev.pointerId) return;
  if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > 6) drag.moved = true;
  if (!drag.moved) return;
  const [x, y] = toD(ev);
  if (drag.k === 'lens') { const off = drag.touch ? 58 / G.s : 0; S.lens.tx = clamp(x, 6, W1 - 6); S.lens.ty = clamp(y - off, 14, H1 - 10); }
  else {
    const a = ang(x, y), da = wrap180(a - drag.last), nt = performance.now(), K = S.cal;
    K.rot += da; K.rotT = K.rot; drag.last = a;
    K.vel = 0.6 * K.vel + 0.4 * (da / Math.max(0.008, (nt - K.velAt) / 1000)); K.velAt = nt;
  }
});
const endDrag = (ev) => {
  if (!drag || drag.id !== ev.pointerId) return;
  const d = drag; drag = null; S.cal.drag = null;
  const [x, y] = toD(ev);
  if (d.k === 'lens') {
    if (d.moved) return;
    const hit = pickTarget(x, y);
    if (hit) openCard(hit); else { S.lens.tx = clamp(x, 6, W1 - 6); S.lens.ty = clamp(y, 14, H1 - 10); }
  } else {
    const K = S.cal;
    if (d.moved) { const v = performance.now() - K.velAt > 90 ? 0 : K.vel; K.rotT = Math.round((K.rot + clamp(v, -400, 400) * 0.15) / 30) * 30; }
    else {
      const r = Math.hypot(x - CC.x, y - CC.y);
      if (r > 104 && r < 152) { const rel = (ang(x, y) + 90 - K.rot + 3600) % 360, i = Math.round(rel / 30) % 12; K.rotT = K.rot + wrap180(-(i * 30 + K.rot)); sfx.click(); }
      else K.rotT = Math.round(K.rot / 30) * 30;
    }
  }
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', (ev) => { if (drag && drag.id === ev.pointerId) { drag = null; S.cal.drag = null; S.cal.rotT = Math.round(S.cal.rot / 30) * 30; } });

function openCard(tg) {
  if (!S.found.includes(tg.k)) { S.found.push(tg.k); S.foundAt[tg.k] = now(); sfx.good(); } else sfx.tick();
  S.card = tg.k; render();
}
function setClock(h, m) {
  const K = S.clock; K.h = h; K.m = m;
  K.hT += wrap180((h % 12 + m / 60) * 30 - K.hT); K.mT += wrap180(m * 6 - K.mT);
}
// on a phone the controls sit below the picture: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function onPick(v, i) {
  if (S.pick[v] !== null) return;
  S.pick[v] = i; (i === 0 ? sfx.good : sfx.bad)();
  if (v === 'street') { const L = S.lens; L.x = 210; L.y = 150; L.tx = 282; L.ty = 186; L.a = 0; }
  else if (v === 'words') { S.w.a = 'aqua'; S.w.b = 'arium'; S.w.built = ['aquarium']; S.w.last = 'aquarium'; S.w.curAt = now(); S.w.bad = false; }
  else { S.cal.roman = true; S.cal.sel = 8; }
  showStage(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'pick') onPick(v, +b.dataset.i);
  else if (act === 'tile') {
    const side = b.dataset.t, k = b.dataset.k, ws = S.w;
    ws[side] = ws[side] === k ? null : k; ws.bad = false; sfx.click();
    const cur = pairWord();
    if (cur) { ws.curAt = now(); ws.last = cur; if (!ws.built.includes(cur)) { ws.built.push(cur); sfx.good(); } }
    else if (ws.a && ws.b) { ws.bad = true; ws.badAt = now(); sfx.bad(); }
    render();
  } else if (act === 'mode') { S.cal.roman = b.dataset.m === 'mar'; sfx.click(); render(); }
  else if (act === 'clk') {
    const K = S.clock, d = b.dataset.d;
    if (d === 'h-') setClock(K.h === 1 ? 12 : K.h - 1, K.m); else if (d === 'h+') setClock(K.h === 12 ? 1 : K.h + 1, K.m);
    else if (d === 'm-') setClock(K.h, (K.m + 55) % 60); else setClock(K.h, (K.m + 5) % 60);
    sfx.tick(); render();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); showStage(); render();
  }
});

// --- one render per change: controls, readout and the state card ------------------------------------------------
const mean = (k) => { const s = T[lang].words[k], i = s.indexOf(': '); return i < 0 ? s : s.slice(i + 2); };
function askHTML(v) {
  const t = T[lang], p = S.pick[v];
  const q = v === 'street' ? t.streetAsk : v === 'words' ? t.wordsAsk : t.calAsk;
  const opts = v === 'street' ? t.streetOpts : v === 'words' ? t.wordsOpts : t.calOpts;
  const btns = ORDER.map((i) => `<button type="button" class="rl-opt ${p === null ? '' : 'rl-done'} ${p !== null && i === 0 ? 'good' : p === i ? 'bad' : ''}" data-act="pick" data-i="${i}">${v === 'street' ? ICON[i] : ''}<span>${esc(opts[i])}</span></button>`).join('');
  const right = v === 'street' ? t.streetRight : v === 'words' ? t.wordsRight : t.calRight, wrong = v === 'street' ? t.streetWrong : v === 'words' ? t.wordsWrong : t.calWrong;
  return `<p class="rl-q">${esc(q)}</p><div class="rl-opts ${v === 'calendar' ? 'rl-col' : ''}">${btns}</div>${p === null ? '' : `<div class="rl-v ${p === 0 ? 'ok' : 'no'}">${esc(p === 0 ? right : wrong)}</div>`}`;
}
function statusStreet(t, asking) {
  if (asking) { lab.setReadout('?', '', '', '#9a7418'); lab.setState({ emo: '🤔', title: t.streetAsk, lead: '', body: '' }); lab.setFacts([]); return; }
  const n = S.found.length, gr = S.found.filter((k) => TGBY[k].o === 'g').length;
  lab.setReadout(t.found(n), '', `🏛️ ${gr} · 🦅 ${n - gr}`, '#9a7418');
  const [e, ti, le, bo] = t.st.street; lab.setState({ emo: e, title: ti, lead: le, body: bo }); lab.setFacts(t.facts.street);
}
function statusWords(t, asking) {
  const ws = S.w;
  if (asking) { lab.setReadout('?', '', '', '#5f7f3f'); lab.setState({ emo: '🤔', title: t.wordsAsk, lead: '', body: '' }); lab.setFacts([]); return; }
  lab.setReadout(t.built(ws.built.length), '', ws.last ? mean(ws.last) : '', '#5f7f3f');
  const cur = pairWord(), M = { ...t.roots, ...t.parts }, one = ws.a || ws.b;
  if (ws.bad && ws.a && ws.b) lab.setState({ emo: '🤔', title: t.nope, lead: '', body: '' });
  else if (cur) lab.setState({ emo: WEMO[cur], title: t.wn[cur], lead: mean(cur), body: '' });
  else if (one) lab.setState({ emo: '🔤', title: one, lead: M[one], body: '' });
  else { const [e, ti, le, bo] = t.st.words; lab.setState({ emo: e, title: ti, lead: le, body: bo }); }
  lab.setFacts(t.facts.words);
}
function statusCal(t, asking) {
  if (asking) { lab.setReadout('?', '', '', '#a33b2b'); lab.setState({ emo: '🤔', title: t.calAsk, lead: '', body: '' }); lab.setFacts([]); return; }
  const i = S.cal.sel, o = ORIGIN[i];
  lab.setReadout(cap(t.months[i]), '', o ? t.origins[o] : '', '#a33b2b');
  if (o) lab.setState({ emo: MEMO[i], title: cap(t.months[i]), lead: t.origins[o], body: '' });
  else { const [e, ti, le, bo] = t.st.calendar; lab.setState({ emo: e, title: ti, lead: le, body: bo }); }
  lab.setFacts(t.facts.calendar);
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, asking = !sec && S.pick[v] === null;
  const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  const drags = !sec && ((v === 'street' && S.pick.street !== null) || (v === 'calendar' && S.pick.calendar !== null));
  cv.style.touchAction = drags ? 'none' : 'pan-y';
  show('rlAsk', !sec); if (!sec) $('rlAsk').innerHTML = askHTML(v);
  show('rlStreet', !sec && v === 'street' && !asking);
  show('rlWords', !sec && v === 'words' && !asking);
  show('rlCal', !sec && v === 'calendar' && !asking);
  show('rlClock', sec === 'b');
  if (!sec && v === 'street' && !asking) {
    const o = S.card ? TGBY[S.card].o : null;
    $('rlStreet').innerHTML = S.card
      ? `<div class="rl-card"><span class="rl-badge ${o}">${o === 'g' ? '🏛️' : '🦅'} ${esc(o === 'g' ? t.greece : t.rome)}</span><p>${esc(t.cards[S.card][1])}</p></div>`
      : `<div class="rl-hint">${esc(t.dragLens)}</div>`;
  }
  if (!sec && v === 'words' && !asking) {
    const M = { ...t.roots, ...t.parts }, tile = (k, side) => `<button type="button" class="rl-tile ${side === 'b' ? 'rl-b' : ''} ${S.w[side] === k ? 'on' : ''}" data-act="tile" data-t="${side}" data-k="${k}"><b>${esc(k)}</b><i>${esc(M[k])}</i></button>`;
    $('rlWords').innerHTML = `<div class="rl-note" style="margin-top:12px">${esc(t.pickTiles)}</div><div class="rl-tray">${TILES_A.map((k) => tile(k, 'a')).join('')}</div><div class="rl-tray">${TILES_B.map((k) => tile(k, 'b')).join('')}</div>`;
  }
  if (!sec && v === 'calendar' && !asking) {
    $('rlCal').innerHTML = `<div class="row2" style="margin-top:12px"><div class="card seg small">${[['jan', t.fromJan], ['mar', t.fromMar]].map(([m, l]) => `<button type="button" data-act="mode" data-m="${m}" class="${(m === 'mar') === S.cal.roman ? 'on' : ''}">${esc(l)}</button>`).join('')}</div></div><div class="rl-note">🗓️ ${esc(t.leap)}</div>`;
  }
  if (sec === 'b') {
    const K = S.clock, st = (id, val, a, b) => `<div class="rl-stp"><button type="button" class="rl-sb" data-act="clk" data-d="${a}" aria-label="−">−</button><b>${val}</b><button type="button" class="rl-sb" data-act="clk" data-d="${b}" aria-label="+">+</button></div>`;
    $('rlClock').innerHTML = `<div class="rl-clk">${st('h', K.h, 'h-', 'h+')}<span>:</span>${st('m', String(K.m).padStart(2, '0'), 'm-', 'm+')}</div>`;
  }
  const open = secret.unlocked();
  show('rlSec', !asking);
  $('rlSec').innerHTML = ['a', 'b'].map((k) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'a' ? '🏟️' : '🔢'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setGlow(sec ? 'rgba(212, 169, 60, .26)' : v === 'street' ? 'rgba(212, 169, 60, .28)' : v === 'words' ? 'rgba(95, 127, 63, .3)' : 'rgba(163, 59, 43, .28)');
  if (sec === 'a') {
    lab.setReadout('≈ 1900', t.ago, '', '#9a7418'); lab.setState({ emo: '🏟️', title: t.secrets.a[0], lead: t.pantheonText, body: '' }); lab.setFacts([]);
  } else if (sec === 'b') {
    const K = S.clock;
    lab.setReadout(`${K.h}:${String(K.m).padStart(2, '0')}`, '', K.h === 4 ? 'IV · IIII' : ROM[K.h - 1], '#9a7418');
    lab.setState({ emo: '🔢', title: t.secrets.b[0], lead: t.secrets.b[1], body: t.clockText }); lab.setFacts([]);
  } else if (v === 'street') statusStreet(t, asking);
  else if (v === 'words') statusWords(t, asking);
  else statusCal(t, asking);
}
render();
</script>
