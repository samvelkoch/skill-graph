// --- drawing helpers ------------------------------------------------------------------------------------------
const BGC = [10, 12, 20];

const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2)); };
const FONT = (size, wt = 900) => `${wt} ${size}px Nunito, sans-serif`;
const txt = (c, s, x, y, size, color, wt = 800, align = 'center') => {
  c.save(); c.globalAlpha = 1; c.font = FONT(size, wt); c.textAlign = align; c.textBaseline = 'middle'; c.fillStyle = color; c.fillText(s, x, y); c.restore();
};
// a stacked fraction (top, bar, bottom) centred on (cx, cy); a whole number when the bottom is 1
function fracAt(c, n, d, cx, cy, size, color) {
  if (d === 1) return txt(c, String(n), cx, cy, size * 1.15, color, 900);
  c.save(); c.globalAlpha = 1; c.font = FONT(size); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = color;
  const ws = Math.max(c.measureText(n).width, c.measureText(d).width) + 5, off = size * 0.62;
  c.fillText(n, cx, cy - off); c.fillText(d, cx, cy + off + 1); c.fillRect(cx - ws / 2, cy - 0.9, ws, 1.8);
  c.restore();
}
function glowLine(c, x, y1, y2, color, width = 3) {
  c.save(); c.globalAlpha = 1; c.strokeStyle = color; c.lineWidth = width; c.lineCap = 'round'; c.shadowColor = color; c.shadowBlur = 16;
  c.beginPath(); c.moveTo(x, y1); c.lineTo(x, y2); c.stroke(); c.restore();
}
function blade(c, x, y) { // the little knife head that leads a cut
  c.save(); c.globalAlpha = 1; c.fillStyle = '#e8ecf8'; c.strokeStyle = '#0A0C14'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(x - 6, y - 13); c.lineTo(x + 6, y - 13); c.lineTo(x, y + 3); c.closePath(); c.fill(); c.stroke(); c.restore();
}
// a bar of b pieces with a shaded; with k > 1 every piece is cut into k (prog(i) = how far the knife is through piece i)
function drawBar(c, x, y, W, H, b, a, k, prog, col) {
  c.save(); rr(c, x, y, W, H, 8); c.clip();
  c.fillStyle = mix(col, .66); c.fillRect(x, y, W, H);
  c.fillStyle = col; c.fillRect(x, y, W * a / b, H);
  c.restore();
  c.save(); c.globalAlpha = 1; c.lineCap = 'round';
  if (k > 1) for (let i = 0; i < b; i++) {
    const p = prog ? prog(i) : 1; if (p <= 0) continue;
    for (let m = 1; m < k; m++) {
      const cx = x + W * (i + m / k) / b;
      c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2; c.beginPath(); c.moveTo(cx, y); c.lineTo(cx, y + H * p); c.stroke();
      if (p < 1) blade(c, cx, y + H * p);
    }
  }
  c.strokeStyle = '#0A0C14'; c.lineWidth = 2.5; c.beginPath();
  for (let j = 1; j < b; j++) { const ex = x + W * j / b; c.moveTo(ex, y); c.lineTo(ex, y + H); }
  c.stroke();
  rr(c, x, y, W, H, 8); c.strokeStyle = '#98A0B8'; c.lineWidth = 1.5; c.stroke();
  c.restore();
}

// --- the wall ------------------------------------------------------------------------------------------------
function wallGeo(w, h) {
  const x0 = 50, x1 = w - 10, top = 12, strip = 46, gap = 3;
  const rh = Math.min(64, (h - top - strip - gap * 6) / 7);
  return { x0, x1, W: x1 - x0, top, rh, gap, bottom: top + 7 * rh + 6 * gap };
}
function drawWall(c, w, h, time) {
  const g = wallGeo(w, h), free = S.wmode === 'free', pz = PUZ[S.wi];
  const shade = D.map(() => 0), hl = []; // shade: how much of the wall each row is coloured, 0..1
  let lp = null, done = true, same = false, glowX = null;
  if (free) {
    D.forEach((d, i) => { shade[i] = S.shade[i] / d; });
    lp = S.lk / 24;
    const vs = shade.filter((s) => s > 0);
    if (vs.length > 1 && vs.every((s) => Math.abs(s - vs[0]) < 1e-9)) glowX = vs[0];
  } else if (S.wrev) {
    const { a, b } = pz, va = a[0] / a[1], vb = b[0] / b[1], mx = Math.max(va, vb);
    const prog = clamp((time - S.wAt) / 1.1, 0, 1);
    done = prog >= 1; lp = mx * prog * prog * (3 - 2 * prog);
    shade[rowOf(a[1])] = Math.min(va, lp); shade[rowOf(b[1])] = Math.min(vb, lp);
    hl.push(rowOf(a[1]), rowOf(b[1]));
    same = done && cmpOf(pz) === 0; if (same) glowX = mx;
  }
  const lit = lp !== null && done, bs = clamp(g.rh * 0.28, 12, 15);
  D.forEach((d, i) => {
    const y = g.top + i * (g.rh + g.gap), col = COL[i], sx = shade[i] * g.W;
    for (let j = 0; j < d; j++) {
      const bx = g.x0 + g.W * j / d, bw = g.W / d, fw = clamp(sx - (bx - g.x0), 0, bw);
      c.save(); rr(c, bx + 0.75, y, bw - 1.5, g.rh, 6); c.fillStyle = mix(col, .66); c.fill();
      if (fw > 0) { c.clip(); c.fillStyle = col; c.fillRect(bx, y, fw, g.rh); }
      c.restore();
      rr(c, bx + 0.75, y, bw - 1.5, g.rh, 6); c.lineWidth = 1.5; c.strokeStyle = '#0A0C14'; c.stroke();
      fracAt(c, 1, d, bx + bw / 2, y + g.rh / 2, bs, fw > bw / 2 ? INK : '#D3D9E8');
    }
    // the label of the row: the unit fraction, or the fraction at the laser when it sits on a brick edge
    const e = lit ? edgeOf(lp, d) : null, ly = y + g.rh / 2;
    if (e !== null) fracAt(c, e, d, 27, ly, 15, GREEN);
    else if (hl.includes(i) && done) { const f = rowOf(pz.a[1]) === i ? pz.a : pz.b; fracAt(c, f[0], f[1], 27, ly, 15, '#fff'); }
    else fracAt(c, 1, d, 27, ly, 14, '#98A0B8');
  });
  for (const i of hl) { const y = g.top + i * (g.rh + g.gap); rr(c, g.x0 - 1, y - 1, g.W + 2, g.rh + 2, 7); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke(); }
  if (glowX !== null) {
    const gx = g.x0 + g.W * glowX;
    c.save(); c.fillStyle = 'rgba(61,220,151,.16)'; c.fillRect(gx - 9, g.top - 6, 18, g.bottom - g.top + 12); c.restore();
    glowLine(c, gx, g.top - 6, g.bottom + 6, GREEN, 3);
  }
  if (lp !== null) {
    const lx = g.x0 + g.W * lp, col = same ? GREEN : RED;
    glowLine(c, lx, g.top - 6, g.bottom + (free ? 14 : 6), col, 3);
    if (lit) D.forEach((d, i) => {
      if (edgeOf(lp, d) === null) return;
      c.save(); c.globalAlpha = 1; c.fillStyle = '#fff'; c.beginPath(); c.arc(lx, g.top + i * (g.rh + g.gap) + g.rh / 2, 4.5, 0, 7); c.fill(); c.restore();
    });
    if (free) { // the handle
      c.save(); c.globalAlpha = 1; c.fillStyle = RED; c.strokeStyle = '#fff'; c.lineWidth = 2.5;
      c.beginPath(); c.arc(lx, g.bottom + 16, 10, 0, 7); c.fill(); c.stroke(); c.restore();
      txt(c, T[lang].w.laser, g.x0 + g.W / 2, g.bottom + 37, 12, '#98A0B8', 700);
    }
  }
}

// --- the number lines ------------------------------------------------------------------------------------------
function lineGeo(w, h) { const ch = (h - 16) / 5; return { x0: 28, x1: w - 28, W: w - 56, top: 8, ch, ly: Math.min(26, ch * 0.34) }; }
function drawLine(c, w, h, time) {
  const g = lineGeo(w, h), q = LQ[S.li], tl = LINES.findIndex(([k]) => k === q.line), dl = LINES[tl][1], ans = q.n * dl / q.d;
  const own = LINES.findIndex(([, d]) => d === q.d), rev = S.lrev, prog = rev ? clamp((time - S.lAt) / 0.9, 0, 1) : 0;
  const yL = (i) => g.top + i * g.ch + g.ly, topY = g.top + 2, botY = yL(4) + 30, yo = yL(own);
  const reached = (i) => { const y = yL(i); return y >= yo ? y - yo <= prog * (botY - yo) + 1 : yo - y <= prog * (yo - topY) + 1; };
  const tx = g.x0 + g.W * q.n / q.d;
  // the named line wears a soft band
  rr(c, 6, g.top + tl * g.ch + 2, w - 12, g.ch - 4, 12); c.fillStyle = 'rgba(78,168,255,.10)'; c.fill(); c.strokeStyle = 'rgba(78,168,255,.6)'; c.lineWidth = 1.5; c.stroke();
  if (rev) { // the dashed line drops from the fraction on its own line through all the lines
    c.save(); c.setLineDash([7, 5]); c.strokeStyle = GREEN; c.lineWidth = 2.5; c.lineCap = 'round';
    c.beginPath(); c.moveTo(tx, yo - prog * (yo - topY)); c.lineTo(tx, yo + prog * (botY - yo)); c.stroke(); c.restore();
  }
  LINES.forEach(([, d], i) => {
    const y = yL(i);
    c.save(); c.globalAlpha = 1; c.strokeStyle = i === tl ? '#fff' : '#98A0B8'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(g.x0, y); c.lineTo(g.x1, y); c.stroke(); c.restore();
    for (let k = 0; k <= d; k++) {
      const x = g.x0 + g.W * k / d, hit = rev && reached(i) && k * q.d === q.n * d, mine = i === tl && S.lsel === k;
      if (mine && !rev) { c.save(); c.fillStyle = '#4ea8ff'; c.beginPath(); c.arc(x, y, 11, 0, 7); c.fill(); c.restore(); }
      if (i === tl && rev && k === ans) { c.save(); c.fillStyle = 'rgba(61,220,151,.28)'; c.strokeStyle = GREEN; c.lineWidth = 2.5; c.beginPath(); c.arc(x, y, 12, 0, 7); c.fill(); c.stroke(); c.restore(); }
      if (i === tl && rev && mine && k !== ans) { c.save(); c.strokeStyle = RED; c.lineWidth = 2.5; c.beginPath(); c.arc(x, y, 12, 0, 7); c.stroke(); c.restore(); }
      if (hit) { c.save(); c.fillStyle = GREEN; c.shadowColor = GREEN; c.shadowBlur = 12; c.beginPath(); c.arc(x, y, 7, 0, 7); c.fill(); c.restore(); }
      c.save(); c.globalAlpha = 1; c.strokeStyle = hit ? '#fff' : mine && !rev ? '#fff' : '#D3D9E8'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x, y - 6); c.lineTo(x, y + 6); c.stroke(); c.restore();
      const col = hit ? GREEN : '#98A0B8';
      if (k === 0 || k === d) txt(c, k === 0 ? '0' : '1', x, y + 24, 14, hit ? GREEN : '#D3D9E8', 900);
      else fracAt(c, k, d, x, y + 25, 12, col);
    }
  });
}

// --- the bar that gets cut ----------------------------------------------------------------------------------------
function drawCut(c, w, h, time) {
  const t = T[lang], x0 = 56, W = w - x0 - 14, BH = 56, m = S.cm, rev = S.crev;
  let a = 2, b = 3, k = 1;
  if (m === 'free') { a = S.ca; b = S.cb; k = S.ck; } else if (m === 'mul' && rev) k = 2;
  const el = time - S.cAt, stag = Math.min(0.4, 1.0 / b), prog = (i) => clamp((el - i * stag) / 0.4, 0, 1);
  const done = k === 1 || el >= (b - 1) * stag + 0.4, two = m === 'add';
  const cy1 = two ? h * 0.5 - 56 : h * 0.5, cy2 = h * 0.5 + 56, ex = x0 + W * a / b;
  if (m !== 'free') txt(c, t.c[m], w / 2, 20, 13, '#D3D9E8', 800);
  drawBar(c, x0, cy1 - BH / 2, W, BH, b, a, k, prog, '#5fa8a0');
  fracAt(c, done ? a * k : a, done ? b * k : b, 28, cy1, 20, '#fff');
  if (m !== 'add' && k > 1 && done) glowLine(c, ex, cy1 - BH / 2 - 10, cy1 + BH / 2 + 10, GREEN, 3);
  if (two && rev) {
    const p = clamp((time - S.cAt) / 0.5, 0, 1), y2 = cy2 - BH / 2;
    c.save(); c.globalAlpha = p;
    drawBar(c, x0, y2, W, BH, 4, 3, 1, null, '#e0b050');
    c.fillStyle = '#f5c84c'; c.fillRect(x0 + W * 2 / 3, y2, W * (3 / 4 - 2 / 3), BH); // the part that sticks out
    c.strokeStyle = '#0A0C14'; c.lineWidth = 2.5; c.strokeRect(x0 + W * 2 / 3, y2, W * (3 / 4 - 2 / 3), BH);
    c.restore();
    fracAt(c, 3, 4, 28, cy2, 20, '#fff');
    c.save(); c.globalAlpha = p; glowLine(c, x0 + W * 2 / 3, cy1 - BH / 2 - 12, cy2 + BH / 2 + 12, RED, 3); c.restore();
  }
}

// --- the secret scenes ---------------------------------------------------------------------------------------------
function drawSimplest(c, w, h, time) {
  const [a, b] = S.hist.at(-1), x = 14, W = w - 28, BH = 64, cy = h * 0.58, fa = clamp((time - S.mAt) / 0.6, 0, 1);
  drawBar(c, x, cy - BH / 2, W, BH, b, a, 1, null, '#5fa8a0');
  if (fa < 1 && S.mFrom !== b) { // the edges that disappear when pieces merge fade out
    c.save(); c.globalAlpha = 1 - fa; c.strokeStyle = '#0A0C14'; c.lineWidth = 2.5; c.beginPath();
    for (let j = 1; j < S.mFrom; j++) if ((j * b) % S.mFrom !== 0) { const ex = x + W * j / S.mFrom; c.moveTo(ex, cy - BH / 2); c.lineTo(ex, cy + BH / 2); }
    c.stroke(); c.restore();
  }
  fracAt(c, a, b, w / 2, cy - BH / 2 - 48, 22, '#fff');
}
function drawHundred(c, w, h, dt) {
  const [n, d] = HUN[S.hi], target = n / d * 100;
  S.hshow += clamp(target - S.hshow, -dt * 90, dt * 90);
  const cnt = Math.round(S.hshow), g = Math.min(w - 24, h - 40), cell = g / 10, x0 = (w - g) / 2, y0 = 8;
  for (let i = 0; i < 100; i++) {
    rr(c, x0 + (i % 10) * cell + 1.5, y0 + Math.floor(i / 10) * cell + 1.5, cell - 3, cell - 3, 4);
    c.fillStyle = i < cnt ? '#5fa8a0' : 'rgba(130,145,190,.14)'; c.fill();
  }
  txt(c, `${cnt} / 100`, w / 2, y0 + g + 20, 14, '#D3D9E8', 800);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  c.lineJoin = 'round';
  if (v === 'wall') { if (S.sec === 'simplest') drawSimplest(c, w, h, time); else if (S.sec === 'hundred') drawHundred(c, w, h, dt); else drawWall(c, w, h, time); }
  else if (v === 'line') drawLine(c, w, h, time);
  else drawCut(c, w, h, time);
});

// --- taps and drags on the canvas ------------------------------------------------------------------------------
const cv = $('cv');
const pt = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top, w: r.width, h: r.height }; };
function moveLaser(p, g) {
  const k = clamp(Math.round((p.x - g.x0) / g.W * 24), 0, 24);
  if (k !== S.lk) { S.lk = k; sfx.tick(); }
}
function tapBrick(p, g) {
  const i = Math.floor((p.y - g.top) / (g.rh + g.gap));
  if (i < 0 || i > 6 || (p.y - g.top) - i * (g.rh + g.gap) > g.rh || p.x < g.x0 || p.x >= g.x1) return;
  const d = D[i], j = Math.floor((p.x - g.x0) / (g.W / d));
  S.shade[i] = S.shade[i] === j + 1 ? j : j + 1; sfx.snap();
}
function tapLine(p) {
  if (S.lrev) return;
  const g = lineGeo(p.w, p.h), tl = LINES.findIndex(([k]) => k === LQ[S.li].line), dl = LINES[tl][1], top = g.top + tl * g.ch;
  if (p.y < top || p.y > top + g.ch) return;
  S.lsel = clamp(Math.round((p.x - g.x0) / g.W * dl), 0, dl); S.lnone = false; sfx.tick();
}
cv.addEventListener('pointerdown', (ev) => {
  const p = pt(ev), v = lab.view;
  if (v === 'wall') {
    if (S.sec || S.wmode !== 'free') return;
    const g = wallGeo(p.w, p.h);
    if (p.y > g.bottom + 2) { S.drag = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* no capture */ } moveLaser(p, g); }
    else tapBrick(p, g);
  } else if (v === 'line') tapLine(p);
  else return;
  render();
});
cv.addEventListener('pointermove', (ev) => { if (!S.drag) return; const p = pt(ev); moveLaser(p, wallGeo(p.w, p.h)); render(); });
['pointerup', 'pointercancel'].forEach((n) => cv.addEventListener(n, () => { S.drag = false; }));

// --- controls --------------------------------------------------------------------------------------------------
// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const setCm = (m) => { S.cm = m; S.cg = null; S.crev = false; S.cAt = now(); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-d]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (b.dataset.d) { // steppers of the free cut
    const k = b.dataset.d, hi = k === 'ck' ? 4 : k === 'ca' ? S.cb : 6;
    const n = clamp(S[k] + +b.dataset.s, 1, hi); if (n === S[k]) return;
    S[k] = n; if (S.ca > S.cb) S.ca = S.cb; S.cAt = now(); sfx.tick();
  } else if (act === 'wmode') { S.wmode = b.dataset.m; sfx.click(); }
  else if (act === 'wans') {
    S.wg = b.dataset.g; S.wrev = true; S.wAt = now();
    const p = cmpOf(PUZ[S.wi]), ok = p > 0 ? 'l' : p < 0 ? 'r' : 'e';
    (S.wg === ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'wnext') { S.wi = (S.wi + 1) % PUZ.length; S.wg = null; S.wrev = false; sfx.click(); }
  else if (act === 'reset') {
    if (S.sec === 'simplest') { S.hist = [[12, 16]]; S.mFrom = 16; S.mAt = now(); } else { S.shade = D.map(() => 0); S.lk = 12; }
    sfx.click();
  } else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'simplest') { S.hist = [[12, 16]]; S.mFrom = 16; S.mAt = -9; } else { S.hi = 1; S.hshow = 0; } } // each secret sets itself up
    sfx.click();
  } else if (act === 'div') {
    const n = +b.dataset.n, [a, bb] = S.hist.at(-1);
    if (a % n || bb % n) return;
    S.mFrom = bb; S.mAt = now(); S.hist.push([a / n, bb / n]); sfx.snap();
  } else if (act === 'hpick') { S.hi = +b.dataset.i; sfx.tick(); }
  else if (act === 'lcheck') {
    if (S.lsel === null) return;
    const q = LQ[S.li], dl = LINES.find(([k]) => k === q.line)[1];
    S.lrev = true; S.lAt = now(); (S.lsel === q.n * dl / q.d ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'lnone') { S.lnone = true; S.lsel = null; S.lrev = true; S.lAt = now(); sfx.bad(); showStage(); }
  else if (act === 'lnext') { S.li = (S.li + 1) % LQ.length; S.lsel = null; S.lnone = false; S.lrev = false; sfx.click(); }
  else if (act === 'cm') { setCm(b.dataset.m); sfx.click(); }
  else if (act === 'cans') {
    S.cg = b.dataset.g; S.crev = true; S.cAt = now();
    (S.cg === (S.cm === 'mul' ? 'y' : 'n') ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'cnext') { setCm(S.cm === 'mul' ? 'add' : 'free'); sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'laserR') return;
  const k = +ev.target.value; if (k !== S.lk) { S.lk = k; sfx.tick(); } render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------------
const fr = (n, d) => d === 1 ? `<span>${n}</span>` : `<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const sg = (s) => `<span class="sg">${s}</span>`;
const fineHtml = (t) => `<div class="fine">${esc(t.fine)}</div>`;
const card = (t, k) => { const [emo, title, lead, body] = t.cards[k]; return { emo, title, lead, body, extra: fineHtml(t) }; };

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v === 'wall' && S.sec ? S.sec : v;
  $('secWall').style.display = v === 'wall' ? '' : 'none';
  $('secLine').style.display = v === 'line' ? '' : 'none';
  $('secCut').style.display = v === 'cut' ? '' : 'none';
  if (v === 'wall') renderWall(t); else if (v === 'line') renderLine(t); else renderCut(t);
}

function renderWall(t) {
  const game = S.wmode === 'game', sec = S.sec, open = secret.unlocked();
  lab.setGlow('rgba(224, 176, 80, .22)');
  const sc = (k, emo) => `<button class="chip tall secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('simplest', '🔽') + sc('hundred', '💯');
  $('wMain').style.display = sec ? 'none' : '';
  $('wSecCtl').style.display = sec ? '' : 'none';
  if (sec) return renderSecret(t);
  $('wSecCtl').innerHTML = '';
  $('wModes').innerHTML = [['game', t.w.game], ['free', t.w.free]].map(([m, l]) => `<button data-act="wmode" data-m="${m}" class="${S.wmode === m ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('wGame').style.display = game ? '' : 'none';
  $('wFree').style.display = game ? 'none' : '';
  $('wReset').textContent = t.reset;
  if (game) {
    const pz = PUZ[S.wi], p = cmpOf(pz), ok = p > 0 ? 'l' : p < 0 ? 'r' : 'e', rev = S.wrev;
    const btn = (g, inner) => `<button class="ans ${rev ? (g === ok ? 'good' : g === S.wg ? 'bad' : '') : ''}" data-act="wans" data-g="${g}"${rev ? ' disabled' : ''}>${inner}</button>`;
    $('wAns').innerHTML = btn('l', fr(...pz.a)) + btn('e', esc(t.w.equal)) + btn('r', fr(...pz.b));
    $('wNext').innerHTML = rev ? `<button class="btn" data-act="wnext">${esc(t.next)}</button>` : '';
    if (!rev) {
      lab.setReadout(fr(...pz.a) + sg('?') + fr(...pz.b), t.w.q, '', '#e0b050');
      lab.setState(card(t, 'wall'));
    } else {
      lab.setReadout(fr(...pz.a) + sg(p > 0 ? '&gt;' : p < 0 ? '&lt;' : '=') + fr(...pz.b), '', '', '#e0b050');
      lab.setState({ emo: S.wg === ok ? '✅' : '🤔', title: S.wg === ok ? t.right : t.wrong, lead: t.w.why[S.wi], body: S.wi === 1 ? t.w.add : S.wi === 2 ? t.w.bigNums : '', extra: fineHtml(t) });
    }
    return;
  }
  if ($('laserR').value !== String(S.lk)) $('laserR').value = S.lk;
  $('laserR').setAttribute('aria-label', t.w.laser);
  const rows = D.map((d, i) => [S.shade[i], d]).filter(([n]) => n > 0);
  const eq = rows.length > 1 && rows.every(([n, d]) => n * rows[0][1] === rows[0][0] * d);
  lab.setReadout(rows.length ? rows.map(([n, d]) => fr(n, d)).join(sg(eq ? '=' : '')) : '0', '', '', '#e0b050');
  lab.setState(card(t, 'wall'));
}

function renderSecret(t) {
  if (S.sec === 'simplest') {
    const [a, b] = S.hist.at(-1), can = (n) => a % n === 0 && b % n === 0, end = !can(2) && !can(3) && !can(5);
    lab.setGlow('rgba(95, 168, 160, .26)');
    $('wSecCtl').innerHTML = `<div class="divrow">${[2, 4].map((n) => `<button class="ans" data-act="div" data-n="${n}"${can(n) ? '' : ' disabled'}>÷ ${n}</button>`).join('')}
      <button class="chip tall" data-act="reset">${esc(t.reset)}</button></div>`;
    lab.setReadout(S.hist.map(([x, y]) => fr(x, y)).join(sg('=')), '', '', '#5fa8a0');
    lab.setState({ emo: '🔽', title: t.secrets.simplest[0], lead: end ? t.sec.simpleText : t.secrets.simplest[1], body: '', extra: '' });
  } else {
    const [n, d] = HUN[S.hi], x = n / d * 100, dec = String(x / 100).replace('.', lang === 'en' ? '.' : ',');
    lab.setGlow('rgba(95, 168, 160, .26)');
    $('wSecCtl').innerHTML = `<div class="divrow">${HUN.map(([a, b], i) => `<button class="chip tall ${i === S.hi ? 'on' : ''}" data-act="hpick" data-i="${i}">${a}/${b}</button>`).join('')}</div>`;
    lab.setReadout(fr(n, d) + sg('=') + fr(x, 100) + sg('=') + `<span>${dec}</span>`, '', '', '#5fa8a0');
    lab.setState({ emo: '💯', title: t.secrets.hundred[0], lead: t.sec.hundredText, body: '', extra: '' });
  }
}

function renderLine(t) {
  const q = LQ[S.li], dl = LINES.find(([k]) => k === q.line)[1], ans = q.n * dl / q.d, rev = S.lrev;
  lab.setGlow('rgba(78, 168, 255, .26)');
  $('lBtns').innerHTML = rev ? `<button class="btn" data-act="lnext">${esc(t.next)}</button>`
    : `<button class="btn" data-act="lcheck"${S.lsel === null ? ' disabled' : ''}>${esc(t.check)}</button><button class="chip tall" data-act="lnone">${esc(t.l.none)}</button>`;
  const qs = t.l.q(`${q.n}/${q.d}`, t.l.lines[q.line]);
  if (!rev) {
    lab.setReadout(fr(q.n, q.d) + sg('?'), qs, '', '#4ea8ff');
    lab.setState(card(t, 'line'));
  } else {
    const ok = !S.lnone && S.lsel === ans;
    lab.setReadout(fr(q.n, q.d) + sg('=') + fr(ans, dl), qs, '', '#4ea8ff');
    lab.setState(S.lnone ? { emo: '🤔', title: t.l.wrong, lead: t.l.noneWhy, body: '', extra: fineHtml(t) }
      : { emo: ok ? '✅' : '🤔', title: ok ? t.l.right : t.l.wrong, lead: t.cards.line[2], body: t.cards.line[3], extra: fineHtml(t) });
  }
}

function renderCut(t) {
  const m = S.cm, rev = S.crev, free = m === 'free';
  lab.setGlow('rgba(240, 140, 58, .22)');
  $('cModes').innerHTML = [['mul', t.c.mul], ['add', t.c.add], ['free', t.c.free]].map(([k, l]) => `<button data-act="cm" data-m="${k}" class="${m === k ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('cAns').style.display = free ? 'none' : '';
  $('cSteps').style.display = free ? '' : 'none';
  $('cNext').innerHTML = !free && rev ? `<button class="btn" data-act="cnext">${esc(t.next)}</button>` : '';
  if (!free) {
    const ok = m === 'mul' ? 'y' : 'n';
    const btn = (g, label) => `<button class="ans ${rev ? (g === ok ? 'good' : g === S.cg ? 'bad' : '') : ''}" data-act="cans" data-g="${g}"${rev ? ' disabled' : ''} style="font-size:15px">${esc(label)}</button>`;
    $('cAns').innerHTML = btn('y', t.c.yes) + btn('n', t.c.no);
    const q = m === 'mul' ? t.c.q1 : t.c.q2;
    if (!rev) {
      lab.setReadout(fr(2, 3) + sg('?'), q, '', '#f08c3a');
      lab.setState({ emo: '✂️', title: t.c[m], lead: '', body: '', extra: '' });
    } else {
      lab.setReadout(fr(2, 3) + sg(m === 'mul' ? '=' : '&lt;') + (m === 'mul' ? fr(4, 6) : fr(3, 4)), q, '', '#f08c3a');
      lab.setState({ emo: S.cg === ok ? '✅' : '🤔', title: S.cg === ok ? t.right : t.wrong, lead: m === 'mul' ? t.c.mulWhy : t.c.addWhy, body: '', extra: '' });
    }
    return;
  }
  const { ca: a, cb: b, ck: k } = S;
  $('cSteps').innerHTML = [['ca', t.c.top, a, S.cb, `${a}`], ['cb', t.c.bottom, b, 6, `${b}`], ['ck', t.c.times, k, 4, `×${k}`]].map(([key, lbl, val, hi, shown]) =>
    `<div class="stp"><span class="lbl">${esc(lbl)}</span><div>
      <button class="sb" data-d="${key}" data-s="-1" aria-label="−"${val <= 1 ? ' disabled' : ''}>−</button><b>${shown}</b>
      <button class="sb" data-d="${key}" data-s="1" aria-label="+"${val >= hi ? ' disabled' : ''}>+</button></div></div>`).join('');
  lab.setReadout(fr(a, b) + (k > 1 ? sg('=') + fr(a * k, b * k) : ''), '', '', '#f08c3a');
  lab.setState(card(t, 'cut'));
}
render();
</script>
</body>
</html>
