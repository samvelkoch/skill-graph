// --- the election model (counts of the four families) --------------------------------------------------------
const SEQ = [['L', 30], ['L', 9], ['C', 40], ['L', 12], ['C', 25], ['L', 9], ['C', 45], ['L', 11], ['C', 41], ['V', 41]];

const sum4 = (c) => c[0] + c[1] + c[2] + c[3];
function councilCounts(pct) { // 480 members; Blue gets pct %, the other three split the rest equally
  const b = Math.round(480 * pct / 100), r = 480 - b, e = Math.floor(r / 3), c = [b, e, e, e];
  for (let i = 1, left = r - 3 * e; left > 0; i++, left--) c[i]++;

}
const biggest = (c) => { let f = 0; for (let i = 1; i < 4; i++) if (c[i] > c[f]) f = i; return f; }; // tie: the first family on the list
function lotCounts(g, n) { // draw n members at random, without putting them back
  const h = g.slice(), o = [0, 0, 0, 0];
  let m = sum4(h);
  for (let k = 0; k < n; k++) {
    let r = Math.random() * m, f = 0;
    while (f < 3 && r >= h[f]) { r -= h[f]; f++; }
    h[f]--; o[f]++; m--;

  return o;
}

  const k = sum4(c);
  for (let f = 0; f < 4; f++) if (c[f] * 2 > k) { const o = [0, 0, 0, 0]; o[f] = n; return o; }
  const q = c.map((x) => x * n / k), o = q.map(Math.floor);
  const order = [0, 1, 2, 3].sort((a, b) => (q[b] - o[b]) - (q[a] - o[a]) || a - b);
  for (let i = 0, left = n - sum4(o); left > 0; i++, left--) o[order[i % 4]]++;
  return o;
}
const pluralityCounts = (c, n) => { const o = [0, 0, 0, 0]; o[biggest(c)] = n; return o; }; // votes only: the biggest family takes every seat
const finalWinner = (c) => { for (let f = 0; f < 4; f++) if (c[f] >= 25) return f; return 4; }; // 25 of 41, or a compromise
function venetian(council, trace) {
  let g = council;
  for (const [k, n] of SEQ) {
    if (k === 'V') break;
    g = k === 'L' ? lotCounts(g, n) : chooseCounts(g, n);
    if (trace) trace.push(g);
  }
  return finalWinner(g);
}

// simulations run in small chunks across frames, so the page never freezes
function runJob(job) {

    if (job.cancel) return;
    const t0 = performance.now();
    let k = 0;
    while (job.i < job.total && k < job.perFrame && performance.now() - t0 < 8) { job.step(job.i); job.i++; k++; }
    job.onTick?.();
    if (job.i < job.total) requestAnimationFrame(tick); else job.onDone?.();
  };
  requestAnimationFrame(tick);
  return job;
}

function startUrnJob() {
  const council = councilCounts(40); let wins = 0;
  S.urn.job = runJob({
    total: N_RUNS, perFrame: 25,
    step() { if (venetian(council) === 0) wins++; },
    onTick() { const b = $('deProg'); if (b) b.style.width = `${100 * this.i / N_RUNS}%`; },
    onDone() { S.urn.pct = Math.round(100 * wins / N_RUNS); S.urn.job = null; (urnRight() === S.urn.chosen ? sfx.good : sfx.bad)(); render(); showStage(); },
  });
}
function startCmpJob() {
  const C = S.cmp;
  if (C.job) C.job.cancel = true;
  C.runs = 0; C.vo = [0, 0, 0, 0, 0]; C.lv = [0, 0, 0, 0, 0];
  const council = councilCounts(C.share);
  C.job = runJob({
    total: N_RUNS, perFrame: 12,
    step() { C.vo[votesOnly(council)]++; C.lv[venetian(council)]++; C.runs++; },
    onTick() { readout(); },
    onDone() {
      C.job = null;
      if (C.chosen !== null && !C.verdict) { C.verdict = true; (C.chosen === 0 ? sfx.good : sfx.bad)(); showStage(); }
      render();
    },
  });
  render();
}
function startGraphJob() {
  const G = S.gr, councils = GRAPH_X.map(councilCounts); let acc = 0;
  G.job = runJob({
    total: GRAPH_X.length * GRAPH_RUNS, perFrame: 40,
    step(i) {
      const p = Math.floor(i / GRAPH_RUNS);
      if (i % GRAPH_RUNS === 0) acc = 0;
      if (venetian(councils[p]) === 0) acc++;
      if (i % GRAPH_RUNS === GRAPH_RUNS - 1) { G.pts[p] = 100 * acc / GRAPH_RUNS; G.done = p + 1; readout(); }
    },
    onDone() { G.job = null; G.verdict = true; (G.chosen === 1 ? sfx.good : sfx.bad)(); render(); showStage(); },
  });
}
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('.de-opt'); if (!b || b.disabled) return;
  const i = +b.dataset.i, v = lab.view;
  sfx.click();
  if (v === 'urn' && S.urn.chosen === null) { S.urn.chosen = i; startUrnJob(); }
  else if (v === 'compare' && S.cmp.chosen === null) { S.cmp.chosen = i; startCmpJob(); }
  else if (v === 'graph' && S.gr.chosen === null) { S.gr.chosen = i; startGraphJob(); }
  render();
});
const urnOpen = () => S.urn.pct !== null || S.urn.skip;
$('deNext').onclick = () => { if (!urnOpen()) return; S.urn.card = false; E.playing = false; startRound(); render(); };
$('dePlay').onclick = () => {
  if (!urnOpen()) return;
  S.urn.card = false;
  if (E.r >= 10) newElection();
  E.playing = true; sfx.click();
  if (!E.anim) startRound();
  render();
};
$('deNew').onclick = () => { S.urn.card = false; newElection(); sfx.click(); render(); };
$('deSec').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-k]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  if (b.dataset.k === 'a') S.boy = !S.boy;
  else {
    if (!urnOpen()) { S.urn.skip = true; if (S.urn.job) S.urn.job.cancel = true; }
    S.urn.card = false;
    S.noLots = !S.noLots; newElection(); E.playing = true; startRound();
  }
  sfx.click(); render();
});
$('deCmpS').addEventListener('input', (ev) => {
  const C = S.cmp; C.share = +ev.target.value;
  if (C.job) { C.job.cancel = true; C.job = null; }
  C.runs = 0; C.vo = [0, 0, 0, 0, 0]; C.lv = [0, 0, 0, 0, 0];
  if (C.verdict) C.card = false;
  sfx.tick(); render();
});
$('deRun').onclick = () => { const C = S.cmp; if (C.chosen === null) return; if (C.verdict) C.card = false; sfx.click(); startCmpJob(); };
$('deGrS').addEventListener('input', (ev) => {
  const G = S.gr; G.cursor = +ev.target.value; G.mini = null;
  if (G.verdict) G.card = false;
  sfx.tick(); render();
});

// --- one render per change: controls, ask card, readout, state card ----------------------------------------------
function askHTML(q, opts, chosen, right, extra) {
  return `<div class="de-q">${esc(q)}</div><div class="de-opts">${opts.map((o, i) => {
    const cls = right !== null ? (i === right ? ' de-ok' : i === chosen ? ' de-bad' : '') : i === chosen ? ' de-on' : '';
    return `<button class="de-opt${cls}" data-i="${i}"${chosen !== null ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('')}</div>${extra}`;
}
const running = (t) => `<div class="de-run">${esc(t.running)}</div><div class="de-prog"><i id="deProg"></i></div>`;
const cardOpen = (v) => v === 'urn' ? S.urn.card && !S.urn.skip : v === 'compare' ? S.cmp.card : S.gr.card;
let askKey = '';
function renderAsk(t, v) {
  const open = cardOpen(v);
  askEl.style.display = open ? 'block' : 'none';
  if (!open) { askKey = ''; return; }
  let html;
  if (v === 'urn') {
    const U = S.urn, done = U.pct !== null;
    html = askHTML(t.urnAsk, t.urnOpts, U.chosen, done ? urnRight() : null,
      U.chosen === null ? '' : !done ? running(t)
        : `<div class="de-big">${esc(t.result(U.pct))}</div><div class="de-verdict" style="color:${urnRight() === U.chosen ? '#5cc28a' : '#e06a5a'}">${esc(urnRight() === U.chosen ? t.urnRight : t.urnWrong)}</div>`);
  } else if (v === 'compare') {
    const C = S.cmp;
    html = askHTML(t.compareAsk, t.compareOpts, C.chosen, C.verdict ? 0 : null,
      C.verdict ? `<div class="de-verdict" style="color:${C.chosen === 0 ? '#5cc28a' : '#e06a5a'}">${esc(C.chosen === 0 ? t.compareRight : t.compareWrong)}</div>` : '');
  } else {
    const G = S.gr;
    html = askHTML(t.graphAsk, t.graphOpts, G.chosen, G.verdict ? 1 : null,
      G.verdict ? `<div class="de-verdict" style="color:${G.chosen === 1 ? '#5cc28a' : '#e06a5a'}">${esc(G.chosen === 1 ? t.graphRight : t.graphWrong)}</div>` : '');
  }
  const key = v + lang + html;
  if (key !== askKey) { askKey = key; askEl.innerHTML = html; if (v === 'urn' && S.urn.job) $('deProg').style.width = `${100 * S.urn.job.i / N_RUNS}%`; }
}
const kindOf = (t, k) => k === 'L' ? t.lotKind : k === 'C' ? t.chooseKind : t.voteKind;
function readout() {
  const t = T[lang], v = lab.view;
  if (v === 'urn') {
    if (!urnOpen()) return lab.setReadout('?', '', '', FC[0]);
    const cur = E.anim ? E.anim.i + 1 : E.r, shown = Math.max(1, cur);
    let pill = '';
    if (E.r >= 10 && !E.anim) pill = t.votesFor(famName(t, E.lead), E.yes);
    else if (E.groupSlot >= 0) pill = t.inCommittee(famCounts(E.group)[0], E.group.length);
    return lab.setReadout(t.round(shown), kindOf(t, SEQ[shown - 1][0]), pill, FC[0]);
  }
  if (v === 'compare') {
    const C = S.cmp;
    if (C.chosen === null) return lab.setReadout('?', t.blueWins, '', FC[0]);
    if (!C.runs) return lab.setReadout('—', t.blueWins, '', FC[0]);
    return lab.setReadout(`${Math.round(100 * C.lv[0] / C.runs)} %`, t.blueWins, t.votesOnlyPill(Math.round(100 * C.vo[0] / C.runs)), FC[0]);
  }
  const G = S.gr, idx = (G.cursor - 20) / 5, vo = votesOnly(councilCounts(G.cursor)) === 0 ? 100 : 0;
  const val = G.chosen === null ? '?' : G.pts[idx] === null ? '…' : `${Math.round(G.pts[idx])} %`;
  return lab.setReadout(val, t.lotsVotes, t.votesOnlyPill(vo), FC[0]);
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.de = cardOpen(v) ? 'ask' : v;
  $('deUrn').style.display = v === 'urn' ? 'block' : 'none';
  $('deCmp').style.display = v === 'compare' ? 'block' : 'none';
  $('deGr').style.display = v === 'graph' ? 'block' : 'none';
  renderAsk(t, v);
  lab.setGlow('rgba(63,127,208,.3)');
  // urn controls
  const open = urnOpen();
  $('deNext').textContent = t.next; $('dePlay').textContent = `▶ ${t.playAll}`; $('deNew').textContent = `↻ ${t.newElection}`;
  $('deNext').disabled = !open || !!E.anim || E.r >= 10 || E.playing;
  $('dePlay').disabled = !open || E.playing;
  $('deNew').disabled = !open;
  const un = secret.unlocked();
  const sc = (k, emo, on) => `<button class="chip secret ${un ? 'open' : ''} ${on ? 'on' : ''}" data-k="${k}">${un ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('deSec').innerHTML = sc('a', '👦', S.boy) + sc('b', '🗳️', S.noLots);
  // compare controls
  $('deCmpL').textContent = t.blueShare; $('deCmpV').textContent = `${S.cmp.share} %`;
  $('deRun').textContent = t.run1000; $('deRun').disabled = S.cmp.chosen === null || !!S.cmp.job;
  $('deGrL').textContent = t.blueShare; $('deGrV').textContent = `${S.gr.cursor} %`;
  readout();
  // state card and facts
  const asking = (v === 'urn' && !urnOpen()) || (v === 'compare' && S.cmp.chosen === null) || (v === 'graph' && S.gr.chosen === null);
  if (asking) {
    lab.setState({ emo: t.st[v][0], title: v === 'urn' ? t.urnAsk : v === 'compare' ? t.compareAsk : t.graphAsk, lead: '', body: '', extra: '' });
    lab.setFacts([]);
  } else {
    const [emo, title, lead, body] = t.st[v];
    let extra = '';
    if (v === 'urn') {
      if (S.urn.pct !== null) extra += `<p class="de-res">${esc(t.result(S.urn.pct))}</p>`;
      if (S.noLots) extra += `<p class="de-note">🗳️ ${esc(t.noLotsText)}</p>`;
      if (S.boy) extra += `<p class="de-note">👦 ${esc(t.boyText)}</p>`;
    }
    lab.setState({ emo, title, lead, body, extra });
    lab.setFacts(t.facts[v]);
  }
  lab.checkStage();
}

// --- the loop (everything it uses is declared above) -----------------------------------------------------------
newElection();
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const now = nowS();
  tickElection(now);
  const v = lab.view;
  if (v === 'urn') drawUrnView(c, w, h, now);
  else if (v === 'compare') drawCompare(c, w, h, now);
  else drawGraph(c, w, h, now, dt);
});
render();
</script>
