    for (let i = 0; i < 22; i++) { const rx = w * (.18 + .55 * rnd(i + 1)), ry = sy0 + sh * .2 + ((time * 120 + rnd(i + 9) * sh) % (sh * .8)); c.moveTo(rx, ry); c.lineTo(rx - 3, ry + 9); } c.stroke();
  }
  const rockTop = sy0 + sh * .62; c.beginPath(); c.moveTo(0, sy1); c.lineTo(0, rockTop + 14); c.quadraticCurveTo(w * .28, rockTop - 6, w * .5, rockTop - 2); c.quadraticCurveTo(w * .76, rockTop - 8, w, rockTop + 12); c.lineTo(w, sy1); c.closePath();
  g = c.createLinearGradient(0, rockTop - 8, 0, sy1); g.addColorStop(0, '#a4a9b6'); g.addColorStop(1, '#585e6e'); c.fillStyle = g; c.fill(); c.strokeStyle = '#3d4250'; c.lineWidth = 1.5; c.stroke();
  const px = w * .5, py = rockTop + 3, pa = 1 - e;
  if (pa > .01) { // the lichen patch: an orange rim around a green middle
    c.save(); c.globalAlpha = pa; c.beginPath(); c.ellipse(px, py, w * .115, sh * .1, 0, 0, 7); g = c.createLinearGradient(px, py - 10, px, py + 10); g.addColorStop(0, '#f2a64c'); g.addColorStop(1, '#c46f1d'); c.fillStyle = g; c.fill(); c.strokeStyle = '#8a4a10'; c.lineWidth = 1.2; c.stroke();
    c.fillStyle = '#7bb369'; for (let i = 0; i < 9; i++) { c.beginPath(); c.ellipse(px + (rnd(i + 1) - .5) * w * .15, py + (rnd(i + 11) - .5) * sh * .09, 4 + rnd(i + 3) * 5, 2.5 + rnd(i + 6) * 2.5, 0, 0, 7); c.fill(); }
    c.fillStyle = 'rgba(255,255,255,.3)'; c.beginPath(); c.ellipse(px - w * .04, py - sh * .03, 9, 3, 0, 0, 7); c.fill(); c.restore();
  }
  c.restore();
  // lenses
  const lt = sy1 + 8, lh = h - lt - 10, R = Math.max(40, Math.min(w * .42, lh * .5)), cx = w / 2, ly = lt + lh / 2;
  const r2 = Math.min(R * .6, (w - 24) / 4 - 4), rad = lerp(R, r2, e), off = e * (r2 + 10);
  const cone = (lx) => { c.save(); c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1.5; c.setLineDash([5, 5]); c.beginPath(); c.moveTo(px - w * .05, py + 4); c.lineTo(lx - rad * .82, ly - rad * .55); c.moveTo(px + w * .05, py + 4); c.lineTo(lx + rad * .82, ly - rad * .55); c.stroke(); c.restore(); };
  if (L.sepP < .001) { cone(cx); lens(c, cx, ly, R, 'both', 0, time); }
  else { cone(cx - off); cone(cx + off); lens(c, cx - off, ly, rad, 'alga', e, time); lens(c, cx + off, ly, rad, 'fungus', e, time); }
  // meters
  const mw = (w - 24) / 2, metE = eIO(L.metP), fmt = (d) => (d > 0 ? `+${Math.round(d)}` : `−${Math.round(-d)}`);
  const dA = (dry ? 18 : 55) - 80, dF = 20 - (40 + .35 * S.light);
  meterBox(c, 8, 8, mw, t.alga, mA, metE > .3 ? fmt(dA) : '', '#ff7a7a'); meterBox(c, w / 2 + 4, 8, mw, t.fungus, mF, metE > .3 ? fmt(dF) : '', '#ff7a7a');
  // sugar: new dots while the partners live together
  if (!S.lsep && L.sepP < .02 && light > .02) { S.acc += dt * 7 * light; while (S.acc >= 1 && S.sugar.length < 40) { S.acc -= 1; S.sugar.push({ i: Math.floor(Math.random() * CELLS.length), t0: time }); } if (S.acc > 3) S.acc = 0; }
  S.sugar = S.sugar.filter((p) => time - p.t0 < 2.2);
  c.restore();
}

// --- the sorting game ----------------------------------------------------------------------------------------------
const fbHtml = () => (S.fb ? (S.fb.ok ? `<span><b>${esc(T[lang].right)}</b>${esc(S.fb.why)}</span>` : `<span>🤔 ${esc(S.fb.why)}</span>`) : '');
function renderSort(t) {
  const n = S.placed.length, ci = ORDER[S.so], card = t.cards[ci];
  board.innerHTML = `<div class="sy-top">${S.so < 9
    ? `<div class="sy-card" id="syCard"><div class="sy-ce">${CARD_EMO[ci]}</div><div class="sy-ct">${esc(card.t)}</div></div>`
    : `<button class="btn" data-sortagain="1">↻ ${esc(t.again)}</button>`}</div>
    <div class="sy-fb" id="syFb">${fbHtml()}</div>
    <div class="sy-baskets">${KINDS.map((k) => `<button class="sy-bk" data-k="${k}" style="--c1:${BK_COL[k][0]};--c2:${BK_COL[k][1]}"><span class="sy-bn">${esc(t.kinds[k])}</span>
      <span class="sy-bi">${S.placed.filter((j) => t.cards[j].k === k).map((j) => CARD_EMO[j]).join(' ')}</span></button>`).join('')}</div>`;
  lab.setGlow('rgba(227, 182, 94, .22)');
  lab.setReadout(`${n} / 9`, t.sortedWord, S.fb?.ok ? t.right : '', '#e3b65e');
  const lionDone = S.placed.includes(7);
  lab.setState({ ...(lionDone ? t.state.sort : t.state.sort0), extra: '' });
  lab.setFacts(t.facts.sort);
}
function place(kind, dx, dy) {
  const t = T[lang], el = $('syCard'), bk = board.querySelector(`.sy-bk[data-k="${kind}"]`);
  if (!el || !bk || S.busy || S.so >= 9) return;
  const ci = ORDER[S.so], card = t.cards[ci];
  if (card.k === kind) {
    S.busy = true; sfx.good();
    const r = el.getBoundingClientRect(), b = bk.getBoundingClientRect();
    el.style.animation = 'none'; el.style.transition = 'transform .4s cubic-bezier(.5,0,.3,1), opacity .4s';
    el.style.transform = `translate(${dx + (b.left + b.width / 2) - (r.left + r.width / 2)}px, ${dy + (b.top + b.height / 2) - (r.top + r.height / 2)}px) scale(.3)`; el.style.opacity = '0';
    setTimeout(() => { S.placed.push(ci); S.so++; S.fb = { ok: true, why: card.why }; S.busy = false; render(); }, 430);
  } else {
    sfx.bad(); S.wrong++; S.fb = { ok: false, why: card.why }; $('syFb').innerHTML = fbHtml();
    bk.classList.remove('shake'); void bk.offsetWidth; bk.classList.add('shake'); setTimeout(() => bk.classList.remove('shake'), 450);
    el.style.animation = 'none'; el.style.transition = 'transform .5s cubic-bezier(.3,1.7,.5,1)'; el.style.transform = '';
  }
}
let drag = null;
const basketAt = (x, y) => { for (const e of document.elementsFromPoint(x, y)) { const b = e.closest?.('.sy-bk'); if (b) return b; } return null; };
board.addEventListener('pointerdown', (ev) => {
  const card = ev.target.closest('#syCard'); if (!card || S.busy) return;
  drag = { id: ev.pointerId, x0: ev.clientX, y0: ev.clientY, dx: 0, dy: 0, moved: false, card };
  try { card.setPointerCapture(ev.pointerId); } catch { /* capture is optional */ }
  card.style.animation = 'none'; card.style.transition = 'none';
});
board.addEventListener('pointermove', (ev) => {
  if (!drag || ev.pointerId !== drag.id) return;
  drag.dx = ev.clientX - drag.x0; drag.dy = ev.clientY - drag.y0;
  if (Math.hypot(drag.dx, drag.dy) > 6) drag.moved = true;
  drag.card.style.transform = `translate(${drag.dx}px, ${drag.dy}px) scale(1.05) rotate(${clamp(drag.dx / 40, -6, 6)}deg)`;
  const bk = basketAt(ev.clientX, ev.clientY); board.querySelectorAll('.sy-bk').forEach((b) => b.classList.toggle('hot', b === bk));
});
const endDrag = (ev, cancel) => {
  if (!drag || ev.pointerId !== drag.id) return;
  const d = drag; drag = null; board.querySelectorAll('.sy-bk').forEach((b) => b.classList.remove('hot'));
  const bk = cancel ? null : basketAt(ev.clientX, ev.clientY);
  if (bk && d.moved) place(bk.dataset.k, d.dx, d.dy);
  else { d.card.style.transition = 'transform .45s cubic-bezier(.3,1.7,.5,1)'; d.card.style.transform = ''; }
};
board.addEventListener('pointerup', (ev) => endDrag(ev, false));
board.addEventListener('pointercancel', (ev) => endDrag(ev, true));
board.addEventListener('click', (ev) => {
  if (ev.target.closest('[data-sortagain]')) { S.placed = []; S.so = 0; S.fb = null; sfx.click(); render(); return; }
  const bk = ev.target.closest('.sy-bk'); if (bk) place(bk.dataset.k, 0, 0);
});

// --- controls ------------------------------------------------------------------------------------------------------
const pairRight = (i) => { const g = S.g[i]; return S.done[i] && !!g && g[0] === PAIRS[i].s[0] && g[1] === PAIRS[i].s[1]; };
function pairSep() {
  const g = S.g[S.pi];
  if (!S.done[S.pi]) {
    if (!g || !g[0] || !g[1]) return;
    S.done[S.pi] = true; S.sep = true; sfx.snap(); showStage();
    const i = S.pi; setTimeout(() => { if (S.pi === i && S.sep) (pairRight(i) ? sfx.good : sfx.bad)(); }, 1500);
    return;
  }
  S.sep = !S.sep; sfx.click(); if (S.sep) showStage();
}
function lichenSep() {
  if (S.lAsk) return;
  if (S.lsep) { S.lsep = false; sfx.click(); return; }
  if (!S.lDone) { S.lAsk = true; sfx.click(); return; }
  S.lsep = true; sfx.snap(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'g') { if (S.done[S.pi]) return; S.g[S.pi] ??= [null, null]; S.g[S.pi][+b.dataset.r] = b.dataset.s; sfx.tick(); }
  else if (a === 'sep') pairSep();
  else if (a === 'next') { S.pi = (S.pi + 1) % PAIRS.length; S.sep = false; S.A.sepP = S.A.metP = 0; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.sep = false; S.A.sepP = S.A.metP = 0; sfx.click();
  } else if (a === 'wx') { S.weather = b.dataset.w; sfx.tick(); }
  else if (a === 'lsep') lichenSep();
  else if (a === 'lg') { // the child's guess about the alga, then the reveal by the animation (always on a dry rock, as asked)
    S.lGuess = +b.dataset.j; S.lAsk = false; S.lDone = true; S.weather = 'dry'; S.lsep = true; sfx.snap(); showStage();
    setTimeout(() => { if (S.lsep) (S.lGuess === 0 ? sfx.good : sfx.bad)(); }, 1800);
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'syLight') S.light = +ev.target.value;
  else if (ev.target.id === 'sySlR' && S.sec) S[S.sec] = +ev.target.value;
  else return;
  render();
});

// --- one render per change: controls, readout, the state card and the facts ------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('syPairs').style.display = v === 'pairs' ? 'block' : 'none';
  $('syLich').style.display = v === 'lichen' ? 'block' : 'none';
  $('ctrlBody').style.display = v === 'sort' ? 'none' : 'block';
  board.style.display = v === 'sort' ? 'grid' : 'none';
  if (v === 'pairs') renderPairs(t); else if (v === 'sort') renderSort(t); else renderLichen(t);
}
function renderPairs(t) {
  const sec = S.sec, i = S.pi, tp = t.pairs[i], done = S.done[i], g = S.g[i] || [null, null];
  $('syPick').style.display = sec ? 'none' : 'block';
  $('sySl').style.display = sec ? 'block' : 'none';
  $('syRows').innerHTML = [0, 1].map((r) => {
    const truth = PAIRS[i].s[r];
    return `<div><div class="sy-who">${esc(cap(r ? tp.b : tp.a))}</div><div class="sy-chips">${['p', 'z', 'm'].map((k) => {
      let cls = 'sy-chip'; if (done) { if (k === truth) cls += ' ok'; else if (k === g[r]) cls += ' bad'; } else if (k === g[r]) cls += ' on';
      return `<button class="${cls}" data-act="g" data-r="${r}" data-s="${k}"${done ? ' disabled' : ''}>${esc(t.signs[k])}</button>`;
    }).join('')}</div></div>`;
  }).join('');
  const main = $('syMain'); main.textContent = S.sep ? t.together : t.separate; main.disabled = !done && !(g[0] && g[1]);
  const nx = $('syNext'); nx.textContent = t.next; nx.style.display = done ? '' : 'none';
  const open = secret.unlocked();
  $('sySec').innerHTML = [['ox', '🐦', 'a'], ['tk', '🦟', 'b']].map(([k, e, s]) => `<button class="sy-chip sec ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[s][0])}` : '🔒 ???'}</button>`).join('');
  lab.setGlow('rgba(31, 122, 168, .3)');
  const nDone = S.done.filter(Boolean).length;
  if (sec) {
    const r = $('sySlR'), lo = sec === 'ox' ? 0 : 1, hi = sec === 'ox' ? 30 : 200;
    if (+r.min !== lo) r.min = lo; if (+r.max !== hi) r.max = hi; if (+r.value !== S[sec]) r.value = S[sec];
    $('sySlL').textContent = sec === 'ox' ? t.ticksOnBuffalo : t.ticksOnDog; $('sySlV').textContent = S[sec];
    const ox = sec === 'ox', kind = ox ? (S.ox >= 10 ? 'both' : 'loses') : 'loses', sc = t.secrets[ox ? 'a' : 'b'];
    lab.setReadout(String(S[sec]), ox ? t.ticksOnBuffalo : t.ticksOnDog, t.kinds[kind], ox ? '#e3b65e' : '#ff7a7a');
    lab.setState({ emo: ox ? '🐦' : '🦟', title: sc[0], lead: sc[1], body: '', extra: '' });
  } else {
    const right = pairRight(i);
    let extra = '';
    if (done && S.sep) extra = right ? `<b style="color:var(--ok)">${esc(t.right)}</b>`
      : `<b style="color:var(--wip)">${esc(t.notQuite)}</b> ${esc(g[0] !== PAIRS[i].s[0] ? tp.ca : tp.cb)}`;
    lab.setReadout(`${PAIRS.filter((_, j) => pairRight(j)).length} / ${PAIRS.length}`, t.pairsWord, done && S.sep && right ? t.right : '', '#1f7aa8');
    lab.setState({ ...(nDone >= 3 ? t.state.pairsNamed : t.state.pairs), extra });
  }
  lab.setFacts(t.facts.pairs);
}
function renderLichen(t) {
  const L = S.L;
  lab.setGlow('rgba(240, 160, 75, .25)');
  $('syLightL').textContent = t.sun; $('syLightV').textContent = `${S.light}%`;
  const sl = $('syLight'); if (+sl.value !== S.light) sl.value = S.light;
  $('syWx').innerHTML = [['rain', t.rain], ['dry', t.dry]].map(([k, l]) => `<button data-act="wx" data-w="${k}" class="${S.weather === k ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('syAsk').innerHTML = S.lAsk ? `<div class="sy-q">${esc(t.qLichen)}</div><div class="sy-chips">${LPERM.map((j) => `<button class="sy-chip" data-act="lg" data-j="${j}">${esc(t.optsLichen[j])}</button>`).join('')}</div>` : '';
  $('syLAct').style.display = S.lAsk ? 'none' : 'flex';
  $('syLBtn').textContent = S.lsep ? t.together : t.separate;
  lichenReadout();
  let extra = '';
  if (S.lDone && S.lsep) extra = S.lGuess === 0 ? `<b style="color:var(--ok)">${esc(t.right)}</b>` : `<b style="color:var(--wip)">${esc(t.notQuite)}</b> ${esc(t.state.lichen.body)}`;
  lab.setState({ ...(S.lDone ? t.state.lichen : t.state.lichen0), extra });
  lab.setFacts(t.facts.lichen);
}

// --- the canvas loop (declared last: everything it reads exists by now) ---------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'pairs') drawPairs(c, w, h, dt, time);
  else if (v === 'lichen') drawLichen(c, w, h, dt, time);
});
render();
</script>
