// --- numbers: every amount is an integer count of hundredths; the decimal mark follows the language -------------
const SEP = () => (lang === 'en' ? '.' : ',');
const fmt = (h, places = 'trim', sep = SEP()) => {
  const w = Math.floor(h / 100); let f = String(h % 100).padStart(2, '0');
  if (places === 'trim') f = f.replace(/0+$/, '');
  return w + (f ? sep + f : '');
};
const VAL = [100, 10, 1];                 // gold, silver, copper in hundredths
const D3 = (d) => Math.min(d, 3);
const EMO = ['🟡', '⚪', '🟤', '🟤'];
const NS = [2, 3, 4, 5, 6, 8];           // pieces / friends in the Ribbon view (7 would never end)

// --- texts -------------------------------------------------------------------------------------------------
const CN_EN = ['gold', 'silver', 'copper', 'tiny'];

  ['медная монета', 'медные монеты', 'медных монет'], ['крошечная монета', 'крошечные монеты', 'крошечных монет']];

const huAccPl = (d) => huC(d).replace(/érme$/, 'érméket');
const huArt = (s) => (/^[aeiouáéíóöőúüű]/i.test(s) ? 'az' : 'a');

const T = {

      column: [{ emo: '📖', text: 'Decimal fractions were known before 1585, but the source says nobody had established their daily use before Simon Stevin and his booklet De Thiende, “the art of tenths”.', src: 'https://en.wikipedia.org/wiki/Simon_Stevin' },
        { emo: '📚', text: 'De Thiende was written in Dutch and translated into French as La Disme.', src: 'https://en.wikipedia.org/wiki/Simon_Stevin' }],

function plan(N, k) {
  const st = []; let p = N;
  for (let d = 0; d < 3; d++) { const q = Math.floor(p / k), rem = p - q * k; st.push({ d, p, q, rem }); if (!rem) break; p = rem * 10; }

}

  return { N, k, acts, ans: st.reduce((s, x) => s + x.q * VAL[x.d], 0) };

// written division by digits: step p works on place p (0 = units, 1 = tenths, 2 = hundredths)
function colSteps(a, k, limit, stop = true) {
  const N = Math.floor(a / 100), dec = String(a % 100).padStart(2, '0').replace(/0+$/, ''), steps = []; let rem = 0, cur = N;
  for (let p = 0; p < limit; p++) {
    let digit = null, added = false;
    if (p > 0) { if (p - 1 < dec.length) digit = +dec[p - 1]; else { digit = 0; added = true; } cur = rem * 10 + digit; }
    const q = Math.floor(cur / k), prod = q * k; rem = cur - prod;
    steps.push({ p, cur, q, prod, rem, digit, added });
    if (stop && rem === 0 && p >= dec.length) break;
  }
  return { N, dec, steps, m: String(N).length, k, a, ans: steps.reduce((s, x) => s + x.q * (VAL[x.p] ?? 0), 0) };
}

function gridHTML(D, st, inf, t) {

  const pc = (q) => (q >= 1 ? xp + ptW + (q - 1) * colW + colW / 2 : x0 + (m - 1 + q) * colW + colW / 2);
  const gapX = (g) => (g === 0 ? x0 + (m - 1) * colW : g === 1 ? xp + ptW / 2 : xp + ptW + (g - 1) * colW);
  const el = [], kc = (p) => `k${Math.min(p, 2)}`;
  const tx = (s, cx, y, cls = '', w = colW) => el.push(`<div class="t ${cls}" style="left:${cx - w / 2}px;top:${y}px;width:${w}px">${s}</div>`);
  const ln = (x, y, w, h) => el.push(`<i class="ln" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></i>`);
  tx(String(k), 18, 36, 'dv', 30); ln(x0 - 8, 34, W - x0 + 8, 2); ln(x0 - 9, 34, 2, RH + 4);
  [...String(N)].forEach((ch, i) => tx(ch, x0 + i * colW + colW / 2, 36));
  const added = steps.some((s) => s.added);
  if (dec.length || si >= 1) tx(SEP(), xp + ptW / 2, 36, dec.length ? '' : `add k0`, ptW);
  else if (added) tx(SEP(), xp + ptW / 2, 36, 'ghost', ptW);
  [...dec].forEach((ch, j) => tx(ch, pc(j + 1), 36));
  steps.forEach((s, i) => { if (s.added && si >= i) tx('0', pc(i), 36, `add ${kc(i)}`); });
  if (inf && si >= 1) tx('…', pc(DC) + colW / 2 + 6, 36, 'dim', 20);
  // quotient
  for (let p = 0; p < B; p++) {
    if (p < si) tx(String(steps[p].q), pc(p), 3, `${kc(p)}`);
    else if (!inf) el.push(`<i class="qb" style="left:${pc(p) - 15}px;top:4px"></i>`);
  }
  if ((inf && si >= 1) || (!inf && st.gap !== null)) tx(SEP(), xp + ptW / 2, 3, inf ? 'dim' : 'ok', ptW);
  if (!inf && st.gap !== null && st.ok === false) tx('×', gapX(st.gap), 3, 'bad', 22);
  if (inf && si >= 2) tx('…', pc(si - 1) + colW / 2 + 8, 3, 'dim', 20);
  if (!inf && st.gap === null) for (let g = 0; g <= B; g++) el.push(`<button type="button" class="gp" data-g="${g}" aria-label="${esc(t.col.gap)}" style="left:${gapX(g) - 18}px;top:2px"></button>`);
  // working rows
  let y = 36 + RH + 8;

    const s = steps[i], ps = String(s.prod), nx = steps[i + 1], rs = nx ? String(nx.cur) : String(s.rem), pe = nx ? i + 1 : i;

    y += RH + 2;

}

  // readout: coins of one friend (never a running decimal before the reveal)
  const cnt = [0, 0, 0]; for (let i = 0; i < c.ai; i++) if (A[i].t === 'deal') cnt[A[i].d] = A[i].q;
  const tally = cnt.map((n, d) => (n ? `${n}${EMO[d]}` : '')).filter(Boolean).join(' ');
  lab.setReadout(c.done ? fmt(P.ans) : (tally || '—'), c.done ? cc.subDone : cc.sub, `🏦 ${potTally(SC1) || cc.empty}`, '#f2c14e');
}

function renderColumn() {
  const t = T[lang], { D, st, inf } = colCur(), K = S.k, open = secret.unlocked(), n = D.steps.length;
  lab.setGlow('rgba(143, 127, 208, .24)');
  const sc = (k, emo) => `<button type="button" class="chip secret sd-ch${open ? ' open' : ''}${S.sec === k ? ' on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  let ctl = !S.sec && K.gap === null ? `<div class="sd-q">${esc(t.col.predT)}</div>` : '';
  if (S.sec === 'sep') {
    ctl = `<div class="sd-row"><button type="button" class="btn sd-main" data-act="isep" style="margin-left:0">${esc(t.sep.swap)}</button></div>`;
  } else if (inf) {
    ctl = `<div class="sd-row"><button type="button" class="btn sd-main" id="sdMain" data-act="kstep" style="margin-left:0"${st.si >= n ? ' disabled' : ''}>${esc(t.inf.go)}</button>
      <button type="button" class="chip sd-ch" data-act="krest">${esc(t.inf.reset)}</button></div>`;
  } else {
    const done = st.si >= n;
    ctl = `<div class="sd-row"><div class="chips">${CPR.map((p, i) => chip('kp', `data-i="${i}"`, `${fmt(p.a)} ÷ ${p.k}`, i === K.pi)).join('')}</div></div>
      <div class="sd-row"><button type="button" class="chip sd-ch" data-act="krest">${esc(t.col.again)}</button>
      <button type="button" class="btn sd-main" id="sdMain" data-act="${done ? 'knext' : 'kstep'}"${!done && K.gap === null ? ' disabled' : ''}>${esc(done ? t.col.nextP : t.col.next)}</button></div>`;
  }
  ctl += `<div class="sd-row"><span class="lbl">🔓</span>${sc('sep', '🔀')}${sc('inf', '♾️')}</div>`;
  $('vk').innerHTML = ctl;
  // written area
  if (S.sec === 'sep') {
    wr.className = 'sd-wr full';
    const ans = CPR[K.pi].ans, pt = fmt(ans, 'trim', '.'), cm = fmt(ans, 'trim', ','), hi = (s) => esc(s).replace(/([.,])/, '<i>$1</i>'), sel = S.sepSel;
    wr.innerHTML = `<div class="sd-sep"><div class="sd-cards">
      <button type="button" class="sd-card${sel === 0 ? ' on' : ''}" data-s="0"><div class="big">${hi(pt)}</div><div class="nm">${esc(t.sep.point)}</div><div class="co">${esc(t.sep.pc)}</div></button>
      <button type="button" class="sd-card${sel === 1 ? ' on' : ''}" data-s="1"><div class="big">${hi(cm)}</div><div class="nm">${esc(t.sep.comma)}</div><div class="co">${esc(t.sep.cc)}</div></button></div>
      <p>${esc(t.sep.lead)}</p><p>${esc(t.sep.mine)}</p></div>`;
  } else {
    wr.className = 'sd-wr'; wr.innerHTML = gridHTML(D, st, inf, t);
  }
  // state
  const cl = t.col;
  if (S.sec === 'sep') lab.setState({ emo: '🌍', title: t.sep.t, lead: t.sep.lead, body: t.sep.mine, extra: '' });
  else if (inf) {
    const s = D.steps[st.si - 1];
    lab.setState(st.si === 0 ? { emo: '♾️', title: t.inf.q, lead: t.inf.lead0, body: '', extra: '' }
      : { emo: '♾️', title: st.si >= n ? t.inf.t : cl.stepT(st.si, n), lead: cl.stepL(s.p, s.cur, D.k, s.q, s.rem), body: st.si >= n ? t.inf.end : t.inf.lead, extra: '' });
  } else if (K.gap === null) lab.setState({ emo: '🤔', title: cl.predT, lead: cl.predL(fmt(D.a), D.k, n), body: '', extra: '' });
  else if (st.si === 0) lab.setState({ emo: K.ok ? '✅' : '🧐', title: K.ok ? cl.okT : cl.noT, lead: cl.afterL, body: '', extra: '' });
  else if (st.si >= n) {
    const s = D.steps[n - 1];
    lab.setState({ emo: '🏁', title: cl.doneT(fmt(D.a), D.k, fmt(D.ans)), lead: `${cl.stepL(s.p, s.cur, D.k, s.q, s.rem)} ${cl.stepEnd}`, body: cl.doneL, extra: '' });
  } else {
    const s = D.steps[st.si - 1], nx = D.steps[st.si];
    lab.setState({ emo: '✏️', title: cl.stepT(st.si, n), lead: cl.stepL(s.p, s.cur, D.k, s.q, s.rem), body: nx.added ? cl.stepAdd(s.rem, s.p) : cl.stepOrig(s.rem, s.p, nx.digit, nx.cur), extra: '' });
  }
  // readout
  if (S.sec === 'sep') lab.setReadout(`${fmt(CPR[K.pi].ans, 'trim', '.')} · ${fmt(CPR[K.pi].ans, 'trim', ',')}`, '', '', '#8f7fd0');
  else if (inf) lab.setReadout(st.si ? `${D.steps.slice(0, st.si).map((s, i) => `${s.q}${i === 0 ? SEP() : ''}`).join('')}…` : '1 ÷ 3', '', `🏦 ${potTally(SC2) || T[lang].c.empty}`, '#8f7fd0');
  else lab.setReadout(`${fmt(D.a)} ÷ ${D.k}${st.si >= n ? ` = ${fmt(D.ans)}` : ''}`, '', `🏦 ${potTally(SC2) || T[lang].c.empty}`, '#8f7fd0');
}

function renderRibbon() {
  const t = T[lang], R = S.r, m = R.mode, M = RB[m], n = R.n[m], asked = R.asked[m], len = M.total / n, txt = (h) => (m === 'ribbon' ? fmt(h) : fmt(h, 2));
  lab.setGlow('rgba(226, 85, 141, .22)');
  let ctl = `<div class="sd-row"><div class="chips">${chip('rm', 'data-m="ribbon"', `🎀 ${fmt(RB.ribbon.total)} ${t.unit}`, m === 'ribbon')}${chip('rm', 'data-m="bill"', `🧾 ${fmt(RB.bill.total, 2)}`, m === 'bill')}</div></div>`;
  if (!asked) ctl += padHTML(R.guess[m], t, t.rb.q(m));
  else {
    const at = NS.indexOf(n);
    ctl += `<div class="sd-row"><span class="lbl">${esc(m === 'ribbon' ? t.rb.pieces : t.rb.friends)}</span><div class="sd-step"><button type="button" class="sd-sb" data-act="rn" data-s="-1" aria-label="−"${at <= 0 ? ' disabled' : ''}>−</button><b>${n}</b>
      <button type="button" class="sd-sb" data-act="rn" data-s="1" aria-label="+"${at >= NS.length - 1 ? ' disabled' : ''}>+</button></div></div><div class="sd-note">${esc(t.rb.hint)}</div>`;
  }
  $('vr').innerHTML = ctl;
  const rb = t.rb;
  if (!asked) lab.setState({ emo: '🤔', title: rb.predT(m, n), lead: rb.predL(m, n), body: '', extra: '' });
  else {
    const body = rb.body(m, M.total, n, len);
    if (R.verdict[m]) lab.setState({ emo: R.ok[m] ? '✅' : '🧐', title: R.ok[m] ? rb.okT : rb.noT(m, txt(len)), lead: `${R.ok[m] ? '' : rb.you(R.said[m])}${rb.expL(txt(M.total), n, txt(len))}`, body, extra: '' });
    else lab.setState({ emo: m === 'ribbon' ? '🎀' : '🧾', title: rb.expT(m, n), lead: rb.expL(txt(M.total), n, txt(len)), body, extra: '' });
  }
  lab.setReadout(asked ? `${txt(len)}${m === 'ribbon' ? ` ${t.unit}` : ''}` : '?', rb.sub(m, n), `${txt(M.total)} ÷ ${n}`, '#e2558d');
}

// --- the Ribbon picture -----------------------------------------------------------------------------------------------
function drawRibbon(ctx, w, h, dt) {
  const t = T[lang], R = S.r, m = R.mode, M = RB[m], n = R.n[m], asked = R.asked[m], tot = M.total, len = tot / n;
  R.cutT = clamp(R.cutT + (asked ? dt / .8 : -dt / .3), 0, 1);
  const e = R.cutT < .5 ? 4 * R.cutT ** 3 : 1 - Math.pow(-2 * R.cutT + 2, 3) / 2;
  const oy = Math.max(0, (h - 236) / 2 - 2), X0 = 18, X1 = w - 18, BW = X1 - X0, kx = BW / tot;
  const txt = (v) => (m === 'ribbon' ? fmt(v) : fmt(v, 2));
  // total bracket
  pill(ctx, `${txt(tot)}${m === 'ribbon' ? ` ${t.unit}` : ''}`, w / 2, oy + 18, 15, w);
  ctx.save(); ctx.strokeStyle = 'rgba(255, 255, 255, .5)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(X0, oy + 38); ctx.lineTo(X0, oy + 44); ctx.moveTo(X0, oy + 41); ctx.lineTo(X1, oy + 41); ctx.moveTo(X1, oy + 38); ctx.lineTo(X1, oy + 44); ctx.stroke(); ctx.restore();
  // band
  const by = oy + 52, bh = 44, g = 8 * e, pw = (BW - (n - 1) * g) / n, cnt = e > 0 ? n : 1;
  for (let i = 0; i < cnt; i++) {
    const x = cnt === 1 ? X0 : X0 + i * (pw + g), ww = cnt === 1 ? BW : pw;
    ctx.save(); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0, 0, 0, .3)'; rr(ctx, x + 2, by + 4, ww, bh, 6); ctx.fill();
    if (m === 'ribbon') {
      const gr = ctx.createLinearGradient(0, by, 0, by + bh); gr.addColorStop(0, '#f06aa0'); gr.addColorStop(.5, '#d23c7d'); gr.addColorStop(1, '#8e2260');
      ctx.fillStyle = gr; rr(ctx, x, by, ww, bh, 6); ctx.fill();
      ctx.fillStyle = 'rgba(255, 255, 255, .22)'; rr(ctx, x + 3, by + 4, Math.max(0, ww - 6), 7, 3); ctx.fill();
      ctx.strokeStyle = 'rgba(255, 230, 240, .4)'; ctx.setLineDash([4, 3]); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + 4, by + 5); ctx.lineTo(x + ww - 4, by + 5); ctx.moveTo(x + 4, by + bh - 5); ctx.lineTo(x + ww - 4, by + bh - 5); ctx.stroke();
    } else {
      const gr = ctx.createLinearGradient(0, by, 0, by + bh); gr.addColorStop(0, '#f8f1dc'); gr.addColorStop(1, '#d9ca9f');
      ctx.fillStyle = gr; rr(ctx, x, by, ww, bh, 5); ctx.fill();
      ctx.fillStyle = 'rgba(80, 70, 50, .35)';
      for (let q = 0; q < 3; q++) { rr(ctx, x + 8, by + 10 + q * 10, Math.max(0, Math.min(ww - 16, 40 + q * 14)), 4, 2); ctx.fill(); }
      ctx.fillStyle = '#1b2236'; for (let px = x + 6; px < x + ww - 3; px += 9) { ctx.beginPath(); ctx.arc(px, by, 2, 0, 7); ctx.arc(px, by + bh, 2, 0, 7); ctx.fill(); }
    }
    ctx.restore();
    if (e > .6) pill(ctx, txt(len), x + ww / 2, by + bh / 2, 13, w, '#fff', 'rgba(10, 12, 20, .78)');
  }
  if (e > 0 && e < 1) for (let b = 1; b < n; b++) { const x = X0 + b * (pw + g) - g / 2; ctx.save(); ctx.globalAlpha = 1; ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('✂️', x, by - 6 + e * 6); ctx.restore(); }
  // ruler
  const ry = by + bh + 10, rh = 30;
  ctx.save(); const rg = ctx.createLinearGradient(0, ry, 0, ry + rh); rg.addColorStop(0, '#f4e8bd'); rg.addColorStop(1, '#d9c88c');
  ctx.fillStyle = 'rgba(0, 0, 0, .3)'; rr(ctx, X0 - 6, ry + 3, BW + 12, rh, 5); ctx.fill();
  ctx.fillStyle = rg; rr(ctx, X0 - 6, ry, BW + 12, rh, 5); ctx.fill();
  ctx.strokeStyle = '#4a3f22'; ctx.fillStyle = '#4a3f22'; ctx.font = `800 12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (let u = 0; u <= tot; u += M.minor) {
    const x = X0 + u * kx, major = u % M.major === 0; ctx.lineWidth = major ? 1.5 : 1; ctx.beginPath(); ctx.moveTo(x, ry); ctx.lineTo(x, ry + (major ? 12 : 6)); ctx.stroke();
    if (major) ctx.fillText(String(u / 100), x, ry + 25);
  }
  ctx.restore();
  if (e > .6) {
    ctx.save(); ctx.setLineDash([3, 4]); ctx.strokeStyle = 'rgba(255, 255, 255, .4)'; ctx.lineWidth = 1;
    for (let b = 1; b < n; b++) { const x = X0 + b * len * kx; ctx.beginPath(); ctx.moveTo(x, by + bh + 2); ctx.lineTo(x, ry); ctx.stroke(); }
    ctx.restore();
    // zoom on the end of the first piece
    const zy = ry + rh + 26, zh = 26, ZX0 = X0 + 6, ZX1 = X1 - 6, zk = (ZX1 - ZX0) / 30, a = len - 15, mx = X0 + len * kx;
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, .3)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(mx, ry + rh); ctx.lineTo(ZX0, zy); ctx.moveTo(mx, ry + rh); ctx.lineTo(ZX1, zy); ctx.stroke();
    ctx.strokeStyle = '#ffe38a'; ctx.lineWidth = 2; ctx.strokeRect(X0 + a * kx, ry - 2, 30 * kx, rh + 4);
    const zg = ctx.createLinearGradient(0, zy, 0, zy + zh); zg.addColorStop(0, '#f4e8bd'); zg.addColorStop(1, '#d9c88c');
    ctx.fillStyle = 'rgba(0, 0, 0, .3)'; rr(ctx, ZX0 - 6, zy + 3, ZX1 - ZX0 + 12, zh + 24, 5); ctx.fill();
    ctx.fillStyle = zg; rr(ctx, ZX0 - 6, zy, ZX1 - ZX0 + 12, zh + 22, 5); ctx.fill();
    ctx.strokeStyle = '#4a3f22'; ctx.fillStyle = '#4a3f22'; ctx.font = `800 12px ${FONT}`; ctx.textAlign = 'center';
    for (let u = a; u <= a + 30; u++) {
      const x = ZX0 + (u - a) * zk, big = u % 10 === 0, mid = u % 5 === 0; ctx.lineWidth = big ? 1.5 : 1; ctx.beginPath(); ctx.moveTo(x, zy); ctx.lineTo(x, zy + (big ? 13 : mid ? 9 : 6)); ctx.stroke();
      if (big) ctx.fillText(txt(u), x, zy + 27);
    }
    const zmx = ZX0 + 15 * zk; ctx.fillStyle = '#e2558d'; ctx.beginPath(); ctx.moveTo(zmx, zy + 2); ctx.lineTo(zmx - 6, zy - 8); ctx.lineTo(zmx + 6, zy - 8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#e2558d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(zmx, zy); ctx.lineTo(zmx, zy + 16); ctx.stroke();
    ctx.restore();
    pill(ctx, t.rb.zoom(m), w / 2, zy + zh + 31, 12, w, '#fff', 'rgba(10, 12, 20, .78)');
  }
}

// --- canvas loop --------------------------------------------------------------------------------------------------------
const R1 = (w, h) => ({ x: 0, y: 0, w, h, legend: true, potH: clamp(h * .26, 64, 92), head: 19, maxPW: 112, compact: false, tags: null });
const R2 = (w, inf) => ({ x: 0, y: 0, w, h: PIC_H, legend: false, potH: 58, head: 10, maxPW: 96, compact: !inf, tags: null });
canvasLoop($('cv'), (ctx, w, h, dt) => {
  const v = lab.view;
  if (v === 'coins') {
    const R = R1(w, h); R.tags = S.c.done && !busy(SC1) ? Array(SC1.k).fill(fmt(CPROB[S.c.pi].ans)) : null;
    const G = placeCoins(SC1, R); stepScene(SC1, dt); drawScene(ctx, SC1, R, G, w);
    const b = $('sdMain'); if (b) b.dataset.lock = busy(SC1) ? '1' : '0';
  } else if (v === 'column') {
    if (S.sec === 'sep') return;
    const R = R2(w, S.sec === 'inf'), G = placeCoins(SC2, R); stepScene(SC2, dt); drawScene(ctx, SC2, R, G, w);
    const b = $('sdMain'); if (b) b.dataset.lock = busy(SC2) ? '1' : '0';
  } else drawRibbon(ctx, w, h, dt);
});

resetCoins(0); resetCol(); render();
</script>
