function addFruit(k) {

  const n = S.items.length + S.flights.length;
  if (n >= SLOTS.length) { S.bump[k] = 1; sfx.bad(); return; }
  const slot = SLOTS[n];
  S.flights.push({ k, t0: now(), x0: k === 'a' ? 100 : 250, y0: 150, x1: BX + slot[0], y1: BY + slot[1] });
  if (k === 'a') S.na++; else S.nb++;
  S.bump[k] = 1; S.rb = 1; sfx.tick();

function checkSame() {

    const d = g.target - g.e; g.e += Math.sign(d) * Math.min(Math.abs(d), dt / 0.7);

  for (let i = S.flights.length - 1; i >= 0; i--) {

function drawBar(c, sp, bp, since, t) {
  const U = sp.blocks.reduce((s, b) => s + b.w, 0), X0 = 24, u = 292 / U, Y = 104, H = 44, n = sp.blocks.length;
  const solved = since >= 0, pop = solved ? eBack(since / .6) : 1;
  let x = X0;
  sp.blocks.forEach((b, i) => {
    const g = eOut(bp * (n + .6) - i), w = b.w * u;
    if (g > 0.01) {
      c.save(); c.beginPath(); c.rect(x, Y - 4, w * g, H + 8); c.clip();
      c.shadowColor = 'rgba(60, 30, 10, .3)'; c.shadowBlur = 6; c.shadowOffsetY = 3;
      const col = b.u ? '#8f7fd0' : '#f0a03c';
      c.fillStyle = lin(c, x, Y, x, Y + H, [[0, lite(col, .4)], [.5, col], [1, dark(col, .2)]]); rr(c, x, Y, w - 1, H, 8); c.fill(); c.shadowColor = 'transparent';
      c.strokeStyle = dark(col, .4); c.lineWidth = 1.6; c.stroke();
      if (b.cut) {
        const cw = b.cut * u; c.save(); rr(c, x, Y, w - 1, H, 8); c.clip();
        c.fillStyle = 'rgba(255, 246, 223, .8)'; c.fillRect(x + w - cw, Y, cw, H);
        c.strokeStyle = 'rgba(143, 127, 208, .6)'; c.lineWidth = 3; for (let d = -H; d < cw; d += 10) { c.beginPath(); c.moveTo(x + w - cw + d, Y + H); c.lineTo(x + w - cw + d + H, Y); c.stroke(); }
        c.restore(); c.strokeStyle = '#46397f'; c.setLineDash([4, 3]); c.strokeRect(x + w - cw, Y, cw - 1, H); c.setLineDash([]);
        tx(c, '−3', x + w - cw / 2, Y + H / 2 + 1, `900 18px ${SANS}`, '#46397f');
      }
      c.restore();
      if (g > .95) {
        const lw = b.cut ? w - b.cut * u : w, cx = x + lw / 2;
        if (b.u) {
          c.save(); c.translate(cx, Y + H / 2 + 1); c.scale(pop, pop);
          if (solved) tx(c, String(sp.val), 0, 0, `900 24px ${SANS}`, '#fff'); else tx(c, sp.L, 0, 0, `italic 700 28px ${SERIF}`, '#fff');
          c.restore();

      }

  });

}

canvasLoop($('cv'), (c, w, h, dt, t) => {
  const v = lab.view;
  hits = [];
  c.save(); rr(c, 0, 0, w, h, 20); c.clip();
  if (v === 'story') drawStory(c, w, h, t);
  else {

    VT.k = k; VT.ox = ox; VT.oy = oy; VB.l = -ox / k; VB.r = (w - ox) / k; VB.top = -oy / k; VB.bot = (h - oy) / k;
    c.translate(ox, oy); c.scale(k, k);

    else sceneSame(c, t);

// --- one render per change: controls, readout and the state card ----------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v !== 'tags') S.sec = null;
  const open = secret.unlocked(), sec = S.sec;
  $('secTags').style.display = v === 'tags' && !sec ? '' : 'none';
  $('secThink').style.display = v === 'tags' && sec === 'think' ? '' : 'none';
  $('secTwin').style.display = v === 'tags' && sec === 'twin' ? '' : 'none';
  $('secStory').style.display = v === 'story' ? '' : 'none';
  $('secSame').style.display = v === 'same' ? '' : 'none';
  $('secChips').style.display = v === 'tags' ? '' : 'none';
  const sc = (k, emo) => `<button class="chip secret lt-c ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('think', '🧠') + sc('twin', '👯');
  askEl.style.display = v === 'tags' && !sec && S.askOpen ? '' : 'none';
  storyEl.style.display = '';
  lab.setFacts(t.facts[v]);
  if (v === 'tags') { if (sec === 'think') renderThink(t); else if (sec === 'twin') renderTwin(t); else renderTags(t); }
  else if (v === 'story') renderStory(t); else renderSame(t);
}
function renderTags(t) {
  const g = t.tg, { na, nb } = S, ex = simp(na, nb), full = S.items.length + S.flights.length >= SLOTS.length;
  lab.setGlow('rgba(226, 73, 63, .24)');
  $('bA').textContent = g.apple; $('bB').textContent = g.pear; $('bClr').textContent = g.clear;
  $('bA').disabled = $('bB').disabled = S.askOpen || full; $('bClr').disabled = S.askOpen || (na + nb === 0);
  $('bFlip').hidden = !S.asked || S.askOpen; $('bFlip').textContent = S.flipped ? g.back : g.flip;
  if (S.askOpen) {
    const q = g.ask, a = S.answer;
    askEl.innerHTML = a === null
      ? `<div class="q">${esc(q.q)}</div><div class="opts">${q.opts.map((o, j) => `<button data-a="${j}">${esc(o)}</button>`).join('')}</div>`
      : `<div class="q">${esc(q.q)}</div><div class="opts">${q.opts.map((o, j) => `<button class="${j === 1 ? 'ok' : j === a ? 'no' : 'dim'}" disabled>${esc(o)}</button>`).join('')}</div>
         <div class="verdict" style="color:${a === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(a === 1 ? t.right : q.no)}</div><p>${esc(q.why[a])}</p><button class="btn" data-go="1">${esc(q.go)}</button>`;
    lab.setReadout(esc(ex), g.sub, '', '#e2493f');
    lab.setState({ emo: '🤔', title: q.q, lead: a === null ? '' : q.why[a], body: '', extra: '' });
    return;
  }

    lab.setState({ emo: '🏷️', title: na + nb === 0 ? g.t0 : `${ex} = ${na + nb === 1 ? t.money(total) : `${cs} = ${t.money(total)}`}`, lead: g.lf(t.money(PA), t.money(PB)), body: '', extra: miss });
  } else {
    lab.setReadout(esc(ex), g.sub, '', '#e2493f');

function renderStory(t) {
  const y = t.sy, sp = STORIES[ST.i], dots = [0, 1, 2, 3, 4].map((i) => (i < ST.i ? '●' : i === ST.i ? '◉' : '○')).join(' ');

  $('ltText').textContent = y.texts[ST.i];
  $('ltEqs').innerHTML = sp.eq.map((e, j) => {

    return `<button class="lt-eq ${cls}" data-j="${j}"${ST.pick !== null ? ' disabled' : ''}>${esc(fmt(e))}</button>`;
  }).join('');
  $('stB').textContent = ST.i >= 4 ? y.again : y.next; $('stB').disabled = !ST.solved;
  if (ST.pick === null) {

  } else {
    lab.setReadout(`${sp.L} = ${sp.val}`, dots, ST.pick === sp.ok ? '✓' : '', '#8f7fd0');

function renderSame(t) {
  const m = t.sm, P = PUZ[Math.min(SM.i, 2)], dots = [0, 1, 2].map((i) => (i < SM.i ? '●' : i === SM.i ? '◉' : '○')).join(' ');

  const expr = P.syms.map((_, i) => String(SM.v[i])).join(' + ');
  lab.setReadout(ok ? `${expr} = ${P.T}` : expr, ok ? dots : `${m.must(P.T)}  ${dots}`, ok ? '✓' : '', '#4f8fd9');
  if (ok) lab.setState({ emo: '✅', title: SM.status === 'ok' ? t.right : m.shown, lead: SM.status === 'ok' ? m.okLead[SM.i] : '', body: '', extra: '' });

  lab.setGlow('rgba(143, 127, 208, .3)');

  lab.setReadout(String(vals[st]), m.steps[st], st === 4 ? '= n' : '', '#8f7fd0');
  if (st === 0) lab.setState({ emo: '🧠', title: m.steps[0], lead: m.pick, body: '', extra: '' });
  else if (st < 4) lab.setState({ emo: '🧠', title: m.steps[st], lead: fmt(['n', 'n + 3', '2(n + 3)', '2(n + 3) − 6'][st]), body: '', extra: '' });

function renderTwin(t) {
