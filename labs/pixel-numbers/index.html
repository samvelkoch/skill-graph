    c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(x - r * .38, by - r * .5, r * .26, r * .14, -.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#1b1420'; c.font = `900 ${r > 22 ? 18 : 16}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(code), x, by + 2);
    // letter tile: hidden until the answer is given
    const ty = by + r + 12, ts = 36, p = L.ans === null ? 0 : ease(clamp01((TM - L.t0 - i * .25) / .5));
    c.save(); c.translate(x, ty + ts / 2);
    if (p < .5) { c.scale(1, Math.max(.02, 1 - p * 2)); c.strokeStyle = 'rgba(160,172,210,.55)'; c.setLineDash([4, 4]); c.lineWidth = 1.5; rr(c, -ts / 2, -ts / 2, ts, ts, 9); c.stroke(); c.setLineDash([]);
      c.fillStyle = '#8fa0d0'; c.font = `900 20px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 0, 1); }
    else { c.scale(1, Math.max(.02, (p - .5) * 2)); c.fillStyle = lg(c, 0, -ts / 2, 0, ts / 2, [[0, '#ffffff'], [1, '#d8dff2']]); rr(c, -ts / 2, -ts / 2, ts, ts, 9); c.fill();
      c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 1.5; c.stroke(); c.fillStyle = '#10131f'; c.font = `900 22px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(word[i], 0, 2); }
    c.restore();
  });
  // the wave
  const pad = 10, wy = by + r + 12 + 36 + 22, wh = Math.min(250, h - wy - 10), wx = pad, ww = w - 2 * pad;
  if (wh < 70) { GL = null; return; }
  GL = { x: wx, y: wy, w: ww, h: wh, y0: wy + 34, y1: wy + wh - 14, sx: (i) => wx + 14 + i * (ww - 28) / 39 };
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 14; c.shadowOffsetY = 6; c.fillStyle = lg(c, wx, wy, wx, wy + wh, [[0, '#0e1220'], [1, '#080a12']]); rr(c, wx, wy, ww, wh, 16); c.fill(); c.restore();
  c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1; rr(c, wx, wy, ww, wh, 16); c.stroke();
  const ym = (GL.y0 + GL.y1) / 2, yv = (v) => GL.y1 - v / 255 * (GL.y1 - GL.y0);
  c.strokeStyle = 'rgba(130,145,190,.25)'; c.setLineDash([4, 5]); c.beginPath(); c.moveTo(wx + 8, ym); c.lineTo(wx + ww - 8, ym); c.stroke(); c.setLineDash([]);
  c.strokeStyle = 'rgba(77,227,193,.35)'; c.lineWidth = 1.5;
  S.wave.forEach((v, i) => { c.beginPath(); c.moveTo(GL.sx(i), ym); c.lineTo(GL.sx(i), yv(v)); c.stroke(); });
  c.save(); c.strokeStyle = '#4de3c1'; c.lineWidth = 2.5; c.lineJoin = 'round'; c.shadowColor = 'rgba(77,227,193,.6)'; c.shadowBlur = 8; c.beginPath();
  S.wave.forEach((v, i) => { const x = GL.sx(i), y = yv(v); if (i === 0) c.moveTo(x, y); else { const px = GL.sx(i - 1), py = yv(S.wave[i - 1]); c.quadraticCurveTo(px, py, (px + x) / 2, (py + y) / 2); } });
  c.stroke(); c.restore();
  S.wave.forEach((v, i) => { const on = i === S.wsel; c.fillStyle = on ? '#fff' : '#4de3c1'; c.beginPath(); c.arc(GL.sx(i), yv(v), on ? 5.5 : 3, 0, Math.PI * 2); c.fill(); });
  c._W = w; pill(c, t.waveLbl, wx + 8, wy + 8);
  if (S.wsel >= 0) pill(c, t.waveTip(S.wsel + 1, S.wave[S.wsel]), clamp(GL.sx(S.wsel) - 30, wx + 6, wx + ww - 90), clamp(yv(S.wave[S.wsel]) - 30, wy + 30, wy + wh - 24), { fg: '#fff', bg: 'rgba(40,60,70,.92)' });
}
function shadeHex(hex, k) { const n = parseInt(hex.slice(1), 16); return `rgb(${Math.round((n >> 16) * k)},${Math.round(((n >> 8) & 255) * k)},${Math.round((n & 255) * k)})`; }

// --- frame loop ----------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  TM = time; DT = dt; c._W = w;
  if (lab.view === 'grey') sceneGrey(c, w, h);
  else if (lab.view === 'colour') sceneColour(c, w, h);
  else sceneLetters(c, w, h);
});

// --- input ---------------------------------------------------------------------------------------------------
const cv = $('cv');
const ptr = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
function hitCell(x, y) {
  if (!G) return -1;
  if (!greyNow().cover) { const a = (x - G.P.gx) / G.P.cs, b = (y - G.P.gy) / G.P.cs; if (a >= 0 && a < 10 && b >= 0 && b < 10) return Math.floor(b) * 10 + Math.floor(a); }
  const a = (x - G.N.x) / G.N.cw, b = (y - G.N.y) / G.N.ch;
  return a >= 0 && a < 10 && b >= 0 && b < 10 ? Math.floor(b) * 10 + Math.floor(a) : -1;
}
function setWave(x, y) {
  if (!GL) return;
  const i = clamp(Math.round((x - GL.sx(0)) / (GL.sx(1) - GL.sx(0))), 0, 39), v = Math.round(clamp(255 * (GL.y1 - y) / (GL.y1 - GL.y0), 0, 255));
  const from = S.wlast < 0 ? i : S.wlast, a = Math.min(from, i), b = Math.max(from, i);
  for (let k = a; k <= b; k++) S.wave[k] = Math.round(from === i ? v : lerp(S.wave[from], v, (k - from) / (i - from || 1)));
  S.wave[i] = v; S.wsel = i; S.wlast = i;
}
cv.addEventListener('pointerdown', (ev) => {
  const p = ptr(ev);
  if (lab.view === 'grey') { const i = hitCell(p.x, p.y); if (i >= 0) { S.sel = i; S.hov = -1; S.dragSel = true; sfx.tick(); try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ } render(); } }
  else if (lab.view === 'letters' && GL && p.x >= GL.x && p.x <= GL.x + GL.w && p.y >= GL.y && p.y <= GL.y + GL.h) { S.wdrag = true; S.wlast = -1; setWave(p.x, p.y); try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ } sfx.tick(); }
});
cv.addEventListener('pointermove', (ev) => {
  const p = ptr(ev);
  if (lab.view === 'grey') { const i = hitCell(p.x, p.y); if (S.dragSel) { if (i >= 0 && i !== S.sel) { S.sel = i; render(); } } else S.hov = i; }
  else if (S.wdrag) setWave(p.x, p.y);
});
const endPtr = () => { S.dragSel = false; S.wdrag = false; S.wlast = -1; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', () => { S.hov = -1; });

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function logTrial(v) { if (S.trials[0] === v) return; S.trials.unshift(v); S.trials = S.trials.slice(0, 5); S.tries++; }
function setVal(v, log) {
  v = clamp(Math.round(v), 0, 255);
  if (v !== S.cat[S.sel]) { S.cat[S.sel] = v; S.pulse = { i: S.sel, t: TM }; }
  if (log) logTrial(v);
  sfx.tick(); render();
}
$('pxSl').addEventListener('input', (ev) => { const v = +ev.target.value; if (v !== S.cat[S.sel]) { S.cat[S.sel] = v; S.pulse = { i: S.sel, t: TM }; } render(); });
$('pxSl').addEventListener('change', () => { logTrial(S.cat[S.sel]); render(); });
[0, 1, 2].forEach((i) => $('pxC' + i).addEventListener('input', (ev) => { if (predictingC()) return; S.c[i] = +ev.target.value; render(); }));

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.d) return setVal(S.cat[S.sel] + +b.dataset.d, true);
  const a = b.dataset.act; if (!a) return;
  if (a === 'reset') { S.cat = CAT0.slice(); sfx.click(); return render(); }
  if (a === 'rule') { S.ruleOpen = !S.ruleOpen; sfx.click(); return render(); }
  if (a === 'pick') { S[b.dataset.w === 'z' ? 'pz' : 'pf'] = +b.dataset.k; sfx.click(); return render(); }
  if (a === 'check') {
    if (S.pz === null || S.pf === null || S.predDone) return;
    S.predDone = true; S.predOk = S.pz === 0 && S.pf === 1; if (S.predOk) { S.ruleOpen = true; sfx.good(); } else sfx.bad();
    return render();
  }
  if (a === 'myst') { newMyst(S.mi % 3); S.ruleOpen = false; sfx.click(); showStage(); return render(); }
  if (a === 'my') { const m = S.myst; if (m.ans !== null) return; m.ans = +b.dataset.j; m.t0 = TM; (m.order[m.ans] === m.k ? sfx.good : sfx.bad)(); showStage(); return render(); }
  if (a === 'nextpic') { S.mi++; newMyst(S.mi % 3); sfx.click(); return render(); }
  if (a === 'back') { S.myst = null; sfx.click(); return render(); }
  if (a === 'sec') { const k = b.dataset.k; if (!secret.unlocked()) return secret.open(); startSec(S.sec === k ? null : k); return; }
  if (a === 'secplay') { S.secT0 = TM; sfx.click(); return render(); }
  if (a === 'co') { const q = S.ct; if (q.ans !== null) return; q.ans = +b.dataset.j; q.t0 = TM; S.free = false; (q.order[q.ans] === 0 ? sfx.good : sfx.bad)(); showStage(); return render(); }
  if (a === 'nextpuz') { newPuzzle(S.ct.i + 1); sfx.click(); return render(); }
  if (a === 'again') { newPuzzle(0); sfx.click(); return render(); }
  if (a === 'lo') { const q = S.L; if (q.ans !== null) return; q.ans = +b.dataset.j; q.t0 = TM; (q.order[q.ans] === WORD_OPTS.indexOf(WORDS[q.wi]) ? sfx.good : sfx.bad)(); showStage(); return render(); }
  if (a === 'nextword') { newWord((S.L.wi + 1) % 3); sfx.click(); return render(); }
  if (a === 'table') { S.table = !S.table; sfx.click(); return render(); }
  if (a === 'wreset') { S.wave = WAVE0.slice(); S.wsel = -1; sfx.click(); return render(); }
});
ruleEl.addEventListener('click', () => { S.ruleOpen = false; sfx.click(); render(); });
function startSec(k) {
  S.sec = k; S.ruleOpen = false; S.myst = null; S.secT0 = TM; sfx.click();
  if (k && lab.view !== 'grey') { lab.view = 'grey'; lab.renderChrome(); }
  render();
}
function changeView() { S.sec = null; S.ruleOpen = false; S.hov = -1; S.dragSel = false; S.wdrag = false; render(); }

// --- html side ------------------------------------------------------------------------------------------------
const optBtns = (names, act, q) => `<div class="px-opts">${names.map((n, j) => {
  const cls = q.ans === null ? '' : j === q.right ? 'good' : j === q.ans ? 'bad' : '';
  return `<button class="px-opt ${cls}" data-act="${act}" data-j="${j}" ${q.ans === null ? '' : 'disabled'}>${esc(n)}</button>`;
}).join('')}</div>`;
const verdictPill = (ok, t) => (ok ? t.right : t.notq);
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, m = S.myst;
  document.body.dataset.v = v;
  $('pxGrey').hidden = v !== 'grey' || !!sec; $('pxColour').hidden = v !== 'colour'; $('pxLetters').hidden = v !== 'letters'; $('pxSecP').hidden = !sec;
  $('pxEdit').hidden = !!m; $('pxMy').hidden = !m;
  let col = '#4ea8ff', readVal = '', readSub = '', pill_ = '', q = '';
  // --- grey ---
  if (v === 'grey' && !sec) {
    const val = S.cat[S.sel], r = Math.floor(S.sel / 10) + 1, c = S.sel % 10 + 1, predicting = S.tries >= 3 && !S.predDone;
    $('pxNum').innerHTML = `<i style="background:${grey(val)}"></i>${val}`; if (+$('pxSl').value !== val) $('pxSl').value = val;
    $('pxTrials').innerHTML = S.trials.length ? `<div class="px-lbl">${esc(t.trials)}</div><div class="px-trials">${S.trials.map((n) => `<span class="px-tr"><i style="background:${grey(n)}"></i>${n}</span>`).join('')}</div>` : '';
    $('pxPred').innerHTML = predicting ? `${[['z', '0 →', S.pz], ['f', '255 →', S.pf]].map(([w, lbl, cur]) => `<div class="px-pk"><span>${lbl}</span>${t.picks.map((n, k) =>
      `<button class="px-p ${cur === k ? 'on' : ''}" data-act="pick" data-w="${w}" data-k="${k}"><i style="background:${PICK_COL[k]}"></i>${esc(n)}</button>`).join('')}</div>`).join('')}
      <button class="btn" style="margin-top:8px" data-act="check" ${S.pz === null || S.pf === null ? 'disabled' : ''}>${esc(t.check)}</button>`
      : S.predDone ? `<div class="px-sw"><div><i style="background:#000"></i>0 = ${esc(t.picks[0])}</div><div><i style="background:#fff"></i>255 = ${esc(t.picks[1])}</div></div>` : '';
    $('pxEditRow').innerHTML = `<button class="px-chip" data-act="reset">↺ ${esc(t.reset)}</button>
      ${S.tries >= 4 || S.predDone ? `<button class="px-chip ${S.ruleOpen ? 'on' : ''}" data-act="rule">${esc(t.showRule)}</button>` : ''}
      ${S.predDone ? `<button class="px-chip go" data-act="myst">🔍 ${esc(t.mystBtn)}</button>` : ''}`;
    q = m ? t.qMyst : predicting ? t.qGrey : t.tapHint;
    if (m) {
      const rev = m.ans !== null, right = rev && m.order[m.ans] === m.k;
      $('pxMy').innerHTML = optBtns(m.order.map((k) => t.mystOpts[k]), 'my', { ans: m.ans, right: m.order.indexOf(m.k) })
        + (rev ? `<div class="px-row"><button class="px-chip go" data-act="nextpic">${esc(t.nextPic)}</button><button class="px-chip" data-act="back">${esc(t.backCat)}</button></div>` : '');
      readVal = rev ? esc(t.mystOpts[m.k]) : '?'; readSub = rev ? '' : t.mystSub; pill_ = rev ? verdictPill(right, t) : ''; col = rev ? (right ? '#2fbf84' : '#e59a1f') : '#4ea8ff';
    } else { readVal = String(val); readSub = t.rowcol(r, c); pill_ = S.tries ? t.tried(S.tries) : ''; if (S.predDone) col = S.predOk ? '#2fbf84' : '#e59a1f'; if (S.predDone && S.predOk) pill_ = t.right; }
    lab.setState({ emo: m ? '🔢' : '🐱', title: t.views.grey, lead: t.state[m ? 'myst' : 'grey'][0], body: t.state[m ? 'myst' : 'grey'][1] });
  }
  // --- secret panel ---
  if (sec) {
    const a = sec === 'a', capN = CAT0.filter((x) => x + 100 > 255).length;
    $('pxSecP').innerHTML = `<div class="px-big">${a ? 'n + 100' : '255 − n'}</div><p class="px-note" style="margin:0 0 8px">${esc(a ? t.capNote(capN) : t.negNote)}</p>
      <button class="px-chip" data-act="secplay">↺ ${esc(t.secPlay)}</button>`;
    readVal = a ? 'n + 100' : '255 − n'; readSub = ''; col = '#f5c84c';
    lab.setState({ emo: a ? '🔆' : '🎞️', title: t.secrets[sec][0], lead: t.secrets[sec][1], body: a ? t.capNote(capN) : t.negNote });
  }
  // --- colour ---
  if (v === 'colour') {
    const cq = S.ct, pr = predictingC(), rev = cq.ans !== null, right = rev && cq.order[cq.ans] === 0;
    q = pr || rev ? t.qC[cq.i] : t.freeHint;
    $('pxCOpts').innerHTML = optBtns(cq.order.map((k) => t.oC[cq.i][k]), 'co', { ans: cq.ans, right: cq.order.indexOf(0) });
    [0, 1, 2].forEach((i) => { const s = $('pxC' + i); if (+s.value !== S.c[i]) s.value = S.c[i]; s.disabled = pr; $('pxCo' + i).textContent = S.c[i]; });
    $('pxCRow').innerHTML = (rev ? (cq.i < 2 ? `<button class="px-chip go" data-act="nextpuz">${esc(t.nextPuz)}</button>` : `<button class="px-chip go" data-act="again">${esc(t.again)}</button>`) : '')
      + `<span class="px-lbl" style="margin:0 0 0 4px">${esc(t.puzzle(cq.i + 1))}</span>`;
    readVal = `<span style="color:#ff6b6b">${S.c[0]}</span> · <span style="color:#4fdc7d">${S.c[1]}</span> · <span style="color:#6f9bff">${S.c[2]}</span>`;
    readSub = rev && CT[cq.i].every((x, k) => x === S.c[k]) ? '= ' + t.oC[cq.i][0] : ''; pill_ = rev ? verdictPill(right, t) : ''; col = rev ? (right ? '#2fbf84' : '#e59a1f') : '#4ea8ff';
    lab.setState({ emo: '🎨', title: t.views.colour, lead: t.state.colour[0], body: t.state.colour[1] });
  }
  // --- letters ---
  if (v === 'letters') {
    const lq = S.L, word = WORDS[lq.wi], rev = lq.ans !== null, rightIdx = WORD_OPTS.indexOf(word), right = rev && lq.order[lq.ans] === rightIdx;
    q = t.qL;
    $('pxLOpts').innerHTML = optBtns(lq.order.map((k) => WORD_OPTS[k]), 'lo', { ans: lq.ans, right: lq.order.indexOf(rightIdx) });
    $('pxLRow').innerHTML = `<button class="px-chip ${S.table ? 'on' : ''}" data-act="table">▦ ${esc(t.tableBtn)}</button>${rev ? `<button class="px-chip go" data-act="nextword">${esc(t.nextWord)}</button>` : ''}<button class="px-chip" data-act="wreset">↺ ${esc(t.resetWave)}</button>`;
    $('pxWN').textContent = t.waveNote;
    readVal = word.split('').map((ch) => ch.charCodeAt(0)).join(' '); readSub = ''; pill_ = rev ? verdictPill(right, t) : ''; col = rev ? (right ? '#2fbf84' : '#e59a1f') : '#4ea8ff';
    lab.setState({ emo: '🔤', title: t.views.letters, lead: t.state.letters[0], body: [t.state.letters[1], t.letterNote].filter(Boolean).join(' ') });
  }
  $('pxQ').textContent = sec ? '' : q;
  tabEl.style.display = v === 'letters' && S.table ? '' : 'none';
  const showRule = S.ruleOpen && v === 'grey' && !sec && !m;
  ruleEl.style.display = showRule ? '' : 'none';
  if (showRule) ruleEl.innerHTML = `<button class="px-x" type="button" aria-label="×">×</button><h3>${esc(t.ruleTitle)}</h3><p>${esc(t.rule)}</p>
    <div class="px-ramp">${[0, 64, 128, 192, 255].map((n) => `<i style="background:${grey(n)};color:${n > 120 ? '#10131f' : '#fff'}">${n}</i>`).join('')}</div>`;
  const open = secret.unlocked();
  $('pxSecRow').innerHTML = [['a', '🔆'], ['b', '🎞️']].map(([k, emo]) =>
    `<button class="px-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setReadout(readVal, readSub, pill_, col);
  lab.setFacts(t.facts[v]);
}
render();
