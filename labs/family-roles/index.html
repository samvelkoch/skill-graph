  }
  // labels
  pill(c, `${t.who[1]} ${Math.floor(aP)}`, 52, FY + 14); pill(c, `${t.who[2]} ${Math.floor(aD)}`, 96, FY + 14);
  pill(c, `${t.y.names[0]} ${Math.floor(aM)}`, 178, FY + 14); if (nr) pill(c, `${t.y.names[1]} ${Math.max(0, Math.floor(aN))}`, 246, FY + 14);
  if (S.yg !== null) { const ph = PHASE(Math.floor(yd + 0.001)); c.fillStyle = '#ffffff'; c.beginPath(); c.arc(178, mr.top - 18, 12, 0, 7); c.fill(); emo(c, Y_ICON[ph][1], 178, mr.top - 18, 15); }
  // timeline panel
  c.fillStyle = 'rgba(20,24,40,.84)'; rr(c, 8, 304, 344, 88, 16); c.fill(); c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1; c.stroke();
  const X0 = 28, X1 = 332, ky = 352, kx = X0 + (X1 - X0) * yd / 40;
  c.strokeStyle = 'rgba(198,205,224,.4)'; c.lineWidth = 4; c.beginPath(); c.moveTo(X0, ky); c.lineTo(X1, ky); c.stroke();
  c.strokeStyle = '#ff6f8e'; c.beginPath(); c.moveTo(X0, ky); c.lineTo(kx, ky); c.stroke();
  c.fillStyle = '#c6cde0'; c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let y = 0; y <= 40; y += 10) { const x = X0 + (X1 - X0) * y / 40; c.fillRect(x - 1, ky + 6, 2, 6); c.fillText(String(y), x, ky + 26); }
  if (S.yg !== null) Y_ICON.forEach(([y, e]) => emo(c, e, X0 + (X1 - X0) * y / 40 + (y === 0 ? 6 : 0), ky - 24, 15));
  c.fillStyle = '#ffffff'; c.beginPath(); c.arc(kx, ky, 9, 0, 7); c.fill(); c.strokeStyle = '#ff6f8e'; c.lineWidth = 3; c.stroke();
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const s = Math.min(w / W, h / H);
  G.s = s; G.ox = (w - W * s) / 2; G.oy = (h - H * s) / 2;
  c.save(); rr(c, 0, 0, w, h, 18); c.clip();
  c.fillStyle = lgr(c, 0, 0, 0, h, [[0, '#76b4e6'], [0.62, '#cde4f4'], [1, '#e6efe0']]); c.fillRect(0, 0, w, h);
  c.translate(G.ox, G.oy); c.scale(s, s);
  const v = lab.view;
  if (v === 'jobs') { stepJobs(dt); sunAndClouds(c, time); drawJobs(c, time); }
  else if (v === 'kinds') drawKinds(c, time);
  else {
    const diff = S.y - S.yd; S.yd = Math.abs(diff) < 0.01 ? S.y : S.yd + diff * (1 - Math.exp(-dt * 7));
    if (S.playing) { S.acc += dt; if (S.acc > 0.38) { S.acc = 0; if (S.y < 40) { S.y++; yearChanged(); } else { S.playing = false; render(); } } }
    drawYears(c, time);
  }
  c.restore();
});

// --- input ------------------------------------------------------------------------------------------------------
const cv = $('cv');
const toD = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - G.ox) / G.s, (ev.clientY - r.top - G.oy) / G.s]; };
const jobsAfter = () => {
  const all = givenN() === 6;
  if (all && !S.jAll && S.jg !== null) (S.jg === 1 ? sfx.good : sfx.bad)();
  S.jAll = all; render();
};
const assign = (job, p) => { S.given[job] = p; S.sel = -1; sfx.snap(); jobsAfter(); };
const unassign = (job) => { S.given[job] = -1; S.sel = -1; sfx.tick(); S.jAll = false; render(); };
cv.addEventListener('pointerdown', (ev) => {
  const [x, y] = toD(ev), v = lab.view;
  if (v === 'kinds') {
    if (S.kg === null) return;
    const i = [...Array(6).keys()].find((k) => { const [cx, cy] = cellXY(k); return x >= cx - 4 && x <= cx + 112 && y >= cy - 4 && y <= cy + 188; });
    if (i !== undefined) { S.house = i; S.last = null; sfx.click(); render(); }
    return;
  }
  if (v !== 'jobs') return;
  if (S.sec === 'inst') { const i = roomAt(x, y); if (i >= 0 && i < 5) { S.look[i] = (S.look[i] + 1) % 5; sfx.click(); } return; }
  if (S.sec === 'day') {
    if (x >= 240 && x <= 352 && y >= 56 && y <= 170) { for (let k = 0; k < 12; k++) S.hearts.push({ x: 296 + (Math.random() - 0.5) * 60, y: 140, vx: (Math.random() - 0.5) * 30, vy: -30 - Math.random() * 40, life: 1 }); sfx.good(); }
    return;
  }
  if (S.jg === null) return;
  let best = -1, bd = 1e9;
  for (let i = 0; i < 6; i++) { const d = Math.hypot(x - TK[i].x, y - TK[i].y); if (d < Math.max(TK[i].r + 6, 19) && d < bd) { best = i; bd = d; } }
  if (best >= 0) { S.drag = { job: best, sx: x, sy: y, at: [x, y], moved: false, id: ev.pointerId }; try { cv.setPointerCapture(ev.pointerId); } catch { /* ignore */ } ev.preventDefault(); return; }
  if (S.sel >= 0) { const ri = roomAt(x, y); if (ri >= 0) assign(S.sel, ri); else if (y > 296) unassign(S.sel); }
});
cv.addEventListener('pointermove', (ev) => {
  if (!S.drag) return;
  const [x, y] = toD(ev); S.drag.at = [x, y];
  if (!S.drag.moved && Math.hypot(x - S.drag.sx, y - S.drag.sy) > 6) S.drag.moved = true;
});
const dragEnd = (ev) => {
  const d = S.drag; if (!d) return;
  S.drag = null;
  if (ev.type === 'pointercancel') { render(); return; }
  const [x, y] = toD(ev);
  if (d.moved) { const ri = roomAt(x, y); if (ri >= 0) assign(d.job, ri); else if (y > 296 && S.given[d.job] >= 0) unassign(d.job); else render(); }
  else if (S.sel === d.job) { S.sel = -1; sfx.tick(); render(); }
  else { S.sel = d.job; sfx.tick(); render(); }
};
cv.addEventListener('pointerup', dragEnd); cv.addEventListener('pointercancel', dragEnd);

function yearChanged() {
  if (S.y >= 40 && !S.yAll) { S.yAll = true; (S.yg === 2 ? sfx.good : sfx.bad)(); }
  render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.g !== undefined) { S[b.closest('[data-pred]').dataset.pred + 'g'] = +b.dataset.g; sfx.click(); render(); return; }
  const a = b.dataset.act;
  if (a === 'share') { S.given = PRESETS[S.pi % PRESETS.length].slice(); S.pi++; S.sel = -1; sfx.snap(); jobsAfter(); }
  else if (a === 'reset') { S.given = [-1, -1, -1, -1, -1, -1]; S.sel = -1; S.jAll = false; sfx.click(); render(); }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); render(); }
  else if (a === 'chip') {
    if (S.house < 0) return;
    const ch = +b.dataset.c; S.checked[`${S.house}:${ch}`] = chipResult(S.house, ch); S.last = { h: S.house, ch }; sfx.tick();
    if (!S.kAll && jobChecks() >= 8) { S.kAll = true; (S.kg === 0 ? sfx.good : sfx.bad)(); }
    render();
  }
  else if (a === 'play') { S.playing = !S.playing; if (S.playing && S.y >= 40) { S.y = 0; S.yd = 0; } S.acc = 0; sfx.click(); render(); }
  else if (a === 'end') { S.playing = false; S.y = 40; yearChanged(); }
});
$('ySl').addEventListener('input', (ev) => { S.playing = false; S.y = clamp(+ev.target.value, 0, 40); sfx.tick(); yearChanged(); });

// --- render: controls, readout and the state card for the current view --------------------------------------------
const predHtml = (q, opts) => `<div class="fr-q">${esc(q)}</div><div class="fr-opts">${opts.map((o, i) => `<button type="button" data-g="${i}">${esc(o)}</button>`).join('')}</div>`;
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secJobs').hidden = v !== 'jobs'; $('secKinds').hidden = v !== 'kinds'; $('secYears').hidden = v !== 'years';
  if (v === 'jobs') renderJobs(t); else if (v === 'kinds') renderKinds(t); else renderYears(t);
}
function renderJobs(t) {
  const J = t.j, n = givenN(), rev = jobsRevealed(), open = secret.unlocked();
  lab.setGlow('rgba(224, 164, 88, .26)');
  $('jPred').innerHTML = S.jg === null ? predHtml(J.q, J.opts) : '';
  $('jPlay').hidden = S.jg === null || !!S.sec;
  const ld = loads();
  $('jBars').innerHTML = FAM.map((_, i) => `<div class="fr-brow"><span>${esc(t.who[i])}</span><div class="fr-track">${S.given.map((g, j) => (g === i ? `<i style="background:${JOB_COL[j]}">${JOB_EMO[j]}</i>` : '')).join('')}</div><span>${ld[i]}</span></div>`).join('');
  $('jLegend').textContent = J.legend; $('jShare').textContent = J.share; $('jReset').textContent = J.reset;
  const sc = (k, e) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('jSec').innerHTML = sc('inst', '🏛️') + sc('day', '📅');
  lab.setFacts(t.facts.jobs);
  if (S.sec) {
    const s = t[S.sec];
    lab.setReadout(S.sec === 'inst' ? '🏛️' : '15', S.sec === 'inst' ? t.secrets.inst[0] : t.day.month, '', '#e0a458');
    lab.setState({ emo: S.sec === 'inst' ? '🏛️' : '📅', title: s.title, lead: s.lead, body: s.body, extra: `<div class="fr-fine">${esc(s.src)}</div>` });
    return;
  }
  lab.setReadout(`${n}/6`, J.readSub, rev ? J.pill : '', '#e0a458');
  if (S.jg === null) lab.setState({ emo: '🤔', title: t.ask, lead: J.askLead, body: '', extra: '' });
  else if (!rev) lab.setState({ emo: '🧺', title: J.go(n), lead: J.goLead, body: '', extra: '' });
  else {
    const bi = ld.findIndex((k) => k >= 4), ei = ld.findIndex((k) => k === 0);
    const note = bi >= 0 ? J.busy(t.who[bi]) : ei >= 0 ? J.eager(t.who[ei]) : J.calm;
    lab.setState({ emo: S.jg === 1 ? '✅' : '🤔', title: S.jg === 1 ? t.right : t.wrong, lead: J.reveal, body: note, extra: '' });
  }
}
function renderKinds(t) {
  const K = t.k, n = jobChecks(), ci = S.house;
  lab.setGlow('rgba(143, 203, 133, .26)');
  $('kPred').innerHTML = S.kg === null ? predHtml(K.q, K.opts) : '';
  $('kPlay').hidden = S.kg === null;
  $('kNote').textContent = K.pick; $('kLbl1').textContent = K.lbl1; $('kLbl2').textContent = K.lbl2;
  const chip = (ch, label) => { const st = ci >= 0 ? S.checked[`${ci}:${ch}`] : undefined; return `<button class="chip fr-c ${st === undefined ? '' : st ? 'yes' : 'no'}" data-act="chip" data-c="${ch}"${ci < 0 ? ' disabled' : ''}>${K_EMO[ch]} ${esc(label)}${st === undefined ? '' : st ? ' ✓' : ' ✗'}</button>`; };
  $('kJobs').innerHTML = K.jobs.map((l, i) => chip(i, l)).join(''); $('kFeat').innerHTML = K.feats.map((l, i) => chip(4 + i, l)).join('');
  lab.setFacts(t.facts.kinds);
  lab.setReadout(S.kAll ? n : `${Math.min(n, 8)}/8`, K.sub, '', '#8fcb85');
  let st;
  if (S.kg === null) st = { emo: '🤔', title: t.ask, lead: K.askLead };
  else if (ci < 0) st = { emo: '🏘️', title: K.pick, lead: '' };
  else if (!S.last || S.last.h !== ci) st = { emo: '🏘️', title: K.houses[ci], lead: K.goLead };
  else { const ch = S.last.ch; st = { emo: K_EMO[ch], title: `${K.houses[ci]}: ${ch < 4 ? K.jobs[ch] : K.feats[ch - 4]}`, lead: ch < 4 ? K.doers[ch] : chipResult(ci, ch) ? K.yes : K.no }; }
  const verdict = S.kAll ? `<div class="fr-v"><b>${esc(S.kg === 0 ? t.right : t.wrong)}</b> ${esc(K.reveal)}</div>` : '';
  lab.setState({ ...st, body: '', extra: verdict });
}
function renderYears(t) {
  const Y = t.y, y = S.y, g = S.yg !== null;
  lab.setGlow('rgba(255, 111, 142, .22)');
  $('yPred').innerHTML = g ? '' : predHtml(Y.q, Y.opts);
  $('yPlay').hidden = !g;
  const sl = $('ySl'); sl.setAttribute('aria-label', Y.slider); if (+sl.value !== y) sl.value = y;
  $('yPlayB').textContent = S.playing ? Y.pause : Y.play; $('yEnd').textContent = Y.end;
  lab.setFacts(t.facts.years);
  lab.setReadout(y, Y.sub(y), '', '#ff6f8e');
  const ph = Y.ph[PHASE(y)];
  const verdict = S.yAll ? `<div class="fr-v"><b>${esc(S.yg === 2 ? t.right : t.wrong)}</b> ${esc(Y.reveal)}</div>` : '';
  const real = g ? `<div class="fr-rw"><b>${esc(Y.rw)}</b><p>${esc(Y.rw1)}<small>${esc(Y.rw1s)}</small></p><p>${esc(Y.rw2)}<small>${esc(Y.rw2s)}</small></p></div>` : '';
  if (!g) lab.setState({ emo: '🤔', title: t.ask, lead: Y.askLead, body: '', extra: '' });
  else lab.setState({ emo: ph.emo, title: ph.title, lead: ph.lead, body: '', extra: verdict + real });
}
render();
</script>
