const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const fixRule = () => trainRule([...BASE, ...addKids(S.f.adds)], { shirt: S.f.shirt, school: true, stars: true }, S.f.skill);
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, s = S;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    s.sec = s.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
    if (s.sec === 'cv') s.cv = { pair: 0, run: false, at: -9 }; if (s.sec === 'face') s.fc = { run: false, more: false, at: -9 };
  }
  // secrets
  else if (act === 'cvrun') { s.cv.run = true; s.cv.at = now(); sfx.push(); }
  else if (act === 'cvnext') { s.cv = { pair: (s.cv.pair + 1) % 3, run: false, at: -9 }; sfx.click(); }
  else if (act === 'fcrun') { s.fc.run = true; s.fc.at = now(); sfx.push(); }
  else if (act === 'fcmore') { s.fc.more = true; s.fc.run = true; s.fc.at = now(); sfx.good(); }
  // train
  else if (act === 'train') { s.t = { ...s.t, p: 1, t0: now() }; sfx.push(); }
  else if (act === 'guess') { const g = b.dataset.g === '1', ok = g === decide(RULE0, NEW[s.t.i]); s.t.guess = g; s.t.gAt = now(); if (ok) s.t.score++; (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'tnext') { s.t.i++; s.t.guess = null; sfx.click(); }
  else if (act === 'tshow') { s.t.shown = true; sfx.good(); showStage(); }
  else if (act === 'tagain') { s.t = fresh().t; sfx.click(); }
  // fix
  else if (act === 'fshirt') { s.f.shirt = !s.f.shirt; s.f.trained = false; sfx.tick(); }
  else if (act === 'fadd') { if (s.f.adds < MAXADD) { s.f.adds++; s.f.addAt = now(); s.f.trained = false; sfx.snap(); } }
  else if (act === 'fskill') { s.f.skill = !s.f.skill; s.f.trained = false; sfx.tick(); }
  else if (act === 'fretrain') { s.f.rule = fixRule(); s.f.err = errorsOf(s.f.rule); s.f.trained = true; s.f.tAt = now(); sfx.good(); showStage(); }
  else if (act === 'freset') { s.f = fresh().f; sfx.click(); }
  // rules
  else if (act === 'pin') {
    const id = b.dataset.id, i = s.r.pins.indexOf(id);
    if (s.r.checked) return;
    if (i >= 0) s.r.pins.splice(i, 1); else if (s.r.pins.length < 4) s.r.pins.push(id); else return;
    sfx.tick();
  } else if (act === 'rcheck') {
    const nb = s.r.pins.filter((p) => p === 'never' || p === 'hide').length;
    s.r.checked = true; s.r.trust = clamp(0.35 + 0.15 * (4 - nb) - 0.25 * nb, 0.08, 1); (nb ? sfx.bad : sfx.good)(); showStage();
  } else if (act === 'rtw') { s.r.tw = 1; s.r.rule = RULE_TW; sfx.push(); }
  else if (act === 'rans') { s.r.ans = b.dataset.a; s.r.tw = 2; (b.dataset.a === 'school' ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'rfix') { s.r.tw = 3; s.r.trust = Math.min(1, s.r.trust + 0.2); sfx.good(); }
  else if (act === 'ragain') { s.r = fresh().r; sfx.click(); }
  render();
});

// --- one render per change ------------------------------------------------------------------------------------
const btn = (act, label, extra = '', cls = 'chip') => `<button class="${cls} fa-b" data-act="${act}" ${extra}>${esc(label)}</button>`;
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v;
  $('vTrain').style.display = !sec && v === 'train' ? '' : 'none';
  $('vFix').style.display = !sec && v === 'fix' ? '' : 'none';
  $('vRules').style.display = !sec && v === 'rules' ? '' : 'none';
  $('vSec').style.display = sec ? '' : 'none';
  const open = secret.unlocked();
  $('secChips').innerHTML = [['cv', '🧾', t.sec.cv], ['face', '👤', t.sec.face]].map(([k, e, l]) =>
    `<button class="chip secret fa-b ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? esc(l) : '🔒 ???'}</button>`).join('');
  lab.setFacts([t.facts[v] ? { emo: v === 'train' ? '🧾' : v === 'fix' ? '🧑‍🔬' : '🇪🇺', ...t.facts[v] } : null].filter(Boolean));
  $('gauge').style.visibility = 'hidden';
  if (sec === 'cv') return renderCV(t);
  if (sec === 'face') return renderFace(t);
  if (v === 'train') renderTrain(t); else if (v === 'fix') renderFix(t); else renderRules(t);
}
function renderCV(t) {
  const c = t.cv, p = S.cv;
  lab.setGlow('rgba(224, 73, 63, .22)');
  $('secBtns').innerHTML = (p.run ? '' : btn('cvrun', c.run, '', 'btn')) + btn('cvnext', c.next);
  $('secFine').textContent = c.fake;
  lab.setReadout(p.run ? `${[[86, 64], [84, 61], [88, 66]][p.pair].join(' : ')}` : '?', c.score, '', '#e0493f');
  lab.setState({ emo: '🧾', title: (p.run ? c.s1 : c.s0)[0], lead: (p.run ? c.s1 : c.s0)[1], body: '', extra: '' });
}
function renderFace(t) {
  const c = t.fc, f = S.fc;
  lab.setGlow('rgba(143, 127, 208, .25)');
  $('secBtns').innerHTML = (f.run ? '' : btn('fcrun', c.run, '', 'btn')) + (f.run && !f.more ? btn('fcmore', c.more, '', 'btn') : '');
  $('secFine').textContent = c.fake;
  lab.setReadout(f.run ? `${f.more ? 0 : 0} · ${f.more ? 1 : 3}` : '?', c.light + ' · ' + c.dark, '', '#8f7fd0');
  const s = !f.run ? c.s0 : f.more ? c.s2 : c.s1;
  lab.setState({ emo: '👤', title: s[0], lead: s[1], body: '', extra: '' });
}
function renderTrain(t) {
  const s = S.t, q = t.tr, i = s.i;
  lab.setGlow('rgba(224, 176, 80, .24)');
  $('leg').textContent = t.legend;
  let row = '';
  if (s.p === 0) row = btn('train', q.go, '', 'btn');
  else if (s.p === 2 && !s.shown) {
    if (s.guess === null) row = `<div class="fa-q">${esc(q.q)}</div>` + btn('guess', q.yes, 'data-g="1"') + btn('guess', q.no, 'data-g="0"');
    else row = i < 4 ? btn('tnext', q.next, '', 'btn') : btn('tshow', q.show, '', 'btn');
  } else if (s.shown) row = btn('tagain', q.again);
  $('trRow').innerHTML = row;
  const done = s.guess !== null ? i + 1 : i;
  lab.setReadout(`${s.p === 2 ? s.score : 0}/${s.p === 2 ? done : 0}`, q.rd, '', '#e0b050');
  if (s.p === 0) lab.setState({ emo: '⚽', title: q.s0[0], lead: q.s0[1], body: '', extra: '' });
  else if (s.p === 1) lab.setState({ emo: '🧠', title: q.sL[0], lead: q.sL[1], body: '', extra: '' });
  else if (s.shown) lab.setState({ emo: '🔍', title: q.sR(t.ruleText(RULE0)), lead: q.sRl(s.score), body: '', extra: '' });
  else if (s.guess === null) lab.setState({ emo: '🤔', title: q.sQ(i + 1)[0], lead: q.sQ(i + 1)[1], body: '', extra: '' });
  else {
    const ok = s.guess === decide(RULE0, NEW[i]);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? q.right : q.wrong, lead: q.rl(s.guess ? q.gp : q.gn, decide(RULE0, NEW[i]) ? q.gp : q.gn), body: '', extra: '' });
  }
}
function renderFix(t) {
  const f = S.f, x = t.fx;
  lab.setGlow('rgba(61, 220, 151, .2)');
  $('fxChips').innerHTML = btn('fshirt', f.shirt ? x.shirtOn : x.shirtOff, '', f.shirt ? 'chip' : 'chip on')
    + btn('fadd', x.add(f.adds, MAXADD), f.adds >= MAXADD ? 'disabled' : '') + btn('fskill', f.skill ? x.skillOn : x.skillOff, '', f.skill ? 'chip on' : 'chip');
  $('fxRow').innerHTML = btn('fretrain', x.retrain, '', 'btn') + btn('freset', x.reset);
  $('fxDef').textContent = x.def;
  const tot = f.trained ? f.err[0] + f.err[1] : ERR0[0] + ERR0[1];
  lab.setReadout(f.trained ? tot : '?', x.unit, '', '#3ddc97');
  if (!f.trained) lab.setState({ emo: '🔧', title: x.pend[0], lead: x.pend[1], body: '', extra: '' });
  else {
    const r = f.rule, [er, eb] = f.err, ttl = r.f === 'shirt' ? x.tShirt : r.f === 'school' ? x.tSchool : x.tSkill;
    lab.setState({ emo: r.f === 'stars' ? '✅' : '🤔', title: ttl, lead: x.lead(t.ruleText(r), er, eb), body: r.f === 'shirt' ? x.bShirt : r.f === 'school' ? x.bSchool : (er + eb === 0 ? x.bOk : x.bNo), extra: '' });
  }
}
function renderRules(t) {
  const r = S.r, q = t.rl, ids = ['check', 'never', 'skill', 'hide', 'explain', 'person'];
  lab.setGlow('rgba(95, 143, 208, .26)');
  const nb = r.pins.filter((p) => p === 'never' || p === 'hide').length;
  $('gauge').style.visibility = r.checked ? 'visible' : 'hidden';
  lab.setGauge(r.checked ? r.trust : 0, [{ f: 0, label: '0%' }, { f: 0.5, label: '50%' }, { f: 1, label: '100%' }], q.cap);
  lab.setReadout(r.checked ? `${Math.round(r.trust * 100)}%` : '?', q.pinned(r.pins.length), '', '#5f8fd0');
  $('ruleCards').style.display = r.tw === 0 ? '' : 'none';
  $('ruleCards').innerHTML = ids.map((id) => `<button class="fa-card ${r.pins.includes(id) ? 'on' : ''}" data-act="pin" data-id="${id}" ${r.checked ? 'disabled' : ''}>📌 ${esc(q.cards[id][0])}</button>`).join('');
  let row = '';
  if (r.tw === 0) row = r.checked ? btn('rtw', q.twGo, '', 'btn') : btn('rcheck', q.check, r.pins.length === 4 ? '' : 'disabled', 'btn');
  else if (r.tw === 1) row = `<div class="fa-q">${esc(q.twQ[0])}</div>` + [['shirt', q.twShirt], ['school', q.twSchool], ['skill', q.twSkill]].map(([a, l]) => btn('rans', l, `data-a="${a}"`)).join('');
  else if (r.tw === 2) row = btn('rfix', q.twFix, '', 'btn');
  else row = btn('ragain', q.again);
  $('rlRow').innerHTML = row;
  if (r.tw === 0 && !r.checked) lab.setState({ emo: '📌', title: q.s0[0], lead: q.s0[1], body: '', extra: '' });
  else if (r.tw === 0) {
    const list = r.pins.map((id) => { const bad = id === 'never' || id === 'hide'; return `<div><b class="${bad ? 'x' : 'g'}">${bad ? '✗' : '✓'}</b> <b>${esc(q.cards[id][1])}</b>: ${esc(q.cards[id][2])}</div>`; }).join('');
    lab.setState({ emo: nb ? '🤔' : '🤝', title: q.s1(r.trust), lead: q.l1(nb), body: '', extra: `<div class="fa-list">${list}</div>` });
  } else if (r.tw === 1) lab.setState({ emo: '🌅', title: q.twQ[0], lead: q.twQ[1], body: '', extra: '' });
  else if (r.tw === 2) lab.setState({ emo: r.ans === 'school' ? '✅' : '🤔', title: (r.ans === 'school' ? q.twOk : q.twNo)[0], lead: (r.ans === 'school' ? q.twOk : q.twNo)[1], body: '', extra: '' });
  else lab.setState({ emo: '🤝', title: q.twDone[0], lead: q.twDone[1], body: '', extra: '' });
}
render();
</script>
