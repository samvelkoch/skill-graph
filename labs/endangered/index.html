  f.x = Math.min(1, f.x + dt / 10);

  else if (f.rats) f.p -= 0.09 * dt;

  const d = t.d, D = S.d, i = D.i, answered = D.ans !== null, last = i >= 3, ansRung = OPTR[i][d.ok[i]];
  lab.setGlow('rgba(252, 127, 63, .2)');
  let html = `<p class="ec-q">${esc(d.q[i])}</p><div class="ec-opts">${d.o[i].map((x, j) => `<button class="ec-ob ${answered ? (j === d.ok[i] ? 'ec-good' : j === D.ans ? 'ec-bad' : 'ec-dim') : ''}" data-act="dopt" data-j="${j}"${answered ? ' disabled' : ''}><i class="ec-dot" style="background:${RUNG[OPTR[i][j]]}"></i>${esc(x)}</button>`).join('')}</div>`;
  if (answered) {
    html += `<div class="ec-v ${D.ans === d.ok[i] ? 'ok' : 'no'}">${esc(D.ans === d.ok[i] ? t.right : t.wrong)}</div><p class="ec-r">${esc(d.why[i])}</p>`
      + (last ? `<button class="btn" data-act="dagain">${esc(t.again)}</button>` : `<button class="btn" data-act="dnext">${esc(t.next)}</button>`);
  }
  $('ctrlBody').innerHTML = html;
  lab.setReadout(`${D.right}/4`, '', answered ? d.rungs[ansRung] : '', answered ? (ansRung === 6 ? '#555B66' : shade(RUNG[ansRung], 0.35)) : COL.whale);
  setCard(t.st.ladder[last && answered ? 1 : 0]);
}

resetHelp();
startQ();
render();
</script>
</body>
</html>
