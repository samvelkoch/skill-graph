  ell(c, -1, 0, 7.5, 4.8); c.fillStyle = '#4a6a8f'; c.fill(); c.lineWidth = 0.8; c.strokeStyle = '#eef3f8'; c.stroke();
  dot(c, 11, 0, 5.4); c.fillStyle = rad(c, 10, -2, 1, 7, [[0, '#2fa06a'], [1, '#175c3d']]); c.fill();

const path2 = (fn, t) => { const [x, y] = fn(t), [x2, y2] = fn(t + 0.05); return [x, y, Math.atan2(y2 - y, x2 - x)]; };

  const s = fit(c, w, h, 360, 330), g = rev ? pondG(p) : 0, dp = rev ? lerp(0.3, 1, c01(p / 0.28)) : 0.3;
  c.fillStyle = lin(c, 0, 0, 0, 330, [[0, '#4e8c4f'], [1, '#33663b']]); c.fillRect(-400, -400, 1160, 1100);
  for (const q of PD.blots) { ell(c, q.x, q.y, q.rx, q.ry, 0.3); c.fillStyle = q.l ? 'rgba(150, 200, 110, .1)' : 'rgba(10, 40, 20, .12)'; c.fill(); }
  // the stream: narrow above the dam, a trickle below once the dam is closed
  const wDown = 18 - 8 * c01(p / 0.3) * (rev ? 1 : 0), side = (ex) => { const Lp = [], Rp = []; for (let y = -20; y <= 350; y += 8) { const ww = (y > YD ? wDown : 18) + ex; Lp.push([SX(y) - ww / 2, y]); Rp.push([SX(y) + ww / 2, y]); } return [...Lp, ...Rp.reverse()]; };
  poly(c, side(5)); c.closePath(); c.fillStyle = '#6f5a3a'; c.fill();
  poly(c, side(0)); c.closePath(); c.fillStyle = lin(c, 150, 0, 230, 0, [[0, '#3f98b6'], [0.5, '#5fb6cb'], [1, '#3b8fae']]); c.fill();
  // the pond that forms behind the dam
  const pc = (y) => pondC(y), edge = () => { const Lp = [], Rp = []; for (let y = 16; y <= YD + 3; y += 5) { const hw = pondHW(y, g); Lp.push([pc(y) - hw, y]); Rp.push([pc(y) + hw * 0.94, y]); } return [...Lp, ...Rp.reverse()]; };
  if (g > 0.01) {
    c.lineJoin = 'round'; poly(c, edge()); c.closePath(); c.lineWidth = 6; c.strokeStyle = '#6f5a3a'; c.stroke();
    c.fillStyle = rad(c, XC, 150, 6, 120, [[0, '#6cc3d6'], [0.6, '#46a1bc'], [1, '#2f7f9c']]); c.fill();
    c.save(); poly(c, edge()); c.closePath(); c.clip();
    for (let k = 0; k < 7; k++) { const ph = (t * 0.22 + k / 7) % 1, cx = XC - 40 + (k * 37) % 90, cy = 60 + (k * 53) % 130; ell(c, cx, cy, 6 + ph * 24, (6 + ph * 24) * 0.35); c.strokeStyle = `rgba(255, 255, 255, ${0.32 * (1 - ph)})`; c.lineWidth = 1.2; c.stroke(); }
    c.fillStyle = lin(c, 0, 20, 0, 90, [[0, 'rgba(20, 60, 40, .3)'], [1, 'rgba(20, 60, 40, 0)']]); c.fillRect(0, 20, 360, 70);
    c.restore();
    c.globalAlpha = sm((g - 0.4) / 0.6);
    for (const [dx, y] of [[-30, 150], [20, 170], [-8, 120], [35, 128], [-42, 178]]) {
      const x = pc(y) + dx * 0.9; ell(c, x, y, 8.5, 6.6); c.fillStyle = rad(c, x - 2, y - 2, 1, 9, [[0, '#67b25a'], [1, '#2f7a38']]); c.fill(); c.lineWidth = 0.8; c.strokeStyle = '#27602f'; c.stroke();
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + 8.5, y - 1.8); c.lineTo(x + 8, y + 2.2); c.closePath(); c.fillStyle = '#35729c'; c.fill();
    }
    c.lineCap = 'round';
    for (const y of [70, 100, 130, 160, 190]) for (const k of [-1, 1]) { const x = pc(y) + k * (pondHW(y, g) + 2); for (let j = 0; j < 4; j++) { const bx = x + (j - 1.5) * 2.4 * k, hh = 9 + ((y + j * 7) % 6) + Math.sin(t * 1.3 + j + y) * 0.8; c.strokeStyle = '#5d8a3a'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(bx, y + 3); c.lineTo(bx + k * 1.5, y - hh); c.stroke(); if (j % 2 === 0) { ell(c, bx + k * 1.5, y - hh, 1.3, 2.6); c.fillStyle = '#6b4a2b'; c.fill(); } } }
    c.globalAlpha = 1;
  }
  // fish live under the surface
  if (rev && p > 0.86) { const k0 = eob((p - 0.86) / 0.1); for (let k = 0; k < 3; k++) { const fn = (u) => { const y = 152 + 22 * Math.sin(u * 0.7 + k * 1.7); return [pondC(y) + 30 * Math.cos(u * 0.5 + k * 2.1), y]; }, [x, y, a] = path2(fn, t); c.save(); c.globalAlpha = c01(k0); fish(c, x, y, a); c.restore(); } }
  // the dam: sticks pile up from both banks toward the middle
  const vis = PD.sticks.filter((q) => Math.abs(q.u) >= 1 - dp);
  const dy = (u) => YD - 6 * (1 - u * u);
  c.lineCap = 'round';
  for (const side2 of [-1, 1]) { const a = 1 - dp; c.beginPath(); for (let k = 0; k <= 10; k++) { const u = side2 * (a + (1 - a) * k / 10); k ? c.lineTo(XC + u * HALF, dy(u)) : c.moveTo(XC + u * HALF, dy(u)); } c.strokeStyle = '#4a331f'; c.lineWidth = 12; c.stroke(); }
  for (const pass of [0, 1]) for (const q of vis) {
    const x = XC + q.u * HALF, y = dy(q.u), dx = Math.cos(q.a) * q.len / 2, dyy = Math.sin(q.a) * q.len / 2;
    c.beginPath(); c.moveTo(x - dx, y - dyy); c.lineTo(x + dx, y + dyy); c.strokeStyle = pass ? q.col : '#2e1d10'; c.lineWidth = pass ? q.wd : q.wd + 1.6; c.stroke();
  }
  if (dp < 1) { c.strokeStyle = 'rgba(255, 255, 255, .6)'; c.lineWidth = 1.3; for (let k = 0; k < 4; k++) { const ph = (t * 0.9 + k / 4) % 1; c.beginPath(); c.moveTo(SX(YD + 10 + ph * 30) - 3 + k, YD + 10 + ph * 30); c.lineTo(SX(YD + 10 + ph * 30) + 3 + k, YD + 12 + ph * 30); c.stroke(); } }
  // frogs on lily pads, ducks, the beaver, dragonflies
  if (rev) {
    for (const [k, y, dx, th] of [[0, 150, -30, 0.6], [1, 170, 20, 0.66]]) { const kk = eob((p - th) / 0.1); if (kk > 0.01) { const hop = Math.max(0, Math.sin(t * 2 + k * 3)) ** 8 * 5; c.save(); c.globalAlpha = c01(kk); frog(c, pc(y) + dx * 0.9, y, k ? 2.4 : -0.7, hop); c.restore(); } }
    for (let k = 0; k < 2; k++) { const kk = eob((p - (0.7 + k * 0.06)) / 0.1); if (kk > 0.01) { const fn = (u) => { const y = 118 + k * 40 + 12 * Math.sin(u * 0.4 + k); return [pondC(y) + 30 * Math.cos(u * 0.3 + k * 3), y]; }, [x, y, a] = path2(fn, t); ell(c, x, y + 1, 20, 9); c.fillStyle = 'rgba(255, 255, 255, .12)'; c.fill(); c.save(); c.globalAlpha = c01(kk); duck(c, x, y, a); c.restore(); } }
  }
  { // the beaver walks on the bank with a stick, then swims in the pond
    const f = rev ? sm((p - 0.25) / 0.2) : 0;
    const fa = (u) => [XC + 44 - 18 * Math.sin(u * 0.6), YD - 12], fb = (u) => { const y = 150 + 18 * Math.sin(u * 0.5); return [pondC(y) + 26 * Math.cos(u * 0.5), y]; };
    const [x1, y1, a1] = path2(fa, t), [x2, y2, a2] = path2(fb, t);

  }
  for (let k = 0; k < 2; k++) { const kk = rev ? eob((p - (0.45 + k * 0.05)) / 0.1) : 0; if (kk > 0.01) { const fn = (u) => { const y = 112 + k * 30 + 14 * Math.cos(u * 1.1 + k); return [pondC(y) + 44 * Math.sin(u * 0.8 + k * 2.5), y]; }, [x, y, a] = path2(fn, t); ell(c, x + 3, y + 12, 9, 3); c.fillStyle = 'rgba(0, 0, 0, .14)'; c.fill(); c.save(); c.globalAlpha = c01(kk); dragonfly(c, x, y, a, t); c.restore(); } }

// --- shell, quiz, controls ------------------------------------------------------------------------------------
const lab = shell({ key: 'habitat-makers', T, topics: TOPICS, views: ['worms', 'hole', 'pond'], onLang: render, onView: () => { S.sec = null; render(); } });
const secret = secretLab('habitat-makers', () => ({
  secrets: [{ emo: '🔍', title: T[lang].sec.a[0], desc: T[lang].sec.a[1] }, { emo: '🔭', title: T[lang].sec.b[0], desc: T[lang].sec.b[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="hmQ"></div>
  <div id="hmS" hidden>
    <div class="hm-vd" id="hmVd"></div>
    <div class="hm-ends"><span id="hmE0"></span><span id="hmE1"></span></div>
    <input id="hmSl" class="big" type="range" min="0" max="100" step="1" value="0">
    <div class="hm-res" id="hmRes"></div>
    <div class="row2"><button type="button" class="chip secret" id="hmSec" hidden></button></div>
  </div>`;

canvasLoop($('cv'), (c, w, h, dt, time) => {
  for (const k of Object.keys(S.av)) S.av[k] += clamp(S.tp[k] - S.av[k], -dt * S.spd, dt * S.spd);
  const v = lab.view;
  if (v === 'hole' && S.hs < 0) S.hs = time;
  if (phaseKey() !== S.pk) render();
  if (v === 'worms') S.sec === 'darwin' ? drawWorms(c, w, h, time, 1, true, true, S.av.d) : drawWorms(c, w, h, time, S.av.w, S.w.guess !== null, false, 0);
  else if (v === 'hole') drawHole(c, w, h, time, S.av.h, S.h.done, !S.h.done);
  else if (S.sec === 'long') drawLong(c, w, h, time, S.av.l);
  else drawPond(c, w, h, time, S.av.p, S.p.guess !== null);
});

const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const reveal = (k) => { S.tp[k] = 1; S.av[k] = 0; S.spd = 0.3; };
$('hmQ').addEventListener('click', (ev) => {
  const v = lab.view, t = T[lang], V = t[v];
  if (ev.target.closest('[data-go]')) { if (!S.h.picks.length) return; S.h.done = true; reveal('h'); const ok = V.fits.every((f, i) => !!f === S.h.picks.includes(i)); (ok ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  const b = ev.target.closest('.hm-opt'); if (!b) return;
  const i = +b.dataset.i;
  if (v === 'hole') { const at = S.h.picks.indexOf(i); if (at < 0) S.h.picks.push(i); else S.h.picks.splice(at, 1); sfx.tick(); render(); return; }
  const g = v === 'worms' ? S.w : S.p; g.guess = i; reveal(v === 'worms' ? 'w' : 'p'); (i === V.ok ? sfx.good : sfx.bad)(); render(); showStage();
});
$('hmSl').addEventListener('input', (ev) => { S.tp[curKey()] = +ev.target.value / 100; S.spd = 2.2; render(); });
$('hmSec').addEventListener('click', () => {
  if (!secret.unlocked()) return secret.open();
  const want = lab.view === 'worms' ? 'darwin' : 'long', k = want === 'darwin' ? 'd' : 'l';
  S.sec = S.sec === want ? null : want; if (S.sec) reveal(k);
  sfx.click(); render();
});

function renderPred(t, v) {
  const V = t[v], picks = v === 'hole' ? S.h.picks : [];
  $('hmQ').innerHTML = `<div class="hm-q">${esc(V.q)}</div><div class="hm-opts n${V.opts.length}">${V.opts.map((o, i) => `<button type="button" class="hm-opt${picks.includes(i) ? ' on' : ''}" data-i="${i}"><span class="e">${OPT[v][i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`
    + (v === 'hole' ? `<button type="button" class="btn hm-go" data-go${picks.length ? '' : ' disabled'}>${esc(V.go)}</button>` : '');
  lab.setGlow(GLOW[v]);
  lab.setReadout(V.pre.emo, V.pre.sub, '', ACC[v]);
  lab.setState({ emo: V.pre.emo, title: V.pre.title, lead: V.pre.lead, body: '', extra: '' });
  lab.setFacts([]);
}
function renderRev(t, v) {
  const V = t[v], k = curKey(), a = S.av, glow = GLOW[v];
  let ph, ends, sub, val, pill = '', key = v, good = true;
  if (k === 'd') {
    const yr = Math.round(a.d * 29), i = a.d < 0.05 ? 0 : a.d < 0.99 ? 1 : 2;
    ph = t.dar.ph[i]; ends = t.dar.ends; val = String(yr); sub = t.dar.yrs(yr); pill = i === 2 ? t.dar.pill : ''; key = 'darwin';
  } else if (k === 'l') {
    const i = a.l < 0.15 ? 0 : a.l < 0.95 ? 1 : 2;
    ph = t.lng.ph[i]; ends = t.lng.ends; val = i === 0 ? `≈ 100 ${t.m}` : i === 2 ? `775 ${t.m}` : '↔'; sub = t.lng.sub; key = 'long';
  } else if (v === 'worms') {
    const i = a.w < 0.1 ? 0 : a.w < 0.9 ? 1 : 2;
    ph = V.ph[i]; ends = V.ends; val = ['🍂', '🪱', '🌱'][i]; sub = V.subs[i]; good = S.w.guess === V.ok;
  } else if (v === 'hole') {
    const n = nRes(), i = n === 0 ? 0 : n < 3 ? 1 : 2;
    ph = V.ph[i]; ends = V.ends; val = n ? ['🐿️', '🦉', '🦇'].slice(0, n).join('') : '🕳️'; sub = V.subs[i];
    good = V.fits.every((f, j) => !!f === S.h.picks.includes(j));
  } else {
    const i = a.p < 0.18 ? 0 : a.p < 0.45 ? 1 : a.p < 0.84 ? 2 : 3;
    ph = V.ph[i]; ends = V.ends; val = ['🦫', '💧', '🏞️', '🐟'][i]; sub = V.subs[i]; good = S.p.guess === V.ok;
  }
  lab.setGlow(glow);
  lab.setReadout(val, sub, pill, ACC[v]);
  lab.setState({ emo: ph[0], title: ph[1], lead: ph[2], body: '', extra: '' });
  lab.setFacts(t.f[key].map(([emo, text], i) => ({ emo, text, src: SRC[key][i] })));
  const vd = $('hmVd'); vd.hidden = !(k === 'w' || k === 'h' || k === 'p');
  vd.className = `hm-vd ${good ? 'ok' : 'no'}`; vd.textContent = good ? V.right : V.wrong;
  $('hmE0').textContent = ends[0]; $('hmE1').textContent = ends[1];
  const sl = $('hmSl'); sl.style.setProperty('--track', TRACK[k]); sl.setAttribute('aria-label', t.slide);
  if (+sl.value !== Math.round(S.tp[k] * 100)) sl.value = Math.round(S.tp[k] * 100);
  $('hmRes').innerHTML = v === 'hole' && k === 'h' ? V.opts.map((o, i) => `<span class="hm-r ${V.fits[i] ? 'y' : 'n'}${S.h.picks.includes(i) ? ' me' : ''}">${OPT.hole[i]} ${esc(o)} ${V.fits[i] ? '✓' : '✗'}</span>`).join('') : '';
  const chip = $('hmSec'); chip.hidden = v === 'hole';
  if (v !== 'hole') {
    const want = v === 'worms' ? 'darwin' : 'long', open = secret.unlocked(), nm = t.sec[v === 'worms' ? 'a' : 'b'][0];
    chip.className = `chip secret${open ? ' open' : ''}${S.sec === want ? ' on' : ''}`;
    chip.textContent = open ? `${v === 'worms' ? '🔍' : '🔭'} ${nm}` : '🔒 ???';
  }
}
function render() {
  const t = T[lang], v = lab.view, rev = isRev(v);
  S.pk = phaseKey();
  $('hmQ').hidden = rev; $('hmS').hidden = !rev;
  if (rev) renderRev(t, v); else renderPred(t, v);
}
render();
