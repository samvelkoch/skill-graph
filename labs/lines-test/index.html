// --- the loop ----------------------------------------------------------------------------------------------------
function advance(time) {
  const v = lab.view;
  const tick = (key, t0) => {
    const n = clamp(Math.floor((time - t0 - .45) / .7) + 1, 0, 6), k = (S.tk[key] ??= { t0, n: 0 });
    if (k.t0 !== t0) { k.t0 = t0; k.n = 0; }
    if (n > k.n) { k.n = n; sfx.tick(); }
  };
  if (v === 'lines') {
    if (S.sec === 'b') { if (S.sb.phase === 'group') { tick('b', S.sb.t0); if (time > S.sb.t0 + T_GROUP) { S.sb.phase = 'answer'; render(); } } }
    else if (S.sec === null) {
      if (S.phase === 'group') { tick('l', S.t0); if (time > S.t0 + T_GROUP) { S.phase = 'answer'; render(); } }
      else if (S.phase === 'reveal' && time > S.revT + 8.2) { S.phase = 'real'; render(); }
    }
  } else if (v === 'ally' && S.allyPick === null) tick('a', S.allyT0);
}
S.sT0 = now();
canvasLoop($('cv'), (c, w, h, dt, time) => {
  advance(time);
  if (lab.view === 'sayno') { drawSay(c, w, h, time); return; }
  const L = layout(w, h), sc = sceneSpec(time), sp = boardSpec(time);
  // the pressure needle: a little spring, so it overshoots and settles
  const nShown = clamp(Math.floor((time - S.allyT0 - .45) / .7) + 1, 0, 6);
  const tgt = S.allyPick !== null ? (S.allyOn ? .3 : .92) : .2 + .12 * nShown;
  S.nv += ((tgt - S.nx) * 60 - S.nv * 9) * dt; S.nx += S.nv * dt;
  drawRoom(c, w, h, L.fy);
  if (sp.key !== S.bkey) { S.bkey = sp.key; S.bkT = time; }
  drawBoard(c, L.board, sp, time - S.bkT, time);
  drawRow(c, L, time, sc, w, h);
});

// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => {

};
const resetLines = () => { Object.assign(S, { ti: 0, phase: 'group', t0: now(), picks: [], pickT: 0, revT: 0, realPick: null, permReal: shuffle([0, 1, 2]) }); };
const resetSay = () => { Object.assign(S, { si: 0, sPerm: Array.from({ length: 5 }, () => shuffle(['reason', 'other', 'away', 'givein'])), sRes: Array.from({ length: 5 }, () => ({ done: false, gave: false, pick: null })), sT0: now(), sT: now() }); };

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = +b.dataset.k;
  if (act === 'pick') { // the child answers a card
    if (S.phase !== 'answer') return;
    S.picks[S.ti] = k; S.phase = 'done'; S.pickT = now(); sfx.click();
  } else if (act === 'next') {
    if (S.ti < 4) { S.ti++; S.phase = 'group'; S.t0 = now(); sfx.click(); }
    else { S.phase = 'reveal'; S.revT = now(); sfx.snap(); showStage(); }
  } else if (act === 'real') {
    if (S.realPick !== null) return;
    S.realPick = k; S.phase = 'realRev'; (k === 1 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'again') { resetLines(); sfx.click(); }
  else if (act === 'apred') {
    if (S.allyPick !== null) return;
    S.allyPick = k; S.allyOn = true; S.allyRevT = now(); S.allySwapT = now(); (k === 0 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'toggle') { S.allyOn = !S.allyOn; S.allySwapT = now(); sfx.click(); }
  else if (act === 'sec') {
    const key = b.dataset.key;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === key ? null : key;
    if (S.sec === 'b') S.sb = { phase: 'group', t0: now(), pick: null, pickT: 0 };
    sfx.click();
  } else if (act === 'sbpick') {

    else { res.done = true; res.pick = key; S.sT = now(); sfx.good(); }

  document.body.dataset.v = v;
  $('ltSec').style.display = v === 'lines' ? 'flex' : 'none';
  if (v === 'lines') renderLines(T[lang]); else if (v === 'ally') renderAlly(T[lang]); else renderSay(T[lang]);
}

function renderLines(t) {
  lab.setGlow('rgba(246, 231, 200, .22)');
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-key="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('ltSec').innerHTML = sc('a', '📉') + sc('b', '🗣️');
  const main = $('ltMain');
  if (S.sec === 'a') {
    main.innerHTML = '';
    lab.setReadout('📉', t.secrets.a[0], '', '#f4c95d');
    lab.setState({ emo: '📉', title: t.secrets.a[0], lead: t.secrets.a[1], body: '', extra: '' });
    lab.setFacts(t.facts.sayno);
    return;
  }
  if (S.sec === 'b') {
    const b = S.sb, p = b.pick;
    main.innerHTML = `<div class="lt-q">${esc(t.qLine)}</div>${abc('sbpick', p, b.phase !== 'answer' || p !== null)}<div class="lt-note">${esc(t.secBhint)}</div>${p !== null ? `<div class="lt-row"><button class="btn" data-act="sbagain">${esc(t.again)}</button></div>` : ''}`;
    lab.setReadout(p === null ? '?' : LETTERS[p], t.secrets.b[0], '', '#f4c95d');
    lab.setState(p === null ? { emo: '🗣️', title: t.qLine, lead: '', body: '', extra: '' } : { emo: '🤫', title: t.secrets.b[0], lead: t.secrets.b[1], body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const tricky = [2, 3].filter((i) => S.picks[i] === TRIALS[i].ok).length, after = S.phase === 'real' || S.phase === 'realRev';
  if (S.phase === 'group' || S.phase === 'answer' || S.phase === 'done') {
    main.innerHTML = `<div class="lt-q">${esc(t.qLine)}</div>${abc('pick', S.phase === 'done' ? S.picks[S.ti] : null, S.phase !== 'answer')}${S.phase === 'done' ? `<div class="lt-row"><button class="btn" data-act="next">${esc(t.nextCard)} →</button></div>` : ''}`;
    lab.setReadout('?', t.card(S.ti + 1), '', '#f6e7c8');
    lab.setState({ emo: '📏', title: t.qLine, lead: t.card(S.ti + 1), body: '', extra: '' });
    lab.setFacts([]);
  } else if (S.phase === 'reveal') {
    main.innerHTML = '';
    lab.setReadout('?', t.card(5), '', '#f6e7c8');
    lab.setState({ emo: '📏', title: t.qLine, lead: '', body: '', extra: '' });
    lab.setFacts([]);
  } else {
    const rp = S.realPick;
    main.innerHTML = `<div class="lt-q">${esc(t.qReal)}</div>${chips('real', S.permReal, t.optsReal, 1, rp)}${rp !== null ? `<div class="lt-row"><button class="btn" data-act="again">↻ ${esc(t.again)}</button></div>` : ''}`;
    lab.setReadout(`${tricky} / 2`, t.tricky, rp === null ? '' : rp === 1 ? t.right : t.notQuite, '#f6e7c8');
    lab.setState({ emo: t.state.lines.emo, title: t.state.lines.title, lead: t.state.lines.lead, body: t.state.lines.body, extra: '' });
    lab.setFacts(after ? t.facts.lines : []);
  }
}

function renderAlly(t) {
  lab.setGlow('rgba(110, 231, 183, .22)');
  const rp = S.allyPick, rev = rp !== null;
  let html = `<div class="lt-q">${esc(t.qAlly)}</div>${chips('apred', S.permAlly, t.optsAlly, 0, rp)}`;
  if (rev) html += `<div class="lt-row"><button class="chip lt-c lt-tog ${S.allyOn ? 'on' : ''}" data-act="toggle" aria-pressed="${S.allyOn}">${S.allyOn ? '✓ ' : ''}${esc(t.allyToggle)}</button></div><div class="lt-note">${esc(t.allyWhy)}</div>`;
  $('ltMain').innerHTML = html;
  if (rev) lab.setReadout(t.frac(1, S.allyOn ? 20 : 3), S.allyOn ? t.allyUnit : t.noAllyUnit, rp === 0 ? t.right : t.notQuite, '#6ee7b7');
  else lab.setReadout('?', '', '', '#6ee7b7');
  const st = rev ? t.state.ally : t.state.lines;
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body, extra: '' });
  lab.setFacts(rev ? t.facts.ally : []);
}

function renderSay(t) {
  lab.setGlow('rgba(255, 209, 102, .2)');
  const i = S.si, res = S.sRes[i], sit = t.situations[i], doneN = S.sRes.filter((r) => r.done).length;
  const dots = `<div class="lt-dots">${S.sRes.map((r, j) => `<i class="${r.done ? 'done' : j === i ? 'now' : ''}"></i>`).join('')}</div>`;
  const btns = S.sPerm[i].map((key) => {
    const good = GOOD.includes(key);
    const cls = res.done ? (key === res.pick ? 'good' : 'off') : res.gave ? (key === 'givein' ? 'bad' : 'hint') : '';
    const mark = res.done && key === res.pick ? '✓' : key === 'givein' && res.gave ? '✗' : good && res.gave && !res.done ? '👉' : '';
    return `<button class="lt-resp ${cls}" data-act="resp" data-key="${key}"${res.done || (key === 'givein' && res.gave) ? ' disabled' : ''}><span class="m">${mark}</span><span>${esc(t.responses[key])}</span></button>`;
  }).join('');
  const why = res.done ? `<div class="lt-why good">${esc(t.goodWhy[res.pick])}</div>` : res.gave ? `<div class="lt-why bad">${esc(t.giveinWhy)}</div>` : '';
  const nxt = res.done ? `<div class="lt-row"><button class="btn" data-act="snext">${S.si < 4 ? `${esc(t.nextCard)} →` : `↻ ${esc(t.again)}`}</button></div>` : '';
  $('ltMain').innerHTML = `${dots}<div class="lt-sit"><span class="e">${sit.emo}</span><p>${esc(sit.t)}</p></div><div class="lt-resps">${btns}</div>${why}${nxt}`;
  lab.setReadout(`${doneN} / 5`, t.situationsWord, res.done ? t.right : res.gave ? t.notQuite : '', '#ffd166');
  if (res.done || res.gave) lab.setState({ emo: t.state.sayno.emo, title: t.state.sayno.title, lead: t.state.sayno.lead, body: t.state.sayno.body, extra: '' });
  else lab.setState({ emo: '🤔', title: t.whatDo, lead: '', body: '', extra: '' });
  lab.setFacts(t.facts.sayno);
}
render();
</script>
</body>
</html>
