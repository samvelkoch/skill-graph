function chordAt(O, R, P, ux, uy) { // roots of |P + t u − O|² = R² along the unit direction u
  const dx = P[0] - O[0], dy = P[1] - O[1], q = ux * dx + uy * dy, disc = q * q - (dx * dx + dy * dy - R * R);
  if (disc < 0) return null;
  const s = Math.sqrt(disc);
  return { t1: -q - s, t2: -q + s };
}
function build(O, R, P, u1, u2) { // P inside the circle: pieces a, b on chord AB (direction u1) and c, d on chord CD (direction u2)
  const k1 = chordAt(O, R, P, u1[0], u1[1]), k2 = chordAt(O, R, P, u2[0], u2[1]);
  const at = (k, u) => [P[0] + k * u[0], P[1] + k * u[1]];
  return { O, R, P, u1, u2, a: -k1.t1, b: k1.t2, c: k2.t2, d: -k2.t1, A: at(k1.t1, u1), B: at(k1.t2, u1), C: at(k2.t2, u2), D: at(k2.t1, u2) };
}
function exploreScene() {
  const th = rad(S.th);
  return build([0, 0], RC, [S.px, S.py], [1, 0], [Math.cos(th), Math.sin(th)]);
}
function puzzleScene(p) { // a circle through A, B, C built from the exact pieces: D lands on it because a·b = c·d
  const ph = rad(p.phi), x0 = (p.b - p.a) / 2;
  const y0 = (p.c * p.c - p.a * p.a - 2 * x0 * (p.a + p.c * Math.cos(ph))) / (2 * p.c * Math.sin(ph));
  return build([x0, y0], Math.hypot(x0 + p.a, y0), [0, 0], [1, 0], [Math.cos(ph), Math.sin(ph)]);
}
const angDeg = (V, Q, P) => { // angle at V between V→P and V→Q, degrees
  const ax = P[0] - V[0], ay = P[1] - V[1], bx = Q[0] - V[0], by = Q[1] - V[1];
  return Math.acos(clamp((ax * bx + ay * by) / (Math.hypot(ax, ay) * Math.hypot(bx, by)), -1, 1)) * 180 / Math.PI;
};
const ANG = { A: 'C', D: 'B', C: 'A', B: 'D' }; // the angle at V is ∠PV(other)
const hunted = () => S.done > 0 || S.rule; // a guess was made in Hunt: later views may show the rule

// --- small drawing helpers ---------------------------------------------------------------------------------
function pill(c, txt, x, y, col = INK, size = 13) {
  c.font = `800 ${size}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(txt).width + 14, th = size + 9;
  x = clamp(x, tw / 2 + 4, Math.max(tw / 2 + 4, CW - tw / 2 - 4)); y = clamp(y, th / 2 + 4, Math.max(th / 2 + 4, CH - th / 2 - 4));
  c.fillStyle = 'rgba(255,252,242,.94)'; c.strokeStyle = col; c.lineWidth = 1.8;
  c.beginPath(); c.roundRect(x - tw / 2, y - th / 2, tw, th, th / 2); c.fill(); c.stroke();
  c.fillStyle = INK; c.fillText(txt, x, y + 1);
}
function dot(c, p, col = INK, r = 4.5) {
  c.fillStyle = '#fff'; c.beginPath(); c.arc(p[0], p[1], r + 2, 0, 7); c.fill();
  c.fillStyle = col; c.beginPath(); c.arc(p[0], p[1], r, 0, 7); c.fill();
}
function line(c, p, q, col, wd) {
  c.strokeStyle = col; c.lineWidth = wd; c.lineCap = 'round'; c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.stroke();
}
function piece(c, p, q, col) { // a coloured piece of a chord over a faint ink shadow
  line(c, p, q, 'rgba(38,41,58,.22)', 8); line(c, p, q, col, 5);
}
function mid(p, q, off = 0, dir = 1) { // midpoint of p–q, moved sideways by off px
  const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2, dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1;
  return [mx - dy / L * off * dir, my + dx / L * off * dir];
}
function paper(c, w, h) {
  const g = c.createRadialGradient(w * 0.4, h * 0.3, 10, w * 0.5, h * 0.5, Math.max(w, h) * 0.85);
  g.addColorStop(0, PAPER0); g.addColorStop(1, PAPER1);
  c.fillStyle = g; c.beginPath(); c.roundRect(0, 0, w, h, 16); c.fill();
}
function circle(c, sc) {
  const [cx, cy] = X(sc.O), r = Math.max(1, sc.R * G.s);
  const g = c.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
  g.addColorStop(0, 'rgba(255,255,250,.55)'); g.addColorStop(1, 'rgba(120,160,190,.14)');
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill();
  c.strokeStyle = INK; c.lineWidth = 2.4; c.stroke();
  c.strokeStyle = 'rgba(38,41,58,.25)'; c.lineWidth = 1; c.beginPath(); c.arc(cx, cy, r + 3.5, 0, 7); c.stroke();
}
function scaleBar(c, areaH) {
  const y = areaH - 14, x = 16;
  line(c, [x, y], [x + G.s, y], INK, 2); line(c, [x, y - 4], [x, y + 4], INK, 2); line(c, [x + G.s, y - 4], [x + G.s, y + 4], INK, 2);
  c.font = '800 12px Nunito, sans-serif'; c.fillStyle = INK; c.textAlign = 'left'; c.textBaseline = 'bottom';
  c.fillText(`1 ${T[lang].cm}`, x + G.s + 6, y + 5);
}
function arc(c, V, a, Q, P, col, fill, r = 22) { // the angle at V between V→P and V→Q (screen coords)
  const r1 = Math.atan2(P[1] - V[1], P[0] - V[0]), r2 = Math.atan2(Q[1] - V[1], Q[0] - V[0]);
  const dl = ((r2 - r1 + 3 * Math.PI) % (2 * Math.PI)) - Math.PI;
  c.beginPath();
  if (fill) { c.moveTo(V[0], V[1]); c.arc(V[0], V[1], r, r1, r1 + dl, dl < 0); c.closePath(); c.fillStyle = fill; c.fill(); }
  c.beginPath(); c.arc(V[0], V[1], r, r1, r1 + dl, dl < 0); c.strokeStyle = col; c.lineWidth = fill ? 2.5 : 1.8; c.stroke();
  const m = r1 + dl / 2; return [V[0] + Math.cos(m) * (r + 15), V[1] + Math.sin(m) * (r + 15)];
}
const out = (p, sc, k = 17) => { // a label spot just outside the circle, along the ray from the centre
  const o = X(sc.O), q = X(p), dx = q[0] - o[0], dy = q[1] - o[1], L = Math.hypot(dx, dy) || 1;
  return [q[0] + dx / L * k, q[1] + dy / L * k];
};
function letter(c, t, p, col = INK) {
  c.font = '900 16px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = 4; c.strokeStyle = 'rgba(246,238,217,.9)'; c.strokeText(t, p[0], p[1]); c.fillStyle = col; c.fillText(t, p[0], p[1]);
}

function drawFig(c, w, h, dt, time, v) {

  const strip = 100 * S.stripT, areaH = h - strip, m = Math.min(w, areaH);

    c.strokeStyle = 'rgba(60,100,130,.10)'; c.lineWidth = 1; c.beginPath();

      c.moveTo(Tp[0] + ux * 9, Tp[1] + uy * 9); c.lineTo(Tp[0] + ux * 9 + vx * 9, Tp[1] + uy * 9 + vy * 9); c.lineTo(Tp[0] + vx * 9, Tp[1] + vy * 9); c.stroke(); // the right angle at T
    }
    if (S.sec2 && hs === 'free') { // bent light: a longer, curved sight line
      const b2 = Math.asin(sinB) * KREF, T2 = [cx + Rv * Math.sin(b2), cy - Rv * Math.cos(b2)];
      c.setLineDash([6, 5]); c.strokeStyle = GOLD; c.lineWidth = 2.4; c.beginPath(); c.moveTo(E[0], E[1]);
      c.quadraticCurveTo((E[0] + T2[0]) / 2 + 2, (E[1] + T2[1]) / 2 - 6, T2[0], T2[1]); c.stroke(); c.setLineDash([]); dot(c, T2, GOLD, 3.5);
    }
  }
  // labels (never the answer before the guess)
  const nfk = (x) => nf(x, 1);
  pill(c, `h = ${z.rowH(nf(hs === 'free' ? S.h : tgt, hs === 'free' && S.h < 10 ? 1 : 0))}`, E[0] - 52, E[1] + hv * 0.4, INK, 12);
  pill(c, `R = ${RTXT()} km`, cx + 8, cy - Rv * 0.5 - 6, INK, 12);
  if (showLine && lt > 0.9) {
    const hk = tgt / 1000;
    pill(c, `d = ${nfk(dHor(tgt))} km`, ...mid(E, Tp, 17, -1), '#d9593f', 12);
    pill(c, `2R + h = ${nfk(2 * EARTH_R + hk)} km`, cx + 8, cy + Rv * 0.5, INK, 12);
    pill(c, z.hor, Tp[0] + 4, Tp[1] + 22, '#d9593f', 12);
  } else if (!showLine) pill(c, 'd = ?', cx + Rv * 0.62, cy - Rv * 0.9, '#d9593f', 13);
  c.font = '700 12px Nunito, sans-serif'; c.fillStyle = 'rgba(38,41,58,.7)'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillText(z.sk, w / 2, skH - 6, w - 20);
  // to-scale bar
  const y0 = skH, x0 = 18, x1 = w - 18, ax = (x1 - x0) / 400;
  c.fillStyle = 'rgba(255,252,242,.6)'; c.beginPath(); c.roundRect(8, y0 + 2, w - 16, stripH - 8, 14); c.fill(); c.strokeStyle = 'rgba(38,41,58,.18)'; c.lineWidth = 1; c.stroke();
  c.font = '700 12px Nunito, sans-serif'; c.fillStyle = 'rgba(38,41,58,.75)'; c.textBaseline = 'alphabetic'; c.textAlign = 'center';
  for (let k = 0; k <= 400; k += 100) { const x = x0 + k * ax; line(c, [x, y0 + 8], [x, y0 + stripH - 24], 'rgba(38,41,58,.14)', 1); c.fillText(k === 400 ? `${k} km` : `${k}`, clamp(x, 26, w - 26), y0 + stripH - 10); }
  const rows = [];
  if (showLine) {
    if (hs === 'p1') rows.push({ lab: z.rowH(100), d: dHor(100), col: '#d9593f', t: 1 });
    else if (hs === 'p2') { rows.push({ lab: z.rowH(100), d: dHor(100), col: '#d9593f', t: 1 }); if (S.a2 !== null) rows.push({ lab: z.rowH(400), d: dHor(400), col: PD, t: lt }); }
    else rows.push({ lab: z.rowH(nf(S.h, S.h < 10 ? 1 : 0)), d: dHor(hh), col: '#d9593f', t: 1 });
  }
  rows.forEach((r, i) => {
    const y = y0 + 14 + i * 26, bwid = r.d * ax * r.t;
    const g = c.createLinearGradient(x0, 0, x0 + Math.max(2, bwid), 0); g.addColorStop(0, r.col); g.addColorStop(1, r.col + 'cc');
    c.fillStyle = g; c.beginPath(); c.roundRect(x0, y, Math.max(3, bwid), 18, 9); c.fill(); c.strokeStyle = INK; c.lineWidth = 1.2; c.stroke();
    if (S.sec2 && hs === 'free' && i === 0) { c.fillStyle = 'rgba(224,160,26,.45)'; c.beginPath(); c.roundRect(x0 + bwid, y, r.d * (KREF - 1) * ax, 18, 9); c.fill(); c.strokeStyle = GOLD; c.setLineDash([4, 3]); c.stroke(); c.setLineDash([]); }
    c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = INK;
    const endX = x0 + bwid + (S.sec2 && hs === 'free' && i === 0 ? r.d * (KREF - 1) * ax : 0);
    const txt = `${r.lab} → ${nfk(r.d * r.t)} km`, tw = c.measureText(txt).width;
    c.fillText(txt, endX + 8 + tw > w - 12 ? Math.max(x0 + 8, endX - tw - 8) : endX + 8, y + 10);
  });
}

// --- the single canvas loop --------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  const v = lab.view;
  if (v === 'horizon') drawHorizon(c, w, h, dt, time); else drawFig(c, w, h, dt, time, v);
});

// --- input ---------------------------------------------------------------------------------------------------------
let drag = false;
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function movePoint(ev) {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  let mx = G.O[0] + (x - G.ox) / G.s, my = G.O[1] - (y - G.oy) / G.s;
  const lim = S.sec1 && secret.unlocked() && lab.view === 'hunt' ? 1.65 * RC : 0.85 * RC, L = Math.hypot(mx, my);
  if (L > lim) { mx *= lim / L; my *= lim / L; }
  S.px = mx; S.py = my;
}
$('cv').addEventListener('pointerdown', (ev) => {
  const v = lab.view;
  if (v === 'horizon' || (v === 'hunt' && S.mode === 'puzzle')) return;
  if (v === 'why' && S.step === 1 && S.wAns === null) { // tap an angle
    const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, sc = exploreScene();
    let best = null, bd = 38;
    for (const k of ['A', 'B', 'C', 'D']) { const p = X(sc[k]), dd = Math.hypot(p[0] - x, p[1] - y); if (dd < bd) { bd = dd; best = k; } }
    if (best) { toggleSel(best); return; }
  }
  drag = true; $('cv').setPointerCapture?.(ev.pointerId); movePoint(ev); render(); ev.preventDefault();
});
$('cv').addEventListener('pointermove', (ev) => { if (drag) { movePoint(ev); render(); } });
const endDrag = () => { drag = false; };
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag);

function toggleSel(k) {
  if (S.wAns !== null) return;
  if (S.sel.includes(k)) S.sel = S.sel.filter((x) => x !== k); else S.sel = [...S.sel, k].slice(-2);
  sfx.tick(); render();
}
const hFromPos = (p) => { const hm = H_MIN * Math.pow(EVEREST / H_MIN, p / 1000); return hm < 10 ? Math.round(hm * 2) / 2 : Math.round(hm); };
const posFromH = (hm) => Math.round(1000 * Math.log(hm / H_MIN) / Math.log(EVEREST / H_MIN));

$('hSl').addEventListener('input', (ev) => { S.th = +ev.target.value; render(); });
$('wSl').addEventListener('input', (ev) => { S.th = +ev.target.value; render(); });
$('zSl').addEventListener('input', (ev) => { S.h = hFromPos(+ev.target.value); render(); });

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'puz') { S.mode = 'puzzle'; S.pz = S.pnext % PUZ.length; S.pAns = null; S.pT = 0; S.sec1 = false; sfx.click(); }
  else if (act === 'pick') {
    if (S.pAns !== null) return;
    S.pAns = i; S.pT = 0; S.done++;
    const ok = i === pzCur().ok; if (ok) S.right++; if (S.right >= 2) S.rule = true;
    (ok ? sfx.good : sfx.bad)(); showStage();
  }
  else if (act === 'pnext') { S.pnext = S.pz + 1; S.pz = S.pnext % PUZ.length; S.pAns = null; S.pT = 0; sfx.click(); }
  else if (act === 'pback') { S.mode = 'explore'; S.pAns = null; sfx.click(); }
  else if (act === 'rule') { S.rule = true; sfx.click(); }
  else if (act === 'sec1') {
    if (!secret.unlocked()) { secret.open(); return; }
    S.sec1 = !S.sec1; S.mode = 'explore'; S.sweepT = 0; sfx.click();
    if (!S.sec1) { const L = Math.hypot(S.px, S.py), lim = 0.85 * RC; if (L > lim) { S.px *= lim / L; S.py *= lim / L; } }
  }
  else if (act === 'sel') { toggleSel(b.dataset.k); return; }
  else if (act === 'wmain') {
    if (S.step === 0) { S.step = 1; sfx.click(); }
    else if (S.step === 1) {
      if (S.sel.length < 2) return;
      const s = [...S.sel].sort().join(''), ok = s === 'AD' || s === 'BC';
      S.wAns = { ok }; S.step = 2; (ok ? sfx.good : sfx.bad)(); showStage();
    }
    else if (S.step === 2) { if (!hunted()) return; S.step = 3; sfx.click(); showStage(); }
    else if (S.step === 3) { S.step = 4; S.rectT = 0; sfx.click(); }
    else { S.step = 0; S.sel = []; S.wAns = null; S.rectT = 0; sfx.click(); }
  }
  else if (act === 'gohunt') document.querySelector('#views [data-view="hunt"]')?.click();
  else if (act === 'zpick') {
    if (S.hs === 'p1') { if (S.a1 !== null) return; S.a1 = i; S.lineT = 0; (i === 1 ? sfx.good : sfx.bad)(); }
    else { if (S.a2 !== null) return; S.a2 = i; S.lineT = 0; (i === 0 ? sfx.good : sfx.bad)(); }
    showStage();
  }
  else if (act === 'znext') {
    if (S.hs === 'p1') { S.hs = 'p2'; S.lineT = 1; } else if (S.hs === 'p2') { S.hs = 'free'; S.h = 100; S.lineT = 1; }
    sfx.click();
  }
  else if (act === 'zh') { S.h = +b.dataset.h; sfx.click(); }
  else if (act === 'sec2') { if (!secret.unlocked()) { secret.open(); return; } S.sec2 = !S.sec2; sfx.click(); }
  render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------------
function render() {
  const v = lab.view;
  document.body.dataset.v = v;
  $('ccHunt').hidden = v !== 'hunt'; $('ccWhy').hidden = v !== 'why'; $('ccHor').hidden = v !== 'horizon';
  if (v === 'hunt') renderHunt(); else if (v === 'why') renderWhy(); else renderHor();
}
const piecesHTML = (sc, hideD) => {
  const n = (x, col) => `<span class="cc-n" style="color:${col}">${nf(x, 1)}</span>`;
  return `<span style="font-size:22px">${n(sc.a, PA)} · ${n(sc.b, PB)} <span class="cc-sep">|</span> ${n(sc.c, PC)} · ${hideD ? '<span class="cc-n" style="color:' + PD + '">?</span>' : n(sc.d, PD)}</span>`;
};
const secChip = (act, emo, name, on) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${on ? 'on' : ''}" data-act="${act}">${secret.unlocked() ? `${emo} ${esc(name)}` : '🔒 ???'}</button>`;

function renderHunt() {
  const t = T[lang], H = t.h, sec = S.sec1 && secret.unlocked(), puz = S.mode === 'puzzle' && !sec;
  lab.setGlow('rgba(217, 89, 63, .24)');
  $('hPuz').hidden = !puz; $('hFree').hidden = puz;
  $('hSlRow').hidden = sec; $('hSlL').textContent = H.turn; $('hSl').value = S.th;
  if (sec) {
    const dist = Math.hypot(S.px, S.py), K = Math.abs(dist * dist - RC * RC), inside = dist < RC - 1e-6;
    lab.setReadout(`<span style="font-size:24px">${nf(K, 1)}</span>`, inside ? H.s1.sub : H.s2.sub, '', '#d9593f');
    lab.setState(inside ? { emo: '🌀', title: H.s1.t, lead: H.s1.l(nf(K, 1)), body: '', extra: '' } : { emo: '🌀', title: H.s2.t, lead: H.s2.l(nf(K, 1), nf(Math.sqrt(K), 1)), body: '', extra: '' });
    lab.setFacts([]);
  } else if (puz) {
    const p = pzCur(), ans = S.pAns, ok = ans === p.ok, sc = puzzleScene(p), f1 = (x) => nf(x, 1);
    $('hQ').textContent = `${H.pn(S.pz + 1, PUZ.length)}. ${H.q}`;
    $('hOpts').innerHTML = p.opts.map((o, k) => `<button class="cc-opt ${ans === null ? '' : k === p.ok ? 'good' : k === ans ? 'bad' : ''}" data-act="pick" data-i="${k}"${ans !== null ? ' disabled' : ''}>${nf(o, 0)} ${esc(t.cm)}</button>`).join('');
    $('hAfter').hidden = ans === null; $('hNext').textContent = H.next; $('hBack').textContent = H.back;
    lab.setReadout(piecesHTML(sc, ans === null), H.pn(S.pz + 1, PUZ.length), '', '#d9593f');
    lab.setFacts([]);
    if (ans === null) lab.setState({ emo: '🤔', title: H.pzT, lead: H.pzL(f1(p.a), f1(p.b), f1(p.c)), body: '', extra: '' });
    else {
      const sumTrap = p.a + p.b - p.c, d = f1(p.d);
      const ruleLine = S.rule ? H.ruleL(f1(p.a), f1(p.b), f1(p.a * p.b), f1(p.c), f1(p.d), f1(p.c * p.d)) : '';
      if (ok) lab.setState({ emo: '✅', title: S.rule && S.right === 2 ? H.named : H.ok, lead: S.rule ? `${H.okL(d)} ${ruleLine}` : H.okL(d), body: S.rule ? H.ruleT : '', extra: '' });
      else lab.setState({ emo: '🤔', title: H.no(nf(p.opts[ans], 0), d), lead: p.opts[ans] === sumTrap ? H.add(p.a, p.b, p.c, p.d) : H.tryOn, body: S.rule ? ruleLine : '', extra: '' });
    }
  } else {
    const sc = exploreScene(), f1 = (x) => nf(x, 1);
    lab.setReadout(piecesHTML(sc, false), S.rule ? H.sub1(f1(sc.a * sc.b), f1(sc.c * sc.d)) : H.sub0, '', '#d9593f');
    lab.setFacts(H.f);
    if (S.rule) lab.setState({ emo: '💡', title: H.ruleT, lead: H.ruleL(f1(sc.a), f1(sc.b), f1(sc.a * sc.b), f1(sc.c), f1(sc.d), f1(sc.c * sc.d)), body: H.ruleB, extra: '' });
    else lab.setState({ emo: '🔎', title: H.e0[0], lead: H.e0[1], body: '', extra: '' });
  }
  $('hChips').innerHTML = sec
    ? secChip('sec1', '🌀', H.sec.t, true)
    : [`<button class="chip" data-act="puz">${esc(H.puzzle)}</button>`,
      S.done > 0 && !S.rule ? `<button class="chip" data-act="rule">${esc(H.rule)}</button>` : '', secChip('sec1', '🌀', H.sec.t, false)].join('');
  if (puz) $('hChips').innerHTML = '';
}

function renderWhy() {
  const t = T[lang], W = t.w, sc = exploreScene(), f1 = (x) => nf(x, 1);
  lab.setGlow('rgba(107, 91, 199, .26)');
  $('wSlL').textContent = W.turn; $('wSl').value = S.th;
  $('wSel').hidden = S.step !== 1 || S.wAns !== null;
  $('wSel').innerHTML = ['A', 'B', 'C', 'D'].map((k) => `<button class="chip ${S.sel.includes(k) ? 'on' : ''}" data-act="sel" data-k="${k}">∠${k}</button>`).join('');
  const locked = S.step === 2 && !hunted();
  $('wMain').textContent = S.step === 0 ? W.draw : S.step === 1 ? W.check : S.step === 2 ? (locked ? W.locked : W.toSame) : S.step === 3 ? W.toProd : W.again;
  $('wMain').disabled = (S.step === 1 && S.sel.length < 2) || locked;
  $('wGo').hidden = !locked; $('wGo').textContent = W.goHunt;
  const aA = angDeg(sc.A, sc.C, sc.P), aC = angDeg(sc.C, sc.A, sc.P);
  const area = nf(sc.a * sc.b, 1);
  lab.setReadout(piecesHTML(sc, false), S.step >= 3 ? `a × b = ${area}  ·  c × d = ${nf(sc.c * sc.d, 1)}` : W.turn, '', '#6b5bc7');
  lab.setFacts(hunted() && S.wAns !== null ? W.f : []);
  if (S.step === 0) lab.setState({ emo: '✏️', title: W.s0[0], lead: W.s0[1], body: '', extra: '' });
  else if (S.step === 1) lab.setState({ emo: '🤔', title: W.s1[0], lead: W.s1[1], body: '', extra: '' });
  else if (S.step === 2) lab.setState({ emo: S.wAns?.ok ? '✅' : '🤔', title: S.wAns?.ok ? W.rt : W.no, lead: W.s2l, body: `${W.deg(nf(aA, 0), nf(aC, 0))}. ${W.s2b}${hunted() ? '' : ' ' + W.s2lock}`, extra: '' });
  else if (S.step === 3) lab.setState({ emo: '🔺', title: W.s3[0], lead: W.s3[1], body: W.s3b(f1(sc.a), f1(sc.c), f1(sc.d), f1(sc.b)), extra: '' });
  else lab.setState({ emo: '▭', title: W.s4[0], lead: W.s4[1], body: W.s4b(f1(sc.a), f1(sc.b), f1(sc.a * sc.b), f1(sc.c), f1(sc.d), f1(sc.c * sc.d)), extra: '' });
}

function renderHor() {
  const t = T[lang], z = t.z, hs = S.hs;
  lab.setGlow('rgba(78, 168, 255, .26)');
  $('zPuz').hidden = hs === 'free'; $('zFree').hidden = hs !== 'free';
  const ans = hs === 'p1' ? S.a1 : S.a2, okI = hs === 'p1' ? 1 : 0, h1 = dHor(100), h2 = dHor(400);
  if (hs !== 'free') {
    $('zQ').textContent = hs === 'p1' ? z.q1 : z.q2;
    const opts = hs === 'p1' ? z.o1 : z.o2;
    $('zOpts').innerHTML = opts.map((o, k) => `<button class="cc-opt ${ans === null ? '' : k === okI ? 'good' : k === ans ? 'bad' : ''}" data-act="zpick" data-i="${k}"${ans !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('');
    $('zAfter').hidden = ans === null; $('zNext').textContent = hs === 'p1' ? z.go : z.free;
  }
  lab.setFacts(hs === 'free' ? (S.sec2 ? [...z.f1, z.f2] : z.f1) : z.f0);
  const f1 = (x) => nf(x, 1);
  if (hs === 'p1') {
    if (S.a1 === null) { lab.setReadout('?', z.sub(100), `R = ${RTXT()} km`, '#4ea8ff'); lab.setState({ emo: '🔭', title: z.q1, lead: z.l1, body: '', extra: '' }); }
    else {
      lab.setReadout(`${f1(h1)} km`, z.sub(100), '', '#4ea8ff');
      lab.setState({ emo: S.a1 === 1 ? '✅' : '🤔', title: S.a1 === 1 ? z.ok : z.no, lead: z.r1(f1(h1)), body: z.r1b(f1(0.1), f1(2 * EARTH_R + 0.1), f1(h1 * h1), f1(h1), hunted()), extra: '' });
    }
  } else if (hs === 'p2') {
    if (S.a2 === null) { lab.setReadout(`${f1(h1)} km`, z.sub(100), '', '#4ea8ff'); lab.setState({ emo: '🔭', title: z.q2, lead: z.l2, body: '', extra: '' }); }
    else {
      lab.setReadout(`${f1(h2)} km`, z.sub(400), '', '#4ea8ff');
      lab.setState({ emo: S.a2 === 0 ? '✅' : '🤔', title: S.a2 === 0 ? z.ok : z.no, lead: z.r2(nf(h2 / h1, 1), f1(h1), f1(h2)), body: z.r2b, extra: '' });
    }
  } else {
    const hm = S.h, d = dHor(hm), hd = nf(hm, hm < 10 ? 1 : 0);
    $('zSl').value = posFromH(hm); $('zSlL').textContent = `${z.slider}: ${hd} m`;
    $('zChips').innerHTML = [[2, '0', z.beach], [100, '1', z.tower], [EVEREST, '2', z.ever]].map(([v, , lb]) => `<button class="chip ${Math.abs(S.h - v) < 0.6 ? 'on' : ''}" data-act="zh" data-h="${v}">${esc(lb)}</button>`).join('') + secChip('sec2', '🌫️', z.sec.t, S.sec2);
    lab.setReadout(`${f1(d)} km`, z.sub(hd), S.sec2 ? `${z.bent}: ${f1(d * KREF)} km` : '', '#4ea8ff');
    const kind = Math.abs(hm - 2) < 0.6 ? 0 : Math.abs(hm - 100) < 0.6 ? 1 : Math.abs(hm - EVEREST) < 0.6 ? 2 : 'x';
    if (S.sec2) lab.setState({ emo: '🌫️', title: z.sT, lead: z.sL(f1(d), f1(d * KREF)), body: '', extra: '' });
    else lab.setState({ emo: '🔭', title: z.fT(hd, f1(d)), lead: z.fL[kind], body: kind === 'x' ? '' : z.fL.x, extra: '' });
  }
}
render();
