const RBASE = [[50, 383], [150, 402], [240, 418], [298, 445], [322, 480], [345, 515], [400, 540], [500, 548], [600, 540], [700, 525], [790, 516]];
function riverPts(wand) {
  const n = RBASE.length;
  const pts = RBASE.map(([x, y], i) => { const k = i > 0 && i < n - 1 ? 1 : 0; return [x + Math.cos(i * 1.9) * 12 * wand * k, y + Math.sin(i * 1.3 + .6) * 14 * wand * k]; });
  const out = [];
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n - 1, i + 2)];
    for (let k = 0; k < 8; k++) {
      const u = k / 8, u2 = u * u, u3 = u2 * u;
      const f = (a, b, c2, d) => .5 * (2 * b + (-a + c2) * u + (2 * a - 5 * b + 4 * c2 - d) * u2 + (-a + 3 * b - 3 * c2 + d) * u3);
      out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);

  for (const L of nightLights()) { const f = clamp01(a * 1.6 - L.d * .6); if (f <= 0) continue; c.globalAlpha = f; c.fillStyle = '#fff3cc'; ell(c, L.x, L.y, L.r * .6, L.r * .6); c.fill(); }
  c.restore();
}

function drawDay(c, w, h, t) {
  const s = Math.min(w / 900, h / 620), ox = w / 2 - 500 * s, oy = h / 2 - 310 * s;
  V.s = s; V.ox = ox; V.oy = oy;
  const x0 = -ox / s - 30, x1 = (w - ox) / s + 30, y0 = -oy / s - 30, y1 = (h - oy) / s + 30, e = P.era;
  c.save(); c.translate(ox, oy); c.scale(s, s);
  // sky, sun, clouds
  c.fillStyle = lin(c, 0, y0, 0, 400, [[0, '#6db1e6'], [.55, '#a6d5f1'], [1, '#e8f2e2']]); c.fillRect(x0, y0, x1 - x0, 404 - y0);
  c.fillStyle = rad(c, 96, 78, 4, 120, [[0, 'rgba(255,248,205,.95)'], [.25, 'rgba(255,240,180,.4)'], [1, 'rgba(255,240,180,0)']]); ell(c, 96, 78, 120, 120); c.fill();
  c.fillStyle = '#fff6c9'; ell(c, 96, 78, 22, 22); c.fill();
  [[70, 1, 0], [128, .8, 330], [50, 1.1, 640]].forEach(([y, k, off]) => cloud(c, ((t * 7 + off) % 1500) - 250, y, k));
  // far mountains, haze, hills
  const sFar = -(e - 2) * 6, sMid = -(e - 2) * 3;
  for (const [mx, my, hw] of [[470, 240, 110], [900, 235, 120], [40, 215, 110], [1020, 215, 110], [330, 205, 125], [600, 215, 125], [760, 190, 140], [150, 150, 150]]) mountain(c, mx, my, hw, sFar);
  c.fillStyle = lin(c, 0, 320, 0, 400, [[0, 'rgba(232,242,226,0)'], [1, 'rgba(232,242,226,.6)']]); c.fillRect(x0, 320, x1 - x0, 82);
  c.fillStyle = lin(c, 0, 330, 0, 440, [[0, '#8cc27a'], [1, '#5f9b55']]); c.strokeStyle = 'rgba(210,240,170,.7)'; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(x0, 440); c.lineTo(x0, 430 + 0); c.quadraticCurveTo(80 + sMid, 340, 260 + sMid, 385); c.quadraticCurveTo(380 + sMid, 420, 500 + sMid, 372); c.quadraticCurveTo(640 + sMid, 330, 780 + sMid, 380); c.quadraticCurveTo(900 + sMid, 415, x1, 360); c.lineTo(x1, 460); c.closePath(); c.fill(); c.stroke();
  // valley floor
  c.fillStyle = lin(c, 0, 388, 0, y1, [[0, '#98cf72'], [.45, '#7dbc62'], [1, '#5f9c4d']]);
  c.beginPath(); c.moveTo(x0, y1); c.lineTo(x0, 398); c.lineTo(100, 392); c.bezierCurveTo(200, 388, 250, 394, 330, 397); c.bezierCurveTo(430, 402, 520, 392, 640, 396); c.bezierCurveTo(760, 400, 860, 390, x1, 396); c.lineTo(x1, y1); c.closePath(); c.fill();
  c.fillStyle = 'rgba(255,255,190,.08)'; for (const [x, y, rx, ry] of [[220, 470, 140, 22], [560, 500, 160, 20], [820, 590, 120, 18]]) { ell(c, x, y, rx, ry); c.fill(); }
  c.fillStyle = 'rgba(30,80,40,.07)'; for (const [x, y, rx, ry] of [[380, 430, 120, 14], [700, 560, 140, 16], [80, 600, 100, 14]]) { ell(c, x, y, rx, ry); c.fill(); }
  // ground: patches, lake, river, road, railway
  for (const it of ITEMS) if (it.kind === 'patch' && it.p > .01) { c.globalAlpha = clamp01(it.p); c.fillStyle = lin(c, 0, it.y - it.ry, 0, it.y + it.ry, [[0, '#d2bb86'], [1, '#b49c66']]); ell(c, it.x, it.y, it.rx * it.p, it.ry * it.p); c.fill(); c.globalAlpha = 1; }
  RIV = riverPts(Math.pow(1 - clamp01(e / 4), 2));
  const wm = 1.45 - .45 * clamp01(e / 4);
  drawLake(c, t, clamp01(e - 3));
  drawRiver(c, t, wm);
  const road = ITEMS.find((i) => i.kind === 'road'), rail = ITEMS.find((i) => i.kind === 'rail');
  drawRoad(c, road.p, e); drawRail(c, rail.p);
  for (const q of S.placed) if (q.kind === 'road' && q.p > .01) {
    c.save(); c.globalAlpha = clamp01(q.p * 1.5); c.fillStyle = '#c5ad7e'; c.strokeStyle = '#9a8258'; c.lineWidth = 1.4; rr(c, q.x - 55 * q.p, q.y - 6, 110 * q.p, 12, 5); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,245,200,.7)'; c.lineWidth = 1.2; c.setLineDash([7, 8]); c.beginPath(); c.moveTo(q.x - 50 * q.p, q.y); c.lineTo(q.x + 50 * q.p, q.y); c.stroke(); c.setLineDash([]); c.restore();
  }
  // objects, back to front
  const list = [];
  for (const it of ITEMS) if (it.p > .01 && it.kind !== 'patch' && it.kind !== 'road' && it.kind !== 'rail') list.push(it);
  for (const q of S.placed) if (q.p > .01 && q.kind !== 'road') list.push(q);
  for (const r of S.regrown) if (r.p > .01) list.push(r);
  list.sort((a, b) => a.y - b.y);
  for (const it of list) {
    if (it.kind === 'train') { const s = spriteFor(it), k = .8 * clamp01(it.p); c.save(); c.translate(-200 + ((t * 22) % 1400), it.y); c.scale(k, k); c.drawImage(s.cv, -s.ax, -s.ay, s.bw, s.bh); c.restore(); continue; }
    drawSprite(c, it, t);
  }
  if (S.sec === 'beaver') drawBeaver(c, t);
  // sorting: rings
  if (lab.view === 'sort' && P.era > 3.6) {
    for (const r of SORT) {
      const st = S.sorted[r.id], sel = S.sel === r.id;
      if (!st && !sel) continue;
      c.save(); c.lineWidth = 2.6 / s;
      if (st) { c.strokeStyle = GC[r.g]; c.fillStyle = GC[r.g] + '22'; ell(c, r.cx, r.cy, r.rx, r.ry); c.fill(); c.stroke(); }
      else { c.strokeStyle = '#fff'; c.setLineDash([7 / s, 5 / s]); c.lineDashOffset = -t * 14 / s; ell(c, r.cx, r.cy, r.rx, r.ry); c.stroke(); }
      c.restore();
    }
  }
  c.restore();
  // badges stay the same size on screen
  if (lab.view === 'sort' && P.era > 3.6) {
    for (const r of SORT) {
      const st = S.sorted[r.id], sel = S.sel === r.id;
      const bx = clamp(ox + s * r.cx, 14, w - 14), by = clamp(oy + s * (r.cy - r.ry) - 4, 14, h - 14);
      c.save(); c.translate(bx, by);
      if (st) { c.fillStyle = GC[r.g]; c.strokeStyle = '#1a2030'; c.lineWidth = 1.5; ell(c, 0, 0, 10, 10); c.fill(); c.stroke(); c.fillStyle = '#10202a'; c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(st.ok ? '✓' : '•', 0, 1); }
      else {
        const k = 1 + .08 * Math.sin(t * 4 + r.cx), q = sel ? 1.25 : k; c.scale(q, q);
        c.fillStyle = 'rgba(10,12,20,.55)'; ell(c, 0, 1.5, 11, 11); c.fill();
        c.fillStyle = '#fff'; c.strokeStyle = '#4a5578'; c.lineWidth = 1.4; ell(c, 0, 0, 10.5, 10.5); c.fill(); c.stroke();
        c.fillStyle = '#1a2030'; c.font = '900 14px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 0, 1);
      }
      c.restore();
    }
  }
}
function draw(c, w, h, dt, t) {
  step(dt);
  if (P.night < .995) drawDay(c, w, h, t);
  if (P.night > .005) {
    const s = Math.min(w / 900, h / 620), ox = w / 2 - 500 * s, oy = h / 2 - 310 * s;
    c.save(); c.translate(ox, oy); c.scale(s, s);
    drawNight(c, t, P.night, -ox / s - 30, -oy / s - 30, (w - ox) / s + 30, (h - oy) / s + 30);
    c.restore();
  }
  refreshReadout();
}

// --- interaction ---------------------------------------------------------------------------------------------
const cv = $('cv');
const toWorld = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - V.ox) / V.s, (ev.clientY - r.top - V.oy) / V.s]; };
function riverDist(x, y) { let best = 1e9, bi = 0; RIV.forEach((q, i) => { const d = Math.hypot(q[0] - x, (q[1] - y) * 1.2); if (d < best) { best = d; bi = i; } }); return [best, bi]; }
function onWater(x, y) {
  const [d, i] = riverDist(x, y); if (d < riverW(RIV[i][1], 1.45) / 2 + 22) return true;
  return ((x - 822) / 136) ** 2 + ((y - 518) / 52) ** 2 < 1;
}
function say(k) { S.msg = T[lang].mine[k]; sfx.bad(); renderCtrl(); clearTimeout(say.t); say.t = setTimeout(() => { S.msg = ''; if (lab.view === 'mine') renderCtrl(); }, 3000); }
function place(wx, wy) {
  const tm = T[lang].mine, k = S.stamp;
  if (S.placed.filter((q) => !q.back).length >= 26) return say('full');
  if (k === 'bridge') {
    const [d, i] = riverDist(wx, wy);
    if (d > 40) return say('river');
    const q = RIV[i];
    if (S.placed.some((p) => p.kind === 'bridge' && !p.back && Math.hypot(p.x - q[0], p.y - q[1]) < 60)) return say('taken');
    S.placed.push({ kind: 'bridge', x: q[0], y: q[1] + 6, span: Math.round(Math.max(64, riverW(q[1], 1.45) * 1.9 + 30) / 2) * 2, stone: 0, grp: B, p: 0, v: 0 });
  } else {
    if (wy < 420 || wy > 600 || onWater(wx, wy)) return say('land');
    if (S.placed.some((p) => !p.back && Math.hypot(p.x - wx, (p.y - wy) * 1.6) < 46)) return say('taken');
    for (const it of ITEMS) if (it.kind === 'forest' && it.lv[0] > 0 && Math.hypot(it.x - wx, (it.y - wy) * 1.5) < it.sp + 30) S.cleared.add(it.id);
    const n = S.placed.length;
    const o = { x: wx, y: wy, p: 0, v: 0 };
    if (k === 'field') Object.assign(o, { kind: 'field', w: 80, h: 28, pal: ['wheat', 'green', 'plow'][n % 3], grp: M });
    else if (k === 'house') Object.assign(o, { kind: 'house', wall: WALL[n % 4], roof: ROOF[(n + 1) % 4], grp: B });
    else if (k === 'park') Object.assign(o, { kind: 'park', grp: M });
    else if (k === 'plant') Object.assign(o, { kind: 'pines', grp: M });
    else Object.assign(o, { kind: 'road', grp: B });
    S.placed.push(o);
  }
  sfx.snap(); render();
}
function pickSort(wx, wy) {
  let best = null, bd = 1e9;
  const minR = 24 / V.s;
  for (const r of SORT) {
    const rx = Math.max(r.rx, minR), ry = Math.max(r.ry, minR), d = ((wx - r.cx) / rx) ** 2 + ((wy - r.cy) / ry) ** 2;
    if (d <= 1 && d < bd) { bd = d; best = r; }
  }
  if (best) { S.sel = best.id; S.pick = S.sorted[best.id] ? { ...S.sorted[best.id] } : null; sfx.click(); render(); }
}
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const [wx, wy] = toWorld(ev);
  if (lab.view === 'sort') pickSort(wx, wy);
  else if (lab.view === 'mine') place(wx, wy);
});

function setEra(i) { S.era = i; S.moved = true; sfx.tick(); }
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
function startSecret(k) {
  if (!secret.unlocked()) return secret.open();
  if (S.sec === k) { S.sec = null; render(); return; }
  S.sec = k; S.sel = null;
  if (lab.view !== 'time') { lab.view = 'time'; lab.renderChrome(); }
  sfx.click(); render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, d = b.dataset.d;
  if (a === 'pred') { S.pred = +d; (+d === T[lang].pred.ok ? sfx.good : sfx.bad)(); S.era = 0; S.moved = false; render(); showStage(); return; }
  if (a === 'era') { setEra(+d); render(); return; }
  if (a === 'pick') {
    const r = SORT.find((x) => x.id === S.sel); if (!r || S.sorted[r.id]) return;
    const ok = r.g === d; S.pick = { ok, chose: d }; S.sorted[r.id] = { ok, first: ok, chose: d }; (ok ? sfx.good : sfx.bad)(); render(); return;
  }
  if (a === 'ok') { S.sel = null; S.pick = null; sfx.click(); render(); return; }
  if (a === 'again') { S.sorted = {}; S.sel = null; S.pick = null; sfx.click(); render(); return; }
  if (a === 'stamp') { S.stamp = d; sfx.tick(); render(); return; }
  if (a === 'wild') {
    for (const q of S.placed) if (!q.back && ['field', 'park', 'pines'].includes(q.kind)) { q.back = true; S.regrown.push({ kind: 'forest', seed: 30 + S.regrown.length, sp: 26, hill: 0, x: q.x, y: q.y, grp: N, p: 0, v: 0 }); }
    for (const id of [...S.cleared]) { const it = ITEMS.find((i) => i.id === id); if (!S.placed.some((q) => !q.back && ['house', 'road', 'bridge'].includes(q.kind) && Math.hypot(q.x - it.x, (q.y - it.y) * 1.4) < 60)) S.cleared.delete(id); }
    S.wild = true; sfx.push(); render(); return;
  }
  if (a === 'sec') { startSecret(b.dataset.k); return; }
  if (a === 'bvagain') { P.bv = 0; sfx.click(); return; }
  if (a === 'secoff') { S.sec = null; render(); }
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'vlEra') return;
  const i = +ev.target.value;
  if (i === S.era && S.moved) return;
  S.era = i; S.moved = true; S.sec = null; sfx.tick();
  document.querySelectorAll('[data-act=era]').forEach((b) => b.classList.toggle('on', +b.dataset.d === i));
  refresh();
});

// --- controls, state card, readout ---------------------------------------------------------------------------
function secretsRow(t) {
  const un = secret.unlocked();
  return `<div class="vl-sec"><div class="vl-row" style="margin-top:0">${[['beaver', '🦫', t.sec.a[0]], ['night', '🌃', t.sec.b[0]]].map(([k, e, name]) =>
    `<button class="chip secret ${un ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${un ? e : '🔒'} ${esc(name)}</button>`).join('')}</div></div>`;
}
function renderCtrl() {
  const t = T[lang], v = lab.view; let h = '';
  if (S.sec) {
    h += `<div class="vl-hint">${esc(S.sec === 'beaver' ? t.sec.aSt[2] : t.sec.bSt[2])}</div><div class="vl-row">`;
    h += S.sec === 'beaver' ? `<button class="chip" data-act="bvagain">${esc(t.sec.again)}</button>` : '';
    h += `<button class="chip" data-act="secoff">${esc(S.sec === 'night' ? t.sec.day : '☀️ ' + t.eras[4])}</button></div>`;
  } else if (v === 'time') {
    if (S.pred === null) {
      h += `<div class="vl-q">${esc(t.pred.q)}</div><div class="vl-opts">${t.pred.opts.map((o, i) => `<button class="chip" data-act="pred" data-d="${i}">${esc(o)}</button>`).join('')}</div>`;
    } else {
      h += `<div class="vl-hint"><b>${esc(t.slide)}</b></div><input type="range" class="big" id="vlEra" min="0" max="4" step="1" value="${S.era}" aria-label="${esc(t.slide)}">`;
      h += `<div class="vl-opts">${t.eras.map((n, i) => `<button class="chip ${i === S.era ? 'on' : ''}" data-act="era" data-d="${i}">${esc(n)}</button>`).join('')}</div>`;
    }
  } else if (v === 'sort') {
    const r = SORT.find((x) => x.id === S.sel), ts = t.sort, done = Object.keys(S.sorted).length === SORT.length && !S.sel;
    if (r) {
      const st = S.sorted[r.id];
      h += `<div class="vl-q">${esc(ts.q(ts.names[r.id]))}</div><div class="vl-opts">${['n', 'm', 'b'].map((g) => `<button class="chip ${st && g === r.g ? 'glow' : ''}" data-act="pick" data-d="${g}" ${st ? 'disabled' : ''} style="${st && g === r.g ? 'opacity:1;' : ''}"><i class="vl-dot" style="background:${GC[g]}"></i>${esc(t.grp[g])}</button>`).join('')}</div>`;
      if (st) h += `<div class="vl-why ${st.ok ? 'ok' : 'bad'}"><b>${esc(st.ok ? ts.right : ts.wrong)}</b>${esc(ts.why[r.id])}</div><div class="vl-row"><button class="btn" data-act="ok">${esc(ts.ok)}</button></div>`;
    } else if (done) h += `<div class="vl-row" style="margin-top:0"><button class="btn" data-act="again">${esc(ts.again)}</button></div>`;
    else h += `<div class="vl-hint">${esc(ts.lead)}</div>`;
  } else {
    const tm = t.mine, keys = [['field', '🌾'], ['house', '🏠'], ['bridge', '🌉'], ['park', '🌳'], ['road', '🛣️'], ['plant', '🌲']];
    h += `<div class="vl-opts">${keys.map(([k, e]) => `<button class="chip ${S.stamp === k ? 'on' : ''}" data-act="stamp" data-d="${k}">${e} ${esc(tm.tools[k])}</button>`).join('')}</div>`;
    h += `<div class="vl-row"><button class="chip" data-act="wild">${esc(tm.wild)}</button></div><div class="vl-msg">${esc(S.msg)}</div>`;
  }
  h += secretsRow(t);
  $('ctrlBody').innerHTML = `<div class="vl-ctl">${h}</div>`;
}
function stateCard() {
  const t = T[lang], v = lab.view;
  if (S.sec === 'beaver') return t.sec.aSt;
  if (S.sec === 'night') return t.sec.bSt;
  if (v === 'time') {
    if (S.pred === null) return [t.think[0], t.eras[4], t.think[1], t.think[2]];
    if (!S.moved) return [S.pred === t.pred.ok ? '✅' : '🤔', S.pred === t.pred.ok ? t.pred.right : t.pred.wrong, t.pred.lead, t.pred.next];
    return [t.era[S.era][0], t.eras[S.era], t.era[S.era][1], t.era[S.era][2]];
  }
  if (v === 'sort') {
    const ts = t.sort, n = Object.keys(S.sorted).length;
    if (n === SORT.length && !S.sel) { const k = Object.values(S.sorted).filter((x) => x.first).length; return ts.done(k, SORT.length); }
    return [ts.emo, ts.title, ts.lead, ts.body];
  }
  const tm = t.mine, n = S.placed.filter((q) => !q.back).length;
  if (S.wild && n === 0 && S.regrown.length) return [tm.wildSt[0], tm.wildSt[1], tm.wildSt[2], tm.body];
  if (!n && !S.cleared.size) return ['🛠️', tm.title, tm.start, tm.body];
  const deer = ITEMS.filter((i) => i.kind === 'deer' && i.lv[0] > 0 && itemTarget(i) > 0).length;
  return ['🛠️', tm.title, `${tm.changes(n)} ${deer ? tm.deerYes : tm.deerNo}`, tm.body];
}
function refreshState() {
  const t = T[lang], v = lab.view, c = stateCard();
  let extra = '';
  if (v === 'sort' && !S.sec) extra = `<div class="vl-leg">${['n', 'm', 'b'].map((g) => `<span><i style="background:${GC[g]}"></i><b>${esc(t.grp[g])}</b> · ${esc(t.gdesc[g])}</span>`).join('')}</div>`;
  lab.setState({ emo: c[0], title: c[1], lead: c[2], body: c[3] ?? '', extra });
  const key = S.sec === 'beaver' ? 'mine' : v;
  lab.setFacts(t.facts[key]);
}
let lastRO = '';
function refreshReadout() {
  const t = T[lang], v = lab.view;
  let val, sub, pill;
  if (v === 'sort' && !S.sec) { val = esc(t.sort.prog(Object.keys(S.sorted).length, SORT.length)); sub = ''; pill = ''; }
  else {
    const [n, m, b] = counts(); val = `🌿 ${n} · 🌾 ${m} · 🏠 ${b}`;
    sub = v === 'mine' && !S.sec ? t.mine.title : t.eras[eraIdx()]; pill = '';
  }
  const key = val + sub + lang; if (key === lastRO) return; lastRO = key;
  lab.setReadout(val, sub, pill);
}
function refresh() { refreshState(); lastRO = ''; refreshReadout(); }
function render() {
  document.body.dataset.v = lab.view;
  cv.classList.toggle('vl-tap', (lab.view === 'sort' || lab.view === 'mine') && !S.sec);
  renderCtrl(); refresh();
}

canvasLoop(cv, draw);
render();
</script>
