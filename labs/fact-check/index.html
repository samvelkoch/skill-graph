$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'clues' || S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - OX) / SC, y = (ev.clientY - r.top - OY) / SC;
  const i = S.hit.findIndex(([px, py]) => Math.abs(x - px) < CW / 2 + 4 && Math.abs(y - py) < CH / 2 + 4);
  if (i >= 0 && i !== S.sel) { S.sel = i; sfx.tick(); render(); }
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const goView = (v) => { if (lab.view !== v) $('views').querySelector(`[data-view="${v}"]`)?.click(); };
const resetClues = () => { S.rate = [null, null, null, null, null]; S.cl = [0, 1, 2, 3, 4].map(() => [false, false, false, false]); S.checked = false; S.sel = 0; };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'sel') { S.sel = i; sfx.tick(); }
  else if (act === 'clue') { S.cl[S.sel][i] = !S.cl[S.sel][i]; sfx.tick(); }
  else if (act === 'rate') { S.rate[S.sel] = LV[i]; sfx.click(); }
  else if (act === 'check') { if (S.rate.every(Boolean)) { S.checked = true; sfx.good(); showStage(); } }
  else if (act === 'again1') { resetClues(); sfx.click(); }
  else if (act === 'pred') { S.pred = b.dataset.a; (S.pred === ANS[1 + S.r2] ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'next2') { S.r2 = 1; S.pred = null; sfx.click(); }
  else if (act === 'again2') { S.r2 = 0; S.pred = null; sfx.click(); }
  else if (act === 'lat') { S.lat = { pick: i, t: 0, run: true, done: false }; sfx.click(); showStage(); }
  else if (act === 'replay') { S.lat = { pick: S.lat.pick, t: 0, run: true, done: false }; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k; if (!secret.unlocked()) return secret.open();
    if (S.sec === k) { S.sec = null; sfx.click(); }
    else { S.sec = k; if (k === 'fake') S.fake = [false, false, false]; else { S.tr = 0; S.trP = 0; } sfx.click(); goView(SECV[k]); }
  }
  else if (act === 'fake') { S.fake[i] = !S.fake[i]; sfx.snap(); }
  else if (act === 'fakeReset') { S.fake = [false, false, false]; sfx.click(); }
  else if (act === 'trace') { S.tr = Math.min(3, S.tr + 1); sfx.snap(); }
  else if (act === 'traceAgain') { S.tr = 0; S.trP = 0; sfx.click(); }
  render();
});

// --- one render per change ---------------------------------------------------------------------------------------
function secChips(t) {
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('fake', '🎭') + sc('trace', '🔗');
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, fv = sec ? SECV[sec] : v;
  document.body.dataset.v = fv;
  $('sClues').style.display = !sec && v === 'clues' ? '' : 'none';
  $('sMany').style.display = !sec && v === 'many' ? '' : 'none';
  $('sLat').style.display = !sec && v === 'lateral' ? '' : 'none';
  $('sSec').style.display = sec ? '' : 'none';
  secChips(t);
  lab.setFacts(t.facts[fv]);
  if (sec === 'fake') renderFake(t); else if (sec === 'trace') renderTrace(t);
  else if (v === 'clues') renderClues(t); else if (v === 'many') renderMany(t); else renderLat(t);
}
const gl = (k) => lab.setGlow(k);

function renderClues(t) {
  gl('rgba(224, 176, 80, .26)');
  const r = t.r[0], d = RD[0], k = S.rate.filter(Boolean).length, sel = S.sel;
  let h = '';
  if (!S.checked) {
    h += `<div class="fc-lbl">${esc(t.pickSrc)}</div><div class="chips">${r.s.map((s, i) => `<button class="chip ${i === sel ? 'on' : ''}" data-act="sel" data-i="${i}" aria-label="${esc(s.n)}">${d.emo[i]}${S.rate[i] ? ` <span style="color:${COL[S.rate[i]]}">●</span>` : ''}</button>`).join('')}</div>`;
    h += `<div class="fc-lbl">${d.emo[sel]} ${esc(r.s[sel].n)}</div><div class="chips">${t.clueN.map((n, i) => `<button class="chip ${S.cl[sel][i] ? 'on' : ''}" data-act="clue" data-i="${i}">${['👤', '🧪', '🎯', '📅'][i]} ${esc(n)}</button>`).join('')}</div>`;
    const open = t.clueN.map((n, i) => S.cl[sel][i] ? `<div class="fc-clue"><b>${['👤', '🧪', '🎯', '📅'][i]} ${esc(n)}</b> ${esc(r.s[sel].c[i])}</div>` : '').join('');
    h += open || `<div class="fc-hint">${esc(t.clueHint)}</div>`;
    h += `<div class="fc-lbl">${esc(t.trustLbl)}</div><div class="chips fc-rate">${t.trust.map((n, i) => `<button class="chip ${S.rate[sel] === LV[i] ? `on ${LV[i]}` : ''}" data-act="rate" data-i="${i}">${n}</button>`).join('')}</div>`;
    h += `<div class="fc-end"><span class="fc-hint">${esc(k === 5 ? '' : t.needAll)} ${esc(t.rated(k, 5))}</span><button class="btn" data-act="check" ${k < 5 ? 'disabled' : ''}>${esc(t.check)}</button></div>`;
  } else {
    h += r.s.map((s, i) => `<div class="fc-row"><span class="e">${d.emo[i]}</span><div><b>${esc(s.n)}</b> <span class="fc-tag ${d.exp[i]}">${esc(t.c1.exp(t.trust[LV.indexOf(d.exp[i])]))}</span>${S.rate[i] !== d.exp[i] ? ` <span class="fc-hint">${esc(t.c1.you(t.trust[LV.indexOf(S.rate[i])]))}</span>` : ' ✅'}<br>${esc(s.w)}</div></div>`).join('');
    h += `<div class="fc-end"><span></span><button class="btn ghost" data-act="again1">${esc(t.again)}</button></div>`;
  }
  $('sClues').innerHTML = h;
  if (!S.checked) {
    lab.setReadout('?', t.meter, t.rated(k, 5), '#e0b050');
    lab.setState({ emo: '🔎', title: t.c1.t0, lead: t.c1.l0, body: '', extra: '' });
  } else {
    const m = S.rate.filter((x, i) => x === d.exp[i]).length, pct = Math.round(credOf(0, true) * 100);
    lab.setReadout(t.pct(pct), t.meter, t.c1.match(m), '#e0b050');
    lab.setState({ emo: m === 5 ? '🕵️' : '🔎', title: t.c1.tk(m), lead: t.c1.lk, body: '', extra: '' });
  }
}

function renderMany(t) {
  gl('rgba(95, 168, 160, .26)');
  const ri = 1 + S.r2, r = t.r[ri], d = RD[ri], pred = S.pred, ans = ANS[ri];
  let h = `<div class="fc-lbl">${esc(t.m.round(S.r2 + 1))}</div>`;
  if (pred === null) {
    h += `<div class="fc-q">${esc(t.m.q)}</div><div class="fc-pick">${['true', 'false', 'unclear'].map((a) => `<button class="chip" data-act="pred" data-a="${a}">${esc(t.m.opt[a])}</button>`).join('')}</div>`;
    lab.setReadout('?', t.meter, '', '#5fa8a0');
    lab.setState({ emo: '🧵', title: t.m.t0, lead: t.m.l0, body: '', extra: '' });
  } else {
    const pct = Math.round(credOf(ri, true) * 100), n = indepOf(ri);
    h += `<div class="fc-hint">${esc(t.m.legend)}</div>`;
    h += r.s.map((s, i) => `<div class="fc-row"><span class="e">${d.emo[i]}</span><div><b>${esc(s.n)}</b> <span class="fc-tag ${d.st[i] > 0 ? 'yes' : 'no'}">${esc(t.m.says[d.st[i] > 0 ? 0 : 1])}</span>${d.copyOf && d.copyOf[i] !== null ? ` <span class="fc-tag mid">${esc(t.m.copyOf)}</span>` : ''}<br>${esc(s.q)}</div></div>`).join('');
    h += `<div class="fc-end"><span></span><button class="btn" data-act="${S.r2 === 0 ? 'next2' : 'again2'}">${esc(S.r2 === 0 ? t.m.nextR : t.m.againR)}</button></div>`;
    lab.setReadout(t.pct(pct), t.meter, t.m.indep(n), '#5fa8a0');
    lab.setState({ emo: pred === ans ? '✅' : '🤔', title: pred === ans ? t.m.right : t.m.wrong(t.m.opt[ans].toLowerCase()), lead: t.m.leads[S.r2], body: '', extra: '' });
  }
  $('sMany').innerHTML = h;
}

function renderLat(t) {
  gl('rgba(143, 127, 208, .26)');
  const lt = t.lat, L = S.lat; let h = '';
  const busy = L.run;
  h += `<div class="fc-q">${esc(lt.q)}</div>`;
  h += lt.opts.map((o, i) => `<button class="fc-opt ${L.pick === i ? 'on' : ''}" data-act="lat" data-i="${i}" ${busy ? 'disabled' : ''}>${esc(o)}</button>`).join('');
  if (L.done) h += `<div class="fc-end"><span></span><button class="btn ghost" data-act="replay">${esc(lt.replay)}</button></div>`;
  $('sLat').innerHTML = h;
  if (L.pick === null) {
    lab.setReadout('?', lt.tabs, '', '#8f7fd0');
    lab.setState({ emo: '🪟', title: lt.t0, lead: lt.l0, body: '', extra: '' });
  } else if (!L.done) {
    lab.setReadout('…', lt.tabs, '', '#8f7fd0');
    lab.setState({ emo: '👀', title: lt.run, lead: lt.runL, body: '', extra: '' });
  } else {
    lab.setReadout('4', lt.tabs, lt.bad, '#8f7fd0');
    lab.setState({ emo: L.pick === 1 ? '✅' : '🤔', title: L.pick === 1 ? lt.right : lt.wrong, lead: lt.lead, body: lt.body, extra: `<div class="fine">${esc(lt.fine)}</div>` });
  }
}

function renderFake(t) {
  gl('rgba(224, 176, 80, .26)');
  const f = t.fake, k = S.fake.filter(Boolean).length, pct = Math.round(credOf(0, true) * 100);
  $('sSec').innerHTML = `<div class="fc-lbl">${esc(t.r[0].s[1].n)}</div><div class="chips">${f.btns.map((b, i) => `<button class="chip ${S.fake[i] ? 'on' : ''}" data-act="fake" data-i="${i}">${esc(b)}</button>`).join('')}<button class="chip" data-act="fakeReset">${esc(f.reset)}</button></div>`;
  lab.setReadout(t.pct(pct), t.meter, f.tk(k), '#e0b050');
  lab.setState(k === 0 ? { emo: '🎭', title: f.t0, lead: f.l0, body: '', extra: '' }
    : k === 3 ? { emo: '🕵️', title: f.tAll, lead: f.lAll, body: '', extra: '' } : { emo: '🎭', title: f.tk(k), lead: f.lk, body: '', extra: '' });
}

function renderTrace(t) {
  gl('rgba(95, 168, 160, .26)');
  const tr = t.trace, k = S.tr;
  $('sSec').innerHTML = `<div class="fc-end" style="margin-top:0"><button class="btn" data-act="trace" ${k >= 3 ? 'disabled' : ''}>${esc(tr.go)}</button><button class="chip" data-act="traceAgain">${esc(tr.again)}</button></div>`;
  lab.setReadout(k >= 3 ? '1' : '4', '', k >= 3 ? t.m.indep(1) : '', '#5fa8a0');
  lab.setState(k === 0 ? { emo: '🔗', title: tr.t0, lead: tr.l0, body: '', extra: '' }
    : k >= 3 ? { emo: '🏛️', title: tr.tEnd, lead: tr.lEnd, body: '', extra: '' } : { emo: '🔗', title: tr.ts[k - 1], lead: tr.l0, body: '', extra: '' });
}
render();
</script>
</body>
</html>
