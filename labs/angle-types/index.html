const lay = (w, h, oy = 0, cmp = false) => { const u = cmp ? Math.min(0.44 * w, h / 1.5) : Math.min(0.48 * w, h / 1.3); return { u, X: w * 0.47, Y: oy + h / 2 + 0.28 * u }; };

// --- rounds of the guess view --------------------------------------------------------------------------------
function newRounds() {
  const kinds = shuf(['acute', 'obtuse', 'right', Math.random() < 0.5 ? 'acute' : 'obtuse']);
  const sk = shuf(['short', 'long', Math.random() < 0.5 ? 'short' : 'long', Math.random() < 0.5 ? 'short' : 'long']);
  const cl = kinds.map((k, i) => ({ kind: 'cls', cls: k, th: k === 'acute' ? rnd(20, 65) : k === 'obtuse' ? rnd(115, 165) : 90, sk: sk[i] }));
  const cmp = (long, short) => {
    let a = { th: long + rnd(-3, 3), sk: 'long' }, b = { th: short + rnd(-3, 3), sk: 'short' };
    if (Math.random() < 0.5) [a, b] = [b, a];
    return { kind: 'cmp', a, b, ans: a.th > b.th ? '1' : b.th > a.th ? '2' : 'same' };
  };
  const th = rnd(50, 70), sa = Math.random() < 0.5;
  const same = { kind: 'cmp', a: { th, sk: sa ? 'long' : 'short' }, b: { th, sk: sa ? 'short' : 'long' }, ans: 'same' };
  G.rounds = [cl[0], cl[1], cmp(42, 68), cl[2], cl[3], cmp(95, 55), same];
  G.n = G.rounds.length; G.i = 0; G.right = []; startRound();
}
function startRound() { G.pick = null; G.rev = 0; G.d1 = 0; G.d2 = 0; }
const curRound = () => G.rounds[Math.min(G.i, G.n - 1)];

// --- drawing: scene ------------------------------------------------------------------------------------------
function scene(c, x, y, w, h, gy, grid) {
  c.save(); c.beginPath(); c.roundRect(x, y, w, h, 18); c.clip();
  c.fillStyle = lin(c, 0, y, 0, y + h, [[0, '#123845'], [0.55, '#1a4d47'], [1, '#235c43']]); c.fillRect(x, y, w, h);
  const g = c.createRadialGradient(x + w * 0.2, y + h * 0.14, 0, x + w * 0.2, y + h * 0.14, w * 0.7);
  g.addColorStop(0, 'rgba(255,230,160,.30)'); g.addColorStop(1, 'rgba(255,230,160,0)'); c.fillStyle = g; c.fillRect(x, y, w, h);
  if (grid) {
    c.strokeStyle = 'rgba(190,230,220,.07)'; c.lineWidth = 1; c.beginPath();
    for (let gx = x + 14; gx < x + w; gx += 28) { c.moveTo(gx, y); c.lineTo(gx, y + h); }
    for (let gv = y + 14; gv < y + h; gv += 28) { c.moveTo(x, gv); c.lineTo(x + w, gv); }
    c.stroke();
  }
  if (gy != null) {
    c.strokeStyle = '#3f8a52'; c.lineWidth = 3; c.lineCap = 'round';
    for (const [rx, k] of [[0.05, 1], [0.08, -0.7], [0.94, 1], [0.91, -0.8], [0.97, 0.6]]) {
      c.beginPath(); c.moveTo(x + w * rx, gy + 6); c.quadraticCurveTo(x + w * rx + 8 * k, gy - h * 0.12, x + w * rx + 16 * k, gy - h * 0.2); c.stroke();
    }
    c.fillStyle = lin(c, 0, gy, 0, y + h, [[0, '#cdb97d'], [1, '#85703f']]); c.fillRect(x, gy, w, y + h - gy);
    c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(x, gy, w, 2);
    c.strokeStyle = '#79c06a'; c.lineWidth = 2;
    for (let i = 0; i < 9; i++) { const gx = x + w * (0.06 + i * 0.113 + (i % 3) * 0.01); c.beginPath(); c.moveTo(gx, gy + 2); c.lineTo(gx - 3, gy - 7); c.moveTo(gx, gy + 2); c.lineTo(gx + 3, gy - 8); c.stroke(); }
  }
  c.restore();
}

// canvas text always on a dark rounded pill, kept inside the canvas
function pill(c, txt, x, y, o = {}) {
  const size = o.size || 13;
  c.save(); c.globalAlpha = 1; c.font = `800 ${size}px Nunito, sans-serif`;
  const tw = c.measureText(txt).width + 16, ph = size + 10;
  const px = clamp(x, tw / 2 + 4, Math.max(tw / 2 + 4, W - tw / 2 - 4)), py = clamp(y, ph / 2 + 4, Math.max(ph / 2 + 4, H - ph / 2 - 4));
  c.fillStyle = o.bg || 'rgba(10,14,28,.84)'; c.beginPath(); c.roundRect(px - tw / 2, py - ph / 2, tw, ph, ph / 2); c.fill();
  if (o.ring) { c.strokeStyle = o.ring; c.lineWidth = 2; c.stroke(); }
  c.fillStyle = o.fg || '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, px, py + 1);
  c.restore();
}

// --- drawing: the crocodile ------------------------------------------------------------------------------------
// hinge at (X, Y); the lower jaw lies along +x, the upper jaw is turned up by th degrees; S is the length of the jaws
function jawPath(c, u, S, wid) {
  const yb = 0.085 * u + 0.07 * u * wid, nh = 0.05 * u + 0.045 * u * wid;
  c.beginPath(); c.moveTo(-0.12 * u, 0);
  c.bezierCurveTo(-0.17 * u, -0.08 * u, -0.08 * u, -0.19 * u, 0.06 * u, -0.2 * u);
  c.bezierCurveTo(0.16 * u, -0.225 * u, 0.27 * u, -yb - 0.01 * u, 0.38 * u, -yb);
  c.lineTo(S - 0.1 * u, -nh);
  c.bezierCurveTo(S - 0.03 * u, -nh - 0.004 * u, S + 0.025 * u, -nh * 0.85, S + 0.025 * u, -nh * 0.3);
  c.quadraticCurveTo(S + 0.025 * u, 0, S, 0);
  c.closePath();
  return { yb, nh };
}
function drawCroc(c, p) {
  const { X, Y, u, S, wid, th, t } = p, a = th * D2R, OUT = '#1d5230', IVORY = '#fffbea';
  c.save(); c.translate(X, Y); c.lineJoin = 'round'; c.lineCap = 'round'; c.lineWidth = 2; c.strokeStyle = OUT;
  // shadow on the ground
  c.fillStyle = 'rgba(0,0,0,.30)'; c.beginPath(); c.ellipse((S - 0.55 * u) / 2, 0.31 * u, Math.max(0, (S + 0.65 * u) / 2), Math.max(0, 0.045 * u), 0, 0, 7); c.fill();
  c.save(); c.scale(0.6, 1); // shorter tail
  // legs behind the body
  c.fillStyle = lin(c, 0, 0.08 * u, 0, 0.3 * u, [[0, '#4f9f4a'], [1, '#2f7a3a']]);
  for (const lx of [-0.37 * u, -0.78 * u]) {
    c.beginPath(); c.roundRect(lx, 0.07 * u, 0.15 * u, 0.235 * u, 0.05 * u); c.fill(); c.stroke();
    c.fillStyle = IVORY;
    for (let k = 0; k < 3; k++) { c.beginPath(); c.arc(lx + 0.03 * u + k * 0.045 * u, 0.3 * u, Math.max(0, 0.012 * u), 0, 7); c.fill(); }
    c.fillStyle = lin(c, 0, 0.08 * u, 0, 0.3 * u, [[0, '#4f9f4a'], [1, '#2f7a3a']]);
  }
  // body and tail
  c.beginPath(); c.moveTo(-0.06 * u, -0.11 * u);
  c.bezierCurveTo(-0.3 * u, -0.19 * u, -0.58 * u, -0.17 * u, -0.8 * u, -0.08 * u);
  c.bezierCurveTo(-0.9 * u, -0.04 * u, -0.93 * u, -0.1 * u, -0.98 * u, -0.12 * u);
  c.bezierCurveTo(-0.97 * u, -0.02 * u, -0.85 * u, 0.1 * u, -0.6 * u, 0.17 * u);
  c.bezierCurveTo(-0.4 * u, 0.22 * u, -0.2 * u, 0.22 * u, -0.04 * u, 0.17 * u);
  c.closePath();
  c.fillStyle = lin(c, 0, -0.19 * u, 0, 0.22 * u, [[0, '#74c660'], [0.55, '#4a9e48'], [1, '#3d8a43']]); c.fill();
  c.save(); c.clip();
  c.fillStyle = lin(c, 0, 0.03 * u, 0, 0.22 * u, [[0, 'rgba(215,236,160,0)'], [0.45, 'rgba(215,236,160,.85)'], [1, '#e3f0b4']]); c.fillRect(-1.1 * u, 0.03 * u, 1.2 * u, 0.3 * u);
  c.restore(); c.stroke();
  c.fillStyle = 'rgba(30,100,50,.55)';
  for (let i = 0; i < 7; i++) {
    const x = -0.14 * u - i * 0.105 * u, tt = (-x - 0.06 * u) / (0.74 * u), y = -0.11 * u - 0.06 * u * Math.sin(Math.PI * tt) + 0.03 * u * tt + 0.032 * u;
    c.beginPath(); c.ellipse(x, y, Math.max(0, 0.034 * u), Math.max(0, 0.02 * u), -0.15, 0, 7); c.fill();
  }
  c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-0.12 * u, -0.145 * u); c.bezierCurveTo(-0.3 * u, -0.19 * u, -0.5 * u, -0.18 * u, -0.66 * u, -0.14 * u); c.stroke();
  c.strokeStyle = OUT; c.lineWidth = 2;
  c.restore();
  // the mouth inside: fades away from the hinge
  if (th > 0.3) {
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, Math.max(0, S), 0, -a, true); c.closePath();
    const g = c.createRadialGradient(0, 0, 0, 0, 0, Math.max(1, S));
    g.addColorStop(0, '#4a0f22'); g.addColorStop(0.45, 'rgba(140,45,70,.92)'); g.addColorStop(1, 'rgba(170,70,90,0)');
    c.fillStyle = g; c.fill();
  }
  // lower jaw
  c.beginPath(); c.moveTo(-0.12 * u, 0); c.lineTo(S + 0.015 * u, 0);
  c.quadraticCurveTo(S + 0.03 * u, 0.045 * u, S - 0.04 * u, 0.065 * u);
  c.bezierCurveTo(S * 0.7, 0.085 * u, 0.35 * u, 0.12 * u, 0.1 * u, 0.14 * u);
  c.bezierCurveTo(-0.02 * u, 0.17 * u, -0.14 * u, 0.14 * u, -0.12 * u, 0);
  c.closePath();
  c.fillStyle = lin(c, 0, 0, 0, 0.15 * u, [[0, '#7cc866'], [1, '#d9eba6']]); c.fill(); c.stroke();
  const open = clamp(th / 12, 0, 1);
  if (open > 0) {
    c.globalAlpha = open; c.fillStyle = '#e0788c'; c.beginPath(); c.roundRect(-0.06 * u, 0, S - 0.02 * u, 0.034 * u, 0.017 * u); c.fill();
    c.fillStyle = IVORY; c.strokeStyle = 'rgba(60,60,40,.5)'; c.lineWidth = 1;
    for (let x = 0.24 * u; x < S - 0.07 * u; x += 0.085 * u) { c.beginPath(); c.moveTo(x - 0.014 * u, 0); c.lineTo(x + 0.014 * u, 0); c.lineTo(x, -0.04 * u); c.closePath(); c.fill(); c.stroke(); }
    c.globalAlpha = 1; c.strokeStyle = OUT; c.lineWidth = 2;
  }
  // upper jaw, turned up by th
  c.save(); c.rotate(-a);
  const { yb, nh } = jawPath(c, u, S, wid);
  c.fillStyle = lin(c, 0, -0.22 * u, 0, 0, [[0, '#a6dc78'], [0.5, '#62b455'], [1, '#478f45']]); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.ellipse(0.3 * u, -yb * 0.92, Math.max(0, 0.13 * u), Math.max(0, 0.016 * u), -0.05, 0, 7); c.fill();
  c.fillStyle = 'rgba(25,80,40,.4)';
  for (let x = 0.5 * u; x < S - 0.14 * u; x += 0.09 * u) { const yy = lerp(yb, nh, (x - 0.38 * u) / Math.max(1, S - 0.48 * u)); c.beginPath(); c.arc(x, -yy + 0.022 * u, Math.max(0, 0.009 * u), 0, 7); c.fill(); }
  c.fillStyle = IVORY; c.strokeStyle = 'rgba(60,60,40,.5)'; c.lineWidth = 1;
  for (let x = 0.16 * u; x < S - 0.05 * u; x += 0.085 * u) { c.beginPath(); c.moveTo(x - 0.014 * u, 0); c.lineTo(x + 0.014 * u, 0); c.lineTo(x, 0.04 * u); c.closePath(); c.fill(); c.stroke(); }
  if (wid < 0.8) { // the gharial's knob on the tip of the snout
    c.fillStyle = lin(c, 0, -nh - 0.06 * u, 0, -nh, [[0, '#8fd36a'], [1, '#4f9f47']]); c.strokeStyle = OUT; c.lineWidth = 2;
    c.beginPath(); c.ellipse(S - 0.04 * u, -nh - 0.012 * u, Math.max(0, 0.05 * u), Math.max(0, 0.034 * u), 0, 0, 7); c.fill(); c.stroke();
  }
  c.fillStyle = '#1d3a28'; c.beginPath(); c.ellipse(S - 0.035 * u, -nh * (wid < 0.8 ? 1.25 : 0.62), Math.max(0, 0.014 * u), Math.max(0, 0.009 * u), 0, 0, 7); c.fill();
  // eye and cheek
  const ex = 0.17 * u, ey = -0.125 * u, er = 0.054 * u;
  c.fillStyle = 'rgba(255,130,130,.35)'; c.beginPath(); c.ellipse(0.06 * u, -0.045 * u, Math.max(0, 0.05 * u), Math.max(0, 0.026 * u), 0, 0, 7); c.fill();
  c.strokeStyle = OUT; c.lineWidth = 2; c.fillStyle = '#fff'; c.beginPath(); c.arc(ex, ey, Math.max(0, er), 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#18222c'; c.beginPath(); c.arc(ex + er * 0.25, ey + er * 0.1, Math.max(0, er * 0.58), 0, 7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + er * 0.05, ey - er * 0.22, Math.max(0, er * 0.22), 0, 7); c.fill();
  if ((t % 4.3) < 0.14) { c.fillStyle = '#62b455'; c.beginPath(); c.arc(ex, ey, Math.max(0, er + 1), 0, 7); c.fill(); c.strokeStyle = OUT; c.beginPath(); c.moveTo(ex - er, ey); c.lineTo(ex + er, ey); c.stroke(); }
  c.strokeStyle = 'rgba(25,80,40,.7)'; c.lineWidth = 2.5; c.beginPath(); c.arc(ex, ey - er * 0.2, Math.max(0, er * 1.18), Math.PI * 1.1, Math.PI * 1.9); c.stroke();
  c.restore();
  c.restore();
  return { kx: X + S * 0.86 * Math.cos(a) + 0.05 * u * Math.sin(a), ky: Y - S * 0.86 * Math.sin(a) + 0.05 * u * Math.cos(a) };
}

// the angle mark: a small square for a right angle, an arc for the others
function drawMark(c, X, Y, deg, r, col, label, size) {
  if (deg < 0.5) return;
  const a = deg * D2R;
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  if (Math.abs(deg - 90) < 0.5) {
    const s = r * 0.7;
    c.fillStyle = rgba(col, 0.28); c.strokeStyle = col; c.lineWidth = 3;
    c.beginPath(); c.rect(X, Y - s, s, s); c.fill(); c.stroke();
  } else {
    c.fillStyle = rgba(col, 0.24); c.strokeStyle = col; c.lineWidth = 3.5;
    c.beginPath(); c.moveTo(X, Y); c.arc(X, Y, Math.max(0, r), 0, -a, true); c.closePath(); c.fill();
    c.beginPath(); c.arc(X, Y, Math.max(0, r), 0, -a, true); c.stroke();
  }
  c.restore();
  const rl = r + (size || 13) + 12 + (deg < 35 ? 14 : 0);
  pill(c, label, X + rl * Math.cos(a / 2), Y - rl * Math.sin(a / 2), { size: size || 13, ring: col });
}

// a sheet of paper with a folded corner; its square corner sits on the hinge (side 1: to the right, -1: to the left)
function drawPaper(c, X, Y, P, side, tt) {
  if (tt <= 0.001) return;
  const e = easeOut(tt);
  c.save(); c.translate(X, Y); c.scale(side, 1);
  c.translate((1 - e) * P * 0.9, -(1 - e) * P * 0.8); c.rotate(-(1 - e) * 0.6);
  c.lineJoin = 'round'; c.globalAlpha = Math.min(1, tt * 3);
  c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 14; c.shadowOffsetY = 4;
  c.fillStyle = lin(c, 0, -P, P, 0, [[0, 'rgba(255,251,238,.66)'], [1, 'rgba(244,228,184,.58)']]);
  c.beginPath(); c.rect(0, -P, P, P); c.fill();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
  c.strokeStyle = '#d9b866'; c.lineWidth = 2.5; c.stroke();
  const f = P * 0.26; // turned-over corner
  c.fillStyle = lin(c, P - f, -P, P, -P + f, [[0, 'rgba(255,255,250,.95)'], [1, 'rgba(226,205,150,.95)']]);
  c.beginPath(); c.moveTo(P, -P + f); c.lineTo(P - f, -P); c.lineTo(P - f, -P + f); c.closePath(); c.fill();
  c.strokeStyle = '#c9a85a'; c.lineWidth = 1.5; c.stroke();
  const s = P * 0.17; // the square that marks a right angle
  c.strokeStyle = '#c0562d'; c.lineWidth = 2.5; c.beginPath(); c.rect(0, -s, s, s); c.stroke();
  c.restore();
}

// --- frames ---------------------------------------------------------------------------------------------------
const cv = $('cv');
canvasLoop(cv, (c, w, h, dt, time) => {
  W = w; H = h;
  const v = lab.view;
  if (v === 'jaws') frameJaws(c, w, h, dt, time); else if (v === 'guess') frameGuess(c, w, h, dt, time); else frameMark(c, w, h, dt, time);
});

function frameJaws(c, w, h, dt, time) {
  S.disp = ease(S.disp, S.th, dt, S.drag ? 40 : 12);
  S.snD = ease(S.snD, S.snout, dt, 10);
  S.pT = ease(S.pT, S.paper || S.sec === 'two' ? 1 : 0, dt, 8);
  S.p2T = ease(S.p2T, S.sec === 'two' ? 1 : 0, dt, 5);
  const { u, X, Y } = lay(w, h);
  geo = { X, Y, u };
  scene(c, 0, 0, w, h, Y + 0.3 * u);
  const Sl = S.snD * u, wid = lerp(1, 0.55, clamp((S.snD - 0.5) / 0.5, 0, 1));
  const k = drawCroc(c, { X, Y, u, S: Sl, wid, th: S.disp, t: time });
  const P = 0.52 * u;
  if (S.pT > 0.02) {
    drawPaper(c, X, Y, P, 1, S.pT);
    c.save(); c.globalAlpha = S.pT * 0.7; c.setLineDash([6, 6]); c.strokeStyle = 'rgba(255,255,255,.65)'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(X, Y - P); c.lineTo(X, Y - Math.max(Sl, P) * 1.02); c.stroke(); c.restore();
  }
  if (S.p2T > 0.02) {
    drawPaper(c, X, Y, P, -1, S.p2T);
    if (S.p2T > 0.9) { pill(c, '90°', X + P * 0.5, Y - P * 0.5, { size: 13, ring: COL.right }); pill(c, '90°', X - P * 0.5, Y - P * 0.5, { size: 13, ring: COL.right }); }
  }
  if (S.sec !== 'two') drawMark(c, X, Y, S.disp, 0.26 * u, COL[clsOf(S.disp)], `${Math.round(S.disp)}°`);
  else drawMark(c, X, Y, S.disp, 0.2 * u, COL.straight, '180°');
  if (!S.drag) { // a pulsing handle on the upper jaw
    const pulse = S.touched ? 0 : 0.5 + 0.5 * Math.sin(time * 4);
    c.save(); c.globalAlpha = 1;
    if (!S.touched) { c.strokeStyle = `rgba(255,214,102,${0.7 - 0.5 * pulse})`; c.lineWidth = 3; c.beginPath(); c.arc(k.kx, k.ky, 16 + 8 * pulse, 0, 7); c.stroke(); }
    c.fillStyle = lin(c, k.kx, k.ky - 13, k.kx, k.ky + 13, [[0, '#ffe08a'], [1, '#e8a92e']]); c.strokeStyle = '#fff'; c.lineWidth = 2.5;
    c.beginPath(); c.arc(k.kx, k.ky, 13, 0, 7); c.fill(); c.stroke();
    c.strokeStyle = '#5a3a05'; c.lineWidth = 2.2; c.beginPath(); c.arc(k.kx, k.ky, 5.5, -2.6, 0.9); c.stroke();
    c.fillStyle = '#5a3a05'; c.beginPath(); c.moveTo(k.kx + 6.5, k.ky + 5.5); c.lineTo(k.kx + 8.5, k.ky - 1.5); c.lineTo(k.kx + 1.5, k.ky + 2.5); c.closePath(); c.fill();
    c.restore();
  }
}

function frameGuess(c, w, h, dt, time) {
  const r = curRound(), end = G.i >= G.n;
  G.rev = ease(G.rev, G.pick !== null || end ? 1 : 0, dt, 4.5);
  if (r.kind === 'cls') {
    G.d1 = ease(G.d1, r.th, dt, 4);
    const { u, X, Y } = lay(w, h), sk = SNOUT[r.sk];
    geo = { X, Y, u };
    scene(c, 0, 0, w, h, Y + 0.3 * u);
    drawCroc(c, { X, Y, u, S: sk.s * u, wid: sk.wid, th: G.d1, t: time });
    if (G.rev > 0.02) {
      drawPaper(c, X, Y, 0.52 * u, 1, G.rev);
      c.save(); c.globalAlpha = G.rev; drawMark(c, X, Y, G.d1, 0.26 * u, COL[r.cls], `${r.th}°`); c.restore();
    }
    return;
  }
  G.d1 = ease(G.d1, r.a.th, dt, 4); G.d2 = ease(G.d2, r.b.th, dt, 4);
  const hh = h / 2;
  [[r.a, G.d1, 0, '1'], [r.b, G.d2, hh, '2']].forEach(([cr, d, oy, id]) => {
    const { u, X, Y } = lay(w, hh - 4, oy + 2, true), sk = SNOUT[cr.sk];
    scene(c, 0, oy + 2, w, hh - 4, Y + 0.3 * u);
    drawCroc(c, { X, Y, u, S: sk.s * u, wid: sk.wid, th: d, t: time });
    if (G.rev > 0.02) { c.save(); c.globalAlpha = G.rev; drawMark(c, X, Y, d, 0.3 * u, COL[clsOf(cr.th)], `${cr.th}°`, 12); c.restore(); }
    const win = G.rev > 0.5 && (r.ans === id || r.ans === 'same');
    pill(c, r.ans === 'same' && G.rev > 0.5 ? `${id} =` : id, 24, oy + 26, win && r.ans !== 'same' ? { size: 15, bg: '#2fbf7e', ring: '#fff' } : { size: 15 });
  });
}

function frameMark(c, w, h) {
  scene(c, 0, 0, w, h, null, true);
  const si = Math.min(M.si, SH.length - 1), sh = SH[si], P = sh.p, n = P.length;
  const rev = M.checked || M.si >= SH.length;
  const xs = P.map((p) => p[0]), ys = P.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const mx = 54, my = 56, sc = Math.min((w - 2 * mx) / (x1 - x0), (h - 2 * my) / (y1 - y0));
  const ox = (w - (x1 - x0) * sc) / 2 - x0 * sc, oy = (h - (y1 - y0) * sc) / 2 - y0 * sc;
  const px = P.map(([x, y]) => ({ x: ox + x * sc, y: oy + y * sc }));
  M.px = px;
  const info = px.map((V, i) => {
    const A = px[(i + n - 1) % n], B = px[(i + 1) % n];
    const la = Math.hypot(A.x - V.x, A.y - V.y), lb = Math.hypot(B.x - V.x, B.y - V.y);
    const ua = { x: (A.x - V.x) / la, y: (A.y - V.y) / la }, ub = { x: (B.x - V.x) / lb, y: (B.y - V.y) / lb };
    const deg = Math.acos(clamp(ua.x * ub.x + ua.y * ub.y, -1, 1)) / D2R;
    const bx = ua.x + ub.x, by = ua.y + ub.y, bl = Math.hypot(bx, by) || 1;
    return { V, A, B, ua, ub, la, lb, deg, d: Math.round(deg), bis: { x: bx / bl, y: by / bl } };
  });
  sh.info = info;
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.save();
  c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 16; c.shadowOffsetY = 6;
  c.beginPath(); px.forEach((q, i) => (i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y))); c.closePath();
  c.fillStyle = lin(c, 0, oy, 0, oy + (y1 - y0) * sc, [[0, 'rgba(236,222,160,.92)'], [1, 'rgba(201,170,100,.92)']]); c.fill();
  c.restore();
  c.beginPath(); px.forEach((q, i) => (i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y))); c.closePath();
  c.strokeStyle = '#6e4d1e'; c.lineWidth = 4; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.5; c.stroke();
  const F = M.focus;
  if (F !== null && F !== undefined && (M.sel[F] || rev)) { // the two arms of the angle in focus
    const q = info[F];
    c.strokeStyle = '#ffd166'; c.lineWidth = 6; c.beginPath(); c.moveTo(q.A.x, q.A.y); c.lineTo(q.V.x, q.V.y); c.lineTo(q.B.x, q.B.y); c.stroke();
  }
  info.forEach((q, i) => {
    const isAns = clsOf(q.deg) === sh.kind;
    if (rev) {
      const k = clsOf(q.deg), col = COL[k], r = Math.min(26, 0.4 * Math.min(q.la, q.lb));
      if (k === 'right') {
        const s = r * 0.8; c.fillStyle = rgba(col, 0.3); c.strokeStyle = col; c.lineWidth = 3;
        c.beginPath(); c.moveTo(q.V.x, q.V.y); c.lineTo(q.V.x + q.ua.x * s, q.V.y + q.ua.y * s); c.lineTo(q.V.x + (q.ua.x + q.ub.x) * s, q.V.y + (q.ua.y + q.ub.y) * s); c.lineTo(q.V.x + q.ub.x * s, q.V.y + q.ub.y * s); c.closePath(); c.fill(); c.stroke();
      } else {
        const aa = Math.atan2(q.ua.y, q.ua.x);
        let d = Math.atan2(q.ub.y, q.ub.x) - aa; while (d > Math.PI) d -= 2 * Math.PI; while (d <= -Math.PI) d += 2 * Math.PI;
        c.fillStyle = rgba(col, 0.3); c.strokeStyle = col; c.lineWidth = 3.5;
        c.beginPath(); c.moveTo(q.V.x, q.V.y); c.arc(q.V.x, q.V.y, Math.max(0, r), aa, aa + d, d < 0); c.closePath(); c.fill();
        c.beginPath(); c.arc(q.V.x, q.V.y, Math.max(0, r), aa, aa + d, d < 0); c.stroke();
      }
      pill(c, `${q.d}°`, q.V.x + q.bis.x * (r + 24), q.V.y + q.bis.y * (r + 24), { size: 12, ring: col });
    }
    const sel = M.sel[i];
    const ring = rev ? (isAns && sel ? '#3ddc97' : isAns ? '#ff9f43' : sel ? '#ff3b30' : null) : sel ? '#ffd166' : null;
    if (ring) { c.strokeStyle = ring; c.lineWidth = 4; c.beginPath(); c.arc(q.V.x, q.V.y, 17, 0, 7); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#3a2a10'; c.lineWidth = 2; c.beginPath(); c.arc(q.V.x, q.V.y, 6, 0, 7); c.fill(); c.stroke();
    const L = sh.L[i], lx = q.V.x - q.bis.x * 34, ly = q.V.y - q.bis.y * 34;
    c.fillStyle = 'rgba(10,14,28,.84)'; c.beginPath(); c.arc(lx, ly, 14, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.font = '900 15px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(L, lx, ly + 1);
  });
}

// --- input -----------------------------------------------------------------------------------------------------
function setTh(v) {
  const prev = S.th;
  S.th = clamp(Math.round(v), 0, 180);
  if (S.sec === 'two' && S.th < 175) S.sec = null;
  const k = clsOf(S.th);
  if (k !== S.lastCls && (k === 'right' || (prev === 90 && k !== 'right'))) sfx.snap(); else if (S.th !== prev) sfx.tick();
  S.lastCls = k;
}
function pointerAngle(ev) {
  const r = cv.getBoundingClientRect(), dx = ev.clientX - r.left - geo.X, dy = ev.clientY - r.top - geo.Y;
  if (Math.hypot(dx, dy) < geo.u * 0.08) return null;
  let a = Math.atan2(-dy, dx) / D2R;
  if (a < 0) a = dx >= 0 ? 0 : 180;
  if (Math.abs(a - 90) <= 3) a = 90; else if (a <= 2) a = 0; else if (a >= 178) a = 180;
  return a;
}
cv.addEventListener('pointerdown', (ev) => {
  const v = lab.view;
  if (v === 'jaws') {
    S.drag = true; S.touched = true;
    try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
    const a = pointerAngle(ev); if (a !== null) setTh(a);
    render();
  } else if (v === 'mark' && M.si < SH.length) {
    const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    let best = -1, bd = 36;
    M.px.forEach((q, i) => { const d = Math.hypot(q.x - x, q.y - y); if (d < bd) { bd = d; best = i; } });
    if (best < 0) return;
    if (M.checked) M.focus = best;
    else { M.sel[best] = !M.sel[best]; M.focus = M.sel[best] ? best : (M.sel.lastIndexOf(true) >= 0 ? M.sel.lastIndexOf(true) : null); sfx.click(); }
    render();
  }
});
cv.addEventListener('pointermove', (ev) => {
  if (!S.drag || lab.view !== 'jaws') return;
  const a = pointerAngle(ev); if (a !== null) { setTh(a); render(); }
});
const endDrag = () => { S.drag = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

$('ctrlBody').innerHTML = `
  <div id="vJaws">
    <label class="at-sl"><span><i id="angLbl"></i><b id="angVal"></b></span><input class="big" id="ang" type="range" min="0" max="180" step="1" aria-label="angle"></label>
    <label class="at-sl" id="snWrap"><span><i id="snLbl"></i></span><input class="big" id="sn" type="range" min="50" max="85" step="1" aria-label="snout"></label>
    <div class="row2"><button class="chip at-chip" data-act="paper" id="bPaper"></button><button class="chip at-chip" data-act="shut" id="bShut"></button></div>
    <div class="row2"><div class="chips" id="secChips"></div></div>
  </div>
  <div id="vGuess">
    <div class="at-q" id="gQ"></div>
    <div class="at-opts" id="gOpts"></div>
    <div class="row2"><button class="btn at-btn" data-act="gnext" id="gNext"></button></div>
  </div>
  <div id="vMark">
    <div class="at-q" id="mQ"></div>
    <div class="row2" style="margin-top:0"><button class="btn at-btn" data-act="mmain" id="mMain"></button></div>
  </div>`;
$('ang').style.setProperty('--track', 'linear-gradient(90deg,#4bc7a0 0 49.4%,#f5c84c 49.4% 50.6%,#ff8a5c 50.6% 99%,#7aa8ff 99%)');
$('sn').style.setProperty('--track', 'linear-gradient(90deg,#4bc7a0,#7aa8ff)');
$('ang').addEventListener('input', () => { S.touched = true; setTh(+$('ang').value); render(); });
$('sn').addEventListener('input', () => { S.snout = +$('sn').value / 100; render(); });

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'paper') { S.paper = !S.paper; sfx.click(); }
  else if (act === 'shut') { S.th = 0; S.sec = null; S.paper = false; S.snout = 0.78; S.lastCls = 'zero'; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (k === 'two') { if (S.sec === 'two') S.sec = null; else { S.sec = 'two'; S.th = 180; S.paper = false; S.lastCls = 'straight'; } }
    else if (S.sec === 'sn') { S.sec = null; S.snout = 0.78; }
    else { S.sec = 'sn'; if (S.th < 20 || S.th > 160) S.th = 60; S.paper = false; }
    sfx.click();
  } else if (act === 'pick') pick(b.dataset.k);
  else if (act === 'gnext') {
    if (G.pick === null && G.i < G.n) return;
    if (G.i >= G.n) newRounds(); else { G.i++; if (G.i < G.n) startRound(); }
    sfx.click();
  } else if (act === 'mmain') mainMark();
  render();
});

function pick(k) {
  if (G.pick !== null || G.i >= G.n) return;
  const r = curRound(), ok = k === (r.kind === 'cls' ? r.cls : r.ans);
  G.pick = k; G.right[G.i] = ok; (ok ? sfx.good : sfx.bad)(); showStage();
}
function mainMark() {
  if (M.si >= SH.length) { M.si = 0; M.sel = []; M.checked = false; M.focus = null; M.right = []; sfx.click(); return; }
  if (!M.checked) {
    if (!M.sel.some(Boolean)) return;
    const sh = SH[M.si], ok = sh.info.every((q, i) => (clsOf(q.deg) === sh.kind) === !!M.sel[i]);
    M.right[M.si] = ok; M.checked = true;
    if (M.focus === null) M.focus = sh.info.findIndex((q) => clsOf(q.deg) === sh.kind);
    (ok ? sfx.good : sfx.bad)(); showStage();
  } else { M.si++; M.sel = []; M.checked = false; M.focus = null; sfx.click(); }
}

// --- one render per change: controls, readout and the state card ------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, r = curRound();
  document.body.dataset.v = v === 'guess' ? (r.kind === 'cmp' && G.i < G.n ? 'cmp' : 'cls') : v;
  $('vJaws').style.display = v === 'jaws' ? '' : 'none';
  $('vGuess').style.display = v === 'guess' ? '' : 'none';
  $('vMark').style.display = v === 'mark' ? '' : 'none';
  if (v === 'jaws') renderJaws(t); else if (v === 'guess') renderGuess(t); else renderMark(t);
}

function renderJaws(t) {
  const th = S.th, k = clsOf(th), col = COL[k];
  lab.setGlow(GLOW[k]);
  if (+$('ang').value !== th) $('ang').value = th;
  $('angLbl').textContent = t.ctl.ang; $('angVal').textContent = `${th}°`;
  $('snWrap').style.display = S.sec === 'sn' ? '' : 'none';
  $('snLbl').textContent = t.ctl.sn;
  if (+$('sn').value !== Math.round(S.snout * 100)) $('sn').value = Math.round(S.snout * 100);
  $('bPaper').textContent = t.ctl.paper; $('bPaper').classList.toggle('on', S.paper);
  $('bShut').textContent = t.ctl.shut;
  const open = secret.unlocked();
  const sc = (kk, emo) => `<button class="chip at-chip secret ${open ? 'open' : ''} ${S.sec === kk ? 'on' : ''}" data-act="sec" data-k="${kk}">${open ? `${emo} ${esc(t.sec[kk][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('two', '📄') + sc('sn', '↔️');
  lab.setReadout(`${th}°`, t.rel[k], k === 'zero' ? '' : t.cls[k], col);
  let st;
  if (S.sec === 'two') st = t.st.two; else if (S.sec === 'sn') st = t.st.sn(th); else st = t.j[k];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: S.sec ? '' : t.j.body });
  lab.setFacts(t.f.jaws);
}

function renderGuess(t) {
  const r = curRound(), g = t.g, end = G.i >= G.n, cmp = r.kind === 'cmp';
  lab.setGlow('rgba(122,168,255,.24)');
  const k = G.right.filter(Boolean).length;
  lab.setFacts(t.f.guess);
  const opts = end ? [] : cmp ? [['1', g.cmp[0]], ['2', g.cmp[1]], ['same', g.cmp[2]]] : ['acute', 'right', 'obtuse'].map((x) => [x, t.opt[x]]);
  const correct = end ? null : cmp ? r.ans : r.cls;
  $('gQ').textContent = end ? '' : cmp ? g.qc : g.q;
  $('gQ').style.display = end ? 'none' : '';
  $('gOpts').innerHTML = opts.map(([key, label]) => {
    const cl = G.pick === null ? '' : key === correct ? 'good' : key === G.pick ? 'bad' : 'dim';
    return `<button class="at-ans ${cl}" data-act="pick" data-k="${key}">${esc(label)}</button>`;
  }).join('');
  $('gNext').style.display = end || G.pick !== null ? '' : 'none';
  $('gNext').textContent = end ? g.again : g.next;
  if (end) {
    lab.setReadout(`${k}/${G.n}`, '', '', '#7aa8ff');
    lab.setState({ emo: '🏆', title: g.end(k, G.n), lead: g.endLead, body: '' });
    return;
  }
  if (G.pick === null) {
    lab.setReadout('?', g.round(G.i + 1, G.n), '', '#7aa8ff');
    lab.setState({ emo: '🤔', title: cmp ? g.qc : g.q, lead: cmp ? g.leadC : g.lead, body: '' });
    return;
  }
  const ok = G.pick === correct;
  if (cmp) {
    lab.setReadout(`${r.a.th}° · ${r.b.th}°`, g.round(G.i + 1, G.n), '', '#7aa8ff');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? g.right : g.wrong, lead: g.resC(r.a.th, r.b.th), body: g.bodyC });
  } else {
    lab.setReadout(`${r.th}°`, g.round(G.i + 1, G.n), t.cls[r.cls], COL[r.cls]);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? g.right : g.wrong, lead: g.res(r.th, t.cls[r.cls]), body: g.body[r.cls] });
  }
}

function renderMark(t) {
  const m = t.m, end = M.si >= SH.length, sh = SH[Math.min(M.si, SH.length - 1)], rev = M.checked || end;
  lab.setGlow('rgba(245,200,76,.24)');
  lab.setFacts(t.f.mark);
  const k = M.right.filter(Boolean).length, F = M.focus, name = (i) => `∠${sh.L[(i + sh.L.length - 1) % sh.L.length]}${sh.L[i]}${sh.L[(i + 1) % sh.L.length]}`;
  $('mQ').textContent = end ? '' : m.task[sh.kind]; $('mQ').style.display = end ? 'none' : '';
  const anyPick = M.sel.some(Boolean);
  $('mMain').textContent = end ? m.again : M.checked ? m.next : m.check;
  $('mMain').disabled = !end && !M.checked && !anyPick;
  if (end) {
    lab.setReadout(`${k}/${SH.length}`, '', '', '#f5c84c');
    lab.setState({ emo: '🏆', title: m.end(k, SH.length), lead: m.endLead, body: '' });
    return;
  }
  const q = sh.info?.[F ?? -1];
  if (!rev) {
    if (F !== null && M.sel[F]) {
      lab.setReadout(name(F), m.picked, '', '#f5c84c');
      lab.setState({ emo: '👆', title: m.pick(name(F)), lead: m.pickLead, body: '' });
    } else {
      lab.setReadout('?', m.hint, '', '#f5c84c');
      lab.setState({ emo: '✏️', title: m.task[sh.kind], lead: m.lead(M.si + 1, SH.length), body: '' });
    }
    return;
  }
  const ok = M.right[M.si];
  if (q) lab.setReadout(name(F), `${q.d}° · ${t.cls[clsOf(q.deg)].toLowerCase()}`, '', COL[clsOf(q.deg)]);
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? m.ok : m.no, lead: ok ? m.okLead : m.noLead, body: m.body });
}

newRounds();
render();
</script>
