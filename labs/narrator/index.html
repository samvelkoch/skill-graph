    if (lab.view === 'torches') {
      if (wn.label) pill(c, wn.label, 8, 8, { maxW: 170, size: 13 });
      if ((S.sec || S.mode) === 'you') pill(c, '👁 ' + T[lang].youLabel, 180, 312, { cx: true, maxW: 120 });
      if (wn.liar) {
        pill(c, T[lang].liar.say, 8, 8, { maxW: 200, size: 13 });
        if (S.liarPick !== null) { // the evidence: ring the foot and the ball
          const bs = ballState(t); c.save(); c.strokeStyle = '#ffd24a'; c.lineWidth = 2.5; c.setLineDash([5, 4]);
          c.beginPath(); c.arc(bs.vis ? bs.x : FOOT.x, bs.vis ? bs.y : FOOT.y, 17 + Math.sin(t * 6) * 1.5, 0, Math.PI * 2); c.stroke(); c.restore();
        }
      }
    } else {
      const card = T[lang].who.cards[S.ci];
      pill(c, `“${card.s}”`, 8, 8, { maxW: 344, size: 14 });
    }
  }
  c.restore();
});

// --- controls ---------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = b.dataset.k, t = T[lang];
  if (act === 'mode') { S.mode = k; S.sec = null; S.liarPick = null; sfx.click(); }
  else if (act === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === k ? null : k; S.liarPick = null; sfx.click(); }
  else if (act === 'liar') { S.liarPick = k; (k === 'no' ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'pick') { if (S.checked) return; S.picks[+k] = !S.picks[+k]; sfx.tick(); }
  else if (act === 'main') {
    if (!S.checked) {
      if (!S.picks.some(Boolean)) return;
      const card = t.who.cards[S.ci], ok = card.ok.every((o, i) => !!o === S.picks[i]);
      S.res[S.ci] = ok; S.checked = true; (ok ? sfx.good : sfx.bad)(); showStage();
    } else if (S.ci >= t.who.cards.length - 1) { S.ci = 0; S.res = []; S.picks = [false, false, false]; S.checked = false; sfx.click(); }
    else { S.ci++; S.picks = [false, false, false]; S.checked = false; sfx.click(); }
  } else if (act === 'opt') {
    if (S.pick3 !== null) return;
    S.pick3 = +k; S.t3r = nowT(); (S.pick3 === t.eyes.ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'again3') { S.pick3 = null; S.t3s = nowT(); A.mR = .5; sfx.click(); }
  render();
});

// --- one render per change: controls, readout and state card --------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('v1').style.display = v === 'torches' ? '' : 'none';
  $('v2').style.display = v === 'who' ? '' : 'none';
  $('v3').style.display = v === 'eyes' ? '' : 'none';
  lab.setFacts(t.facts[v].map((f) => ({ ...f })));
  if (v === 'torches') renderTorches(t); else if (v === 'who') renderWho(t); else renderEyes(t);
}
function renderTorches(t) {
  const m = S.sec || S.mode, open = secret.unlocked();
  $('modeChips').innerHTML = ['I', 'L', 'A'].map((k) => `<button class="chip ${!S.sec && S.mode === k ? 'on' : ''}" data-act="mode" data-k="${k}">${esc(t.modes[k])}</button>`).join('');
  const sc = (k, emo, name) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(name)}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('you', '🫵', t.secrets.a[0]) + sc('liar', '🤥', t.secrets.b[0]);
  const minds = m === 'A' ? 4 : 1;
  if (m === 'liar') {
    const lp = S.liarPick, L = t.liar;
    $('voice').innerHTML = `<small>${esc(t.voiceK)}</small>${esc(L.q)}<div class="chips nr-chips" style="margin-top:8px">` +
      [['yes', L.yes], ['no', L.no]].map(([k, name]) => `<button class="chip ${lp === k ? 'on' : ''} ${lp !== null && k === 'no' ? 'nr-ok' : ''}" data-act="liar" data-k="${k}">${esc(name)}</button>`).join('') + '</div>';
    lab.setReadout(minds, t.mindsSub, t.modes.I, '#e0b050');
    const st = lp === null ? t.modeSt.liar : lp === 'no' ? L.right : L.wrong;
    lab.setState({ emo: lp === 'no' ? '✅' : lp === null ? '🤥' : '🔎', title: st[0], lead: st[1], body: '', extra: '' });
    return;
  }
  $('voice').innerHTML = `<small>${esc(t.voiceK)}</small>${esc(t.voice[m])}`;
  lab.setReadout(minds, t.mindsSub, m === 'you' ? t.youLabel : t.modes[m], '#e0b050');
  const st = t.modeSt[m];
  lab.setState({ emo: m === 'I' ? '👁️' : m === 'L' ? '🚶' : m === 'A' ? '🌐' : '🫵', title: st[0], lead: st[1], body: '', extra: '' });
}
function renderWho(t) {
  const W_ = t.who, card = W_.cards[S.ci], n = W_.cards.length, names = ['I', 'L', 'A'];
  $('pickChips').innerHTML = names.map((k, i) => {
    const mark = S.checked ? ` <span class="nr-mark ${card.ok[i] ? 'y' : 'n'}">${card.ok[i] ? '✓' : '✗'}</span>` : '';
    const cls = [S.picks[i] ? 'on' : '', S.checked ? (card.ok[i] ? 'nr-ok' : S.picks[i] ? 'nr-bad' : '') : ''].join(' ');
    return `<button class="chip ${cls}" data-act="pick" data-k="${i}" aria-pressed="${S.picks[i]}">${esc(t.modes[k])}${mark}</button>`;
  }).join('');
  $('legend').textContent = S.checked ? W_.legend : '';
  const last = S.checked && S.ci >= n - 1;
  $('mainBtn').textContent = !S.checked ? W_.check : last ? W_.again : W_.next;
  $('mainBtn').disabled = !S.checked && !S.picks.some(Boolean);
  const got = S.res.filter(Boolean).length;
  $('score').textContent = W_.score(got);
  lab.setReadout(`${S.ci + 1}/${n}`, W_.card, '', '#5fa8a0');
  if (!S.checked) lab.setState({ emo: '🔦', title: W_.ask[0], lead: W_.ask[1], body: '', extra: '' });
  else if (last) lab.setState({ emo: S.res[S.ci] ? '✅' : '💡', title: `${S.res[S.ci] ? W_.right : W_.wrong} ${W_.end(got)}`, lead: card.why, body: '', extra: '' });
  else lab.setState({ emo: S.res[S.ci] ? '✅' : '💡', title: S.res[S.ci] ? W_.right : W_.wrong, lead: card.why, body: '', extra: '' });
}
function renderEyes(t) {
  const E = t.eyes, p = S.pick3;
  $('q3').textContent = E.q;
  $('optChips').innerHTML = E.opts.map((name, i) => `<button class="chip ${p === i ? 'on' : ''} ${p !== null && i === E.ok ? 'nr-ok' : ''} ${p === i && i !== E.ok ? 'nr-bad' : ''}" data-act="opt" data-k="${i}">${esc(name)}</button>`).join('');
  $('again3').style.display = p === null ? 'none' : '';
  $('again3').textContent = E.again;
  if (p === null) {
    lab.setReadout('?', E.sub, '', '#d9825f');
    lab.setState({ emo: '🤔', title: E.ask[0], lead: E.ask[1], body: '', extra: '' });
  } else {
    lab.setReadout('😟 → 😊', E.sub, '', '#d9825f');
    const st = p === E.ok ? E.right : E.wrong;
    lab.setState({ emo: p === E.ok ? '✅' : '💡', title: st[0], lead: st[1], body: '', extra: '' });
  }
}
render();
</script>
</body>
</html>
