    const R = GALLERY_R(!!S.sec);
    let hit = -1, bd = 22;
    G.v.forEach(([ux, uy], i) => { const d = Math.hypot(x - (R.x + ux * R.w), y - (R.y + uy * R.h)); if (d < bd) { bd = d; hit = i; } });
    if (hit < 0) return;
    if (S.tr.stuck && S.sec !== 'plough') return;
    tapVertex(G, S.tr, hit, S.sec === 'plough'); render();
  }
});
const buildPending = () => S.era === 'today' && S.tGuess === null;
function onEdit() { S.walkB = newWalk(); S.edited = true; S.tShow = false; S.sel = -1; }
function onView() { if (lab.view === 'graph' && !S.morphSeen) { S.morphSeen = true; setTimeout(() => { if (S.gi === 0) S.target = 1; render(); }, 450); } render(); }

// --- controls ------------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'cg') { S.guess = b.dataset.v; sfx.click(); }
  else if (act === 'cReset') { S.walkC = newWalk(); S.note = null; sfx.click(); }
  else if (act === 'why') { $('views').querySelector('[data-view="graph"]')?.click(); requestAnimationFrame(() => $('stage').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' })); return; }
  else if (act === 'morph') { S.target = S.target ? 0 : 1; S.back = !S.target; sfx.click(); }
  else if (act === 'gp') {
    const poss = gPossible(GR[S.gi - 1]), ok = (b.dataset.v === 'can') === poss;
    S.pred[S.gi] = { g: b.dataset.v, ok }; if (ok) S.rights++;
    if (S.rights >= 4 && !S.ruleKnown) { S.ruleKnown = true; S.ruleHow = 'found'; }
    (ok ? sfx.good : sfx.bad)(); showStage();
  }
  else if (act === 'trReset') { S.tr = newTrace(); sfx.click(); }
  else if (act === 'rule') { S.ruleKnown = true; S.ruleHow = 'shown'; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.tr = newTrace(); S.houseStuck = 0; sfx.click();
  }
  else if (act === 'mode') { S.mode = b.dataset.v; S.sel = -1; sfx.click(); }
  else if (act === 'era') {
    if (b.dataset.v === 'today') {
      S.era = 'today'; S.edges = mk(TODAY); onEdit(); S.edited = false; S.tShow = S.tGuess !== null; sfx.click();
    } else { S.era = '1736'; S.edges = mk(ORIG); onEdit(); S.edited = false; sfx.click(); }
  }
  else if (act === 'bReset') {
    if (S.mode === 'walk') S.walkB = newWalk();
    else { S.edges = mk(S.era === 'today' ? TODAY : ORIG); onEdit(); S.edited = false; S.tShow = false; }
    sfx.click();
  }
  else if (act === 'tg') {
    S.tGuess = b.dataset.v; S.tShow = true; S.mode = 'change';
    const ok = (b.dataset.v === 'yes'); (ok ? sfx.good : sfx.bad)(); showStage();
  }
  render();
});

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('vCity').hidden = v !== 'city'; $('vGraph').hidden = v !== 'graph'; $('vBuild').hidden = v !== 'build';
  if (v === 'city') renderCity(t); else if (v === 'graph') renderGraph(t); else renderBuild(t);
}
const noteText = (t, sec) => (S.note && S.note.sec === sec && performance.now() < S.note.until ? (S.note.key === 'full' ? t.bld : t.city)[S.note.key] : '');

function renderCity(t) {
  const c = t.city, W = S.walkC, m = EDGES0.length, asked = S.guess !== null, stuck = stuckOf(W, EDGES0), reveal = asked && S.stuck >= 3;
  lab.setGlow('rgba(70, 150, 225, .28)');
  $('cQ').textContent = asked ? c.guess(S.guess) : c.q;
  $('cOpts').hidden = asked;
  $('cOpts').innerHTML = [['yes', c.yes], ['no', c.no]].map(([k, l]) => `<button class="br-opt" data-act="cg" data-v="${k}">${esc(l)}</button>`).join('');
  $('cReset').hidden = !asked; $('cReset').textContent = c.again;
  $('cWhy').hidden = !reveal; $('cWhy').textContent = c.why;
  lab.setReadout(`${W.n}/${m}`, c.sub, stuck ? c.pill : '', '#4ea8ff');
  const note = noteText(t, 'city');
  let st;
  if (!asked) st = { emo: '🤔', title: c.q, lead: c.lead0 };
  else if (reveal) st = { emo: S.guess === 'no' ? '✅' : '🤔', title: S.guess === 'no' ? c.rev.ok : c.rev.no, lead: c.rev.lead, body: c.rev.body };
  else if (stuck) st = { emo: '😵', title: c.stuckT, lead: c.stuckL(W.n, m) };
  else if (W.at < 0) st = { emo: '🚶', title: c.startT, lead: c.tip };
  else st = { emo: '🚶', title: c.goT(W.n, m), lead: note || c.goL };
  lab.setState({ body: '', extra: '', ...st });
  lab.setFacts(t.facts.city.map((f) => ({ ...f })));
}

function ruleBlock(g) {
  if (S.ruleKnown) return `<div class="br-rule"><b>${esc(S.ruleHow === 'found' ? g.ruleFound : g.ruleT)}</b><br>${esc(g.rule)}</div>`;
  return Object.keys(S.pred).length ? `<div class="br-look">${esc(g.look(S.rights))}</div>` : '';
}
function renderGraph(t) {
  const g = t.graph, tr = S.tr, sec = S.sec, open = secret.unlocked();
  lab.setGlow('rgba(95, 208, 192, .24)');
  const G = sec === 'house' ? HOUSE : sec === 'plough' ? PLOUGH : S.gi ? GR[S.gi - 1] : null;
  const pr = !sec && S.gi ? S.pred[S.gi] : null;
  $('gMorphRow').hidden = !!sec || S.gi !== 0;
  $('gMorph').textContent = S.target ? g.toCity : g.toGraph;
  $('gQ').hidden = $('gOpts').hidden = !(G && !sec && !pr);
  $('gQ').textContent = g.ask;
  $('gOpts').innerHTML = [['can', g.can], ['cant', g.cant]].map(([k, l]) => `<button class="br-opt" data-act="gp" data-v="${k}">${esc(l)}</button>`).join('');
  $('trReset').hidden = !(G && (sec || pr)); $('trReset').textContent = g.trAgain;
  $('ruleB').hidden = S.ruleKnown || !!sec; $('ruleB').textContent = g.showRule;
  const sc = (k, emo, i) => `<button class="chip br-t secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('house', '🏠') + sc('plough', '🚜');
  let st, rd, facts = t.facts.graph;
  if (sec === 'house') {
    const m = HOUSE.e.length, done = tr.n === m, h = t.house;
    rd = [`${tr.n}/${m}`, h.sub, '', '#5fd0c0'];
    st = done ? { emo: '🎉', title: h.done, lead: '' } : tr.stuck ? { emo: '😵', title: h.stuck, lead: h.hint } : { emo: '🏠', title: h.t, lead: S.houseStuck > 0 ? h.hint : h.l };
    facts = [];
  } else if (sec === 'plough') {
    const m = PLOUGH.e.length, p = t.plough, rep = tr.driven - tr.n, all = tr.n === m, done = all && tr.at === PLOUGH.depot;
    rd = [`${tr.driven}`, p.sub, rep ? p.pill(rep) : '', '#5fd0c0'];
    st = done ? { emo: '🎉', title: p.done(rep, PLOUGH_BEST), lead: p.why } : { emo: '🚜', title: p.t, lead: all ? p.back : tr.at < 0 ? p.l : p.prog(tr.driven, rep) };
    facts = t.facts.plough;
  } else if (S.gi === 0) {
    const e = S.mDone, d = degOf(EDGES0), sum = d.reduce((x, y) => x + y, 0);
    rd = e ? [`${sum}`, g.sub(EDGES0.length), g.pillOdd(d.filter((k) => k % 2).length), '#5fd0c0'] : ['…', g.subDots, '', '#5fd0c0'];
    st = S.back && S.target === 0 && S.morph < 0.02 ? { emo: '🌉', title: g.cityT, lead: g.cityL } : { emo: '🔵', title: g.kT, lead: e ? g.kL(d, sum, EDGES0.length) : g.kWait, body: e ? g.kB : '' };
    st.extra = ruleBlock(g);
  } else if (!pr) {
    rd = ['?', g.subWait, '', '#5fd0c0'];
    st = { emo: '🤔', title: g.q, lead: g.lead0, extra: ruleBlock(g) };
  } else {
    const d = gDeg(G), sum = d.reduce((x, y) => x + y, 0), odd = gOdd(G), poss = gPossible(G), m = G.e.length;
    rd = [`${sum}`, g.sub(m), g.pillOdd(odd), '#5fd0c0'];
    const trs = tr.at < 0 ? g.tr0 : tr.n === m ? g.trDone : tr.stuck ? g.trStuck : g.trN(tr.n, m);
    st = { emo: pr.ok ? '✅' : '🤔', title: pr.ok ? g.vOk : g.vNo, lead: g.oddL(odd), body: `${poss ? g.canT : g.cantT} ${trs}`, extra: ruleBlock(g) };
  }
  lab.setReadout(...rd);
  lab.setState({ body: '', extra: '', ...st });
  lab.setFacts(facts.map((f) => ({ ...f })));
}

function renderBuild(t) {
  const b = t.bld, edges = S.edges, m = edges.length, W = S.walkB, pw = walkPossible(edges), d = degOf(edges), odd = d.filter((k) => k % 2).length;
  lab.setGlow('rgba(217, 130, 95, .24)');
  const pending = buildPending();
  $('bMode').innerHTML = [['change', b.chg], ['walk', b.wlk]].map(([k, l]) => `<button data-act="mode" data-v="${k}" class="br-t ${S.mode === k ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('bEra').innerHTML = [['1736', b.era[0]], ['today', b.era[1]]].map(([k, l]) => `<button data-act="era" data-v="${k}" class="br-t ${S.era === k ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('bReset').textContent = S.mode === 'walk' ? t.city.again : b.reset;
  $('bAsk').hidden = !pending;
  $('bQ').textContent = b.tq;
  $('bOpts').innerHTML = [['yes', b.tYes], ['no', b.tNo]].map(([k, l]) => `<button class="br-opt" data-act="tg" data-v="${k}">${esc(l)}</button>`).join('');
  const verdict = S.guess !== null || S.edited || S.era === 'today';
  if (pending) lab.setReadout('?', '', '', '#d9825f');
  else lab.setReadout(`${odd}`, b.sub, pw.ok ? b.pillOk : verdict && m ? b.pillNo : '', '#d9825f');
  const note = noteText(t, 'bld'), stuck = stuckOf(W, edges);
  let st, facts = [t.facts.bristol];
  if (pending) st = { emo: '🤔', title: b.tq, lead: '' };
  else if (S.tShow && S.era === 'today') { st = { emo: S.tGuess === 'yes' ? '✅' : '🤔', title: S.tGuess === 'yes' ? b.tv.ok : b.tv.no, lead: S.ruleKnown ? `${b.tv.l} ${b.tv.r}` : b.tv.l, body: b.tv.model }; facts = [t.facts.model, t.facts.bristol]; }
  else if (S.mode === 'walk') {
    if (m && W.used.size === m) st = { emo: '🎉', title: b.walked(m), lead: b.walkedL };
    else if (stuck) st = { emo: '😵', title: t.city.stuckT, lead: t.city.stuckL(W.n, m) };
    else if (W.at < 0) st = { emo: '🚶', title: t.city.startT, lead: t.city.tip };
    else st = { emo: '🚶', title: t.city.goT(W.n, m), lead: note || t.city.goL };
  } else if (!m) st = { emo: '🔨', title: b.empty, lead: b.l0 };
  else if (pw.ok) st = { emo: '✅', title: b.ok0, lead: S.ruleKnown ? b.okL(odd) : b.okN };
  else if (!pw.conn) st = { emo: '🧩', title: b.cut, lead: b.cutL };
  else st = { emo: '🔨', title: verdict ? b.t0 : b.t00, lead: note || (S.sel >= 0 ? b.sel : b.l0), body: S.ruleKnown ? b.rule : '' };
  if (S.mode === 'change' && note && !pending) st = { ...st, lead: note };
  lab.setState({ body: '', extra: '', ...st });
  lab.setFacts(facts.map((f) => ({ ...f })));
}
render();
</script>
