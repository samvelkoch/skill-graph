    const lvl = sec === 'circ' ? CIRC.map((n, i) => [n, i === P.cl, false]) : sec === 'pix' ? PIXN.map((n, i) => [n, i === P.px, false]) : LV.map((l, i) => [l.n, i === P.lv, P.seen[i]]);
    const cap = sec === 'circ' ? t.cir.sides : sec === 'pix' ? t.pix.across : p.lv;
    html = `<div class="as-note" style="margin:0 0 6px">${esc(cap)}</div><div class="as-row" style="margin-top:0">${lvl.map(([n, on, seen], i) => `<button class="as-b ${on ? 'on' : ''} ${seen && !on ? 'seen' : ''}" data-act="lv" data-i="${i}" style="min-width:54px">${n}</button>`).join('')}</div>
      <div class="as-row">${['circ', 'pix'].map((k) => `<button class="as-chip ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'circ' ? '⭕' : '🔲'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('')}
      ${sec ? '' : `<button class="as-b go" data-act="rev"${seenN < LV.length || P.rev ? ' disabled' : ''}>${esc(p.reveal)}</button>`}</div>
      ${!sec && !P.rev && seenN < LV.length ? `<p class="as-note">${esc(p.needAll(seenN))}</p>` : ''}`;
  }
  $('ctrlBody').innerHTML = html;
  if (sec === 'circ') {
    const n = CIRC[P.cl], lo = n * Math.sin(Math.PI / n), hi = n * Math.tan(Math.PI / n);
    lab.setReadout(n, t.cir.sides, `${t.cir.pill} ≈ ${fmt((lo + hi) / 2, 3)}`, '#52d69a');
    stateOf({ emo: '⭕', title: t.cir.title(n), lead: t.cir.lead(fmt(lo, 4), fmt(hi, 4)), body: t.cir.body });
  } else if (sec === 'pix') {
    const n = PIXN[P.px], R = n / 2; let cnt = 0;
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) if ((i + 0.5 - R) ** 2 + (j + 0.5 - R) ** 2 <= R * R) cnt++;
    const err = Math.abs(cnt - Math.PI * R * R) / (Math.PI * R * R) * 100;
    lab.setReadout(`${n}×${n}`, t.pix.across, '', '#8fc8ff');
    stateOf({ emo: '🔲', title: t.pix.title(n), lead: t.pix.lead(cnt, fmt(err, err < 1 ? 2 : 1)), body: t.pix.body });
  } else {
    const rows = LV.map((l, i) => {
      const seen = P.seen[i] || P.rev;
      return `<div class="as-tr ${i === P.lv ? 'cur' : ''}"><span>${l.n}</span><span class="as-bar"><i style="width:${seen ? l.est / LV[0].est * 100 : 0}%"></i></span><b>${seen ? fmt(l.est) + ' m²' : '?'}</b>${P.rev ? `<em>+${fmt(l.est - TRUE_AREA)}</em>` : '<em></em>'}</div>`;
    }).join('') + (P.rev ? `<div class="as-tr true"><span>${esc(p.rowTrue)}</span><span class="as-bar"><i style="width:${TRUE_AREA / LV[0].est * 100}%"></i></span><b>${fmt(TRUE_AREA)} m²</b><em></em></div>` : '');
    const leg = L.inn > 0 ? `<div class="as-leg"><span><i style="background:#ffa53c"></i>${esc(p.legT)}</span><span><i style="background:#46d78c"></i>${esc(p.legI)}</span></div>` : '';
    const sand = P.rev && L.inn > 0 ? `<p class="as-note">${esc(p.sand(fmt(L.inEst), fmt(L.est)))}</p>` : '';
    lab.setReadout(`${fmt(L.est)} m²`, `${L.touch} / ${L.n} ${p.pcs(L.n)}`, P.rev ? p.pillTrue(fmt(TRUE_AREA)) : p.est, '#3c9fc8');
    if (!predicted) stateOf({ emo: '🤔', title: p.q, lead: p.lead0, body: '', extra: `<div class="as-tbl">${rows}</div>` });
    else if (P.rev) {
      const right = POND_ANS === P.guess;
      stateOf({ emo: right ? '✅' : '🤔', title: p.tTrue(fmt(TRUE_AREA)), lead: (right ? p.right : p.wrong) + p.trend, body: p.over, extra: `<div class="as-tbl">${rows}</div>${leg}${sand}<div class="fine">${esc(p.fine)}</div>` });
    } else stateOf({ emo: '🟧', title: p.tEst(fmt(L.est)), lead: `${p.touch(L.touch, L.n)}, ${p.each(fmt(L.each, 2))}.`, body: '', extra: `<div class="as-tbl">${rows}</div>${leg}` });
  }
  lab.setFacts(predicted ? t.facts.pond : []);
}

function renderPaint(t) {
  const P = S.paint, wl = WALLS[P.wi], cal = calc(wl), p = t.paint, predicted = P.guess !== null, complete = PKEYS.every((k) => P.on[k]);
  const tot = totalOf(P, cal), anyOn = PKEYS.some((k) => P.on[k]), nT = tinsFor(tot);
  lab.setGlow('rgba(229, 130, 106, .24)');
  const opts = wl.offs.map((o) => cal.tins + o);
  const f = (a, b) => `${fmt(a)} × ${fmt(b)}`, wf = wl.wins.length > 1 ? `${wl.wins.length} × ${f(...wl.wins[0])}` : f(...wl.wins[0]);
  const forms = { rect: `＋ ${p.pc.rect}: ${f(wl.w, wl.h)}`, tri: `＋ ${p.pc.tri}: ½ × ${fmt(wl.w)} × ${fmt(wl.g)}`, win: `− ${p.pc.win}: ${wf}`, door: `− ${p.pc.door}: ${f(...wl.door)}` };
  if (!predicted) {
    $('ctrlBody').innerHTML = `<p class="as-q">${esc(p.q(TIN))}</p><div class="as-row">${opts.map((n) => `<button class="as-b big" data-act="qg" data-g="${n}" style="min-width:56px">${n}</button>`).join('')}</div>`;
    lab.setReadout('?', p.hint(P.wi + 1), '', '#e5826a');
    stateOf({ emo: '🎨', title: p.qs, lead: p.lead0 });
  } else {
    const dis = (k) => ((k === 'win' || k === 'door') && !P.on.rect ? ' disabled' : '');
    $('ctrlBody').innerHTML = `<p class="as-note" style="margin:0 0 6px">${esc(p.work)}</p>
      <div class="as-row" style="margin-top:0">${PKEYS.map((k) => `<button class="as-b ${P.on[k] ? 'on' : ''}" data-act="pc" data-k="${k}"${dis(k)}>${esc(forms[k])}</button>`).join('')}</div>
      ${complete ? `<div class="as-row"><button class="as-b go" data-act="next">${esc(p.next)}</button></div>` : ''}`;
    const eq = [];
    if (P.on.rect) eq.push(fmt(cal.rect)); if (P.on.tri) eq.push((eq.length ? '+ ' : '') + fmt(cal.tri));
    if (P.on.win) eq.push('− ' + fmt(cal.win)); if (P.on.door) eq.push('− ' + fmt(cal.door));
    lab.setReadout(anyOn ? `${fmt(tot)} m²` : '?', anyOn ? eq.join(' ') : p.hint(P.wi + 1), anyOn ? p.pill(nT) : '', '#e5826a');
    if (!anyOn) stateOf({ emo: '🎨', title: p.qs, lead: p.work });
    else if (!complete) stateOf({ emo: '🖌️', title: p.tot(fmt(tot)), lead: p.tinsOf(fmt(tot), fmt(tot / TIN, 2), nT), body: p.tinsLeadPart });
    else {
      const right = P.guess === cal.tins, same = cal.grossTins === cal.tins;
      stateOf({ emo: right ? '✅' : '🤔', title: right ? p.right : p.wrong(P.guess, cal.tins), lead: p.tinsOf(fmt(tot), fmt(tot / TIN, 2), cal.tins),
        body: same ? p.roughSame(fmt(cal.gross), cal.tins) : p.roughDiff(fmt(cal.gross), cal.grossTins, cal.tins) });
    }
  }
  lab.setFacts(t.facts.paint);
}
render();
</script>
</body>
</html>
