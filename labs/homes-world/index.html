$('cv').addEventListener('pointerup', endDrag);
$('cv').addEventListener('pointercancel', endDrag);

const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = b.dataset.k;
  if (act === 'cl') { S.cl = k; if (S.mat === 'snow' && k !== 'cold' && !S.mix) S.mat = k === 'wet' ? 'reeds' : 'clay'; S.under = false; resetBuild(); sfx.click(); }
  else if (act === 'mat') {
    S.mat = k; if (!S.mix) { if (k === 'snow') S.cl = 'cold'; if (k !== 'felt' && S.life === 'move') S.life = 'stay'; }
    S.under = false; resetBuild(); sfx.click();
  } else if (act === 'life') { S.life = k; if (k === 'move' && !S.mix) S.mat = 'felt'; S.under = false; resetBuild(); sfx.click(); }
  else if (act === 'g') { if (S.rev) return; S.g[b.dataset.g] = k; sfx.tick(); }
  else if (act === 'build') { if (!(S.g.walls && S.g.roof && S.g.win)) return; S.under = false; S.rev = true; S.bt = 0; S.mt = 0; sfx.push(); setTimeout(showStage, 100); }
  else if (act === 'next') { S.mix = false; S.under = false; loadPlace((S.place + 1) % PLACES.length); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (k === 'under') { S.under = !S.under; S.ut = 0; sfx.click(); }
    else if (S.mix) { S.mix = false; S.under = false; loadPlace(0); sfx.click(); }
    else { S.mix = true; S.under = false; S.cl = 'dry'; S.mat = 'snow'; S.life = 'stay'; S.g = {}; S.rev = true; S.bt = 0; S.mt = 0; sfx.push(); }
  } else if (act === 'check') {
    if (S.chk) { S.tok = newToks(); S.chk = false; S.sel = null; sfx.click(); }
    else if (S.tok.every((t) => t.zone)) {
      S.chk = true; S.sel = null;
      S.tok.forEach((t) => { t.ok = ANSWER[t.k].includes(t.zone); });
      const good = S.tok.every((t) => t.ok); (good ? sfx.good : sfx.bad)();
      S.tok.forEach((t) => { if (!t.ok) { const z = zoneOf(ANSWER[t.k][0]); t.zone = z.id; } });
      S.tok.forEach((t) => { const z = zoneOf(t.zone); const [x, y] = zonePos(z, t); t.tx = x; t.ty = y; });
      setTimeout(showStage, 100);
    }
  }
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-g]'); if (!b || S.rev) return;
  S.g[b.dataset.g] = b.dataset.v; sfx.tick(); render();
});

// --- text and controls ---------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secBuild').style.display = v === 'build' ? '' : 'none';
  $('secWhy').style.display = 'none';
  $('secWhere').style.display = v === 'where' ? '' : 'none';
  $('cv').style.touchAction = v === 'where' ? 'none' : 'pan-y';
  if (v === 'build') renderBuild(t); else if (v === 'why') renderWhy(t); else renderWhere(t);
}
function renderBuild(t) {
  const inf = infoOf(S.cl, S.mat, S.life), chips = (key, arr, cur, act) => arr.map((k) => `<button class="chip ${k === cur ? 'on' : ''}" data-act="${act}" data-k="${k}">${esc(t[key][k])}</button>`).join('');
  $('kCl').textContent = t.lbl.cl; $('kMat').textContent = t.lbl.mat; $('kLife').textContent = t.lbl.life; $('kGuess').textContent = t.gq;
  $('chCl').innerHTML = chips('cl', ['dry', 'cold', 'wet', 'mild'], S.cl, 'cl');
  $('chMat').innerHTML = chips('mat', ['wood', 'clay', 'stone', 'snow', 'reeds', 'felt'], S.mat, 'mat');
  $('chLife').innerHTML = chips('life', ['stay', 'move'], S.life, 'life');
  const grp = [['walls', t.gw, ['thick', 'thin']], ['roof', t.gr, ['flat', 'steep', 'round']], ['win', t.gx, ['small', 'big']]];
  $('guess').innerHTML = grp.map(([key, lbl, opts]) => `<div class="hw-g"><span class="gl">${esc(lbl)}</span><div class="card seg small">${opts.map((o) => {
    const mark = S.rev && S.g[key] ? (S.g[key] === o ? (inf[key] === o ? ' good' : ' bad') : inf[key] === o ? ' good' : '') : '';
    return `<button data-g="${key}" data-v="${o}" class="${S.g[key] === o ? 'on' : ''}${mark}">${esc(t.gv[o])}</button>`;
  }).join('')}</div></div>`).join('');
  $('bBuild').textContent = t.build; $('bNext').textContent = t.next;
  $('bBuild').style.display = S.rev ? 'none' : ''; $('bBuild').disabled = !(S.g.walls && S.g.roof && S.g.win);
  const open = secret.unlocked(), sc = (k, emo, on) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('under', '🕳️', S.under) + sc('mix', '🔀', S.mix);
  lab.setFacts(t.facts.build);
  topEl.style.display = '';
  const place = t.topBuild(t.clName[S.cl], t.matName[S.mat], t.lifeName[S.life]);
  topEl.textContent = S.under ? `📍 ${t.under.sub}` : S.mix ? t.mixTip : place;
  if (S.under) {
    lab.setGlow('rgba(214,150,80,.3)'); lab.setReadout('↓', t.under.sub, t.under.pill, '#d6964f');
    lab.setState({ emo: '🕳️', title: t.under.title, lead: t.under.lead, body: '', extra: '' }); return;
  }
  lab.setGlow({ dry: 'rgba(235,180,90,.3)', cold: 'rgba(130,170,225,.3)', wet: 'rgba(70,160,120,.3)', mild: 'rgba(110,190,100,.28)' }[S.cl]);
  if (!S.rev) {
    lab.setReadout('?', t.preSub, '', '#e0b050');
    lab.setState({ emo: '📍', title: place.replace('📍 ', ''), lead: t.preLead, body: '', extra: '' }); return;
  }
  const full = S.g.walls && S.g.roof && S.g.win, rows = [['walls', t.gw], ['roof', t.gr], ['win', t.gx]];
  const k = full ? rows.filter(([key]) => S.g[key] === inf[key]).length : 0, [nm, why] = t.houses[inf.key];
  lab.setReadout(full ? `${k}/3` : nm, full ? nm : '', '', '#e0b050');
  if (inf.melts && S.bt >= 1) { lab.setState({ emo: '🫠', title: t.melt[0], lead: t.melt[1], body: why, extra: '' }); return; }
  const bad = full ? rows.filter(([key]) => S.g[key] !== inf[key]).map(([key]) => t.why1[inf[key]]) : [];
  const list = full ? `<ul class="hw-list">${rows.map(([key, lbl]) => { const ok = S.g[key] === inf[key]; return `<li class="${ok ? 'ok' : 'no'}">${esc(t.row(lbl, t.gv[inf[key]], ok, t.gv[S.g[key]]))}</li>`; }).join('')}</ul>` : '';
  lab.setState({
    emo: '🏠', title: full ? t.res(k) : nm, lead: full ? `${nm}. ${why}` : why,
    body: [...(inf.heavy ? [t.heavy] : []), ...(full ? bad : [])].join(' '), extra: list,
  });
}
function renderWhy(t) {
  lab.setFacts(t.facts.why); lab.setGlow('rgba(214,160,100,.26)');
  topEl.style.display = 'none'; topEl.textContent = t.whyTip;
  const n = S.seen.size;
  lab.setReadout(`${n}/8`, t.whySub, '', '#e0b050');
  if (!S.spot) { lab.setState({ emo: '🤔', title: t.whyT, lead: t.whyLead, body: '', extra: '' }); return; }
  const [k, id] = S.spot.split('.'), [ti, tx_] = t.parts[k][id];
  lab.setState({ emo: { igloo: '❄️', yurt: '🛖', stilt: '🌴', adobe: '🏜️' }[k], title: ti, lead: tx_, body: n === 8 ? t.whyDone : '', extra: '' });
}
function renderWhere(t) {
  lab.setFacts(t.facts.where); lab.setGlow('rgba(80,150,210,.28)');
  topEl.style.display = 'none'; topEl.textContent = t.whereTip;
  const placed = S.tok.filter((q) => q.zone).length, right = S.tok.filter((q) => q.ok).length;
  $('bCheck').textContent = S.chk ? t.again : t.check; $('bCheck').disabled = !S.chk && placed < 6;
  lab.setReadout(S.chk ? `${right}/6` : `${placed}/6`, S.chk ? '' : t.whereSub, '', '#4ea8ff');
  if (!S.chk) { lab.setState({ emo: '🗺️', title: t.whereT, lead: t.whereLead, body: '', extra: '' }); return; }
  const list = `<ul class="hw-list">${S.tok.map((q) => `<li class="${q.ok ? 'ok' : 'no'}">${q.ok ? '✓' : '✗'} ${esc(t.tok[q.k])} → ${esc(t.zones[q.zone])}</li>`).join('')}</ul>`;
  lab.setState({ emo: right === 6 ? '✅' : '🌍', title: t.whereRes(right), lead: t.whereEnd, body: '', extra: list });
}
render();
</script>
