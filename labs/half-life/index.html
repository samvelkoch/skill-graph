// --- number helpers (read `lang` live) -------------------------------------------------------------------------
const grp = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, lang === 'en' ? ',' : ' ');
const dec = (x, d = 1) => x.toFixed(d).replace('.', lang === 'en' ? '.' : ',');
const fmtP = (p) => dec(p, Number.isInteger(p) ? 0 : 1);
const HL_DIE = Math.log(2) / -Math.log(5 / 6); // half-life of a die that changes an atom only on a 6, in throws
const yrWord = (n) => (lang === 'en' ? 'years' : lang === 'ru' ? ruPlural(Math.round(n), 'год', 'года', 'лет') : 'év');
function fmtYears(y, step = 1) {
  if (y >= 1e9) return `${dec(y / 1e9, 2)} ${{ en: 'billion years', ru: 'млрд лет', hu: 'milliárd év' }[lang]}`;
  if (y >= 1e6) return `${dec(y / 1e6, 1)} ${{ en: 'million years', ru: 'млн лет', hu: 'millió év' }[lang]}`;
  const v = Math.round(y / step) * step;
  return `${grp(v)} ${yrWord(v)}`;
}

// --- drawing helpers --------------------------------------------------------------------------------------------
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, r)); };
const SPR = new Map();
function sprite(kind, d) { // glossy sphere: p = unchanged parent (orange), d = changed daughter (grey-blue)
  const px = Math.max(2, Math.ceil(d * 2)), key = kind + px;
  let s = SPR.get(key); if (s) return s;
  s = document.createElement('canvas'); s.width = s.height = px;
  const g = s.getContext('2d'), r = px / 2, cols = kind === 'p' ? ['#ffe6b8', '#ff9a32', '#a9400b'] : ['#eaf1fb', '#8ba2bf', '#394c66'];
  const gr = g.createRadialGradient(r * 0.68, r * 0.6, r * 0.06, r, r, r);
  gr.addColorStop(0, cols[0]); gr.addColorStop(0.45, cols[1]); gr.addColorStop(1, cols[2]);
  g.fillStyle = gr; g.beginPath(); g.arc(r, r, r * 0.98, 0, Math.PI * 2); g.fill();
  if (px >= 12) { g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(r * 0.7, r * 0.56, r * 0.22, r * 0.14, -0.6, 0, Math.PI * 2); g.fill(); }
  SPR.set(key, s); return s;
}
function panel(c, b) {

  rr(c, b.x, b.y, b.w, b.h, 16); c.fillStyle = g; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(190,205,255,.16)'; c.stroke();
}
function pill(c, txt, x, y, o = {}) { // dark rounded pill with 12 px text, centred on x
  c.save(); c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(txt).width + 14, h = 20; let X = x - tw / 2;
  if (o.clip) X = clamp(X, o.clip.x + 3, o.clip.x + o.clip.w - tw - 3);

  const gh = Math.round(clamp((h - 2 * pad - gap) * 0.46, 120, 260));
  return { grid: { x: pad, y: pad, w: w - 2 * pad, h: gh, side: true }, plot: { x: pad, y: pad + gh + gap, w: w - 2 * pad, h: h - 2 * pad - gap - gh } };
}

// the atoms: a tray of glossy spheres; a changed atom pops and flashes
function drawAtoms(c, b, time, t) {

  const n = S.N, cols = S.cols, rows = n / cols, lw = b.side ? 122 : 0;
  const wAv = b.w - 20 - lw, hAv = b.h - 20 - (b.side ? 0 : 54);
  const cell = Math.max(1, Math.min(wAv / cols, hAv / rows)), gw = cell * cols, gh = cell * rows;
  const gx = b.x + 10 + (wAv - gw) / 2, gy = b.y + 10 + (hAv - gh) / 2;
  rr(c, gx - 5, gy - 5, gw + 10, gh + 10, 10); c.fillStyle = '#0a0e1f'; c.fill(); c.strokeStyle = 'rgba(190,205,255,.14)'; c.lineWidth = 1; c.stroke();

    if (par) np++;
    const fa = S.flash[i] >= 0 ? (time - S.flash[i]) / 0.5 : 2;

      const x = gx + (i % cols + 0.5) * cell, y = gy + (Math.floor(i / cols) + 0.5) * cell, r = Math.max(0, cell * (0.6 + 2.2 * fa));
      const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(255,236,170,${0.85 * (1 - fa)})`); g.addColorStop(1, 'rgba(255,170,60,0)');

  if (b.side) {
    const lx = b.x + b.w - lw + 2;
    c.font = '800 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.textAlign = 'left'; c.fillText(`${grp(n)} ${t.lg.atoms}`, lx, b.y + 18);

// the graph: axes + the mode's curve
function frame(c, b, o) {
  const ml = 46, mr = 22, mt = 28, mb = 38, px = b.x + ml, py = b.y + mt, pw = b.w - ml - mr, ph = b.h - mt - mb;
  panel(c, b);
  const X = (v) => px + (v / o.xmax) * pw, Y = (v) => py + ph - (v / o.ymax) * ph;
  c.save(); c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.lineWidth = 1;
  c.textBaseline = 'middle'; c.textAlign = 'right';
  for (const [v, l] of o.yt) { c.strokeStyle = 'rgba(190,205,255,.09)'; c.beginPath(); c.moveTo(px, Y(v)); c.lineTo(px + pw, Y(v)); c.stroke(); c.fillText(l, px - 7, Y(v)); }
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (const [v, l] of o.xt) { c.strokeStyle = 'rgba(190,205,255,.07)'; c.beginPath(); c.moveTo(X(v), py); c.lineTo(X(v), py + ph); c.stroke(); c.fillText(l, X(v), py + ph + 6); }
  c.strokeStyle = 'rgba(190,205,255,.4)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(px, py - 2); c.lineTo(px, py + ph); c.lineTo(px + pw + 4, py + ph); c.stroke();
  c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = '#c3cbe0'; c.font = '800 12px Nunito, sans-serif'; c.fillText(o.yTitle, b.x + 12, b.y + 14);
  c.textAlign = 'right'; c.fillText(o.xTitle, b.x + b.w - 10, b.y + b.h - 10);
  c.restore();
  return { px, py, pw, ph, X, Y, clip: b };
}
function curve(c, f, x0, x1, P, steps = 56) { c.beginPath(); for (let i = 0; i <= steps; i++) { const x = x0 + ((x1 - x0) * i) / steps; i ? c.lineTo(P.X(x), P.Y(f(x))) : c.moveTo(P.X(x), P.Y(f(x))); } }
function dashed(c, col, w = 2, dash = [5, 5]) { c.save(); c.setLineDash(dash); c.strokeStyle = col; c.lineWidth = w; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); c.restore(); }
function dot(c, x, y, r, pop = 0) {
  const rr_ = r * (1 + 0.7 * pop);
  const g = c.createRadialGradient(x, y, 0, x, y, rr_ * 3.2); g.addColorStop(0, 'rgba(255,170,70,.45)'); g.addColorStop(1, 'rgba(255,170,70,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, rr_ * 3.2, 0, Math.PI * 2); c.fill();
  const s = c.createRadialGradient(x - rr_ * 0.3, y - rr_ * 0.35, rr_ * 0.1, x, y, rr_); s.addColorStop(0, '#ffe6b8'); s.addColorStop(0.5, '#ff9a32'); s.addColorStop(1, '#b8480e');
  c.fillStyle = s; c.beginPath(); c.arc(x, y, Math.max(0, rr_), 0, Math.PI * 2); c.fill(); c.strokeStyle = 'rgba(40,16,4,.7)'; c.lineWidth = 1; c.stroke();
}
function stepLine(c, ev, N, tNow, P, ymax, scaleTo) { // a step function through the recorded events
  const k = scaleTo ? ymax / N : 1; let prev = N;
  c.beginPath(); c.moveTo(P.X(0), P.Y(N * k));
  for (let j = 0; j < ev.length; j += 2) { c.lineTo(P.X(ev[j]), P.Y(prev * k)); c.lineTo(P.X(ev[j]), P.Y(ev[j + 1] * k)); prev = ev[j + 1]; }

}
function legend(c, P, items) {
  c.save(); c.font = '700 12px Nunito, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left';
  let x = P.px + P.pw - items.reduce((a, it) => a + c.measureText(it[0]).width + 34, 0) + 8; const y = P.py + 12;

    c.fillStyle = '#98A0B8'; c.fillText(lbl, x + 23, y); x += c.measureText(lbl).width + 34;
  }
  c.restore();
}

function drawPlot(c, b, m, time, t) {

    const P = frame(c, b, { xmax, ymax: 400, xt: Array.from({ length: xmax / xs + 1 }, (_, i) => [i * xs, String(i * xs)]), yt: [0, 100, 200, 300, 400].map((v) => [v, String(v)]), yTitle: t.ax.y, xTitle: die ? t.ax.throws : t.ax.hl });
    c.save(); c.beginPath(); c.rect(b.x, b.y, b.w, b.h); c.clip();

    c.save(); c.beginPath(); c.rect(b.x, b.y, b.w, b.h); c.clip();

    if (g.started) dot(c, P.X(tt), P.Y(lastC), 4.5, g.run ? 0.25 + 0.25 * Math.sin(time * 8) : 0);
    c.restore();
    if (g.started && g.t > 0.05) pill(c, grp(lastC), P.X(tt) + 4, P.Y(lastC) - 18, { clip: P.clip, col: 'rgba(255,154,50,.6)' });
    const lg = [[t.lg.real, orange]]; if (g.started) lg.push([t.lg.ideal, 'rgba(255,226,176,.6)', [5, 4]]); if (g.ghost) lg.push([`${grp(g.ghost.N)}`, 'rgba(127,209,255,.7)', [4, 3]]);

  } else if (m === 'date') {

    c.save(); c.beginPath(); c.rect(b.x, b.y, b.w, b.h); c.clip();
    curve(c, (x) => 100 * 0.5 ** (x / C14), 0, 20000, P, 80);
    c.lineTo(P.X(20000), P.Y(0)); c.lineTo(P.X(0), P.Y(0)); c.closePath();
    const fg = c.createLinearGradient(0, P.py, 0, P.py + P.ph); fg.addColorStop(0, 'rgba(255,154,50,.22)'); fg.addColorStop(1, 'rgba(255,154,50,.02)'); c.fillStyle = fg; c.fill();
    curve(c, (x) => 100 * 0.5 ** (x / C14), 0, 20000, P, 80); c.strokeStyle = orange; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke();
    c.beginPath(); c.moveTo(P.px, P.Y(p)); c.lineTo(P.px + P.pw, P.Y(p)); dashed(c, 'rgba(255,226,176,.6)', 1.6, [5, 4]);
    dot(c, P.X(0), P.Y(100), 4.5, 0);

}

// simulation: a changed atom is marked in the grid at its own moment
function tickSim(m, dt, time) {
  if (m === 'coins') {
    for (let i = 0; i < S.N; i++) if (S.sched[i] && time >= S.sched[i]) { S.par[i] = 0; S.flash[i] = time; S.sched[i] = 0; }
  } else if (m === 'graph') {
    const g = S.g;
    if (!g.run) return;
    g.t = Math.min(TMAX, g.t + dt * (g.speed / 10));
    while (g.ptr < g.N && g.times[g.ptr] <= g.t) {
      S.par[g.ord[g.ptr]] = 0; S.flash[g.ord[g.ptr]] = time; g.left--; g.ev.push(g.times[g.ptr], g.left); g.ptr++;
    }
    if (g.t >= TMAX) { g.run = false; g.done = true; g.verdict = true; render(); return; }
    if (!g.verdict && g.t >= VERDICT_T) { g.verdict = true; render(); return; }
    lab.setReadout(String(g.left), T[lang].rd.atoms, T[lang].rd.gt(dec(g.t, 1)), '#ff9a32');
  }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const m = mode(), t = T[lang], b = layout(w, h);
  tickSim(m, dt, time);
  drawAtoms(c, b.grid, time, t);
  drawPlot(c, b.plot, m, time, t);
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const measuredHL = () => { const left = S.hist[S.hist.length - 1]; return S.steps > 0 && left > 0 && left < 400 ? (Math.LN2 * S.steps) / Math.log(400 / left) : null; };

function beginStep() { // one half-life (a coin for each atom left) or one throw (a die)
  const t0 = now(), p = S.die ? 1 / 6 : 0.5, D = S.die ? 0.6 : 0.9;
  S.busy = true; S.justPick = null;
  for (let i = 0; i < S.N; i++) if (S.par[i] && !S.sched[i] && Math.random() < p) S.sched[i] = t0 + 0.05 + Math.random() * (D - 0.35);
  sfx.tick();
  S.timer = setTimeout(() => {
    let left = 0;
    for (let i = 0; i < S.N; i++) { if (S.sched[i]) { S.par[i] = 0; S.flash[i] = now(); S.sched[i] = 0; } if (S.par[i]) left++; }
    S.hist.push(left); S.steps++; S.busy = false; S.popT = now(); render();
    if (S.queue > 0 && S.steps < maxSteps()) { S.queue--; beginStep(); } else S.queue = 0;
    if (!S.die && (S.steps === 1 || S.steps === 2)) { const ok = S.pred[S.steps - 1] === 1; if (S.pred[S.steps - 1] !== null) (ok ? sfx.good : sfx.bad)(); }
  }, D * 1000);
}
function startSecret(k) {
  if (!secret.unlocked()) return secret.open();
  if (S.sec === k) { S.sec = null; S.die = false; } else { S.sec = k; S.die = k === 'dice'; }
  initMode(); sfx.click(); render();
}

$('ctrlBody').addEventListener('click', (ev) => {

  const a = b.dataset.act, i = +b.dataset.i, g = S.g;

  else if (a === 'step') { if (S.busy) return; S.queue = +b.dataset.n - 1; beginStep(); showStage(); }
  else if (a === 'reset') { resetCoins(); sfx.click(); }
  else if (a === 'die') { S.die = b.dataset.v === 'die'; resetCoins(); sfx.click(); }
  else if (a === 'gopt') { g.pick = i; sfx.click(); }

    g.started = true; g.run = !g.run; sfx.click(); if (g.run) showStage();
  } else if (a === 'greset') { resetGraph(g.N, true); sfx.click(); }

function renderGraph(t) {
  const G = t.g, g = S.g, asking = g.pick === null, reveal = g.verdict || g.done, N = g.N;
  $('hlAskG').innerHTML = `<div class="hl-ask"><p class="hl-q">${esc(G.q)}</p><div class="hl-opts sk">${G.sk.map((l, i) => `<button type="button" class="hl-opt sk${reveal && i === 1 ? ' good' : ''}${reveal && g.pick === i && i !== 1 ? ' bad' : ''}${g.pick === i && !reveal ? ' pick' : ''}" data-act="gopt" data-i="${i}"${g.pick !== null ? ' disabled' : ''}>${sketch(i)}<span>${esc(l)}</span></button>`).join('')}</div></div>`;
  $('hlRun').textContent = g.done ? G.again : g.run ? G.pause : g.started ? G.resume : G.run; $('hlRun').disabled = asking;
  $('hlResetG').textContent = G.reset;
  $('hlNs').innerHTML = [40, 400, 4000].map((n) => `<button type="button" class="chip hl-c ${n === N ? 'on' : ''}" data-act="gn" data-n="${n}">${grp(n)}</button>`).join('');
  $('hlSpeedL').textContent = G.speed; $('hlSpeed').value = g.speed; $('hlSpeedV').textContent = `${dec(g.speed / 10, 1)}×`;
  lab.setReadout(String(g.left), t.rd.atoms, asking ? '' : t.rd.gt(dec(g.t, 1)), '#ff9a32');
  let st;
  if (asking) st = G.st0; else if (!g.started) st = G.ready; else if (!reveal) st = G.going;
  else st = [...G[g.pick === 1 ? 'ok' : 'no'], `${G.lead} ${G[`n${N}`]()}`];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' });
  lab.setFacts(asking ? [] : t.facts.graph);
}

function renderDate(t) {
  const D = t.d, d = S.d, i = d.find, f = FIND[i], isO = i === 3, pick = d.picks[i], revealed = isO || pick !== null, age = ageOf(C14, f.p);
  $('hlFinds').innerHTML = D.chips.map((l, k) => `<button type="button" class="chip hl-c ${k === i ? 'on' : ''}" data-act="find" data-i="${k}">${esc(l)}</button>`).join('');
  const opts = isO ? [] : D_OPTS[i];
  $('hlAskD').innerHTML = isO ? '' : askHTML(D.q(D.names[i], fmtP(f.p)), opts.map((v) => `${grp(v)} ${yrWord(v)}`), pick, opts.indexOf(age), revealed, 'dopt', `<p class="hl-read">${esc(D.read)}</p>`);
  const hl = Math.round(Math.log2(100 / f.p));
  lab.setReadout(`${fmtP(f.p)}%`, D.left, revealed ? `≈ ${fmtYears(age, isO ? 50 : 1)}` : '', '#ff9a32');
  let st;
  if (isO) st = D.otziSt(fmtYears(age, 50)); else if (!revealed) st = D.st0(D.names[i], fmtP(f.p));
  else st = D.res(opts[pick] === age, fmtP(f.p), hl, fmtYears(age));
  if (isO) { calcFill(D.calc(Math.log2(1 / 0.53), fmtYears(age, 50))); lab.setState({ emo: st[0], title: st[1], lead: st[2], body: D.otzi[2], extra: '' }); }
  else lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' });
  lab.setFacts(isO ? [t.facts.otzi, t.facts.libby] : revealed ? [t.facts.libby] : []);
}

function renderOld(t) {
  const O = t.o, o = S.o, T1 = CLOCKS[o.clock], x = Math.log2(100 / o.pct), age = ageOf(T1, o.pct), hlf = fmtYears(T1);
  $('hlClocks').innerHTML = O.clocks.map((l, k) => `<button type="button" class="chip hl-c ${k === o.clock ? 'on' : ''}" data-act="clock" data-i="${k}">${esc(l)}</button>`).join('');
  $('hlPctL').textContent = O.pctL; $('hlPct').value = o.pct; $('hlPctV').textContent = `${o.pct}%`;
  $('hlNote').textContent = O.notes[o.clock];
  lab.setReadout(fmtYears(age, 10), t.rd.pctLeft, `${o.pct}%`, '#ff9a32');
  calcFill(O.calc(hlf, o.pct, dec(x, 2), fmtYears(age, 10)));
  const st = O.st(fmtYears(age, 10), o.pct, dec(x, 2), hlf);
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: O.notes[o.clock], extra: '' });
  lab.setFacts([]);
}
initMode();
render();
</script>
