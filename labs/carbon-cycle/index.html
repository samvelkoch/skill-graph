  lab.setReadout(fmt(A), y.sub(S.yrs), burning ? y.burn.replace(/^\S+\s/, '') : y.nature.replace(/^\S+\s/, ''), burning ? '#ff8a3a' : '#5fb07a');
  let st;
  if (!pred) st = { emo: '🌫️', title: S.yrs === 0 ? y.q : y.natT, lead: S.yrs === 0 ? y.lead : y.natL(S.yrs), body: S.yrs === 0 ? '' : y.natB };
  else if (S.verdict && S.pred !== null) st = { emo: S.pred === 1 ? '✅' : '🔎', title: S.pred === 1 ? y.right : y.wrong, lead: y.verdict, body: y.burnB(b.coal, b.sinks, b.air) };
  else if (burning) st = { emo: '🏭', title: y.burnT(S.yrs), lead: y.burnL(A, A - A0), body: y.burnB(b.coal, b.sinks, b.air) };
  else st = { emo: '🌿', title: y.natT, lead: y.natL(S.yrs), body: y.natB };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(pred ? t.facts.years : t.facts.yearsPre);
}
render();
</script>
