  step(S3.mix.filter((p) => !p.joining), dt, time, confM, false);
  if (S3.phase === 'pour' && t >= 2.6) {
    S3.phase = 'react';
    GROUPS[pr.rx].forEach((spec, i) => {
      const mem = []; for (const sp of spec) { const q = S3.mix.find((p) => p.kind === 'ion' && p.sp === sp && !p.claimed && !p.dead); if (q) { q.claimed = true; mem.push(q); } }
      if (mem.length === spec.length) S3.groups.push({ mem, t0: 2.6 + i * 0.25, st: 0, mid: null });
    });
    render();
  }
  for (const g of S3.groups) {
    if (g.st === 0 && t >= g.t0) { g.st = 1; g.mid = { x: g.mem.reduce((s, p) => s + p.x, 0) / g.mem.length, y: g.mem.reduce((s, p) => s + p.y, 0) / g.mem.length }; g.mem.forEach((p) => { p.joining = true; }); }
    if (g.st === 1) {
      g.mem.forEach((p) => { p.x += (g.mid.x - p.x) * Math.min(1, dt * 6); p.y += (g.mid.y - p.y) * Math.min(1, dt * 6); });
      if (g.mem.every((p) => Math.hypot(p.x - g.mid.x, p.y - g.mid.y) < 2.5)) {
        g.st = 2; g.mem.forEach((p) => { p.dead = true; });
        const { x, y } = g.mid;
        if (pr.rx === 'ppt') for (let i = 0; i < 3; i++) { const gx = clamp(x + rnd(-8, 8), 118, 242); S3.prod.push({ k: 'g', x: gx, y: y + rnd(-6, 6), vy: 8, rest: false, ry: MIX.bot - 3 - heap(gx) - rnd(0, 4), seed: rnd(0, 6) }); }
        else if (pr.rx === 'gas') { [6, 4.6, 3.8].forEach((r, i) => S3.prod.push({ k: 'b', x: x + rnd(-5, 5), y, r, delay: i * 0.3, seed: rnd(0, 6) })); S3.mix.push(mk('w', 'w', x, y, { big: true })); }
        else if (pr.rx === 'wat') S3.mix.push(mk('w', 'w', x, y, { big: true }));
      }
    }
  }
  S3.mix = S3.mix.filter((p) => !p.dead);
  for (const q of S3.prod) {
    if (q.k === 'g' && !q.rest) { q.vy = Math.min(q.vy + 70 * dt, 70); q.y += q.vy * dt; q.x += Math.sin(time * 3 + q.seed) * 6 * dt; if (q.y >= q.ry) { q.y = q.ry; q.rest = true; } }
    else if (q.k === 'b') { if (q.delay > 0) q.delay -= dt; else { q.y -= (34 + q.r * 2) * dt; q.x += Math.sin(time * 6 + q.seed) * 10 * dt; if (q.y <= liqTop) { q.k = 'pop'; q.t = 0; q.y = liqTop; } } }
    else if (q.k === 'pop') q.t += dt;
  }
  S3.prod = S3.prod.filter((q) => !(q.k === 'pop' && q.t > 0.35));
  if (pr.rx === 'wat' && S3.phase === 'react' && t > 3.4) S3.heat = Math.min(1, S3.heat + dt * 0.45);
  if (time - S3.lastRd > 0.2) { S3.lastRd = time; if (lab.view === 'mix') mixReadout(); }
}

function drawMix(c, time, dt) {
  updateMix(dt, time);
  const pr = PAIRS[S3.pair], t = S3.t, play = S3.phase !== 'ready', ts = T[lang];
  const lvA = play ? 1 - 0.85 * ease(clamp(t / 1.9, 0, 1)) : 1, mixLv = play ? ease(clamp(t / 2, 0, 1)) : 0;
  const liqTop = MIX.bot - 133 * mixLv, topLiq = 148 - 70 * lvA, ta = clamp((lvA - 0.15) / 0.4, 0, 1);
  [[pr.a, TOPB[0], S3.topA], [pr.b, TOPB[1], S3.topB]].forEach(([side, x0, arr]) => {
    glassBeaker(c, x0, 52, 100, 100, topLiq, (cc) => { for (const p of arr) ball(cc, p.x, p.y, rad(p), SP[p.sp].c, SP[p.sp].s, ta); });
    pill2(c, ts.m.sol[side.k], SOLF[side.k], x0 + 50, 24);
    c.fillStyle = '#9aa3c0'; c.beginPath(); c.roundRect(x0 === TOPB[0] ? x0 + 88 : x0 + 4, 150, 8, 8, 2); c.fill();
  });
  c.fillStyle = 'rgba(200,210,240,.55)'; c.font = `900 30px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('+', 180, 104);
  if (play && t < 2.05) {
    const a = t < 0.2 ? t / 0.2 : t > 1.85 ? (2.05 - t) / 0.2 : 1;
    [[122, 156, 150], [238, 156, 210]].forEach(([x0, y0, x1]) => {
      const y1 = Math.max(liqTop, 262), xm = (x0 + x1) / 2 + (x0 < 180 ? 14 : -14);
      c.save(); c.globalAlpha = a; c.lineCap = 'round';
      c.strokeStyle = 'rgba(110,180,250,.75)'; c.lineWidth = 5; c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(xm, y0 + 40, x1, y1); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x0 - 1, y0); c.quadraticCurveTo(xm - 1, y0 + 40, x1 - 1, y1); c.stroke(); c.restore();
    });
  }
  glassBeaker(c, 104, 232, 152, 180, play ? liqTop : 999, (cc) => {
    for (const p of S3.mix) drawP(cc, p);
    for (const q of S3.prod) {
      if (q.k === 'g') { const hg = cc.createRadialGradient(q.x, q.y, 1, q.x, q.y, 9); hg.addColorStop(0, 'rgba(255,255,255,.28)'); hg.addColorStop(1, 'rgba(255,255,255,0)'); cc.fillStyle = hg; cc.beginPath(); cc.arc(q.x, q.y, 9, 0, 6.2832); cc.fill(); }
    }
    for (const q of S3.prod) {
      if (q.k === 'g') { cc.fillStyle = '#f6f8ff'; cc.beginPath(); cc.roundRect(q.x - 3.4, q.y - 3.4, 6.8, 6.8, 2); cc.fill(); cc.strokeStyle = 'rgba(10,12,24,.4)'; cc.lineWidth = 0.8; cc.stroke(); }
      else if (q.k === 'b' && q.delay <= 0) drawBubble(cc, q.x, q.y, q.r, 1);
      else if (q.k === 'pop') { cc.strokeStyle = `rgba(235,245,255,${0.8 * (1 - q.t / 0.35)})`; cc.lineWidth = 1.2; cc.beginPath(); cc.arc(q.x, q.y, 5 + q.t * 28, 0, 6.2832); cc.stroke(); }
    }
  });
  // thermometer: the same on every pair; only one of them warms up
  const fr = 0.2 + 0.5 * ease(S3.heat), ty = 394 - 150 * fr;
  c.fillStyle = 'rgba(210,225,255,.12)'; c.strokeStyle = 'rgba(205,225,255,.6)'; c.lineWidth = 1.6; c.beginPath(); c.roundRect(295, 244, 10, 150, 5); c.fill(); c.stroke();
  const mg = c.createLinearGradient(295, 0, 305, 0); mg.addColorStop(0, '#ff8a7d'); mg.addColorStop(1, '#e03a2f');
  c.fillStyle = mg; c.beginPath(); c.roundRect(297.5, ty, 5, 396 - ty, 2); c.fill();
  c.beginPath(); c.arc(300, 402, 11, 0, 6.2832); c.fillStyle = mg; c.fill(); c.strokeStyle = 'rgba(205,225,255,.6)'; c.stroke();
  c.strokeStyle = 'rgba(205,225,255,.45)'; c.lineWidth = 1; c.beginPath(); for (let i = 0; i < 6; i++) { const y = 252 + i * 24; c.moveTo(308, y); c.lineTo(i % 2 ? 313 : 318, y); } c.stroke();
  c.fillStyle = '#98A0B8'; c.font = `800 13px ${FONT}`; c.textAlign = 'center'; c.fillText('°C', 300, 428);
  // legend
  const rows = []; const seen = new Set();
  [...pr.a.ions, ...pr.b.ions].forEach(([sp]) => { if (!seen.has(sp)) { seen.add(sp); rows.push([{ k: 'ion', sp }, SP[sp].f]); } });
  if (S3.phase === 'react' || S3.phase === 'done') {
    if (pr.rx === 'ppt') rows.push([{ k: 'ppt' }, 'AgCl ↓']);
    if (pr.rx === 'gas') rows.push([{ k: 'gas' }, 'CO₂ ↑'], [{ k: 'w' }, 'H₂O']);
    if (pr.rx === 'wat') rows.push([{ k: 'w' }, 'H₂O']);
  }
  rows.forEach(([ic, lab2], i) => legendRow(c, 250 + i * 24, ic, lab2));
}
function mixReadout() {
  const t = T[lang], pr = PAIRS[S3.pair], n0 = mixTotal(pr), g = S3.pred[S3.pair];
  if (g === null) lab.setReadout(n0, t.m.rdAsk, '', '#8f86e8');
  else if (S3.phase === 'react' || S3.phase === 'done') lab.setReadout(`${n0} → ${mixIons()}`, t.m.rd, t.m.pillOut[OUTI[pr.rx]], '#8f86e8');
  else lab.setReadout(n0, t.m.rdAsk, '', '#8f86e8');
}

// --- shell and controls (all state above is declared) ---------------------------------------------------------------
const lab = shell({ key: 'ions-conduct', T, topics: TOPICS, views: ['bulb', 'ions', 'mix'], onLang: render, onView: render });
const secret = secretLab('ions-conduct', () => ({
  secrets: [{ emo: '🧂', title: T[lang].secrets.dry[0], desc: T[lang].secrets.dry[1] }, { emo: '🔥', title: T[lang].secrets.melt[0], desc: T[lang].secrets.melt[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="s1"><div class="ic-chips" id="b-chips"></div><div id="b-pred"></div></div>
  <div id="s2"><div class="ic-row" style="margin-top:0"><button class="chip" data-act="salt" id="i-salt"></button><button class="chip" data-act="empty" id="i-empty"></button></div><div id="i-pred"></div><div class="ic-row"><button class="btn" data-act="cur" id="i-cur"></button></div></div>
  <div id="s3"><div class="ic-chips" id="m-chips"></div><div id="m-pred"></div></div>`;

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function select1(i) { S1.sel = i; S1.L = fillLens(BK[i]); }
function select3(k) { S3.pair = k; startMix(S3.pred[k] !== null); }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = +b.dataset.k;
  if (a === 'sel') { select1(k); sfx.click(); }
  else if (a === 'sec') return secret.open();
  else if (a === 'p1') { S1.pred[S1.sel] = k; S1.t0 = nowS(); const L = lvlOf(glowOf(freeN(BK[S1.sel]))); (k === L ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'next1') { const nx = [0, 1, 2, 3, 4, 5].find((i) => S1.pred[i] === null); if (nx !== undefined) { select1(nx); sfx.click(); } }
  else if (a === 'salt') { if (S2.salt < 4) { S2.salt++; addCrystal(); sfx.tick(); } }
  else if (a === 'empty') { S2.salt = 0; initLens2(); sfx.click(); }
  else if (a === 'p2') { S2.pred = k; sfx.click(); }
  else if (a === 'cur') { if (S2.pred === null) return; S2.on = !S2.on; if (S2.on) { S2.wasOn = true; showStage(); (S2.pred === 1 ? sfx.good : sfx.bad)(); } else sfx.click(); }
  else if (a === 'pair') { select3(k); sfx.click(); }
  else if (a === 'p3') { S3.pred[S3.pair] = k; startMix(true); (k === OUTI[PAIRS[S3.pair].rx] ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'again') { startMix(true); sfx.click(); }
  render();
});

// --- one render per change ----------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('s1').hidden = v !== 'bulb'; $('s2').hidden = v !== 'ions'; $('s3').hidden = v !== 'mix';
  if (v === 'bulb') renderBulb(t); else if (v === 'ions') renderIons(t); else renderMix(t);
}
const fineHtml = (t) => `<div class="ic-fine">${esc(t.fine)}</div>`;

function renderBulb(t) {
  const i = S1.sel, g = S1.pred[i], rev = g !== null, unlocked = secret.unlocked();
  const L = lvlOf(glowOf(freeN(BK[i]))), ok = g === L, done6 = [0, 1, 2, 3, 4, 5].every((k) => S1.pred[k] !== null);
  const mark = (k) => (S1.pred[k] === null ? '' : S1.pred[k] === lvlOf(glowOf(freeN(BK[k]))) ? ' ✓' : ' ✗');
  lab.setGlow('rgba(245, 200, 76, .22)');
  const chip = (k) => `<button class="chip${k === i ? ' on' : ''}" data-act="sel" data-k="${k}">${esc(t.b.shorts[k])}${mark(k)}</button>`;
  const sec = (k) => `<button class="chip secret ${unlocked ? 'open' : ''} ${k === i ? 'on' : ''}" data-act="${unlocked ? 'sel' : 'sec'}" data-k="${k}">${unlocked ? esc(t.b.shorts[k]) + mark(k) : '🔒 ???'}</button>`;
  $('b-chips').innerHTML = [0, 1, 2, 3, 4, 5].map(chip).join('') + sec(6) + sec(7);
  const left = [0, 1, 2, 3, 4, 5].some((k) => S1.pred[k] === null);
  $('b-pred').innerHTML = rev
    ? (left ? `<div class="ic-row"><button class="btn" data-act="next1">${esc(t.b.next)}</button></div>` : '')
    : `<div class="ic-q">${esc(t.b.q)}</div><div class="ic-opts">${t.b.opts.map((o, k) => `<button class="chip" data-act="p1" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  if (!rev) {
    lab.setReadout('?', t.b.rdAsk, '', '#f5c84c');
    lab.setState({ emo: '🔋', title: t.b.names[i], lead: t.b.ask, body: '', extra: fineHtml(t) });
  } else {
    lab.setReadout(freeN(BK[i]), t.b.ions, t.b.pill[L], '#f5c84c');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.no, lead: t.b.res[i], body: ok ? '' : t.b.you(t.b.lvl[g], t.b.lvl[L]),
      extra: (done6 ? `<p><b>${esc(t.b.done([0, 1, 2, 3, 4, 5].filter((k) => S1.pred[k] === lvlOf(glowOf(freeN(BK[k])))).length))}</b> ${esc(t.b.idea)}</p>` : '') + fineHtml(t) });
  }
  const f = t.facts;
  lab.setFacts(rev && i >= 6 ? f.bs : done6 ? [...f.b, ...f.b2] : f.b);
}

function renderIons(t) {
  const n = ionCount2(), started = S2.salt > 0, g = S2.pred, I = t.i;
  lab.setGlow('rgba(79, 201, 164, .2)');
  $('i-salt').textContent = S2.salt >= 4 ? I.addMax : `${I.add} (${S2.salt}/4)`; $('i-salt').disabled = S2.salt >= 4;
  $('i-empty').textContent = I.empty; $('i-empty').disabled = S2.salt === 0;
  $('i-pred').innerHTML = started && g === null
    ? `<div class="ic-q">${esc(I.q)}</div><div class="ic-opts">${I.opts.map((o, k) => `<button class="chip" data-act="p2" data-k="${k}">${esc(o)}</button>`).join('')}</div>`
    : g !== null ? `<div class="ic-sub">${esc(I.you(I.opts[g]))}</div>` : '';
  $('i-cur').textContent = g === null ? (started ? I.needPred : I.on) : S2.on ? I.off : I.on;
  $('i-cur').disabled = g === null;
  const lv = I.lvl[lvl4(glowOf(n))];
  lab.setReadout(n, I.sub, S2.on ? lv : I.pill0, '#4fc9a4');
  let st;
  if (S2.on) { const ok = g === 1; st = { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.no, lead: I.onLead, body: I.more(n, lv) }; }
  else if (g !== null && S2.wasOn) st = { emo: '🔌', title: I.off[0], lead: I.off[1], body: '' };
  else if (g !== null) st = { emo: '⚡', title: I.s2[0], lead: I.s2[1], body: '' };
  else if (started) st = { emo: '🧂', title: I.s1[0], lead: I.s1[1], body: I.askBody };
  else st = { emo: '💧', title: I.s0[0], lead: I.s0[1], body: '' };
  lab.setState({ ...st, extra: `<div class="ic-fine">${esc(I.fine)}</div>` });
  lab.setFacts(t.facts.i);
}

function renderMix(t) {
  const pi = S3.pair, pr = PAIRS[pi], g = S3.pred[pi], M = t.m, ph = S3.phase;
  const ok = g === OUTI[pr.rx];
  lab.setGlow('rgba(143, 134, 240, .22)');
  $('m-chips').innerHTML = PAIRS.map((p, k) => `<button class="chip${k === pi ? ' on' : ''}" data-act="pair" data-k="${k}">${esc(p.chip)}${S3.pred[k] === null ? '' : S3.pred[k] === OUTI[p.rx] ? ' ✓' : ' ✗'}</button>`).join('');
  $('m-pred').innerHTML = g === null
    ? `<div class="ic-q">${esc(M.q)}</div><div class="ic-opts">${M.opts.map((o, k) => `<button class="chip" data-act="p3" data-k="${k}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="ic-row"><button class="chip" data-act="again">${esc(M.again)}</button></div>`;
  mixReadout();
  if (g === null || ph === 'ready') lab.setState({ emo: '⚗️', title: `${M.pairs[pi]}`, lead: M.ready, body: g === null ? M.ask : '', extra: fineHtml(t) });
  else if (ph === 'pour') lab.setState({ emo: '🥤', title: M.pour[0], lead: M.pour[1], body: '', extra: '' });
  else {
    const R = M.res[pi];
    lab.setState({ emo: ok ? '✅' : '🤔', title: `${ok ? t.right : t.no} ${R[0]}`, lead: R[1], body: ok ? '' : M.you(M.out[g], M.out[OUTI[pr.rx]]),
      extra: `<div class="ic-eq">${esc(M.eq[pi])}</div><div class="ic-sp">${esc(M.spect[pi])}</div>` });
  }
  lab.setFacts(pi === 0 && g !== null && ph !== 'ready' && ph !== 'pour' ? [...t.facts.m, ...t.facts.m0] : t.facts.m);
}

// --- the loop ---------------------------------------------------------------------------------------------------------------------
let lastN = -1;
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view, s = Math.min(w / W, h / H);
  if (v === 'ions') { const n = ionCount2(); if (n !== lastN) { lastN = n; render(); } }
  const tg = glowTarget(v); G.b += (tg - G.b) * Math.min(1, dt * (tg > G.b ? 5 : 8)); G.cur = G.b;
  c.save(); c.translate((w - W * s) / 2, (h - H * s) / 2); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  if (v === 'mix') drawMix(c, time, dt); else drawLab(c, v, time, dt);
  c.restore();
});
render();
</script>
</body>
