const cv = $('cv'), pos = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };

  const n = nearestSeat(px, py), v = lab.view; if (!n) return;
  const cur = S.seat[v];
  if (n.j !== cur.j || n.a !== cur.a) { S.seat[v] = { j: n.j, a: n.a }; S.moved = true; S.dragged = true; sfx.tick(); sync(); }
}
cv.addEventListener('pointerdown', (ev) => {
  const [px, py] = pos(ev), v = lab.view;
  if (S.sec === 'a') {
    const hit = S.a.hit.find((q) => px >= q.x && px <= q.x + q.w && py >= q.y && py <= q.y + q.h);
    if (hit && !S.a.t[hit.i]) { S.a.t[hit.i] = true; sfx.good(); if (S.a.t[0] && S.a.t[1]) S.a.t0 = now(); sync(); }
    return;
  }
  if (S.sec === 'b') {
    if (!S.b.labs) return;
    const L = [...S.b.labs].reverse().find((q) => !q.placed && Math.abs(px - q.x) <= q.w / 2 && Math.abs(py - q.y) <= q.h / 2 + 4);
    if (L) { S.b.drag = { lab: L, dx: L.x - px, dy: L.y - py }; S.b.msg = ''; S.b.pz = null; cv.setPointerCapture(ev.pointerId); sfx.click(); sync(); }
    return;
  }
  if ((v === 'shape' || v === 'whisper') && S.pick[v] !== null && S.geo && py < S.geo.A.y + S.geo.A.h) { S.dragSeat = true; S.moved = false; cv.setPointerCapture(ev.pointerId); moveSeat(px, py); }
});
cv.addEventListener('pointermove', (ev) => {
  const [px, py] = pos(ev);
  if (S.sec === 'b' && S.b.drag) { const d = S.b.drag; d.lab.x = px + d.dx; d.lab.y = py + d.dy; S.b.pz = zoneAt(S.geo, d.lab.x, d.lab.y); return; }
  if (S.dragSeat) moveSeat(px, py);
});
const endPointer = () => {
  if (S.sec === 'b' && S.b.drag) {
    const L = S.b.drag.lab, z = zoneAt(S.geo, L.x, L.y);
    S.b.drag = null; S.b.pz = null;
    if (z === L.k) { L.placed = true; S.b.msg = ''; sfx.snap(); } else { S.b.msg = z ? 'wrong' : ''; sfx.bad(); }
    sync(); return;
  }
  if (S.dragSeat) {
    S.dragSeat = false;
    if (lab.view === 'whisper' && S.moved && S.last) { S.arrived = false; S.rings.push({ t0: now(), reached: false }); sync(); }
  }
};
cv.addEventListener('pointerup', endPointer); cv.addEventListener('pointercancel', endPointer);

// --- controls -----------------------------------------------------------------------------------------------------
function predHTML(v) {
  const t = T[lang].pred[v], pick = S.pick[v], done = pick !== null, right = RIGHT[v];
  const chips = t.opts.map((o, i) => `<button class="gt-opt${done ? (i === right ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="opt" data-v="${v}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = done ? `<div class="gt-verdict ${pick === right ? 'good' : 'bad'}">${esc(pick === right ? t.yes : t.no)}</div>` : '';
  return `<div class="gt-q">${esc(t.q)}</div><div class="gt-opts">${chips}</div>${verdict}`;
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(v, i) {
  if (S.pick[v] !== null) return;
  S.pick[v] = i; S.revT[v] = now();
  (i === RIGHT[v] ? sfx.good : sfx.bad)();
  if (v === 'shape') { S.sTgt = 1; S.nextPulse = now() + 1.2; }
  if (v === 'whisper') { S.last = 'coin'; S.arrived = false; S.rings.push({ t0: now() + 0.5, reached: false }); }
  render(); showStage();
}
const maskThumbs = () => {
  document.querySelectorAll('#gtMaskRow canvas').forEach((cn) => {
    const d = Math.min(window.devicePixelRatio || 1, 2); cn.width = 48 * d; cn.height = 56 * d;
    const x = cn.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); drawMask(x, cn.dataset.k, 24, 26, 12);
  });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v = lab.view;
  if (a === 'opt') return answer(b.dataset.v, +b.dataset.i);
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k;
    if (S.sec === 'a') S.a = { t: [false, false], t0: 0, hit: [] };
    if (S.sec === 'b') initLabs();
    sfx.click(); showStage();
  } else if (a === 'mon') { S.mask.on = b.dataset.on === '1'; sfx.click(); }
  else if (a === 'mk') {
    const g = S.g, k = b.dataset.k; if (g.i >= 4 || g.lock || g.dead.includes(k)) return;
    S.mask = { on: true, kind: k };
    if (k === KINDS[g.i]) {
      g.first[g.i] = g.dead.length === 0; g.msg = 'right'; g.lock = true; sfx.good();
      setTimeout(() => { g.i++; g.dead = []; g.msg = ''; g.lock = false; render(); }, 1000);
    } else { g.dead.push(k); g.msg = 'wrong'; sfx.bad(); }
  } else if (a === 'again') { S.g = { i: 0, dead: [], first: [], msg: '', lock: false }; sfx.click(); }
  else if (a === 'src') {
    S.last = b.dataset.k; S.arrived = false; S.rings.push({ t0: now(), reached: false });
    (S.last === 'coin' ? sfx.tick : S.last === 'whisper' ? sfx.click : sfx.push)();
  } else if (a === 'nz') { S.noise[b.dataset.k] = !S.noise[b.dataset.k]; sfx.click(); }
  render();
});
$('gtSlider').addEventListener('input', (ev) => {
  if (S.pick.shape === null) return;
  S.s = S.sTgt = S.sSync = ev.target.value / 100; sync();
});

// --- one render per change: controls (render) and the readout, state card and facts (sync) ----------------------------
const sec = (k, emo, t) => { const open = secret.unlocked(); return `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`; };
function render() {
  const t = T[lang], v = lab.view, ans = S.pick[v] !== null, inSec = !!S.sec;
  const showShape = !inSec && v === 'shape' && ans, showMasks = !inSec && v === 'masks' && ans, showWh = !inSec && v === 'whisper' && ans;
  document.body.dataset.v = inSec ? 'sec-' + S.sec : v;
  $('gtPred').hidden = inSec; $('gtPred').innerHTML = inSec ? '' : predHTML(v);
  $('gtShape').hidden = !showShape; $('gtMasks').hidden = !showMasks; $('gtWhisper').hidden = !showWh;
  $('gtSecA').hidden = S.sec !== 'a'; $('gtSecB').hidden = S.sec !== 'b';
  // nothing of an unanswered view's controls is in the page text: the sections are filled only when they are shown
  const txt = (id, str, on) => { $(id).textContent = on ? str : ''; };
  txt('gtShLbl', t.sh.label, showShape); txt('gtE0', t.sh.e0, showShape); txt('gtE1', t.sh.e1, showShape); txt('gtE2', t.sh.e2, showShape); txt('gtShHint', t.sh.hint, showShape);
  $('gtSlider').setAttribute('aria-label', showShape ? t.sh.label : ''); $('gtSlider').value = Math.round(S.s * 100);
  const g = S.g, done = g.i >= 4;
  txt('gtMoff', t.mk.off, showMasks); txt('gtMon', t.mk.on, showMasks);
  $('gtMoff').classList.toggle('on', !S.mask.on); $('gtMon').classList.toggle('on', S.mask.on);
  txt('gtLine', done ? '' : `“${t.mk.lines[g.i]}”`, showMasks); $('gtLine').hidden = done;
  $('gtMaskRow').hidden = done;
  $('gtMaskRow').innerHTML = showMasks ? MROW.map((k) => `<button class="gt-mk${g.dead.includes(k) ? ' bad' : ''}${g.msg === 'right' && k === KINDS[g.i] ? ' good' : ''}" data-act="mk" data-k="${k}"><canvas data-k="${k}"></canvas><span>${esc(t.mk.names[k])}</span></button>`).join('') : '';
  maskThumbs();
  txt('gtFb', g.msg === 'right' ? t.mk.right : g.msg === 'wrong' ? t.mk.wrongM : '', showMasks); $('gtFb').className = `gt-fb ${g.msg === 'right' ? 'good' : g.msg === 'wrong' ? 'bad' : ''}`; $('gtFb').hidden = done;
  $('gtAgain').hidden = !done; txt('gtAgain', t.mk.again, showMasks);
  $('gtSrc').innerHTML = showWh ? ['coin', 'whisper', 'speak'].map((k) => `<button class="gt-btn${S.last === k ? ' on' : ''}" data-act="src" data-k="${k}">${esc(t.wh[k])}</button>`).join('') : '';
  $('gtNz').innerHTML = showWh ? ['wind', 'crowd'].map((k) => `<button class="gt-btn${S.noise[k] ? ' on' : ''}" data-act="nz" data-k="${k}">${esc(t.wh[k])}</button>`).join('') : '';
  txt('gtMcap', t.wh.mcap, showWh); txt('gtMl1', t.wh.quietLbl, showWh); txt('gtMl2', `▲ ${t.wh.noiseLbl}`, showWh); txt('gtWhHint', t.wh.hint, showWh);
  txt('gtSaHint', t.sa.hint, S.sec === 'a'); txt('gtSbHint', t.sb.hint, S.sec === 'b');
  $('gtSecs').innerHTML = sec('a', '🐐', t) + sec('b', '🏛️', t);
  sync();
}
function whisperNums() {
  const j = S.seat.whisper.j, L = SRC[S.last] * baseLevel(j, 1), T0 = 0.01 + (S.noise.wind ? 0.03 : 0) + (S.noise.crowd ? 0.05 : 0), r = L / T0;
  return { L, T0, r, lvl: r < 1 ? 'cant' : r < 2.5 ? 'barely' : r < 8 ? 'hear' : 'loud' };
}
function sync() {
  const t = T[lang], v = lab.view;
  if (S.sec === 'a') return syncA(t);
  if (S.sec === 'b') return syncB(t);
  if (v === 'shape') syncShape(t); else if (v === 'masks') syncMasks(t); else syncWhisper(t);
}
function syncShape(t) {
  lab.setGlow('rgba(224, 160, 90, .26)');
  if (S.pick.shape === null) { lab.setReadout('?', '', '', '#e0a05a'); lab.setState({ emo: '🤔', title: t.pred.shape.q, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  const s = S.s, j = S.seat.shape.j, see = sightOf(j, s), hear = hearOf(j, s), d = Math.round(distRow(j)), n = j + 1;
  const nm = s < 0.08 ? t.sh.names.flat : s < 0.62 ? t.sh.names.bowl : t.sh.names.steep, ok = see && hear !== 'none';
  lab.setReadout(`<span class="gt-rq">${esc(t.sh.see)}</span> ${esc(see ? t.sh.yes : t.sh.no)}`, `${t.sh.hears}: ${t.sh.hearW[hear]} · ${t.sh.row(n, d)}`, nm, ok ? '#3ddc97' : '#ff8a5c');
  const k = !see && hear === 'none' ? 'both' : !see ? 'blind' : hear === 'none' ? 'deaf' : j === 0 ? 'front' : 'good', e = { both: '🙈', blind: '🙈', deaf: '🔇', front: '🪑', good: '✅' }[k], x = t.sh[k];
  lab.setState({ emo: e, title: x[0], lead: x[1](n, d), body: x[2], extra: '' });
  lab.setFacts(t.facts.shape);
}
function syncMasks(t) {
  lab.setGlow('rgba(240, 200, 120, .24)');
  if (S.pick.masks === null) { lab.setReadout('?', '', '', '#f0c878'); lab.setState({ emo: '🤔', title: t.pred.masks.q, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  const g = S.g, on = S.mask.on, done = g.i >= 4;
  lab.setReadout(on ? `🎭 ${esc(t.mk.names[S.mask.kind])}` : `👤 ${esc(t.mk.noMask)}`, on ? t.mk.readable : t.mk.dot, done ? t.mk.done : t.mk.line(g.i + 1), '#f0c878');
  if (done) lab.setState({ emo: '🏆', title: t.mk.allT, lead: t.mk.allL, body: '', extra: '' });
  else if (on) lab.setState({ emo: '🎭', title: t.mk.which, lead: `“${t.mk.lines[g.i]}”`, body: g.msg === 'wrong' ? t.mk.wrongM : g.msg === 'right' ? t.mk.right : t.mk.tryOne, extra: '' });
  else lab.setState({ emo: '👤', title: t.mk.dotT, lead: t.mk.dotL, body: t.mk.dotB, extra: '' });
  lab.setFacts(t.facts.masks);
}
function syncWhisper(t) {
  lab.setGlow('rgba(110, 170, 240, .26)');
  if (S.pick.whisper === null) { lab.setReadout('?', '', '', '#6eaaf0'); lab.setState({ emo: '🤔', title: t.pred.whisper.q, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  const { L, T0, r, lvl } = whisperNums(), d = Math.round(distRow(S.seat.whisper.j)), noise = S.noise.wind && S.noise.crowd ? 'both' : S.noise.wind ? 'wind' : S.noise.crowd ? 'crowd' : 'quiet';
  $('gtFill').style.width = S.arrived ? `${(fOf(L) * 100).toFixed(1)}%` : '0%';
  $('gtNoise').style.left = `${(fOf(T0) * 100).toFixed(1)}%`;
  if (!S.arrived) { lab.setReadout('…', t.wh.wait, t.wh.noiseN[noise], '#6eaaf0'); lab.setState({ emo: '🪙', title: t.wh.wait, lead: t.wh.lead[S.last](d), body: '', extra: `<div>${esc(t.wh.extra)}</div>` }); lab.setFacts(t.facts.whisper); return; }
  lab.setReadout(`${t.wh.emo[lvl]} ${esc(t.wh.lvl[lvl])}`, `${t.wh.lead[S.last](d)}`, t.wh.noiseN[noise], r >= 2.5 ? '#3ddc97' : '#f5c84c');
  lab.setState({ emo: { coin: '🪙', whisper: '🤫', speak: '🗣️' }[S.last], title: t.wh.lvl[lvl], lead: t.wh.lead[S.last](d), body: r < 2.5 ? (noise !== 'quiet' ? t.wh.bodyNoise : t.wh.bodyFar) : t.wh.bodyOk, extra: `<div>${esc(t.wh.extra)}</div>` });
  lab.setFacts(t.facts.whisper);
}
function syncA(t) {
  lab.setGlow('rgba(244, 197, 66, .24)');
  const n = (S.a.t[0] ? 1 : 0) + (S.a.t[1] ? 1 : 0);
  lab.setReadout('🐐 + 🎵', t.sa.ph(n), '', '#f4c542'); lab.setFacts([]);
  if (n === 0) lab.setState({ emo: '🐐', title: t.sa.t0, lead: t.sa.l0, body: '', extra: '' });
  else if (n === 1) lab.setState({ emo: '🐐', title: t.sa.t1, lead: t.sa.l1, body: '', extra: '' });
  else lab.setState({ emo: '🎭', title: t.sa.t2, lead: t.sa.l2, body: '', extra: '' });
}
function syncB(t) {
  lab.setGlow('rgba(224, 160, 90, .26)');
  const n = S.b.labs ? S.b.labs.filter((q) => q.placed).length : 0;
  lab.setReadout(`${n}/3`, t.sb.ph(n), '', '#e0a05a'); lab.setFacts([]);
  if (n === 3) lab.setState({ emo: '🏛️', title: t.sb.t3, lead: t.sb.l3, body: t.sb.b3, extra: '' });
  else lab.setState({ emo: '🏛️', title: t.sb.t0, lead: S.b.msg === 'wrong' ? t.sb.wrong : t.sb.l0, body: '', extra: '' });
}
render();
</script>
</body>
