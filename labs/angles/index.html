const D2R = Math.PI / 180;
const nf = (x, d = 0) => new Intl.NumberFormat(lang, { maximumFractionDigits: d }).format(Math.abs(x) < 1e-9 ? 0 : x);
const pt = (cx, cy, r, deg) => [cx + r * Math.cos(deg * D2R), cy - r * Math.sin(deg * D2R)];
const TYPE_COL = { zero: '#98A0B8', acute: '#4ea8ff', right: '#3ddc97', obtuse: '#ff8a3d', straight: '#f5c84c', reflex: '#c77dff', full: '#ff5d8f' };
const EMO = { zero: '⚪', acute: '📐', right: '✅', obtuse: '🪟', straight: '➖', reflex: '🌀', full: '🔄' };
const OUT = '#7fd4ff', INN = '#ffb066';
const typeOf = (a) => (a <= 0 ? 'zero' : a < 90 ? 'acute' : a === 90 ? 'right' : a < 180 ? 'obtuse' : a === 180 ? 'straight' : a < 360 ? 'reflex' : 'full');
const glow = (hex) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},.22)`; };
const divisors = (n) => { let d = 0; for (let i = 1; i <= n; i++) if (n % i === 0) d++; return d; };
const DRAW_LIST = [135, 50, 70, 110, 155, 25, 80, 120];

const S = {
  answered: store.get('angles:asked', false), answer: null, secret: null,
  ang: 40, tgt: null, len: 0.6, lenMoved: false, mark: null,
  pmode: 'measure', P: null, drawIdx: 0,
  scene: 'clock', clock: 180, door: 60, pizza: 8, robot: 90,
  n: 7,
  sz: { w: 400, h: 300 },
  tri: [[0.2, 0.52], [0.82, 0.46], [0.42, 0.14]], tear: 0, tearAnim: false,
};

function newProblem() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  if (S.pmode === 'measure') {
    let th;
    do { th = 15 + 5 * Math.floor(Math.random() * 31); } while (th === 90);
    const mirror = 180 - th, pool = [th + 5, th - 5, th + 10, th - 10].filter((v) => v > 0 && v < 180 && v !== mirror && v !== th);
    pool.sort(() => Math.random() - 0.5);
    const choices = [th, mirror, pool[0], pool[1]].sort(() => Math.random() - 0.5);
    S.P = { th, dir, px: dir === 1 ? 0.2 : 0.8, py: 0.4, snapped: false, choices, tried: [], done: false, fb: null, drag: null };
  } else {
    const th = DRAW_LIST[S.drawIdx++ % DRAW_LIST.length];
    S.P = { th, dir, snapped: true, arm: 90, res: null, drag: null };
  }
}
newProblem();

const lab = shell({ key: 'angles', T, topics: TOPICS, views: ['turn', 'prot', 'around'], onLang: render, onView: () => { S.secret = null; render(); } });
const secret = secretLab('angles', () => ({

}), () => render());
const mode = () => S.secret || lab.view;

$('sX').addEventListener('input', () => {

  if (m === 's2') { S.tear = v / 100; S.tearAnim = false; }
  else if (m === 's1') S.n = v;
  else S[S.scene] = v;
  sfx.tick(); render();
});

$('chips').addEventListener('click', (ev) => {
  const k = ev.target.closest('.chip')?.dataset.k; if (!k) return;
  const [kind, arg] = k.split(':');
  if (kind === 's1' || kind === 's2') {
    if (!secret.unlocked()) return secret.open();
    S.secret = S.secret === kind ? null : kind;
    if (S.secret === 's2' && S.tear < 0.02) { S.tear = 0; S.tearAnim = true; }
    sfx.click(); return render();
  }
  if (kind === 'tr') { S.tgt = +arg; S.lenMoved = false; }
  if (kind === 'pm') { S.pmode = arg; newProblem(); }
  if (kind === 'pnew') newProblem();
  if (kind === 'sc') S.scene = arg;
  sfx.click(); render();
});

$('pbody').addEventListener('click', (ev) => {
  const b = ev.target.closest('.chip'); if (!b) return;
  const P = S.P;
  if (b.dataset.ans !== undefined) {
    const v = +b.dataset.ans; if (P.done) return;
    if (v === P.th) { P.done = true; P.fb = null; sfx.good(); }
    else { P.tried.push(v); P.fb = v === 180 - P.th ? 'mirror' : 'miss'; sfx.bad(); }
  } else if (b.dataset.nud) {
    P.arm = clamp(P.arm + +b.dataset.nud, 0, 180); P.res = null; sfx.tick();
  } else if (b.dataset.act === 'check') {
    const x = P.dir === 1 ? P.arm : 180 - P.arm;
    if (Math.abs(x - P.th) <= 3) { P.res = { kind: 'ok', x }; sfx.good(); }
    else if (Math.abs(180 - x - P.th) <= 3) { P.res = { kind: 'mirror', x }; sfx.bad(); }
    else { P.res = { kind: 'miss', x }; sfx.bad(); }
  } else if (b.dataset.act === 'next') { newProblem(); sfx.click(); }
  render();
});

ask.addEventListener('click', (ev) => {

const turnGeo = (w, h) => { const Rr = Math.min(w, h) * 0.4; return { cx: w / 2, cy: h / 2, Rr, L: lerp(0.3, 1, S.len) * Rr * 0.96 }; };
const protGeo = (w, h) => { const R = Math.min(w * 0.4, h * 0.6); return { R, vx: w * 0.5, vy: h * 0.8, L: Math.min(1.22 * R, w * 0.5 - 6) }; };
const clockAngles = () => {
  const Tm = S.clock, m = Tm % 60, h = Math.floor(Tm / 60) % 12;
  const raw = Math.abs(30 * h - 5.5 * m), ang = raw > 180 ? 360 - raw : raw;
  const hh = ((Math.floor(Tm / 60) + 11) % 12) + 1;
  return { m, h, raw, ang, time: `${hh}:${String(m).padStart(2, '0')}`, hrC: (0.5 * Tm) % 360, mnC: 6 * m };
};
const triAngles = (pts) => pts.map((p, i) => {
  const U = pts[(i + 1) % 3], W = pts[(i + 2) % 3];
  const d1 = Math.atan2(U[1] - p[1], U[0] - p[0]), d2 = Math.atan2(W[1] - p[1], W[0] - p[0]);
  let diff = d2 - d1; while (diff > Math.PI) diff -= 2 * Math.PI; while (diff <= -Math.PI) diff += 2 * Math.PI;
  return diff > 0 ? { s: d1, a: diff } : { s: d2, a: -diff };
});

// 5. Render: text, chips, sliders

function setSlider(id, min, max, step, val) {
  const el = $(id);
  el.min = min; el.max = max; el.step = step;
  if (+el.value !== val) el.value = val;
}

function render() {
  const t = T[lang], m = mode(), open = secret.unlocked();
  const sc = (k) => `<button class="chip secret ${open ? 'open' : ''} ${S.secret === k ? 'on' : ''}" data-k="${k}">${open ? esc(t.secrets[k][0]) : '🔒 ???'}</button>`;
  let mid = '';
  const chip = (k, label, on) => `<button class="chip ${on ? 'on' : ''}" data-k="${k}">${esc(label)}</button>`;
  const a0 = Math.round(S.ang);
  if (m === 'turn') mid = [90, 180, 270, 360].map((d, i) => chip(`tr:${d}`, t.chipsT[i], a0 === d)).join('') + [45, 135].map((d) => chip(`tr:${d}`, `${d}°`, a0 === d)).join('');
  else if (m === 'prot') mid = chip('pm:measure', t.mMeasure, S.pmode === 'measure') + chip('pm:draw', t.mDraw, S.pmode === 'draw') + chip('pnew', t.newAngle, false);
  else if (m === 'around') mid = ['clock', 'door', 'pizza', 'robot'].map((k) => chip(`sc:${k}`, t.chips[k], S.scene === k)).join('');
  $('chips').innerHTML = [sc('s1'), mid, sc('s2')].join('');

  const showAng = m === 'turn', showX = m === 'around' || m === 's1' || m === 's2';
  $('rowAng').hidden = $('rowLen').hidden = !showAng; $('rowX').hidden = !showX;
  $('pbody').hidden = m !== 'prot';
  if (showAng) {
    $('lblAng').textContent = t.lblAng; $('lblLen').textContent = t.lblLen;
    setSlider('sAng', 0, 360, 1, a0); setSlider('sLen', 0, 100, 1, Math.round(S.len * 100));
  }
  if (showX) {
    let cfg;
    if (m === 's1') cfg = [t.s1lbl, 2, 24, 1, S.n];
    else if (m === 's2') cfg = [t.s2lbl, 0, 100, 1, Math.round(S.tear * 100)];
    else cfg = { clock: [t.lbl.clock, 0, 715, 5, S.clock], door: [t.lbl.door, 0, 180, 1, S.door], pizza: [t.lbl.pizza, 2, 12, 1, S.pizza], robot: [t.lbl.robot, 0, 360, 5, S.robot] }[S.scene];
    $('lblX').textContent = cfg[0]; setSlider('sX', cfg[1], cfg[2], cfg[3], cfg[4]);
  }

  const info = { turn: turnInfo, prot: protInfo, around: aroundInfo, s1: s1Info, s2: s2Info }[m](t);
  lab.setReadout(info.val, info.sub, info.pill, info.col);
  lab.setGlow(glow(info.col));
  lab.setState({ emo: info.emo, title: info.title, lead: info.lead, body: info.body, extra: (info.note ? `<div class="note">${esc(info.note)}</div>` : '') + `<div class="fine">${esc(info.fine)}</div>` });

  if (m === 'prot') $('pbody').innerHTML = protBody(t);
  ask.style.display = S.answered ? 'none' : '';
  if (!S.answered) ask.innerHTML = S.answer === null
    ? `<div class="q">${esc(t.ask)}</div><div class="opts">${t.opts.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="q" style="color:${S.answer === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(S.answer === 1 ? t.right : t.wrong)}</div><div class="opts"><button>${esc(t.go)} →</button></div>`;
}

function turnInfo(t) {
  const a = Math.round(S.ang), k = typeOf(a), col = TYPE_COL[k];
  return { val: `${nf(a)}°`, sub: t.tPct(nf(a / 3.6, 1)), pill: t.types[k], col, emo: EMO[k], title: t.types[k], lead: t.tLead[k], body: t.tBody[k],
    note: S.lenMoved && a > 0 ? t.lenNote(nf(a)) : '', fine: t.fine.turn };
}

function protInfo(t) {
  const P = S.P;
  if (S.pmode === 'measure') {
    const base = { val: '?°', sub: t.sMeasure, pill: '', col: '#4ea8ff', fine: t.fine.prot };
    if (P.done) {
      const sc = P.dir === 1 ? t.scaleOuter : t.scaleInner;
      return { ...base, val: `${nf(P.th)}°`, sub: t.sDone, pill: sc, col: P.dir === 1 ? OUT : INN, emo: '🎯', title: t.okT(nf(P.th)), lead: t.okL(sc), body: t.okB };
    }
    if (P.fb === 'mirror') return { ...base, emo: '🔁', title: t.mirT, lead: t.mirL, body: t.mirB, col: '#f5c84c' };
    if (P.fb === 'miss') return { ...base, emo: '🤔', title: t.missT, lead: t.missL, body: t.missB, col: '#f5c84c' };
    return P.snapped ? { ...base, emo: '🔎', title: t.p1t, lead: t.p1l, body: t.p1b } : { ...base, emo: '🖐️', title: t.p0t, lead: t.p0l, body: t.p0b };
  }
  const base = { val: `${nf(P.th)}°`, sub: t.sDraw, pill: '', col: '#ff8a3d', fine: t.fine.prot };
  if (P.res?.kind === 'ok') return { ...base, emo: '🎯', title: t.dokT(nf(P.res.x)), lead: t.dokL, body: t.dB };
  if (P.res?.kind === 'mirror') return { ...base, emo: '🔁', title: t.dMirT, lead: t.dMirL(nf(P.res.x)), body: t.dMirB, col: '#f5c84c' };
  if (P.res?.kind === 'miss') return { ...base, emo: '🤔', title: t.dMissT, lead: t.dMissL(nf(P.res.x), nf(P.th)), body: t.dMissB, col: '#f5c84c' };
  return { ...base, emo: '✏️', title: t.dT(nf(P.th)), lead: t.dL(nf(P.th)), body: t.dB };
}

function protBody(t) {
  const P = S.P;
  if (S.pmode === 'measure') {
    if (P.done) return `<div class="chips"><button class="chip ans on" data-act="next">${esc(t.next)} →</button></div>`;
    if (!P.snapped) return '';
    return `<div class="plabel">${esc(t.qLabel)}</div><div class="chips">${P.choices.map((v) => `<button class="chip ans ${P.tried.includes(v) ? 'dim' : ''}" data-ans="${v}">${nf(v)}°</button>`).join('')}</div>`;
  }
  return `<div class="chips"><button class="chip ans" data-nud="-1">−1°</button><button class="chip ans" data-nud="1">+1°</button><button class="chip ans ${P.res?.kind === 'ok' ? '' : 'on'}" data-act="check">${esc(t.check)}</button>${P.res?.kind === 'ok' ? `<button class="chip ans on" data-act="next">${esc(t.next)} →</button>` : ''}</div>`;
}

function aroundInfo(t) {
  const s = S.scene;
  if (s === 'clock') {

function s1Info(t) {

// ---------------------------------------------------------------------------------------------------------
// 6. Drawing
// ---------------------------------------------------------------------------------------------------------
function txt(c, s, x, y, size, color, align = 'center', weight = 800, outline = 0) {
  c.font = `${weight} ${size}px Nunito, ui-sans-serif, system-ui, sans-serif`; c.textAlign = align; c.textBaseline = 'middle';
  if (outline) { c.lineWidth = outline; c.strokeStyle = 'rgba(10,12,20,.85)'; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = color; c.fillText(s, x, y);
}
function line(c, x0, y0, x1, y1, col, wd, dash) {
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.strokeStyle = col; c.lineWidth = wd; c.lineCap = 'round';
  c.setLineDash(dash || []); c.stroke(); c.setLineDash([]);
}
function dot(c, x, y, r, fill, stroke, sw = 2) {
  c.beginPath(); c.arc(x, y, r, 0, 7);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = sw; c.stroke(); }
}
// sector from math angle a0 to a1 (degrees, counter-clockwise), as a path
function sectorPath(c, cx, cy, r, a0, a1) { c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, r, -a0 * D2R, -a1 * D2R, true); c.closePath(); }
function arrowHead(c, x, y, ang, size, col) {
  c.save(); c.translate(x, y); c.rotate(ang); c.beginPath(); c.moveTo(0, 0); c.lineTo(-size, size * 0.55); c.lineTo(-size, -size * 0.55); c.closePath(); c.fillStyle = col; c.fill(); c.restore();
}
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// --- prediction: two angles to compare -----------------------------------------------------------------
function drawPredict(c, w, h) {
  const vy = h - 24, A = { x: w * 0.06, L: w * 0.46, a: 25 }, B = { x: w * 0.64, L: w * 0.22, a: 70 };
  const reveal = S.answer !== null;
  for (const [name, g, col] of [['A', A, '#4ea8ff'], ['B', B, '#ff8a3d']]) {
    if (reveal) { sectorPath(c, g.x, vy, Math.min(g.L * 0.5, 70), 0, g.a); c.fillStyle = col + '44'; c.fill(); }
    const [tx, ty] = pt(g.x, vy, g.L, g.a);
    line(c, g.x, vy, g.x + g.L, vy, '#EDEFF7', 4); line(c, g.x, vy, tx, ty, col, 4);
    dot(c, g.x, vy, 6, '#fff');
    txt(c, name, g.x + 14, vy + 0, 15, '#EDEFF7', 'left');
    if (reveal) { const [lx, ly] = pt(g.x, vy, Math.min(g.L * 0.5, 70) + 20, g.a / 2); txt(c, `${g.a}°`, lx, ly, 15, col, 'center', 900, 3); }
    else { c.beginPath(); c.arc(g.x, vy, Math.min(g.L * 0.5, 70), -g.a * D2R, 0); c.strokeStyle = col + 'aa'; c.lineWidth = 2; c.stroke(); }
  }
}

// --- scene 1: turning an arm ---------------------------------------------------------------------------
function drawTurn(c, w, h) {
  const { cx, cy, Rr, L } = turnGeo(w, h), a = S.ang, k = typeOf(Math.round(a)), col = TYPE_COL[k], m = Math.min(w, h);
  const L0 = lerp(0.3, 1, 0.6) * Rr * 0.96, fs = clamp(m * 0.034, 10, 14);
  // ring with quarter marks
  c.beginPath(); c.arc(cx, cy, Rr, 0, 7); c.strokeStyle = 'rgba(130,145,190,.28)'; c.lineWidth = 1; c.setLineDash([3, 5]); c.stroke(); c.setLineDash([]);
  if (a > 0) { c.beginPath(); c.arc(cx, cy, Rr, 0, -a * D2R, true); c.strokeStyle = col + '99'; c.lineWidth = 5; c.lineCap = 'butt'; c.stroke(); }
  for (let i = 0; i < 12; i++) { const [x0, y0] = pt(cx, cy, Rr - 3, i * 30), [x1, y1] = pt(cx, cy, Rr + (i % 3 === 0 ? 7 : 3), i * 30); line(c, x0, y0, x1, y1, 'rgba(190,200,230,.45)', i % 3 === 0 ? 2 : 1); }
  const labs = [['¼ · 90°', 90], ['½ · 180°', 180], ['¾ · 270°', 270]];
  for (const [s, d] of labs) { const [x, y] = pt(cx, cy, Rr + fs * 1.5, d); txt(c, s, clamp(x, 30, w - 30), clamp(y, fs, h - fs), fs, Math.round(a) === d ? col : '#98A0B8', 'center', 800); }
  { const edge = Math.round(a) % 360 === 0, right = cx + Rr + 64 > w;
    txt(c, '0° = 360°', right ? w - 4 : cx + Rr + 9, cy - (right ? fs * 1.8 : fs * 0.1), fs, edge ? col : '#98A0B8', right ? 'right' : 'left', 800); }
  // ghost arms at the starting length
  if (Math.abs(S.len - 0.6) > 0.03) {
    const [gx, gy] = pt(cx, cy, L0, a);
    line(c, cx, cy, cx + L0, cy, 'rgba(190,200,230,.3)', 2, [4, 6]); line(c, cx, cy, gx, gy, 'rgba(190,200,230,.3)', 2, [4, 6]);
  }
  // swept sector
  const r = Math.min(L * 0.8, Rr * 0.5);
  if (a > 0) {
    sectorPath(c, cx, cy, r, 0, a); c.fillStyle = col + '40'; c.fill();
    c.beginPath(); c.arc(cx, cy, r, 0, -a * D2R, true); c.strokeStyle = col; c.lineWidth = 3; c.lineCap = 'butt'; c.stroke();
    if (a < 359) { const [ex, ey] = pt(cx, cy, r, a); arrowHead(c, ex, ey, Math.atan2(-Math.cos(a * D2R), -Math.sin(a * D2R)), 8, col); }
  }
  if (Math.round(a) === 90) { const q = r * 0.3; c.beginPath(); c.rect(cx, cy - q, q, q); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke(); }
  // arms
  const [tx, ty] = pt(cx, cy, L, a);
  line(c, cx, cy, cx + L, cy, '#EDEFF7', 4);
  line(c, cx, cy, tx, ty, col, 4);
  dot(c, cx, cy, 6, '#fff');
  dot(c, tx, ty, 10, '#fff', col, 3);
  // length handle
  rr(c, cx + L - 9, cy - 9, 18, 18, 5); c.fillStyle = '#EDEFF7'; c.fill(); c.strokeStyle = '#0A0C14'; c.lineWidth = 2; c.stroke();
  txt(c, '↔', cx + L, cy, 12, '#0A0C14');
  txt(c, T[lang].hLen, cx + L, cy + 24, fs, '#98A0B8');
  // the number inside the angle
  if (a > 0) {
    const lr = a < 40 ? r + fs * 1.6 : r * 0.58, [lx, ly] = pt(cx, cy, lr, a >= 359 ? 180 : a / 2);
    txt(c, `${Math.round(a)}°`, lx, ly, clamp(m * 0.05, 13, 20), '#fff', 'center', 900, 4);
  }
}

// --- scene 2: protractor -------------------------------------------------------------------------------
function drawProtractor(c, cx, cy, R) {

  c.beginPath(); c.arc(cx, cy, R, Math.PI, 2 * Math.PI); c.lineTo(cx + R, cy + R * 0.14); c.lineTo(cx - R, cy + R * 0.14); c.closePath();

  c.beginPath(); c.arc(cx, cy, R * 0.36, Math.PI, 2 * Math.PI); c.strokeStyle = 'rgba(190,225,255,.3)'; c.lineWidth = 1; c.stroke();
  for (const sc of ['out', 'in']) {

      const [x0, y0] = pt(cx, cy, r0, d), [x1, y1] = pt(cx, cy, r0 + dir * len, d); c.moveTo(x0, y0); c.lineTo(x1, y1);

  c.restore();
}

function drawProt(c, w, h, dt, time) {
  const P = S.P, { R, vx, vy, L } = protGeo(w, h), measure = S.pmode === 'measure';
  const phi = measure ? (P.dir === 1 ? P.th : 180 - P.th) : P.arm, base = P.dir === 1 ? 0 : 180;
  const pcx = P.snapped ? vx : P.px * w, pcy = P.snapped ? vy : P.py * h;
  const col = '#ff8a3d';
  // sector between the arms
  sectorPath(c, vx, vy, R * 0.2, Math.min(base, phi), Math.max(base, phi)); c.fillStyle = col + '40'; c.fill();
  drawProtractor(c, pcx, pcy, R);
  line(c, vx, vy, vx + P.dir * L, vy, '#EDEFF7', 3);
  const [tx, ty] = pt(vx, vy, L, phi);
  line(c, vx, vy, tx, ty, col, 3);
  dot(c, vx, vy, 5, '#fff');
  if (!measure) dot(c, tx, ty, 10, '#fff', col, 3);
  if (measure && !P.snapped) { const pr = 14 + 4 * Math.sin(time * 4); dot(c, vx, vy, pr, null, '#fff', 2); }
  if (P.snapped) {

    dot(c, ox, oy, 4, OUT); dot(c, ix, iy, 4, INN);

// --- scene 3: around you -------------------------------------------------------------------------------
function drawClock(c, w, h) {

  const cp = (clockDeg, r) => [cx + r * Math.cos((clockDeg - 90) * D2R), cy + r * Math.sin((clockDeg - 90) * D2R)];
  for (let i = 0; i < 60; i++) { const [x0, y0] = cp(i * 6, R * (i % 5 ? 0.94 : 0.88)), [x1, y1] = cp(i * 6, R * 0.98); line(c, x0, y0, x1, y1, i % 5 ? 'rgba(190,200,230,.4)' : '#C6CDE0', i % 5 ? 1 : 2); }
  for (let i = 1; i <= 12; i++) { const [x, y] = cp(i * 30, R * 0.76); txt(c, String(i), x, y, R * 0.12, '#EDEFF7', 'center', 800); }

    c.beginPath(); c.arc(cx, cy, R * 0.5, (a0 - 90) * D2R, (a0 - 90 + sw) * D2R, false); c.strokeStyle = col; c.lineWidth = 3; c.lineCap = 'butt'; c.stroke();
  }

  line(c, cx, cy, hx, hy, '#EDEFF7', R * 0.05); line(c, cx, cy, mx, my, '#ff8a3d', R * 0.035);
  dot(c, cx, cy, R * 0.04, '#fff');

function drawDoor(c, w, h) {
  const Hx = w / 2, Hy = h * 0.8, Ld = Math.min(w / 2 - 16, h * 0.62), a = S.door, col = TYPE_COL[typeOf(a)];
  c.fillStyle = 'rgba(130,145,190,.06)'; c.fillRect(0, 0, w, Hy);
  line(c, 0, Hy, Hx, Hy, '#6b7391', 12, null); line(c, Hx + Ld, Hy, w, Hy, '#6b7391', 12, null);
  line(c, Hx, Hy, Hx + Ld, Hy, 'rgba(190,200,230,.25)', 3, [4, 6]);
  if (a > 0) { sectorPath(c, Hx, Hy, Ld, 0, a); c.fillStyle = col + '30'; c.fill(); c.beginPath(); c.arc(Hx, Hy, Ld, 0, -a * D2R, true); c.strokeStyle = col + 'aa'; c.lineWidth = 2; c.setLineDash([5, 6]); c.stroke(); c.setLineDash([]); }

}

function drawPizza(c, w, h) {
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.36, n = S.pizza, a = 360 / n, sh = ['#f5c84c', '#e8b53a'];
  for (let i = n - 1; i >= 0; i--) {
    const mid = 90 + i * a, off = i === 0 ? R * 0.08 : 0, [ox, oy] = pt(0, 0, off, mid), px = cx + ox, py = cy + oy;
    sectorPath(c, px, py, R, mid - a / 2, mid + a / 2); c.fillStyle = sh[i % 2]; c.fill();
    c.beginPath(); c.arc(px, py, R * 0.96, -(mid - a / 2) * D2R, -(mid + a / 2) * D2R, true); c.strokeStyle = '#c98a3d'; c.lineWidth = R * 0.08; c.lineCap = 'butt'; c.stroke();
    if (n > 1) { const [x0, y0] = pt(px, py, R, mid - a / 2); line(c, px, py, x0, y0, 'rgba(120,70,20,.5)', 1.5); }
    for (const [rr0, da] of [[0.55, -0.22], [0.78, 0.0], [0.55, 0.22]]) { const [x, y] = pt(px, py, R * rr0, mid + da * a); dot(c, x, y, Math.min(R * 0.07, R * rr0 * Math.tan(a * D2R / 2) * 0.5 + 1), '#d94b3a'); }
  }
  const off = R * 0.08, [ox, oy] = pt(0, 0, off, 90), px = cx + ox, py = cy + oy;
  sectorPath(c, px, py, R, 90 - a / 2, 90 + a / 2); c.strokeStyle = '#fff'; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke();
  const [lx, ly] = pt(px, py, R * 0.3, 90);
  c.beginPath(); c.arc(px, py, R * 0.2, -(90 - a / 2) * D2R, -(90 + a / 2) * D2R, true); c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.stroke();
  txt(c, `${Number.isInteger(a) ? '' : '≈'}${nf(a, 1)}°`, lx, ly - R * 0.12 + (a < 40 ? -R * 0.1 : 0), clamp(R * 0.11, 11, 17), '#fff', 'center', 900, 4);
}

function rrobot(c, u) {
  rr(c, -u, -u * 1.1, u * 2, u * 2.2, u * 0.4); c.fillStyle = '#4ea8ff'; c.fill(); c.strokeStyle = '#EDEFF7'; c.lineWidth = 2; c.stroke();

  dot(c, -u * 0.4, -u * 0.55, u * 0.17, '#0A0C14'); dot(c, u * 0.4, -u * 0.55, u * 0.17, '#0A0C14');
  c.beginPath(); c.moveTo(0, -u * 1.7); c.lineTo(-u * 0.5, -u * 1.1); c.lineTo(u * 0.5, -u * 1.1); c.closePath(); c.fillStyle = '#f5c84c'; c.fill();
}
function drawRobot(c, w, h) {
  const m = Math.min(w, h), cx = w / 2, cy = h / 2, u = m * 0.085, A = S.robot, col = TYPE_COL[typeOf(A)], ring = u * 3.9, fs = clamp(m * 0.034, 10, 14);
  c.beginPath(); c.arc(cx, cy, ring, 0, 7); c.strokeStyle = 'rgba(130,145,190,.25)'; c.lineWidth = 1; c.setLineDash([3, 5]); c.stroke(); c.setLineDash([]);
  [[90, 0, '0°'], [0, 90, '90°'], [270, 180, '180°'], [180, 270, '270°']].forEach(([md, tn, s]) => {
    const [x0, y0] = pt(cx, cy, ring - 4, md), [x1, y1] = pt(cx, cy, ring + 5, md), [x, y] = pt(cx, cy, ring + fs * 1.5, md);
    line(c, x0, y0, x1, y1, 'rgba(190,200,230,.5)', 2); txt(c, s, x, y, fs, A === tn ? col : '#98A0B8');
  });

    c.beginPath(); c.arc(cx, cy, u * 3.2, -90 * D2R, -(90 - A) * D2R, false); c.strokeStyle = col; c.lineWidth = 3; c.lineCap = 'butt'; c.stroke();

}

// --- secret 1: why 360 ---------------------------------------------------------------------------------
const s1Geo = (w, h) => { const ah = h - 46; return { cx: w / 2, cy: ah * 0.52, R: Math.min(w * 0.34, ah * 0.44), cw: (w - 16) / 23, sy: h - 22 }; };
function drawS1(c, w, h) {
  const { cx, cy, R, cw, sy } = s1Geo(w, h), n = S.n, a = 360 / n, whole = 360 % n === 0;
  const cols = whole ? ['#3ddc97', '#2aa874'] : ['#ff8a3d', '#c9672a'];
  for (let i = 0; i < n; i++) {
    const s = 90 - a / 2 + i * a; sectorPath(c, cx, cy, R, s, s + a); c.fillStyle = i === 0 ? cols[0] : cols[1] + (i % 2 ? 'aa' : '66'); c.fill();
    const [x, y] = pt(cx, cy, R, s); line(c, cx, cy, x, y, 'rgba(10,12,20,.55)', 1.5);
  }
  c.beginPath(); c.arc(cx, cy, R, 0, 7); c.strokeStyle = '#EDEFF7'; c.lineWidth = 2; c.stroke();
  txt(c, `${nf(a, 2)}°`, ...pt(cx, cy, R * 0.66, 90), clamp(R * 0.14, 12, 20), '#fff', 'center', 900, 4);
  for (let k = 2; k <= 24; k++) {
    const x = 8 + (k - 1.5) * cw, ok = 360 % k === 0, sel = k === n;
    dot(c, x, sy, Math.min(cw * 0.46, 10), ok ? '#3ddc97' : 'rgba(255,93,108,.5)', sel ? '#fff' : null, 2.5);
    txt(c, String(k), x, sy, clamp(cw * 0.5, 8, 11), ok ? '#0A0C14' : '#EDEFF7', 'center', 800);
  }
}

// --- secret 2: triangle corners add up to a half turn --------------------------------------------------
const s2Pts = (w, h) => S.tri.map((p) => [p[0] * w, p[1] * h]);
function drawS2(c, w, h) {
  const pts = s2Pts(w, h), info = triAngles(pts), m = Math.min(w, h), P = [w * 0.5, h * 0.92];
  const edges = pts.map((p, i) => Math.hypot(pts[(i + 1) % 3][0] - p[0], pts[(i + 1) % 3][1] - p[1]));
  const r = clamp(Math.min(m * 0.13, Math.min(...edges) * 0.4), 6, 90), e = S.tear * S.tear * (3 - 2 * S.tear);
  const colr = ['#4ea8ff', '#ff8a3d', '#3ddc97'], greek = ['α', 'β', 'γ'];
  c.beginPath(); c.moveTo(...pts[0]); c.lineTo(...pts[1]); c.lineTo(...pts[2]); c.closePath();
  c.fillStyle = 'rgba(78,168,255,.10)'; c.fill(); c.strokeStyle = '#EDEFF7'; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke();
  if (e > 0.001) {
    c.save(); c.globalCompositeOperation = 'destination-out';
    pts.forEach((p, i) => { c.beginPath(); c.moveTo(...p); c.arc(p[0], p[1], r + 1.5, info[i].s, info[i].s + info[i].a); c.closePath(); c.fillStyle = '#000'; c.fill(); });
    c.restore();
  }
  // moving corners
  let cum = -Math.PI;
  info.forEach((g, i) => {
    let d = cum - g.s; while (d > Math.PI) d -= 2 * Math.PI; while (d <= -Math.PI) d += 2 * Math.PI;
    const px = lerp(pts[i][0], P[0], e), py = lerp(pts[i][1], P[1], e);
    c.save(); c.translate(px, py); c.rotate(e * d);
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, r, g.s, g.s + g.a); c.closePath(); c.fillStyle = colr[i] + 'bb'; c.fill(); c.strokeStyle = colr[i]; c.lineWidth = 2; c.stroke();
    c.restore();
    cum += g.a;
    const mid = g.s + g.a / 2 + e * d, lr = r * (e > 0.5 ? 1.45 : 1.55), tx = px + lr * Math.cos(mid), ty = py + lr * Math.sin(mid);
    txt(c, `${greek[i]} ${nf(g.a / D2R, 1)}°`, e > 0.5 ? clamp(tx, 30, w - 30) : tx, e > 0.5 ? ty : ty, clamp(m * 0.034, 10, 13), colr[i], 'center', 800, 3);
  });
  if (e > 0.6) { c.globalAlpha = clamp((e - 0.6) / 0.4, 0, 1); line(c, P[0] - r * 1.35, P[1], P[0] + r * 1.35, P[1], '#EDEFF7', 2.5); txt(c, '180°', P[0], P[1] + 14, clamp(m * 0.045, 12, 17), '#fff', 'center', 900, 3); c.globalAlpha = 1; }
  pts.forEach((p) => dot(c, p[0], p[1], 7, '#fff', '#0A0C14', 2));
}

// --- main loop -----------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  S.sz = { w, h };
  // easing for presets and the tearing animation
  if (S.tgt !== null) {
    const d = S.tgt - S.ang, step = 300 * dt;
    if (Math.abs(d) <= step) { S.ang = S.tgt; S.tgt = null; sfx.snap(); } else S.ang += Math.sign(d) * step;
    render();
  }
  if (S.tearAnim) { S.tear = Math.min(1, S.tear + dt / 3); if (S.tear >= 1) S.tearAnim = false; if (mode() === 's2') render(); }
  if (!S.answered) return drawPredict(c, w, h);
  ({ turn: drawTurn, prot: drawProt, around: drawAround, s1: drawS1, s2: drawS2 })[mode()](c, w, h, dt, time);
});
function drawAround(c, w, h) { ({ clock: drawClock, door: drawDoor, pizza: drawPizza, robot: drawRobot })[S.scene](c, w, h); }

// ---------------------------------------------------------------------------------------------------------
// 7. Pointer input
// ---------------------------------------------------------------------------------------------------------
const cv = $('cv');
let drag = null, off = { x: 0, y: 0 };
const pos = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top, w: r.width, h: r.height }; };

function turnMove(p) {
  const g = turnGeo(p.w, p.h);
  if (drag === 'len') {
    const nl = clamp(((p.x - g.cx) / (g.Rr * 0.96) - 0.3) / 0.7, 0, 1);
    if (Math.abs(nl - S.len) > 0.002) { S.len = nl; S.lenMoved = true; }
  } else {
    const dx = p.x - g.cx, dy = p.y - g.cy; if (Math.hypot(dx, dy) < 10) return;
    let raw = Math.round(Math.atan2(-dy, dx) / D2R); if (raw < 0) raw += 360; if (raw >= 360) raw = 0;
    const prev = S.ang;
    if (prev >= 340 && raw < 20) raw = 360; else if (prev <= 20 && raw >= 340) raw = 0;
    for (const mk of [90, 180, 270]) if (Math.abs(raw - mk) <= 3) raw = mk;
    const onMark = [90, 180, 270, 360].includes(raw) ? raw : null;
    if (onMark && S.mark !== onMark) sfx.snap();
    S.mark = onMark;
    if (raw !== S.ang) { S.ang = raw; S.lenMoved = false; }
  }
  render();
}

cv.addEventListener('pointerdown', (ev) => {
  if (!S.answered) return;
  const p = pos(ev), m = mode(); drag = null;
  if (m === 'turn') {
    const g = turnGeo(p.w, p.h);
    drag = Math.hypot(p.x - (g.cx + g.L), p.y - g.cy) < 26 ? 'len' : 'ang'; S.tgt = null; turnMove(p);
  } else if (m === 'prot') {
    const P = S.P, g = protGeo(p.w, p.h);
    if (S.pmode === 'measure') {
      const pcx = P.snapped ? g.vx : P.px * p.w, pcy = P.snapped ? g.vy : P.py * p.h;
      if (Math.hypot(p.x - pcx, p.y - pcy) < g.R * 1.05 && p.y < pcy + g.R * 0.2) { drag = 'pt'; off = { x: pcx - p.x, y: pcy - p.y }; }
    } else { drag = 'arm'; protMove(p); }
  } else if (m === 's1') { drag = 's1'; s1Move(p); }
  else if (m === 's2') {
    let best = -1, bd = 36; s2Pts(p.w, p.h).forEach((q, i) => { const d = Math.hypot(p.x - q[0], p.y - q[1]); if (d < bd) { bd = d; best = i; } });
    if (best >= 0) { drag = best; S.tearAnim = false; }
  }
  if (drag !== null) cv.setPointerCapture?.(ev.pointerId);
});

function protMove(p) {
  const P = S.P, g = protGeo(p.w, p.h);
  if (drag === 'pt') {
    const nx = clamp(p.x + off.x, 0, p.w), ny = clamp(p.y + off.y, 0, p.h);
    if (Math.hypot(nx - g.vx, ny - g.vy) < 18) { if (!P.snapped) sfx.snap(); P.snapped = true; }
    else { P.snapped = false; P.px = nx / p.w; P.py = ny / p.h; }
  } else if (drag === 'arm') {
    const dx = p.x - g.vx, dy = g.vy - p.y; if (Math.hypot(dx, dy) < 6) return;
    let phi = Math.atan2(dy, dx) / D2R; if (phi < 0) phi = dx >= 0 ? 0 : 180;
    const v = clamp(Math.round(phi), 0, 180); if (v !== P.arm) { P.arm = v; P.res = null; }
  }
  render();
}
function s1Move(p) {
  const g = s1Geo(p.w, p.h);
  if (p.y < g.sy - 20) return;
  const k = clamp(Math.round((p.x - 8) / g.cw + 1.5), 2, 24);
  if (k !== S.n) { S.n = k; sfx.tick(); render(); }
}
cv.addEventListener('pointermove', (ev) => {
  if (drag === null) return;
  const p = pos(ev), m = mode();
  if (m === 'turn') turnMove(p);
  else if (m === 'prot') protMove(p);
  else if (m === 's1') s1Move(p);
  else if (m === 's2' && typeof drag === 'number') {
    S.tri[drag] = [clamp(p.x / p.w, 0.06, 0.94), clamp(p.y / p.h, 0.1, 0.6)]; render();
  }
});
const end = () => { drag = null; };
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);

render();
</script>
