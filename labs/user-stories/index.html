let SC = 1, G = { s: 1, ox: 0, oy: 0 };
const rr = (c, x, y, w, h, r) => { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
const ease = (p) => 1 - Math.pow(1 - clamp(p, 0, 1), 3);
const back = (p) => { p = clamp(p, 0, 1); return 1 + 2.7 * Math.pow(p - 1, 3) + 1.7 * Math.pow(p - 1, 2); };
const lg = (c, x0, y0, x1, y1, a, b) => { const g = c.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; };
const rnd = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function pill(c, text, x, y, color = '#EDEFF7') {
  c.save(); c.font = `800 ${12 / SC}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const w = c.measureText(text).width + 16 / SC, h = 20 / SC; x = clamp(x, w / 2 + 2, W - w / 2 - 2);
  c.fillStyle = 'rgba(10,12,20,.82)'; rr(c, x - w / 2, y - h / 2, w, h, h / 2); c.fill();
  c.fillStyle = color; c.fillText(text, x, y + 0.5 / SC); c.restore();
}
function label(c, text, x, y, size, color, align = 'center', weight = 800) {
  c.save(); c.font = `${weight} ${Math.max(12, size) / SC}px Nunito, sans-serif`; c.textAlign = align; c.textBaseline = 'middle'; c.fillStyle = color; c.fillText(text, x, y); c.restore();
}

    const i = n;
    if (B.step < 3) {
      if (isRight(B.k, B.step, i)) { B.picks[B.step] = i; B.pop = B.step; B.step++; B.msg = ''; sfx.snap(); }
      else { B.tried[B.step].push(i); B.msg = t.b.wrong[B.step]; sfx.bad(); }
    } else if (B.step === 3) {
      B.guess = i; B.built[B.k] = 1; B.born[B.k] = tm(); B.step = 4; (i === B.k ? sfx.good : sfx.bad)(); showStage();
    }
  } else if (a === 'next') { B.k++; B.step = 0; B.picks = []; B.tried = [[], [], [], []]; B.guess = null; B.msg = ''; B.pop = -1; sfx.click(); }
  else if (a === 'again') { S.b = fresh(); sfx.click(); }
  else if (a === 'jm') { if (!S.j.checked) { S.j.ans[n] = b.dataset.v; sfx.tick(); } }
  else if (a === 'jcheck') { S.j.checked = true; S.j.at = tm(); const k = S.j.ans.filter((v, i) => v === (t.jd.cards[i].ok ? 'g' : 'w')).length; (k === 6 ? sfx.good : sfx.click)(); showStage(); }
  else if (a === 'jagain') { S.j = { ans: [null, null, null, null, null, null], checked: false, at: 0 }; sfx.click(); }
  else if (a === 'tans') { const T3 = S.t, pres = T3.i < FIRST, ok = (b.dataset.v === 'y') === pres; T3.ans = b.dataset.v; T3.ok[T3.i] = ok; T3.res[T3.i] = pres; T3.at = tm(); (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'tnext') { S.t.i++; S.t.ans = null; sfx.click(); }
  else if (a === 'tagain') { S.t = { i: 0, ans: null, res: [], at: 0, ok: [] }; sfx.click(); }
  else if (a === 'why') {
    const who = b.dataset.w, d = n, right = who === 'mia' ? 0 : 1;
    S.why[who] = d; S.why.at[who === 'mia' ? 0 : 1] = tm(); (d === right ? sfx.good : sfx.bad)();
  } else if (a === 'wreset') { S.wall.items.forEach((it, k) => { it.col = 0; it.seq = k; }); sfx.click(); }
  render();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
const hl = (s, on) => esc(s).replace(/\{\{(.+?)\}\}/g, on ? '<mark>$1</mark>' : '$1');
const secChips = (t) => ['why', 'wall'].map((k, j) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-a="sec" data-k="${k}">${secret.unlocked() ? `${['🔔', '🗂️'][j]} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v; document.body.dataset.sec = sec || '';
  $('secChips').innerHTML = secChips(t);
  lab.setFacts(t.facts[v]);
  if (sec === 'why') renderWhy(t); else if (sec === 'wall') renderWall(t); else if (v === 'build') renderBuild(t); else if (v === 'judge') renderJudge(t); else renderTest(t);
}
function renderBuild(t) {
  const B = S.b, k = B.k, st = t.st[k], nb = B.built.reduce((x, y) => x + y, 0), step = B.step, who = WHO[k];
  lab.setGlow('rgba(95, 143, 208, .28)'); lab.setReadout(`${nb}/5`, t.b.unit, '', '#e0b050');
  const role = (i) => esc(t.roles[i]);
  const blank = (s, cls) => `<span class="bl r${s} ${B.picks[s] !== undefined ? 'on' : step === s ? 'cur' : ''} ${B.pop === s ? 'snap' : ''}">${B.picks[s] !== undefined ? esc(s === 0 ? t.roles[B.picks[s]] : s === 1 ? t.st[B.picks[s]].want : t.st[B.picks[s]].why) : '…'}</span>`;
  const frame = `<p class="us-frame"><span class="fr">${esc(t.fr[0])}</span> ${blank(0)}, <span class="fr">${esc(t.fr[1])}</span> ${blank(1)}, <span class="fr">${esc(t.fr[2])}</span> ${blank(2)}.</p>`;
  let opts = '';
  if (step < 4) opts = optsFor(k, step).map((i) => {
    const no = step < 3 && B.tried[step].includes(i);
    const text = step === 0 ? t.roles[i] : step === 1 ? t.st[i].want : step === 2 ? t.st[i].why : t.st[i].feat;
    return `<button class="us-opt ${no ? 'no' : ''}" data-a="pick" data-n="${i}" ${no ? 'disabled' : ''}>${step === 3 ? `<span class="e">${FEAT[i]}</span>` : ''}${esc(text)}</button>`;
  }).join('');
  const done = step === 4, last = k === 4;
  $('main').innerHTML = `<div class="us-quote">🗣️ <b>${esc(t.names[who])}:</b> “${esc(st.say)}”</div>${frame}
    ${done ? '' : `<div class="us-q">${esc(t.b.q[step])}</div><div class="us-opts">${opts}</div><div class="us-msg">${esc(B.msg)}</div>`}
    ${done ? `<div class="row2" style="margin-top:0"><button class="btn us-go" data-a="${last ? 'again' : 'next'}">${esc(last ? t.b.again : t.b.next)}</button></div>` : ''}`;
  B.pop = -1;
  if (step < 3) lab.setState({ emo: ['👂', '💭', '🎯'][step], title: t.b.story(k + 1, 5, t.names[who]), lead: t.b.tips[step], body: '', extra: '' });
  else if (step === 3) lab.setState({ emo: '🔮', title: t.b.pred, lead: t.b.predLead, body: '', extra: '' });
  else {
    const ok = B.guess === k;
    lab.setState(last ? { emo: ok ? '✅' : '🏆', title: ok ? `${t.b.right} ${t.b.endTitle}` : t.b.endTitle, lead: `${st.res} ${t.b.endLead}`, body: '', extra: '' }
      : { emo: ok ? '✅' : '🤔', title: ok ? t.b.right : t.b.notq(st.feat), lead: st.res, body: '', extra: '' });
  }
}
function renderJudge(t) {
  const J = S.j, d = t.jd, n = J.ans.filter(Boolean).length;
  lab.setGlow('rgba(224, 176, 80, .26)'); lab.setReadout(`${n}/6`, d.sub, '', '#e0b050');
  const right = J.ans.filter((a, i) => a === (d.cards[i].ok ? 'g' : 'w')).length;
  $('main').innerHTML = `<p class="us-hint">${esc(d.q)}</p>` + d.cards.map((c, i) => {
    const a = J.ans[i], ok = a === (c.ok ? 'g' : 'w');
    const cls = J.checked ? (ok ? 'good' : 'bad') : '';
    return `<div class="us-card ${cls}"><div class="t"><b>${i + 1}.</b>${hl(c.txt, J.checked)}</div>
      <div class="us-btns"><button data-a="jm" data-n="${i}" data-v="g" class="${a === 'g' ? 'on' : ''}" ${J.checked ? 'disabled' : ''}>${esc(d.good)}</button><button data-a="jm" data-n="${i}" data-v="w" class="${a === 'w' ? 'on' : ''}" ${J.checked ? 'disabled' : ''}>${esc(d.weak)}</button></div>
      ${J.checked ? `<div class="note">${esc(c.ok ? d.goodNote : c.note)}</div>` : ''}</div>`;
  }).join('') + `<div class="row2" style="margin-top:0">${J.checked ? `<button class="btn us-go" data-a="jagain">${esc(d.again)}</button>` : `<button class="btn us-go" data-a="jcheck" ${n < 6 ? 'disabled' : ''}>${esc(d.check)}</button>`}</div>`;
  lab.setState(J.checked ? { emo: right === 6 ? '🏆' : '🔎', title: d.res(right), lead: d.lead, body: '', extra: '' } : { emo: '🔎', title: d.t0, lead: d.l0, body: '', extra: '' });
}
function renderTest(t) {
  const T3 = S.t, s = t.ts, i = T3.i, end = i >= 5, pass = T3.res.filter((x) => x).length;
  lab.setGlow('rgba(111, 179, 111, .26)'); lab.setReadout(`${Math.min(i + (T3.ans !== null ? 1 : 0), 5)}/5`, s.sub, '', '#6fb36f');
  if (end) {
    $('main').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn us-go" data-a="tagain">${esc(s.again)}</button></div>`;
    lab.setState({ emo: '🧪', title: s.end(pass), lead: s.endLead, body: '', extra: '' }); return;
  }
  const st = t.st[i], answered = T3.ans !== null, pres = i < FIRST;
  $('main').innerHTML = `<div class="us-quote">${esc(s.q(i + 1))} · <b>${esc(t.names[WHO[i]])}</b><br>${esc(t.sent(t.roles[ROLE_OF[i]], st.want, st.why))}</div>
    <div class="us-q">${esc(st.chk)}</div>
    ${answered ? `<div class="us-msg ${T3.ok[i] ? 'good' : ''}">${esc(T3.ok[i] ? s.right : s.wrong)}</div><div class="row2" style="margin-top:6px"><button class="btn us-go" data-a="tnext">${esc(s.next)}</button></div>`
      : `<div class="us-opts"><button class="us-opt" data-a="tans" data-v="y">${esc(s.yes)}</button><button class="us-opt" data-a="tans" data-v="n">${esc(s.no)}</button></div>`}`;
  lab.setState(answered ? { emo: pres ? '✅' : '😕', title: pres ? s.passT : s.failT, lead: pres ? s.pass : s.fail, body: '', extra: '' } : { emo: '🧪', title: s.t0, lead: s.l0, body: '', extra: '' });
}
function renderWhy(t) {
  const w = t.sw, W1 = S.why, nOk = (W1.mia === 0 ? 1 : 0) + (W1.ben === 1 ? 1 : 0);
  lab.setGlow('rgba(143, 127, 208, .28)'); lab.setReadout(`${nOk}/2`, w.sub, '', '#8f7fd0');
  const pupil = (who, right) => `<div class="us-who"><b>${esc(t.names[who])}:</b> “${esc(w.say[who])}”</div><div class="us-opts" style="margin-bottom:8px">${w.designs.map((d, i) => `<button class="us-opt ${W1[who] === i ? (i === right ? 'ok' : 'no') : ''}" data-a="why" data-w="${who}" data-n="${i}">${esc(d)}</button>`).join('')}</div>`;
  $('main').innerHTML = `<p class="us-hint">${esc(w.intro)}</p>${pupil('mia', 0)}${pupil('ben', 1)}<div class="us-msg ${nOk === 2 ? 'good' : ''}">${nOk === 2 ? esc(w.ok) : (W1.mia !== null && W1.mia !== 0) || (W1.ben !== null && W1.ben !== 1) ? esc(w.wrong) : ''}</div>`;
  lab.setState(nOk === 2 ? { emo: '🔔', title: w.t1, lead: w.l1, body: '', extra: '' } : { emo: '🔔', title: w.t0, lead: w.l0, body: '', extra: '' });
}
function renderWall(t) {
  const k = t.sk, nd = S.wall.items.filter((it) => it.col === 2).length;
  lab.setGlow('rgba(224, 176, 80, .26)'); lab.setReadout(`${nd}/5`, k.sub, '', '#e0b050');
  $('main').innerHTML = `<p class="us-hint">${esc(k.hint)}</p><div class="row2" style="margin-top:0"><button class="chip" data-a="wreset">${esc(k.reset)}</button></div>`;
  lab.setState(nd === 5 ? { emo: '🎉', title: k.t1, lead: k.l1, body: '', extra: '' } : { emo: '🗂️', title: k.t0, lead: k.l0, body: '', extra: '' });
}
render();
</script>
