const rnd = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function drawBeach(c, w, h, dt, t) {

    const cg = c.createLinearGradient(0, -16, 0, 14); cg.addColorStop(0, C('#ffffff', skyK)); cg.addColorStop(1, C('#c3d3e8', skyK));
    c.fillStyle = cg; c.beginPath(); c.arc(-24, 4, 13, 0, 6.2832); c.arc(-8, -6, 17, 0, 6.2832); c.arc(14, -2, 15, 0, 6.2832); c.arc(28, 6, 11, 0, 6.2832); c.rect(-24, 4, 52, 13); c.fill(); c.restore();

  g = c.createLinearGradient(0, hy, 0, hy + h * 0.05); g.addColorStop(0, 'rgba(255,255,255,.4)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(0, hy, w, h * 0.05);
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (let j = 0; j < 5; j++) {

  c.strokeStyle = 'rgba(112,78,36,.18)'; c.lineWidth = 12; c.beginPath(); for (let x = 0; x <= w + 5; x += 5) x ? c.lineTo(x, edge(x) + 7) : c.moveTo(x, edge(x) + 7); c.stroke();

  }
  // hills and ground
  g = c.createLinearGradient(0, h * 0.62, 0, h); g.addColorStop(0, '#2f6a52'); g.addColorStop(1, '#173a2e'); c.fillStyle = g;
  c.beginPath(); c.moveTo(0, h); c.lineTo(0, h * 0.72); c.quadraticCurveTo(w * 0.3, h * 0.6, w * 0.6, h * 0.72); c.quadraticCurveTo(w * 0.85, h * 0.78, w, h * 0.68); c.lineTo(w, h); c.closePath(); c.fill();
  // puddles with ripples
  for (let i = 0; i < 2; i++) {
    const px = w * (0.22 + i * 0.3), py = h * (0.93 - i * 0.04), pr = (46 - i * 12) * u;
    c.fillStyle = 'rgba(150,185,230,.38)'; c.beginPath(); c.ellipse(px, py, pr, pr * 0.22, 0, 0, 6.2832); c.fill();
    c.strokeStyle = 'rgba(220,235,255,.5)'; c.lineWidth = 1.2;
    for (let r = 0; r < 2; r++) { const q = (t * 0.8 + r * 0.5 + i * 0.3) % 1; c.globalAlpha = 1 - q; c.beginPath(); c.ellipse(px + (i ? 6 : -8) * u, py, Math.max(0, q * pr * 0.55), Math.max(0, q * pr * 0.12), 0, 0, 6.2832); c.stroke(); }
    c.globalAlpha = 1;
  }
  // the plum tree
  const tx = w * 0.76, ty = h * 0.96;
  shadow(c, tx, ty, 54 * u, 8 * u, 0.4);
  c.save(); c.translate(tx, ty); c.rotate(Math.sin(t * 1.4) * 0.018);
  const tr = c.createLinearGradient(-8 * u, 0, 8 * u, 0); tr.addColorStop(0, '#7a5232'); tr.addColorStop(1, '#4a2f1c');
  c.fillStyle = tr; c.strokeStyle = '#2c1a0e'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-8 * u, 0); c.quadraticCurveTo(-4 * u, -50 * u, -6 * u, -96 * u); c.lineTo(7 * u, -96 * u); c.quadraticCurveTo(5 * u, -50 * u, 9 * u, 0); c.closePath(); c.fill(); c.stroke();
  const blobs = [[-30, -110, 30], [0, -128, 36], [30, -108, 30], [-8, -98, 30], [14, -142, 24]];
  for (const [bx, by, br] of blobs) {
    const lg = c.createRadialGradient((bx - 8) * u, (by - 10) * u, 2, bx * u, by * u, br * u); lg.addColorStop(0, '#4ba074'); lg.addColorStop(1, '#1f5a40');
    c.fillStyle = lg; c.beginPath(); c.arc(bx * u, by * u, br * u, 0, 6.2832); c.fill();
  }
  const plums = [[-34, -100], [-10, -118], [20, -126], [36, -104], [4, -92], [-22, -132]];
  for (const [px, py] of plums) {
    const pg = c.createRadialGradient((px - 2) * u, (py - 2) * u, 1, px * u, py * u, 7 * u); pg.addColorStop(0, '#b585e6'); pg.addColorStop(1, '#5a2a8a');
    c.fillStyle = pg; c.strokeStyle = '#33154f'; c.lineWidth = 1; c.beginPath(); c.arc(px * u, py * u, 6.5 * u, 0, 6.2832); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc((px - 2.4) * u, (py - 2.6) * u, 1.5 * u, 0, 6.2832); c.fill();
  }
  c.restore();
  // rain
  c.strokeStyle = 'rgba(205,224,255,.5)'; c.lineWidth = 1.4; c.lineCap = 'round'; c.beginPath();
  for (const d of DROPS) { const x = (d.x * (w + 80) + t * 60 * d.sp) % (w + 80) - 40, y = ((d.y + t * 0.9 * d.sp) % 1) * (h + 30) - 15; c.moveTo(x, y); c.lineTo(x - 5, y + 14); }
  c.stroke();
  // lightning
  const f = t % 6.5;
  if (f < 0.22) {
    const a = Math.sin(f / 0.22 * Math.PI); c.fillStyle = `rgba(235,242,255,${0.3 * a})`; c.fillRect(0, 0, w, h);
    c.strokeStyle = `rgba(255,255,240,${a})`; c.lineWidth = 3; c.lineJoin = 'round'; c.beginPath();
    const bx = w * 0.3; c.moveTo(bx, 0); c.lineTo(bx - 14, h * 0.14); c.lineTo(bx + 6, h * 0.17); c.lineTo(bx - 20, h * 0.34); c.stroke();
  }
}

// --- the story night (view 3) ----------------------------------------------------------------------------------
function drawNight(c, w, h, dt, t) {
  const u = Math.min(1.35, w / 375);
  let g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#120e38'); g.addColorStop(0.65, '#3d2870'); g.addColorStop(1, '#7a4d8e'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  for (const s of STARS) { const a = 0.35 + 0.65 * Math.pow(Math.max(0, Math.sin(t * 1.6 + s.ph)), 2); star(c, s.x * w, s.y * h, (1.6 + s.r * 1.4) * u, a); }
  const mx = w * 0.8, my = h * 0.1, mr = 20 * u;
  g = c.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 3.2); g.addColorStop(0, 'rgba(255,244,200,.45)'); g.addColorStop(1, 'rgba(255,244,200,0)'); c.fillStyle = g; c.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
  g = c.createRadialGradient(mx - 5, my - 5, 2, mx, my, mr); g.addColorStop(0, '#fffbe6'); g.addColorStop(1, '#f1dc9a'); c.fillStyle = g; c.beginPath(); c.arc(mx, my, mr, 0, 6.2832); c.fill();
  c.fillStyle = 'rgba(200,170,100,.35)'; c.beginPath(); c.arc(mx - 6 * u, my + 4 * u, 4 * u, 0, 6.2832); c.arc(mx + 7 * u, my - 5 * u, 3 * u, 0, 6.2832); c.fill();
  // far hill with a little castle
  c.fillStyle = '#2b1f5c'; c.beginPath(); c.moveTo(0, h); c.lineTo(0, h * 0.84); c.quadraticCurveTo(w * 0.28, h * 0.7, w * 0.55, h * 0.82); c.quadraticCurveTo(w * 0.8, h * 0.9, w, h * 0.78); c.lineTo(w, h); c.closePath(); c.fill();
  const cx = w * 0.3, cy = h * 0.745;
  c.fillStyle = '#1b1445';
  c.beginPath(); c.rect(cx - 22 * u, cy - 14 * u, 44 * u, 20 * u); c.rect(cx - 26 * u, cy - 28 * u, 12 * u, 34 * u); c.rect(cx + 14 * u, cy - 28 * u, 12 * u, 34 * u); c.rect(cx - 7 * u, cy - 38 * u, 14 * u, 44 * u); c.fill();
  c.beginPath(); c.moveTo(cx - 8 * u, cy - 38 * u); c.lineTo(cx, cy - 52 * u); c.lineTo(cx + 8 * u, cy - 38 * u); c.closePath(); c.fill();
  c.fillStyle = `rgba(255,220,120,${0.7 + 0.3 * Math.sin(t * 3)})`; for (const [wx, wy] of [[-20, -20], [18, -20], [-2, -28], [-2, -16]]) { c.beginPath(); c.rect(cx + wx * u, cy + wy * u, 4 * u, 6 * u); c.fill(); }
  c.fillStyle = '#1d1540'; c.beginPath(); c.moveTo(0, h); c.lineTo(0, h * 0.93); c.quadraticCurveTo(w * 0.35, h * 0.86, w * 0.7, h * 0.94); c.quadraticCurveTo(w * 0.9, h * 0.97, w, h * 0.9); c.lineTo(w, h); c.closePath(); c.fill();
  for (const f of FLIES) {
    const fx = (f.x + 0.05 * Math.sin(t * f.sp + f.ph)) * w, fy = (f.y + 0.03 * Math.cos(t * f.sp * 1.3 + f.ph)) * h, a = 0.35 + 0.65 * Math.pow(Math.max(0, Math.sin(t * 1.8 + f.ph)), 2);
    g = c.createRadialGradient(fx, fy, 0, fx, fy, 9 * u); g.addColorStop(0, `rgba(255,245,150,${a})`); g.addColorStop(1, 'rgba(255,245,150,0)'); c.fillStyle = g; c.beginPath(); c.arc(fx, fy, 9 * u, 0, 6.2832); c.fill();
  }
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  for (let i = 0; i < 10; i++) S.v[i] += clamp(S.a[i] - S.v[i], -dt / 1.1, dt / 1.1);
  S.full += clamp((S.sec ? 1 : 0) - S.full, -dt / 0.8, dt / 0.8);
  const wt = S.sec === 'wind' ? WL[S.wl] : 0.5 * S.v[4];
  S.windV += (wt - S.windV) * Math.min(1, dt * 3);
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (lab.view === 'paint') drawBeach(c, w, h, dt, time); else if (lab.view === 'which') drawStorm(c, w, h, dt, time); else drawNight(c, w, h, dt, time);
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function toggle(i) {
  S.a[i] = S.a[i] ? 0 : 1;
  if (S.a[i]) {
    S.order.push(i); sfx.click();
    if (i === 2) { S.sqT = performance.now() / 1000; sfx.push(); }
    if (!S.scrolled) { S.scrolled = true; showStage(); }
  } else { S.order = S.order.filter((x) => x !== i); sfx.tick(); }
}
function onAct(ev) {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, n = +b.dataset.k;
  if (act === 'chip') toggle(n);
  else if (act === 'reset') { S.a.fill(0); S.order = []; sfx.click(); }
  else if (act === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = b.dataset.s; S.animal = null; S.wl = 1; sfx.click(); }
  else if (act === 'close') { S.sec = null; sfx.click(); }
  else if (act === 'wind') { S.wl = n; sfx.tick(); }
  else if (act === 'animal') { S.animal = n; S.popAt = performance.now(); sfx.click(); }
  else if (act === 'opt') {
    if (S.wi > 5 || S.pick[S.wi] !== null) return;
    S.pick[S.wi] = n; S.newIco = true; (n === ANS[S.wi] ? sfx.good : sfx.bad)(); render(); showStage(); return;
  } else if (act === 'next') { if (S.wi >= 6) { S.wi = 0; S.pick.fill(null); } else S.wi++; S.newIco = false; sfx.click(); }
  else if (act === 'open') { if (S.done[n]) return; S.sel = n; S.wrongMsg = false; S.shake = -1; sfx.tick(); }
  else if (act === 'end') {
    if (S.done[n]) return;
    if (S.sel === null) { S.wrongMsg = false; sfx.tick(); }
    else if (S.sel === n) { S.done[n] = true; S.sel = null; S.wrongMsg = false; S.shake = -1; sfx.good(); }
    else { S.shake = n; S.wrongMsg = true; sfx.bad(); }
  } else if (act === 'fav') { S.fav = n; store.set('sensewords:fav', n); sfx.click(); }
  else if (act === 'why') { S.why = n; store.set('sensewords:why', n); sfx.click(); }
  render();
}
$('ctrlBody').addEventListener('click', onAct);
$('overlay').addEventListener('click', onAct);

// --- one render per change: controls, readout, overlays and the state card ----------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  if (v !== 'paint') S.sec = null;
  document.body.dataset.v = v;
  const inSec = v === 'paint' && !!S.sec;
  $('swPaint').style.display = v === 'paint' && !inSec ? '' : 'none';
  $('swSec').style.display = inSec ? '' : 'none';
  $('swWhich').style.display = v === 'which' ? '' : 'none';
  $('swFav').style.display = v === 'story' ? '' : 'none';
  ovPoem.style.display = v === 'which' ? '' : 'none';
  ovZoo.style.display = inSec && S.sec === 'animals' ? '' : 'none';
  ovWind.style.display = inSec && S.sec === 'wind' ? '' : 'none';
  ovStory.style.display = v === 'story' ? '' : 'none';
  if (v === 'paint') renderPaint(t); else if (v === 'which') renderWhich(t); else renderStory(t);
}

function sentenceHTML(t) {
  const p = t.paint, parts = [`<span class="b">${esc(p.base)}</span>`];
  for (let s = 0; s < 5; s++) {
    const ids = [s * 2, s * 2 + 1].filter((i) => S.a[i]);
    if (!ids.length) continue;
    const items = ids.map((i, n) => { let ph = p.chips[i].phrase; if (lang === 'hu' && n === 0) ph = cap(ph); return `<span class="n" style="color:${COL[s]}">${esc(ph)}</span>`; });
    parts.push(p.say[s](items.join(esc(p.and))));
  }
  return parts.join(' ');
}

function renderPaint(t) {
  const p = t.paint;
  lab.setGlow('rgba(72, 198, 216, .24)');
  const used = [0, 1, 2, 3, 4].filter((s) => S.a[s * 2] || S.a[s * 2 + 1]);
  if (!S.sec) {
    $('swSent').innerHTML = sentenceHTML(t);
    $('swRows').innerHTML = [0, 1, 2, 3, 4].map((s) => `<div class="sw-row"><div class="sw-sn">${EMO[s]} ${esc(p.senses[s])}</div>${[s * 2, s * 2 + 1].map((i) =>
      `<button class="sw-chip ${S.a[i] ? 'on' : ''}" style="--c:${COL[s]}" data-act="chip" data-k="${i}" aria-pressed="${S.a[i] ? 'true' : 'false'}">${esc(p.chips[i].label)}</button>`).join('')}</div>`).join('');
    const open = secret.unlocked();
    const sc = (k, emo) => `<button class="sw-chip sw-sec ${open ? 'open' : ''}" data-act="sec" data-s="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    $('swFoot').innerHTML = `<span class="sw-lbl">${esc(p.secLbl)}</span>${sc('animals', '🌍')}${sc('wind', '💨')}<button class="sw-chip" style="margin-left:auto" data-act="reset">${esc(p.again)}</button>`;
  }
  lab.setFacts(t.facts.paint);
  if (S.sec === 'animals') return renderZoo(t);
  if (S.sec === 'wind') return renderWind(t);
  const last = S.order.length ? S.order[S.order.length - 1] : -1;
  lab.setReadout(`${used.length}/5`, p.sub, used.length ? used.map((s) => EMO[s]).join(' ') : '', '#48c6d8');
  if (used.length === 5) lab.setState({ emo: '🌈', title: p.full[0], lead: p.full[1], body: '' });
  else if (last >= 0) lab.setState({ emo: EMO[last >> 1], title: p.chips[last].title, lead: p.chips[last].lead, body: '' });
  else lab.setState({ emo: '🌫️', title: p.s0[0], lead: p.s0[1], body: '' });
}

function renderZoo(t) {
  const z = t.zoo, k = S.animal;
  $('swSec').innerHTML = `<div class="sw-row" style="margin-top:0"><button class="sw-chip" data-act="close">${esc(z.close)}</button></div>`;
  ovZoo.innerHTML = `<div class="sw-zh">${esc(z.title)}</div><div class="sw-az">${ANIM.map((a, i) => `<button class="sw-an ${k === i ? 'on' : ''}" data-act="animal" data-k="${i}" aria-label="${esc(z.names[i])}">${a.emo}</button>`).join('')}</div>
    <div class="sw-bubs ${k !== null ? 'pop' : ''}" id="swBubs">${k === null ? `<div class="sw-tip">${esc(z.tap)}</div>`
      : ['en', 'ru', 'hu'].map((l) => `<div class="sw-bub ${l === lang ? 'me' : ''}"><b>${l.toUpperCase()}</b><span>${esc(ANIM[k].w[l])}</span></div>`).join('')}</div>`;
  lab.setReadout(k === null ? '🌍' : esc(ANIM[k].w[lang]), z.sub, '', '#f5c84c');
  lab.setState({ emo: k === null ? '🌍' : ANIM[k].emo, title: k === null ? z.title : `${z.names[k]} ${z.sound}…`, lead: k === null ? z.tap : ['en', 'ru', 'hu'].map((l) => ANIM[k].w[l]).join(' · '), body: '' });
}

function renderWind(t) {
  const wd = t.wind, j = S.wl;
  $('swSec').innerHTML = `<div class="sw-row" style="margin-top:0">${wd.verbs.map((vb, i) => `<button class="sw-chip ${i === j ? 'on' : ''}" style="--c:#f5c84c" data-act="wind" data-k="${i}">${esc(vb)}</button>`).join('')}
    <button class="sw-chip" style="margin-left:auto" data-act="close">${esc(wd.close)}</button></div>`;
  ovWind.innerHTML = wd.sent(wd.verbs[j]);
  lab.setReadout(esc(wd.names[j]), wd.sub, '', '#f5c84c');
  lab.setState({ emo: '💨', title: wd.verbs[j], lead: wd.leads[j], body: '' });
}

function renderWhich(t) {
  const q = t.which, wi = S.wi, end = wi >= 6, ans = !end && S.pick[wi] !== null;
  lab.setGlow('rgba(120, 140, 220, .24)');
  const answered = S.pick.filter((x) => x !== null).length, right = S.pick.filter((x, i) => x === ANS[i]).length;
  ovPoem.innerHTML = q.poem.map((ln) => `<div>${ln.replace(/\{(\d)\}/g, (_, d) => {
    const n = +d, w = esc(q.words[n]), done = n < wi || (n === wi && ans);
    if (done) return `<span class="wd done">${w}</span><span class="ico ${n === wi && S.newIco ? 'new' : ''}">${EMO[ANS[n]]}</span>`;
    return `<span class="wd ${n === wi && !end ? 'cur' : ''}">${w}</span>`;
  })}</div>`).join('');
  $('swOpts').style.display = end ? 'none' : '';
  $('swOpts').innerHTML = [0, 1, 2, 3, 4, 5].map((i) => `<button class="sw-opt ${ans ? (i === ANS[wi] ? 'ok' : i === S.pick[wi] ? 'bad' : 'dim') : ''}" data-act="opt" data-k="${i}"${ans ? ' disabled' : ''}><span class="e">${EMO[i]}</span>${esc(cap(q.snl[i]))}</button>`).join('');
  $('swNr').innerHTML = ans || end ? `<button class="sw-go" data-act="next">${esc(end ? q.again : wi === 5 ? q.last : q.next)}</button>` : '';
  lab.setFacts(t.facts.which);
  lab.setReadout(`${answered}/6`, q.sub, end ? `${right} ✓` : '', '#c79bff');
  if (end) lab.setState({ emo: '🏆', title: q.end(right), lead: q.endLead, body: '' });
  else if (!ans) lab.setState({ emo: '🔎', title: q.q(q.words[wi]), lead: q.hint, body: '' });
  else if (S.pick[wi] === ANS[wi]) lab.setState({ emo: '✅', title: t.right, lead: q.rev[wi], body: '' });
  else lab.setState({ emo: '🤔', title: q.wrong(q.snl[ANS[wi]]), lead: q.rev[wi], body: '' });
}

function renderStory(t) {
  const st = t.story, n = S.done.filter(Boolean).length, all = n === 3;
  lab.setGlow('rgba(160, 110, 220, .26)');
  const hint = all ? st.done[0] : S.wrongMsg ? st.wrong : st.pick;
  const openCards = st.stories.map((s, i) => `<button class="sw-cd ${S.done[i] ? 'ok' : S.sel === i ? 'sel' : ''}" data-act="open" data-k="${i}"${S.done[i] ? ' disabled' : ''}>${esc(s.o)}</button>`).join('');
  const endCards = END_ORDER.map((i) => `<button class="sw-cd ${S.done[i] ? 'ok' : S.shake === i ? 'shake' : ''}" data-act="end" data-k="${i}"${S.done[i] ? ' disabled' : ''}>${esc(st.stories[i].e)}</button>`).join('');
  ovStory.innerHTML = `<div class="sw-hint">${esc(hint)}</div><div class="sw-cols"><div class="sw-col"><h4>${esc(st.hOpen)}</h4>${openCards}</div><div class="sw-col"><h4>${esc(st.hEnd)}</h4>${endCards}</div></div>`;
  const phrases = [...st.stories.map((s) => s.o), ...st.stories.map((s) => s.e)];
  $('swFav').innerHTML = all ? `<div class="sw-q" style="margin-top:0">${esc(st.favQ)}</div><div class="sw-fav">${phrases.map((p, i) => `<button class="sw-chip ${S.fav === i ? 'on' : ''}" data-act="fav" data-k="${i}">${esc(p)}</button>`).join('')}</div>`
    + (S.fav !== null && phrases[S.fav] ? `<div class="sw-q">${esc(st.whyQ)}</div><div class="sw-whys">${st.whys.map((x, i) => `<button class="sw-chip ${S.why === i ? 'on' : ''}" style="--c:#f5c84c" data-act="why" data-k="${i}">${esc(x)}</button>`).join('')}</div>` : '') : '';
  lab.setFacts(t.facts.story);
  lab.setReadout(`${n}/3`, st.sub, '', '#a06edc');
  if (all) {
    const fav = S.fav !== null && phrases[S.fav] ? st.favDone(phrases[S.fav], S.why) : st.done[1];
    lab.setState({ emo: '📚', title: st.done[0], lead: fav, body: '' });
  } else if (n > 0) lab.setState({ emo: '✨', title: st.more[0], lead: st.more[1], body: '' });
  else lab.setState({ emo: '📖', title: st.s0[0], lead: st.s0[1], body: '' });
}
render();
</script>
