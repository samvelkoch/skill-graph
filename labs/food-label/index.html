      [lo, hiLim].forEach((q) => { txt(c, `${f1(+q.toFixed(2))}`, px(q), y + 38, 12, 700, '#B7BED2', 'center'); c.fillStyle = '#B7BED2'; c.fillRect(px(q) - 0.5, y + 24, 1, 6); });
      const mx = px(v);
      c.fillStyle = '#fff'; c.strokeStyle = '#0c0e1a'; c.lineWidth = 2; c.beginPath(); c.moveTo(mx, y - 4); c.lineTo(mx - 8, y - 16); c.lineTo(mx + 8, y - 16); c.closePath(); c.fill(); c.stroke();
    };
    tr(110, t.sa.salt, p.salt, THR_FOOD.salt[1], 1.8, t.g);
    tr(250, t.sa.sod, p.na, THR_FOOD.salt[1] / 2.5, 1.8 / 2.5, t.g);
    c.strokeStyle = '#B7BED2'; c.lineWidth = 2; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(30 + (p.salt / 1.8) * 300, 150); c.lineTo(30 + (p.salt / 1.8) * 300, 232); c.stroke(); c.setLineDash([]);
    txt(c, dec('× 2.5'),30 + (p.salt / 1.8) * 300 + 8, 192, 16, 900, '#f5c84c');
    for (let i = 0; i < 3; i++) pill(c, 90 + i * 70, 336, 62, i, t.lv[i]);
  }
}

canvasLoop($('cv'), (c, w, h, dt) => {
  const k = Math.min(w / W, h / H), v = lab.view, t = T[lang];
  c.save(); c.translate((w - W * k) / 2, (h - H * k) / 2); c.scale(k, k);
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (v === 'two') drawTwo(c, t, dt); else if (v === 'bowl') drawBowlView(c, t, dt); else if (S.sec) drawSecret(c, t); else drawSlogan(c, t, dt);
  c.restore();
});

// --- controls --------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const [k, x] = b.dataset.a.split(':');
  if (k === 'g1') { if (S.g1 !== null) return; S.g1 = x; (x === WIN1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (k === 'per') { S.per = x; sfx.click(); }
  else if (k === 'g2') { if (S.g2 !== null) return; S.g2 = x; S.gTo = 90; (x === 'x3' ? sfx.good : sfx.bad)(); showStage(); }
  else if (k === 'pk') { S.r = +x; S.sec = null; S.a3 = S.g3[S.r] === null ? 0 : 1; sfx.click(); }
  else if (k === 'g3') { if (S.g3[S.r] !== null) return; S.g3[S.r] = +x; (+x === R3[S.r].ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (k === 'nx') {
    if (S.g3.every((q) => q !== null)) { S.g3 = [null, null, null]; S.r = 0; S.a3 = 0; } else { S.r = (S.r + 1) % 3; while (S.g3[S.r] !== null) S.r = (S.r + 1) % 3; S.a3 = 0; }
    sfx.click();
  } else if (k === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === x ? null : x; sfx.click();
  }
  render();
});
$('sl').addEventListener('input', () => { S.gram = +$('sl').value; S.gTo = null; live2(); });

// --- render: controls, readout and state card ------------------------------------------------------------------
const optBtn = (act, key, label, state, extra = '') => `<button class="fl-opt ${state}" data-a="${act}:${key}" ${state ? 'disabled' : ''}>${extra}${esc(label)}</button>`;
function render() {
  const t = T[lang], v = lab.view;
  $('c1').style.display = v === 'two' ? '' : 'none';
  $('c2').style.display = v === 'bowl' ? '' : 'none';
  $('c3').style.display = v === 'slogan' ? '' : 'none';
  if (v === 'two') render1(t); else if (v === 'bowl') render2(t); else render3(t);
}
const fact = (t, k) => ({ emo: '💡', text: t.facts[k][0], src: t.facts[k][1] });

function render1(t) {
  const g = S.g1, per = S.per === '100', A = t.p.oat.join(' '), B = t.p.bran.join(' ');
  lab.setGlow('rgba(224, 160, 58, .26)');
  $('q1').textContent = t.v1.q;
  $('o1').innerHTML = ['oat', 'bran', 'same'].map((k) => optBtn('g1', k, t.v1.opts[k], g === null ? '' : k === WIN1 ? 'good' : k === g ? 'bad' : '')).join('');
  $('o1').querySelectorAll('button').forEach((b) => { b.disabled = g !== null; });
  $('tgRow').hidden = g === null;
  $('tg1').innerHTML = [['100', t.v1.tg[0]], ['pack', t.v1.tg[1]]].map(([k, l]) => `<button data-a="per:${k}" class="${S.per === k ? 'on' : ''}">${esc(l)}</button>`).join('');
  lab.setFacts([fact(t, 'f1'), fact(t, 'f2')]);
  if (g === null) {
    lab.setReadout('?', t.v1.rdSub[0], '', '#e0a03a');
    lab.setState({ emo: '🤔', title: t.v1.head, lead: t.v1.lead, body: '', extra: `<div class="fl-note">${esc(t.fine)}</div>` });
    return;
  }
  const sa = per ? P.oat.sug : P.oat.sug * P.oat.pack / 100, sb = per ? P.bran.sug : P.bran.sug * P.bran.pack / 100;
  lab.setReadout(`${f1(sa)} · ${f1(sb)} ${t.g}`, t.v1.rdSub[per ? 0 : 1], '', '#e0a03a');
  if (per) {
    const win = WIN1 === 'oat' ? [A, P.oat.sug, B, P.bran.sug] : [B, P.bran.sug, A, P.oat.sug];
    lab.setState({ emo: g === WIN1 ? '✅' : '🔎', title: g === WIN1 ? t.ok : t.no, lead: t.v1.lead2(win[0], f1(win[1]), win[2], f1(win[3])), body: t.v1.body, extra: `<div class="fl-note">${esc(t.fine)}</div>` });
  } else {
    lab.setState({ emo: '📦', title: t.v1.packTitle, lead: t.v1.packLead(A, f1(sa), P.oat.pack, B, f1(sb), P.bran.pack), body: t.v1.packBody, extra: `<div class="fl-note">${esc(t.fine)}</div>` });
  }
}
function live2() {
  const t = T[lang], g = Math.round(S.gram), n = g / P.mues.port, rv = S.g2 !== null;
  $('slLab').innerHTML = `${esc(t.v2.slider)}: <b>${g} ${esc(t.g)}</b>`;
  if (lab.view !== 'bowl') return;
  if (!rv) {
    lab.setReadout(`${g} ${esc(t.g)}`, t.v2.rd, '', '#e0b050');
    lab.setState({ emo: '🥣', title: t.v2.head, lead: t.v2.lead, body: '', extra: `<div class="fl-note">${esc(t.fine)}</div>` });
  } else {
    lab.setReadout(`${f1(P.mues.sug * g / 100)} ${esc(t.g)}`, t.v2.rd2, `× ${fn(n)}`, '#e0b050');
    lab.setState({ emo: S.g2 === 'x3' ? '✅' : '🔎', title: S.g2 === 'x3' ? t.ok : t.no, lead: t.v2.lead2(g, fn(n)), body: t.v2.body, extra: `<div class="fl-note">${esc(t.fine)}</div>` });
  }
}
function render2(t) {
  const g = S.g2;
  lab.setGlow('rgba(224, 176, 80, .24)');
  $('q2').textContent = t.v2.q;
  $('o2').innerHTML = ['same', 'x3', 'third'].map((k) => optBtn('g2', k, t.v2.opts[k], g === null ? '' : k === 'x3' ? 'good' : k === g ? 'bad' : '')).join('');
  $('o2').querySelectorAll('button').forEach((b) => { b.disabled = g !== null; });
  $('sl').value = S.gram;
  lab.setFacts([fact(t, 'f3'), fact(t, 'f4')]);
  live2();
}
function render3(t) {
  const r = S.r, R = R3[r], g = S.g3[r], done = g !== null, all = S.g3.every((q) => q !== null), p = P[R.p];
  lab.setGlow('rgba(95, 168, 160, .24)');
  const icons = ['🧃', '🌾', '🥛'];
  $('pk').innerHTML = icons.map((e, i) => `<button class="chip ${i === r && !S.sec ? 'on' : ''}" data-a="pk:${i}">${e} ${S.g3[i] === null ? '' : S.g3[i] === R3[i].ok ? '✓' : '✗'}</button>`).join('');
  $('q3').textContent = S.sec ? '' : t.v3.q[R.p];
  $('q3').hidden = !!S.sec;
  let opts;
  if (R.p === 'juice') opts = t.v3.opts.juice.map((l) => ({ l }));
  else if (R.p === 'gran') opts = [0, 1, 2].map((i) => ({ l: t.lv[i], extra: `<span class="fl-dot" style="background:${LC[i]}"></span>` }));
  else opts = t.v3.opts.yog.map((l) => ({ l }));
  $('o3').innerHTML = S.sec ? '' : opts.map((o, i) => optBtn('g3', i, o.l, !done ? '' : i === R.ok ? 'good' : i === g ? 'bad' : '', o.extra || '')).join('');
  $('o3').querySelectorAll('button').forEach((b) => { b.disabled = done; });
  $('nx3').hidden = !done || !!S.sec; $('nx3').textContent = all ? t.v3.again : t.v3.next;
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-a="sec:${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('sec3').innerHTML = sc('kcal', '🔥') + sc('salt', '🧂');
  const kOk = S.g3.filter((q, i) => q === R3[i].ok).length;
  if (S.sec === 'kcal') {
    lab.setReadout(`${kcalOf(P.mues)}`, `${t.kcal} / 100 ${t.g}`, '', '#e0b050');
    lab.setState({ emo: '🔥', title: t.kc.title, lead: t.kc.lead, body: t.kc.body(kcalOf(P.mues), Math.round(kcalOf(P.mues) * 4.184)), extra: '' });
    lab.setFacts([fact(t, 'kcal')]); return;
  }
  if (S.sec === 'salt') {
    lab.setReadout(`${f1(P.mues.salt)} ${esc(t.g)}`, `${t.sa.salt} / 100 ${t.g}`, dec('× 2.5'), '#f5c84c');
    lab.setState({ emo: '🧂', title: t.sa.title, lead: t.sa.lead(f1(P.mues.na), f1(P.mues.salt)), body: t.sa.body, extra: '' });
    lab.setFacts([fact(t, 'salt1'), fact(t, 'salt2')]); return;
  }
  if (!done) {
    lab.setReadout('?', t.v3.claim[R.p], '', '#5fa8a0');
    lab.setState({ emo: icons[r], title: t.p[R.p], lead: t.v3.lead0, body: '', extra: `<div class="fl-note">${esc(t.fine)}</div>` });
    lab.setFacts([]); return;
  }
  const ok = g === R.ok;
  let tt, ll, facts;
  if (R.p === 'juice') { tt = t.v3.juiceT; ll = t.v3.juiceL(f1(p.sug)); facts = [fact(t, 'juice1'), fact(t, 'juice2')]; lab.setReadout(`${f1(p.sug)} ${esc(t.ml)}`, t.rows.sug, '', '#5fa8a0'); }
  else if (R.p === 'gran') { tt = t.v3.granT; ll = t.v3.granL(f1(p.fib), f1(p.sug)); facts = [fact(t, 'gran')]; lab.setReadout(`${f1(p.sug)} ${esc(t.g)}`, t.rows.sug, '', LC[lvOf(p, 'sug')]); }
  else { tt = t.v3.yogT; ll = t.v3.yogL(f1(p.fat), f1(P.reg.fat), Math.round((1 - p.fat / P.reg.fat) * 100), f1(p.sug)); facts = [fact(t, 'yog')]; lab.setReadout(`${f1(p.sug)} · ${f1(P.reg.sug)} ${esc(t.g)}`, t.rows.sug, '', '#d6476f'); }
  lab.setState({ emo: ok ? '✅' : '🔎', title: `${ok ? t.ok : t.no} ${tt}`, lead: ll, body: all ? t.v3.sum(kOk) : '', extra: `<div class="fl-note">${esc(t.fine)}</div>` });
  lab.setFacts(facts);
}
render();
</script>
