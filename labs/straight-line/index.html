    if (S.z) { S.P.x = 0; S.P.y = 0; if (S.Q.x === 0 && S.Q.y === 0) S.Q = { x: 4, y: 2 }; }
  } else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (lab.view !== 'meter') { lab.view = 'meter'; lab.renderChrome(); }
    S.mode = S.mode === k ? 'taxi' : k; resetDrive(); sfx.click(); showStage();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => { if (ev.target.id === 'tRange') { S.trip = +ev.target.value; render(); } });

// --- render --------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v === 'slope' && S.z ? 'slope0' : v;
  $('sM').style.display = v === 'meter' ? '' : 'none';
  $('sT').style.display = v === 'two' ? '' : 'none';
  $('sS').style.display = v === 'slope' ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${v === 'meter' && S.mode === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('bat', '🔋') + sc('sq', '🌀');
  lab.setFacts(t.facts[v]);
  if (v === 'meter') renderMeter(t); else if (v === 'two') renderTwo(t); else renderSlope(t);
}

function renderMeter(t) {
  const sc = scene(), ph = phase(), K = kv(), m = t.m, f = sc.f, taxiM = S.mode === 'taxi', cap = t.cap[S.mode];
  lab.setGlow(S.mode === 'bat' ? 'rgba(61,220,151,.22)' : S.mode === 'sq' ? 'rgba(165,139,255,.26)' : 'rgba(246,196,69,.2)');
  $('mSteps').style.display = taxiM ? '' : 'none';
  $('mSteps').innerHTML = taxiM ? stepper('fee', `${m.fee} (${K.b})`, ph === 'drive') + stepper('ppk', `${m.ppk} (${K.k})`, ph === 'drive') : '';
  // value table: one cell per km post the taxi has passed
  $('mTblH').textContent = S.t >= 0 ? `${cap[0]} · ${cap[1]}` : '';
  $('mTbl').innerHTML = S.t >= 0 ? Array.from({ length: S.shown }, (_, j) => `<span class="ln-cell"><i>${j}</i><b>${esc(N(Math.max(0, f(j))))}</b></span>`).join('') : '';
  const btn = $('mDrive');
  btn.textContent = ph === 'drive' ? m.wait : ph === 'done' ? m.again : taxiM ? m.drive : m.start;
  btn.disabled = ph === 'drive' || (taxiM && ph === 'predict' && S.guess === null);
  $('mNote').textContent = taxiM && ph === 'predict' ? (S.guess === null ? m.tap : m.tapped(N(S.guess))) : '';
  let color = sc.col;
  if (taxiM) {
    if (ph === 'predict') {
      lab.setReadout('?', `${m.six}`, S.guess === null ? '' : m.pillG(N(S.guess)), color);
      lab.setState({ emo: '🤔', title: m.q, lead: m.lead0, body: '', extra: '' });
    } else if (ph === 'drive') {
      lab.setState({ emo: '🚕', title: m.drv, lead: m.drvLead, body: '', extra: '' });
    } else {
      const v6 = f(6), d = Math.abs((S.guess ?? 0) - v6), ok = d <= 0.75;
      lab.setReadout(formula(S.v.ppk, S.v.fee), m.sub, '', color);
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? m.right : m.off, lead: m.cmp(N(S.guess ?? 0), N(v6), N(d)), body: m.legend(N(S.v.ppk), N(S.v.fee), K, K),
        extra: `<div><b>${esc(`y = ${K.k}x + ${K.b}`)}</b> → <b>${esc(formula(S.v.ppk, S.v.fee))}</b></div>` });
    }
  } else {
    const bm = S.mode === 'bat' ? t.bat : t.sq;
    if (ph === 'predict') {
      lab.setReadout(S.mode === 'bat' ? formula(-8, 100) : 'y = x²', '', '', color);
      lab.setState({ emo: S.mode === 'bat' ? '🔋' : '🌀', title: bm.ready, lead: bm.readyLead, body: '', extra: '' });
    } else if (ph === 'drive') {
      lab.setState({ emo: S.mode === 'bat' ? '🔋' : '🌀', title: bm.ready, lead: t.m.drvLead, body: '', extra: '' });
    } else if (S.mode === 'bat') {
      lab.setReadout(formula(-8, 100), '', `${K.k} = −8`, color);
      lab.setState({ emo: '🔋', title: bm.doneT, lead: bm.doneLead(K), body: bm.empty(N(100 / 8)), extra: '' });
    } else {
      lab.setReadout('y = x²', '', '', color);
      lab.setState({ emo: '🌀', title: bm.doneT, lead: bm.doneLead, body: bm.body, extra: '' });
    }
  }
}

function renderTwo(t) {
  const K = kv(), C = twoCalc(), tw = t.two, rev = S.rev;
  lab.setGlow('rgba(46,196,182,.2)');
  const card = (i, bk, kk, col) => `<div class="ln-tx" style="--c:${col}"><h4>${esc(tw.tx[i])}</h4><div class="ln-steps">${stepper(bk, `${tw.fee} (${K.b})`, false)}${stepper(kk, `${tw.ppk} (${K.k})`, false)}</div></div>`;
  $('tCards').innerHTML = card(0, 'Ab', 'Ak', COL.A) + card(1, 'Bb', 'Bk', COL.B);
  $('tCheck').textContent = rev ? tw.again : tw.check;
  $('tCheck').disabled = !rev && S.g2 === null;
  $('tNote').textContent = rev ? '' : S.g2 === null ? tw.place : tw.placed(N(S.g2));
  $('tTrip').style.display = rev ? '' : 'none';
  $('tRange').value = S.trip;
  $('tTripL').textContent = `${tw.trip}: ${tw.tripKm(N(S.trip))}`;
  const pa = C.a.b + C.a.k * S.trip, pb = C.b.b + C.b.k * S.trip, gap = Math.abs(pa - pb);
  const cheaper = gap < 0.005 ? tw.equal : tw.cheaper(tw.tx[pa < pb ? 0 : 1], money(gap));
  $('tTripT').textContent = `${tw.tx[0]}: ${money(pa)} · ${tw.tx[1]}: ${money(pb)}`;
  if (!rev) {
    lab.setReadout('?', S.g2 === null ? '' : tw.placed(N(S.g2)), '', COL.B);
    lab.setState({ emo: '🤔', title: tw.q, lead: tw.lead, body: '', extra: '' });
    return;
  }
  const g = S.g2, trip = `<div><b>${esc(`${tw.trip}: ${tw.tripKm(N(S.trip))}`)}</b> · ${esc(cheaper)}</div>`;
  if (C.kind === 'x') {
    const ok = Math.abs(g - C.x) <= 0.25;
    lab.setReadout(`${N(C.x)} ${t.km} · ${N(C.y)} 🪙`, tw.crossSub, '', COL.ok);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? tw.right : tw.off, lead: ok ? tw.cross(N(C.x), N(C.y)) : tw.offLead(N(g), N(C.x)), body: ok ? tw.crossBody : tw.cross(N(C.x), N(C.y)), extra: trip });
  } else {
    const [ti, le] = C.kind === 'par' ? [tw.par, tw.parLead] : C.kind === 'same' ? [tw.same, tw.sameLead] : [tw.out, tw.outLead(tw.tx[C.cheap])];
    lab.setReadout('—', '', '', COL.B);
    lab.setState({ emo: '↔️', title: ti, lead: le, body: '', extra: trip });
  }
}

function renderSlope(t) {
  const K = kv(), s = t.s, { dx, dy, vert, k, b } = slopeCalc();
  lab.setGlow('rgba(111,168,255,.22)');
  $('sZ').textContent = s.through; $('sZ').classList.toggle('on', S.z);
  $('sNote').textContent = S.z ? s.dragZ : s.drag;
  if (vert) {
    lab.setReadout(`${s.dx} = 0`, '', '', '#ff6b6b');
    lab.setState({ emo: '🚧', title: s.vert[0], lead: s.vert[1], body: '', extra: '' });
    return;
  }
  lab.setReadout(`${K.k} = ${frac(dy, dx)} = ${N(k)}`, s.sub, `${K.b} = ${N(b)}`, COL.dx);
  const lead = k > 0 ? s.up(N(k)) : k < 0 ? s.down(N(-k)) : s.flat;
  lab.setState({ emo: '📐', title: s.title, lead, body: s.start(K, N(b)), extra: S.z ? `<div><b>${esc(s.prop)}</b></div>` : '' });
}
render();
</script>
