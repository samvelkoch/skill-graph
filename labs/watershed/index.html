const toGrid = (M, x, y) => [clamp((x - M.x) / M.s, 0, GW - 0.001), clamp((y - M.y) / M.s, 0, GH - 0.001)];
cvs.addEventListener('pointerdown', (ev) => {
  const [x, y] = loc(ev); S.ptr = true;
  try { cvs.setPointerCapture(ev.pointerId); } catch { /* not supported */ }
  if (S.sec === 'triple') return triTap(x, y);
  if (S.sec) return;
  const M = S.M;
  if (lab.view === 'rain' && inMap(M, x, y)) rainTap(...toGrid(M, x, y));
  else if (lab.view === 'divide' && inMap(M, x, y)) { const D = S.div, g = toGrid(M, x, y); D.prev = { p: D.line.p, q: D.line.q }; D.line = { p: g, q: g }; D.drag = true; }
});
cvs.addEventListener('pointermove', (ev) => {
  if (!S.ptr || S.sec) return;
  const [x, y] = loc(ev), M = S.M;
  if (lab.view === 'rain' && S.rain.phase === 'ask' && inMap(M, x, y)) rainTap(...toGrid(M, x, y));
  else if (lab.view === 'divide' && S.div.drag && M) S.div.line.q = toGrid(M, x, y);
});
const release = () => {
  S.ptr = false; const D = S.div;
  if (D.drag) { D.drag = false; if (Math.hypot(D.line.q[0] - D.line.p[0], D.line.q[1] - D.line.p[1]) < 6 && D.prev) D.line = D.prev; sfx.tick(); }
};
cvs.addEventListener('pointerup', release); cvs.addEventListener('pointercancel', release);

// --- one render per change: controls, readout, state card and facts ----------------------------------------------------
const show = (id) => { for (const k of ['rain', 'div', 'pro', 'dan', 'tri']) $('ws-' + k).hidden = k !== id; };
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  document.body.dataset.v = sec ? 'sec-' + (sec === 'danube' ? 'danube' : 'triple') : v;
  $('ws-sec').innerHTML = [['danube', '🇪🇺'], ['triple', '⛰️']].map(([k, emo]) =>
    `<button class="chip secret ws-t ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  askEl.hidden = true; coverEl.hidden = true;
  if (sec === 'danube') renderDan(t); else if (sec === 'triple') renderTri(t);
  else if (v === 'rain') renderRain(t); else if (v === 'divide') renderDiv(t); else renderPro(t);
}
function renderRain(t) {
  show('rain'); lab.setGlow('rgba(80,150,230,.3)');
  const R = S.rain, rt = t.rain, M = S.M;
  $('ws-flood').hidden = R.tries < 4; $('ws-flood').textContent = R.flood ? rt.hide : `🌧️ ${rt.flood}`;
  $('ws-rnote').textContent = R.tries < 4 ? rt.need(R.tries) : '';
  lab.setReadout(R.tries ? `${R.right}/${R.tries}` : '—', R.tries ? rt.sub : rt.subIdle, R.phase === 'end' ? t.rv[R.to] : '', R.phase === 'end' ? BCOL[R.to] : '#63bcff');
  const ok = R.guess !== null && R.guess === R.to;
  let st;
  if (R.phase === 'ask') st = { emo: '🤔', title: rt.ask, lead: rt.askLead };
  else if (R.phase === 'fall' || R.phase === 'run') st = { emo: '💧', title: rt.run[0], lead: rt.run[1] };
  else if (R.phase === 'end') st = R.guess !== null ? { emo: ok ? '✅' : '🤔', title: ok ? t.ok : rt.no, lead: rt.to[R.to], body: rt.why } : { emo: '💧', title: rt.to[R.to], lead: rt.more, body: rt.why };
  else if (R.flood) st = { emo: '🗺️', title: rt.floodTitle, lead: rt.floodLead, body: rt.floodBody };
  else st = { emo: '🌧️', title: rt.idle[0], lead: rt.idle[1], body: rt.idle[2] };
  lab.setState({ body: '', ...st }); lab.setFacts(t.facts.rain);
  // the question sits over the half of the map away from the tap
  if (R.phase === 'ask' || (R.phase === 'end' && R.guess !== null)) {
    const low = M && R.tap ? M.y + R.tap[1] * M.s > $('stage').clientHeight * 0.5 : false;
    askEl.className = `ws-ask card ${low ? 'top' : 'bot'}`; askEl.hidden = false;
    askEl.innerHTML = R.phase === 'ask'
      ? `<div class="q">${esc(rt.ask)}</div><div class="ws-opts"><button class="ws-a" data-g="0">${esc(t.rv[0])}</button><button class="ws-b" data-g="1">${esc(t.rv[1])}</button></div>`
      : `<div class="v" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.ok : rt.no)}</div><p>${esc(rt.to[R.to])} ${esc(rt.more)}</p>`;
  }
}
function renderDiv(t) {
  show('div'); lab.setGlow('rgba(141,123,255,.26)');
  const D = S.div, dt = t.div, pickedId = D.pick === null ? null : D.order[D.pick], ok = pickedId === 'crest';
  $('ws-cands').innerHTML = D.order.map((id, k) => {
    const cls = D.checked ? (id === 'crest' ? ' good' : D.pick === k ? ' bad' : '') : D.pick === k ? ' on' : '';
    return `<button class="chip ws-t ws-cand${cls}" data-cand="${k}" style="--c:${CCOL[k]}"${D.checked ? ' disabled' : ''}><i></i><b>${k + 1}</b><span>${esc(dt.cands[CAND_I[id]])}</span></button>`;
  }).join('');
  $('ws-check').textContent = D.checked ? dt.again : dt.check; $('ws-check').disabled = !D.checked && D.pick === null;
  $('ws-dnote').textContent = !D.checked && D.pick === null ? dt.need : '';
  if (!D.checked) {
    lab.setReadout('?', dt.idleSub, '', '#8d7bff'); lab.setState({ emo: '⛰️', title: dt.title, lead: dt.lead, body: '' });
  } else {
    const pa = Math.round(AREA[0] / (AREA[0] + AREA[1]) * 100);
    lab.setReadout(`<span style="color:#b6aaff">A</span> ${fmt(AREA[0])} ${esc(t.km2)}`, `B ${fmt(AREA[1])} ${t.km2}`, `A ${pa}% · B ${100 - pa}%`, '#8d7bff');
    lab.setState(ok ? { emo: '✅', title: t.ok, lead: dt.doneLead, body: dt.doneBody }
      : { emo: '🤔', title: dt.no, lead: pickedId === 'valley' ? dt.whyValley : dt.whyStraight, body: `${dt.doneLead} ${dt.doneBody}` });
  }
  lab.setFacts(t.facts.divide);
}
function renderPro(t) {
  show('pro'); lab.setGlow('rgba(80,180,150,.28)');
  const P = S.pro, pt = t.pro, free = P.phase === 'free';
  $('ws-slider').hidden = !free; $('ws-e0').textContent = t.terms.source; $('ws-e1').textContent = t.terms.mouth;
  $('ws-play').textContent = P.play ? pt.stop : pt.play; $('ws-pnote').textContent = free ? pt.simple : '';
  $('ws-slide').value = Math.round(P.p * 1000);
  coverEl.hidden = free;
  if (P.phase === 'ask') {
    coverEl.innerHTML = `<div class="e">🚣</div><div class="q">${esc(pt.q)}</div><div class="ws-opts">${pt.opts.map((o, i) => `<button data-g="${i}">${esc(o)}</button>`).join('')}</div>`;
    lab.setReadout('?', '', '', '#5fb59a'); lab.setState({ emo: '🚣', title: pt.q, lead: pt.lead, body: '' });
  } else if (P.phase === 'verdict') {
    const ok = P.guess === 0;
    coverEl.innerHTML = `<div class="v" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.ok : pt.no)}</div><p>${esc(pt.fast)}</p>
      <div class="ws-opts">${pt.opts.map((o, i) => `<button class="${i === 0 ? 'good' : i === P.guess ? 'dim' : ''}" disabled>${esc(o)}</button>`).join('')}</div>
      <button class="go" data-go="1">${esc(pt.go)} →</button>`;
    lab.setReadout('?', '', '', '#5fb59a'); lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ok : pt.no, lead: pt.fast, body: pt.note });
  } else {
    const z = proAt(P.p).zone; P.zone = z;
    proReadout(); lab.setState({ emo: ['⛰️', '🏞️', '🌾'][z], title: pt.zones[z][0], lead: pt.zones[z][1], body: '', extra: `<div>${esc(pt.note)}</div>` });
  }
  lab.setFacts(t.facts.profile);
}
function renderDan(t) {
  show('dan'); lab.setGlow('rgba(232,182,76,.26)');
  const d = t.dan;
  $('ws-leg').innerHTML = `<span><i style="background:#e8b64c"></i>${esc(d.gold)}</span><span><i style="background:#6a8fd2"></i>${esc(d.blue)}</span><span><i style="border:2px dashed #fff"></i>${esc(t.terms.basin)}</span>`;
  lab.setReadout('19', d.sub, d.pill, '#e8b64c'); lab.setState({ emo: '🇪🇺', title: d.title, lead: d.lead, body: d.body }); lab.setFacts([]);
}
function renderTri(t) {
  show('tri'); lab.setGlow('rgba(255,162,60,.24)');
  const d = t.tri, c = S.tri.counts, n = c[0] + c[1] + c[2];
  $('ws-clear').textContent = `↺ ${d.clear}`;
  lab.setReadout(n ? String(n) : '—', d.sub, '', '#ffb15c');
  lab.setState({ emo: '⛰️', title: d.title, lead: d.lead, body: d.body,
    extra: n ? d.seas.map((s, i) => `<span style="color:${SEACOL[i]}">●</span> ${esc(s[0])}: <b>${c[i]}</b>`).join(' &nbsp; ') : '' });
  lab.setFacts([]);
}

// --- the loop ----------------------------------------------------------------------------------------------------------
function placeOverlays(w, h) {
  const k = `${w}|${h}`; if (k === S.placed) return; S.placed = k;
  const L = proLayout(w, h);
  Object.assign(coverEl.style, { left: `${L.sc.x}px`, top: `${L.sc.y}px`, width: `${L.sc.w}px`, height: `${L.sc.h}px` });
}
canvasLoop(cvs, (ctx, w, h, dt, time) => {
  S.time = time; placeOverlays(w, h);
  try {
    if (S.sec === 'danube') drawDanube(ctx, w, h, dt, time);
    else if (S.sec === 'triple') drawTriple(ctx, w, h, dt, time);
    else if (lab.view === 'rain') drawRain(ctx, w, h, dt, time);
    else if (lab.view === 'divide') drawDivide(ctx, w, h, dt, time);
    else drawProfile(ctx, w, h, dt, time);
  } catch (e) { console.error(e); }
});
render();
</script>
</body>
