// --- render: controls, readout, state card, facts --------------------------------------------------------------
const tableHTML = (t, inf) => {
  const k = t.v1.tbl;
  if (inf.kind === 'focus') return `<table class="li-tb"><tr><td>${esc(k.img)}</td><td>${esc(k.none)}</td></tr></table>`;
  const m = fmt(inf.m);
  const size = Math.abs(inf.m - 1) < 0.05 ? k.same : inf.m > 1 ? k.big(m) : k.small(m);
  return `<table class="li-tb"><tr><td>${esc(k.img)}</td><td>${esc(inf.real ? k.real : k.virt)}</td></tr>
    <tr><td>${esc(k.dir)}</td><td>${esc(inf.real ? k.inv : k.up)}</td></tr>
    <tr><td>${esc(k.size)}</td><td>${esc(size)}</td></tr>
    <tr><td>${esc(k.dist)}</td><td>${esc(inf.real ? k.dReal(fmt(inf.v)) : k.dVirt(fmt(Math.abs(inf.v))))}</td></tr></table>`;
};
const setPred = (q, opts, note) => {
  $('pred').hidden = false; $('prNote').hidden = !note; $('prNote').textContent = note || '';
  $('prQ').textContent = q;
  $('prO').innerHTML = opts.map((o, i) => `<button type="button" data-i="${i}">${esc(o)}</button>`).join('');
};
const setSlider = (id, label, value, text, min, max, off) => {
  $('row' + id).hidden = !!off; if (off) return;
  $('l' + id).textContent = label; $('v' + id).textContent = text;
  const r = $('r' + id); if (min !== undefined) { r.min = min; r.max = max; } if (+r.value !== value) r.value = value;

function render() {
  const t = T[lang], v = lab.view;
  $('pred').hidden = true; $('c1').hidden = v !== 'bench'; $('c2').hidden = v !== 'rays'; $('c3').hidden = v !== 'mirror';
  document.body.dataset.v = v;
  if (v === 'bench') render1(t); else if (v === 'rays') render2(t); else render3(t);

function render1(t) {
  const T1 = t.v1, f = S.f, u = S.u, pend1 = S.p1 === null, pend2 = S.p2Pend, play = !pend1 && !pend2;
  lab.setGlow('rgba(255, 179, 71, .22)');
  $('c1').hidden = !play;
  const mode = S.mode;
  setSlider('U', mode === 'proj' ? T1.proj.lU : T1.lU, u, `${fmt(u)} ${t.cm}`, rangeU()[0], rangeU()[1], false);
  setSlider('S', T1.lS, S.s, `${fmt(S.s)} ${t.cm}`, 5, 42, !!mode);
  setSlider('F', T1.lF, f, `${fmt(f)} ${t.cm}`, 4.5, 12, mode !== 'eye');
  $('bLens').textContent = S.lensOut ? T1.lensIn : T1.lensOut; $('bLens').hidden = !!mode;
  const open = secret.unlocked();
  $('sec1').innerHTML = [['proj', '📽️'], ['eye', '👁️']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${mode === k ? 'on' : ''}" data-sec="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (pend1) {
    setPred(T1.pq(fmt(15), fmt(F0)), T1.po);
    lab.setReadout('?', T1.subPend(fmt(15)), '', '#ffb347');

    return;
  }
  if (pend2) {
    setPred(T1.p2q, T1.p2o);
    lab.setReadout('?', T1.subPend(fmt(u)), '', '#ffb347');
    lab.setState({ emo: '🤔', title: T1.p2Title, lead: T1.p2Lead, body: '', extra: '' });
    return;
  }

  // readout

  }

    return;
  }
  const ex = S.ex, ey = S.ey, k = (0 - ex) / (d - ex), yT = 4 * k + ey * (1 - k), yB = 0.2 * k + ey * (1 - k), see = yT >= 0 && yT <= 14.5 && yB >= 0 && yB <= 14.5;
  lab.setReadout(`${fmt(d)} ${t.cm}`, T3.sub, see ? T3.pillSee : T3.pillNo, '#a78bfa');
  let st;
  if (S.verdict3) st = { emo: S.verdict3.ok ? '✅' : '🤔', title: S.verdict3.ok ? t.right : t.notQuite, lead: T3.right(fmt(S.d)), body: T3.virt };
  else if (S.scr3) st = { emo: '📺', title: T3.scrT, lead: T3.scrL, body: '' };
  else st = see ? { emo: '👁️', title: T3.seeT, lead: T3.seeL, body: T3.virt } : { emo: '🙈', title: T3.noT, lead: T3.noL, body: '' };
  lab.setState({ ...st, extra: '' });
}
// any move clears the verdict of the mirror question
const clearV3 = () => { if (S.verdict3) { S.verdict3 = null; } };
$('c3').addEventListener('input', clearV3); $('c3').addEventListener('click', clearV3);
cv.addEventListener('pointerdown', () => { if (lab.view === 'mirror') clearV3(); });
render();
</script>
