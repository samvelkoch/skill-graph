<script type="module">
import { shell, canvasLoop, secretLab, sfx, store, $, esc, clamp, lerp, ruPlural, lang } from '../lab.js';

// --- number formatting (decimal comma in RU and HU) ------------------------------------------------------------
const nfc = new Map();
const nf = (d0, d1) => { const k = lang + d0 + d1; if (!nfc.has(k)) nfc.set(k, new Intl.NumberFormat(lang, { minimumFractionDigits: d0, maximumFractionDigits: d1 })); return nfc.get(k); };

const f1 = (x) => nf(0, 1).format(x);
const y1 = (x) => nf(1, 1).format(x);
const fc = (x) => (x >= 1000 ? f0(x) : f1(x)); // coins

// --- texts -------------------------------------------------------------------------------------------------

// --- time ------------------------------------------------------------------------------------------------

  if (S.sec === 'card' && S.play === 'card') {
    const sim = SIM[S.plan]; S.cm = Math.min(sim.months, S.cm + dt * S.cmRate);
    if (S.cm >= sim.months) S.play = null;
    const m = Math.floor(S.cm); if (m !== S.lastCm || !S.play) { S.lastCm = m; render(); }
    return;

  if (!S.play || S.sec) return;

  const save = S.play === 'save', step = save ? clamp(5 / Math.max(1, S.years), .12, .55) : .5, lim = save ? S.years : S.byears;

  setHTML($('planChips'), ['min', 'fix'].map((p, i) => `<button class="chip il-chip ${S.plan === p ? 'on' : ''}" data-act="plan" data-p="${p}">${esc(c.chips[i])}</button>`).join(''));
  $('crun').textContent = c.run;
  lab.setReadout(`${fc(sim.D[m])} 🪙`, c.sub(t.ym(m)), c.pill(sim.P[m]), S.plan === 'min' ? '#ff6a6a' : '#3ddc97');
  if (done) { const e = c.end(S.plan, t.ym(sim.months), sim.paid, sim.int); lab.setState({ emo: S.plan === 'min' ? '💳' : '✅', title: e[0], lead: e[1], body: S.plan === 'min' ? c.bodyMin : c.bodyFix, extra: '' }); }
  else { const r = c.running(t.ym(m), sim.D[m], sim.P[m], sim.I[m]); lab.setState({ emo: '💳', title: r[0], lead: r[1], body: '', extra: '' }); }
}
render();
</script>
</body>
