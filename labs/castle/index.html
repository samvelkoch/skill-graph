const clamp01 = (x) => Math.min(1, Math.max(0, x));
const clamp3 = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - (1 - clamp01(t)) ** 3;
const easeIn = (t) => clamp01(t) ** 2;

const hexRGB = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const toHex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(clamp3(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hexRGB(a), B = hexRGB(b); return toHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); };
const shade = (h, k) => (k >= 0 ? mix(h, '#0b0f1c', k) : mix(h, '#ffffff', -k)); // k > 0 darker, k < 0 lighter (hex in, hex out)
const rgba = (h, a) => { const [r, g, b] = hexRGB(h); return `rgba(${r},${g},${b},${a})`; };
const hash = (a, b = 0) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, r)); };

const PY = (x, y, z = 0) => OY + (x + y) * KY - z;
const pt = (x, y, z = 0) => [PX(x, y), PY(x, y, z)];

const polyP = (c, pts) => { c.beginPath(); pts.forEach(([x, y, z], i) => { const X = PX(x, y), Y = PY(x, y, z || 0); if (i) c.lineTo(X, Y); else c.moveTo(X, Y); }); c.closePath(); };
// face spaces: u runs along the face, v goes up (L: the face that looks left-down, R: right-down, T: the top)
const tfL = (c, x, y, z = 0) => c.transform(KX, KY, 0, -1, PX(x, y), PY(x, y, z));
const tfR = (c, x, y, z = 0) => c.transform(-KX, KY, 0, -1, PX(x, y), PY(x, y, z));
const tfT = (c, x, y, z = 0) => c.transform(KX, KY, -KX, KY, PX(x, y), PY(x, y, z));
function rrPlan(c, x0, y0, x1, y1, r, z = 0, dx = 0, dy = 0) {
  const pts = [], arc = (cx, cy, a0) => { for (let i = 0; i <= 6; i++) { const a = a0 + (Math.PI / 2) * i / 6; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } };
  arc(x1 - r, y0 + r, -Math.PI / 2); arc(x1 - r, y1 - r, 0); arc(x0 + r, y1 - r, Math.PI / 2); arc(x0 + r, y0 + r, Math.PI);
  c.beginPath(); pts.forEach(([x, y], i) => { const X = PX(x, y) + dx, Y = PY(x, y, z) + dy; if (i) c.lineTo(X, Y); else c.moveTo(X, Y); }); c.closePath();
}

// --- drawing: stone, boxes, towers ---------------------------------------------------------------------------
function mortar(c, w, h, bh, bw, seed) {
  const rows = Math.max(1, Math.round(h / bh)), rh = h / rows, cols = Math.max(1, Math.round(w / bw)), cw = w / cols;
  for (let r = 0; r < rows; r++) for (let k = -1; k < cols; k++) {
    const v = hash(r + seed * 7, k + 3);
    if (v >= .24) continue;
    const x0 = Math.max(0, k * cw + (r % 2) * cw / 2), x1 = Math.min(w, k * cw + (r % 2) * cw / 2 + cw);
    if (x1 <= x0) continue;
    c.fillStyle = v < .12 ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.09)';
    c.fillRect(x0, r * rh, x1 - x0, rh);
  }
  c.beginPath();
  for (let r = 1; r < rows; r++) { c.moveTo(0, r * rh); c.lineTo(w, r * rh); }
  for (let r = 0; r < rows; r++) for (let x = (r % 2) * cw / 2; x < w; x += cw) if (x > .5) { c.moveTo(x, r * rh); c.lineTo(x, (r + 1) * rh); }
  c.lineWidth = .8; c.strokeStyle = 'rgba(34,40,54,.4)'; c.stroke();
}
function faceStone(c, kind, x, y, z, w, h, base, o = {}) {
  c.save();
  (kind === 'L' ? tfL : tfR)(c, x, y, z);
  const col = kind === 'L' ? base : shade(base, .22);
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, shade(col, .16)); g.addColorStop(1, shade(col, -.07));
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const g2 = c.createLinearGradient(0, 0, w, 0);
  if (kind === 'L') { g2.addColorStop(0, 'rgba(255,255,255,.13)'); g2.addColorStop(1, 'rgba(255,255,255,0)'); }
  else { g2.addColorStop(0, 'rgba(0,0,0,0)'); g2.addColorStop(1, 'rgba(0,0,0,.1)'); }
  c.fillStyle = g2; c.fillRect(0, 0, w, h);
  mortar(c, w, h, o.bh || 8.5, o.bw || 14, o.seed || 0);
  c.lineWidth = 1; c.strokeStyle = 'rgba(28,33,46,.75)'; c.strokeRect(0, 0, w, h);
  c.restore();
}
function topStone(c, x, y, z, w, d, base) {
  c.save(); tfT(c, x, y, z);
  const g = c.createLinearGradient(0, 0, w, d);
  g.addColorStop(0, shade(base, -.3)); g.addColorStop(1, shade(base, -.12));
  c.fillStyle = g; c.fillRect(0, 0, w, d);
  c.lineWidth = 1; c.strokeStyle = 'rgba(28,33,46,.7)'; c.strokeRect(0, 0, w, d);
  c.restore();
}
function box(c, x0, y0, x1, y1, z0, z1, base) {
  c.lineJoin = 'round'; c.lineWidth = 1; c.strokeStyle = 'rgba(28,33,46,.78)';
  polyP(c, [[x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0]]); c.fillStyle = base; c.fill(); c.stroke();
  polyP(c, [[x1, y0, z1], [x1, y1, z1], [x1, y1, z0], [x1, y0, z0]]); c.fillStyle = shade(base, .24); c.fill(); c.stroke();
  polyP(c, [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]]); c.fillStyle = shade(base, -.22); c.fill(); c.stroke();
}
const merlonsX = (c, xa, xb, ya, yb, z) => { for (let x = xa + 2; x + 9 <= xb + .01; x += 16) box(c, x, ya, x + 9, yb, z, z + MH, PAL.stone); };
const merlonsY = (c, ya, yb, xa, xb, z) => { for (let y = ya + 2; y + 9 <= yb + .01; y += 16) box(c, xa, y, xb, y + 9, z, z + MH, PAL.stone); };
function slitFace(c, kind, x, y, z, u, v, a) {
  if (a <= 0) return;
  c.save(); (kind === 'L' ? tfL : tfR)(c, x, y, z); c.globalAlpha = a;
  c.fillStyle = '#12151f'; rr(c, u - 1.8, v, 3.6, 15, 1.8); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = .7; c.beginPath(); c.moveTo(u - 2.4, v); c.lineTo(u + 2.4, v); c.stroke();
  c.restore();
}
function archPath(c, u, v, w, h) {
  c.beginPath(); c.moveTo(u, v); c.lineTo(u, v + h - w / 2); c.arc(u + w / 2, v + h - w / 2, w / 2, Math.PI, 0, true); c.lineTo(u + w, v); c.closePath();
}

function tower(c, cx, cy, r, h, st, roof = true) {
  const X0 = PX(cx, cy), Y0 = PY(cx, cy), rx = r * 1.2247, ry = r * 0.7071;
  c.fillStyle = 'rgba(8,16,10,.28)'; c.beginPath(); c.ellipse(X0 + 10, Y0 + 3, rx * 1.15, ry * 1.25, 0, 0, 7); c.fill();
  const g = c.createLinearGradient(X0 - rx, 0, X0 + rx, 0);
  g.addColorStop(0, shade(PAL.stone, -.28)); g.addColorStop(.38, PAL.stone); g.addColorStop(1, shade(PAL.stone, .42));
  const body = () => { c.beginPath(); c.moveTo(X0 - rx, Y0 - h); c.lineTo(X0 + rx, Y0 - h); c.lineTo(X0 + rx, Y0); c.ellipse(X0, Y0, rx, ry, 0, 0, Math.PI); c.closePath(); };
  body(); c.fillStyle = g; c.fill();
  c.save(); body(); c.clip();
  const n = Math.max(2, Math.round(h / 8.5)), nJ = 7;
  c.beginPath();
  for (let k = 1; k < n; k++) { const zk = h * k / n; c.moveTo(X0 + rx, Y0 - zk); c.ellipse(X0, Y0 - zk, rx, ry, 0, 0, Math.PI); }
  for (let k = 0; k < n; k++) for (let j = 0; j < nJ; j++) {
    const th = (j + .5 * (k % 2)) * Math.PI / nJ; if (th <= .01 || th >= Math.PI - .01) continue;
    const x = X0 + rx * Math.cos(th), s = ry * Math.sin(th);
    c.moveTo(x, Y0 - h * k / n + s); c.lineTo(x, Y0 - h * (k + 1) / n + s);
  }
  c.lineWidth = .8; c.strokeStyle = 'rgba(34,40,54,.42)'; c.stroke();
  const sh = c.createLinearGradient(X0 - rx, 0, X0 + rx, 0);
  sh.addColorStop(0, 'rgba(255,255,255,.12)'); sh.addColorStop(.45, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,.16)');
  c.fillStyle = sh; c.fillRect(X0 - rx, Y0 - h, rx * 2, h + ry);
  c.restore();
  body(); c.lineWidth = 1; c.strokeStyle = 'rgba(28,33,46,.78)'; c.stroke();
  if (st.on.slits && st.slitA > 0) {
    c.save(); c.globalAlpha = st.slitA;
    for (const [f, zz] of [[0, .3], [-.55, .62], [.5, .62]]) {
      const q = Math.sqrt(1 - f * f), x = X0 + f * rx, y = Y0 - h * zz + ry * q, w = 3.4 * q + .6;
      c.fillStyle = '#12151f'; rr(c, x - w / 2, y - 8, w, 16, w / 2); c.fill();
    }
    c.restore();
  }
  if (!roof) return;
  const rxo = rx * 1.2, ryo = ry * 1.2, ay = Y0 - h - ROOFH;
  c.strokeStyle = 'rgba(0,0,0,.28)'; c.lineWidth = 4; c.beginPath(); c.ellipse(X0, Y0 - h + 1, rx, ry, 0, 0, Math.PI); c.stroke();
  const rg = c.createLinearGradient(X0 - rxo, 0, X0 + rxo, 0);
  rg.addColorStop(0, shade(PAL.roof, -.3)); rg.addColorStop(.4, PAL.roof); rg.addColorStop(1, shade(PAL.roof, .38));
  const cone = () => { c.beginPath(); c.moveTo(X0 - rxo, Y0 - h); c.lineTo(X0, ay); c.lineTo(X0 + rxo, Y0 - h); c.ellipse(X0, Y0 - h, rxo, ryo, 0, 0, Math.PI); c.closePath(); };
  cone(); c.fillStyle = rg; c.fill();
  c.save(); cone(); c.clip();
  c.beginPath();
  for (let i = 1; i < 8; i++) { const th = i * Math.PI / 8; c.moveTo(X0, ay); c.lineTo(X0 + rxo * Math.cos(th), Y0 - h + ryo * Math.sin(th)); }
  for (let k = 1; k < 5; k++) { const f = k / 5; c.moveTo(X0 + rxo * f, lerp(ay, Y0 - h, f)); c.ellipse(X0, lerp(ay, Y0 - h, f), rxo * f, ryo * f, 0, 0, Math.PI); }
  c.lineWidth = .8; c.strokeStyle = 'rgba(0,0,0,.2)'; c.stroke();
  c.restore();
  cone(); c.lineWidth = 1; c.strokeStyle = 'rgba(60,18,16,.85)'; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.32)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(X0 - rxo * .55, lerp(ay, Y0 - h, .5)); c.lineTo(X0 - .5, ay + 4); c.stroke();
  // pennant
  c.strokeStyle = PAL.steel; c.lineWidth = 1.4; c.beginPath(); c.moveTo(X0, ay); c.lineTo(X0, ay - 13); c.stroke();
  const wv = Math.sin(st.time * 4 + cx) * 1.6;
  c.fillStyle = CREAM; c.beginPath(); c.moveTo(X0, ay - 13); c.lineTo(X0 + 11, ay - 10.5 + wv); c.lineTo(X0, ay - 7); c.closePath(); c.fill();
}

function keep(c, st) {
  const x0 = L / 2 - KS, y0 = L / 2 - KS, x1 = L / 2 + KS, y1 = L / 2 + KS, w = KS * 2;
  c.fillStyle = 'rgba(8,16,10,.26)'; polyP(c, [[x0 + 5, y1, 0], [x1, y1, 0], [x1, y0 + 4, 0], [x1 + 10, y0 + 4, 0], [x1 + 10, y1 + 6, 0], [x0 + 5, y1 + 6, 0]]); c.fill();
  faceStone(c, 'R', x1, y0, 0, w, KH, PAL.stone, { seed: 11, bh: 9, bw: 13 });
  faceStone(c, 'L', x0, y1, 0, w, KH, PAL.stone, { seed: 12, bh: 9, bw: 13 });
  topStone(c, x0, y0, KH, w, w, PAL.stone);
  const win = (kind, ox, oy, u, v, ww, hh) => {
    c.save(); (kind === 'L' ? tfL : tfR)(c, ox, oy, 0);
    archPath(c, u - ww / 2, v, ww, hh); const g = c.createLinearGradient(0, v, 0, v + hh); g.addColorStop(0, '#f2cf7e'); g.addColorStop(1, '#6a4a28');
    c.fillStyle = g; c.fill(); c.lineWidth = 1.6; c.strokeStyle = shade(PAL.stone, .45); c.stroke();
    c.beginPath(); c.moveTo(u, v); c.lineTo(u, v + hh - ww / 2); c.moveTo(u - ww / 2, v + hh * .38); c.lineTo(u + ww / 2, v + hh * .38); c.lineWidth = 1; c.strokeStyle = shade(PAL.stone, .5); c.stroke();
    c.restore();
  };
  win('L', x0, y1, w / 2, 62, 11, 26); win('R', x1, y0, w / 2, 62, 11, 26); win('L', x0, y1, w / 2, 100, 9, 19);
  if (st.on.slits && st.slitA > 0) { slitFace(c, 'L', x0, y1, 0, 9, 24, st.slitA); slitFace(c, 'L', x0, y1, 0, w - 9, 24, st.slitA); slitFace(c, 'R', x1, y0, 0, 9, 24, st.slitA); slitFace(c, 'R', x1, y0, 0, w - 9, 24, st.slitA); }
  merlonsX(c, x0, x1, y0, y0 + 6, KH); merlonsY(c, y0, y1, x0, x0 + 6, KH);
  merlonsX(c, x0, x1, y1 - 6, y1, KH); merlonsY(c, y0, y1, x1 - 6, x1, KH);
  // flagpole and the flag that rises when the castle is complete
  const [fx, fy] = pt(L / 2, L / 2, KH + 2), ph = st.banner ? 60 : 46;
  c.strokeStyle = shade(PAL.steel, .25); c.lineWidth = 2; c.beginPath(); c.moveTo(fx, fy); c.lineTo(fx, fy - ph); c.stroke();
  c.fillStyle = GOLD; c.beginPath(); c.arc(fx, fy - ph, 2.4, 0, 7); c.fill();
  if (st.banner) drawBanner(c, fx, fy - ph + 4, st.time, st.banner);
  else if (st.flag > 0) {
    const top = lerp(fy - 10, fy - ph + 5, st.flag), fw = 28, fh = 17;
    c.beginPath();
    for (let u = 0; u <= fw; u += 4) { const y = top + Math.sin(st.time * 5 + u * .22) * 2 * (u / fw); if (u) c.lineTo(fx + u, y); else c.moveTo(fx, y); }
    for (let u = fw; u >= 0; u -= 4) { const y = top + fh + Math.sin(st.time * 5 + u * .22) * 2 * (u / fw); c.lineTo(fx + u - (u === fw ? 5 : 0), y); }
    c.closePath(); c.fillStyle = GOLD; c.fill(); c.lineWidth = 1; c.strokeStyle = shade(GOLD, .5); c.stroke();
    c.strokeStyle = shade(GOLD, .45); c.lineWidth = 1.6; c.beginPath(); c.moveTo(fx + 8, top + fh / 2); c.lineTo(fx + 19, top + fh / 2 + Math.sin(st.time * 5 + 4) * 1.4); c.stroke();
  }
}

function gatehouse(c, st) {
  const x0 = GX0, x1 = GX1, y0 = L - WT - 2, y1 = L + 6, w = x1 - x0;
  faceStone(c, 'R', x1, y0, 0, y1 - y0, GH, PAL.stone, { seed: 3 });
  faceStone(c, 'L', x0, y1, 0, w, GH, PAL.stone, { seed: 5 });
  topStone(c, x0, y0, GH, w, y1 - y0, PAL.stone);
  c.save(); tfL(c, x0, y1, 0);
  const dw = 24, dh = 38, u0 = (w - dw) / 2;
  archPath(c, u0 - 3, 0, dw + 6, dh + 3); c.fillStyle = shade(PAL.stone, .3); c.fill();
  archPath(c, u0, 0, dw, dh);
  const g = c.createLinearGradient(0, 0, 0, dh); g.addColorStop(0, '#7a6a4c'); g.addColorStop(.35, '#2a2a33'); g.addColorStop(1, '#12141c');
  c.fillStyle = g; c.fill();
  c.save(); archPath(c, u0, 0, dw, dh); c.clip();
  const hang = clamp01(st.pc) * dh;
  c.strokeStyle = '#2a2f3b'; c.lineWidth = 1.6; c.beginPath();
  for (let u = u0 + 3; u < u0 + dw; u += 4.6) { c.moveTo(u, dh); c.lineTo(u, dh - hang); }
  for (let v = dh - 5; v > dh - hang; v -= 7) { c.moveTo(u0, v); c.lineTo(u0 + dw, v); }
  c.stroke();
  c.fillStyle = '#2a2f3b';
  for (let u = u0 + 3; u < u0 + dw; u += 4.6) { c.beginPath(); c.moveTo(u - 1.5, dh - hang + .5); c.lineTo(u + 1.5, dh - hang + .5); c.lineTo(u, dh - hang - 3); c.fill(); }
  c.restore();
  archPath(c, u0, 0, dw, dh); c.lineWidth = 1.6; c.strokeStyle = shade(PAL.stone, .55); c.stroke();
  c.restore();
  st.hooks.gateTop?.(c);
  merlonsX(c, x0, x1, y1 - 6, y1, GH);
  box(c, x1 - 6, y0 + 2, x1, y0 + 8, GH, GH + MH, PAL.stone);
}

function bridge(c, st) {
  const xa = L / 2 - 12, xb = L / 2 + 12, y0 = L + 6, len = 33, b = st.beta, cb = Math.cos(b), sb = Math.sin(b);
  const yf = y0 + len * cb, zf = 3 + len * sb, under = b > .9, wood = under ? shade(PAL.wood, .25) : PAL.wood;
  const at = (x, t) => [x, lerp(y0, yf, t), lerp(3, zf, t)];
  // chains first (they hang behind the planks when the bridge is down)
  if (st.on.walls) {
    c.save(); c.strokeStyle = '#2c303c'; c.lineWidth = 2.2; c.setLineDash([3.2, 2]); c.lineCap = 'butt';
    for (const x of [xa, xb]) { c.beginPath(); c.moveTo(PX(x, y0 + 2), PY(x, y0 + 2, GH - 8)); c.lineTo(PX(x, yf), PY(x, yf, zf)); c.stroke(); }
    c.restore();
  }
  polyP(c, [at(xa, 0), at(xb, 0), at(xb, 1), at(xa, 1)]);
  const g = c.createLinearGradient(PX(xa, y0), PY(xa, y0, 3), PX(xa, yf), PY(xa, yf, zf));
  g.addColorStop(0, shade(wood, .15)); g.addColorStop(1, shade(wood, -.12));
  c.fillStyle = g; c.fill();
  c.strokeStyle = 'rgba(30,18,8,.55)'; c.lineWidth = 1; c.beginPath();
  for (let i = 1; i < 8; i++) { const t = i / 8, a = at(xa, t), d = at(xb, t); c.moveTo(PX(a[0], a[1]), PY(a[0], a[1], a[2])); c.lineTo(PX(d[0], d[1]), PY(d[0], d[1], d[2])); }
  c.stroke();
  c.strokeStyle = 'rgba(25,25,32,.6)'; c.lineWidth = 1.6; c.beginPath();
  for (const t of [.3, .7]) { const a = at(xa, t), d = at(xb, t); c.moveTo(PX(a[0], a[1]), PY(a[0], a[1], a[2])); c.lineTo(PX(d[0], d[1]), PY(d[0], d[1], d[2])); }
  c.stroke();
  polyP(c, [at(xa, 0), at(xb, 0), at(xb, 1), at(xa, 1)]); c.lineWidth = 1.4; c.strokeStyle = shade(PAL.wood, .6); c.stroke();
}

function courtyard(c) {
  c.save(); tfT(c, WT, WT, 0); const w = L - 2 * WT;
  const g = c.createLinearGradient(0, 0, w, w); g.addColorStop(0, shade(COURT, -.05)); g.addColorStop(1, shade(COURT, .18));
  c.fillStyle = g; c.fillRect(0, 0, w, w);
  c.strokeStyle = 'rgba(60,50,35,.28)'; c.lineWidth = .8; c.beginPath();
  for (let i = 1; i < 8; i++) { c.moveTo(i * w / 8, 0); c.lineTo(i * w / 8, w); c.moveTo(0, i * w / 8); c.lineTo(w, i * w / 8); }
  c.stroke(); c.restore();
}
function wallBackR(c) {
  faceStone(c, 'L', 0, WT, 0, L, WH, PAL.stone, { seed: 21 }); topStone(c, 0, 0, WH, L, WT, PAL.stone); merlonsX(c, 0, L, 0, 6, WH);
}
function wallBackL(c) {
  faceStone(c, 'R', WT, 0, 0, L, WH, PAL.stone, { seed: 22 }); topStone(c, 0, 0, WH, WT, L, PAL.stone); merlonsY(c, 0, L, 0, 6, WH);
}
function wallFrontR(c, st) {
  c.fillStyle = 'rgba(8,16,10,.24)'; polyP(c, [[L, 0, 0], [L + 6, 0, 0], [L + 6, L, 0], [L, L, 0]]); c.fill();
  faceStone(c, 'R', L, 0, 0, L, WH, PAL.stone, { seed: 23 });
  topStone(c, L - WT, 0, WH, WT, L, PAL.stone);
  if (st.on.slits) for (const u of [18, 46, 76, 106, 128]) slitFace(c, 'R', L, 0, 0, u, 17, st.slitA);
  st.hooks.rightTop?.(c);
  merlonsY(c, 0, L, L - 6, L, WH);
}
function wallFrontL(c, st) {
  c.fillStyle = 'rgba(8,16,10,.24)'; polyP(c, [[0, L, 0], [L, L, 0], [L, L + 6, 0], [0, L + 6, 0]]); c.fill();
  const seg = (xa, xb) => {
    faceStone(c, 'L', xa, L, 0, xb - xa, WH, PAL.stone, { seed: xa * .1 + 30 });
    topStone(c, xa, L - WT, WH, xb - xa, WT, PAL.stone);
    if (st.on.slits) for (const u of [16, 34, 106, 124]) if (u > xa + 3 && u < xb - 3) slitFace(c, 'L', xa, L, 0, u - xa, 17, st.slitA);
    merlonsX(c, xa, xb, L - 6, L, WH);
  };
  seg(0, GX0); gatehouse(c, st); seg(GX1, L);
}

// everything that makes the castle: parts drop in one by one (st.dy), the rest is drawn in painter's order
function drawCastle(c, st) {
  const { on } = st, lift = (p, k, fn) => { const d = st.dy(p, k); c.save(); c.translate(0, d); fn(); c.restore(); };
  if (on.walls) lift('walls', 0, () => { courtyard(c); wallBackR(c); wallBackL(c); });
  if (on.towers) lift('towers', 0, () => tower(c, 0, 0, TR, TH, st));
  if (on.keep) lift('keep', 0, () => keep(c, st));
  if (on.walls) lift('walls', 1, () => wallFrontR(c, st));
  if (on.walls) lift('walls', 2, () => wallFrontL(c, st));
  if (on.bridge) lift('bridge', 0, () => bridge(c, st));
  if (on.towers) { lift('towers', 1, () => tower(c, L, 0, TR, TH, st)); lift('towers', 2, () => tower(c, 0, L, TR, TH, st)); lift('towers', 3, () => tower(c, L, L, TR, TH, st)); }
}

// --- the moat: a ring of water around the island -------------------------------------------------------------
function perim(u) {
  const a = -(SM + WM / 2), b = L + SM + WM / 2, n = b - a, s = (((u % 1) + 1) % 1) * 4 * n;
  if (s < n) return [a + s, a]; if (s < 2 * n) return [b, a + s - n]; if (s < 3 * n) return [b - (s - 2 * n), b]; return [a, b - (s - 3 * n)];
}
function drawMoat(c, p, time) {
  if (p <= 0) return;
  const R0 = -(SM + WM), R1 = L + SM + WM, D = 7, C = pt(L / 2, L / 2, 0);
  c.save();
  if (p < 1) { const th = Math.PI * 2 * ease(p); c.beginPath(); c.moveTo(C[0], C[1]); c.arc(C[0], C[1], 800, Math.PI / 2 - th / 2, Math.PI / 2 + th / 2); c.closePath(); c.clip(); }
  rrPlan(c, R0, R0, R1, R1, 26, 0); c.fillStyle = shade(EARTH, .15); c.fill();
  c.save(); rrPlan(c, R0, R0, R1, R1, 26, 0); c.clip();
  const wg = c.createLinearGradient(0, 105, 0, 335); wg.addColorStop(0, shade(PAL.water, .3)); wg.addColorStop(1, mix(PAL.water, '#ffffff', .12));
  rrPlan(c, R0, R0, R1, R1, 26, 0, 0, D); c.fillStyle = wg; c.fill();
  // ripples and glints
  c.lineWidth = 1.2;

  1: '<svg viewBox="0 0 32 32"><path d="M9 6l7 3 7-3 6 6-4 4v12H7V16l-4-4z" fill="#9FA9B7" stroke="#1c2030" stroke-width="1.4" stroke-linejoin="round"/><path d="M10 15h12M10 19h12M10 23h12" stroke="#e5eaf1" stroke-width="1.4" stroke-dasharray="1.4 2"/></svg>',
  2: '<svg viewBox="0 0 32 32"><path d="M9 5c3 3 11 3 14 0l5 6-4 4v11c-3 2-13 2-16 0V15l-4-4z" fill="#C9D2DC" stroke="#1c2030" stroke-width="1.4" stroke-linejoin="round"/><path d="M16 8v18M10 18c4 2 8 2 12 0" stroke="#fff" stroke-width="1.3" fill="none" opacity=".75"/></svg>',
  3: '<svg viewBox="0 0 32 32"><path d="M7 25V15a9 9 0 0118 0v10z" fill="#C9D2DC" stroke="#1c2030" stroke-width="1.4" stroke-linejoin="round"/><rect x="9.5" y="15" width="13" height="3.4" rx="1.6" fill="#12151f"/><path d="M16 6c4-5 9-3 10 0-4-1-7 1-10 5z" fill="#C8453D" stroke="#1c2030" stroke-width="1"/></svg>',
  4: '<svg viewBox="0 0 32 32"><path d="M6 5h20v10c0 7-6 10-10 12C12 25 6 22 6 15z" fill="#C8453D" stroke="#C9D2DC" stroke-width="2" stroke-linejoin="round"/><path d="M16 5v22M6 13h20" stroke="#EAD9B0" stroke-width="3"/></svg>',
};

function renderBuild(t) {
  const n = (B.ans !== null ? 1 : 0) + B.built.filter(Boolean).length, unlocked = secret.unlocked();
  let html = '';
  const sc = (k, emo, name) => `<button class="chip secret ${unlocked ? 'open' : ''} ${B.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${unlocked ? `${emo} ${esc(t.secrets[name][0])}` : '🔒 ???'}</button>`;
  const chips = `<div class="chips" style="margin-top:12px">${sc('port', '🚪', 'portcullis')}${sc('arms', '🛡️', 'arms')}</div>`;
  if (B.ans === null) {
    lab.setReadout('?', '', '', '#9AA0AA'); lab.setState({ emo: t.st.build.n[0], title: t.st.build.n[1], lead: t.st.build.n[2], body: t.st.build.n[3] });
    html = `<div class="ca-q">${esc(t.b.q)}</div>${opts(t.b.o, 'bo')}`;
  } else if (!B.vShown) {
    lab.setReadout('?', '', '', '#9AA0AA'); lab.setState({ emo: t.st.build.n[0], title: t.st.build.n[1], lead: t.st.build.n[2], body: t.st.build.n[3] });
    html = `<div class="ca-q">${esc(t.b.q)}</div>`;
  } else {
    lab.setReadout(`${n}/6`, '', '', '#9AA0AA');
    const f = t.st.build[B.done ? 'f' : 'n'];
    lab.setState({ emo: f[0], title: f[1], lead: f[2], body: f[3] });
    if (B.sec === 'port') { lab.setState({ emo: '🚪', title: t.secrets.portcullis[0], lead: t.sec.portText, body: '' }); html = `<div class="row2" style="margin-top:0"><button class="btn" data-act="replay">${esc(t.again)}</button></div>${chips}`; }
    else if (B.sec === 'arms') {
      lab.setState({ emo: '🛡️', title: t.secrets.arms[0], lead: t.sec.armsText, body: '' });
      const A = B.arms;
      html = `<div class="ca-lbl" style="margin-top:0">${esc(t.arms.colour)}</div><div class="ca-pick">${t.arms.colors.map((cn, i) => `<button class="chip ${A.c === i ? 'on' : ''}" data-act="color" data-i="${i}"><span class="ca-sw" style="background:${ARMS_COL[i]}"></span>${esc(cn)}</button>`).join('')}</div>
        <div class="ca-lbl">${esc(t.arms.symbol)}</div><div class="ca-pick">${t.arms.symbols.map((sn, i) => `<button class="chip ${A.s === i ? 'on' : ''}" data-act="symbol" data-i="${i}">${['🦁', '🦅', '🗼', '⭐', '🔑'][i]} ${esc(sn)}</button>`).join('')}</div>${chips}`;
    } else {
      html = `${B.done ? '' : verdict(B.ans === 1, t)}<p class="ca-note">${esc(t.b.r)}</p>
        <div class="chips">${t.b.parts.map((p, i) => `<button class="chip ca-part ${B.built[i] ? 'on' : ''}" data-act="part" data-i="${i}">${esc(p)}</button>`).join('')}</div>
        <p class="ca-job">${B.job >= 0 ? `<b>${esc(t.b.parts[B.job])}</b> ${esc(t.b.jobs[B.job])}` : ''}</p>${B.done ? `<p class="ca-done">${esc(t.b.done)}</p><div class="row2" style="margin-top:0"><button class="btn ghost" data-act="again">${esc(t.again)}</button></div>` : ''}${chips}`;
    }
  }
  lab.setGlow('rgba(154, 160, 170, .24)');
  $('ctrlBody').innerHTML = html;
}

function renderSiege(t) {
  const s = S.s, r = s.round, a = s.ans[r], q = t.s[`q${r + 1}`], o = t.s[`o${r + 1}`];
  lab.setGlow('rgba(200, 69, 61, .24)');
  const last = r === 2 && s.vShown;
  const f = t.st.siege[last ? 'f' : 'n'];
  lab.setState({ emo: f[0], title: f[1], lead: f[2], body: f[3] });
  lab.setReadout(`${r + 1}/3`, '', '', '#C8453D');
  let html = `<div class="ca-q">${esc(q)}</div>`;
  if (a === null) html += opts(o, 'so', SPERM[r]);
  else if (s.vShown) html += `${verdict(a === 0, t)}<p class="ca-note">${esc(t.s.why[r])}</p><button class="btn" data-act="${r < 2 ? 'next' : 'sagain'}">${esc(r < 2 ? t.next : t.again)}</button>`;
  $('ctrlBody').innerHTML = html;
}

function renderKnight(t) {
  const K = S.k, vis = K.ans !== null && K.vShown;
  lab.setGlow('rgba(201, 210, 220, .24)');
  const f = t.st.knight[K.done ? 'f' : 'n'];
  lab.setState({ emo: f[0], title: f[1], lead: f[2], body: f[3] });
  lab.setReadout(K.ans === null ? '?' : `${K.n}/5`, '', '', '#C9D2DC');
  let html = `<div class="ca-q">${esc(t.k.q)}</div>`;
  if (K.ans === null) html += opts(t.k.o, 'ko');
  else if (vis) {
    html = `<div class="ca-verdict" style="color:${K.ans === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(K.ans === 1 ? t.right : t.wrong)}</div><p class="ca-note">${esc(t.k.r)}</p>
      <div class="ca-tray">${TRAY.map((j) => `<button class="ca-pc ${K.wrongIdx === j ? 'ca-shake' : ''}" data-act="piece" data-i="${j}" aria-label="${esc(t.k.order[j])}"${K.n > j ? ' disabled' : ''}>${ICON[j]}<span>${esc(t.k.order[j])}</span></button>`).join('')}</div>
      <p class="ca-wrong">${K.wrongIdx >= 0 ? esc(t.k.wrong) : ''}</p>${K.done ? `<button class="btn ghost" data-act="kagain">${esc(t.again)}</button>` : ''}`;
  }
  $('ctrlBody').innerHTML = html;
}

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v === 'build') renderBuild(t); else if (v === 'siege') renderSiege(t); else renderKnight(t);
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i, t = now();
  if (act === 'bo') { if (B.ans !== null) return; B.ans = i; B.revealAt = t; B.vAt = t + 1.9; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'part') {
    if (!B.built[i]) { B.built[i] = true; startPart(i, t); sfx.click(); if (B.built.every(Boolean)) { B.done = true; B.doneAt = t + 1.0; setTimeout(sfx.good, 1100); } }
    B.shown = i; B.shownAt = t; B.job = i; showStage();
  } else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    B.sec = B.sec === k ? null : k;
    if (B.sec === 'port') B.port = { dir: 1, t0: t, fired: false };
    sfx.click(); showStage();
  } else if (act === 'replay') { const down = B.port.dir === 1 && t - B.port.t0 > 1.1; B.port = { dir: down ? -1 : 1, t0: t, fired: false }; sfx.click(); }
  else if (act === 'color') { B.arms.c = i; sfx.snap(); }
  else if (act === 'symbol') { B.arms.s = i; sfx.snap(); }
  else if (act === 'again') {
    B.ans = null; B.vShown = false; B.built = [false, false, false, false, false]; B.drops = {}; B.slitAt = -9; B.shown = -1; B.job = -1; B.done = false; B.sec = null; sfx.click();
  } else if (act === 'so') {
    const s = S.s, r = s.round; if (s.ans[r] !== null) return;
    const opt = SPERM[r][i]; s.ans[r] = opt; s.revealAt = Math.max(t, s.t0 + APP[r]); s.vAt = s.revealAt + VD[r]; s.vShown = false; (opt === 0 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next') { const s = S.s; s.round++; s.t0 = t; s.vShown = false; s.revealAt = 0; sfx.click(); }
  else if (act === 'sagain') { Object.assign(S.s, { round: 0, ans: [null, null, null], t0: t, revealAt: 0, vShown: false, fired: {} }); sfx.click(); }
  else if (act === 'ko') {
    const K = S.k; if (K.ans !== null) return;
    K.ans = i; K.revealAt = t; K.vAt = t + .9; K.n = 1; K.t[1] = t; (i === 1 ? sfx.good : sfx.bad)(); setTimeout(sfx.snap, 150); showStage();
  } else if (act === 'piece') {
    const K = S.k;
    if (i === K.n) { K.n++; K.t[K.n] = t; K.wrongIdx = -1; sfx.snap(); if (K.n === 5) { K.done = true; setTimeout(sfx.good, 900); } showStage(); }
    else { K.wrongIdx = i; sfx.bad(); }
  } else if (act === 'kagain') { Object.assign(S.k, { ans: null, vShown: false, n: 0, t: [0, 0, 0, 0, 0, 0], wrongIdx: -1, done: false }); sfx.click(); }
  render();
});
render();
</script>
</body>
</html>
