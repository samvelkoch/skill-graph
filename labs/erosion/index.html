    $('rLbl').textContent = t.time; $('rSl').disabled = r.guess === null; $('rSl').value = r.t;
    $('rSpeed').textContent = `⏩ ${t.speed}`; $('rSpeed').disabled = r.guess === null; $('rSpeed').classList.toggle('on', r.playing);
    const st = r.guess === null ? m.s0 : !r.revealed ? m.s1 : [m.s2[0], ok ? t.right : m.wrongS, `${m.s2[1]} ${m.s2[2]}`];
    lab.setState({ emo: '🏞️', title: st[0], lead: st[1], body: st[2] });
    lab.setFacts(r.revealed ? t.facts.river : []);
  } else if (v === 'hill') {
    const m = t.h;
    setPred(m.q, m.opts, h.guess, 2, h.revealed, h.guess === null ? m.pick : '');
    $('cHill').style.display = h.guess === null ? 'none' : '';
    $('hChips').innerHTML = Object.keys(LOSS).map((k) => `<button class="chip ${h.cover === k ? 'on' : ''}" data-act="cover" data-k="${k}">${esc(m.covers[k])}</button>`).join('');
    $('hRain').textContent = `🌧️ ${m.rain}`; $('hRain').disabled = h.rainT > 0;
    let st, extra = '';
    if (h.guess === null) st = m.s0;
    else if (!h.shown) st = m.s1;
    else st = [m.covers[h.cover], m.txt[h.cover], h.rainT > 0 ? m.raining : h.revealed ? (h.guess === 2 ? m.ok : m.no) : ''];
    const tested = Object.keys(h.res);
    if (tested.length) extra = `<div class="er-cap" style="margin:0 0 6px">${esc(m.cmp)}</div><div class="er-bars">${tested.map((k) => `<div class="er-bar"><span>${esc(m.covers[k])}</span><i style="width:${h.res[k]}%"></i><b>${h.res[k]} %</b></div>`).join('')}</div>`;
    lab.setState({ emo: h.shown ? '🌧️' : '⛰️', title: st[0], lead: st[1], body: st[2], extra });
    lab.setFacts(t.facts.hill);
  } else if (v === 'wind') {
    $('wLbl').textContent = t.time; $('wSl').value = S.w.t;
    lab.setState({ emo: '🌬️', title: t.secrets.a[0], lead: t.secrets.a[1], body: t.w.body }); lab.setFacts([]);
  } else {
    $('dChips').innerHTML = ['grass', 'plough'].map((k) => `<button class="chip ${D.cover === k ? 'on' : ''}" data-act="dcover" data-k="${k}">${esc(t.d[k])}</button>`).join('');
    $('dWind').textContent = `💨 ${t.d.wind}`;
    lab.setState({ emo: '🌾', title: t.secrets.b[0], lead: t.secrets.b[1], body: !D.shown ? t.d.idle : D.cover === 'plough' ? t.d.pl : t.d.gr }); lab.setFacts([]);
  }
  const open = secret.unlocked();
  $('secRow').innerHTML = [['wind', '🌬️', t.secrets.a[0]], ['dust', '🌾', t.secrets.b[0]]].map(([k, emo, ti]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(ti)}` : '🔒 ???'}</button>`).join('');
  readout();
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h; update(dt);
  const v = S.sec || lab.view;
  if (v === 'frost') drawFrost(c, w, h, time); else if (v === 'river') drawRiver(c, w, h, time, dt);
  else if (v === 'hill') drawHill(c, w, h, time, dt); else if (v === 'wind') drawWind(c, w, h, time, dt); else drawDust(c, w, h, time, dt);
  readout();
});
render();
</script>
</body>
</html>
