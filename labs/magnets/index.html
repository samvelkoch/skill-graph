// --- objects: half-width (cm), how they react, from how far the magnet moves them (model cm) ----------------
const OBJ = {

  can: { emo: '🥫', half: 1.6, kind: 'none' },
  wire: { emo: '🪢', half: 2.0, kind: 'none' },
  marble: { emo: '🔮', half: 0.9, kind: 'none', rolls: true },
  magS: { emo: '🧲', half: 2.5, kind: 'pull', reach: 6.5, mass: 1.5 },

const TESTABLE = Object.keys(OBJ).filter((k) => !OBJ[k].secret);
const REST = 19.5, TABLE = 26, MAG_LEN = 7, FACE_MIN = 7.5, FACE_MAX = 18.3;

const nf = (x, d = 1) => new Intl.NumberFormat(lang === 'en' ? 'en' : lang, { maximumFractionDigits: d, minimumFractionDigits: d }).format(x);

// --- state -------------------------------------------------------------------------------------------------
const S = { obj: 'paperclip', face: FACE_MIN + 2, ox: REST, v: 0, stuck: false, guess: null, revealed: false,
  tested: store.get('magnets:tested', {}) };
const lab = shell({ key: 'magnets', T, topics: TOPICS, views: ['table', 'inside'], onLang: render, onView: render });
const secret = secretLab('magnets', () => ({
  secrets: ['filings', 'compass'].map((k) => ({ emo: OBJ[k].emo, title: T[lang].secrets[k][0], desc: T[lang].secrets[k][1] })),
  questions: T[lang].quiz,
}), () => { renderChips(); });

$('ctrlBody').innerHTML = `
  <input type="range" class="big" id="slider" min="0" max="1000" value="140" aria-label="magnet">
  <div class="ends"><span id="endL"></span><span id="endR"></span></div>
  <div class="chips" id="chips"></div>`;
$('slider').style.setProperty('--track', 'linear-gradient(90deg, #2b3550, #6d4aff 60%, #ff3b30)');
$('stage').insertAdjacentHTML('beforeend', '');
const sliderToFace = (v) => lerp(FACE_MIN, FACE_MAX, v / 1000);
$('slider').addEventListener('input', () => { S.face = sliderToFace(+$('slider').value); sfx.tick(); });

function pickObj(k) {
  if (OBJ[k].secret && !secret.unlocked()) return secret.open();
  S.obj = k; S.ox = REST; S.v = 0; S.stuck = false; S.guess = null; S.revealed = false;
  S.face = FACE_MIN + 2; $('slider').value = String(Math.round((S.face - FACE_MIN) / (FACE_MAX - FACE_MIN) * 1000));
  sfx.click(); render();
}
function renderChips() {
  const t = T[lang], open = secret.unlocked();
  const chip = (k) => {
    const o = OBJ[k];
    if (o.secret) return `<button class="chip secret ${open ? 'open' : ''} ${S.obj === k ? 'on' : ''}" data-k="${k}" title="${esc(t.secrets[k][1])}">${open ? `${o.emo} ${esc(t.obj[k][0])}` : '🔒 ???'}</button>`;
    return `<button class="chip ${S.obj === k ? 'on' : ''}" data-k="${k}">${o.emo} ${esc(t.obj[k][0])}${S.tested[k] ? ' ✓' : ''}</button>`;
  };
  $('chips').innerHTML = [chip('filings'), ...TESTABLE.map(chip), chip('compass')].join('');
}
$('chips').addEventListener('click', (ev) => { const b = ev.target.closest('.chip'); if (b) pickObj(b.dataset.k); });

// the guess bubble on the stage
const guessEl = document.createElement('div');
guessEl.className = 'guess card';
$('overlay').append(guessEl);
const tagEl = document.createElement('div');
tagEl.className = 'tag';
$('overlay').append(tagEl);
guessEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;

// --- physics (a toy model in centimetres) -------------------------------------------------------------------

function step(dt) {

  if (o.kind === 'top') return;
  let gap = gapOf();

// --- drawing ------------------------------------------------------------------------------------------------

// filings: fixed random bits on a sheet of paper, each turned along the field of the magnet's two poles
const FIL = Array.from({ length: 1500 }, () => [Math.random(), Math.random(), Math.random()]);
function field(px, py, face, my) {
  // poles as point sources in cm: N at the right end (+), S at the left end (−)
  const poles = [[face - 0.6, my, 1], [face - MAG_LEN + 0.6, my, -1]];
  let bx = 0, by = 0;
  for (const [x, y, q] of poles) {
    const dx = px - x, dy = py - y, r2 = dx * dx + dy * dy + 0.15, r3 = r2 * Math.sqrt(r2);
    bx += q * dx / r3; by += q * dy / r3;

}

function drawTop(c, w, h, time) {

  const Y = (cm) => oy + cm * s;

  rr(c, X(0.3), Y(0), (TABLE - 0.6) * s, H * s, 10); c.fillStyle = '#ebe7dc'; c.fill(); c.restore();
  const k = S.obj;

    for (const [u, v, r] of FIL) {
      const px = 0.6 + u * (TABLE - 1.2), py = 0.4 + v * (H - 0.8);
      if (py > my - 1.0 && py < my + 1.0 && px > S.face - MAG_LEN - 0.1 && px < S.face + 0.1) continue;

    by -= 0.012; // the Earth's field: "north" is up the page

    S.needle += d * Math.min(1, 0.12);

  // field threads between the circles, brighter when close
  c.strokeStyle = `rgba(168,85,247,${0.15 + 0.55 * align})`; c.lineWidth = 2; c.setLineDash([6, 8]); c.lineDashOffset = -time * 30;
  for (const dy of [-0.4, 0, 0.4]) { c.beginPath(); c.moveTo(mx + R, cy + dy * R); c.lineTo(ox - R, cy + dy * R); c.stroke(); }
  c.setLineDash([]);
  circle(ox, t.inObj(t.obj[S.obj][0]), () => {
    if (o.kind === 'none') {
      for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) {
        const x = ox - R + (i + 0.5) * (2 * R / 9) + Math.sin(time * 7 + i * 3 + j) * 1.5, y = cy - R + (j + 0.5) * (2 * R / 9) + Math.cos(time * 6 + j * 2 + i) * 1.5;
        c.fillStyle = 'rgba(152,160,184,.6)'; c.beginPath(); c.arc(x, y, R / 26, 0, 7); c.fill();
      }
      return;
    }
    const isMag = S.obj === 'magS' || S.obj === 'magN';
    const base = S.obj === 'magN' ? Math.PI : 0; // magN's north end faces us, so its domains point left
    DOM.forEach(([a0, r], n) => {
      const i = n % 7, j = Math.floor(n / 7);
      const x = ox - R + (i + 0.5) * (2 * R / 7), y = cy - R + (j + 0.5) * (2 * R / 7);
      // in the field, iron's domains turn to point the way the magnet's field runs (from its N face, into the object)
      const want = isMag ? base : 0, k = isMag ? 1 : align;
      let d = want - a0; d = Math.atan2(Math.sin(d), Math.cos(d));
      const a = a0 + d * k + Math.sin(time * 2 + r * 9) * 0.05 * (1 - k);
      arrow(c, x, y, a, R / 4.6, k > 0.8 ? 'rgba(255,255,255,.9)' : `rgba(${Math.round(lerp(152, 255, k))},${Math.round(lerp(160, 255, k))},${Math.round(lerp(184, 255, k))},.85)`);
    });
  });
}

const loop = canvasLoop($('cv'), (c, w, h, dt, time) => {
  const pad = Math.max(10, w * 0.03);
  geo.s = (w - 2 * pad) / TABLE; geo.x0 = pad; geo.ty = h * 0.62;
  step(dt);
  if (lab.view === 'inside') drawInside(c, w, h, time);
  else if (OBJ[S.obj].kind === 'top') drawTop(c, w, h, time);
  else drawTable(c, w, h, time);
  readout();
});

// drag the magnet straight on the stage too
let drag = false;
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view === 'inside') return;
  const r = $('cv').getBoundingClientRect(), cm = (ev.clientX - r.left - geo.x0) / geo.s;
  if (cm > S.face - MAG_LEN - 1 && cm < S.face + 1.5) { drag = true; $('cv').setPointerCapture(ev.pointerId); }
});
$('cv').addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const r = $('cv').getBoundingClientRect(), cm = (ev.clientX - r.left - geo.x0) / geo.s + 0.5;
  S.face = clamp(cm, FACE_MIN, FACE_MAX);
  $('slider').value = String(Math.round((S.face - FACE_MIN) / (FACE_MAX - FACE_MIN) * 1000));
});
$('cv').addEventListener('pointerup', () => { drag = false; });
void loop;
render();
</script>
</body>
</html>
