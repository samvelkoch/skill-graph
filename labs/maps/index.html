const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - ((-2 * p + 2) ** 2) / 2);

const mv = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const css = (v) => `rgb(${v.map(Math.round).join(',')})`;
const mix = (a, b, k) => css(mv(rgb(a), rgb(b), k));

const poly = (c, pts) => { c.beginPath(); pts.forEach(([X, Y], i) => (i ? c.lineTo(X, Y) : c.moveTo(X, Y))); c.closePath(); };
// Catmull-Rom spline through the points, as Bezier curves (closed loop or open line)
function smooth(c, pts, closed) {
  const n = pts.length;
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const g = (j) => (closed ? pts[(j + n) % n] : pts[clamp(j, 0, n - 1)]);
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    c.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  if (closed) c.closePath();
}
const inPoly = (p, pl) => {
  let r = false;
  for (let i = 0, j = pl.length - 1; i < pl.length; j = i++) {
    const [xi, yi] = pl[i], [xj, yj] = pl[j];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < ((xj - xi) * (p[1] - yi)) / (yj - yi) + xi) r = !r;
  }
  return r;
};
function tag(c, text, x, y, color = '#fff') {
  c.save(); c.globalAlpha = 1; c.font = FONT; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + 16;
  c.fillStyle = 'rgba(10,12,20,.86)'; c.beginPath(); c.roundRect(x - tw / 2, y - 12, tw, 24, 12); c.fill();
  c.fillStyle = color; c.fillText(text, x, y + 1); c.restore();
}

const HMAX = .2;
// the hill is a dome whose west side is steep: ring u (0 = foot, 1 = top) has this radius and centre
const hillR = (u) => HILL.R * Math.pow(1 - u, .85);
const hillX = (u) => HILL.x - HILL.R + .35 * HILL.R * u + hillR(u);

const rng = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const OBJS = (() => {
  const list = HOUSES.map(([x, y]) => ({ k: 'house', x, y })).concat([{ k: 'school', x: SCHOOL.x, y: SCHOOL.y }]);
  [[.17, .62], [.43, .46], [.42, .8]].forEach(([x, y]) => list.push({ k: 'tree', x, y, r: .021, h: .07 }));
  const trees = [];
  for (let n = 0; n < 500 && trees.length < 15; n++) {
    const p = [.6 + rng() * .25, .54 + rng() * .27];
    if (inPoly(p, FOREST) && trees.every((q) => Math.hypot(q.x - p[0], q.y - p[1]) > .04)) trees.push({ k: 'tree', x: p[0], y: p[1], r: .02 + rng() * .006, h: .06 + rng() * .02 });
  }
  return list.concat(trees).sort((p, q) => p.y - q.y);
})();
const SNAPS = HOUSES.map(([x, y]) => ({ x, y })).concat([{ x: SCHOOL.x, y: SCHOOL.y }]);

const HOUSE_C = { wallF: '#f1e6cc', wallE: '#d6c8a6', roofS: '#d1674c', roofN: '#b3513b', sym: '#c4563f' };
const SCHOOL_C = { wallF: '#e9e1f4', wallE: '#cfc3e6', roofS: '#8a63c9', roofN: '#6f4fa8', sym: '#8a63c9' };
const morph = (col, k) => ({ wallF: mix(col.wallF, col.sym, k), wallE: mix(col.wallE, col.sym, k), roofS: mix(col.roofS, col.sym, k), roofN: mix(col.roofN, col.sym, k) });

// draws the model with the camera tilted `tilt` degrees (10 = side view, 90 = straight down) into the box X, Y, W, H.
// opt.wide: scale by width only (the side-view card); opt.mirror: flip left-right. Returns the camera.
function drawVillage(c, X, Y, W, H, tilt, opt = {}) {
  const t = (tilt * Math.PI) / 180, st = Math.sin(t), ct = Math.cos(t), k = sm(clamp((tilt - 50) / 40, 0, 1));
  const B = .05, EXT = 1 + 2 * B, TH = .035, SH = .3;
  const S = opt.wide ? (W * .97) / EXT : Math.min((W * .97) / EXT, (H * .97) / (EXT * st + (HMAX + TH) * ct));
  const cx = X + W / 2, cy = Y + H / 2 + (S * (HMAX - TH) * ct) / 2;
  const P = (x, y, z = 0) => [cx + (x - .5) * S - z * S * ct * SH, cy + (y - .5) * S * st - z * S * ct];
  const ground = (z, fn) => {
    c.save(); c.translate(cx - z * S * ct * SH, cy - z * S * ct); c.scale(S, S * st); c.translate(-.5, -.5); fn(); c.restore();
  };
  c.save(); c.globalAlpha = 1; c.lineJoin = 'round'; c.lineCap = 'round';
  if (opt.mirror) { c.translate(cx, 0); c.scale(-1, 1); c.translate(-cx, 0); }
  const water = mix('#4f93d6', '#8cc4f3', k);

  // the baseboard: sea
  const b0 = -B, b1 = 1 + B;
  if (ct > .01) {
    c.fillStyle = '#5a4430'; poly(c, [P(b0, b1, 0), P(b1, b1, 0), P(b1, b1, -TH), P(b0, b1, -TH)]); c.fill();
    c.fillStyle = '#46351f'; poly(c, [P(b1, b0, 0), P(b1, b1, 0), P(b1, b1, -TH), P(b1, b0, -TH)]); c.fill();
  }
  ground(0, () => { c.fillStyle = mix('#3a78bf', '#8cc4f3', k); c.fillRect(b0, b0, EXT, EXT); });

  // island, forest patch, river, lake
  ground(0, () => {
    c.beginPath(); smooth(c, ISLAND, true);
    c.lineWidth = .016; c.strokeStyle = mix('#e6d79c', '#b9b384', k); c.stroke();
    c.fillStyle = mix('#7db55f', '#ebe6bf', k); c.fill();
    c.globalAlpha = .3 + .7 * k; c.beginPath(); smooth(c, FOREST, true); c.fillStyle = mix('#4f9a45', '#79b97a', k); c.fill(); c.globalAlpha = 1;
    if (k < .98) { c.globalAlpha = 1 - k; c.beginPath(); smooth(c, RIVER, false); c.lineWidth = .037; c.strokeStyle = '#3d6fa6'; c.stroke(); c.globalAlpha = 1; }
    c.beginPath(); smooth(c, RIVER, false); c.lineWidth = .028; c.strokeStyle = water; c.stroke();
    c.beginPath(); c.arc(LAKE.x, LAKE.y, LAKE.r, 0, Math.PI * 2);
    c.fillStyle = water; c.fill(); c.lineWidth = .008; c.strokeStyle = mix('#2f5f95', '#6aa8dc', k); c.stroke();
    c.beginPath(); smooth(c, ROAD, false); c.lineWidth = .036; c.strokeStyle = mix('#6e6759', '#ffffff', k); c.stroke();
    c.lineWidth = .026; c.strokeStyle = mix('#a49d8f', '#8a8f99', k); c.stroke();
  });
  // bridge: a slab on the river with white rails
  ground(0, () => {
    c.save(); c.translate(BRIDGE.x, BRIDGE.y); c.rotate(BRIDGE.a); c.globalAlpha = 1 - k; c.fillStyle = '#3f392f'; c.fillRect(-.047, -.03, .094, .06); c.restore();
  });
  ground(.016, () => {
    c.save(); c.translate(BRIDGE.x, BRIDGE.y); c.rotate(BRIDGE.a);
    c.fillStyle = mix('#a49d8f', '#8a8f99', k); c.fillRect(-.047, -.03, .094, .06);
    c.strokeStyle = '#fff'; c.lineWidth = .008; c.beginPath(); c.moveTo(-.047, -.03); c.lineTo(.047, -.03); c.moveTo(-.047, .03); c.lineTo(.047, .03); c.stroke();
    c.restore();
  });

  // the hill: a stack of thin discs; from above they read as contour rings
  const NL = 28, lowV = mv(rgb('#86b565'), rgb('#d8c593'), k), highV = mv(rgb('#6b9a4e'), rgb('#a4794c'), k);
  for (let i = 0; i <= NL; i++) {
    const u = i / NL, r = i === NL ? .004 : hillR(u), [HX, HY] = P(hillX(u), HILL.y, u * HILL.H);
    c.beginPath(); c.ellipse(HX, HY, r * S, r * S * st, 0, 0, Math.PI * 2);
    c.fillStyle = css(mv(lowV, highV, u)); c.fill();
    if (i % 4 === 0 && i < NL) { c.lineWidth = 1; c.strokeStyle = `rgba(100,62,28,${.12 + .6 * k})`; c.stroke(); }
  }

  // houses, school and trees, far to near
  c.lineWidth = 1; c.strokeStyle = 'rgba(35,28,22,.55)';
  const face = (pts, fill) => { poly(c, pts); c.fillStyle = fill; c.fill(); c.stroke(); };
  const prism = (x0, y0, x1, y1, h, rh, col) => {
    const ym = (y0 + y1) / 2;
    face([P(x0, y0, 0), P(x0, y1, 0), P(x0, y1, h), P(x0, y0, h)], col.wallE);
    face([P(x0, y0, 0), P(x1, y0, 0), P(x1, y0, h), P(x0, y0, h)], col.wallE);
    face([P(x0, y0, h), P(x0, y1, h), P(x0, ym, h + rh)], col.wallE);
    face([P(x0, y0, h), P(x1, y0, h), P(x1, ym, h + rh), P(x0, ym, h + rh)], col.roofN);
    face([P(x1, y0, 0), P(x1, y1, 0), P(x1, y1, h), P(x1, y0, h)], col.wallE);
    face([P(x1, y0, h), P(x1, y1, h), P(x1, ym, h + rh)], col.wallE);
    face([P(x0, y1, 0), P(x1, y1, 0), P(x1, y1, h), P(x0, y1, h)], col.wallF);
    face([P(x0, y1, h), P(x1, y1, h), P(x1, ym, h + rh), P(x0, ym, h + rh)], col.roofS);
  };
  // flat map symbol laid over the solid as the tilt reaches 90
  const symbol = (x0, y0, x1, y1, color) => {
    if (k < .4) return;
    c.globalAlpha = (k - .4) / .6; poly(c, [P(x0, y0), P(x1, y0), P(x1, y1), P(x0, y1)]); c.fillStyle = color; c.fill(); c.stroke(); c.globalAlpha = 1;
  };
  const hc = morph(HOUSE_C, k), scc = morph(SCHOOL_C, k);
  for (const o of OBJS) {
    if (o.k !== 'tree') { c.lineWidth = 1; c.strokeStyle = 'rgba(35,28,22,.55)'; }
    if (o.k === 'house') {
      prism(o.x - .026, o.y - .023, o.x + .026, o.y + .023, .045, .03, hc);
      symbol(o.x - .026, o.y - .023, o.x + .026, o.y + .023, HOUSE_C.sym);
    } else if (o.k === 'school') {
      prism(o.x - .043, o.y - .026, o.x + .043, o.y + .026, .048, .03, scc);
      prism(o.x - .047, o.y - .02, o.x - .013, o.y + .014, .1, .05, scc);
      symbol(o.x - .043, o.y - .026, o.x + .043, o.y + .026, SCHOOL_C.sym);
      symbol(o.x - .047, o.y - .02, o.x - .013, o.y + .014, SCHOOL_C.sym);
    } else {
      const [EX, EY] = P(o.x, o.y, .015), [AX, AY] = P(o.x, o.y, .015 + o.h), [GX, GY] = P(o.x, o.y, 0), rx = o.r * S, ry = o.r * S * st;
      c.beginPath(); c.moveTo(GX, GY); c.lineTo(EX, EY); c.lineWidth = Math.max(1.5, o.r * S * .5); c.strokeStyle = mix('#6b4a2b', '#2f7d44', k); c.stroke();
      c.lineWidth = 1; c.strokeStyle = 'rgba(20,50,25,.55)';
      c.beginPath(); c.ellipse(EX, EY, rx, ry, 0, 0, Math.PI * 2); c.fillStyle = mix('#2c6535', '#2f7d44', k); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(EX - rx, EY); c.lineTo(AX, AY); c.lineTo(EX + rx, EY); c.ellipse(EX, EY, rx, ry, 0, 0, Math.PI, false); c.closePath();
      c.fillStyle = mix('#4f9d4c', '#2f7d44', k); c.fill(); c.stroke();
    }
  }
  c.restore();
  return { cx, cy, S };
}

       ruler: { a: { x: HOUSES[0][0], y: HOUSES[0][1] }, b: { x: SCHOOL.x, y: SCHOOL.y } } },

const lab = shell({ key: 'maps', T, topics: TOPICS, views: ['above', 'water', 'compass'], onLang: render, onView: render });
const secret = secretLab('maps', () => ({

const askEl = Object.assign(document.createElement('div'), { className: 'ask card' });
const cardsEl = Object.assign(document.createElement('div'), { className: 'cards' });

// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const verdictHTML = (ok, text, extra) => `<div class="v ${ok ? 'ok' : 'bad'}">${esc(text)}</div>${extra ? `<p>${esc(extra)}</p>` : ''}`;
const fineHTML = (t) => `<div class="fine">${esc(t.fine)}</div>`;
const setCard = (t, key) => { const [emo, title, lead, body] = t.st[key]; lab.setState({ emo, title, lead, body, extra: fineHTML(t) }); };

// --- card pictures: the predict step of the first view ----------------------------------------------------
function paintCard(cv, kind) {
  const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2), w = Math.max(1, r.width), h = Math.max(1, r.height);
  cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0);
  if (kind === 'side') {
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#8fc0ea'); g.addColorStop(1, '#e6f2fb');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    drawVillage(c, 0, 0, w, h, 14, { wide: true });
  } else drawVillage(c, 0, 0, w, h, 90, { mirror: kind === 'mirror' });
}
const cardCanvases = [...cardsEl.querySelectorAll('canvas')];
const kinds = ['map', 'side', 'mirror'];
const ro = new ResizeObserver((es) => es.forEach((e) => paintCard(e.target, kinds[cardCanvases.indexOf(e.target)])));
cardCanvases.forEach((cv) => ro.observe(cv));

// View 1: from above
// =============================================================================================================
function drawAbove(c, w, h, dt, top) {
  const A = S.a;
  if (A.sec === 'scale') return drawScale(c, w, h, top);
  if (A.sec === 'contour') return drawContour(c, w, h, dt, top);
  if (A.anim) {
    A.p = Math.min(1, A.p + dt / 2.5); A.tilt = lerp(20, 90, ease(A.p));
    if (A.p >= 1) { A.anim = false; A.tilt = 90; }
    syncTilt();
  }
  const bottom = cardsEl.style.display === 'none' ? 0 : cardsEl.offsetHeight + 16;
  drawVillage(c, 0, top, w, h - top - bottom, A.tilt);
}
function syncTilt() {
  const A = S.a, t = T[lang];
  $('tilt').value = A.tilt;
  if (A.answer) lab.setReadout(`${Math.round(A.tilt)}°`, A.tilt <= 30 ? t.a.side : A.tilt >= 80 ? t.a.top : '', '', '#7DB59A');
}
function legendHTML(t) {
  const L = t.a.legend, sw = (cls, st) => `<i class="sw ${cls}" style="${st}"></i>`;
  const items = [['house', sw('', 'background:#c4563f')], ['school', sw('', 'background:#8a63c9')], ['forest', sw('dot', 'background:#2f7d44;border-color:#79b97a')], ['road', sw('road', '')],
    ['bridge', sw('bridge', '')], ['river', sw('river', '')], ['lake', sw('dot', 'background:#8cc4f3;border-color:#5f9fd6')], ['hill', sw('dot', 'background:#d8c593;border:2px solid #a4794c')]];
  return `<div class="legend">${items.map(([k, s]) => `<span>${s}${esc(L[k])}</span>`).join('')}</div>`;
}
function renderAbove(t) {
  const A = S.a, ans = A.answer, open = secret.unlocked();
  lab.setGlow('rgba(125, 181, 154, .28)');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${A.sec === k ? 'on' : ''}" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('scale', '📏') + sc('contour', '🏔️');
  const showCards = !A.sec && ans !== 'skip';
  cardsEl.style.display = showCards ? '' : 'none';
  cardsEl.classList.toggle('small', !!ans);
  cardsEl.querySelectorAll('.cardb').forEach((b, i) => {
    const k = b.dataset.k;
    b.querySelector('.tag').textContent = t.a.cards[i];
    b.setAttribute('aria-label', t.a.cards[i]);
    b.classList.toggle('ok', !!ans && k === 'map');
    b.classList.toggle('no', !!ans && ans === k && k !== 'map');
    b.classList.toggle('dim', !!ans && k !== 'map' && ans !== k);
  });
  $('tiltRow').hidden = !ans || !!A.sec;
  $('tiltLbl').textContent = t.a.tilt; $('tEnd1').textContent = t.a.side; $('tEnd2').textContent = t.a.top;
  $('tilt').setAttribute('aria-label', t.a.tilt);
  if (A.sec === 'scale') {
    askEl.innerHTML = scaleAsk(t);
    lab.setReadout(t.sec.bar, '', '', '#7DB59A');
    lab.setState({ emo: '📏', title: t.secrets.scale[0], lead: t.sec.scaleText, body: '', extra: fineHTML(t) });
  } else if (A.sec === 'contour') {
    askEl.innerHTML = `<p style="margin:0">${esc(t.sec.contourText)}</p>`;
    lab.setReadout(t.secrets.contour[0], '', '', '#7DB59A');
    lab.setState({ emo: '🏔️', title: t.secrets.contour[0], lead: t.sec.contourText, body: '', extra: fineHTML(t) });
  } else {
    if (!ans) { askEl.innerHTML = `<div class="q">${esc(t.a.q)}</div>`; lab.setReadout('?', '', '', '#7DB59A'); }
    else {
      const txt = ans === 'map' ? t.a.right : ans === 'side' ? t.a.sideView : ans === 'mirror' ? t.a.mirror : '';
      askEl.innerHTML = (txt ? verdictHTML(ans === 'map', txt) : '') + legendHTML(t);
      syncTilt();
    }
    setCard(t, 'above');
  }
  $('nextBtn').hidden = true;
}

// secret 1: scale and a ruler on the map
function scaleAsk(t) {
  const r = S.a.ruler, d = Math.hypot(r.b.x - r.a.x, r.b.y - r.a.y), cm = Math.round(d * 100) / 10; // the map is 10 cm wide
  return `<p style="margin:0">${esc(t.sec.scaleText)}</p>${cm > 0 ? `<div class="v ok" style="margin-top:4px">${esc(t.sec.measure(fmt(cm.toFixed(1)), Math.round(cm * 100)))}</div>` : ''}`;
}
function drawScale(c, w, h, top) {
  const A = S.a, cam = drawVillage(c, 0, top, w, h - top, 90);
  A.cam = cam;
  const pt = (p) => [cam.cx + (p.x - .5) * cam.S, cam.cy + (p.y - .5) * cam.S];
  const bw = cam.S / 10, bx = cam.cx - cam.S * .52, by = cam.cy + cam.S * .5;
  c.save(); c.globalAlpha = 1; c.lineCap = 'butt';
  c.strokeStyle = '#0a1a30'; c.lineWidth = 4; c.beginPath(); c.moveTo(bx, by); c.lineTo(bx + bw, by); c.stroke();
  c.lineWidth = 2; c.beginPath(); c.moveTo(bx, by - 6); c.lineTo(bx, by + 6); c.moveTo(bx + bw, by - 6); c.lineTo(bx + bw, by + 6); c.stroke();
  c.font = FONT; c.fillStyle = '#0a1a30'; c.textAlign = 'left'; c.textBaseline = 'bottom'; c.fillText(T[lang].sec.bar, bx + bw + 8, by + 6);
  const [x1, y1] = pt(A.ruler.a), [x2, y2] = pt(A.ruler.b);
  c.lineCap = 'round'; c.strokeStyle = 'rgba(10,12,20,.9)'; c.lineWidth = 6; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke();
  for (const [x, y] of [[x1, y1], [x2, y2]]) { c.beginPath(); c.arc(x, y, 6, 0, Math.PI * 2); c.fillStyle = '#ffd54a'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#0a0c14'; c.stroke(); }
  c.restore();
}
const worldOf = (ev) => {
  const r = $('cv').getBoundingClientRect(), cam = S.a.cam;
  return { x: (ev.clientX - r.left - cam.cx) / cam.S + .5, y: (ev.clientY - r.top - cam.cy) / cam.S + .5 };
};
function snap(p) {
  const cam = S.a.cam; let best = null, bd = 24 / cam.S;
  for (const q of SNAPS) { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; best = q; } }
  return best ? { x: best.x, y: best.y } : { x: clamp(p.x, -.05, 1.05), y: clamp(p.y, -.05, 1.05) };
}

// secret 2: slice the hill like a cake; the outlines drop onto paper as contour lines
const CN = 6, SLICE_T = 1.25;
function drawContour(c, w, h, dt, top) {
  const A = S.a, total = CN * SLICE_T + 1.7;
  A.cT += dt; if (A.cT > total + 4) A.cT = 0;

  for (let i = 1; i < 6; i++) { c.moveTo(gx + i * cs, gy); c.lineTo(gx + i * cs, gy + side); c.moveTo(gx, gy + i * cs); c.lineTo(gx + side, gy + i * cs); }
  c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const [name, [i, j, emo, col]] of Object.entries(PL)) {
    const x = gx + i * cs, y = gy + j * cs;
    c.fillStyle = col; c.beginPath(); c.roundRect(x + 3, y + 3, cs - 6, cs - 6, 9); c.fill();
    c.font = `${(cs * .4) | 0}px ${EMOJI}`; c.fillStyle = '#fff'; c.fillText(emo, x + cs / 2, y + cs * .38);
    c.font = FONT; c.fillStyle = '#10131f'; c.fillText(t.c.places[name], x + cs / 2, y + cs - 12);
  }
  // compass rose in the empty north-east square: a dial with N at the top, E right, S bottom, W left
  const rx = gx + 5.5 * cs, ry = gy + .5 * cs, rd = cs * .31, sunOn = C.phase === 'done' && C.r === 4;
  c.fillStyle = 'rgba(16,19,31,.86)'; c.beginPath(); c.arc(rx, ry, cs * .46, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.5; c.stroke();
  c.beginPath(); c.moveTo(rx, ry - rd * .55); c.lineTo(rx, ry + rd * .55); c.moveTo(rx - rd * .55, ry); c.lineTo(rx + rd * .55, ry); c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = FONT;
  for (const [d, dx, dy] of [['N', 0, -1], ['E', 1, 0], ['S', 0, 1], ['W', -1, 0]]) {
    c.fillStyle = d === 'S' && sunOn ? '#3ddc97' : d === 'N' ? '#ff7a6e' : '#fff';
    c.fillText(t.c.letters[d], rx + dx * rd, ry + dy * rd + 1);
  }
  // highlights after the answer
  const pulse = .55 + .45 * Math.sin(performance.now() / 220), ring = (i, j, color) => {
    c.strokeStyle = color; c.lineWidth = 3.5; c.globalAlpha = pulse; c.beginPath(); c.roundRect(gx + i * cs + 1, gy + j * cs + 1, cs - 2, cs - 2, 10); c.stroke(); c.globalAlpha = 1;
  };
  if (C.phase === 'done' && !C.walk) {
    if (C.r <= 1) ring(...CQ[C.r].ring, '#3ddc97');
    if (C.r === 2 || C.r === 3) ring(PL.pond[0], PL.pond[1], '#fff');
  }
  c.restore();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  // the fox, the way it faces, and its left and right hands
  const fx = gx + (C.fx + .5) * cs, fy = gy + (C.fy + .5) * cs, a = (C.ang * Math.PI) / 180;
  c.font = `${(cs * .6) | 0}px ${EMOJI}`; c.fillStyle = '#fff'; c.fillText('🦊', fx, fy + 2);
  const nose = [fx + Math.cos(a) * cs * .5, fy + Math.sin(a) * cs * .5], nl = cs * .13;
  c.fillStyle = '#fff'; c.strokeStyle = '#10131f'; c.lineWidth = 1.5;
  poly(c, [[nose[0] + Math.cos(a) * nl, nose[1] + Math.sin(a) * nl], [nose[0] + Math.cos(a + 2.4) * nl, nose[1] + Math.sin(a + 2.4) * nl], [nose[0] + Math.cos(a - 2.4) * nl, nose[1] + Math.sin(a - 2.4) * nl]]); c.fill(); c.stroke();
  if (C.phase === 'done' && (C.r === 2 || C.r === 3) && Math.abs(C.ang - C.angGoal) < 1) {
    const la = a - Math.PI / 2, ra = a + Math.PI / 2;
    tag(c, t.c.left, fx + Math.cos(la) * cs * 1.05, fy + Math.sin(la) * cs * 1.05, '#8fd0ff');
    tag(c, t.c.right, fx + Math.cos(ra) * cs * 1.05, fy + Math.sin(ra) * cs * 1.05, '#ffb86b');
  }
  if (sunOn) { c.font = `26px ${EMOJI}`; c.fillText('☀️', w / 2, gy + side + 17); }
  c.restore();
}
function renderCompass(t) {
  const C = S.c, q = CQ[C.r], ask = C.phase === 'ask';
  lab.setGlow('rgba(224, 176, 80, .26)');
  lab.setReadout(`${C.r + 1}/5`, '', '', '#e0b050');
  const label = (o) => (PL[o] ? `${PL[o][2]} ${t.c.places[o]}` : o === 'left' || o === 'right' || o === 'same' || o === 'other' ? t.c[o] : t.c.dirs[o]);
  $('cOpts').innerHTML = q.opts.map((o) => `<button class="chip ${!ask && o === q.ans ? 'good' : !ask && o === C.pick ? 'bad' : ''}" data-o="${o}"${ask ? '' : ' disabled'}>${esc(label(o))}</button>`).join('');
  if (ask) askEl.innerHTML = `<div class="q">${esc(t.c[`q${C.r + 1}`])}</div>`;
  else askEl.innerHTML = verdictHTML(C.ok, C.ok ? t.right : t.wrong, C.r === 2 ? t.c.r3 : C.r === 3 ? t.c.r4 : C.r === 4 ? t.c.r5 : '');
  $('nextBtn').hidden = ask; $('nextBtn').textContent = t.next;
  setCard(t, 'compass');
}
$('cOpts').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-o]'); if (!b || S.c.phase !== 'ask') return;
  const C = S.c, q = CQ[C.r]; C.pick = b.dataset.o; C.ok = C.pick === q.ans; C.phase = 'done';
  if (C.r === 1) C.walk = { t: 0 }; else if (C.r === 2) C.angGoal = 90; else if (C.r === 3) C.angGoal = -90;
  (C.ok ? sfx.good : sfx.bad)(); render(); showStage();
});

// --- shared: next button, render and the loop -------------------------------------------------------------------
$('nextBtn').addEventListener('click', () => {
  sfx.click();
  if (lab.view === 'water') startWater((S.w.r + 1) % WR.length);
  else startCompass((S.c.r + 1) % CQ.length);
  render();
});
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v === 'above' && S.a.sec ? 'sec' : v;
  $('secAbove').style.display = v === 'above' ? '' : 'none';
  $('secWater').style.display = v === 'water' ? '' : 'none';
  $('secCompass').style.display = v === 'compass' ? '' : 'none';
  cardsEl.style.display = v === 'above' ? cardsEl.style.display : 'none';
  if (v === 'above') renderAbove(t); else if (v === 'water') renderWater(t); else renderCompass(t);
}
canvasLoop($('cv'), (c, w, h, dt) => {
  const top = askEl.offsetHeight + 16, v = lab.view;
  if (v === 'above') drawAbove(c, w, h, dt, top); else if (v === 'water') drawWater(c, w, h, dt, top); else drawCompass(c, w, h, dt, top);
});
render();
</script>
