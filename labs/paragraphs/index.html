// --- the cutting paper (view 1 and the dialogue secret) -----------------------------------------------------
const splitParas = (n, cuts) => {
  const res = []; let st = 0;
  for (const c of [...cuts].sort((a, b) => a - b)) { res.push([st, c]); st = c + 1; }
  res.push([st, n - 1]);
  return res;
};
const cutData = (t, key) => (key === 'd' ? t.dlg : t.lake);
function cutterHTML(key, C, D) {
  const mine = C.cuts, right = D.cut, rev = C.checked && C.phase === 1, show = rev ? right : mine;
  const stat = (i) => (right.includes(i) && mine.includes(i) ? 'good' : mine.includes(i) ? 'bad' : right.includes(i) ? 'miss' : '');
  const paras = splitParas(D.s.length, show);
  const body = paras.map(([a, b], pi) => {
    const sc = a - 1;
    let cls = 'pg-p';
    if (pi > 0 && (sc === C.last || (rev && !mine.includes(sc)))) cls += ' pg-new';
    if (pi > 0 && C.checked) cls += ` pg-gm-${stat(sc)}`;
    let inner = '';
    for (let i = a; i <= b; i++) {
      inner += `<span class="pg-s">${esc(D.s[i])}</span>`;
      if (i < b) {
        if (!C.checked) inner += `<button type="button" class="pg-seam" data-act="seam" data-g="${key}" data-i="${i}" aria-label="${esc(T[lang].cut.t)}"></button> `;
        else if (rev && mine.includes(i) && !right.includes(i)) inner += '<span class="pg-x">✕</span> ';
        else inner += ' ';
      }
    }
    const tag = rev && D.tags[pi] ? `<div class="pg-tagrow"><span class="pg-tag" style="--c:${PAL[pi % PAL.length]}">${esc(D.tags[pi])}</span></div>` : '';
    const unc = !C.checked && pi > 0 ? `<button type="button" class="pg-unc" data-act="unc" data-g="${key}" data-i="${sc}" aria-label="✕"></button>` : '';
    return `<div class="${cls}">${unc}${tag}<p class="pg-t">${inner}</p></div>`;
  }).join('');
  return `<div class="pg-stack ${paras.length > 1 ? 'pg-multi' : ''}">${body}</div>`;
}
const score = (C, D) => {
  const good = C.cuts.filter((i) => D.cut.includes(i)).length;
  return { good, bad: C.cuts.length - good, total: D.cut.length, all: good === D.cut.length && good === C.cuts.length };
};

function renderCut(t, key) {
  const C = key === 'd' ? S.d : S.c, D = cutData(t, key), max = key === 'd' ? D.s.length - 1 : MAXC;
  const sc = score(C, D), rev = C.checked && C.phase === 1;
  const q = key === 'd' ? t.dlg.q : t.cut.q;
  const act = !C.checked
    ? `<button type="button" class="btn ${C.cuts.length ? '' : 'pg-off'}" data-act="check" data-g="${key}" ${C.cuts.length ? '' : 'disabled'}>${esc(t.check)}</button>`
    : rev ? `<button type="button" class="btn" data-act="again" data-g="${key}">${esc(t.again)}</button>` : '';
  $('pgRoot').innerHTML = `<div class="pg-desk"><div class="pg-q">${esc(q)}</div>${cutterHTML(key, C, D)}<div class="pg-act">${act}</div></div>`;
  $('pgExtra').innerHTML = '';
  if (!C.checked) lab.setReadout(`${C.cuts.length}/${max}`, t.cut.sub, '', '#d0a050');
  else lab.setReadout(`${sc.good}/${sc.total}`, t.cut.rsub, sc.bad ? `✕ ${sc.bad}` : '', sc.all ? '#3ddc97' : '#d0a050');
  let st;
  if (!C.checked) {
    st = key === 'd' ? { emo: '💬', title: t.dlg.t, lead: t.dlg.hint, body: '' }
      : { emo: '✂️', title: t.cut.t, lead: C.note === 'max' ? t.cut.max : t.cut.hint, body: '' };
  } else if (!rev) st = { emo: '✂️', title: t.cut.t, lead: '', body: '' };
  else if (sc.all) st = { emo: '✅', title: t.right, lead: key === 'd' ? t.dlg.okL : t.cut.okL, body: '' };
  else st = { emo: '🤔', title: t.cut.part(sc.good, sc.total), lead: t.cut.legend, body: key === 'd' ? t.dlg.body : '' };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(key === 'd' ? [] : t.facts.cut);
}
function checkCut(C) {
  if (C.checked || !C.cuts.length) return;
  C.checked = true; C.phase = 0; C.note = ''; sfx.click(); render();
  setTimeout(() => { if (C.checked && C.phase === 0) { C.phase = 1; C.last = -9; sfx.snap(); render(); showStage(); } }, 1100);
}

    const cnt = [0, 1, 2].filter((n) => P.put[g * 3 + n]).length;
    return `<button type="button" class="pg-head ${fl && !fl.ok && fl.g === g ? 'pg-bad' : ''} ${cnt === 3 ? 'pg-done' : ''}" data-act="head" data-g="${g}"><span>${esc(R.h[g])}</span><i>${cnt}/3</i></button><div class="pg-slot">${lines}</div>`;
  }).join('');
  const pool = ORDER.filter((k) => !P.put[k]).map((k, i) => `<button type="button" class="pg-card ${P.sel === k ? 'pg-sel' : ''} ${fl && !fl.ok && fl.k === k ? 'pg-shake' : ''}" style="--r:${i % 2 ? .7 : -.7}deg" data-act="card" data-k="${k}">${esc(R.g[k / 3 | 0][k % 3])}</button>`).join('');
  $('pgRoot').innerHTML = `<div class="pg-desk"><div class="pg-q">${esc(R.hint)}</div>
    <div class="pg-sheet"><h3 class="pg-rt">${esc(R.title)}</h3>${slots}</div>
    ${pool ? `<div class="pg-pool">${pool}</div>` : ''}
    <div class="pg-act"><button type="button" class="chip" data-act="rreset">${esc(t.again)}</button></div></div>`;
  $('pgExtra').innerHTML = '';
  lab.setReadout(`${placed}/9`, R.sub, P.miss ? R.miss(P.miss) : '', placed === 9 ? '#3ddc97' : '#d0a050');
  let st;
  if (placed === 9) st = { emo: '🦔', title: R.doneT, lead: R.doneL };
  else if (P.pick) st = { emo: '👆', title: R.t, lead: R.pick };
  else if (P.last && P.last.ok) st = { emo: '✅', title: t.right, lead: R.okL(R.h[P.last.g]) };
  else if (P.last) st = { emo: '🤔', title: R.noT, lead: R.noL };
  else st = { emo: '📋', title: R.t, lead: R.hint };
  lab.setState({ ...st, body: '', extra: '' });
  lab.setFacts(t.facts.report);
}

// --- view 3: the old page ----------------------------------------------------------------------------------
const f1 = (x) => x.toFixed(1);
function oldReadout(t) {
  const O = S.o, M = t.ms, el = (performance.now() - O.start) / 1000;
  if (O.phase === 'ask') lab.setReadout('?', '', '', '#c9a35a');
  else if (O.phase === 'r1') lab.setReadout(`${f1(el)} s`, M.sub1, '', '#c9a35a');
  else if (O.phase === 'r2') lab.setReadout(`${f1(el)} s`, M.sub2, '', '#c9a35a');
  else if (O.phase === 'mid') lab.setReadout(`${f1(O.t[0])} s`, M.sub1, '', '#c9a35a');
  else lab.setReadout(`${f1(O.t[0])} / ${f1(O.t[1])} s`, M.tsub, '', '#c9a35a');
}
function paperOld(t) {
  const O = S.o, M = t.ms, click = O.phase === 'r1' || O.phase === 'r2';
  let k = 0;
  const ides = M.ide.map((sents, ii) => {
    const sp = sents.map((s) => {
      const idx = k++, ch = Array.from(s);
      const txt = idx === 0 ? `<span class="pg-cap">${esc(ch[0])}</span>${esc(ch.slice(1).join(''))}` : esc(s);
      return `<span class="pg-sn ${click ? 'pg-tap' : ''} ${O.found.includes(idx) ? 'pg-found' : ''} ${O.flash === idx ? 'pg-badf' : ''}" data-act="snt" data-k="${idx}">${txt}</span>`;
    }).join(' ');
    return `<span class="pg-ide" style="--d:${ii * 80}ms">${ii > 0 ? '<b class="pg-pc">¶</b> ' : ''}${sp}</span>`;
  }).join(' ');
  return `<div class="pg-ms-wrap ${O.morph ? 'pg-mo' : ''}"><div class="pg-ms ${O.mode === 'modern' ? 'pg-new-mode' : ''}">${ides}</div></div>`;
}
function renderOld(t) {
  const O = S.o, M = t.ms;
  let head = '', act = '';
  if (O.phase === 'ask') {
    head = `<div class="pg-q">${esc(M.askQ)}</div>`;
    act = `<div class="pg-opts" style="width:100%">${M.opts.map(([k, l]) => `<button type="button" class="pg-opt" data-act="pred" data-p="${k}">${esc(l)}</button>`).join('')}</div>`;
  } else if (O.phase === 'r1' || O.phase === 'r2') {
    head = `<div class="pg-q">${esc(O.phase === 'r1' ? M.r1 : M.r2)}</div>${O.note ? `<div class="pg-sub">${esc(M.wrong)}</div>` : ''}`;
  } else if (O.phase === 'mid') {
    head = `<div class="pg-q">${esc(M.mid)}</div>`;
    act = `<button type="button" class="btn" data-act="next">${esc(M.next)}</button>`;
  } else {
    head = `<div class="pg-q">${esc(M.explore)}</div>`;
    act = `<div class="chips">${[['old', M.modeOld], ['modern', M.modeNew]].map(([m, l]) => `<button type="button" class="chip ${O.mode === m ? 'on' : ''}" data-act="mode" data-m="${m}">${esc(l)}</button>`).join('')}</div>
      <button type="button" class="chip" data-act="oreset">${esc(t.again)}</button>`;
  }
  $('pgRoot').innerHTML = `<div class="pg-desk">${head}${paperOld(t)}${act ? `<div class="pg-act">${act}</div>` : ''}</div>`;
  O.morph = false;
  $('pgExtra').innerHTML = '';
  oldReadout(t);
  let st;
  if (O.phase === 'ask') st = { emo: '📜', title: M.t, lead: M.askLead, body: '' };
  else if (O.phase === 'r1' || O.phase === 'r2') st = { emo: '🔎', title: M.find, lead: O.note ? M.wrong : '', body: '' };
  else if (O.phase === 'mid') st = { emo: '⏱️', title: `${f1(O.t[0])} s`, lead: M.mid, body: '' };
  else {
    const a = O.t[0], b = O.t[1], fast = a < b * .85 ? 'old' : b < a * .85 ? 'modern' : 'same', ok = O.pred === fast;
    st = { emo: ok ? '✅' : '🤔', title: ok ? t.right : M.notQuite, lead: `${M.v[fast]} ${M.resL(f1(a), f1(b))}`, body: M.body };
  }
  lab.setState({ ...st, extra: '' });
  lab.setFacts(t.facts.old);
}

// --- secret: the red line ---------------------------------------------------------------------------------
function renderRed(t) {
  const R = t.red, paras = splitParas(t.lake.s.length, t.lake.cut).map(([a, b]) => t.lake.s.slice(a, b + 1).join(' '));
  $('pgRoot').innerHTML = `<div class="pg-desk"><div class="pg-q">${esc(R.q)}</div><div class="pg-stack">
    <div class="pg-sheet pg-redp ${S.red.mode === 'line' ? 'pg-ml' : 'pg-mr'}" id="pgRed" style="width:${S.red.w}%">${paras.map((p) => `<p>${esc(p)}</p>`).join('')}</div></div></div>`;
  $('pgExtra').innerHTML = `<div class="row2" style="margin-top:0"><div class="chips">${[['line', R.mLine], ['letter', R.mLetter]].map(([m, l]) => `<button type="button" class="chip ${S.red.mode === m ? 'on' : ''}" data-act="rmode" data-m="${m}">${esc(l)}</button>`).join('')}</div></div>
    <input type="range" class="big pg-slide" id="pgW" min="55" max="100" value="${S.red.w}" aria-label="${esc(R.w)}">`;
  lab.setReadout(`${S.red.w}%`, R.w, '', '#c8321f');
  lab.setState({ emo: '🔴', title: R.t, lead: R.lead, body: '', extra: '' });
  lab.setFacts(t.facts.old);
}

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  const sc = (k, emo) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('pgSecs').innerHTML = sc('red', '🔴') + sc('dlg', '💬');
  if (S.sec === 'red') renderRed(t);
  else if (S.sec === 'dlg') renderCut(t, 'd');
  else if (v === 'cut') renderCut(t, 'c');
  else if (v === 'report') renderReport(t);
  else renderOld(t);
}

// --- input -------------------------------------------------------------------------------------------------
function onAct(ev) {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, t = T[lang];
  if (act === 'seam' || act === 'unc' || act === 'check' || act === 'again') {
    const key = b.dataset.g, C = key === 'd' ? S.d : S.c, D = cutData(t, key), max = key === 'd' ? D.s.length - 1 : MAXC;
    if (act === 'seam') {
      if (C.checked) return;
      const i = +b.dataset.i;
      if (C.cuts.length >= max) { C.note = 'max'; sfx.bad(); render(); return; }
      C.cuts.push(i); C.last = i; C.note = ''; sfx.snap();
    } else if (act === 'unc') {
      if (C.checked) return;
      C.cuts = C.cuts.filter((x) => x !== +b.dataset.i); C.last = -9; C.note = ''; sfx.tick();
    } else if (act === 'check') { checkCut(C); return; }
    else { if (key === 'd') S.d = mkC(); else S.c = mkC(); sfx.click(); }
  } else if (act === 'card') {
    const k = +b.dataset.k; S.rep.sel = S.rep.sel === k ? null : k; S.rep.pick = false; S.rep.flash = null; sfx.tick();
  } else if (act === 'head') {
    const P = S.rep, g = +b.dataset.g;
    if (P.sel === null) { P.pick = true; sfx.bad(); }
    else {
      const k = P.sel; P.pick = false; P.sel = null;
      if ((k / 3 | 0) === g) { P.put[k] = true; P.last = { ok: true, g }; P.flash = { ok: true, k, g }; sfx.good(); }
      else { P.miss++; P.last = { ok: false, g }; P.flash = { ok: false, k, g }; sfx.bad(); }
      const fl = P.flash; setTimeout(() => { if (P.flash === fl) P.flash = null; }, 900);
    }
  } else if (act === 'rreset') S.rep = { put: {}, sel: null, miss: 0, last: null, flash: null, pick: false };
  else if (act === 'pred') { const O = S.o; O.pred = b.dataset.p; O.phase = 'r1'; O.start = performance.now(); O.found = []; sfx.click(); }
  else if (act === 'snt') {
    const O = S.o, k = +b.dataset.k, ri = O.phase === 'r1' ? 0 : O.phase === 'r2' ? 1 : -1;
    if (ri < 0) return;
    if (k === TARGET[ri]) {
      O.t[ri] = (performance.now() - O.start) / 1000; O.found = [k]; O.note = false; O.phase = ri === 0 ? 'mid' : 'done'; sfx.good();
      if (ri === 1) { O.mode = 'modern'; showStage(); }
    } else {
      O.miss++; O.note = true; O.flash = k; sfx.bad();
      setTimeout(() => { if (O.flash === k) O.flash = -1; }, 700);
    }
  } else if (act === 'next') { const O = S.o; O.mode = 'modern'; O.morph = true; O.phase = 'r2'; O.found = []; O.note = false; O.start = performance.now(); sfx.snap(); }
  else if (act === 'mode') { if (S.o.mode === b.dataset.m) return; S.o.mode = b.dataset.m; S.o.morph = true; sfx.snap(); }
  else if (act === 'oreset') { S.o = mkO(); sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k;
    if (S.sec === 'dlg') S.d = mkC();
    sfx.click();
  } else if (act === 'rmode') { S.red.mode = b.dataset.m; sfx.tick(); }
  else return;
  render();
}
$('stage').addEventListener('click', onAct);
$('ctrlBody').addEventListener('click', onAct);
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'pgW') return;
  S.red.w = clamp(Math.round(+ev.target.value), 55, 100);
  const el = $('pgRed'); if (el) el.style.width = `${S.red.w}%`;
  lab.setReadout(`${S.red.w}%`, T[lang].red.w, '', '#c8321f');
});
setInterval(() => { if (!S.sec && lab.view === 'old' && (S.o.phase === 'r1' || S.o.phase === 'r2')) oldReadout(T[lang]); }, 100);
render();
</script>
</body>
