    S.g[k] = l;
    if (l === CANON[k] && !wasCanon) { sfx.snap(); S.gSnap = k; }
    render();
  }
});
const endDrag = () => {
  if (!S.gDrag) return;
  const k = S.gDrag; S.gDrag = null;
  const was = S.g[k];
  S.g[k] = clamp(Math.round(was), RANGE[k][0], RANGE[k][1]);
  if (S.g[k] !== was) sfx.snap();
  S.gSnap = k;
  if (onCanon(S.g)) sfx.good();
  render();
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// --- controls ------------------------------------------------------------------------------------------------------------------------
function askBlock(view, q, opts, right, rightMsg, wrongMsg) {
  const a = S.pred[view];
  const chips = opts.map((o, i) => `<button class="chip ep-opt${a !== null ? (i === right ? ' ep-good' : i === a ? ' ep-bad' : '') : ''}" data-act="pred" data-i="${i}"${a !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = a === null ? '' : `<div class="ep-verdict ${a === right ? 'ok' : 'no'}">${esc(a === right ? rightMsg : wrongMsg)}</div>`;
  $('epAsk').innerHTML = `<div class="ep-q">${esc(q)}</div><div class="ep-opts">${chips}</div>${verdict}`;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'pred') {
    const i = +b.dataset.i, right = { parts: 1, scene: 1, grid: 0 }[v];
    if (S.pred[v] !== null) return;
    S.pred[v] = i; savePred(); (i === right ? sfx.good : sfx.bad)();
    if (v === 'parts') { // scramble the pose so there is something to build: a plain person facing us
      PARTS.forEach((k, j) => { if (START[k] !== S.clr[k]) { S.clr[k] = START[k]; S.tn[k] = { from: !START[k], to: START[k], t: -(0.25 + j * 0.18) }; } });
    }
    render(); showStage();
  } else if (act === 'copy') {
    S.copy = { ...S.g }; S.copyT = 0; sfx.click(); render(); showStage();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k, name = k === 'a' ? 'horus' : 'cat';
    if (S.sec === name) { S.sec = null; sfx.click(); render(); return; }
    if (k === 'a') { if (lab.view !== 'parts') { lab.view = 'parts'; lab.renderChrome(); } S.sec = 'horus'; S.secT = 0; }
    else { if (lab.view !== 'scene') { lab.view = 'scene'; lab.renderChrome(); } S.sec = 'cat'; S.catZ = 0; }
    sfx.click(); render(); showStage();
  }
});

// --- one render per change: controls, readout and the state card ----------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('epPose').style.display = v === 'parts' ? '' : 'none';
  $('epScene').style.display = v === 'scene' ? '' : 'none';
  $('epGrid').style.display = v === 'grid' ? '' : 'none';
  const open = secret.unlocked();
  $('epSec').innerHTML = [['a', '👁️'], ['b', '🐈']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${(S.sec === 'horus' && k === 'a') || (S.sec === 'cat' && k === 'b') ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (v === 'parts') renderParts(t); else if (v === 'scene') renderScene(t); else renderGrid(t);
  if (S.sec === 'horus') lab.setState({ emo: '👁️', title: t.secrets.a[0], lead: t.horusText, body: '', extra: '' });
  else if (S.sec === 'cat') lab.setState({ emo: '🐈', title: t.secrets.b[0], lead: t.catText, body: '', extra: '' });
}
const asking = (t, q) => ({ emo: '🤔', title: q, lead: '', body: '', extra: '' });
function renderParts(t) {
  askBlock('parts', t.poseAsk, t.poseOpts, 1, t.poseRight, t.poseWrong);
  lab.setGlow('rgba(217, 168, 58, .26)');
  $('epPoseHint').textContent = S.pred.parts === null ? '' : t.tapParts;
  const n = countClear();
  if (S.pred.parts === null) {
    lab.setReadout('?', '', '', '#d9a83a'); lab.setFacts([]); lab.setState(asking(t, t.poseAsk));
    return;
  }
  const pill = n === 6 ? t.poseDone : S.last ? t.parts[S.last] : '';
  lab.setReadout(String(t.partsVal(n)), t.partsSub, pill, n === 6 ? '#d9a83a' : '#b5562e');
  lab.setFacts(t.facts.parts);
  if (n === 6) { const [emo, title, lead, body] = t.st.parts; lab.setState({ emo, title, lead, body, extra: '' }); }
  else { const l0 = t.lines[0]; lab.setState({ emo: '🧍', title: (l0[0] + l0[1]).trim(), lead: t.tapParts, body: '', extra: '' }); }
}
function renderScene(t) {
  askBlock('scene', t.sceneAsk, t.sceneOpts, 1, t.sceneRight, t.sceneWrong);
  lab.setGlow('rgba(47, 109, 179, .26)');
  const done = S.pred.scene !== null;
  $('epSceneHint').textContent = done ? t.tapThings : '';
  if (!done) { lab.setReadout('?', '', '', '#2f6db3'); lab.setFacts([]); lab.setState(asking(t, t.sceneAsk)); return; }
  const keys = Object.keys(S.tapped), c = keys.filter((k) => t.cards[k][0] === 'clue').length, r = keys.length - c;
  lab.setReadout(t.counts(c, r), '', S.lastThing ? t.things[S.lastThing] : '', '#2f6db3');
  lab.setFacts(t.facts.scene);
  if (S.lastThing) { const [kind, txt] = t.cards[S.lastThing]; lab.setState({ emo: kind === 'clue' ? '🔎' : '📏', title: kind === 'clue' ? t.clue : t.rule, lead: txt, body: '', extra: '' }); }
  else { const [emo, title, lead, body] = t.st.scene; lab.setState({ emo, title, lead, body, extra: '' }); }
}
function renderGrid(t) {
  askBlock('grid', t.gridAsk, t.gridOpts, 0, t.gridRight, t.gridWrong);
  lab.setGlow('rgba(178, 64, 43, .26)');
  const done = S.pred.grid !== null;
  $('epCopy').textContent = '⧉ ' + t.copy; $('epCopy').disabled = !done;
  $('epGridHint').textContent = done ? t.gridHint : '';
  if (!done) { lab.setReadout('?', '', '', '#b2402b'); lab.setFacts([]); lab.setState(asking(t, t.gridAsk)); $('epGrid').querySelector('.ep-copy').style.display = 'none'; return; }
  $('epGrid').querySelector('.ep-copy').style.display = '';
  const names = { kL: t.knees, eL: t.elbows, sL: t.shouldersG };
  const pill = S.gSnap && Number.isInteger(S.g[S.gSnap]) ? t.snapped(names[S.gSnap], S.g[S.gSnap]) : '';
  lab.setReadout(t.squares, '', pill, '#b2402b');
  lab.setFacts(t.facts.grid);
  const [emo, title, lead, body] = t.st.grid; lab.setState({ emo, title, lead, body, extra: '' });
}
render();
</script>
