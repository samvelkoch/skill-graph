  if (S.play) {
    const u = time - S.play.t0, pu = sm(u / S.play.intro), qu = sm((u - S.play.intro) / S.play.dur);
    S.tp = u < S.play.intro ? pu : 1 + 3 * qu;
    $('asT').value = String(Math.round(S.tp));
    if (u >= S.play.intro + S.play.dur) { S.play = null; S.tTo = 4; S.tp = 4; $('asT').disabled = false; render(); }
  } else {
    const d = S.tTo - S.tp; S.tp = Math.abs(d) < .002 ? S.tTo : S.tp + d * (1 - Math.exp(-dt * 6));
  }
  for (const cd of S.cards) {
    if (S.drag?.card === cd) continue;
    for (const [p, tg, v] of [['x', 'tx', 'vx'], ['y', 'ty', 'vy'], ['sc', 'tsc', 'vs']]) { const a = (cd[tg] - cd[p]) * 190 - cd[v] * 19; cd[v] += a * dt; cd[p] += cd[v] * dt; }
  }
}
function impactReadout() {
  const t = T[lang], a = S.pred.impact; let key, val, sub, pill;
  if (a === null) { val = t.times[0]; sub = ''; pill = ''; }
  else { const p = S.tp; val = t.times[clamp(Math.round(p), 0, 5)]; sub = t.sunPct(Math.round(curve(SUN, p))); pill = t.chainPill; }
  key = `${lang}|${val}|${sub}|${pill}`;
  if (key === S.roKey) return; S.roKey = key;
  lab.setReadout(val, sub, pill, '#ffd166');
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  step(dt, time);
  if (S.sec === 'a') return drawSecA(c, w, h, time);
  if (S.sec === 'b') return drawSecB(c, w, h, time);
  if (lab.view === 'impact') { drawImpact(c, w, h, time); impactReadout(); }
  else if (lab.view === 'rocks') drawRocks(c, w, h, time);
  else drawSurv(c, w, h, time);
});

// --- input -------------------------------------------------------------------------------------------------
const cv = $('cv');
const toD = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - S.g.ox) / S.g.sc, (ev.clientY - r.top - S.g.oy) / S.g.sc]; };
const basketAt = (x, y) => { for (const k of ['A', 'D']) { const b = BASK[k]; if (x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 8 && y <= b.y + b.h + 8) return k; } return null; };
function sampleAt(x, y) {
  if (x < 40) return;
  const top = CY - 8, bot = BANDS[6].y + BANDS[6].h + 6; if (y < top || y > bot) return;
  const cb = BANDS[CLAY]; let i;
  if (Math.abs(y - (cb.y + cb.h / 2)) <= 12) i = CLAY; else { i = BANDS.findIndex((b) => y >= b.y && y < b.y + b.h); if (i < 0) i = y < CY ? 0 : 6; }
  S.samp[i] = { t0: now(), x: clamp(x, CX + 14, CX + CW_ - 14) }; S.sel = i; sfx.click(); render();
}
function toHome(cd) { cd.tx = slotXY(cd.slot)[0]; cd.ty = slotXY(cd.slot)[1]; cd.tsc = 1; }
function attempt(cd, key) {
  const ok = (key === 'A') === SURV.has(cd.id);
  S.selCard = null;
  if (ok) {
    const n = S.cards.filter((q) => q.zone === key).length; cd.zone = key; cd.n = n; [cd.tx, cd.ty] = cellXY(key, n); cd.tsc = MINI;
    S.last = { id: cd.id, key }; S.hint = null; sfx.good();
  } else { S.hint = { x: cd.x, y: cd.y, t: now() }; toHome(cd); sfx.bad(); }
  S.hover = null; render();
}
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const [x, y] = toD(ev), v = lab.view;
  if (v === 'rocks') return sampleAt(x, y);
  if (v !== 'survivors' || S.pred.survivors === null) return;
  const cards = S.cards.filter((cd) => cd.zone === 'tray');
  for (let i = cards.length - 1; i >= 0; i--) {
    const cd = cards[i];
    if (Math.abs(x - cd.x) <= CWD / 2 && Math.abs(y - cd.y) <= CHT / 2) {
      S.drag = { card: cd, ox: cd.x - x, oy: cd.y - y, sx: ev.clientX, sy: ev.clientY, moved: false };
      try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
      return;
    }
  }
  const bk = basketAt(x, y), sel = S.cards.find((cd) => cd.id === S.selCard);
  if (bk && sel) attempt(sel, bk);
});
cv.addEventListener('pointermove', (ev) => {
  const d = S.drag; if (!d) return;
  if (!d.moved && Math.hypot(ev.clientX - d.sx, ev.clientY - d.sy) > 6) { d.moved = true; sfx.tick(); }
  if (!d.moved) return;
  const [x, y] = toD(ev), cd = d.card; cd.x = x + d.ox; cd.y = y + d.oy; cd.tx = cd.x; cd.ty = cd.y; cd.vx = cd.vy = 0; cd.tsc = 1.1; cd.sc += (1.1 - cd.sc) * .35;
  S.hover = basketAt(x, y);
});
function endDrag(ev, cancel) {
  const d = S.drag; if (!d) return; S.drag = null;
  const cd = d.card, [x, y] = toD(ev);
  if (d.moved && !cancel) { const bk = basketAt(x, y); if (bk) attempt(cd, bk); else { toHome(cd); S.hover = null; render(); } }
  else if (d.moved) { toHome(cd); S.hover = null; }
  else { S.selCard = S.selCard === cd.id ? null : cd.id; toHome(cd); sfx.click(); render(); }
}
cv.addEventListener('pointerup', (ev) => endDrag(ev, false));
cv.addEventListener('pointercancel', (ev) => endDrag(ev, true));

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const KEY = { impact: ['impactAsk', 'impactOpts', 'impactRight', 'impactWrong', 0], rocks: ['rocksAsk', 'rocksOpts', 'rocksRight', 'rocksWrong', 1], survivors: ['survAsk', 'survOpts', 'survRight', 'survWrong', 2] };
function askHTML(v, t) {
  const [q, o, r, wr, right] = KEY[v], a = S.pred[v];
  return `<div class="as-q">${esc(t[q])}</div><div class="as-opts">${t[o].map((s, i) =>
    `<button class="as-opt${a !== null ? (i === right ? ' ok' : i === a ? ' bad' : '') : ''}" data-pick="${i}" data-v="${v}"${a !== null ? ' disabled' : ''}>${esc(s)}</button>`).join('')}</div>${
    a !== null ? `<div class="as-verdict ${a === right ? 'ok' : 'no'}">${esc(a === right ? t[r] : t[wr])}</div>` : ''}`;
}
function pick(v, i) {
  if (S.pred[v] !== null) return;
  S.pred[v] = i; (i === KEY[v][4] ? sfx.good : sfx.bad)();
  if (v === 'impact') { S.tp = 0; S.tTo = 1; S.play = { t0: now(), intro: 1.6, dur: 6 }; S.roKey = ''; $('asT').disabled = true; showStage(); }
  else if (v === 'rocks') { S.barsT0 = now(); S.samp[CLAY] = { t0: now(), x: CX + CW_ / 2 }; S.sel = CLAY; showStage(); }
  render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-pick], [data-act], [data-stop]'); if (!b) return;
  if (b.dataset.pick !== undefined) return pick(b.dataset.v, +b.dataset.pick);
  if (b.dataset.stop !== undefined) {
    if (S.pred.impact === null || S.play) return;
    S.tTo = +b.dataset.stop; $('asT').value = String(S.tTo); sfx.tick(); render(); return;
  }
  if (b.dataset.act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; if (S.sec) S.secT0 = now(); sfx.click(); render();
  }
});
$('asT').addEventListener('input', (ev) => {
  if (S.pred.impact === null || S.play) return;
  S.tTo = +ev.target.value; sfx.tick(); render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = S.sec ? 'sec' : v;
  $('asImp').style.display = v === 'impact' ? 'block' : 'none';
  $('asRocks').style.display = v === 'rocks' ? 'block' : 'none';
  $('asSurv').style.display = v === 'survivors' ? 'block' : 'none';
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('asSecChips').innerHTML = sc('a', '🏔️') + sc('b', '🕳️');
  if (v === 'impact') $('askImp').innerHTML = askHTML('impact', t);
  if (v === 'rocks') $('askRocks').innerHTML = askHTML('rocks', t);
  if (v === 'survivors') $('askSurv').innerHTML = askHTML('survivors', t);
  if (v === 'impact') {
    const ticks = $('asTicks'), un = S.pred.impact === null || !!S.play, cur = Math.round(S.tTo);
    ticks.innerHTML = t.times.map((s, i) => `<button class="as-tick${i === cur ? ' on' : ''}" data-stop="${i}" style="left: calc(13px + (100% - 26px) * ${i / 5})"${un ? ' disabled' : ''}>${esc(s)}</button>`).join('');
    $('asT').disabled = un; $('asT').setAttribute('aria-label', t.times.join(', '));
    if (!S.play) $('asT').value = String(cur);
  }
  if (S.sec) { // a secret shows its own picture; the view keeps its controls
    lab.setFacts([]);
    if (S.sec === 'a') { lab.setGlow('rgba(255,138,48,.26)'); lab.setReadout(t.km(10), `${t.sz.ever} ${t.km(8.8)}`, '', '#ff8a30'); lab.setState({ emo: '🏔️', title: t.secrets.a[0], lead: t.sizeText, body: '', extra: '' }); }
    else { lab.setGlow('rgba(80,180,230,.26)'); lab.setReadout(t.km(180), t.sz.chix, t.stylised, '#4eb0e0'); lab.setState({ emo: '🕳️', title: t.secrets.b[0], lead: t.craterText, body: '', extra: '' }); }
    return;
  }
  if (v === 'impact') renderImpact(t); else if (v === 'rocks') renderRocks(t); else renderSurv(t);
}
function renderImpact(t) {
  lab.setGlow('rgba(217, 130, 95, .26)'); S.roKey = '';
  const a = S.pred.impact;
  if (a === null) { lab.setReadout(t.times[0], '', '', '#ffd166'); lab.setFacts([]); lab.setState({ emo: '🤔', title: t.impactAsk, lead: '', body: '', extra: '' }); return; }
  impactReadout();
  const s = t.st.impact; lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' }); lab.setFacts(t.facts.impact);
}
function renderRocks(t) {
  lab.setGlow('rgba(224, 176, 80, .24)');
  const a = S.pred.rocks, i = S.sel;
  if (a === null) {
    lab.setReadout('?', t.tapLayer, i !== null && i !== CLAY ? t.layerAge(BANDS[i].age) : '', '#e0b050');
    lab.setFacts([]); lab.setState({ emo: '🪨', title: t.st.rocks[1], lead: t.tapLayer, body: '', extra: '' }); return;
  }
  const hi = i === CLAY;
  lab.setReadout(`<span style="font-size:22px">${esc(hi ? t.iHigh : t.iLow)}</span>`, '', t.layerAge(BANDS[i ?? CLAY].age), hi ? '#ffd166' : '#e0b050');
  const s = t.st.rocks; lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' }); lab.setFacts(t.facts.rocks);
}
function renderSurv(t) {
  lab.setGlow('rgba(95, 168, 100, .24)');
  const a = S.pred.survivors, k = S.cards.filter((cd) => cd.zone !== 'tray').length;
  lab.setReadout(`<span style="font-size:22px">${esc(t.sorted(k))}</span>`, '', a !== null ? t.bigPill : '', '#6fbf5a');
  if (a === null) { lab.setFacts([]); lab.setState({ emo: '🤔', title: t.survAsk, lead: '', body: '', extra: '' }); return; }
  const s = t.st.survivors, L = S.last;
  let lead = s[2];
  if (L) lead = `${t.animals[L.id]}: ${L.key === 'A' ? WHY[L.id].map((q) => t.why[q]).join(' · ') : t.died}`;
  lab.setState({ emo: s[0], title: s[1], lead, body: s[3], extra: '' }); lab.setFacts(t.facts.survivors);
}
render();
</script>
