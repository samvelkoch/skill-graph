  roKey = '';
  const open = secret.unlocked();
  $('secChips').innerHTML = [['gates', '🐟'], ['beaver', '🦫']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  let state, facts = [];
  if (sec === 'gates') {
    state = { emo: '🐟', title: t.secrets.gates[0], lead: t.secretA, body: '' };
  } else if (sec === 'beaver') {
    $('ncSec').style.display = ''; $('bRel').textContent = t.release;
    state = { emo: '🦫', title: t.secrets.beaver[0], lead: t.secretB, body: '' };
  } else if (v === 'links') {
    $('ncLinks').style.display = '';
    const parts = t.parts;
    $('lList').innerHTML = S.sel
      ? EDGES.filter(([a]) => a === S.sel).map(([a, b]) => `<div class="nc-ln" style="--nc:${COL[a]}"><b>${esc(parts[a])} → ${esc(parts[b])}</b> ${esc(t.linkText[`${a}_${b}`])}</div>`).join('')
      : `<div class="nc-hint">${esc(t.tapPart)}</div>`;
    $('lQ').textContent = t.linksQ;
    $('lChips').innerHTML = PICK_ORDER.map((k) => {
      const picked = S.picks.includes(k), good = RIGHT.includes(k);
      const cls = S.checked ? (good ? 'nc-ok' : picked ? 'nc-no' : '') : picked ? 'on' : '';
      return `<button class="chip ${cls}" data-act="pick" data-k="${k}">${esc(parts[k])}</button>`;
    }).join('');
    $('lCheck').textContent = t.check; $('lCheck').disabled = S.checked || !S.picks.length; $('lCheck').style.display = S.checked ? 'none' : '';
    $('lAgain').textContent = t.again; $('lAgain').style.display = S.checked ? '' : 'none';
    if (S.checked) {
      const n = S.picks.filter((k) => RIGHT.includes(k)).length, ok = S.picks.length === RIGHT.length && n === RIGHT.length;
      $('lV').innerHTML = verdict(ok, ok ? ` ${t.slowNote}` : ` ${t.caught(n)} ${t.slowNote}`);
    } else $('lV').innerHTML = '';
    state = S.checked ? { emo: '🌍', title: st.linksDone[0], lead: st.linksDone[1], body: '' } : { emo: '🧶', title: st.links0[0], lead: st.links0[1], body: '' };
    facts = t.facts.links;
  } else if (v === 'marsh') {
    $('ncMarsh').style.display = '';
    $('mQ').textContent = t.marshQ;
    $('mOpts').innerHTML = optsHtml(t.marshOpts, S.mGuess, 1, S.mRev, 'mopt');
    $('mDig').textContent = t.dig; $('mDig').style.display = S.mGuess !== null && !S.mDug ? '' : 'none';
    $('mRew').textContent = t.rewet; $('mRew').style.display = S.mDug && S.mYear >= 30 && !S.mRewet ? '' : 'none';
    $('mSl').style.display = S.mDug ? '' : 'none';
    if (Math.abs(+$('mS').value - S.mYear) > 0.01) $('mS').value = S.mYear;
    $('mS').disabled = S.mRewet;
    $('mV').innerHTML = S.mRev ? verdict(S.mGuess === 1) : '';
    state = !S.mRev ? { emo: '🌾', title: st.marsh0[0], lead: st.marsh0[1], body: '' }
      : { emo: S.mRewet ? '💧' : '🔥', title: st.marshDone[0], lead: st.marshDone[1], body: S.mRewet ? t.exRewet : t.exMarsh };
    facts = S.mRev ? t.facts.marsh : [];
  } else {
    $('ncDam').style.display = '';
    $('dQ').textContent = t.damQ;
    $('dOpts').innerHTML = optsHtml(t.damOpts, S.dGuess, 1, S.dRev, 'dopt');
    $('dBuild').textContent = t.build; $('dBuild').style.display = S.dGuess !== null && !S.dBuilt ? '' : 'none';
    $('dSl').style.display = S.dBuilt ? '' : 'none';
    if (Math.abs(+$('dS').value - S.dYear) > 0.01) $('dS').value = S.dYear;
    $('dV').innerHTML = S.dRev ? verdict(S.dGuess === 1) : '';
    $('fBox').style.display = S.fishAtWall ? '' : 'none';
    $('fQ').textContent = S.fishAtWall ? t.fishQ : '';
    $('fOpts').innerHTML = S.fishAtWall ? optsHtml(t.fishOpts, S.fishAns, 1, S.fishAns !== null, 'fopt') : '';
    $('fV').innerHTML = S.fishAns !== null ? verdict(S.fishAns === 1) : '';
    $('fV').style.display = S.fishAtWall ? '' : 'none';
    state = !S.dRev ? { emo: '🏞️', title: st.dam0[0], lead: st.dam0[1], body: '' }
      : { emo: '🌊', title: st.damDone[0], lead: st.damDone[1], body: S.fishAns !== null ? `${t.exDam} ${t.exFish}` : t.exDam };
    facts = S.dRev ? t.facts.dam : [];
  }
  lab.setState({ ...state, extra: `<div class="fine">${esc(t.fine)}</div>` });
  lab.setFacts(facts);
  updateRO();
}
render();
</script>
</body>
</html>
