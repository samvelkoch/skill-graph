  g.addColorStop(0, '#FFF2A8'); g.addColorStop(0.35, '#FFB02E'); g.addColorStop(0.7, '#F2541B'); g.addColorStop(1, '#6e1a0e'); c.fillStyle = g; c.fill(); c.lineWidth = 2; c.strokeStyle = '#4a1209'; c.stroke();
  c.save(); c.clip(); c.strokeStyle = 'rgba(60,15,8,.55)'; c.lineWidth = 2; c.lineCap = 'round';
  for (let i = 0; i < 6; i++) { const an = i * 1.05 + 0.3, r1 = R0 * 0.55, r2 = R0 * 1.05; c.beginPath(); c.moveTo(cx + Math.cos(an) * r1, cy + Math.sin(an) * r1 * 0.85); c.lineTo(cx + Math.cos(an + 0.15) * (r1 + r2) / 2, cy + Math.sin(an + 0.15) * (r1 + r2) / 2 * 0.85); c.lineTo(cx + Math.cos(an) * r2, cy + Math.sin(an) * r2 * 0.85); c.stroke(); }
  for (let i = 0; i < 6; i++) { const ph = (t * 0.35 + i / 6) % 1, bx = cx + (rnd(i + 20) - 0.5) * R0 * 1.2, by = cy + R0 * 0.5 - ph * R0 * 1.1, r = Math.max(0, R0 * 0.07 * (0.5 + rnd(i + 40))); c.fillStyle = 'rgba(255,240,170,.8)'; c.beginPath(); c.arc(bx, by, r, 0, TAU); c.fill(); }
  c.restore();
  c.restore();
}
function drawStage(c, obj, j, cx, cy, sz, a, t) {
  const code = REW[obj].st[j];
  c.save(); c.globalAlpha = a; shadowEllipse(c, cx, cy + sz * 0.36, sz * 0.34, sz * 0.05, 0.4); c.restore();
  if (code === 'pulp') pulp(c, cx, cy, sz, a, t);
  else if (code === 'magma') magma(c, cx, cy, sz, a, t);
  else {
    if (code === '🌋') { const g = c.createRadialGradient(cx, cy, sz * 0.05, cx, cy, sz * 0.55); g.addColorStop(0, 'rgba(255,130,40,.5)'); g.addColorStop(1, 'rgba(255,130,40,0)'); c.save(); c.globalAlpha = a; c.fillStyle = g; c.fillRect(cx - sz, cy - sz, 2 * sz, 2 * sz); c.restore(); }
    emoji(c, code, cx, cy + Math.sin(t * 1.5) * sz * 0.01, sz * 0.78, 0, a);
  }
}
function drawRewind(c, w, h, dt, time) {
  const o = REW[S.obj], n = o.st.length, kT = (1 - S.pos / 1000) * (n - 1);
  S.kS += (kT - S.kS) * Math.min(1, dt * 12);
  const fx = 12, fy = 12, fw = w - 24, fh = h - 24, cx = w / 2, cy = fy + fh * 0.44, sz = Math.min(fw, fh) * 0.66;
  c.save(); c.beginPath(); c.roundRect(fx, fy, fw, fh, 18); c.clip();
  c.fillStyle = vgrad(c, fy, fy + fh, '#252F5C', '#19203F'); c.fillRect(fx, fy, fw, fh);
  const gl = c.createRadialGradient(cx, cy, sz * 0.1, cx, cy, sz * 0.8); gl.addColorStop(0, 'rgba(160,175,225,.2)'); gl.addColorStop(1, 'rgba(160,175,225,0)'); c.fillStyle = gl; c.fillRect(fx, fy, fw, fh);
  const order = o.st.map((_, j) => j).sort((p, q) => Math.abs(S.kS - q) - Math.abs(S.kS - p));
  for (const j of order) { const wj = Math.max(0, 1 - Math.abs(S.kS - j)); if (wj > 0.01) drawStage(c, S.obj, j, cx, cy, sz * (0.86 + 0.14 * wj), wj, time); }
  c.fillStyle = 'rgba(8,10,24,.55)'; c.fillRect(fx, fy, fw, 18); c.fillRect(fx, fy + fh - 18, fw, 18); // film sprockets, moving as you scrub
  c.fillStyle = 'rgba(255,255,255,.14)'; const off = (S.kS * 70) % 22;
  for (let x = fx + 6 - off; x < fx + fw; x += 22) { c.beginPath(); c.roundRect(x, fy + 5, 10, 8, 2); c.fill(); c.beginPath(); c.roundRect(x, fy + fh - 13, 10, 8, 2); c.fill(); }
  const idx = clamp(Math.round(S.kS), 0, n - 1);
  pill(c, T[lang].r.stages[S.obj][idx], cx, fy + fh - 52, { w, size: 16, stroke: 'rgba(255,255,255,.25)' });
  for (let j = 0; j < n; j++) { // dots: oldest on the left, today on the right
    const x = cx + ((n - 1 - j) - (n - 1) / 2) * 18, on = j === idx;
    c.beginPath(); c.arc(x, fy + fh - 30, on ? 5 : 3.5, 0, TAU); c.fillStyle = on ? '#fff' : 'rgba(255,255,255,.35)'; c.fill();
  }
  c.restore();
  c.lineWidth = 2; c.strokeStyle = 'rgba(130,145,190,.4)'; c.beginPath(); c.roundRect(fx, fy, fw, fh, 18); c.stroke();
  if (S.rAns[S.obj] !== undefined) { // the stamp always shows the right box
    const age = time - (S.stampT[S.obj] ?? 0), col = CAT[o.ans], full = T[lang].boxes[o.ans], sp = full.indexOf(' '), emo = full.slice(0, sp), txt = full.slice(sp + 1);
    const sw = Math.min(150, fw * 0.4);
    c.font = '800 13px Nunito, sans-serif';
    const lines = wrap(c, txt, sw - 18), sh = 26 + lines.length * 16 + 12, p = easeOut(age / 0.25), sc = mix(2.2, 1, p);
    c.save(); c.translate(fx + fw - sw / 2 - 14, fy + 34 + sh / 2); c.rotate(-0.12); c.scale(sc, sc); c.globalAlpha = clamp01(age / 0.1);
    c.beginPath(); c.roundRect(-sw / 2, -sh / 2, sw, sh, 10); c.fillStyle = 'rgba(14,17,34,.82)'; c.fill(); c.lineWidth = 3; c.strokeStyle = col; c.stroke();
    c.beginPath(); c.roundRect(-sw / 2 + 4, -sh / 2 + 4, sw - 8, sh - 8, 7); c.lineWidth = 1; c.stroke();
    c.restore();
    c.save(); c.translate(fx + fw - sw / 2 - 14, fy + 34 + sh / 2); c.rotate(-0.12); c.scale(sc, sc); c.globalAlpha = clamp01(age / 0.1);
    emoji(c, emo, 0, -sh / 2 + 20, 22);
    c.fillStyle = col; c.font = '800 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    lines.forEach((ln, i) => c.fillText(ln, 0, -sh / 2 + 40 + i * 16)); c.restore();
  }
}

// --- taps and controls ------------------------------------------------------------------------------
const showStage = () => { // on a phone the controls sit below the canvas: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const boxAt = (ev) => {
  const g = G.sort; if (!g) return -1;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (y < g.top - 12) return -1;
  for (let b = 0; b < 3; b++) if (x >= g.bx[b] - g.fl && x <= g.bx[b] + g.bw + g.fl) return b;
  return -1;
};
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'sort' || S.sec) return;
  const b = boxAt(ev); if (b >= 0) answerSort(b);
});
$('cv').addEventListener('pointermove', (ev) => {
  if (ev.pointerType !== 'mouse' || lab.view !== 'sort') return;
  const b = S.sec || S.anim ? -1 : boxAt(ev);
  S.hov = b; $('cv').style.cursor = b >= 0 ? 'pointer' : '';
});
$('cv').addEventListener('pointerleave', () => { S.hov = -1; });

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.b !== undefined) return answerSort(+b.dataset.b);
  if (b.dataset.sec) {
    const k = b.dataset.sec;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.secText = false; S.planted = false; S.zoom = 0; S.zoomS = 1; S.cam = { x: 0, y: 0 }; S.secT0 = now(); sfx.click();
    return render();
  }
  if (b.dataset.act === 'plant') { S.planted = true; S.plantT0 = now(); S.secText = true; sfx.good(); return render(); }
  if (b.dataset.act === 'zoom') { S.zoom = (S.zoom + 1) % ZOOM.length; S.secText = true; sfx.click(); return render(); }
  if (b.dataset.obj) { S.obj = b.dataset.obj; S.pos = 1000; $('rs').value = 1000; sfx.click(); return render(); }
  if (b.dataset.ra !== undefined) {
    if (S.rAns[S.obj] !== undefined) return;
    const a = +b.dataset.ra; S.rAns[S.obj] = a; S.stampT[S.obj] = now(); (a === REW[S.obj].ans ? sfx.good : sfx.bad)();
    showStage(); return render();
  }
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.a !== undefined) return answerTest(+b.dataset.a);
  if (b.dataset.go === 'nextSort') return nextSort();
  if (b.dataset.go === 'again') return restartSort();
  if (b.dataset.go === 'nextTest') return nextTest();
});
$('rs').addEventListener('input', () => {
  const o = REW[S.obj], n = o.st.length, old = Math.round((1 - S.pos / 1000) * (n - 1));
  S.pos = +$('rs').value;
  if (S.pos <= 15 && !S.back[S.obj]) { S.back[S.obj] = true; sfx.snap(); }
  if (Math.round((1 - S.pos / 1000) * (n - 1)) !== old) sfx.tick();
  render();
});

// --- canvas -----------------------------------------------------------------------------------------
const cvLoop = canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  c.save();
  try {
    const shown = askEl.style.display !== 'none';
    const tgt = shown ? 8 + askEl.offsetHeight : 0;
    S.topH += (tgt - S.topH) * Math.min(1, dt * 10); if (Math.abs(tgt - S.topH) < 0.5) S.topH = tgt;
    if (v === 'sort') {
      if (S.sec === 'oldseed') drawOldSeed(c, w, h, dt, time);
      else if (S.sec === 'tiny') drawTiny(c, w, h, dt, time);
      else drawSort(c, w, h, dt, time);
    } else if (v === 'test') drawTest(c, w, h, dt, time);
    else drawRewind(c, w, h, dt, time);
  } catch (e) {
    if (!S.err) { S.err = true; console.error(e); }
  } finally { c.restore(); }
});

// --- one render per change: controls, overlay card, readout and the state card ----------------------
function setSt(arr, extra = '') { lab.setState({ emo: arr[0], title: arr[1], lead: arr[2], body: arr[3], extra }); }
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secSort').style.display = v === 'sort' ? '' : 'none';
  $('secTest').style.display = 'none';
  $('secRew').style.display = v === 'rewind' ? '' : 'none';
  askEl.style.display = v === 'rewind' ? 'none' : '';
  if (v === 'sort') renderSort(t); else if (v === 'test') renderTest(t); else renderRewind(t);
}
function renderSort(t) {
  const done = S.i >= ITEMS.length, A = S.anim, landed = S.placed.reduce((n, p) => n + p.length, 0), k = S.right.filter(Boolean).length, open = secret.unlocked();
  lab.setGlow('rgba(91, 211, 138, .22)');
  $('boxBtns').style.display = S.sec ? 'none' : '';
  $('boxBtns').innerHTML = [0, 1, 2].map((i) => `<button class="bx" style="--c:${CAT[i]}" data-b="${i}"${A || done ? ' disabled' : ''}>${esc(t.boxes[i])}</button>`).join('');
  const sc = (key, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-sec="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('oldseed', '🌴') + sc('tiny', '🔍');
  $('secAct').style.display = S.sec ? '' : 'none';
  if (S.sec) {
    const act = S.sec === 'oldseed' ? ['plant', t.sec.plant, S.planted] : ['zoom', t.sec.zoom, false];
    $('secAct').innerHTML = `<button class="act" data-act="${act[0]}"${act[2] ? ' disabled' : ''}>${esc(act[1])}</button>`;
    const key = S.sec, text = S.secText ? t.sec[key === 'oldseed' ? 'oldseedText' : 'tinyText'] : t.secrets[key][1];
    askEl.innerHTML = `<div class="verdict">${key === 'oldseed' ? '🌴' : '🔍'} ${esc(t.secrets[key][0])}</div><p>${esc(text)}</p>`;
    lab.setReadout(key === 'oldseed' ? '🌴' : '🔍', '', '', '#F2B04A');
    lab.setState({ emo: key === 'oldseed' ? '🌴' : '🔍', title: t.secrets[key][0], lead: text, body: '', extra: key === 'oldseed' ? `<div class="fine">${esc(t.fine)}</div>` : '' });
    return;
  }
  if (done) {
    askEl.innerHTML = `<div class="verdict" style="color:var(--ok)">🌟 ${k}/${ITEMS.length}</div><p>${esc(t.s.recap)}</p><div class="opts"><button class="go" data-go="again">${esc(t.again)}</button></div>`;
  } else if (A && A.done) {
    const right = A.guess === A.ans;
    askEl.innerHTML = `<div class="verdict" style="color:${right ? 'var(--ok)' : 'var(--wip)'}">${esc(right ? t.right : t.wrong)}</div><p>${esc(t.s.why[S.i])}</p><div class="opts"><button class="go" data-go="nextSort">${esc(t.next)}</button></div>`;
  } else askEl.innerHTML = `<div class="q">${esc(t.s.q(t.s.names[S.i]))}</div>`;
  lab.setReadout(`${landed}/${ITEMS.length}`, '', k ? `✓ ${k}` : '', '#5BD38A');
  setSt(t.st.sort[done ? 1 : 0]);
}
function renderTest(t) {
  const q = S.q, o = t.t[`o${q + 1}`];
  lab.setGlow('rgba(143, 163, 199, .24)');
  if (S.tAns === null) askEl.innerHTML = `<div class="q">${esc(t.t[`q${q + 1}`])}</div><div class="opts">${o.map((l, i) => `<button data-a="${i}">${esc(l)}</button>`).join('')}</div>`;
  else if (!S.tDone) askEl.innerHTML = `<div class="q">${esc(t.t[`q${q + 1}`])}</div>`;
  else {
    const right = S.tAns === RIGHT[q];
    askEl.innerHTML = `<div class="verdict" style="color:${right ? 'var(--ok)' : 'var(--wip)'}">${esc(right ? t.right : t.wrong)}</div><p>${esc(t.t[`r${q + 1}`])}</p><div class="opts"><button class="go" data-go="nextTest">${esc(q >= 2 ? t.again : t.next)}</button></div>`;
  }
  lab.setReadout(`${q + 1}/3`, '', S.tDone ? (S.tAns === RIGHT[q] ? '✓' : '✗') : '', '#8FA3C7');
  setSt(t.st.test[S.tFull ? 1 : 0]);
}
function renderRewind(t) {
  const obj = S.obj, o = REW[obj], n = o.st.length, steps = Math.round((1 - S.pos / 1000) * (n - 1)), ans = S.rAns[obj];
  lab.setGlow('rgba(242, 176, 74, .2)');
  $('objChips').innerHTML = Object.keys(REW).map((k) => `<button class="chip ${k === obj ? 'on' : ''}" data-obj="${k}">${REW[k].e} ${esc(t.r.objs[k])}</button>`).join('');
  $('dragLbl').textContent = t.r.drag; $('rs').setAttribute('aria-label', t.r.drag);
  $('rEnds').innerHTML = `<span>${esc(t.r.past)}</span><span>${esc(t.r.today)}</span>`;
  if (+$('rs').value !== S.pos) $('rs').value = S.pos;
  if (!S.back[obj]) $('rQ').innerHTML = '';
  else {
    const btns = [0, 1, 2].map((i) => `<button class="bx${ans !== undefined ? (i === o.ans ? ' ok' : i === ans ? ' bad' : '') : ''}" style="--c:${CAT[i]}" data-ra="${i}"${ans !== undefined ? ' disabled' : ''}>${esc(t.boxes[i])}</button>`).join('');
    const verdict = ans === undefined ? '' : `<div class="verdict" style="color:${ans === o.ans ? 'var(--ok)' : 'var(--wip)'}">${esc(ans === o.ans ? t.right : t.wrong)}</div>`;
    $('rQ').innerHTML = `<div class="rq"><div class="q">${esc(t.r.q(t.r.objs[obj]))}</div><div class="bxs">${btns}</div>${verdict}</div>`;
  }
  const k = Object.keys(S.rAns).length;
  lab.setReadout(`⏪ ${steps}`, `/ ${n - 1}`, ans === undefined ? '' : (ans === o.ans ? '✓' : '✗'), '#F2B04A');
  setSt(t.st.rewind[k >= 4 ? 1 : 0]);
}
render();
</script>
