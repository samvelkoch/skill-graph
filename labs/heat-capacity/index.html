}

// --- the Beach scene ---------------------------------------------------------------------------------------
function chevrons(c, x0, x1, y, dir, phase, n, col, alpha, vertical) { // moving arrows along a row or a column
  c.save(); c.strokeStyle = col; c.lineWidth = 2.4; c.lineCap = 'round'; c.lineJoin = 'round';
  const span = Math.abs(x1 - x0);
  for (let i = 0; i < n; i++) {
    const f = (i / n + phase) % 1, p = dir > 0 ? x0 + f * span : x1 - f * span;
    c.globalAlpha = alpha * Math.sin(Math.PI * f);
    c.beginPath();
    if (vertical) { c.moveTo(y - 5, p - 5 * dir); c.lineTo(y, p); c.lineTo(y + 5, p - 5 * dir); }
    else { c.moveTo(p - 5 * dir, y - 5); c.lineTo(p, y); c.lineTo(p - 5 * dir, y + 5); }
    c.stroke();
  }
  c.restore();
}
function drawBeach(c, w, h, time) {
  const B = S.b, hh = B.bh, t = T[lang], b = t.beach, Ts = beachT('sand', hh), Tw = beachT('sea', hh), sceneH = Math.round(h * 0.52);
  const yS = Math.round(sceneH * 0.52), shoreX = w * 0.5, night = clamp((hh - 7) / 2, 0, 1), hotS = clamp((Ts - 20) / 40, 0, 1);
  // sky
  const sky = c.createLinearGradient(0, 0, 0, yS); sky.addColorStop(0, mix('#3f86dc', '#0a0e2c', night)); sky.addColorStop(1, mix('#bfe4ff', '#3a3a78', night));
  c.fillStyle = sky; c.fillRect(0, 0, w, yS + 2);
  if (night > 0.3) { c.fillStyle = `rgba(255,255,255,${night * 0.8})`; for (let i = 0; i < 18; i++) c.fillRect(hash(i) * w, hash(i + 30) * yS * 0.6, 1.6, 1.6); }
  if (hh <= DAYH + 1.2) {
    const p = clamp(hh / DAYH, 0, 1.15), sx = lerp(w * 0.1, w * 0.9, Math.min(p, 1)), sy = (yS - 4) - Math.sin(Math.min(p, 1) * Math.PI) * (yS - 30) + Math.max(0, p - 1) * 160;
    const g = c.createRadialGradient(sx, sy, 2, sx, sy, 46); g.addColorStop(0, 'rgba(255,230,120,.8)'); g.addColorStop(1, 'rgba(255,230,120,0)'); c.fillStyle = g; c.fillRect(sx - 50, sy - 50, 100, 100);
    c.fillStyle = '#ffd84d'; c.beginPath(); c.arc(sx, sy, 13, 0, Math.PI * 2); c.fill();
  } else { c.save(); c.globalAlpha = night; c.fillStyle = '#f1f0d8'; c.beginPath(); c.arc(w * 0.18, 26, 11, 0, Math.PI * 2); c.fill(); c.fillStyle = mix('#3f86dc', '#0a0e2c', 0.9); c.beginPath(); c.arc(w * 0.18 + 5, 23, 10, 0, Math.PI * 2); c.fill(); c.restore(); }
  // sea
  const wave = (x) => yS + 3 + Math.sin(x * 0.07 + time * 1.6) * 1.8;
  c.beginPath(); c.moveTo(0, sceneH - 4); c.lineTo(0, wave(0)); for (let x = 0; x <= shoreX + 12; x += 5) c.lineTo(x, wave(x)); c.lineTo(shoreX + 12, sceneH - 4); c.closePath();
  const sg = c.createLinearGradient(0, yS, 0, sceneH); sg.addColorStop(0, mix('#4aa8f0', '#16224f', night * 0.7)); sg.addColorStop(1, mix('#1b4fa0', '#0a1236', night * 0.7)); c.fillStyle = sg; c.fill();
  c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.5; c.beginPath(); for (let x = 0; x <= shoreX + 12; x += 5) (x ? c.lineTo : c.moveTo).call(c, x, wave(x)); c.stroke();
  // sand
  c.beginPath(); c.moveTo(shoreX - 12, sceneH - 4); c.lineTo(shoreX - 12, yS + 8); c.quadraticCurveTo(shoreX + 14, yS - 2, shoreX + 40, yS - 4); c.lineTo(w, yS - 4); c.lineTo(w, sceneH - 4); c.closePath();
  const dg = c.createLinearGradient(0, yS, 0, sceneH); dg.addColorStop(0, mix('#e8c58e', '#ff8a4a', hotS * 0.7)); dg.addColorStop(0.35, '#d7a566'); dg.addColorStop(1, '#a8743d'); c.fillStyle = dg; c.fill();
  c.save(); c.clip(); for (let i = 0; i < 70; i++) { c.fillStyle = hash(i + 5) > 0.5 ? 'rgba(255,240,200,.4)' : 'rgba(60,35,10,.25)'; c.fillRect(shoreX + hash(i) * (w - shoreX), yS + hash(i + 60) * (sceneH - yS), 1.8, 1.8); } c.restore();
  // the layers the model looks at
  if (B.ans !== null) {
    c.save(); c.setLineDash([4, 3]); c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1.3;
    const wl = sceneH - yS - 40; c.strokeRect(10, yS + 6, shoreX - 34, Math.min(wl, 62)); c.strokeRect(shoreX + 44, yS - 4, w - shoreX - 56, 10); c.restore();
    c.save(); c.font = '700 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(10,12,20,.8)';
    rr(c, 14, yS + 10, c.measureText(b.lSea).width + 14, 18, 9); c.fill(); rr(c, shoreX + 48, yS + 10, c.measureText(b.lSand).width + 14, 18, 9); c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText(b.lSea, 21, yS + 19); c.fillText(b.lSand, shoreX + 55, yS + 19); c.restore();
  }
  // heat shimmer above hot sand
  if (hotS > 0.15) { c.save(); c.strokeStyle = `rgba(255,255,255,${hotS * 0.35})`; c.lineWidth = 1.5; for (let k = 0; k < 4; k++) { c.beginPath(); for (let y = 0; y < 26; y += 2) { const x = shoreX + 50 + k * ((w - shoreX - 70) / 3) + Math.sin(y * 0.4 + time * 3 + k) * 3; (y ? c.lineTo : c.moveTo).call(c, x, yS - 12 - y); } c.stroke(); } c.restore(); }
  // thermometers
  const xs = w * 0.9, xw = w * 0.1;
  thermo(c, xs, yS - 52, yS - 8, Ts, 70); thermo(c, xw, yS - 52, yS + 2, Tw, 70);
  pillText(c, [t.m.sand, `${nf(Ts, 0)} °C`], clamp(xs - 14, 38, w - 38), 2, [COL.sand, '#fff']);
  pillText(c, [t.m.sea, `${nf(Tw, 0)} °C`], clamp(xw + 14, 38, w - 38), 2, [COL.sea, '#fff']);
  // the breeze
  const d = Ts - Tw;
  if (B.ans !== null && Math.abs(d) > 0.4) {
    const s = clamp(Math.abs(d) / 14, 0.3, 1), dir = d > 0 ? 1 : -1, ph = (time * 0.18 * (0.4 + s)) % 1, col = '#ffffff', al = 0.55 + 0.4 * s;
    chevrons(c, 8, w - 8, yS - 16, dir, ph, 7, col, al, false);
    if (B.loop) {
      chevrons(c, 8, w - 8, yS - 54, -dir, ph, 7, col, al * 0.8, false);
      const upX = dir > 0 ? w * 0.72 : w * 0.28, dnX = dir > 0 ? w * 0.28 : w * 0.72;
      chevrons(c, yS - 52, yS - 18, upX, -1, ph, 2, '#ffd0a0', al, true); chevrons(c, yS - 52, yS - 18, dnX, 1, ph, 2, '#bfe4ff', al, true);
    }
  }
  // the graph
  const R = { x0: 6, y0: sceneH + 6, x1: w - 6, y1: h - 6 };
  graph(c, R, { xmax: HMAX, ymin: 15, ymax: 65, xt: [0, 4, 8, 12, 16], xl: (v) => `${(START + v) % 24}`, yt: [20, 40, 60],
    shade: [{ a: DAYH, b: HMAX, color: 'rgba(40,45,110,.35)' }], vlines: [], sel: null,
    series: [{ key: 'sand', color: COL.sand, upto: hh, f: (x) => beachT('sand', x) }, { key: 'sea', color: COL.sea, upto: hh, f: (x) => beachT('sea', x) }] });
  const gx0 = R.x0 + 36, gx1 = R.x1 - 12, mx = gx0 + (hh / HMAX) * (gx1 - gx0);
  c.save(); c.strokeStyle = 'rgba(255,255,255,.35)'; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(mx, R.y0 + 10); c.lineTo(mx, R.y1 - 20); c.stroke(); c.restore();
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  step(dt);
  const v = lab.view;
  if (v === 'heat') drawHeat(c, w, h, time); else if (v === 'formula') drawForm(c, w, h, time); else drawBeach(c, w, h, time);
});

// --- time steps --------------------------------------------------------------------------------------------
function step(dt) {
  const v = lab.view;
  S.ymax += ((S.iron ? 300 : 180) - S.ymax) * Math.min(1, dt * 5);
  if (S.playing) {
    S.t = Math.min(TMAX, S.t + dt * SPEED);
    if (S.t >= TMAX) S.playing = false;
    const sec = Math.floor(S.t);
    if (S.playing === false || sec !== S.lastSec || (!S.hv && S.pick && S.t >= 60)) {
      S.lastSec = sec; if (S.pick && S.t >= 60) S.hv = true; if (v === 'heat') render();
    }
  }
  const F = S.f, k = `${F.step}|${F.m}|${F.d}|${F.mat}|${F.g}`;
  if (k !== F.key) { F.key = k; F.anim = 0; } else F.anim += dt;
  const B = S.b;
  if (B.auto) { B.bt = Math.min(HMAX, B.bt + dt * 1.1); if (B.bt >= HMAX) B.auto = false; }
  if (Math.abs(B.bt - B.bh) > 0.002) {
    B.bh += (B.bt - B.bh) * Math.min(1, dt * 4); if (Math.abs(B.bt - B.bh) < 0.01) B.bh = B.bt;
    const q = Math.round(B.bh * 8);
    if (q !== B.lastQ) { B.lastQ = q; if (v === 'beach') render(); }
  }
}

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, F = S.f, B = S.b;
  if (act === 'pick') { S.pick = b.dataset.k; sfx.click(); }
  else if (act === 'play') {
    if (S.t >= TMAX) { S.t = 0; S.hv = false; S.lastSec = -1; }
    S.playing = !S.playing; sfx.click();
  } else if (act === 'reset') { S.t = 0; S.playing = false; S.hv = false; S.lastSec = -1; sfx.click(); }
  else if (act === 'iron') {
    if (!secret.unlocked()) return secret.open();
    S.iron = !S.iron; sfx.click();
  } else if (act === 'fpick') {
    F.g = +b.dataset.j; const ok = +b.dataset.j === (F.step === 0 ? 2 : 0); (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'fnext') { F.step++; F.g = null; sfx.click(); }
  else if (act === 'mat') { F.mat = b.dataset.k; sfx.tick(); }
  else if (act === 'bpick') { B.ans = b.dataset.k; B.bt = 2; B.auto = false; (B.ans === 'sand' ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'loop') {
    if (!secret.unlocked()) return secret.open();
    B.loop = !B.loop; if (B.loop) { B.bt = 0; B.bh = 0; B.auto = true; } else B.auto = false; sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'fm') S.f.m = v; else if (id === 'fd') S.f.d = v;
  else if (id === 'bt') { S.b.bt = v; S.b.bh = v; S.b.auto = false; }
  else return;
  render();
});
$('cv').addEventListener('click', (ev) => {
  if (lab.view !== 'heat' || !G.g) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, g = G.g;
  let hit = null;
  const bk = G.beakers.find((q) => x >= q.x0 && x < q.x1 && y >= q.y0 && y < q.y1);
  if (bk) hit = bk.key;
  else if (y >= g.R.y0) {
    let best = 28; const tt = clamp((x - g.gx0) / (g.gx1 - g.gx0) * TMAX, 0, Math.max(S.t, 1));
    g.keys.forEach((k) => { const d = Math.abs(g.Y(tempAt(k, Math.min(tt, S.t))) - y); if (d < best) { best = d; hit = k; } });
  }
  S.sel = hit && hit !== S.sel ? hit : null; sfx.tick(); render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('sHeat').hidden = v !== 'heat'; $('sForm').hidden = v !== 'formula'; $('sBeach').hidden = v !== 'beach';
  if (v === 'heat') renderHeat(t); else if (v === 'formula') renderForm(t); else renderBeach(t);
}
const listAt = (t, keys, tm) => keys.map((k) => `${t.m[k]} ${nf(tempAt(k, tm), 0)} °C`).join(' · ');

function renderHeat(t) {
  const h = t.heat, keys = S.iron ? ['water', 'oil', 'sand', 'iron'] : ['water', 'oil', 'sand'], tm = Math.round(S.t), kJ = nf(P * S.t / 1000, 1);
  lab.setGlow('rgba(255, 120, 60, .3)');
  const ok = S.pick === 'sand';
  put($('hAsk'), S.pick === null
    ? `<div class="hl-q">${esc(h.q)}</div><div class="hl-opts">${['water', 'oil', 'sand'].map((k) => `<button class="hl-opt" data-act="pick" data-k="${k}"><i style="background:${COL[k]}"></i>${esc(t.m[k])}</button>`).join('')}</div>`
    : !S.hv ? `<div class="hl-q">${esc(h.q)}</div><div class="hl-mine">${esc(h.mine(t.m[S.pick]))}</div>`
    : `<div class="hl-v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.notq)}</div><div class="hl-txt">${esc(h.vtxt(nf(tempAt('sand', 60), 0), nf(tempAt('oil', 60), 0), nf(tempAt('water', 60), 0)))}</div>`);
  const pl = $('hPlay'); pl.disabled = S.pick === null; pl.textContent = S.playing ? h.pause : S.t >= TMAX ? h.again : h.play;
  $('hReset').textContent = h.reset; $('hReset').hidden = S.t === 0 && !S.playing;
  const op = secret.unlocked(), ic = $('hIron'); ic.className = `chip secret ${op ? 'open' : ''} ${S.iron ? 'on' : ''}`; ic.textContent = op ? `🍳 ${t.secrets.a[0]}` : '🔒 ???';
  lab.setReadout(`${tm} ${t.u.s}`, h.sub(kJ), '', '#ff7a59');
  if (S.iron) {
    lab.setState({ emo: '🍳', title: h.iron.t, lead: h.iron.l(nf(CM.water / CM.iron, 0)), body: h.iron.b, extra: `<div class="hl-fine">${esc(listAt(t, keys, S.t))}</div>` });
  } else if (S.t === 0) {
    lab.setState({ emo: '🔥', title: h.idleT, lead: S.pick === null ? h.idleL(nf(M0, 1), P) : h.readyL, body: S.pick === null ? h.idleB : '', extra: '' });
  } else {
    lab.setState({ emo: '📈', title: h.runT, lead: h.runL(tm, kJ, listAt(t, keys, S.t)), body: S.hv ? h.doneB(nf(CM.water / CM.sand, 0)) : h.runB, extra: '' });
  }
  lab.setFacts(S.hv ? [{ emo: '💧', text: h.fact, src: 'https://en.wikipedia.org/wiki/Specific_heat_capacity' }] : []);
}

function renderForm(t) {
  const f = t.form, F = S.f, sc = fscene(), J = joules(sc.m, sc.mat, sc.d);
  lab.setGlow('rgba(95, 168, 160, .26)');
  const b = joules(1, 'water', 10);
  if (F.step >= 2) put($('fAsk'), '');
  else {
    const vals = F.step === 0 ? [b, 3 * b, 2 * b] : [2 * b, 1.5 * b, b], okj = F.step === 0 ? 2 : 0;
    if (F.g === null) put($('fAsk'), `<p class="hl-base">${esc(f.base(fmtE(b)))}</p><div class="hl-q">${esc(F.step === 0 ? f.qA : f.qB)}</div><div class="hl-opts">${vals.map((x, j) => `<button class="hl-opt" data-act="fpick" data-j="${j}">${esc(fmtE(x))}</button>`).join('')}</div>`);
    else put($('fAsk'), `<div class="hl-v ${F.g === okj ? 'ok' : 'no'}">${esc(F.g === okj ? t.right : t.notq)}</div><div class="hl-txt">${esc((F.step === 0 ? f.vA : f.vB)(fmtE(J)))}</div><button class="btn" data-act="fnext">${esc(F.step === 0 ? f.next : f.free)}</button>`);
  }
  $('fAsk').hidden = F.step >= 2; $('fFree').hidden = F.step < 2;
  $('fmL').textContent = f.mass; $('fmV').textContent = `${nf(F.m / 10, 1)} ${t.u.kg}`; $('fm').value = F.m;
  $('fdL').textContent = f.dT; $('fdV').textContent = `${F.d} °C`; $('fd').value = F.d;
  $('fcL').textContent = f.mat;
  put($('fChips'), (S.iron || secret.unlocked() ? ['water', 'oil', 'sand', 'iron'] : ['water', 'oil', 'sand']).map((k) => `<button class="chip ${F.mat === k ? 'on' : ''}" data-act="mat" data-k="${k}">${esc(t.m[k])}</button>`).join(''));
  lab.setReadout(sc.pending ? '?' : fmtE(J), sc.pending ? '' : f.time(fmtT(J / P)), `${nf(sc.m, 1)} ${t.u.kg} · ${t.m[sc.mat]} · ${sc.d} °C`, '#5fa8a0');
  if (F.step < 2) lab.setState({ emo: '🧮', title: f.stT0, lead: f.stL0, body: f.stB0, extra: '' });
  else lab.setState({ emo: '🧮', title: f.stT, lead: f.stL, body: f.stB, extra: `<div class="hl-fine">${esc(`${nf(sc.m, 1)} × ${CM[sc.mat]} × ${sc.d} = ${nf(J, 0)} ${t.u.J}`)}</div>` });
  lab.setFacts([{ emo: '⚡', text: f.fact, src: 'https://en.wikipedia.org/wiki/James_Prescott_Joule' }]);
}

function renderBeach(t) {
  const b = t.beach, B = S.b, hh = B.bh, Ts = beachT('sand', hh), Tw = beachT('sea', hh), sun = hh <= DAYH;
  lab.setGlow('rgba(255, 190, 90, .28)');
  put($('bAsk'), B.ans === null
    ? `<div class="hl-q">${esc(b.q)}</div><div class="hl-opts">${['sand', 'sea', 'same'].map((k) => `<button class="hl-opt" data-act="bpick" data-k="${k}">${esc(b.opts[k])}</button>`).join('')}</div>`
    : `<div class="hl-v ${B.ans === 'sand' ? 'ok' : 'no'}">${esc(B.ans === 'sand' ? t.right : t.notq)}</div><div class="hl-txt" style="margin:0">${esc(b.vr(nf(beachT('sand', 2), 0), nf(beachT('sea', 2), 0)))}</div>`);
  $('bFree').hidden = B.ans === null;
  $('btL').textContent = b.time; $('btV').textContent = clock(hh); $('bt').value = B.bt;
  const op = secret.unlocked(), lc = $('bLoop'); lc.className = `chip secret ${op ? 'open' : ''} ${B.loop ? 'on' : ''}`; lc.textContent = op ? b.loopB : '🔒 ???';
  $('bFine').textContent = B.ans === null ? '' : b.fine;
  lab.setReadout(clock(hh), `${t.m.sand} ${nf(Ts, 0)} °C · ${t.m.sea} ${nf(Tw, 0)} °C`, sun ? b.day : b.night, '#ffb84d');
  if (B.ans === null) lab.setState({ emo: '🏖️', title: b.preT, lead: b.preL, body: b.preB, extra: '' });
  else if (B.loop) {
    const neg = Ts < Tw;
    lab.setState({ emo: '🌊', title: t.secrets.b[0], lead: neg ? b.loopN : b.loopD, body: neg ? b.nightB2 : b.dayB, extra: '' });
  } else if (hh < 0.3) lab.setState({ emo: '🌅', title: b.morT, lead: b.morL, body: '', extra: '' });
  else if (sun) lab.setState({ emo: '☀️', title: b.dayT(nf(Ts, 0), nf(Tw, 0)), lead: b.dayL, body: b.dayB, extra: '' });
  else lab.setState({ emo: '🌙', title: b.nightT, lead: b.nightL, body: Ts >= Tw ? b.nightB1 : b.nightB2, extra: '' });
  lab.setFacts(B.ans !== null ? [{ emo: '🌬️', text: b.fact, src: 'https://en.wikipedia.org/wiki/Sea_breeze' }] : []);
}
render();
</script>
