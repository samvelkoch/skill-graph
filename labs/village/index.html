const mix = (a, b, f) => { const A = hx(a), B = hx(b); f = clamp(f, 0, 1); return toHex(A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f, A[2] + (B[2] - A[2]) * f); };

};

    c.fillStyle = rgr(c, sx, sy, 62, [[0, rgba(sc, .6)], [1, rgba(sc, 0)]]); circ(c, sx, sy, 62); c.fill();
    c.fillStyle = rgr(c, sx - 3, sy - 3, 14, [[0, '#ffffff'], [1, sc]]); circ(c, sx, sy, 13); c.fill();
    if (v === 'day' && !S.dragged && !S.sec) {
      const pr = 22 + Math.sin(time * 4) * 2; c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 2; c.setLineDash([4, 4]); circ(c, sx, sy, pr); c.stroke(); c.setLineDash([]);
      c.fillStyle = 'rgba(255,255,255,.9)'; [[-1, sx - pr - 6], [1, sx + pr + 6]].forEach(([d, x]) => { c.beginPath(); c.moveTo(x, sy); c.lineTo(x - d * 6, sy - 5); c.lineTo(x - d * 6, sy + 5); c.fill(); });
    }
  }
  if (E.nf > .02) {
    const my = 60 + (1 - E.nf) * 30; c.fillStyle = rgr(c, 300, my, 30, [[0, `rgba(230,235,255,${.4 * E.nf})`], [1, 'rgba(230,235,255,0)']]); circ(c, 300, my, 30); c.fill();
    c.fillStyle = rgba('#f4f0dc', E.nf); circ(c, 300, my, 10); c.fill(); c.fillStyle = `rgba(190,185,160,${.5 * E.nf})`; circ(c, 297, my - 2, 2.4); c.fill(); circ(c, 303, my + 3, 1.8); c.fill();
  }
  [[60, 44, 1], [200, 70, .8], [320, 36, 1.1]].forEach(([cx0, cy, k], n) => {
    const cx = ((cx0 + time * (2 + n)) % 480) - 40; c.fillStyle = `rgba(${E.snow > .5 ? '205,212,224' : '255,255,255'},${.85 * (1 - E.nf)})`;
    [[0, 0, 11], [-11, 3, 8], [11, 3, 9], [4, -5, 8]].forEach(([dx, dy, r]) => { circ(c, cx + dx * k, cy + dy * k, r * k); c.fill(); });
  });
  // hills and ground
  const g = E.grass, hillA = mix(g, '#6d86b8', .5), hillB = mix(g, '#6d86b8', .3);
  c.fillStyle = lg(c, 0, HOR - 34, 0, HOR + 6, [[0, hillA], [1, hillB]]);
  c.beginPath(); c.moveTo(-500, HOR + 10); c.lineTo(-500, HOR - 6); c.bezierCurveTo(-60, HOR - 34, 60, HOR - 6, 150, HOR - 18); c.bezierCurveTo(230, HOR - 30, 300, HOR - 4, 380, HOR - 22); c.bezierCurveTo(430, HOR - 30, 520, HOR - 10, 900, HOR - 8); c.lineTo(900, HOR + 10); c.closePath(); c.fill();
  c.fillStyle = mix(E.leaf, '#6d86b8', .4); [[20, 8], [60, 12], [120, 14], [180, 10], [250, 14], [330, 8], [380, 12]].forEach(([x, y]) => { circ(c, x, HOR - y + 6, 5.5); c.fill(); });
  c.fillStyle = lg(c, 0, HOR - 2, 0, 340, [[0, mix(g, '#cfe6d0', .25)], [1, shade(g, -.14)]]); c.fillRect(-1000, HOR - 2, 2400, 600);
  for (let i = 0; i < 3; i++) field(c, i, time);
  stream(c, time); road(c); garden(c); cellar(c); fenceBack(c);
  // standing things, far to near
  const L = [{ y: 258, f: () => church(c) }, { y: 266, f: () => mill(c, time) }, { y: 272, f: () => oven(c) }, { y: 284, f: () => tree(c, 34, 284, 1, time) },
    { y: 300, f: () => tree(c, 386, 300, 1.15, time) }, { y: 232, f: () => tree(c, 388, 232, .7, time) }, { y: 318, f: () => well(c, time) }, { y: 318, f: () => barn(c) }, { y: 322.5, f: () => fenceFront(c) }];
  for (let i = 0; i < 3; i++) L.push({ y: 262, f: () => cottage(c, i, time) });
  for (const a of A) {
    if (a.a < .02) continue;
    if (a.kind === 'person') L.push({ y: a.y, f: () => drawPerson(c, a, time) });
    else if (a.kind === 'cow' || a.kind === 'ox') L.push({ y: a.y, f: () => drawCow(c, a, time) });
    else if (a.kind === 'hen' || a.kind === 'roo') L.push({ y: a.y, f: () => drawHen(c, a, time) });
    else if (a.kind === 'sh') L.push({ y: a.y, f: () => drawSheep(c, a, time) });
    else L.push({ y: a.y, f: () => drawPig(c, a, time) });
  }
  L.sort((p, q) => p.y - q.y).forEach((o) => o.f());
  // smoke
  const puffs = (x, y, amt) => { for (let i = 0; i < 5; i++) { const ph = (time * .35 + i / 5) % 1; c.fillStyle = `rgba(215,215,222,${(1 - ph) * .5 * amt})`; circ(c, x + Math.sin(ph * 5 + i) * 3 + ph * 6, y - ph * 30, 2.5 + ph * 6); c.fill(); } };
  for (let i = 0; i < 3; i++) puffs(CX[i] + 10, 211, smokeOf(i));
  puffs(258, 240, Math.max(S.ov, .25) * (1 - S.st));
  if (E.snow > .5) E.snow = E.snow;
  // tint
  c.globalCompositeOperation = 'multiply'; c.fillStyle = mix(kfC(TINT, t), '#dfe8f5', wint * .3); c.fillRect(-1000, -1000, 2400, 2400); c.globalCompositeOperation = 'source-over';
  // lit windows and fire
  const fl = (i) => .9 + .1 * Math.sin(time * 7 + i * 2.3) * Math.sin(time * 3.1 + i);
  const lamp = (x, y, r, a, col = '#ffb050') => { c.globalCompositeOperation = 'lighter'; c.fillStyle = rgr(c, x, y, r, [[0, rgba(col, .45 * a)], [1, rgba(col, 0)]]); circ(c, x, y, r); c.fill(); c.globalCompositeOperation = 'source-over'; };
  for (let i = 0; i < 3; i++) {
    const wv = winOf(i) * fl(i) * (i === 1 ? 1 - S.cut : 1);
    if (wv > .02) [CX[i] - 17, CX[i] + 10].forEach((wx) => { c.fillStyle = rgba('#ffc65a', .95 * wv); rr(c, wx, 244, 7, 7, 1); c.fill(); c.strokeStyle = '#5a3a1e'; c.lineWidth = .8; c.beginPath(); c.moveTo(wx + 3.5, 244); c.lineTo(wx + 3.5, 251); c.stroke(); lamp(wx + 3.5, 247.5, 24, wv); });
  }
  const cw = E.win * (1 - S.st);
  if (cw > .02) [[38.5, 243], [58.5, 243]].forEach(([x, y]) => { c.fillStyle = rgba('#ffc65a', .8 * cw); c.beginPath(); c.moveTo(x - 2.5, y + 4); c.lineTo(x - 2.5, y - 2); c.arc(x, y - 2, 2.5, Math.PI, 0); c.lineTo(x + 2.5, y + 4); c.fill(); lamp(x, y, 16, cw * .6); });
  if (S.ov > .05) { c.fillStyle = rgba('#ff8a2a', S.ov * (1 - S.st) * (.85 + .15 * Math.sin(time * 9))); c.beginPath(); c.moveTo(247, 272); c.lineTo(247, 266); c.arc(253, 266, 6, Math.PI, 0); c.lineTo(259, 272); c.fill(); lamp(253, 268, 26, S.ov * (1 - S.st)); }
  if (S.cut > .05) lamp(CX[1] + 12, 253, 26, S.cut * fl(3) * .8);
  if (v === 'then' && S.item === 1 && S.picked !== null) lamp(CX[1], 252, 18, S.cut * .5);
  // reveal glow
  if (S.rg > .02) {
    const sp = [[168, 306], [CX[1], 250], [253, 262], [196, 310], [S.carX, 278], [338, 302]][S.item], r = 20 + 3 * Math.sin(time * 4);
    c.fillStyle = rgr(c, sp[0], sp[1], r + 10, [[0, `rgba(255,232,120,${.5 * S.rg})`], [1, 'rgba(255,232,120,0)']]); circ(c, sp[0], sp[1], r + 10); c.fill();
    c.strokeStyle = `rgba(255,236,150,${.95 * S.rg})`; c.lineWidth = 2.5; circ(c, sp[0], sp[1], r); c.stroke();
  }
  // rooster call, sleepers, snow, field labels
  const ph = phaseOf(S.ts);
  if (v === 'day' && ph === 0 && !S.sec && AI.roo.a > .5) { const r = AI.roo; c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.6; [8, 13, 18].forEach((d, k) => { c.beginPath(); c.arc(r.x + 8, r.y - 18, d, -.7 + Math.sin(time * 6 + k) * .1, .7); c.stroke(); }); pill(c, '♪ ♪', r.x + 6, r.y - 40); }
  if (E.nf > .7 && v === 'day' && !S.sec) { c.font = '16px sans-serif'; c.textAlign = 'center'; c.fillStyle = '#fff'; for (let i = 0; i < 3; i++) c.fillText('💤', CX[i] + 4, 208 - ((time * 6 + i * 5) % 12)); }
  if (E.snow > .1) { const fa = sm((S.ys - 2.65) / .25) * .85; c.fillStyle = `rgba(255,255,255,${fa})`; for (let k = 0; k < 70; k++) { circ(c, ((k * 53.7 + 15 * Math.sin(time * .7 + k)) % 440) - 20, ((k * 37.3 + time * (22 + (k % 5) * 6)) % 360) - 20, 1 + (k % 3) * .6); c.fill(); } }
  if (S.fa > .05) { c.globalAlpha = S.fa; FLD.forEach((f, i) => pill(c, ['🌾 ', '🌱 ', '💤 '][roleOf(i)] + T[lang].fl.roles[roleOf(i)], (f.x0 + f.x1) / 2, 206)); c.globalAlpha = 1; }
  c.restore();
}

// --- input ---------------------------------------------------------------------------------------------------
let drag = false;
const dragTo = (ev) => {
  const r = $('cv').getBoundingClientRect(), lx = (ev.clientX - r.left - geo.ox) / geo.s;
  S.t = clamp(lx <= 360 ? (lx - 30) / 330 * 0.9 : 0.9 + (lx - 360) / 40 * 0.1, 0, 1); S.dragged = true; S.sec = null; render();
};
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'day') return;
  const r = $('cv').getBoundingClientRect(), ly = (ev.clientY - r.top - geo.oy) / geo.s;
  if (ly > HOR + 10) return;
  drag = true; $('cv').setPointerCapture?.(ev.pointerId); dragTo(ev);
});
$('cv').addEventListener('pointermove', (ev) => { if (drag) dragTo(ev); });
addEventListener('pointerup', () => { drag = false; });
$('vlT').addEventListener('input', (ev) => { S.t = +ev.target.value / 1000; S.dragged = true; S.sec = null; render(); });
$('vlY').addEventListener('input', (ev) => { S.yr = +ev.target.value / 100; render(); });
$('vlSeas').addEventListener('click', (ev) => { const b = ev.target.closest('[data-s]'); if (!b) return; S.yr = +b.dataset.s; sfx.click(); render(); });
$('vlNextY').addEventListener('click', () => { S.fy++; sfx.click(); render(); });
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const pickItem = (i) => { S.item = i; S.picked = null; S.carX = -70; render(); };
$('vlItems').addEventListener('click', (ev) => { const b = ev.target.closest('[data-i]'); if (!b) return; sfx.click(); pickItem(+b.dataset.i); });
$('vlOpts').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-o]'); if (!b || S.picked !== null) return;
  S.picked = +b.dataset.o; (S.picked === 0 ? sfx.good : sfx.bad)(); render(); showStage();
});
$('vlAfter').addEventListener('click', (ev) => { if (ev.target.closest('[data-next]')) { sfx.click(); pickItem((S.item + 1) % 6); } });
$('vlSecRow').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  sfx.click();
  if (b.dataset.sec === 'stars') {
    if (S.sec === 'stars') { S.sec = null; S.t = S.tPrev; } else { S.tPrev = S.t; S.sec = 'stars'; S.t = 1; lab.view = 'day'; lab.renderChrome(); }
  } else if (S.sec === 'fields') S.sec = null; else { S.sec = 'fields'; lab.view = 'year'; lab.renderChrome(); }
  render();
});

// --- one render per change -----------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  if (S.sec === 'stars' && v !== 'day') S.sec = null;
  if (S.sec === 'fields' && v !== 'year') S.sec = null;
  $('vlDay').style.display = v === 'day' ? '' : 'none';
  $('vlYear').style.display = v === 'year' && S.sec !== 'fields' ? '' : 'none';
  $('vlFields').style.display = v === 'year' && S.sec === 'fields' ? '' : 'none';
  $('vlThen').style.display = v === 'then' ? '' : 'none';
  bubble.style.display = v === 'then' ? '' : 'none';
  const open = secret.unlocked();
  $('vlSecRow').innerHTML = [['stars', '🌌', t.secrets.s1[0]], ['fields', '🌾', t.secrets.s2[0]]].map(([k, e, n]) =>
    `<button class="vl-lock ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${e} ${esc(n)}` : '🔒 ???'}</button>`).join('');
  lab.setFacts([]);
  if (v === 'day') {
    const ph = phaseOf(S.t);
    $('vlT').value = Math.round(S.t * 1000); $('vlT').setAttribute('aria-label', t.time);
    lab.setGlow('rgba(244, 167, 107, .26)');
    if (S.sec === 'stars') { lab.setReadout('🌌 ' + esc(t.ph[5][0]), '', '', PH_C[5]); lab.setState({ emo: '🌌', title: t.st.title, lead: t.st.lead, body: t.st.body, extra: '' }); }
    else { lab.setReadout(`${PH_E[ph]} ${esc(t.ph[ph][0])}`, '', '', PH_C[ph]); lab.setState({ emo: PH_E[ph], title: t.ph[ph][0], lead: t.ph[ph][1], body: '', extra: '' }); }
    lab.setFacts(t.facts.day);
  } else if (v === 'then') {
    const it = t.items[S.item], ord = ORD[S.item], p = S.picked;
    lab.setGlow('rgba(95, 168, 160, .26)');
    $('vlItems').innerHTML = ITEM_E.map((e, i) => `<button data-i="${i}" class="${i === S.item ? 'on' : ''}" aria-label="${esc(t.items[i].n)}">${e}</button>`).join('');
    $('vlQ').textContent = t.q;
    $('vlOpts').innerHTML = ord.map((o) => `<button class="vl-opt ${p === null ? '' : o === 0 ? 'good' : o === p ? 'bad' : 'dim'}" data-o="${o}"${p === null ? '' : ' disabled'}><span class="e">${OPT_E[S.item][o]}</span><span>${esc(it.o[o])}</span></button>`).join('');
    $('vlAfter').innerHTML = p === null ? '' : `<span class="vl-verdict" style="color:${p === 0 ? 'var(--ok)' : 'var(--wip)'}">${esc(p === 0 ? t.right : t.wrong)}</span><button class="vl-btn" data-next="1">${esc(t.next)}</button>`;
    bubble.innerHTML = `<span class="e">${ITEM_E[S.item]}</span><span>${esc(it.n)}</span>`;
    lab.setReadout(ITEM_E[S.item], it.n, p === null ? '' : it.o[0], '#5fa8a0');
    lab.setState(p === null ? { emo: '🤔', title: t.q, lead: t.pick, body: '', extra: '' } : { emo: p === 0 ? '✅' : '🤔', title: p === 0 ? t.right : t.wrong, lead: it.tell, body: '', extra: '' });
    if (p !== null) lab.setFacts(t.facts.then);
  } else {
    const s = seasonOf();
    $('vlY').value = Math.round(S.yr * 100); $('vlY').setAttribute('aria-label', t.season);
    $('vlSeas').innerHTML = SE_E.map((e, i) => `<button data-s="${i}" class="${i === s ? 'on' : ''}"><span class="e">${e}</span>${esc(t.seas[i][0])}</button>`).join('');
    $('vlNextY').textContent = t.fl.next;
    lab.setGlow('rgba(143, 207, 106, .22)');
    if (S.sec === 'fields') {
      lab.setReadout([0, 1, 2].map((i) => ['🌾', '🌱', '💤'][(i + S.fy) % 3]).join(' '), '', '', '#e0b050');
      lab.setState({ emo: '🌾', title: t.fl.title, lead: t.fl.lead, body: t.fl.body, extra: '' });
    } else { lab.setReadout(`${SE_E[s]} ${esc(t.seas[s][0])}`, '', '', SE_C[s]); lab.setState({ emo: SE_E[s], title: t.seas[s][0], lead: t.seas[s][1], body: '', extra: '' }); }
    lab.setFacts(t.facts.year);
  }
}
render();
