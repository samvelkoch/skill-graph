function pill(c, text, x, y, o = {}) {
  const maxW = Math.min(o.maxW ?? 240, CW - 8), fs = o.fs ?? 12, pad = 8, lh = fs + 3;
  c.save();
  c.font = `800 ${fs}px Nunito, sans-serif`;
  const words = String(text).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (c.measureText(t).width > maxW - 2 * pad && cur) { lines.push(cur); cur = w; } else cur = t; }
  lines.push(cur);
  const tw = Math.max(...lines.map((l) => c.measureText(l).width)), bw = tw + 2 * pad, bh = lines.length * lh + 6;
  let bx = o.align === 'l' ? x : o.align === 'r' ? x - bw : x - bw / 2;
  bx = clamp(bx, 4, Math.max(4, CW - bw - 4));
  const by = clamp(o.mid ? y - bh / 2 : y, 4, Math.max(4, CH - bh - 4));
  c.globalAlpha = 1; c.fillStyle = o.bg ?? 'rgba(10,12,20,.82)';
  c.beginPath(); c.roundRect(bx, by, bw, bh, Math.min(12, bh / 2)); c.fill();
  c.fillStyle = o.col ?? '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle';
  lines.forEach((l, i) => c.fillText(l, bx + pad, by + 3 + lh * (i + 0.5)));

  return { x: bx, y: by, w: bw, h: bh };
}

// --- focus view ----------------------------------------------------------------------------------------------
let FIELD = { cx: 0, cy: 0, R: 100 };
function drawFocus(c, w, h, dt, time) {
  const t = T[lang], wide = w >= 640;
  let mb, R, fcx, fcy;
  if (wide) { mb = { x: 0, y: 0, w: w * .44, h }; R = Math.min(h * .40, (w * .56 - 44) / 2); fcx = w * .44 + w * .56 / 2; fcy = h / 2; }
  else { mb = { x: 0, y: 0, w, h: h * .40 }; const top = mb.h + 32, rh = h - top - 8; R = Math.max(40, Math.min((w - 44) / 2, rh / 2)); fcx = w / 2; fcy = top + rh / 2; }
  FIELD = { cx: fcx, cy: fcy, R };
  S.objV += (S.obj - S.objV) * Math.min(1, dt * 7);
  const g = drawScope(c, mb, time);
  // the two numbers that multiply into the magnification
  pill(c, `${t.eye} 10×`, g.ox + 94 * g.s - 8, g.oy + 18 * g.s, { align: 'r', maxW: 120 });
  pill(c, `${t.objL} ${OBJ[S.obj]}×`, g.ox + 66 * g.s, g.oy + 214 * g.s, { align: 'r', maxW: 120 });

  c.save(); c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 18; c.shadowOffsetY = 6;
  c.beginPath(); c.arc(fcx, fcy, R + 9, 0, TAU); c.fillStyle = '#06070b'; c.fill(); c.restore();
  c.beginPath(); c.arc(fcx, fcy, R + 9, 0, TAU); c.lineWidth = 1.5; c.strokeStyle = 'rgba(160,175,205,.35)'; c.stroke();
  c.save(); c.beginPath(); c.arc(fcx, fcy, R, 0, TAU); c.clip();
  if (S.ask) {
    c.fillStyle = rad(c, fcx - R * .3, fcy - R * .3, 0, fcx, fcy, R * 1.1, [[0, '#1d2336'], [1, '#0a0d17']]); c.fillRect(fcx - R, fcy - R, 2 * R, 2 * R);
    c.font = `900 ${R * .9 | 0}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(130,145,190,.12)'; c.fillText('?', fcx, fcy + R * .05);
  } else {
    const cork = S.slide === 'cork';
    c.fillStyle = cork ? rad(c, fcx, fcy, 0, fcx, fcy, R, [[0, '#fbf3d9'], [.7, '#f1e3bd'], [1, '#d8c598']]) : rad(c, fcx, fcy, 0, fcx, fcy, R, [[0, '#fffef6'], [.7, '#f7f0dd'], [1, '#d9cdb0']]);
    c.fillRect(fcx - R, fcy - R, 2 * R, 2 * R);
    const sp = specFor(R), sh = sharpness(), bl = Math.min(sh.raw, 16) * (R / 150);
    c.globalAlpha = 1 - .3 * clamp(bl / 12, 0, 1);
    drawBlurred(c, sp, fcx - R, fcy - R, 2 * R, 2 * R, bl);
    c.globalAlpha = 1;
    const f = clamp((time - S.swAt) / .4, 0, 1);
    if (f < 1) { c.fillStyle = `rgba(5,6,10,${(1 - f) * (1 - f) * .9})`; c.fillRect(fcx - R, fcy - R, 2 * R, 2 * R); }
    c.fillStyle = rad(c, fcx, fcy, R * .6, fcx, fcy, R * 1.02, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.34)']]); c.fillRect(fcx - R, fcy - R, 2 * R, 2 * R);
  }

  c.beginPath(); c.arc(fcx, fcy, R - 3, Math.PI * 1.08, Math.PI * 1.42); c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineCap = 'round'; c.stroke();
  if (!S.ask) {
    // scale bar
    const mmBar = [1, .5, .1][S.obj], bw = mmBar * 2 * R / FOV[S.obj];
    c.lineWidth = 3; c.strokeStyle = 'rgba(20,16,10,.85)'; c.lineCap = 'butt'; c.beginPath(); c.moveTo(fcx - bw / 2, fcy + R * .78); c.lineTo(fcx + bw / 2, fcy + R * .78); c.stroke();
    pill(c, `${fmt(mmBar)} ${t.mm}`, fcx, fcy + R * .78 + 6, { maxW: 90 });
    pill(c, t.see, fcx, fcy - R - 30, { maxW: 200 });
    if (S.verdict) pill(c, S.verdict === 'right' ? `✓ ${t.ask.right}` : t.ask.wrong, fcx, fcy - R * .6, { maxW: 200, bg: S.verdict === 'right' ? 'rgba(20,120,80,.9)' : 'rgba(150,100,20,.92)' });
    // the 10× view for comparison, after the prediction
    if (S.cmpOn && S.obj === 2) {

      const ix = fcx - R * .74, iy = fcy - R * .74;
      c.save(); c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 10; c.beginPath(); c.arc(ix, iy, ir + 4, 0, TAU); c.fillStyle = '#06070b'; c.fill(); c.restore();

}

// --- plant or animal ------------------------------------------------------------------------------------------
let GEO = [];
function layoutCells(w, h, n) {
  if (n === 1) { const k = Math.max(40, Math.min((w - 24) / 1.3, h - 112)); return [{ kind: 'p', x: (w - 1.3 * k) / 2, y: 50 + (h - 50 - 58 - k) / 2, k }]; }
  if (w < 600) { const k = Math.max(40, Math.min((h - 86) / 2, (w - 28) / 1.3)); const x = (w - 1.3 * k) / 2; return [{ kind: 'p', x, y: 34, k }, { kind: 'a', x, y: 34 + k + 40, k }]; }
  const k = Math.max(40, Math.min((w - 70) / 2 / 1.3, h - 80)), gap = 24, tw = 2 * 1.3 * k + gap, x0 = (w - tw) / 2, y = 38 + (h - 38 - k) / 2 - 10;
  return [{ kind: 'p', x: x0, y, k }, { kind: 'a', x: x0 + 1.3 * k + gap, y, k }];
}
function badge(c, x, y, txt, col, o = {}) {
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 5; c.shadowOffsetY = 2;
  c.beginPath(); c.arc(x, y, 11, 0, TAU); c.fillStyle = col; c.fill(); c.shadowColor = 'transparent';
  c.lineWidth = 2; c.strokeStyle = o.ring ?? '#fff'; if (o.dash) c.setLineDash([3, 3]); c.stroke(); c.setLineDash([]);
  c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = o.ink ?? '#0b0d12'; c.fillText(txt, x, y + 1);
  c.restore();
}
function drawParts(c, w, h, dt, time) {
  const t = T[lang], cells = layoutCells(w, h, 2); GEO = cells;
  for (const b of cells) {
    c.save(); c.translate(b.x, b.y); c.scale(b.k, b.k); (b.kind === 'p' ? drawPlant : drawAnimal)(c, b.k, {}); c.restore();
    pill(c, t.p.cell[b.kind], b.x + 1.3 * b.k / 2, b.y - 28, { maxW: 200 });
  }
  INST.forEach(([cell, type, an], idx) => {
    const b = cells.find((q) => q.kind === cell), x = b.x + an[0] * b.k, y = b.y + an[1] * b.k, id = `${cell}:${type}`, got = S.place[id], li = LABELS.indexOf(type);
    if (!S.checked) { if (got) badge(c, x, y, LABELS.indexOf(got) + 1, LAB_COL[LABELS.indexOf(got)]); return; }
    if (got === type) badge(c, x, y, '✓', '#3ddc97', { ink: '#05281a' });
    else if (got) { badge(c, x, y, '✗', '#ff5a52', { ink: '#fff' }); badge(c, clamp(x + 25, 14, CW - 14), y, li + 1, LAB_COL[li]); }
    else badge(c, x, y, li + 1, LAB_COL[li], { dash: true });
  });
  if (time - S.msgAt < 1.8 && S.msg) pill(c, S.msg, w / 2, h - 34, { maxW: 240, bg: 'rgba(150,100,20,.92)' });
}

// --- jobs view ---------------------------------------------------------------------------------------------------
function drawJobs(c, w, h, dt, time) {
  const t = T[lang], J = S.j, wilt = S.sec === 'wilt', b = layoutCells(w, h, 1)[0]; GEO = [b];
  S.chloA += ((J.root && !wilt ? 0 : 1) - S.chloA) * Math.min(1, dt * 2.2);
  S.wilt.t += (S.wilt.tgt - S.wilt.t) * Math.min(1, dt * 1.7);
  c.save(); c.translate(b.x, b.y); c.scale(b.k, b.k);
  drawPlant(c, b.k, { hl: wilt ? null : J.sel, chlo: wilt ? 1 : S.chloA, turgor: wilt ? S.wilt.t : 1 });
  c.restore();
  let head;
  if (wilt) head = S.wilt.tgt < 1 ? t.j.inSalty : t.j.inFresh;
  else if (J.step === 0) head = t.j.q1; else if (J.step === 1) head = t.j.q2; else head = J.root ? t.j.root : t.j.plant;
  pill(c, head, 8, 8, { align: 'l', maxW: wilt ? CW - 84 : CW - 16 });
  if (wilt) drawLeaf(c, w - 40, 12, 52, 1 - S.wilt.t);
  if (wilt || J.step === 2) pill(c, `${t.j.analogy}`, w / 2, h - 36, { maxW: Math.min(CW - 16, 360), fs: 12, bg: 'rgba(10,12,20,.7)' });

}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;

const askEl = Object.assign(document.createElement('div'), { className: 'mi-ask' });
$('overlay').append(askEl);

function pickObj(i) {
  if (S.ask) return;
  if (i === 2 && !S.asked && S.obj !== 2) { if (S.obj === 0) { S.obj = 1; S.swAt = now(); } S.ask = true; S.verdict = null; S.cmpOn = false; sfx.click(); render(); return; }
  if (i === S.obj) return;
  S.obj = i; S.swAt = now(); S.verdict = null; S.cmpOn = false; sfx.click(); render();
}
function pickSlide(k) {

  S.slide = k; if (k === 'elodea' || k === 'cork') S.stain = false;
  S.swAt = now(); S.verdict = null; S.cmpOn = false; sfx.click(); render();
}
function answerAsk(i) {
  S.ask = false; S.asked = true; S.verdict = i === 0 ? 'right' : 'wrong'; S.obj = 2; S.swAt = now(); S.cmpOn = true; autoFocus();
  (i === 0 ? sfx.good : sfx.bad)(); showStage(); render();
}
askEl.addEventListener('click', (ev) => { const b = ev.target.closest('[data-fa]'); if (b) answerAsk(+b.dataset.fa); });

function pickSecret(k) {
  if (!secret.unlocked()) return secret.open();
  if (S.sec === k) { S.sec = null; if (k === 'cork') { S.slide = 'onion'; S.swAt = now(); } sfx.click(); render(); return; }
  S.sec = k; sfx.click();
  if (k === 'cork') {
    if (lab.view !== 'focus') { lab.view = 'focus'; lab.renderChrome(); }
    S.slide = 'cork'; S.stain = false; S.ask = false; S.verdict = null; S.cmpOn = false; S.obj = 1; S.swAt = now(); autoFocus();
  } else {
    if (lab.view !== 'jobs') { lab.view = 'jobs'; lab.renderChrome(); }
    if (S.slide === 'cork') S.slide = 'onion';
    S.wilt = { t: 1, tgt: 1, seen: false };
  }
  showStage(); render();
}
function onView(v) {
  if (S.sec === 'cork' && v !== 'focus') { S.sec = null; S.slide = 'onion'; S.swAt = now(); }
  if (S.sec === 'wilt' && v !== 'jobs') S.sec = null;
  render();
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;

  if (d.slide) pickSlide(d.slide);
  else if (d.obj !== undefined) pickObj(+d.obj);
  else if (d.act === 'stain') { if (!S.ask) { S.stain = !S.stain; S.swAt = now(); sfx.click(); render(); } }
  else if (d.lab) { S.sel = S.sel === d.lab ? null : d.lab; sfx.tick(); render(); }
  else if (d.act === 'check') { if (!S.checked && Object.keys(S.place).length) { S.checked = true; S.sel = null; const k = INST.filter(([cl, ty]) => S.place[`${cl}:${ty}`] === ty).length; (k === INST.length ? sfx.good : sfx.snap)(); showStage(); render(); } }
  else if (d.act === 'reset') { S.place = {}; S.checked = false; S.sel = null; sfx.click(); render(); }
  else if (d.ans !== undefined) answerJ1(+d.ans);
  else if (d.pt) { jobsSelect(d.pt); }
  else if (d.act === 'jagain') { S.j = { step: 0, q1: null, wrong: 0, last: null, sel: null, seen: {}, fresh: null, root: false }; S.chloA = 1; sfx.click(); render(); }
  else if (d.wat) { S.wilt.tgt = d.wat === 'salty' ? 0 : 1; if (d.wat === 'salty') S.wilt.seen = true; sfx.click(); showStage(); render(); }

});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'miCoarse') { S.coarse = +ev.target.value; render(); }
  else if (ev.target.id === 'miFine') { S.fine = +ev.target.value; render(); }
});

function answerJ1(i) {
  const J = S.j; if (J.step !== 0) return;
  J.q1 = i === 0 ? 'r' : 'w'; J.root = true; J.step = 1; (i === 0 ? sfx.good : sfx.bad)(); showStage(); render();
}
function jobsSelect(type) {
  const J = S.j;

  if (J.step === 1) {
    if (type === 'mit') { J.step = 2; J.sel = 'mit'; J.fresh = 'right'; J.seen.mit = 1; sfx.good(); }
    else { J.wrong++; J.last = type; J.sel = type; sfx.bad(); if (J.wrong >= 2) { J.step = 2; J.sel = 'mit'; J.fresh = 'gave'; J.seen.mit = 1; } }
  } else { J.sel = type; J.fresh = null; J.seen[type] = 1; sfx.tick(); }

$('cv').addEventListener('pointerdown', (ev) => {

    if (v === 'jobs') { jobsSelect(type); return; }
    const id = `${b.kind}:${type}`;
    if (S.checked) return;
    if (S.sel) { S.place[id] = S.sel; sfx.snap(); }
    else if (S.place[id]) { delete S.place[id]; sfx.tick(); }
    else { S.msg = T[lang].p.pick; S.msgAt = now(); sfx.bad(); }
    render(); return;
  }
});

// --- one render per change: controls, readout, state card and facts -------------------------------------------------
function render() {

  $('miP').style.display = v === 'parts' ? '' : 'none';
  $('miJ').style.display = v === 'jobs' ? '' : 'none';

  $('miSec').innerHTML = ['cork', 'wilt'].map((k) => {
    const open = secret.unlocked();
    return `<button class="chip mi-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${k === 'cork' ? '🪵' : '💧'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  }).join('');
}

function renderFocus(t) {
  lab.setGlow('rgba(78, 168, 255, .25)');
  const sl = ['onion', 'cheek', 'elodea'].concat(S.sec === 'cork' ? ['cork'] : []);
  $('miLs').textContent = t.slideL; $('miLo').textContent = t.lensL; $('miLc').textContent = t.coarse; $('miLf').textContent = t.fine;
  $('miSlides').innerHTML = sl.map((k) => `<button class="chip mi-chip ${S.slide === k ? 'on' : ''}" data-slide="${k}"${S.ask ? ' disabled' : ''}>${esc(t.slides[k])}</button>`).join('');
  $('miObjs').innerHTML = OBJ.map((o, i) => `<button class="chip mi-chip ${S.obj === i ? 'on' : ''}" data-obj="${i}"${S.ask ? ' disabled' : ''}><span class="mi-dot" style="background:${OBJ_COL[i]}"></span>${o}×</button>`).join('');
  const hasStain = S.slide === 'onion' || S.slide === 'cheek';
  $('miStain').hidden = !hasStain; if (hasStain) { $('miStain').textContent = t.stain[S.slide]; $('miStain').classList.toggle('on', S.stain); $('miStain').disabled = S.ask; }
  const co = $('miCoarse'), fi = $('miFine');
  if (String(S.coarse) !== co.value) co.value = S.coarse;
  if (String(Math.round(S.fine)) !== fi.value) fi.value = Math.round(S.fine);
  const f = fmt(FOV[S.obj]), inf = t.info[S.slide], sh = sharpness();
  if (S.ask) {
    lab.setReadout(`${10 * OBJ[S.obj]}×`, t.sub(OBJ[S.obj], fmt(FOV[S.obj])), '', '#4ea8ff');
    lab.setState({ emo: '🤔', title: t.ask.q, lead: t.ask.lead, body: '', extra: '' });
    askEl.innerHTML = `<div class="q">${esc(t.ask.q)}</div>${t.ask.opts.map((o, i) => `<button data-fa="${i}">${esc(o)}</button>`).join('')}`;
  } else {
    lab.setReadout(`${10 * OBJ[S.obj]}×`, t.sub(OBJ[S.obj], f), t.pill[sh.st], '#4ea8ff');
    let title = inf[0], lead = inf[1], body;
    if (S.verdict) { title = S.verdict === 'right' ? t.ask.right : t.ask.wrong; lead = t.ask.expl; body = inf[0]; }
    else body = sh.st !== 'sharp' ? t.tip[sh.st] : S.slide === 'cork' ? inf[2] : S.stain ? inf[2] : inf[3];
    lab.setState({ emo: S.slide === 'cork' ? '🪵' : '🔬', title, lead, body, extra: '' });
  }
  lab.setFacts(S.sec === 'cork' ? t.facts.cork : t.facts.focus);
}

function renderParts(t) {
  lab.setGlow('rgba(125, 200, 90, .22)');
  const n = Object.keys(S.place).length, tot = INST.length, k = INST.filter(([cl, ty]) => S.place[`${cl}:${ty}`] === ty).length;
  $('miLabels').innerHTML = LABELS.map((l, i) => `<button class="chip mi-chip ${S.sel === l ? 'on' : ''}" data-lab="${l}"${S.checked ? ' disabled' : ''}><span class="mi-n" style="background:${LAB_COL[i]}">${i + 1}</span>${esc(t.p.part[l])}</button>`).join('');
  $('miCheck').textContent = t.p.check; $('miCheck').hidden = S.checked; $('miCheck').disabled = !n;
  $('miReset').textContent = t.p.again; $('miHint').textContent = t.p.hint;
  if (S.checked) {
    lab.setReadout(`${k}/${tot}`, t.p.subDone, '', '#3ddc97');
    const only = ['wall', 'chl', 'vac'], both = ['mem', 'cyto', 'nuc', 'mit', 'rib'], nm = (x) => esc(t.p.part[x]) + (x === 'vac' ? esc(t.p.large) : '');
    lab.setState({ emo: k === tot ? '🏆' : '🧫', title: t.p.done(k, tot), lead: t.p.lDone, body: t.p.bDone,
      extra: `<div class="mi-venn"><div class="pl"><b>${esc(t.p.onlyP)}</b>${only.map((x) => `<span>${nm(x)}</span>`).join('')}</div><div class="bo"><b>${esc(t.p.both)}</b>${both.map((x) => `<span>${nm(x)}</span>`).join('')}</div></div>` });
  } else {
    lab.setReadout(`${n}/${tot}`, t.p.sub, '', '#7dc85a');
    lab.setState({ emo: '🧫', title: t.p.t0, lead: t.p.l0, body: t.p.b0, extra: '' });
  }
  lab.setFacts(t.facts.parts);
}

function renderJobs(t) {
  const J = S.j, wilt = S.sec === 'wilt', jb = t.j.job;
  lab.setGlow(wilt ? 'rgba(90, 170, 220, .25)' : 'rgba(255, 190, 90, .22)');
  $('miJagain').textContent = t.j.again; $('miJagain').hidden = wilt || J.step === 0;
  $('miWater').hidden = !wilt;
  $('miWater').innerHTML = wilt ? ['salty', 'fresh'].map((k) => `<button class="chip mi-chip ${(S.wilt.tgt < 1) === (k === 'salty') ? 'on' : ''}" data-wat="${k}">${esc(t.j.water[k])}</button>`).join('') : '';
  $('miParts').hidden = wilt || J.step !== 2;
  $('miParts').innerHTML = !wilt && J.step === 2 ? LABELS.map((l) => `<button class="chip mi-chip ${J.sel === l ? 'on' : ''}" data-pt="${l}">${esc(t.p.part[l])}</button>`).join('') : '';
  const q = $('miJq');
  if (!wilt && J.step === 0) q.innerHTML = `<div class="mi-qt">${esc(t.j.q1)}</div><div class="mi-opts">${t.j.q1o.map((o, i) => `<button class="chip mi-chip" data-ans="${i}">${esc(o)}</button>`).join('')}</div>`;
  else if (!wilt && J.step === 1) q.innerHTML = `<div class="mi-qt">${esc(t.j.q2)}</div><div class="mi-hint" style="margin-top:0">${esc(t.j.q2l)}</div>`;
  else q.innerHTML = '';
  const seen = Object.keys(J.seen).length;
  if (wilt) {
    const w = S.wilt, lbl = w.t > .7 ? t.j.firm : w.t < .35 ? t.j.limp : '…', st = w.tgt < 1 ? t.j.w1 : w.seen ? t.j.w2 : t.j.w0;
    lab.setReadout(lbl, t.j.cellWord, '', '#5aaadc');
    lab.setState({ emo: '💧', title: st[0], lead: st[1], body: st[2], extra: '' });
  } else {
    lab.setReadout(`${seen}/8`, t.j.sub, '', '#ffbe5a');
    let st;
    if (J.step === 0) st = { emo: '🌱', title: t.j.q1, lead: t.j.q1l, body: '' };
    else if (J.step === 1) {
      const first = J.q1 === 'r' ? t.j.q1r : t.j.q1w;
      if (J.wrong === 0) st = { emo: J.q1 === 'r' ? '✅' : '🌱', title: J.q1 === 'r' ? t.j.right : t.ask.wrong, lead: first, body: t.j.q2 };
      else { const x = jb[J.last]; st = { emo: x[3], title: t.j.q2w, lead: `${x[0]}: ${x[1]}`, body: x[2] }; }
    } else if (J.sel) {
      const x = jb[J.sel];
      st = J.fresh === 'right' ? { emo: x[3], title: t.j.right, lead: x[1], body: x[2] } : J.fresh === 'gave' ? { emo: x[3], title: t.j.gave, lead: x[1], body: x[2] } : { emo: x[3], title: x[0], lead: x[1], body: x[2] };
    } else st = { emo: '🏭', title: t.j.t2, lead: t.j.l2, body: '' };
    lab.setState({ ...st, extra: '' });
  }
  lab.setFacts(t.facts.jobs);
}
render();
</script>
