  const sg2 = c.createLinearGradient(250, 0, 346, 0); URC.forEach(([p, col]) => sg2.addColorStop(p, `rgb(${col.join(',')})`));
  rrect(c, 250, 470, 96, 14, 7); c.fillStyle = sg2; c.fill(); c.strokeStyle = 'rgba(20,26,51,.7)'; c.lineWidth = 1.5; c.stroke();
  if (!locked) { const mx = 250 + 96 * tT; c.fillStyle = '#fff'; c.beginPath(); c.moveTo(mx, 489); c.lineTo(mx - 6, 498); c.lineTo(mx + 6, 498); c.closePath(); c.fill(); }
  plain(c, L.pale, 250, 460); plain(c, L.dark, 346, 506, 'right');
}

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function runTest() {
  if (S.done1) return;
  S.done1 = true; S.t1 = nowS();
  const t = nowS(); // spread the dots that will cross, so the first ones reach the filter wall within a second or two
  P1.forEach((p, n) => { if (p.go) p.off = (((lerp(0.55, 0.95, (n * 0.37) % 1) * UC - t * 0.085) % 1) + 1) % 1; });
  const k = KINDS.filter((kk, i) => S.g1[i] === normalPass(kk)).length;
  (k === 6 ? sfx.good : sfx.bad)(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'g1') { if (S.done1) return; S.g1[+b.dataset.i] = !S.g1[+b.dataset.i]; sfx.tick(); }
  else if (a === 'test') runTest();
  else if (a === 'leak') { if (!secret.unlocked()) return secret.open(); if (!S.done1) return; S.leak = !S.leak; sfx.click(); }
  else if (a === 'sugar') { if (!secret.unlocked()) return secret.open(); S.high = !S.high; S.fresh2 = false; if (S.high) { S.follow = 'sugar'; S.pos = 1; } sfx.click(); }
  else if (a === 'follow') { S.follow = b.dataset.k; S.fresh2 = false; sfx.tick(); }
  else if (a === 'goto') { $('views').querySelector(`[data-view="${b.dataset.v}"]`)?.click(); return; }
  else if (a === 'opt2') { S.g2 = +b.dataset.i; S.done2 = true; S.fresh2 = true; S.t2 = nowS(); S.pos = 0; (S.g2 === T[lang].b.right ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'opt3') { S.g3 = +b.dataset.i; S.done3 = true; S.fresh3 = true; S.hot = true; (S.g3 === T[lang].d.right ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'hot') { S.hot = b.dataset.h === '1'; S.fresh3 = false; sfx.click(); }
  render();
});
$('bPos').addEventListener('input', (ev) => { S.pos = +ev.target.value / 100; S.fresh2 = false; render(); });
$('dIn').addEventListener('input', (ev) => { S.intake = +ev.target.value / 10; S.fresh3 = false; render(); });

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const v = lab.view, t = T[lang];
  $('vFilter').hidden = v !== 'filter'; $('vBack').hidden = v !== 'back'; $('vDrink').hidden = v !== 'drink';
  if (v === 'filter') rFilter(t); else if (v === 'back') rBack(t); else rDrink(t);
}
const fineBox = (s) => `<div class="kf-fine">${esc(s)}</div>`;
const secretChip = (el, key, emo, on, dis) => {
  const open = secret.unlocked();
  el.className = `chip secret${open ? ' open' : ''}${on ? ' on' : ''}`; el.textContent = open ? `${emo} ${T[lang].secrets[key][0]}` : '🔒 ???'; el.disabled = open && dis;
};

function rFilter(t) {
  const f = t.f, done = S.done1;
  lab.setGlow('rgba(93, 183, 255, .26)');
  $('fQ').hidden = done; $('fQ').textContent = f.q;
  $('fChips').innerHTML = KINDS.map((k, i) => {
    const g = S.g1[i], real = passes(k), hit = g === normalPass(k);
    let cls = 'kf-chip', status = g ? f.mineY : f.mineN;
    if (!done) { if (g) cls += ' on'; }
    else { status = `${S.leak ? '' : hit ? '✓ ' : '✗ '}${real ? f.pass : f.stay}`; if (!S.leak) cls += hit ? ' right' : ' wrong'; }
    return `<button class="${cls}" data-act="g1" data-i="${i}"${done ? ' disabled' : ''}><span class="kf-swb"><i class="kf-sw kf-sw-${k}" style="--d:${SWD[k]}px"></i></span><span>${esc(t.kinds[i])}<small>${esc(status)}</small></span></button>`;
  }).join('');
  $('fTest').hidden = done; $('fTest').textContent = f.test;
  secretChip($('fLeak'), 'leak', '🕳️', S.leak, !done);
  if (!done) {
    lab.setReadout('?', f.sub0, '', '#5db7ff');
    lab.setState({ emo: '🔬', title: f.pre[0], lead: f.pre[1], body: '', extra: fineBox(f.fine) });
  } else {
    const k = KINDS.filter((kk, i) => S.g1[i] === normalPass(kk)).length, n = KINDS.filter(passes).length;
    lab.setReadout(`${n}`, f.sub1, S.leak ? f.pillLeak : f.pill, '#5db7ff');
    if (S.leak) lab.setState({ emo: '⚠️', title: f.leak[0], lead: f.leak[1], body: '', extra: fineBox(f.fine) });
    else lab.setState({ emo: k === 6 ? '✅' : '🤔', title: k === 6 ? f.ok : f.no(k), lead: f.lead, body: f.body, extra: fineBox(f.fine) });
  }
  lab.setFacts(t.facts.f);
}

function rBack(t) {
  const b = t.b, gate = !S.done1, pre = !gate && !S.done2, post = S.done2;
  lab.setGlow('rgba(143, 180, 224, .26)');
  $('bPre').hidden = !pre; $('bGate').hidden = !gate; $('bPost').hidden = !post;
  $('bQ').textContent = b.q;
  $('bOpts').innerHTML = b.opts.map((o, i) => `<button class="kf-opt" data-act="opt2" data-i="${i}">${esc(o)}</button>`).join('');
  $('bGo').textContent = b.go;
  if (gate) { lab.setReadout('?', '', '', '#8fb4e0'); lab.setState({ emo: '🔒', title: b.gate[0], lead: b.gate[1], body: '', extra: '' }); lab.setFacts([]); return; }
  if (pre) { lab.setReadout('?', '', '', '#8fb4e0'); lab.setState({ emo: '🤔', title: b.pre[0], lead: b.pre[1], body: '', extra: '' }); lab.setFacts([]); return; }
  const p = S.pos, si = segOf(p), sugar = S.follow === 'sugar', unit = t.unit;
  $('bFol').textContent = b.follow;
  $('bFollow').innerHTML = [['water', b.water], ['sugar', b.sugar]].map(([k, l]) => `<button class="chip${S.follow === k ? ' on' : ''}" data-act="follow" data-k="${k}">${esc(l)}</button>`).join('');
  $('bWhere').textContent = b.where; $('bWhereV').textContent = b.segs[si];
  if (+$('bPos').value !== Math.round(p * 100)) $('bPos').value = Math.round(p * 100);
  $('bE0').textContent = b.ends[0]; $('bE1').textContent = b.ends[1];
  secretChip($('bSugar'), 'sugar', '🍬', S.high, false);
  const pe = p >= 0.98 ? 1 : p, Lw = cnt('water', pe) * WATER_DOT, Ls = Lw >= 10 ? String(Math.round(Lw)) : num(Lw), pct = Math.round(cnt('sugar', pe) / 24 * 100);
  if (sugar) lab.setReadout(`${pct}%`, b.valS, b.segs[si], '#ffc83d'); else lab.setReadout(`${Ls} ${unit}`, b.valW, b.segs[si], '#5db7ff');
  let st;
  if (S.fresh2) st = { emo: S.g2 === b.right ? '✅' : '🤔', title: S.g2 === b.right ? b.ok : b.no, lead: S.g2 === b.right ? b.revY : b.revN };
  else if (S.high && p > B1 * 0.5) st = { emo: '🍬', title: b.high[0], lead: b.high[1] };
  else st = { emo: ['💧', '♻️', '🔁', '🎚️', '🧪'][si], title: b.st[si][0], lead: b.st[si][1] };
  lab.setState({ ...st, body: '', extra: fineBox(b.fine) });
  lab.setFacts(t.facts.b);
}

function rDrink(t) {
  const d = t.d, L = d.lab, gate = !S.done2, pre = !gate && !S.done3, post = S.done3;
  lab.setGlow('rgba(226, 180, 50, .26)');
  $('dPre').hidden = !pre; $('dGate').hidden = !gate; $('dPost').hidden = !post;
  $('dQ').textContent = d.q;
  $('dOpts').innerHTML = d.opts.map((o, i) => `<button class="kf-opt" data-act="opt3" data-i="${i}">${esc(o)}</button>`).join('');
  $('dGo').textContent = d.go;
  if (gate) { lab.setReadout('?', '', '', '#e2b432'); lab.setState({ emo: '🔒', title: d.gate[0], lead: d.gate[1], body: '', extra: '' }); lab.setFacts([]); return; }
  const inn = S.intake, hot = S.hot, uri = urineOf(inn, hot), oth = OTHER[hot ? 1 : 0], tT = urineT(uri);
  if (pre) { lab.setReadout(`${num(uri)} ${t.unit}`, d.sub, d.cols[colIdx(tT)], '#e2b432'); lab.setState({ emo: '☁️', title: d.pre[0], lead: d.pre[1], body: '', extra: '' }); lab.setFacts([]); return; }
  $('dLab').textContent = L.slider; $('dVal').textContent = `${num(inn)} ${t.unit}`;
  if (+$('dIn').value !== Math.round(inn * 10)) $('dIn').value = Math.round(inn * 10);
  $('dHot').innerHTML = [[0, L.cool], [1, L.hot]].map(([h, l]) => `<button data-act="hot" data-h="${h}" class="${!!h === hot ? 'on' : ''}">${esc(l)}</button>`).join('');
  lab.setReadout(`${num(uri)} ${t.unit}`, d.sub, d.cols[colIdx(tT)], '#e2b432');
  let st, body = '';
  if (S.fresh3) { const ok = S.g3 === d.right; st = { emo: ok ? '✅' : '🤔', title: ok ? d.ok : d.no, lead: d.rev }; body = d.task; }
  else if (inn < oth + uri - 0.05) { st = { emo: '🥵', title: d.thirsty[0], lead: d.thirsty[1] }; body = d.adhHi; }
  else if (uri < 1.3) { st = { emo: '🟠', title: d.dry[0], lead: d.dry[1] }; body = d.adhHi; }
  else if (uri > 2.0) { st = { emo: '💧', title: d.wet[0], lead: d.wet[1] }; body = d.adhLo; }
  else { const b2 = hot ? d.hotbal : d.bal; st = { emo: '⚖️', title: b2[0], lead: b2[1] }; }
  const link = `<a class="kf-link" href="../homeostasis/?lang=${lang}">🌡️ ${esc(HOMEO[lang])} →</a>`;
  lab.setState({ ...st, body, extra: `<div class="kf-fine">${esc(d.skinNote)}</div>${link}${fineBox(d.fine)}` });
  lab.setFacts(t.facts.d);
}
render();
</script>
