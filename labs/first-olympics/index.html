// --- drawing helpers ---------------------------------------------------------------------------------------
const ease = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const back = (t) => { t = clamp(t, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const lin = (c, x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const emoji = (c, e, x, y, size) => { c.save(); c.globalAlpha = 1; c.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000'; c.fillText(e, x, y); c.restore(); };

  c.fillStyle = '#e9dfc6'; c.fillRect(x - wd * .7, y0 - 7, wd * 1.4, 7); c.fillRect(x - wd * .65, y1, wd * 1.3, 6);

const SPEC = ['#e8e1d0', '#d95f4a', '#e0b050', '#5f8fd0', '#f1c9a0']; // spectators

// --- scenes ------------------------------------------------------------------------------------------------
function drawRace(c, w, h, dt, t) {
  sky(c, w, h, [[0, '#1d2b55'], [.5, '#b9708a'], [.72, '#f0be86'], [1, '#c9a36a']]);
  c.save(); c.translate((w - W * SC) / 2, (h - H * SC) / 2); c.scale(SC, SC);
  const sun = c.createRadialGradient(290, 100, 2, 290, 100, 60); sun.addColorStop(0, 'rgba(255,236,170,.95)'); sun.addColorStop(.35, 'rgba(255,200,120,.35)'); sun.addColorStop(1, 'rgba(255,200,120,0)');
  c.fillStyle = sun; c.fillRect(220, 30, 140, 140); c.fillStyle = '#ffe9a8'; c.beginPath(); c.arc(290, 100, 17, 0, 7); c.fill();
  c.fillStyle = '#3d5a45'; c.beginPath(); c.moveTo(-40, 130); c.quadraticCurveTo(70, 70, 150, 112); c.quadraticCurveTo(230, 80, 400, 128); c.lineTo(400, 150); c.lineTo(-40, 150); c.fill();
  [[22, 112, 34], [338, 108, 38], [312, 114, 28]].forEach(([x, y, hh]) => { c.fillStyle = '#243d2c'; c.beginPath(); c.ellipse(x, y, 6, hh / 2, 0, 0, 7); c.fill(); });
  c.fillStyle = lin(c, 0, 108, 0, 158, [[0, '#7a9a55'], [1, '#4e6e3a']]); c.fillRect(-40, 108, 440, 50); // grass bank with spectators
  for (let k = 0; k < 90; k++) { const x = (k * 37.7) % 380 - 10, y = 114 + ((k * 13) % 5) * 8 + (k % 2) * 2, b = Math.sin(t * 3 + k) * (S.fin ? 2 : .4); c.fillStyle = SPEC[k % 5]; c.beginPath(); c.arc(x, y + b, 3.6, 0, 7); c.fill(); }
  c.fillStyle = lin(c, 0, 158, 0, 222, [[0, '#ebca90'], [1, '#c79f64']]); c.fillRect(-40, 158, 440, 64); // the track
  c.strokeStyle = 'rgba(120,85,40,.28)'; c.lineWidth = 1.5; [176, 194, 212].forEach((y) => { c.beginPath(); c.moveTo(-40, y); c.lineTo(400, y); c.stroke(); });
  c.fillStyle = 'rgba(80,50,20,.35)'; c.fillRect(-40, 222, 440, 3);
  c.fillStyle = '#f4ecd8'; c.strokeStyle = '#b49a6a'; c.lineWidth = 1; c.beginPath(); c.roundRect(38, 160, 7, 60, 3); c.fill(); c.stroke(); // start stone
  c.fillStyle = '#fff'; c.beginPath(); c.roundRect(314, 160, 7, 60, 3); c.fill(); c.fillStyle = '#e5484d'; for (let k = 0; k < 6; k++) c.fillRect(314, 160 + k * 10, 7, 5); // finish line
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(42, 236); c.lineTo(318, 236); c.stroke(); c.setLineDash([]); // one length
  [42, 318].forEach((x) => { c.beginPath(); c.moveTo(x, 230); c.lineTo(x, 242); c.stroke(); });
  pill(c, `${LEN} ${T[lang].unit}`, 180, 236, 13);
  if (S.pick.race !== null) { // the runner appears only after the guess
    if (!S.fin) {
      S.phase += dt * (3 + clamp(S.v, 0, 1) * 16); S.v *= Math.exp(-dt * 2.6); if (S.v < .02) S.v = 0; S.p = Math.min(1, S.p + S.v * dt);
      if (S.p >= 1) { S.fin = true; S.v = 0; sfx.good(); render(); }
    }
    const x = lerp(52, 308, S.p), yb = 202, sp = clamp(S.v, 0, 1), moving = sp > .05, ph = moving ? S.phase : 0, lean = .1 + .25 * sp, bob = moving ? Math.abs(Math.sin(ph)) * 2 : 0;
    S.dustT -= dt; if (sp > .2 && S.dustT <= 0) { S.dustT = .06; S.dust.push({ x: x - 8, y: yb - 1, l: 1 }); }
    S.dust = S.dust.filter((d) => (d.l -= dt * 2.2) > 0);
    S.dust.forEach((d) => { c.fillStyle = `rgba(255,235,200,${d.l * .5})`; c.beginPath(); c.arc(d.x - (1 - d.l) * 10, d.y - (1 - d.l) * 8, 2 + (1 - d.l) * 4, 0, 7); c.fill(); });

    c.save(); c.translate(x, yb - 24 - bob); c.lineCap = 'round';
    const limb = (a, len, col, wd, lift) => { c.strokeStyle = col; c.lineWidth = wd; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.sin(a) * len, Math.cos(a) * len - lift); c.stroke(); };
    const sw = moving ? .9 : .12;
    limb(Math.sin(ph + Math.PI) * sw, 24, '#b9794c', 7, Math.max(0, -Math.cos(ph + Math.PI)) * 6 * sp);
    c.save(); c.translate(0, -20); c.rotate(lean);
    limb(-Math.sin(ph) * sw * 1.1 + .2, 17, '#b9794c', 5, 0);
    c.fillStyle = '#d94f3a'; c.beginPath(); c.roundRect(-8, -2, 16, 26, 7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.2)'; c.beginPath(); c.roundRect(-6, 0, 5, 20, 3); c.fill();
    c.fillStyle = '#e0a070'; c.beginPath(); c.arc(1, -14, 9, 0, 7); c.fill();
    c.fillStyle = '#3a2418'; c.beginPath(); c.arc(0, -17, 9, Math.PI * 1.05, Math.PI * 2.05); c.fill();
    c.fillStyle = '#2a1a10'; c.beginPath(); c.arc(6, -14, 1.6, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(6.5, -14.6, .6, 0, 7); c.fill();
    limb(Math.sin(ph) * sw * 1.1 + .2, 17, '#e0a070', 5, 0);
    c.restore();
    limb(Math.sin(ph) * sw, 24, '#e0a070', 7, Math.max(0, -Math.cos(ph)) * 6 * sp);
    c.restore();
    if (S.fin) for (let k = 0; k < 14; k++) { const a = k * 1.7 + t * 1.5; c.fillStyle = SPEC[k % 5]; c.fillRect(308 + Math.sin(a * 2.1) * 40, 90 + ((t * 40 + k * 23) % 90), 4, 6); }
  }
  c.restore();
}

function drawPrize(c, w, h, dt, t) {
  sky(c, w, h, [[0, '#27386b'], [.55, '#d78a7c'], [1, '#f2c78e']]);
  c.save(); c.translate((w - W * SC) / 2, (h - H * SC) / 2); c.scale(SC, SC);
  const sun = c.createRadialGradient(180, 90, 4, 180, 90, 120); sun.addColorStop(0, 'rgba(255,240,190,.75)'); sun.addColorStop(1, 'rgba(255,220,150,0)');
  c.fillStyle = sun; c.fillRect(40, -20, 280, 220);
  [40, 105, 255, 320].forEach((x) => column(c, x, 58, 200, 22));
  c.fillStyle = '#e9dfc6'; c.fillRect(20, 44, 320, 14); c.fillStyle = '#cdbf9f'; c.fillRect(20, 56, 320, 3);
  c.fillStyle = lin(c, 0, 200, 0, H, [[0, '#cdb88f'], [1, '#a68c62']]); c.fillRect(-40, 200, 440, 60);
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(180, 232, 78, 9, 0, 0, 7); c.fill(); // podium
  c.fillStyle = lin(c, 120, 0, 240, 0, [[0, '#e8dcc0'], [.5, '#f8f1de'], [1, '#c9bb98']]); c.beginPath(); c.roundRect(120, 190, 120, 42, 6); c.fill();
  c.fillStyle = '#b9a67a'; c.font = '900 26px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('1', 180, 214);
  const hy = 190, bob = Math.sin(t * 2.4) * 1.2; // the winner, front view, arms up
  c.save(); c.translate(180, bob); c.lineCap = 'round';
  c.strokeStyle = '#b9794c'; c.lineWidth = 9; c.beginPath(); c.moveTo(-8, hy - 26); c.lineTo(-9, hy); c.stroke(); c.beginPath(); c.moveTo(8, hy - 26); c.lineTo(9, hy); c.stroke();
  c.strokeStyle = '#d58f5e'; c.lineWidth = 8; c.beginPath(); c.moveTo(-17, hy - 56); c.lineTo(-30, hy - 84); c.stroke(); c.beginPath(); c.moveTo(17, hy - 56); c.lineTo(30, hy - 84); c.stroke();
  c.fillStyle = '#d94f3a'; c.beginPath(); c.roundRect(-18, hy - 62, 36, 40, 12); c.fill();
  c.fillStyle = 'rgba(255,255,255,.2)'; c.beginPath(); c.roundRect(-14, hy - 58, 8, 30, 4); c.fill();
  c.fillStyle = '#e8a878'; c.beginPath(); c.arc(0, hy - 80, 15, 0, 7); c.fill();
  c.fillStyle = '#3a2418'; c.beginPath(); c.arc(0, hy - 84, 15, Math.PI * 1.02, Math.PI * 1.98); c.fill();
  c.fillStyle = '#2a1a10'; [-5, 5].forEach((x) => { c.beginPath(); c.arc(x, hy - 80, 1.8, 0, 7); c.fill(); }); c.fillStyle = '#fff'; [-5, 5].forEach((x) => { c.beginPath(); c.arc(x + .6, hy - 80.7, .7, 0, 7); c.fill(); });
  c.strokeStyle = '#8a4a30'; c.lineWidth = 1.6; c.beginPath(); c.arc(0, hy - 76, 5, .2, Math.PI - .2); c.stroke();

    const qy = hy - 122 + Math.sin(t * 3) * 4; c.fillStyle = '#fff'; c.beginPath(); c.arc(0, qy, 17, 0, 7); c.fill();
    c.fillStyle = '#27386b'; c.font = '900 24px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 0, qy + 1);
  } else {
    S.wreathT += dt; const k = S.wreathT, drop = k < .9 ? 1 - back(k / .9) : 0, wy = hy - 92 - drop * 90;
    c.save(); c.translate(0, wy); c.globalAlpha = clamp(k / .25, 0, 1);

    for (let n = 0; n < 16; n++) { const a = n / 16 * Math.PI * 2; c.save(); c.translate(Math.cos(a) * 15.5, Math.sin(a) * 5.5); c.rotate(a + Math.PI / 2 + (n % 2 ? .3 : -.3)); c.fillStyle = n % 2 ? '#8aa83a' : '#6f8f2e'; c.beginPath(); c.ellipse(0, 0, 3, 6.5, 0, 0, 7); c.fill(); c.restore(); }
    [.9, 2.4, 4.1].forEach((a) => { c.fillStyle = '#3b2a4a'; c.beginPath(); c.arc(Math.cos(a) * 15.5, Math.sin(a) * 5.5, 2.2, 0, 7); c.fill(); });

  }
  c.restore(); c.restore();
}

function drawNow(c, w, h, dt, t) {
  const hw = w / 2;
  c.fillStyle = lin(c, 0, 0, 0, h, [[0, '#4a3a2c'], [1, '#c9a36a']]); c.fillRect(0, 0, hw, h);
  c.fillStyle = lin(c, 0, 0, 0, h, [[0, '#15204a'], [1, '#3a6fb0']]); c.fillRect(hw, 0, hw, h);
  c.save(); c.translate((w - W * SC) / 2, (h - H * SC) / 2); c.scale(SC, SC);
  [20, 160].forEach((x) => { c.save(); c.globalAlpha = .55; column(c, x, 70, 160, 18); c.restore(); });
  for (let k = 0; k < 4; k++) { c.fillStyle = 'rgba(160,200,255,.28)'; c.fillRect(200 + k * 38, 120 - (k % 2) * 24, 24, 60 + (k % 2) * 24); }
  [210, 330].forEach((x) => { c.fillStyle = 'rgba(255,240,170,.9)'; c.beginPath(); c.arc(x, 40, 5, 0, 7); c.fill(); });
  c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 2; c.setLineDash([6, 6]); c.beginPath(); c.moveTo(180, 8); c.lineTo(180, 242); c.stroke(); c.setLineDash([]);
  pill(c, '🏛️ ' + T[lang].now.bins[0], 90, 24, 13); pill(c, '🆕 ' + T[lang].now.bins[1], 270, 24, 13);
  SP.forEach(([e], k) => {
    if (k > S.i) return; const p = S.pos[k], r = S.res[k], done = k < S.i, bobY = done ? 0 : Math.sin(t * 3) * 3;
    const tg = done ? slot(S.res.slice(0, k).filter((x) => x.old === r.old).length, r.old) : TOK;
    const f = 1 - Math.exp(-dt * 9); p.x = lerp(p.x, tg.x, f); p.y = lerp(p.y, tg.y, f); p.s = lerp(p.s, done ? .6 : 1, f);
    const R = 30 * p.s; c.save(); c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(p.x, p.y + R + 3, R * .8, 4, 0, 0, 7); c.fill();
    c.fillStyle = lin(c, 0, p.y - R, 0, p.y + R, [[0, '#ffffff'], [1, '#dfe4f0']]); c.strokeStyle = done ? (r.ok ? '#3ddc97' : '#f5a04c') : '#fff'; c.lineWidth = done ? 3 : 2;
    c.beginPath(); c.arc(p.x, p.y + bobY, R, 0, 7); c.fill(); c.stroke(); c.restore();
    emoji(c, e, p.x, p.y + bobY + 1, 34 * p.s);
  });
  c.restore();
}

function drawFlame(c, w, h, dt, t) {
  S.secT += dt; const k = ease(S.secT / 3.2);
  sky(c, w, h, [[0, '#5d9ee0'], [.6, '#bfe0f4'], [1, '#e8d9b0']]);
  c.save(); c.translate((w - W * SC) / 2, (h - H * SC) / 2); c.scale(SC, SC);
  const g = c.createRadialGradient(180, 28, 2, 180, 28, 80); g.addColorStop(0, 'rgba(255,245,190,.95)'); g.addColorStop(1, 'rgba(255,240,170,0)'); c.fillStyle = g; c.fillRect(90, -50, 180, 160);
  c.fillStyle = '#ffe27a'; c.beginPath(); c.arc(180, 28, 17, 0, 7); c.fill();
  c.fillStyle = lin(c, 0, 215, 0, H, [[0, '#d8c79c'], [1, '#b49c6c']]); c.fillRect(-40, 215, 440, 60);
  const my = (x) => 215 - (x - 180) * (x - 180) / 200; // a parabola with its focus at (180, 165)
  c.fillStyle = lin(c, 174, 0, 186, 0, [[0, '#8a5e36'], [1, '#5a3a1e']]); c.beginPath(); c.roundRect(176, 172, 8, 43, 3); c.fill(); // the torch
  c.fillStyle = '#c9a050'; c.beginPath(); c.moveTo(168, 150); c.lineTo(192, 150); c.lineTo(185, 172); c.lineTo(175, 172); c.closePath(); c.fill();
  c.save(); c.globalCompositeOperation = 'lighter'; c.lineWidth = 2; // sunlight down to the mirror, then to the focus
  for (let n = -4; n <= 4; n++) { if (!n) continue; const x = 180 + n * 18, y = my(x);
    c.strokeStyle = `rgba(255,230,140,${.35 + .4 * k})`; c.beginPath(); c.moveTo(x, 40); c.lineTo(x, y); c.stroke();
    c.strokeStyle = `rgba(255,170,70,${.25 + .6 * k})`; c.beginPath(); c.moveTo(x, y); c.lineTo(180, 165); c.stroke(); }
  c.restore();
  c.lineCap = 'round'; c.lineWidth = 8; c.strokeStyle = lin(c, 100, 0, 260, 0, [[0, '#b8892f'], [.5, '#fff0a8'], [1, '#b8892f']]);
  c.beginPath(); for (let x = 98; x <= 262; x += 4) { if (x === 98) c.moveTo(x, my(x)); else c.lineTo(x, my(x)); } c.stroke();
  c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.55)'; c.beginPath(); for (let x = 104; x <= 256; x += 4) { if (x === 104) c.moveTo(x, my(x) - 2); else c.lineTo(x, my(x) - 2); } c.stroke();
  c.fillStyle = '#7a6238'; c.beginPath(); c.roundRect(170, 214, 20, 12, 3); c.fill();
  const fl = k * (1 + Math.sin(t * 14) * .06), fh = 40 * fl, fw = 13 * fl; // the flame grows as the light gathers
  if (fl > .02) {
    const gl = c.createRadialGradient(180, 150, 2, 180, 145, 50 * fl); gl.addColorStop(0, 'rgba(255,190,80,.6)'); gl.addColorStop(1, 'rgba(255,190,80,0)'); c.fillStyle = gl; c.fillRect(110, 80, 140, 120);
    c.fillStyle = lin(c, 0, 150 - fh, 0, 150, [[0, '#ffd24a'], [.5, '#ff8a28'], [1, '#e8421e']]); c.beginPath(); c.moveTo(180 - fw, 150); c.quadraticCurveTo(180 - fw, 150 - fh * .5, 180 + Math.sin(t * 9) * 3, 150 - fh); c.quadraticCurveTo(180 + fw, 150 - fh * .5, 180 + fw, 150); c.closePath(); c.fill();
    c.fillStyle = '#fff3b0'; c.beginPath(); c.ellipse(180, 148 - fh * .22, fw * .4, fh * .3, 0, 0, 7); c.fill();
  }
  c.restore();
}

function drawRings(c, w, h, dt) {
  S.secT += dt;
  sky(c, w, h, [[0, '#101a3a'], [1, '#2a4a80']]);
  c.save(); c.translate((w - W * SC) / 2, (h - H * SC) / 2); c.scale(SC, SC);
  c.save(); c.fillStyle = lin(c, 0, 40, 0, 210, [[0, '#fbf8ef'], [1, '#e6e0cf']]); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 18; c.shadowOffsetY = 6; c.beginPath(); c.roundRect(22, 40, 316, 170, 22); c.fill(); c.restore();
  const R = 36, DX = 44, DY = 34, COL = ['#0081c8', '#fcb131', '#1c1c1c', '#00a651', '#ee334e'];
  const ctr = COL.map((_, i) => ({ x: 180 + (i - 2) * DX, y: 112 + (i % 2) * DY, dy: -(1 - back((S.secT - i * .25) / .8)) * 150, a: clamp((S.secT - i * .25) / .2, 0, 1) }));
  const ring = (i, clip) => { const p = ctr[i]; c.save(); if (clip) { c.beginPath(); c.arc(clip.x, clip.y, 11, 0, 7); c.clip(); } c.globalAlpha = p.a; c.strokeStyle = COL[i]; c.lineWidth = 8; c.beginPath(); c.arc(p.x, p.y + p.dy, R, 0, 7); c.stroke(); c.restore(); };
  COL.forEach((_, i) => ring(i));
  if (S.secT > 1.9) for (let i = 0; i < 4; i++) { // link the rings: each passes over its neighbour once and under it once
    const A = ctr[i], B = ctr[i + 1], mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, d = Math.hypot(B.x - A.x, B.y - A.y), hh = Math.sqrt(R * R - d * d / 4), ux = -(B.y - A.y) / d, uy = (B.x - A.x) / d;
    const P = { x: mx + ux * hh, y: my + uy * hh }, Q = { x: mx - ux * hh, y: my - uy * hh }, top = P.y < Q.y;
    ring(i, top ? P : Q); ring(i + 1, top ? Q : P);
  }
  c.restore();
}

// --- main loop ---------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, t) => {
  SC = Math.min(w / W, h / H) * .98;
  const v = S.sec || lab.view;
  if (v === 'race') drawRace(c, w, h, dt, t); else if (v === 'prize') drawPrize(c, w, h, dt, t); else if (v === 'now') drawNow(c, w, h, dt, t);
  else if (v === 'flame') drawFlame(c, w, h, dt, t); else drawRings(c, w, h, dt);
  if (v === 'race' && S.pick.race !== null && !S.fin) { const m = Math.round(S.p * LEN); if (m !== S.m) { S.m = m; renderRace(T[lang]); } }
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const answer = (view, i) => {
  if (S.pick[view] !== null) return;
  S.pick[view] = i; S.wreathT = 0; (i === T[lang][view].ok ? sfx.good : sfx.bad)(); render(); showStage();
};
const tap = () => { if (!S.fin) { S.v = Math.min(1.1, S.v + .4); sfx.tick(); } };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-opt], [data-act], [data-sort], [data-sec]'); if (!b) return;
  const v = lab.view;
  if (b.dataset.opt !== undefined) return answer(v, +b.dataset.opt);
  if (b.dataset.sec) { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; S.secT = 0; sfx.click(); return render(); }
  if (b.dataset.sort !== undefined && S.i < SP.length) {
    const old = b.dataset.sort === '1', ok = old === SP[S.i][1], t = T[lang];
    S.res[S.i] = { old: SP[S.i][1], ok }; S.last = `${ok ? t.right : t.wrong} ${t.now.sp[S.i]}:${SP[S.i][1] ? t.now.old : t.now.new}`; S.i++; (ok ? sfx.good : sfx.bad)(); return render();
  }
  if (b.dataset.act === 'tap') return tap();
  if (b.dataset.act === 'again') {
    sfx.click();
    if (v === 'race') { S.p = 0; S.v = 0; S.fin = false; S.m = -1; } else if (v === 'prize') S.wreathT = 0;
    else { S.i = 0; S.res = []; S.last = ''; S.pos = SP.map(() => ({ x: TOK.x, y: TOK.y + 40, s: 0 })); }
    render();
  }
});
$('cv').addEventListener('pointerdown', () => { if (!S.sec && lab.view === 'race' && S.pick.race !== null) tap(); });

// --- one render per change: controls, readout and the state card ---------------------------------------------
const facts = (t, k) => lab.setFacts([{ ...[F1, F2, F3][k], text: t.facts[k] }]);
function renderOpts(t, view) {
  const q = t[view], got = S.pick[view];
  $('oQ').textContent = q.q;
  $('oOpts').innerHTML = q.opts.map((o, i) => `<button class="ol-opt${got === null ? '' : i === q.ok ? ' ok' : i === got ? ' bad' : ''}" data-opt="${i}"${got === null ? '' : ' disabled'}>${esc(o)}</button>`).join('');
}
function renderRace(t) {
  const r = t.race, got = S.pick.race, m = Math.round(S.p * LEN);
  lab.setReadout(got === null ? '?' : `${m} ${esc(t.unit)}`, got === null ? '' : `/ ${LEN} ${t.unit}`, S.fin ? '🏁' : '', ACC.race[0]);
  if (got === null) lab.setState({ emo: '🤔', title: r.q, lead: t.pick, body: '', extra: '' });
  else if (S.fin) lab.setState({ emo: '🏁', title: r.fin, lead: r.finLead, body: '', extra: '' });
  else if (S.p > 0 || S.v > 0) lab.setState({ emo: '🏃', title: r.go, lead: r.goLead, body: '', extra: '' });
  else lab.setState({ emo: got === r.ok ? '✅' : '🤔', title: got === r.ok ? t.right : t.wrong, lead: r.lead, body: '', extra: '' });
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  const [ac, gl] = ACC[sec || v]; lab.setGlow(gl);
  $('oSec').innerHTML = ['flame', 'rings'].map((k, i) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${i ? '💍' : '🔥'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('oAsk').hidden = !!sec || v === 'now'; $('oTap').hidden = !!sec || v !== 'race' || S.pick.race === null || S.fin;
  $('oSort').hidden = !!sec || v !== 'now' || S.i >= SP.length;
  $('oAgain').hidden = !!sec || !((v === 'race' && S.fin) || (v === 'prize' && S.pick.prize !== null) || (v === 'now' && S.i >= SP.length));
  $('oTap').textContent = t.race.tap; $('oAgain').textContent = v === 'race' ? t.race.runAgain : t.again;
  if (sec) {
    const s = t[sec === 'flame' ? 'fl' : 'rg'];
    lab.setReadout(sec === 'flame' ? '🔥' : '5', '', '', ac); lab.setState({ emo: sec === 'flame' ? '🔥' : '💍', title: s[0], lead: s[1], body: '', extra: '' }); facts(t, sec === 'flame' ? 1 : 2); return;
  }
  if (v === 'race') { renderOpts(t, 'race'); renderRace(t); facts(t, 0); }
  else if (v === 'prize') {
    renderOpts(t, 'prize'); const got = S.pick.prize, p = t.prize;
    lab.setReadout(got === null ? '?' : '🌿', '', '', ac);
    lab.setState(got === null ? { emo: '🤔', title: p.q, lead: t.pick, body: '', extra: '' } : { emo: got === p.ok ? '✅' : '🤔', title: got === p.ok ? t.right : t.wrong, lead: p.lead, body: '', extra: '' });
    facts(t, 1);
  } else {
    const n = t.now, done = S.i >= SP.length, k = S.res.filter((x) => x.ok).length;
    $('oSort').children[0].textContent = '🏛️ ' + n.bins[0]; $('oSort').children[1].textContent = '🆕 ' + n.bins[1];
    lab.setReadout(`${S.i}/${SP.length}`, '', '', ac);
    lab.setState(done ? { emo: '🏆', title: n.end(k), lead: n.endLead, body: '', extra: '' } : { emo: SP[S.i][0], title: n.sp[S.i], lead: n.q, body: S.last, extra: '' });
    facts(t, 2);
  }
}
render();
