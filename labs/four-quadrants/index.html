// --- logic: corners ------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const haveTried = (x, y) => S.pts.some((p) => p.x === x && p.y === y);

  const [x, y] = PT[S.pi % PT.length]; S.pi++;
  S.ask = { x, y }; S.res = null; S.cs = 'ask'; sfx.click(); render();
}
function answer(q) {

  S.res = { ok, q: cq, guess: q, done: false }; S.cs = 'reveal'; render();

    S.pts.push({ x, y, q: cq }); S.cur = { x, y }; S.res.done = true; if (ok) S.right++;

// --- logic: mirror -------------------------------------------------------------------------------------------

// --- logic: route --------------------------------------------------------------------------------------------

// --- input ---------------------------------------------------------------------------------------------------
const cv = $('cv');
cv.addEventListener('pointerdown', (ev) => {
  const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;

    let best = -1, bd = 1e9;
    (G.rows || []).forEach((rw) => { const d = Math.hypot(px - rw.px, py - rw.py); if (d < bd) { bd = d; best = rw.i; } if (px >= rw.x0 && px <= rw.x1 && py >= rw.y0 && py <= rw.y1) { bd = -1; best = rw.i; } });
    if (best >= 0 && bd < 30) { S.city = best; sfx.tick(); render(); }
    return;
  }
  if (S.sec || S.ruleOpen) return;
  const wx = (px - G.cx) / G.u, wy = (G.cy - py) / G.u;

      m.q.opts.forEach((o, i) => {
        const cls = done ? (i === m.q.ok ? 'ok' : i === m.picked ? 'no' : 'dim') : '';
        opts.push(`<button class="fq-opt two ${cls}" data-act="mopt" data-i="${i}" ${done ? 'disabled' : ''}>${esc(co(o[0], o[1]))}</button>`);
      });
    } else q = t.mPick;
    ['y', 'x'].forEach((k, i) => acts.push(`<button class="btn ghost fq-btn" data-act="axis" data-k="${k}" ${asking ? 'disabled' : ''}>${esc(t.axisBtn[i])}</button>`));
    if (asking) { val = co(m.q.p[0], m.q.p[1]); sub = t.axes[m.axis === 'y' ? 0 : 1]; st = { emo: '🪞', title: t.guessT, lead: fill(t.qMirror, { x: ns(m.q.p[0]), y: ns(m.q.p[1]), axis: t.axes[m.axis === 'y' ? 0 : 1] }), body: '' }; }
    else if (done) {
      const im = mirrorOf(m.q.p, m.axis), ok = m.picked === m.q.ok; val = `${co(m.q.p[0], m.q.p[1])} → ${co(im[0], im[1])}`; pill = ok ? t.right : t.wrong; col = ok ? good : bad;
      st = { emo: '🪞', title: t.mDoneT, lead: t.mDoneL, body: '' };
    } else { val = co('x', 'y'); st = { emo: '🪞', title: t.views.mirror, lead: t.mLead, body: t.mBody }; }
  } else {
    const p = PUZ[R.i], end = puzEnd(p), done = R.phase === 'done';
    q = R.phase === 'ask' ? t.rQ : '';
    const note = fill(t.note, { s: co(p.s[0], p.s[1]), a: p.a, d1: t.dirs[p.d1], b: p.b, d2: t.dirs[p.d2] });
    val = fill(t.puz, { i: R.i + 1, n: PUZ.length });
    if (done) {
      sub = fill(t.landed, { p: co(end[0], end[1]) }); pill = R.res.ok ? t.right : t.wrong; col = R.res.ok ? good : bad;
      st = { emo: '🏴‍☠️', title: t.rDoneT, lead: `x: ${ns(p.s[0])} → ${ns(end[0])} · y: ${ns(p.s[1])} → ${ns(end[1])}`, body: t.rDoneB };
      acts.push(`<button class="btn fq-btn one" data-act="puz">${esc(t.nextPuz)}</button>`);
    } else {
      st = { emo: '🏴‍☠️', title: t.rAskT, lead: note, body: R.phase === 'ask' ? t.rBody : '' };
      acts.push(`<button class="btn fq-btn one" data-act="sail" ${R.phase !== 'ask' || !R.guess ? 'disabled' : ''}>⛵ ${esc(t.sail)}</button>`);
    }
  }
  $('fqQ').textContent = q; $('fqOpts').innerHTML = opts.join(''); $('fqActs').innerHTML = acts.join('');
  $('fqSec').innerHTML = [['map', '🌍', t.secrets.a[0]], ['dbl', '🪞', t.secrets.b[0]]].map(([k, emo, name]) =>
    `<button class="fq-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(name)}` : '🔒 ???'}</button>`).join('');
  $('fqTbl').innerHTML = sec ? '' : tbl;
  // rule card
  const showRule = S.ruleOpen && !sec && v === 'corners';
  ruleEl.style.display = showRule ? '' : 'none';
  if (showRule) {
    ruleEl.innerHTML = `<button class="fq-x" type="button" aria-label="×">×</button><h3>${esc(t.ruleTitle)}</h3><p>${esc(t.rule)}</p><div class="fq-quad">${[2, 1, 3, 4].map((k) =>
      `<div class="fq-qc" style="border-color:${rgba(QC[k], .6)};background:${rgba(QC[k], .14)}"><b style="color:${QC[k]}">${ROM[k]}</b><span>${esc(quadSign(k))}</span></div>`).join('')}</div>`;
  }
  lab.setReadout(esc(val), sub, pill, col);
  lab.setState(st);
  lab.setFacts(t.facts[v === 'corners' ? 'corners' : v]);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  G = { ...G, w, h, u: Math.min(w, h) / 13.6, cx: w / 2, cy: h / 2 }; update(dt); scene(c, w, h, time);
});
render();
</script>
</body>
