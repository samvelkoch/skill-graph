    const g = c.createLinearGradient(0, 60, 0, 66); g.addColorStop(0, '#c99560'); g.addColorStop(1, '#a8743f'); rr(c, 8, 60, 84, 6, 2); c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(60,30,10,.5)'; c.lineWidth = .8; c.stroke();
    rr(c, 42, 48, 18, 13, 4); const pg = c.createLinearGradient(42, 0, 60, 0); pg.addColorStop(0, '#5cc0bb'); pg.addColorStop(1, '#3a9894'); c.fillStyle = pg; c.fill(); c.strokeStyle = 'rgba(30,60,60,.6)'; c.lineWidth = .9; c.stroke();
    c.strokeStyle = '#e5484d'; c.lineWidth = 2; c.beginPath(); c.moveTo(70, 59); c.lineTo(78, 52); c.stroke();
  }
}
function scene(c, id, better) {
  if (id === 1) sceneCut(c, false); else if (id === 4) sceneCut(c, !better);
  else if (id === 2) sceneWalk(c, !better); else if (id === 3) sceneWalk(c, false);
  else if (id === 5) sceneHand(c); else sceneEdge(c, better);
}
function drawSafe(c, w, h, t) {
  const pad = 10, gap = 8, cw = (w - 2 * pad - 2 * gap) / 3, ch = Math.min(cw * 1.12, (h - 2 * pad - gap) / 2), top = (h - (2 * ch + gap)) / 2;
  cells = [];
  for (let i = 0; i < 6; i++) {
    const x = pad + (i % 3) * (cw + gap), y = top + (i < 3 ? 0 : 1) * (ch + gap), id = SAFE_ORDER[i], a = S.ans[i];
    cells.push({ x, y, w: cw, h: ch });
    c.save(); c.shadowColor = 'rgba(20,8,0,.45)'; c.shadowBlur = 10 * D(); c.shadowOffsetY = 4 * D(); rr(c, x, y, cw, ch, 14); c.fillStyle = '#f4ead6'; c.fill(); c.restore();
    c.save(); rr(c, x, y, cw, ch, 14); c.clip();
    const bg = c.createLinearGradient(0, y, 0, y + ch); bg.addColorStop(0, '#fcf5e6'); bg.addColorStop(1, '#eadcc0'); c.fillStyle = bg; c.fillRect(x, y, cw, ch);
    c.translate(x, y); const k = cw / 100; c.scale(k, k); c.translate(0, 6);
    c.fillStyle = '#d9c39b'; c.fillRect(0, 90, 100, 30);
    const e = a === null ? 0 : eio((t - S.revAt[i]) / .6), isSafe = SAFE_OK[id], fix = !isSafe;
    if (a !== null && fix) {

    } else scene(c, id, false);

      if (isSafe) {
        const r = 11 * eob(e * 1.2); circ(c, x + cw - 15, y + 15, r, '#2fbf71', '#fff', 2);
        c.save(); c.strokeStyle = '#fff'; c.lineWidth = 2.6; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(x + cw - 20, y + 15); c.lineTo(x + cw - 16, y + 19.5); c.lineTo(x + cw - 9.5, y + 11); c.stroke(); c.restore();
      } else if (e > .5) pillAt(c, T[lang].saf.better, x + cw / 2, y + ch - 14, w, h, { border: '#3ddc97' });
    }
    if (i === S.sel) { c.save(); rr(c, x - 1, y - 1, cw + 2, ch + 2, 15); c.lineWidth = 3; c.strokeStyle = `rgba(255,255,255,${(.75 + .25 * Math.sin(t * 5)).toFixed(2)})`; c.stroke(); c.restore(); }
  }
}

// --- secrets: elbows and knees, sticky notes ---------------------------------------------------------------------
function capsule(c, x, y, ang, len, wd, fill1, fill2, card) {
  c.save(); c.translate(x, y); c.rotate(-ang);
  const path = () => rr(c, -wd / 2, -wd / 2, wd, len + wd, wd / 2);
  if (card) piece(c, path, fill1, fill2, [-wd / 2, -wd / 2, wd / 2, len + wd / 2], { dy: 3, blur: 6, lw: 1.4 });
  else {
    const g = c.createLinearGradient(-wd / 2, 0, wd / 2, 0); g.addColorStop(0, shade(fill1, .25)); g.addColorStop(1, shade(fill2, -.1));
    path(); c.fillStyle = g; c.fill(); c.lineWidth = 1.2; c.strokeStyle = 'rgba(60,30,20,.55)'; c.stroke();
  }
  c.restore();
}
function drawElbow(c, w, h, t) {
  const s = Math.min(w / 320, h / 330) * .95, ox = w / 2, oy = h / 2 + 14 * s, labels = [];
  const bend = (S.touched ? S.bend : S.bend + 26 * Math.sin(t * 2.2)) * Math.PI / 180, leg = bend * .8;
  c.save(); c.translate(ox, oy); c.scale(s, s);
  // a small card panel behind
  for (const pup of [true, false]) {
    const x = pup ? -78 : 78;
    if (pup) {
      pieceR(c, x - 20, -110, 40, 84, 12, '#74d3c3', '#3b9d92'); pieceR(c, x - 24, -152, 48, 40, 14, '#94e3d6', '#55bfae');
      rr(c, x - 17, -142, 34, 18, 8); c.fillStyle = '#1f2a48'; c.fill(); circ(c, x - 7, -133, 4, '#fff'); circ(c, x + 7, -133, 4, '#fff'); circ(c, x - 6, -133, 2, '#1b2440'); circ(c, x + 8, -133, 2, '#1b2440');
    } else {
      torso(c, x - 20, -110, 40, 84, '#e8695f'); head(c, x, -128, { skin: SK.a, hair: '#5a3a22', dir: 1, pony: true });
      rr(c, x - 20, -36, 40, 20, 8); c.fillStyle = '#4c78c9'; c.fill();
    }
    // arm
    const ax = x, ay = -96, l1 = 52, l2 = 48, a1 = .12, a2 = a1 + bend;
    const ex = ax + l1 * Math.sin(a1), ey = ay + l1 * Math.cos(a1), hx = ex + l2 * Math.sin(a2), hy = ey + l2 * Math.cos(a2);
    capsule(c, ax, ay, a1, l1, 22, pup ? '#ffbd62' : '#e8695f', pup ? '#e8892f' : '#c24c43', pup);
    capsule(c, ex, ey, a2, l2, 20, pup ? '#ffbd62' : '#f2c7a0', pup ? '#e8892f' : '#d9a173', pup);
    if (pup) piece(c, () => { c.beginPath(); c.arc(hx, hy, 12, 0, Math.PI * 2); }, '#ffe6a6', '#f3b947', [hx - 12, hy - 12, hx + 12, hy + 12], { dy: 2, blur: 4 }); else circ(c, hx, hy, 9, '#f2c7a0', 'rgba(60,30,20,.55)', 1.2);
    // leg
    const lx = x, ly = -28, m1 = 58, m2 = 54, b1 = .08, b2 = b1 - leg;
    const kx = lx + m1 * Math.sin(b1), ky = ly + m1 * Math.cos(b1), fx = kx + m2 * Math.sin(b2), fy = ky + m2 * Math.cos(b2);
    capsule(c, lx, ly, b1, m1, 24, pup ? '#f3b556' : '#4c78c9', pup ? '#d98b2b' : '#3a5da0', pup);
    capsule(c, kx, ky, b2, m2, 22, pup ? '#f3b556' : '#4c78c9', pup ? '#d98b2b' : '#3a5da0', pup);
    c.beginPath(); c.ellipse(fx + 8, fy + 2, 12, 6.5, -b2 + .0, 0, 6.283); c.fillStyle = pup ? '#e58d3d' : '#6b4a34'; c.fill(); c.lineWidth = 1.2; c.strokeStyle = 'rgba(45,25,10,.7)'; c.stroke();
    for (const [jx, jy] of [[ex, ey], [kx, ky]]) {
      if (pup) {
        const g = c.createRadialGradient(jx - 2, jy - 3, 1, jx, jy, 9); g.addColorStop(0, '#ffe9a0'); g.addColorStop(1, '#c9972a'); circ(c, jx, jy, 8.5, g, '#7d5a14', 1.4);
        c.strokeStyle = '#8a6418'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(jx - 4, jy); c.lineTo(jx + 4, jy); c.moveTo(jx, jy - 4); c.lineTo(jx, jy + 4); c.stroke();
      } else {
        c.setLineDash([3, 3]); circ(c, jx, jy, 13 + Math.sin(t * 4) * 1.5, null, 'rgba(255,230,120,.95)', 2); c.setLineDash([]);
      }
    }
    labels.push([T[lang].el[pup ? 'pup' : 'you'], x, 112]);
    if (!pup) { labels.push([T[lang].el.elbow, ex + 36, ey + 2]); labels.push([T[lang].el.knee, kx + 38, ky + 4]); }
  }
  c.restore();

}
const pCur = (t) => lerp(S.pFrom, S.pTo, eio((t - S.pAt) / .9));
function drawSticky(c, w, h, t) {
  const s = Math.min(w / 300, h / 300), ox = w / 2, oy = h / 2;
  const p = pCur(t);
  c.save(); c.translate(ox, oy); c.scale(s, s);
  pieceR(c, -125, -105, 250, 210, 16, '#ecce9a', '#c9a066', { dy: 8, blur: 18 });
  // two quiet notes already stuck
  for (const [x, y, col, rot] of [[-100, -88, '#8fd6a8', -.08], [58, 56, '#ff9fb5', .1]]) {
    c.save(); c.translate(x + 30, y + 30); c.rotate(rot); pieceR(c, -30, -30, 60, 60, 2, shade(col, .35), col, { dy: 2, blur: 4, tex: .25, lw: 1 }); c.restore();

  c.save(); c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0 + sz, y0); c.lineTo(x0 + sz, yb); c.lineTo(x0 + d, yb); c.lineTo(x0, yb - d); c.closePath(); c.clip();

    const fg = c.createLinearGradient(x0, yb, x0 + d, yb - d); fg.addColorStop(0, '#fff1a0'); fg.addColorStop(1, '#e3b92c'); c.fillStyle = fg; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(150,110,20,.55)'; c.stroke();

// --- loop ------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, t) => {
  drawTable(c, w, h);
  if (S.sec === 'el') drawElbow(c, w, h, t);
  else if (S.sec === 'st') drawSticky(c, w, h, t);
  else if (lab.view === 'puppet') drawPuppet(c, w, h, t);
  else if (lab.view === 'tower') drawTower(c, w, h, t);
  else drawSafe(c, w, h, t);
});

// --- render: controls, readout, state card, facts ------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  for (const [id, on] of [['jnPup', !sec && v === 'puppet'], ['jnTow', !sec && v === 'tower'], ['jnSafe', !sec && v === 'safe'], ['jnEl', sec === 'el'], ['jnSt', sec === 'st']]) $(id).style.display = on ? '' : 'none';
  const open = secret.unlocked();
  $('jnSec').innerHTML = [['el', '🦾'], ['st', '📝']].map(([k, e]) =>
    `<button class="chip jn-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec === 'el') renderEl(t); else if (sec === 'st') renderSt(t);
  else if (v === 'puppet') renderPup(t); else if (v === 'tower') renderTow(t); else renderSafe(t);
}
function renderPup(t) {
  const p = t.pup, [a, b] = S.j, both = !!(a && b), k = (a === 'pin' ? 1 : 0) + (b === 'pin' ? 1 : 0);
  lab.setGlow('rgba(240, 170, 80, .26)');
  $('pQ').textContent = p.q;
  $('pArms').innerHTML = [0, 1].map((i) => `<button class="jn-arm ${S.arm === i ? 'on' : ''}" data-arm="${i}"><span>${esc(p.arms[i])}</span><b>${S.j[i] ? esc(t.tools[S.j[i]]) : '—'}</b></button>`).join('');
  $('pTools').innerHTML = TOOLS.map((q) => `<button class="jn-tool ${S.j[S.arm] === q ? 'on' : ''} ${S.rev && k === 0 && q === 'pin' ? 'hint' : ''}" data-tool="${q}">${ICON[q]}<span>${esc(t.tools[q])}</span></button>`).join('');
  $('pWave').textContent = p.wave; $('pWave').disabled = !both; $('pNew').textContent = p.again;
  if (!S.rev) {
    lab.setReadout('?', p.subq, '', '#f0aa50');
    lab.setState({ emo: '🤔', title: p.q, lead: both ? p.ready : p.pick, body: '', extra: '' });
  } else {
    const r = k === 2 ? p.r2 : k === 1 ? p.r1 : p.r0, tape = a === 'tape' || b === 'tape';
    lab.setReadout(String(k), p.sub, '', '#f0aa50');
    lab.setState({ emo: k ? '✅' : '🧷', title: r[0], lead: r[1], body: [tape ? p.tapeNote : '', r[2]].filter(Boolean).join(' '), extra: '' });
  }

}
function renderTow(t) {
  const w = t.tow, cap = CAP[S.shape], n = S.books;
  lab.setGlow('rgba(210, 165, 100, .26)');
  $('tShapes').innerHTML = SHAPES.map((k) => `<button class="jn-shape ${S.shape === k ? 'on' : ''}" data-shape="${k}">${SICON[k]}<span>${esc(w.shapes[k])}</span></button>`).join('');
  $('tQ').textContent = w.q;
  $('tAns').innerHTML = n === 0
    ? `<button class="jn-big" data-g="yes">${esc(w.yes)}</button><button class="jn-big" data-g="no">${esc(w.no)}</button>`
    : `<button class="jn-big go" data-act="more" ${S.settled && !S.fail && n < 5 ? '' : 'disabled'}>${esc(w.more)}</button><button class="jn-big" data-act="retry">${esc(w.retry)}</button>`;
  if (n === 0 || !S.settled) {
    lab.setReadout('?', w.sub(2), '', '#d2a566');
    lab.setState(n === 0 ? { emo: '🤔', title: w.q, lead: w.lead0, body: '', extra: '' } : { emo: '📚', title: w.wait, lead: '', body: '', extra: '' });
  } else {
    const held = S.fail ? cap : n;
    lab.setReadout(String(held), w.sub(held), '', '#d2a566');
    if (n === 1) {
      const ok = (cap >= 1) === (S.guess === 'yes');
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? w.hit : w.miss, lead: w.out[S.shape], body: w.why[S.shape], extra: '' });
    } else if (S.fail) lab.setState({ emo: '💥', title: w.gaveT, lead: w.gave(n, cap), body: w.gaveB, extra: '' });
    else lab.setState({ emo: '🏗️', title: w.standT, lead: n === 5 ? w.top : w.stand(n), body: '', extra: '' });
  }
  lab.setFacts(t.facts.tow);
}
function renderSafe(t) {
  const s = t.saf, i = S.sel, id = SAFE_ORDER[i], a = S.ans[i], done = S.ans.filter((x) => x !== null).length, all = done === 6;
  lab.setGlow('rgba(120, 190, 140, .24)');
  $('sQ').textContent = s.q;
  $('sAns').innerHTML = all ? `<button class="jn-big go" data-act="sagain">${esc(s.again)}</button>`
    : `<button class="jn-big" data-sa="safe" ${a !== null ? 'disabled' : ''}>${esc(s.yes)}</button><button class="jn-big" data-sa="unsafe" ${a !== null ? 'disabled' : ''}>${esc(s.no)}</button>`;
  lab.setReadout(`${done}/6`, s.sub, '', '#78be8c');
  if (all && S.endView) lab.setState({ emo: '🏅', title: s.endT, lead: s.endL(S.ans.filter((x, k) => (x === 'safe') === SAFE_OK[SAFE_ORDER[k]]).length), body: s.endB, extra: '' });
  else if (a === null) lab.setState({ emo: '🤔', title: s.q, lead: s.cap[id], body: s.tap, extra: '' });
  else {
    const ok = (a === 'safe') === SAFE_OK[id];
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? s.hit : s.miss, lead: s.why[id], body: s.fix[id] ? `${s.better}: ${s.fix[id]}` : '', extra: '' });
  }

}
function renderEl(t) {
  const e = t.el;
  lab.setGlow('rgba(240, 170, 80, .26)');
  $('eQ').textContent = e.bend;
  if (+$('eSl').value !== S.bend) $('eSl').value = S.bend;
  lab.setReadout(`${S.bend}°`, e.sub, '', '#f0aa50');
  lab.setState({ emo: '🦾', title: e.title, lead: e.lead, body: e.body, extra: '' });
  lab.setFacts([]);
}
function renderSt(t) {
  const e = t.st;

  $('stB').textContent = S.pTo === 0 ? e.peel : e.stick;
  lab.setReadout(String(S.stuckN), e.sub(S.stuckN), '', '#f5c933');
  lab.setState({ emo: '📝', title: e.title, lead: e.lead, body: e.body, extra: `<div style="font-size:11px;color:var(--faint)">${esc(e.src)}</div>` });
  lab.setFacts([]);
}
render();
