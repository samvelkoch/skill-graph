    ss.forEach((s, si) => s.dots.forEach((d, i) => {
      if (!d.on && tr >= TJ.t0 + i * TJ.gap + TJ.fl) {

  }
  ss.forEach((s, si) => {
    const plot = g.plots[si];
    for (const d of s.dots) {
      if (d.tw) {
        const u = c01((tm - d.tw.t0) / d.tw.dur); d.v = d.tw.from + (d.tw.to - d.tw.from) * eio(u);
        if (u >= 1) { d.v = d.tw.to; d.tw = null; splash(g.X(d.v), k === 'shape' ? 0 : laneCY(g, si, d.i)); afterChange(); }

}

function drawPit(ctx, g, ss, tm) {

  ctx.fillStyle = tg; ctx.strokeStyle = '#a67f1c'; ctx.lineWidth = 1; rr(ctx, x0, g.ruler - 4, x1 - x0, 8, 4); ctx.fill(); ctx.stroke();
  const last = g.lanes[g.lanes.length - 1], pitBottom = last.y + last.h;

    for (let n = 0; n < 70; n++) {

}

function drawPlot(ctx, g, s, si, plot, tm, t) {

    ctx.strokeStyle = 'rgba(210,220,250,.6)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x, plot.base); ctx.lineTo(x, plot.base + 5); ctx.stroke();
    pill(ctx, `${v}`, x, plot.base + 19, { size: 12, pad: 9, bg: 'rgba(8,10,18,.6)', stroke: 'rgba(255,255,255,.06)' });
  }
  ctx.strokeStyle = 'rgba(210,220,250,.65)'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x0, plot.base); ctx.lineTo(x1, plot.base); ctx.stroke();

      pill(ctx, `${fmtT(v)} ${unit}`, x, plot.top + 38, { size: 12, pad: 9, stroke: c });

  const order = s.dots.filter((d) => d.on).sort((a, b) => a.y - b.y);

    ball(ctx, x, d.y - (isDrag ? 5 : 0), g.r * (isDrag ? 1.3 : 1), s.color, { ring: ring || (d === odd ? '#fff' : null), glow: ring });
    if (isDrag) pill(ctx, valS(d.v, ax), x, d.y - g.r * 2.4 - 10, { size: 12 });
  }

        ctx.fillStyle = COL.mode; ctx.strokeStyle = '#b89a1a'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(mx, my + 6); ctx.lineTo(mx + 6, my); ctx.lineTo(mx, my - 6); ctx.lineTo(mx - 6, my); ctx.closePath(); ctx.fill(); ctx.stroke();
      }

    ctx.beginPath(); ctx.moveTo(s.mx, plot.top + (showTh ? 52 : 24)); ctx.lineTo(s.mx, plot.base); ctx.stroke(); ctx.restore();
    pill(ctx, `${t.mean} ${valS(st.mean, ax)}`, s.mx, plot.top + (showTh ? 62 : 12), { stroke: COL.mean, fg: '#fff3dc' });

    // range bracket

    pill(ctx, `${t.range} ${valS(st.range, ax, true)}`, (bx1 + bx2) / 2, by, { stroke: COL.range, fg: '#e6dcff' });

}

const posOf = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
cv.addEventListener('pointerdown', (e) => {

});

function designOk() {
  const st = stats(vals(V.design[0])), e = (a, b) => Math.abs(a - b) < 0.003;
  return S.tgt === 0 ? e(st.mean, 5) && st.range < 0.003 : S.tgt === 1 ? e(st.mean, 5) && e(st.range, 4) : e(st.median, 4) && e(st.mean, 5);
}
function afterChange() {
  const k = ctxKey();
  if (k === 'outlier' && O.phase === 'test') {
    const s = V.outlier[0], moved = Math.max(...s.dots.map((d) => Math.abs(d.v - s.orig[d.i])));
    if (moved >= 1.5) {
      const a = stats(vals(s)), b = stats(s.orig), dm = Math.abs(a.mean - b.mean), dd = Math.abs(a.median - b.median);
      const truth = dm > dd + 0.03 ? 'mean' : dd > dm + 0.03 ? 'median' : 'same';
      if (truth !== 'same') { O.phase = 'done'; O.truth = truth; O.ok = O.guess === truth; (O.ok ? sfx.good : sfx.bad)(); dirty = true; showStage(); }
    }
  }
  if (k === 'design') { const ok = designOk(); if (ok && !S.desOk) sfx.good(); S.desOk = ok; }
}

  if (k === 'same3') h += `<div class="chips"><button class="chip" data-act="reset">${esc(t.reset)}</button></div>`;
  if (k === 'design') h += `<div class="chips">${t.des.targets.map((n, i) => `<button class="chip ${i === S.tgt ? 'on' : ''}" data-act="tgt" data-i="${i}">🎯 ${esc(n)}</button>`).join('')}<button class="chip" data-act="reset">${esc(t.reset)}</button></div>`;
  const sc = (key, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-act="sec" data-k="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  h += `<div class="row2"${h ? '' : ' style="margin-top:0"'}><div class="chips">${sc('same3', '🎯')}${sc('design', '🛠️')}</div></div>`;
  if (h !== lastCtrl) { $('ctrlBody').innerHTML = h; lastCtrl = h; }

  // readout
  const base = k === 'outlier' && O.phase !== 'ask' ? stats(V.outlier[0].orig) : null;
  const cols = [['mean', COL.mean], ['median', COL.median], ['range', COL.range]];
  if (k === 'same3' || k === 'shape') cols.push(['mode', COL.mode]);
  const cellV = (st, c) => (c === 'mode' ? (st.mode === null ? esc(t.none) : valH(st.mode, ax)) : valH(c === 'range' ? st.range : st[c], ax, c === 'range'));
  const sign = (x) => (x > 0.0049 ? '+' : x < -0.0049 ? '−' : '±') + fmt(Math.abs(x), 2);
  const label = (c, col) => `<div class="h" style="color:${col}">${esc(t[c])}</div>`;
  let ro = '', pill_ = '';
  if (hid) ro = '?';
  else if (ss.length === 2) {
    ro = `<div class="sp-ro" style="grid-template-columns:auto repeat(3,1fr)"><span></span>${cols.map(([c, col]) => label(c, col)).join('')}` +
      ss.map((s) => { const st = stats(vals(s)); return `<span class="n" style="color:${s.color}">${esc(t.names[s.key])}</span>${cols.map(([c]) => `<div class="v">${cellV(st, c)}</div>`).join('')}`; }).join('') + '</div>';
  } else {
    const st = stats(vals(ss[0]));
    ro = `<div class="sp-ro" style="grid-template-columns:repeat(${cols.length},1fr)">${cols.map(([c, col]) => {
      const dl = base && c !== 'mode' ? `<div class="d">${esc(t.out.delta)} ${sign(st[c] - base[c])}</div>` : '';
      return `<div>${label(c, col)}<div class="v">${cellV(st, c)}</div>${dl}</div>`;
    }).join('')}</div>`;
    if (k === 'shape') pill_ = t.shp.shapes[SHAPES[S.set].ill];
    if (k === 'design' && S.desOk) pill_ = `✔ ${t.des.hit}`;
    if (k === 'same3') { const e = (a, b) => b !== null && Math.abs(a - b) < 0.005; if (e(st.mean, st.median) && e(st.median, st.mode)) pill_ = '✔ ' + t.mean + ' = ' + t.median + ' = ' + t.mode; }
  }
  lab.setReadout(ro, hid ? '' : t.rule, pill_, k === 'two' ? COL.anna : k === 'shape' ? COL.mean : k === 'design' ? COL.ok : COL.dot);

  // question card
  const opts = (arr, vals_) => `<div class="opts">${arr.map((o, i) => `<button data-a="${vals_ ? vals_[i] : i}">${esc(o)}</button>`).join('')}</div>`;
  let ask = null, st_ = null;
  if (k === 'two' && S.two.reveal === 0) {
    const A = t.two, step = S.two.step;
    if (step < 2) { ask = { pos: 'bot', html: `${step ? `<p>1 · ${esc(A.opts[S.two.a[0]])}</p>` : ''}<div class="q">${esc(step ? A.q2 : A.q1)}</div>${opts(A.opts)}` }; st_ = { emo: '🤔', title: step ? A.q2 : A.q1, lead: '', body: '' }; }
    else { ask = { pos: 'bot', html: `<p>1 · ${esc(A.opts[S.two.a[0]])}<br>2 · ${esc(A.opts[S.two.a[1]])}</p><div class="opts"><button data-go="1">${esc(A.go)} →</button></div>` }; st_ = { emo: '🎬', title: A.ready, lead: '', body: '' }; }
  } else if (k === 'two' && S.two.reveal === 1) st_ = { emo: '🏃', title: t.two.watch[0], lead: t.two.watch[1], body: '' };
  else if (k === 'two') {
    const mod = V.two.some((s) => s.dots.some((d) => d.v !== s.orig[d.i]));
    if (mod) st_ = { emo: '✋', title: t.two.own[0], lead: t.two.own[1], body: '' };
    else {
      const n = (S.two.a[0] === 1 ? 1 : 0) + (S.two.a[1] === 0 ? 1 : 0), sa = stats(ANNA), sb = stats(BEN);
      st_ = { emo: n === 2 ? '🏅' : '💡', title: n === 2 ? t.two.res.both : n === 1 ? t.two.res.one : t.two.res.none, lead: t.two.lead, body: t.two.body(valS(sa.mean, AXES.two), valS(sa.range, AXES.two, true), valS(sb.range, AXES.two, true)) };
    }
  } else if (k === 'outlier') {
    if (O.phase === 'ask') { ask = { pos: 'top', html: `<div class="q">${esc(t.out.q)}</div>${opts(t.out.opts, ['mean', 'median', 'same'])}` }; st_ = { emo: '🤔', title: t.out.q, lead: '', body: '' }; }
    else if (O.phase === 'test') st_ = { emo: '🧪', title: t.out.test[0], lead: t.out.test[1], body: '' };
    else {
      const a = stats(vals(V.outlier[0])), b = stats(V.outlier[0].orig);
      st_ = { emo: O.ok ? '🎉' : '💡', title: O.ok ? t.out.ok : t.out.no, lead: t.out.lead(valS(Math.abs(a.mean - b.mean), ax), valS(Math.abs(a.median - b.median), ax)), body: t.out.body };
    }
  } else if (k === 'shape') {
    const r = S.rev[S.set];
    if (!r) { ask = { pos: 'top', html: `<div class="q">${esc(t.shp.q)}</div>${opts(t.shp.opts, ['left', 'same', 'right'])}` }; st_ = { emo: '🤔', title: t.shp.q, lead: '', body: '' }; }
    else st_ = { emo: r.ok ? '🎉' : '💡', title: r.ok ? t.shp.ok : t.shp.no, lead: t.shp.shapes[SHAPES[S.set].ill], body: t.shp.expl[SHAPES[S.set].ill] };
  } else if (k === 'same3') {
    const st = stats(vals(V.same3[0])), e = (a, b) => b !== null && Math.abs(a - b) < 0.005, together = e(st.mean, st.median) && e(st.median, st.mode);
    const m = together ? t.s3.agree : t.s3.apart; st_ = { emo: together ? '🎯' : '↔️', title: m[0], lead: m[1], body: '' };
  } else if (k === 'design') st_ = { emo: S.desOk ? '✅' : '🛠️', title: t.des.targets[S.tgt], lead: S.desOk ? t.des.hit : t.des.todo, body: S.desOk ? t.des.tips[S.tgt] : '' };
  lab.setState({ ...st_, extra: '' });
  if (ask) { askEl.className = `sp-ask card ${ask.pos}`; askEl.innerHTML = ask.html; askEl.style.display = ''; } else askEl.style.display = 'none';
  lab.setFacts(t.facts[lab.view] || []);
}
render();
</script>
</body>
</html>
