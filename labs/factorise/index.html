    lab.setReadout(i.fits ? `${i.fl}(${i.br})` : '✗', i.fits ? t.rowsN(a.rows) : e, i.fits ? t.allUsed : t.leftN(i.leftN), i.fits ? '#3ddc97' : '#ff5d52');
    const ok = a.picks.join() === fit.join(), say = t.p1.say(a.picks, fit);
    // the verdict on the prediction sits in the state card while the child has not moved the rows
    lab.setState(i.fits ? { emo: ok ? '✅' : '🤔', title: `${ok ? t.rightV : t.notV} ${i.eq}`, lead: `${say} ${t.fitL(i.fl, i.br)}`, body: t.why(P.nb, P.ns), extra: '' }
      : { ...missState(t, P, a.rows, i), extra: '' });
  }
  $('s1').innerHTML = html;
}

function rend2(t) {
  const a = S.a2, P = PZ2[a.i], e = exprOf(P), g = gcd(P.nb, P.ns), more = g !== P.start;
  lab.setGlow('rgba(39, 165, 138, .26)');
  const r = a.ans ? a.rows : P.start, sc = sceneRows(P, r, true); scene = sc; const i = sc.i, i0 = info(P, P.start);
  let html;
  if (!a.ans) {
    html = `<div class="fx-q">${esc(t.p2.q(i0.fl, i0.br))}</div>
      <div class="fx-row"><button class="fx-b wide" data-act="ans2" data-v="done">${esc(t.p2.a[0])}</button><button class="fx-b wide" data-act="ans2" data-v="more">${esc(t.p2.a[1])}</button></div>`;
    lab.setReadout(`${i0.fl}(${i0.br})`, e, '', '#27a58a');
    const [ti, le] = t.p2.ask(e); lab.setState({ emo: '🎯', title: ti, lead: le, body: '', extra: '' });
  } else {
    html = `<div class="fx-row">${stepper(t, a.rows, 1, rmax(P))}<button class="fx-b" data-act="next2" style="margin-left:auto">${esc(t.next)}</button></div>`;
    lab.setReadout(i.fits ? `${i.fl}(${i.br})` : '✗', i.fits ? t.rowsN(a.rows) : e, i.fits ? t.allUsed : t.leftN(i.leftN), i.fits ? '#3ddc97' : '#ff5d52');
    if (a.rows !== g) lab.setState(i.fits ? { emo: '🧱', title: i.eq, lead: t.fitL(i.fl, i.br), body: t.why(P.nb, P.ns), extra: '' } : { ...missState(t, P, a.rows, i), extra: '' });
    else {
      const ig = info(P, g), ok = (a.ans === 'more') === more, hcf = t.p2.hcf(termsOf(P, { and: AND[lang] }), P.kind === 'Q' ? (g === 1 ? 'x' : `${g}x`) : g);
      lab.setState({ emo: ok ? '✅' : '🤔', title: `${ok ? t.rightV : t.notV} ${ig.eq}`, lead: more ? t.p2.more(ig.eq) : t.p2.done(ig.eq), body: hcf, extra: '' });
    }
  }
  $('s2').innerHTML = html;
}

function rend3(t) {
  const a = S.a3, P = PZ3[a.i], e = exprOf(P), ok3 = valid3(), done = a.guess !== null;
  lab.setGlow('rgba(230, 170, 42, .24)');
  for (const [id, k] of [['in-f', 'f'], ['in-p', 'p'], ['in-q', 'q']]) { const el = $(id), want = a[k] < 0 ? '' : String(a[k]); if (el.value !== want && document.activeElement !== el) el.value = want; el.disabled = done; }
  const y = ok3 ? `${a.f}(${lin(a.p, a.q)})` : '?';
  $('s3c').innerHTML = done ? '' : `<div class="fx-sub" style="margin:12px 0 0">${esc(t.p3.cap)}</div><div class="fx-cands">${cands3(P).map(([f, p, q], k) => `<button class="fx-b" data-act="cand" data-i="${k}">${f}(${lin(p, q)})</button>`).join('')}</div>`;
  if (!done) {
    $('s3b').innerHTML = `<div class="fx-q" style="margin-top:14px">${esc(t.p3.q)}</div><div class="fx-row"><button class="fx-b wide" data-act="ans3" data-v="yes"${ok3 ? '' : ' disabled'}>${esc(t.p3.a[0])}</button><button class="fx-b wide" data-act="ans3" data-v="no"${ok3 ? '' : ' disabled'}>${esc(t.p3.a[1])}</button></div>`;
    $('s3t').innerHTML = '';
    scene = { P, rows: 1, fit: false, bl: null, fl: '', opt: {}, eq: `${y} = ${e}?`, tone: null };
    lab.setReadout(y, e, '', '#e6aa2a');
    const [ti, le] = t.p3.ask(y, e); lab.setState({ emo: '🔎', title: ti, lead: le, body: '', extra: '' });
    return;
  }
  const eq = isEq3(), right = (a.guess === 'yes') === eq, ex = lin(a.f * a.p, a.f * a.q);
  scene = { P: { kind: 'L', nb: a.f * a.p, ns: a.f * a.q }, rows: a.f, fit: eq, bl: lin(a.p, a.q), fl: String(a.f), opt: { limB: P.nb, limS: P.ns, gB: Math.max(0, P.nb - a.f * a.p), gS: Math.max(0, P.ns - a.f * a.q) },
    eq: `${y} = ${ex} ${eq ? '=' : '≠'} ${e}`, tone: eq ? 'ok' : 'bad' };
  $('s3b').innerHTML = `<div class="fx-row"><button class="fx-b" data-act="redo3">${esc(t.p3.redo)}</button><button class="fx-b" data-act="next3" style="margin-left:auto">${esc(t.next)}</button></div>`;
  const rows = [1, 2, 5].map((x) => { const u = P.nb * x + P.ns, w = a.f * (a.p * x + a.q); return `<tr><td>${x}</td><td>${u}</td><td>${w}</td><td class="${u === w ? 'ok' : 'no'}">${u === w ? '✓' : '✗'}</td></tr>`; }).join('');
  $('s3t').innerHTML = `<table class="fx-tbl"><tr><th>${esc(t.p3.hdr[0])}</th><th>${esc(e)}</th><th>${esc(y)}</th><th></th></tr>${rows}</table>`;
  lab.setReadout(y, `= ${ex}`, eq ? t.p3.same : t.p3.diff, eq ? '#3ddc97' : '#ff5d52');
  lab.setState({ emo: right ? '✅' : '🤔', title: right ? t.rightV : t.notV, lead: t.p3.lead(y, ex, e, eq),
    body: eq ? '' : t.p3.body(P.nb, P.ns, a.f * a.p, a.f * a.q, t.tn.bar, t.tn.unit), extra: '' });
}

function rendSec(t) {
  const k = S.sec;
  if (k === 'neg') {
    const f = S.negF, r = Math.abs(f), neg = f < 0, sc = sceneRows(NEG0, r, true, neg ? { negF: true, P: { ...NEG0, neg: false } } : {}), i = sc.i;
    scene = sc; lab.setGlow('rgba(229, 80, 62, .24)');
    $('sec').innerHTML = `<div class="fx-row">${[2, -2, 4].map((n) => `<button class="fx-b${n === f ? ' on' : ''}" data-act="sf" data-f="${n}">${n < 0 ? '−' : ''}${Math.abs(n)}</button>`).join('')}</div>`;
    lab.setReadout(i.fits ? `${i.fl}(${i.br})` : '✗', i.fits ? t.rowsN(r) : exprOf(NEG0), i.fits ? t.allUsed : t.leftN(i.leftN), i.fits ? '#3ddc97' : '#ff5d52');
    lab.setState(i.fits ? { emo: '➖', title: i.eq, lead: neg ? t.neg.lm : t.neg.l2, body: '', extra: '' } : { ...missState(t, NEG0, r, i), extra: '' });
  } else {
    const x = S.xv, a = 6 * x + 9, L = 2 * x + 3, g = t.gd.side;
    scene = { P: { ...GARDEN, X: x }, rows: 3, fit: false, bl: `${L} ${g}`, fl: `3 ${g}`, flRed: false, opt: {}, eq: `3 × ${L} = ${a} ${g}²`, tone: 'ok' };
    lab.setGlow('rgba(124, 214, 107, .24)');
    $('sec').innerHTML = `<div class="fx-xv"><b>x = ${x} ${esc(g)}</b><input type="range" id="xv" min="1" max="8" step="1" value="${x}" aria-label="x"></div>`;
    lab.setReadout(`${a} ${esc(g)}²`, `3(2x + 3)`, '', '#7cd66b');
    lab.setState({ emo: '🌷', title: t.gd.t(x, a), lead: t.gd.l(x), body: '', extra: '' });
  }
}
render();
</script>
