  }
  if (act === 'ice') { S.ice = b.dataset.k; sfx.click(); render(); }
});
$('sfSlider').addEventListener('input', (ev) => {
  if (S.anim) { ev.target.value = S.shape; return; }
  S.shape = +ev.target.value; S.sel = 'clay'; S.guess = null; S.phase = 'guess'; S.verdict = null; clearTub(); sfx.tick(); render();
});
ruleEl.addEventListener('click', () => { S.ruleOpen = false; sfx.click(); render(); });

function resetPlay() {
  S.sel = lab.view === 'shape' ? 'clay' : null; S.guess = null; S.phase = lab.view === 'shape' ? 'guess' : 'pick'; S.tub = null; S.tubOut = null; S.anim = null; S.parts = []; S.rips = []; S.verdict = null; S.drag = null;
}
function changeView() { resetPlay(); S.sec = null; S.ruleOpen = false; render(); }
resetPlay();

// --- html side: thumbnails, table, rule card, readout, state card --------------------------------------------
function paintThumbs(root) {
  root.querySelectorAll('canvas[data-o]').forEach((cvs) => {
    const W = +cvs.dataset.w || 40, Hh = +cvs.dataset.h || 32, d = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = W * d; cvs.height = Hh * d; cvs.style.width = `${W}px`; cvs.style.height = `${Hh}px`;
    const c = cvs.getContext('2d'); c.scale(d, d);
    const id = cvs.dataset.o, k = +cvs.dataset.k || 0, [dw, dh] = dimsOf(id, k), sc = Math.min((W - 6) / dw, (Hh - 6) / dh);
    drawObj(c, id, W / 2, Hh / 2, sc, { k });
  });
}
const thumb = (id, k, W = 40, H = 32, label = '') => `<canvas class="sf-th" data-o="${id}" data-k="${k}" data-w="${W}" data-h="${H}" role="img" aria-label="${esc(label)}"></canvas>`;
function nameOf(t, r) { return r.id === 'clay' ? t.shapes[r.k] : t.objs[r.id] ?? t.balls[r.id]; }
function tableHTML(t, v) {
  const rows = S.rec[v]; if (!rows.length) return '';
  return `<table class="sf-table"><thead><tr>${t.head.map((x) => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) =>
    `<tr><td>${thumb(r.id, r.k, 44, 34, nameOf(t, r))}</td><td>${ICON_HEAD[r.guess]} ${esc(t.pads[r.guess])}</td><td>${r.res === 'float' ? esc(t.floated) : esc(t.sank)}</td>
    <td class="${r.ok ? 'ok' : 'sur'}">${r.ok ? '✓ ' + esc(t.match) : '❗ ' + esc(t.surpriseRow)}</td></tr>`).join('')}</tbody></table>`;
}
function render() {
  const t = T[lang], v = lab.view, rec = S.rec[v], sec = S.sec;
  document.body.dataset.v = v;
  // controls
  $('sfMain').hidden = !!sec; $('sfSaltBox').hidden = sec !== 'salt'; $('sfIceBox').hidden = sec !== 'ice';
  $('sfQ').textContent = v === 'shape' ? t.qShape : S.phase === 'pick' ? t.pick : '';
  $('sfShapeBox').hidden = v !== 'shape'; $('sfSlider').value = S.shape; $('sfSlider').disabled = !!S.anim; $('sfSlider').setAttribute('aria-label', t.views.shape);
  $('sfE0').textContent = t.shapes[0]; $('sfE1').textContent = t.shapes[4];
  $('sfDrop').textContent = t.drop; $('sfDrop').disabled = S.phase !== 'ready';
  const minRule = { test: 3, same: 1, shape: 2 }[v];
  $('sfRuleB').textContent = t.showRule; $('sfRuleB').hidden = rec.length < minRule; $('sfRuleB').classList.toggle('on', S.ruleOpen);
  $('sfSalt').textContent = '🥄 ' + t.saltBtn; $('sfSalt').disabled = S.spoons >= 6;
  document.querySelectorAll('[data-act=ice]').forEach((b) => b.classList.toggle('on', b.dataset.k === S.ice));
  const open = secret.unlocked();
  $('sfSecChips').innerHTML = [['salt', '🥚', t.secrets.salt[0]], ['ice', '🧊', t.secrets.ice[0]]].map(([k, emo, name]) =>
    `<button class="sf-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(name)}` : '🔒 ???'}</button>`).join('');
  $('sfTableBox').innerHTML = sec ? '' : tableHTML(t, v); paintThumbs($('sfTableBox'));
  // rule card
  const showRule = S.ruleOpen && !sec;
  ruleEl.style.display = showRule ? '' : 'none';
  if (showRule) {
    ruleEl.innerHTML = `<button class="sf-x" type="button" aria-label="×">×</button><h3>${esc(t.ruleTitle)}</h3><p>${esc(t.rule[v])}</p>${v === 'test' ? `<div class="sf-rows">
      <div class="sf-rr">${thumb('log', 0, 66, 40)}${thumb('candle', 0, 58, 40)}<span>${esc(t.ruleRows[0])}</span></div>
      <div class="sf-rr">${thumb('nail', 0, 66, 40)}${thumb('coin', 0, 58, 40)}<span>${esc(t.ruleRows[1])}</span></div></div>` : ''}`;
    paintThumbs(ruleEl);
  }
  // readout, state card, facts
  const pillTxt = S.verdict === 'ok' ? t.right : S.verdict === 'sur' ? t.surprise : '';
  const col = S.verdict === 'ok' ? '#2fbf84' : S.verdict === 'sur' ? '#e59a1f' : '#4ea8ff';
  if (sec === 'salt') { lab.setReadout(`🥄 ${S.spoons} / 6`, '', '', col); lab.setState({ emo: '🥚', title: t.secrets.salt[0], lead: t.secrets.salt[1], body: S.spoons >= 5 ? t.saltDone : '' }); }
  else if (sec === 'ice') { lab.setReadout('9 / 10', '', '', col); lab.setState({ emo: '🧊', title: t.secrets.ice[0], lead: t.secrets.ice[1], body: t.iceDone }); }
  else {
    lab.setReadout(v === 'shape' ? esc(t.shapes[S.shape]) : esc(t.tested(rec.length, MAXN[v])), '', pillTxt, col);
    lab.setState({ emo: { test: '🛁', same: '⚪', shape: '🥣' }[v], title: t.views[v], lead: t.state[v][0], body: t.state[v][1] });
  }
  lab.setFacts(t.facts);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  G = geo(w, h); update(dt, time);
  if (S.sec === 'salt' && S._egg) { const e = S._egg, tg = e.up ? e.floatY : e.restY; S.eggY = S.eggY === null ? e.restY : S.eggY + (tg - S.eggY) * (1 - Math.exp(-dt * (e.up ? 2.4 : 8))); }
  scene(c, time);
});
render();
</script>
</body>
</html>
