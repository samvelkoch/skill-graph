}

  const v = lab.view;
  c.save(); rr(c, 0, 0, w, h, 18); c.clip();
  if (v === 'spread' && !S.sec) drawSpread(c, w, h, reg, dt, time);
  else if (v === 'spread') { if (S.sec === 'pass') drawPass(c, w, h, reg, dt, time); else drawPin(c, w, h, reg, dt, time); }
  else if (v === 'share') drawShare(c, w, h, reg, dt, time);
  else drawWhat(c, w, h, reg, dt, time);
  const vg = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .35, w / 2, h / 2, Math.max(w, h) * .75); vg.addColorStop(0, 'rgba(21,26,43,0)'); vg.addColorStop(1, 'rgba(21,26,43,.45)');
  c.fillStyle = vg; c.fillRect(0, 0, w, h);
  c.restore();
  rr(c, .5, .5, w - 1, h - 1, 18); c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.stroke();
});

// drag a card onto a tray, or tap a tray
const cvEl = $('cv');
const pt = (ev) => { const r = cvEl.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
cvEl.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'share' || S.sh.phase !== 'ask' || !S.sh.geo) return;
  const p = pt(ev), sh = S.sh, g = sh.geo;
  const tray = shHit(p.x, p.y); if (tray >= 0) { shPick(tray); return; }
  if (sh.pos && Math.abs(p.x - sh.pos.x) < g.cw / 2 + 6 && Math.abs(p.y - sh.pos.y) < g.ch / 2 + 6) {
    sh.drag = { dx: p.x - sh.pos.x, dy: p.y - sh.pos.y, x: sh.pos.x, y: sh.pos.y, sx: p.x, sy: p.y, moved: false };
    try { cvEl.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
  }
});
cvEl.addEventListener('pointermove', (ev) => {
  const sh = S.sh; if (lab.view !== 'share' || !sh.drag) return;
  const p = pt(ev); sh.drag.x = p.x - sh.drag.dx; sh.drag.y = p.y - sh.drag.dy;
  if (Math.hypot(p.x - sh.drag.sx, p.y - sh.drag.sy) > 8) sh.drag.moved = true;
  sh.hover = shHit(p.x, p.y);
});
const endDrag = (ev) => {
  const sh = S.sh; if (lab.view !== 'share' || !sh.drag) return;
  const p = pt(ev), moved = sh.drag.moved, tray = shHit(p.x, p.y);
  if (moved && tray >= 0) shPick(tray); else { sh.drag = null; sh.hover = -1; }
};
cvEl.addEventListener('pointerup', endDrag);
cvEl.addEventListener('pointercancel', () => { S.sh.drag = null; S.sh.hover = -1; });

// panels over the stage: answers, "next"
function onPanel(ev) {
  const b = ev.target.closest('button[data-act]'); if (!b) return;
  const a = b.dataset.act, j = +b.dataset.j, sp = S.sp;
  if (a === 'a1') { sp.pick1 = j; sp.phase = 'w1'; startRun(3, 3, true); sfx.click(); render(); showStage(); }
  else if (a === 'n1') { sp.phase = 'q2'; sfx.click(); render(); }
  else if (a === 'a2') { sp.pick2 = j; sp.phase = 'w2'; S.sim.del = { t0: S.sim.t }; const e = S.sim.nodes[S.sim.extraId]; e.t0 = S.sim.t + 1.5; e.land = e.t0 + e.dur; sfx.click(); render(); showStage(); }
  else if (a === 'n2') { sp.phase = 'free'; S.sim = null; S.roKey = ''; sfx.click(); render(); }
  else if (a === 'sn') shNext();
  else if (a === 'wp') whPick(j);
  else if (a === 'wn') whNext();
}
askEl.addEventListener('click', onPanel); botEl.addEventListener('click', onPanel);

// controls under the stage
const resetFree = () => { S.sim = null; S.roKey = ''; };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, sp = S.sp;
  if (a === 'sdec' || a === 'sinc') { sp.steps = clamp(sp.steps + (a === 'sinc' ? 1 : -1), 1, 4); resetFree(); sfx.tick(); }
  else if (a === 'send') { startRun(sp.each, sp.steps, false); sfx.click(); showStage(); }
  else if (a === 'again') { sp.phase = 'q1'; sp.pick1 = null; sp.pick2 = null; S.sim = null; S.sec = null; S.roKey = ''; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null; else { S.sec = k; if (k === 'pass') newPass(); else newPin(); }
    S.roKey = ''; sfx.click(); showStage();
  } else if (a === 'dice') { const p = S.pass; if (p) { p.list[2] = pickWords(); p.step = 2; p.typed = 0; p.acc = 0; p.glintDone = false; sfx.click(); } }
  else if (a === 'loc') { const p = S.pin; if (p && p.ready) { p.locOn = !p.locOn; sfx.click(); } }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'each') return;
  S.sp.each = clamp(Math.round(+ev.target.value), 1, 5); resetFree(); render();
});

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('olSpread').style.display = v === 'spread' ? '' : 'none';
  $('ctrl').style.display = '';
  if (v === 'spread') renderSpread(t); else if (v === 'share') renderShare(t); else renderWhat(t);
  syncReadout(true);
}
render();
</script>
</body>
