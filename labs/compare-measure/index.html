function softShadow(c, x, y, rx, ry, a = .3) {
  if (rx <= 0.5 || ry <= 0.5) return;
  c.save(); c.translate(x, y); c.scale(1, ry / rx);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(70,40,10,${a})`); g.addColorStop(1, 'rgba(70,40,10,0)');
  c.fillStyle = g; c.beginPath(); circ(c, 0, 0, rx); c.fill(); c.restore();
}

    sfx.click(); render();
  } else if (v === 'wt' && S.r.wt === 3) {
    const h = wtHit(vx, vy); if (!h) return;
    if (h.side) S.fw[h.side].splice(h.i, 1);
    S.fw.drag = { id: h.id, x: vx, y: vy, from: h.side ? 'pan' : 'shelf' };
    try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
    sfx.tick(); render();
  } else if (v === 'cap' && S.r.cap === 3) { if (tapVessel(vx, vy)) render(); }
});
cv.addEventListener('pointermove', (ev) => { const d = S.fw.drag; if (!d) return; [d.x, d.y] = toV(ev); });
const endDrag = () => {
  const d = S.fw.drag; if (!d) return;
  S.fw.drag = null;
  if (d.y < 262) {
    const side = d.x < BX ? 'L' : 'R';
    if (S.fw[side].length < 8) { S.fw[side].push(d.id); sfx.click(); } else sfx.bad();
  } else sfx.tick();
  render();
};
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls ------------------------------------------------------------------------------------------------
// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function resetView(v) {
  S.r[v] = 0; S.pick[v] = null; S.done[v] = false;
  if (v === 'len') S.fl = { sel: [], sp: {}, la: 0 };
  if (v === 'wt') { S.fw = { L: [], R: [], drag: null }; resetBal(); }
  if (v === 'cap') S.fc = newCap();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const v = lab.view, a = b.dataset.act, r = S.r[v];
  if (a === 'ans') {
    if (S.pick[v] !== null || r > 2) return;
    const i = +b.dataset.i; S.pick[v] = i; S.t0 = nowS(); S.tk = v === 'wt' && r === 1 ? 1 : 0;
    (i === ANS[v][r] ? sfx.good : sfx.bad)(); if (r === 2) S.done[v] = true; showStage();
  } else if (a === 'next') {
    S.r[v] = r + 1; S.pick[v] = null; sfx.click(); if (v === 'wt') resetBal(false); if (v === 'cap' && r + 1 === 1) S.capIn = nowS();
  } else if (a === 'again') { resetView(v); sfx.click(); }
  else if (a === 'clear') { S.fw.L = []; S.fw.R = []; sfx.click(); }
  else if (a === 'empty') { for (const k of Object.keys(S.fc.v)) Object.assign(S.fc.v[k], { tn: 0, pour: null, spillT: -9, pud: 0 }); S.fc.last = null; sfx.click(); }
  else if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.secT0 = nowS(); S.tk = 0; sfx.click();
  }
  render();
});

function render() {
  const t = T[lang], v = lab.view, r = S.r[v], pk = S.pick[v], vk = t[VK[v]];
  lab.setGlow(GLOW[v]);
  // controls
  let html = '';
  if (!(v === 'len' && S.sec)) {
    if (r < 3) {
      const ok = ANS[v][r], opts = vk['o' + (r + 1)];
      html += `<div class="cm-q"><div class="cm-qt">${esc(vk['q' + (r + 1)])}</div><div class="cm-opts">${opts.map((o, i) =>
        `<button class="cm-o ${pk !== null ? (i === ok ? 'good' : i === pk ? 'bad' : '') : ''}" data-act="ans" data-i="${i}"${pk !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
      if (pk !== null) html += `<div class="cm-fb"><b class="${pk === ok ? 'ok' : 'no'}">${esc(pk === ok ? t.right : t.wrong)}</b> ${esc(vk['r' + (r + 1)])}</div>
        <div class="row2"><button class="btn" data-act="next">${esc(t.next)}</button></div>`;
      html += '</div>';
    } else {
      html += `<div class="cm-q"><div class="cm-qt">${esc(t.play)}</div><p class="cm-hint">${esc(v === 'len' ? vk.pick : v === 'wt' ? t.drag : t.tap)}</p></div>
        <div class="row2"><button class="btn ghost" data-act="again">${esc(t.again)}</button>${v === 'wt' ? `<button class="btn ghost" data-act="clear">${esc(t.clear)}</button>` : ''}${v === 'cap' ? `<button class="btn ghost" data-act="empty">${esc(t.empty)}</button>` : ''}</div>`;
    }
  }
  if (v === 'len') {
    const open = secret.unlocked();
    const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    html += `<div class="row2"><div class="chips">${sc('feet', '👣')}${sc('ice', '🧊')}</div></div>`;
  }
  $('ctrlBody').innerHTML = html;
  // state card
  if (v === 'len' && S.sec) lab.setState({ emo: S.sec === 'feet' ? '👣' : '🧊', title: t.secrets[S.sec][0], lead: t.sec[S.sec + 'Text'], body: '' });
  else { const [emo, title, lead, body] = t.st[v][S.done[v] ? 'f' : 'n']; lab.setState({ emo, title, lead, body }); }
  // readout
  const acc = ACC[v];
  if (v === 'len' && S.sec === 'feet') return lab.setReadout('4 · 7', `${t.sec.dad}: ${t.sec.steps(4)} · ${t.sec.kid}: ${t.sec.steps(7)}`, '', acc);
  if (v === 'len' && S.sec === 'ice') return lab.setReadout('=', t.w.same, '', acc);
  if (r < 3) {
    if (pk === null) return lab.setReadout('?', '', '', acc);
    const ans = { len: [t.obj.pencil, t.obj.snake, t.cubes(6)], wt: [t.obj.stone, t.cubes(4), t.obj.book], cap: [t.obj.bowl, '=', t.cups(4)] }[v][r];
    return lab.setReadout(esc(ans), pk === ANS[v][r] ? t.right : t.wrong, '', acc);
  }
  if (v === 'len') {
    const s = S.fl.sel;
    if (!s.length) return lab.setReadout('?', t.l.pick, '', acc);
    if (s.length === 1) return lab.setReadout(esc(t.cubes(LENC[s[0]])), t.l.pick, '', acc);
    const [a, b] = s, la = LENC[a], lb = LENC[b];
    return lab.setReadout(`${esc(t.cubes(la))} · ${esc(t.cubes(lb))}`, la === lb ? t.l.same : t.l.longer(t.obj[la > lb ? a : b]), '', acc);
  }
  if (v === 'wt') {
    const L = S.fw.L, R = S.fw.R;
    if (!L.length && !R.length) return lab.setReadout('—', t.drag, '', acc);
    const d = sum(R) - sum(L);
    return lab.setReadout(d < 0 ? t.w.left : d > 0 ? t.w.rightSide : t.w.same, '', '', acc);
  }
  const id = S.fc.last;
  if (!id) return lab.setReadout('?', t.tap, '', acc);
  return lab.setReadout(esc(t.cups(S.fc.v[id].tn)), t.obj[id], '', acc);
}

// --- loop ----------------------------------------------------------------------------------------------------
canvasLoop(cv, (c, w, h, dt, time) => {
  const v = lab.view, TY = { len: 90, wt: 104, cap: 100 }[v], base = c.getTransform();
  G.w = w; G.h = h; G.s = Math.min(w / VW, h / VH, 2.1); G.ox = (w - VW * G.s) / 2; G.oy = (h - VH * G.s) / 2;
  G.vx0 = -G.ox / G.s; G.vx1 = (w - G.ox) / G.s; G.vy0 = -G.oy / G.s; G.vy1 = (h - G.oy) / G.s;
  try {
    room(c, w, h, TY);
    c.save(); c.translate(G.ox, G.oy); c.scale(G.s, G.s); c.lineJoin = 'round'; c.lineCap = 'round';
    if (v === 'len') drawLen(c, time, dt); else if (v === 'wt') drawWt(c, time, dt); else drawCap(c, time, dt);
    c.restore();
  } catch (e) { console.error(e); } finally { c.setTransform(base); c.globalAlpha = 1; c.setLineDash([]); }
});
resetBal();
render();
</script>
</body>
