  const t = T[lang], ph = phase(), open = secret.unlocked();
  document.body.dataset.v = ph;
  $('olSecs').innerHTML = [['ring', '🔱'], ['days', '📅']].map(([k, e]) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (ph === 'signs') renderSigns(t); else if (ph === 'help') renderHelp(t); else if (ph === 'names') renderNames(t); else if (ph === 'ring') renderRing(t); else renderDays(t);
}
function setMain(text, show, disabled = false) { const b = $('olMain'); b.hidden = !show; b.textContent = text; b.disabled = disabled; }
const quote = (t, i) => `${t.g[i]}: “${t.say[i]}”`;
function renderSigns(t) {
  const q = S.v1, v = t.v1, end = q.i >= 6, k = q.right.filter(Boolean).length;
  lab.setGlow('rgba(255, 190, 120, .26)'); $('olClear').hidden = true;
  $('olQ').textContent = end ? '' : v.q; $('olQ').hidden = end;
  if (end) { setMain(v.again, true); lab.setReadout(`${k}/6`, v.unit, '', '#ffd84a'); lab.setState({ emo: '🏆', title: v.endT(k), lead: v.endL, body: '' }); }
  else if (q.pick === null) { setMain('', false); lab.setReadout(`${q.i + 1}/6`, v.unit, k ? `✓ ${k}` : '', '#ffd84a'); lab.setState({ emo: '🤔', title: v.askT, lead: v.askL, body: '' }); }
  else {
    const right = q.order[q.i], ok = q.pick === right;
    setMain(v.next, true); lab.setReadout(`${q.i + 1}/6`, v.unit, `✓ ${k}`, '#ffd84a');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? v.ok(t.g[q.pick], t.g[right], t.gg[right]) : v.no(t.g[q.pick], t.g[right], t.gg[right]), lead: quote(t, right), body: '' });
  }
  lab.setFacts(end ? [] : [t.facts.a, t.facts.b]);
}
function renderHelp(t) {
  const q = S.v2, v = t.v2, end = q.i >= 4, k = q.right.filter(Boolean).length, si = Math.min(q.i, 3), sc = SC[q.order[si]], txt = v.sc[sc.k];
  lab.setGlow('rgba(120, 170, 255, .26)'); $('olClear').hidden = true;
  $('olQ').textContent = end ? '' : v.q; $('olQ').hidden = end;
  if (end) { setMain(v.again, true); lab.setReadout(`${k}/4`, v.unit, '', '#7fb2ff'); lab.setState({ emo: '🏆', title: v.endT(k), lead: v.endL, body: '' }); lab.setFacts([t.facts.c, t.facts.d]); return; }
  if (q.pick === null) { setMain('', false); lab.setReadout(`${q.i + 1}/4`, v.unit, k ? `✓ ${k}` : '', '#7fb2ff'); lab.setState({ emo: '🙏', title: txt[0], lead: txt[1], body: '' }); lab.setFacts([t.facts.c]); }
  else {
    const ok = q.pick === sc.g;
    setMain(v.next, true); lab.setReadout(`${q.i + 1}/4`, v.unit, `✓ ${k}`, '#7fb2ff');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? v.ok(t.g[sc.g]) : v.no(t.g[q.pick]), lead: ok ? quote(t, sc.g) : quote(t, q.pick), body: txt[2] });
    lab.setFacts([t.facts.c, t.facts.d]);
  }
}
function renderNames(t) {
  const v = S.v3, n = v.link.filter((l) => l >= 0).length, k = v.link.filter((l, i) => l === v.R.indexOf(i)).length, all = n === 6, x = t.v3;
  lab.setGlow('rgba(255, 216, 120, .24)'); $('olQ').hidden = v.checked; $('olQ').textContent = x.q;
  $('olClear').hidden = v.checked || n === 0; $('olClear').textContent = x.clear;
  setMain(v.checked ? x.again : x.check, true, !v.checked && !all);
  if (v.checked) { lab.setReadout(`${k}/6`, '', '', '#ffd84a'); lab.setState({ emo: k === 6 ? '🏆' : '🪐', title: x.res(k), lead: x.resL, body: k < 6 ? x.resB : '' }); lab.setFacts([t.facts.f]); return; }
  lab.setReadout(`${n}/6`, x.unit, '', '#ffd84a');
  lab.setState(all ? { emo: '🔗', title: x.allT, lead: x.allL, body: '' } : { emo: '🔗', title: x.askT, lead: x.askL, body: x.linked(n) });
  lab.setFacts([t.facts.e]);
}
function renderRing(t) {
  const R = S.ring, x = t.ring, n = R.seen.length; $('olQ').hidden = true; $('olClear').hidden = true; setMain('', false);
  lab.setGlow('rgba(255, 216, 120, .26)'); lab.setReadout(`${n}/12`, x.unit, '', '#ffd84a');
  if (R.sel < 0) lab.setState({ emo: '🔱', title: x.askT, lead: x.askL, body: '' });
  else { const i = R.sel === 11 ? R.twelfth : R.sel, g = x.g[i], r = x.r[i]; lab.setState({ emo: RING_EMO[i], title: g === r ? g : `${g} · ${r}`, lead: x.d[i], body: R.sel === 11 ? x.swap : (n === 12 ? x.allT : '') }); }
  lab.setFacts([t.facts.b]);
}
function renderDays(t) {
  const D = S.days, x = t.days, n = D.opened.length; $('olQ').hidden = true; $('olClear').hidden = true; setMain('', false);
  lab.setGlow('rgba(255, 216, 120, .26)'); lab.setReadout(`${n}/5`, x.unit, '', '#ffd84a');
  if (D.sel < 0 || !D.tgt[D.sel]) lab.setState(n === 5 ? { emo: '📅', title: x.allT, lead: x.allL, body: '' } : { emo: '📅', title: x.askT, lead: x.askL, body: '' });
  else { const k = D.sel, tw = DAY_TWIN[k] >= 0 ? t.ring.g[DAY_TWIN[k]] : ''; lab.setState({ emo: DAY_EMO[k], title: `${x.fr[k]} · ${x.es[k]}`, lead: x.lead(x.of[k]), body: tw ? x.body(tw) : '' }); }
  lab.setFacts([t.facts.g, t.facts.h]);
}
render();
