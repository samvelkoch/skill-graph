    for (let c = 0; c < 8; c++) { const xx = X + (c + (r % 2 ? .5 : 0)) * W / 7; ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx, yy + H / 8); ctx.stroke(); } }
  const Rl = Math.min(W, H) * .3;
  ctx.globalCompositeOperation = 'lighter';
  for (const s of S.lt) {
    const x = X + s.x * W, y = Y + s.y * H, [r, g, b] = hex2rgb(s.c), gr = ctx.createRadialGradient(x, y, 0, x, y, Rl);
    gr.addColorStop(0, `rgba(${r},${g},${b},.95)`); gr.addColorStop(.72, `rgba(${r},${g},${b},.88)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, Rl, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
  ctx.beginPath(); ctx.roundRect(X, Y, W, H, 14); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.stroke();
  for (const s of S.lt) {
    const x = X + s.x * W, y = Y + s.y * H;
    ctx.beginPath(); ctx.arc(x, y, 15, 0, TAU); ctx.fillStyle = 'rgba(10,12,20,.78)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '900 13px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s.l, x, y + 1);
  }
  tag(ctx, T[lang].light, X + 10, Y + 18, 'left');
  // paint strip
  const sy = Y + H + h * .03, sh = h - sy - h * .03, cy = sy + sh / 2, d = Math.min(sh * .36, w * .085);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6; ctx.beginPath(); ctx.roundRect(X, sy, W, sh, 14); ctx.fillStyle = '#efe3c8'; ctx.fill(); ctx.restore();
  const xs = [w * .2, w * .38, w * .62];
  glossBlob(ctx, xs[0], cy, d * 1.2, d, PAINT.r, 1); glossBlob(ctx, xs[1], cy, d * 1.2, d, '#66b032', 2);
  glossBlob(ctx, xs[2], cy, d * 1.5, d * 1.15, shade(OPP_RES[0], -.1), 3);
  ctx.fillStyle = '#6b5a3a'; ctx.font = '900 22px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('+', (xs[0] + xs[1]) / 2, cy + 1); ctx.fillText('=', (xs[1] + xs[2]) / 2 - d * .1, cy + 1);
  tag(ctx, T[lang].paintCap, X + W - 10, sy + 18, 'right');
}

// --- secret B: printer dots ------------------------------------------------------------------------------------
const PN = 128;
const pic = document.createElement('canvas'); pic.width = pic.height = PN;
let picData = null;
function paintApple() {
  const x = pic.getContext('2d', { willReadFrequently: true }), N = PN;
  x.fillStyle = '#fff'; x.fillRect(0, 0, N, N);
  const sg = x.createRadialGradient(N * .5, N * .9, 2, N * .5, N * .9, N * .32); sg.addColorStop(0, 'rgba(70,70,70,.5)'); sg.addColorStop(1, 'rgba(70,70,70,0)');
  x.fillStyle = sg; x.beginPath(); x.ellipse(N * .5, N * .9, N * .32, N * .07, 0, 0, TAU); x.fill();
  x.beginPath(); x.moveTo(N * .5, N * .3); x.bezierCurveTo(N * .62, N * .2, N * .9, N * .24, N * .9, N * .55); x.bezierCurveTo(N * .9, N * .8, N * .7, N * .93, N * .58, N * .88);
  x.quadraticCurveTo(N * .5, N * .85, N * .42, N * .88); x.bezierCurveTo(N * .3, N * .93, N * .1, N * .8, N * .1, N * .55); x.bezierCurveTo(N * .1, N * .24, N * .38, N * .2, N * .5, N * .3); x.closePath();
  const g = x.createRadialGradient(N * .38, N * .42, N * .03, N * .5, N * .58, N * .5); g.addColorStop(0, '#ff6a4d'); g.addColorStop(.5, '#e02a2a'); g.addColorStop(1, '#8f1019');
  x.fillStyle = g; x.fill();
  x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.ellipse(N * .32, N * .42, N * .07, N * .13, .5, 0, TAU); x.fill();
  x.strokeStyle = '#5a3a1a'; x.lineWidth = N * .035; x.lineCap = 'round'; x.beginPath(); x.moveTo(N * .5, N * .3); x.quadraticCurveTo(N * .5, N * .2, N * .55, N * .13); x.stroke();
  const lg = x.createLinearGradient(N * .55, N * .12, N * .8, N * .25); lg.addColorStop(0, '#8ed04a'); lg.addColorStop(1, '#2f8f2f');
  x.fillStyle = lg; x.beginPath(); x.moveTo(N * .55, N * .2); x.bezierCurveTo(N * .62, N * .06, N * .78, N * .06, N * .84, N * .12); x.bezierCurveTo(N * .78, N * .24, N * .64, N * .26, N * .55, N * .2); x.fill();
  picData = x.getImageData(0, 0, N, N).data;
}
paintApple();
const ht = document.createElement('canvas');
const CMYK = [['#00aeef', 15], ['#ec008c', 75], ['#fff200', 0], ['#231f20', 45]];
function renderHalftone(D, s, dpr) {
  ht.width = ht.height = Math.max(2, Math.round(D * dpr));
  const x = ht.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.fillStyle = '#fff'; x.fillRect(0, 0, D, D);
  x.globalCompositeOperation = 'multiply';
  const P = D / 80 * s, half = D * .75;
  CMYK.forEach(([col, deg], ch) => {
    const th = deg * Math.PI / 180, co = Math.cos(th), si = Math.sin(th), n = Math.ceil(half / P);
    x.fillStyle = col; x.beginPath();
    for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
      const u = i * P, v = j * P, px = D / 2 + u * co - v * si, py = D / 2 + u * si + v * co;
      if (px < -P || py < -P || px > D + P || py > D + P) continue;
      const fx = ((px - D / 2) / s / D + .5) * PN, fy = ((py - D / 2) / s / D + .5) * PN;
      if (fx < 0 || fy < 0 || fx >= PN || fy >= PN) continue;
      const o = (Math.floor(fy) * PN + Math.floor(fx)) * 4, r = picData[o] / 255, g = picData[o + 1] / 255, b = picData[o + 2] / 255;
      const k = 1 - Math.max(r, g, b), den = 1 - k || 1, v4 = [(1 - r - k) / den, (1 - g - k) / den, (1 - b - k) / den, k][ch];
      if (v4 < .03) continue;
      const rad = P * .72 * Math.sqrt(v4); x.moveTo(px + rad, py); x.arc(px, py, rad, 0, TAU);
    }
    x.fill();
  });
  x.globalCompositeOperation = 'source-over';
}
function drawPrint(ctx, w, h) {
  const D = Math.min(w * .84, h * .8), X = (w - D) / 2, Y = h * .06, s = 1 + S.zoom * 9, dpr = Math.min(window.devicePixelRatio || 1, 2);
  S.g = {};
  const key = `${Math.round(D)}|${s.toFixed(2)}|${dpr}`;
  if (key !== S.htKey) { S.htKey = key; renderHalftone(D, s, dpr); }
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 9;
  ctx.beginPath(); ctx.roundRect(X, Y, D, D, 14); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.roundRect(X, Y, D, D, 14); ctx.clip();
  const ta = clamp((S.zoom - .03) / .2, 0, 1);
  if (ta < 1) { ctx.globalAlpha = 1 - ta; ctx.imageSmoothingEnabled = true; ctx.drawImage(pic, 0, 0, PN, PN, X + D / 2 - D * s / 2, Y + D / 2 - D * s / 2, D * s, D * s); }
  if (ta > 0) { ctx.globalAlpha = ta; ctx.drawImage(ht, X, Y, D, D); }
  ctx.restore();
  ctx.beginPath(); ctx.roundRect(X, Y, D, D, 14); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.stroke();
  tag(ctx, `${T[lang].zoom} ×${s.toFixed(1)}`, X + 10, Y + D + 22, 'left');
}

// --- the loop --------------------------------------------------------------------------------------------------
const cv = $('cv');
canvasLoop(cv, (ctx, w, h, dt, t) => {
  const mode = S.sec ?? lab.view;
  if (mode === 'mix') drawMix(ctx, w, h, dt, t);
  else if (mode === 'wheel') drawWheel(ctx, w, h, dt, t);
  else if (mode === 'warm') drawWarm(ctx, w, h, dt, t);
  else if (mode === 'light') drawLight(ctx, w, h, dt, t);
  else drawPrint(ctx, w, h);
});

// --- pointer ---------------------------------------------------------------------------------------------------
const ptr = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
cv.addEventListener('pointerdown', (ev) => {
  const p = ptr(ev), mode = S.sec ?? lab.view, g = S.g;
  if (!g) return;
  if (mode === 'mix' && S.round >= 3) {
    for (const k of ['r', 'y', 'b', 'w']) { const B = g.blobs[k]; if (Math.hypot(p.x - B.x, p.y - B.y) < g.br * 1.35) { S.queue.push(k); return; } }
    if (Math.hypot(p.x - g.wx, p.y - g.wy) < g.Rw * 1.05 && S.dollops.length && !S.act && !S.queue.length) {
      cv.setPointerCapture?.(ev.pointerId); S.stirring = false; S.drag = { ang: Math.atan2(p.y - g.wy, p.x - g.wx), tip: p };
    }
  } else if (mode === 'wheel' && S.wAns !== null) {
    const d = Math.hypot(p.x - g.cx, p.y - g.cy);
    if (d >= g.Ri && d <= g.R * 1.05) {
      const i = Math.floor((((Math.atan2(p.y - g.cy, p.x - g.cx) * 180 / Math.PI) + 90 + 15 + 720) % 360) / 30) % 12;
      if (clamp((S.wT - SEG_START(i)) / SEG_DUR(i), 0, 1) >= 1) { S.wSel = S.wSel === i ? null : i; sfx.tick(); render(); }
    }
  } else if (mode === 'light') {
    let best = -1, bd = 46;
    S.lt.forEach((s, i) => { const d = Math.hypot(p.x - (g.X + s.x * g.W), p.y - (g.Y + s.y * g.H)); if (d < bd) { bd = d; best = i; } });
    if (best >= 0) { S.ltDrag = best; cv.setPointerCapture?.(ev.pointerId); }
  }
});
cv.addEventListener('pointermove', (ev) => {
  const p = ptr(ev), g = S.g;
  if (S.drag) {
    const a = Math.atan2(p.y - g.wy, p.x - g.wx); let d = a - S.drag.ang; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU;
    S.drag.ang = a; S.drag.tip = { x: clamp(p.x, 0, cv.clientWidth), y: clamp(p.y, 0, cv.clientHeight) };
    S.stirS = Math.min(1, S.stirS + Math.abs(d) / (TAU * 1.6));
  } else if (S.ltDrag >= 0) {
    const s = S.lt[S.ltDrag]; s.x = clamp((p.x - g.X) / g.W, .04, .96); s.y = clamp((p.y - g.Y) / g.H, .06, .94);
  }
});
const pend = () => { S.drag = null; S.ltDrag = -1; };
cv.addEventListener('pointerup', pend); cv.addEventListener('pointercancel', pend);

// --- controls --------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function startRound(i) { cleanWell(); S.round = i; S.pick = null; S.rdDone = false; }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, mode = S.sec ?? lab.view;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; sfx.click();
  } else if (act === 'pick') {
    if (mode === 'mix') {
      if (S.pick !== null) return;
      S.pick = +b.dataset.j; S.queue.push(...PAIRS[S.round]); S.autoStir = true; showStage();
    } else if (mode === 'wheel') { if (S.wAns !== null) return; S.wAns = +b.dataset.j; S.wT = 0; S.wDone = false; showStage(); sfx.click(); }
    else { if (S.mAns !== null) return; S.mAns = +b.dataset.j; setPaint('warm'); showStage(); sfx.click(); }
    if (mode === 'wheel' || mode === 'warm') ((mode === 'wheel' ? S.wAns === T[lang].wok : S.mAns === T[lang].mok) ? sfx.good : sfx.bad)();
  } else if (act === 'next') { startRound(S.round + 1); sfx.click(); }
  else if (act === 'stir') { if (S.dollops.length && !S.act && !S.queue.length) { S.stirring = true; S.drag = null; sfx.click(); } }
  else if (act === 'clean') { cleanWell(); sfx.click(); }
  else if (act === 'dip') { S.queue.push(b.dataset.k); }
  else if (act === 'again') { S.wT = 0; S.wDone = false; S.wSel = null; S.opp = false; S.oppPair = null; sfx.click(); }
  else if (act === 'opp') { S.opp = !S.opp; S.oppPair = null; S.wSel = null; sfx.click(); }
  else if (act === 'pair') { S.oppPair = +b.dataset.k; S.oppT = 0; sfx.click(); }
  else if (act === 'paint') { setPaint(b.dataset.m); sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'zoomR') return;
  S.zoom = +ev.target.value / 100; renderPrintReadout();
});

// --- render: controls, readout, state card, facts --------------------------------------------------------------
const verdict = (ok, text, extra = '') => `<div class="pt-v"><b class="${ok ? 'ok' : 'no'}">${esc(ok ? T[lang].right : T[lang].notq)}</b><p>${esc(text)}${extra ? ' ' + esc(extra) : ''}</p></div>`;
const question = (q, opts, pick, ok, done) => `<div class="pt-q"><div class="pt-qt">${esc(q)}</div><div class="chips pt-opts" style="justify-content:center">${opts.map((o, j) => {
  const cls = done ? (j === ok ? 'good' : j === pick ? 'bad' : '') : pick === j ? 'on' : '';
  return `<button class="chip pt-chip ${cls}" data-act="pick" data-j="${j}"${pick !== null ? ' disabled' : ''}>${esc(o)}</button>`;
}).join('')}</div></div>`;

function renderPrintReadout() {
  const t = T[lang], s = 1 + S.zoom * 9;
  lab.setReadout(`×${s.toFixed(1)}`, t.printSub, t.printPill, '#ec008c');
}

function render() {
  const t = T[lang], mode = S.sec ?? lab.view;
  document.body.dataset.v = mode;
  let html = '', state, ro, glow = 'rgba(232, 163, 58, .26)';
  const fin = finalColor();
  if (mode === 'mix') {
    if (S.round < 3) {
      const R = t.rounds[S.round], done = S.rdDone, ok = S.pick === R.ok;
      html = question(R.q, R.opts, S.pick, R.ok, done);
      if (done) html += verdict(ok, R.res, t.roundBody) + `<div class="pt-row"><button class="pt-btn main" data-act="next">${esc(S.round < 2 ? t.next : t.free)}</button></div>`;
      if (!done) { ro = ['?', t.round(S.round + 1), '', '#e8a33a']; state = { emo: '🤔', title: t.guess, lead: t.guessLead, body: '' }; }
      else { ro = [esc(cap(colourName(fin))), t.round(S.round + 1), '', fin]; state = { emo: '🎨', title: R.res, lead: t.roundBody, body: '' }; }
    } else {
      html = `<div class="chips" style="justify-content:center">${['r', 'y', 'b', 'w'].map((k) => `<button class="chip pt-chip" data-act="dip" data-k="${k}"><span class="pt-dot" style="background:${PAINT[k]}"></span>${esc(t.paints[k])}</button>`).join('')}</div>
        <div class="pt-row"><button class="pt-btn main" data-act="stir"${S.dollops.length ? '' : ' disabled'}>${esc(t.stir)}</button><button class="pt-btn" data-act="clean"${total() ? '' : ' disabled'}>${esc(t.clean)}</button></div>`;
      const c = S.comps, P = c.r + c.y + c.b;
      if (!total()) { ro = ['—', t.emptyVal, '', '#e8a33a']; state = { emo: '🖌️', title: t.emptyTitle, lead: t.emptyLead, body: '' }; }
      else {
        const sub = ['r', 'y', 'b', 'w'].filter((k) => c[k]).map((k) => `${t.pn[k]} ×${c[k]}`).join(' + ');
        const used = ['r', 'y', 'b'].filter((k) => c[k]);
        const dark = used.length === 3;
        ro = [esc(cap(colourName(fin))), sub, dark ? t.pillDark : '', fin];
        const lead = dark ? t.leadDark : (used.length === 1 && !c.w && P > 0) ? t.leadPrimary : c.w ? t.leadWhite : t.leadMix;
        state = { emo: dark ? '🟤' : '🎨', title: cap(colourName(fin)), lead, body: '' };
      }
    }
  } else if (mode === 'wheel') {
    glow = 'rgba(160, 110, 220, .26)';
    if (S.wAns === null) {
      html = question(t.wq, t.wopts, null, t.wok, false);
      ro = ['?', '', '', '#a06ee0']; state = { emo: '🤔', title: t.guess, lead: t.guessLead, body: '' };
    } else {
      html = question(t.wq, t.wopts, S.wAns, t.wok, true) + verdict(S.wAns === t.wok, t.wres);
      html += `<div class="pt-row"><button class="pt-btn" data-act="again">${esc(t.again)}</button><button class="pt-btn ${S.opp ? 'on' : ''}" data-act="opp"${S.wDone ? '' : ' disabled'}>${esc(t.opp)}</button></div>`;
      if (S.opp && S.wDone) html += `<div class="pt-row">${OPP.map(([a, b], k) => `<button class="pt-btn ${S.oppPair === k ? 'on' : ''}" data-act="pair" data-k="${k}"><span class="pt-dot" style="background:${SEG[a]}"></span><span class="pt-dot" style="background:${SEG[b]}"></span>${esc(t.pairs[k])}</button>`).join('')}</div>`;
      const i = S.wSel;
      if (S.opp && S.wDone) {
        ro = [esc(t.oppTitle), '', '', '#a06ee0'];
        state = { emo: '↔️', title: t.oppTitle, lead: S.oppPair === null ? t.oppLead : t.oppDone, body: '' };
      } else if (i !== null) {
        const kind = SEG_KIND[i], pr = SEG_PARTS[i];
        const rec = kind === 'p' ? t.primaryNote : kind === 's' ? `${t.pnw[pr[0]]} + ${t.pnw[pr[1]]}` : t.ter(t.pnw[pr[0]], t.pnwG[pr[1]]);
        ro = [esc(t.seg[i]), t.types[kind], '', SEG[i]];
        state = { emo: '🌈', title: t.seg[i], lead: rec, body: t.wBody };
      } else {
        ro = [esc(t.wName), t.wTap, '', '#a06ee0'];
        state = { emo: '🌈', title: t.wName, lead: t.wLead, body: t.wBody };
      }
    }
  } else if (mode === 'warm') {
    glow = 'rgba(240, 130, 70, .26)';
    if (S.mAns === null) {
      html = question(t.mq, t.mopts, null, t.mok, false);
      ro = ['?', '', '', '#f08246']; state = { emo: '🤔', title: t.guess, lead: t.mGuessLead, body: '' };
    } else {
      html = question(t.mq, t.mopts, S.mAns, t.mok, true) + verdict(S.mAns === t.mok, t.mres);
      html += `<div class="pt-row"><button class="pt-btn ${S.paint === 'warm' ? 'on' : ''}" data-act="paint" data-m="warm">🔥 ${esc(t.paintWarm)}</button><button class="pt-btn ${S.paint === 'cool' ? 'on' : ''}" data-act="paint" data-m="cool">❄️ ${esc(t.paintCool)}</button></div>`;
      const w = S.paint === 'warm';
      ro = [esc(w ? t.valWarm : t.valCool), t.valFeel, '', w ? '#f08246' : '#4aa3e0'];
      state = { emo: w ? '🔥' : '❄️', title: w ? t.warmTitle : t.coolTitle, lead: w ? t.warmLead : t.coolLead, body: t.mBody };
    }
  } else if (mode === 'light') {
    glow = 'rgba(255, 220, 90, .22)';
    html = `<p class="pt-hint">${esc(t.lightHint)}</p>`;
    ro = [esc(t.lightVal), t.lightSub, '', '#ffd84a'];
    state = { emo: '💡', title: t.secrets.a[0], lead: t.secrets.a[1], body: t.lightBody };
  } else {
    glow = 'rgba(236, 0, 140, .2)';
    const cols = ['#00aeef', '#ec008c', '#fff200', '#231f20'], ab = ['C', 'M', 'Y', 'K'];
    html = `<p class="pt-hint">${esc(t.zoomHint)}</p><div class="pt-zoom"><label for="zoomR">${esc(t.zoom)}</label><input id="zoomR" class="big" type="range" min="0" max="100" value="${Math.round(S.zoom * 100)}"></div>
      <div class="pt-leg">${cols.map((c, i) => `<span><span class="pt-dot" style="background:${c}"></span>${ab[i]} ${esc(t.cmyk[i])}</span>`).join('')}</div>`;
    state = { emo: '🖨️', title: t.secrets.b[0], lead: t.secrets.b[1], body: '' };
  }
  $('dyn').innerHTML = html;
  const open = secret.unlocked();
  const sc = (k, emo, name) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(name)}` : '🔒'}</button>`;
  $('secChips').innerHTML = sc('light', '💡', t.secrets.a[0]) + sc('print', '🖨️', t.secrets.b[0]);
  lab.setGlow(glow);
  if (mode === 'print') renderPrintReadout(); else lab.setReadout(...ro);
  lab.setState(state);
  lab.setFacts([t.facts[lab.view]]);
}
render();
</script>
</body>
