  $('mbRoll').textContent = S.pT > .5 ? t.again : t.g.roll;
  $('mbHNext').style.display = S.sec === 'hundred' ? '' : 'none'; $('mbHNext').textContent = t.next;
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('mbChips').innerHTML = sc('body', '🔬') + sc('hundred', '🐛');
  $('mbSay').innerHTML = v === 'log' && !S.sec && S.gAns !== null ? `<b style="color:${S.gAns === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(S.gAns === 1 ? t.right : t.wrong)}</b>${esc(t.g.r)}` : '';
  // the card over the stage
  let html = '';
  if (v === 'log') {
    if (!S.sec && S.gAns === null) html = optsHtml(t.g.q, t.g.o, [0, 1, 2]);
  } else if (v === 'legs') {
    if (S.lAns === null) html = optsHtml(t.l.q, t.l.o, [0, 1, 2]);
    else if (S.lPhase === 'ant') html = `${verdictHtml(S.lAns === 1)}<p>${esc(t.l.r)}</p><div class="row"><button class="go" data-act="next">${esc(t.next)}</button></div>`;
    else if (S.ls.st === 'done') {
      const ls = S.ls, key = SORT[ls.i];
      html = `${verdictHtml(ls.right[ls.i])}<p>${esc(t.l.why[key])}</p><div class="row"><button class="go" data-act="next">${esc(ls.i >= 8 ? t.again : t.next)}</button></div>`;
    }
  } else {
    const q = S.cq, a = S.cAns[q];
    if (a === null) html = optsHtml(t.c['q' + (q + 1)], t.c['o' + (q + 1)], CHAIN_PERM[q]);
    else if (q < 2) html = `${verdictHtml(a === 0)}<div class="row"><button class="go" data-act="next">${esc(t.next)}</button></div>`;
    else html = `${verdictHtml(a === 0)}<p>${esc(t.c.r)}</p>${S.cB != null ? `<p>${esc(t.c.r2)}</p>` : ''}<div class="row"><button class="go" data-act="next">${esc(t.again)}</button></div>`;
    S.cEnter ??= now();
  }
  askEl.innerHTML = html; askEl.style.display = html ? '' : 'none';
  // state card: neutral until the view's last round is done
  let sc2;
  if (v === 'log' && S.sec === 'body') sc2 = ['🔬', t.secrets.body[0], t.sec.bodyText, ''];
  else if (v === 'log' && S.sec === 'hundred') sc2 = ['🐛', t.secrets.hundred[0], t.sec.hundredText, ''];
  else if (v === 'log') sc2 = S.gAns !== null ? st.log.f : st.log.n;
  else if (v === 'legs') sc2 = S.ls && S.ls.st === 'done' && S.ls.i === 8 ? st.legs.f : st.legs.n;
  else sc2 = S.cAns[2] !== null ? st.chain.f : st.chain.n;
  lab.setState({ emo: sc2[0], title: sc2[1], lead: sc2[2], body: sc2[3] });
  lab.setGlow(v === 'log' ? 'rgba(111, 163, 79, .26)' : 'rgba(76, 195, 138, .24)');
  readout();
}
render();
</script>
</body>
</html>
