  c.fillStyle = '#3b4252'; for (let x = 24; x < 176; x += 14) { if (x > 70 && x < 124) continue; c.fillRect(x, GROUND - 40, 5, 18); }
  // St Stephen's Basilica: two bell towers and a central dome (96 m)
  const bt = topY(BU.bas);
  c.fillStyle = lg(c, 212, 0, 290, 0, [[0, '#efe6d2'], [1, '#b4a98f']]); c.fillRect(212, GROUND - 62, 76, 62);
  for (const x of [208, 274]) { c.fillStyle = lg(c, x, 0, x + 18, 0, [[0, '#f0e7d2'], [1, '#aea389']]); c.fillRect(x, GROUND - 100, 18, 100); c.fillStyle = '#5f9c8a'; c.beginPath(); c.moveTo(x - 1, GROUND - 100); c.quadraticCurveTo(x + 9, GROUND - 120, x + 19, GROUND - 100); c.closePath(); c.fill(); }
  c.fillStyle = lg(c, 232, 0, 268, 0, [[0, '#efe6d0'], [1, '#aca187']]); c.fillRect(232, GROUND - 120, 36, 60);
  c.fillStyle = '#5f9c8a'; c.beginPath(); c.moveTo(232, GROUND - 120); c.quadraticCurveTo(236, GROUND - 150, 250, GROUND - 160); c.quadraticCurveTo(264, GROUND - 150, 268, GROUND - 120); c.closePath(); c.fill();
  c.strokeStyle = '#2d3a46'; c.lineWidth = 2; c.beginPath(); c.moveTo(250, GROUND - 160); c.lineTo(250, bt); c.stroke();
  c.fillStyle = '#c9bd98'; c.fillRect(226, GROUND - 22, 48, 22); c.fillStyle = '#2d2a36'; c.beginPath(); c.moveTo(243, GROUND); c.lineTo(243, GROUND - 14); c.arc(250, GROUND - 14, 7, Math.PI, 0); c.lineTo(257, GROUND); c.closePath(); c.fill();
}
function drawCloud(c, w, t, lift) {
  const y0 = topY(62), off = -lift * (y0 + 70), a = 1 - Math.max(0, lift - 0.6) / 0.4;
  c.save(); c.translate(0, off); c.globalAlpha = clamp(a, 0, 1);
  c.fillStyle = lg(c, 0, -20, 0, y0, [[0, '#dfe6f4'], [1, '#bfc9e0']]);
  c.beginPath(); c.moveTo(-400, -400); c.lineTo(W3 + 400, -400); c.lineTo(W3 + 400, y0 - 14);
  for (let x = W3 + 400, i = 0; x > -400; x -= 38, i++) c.arc(x - 19, y0 - 14, 19 + (i % 3) * 3, 0, Math.PI);
  c.closePath(); c.fill();
  c.fillStyle = 'rgba(255,255,255,.55)'; for (let i = 0; i < 7; i++) { c.beginPath(); c.arc(30 + i * 48, 30 + (i % 2) * 28, 26, 0, Math.PI * 2); c.fill(); }
  c.restore();
}
function drawTown(c, w, h, time) {
  const s = Math.min(w / W3, h / H3), ox = (w - W3 * s) / 2, oy = (h - H3 * s) / 2, ci = S.city, siena = ci === 0;
  GEO.s = s; GEO.ox = ox; GEO.oy = oy;
  c.fillStyle = lg(c, 0, 0, 0, h, siena ? [[0, '#3a4e86'], [.6, '#e0a07a'], [1, '#f0c595']] : [[0, '#26335e'], [.6, '#8a8fb6'], [1, '#e5b79a']]); c.fillRect(0, 0, w, h);
  c.save(); c.translate(ox, oy); c.scale(s, s);
  (siena ? drawSiena : drawBudapest)(c);
  const tp = siena ? [[273, SI.tower], [135, SI_CATH_TOP]] : [[97, BU.par], [250, BU.bas]];
  const lbl = siena ? T[lang].c.lblS : T[lang].c.lblB;
  const done = S.pr[ci] !== null;
  if (done) {
    pill(c, lbl[0], siena ? 252 : 97, GROUND + 18, 0, W3); pill(c, lbl[1], siena ? 120 : 250, GROUND + 18, 0, W3);
    const r = S.ruler[ci], y = topY(r);
    c.save(); c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.8; c.setLineDash([8, 5]); c.beginPath(); c.moveTo(0, y); c.lineTo(W3, y); c.stroke(); c.restore();
    pill(c, `${r} m`, 30, clamp(y - 14, 14, H3 - 14), 0, W3, true);
    for (const [x, m] of tp) if (Math.abs(r - m) <= 1.2) {
      const a = 0.6 + 0.4 * Math.sin(time * 6); c.save(); c.shadowColor = 'rgba(255,214,110,1)'; c.shadowBlur = 18; c.strokeStyle = `rgba(255,222,120,${a})`; c.lineWidth = 3;
      c.beginPath(); c.arc(x, topY(m), 11, 0, Math.PI * 2); c.stroke(); c.restore();
    }
  }
  if (S.cloud[ci] < 0.999) drawCloud(c, w, time, smooth(S.cloud[ci]));
  c.restore();
}

// --- the loop ----------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  S.axisT = clamp(S.axisT + (S.bed !== null ? dt / 1.6 : -dt), 0, 1);
  for (let i = 0; i < 2; i++) S.cloud[i] = clamp(S.cloud[i] + (S.pr[i] !== null ? dt / 1.1 : -dt), 0, 1);
  c.lineJoin = 'round';
  if (v === 'signs') drawSigns(c, w, h, time); else if (v === 'axis') drawPlan(c, w, h, time); else drawTown(c, w, h, time);
});
const toDesign = (ev) => { const r = $('cv').getBoundingClientRect(); return [(ev.clientX - r.left - GEO.ox) / GEO.s, (ev.clientY - r.top - GEO.oy) / GEO.s]; };
$('cv').addEventListener('pointerdown', (ev) => {
  const [x, y] = toDesign(ev), v = lab.view;
  if (v === 'signs') {
    if (x < 0 || x > W1 || y < 0 || y > H1) return;
    const i = (x < 180 ? 0 : 1) + (y < 180 ? 0 : 2);
    if (S.sel !== i) { S.sel = i; S.feat = null; S.win = false; sfx.click(); render(); }
  } else if (v === 'axis' && S.bed === null) {
    const i = SPOTS.findIndex(([sx, sy]) => Math.hypot(sx - x, sy - y) < 20);
    if (i >= 0) pickBed(i);
  }
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const goView = (v) => $('views').querySelector(`[data-view="${v}"]`)?.click();
function pickBed(i) { S.mir = false; S.bed = i; S.walk = 0; S.walked = false; (i === 0 ? sfx.good : sfx.bad)(); showStage(); render(); }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = +b.dataset.k;
  if (a === 'bld') { S.sel = k; S.feat = null; S.win = false; sfx.click(); }
  else if (a === 'msg') { if (S.g[S.sel] !== null) return; S.win = false; S.g[S.sel] = k; (k === S.sel ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'feat') { S.feat = S.feat && S.feat[0] === S.sel && S.feat[1] === k ? null : [S.sel, k]; S.win = false; sfx.tick(); }
  else if (a === 'win') { if (!secret.unlocked()) return secret.open(); S.win = !S.win; S.feat = null; sfx.click(); if (lab.view !== 'signs') return goView('signs'); }
  else if (a === 'mir') { if (!secret.unlocked()) return secret.open(); S.mir = !S.mir; sfx.click(); if (lab.view !== 'axis') return goView('axis'); }
  else if (a === 'bed') { if (S.bed !== null) return; pickBed(k); return; }
  else if (a === 'city') { S.city = k; sfx.click(); }
  else if (a === 'pred') { if (S.pr[S.city] !== null) return; S.pr[S.city] = k; (k === 1 + S.city ? sfx.good : sfx.bad)(); showStage(); }
  render();
});
$('walk').addEventListener('input', (ev) => { S.walk = +ev.target.value; S.walked = true; S.mir = false; render(); });
$('ruler').addEventListener('input', (ev) => { S.ruler[S.city] = +ev.target.value; S.moved[S.city] = true; render(); });

// --- render: controls, readout and the state card ---------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('vSigns').style.display = v === 'signs' ? '' : 'none';
  $('vAxis').style.display = v === 'axis' ? '' : 'none';
  $('vTown').style.display = v === 'town' ? '' : 'none';
  const open = secret.unlocked();
  $('secRow').innerHTML = [['win', '🪟', S.win], ['mir', '🪞', S.mir]].map(([k, emo, on]) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (v === 'signs') renderSigns(t); else if (v === 'axis') renderAxis(t); else renderTown(t);
}
function renderSigns(t) {
  const s = t.s, i = S.sel, g = S.g[i], n = S.g.filter((x) => x !== null).length, right = S.g.filter((x, j) => x === j).length;
  lab.setGlow('rgba(201, 138, 108, .28)');
  $('bChips').innerHTML = t.names.map((nm, j) => `<button class="chip ${j === i ? 'on' : ''}" data-act="bld" data-k="${j}">${S.g[j] !== null ? '✓ ' : ''}${esc(nm)}</button>`).join('');
  $('mBox').hidden = g !== null; $('fBox').hidden = g === null;
  $('mQ').textContent = s.pick(t.names[i]);
  $('mCards').innerHTML = MSG_ORDER.map((k) => `<button class="chip" data-act="msg" data-k="${k}">${['🛡️', '⛪', '🏛️', '👑'][k]} ${esc(t.msgs[k])}</button>`).join('');
  $('fQ').textContent = s.fh;
  $('fChips').innerHTML = g === null ? '' : t.feats[i].map((f, j) => `<button class="chip ${S.feat && S.feat[0] === i && S.feat[1] === j ? 'on' : ''}" data-act="feat" data-k="${j}">${esc(f[0])}</button>`).join('');
  lab.setReadout(`${n}/4`, s.read, n ? `✓ ${right}` : '', '#c98a6c');
  let st;
  if (S.win) st = { emo: '🪟', title: s.win.t, lead: s.win.l, body: s.win.b };
  else if (S.feat && S.feat[0] === i && g !== null) st = { emo: ['🧱', '⛪', '🕰️', '✨'][i], title: t.feats[i][S.feat[1]][0], lead: t.feats[i][S.feat[1]][1], body: '' };
  else if (g !== null) st = { emo: g === i ? '✅' : '🤔', title: g === i ? s.ok : s.no(t.msgs[i]), lead: t.why[i], body: n === 4 ? `${s.allT} ${s.allL}` : '' };
  else st = { emo: '🤔', title: s.ask, lead: s.tap, body: '' };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(S.g[3] !== null ? t.facts.signs : []);
}
function renderAxis(t) {
  const a = t.a, ans = S.bed !== null, y = walkY(), z = zoneAt(y);
  lab.setGlow('rgba(255, 211, 107, .22)');
  $('aBox').hidden = ans; $('aWalk').hidden = !ans;
  $('aQ').textContent = a.q;
  $('aCards').innerHTML = a.opts.map((o, j) => `<button class="chip" data-act="bed" data-k="${j}"><b>${'ABC'[j]}</b> ${esc(o)}</button>`).join('');
  $('wQ').textContent = a.walk; $('wL').textContent = a.ends[0]; $('wR').textContent = a.ends[1]; $('walk').value = S.walk;
  lab.setReadout(ans ? a.zones[z][0] : '?', a.read, '', '#ffd36b');
  let st;
  if (S.mir) st = { emo: '🪞', title: a.mir.t, lead: a.mir.l, body: a.mir.b };
  else if (!ans) st = { emo: '🤔', title: a.q, lead: a.tap, body: '' };
  else if (!S.walked) st = { emo: S.bed === 0 ? '✅' : '🤔', title: S.bed === 0 ? a.ok : a.no, lead: a.lead, body: a.body };
  else st = { emo: ['🛣️', '📍', '🚪', '🛏️', '🌳', '⛵'][z], title: a.zones[z][0], lead: a.zones[z][1], body: '' };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(ans ? t.facts.axis : []);
}
function renderTown(t) {
  const c = t.c, ci = S.city, siena = ci === 0, p = S.pr[ci], r = S.ruler[ci];
  lab.setGlow('rgba(224, 160, 122, .26)');
  $('cChips').innerHTML = c.pills.map((nm, j) => `<button class="chip ${j === ci ? 'on' : ''}" data-act="city" data-k="${j}">${S.pr[j] !== null ? '✓ ' : ''}${esc(nm)}</button>`).join('');
  $('tBox').hidden = p !== null; $('tRuler').hidden = p === null;
  $('tQ').textContent = c.qs[ci];
  $('tCards').innerHTML = c.opts[ci].map((o, j) => `<button class="chip" data-act="pred" data-k="${j}">${esc(o)}</button>`).join('');
  $('rQ').textContent = c.ruler; $('ruler').value = r;
  const sub = siena ? c.subS : c.subB;
  if (p === null) {
    lab.setReadout('?', '', '', '#e0a07a');
    lab.setState({ emo: '🤔', title: c.qs[ci], lead: c.tap, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const tops = siena ? [SI.tower, SI_CATH_TOP] : [BU.par, BU.bas], hit = tops.map((m) => Math.abs(r - m) <= 1.2), touch = siena ? c.touchS : c.touchB;
  const kind = hit[0] && hit[1] ? 2 : hit[0] ? 0 : hit[1] ? 1 : -1;
  lab.setReadout(`${r} m`, sub, kind >= 0 ? '✓' : '', '#e0a07a');
  const right = p === 1 + ci, lead = siena ? c.leadS(SI.tower, SI.camp, SI.hill) : c.leadB(BU.par), body = siena ? c.bodyS : c.bodyB;
  const verdict = { emo: right ? '✅' : '🤔', title: right ? c.ok : (siena ? c.noS : c.noB), lead, body };
  lab.setState({ ...(kind >= 0 ? { emo: '📏', title: touch[kind], lead: '', body: '' } : S.moved[ci] ? { emo: '📏', title: c.none, lead: '', body: '' } : verdict), extra: '' });
  lab.setFacts(siena ? t.facts.siena : t.facts.bud);
}
render();
</script>
