  lab.setReadout(`${n}/3`, t.q.sub, n === 3 ? t.q.pill : '', '#d9825f');
  if (n === 0) lab.setState({ emo: '👆', title: t.q.idle[0], lead: t.q.idle[1], body: '', extra: '' });
  else if (n === 3) lab.setState({ emo: t.q.all[0], title: t.q.all[1], lead: t.q.all[2], body: '', extra: '' });
  else { const s = t.q.st[last]; lab.setState({ emo: s[0], title: s[1], lead: s[2], body: t.q.more(n), extra: '' }); }
  lab.setFacts(n ? t.facts.quick : []);
}
function renderSlow(t) {
  const s = t.s, host = $('secSlow'), open = secret.unlocked(), key = `${lang}|${S.guess}|${S.sec}|${open}`;
  lab.setGlow('rgba(95, 168, 160, .26)');
  if (host.dataset.k !== key) {
    host.dataset.k = key;
    if (S.guess === null) {
      host.innerHTML = `<div class="fs-q">${esc(s.q)}</div><div class="fs-row"><button class="fs-btn" data-act="guess" data-g="a">${esc(s.a)}</button><button class="fs-btn" data-act="guess" data-g="b">${esc(s.b)}</button></div>`;
    } else {
      const isl = S.sec === 'island';
      host.innerHTML = `${isl ? `<div class="fs-ends"><span>${esc(s.isl.ends[0])}</span><span>${esc(s.isl.ends[1])}</span></div>` : ''}
        <input type="range" class="big" id="tm" min="0" max="${isl ? 100 : 400}" step="1" value="${Math.round(isl ? S.isl * 100 : S.tT * 100)}" aria-label="${esc(t.views.slow)}">
        ${isl ? '' : `<div class="fs-row">${s.stops.map((x, i) => `<button class="fs-chip" data-act="stop" data-i="${i}">${x.e} ${esc(x.n)}</button>`).join('')}</div>`}
        <div class="fs-row">${['pebble', 'island'].map((k) => `<button class="fs-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'pebble' ? '🪨' : '🏝️'} ${esc(s.secrets[k][0])}` : '🔒 ???'}</button>`).join('')}</div>`;
    }
  }
  if (S.guess === null) {
    lab.setReadout('?', '', '', '#5fa8a0');
    lab.setState({ emo: '🤔', title: s.askTitle, lead: s.askLead, body: '', extra: '' }); lab.setFacts([]); return;
  }
  host.querySelectorAll('[data-i]').forEach((b) => b.classList.toggle('on', +b.dataset.i === Math.round(S.tG)));
  if (S.sec === 'island') {
    const k = S.isl < 0.02 ? 0 : S.isl < TS ? 1 : S.isl < 0.98 ? 2 : 3;
    lab.setReadout(s.isl.v[k], s.isl.sub[k], '', '#d9825f'); lab.setState({ emo: s.isl.v[k], title: s.isl.st[k][0], lead: s.isl.st[k][1], body: '', extra: '' });
    lab.setFacts(k === 3 ? t.facts.shrink : []); return;
  }
  const idx = Math.round(S.tT), st = s.stops[idx];
  lab.setReadout(st.e, st.num, '', '#5fa8a0');
  if (S.sec === 'pebble') { lab.setState({ emo: '🪨', title: s.peb.title, lead: s.peb.look[idx], body: '', extra: '' }); lab.setFacts([]); return; }
  if (S.reached && idx === 4) { const r = S.guess === 'b' ? s.ok : s.no; lab.setState({ emo: r[0], title: r[1], lead: r[2], body: s.guess(s.gl[S.guess]), extra: '' }); }
  else lab.setState({ emo: st.e, title: s.names[idx], lead: s.look[idx], body: s.guess(s.gl[S.guess]), extra: '' });
  lab.setFacts(S.reached ? t.facts.slow : []);
}
function renderPairs(t) {
  const p = t.p, list = cards(), n = list.length, end = S.ci >= n, host = $('secPairs');
  lab.setGlow('rgba(224, 176, 80, .24)');
  const dots = list.map((_, i) => (i < S.ci ? '●' : i === S.ci && !end ? '◉' : '○')).join(' ');
  if (end) {
    const k = S.res.filter(Boolean).length;
    host.innerHTML = `<div class="fs-row"><button class="fs-btn go" data-act="pagain">${esc(p.again)}</button></div>`;
    lab.setReadout(`${k}/${n}`, dots, '', '#e0b050');
    lab.setState({ emo: '🏆', title: p.end(k, n), lead: S.guess !== null ? p.endLead : p.endLead0, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const cd = list[S.ci];
  if (S.ans === null) {
    host.innerHTML = `<div class="fs-row"><button class="fs-btn" data-act="ans" data-a="fast">${esc(p.fast)}</button><button class="fs-btn" data-act="ans" data-a="slow">${esc(p.slow)}</button></div>`;
    lab.setReadout(`${S.ci + 1}/${n}`, dots, '', '#e0b050');
    lab.setState({ emo: '🤔', title: t.title, lead: p.lead(S.ci + 1, n), body: '', extra: '' }); lab.setFacts([]); return;
  }
  host.innerHTML = `<div class="fs-row"><button class="fs-btn go" data-act="next">${esc(p.next)}</button></div>`;
  const ok = S.res[S.ci];
  lab.setReadout(`${S.ci + 1}/${n}`, dots, cd.fast ? p.badge.fast : p.badge.slow, '#e0b050');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? p.ok : p.no, lead: p.why[cd.id], body: '', extra: '' });
  lab.setFacts(S.guess !== null ? t.facts.shrink : []);
}
render();
</script>
