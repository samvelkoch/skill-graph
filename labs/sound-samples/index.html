// --- audio: one context made on the first tap; copies are rendered in JS from the ideal signal ------------------
let AC = null, cur = null;
function actx() {
  try {
    unmuteIOS();

    if (AC.state !== 'running') AC.resume().catch(() => {});
    return AC;
  } catch { return null; }
}
function stopAudio() {
  if (cur) { try { cur.src.stop(); } catch { /* already stopped */ } cur = null; }
  refreshListen();
}
// f(t) is the ideal signal, sampled at `rate` (0 = not at all, sample-and-hold) and rounded to 2^bits levels (0 = not at all)
function renderBuf(sr, dur, f, rate, bits) {

  for (let i = 0; i < n; i++) {

    let v = f(t);
    if (bits) v = qVal(qIdx(v, bits), bits);

}

    buf.copyToChannel(arr, 0);

    let node = src;
    if (lpHz) for (let i = 0; i < 2; i++) { const b = x.createBiquadFilter(); b.type = 'lowpass'; b.frequency.value = lpHz; b.Q.value = 0.707; node.connect(b); node = b; }

  } catch { cur = null; }

}
const note = (hz, tl) => Math.sin(TAU * hz * tl) * Math.min(1, tl / 0.008, (0.4 - tl) / 0.008);

const SYL = [{ f0: 130, fm: [800, 1250, 2500] }, { f0: 165, fm: [500, 900, 2400] }, { f0: 120, fm: [300, 2200, 3200] }];

}

  else if (k === 'o2') play(k, (sr) => renderBuf(sr, 1.2, sineF(330), 0, 0));
  else if (k === 'c2') play(k, (sr) => renderBuf(sr, 1.2, sineF(330), 0, BITSL[S.bi]));

}
const listenLabel = (t, k) => ({ o1: t.listenOrig, c1: t.listenCopy, o2: t.listenOrig, c2: t.listenCopy, oA: t.listenOrig, cA: t.listenCopy, pF: `▶ ${fmt(44100)}`, pP: `▶ ${fmt(8000)} ☎` })[k];

// --- the model of the picture for the current view ---------------------------------------------------------------
function buildM() {
  const v = lab.view;
  let n, bits, known = true, lines = false, err = false, bar = null;
  if (v === 'sample') { n = Math.round(RATES[S.si] / 440); bits = 16; known = S.q1 !== null; bar = { bytes: RATES[S.si] * 2, max: MAXBAR }; }
  else if (v === 'levels') { n = 24; bits = BITSL[S.bi]; known = S.q2 !== null; lines = true; err = true; bar = { bytes: 44100 * bits / 8, max: MAXBAR }; }
  else { n = Math.round(R3[S.r3] / 440); bits = B3[S.b3]; known = S.q3 !== null; }
  const q = [], tv = [], vv = [];
  for (let k = 0; k < n; k++) { const tr = wave(k / n), qq = qIdx(tr, bits); q.push(qq); tv.push(tr); vv.push(qVal(qq, bits)); }
  const M = { v, n, bits, known, lines, err, bar, q, tv, vv, copy: v === 'sample' ? known : true };
  if (v === 'size') {
    const ch = S.st ? 2 : 1, totalBits = R3[S.r3] * bits * ch * S.secs, bytes = totalBits / 8, mp3 = 128000 * S.secs / 8;
    M.size = { totalBits, bytes, mp3 };
  }
  return M;
}
const sizeStr = (bytes, d = 1) => { const t = T[lang]; return bytes >= 1e6 ? `${fmt(bytes / 1e6, d)} ${t.mb}` : `${fmt(bytes / 1e3, d)} ${t.kb}`; };

// --- the paper tape (DOM, so the numbers can be read) ---------------------------------------------------------
function buildTape(M, hidden) {
  const el = $('ssTape'); el.hidden = hidden || !!S.sec;
  if (el.hidden) return;
  const W = el.clientWidth || 320, hx = Math.round(W * 0.66), n = M.q.length;
  const key = `${M.bits}|${W}|${M.q.join(',')}`;
  if (key === S.tapeKey) return;
  S.tapeKey = key; S.tw = W;
  const digits = String(lvOf(M.bits) - 1).length, cw = Math.max(44, digits * 10 + 20);
  const total = n + Math.ceil(W / cw) + 3;
  let h = '';
  for (let i = 0; i < total; i++) h += `<i class="ss-c" style="width:${cw}px">${M.q[i % n]}</i>`;
  $('ssTrack').style.paddingLeft = `${hx}px`; $('ssTrack').style.paddingRight = `${W}px`;
  $('ssTrack').innerHTML = h; $('ssHead').style.left = `${hx}px`;
  S.tapeEl = $('ssTrack').children; S.hiEl = null; S.cw = cw;
}
function tapeTick(time) {
  const M = S.M; if (!M || $('ssTape').hidden) return;
  if ($('ssTape').clientWidth > 0 && $('ssTape').clientWidth !== S.tw) { S.tapeKey = ''; buildTape(M, false); }
  if (!S.tapeEl || !S.tapeEl.length) return;
  const n = M.q.length, p = (time * 2.2) % n, k0 = Math.floor(p), pe = k0 + ease(p - k0);
  $('ssScroll').scrollLeft = pe * S.cw + S.cw / 2;
  const k = Math.floor(pe + 0.5), el = S.tapeEl[k];
  if (el !== S.hiEl) { S.hiEl?.classList.remove('now'); el?.classList.add('now'); S.hiEl = el; }

// --- drawing helpers ---------------------------------------------------------------------------------------------
function pill(c, txt, x, y, o = {}) {
  c.font = `800 12px ${FONT}`;
  const tw = c.measureText(txt).width + 14, hh = 20;
  const px = o.align === 'center' ? x - tw / 2 : o.align === 'right' ? x - tw : x;
  rr(c, px, y, tw, hh, 10); c.fillStyle = 'rgba(8,11,18,.82)'; c.fill();
  if (o.stroke) { c.lineWidth = 1; c.strokeStyle = o.stroke; c.stroke(); }
  c.fillStyle = o.color || '#e8edf7'; c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillText(txt, px + 7, y + hh / 2 + 0.5);
  return tw;
}
function legend(c, x, y, items) {
  c.font = `800 12px ${FONT}`;
  let px = x;
  for (const it of items) {
    const tw = c.measureText(it.text).width + 30;
    rr(c, px, y, tw, 20, 10); c.fillStyle = 'rgba(8,11,18,.82)'; c.fill();
    if (it.tick) { c.strokeStyle = it.col; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(px + 11, y + 4); c.lineTo(px + 11, y + 16); c.stroke(); }
    else { dot(c, px + 11, y + 10, 4); c.fillStyle = it.col; c.fill(); }
    c.fillStyle = '#e8edf7'; c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillText(it.text, px + 21, y + 10.5);
    px += tw + 6;
  }
}
function panel(c, r, edge) {
  const { x, y, w, h } = r;
  rr(c, x, y, w, h, 14); c.fillStyle = lg(c, x, y, x, y + h, [[0, '#0c1f1c'], [1, '#050d0d']]); c.fill();
  c.save(); rr(c, x, y, w, h, 14); c.clip();
  const rg = c.createRadialGradient(x + w * 0.25, y + h * 0.05, 4, x + w * 0.25, y + h * 0.05, w * 0.85);
  rg.addColorStop(0, 'rgba(90,255,190,.12)'); rg.addColorStop(1, 'rgba(90,255,190,0)'); c.fillStyle = rg; c.fillRect(x, y, w, h);

  for (let i = 1; i < 10; i++) { const gx = x + w * i / 10; c.moveTo(gx, y); c.lineTo(gx, y + h); }
  for (let j = 1; j < 8; j++) { const gy = y + h * j / 8; c.moveTo(x, gy); c.lineTo(x + w, gy); }

  c.strokeStyle = 'rgba(100,255,180,.2)'; c.beginPath(); c.moveTo(x, y + h / 2); c.lineTo(x + w, y + h / 2); c.stroke();

// --- the oscilloscope: original wave, digital staircase, level lines, rounding error ----------------------------------
function drawScope(c, r, M, time) {
  const t = T[lang];
  panel(c, r);
  const px0 = r.x + 16, px1 = r.x + r.w - 16, mid = r.y + r.h / 2, amp = r.h / 2 - 24;
  const X = (u) => px0 + u * (px1 - px0), Y = (v) => mid - v * amp;
  const n = M.n, big = n > 40, pop = easeOutBack((time - S.chgAt) * 3);
  c.save(); rr(c, r.x, r.y, r.w, r.h, 14); c.clip();
  // level lines (few bits) or a fine texture (many bits)
  if (M.lines) {
    if (M.bits <= 4) {
      c.setLineDash([4, 4]); c.lineWidth = 1; c.strokeStyle = 'rgba(120,255,200,.4)';
      for (let q = 0; q < lvOf(M.bits); q++) { const yy = Y(qVal(q, M.bits)); c.beginPath(); c.moveTo(px0 - 10, yy); c.lineTo(px1 + 10, yy); c.stroke(); }
      c.setLineDash([]);
    } else {
      c.lineWidth = 1; c.strokeStyle = 'rgba(120,255,200,.1)'; c.beginPath();
      for (let yy = mid - amp; yy <= mid + amp; yy += 3) { c.moveTo(px0 - 10, yy); c.lineTo(px1 + 10, yy); }
      c.stroke();
    }
  }
  // original wave
  const pts = 180;
  glowLine(c, '#8fd0ff', 2.6, 10, () => { c.beginPath(); for (let i = 0; i <= pts; i++) { const u = i / pts; if (i) c.lineTo(X(u), Y(wave(u))); else c.moveTo(X(u), Y(wave(u))); } });
  // the digital copy, swept in from the left once when it is revealed
  if (M.copy) {
    const sweep = ease((time - S.revAt) / 0.9);
    c.save();
    if (sweep < 1) { c.beginPath(); c.rect(r.x, r.y, (px0 - r.x) + (px1 - px0 + 20) * sweep, r.h); c.clip(); }
    const vv = M.vv, stem = big ? 'rgba(255,160,58,.22)' : 'rgba(255,160,58,.5)';
    c.lineWidth = 1; c.strokeStyle = stem; c.beginPath();
    for (let k = 0; k < n; k++) { c.moveTo(X(k / n), Y(0)); c.lineTo(X(k / n), Y(vv[k])); }
    c.stroke();
    if (M.err) {
      c.save(); c.lineCap = 'round'; c.lineWidth = 3; c.strokeStyle = 'rgba(255,82,82,.95)'; c.beginPath();
      for (let k = 0; k < n; k++) if (Math.abs(M.tv[k] - vv[k]) * amp > 0.8) { c.moveTo(X(k / n), Y(M.tv[k])); c.lineTo(X(k / n), Y(vv[k])); }
      c.stroke(); c.restore();
    }
    glowLine(c, '#ffa03a', big ? 2 : 2.8, 9, () => {
      c.beginPath();
      for (let k = 0; k < n; k++) { const xv = X(k / n), xn = X((k + 1) / n), yv = Y(vv[k]); if (k) c.lineTo(xv, yv); else c.moveTo(xv, yv); c.lineTo(xn, yv); }
      c.lineTo(X(1), Y(vv[0]));
    });
    const dr = (big ? 1.9 : 3.8) * pop;
    for (let k = 0; k < n; k++) {
      const xx = X(k / n), yy = Y(vv[k]);
      dot(c, xx, yy, dr); c.fillStyle = lg(c, xx - dr, yy - dr, xx + dr, yy + dr, [[0, '#fff1d6'], [1, '#ff8a1c']]); c.fill();
      if (!big) { c.lineWidth = 1; c.strokeStyle = '#7a3a05'; c.stroke(); }
    }
    // the sample the tape is reading right now
    const kk = S.cur % n, hx = X(kk / n), hy = Y(vv[kk]), pr = (big ? 5 : 8) + 2 * Math.sin(time * 6);
    c.lineWidth = 1; c.strokeStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.moveTo(hx, r.y + 6); c.lineTo(hx, r.y + r.h - 6); c.stroke();
    dot(c, hx, hy, pr); c.lineWidth = 2; c.strokeStyle = '#fff'; c.stroke();
    c.restore();
  }
  c.restore();

  if (M.copy) items.push({ col: '#ffa03a', text: t.legCopy });
  if (M.err && M.copy) items.push({ col: '#ff5252', text: t.error, tick: true });
  legend(c, r.x + 8, r.y + 8, items);
  if (M.lines && M.bits >= 8) pill(c, `${fmt(lvOf(M.bits))} ${t.levelsWord}`, r.x + r.w / 2, r.y + r.h - 28, { align: 'center', color: '#9dffd4' });
  else if (M.lines && M.bits <= 3 && M.copy) {
    for (let q = 0; q < lvOf(M.bits); q++) pill(c, String(q), r.x + 6, Y(qVal(q, M.bits)) - 10, { color: '#9dffd4' });
  }
}

// --- a battery-like file-size bar -------------------------------------------------------------------------------
function drawBattery(c, x, y, w, h, frac, top, bottom) {
  const bw = 30, bx = x + (w - bw) / 2, ty = y + 30, by = y + h - 30, bh = by - ty;
  rr(c, bx + bw / 2 - 7, ty - 5, 14, 6, 3); c.fillStyle = '#3a5550'; c.fill();
  rr(c, bx, ty, bw, bh, 9); c.fillStyle = '#0a1214'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#3d5d57'; c.stroke();
  const ix = bx + 3.5, iw = bw - 7, ih = bh - 7, fh = Math.max(0, ih * clamp01(frac));
  if (fh > 0.5) {
    c.save(); rr(c, ix, ty + 3.5, iw, ih, 6); c.clip();
    c.fillStyle = lg(c, 0, ty + 3.5 + ih, 0, ty + 3.5, [[0, '#4fe08f'], [0.6, '#ffc247'], [1, '#ff6b4a']]);
    c.fillRect(ix, ty + 3.5 + ih - fh, iw, fh);
    c.fillStyle = 'rgba(255,255,255,.2)'; c.fillRect(ix, ty + 3.5 + ih - fh, iw * 0.3, fh);
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1; c.beginPath();
    for (let yy = ty + 3.5 + ih; yy > ty + 3.5; yy -= 7) { c.moveTo(ix, yy); c.lineTo(ix + iw, yy); }
    c.stroke(); c.restore();
  }
  pill(c, top, x + w / 2, y + 4, { align: 'center', color: '#ffd9a3' });
  if (bottom) pill(c, bottom, x + w / 2, y + h - 24, { align: 'center', color: '#b8c2d8' });
}
// two horizontal bars for the file-size view
function drawBars(c, r, M, dt) {
  const t = T[lang], known = M.known, rows = [{ label: t.uncompressed, key: 'b1', val: M.size.bytes, col: ['#ffb85c', '#ff7a1c'] }];
  if (known) rows.push({ label: t.mp3Lbl, key: 'b2', val: M.size.mp3, col: ['#9fe0ff', '#3b9ae8'] });
  const rowH = Math.min(58, r.h / 2), MAXB = 300 * 24 * 44100 * 2 / 8;
  rows.forEach((row, i) => {
    const y0 = r.y + i * rowH, ty = y0 + 24, th = Math.min(22, rowH - 30);
    const target = known ? clamp01(row.val / MAXB) : 0;
    S[row.key] += (target - S[row.key]) * Math.min(1, dt * 7);
    pill(c, row.label, r.x, y0 + 1, { color: '#d3d9e8' });
    rr(c, r.x, ty, r.w, th, th / 2); c.fillStyle = '#0a1214'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#3d5d57'; c.stroke();
    const fw = Math.max(0, (r.w - 4) * S[row.key]);
    if (fw > 1) {
      const ww = Math.max(fw, th - 4);
      rr(c, r.x + 2, ty + 2, ww, th - 4, (th - 4) / 2); c.fillStyle = lg(c, 0, ty, 0, ty + th, [[0, row.col[0]], [1, row.col[1]]]); c.fill();
      c.fillStyle = 'rgba(255,255,255,.22)'; rr(c, r.x + 5, ty + 3.5, Math.max(0, ww - 6), (th - 4) / 3, 3); c.fill();
    }
    const txt = known ? sizeStr(row.val, row.val < 1e7 ? 2 : 1) : '?';
    c.font = `800 12px ${FONT}`;
    const tw = c.measureText(txt).width + 14, endX = r.x + 2 + Math.max(fw, 0);
    const px = endX + 6 + tw <= r.x + r.w ? endX + 6 : Math.max(r.x + 4, endX - tw - 6);
    pill(c, txt, px, ty + th / 2 - 10, { color: '#fff', stroke: 'rgba(255,255,255,.2)' });
  });
}

// --- the main picture ------------------------------------------------------------------------------------------------
function drawMain(c, w, h, dt, time) {
  const M = S.M; if (!M) return;
  const bottom = h - 64, topH = bottom - 10;
  if (M.v !== 'size') {
    const scope = { x: 10, y: 10, w: w - 20 - 68, h: topH };
    drawScope(c, scope, M, time);
    const target = M.known ? clamp01(M.bar.bytes / M.bar.max) : 0;
    S.barF += (target - S.barF) * Math.min(1, dt * 7);
    drawBattery(c, scope.x + scope.w + 8, 10, 60, topH, S.barF, M.known ? sizeStr(M.bar.bytes) : '?', T[lang].seconds(1));
  } else {
    const sh = Math.round(topH * 0.58);
    drawScope(c, { x: 10, y: 10, w: w - 20, h: sh }, M, time);
    drawBars(c, { x: 10, y: 10 + sh + 10, w: w - 20, h: topH - sh - 10 }, M, dt);
  }
}

// --- secret A: the wrong note ------------------------------------------------------------------------------------
function drawAlias(c, w, h, dt, time) {
  const t = T[lang], f = S.tone, fs = FS_A, fa = aliasHz(f), wrong = f > fs / 2;
  const r = { x: 10, y: 10, w: w - 20, h: h - 20 };
  panel(c, r, wrong ? '#7a4630' : '#2a4a44');
  const px0 = r.x + 14, px1 = r.x + r.w - 14, mid = r.y + r.h * 0.6, amp = r.h * 0.27, Tw = 0.006;
  const X = (tt) => px0 + tt / Tw * (px1 - px0), Y = (v) => mid - v * amp;
  c.save(); rr(c, r.x, r.y, r.w, r.h, 14); c.clip();
  c.lineWidth = 1; c.strokeStyle = 'rgba(255,255,255,.1)'; c.beginPath(); c.moveTo(px0, Y(0)); c.lineTo(px1, Y(0)); c.stroke();
  c.globalAlpha = wrong ? 0.6 : 1;
  glowLine(c, '#8fd0ff', 1.8, 8, () => { c.beginPath(); for (let i = 0; i <= 360; i++) { const tt = i / 360 * Tw, v = AMP * Math.cos(TAU * f * tt); if (i) c.lineTo(X(tt), Y(v)); else c.moveTo(X(tt), Y(v)); } });
  c.globalAlpha = 1;
  glowLine(c, '#ffa03a', 3, 10, () => { c.beginPath(); for (let i = 0; i <= 360; i++) { const tt = i / 360 * Tw, v = AMP * Math.cos(TAU * fa * tt); if (i) c.lineTo(X(tt), Y(v)); else c.moveTo(X(tt), Y(v)); } });
  c.lineWidth = 1; c.strokeStyle = 'rgba(255,160,58,.35)'; c.beginPath();
  for (let k = 0; k * (1 / fs) <= Tw + 1e-9; k++) { const tt = k / fs, v = AMP * Math.cos(TAU * f * tt); c.moveTo(X(tt), Y(0)); c.lineTo(X(tt), Y(v)); }
  c.stroke();
  for (let k = 0; k * (1 / fs) <= Tw + 1e-9; k++) {
    const tt = k / fs, v = AMP * Math.cos(TAU * f * tt), xx = X(tt), yy = Y(v);
    dot(c, xx, yy, 4.2); c.fillStyle = lg(c, xx - 4, yy - 4, xx + 4, yy + 4, [[0, '#fff1d6'], [1, '#ff8a1c']]); c.fill(); c.lineWidth = 1; c.strokeStyle = '#7a3a05'; c.stroke();
  }
  c.restore();
  legend(c, r.x + 8, r.y + 8, [{ col: '#8fd0ff', text: t.tone(fmt(f)) }]);
  legend(c, r.x + 8, r.y + 34, [{ col: '#ffa03a', text: `${t.legCopy}: ${fmt(fa)} Hz` }]);
  // the wheel: the copy sees the spoke jump by a small angle each measurement
  const cx = r.x + r.w - 46, cy = r.y + 48, rad = 26, d = TAU * f / fs, dw = d - TAU * Math.round(d / TAU);
  const stepP = time * 1.3, k0 = Math.floor(stepP), pe = k0 + ease(stepP - k0);
  rr(c, cx - rad - 8, cy - rad - 8, rad * 2 + 16, rad * 2 + 38, 14); c.fillStyle = 'rgba(8,11,18,.82)'; c.fill();
  dot(c, cx, cy, rad); c.fillStyle = lg(c, cx - rad, cy - rad, cx + rad, cy + rad, [[0, '#22303a'], [1, '#0d1419']]); c.fill(); c.lineWidth = 2; c.strokeStyle = '#4a6a64'; c.stroke();
  for (let j = 4; j >= 1; j--) {
    const a = (pe - j) * dw - Math.PI / 2;
    c.globalAlpha = 0.5 - j * 0.1; dot(c, cx + Math.cos(a) * (rad - 6), cy + Math.sin(a) * (rad - 6), 3); c.fillStyle = '#ffa03a'; c.fill();
  }
  c.globalAlpha = 1;
  const ang = pe * dw - Math.PI / 2;
  glowLine(c, '#ffa03a', 3, 8, () => { c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(ang) * (rad - 4), cy + Math.sin(ang) * (rad - 4)); });
  dot(c, cx, cy, 3); c.fillStyle = '#fff'; c.fill();
  c.font = `800 14px ${FONT}`; c.textBaseline = 'middle'; c.textAlign = 'center';
  c.fillStyle = '#8fd0ff'; c.fillText('↻', cx - 14, cy + rad + 17); c.fillStyle = '#e8edf7'; c.fillText('→', cx, cy + rad + 17);
  c.fillStyle = '#ffa03a'; c.fillText(dw < 0 ? '↺' : '↻', cx + 14, cy + rad + 17);
}

// --- secret B: telephone voice (the spectrum of a vowel-like sound) -----------------------------------------------
function drawVoice(c, w, h, dt, time) {
  const t = T[lang], r = { x: 10, y: 10, w: w - 20, h: h - 20 }, phone = S.ph;
  panel(c, r);
  const x0 = r.x + 16, x1 = r.x + r.w - 16, base = r.y + r.h - 40, maxH = r.h - 100, MAXF = 10000;
  const X = (hz) => x0 + hz / MAXF * (x1 - x0), sy = Math.floor(time * 0.9) % 3, { f0, fm } = SYL[sy];
  c.save(); rr(c, r.x, r.y, r.w, r.h, 14); c.clip();
  if (phone) { c.fillStyle = 'rgba(255,70,60,.1)'; c.fillRect(X(3400), r.y, r.x + r.w - X(3400), r.h); }
  c.lineWidth = 1; c.setLineDash([4, 4]); c.strokeStyle = 'rgba(255,255,255,.4)'; c.beginPath(); c.moveTo(X(3400), r.y + 34); c.lineTo(X(3400), base + 4); c.stroke(); c.setLineDash([]);
  c.lineCap = 'round';
  for (let i = 0; i < 100; i++) {
    const hz = (i + 1) * f0, tg = hz <= MAXF ? clamp01(wgt(hz, fm) / 1.25) : 0;
    S.vb[i] += (tg - S.vb[i]) * Math.min(1, dt * 7);
    const bh = S.vb[i] * maxH; if (bh < 0.5 || hz > MAXF) continue;
    const kept = !phone || hz <= 3400, hi = hz > 3400;
    c.lineWidth = Math.max(2, Math.min(4, (x1 - x0) * f0 / MAXF * 0.6));
    c.strokeStyle = kept ? (hi ? '#7ad7ff' : '#ffa03a') : 'rgba(150,120,120,.4)';
    if (kept) { c.shadowColor = hi ? '#7ad7ff' : '#ffa03a'; c.shadowBlur = 6; } else c.shadowBlur = 0;
    c.beginPath(); c.moveTo(X(hz), base); c.lineTo(X(hz), base - bh); c.stroke();
  }
  c.shadowBlur = 0;
  c.strokeStyle = 'rgba(100,255,180,.35)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x0 - 6, base + 1); c.lineTo(x1 + 6, base + 1); c.stroke();
  c.restore();
  pill(c, phone ? `${fmt(8000)} ☎` : fmt(44100), r.x + 8, r.y + 8, { color: '#ffd9a3' });
  pill(c, `${fmt(3400)} Hz`, X(3400), r.y + 34, { align: 'center', color: '#fff' });
  pill(c, '0', x0, base + 10, { align: 'center' });
  pill(c, `${fmt(MAXF)} Hz`, x1, base + 10, { align: 'right' });
  if (phone) pill(c, t.cut, X(3400) + 10, r.y + 62, { color: '#ff9a8f' });
  pill(c, t.kept, X(3400) - 10, r.y + 62, { align: 'right', color: '#ffd9a3' });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {

// --- prediction thumbnails ---------------------------------------------------------------------------------------
function thumb(cv, kind) {
  const W = 84, H = 48, d = 2; cv.width = W * d; cv.height = H * d; cv.style.width = `${W}px`; cv.style.height = `${H}px`;
  const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0);
  rr(c, 0, 0, W, H, 8); c.fillStyle = lg(c, 0, 0, 0, H, [[0, '#0c1f1c'], [1, '#050d0d']]); c.fill();
  c.strokeStyle = 'rgba(100,255,180,.18)'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, H / 2); c.lineTo(W, H / 2); c.stroke();
  const X = (u) => 8 + u * (W - 16), Y = (v) => H / 2 - v * 17;
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (kind === 0) glowLine(c, '#8fd0ff', 2, 5, () => { c.beginPath(); for (let i = 0; i <= 60; i++) { const u = i / 60; if (i) c.lineTo(X(u), Y(wave(u))); else c.moveTo(X(u), Y(wave(u))); } });
  else if (kind === 1) glowLine(c, '#ffa03a', 2, 5, () => { c.beginPath(); for (let k = 0; k < 4; k++) { const y = Y(wave(k / 4)); if (k) c.lineTo(X(k / 4), y); else c.moveTo(X(k / 4), y); c.lineTo(X((k + 1) / 4), y); } });
  else glowLine(c, '#aab4c8', 2, 0, () => { c.beginPath(); c.moveTo(X(0), Y(0)); c.lineTo(X(1), Y(0)); });
}

// --- render: controls, readout, state card ----------------------------------------------------------------------
const showStage = () => {
  const r = stage.getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) stage.scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function buildQuestion(id, t, qText, opts, picked, right, thumbs) {
  const key = `${lang}|${picked}`;
  if (S.qk[id] === key) return;
  S.qk[id] = key;
  $(`${id}t`).textContent = qText;
  $(`${id}o`).innerHTML = opts.map((o, i) => {
    const cls = picked === null ? '' : i === right ? ' good' : i === picked ? ' bad' : '';
    return `<button class="ss-opt${thumbs ? '' : ' num'}${cls}" data-act="${id}" data-i="${i}"${picked !== null ? ' disabled' : ''}>${thumbs ? '<canvas></canvas>' : ''}<span>${esc(o)}</span></button>`;
  }).join('');
  if (thumbs) $(`${id}o`).querySelectorAll('canvas').forEach((cv, i) => thumb(cv, i));
  const v = $(`${id}v`);
  if (picked === null) { v.textContent = ''; v.className = 'ss-v'; }
  else { const ok = picked === right; v.textContent = ok ? t.right : t.notQuite; v.className = `ss-v ${ok ? 'ok' : 'no'}`; }
}
const stops = (id, list, cur, act, fmtFn) => {
  $(id).innerHTML = list.map((v, i) => `<button data-act="${act}" data-i="${i}" class="${i === cur ? 'on' : ''}">${esc(fmtFn(v))}</button>`).join('');
};
const setVal = (el, v) => { if (el.value !== String(v)) el.value = v; };
const colorOf = { sample: '#ffa03a', levels: '#4fe08f', size: '#8fd0ff', a: '#ffa03a', b: '#ffa03a' };

function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  S.M = buildM(); const M = S.M;
  $('vSample').hidden = !(v === 'sample' && !sec); $('vLevels').hidden = !(v === 'levels' && !sec); $('vSize').hidden = !(v === 'size' && !sec);
  $('vSecA').hidden = sec !== 'a'; $('vSecB').hidden = sec !== 'b';
  const open = secret.unlocked();
  const sc = (k, emo, key) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('a', '🌀', 'alias') + sc('b', '📞', 'phone');
  const ex = `<div class="fine">${esc(t.fine)}</div>`;

  } else if (sec === 'b') {

    $('stBtn').textContent = S.st ? t.stereo : t.mono; $('stBtn').classList.toggle('on', S.st);

// --- events --------------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-k]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'q1') { S.q1 = i; S.revAt = now(); S.chgAt = now(); (i === 1 ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  if (act === 'q2') { S.q2 = i; S.bi = 2; S.revAt = now(); S.chgAt = now(); (i === 2 ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  if (act === 'q3') { S.q3 = i; S.r3 = 2; S.b3 = 1; S.secs = 180; S.st = true; S.revAt = now(); (i === 1 ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  if (act === 'stop1') { S.si = i; stopAudio(); S.chgAt = now(); sfx.tick(); }
  else if (act === 'stop2') { S.bi = i; stopAudio(); S.chgAt = now(); sfx.tick(); }
  else if (act === 'stop3a') { S.r3 = i; S.chgAt = now(); sfx.tick(); }
  else if (act === 'stop3b') { S.b3 = i; S.chgAt = now(); sfx.tick(); }
  else if (act === 'secs') { S.secs = +b.dataset.n; sfx.tick(); }
  else if (act === 'stereo') { S.st = !S.st; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; stopAudio(); S.chgAt = now(); sfx.click();
  } else if (b.dataset.k) {
    if (cur && cur.key === b.dataset.k) { stopAudio(); return; }
    playKey(b.dataset.k); return;
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, val = +ev.target.value;
  if (id === 'r1') { if (S.si !== val) { S.si = val; stopAudio(); S.chgAt = now(); } }
  else if (id === 'r2') { if (S.bi !== val) { S.bi = val; stopAudio(); S.chgAt = now(); } }
  else if (id === 'r3') { S.r3 = val; S.chgAt = now(); }
  else if (id === 'r3b') { S.b3 = val; S.chgAt = now(); }
  else if (id === 'r3c') S.secs = val;
  else if (id === 'rA') { S.tone = val; stopAudio(); }
  else return;
  render();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAudio(); });
render();
</script>
</body>
</html>
