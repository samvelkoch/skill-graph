// --- one draw per frame -----------------------------------------------------------------------------------------
function tick(t) {
  for (const d of [S.day, S.noon]) {
    if (d && !d.done && t - d.t0 >= d.end) { d.done = true; (d.queue > 0 ? sfx.bad : sfx.good)(); render(); }
  }
}
const loop = canvasLoop($('cv'), (c, w, h, dt, t) => {
  const tn = now(); tick(tn);
  if (S.tPlaying) { S.tp = Math.min(1, S.tp + dt / 7); if (S.tp >= 1) { S.tPlaying = false; render(); } else if (lab.view === 'day' && S.sec === 'tulip') { $('tul').value = Math.round(S.tp * 1000); readout(); } }
  const u = Math.min(w / DW, h / DH); G.u = u; G.ox = (w - DW * u) / 2; G.oy = (h - DH * u) / 2;
  c.save(); c.translate(G.ox, G.oy); c.scale(u, u);
  const v = lab.view;
  if (v === 'day') { if (S.sec === 'tulip') drawTulip(c, tn, dt); else drawDay(c, tn, dt); }
  else if (v === 'price') drawPrice(c, tn, dt);
  else if (S.part === 'year' && S.checked) drawYear(c, tn, dt);
  else drawChain(c, tn, dt);
  c.restore();
  if (v === 'day' && ((S.day && !S.day.done) || (S.noon && !S.noon.done))) readout();
});

// --- the chain's marks ---------------------------------------------------------------------------------------------
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'chain' || S.part !== 'chain' || S.checked) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.u, y = (ev.clientY - r.top - G.oy) / G.u;
  for (let i = 0; i < 4; i++) for (let k = 0; k < 2; k++) {
    const px = 140, py = 12 + i * 100 + 4 + k * 40;
    if (x >= px && x <= px + 176 && y >= py && y <= py + 36) { S.marks[i][k] ^= 1; sfx.tick(); render(); return; }
  }
});

// --- controls ----------------------------------------------------------------------------------------------------------
const resetDay = () => { S.day = null; };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'w') { S.weather = b.dataset.v; resetDay(); sfx.click(); }
  else if (act === 'open') { S.day = makeDay(S.weather, S.price, 30, now(), S.weather === 'hot' ? 0.16 : 0.3); sfx.click(); showStage(); }
  else if (act === 'w2') { S.w2 = b.dataset.v; S.ghost = null; S.reveal2 = false; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    sfx.click();
    if (S.sec === k) { S.sec = null; S.tPlaying = false; }
    else { S.sec = k; S.tPlaying = false; if (k === 'noon') { S.noon = makeDay('hot', 0.5, 30, now(), 0.15); showStage(); } else { S.tp = 0; S.tPlaying = true; showStage(); } }
  }
  else if (act === 'play') { if (S.tp >= 1) S.tp = 0; S.tPlaying = !S.tPlaying; sfx.click(); }
  else if (act === 'replay') { S.noon = makeDay('hot', 0.5, 30, now(), 0.15); sfx.click(); showStage(); }
  else if (act === 'check') { S.checked = true; S.checkAt = now(); const k = KEY.filter((kk, i) => kk[0] === S.marks[i][0] && kk[1] === S.marks[i][1]).length; (k === 4 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'again') { S.checked = false; S.marks = [[0, 0], [0, 0], [0, 0], [0, 0]]; S.part = 'chain'; sfx.click(); }
  else if (act === 'part') { S.part = b.dataset.p; sfx.click(); if (S.part === 'year') showStage(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'pr1') { S.price = v; resetDay(); }
  else if (id === 'stk') { S.stock = v; S.ghost = null; S.reveal2 = false; }
  else if (id === 'pr2') { S.price2 = v; S.ghost = null; S.reveal2 = false; }
  else if (id === 'mon') { S.month = v; }
  else if (id === 'tul') { S.tp = v / 1000; S.tPlaying = false; }
  else return;
  sfx.tick(); render();
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.q === 'day') { S.ansDay = +b.dataset.a; S.askedDay = true; S.boardOpen = true; store.set('ice:askedDay', true); (S.ansDay === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (b.dataset.q === 'pr') { S.ansPr = +b.dataset.a; S.askedPr = true; S.reveal2 = true; S.ghost = 15; S.stock = 30; store.set('ice:askedPr', true); (S.ansPr === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (b.dataset.go) { S.boardOpen = false; sfx.click(); }
  render();
});

// --- render: readout, state card, facts and controls ----------------------------------------------------------------
function readout() {
  const t = T[lang], v = lab.view;
  if (v === 'day') {
    if (S.sec === 'tulip') { const up = S.tp < 0.8; lab.setReadout(up ? '📈' : '📉', t.sec.tSub, up ? t.sec.up : t.sec.down, up ? '#ff7aa8' : '#e5484d'); return; }
    if (S.sec === 'noon') {
      const d = S.noon, st = dayStats(d, now()), f = clamp((st.el - 0.25) / d.per + 1, 0, d.n), hh = hourOf(f);
      lab.setReadout(fmtHour(Math.min(hh, 17.99)), t.sec.nSub(coins(0.5)), st.sold >= 30 ? t.sec.nPill : '', '#ff9a4d'); return;
    }
    if (!S.askedDay || (S.ansDay !== null && S.boardOpen)) { lab.setReadout('?', '', '', '#ffb347'); return; }
    const d = S.day, st = dayStats(d, now()), q = t.day;
    if (!d || st.el < 0) { lab.setReadout('—', q.press, '', '#ffb347'); return; }
    const price = d.price;
    if (st.done) lab.setReadout(`${numS(d.coins)} <small style="font-size:15px;color:var(--mut);font-weight:700">${coinWord(d.coins)}</small>`, `${q.earned} · ${q.sold} ${d.sold} · ${q.melt} ${d.left}`, d.queue > 0 ? q.nothing(ppl(d.queue)) : '', '#ffb347');
    else lab.setReadout(`${numS(st.sold * price)} <small style="font-size:15px;color:var(--mut);font-weight:700">${coinWord(st.sold * price)}</small>`, `${q.earned} · ${q.sold} ${st.sold} · ${q.inFr} ${30 - st.sold}`, '', '#ffb347');
  } else if (v === 'price') {
    const pp = t.pr;
    if (!S.askedPr) { lab.setReadout('?', '', '', '#6fe3ff'); return; }
    const D = DEM[S.w2](S.price2), q = Math.max(0, D - S.stock), l = Math.max(0, S.stock - D);
    lab.setReadout(`${q} / ${l}`, pp.sub, q === 0 && l === 0 ? pp.ok : q > 0 ? pp.qp : pp.lp, q === 0 && l === 0 ? '#2fbf80' : q > 0 ? '#e5484d' : '#3b82f6');
  } else {
    const c = t.ch;
    if (!S.checked) { lab.setReadout('?', c.sub0, '', '#8e7dff'); return; }
    if (S.part === 'year') { const n = SUPPLY[S.month - 1]; lab.setReadout(t.yr.months[S.month - 1], t.yr.sub(n, coins(BPRICE[S.month - 1])), n >= 9 ? t.yr.lots : n <= 3 ? t.yr.few : '', '#ff6b78'); return; }
    const k = KEY.filter((kk, i) => kk[0] === S.marks[i][0] && kk[1] === S.marks[i][1]).length;
    lab.setReadout(c.rightN(k), c.rightSub, '', k === 4 ? '#2fbf80' : '#f5c84c');
  }
}
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = v;
  $('icDay').style.display = v === 'day' ? '' : 'none'; $('icPrice').style.display = v === 'price' ? '' : 'none'; $('icChain').style.display = v === 'chain' ? '' : 'none';
  $('fine').textContent = v === 'day' && S.askedDay && !(S.ansDay !== null && S.boardOpen) ? t.day.modelNote + ' ' + t.model : t.model;
  let ask = null;
  if (v === 'day') {
    const q = t.day, asking = !S.askedDay, board = S.ansDay !== null && S.boardOpen, tul = S.sec === 'tulip', noon = S.sec === 'noon';
    $('dayMain').classList.toggle('ic-hide', asking || board || !!S.sec); $('tulCtl').classList.toggle('ic-hide', !tul); $('noonCtl').classList.toggle('ic-hide', !noon);
    document.querySelectorAll('#dayW .chip').forEach((b) => { b.textContent = t.w[b.dataset.v]; b.classList.toggle('on', b.dataset.v === S.weather); });
    $('l1').textContent = q.priceL; $('pv1').textContent = coins(S.price); $('pr1').value = S.price; $('e0').textContent = numS(0.5); $('e1').textContent = coins(4);
    $('openBtn').textContent = q.open; $('openBtn').disabled = !!S.day && !S.day.done;
    $('playBtn').textContent = S.tPlaying ? '⏸' : t.sec.tPlay; $('lt').textContent = t.sec.tTime; $('tul').value = Math.round(S.tp * 1000); $('replayBtn').textContent = t.sec.nAgain;
    const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`;
    $('secChips').innerHTML = sc('tulip', '🌷') + sc('noon', '⏰');
    // state card and facts
    const F = (k) => ({ emo: k === 'tulip' ? '🌷' : k === 'smith' ? '📖' : '🏺', text: t.facts[k], src: SRC[k] });
    if (tul) { lab.setState({ emo: '🌷', title: t.sec.tl[0], lead: t.sec.tl[1], body: t.sec.tl[2] }); lab.setFacts([F('tulip')]); lab.setGlow('rgba(255,122,168,.3)'); }
    else if (noon) {
      const d = S.noon, done = d.done; lab.setGlow('rgba(255,154,77,.3)');
      if (done) { const [a, b] = t.sec.nDone(coins(0.5), ppl(d.queue)); lab.setState({ emo: '⏰', title: t.sec.noon[0], lead: a, body: b }); }
      else lab.setState({ emo: '⏰', title: t.sec.nPre[0], lead: t.sec.nPre[1], body: t.sec.nPre[2] });
      lab.setFacts([F('oiko'), F('smith')]);
    } else {
      lab.setGlow('rgba(255,179,71,.3)'); lab.setFacts([F('smith'), F('oiko')]);
      const d = S.day, st = dayStats(d, now());
      if (asking || board) lab.setState({ emo: '🤔', title: q.q.title, lead: q.q.lead, body: '' });
      else if (!d) lab.setState({ emo: '🍦', title: q.pre[0], lead: q.pre[1], body: q.pre[2] });
      else if (!st.done) lab.setState({ emo: '⏳', title: q.run[0], lead: q.run[1], body: '' });
      else if (d.queue > 0) lab.setState({ emo: '😠', title: q.queue[0], lead: q.queue[1](d.sold, d.queue, ppl), body: q.queue[2] });
      else if (d.left > 0) lab.setState({ emo: '🫠', title: q.left[0], lead: q.left[1](d.left, ic), body: q.left[2](d.sold, ppl) });
      else lab.setState({ emo: '🎉', title: q.ok[0], lead: q.ok[1], body: q.ok[2] });
    }
    // the question and the board
    if (asking && !S.sec) ask = `<div class="q">${esc(q.ask.q)}</div><div class="opts">${q.ask.opts.map((o, i) => `<button data-q="day" data-a="${i}">${esc(o)}</button>`).join('')}</div>`;
    else if (board && !S.sec) {
      const A = q.ask, a = S.ansDay, cell = (w, p) => { const r = playDay(w, p, 30); return `<div class="ic-cell"><b>${esc(t.wn[w])} · ${esc(coins(p))}</b>${esc(q.cell.sold(r.sold))}<br>${esc(r.queue > 0 ? q.cell.nothing(r.queue) : r.left > 0 ? q.cell.melt(r.left) : q.cell.none)}</div>`; };
      ask = `<div class="verdict" style="color:${a === 0 ? 'var(--ok)' : 'var(--wip)'}">${esc(a === 0 ? A.right : A.wrong)}</div><p>${esc(A.t)}</p><p><b>${esc(A.board)}</b></p>
        <div class="ic-board">${cell('hot', 0.5)}${cell('hot', 1.5)}${cell('rain', 0.5)}${cell('rain', 1.5)}</div><div class="opts"><button data-go="1">${esc(A.go)} →</button></div>`;
    }
  } else if (v === 'price') {
    const pp = t.pr, asking = !S.askedPr, w = S.w2, D = DEM[w](S.price2), qn = Math.max(0, D - S.stock), l = Math.max(0, S.stock - D);
    $('prMain').classList.toggle('ic-hide', asking);
    document.querySelectorAll('#prW .chip').forEach((b) => { b.textContent = t.w[b.dataset.v]; b.classList.toggle('on', b.dataset.v === w); });
    $('l2').textContent = pp.stockL; $('pv2').textContent = ic(S.stock); $('stk').value = S.stock; $('l3').textContent = pp.priceL; $('pv3').textContent = coins(S.price2); $('pr2').value = S.price2;
    lab.setGlow('rgba(111,227,255,.28)'); lab.setFacts([{ emo: '📖', text: t.facts.smith, src: SRC.smith }]);
    if (asking) lab.setState({ emo: '🤔', title: pp.ask.q, lead: pp.pre[0] + '. ' + pp.pre[1], body: '' });
    else if (S.reveal2 && S.ansPr !== null) lab.setState({ emo: '📈', title: S.ansPr === 0 ? pp.ask.right : pp.ask.wrong, lead: pp.ask.t, body: '' });
    else if (qn === 0 && l === 0) lab.setState({ emo: '🎉', title: pp.okS[0](coins(S.price2)), lead: pp.okS[1], body: pp.okS[2] });
    else if (qn > 0) lab.setState({ emo: '😠', title: pp.qS[0], lead: pp.qS[1](qn, ppl), body: pp.qS[2] });
    else lab.setState({ emo: '🫠', title: pp.lS[0], lead: pp.lS[1](ic(l)), body: DEM[w](0.5) < S.stock ? pp.lowS(coins(0.5), ppl(DEM[w](0.5))) : pp.lS[2]() });
    if (asking) ask = `<div class="q">${esc(pp.ask.q)}</div><div class="opts">${pp.ask.opts.map((o, i) => `<button data-q="pr" data-a="${i}">${esc(o)}</button>`).join('')}</div>`;
  } else {
    const c = t.ch, y = S.part === 'year' && S.checked;
    $('chkBtn').textContent = c.check; $('chkBtn').style.display = S.checked ? 'none' : ''; $('chkBtn').disabled = !S.marks.some((m) => m[0] || m[1]);
    $('pChain').textContent = c.tabs[0]; $('pYear').textContent = c.tabs[1]; $('againBtn').textContent = c.again;
    for (const id of ['pChain', 'pYear', 'againBtn']) $(id).style.display = S.checked ? '' : 'none';
    $('pChain').classList.toggle('on', S.part === 'chain'); $('pYear').classList.toggle('on', S.part === 'year');
    $('yearCtl').style.display = y ? '' : 'none'; $('lm').textContent = t.yr.month; $('mv').textContent = t.yr.months[S.month - 1]; $('mon').value = S.month;
    lab.setGlow('rgba(142,125,208,.3)');
    if (y) { const n = SUPPLY[S.month - 1]; lab.setState({ emo: '🍓', title: t.yr.title, lead: n >= 9 ? t.yr.lead[0] : n <= 3 ? t.yr.lead[1] : t.yr.lead[2], body: t.yr.body }); lab.setFacts([{ emo: '🏺', text: t.facts.oiko, src: SRC.oiko }]); }
    else if (S.checked) { lab.setState({ emo: '🔗', title: c.done[0], lead: c.done[1], body: c.done[2] }); lab.setFacts([{ emo: '🏺', text: t.facts.oiko, src: SRC.oiko }]); }
    else { lab.setState({ emo: '🤔', title: c.pre[0], lead: c.pre[1], body: '' }); lab.setFacts([{ emo: '🏺', text: t.facts.oiko, src: SRC.oiko }]); }
  }
  askEl.classList.toggle('ic-hide', !ask); if (ask) askEl.innerHTML = ask;
  readout();
}
render();
</script>
