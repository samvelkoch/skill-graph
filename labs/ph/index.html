  const fp = () => { ctx.beginPath(); ctx.moveTo(cx - 11, fTop); ctx.lineTo(cx - 11, fTop + nh); ctx.lineTo(cx - FW / 2 + 2, fBot - 10); ctx.quadraticCurveTo(cx - FW / 2, fBot, cx - FW / 2 + 12, fBot); ctx.lineTo(cx + FW / 2 - 12, fBot); ctx.quadraticCurveTo(cx + FW / 2, fBot, cx + FW / 2 - 2, fBot - 10); ctx.lineTo(cx + 11, fTop + nh); ctx.lineTo(cx + 11, fTop); };
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(cx + 3, fBot + 3, FW * 0.56, 5, 0, 0, 7); ctx.fill();
  fp(); ctx.fillStyle = 'rgba(190,215,255,.07)'; ctx.fill();
  ctx.save(); fp(); ctx.clip();
  const fg = ctx.createLinearGradient(cx - FW / 2, 0, cx + FW / 2, 0); fg.addColorStop(0, rgba(lit(col, 0.3))); fg.addColorStop(0.5, rgba(col)); fg.addColorStop(1, rgba(lit(col, -0.32)));
  ctx.fillStyle = fg; ctx.fillRect(cx - FW / 2 - 2, surf, FW + 4, fBot - surf + 2);
  ctx.fillStyle = rgba(lit(col, 0.45), 0.65); ctx.beginPath(); ctx.ellipse(cx, surf, FW * 0.3, 3, 0, 0, 7); ctx.fill();
  ctx.restore();
  fp(); ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(225,238,255,.55)'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; rr(ctx, cx - 8, fTop + 4, 3.5, nh - 2, 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, fTop, 13, 3.5, 0, 0, 7); ctx.strokeStyle = 'rgba(235,245,255,.6)'; ctx.stroke();
  ctx.restore();
  // drops
  S.drops = S.drops.filter((d) => nowT - d.t0 < 0.4);
  for (const d of S.drops) { const q = (nowT - d.t0) / 0.38; if (q < 0) continue; const y = lerp(tipY, surf, q * q); ctx.fillStyle = rgba(lit(alk, 0.1)); ctx.beginPath(); ctx.arc(cx, y, 3.6, 0, 7); ctx.fill(); }
  // labels
  const T_ = T[lang], lx = cx + 18;
  pill(ctx, `${T_.neu.alk} ${nf(0.1)} ${T_.molL}`, lx, bTop + 14, { align: 'left' });
  pill(ctx, `${T_.neu.acid} ${nf(25)} ${T_.mL}`, cx + FW / 2 + 8, fBot - fH * 0.4, { align: 'left' });
  // chart
  drawChart(ctx, L.ch, S.nAns === null, t);
}

// --- secret 1: mystery tubes -------------------------------------------------------------------------------------------
function newMys() {
  const ids = SUBS.map((s) => s.id);
  let pick;
  do { pick = []; while (pick.length < 3) { const id = ids[Math.floor(Math.random() * ids.length)]; if (!pick.includes(id)) pick.push(id); } }
  while (new Set(pick.map((id) => kindOf(SUB[id].ph))).size < 2);
  S.my = { subs: pick, tested: [0, 0, 0], named: [null, null, null], sel: -1 };
}
function drawMys(ctx, w, h, dt, t) {
  const L = layMys(w, h), M = S.my, nowT = now(), marks = [];
  const clear = [205, 224, 238];
  for (let i = 0; i < 3; i++) {
    const sp = SUB[M.subs[i]], cx = L.xs[i], at = M.tested[i], q = at ? eio((nowT - at) / 0.9) : 0;
    const col = mixc(clear, colAt(sp.ph), q);
    if (M.sel === i) { rr(ctx, cx - L.tw / 2 - 14, L.top - 18, L.tw + 28, L.bot - L.top + 36, 20); ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.stroke(); }
    drawTube(ctx, cx, L.top, L.bot, L.tw, 0.62, col, { la: lerp(0.4, 1, q), swirl: at ? Math.sin(Math.PI * c01((nowT - at) / 1.2)) : 0, sc: colAt(sp.ph), t });
    if (at && nowT - at < 0.5) { const dq = (nowT - at) / 0.5, ly = L.bot - (L.bot - L.top) * 0.62; ctx.fillStyle = rgba(colAt(7)); ctx.beginPath(); ctx.arc(cx, lerp(L.top - 30, ly, dq * dq), 5, 0, 7); ctx.fill(); }
    const nm = M.named[i], right = nm && nm === kindOf(sp.ph);
    pill(ctx, 'ABC'[i], cx, L.bot + 24, { size: 14, bg: M.sel === i ? '#fff' : 'rgba(10,12,24,.84)', fg: M.sel === i ? '#0A0C14' : '#fff', pad: 12 });
    if (nm) {
      marks.push({ ph: sp.ph, label: 'ABC'[i] });
      pill(ctx, `${right ? '✓' : '✗'} ${sp.emo} ${T[lang].subs[sp.id][1]}`, cx, L.bot + 50, { size: 12, stroke: right ? '#3ddc97' : '#f5c84c' });
    }
  }
  drawScale(ctx, 12, L.barY, w - 24, marks);
  if (!M.tested.some(Boolean)) pill(ctx, '👆 ' + T[lang].mys.pick, w / 2, 28, { size: 13 });
}

// --- secret 2: the sea ---------------------------------------------------------------------------------------------------
function drawSea(ctx, w, h, dt, t) {
  const R = Math.min(w * 0.2, 92), oy = Math.max(0, (h - 330) / 2 - 10), cy = oy + 52 + R, xs = [w * 0.27, w * 0.73], d = Math.round((8.2 - S.sea) * 100) / 100, N2 = Math.round(100 * Math.pow(10, d));
  const sea = [40, 110, 170], T_ = T[lang];
  pill(ctx, `${T_.sea.then} · pH ${nf(8.2, 1)}`, xs[0], oy + 22, { size: 13 });
  pill(ctx, `pH ${nfx(S.sea, 2)}`, xs[1], oy + 22, { size: 13 });
  drawLens(ctx, xs[0], cy, R, sea, POOL_S, S.sAl1, 100, t, R * 0.03, dt);
  drawLens(ctx, xs[1], cy, R, sea, POOL_S, S.sAl2, N2, t, R * 0.03, dt);
  ctx.save(); ctx.font = `900 26px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillText('→', w / 2, cy); ctx.restore();
  pill(ctx, T_.sea.dots(100), xs[0], cy + R + 20, { size: 12 });
  pill(ctx, T_.sea.dots(N2), xs[1], cy + R + 20, { size: 12 });
  // second picture: the same numbers as bars
  const by = cy + R + 62, bx = 78, bmax = Math.max(40, w - bx - 56);
  [[100, `pH ${nf(8.2, 1)}`, '#6FA8E0'], [N2, `pH ${nfx(S.sea, 2)}`, '#FFD66B']].forEach(([n, lab_, c], i) => {
    const y = by + i * 34, len = (n / 330) * bmax;
    pill(ctx, lab_, 8, y, { align: 'left', size: 12 });
    const g = ctx.createLinearGradient(0, y - 9, 0, y + 9); g.addColorStop(0, rgba(lit(hx(c), 0.25))); g.addColorStop(1, rgba(lit(hx(c), -0.25)));
    rr(ctx, bx, y - 9, Math.max(6, len), 18, 9); ctx.fillStyle = g; ctx.fill();
    pill(ctx, String(n), bx + Math.max(6, len) + 6, y, { align: 'left', size: 12 });
  });
}

// --- main loop -----------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  CW = w; CH = h;
  const mode = S.sec || lab.view;
  if (mode === 'test') drawTest(ctx, w, h, dt, t);
  else if (mode === 'dilute') drawDil(ctx, w, h, dt, t);
  else if (mode === 'neutral') drawNeu(ctx, w, h, dt, t);
  else if (mode === 'mys' && S.my) drawMys(ctx, w, h, dt, t);
  else if (mode === 'sea') drawSea(ctx, w, h, dt, t);
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec !== 'mys' || !S.my) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, L = layMys(r.width, r.height);
  if (y < L.top - 20 || y > L.bot + 20) return;
  const i = L.xs.findIndex((cx) => Math.abs(x - cx) < L.tw / 2 + 16);
  if (i >= 0) mysSelect(i);
});

// --- controls ----------------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function mysSelect(i) {
  const M = S.my; M.sel = i;
  if (!M.tested[i]) { M.tested[i] = now(); sfx.click(); } else sfx.tick();
  render();
}
function addV(d10) {
  if (S.nAns === null || S.V10 >= 500) return;
  S.V10 = Math.min(500, S.V10 + d10);
  S.pts.push({ v: S.V10 / 10, ph: titr(S.V10) });
  const n = d10 >= 50 ? 8 : d10 >= 10 ? 4 : 2, t0 = now();
  for (let i = 0; i < n; i++) S.drops.push({ t0: t0 + i * 0.07 });
  (S.V10 === 250 ? sfx.good : sfx.tick)();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'pick') {
    const id = b.dataset.id; S.sel = id; sfx.click();
    if (S.tested[id]) { S.phase = 'done'; S.pred = null; } else { S.phase = 'predict'; S.pred = null; }
    showStage();
  } else if (act === 'dil') {
    if (S.kAns && S.k < 6) { S.k++; S.pourT = now(); sfx.push(); }
  } else if (act === 'dreset') { S.k = 0; S.pourT = -9; sfx.click(); }
  else if (act === 'add') addV(+b.dataset.d);
  else if (act === 'nreset') { S.V10 = 0; S.pts = [{ v: 0, ph: 1 }]; S.drops = []; sfx.click(); }
  else if (act === 'curve') { S.curve = !S.curve; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'mys') newMys(); else S.sea = 8.1; }
    sfx.click(); showStage();
  } else if (act === 'mysel') mysSelect(+b.dataset.i);
  else if (act === 'name') {
    const M = S.my, i = M.sel, ok = b.dataset.k === kindOf(SUB[M.subs[i]].ph);
    M.named[i] = b.dataset.k; (ok ? sfx.good : sfx.bad)();
    const nxt = [0, 1, 2].find((j) => M.named[j] === null); if (nxt !== undefined && nxt !== i && !M.tested[nxt]) M.sel = i;
  } else if (act === 'mynew') { newMys(); sfx.click(); }
  render();
});
$('phRange').addEventListener('input', (ev) => { S.sea = +ev.target.value; render(); });
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const m = b.dataset.m;
  if (m === 'test') { S.pred = b.dataset.a; S.phase = 'pour'; S.pourStart = now(); sfx.click(); }
  else if (m === 'dil') { S.kAns = true; S.kPred = b.dataset.a; S.k = 1; S.pourT = now(); (b.dataset.a === '3' ? sfx.good : sfx.bad)(); showStage(); }
  else if (m === 'neu') { S.nAns = +b.dataset.a; (S.nAns === 1 ? sfx.good : sfx.bad)(); showStage(); }
  render();
});

// --- render: controls, readout, state card and facts ------------------------------------------------------------------------------
const rgbStr = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
function render() {
  const t = T[lang], mode = S.sec || lab.view;
  document.body.dataset.v = mode;
  const secs = { test: 'phTest', dilute: 'phDil', neutral: 'phNeu', mys: 'phMys', sea: 'phSea' };
  for (const [m, id] of Object.entries(secs)) $(id).style.display = m === mode ? '' : 'none';
  const open = secret.unlocked();
  $('phSecChips').innerHTML = [['mys', '🕵️', 's1'], ['sea', '🌊', 's2']].map(([k, emo, s]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[s][0])}` : '🔒 ???'}</button>`).join('');
  askEl.hidden = true;
  if (mode === 'test') renderTest(t); else if (mode === 'dilute') renderDil(t); else if (mode === 'neutral') renderNeu(t);
  else if (mode === 'mys') renderMys(t); else renderSea(t);
  placeAsk();
}
function renderTest(t) {
  lab.setGlow('rgba(150, 80, 190, .28)');
  const tt = t.test, sp = S.sel && SUB[S.sel];
  $('phShelfLbl').textContent = tt.shelf;
  $('phShelf').innerHTML = SHELF.map((id) => `<button class="chip ph-bot ${S.sel === id ? 'on' : ''}" data-act="pick" data-id="${id}"><span>${SUB[id].emo}</span>${esc(t.subs[id][1])}${S.tested[id] ? `<i class="ph-dot" style="background:${rgbStr(colAt(SUB[id].ph))}"></i>` : ''}</button>`).join('');
  lab.setFacts(t.facts.test);
  const nT = Object.keys(S.tested).length, rack = nT ? `<div>${esc(tt.rack(nT))}</div>` : '';
  if (!sp) {
    lab.setReadout('pH ?', '', '', '#8a6fe0');
    lab.setState({ emo: '🥬', title: tt.introTitle, lead: tt.introLead, body: tt.introBody, extra: rack });
    return;
  }
  const name = t.subs[sp.id][0];
  if (S.phase === 'predict') {
    lab.setReadout('pH ?', '', '', '#8a6fe0');
    lab.setState({ emo: sp.emo, title: `${name}: ${tt.q}`, lead: tt.predLead, body: '', extra: rack });
    askEl.className = 'ph-ask'; askEl.hidden = false;
    askEl.innerHTML = `<div class="who">${sp.emo} ${esc(name)}</div><div class="q">${esc(tt.q)}</div><div class="opts">${['acid', 'neutral', 'alkali'].map((k) => `<button data-m="test" data-a="${k}">${esc(t.kinds[k])}</button>`).join('')}</div>`;
  } else if (S.phase === 'pour') {
    lab.setReadout('pH ?', '', '', '#8a6fe0');
    lab.setState({ emo: sp.emo, title: tt.pourTitle, lead: tt.pourLead, body: '', extra: rack });
  } else {
    const ph = sp.ph, k = kindOf(ph), c = colAt(ph), good = S.pred === k;
    lab.setReadout(`pH ≈ ${nf(ph, 1)}`, t.kindSub[k], kindWord(ph), rgbStr(c));
    lab.setState({
      emo: sp.emo, title: S.pred === null ? tt.seen : good ? t.right : t.wrong, lead: tt.turned(t.cols[colIdx(ph)], nf(ph, 1)),
      body: `${name}: ${kindWord(ph)}. ${tt.expl[k]}${sp.danger ? ' ' + tt.danger : ''}`, extra: rack,
    });
  }
}
function renderDil(t) {
  lab.setGlow('rgba(224, 90, 110, .26)');
  const d = t.dil, k = S.k, ph = phOfK(k);
  $('phDilB').textContent = d.btn; $('phDilR').textContent = d.reset;
  $('phDilB').disabled = !S.kAns || k >= 6; $('phDilR').disabled = k === 0;
  $('phDilN').textContent = !S.kAns ? d.wait : k >= 6 ? d.max : '';
  lab.setFacts(S.kAns ? t.facts.dilute : []);
  const col = rgbStr(colAt(ph)), vol = `${nf(0.2 * Math.pow(10, k), 1)} ${d.L} · ${d.vessels[k]}`;
  lab.setReadout(`pH ${nf(ph, 2)}`, vol, k ? d.vol(nf(Math.pow(10, k), 0)) : '', col);
  if (!S.kAns) {
    lab.setState({ emo: '🧪', title: d.q, lead: d.intro, body: d.wait, extra: '' });
    askEl.className = 'ph-ask'; askEl.hidden = false;
    askEl.innerHTML = `<div class="q">${esc(d.q)}</div><div class="opts">${['3', '7', '2.2'].map((a) => `<button data-m="dil" data-a="${a}">${nf(+a, 1)}</button>`).join('')}</div>`;
  } else if (k === 1) {
    const ok = S.kPred === '3';
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: d.ten, body: ok ? '' : d.youSaid(nf(+S.kPred, 1)), extra: '' });
  } else if (k === 0) {
    lab.setState({ emo: '🧪', title: `pH ${nf(ph, 2)}`, lead: d.intro, body: '', extra: '' });
  } else if (k <= 3) lab.setState({ emo: '💧', title: `pH ${nf(ph, 2)}`, lead: d.again, body: '', extra: '' });
  else lab.setState({ emo: '🌊', title: d.near, lead: d.nearL(nf(ph, 2)), body: k >= 6 ? d.max : '', extra: '' });
}
function renderNeu(t) {
  lab.setGlow('rgba(229, 211, 74, .2)');
  const n = t.neu, V10 = S.V10, V = V10 / 10, ph = titr(V10), ans = S.nAns !== null;
  lab.setFacts(ans ? t.facts.neutral : []);
  $('phAdd').innerHTML = [[50, 5], [10, 1], [1, 0.1]].map(([d, v]) => `<button class="chip ph-big" data-act="add" data-d="${d}"${!ans || V10 >= 500 ? ' disabled' : ''}>+${nf(v, 1)} ${esc(t.mL)}</button>`).join('');
  $('phNR').textContent = n.reset; $('phNC').textContent = n.curve; $('phNC').classList.toggle('on', S.curve);
  $('phNR').disabled = V10 === 0; $('phNC').disabled = !ans;
  $('phNN').textContent = ans && V10 === 0 ? n.hint : '';
  lab.setReadout(`pH ${nfx(ph, 2)}`, `${nf(V, 1)} ${t.mL}`, kindWord(ph), rgbStr(colAt(ph)));
  if (!ans) {
    lab.setState({ emo: '⚖️', title: n.q, lead: n.intro, body: n.wait, extra: '' });
    askEl.className = 'ph-ask stack'; askEl.hidden = false;
    askEl.innerHTML = `<div class="q">${esc(n.q)}</div><div class="opts">${n.opts.map((o, i) => `<button data-m="neu" data-a="${i}">${esc(o)}</button>`).join('')}</div>`;
  } else if (V10 === 0) {
    const ok = S.nAns === 1;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: n.rightL(n.opts[1]), body: n.hint, extra: '' });
  } else if (V10 < 240) lab.setState({ emo: '🧪', title: n.winsT, lead: n.winsL(nfx(ph, 2)), body: n.winsB, extra: '' });
  else if (V10 < 250) lab.setState({ emo: '👀', title: n.nearT, lead: n.nearL(nfx(ph, 2)), body: n.winsB, extra: '' });
  else if (V10 === 250) lab.setState({ emo: '⚖️', title: n.eqT, lead: n.eqL, body: n.winsB, extra: '' });
  else lab.setState({ emo: '🟡', title: n.alkT, lead: n.alkL(nfx(ph, 2)), body: n.alkB, extra: '' });
}
function renderMys(t) {
  lab.setGlow('rgba(95, 168, 160, .26)');
  if (!S.my) newMys();
  const M = S.my, m = t.mys;
  lab.setFacts(t.facts.test);
  const L = 'ABC';
  $('phMTubes').innerHTML = [0, 1, 2].map((i) => {
    const nm = M.named[i], ok = nm && nm === kindOf(SUB[M.subs[i]].ph);
    return `<button class="chip ph-bot ${M.sel === i ? 'on' : ''} ${nm ? (ok ? 'ph-ok' : 'ph-no') : ''}" data-act="mysel" data-i="${i}">${esc(m.tube(L[i]))}${nm ? (ok ? ' ✓' : ' ✗') : M.tested[i] ? ' 🥬' : ''}</button>`;
  }).join('');
  const i = M.sel, canName = i >= 0 && M.tested[i] && M.named[i] === null;
  $('phMKinds').innerHTML = canName ? ['acid', 'neutral', 'alkali'].map((k) => `<button class="chip" data-act="name" data-k="${k}">${esc(t.kinds[k])}</button>`).join('') : '';
  const nNamed = M.named.filter(Boolean).length, nRight = M.subs.filter((id, j) => M.named[j] === kindOf(SUB[id].ph)).length, all = nNamed === 3;
  $('phMN').innerHTML = all ? `<button class="chip" data-act="mynew">${esc(m.newT)}</button>` : '';
  lab.setReadout(nNamed ? `${nRight}/${nNamed}` : '?', m.named(nNamed), '', '#5fa8a0');
  if (all) { lab.setState({ emo: '🏆', title: m.done(nRight), lead: m.doneL, body: '', extra: '' }); return; }
  if (i < 0 || !M.tested[i]) { lab.setState({ emo: '🕵️', title: t.secrets.s1[0], lead: m.lead, body: m.body, extra: '' }); return; }
  if (canName) { lab.setState({ emo: '🧪', title: m.tube(L[i]), lead: m.ask, body: m.body, extra: '' }); return; }
  const sp = SUB[M.subs[i]], ok = M.named[i] === kindOf(sp.ph);
  lab.setState({ emo: sp.emo, title: ok ? t.right : t.wrong, lead: m.is(L[i], t.subs[sp.id][0], nf(sp.ph, 1), kindWord(sp.ph)), body: '', extra: '' });
}
function renderSea(t) {
  lab.setGlow('rgba(60, 120, 200, .3)');
  const s = t.sea, ph = S.sea, d = Math.round((8.2 - ph) * 100) / 100, r = Math.pow(10, d), pct = Math.round((r - 1) * 100);
  const rg = $('phRange'); if (+rg.value !== ph) rg.value = ph;
  $('phE1').textContent = s.ends[0]; $('phE2').textContent = s.ends[1];
  lab.setFacts(t.facts.neutral);
  lab.setReadout(`pH ${nfx(ph, 2)}`, d > 0 ? `×${nf(r, 2)}` : '', d > 0 ? `+${nf(pct, 0)} %` : '', '#4ea8ff');
  if (d <= 0) lab.setState({ emo: '🌊', title: s.startT, lead: s.startL, body: s.body, extra: '' });
  else lab.setState({ emo: '🌊', title: s.stT(nf(pct, 0)), lead: s.stL(nf(d, 2), nf(r, 2)), body: s.body, extra: '' });
}
render();
</script>
