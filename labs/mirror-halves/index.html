    else card = { emo: '🔄', title: t.s.turnT, lead: t.s.turnL, body: '' };
    val = st.h ? '↔' : `${st.phi}°`; sub = `${t.u.swept(Math.round(100 * st.swept.size / 12))} · ${st.hTried ? '✓' : '○'} ${t.u.across}`;
  }
  if (!axes) card.extra = v === 'things' ? `<div class="mh-fine">${THINGS.map((k) => `<div class="${stOf(k).revealed ? 'dn' : ''}">${EMO[k]} ${esc(t.names[k])}: ${stOf(k).revealed ? esc(cntText(t, scene(k))) : '?'}</div>`).join('')}</div>` : '';
  lab.setState(card);
  lab.setReadout(asking ? '?' : val, sub, pill, v === 'cube' ? '#6d8fe0' : v === 'solids' ? '#5fa8a0' : '#e0b050');
}
render();
</script>
</body>
</html>
