  const bgl = c.createRadialGradient(0, 0, 0, 0, 0, sz * .5); bgl.addColorStop(0, 'rgba(255,240,200,.2)'); bgl.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = bgl; c.fillRect(-sz / 2, -sz / 2, sz, sz);
  const ar = 1 - s, ax = Math.pow(s, 1.6);
  c.shadowColor = 'rgba(255,240,200,.8)'; c.shadowBlur = 6;
  for (let k = 1; k <= 4; k++) { c.strokeStyle = `rgba(255,244,214,${Math.max(0, ar * (.6 - .1 * k))})`; c.lineWidth = 3.4 - .5 * k; c.beginPath(); c.arc(0, 0, sz * (.09 + .085 * k), 0, TAU); c.stroke(); }
  c.shadowBlur = 0;
  for (const dx of [-1, 1]) for (const dy of [-1, 1]) for (let d = sz * .07; d < sz * .47; d += sz * .036) {
    const a = ax * (1 - d / (sz * .5)) * .95, bx = dx * d * .8, by2 = dy * d, rg = c.createRadialGradient(bx, by2, 0, bx, by2, sz * .034);
    rg.addColorStop(0, `rgba(255,244,214,${a})`); rg.addColorStop(1, 'rgba(255,244,214,0)'); c.fillStyle = rg; c.beginPath(); c.arc(bx, by2, sz * .034, 0, TAU); c.fill();
  }
  for (const dy of [-1, 1]) { const rg = c.createRadialGradient(0, dy * sz * .3, 0, 0, dy * sz * .3, sz * .06); rg.addColorStop(0, `rgba(255,244,214,${ax * .95})`); rg.addColorStop(1, 'rgba(255,244,214,0)'); c.fillStyle = rg; c.beginPath(); c.arc(0, dy * sz * .3, sz * .06, 0, TAU); c.fill(); }
  c.restore();
  pill(c, w, h, t18.lbXray, px, py - sz / 2 - 14, { size: 12 });
  pill(c, w, h, t18.lbCred, px, py + sz / 2 + 16, { size: 12 });
  if (s > .93) pill(c, w, h, t18.spPill, px + sz / 2 - 6, py - sz / 2 + 26, { align: 'r', size: 16, bg: 'rgba(58,44,6,.9)', fg: '#ffe9a8', stroke: '#ffd666' });
}

// --- secret: stretch it out ------------------------------------------------------------------------------------------
function drawStretch(c, w, h, dt, t) {
  const t18 = T[lang], gy = h - 30, topY = 34, pxM = (gy - topY) / 2.1, un = ease(S.un);
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#1c2748'); bg.addColorStop(1, '#0a0d19'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const gg = c.createLinearGradient(0, gy, 0, h); gg.addColorStop(0, '#2a3566'); gg.addColorStop(1, '#141a36'); c.fillStyle = gg; c.fillRect(0, gy, w, h - gy);
  c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(0, gy, w, 1.5);
  // the child
  const sc = 1.45 * pxM / 90;
  c.save(); c.translate(w * .2, gy - 44.5 * sc); c.scale(sc, sc); person(c); c.restore();
  // the ruler
  const rx = w * .8;
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2; c.lineCap = 'round'; c.beginPath(); c.moveTo(rx, gy); c.lineTo(rx, gy - 2 * pxM); c.stroke();
  for (const m of [0, 1, 2]) { c.beginPath(); c.moveTo(rx - 8, gy - m * pxM); c.lineTo(rx + 8, gy - m * pxM); c.stroke(); if (m) pill(c, w, h, `${m} m`, rx + 14, gy - m * pxM, { align: 'l', size: 12, pad: 8 }); }
  // the thread
  const xT = w * .52, len = 2 * pxM * un;
  const sway = (y) => 3 * Math.sin(y * .02 + t * 1.3) * un;
  if (len > 1) {
    c.lineCap = 'round';
    for (const [sg, col] of [[1, S1], [-1, S2]]) {
      c.strokeStyle = col; c.lineWidth = 2.6; c.beginPath();
      for (let d = 0; d <= len; d += 2) { const y = gy - d; const x = xT + sway(y) + 4 * Math.sin(d * .24 + t * 2) * sg; d ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke();
    }
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1;
    for (let d = 6; d <= len; d += 9) { const y = gy - d, x = xT + sway(y), o = 4 * Math.sin(d * .24 + t * 2); c.beginPath(); c.moveTo(x + o, y); c.lineTo(x - o, y); c.stroke(); }
  }
  // the nucleus
  const nr = 15, ny = gy - 4;
  c.save(); c.translate(xT, ny); nucleusBall(c, nr, t, 1);
  c.strokeStyle = `rgba(53,208,194,${(1 - un) * .9})`; c.lineWidth = 1.4; c.beginPath();
  for (let k = 0; k <= 60; k++) { const a = k * .55, r = nr * .78 * (k / 60); k ? c.lineTo(r * Math.cos(a), r * Math.sin(a)) : c.moveTo(0, 0); } c.stroke();
  c.restore();
  pill(c, w, h, t18.lbNuc, xT, gy + 16, { size: 12 });
  pill(c, w, h, `≈ ${fmt1(2 * un)} m`, clamp(xT + sway(gy - len), 30, w - 30), Math.max(26, gy - len - 18), { size: 14, bg: 'rgba(10,40,38,.9)', stroke: S1 });
}

// --- render: readout, state card, facts and controls ---------------------------------------------------------------
const SRC = { p51: 'King’s College London: Photo 51', nobel: 'The Nobel Prize: Physiology or Medicine 1962', genes: 'NHGRI (genome.gov): Human Genome Project FAQ', m2: 'NHGRI (genome.gov): Deoxyribonucleic acid (DNA) fact sheet' };
const EMO = { p51: '📷', nobel: '🏅', genes: '🧬', m2: '📏' };
const setFacts = (keys) => lab.setFacts(keys.map((k) => ({ emo: EMO[k], text: T[lang].f[k], src: SRC[k] })));
const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
const ACC = '#8a6bff';

function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  document.body.dataset.v = sec || v;
  show('secZoom', !sec && v === 'zoom'); show('secPairs', !sec && v === 'pairs'); show('secCode', !sec && v === 'code');
  show('secPhoto', sec === 'photo'); show('secStretch', sec === 'stretch');
  $('secRow').innerHTML = ['photo', 'stretch'].map((k) => `<button class="chip dn-ch secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? (k === 'photo' ? '📷' : '📏') + ' ' + esc(t.secrets[k][0]) : '🔒 ???'}</button>`).join('');
  if (sec === 'photo') {
    const s = S.xr;
    lab.setState({ emo: t.sp[0], title: t.sp[1], lead: t.sp[2], body: t.sp[3] });
    lab.setReadout(`${Math.round(s * 90)}°`, t.spVal, s > .93 ? t.spPill : '', ACC);
    $('phE0').textContent = t.spEnds[0]; $('phE1').textContent = t.spEnds[1];
    setFacts(['p51', 'nobel']); return;
  }
  if (sec === 'stretch') {
    lab.setState({ emo: t.ss[0], title: t.ss[1], lead: t.ss[2], body: t.ss[3] });
    lab.setReadout(`≈ ${fmt1(2 * ease(S.un))} m`, t.ssSub, '', ACC);
    $('stE0').textContent = t.ssEnds[0]; $('stE1').textContent = t.ssEnds[1];
    setFacts(['m2', 'genes']); return;
  }
  if (v === 'zoom') renderZoom(t); else if (v === 'pairs') renderPairs(t); else renderCode(t);
}

function renderZoom(t) {
  const res = S.zRes, near = res ? Math.round(S.z) : 0, lv = t.lv[near];
  $('zQ').textContent = !res ? t.zq : res === 'right' ? t.zRight : t.zWrong;
  const cards = res ? ORDER.map((k, i) => ({ k, n: i + 1, cls: 'ok' })) : SHOWN.map((k) => { const i = S.zOrder.indexOf(k); return { k, n: i + 1, cls: i >= 0 ? 'pick' : '' }; });
  $('zCards').innerHTML = cards.map((x) => `<button class="dn-card ${x.cls}" data-act="zc" data-k="${x.k}" ${res ? 'disabled' : ''}><span class="dn-n">${x.n || ''}</span>${esc(t.cards[x.k])}</button>`).join('');
  show('zAct', !res); show('zPlay', !!res);
  $('zCheck').textContent = t.check; $('zCheck').disabled = S.zOrder.length < 4;
  $('zClear').textContent = t.again; $('zClear').disabled = !S.zOrder.length;
  $('zE0').textContent = t.zEnds[0]; $('zE1').textContent = t.zEnds[1];
  $('zDots').querySelectorAll('.dn-lv').forEach((b) => { const i = +b.dataset.i; b.classList.toggle('on', i === near); b.title = t.lv[i].n; b.setAttribute('aria-label', t.lv[i].n); });
  $('zGuess').textContent = res === 'wrong' ? `${t.zYour} ${S.zOrder.map((k) => t.cards[k]).join(' → ')}` : '';
  if (!res) { lab.setReadout(t.zLockVal, t.zLockSub, '🔒', ACC); lab.setState({ emo: t.zst0[0], title: t.zst0[1], lead: t.zst0[2], body: t.zst0[3] }); }
  else { lab.setReadout(esc(lv.n), lv.d, `${near + 1}/8`, ACC); lab.setState({ emo: lv.e, title: lv.t, lead: lv.l, body: lv.b }); }
  setFacts(['m2', 'genes']);
}

function renderPairs(t) {
  const a = S.pAns, st = a === null ? 0 : S.pStage;
  $('pQ').textContent = a === null ? t.pq : a === 23 ? `${t.right} ${t.pRight}` : `${t.notq} ${t.pWrong}`;
  $('pOpts').innerHTML = [46, 23, 92].map((n) => `<button class="dn-opt ${a === n ? 'on' : ''} ${a !== null && n === 23 ? 'ok' : ''}" data-act="pa" data-n="${n}" ${a !== null ? 'disabled' : ''}>${n}</button>`).join('');
  show('pPlay', a !== null);
  $('pStages').innerHTML = t.pStages.map((s, k) => `<button class="chip dn-ch ${S.pStage === k ? 'on' : ''}" data-act="pst" data-k="${k}">${k + 1} · ${esc(s)}</button>`).join('');
  $('pSexL').textContent = t.pSex;
  $('pSex').innerHTML = ['XX', 'XY'].map((x) => `<button class="chip dn-ch ${S.sex === x ? 'on' : ''}" data-act="sex" data-x="${x}">${x}</button>`).join('');
  lab.setReadout(t.pr[st][0], t.pr[st][1], '', ACC);
  if (a === null) lab.setState({ emo: t.pst0[0], title: t.pst0[1], lead: t.pst0[2], body: t.pst0[3] });
  else { const p = t.pst[st]; lab.setState({ emo: p[0], title: p[1], lead: p[2], body: Array.isArray(p[3]) ? p[3][S.sex === 'XY' ? 1 : 0] : p[3] }); }
  setFacts(['genes']);
}

function renderCode(t) {
  const done = S.cFill >= 12;
  show('cAsk', !done); show('cChips', done);
  $('cQ').textContent = t.cq;
  $('cBases').querySelectorAll('.dn-base').forEach((b) => { b.disabled = done; });
  $('cChips').innerHTML = `<button class="chip dn-ch ${S.cMut ? 'on' : ''}" data-act="cmut">${esc(S.cMut ? t.cUnmut : t.cMut)}</button><button class="chip dn-ch" data-act="creplay">↻ ${esc(t.cReplay)}</button>`;
  if (!done) { lab.setReadout(`${S.cFill} / 12`, t.cMatched, '', ACC); lab.setState({ emo: t.cst0[0], title: t.cst0[1], lead: t.cst0[2], body: t.cst0[3] }); }
  else {
    const p = S.cT < 4.8 ? t.cstRead : S.cMut ? t.cstMut : t.cstOk;
    lab.setReadout(t.cBeads, t.cBeadsSub, '', ACC);
    lab.setState({ emo: p[0], title: p[1], lead: p[2], body: p[3], extra: `<b>${esc(t.right)}</b> ${esc(t.cDone)}` });
  }
  setFacts(['p51', 'nobel']);
}

canvasLoop($('cv'), (c, w, h, dt, t) => {
  if (S.sec === 'photo') drawPhoto(c, w, h, dt, t);
  else if (S.sec === 'stretch') drawStretch(c, w, h, dt, t);
  else if (lab.view === 'zoom') drawZoom(c, w, h, dt, t);
  else if (lab.view === 'pairs') drawPairs(c, w, h, dt, t);
  else drawCode(c, w, h, dt, t);
});
render();
</script>
