function decode(s, k) {
  const out = []; let i = 0, x = 0, y = 0;

}

    const age = S.pop[i] === undefined ? 1 : clamp((t - S.pop[i]) / 0.22, 0, 1), sc = 0.82 + 0.18 * (1 - Math.pow(1 - age, 3)) + (age < 1 ? 0.06 * Math.sin(age * Math.PI) : 0);
    c.save(); c.translate(x + ts / 2 + (jr - 0.5) * 1.2, y + ts / 2 + (jr * 7 % 1 - 0.5) * 1.2); c.rotate((jr - 0.5) * 0.05); c.scale(sc, sc);
    const g = c.createLinearGradient(-tw / 2, -tw / 2, tw / 2, tw / 2); g.addColorStop(0, rgba(q.c, 1.28)); g.addColorStop(0.5, rgba(q.c, 1)); g.addColorStop(1, rgba(q.c, 0.7));
    c.fillStyle = g; c.strokeStyle = rgba(q.c, 0.45); c.lineWidth = 1.5; c.beginPath(); c.roundRect(-tw / 2, -tw / 2, tw, tw, 5); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.32)'; c.beginPath(); c.roundRect(-tw / 2 + 3, -tw / 2 + 3, tw * 0.45, tw * 0.16, 3); c.fill();
    c.restore();
  }
}

canvasLoop($('cv'), (c, w, h, dt, t) => {
  const v = lab.view;
  if (v === 'venus') drawVenus(c, w, h, dt, t);
  else if (v === 'road') drawRoad(c, w, h, dt, t);
  else if (S.mode === 'melt') drawMelt(c, w, h, dt, t);
  else drawMosaic(c, w, h, dt, t);
});

$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'glass' || S.mode !== 'mos' || S.g3 === null) return;
  const r = $('cv').getBoundingClientRect(), { ts, gx, gy } = mosG(r.width, r.height);
  const cx = Math.floor((ev.clientX - r.left - gx) / ts), cy = Math.floor((ev.clientY - r.top - gy) / ts);
  if (cx < 0 || cx > 5 || cy < 0 || cy > 5) return;
  const i = cy * 6 + cx, ent = S.pal[S.sel], cur = S.tiles[i];
  if (cur && cur.sig === ent.sig) { S.tiles[i] = null; sfx.tick(); }
  else { S.tiles[i] = { c: ent.c, kind: ent.k, sig: ent.sig }; S.pop[i] = performance.now() / 1000; sfx.click(); }
  render();
});

// --- controls ---------------------------------------------------------------------------------------------------------------
const ask = (el, q, opts, key) => { el.innerHTML = `<div class="lo-q">${esc(q)}</div><div class="lo-opts">${opts.map((o, i) => `<button data-g="${key}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`; };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.g) {
    const i = +d.i;
    if (d.g === '1') { S.g1 = i; S.p = P0; S.air = true; sfx[i === 2 ? 'good' : 'bad'](); }
    else if (d.g === '2') { S.g2 = i; sfx[i === 1 ? 'good' : 'bad'](); }
    else { S.g3 = i; S.dose = { ...zero(), co: 2 }; S.parts.push(...pinch('co')); sfx[i === 0 ? 'good' : 'bad'](); }
    S.stKey = ''; render(); showStage(); return;
  }
  if (d.act === 'play') {
    if (S.playing) S.playing = false; else { if (S.p >= 0.999) S.p = 0; S.playing = true; } sfx.click();
  } else if (d.air !== undefined) { S.air = d.air === '1'; sfx.click(); }
  else if (d.sec) {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === d.sec ? null : d.sec; if (S.sec === 'two') S.playing = false; sfx.click();
  } else if (d.stop !== undefined) { S.stop = +d.stop; sfx.tick(); }
  else if (d.mode) { S.mode = d.mode; sfx.click(); }
  else if (d.m) { const k = d.m; S.dose[k] = (S.dose[k] + 1) % 4; if (S.dose[k]) { S.parts.push(...pinch(k)); sfx.click(); } else sfx.tick(); }
  else if (d.act === 'empty') { S.dose = zero(); sfx.tick(); }
  else if (d.act === 'keep') {
    const sig = MK.map((k) => S.dose[k]).join(''), at = S.pal.findIndex((e) => e.sig === sig);
    if (at >= 0) S.sel = at; else { if (S.pal.length >= 7) S.pal.splice(1, 1); S.pal.push({ k: kindOf(S.dose), c: glassOf(S.dose), sig, ab: MK.filter((k) => S.dose[k]).map((k) => MET[k].ab).join('') }); S.sel = S.pal.length - 1; }
    sfx.snap();
  } else if (d.sw !== undefined) { S.sel = +d.sw; sfx.tick(); }
  else if (d.act === 'clearMos') { S.tiles = new Array(36).fill(null); sfx.click(); }
  S.stKey = ''; render();
});
$('sl').addEventListener('input', (ev) => { S.p = +ev.target.value / 1000; S.playing = false; syncV1(true); });
function pinch(k) { // grains of one metal, falling into the pot
  const cw = $('cv').getBoundingClientRect(), pw = Math.min(cw.width * 0.40, cw.height * 0.5), px = cw.width * 0.36, py = cw.height * 0.36;
  return Array.from({ length: 12 }, (_, i) => ({ x: px + (Math.sin(i * 3.1) * pw * 0.25), y: py - 70 - (i % 4) * 12, vx: Math.sin(i * 1.7) * 14, vy: 30, r: 2 + (i % 3) * 0.7, c: MET[k].pow }));
}

// --- one render per change ------------------------------------------------------------------------------------------------------
function render() {
  const v = lab.view;
  $('s1').hidden = v !== 'venus'; $('s2').hidden = v !== 'road'; $('s3').hidden = v !== 'glass';
  if (v === 'venus') renderV1(); else if (v === 'road') renderV2(); else renderV3();
}
const verdict = (ok, text) => `<span style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? T[lang].ok : T[lang].no)}</span> <span>${esc(text)}</span>`;

function syncV1(force) { // readout, slider and state card; during play only what changed
  const t = T[lang], m = minutesAt(S.g1 === null ? P0 : S.p), mid = S.g1 !== null && midNow(S.p);
  $('sl').value = Math.round(S.p * 1000);
  $('bPlay').textContent = S.playing ? t.v.pause : t.v.play;
  if (S.sec === 'next') lab.setReadout(String(NEXT_YEAR), t.next.b(NEXT_YEAR - new Date().getFullYear()), '', '#ffb347');
  else lab.setReadout(esc(t.v.time(m)), t.v.sub, S.g1 !== null && S.air && mid ? t.v.pill : '', '#ffb347');
  let key, st;
  if (S.g1 === null) { key = 'pre'; st = { emo: '🔭', title: t.v.pre[0], lead: t.v.pre[1], body: t.v.pre[2] }; }
  else if (S.sec === 'two') { key = 'two'; st = { emo: '🌍', title: t.two[0], lead: t.two[1], body: t.two[2] }; }
  else if (S.sec === 'next') {
    const n = NEXT_YEAR - new Date().getFullYear(); key = 'next'; st = { emo: '📅', title: t.next.t(NEXT_YEAR), lead: t.next.l, body: '' };
  } else if (mid) { key = S.air ? 'mid1' : 'mid0'; const a = t.v[key]; st = { emo: S.air ? '✨' : '⚫', title: a[0], lead: a[1], body: a[2] }; }
  else { key = 'away'; st = { emo: '🔭', title: t.v.away[0], lead: t.v.away[1], body: '' }; }
  if (force || key !== S.stKey) { S.stKey = key; lab.setState({ ...st, extra: '' }); }
}
function renderV1() {
  const t = T[lang], g = S.g1 !== null;
  lab.setGlow('rgba(255, 170, 60, .24)');
  $('ask1').hidden = g; $('aft1').hidden = !g;
  if (!g) {
    ask($('ask1'), t.v.q, t.v.opts, '1'); $('airs').innerHTML = ''; $('secs').innerHTML = ''; $('vd1').innerHTML = '';
    $('sl').setAttribute('aria-label', ''); lab.setFacts([]);
  } else {
    const open = secret.unlocked();
    $('vd1').innerHTML = verdict(S.g1 === 2, t.v.reveal);
    $('sl').setAttribute('aria-label', t.v.slide);
    $('sl').hidden = S.sec === 'next'; $('bPlay').hidden = S.sec === 'next';
    $('airs').innerHTML = S.sec ? '' : [[0, t.v.air0], [1, t.v.air1]].map(([a, l]) => `<button class="chip ${(a === 1) === S.air ? 'on' : ''}" data-air="${a}">${esc(l)}</button>`).join('');
    const sc = (k, emo, s) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(s[0])}` : '🔒 ???'}</button>`;
    $('secs').innerHTML = sc('two', '🌍', t.sec.a) + sc('next', '📅', t.sec.b);
    lab.setFacts(factsOf('v'));
  }
  syncV1(true);
}
function renderV2() {
  const t = T[lang], g = S.g2 !== null, fx = t.r.stops[S.stop];
  lab.setGlow('rgba(70, 130, 200, .26)');
  $('ask2').hidden = g; $('aft2').hidden = !g;
  if (!g) {
    ask($('ask2'), t.r.q, t.r.opts, '2'); $('yrs').innerHTML = ''; $('vd2').innerHTML = '';
    lab.setReadout('?', '', '', '#5aa7e0');
    lab.setState({ emo: '🧭', title: t.r.pre[0], lead: t.r.pre[1], body: t.r.pre[2], extra: '' }); lab.setFacts([]);
    return;
  }
  $('vd2').innerHTML = verdict(S.g2 === 1, t.r.reveal(WALK_KM));
  $('yrs').innerHTML = t.r.stops.map((s, i) => `<button class="chip ${i === S.stop ? 'on' : ''}" data-stop="${i}">${s[0]}</button>`).join('');
  lab.setReadout(String(fx[0]), t.r.places[STOP_AT[S.stop]], '', '#5aa7e0');
  lab.setState({ emo: '📍', title: fx[1], lead: fx[2] + (S.stop === 6 && S.g1 !== null ? t.r.tail : ''), body: '', extra: '' });
  lab.setFacts(factsOf('r'));
}
function renderV3() {
  const t = T[lang], g = S.g3 !== null, tot = MK.reduce((s, k) => s + S.dose[k], 0);
  lab.setGlow('rgba(220, 100, 60, .22)');
  $('ask3').hidden = g; $('aft3').hidden = !g;
  if (!g) {
    ask($('ask3'), t.g.q, t.g.opts, '3'); $('mets').innerHTML = ''; $('vd3').innerHTML = ''; $('modeSeg').innerHTML = ''; $('pal').innerHTML = ''; $('thumbBox').innerHTML = '';
    lab.setReadout('0', '', '', '#e0734f');
    lab.setState({ emo: '🔥', title: t.g.pre[0], lead: t.g.pre[1], body: t.g.pre[2], extra: '' }); lab.setFacts([]);
    return;
  }
  $('vd3').innerHTML = verdict(S.g3 === 0, t.g.reveal);
  $('modeSeg').innerHTML = [['melt', t.g.mode[0]], ['mos', t.g.mode[1]]].map(([m, l]) => `<button data-mode="${m}" class="${S.mode === m ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('melt3').hidden = S.mode !== 'melt'; $('mos3').hidden = S.mode !== 'mos';
  const unitTxt = t.g.pinch(tot);
  if (S.mode === 'melt') {
    $('mets').innerHTML = MK.map((k) => `<button class="chip ${S.dose[k] ? 'on' : ''}" data-m="${k}"><i class="lo-dot" style="background:${rgba(glassOf({ ...zero(), [k]: 3 }))}"></i>${esc(t.g.metals[k])}${S.dose[k] ? ` ×${S.dose[k]}` : ''}</button>`).join('');
    $('bEmpty').textContent = t.g.empty; $('bKeep').textContent = t.g.keep; $('bKeep').disabled = tot === 0;
    const kind = kindOf(S.dose);
    lab.setReadout(String(tot), unitTxt, '', '#e0734f');
    if (kind === 'clear') lab.setState({ emo: '🫙', title: t.g.none[0], lead: t.g.none[1], body: '', extra: '' });
    else if (kind === 'mix') lab.setState({ emo: '🎨', title: t.g.mix[0], lead: t.g.mix[1], body: '', extra: '' });
    else lab.setState({ emo: '🔥', title: t.g.oneT(t.g.metals[kind], t.g.colours[kind]), lead: t.g.one[kind], body: '', extra: '' });
  } else {
    $('palT').textContent = t.g.palT; $('tgT').textContent = t.g.target; $('hint').textContent = t.g.hint; $('bClr').textContent = t.g.clearMos;
    $('pal').innerHTML = S.pal.map((e, i) => `<button class="sw ${i === S.sel ? 'on' : ''}" data-sw="${i}" style="background:${rgba(e.c)};color:${e.c[0] + e.c[1] + e.c[2] > 330 ? '#15182a' : '#fff'}" aria-label="${esc(e.ab || t.g.clear)}">${esc(e.ab || '')}</button>`).join('');
    $('thumbBox').innerHTML = `<div class="lo-thumb">${[...TARGET].map((ch) => `<i style="background:${rgba(TCOL[ch])}"></i>`).join('')}</div>`;
    const ok = S.tiles.reduce((n, q, i) => n + (q && KIND_OK[q.kind] === TKIND[TARGET[i]] ? 1 : 0), 0), any = S.tiles.some(Boolean);
    lab.setReadout(`${ok}/36`, t.g.mosSub, '', '#e0734f');
    const st = ok === 36 ? t.g.mosDone : any ? t.g.mosProg(ok) : t.g.mosEmpty;
    lab.setState({ emo: ok === 36 ? '🏆' : '🧩', title: st[0], lead: st[1], body: '', extra: '' });
  }
  lab.setFacts(factsOf('g'));
}
render();
