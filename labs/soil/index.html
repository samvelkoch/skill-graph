  const c1 = (k) => (J.q1 ? (k === 'sand' ? 'so-ok' : J.guess === k ? 'so-no' : '') : J.guess === k ? 'on' : '');
  let h = `<div class="so-q">${esc(t.jarQ)}</div><div class="chips so-chips">${['sand', 'silt', 'clay'].map((k) => ch('jg', k, t.grains[k], c1(k), sh)).join('')}</div>`;
  if (J.q1) h += `<div class="so-v ${J.guess === 'sand' ? 'ok' : 'no'}">${esc(J.guess === 'sand' ? t.right : t.notQuite)}</div>`;
  if (J.q1) {
    const c2 = (k) => (J.fg === null ? '' : k === 'humus' ? 'so-ok' : J.fg === k ? 'so-no' : '');
    h += `<div class="so-q so-sub">${esc(t.floatQ)}</div><div class="chips so-chips">${[['sand', t.grains.sand], ['humus', t.grains.humus], ['none', t.nothingFloats]].map(([k, l]) => ch('fg', k === 'none' ? 'none' : k, l, c2(k), J.fg !== null)).join('')}</div>`;
    if (J.fg !== null) h += `<div class="so-v ${J.fg === 'humus' ? 'ok' : 'no'}">${esc(J.fg === 'humus' ? t.right : t.notQuite)}</div>`;
  }
  h += `<div class="row2"><button class="btn so-btn" data-act="shake"${J.guess === null || (sh && !J.q1) ? ' disabled' : ''}>${esc(t.shake)}</button>`;
  if (J.q1) h += `<div class="chips so-chips">${['s', 'min', 'h', 'd'].map((k, i) => `<button class="chip ${i === J.ci ? 'on' : ''}" data-act="jt" data-k="${k}" data-i="${i}"${i <= J.ci ? ' disabled' : ''}>${esc(t.times[k])}</button>`).join('')}</div>`;
  h += '</div>';
  if (J.fg !== null) {
    h += `<div class="so-q so-sub">${esc(t.compQ)}</div>`;
    if (!J.comp) h += `<button class="btn so-btn" data-act="show">${esc(t.show)}</button>`;
    else h += `<div class="so-leg">${COMP.map(([k, v, c0]) => `<span><i style="background:${c0}"></i>${esc(t.comp[k])} ${v} %</span>`).join('')}</div>`;
  }
  $('secJar').innerHTML = h;
  let st;
  if (!J.q1) st = { emo: '🫙', title: t.state.jar0[0], lead: t.state.jar0[1], body: '' };
  else if (J.fg === null) st = { emo: J.guess === 'sand' ? '✅' : '🤔', title: J.guess === 'sand' ? t.right : t.notQuite, lead: t.settle1, body: '' };
  else if (!J.comp) st = { emo: J.fg === 'humus' ? '✅' : '🤔', title: J.fg === 'humus' ? t.right : t.notQuite, lead: t.exJar, body: '' };
  else st = { emo: '🫙', title: t.state.jarDone[0], lead: t.state.jarDone[1], body: t.exComp };
  lab.setState({ ...st, extra: `<div class="so-note">${esc(t.fine)}</div>` });
  lab.setFacts(t.facts.jar);
}
function renderProf(t) {
  const P = S.pr; $('secProf').style.display = ''; lab.setGlow('rgba(80, 135, 75, .24)');
  let h = `<div class="so-q">${esc(t.profilesQ)}</div>`;
  h += `<div class="row2" style="margin-top:0"><button class="btn so-btn" data-act="pdig"${P.guess === null || P.dug ? ' disabled' : ''}>${esc(t.dig)}</button></div>`;
  if (P.done) {
    h += `<div class="so-v ${P.guess === 2 ? 'ok' : 'no'}">${esc(P.guess === 2 ? t.right : t.notQuite)}</div>`;
    h += `<div class="chips so-chips so-sub">${['cold', 'rain', 'roots'].map((k) => ch('pwhy', k, t.why[k], P.why === k ? 'on' : '')).join('')}</div>`;
    if (P.hor) h += `<div class="so-hor"><b>${esc(t.soils[ZK[P.hor.z]])}</b>: ${esc(t.hor[P.hor.k])}</div>`;
    else if (P.why) h += `<div class="so-hor">${esc(t.whyText[P.why])}</div>`;
  }
  $('secProf').innerHTML = h;
  let st;
  if (!P.done) st = { emo: '⛏️', title: t.state.profiles0[0], lead: t.state.profiles0[1], body: '' };
  else if (P.hor) st = { emo: '🔎', title: t.soils[ZK[P.hor.z]], lead: t.hor[P.hor.k], body: '' };
  else if (P.why) st = { emo: '🌍', title: t.why[P.why], lead: t.whyText[P.why], body: '' };
  else st = { emo: '🌍', title: t.state.profilesDone[0], lead: t.state.profilesDone[1], body: t.exProfiles };
  lab.setState({ ...st, extra: `<div class="so-note">${esc(t.fine)}</div>` });
  lab.setFacts(P.done ? t.facts.profiles : []);
}
function renderTime(t) {
  const M = S.tm; $('secTime').style.display = ''; lab.setGlow('rgba(150, 140, 70, .22)');
  const ans = M.q !== null;
  let h = `<div class="so-q">${esc(t.timeQ)}</div><div class="chips so-chips">${t.timeOpts.map((l, i) => ch('tq', i, l, ans ? (i === 2 ? 'so-ok' : M.q === i ? 'so-no' : '') : '', ans)).join('')}</div>`;
  if (ans) h += `<div class="so-v ${M.q === 2 ? 'ok' : 'no'}">${esc(M.q === 2 ? t.right : t.notQuite)}</div>`;
  $('tQ').innerHTML = h;
  $('tSlW').style.display = ans ? '' : 'none';
  $('tSl').disabled = !ans || !!M.auto;
  $('tTicks').innerHTML = STOPS.map((n) => `<span>${esc(fmtY(n))}</span>`).join('');
  let p2 = '';
  if (ans && !M.auto) {
    p2 = `<div class="row2"><button class="btn so-btn" data-act="tplough">${esc(t.plough)}</button></div>
      <div class="row2"><div class="chips so-chips">${ch('tgrass', 'g', t.grass, M.grass ? 'on' : '', !M.ploughed || M.windAt !== null)}${ch('twind', 'w', t.wind, '', !M.ploughed || M.windAt !== null)}</div></div>`;
  }
  $('tP2').innerHTML = p2;
  let st;
  if (!ans) st = { emo: '🪨', title: t.state.time0[0], lead: t.state.time0[1], body: '' };
  else if (M.windDone) st = { emo: '🌬️', title: t.state.timeLost[0], lead: t.state.timeLost[1], body: M.grass ? t.held : t.lost };
  else st = { emo: M.q === 2 ? '✅' : '🤔', title: M.q === 2 ? t.right : t.notQuite, lead: t.exTime, body: M.dt < 1 ? t.hor.rock : '' };
  lab.setState({ ...st, extra: `<div class="so-note">${esc(t.fine)}</div>` });
  lab.setFacts(ans ? t.facts.time : []);
}
function renderWorms(t) {
  $('secW').style.display = ''; lab.setGlow('rgba(180, 110, 90, .24)');
  $('secW').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn so-btn" data-act="w30"${S.wm.at !== null && S.wm.p < 1 ? ' disabled' : ''}>${esc(t.run30)}</button></div>`;
  lab.setState({ emo: '🪱', title: t.secrets.worms[0], lead: t.secretA, body: '', extra: '' }); lab.setFacts([]);
}
function renderCube(t) {
  $('secC').style.display = ''; lab.setGlow('rgba(120, 90, 60, .26)');
  $('secC').innerHTML = `<div class="row2" style="margin-top:0"><button class="chip ${S.cb.cmp ? 'on' : ''}" data-act="cmp">${esc(t.compare)}</button></div>`;
  lab.setState({ emo: '🧱', title: t.secrets.cube[0], lead: t.secretB, body: '', extra: '' }); lab.setFacts([]);
}
render();
</script>
