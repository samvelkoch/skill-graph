  const cx = ax + .36 * aw + 4, cy = ay + .34 * ah + 4, cw = .28 * aw - 8, ch = .32 * ah - 8; // the central court
  const cg = c.createLinearGradient(cx, cy, cx + cw, cy + ch); cg.addColorStop(0, '#f3e6c0'); cg.addColorStop(1, '#d8c493');
  c.fillStyle = cg; c.beginPath(); c.roundRect(cx, cy, cw, ch, 8); c.fill(); c.strokeStyle = '#2e271f'; c.stroke();
  c.fillStyle = 'rgba(120,90,50,.45)';
  for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(cx + cw * (.18 + .13 * i), cy + ch * .3, Math.max(1.5, w * .008), 0, 7); c.arc(cx + cw * (.18 + .13 * i), cy + ch * .7, Math.max(1.5, w * .008), 0, 7); c.fill(); }
  c.restore();
  const label = T[lang].sx.kn[0];
  c.save(); c.font = '900 15px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(label).width + 28, px = clamp(w / 2 - tw / 2, 6, Math.max(6, w - tw - 6)), py = h * .9 - 15;
  c.fillStyle = 'rgba(14,17,28,.82)'; c.beginPath(); c.roundRect(px, py, tw, 30, 15); c.fill();
  c.fillStyle = '#fff'; c.fillText(label, px + tw / 2, py + 16); c.restore();
}

// --- the story cards -----------------------------------------------------------------------------------------
const CW = 170, CH = 156, SH = 98, GAP = 12;
const sky = (c, a, b) => { const g = c.createLinearGradient(0, 0, 0, SH); g.addColorStop(0, a); g.addColorStop(1, b); c.fillStyle = g; c.fillRect(0, 0, 160, SH); };
const ground = (c, col, y) => { c.fillStyle = col; c.fillRect(0, y, 160, SH - y); c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(0, y, 160, 2); };
const redLine = (c, x0, y0, x1, y1, x2, y2, x3, y3) => {
  c.save(); c.lineCap = 'round'; c.strokeStyle = '#d93a4c'; c.lineWidth = 3.2; c.beginPath(); c.moveTo(x0, y0); c.bezierCurveTo(x1, y1, x2, y2, x3, y3); c.stroke();
  c.strokeStyle = 'rgba(255,175,185,.6)'; c.lineWidth = 1; c.stroke(); c.restore();
};
const SCENES = [
  (c) => { // Ariadne gives the thread
    sky(c, '#f6e8c8', '#e8cf9c'); ground(c, '#c98a5a', 80);
    drawAriadne(c, 36, 54, 24); drawHero(c, 126, 56, 22);
    c.save(); c.strokeStyle = '#f0c19a'; c.lineCap = 'round'; c.lineWidth = 7;
    c.beginPath(); c.moveTo(54, 70); c.lineTo(78, 64); c.stroke(); c.beginPath(); c.moveTo(108, 70); c.lineTo(92, 66); c.stroke(); c.restore();
    drawBall(c, 85, 60, 11, 1);
  },
  (c) => { // Theseus goes in
    sky(c, '#8d86a8', '#4a4560'); ground(c, '#5b4a3c', 82);
    c.save(); c.fillStyle = '#17121f'; c.strokeStyle = '#b3a48a'; c.lineWidth = 6; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(96, 86); c.lineTo(96, 38); c.arc(124, 38, 28, Math.PI, 0); c.lineTo(152, 86); c.closePath(); c.fill(); c.stroke(); c.restore();
    drawHero(c, 124, 62, 19);
    redLine(c, 30, 84, 56, 94, 70, 76, 100, 86); drawBall(c, 26, 80, 10, 1);
  },
  (c, t) => { // he meets the Minotaur
    sky(c, '#a99a82', '#7f705e');
    c.strokeStyle = 'rgba(50,36,24,.35)'; c.lineWidth = 1;
    for (let y = 0; y < 98; y += 14) { c.beginPath(); c.moveTo(0, y); c.lineTo(160, y); c.stroke(); for (let x = (y / 14 % 2) * 14; x < 160; x += 28) { c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 14); c.stroke(); } }
    ground(c, '#6d5a48', 84);
    drawMinotaur(c, 106, 56, 33, t); drawHero(c, 38, 64, 20); redLine(c, 44, 88, 30, 94, 14, 90, 0, 94);
  },
  (c) => { // the thread leads him out
    sky(c, '#9fd2ff', '#ffeab8');
    const sg = c.createRadialGradient(136, 26, 2, 136, 26, 24); sg.addColorStop(0, 'rgba(255,240,170,1)'); sg.addColorStop(1, 'rgba(255,240,170,0)'); c.fillStyle = sg; c.fillRect(100, 0, 60, 60);
    ground(c, '#8fb56a', 82);
    c.save(); const ag = c.createLinearGradient(0, 30, 0, 86); ag.addColorStop(0, '#fff6cf'); ag.addColorStop(1, '#ffe08a');
    c.fillStyle = ag; c.strokeStyle = '#b3a48a'; c.lineWidth = 6; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(104, 86); c.lineTo(104, 46); c.arc(126, 46, 22, Math.PI, 0); c.lineTo(148, 86); c.closePath(); c.fill(); c.stroke(); c.restore();
    redLine(c, 0, 90, 40, 82, 70, 94, 118, 86); drawHero(c, 56, 60, 22);
  },
];
function drawStory(c, w, h, dt, time) {
  const s = S.s, DW = 2 * CW + GAP, DH = 2 * CH + GAP, sc = Math.min(w * .97 / DW, h * .97 / DH), ox = (w - DW * sc) / 2, oy = (h - DH * sc) / 2;
  s.geo = { sc, ox, oy };
  paintGround(c, w, h);
  const t = T[lang], e = 1 - Math.exp(-dt * 9);
  for (let k = 0; k < 4; k++) {
    const slot = s.done ? k : INIT[s.round % INIT.length][k], tx = (slot % 2) * (CW + GAP), ty = (slot >> 1) * (CH + GAP);
    if (s.cx[k] === undefined) { s.cx[k] = tx; s.cy[k] = ty; }
    s.cx[k] += (tx - s.cx[k]) * e; s.cy[k] += (ty - s.cy[k]) * e;
    const sh = s.shake.k === k ? Math.sin((time - s.shake.t0) * 50) * 5 * Math.max(0, 1 - (time - s.shake.t0) / .45) : 0;
    const placed = k < s.placed, bad = s.shake.k === k && time - s.shake.t0 < .45;
    c.save(); c.translate(ox + (s.cx[k] + sh) * sc, oy + s.cy[k] * sc); c.scale(sc, sc);
    c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 14; c.shadowOffsetY = 5;
    const pg = c.createLinearGradient(0, 0, 0, CH); pg.addColorStop(0, '#f7ecd0'); pg.addColorStop(1, '#e2cf9f');
    c.fillStyle = pg; c.beginPath(); c.roundRect(0, 0, CW, CH, 14); c.fill(); c.restore();
    c.save(); c.beginPath(); c.roundRect(5, 5, CW - 10, SH, 10); c.clip(); c.translate(5, 5); SCENES[k](c, time); c.restore();
    c.strokeStyle = placed ? '#3ddc97' : bad ? '#e5484d' : '#8a6a44'; c.lineWidth = placed || bad ? 3.5 : 1.5;
    c.beginPath(); c.roundRect(0, 0, CW, CH, 14); c.stroke();
    c.font = '800 14px Nunito, sans-serif'; c.fillStyle = '#3a2418'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    const lines = wrap(c, t.st.cards[k], CW - 16), y0 = SH + 10 + (CH - SH - 10 - lines.length * 17) / 2 + 12;
    lines.forEach((ln, i) => c.fillText(ln, CW / 2, y0 + i * 17));
    if (placed) {
      c.fillStyle = '#e0b050'; c.strokeStyle = '#3a2418'; c.lineWidth = 2; c.beginPath(); c.arc(20, 20, 15, 0, 7); c.fill(); c.stroke();
      c.fillStyle = '#3a2418'; c.font = '900 18px Nunito, sans-serif'; c.textBaseline = 'middle'; c.fillText(String(k + 1), 20, 21);
    }
    c.restore();
  }
  burst(c, w / 2, h / 2, time - s.doneT, Math.min(w, h) * .4);
}

// --- shell ---------------------------------------------------------------------------------------------------
const lab = shell({ key: 'minotaur-maze', T, topics: TOPICS, views: ['maze', 'lost', 'story'], onLang: render, onView: render });
const secret = secretLab('minotaur-maze', () => ({
  secrets: [{ emo: '✋', title: T[lang].sx.hand[0], desc: T[lang].sx.hand[1] }, { emo: '🏛️', title: T[lang].sx.kn[0], desc: T[lang].sx.kn[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="mmAsk"><p class="mm-q" id="mmQ"></p><div class="mm-opts" id="mmOpts"></div></div>
  <p class="mm-verdict" id="mmVerdict" hidden></p>
  <div id="mmPlay" hidden>
    <div class="mm-pad" id="mmPad">
      <button type="button" data-dir="3">←</button><button type="button" data-dir="0">↑</button><button type="button" data-dir="2">↓</button><button type="button" data-dir="1">→</button>
    </div>
    <div class="mm-row"><button type="button" class="mm-btn" id="mmMain" data-act="main" hidden></button><button type="button" class="mm-btn ghost" id="mmThread" data-act="thread" hidden></button></div>
  </div>
  <div id="mmStory" hidden><p class="mm-q" id="stQ"></p><div class="mm-row"><button type="button" class="mm-btn" id="stAgain" data-act="again" hidden></button></div></div>
  <div class="row2" id="mmSecrets" hidden><div class="chips" id="secChips"></div></div>`;

// --- moves ---------------------------------------------------------------------------------------------------
const autoHere = () => S.auto && S.auto.view === lab.view;
const canMove = () => !S.sec && !autoHere() && ((lab.view === 'maze' && S.m.phase === 'walk') || (lab.view === 'lost' && S.l.ans !== null && !S.l.done));
const curCell = () => (lab.view === 'maze' ? S.m.stack[S.m.stack.length - 1] : S.l.cell);
function doStep(n) {
  if (lab.view === 'maze') {
    const M = S.m, sk = M.stack;
    if (sk.length > 1 && sk[sk.length - 2] === n) sk.pop(); else sk.push(n);
    sfx.tick();
    if (n === CENTER_C) { M.phase = 'centre'; sfx.good(); }
  } else {
    const Lo = S.l, from = Lo.cell;
    if (GOOD.has(from) && !GOOD.has(n)) Lo.wrong++;
    Lo.cell = n; Lo.route = pathBetween(START_C, n); sfx.tick();
    if (n === START_C) { Lo.done = true; Lo.doneT = now(); sfx.good(); }
  }
  render();
}
function stepDir(d) {
  if (!canMove()) return;
  const n = neighbor(curCell(), d);
  if (n < 0) { const st = lab.view === 'maze' ? S.m : S.l; st.px += DX[d] * .14; st.py += DY[d] * .14; sfx.bad(); return; } // bump into the wall
  doStep(n);
}
function mazeReset() { const M = S.m; Object.assign(M, { phase: 'walk', stack: [START_C], px: START_X + .5, py: N - .5, ballT: now(), doneT: -9, exited: false }); sfx.click(); render(); }
function lostReset() { const Lo = S.l; Object.assign(Lo, { cell: BEGIN, px: .5, py: .5, wrong: 0, done: false, doneT: -9, thread: false, route: pathBetween(START_C, BEGIN) }); sfx.click(); render(); }
function runAuto(time) {
  const a = S.auto;
  if (!a || time < a.next) return;
  a.next = time + a.every; a.onStep(a.i++);
  if (S.auto === a && a.i >= a.n) { S.auto = null; a.onEnd(); }
}
function startBack() {
  const M = S.m, n = M.stack.length; M.phase = 'back';
  S.auto = { view: 'maze', kind: 'back', n, i: 0, every: .22, next: now() + .35,
    onStep: (i) => { if (i < n - 1) { M.stack.pop(); sfx.tick(); } else { M.exited = true; M.doneT = now(); sfx.good(); } render(); },
    onEnd: () => { M.phase = 'done'; render(); } };
  render();
}
function startHand() {
  S.sec = 'hand';
  const H = S.h = { i: 0, cell: START_C, px: START_X + .5, py: N - .5, hx: START_X + 1, hy: N - .5, rd: 1, trail: [START_C], done: false };
  S.auto = { view: 'maze', kind: 'hand', n: HAND.length - 1, i: 0, every: .16, next: now() + .6,
    onStep: (i) => { const s = HAND[i + 1]; H.i = i + 1; H.cell = s.c; H.rd = (s.d + 1) % 4; H.trail.push(s.c); sfx.tick(); render(); },
    onEnd: () => { H.done = true; sfx.good(); render(); } };
}
function closeSecret() { if (S.auto && S.auto.kind === 'hand') S.auto = null; S.sec = null; S.h = null; }

// --- input ---------------------------------------------------------------------------------------------------
const cv = $('cv');
let dragging = false;
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function dragTo(ev) {
  if (!canMove()) return;
  const r = cv.getBoundingClientRect(), L = lay(r.width, r.height);
  const x = Math.floor((ev.clientX - r.left - L.ox) / L.cs), y = Math.floor((ev.clientY - r.top - L.oy) / L.cs);
  if (!inb(x, y)) return;
  const path = pathBetween(curCell(), idx(x, y));
  if (path.length < 2 || path.length > 3) return; // at most two corridor steps at once, always along a real corridor
  for (const n of path.slice(1)) { if (!canMove()) break; doStep(n); }
}
function storyTap(ev) {
  const s = S.s, g = s.geo; if (!g || s.done) return;
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left - g.ox) / g.sc, y = (ev.clientY - r.top - g.oy) / g.sc;
  const k = [0, 1, 2, 3].find((i) => x >= s.cx[i] && x <= s.cx[i] + CW && y >= s.cy[i] && y <= s.cy[i] + CH);
  if (k === undefined || k < s.placed) return;
  if (k === s.placed) {
    s.placed++; s.miss = false; sfx.snap();
    if (s.placed === 4) { s.done = true; s.doneT = now(); sfx.good(); }
  } else { s.shake = { k, t0: now() }; s.miss = true; sfx.bad(); }
  render();
}
cv.addEventListener('click', (ev) => { if (lab.view === 'story') storyTap(ev); }); // a click, not a pointerdown: a swipe to scroll must not tap a card
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view === 'story') return;
  dragging = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
  dragTo(ev);
});
cv.addEventListener('pointermove', (ev) => { if (dragging) dragTo(ev); });
['pointerup', 'pointercancel'].forEach((e) => cv.addEventListener(e, () => { dragging = false; }));
addEventListener('keydown', (ev) => {
  const d = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 }[ev.key];
  if (d === undefined || $('secret').classList.contains('open') || !canMove()) return;
  ev.preventDefault(); stepDir(d);
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-dir]'); if (!b) return;
  if (b.dataset.dir !== undefined) { stepDir(+b.dataset.dir); return; }
  const a = b.dataset.act, v = lab.view, M = S.m, Lo = S.l;
  if (a === 'pick') {
    const i = +b.dataset.i;
    if (v === 'maze') { M.ans = i; M.phase = 'walk'; M.ballT = now(); (i === T[lang].mz.ok ? sfx.good : sfx.bad)(); }
    else { Lo.ans = i; (i === T[lang].ls.ok ? sfx.good : sfx.bad)(); }
    showStage();
  } else if (a === 'main') {
    if (v === 'maze') { if (M.phase === 'centre') startBack(); else if (M.phase === 'done') mazeReset(); return; }
    if (Lo.done) { lostReset(); return; }
  } else if (a === 'thread') { Lo.thread = !Lo.thread; sfx.click(); }
  else if (a === 'again') {
    const s = S.s; s.round++; s.placed = 0; s.miss = false; s.done = false; s.doneT = -9; s.cx = []; s.cy = []; sfx.click();
  } else if (a === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    const k = b.dataset.k, was = S.sec === k; closeSecret();
    if (!was) { if (k === 'hand') startHand(); else { S.sec = 'knossos'; S.knT = now(); } }
    sfx.click();
  }
  render();
});

// --- one render per change: controls, readout and the state card ---------------------------------------------
function render() {
  const t = T[lang], v = lab.view, M = S.m, Lo = S.l, s = S.s;
  document.body.dataset.v = v;
  cv.style.touchAction = v === 'story' ? 'pan-y' : 'none';
  if (v !== 'maze' && S.sec) closeSecret();
  const qv = v === 'maze' ? t.mz : t.ls, ans = v === 'maze' ? M.ans : v === 'lost' ? Lo.ans : 0, asking = v !== 'story' && ans === null;
  $('mmAsk').hidden = !asking;
  if (asking) {
    $('mmQ').textContent = qv.q;
    const key = v + lang;
    if (optsKey !== key) { optsKey = key; $('mmOpts').innerHTML = qv.opts.map((o, i) => `<button type="button" class="mm-opt" data-act="pick" data-i="${i}">${esc(o)}</button>`).join(''); }
  } else optsKey = '';
  const vd = $('mmVerdict'); vd.hidden = v === 'story' || asking || !!S.sec;
  if (!vd.hidden) { vd.className = `mm-verdict ${ans === qv.ok ? 'good' : 'miss'}`; vd.textContent = (ans === qv.ok ? t.right : qv.miss) + (v === 'lost' ? ` ${qv.try}` : ''); }
  $('mmPlay').hidden = v === 'story' || asking || !!S.sec;
  $('mmPad').hidden = !canMove();
  [...$('mmPad').children].forEach((b) => b.setAttribute('aria-label', t.dir[+b.dataset.dir]));
  const main = $('mmMain');
  const mainTxt = v === 'maze' ? (M.phase === 'centre' ? t.mz.go : M.phase === 'done' ? t.mz.again : '') : (Lo.done ? t.ls.again : '');
  main.hidden = !mainTxt; main.textContent = mainTxt;
  $('mmThread').hidden = v !== 'lost' || asking; $('mmThread').textContent = Lo.thread ? t.ls.hide : t.ls.show;
  $('mmStory').hidden = v !== 'story';
  $('stQ').textContent = s.done ? t.st.done[0] : s.miss ? t.st.miss : t.st.asks[s.placed];
  $('stAgain').hidden = !s.done; $('stAgain').textContent = t.st.again;
  $('mmSecrets').hidden = v !== 'maze' || M.ans === null;
  const op = secret.unlocked(), sc = (k, emo) => `<button type="button" class="chip secret mm-sec ${op ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${op ? `${emo} ${esc(t.sx[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('hand', '✋') + sc('kn', '🏛️');
  if (v === 'maze') renderMaze(t); else if (v === 'lost') renderLost(t); else renderStory(t);
}
function renderMaze(t) {
  const M = S.m, z = t.mz, n = M.stack.length - 1;
  lab.setGlow('rgba(214, 160, 70, .26)');
  if (M.ans === null) {
    lab.setReadout('?', '', '', '#d9a441'); lab.setFacts([]);
    lab.setState({ emo: '🤔', title: z.q, lead: z.pre, body: t.choose }); return;
  }
  if (S.sec) { renderSecret(t); return; }
  lab.setFacts([{ emo: '🏛️', text: t.facts.kn, src: SRC.kn }]);
  lab.setReadout(n, z.sub(n), '', '#d9a441');
  const emo = { walk: n === 0 ? '🧶' : '🚶', centre: '🐂', back: '🧶', done: '🎉' }[M.phase];
  const [title, lead, body] = M.phase === 'walk' && n === 0 ? z.reveal : z[M.phase];
  lab.setState({ emo, title, lead, body });
}
function renderLost(t) {
  const Lo = S.l, z = t.ls;
  lab.setGlow('rgba(143, 127, 208, .26)');
  if (Lo.ans === null) {
    lab.setReadout('?', '', '', '#8f7fd0'); lab.setFacts([]);
    lab.setState({ emo: '🤔', title: z.q, lead: z.pre, body: t.choose }); return;
  }
  lab.setFacts([{ emo: '✋', text: t.facts.wall, src: SRC.wall }]);
  lab.setReadout(Lo.wrong, z.sub(Lo.wrong), Lo.thread ? z.pill : '', '#8f7fd0');
  if (Lo.done) lab.setState({ emo: '🚪', title: z.done[0], lead: z.doneLead(Lo.wrong), body: Lo.thread ? z.done[1] : z.done[2] });
  else if (Lo.thread) lab.setState({ emo: '🧶', title: z.thread[0], lead: z.thread[1], body: z.thread[2] });
  else lab.setState({ emo: '😵', title: z.play[0], lead: z.play[1], body: Lo.wrong ? z.play[3] : z.play[2] });
}
function renderStory(t) {
  const s = S.s, z = t.st;
  lab.setGlow('rgba(224, 176, 80, .24)');
  lab.setFacts([{ emo: '🧶', text: t.facts.th, src: SRC.th }]);
  lab.setReadout(`${s.placed}/4`, z.sub, '', '#e0b050');
  if (s.done) lab.setState({ emo: '🏛️', title: z.done[0], lead: z.done[1], body: z.done[2] });
  else lab.setState({ emo: '📖', title: z.title, lead: z.asks[s.placed], body: z.body });
}
function renderSecret(t) {
  const x = t.sx;
  lab.setGlow('rgba(214, 160, 70, .26)');
  if (S.sec === 'hand') {
    const H = S.h, sct = H.done ? x.handDone : x.handRun;
    lab.setReadout(H.i, x.steps(H.i), '', '#d9a441'); lab.setFacts([{ emo: '✋', text: t.facts.wall, src: SRC.wall }]);
    lab.setState({ emo: '✋', title: sct[0], lead: sct[1], body: sct[2] });
  } else {
    lab.setReadout(esc(x.kn[0]), '', '', '#d9a441'); lab.setFacts([{ emo: '🏛️', text: t.facts.kn, src: SRC.kn }]);
    lab.setState({ emo: '🏛️', title: x.knos[0], lead: x.knos[1], body: x.knos[2] });
  }
}

canvasLoop(cv, (c, w, h, dt, time) => {
  runAuto(time);
  if (lab.view === 'story') drawStory(c, w, h, dt, time);
  else if (S.sec === 'knossos') drawPalace(c, w, h, time);
  else drawMazeScene(c, w, h, dt, time);
});
render();
</script>
