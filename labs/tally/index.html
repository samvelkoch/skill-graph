// one round of the road: a seeded shuffle of 20 cars with a clear winner; the true counts stay inside R until the guess is made
function makeRound(n) {
  const rnd = mulberry(1000 + n * 97), d = DIST[(n * 3 + 1) % DIST.length], counts = { r: d[0], b: d[1], y: d[2] };
  const seq = KEYS.flatMap((k) => new Array(counts[k]).fill(k));
  for (let i = seq.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [seq[i], seq[j]] = [seq[j], seq[i]]; }
  const spawn = []; let at = 0.8;
  for (let i = 0; i < CAR_N; i++) { spawn.push(at); at += 1.05 + rnd() * 0.3; }
  return { seq, spawn, counts };
}

function chartInfo() {

  const sum = vals.r + vals.b + vals.y;
  if (sum < 6 || vals.r === vals.b && vals.b === vals.y) { vals = SAMPLE; sample = true; }
  const X = argmax(vals), Y = argmin(vals), d = vals[X] - vals[Y], mx = Math.max(vals.r, vals.b, vals.y);
  const set = [d]; for (const x of [vals[X], d + 2, d + 1, d + 3]) if (set.length < 3 && !set.includes(x)) set.push(x);

  return { vals, sample, X, Y, d, opts: set.sort((a, b) => a - b), ymax, sum: vals.r + vals.b + vals.y };
}

function drawTally(c, x, y, n, sp, h, col, times, time, wrap = 0, shadow = true) {

}
function renderFast(t) {
  const f = t.fast, ph = fPhase(), r = F.round, cs = F.cards.s, cb = F.cards.b, last = r >= ROUNDS.length - 1;
  lab.setGlow('rgba(245,200,76,.2)');
  $('fPred').hidden = ph !== 'predict';
  if (ph === 'predict') $('fPred').innerHTML = `<p class="tl-q">${esc(f.pred[0])}</p><div class="tl-opts">${['s', 'b', 'e'].map((k) => `<button class="tl-opt" data-act="fpred" data-v="${k}">${esc(f.qopt[k])}</button>`).join('')}</div>`;
  $('fReady').hidden = ph !== 'ready';
  $('fcS').textContent = f.countS; $('fcB').textContent = f.countB; $('fcS').disabled = cs.time !== null; $('fcB').disabled = cb.time !== null;
  $('fPad').hidden = ph !== 'count';
  $('fDel').textContent = f.del; $('fOk').textContent = f.ok;
  $('fNextRow').hidden = ph !== 'compare';
  $('fNext').textContent = last ? f.again : f.next;
  let st;
  if (ph === 'predict') { lab.setReadout('?', '', '', '#f5c84c'); st = { emo: '⏱️', title: f.pred[0], lead: f.pred[1], body: '' }; }
  else if (ph === 'ready') {
    lab.setReadout('?', `${r + 1} / ${ROUNDS.length}`, '', '#f5c84c');
    st = cs.time !== null || cb.time !== null ? { emo: '🙈', title: f.half[0], lead: f.half[1], body: '' } : { emo: '🙈', title: f.ready[0], lead: f.ready[1], body: f.ready[2] };
  } else if (ph === 'count') {
    lab.setReadout(F.input || '…', F.active === 's' ? f.cs : f.cb, '', '#f5c84c');
    st = F.msg ? { emo: '🤔', title: f.wrong[0], lead: f.wrong[1], body: '' } : { emo: '🧮', title: f.counting[0], lead: f.counting[1], body: '' };
  } else {
    const w = F.wins[r], k = F.wins.filter((x) => x === 'b').length;
    lab.setReadout(`${fmt(cs.time)} · ${fmt(cb.time)}`, `${f.cs} · ${f.cb}`, '', '#f5c84c');
    st = { emo: '🏁', title: last ? f.sum(k, ROUNDS.length) : f.win[w], lead: f.times(fmt(cs.time), fmt(cb.time)), body: r === 0 ? f.predLine(f.pn[F.pred], F.pred === w) : last ? f.sumLead(k) : '' };
  }
  lab.setState({ ...st, extra: '' });
  lab.setFacts(t.facts.fast);
}
function chartSync() {
  const info = chartInfo(), key = JSON.stringify(info.vals);
  if (key !== C.key) { C.key = key; C.step = 0; C.guess = null; }
  return info;
}
function renderChart(t) {
  const ch = t.chart, info = chartSync(), open = secret.unlocked(), sec = C.sec;
  lab.setGlow('rgba(78,141,245,.22)');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${C.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('bone', '🦴') + sc('same', '🧮');
  $('cMake').hidden = !!sec || C.step !== 0; $('cMakeB').textContent = ch.make;
  $('cAsk').hidden = !!sec || C.step !== 1; $('cTools').hidden = !!sec || C.step !== 1; $('sSec').hidden = !sec;
  $('cLab').textContent = ch.labels; $('cLab').classList.toggle('on', C.labels); $('cBack').textContent = ch.back;
  if (sec) return renderSecret(t);
  const xn = t.plural[KEYS.indexOf(info.X)], yn = t.plural[KEYS.indexOf(info.Y)], ans = C.guess;
  if (C.step === 1) {
    $('cAsk').innerHTML = `<p class="tl-q">${esc(ch.q(xn, yn))}</p><div class="tl-opts">${info.opts.map((o) => `<button class="tl-opt${ans === null ? '' : o === info.d ? ' good' : o === ans ? ' miss' : ''}" data-act="cguess" data-v="${o}"${ans === null ? '' : ' disabled'}>${o}</button>`).join('')}</div>`;
  }
  lab.setReadout(String(info.sum), ch.total, '', '#4e8df5');
  let st;
  if (C.step === 0) st = { emo: '📋', title: ch.tableSt[0], lead: ch.tableSt[1], body: info.sample ? ch.sample : ch.own };
  else if (!C.labels) st = { emo: '🤷', title: ch.noLab[0], lead: ch.noLab[1], body: '' };
  else if (ans === null) st = { emo: '🔎', title: ch.q(xn, yn), lead: ch.look, body: '' };
  else st = ans === info.d ? { emo: '✅', title: t.right, lead: ch.lead(t.names[KEYS.indexOf(info.X)], t.names[KEYS.indexOf(info.Y)], info.d), body: ch.gap }
    : { emo: '🤔', title: ch.miss(ans, info.d), lead: ch.lead(t.names[KEYS.indexOf(info.X)], t.names[KEYS.indexOf(info.Y)], info.d), body: ch.gap };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(t.facts.chart);
}
function renderSecret(t) {
  const s = t.sec, n = C.sec === 'bone' ? C.bone : C.same;
  if (C.sec === 'bone') {
    const b = s.bone, q = Math.floor(n / 5), r = n % 5;
    $('sSec').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn" data-act="carve"${n >= 25 ? ' disabled' : ''}>${esc(b.carve)}</button><button class="chip" data-act="scrape">${esc(b.scrape)}</button></div>`;
    lab.setReadout(String(n), b.notches(n), '', '#d9a85f');
    lab.setState(n === 0 ? { emo: '🦴', title: b.t0, lead: b.l0, body: '', extra: '' } : { emo: '🦴', title: b.title(n), lead: b.lead(q, r), body: b.body, extra: '' });
    lab.setFacts(t.facts.bone);
  } else {
    const a = Math.floor(n / 5), b = n % 5, d = Math.floor(n / 10), e = n % 10;
    $('sSec').innerHTML = `<div class="tl-step"><button data-act="sdec"${n <= 0 ? ' disabled' : ''} aria-label="−">−</button><b>${n}</b><button data-act="sinc"${n >= 25 ? ' disabled' : ''} aria-label="+">+</button><button class="chip" data-act="sfive">+5</button></div>`;
    lab.setReadout(String(n), s.same.unit, '', '#8fd6b0');
    lab.setState({ emo: '🧮', title: s.same.title(n), lead: s.same.lead, body: `${n} = ${a} × 5 + ${b}   ·   ${n} = ${d} × 10 + ${e}`, extra: '' });
    lab.setFacts(t.facts.same);
  }
}
render();
</script>
