  $('aQ').style.display = A.done ? 'none' : '';
  $('aSl').hidden = !A.done;
  $('aQ').innerHTML = `<p class="cv-q">${esc(a.q)}</p><div class="cv-opts">${[100, 1000, 10000].map((o, i) => `<button class="cv-opt ${A.pick !== null && i === 2 ? 'good' : A.pick === i ? 'bad' : ''}" data-act="apick" data-i="${i}"${A.pick !== null ? ' disabled' : ''}>${esc(F(o))}</button>`).join('')}</div>`;
  $('aSlL').innerHTML = `${esc(a.side)}: <b>${esc(F(A.side))} m</b>`;
  if (+$('aRange').value !== A.side) $('aRange').value = A.side;
  $('aUnits').innerHTML = `<span class="cv-lbl">${esc(a.in)}</span>${chipRow(t.au, A.unit, 'aunit', false)}`;
  $('aAgain').textContent = a.again;
  if (A.pick === null) {
    lab.setReadout('? cm²', '', '', '#3fe0bf');
    lab.setState({ emo: '⬜', title: a.q, lead: a.ask, body: '', extra: '' });
  } else if (!A.done) {
    lab.setReadout('? cm²', '', '', '#3fe0bf');
    lab.setState({ emo: '🧮', title: a.counting, lead: '', body: '', extra: '' });
  } else if (A.side === 1 && !A.touched) {
    lab.setReadout(`1 m² = ${F(10000)} cm²`, '', '', '#3fe0bf');
    lab.setState({ emo: A.pick === 2 ? '✅' : '🤔', title: A.pick === 2 ? t.right : t.itIs(F(10000), t.au[1].replace('²', '²')), lead: a.lead, body: a.body, extra: '' });
  } else {
    const s = A.side, A_ = s * s, val = [A_, A_ * 10000, A_ / 10000][A.unit];
    lab.setReadout(`${F(s)} m × ${F(s)} m = ${F(val)} ${t.au[A.unit]}`, '', '', '#3fe0bf');
    lab.setState({ emo: '⬜', title: a.title(F(s)), lead: a.lead2(F(s), F(A_)), body: s === 100 ? `${a.body2(F(A_ * 10000), F(A_ / 10000))} ${a.pitch}` : a.body2(F(A_ * 10000), F(A_ / 10000)), extra: '' });
  }
}
function renderVol(t) {
  const V = S.vol, o = t.vol;
  let html = '';
  if (V.k < 10) {
    html = `<p class="cv-q">${esc(o.cubeLead)}</p><div class="row2" style="margin-top:0"><button class="btn" data-act="vadd">${esc(o.add)}</button><button class="chip cv-ch" data-act="vfill">${esc(o.fill)}</button>${V.k ? `<button class="chip cv-ch" data-act="vempty">${esc(o.empty)}</button>` : ''}</div>`;
    lab.setReadout(`${F(V.k * 100)} cm³`, `= ${F(V.k * 100)} ${lang === 'ru' ? 'мл' : 'ml'}`, '', '#4aa3ff');
    lab.setState({ emo: '🥛', title: o.cube, lead: o.cubeLead, body: V.k ? '' : '', extra: '' });
  } else if (V.pick === null) {
    html = `<p class="cv-q">${esc(o.q)}</p><div class="cv-opts">${[10, 100, 1000].map((n, i) => `<button class="cv-opt" data-act="vpick" data-i="${i}">${esc(F(n))}</button>`).join('')}</div>`;
    lab.setReadout(`? ${t.L}`, o.tank, '', '#4aa3ff');
    lab.setState({ emo: '🛢️', title: o.q, lead: o.fullLead, body: o.ask, extra: '' });
  } else if (!V.done) {
    html = `<p class="cv-q">${esc(o.q)}</p><div class="cv-opts">${[10, 100, 1000].map((n, i) => `<button class="cv-opt ${i === 2 ? 'good' : V.pick === i ? 'bad' : ''}" disabled>${esc(F(n))}</button>`).join('')}</div>`;
    lab.setReadout(`? ${t.L}`, o.tank, '', '#4aa3ff');
    lab.setState({ emo: '🛢️', title: o.filling, lead: '', body: '', extra: '' });
  } else if (!V.scale) {
    html = `<div class="row2" style="margin-top:0"><button class="btn" data-act="vscale">${esc(o.weigh)}</button><button class="chip cv-ch" data-act="vagain">${esc(o.again)}</button></div>`;
    lab.setReadout(`1 m³ = ${F(1000)} ${t.L}`, '', '', '#4aa3ff');
    lab.setState({ emo: V.pick === 2 ? '✅' : '🤔', title: V.pick === 2 ? t.right : t.itIs(F(1000), t.L), lead: o.lead, body: o.body, extra: '' });
  } else {
    const n = V.n, big = n >= 1000, kg = t.kg;
    html = `<div class="cv-step"><span class="cv-lbl">${esc(o.litres)}</span><button class="cv-sb" data-act="vdec" aria-label="−"${!big && n <= 1 ? ' disabled' : ''}>−</button><b class="cv-n">${big ? '' : esc(F(n))}</b><button class="cv-sb" data-act="vinc" aria-label="+"${!big && n >= 10 ? ' disabled' : ''}>+</button></div>
      <div class="row2"><button class="chip cv-ch ${big ? 'on' : ''}" data-act="vwhole">${esc(o.whole)}</button><button class="chip cv-ch" data-act="vback">${esc(o.back)}</button></div>`;
    lab.setReadout(`${F(n)} ${t.L} = ${F(n)} ${kg}`, '', '', '#4aa3ff');
    lab.setState({ emo: '⚖️', title: o.sTitle, lead: big ? o.sTank : o.sLead(F(n)), body: '', extra: '' });
  }
  $('cVol').innerHTML = html;
}
function renderTime(t) {
  const h = S.time.h, m = h * 60;
  $('tSlL').innerHTML = `${esc(t.time.hours)}: <b>${esc(F(h))} ${esc(t.h)}</b>`;
  if (+$('tRange').value !== h) $('tRange').value = h;
  lab.setReadout(`${F(h)} ${t.h} = ${F(m)} ${t.min}`, '', '', '#f5c84c');
  lab.setState({ emo: '🕐', title: t.time.title, lead: t.time.lead(F(h), F(m)), body: t.time.body, extra: '' });
}
function renderRain(t) {
  const { d, s } = S.rain, a = s * s, l = d * a;
  $('rDL').innerHTML = `${esc(t.rain.depth)}: <b>${esc(F(d))} mm</b>`;
  $('rSL').innerHTML = `${esc(t.rain.side)}: <b>${esc(F(s))} m</b>`;
  if (+$('rD').value !== d) $('rD').value = d;
  if (+$('rS').value !== s) $('rS').value = s;
  lab.setReadout(`${F(d)} mm × ${F(a)} m² = ${F(l)} ${t.L}`, '', '', '#4aa3ff');
  lab.setState({ emo: '🌧️', title: t.rain.title(F(d), F(a)), lead: t.rain.lead(F(d), F(a), F(l)), body: t.rain.body, extra: '' });
}
render();
</script>
</body>
</html>
