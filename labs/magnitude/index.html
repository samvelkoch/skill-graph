// --- numbers --------------------------------------------------------------------------------------------------
const ampMM = (m) => 10 ** (m - 2); // the wiggle on the paper, in mm: x10 per step (the model of this lab)
const grp = (v) => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const sig2 = (x) => { const p = 10 ** (Math.floor(Math.log10(x)) - 1); return Math.round(x / p) * p; };
// a ratio as a short string: 32, 1 000, 33 000, 1 million, 34 billion. word = the number carries a word (million, billion)
function fmtN(x) {
  const dec = lang === 'en' ? '.' : ',', t = T[lang];
  if (x < 1000) { const v = x < 100 ? Math.round(x) : sig2(x); return { s: String(v), k: v, word: false }; }
  if (x < 1e6) { const v = sig2(x); return { s: grp(v), k: v, word: false }; }
  const [div, key] = x < 1e9 ? [1e6, 'M'] : [1e9, 'B'];
  const v = +sig2(x / div).toFixed(1);
  return { s: `${String(v).replace('.', dec)} ${t.num[key]}`, k: 5, word: true };
}

// --- colours and canvas helpers --------------------------------------------------------------------------------
const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mixc = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
const hexOf = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const dark = (h, k) => mixc(h, '#000000', k);
const light = (h, k) => mixc(h, '#ffffff', k);
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const easeOut = (x) => 1 - (1 - clamp01(x)) ** 3;

  }).join('')}</div><div class="mq-verdict ${ans === null ? '' : ans === right ? 'ok' : 'bad'}">${ans === null ? '' : esc(ans === right ? rightT : wrongT)}</div></div>`;
}
const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
function render() {
  const t = T[lang], v = lab.view;
  show('mqD', v === 'drum'); show('mqL', v === 'ladder'); show('mqM', v === 'map');
  $('cv').style.touchAction = v === 'map' && !S.sec ? 'none' : '';
  const open = secret.unlocked();
  $('secChips').innerHTML = [['a', '📏'], ['b', '💥']].map(([k, emo]) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setGlow('rgba(231, 111, 81, .26)');
  if (S.sec) {
    lab.setFacts([]);
    lab.setReadout(S.sec === 'a' ? '1935' : `M ${fmtM(9.5)}`, S.sec === 'a' ? t.ca : t.quakes.valdivia, '', OR2);
    lab.setState({ emo: S.sec === 'a' ? '📏' : '💥', title: t.secrets[S.sec][0], lead: S.sec === 'a' ? t.inventText : t.biggestText, body: '' });
    return;
  }
  if (v === 'drum') renderDrum(t); else if (v === 'ladder') renderLadder(t); else renderMap(t);
}
function renderDrum(t) {
  const asking = S.P.d.ans === null;
  $('pD').innerHTML = predHTML('d', t.drumAsk, t.drumOpts, S.P.d, t.drumRight, t.drumWrong);
  $('slLbl').textContent = t.mag; $('shake').textContent = t.shake;
  $('sl').disabled = asking; $('shake').disabled = asking; $('sl').value = S.M;
  $('sl').setAttribute('aria-label', t.mag);
  if (asking) {
    lab.setReadout('M ?', '', '', OR2); lab.setFacts([]);
    lab.setState({ emo: '🤔', title: t.drumAsk, lead: '', body: '' });
  } else {
    lab.setReadout(t.mVal(S.M), t.magSub, t.perStep, OR2); lab.setFacts(t.facts.drum);
    lab.setState({ emo: t.st.drum[0], title: t.st.drum[1], lead: t.st.drum[2], body: t.st.drum[3] });
  }
}
function renderLadder(t) {
  const asking = S.P.l.ans === null, L = S.L;
  $('pL').innerHTML = predHTML('l', t.ladderAsk, t.ladderOpts, S.P.l, t.ladderRight, t.ladderWrong);
  $('lHint').textContent = asking ? '' : t.pickTwo;
  if (asking) {
    lab.setReadout('?', '', '', OR2); lab.setFacts([]);
    lab.setState({ emo: '🤔', title: t.ladderAsk, lead: '', body: '' });
    return;
  }
  lab.setFacts(t.facts.ladder);
  const st = t.st.ladder;
  if (L.a !== null && L.b !== null) {
    const lo = L.a + 2, hi = L.b + 2, n = fmtN(32 ** (hi - lo));
    lab.setReadout(`× ${n.s}`, '', `M ${lo} → M ${hi}`, OR2);
    lab.setState({ emo: st[0], title: st[1], lead: t.cmp(hi, lo, t.times(n)), body: st[3] });
  } else {
    lab.setReadout('?', t.pickTwo, L.a !== null ? `M ${L.a + 2}` : '', OR2);
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '' });
  }
}
function renderMap(t) {
  const mk = S.mk;
  $('story').textContent = t.mystery; $('chk').textContent = t.check; $('chk').disabled = !mk.moved;
  const mV = $('mV'); mV.textContent = mk.res === null ? '' : mk.res ? t.mysteryRight : t.mysteryWrong; mV.className = `mq-verdict ${mk.res === null ? '' : mk.res ? 'ok' : 'bad'}`;
  lab.setFacts(t.facts.map);
  const q = QUAKES.find((z) => z.key === S.sel);
  if (q) {
    const n = fmtN(32 ** (q.M - 5)), fact = q.f !== undefined ? t.facts.map[q.f].text : '';
    lab.setReadout(`M ${fmtM(q.M)}`, '', t.quakes[q.key], OR2);
    lab.setState({ emo: '🌍', title: t.quakes[q.key], lead: t.cmp(q.M, 5, t.times(n)), body: fact });
  } else if (mk.moved) {
    lab.setReadout(`M ${fmtM(mk.M)}`, '', '', OR2);
    lab.setState({ emo: '❓', title: t.mysteryTitle, lead: t.mystery.slice(t.mystery.indexOf(':') + 1).trim(), body: '' });
  } else {
    lab.setReadout('M ?', '', '', OR2);
    lab.setState({ emo: t.st.map[0], title: t.st.map[1], lead: t.st.map[2], body: t.st.map[3] });
  }
}
render();
</script>
