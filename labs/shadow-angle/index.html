  faces.sort((a, b) => Pp(b.pts[0])[2] + Pp(b.pts[2])[2] - Pp(a.pts[0])[2] - Pp(a.pts[2])[2]);
  const drawWalls = () => {
  for (const f of faces) {
    const [ax, ay] = Pp(f.pts[0]), [bx, by] = Pp(f.pts[2]), gr = c.createLinearGradient(ax, ay, bx, by), k = shadeOf(f.n);
    gr.addColorStop(0, mulHex('#7d8fc4', k + 0.12)); gr.addColorStop(1, mulHex('#4a5a8e', k));

  }
  };
  const drawRoof = () => {
  const [r1x, r1y] = Pp(cs[0]), [r3x, r3y] = Pp(cs[2]), rg = c.createLinearGradient(r1x, r1y, r3x, r3y), kk = shadeOf(gm.n);
  rg.addColorStop(0, mulHex('#e58a6a', kk + 0.1)); rg.addColorStop(1, mulHex('#b4563d', kk));

  for (let u = -UU + 0.8; u < UU - 0.1; u += 0.8) { const [x, y] = Pp(gm.C(u, -VV)), [x2, y2] = Pp(gm.C(u, VV)); c.moveTo(x, y); c.lineTo(x2, y2); }

    c.beginPath(); c.moveTo(bx, by); c.lineTo(ex, ey); c.strokeStyle = RC[r.i]; c.lineWidth = 2.6; c.stroke();

// --- view 3: the ramp ----------------------------------------------------------------------------------------
function sceneRamp(c) {
  const { rise, run } = S, Wd = 0.75, Lp = run + 1.6, post = S.g3 !== null;
  setCam('ramp', Math.hypot((run + 4.4) / 2, 2.2), rise + 1.3, run / 2 + 0.6, 0);
  // ground slab with a grid
  const gx0 = -1.6, gx1 = Lp + 1.2, gy = 2.2, gp = [[gx0, -gy, 0], [gx1, -gy, 0], [gx1, gy, 0], [gx0, gy, 0]];
  const [a1x, a1y] = Pp(gp[0]), [a2x, a2y] = Pp(gp[2]), gg = c.createLinearGradient(a1x, a1y, a2x, a2y);
  gg.addColorStop(0, '#26335a'); gg.addColorStop(1, '#141a36');
  poly3(c, gp, gg, 'rgba(190,205,255,.3)', 1.2);
  c.beginPath();
  for (let x = Math.ceil(gx0); x <= gx1; x++) { const [p, q] = Pp([x, -gy, 0]), [p2, q2] = Pp([x, gy, 0]); c.moveTo(p, q); c.lineTo(p2, q2); }
  for (let y = -2; y <= 2; y++) { const [p, q] = Pp([gx0, y, 0]), [p2, q2] = Pp([gx1, y, 0]); c.moveTo(p, q); c.lineTo(p2, q2); }
  c.strokeStyle = 'rgba(190,205,255,.09)'; c.lineWidth = 1; c.stroke();
  // the ramp and its platform: a prism whose side is the trapezoid A B C D, drawn by its visible faces
  const len = Math.hypot(run, rise), nr = [-rise / len, 0, run / len];
  const A = (y) => [0, y, 0], B = (y) => [Lp, y, 0], Cc = (y) => [Lp, y, rise], D = (y) => [run, y, rise];
  const faces = [
    { pts: [A(-Wd), B(-Wd), Cc(-Wd), D(-Wd)], n: [0, -1, 0], col: '#7e89ad' }, { pts: [A(Wd), B(Wd), Cc(Wd), D(Wd)], n: [0, 1, 0], col: '#7e89ad' },
    { pts: [B(-Wd), B(Wd), Cc(Wd), Cc(-Wd)], n: [1, 0, 0], col: '#7e89ad' }, { pts: [D(-Wd), Cc(-Wd), Cc(Wd), D(Wd)], n: [0, 0, 1], col: '#cfd6ea' },
    { pts: [A(-Wd), D(-Wd), D(Wd), A(Wd)], n: nr, col: '#b3bcd6' },
  ].filter((f) => facing(f.n));
  faces.sort((a, b) => Pp(b.pts[0])[2] + Pp(b.pts[2])[2] - Pp(a.pts[0])[2] - Pp(a.pts[2])[2]);
  for (const f of faces) {
    const [ax, ay] = Pp(f.pts[0]), [bx, by] = Pp(f.pts[2]), gr = c.createLinearGradient(ax, ay, bx, by), k = shadeOf(f.n);
    gr.addColorStop(0, mulHex(f.col, k + 0.1)); gr.addColorStop(1, mulHex(f.col, k - 0.08));
    poly3(c, f.pts, gr, '#151a33', 1.5);
  }
  if (facing(nr)) { // anti-slip strips across the slope
    c.beginPath();
    for (let x = 0.5; x < run; x += 0.5) { const [p, q] = Pp([x, -Wd, x * rise / run]), [p2, q2] = Pp([x, Wd, x * rise / run]); c.moveTo(p, q); c.lineTo(p2, q2); }
    c.strokeStyle = 'rgba(40,50,90,.28)'; c.lineWidth = 1; c.stroke();
  }
  // handrails
  const posts = Math.max(1, Math.round(run / 1.8));
  for (const y of [-Wd, Wd]) {
    for (let i = 0; i <= posts; i++) { const x = run * i / posts, z = x * rise / run; line3(c, [x, y, z], [x, y, z + 0.9], '#e6eaf5', 1.6); }
    line3(c, [0, y, 0.9], [run, y, rise + 0.9], '#e6eaf5', 2.4);
  }
  // sign on the platform
  const [sx, sy] = Pp([run + 0.9, 0, rise]), [sx2, sy2] = Pp([run + 0.9, 0, rise + 1.2]);
  c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx2, sy2); c.strokeStyle = '#cfd6ea'; c.lineWidth = 2; c.stroke();
  c.save(); c.fillStyle = '#2f6fd0'; c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(sx2 - 12, sy2 - 24, 24, 24, 5); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.font = '700 17px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('♿', sx2, sy2 - 11.5); c.restore();
  // the right triangle: rise, ground length (the projection), slope - drawn on the side that looks at us
  const ys = facing([0, -1, 0]) ? -Wd - 0.02 : Wd + 0.02, tA = [0, ys, 0], tD = [run, ys, rise], tG = [run, ys, 0];
  poly3(c, [tA, tG, tD], 'rgba(255,200,110,.18)', null);
  c.lineCap = 'round';
  line3(c, tA, tG, '#6fb7ff', 4.5); line3(c, tG, tD, '#ffa86b', 4.5);
  const u = T[lang].u, t = T[lang].s3;
  pill3(c, `${t.ground} ${f1(run)} ${u}`, [run / 2, ys, 0], '#6fb7ff', 0, 17);
  pill3(c, `${t.rise} ${f1(rise, 2)} ${u}`, [run, ys, rise / 2], '#ffa86b', 52, 0);
  if (run > 0.6 && rise > 0.1) { const q = 0.28; path3(c, [[run - q, ys, 0], [run - q, ys, q], [run, ys, q]]); c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.2; c.stroke(); }
  if (post) {
    const ra = Math.min(2.2, 0.32 * run), ex = [1, 0, 0], er = [run / len, 0, rise / len], org = [0, ys, 0];
    const mid = arc3(c, org, ex, er, ra, '#ffd166', 3.5), ang = Math.atan2(rise, run) / DEG;
    pill3(c, `${f1(ang)}°`, add(org, [mid[0], mid[1] - ys, mid[2]], 1.45), '#ffd166', -8, -20);
  }
  hintPill(c);
}

  $('task3').hidden = !post;
  $('taskT').textContent = s.task(f1(STEP, 2)); $('stepB').textContent = s.setStep;
  $('riseL').textContent = s.riseL; $('riseN').textContent = `${f1(S.rise, 2)} ${u}`; setVal('rsl', S.rise);
  $('runL').textContent = s.runL; $('runN').textContent = `${f1(S.run)} ${u}`; setVal('usl', S.run);
  const { rise, run } = S, ang = Math.atan2(rise, run) / DEG, surf = Math.hypot(rise, run);
  if (!post) {
    lab.setReadout('?', s.pre(f1(rise), f1(run), u), '', '#ffa86b');
    lab.setState({ emo: '♿', title: s.t0, lead: s.l0, body: '' });
    lab.setFacts([]);
    return;
  }
  const ratio = run / rise, gentle = ratio >= 12 - 1e-6, first = !S.t3, ok = S.g3 === 1;
  lab.setReadout(`${f1(ang)}°`, s.sub, `1 : ${f1(ratio)}`, '#ffa86b');
  const bodyF = S.g1 !== null ? s.bodyS : s.body;
  if (first) lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: s.lead(f1(ang)), body: bodyF(f1(surf, 2), f1(run), u) });
  else lab.setState({ emo: gentle ? '✅' : '⚠️', title: gentle ? s.ok : s.bad, lead: s.sl(f1(ratio), f1(ang)), body: bodyF(f1(surf, 2), f1(run), u) });
  lab.setFacts([t.f5, t.f6]);
}
render();
canvasLoop($('cv'), (c, w, h, dt, time) => {
  W = w; H = h;
  S.bv += (S.beta - S.bv) * Math.min(1, dt * 8);
  if (Math.abs(S.beta - S.bv) < 0.01) S.bv = S.beta;
  c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'shadow') sceneShadow(c, time); else if (v === 'gap') sceneGap(c, time); else sceneRamp(c);
});
</script>
