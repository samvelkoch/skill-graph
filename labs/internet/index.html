function parse(u) {
  const m = u.match(/^(https?):\/\/([^/?]+)(\/[^?]*)?(\?.*)?$/);
  const host = m[2], parts = host.split('.'), tld = parts[parts.length - 1], name = parts[parts.length - 2], sub = parts.slice(0, -2).join('.');
  return { proto: m[1], host, path: m[3] || '', query: m[4] || '', tld, name, sub };
}
function barHTML(p, ans, picked) {
  const seg = (key, html) => {
    const cls = ['in-seg'];
    if (!ans) cls.push('in-open');
    else { cls.push(`c-${key}`); if (key === 'dom') cls.push('in-good'); else if (picked === key) cls.push('in-bad'); }
    return `<span class="${cls.join(' ')}" data-p="${key}">${html}</span>`;
  };
  const dot = '<span class="in-dot">.</span>';
  const host = ans ? `${p.sub ? `<span class="c-sub">${esc(p.sub)}</span>${dot}` : ''}<span class="c-name">${esc(p.name)}</span>${dot}<span class="c-tld">${esc(p.tld)}</span>` : esc(p.host);
  const hostSeg = ans ? `<span class="in-seg in-good" data-p="dom">${host}</span>` : seg('dom', host);
  return seg('proto', `${esc(p.proto)}://`) + '<wbr>' + hostSeg + (p.path ? '<wbr>' + seg('path', esc(p.path)) : '') + (p.query ? '<wbr>' + seg('query', esc(p.query)) : '');
}
function legendHTML(p, t) {
  const row = (k, c, extra = '') => `<div class="in-li ${extra}"><i style="background:${c}"></i><div><b>${esc(t.u.names[k])}</b> ${esc(t.u.gloss[k])}</div></div>`;
  return row('proto', COL.proto) + row('dom', '#3ddc97') + (p.sub ? row('sub', COL.sub, 'sub') : '') + row('name', COL.name, 'sub') + row('tld', COL.tld, 'sub')
    + (p.path ? row('path', COL.path) : '') + (p.query ? row('query', COL.query) : '');
}
function renderUrl(t) {
  const U = S.url, p = parse(URLS[U.i]), ans = U.picked !== null, card = U.i > 0, u = t.u;
  $('inWin').style.display = 'block'; $('inPage').style.display = 'none'; $('inLoad').style.display = 'none'; $('inQ').style.display = '';
  $('inTab').textContent = card ? u.of(U.i) : '';
  $('inQ').innerHTML = U.end ? '' : `${esc(card ? u.qc : u.q)}${ans ? '' : `<small>${esc(u.hint)}</small>`}`;
  if (U.end) $('inQ').style.display = 'none';
  $('inUrl').innerHTML = barHTML(p, ans, U.picked);
  $('inLeg').innerHTML = ans ? legendHTML(p, t) : '';
  const nx = $('inNext');
  nx.style.display = ans ? '' : 'none';
  nx.textContent = U.end ? u.again : U.i === 3 ? u.fin : u.next;
  if (U.end) nx.style.display = '';
  const good = U.picked === 'dom';
  if (!ans && !U.end) {
    lab.setReadout('?', card ? u.of(U.i) : '', '', ACC.url);
    lab.setState(card ? { emo: '🔎', title: u.cardT, lead: u.cardL(U.i), body: '', extra: `<div class="in-fine">${esc(t.fine)}</div>` }
      : { emo: '🌐', title: u.preT, lead: u.preL, body: u.preB, extra: `<div class="in-fine">${esc(t.fine)}</div>` });
  } else if (U.end) {

    lab.setState({ emo: '🏆', title: u.end(k), lead: u.endL, body: '', extra: `<div class="in-fine">${esc(t.fine)}</div>` });
  } else {
    lab.setReadout(esc(p.host), t.u.names.dom, '', ACC.url);
    const missText = !good ? (u.miss[U.picked] ?? '') : '';
    if (!card) lab.setState({ emo: good ? '✅' : '🤔', title: good ? u.ok : u.no, lead: good ? u.okLead : missText, body: good ? u.postB : u.okLead, extra: `<div class="in-fine">${esc(t.fine)}</div>` });

  }
  lab.setFacts(t.facts.url);

      c.save(); c.beginPath(); c.rect(tx, ty, ts, ts); c.clip(); c.globalAlpha = a; cat(c, x0, y0, pw, ph); c.restore();
      if (t - at < 0.5) { c.fillStyle = `rgba(255,255,255,${0.55 * (1 - (t - at) / 0.5)})`; c.fillRect(tx, ty, ts, ts); }
    } else { c.font = FONT(12); c.fillStyle = '#6f82b4'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(k + 1), tx + ts / 2, ty + ts / 2); }
    c.strokeStyle = 'rgba(10,16,40,.5)'; c.lineWidth = 1; c.strokeRect(tx + 0.5, ty + 0.5, ts - 1, ts - 1);
  }
  // the picture on the server
  const tw = Math.round(ts * 1.9), th = Math.round(tw * 0.75), sx = w - 16 - tw, sy = 16;
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 8; c.shadowOffsetY = 3; rr(c, sx - 3, sy - 3, tw + 6, th + 6, 5); c.fillStyle = '#e9eefc'; c.fill(); c.restore();
  cat(c, sx, sy, tw, th);
  return { x: x0 - 5, y: y0 + ph + 10 };
}

function drawPackets(c, w, h, t) {
  const p = S.pk, pt = T[lang].p; K = clamp(w / 343, 0.85, 1.35);
  const pos = nodePos({ x: 0, y: 0, w, h }, w); curPos = pos;
  const tray = drawPanel(c, w, t);
  drawNet(c, pos, K, t, { cut: p.cut, sel: p.sel });
  // labels
  const lb = (i, txt, dy) => pill(c, txt, pos[i].x, pos[i].y + dy * K, { base: 'top' });
  lb(0, pt.names.you, 28); pill(c, pt.names.rt, pos[1].x, pos[1].y - 20 * K, { base: 'bottom' }); lb(2, pt.names.isp, 20); lb(8, pt.names.srv, 30);
  const m = { x: (pos[5].x + pos[7].x) / 2, y: (pos[5].y + pos[7].y) / 2 };
  pill(c, pt.names.sea, m.x, m.y + 8 * K, { base: 'top', color: '#9ff3f0' });
  // packets in flight
  for (const q of p.fl) {
    if (q.wait > 0) continue;
    const a = curPos[q.path[q.i]], b = curPos[q.path[Math.min(q.i + 1, q.path.length - 1)]], L = Math.hypot(b.x - a.x, b.y - a.y) || 1, u = c01(q.d / L);
    envelope(c, lerp(a.x, b.x, u), lerp(a.y, b.y, u) - 10 * K, q.k, 0.8 * K, 1);
  }
  for (const f of p.fx) {
    const u = (t - f.t) / 0.8; c.save(); c.globalAlpha = 1 - u; c.strokeStyle = '#ff4d45'; c.lineWidth = 3;
    for (let i = 0; i < 8; i++) { const an = i * 0.785, r1 = 6 + u * 22; c.beginPath(); c.moveTo(f.x + Math.cos(an) * r1 * 0.5, f.y - 10 * K + Math.sin(an) * r1 * 0.5); c.lineTo(f.x + Math.cos(an) * r1, f.y - 10 * K + Math.sin(an) * r1); c.stroke(); }
    c.restore();
  }
  // tray
  if (p.order.length) {
    const txt = p.phase === 'done' ? `${pt.ord} 1 2 3 … 12 ✓` : `${pt.arr} ${p.order.slice(-7).join(' ')}`;
    pill(c, txt, tray.x, tray.y, { align: 'l', base: 'top' });
  }
  if (p.msg && t < p.msgUntil) pill(c, pt.miss(p.msg.join(', ')), tray.x, tray.y + 28, { align: 'l', base: 'top', stroke: 'rgba(255,90,80,.7)', color: '#ffb3ad' });
  if (t < p.toastUntil) pill(c, p.toast, w / 2, h - 12, { base: 'bottom', stroke: 'rgba(255,200,90,.7)' });
}

function drawDns(c, w, h, t) {
  const D = S.dns, d = T[lang].d, k = clamp(w / 343 * 0.9, 0.8, 1.25), tn = t, asked = D.guess !== null;
  const pos = DNODES.map(([x, y]) => ({ x: 14 + x * (w - 28), y: y * h }));
  if (!asked) {
    house(c, pos[0].x, pos[0].y, k * 1.15, t); pill(c, d.nodes.you, pos[0].x, pos[0].y + 36 * k, { base: 'top' });
    pill(c, d.open, w / 2 + 20, pos[0].y - 70 * k, { base: 'bottom', stroke: 'rgba(183,148,246,.7)' });
    return;
  }
  const f = c01((tn - (D.askT || 0)) / 0.7), r = D.run;
  const activeEdge = r && r.gap <= 0 ? [DLEGS[r.leg][0], DLEGS[r.leg][1]] : null;
  [[0, 1], [1, 2], [1, 3], [1, 4]].forEach(([a, b], i) => {
    const hot = activeEdge && ((activeEdge[0] === a && activeEdge[1] === b) || (activeEdge[0] === b && activeEdge[1] === a));
    c.save(); c.globalAlpha = a === 0 ? 1 : f;
    cableLine(c, pos[a], pos[b], t, i + 20, { k, glow: hot ? '#c9a8ff' : '#6a55b0', pulses: !!hot });
    c.restore();
  });
  house(c, pos[0].x, pos[0].y, k * 1.15, t); pill(c, d.nodes.you, pos[0].x, pos[0].y + 36 * k, { base: 'top' });
  c.save(); c.globalAlpha = f;
  router(c, pos[1].x, pos[1].y, k * 1.1, t, 1, 'v'); pill(c, d.nodes.res, pos[1].x, pos[1].y + 24 * k, { base: 'top' });
  [[2, 'root', 1], [3, 'org', 2], [4, 'ns', 3]].forEach(([i, key, seed]) => { rack(c, pos[i].x, pos[i].y, k * 0.85, t, seed); pill(c, d.nodes[key], pos[i].x, pos[i].y + 30 * k, { base: 'top' }); });
  c.restore();
  // the laptop's memory
  const mw = 124, mx = 10, my = h - 66;
  const hit = D.hit > tn;
  c.save(); if (hit) { c.shadowColor = '#ffd479'; c.shadowBlur = 16 + 8 * Math.sin(t * 10); }
  rr(c, mx, my, mw, 56, 10); c.fillStyle = 'rgba(8,12,24,.85)'; c.fill(); c.strokeStyle = D.cached ? 'rgba(255,212,121,.8)' : 'rgba(140,160,210,.35)'; c.lineWidth = 1.2; c.stroke(); c.restore();
  c.font = FONT(12); c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = '#98A0B8'; c.fillText(d.mem, mx + 10, my + 12);
  c.fillStyle = D.cached ? '#ffd479' : '#646C84';
  if (D.cached) { c.fillText('www.example.org', mx + 10, my + 31); c.fillText('203.0.113.7', mx + 10, my + 46); } else c.fillText(d.empty, mx + 10, my + 36);
  // the moving message
  if (r) {
    const [a, b] = DLEGS[r.leg], u = ease(c01(r.gap > 0 ? 0 : r.u)), A = pos[a], B2 = pos[b];
    const q = r.leg % 2 === 0 ? '?' : '!', x = lerp(A.x, B2.x, u), y = lerp(A.y, B2.y, u) - Math.sin(u * Math.PI) * 10 * k - 8 * k;
    envelope(c, x, y, q === '?' ? '?' : '!', 0.85 * k, 1);
    pill(c, d.caps[r.leg], w / 2, 8, { base: 'top', stroke: 'rgba(183,148,246,.7)' });
  } else if (hit) {
    const u = c01(1 - (D.hit - tn) / 1.6);
    envelope(c, pos[0].x + 24 * k, pos[0].y - 40 * k - Math.sin(u * Math.PI) * 8, '!', 0.85 * k, 1);
    pill(c, d.cache, w / 2, 8, { base: 'top', stroke: 'rgba(255,212,121,.7)' });
  }
}

function drawSea(c, w, h, t) {
  const sd = T[lang].sea, mw = w - 20, mh = Math.min(h - 70, mw * 0.5), bx = 10, by = (h - mh) / 2 + 4;
  const P = (lo, la) => ({ x: bx + (lo + 135) / 315 * mw, y: by + (66 - la) / 116 * mh });
  c.save(); rr(c, bx, by, mw, mh, 14); c.clip();
  let g = c.createLinearGradient(0, by, 0, by + mh); g.addColorStop(0, '#0d3560'); g.addColorStop(1, '#071a36'); c.fillStyle = g; c.fillRect(bx, by, mw, mh);
  c.strokeStyle = 'rgba(130,180,240,.09)'; c.lineWidth = 1;
  for (let lo = -120; lo <= 180; lo += 30) { const a = P(lo, 66), b = P(lo, -50); c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); }
  for (let la = 60; la >= -40; la -= 20) { const a = P(-135, la), b = P(180, la); c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); }
  g = c.createLinearGradient(0, by, 0, by + mh); g.addColorStop(0, '#2d4a7e'); g.addColorStop(1, '#1b2e57');
  for (const poly of LAND) { c.beginPath(); poly.forEach(([lo, la], i) => { const p = P(lo, la); if (i) c.lineTo(p.x, p.y); else c.moveTo(p.x, p.y); }); c.closePath(); c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(150,190,245,.4)'; c.lineWidth = 1; c.stroke(); }
  // all the cables on the sea floor
  c.lineJoin = 'round'; c.lineCap = 'round';
  for (const cb of CABLES) { c.beginPath(); cb.forEach(([lo, la], i) => { const p = P(lo, la); if (i) c.lineTo(p.x, p.y); else c.moveTo(p.x, p.y); }); c.strokeStyle = 'rgba(70,215,215,.55)'; c.lineWidth = 1.6; c.stroke(); }
  // the route and the request
  const pts = ROUTE.map(([lo, la]) => P(lo, la)), lens = [0];
  for (let i = 1; i < pts.length; i++) lens.push(lens[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const total = lens[lens.length - 1], u = c01((t - S.sea.t0) / SEA_DUR), head = ease(u) * total;
  const at = (L) => { let i = 1; while (i < lens.length - 1 && lens[i] < L) i++; const s = c01((L - lens[i - 1]) / ((lens[i] - lens[i - 1]) || 1)); return { x: lerp(pts[i - 1].x, pts[i].x, s), y: lerp(pts[i - 1].y, pts[i].y, s), i }; };
  c.beginPath(); pts.forEach((p, i) => { if (i) c.lineTo(p.x, p.y); else c.moveTo(p.x, p.y); }); c.strokeStyle = 'rgba(255,205,100,.2)'; c.lineWidth = 2; c.setLineDash([3, 4]); c.stroke(); c.setLineDash([]);
  const hp = at(head);
  c.save(); c.shadowColor = '#ffc247'; c.shadowBlur = 12; c.strokeStyle = '#ffd479'; c.lineWidth = 3;
  for (let i = 1; i <= hp.i; i++) {
    const a = pts[i - 1], b = i === hp.i ? hp : pts[i]; c.setLineDash(i === 1 ? [4, 4] : []);
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
  }
  c.restore();
  c.restore();
  const bp = pts[0], sp = pts[pts.length - 1];
  [bp, sp].forEach((p, i) => {
    const gg = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, 12); gg.addColorStop(0, i ? 'rgba(61,220,151,.7)' : 'rgba(255,212,121,.8)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = gg; c.beginPath(); c.arc(p.x, p.y, 12, 0, 6.283); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(p.x, p.y, 3.2, 0, 6.283); c.fill();
  });
  if (u > 0 && u < 1) envelope(c, hp.x, hp.y - 9, '', 0.75, 1);
  if (u >= 1) { const ph = ((t - S.sea.t0 - SEA_DUR) * 0.8) % 1; c.strokeStyle = `rgba(61,220,151,${0.8 * (1 - ph)})`; c.lineWidth = 2.5; c.beginPath(); c.arc(sp.x, sp.y, Math.max(0, 6 + ph * 22), 0, 6.283); c.stroke(); }
  pill(c, sd.bud, bp.x, bp.y - 10, { base: 'bottom' });
  pill(c, sd.syd, sp.x, sp.y + 12, { base: 'top' });
  const cp = P(62, -17); pill(c, sd.cap, cp.x, cp.y, { base: 'mid', color: '#9ff3f0', stroke: 'rgba(70,215,215,.6)' });
}

function drawWeb(c, w, h, t) {
  const L = S.link, k = T[lang].lk, wb = winBottom(), gx = 14, gy = wb + 14, gw = w - 28, gh = h - gy - 30;
  if (gh < 80) return;
  const P = GP.map(([x, y]) => ({ x: gx + x * gw, y: gy + y * gh })), dom = (i) => (hostOf(PG_URL[i]) === 'www.example.org' ? '#4dd0e1' : '#ffc247');
  GEDGES.forEach(([a, b], i) => {
    c.strokeStyle = 'rgba(90,170,255,.18)'; c.lineWidth = 7; c.lineCap = 'round'; c.beginPath(); c.moveTo(P[a].x, P[a].y); c.lineTo(P[b].x, P[b].y); c.stroke();
    c.strokeStyle = '#3a76b8'; c.lineWidth = 2; c.stroke();
  });
  P.forEach((p, i) => {
    const cur = i === (L.to !== null ? L.to : L.page), kk = 1.1;
    if (cur) { const g = c.createRadialGradient(p.x, p.y, 4, p.x, p.y, 34); g.addColorStop(0, 'rgba(120,200,255,.5)'); g.addColorStop(1, 'rgba(120,200,255,0)'); c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, 34, 0, 6.283); c.fill(); }
    c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
    const g2 = c.createLinearGradient(p.x - 14, p.y - 17, p.x + 14, p.y + 17); g2.addColorStop(0, '#f6f9ff'); g2.addColorStop(1, '#c3cfec');
    rr(c, p.x - 14 * kk, p.y - 17 * kk, 28 * kk, 34 * kk, 4); c.fillStyle = g2; c.fill(); c.restore();
    c.fillStyle = dom(i); rr(c, p.x - 14 * kk, p.y - 17 * kk, 28 * kk, 8, 4); c.fill();
    c.fillStyle = 'rgba(70,85,130,.55)'; for (let j = 0; j < 3; j++) c.fillRect(p.x - 9 * kk, p.y - 4 * kk + j * 6 * kk, (j === 2 ? 11 : 18) * kk, 2.4);
    c.strokeStyle = cur ? '#fff' : 'rgba(20,30,60,.7)'; c.lineWidth = cur ? 2 : 1.2; rr(c, p.x - 14 * kk, p.y - 17 * kk, 28 * kk, 34 * kk, 4); c.stroke();
    pill(c, k.nm[i], p.x, p.y + 22, { base: 'top' });
  });
  if (L.to !== null) {
    const u = ease(c01((t - L.t0) / 0.8)), A = P[L.prev], B = P[L.to];
    envelope(c, lerp(A.x, B.x, u), lerp(A.y, B.y, u) - 6, '', 0.8, 1);
  }
}

function drawUrl(c, w, h, t) {
  const wb = winBottom(), B = { x: 0, y: wb + 6, w, h: Math.max(80, h - wb - 20) }, k = clamp(Math.min(w / 343, B.h / 240), 0.55, 1.1);
  const pos = nodePos(B, w);
  if (B.h < 90) return;
  drawNet(c, pos, k, t, {});
  const U = S.url;
  if (U.picked !== null && U.fly) {
    const path = [0, 1, 2, 3, 6, 8], u = c01((t - U.fly) / 3.6);
    if (u < 1) {
      const f = u * (path.length - 1), i = Math.min(path.length - 2, Math.floor(f)), s = ease(f - i), a = pos[path[i]], b = pos[path[i + 1]];
      envelope(c, lerp(a.x, b.x, s), lerp(a.y, b.y, s) - 8 * k, '', 0.7, 1);
    }
  }
}

canvasLoop($('cv'), (c, w, h, dt, t) => {
  CW = w; CH = h; const m = modeNow(), tt = now();
  night(c, w, h, t);
  if (m === 'url') drawUrl(c, w, h, t);
  else if (m === 'dns') { updateDns(dt); dnsUI(T[lang]); drawDns(c, w, h, t); }
  else if (m === 'packets') { drawPackets(c, w, h, t); updatePk(dt, tt); pkUI(T[lang]); }
  else if (m === 'sea') drawSea(c, w, h, t);
  else if (m === 'link') { updateLink(dt, tt); drawWeb(c, w, h, t); }
});
render();
</script>
