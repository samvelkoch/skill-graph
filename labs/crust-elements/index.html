// --- loop ----------------------------------------------------------------------------------------------------
function frame(c, w, h, dt, time) {
  HITS = [];
  S.z += (S.zt - S.z) * (1 - Math.exp(-dt * 5)); if (Math.abs(S.zt - S.z) < 0.002) S.z = S.zt;
  if (S.g1 && S.f1 < 1) S.f1 = Math.min(1, S.f1 + dt / 1.8);
  if (S.g2 && S.f2 < 1) S.f2 = Math.min(1, S.f2 + dt / 1.8);
  S.digA += (S.dug - S.digA) * (1 - Math.exp(-dt * 6)); if (Math.abs(S.dug - S.digA) < 0.02) S.digA = S.dug;
  if (S.kola && S.kolaT < 1) S.kolaT = Math.min(1, S.kolaT + dt / 3);
  if (S.gold && S.goldT < 1) S.goldT = Math.min(1, S.goldT + dt / 0.9);
  if (S.alOn) {
    S.alT = Math.min(1, S.alT + dt / (S.alMode === 'new' ? 7 : 3.5));
    if (S.alT >= 1) { S.alOn = false; S.alRan[S.alMode] = true; render(); }
    else if (Math.floor(S.alT * 50) !== S.alLast) { S.alLast = Math.floor(S.alT * 50); if (lab.view === 'ores') update(true); }
  }
  const v = lab.view;
  if (v === 'crust') drawCrust(c, w, h, time); else if (v === 'spheres') drawSpheres(c, w, h, time); else drawOres(c, w, h, time, dt);
}

function secretChip(k, emo, name) {
  const open = secret.unlocked(), on = S[k];
  return `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(name)}` : esc(T[lang].lock)}</button>`;
}
function renderCtrl() {
  const t = T[lang], v = lab.view; let h = '';
  if (v === 'crust') {
    if (S.kola) h = `<div class="row2 ce-chips" style="margin-top:0">${secretChip('kola', '🕳️', t.kola.chip)}</div>`;
    else if (!S.g1) h = qBlock(t.cr.q, t.cr.opts, 'g1') + `<div class="row2 ce-chips">${secretChip('kola', '🕳️', t.kola.chip)}</div>`;
    else {
      h = `<div class="row2 ce-chips" style="margin-top:0"><span class="ce-lbl">${esc(t.zlbl)}</span><div class="chips">${['⛰️', '🪨', '🔎', '⚛️'].map((e, i) => chip(`data-z="${i}"`, `${e} ${esc(t.zn[i])}`, S.zt === i)).join('')}</div></div>
        <div class="row2 ce-chips"><span class="ce-lbl">${esc(t.mlbl)}</span><div class="chips">${['quartz', 'feldspar'].map((m) => chip(`data-min="${m}"`, esc(t.mn[m]), S.min === m)).join('')}</div></div>
        ${elChips(CRUST_ELEMS, t)}
        <div class="row2 ce-chips">${secretChip('kola', '🕳️', t.kola.chip)}</div>`;
    }
  } else if (v === 'spheres') {
    if (!S.g1) h = `<p class="ce-note">${esc(t.sp.gate)}</p><button class="btn" data-go="crust">${esc(t.sp.go)}</button>`;
    else if (!S.g2) h = qBlock(t.sp.q, t.sp.opts, 'g2');
    else h = elChips(SPH_ELEMS, t);
  } else {
    const sub = `<div class="row2 ce-chips" style="margin-top:0"><div class="chips">${chip('data-ore="cu"', esc(t.ore.cu), S.ore === 'cu' && !S.gold)}${chip('data-ore="al"', esc(t.ore.al), S.ore === 'al' && !S.gold)}${secretChip('gold', '🥇', t.ore.goldChip)}</div></div>`;
    if (S.gold) h = sub;
    else if (S.ore === 'cu') {
      if (!S.g3) h = sub + `<div class="row2" style="display:block">${qBlock(t.ore.q, t.ore.opts, 'g3')}</div>`;
      else h = sub + `<div class="row2" style="display:block"><div class="ce-lbl">${esc(t.ore.grade)}: <b id="gradeV">${pc(S.grade, 1)}</b></div><input class="ce-rng" id="grade" type="range" min="4" max="10" step="1" value="${Math.round(S.grade * 10)}" aria-label="${esc(t.ore.grade)}"></div>
        <div class="row2 ce-chips"><button class="btn" data-act="dig">${esc(t.ore.dig)}</button>${chip('data-act="all"', esc(t.ore.all))}${chip('data-act="reset"', esc(t.ore.reset))}</div>`;
    } else {
      const done = S.alT >= 1;
      h = sub + `<div class="row2 ce-chips"><div class="chips">${chip('data-mode="new"', esc(t.ore.mNew), S.alMode === 'new')}${chip('data-mode="rec"', esc(t.ore.mRec), S.alMode === 'rec')}</div></div>
        <div class="row2 ce-chips"><button class="btn" data-act="power">${esc(S.alOn ? t.ore.off : done ? t.ore.again : t.ore.on)}</button></div>`;
    }
  }
  $('ctrlBody').innerHTML = h;
}
function render() { renderCtrl(); update(); }
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

// --- shell, secrets, canvas -----------------------------------------------------------------------------------
const lab = shell({ key: 'crust-elements', T, topics: TOPICS, views: ['crust', 'spheres', 'ores'], onLang: render, onView: () => { S.sel = null; render(); } });
const secret = secretLab('crust-elements', () => ({
  secrets: [{ emo: '🕳️', title: T[lang].kola.chip, desc: T[lang].kola.desc }, { emo: '🥇', title: T[lang].ore.goldChip, desc: T[lang].ore.goldDesc }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.pick) {
    const [k, val] = d.pick.split(':'); if (S[k]) return;
    S[k] = val; (val === RIGHT[k] ? sfx.good : sfx.bad)(); S.sel = null;
    if (k === 'g1') { S.f1 = 0; S.zt = 0; S.z = 0; }
    if (k === 'g2') S.f2 = 0;
    render(); showStage(); return;
  }
  if (d.z !== undefined) { S.zt = +d.z; sfx.click(); }
  else if (d.min) { S.min = d.min; sfx.tick(); }
  else if (d.el) { S.sel = S.sel === d.el ? null : d.el; sfx.tick(); }
  else if (d.go) { $('views').querySelector(`[data-view="${d.go}"]`)?.click(); return; }
  else if (d.ore) { S.ore = d.ore; S.gold = false; sfx.click(); }
  else if (d.mode) { S.alMode = d.mode; S.alOn = false; S.alT = 0; sfx.click(); }
  else if (d.sec) {
    if (!secret.unlocked()) return secret.open();
    S[d.sec] = !S[d.sec]; if (d.sec === 'kola') S.kolaT = 0; else S.goldT = 0; sfx.click();
  } else if (d.act === 'dig') { S.dug = Math.min(CU_MAX, S.dug + 25); sfx.push(); }
  else if (d.act === 'all') { S.dug = Math.min(CU_MAX, Math.ceil(100 / S.grade)); sfx.snap(); }
  else if (d.act === 'reset') { S.dug = 0; S.digA = 0; sfx.tick(); }
  else if (d.act === 'power') { if (S.alT >= 1) S.alT = 0; S.alOn = !S.alOn; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'grade') return;
  S.grade = clamp(+ev.target.value, 4, 10) / 10; const gv = $('gradeV'); if (gv) gv.textContent = pc(S.grade, 1);
  update();
});
$('cv').addEventListener('click', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, v = lab.view;
  if (v === 'crust' && !S.kola && S.g1) {
    let best = null, bd = 1e9;
    for (const a of ATOMS) { const dd = Math.hypot(x - a.x, y - a.y); if (dd < a.r + 5 && dd < bd) { bd = dd; best = a; } }
    if (best) { S.sel = S.sel === best.sym ? null : best.sym; sfx.tick(); render(); return; }
    const P = LAY.panel;
    if (x > P.x + P.w) { const L = layerAt(x, y); if (L && L.sym !== 'rest') { S.sel = S.sel === L.sym ? null : L.sym; sfx.tick(); render(); } return; }
    S.zt = (Math.round(S.zt) + 1) % 4; sfx.click(); render();
  } else if (v === 'spheres' && S.g1 && S.g2) {
    const L = layerAt(x, y); if (L && L.sym !== 'rest') { S.sel = S.sel === L.sym ? null : L.sym; sfx.tick(); render(); }
  }
});
canvasLoop($('cv'), frame);
render();
</script>
</body>
</html>
