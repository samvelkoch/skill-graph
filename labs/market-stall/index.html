  if (S.done) showStage();
}
function finishRound() { // a secret that needs a finished queue sets it up: the rest of the customers get what they asked for
  for (let i = S.qi; i < 6; i++) { S.choices[i] = GOOD_FOR[needOf(i)]; CU[i].ok = true; CU[i].rt = nowS() - 9; }
  S.qi = 6; S.done = true;
}
function assignJob(j) {
  if (S.pick === null) return false;
  const f = S.pick, old = S.assign.indexOf(f), displaced = S.assign[j];
  S.assign[j] = f; if (old >= 0 && old !== j) S.assign[old] = displaced;
  S.pick = null; S.run3 = -1; S.res3 = null; S.v3 = false;
  return true;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'p1') { S.p1 = b.dataset.v; sfx.click(); }
  else if (act === 'offer') offer(b.dataset.g);
  else if (act === 'again') { S.round++; S.sec = null; resetRound(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'word') { if (!S.done) finishRound(); S.wordAt = nowS(); } else S.chCount = 0; }
    sfx.click();
  } else if (act === 'chplus') { const m = EX[S.chEx].paid - PRICE[EX[S.chEx].g]; if (S.chCount < m) { S.chCount++; (S.chCount === m ? sfx.good : sfx.tick)(); } }
  else if (act === 'chnext') { S.chEx = (S.chEx + 1) % EX.length; S.chCount = 0; sfx.click(); }
  else if (act === 'sg') { S.sign[b.dataset.k] = i; S.a2 = nowS(); sfx.click(); }
  else if (act === 'wk') { S.week = i; S.a2 = nowS(); sfx.click(); }
  else if (act === 'p3') { S.p3 = b.dataset.v; S.assign = [...MIX]; S.res3 = sim3(S.assign); S.run3 = nowS(); S.v3 = true; sfx.click(); showStage(); }
  else if (act === 'pickf') { S.pick = S.pick === i ? null : i; sfx.tick(); }
  else if (act === 'job') { if (assignJob(i)) sfx.snap(); else sfx.bad(); }
  else if (act === 'run3') { S.res3 = sim3(S.assign); S.run3 = nowS(); S.v3 = false; (S.res3.every((f) => !f) ? sfx.good : sfx.click)(); showStage(); }
  render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('s1').hidden = v !== 'listen'; $('s2').hidden = v !== 'show'; $('s3').hidden = v !== 'team';
  if (v === 'listen') renderListen(t); else if (v === 'show') renderShow(t); else renderTeam(t);
}

function renderListen(t) {
  const L = t.ls, p = S.p1, open = secret.unlocked(), q = QUEUES[S.round % 2];
  lab.setGlow('rgba(224, 121, 79, .24)');
  $('p1box').hidden = p !== null;
  $('p1q').textContent = L.pq;
  $('p1opts').innerHTML = ['top', 'listen'].map((k) => `<button class="ms-opt" data-act="p1" data-v="${k}">${esc(L.po[k])}</button>`).join('');
  const playing = p !== null && !S.done && !S.sec;
  $('goodsBox').hidden = !playing;
  $('goods').innerHTML = GOODS.map((g) => `<button class="ms-g" data-act="offer" data-g="${g.id}"><span class="e">${g.emo}</span><span>${esc(t.g[g.id])}<small>${esc(cn(g.price))}</small></span></button>`).join('');
  $('againB').hidden = !(p !== null && S.done); $('againB').textContent = L.again;
  $('r1').hidden = p === null;
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('word', '🗣️') + sc('change', '🪙');
  const ex = EX[S.chEx], price = PRICE[ex.g], m = ex.paid - price;
  $('chBox').hidden = S.sec !== 'change';
  $('chPlus').textContent = t.ch.step; $('chPlus').disabled = S.chCount >= m; $('chNext').textContent = t.ch.next;
  $('chLink').textContent = t.ch.link; $('chLink').href = `../making-change/?lang=${lang}`;
  const facts = [{ emo: '🏰', text: t.f.dom, src: SRC.dom }];
  if (p !== null) facts.push({ emo: '🤝', text: t.f.cs, src: SRC.cs });
  lab.setFacts(facts);
  if (p === null) {
    lab.setReadout('?', L.subQ, '', '#e0794f');
    lab.setState({ emo: '🧺', title: L.readyT, lead: L.readyL, body: '', extra: '' }); return;
  }
  const { happy, coins } = tally();
  lab.setReadout(happy, L.sub(S.qi), cn(coins), '#e0794f');
  if (S.sec === 'word') {
    const n = happy * 2;
    lab.setState(happy > 0 ? { emo: '🗣️', title: t.wd.title(n), lead: t.wd.lead(happy), body: '', extra: '' } : { emo: '🗣️', title: t.wd.none, lead: t.wd.noneL, body: '', extra: '' });
  } else if (S.sec === 'change') {
    const done = S.chCount >= m;
    lab.setReadout(price + S.chCount, t.ch.q(t.g[ex.g], cn(price), cn(ex.paid)), '', '#f5c84c');
    lab.setState(done ? { emo: '🪙', title: t.ch.done(cn(m)), lead: t.ch.doneL(price, ex.paid), body: '', extra: '' }
      : { emo: '🪙', title: t.ch.title(t.g[ex.g], cn(price), cn(ex.paid)), lead: t.ch.lead, body: '', extra: '' });
  } else if (!S.done) {
    const need = q[S.qi][0], last = S.last;
    lab.setState({ emo: '💬', title: `“${t.n[need][1]}”`, lead: L.q, body: last ? (last.ok ? L.thanks(cn(last.price)) : L.no) : '', extra: '' });
  } else {
    const top = topOutcome(), fit = fitOutcome(), truth = fit.happy > top.happy ? 'listen' : 'top', right = p === truth;
    lab.setState({ emo: right ? '✅' : '🤔', title: right ? L.right : L.wrong, lead: L.res(fit.happy, top.happy),
      body: `${L.mine(happy, cn(coins))} ${L.cmp(t.g[TOP], top.happy, cn(top.coins), fit.happy, cn(fit.coins))}`, extra: '' });
  }
}

function renderShow(t) {
  const L = t.sh, g = S.sign, n = score2(g), r = returns2(g);
  lab.setGlow('rgba(245, 200, 76, .22)');
  const row = (lbl, key, opts) => `<div class="row2"><span class="lbl">${esc(lbl)}</span><div class="chips">${opts.map((o, i) => `<button class="chip ${g[key] === i ? 'on' : ''}" data-act="sg" data-k="${key}" data-i="${i}">${esc(o)}</button>`).join('')}</div></div>`;
  $('s2').innerHTML = `<p class="ms-goal">${esc(L.goal)}</p>${row(L.rows.name, 'name', L.names)}${row(L.rows.price, 'price', L.price)}${row(L.rows.pic, 'pic', L.pic)}${row(L.rows.words, 'words', L.words)}
    <div class="row2"><span class="lbl">${esc(L.rows.week)}</span><div class="card seg small">${L.wk.map((o, i) => `<button class="${S.week === i + 1 ? 'on' : ''}" data-act="wk" data-i="${i + 1}">${esc(o)}</button>`).join('')}</div></div>`;
  const facts = [{ emo: '🧺', text: t.f.stall, src: SRC.stall }];
  if (S.week === 2) facts.push({ emo: '🤝', text: t.f.cs, src: SRC.cs });
  lab.setFacts(facts);
  lab.setReadout(`${S.week === 1 ? n : r} / 10`, S.week === 1 ? L.sub1 : L.sub2, L.model, '#f5c84c');
  let st;
  if (S.week === 1) {
    if (n >= 10) st = { emo: '🎉', title: L.full, lead: L.fullL };
    else {
      const miss = !g.price ? 'price' : !g.pic ? 'pic' : !g.words ? 'words' : g.name === 0 ? 'name' : null;
      st = { emo: '🪧', title: L.t1(n), lead: miss ? L.hint[miss] : L.noneL };
    }
  } else if (n === 0) st = { emo: '🪧', title: L.w2none, lead: L.w2noneL };
  else if (g.words === 1) st = { emo: '🤔', title: L.w2boast, lead: L.w2boastL(n, r) };
  else st = { emo: '❤️', title: L.w2ok, lead: L.w2okL(n) };
  lab.setState({ ...st, body: '', extra: `<div>${esc(L.fine)}</div>` });
}

function renderTeam(t) {
  const L = t.tm, p = S.p3, a = S.assign, res = S.res3;
  lab.setGlow('rgba(143, 127, 208, .24)');
  $('p3box').hidden = p !== null; $('p3body').hidden = p === null;
  $('p3q').textContent = L.pq;
  $('p3opts').innerHTML = ['better', 'same', 'worse'].map((k) => `<button class="ms-opt" data-act="p3" data-v="${k}">${esc(L.po[k])}</button>`).join('');
  $('p3body').innerHTML = `<div class="ms-stack">${FRIENDS.map((f, i) => `<button class="chip ms-friend ${S.pick === i ? 'on' : ''}" data-act="pickf" data-i="${i}">${f.emo} ${esc(L.friends[i][0])} <small>· ${esc(L.friends[i][1])}</small></button>`).join('')}</div>
    <div class="row2">${a.map((f, j) => `<button class="chip" data-act="job" data-i="${j}">${JOB_EMO[j]} ${esc(L.jobs[j])} · ${esc(L.friends[f][0])}</button>`).join('')}</div>
    <div class="row2"><button class="btn" data-act="run3">${esc(L.run)}</button></div>`;
  lab.setFacts(p === null ? [] : [{ emo: '📌', text: t.f.pin, src: SRC.pin }]);
  if (p === null) {
    lab.setReadout('?', L.sub, L.model, '#8f7fd0');
    lab.setState({ emo: '🤝', title: L.readyT, lead: L.readyL, body: '', extra: '' }); return;
  }
  if (!res) {
    lab.setReadout('?', L.sub, L.model, '#8f7fd0');
    lab.setState({ emo: '🤝', title: L.tapT, lead: L.tapL, body: '', extra: '' }); return;
  }
  const happy = res.filter((f) => !f).length, cnt = {};
  res.forEach((f) => { if (f) cnt[f] = (cnt[f] || 0) + 1; });
  const line = Object.keys(L.flags).filter((k) => cnt[k]).map((k) => `${L.flags[k]}: ${cnt[k]}`).join(' · ');
  lab.setReadout(`${happy} / 10`, L.sub, L.model, '#8f7fd0');
  if (S.v3) {
    const mixHappy = sim3(MIX).filter((f) => !f).length, truth = mixHappy < 10 ? 'worse' : 'same', right = p === truth;
    lab.setState({ emo: right ? '✅' : '🤔', title: right ? L.right : L.wrong, lead: L.cmp(happy, 10), body: line ? `${L.notHappy} — ${line}` : '', extra: `<div>${esc(L.fine)}</div>` });
  } else if (happy === 10) lab.setState({ emo: '🎉', title: L.fit, lead: L.fitL, body: '', extra: `<div>${esc(L.fine)}</div>` });
  else lab.setState({ emo: '🤝', title: L.some(happy), lead: L.someL, body: line ? `${L.notHappy} — ${line}` : '', extra: `<div>${esc(L.fine)}</div>` });
}
render();
</script>
