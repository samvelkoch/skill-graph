const POLY_STEP = 0.5;

  k.t += dt;
  const Rr = Math.min(w * 0.36, h * 0.34), c = [w / 2, h * 0.5], a0 = -PI / 2 - PI / n;
  const V = Array.from({ length: n }, (_, j) => [c[0] + Rr * Math.cos(a0 + j * step), c[1] + Rr * Math.sin(a0 + j * step)]);
  const done = k.t >= n * per, j = done ? n : Math.floor(k.t / per), lt = k.t - j * per;
  let pos, turned, walked; // walked: how many edges are complete (and a fraction)
  if (done) { pos = V[0]; turned = TAU; walked = n; }
  else if (lt < LT) { const u = lt / LT, A = V[j], B = V[(j + 1) % n]; pos = [lerp(A[0], B[0], u), lerp(A[1], B[1], u)]; turned = j * step; walked = j + u; }
  else { pos = V[(j + 1) % n]; turned = j * step + step * ease((lt - LT) / TT); walked = j + 1; }
  const deg = Math.round(turned * 180 / PI);
  if (deg !== k.shown) { k.shown = deg; if (S.sec === 'walk' && lab.view === 'tear') lab.setReadout('↻', t.sec.turned(deg), '', '#3ddc97'); }

  ctx.save(); ctx.globalAlpha = 1; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(237, 239, 247, .22)'; ctx.lineWidth = 3; ctx.beginPath(); V.forEach((p, q) => (q ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); ctx.stroke();
  ctx.strokeStyle = '#3ddc97'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(V[0][0], V[0][1]);
  for (let q = 0; q < Math.min(n, Math.ceil(walked)); q++) {
    const A = V[q], B = V[(q + 1) % n], u = Math.min(1, walked - q);
    ctx.lineTo(lerp(A[0], B[0], u), lerp(A[1], B[1], u));
  }
  ctx.stroke(); ctx.restore();

  // every turn: the extended edge, the arc, its size, and a slice of the dial in the middle
  const Rd = Rr * 0.27;
  ctx.save(); ctx.globalAlpha = 1; ctx.strokeStyle = 'rgba(237, 239, 247, .3)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(c[0], c[1], Rd, 0, TAU); ctx.stroke(); ctx.restore();
  for (let m = 0; m < n && m * step < turned - 1e-6; m++) {
    const amt = Math.min(step, turned - m * step), V1 = V[(m + 1) % n], col = COL[m % 6], hd = m * step;
    ctx.save(); ctx.globalAlpha = 1; ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.setLineDash([4, 5]); ctx.beginPath(); ctx.moveTo(V1[0], V1[1]); ctx.lineTo(V1[0] + Math.cos(hd) * Rr * 0.26, V1[1] + Math.sin(hd) * Rr * 0.26); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(V1[0], V1[1], Rr * 0.17, hd, hd + amt, false); ctx.stroke();
    ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.moveTo(c[0], c[1]); ctx.arc(c[0], c[1], Rd, -PI / 2 + m * step, -PI / 2 + m * step + amt, false); ctx.closePath(); ctx.fill();
    ctx.restore();
    if (amt > step * 0.6) label(ctx, `${Math.round(step * 180 / PI)}°`, V1[0] + Math.cos(hd + amt / 2) * Rr * 0.34, V1[1] + Math.sin(hd + amt / 2) * Rr * 0.34, 13, col);
  }
  if (done) label(ctx, '360°', c[0], c[1], 17, '#fff');
  // the turtle (the emoji looks left: mirror it when it walks right)
  ctx.save(); ctx.globalAlpha = 1; ctx.translate(pos[0], pos[1]);
  if (Math.cos(turned) >= 0) { ctx.rotate(turned); ctx.scale(-1, 1); } else ctx.rotate(turned + PI);
  ctx.font = '30px "Apple Color Emoji", "Segoe UI Emoji", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText('🐢', 0, 0);
  ctx.restore();
}

// --- secret 2: a triangle on a globe -------------------------------------------------------------------------
function drawGlobe(ctx, w, h, dt) {
  const g = S.gl; g.t += dt;
  const D = PI / 180, R0 = Math.min(w * 0.38, h * 0.34), cx = w / 2, cy = h * 0.46, sT = Math.sin(28 * D), cT = Math.cos(28 * D);
  const P = (lat, lon) => {
    const f = lat * D, dl = (lon - 45) * D, x = Math.cos(f) * Math.sin(dl), y = Math.sin(f), z = Math.cos(f) * Math.cos(dl);
    return [cx + R0 * x, cy - R0 * (y * cT - z * sT), y * sT + z * cT];
  };
  const trace = (pts) => { let pen = false; for (const [x, y, z] of pts) { if (z < 0) { pen = false; continue; } if (!pen) { ctx.moveTo(x, y); pen = true; } else ctx.lineTo(x, y); } };
  ctx.save(); ctx.globalAlpha = 1;
  const gr = ctx.createRadialGradient(cx - R0 * 0.35, cy - R0 * 0.4, R0 * 0.1, cx, cy, R0);
  gr.addColorStop(0, '#3a73c4'); gr.addColorStop(1, '#0d2147');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, R0, 0, TAU); ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(200, 220, 255, .22)'; ctx.beginPath();
  for (let lon = 0; lon < 360; lon += 30) trace(Array.from({ length: 37 }, (_, q) => P(-90 + q * 5, lon)));
  for (const lat of [-60, -30, 30, 60]) trace(Array.from({ length: 73 }, (_, q) => P(lat, q * 5)));
  ctx.stroke();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(220, 235, 255, .5)'; ctx.beginPath(); trace(Array.from({ length: 73 }, (_, q) => P(0, q * 5))); ctx.stroke();
  ctx.strokeStyle = 'rgba(200, 220, 255, .6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, R0, 0, TAU); ctx.stroke();

  // North Pole -> equator at longitude 0 -> a quarter of the way along the equator -> back up to the pole
  const tri = [];
  for (let q = 0; q <= 30; q++) tri.push(P(90 - q * 3, 0));
  for (let q = 1; q <= 30; q++) tri.push(P(0, q * 3));
  for (let q = 1; q <= 30; q++) tri.push(P(q * 3, 90));
  const p = ease(g.t / 3), cnt = Math.floor(p * tri.length);
  if (p >= 1) { ctx.fillStyle = `rgba(245, 200, 76, ${clamp((g.t - 3) / 0.6, 0, 1) * 0.4})`; ctx.beginPath(); trace(tri); ctx.fill(); }
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); trace(tri.slice(0, cnt)); ctx.stroke();
  const vs = [P(90, 0), P(0, 0), P(0, 90)], mx = (vs[0][0] + vs[1][0] + vs[2][0]) / 3, my = (vs[0][1] + vs[1][1] + vs[2][1]) / 3;
  vs.forEach((v) => { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(v[0], v[1], 5, 0, TAU); ctx.fill(); });
  ctx.restore();
  const la = clamp((g.t - 3.2) / 0.6, 0, 1);
  if (la > 0) vs.forEach((v) => label(ctx, '90°', lerp(v[0], mx, 0.4), lerp(v[1], my, 0.4), 16, `rgba(255, 255, 255, ${la})`));
  const sa = clamp((g.t - 3.8) / 0.6, 0, 1);
  if (sa > 0) label(ctx, '90° + 90° + 90° = 270°', w / 2, h - 26, 18, `rgba(255, 255, 255, ${sa})`);
}

// --- the canvas loop -----------------------------------------------------------------------------------------
const loop = canvasLoop($('cv'), (ctx, w, h, dt) => {
  if (lab.view === 'tear') {
    if (S.sec === 'walk') return drawWalk(ctx, w, h, dt);
    if (S.sec === 'globe') return drawGlobe(ctx, w, h, dt);
    return drawTear(ctx, w, h);
  }
  if (lab.view === 'line') return drawLine(ctx, w, h);
  return drawPoly(ctx, w, h);
});

// --- dragging the corners in free mode -----------------------------------------------------------------------
const cv = $('cv');
let drag = -1;
const freeActive = () => lab.view === 'tear' && !S.sec && R.tear.i >= ROUNDS.tear.length && !S.free.tearing;
const local = (ev) => { const b = cv.getBoundingClientRect(); return [ev.clientX - b.left, ev.clientY - b.top]; };
cv.addEventListener('pointerdown', (ev) => {
  if (!freeActive() || !S.map) return;
  const [x, y] = local(ev), m = S.map;
  let best = -1, bd = 40 * 40;
  S.free.pts.forEach((p, i) => { const d = (m.ox + p[0] * m.s - x) ** 2 + (m.oy + p[1] * m.s - y) ** 2; if (d < bd) { bd = d; best = i; } });
  if (best < 0) return;
  drag = best; cv.setPointerCapture(ev.pointerId); ev.preventDefault();
});
cv.addEventListener('pointermove', (ev) => {
  if (drag < 0 || !S.map) return;
  const [x, y] = local(ev), m = S.map, pts = S.free.pts.map((p) => [...p]);
  pts[drag] = [clamp((x - m.ox) / m.s, 14, 386), clamp((y - m.oy) / m.s, 14, 246)];
  const a = anglesOf(pts);
  if (Math.min(...a) < 8 || pts.some((p, i) => Math.hypot(p[0] - pts[(i + 1) % 3][0], p[1] - pts[(i + 1) % 3][1]) < 40)) return; // keep it a real triangle
  S.free.pts = pts; freeReadout(); sfx.tick();
});
const endDrag = () => { drag = -1; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls ------------------------------------------------------------------------------------------------
function answer(val) {
  const v = lab.view, r = R[v], rd = ROUNDS[v][r.i];
  if (r.rev) return;
  if (rd.kind === 'choice') r.sel = val; else r.num = val;
  const ok = val === rd.ok;
  Object.assign(r, { rev: true, fin: false, t0: now(), snd: [] }); r.right[r.i] = ok;
  (ok ? sfx.good : sfx.bad)(); showStage(); render();
}
function mainBtn() {
  const v = lab.view, r = R[v], rd = ROUNDS[v][r.i];
  if (!rd) { R[v] = mk(); sfx.click(); return render(); }
  if (!r.rev) { if (rd.kind === 'num' && r.num !== null) answer(r.num); return; }
  Object.assign(r, { i: r.i + 1, sel: null, num: null, rev: false, fin: false, snd: [] }); sfx.click(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const v = lab.view, r = R[v], b = ev.target.closest('button'); if (!b) return;
  if (b.classList.contains('ans')) return answer(+b.dataset.j);
  if (b.dataset.d) { if (r.rev) return; r.num = clamp((r.num ?? 0) + +b.dataset.d, 0, 999); sfx.tick(); return render(); }
  const act = b.dataset.act;
  if (act === 'main') return mainBtn();
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null; else { S.sec = k; if (k === 'walk') Object.assign(S.wk, { n: 3, t: 0, shown: -1 }); else S.gl.t = 0; }
    sfx.click();
  } else if (act === 'shape') { Object.assign(S.wk, { n: +b.dataset.n, t: 0, shown: -1 }); sfx.click(); }
  else if (act === 'ftear') {
    S.free.tearing = !S.free.tearing; S.free.t0 = now(); S.free.snd = []; sfx.click();
    if (S.free.tearing) showStage();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'ni') return;
  R[lab.view].num = ev.target.value === '' ? null : clamp(Math.round(+ev.target.value), 0, 999); render();
});
$('ctrlBody').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.id === 'ni') { ev.preventDefault(); mainBtn(); } });

// --- one render per change: controls, readout and the state card ---------------------------------------------
function verdictOf(v, r, t) {
  const ok = r.right[r.i], i = r.i;
  if (v === 'tear') {
    if (i === 0) return [ok ? t.right : t.wrong, [t.t.r1], ok];
    if (i === 1) return ok ? [t.t.r2, [], true] : [t.wrong, [t.t.r2], false];
    return [ok ? t.right : t.notq, [t.t.r3], ok];
  }
  if (v === 'poly') return [ok ? t.right : i === 0 ? t.wrong : t.notq, [[t.p.r1, t.p.r2, t.p.r3][i], t.p.rule], ok];
  const rd = ROUNDS.line[i], a = r.num, why = t.l.why[i];
  if (ok) return [t.right, [why], true];
  let msg = null;
  if (rd.type === 'line' && a === 360) msg = t.l.used360;
  else if (rd.type === 'point' && a === 180) msg = t.l.used180;
  else if (rd.type === 'line' && a === 90) msg = t.l.half;
  else if (i === 4 && a === 180 - rd.parts[rd.given]) msg = t.l.opp;
  return [t.notq, msg ? [msg, why] : [why], false];
}
function freeReadout() { lab.setReadout(`<span class="sumline">${esc(T[lang].t.sum(...degrees(S.free.pts)))}</span>`, '', '', ACCENT.tear); }

function render() {
  const t = T[lang], v = lab.view, r = R[v], rounds = ROUNDS[v], N = rounds.length, end = r.i >= N, rd = rounds[r.i];
  const sec = v === 'tear' ? S.sec : null, free = v === 'tear' && end && !sec, asking = !sec && !end;
  const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
  document.body.dataset.v = v;
  lab.setGlow(GLOW[v]);
  cv.style.touchAction = freeActive() ? 'none' : 'auto'; cv.style.cursor = freeActive() ? 'grab' : '';

  show('qtext', asking || free); $('qtext').textContent = free ? t.t.free : asking ? rd.q(t) : '';
  show('choices', asking && rd.kind === 'choice');
  if (asking && rd.kind === 'choice') {
    $('choices').innerHTML = rd.opts(t).map((o, j) => `<button class="ans ${r.fin ? (j === rd.ok ? 'good' : j === r.sel ? 'bad' : '') : r.rev && j === r.sel ? 'chosen' : ''}" data-j="${j}"${r.rev ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  }
  show('numRow', asking && rd.kind === 'num');
  if (asking && rd.kind === 'num') {
    const ni = $('ni'), nv = r.num === null ? '' : String(r.num);
    if (ni.value !== nv) ni.value = nv;
    ni.disabled = r.rev; ni.setAttribute('aria-label', rd.q(t));
    document.querySelectorAll('#numRow .sb').forEach((b) => { b.disabled = r.rev; });
  }
  show('verdict', asking && r.fin);
  if (asking && r.fin) {
    const [title, paras, ok] = verdictOf(v, r, t);
    $('verdict').innerHTML = `<div class="v" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(title)}</div>${paras.map((p, k) => `<p class="${v === 'poly' && k === paras.length - 1 ? 'rule' : ''}">${esc(p)}</p>`).join('')}`;
  }
  // the one main button of the lab: Check, Next or Again
  const needMain = (asking && (rd.kind === 'num' || r.rev)) || (end && v !== 'tear');
  show('mainB', needMain);
  if (needMain) {
    $('mainB').textContent = end ? t.again : r.rev ? t.next : t.check;
    $('mainB').disabled = asking && !r.rev && r.num === null;
  }
  show('secPanel', sec === 'walk');
  if (sec === 'walk') $('secPanel').innerHTML = [['3', 'tri'], ['4', 'sq'], ['5', 'pent']].map(([n, k]) => `<button class="chip ${S.wk.n === +n ? 'on' : ''}" data-act="shape" data-n="${n}">${esc(t.sec.shapes[k])}</button>`).join('');
  show('chipsRow', v === 'tear');
  if (v === 'tear') {
    const open = secret.unlocked();
    const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    const ft = free ? `<button class="chip ${S.free.tearing ? 'on' : ''}" data-act="ftear">${S.free.tearing ? `↺ ${esc(t.again)}` : `✂️ ${esc(t.t.tear)}`}</button>` : '';
    $('chipsRow').innerHTML = ft + sc('walk', '🐢') + sc('globe', '🌍');
  }

  // readout
  const dots = rounds.map((_, i) => (i < r.i ? '●' : i === r.i ? '◉' : '○')).join(' ');
  if (sec === 'walk') lab.setReadout('↻', t.sec.turned(Math.max(0, S.wk.shown)), '', '#3ddc97');
  else if (sec === 'globe') lab.setReadout('270°', '90° + 90° + 90°', '', '#ffd166');
  else if (free) freeReadout();
  else if (end) lab.setReadout(`${r.right.filter(Boolean).length}/${N}`, dots, '', ACCENT[v]);
  else lab.setReadout(r.fin ? `${rd.res}°` : '?', dots, '', ACCENT[v]);

  // state card: it must not give away an answer the child is still working on
  let card;
  if (sec) card = [sec === 'walk' ? '🐢' : '🌍', t.secrets[sec][0], t.sec[`${sec}Text`], ''];
  else {
    const c = t.cards[v], full = v === 'tear' ? r.i >= 1 || r.fin : end;
    card = full ? c : [c[0], c[1], '', ''];
  }
  lab.setState({ emo: card[0], title: card[1], lead: card[2], body: card[3], extra: `<div class="fine">${esc(t.fine)}</div>` });
}
render();
</script>
</body>
