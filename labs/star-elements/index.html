  c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 1; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(xPeak, top); c.lineTo(xPeak, base); c.stroke(); c.setLineDash([]);
  // the curve
  const lg = c.createLinearGradient(px, 0, px + pw, 0); lg.addColorStop(0, '#ffb066'); lg.addColorStop(.5, '#ffe29a'); lg.addColorStop(1, '#8fb4ff');
  c.lineJoin = 'round'; c.lineCap = 'round'; c.lineWidth = 3; c.strokeStyle = lg; c.beginPath();
  CURVE.forEach(([x, y], i) => (i ? c.lineTo(xs(x), ys(y)) : c.moveTo(xs(x), ys(y)))); c.stroke();
  // labels
  c.font = '700 12px Nunito, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillStyle = '#c4cbe0';
  c.fillText(t.gy, gx + 10, gy + 14, gw - 20);
  c.textAlign = 'right'; c.fillText(`${t.gx} →`, gx + gw - 10, base + 12);
  c.textAlign = 'right'; c.fillStyle = '#ffd9b0';
  const zl = wrapText(c, t.gL, (xPeak - px) * .62); zl.forEach((s, i) => c.fillText(s, xPeak - 6, base - 8 - (zl.length - 1 - i) * 14));
  c.textAlign = 'center';
  c.fillStyle = '#c7d6ff'; const zr = wrapText(c, t.gR, px + pw - xPeak - 6); zr.forEach((s, i) => c.fillText(s, (xPeak + px + pw) / 2, base - 8 - (zr.length - 1 - i) * 14));
  // the core fuel as a dot gliding along the curve
  const q = clamp(p, 0, 6), i0 = Math.min(5, Math.floor(q)), fr = sm(q - i0);
  const xm = lerp(Math.sqrt(FUEL_A[i0] / 238), Math.sqrt(FUEL_A[i0 + 1] / 238), fr), ym = yAt(xm);
  const mg = c.createRadialGradient(xs(xm), ys(ym), 0, xs(xm), ys(ym), 13); mg.addColorStop(0, 'rgba(255,255,255,.9)'); mg.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = mg; c.beginPath(); c.arc(xs(xm), ys(ym), 13, 0, 6.2832); c.fill();
  c.fillStyle = LAY[fuelIdx(p)].c; c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(xs(xm), ys(ym), 5, 0, 6.2832); c.fill(); c.stroke();
  c.font = '800 12px Nunito, sans-serif'; c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(LAY[fuelIdx(p)].s, xs(xm), ys(ym) - 16);
}
const fuelIdx = (p) => clamp(Math.floor(clamp(p, 0, 6) + .5), 0, 6);
const stageKey = (p) => (p <= 6 ? `s${fuelIdx(p)}` : p - 6 < .4 ? 'c0' : p - 6 < .9 ? 'c1' : 'c2');

// --- view 3: your body ------------------------------------------------------------------------------------
const NEUTRAL = ['#5f73b3', '#6a86c4', '#5a8fb0', '#7a78c0', '#5c9aa8', '#7086b8', '#6574a8'];
function bodyList() { return S.atoms ? ATOM : MASS; }
function drawBody(c, w, h, dt, time) {
  const R = Math.min(w * .44, h * .43), cx = w / 2, cy = h / 2 + 4, r0 = R * .56, rev = S.p3 !== null;
  geo3 = { cx, cy, R, r0, sl: [] };
  const list = bodyList(); let a = -Math.PI / 2;
  list.forEach(([key, val], idx) => {
    const span = val / 100 * 2 * Math.PI, gap = Math.min(.014, span * .3), a0 = a + gap / 2, a1 = a + span - gap / 2, mid = (a + a + span) / 2;
    geo3.sl.push({ key, a: a, b: a + span });
    const sel = S.sel3 === key;
    S.pull[key] = lerp(S.pull[key] || 0, sel ? 1 : 0, Math.min(1, dt * 12));
    const dx = Math.cos(mid) * 7 * S.pull[key], dy = Math.sin(mid) * 7 * S.pull[key];
    c.save(); c.translate(dx, dy);
    const ring = (ri, ro, fill) => { c.beginPath(); c.arc(cx, cy, Math.max(0, ro), a0, a1); c.arc(cx, cy, Math.max(0, ri), a1, a0, true); c.closePath(); c.fillStyle = fill; c.fill(); };
    const g = c.createLinearGradient(cx - R, cy - R, cx + R, cy + R); g.addColorStop(0, shadeHex(NEUTRAL[idx % 7], .2)); g.addColorStop(1, NEUTRAL[idx % 7]);
    ring(r0, R, g);
    if (rev) {
      const k = sm(clamp((time - S.rev3) * 1.6 - idx * .12, 0, 1));
      if (k > 0) {
        c.globalAlpha = k; let cum = 0; const th = R - r0;
        for (const [sk, f] of sharesOfBody(key)) { ring(r0 + th * cum, r0 + th * Math.min(1, cum + f), COL[sk]); cum += f; }
        c.globalAlpha = 1;
      }
    }
    c.lineWidth = sel ? 2.5 : 1; c.strokeStyle = sel ? '#fff' : 'rgba(8,10,22,.6)';
    c.beginPath(); c.arc(cx, cy, R, a0, a1); c.arc(cx, cy, r0, a1, a0, true); c.closePath(); c.stroke();
    const rm = (R + r0) / 2;
    if (span * rm >= 24) {
      c.font = '900 14px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round'; c.lineWidth = 3; c.strokeStyle = 'rgba(8,10,22,.85)'; c.fillStyle = '#fff';
      const label = key === 'X' ? '+' : SYM[key - 1];
      c.strokeText(label, cx + Math.cos(mid) * rm, cy + Math.sin(mid) * rm + 1); c.fillText(label, cx + Math.cos(mid) * rm, cy + Math.sin(mid) * rm + 1);
    }
    c.restore();
    a += span;
  });
  // the body in the hole
  const glowCol = S.sel3 && rev ? COL[sharesOfBody(S.sel3)[0][0]] : '#7f9cf0', u = r0 * .86;
  const bg = c.createRadialGradient(cx, cy, 0, cx, cy, r0 * 1.05); bg.addColorStop(0, 'rgba(120,150,240,.22)'); bg.addColorStop(1, 'rgba(120,150,240,0)');
  c.fillStyle = bg; c.beginPath(); c.arc(cx, cy, r0 * 1.02, 0, 6.2832); c.fill();
  c.save(); c.translate(cx, cy + u * .02);
  c.shadowColor = glowCol; c.shadowBlur = 16;
  const fg = c.createLinearGradient(-u * .5, -u, u * .5, u); fg.addColorStop(0, '#f2f5ff'); fg.addColorStop(1, '#93a8e0'); c.fillStyle = fg;
  c.beginPath(); c.arc(0, -.7 * u, .16 * u, 0, 6.2832); c.fill();
  // one smooth outline: left side from the neck down to the crotch, then mirrored back up
  const SEG = [[-.30, -.48, -.46, -.42, -.48, -.24], [-.50, -.05, -.50, .12, -.44, .30], [-.40, .36, -.33, .36, -.31, .30], [-.35, .12, -.35, -.02, -.33, -.05],
    [-.31, 0, -.28, 0, -.27, .05], [-.26, .2, -.25, .3, -.24, .38], [-.27, .55, -.26, .75, -.22, .90], [-.20, .95, -.04, .95, -.03, .90], [-.03, .72, -.02, .58, 0, .48]];
  c.beginPath(); c.moveTo(-.12 * u, -.52 * u);
  for (const q of SEG) c.bezierCurveTo(q[0] * u, q[1] * u, q[2] * u, q[3] * u, q[4] * u, q[5] * u);
  for (let k = SEG.length - 1; k >= 0; k--) {
    const q = SEG[k], st = k ? [SEG[k - 1][4], SEG[k - 1][5]] : [-.12, -.52];
    c.bezierCurveTo(-q[2] * u, q[3] * u, -q[0] * u, q[1] * u, -st[0] * u, st[1] * u);
  }
  c.closePath(); c.fill();
  c.beginPath(); c.roundRect(-.07 * u, -.6 * u, .14 * u, .16 * u, .05 * u); c.fill();
  c.shadowBlur = 0;

  pill(c, T[lang].v3[S.atoms ? 'capAtoms' : 'capMass'], 10, 16);
}
function bodyAt(x, y) {
  if (!geo3) return null;
  const dx = x - geo3.cx, dy = y - geo3.cy, r = Math.hypot(dx, dy);

  let ang = Math.atan2(dy, dx); if (ang < -Math.PI / 2) ang += 2 * Math.PI;
  return (geo3.sl.find((s) => ang >= s.a && ang < s.b) || geo3.sl[geo3.sl.length - 1]).key;
}

// --- input -------------------------------------------------------------------------------------------------
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, v = lab.view;
  if (v === 'tbl') {
    let best = 0, bd = 1e9;
    for (let z = 1; z <= 94; z++) { const [X, Y, cs] = cellRect(z), d = Math.hypot(x - X - cs / 2, y - Y - cs / 2); if (d < bd) { bd = d; best = z; } }
    if (bd > geo.cell * .75) return;
    if (S.rev) { S.insp = best; S.sec = null; sfx.tick(); render(); }
    else if (S.p1 !== null && KEY.includes(best)) { S.selK = best; sfx.tick(); render(); }
  } else if (v === 'body') {
    const k = bodyAt(x, y); if (k === null) return;
    S.sel3 = k; sfx.tick(); render();
  }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, d = b.dataset;
  if (act === 'p1') { S.p1 = +d.i; sfx.click(); }
  else if (act === 'selk') { S.selK = +d.z; sfx.tick(); }
  else if (act === 'g') { S.guess[S.selK] = d.k; sfx.snap(); const nxt = KEY.find((z) => !S.guess[z]); if (nxt) S.selK = nxt; }
  else if (act === 'show') { if (Object.keys(S.guess).length < 2) return; reveal(); sfx.good(); showStage(); }
  else if (act === 'again') { Object.assign(S, { p1: null, guess: {}, selK: KEY[0], rev: false, insp: null, lg: null, sec: null }); sfx.click(); }
  else if (act === 'lg') { S.lg = S.lg === d.k ? null : d.k; S.sec = null; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (S.p1 === null) S.p1 = -1;
    if (!S.rev) reveal();
    S.sec = S.sec === d.k ? null : d.k; S.lg = null; sfx.click(); showStage();
  } else if (act === 'p2') { S.p2 = +d.i; S.auto = true; (+d.i === T[lang].v2.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'p3') { S.p3 = +d.i; S.rev3 = now(); S.atoms = false; (+d.i === BODY_OK ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'mode') { S.atoms = d.m === '1'; sfx.click(); }
  else if (act === 'el3') { S.sel3 = d.k === 'X' ? 'X' : +d.k; sfx.tick(); }
  render();
});
$('age').addEventListener('input', (ev) => {
  S.auto = false; S.p = Math.min(+ev.target.value / 100, capP()); render();
});
const showStage = () => { // on a phone the controls sit below the picture: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function reveal() { S.rev = true; S.revAt = now(); S.insp = null; S.sec = null; S.lg = null; }

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v; document.body.dataset.g = S.p2 === null ? '0' : '1';
  $('c1').hidden = v !== 'tbl'; $('c2').hidden = v !== 'star'; $('c3').hidden = v !== 'body';
  if (v === 'tbl') render1(t); else if (v === 'star') render2(t); else render3(t);
}
const fact = (emo, key, src) => ({ emo, text: T[lang].facts[key], src: T[lang].srcs[src] });
const optBtn = (act, i, txt, cls = '') => `<button class="se-opt ${cls}" data-act="${act}" data-i="${i}">${esc(txt)}</button>`;

function render1(t) {
  const v1 = t.v1, n = Object.keys(S.guess).length, right = Object.entries(S.guess).filter(([z, k]) => shareOf(+z, k) >= .25).length;
  lab.setGlow('rgba(110, 90, 210, .3)');
  // question / verdict
  let q = '';
  if (S.p1 === null) q = `<div class="se-q">${esc(v1.q)}</div><div class="se-opts">${v1.opts.map((o, i) => optBtn('p1', i, o)).join('')}</div>`;
  else if (S.rev && S.p1 >= 0) {
    const ok = S.p1 === v1.ok, why = ok ? v1.goldRight(GOLD_NS, GOLD_LMS) : S.p1 === 0 ? v1.goldSun(GOLD_NS, GOLD_LMS) : v1.goldBB(GOLD_NS);
    q = `<div class="se-verdict ${ok ? 'good' : 'bad'}"><b>${esc(ok ? v1.right : v1.no)}</b>${esc(why)}</div>`;
  }
  $('c1q').innerHTML = q;
  // colouring step
  let gHtml = '';
  if (S.p1 !== null && !S.rev) {
    const name = NM[lang][S.selK - 1];
    gHtml = `<div class="se-sub">${esc(v1.count(n))}</div><div class="se-chips">${KEY.map((z) => `<button class="chip se-c se-el ${S.selK === z ? 'on' : ''}" data-act="selk" data-z="${z}">${S.guess[z] ? dot(S.guess[z]) : ''}${SYM[z - 1]}</button>`).join('')}</div>
      <div class="se-sub">${esc(v1.pick(name))}</div><div class="se-chips">${GUESS_KEYS.map((k) => `<button class="chip se-c ${S.guess[S.selK] === k ? 'on' : ''}" data-act="g" data-k="${k}">${dot(k)}${esc(srcN(k))}</button>`).join('')}</div>
      <div class="se-row"><button class="btn" data-act="show" ${n < 2 ? 'disabled' : ''}>${esc(v1.show)}</button>${n < 2 ? `<span class="se-note">${esc(v1.need)}</span>` : ''}</div>`;
  }
  $('c1g').innerHTML = gHtml;
  // legend, secrets, again
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip se-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('c1l').innerHTML = `${S.rev ? `<div class="se-sub">${esc(v1.legend)}</div><div class="se-chips">${SRC_KEYS.map((k) => `<button class="chip se-c ${S.lg === k && !S.sec ? 'on' : ''}" data-act="lg" data-k="${k}">${dot(k)}${esc(srcN(k))}</button>`).join('')}</div>
      ${n ? `<div class="se-sub">${esc(v1.score(right, n))}</div>` : ''}` : ''}
    ${S.rev || open ? `<div class="se-row">${sc('gw', '🌌')}${sc('tc', '🧪')}${S.rev ? `<button class="chip se-c" data-act="again">${esc(v1.again)}</button>` : ''}</div>` : ''}`;

  else lab.setReadout(n ? `${right}/${n}` : '✨', n ? v1.rdRight : v1.rdTap, '', '#8f7fe0');

  else if (S.sec === 'tc') { st = { emo: '🧪', title: v1.tc.title, lead: v1.tc.lead }; facts = [fact('🧪', 'tc1', 'tc'), fact('⏳', 'tc2', 'tc')]; }

  else if (!S.rev) { st = { emo: '🎨', title: S.selK ? v1.pick(NM[lang][S.selK - 1]) : v1.colTitle, lead: v1.colLead }; facts = [fact('🎨', 'johnson', 'johnson')]; }
  else if (z) { st = { emo: '✨', title: `${NM[lang][z - 1]} · ${z}`, lead: originSentence(z), body: DECAY.includes(z) ? t.decay : '' }; facts = [fact('🎨', 'johnson', 'johnson'), fact('💥', 'bb', 'nuc')]; }
  else { st = { emo: '✨', title: v1.revTitle, lead: v1.revLead }; facts = [fact('🎨', 'johnson', 'johnson'), fact('💥', 'bb', 'nuc')]; }
  lab.setState({ ...st, body: st.body || '', extra: `<div class="se-fine">${esc(t.fine)}</div>` });
  lab.setFacts(facts);
}

function render2(t) {
  const v2 = t.v2, p = S.p, k = stageKey(p), asked = S.p2 !== null;
  S.skey = k;
  lab.setGlow('rgba(255, 140, 70, .26)');
  const cap = capP(), a = $('age');
  if (+a.max !== cap * 100) a.max = String(cap * 100);
  a.value = String(Math.round(p * 100));
  a.style.setProperty('--track', `linear-gradient(90deg, ${LAY.slice(0, Math.min(7, cap + 1)).map((l, i, arr) => `${l.c} ${arr.length === 1 ? 0 : (i / (arr.length - 1)) * 100}%`).join(', ')})`);
  $('ageL').textContent = v2.age;
  $('c2q').innerHTML = !asked
    ? `<div class="se-q">${esc(v2.q)}</div><div class="se-opts">${v2.opts.map((o, i) => optBtn('p2', i, o)).join('')}</div>`
    : (() => { const ok = S.p2 === v2.ok; return `<div class="se-verdict ${ok ? 'good' : 'bad'}"><b>${esc(ok ? v2.right : v2.no)}</b>${esc(v2.after)}</div>`; })();

  const nLay = LAY.filter((_, i) => fOf(i, p) >= .5).length, fuel = LAY[fuelIdx(p)].s;
  if (p <= 6) lab.setReadout(fuel, v2.rdSub, v2.layers(nLay), LAY[fuelIdx(p)].c);
  else lab.setReadout(fuel, p - 6 < .9 ? v2.rdBoom : v2.rdEnd, '', '#ffd9a0');
  lab.setState({ emo: idx < 7 ? '⭐' : idx === 9 ? '🌌' : '💥', title: v2.st[idx][0], lead: v2.st[idx][1], body: '', extra: '' });
  lab.setFacts(asked ? [fact('⏱️', 's1', 'si'), fact('💥', 's2', 'si')] : [fact('⏱️', 's1', 'si')]);
}

function render3(t) {
  const v3 = t.v3, rev = S.p3 !== null, list = bodyList();
  lab.setGlow('rgba(80, 130, 230, .28)');
  $('c3q').innerHTML = !rev
    ? `<div class="se-q">${esc(v3.q)}</div><div class="se-opts">${BODY_OPTS.map((n, i) => optBtn('p3', i, v3.opt(n))).join('')}</div>`
    : (() => { const ok = S.p3 === BODY_OK; return `<div class="se-verdict ${ok ? 'good' : 'bad'}"><b>${esc(ok ? v3.right : v3.no)}</b>${esc(v3.after(fmtN(BB_MASS), BB_ATOMS))}</div>`; })();
  const chip = ([key, val]) => {
    const label = key === 'X' ? v3.others : SYM[key - 1];
    return `<button class="chip se-c ${S.sel3 === key ? 'on' : ''}" data-act="el3" data-k="${key}">${rev ? dot(sharesOfBody(key)[0][0]) : ''}${esc(label)}${rev ? ` ${fmtN(val)} %` : ''}</button>`;
  };
  $('c3e').innerHTML = `${rev ? `<div class="se-chips" style="margin-bottom:8px">${[['mass', 0], ['atoms', 1]].map(([k, m]) => `<button class="chip se-c se-seg ${S.atoms === !!m ? 'on' : ''}" data-act="mode" data-m="${m}">${esc(v3[k])}</button>`).join('')}</div>` : ''}
    <div class="se-chips">${list.map(chip).join('')}</div>
    ${rev ? `<div class="se-leg">${['bb', 'lms', 'msx', 'wd'].map((k) => `<span>${dot(k)}${esc(srcN(k))}</span>`).join('')}</div>` : ''}`;
  const sel = S.sel3, row = list.find((x) => x[0] === sel);
  if (!rev) lab.setReadout('?', v3.rdQ, '', '#6f9cf0');
  else lab.setReadout(`${fmtN(S.atoms ? BB_ATOMS : BB_MASS)} %`, S.atoms ? v3.rdAtoms : v3.rdMass, sel ? (sel === 'X' ? v3.others : NM[lang][sel - 1]) : '', '#6f9cf0');
  let st;
  if (!sel) st = { emo: '🧍', title: rev ? v3.title : v3.q, lead: rev ? v3.lead : v3.ask };
  else {
    const name = sel === 'X' ? v3.othersFull : NM[lang][sel - 1];
    if (!rev) st = { emo: '🧍', title: name, lead: v3.ask };
    else {
      const sh = sharesOfBody(sel);
      st = { emo: '✨', title: v3.mine[sel], lead: `${originLine(sh)}.${sh.some(([k]) => k === 'bb') ? ` ${v3.bbWhen}` : ` ${v3.before}`}`, body: v3.of(name, fmtN(row[1]), S.atoms) };
    }
  }
  lab.setState({ body: '', extra: '', ...st });
  lab.setFacts(rev ? [fact('🔢', 'b1', 'body'), fact('⚖️', 'b3', 'body'), fact('🩸', 'b2', 'body')] : [fact('🔢', 'b1', 'body'), fact('🩸', 'b2', 'body')]);
}
render();
