  $('gHint').textContent = g.touched ? '' : gt.hint; $('gSlVal').textContent = g.touched ? gt.val(g.guess) : '';
  if (+$('gSl').value !== g.guess) $('gSl').value = g.guess;
  $('gPour').textContent = gt.pour; $('gPour').disabled = !g.touched;
  $('gLegend').innerHTML = `<span><i style="background:${WC.salt[0]}"></i>${esc(gt.salty)}</span><span><i style="background:${WC.fresh[1]}"></i>${esc(gt.fresh)}</span>`;
  $('gZoom').hidden = g.zoomed; $('gZoom').textContent = gt.zoom; $('gAgain').hidden = !g.zoomed; $('gAgain').textContent = gt.again;
  if (!g.poured) {
    lab.setReadout(g.touched ? `${g.guess}` : '?', g.touched ? gt.roG : '', '', '#9aa6c0');
    lab.setState({ emo: '🥛', title: gt.q, lead: gt.askLead, body: '', extra: '' }); lab.setFacts([]);
  } else if (!g.zoomed) {
    lab.setReadout(FRESH_TXT, gt.roP(g.guess), gt.pillP, '#6ec9f0');
    const [emo, title, lead, body] = gt.st1(SALTY_TXT, FRESH_TXT); lab.setState({ emo, title, lead, body, extra: '' });
    lab.setFacts([t.facts.baikal]);
  } else {
    lab.setReadout(`${num(SURF_ALL, 2)} %`, gt.roZ, '', '#8ee6ff');
    const [emo, title, lead, body] = gt.st2(Math.round(ICE), Math.round(GROUND), Math.round(SURF), num(SURF_ALL, 2)); lab.setState({ emo, title, lead, body, extra: '' });
    lab.setFacts([t.facts.baikal, t.facts.ant]);
  }
}

function renderE(t) {
  const e = S.e, et = t.e, ans = e.pick !== null, n = e.spoons;
  lab.setGlow('rgba(240, 200, 120, .22)');
  $('ePred').innerHTML = predHTML('e', et.q, et.opts, e.pick, RIGHT.e);
  if (ans && e.up) setVerdict('eV', e.pick === RIGHT.e, e.pick === RIGHT.e ? et.right : et.wrong);
  $('eSalt').textContent = n >= 8 ? et.saltMax : et.salt; $('eSalt').disabled = !ans || n >= 8;
  $('eFresh').hidden = n === 0; $('eFresh').textContent = et.again; $('eFine').textContent = et.fine;
  const rho = rhoOf(n);
  if (!ans) {
    lab.setReadout(`${num(RHO0, 3)} ${et.unit}`, et.roFresh, '', '#e8c97a');
    lab.setState({ emo: et.st0[0], title: et.q, lead: et.st0[1], body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  lab.setReadout(`${num(rho, 3)} ${et.unit}`, `${et.spoons(n)} · ${et.mk.sea} ≈ ${num(RHO_SEA, 3)} · ${et.mk.dead} ≈ ${num(RHO_DEAD, 2)}`, et.pill[n <= 1 ? 0 : n === 2 ? 1 : 2], '#e8c97a');
  const st = n === 0 ? et.st1 : n === 1 ? et.st2 : et.st3;
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
  lab.setFacts(n >= 2 ? [t.facts.dead] : []);
}

function renderS(t) {
  const st = S.s, stt = t.s, ans = st.pick !== null;
  lab.setGlow('rgba(255, 200, 80, .24)');
  $('sPred').innerHTML = predHTML('s', stt.q, stt.opts, st.pick, RIGHT.s);
  $('sLbl').textContent = stt.lbl; $('sFine').textContent = stt.fine;
  sunUI();
}
// readouts, slider, verdict and state card of the sun view (called from render and from the loop while the hours run)
function sunUI() {
  if (lab.view !== 'sun' || S.sec) return;
  const t = T[lang], st = S.s, stt = t.s, ans = st.pick !== null, h = st.h, m = sunMath(h);
  $('sSl').disabled = !ans; $('sPlay').disabled = !ans;
  $('sPlay').textContent = st.play ? stt.pause : stt.play;
  const hv = Math.round(h * 10); if (+$('sSl').value !== hv) $('sSl').value = hv;
  $('sHrs').textContent = stt.hrs(num(h, 1));
  if (!ans) {
    lab.setReadout('?', stt.roQ, '', '#ffc83a');
    lab.setState({ emo: stt.st0[0], title: stt.q, lead: stt.st0[1], body: '', extra: '' }); lab.setFacts([]); setVerdict('sV', true, '');
    return;
  }
  const cup = 0.8 * m.evap > 0.03, crust = m.evap > 0.12;
  lab.setReadout(cup ? stt.cupSalt(num(0, 0)) : stt.cupEmpty, stt.bowl(num(m.sal, m.sal < 10 ? 1 : 0)), crust ? stt.crust : '', '#ffc83a');
  const rev = h >= 2, s = h < 0.05 ? stt.st1 : rev ? stt.st2 : stt.st1b;
  lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' });
  lab.setFacts([t.facts.sea]);
  if (rev) setVerdict('sV', st.pick === RIGHT.s, st.pick === RIGHT.s ? stt.right : stt.wrong); else setVerdict('sV', true, '');
}

function secARead() { if (S.sec === 'a') lab.setReadout(`${S.a.salt}`, T[lang].a.ro, '', '#e0b050'); }
function renderA(t) {
  const at = t.a; lab.setGlow('rgba(224, 176, 80, .24)');
  $('aPause').textContent = S.a.paused ? at.play : at.pause; $('aFast').textContent = S.a.spd > 1 ? at.norm : at.fast;
  secARead();
  lab.setState({ emo: at.st[0], title: at.st[1], lead: at.st[2], body: at.st[3], extra: '' }); lab.setFacts([]);
}
function renderB(t) {
  const bt = t.b, d = S.b.drink; lab.setGlow(d === 'sea' ? 'rgba(224, 160, 80, .26)' : 'rgba(80, 160, 220, .24)');
  $('bF').textContent = bt.fresh; $('bS').textContent = bt.sea;
  const ro = d === 'sea' ? bt.ro2 : d === 'fresh' ? bt.ro1 : bt.ro0, st = d === 'sea' ? bt.st2 : d === 'fresh' ? bt.st1 : bt.st0;
  lab.setReadout(ro[0], ro[1], ro[2], d === 'sea' ? '#e0a050' : '#6ec9f0');
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' }); lab.setFacts([]);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec === 'a') drawSecA(c, w, h, dt, time);
  else if (S.sec === 'b') drawSecB(c, w, h, dt, time);
  else if (lab.view === 'glasses') drawGlasses(c, w, h, dt, time);
  else if (lab.view === 'egg') drawEgg(c, w, h, dt, time);
  else drawSun(c, w, h, dt, time);
});
render();
</script>
</body>
</html>
