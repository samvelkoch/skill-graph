// --- small helpers -------------------------------------------------------------------------------------------
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const easeIO = (t) => { t = clamp01(t); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);
const easeIn = (t) => { t = clamp01(t); return t * t; };

const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };

const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };

const PILLS = [];

function wrapLines(c, text, maxW) {

    }

      c.fillStyle = 'rgba(255,255,255,.22)';
      for (let xx = x; xx < x + w; xx += p * 2) c.fillRect(xx, y, p, h);
      for (let yy = y; yy < y + h; yy += p * 2) c.fillRect(x, yy, w, p);
      c.strokeStyle = 'rgba(60,20,20,.13)'; c.lineWidth = .6; c.beginPath();
      for (let xx = x; xx < x + w; xx += 2.2 * s) { c.moveTo(xx, y); c.lineTo(xx, y + h); }
      for (let yy = y; yy < y + h; yy += 2.2 * s) { c.moveTo(x, yy); c.lineTo(x + w, yy); }
      c.stroke(); break;
    }
    case 'plastic': {

const optBtn = (act, i, k, label, picked, right, off) => `<button class="um-btn${picked ? ' pick' : ''}${right ? ' right' : ''}" data-act="${act}" data-i="${i}"${off ? ' disabled' : ''}>${dot(k)}${esc(label)}</button>`;
const verdict = (ok, why) => `<div class="um-v" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? T[lang].right : T[lang].wrong)}</div><p class="um-t">${esc(why)}</p>`;

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v === 'rain') renderRain(t); else if (v === 'tests') renderTests(t); else renderJobs(t);
}
function renderRain(t) {
  const R = S.rain, un = secret.unlocked(), raining = R.phase === 'rain';
  lab.setGlow('rgba(127,143,166,.32)');
  lab.setReadout('☔', '', '', P.plastic);
  let h = '';
  if (!S.sec) {
    h += `<div class="um-q">${esc(t.r.q)}</div><div class="um-opts">${t.r.o.map((o, i) => optBtn('rpick', i, RAIN_KEYS[i], o, R.picked === i, R.done && i === 2, R.picked >= 0)).join('')}</div>`;
    if (R.done) {
      h += verdict(R.picked === 2, t.r.r);
      h += `<div class="row2"><button class="chip" data-act="rrain"${raining ? ' disabled' : ''}>${esc(t.r.again)}</button><button class="chip" data-act="rdry"${raining ? ' disabled' : ''}>${esc(t.r.dry)}</button><button class="btn ghost" data-act="rreset">${esc(t.again)}</button></div>`;
    }
  }
  const sc = (k, emo) => `<button class="chip secret${un ? ' open' : ''}${S.sec === k ? ' on' : ''}" data-act="sec" data-k="${k}">${un ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  h += `<div class="row2">${sc('silly', '🍫')}${sc('coat', '🧥')}</div>`;
  $('ctrlBody').innerHTML = h;
  if (S.sec) lab.setState({ emo: S.sec === 'silly' ? '🍫' : '🧥', title: t.secrets[S.sec][0], lead: t.sec[S.sec + 'Text'], body: '', extra: '' });
  else lab.setState({ ...stCard(t.st.rain[R.done ? 1 : 0]), extra: '' });
}
function renderTests(t) {
  const Tt = S.tests, i = Math.min(Tt.i, 3), rd = ROUNDS[i];
  lab.setGlow('rgba(91,141,239,.28)');
  let h = '';
  if (Tt.end) {
    lab.setReadout('4/4', '', '', P.plastic);
    h = `<div class="row2" style="margin-top:0"><button class="btn ghost" data-act="tagain">${esc(t.again)}</button></div>`;
    lab.setState({ ...stCard(t.st.tests[1]), extra: '' });
  } else {
    const picked = Tt.pick >= 0;
    lab.setReadout(`${i + 1}/4`, '', Tt.shown ? t.t.props[i] : '', P.plastic);
    h = `<div class="um-q">${esc(t.t.q[i])}</div><div class="um-opts">${rd.mats.map((m, k) => optBtn('tpick', k, m, t.mat[m], Tt.pick === k, Tt.shown && k === rd.right, picked)).join('')}</div>`;
    if (Tt.shown) h += verdict(Tt.pick === rd.right, t.t.why[i]) + `<button class="btn um-go" data-act="tnext">${esc(t.next)}</button>`;
    lab.setState({ ...stCard(t.st.tests[0]), extra: '' });
  }
  $('ctrlBody').innerHTML = h;
}
function renderJobs(t) {
  const J = S.jobs, i = Math.min(J.i, 4), jb = JOBS[i];
  lab.setGlow('rgba(216,106,92,.26)');
  let h = '';
  if (J.end) {
    lab.setReadout('5/5', '', '', P.cloth);
    h = `<div class="row2" style="margin-top:0"><button class="btn ghost" data-act="jagain">${esc(t.again)}</button></div>`;
    lab.setState({ ...stCard(t.st.jobs[1]), extra: '' });
  } else {
    const picked = J.pick >= 0;
    lab.setReadout(`${i + 1}/5`, '', '', P.cloth);
    h = `<div class="um-q">${esc(t.j.q(t.j.objs[i]))}</div><div class="um-opts">${jb.mats.map((m, k) => optBtn('jpick', k, m, t.mat[m], J.pick === k, J.shown && k === jb.right, picked)).join('')}</div>`;
    if (J.shown) h += verdict(J.pick === jb.right, t.j.why[i]) + `<button class="btn um-go" data-act="jnext">${esc(t.next)}</button>`;
    lab.setState({ ...stCard(t.st.jobs[0]), extra: '' });
  }
  $('ctrlBody').innerHTML = h;
}
render();
</script>
</body>
</html>
