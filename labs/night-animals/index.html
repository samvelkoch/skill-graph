function moth(c, o) {

// the light: a cone from the torch and a pool around the spot it points at (white = lit)
function beamMask(m, P, O, R) {

      const aw = a.night ? clamp01((f - .35) / .3) : clamp01((.65 - f) / .3);
      zzz(c, a.x + 3, a.y - 8, t, clamp01((.3 - aw) / .2));

  }
}

// --- secrets (chips in the torch view) ----------------------------------------------------------------------
function emoji(c, ch, x, y, px) {
  c.save(); c.globalAlpha = 1; c.fillStyle = '#ffffff'; c.font = `${px}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ch, x, y); c.restore();
}
function pathLen(pts) { const seg = []; let L = 0; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; } return { seg, L }; }
// the part of a polyline between distance a and b along it

    if (!out.length) out.push([lerp(pts[i][0], pts[i + 1][0], u0), lerp(pts[i][1], pts[i + 1][1], u0)]);

function strokePts(c, p) { if (p.length < 2) return; c.beginPath(); c.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) c.lineTo(p[i][0], p[i][1]); c.stroke(); }
// a side cut of an eye: the ray goes in, and only the fox's eye sends it back out
function eyeCut(c, cx, cy, R, isFox, head, t) {
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fillStyle = rad(c, cx - 4, cy - 4, 0, R * 1.3, [[0, '#F4EBDD'], [1, '#CDBFA8']]); c.fill(); c.strokeStyle = '#2A1E14'; c.lineWidth = .8; c.stroke();
  c.beginPath(); c.arc(cx, cy, R - 2.2, 0, TAU); c.fillStyle = lin(c, cx - R, cy - R, cx + R, cy + R, [[0, '#3A4A7A'], [1, '#1E2850']]); c.fill();
  c.lineCap = 'round';
  c.strokeStyle = C.fox; c.lineWidth = 2; c.beginPath(); c.arc(cx, cy, R - 3, -.85, .85); c.stroke();
  c.save();
  if (isFox) { c.strokeStyle = '#EAF0FA'; c.lineWidth = 1.6; c.shadowColor = '#ffffff'; c.shadowBlur = 6; } else { c.strokeStyle = '#1A1210'; c.lineWidth = 1.6; }
  c.beginPath(); c.arc(cx, cy, R - 1.2, -.85, .85); c.stroke(); c.restore();
  ell(c, cx - R + .8, cy, 3.4, 8.6, '#DDE9F8', '#2A1E14', .6);
  c.strokeStyle = isFox ? '#C98A2B' : '#5A7FA8'; c.lineWidth = 2.2;
  c.beginPath(); c.moveTo(cx - R + 3, cy - 8.6); c.lineTo(cx - R + 6.4, cy - 4.4); c.moveTo(cx - R + 3, cy + 8.6); c.lineTo(cx - R + 6.4, cy + 4.4); c.stroke();
  ell(c, cx - R + 6.6, cy, 2.4, 5.2, '#EEF5FF', '#2A1E14', .5);
  const S0 = [cx - R - 12, cy + 1.2], P1 = [cx - R + 1.6, cy + .4], Bk = [cx + R - 3.4, cy + 2.6], P2 = [cx - R + 1.8, cy - 3.4], E = [cx - R - 10, cy - 13];
  const pts = isFox ? [S0, P1, Bk, P2, E] : [S0, P1, Bk], { seg, L } = pathLen(pts), L1 = seg[0] + seg[1];

  const hit = Math.max(0, 1 - Math.abs(head - L1) / 7);
  if (hit > 0) { c.fillStyle = rad(c, Bk[0], Bk[1], 0, 6, [[0, `rgba(255,233,168,${.9 * hit})`], [1, 'rgba(255,233,168,0)']]); c.beginPath(); c.arc(Bk[0], Bk[1], 6, 0, TAU); c.fill(); }
  if (isFox) {
    const back = Math.max(0, 1 - Math.abs(head - (L1 + 6)) / 7);
    if (back > 0) { c.fillStyle = rad(c, Bk[0] - 2, Bk[1] - .4, 0, 5, [[0, `rgba(200,245,107,${.8 * back})`], [1, 'rgba(200,245,107,0)']]); c.beginPath(); c.arc(Bk[0] - 2, Bk[1] - .4, 5, 0, TAU); c.fill(); }
    const gl = clamp01((head - (L - 12)) / 12);
    if (gl > 0) { c.fillStyle = rad(c, cx - R - 3, cy - 5, 0, 5 + 8 * gl, [[0, `rgba(200,245,107,${.8 * gl})`], [1, 'rgba(200,245,107,0)']]); c.beginPath(); c.arc(cx - R - 3, cy - 5, 5 + 8 * gl, 0, TAU); c.fill(); }

}
function drawShine(c, t) {
  skyFill(c, 1);
  c.fillStyle = lin(c, 0, 0, 0, W.h, [[0, C.sky], [1, '#16254A']]); c.fillRect(0, 0, W.w, W.h);
  const cyc = t % 5, Lf = 12 + 15.4 + 27.4 + 17.4 + 15, head = clamp01(cyc / 3.6) * (Lf + 4);
  world(c, () => { eyeCut(c, 27, 44, 13, true, head, t); eyeCut(c, 75, 44, 13, false, head, t); });
  emoji(c, '🦊', sx(27), sy(22), clamp(5 * W.u, 22, 34)); emoji(c, '🧑', sx(75), sy(22), clamp(5 * W.u, 22, 34));
}
function drawWings(c, t) {
  skyFill(c, 1);
  c.fillStyle = lin(c, 0, 0, 0, W.h, [[0, C.sky], [1, '#16254A']]); c.fillRect(0, 0, W.w, W.h);
  const tt = T[lang], cyc = t % 9, pig = cyc < 4.5, s = clamp01((cyc % 4.5) / 4), x = -14 + 128 * s, y = 22 + 3 * Math.sin(s * TAU * 2);
  const prox = Math.exp(-Math.pow((x - 62) / 26, 2)), ph = t * (pig ? 15 : 7);
  const level = pig ? prox * (.3 + .7 * Math.pow(Math.abs(Math.sin(ph)), 1.5)) : .04 + .03 * prox * Math.abs(Math.sin(ph));
  const wake = pig && prox * Math.abs(Math.sin(ph)) > .45;
  world(c, () => {
    stars(c, t, 1); moon(c, 12, 12, 4);
    c.fillStyle = lin(c, 0, 50, 0, 96, [[0, '#21493A'], [1, C.green]]); c.fillRect(-60, 56, 220, 60);
    blades(c, (h) => h, 66, 90);
    ell(c, 62, 76, 8, 1.8, 'rgba(0,0,0,.35)');
    put(c, mouse, 62, 68, .2, { t, open: wake ? 1 : 0, move: wake ? 1 : 0 });
    if (!wake) zzz(c, 60, 65, t, 1);
    else { c.fillStyle = C.beam; c.font = '900 6px Nunito, system-ui, sans-serif'; c.textAlign = 'center'; c.fillText('!', 54, 60); }
    // the bird
    c.save(); c.translate(x, y); c.scale(.38, .38); flyer(c, pig ? 'pigeon' : 'owl', t); c.restore();
    // sound bar
    rrect(c, 88, 14, 7, 56, 3); c.fillStyle = 'rgba(130,145,190,.16)'; c.fill();
    for (let j = 0; j < 12; j++) { const lit = (j + .5) / 12 < level; rrect(c, 88.8, 68.4 - (j + 1) * 4.5, 5.4, 3.5, 1.4); c.fillStyle = lit ? mix(C.acc, '#F5C84C', j / 11) : 'rgba(130,145,190,.2)'; c.fill(); }
    // zoom on an owl feather
    const fx = 21, fy = 56, fr = 17;
    c.save(); c.beginPath(); c.arc(fx, fy, fr, 0, TAU); c.clip();
    c.fillStyle = '#101A38'; c.fillRect(fx - fr, fy - fr, fr * 2, fr * 2);
    c.fillStyle = lin(c, 0, fy - 7, 0, fy + 7, [[0, tint(C.owl, .2)], [1, shade(C.owl, .2)]]);
    c.beginPath(); c.moveTo(fx - 18, fy + 1); c.quadraticCurveTo(fx, fy - 8, fx + 18, fy - 2); c.lineTo(fx + 18, fy + 3); c.quadraticCurveTo(fx, fy + 9, fx - 18, fy + 3); c.closePath(); c.fill();
    c.lineCap = 'round'; c.strokeStyle = tint(C.owl, .6); c.lineWidth = .8;
    for (let k = -14; k <= 14; k += 1.8) { const yy = fy - 5.4 + (k + 14) * .06 - Math.pow(Math.abs(k) / 14, 2) * 0; c.beginPath(); c.moveTo(fx + k, yy + 1.4); c.lineTo(fx + k + 1.4, yy - 3.2); c.stroke(); }
    c.strokeStyle = shade(C.owl, .35); c.lineWidth = .5;
    for (let k = -14; k <= 14; k += 2.6) { c.beginPath(); c.moveTo(fx + k, fy - 2); c.lineTo(fx + k + 2.2, fy + 3); c.stroke(); }
    c.strokeStyle = tint(C.owl, .35); c.lineWidth = .35;
    for (let k = -15; k <= 15; k += .9) { const l2 = 3 + rnd(k * 7 + 3) * 2.4; c.beginPath(); c.moveTo(fx + k, fy + 3.5); c.lineTo(fx + k - 1, fy + 3.5 + l2); c.stroke(); }
    c.strokeStyle = tint(C.owl, .8); c.lineWidth = 1.1; c.beginPath(); c.moveTo(fx - 18, fy + .6); c.quadraticCurveTo(fx, fy - 2.6, fx + 18, fy + .2); c.stroke();
    c.restore();
    c.strokeStyle = C.moon; c.lineWidth = .7; c.beginPath(); c.arc(fx, fy, fr, 0, TAU); c.stroke();
    c.lineWidth = 2.2; c.lineCap = 'round'; c.beginPath(); c.moveTo(fx + fr * .72, fy + fr * .72); c.lineTo(fx + fr * .72 + 6, fy + fr * .72 + 6); c.stroke();
  });
  pill(c, pig ? tt.sec.pigeon : tt.sec.owl, sx(clamp(x, 14, 84)), sy(y - 17), 1, C.moon);
  pill(c, tt.sec.sound, sx(91.5), sy(8), 1);
}

// --- one draw per frame ------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, t) => {
  W.w = w; W.h = h; W.u = Math.min(w / 100, h / 80); W.x = (w - 100 * W.u) / 2; W.y = (h - 80 * W.u) / 2;
  const v = lab.view;
  if (v === 'torch') { if (S.sec === 'shine') drawShine(c, t); else if (S.sec === 'wings') drawWings(c, t); else drawTorch(c, dt, t); }
  else if (v === 'senses') drawSenses(c, t);
  else drawDay(c, t);
});

// --- dragging the torch -------------------------------------------------------------------------------------
let dragging = false;
const aim = (ev) => {
  if (lab.view !== 'torch' || S.sec) return;
  const V = S.torch; if (V.at > 0 && !V.free) return; // gliding to the spot
  const r = $('cv').getBoundingClientRect();
  B.wx = clamp(ev.clientX - r.left, 0, r.width); B.wy = clamp(ev.clientY - r.top, 0, r.height); B.moved = true;
};
$('cv').addEventListener('pointerdown', (ev) => { dragging = true; try { $('cv').setPointerCapture(ev.pointerId); } catch { /* capture is optional */ } aim(ev); });
$('cv').addEventListener('pointermove', (ev) => { if (dragging || ev.pointerType === 'mouse') aim(ev); });
const stopDrag = () => { dragging = false; };
$('cv').addEventListener('pointerup', stopDrag); $('cv').addEventListener('pointercancel', stopDrag);

// --- controls ----------------------------------------------------------------------------------------------
// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(j) {
  const v = lab.view, V = S[v];
  if (V.at || V.free) return;
  V.guess = j; V.at = now(); const ok = j === RIGHT[v][V.ti]; V.marks[V.ti] = ok;
  (ok ? sfx.good : sfx.bad)();
  if (v === 'torch') { B.gx = B.x ?? 0; B.gy = B.y; }
  if (v === 'daynight') setSky(RIGHT.daynight[V.ti] ? 1 : 0, 1.4);
  showStage(); render();
}
function again() {
  const v = lab.view; S[v] = mkV();
  if (v === 'daynight') setSky(.5, 1);
  if (v === 'torch') { B.wx = B.x ?? 0; B.wy = B.y; }
  sfx.click(); render();
}
function next() {
  const v = lab.view, V = S[v];
  if (!V.at) return;
  if (V.ti >= N - 1) { if (v === 'senses') return again(); V.free = true; }
  else { V.ti++; V.guess = null; V.at = 0; if (v === 'daynight') setSky(.5, 1); }
  if (v === 'torch') { B.wx = B.x ?? 0; B.wy = B.y; }
  sfx.click(); render();
}
$('naOpts').addEventListener('click', (ev) => { const b = ev.target.closest('.na-opt'); if (b && !b.disabled) answer(+b.dataset.j); });
$('naNext').onclick = next;
$('naAgain').onclick = again;
$('naSl').addEventListener('input', () => { const f = $('naSl').value / 100; SKY.f0 = SKY.fT = f; SKY.at = -9; render(); });
$('naChips').addEventListener('click', (ev) => {
  const b = ev.target.closest('.chip'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.k; S.sec = S.sec === k ? null : k; sfx.click(); showStage(); render();
});

// --- one render per change: controls, readout and the state card ---------------------------------------------
function readout() {
  const t = T[lang], v = lab.view, V = S[v], sec = v === 'torch' ? S.sec : null;
  let val, sub = '', pill2 = '';
  if (sec) { val = sec === 'shine' ? '✨' : '🪶'; sub = t.secrets[sec][0]; }
  else if (V.free) { if (v === 'torch') val = t.found(V.found.filter(Boolean).length); else val = SKY.fT < .5 ? '☀️' : '🌙'; }
  else {
    const k = V.marks.filter(Boolean).length;
    val = V.marks.length ? `${k}/${N}` : '?';
    sub = [0, 1, 2, 3].map((j) => (j < V.marks.length ? (V.marks[j] ? '✓' : '✗') : '○')).join(' ');
    if (V.at > 0) {
      if (v === 'torch') pill2 = t.tools[TOOLK[KEYS[V.ti]]];
      else if (v === 'daynight' && DAYA[V.ti].tool) pill2 = t.tools[DAYA[V.ti].tool];
    }
  }
  lab.setReadout(val, sub, pill2, C.acc);
}
function render() {
  const t = T[lang], v = lab.view, V = S[v], sec = v === 'torch' ? S.sec : null, answered = V.at > 0, free = V.free;
  document.body.dataset.v = v;
  $('naRound').style.display = !free && !sec ? '' : 'none';
  $('naFree').style.display = free && !sec ? '' : 'none';
  $('naSecRow').style.display = v === 'torch' ? '' : 'none';
  $('naSlWrap').style.display = v === 'daynight' ? '' : 'none';
  if (!free && !sec) {
    const i = V.ti, src = v === 'torch' ? t.t : v === 'senses' ? t.s : null, right = RIGHT[v][i];
    const opts = v === 'daynight' ? t.d.o : src.o[i], why = v === 'daynight' ? t.d.why[i] : src.why[i];
    $('naQ').textContent = v === 'daynight' ? t.d.q : src.q[i];
    $('naOpts').innerHTML = opts.map((o, j) => `<button class="na-opt ${answered ? (j === right ? 'good' : j === V.guess ? 'bad' : 'dim') : ''}" data-j="${j}"${answered ? ' disabled' : ''}>${esc(o)}</button>`).join('');
    const ok = V.guess === right;
    $('naFb').innerHTML = answered ? `<b class="${ok ? 'good' : 'bad'}">${esc(ok ? t.right : t.wrong)}</b>${esc(why)}` : '';
    $('naNext').hidden = !answered;
    $('naNext').textContent = i === N - 1 && v === 'senses' ? t.again : t.next;
  }
  if (free) {
    $('naFreeT').textContent = v === 'torch' ? t.free.t : t.free.d;
    $('naAgain').textContent = t.again;
    if (v === 'daynight') { $('naSl').value = Math.round(SKY.fT * 100); $('naSl').setAttribute('aria-label', t.d.slider); $('naSlLbl').textContent = t.d.slider; }
  }
  const open = secret.unlocked();
  $('naChips').innerHTML = ['shine', 'wings'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-k="${k}">${open ? `${k === 'shine' ? '✨' : '🪶'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  readout();
  if (sec) lab.setState({ emo: sec === 'shine' ? '✨' : '🪶', title: t.secrets[sec][0], lead: t.secrets[sec][1], body: t.sec[sec + 'Text'], extra: '' });

  }
}
render();
