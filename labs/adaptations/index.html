const clamp01 = (x) => Math.min(1, Math.max(0, x));
const lrp = (a, b, k) => a + (b - a) * k;
const R = (r) => Math.max(0, r);
const rep = (x, p) => ((x % p) + p) % p;
const ease = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };

const pulse = (u, c, w = .16) => Math.exp(-(((u - c) / w) ** 2));
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = rgb(a), B = rgb(b); return '#' + A.map((v, i) => Math.round(lrp(v, B[i], k)).toString(16).padStart(2, '0')).join(''); };
const dark = (h, k) => mix(h, '#000000', k), light = (h, k) => mix(h, '#ffffff', k);

const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, R(rx), R(ry), rot, 0, TAU); };

// --- parts: beaks and feet (drawn at their joint, pointing right) ---------------------------------------------
const BEAKLEN = { cone: [28, 1], needle: [64, .5], hook: [37, 9], flat: [51, 1] };
const BEAKP = {

  hook: [(c) => { c.moveTo(-6, -11); c.bezierCurveTo(12, -13, 30, -9, 37, 2); c.bezierCurveTo(39, 9, 34, 14, 30, 14); c.bezierCurveTo(31, 8, 27, 5, 20, 4); c.lineTo(-6, 2); }, (c) => { c.moveTo(-6, 2); c.lineTo(18, 4.5); c.quadraticCurveTo(14, 11, -6, 11); }],
  flat: [(c) => { c.moveTo(-6, -9); c.bezierCurveTo(14, -10, 36, -9, 49, -4); c.quadraticCurveTo(52, 0, 49, 2); c.lineTo(-6, 2); }, (c) => { c.moveTo(-6, 2); c.lineTo(49, 2); c.quadraticCurveTo(46, 8, 38, 9); c.bezierCurveTo(22, 10, 8, 10, -6, 10); }],
};
const BEAKTOP = { cone: -9, needle: -3, hook: -9, flat: -7 };
function drawBeak(c, key, gape = 0) {
  const [up, low] = BEAKP[key], edge = dark(C.gold, .42);
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  c.save(); c.translate(-6, 1.5); c.rotate(gape); c.translate(6, -1.5);
  c.beginPath(); low(c); c.closePath(); paint(c, dark(C.gold, .14), edge);
  if (key === 'flat') { c.beginPath(); for (let x = 4; x < 46; x += 5) { c.moveTo(x, 2.5); c.lineTo(x, 7); } c.lineWidth = 1; c.strokeStyle = edge; c.stroke(); }
  c.restore();

  c.beginPath(); c.moveTo(2, BEAKTOP[key]); c.lineTo(BEAKLEN[key][0] * .55, BEAKTOP[key] + 1.2); c.lineWidth = 1.6; c.strokeStyle = 'rgba(255,255,255,.55)'; c.stroke();

function drawFoot(c, key, col, k = 1) {
  const edge = dark(col, .45), toe = (pts, w) => { c.beginPath(); c.moveTo(pts[0], pts[1]); c.quadraticCurveTo(pts[2], pts[3], pts[4], pts[5]); if (pts.length > 6) c.quadraticCurveTo(pts[6], pts[7], pts[8], pts[9]); c.lineWidth = w + 2.4; c.strokeStyle = edge; c.stroke(); c.lineWidth = w; c.strokeStyle = col; c.stroke(); };
  const claw = (x, y, dir) => { c.beginPath(); c.moveTo(x - dir * 2, y - 3.5); c.quadraticCurveTo(x + dir * 12, y - 1, x + dir * 8, y + 13); c.quadraticCurveTo(x + dir * 5, y + 5, x - dir * 3, y + 4.5); c.closePath(); paint(c, C.ink); };
  c.save(); c.scale(k, k); c.lineCap = 'round'; c.lineJoin = 'round';

    c.beginPath(); c.moveTo(-4, -4); c.lineTo(24, -1); c.quadraticCurveTo(37, 3, 35, 6); c.quadraticCurveTo(31, 4, 29, 9); c.quadraticCurveTo(25, 7, 22, 11);

  } else if (key === 'claws') {

    claw(24, 4, 1); claw(18, 9, 1); claw(-16, 5, -1);
  } else if (key === 'perch') {
    toe([0, -1, 9, -2, 16, 2, 19, 5, 18, 10], 3.6); toe([0, 1, 9, 0, 15, 4, 18, 7, 17, 12], 3.6); toe([0, 3, 8, 3, 13, 7, 15, 10, 14, 14], 3.6);
    toe([0, 0, -8, -1, -14, 3, -17, 6, -16, 11], 3.8);

// --- the bird: one plump body, everything else snaps on ------------------------------------------------------------
const PIV = [200, 284]; // where its feet touch the ground (local coordinates)
const ANK = [[190, 278], [220, 280]];
function wingLeaf(c, k, dx, dy) {
  c.save(); c.translate(dx, dy); c.scale(k, k);
  c.beginPath(); c.moveTo(8, -6); c.bezierCurveTo(-24, -30, -96, -18, -124, 38); c.bezierCurveTo(-80, 44, -26, 36, 8, 18); c.closePath();
  c.restore();
}
// o: { pal, beak:{key,p,det,gape}, foot:{key,p,det}, stub, flap, swing, blink }
function drawBird(c, o) {
  const pal = o.pal, flap = o.flap || 0, sw = o.swing || 0;
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  // legs and feet
  [[182, 232, 0], [212, 234, 1]].forEach(([hx, hy, i]) => {
    const [ax, ay] = ANK[i], a = sw * (i ? 1 : -1), dx = ax - hx, dy = ay - hy;
    const ex = hx + dx * Math.cos(a) - dy * Math.sin(a), ey = hy + dx * Math.sin(a) + dy * Math.cos(a);
    c.beginPath(); c.moveTo(hx, hy); c.lineTo(ex, ey); c.strokeStyle = dark(pal.leg, .5); c.lineWidth = 7.5; c.stroke();
    c.strokeStyle = i ? pal.leg : dark(pal.leg, .2); c.lineWidth = 4.6; c.stroke();
    c.save(); c.translate(ex, ey); c.rotate(a * .9);
    if (o.foot) {
      const f = o.foot, det = f.det || 0;
      if (f.p > 0) {
        c.globalAlpha = clamp01(f.p * 3) * (1 - det);
        c.translate(det * 30, (1 - f.p) * 44 + det * 50); c.rotate((1 - f.p) * .5 - det);
        drawFoot(c, f.key, C.gold);
      }
    } else drawFoot(c, 'stub', pal.leg);
    c.restore();
  });
  // tail
  [[-.2, pal.wing], [.2, pal.wing], [0, pal.wing2]].forEach(([ang, col]) => {
    c.save(); c.translate(122, 198); c.rotate(PI + ang);
    c.beginPath(); c.moveTo(0, -9); c.quadraticCurveTo(34, -13, 64, 0); c.quadraticCurveTo(34, 13, 0, 9); c.closePath(); paint(c, col, dark(pal.wing, .4));
    c.restore();
  });
  if (o.foot && o.foot.key === 'climb' && o.foot.p > .3) { // the stiff tail that props a woodpecker up
    c.save(); c.globalAlpha = clamp01((o.foot.p - .3) * 2) * (1 - (o.foot.det || 0));
    c.beginPath(); c.moveTo(118, 192); c.lineTo(46, 226); c.lineTo(50, 244); c.lineTo(118, 214); c.closePath(); paint(c, dark(pal.wing, .2), dark(pal.wing, .55));
    c.restore();
  }
  // beak, behind the head so its base is tucked in
  if (o.beak) {
    const b = o.beak, det = b.det || 0;
    if (b.p > 0) {
      c.save(); c.translate(288, 146); c.globalAlpha = clamp01(b.p * 3) * (1 - det);
      c.translate((1 - b.p) * 36 + det * 50, -(1 - b.p) * 44 - det * 60); c.rotate(-(1 - b.p) * .7 - det * .9);
      drawBeak(c, b.key, b.gape || 0); c.restore();
    }
  } else if (o.stub) {
    c.save(); c.translate(288, 146); c.beginPath(); c.moveTo(-6, -7); c.quadraticCurveTo(8, -6, 15, 1); c.quadraticCurveTo(8, 7, -6, 8); c.closePath();
    paint(c, '#C9D3E3', '#8FA3BF'); c.restore();
  }
  // body, neck and head: outline first, then one smooth fill
  const body = () => { c.beginPath(); c.ellipse(186, 184, 90, 62, -.08, 0, TAU); c.moveTo(294, 138); c.arc(252, 138, 42, 0, TAU); c.moveTo(274, 152); c.arc(236, 152, 38, 0, TAU); };
  body(); c.lineWidth = 3.6; c.strokeStyle = dark(pal.bot, .5); c.stroke();
  body(); c.fillStyle = lg(c, 0, 92, 0, 250, [[0, pal.top], [1, pal.bot]]); c.fill();
  c.save(); c.beginPath(); c.ellipse(186, 184, 90, 62, -.08, 0, TAU); c.clip();
  c.fillStyle = rg(c, 196, 234, 4, 80, [[0, pal.belly], [1, rgba(pal.belly, 0)]]); c.fillRect(90, 150, 220, 120);
  c.fillStyle = rg(c, 158, 138, 2, 84, [[0, 'rgba(255,255,255,.3)'], [1, 'rgba(255,255,255,0)']]); c.fillRect(90, 100, 220, 160);
  c.restore();
  if (pal.capK > .02) {
    const ch = 84 * pal.capK;
    c.save(); c.beginPath(); c.arc(252, 138, 41.4, 0, TAU); c.clip();
    c.fillStyle = lg(c, 0, 96, 0, 96 + ch + 8, [[0, pal.cap], [.85, pal.cap], [1, rgba(pal.cap, 0)]]); c.fillRect(205, 90, 100, ch + 10);
    c.restore();
  }
  // wing: three layered leaves that can flap
  c.save(); c.translate(214, 166); c.rotate(flap);
  [[1, 0, 0, pal.wing2], [.82, 4, 10, pal.wing], [.6, 12, 16, dark(pal.wing, .14)]].forEach(([k, dx, dy, col]) => {
    wingLeaf(c, k, dx, dy); paint(c, col, dark(pal.wing, .5), 1.6);
  });
  wingLeaf(c, 1, 0, 0); c.save(); c.clip();
  c.beginPath(); for (let i = 0; i < 4; i++) { c.moveTo(-60 - i * 14, 8 + i * 8); c.lineTo(-84 - i * 12, 24 + i * 6); }
  c.lineWidth = 1.3; c.strokeStyle = rgba(dark(pal.wing, .5), .55); c.stroke(); c.restore();
  c.beginPath(); c.moveTo(6, -5); c.bezierCurveTo(-24, -28, -92, -17, -118, 30); c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.28)'; c.stroke();
  c.restore();
  // eye
  const ex = 267, ey = 128;
  if ((o.blink || 0) > .5) { c.beginPath(); c.arc(ex, ey - 1, 8, .15 * PI, .85 * PI); c.lineWidth = 3; c.strokeStyle = C.ink; c.stroke(); }

    ell(c, ex - 1.4, ey - 2.4, 2.5, 2.5); paint(c, '#ffffff'); ell(c, ex + 2.6, ey + 2.6, 1.2, 1.2); paint(c, '#ffffff');
  }
  c.restore();
}

// --- tool pictures that pop up when a beak works ---------------------------------------------------------------------
function drawTool(c, key, x, y, s) {

  c.save(); c.translate(x, y); c.scale(s, s); c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.arc(0, 0, 30, 0, TAU); paint(c, 'rgba(255,255,255,.9)', 'rgba(33,41,58,.35)', 2);

    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-14, 6); c.lineTo(16, -12); c.stroke();

    ell(c, -18, 10, 4.5, 4.5); paint(c, C.gold, dark(C.gold, .4), 1.2);

    c.beginPath(); c.moveTo(-10.4, 6); c.lineTo(10.4, 6); c.lineTo(9, 22); c.lineTo(-9, 22); c.closePath(); paint(c, C.gold);
    c.beginPath(); c.moveTo(7, -24); c.lineTo(-2, 14); c.lineWidth = 5; c.strokeStyle = '#ffffff'; c.stroke();
    c.setLineDash([4, 4]); c.strokeStyle = C.gold; c.stroke(); c.setLineDash([]);
  } else if (key === 'hook') { // a hook on a ring
    ell(c, 0, -22, 4.5, 4.5); paint(c, null, '#8A97AB', 2.4);
    c.beginPath(); c.moveTo(0, -17); c.lineTo(0, 6); c.quadraticCurveTo(0, 20, -12, 19); c.quadraticCurveTo(-19, 17, -16, 9);
    c.lineWidth = 5.4; c.strokeStyle = '#8A97AB'; c.stroke(); c.lineWidth = 1.6; c.strokeStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.moveTo(-1, -15); c.lineTo(-1, 5); c.stroke();
  } else { // a kitchen sieve with drops
    c.beginPath(); c.arc(0, 0, 20, 0, PI); c.closePath(); paint(c, 'rgba(201,211,229,.95)', '#6F7F99', 2.2);
    c.save(); c.beginPath(); c.arc(0, 0, 20, 0, PI); c.clip(); c.fillStyle = 'rgba(33,41,58,.55)';
    for (let r = 0; r < 3; r++) for (let q = -3; q <= 3; q++) { c.beginPath(); c.arc(q * 5.4 + (r % 2) * 2.7, 6 + r * 5.5, 1.3, 0, TAU); c.fill(); }
    c.restore();
    c.beginPath(); c.moveTo(-22, 0); c.lineTo(22, 0); c.lineWidth = 3.6; c.strokeStyle = '#6F7F99'; c.stroke();
    c.beginPath(); c.moveTo(22, 0); c.lineTo(32, -9); c.lineWidth = 4.2; c.stroke();
    [[-8, 26], [2, 29], [10, 25]].forEach(([dx, dy]) => { ell(c, dx, dy, 1.8, 2.6); paint(c, C.pond); });
  }
  c.restore();

// --- habitats: the picture behind the bird ---------------------------------------------------------------------------
const GB = { wx: 150, wy: 300, rot: 0, s: .86 };
const HB = { meadow: GB, flowers: GB, cliff: GB, night: GB, twig: GB, pond: { wx: 150, wy: 292, rot: 0, s: .86 }, tree: { wx: 205, wy: 215, rot: -1.33, s: .78 } };
const sky = (c, a, b, h = 300) => { c.fillStyle = lg(c, 0, 0, 0, h, [[0, a], [1, b]]); c.fillRect(0, 0, VW, VH); };

// --- one frame --------------------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const sc = Math.min(w / VW, h / VH);
  c.save(); c.translate((w - VW * sc) / 2, (h - VH * sc) / 2); c.scale(sc, sc);
  c.beginPath(); c.roundRect(0, 0, VW, VH, 18); c.clip();
  const v = lab.view;
  if (v === 'beaks' && S.sec) (S.sec === 'penguin' ? penguinScene : iceScene)(c, time);
  else if (v === 'mammals') mammalScene(c, time);
  else if (v !== 'feet' || !S.free ? S[v].end : false) endScene(c, v, time);
  else birdScene(c, makeModel(time), time);

// --- controls ---------------------------------------------------------------------------------------------------------------------

};
function pick(j) {
  const v = lab.view, V = S[v];
  if (V.pick !== null) return;
  S.sec = null; V.pick = j; V.t0 = nowS(); V.shown = false;
  const tok = ++V.tok, ok = j === OK[v][V.i]; V.picks.push(ok);

  setTimeout(() => (ok ? sfx.good() : sfx.bad()), ok ? 700 : 900);
  if (!ok && v !== 'mammals') setTimeout(() => { if (V.tok === tok) sfx.snap(); }, FAIL * 1000);
  setTimeout(() => { if (V.tok === tok) { V.shown = true; render(); } }, v === 'mammals' ? 1800 : ok ? 1500 : 3400);
  render(); showStage();
}
function reset(v) { S[v] = mk(); if (v === 'feet') S.free = false; sfx.click(); }

  const v = lab.view, V = S[v], b = ev.target.closest('button'); if (!b) return;

// --- render: controls, readout and the state card ----------------------------------------------------------------------------------
function iconFor(cv) {
  const c = cv.getContext('2d'), kind = cv.dataset.k, isBeak = !!BEAKLEN[kind];
  c.clearRect(0, 0, cv.width, cv.height); c.save();
  if (isBeak) { const s = Math.min(1.9, 86 / (BEAKLEN[kind][0] + 8)); c.translate(52 - BEAKLEN[kind][0] / 2 * s, 34); c.scale(s, s); drawBeak(c, kind); }
  else { const s = 1.8; c.translate(52 - 11 * s, 36 - 4 * s); c.scale(s, s); drawFoot(c, kind, C.gold); }
  c.restore();
}

  } else {
