  const th = ctx.createRadialGradient(hx - 0.02 * U, hy + 0.05 * U, 0, hx - 0.02 * U, hy + 0.05 * U, 0.27 * U);
  th.addColorStop(0, '#4a9886'); th.addColorStop(1, 'rgba(74,152,134,0)');
  ctx.fillStyle = th; ctx.beginPath(); ctx.arc(hx - 0.02 * U, hy + 0.05 * U, 0.27 * U, 0, TAU); ctx.fill();
  const er = Math.max(1.2, 0.028 * U);
  ctx.fillStyle = '#10231f'; ctx.beginPath(); ctx.arc(hx + 0.98 * U, hy - 0.46 * U, er, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx + 0.98 * U + er * 0.3, hy - 0.46 * U - er * 0.3, er * 0.38, 0, TAU); ctx.fill();
  ctx.restore();
}

// a child (or the runner of the secret): hip joint at (hx, hy), U = leg length in pixels, feet = [{x, y}, {x, y}] in pixels
function drawHuman(ctx, o) {
  const { hx, hy, U, feet, lean, arms, run, gy } = o, sk = '#f0c49c', skD = '#d8a47c';
  const sx = hx + Math.sin(lean) * 0.58 * U, sy = hy - Math.cos(lean) * 0.58 * U;
  const arm = (th, col) => {
    const ex = sx + Math.sin(th) * 0.26 * U, ey = sy + Math.cos(th) * 0.26 * U, th2 = th + (run ? 1.3 : 0.3);
    limb(ctx, sx, sy, ex, ey, 0.085 * U, 0.07 * U, col);
    limb(ctx, ex, ey, ex + Math.sin(th2) * 0.25 * U, ey + Math.cos(th2) * 0.25 * U, 0.07 * U, 0.06 * U, col);
  };
  ctx.save();
  const sh = ctx.createRadialGradient(hx, gy + 1, 0, hx, gy + 1, 0.55 * U);
  sh.addColorStop(0, 'rgba(25,12,6,.35)'); sh.addColorStop(1, 'rgba(25,12,6,0)');
  ctx.save(); ctx.translate(0, gy + 1); ctx.scale(1, 0.12); ctx.translate(0, -(gy + 1)); ctx.fillStyle = sh; ctx.fillRect(hx - 0.6 * U, gy - 5 * U, 1.2 * U, 10 * U); ctx.restore();
  arm(arms[1], skD);
  leg(ctx, hx, hy, feet[1].x, feet[1].y, U, HCFG, '#c99870', '#dcdcd4');
  leg(ctx, hx, hy, feet[0].x, feet[0].y, U, HCFG, sk, '#f2f2ea');
  const tg = ctx.createLinearGradient(hx, sy, hx, hy); tg.addColorStop(0, '#ee7a68'); tg.addColorStop(1, '#c4503f');
  limb(ctx, hx, hy, sx, sy, 0.27 * U, 0.31 * U, tg);
  limb(ctx, hx - 0.01 * U, hy, hx + 0.03 * U, hy + 0.17 * U, 0.28 * U, 0.25 * U, '#2f4a8f');
  const hcx = sx + Math.sin(lean) * 0.2 * U, hcy = sy - Math.cos(lean) * 0.2 * U, r = 0.135 * U;
  ctx.fillStyle = sk; ctx.beginPath(); ctx.arc(hcx, hcy, r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#4a3326'; ctx.beginPath(); ctx.arc(hcx - 0.01 * U, hcy - 0.015 * U, r * 1.04, Math.PI * 0.72, Math.PI * 1.95); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a1a10'; ctx.beginPath(); ctx.arc(hcx + 0.05 * U, hcy, Math.max(1, 0.016 * U), 0, TAU); ctx.fill();
  arm(arms[0], sk);
  ctx.restore();
}

const G0 = (w, hgt, mode) => {
  const gy = Math.round(hgt * 0.5);
  const sc = mode === 'me' ? Math.min(w * 0.97 / 6.6, (gy - 14) / 1.75) : Math.min(w * 0.97 / 12.5, (gy - 14) / 4.96);
  return { w, hgt, gy, cy: gy + (hgt - gy) * 0.5, sc };
};
function drawKid(ctx, g) { // the 1.3 m child, a fixed ruler beside every dinosaur
  const h = 0.7, U = h * g.sc, hx = g.w - 0.42 * g.sc - 8, gy = g.gy + 3;
  drawHuman(ctx, { gy, hx, hy: gy - U, U, feet: [{ x: hx + 0.06 * U, y: gy }, { x: hx - 0.07 * U, y: gy }], lean: 0.03, arms: [0.08, -0.05], run: false });
  pill(ctx, T[lang].kid, hx, gy + 17, g.w, g.hgt, 'c');
}
function scaleBar(ctx, g) {
  const x = 12, y = g.hgt - 16, L = g.sc;
  ctx.save(); ctx.lineCap = 'round';
  for (const [col, wd] of [['rgba(20,10,4,.55)', 4.5], ['rgba(255,240,215,.95)', 2]]) {
    ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + L, y); ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5); ctx.moveTo(x + L, y - 5); ctx.lineTo(x + L, y + 5); ctx.stroke();
  }
  ctx.restore();
  pill(ctx, T[lang].bar, x + L + 6, y, g.w, g.hgt, 'l');
}
function drawPrintsAt(ctx, g, prints, sub, now) {
  for (const p of prints) {
    const px = p.X * g.sc;
    if (px < -40 || px > g.w + 40) continue;
    drawPrint(ctx, px, g.cy + (p.i ? 1 : -1) * sub.lat * g.sc, 0, sub.F * g.sc, sub.pk, p.born === undefined ? 1 : clamp01((now - p.born) / 0.35), MUD);
  }
}

// --- the Tracks scene (and the two secrets) -----------------------------------------------------------------------
function subjectNow() {
  if (S.sec === 'me') { const h = S.leg / 100; return { kind: 'human', h, F: 0.3 * h, lat: 0.14 * h, pk: 'human', lam: LAM_ME[S.run ? 'run' : 'walk'], ls: 0.42 }; }
  const F = S.F / 100;
  return { kind: 'dino', h: hipM(S.F), F, lat: 0.45 * F, pk: 'thero', lam: S.sp / 10, ls: 0.55 };
}
function drawTracks(ctx, w, hgt, dt) {
  const mode = S.sec === 'me' ? 'me' : 'dino', g = G0(w, hgt, mode);
  ctx.drawImage(cached('mud', w, hgt, buildMud), 0, 0, w, hgt);
  if (S.sec === 'rule') return drawRule(ctx, g);
  const sub = subjectNow(), key = `${sub.kind}|${sub.h.toFixed(3)}`;
  if (TS.key !== key) { TS.key = key; TS.d = null; TS.prints = []; TS.over = false; }
  const p = simParams(sub, sub.lam, g.sc);
  if (!TS.d) TS.d = newDino(sub.h, p);
  TS.now += dt;
  if (TS.over) {
    TS.wait += dt;
    if (TS.wait > 2.2) { TS.d = newDino(sub.h, p); TS.prints = []; TS.over = false; TS.wait = 0; }
  } else {
    stepDino(TS.d, dt, p, (X, i) => TS.prints.push({ X, i, born: TS.now }));
    if (TS.d.D > g.w / g.sc + 1.8 * sub.h) TS.over = true;
  }
  TS.prints = TS.prints.filter((q) => q.X * g.sc > -60);
  drawPrintsAt(ctx, g, TS.prints, sub, TS.now);
  if (sub.kind === 'dino') drawDino(ctx, g, TS.d, p, 1);
  else {
    const d = TS.d, U = sub.h * g.sc, ft = d.legs.map((L) => footPos(L, p));
    let cm = 0; for (const L of d.legs) if (!L.sw) cm = Math.max(cm, Math.cos(clamp((d.D - L.x) / p.Ls, -1, 1) * Math.PI / 2));
    const run = sub.lam > 2.9, hx = d.D * g.sc, hy = g.gy - U * (1 - p.bob * (1 - cm));
    const rel = (i) => clamp((ft[i].x - d.D) / Math.max(1e-3, p.Ls), -1.2, 1.2), k = run ? 1.3 : 0.8;
    if (hx > -2 * U && hx < g.w + 2 * U) {
      drawHuman(ctx, { gy: g.gy, hx, hy, U, feet: ft.map((f) => ({ x: f.x * g.sc, y: g.gy - f.y * g.sc })), lean: 0.06 + 0.22 * clamp01((sub.lam - 1.5) / 1.7), arms: [-0.7 * rel(0) * k, -0.7 * rel(1) * k], run });
    }
  }
  if (mode === 'dino') drawKid(ctx, g);
  scaleBar(ctx, g);
}
function drawRule(ctx, g) {
  const F = S.F / 100, h = 4 * F, U = h * g.sc, hx0 = g.w * 0.58, t = performance.now() / 1000;
  const p = { h, Ls: h, bob: 0.01, lift: 0 }, D = hx0 / g.sc;
  const d = { D, legs: [{ x: D + 0.05 * h, sw: false }, { x: D - 0.1 * h, sw: false }] };
  drawDino(ctx, g, d, p, 1, Math.sin(t * 1.6) * 0.004);
  // four footprints stacked from the ground to the hip
  const x0 = Math.max(26, g.w * 0.16), Fp = F * g.sc, tw = Math.max(18, Fp * 0.95), hy = g.gy - U;
  for (let k = 0; k < 4; k++) {
    const y0 = g.gy - (k + 1) * Fp;
    ctx.fillStyle = k % 2 ? 'rgba(20,16,30,.5)' : 'rgba(20,16,30,.38)'; ctx.beginPath(); ctx.roundRect(x0 - tw / 2, y0, tw, Fp, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(255,230,190,.35)'; ctx.lineWidth = 1; ctx.stroke();
    drawPrint(ctx, x0, y0 + Fp / 2, -Math.PI / 2, Fp * 0.82, 'thero', 1, { dark: '#5a3a26', mid: '#80593a', rim: 'rgba(255,230,190,.55)' });
  }
  ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(x0 + tw / 2 + 4, hy); ctx.lineTo(hx0 - 0.1 * U, hy); ctx.stroke(); ctx.restore();
  const t0 = T[lang];
  pill(ctx, `4 × ${num(S.F, 0)} ${t0.u.cm}`, x0 + tw / 2 + 8, hy - 15, g.w, g.hgt, 'l');
  drawKid(ctx, g); scaleBar(ctx, g);
}

// --- the Read scene: the frozen trackway first, the dinosaur only on the reveal -------------------------------------
function ensureRound(g, i) {
  const key = `${i}|${Math.round(g.w)}|${Math.round(g.hgt)}`;
  if (RC.key === key) return;
  RC.key = key; RD.d = null; RD.a = 0; RD.over = false;
  const r = ROUNDS[i], h = hipM(r.F), p = simParams({ h, ls: 0.55 }, r.lam, g.sc), d = newDino(h, p), prints = [];
  const Wm = g.w / g.sc, xr = Wm * 0.17;
  let snap = null;
  for (let k = 0; k < 9000 && d.D < Wm + 1.8 * h; k++) { // run the whole walk once, silently, to know where every print lands
    stepDino(d, 1 / 60, p, (X, li) => prints.push({ X, i: li }));
    if (!snap && d.D >= xr) snap = JSON.parse(JSON.stringify(d));
  }
  RC.prints = prints; RC.snap = snap; RC.p = p; RC.Wm = Wm; RC.h = h;
}
function drawRead(ctx, w, hgt, dt) {
  const g = G0(w, hgt, 'dino'), R = S.read, ri = Math.min(R.i, ROUNDS.length - 1), r = ROUNDS[ri];
  ctx.drawImage(cached('mud', w, hgt, buildMud), 0, 0, w, hgt);
  ensureRound(g, ri);
  drawPrintsAt(ctx, g, RC.prints, { F: r.F / 100, lat: 0.45 * r.F / 100, pk: 'thero' }, 0);
  if (R.state === 'reveal' && R.i < ROUNDS.length) {
    if (!RD.d) { RD.d = RC.snap ? JSON.parse(JSON.stringify(RC.snap)) : newDino(RC.h, RC.p); RD.a = 0; RD.over = false; }
    if (!RD.over) {
      RD.a += dt / 0.8; stepDino(RD.d, dt, RC.p);
      if (RD.d.D > RC.Wm + 1.8 * RC.h) RD.over = true;
      drawDino(ctx, g, RD.d, RC.p, easeOut(RD.a));
    }
  }
  drawKid(ctx, g); scaleBar(ctx, g);
}

// --- the Story scene: a rock surface seen from above -------------------------------------------------------------------
const SAGE = ['#a6c996', '#6c9a60', '#3f6a3b'], RUST = ['#e8946a', '#bd6240', '#7a3b24'], AMBER = ['#f4cb78', '#d49a3a', '#8f6420'];
function lay(pts, stepFn, F, kind, lat, s0) {
  const seg = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1], l = Math.hypot(dx, dy);
    seg.push({ x0: pts[i - 1][0], y0: pts[i - 1][1], dx, dy, l, s0: tot }); tot += l;
  }
  const at = (s) => {
    s = clamp(s, 0, tot); let k = seg.findIndex((q) => s <= q.s0 + q.l); if (k < 0) k = seg.length - 1;
    const q = seg[k], f = q.l ? (s - q.s0) / q.l : 0;
    return { x: q.x0 + q.dx * f, y: q.y0 + q.dy * f, a: Math.atan2(q.dy, q.dx) };
  };
  const prints = []; let s = s0 || 0, i = 0;
  while (s <= tot) {
    const c = at(s), side = i % 2 ? 1 : -1;
    prints.push({ s, x: c.x - Math.sin(c.a) * side * lat, y: c.y + Math.cos(c.a) * side * lat, a: c.a, kind, F });
    s += stepFn(s); i++;
  }
  return { prints, tot, at };
}
const headS = (tr, u) => { // where the animal is, in path length, after u footfalls
  const P = tr.prints, n = P.length;
  if (u <= 0) return P[0].s + u * (P[1].s - P[0].s);
  if (u >= n - 1) return P[n - 1].s + (u - (n - 1)) * (P[n - 1].s - P[n - 2].s);
  const k = Math.floor(u); return lerp(P[k].s, P[k + 1].s, u - k);
};
const STORY_BUILT = [];
function storyRound(i) {
  if (STORY_BUILT[i]) return STORY_BUILT[i];
  let R;
  if (i === 0) { // a herd: four sauropod trackways side by side
    const ys = [13, 33, 53, 73], sl = [3, 0, -2, 4];
    const tracks = ys.map((y, k) => {
      const tr = lay([[-14, y - sl[k]], [114, y + sl[k]]], () => 18, 8, 'sauro', 3.4, (k * 4.5) % 18);
      tr.dino = { kind: 'sauro', L: 26, pal: SAGE, ph: k * 1.7 }; return tr;
    });
    R = { tracks, extras: [], tau: 0.9 };
  } else if (i === 1) { // one theropod: the prints are the same size, then suddenly far apart
    const tr = lay([[-8, 56], [18, 52], [44, 50], [70, 46], [114, 38]], (s) => (s < 46 ? 7.5 : s < 58 ? 15 : 23), 3.4, 'thero', 1.4, 0);
    tr.dino = { kind: 'thero', L: 13, pal: RUST, ph: 0 };
    R = { tracks: [tr], extras: [], tau: 0.5 };
  } else { // a small one comes to the edge of a big footprint-filled area and goes back
    const pts = [[-8, 36], [46, 39]];
    for (let k = 1; k <= 12; k++) { const th = -Math.PI / 2 + Math.PI * k / 12; pts.push([46 + 7.5 * Math.cos(th), 46.5 + 7.5 * Math.sin(th)]); }
    pts.push([-8, 56]);
    const tr = lay(pts, () => 4.6, 2.6, 'thero', 1, 0);
    tr.dino = { kind: 'thero', L: 9, pal: AMBER, ph: 0 };
    const rnd = rng(23), extras = [];
    for (const x of [64, 76, 88, 97]) for (const y of [12, 24, 36, 48, 60, 71]) {
      if (rnd() < 0.12) continue;
      extras.push({ x: x + (rnd() - 0.5) * 5, y: y + (rnd() - 0.5) * 5, a: rnd() * TAU, F: 8 + rnd() * 2, kind: 'thero' });
    }
    R = { tracks: [tr], extras, tau: 0.3, patch: { x: 80, y: 41, rx: 26, ry: 38 } };
  }
  R.dur = Math.max(...R.tracks.map((t) => t.prints.length)) * R.tau + 3;
  STORY_BUILT[i] = R;
  return R;
}
function topDino(ctx, x, y, a, L, kind, pal, t, ph) {
  const sw = Math.sin(t * 3 + ph) * 0.04 * L, sauro = kind === 'sauro';
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0.04 * L, 0.06 * L, 0.36 * L, 0.2 * L, 0, 0, TAU); ctx.fill();
  const gg = ctx.createRadialGradient(-0.04 * L, -0.07 * L, 0.02 * L, 0, 0, 0.32 * L);
  gg.addColorStop(0, pal[0]); gg.addColorStop(1, pal[1]);
  ctx.fillStyle = pal[2];
  for (const [lx, ly] of [[0.13, -0.15], [0.13, 0.15], [-0.13, -0.15], [-0.13, 0.15]]) { ctx.beginPath(); ctx.ellipse(lx * L, ly * L, 0.06 * L, 0.045 * L, 0, 0, TAU); ctx.fill(); }
  ctx.fillStyle = gg; ctx.strokeStyle = pal[2]; ctx.lineWidth = Math.max(1, L * 0.02);
  const tl = (sauro ? 0.62 : 0.56) * L;
  ctx.beginPath(); ctx.moveTo(-0.2 * L, -0.09 * L); ctx.quadraticCurveTo(-0.45 * L, -0.04 * L + sw, -tl, sw * 1.6);
  ctx.quadraticCurveTo(-0.45 * L, 0.04 * L + sw, -0.2 * L, 0.09 * L); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, 0.28 * L, 0.18 * L, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = pal[1]; ctx.lineWidth = L * (sauro ? 0.09 : 0.1);
  ctx.beginPath(); ctx.moveTo(0.2 * L, 0); ctx.quadraticCurveTo(0.38 * L, -sw, (sauro ? 0.56 : 0.46) * L, -sw * 1.6); ctx.stroke();
  const hxp = (sauro ? 0.6 : 0.52) * L;
  ctx.fillStyle = pal[0]; ctx.strokeStyle = pal[2]; ctx.lineWidth = Math.max(1, L * 0.015);
  ctx.beginPath(); ctx.ellipse(hxp, -sw * 1.6, (sauro ? 0.07 : 0.09) * L, (sauro ? 0.05 : 0.06) * L, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1a120c';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(hxp + 0.01 * L, -sw * 1.6 + s * 0.03 * L, Math.max(0.8, 0.012 * L), 0, TAU); ctx.fill(); }
  ctx.restore();
}
function drawStory(ctx, w, hgt, dt, t) {
  ctx.drawImage(cached('rock', w, hgt, buildRock), 0, 0, w, hgt);
  const st = S.story, R = storyRound(Math.min(st.i, 2));
  const u = Math.min(w / 100, hgt / 80), ox = (w - 100 * u) / 2, oy = (hgt - 80 * u) / 2;
  if (st.anim) st.anim.t += dt;
  const tt = st.anim ? st.anim.t : 0, uu = tt / R.tau - 1;
  if (R.patch) {
    const q = R.patch; ctx.save(); ctx.translate(ox + q.x * u, oy + q.y * u); ctx.scale(1, q.ry / q.rx);
    const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, q.rx * u);
    rg.addColorStop(0, 'rgba(30,26,18,.3)'); rg.addColorStop(0.75, 'rgba(30,26,18,.16)'); rg.addColorStop(1, 'rgba(30,26,18,0)');
    ctx.fillStyle = rg; ctx.fillRect(-q.rx * u, -q.rx * u, q.rx * u * 2, q.rx * u * 2); ctx.restore();
  }
  for (const e of R.extras) drawPrint(ctx, ox + e.x * u, oy + e.y * u, e.a, e.F * u, e.kind, 1, ROCK);
  for (const tr of R.tracks) {
    for (let k = 0; k < tr.prints.length; k++) {
      const p = tr.prints[k]; let age = 1;
      if (st.anim) { if (uu < k) continue; age = clamp01((uu - k) * R.tau / 0.3); }
      drawPrint(ctx, ox + p.x * u, oy + p.y * u, p.a, p.F * u, p.kind, age, ROCK);
    }
  }
  if (st.anim && tt < R.dur) {
    for (const tr of R.tracks) {
      const hs = headS(tr, uu), c = tr.at(hs), D = tr.dino;
      ctx.save(); ctx.globalAlpha = clamp01((Math.min(hs, tr.tot - hs) + 0.3 * D.L) / (0.6 * D.L)); // fade in and out at the ends of the path
      topDino(ctx, ox + c.x * u, oy + c.y * u, c.a, D.L * u, D.kind, D.pal, t, D.ph);
      ctx.restore();
    }
  }
}

};
const gridOf = (t, F, m) => {
  const cells = [[t.cell.foot, `${num(F, 0)} ${t.u.cm}`], [t.cell.hips, `${num(m.h, 2)} ${t.u.m}`], [t.cell.stride, `${num(m.S, 1)} ${t.u.m}`],
    [t.cell.rel, num(m.lam, 1)], [t.cell.gait, t.gait[m.gait]], [t.cell.speed, `${num(m.kmh, 1)} ${t.u.kmh}`]];
  return `<div class="dt-grid">${cells.map(([k, v]) => `<div class="dt-cell"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`;
};
const fact = (emo, text, key) => ({ emo, text, src: URLS[key] });

$('inF').addEventListener('input', (ev) => { S.F = +ev.target.value; render(); });
$('inS').addEventListener('input', (ev) => { S.sp = +ev.target.value; render(); });
$('inL').addEventListener('input', (ev) => { S.leg = +ev.target.value; render(); });

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, R = S.read, st = S.story;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  } else if (act === 'me') { S.run = b.dataset.k === 'run'; sfx.click(); }
  else if (act === 'pick') { if (R.state !== 'predict') return; R[b.dataset.g] = b.dataset.k; sfx.tick(); }
  else if (act === 'go') {
    if (R.state !== 'predict' || !R.sz || !R.gt) return;
    const ri = roundInfo(R.i), ok = R.sz === (ri.big ? 'big' : 'small') && R.gt === (ri.gait === 'run' ? 'run' : 'walk');
    R.res[R.i] = ok; R.state = 'reveal'; RD.d = null; (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next') {
    R.i++; R.sz = null; R.gt = null; R.state = 'predict'; RD.d = null; sfx.click();
  } else if (act === 'again') { S.read = { i: 0, sz: null, gt: null, state: 'predict', res: [] }; RD.d = null; sfx.click(); }
  else if (act === 'spick') {
    if (st.pick !== null) return;
    const j = +b.dataset.j, ok = j === T[lang].st.rounds[st.i].ok;
    st.pick = j; st.res[st.i] = ok; st.anim = { t: 0 }; (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'snext') { st.i++; st.pick = null; st.anim = null; sfx.click(); }
  else if (act === 'sagain') { S.story = { i: 0, pick: null, anim: null, res: [] }; sfx.click(); }
  render();
});

// --- one render per change ----------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('vTracks').hidden = v !== 'tracks'; $('vRead').hidden = v !== 'read'; $('vStory').hidden = v !== 'story';
  if (v === 'tracks') renderTracks(t); else if (v === 'read') renderRead(t); else renderStory(t);
}

function renderTracks(t) {
  const sec = S.sec, open = secret.unlocked();
  lab.setGlow('rgba(214, 150, 90, .26)');
  $('rowF').hidden = sec === 'me'; $('rowSp').hidden = sec === 'me' || sec === 'rule'; $('rowLeg').hidden = sec !== 'me';
  $('lbF').textContent = t.foot; $('lbS').textContent = t.speed; $('lbL').textContent = t.sec.me.leg;
  $('eW').textContent = t.walkEnd; $('eR').textContent = t.runEnd;
  if (+$('inF').value !== S.F) $('inF').value = S.F;
  if (+$('inS').value !== S.sp) $('inS').value = S.sp;
  if (+$('inL').value !== S.leg) $('inL').value = S.leg;
  $('vF').textContent = `${S.F} ${t.u.cm}`; $('vL').textContent = `${S.leg} ${t.u.cm}`;
  $('vS').textContent = t.gait[gaitOf(S.sp / 10)];
  $('meChips').innerHTML = ['walk', 'run'].map((k) => `<button class="chip dt-c ${(S.run ? 'run' : 'walk') === k ? 'on' : ''}" data-act="me" data-k="${k}">${esc(t.sec.me[k])}</button>`).join('');
  $('secChips').innerHTML = [['me', '🏃'], ['rule', '📏']].map(([k, e]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.sec[k].name)}` : '🔒 ???'}</button>`).join('');
  const f = [fact('🌍', t.facts.tracks, 'tracks')];
  if (sec === 'rule') {
    const H = 4 * S.F;
    lab.setReadout(`${S.F} ${t.u.cm} × 4`, `= ${H} ${t.u.cm}`, t.sec.rule.pill, '#c9a77a');
    lab.setState({ emo: '📏', title: t.sec.rule.title(S.F, H), lead: t.sec.rule.lead, body: t.sec.rule.body, extra: '' });
  } else if (sec === 'me') {
    const g = S.run ? 'run' : 'walk', m = info(S.leg / 100, LAM_ME[g]);
    lab.setReadout(`${num(m.kmh, 1)} ${t.u.kmh}`, `${t.cell.stride} ${num(m.S, 1)} ${t.u.m}`, t.gait[m.gait], GCOL[m.gait]);
    lab.setState({ emo: GEMO[m.gait], title: t.sec.me.title(m.gait, num(m.S, 1)), lead: t.sec.me.lead(S.leg, num(m.lam, 1), t.gl[m.gait]), body: t.sec.me.body, extra: '' });
  } else {
    const m = info(hipM(S.F), S.sp / 10);
    lab.setReadout(`${num(m.kmh, 1)} ${t.u.kmh}`, `${t.cell.stride} ${num(m.S, 1)} ${t.u.m}`, t.gait[m.gait], GCOL[m.gait]);
    lab.setState({ emo: GEMO[m.gait], title: t.gait[m.gait], lead: t.tr.lead(num(m.S, 1), num(m.lam, 1)), body: t.tr.body,
      extra: `${gridOf(t, S.F, m)}<div class="dt-fine">${esc(t.tr.fine)}</div>` });
  }
  lab.setFacts(f);
}

function renderRead(t) {
  const R = S.read, n = ROUNDS.length, rd = t.rd, k = R.res.filter(Boolean).length;
  lab.setGlow('rgba(224, 176, 80, .22)');
  const box = $('vRead');
  if (R.i >= n) {
    box.innerHTML = `<div class="row2" style="margin-top:0"><button class="btn" data-act="again">${esc(rd.again)}</button></div>`;
    lab.setReadout(`${k}/${n}`, '', '', '#e0b050');
    lab.setState({ emo: '🏆', title: rd.endTitle(k, n), lead: rd.endLead, body: '', extra: '' });
    lab.setFacts([fact('🦖', t.facts.read, 'read')]);
    return;
  }
  const ri = roundInfo(R.i), rev = R.state === 'reveal';
  const chip = (grp, key, label) => {
    const on = R[grp] === key; let cls = `chip dt-c${on ? ' on' : ''}`;
    if (rev) {
      const right = grp === 'sz' ? key === (ri.big ? 'big' : 'small') : key === (ri.gait === 'run' ? 'run' : 'walk');
      if (right) cls += ' ok'; else if (on) cls += ' no';
    }
    return `<button class="${cls}" data-act="pick" data-g="${grp}" data-k="${key}"${rev ? ' disabled' : ''}>${esc(label)}</button>`;
  };
  const last = R.i === n - 1;
  box.innerHTML = `<div class="dt-q">${esc(rd.q)}</div>
    <div class="dt-pair"><span class="lbl">${esc(rd.size)}</span><div class="chips">${chip('sz', 'small', rd.small)}${chip('sz', 'big', rd.big)}</div></div>
    <div class="dt-pair"><span class="lbl">${esc(rd.move)}</span><div class="chips">${chip('gt', 'walk', rd.walk)}${chip('gt', 'run', rd.run)}</div></div>
    <div class="dt-go">${rev ? `<button class="btn" data-act="next">${esc(last ? rd.fin : rd.next)}</button>`
      : `<button class="btn" data-act="go"${R.sz && R.gt ? '' : ' disabled'}>${esc(rd.go)}</button>`}</div>`;
  const soft = R.res.length ? `<div class="dt-soft">${esc(rd.soft(k, R.res.length))}</div>` : '';
  if (!rev) {
    lab.setReadout('?', rd.round(R.i + 1, n), '', '#e0b050');
    lab.setState({ emo: '🔎', title: rd.q, lead: rd.lead, body: '', extra: soft });
    lab.setFacts([]);
  } else {
    const ok = R.res[R.i], szOk = R.sz === (ri.big ? 'big' : 'small'), mvOk = R.gt === (ri.gait === 'run' ? 'run' : 'walk');
    lab.setReadout(`${num(ri.kmh, 1)} ${t.u.kmh}`, `${t.cell.stride} ${num(ri.S, 1)} ${t.u.m}`, t.gait[ri.gait], GCOL[ri.gait]);
    const lead = ok ? rd.sum(ri.F, num(ri.h, 2), num(ri.S, 1), num(ri.kmh, 1))
      : `${szOk ? rd.szOk : rd.szNo(ri.big, ri.F)} ${mvOk ? rd.mvOk : rd.mvNo(t.gl[ri.gait], num(ri.lam, 1))}`;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? rd.right : rd.not, lead, body: ok ? '' : rd.sum(ri.F, num(ri.h, 2), num(ri.S, 1), num(ri.kmh, 1)),
      extra: `${gridOf(t, ri.F, ri)}${soft}` });
    lab.setFacts([fact('🦖', t.facts.read, 'read')]);
  }
}

function renderStory(t) {
  const st = S.story, s = t.st, n = 3, k = st.res.filter(Boolean).length, box = $('vStory');
  lab.setGlow('rgba(160, 150, 126, .24)');
  if (st.i >= n) {
    box.innerHTML = `<div class="row2" style="margin-top:0"><button class="btn" data-act="sagain">${esc(s.again)}</button></div>`;
    lab.setReadout(`${k}/${n}`, '', '', '#a8a08a');
    lab.setState({ emo: '🏆', title: s.endTitle(k, n), lead: s.endLead, body: '', extra: '' });
    lab.setFacts([fact('🪨', t.facts.lark, 'lark'), fact('🔤', t.facts.ichno, 'ichno')]);
    return;
  }
  const rd = s.rounds[st.i], done = st.pick !== null, last = st.i === n - 1;
  box.innerHTML = `<div class="dt-q">${esc(s.q)}</div><div class="dt-opts">${rd.opts.map((o, j) => {
    let cls = 'dt-opt';
    if (done) cls += j === rd.ok ? ' ok' : j === st.pick ? ' no' : ' dim';
    return `<button class="${cls}" data-act="spick" data-j="${j}"${done ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('')}</div>${done ? `<div class="dt-go"><button class="btn" data-act="snext">${esc(last ? s.fin : s.next)}</button></div>` : ''}`;
  const soft = st.res.length ? `<div class="dt-soft">${esc(s.soft(k, st.res.length))}</div>` : '';
  lab.setReadout(`${st.i + 1}/${n}`, s.round(st.i + 1, n), '', '#a8a08a');
  if (!done) lab.setState({ emo: '📖', title: s.q, lead: s.lead, body: '', extra: soft });
  else {
    const ok = st.pick === rd.ok;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? s.right : s.not, lead: rd.ex, body: '', extra: soft });
  }
  lab.setFacts([fact('🪨', t.facts.lark, 'lark'), fact('🔤', t.facts.ichno, 'ichno')]);
}

render();
canvasLoop($('cv'), (ctx, w, hgt, dt, tm) => {
  const v = lab.view;
  if (v === 'story') drawStory(ctx, w, hgt, dt, tm); else if (v === 'read') drawRead(ctx, w, hgt, dt); else drawTracks(ctx, w, hgt, dt);
});
</script>
</body>
</html>
