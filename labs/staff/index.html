         hint: 'Нажимай клавиши: ноты появятся на стане.' },

// --- music: a pitch is a "diatonic number" d = octave * 7 + letter (C = 0), so C4 = 28 and every step up the ladder is +1 ---------
const LET = 'CDEFGAB', SEMI = [0, 2, 4, 5, 7, 9, 11];
const dn = (l, o = 4) => o * 7 + LET.indexOf(l);
const letterOf = (d) => ((d % 7) + 7) % 7;
const freqOf = (d) => 440 * 2 ** ((12 * (Math.floor(d / 7) + 1) + SEMI[letterOf(d)] - 69) / 12); // equal temperament, A4 = 440
const COL = ['#FF6B6B', '#FF9F5A', '#FFC94A', '#5BD38A', '#4CC3B5', '#5B8DEF', '#9B7BE0']; // C D E F G A B, the octave repeats them
const colOf = (d) => COL[letterOf(d)];
const tune = (s, o = 4) => s.split(' ').map((l) => dn(l, o));
const MARY = tune('E D C D E E E D D D E G G E D C D E E E E D D E D C'), MARY_BARS = new Set([7, 10, 13]);
const ODE = tune('E E F G G F E D C C D E E D D'), ODE_BARS = new Set([4, 8, 12]), ND = 0.55; // seconds per note
const HR = [
  { notes: [dn('C'), dn('G')], ans: 'right' },
  { notes: [dn('E', 5), dn('A')], ans: 'left' },
  { notes: [dn('D', 5), dn('D', 5)], ans: 'same' },
  { notes: tune('C C G G A A G'), ans: 'up', tune: true },
];
const NR = [ // name quiz: the note and the three letters on the buttons
  { d: dn('E'), o: [4, 2, 0] }, { d: dn('G'), o: [2, 6, 4] }, { d: dn('A'), o: [5, 3, 0] },
  { d: dn('C', 5), o: [5, 2, 0] }, { d: dn('F', 5), o: [1, 3, 5] }, { d: dn('C'), o: [2, 0, 1] },
];

// --- sound: a tiny synth, no files. Muted by the shell's sound switch; the context is made on the first tap ----------------
let AC = null, master = null;
function actx() {
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.85; master.connect(AC.destination); }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch { return null; }
}
['pointerdown', 'pointerup', 'click'].forEach((e) => addEventListener(e, () => actx(), { passive: true }));
function playTone(f, hold = 0.35) {
  if (!store.get('sound', false)) return;
  const x = actx(); if (!x) return;
  const t = x.currentTime, g = x.createGain(), peak = 0.22, rel = t + 0.128 + Math.max(0, hold - 0.128);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.008);               // attack 8 ms
  g.gain.linearRampToValueAtTime(peak * 0.6, t + 0.128);          // decay to 0.6 over 120 ms
  g.gain.setValueAtTime(peak * 0.6, rel);
  g.gain.exponentialRampToValueAtTime(0.0001, rel + 0.4);         // release 400 ms
  const o1 = x.createOscillator(), o2 = x.createOscillator(), g2 = x.createGain();
  o1.type = o2.type = 'sine'; o1.frequency.value = f; o2.frequency.value = f * 2; g2.gain.value = 0.15;
  o1.connect(g); o2.connect(g2).connect(g); g.connect(master);
  o1.start(t); o2.start(t); o1.stop(rel + 0.45); o2.stop(rel + 0.45);
}

// --- small helpers ------------------------------------------------------------------------------------------
const INK = '#2B2140', NAVY = '#1E2547', GREEN = '#2BB673', TAU = Math.PI * 2;
const nowS = () => performance.now() / 1000;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
const easeOut = (t) => 1 - (1 - t) ** 3;
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2; };
const rgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, k) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };
const shade = (hex, k) => mix(hex, '#1A1030', k), tint = (hex, k) => mix(hex, '#FFFFFF', k);
const rgba = (hex, a) => { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; };
let timers = [];
const later = (ms, fn) => { timers.push(setTimeout(fn, ms)); };
const stopTimers = () => { timers.forEach(clearTimeout); timers = []; };
// a note on the staff: the shared "it was played" effect (a hop, a ring, a name pill) and the sound
function hit(nt, hold = 0.4) { const t = nowS(); nt.hopT = t; nt.ringT = t; nt.pillUntil = t + 1.8; playTone(freqOf(nt.d), hold); }
const mk = (d) => ({ d, hopT: -9, ringT: -9, pillUntil: 0 });

  pl: { idx: 0, notes: MARY.map(mk), shakeT: -9, doneT: -9, comp: false, song: [], cur: -1, scroll: 0, pb: false },
  ode: { notes: ODE.map(mk), t0: -1, on: false, scroll: 0 },
  bass: { bear: [dn('C', 3), dn('E', 3), dn('G', 3)].map(mk), bird: [dn('C', 6), dn('E', 6)].map(mk), bearT: -9, birdT: -9 },
};
let GEO = null, SZ = { w: 0, h: 0 };
const loadRound = () => { const H = S.hi; H.guess = null; H.notes = HR[H.i].notes.map(mk); H.bug.tgt = 30; };

// --- layout: paper, one staff (or two) ---------------------------------------------------------------------
const Y = (G, st, d) => st.bottom - (d - st.base) * G.sp / 2;
function layoutOne(w, h, { need, cap, shift }) {
  const m = w < 460 ? 6 : 10, px = m, py = m, pw = w - 2 * m, ph = h - 2 * m;

  const cur = O.on || u > 0 ? Math.min(i, n - 1) : -1;
  const m = melody(c, G, O.notes, { scroll: O.scroll, cur, time, dimPast: true, bars: ODE_BARS, end: true });
  const A = m.pos[i], B = m.pos[j], e = easeInOut(fr), pa = Math.min(1, fr);
  ball(c, lerp(A.x, B.x, pa), lerp(A.y, B.y, e) - sp * 0.85 - Math.sin(Math.PI * fr) * sp * 0.9, sp);
}

// --- secret: the bear (low notes, bass clef) and the bird (high notes on ledger lines) --------------------------
function drawBass(c, time) {
  const B = S.bass, G = layoutTwo(SZ.w, SZ.h), sp = G.sp, zw = G.x1 - G.zoneL; GEO = G;
  paper(c, G); staff(c, G, G.tr); staff(c, G, G.ba);
  c.save(); c.strokeStyle = INK; c.lineWidth = 2.2; c.lineCap = 'round'; // a bar joining the two staves
  c.beginPath(); c.moveTo(G.x0, Y(G, G.tr, 38)); c.lineTo(G.x0, Y(G, G.ba, 18)); c.stroke(); c.restore();
  B.bird.forEach((nt, i) => { const x = G.zoneL + zw * (0.14 + 0.28 * i), y = note(c, G, G.tr, nt, x, time); if (time < nt.pillUntil) pill(c, noteName(nt.d), x, y - 1.9 * sp, colOf(nt.d)); });
  B.bear.forEach((nt, i) => { const x = G.zoneL + zw * (0.08 + 0.25 * i), y = note(c, G, G.ba, nt, x, time); if (time < nt.pillUntil) pill(c, noteName(nt.d), x, y - 1.9 * sp, colOf(nt.d)); });
  const animal = (ch, x, y, t0) => {
    const u = (time - t0) / 0.45, sq = u >= 0 && u < 1 ? 1 + 0.18 * Math.sin(Math.PI * u) : 1, hop = u >= 0 && u < 1 ? Math.sin(Math.PI * u) * sp * 0.4 : 0;
    c.save(); c.fillStyle = 'rgba(255,248,234,.95)'; c.beginPath(); c.arc(x, y, Math.max(0, sp * 1.15), 0, TAU); c.fill();
    c.lineWidth = 1.5; c.strokeStyle = 'rgba(43,33,64,.25)'; c.stroke(); c.restore();
    emoji(c, ch, x, y - hop, Math.max(26, sp * 1.5), 0, sq);
  };
  animal('🐦', G.x1 - sp * 0.9, Y(G, G.tr, 41), B.birdT);
  animal('🐻', G.x1 - sp * 0.9, Y(G, G.ba, 22), B.bearT);
}

// --- the canvas loop ------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  SZ = { w, h }; c.lineJoin = 'round';
  backdrop(c, w, h);
  const v = lab.view;
  if (v === 'high') { if (S.sec === 'bass') drawBass(c, time); else if (S.sec === 'ode') drawOde(c, time, dt); else drawHigh(c, time, dt); }
  else if (v === 'names') drawNames(c, time);
  else drawPlay(c, time, dt);
});

// --- logic: view 1 ------------------------------------------------------------------------------------------
const showStage = () => { // on a phone the controls sit below the stage: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const hitH = (nt) => { hit(nt, 0.4); S.hi.bug.tgt = nt.d; };
function hAnswer(g) {
  const H = S.hi, R = HR[H.i]; if (H.guess !== null) return;
  H.guess = g; H.t0 = nowS(); H.res[H.i] = g === R.ans; H.seen = true;
  stopTimers();
  if (R.tune) H.notes.forEach((nt, i) => later(150 + i * TD * 1000, () => hitH(nt)));
  else { later(150, () => hitH(H.notes[0])); later(1000, () => hitH(H.notes[1])); }
  render(); showStage();
}
function hNext() { const H = S.hi; stopTimers(); if (H.i >= HR.length - 1) { H.ended = true; return; } H.i++; loadRound(); }
function hAgain() { const H = S.hi; stopTimers(); H.i = 0; H.res = []; H.ended = false; loadRound(); }

// --- logic: view 2 --------------------------------------------------------------------------------------------
function loadQ() { const N = S.nm; N.guess = null; N.target = mk(NR[N.qi].d); }
function startQuiz() { const N = S.nm; N.quiz = true; N.qi = 0; N.res = []; N.ended = false; N.placed = []; N.flash = null; loadQ(); }
function toExplore() { const N = S.nm; N.quiz = false; N.ended = false; N.target = null; N.placed = []; }
function nAnswer(letter) {
  const N = S.nm; if (N.guess !== null) return;
  N.guess = letter; N.res[N.qi] = letter === letterOf(NR[N.qi].d); N.seen = true;
  hit(N.target, 0.7); N.target.pillUntil = 1e9;
  render(); showStage();
}
function nNext() { const N = S.nm; N.qi++; if (N.qi >= NR.length) { N.ended = true; N.target = null; } else loadQ(); }
$('cv').addEventListener('pointerdown', (ev) => {
  const N = S.nm;
  if (lab.view !== 'names' || N.quiz || !GEO) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, G = GEO, sp = G.sp;
  if (x < G.zoneL - sp * 0.8 || x > G.x1 + 14) return;
  const d = 30 + Math.round((G.st.bottom - y) / (sp / 2));
  if (d < 28 || d > 39) return;
  const rx = 0.66 * sp, nt = mk(d); nt.x = clamp(x, G.zoneL + rx + 2, G.x1 - rx - 2);
  N.placed.forEach((p) => { p.pillUntil = 0; }); N.placed.push(nt); if (N.placed.length > 5) N.placed.shift();
  hit(nt, 0.6); nt.pillUntil = 1e9; N.flash = { d, t: nowS() }; N.taps++; N.last = d;
  render();
});

// --- logic: view 3 --------------------------------------------------------------------------------------------
const WHITE = [28, 29, 30, 31, 32, 33, 34, 35], BLACK = [[28, 0], [29, 1], [31, 3], [32, 4], [33, 5]]; // [lower white key, its index]
$('kb').innerHTML = WHITE.map((d) => `<button class="wk" data-d="${d}" style="--c:${colOf(d)}"><i></i><span></span></button>`).join('')
  + BLACK.map(([d, i]) => `<button class="bk" data-d="${d}" data-s="1" style="left:calc(${(i + 1) * 12.5}% - 3.6%)" aria-label="♯"></button>`).join('');
function press(d, sharp, el) {
  const f = freqOf(d) * (sharp ? 2 ** (1 / 12) : 1);
  playTone(f, 0.5);
  el.classList.add('down'); setTimeout(() => el.classList.remove('down'), 150);
  if (lab.view !== 'play') return;
  const P = S.pl, t = nowS();
  if (P.comp) { if (!sharp) { const nt = mk(d); nt.hopT = nt.ringT = t; P.song.push(nt); if (P.song.length > 60) P.song.shift(); render(); } return; }
  if (P.idx >= P.notes.length) return;
  if (!sharp && d === P.notes[P.idx].d) {
    const nt = P.notes[P.idx]; nt.hopT = nt.ringT = t; P.idx++;
    if (P.idx >= P.notes.length) P.doneT = t + 0.25;
    render();
  } else { P.shakeT = t; el.classList.add('bad'); setTimeout(() => el.classList.remove('bad'), 320); }
}
$('kb').addEventListener('pointerdown', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  ev.preventDefault(); press(+b.dataset.d, !!b.dataset.s, b);
});
$('kb').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b && ev.detail === 0) press(+b.dataset.d, !!b.dataset.s, b); }); // keyboard users
function playback() {
  const P = S.pl; if (!P.song.length || P.pb) return;
  stopTimers(); P.pb = true;
  P.song.forEach((nt, i) => later(i * 450, () => { P.cur = i; hit(nt, 0.4); }));
  later(P.song.length * 450 + 150, () => { P.pb = false; P.cur = -1; render(); });
  render();
}
function startOde() {
  const O = S.ode; stopTimers(); O.on = true; O.t0 = nowS() + 0.25;
  O.notes.forEach((nt, i) => later(250 + i * ND * 1000, () => hit(nt, ND * 0.95)));
  later(250 + O.notes.length * ND * 1000 + 300, () => { O.on = false; render(); });
  render(); showStage();
}

// --- controls ---------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, H = S.hi, N = S.nm, P = S.pl;
  if (a === 'snd') { $('sound').click(); return; }
  else if (a === 'hans') hAnswer(b.dataset.g);
  else if (a === 'hnext') hNext();
  else if (a === 'hagain') hAgain();
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    stopTimers(); S.ode.on = false; S.ode.t0 = -1; S.ode.scroll = 0;
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k;
  }
  else if (a === 'animal') { const B = S.bass, nt = (b.dataset.k === 'bear' ? B.bear : B.bird)[+b.dataset.i]; hit(nt, 0.7); if (b.dataset.k === 'bear') B.bearT = nowS(); else B.birdT = nowS(); }
  else if (a === 'odeplay') startOde();
  else if (a === 'ntest') startQuiz();
  else if (a === 'nexplore') toExplore();
  else if (a === 'nans') nAnswer(+b.dataset.l);
  else if (a === 'nnext') nNext();
  else if (a === 'compose') { stopTimers(); P.pb = false; P.cur = -1; P.comp = !P.comp; P.scroll = 0; }
  else if (a === 'playback') playback();
  else if (a === 'clear') { stopTimers(); P.song = []; P.pb = false; P.cur = -1; P.scroll = 0; }
  else if (a === 'pagain') { P.idx = 0; P.scroll = 0; P.doneT = -9; P.notes = MARY.map(mk); }
  render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v + (v === 'high' && S.sec ? '-' + S.sec : '');
  $('snd').hidden = store.get('sound', false);
  $('snd').textContent = t.snd;
  $('secHigh').style.display = v === 'high' ? '' : 'none';
  $('secNames').style.display = v === 'names' ? '' : 'none';
  $('secPlay').style.display = v === 'play' ? '' : 'none';
  if (v === 'high') renderHigh(t); else if (v === 'names') renderNames(t); else renderPlay(t);
}
const card = (a, extra = true) => lab.setState({ emo: a[0], title: a[1], lead: a[2], body: a[3], extra: extra ? `<div class="fine">${esc(T[lang].fine)}</div>` : '' });

function renderHigh(t) {
  const H = S.hi, R = HR[H.i], k = H.res.filter(Boolean).length, open = secret.unlocked();
  lab.setGlow('rgba(91, 141, 239, .26)');
  const sc = (key, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-act="sec" data-k="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('bass', '🐻') + sc('ode', '🎶');
  if (S.sec) {
    const key = S.sec;
    if (key === 'bass') {
      const B = S.bass, nm = (d) => esc(noteName(d));
      $('hBody').innerHTML = `<div class="abs">${B.bear.map((nt, i) => `<button class="ab" data-act="animal" data-k="bear" data-i="${i}">🐻 ${nm(nt.d)}</button>`).join('')}
        ${B.bird.map((nt, i) => `<button class="ab" data-act="animal" data-k="bird" data-i="${i}">🐦 ${nm(nt.d)}</button>`).join('')}</div>`;
    } else {
      $('hBody').innerHTML = `<div class="abs"><button class="btn" data-act="odeplay"${S.ode.on ? ' disabled' : ''}>${esc(t.p.playback)}</button></div>`;
    }
    $('hBody').insertAdjacentHTML('beforeend', '<div style="height:12px"></div>');
    lab.setReadout(key === 'bass' ? '𝄢' : '🎶', t.secrets[key][0], '', key === 'bass' ? '#FF9F5A' : '#9B7BE0');
    lab.setState({ emo: key === 'bass' ? '🐻' : '🎶', title: t.secrets[key][0], lead: t.sec[key + 'Text'], body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    return;
  }
  if (H.ended) {
    $('hBody').innerHTML = `<div class="endbig">${esc(t.endTxt(k, HR.length))}</div><button class="btn" data-act="hagain">${esc(t.again)}</button><div style="height:12px"></div>`;
  } else {
    const q = R.tune ? t.h.q4 : t.h.q;
    const opts = R.tune ? [['up', t.h.o4[0]], ['down', t.h.o4[1]]] : [['left', t.h.left], ['right', t.h.right], ['same', t.h.same]];
    const done = H.guess !== null, ok = done && H.guess === R.ans;
    const btns = opts.map(([key, label]) => `<button class="ab ${done && key === R.ans ? 'good' : done && key === H.guess ? 'bad' : ''}" data-act="hans" data-g="${key}"${done ? ' disabled' : ''}>${esc(label)}</button>`).join('');
    const why = R.tune ? t.h.r4 : t.h.why[H.i];
    $('hBody').innerHTML = `<p class="q">${esc(q)}</p><div class="abs">${btns}</div>`
      + (done ? `<div class="fb"><span class="verdict ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.wrong)}</span><button class="btn" data-act="hnext">${esc(t.next)}</button><p>${esc(why)}</p></div>` : '')
      + '<div style="height:12px"></div>';
  }
  lab.setReadout(H.ended ? `${k}/${HR.length}` : `${H.i + 1} / ${HR.length}`, '', H.res.length ? `⭐ ${k}` : '', '#5B8DEF');
  card(H.seen ? t.st.high.f : t.st.high.n);
}

function renderNames(t) {
  const N = S.nm, k = N.res.filter(Boolean).length;
  lab.setGlow('rgba(255, 201, 74, .22)');
  let html;
  if (!N.quiz) {
    html = `<p class="hint">${esc(t.n.tap)}</p>` + (N.taps >= 5 ? `<div class="mnemo">${esc(t.n.mnemo)}</div><button class="btn" data-act="ntest">${esc(t.n.test)}</button>` : '');
    lab.setReadout(N.last === null ? '♪' : esc(noteName(N.last)), '', '', '#FFC94A');
  } else if (N.ended) {
    html = `<div class="endbig">${esc(t.endTxt(k, NR.length))}</div><div class="abs"><button class="btn" data-act="ntest">${esc(t.again)}</button><button class="ab" data-act="nexplore">${esc(t.n.explore)}</button></div>`;
    lab.setReadout(`${k}/${NR.length}`, '', '', '#FFC94A');
  } else {
    const R = NR[N.qi], done = N.guess !== null, ok = done && N.guess === letterOf(R.d);
    const btns = R.o.map((l) => `<button class="ab ${done && l === letterOf(R.d) ? 'good' : done && l === N.guess ? 'bad' : ''}" data-act="nans" data-l="${l}"${done ? ' disabled' : ''}>${esc(t.n.names[l])}</button>`).join('');
    html = `<p class="q">${esc(t.n.q)}</p><div class="abs">${btns}</div>`
      + (done ? `<div class="fb"><span class="verdict ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.wrong)}</span><button class="btn" data-act="nnext">${esc(t.next)}</button></div>` : '');
    lab.setReadout(`${N.qi + 1} / ${NR.length}`, '', N.res.length ? `⭐ ${k}` : '', '#FFC94A');
  }
  $('nBody').innerHTML = html + '<div style="height:12px"></div>';
  card(N.seen ? t.st.names.f : t.st.names.n);
}

function renderPlay(t) {
  const P = S.pl, n = P.notes.length, fin = !P.comp && P.idx >= n;
  lab.setGlow('rgba(155, 123, 224, .24)');
  let top = '';
  if (fin) top += `<div class="star">⭐ ${esc(t.p.done)}</div>`;
  else if (!P.comp) top += `<p class="hint">${esc(t.p.tune)}</p>`;
  top += `<div class="chips"><button class="chip ${P.comp ? 'on' : ''}" data-act="compose">${esc(t.p.compose)}</button>`;
  if (P.comp) top += `<button class="chip" data-act="playback"${P.song.length && !P.pb ? '' : ' disabled'}>${esc(t.p.playback)}</button><button class="chip" data-act="clear"${P.song.length ? '' : ' disabled'}>${esc(t.p.clear)}</button>`;
  else if (P.idx > 0) top += `<button class="chip" data-act="pagain">${esc(t.again)}</button>`;
  top += '</div>';
  $('pTop').innerHTML = top;
  document.querySelectorAll('#kb .wk').forEach((b) => { const d = +b.dataset.d; b.querySelector('span').textContent = noteName(d); b.setAttribute('aria-label', noteName(d)); });
  lab.setReadout(P.comp ? `${P.song.length}` : t.p.prog(P.idx, n), P.comp ? '♪' : '', '', '#9B7BE0');
  card(t.st.play);
}
render();
</script>
