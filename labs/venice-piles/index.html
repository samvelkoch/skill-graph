    c.strokeStyle = 'rgba(223,233,238,.9)'; c.fillStyle = 'rgba(223,233,238,.9)'; c.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const ph = ((t * 0.8 + i / 3) % 1), x = lerp(150, 290, ph), y = ay + (i - 1) * 9;
      c.globalAlpha = Math.sin(ph * Math.PI); c.beginPath(); c.moveTo(x - 14, y); c.lineTo(x, y); c.stroke();
      poly(c, [[x + 6, y], [x - 1, y - 4], [x - 1, y + 4]]); c.fill();
    }
    c.globalAlpha = 1;
  }
  // the shore and the compressor
  c.fillStyle = hgrad(c, 366, 400, [[0, C.stone], [1, C.stoneSh]]); c.fillRect(366, 132, BX1 - 366, SEABED - 132 + 4);
  c.strokeStyle = shade(C.stoneSh, -0.4); c.lineWidth = 1; c.strokeRect(366, 132, BX1 - 366, SEABED - 132 + 4);
  c.strokeStyle = 'rgba(120,110,95,.4)'; c.beginPath(); for (let y = 146; y < SEABED; y += 14) { c.moveTo(366, y); c.lineTo(BX1, y); } c.stroke();
  c.fillStyle = vgrad(c, 108, 132, [[0, '#6f7880'], [1, '#3a434a']]); c.beginPath(); c.roundRect(370, 108, 28, 24, 3); c.fill(); c.strokeStyle = '#1a242c'; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.3)'; c.beginPath(); for (let x = 374; x < 396; x += 4) { c.moveTo(x, 114); c.lineTo(x, 126); } c.stroke();
  const on = G.air - G.airD > 0.004;
  c.fillStyle = on ? C.ok : '#2a343c'; c.beginPath(); c.arc(394, 111.5, 1.8, 0, 6.29); c.fill();
  // air pulses travelling along the hose
  if (on || t - G.hoseT < 0.4) {
    if (on) G.hoseT = t;
    const L = []; let tot = 0;
    for (let i = 0; i < hose.length - 1; i++) { const d = Math.hypot(hose[i + 1][0] - hose[i][0], hose[i + 1][1] - hose[i][1]); L.push(d); tot += d; }
    c.fillStyle = C.air;
    for (let k = 0; k < 8; k++) {
      let s = (((t * 160 + (k * tot) / 8) % tot) + tot) % tot, i = 0;
      while (i < L.length - 1 && s > L[i]) { s -= L[i]; i++; }
      const f = s / L[i], x = lerp(hose[i][0], hose[i + 1][0], f), y = lerp(hose[i][1], hose[i + 1][1], f);
      c.beginPath(); c.arc(x, y, 1.6, 0, 6.29); c.fill();
    }
  }
  if (on && Math.random() < dt * 40) { const [bx, by] = gatePt(G.ang, 10 + Math.random() * 8, -7); G.bubbles.push({ x: bx, y: by, t, k: Math.random() }); }
  // sea / lagoon height markers once the sea slider is used
  if (G.phase === 'revealed' && G.sea > 0) {
    pill(c, `+${G.sea} ${T[lang].cm}`, 40, seaY - 14, { size: 12 });
    pill(c, `+${Math.round(G.lag)} ${T[lang].cm}`, 330, lagY - 14, { size: 12, ring: G.lag > 5 ? C.no : null });
  }
  drawGraph(c, t);
}
function drawGraph(c, t) {
  const G = S.g, X0 = 64, X1 = 364, Y0 = 344, Y1 = 440, fmin = -4, fmax = 14;
  const px = (a) => X0 + (a / 100) * (X1 - X0), py = (f) => Y1 - ((f - fmin) / (fmax - fmin)) * (Y1 - Y0);
  c.fillStyle = 'rgba(11,30,42,.82)'; c.beginPath(); c.roundRect(Math.max(BX0 + 4, 20), 330, Math.min(BX1 - 4, 384) - Math.max(BX0 + 4, 20), 146, 12 / SC); c.fill();
  c.fillStyle = 'rgba(92,194,138,.10)'; c.fillRect(X0, Y0, X1 - X0, py(0) - Y0);
  c.fillStyle = 'rgba(224,106,90,.12)'; c.fillRect(X0, py(0), X1 - X0, Y1 - py(0));
  c.strokeStyle = 'rgba(203,191,168,.18)'; c.lineWidth = 1; c.beginPath();
  for (const f of [5, 10]) { c.moveTo(X0, py(f)); c.lineTo(X1, py(f)); }
  for (const a of [50, 100]) { c.moveTo(px(a), Y0); c.lineTo(px(a), Y1); }
  c.stroke();
  c.strokeStyle = 'rgba(203,191,168,.6)'; c.beginPath(); c.moveTo(X0, Y0); c.lineTo(X0, Y1); c.lineTo(X1, Y1); c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(X0, py(0)); c.lineTo(X1, py(0)); c.stroke();
  const fs = fpx(11.5);
  c.font = `800 ${fs}px Nunito, sans-serif`; c.fillStyle = 'rgba(211,217,232,.85)';
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (const f of [0, 5, 10]) c.fillText(String(f), X0 - 5, py(f));
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (const a of [0, 50, 100]) c.fillText(`${a} %`, px(a), Y1 + 3);
  c.fillText(T[lang].air, (X0 + X1) / 2, Y1 + 4 + fs * 1.1);
  c.textAlign = 'left'; c.textBaseline = 'bottom'; c.fillText('MN', X0 - 30, Y0 - 1);
  c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillStyle = C.ok; c.fillText(`▲ ${T[lang].floats}`, X1 - 4, py(0) - 3);
  c.textBaseline = 'top'; c.fillStyle = C.no; c.fillText(`▼ ${T[lang].sinks}`, X1 - 4, py(0) + 3);
  if (G.phase !== 'revealed') {
    c.font = `900 ${fpx(26)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(245,217,138,.85)';
    c.fillText('?', (X0 + X1) / 2, (Y0 + py(0)) / 2);
    return;
  }
  const prog = easeOut((t - G.revT) / 1.3), aEnd = 100 * prog;
  c.strokeStyle = C.gold; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath();
  c.moveTo(px(0), py(forceMN(0))); c.lineTo(px(aEnd), py(forceMN(aEnd / 100))); c.stroke();
  if (aEnd > AIR0) {
    c.fillStyle = C.ok; c.strokeStyle = C.ink; c.lineWidth = 1.2; c.beginPath(); c.arc(px(AIR0), py(0), 4.5, 0, 6.29); c.fill(); c.stroke();
    c.font = `900 ${fs}px Nunito, sans-serif`; c.fillStyle = C.ok; c.textAlign = 'left'; c.textBaseline = 'bottom';
    c.fillText('≈ 13 %', px(AIR0) + 7, py(0) - 3);
  }
  if (prog > 0.98) {
    const a = G.airD * 100, f = forceMN(G.airD);
    c.strokeStyle = 'rgba(255,255,255,.45)'; c.setLineDash([3, 3]); c.lineWidth = 1; c.beginPath(); c.moveTo(px(a), py(f)); c.lineTo(px(a), Y1); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#fff'; c.strokeStyle = f >= 0 ? C.ok : C.no; c.lineWidth = 2.5; c.beginPath(); c.arc(px(a), py(f), 5.5, 0, 6.29); c.fill(); c.stroke();
  }
}

// ===================================================================================================================
// time steps that run whatever view is on screen
// ===================================================================================================================
function tick(t, dt) {
  const P = S.p, D = S.t, G = S.g;
  // pile blows: a sound and a dust puff on each of the three hits
  for (const p of P.piles) {
    const tau = t - p.t0;
    while ((p.blows ?? 0) < 3 && tau >= 0.12 + 0.28 * (p.blows ?? 0)) { p.blows = (p.blows ?? 0) + 1; P.puffs.push({ x: p.x, y: GROUND, t }); if (lab.view === 'piles') sfx.push(); }
  }
  if (P.phase === 'placing') {
    const tt = t - P.placeT;
    if (tt > 0.5 && !P.flags.plat) { P.flags.plat = 1; sfx.push(); }
    if (tt > 1.4 && !P.flags.house) { P.flags.house = 1; sfx.snap(); }
    if (tt > 1.6 && !P.flags.res) { P.flags.res = 1; (P.ok ? sfx.good : sfx.bad)(); }
    if (tt > 2.7) { P.phase = P.ok ? 'rotAsk' : 'tilted'; P.rotT0 = t; render(); }
  }
  if (P.phase === 'rotRun' && t - P.runT > 2.5) { P.phase = 'rotDone'; (P.guess === 'A' ? sfx.good : sfx.bad)(); render(); }
  if (D.phase === 'playing') {
    if (t - D.playT >= 4) { D.phase = 'result'; D.runs++; if (!D.record) (D.guess === bandOf(peakOf()) ? sfx.good : sfx.bad)(); render(); }
    else if (lab.view === 'tide') readTide(T[lang]);
  }
  // gate: air follows the slider, the angle follows the net force
  G.airD += (G.air - G.airD) * Math.min(1, dt * 2.5);
  const F = forceMN(G.airD), target = F > 0 ? Math.min(45, (45 * F) / F100) : 0;
  G.ang += (target - G.ang) * Math.min(1, dt * 2);
  const seaY = SEA0 - (G.sea * GM) / 100;
  if (gateHolds(G.ang, seaY)) { if (G.lag > G.sea) G.lag += (G.sea - G.lag) * Math.min(1, dt * 1.5); }
  else G.lag += (G.sea - G.lag) * Math.min(1, dt * 0.9);
  if (lab.view === 'gates' && G.phase === 'revealed') readGates(T[lang]);
}

// ===================================================================================================================
// input
// ===================================================================================================================
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function tryDrive(x, tap) {
  const P = S.p;
  if (P.phase !== 'build' || P.sec) return false;
  if (x < FX0 + 5 || x > FX1 - 5) return false;
  if (P.piles.length >= 12) { if (tap) sfx.bad(); return false; }
  if (P.piles.some((p) => Math.abs(p.x - x) < 14)) return false;
  P.piles.push({ x, t0: now(), blows: 0 });
  render();
  return true;
}
const cv = $('cv');
let dragging = false;
const toDesign = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - GEO.ox) / GEO.s, (ev.clientY - r.top - GEO.oy) / GEO.s]; };
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'piles' || S.p.sec || S.p.phase !== 'build') return;
  const [x, y] = toDesign(ev);
  if (y < GROUND - 30) return;
  dragging = true; tryDrive(x, true);
});
cv.addEventListener('pointermove', (ev) => { if (!dragging) return; const [x, y] = toDesign(ev); if (y >= GROUND - 30) tryDrive(x, false); });
['pointerup', 'pointercancel', 'pointerleave'].forEach((e) => cv.addEventListener(e, () => { dragging = false; }));

function putDown() {
  const P = S.p, n = quarterCounts(), held = n.map((k) => k >= 2);
  P.ok = held.every(Boolean);
  if (!P.ok) {
    const lever = [-1.5, -0.5, 0.5, 1.5], tau = n.reduce((s, k, i) => s + (1 - Math.min(1, k / 2)) * lever[i], 0);
    let weak = 0; n.forEach((k, i) => { if (k < n[weak] || (k === n[weak] && Math.abs(lever[i]) > Math.abs(lever[weak]))) weak = i; });
    const dir = tau !== 0 ? Math.sign(tau) : Math.sign(lever[weak]);
    P.tilt = dir * Math.max(4, 9 * Math.min(1, Math.abs(tau) / 2));
    P.sink = 8 + 18 * (held.filter((h) => !h).length / 4);
    P.pivot = dir > 0 ? FX0 - 6 : FX1 + 6;
  } else { P.tilt = 0; P.sink = 0; P.pivot = FX0; }
  const cs = P.piles.slice().sort((a, b) => Math.abs(a.x - 268) - Math.abs(b.x - 268))[0];
  P.cIdx = cs ? P.piles.indexOf(cs) : -1;
  P.phase = 'placing'; P.placeT = now(); P.flags = {}; P.guess = null;
  sfx.click(); showStage();
}
function liftHouse(clear) {
  const P = S.p, t = now(), pose = housePose(t);
  P.from = { dy: pose.dy, rot: pose.rot, pivot: pose.pivot, plat: pose.plat, platDy: pose.platDy };
  P.liftT = t; P.phase = 'build'; P.guess = null;
  if (clear) P.piles = [];
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const P = S.p, D = S.t, G = S.g, act = b.dataset.act;
  if (act === 'pmain') {
    if (P.phase === 'build') putDown(); else if (P.phase === 'tilted') { liftHouse(false); sfx.click(); }
  } else if (act === 'pnew') { liftHouse(true); P.sec = false; sfx.click(); }
  else if (act === 'rguess') { if (P.phase === 'rotAsk') { P.guess = b.dataset.k; sfx.tick(); } }
  else if (act === 'rgo') { if (P.phase === 'rotAsk' && P.guess) { P.phase = 'rotRun'; P.runT = now(); sfx.click(); showStage(); } }
  else if (act === 'moon' || act === 'wind') {
    if (D.phase === 'playing') return;
    D[act] = +b.dataset.k; D.record = false; D.phase = 'setup'; D.guess = null; sfx.tick();
  } else if (act === 'tguess') {
    if (D.phase === 'playing') return;
    if (D.phase === 'result') { D.phase = 'setup'; D.record = false; }
    D.guess = +b.dataset.k; sfx.tick();
  } else if (act === 'tgo') {
    if (D.phase !== 'setup' || D.guess === null) return;
    D.phase = 'playing'; D.playT = now(); sfx.click(); showStage();
  } else if (act === 'gguess') {
    if (G.phase !== 'ask') return;
    G.guess = +b.dataset.k; G.phase = 'revealed'; G.revT = now(); (G.guess === 0 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (k === 'a') {
      if (lab.view === 'piles' && P.sec) P.sec = false; else { P.sec = true; P.secT = now(); }
      if (lab.view !== 'piles') { lab.view = 'piles'; lab.renderChrome(); }
    } else {
      if (lab.view !== 'tide') { lab.view = 'tide'; lab.renderChrome(); }
      P.sec = false;
      D.moon = 2; D.wind = 3; D.record = true; D.guess = null; D.phase = 'playing'; D.playT = now(); D.disp = 25 + TA[2];
    }
    sfx.click(); showStage();
  } else return;
  render();
});
$('vpAir').addEventListener('input', (ev) => { if (S.g.phase !== 'revealed') return; S.g.air = +ev.target.value / 100; render(); });
$('vpSea').addEventListener('input', (ev) => { S.g.sea = +ev.target.value; render(); });

// ===================================================================================================================
// render: controls, readout, state card and facts for the current view
// ===================================================================================================================
function setRO(val, sub, pill_, color) {
  const k = `${val}|${sub}|${pill_}|${color}`;
  if (k === roKey) return; roKey = k;
  lab.setReadout(val, sub, pill_, color);
}
const card = (a, extra = '') => ({ emo: a[0], title: a[1], lead: a[2], body: a[3] ?? '', extra });
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  off('vpPiles', v !== 'piles'); off('vpTide', v !== 'tide'); off('vpGates', v !== 'gates');
  const open = secret.unlocked(), on = (k) => (k === 'a' ? v === 'piles' && S.p.sec : v === 'tide' && S.t.record);
  $('secChips').innerHTML = [['a', '🌲'], ['b', '🌊']].map(([k, e]) => `<button class="chip secret vp-c ${open ? 'open' : ''} ${open && on(k) ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setFacts(t.facts[v]);
  if (v === 'piles') renderPiles(t); else if (v === 'tide') renderTide(t); else renderGates(t);
}
function renderPiles(t) {
  const P = S.p, n = quarterCounts(), held = n.filter((k) => k >= 2).length, ph = P.phase, rot = ph.startsWith('rot');
  lab.setGlow('rgba(216, 167, 62, .22)');
  if (P.sec) {
    ['pRot', 'pAsk', 'pRow', 'pVerdict'].forEach((id) => off(id, true));
    setRO(MILLION, '', '', '#d8a73e');
    lab.setState({ emo: '⛪', title: t.secrets.a[0], lead: `${MILLION} ${t.millionLabel}`, body: '', extra: '' });
    return;
  }
  off('pRot', !rot); off('pAsk', ph !== 'build'); off('pRow', false);
  $('pAsk').textContent = t.pilesAsk;
  $('pMain').textContent = ph === 'tilted' ? t.again : t.putDown;
  off('pMain', !(ph === 'build' || ph === 'tilted'));
  $('pMain').disabled = false;
  $('pNew').textContent = t.newHouse;
  const pv = $('pVerdict');
  pv.textContent = ph === 'tilted' ? t.tilts : rot ? t.stands : '';
  pv.className = `vp-verdict ${ph === 'tilted' ? 'no' : 'ok'}`;
  if (rot) {
    $('rAsk').textContent = t.rotAsk;
    const done = ph === 'rotDone';
    $('rChips').innerHTML = [['A', t.rotA], ['B', t.rotB], ['C', t.rotC]].map(([k, l]) => {
      const cls = done ? (k === 'A' ? 'vp-ok' : P.guess === k ? 'vp-no' : '') : P.guess === k ? 'on' : '';
      return `<button class="chip vp-c ${cls}" data-act="rguess" data-k="${k}"${ph !== 'rotAsk' ? ' disabled' : ''}>${k} · ${esc(l)}</button>`;
    }).join('');
    $('rGo').textContent = t.rotGo; $('rGo').disabled = ph !== 'rotAsk' || !P.guess; off('rGo', done);
    const rv = $('rVerdict');
    rv.textContent = done ? (P.guess === 'A' ? t.rotRight : t.rotWrong) : '';
    rv.className = `vp-verdict ${P.guess === 'A' ? 'ok' : 'no'}`;
  }
  setRO(String(P.piles.length), t.pilesVal, t.held(held), '#d8a73e');
  lab.setState(card(ph === 'rotDone' ? t.st.rot : ph === 'build' || ph === 'placing' ? t.st.piles0 : t.st.piles1));
}
function readTide(t) {
  const D = S.t;
  if (D.phase === 'setup') return setRO('?', t.atGauge, '', '#7cc3bf');
  const lv = Math.round(D.phase === 'result' ? peakOf() : tideLevel(now())), w = lv - PAVE;
  setRO(`${lv} ${t.cm}`, t.atGauge, w > 0 ? t.onSquare(w) : t.dry, '#7cc3bf');
}
function renderTide(t) {
  const D = S.t, busy = D.phase === 'playing';
  lab.setGlow('rgba(124, 195, 191, .22)');
  $('tMoonL').textContent = t.moon; $('tWindL').textContent = t.wind;
  $('tMoon').innerHTML = t.moonOpts.map((l, i) => `<button class="chip vp-c ${D.moon === i ? 'on' : ''}" data-act="moon" data-k="${i}"${busy ? ' disabled' : ''}>${esc(l)}</button>`).join('');
  $('tWind').innerHTML = t.windOpts.map((l, i) => `<button class="chip vp-c ${D.wind === i ? 'on' : ''}" data-act="wind" data-k="${i}"${busy ? ' disabled' : ''}>${esc(l)}</button>`).join('');
  $('tAsk').textContent = t.squareAsk;
  const res = D.phase === 'result' && !D.record, band = bandOf(peakOf());
  $('tGuess').innerHTML = t.squareOpts.map((l, i) => {
    const cls = res ? (i === band ? 'vp-ok' : D.guess === i ? 'vp-no' : '') : D.guess === i ? 'on' : '';
    return `<button class="chip vp-c ${cls}" data-act="tguess" data-k="${i}"${busy ? ' disabled' : ''}>${esc(l)}</button>`;
  }).join('');
  $('tGo').textContent = t.nextTide; $('tGo').disabled = D.phase !== 'setup' || D.guess === null;
  const tv = $('tVerdict');
  tv.textContent = res ? (D.guess === band ? t.tideRight : t.tideWrong(t.squareOpts[band])) : '';
  tv.className = `vp-verdict ${res && D.guess === band ? 'ok' : 'no'}`;
  readTide(t);
  lab.setState(D.runs > 0 || D.record ? card(t.st.tide) : { emo: '🌊', title: t.tideAsk, lead: t.squareAsk, body: '', extra: '' });
}
function readGates(t) {
  const G = S.g;
  if (G.phase !== 'revealed') return setRO('?', t.gateAngle, '', '#e3b23c');
  const f = forceMN(G.airD);
  setRO(`${Math.round(G.ang)}°`, t.gateAngle, f >= 0 ? t.netUp(fmt1(f)) : t.netDown(fmt1(-f)), '#e3b23c');
}
function renderGates(t) {
  const G = S.g, rev = G.phase === 'revealed';
  lab.setGlow('rgba(227, 178, 60, .22)');
  $('gAsk').textContent = t.gatesAsk;
  $('gChips').innerHTML = t.gatesOpts.map((l, i) => {
    const cls = rev ? (i === 0 ? 'vp-ok' : G.guess === i ? 'vp-no' : '') : '';
    return `<button class="chip vp-c ${cls}" data-act="gguess" data-k="${i}"${rev ? ' disabled' : ''}>${esc(l)}</button>`;
  }).join('');
  $('gAirL').textContent = `${t.air}: ${Math.round(G.air * 100)} %`;
  $('vpAir').disabled = !rev; $('vpAir').setAttribute('aria-label', t.air);
  off('gSeaW', !rev);
  $('gSeaL').textContent = `${t.seaHigher}: ${G.sea} ${t.cm}`; $('vpSea').setAttribute('aria-label', t.seaHigher);
  const gv = $('gVerdict');
  gv.textContent = rev ? (G.guess === 0 ? t.gatesRight : t.gatesWrong) : '';
  gv.className = `vp-verdict ${G.guess === 0 ? 'ok' : 'no'}`;
  readGates(t);
  lab.setState(rev ? card(t.st.gates) : { emo: '🚧', title: t.gatesAsk, lead: '', body: '', extra: '' });
}

// ===================================================================================================================
// go: the loop and the first render come last, after everything they use is declared
// ===================================================================================================================
const BOX = { piles: [400, 520], tide: [400, 420], gates: [400, 480] };
canvasLoop(cv, (c, w, h, dt, time) => {
  tick(time, dt);
  const v = lab.view, [BW, BH] = BOX[v], s = Math.min(w / BW, h / BH), ox = (w - BW * s) / 2, oy = (h - BH * s) / 2;
  GEO = { s, ox, oy }; SC = s; BX0 = -ox / s; BX1 = (w - ox) / s; BY0 = -oy / s; BY1 = (h - oy) / s;
  c.save(); c.translate(ox, oy); c.scale(s, s); c.lineJoin = 'round';
  if (v === 'piles') { if (S.p.sec) drawSalute(c, time); else drawPiles(c, dt, time); }
  else if (v === 'tide') drawTide(c, dt, time);
  else drawGates(c, dt, time);
  c.restore();
});
render();
</script>
