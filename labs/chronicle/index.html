    $('mineCap').textContent = t.m.label;
    if (!keepInput && $('byIn').value !== String(S.by)) $('byIn').value = S.by;
    $('mineChips').innerHTML = [[0, t.m.jan], [1, t.m.sep]].map(([m, l]) => `<button class="chip ${S.bm === m ? 'on' : ''}" data-act="bm" data-m="${m}">${esc(l)}</button>`).join('');
    const ch = S.by + OFF + S.bm;
    lab.setReadout(ch, t.m.line, `+ ${OFF + S.bm}`, '#e0b050');
    lab.setState({ emo: '🗓️', title: t.m.t(S.by, ch), lead: t.m.l, body: t.m.b, extra: '' });
    lab.setFacts([{ emo: '📅', text: t.f.byz, src: SRC.byz }]);
    return;
  }
  if (!S.checked) {
    lab.setReadout(q, r.readSub, known ? r.pill : '', '#e0b050');
    lab.setState({ emo: '🔎', title: r.q(q), lead: known ? r.useIt : r.look, body: '', extra: '' });
  } else {
    const g = S.g, right = g === ad;
    lab.setReadout(`${q} → ${ad}`, r.readSub2, known ? r.pill : '', '#e0b050');
    if (known) lab.setState({ emo: right ? '✅' : '💡', title: right ? r.right : r.ruleT, lead: right ? `${r.eq(q, ad)}. ${r.ruleT}.` : r.eq(q, ad), body: r.why, extra: '' });
    else lab.setState({ emo: '🤔', title: r.wrongT(g, ad), lead: r.wrongL, body: '', extra: '' });
  }
  lab.setFacts(known
    ? [{ emo: '📅', text: t.f.byz, src: SRC.byz }, { emo: '🕰️', text: t.f.rus, src: SRC.byz }]
    : [{ emo: '📜', text: t.f.pvl, src: SRC.pvl }, { emo: '🕰️', text: t.f.rus, src: SRC.byz }]);
}

function renderEntry(t) {
  const e = t.e, known = ruleKnown(), au = S.sec === 'author', marked = S.marks.filter(Boolean).length;
  lab.setGlow('rgba(217, 130, 95, .24)');
  $('eLegend').innerHTML = [['legYear', RED], ['legEvent', GOLD], ['legEmpty', '#9a8b6a']].map(([k, col]) => `<span class="ch-lg"><i style="background:${col}"></i>${esc(e[k])}</span>`).join('');
  $('eLegend').hidden = au || !S.echecked;
  $('eMain').textContent = e.open; $('eMain').hidden = au || S.echecked;
  $('authBox').hidden = !au;
  $('authChips').innerHTML = Object.keys(t.au.chips).map((k) => `<button class="chip ${S.au === k ? 'on' : ''}" data-act="au" data-k="${k}">${esc(t.au.chips[k])}</button>`).join('');
  if (au) {
    lab.setReadout(t.au.t[S.au], t.au.title, '', '#d9825f');
    lab.setState({ emo: '✍️', title: t.au.t[S.au], lead: t.au.lead[S.au], body: '', extra: '' });
    lab.setFacts([{ emo: '📜', text: t.f.src, src: SRC.pvl }]);
    return;
  }
  const facts = [{ emo: '🧩', text: t.f.src, src: SRC.pvl }, { emo: '🕳️', text: t.f.laur, src: SRC.pvl }];
  if (!S.echecked) {
    lab.setReadout(marked, e.readSub0, '', '#d9825f');
    lab.setState({ emo: '📜', title: e.q, lead: e.lead, body: '', extra: '' });
    lab.setFacts(facts);
    return;
  }
  const sel = STRIP[S.sel2] ?? STRIP[0], k = STRIP.filter((r, i) => S.marks[i] === !!r.ev).length;
  lab.setReadout(`${NREC} / 7`, e.readSub, '', '#d9825f');
  const own = sel.ev
    ? { emo: '📜', title: e.selEv(sel.y), lead: e.ev[sel.ev], body: known ? e.selAd(sel.y - OFF) : '' }
    : { emo: '🕳️', title: e.selEmpty(sel.y), lead: e.empty, body: known ? e.selAd(sel.y - OFF) : '' };
  lab.setState({ ...own, extra: `<b>${esc(e.t(NREC))}.</b> ${esc(e.l(7 - NREC))} ${esc(e.body)}<br>${esc(e.got(k))}` });
  lab.setFacts(known ? [...facts, { emo: '📖', text: t.f.first, src: SRC.pvl }] : facts);
}

function renderSky(t) {
  const k = t.k, cn = k.cities, n = S.picks.filter(Boolean).length;
  lab.setGlow('rgba(95, 120, 200, .26)');
  $('cityChips').innerHTML = CITIES.map((ct, i) => {
    const on = S.picks[i], res = S.kchecked;
    const lbl = res ? `${ct.tot ? '🌑' : '◐'} ${cn[ct.id]} ${ct.tot ? '' : `≈${ct.cov}%`}` : `${on ? '●' : '○'} ${cn[ct.id]}`;
    return `<button class="chip ch-city ${res ? (S.sel3 === i ? 'on' : '') : (on ? 'on' : '')}" data-act="city" data-i="${i}" aria-pressed="${on}">${esc(lbl.trim())}</button>`;
  }).join('');
  $('kMain').textContent = k.show; $('kMain').hidden = S.kchecked;
  if (!S.kchecked) {
    lab.setReadout(n, k.readSub, '', '#7f93d8');
    lab.setState({ emo: '🌑', title: k.q, lead: k.lead, body: '', extra: '' });
    lab.setFacts([{ emo: '🛰️', text: t.f.nasa, src: SRC.nasa }]);
    return;
  }
  const hits = CITIES.filter((ct, i) => S.picks[i] === ct.tot).length, exact = hits === CITIES.length, sc = CITIES[S.sel3], ns = CITIES[0];
  lab.setReadout(`${CITIES.filter((ct) => ct.tot).length} / ${CITIES.length}`, k.readSub2, sc.tot ? k.tot : `≈${sc.cov}%`, '#7f93d8');
  lab.setState({
    emo: exact ? '✅' : '🌑', title: exact ? k.right : k.only, lead: k.lead2(ns.cov), body: k.body,
    extra: `${esc(k.cityT(cn[sc.id], sc.tot, sc.cov))}. ${esc(k.cityL(sc.tot))}<br>${esc(k.got(hits))}`,
  });
  lab.setFacts([{ emo: '😨', text: t.f.igor, src: SRC.ecl }, { emo: '🌘', text: t.f.crescent, src: SRC.ecl }, { emo: '📖', text: t.f.tale, src: SRC.igor }]);
}
render();
</script>
</body>
</html>
