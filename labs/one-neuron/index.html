  const x = S.x1, w = S.w1, th = S.th1, sum = sumOf(x, w), on = sum >= th, g = GOALS[S.task], o = t.one;
  const marks = COMBOS.map((cx) => (sumOf(cx, w) >= th ? 1 : 0) === g(cx));
  const ok = marks.every(Boolean);
  if (ok && !S.done[S.task]) { S.done[S.task] = true; sfx.good(); }
  lab.setGlow('rgba(95, 120, 220, .3)');
  lab.setReadout(fmt(sum), t.needs(th), on ? `🏖️ ${t.beach}` : `🏠 ${t.stay}`, on ? '#e8a928' : '#6f7fd8');
  const onW = w.filter((_, i) => x[i]), expr = onW.length ? o.sumLine(termsText(onW), fmt(sum)) : o.none;
  lab.setState(ok
    ? { emo: '🎉', title: o.done, lead: o.doneLead, body: o.doneBody, extra: '' }
    : { emo: on ? '💡' : '🧠', title: on ? o.fires : o.quiet, lead: expr, body: o.cmp(fmt(sum), th, on), extra: '' });
  lab.setFacts(factOf('brain'));
  const steps = [0, 1, 2].map((i) => stepHtml(`${IC[i]} ${esc(t.in[i])}`, w[i], 'w', i, -3, 3)).join('') + stepHtml(`🚪 ${esc(t.th)}`, th, 'th', 0, 0, 6);
  return `<div class="nn-task"><b>${esc(o.task(S.task + 1, 3))}</b>${esc(o.goals[S.task])}</div>
    <div class="nn-lbl">${esc(o.inL)}</div><div class="nn-chips">${chipsHtml(t, x, [0, 1, 2])}</div>
    <div class="nn-lbl">${esc(o.wL)}</div><div class="nn-steps">${steps}</div>
    <div class="nn-lbl">${esc(o.tilesL)}</div><div class="nn-tiles">${COMBOS.map((cx, k) => tileHtml(cx, [0, 1, 2], `${marks[k] ? 'ok' : 'bad'}${key(cx) === key(x) ? ' cur' : ''}`, sumOf(cx, w) >= th ? 1 : 0, marks[k] ? '✓' : '✗')).join('')}</div>
    ${S.done[S.task] ? `<div class="nn-row"><button type="button" class="nn-btn go" data-act="ntask">${esc(S.task === 2 ? o.again : o.next)}</button></div>` : ''}`;
}

function renderFind(t) {
  const f = t.find, H = HID[S.hk], x = S.x2, k = key(x), known = k in S.hist, res = S.res && S.res.key === k ? S.res : null, rev = S.rev;
  const real = sumOf(x, H.w) >= H.th;
  lab.setGlow('rgba(80, 170, 190, .3)');
  if (rev) {
    const sum = sumOf(x, H.w);
    lab.setReadout(fmt(sum), t.needs(H.th), real ? `🏖️ ${t.beach}` : `🏠 ${t.stay}`, real ? '#e8a928' : '#6f7fd8');
    lab.setState({ emo: '🔓', title: S.openedBy === 'streak' ? f.opened : f.shown, lead: `${IC[0]} ${fmt(H.w[0])} · ${IC[1]} ${fmt(H.w[1])} · ${IC[2]} ${fmt(H.w[2])} · ${t.needs(H.th)}`, body: f.desc[S.hk], extra: '' });
  } else {
    lab.setReadout('?', f.hiddenSub, f.streakS(S.streak), '#4fb6c8');
    if (res) lab.setState(res.right ? { emo: '✅', title: f.right, lead: f.rightLead(!!res.out), body: f.streak(S.streak), extra: '' } : { emo: '🤔', title: f.wrong, lead: f.wrongLead(!!res.out), body: f.wrongBody, extra: '' });
    else if (known) lab.setState({ emo: '📋', title: f.known, lead: f.knownLead(!!S.hist[k]), body: '', extra: '' });
    else lab.setState({ emo: '🔍', title: f.hid, lead: f.hidLead, body: f.hidBody, extra: '' });
  }
  lab.setFacts(factOf('mark'));
  const tiles = COMBOS.map((cx) => { const kk = key(cx), tried = kk in S.hist || rev; return tileHtml(cx, [0, 1, 2], `${tried ? '' : 'unk'}${kk === k ? ' cur' : ''}`, rev ? (sumOf(cx, H.w) >= H.th ? 1 : 0) : (kk in S.hist ? S.hist[kk] : null), ''); }).join('');
  const ask = rev ? '' : `<p class="nn-q">${esc(f.q)}</p>
    <div class="nn-guess"><button type="button" class="nn-btn go" data-act="guess" data-g="1"${known ? ' disabled' : ''}>🏖️ ${esc(t.beach)}</button><button type="button" class="nn-btn go" data-act="guess" data-g="0"${known ? ' disabled' : ''}>🏠 ${esc(t.stay)}</button></div>
    <div class="nn-streak"><span>${[0, 1, 2].map((i) => `<i class="${i < S.streak ? 'on' : ''}" style="display:inline-block;margin-right:4px"></i>`).join('')}</span>${esc(f.streak(S.streak))}</div>`;
  return `${ask}${rev ? '' : `<div class="nn-lbl">${esc(f.setup)}</div>`}<div class="nn-chips">${chipsHtml(t, x, [0, 1, 2])}</div>
    <div class="nn-lbl">${esc(f.tilesL)}</div><div class="nn-tiles">${tiles}</div>
    <div class="nn-row">${rev ? `<button type="button" class="nn-btn go" data-act="another">${esc(f.another)}</button>` : `<button type="button" class="nn-btn ghost" data-act="show">${esc(f.show)}</button>`}</div>`;
}

function renderLearn(t) {
  const l = t.learn, L = S.l, ex = L.ex, ask = L.phase === 'ask';
  lab.setGlow('rgba(120, 100, 220, .3)');
  lab.setReadout(String(L.cur), l.mistakes, `${l.passW} ${L.pass}`, '#8a7be0');
  lab.setFacts(factOf('mp'));
  const name = (b) => (b ? t.beachS : t.stayS);
  if (!ex) lab.setState({ emo: '📈', title: l.idle, lead: l.idleLead, body: '', extra: '' });
  else {
    const line = l.ex(ex.idx + 1, name(ex.o), name(ex.t));
    const extra = L.endMsg ? `<div>${esc(l.passEnd(L.endMsg.p, L.endMsg.k))}</div>` : '';
    const nowOut = sumOf(ex.x, L.w) >= L.th ? 1 : 0, none = !ex.x.some(Boolean);
    if (ask) lab.setState({ emo: '❌', title: l.bad, lead: line, body: '', extra: '' });
    else if (L.verdict) lab.setState({ emo: L.verdict.ok ? '✅' : '🤔', title: L.verdict.ok ? l.vOk : l.vNo, lead: l.vLead, body: `${l.up(ex.e, none)} ${l.now(name(nowOut))}`, extra });
    else if (L.clean) lab.setState({ emo: '🎓', title: l.learned, lead: l.learnedLead, body: l.learnedBody, extra });
    else if (L.delta) lab.setState({ emo: '🔧', title: l.upT, lead: line, body: `${l.up(ex.e, none)} ${l.now(name(nowOut))}`, extra });
    else lab.setState({ emo: '✅', title: l.okT, lead: line, body: l.okBody, extra });
  }
  const deck = L.order.map((ci, j) => { const cx = COMBOS[ci], r = L.res[j]; return tileHtml(cx, [0, 1, 2], `${r === 'ok' ? 'ok' : r === 'bad' ? 'bad' : ''}${ex && ex.idx === j && L.i - 1 === j ? ' cur' : ''}`, TARGET3(cx), r === 'ok' ? '✓' : r === 'bad' ? '✗' : '', 'div'); }).join('');
  const q = ask ? `<p class="nn-q">${esc(l.badQ)}</p><div class="nn-opts">${l.opts.map((o, j) => `<button type="button" class="nn-btn" data-act="lans" data-i="${j}">${esc(o)}</button>`).join('')}</div>` : '';
  return `${q}${ask ? '' : `<div class="nn-row" style="margin-top:0"><button type="button" class="nn-btn go" data-act="lnext">${esc(l.next)}</button><button type="button" class="nn-btn" data-act="lpass">${esc(l.pass)}</button></div>`}
    <div class="nn-lbl">${esc(l.deckL)}</div><div class="nn-tiles">${deck}</div>
    <div class="nn-row"><button type="button" class="nn-btn ghost" data-act="lnew">${esc(l.newN)}</button></div>`;
}

function renderXor(t) {
  const xo = t.xor, one = S.xmode === 'one';
  const outOf = (x) => (one ? (sumOf(x, S.xw) >= S.xth ? 1 : 0) : (((x[0] + x[1] >= 1 ? 1 : 0) - (x[0] + x[1] >= 2 ? 1 : 0)) >= 1 ? 1 : 0));
  const marks = XC.map((x) => outOf(x) === XF(x)), k = marks.filter(Boolean).length, cur = outOf(S.xs);
  lab.setGlow('rgba(220, 150, 80, .28)');
  lab.setReadout(`${k}/4`, xo.daysRight, cur ? `🏖️ ${t.beach}` : `🏠 ${t.stay}`, '#e8a928');
  lab.setState(one ? { emo: '🤔', title: xo.matches(k), lead: xo.tryLead, body: '', extra: '' } : { emo: '🧩', title: xo.netT, lead: xo.netLead, body: '', extra: '' });
  lab.setFacts(factOf('mp'));
  const steps = one ? stepHtml(`${IC[0]} ${esc(t.in[0])}`, S.xw[0], 'w', 0, -3, 3) + stepHtml(`${IC[2]} ${esc(t.in[2])}`, S.xw[1], 'w', 1, -3, 3) + stepHtml(`🚪 ${esc(t.th)}`, S.xth, 'th', 0, 0, 6) : '';
  return `<div class="nn-task"><b>🧩</b>${esc(xo.goal)}</div>
    <div class="nn-row" style="margin-top:8px"><button type="button" class="nn-btn${one ? ' go' : ''}" data-act="xmode" data-m="one">${esc(xo.one)}</button><button type="button" class="nn-btn${one ? '' : ' go'}" data-act="xmode" data-m="net">${esc(xo.net)}</button></div>
    <div class="nn-lbl">${esc(t.one.inL)}</div><div class="nn-chips">${chipsHtml(t, S.xs, [0, 2])}</div>
    ${one ? `<div class="nn-lbl">${esc(t.one.wL)}</div><div class="nn-steps">${steps}</div>` : ''}
    <div class="nn-lbl">${esc(xo.tilesL)}</div><div class="nn-tiles">${XC.map((x, i) => tileHtml(x, [0, 2], `${marks[i] ? 'ok' : 'bad'}${key(x) === key(S.xs) ? ' cur' : ''}`, outOf(x), marks[i] ? '✓' : '✗')).join('')}</div>`;
}

function renderNet(t) {
  const n = t.net, { H, out } = letterState(), names = n.hid.filter((_, i) => H[i]), lit = ['I', 'L', 'J'].filter((_, i) => out[i]);
  lab.setGlow('rgba(90, 160, 220, .28)');
  lab.setReadout(lit.length ? lit[0] : '–', n.title, '', '#5aa0dc');
  lab.setState({ emo: '🔤', title: lit.length ? n.lit(lit[0]) : n.none, lead: n.parts(names), body: n.note, extra: '' });
  lab.setFacts(factOf('brain'));
  const pre = (lbl, p) => `<button type="button" class="nn-chip" data-act="px" data-p="${p}">${lbl}</button>`;
  return `<p class="nn-q">${esc(n.title)}</p><div class="nn-lbl first" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--soft)">${esc(n.lead)}</div>
    <div class="nn-chips" style="margin-top:8px">${pre('I', '101010')}${pre('L', '101011')}${pre('J', '010111')}${pre(esc(n.clear), '000000')}</div>`;
}
render();
</script>
