      c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x - COLW, bounds[i + 1] - 14, 4, STEP + 28); c.fillRect(x + COLW - 4, bounds[i + 1] - 14, 4, STEP + 28);
      c.restore();
      const q = clamp((time - t0 - 0.15) / 0.4, 0, 1);
      if (q > 0) emo(c, FIND[i], x, (bounds[i] + bounds[i + 1]) / 2 + 1, 17 * Math.max(0, back(q)));
      layerPath(c, i, x - COLW, x + COLW); c.lineWidth = 1; c.strokeStyle = 'rgba(15,8,6,.6)'; c.stroke();
      if (S.last === i && S.lastCol === j && !pot) {
        c.lineWidth = 2; c.strokeStyle = `rgba(255,255,255,${0.55 + 0.35 * Math.sin(time * 5)})`; c.stroke();
      }
    }
    // trowels
    if (predD && !pot) for (let j = 0; j < 3; j++) if (S.d[j] < NL) {
      const x = colX(j), y = yAt(9 - S.d[j], x) - 4 + Math.sin(time * 3 + j * 1.3) * 2.5;
      trowel(c, x, y, 0.3, 0.95);
    }
    if (pot) drawPot_secret(c, time);
    if (predD && !pot && !S.anyDig) pill(c, t.tapHint, CX, bounds[0] + 9, 13, 'rgba(10,12,20,.82)', '#fff');
  }

  if (trench) {
    if (predT && S.secT !== 'gold') { // where historians put the war: gold outline on Troy VI–VII, with the date
      c.save(); c.shadowColor = 'rgba(255,214,120,.9)'; c.shadowBlur = 8; c.strokeStyle = '#ffd27a'; c.lineWidth = 2.5; c.lineJoin = 'round';
      layerPath(c, WAR_FROM); c.stroke(); layerPath(c, WAR_TO); c.stroke(); c.restore();
      pill(c, `⚔️ ${t.ym(WAR)}`, W - 6, (bounds[WAR_FROM] + bounds[WAR_TO + 1]) / 2, 13, '#3a2a0e', '#ffd27a', 'right');
    }
    if (predT && S.cutP === 0) { // a faint outline of where the trench will go
      c.save(); c.setLineDash([5, 4]); c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.5; trenchSides(c, TY1); c.stroke(); c.restore();
    }
    if (S.cutP > 0) drawTrench(c, time);
    if (S.secT === 'gold' && predT) drawGold(c, time);
  }

  if (showBadges) {
    const act = v === 'dig' ? S.last : -1;
    LAY.forEach((L, i) => {
      const y = (bounds[i] + bounds[i + 1]) / 2, on = i === act;
      c.save(); c.setLineDash([2, 3]); c.strokeStyle = on ? 'rgba(255,255,255,.8)' : 'rgba(255,255,255,.28)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(40, y); c.lineTo(CX - hw(y) - 1, y); c.stroke(); c.restore();
      c.fillStyle = on ? '#ffffff' : shade(L.c, 0.25); c.strokeStyle = on ? '#ffd27a' : tint(L.c, 0.25); c.lineWidth = 1.2;
      c.beginPath(); c.roundRect(4, y - 9, 36, 18, 9); c.fill(); c.stroke();
      txt(c, L.r, 22, y + 0.5, 13, 800, on ? '#1b1310' : '#fff');
    });
  }
}

function drawTrench(c, time) {
  const yc = TY0 + (TY1 - TY0) * ease(S.cutP);
  // the cut layers turn grey
  for (let i = NL - 1; i >= TR_LAYER; i--) {
    c.save(); layerPath(c, i); c.clip(); trenchPath(c, yc); c.clip();
    const g = c.createLinearGradient(0, bounds[i + 1], 0, bounds[i]);
    if (i > TR_LAYER) { g.addColorStop(0, gray(LAY[i].c, 0)); g.addColorStop(1, gray(LAY[i].c, 0.3)); }
    else { g.addColorStop(0, '#e9c46a'); g.addColorStop(1, '#a9742a'); }
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    if (i > TR_LAYER) {
      c.strokeStyle = 'rgba(255,255,255,.13)'; c.lineWidth = 1; c.beginPath();
      for (let k = -H; k < W + H; k += 7) { c.moveTo(k, 0); c.lineTo(k - 120, H); }
      c.stroke();
    }
    c.restore();
    c.save(); layerPath(c, i); c.clip(); trenchPath(c, yc); c.clip();
    layerPath(c, i); c.lineWidth = 1.2; c.strokeStyle = 'rgba(0,0,0,.4)'; c.stroke();
    c.restore();
  }
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  c.strokeStyle = 'rgba(15,10,8,.85)'; c.lineWidth = 2.5; trenchSides(c, yc); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1; c.translate(1.5, 0); trenchSides(c, yc); c.stroke();
  c.restore();
  if (S.cutP < 1) trowel(c, CX, yc + 1, 0.3, 1);
}

function drawGold(c, time) { // a heap of gold in Troy II, and a bracket from Troy II up to the war
  const y = (bounds[1] + bounds[2]) / 2 + 2, gl = c.createRadialGradient(CX, y, 1, CX, y, 30);
  gl.addColorStop(0, 'rgba(255,220,120,.7)'); gl.addColorStop(1, 'rgba(255,220,120,0)');
  c.fillStyle = gl; c.beginPath(); c.arc(CX, y, 30, 0, 6.3); c.fill();
  for (const [dx, dy, r] of [[-12, 3, 5], [-4, 4, 5.5], [5, 3, 5], [13, 4, 4.5], [-8, -3, 5], [1, -4, 5.5], [9, -2, 4.5]]) {
    const g = c.createRadialGradient(CX + dx - 1.5, y + dy - 1.5, 0.5, CX + dx, y + dy, r + 1);
    g.addColorStop(0, '#fff3b0'); g.addColorStop(0.6, '#e2a928'); g.addColorStop(1, '#9a6511');
    c.fillStyle = g; c.beginPath(); c.arc(CX + dx, y + dy, r, 0, 6.3); c.fill(); c.lineWidth = 0.8; c.strokeStyle = '#5a3a0a'; c.stroke();
  }
  const tw = 0.6 + 0.4 * Math.sin(time * 4);
  c.strokeStyle = `rgba(255,255,230,${tw})`; c.lineWidth = 1.5;
  for (const [sx, sy] of [[CX - 12, y - 10], [CX + 12, y - 8]]) { c.beginPath(); c.moveTo(sx - 4, sy); c.lineTo(sx + 4, sy); c.moveTo(sx, sy - 4); c.lineTo(sx, sy + 4); c.stroke(); }
  const y1 = (bounds[TR_LAYER] + bounds[TR_LAYER + 1]) / 2, y2 = (bounds[WAR_TO] + bounds[WAR_TO + 1]) / 2, bx = 326, n = over(GAP_II);
  c.save(); c.strokeStyle = '#ffd27a'; c.lineWidth = 2; c.lineCap = 'round';
  c.beginPath(); c.moveTo(bx - 8, y1); c.lineTo(bx, y1); c.lineTo(bx, y2); c.lineTo(bx - 8, y2); c.stroke();
  c.fillStyle = '#ffd27a'; c.beginPath(); c.moveTo(bx, y2 - 2); c.lineTo(bx - 4, y2 + 7); c.lineTo(bx + 4, y2 + 7); c.closePath(); c.fill();
  c.restore();
  const t = T[lang];
  pill(c, t.g.gap(t.num(n)), W - 6, (y1 + y2) / 2, 14, '#3a2a0e', '#ffd27a', 'right');
  pill(c, `⚔️ ${t.ym(WAR)}`, W - 6, y2 - 20, 13, '#3a2a0e', '#ffd27a', 'right');
}

function drawPot_secret(c, time) { // swatches of the nine pottery styles at the right, the shard to match at the top left
  const P = S.pot, ended = P.n >= ORDER.length, tgt = ended ? -1 : ORDER[P.n];
  LAY.forEach((L, i) => {
    const y = (bounds[i] + bounds[i + 1]) / 2;
    c.save(); c.setLineDash([2, 3]); c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(CX + hw(y) + 2, y); c.lineTo(332, y); c.stroke(); c.restore();
    drawPot(c, i, 343, y, 0.95, false);
  });
  if (P.picked !== null) {
    c.save(); c.lineJoin = 'round'; c.shadowBlur = 8;
    c.shadowColor = 'rgba(61,220,151,.9)'; c.strokeStyle = '#3ddc97'; c.lineWidth = 3; layerPath(c, tgt); c.stroke();
    if (P.picked !== tgt) { c.shadowColor = 'rgba(255,59,48,.9)'; c.strokeStyle = '#ff5a4f'; layerPath(c, P.picked); c.stroke(); }
    c.restore();
  }
  if (!ended) {
    c.fillStyle = 'rgba(10,12,20,.75)'; c.beginPath(); c.roundRect(8, 6, 76, 62, 12); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 1; c.stroke();
    drawPot(c, tgt, 46, 37, 2.6 + 0.04 * Math.sin(time * 2), true);
  }
}

// --- the clues picture: two piles and the card to sort -------------------------------------------------------------
const BIN = [{ x: 6, y: 84, w: 170, h: 214 }, { x: 184, y: 84, w: 170, h: 214 }];
function tag(c, x, y, w, h, e, label, dark) {
  c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 6; c.shadowOffsetY = 2;
  const g = c.createLinearGradient(0, y, 0, y + h);
  if (dark) { g.addColorStop(0, '#4a3a28'); g.addColorStop(1, '#2f2418'); } else { g.addColorStop(0, '#fbf1d8'); g.addColorStop(1, '#e9d9b0'); }
  c.fillStyle = g; c.beginPath(); c.roundRect(x, y, w, h, h / 2); c.fill(); c.restore();
  emo(c, e, x + 16, y + h / 2 + 1, 16);
  const f = fit(c, label, w - 40, 14); c.font = `800 ${f}px Nunito, sans-serif`;
  c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = dark ? '#f5e8c8' : '#3a2a12'; c.fillText(label, x + 30, y + h / 2 + 1);
}
function drawClues(c, time) {
  const t = T[lang], cl = S.cl, ok = cl.res.filter((r, k) => r && (r.bin === 'real') === CL[k].real).length;
  BIN.forEach((b, n) => {
    const real = n === 0;
    c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 12; c.shadowOffsetY = 4;
    const g = c.createLinearGradient(0, b.y, 0, b.y + b.h);
    if (real) { g.addColorStop(0, '#a85f43'); g.addColorStop(1, '#5d3224'); } else { g.addColorStop(0, '#e6d6ab'); g.addColorStop(1, '#a9946a'); }
    c.fillStyle = g; c.beginPath(); c.roundRect(b.x, b.y, b.w, b.h, 16); c.fill(); c.restore();
    c.lineWidth = 1.5; c.strokeStyle = real ? '#2e1810' : '#5d4a2a'; c.beginPath(); c.roundRect(b.x, b.y, b.w, b.h, 16); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1; c.beginPath(); c.roundRect(b.x + 3, b.y + 3, b.w - 6, b.h - 6, 13); c.stroke();
    emo(c, real ? '⚔️' : '📜', b.x + b.w / 2, b.y + 20, 20);
    t.cl.bins[n].forEach((line, k) => txt(c, line, b.x + b.w / 2, b.y + 43 + k * 18, 15, 800, real ? '#fff4dc' : '#3a2a12'));
    if (cl.glow && cl.glow.bin === n && time - cl.glow.at < 1.3) {
      c.save(); c.shadowBlur = 14; c.shadowColor = 'rgba(61,220,151,.9)'; c.strokeStyle = `rgba(61,220,151,${1 - (time - cl.glow.at) / 1.3})`; c.lineWidth = 3;
      c.beginPath(); c.roundRect(b.x, b.y, b.w, b.h, 16); c.stroke(); c.restore();
    }
  });
  // sorted tags fly to their pile
  const slot = [0, 0];
  cl.res.forEach((r, k) => {
    if (!r) return;
    const n = CL[k].real ? 0 : 1, b = BIN[n], s = slot[n]++, ty = b.y + 82 + s * 36;
    const p = back(clamp((time - r.at) / 0.6, 0, 1)), e = ease(clamp((time - r.at) / 0.6, 0, 1));
    const x = b.x + 10, y = (CX * 0 + 12) + (ty - 12) * p, xx = lerpN(CX - (b.w - 20) / 2, x, e);
    tag(c, xx, Math.max(8, y), b.w - 20, 30, CL[k].emo, t.cl.clues[k].short, n === 1);
  });
  // the card waiting to be sorted
  if (cl.i < CL.length && !cl.res[cl.i]) {
    const y = 12 + Math.sin(time * 2) * 2, pop = clamp((time - cl.at) / 0.35, 0, 1);
    c.save(); c.translate(CX, y + 26); c.scale(0.8 + 0.2 * back(pop), 0.8 + 0.2 * back(pop)); c.translate(-CX, -(y + 26));
    c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 10; c.shadowOffsetY = 3;
    const g = c.createLinearGradient(0, y, 0, y + 52); g.addColorStop(0, '#fff6dd'); g.addColorStop(1, '#e6d3a0');
    c.fillStyle = g; c.beginPath(); c.roundRect(CX - 100, y, 200, 52, 14); c.fill(); c.restore();
    c.strokeStyle = '#8a6d36'; c.lineWidth = 1.2; c.beginPath(); c.roundRect(CX - 100, y, 200, 52, 14); c.stroke();
    emo(c, CL[cl.i].emo, CX - 74, y + 27, 28);
    const f = fit(c, t.cl.clues[cl.i].short, 128, 17); c.font = `800 ${f}px Nunito, sans-serif`;
    c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = '#3a2a12'; c.fillText(t.cl.clues[cl.i].short, CX - 50, y + 27);
  } else if (cl.i >= CL.length) {
    pill(c, `✓ ${ok} / ${CL.length}`, CX, 38, 18, 'rgba(10,12,20,.82)', '#3ddc97');
  }
}
const lerpN = (a, b, t) => a + (b - a) * t;

// --- input ---------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function digCol(j) {
  if (S.d[j] >= NL) { sfx.bad(); return; }
  const i = NL - 1 - S.d[j];
  S.d[j]++; S.last = i; S.lastCol = j; S.dugAt[j * NL + i] = now(); S.anyDig = true;
  burst(colX(j), yAt(i + 1, colX(j)), LAY[i].c, 12); sfx.snap(); render();
}
function potPick(x, y) {
  const P = S.pot;
  if (P.n >= ORDER.length || P.picked !== null || y < YTOP - 14 || y > YBOT) return;
  const i = clamp(NL - 1 - Math.floor((y - YTOP) / STEP), 0, NL - 1);
  P.picked = i; P.at = now();
  if (i === ORDER[P.n]) { P.ok++; sfx.good(); } else sfx.bad();
  render();
}
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'dig' || S.pred.dig === null) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.sc, y = (ev.clientY - r.top - G.oy) / G.sc;
  if (S.secD === 'pot') return potPick(x, y);
  if (y < 40 || y > YBOT + 4 || Math.abs(x - CX) > hw(clamp(y, YTOP, YBOT)) + 8) return;
  digCol(clamp(Math.round((x - CX) / 50) + 1, 0, 2));
});

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  const t = T[lang];
  if (act === 'dpick') { S.pred.dig = i; (i === t.dig.ok ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  if (act === 'dreset') { S.d = [0, 0, 0]; S.last = -1; S.lastCol = -1; S.dugAt = {}; S.anyDig = false; sfx.click(); }
  else if (act === 'tpick') { S.pred.trench = i; (i === t.tr.ok ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  else if (act === 'tcut') { S.cut = 1; S.cutDone = false; sfx.push(); showStage(); }
  else if (act === 'treset') { S.cut = 0; S.cutDone = false; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'pot') { S.secD = S.secD === 'pot' ? null : 'pot'; if (S.secD) S.pot = { n: 0, ok: 0, picked: null, at: -9 }; }
    else S.secT = S.secT === 'gold' ? null : 'gold';
    sfx.click();
  } else if (act === 'pnext') { S.pot.n++; S.pot.picked = null; sfx.click(); }
  else if (act === 'pagain') { S.pot = { n: 0, ok: 0, picked: null, at: -9 }; sfx.click(); }
  else if (act === 'cbin') {
    const cl = S.cl, real = b.dataset.b === 'real', k = cl.i;
    cl.res[k] = { bin: b.dataset.b, at: now() }; cl.glow = { bin: CL[k].real ? 0 : 1, at: now() };
    (real === CL[k].real ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'cnext') { S.cl.i++; S.cl.at = now(); sfx.click(); }
  else if (act === 'cagain') { S.cl = { i: 0, res: [], at: now() }; sfx.click(); }
  render();
});

// --- one render per change: controls, readout and the state card ------------------------------------------------------
const secChip = (k, e, on) => {
  const open = secret.unlocked(), t = T[lang];
  return `<button type="button" class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k === 'pot' ? 'b' : 'a'][0])}` : '🔒 ???'}</button>`;
};
const optsHtml = (opts, act) => `<div class="tr-opts">${opts.map((o, i) => `<button type="button" class="tr-o" data-act="${act}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
const rng = (t, i) => t.range(LAY[i].from, LAY[i].to);
const lname = (t, i) => `${t.troy} ${LAY[i].r}`;

function render() {
  const t = T[lang], v = lab.view;
  $('gauge').style.visibility = 'hidden';
  if (v === 'dig') renderDig(t); else if (v === 'trench') renderTrench(t); else renderClues(t);
}

function renderDig(t) {
  const p = S.pred.dig, d = t.dig, body = $('trBody');
  lab.setGlow('rgba(181, 118, 58, .28)');
  if (p === null) {
    body.innerHTML = `<p class="tr-q">${esc(d.q)}</p>${optsHtml(d.opts, 'dpick')}`;
    lab.setReadout('?', '', '', '#b5763a');
    lab.setState({ emo: '🤔', title: d.q, lead: d.lead, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const ok = p === d.ok, pot = S.secD === 'pot', verdict = `<div class="tr-v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.no)}</div>`;
  const row = `<div class="row2">${pot ? '' : `<button type="button" class="chip" data-act="dreset">${esc(d.reset)}</button>`}${secChip('pot', '🏺', pot)}</div>`;
  if (pot) { renderPot(t, verdict, row); return; }
  body.innerHTML = `${verdict}<p class="tr-n">${esc(d.why)}</p><p class="tr-n">${esc(d.go)}</p>${row}`;
  const n = Math.max(...S.d), i = S.last;
  if (i < 0) {
    lab.setReadout('—', d.idle, '', '#b5763a');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.no, lead: d.why, body: d.go, extra: '' });
  } else {
    lab.setReadout(lname(t, i), `≈ ${rng(t, i)}`, d.pill(n), LAY[i].c);
    lab.setState({ emo: FIND[i], title: lname(t, i), lead: t.finds[i], body: `≈ ${rng(t, i)}. ${i > 0 ? d.below(LAY[i - 1].r) : d.bottom}`, extra: '' });
  }
  lab.setFacts(t.facts.dig);
}

function renderPot(t, verdict, row) {
  const P = S.pot, pt = t.pot, body = $('trBody'), end = P.n >= ORDER.length;
  lab.setGlow('rgba(201, 130, 79, .28)');
  const shown = P.n + (P.picked !== null ? 1 : 0);
  let html;
  if (end) {
    html = `<div class="tr-end">${esc(pt.end(P.ok))}</div><button type="button" class="btn" data-act="pagain">${esc(pt.again)}</button>`;
    lab.setState({ emo: '🏆', title: pt.end(P.ok), lead: pt.why, body: '', extra: '' });
  } else if (P.picked === null) {
    html = `<p class="tr-q">${esc(pt.q)}</p><p class="tr-n">${esc(pt.lead)}</p>`;
    lab.setState({ emo: '🏺', title: pt.q, lead: pt.lead, body: '', extra: '' });
  } else {
    const tg = ORDER[P.n], ok = P.picked === tg, last = P.n === ORDER.length - 1;
    html = `<div class="tr-v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.no)}</div><p class="tr-n">${esc(pt.right(LAY[tg].r, rng(t, tg)))}</p><p class="tr-n">${esc(pt.why)}</p>
      <button type="button" class="btn" data-act="pnext">${esc(last ? pt.fin : pt.next)}</button>`;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.no, lead: pt.right(LAY[tg].r, rng(t, tg)), body: pt.why, extra: '' });
  }
  body.innerHTML = `${html}<div class="tr-sp">${row}</div>`;
  lab.setReadout(`${P.ok}/${shown}`, pt.sub, '', '#c9824f'); lab.setFacts([]);
}

function renderTrench(t) {
  const p = S.pred.trench, r = t.tr, body = $('trBody');
  lab.setGlow('rgba(169, 87, 63, .28)');
  if (p === null) {
    body.innerHTML = `<p class="tr-q">${esc(r.q)}</p>${optsHtml(r.opts, 'tpick')}`;
    lab.setReadout('?', '', '', '#a9573f');
    lab.setState({ emo: '🤔', title: r.q, lead: r.lead, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const ok = p === r.ok, gold = S.secT === 'gold', cut = S.cut === 1, fin = cut && S.cutDone;
  const note = p === 0 ? r.notes[0](t.num(over(GAP_II))) : p === 2 ? r.notes[1](t.num(over(GAP_IX))) : '';
  const verdict = `<div class="tr-v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.no)}</div>${note ? `<p class="tr-n">${esc(note)}</p>` : ''}`;
  const act = cut ? `<button type="button" class="chip" data-act="treset">${esc(r.reset)}</button>` : `<button type="button" class="btn" data-act="tcut">${esc(r.btn)}</button>`;
  body.innerHTML = `${verdict}${cut ? '' : `<p class="tr-n">${esc(r.go)}</p>`}<div class="row2" style="margin-top:0">${act}${secChip('gold', '👑', gold)}</div>`;
  const war = `${LAY[WAR_FROM].r}–${LAY[WAR_TO].r}`;
  if (gold) {
    const n = over(GAP_II);
    lab.setReadout(`${t.num(n)}+`, t.g.sub, '', '#e2a928');
    lab.setState({ emo: '👑', title: t.secrets.a[0], lead: t.g.lead, body: t.g.body(t.num(n)), extra: '' }); lab.setFacts(t.facts.trench);
    return;
  }
  if (!cut) {
    lab.setReadout(`${t.troy} ${war}`, `${r.match} ≈ ${t.ym(WAR)}`, '', '#a9573f');
    lab.setState({ emo: ok ? '✅' : '🎯', title: ok ? t.right : t.no, lead: r.why, body: r.go, extra: '' });
  } else if (!fin) {
    lab.setReadout('…', '', '', '#8a8f9c');
    lab.setState({ emo: '⛏️', title: r.cutting[0], lead: r.cutting[1], body: '', extra: '' });
  } else {
    lab.setReadout(String(CUT_N), r.cutSub(CUT_N), `${t.troy} ${LAY[TR_LAYER + 1].r}–${LAY[NL - 1].r}`, '#8a8f9c');
    lab.setState({ emo: '🕳️', title: r.cutT(CUT_N), lead: r.cutL, body: r.cutB, extra: '' });
  }
  lab.setFacts(t.facts.trench);
}

function renderClues(t) {
  const cl = S.cl, c = t.cl, body = $('trBody'), n = CL.length;
  lab.setGlow('rgba(168, 95, 67, .28)');
  const sorted = cl.res.filter(Boolean).length, ok = cl.res.filter((r, k) => r && (r.bin === 'real') === CL[k].real).length;
  if (cl.i >= n) {
    body.innerHTML = `<div class="tr-end">${esc(c.end(ok))}</div><button type="button" class="btn" data-act="cagain">${esc(c.again)}</button>`;
    lab.setReadout(`${ok}/${n}`, c.sub, '', '#3ddc97');
    lab.setState({ emo: '🏆', title: c.end(ok), lead: c.endL, body: '', extra: '' }); lab.setFacts(t.facts.clues);
    return;
  }
  const k = cl.i, r = cl.res[k], clue = c.clues[k];
  let html = `<div class="tr-card"><span class="e">${CL[k].emo}</span><span class="x">${esc(clue.text)}</span></div>`;
  if (!r) {
    html += `<div class="tr-bins">${['real', 'poem'].map((bn, m) => `<button type="button" class="tr-o" data-act="cbin" data-b="${bn}">${esc(c.btns[m])}</button>`).join('')}</div>`;
    lab.setState({ emo: '🔎', title: c.q, lead: c.lead, body: '', extra: '' });
  } else {
    const good = (r.bin === 'real') === CL[k].real, binName = c.bins[CL[k].real ? 0 : 1].join(' ');
    html += `<div class="tr-v ${good ? 'ok' : 'no'}">${esc(good ? t.right : t.no)}</div><p class="tr-n">${esc((good ? '' : `${c.wrongIn(binName)} `) + clue.why)}</p>
      <button type="button" class="btn" data-act="cnext">${esc(k === n - 1 ? c.fin : c.next)}</button>`;
    lab.setState({ emo: good ? '✅' : '🤔', title: good ? t.right : c.wrongIn(binName), lead: clue.why, body: '', extra: '' });
  }
  body.innerHTML = html;
  lab.setReadout(`${sorted}/${n}`, c.sub, sorted ? `✓ ${ok}` : '', '#a85f43'); lab.setFacts([]);
}
S.cl.at = now();
render();
</script>
</body>
</html>
