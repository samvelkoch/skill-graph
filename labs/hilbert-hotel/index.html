  lab.setReadout(String(r), `2^${b} × 3^${p}`, `${s.bus} ${b} · ${s.seat} ${p}`, '#8f7fd0');
  lab.setState({ emo: '🚌', title: s.stT(b, p, r), lead: s.stL(b, p, r, f), body: s.stB(rooms.length, new Set(rooms).size), extra: '' }); lab.setFacts([]);
}
function renderSecB(t) {
