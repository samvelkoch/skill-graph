$('ctrlBody').innerHTML = '<div class="chips" id="secChips"></div>';
$('overlay').innerHTML = `<div class="sc-phone"><div class="sc-notch"></div><div class="sc-screen">
  <div class="sc-status"><span>9:41</span><i>▂▄▆ ▮</i></div><div id="scApp"></div><div class="sc-home"></div><div class="sc-glass"></div></div></div>`;

// --- scene: desk, lamp light, a glow behind the phone --------------------------------------------------------
const motes = Array.from({ length: 16 }, (_, i) => ({ x: (i * 0.137) % 1, y: (i * 0.291) % 1, s: 1 + (i % 3), p: i * 1.7 }));
canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  for (let i = 0; i < 3; i++) S.glow[i] = lerp(S.glow[i], S.glowT[i], clamp(dt * 4, 0, 1));
  const deskY = h * 0.46;
  let g = ctx.createLinearGradient(0, 0, 0, deskY);
  g.addColorStop(0, '#171c38'); g.addColorStop(1, '#262e58');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, deskY);
  g = ctx.createLinearGradient(0, deskY, 0, h);
  g.addColorStop(0, '#7a5439'); g.addColorStop(1, '#3a281c');
  ctx.fillStyle = g; ctx.fillRect(0, deskY, w, h - deskY);
  ctx.fillStyle = 'rgba(255,230,190,.35)'; ctx.fillRect(0, deskY, w, 2);
  ctx.strokeStyle = 'rgba(0,0,0,.14)'; ctx.lineWidth = 1;
  for (let i = 1; i < 9; i++) { const y = deskY + (h - deskY) * (i / 9); ctx.beginPath(); ctx.moveTo(0, y); ctx.bezierCurveTo(w * .3, y - 4, w * .6, y + 5, w, y - 2); ctx.stroke(); }
  g = ctx.createRadialGradient(w * 0.1, 0, 4, w * 0.1, 0, Math.max(10, h * 0.9));
  g.addColorStop(0, 'rgba(255,236,190,.34)'); g.addColorStop(1, 'rgba(255,236,190,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const [r, gg, b] = S.glow.map(Math.round);
  g = ctx.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, Math.max(20, Math.min(w, h) * 0.75));
  g.addColorStop(0, `rgba(${r},${gg},${b},.38)`); g.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  if (w > 520) { // mug and pencil on wide screens
    ctx.save(); ctx.globalAlpha = 1;
    const mx = w * 0.88, my = h * 0.82;
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(mx + 6, my + 30, 34, 9, 0, 0, 7); ctx.fill();
    g = ctx.createLinearGradient(mx - 28, 0, mx + 28, 0); g.addColorStop(0, '#f2f4ff'); g.addColorStop(1, '#aab4d8');
    ctx.fillStyle = g; ctx.strokeStyle = '#7f89b0'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(mx - 28, my - 28, 56, 58, 10); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(mx + 30, my, 14, -1.3, 1.3); ctx.stroke();
    ctx.fillStyle = '#5a3a24'; ctx.beginPath(); ctx.ellipse(mx, my - 27, 26, 6, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(255,240,200,.5)';
  for (const m of motes) {
    const x = ((m.x + t * 0.01 * m.s) % 1) * w, y = (m.y * 0.7 + Math.sin(t * 0.5 + m.p) * 0.02) * h;
    ctx.beginPath(); ctx.arc(x, y, Math.max(0, m.s * 0.7), 0, 7); ctx.fill();
  }
});

// --- helpers -------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const plain = (s) => s.replace(/\{\w\|([^}]*)\}/g, '$1');
const flagged = (s, reveal) => {
  let n = 0;
  return esc(s).replace(/\{(\w)\|([^}]*)\}/g, (_, k, tx) => reveal
    ? `<span class="sc-hl on">${tx}<i class="sc-flag" style="--d:${(n++) * 0.18 + 0.1}s">🚩</i></span>` : tx);
};
const marked = (s) => esc(s).replace(/\{([^}]*)\}/g, '<mark>$1</mark>');
const rgb = { green: [47, 191, 113], red: [229, 72, 61], amber: [245, 183, 59], blue: [78, 168, 255] };
const app = (head, body, foot) => `<div class="sc-head">${head}</div><div class="sc-body">${body}</div>${foot ? `<div class="sc-foot">${foot}</div>` : ''}`;
const verdictHtml = (ok, t) => `<div class="sc-verdict ${ok ? 'good' : 'meh'}">${ok ? '✓ ' + esc(t.right) : esc(t.wrong)}</div>`;
const nextUnanswered = () => S.inbox.ans.findIndex((a) => a === null);

// --- screens -------------------------------------------------------------------------------------------------
function screenInbox(t) {
  const I = S.inbox, done = I.ans.every((a) => a !== null);
  if (I.open < 0) {
    const rows = t.msgs.map((m, i) => {
      const a = I.ans[i];
      const st = a === null ? '<span class="sc-dot"></span>' : m.scam ? '🚩' : '<span class="sc-ok">✓</span>';
      const pv = plain(m.text);
      return `<button class="sc-row ${a === null ? '' : 'done'}" data-act="open" data-i="${i}"><span class="sc-av">${m.av}</span>
        <span class="sc-tx"><b>${esc(m.from)}</b><span>${esc(pv)}</span></span><span class="sc-st">${st}</span></button>`;
    }).join('');
    const right = I.ans.filter((a, i) => a !== null && (a === 'scam') === !!t.msgs[i].scam).length;
    const sum = done ? `<div class="sc-sum">${esc(t.sumIn(right))}</div>` : '';
    return app(`${esc(t.app)}<small>${I.ans.filter((a) => a !== null).length}/6</small>`, sum + rows,
      done ? `<button class="sc-b go" data-act="again">${esc(t.again)}</button>` : '');
  }
  const m = t.msgs[I.open], a = I.ans[I.open], rev = a !== null, ok = rev && (a === 'scam') === !!m.scam;
  const kinds = [...new Set([...m.text.matchAll(/\{(\w)\|/g)].map((x) => x[1]))];
  const body = `<div class="sc-who"><span class="sc-av">${m.av}</span>${esc(m.from)}</div>
    <div class="sc-bubble ${rev && !m.scam ? 'safe' : ''}">${flagged(m.text, rev && !!m.scam)}${rev && !m.scam ? '<span class="sc-tick">✓</span>' : ''}</div>
    ${rev && m.scam ? `<div class="sc-legend">${kinds.map((k) => `<span>🚩 ${esc(t.flags[k])}</span>`).join('')}</div>` : ''}`;
  const foot = rev
    ? `${verdictHtml(ok, t)}<button class="sc-b go" data-act="nxt">${esc(t.nextBtn)}</button>`
    : `<div class="sc-btns"><button class="sc-b" data-act="ans" data-v="safe">✅ ${esc(t.safe)}</button><button class="sc-b" data-act="ans" data-v="scam">🚩 ${esc(t.scam)}</button></div>`;
  return app(`<button class="sc-bk" data-act="back" aria-label="back">‹</button>${esc(t.app)}`, body, foot);
}

function screenLinks(t) {
  const L = S.links, r = L.r, done = r >= 3;
  if (done) {
    const right = L.ans.filter((a, i) => a === LINKS[i].realAt).length;
    return app(esc(t.browser), `<div class="sc-sum">${esc(t.sumLn(right))}</div><p class="sc-cap">${esc(t.linkBody)}</p>`,
      `<button class="sc-b go" data-act="again">${esc(t.again)}</button>`);
  }
  const R = LINKS[r], a = L.ans[r], rev = a !== null;
  const items = R.realAt === 0 ? [R.real, R.fake] : [R.fake, R.real];
  const cards = items.map((s, i) => {
    const isReal = i === R.realAt;
    const cls = rev ? (isReal ? 'real' : 'fake') + (a === i ? ' mine' : '') : '';
    return `<button class="sc-link ${cls}" data-act="pick" data-i="${i}" ${rev ? 'disabled' : ''}><span class="g">🌐</span><span>${isReal || !rev ? esc(s.replace(/[{}]/g, '')) : marked(s)}</span>
      ${rev ? `<span class="tag">${isReal ? '✓ ' + esc(t.real) : '🚩 ' + esc(t.fake)}</span>` : ''}</button>`;
  }).join('');
  const lens = rev ? `<div class="sc-lensbox"><div class="sc-lens">${marked(R.zoom)}</div><div class="sc-cap">${esc(t.caps[r])}</div></div>` : '';
  const foot = rev
    ? `${verdictHtml(a === R.realAt, t)}<button class="sc-b go" data-act="lnext">${esc(t.nextBtn)}</button>`
    : `<div class="sc-dots">${[0, 1, 2].map((i) => `<i class="${i === r ? 'on' : ''}"></i>`).join('')}</div>`;
  return app(`${esc(t.browser)}<small>${r + 1}/3</small>`, `<div class="sc-q">${esc(t.linkQ)}</div>${cards}${lens}`, foot);
}

function screenNext(t) {
  const N = S.next, r = N.r;
  if (r >= 3) {
    const good = N.ans.filter((a, i) => a === NX_BEST[i]).length;
    return app(esc(t.chat), `<div class="sc-sum">${esc(t.sumNx(good))}</div><p class="sc-cap">${esc(t.nxBody)}</p>`,
      `<button class="sc-b go" data-act="again">${esc(t.again)}</button>`);
  }
  const sc = t.nx[r], a = N.ans[r], rev = a !== null;
  const chs = sc.ch.map((c, i) => {
    const best = rev && i === NX_BEST[r];
    return `<button class="sc-ch ${best ? 'best' : rev ? 'bad' : ''} ${rev && N.shown === i ? 'shown' : ''}" data-act="cpick" data-i="${i}"><span class="e">${c.e}</span><span>${esc(c.t)}${best ? ` ✓` : ''}</span></button>`;
  }).join('');
  let story = '';
  if (rev && N.shown >= 0) {
    const c = sc.ch[N.shown], best = N.shown === NX_BEST[r];
    story = `<div class="sc-story ${best ? 'best' : 'bad'}"><div class="sc-scene">${c.sc.map((e, i) => `<span style="animation-delay:${i * 0.12}s">${e}</span>`).join('<b>›</b>')}</div><p>${esc(c.s)}</p></div>`;
  }
  const foot = rev ? `${verdictHtml(a === NX_BEST[r], t)}<button class="sc-b go" data-act="xnext">${esc(t.nextBtn)}</button>`
    : `<div class="sc-dots">${[0, 1, 2].map((i) => `<i class="${i === r ? 'on' : ''}"></i>`).join('')}</div>`;
  return app(`<span class="sc-av" style="width:30px;height:30px;font-size:16px">${sc.av}</span>${esc(sc.from)}`,
    `<div class="sc-msgq">${esc(sc.msg)}</div>${chs}${story}`, foot);
}

const pwBits = (n) => n * 3.9; // log10 of 7776^n, roughly
function screenPw(t) {
  const p = t.pw, n = S.pwN, phrase = S.pwWords.slice(0, n).join('-');
  const fill = clamp(pwBits(n) / 16, 0.05, 1) * 100;
  const body = `<div class="sc-bars">
    <div class="sc-pw"><code>12345</code><div class="sc-track"><div class="sc-fill" style="width:4%"></div></div><small>${esc(p.weak)} · ${esc(p.first)}</small></div>
    <div class="sc-pw"><code>${esc(phrase)}</code><div class="sc-track"><div class="sc-fill ok" style="width:${fill}%"></div></div><small>${esc(n >= 3 ? p.strong : p.weak)}${n >= 3 ? ' · ' + esc(p.many) : ''}</small></div></div>`;
  const foot = `<div class="sc-btns"><button class="sc-b" data-act="pwminus" ${n <= 1 ? 'disabled' : ''}>${esc(p.minus)}</button><button class="sc-b" data-act="pwplus" ${n >= 4 ? 'disabled' : ''}>${esc(p.plus)}</button></div>
    <button class="sc-b go" data-act="pwroll">${esc(p.roll)}</button>`;
  return app(`🔐 ${esc(t.secrets.password[0])}`, body, foot);
}
function screenTf(t) {
  const f = t.tf, s = S.tf, l1 = s >= 1, l2 = s === 2;
  const body = `<div class="sc-door ${l2 ? 'open' : ''}"><div class="sc-frame">🏠</div><div class="sc-leaf">
      <div class="sc-lock l1 ${l1 ? 'open' : ''}">${l1 ? '🔓' : '🔒'}</div><div class="sc-lock l2 ${l2 ? 'open' : s === 1 ? 'shake' : ''}">${l2 ? '🔓' : '🔒'}</div></div></div>
    <div class="sc-lbl">${esc(f.l1)}<br>${esc(f.l2)}</div>${s >= 1 ? `<div class="sc-code">${s === 2 ? '📲 ' + esc(S.tfCode) : '📲 ••••••'}</div>` : ''}`;
  const foot = `<div class="sc-btns"><button class="sc-b" data-act="tfthief">${esc(f.thief)}</button><button class="sc-b" data-act="tfyou">${esc(f.you)}</button></div>
    ${s ? `<button class="sc-b ghost" data-act="tfreset">${esc(f.reset)}</button>` : ''}`;
  return app(`📲 ${esc(t.secrets.twofactor[0])}`, body, foot);
}

// --- render ----------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = S.sec || v;
  $('scApp').innerHTML = S.sec === 'password' ? screenPw(t) : S.sec === 'twofactor' ? screenTf(t) : v === 'inbox' ? screenInbox(t) : v === 'links' ? screenLinks(t) : screenNext(t);
  $('secChips').innerHTML = ['password', 'twofactor'].map((k) => {
    const emo = k === 'password' ? '🔐' : '📲';
    return `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  }).join('');
  let st, ro, facts = [], g = 'blue';
  if (S.sec === 'password') {
    const n = S.pwN;
    ro = [t.pw.label[n - 1], t.pw.sub, '']; st = t.pw.st; facts = t.facts.next; g = n >= 3 ? 'green' : 'amber';
  } else if (S.sec === 'twofactor') {
    ro = [S.tf === 2 ? t.tf.open : t.tf.shut, t.tf.sub, '']; st = t.tf['s' + S.tf]; facts = t.facts.next; g = S.tf === 1 ? 'red' : S.tf === 2 ? 'green' : 'blue';
  } else if (v === 'inbox') {
    const I = S.inbox, n = I.ans.filter((a) => a !== null).length, a = I.ans[I.open], m = t.msgs[I.open];
    facts = t.facts.inbox; ro = [`${n}/6`, t.checked, ''];
    if (I.open < 0) st = n === 6 ? { emo: '🏁', title: t.sumIn(I.ans.filter((x, i) => (x === 'scam') === !!t.msgs[i].scam).length), lead: t.stop, body: '' } : t.idle;
    else if (a === null) st = t.open;
    else {
      const ok = (a === 'scam') === !!m.scam; ro[2] = ok ? t.right : t.wrong;
      st = { emo: m.scam ? '🚩' : '✅', title: m.scam ? t.scam : t.safe, lead: m.why, body: m.scam ? t.stop : '' };
      g = m.scam ? 'red' : 'green';
    }
  } else if (v === 'links') {
    const L = S.links, n = L.ans.filter((a) => a !== null).length, r = L.r, a = L.ans[r];
    ro = [`${n}/3`, t.checked, '']; st = t.idleL;
    if (r >= 3) st = { emo: '🏁', title: t.sumLn(L.ans.filter((x, i) => x === LINKS[i].realAt).length), lead: t.linkBody, body: '' };
    else if (a !== null) {
      const ok = a === LINKS[r].realAt; ro[2] = ok ? t.right : t.wrong; g = ok ? 'green' : 'amber';
      st = { emo: ok ? '🔍' : '🧐', title: ok ? t.right : t.wrong, lead: t.caps[r], body: t.linkBody };
    }
    if (r >= 3 || a !== null) facts = t.facts.links; // the fact names the trick, so it waits for the answer
  } else {
    const N = S.next, n = N.ans.filter((a) => a !== null).length, r = N.r, a = N.ans[r];
    ro = [`${n}/3`, t.checked, '']; st = t.nxIdle; facts = t.facts.next;
    if (r >= 3) st = { emo: '🏁', title: t.sumNx(N.ans.filter((x, i) => x === NX_BEST[i]).length), lead: t.nxBody, body: '' };
    else if (a !== null) {
      const ok = a === NX_BEST[r]; ro[2] = ok ? t.right : t.wrong; g = ok ? 'green' : 'amber';
      st = { emo: ok ? '🙋' : '🤔', title: ok ? t.best : t.wrong, lead: t.nx[r].ch[N.shown >= 0 ? N.shown : a].s, body: t.nxBody };
    }
  }
  S.glowT = rgb[g];
  lab.setReadout(ro[0], ro[1], ro[2]);
  lab.setState(st);
  lab.setFacts(facts);
}

// --- input -----------------------------------------------------------------------------------------------------
const newWords = () => {
  const w = [...T[lang].pw.words];
  for (let i = w.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [w[i], w[j]] = [w[j], w[i]]; }
  S.pwWords = w.slice(0, 4);
};
const onAct = (b) => {
  const act = b.dataset.act, i = +b.dataset.i;
  const I = S.inbox, L = S.links, N = S.next;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k;
    if (S.sec === 'password') { newWords(); S.pwN = 3; }
    if (S.sec === 'twofactor') S.tf = 0;
    sfx.click(); return render();
  }
  if (act === 'pwroll') { newWords(); sfx.tick(); }
  else if (act === 'pwplus') { S.pwN = Math.min(4, S.pwN + 1); sfx.tick(); }
  else if (act === 'pwminus') { S.pwN = Math.max(1, S.pwN - 1); sfx.tick(); }
  else if (act === 'tfthief') { S.tf = 1; sfx.bad(); }
  else if (act === 'tfyou') { S.tf = 2; S.tfCode = String(Math.floor(100000 + Math.random() * 900000)); sfx.good(); }
  else if (act === 'tfreset') { S.tf = 0; sfx.click(); }
  else if (act === 'open') { I.open = i; sfx.click(); }
  else if (act === 'back') { I.open = -1; sfx.click(); }
  else if (act === 'ans') {
    I.ans[I.open] = b.dataset.v;
    const ok = (b.dataset.v === 'scam') === !!T[lang].msgs[I.open].scam; (ok ? sfx.good : sfx.bad)(); render(); return showStage();
  }
  else if (act === 'nxt') { const n = nextUnanswered(); I.open = n; sfx.click(); }
  else if (act === 'pick') {
    L.ans[L.r] = i; (i === LINKS[L.r].realAt ? sfx.good : sfx.bad)(); render(); return showStage();
  }
  else if (act === 'lnext') { L.r++; sfx.click(); }
  else if (act === 'cpick') {
    if (N.ans[N.r] === null) { N.ans[N.r] = i; (i === NX_BEST[N.r] ? sfx.good : sfx.bad)(); N.shown = i; render(); return showStage(); }
    N.shown = i; sfx.tick();
  }
  else if (act === 'xnext') { N.r++; N.shown = -1; sfx.click(); }
  else if (act === 'again') {
    if (lab.view === 'inbox') S.inbox = { ans: Array(6).fill(null), open: -1 };
    else if (lab.view === 'links') S.links = { ans: [null, null, null], r: 0 };
    else S.next = { ans: [null, null, null], r: 0, shown: -1 };
    sfx.click();
  }
  render();
};
$('overlay').addEventListener('click', (ev) => { const b = ev.target.closest('[data-act]'); if (b && !b.disabled) onAct(b); });
$('ctrlBody').addEventListener('click', (ev) => { const b = ev.target.closest('[data-act]'); if (b) onAct(b); });

newWords();
render();
</script>
</body>
</html>
