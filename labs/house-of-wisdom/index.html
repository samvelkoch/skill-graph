  const wall = c.createLinearGradient(0, 0, 0, 330); wall.addColorStop(0, mixc('#3a4668', -0.1)); wall.addColorStop(1, mixc('#1c2238', -0.1)); c.fillStyle = wall; c.fillRect(0, 0, W, H);
  c.fillStyle = '#4a3220'; c.fillRect(0, 252, W, 80);
  const tg = c.createLinearGradient(0, 252, 0, 332); tg.addColorStop(0, 'rgba(255,214,150,.25)'); tg.addColorStop(1, 'rgba(0,0,0,.4)'); c.fillStyle = tg; c.fillRect(0, 252, W, 80);
  // lamp light
  const lg = c.createRadialGradient(lx, ly, 6, lx, ly, 230); lg.addColorStop(0, `rgba(255,224,140,${0.55 * lit})`); lg.addColorStop(1, 'rgba(255,224,140,0)'); c.fillStyle = lg; c.fillRect(0, 0, W, H);
  // apple
  const ag = c.createRadialGradient(ax - 9, ay - 11, 3, ax, ay, 32); ag.addColorStop(0, '#ff8a70'); ag.addColorStop(0.6, '#d03a2a'); ag.addColorStop(1, '#7c1a14');
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 8; c.shadowOffsetY = 5; c.fillStyle = ag; c.beginPath(); c.ellipse(ax, ay, 31, 29, 0, 0, 7); c.fill(); c.restore();
  c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(ax - 12, ay - 12, 7, 4, -0.7, 0, 7); c.fill();
  c.strokeStyle = '#4a2e14'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(ax, ay - 26); c.quadraticCurveTo(ax + 2, ay - 38, ax + 8, ay - 42); c.stroke();
  c.fillStyle = '#5faa4a'; c.beginPath(); c.ellipse(ax + 14, ay - 38, 11, 5, -0.5, 0, 7); c.fill();
  // darkness
  c.fillStyle = `rgba(3,5,12,${0.88 * (1 - lit)})`; c.fillRect(0, 0, W, H);
  // lamp (on top of the darkness)
  c.strokeStyle = '#2a2e3d'; c.lineWidth = 5; c.beginPath(); c.moveTo(lx, 0); c.lineTo(lx, ly - 30); c.stroke();
  c.beginPath(); c.moveTo(lx - 26, ly - 8); c.lineTo(lx - 12, ly - 34); c.lineTo(lx + 12, ly - 34); c.lineTo(lx + 26, ly - 8); c.closePath(); c.fillStyle = '#3c4258'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#1b1410'; c.stroke();
  c.beginPath(); c.arc(lx, ly + 2, 14, 0, 7); const bg = c.createRadialGradient(lx - 4, ly - 2, 2, lx, ly + 2, 15); bg.addColorStop(0, lit > 0.5 ? '#fffbe0' : '#b8bccb'); bg.addColorStop(1, lit > 0.5 ? '#ffd45e' : '#6a6f82'); c.fillStyle = bg; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#1b1410'; c.stroke();
  // eye
  const eg = c.createRadialGradient(ex - 6, ey - 8, 4, ex, ey, 38); eg.addColorStop(0, '#ffffff'); eg.addColorStop(1, '#cdd4e6');
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 8; c.fillStyle = eg; c.beginPath(); c.ellipse(ex, ey, 38, 28, 0, 0, 7); c.fill(); c.restore();
  c.lineWidth = 2; c.strokeStyle = '#1b1410'; c.beginPath(); c.ellipse(ex, ey, 38, 28, 0, 0, 7); c.stroke();
  const ig = c.createRadialGradient(ex - 12, ey, 2, ex - 12, ey, 15); ig.addColorStop(0, '#6aa6d8'); ig.addColorStop(1, '#1f4f7c'); c.fillStyle = ig; c.beginPath(); c.arc(ex - 12, ey, 15, 0, 7); c.fill();
  c.fillStyle = '#0a0d14'; c.beginPath(); c.arc(ex - 12, ey, 7, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(ex - 16, ey - 5, 3, 0, 7); c.fill();
  if (!asked) { txt(c, '?', 180, 60, 40, 'rgba(255,255,255,.55)', { font: SERIF, weight: 500 }); return; }
  // rays
  const dots = (x0, y0, x1, y1, col, dir) => {
    c.strokeStyle = col; c.lineWidth = 2; c.setLineDash([6, 6]); c.lineDashOffset = -tm * 20 * dir; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); c.setLineDash([]);
  };
  c.save(); c.globalAlpha = eOut((tm - S.bAt) / 0.5);
  if (S.theory === 'eye') {
    [-12, 0, 12].forEach((o) => dots(ex - 40, ey + o * 0.4, ax + 24, ay - 8 + o, 'rgba(110,200,255,.85)', 1));
    pill(c, t.thLabelEye, 250, 28, { size: 13, bg: 'rgba(110,200,255,.85)', fg: '#06141f' });
    if (!S.lamp) pill(c, t.darkNote, 180, 290, { size: 13, bg: 'rgba(255,90,70,.92)' });
  } else {
    pill(c, t.thLabelLight, 250, 28, { size: 13, bg: 'rgba(255,214,110,.92)', fg: '#2a1d0e' });
    if (S.lamp) { [-10, 0, 10].forEach((o) => dots(lx + 22, ly + 12 + o * 0.5, ax - 24, ay - 12 + o, 'rgba(255,224,120,.95)', -1)); [-8, 0, 8].forEach((o) => dots(ax + 28, ay - 6 + o, ex - 38, ey + o * 0.5, 'rgba(255,224,120,.95)', -1)); }
  }
  c.restore();
}

const VIEWKEY = () => (S.sec ? 'sec' + S.sec : lab.view);
const DRAW = { books: drawBooks, digits: (c, W, H, tm) => (S.dm === 'add' ? drawAdd(c, W, H, tm) : drawYear(c, W, H, tm)), words: drawWords, seca: drawSecA, secb: drawSecB };

// --- controls -----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function revealBook(code) {
  if (S.guess !== null || S.pend !== null || S.stop >= 3) return;
  S.guess = code; S.pend = S.stop + 1; S.at = now();
  (code === BK[S.bk].lg[S.pend] ? sfx.good : sfx.bad)(); showStage();
}
function nextBook() {
  if (S.pend !== null) {
    S.stop = S.pend; S.pend = null; S.guess = null;
    if (S.stop === 3) S.done[S.bk] = true;
    sfx.click();
  } else if (S.stop >= 3) { S.bk = (S.bk + 1) % 3; S.stop = 0; S.guess = null; sfx.click(); }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'bkpick') { S.bk = +v; S.stop = 0; S.pend = null; S.guess = null; sfx.click(); }
  else if (a === 'bkopt') revealBook(v);
  else if (a === 'bknext') nextBook();
  else if (a === 'dmode') { if (v === 'year' && !S.dRev) return; S.dm = v; sfx.click(); }
  else if (a === 'dopt') { if (S.dRev) return; S.dPred = v; S.dRev = true; S.dT = now(); (v === 'dig' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'yrchip') { S.year = +v; S.yT = now(); sfx.tick(); }
  else if (a === 'wopt') { if (S.wRev) return; S.wGuess = v; S.wRev = true; S.wT = now(); const ok = (v === 'ar') === (WORDS[S.wOrder[S.wi]].org === 'ar'); S.wRes[S.wi] = ok; (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'wnext') { if (S.wi >= NW) { S.wi = 0; S.wOrder = shuffle([...Array(NW).keys()]); S.wRes = []; } else { S.wi++; } S.wGuess = null; S.wRev = false; sfx.click(); }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === v ? null : v; S.aAt = S.bAt = now(); sfx.click(); }
  else if (a === 'aopt') { if (S.aPred !== null) return; S.aPred = +v; S.aRev = now(); (+v === T[lang].sa.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'adig') { S.aSel = S.aSel === +v ? null : +v; sfx.tick(); }
  else if (a === 'bopt') { if (S.bPred !== null) return; S.bPred = v; S.lamp = false; S.theory = 'light'; S.bAt = now(); (v === 'n' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'lamp') { S.lamp = !S.lamp; sfx.click(); }
  else if (a === 'theory') { S.theory = v; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'yr') return;
  S.year = clamp(Math.round(+ev.target.value), 1, 3999); S.yT = now(); render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------------
const optBtn = (act, v, label, state) => `<button class="hw-opt ${state ?? ''}" data-act="${act}" data-v="${esc(v)}"${state ? ' disabled' : ''}>${esc(label)}</button>`;
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = VIEWKEY();
  $('vBooks').hidden = !!sec || v !== 'books'; $('vDigits').hidden = !!sec || v !== 'digits'; $('vWords').hidden = !!sec || v !== 'words';
  $('vSecA').hidden = sec !== 'a'; $('vSecB').hidden = sec !== 'b';
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-v="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('a', '📜') + sc('b', '👁️');
  if (sec === 'a') renderSecA(t); else if (sec === 'b') renderSecB(t);
  else if (v === 'books') renderBooks(t); else if (v === 'digits') renderDigits(t); else renderWords(t);
}

function renderBooks(t) {
  const k = S.bk, B = BK[k], tb = t.books[k], moving = S.pend !== null, atEnd = S.stop >= 3;
  lab.setGlow('rgba(95, 168, 160, .26)');
  $('bkChips').innerHTML = t.books.map((b, i) => `<button class="chip ${i === k ? 'on' : ''}" data-act="bkpick" data-v="${i}">${esc(b.chip)}</button>`).join('');
  const shown = moving ? S.pend : S.stop, city = t.cities[B.stops[shown]];
  // question
  const leg = S.stop;
  if (!atEnd) {
    $('bkQ').textContent = tb.ask[leg];
    const right = B.lg[leg + 1];
    $('bkOpts').innerHTML = B.opts[leg].map((code) => optBtn('bkopt', code, cap1(t.lg[code]), S.guess === null ? '' : code === right ? 'good' : code === S.guess ? 'bad' : 'dim')).join('');
    $('bkV').textContent = S.guess === null ? t.bk.pickHint : (S.guess === right ? t.bk.right : t.bk.wrong(t.lg[S.guess], t.lg[right]));
    $('bkV').className = 'hw-verdict' + (S.guess === null ? '' : S.guess === right ? ' good' : ' bad');
  } else {
    $('bkQ').textContent = t.bk.finTitle; $('bkOpts').innerHTML = ''; $('bkV').textContent = ''; $('bkV').className = 'hw-verdict';
  }
  const nb = $('bkNext');
  nb.hidden = !(moving || atEnd);
  nb.textContent = atEnd ? t.bk.another : t.bk.next(t.cities[B.stops[S.stop + 1]]);
  // readout
  lab.setReadout(esc(tb.date[shown]), city, t.stopOf(shown + 1), '#5fa8a0');
  // state card and facts
  const lgs = B.lg.slice(0, 3).map((c) => cap1(t.lg[c])).join(' → ');
  let facts = [];
  if (shown >= 1) facts = facts.concat(t.facts.bag);
  if (shown >= 2) facts = facts.concat(t.facts.tol);
  if (atEnd) lab.setState({ emo: '🏁', title: t.bk.finTitle, lead: lgs, body: `${tb.res[3]} ${S.done.every(Boolean) ? t.bk.all : t.bk.finBody}`, extra: '' });
  else if (S.guess !== null) {
    const right = B.lg[S.stop + 1], ok = S.guess === right;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.bk.right : t.bk.wrong(t.lg[S.guess], t.lg[right]), lead: tb.res[S.stop + 1], body: '', extra: '' });
  } else lab.setState({ emo: '📍', title: city, lead: tb.ask[leg], body: tb.res[S.stop], extra: '' });
  lab.setFacts(facts);
}

function renderDigits(t) {
  const d = t.dg, rev = S.dRev, yearMode = S.dm === 'year' && rev;
  lab.setGlow('rgba(95, 143, 208, .26)');
  if (!rev) S.dm = 'add';
  $('dgModes').innerHTML = `<button class="chip ${S.dm === 'add' ? 'on' : ''}" data-act="dmode" data-v="add">${esc(d.modeAdd)}</button>
    <button class="chip ${S.dm === 'year' ? 'on' : ''}" data-act="dmode" data-v="year"${rev ? '' : ' disabled'}>${rev ? '' : '🔒 '}${esc(d.modeYear)}</button>`;
  $('dgAdd').hidden = yearMode; $('dgYear').hidden = !yearMode;
  if (!yearMode) {
    $('dgQ').textContent = d.q;
    const right = 'dig';
    $('dgOpts').innerHTML = [['rom', d.optR], ['dig', d.optD]].map(([code, l]) => optBtn('dopt', code, l, !rev ? '' : code === right ? 'good' : code === S.dPred ? 'bad' : 'dim')).join('');
    $('dgV').textContent = rev ? (S.dPred === right ? d.right : d.notq) : (d.lockedHint);
    $('dgV').className = 'hw-verdict' + (rev ? (S.dPred === right ? ' good' : ' bad') : '');
    lab.setReadout('347 + 485', rev ? `= ${347 + 485}` : '= ?', rev ? `${d.moves(MOVES)} · ${d.steps(STEPS)}` : '', '#5f8fd0');
    if (!rev) lab.setState({ emo: '🔢', title: d.askTitle, lead: d.askLead, body: '', extra: '' });
    else lab.setState({ emo: S.dPred === right ? '✅' : '🤔', title: S.dPred === right ? d.right : d.notq, lead: d.lead(d.moves(MOVES), d.steps(STEPS)), body: d.body, extra: '' });
    lab.setFacts(rev ? t.facts.dg : []);
  } else {
    const y = S.year, rn = toRoman(y), nd = String(y).length;
    $('yrL').textContent = d.slider; $('yrV').textContent = y;
    if (+$('yr').value !== y) $('yr').value = y;
    $('yrChips').innerHTML = [1202, 1888, 2026, 3888].map((q) => `<button class="chip ${q === y ? 'on' : ''}" data-act="yrchip" data-v="${q}">${q}</button>`).join('');
    lab.setReadout(String(y), rn, d.pill(rn.length, nd), '#5f8fd0');
    const hasZero = String(y).includes('0');
    const zi = String(y).padStart(4, '0').indexOf('0', 4 - nd);
    lab.setState({ emo: '📅', title: d.yTitle(y), lead: d.yLead(rn, d.sym(rn.length), d.digs(nd)), body: hasZero ? d.zero(d.places[zi], y, String(y).replaceAll('0', '')) : d.noZero, extra: '' });
    lab.setFacts(t.facts.dg);
  }
}

function renderWords(t) {
  const wd = t.wd, end = S.wi >= NW;
  lab.setGlow('rgba(143, 127, 208, .26)');
  const nb = $('wdNext');
  if (end) {
    const k = S.wRes.filter(Boolean).length;
    $('wdQ').textContent = wd.endTitle(k, NW); $('wdOpts').innerHTML = ''; $('wdV').textContent = ''; $('wdV').className = 'hw-verdict';
    nb.hidden = false; nb.textContent = wd.again;
    lab.setReadout(`${k}/${NW}`, '', '', '#8f7fd0');
    lab.setState({ emo: '🏆', title: wd.endTitle(k, NW), lead: wd.endLead, body: '', extra: '' });
    lab.setFacts(t.facts.wd); return;
  }
  const W_ = WORDS[S.wOrder[S.wi]], isAr = W_.org === 'ar', rev = S.wRev, ok = S.wRes[S.wi];
  $('wdQ').textContent = wd.q;
  $('wdOpts').innerHTML = [['ar', wd.optA], ['ot', wd.optO]].map(([code, l]) => optBtn('wopt', code, l, !rev ? '' : (code === 'ar') === isAr ? 'good' : code === S.wGuess ? 'bad' : 'dim')).join('');
  const it = wd.items[W_.id];
  $('wdV').textContent = rev ? (ok ? wd.right : wd.notq) : '';
  $('wdV').className = 'hw-verdict' + (rev ? (ok ? ' good' : ' bad') : '');
  nb.hidden = !rev; nb.textContent = wd.next;
  lab.setReadout(`${W_.f[LI[lang]]}`, wd.round(S.wi + 1, NW), '', '#8f7fd0');
  if (!rev) lab.setState({ emo: '💬', title: wd.askTitle, lead: wd.askLead, body: '', extra: '' });
  else lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? wd.right : wd.notq, lead: isAr ? wd.yes(it.why) : wd.no(it.why), body: '', extra: '' });
  lab.setFacts(t.facts.wd);
}

function renderSecA(t) {
  const a = t.sa, asked = S.aPred !== null;
  lab.setGlow('rgba(224, 176, 80, .26)');
  $('aQ').textContent = a.q;
  $('aOpts').innerHTML = a.opts.map((l, i) => optBtn('aopt', String(i), l, !asked ? '' : i === a.ok ? 'good' : i === S.aPred ? 'bad' : 'dim')).join('');
  $('aV').textContent = asked ? `${S.aPred === a.ok ? a.right : a.wrong} ${a.res}` : '';
  $('aV').className = 'hw-verdict' + (asked ? (S.aPred === a.ok ? ' good' : ' bad') : '');
  $('aDig').innerHTML = [...'9876543210'].map((d) => `<button data-act="adig" data-v="${d}" class="${S.aSel === +d ? 'on' : ''}">${d}</button>`).join('');
  lab.setReadout('1202', 'Liber Abaci', '', '#e0b050');
  if (!asked) lab.setState({ emo: '📜', title: a.askTitle, lead: a.askLead, body: '', extra: '' });
  else if (S.aSel === null) lab.setState({ emo: '📜', title: a.title, lead: a.quote, body: a.book, extra: '' });
  else if (S.aSel === 0) lab.setState({ emo: '0️⃣', title: a.zeroTitle, lead: a.zeroLead, body: '', extra: '' });
  else lab.setState({ emo: '🔢', title: a.digTitle(S.aSel), lead: a.digLead, body: '', extra: '' });
  lab.setFacts(asked ? t.facts.sa : []);
}

function renderSecB(t) {
  const b = t.sb, asked = S.bPred !== null;
  lab.setGlow('rgba(255, 214, 110, .22)');
  $('bQ').textContent = b.q;
  $('bOpts').innerHTML = [['y', b.optY], ['n', b.optN]].map(([code, l]) => optBtn('bopt', code, l, !asked ? '' : code === 'n' ? 'good' : code === S.bPred ? 'bad' : 'dim')).join('');
  $('bV').textContent = asked ? (S.bPred === 'n' ? b.right : b.wrong) : '';
  $('bV').className = 'hw-verdict' + (asked ? (S.bPred === 'n' ? ' good' : ' bad') : '');
  $('bChips').hidden = !asked;
  $('bChips').innerHTML = asked ? `<button class="chip ${S.lamp ? 'on' : ''}" data-act="lamp">${esc(S.lamp ? b.lampOn : b.lampOff)}</button>
    <button class="chip ${S.theory === 'eye' ? 'on' : ''}" data-act="theory" data-v="eye">${esc(b.thEye)}</button>
    <button class="chip ${S.theory === 'light' ? 'on' : ''}" data-act="theory" data-v="light">${esc(b.thLight)}</button>` : '';
  lab.setReadout(asked ? (S.lamp ? '💡' : '🌑') : '?', asked ? (S.lamp ? b.lampOn.slice(3) : b.lampOff.slice(3)) : '', '', '#ffd66e');
  if (!asked) lab.setState({ emo: '👁️', title: b.askTitle, lead: b.askLead, body: '', extra: '' });
  else { const st = b.st[(S.theory === 'eye' ? 'eye' : 'light') + (S.lamp ? 'On' : 'Off')]; lab.setState({ emo: S.theory === 'eye' ? '👁️' : '💡', title: st[0], lead: st[1], body: st[2], extra: '' }); }
  lab.setFacts(asked ? t.facts.sb : []);
}

// --- start the picture and the first render ---------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const key = VIEWKEY(), [W, H] = DESIGN[key], s = Math.min(w / W, h / H);
  const bg = BG[key]; backdrop(c, w, h, bg[0], bg[1]);
  CW = W;
  c.save(); c.translate((w - W * s) / 2, (h - H * s) / 2); c.scale(s, s);
  c.lineJoin = 'round'; c.lineCap = 'round';
  DRAW[key](c, W, H, time);
  c.restore();
});
render();
</script>
