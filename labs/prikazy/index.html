    $('pOpts').innerHTML = v.popts.map((o, i) => `<button class="chip pk-opt${done && i === 1 ? ' ok' : done && i === S.ppick ? ' bad' : ''}" data-act="ppick" data-k="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
    lab.setReadout(done ? String(BARS[2]) : '?', done ? v.psubR : v.psub, done ? v.ppillR : '', '#e0b050');
    if (!done) lab.setState({ emo: '🧮', title: v.ptitle, lead: v.plead0, body: '', extra: '' });
    else lab.setState({ emo: S.ppick === 1 ? '✅' : '🤔', title: S.ppick === 1 ? v.pright : v.pwrong, lead: v.plead, body: '', extra: '' });
    lab.setFacts(done ? t.facts.pri1 : t.facts.pri0);
  }
}
render();
</script>
</body>
</html>
