  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, 1, 9, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineCap = 'round'; ctx.strokeStyle = '#2b3a66'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-2.5, -9); ctx.lineTo(-3 + sw, -1); ctx.moveTo(2.5, -9); ctx.lineTo(3 - sw, -1); ctx.stroke();
  ctx.fillStyle = '#e8a13a'; rr(ctx, -12, -23, 9, 14, 4); ctx.fill();
  const gr = ctx.createLinearGradient(-6, -24, 6, -8); gr.addColorStop(0, '#ff7a63'); gr.addColorStop(1, '#d6453a');
  ctx.fillStyle = gr; rr(ctx, -7, -25, 14, 17, 6); ctx.fill(); ctx.strokeStyle = 'rgba(80,20,10,.5)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#f4cfa6'; ctx.beginPath(); ctx.arc(0, -31, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(-2, -33, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2c6e9e'; ctx.beginPath(); ctx.arc(0, -33, 6.4, Math.PI, 0); ctx.fill(); ctx.fillRect(-8.5, -33.4, 17, 2.4);
  ctx.fillStyle = '#2a2230'; ctx.beginPath(); ctx.arc(2.2, -30.5, 0.9, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawHike(ctx, w, h, lay, now) {
  const R = lay.map;
  const P = { kind: 'paper', rect: R, margin: 0, tilt: 0, field: FB, L: null, colours: true, sea: false, step: 1, linesKey: 'hk', items: () => mapItems(FB, 100, false) };
  ensureScene(ctx, w, h, P);
  const m = mapMap(R), t = T[lang];
  drawLabels(ctx, R, [...['A', 'B'].map((k) => [m.X(TR[k].pts[0].x), m.Y(TR[k].pts[0].y)]), [m.X(SUM.x), m.Y(SUM.y) - 38]]);
  drawCompass(ctx, R);
  ctx.save(); ctx.beginPath(); rr(ctx, R.x, R.y, R.w, R.h, 14); ctx.clip();
  const cols = { A: ['#2f7de1', '#bcd8ff'], B: ['#ff8a2a', '#ffd9b0'] };
  for (const k of ['A', 'B']) {
    const tr = TR[k], on = S.hg !== null && S.trail === k;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); tr.pts.forEach((p, i) => (i ? ctx.lineTo(m.X(p.x), m.Y(p.y)) : ctx.moveTo(m.X(p.x), m.Y(p.y))));
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6.5; ctx.stroke(); ctx.strokeStyle = cols[k][0]; ctx.lineWidth = 3.6; ctx.stroke();
    if (on) {   // the part already walked
      ctx.beginPath(); let started = false;
      for (const p of tr.pts) { if (p.d > S.hs) break; (started ? ctx.lineTo : ctx.moveTo).call(ctx, m.X(p.x), m.Y(p.y)); started = true; }
      const q = trailAt(tr, S.hs); ctx.lineTo(m.X(q.x), m.Y(q.y)); ctx.strokeStyle = cols[k][1]; ctx.lineWidth = 2; ctx.stroke();
    }
  }
  ctx.restore();
  for (const k of ['A', 'B']) {
    const p = TR[k].pts[0];
    ctx.fillStyle = cols[k][0]; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(m.X(p.x), m.Y(p.y), 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '900 13px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(k, m.X(p.x), m.Y(p.y) + 1);
  }
  // the summit flag
  const sx = m.X(SUM.x), sy = m.Y(SUM.y);
  ctx.strokeStyle = '#3a2a18'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy - 24); ctx.stroke();
  ctx.fillStyle = '#e5484d'; ctx.beginPath(); ctx.moveTo(sx, sy - 24); ctx.lineTo(sx + 14, sy - 19); ctx.lineTo(sx, sy - 14); ctx.closePath(); ctx.fill();
  pill(ctx, `▲ ${lbl(SUM.h)}`, sx, sy - 38, { box: R });
  if (S.hg !== null) { const q = trailAt(TR[S.trail], S.hs); drawHiker(ctx, m.X(q.x), m.Y(q.y), now, S.playing); }
  // the panel with the graph
  const Pn = lay.panel;
  ctx.save(); ctx.fillStyle = 'rgba(14,17,28,.82)'; rr(ctx, Pn.x, Pn.y, Pn.w, Pn.h, 16); ctx.fill(); ctx.strokeStyle = 'rgba(130,145,190,.28)'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
  if (S.hg === null) {
    ctx.fillStyle = '#d3d9e8'; ctx.font = '800 14px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🔒', Pn.x + Pn.w / 2, Pn.y + Pn.h / 2 - 14); ctx.fillText(t.hk.locked, Pn.x + Pn.w / 2, Pn.y + Pn.h / 2 + 12, Pn.w - 24);
    return;
  }
  const pad = { l: 44, r: 14, t: 34, b: 26 }, x0 = Pn.x + pad.l, x1 = Pn.x + Pn.w - pad.r, y0 = Pn.y + pad.t, y1 = Pn.y + Pn.h - pad.b;
  const xmax = Math.ceil(Math.max(TR.A.len, TR.B.len)), X = (d) => x0 + d / xmax * (x1 - x0), Y = (hh) => y1 - hh / 1000 * (y1 - y0);
  ctx.save();
  ctx.font = '700 12px Nunito, system-ui, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const lv of [0, 250, 500, 750, 1000]) { ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, Y(lv)); ctx.lineTo(x1, Y(lv)); ctx.stroke(); if (lv % 500 === 0) { ctx.fillStyle = '#aab2c8'; ctx.fillText(fm(lv), x0 - 6, Y(lv)); } }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = '#aab2c8';
  for (let kk = 0; kk <= xmax; kk++) { ctx.fillText(kk === xmax ? `${kk} ${t.km}` : `${kk}`, Math.min(X(kk), x1 - 8), y1 + 5); }
  for (const k of ['A', 'B']) {
    const tr = TR[k];
    ctx.beginPath(); tr.pts.forEach((p, i) => (i ? ctx.lineTo(X(p.d), Y(p.h)) : ctx.moveTo(X(p.d), Y(p.h))));
    ctx.strokeStyle = cols[k][0]; ctx.lineWidth = S.trail === k ? 3.4 : 2; ctx.globalAlpha = S.trail === k ? 1 : 0.7; ctx.lineJoin = 'round'; ctx.stroke(); ctx.globalAlpha = 1;
    const e = tr.pts[tr.pts.length - 1];
    ctx.fillStyle = cols[k][0]; ctx.beginPath(); ctx.arc(X(e.d), Y(e.h), 4.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  const tr = TR[S.trail], q = trailAt(tr, S.hs);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = cols[S.trail][0]; ctx.lineWidth = 3.4; ctx.beginPath(); ctx.arc(X(S.hs), Y(q.h), 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  let lx = Pn.x + 14;
  for (const k of ['A', 'B']) {
    const text = `${k}  ${fm(TR[k].g)} %`; ctx.font = '800 12px Nunito, system-ui, sans-serif';
    const wd = ctx.measureText(text).width + 14;
    pill(ctx, text, lx + wd / 2, Pn.y + 16, { box: Pn, edge: cols[k][0] }); lx += wd + 8;
  }
}

// --- pointer: dragging the points A and B, scrubbing the profile ---------------------------------------------
const evPos = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top, w: r.width, h: r.height }; };
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'map') return;
  const p = evPos(ev), lay = layout(p.w, p.h), R = lay.map, m = mapMap(R), Pn = lay.panel;
  if (p.x >= R.x && p.x <= R.x + R.w && p.y >= R.y && p.y <= R.y + R.h) {
    const dA = Math.hypot(p.x - m.X(S.A.x), p.y - m.Y(S.A.y)), dB = Math.hypot(p.x - m.X(S.B.x), p.y - m.Y(S.B.y));
    S.drag = dA <= dB ? 'A' : 'B';
    cv.setPointerCapture(ev.pointerId);
    moveMarker(p, m); S.rev = false; S.pick = null; S.scrub = null; sfx.tick(); render();
  } else if (S.rev && p.x >= Pn.x && p.x <= Pn.x + Pn.w && p.y >= Pn.y && p.y <= Pn.y + Pn.h) {
    S.drag = 'scrub'; cv.setPointerCapture(ev.pointerId); scrubTo(p, Pn);
  }
});
cv.addEventListener('pointermove', (ev) => {
  if (lab.view !== 'map') return;
  const p = evPos(ev), lay = layout(p.w, p.h);
  if (S.drag === 'A' || S.drag === 'B') { moveMarker(p, mapMap(lay.map)); updateMapReadout(); }
  else if (S.drag === 'scrub' || (S.rev && ev.pointerType === 'mouse')) {
    const Pn = lay.panel;
    if (p.x >= Pn.x && p.x <= Pn.x + Pn.w && p.y >= Pn.y && p.y <= Pn.y + Pn.h) scrubTo(p, Pn); else if (S.drag !== 'scrub') S.scrub = null;
  }
});
const endDrag = () => { if (S.drag === 'A' || S.drag === 'B') { S.drag = null; render(); } else S.drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', () => { if (!S.drag) S.scrub = null; });
function moveMarker(p, m) {
  const mk = S.drag === 'A' ? S.A : S.B;
  mk.x = clamp(m.ix(p.x), 0.3, WK - 0.3); mk.y = clamp(m.iy(p.y), 0.3, HK - 0.3);
}
function scrubTo(p, Pn) { S.scrub = clamp01((p.x - (Pn.x + 44)) / (Pn.w - 44 - 14)); }

// --- the HTML overlay for the three sketches ---------------------------------------------------------------
function placeCands(lay) {
  if (lab.view !== 'map') { candEl.style.display = 'none'; return; }
  const Pn = lay.panel, key = `${Pn.x}|${Pn.y}|${Pn.w}|${Pn.h}`;
  if (candEl.dataset.k !== key) { candEl.dataset.k = key; Object.assign(candEl.style, { left: `${Pn.x}px`, top: `${Pn.y}px`, width: `${Pn.w}px`, height: `${Pn.h}px` }); }
}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const go = (v) => { lab.view = v; lab.renderChrome(); render(); };
$('ctLvl').addEventListener('input', () => {
  if (S.fa === 'asking') return;
  S.level = +$('ctLvl').value; sfx.tick(); render();
});
$('ctPos').addEventListener('input', () => {
  if (S.hg === null) return;
  S.playing = false; S.hs = +$('ctPos').value / 1000 * TR[S.trail].len; readHike();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-i], [data-q]'); if (!b) return;
  const act = b.dataset.act;
  if (b.dataset.q) {   // the flood prediction
    S.fguess = +b.dataset.q; S.fa = 'done'; S.top = true; S.fReveal = false; sfx.click(); camGo(1); render(); showStage(); return;
  }
  if (b.dataset.h) {   // the hike prediction
    S.hg = +b.dataset.h; sfx.click(); (S.hg === 1 ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (b.dataset.i) { S.interval = +b.dataset.i; sfx.click(); render(); return; }
  if (act === 'mark') { if (!S.marks.includes(S.level)) { S.marks.push(S.level); sfx.snap(); render(); } }
  else if (act === 'clear') { S.marks = []; S.top = false; camGo(0); sfx.click(); render(); }
  else if (act === 'look') {
    if (S.fa === 'idle') { S.fa = 'asking'; sfx.click(); render(); showStage(); }
    else if (S.fa === 'done') { S.top = !S.top; camGo(S.top ? 1 : 0); sfx.click(); render(); }
  }
  else if (act === 'colors') { S.colors = !S.colors; sfx.click(); render(); }
  else if (act === 'walk') { S.trail = b.dataset.k; S.hs = 0; S.playing = true; sfx.click(); render(); showStage(); }
  else if (act === 'sec') onSec(b.dataset.k);
});
$('overlay').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-pick]'); if (!b || !S.cand) return;
  S.pick = +b.dataset.pick; S.rev = true; S.scrub = null;
  (S.cand[S.pick].ok ? sfx.good : sfx.bad)(); render(); showStage();
});
function onSec(k) {
  if (!secret.unlocked()) return secret.open();
  sfx.click();
  if (k === 'crater') {
    S.crater = !S.crater;
    if (S.crater) { S.interval = 50; S.rev = false; S.pick = null; go('map'); return; }
  } else {
    S.sea = !S.sea;
    if (S.sea) { S.level = 0; go('flood'); return; }
    if (S.level < 0) S.level = 0;
  }
  render();
}

// --- rendering of the text, the controls and the readouts -------------------------------------------------------
function secChips(t, open) {
  const chip = (k, emo, on) => `<button class="chip ct-tall secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('ctSec').innerHTML = chip('crater', '🌋', S.crater) + chip('sea', '🐟', S.sea);
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('ctFlood').style.display = v === 'flood' ? '' : 'none';
  $('ctMap').style.display = v === 'map' ? '' : 'none';
  $('ctHike').style.display = v === 'hike' ? '' : 'none';
  candEl.style.display = 'none';
  secChips(t, secret.unlocked());
  lab.setFacts(t.facts[v]);
  if (v === 'flood') renderFlood(t); else if (v === 'map') renderMap(t); else renderHike(t);
}
function renderFlood(t) {
  const f = t.fl, n = S.marks.length, asking = S.fa === 'asking', lvMin = S.sea ? -300 : 0;
  lab.setGlow('rgba(60, 130, 200, .32)');
  const sl = $('ctLvl');
  sl.min = lvMin; if (+sl.value !== S.level) sl.value = S.level;
  $('ctLvlLab').textContent = f.level;
  $('ctEndLo').textContent = `${fm(lvMin)} ${t.m}`; $('ctEndHi').textContent = `900 ${t.m}`;
  $('ctFAsk').style.display = asking ? '' : 'none';
  $('ctFCtl').style.display = asking ? 'none' : '';
  if (asking) $('ctFAsk').innerHTML = `<div class="ct-qt">${esc(f.q)}</div><div class="ct-ql">${esc(f.ql)}</div><div class="ct-opts">${f.opts.map((o, i) => `<button class="ct-opt" data-q="${i}">${esc(o)}</button>`).join('')}</div>`;
  const marked = S.marks.includes(S.level);
  $('ctMark').textContent = marked ? f.marked : f.mark; $('ctMark').disabled = marked;
  $('ctClear').textContent = f.clear; $('ctClear').style.display = n ? '' : 'none';
  const lk = $('ctLook');
  lk.textContent = S.fa === 'done' ? (S.top ? f.side : f.look) : `${f.look}${n < 5 ? ` · ${n}/5` : ''}`;
  lk.disabled = S.fa !== 'done' && n < 5;
  lab.setReadout(`${fm(S.level)} <small style="font-size:16px;font-weight:700">${t.m}</small>`, f.readSub, f.pill(n), '#4ea8ff');
  let st;
  if (asking) st = { emo: '🤔', title: f.q, lead: f.ql, body: '' };
  else if (S.fa === 'done' && S.top && !S.fReveal) st = { emo: '🦅', title: f.turn[0], lead: f.turn[1], body: '' };
  else if (S.fa === 'done' && S.fReveal && S.top) st = { emo: S.fguess === 0 ? '✅' : '🤔', title: S.fguess === 0 ? f.right : f.wrong, lead: `${f.revT}. ${f.revL}`, body: f.revB };
  else if (S.sea && S.level < 0) st = { emo: '🐟', title: t.secrets.sea[0], lead: t.secrets.sea[1], body: t.seaB };
  else if (n >= 5) st = { emo: '📍', title: f.s5[0], lead: f.s5[1], body: f.s5[2] };
  else st = { emo: '🌊', title: f.s0[0], lead: f.s0[1], body: f.s0[2] };
  lab.setState({ ...st, extra: '' });
}
function renderMap(t) {
  const m = t.mp, fd = activeField(), pf = makeProfile(fd), flat = pf.mx - pf.mn < 150;
  lab.setGlow('rgba(200, 160, 90, .26)');
  $('ctCol').textContent = m.colours; $('ctCol').classList.toggle('on', S.colors);
  $('ctIntLab').textContent = m.interval;
  $('ctInts').innerHTML = [50, 100, 200].map((i) => `<button class="chip ct-tall ${S.interval === i ? 'on' : ''}" data-i="${i}">${i} ${t.m}</button>`).join('');
  // the three sketches, before the reveal
  if (!S.rev && !S.drag) {
    candEl.style.display = 'flex';
    if (flat) { S.cand = null; candEl.innerHTML = `<div class="ct-cq">${esc(m.q)}</div><div class="ct-msg">${esc(m.flat)}</div>`; }
    else {
      S.cand = makeCands(pf);
      candEl.innerHTML = `<div class="ct-cq">${esc(m.q)}</div><div class="ct-crow">${S.cand.map((c, i) => `<button class="ct-cand" data-pick="${i}" aria-label="${i + 1}">${sketch(c.v)}</button>`).join('')}</div>`;
    }
  }
  updateMapReadout();
  let st;
  if (S.rev) {
    const ok = S.cand?.[S.pick]?.ok;
    st = { emo: ok ? '✅' : '🤔', title: ok ? m.right : m.wrong, lead: m.revL, body: m.revB };
  } else if (S.crater) st = { emo: '🌋', title: t.secrets.crater[0], lead: t.secrets.crater[1], body: t.craterB };
  else if (S.sea) st = { emo: '🐟', title: t.secrets.sea[0], lead: t.secrets.sea[1], body: t.seaB };
  else st = { emo: '🗺️', title: m.s0[0], lead: m.s0[1], body: m.s0[2] };
  lab.setState({ ...st, extra: '' });
}
function updateMapReadout() {
  const t = T[lang], pf = makeProfile(activeField());
  if (S.rev) lab.setReadout(`${fm(pf.mx)} <small style="font-size:16px;font-weight:700">${t.m}</small>`, t.mp.high(fk(pf.len)), '', '#d6b25e');
  else lab.setReadout(`${fk(pf.len)} <small style="font-size:16px;font-weight:700">${t.km}</small>`, t.mp.len(fk(pf.len)), '', '#d6b25e');
}
function readHike() {
  const t = T[lang], k = S.trail, tr = TR[k];
  if (S.hg === null) { lab.setReadout('?', '', '', '#7fb069'); return; }
  const q = trailAt(tr, S.hs), g = Math.max(0, gradAt(tr, S.hs));
  lab.setReadout(`${fm(q.h)} <small style="font-size:16px;font-weight:700">${t.m}</small>`, t.hk.sub(fk(S.hs)), t.hk.pill(fm(g)), k === 'A' ? '#2f7de1' : '#ff8a2a');
  const sl = $('ctPos'); sl.value = Math.round(S.hs / tr.len * 1000);
}
function renderHike(t) {
  const h = t.hk, asked = S.hg !== null;
  lab.setGlow('rgba(110, 170, 90, .26)');
  $('ctHAsk').style.display = asked ? 'none' : '';
  $('ctHCtl').style.display = asked ? '' : 'none';
  if (!asked) $('ctHAsk').innerHTML = `<div class="ct-qt">${esc(h.q)}</div><div class="ct-ql">${esc(h.ql)}</div><div class="ct-opts">${h.opts.map((o, i) => `<button class="ct-opt" data-h="${i}">${esc(o)}</button>`).join('')}</div>`;
  $('ctWA').textContent = h.walk('A'); $('ctWB').textContent = h.walk('B');
  $('ctWA').classList.toggle('on', S.trail === 'A'); $('ctWB').classList.toggle('on', S.trail === 'B');
  $('ctPosLab').textContent = h.pos;
  readHike();
  const nums = (k) => ({ rise: fm(TR[k].rise), len: fk(TR[k].len), g: fm(TR[k].g) });
  let st;
  if (!asked) st = { emo: '🥾', title: h.q, lead: h.ql, body: '' };
  else st = { emo: S.hg === 1 ? '✅' : '🤔', title: S.hg === 1 ? h.right : h.wrong, lead: `${h.revT}. ${h.revL(nums('A'), nums('B'))}`, body: h.revB };
  lab.setState({ ...st, extra: '' });
}
render();
</script>
