const eb = (x) => { x = clamp01(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const seg = (u, a, b) => clamp01((u - a) / (b - a));
const mixn = (a, b, k) => a + (b - a) * k;
const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mix = (a, b, k) => { const A = rgb(a), B = rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
const shade = (h, k) => mix(h, '#000000', k);
const lite = (h, k) => mix(h, '#ffffff', k);
const rgba = (h, a) => { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; };
const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); };
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2))); };
const lg = (c, x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rg = (c, x0, y0, r0, x1, y1, r1, stops) => { const g = c.createRadialGradient(x0, y0, Math.max(0, r0), x1, y1, Math.max(0.01, r1)); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };

const now = () => performance.now() / 1000;
const bump = (u, c0, w = .025) => clamp01(1 - Math.abs(u - c0) / w);

// a dark rounded label with text, popped in with k (0..1), kept inside the canvas
let W = 0, H = 0;
function pill(c, text, x, y, o = {}) {
  const k = o.k ?? 1; if (k <= 0.01) return;
  const fs = o.fs || 13;
  c.save(); c.globalAlpha = 1;
  c.font = `800 ${fs}px Nunito, sans-serif`;
  const pw = c.measureText(text).width + (o.pad ?? 22), ph = fs + 13;
  const cx = clamp(x, pw / 2 + 6, Math.max(pw / 2 + 6, W - pw / 2 - 6)), cy = clamp(y, ph / 2 + 4, Math.max(ph / 2 + 4, H - ph / 2 - 4));
  c.translate(cx, cy); c.scale(k, k);
  rr(c, -pw / 2, -ph / 2 + 2, pw, ph, ph / 2); c.fillStyle = 'rgba(20,12,4,.22)'; c.fill();
  rr(c, -pw / 2, -ph / 2, pw, ph, ph / 2); c.fillStyle = o.bg || 'rgba(28,34,51,.88)'; c.fill();
  if (o.stroke) { c.lineWidth = 2; c.strokeStyle = o.stroke; c.stroke(); }
  c.fillStyle = o.fg || '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, 0, 1);
  c.restore();

// --- the wooden table (drawn once per size) ------------------------------------------------------------------
const bgc = document.createElement('canvas'); let bgKey = '';
function woodBG(c, w, h) {
  const d = Math.min(window.devicePixelRatio || 1, 2), key = `${w | 0}x${h | 0}x${d}`;
  if (key !== bgKey) {
    bgKey = key; bgc.width = Math.max(1, Math.round(w * d)); bgc.height = Math.max(1, Math.round(h * d));
    const g = bgc.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0);
    g.fillStyle = lg(g, 0, 0, 0, h, [[0, '#A98351'], [.12, '#BC966A'], [.5, P.table], [1, '#D3B27F']]); g.fillRect(0, 0, w, h);
    const r = rnd(21), planks = Math.max(3, Math.round(h / 96));
    for (let i = 0; i < planks; i++) {
      const y0 = i * h / planks, y1 = (i + 1) * h / planks;
      g.fillStyle = `rgba(${r() < .5 ? '255,236,200' : '90,58,26'},${.03 + r() * .05})`; g.fillRect(0, y0, w, y1 - y0);
      if (i) { g.fillStyle = 'rgba(70,42,16,.28)'; g.fillRect(0, y0 - 1, w, 2); g.fillStyle = 'rgba(255,236,200,.22)'; g.fillRect(0, y0 + 1, w, 1.5); }
    }
    for (let i = 0; i < 90; i++) {
      const y0 = r() * h, amp = 1 + r() * 3, f = .004 + r() * .012, ph = r() * 6, dark = r() < .6;
      g.strokeStyle = dark ? `rgba(110,72,34,${.06 + r() * .1})` : `rgba(255,238,205,${.05 + r() * .08})`; g.lineWidth = .5 + r() * 1.5;
      g.beginPath();
      for (let x = -8; x <= w + 8; x += 16) { const y = y0 + Math.sin(x * f + ph) * amp; if (x < 0) g.moveTo(x, y); else g.lineTo(x, y); }
      g.stroke();
    }
    for (let i = 0; i < 2; i++) {
      const kx = r() * w, ky = r() * h; g.save(); g.translate(kx, ky); g.scale(1, .55);
      for (let j = 4; j > 0; j--) { g.beginPath(); g.arc(0, 0, 4 + j * 5, 0, TAU); g.strokeStyle = `rgba(100,64,28,${.07 + j * .015})`; g.lineWidth = 1.2; g.stroke(); }
      g.restore();
    }
    g.fillStyle = rg(g, w * .5, h * .5, Math.min(w, h) * .25, w * .5, h * .5, Math.max(w, h) * .78, [[0, 'rgba(255,240,210,0)'], [1, 'rgba(60,35,10,.34)']]); g.fillRect(0, 0, w, h);
    g.fillStyle = lg(g, 0, 0, 0, 70, [[0, 'rgba(40,24,8,.4)'], [1, 'rgba(40,24,8,0)']]); g.fillRect(0, 0, w, 70);
  }
  c.drawImage(bgc, 0, 0, w, h);
}

// --- the five tools: each is drawn around its own centre, main length L, then rotated by the pose ------------
const GO = { lens: .46, ruler: .1, therm: .5, jug: .41, watch: .5 }; // ground offset below the centre, as a fraction of L
const SH = { lens: .2, ruler: .45, therm: .12, jug: .3, watch: .3 };

function drawTool(c, key, p) {
  const L = p.len, lift = Math.max(0, p.gy - p.y - GO[key] * L), k = 1 / (1 + lift / 55);
  c.save(); c.globalAlpha = 1;
  if (key !== 'ruler') { // soft ground shadow
    ell(c, p.x + lift * .18, p.gy + 2, SH[key] * L * k, SH[key] * L * k * .3); c.fillStyle = `rgba(40,22,5,${.3 * k})`; c.fill();
  }
  c.translate(p.x, p.y); c.rotate(p.rot || 0);
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (key === 'lens') drawLens(c, L, p); else if (key === 'ruler') drawRuler(c, { ...p, lift }); else if (key === 'therm') drawTherm(c, L, p);
  else if (key === 'jug') drawJug(c, L, p); else drawWatch(c, L, p);
  c.restore();
}

function drawLens(c, L, p) {
  const gr = .30 * L, gy = -.18 * L;
  c.fillStyle = lg(c, -.05 * L, 0, .05 * L, 0, [[0, '#8A5429'], [.45, '#DDA56E'], [1, '#8A5429']]);
  rr(c, -.05 * L, .08 * L, .10 * L, .42 * L, .05 * L); c.fill(); c.lineWidth = 1.2; c.strokeStyle = '#5C3515'; c.stroke();
  c.fillStyle = lg(c, -.065 * L, 0, .065 * L, 0, [[0, '#B98A2E'], [.4, '#F6DC8A'], [1, '#A87A22']]);
  rr(c, -.065 * L, .03 * L, .13 * L, .1 * L, .02 * L); c.fill(); c.strokeStyle = '#7A5A18'; c.stroke();
  circ(c, 0, gy, gr + .05 * L); c.fillStyle = lg(c, -gr, gy - gr, gr, gy + gr, [[0, '#F8E190'], [.5, P.brass], [1, '#9C7424']]); c.fill();
  c.strokeStyle = '#7A5A18'; c.lineWidth = 1.4; c.stroke();
  circ(c, 0, gy, gr); c.fillStyle = rg(c, -gr * .3, gy - gr * .3, 0, 0, gy, gr, [[0, 'rgba(235,248,255,.34)'], [1, 'rgba(150,200,240,.2)']]); c.fill();
  if (p.zoomFn) { c.save(); circ(c, 0, gy, gr); c.clip(); p.zoomFn(c, 0, gy, gr, p.rot || 0); c.restore(); }
  circ(c, 0, gy, gr); c.strokeStyle = 'rgba(90,64,20,.8)'; c.lineWidth = 1.6; c.stroke();
  c.beginPath(); c.arc(0, gy, gr * .86, Math.PI * 1.08, Math.PI * 1.46); c.strokeStyle = 'rgba(255,255,255,.88)'; c.lineWidth = Math.max(2, .035 * L); c.stroke();
  ell(c, -gr * .52, gy - gr * .56, gr * .09, gr * .05, -.7); c.fillStyle = 'rgba(255,255,255,.9)'; c.fill();
}

function drawRuler(c, p) {
  const n = p.n ?? 15, k = p.cmPx ?? p.len / (n + 1), Lr = (n + 1) * k, T = p.th ?? Lr * .2, x0 = -Lr / 2, pad = .5 * k, rad = Math.min(4, T * .2), lit = p.lit || 0;
  rr(c, x0 + 2, -T / 2 + 3 + (p.lift || 0) * .4, Lr, T, rad); c.fillStyle = 'rgba(40,22,5,.24)'; c.fill();
  rr(c, x0, -T / 2, Lr, T, rad); c.fillStyle = lg(c, 0, -T / 2, 0, T / 2, [[0, lite(P.ruler, .45)], [.5, P.ruler], [1, shade(P.ruler, .14)]]); c.fill();
  c.lineWidth = 1.3; c.strokeStyle = '#B58A14'; c.stroke();
  if (lit > 0) { rr(c, x0, -T / 2, lit * k + pad, T, rad); c.fillStyle = rgba(P.red, .26); c.fill(); }
  const fs = clamp(k * .85, 12, 13);
  c.lineCap = 'butt';
  for (let i = 0; i <= n * 2; i++) {
    const cm = i / 2, x = x0 + pad + cm * k, major = i % 2 === 0, on = lit > 0 && cm <= lit + 1e-6, tl = major ? T * .42 : T * .24;
    c.strokeStyle = on ? P.red : '#5B4310'; c.lineWidth = major ? (on ? 2.2 : 1.3) : 1;
    c.beginPath(); c.moveTo(x, -T / 2); c.lineTo(x, -T / 2 + tl); c.stroke();
    if (major && T >= 24 && (k >= 11 || cm % 5 === 0)) {
      c.fillStyle = on ? '#B3262B' : '#4A3608'; c.font = `800 ${fs}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'top';
      c.fillText(String(cm), x, -T / 2 + tl + 1);
    }
  }
  if (lit > 0) { const x = x0 + pad + lit * k; c.fillStyle = P.red; c.beginPath(); c.moveTo(x - 5, T / 2 + 1); c.lineTo(x + 5, T / 2 + 1); c.lineTo(x, T / 2 - 8); c.closePath(); c.fill(); }
  c.lineCap = 'round';
}

function drawTherm(c, L, p) {
  const rb = .085 * L, tw = .045 * L, xc = -.035 * L, yPB = .5 * L - 2.6 * rb, y0 = yPB - .06 * L, y40 = -.5 * L + .1 * L, temp = p.temp ?? 20;
  const yT = (v) => y0 - (clamp(v, -5, 45) / 40) * (y0 - y40);
  rr(c, -.1 * L, -.5 * L, .3 * L, yPB + .5 * L, .04 * L); c.fillStyle = lg(c, -.1 * L, 0, .2 * L, 0, [[0, '#FBF6E8'], [1, '#EBE3CD']]); c.fill();
  c.lineWidth = 1.2; c.strokeStyle = '#A99D82'; c.stroke();
  circ(c, .05 * L, -.45 * L, .018 * L); c.fillStyle = '#8F836A'; c.fill();
  // scale marks every 5, numbers every 10
  c.lineCap = 'butt';
  for (let v = 0; v <= 40; v += 5) {
    const y = yT(v), major = v % 10 === 0;
    c.strokeStyle = '#4A3F2A'; c.lineWidth = major ? 1.5 : 1; c.beginPath(); c.moveTo(.0, y); c.lineTo(major ? .066 * L : .04 * L, y); c.stroke();
    if (major && L >= 120) { c.fillStyle = '#3B3220'; c.font = `800 ${Math.max(11, L * .068)}px Nunito, sans-serif`; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(String(v), .075 * L, y); }
  }
  c.lineCap = 'round';
  rr(c, xc - tw, -.5 * L + .03 * L, 2 * tw, .5 * L - rb - (-.5 * L + .03 * L) + .02 * L, tw); c.fillStyle = 'rgba(255,255,255,.7)'; c.fill(); c.strokeStyle = '#8FA0B6'; c.lineWidth = 1.2; c.stroke();
  const by = .5 * L - rb, ty = yT(temp);
  rr(c, xc - tw * .42, ty, tw * .84, by - ty, tw * .42); c.fillStyle = lg(c, xc - tw, 0, xc + tw, 0, [[0, '#B8292E'], [.4, P.red], [1, '#B8292E']]); c.fill();
  circ(c, xc, by, rb); c.fillStyle = rg(c, xc - rb * .3, by - rb * .3, 0, xc, by, rb, [[0, '#F4767A'], [.6, P.red], [1, '#A5262B']]); c.fill();
  c.strokeStyle = '#8FA0B6'; c.lineWidth = 1.4; c.stroke();
  ell(c, xc - rb * .3, by - rb * .35, rb * .22, rb * .12, -.6); c.fillStyle = 'rgba(255,255,255,.75)'; c.fill();
  c.beginPath(); c.moveTo(xc - tw * .45, -.5 * L + .08 * L); c.lineTo(xc - tw * .45, yPB - .05 * L); c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 1.4; c.stroke();
}

function drawJug(c, L, p) {
  const yt = -.41 * L, yb = .41 * L, wt = .31 * L, wb = .25 * L, lvl = p.level || 0, liq = p.liq || P.juice;
  const yi = (ml) => (yb - .03 * L) - (ml / 300) * (yb - .03 * L - (yt + .05 * L));
  const hw = (y) => wb + (wt - wb) * ((yb - y) / (yb - yt));
  const body = () => { c.beginPath(); c.moveTo(-wt, yt); c.lineTo(-wb, yb - .05 * L); c.quadraticCurveTo(-wb, yb, -wb + .05 * L, yb); c.lineTo(wb - .05 * L, yb); c.quadraticCurveTo(wb, yb, wb, yb - .05 * L); c.lineTo(wt, yt); c.closePath(); };
  // handle
  c.beginPath(); c.moveTo(wt - .02 * L, yt + .1 * L); c.bezierCurveTo(.56 * L, yt + .06 * L, .54 * L, .16 * L, wb + .01 * L, .16 * L);
  c.strokeStyle = 'rgba(90,140,195,.9)'; c.lineWidth = .075 * L; c.stroke(); c.strokeStyle = 'rgba(205,230,250,.85)'; c.lineWidth = .045 * L; c.stroke();
  // spout
  c.beginPath(); c.moveTo(-wt, yt); c.lineTo(-wt - .08 * L, yt - .025 * L); c.lineTo(-wt + .02 * L, yt + .08 * L); c.closePath(); c.fillStyle = 'rgba(190,225,250,.55)'; c.fill(); c.strokeStyle = 'rgba(80,130,185,.9)'; c.lineWidth = 1.4; c.stroke();
  ell(c, 0, yt, wt, .04 * L); c.fillStyle = 'rgba(160,200,235,.35)'; c.fill(); c.strokeStyle = 'rgba(80,130,185,.8)'; c.lineWidth = 1.2; c.stroke();
  body(); c.fillStyle = lg(c, -wt, 0, wt, 0, [[0, 'rgba(210,235,255,.38)'], [.5, 'rgba(175,215,245,.2)'], [1, 'rgba(150,195,235,.32)']]); c.fill();
  if (lvl > 0) {
    c.save(); body(); c.clip();
    const wob = p.wob || 0, ys = yi(lvl) - wob * .02 * L, tl = wob * .035 * L;
    c.beginPath(); c.moveTo(-wt - 4, ys - tl); c.lineTo(wt + 4, ys + tl); c.lineTo(wt + 4, yb + 4); c.lineTo(-wt - 4, yb + 4); c.closePath();
    c.fillStyle = lg(c, -wt, 0, wt, 0, [[0, lite(liq, .18)], [.5, liq], [1, shade(liq, .16)]]); c.fill();
    c.beginPath(); c.moveTo(-wt, ys - tl); c.lineTo(wt, ys + tl); c.strokeStyle = lite(liq, .55); c.lineWidth = 2; c.stroke();
    c.restore();
  }
  body(); c.strokeStyle = 'rgba(70,125,185,.95)'; c.lineWidth = 1.8; c.stroke();
  // ml marks on the left wall
  const fs = Math.max(11, L * .075);
  for (let ml = 50; ml <= 300; ml += 50) {
    const y = yi(ml), major = ml % 100 === 0, x = -hw(y);
    c.strokeStyle = 'rgba(30,65,105,.9)'; c.lineWidth = major ? 1.6 : 1.1; c.beginPath(); c.moveTo(x + 2, y); c.lineTo(x + (major ? .1 : .06) * L, y); c.stroke();
    if (major && L >= 100) { c.fillStyle = 'rgba(25,55,95,.95)'; c.font = `800 ${fs}px Nunito, sans-serif`; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(String(ml), x + .12 * L, y); }
  }
  c.beginPath(); c.moveTo(-wt * .84, yt + .07 * L); c.lineTo(-wb * .86, yb - .1 * L); c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = .028 * L; c.stroke();
}

function drawWatch(c, L, p) {
  const fr = .37 * L, cy = .1 * L, sec = p.sec || 0, dy = (p.btn || 0) * .035 * L, ang = sec / 60 * TAU - Math.PI / 2;
  c.fillStyle = lg(c, -.06 * L, 0, .06 * L, 0, [[0, '#8D96A6'], [.5, '#F2F4F8'], [1, '#8D96A6']]);
  rr(c, -.06 * L, -.37 * L, .12 * L, .13 * L, .02 * L); c.fill(); c.strokeStyle = '#59627A'; c.lineWidth = 1.2; c.stroke();
  c.save(); c.translate(0, cy); c.rotate(.82); rr(c, -.04 * L, -(fr + .1 * L), .08 * L, .1 * L, .02 * L); c.fillStyle = lg(c, -.04 * L, 0, .04 * L, 0, [[0, '#8D96A6'], [.5, '#F2F4F8'], [1, '#8D96A6']]); c.fill(); c.stroke(); c.restore();
  rr(c, -.095 * L, -.49 * L + dy, .19 * L, .12 * L, .035 * L); c.fillStyle = lg(c, -.095 * L, 0, .095 * L, 0, [[0, '#B8292E'], [.4, '#F25D62'], [1, '#B8292E']]); c.fill(); c.strokeStyle = '#7C1A1E'; c.stroke();
  circ(c, 0, cy, fr + .055 * L); c.fillStyle = lg(c, -fr, cy - fr, fr, cy + fr, [[0, '#F6F8FB'], [.45, '#B5BDCB'], [1, '#7D8698']]); c.fill(); c.strokeStyle = '#5B647A'; c.lineWidth = 1.4; c.stroke();
  circ(c, 0, cy, fr + .008 * L); c.fillStyle = '#4A5268'; c.fill();
  circ(c, 0, cy, fr); c.fillStyle = rg(c, -fr * .25, cy - fr * .3, 0, 0, cy, fr, [[0, '#FFFFFF'], [1, '#E4E9F2']]); c.fill();
  if (sec > 0) { c.beginPath(); c.moveTo(0, cy); c.arc(0, cy, fr * .9, -Math.PI / 2, ang); c.closePath(); c.fillStyle = rgba(P.red, .17); c.fill(); }
  c.lineCap = 'butt';
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * TAU - Math.PI / 2, major = i % 5 === 0, r1 = fr * (major ? .76 : .85), r2 = fr * .94;
    c.strokeStyle = P.ink; c.lineWidth = major ? 1.8 : .8; c.beginPath(); c.moveTo(Math.cos(a) * r1, cy + Math.sin(a) * r1); c.lineTo(Math.cos(a) * r2, cy + Math.sin(a) * r2); c.stroke();
  }
  c.lineCap = 'round';
  if (fr >= 34) {
    c.fillStyle = P.ink; c.font = `900 ${Math.max(10, fr * .23)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    [[0, 60], [15, 15], [30, 30], [45, 45]].forEach(([s, lab]) => { const a = s / 60 * TAU - Math.PI / 2; c.fillText(String(lab), Math.cos(a) * fr * .6, cy + Math.sin(a) * fr * .6 + 1); });
  }
  c.strokeStyle = P.red; c.lineWidth = Math.max(1.8, fr * .06);
  c.beginPath(); c.moveTo(-Math.cos(ang) * fr * .16, cy - Math.sin(ang) * fr * .16); c.lineTo(Math.cos(ang) * fr * .84, cy + Math.sin(ang) * fr * .84); c.stroke();
  circ(c, 0, cy, fr * .08); c.fillStyle = P.ink; c.fill();
  c.beginPath(); c.arc(0, cy, fr * .9, Math.PI * 1.08, Math.PI * 1.42); c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = Math.max(2, fr * .07); c.stroke();
}

// --- things on the table ---------------------------------------------------------------------------------------
// an ant seen from above, facing right; the unit is k pixels, the body is about 13 units long. Returns the six leg tips.
function ant(c, x, y, k, ang = 0) {
  c.save(); c.translate(x, y); c.rotate(ang); c.scale(k, k);
  c.fillStyle = 'rgba(30,15,5,.22)'; ell(c, -1.2, .9, 6.6, 2.5); c.fill();
  c.strokeStyle = '#2a140b'; c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = .42;
  const tips = [];
  [-1, 1].forEach((s) => {
    [[.9, 1.0, 2.3, 2.2, 3.7], [0, .1, 2.6, .6, 4.2], [-.9, -1.1, 2.2, -2.6, 3.5]].forEach(([ax, kx, ky, fx, fy]) => {
      c.beginPath(); c.moveTo(ax, .5 * s); c.lineTo(ax + kx, ky * s); c.lineTo(ax + fx, fy * s); c.stroke(); tips.push([ax + fx, fy * s]);
    });
  });
  c.lineWidth = .3;
  [-1, 1].forEach((s) => { c.beginPath(); c.moveTo(3.4, .55 * s); c.quadraticCurveTo(4.7, 1.7 * s, 6.1, 1.3 * s); c.stroke(); });

// each has geo(R), draw(c, R, m) behind the tools, pose(R, u) for its tool, front(c, R, m) in front of them.
// m = { u: progress of the tool's use 0..1, e: seconds since the reveal began, t: clock, mini }
const parts = (i) => T[lang].t.res[i].split(/,\s| (?:and|и|és) /);

const S1 = {

    p.gy = p.y + GO.lens * len;

      c.fillStyle = rg(c, 0, 0, 0, 0, 0, r, [[0, '#D9B887'], [1, '#B58F5C']]); c.fillRect(-r, -r, 2 * r, 2 * r);

        c.fillStyle = '#fff'; c.font = '900 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(i + 1), bx, by + 1);

  wrong(R) { const g = this.geo(R); return { x: g.cx + 10, y: g.cy + 34 }; },
  front(c, R, m) { if (m.mini) return; const g = this.geo(R); if (m.u >= .86) pill(c, parts(0)[0], g.cx, g.cy - R.h * .38, { k: eb(seg(m.u, .86, .94)), fs: 15 }); },
};

const S2 = {
  geo(R) {
    const k = R.w * .62 / 14, th = Math.max(8, k * .85);
    return { k, th, A: { x: R.x + R.w * .05, y: R.y + R.h * .2, a: -.07 }, B: { x: R.x + R.w * .3, y: R.y + R.h * .72, a: .1 }, cx: R.x + R.w * .5, cy: R.y + R.h * .46 };

  draw(c, R) { const g = this.geo(R); pencil(c, g.A.x, g.A.y, 12 * g.k, g.th, g.A.a, P.juice); pencil(c, g.B.x, g.B.y, 14 * g.k, g.th, g.B.a, P.acc); },

const S4 = {

const S5 = {
  geo(R) {

  pos(g, p, off) {

  stad(c, g, off) {

  },
  prog(u) { return { sam: seg(u, .04, .4), lea: seg(u, .56, .95) }; },
  draw(c, R, m) {

    rr(c, I.x, I.y, I.w, I.h, 14); c.fillStyle = '#FBF8F0'; c.fill();
    rr(c, I.x + 6, I.y + 6, I.w - 12, I.h - 12, 10); c.fillStyle = lg(c, 0, I.y, 0, I.y + I.h, [[0, '#4FC98E'], [1, '#2F9F6C']]); c.fill();

  pose(R, u) {

const F1 = {

    pill(c, FP.text, cl.x + cl.w / 2, cl.y + cl.h * .1, { k: eb(seg(s, .1, .45)), fs: 15, stroke: FP.ok ? P.acc : null, bg: FP.ok ? 'rgba(28,34,51,.92)' : '#FFFFFF', fg: FP.ok ? '#fff' : P.ink });
  } else { // flying home
    p = mixPose(FP.from, rest, eio((tn - FP.t0) / .5), arcOf(FP.from, rest));
    if (tn - FP.t0 > .5) { FP = null; return; }
  }
  drawTool(c, FP.key, p);
}

function drawFooledView(c, v, cur, m) {
  const Pc = LY.R; paper(c, Pc);
  const F = FS[v.i];
  F.draw(c, Pc, m);
  drawTools(c, 'fooled', v, cur, m);
  F.front(c, Pc, m);
}

function drawDetailView(c, v, cur, m) {
  const t = T[lang], R = LY.R;
  if (LY.free) {
    const Ar = { x: LY.w * .04, y: 48, w: LY.w * .92, h: LY.h - 48 - 10 }, cw = Ar.w / 3, ch = Ar.h / 2;
    LY.cells = [0, 1, 2, 3, 4, 5].map((i) => ({ x: Ar.x + (i % 3) * cw, y: Ar.y + (i >= 3 ? ch : 0), w: cw, h: ch }));
    LY.cells.forEach((cl, i) => {
      rr(c, cl.x + 4, cl.y + 4, cl.w - 8, cl.h - 8, 16); c.fillStyle = 'rgba(255,245,220,.13)'; c.fill(); c.lineWidth = 1.2; c.strokeStyle = 'rgba(255,255,255,.22)'; c.stroke();
      thingDraw(c, i, cl.x + cl.w / 2, cl.y + cl.h * .46, Math.min(cl.w, cl.h) * .66);
      pill(c, t.d.things[i], cl.x + cl.w / 2, cl.y + cl.h - 20, { fs: 12, pad: 16 });
    });
    const rest = restPose('detail', 'lens'), len = clamp(LY.w * .4, 130, 190);
    let p = rest;
    if (DL.has) {
      const r = len * .3, gy = DL.y - (DL.touch ? r * 1.15 : 0), gx = DL.x;
      p = lensAt(gx, gy, len, .55);
      p.zoomFn = (cc, cx, cy, rad) => {
        const k = freeCell(gx, gy), cl = k >= 0 ? LY.cells[k] : null;
        const sz = cl ? Math.min(cl.w, cl.h) * .66 : 0, tcx = cl ? cl.x + cl.w / 2 : 0, tcy = cl ? cl.y + cl.h * .46 : 0;
        if (cl && Math.hypot(gx - tcx, gy - tcy) < sz * .62) tex(cc, k, cx, cy, rad, clamp((gx - tcx) / sz + .5, 0, 1), clamp((gy - tcy) / sz + .5, 0, 1));
        else woodTex(cc, cx, cy, rad);
      };
    }
    drawTool(c, 'lens', p);
    return;
  }
  const g = detailGeo();
  thingDraw(c, DT[v.i], g.cx, g.cy, g.s);
  drawTools(c, 'detail', v, cur, m);
  if (cur && m.u >= .2) pill(c, '× 10', g.cx + Math.min(R.w * .3, 110), g.cy - R.h * .36, { k: eb(seg(m.u, .2, .3)), fs: 16 });
}

// --- pointers (free play) ----------------------------------------------------------------------------------------------------
const cv = $('cv');
const ptOf = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
cv.addEventListener('pointerdown', (ev) => {
  const view = lab.view; if (!isFree(view) || S.sec || !LY) return;
  const p = ptOf(ev);
  if (view === 'table') {
    if (FP && FP.state !== 'back') return;
    const hit = KEYS.find((k) => { const r = restPose('table', k); return Math.hypot(p.x - r.x, p.y - r.y) < LY.ts * .6; });
    if (!hit) return;
    FP = { key: hit, x: p.x, y: p.y, state: 'drag', touch: ev.pointerType === 'touch', t0: now() };
    cv.setPointerCapture(ev.pointerId); sfx.tick();
  } else {
    DL.has = true; DL.drag = true; DL.x = p.x; DL.y = p.y; DL.touch = ev.pointerType === 'touch';
    cv.setPointerCapture(ev.pointerId); sfx.tick();
  }
});
cv.addEventListener('pointermove', (ev) => {
  const p = ptOf(ev);
  if (lab.view === 'table' && FP && FP.state === 'drag') { FP.x = p.x; FP.y = p.y; }
  else if (lab.view === 'detail' && DL.drag) { DL.x = p.x; DL.y = p.y; }
});
const endDrag = (ev) => {
  if (lab.view === 'detail') { DL.drag = false; return; }
  if (!(FP && FP.state === 'drag')) return;
  const p = ptOf(ev), s1 = freeCell(p.x, p.y - (FP.touch ? LY.ts * .55 : 0)), slot = s1 >= 0 ? s1 : freeCell(p.x, p.y);
  const rest = restPose('table', FP.key), from = { x: FP.x, y: FP.y - (FP.touch ? LY.ts * .55 : 0), len: rest.len * 1.15, rot: rest.rot * .4 }; from.gy = from.y + GO[FP.key] * from.len;
  FP.from = from; FP.t0 = now();
  if (slot >= 0) {
    const ok = SET[slot].includes(FP.key) && SET[slot][OK.table[slot]] === FP.key;
    FP.state = 'on'; FP.slot = slot; FP.ok = ok; FP.text = ok ? T[lang].t.res[slot] : '?'; (ok ? sfx.good : sfx.bad)();
    FP.ro = FP.text; render();
  } else FP.state = 'back';
};
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls -----------------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function startRet(a) {
  if (!a || !a.last) return;
  const list = []; a.last.forEach((from, idx) => { if (from) list.push({ key: a.key, idx, from }); });
  if (list.length) RET = { view: a.view, list, t0: now() };
}
function startReveal(view, i, j) {
  const t0 = now(), a = { view, i, t0, key: rightKey(view, i), wrong: null, tw: 0, pre: view === 'fooled' && i === 1 ? 2.6 : 0, dur: USE[view][i], fin: false, last: [] };
  if (view === 'table' && j !== OK.table[i]) { a.wrong = SET[i][j]; a.tw = HOP + FLY + HOLD + BACK; }
  a.tu = t0 + a.tw + a.pre; a.end = a.tu + HOP + FLY + a.dur;
  AV[view] = a; RET = null;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const view = lab.view, v = V[view];
  const o = ev.target.closest('.tl-o');
  if (o) {
    if (v.rev || v.done) return;
    const j = +o.dataset.j, i = v.i;
    v.pick = j; v.rev = true; v.any = true; v.fin = false; v.right[i] = j === OK[view][i];
    startReveal(view, i, j); sfx.click(); render(); showStage(); return;
  }
  const chip = ev.target.closest('[data-k]');
  if (chip) {
    if (!secret.unlocked()) return secret.open();
    const k = chip.dataset.k; S.sec = S.sec === k ? null : k; S.secT = now(); sfx.click(); render(); if (S.sec) showStage(); return;
  }
  if (ev.target.closest('#tlMain')) {
    if (v.done) { V[view] = freshV(); FP = null; DL = { has: false, x: 0, y: 0, drag: false, touch: false }; if (AV[view]) { startRet(AV[view]); AV[view] = null; } sfx.click(); render(); return; }
    if (!v.fin) return;
    if (AV[view]) { startRet(AV[view]); AV[view] = null; }
    v.i++; v.pick = null; v.rev = false; v.fin = false; sfx.click(); render();
  }
});

// --- one render per change: controls, readout and the state card -------------------------------------------------------------------
function setRO(val, sub, pill_, color) {
  lab.setReadout(esc(val), sub, pill_, color);
  const el = $('val'); el.style.fontSize = String(val).length > 16 ? '17px' : String(val).length > 11 ? '22px' : '';
}
function render() {
  const t = T[lang], view = lab.view, v = V[view], sec = view === 'table' && S.sec, free = isFree(view), i = v.i, n = N[view];
  document.body.dataset.v = view;
  lab.setGlow('rgba(201, 165, 116, .3)');
  // options
  const opts = $('tlOpts'), labels = view === 'table' ? t.t.o[i] : view === 'fooled' ? t.f.o[i] : t.d.o[i];
  opts.dataset.c = view === 'table' ? '3' : '1';
  const okIdx = v.rev ? OK[view][i] : -1;
  opts.innerHTML = (sec || free) ? '' : labels.map((l, j) => `<button class="tl-o ${v.rev ? (j === okIdx ? 'good' : j === v.pick ? 'bad' : 'dim') : ''}" data-j="${j}"${v.rev ? ' disabled' : ''}>${esc(l)}</button>`).join('');
  // question / hint
  const asking = !sec && !free;
  askEl.style.display = asking ? '' : 'none';
  askEl.innerHTML = `<div class="q">${esc(view === 'table' ? t.t.q[i] : view === 'fooled' ? t.f.q[i] : t.d.q[i])}</div>`;
  hintEl.style.display = free && !sec ? '' : 'none';
  hintEl.textContent = view === 'table' ? t.t.free : t.d.drag;
  // chips (table view only) and the main button
  $('tlChipsRow').style.display = view === 'table' ? '' : 'none';
  const open = secret.unlocked();
  $('tlChips').innerHTML = [['micro', '🔬'], ['span', '✋']].map(([k, emo]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const main = $('tlMain');
  main.textContent = v.done ? t.again : t.next;
  main.disabled = !v.done && !v.fin;
  main.style.display = sec || (!v.rev && !v.done) ? 'none' : '';
  // readout + state card
  const ST = t.st[view], full = v.done, one = (a) => ({ emo: a[0], title: a[1], lead: a[2], body: '', extra: a[3] });
  if (sec) {
    lab.setState({ emo: S.sec === 'micro' ? '🔬' : '✋', title: t.secrets[S.sec][0], lead: t.secrets[S.sec][1], body: S.sec === 'micro' ? t.sec.microText : t.sec.spanText, extra: '' });
    setRO('🔎', t.secrets[S.sec][0], '', '#E0B354'); return;
  }
  const why = view === 'table' ? t.t.why[i] : view === 'fooled' ? t.f.why[i] : t.d.why[i];
  const emo = view === 'table' ? TOOL_EMO[SET[i][OK.table[i]]] : view === 'fooled' ? TOOL_EMO[FOOLTOOL[i]] : '🔍';
  const ok = v.right[i];
  if (free) {
    setRO(FP?.ro || '', view === 'table' ? t.t.free : t.d.drag, '', '#E0B354');
    lab.setState({ ...one(ST.f), body: why }); return;
  }
  if (!v.rev) {
    setRO('?', `${i + 1} / ${n}`, '', '#E0B354');
    lab.setState(one(ST.n));
  } else if (!v.fin) {
    setRO('?', `${i + 1} / ${n}`, '', '#E0B354');
    lab.setState(one(ST.n));
  } else {
    const res = view === 'table' ? t.t.res[i] : view === 'fooled' ? fooledRes(i) : t.d.o[i][OK.detail[i]];
    setRO(res, `${i + 1} / ${n}`, ok ? t.right : t.wrong, ok ? '#3DDC97' : '#E0B354');
    lab.setState(full ? { ...one(ST.f), body: why } : { emo, title: ok ? t.right : t.wrong, lead: why, body: '', extra: '' });
  }
}
render();
</script>
