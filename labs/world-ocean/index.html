const wrap180 = (l) => ((l + 180) % 360 + 360) % 360 - 180;

// 0 Pacific, 1 Atlantic, 2 Indian, 3 Arctic, 4 Southern. The simple rules of the spec, plus a few seas it does not mention.
const PAC_LINE = [[-77, 9], [-83, 9], [-85.5, 10.5], [-87.5, 13.5], [-92, 15], [-98, 17.5]]; // Central America's Pacific coast
function pacSide(lat, lon) {
  if (lon >= -77) return false;
  if (lon < -98) return true;
  for (let i = 0; i < PAC_LINE.length - 1; i++) {
    const [x0, y0] = PAC_LINE[i], [x1, y1] = PAC_LINE[i + 1];
    if (lon <= x0 && lon >= x1) return lat < y0 + (y1 - y0) * (lon - x0) / (x1 - x0);
  }
  return false;
}
function oceanOf(lat, lon) {
  lon = wrap180(lon);
  if (lat > 66) return 3;
  if (lat < -60) return 4;
  if (lat > 50 && lat < 66 && lon > -96 && lon < -76) return 3;       // Hudson Bay
  if (lat >= 30 && lat <= 47 && lon >= -6 && lon <= 42) return 1;      // Mediterranean and Black Sea
  if (lat >= 52 && lat <= 66 && lon >= 9 && lon <= 32) return 1;       // Baltic
  if (lat >= 0) {
    if (lon >= -98 && lon <= 20) return pacSide(lat, lon) ? 0 : 1;     // north Atlantic with the Caribbean and the Gulf of Mexico
    if (lon >= 32 && lon <= 60 && lat >= 12 && lat < 30) return 2;     // Red Sea, Persian Gulf
    if (lon > 20 && lon < 100 && lat < 25) return 2;
    return 0;
  }
  if (lon >= -65 && lon < 20) return 1;
  if (lon >= 20 && lon < 120) return 2;
  if (lon >= 120 && lon < 147 && lat < -10 && !(lon > 136 && lat > -20)) return 2;
  return 0;
}
const OCEAN_GRID = MASK.map((row, r) => [...row].map((ch, c) => (ch === '#' ? -1 : oceanOf(87.5 - 5 * r, -177.5 + 5 * c))));

// the dotted globe: about 2500 points on a Fibonacci sphere, each knows if it is land
const N = 2500, GA = Math.PI * (3 - Math.sqrt(5));
const DOT = { sl: new Float32Array(N), cl: new Float32Array(N), lon: new Float32Array(N), land: new Uint8Array(N) };
for (let i = 0; i < N; i++) {
  const y = 1 - 2 * (i + 0.5) / N, lat = Math.asin(y) * 180 / Math.PI, lon = ((i * GA + Math.PI) % (2 * Math.PI)) - Math.PI;
  DOT.sl[i] = y; DOT.cl[i] = Math.sqrt(1 - y * y); DOT.lon[i] = lon; DOT.land[i] = isLand(lat, lon * 180 / Math.PI) ? 1 : 0;
}

// the voyage: lat, lon (longitude keeps growing past 180 so a segment never jumps across the map)
const WP = [[10, -30], [-20, -15], [-40, 10], [-42, 25], [-40, 45], [-44, 70], [-45, 95], [-45, 120], [-47, 140], [-50, 160], [-53, 185], [-56, 210],
  [-58, 240], [-58.5, 270], [-59, 292], [-56, 308], [-45, 310], [-35, 322], [-15, 332], [0, 335], [10, 330]];
const gcDeg = (a, b) => {
  const p1 = a[0] * Math.PI / 180, p2 = b[0] * Math.PI / 180, dl = (b[1] - a[1]) * Math.PI / 180;
  return Math.acos(clamp(Math.sin(p1) * Math.sin(p2) + Math.cos(p1) * Math.cos(p2) * Math.cos(dl), -1, 1)) * 180 / Math.PI;
};
const CUM = [0];
for (let i = 1; i < WP.length; i++) CUM.push(CUM[i - 1] + gcDeg(WP[i - 1], WP[i]));
const PATH_LEN = CUM[CUM.length - 1];
function posAt(s) {
  s = clamp(s, 0, PATH_LEN);
  let i = 1; while (i < WP.length - 1 && CUM[i] < s) i++;
  const f = (s - CUM[i - 1]) / ((CUM[i] - CUM[i - 1]) || 1);
  return { lat: lerp(WP[i - 1][0], WP[i][0], f), lon: wrap180(lerp(WP[i - 1][1], WP[i][1], f)) };
}

function pillText(c, text, cx, cy, o = {}) {

  const pw = c.measureText(text).width + (o.padX ?? 16), ph = size + (o.padY ?? 12);

// a seahorse in a 100-unit box centred on (cx, cy): a thick curled spine, snout, dorsal fin, crown spikes and an eye
const SEAHORSE = [[6, -38, 11], [8, -27, 8.5], [6, -14, 12.5], [2, 0, 14], [4, 14, 11], [12, 26, 7.5], [20, 36, 5.5], [22, 45, 4.2], [15, 50, 3.4], [8, 47, 2.8], [6, 41, 2.2], [11, 38, 1.6]];

    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let k = 0; k < 8; k++) { const t = k / 8; out.push([0, 1, 2].map((j) => cr(p0[j], p1[j], p2[j], p3[j], t))); }

})();

  tube(2, -38, -15, -34, 3.6, 2.3, '#FFB547');

  // belly light and body rings
  for (let i = 8; i < 40; i += 1) { const [x, y, r] = SPINE[i]; c.fillStyle = 'rgba(255, 224, 160, .5)'; c.beginPath(); c.arc(x - r * 0.28, y - r * 0.1, r * 0.55, 0, TAU); c.fill(); }
  c.strokeStyle = 'rgba(201, 118, 10, .55)'; c.lineWidth = 1;
  for (let i = 12; i < 62; i += 5) { const [x, y, r] = SPINE[i], [x2, y2] = SPINE[i + 1]; const a = Math.atan2(y2 - y, x2 - x) + Math.PI / 2;
    c.beginPath(); c.arc(x, y, r * 0.92, a - 1.2, a + 1.2); c.stroke(); }
  // crown spikes, eye with a white highlight
  c.fillStyle = '#E58C12'; for (const [x, y, r] of [[10, -48, 2.2], [14, -45, 1.8], [16, -40, 1.5]]) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }

  c.fillStyle = '#1B2236'; c.beginPath(); c.arc(3, -40, 2.1, 0, TAU); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(2.3, -40.9, 0.8, 0, TAU); c.fill();

}

const STAR_R = rngOf(7);

// 100 raindrops at random points spread evenly over the whole sphere; a run that ends outside 66..76 water is thrown away
function makeDrops() {
  for (let attempt = 0; attempt < 500; attempt++) {
    const drops = []; let sea = 0;
    for (let i = 0; i < 100; i++) {
      const y = Math.random() * 2 - 1, lat = Math.asin(y) / RAD, lon = Math.random() * 360 - 180, land = isLand(lat, lon);
      if (!land) sea++;
      drops.push({ lat, lon, land, sl: y, cl: Math.sqrt(1 - y * y), k: 0 });
    }
    if (sea >= 66 && sea <= 76) return drops;
  }
  return [];
}
// the globe turns and tips while it rains; every drop lands at a moment when its own spot faces us
const rainCam = (k) => ({ lon: S.g.lon0 - ROT * k, lat: 35 * Math.cos(Math.PI * clamp01(k / RAIN_T)) });
function scheduleDrops(drops) {
  for (const d of drops) {
    const ok = [];
    for (let k = 0.5; k <= RAIN_T - 0.4; k += 0.05) {
      const cam = rainCam(k), la = cam.lat * RAD, z = Math.sin(la) * d.sl + Math.cos(la) * d.cl * Math.cos(d.lon * RAD - cam.lon * RAD);
      if (z > 0.3) ok.push(k);
    }
    d.k = ok.length ? ok[Math.floor(Math.random() * ok.length)] : Math.random() * RAIN_T;
  }
}
function startRain() {
  const G = S.g;
  G.phase = 'rain'; G.rt = 0; G.lon0 = S.cam.lon; G.drops = makeDrops(); scheduleDrops(G.drops);
  G.countOn = true; G.nSea = 0; G.nLand = 0; S.spin = 0; S.vdrag = 0;
}
function startSail() {
  const G = S.g;
  G.phase = 'sail'; G.sail = { s: 0, t: 0 }; G.trail = []; G.sailDone = false; G.lastTrail = 0;
  G.boat = { ...posAt(0), dir: 1 };
  S.spin = 0; S.vdrag = 0;
}

function stepGlobe(dt, t) {
  const G = S.g, cam = S.cam;
  if (G.phase === 'ripple') {
    G.colorT = Math.min(1, G.colorT + dt / 1.9);
    if (G.colorT >= 1) startRain();
  }
  if (G.phase === 'rain') {
    G.rt += dt;
    const c = rainCam(Math.min(G.rt, RAIN_T));
    cam.lon = c.lon; cam.lat += (c.lat - cam.lat) * (1 - Math.exp(-dt * 8));
    let nl = 0; for (const d of G.drops) if (d.k <= G.rt) nl += d.land ? 1 : 0;
    const n = G.drops.filter((d) => d.k <= G.rt).length;
    if (n - nl !== G.nSea || nl !== G.nLand) {
      G.nSea = n - nl; G.nLand = nl;
      lab.setReadout(`${n} / 100`, '', '', '#4FA3F7');
      $('cSea').textContent = G.nSea; $('cLand').textContent = G.nLand;
    }
    if (G.rt > RAIN_T + 0.8) { G.phase = 'idle'; G.rainDone = true; S.spin = ROT; render(); }
  } else if (G.phase === 'sail') {
    const B = G.sail; B.t += dt;
    if (B.t > 1.6) B.s = Math.min(PATH_LEN, B.s + SAIL_SPEED * dt);
    G.boat = { ...posAt(B.s), dir: G.boat.dir };
    if (B.t > 1.6 && B.s - G.lastTrail > 0.6) { G.trail.push({ lat: G.boat.lat, lon: G.boat.lon, t0: t }); G.lastTrail = B.s; if (G.trail.length > 160) G.trail.shift(); }
    const k = 1 - Math.exp(-dt * 3);
    cam.lon += angDiff(cam.lon, G.boat.lon) * k;
    cam.lat += (clamp(G.boat.lat, -48, 42) - cam.lat) * k;
    if (B.s >= PATH_LEN) { G.phase = 'idle'; G.sailDone = true; S.spin = 4; render(); }
  } else {
    S.spin += ((S.dragging ? 0 : 10) - S.spin) * (1 - Math.exp(-dt * 2));
    if (!S.dragging) cam.lon -= (S.spin + S.vdrag) * dt;
    S.vdrag *= Math.exp(-dt * 2.5);
    cam.lat += (20 - cam.lat) * (1 - Math.exp(-dt * 1.5));
  }
  cam.lon = wrap180(cam.lon);
}

function drawGlobe(c, w, h, dt, t) {
  stepGlobe(dt, t);
  const G = S.g, cam = S.cam;
  const areaH = h - reserve('globe', dt), cx = w / 2, cy = areaH / 2 + 2, R = Math.min(w, areaH) * 0.37, k = clamp(R / 120, 1, 1.9);
  S.R = R;
  // deep space with a few twinkling stars
  for (const st of STARS) {
    c.globalAlpha = 0.35 + 0.5 * (0.5 + 0.5 * Math.sin(t * 1.3 + st.p)); c.fillStyle = '#DDE8FF';

  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(95, 184, 255, .35)'; c.lineWidth = 1.5; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke();

  // the dots: bigger and brighter towards the middle, smaller and dimmer at the limb
  const lam0 = cam.lon * RAD, phi0 = cam.lat * RAD, s0 = Math.sin(phi0), c0 = Math.cos(phi0);
  const buckets = Array.from({ length: 12 }, () => []);
  const rr = easeOut(G.colorT) * 1.18;
  for (let i = 0; i < N; i++) {
    const dl = DOT.lon[i] - lam0, cd = Math.cos(dl), z = s0 * DOT.sl[i] + c0 * DOT.cl[i] * cd;
    if (z <= 0.03) continue;
    const x = DOT.cl[i] * Math.sin(dl), y = c0 * DOT.sl[i] - s0 * DOT.cl[i] * cd;
    let col = 0;
    if (G.colorT >= 1) col = DOT.land[i] ? 1 : 2;
    else if (G.colorT > 0) { const d = Math.hypot(x, y); col = d < rr - 0.05 ? (DOT.land[i] ? 1 : 2) : d < rr + 0.02 ? 3 : 0; }
    buckets[col * 3 + (z < 0.25 ? 0 : z < 0.55 ? 1 : 2)].push(cx + x * R, cy - y * R, (1.2 + 1.8 * z) * k);
  }
  const cols = [GREY, LAND, SEA, RING], alph = [0.55, 0.82, 1];
  buckets.forEach((b, i) => {
    if (!b.length) return;
    c.fillStyle = cols[Math.floor(i / 3)]; c.globalAlpha = alph[i % 3];
    c.beginPath();
    for (let j = 0; j < b.length; j += 3) { c.moveTo(b[j] + b[j + 2], b[j + 1]); c.arc(b[j], b[j + 1], b[j + 2], 0, TAU); }
    c.fill();
  });
  c.globalAlpha = 1;

  const P = (lat, lon) => {
    const phi = lat * RAD, dl = lon * RAD - lam0, sp = Math.sin(phi), cp = Math.cos(phi), cd = Math.cos(dl);
    const z = s0 * sp + c0 * cp * cd;
    return [cx + cp * Math.sin(dl) * R, cy - (c0 * sp - s0 * cp * cd) * R, z];
  };

  // raindrops: a white streak falls, then a ring splashes, blue on the sea and green on the land
  if (G.phase === 'rain') {
    for (const d of G.drops) {
      const dtk = G.rt - d.k;
      if (dtk < -0.32 || dtk > 0.75) continue;
      const [x, y, z] = P(d.lat, d.lon);
      if (z < 0.05) continue;
      if (dtk < 0) {
        const f = -dtk / 0.32, top = y - 80 * f * f - 4;
        c.strokeStyle = `rgba(255, 255, 255, ${0.9 - 0.4 * f})`; c.lineWidth = 2; c.lineCap = 'round';
        c.beginPath(); c.moveTo(x, top - 16); c.lineTo(x, top); c.stroke();
      } else {
        const s = dtk / 0.75, col = d.land ? LAND : SEA;
        c.globalAlpha = 1 - s; c.strokeStyle = d.land ? '#D3FFD9' : '#BFE0FF'; c.lineWidth = 2;
        c.beginPath(); c.arc(x, y, Math.max(0, (2 + 15 * easeOut(s)) * k), 0, TAU); c.stroke();
        c.fillStyle = col; c.beginPath(); c.arc(x, y, Math.max(0, 3.4 * (1 - s) * k), 0, TAU); c.fill();
        c.globalAlpha = 1;
      }
    }
  }

  // the boat: fading wake of white dots, a ring so you can find it, then the sailboat
  if (G.boat && (G.phase === 'sail' || G.sailDone)) {
    for (const p of G.trail) {
      const age = t - p.t0;
      if (age > 7) continue;
      const [x, y, z] = P(p.lat, p.lon);
      if (z < 0.08) continue;
      const f = 1 - age / 7;
      c.globalAlpha = Math.max(0, f * 0.9); c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, Math.max(0, (0.8 + 1.8 * f) * k), 0, TAU); c.fill();
    }
    c.globalAlpha = 1;
    const [bx, by, bz] = P(G.boat.lat, G.boat.lon);
    if (bz > 0.08) {
      const ahead = posAt((G.sail?.s ?? 0) + 2), [ax] = P(ahead.lat, ahead.lon);
      if (G.phase === 'sail' && Math.abs(ax - bx) > 0.3) G.boat.dir += ((ax >= bx ? 1 : -1) - G.boat.dir) * Math.min(1, dt * 5);
      const pop = G.phase === 'sail' ? easeBack(G.sail.t / 0.8) : 1, bob = Math.sin(t * 2.6) * 1.2;
      c.strokeStyle = `rgba(255, 255, 255, ${0.28 + 0.2 * Math.sin(t * 4)})`; c.lineWidth = 1.5;
      c.beginPath(); c.arc(bx, by - 8 * k, Math.max(0, (18 + 2 * Math.sin(t * 4)) * k * pop), 0, TAU); c.stroke();
      drawBoat(c, bx, by + bob, 1.05 * k * pop, G.boat.dir, t);
    }
  }
}

// --- view 2: the flat map of rounded tiles ------------------------------------------------------------------------
const MAP_PAD = 12;
let mapCache = null; // the tiles are painted once per size: the plain map, and one glowing layer per ocean
function buildMap(px, py, d) {
  const W = Math.ceil(72 * px + 2 * MAP_PAD), H = Math.ceil(36 * py + 2 * MAP_PAD);
  const mk = () => { const cvs = document.createElement('canvas'); cvs.width = Math.ceil(W * d); cvs.height = Math.ceil(H * d); const g = cvs.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); return [cvs, g]; };
  const gap = Math.max(0.7, px * 0.14), rad = Math.min(px, py) * 0.3, edge = Math.max(1, py * 0.17);
  const tile = (g, r, cc, hh) => { g.beginPath(); g.roundRect(MAP_PAD + cc * px + gap / 2, MAP_PAD + r * py + gap / 2, px - gap, hh ?? (py - gap), rad); };
  const [base, bg] = mk();
  for (let r = 0; r < 36; r++) for (let cc = 0; cc < 72; cc++) {
    if (OCEAN_GRID[r][cc] < 0) {
      bg.fillStyle = '#4FAF63'; tile(bg, r, cc); bg.fill();
      bg.fillStyle = '#7EDB8A'; tile(bg, r, cc, py - gap - edge); bg.fill();
    } else { bg.fillStyle = '#2F6FB0'; tile(bg, r, cc); bg.fill(); }
  }
  const lit = OC.map((col, i) => {
    const [cvs, g] = mk();
    g.fillStyle = col; g.shadowColor = col; g.shadowBlur = Math.max(5, px * 1.6);
    for (let r = 0; r < 36; r++) for (let cc = 0; cc < 72; cc++) if (OCEAN_GRID[r][cc] === i) { tile(g, r, cc); g.fill(); }
    return cvs;
  });
  return { base, lit, W, H, key: `${px.toFixed(2)}|${py.toFixed(2)}|${d}` };
}

function drawFive(c, w, h, dt, t) {
  const F = S.f, d = Math.min(window.devicePixelRatio || 1, 2);
  const areaH = h - reserve('five', dt) - 10;
  let px = (w - 16) / 72, py = Math.min(px * 1.4, areaH / 36);
  px = Math.min(px, py * 1.8);
  const x0 = (w - 72 * px) / 2, y0 = 10 + Math.max(0, (areaH - 36 * py) / 2);
  S.geo = { x0, y0, px, py };
  const key = `${px.toFixed(2)}|${py.toFixed(2)}|${d}`;
  if (!mapCache || mapCache.key !== key) mapCache = buildMap(px, py, d);
  c.drawImage(mapCache.base, x0 - MAP_PAD, y0 - MAP_PAD, mapCache.W, mapCache.H);
  for (let i = 0; i < 5; i++) {
    F.lit[i] += clamp(F.tgt[i] - F.lit[i], -dt * 2.2, dt * 2.2);
    if (F.lit[i] < 0.01) continue;
    c.globalAlpha = F.lit[i] * (0.8 + 0.2 * Math.sin(t * 3 + i * 1.3));
    c.drawImage(mapCache.lit[i], x0 - MAP_PAD, y0 - MAP_PAD, mapCache.W, mapCache.H);
  }
  c.globalAlpha = 1;
  const cell = (r, cc) => [x0 + (cc + 0.5) * px, y0 + (r + 0.5) * py];
  // the tapped tile: green ring when right, flashing red when wrong, white blink for land
  if (F.flash) {
    const [fx, fy] = cell(F.flash.r, F.flash.c), age = t - F.flash.t0, col = F.flash.col;
    const pulse = F.flash.keep ? 0.6 + 0.4 * Math.sin(age * 8) : clamp01(1 - age / 0.7);
    if (pulse > 0) {
      c.fillStyle = col; c.globalAlpha = pulse; c.beginPath(); c.roundRect(fx - px * 0.9, fy - py * 0.9, px * 1.8, py * 1.8, Math.min(px, py) * 0.5); c.fill();
      c.globalAlpha = Math.max(0, 0.9 - age) ; c.strokeStyle = col; c.lineWidth = 2; c.beginPath(); c.arc(fx, fy, Math.max(0, px * 1.5 + age * 22), 0, TAU); c.stroke();
      c.globalAlpha = 1;
    }
  }
  const inPhase = F.phase === 'round' && F.res;
  // labels: the ocean that was asked for, and (when the tap was wrong) the ocean that was tapped
  if (inPhase) {
    const [ax, ay] = cell(...[latIdx(ANCHOR[F.i][0]), lonIdx(ANCHOR[F.i][1])]);
    pillText(c, oceanName(F.i), ax, ay, { border: OC[F.i], size: 13 });
    if (!F.res.ok) { const [fx, fy] = cell(F.res.r, F.res.c); pillText(c, oceanName(F.res.true), fx, fy - py * 3.2, { border: '#FF3B30', size: 13 }); }
  } else if (F.phase === 'q2') {
    for (let i = 0; i < 5; i++) if (F.lit[i] > 0.6) { const [ax, ay] = cell(latIdx(ANCHOR[i][0]), lonIdx(ANCHOR[i][1])); pillText(c, oceanName(i), ax, ay, { border: OC[i], size: 12 }); }
  }
}

function tapFive(ev) {
  const F = S.f, g = S.geo;
  if (F.phase !== 'round' || F.res || !g) return;
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const cc = Math.floor((x - g.x0) / g.px), rr = Math.floor((y - g.y0) / g.py);
  if (cc < 0 || cc > 71 || rr < 0 || rr > 35) return;
  let best = OCEAN_GRID[rr][cc] >= 0 ? [rr, cc] : null;
  if (!best) { // a tap on land counts if a sea tile is right beside it (the Southern and Arctic bands are thin)
    let bd = 1.7;
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const r2 = rr + a, c2 = cc + b;
      if (r2 < 0 || r2 > 35 || OCEAN_GRID[r2][c2 < 0 ? 71 : c2 > 71 ? 0 : c2] < 0) continue;
      const dist = Math.hypot(g.x0 + (c2 + 0.5) * g.px - x, g.y0 + (r2 + 0.5) * g.py - y) / g.px;
      if (dist < bd) { bd = dist; best = [r2, c2]; }
    }
  }
  if (!best) { F.flash = { r: rr, c: cc, t0: now(), col: '#FFFFFF' }; sfx.tick(); return; }
  const tr = OCEAN_GRID[best[0]][best[1]], ok = tr === F.i;
  F.res = { ok, r: best[0], c: best[1], true: tr };
  F.flash = { r: best[0], c: best[1], t0: now(), col: ok ? '#3ddc97' : '#FF3B30', keep: !ok };
  F.tgt[F.i] = 1; F.answered++; if (ok) F.got++;
  (ok ? sfx.good : sfx.bad)(); render(); showStage();
}

// --- view 3: fish or not? --------------------------------------------------------------------------------------
const BUB_R = rngOf(31);
const BUBBLES = Array.from({ length: 18 }, () => ({ x: BUB_R(), y: BUB_R(), r: 2 + BUB_R() * 5, v: 0.03 + BUB_R() * 0.05, p: BUB_R() * TAU }));
const badgeText = (a) => {
  const l = T[lang].l;
  return a.kind === 'fish' ? l.gills : a.kind === 'mammal' ? `${l.mammal}: ${l.air} 💨` : a.kind === 'mollusc' ? `${l.mollusc}: ${l.noBones}` : a.kind === 'crust' ? `${l.crust}: ${l.shell}` : `${l.notFish}: ${l.jelly}`;
};
// the animal on a token: an emoji, or the seahorse we draw ourselves
function drawAnimal(c, a, x, y, size, t) {
  if (a.emo === null) { drawSeahorse(c, x, y, size * 1.12, t); return; }
  c.save(); c.globalAlpha = 1; c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = `${Math.round(size)}px ${EMO}`; c.fillText(a.emo, x, y + size * 0.05);
  c.restore();
}

function drawLife(c, w, h, dt, t) {
  const L = S.l, bg = c.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#14487a'); bg.addColorStop(0.55, '#0E2C52'); bg.addColorStop(1, '#0B1020');
  c.fillStyle = bg; c.fillRect(0, 0, w, h);
  // slow light rays from above and bubbles that drift up
  for (let i = 0; i < 3; i++) {
    const x = w * (0.2 + 0.3 * i) + Math.sin(t * 0.3 + i) * 12, g = c.createLinearGradient(x, 0, x, h * 0.8);
    g.addColorStop(0, 'rgba(150, 210, 255, .13)'); g.addColorStop(1, 'rgba(150, 210, 255, 0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(x - 14, 0); c.lineTo(x + 14, 0); c.lineTo(x + 60, h * 0.8); c.lineTo(x - 40, h * 0.8); c.closePath(); c.fill();
  }
  for (const b of BUBBLES) {
    b.y -= b.v * dt; if (b.y < -0.05) { b.y = 1.05; }
    const x = b.x * w + Math.sin(t * 0.8 + b.p) * 6, y = b.y * h;
    c.strokeStyle = 'rgba(200, 230, 255, .35)'; c.lineWidth = 1.2; c.beginPath(); c.arc(x, y, b.r, 0, TAU); c.stroke();
    c.fillStyle = 'rgba(255, 255, 255, .25)'; c.beginPath(); c.arc(x - b.r * 0.3, y - b.r * 0.3, Math.max(0, b.r * 0.25), 0, TAU); c.fill();
  }
  const areaH = h - reserve('life', dt);
  if (L.phase === 'board') drawBoard(c, w, areaH, t); else drawCard(c, w, areaH, t);
}

function drawCard(c, w, areaH, t) {
  const L = S.l, a = ANI[L.i], r = Math.max(30, Math.min(w * 0.27, (areaH - 96) / 2)), total = r * 0.3 + 2 * r + 50;
  const top = Math.max(6, (areaH - total) / 2 + 2), cx = w / 2, cy = top + r * 0.3 + r;
  const e = easeBack((t - L.t0) / 0.55), revealed = L.ans !== null, bob = Math.sin(t * 1.6) * 3;
  // the round card
  c.save();
  c.shadowColor = 'rgba(0, 0, 0, .5)'; c.shadowBlur = 24; c.shadowOffsetY = 9;
  const g = c.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r * 1.1);
  g.addColorStop(0, '#2F72B3'); g.addColorStop(1, '#12365F');
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, Math.max(0, r * e), 0, TAU); c.fill();
  c.restore();
  c.strokeStyle = 'rgba(160, 210, 255, .55)'; c.lineWidth = 2.2; c.beginPath(); c.arc(cx, cy, Math.max(0, r * e), 0, TAU); c.stroke();
  c.strokeStyle = 'rgba(255, 255, 255, .18)'; c.lineWidth = 3; c.beginPath(); c.arc(cx, cy, Math.max(0, r * e - 7), Math.PI * 1.05, Math.PI * 1.55); c.stroke();
  // the animal
  c.save(); c.translate(cx, cy + bob); c.scale(e, e);
  drawAnimal(c, a, 0, 0, r * 1.05, t);
  c.restore();
  if (!revealed) return;
  // reveal: a badge with the key feature
  const text = badgeText(a), fish = a.kind === 'fish', col = fish ? '#4FA3F7' : '#FFB547', by = cy + r + 22, pop = easeBack((t - L.rt) / 0.4);
  let size = 14;
  c.save(); c.font = `800 ${size}px ${FONT}`;
  const extra = fish ? 30 : 0;
  while (c.measureText(text).width + 28 + extra > w - 16 && size > 12) { size--; c.font = `800 ${size}px ${FONT}`; }
  const tw = c.measureText(text).width, bw = tw + 28 + extra, bh = size + 16;
  c.translate(cx, by); c.scale(pop, pop);
  c.fillStyle = 'rgba(10, 14, 28, .88)'; c.strokeStyle = col; c.lineWidth = 2;
  c.beginPath(); c.roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(text, -bw / 2 + 14 + extra, 1);
  if (fish) { // animated gill slits: three arcs that flare one after another
    c.strokeStyle = '#8FD0FF'; c.lineWidth = 2.4; c.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      c.globalAlpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 5 - i * 1.2));
      c.beginPath(); c.arc(-bw / 2 + 17 + i * 6, 0, bh * 0.3, -0.95, 0.95); c.stroke();
    }
  }
  c.restore();
  // a breath puff rising from the mammal
  if (a.kind === 'mammal') {
    for (let i = 0; i < 4; i++) {
      const ph = ((t * 0.8 + i * 0.25) % 1), px = cx + r * 0.5 + ph * r * 0.3, py = cy - r * 0.78 - ph * r * 0.42;
      c.globalAlpha = (1 - ph) * 0.85; c.fillStyle = '#EAF6FF';
      c.beginPath(); c.arc(px, py, Math.max(0, 3 + 11 * ph) * clamp(r / 90, 0.8, 1.4), 0, TAU); c.fill();
    }
    c.globalAlpha = 1;
  }
}

// at the end: a sorted board, fish on one side and not-fish on the other
function drawBoard(c, w, areaH, t) {
  const L = S.l, tx = T[lang].l, cols = [[], []];
  ANI.forEach((a, i) => cols[a.fish ? 0 : 1].push(i));
  const tok = clamp(Math.min(w / 8, (areaH - 70) / 6), 22, 30), rowH = tok * 2 + 22;
  [0, 1].forEach((side) => {
    const mid = w * (side ? 0.75 : 0.25);
    pillText(c, side ? tx.notFish : tx.fish, mid, 22, { border: side ? '#FFB547' : '#4FA3F7', size: 14 });
    cols[side].forEach((i, j) => {
      const e = easeBack((t - L.t0 - 0.12 * i) / 0.45), x = mid + (j % 2 ? 1 : -1) * tok * 1.5, y = 62 + tok + Math.floor(j / 2) * rowH;
      c.save(); c.translate(x, y); c.scale(e, e);
      const g = c.createRadialGradient(-tok * 0.3, -tok * 0.35, tok * 0.1, 0, 0, tok * 1.1);
      g.addColorStop(0, '#2F72B3'); g.addColorStop(1, '#12365F');
      c.fillStyle = g; c.shadowColor = 'rgba(0, 0, 0, .45)'; c.shadowBlur = 10; c.shadowOffsetY = 4;
      c.beginPath(); c.arc(0, 0, tok, 0, TAU); c.fill();
      c.shadowColor = 'transparent'; c.strokeStyle = 'rgba(160, 210, 255, .5)'; c.lineWidth = 1.6; c.stroke();
      drawAnimal(c, ANI[i], 0, 0, tok * 1.05, t);
      const ok = L.res[i];
      c.fillStyle = ok ? '#3ddc97' : '#F5C84C'; c.beginPath(); c.arc(tok * 0.72, -tok * 0.72, 9, 0, TAU); c.fill();
      c.strokeStyle = '#0B1020'; c.lineWidth = 2; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath();
      if (ok) { c.moveTo(tok * 0.72 - 4, -tok * 0.72); c.lineTo(tok * 0.72 - 1, -tok * 0.72 + 3); c.lineTo(tok * 0.72 + 4, -tok * 0.72 - 3); }
      else { c.moveTo(tok * 0.72, -tok * 0.72 - 4); c.lineTo(tok * 0.72, -tok * 0.72 + 1); c.moveTo(tok * 0.72, -tok * 0.72 + 4); c.lineTo(tok * 0.72, -tok * 0.72 + 4.2); }
      c.stroke();
      c.restore();
      c.save(); c.globalAlpha = clamp01(e); c.fillStyle = '#D3D9E8'; c.font = `800 12px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(tx.names[i], x, y + tok + 13); c.restore();
    });
  });
}

// --- secret 1: how deep? A side cut of the Mariana Trench with Everest drawn to scale ----------------------------
const EVEREST = 8.8, DEEPEST = 10.9, DEEP_RANGE = 10.4 + 13; // km of picture above the sea and below it
function drawDeep(c, w, h, dt, t) {
  const D = S.deep, tx = T[lang].sec, unit = tx.unit;
  if (D.run) {
    D.t += dt; D.p = clamp01(D.t / 4.8);
    if (D.p >= 1) { D.run = false; D.done = true; render(); }
  }
  const area = h - reserve('deep', dt), top = 16, bot = area - 8, sc = (bot - top) / DEEP_RANGE, ySea = top + 10.4 * sc, Y = (alt) => ySea - alt * sc;
  const ba = lerp(1.2, -DEEPEST, easeInOut(D.p)); // altitude of Everest's foot, in km
  const cx = w * 0.58, Wm = Math.min(w * 0.4, 190), Wb = Wm * 0.2, wB = Wb * 1.7;
  const floorAlt = (x) => -(4.2 + 6.7 * Math.pow(clamp01((Wm - Math.abs(x - cx)) / (Wm - Wb)), 1.3));
  // sky and water
  let g = c.createLinearGradient(0, 0, 0, ySea); g.addColorStop(0, '#0B1020'); g.addColorStop(1, '#27497E');
  c.fillStyle = g; c.fillRect(0, 0, w, ySea + 1);
  g = c.createLinearGradient(0, ySea, 0, bot); g.addColorStop(0, '#3C8FDD'); g.addColorStop(0.33, '#17497F'); g.addColorStop(1, '#050B18');
  c.fillStyle = g; c.fillRect(0, ySea, w, bot - ySea + 2);
  // a depth marker every kilometre
  c.font = `800 12px ${FONT}`; c.textAlign = 'left'; c.textBaseline = 'middle';
  for (let k = 1; k <= 11; k++) {
    const y = Y(-k);
    c.strokeStyle = k === 11 ? 'rgba(255, 255, 255, .28)' : 'rgba(255, 255, 255, .11)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(46, y); c.lineTo(w, y); c.stroke();
    c.fillStyle = 'rgba(225, 238, 255, .9)'; c.fillText(`${k} ${unit}`, 8, y);
  }
  // Everest: a concave, jagged peak with a snow cap, light from the top left
  const H = EVEREST * sc, yb = Y(ba), jl = [0, 0.02, -0.03, 0.04, -0.02, 0.03, -0.04, 0.02, -0.02, 0.03, 0], jr = [0, -0.03, 0.02, -0.04, 0.03, -0.02, 0.04, -0.02, 0.03, -0.02, 0];
  const half = (u, j) => (wB / 2) * (0.07 + 0.93 * Math.pow(u, 1.35)) * (1 + j);
  c.beginPath();
  for (let i = 0; i <= 10; i++) { const u = i / 10; c.lineTo(cx - half(u, jl[i]), yb - H + u * H); }
  for (let i = 10; i >= 0; i--) { const u = i / 10; c.lineTo(cx + half(u, jr[i]), yb - H + u * H); }
  c.closePath();

  pillText(c, `${tx.deepName} ${fmt(DEEPEST)} ${unit}`, Math.min(w - 10, Math.max(w / 2, cx + 80)), Y(-DEEPEST) + (bot - Y(-DEEPEST)) / 2, { border: '#9B8CFF', size: 12 });

// --- secret 2: salty sea. A glass of sea water on a sunny windowsill dries, and the salt stays --------------------
const CRYST_R = rngOf(11);
const CRYST = Array.from({ length: 90 }, (_, i) => ({ a: CRYST_R() * 2 - 1, b: Math.pow(CRYST_R(), 1.6), s: 3 + CRYST_R() * 3.5, r: CRYST_R() * 3, p: CRYST_R() * TAU }));
function drawSalt(c, w, h, dt, t) {
  const Sa = S.salt;
  if (Sa.play) {
    Sa.u = Math.min(1, Sa.u + dt / 8);
    const sl = $('saltRange'); if (sl) sl.value = Math.round(Sa.u * 1000);
    if (Sa.u >= 1) { Sa.play = false; render(); }
  }
  Sa.wisp += ((Sa.play ? 1 : 0) - Sa.wisp) * Math.min(1, dt * 3);
  const area = h - reserve('salt', dt), u = Sa.u;
  const paneB = area * 0.68, sillT = paneB, sillH = 38;
  // the window: sky, a warm sun with turning rays, a frame
  let g = c.createLinearGradient(0, 14, 0, paneB); g.addColorStop(0, '#4E9CEB'); g.addColorStop(1, '#CDE8FF');
  c.fillStyle = g; c.beginPath(); c.roundRect(14, 14, w - 28, paneB - 14, 12); c.fill();
  const sx = w * 0.8, sy = area * 0.2;
  g = c.createRadialGradient(sx, sy, 2, sx, sy, 70); g.addColorStop(0, 'rgba(255, 246, 200, 1)'); g.addColorStop(0.3, 'rgba(255, 220, 120, .65)'); g.addColorStop(1, 'rgba(255, 210, 100, 0)');
  c.fillStyle = g; c.fillRect(sx - 80, sy - 80, 160, 160);
  c.save(); c.beginPath(); c.roundRect(14, 14, w - 28, paneB - 14, 12); c.clip();
  c.strokeStyle = 'rgba(255, 236, 160, .45)'; c.lineWidth = 3; c.lineCap = 'round';
  for (let i = 0; i < 12; i++) { const a = t * 0.2 + i * TAU / 12; c.beginPath(); c.moveTo(sx + Math.cos(a) * 30, sy + Math.sin(a) * 30); c.lineTo(sx + Math.cos(a) * (46 + 8 * Math.sin(t * 2 + i)), sy + Math.sin(a) * (46 + 8 * Math.sin(t * 2 + i))); c.stroke(); }
  c.fillStyle = '#FFF3B8'; c.beginPath(); c.arc(sx, sy, 22, 0, TAU); c.fill();
  // a soft cloud
  c.fillStyle = 'rgba(255, 255, 255, .85)'; const cxl = ((t * 6) % (w + 120)) - 60;
  for (const [dx, dy, r] of [[0, 0, 14], [16, -6, 17], [34, 0, 13], [17, 5, 15]]) { c.beginPath(); c.arc(cxl + dx, area * 0.3 + dy, r, 0, TAU); c.fill(); }
  c.restore();
  c.strokeStyle = '#E9EDF5'; c.lineWidth = 7; c.beginPath(); c.roundRect(14, 14, w - 28, paneB - 14, 12); c.stroke();
  c.lineWidth = 5; c.beginPath(); c.moveTo(w / 2, 14); c.lineTo(w / 2, paneB); c.moveTo(14, paneB * 0.5); c.lineTo(w - 14, paneB * 0.5); c.stroke();
  // the sill
  g = c.createLinearGradient(0, sillT, 0, sillT + sillH); g.addColorStop(0, '#C99660'); g.addColorStop(1, '#7B512B');
  c.fillStyle = g; c.beginPath(); c.roundRect(6, sillT, w - 12, sillH, 8); c.fill();
  c.fillStyle = 'rgba(255, 255, 255, .22)'; c.fillRect(10, sillT + 2, w - 20, 2);
  // the glass
  const gh = Math.min(area * 0.42, 190), gwT = gh * 0.66, gwB = gwT * 0.76, gx = w * 0.43, yT = sillT - gh, yB = sillT;
  c.fillStyle = 'rgba(0, 0, 0, .28)'; c.beginPath(); c.ellipse(gx + 6, sillT + 5, gwB * 0.62, 6, 0, 0, TAU); c.fill();
  const glass = () => { c.beginPath(); c.moveTo(gx - gwT / 2, yT); c.lineTo(gx + gwT / 2, yT); c.lineTo(gx + gwB / 2, yB); c.lineTo(gx - gwB / 2, yB); c.closePath(); };
  const lvl = 0.8 * (1 - u), yw = yB - gh * lvl, halfAt = (y) => lerp(gwB, gwT, (yB - y) / gh) / 2;
  glass(); c.fillStyle = 'rgba(220, 240, 255, .14)'; c.fill();
  c.save(); glass(); c.clip();
  if (lvl > 0.003) {
    g = c.createLinearGradient(0, yw, 0, yB); g.addColorStop(0, 'rgba(124, 196, 255, .92)'); g.addColorStop(1, 'rgba(47, 111, 176, .95)');
    c.fillStyle = g; c.beginPath(); c.moveTo(gx - gwT, yw);
    for (let x = -gwT; x <= gwT; x += 4) c.lineTo(gx + x, yw + Math.sin(x * 0.12 + t * 2.4) * 1.2);
    c.lineTo(gx + gwT, yB + 2); c.lineTo(gx - gwT, yB + 2); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255, 255, 255, .35)'; c.beginPath(); c.ellipse(gx, yw, halfAt(yw) * 0.92, 3, 0, 0, TAU); c.fill();
    for (let i = 0; i < 4; i++) { const px = gx + Math.sin(t * 0.9 + i * 1.7) * halfAt(yw) * 0.6, py = yw + 10 + ((t * 14 + i * 23) % Math.max(8, yB - yw - 12)); c.fillStyle = 'rgba(255, 255, 255, .5)'; c.beginPath(); c.arc(px, py, 1.6, 0, TAU); c.fill(); }
  }

  for (let i = 0; i < m; i++) {
    const q = CRYST[i], x = gx + q.a * (gwB / 2 - 7) * (1 - q.b * 0.5), y = yB - 4 - q.b * gh * 0.13 * (0.4 + 0.6 * Math.abs(1 - Math.abs(q.a)));

    c.fillStyle = '#C5DAEF'; c.fillRect(q.s * 0.1, -q.s / 2, q.s * 0.4, q.s); c.fillRect(-q.s / 2, q.s * 0.1, q.s, q.s * 0.4);

  }
  c.restore();

  c.strokeStyle = 'rgba(255, 255, 255, .75)'; c.lineWidth = 2.2; c.lineJoin = 'round'; glass(); c.stroke();
  c.strokeStyle = 'rgba(255, 255, 255, .5)'; c.lineWidth = 1.4; c.beginPath(); c.ellipse(gx, yT, gwT / 2, 5, 0, 0, TAU); c.stroke();

    for (let i = 0; i < 6; i++) {
      const x0 = gx + (i - 2.5) * gwT * 0.14, len = 70 + 20 * Math.sin(i * 2.1);
      c.beginPath();
      for (let s = 0; s <= 1.001; s += 0.05) { const x = x0 + Math.sin(s * 7 + t * 2.2 + i) * 7 * s, y = yw - 6 - s * len; c[s ? 'lineTo' : 'moveTo'](x, y); }
      const gg = c.createLinearGradient(0, yw, 0, yw - len); gg.addColorStop(0, `rgba(255, 255, 255, ${0.55 * Sa.wisp})`); gg.addColorStop(1, 'rgba(255, 255, 255, 0)');
      c.strokeStyle = gg; c.lineWidth = 4; c.stroke();
    }
  }
  pillText(c, T[lang].sec.saltLabel, w / 2, sillT + sillH / 2 + 1, { border: '#FFFFFF', size: 13 });
}

cntEl.innerHTML = `<span class="cp"><i style="background:${SEA}"></i><b id="cSea">0</b><span id="cSeaL"></span></span><span class="cp"><i style="background:${LAND}"></i><b id="cLand">0</b><span id="cLandL"></span></span>`;

askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, j = +b.dataset.j, G = S.g, F = S.f, L = S.l;
  if (act === 'a1' && G.step === 'q1') {

    sfx.click();
  } else if (act === 'fa2' && F.a2 === null) { F.a2 = j; (j === 0 ? sfx.good : sfx.bad)(); }
  else if (act === 'fagain') { S.f = freshF(F.lit); sfx.click(); }

    L.ans = act === 'lyes'; L.res[L.i] = L.ans === ANI[L.i].fish; L.rt = now(); (L.res[L.i] ? sfx.good : sfx.bad)();
  } else if (act === 'lnext') {

  else if (act === 'drop') { S.deep = freshDeep(); S.deep.run = true; sfx.push(); }
  else if (act === 'evap') { if (S.salt.u >= 1) S.salt.u = 0; S.salt.play = true; sfx.click(); }

// --- one render per change: panel, controls, readout and the state card ------------------------------------------

function renderGlobe(t) {

  }

function renderFive(t) {

  let html;
  if (F.phase === 'round') html = F.res ? `${verdict(F.res.ok)}<p>${esc(hereText(F.res.ok ? F.i : F.res.true))}</p>${nextBtn('fnext')}` : `<div class="q">${esc(fq(F.i))}</div>`;

  else html = `${verdict(F.a2 === 0)}<p>${esc(f.r2)}</p>${nextBtn('fagain', t.again)}`;
  setPanel(html);
  const bars = F.a2 === null ? '' : `<div class="bars"><div class="bt">${esc(f.share)}</div>${[0, 1, 2, 4, 3].map((i) => `<div class="obar"><span class="bn">${esc(oceanName(i))}</span><span class="bb"><i style="width:${SHARE[i] / 47 * 100}%;background:${OC[i]}"></i></span><b>${SHARE[i]} %</b></div>`).join('')}</div>`;
  setCtrl(dots(F.answered, F.phase === 'round' ? F.i : -1, 5) + bars);
  const s = F.a2 === null ? t.st.five.neutral : t.st.five.full;
  lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: `<div class="fine">${esc(t.fine)}</div>` });
  lab.setReadout(F.answered ? `${F.got}/${F.answered}` : '?', '', '', '#5BD1C6');
}

function renderLife(t) {
  const L = S.l, l = t.l, answered = L.phase === 'board' ? ANI.length : L.ans !== null ? L.i + 1 : L.i, k = L.res.filter(Boolean).length;
  lab.setGlow('rgba(255, 181, 71, .22)');
  let html;
  if (L.phase === 'board') html = nextBtn('lagain', t.again);
  else if (L.ans === null) html = `<div class="q">${esc(lq(L.i))}</div><div class="obs"><button class="ob" data-act="lyes">${esc(l.yes)}</button><button class="ob" data-act="lno">${esc(l.no)}</button></div>`;
  else html = `${verdict(L.res[L.i])}<p>${esc(l.why[L.i])}</p>${nextBtn('lnext')}`;
  setPanel(html);
  setCtrl(dots(answered, L.phase === 'board' ? -1 : L.i, ANI.length));
  const s = L.phase === 'board' ? t.st.life.full : t.st.life.neutral;
  lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3] });
  lab.setReadout(answered ? `${k}/${answered}` : '?', '', '', '#FFB547');
}

canvasLoop(cv, (c, w, h, dt, time) => {
  S.w = w; S.h = h;
  c.fillStyle = '#0B1020'; c.fillRect(0, 0, w, h);
  const v = lab.view;
  if (v === 'globe') { if (S.sec === 'deep') drawDeep(c, w, h, dt, time); else if (S.sec === 'salt') drawSalt(c, w, h, dt, time); else drawGlobe(c, w, h, dt, time); }
  else if (v === 'five') drawFive(c, w, h, dt, time);
  else drawLife(c, w, h, dt, time);
});
S.l.t0 = now();
render();
</script>
</body>
</html>
