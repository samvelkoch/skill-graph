<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  #gauge { display: none; }

  .abs { display: flex; gap: 8px; flex-wrap: wrap; }
  .ab { min-height: 40px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--stroke2); background: rgba(130, 145, 190, .1);
    font-weight: 800; line-height: 1.25; cursor: pointer; text-align: left; }
  .ab:hover:not(:disabled) { background: rgba(130, 145, 190, .25); }
  .ab:disabled { cursor: default; }
  .ab.good { border-color: #5BD38A; background: rgba(91, 211, 138, .2); }
  .ab.bad { border-color: #FF6B6B; background: rgba(255, 107, 107, .18); }
  .ab.fade { opacity: .45; }
  .vd { font-weight: 900; }
  .vd.good { color: #5BD38A; }
  .vd.bad { color: #FF6B6B; }
  .vt { margin: 0; color: var(--soft); font-size: 13px; line-height: 1.5; }
  .sl { display: flex; align-items: center; gap: 12px; margin: 6px 0; }

  #freeBox { margin-top: 4px; }
  #secRow { margin-top: 14px; }
  #paperSlot { margin: 2px 0 12px; }

  /* the paper card of the written method */
  .paper { position: relative; width: 100%; max-width: 330px; margin: 0 auto; padding: 0 14px 0 0; border-top: 12px solid #FFF8EA; border-bottom: 8px solid #FFF8EA; border-radius: 10px; color: #2A2A3A;
    background: repeating-linear-gradient(#FFF8EA 0 35px, #C9D8F2 35px 36px); box-shadow: 0 8px 24px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(0, 0, 0, .06); }
  .paper::before { content: ''; position: absolute; left: 30px; top: 0; bottom: 0; width: 2px; background: #E86A6A; opacity: .75; }
  .paper.wide { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 296px; margin: 0; }
  .pr { position: relative; display: flex; align-items: center; height: 36px; padding-left: 42px; margin-left: 0; border-radius: 8px; }
  .pr b { width: 33px; text-align: center; font: 800 28px/36px var(--sans); color: #2A2A3A; }
  .pr.rule { height: 36px; }
  .pr.rule s { display: block; width: 132px; height: 3px; border-radius: 2px; background: #2A2A3A; text-decoration: none; }
  .pr.r { opacity: 0; transform: translateY(6px); transition: opacity .5s, transform .5s, background .5s, box-shadow .5s; }
  .pr.r.show { opacity: 1; transform: none; }
  .pr.lit1 { background: linear-gradient(90deg, rgba(255, 212, 92, .5), rgba(126, 219, 156, .5)); box-shadow: 0 0 14px rgba(255, 212, 92, .6), 0 0 14px rgba(126, 219, 156, .4); }
  .pr.lit2 { background: linear-gradient(90deg, rgba(110, 155, 255, .45), rgba(255, 158, 122, .5)); box-shadow: 0 0 14px rgba(110, 155, 255, .6), 0 0 14px rgba(255, 158, 122, .4); }
  .pr.lit3 { background: linear-gradient(90deg, rgba(110, 155, 255, .5), rgba(255, 212, 92, .5), rgba(255, 158, 122, .5), rgba(126, 219, 156, .5));
    box-shadow: 0 0 16px rgba(110, 155, 255, .6), 0 0 16px rgba(255, 212, 92, .5), 0 0 16px rgba(126, 219, 156, .5); }
  .pr b.z.on { color: #E8402F; text-shadow: 0 0 8px #FF9E7A, 0 0 18px #FF6B6B; animation: zp .9s ease-in-out infinite alternate; }
  @keyframes zp { from { transform: scale(1); } to { transform: scale(1.22); } }
  .ann { margin-left: 8px; font: 800 12.5px/1.2 var(--sans); color: #4a4a62; white-space: nowrap; opacity: 0; transition: opacity .5s; }
  .ann.show { opacity: 1; }
  .ann i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 3px; vertical-align: -1px; }

  @media (max-width: 760px) {
    body[data-v=floor] #stage { height: min(116vw, 520px); }
    body[data-v=cut] #stage { height: min(104vw, 480px); }
    body[data-v=column] #stage { height: min(96vw, 440px); }
    body[data-v=sec] #stage { height: min(104vw, 480px); }
    .qb .qt { font-size: 19px; }
    .ab { flex: 1 1 auto; text-align: center; }
  }
</style>

    secrets: { egypt: ['Египетское удвоение', 'Умножай одним удвоением.'], square: ['Квадратные числа', 'Квадратный пол, разрезанный на четыре.'] },
    sec: { egyptText: 'Писцы Древнего Египта умножали удвоением: 14 = 8 + 4 + 2, значит, 23 × 14 = 184 + 92 + 46 = 322.',

    st: {
      floor: [['🧱', 'Каменный пол', 'Сколько плиток? У Али есть быстрая идея.', ''], ['🧱', 'Четыре куска, а не два', 'десятки×десятки, десятки×единицы, единицы×десятки, единицы×единицы.', 'Сложи все четыре.']],
      cut: [['✂️', 'Кусок за куском', 'Десятки на десятки дают сотни.', ''], ['✂️', '34 × 27 = 918', '600 + 210 + 80 + 28.', '']],
      column: [['🧾', 'Запись столбиком', 'Каждая строка — часть пола.', ''], ['🧾', 'Строки — это полоски', 'Первая строка: 34 × 7. Вторая: 34 × 20.', 'Ноль показывает десятки.']],
    },
    fine: 'Египетское умножение удвоением есть в математическом папирусе Ринда (около 1550 г. до н. э.).',
    quiz: [
      { q: 'Сколько будет 30 × 20?', opts: ['60', '600', '6000'], ok: 1 },
      { q: '23 × 14 = 20 × 10 + 3 × 4. Чего не хватает?', opts: ['Ничего', 'Кусков 20 × 4 и 3 × 10', 'Только 3 × 10'], ok: 1 },

    sec: { egyptText: 'Az ókori egyiptomi írnokok duplázással szoroztak: 14 = 8 + 4 + 2, tehát 23 × 14 = 184 + 92 + 46 = 322.',

    st: {

      cut: [['✂️', 'Darabról darabra', 'Tízes szorozva tízessel százasokat ad.', ''], ['✂️', '34 × 27 = 918', '600 + 210 + 80 + 28.', '']],

    },
    fine: 'Az egyiptomi duplázásos szorzás a Rhind-papiruszban is szerepel (kb. i. e. 1550).',
    quiz: [
      { q: 'Mennyi 30 × 20?', opts: ['60', '600', '6000'], ok: 1 },
      { q: '23 × 14 = 20 × 10 + 3 × 4. Mi hiányzik?', opts: ['Semmi', 'A 20 × 4 és a 3 × 10 darab', 'Csak a 3 × 10'], ok: 1 },
      { q: 'A 34 × 27-ben miért 0-ra végződik a második sor?', opts: ['Mert 20-szal szorzunk', 'Hogy szép legyen', 'Ez hiba'], ok: 0 } ],
  },
};
const TOPICS = [
  { id: 'mt_XLP1IM3Qbb', en: 'Long multiplication (age 10+)', ru: 'Умножение в столбик (10+ лет)', hu: 'Írásbeli szorzás kétjegyű szorzóval (10+ éves kor)' },
  { id: 'mt_q9EaJc2FP8', en: 'Long multiplication', ru: 'Умножение в столбик', hu: 'Írásbeli szorzás kétjegyű szorzóval' },
  { id: 'mt_MCu_SNg_OW', en: 'Arrays for multiplication (age 9+)', ru: 'Массивы для умножения (9+ лет)', hu: 'Rácsos elrendezés a szorzáshoz (9+ éves kor)' },
];

// --- palette and small helpers -------------------------------------------------------------------------------
const C = { grout: '#1E1B30', stone: ['#CBBFA8', '#A99B80'], ok: '#5BD38A', bad: '#FF6B6B', ink: '#2A2A3A', cream: '#FFF8EA' };
const PIECE = [['#6E9BFF', '#4F7BE8'], ['#FFD45C', '#F2B731'], ['#FF9E7A', '#F07650'], ['#7EDB9C', '#4FBF76']]; // tens×tens, tens×ones, ones×tens, ones×ones
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const ease = (t) => t * t * (3 - 2 * t);
const appr = (cur, tgt, dt, rate) => cur + (tgt - cur) * (1 - Math.exp(-rate * dt));
const CUTDUR = 1.7; // seconds for the whole cut: laser, slide apart, colours
const BAND = 128;   // floor view: room under the floor for the sum line and Ali
const SUMBAND = 56; // cut view and square: room for the sum line
const pieces = (a, b) => { const ta = a - a % 10, oa = a % 10, tb = b - b % 10, ob = b % 10; return [[0, 0, ta, tb], [0, tb, ta, ob], [ta, 0, oa, tb], [ta, tb, oa, ob]]; };
const area = (p) => p[2] * p[3];
const CUT_F = [[30, 20], [30, 7], [4, 20], [4, 7]];
const CUT_OPTS = [[60, 600, 6000], [21, 210, 2100], [8, 80, 800], [28, 280, 208]];
const CUT_OK = [1, 1, 1, 0];

// --- state ---------------------------------------------------------------------------------------------------
const S = {
  sec: null, secT0: 0, sq: 12,
  fl: { phase: 0, p1: null, p2: null }, // 0 asking q1, 1 cutting, 2 Ali's pieces, 3 forgotten pieces, 4 asking q2, 5 done
  ct: { i: 0, pick: null, a: 34, b: 27 }, // i = piece being asked (0-3), 4 = finished and free
  co: { step: 0, pick: null, rev: 0 },    // step 0-3 rows, rev = reveal stage after the question
};
const timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const clearTimers = () => timers.splice(0).forEach(clearTimeout);

// everything the canvas eases towards: set from state each frame in plan(), eased in the draw loop
const fx = {
  cut: { floor: 0, cut: 0, column: 0, square: 0 },
  glow: [0, 0, 0, 0], dim: [0, 0, 0, 0], labA: [0, 0, 0, 0], labM: ['f', 'f', 'f', 'f'],
  sa: { tT: 1, tS: 0, lT: 1, lS: 0 },
  sumA: 0, lastSum: null, resV: 0,
  ghost: { rows: 2, a: 0 }, strip: { kind: 'top', a: 0, label: null }, aliA: 0, lastAli: { mood: 0 },
};

const lab = shell({ key: 'long-mult', T, topics: TOPICS, views: ['floor', 'cut', 'column'], onLang: render, onView: () => { S.sec = null; render(); } });
const secret = secretLab('long-mult', () => ({
  secrets: [{ emo: '🏺', title: T[lang].secrets.egypt[0], desc: T[lang].secrets.egypt[1] }, { emo: '⬛', title: T[lang].secrets.square[0], desc: T[lang].secrets.square[1] }],

$('ctrlBody').innerHTML = `
  <div id="qbox"></div>
  <div id="freeBox" style="display:none">
    <p class="vt" id="freeCap"></p>
    <label class="sl"><output id="aOut"></output><input class="big" id="aIn" type="range" min="11" max="39" step="1" style="--track:linear-gradient(90deg,#6E9BFF,#4F7BE8)"></label>
    <label class="sl"><output id="bOut"></output><input class="big" id="bIn" type="range" min="11" max="29" step="1" style="--track:linear-gradient(90deg,#FF9E7A,#F07650)"></label>
  </div>
  <div id="paperSlot"></div>

// the paper card of view 3 is built once; render() only switches classes, so rows can fade in
const paper = document.createElement('div');
paper.className = 'paper'; paper.id = 'paper';
paper.innerHTML = `
  <div class="pr"><b></b><b></b><b>3</b><b>4</b></div>
  <div class="pr"><b>×</b><b></b><b>2</b><b>7</b></div>
  <div class="pr rule"><s></s></div>
  <div class="pr r" id="pr1"><b></b><b>2</b><b>3</b><b>8</b><span class="ann" id="an1"></span></div>
  <div class="pr r" id="pr2"><b></b><b>6</b><b>8</b><b class="z" id="pz">0</b><span class="ann" id="an2"></span></div>
  <div class="pr rule"><s></s></div>
  <div class="pr r" id="pr3"><b></b><b>9</b><b>1</b><b>8</b></div>`;

// --- layout of the floor: tile size and where the labels go -----------------------------------------------------
const mc = document.createElement('canvas').getContext('2d');
const tw = (txt, font) => { mc.font = font; return mc.measureText(txt).width; };
// the lines of a piece label. modes: x factors only, f factors = value, g forgotten, v value only
function labelLines(p, mode, outside, t) {
  const v = area(p), ex = `${p[2]} × ${p[3]}`;
  if (mode === 'x') return [ex];
  if (mode === 'v') return [String(v)];
  if (mode === 'g') return outside ? [t.forgot, `= ${v}`] : [t.forgot, `${ex} = ${v}`];
  return outside ? [ex, `= ${v}`] : [`${ex} = ${v}`];
}
// M is the view's way of labelling: 'floor' (forgotten flash), 'cut' (factors = value), 'column' (value only)
function layout(c, a, b, R, M, fs) {
  const t = T[lang], dpr = c.getTransform().a || 1, PC = pieces(a, b), ML = 40, MT = 40, G = 4;
  const font = `800 ${fs}px Nunito, sans-serif`, lh = fs + 3;
  const size = (lines) => ({ w: Math.max(...lines.map((s) => tw(s, font))) + 14, h: lines.length * lh + 6 });
  const worst = (i) => (M === 'floor' ? (i === 1 || i === 2 ? 'g' : 'f') : M === 'column' ? 'v' : 'f');
  const szIn = PC.map((p, i) => size(labelLines(p, worst(i), false, t)));
  const szOut = PC.map((p) => {
    const ss = (M === 'floor' ? ['g', 'f'] : M === 'column' ? ['v'] : ['f']).map((m) => size(labelLines(p, m, true, t)));
    return { w: Math.max(...ss.map((s) => s.w)), h: Math.max(...ss.map((s) => s.h)) };
  });
  const ins = [true, true, true, true];
  let MR = G + 8, MB = G + 8, tile = 6;
  const fit = () => {
    tile = Math.max(4, Math.min(22, (R.w - ML - MR) / a, (R.h - MT - MB) / b));

// --- controls ------------------------------------------------------------------------------------------------------
// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function startReveal() {
  S.fl.phase = 1;
  later(() => { S.fl.phase = 2; sfx.snap(); render(); }, 1800);
  later(() => { S.fl.phase = 3; sfx.push(); render(); }, 3300);
  later(() => { S.fl.phase = 4; render(); }, 5000);
  render(); showStage();
}
function answer(k) {
  const v = lab.view, ok = (b) => (b ? sfx.good : sfx.bad)();
  if (v === 'floor') {
    const f = S.fl;
    if (f.phase === 0) { f.p1 = k; ok(k === 1); startReveal(); }
    else if (f.phase === 4) { f.p2 = k; f.phase = 5; ok(k === 1); showStage(); }
  } else if (v === 'cut') {
    const ct = S.ct;
    if (ct.i < 4 && ct.pick === null) { ct.pick = k; ok(k === CUT_OK[ct.i]); }
  } else if (v === 'column') {
    const o = S.co;
    if (o.step !== 2 || o.pick !== null) return;
    o.pick = k; o.rev = 1; ok(k === 1);
    later(() => { S.co.rev = 2; render(); }, 1100);
    later(() => { S.co.rev = 3; sfx.snap(); render(); }, 2300);
    later(() => { S.co.rev = 4; render(); }, 4000);
    showStage();
  }
}
function next() {
  const v = lab.view; sfx.click();
  if (v === 'cut' && S.ct.i < 4) { S.ct.i++; S.ct.pick = null; if (S.ct.i === 4) showStage(); }
  else if (v === 'column' && S.co.step < 3) { S.co.step++; if (S.co.step === 3) sfx.good(); }
}
function again() {
  clearTimers(); sfx.click();
  const v = lab.view;
  if (v === 'floor') S.fl = { phase: 0, p1: null, p2: null };
  else if (v === 'cut') S.ct = { i: 0, pick: null, a: 34, b: 27 };
  else if (v === 'column') S.co = { step: 0, pick: null, rev: 0 };
}
function secClick(k) {
  if (!secret.unlocked()) return secret.open();
  if (S.sec === k) S.sec = null;
  else { S.sec = k; S.secT0 = performance.now() / 1000; if (k === 'square') { S.sq = 12; fx.cut.square = 0; } }
  sfx.click(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;

  else if (act === 'again') again();
  else if (act === 'sec') secClick(b.dataset.s);

$('aIn').addEventListener('input', (ev) => { S.ct.a = +ev.target.value; sfx.tick(); render(); });

    const cls = pick === null ? '' : k === ok ? 'good' : k === pick ? 'bad' : 'fade';
    return `<button class="ab ${cls}" data-act="ans" data-k="${k}"${pick === null ? '' : ' disabled'}>${esc(o)}</button>`;
  }).join('')}</div>` : '';
  return `<div class="qb">${q ? `<div class="qt">${esc(q)}</div>` : ''}${abs}
    ${verdict ? `<div class="vd ${verdict[0]}">${esc(verdict[1])}</div>` : ''}${texts.map((x) => `<p class="vt">${esc(x)}</p>`).join('')}
    ${nx ? `<div><button class="btn" data-act="${act}">${esc(nx)}</button></div>` : ''}</div>`;
}
const stateCard = (arr, extra = '') => lab.setState({ emo: arr[0], title: arr[1], lead: arr[2], body: arr[3] || '', extra });

function render() {

    $('secRow').innerHTML = chip('egypt', '🏺') + chip('square', '⬛') + (sec === 'square' ? `<button class="chip" data-act="size">${esc(t.sec.sizeUp)}</button>` : '');
  }

    lab.setGlow('rgba(255, 212, 92, .22)'); lab.setReadout(`${n} × ${n} = ${n * n}`, `100 + ${e * 10} + ${e * 10} + ${e * e}`, '', '#F2B731');
    stateCard(['⬛', t.secrets.square[0], t.sec.squareText, '']);

function renderFloor(t) {

  lab.setGlow('rgba(79, 123, 232, .26)');

  stateCard(t.st.cut[fin ? 1 : 0]);
}
function renderColumn(t) {
  const o = S.co, tt = t.col, rev = o.rev, step = o.step;
  lab.setGlow('rgba(79, 191, 118, .24)');
  const val = step === 0 ? '34 × 27' : step === 1 ? '238' : step === 2 ? '238 + 680' : '34 × 27 = 918';
  lab.setReadout(val, step === 1 ? tt.rows[0] : step === 2 && rev >= 3 ? tt.rows[1] : '', '', '#4FBF76');
  if (step <= 1) $('qbox').innerHTML = qHTML({ next: tt.next });
  else if (step === 2 && o.pick === null) $('qbox').innerHTML = qHTML({ q: tt.q, opts: tt.o });
  else if (step === 2) $('qbox').innerHTML = qHTML({ q: tt.q, opts: tt.o, pick: o.pick, ok: 1, verdict: o.pick === 1 ? ['good', t.right] : ['bad', t.wrong], texts: rev >= 3 ? [tt.r] : [], next: rev >= 4 ? tt.next : '' });
  else $('qbox').innerHTML = qHTML({ next: t.again, act: 'again' });
  const cls = (id, on, lit) => { $(id).classList.toggle('show', on); $(id).classList.toggle('lit1', lit === 1); $(id).classList.toggle('lit2', lit === 2); $(id).classList.toggle('lit3', lit === 3); };
  cls('pr1', step >= 1, step === 1 ? 1 : 0); cls('pr2', step >= 2, step === 2 ? 2 : 0); cls('pr3', step >= 3, step === 3 ? 3 : 0);
  $('pz').classList.toggle('on', rev >= 1);
  const dots = (i, j) => `<i style="background:${PIECE[i][0]}"></i><i style="background:${PIECE[j][0]}"></i>`;
  $('an1').innerHTML = `${dots(1, 3)}← ${esc(tt.rows[0])}`; $('an2').innerHTML = `${dots(0, 2)}← ${esc(tt.rows[1])}`;
  $('an1').classList.toggle('show', step >= 1); $('an2').classList.toggle('show', rev >= 3);
  stateCard(t.st.column[o.pick === null ? 0 : 1]);
}
render();
