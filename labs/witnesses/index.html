  let h = `<div class="wt-quote"><b>${esc(t.who[q].n)}:</b> “${esc(t.who[q].says)}”</div><div class="wt-tbl"><div class="wt-th">${esc(c.head)}</div>`;
  h += IDS.map((k, i) => `<button class="wt-ph ${i === S.quote ? 'on' : ''}" data-act="quote" data-q="${i}" aria-label="${esc(t.who[k].n)}"><img src="${portrait(k)}" alt=""></button>`).join('');
  TRUTH.forEach((row, r) => {
    let meter = '';
    if (S.checked) {
      const lv = TRUST_LV[r], col = ['#ff6b5e', '#f5c84c', '#3ddc97'][lv];
      meter = `<div class="wt-meter ${S.fresh ? 'fresh' : ''}"><i style="--w:${Math.round(TRUST[r] * 100)}%;--c:${col}"></i></div><div class="wt-why"><b>${esc(c.trust[lv])}</b> · ${esc(c.why[r])}</div>`;
    }
    h += `<div class="wt-claim">${esc(c.claims[r])}${meter}</div>`;
    row.forEach((tv, k) => {
      const m = S.mark[r][k], cls = S.checked ? ((!!m === !!tv) ? 'right' : 'wrong') : '';
      h += `<button class="wt-cell ${m ? 'm' : ''} ${cls}" data-act="cell" data-r="${r}" data-c="${k}" aria-label="${esc(t.who[IDS[k]].s)}">${m ? '✔' : (S.checked && tv ? '<span class="miss">✔</span>' : '–')}</button>`;
    });
  });
  h += '</div><div class="wt-row">';
  if (!S.checked) h += `<button class="btn" data-act="check">${esc(c.check)}</button>`;
  else {
    h += `<button class="btn" data-act="truth">${esc('🖼️ ' + c.truth)}</button>`;
    if (S.truth) h += `<button class="chip" data-act="strip" style="min-height:38px">${esc(S.stripOpen ? c.hide : c.show)}</button>`;
    h += `<button class="btn ghost" data-act="reset">${esc(c.reset)}</button>`;
  }
  h += '</div>';
  $('wtView').innerHTML = h;
  let st;
  if (S.truth) st = { emo: '🖼️', title: c.tTitle, lead: c.tLead, body: '', extra: stripList(t) };
  else if (S.checked) st = { emo: '⚖️', title: c.res(right), lead: c.resLead, body: '' };
  else st = { emo: '🗒️', title: c.pTitle, lead: c.pLead, body: c.pBody };
  lab.setState(st);
  const marked = S.mark.flat().reduce((a, b) => a + b, 0);
  if (S.checked) lab.setReadout(`${right}/15`, c.rd, '', '#e0b84a'); else lab.setReadout(String(marked), c.rdPre, '', '#e0b84a');
}

function renderObjects(t) {
  const o = t.obj, pr = S.oPred, sel = S.oSel;
  const opts = o.opts.map((x, i) => `<button class="wt-opt ${pr !== null ? (i === 1 ? 'good' : i === pr ? 'warn' : '') : ''}" data-act="opick" data-i="${i}"${pr !== null ? ' disabled' : ''}>${esc(x)}</button>`).join('');
  const emo = ['🏺', '🖼️', '📜', '👵'];
  let h = `${pr === null ? `<div class="wt-q">${esc(o.pq)}</div>` : ''}<div class="wt-opts">${opts}</div>`;
  if (pr !== null) {
    h += `<div class="wt-hint">${esc(o.tap)}</div><div class="wt-opts">${o.sn.map((n, i) => `<button class="wt-opt ${sel === i ? 'on' : ''}" data-act="item" data-i="${i}">${emo[i]} ${esc(n)}</button>`).join('')}</div>
      <div class="wt-opts" style="margin-bottom:0">${['who', 'when', 'why'].map((k) => `<button class="wt-opt ${sel !== null && S.asked[sel].has(k) ? 'on' : ''}" data-act="ask" data-q="${k}"${sel === null ? ' disabled' : ''}>${esc(o.q[k])}</button>`).join('')}</div>`;
  }
  $('wtView').innerHTML = h;
  let st;
  if (pr === null) st = { emo: '🏛️', title: o.pq, lead: o.intro, body: t.made };
  else if (!S.oLeftV) st = { emo: pr === 1 ? '✅' : '🤔', title: pr === 1 ? o.ok : o.no, lead: o.lead, body: '' };
  else {
    const a = [...S.asked[sel]], extra = ['who', 'when', 'why'].filter((k) => a.includes(k)).map((k) => `<div style="margin:3px 0"><b>${esc(o.q[k])}</b> ${esc(o.ans[sel][k])}</div>`).join('');
    st = { emo: emo[sel], title: o.names[sel], lead: `${o.kindLbl}: ${o.kinds[sel]}`, body: extra ? '' : o.tap, extra };
  }
  lab.setState(st);
  const total = S.asked.reduce((n, x) => n + x.size, 0);
  lab.setReadout(pr === null ? '?' : `${total}/12`, pr === null ? '' : o.rd, '', '#e0b84a');
  if (pr !== null && sel !== null && S.lastQ && S.asked[sel].has(S.lastQ)) {
    bub.style.display = ''; bub.innerHTML = `<b>${esc(o.sn[sel])} · ${esc(o.q[S.lastQ])}</b>${esc(o.ans[sel][S.lastQ])}`;
  }
}

function renderSecA(t) {
  const a = t.sa, pick = S.capPick, order = S.swap ? [1, 0] : [0, 1];
  const caps = order.map((ci, pos) => {
    const mine = ci === 0 ? 'winners' : 'losers';
    let cls = '', tag = '';
    if (pick !== null) { cls = ci === 0 ? 'good' : (pick === ci ? 'warn' : ''); tag = `<em>${esc(a.tags[ci])}</em>`; }
    return `<button class="wt-cap ${cls}" data-act="cap" data-i="${ci}" data-pos="${pos}" data-m="${mine}"${pick !== null ? ' disabled' : ''}>${esc(a.caps[ci])}${tag}</button>`;
  }).join('');
  $('wtSecP').innerHTML = `<div class="wt-q">${esc(a.ask)}</div><div class="wt-caps">${caps}</div>`;
  const st = pick === null ? { emo: '🧵', title: t.secrets.a[0], lead: t.secrets.a[1], body: '' }
    : { emo: pick === 0 ? '✅' : '🧵', title: pick === 0 ? a.ok : a.no, lead: pick === 0 ? a.okLead : a.noLead, body: '' };
  lab.setState(st); lab.setReadout('🧵', t.secrets.a[0], '', '#e0b84a');
}
function renderSecB(t) {
  const b = t.sb;
  $('wtSecP').innerHTML = `<div class="wt-q">${esc(b.ask)}</div>${S.miss && !S.found ? `<div class="wt-hint">${esc(b.miss)}</div>` : ''}`;
  const st = S.found ? { emo: '📸', title: b.foundT, lead: b.foundL, body: b.foundB } : { emo: '📸', title: t.secrets.b[0], lead: t.secrets.b[1], body: '' };
  lab.setState(st); lab.setReadout('🔎', S.found ? b.foundT : '', '', '#e0b84a');
}

render();
</script>
</body>
</html>
