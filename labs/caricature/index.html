function rr(c, x, y, w, h, r) {

  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function pill(c, txt, x, y, W, align = 'center', size = 12) {
  c.save(); c.font = `800 ${size}px Nunito, sans-serif`; c.textBaseline = 'middle';
  const tw = c.measureText(txt).width, pw = tw + 16, ph = size + 9;
  let px = align === 'center' ? x - pw / 2 : align === 'left' ? x : x - pw;
  px = clamp(px, 4, Math.max(4, W - pw - 4));
  c.globalAlpha = 1; c.fillStyle = 'rgba(10,12,20,.82)'; rr(c, px, y - ph / 2, pw, ph, ph / 2); c.fill();
  c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText(txt, px + 8, y + .5); c.restore();
  return pw;
}

// a painted face in a 240 x 280 design box centred on (0, 5); o.ghost draws the flat grey "average" silhouette
function drawFace(c, p, o = {}) {
  const G = !!o.ghost, v = p.map((x) => clamp(x, -.15, 1.5));
  const W = 38 + v[0] * 24, top = -72, cy = 48 + v[1] * 38;
  const earR = 5 + v[4] * 12, eR = 6.5 + v[5] * 7, nl = 12 + v[2] * 28, nw = 4.5 + v[3] * 9, bw = 1.8 + v[6] * 6.5, hv = v[7];

    c.bezierCurveTo(-W * .5, cy, -W, cy * .5, -W, -4); c.bezierCurveTo(-W, top * .45, -W * .62, top, 0, top); c.closePath();
  };
  if (!G) { // neck and shirt
    c.fillStyle = '#d9a47c'; c.fillRect(-15, cy - 22, 30, 130);
    const sg = c.createLinearGradient(-80, 100, 70, 146); sg.addColorStop(0, '#6f9fd8'); sg.addColorStop(1, '#3f6aa6');
    c.fillStyle = sg; c.strokeStyle = '#2d4f80'; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(-88, 146); c.quadraticCurveTo(-84, 108, -34, 102); c.lineTo(34, 102); c.quadraticCurveTo(84, 108, 88, 146); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.moveTo(-20, 102); c.quadraticCurveTo(0, 126, 20, 102); c.closePath(); c.fill();
  }
  const HA = o.hair?.a || '#7b5439', HB = o.hair?.b || '#3f281a', HS = o.hair?.style || 'short';
  // back hair
  const hrx = W + 4 + hv * 22, hry = 38 + hv * 22;
  if (G) { c.fillStyle = GF; c.beginPath(); c.ellipse(0, -34, hrx, hry, 0, 0, Math.PI * 2); c.fill(); } else {
    const hg = c.createLinearGradient(-hrx, -90, hrx * .6, 10); hg.addColorStop(0, HA); hg.addColorStop(1, HB);
    c.fillStyle = hg; c.strokeStyle = '#2f1d12'; c.lineWidth = 1.6;
    c.beginPath(); c.ellipse(0, -34, hrx, hry, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    if (HS === 'long') {

      c.quadraticCurveTo(hrx * .5, 82, hrx - 2, 100); c.bezierCurveTo(hrx - 8, 60, hrx + 6, 10, hrx, -34); c.closePath(); c.fill(); c.stroke();
    } else if (HS === 'spiky') {
      for (let i = -3; i <= 3; i++) {

        c.beginPath(); c.moveTo(bx - hw, by); c.lineTo(tx, ty); c.lineTo(bx + hw, by); c.closePath(); c.fill(); c.stroke();

    }

  for (const s of [-1, 1]) {
    c.fillStyle = G ? GF : '#eab78f'; c.strokeStyle = G ? GS : '#b7835f'; c.lineWidth = 1.5;
    c.beginPath(); c.ellipse(s * W * .98, -2, earR * .58, earR, s * .12, 0, Math.PI * 2); c.fill(); if (!G) c.stroke();
    if (!G) { c.fillStyle = 'rgba(190,110,90,.35)'; c.beginPath(); c.ellipse(s * W * .98, -1, earR * .3, earR * .6, s * .12, 0, Math.PI * 2); c.fill(); }
  }
  // head
  c.save();
  if (!G) { c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = o.noShadow ? 0 : 8; c.shadowOffsetY = 3; }
  headPath();
  if (G) c.fillStyle = GF; else { const fg = c.createRadialGradient(-W * .35, -40, 6, 0, 0, W * 1.7); fg.addColorStop(0, '#fbdcbc'); fg.addColorStop(.6, '#f0c49c'); fg.addColorStop(1, '#d9a47c'); c.fillStyle = fg; }
  c.fill(); c.restore();
  headPath(); c.strokeStyle = G ? GS : '#b7835f'; c.lineWidth = G ? 1.4 : 1.8; c.stroke();
  if (!G) { // cheeks
    c.fillStyle = 'rgba(236,120,110,.26)';
    for (const s of [-1, 1]) { c.beginPath(); c.arc(s * W * .56, 14, 9, 0, Math.PI * 2); c.fill(); }
  }

  for (const s of [-1, 1]) {

    c.fillStyle = G ? GS : '#fff'; c.strokeStyle = G ? GS : '#9a6c4f'; c.lineWidth = 1.3;
    c.beginPath(); c.ellipse(0, 0, eR, eR * .85, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    if (!G) {
      const ir = eR * .6;
      const ig = c.createRadialGradient(-ir * .3, -ir * .3, 1, 0, 0, ir); ig.addColorStop(0, '#6f9ab0'); ig.addColorStop(1, '#2c4655');
      c.fillStyle = ig; c.beginPath(); c.arc(0, eR * .05, ir, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#10181f'; c.beginPath(); c.arc(0, eR * .05, ir * .52, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(-ir * .34, -ir * .32, Math.max(.8, eR * .2), 0, Math.PI * 2); c.fill();
    }

  if (!G) {
    c.strokeStyle = 'rgba(160,100,70,.5)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-3, -4); c.quadraticCurveTo(-nw * .5, tip * .5, -nw * .85, tip - 5); c.stroke();
  }
  { const ng = c.createRadialGradient(-nw * .3, tip - 6, 1, 0, tip - 3, nw * 1.2); ng.addColorStop(0, '#f8d2ae'); ng.addColorStop(1, '#e0a07a');
    c.fillStyle = G ? GF : ng; c.strokeStyle = G ? GS : '#b7835f'; c.lineWidth = 1.2;
    c.beginPath(); c.ellipse(0, tip - 3, nw, nw * .72, 0, 0, Math.PI * 2); c.fill(); c.stroke(); }
  if (!G) { c.fillStyle = '#8b5a43'; for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * nw * .45, tip - 1, nw * .2, nw * .14, 0, 0, Math.PI * 2); c.fill(); } }
  // mouth
  c.strokeStyle = G ? GS : '#a8554a'; c.lineWidth = G ? 1.6 : 2.6;
  c.beginPath(); c.moveTo(-12, my - 1); c.quadraticCurveTo(0, my + 8, 12, my - 1); c.stroke();

  c.beginPath(); c.ellipse(0, top - 8, W * 1.12, 34 + hv * 8, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(-W * .38, top - 3, W * .72, 40 + hv * 6, .25, 0, Math.PI * 2); c.fill();
  c.restore();
  // brows
  c.strokeStyle = G ? GS : '#3f281a'; c.lineWidth = bw;
  for (const s of [-1, 1]) {
    const by = ey - eR - 5 - bw * .3;
    c.beginPath(); c.moveTo(s * (ex - eR), by - (s < 0 ? 1.5 : 1.5) + 1.5); c.lineTo(s * (ex + eR), by - 1); c.stroke();
  }

  const W3 = S.w3, r = W3.round, R = t.w3.rounds[r], w = t.w3, order = FORDER[r], ch = W3.checked;
  lab.setGlow('rgba(217, 130, 95, .24)');
  const phone = '<svg width="26" height="44" viewBox="0 0 26 44" aria-hidden="true"><defs><linearGradient id="ph" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a6a8c"/><stop offset="1" stop-color="#242c44"/></linearGradient></defs><rect x="1.5" y="1.5" width="23" height="41" rx="6" fill="url(#ph)" stroke="#161b2e" stroke-width="1.5"/><rect x="4.5" y="6" width="17" height="30" rx="2.5" fill="#9fd0ff"/><circle cx="13" cy="39.5" r="1.7" fill="#d6dcf2"/><circle cx="8" cy="3.4" r=".9" fill="#d6dcf2"/></svg>';
  let h = `<div class="cq-orig">${r === 0 ? phone : '<span style="font-size:30px;line-height:1">🏫</span>'}<div><small>${esc(w.orig)}</small><span>${esc(R.orig)}</span></div></div>`;
  h += R.par.map((txt, i) => {
    const a = W3.asg[i], mk = ch ? (a === i ? '<i class="mk good">✓</i>' : '<i class="mk bad">✕</i>') : a >= 0 ? `<i class="mk dot" style="background:${FCOL[a]}"></i>` : '';
    return `<button class="cq-par ${W3.sel === i ? 'sel' : ''}" data-i="${i}" style="${a >= 0 && !ch ? `border-color:${FCOL[a]}` : ''}">${esc(txt)}${mk}</button>`;
  }).join('');
  h += `<div class="cq-fr">${order.map((f) => `<button class="cq-flt ${W3.asg.includes(f) ? 'used' : ''}" data-f="${f}" style="${W3.asg.includes(f) ? `border-color:${FCOL[f]}` : ''}"><span class="ic">${R.ic[f]}</span>${esc(R.flt[f])}</button>`).join('')}</div>`;
  $('w3').innerHTML = h;
  const b = $('b3'); b.textContent = ch ? (r === 0 ? w.next : w.again) : t.w3.check;
  b.disabled = !ch && W3.asg.some((a) => a < 0);
  const n = ch ? W3.asg.filter((a, i) => a === i).length : 0;
  lab.setReadout(`${r + 1}/2`, w.rn[r], ch ? `${n}/3` : '', '#d9825f');
  lab.setState(ch ? { emo: n === 3 ? '✅' : '🤔', title: n === 3 ? w.rightT : w.someT(n), lead: w.afterL, body: '', extra: '' }
    : { emo: '🎯', title: w.q, lead: w.pickL, body: '', extra: '' });
  const an = W3.anim; W3.anim = false;
  requestAnimationFrame(() => flights(an));
}
addEventListener('resize', () => { if (lab.view === 'words' && S.w3.checked) flights(false); });
render();
</script>
