  c.fillStyle = g; c.beginPath(); c.arc(x, y - 9, 12, 0, 6.3); c.fill(); c.strokeStyle = '#a8671a'; c.lineWidth = 1.8; c.stroke();
  c.fillStyle = '#f3cda4'; c.beginPath(); c.arc(x + 1, y - 9, 8, 0, 6.3); c.fill();
  for (const sx of [-1, 1]) { const ex = x + 1 + sx * 3.2; c.fillStyle = '#2a2236'; c.beginPath(); c.arc(ex, y - 9.5, 1.7, 0, 6.3); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(ex - 0.6, y - 10.2, 0.65, 0, 6.3); c.fill(); }
  c.strokeStyle = '#8a4f3c'; c.lineWidth = 1.2; c.beginPath(); c.arc(x + 1, y - 7.5, 2.6, 0.3, 2.8); c.stroke();
  c.fillStyle = '#ffe27a'; c.strokeStyle = '#a8671a'; c.lineWidth = 1; c.beginPath(); c.roundRect(x + 5, y - 24, 9, 6, 2.5); c.fill(); c.stroke();
  if (lamp) { c.globalAlpha = 0.9; c.fillStyle = '#fff6c0'; c.beginPath(); c.arc(x + 14, y - 21, 2.2, 0, 6.3); c.fill(); }
  c.restore();
  if (y > WL) for (let i = 0; i < 5; i++) { const p = (time * 0.45 + i / 5) % 1; c.globalAlpha = (1 - p) * 0.7; c.strokeStyle = '#e8f8ff'; c.lineWidth = 1; c.beginPath(); c.arc(x + 4 + Math.sin(p * 9 + i) * 4, y - 26 - p * 55, Math.max(0, 1.6 + (i % 3)), 0, 6.3); c.stroke(); }
  c.globalAlpha = 1;
}
// the pinned picture card on the tip of the iceberg
function card(c, emo, text, cx, bottom, maxW = 138, time = 0) {
  const fs = FS(12.5), lh = fs * 1.2; c.font = `800 ${fs}px Nunito, sans-serif`;
  const tw = maxW - 46, lines = wrap(c, text, tw), ph = Math.max(46, lines.length * lh + 16), x = cx - maxW / 2, y = bottom - ph + Math.sin(time * 1.5) * 0.8;
  c.save(); c.shadowColor = 'rgba(10,30,60,.4)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
  const g = c.createLinearGradient(x, y, x, y + ph); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e8f2f8');
  c.beginPath(); c.roundRect(x, y, maxW, ph, 10); c.fillStyle = g; c.fill(); c.restore();
  c.lineWidth = 1.5; c.strokeStyle = '#7fa9c4'; c.beginPath(); c.roundRect(x, y, maxW, ph, 10); c.stroke();
  c.font = '24px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000'; c.fillText(emo, x + 22, y + ph / 2 + 1);
  c.font = `800 ${fs}px Nunito, sans-serif`; c.fillStyle = '#17324a'; c.textAlign = 'left';
  lines.forEach((l, i) => c.fillText(l, x + 40, y + ph / 2 - (lines.length - 1) * lh / 2 + i * lh));
  return ph;
}

// --- the picture ---------------------------------------------------------------------------------------------
const curStory = () => (S.sec === 'liar' ? T[lang].liar : T[lang].stories[S.si]);
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const t = T[lang], v = lab.view, s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  SC = s;
  background(c, w, h, s, oy, time);
  c.save(); c.translate(ox, oy); c.scale(s, s);
  c.textBaseline = 'middle';
  if (v === 'same') drawSame(c, t, time);
  else if (v === 'trait') drawTrait(c, t, time);
  else drawDive(c, t, time, dt);
  c.restore();
});

function drawDive(c, t, time, dt) {
  const mine = S.sec === 'mine', ended = !S.sec && S.si >= 4;
  const st = mine ? t.mn.acts[S.mineA] : ended ? null : curStory();
  const frosted = !mine && !ended && !S.dived;
  under(c, UND, frosted);
  tip(c, TIP);
  // diver glides down while the clues come in
  const tgt = S.dived ? 150 + 36 * Math.min(S.r, 2) : mine ? 150 : 126;
  S.dvY += (tgt - S.dvY) * Math.min(1, dt * 3);
  const lampOn = S.dived || mine;
  if (lampOn && S.dvY > WL + 8) {
    const g = c.createLinearGradient(40, S.dvY - 21, 150, S.dvY + 10); g.addColorStop(0, 'rgba(255,246,190,.5)'); g.addColorStop(1, 'rgba(255,246,190,0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(34, S.dvY - 20); c.lineTo(165, S.dvY - 48); c.lineTo(165, S.dvY + 52); c.closePath(); c.fill();
  }
  if (ended) card(c, '🏆', `${S.rights.filter(Boolean).length}/4`, 192, 120, 120, time);
  else if (st) card(c, st.emo, st.tip, 192, 120, 146, time);
  waves(c, W * 4, 1, WL - WL, time);
  diver(c, 26, S.dvY, time, lampOn);
  // what lies under the water
  const cx = 192;
  if (mine) {
    let y = 138;
    st.r.forEach((txt, i) => { const on = S.mineR === i; y += bub(c, txt, cx + 4, y, 190, { bg: on ? '#fff8cf' : 'rgba(225,244,255,.92)', fg: '#16344d', stroke: on ? '#e5a82a' : '#7fb0cf', sw: on ? 3 : 1.5, wt: 800 }) + 8; });
  } else if (ended) {
    bub(c, t.dv.endTip, cx, 180, 190, { bg: 'rgba(225,244,255,.95)', fg: '#16344d', stroke: '#7fb0cf', fs: 15 });
  } else if (frosted) {
    c.font = `900 ${FS(54)}px Nunito, sans-serif`; c.textAlign = 'center'; c.fillStyle = 'rgba(240,250,255,.8)'; c.fillText('?', cx + 2, 205);
  } else {
    let y = 134; const items = [...st.clues, 'M'];
    items.forEach((txt, i) => {
      const k = i < S.r ? back((time - S.rAt[i]) / 0.45) : 0;
      if (i === 2) { const ph = bub(c, st.opts[st.ok], cx, y, 200, { k, bg: 'rgba(228,247,255,.96)', fg: '#10304a', stroke: S.pick === st.ok ? '#3ddc97' : '#f5c84c', sw: 3, fs: 14.5 }); y += ph + 6; }
      else { const ph = bub(c, txt, cx - 4 + (i ? 8 : -8) * 0, y, 196, { k, bg: 'rgba(255,245,196,.96)', fg: '#3a2f12', stroke: '#e5c460' }); y += ph + 6; }
    });
  }
}

function drawSame(c, t, time) {
  const cxs = [60, 180, 300];
  bub(c, t.sm.act, 180, 6, 300, { bg: 'rgba(10,20,40,.82)', fs: 13.5 });
  cxs.forEach((cx, i) => {
    const up = xf(UND, cx, 0.37, 0.95), tp = xf(TIP, cx, 0.37, 0.62);
    under(c, up, !S.sChecked); tip(c, tp);
    c.font = '26px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000'; c.fillText('🥪', cx, WL - 22 + Math.sin(time * 1.5 + i) * 0.8);
    // the letter badge
    c.beginPath(); c.arc(cx, 146, 11, 0, 6.3); c.fillStyle = '#d4ecf9'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#6a9cbd'; c.stroke();
    c.fillStyle = '#0d2a44'; c.font = `900 ${FS(13)}px Nunito, sans-serif`; c.fillText('ABC'[i], cx, 147);
    const a = S.assign[i];
    if (S.sChecked) {
      const okk = a === t.sm.correct[i];
      bub(c, t.sm.labels[t.sm.correct[i]], cx, 170, 98, { bg: 'rgba(228,247,255,.96)', fg: '#10304a', stroke: '#3ddc97', sw: 3, fs: 13 });
      c.font = '20px sans-serif'; c.fillText(okk ? '✅' : '❌', cx, 252);
    } else if (a !== null) {
      bub(c, t.sm.labels[a], cx, 178, 96, { bg: 'rgba(235,248,255,.35)', fg: '#fff', stroke: 'rgba(235,248,255,.8)', fs: 13, wt: 700 });
    } else {
      c.font = `900 ${FS(40)}px Nunito, sans-serif`; c.textAlign = 'center'; c.fillStyle = 'rgba(240,250,255,.75)'; c.fillText('?', cx, 205);
    }
  });
  waves(c, W * 4, 1, 0, time);
}

function drawTrait(c, t, time) {
  under(c, UND, !S.tChecked); tip(c, TIP);
  ivo(c, 192, 70, 26, time);
  const picked = S.picks, n = traitCount();
  // three clue slots in the ice
  for (let i = 0; i < 3; i++) {
    const x = 70 + i * 79, y = 148, id = picked[i];
    c.beginPath(); c.roundRect(x, y, 62, 56, 12);
    c.fillStyle = id !== undefined ? 'rgba(235,248,255,.95)' : 'rgba(10,30,60,.35)'; c.fill();
    c.lineWidth = 1.8; c.setLineDash(id !== undefined ? [] : [5, 4]); c.strokeStyle = id !== undefined ? '#7fb0cf' : 'rgba(220,240,255,.6)'; c.stroke(); c.setLineDash([]);
    if (id !== undefined) { c.font = '28px sans-serif'; c.textAlign = 'center'; c.fillStyle = '#000'; c.fillText(t.tr.cards[id].e, x + 31, y + 30); }
  }
  // the trait meter, it jiggles when a feeling is refused
  const jig = Math.max(0, 1 - (time - S.shakeAt) / 0.5) * Math.sin(time * 50) * 4, mx = 106 + jig, my = 224;
  for (let i = 0; i < 3; i++) {
    const x = mx + i * 52; c.beginPath(); c.roundRect(x, my, 48, 16, 8); c.fillStyle = 'rgba(10,30,60,.5)'; c.fill();
    if (i < n) { const g = c.createLinearGradient(x, my, x + 48, my); g.addColorStop(0, n === 3 ? '#7be8b4' : '#ffe08a'); g.addColorStop(1, n === 3 ? '#2fbf7f' : '#e5a82a'); c.beginPath(); c.roundRect(x, my, 48, 16, 8); c.fillStyle = g; c.fill(); }
    c.lineWidth = 1.5; c.strokeStyle = 'rgba(220,240,255,.7)'; c.beginPath(); c.roundRect(x, my, 48, 16, 8); c.stroke();
  }
  bub(c, picked.length ? t.tr.meter(n) : t.tr.meter0, 190, 246, 170, { bg: 'rgba(10,20,40,.75)', fs: 12.5, wt: 700 });
  // "Ivo is: …"
  const word = S.tChecked ? t.tr.words[t.tr.wi] : S.word !== null ? t.tr.words[S.word] : '?';
  bub(c, t.tr.isW(word), 80, 8, 140, { bg: S.tChecked ? 'rgba(228,247,255,.96)' : 'rgba(10,20,40,.82)', fg: S.tChecked ? '#10304a' : '#fff', stroke: S.tChecked ? (S.word === t.tr.wi ? '#3ddc97' : '#f5c84c') : null, sw: 3, fs: 13.5 });
  waves(c, W * 4, 1, 0, time);
}
function traitCount() {
  const cnt = { g: 0, c: 0 };
  S.picks.forEach((id) => { cnt[T[lang].tr.cards[id].t]++; });
  return Math.max(cnt.g, cnt.c);
}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const clearTm = () => { S.tm.forEach(clearTimeout); S.tm = []; };
function newStory() { clearTm(); S.pick = null; S.dived = false; S.diving = false; S.r = 0; S.dvY = 126; }
function startDive() {
  const st = curStory(); if (S.pick === null || S.dived) return;
  S.dived = true; S.diving = true; S.r = 0; S.rAt = [0, 0, 0];
  if (!S.sec) S.rights[S.si] = S.pick === st.ok;
  sfx.click();
  [0, 1, 2].forEach((k) => S.tm.push(setTimeout(() => {
    S.r = k + 1; S.rAt[k] = now();
    if (k === 2) { S.diving = false; (S.pick === st.ok ? sfx.good : sfx.bad)(); showStage(); } else sfx.tick();
    render();
  }, 800 + k * 1500)));
  render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, d = b.dataset;
  if (act === 'pick') { if (!S.dived) { S.pick = +d.i; sfx.tick(); } }
  else if (act === 'dive') startDive();
  else if (act === 'next') { if (S.sec === 'liar') S.sec = null; else S.si++; newStory(); sfx.click(); }
  else if (act === 'again') { S.si = 0; S.rights = []; newStory(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = d.k;
    if (S.sec === k) S.sec = null;
    else {
      S.sec = k; newStory(); if (k === 'mine') { S.mineR = null; S.dvY = 150; }
      if (lab.view !== 'dive') { lab.view = 'dive'; lab.renderChrome(); }
    }
    sfx.click();
  }
  else if (act === 'mineA') { S.mineA = +d.i; S.mineR = null; sfx.tick(); }
  else if (act === 'mineR') { S.mineR = +d.i; sfx.tick(); }
  else if (act === 'asg') { // same deed: one label per iceberg, labels stay unique
    if (S.sChecked) return;
    const i = +d.i, k = +d.k, prev = S.assign[i], other = S.assign.findIndex((x, j) => x === k && j !== i);
    if (other >= 0) S.assign[other] = prev;
    S.assign[i] = prev === k ? null : k; sfx.tick();
  }
  else if (act === 'sCheck') { if (S.assign.every((x) => x !== null)) { S.sChecked = true; const t = T[lang].sm; (S.assign.every((x, i) => x === t.correct[i]) ? sfx.good : sfx.bad)(); showStage(); } }
  else if (act === 'sAgain') { S.assign = [null, null, null]; S.sChecked = false; sfx.click(); }
  else if (act === 'card') {
    if (S.tChecked && S.tRes === 'done') return;
    const id = +d.i, tr = T[lang].tr, at = S.picks.indexOf(id);
    S.feelId = null;
    if (at >= 0) { S.picks.splice(at, 1); S.tRes = null; sfx.tick(); }
    else if (tr.cards[id].t === 'f') { S.feelId = id; S.shakeAt = now(); sfx.bad(); }
    else if (S.picks.length < 3) { S.picks.push(id); S.tRes = null; sfx.snap ? sfx.snap() : sfx.click(); }
    else sfx.bad();
  }
  else if (act === 'word') { if (!(S.tChecked && S.tRes === 'done')) { S.word = +d.i; S.tRes = null; sfx.tick(); } }
  else if (act === 'tCheck') {
    if (S.picks.length < 3 || S.word === null) return;
    if (traitCount() < 3) { S.tRes = 'mixed'; sfx.bad(); }
    else { S.tChecked = true; S.tRes = 'done'; (S.word === T[lang].tr.wi ? sfx.good : sfx.bad)(); showStage(); }
  }
  else if (act === 'tAgain') { S.picks = []; S.word = null; S.tChecked = false; S.tRes = null; S.feelId = null; sfx.click(); }
  render();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secDive').style.display = v === 'dive' ? '' : 'none';
  $('secSame').style.display = v === 'same' ? '' : 'none';
  $('secTrait').style.display = v === 'trait' ? '' : 'none';
  const open = secret.unlocked();
  $('obSec').innerHTML = [['liar', '🗣️'], ['mine', '🧊']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setFacts(t.facts[v]);
  if (v === 'dive') renderDive(t); else if (v === 'same') renderSame(t); else renderTrait(t);
}
const opt = (cls, act, i, text, dis) => `<button class="ob-opt ${cls}" data-act="${act}" data-i="${i}"${dis ? ' disabled' : ''}>${esc(text)}</button>`;

function renderDive(t) {
  const d = t.dv, mine = S.sec === 'mine', ended = !S.sec && S.si >= 4;
  lab.setGlow('rgba(78, 168, 220, .28)');
  if (mine) {
    $('dQ').textContent = t.mn.q;
    $('dOpts').innerHTML = t.mn.acts.map((a, i) => opt(S.mineA === i ? 'on' : '', 'mineA', i, `${a.emo} ${a.tip}`)).join('');
    $('dGo').innerHTML = `<div class="fine" style="width:100%">${esc(t.mn.hint)}</div>` + t.mn.acts[S.mineA].r.map((r, i) => opt(S.mineR === i ? 'on' : '', 'mineR', i, r)).join('');
    $('dGo').style.display = 'grid'; $('dGo').style.gap = '6px';
    lab.setReadout('🧊', '', '', '#4ea8dc');
    lab.setState({ emo: '🧊', title: t.mn.title, lead: t.mn.lead, body: '', extra: '' });
    return;
  }
  $('dGo').style.display = ''; $('dGo').style.gap = '';
  if (ended) {
    const k = S.rights.filter(Boolean).length;
    $('dQ').textContent = ''; $('dOpts').innerHTML = '';
    $('dGo').innerHTML = `<button class="btn" data-act="again">${esc(d.again)}</button>`;
    lab.setReadout(`${k}/4`, '', '', '#4ea8dc');
    lab.setState({ emo: '🏆', title: d.end(k), lead: d.endLead, body: '', extra: '' });
    return;
  }
  const st = curStory(), done = S.dived && !S.diving;
  $('dQ').textContent = st.q;
  $('dOpts').innerHTML = st.opts.map((o, i) => {
    let cls = '';
    if (done) cls = i === st.ok ? 'good' : i === S.pick ? 'bad' : '';
    else if (S.pick === i) cls = 'on';
    return opt(cls, 'pick', i, o, S.dived);
  }).join('');
  const last = !S.sec && S.si === 3;
  $('dGo').innerHTML = done
    ? `<button class="btn" data-act="next">${esc(S.sec ? d.again : last ? d.last : d.next)}</button>`
    : `<button class="btn" data-act="dive"${S.pick === null || S.diving ? ' disabled' : ''}>${esc(d.go)}</button>`;
  lab.setReadout(S.sec ? '🗣️' : `${S.si + 1}/4`, S.sec ? '' : d.sub(S.si + 1), '', '#4ea8dc');
  if (!S.dived) lab.setState({ emo: st.emo, title: st.q, lead: st.intro, body: S.pick === null ? d.pickHint : d.ready, extra: '' });
  else if (!done) lab.setState({ emo: '🤿', title: d.diving, lead: st.intro, body: d.lamp, extra: '' });
  else {
    const ok = S.pick === st.ok;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? d.right : d.notQuite, lead: d.found(st.opts[st.ok]), body: st.moral || d.moral, extra: '' });
  }
}

function renderSame(t) {
  const m = t.sm, n = S.assign.filter((x) => x !== null).length, allOk = S.assign.every((x, i) => x === m.correct[i]);
  lab.setGlow('rgba(120, 190, 235, .28)');
  $('sRows').innerHTML = [0, 1, 2].map((i) => `<div class="ob-row"><div class="ob-bs"><b>${'ABC'[i]}</b>${esc(m.bs[i])}</div><div class="ob-lb">${m.labels.map((l, k) => {
    let cls = S.assign[i] === k ? 'on' : '';
    if (S.sChecked) cls = k === m.correct[i] ? 'good' : S.assign[i] === k ? 'bad' : '';
    return `<button class="ob-opt sm ${cls}" data-act="asg" data-i="${i}" data-k="${k}"${S.sChecked ? ' disabled' : ''}>${esc(l)}</button>`;
  }).join('')}</div></div>`).join('');
  $('sGo').innerHTML = S.sChecked ? `<button class="btn" data-act="sAgain">${esc(m.again)}</button>` : `<button class="btn" data-act="sCheck"${n < 3 ? ' disabled' : ''}>${esc(m.check)}</button>`;
  lab.setReadout(`${n}/3`, '', '', '#78beeb');
  if (!S.sChecked) lab.setState({ emo: '🧊', title: m.act, lead: m.lead0, body: m.pick, extra: '' });
  else lab.setState({ emo: allOk ? '✅' : '🤔', title: allOk ? m.right : m.wrong, lead: allOk ? m.rightL : m.wrongL, body: '', extra: '' });
}

function renderTrait(t) {
  const r = t.tr, n = traitCount(), done = S.tChecked && S.tRes === 'done';
  lab.setGlow('rgba(110, 190, 150, .26)');
  $('tQ').textContent = r.q;
  $('tCards').innerHTML = [0, 1, 2, 3, 4, 5].map((i) => {
    const c = r.cards[i], on = S.picks.includes(i), feel = c.t === 'f' && S.feelId === i;
    return `<button class="ob-card ${on ? 'on' : ''} ${feel ? 'feel' : ''}" data-act="card" data-i="${i}"${done ? ' disabled' : ''}><span class="e">${c.e}</span><span>${esc(c.x)}</span>${feel ? `<i>${esc(r.feel)}</i>` : ''}</button>`;
  }).join('');
  $('tWords').innerHTML = r.words.map((w, i) => {
    let cls = S.word === i ? 'on' : '';
    if (done) cls = i === r.wi ? 'good' : S.word === i ? 'bad' : '';
    return `<button class="ob-opt sm ${cls}" data-act="word" data-i="${i}"${done ? ' disabled' : ''}>${esc(w)}</button>`;
  }).join('');
  $('tGo').innerHTML = done ? `<button class="btn" data-act="tAgain">${esc(r.again)}</button>`
    : `<button class="btn" data-act="tCheck"${S.picks.length < 3 || S.word === null ? ' disabled' : ''}>${esc(r.check)}</button>`;
  lab.setReadout(`${S.picks.length}/3`, '', '', '#6ebe96');
  let st;
  if (done) st = S.word === r.wi ? { emo: '✅', title: r.right, lead: r.rightL } : { emo: '🤔', title: r.wrongW, lead: r.wrongL };
  else if (S.feelId !== null) st = { emo: '⛈️', title: r.sFeel[0], lead: r.sFeel[1] };
  else if (S.tRes === 'mixed' || (S.picks.length === 3 && n < 3)) st = { emo: '🔎', title: r.sMixed[0], lead: r.sMixed[1] };
  else st = { emo: '🔎', title: r.s0[0], lead: r.s0[1] };
  lab.setState({ ...st, body: '', extra: '' });
}
render();
</script>
