}

// --- drawing: bits view --------------------------------------------------------------------------------------
function drawBits(c, W, H, dt, tn) {
  const t = T[lang], n = B.n, rev = asked.bits || P.bits !== null;
  const top = 10 + Math.max(0, band);
  B.hit = [];
  if (rev) B.shown += (2 ** n - B.shown) * (1 - Math.exp(-dt * 4)); else B.shown = 0;
  // switches and lamps
  const slot = Math.min(44, (W - 24) / n), sx = (W - slot * n) / 2;
  let idx = 0;
  for (let i = 0; i < n; i++) {
    const on = B.sw[i] ? 1 : 0; idx = idx * 2 + on;
    B.swA[i] += (on - B.swA[i]) * (1 - Math.exp(-dt * 14));
    const a = B.swA[i], cx = sx + (i + 0.5) * slot, lampY = top + 16, swY = top + 62, sw = Math.min(26, slot - 6);
    // lamp
    if (a > 0.02) { const g = c.createRadialGradient(cx, lampY, 2, cx, lampY, 24); g.addColorStop(0, `rgba(255,209,102,${0.7 * a})`); g.addColorStop(1, 'rgba(255,209,102,0)'); c.fillStyle = g; c.beginPath(); c.arc(cx, lampY, 24, 0, Math.PI * 2); c.fill(); }
    const lg = c.createRadialGradient(cx - 3, lampY - 3, 1, cx, lampY, 11); lg.addColorStop(0, mixHex('#3a465e', '#fff3c4', a)); lg.addColorStop(1, mixHex('#1e293b', '#ffb703', a));
    c.fillStyle = lg; c.beginPath(); c.arc(cx, lampY, 10, 0, Math.PI * 2); c.fill(); c.strokeStyle = mixHex('#475569', '#b8841a', a); c.lineWidth = 1.5; c.stroke();
    c.strokeStyle = 'rgba(148,160,184,.35)'; c.lineWidth = 2; c.beginPath(); c.moveTo(cx, lampY + 11); c.lineTo(cx, swY - 21); c.stroke();
    // switch
    rrPath(c, cx - sw / 2 + 1, swY - 21 + 3, sw, 42, 8); c.fillStyle = 'rgba(0,0,0,.3)'; c.fill();
    const hg = c.createLinearGradient(0, swY - 21, 0, swY + 21); hg.addColorStop(0, mixHex('#56657f', '#3f8f78', a)); hg.addColorStop(1, mixHex('#2b364b', '#1f5c4b', a));
    rrPath(c, cx - sw / 2, swY - 21, sw, 42, 8); c.fillStyle = hg; c.fill(); c.strokeStyle = '#0f172a'; c.lineWidth = 1.5; c.stroke();
    const ky = lerp(swY + 10, swY - 10, a), kg = c.createLinearGradient(cx - 8, ky - 8, cx + 8, ky + 8); kg.addColorStop(0, '#f8fafc'); kg.addColorStop(1, mixHex('#aab4c8', '#9be8c9', a));
    rrPath(c, cx - sw / 2 + 3, ky - 8, sw - 6, 16, 6); c.fillStyle = kg; c.fill(); c.strokeStyle = 'rgba(15,23,42,.5)'; c.lineWidth = 1; c.stroke();
    c.font = `800 14px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = on ? '#ffd166' : '#94a3b8'; c.fillText(on ? '1' : '0', cx, swY + 34);
    B.hit.push({ x: cx - slot / 2, y: lampY - 14, w: slot, h: swY + 44 - lampY, i });
  }
  // patterns
  const py = top + 114, count = 2 ** n;
  let targetH = 100;
  const tileW = n * 7 + 6, cols = Math.max(1, Math.min(count, Math.floor((W - 12 + 4) / (tileW + 4)))), rows = Math.ceil(count / cols);
  if (rev && n <= 6) targetH = rows * 16 + 8;
  B.gh += (targetH - B.gh) * (1 - Math.exp(-dt * 8));
  if (rev && n <= 6) {
    const gx = (W - (cols * (tileW + 4) - 4)) / 2;
    for (let p = 0; p < count; p++) {
      const x = gx + (p % cols) * (tileW + 4), y = py + Math.floor(p / cols) * 16 + 4, e = easeOut((tn - B.gridAt - p * 0.005) / 0.3);
      if (e <= 0.01) continue;
      c.save(); c.globalAlpha = e; const cur = p === idx;
      rrPath(c, x, y, tileW, 13, 5); c.fillStyle = cur ? 'rgba(255,209,102,.18)' : 'rgba(255,255,255,.06)'; c.fill(); if (cur) { c.strokeStyle = '#ffd166'; c.lineWidth = 1.5; c.stroke(); }
      for (let i = 0; i < n; i++) { c.fillStyle = (p >> (n - 1 - i)) & 1 ? '#ffd166' : '#2a3650'; c.beginPath(); c.arc(x + 3 + 3.5 + i * 7, y + 6.5, 2.6, 0, Math.PI * 2); c.fill(); }
      c.restore();
    }
  } else {
    const cy = py + 38;
    c.save(); c.font = `900 46px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.shadowColor = 'rgba(255,209,102,.5)'; c.shadowBlur = 18; c.fillStyle = '#ffd166';
    c.fillText(rev ? fmt(B.shown) : '?', W / 2, cy); c.restore();
    if (rev) {
      if (n === 8) pill(c, W, t.byteNote, W / 2, cy + 40, { size: 13, stroke: '#ffd166' });
      else pill(c, W, Array(n).fill('2').join(' × '), W / 2, cy + 40, { size: 12 });
    }
  }
  // file sizes, log scale
  const by = py + B.gh + 14, rowH = 32, pad = 14, bw = W - 2 * pad;
  BAR.forEach(([key, bytes], i) => {
    const y = by + i * rowH, f = (Math.log10(bytes) + 1) / 10.2, hot = key === 'letter' && n === 8 && rev;
    c.font = `800 12px ${FONT}`; c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillStyle = hot ? '#ffd166' : '#e2e8f0'; c.fillText(t.files[key], pad, y + 8);
    c.textAlign = 'right'; c.fillStyle = '#98a0b8'; c.fillText(t.sizes[key], W - pad, y + 8);
    rrPath(c, pad, y + 17, bw, 8, 4); c.fillStyle = 'rgba(255,255,255,.07)'; c.fill();
    const g = c.createLinearGradient(pad, 0, pad + bw * f, 0); g.addColorStop(0, hot ? '#ffe29a' : '#a6d8ff'); g.addColorStop(1, hot ? '#e3a928' : '#4b9bdc');
    rrPath(c, pad, y + 17, Math.max(8, bw * f), 8, 4); c.fillStyle = g; c.fill();
  });
}

// --- main loop -----------------------------------------------------------------------------------------------
newGame();
render();
canvasLoop($('cv'), (c, W, H, dt, time) => {
  const tn = now();
  for (let i = 0; i < sched.length;) { if (sched[i].at <= tn) { const [f] = sched.splice(i, 1); f.fn(); } else i++; }
  band += ((askEl.hidden ? 0 : askEl.offsetHeight + 16) - band) * (1 - Math.exp(-dt * 10));
  drawBoard(c, W, H);
  const v = lab.view;
  if (v === 'number') drawNumber(c, W, H, dt, tn); else if (v === 'animals') drawAnimals(c, W, H, dt, tn); else drawBits(c, W, H, dt, tn);
});
</script>
