  } else if (!rev) {
    body += `<div class="hc-q">${esc(x.q(x.claims[sel]))}</div><div class="hc-rates">${t.rates.map((l, i) => `<button class="rb" data-act="guess" data-i="${i}"><i style="background:${RATE_COL[i]}"></i>${esc(l)}</button>`).join('')}</div>
      <div class="hc-help">${t.rates.map((l, i) => `<div><b>${esc(l)}:</b> ${esc(t.help[i])}</div>`).join('')}</div>`;
    lab.setReadout(`${n}/5`, x.count, '', '#ff5b8d');
    lab.setState({ emo: '🤔', title: x.claims[sel], lead: x.lead, body: '', extra: '' });
  } else {
    const g = A.guess[sel], rt = CLAIM_RATE[sel], ok = g === rt;
    body += `<div class="hc-row"><button class="btn" data-act="next">${esc(t.next)}</button></div>`;
    lab.setReadout(`${n}/5`, x.count, t.rates[rt], RATE_COL[rt]);
    lab.setState({ emo: ok ? '✅' : '🤔', title: `${ok ? t.right + ' ' : ''}${t.rates[rt]}.`, lead: x.ev[sel], body: `${ok ? '' : t.notq + ' '}${x.note[sel]}`,
      extra: EVSRC[sel].map((u) => `<div style="font-size:11px;color:var(--faint);overflow-wrap:anywhere">${esc(u)}</div>`).join('') });
  }
  $('ctrlBody').innerHTML = body;
  const f = [FA(t.facts.five, SRC.five, '🍎'), FA(t.facts.claim, SRC.claim, '🔬')];
  if (A.rev[2]) f.push(FA(t.facts.vitc, SRC.vitc, '🍊'));
  lab.setFacts(f);
}
function renderAsk(t) {
  const K = S.ask, x = t.ask, m = K.m, msg = x.msgs[m], kb = K.keys[m], nk = bits(kb), srt = K.sort[m], done = K.sort.filter((s) => s !== null).length;
  lab.setGlow('rgba(78, 168, 255, .26)');
  let body = `<div class="chips hc-chips">${x.msgs.map((q, i) => `<button class="chip ${i === m && !K.fin ? 'on' : ''}" data-act="msg" data-i="${i}" aria-label="${esc(q.n)}">${q.e} ${i + 1}${K.sort[i] !== null ? ' ✓' : ''}</button>`).join('')}</div>`;
  if (K.fin) {
    const k = K.sort.filter((s, i) => s === MSG_BIN[i]).length;
    body += `<div class="hc-row"><button class="btn" data-act="kagain">${esc(t.again)}</button></div>`;
    lab.setReadout(`${done}/5`, x.sorted, '', '#4ea8ff');
    lab.setState({ emo: '🗝️', title: x.endT, lead: x.endL, body: x.endB(k), extra: '' });
  } else {
    body += `<div class="row2 hc-chips">${x.keys.map((l, i) => `<button class="chip ${kb & (1 << i) ? 'on' : ''}" data-act="key" data-i="${i}">🗝️ ${esc(l)}</button>`).join('')}</div>`;
    if (srt === null) {
      body += `<div class="hc-q">${esc(x.sortQ)}</div><div class="hc-rates">${x.bins.map((l, i) => `<button class="rb" data-act="sort" data-i="${i}"${nk < 2 ? ' disabled' : ''}><i style="background:${BIN_COL[i]}"></i>${esc(l)}</button>`).join('')}</div>`;
      if (nk < 2) body += `<div class="hc-help">${esc(x.open2)}</div>`;
    } else body += `<div class="hc-row"><button class="btn" data-act="knext">${esc(t.next)}</button></div>`;
    lab.setReadout(`${done}/5`, x.sorted, x.keysN(nk), '#4ea8ff');
    if (srt !== null) {
      const ok = srt === MSG_BIN[m];
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? `${t.right} ${x.bins[MSG_BIN[m]]}.` : x.wrong(x.bins[MSG_BIN[m]]), lead: msg.why, body: '', extra: '' });
    } else if (K.last[m] >= 0) lab.setState({ emo: ['🙋', '💰', '🔬', '👥'][K.last[m]], title: x.keysFull[K.last[m]], lead: msg.c[K.last[m]][1], body: '', extra: '' });
    else lab.setState({ emo: msg.e, title: `“${msg.say}”`, lead: x.tapKey, body: '', extra: '' });
  }
  $('ctrlBody').innerHTML = body;
  const f = [FA(t.facts.fund, SRC.claim, '💰')];
  if (K.sort[2] !== null) f.push(FA(t.facts.wash, SRC.wash, '🧼'));
  if (K.sort[1] !== null && S.ad.rev[3]) f.push(FA(t.facts.bda, SRC.bda, '🧪'));
  lab.setFacts(f);
}
function renderCmp(t) {
  const M = S.cmp, x = t.cmp, A = BOX[0], B = BOX[1];
  lab.setGlow('rgba(232, 180, 80, .24)');
  let body = '';
  if (!M.rev) {
    body = `<div class="hc-q">${esc(x.q)}</div><div class="hc-rates">${x.pick.map((l, i) => `<button class="rb" data-act="pick" data-i="${i}">${esc(`${i ? '🟫' : '🟨'} ${l}`)}</button>`).join('')}</div>`;
    lab.setReadout('?', x.sugarHead, '', '#e8b450');
    lab.setState({ emo: '🥣', title: x.q, lead: x.lead, body: '', extra: '' });
  } else {
    const open = secret.unlocked(), chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${M.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(x.secrets[k][0])}` : '🔒 ???'}</button>`;
    body = `<div class="row2 hc-chips" style="margin-top:0"><button class="chip" data-act="flip">${esc(x.flip)}</button>${chip('per', '⚖️')}${chip('peel', '🏷️')}</div>`;
    if (M.sec === 'peel') body += `<div class="row2 hc-chips">${x.st[0].map((l, i) => `<button class="chip" data-act="peel" data-i="${i}"${M.peeled[i] ? ' disabled' : ''}>${M.peeled[i] ? '✓ ' : ''}${esc(l)}</button>`).join('')}</div>`;
    const ok = M.pick === 1, n1 = x.names[0], n2 = x.names[1];
    lab.setReadout(`${A.sug} · ${B.sug}`, `${x.sugarHead} (A · B)`, '', '#e8b450');
    if (M.sec === 'per') lab.setState({ emo: '⚖️', title: x.perT, lead: x.perL(n1, nf(perPortion(A)), A.portion, n2, nf(perPortion(B)), B.portion, A.sug, B.sug), body: x.perB, extra: '' });
    else if (M.sec === 'peel') {
      const all = M.peeled.every(Boolean);
      lab.setState(all ? { emo: '🏷️', title: x.peelDone, lead: x.peelDoneL(A.sug), body: x.peelB, extra: '' } : { emo: '🏷️', title: x.peelT, lead: x.peelL, body: '', extra: '' });
    } else lab.setState({ emo: ok ? '✅' : '🤔', title: `${ok ? t.right : t.notq}`, lead: x.res(n1, A.sug, x.lev[level(A.sug)], n2, B.sug, x.lev[level(B.sug)]), body: x.resB, extra: '' });
  }
  $('ctrlBody').innerHTML = body;
  const f = [FA(t.facts.per, SRC.per, '🏷️')];
  if (M.rev) f.push(FA(t.facts.thr, SRC.per, '🍬'));
  if (M.peeled[2]) f.push(FA(t.facts.nat, SRC.nat, '🌿'));
  lab.setFacts(f);
}
render();
</script>
