  } else if (v === 'follow') {
    lab.setGlow('rgba(233, 168, 91, .24)');
    if (S.fi >= 5) { lab.setReadout(`${S.fright.filter(Boolean).length}/5`, '', '', color); st = { emo: '🏆', title: t.fo.end(S.fright.filter(Boolean).length), lead: t.fo.endLead }; }
    else {
      const f = FILES[FP[S.fi].id], rev = S.fph === 'done';
      lab.setReadout(rev ? esc(f.n) : '?', t.fo.sub(S.fi + 1), rev ? t.fo.depth(chainOf(f.dir).length) : '', color);
      st = S.fph === 'ask' ? { emo: '🗂️', title: t.fo.q, lead: t.fo.lead(S.fi + 1) }
        : S.fph === 'run' ? { emo: '📂', title: t.fo.q, lead: t.fo.lead(S.fi + 1) }
          : { emo: S.fright[S.fi] ? '✅' : '🤔', title: S.fright[S.fi] ? t.fo.right : t.fo.wrongT, lead: S.fright[S.fi] ? t.fo.reached(pathNames(f).join('/')) : t.fo.wrong(f.n) };
    }
  } else if (v === 'write') {
    lab.setGlow('rgba(95, 168, 160, .26)'); color = '#5fa8a0'; const r = S.wres;
    lab.setReadout(S.wpath.length ? `<span style="font-size:20px">${esc(S.wpath.map(keyName).join(SEP))}</span>` : '?', t.wr.sub(S.wi + 1), '', color);
    st = r ? (r.kind === 'ok' ? { emo: '✅', title: t.wr.okT, lead: t.wr.okL(pathNames(FILES[WT[S.wi].id]).join('/')) }
      : { emo: '🤔', title: r.kind === 'file' ? t.wr.fileT : r.kind === 'no' ? t.wr.noT : r.kind === 'home' ? t.wr.homeT : t.wr.dirT,
        lead: r.kind === 'file' ? t.wr.fileL(r.file.n, nm(r.file.dir)) : r.kind === 'no' ? t.wr.noL(r.x, nm(r.y)) : r.kind === 'home' ? t.wr.homeL : t.wr.dirL(nm(r.y)) })
      : { emo: '↘️', title: t.wr.q, lead: t.wr.lead(S.wi + 1) };
  } else {
    lab.setGlow('rgba(217, 164, 65, .24)'); color = '#d9a441'; const td = t.td, p = S.tph;
    if (p === 0) { lab.setReadout('?', '', '', color); st = { emo: '🗃️', title: td.q, lead: td.firstL }; }
    else if (p === 1 || p === 3) { readoutTidy(); st = { emo: '🔎', title: td.findT(S.treq + 1), lead: td.findL }; }
    else if (p === 2) { lab.setReadout(`${placed()}/8`, td.placed(placed()), '', color); st = { emo: '🗃️', title: td.sortT, lead: td.sortL }; }
    else {
      lab.setReadout(fmtS(S.tB), td.resL(fmtS(S.tA), fmtS(S.tB)), '', color);
      const ratio = S.tB / S.tA, act = ratio < 0.85 ? 0 : ratio > 1.15 ? 1 : 2;
      st = { emo: '⏱️', title: td.resT(S.tpred === act), lead: td.resL(fmtS(S.tA), fmtS(S.tB)) };
    }
    if (p === 0) st.title = td.firstT;
    if (p === 0) st.lead = td.firstL;
  }
  lab.setState({ ...st, body: st.body ?? '', extra: '' });
  lab.setFacts(facts.map((f) => ({ emo: f.emo, text: f.text, src: f.src })));
}
render();
</script>
