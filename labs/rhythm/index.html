    stopPlay(); Object.assign(B, { mode: 'round', steadyA: Math.random() < 0.5, played: false, answer: null }); sfx.click(); render();
  } else if (act === 'btap') {
    wantSound(); stopPlay(); Object.assign(B, { mode: 'tap', taps: [], epoch: performance.now(), lastBeat: -1 }); sfx.click(); render(); showStage();
  } else if (act === 'rans') {
    wantSound();
    const tot = sum(ROUNDS[R.round]);
    R.answer = a; R.rev = { t0: nowS(), n: ROUNDS[R.round].length, played: false };
    (a === (tot === 4 ? 'yes' : tot > 4 ? 'many' : 'few') ? sfx.good : sfx.bad)(); showStage(); render();
  } else if (act === 'rnext') {
    stopPlay(); R.answer = null; R.rev = null; R.round++; sfx.click(); render();
  } else if (act === 'note') addNote(b.dataset.k);
  else if (act === 'rclear') {
    stopPlay(); if (S.sec === 'compose') { C.bars = [[], []]; C.sel = 0; } else R.bar = [];
    R.ghost = null; R.noFit = false; sfx.click(); render();
  } else if (act === 'rplay') {
    if (PL.on) { stopPlay(); return render(); }
    wantSound();
    if (S.sec === 'compose') {
      const r = rhythmEvents(C.bars, 60 / BPM, true);
      startPlay('compose', r.ev, r.len, { bs: 60 / BPM, loop: C.loop });
    } else if (S.sec === 'tempo') playTempo();
    else {
      if (R.rev) R.rev.played = true;
      const items = R.round < ROUNDS.length ? ROUNDS[R.round] : R.bar, r = rhythmEvents([items], 60 / BPM, false);
      startPlay('bar', r.ev, r.len, { bs: 60 / BPM });
    }
  } else if (act === 'loop') { C.loop = !C.loop; if (PL.on && PL.kind === 'compose') PL.loop = C.loop; sfx.click(); render(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; stopPlay(); R.ghost = null; R.noFit = false;
    S.sec = S.sec === k ? null : k; sfx.click(); render();
  } else if (act === 'mplay') {
    if (PL.on) { stopPlay(); return render(); }
    wantSound();
    playMetre();
  } else if (act === 'mans') {
    wantSound();
    M.answer = a; M.rt0 = nowS(); (a === M_ROUNDS[M.round] ? sfx.good : sfx.bad)(); showStage();
    playMetre(); // the reveal plays the pattern again while the dancer steps
  } else if (act === 'mnext') {
    stopPlay(); M.round = (M.round + 1) % M_ROUNDS.length; M.answer = null; M.played = false; M.dx = 0; sfx.click(); render();
  } else if (act === 'lplay') {
    if (PL.on) { stopPlay(); return render(); }
    wantSound();
    playListen();
  } else if (act === 'lans') {
    wantSound();
    LS.answer = +a; LS.rt0 = nowS(); (LS.order[+a] === 0 ? sfx.good : sfx.bad)(); showStage();
    playListen(); // the reveal plays the pattern again with the picture showing
  } else if (act === 'lnext') {
    stopPlay(); LS.round = (LS.round + 1) % L_ROUNDS.length; Object.assign(LS, { played: false, answer: null, order: shuffle3() }); sfx.click(); render();
  }
});
// the tap button reacts on pointerdown so the timing is the finger's, not the click's
$('bTap').addEventListener('pointerdown', (ev) => { ev.preventDefault(); tapNow(); });
$('bTap').addEventListener('click', (ev) => { if (ev.detail === 0) tapNow(); }); // keyboard
function tapNow() {
  const ms = performance.now(), beat = 60000 / BPM, k = Math.round((ms - B.epoch) / beat), off = (ms - B.epoch - k * beat) / 1000;
  B.taps.push({ t: (ms - B.epoch) / 1000, ok: Math.abs(off) <= 0.12 });
  if (B.taps.length > 60) B.taps.shift();
  sfx.tick(); render();
}
let tempoTimer = 0;
$('tempoR').addEventListener('input', () => {
  S.bpm = +$('tempoR').value; render();
  if (PL.on && PL.kind === 'tempo') { clearTimeout(tempoTimer); tempoTimer = setTimeout(() => { if (S.sec === 'tempo') playTempo(); }, 150); }
});
function playTempo() {
  const r = rhythmEvents(TEMPO_BARS, 60 / S.bpm, false);
  startPlay('tempo', r.ev, r.len, { bs: 60 / S.bpm, loop: true });
}
function playListen() { // the bar twice, the picture hidden until the answer
  const p = L_ROUNDS[LS.round].p, r = rhythmEvents([p, p], 60 / BPM, false);
  startPlay('listen', r.ev, r.len, { bs: 60 / BPM, end: () => { LS.played = true; render(); } });
}
function playMetre() {
  const lv = ACC[M_ROUNDS[M.round]], bs = 60 / BPM;
  startPlay('metre', Array.from({ length: 12 }, (_, i) => ({ t: i * bs, snd: 'wood', lv: lv[i % lv.length], fx: 'beat' })), 12 * bs, { bs, end: () => { M.played = true; } });
}

function addNote(k) {
  stopPlay();
  const comp = S.sec === 'compose', bi = comp ? C.sel : 0, items = comp ? C.bars[bi] : R.bar;
  if (sum(items) + NB[k] > 4) { R.ghost = { kind: k, t0: nowS(), bar: bi }; R.noFit = true; sfx.bad(); return render(); }
  items.push(k); R.noFit = false; R.ghost = null; sfx.click();
  if (comp && bi === 0 && sum(items) === 4 && sum(C.bars[1]) < 4) C.sel = 1; // the first bar is full: carry on in the second
  render();
}
// tap a placed note to take it out again; in the compose secret a tap on a bar chooses it
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'bar' || !HIT.length || (S.sec === 'tempo') || (!S.sec && R.round < ROUNDS.length)) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const inside = (q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h;
  const n = HIT.find((q) => q.type === 'note' && inside(q));
  if (n) { stopPlay(); (S.sec === 'compose' ? C.bars[n.bar] : R.bar).splice(n.idx, 1); if (S.sec === 'compose') C.sel = n.bar; R.noFit = false; sfx.tick(); return render(); }
  const b = HIT.find((q) => q.type === 'bar' && inside(q));
  if (b && C.sel !== b.bar) { C.sel = b.bar; sfx.tick(); render(); }
});

// --- one render per change: controls, readout and the state card ------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  setView(v === 'beat' ? 'vBeat' : v === 'bar' ? 'vBar' : v === 'metre' ? 'vMetre' : 'vListen');
  // one set of buttons in the DOM at a time: blank the controls of the views that are not showing
  if (v !== 'beat') $('bDyn').innerHTML = '';
  if (v !== 'bar') $('rDyn').innerHTML = '';
  if (v !== 'metre') $('mDyn').innerHTML = '';
  if (v !== 'listen') $('lDyn').innerHTML = '';
  if (v === 'beat') renderBeat(t); else if (v === 'bar') renderBar(t); else if (v === 'metre') renderMetre(t); else renderListen(t);
}

function renderBeat(t) {
  lab.setFacts(t.facts.beat);
  lab.setGlow('rgba(255, 95, 95, .22)');
  const tap = B.mode === 'tap', play = PL.on ? t.stop : t.b.play;
  $('bTapBox').style.display = tap ? '' : 'none';
  $('bTap').textContent = t.b.tapBtn;
  if (tap) {
    const last = B.taps.slice(-8), k = last.filter((x) => x.ok).length, n = last.length;
    $('bDyn').innerHTML = `<p class="q">${esc(t.b.tap)}</p><div class="row2" style="margin-top:0"><button class="chip" data-act="bnext">${esc(t.next)}</button></div>`;
    lab.setReadout(n ? `${k}/${n}` : '💓', n ? t.b.score(k, n) : '', '', '#ff5f5f');
    lab.setState(state(t, 'beat'));
    return;
  }
  const ans = B.answer, steadyW = B.steadyA ? 'A' : 'B', ok = ans === steadyW;
  const picks = ['A', 'B'].map((w, i) => `<button class="pick ${ans ? (w === steadyW ? 'good' : w === ans ? 'bad' : '') : ''}" data-act="bans" data-a="${w}"${!B.played || ans ? ' disabled' : ''}>${esc(t.b[i ? 'b' : 'a'])}</button>`).join('');
  $('bDyn').innerHTML = `<p class="q">${esc(t.b.q)}</p>
    <div class="row2" style="margin-top:0"><button class="btn" data-act="bplay">${esc(play)}</button></div>
    <div class="row2">${picks}</div>
    ${ans ? `${verdictHtml(t, ok)}<div class="row2"><button class="btn" data-act="bnext">${esc(t.next)}</button><button class="chip" data-act="btap">💓 ${esc(t.b.tap)}</button></div>` : ''}`;
  lab.setReadout(ans ? (ok ? '✓' : '✗') : '?', '', '', '#ff5f5f');
  lab.setState(ans ? verdictState(t, ok, t.b.why) : state(t, 'beat'));
}

// the five note buttons: a small picture of the note and its chocolate
function trayHtml(t) {
  return `<div class="tray">${KINDS.map((k) => `<button class="noteBtn" data-act="note" data-k="${k}" aria-label="${esc(t.notes[k])}"><canvas width="88" height="92" data-k="${k}"></canvas><span>${esc(t.notes[k])}</span></button>`).join('')}</div>`;
}
function paintTray() {
  $('rDyn').querySelectorAll('canvas[data-k]').forEach((cv) => {
    const k = cv.dataset.k, c = cv.getContext('2d'), g = { cw: 10, bh: 10, by: 34, m: 0.75, r: 2, noText: true };
    c.setTransform(2, 0, 0, 2, 0, 0); c.clearRect(0, 0, 44, 46);
    drawBlock(c, g, k, 22 - NB[k] * 5, COL[k], false);
    drawSym(c, k, 22, 27, 7, clamp(NB[k] * 10, 26, 40), '#EDEFF7');
  });
}

function renderBar(t) {
  lab.setFacts(t.facts.bar);
  lab.setGlow('rgba(217, 130, 95, .24)');
  const unl = secret.unlocked();
  const chip = (k, emo) => `<button class="chip secret ${unl ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${unl ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('rChips').innerHTML = chip('compose', '🎼') + chip('tempo', '🐢');
  $('tempoBox').style.display = S.sec === 'tempo' ? '' : 'none';
  const play = (dis) => `<button class="btn${S.sec === 'compose' ? '' : ' push'}" data-act="rplay"${dis ? ' disabled' : ''}>${esc(PL.on ? t.stop : t.r.play)}</button>`;
  const fine = `<div class="fine">${esc(t.fine)}</div>`;
  if (S.sec === 'tempo') {
    $('tempoCap').textContent = t.sec.tempo(S.bpm); $('tempoR').value = S.bpm; $('tempoR').setAttribute('aria-label', t.sec.tempo(S.bpm));
    $('rDyn').innerHTML = `<div class="row2" style="margin-top:0">${play(false)}</div>`;
    lab.setReadout(S.bpm, t.sec.tempo(S.bpm).replace(String(S.bpm), '').trim(), '', '#d9825f');
    return lab.setState({ emo: '🐢', title: t.secrets.tempo[0], lead: t.sec.tempoText, body: '', extra: fine });
  }
  if (S.sec === 'compose') {
    const u = C.bars.map(sum);
    $('rDyn').innerHTML = `<p class="lead2">${esc(t.sec.composeText)}</p>${trayHtml(t)}
      <div class="row2"><button class="chip" data-act="rclear">${esc(t.r.clear)}</button><button class="chip ${C.loop ? 'on' : ''}" data-act="loop">${esc(t.sec.loop)}</button>${play(!u[0] && !u[1])}</div>`;
    paintTray();
    lab.setReadout(`${u[0]} / 4 · ${u[1]} / 4`, t.beatsWord, '', '#d9825f');
    return lab.setState(R.noFit ? { emo: '🚫', title: t.r.noFit, lead: '', body: '', extra: fine } : { emo: '🎼', title: t.secrets.compose[0], lead: t.sec.composeText, body: '', extra: fine });
  }
  if (R.round >= ROUNDS.length) { // free building
    const n = sum(R.bar);
    $('rDyn').innerHTML = `<p class="lead2">${esc(t.r.free)}</p>${trayHtml(t)}
      <div class="row2"><button class="chip" data-act="rclear">${esc(t.r.clear)}</button>${play(!n)}</div>`;
    paintTray();
    lab.setReadout(`${n} / 4`, t.beatsWord, '', '#d9825f');
    return lab.setState(R.noFit ? { emo: '🚫', title: t.r.noFit, lead: '', body: '', extra: fine } : state(t, 'bar'));
  }
  // predict rounds
  const set = ROUNDS[R.round], tot = sum(set), right = tot === 4 ? 'yes' : tot > 4 ? 'many' : 'few', ans = R.answer, ok = ans === right;
  const picks = [['yes', t.r.yes], ['many', t.r.tooMany], ['few', t.r.tooFew]].map(([k, l]) => `<button class="pick ${ans ? (k === right ? 'good' : k === ans ? 'bad' : '') : ''}" data-act="rans" data-a="${k}"${ans ? ' disabled' : ''}>${esc(l)}</button>`).join('');
  $('rDyn').innerHTML = `<p class="q">${esc(t.r.q)}</p><div class="row2" style="margin-top:0">${picks}</div>
    ${ans ? `${verdictHtml(t, ok)}<div class="row2"><button class="btn" data-act="rnext">${esc(t.next)}</button>${play(false)}</div>` : ''}`;
  lab.setReadout(ans ? `${tot} / 4` : '?', ans ? t.beatsWord : '', '', '#d9825f');
  lab.setState(ans ? verdictState(t, ok, t.r.why[R.round], R.round === 5 ? t.r.restCounts : '') : state(t, 'bar'));
}

function renderMetre(t) {
  lab.setFacts(t.facts.metre);
  lab.setGlow('rgba(143, 127, 208, .26)');
  const kind = M_ROUNDS[M.round], ans = M.answer, ok = ans === kind;
  const picks = ['march', 'waltz', 'four'].map((k) => `<button class="pick ${ans ? (k === kind ? 'good' : k === ans ? 'bad' : '') : ''}" data-act="mans" data-a="${k}"${!M.played || ans ? ' disabled' : ''}>${esc(t.m[k])}</button>`).join('');
  $('mDyn').innerHTML = `<p class="q">${esc(t.m.q)}</p>
    <div class="row2" style="margin-top:0"><button class="btn" data-act="mplay">${esc(PL.on ? t.stop : t.play)}</button></div>
    <div class="row2">${picks}</div>
    ${ans ? `${verdictHtml(t, ok)}<div class="row2"><button class="btn" data-act="mnext">${esc(t.next)}</button></div>` : ''}`;
  lab.setReadout(ans ? esc(t.m[kind]) : '?', '', '', '#8f7fd0');
  lab.setState(ans ? verdictState(t, ok, t.m.why[kind]) : state(t, 'metre'));
}
// the three picture options: each a small chocolate row with its notes
function paintOpts() {
  $('lDyn').querySelectorAll('canvas[data-o]').forEach((cv) => {
    const w = Math.round(cv.getBoundingClientRect().width), h = 58, d = devicePixelRatio || 1; if (!w) return;
    cv.width = Math.round(w * d); cv.height = h * d;
    const c = cv.getContext('2d'), cwo = (w - 16) / 4, by = 32, u = 6.5, g = { cw: cwo, u, bh: 22, by, hc: by - 8 - 0.5 * u, m: 1, r: 4 };
    c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, w, h);
    let s = 0;
    for (const k of lOpt(+cv.dataset.o)) { drawItem(c, g, k, 8 + s * cwo, {}); s += NB[k]; }
  });
}
addEventListener('resize', () => { if (lab.view === 'listen') paintOpts(); });
function renderListen(t) {
  lab.setGlow('rgba(224, 112, 159, .24)'); lab.setFacts(t.facts.listen);
  const ans = LS.answer, done = ans !== null, ok = done && LS.order[ans] === 0;
  const opts = [0, 1, 2].map((i) => `<button class="pick opt ${done ? (LS.order[i] === 0 ? 'good' : i === ans ? 'bad' : '') : ''}" data-act="lans" data-a="${i}" aria-label="${esc(t.l.opt(i + 1))}"${!LS.played || done ? ' disabled' : ''}><canvas data-o="${i}"></canvas></button>`).join('');
  $('lDyn').innerHTML = `<p class="q">${esc(t.l.q)}</p>
    <div class="row2" style="margin-top:0"><button class="btn" data-act="lplay">${esc(PL.on ? t.stop : t.l.play)}</button></div>
    ${opts}
    ${done ? `${verdictHtml(t, ok)}<div class="row2"><button class="btn" data-act="lnext">${esc(t.next)}</button></div>` : ''}`;
  paintOpts();
  lab.setReadout(done ? (ok ? '✓' : '✗') : '?', '', '', '#e0709f');
  lab.setState(done ? verdictState(t, ok, t.l.why[LS.round]) : state(t, 'listen'));
}
render();
</script>
