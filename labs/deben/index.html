  if (n.st === 1 && p < 1) { const wx = cx + c.measureText(s2).width / 2 + 8; c.strokeStyle = '#6a4a28'; c.lineWidth = 3; c.beginPath(); c.moveTo(wx, cy + Y * .1); c.lineTo(wx + 22, cy + Y * .1 - 26); c.stroke(); }
  if (n.st === 2) {
    const q = Math.min(1, (now() - n.t1) / .6), e = ease(q);
    c.strokeStyle = '#b3261e'; c.lineWidth = 5; c.beginPath(); c.moveTo(cx - X * .38, cy - Y * .22); c.lineTo(lerp(cx - X * .38, cx + X * .38, e), lerp(cy - Y * .22, cy + Y * .26, e)); c.stroke();
    for (let i = 0; i < n.n; i++) weightIcon(c, w * (.5 + (i - (n.n - 1) / 2) * .1), lerp(h * 1.0, h * .88, e), 12);
  }
  if (n.st === 1 && p >= 1) pill(c, T[lang].nt.unit(n.n), cx, h * .9, { f: 14 });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  W = w; H = h; c.lineJoin = 'round'; c.lineCap = 'round';
  if (S.sec === 'coin') drawCoin(c, w, h, dt, time); else if (S.sec === 'note') drawNote(c, w, h, dt, time);
  else if (lab.view === 'swap') drawSwap(c, w, h, dt, time); else if (lab.view === 'weigh') drawWeigh(c, w, h, dt, time); else drawPay(c, w, h, dt, time);
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (S.sec === 'coin') { S.coin.spin = !S.coin.spin; sfx.click(); return; }
  if (S.sec || lab.view !== 'swap') return;
  const i = GEO.st.findIndex((g) => x >= g.x && x <= g.x + g.w && y >= g.y && y <= g.y + g.h);
  if (i >= 0) visit(i);
});

// --- actions -------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function visit(i) {
  const s = S.sw; if (s.done) return;
  const st = STALLS[i], first = !s.reveal, ok = st.wants === s.held;
  if (first) { s.reveal = true; s.t0 = now(); s.firstOk = ok; }
  s.last = { i, ok, old: s.held, first, t: now() };
  if (ok) { s.held = st.has; s.path.push(st.has); sfx.snap(); if (s.held === ROUNDS[s.r].goal) { s.done = true; s.doneAt = now(); setTimeout(sfx.good, 700); } } else sfx.bad();
  render(); showStage();
}
function pickOpt(i) {
  const w = S.w, p = PRED[w.pr]; if (w.pick !== null) return;
  w.pick = i; w.fix = false; sfx[i === p.ok ? 'good' : 'bad']();
  if (i !== p.ok) { const pr = w.pr; setTimeout(() => { if (S.w.pr === pr && S.w.pick === i) { S.w.fix = true; sfx.snap(); render(); } }, 2000); }
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i, w = S.w;
  if (a === 'visit') visit(i);
  else if (a === 'nr') { S.sw = newSwap((S.sw.r + 1) % ROUNDS.length); sfx.click(); }
  else if (a === 'again') { S.sw = newSwap(S.sw.r); sfx.click(); }
  else if (a === 'mode') { w.mode = b.dataset.m; sfx.click(); }
  else if (a === 'side') { w.side = b.dataset.s; sfx.click(); }
  else if (a === 'add') { const arr = w[w.side]; if (arr.length < 8) { arr.push(b.dataset.k); w.hist.push(w.side); sfx.click(); } else sfx.bad(); }
  else if (a === 'undo') { const sd = w.hist.pop(); if (sd) w[sd].pop(); sfx.tick(); }
  else if (a === 'clear') { w.L = []; w.R = []; w.hist = []; sfx.click(); }
  else if (a === 'opt') pickOpt(i);
  else if (a === 'wnext') { w.pr = (w.pr + 1) % PRED.length; w.pick = null; w.fix = false; sfx.click(); }
  else if (a === 'pg') { S.p.guess = i; S.p.h = 2; (i === 2 ? sfx.good : sfx.bad)(); showStage(); const r = $('dbRange'); r.value = 2; }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === b.dataset.k ? null : b.dataset.k; if (S.sec === 'note') S.nt = { n: S.nt.n, st: 0, t0: 0, t1: 0 }; sfx.click(); }
  else if (a === 'nstep') S.nt.n = clamp(S.nt.n + i, 1, 6);
  else if (a === 'nmain') { const n = S.nt; if (n.st === 0) { n.st = 1; n.t0 = now(); } else if (n.st === 1) { n.st = 2; n.t1 = now(); sfx.good(); } else n.st = 0; sfx.click(); }
  render();
});
$('dbRange').addEventListener('input', (ev) => { if (S.p.guess === null) return; S.p.h = +ev.target.value; sfx.tick(); render(); });

// --- render --------------------------------------------------------------------------------------------------
const btn = (cls, act, label, extra = '') => `<button class="db-b ${cls}" data-act="${act}" ${extra}>${label}</button>`;
function render() {
  const t = T[lang], v = lab.view;
  $('dbSwap').style.display = v === 'swap' && !S.sec ? '' : 'none';
  $('dbWeigh').style.display = v === 'weigh' && !S.sec ? '' : 'none';
  $('dbPay').style.display = v === 'pay' && !S.sec ? '' : 'none';
  $('dbNote').style.display = (v === 'weigh' || v === 'pay') && !S.sec ? '' : 'none';
  $('dbNote').textContent = t.gp;
  lab.setGlow(v === 'swap' ? 'rgba(217, 130, 95, .26)' : v === 'weigh' ? 'rgba(200, 119, 58, .28)' : 'rgba(224, 176, 80, .26)');
  if (v === 'swap') rSwap(t); else if (v === 'weigh') rWeigh(t); else rPay(t);
  if (S.sec === 'coin') {
    lab.setReadout(esc(t.coin.year), '', 'nefer nub', '#f0c040'); lab.setState({ emo: '🪙', title: t.coin.title, lead: t.coin.lead, body: t.coin.body, extra: '' });
  } else if (S.sec === 'note') {
    const n = S.nt;
    lab.setReadout(n.st ? esc(t.nt.unit(n.n)) : '?', '', '', '#c9a36c');
    lab.setState(n.st === 0 ? { emo: '📜', title: t.nt.t0, lead: t.nt.l0, body: '', extra: '' } : n.st === 1 ? { emo: '📜', title: t.nt.t1(n.n), lead: t.nt.l1b, body: '', extra: '' } : { emo: '✅', title: t.nt.t2, lead: t.nt.l2b, body: '', extra: '' });
  }
  const open = secret.unlocked(), sc = (k, e) => `<button class="db-b sec ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('dbSec').innerHTML = sc('coin', '🪙') + sc('note', '📜');
  const n = S.nt;
  $('dbSecCtl').innerHTML = S.sec === 'note' ? `<span class="db-step"><button class="db-b" data-act="nstep" data-i="-1" ${n.st ? 'disabled' : ''}>−</button><b>${esc(t.nt.unit(n.n))}</b><button class="db-b" data-act="nstep" data-i="1" ${n.st ? 'disabled' : ''}>+</button></span>
    ${btn('on', 'nmain', n.st === 0 ? t.nt.write : n.st === 1 ? t.nt.pay : t.nt.again)}` : '';
  $('dbSecCtl').style.display = S.sec === 'note' ? '' : 'none';
  lab.setFacts([{ emo: FACT[v].emo, text: t.facts[v], src: FACT[v].src }]);
}
const names = (arr, t) => arr.map((k) => `${E[k]} ${t.goods[k]}`).join(' + ');
function rSwap(t) {
  const s = S.sw, goal = ROUNDS[s.r].goal, q = t.sw;
  $('dbSwap').innerHTML = `<div class="db-row"><div class="db-st">${STALLS.map((st, i) => btn('', 'visit', `${E[st.has]} ${esc(t.keepers[st.id])}`, `data-i="${i}" ${s.done ? 'disabled' : ''}`)).join('')}</div></div>
    <div class="db-row">${btn('', 'again', '↺ ' + q.again)}${btn(s.done ? 'on' : '', 'nr', '→ ' + q.nr)}</div>`;
  const path = s.path.map((k) => E[k]).join(' → ');
  lab.setReadout(s.done ? path : `${path} → ?`, s.done ? q.swaps(s.path.length - 1) : `${q.want}: ${E[goal]}`, '', '#d9825f');
  const L = s.last;
  if (!s.reveal) lab.setState({ emo: '🤔', title: q.q(E.fish, E[goal]), lead: q.tap, body: '', extra: '' });
  else if (s.done) lab.setState({ emo: '🎉', title: q.got(E[goal]), lead: q.doneL(s.path.length - 1, path), body: q.doneB, extra: '' });
  else if (L.ok) lab.setState({ emo: '🤝', title: L.first ? q.right : q.swap, lead: q.yes(t.the(t.keepers[STALLS[L.i].id]), E[L.old], E[s.held]), body: q.next, extra: '' });
  else lab.setState({ emo: '🙅', title: q.no, lead: (L.first ? q.refuseFirst : q.refuse)(t.the(t.keepers[STALLS[L.i].id]), E[s.held]), body: '', extra: '' });
}
function rWeigh(t) {
  const w = S.w, q = t.wg, { L, R, hide } = wState(), vL = sumOf(L), vR = sumOf(R);
  let h = `<div class="db-row">${btn(w.mode === 'weigh' ? 'on' : '', 'mode', q.modeW, 'data-m="weigh"')}${btn(w.mode === 'pred' ? 'on' : '', 'mode', q.modeP, 'data-m="pred"')}</div>`;
  const board = `<div class="db-row"><div class="db-lbl">${esc(q.board)}</div><div class="db-board">${GOODS.map((k) => `<span>${E[k]} ${VAL[k]}</span>`).join('')}</div></div>`;
  if (w.mode === 'weigh') {
    h += `<div class="db-row"><div class="db-lbl">${esc(q.add)}</div>${btn(w.side === 'L' ? 'on' : '', 'side', q.left, 'data-s="L"')}${btn(w.side === 'R' ? 'on' : '', 'side', q.right, 'data-s="R"')}</div>
      <div class="db-row">${GOODS.map((k) => btn('', 'add', `${E[k]} ${VAL[k]}`, `data-k="${k}"`)).join('')}${btn('cu', 'add', '+1 ⚖️', 'data-k="d"')}</div>
      <div class="db-row">${btn('', 'undo', q.undo)}${btn('', 'clear', q.clear)}</div>`;
    const bal = L.length && R.length && vL === vR;
    lab.setReadout(`${vL} ${bal ? '=' : '·'} ${vR}`, 'deben', bal ? '✓' : '', '#c8773a');
    lab.setState(!L.length && !R.length ? { emo: '⚖️', title: q.empty, lead: q.emptyL, body: '', extra: '' }
      : bal ? { emo: '✅', title: q.bal, lead: q.balL(vL), body: `${names(L, t).replace(/⚖️ undefined/g, '')}`.replace(/⚖️ [^+]*/g, '⚖️×' + L.filter((k) => k === 'd').length), extra: '' }
      : { emo: '⚖️', title: q.tilt, lead: q.tiltL(vL, vR), body: '', extra: '' });
    if (bal) lab.setState({ emo: '✅', title: q.bal, lead: q.balL(vL), body: `${L.map((k) => E[k]).join(' ')}  =  ${R.map((k) => E[k]).join(' ')}`, extra: '' });
  } else {
    const p = PRED[w.pr], done = w.pick !== null, win = done && w.pick === p.ok;
    h += `<div class="db-row"><div class="db-q">${esc(q.q(p.target.map((k) => E[k]).join(' ')))}</div></div>${board}
      <div class="db-row"><div class="db-opts">${p.opts.map((o, i) => `<button class="db-b ${done ? (i === p.ok ? 'good' : i === w.pick ? 'bad' : '') : ''}" data-act="opt" data-i="${i}" ${done ? 'disabled' : ''}>${esc(names(o, t))}</button>`).join('')}</div></div>
      ${done ? `<div class="db-row">${btn('on', 'wnext', q.next + ' →')}</div>` : ''}`;
    lab.setReadout(hide ? '?' : `${vL} ${vL === vR ? '=' : '≠'} ${vR}`, hide ? q.hid : 'deben', '', '#c8773a');
    if (!done) lab.setState({ emo: '🎯', title: q.q(p.target.map((k) => E[k]).join(' ')), lead: q.tap, body: '', extra: '' });
    else if (win) lab.setState({ emo: '✅', title: q.right, lead: q.rightL(`${p.opts[p.ok].map((k) => VAL[k]).join(' + ')} = ${sumOf(p.target)}`), body: '', extra: '' });
    else lab.setState({ emo: '🤔', title: q.wrong, lead: q.wrongL(sumOf(p.opts[w.pick]), sumOf(p.target)), body: '', extra: '' });
  }
  $('dbWeigh').innerHTML = h;
}
function rPay(t) {
  const p = t.pay, g = S.p.guess, hv = g === null ? 0 : S.p.h, f = FARMERS[hv], y = YIELD[hv];
  $('dbPayQ').style.display = g === null ? '' : 'none'; $('dbPayO').style.display = g === null ? '' : 'none';
  $('dbPayQ').textContent = p.q;
  $('dbPayO').innerHTML = [10, 6, 4].map((n, i) => `<button class="db-b ${g !== null ? (n === 4 ? 'good' : i === g ? 'bad' : '') : ''}" data-act="pg" data-i="${[0, 1, 2][i] === i ? (n === 4 ? 2 : i) : i}" ${g !== null ? 'disabled' : ''}>${n}</button>`).join('');
  $('dbPayS').style.display = g === null ? 'none' : '';
  $('dbFlL').textContent = p.fl; $('dbRange').value = String(hv);
  $('dbFl').innerHTML = p.floods.map((x, i) => `<span class="${i === hv ? 'on' : ''}">${esc(x)}</span>`).join('');
  if (g === null) { lab.setReadout('?', p.sub, '', '#e0b050'); lab.setState({ emo: '🤔', title: p.q, lead: p.tap, body: '', extra: '' }); }
  else lab.setReadout(p.val(f), p.sub, '', '#e0b050');
  if (g !== null) lab.setState({ emo: hv === 0 ? '🌾' : '🏺', title: (g === 2 ? T[lang].sw.right + ' ' : '') + p.title(f), lead: p.lead(y, f), body: `${hv === 0 ? p.bodyLow : p.bodyHigh} ${p.payday}`, extra: '' });
}
render();
</script>
</body>
