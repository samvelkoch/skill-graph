}

  const A = S.army; S.dim = { w, h };
  const e = A.q >= 1 ? eio(c01((now() - A.t0) / 1.5)) : 0, g = armyGeom(w, h), hz = h * .4;
  const sky = ctx.createLinearGradient(0, 0, 0, hz + 10); sky.addColorStop(0, '#8DB4DA'); sky.addColorStop(1, '#F1E5C6'); ctx.fillStyle = sky; ctx.fillRect(0, 0, w, hz + 10);
  for (const [fx, fy, fr] of [[.2, .1, .08], [.27, .12, .06], [.7, .08, .07], [.78, .1, .05]]) { ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(w * fx, h * fy, R(w * fr * 1.4), R(h * .025), 0, 0, TAU); ctx.fill(); }
  hills(ctx, 0, w, hz - 6, h * .07, '#9DB59A', 1.7, hz + 20); hills(ctx, 0, w, hz + 6, h * .05, '#7B9A68', 4.1, hz + 30);
  for (const fx of [.06, .1, .93]) cypress(ctx, w * fx, hz + 12, Math.max(.8, h / 330));
  const gr = ctx.createLinearGradient(0, hz, 0, h); gr.addColorStop(0, '#B9B27C'); gr.addColorStop(1, '#8B8654'); ctx.fillStyle = gr; ctx.fillRect(0, hz + 8, w, h - hz);
  const rs = rng(8); for (let i = 0, n = w * h / 400; i < n; i++) { ctx.fillStyle = rs() < .5 ? 'rgba(80,66,30,.25)' : 'rgba(240,225,170,.25)'; ctx.fillRect(rs() * w, hz + 12 + rs() * (h - hz), 1 + rs() * 2, 1 + rs()); }
  // the block of legionaries, back row to front; bodies first, then the shields of that row
  for (let r = ROWS - 1; r >= 0; r--) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      const p = soldierPos(g, r, c, e), k = p.s, bob = Math.sin(t * 2 + c * .7 + r) * .6 * k * (1 - e);
      ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(p.x, p.y + k, R(13 * k), R(3.6 * k), 0, 0, TAU); ctx.fill();
      body(ctx, p.x, p.y + bob, k, { spear: e < .4, drop: r === 0 ? e : 0 });
      row.push([p, bob]);
    }
    row.forEach(([p, bob], c) => {
      const k = p.s;
      shieldAt(ctx, shieldPose(r === 0 ? 'front' : 'roof', e, p.x, p.y + bob, k), k);
      if (e > .02 && r >= 1 && (c === 0 || c === COLS - 1)) shieldAt(ctx, [p.x + (c ? 1 : -1) * 14 * k, p.y - 27 * k, 5 * k, 36 * k, 0], k, e);
    });
  }
  if (A.q >= 1 && A.q < 3) { // volleys of arrows that bounce off the shells
    const tv = now() - A.t0, plan = [1.9, 3.3, 4.7];
    while (A.nextV < plan.length && tv > plan[A.nextV]) { volley(7); A.nextV++; }
  }
  for (const a of A.arrows) {
    if (now() < a.t0) continue;
    if (!a.hit) {
      const p = c01((now() - a.t0) / a.dur); drawArrow(ctx, lerp(a.sx, a.tx, p), lerp(a.sy, a.ty, p), a.ang, g.k, 1);
      if (p >= 1) { a.hit = true; a.tb = now(); a.bx = a.tx; a.by = a.ty; a.vx = a.side * (60 + Math.random() * 90); a.vy = -(150 + Math.random() * 120); A.sparks.push({ x: a.tx, y: a.ty, t0: now() }); sfx.tick(); }
    } else {
      a.vy += 560 * dt; a.bx += a.vx * dt; a.by += a.vy * dt; a.ang += a.spin * dt;
      const al = 1 - (now() - a.tb) / .9; if (al > 0) drawArrow(ctx, a.bx, a.by, a.ang, g.k, al); else a.dead = true;
    }
  }
  A.arrows = A.arrows.filter((a) => !a.dead);
  A.sparks = A.sparks.filter((s) => now() - s.t0 < .35);
  for (const s of A.sparks) {
    const el = (now() - s.t0) / .35, a = 1 - el; ctx.save(); ctx.lineCap = 'round';
    for (let i = 0; i < 7; i++) { const an = i * TAU / 7 + .3, r1 = 3 + el * 12, r2 = r1 + 7 * a; ctx.strokeStyle = i % 2 ? `rgba(255,255,255,${a})` : `rgba(240,200,90,${a})`; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(s.x + Math.cos(an) * r1, s.y + Math.sin(an) * r1); ctx.lineTo(s.x + Math.cos(an) * r2, s.y + Math.sin(an) * r2); ctx.stroke(); }
    ctx.strokeStyle = `rgba(255,255,255,${a * .7})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(s.x, s.y, R(4 + el * 16), 0, TAU); ctx.stroke(); ctx.restore();
  }
  if (A.q >= 3) drawBritain(ctx, w, h, now() - A.t2 - .6, c01((now() - A.t2) / .6));
}
// the answer to "which year?": a small map of Britain, the landing in AD 43, then the wall in AD 122
function drawBritain(ctx, w, h, u, alpha) {
  const tr = T[lang], pad = 16, m = getMap('brit', w - 2 * pad, h - 2 * pad), P = m.P;
  const rx = Math.round((w - m.rw) / 2), ry = Math.round((h - m.rh) / 2);
  ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(bgCanvas(w, h, 'paper'), 0, 0, w, h);
  ctx.translate(rx, ry);
  ctx.save(); ctx.shadowColor = 'rgba(40,25,10,.5)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4; rr(ctx, 0, 0, m.rw, m.rh, 8); ctx.fillStyle = PAL.sea; ctx.fill(); ctx.restore();
  ctx.drawImage(m.canvas, 0, 0, m.rw, m.rh);
  ctx.save(); rr(ctx, 0, 0, m.rw, m.rh, 8); ctx.clip();
  const [lx, ly] = P(1.4, 51.3), [fx, fy] = P(1.9, 50.5), spread = eio((u - 1.4) / 2.2);
  if (spread > 0) {
    ctx.save(); ctx.clip(m.land, 'evenodd'); ctx.beginPath(); ctx.arc(lx, ly, R(spread * m.rh * 1.05), 0, TAU); ctx.clip();
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#5E1814'; ctx.lineWidth = 3.4; ctx.stroke(m.regions[0]); ctx.fillStyle = hatch(ctx); ctx.fill(m.regions[0]); ctx.restore();
    ctx.save(); ctx.lineJoin = 'round'; ctx.lineWidth = 1.1; ctx.strokeStyle = 'rgba(88,58,28,.9)'; ctx.stroke(m.land); ctx.restore();
  }
  const sp = eio(u / 1.4); // the fleet crosses from the Gaulish coast to the south-east
  if (u > 0) {
    ctx.save(); ctx.strokeStyle = PAL.red; ctx.lineWidth = 2.6; ctx.setLineDash([5, 4]); ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(lerp(fx, lx, sp), lerp(fy, ly, sp)); ctx.stroke(); ctx.restore();
    const ax = lerp(fx, lx, sp), ay = lerp(fy, ly, sp), an = Math.atan2(ly - fy, lx - fx);
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(an); ctx.fillStyle = PAL.red; ctx.strokeStyle = '#2B1410'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-3, -6); ctx.lineTo(-3, 6); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    if (sp < 1) emoji(ctx, '⛵', lerp(fx, lx, sp) - 12, lerp(fy, ly, sp) + 8 + Math.sin(u * 7) * 2, 18);
  }
  if (u > 1.4) pill(ctx, tr.year(43), lx + 40, ly + 6, m.rw, { a: c01((u - 1.4) / .4), fs: 13, weight: 900, bg: 'rgba(120,28,22,.92)', border: PAL.gold });
  const f = eio((u - 3.8) / 1.6);
  if (f > 0) { // the wall, from the Tyne in the east to the Solway in the west
    const [ex, ey] = P(-1.53, 54.99), [wx, wy] = P(-3.25, 54.95), cx = lerp(ex, wx, f), cy = lerp(ey, wy, f);
    ctx.save(); ctx.lineCap = 'round';
    ctx.strokeStyle = '#2B2A33'; ctx.lineWidth = 7.4; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.strokeStyle = '#BEC2CB'; ctx.lineWidth = 4.4; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.strokeStyle = 'rgba(70,74,84,.7)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(cx, cy); ctx.stroke(); ctx.setLineDash([]);
    for (let i = 0; i <= 6; i++) { const q = i / 6; if (q > f) break; ctx.fillStyle = i % 3 === 0 ? PAL.gold : PAL.parch; ctx.strokeStyle = '#2B2A33'; ctx.lineWidth = 1; rr(ctx, lerp(ex, wx, q) - 3, lerp(ey, wy, q) - 3, 6, 6, 1.5); ctx.fill(); ctx.stroke(); }
    ctx.restore();
    if (f >= 1) {
      const mx = (ex + wx) / 2, my = (ey + wy) / 2, a2 = c01((u - 5.4) / .4);
      pill(ctx, tr.year(122), mx, my - 26, m.rw, { a: a2, fs: 13, weight: 900, bg: 'rgba(31,26,46,.9)' });
      pill(ctx, `117 ${tr.kmu}`, mx, my + 24, m.rw, { a: a2, fs: 12, weight: 800 });

  }
  ctx.restore();
  const gold = ctx.createLinearGradient(0, 0, m.rw, m.rh); gold.addColorStop(0, '#EBCB6E'); gold.addColorStop(.5, PAL.gold); gold.addColorStop(1, '#8F6F1F');
  ctx.strokeStyle = gold; ctx.lineWidth = 3; rr(ctx, -1.5, -1.5, m.rw + 3, m.rh + 3, 9); ctx.stroke();

}

// =============================================================================================================
//  THE LOOP
// =============================================================================================================
function tick(dt) {
  if (S.auto) { // after the first answer the slider runs from 500 BC to AD 117 by itself
    const p = c01((now() - S.auto.t0) / 6); S.yearT = lerp(YSTART, YTOP, eio(p)); S.year = S.yearT; if (p >= 1) S.auto = null;
  } else S.year += (S.yearT - S.year) * Math.min(1, dt * 12);
  const R_ = S.r, want = R_.rainT0 != null && now() >= R_.rainT0 - .2 ? 1 : 0;
  R_.split += (want - R_.split) * Math.min(1, dt * 3);
  if (lab.view === 'grow' && !S.sec) syncYear();
  if (lab.view === 'road') roadReadout();
}
canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  tick(dt);
  ctx.drawImage(bgCanvas(w, h, 'paper'), 0, 0, w, h);
  const v = lab.view;
  if (v === 'grow') { if (S.sec === 'wall') drawWall(ctx, w, h, t, now() - S.secT0); else if (S.sec === 'numerals') drawNumerals(ctx, w, h, t, now() - S.secT0); else drawGrow(ctx, w, h, t); }
  else if (v === 'road') drawRoadView(ctx, w, h, t);
  else drawArmy(ctx, w, h, t, dt);
  ctx.drawImage(bgCanvas(w, h, 'frame'), 0, 0, w, h);
});
$('cv').addEventListener('pointerdown', () => { // free play: tap the shell to shoot more arrows at it
  const A = S.army; if (lab.view === 'army' && A.q >= 1 && A.q < 3 && now() - A.t0 > 1.4) volley(5);
});

// =============================================================================================================
//  CONTROLS
// =============================================================================================================
const showStage = () => { // on a phone the controls sit below the canvas: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const verdict = (ok, t) => `<div class="rm-verdict ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.wrong)}</div>`;
const permOf = (key, n) => (S.perm[key] ??= shuffle([...Array(n).keys()]));
function qBlock(key, q, opts, ans, ok) {
  const done = ans !== undefined;
  return `<div class="rm-q">${esc(q)}</div><div class="rm-opts">${permOf(key, opts.length).map((j) =>
    `<button class="rm-fo ${done ? (j === ok ? 'good' : j === ans ? 'bad' : '') : ''}" data-act="ans" data-j="${j}"${done ? ' disabled' : ''}>${esc(opts[j])}</button>`).join('')}</div>`;
}
const nextBtn = (act, t) => `<div class="row2" style="margin-top:0"><button class="btn" data-act="${act}">${esc(act === 'again' ? t.again : t.next)}</button></div>`;
const stateOf = (t, view, full, extra = '') => { const [emo, title, lead, body] = t.st[view][full ? 1 : 0]; return { emo, title, lead, body, extra }; };
const secChip = (t, key, emo) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-act="sec" data-k="${key}">${secret.unlocked() ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;

function syncYear() {
  const el = $('yr'), ry = Math.round(S.year), dis = S.gq < 1 || !!S.auto;
  if (el) { if (S.auto && +el.value !== ry) el.value = ry; if (el.disabled !== dis) el.disabled = dis; }
  if (ry !== S._ry || dis !== S._dis) { S._ry = ry; S._dis = dis; yearReadout(); }
}
function yearReadout() {
  if (S.sec) return;
  const t = T[lang], ry = Math.round(S.year);
  lab.setReadout(t.year(ry), '', '', PAL.gold);
  document.querySelectorAll('.rm-ev').forEach((e, i) => e.classList.toggle('on', S.gq >= 1 && ry >= EV_YEARS[i]));
  const el = $('yr'); if (el) el.setAttribute('aria-label', t.year(ry));
}
const numReadout = () => lab.setReadout(String(S.num), romanParts(S.num).map((p) => p.s).join(''), '', PAL.gold);
function roadReadout() {
  const t = T[lang], R_ = S.r; let val = '?', sub = '', pl = '';
  if (R_.q > 0) {
    const done = [0, 1, 2, 3, 4, 5].filter((i) => R_.lt[i] != null && now() >= R_.lt[i] + LD[i]);
    val = `${done.length}/6`; sub = done.length ? t.r.layers[Math.max(...done)] : ''; pl = done.length === 6 ? t.r.km : '';
  }
  const key = `${val}|${sub}|${pl}|${lang}`; if (key === S._ro) return; S._ro = key;
  lab.setReadout(val, sub, pl, '#C9A13B');
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'sec') {
    const key = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === key ? null : key; S.secT0 = now(); S.numT0 = now(); S._ry = null; sfx.click(); showStage();
  } else if (v === 'grow') {
    if (act === 'ans') {
      const j = +b.dataset.j, k = S.gq < 2 ? 0 : 1;
      S.ga[k] = j; S.gq = k ? 3 : 1; (j === 1 ? sfx.good : sfx.bad)();
      if (k === 0) S.auto = { t0: now() }; else S.t0.q2 = now();
      showStage();
    } else if (act === 'next') { S.gq = 2; sfx.click(); }
    else if (act === 'again') {
      S.gq = 0; S.ga = []; S.year = S.yearT = YSTART; S.auto = null; S.evIdx = -1; delete S.perm.g0; delete S.perm.g1; sfx.click();
    } else if (act === 'step') {
      S.num = clamp(S.num + +b.dataset.s, 1, 100); S.numT0 = now(); sfx.tick(); const el = $('nm'); if (el) el.value = S.num; numReadout(); return;
    }
  } else if (v === 'road') {
    const R_ = S.r;
    if (act === 'ans') {
      const j = +b.dataset.j, t0 = now();
      S.r = { ...R_, q: 1, a: j, t0, lt: REVEAL_AT.map((s) => (s <= -99 ? -99 : t0 + s)), rainT0: t0 + 6.0 };
      (j === 0 ? sfx.good : sfx.bad)(); showStage();
    } else if (act === 'again') {
      S.r = { q: 2, a: R_.a, t0: null, lt: [null, null, null, null, null, null], rainT0: null, split: R_.split, next: 0, msg: false, shake: -1 }; sfx.click();
    } else if (act === 'lay') {
      const i = +b.dataset.i;
      if (i === R_.next) {
        R_.lt[i] = now(); R_.next++; R_.msg = false; sfx.snap();
        if (R_.next === 6) { R_.rainT0 = now() + LD[5] + .5; sfx.good(); showStage(); }
      } else { R_.msg = true; R_.shake = i; sfx.bad(); }
    }
  } else {
    const A = S.army;
    if (act === 'ans') {
      const j = +b.dataset.j, k = A.q < 2 ? 0 : 1;
      A.a[k] = j; A.q = k ? 3 : 1; (j === 0 ? sfx.good : sfx.bad)();
      if (k === 0) { A.t0 = now(); A.nextV = 0; A.arrows = []; A.sparks = []; } else A.t2 = now();
      showStage();
    } else if (act === 'next') { A.q = 2; sfx.click(); }
    else if (act === 'again') { S.army = { q: 0, a: [], t0: null, t2: null, arrows: [], sparks: [], nextV: 0 }; delete S.perm.a0; delete S.perm.a1; sfx.click(); }
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'yr') { S.yearT = +ev.target.value; return; }
  if (ev.target.id === 'nm') { S.num = clamp(Math.round(+ev.target.value) || 1, 1, 100); S.numT0 = now(); numReadout(); }
});

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  for (const [id, key] of [['secGrow', 'grow'], ['secRoad', 'road'], ['secArmy', 'army']]) { if (key !== v) $(id).innerHTML = ''; }
  if (v === 'grow') renderGrow(t); else if (v === 'road') renderRoad(t); else renderArmy(t);
}

function renderGrow(t) {
  const q = S.gq, k = q < 2 ? 0 : 1, G = t.g, qs = [[G.q1, G.o1, 1, G.r1], [G.q2, G.o2, 1, G.r2]][k], ans = S.ga[k], done = q === 1 || q === 3;
  let html = '';
  if (S.sec === 'numerals') {
    html = `<div class="rm-num"><div class="rm-step"><button class="rm-sb" data-act="step" data-s="-1" aria-label="−">−</button>
      <input class="big" id="nm" type="range" min="1" max="100" step="1" value="${S.num}" style="--track:linear-gradient(90deg,#7A5A2C,#C8944A 40%,#D9A93E)" aria-label="${esc(t.secrets.numerals[0])}">
      <button class="rm-sb" data-act="step" data-s="1" aria-label="+">+</button></div></div>`;
  } else if (!S.sec) {
    const pos = (y) => `calc(13px + (100% - 26px) * ${((y - Y0) / (Y1 - Y0)).toFixed(4)})`;
    html = qBlock('g' + k, qs[0], qs[1], ans, qs[2])
      + (done ? verdict(ans === qs[2], t) + `<p class="rm-why">${esc(qs[3])}</p>${nextBtn(q === 3 ? 'again' : 'next', t)}` : '')
      + `<div class="rm-dial"><input class="big" id="yr" type="range" min="${Y0}" max="${Y1}" step="1" value="${Math.round(S.year)}" style="--track:linear-gradient(90deg,#7A5A2C,#C8944A 35%,#A87333 65%,#D9A93E)" aria-label="${esc(t.year(Math.round(S.year)))}"${q < 1 || S.auto ? ' disabled' : ''}>
        <div class="rm-ticks">${KEY_YEARS.map((y) => `<span class="rm-tk" style="left:${pos(y)}"></span>`).join('')}<span class="rm-tk zero" style="left:${pos(0)}"></span>${EV_YEARS.map((y) => `<span class="rm-ev" style="left:${pos(y)}"></span>`).join('')}</div>
        <div class="ends"><span>${esc(t.year(Y0))}</span><span>${esc(t.year(Y1))}</span></div></div>`;
  }
  html += `<div class="chips">${secChip(t, 'wall', '🧱')}${secChip(t, 'numerals', 'Ⅻ')}</div>`;
  $('secGrow').innerHTML = html;
  lab.setGlow('rgba(165, 50, 43, .26)');
  if (S.sec) {
    const e = S.sec === 'wall' ? '🧱' : 'Ⅻ';
    lab.setState({ emo: e, title: t.secrets[S.sec][0], lead: t.sec[S.sec === 'wall' ? 'wallText' : 'numText'], body: '', extra: '' });
    if (S.sec === 'wall') lab.setReadout('117', t.kmu, '', PAL.gold); else numReadout();
  } else {
    lab.setState(stateOf(t, 'grow', q >= 3, q >= 3 ? `<div class="rm-fine">${esc(t.fine)}</div>` : ''));
    S._ry = null; S._dis = null; yearReadout();
  }
}

function renderRoad(t) {
  const R_ = S.r, q = R_.q, Rr = t.r;
  let html;
  if (q < 2) {
    html = qBlock('r0', Rr.q, Rr.o, R_.a, 0) + (q === 1 ? verdict(R_.a === 0, t) + `<p class="rm-why">${esc(Rr.r)}</p>${nextBtn('again', t)}` : '');
  } else {
    html = `<div class="rm-q">${esc(t.rb)}</div><div class="rm-lay">${ORDER.map((i) => {
      const ok = i < R_.next;
      return `<button class="rm-lb ${ok ? 'done' : ''} ${R_.shake === i ? 'shake' : ''}" data-act="lay" data-i="${i}"${ok ? ' disabled' : ''}><i style="background:${LAYER_COL[i]}"></i>${ok ? '✓ ' : ''}${esc(Rr.layers[i])}</button>`;
    }).join('')}</div>`;
    if (R_.msg) html += `<div class="rm-verdict no">${esc(Rr.wrong)}</div>`;
    if (R_.next === 6) html += `<p class="rm-why">${esc(Rr.r)}</p>${nextBtn('again', t)}`;
    R_.shake = -1;
  }
  $('secRoad').innerHTML = html;
  lab.setGlow('rgba(150, 106, 64, .3)');
  S._ro = ''; roadReadout();
  lab.setState(stateOf(t, 'road', q >= 1));
}

function renderArmy(t) {
  const A = S.army, q = A.q, k = q < 2 ? 0 : 1, a = t.a, qs = k ? [a.q2, a.o2, 0, a.r2] : [a.q1, a.o1, 0, a.r1], ans = A.a[k], done = q === 1 || q === 3;
  $('secArmy').innerHTML = qBlock('a' + k, qs[0], qs[1], ans, qs[2])
    + (done ? verdict(ans === qs[2], t) + `<p class="rm-why">${esc(qs[3])}</p>${nextBtn(q === 3 ? 'again' : 'next', t)}` : '');
  lab.setGlow('rgba(165, 50, 43, .26)');
  if (q >= 3) lab.setReadout(esc(t.year(43)), '', t.year(122), PAL.red); else lab.setReadout(q === 0 ? '?' : '🛡️', '', '', PAL.red);
  lab.setState(stateOf(t, 'army', q >= 3));
}
render();
</script>
