  c.beginPath(); spline(c, DANUBE); c.lineWidth = 12; c.strokeStyle = '#1f4f86'; c.stroke(); c.lineWidth = 9; c.strokeStyle = lg(c, 60, 0, 110, 0, [[0, '#6fb0ea'], [1, '#3c7fc4']]); c.stroke();
  // the Tisza now
  c.beginPath(); spline(c, tisza(r)); c.lineWidth = 9; c.strokeStyle = '#1f4f86'; c.stroke(); c.lineWidth = 6.5; c.strokeStyle = lg(c, 230, 0, 300, 0, [[0, '#7bb8ee'], [1, '#3c7fc4']]); c.stroke();
  c.lineWidth = 1.2; c.strokeStyle = 'rgba(255,255,255,.35)'; c.setLineDash([6, 12]); c.lineDashOffset = -time * 8; c.stroke(); c.setLineDash([]);
  // railways
  const done = [];
  LINES.forEach(([tx, ty, st, dur, bend], i) => {
    const f = dur === 0 ? (y >= st ? 1 : 0) : easeIO((y - st) / dur); if (f <= 0) return;
    const mx = (BP[0] + tx) / 2, my = (BP[1] + ty) / 2, dx = tx - BP[0], dy = ty - BP[1], L = Math.hypot(dx, dy), cx = mx - dy / L * bend, cy = my + dx / L * bend;
    c.beginPath(); c.moveTo(BP[0], BP[1]);
    const N = 36; for (let k = 1; k <= N; k++) { const u = f * k / N; c.lineTo((1 - u) * (1 - u) * BP[0] + 2 * (1 - u) * u * cx + u * u * tx, (1 - u) * (1 - u) * BP[1] + 2 * (1 - u) * u * cy + u * u * ty); }
    c.lineWidth = 3.6; c.strokeStyle = '#1d1c27'; c.stroke(); c.lineWidth = 1.6; c.strokeStyle = '#f1e6c8'; c.setLineDash([3, 4]); c.stroke(); c.setLineDash([]);
    if (f >= 1) done.push([tx, ty, i]);
  });
  done.forEach(([x, yy]) => { c.fillStyle = '#f6eed6'; c.strokeStyle = '#1d1c27'; c.lineWidth = 1.5; c.beginPath(); c.arc(x, yy, 4, 0, Math.PI * 2); c.fill(); c.stroke(); });
  // Budapest
  c.fillStyle = rg(c, BP[0], BP[1], 20, [[0, 'rgba(255,214,110,.6)'], [1, 'rgba(255,214,110,0)']]); c.fillRect(BP[0] - 20, BP[1] - 20, 40, 40);
  c.fillStyle = '#f0c75a'; c.strokeStyle = '#1d1c27'; c.lineWidth = 1.8; c.beginPath(); c.arc(BP[0], BP[1], 7, 0, Math.PI * 2); c.fill(); c.stroke();
  pill(c, s, t.buda, BP[0] + 44, BP[1] - 16, 'rgba(10,12,20,.82)', '#fff');
  pill(c, s, t.vac, 138, 82, 'rgba(10,12,20,.82)', '#fff');
  pill(c, s, t.danube, 46, 232, 'rgba(10,12,20,.82)', '#fff');
  const q3 = tisza(r)[3]; pill(c, s, t.tisza, q3[0] + 38, q3[1], 'rgba(10,12,20,.82)', '#fff');
  c.globalAlpha = .4; txt(c, s, String(Math.round(y)), 24, 418, 30, '#ffffff', 'left', 900); c.globalAlpha = 1;
  c.restore(); c.restore();
}

// --- shell --------------------------------------------------------------------------------------------------
const lab = shell({ key: 'dualism', T, topics: TOPICS, views: ['jobs', 'city', 'rail'], onLang: () => render(), onView: () => render() });
const secret = secretLab('dualism', () => ({
  secrets: [{ emo: '👑', title: T[lang].secrets.a[0], desc: T[lang].secrets.a[1] }, { emo: '🎆', title: T[lang].secrets.b[0], desc: T[lang].secrets.b[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="sJobs"><div id="jQ"></div><div class="row2" id="jSec"></div></div>
  <div id="sCity"><div id="cQ"></div><div class="row2 chips" id="cYears"></div><div class="row2" id="cSec"></div></div>
  <div id="sRail"><div id="rQ"></div>
    <div class="dq-sl" id="rSl" hidden><input type="range" class="big" id="rRange" min="1846" max="1910" step="1" value="1846">
      <div class="ends"><span>1846</span><span>1910</span></div><div class="chips" id="rChips"></div></div></div>`;

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'jobs') drawJobs(c, w, h, dt, time); else if (v === 'city') drawCity(c, w, h, dt, time); else drawRail(c, w, h, dt, time);
});

// --- controls ------------------------------------------------------------------------------------------------
const setHTML = (el, html) => { if (el.dataset.k !== html) { el.dataset.k = html; el.innerHTML = html; } };
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const resetJobs = () => { S.ci = 0; S.ans = null; S.res = []; S.log = []; S.cardAt = now(); };
function answerJob(g) {
  if (lab.view !== 'jobs' || S.ans !== null || S.ci >= CARDS.length) return;
  const tgt = CARDS[S.ci].t, ok = g === tgt;
  S.ans = g; S.res[S.ci] = { g, ok }; S.log.push({ i: S.ci, tgt, ok, t0: now() }); (ok ? sfx.good : sfx.bad)(); render(); showStage();
}
$('cv').addEventListener('click', (ev) => {
  if (lab.view !== 'jobs' || S.ans !== null) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - FIT.ox) / FIT.s, y = (ev.clientY - r.top - FIT.oy) / FIT.s;
  if (y < 78 || y > 350) return;
  answerJob(x < 120 ? 'v' : x < 240 ? 'c' : 'b');
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-g], [data-p]'); if (!b) return;
  const act = b.dataset.act;
  if (b.dataset.g) { answerJob(b.dataset.g); return; }
  if (b.dataset.p !== undefined) { // predictions in the city and Tisza views
    if (lab.view === 'city' && S.guessC === null) { S.guessC = b.dataset.p; S.auto = true; S.autoT = .7; (b.dataset.p === 'yes' ? sfx.good : sfx.bad)(); }
    else if (lab.view === 'rail' && S.guessR === null) { S.guessR = +b.dataset.p; S.play = true; S.yr = 1846; (S.guessR === 1 ? sfx.good : sfx.bad)(); }
    render(); showStage(); return;
  }
  if (act === 'next') { S.ci++; S.ans = null; S.cardAt = now(); sfx.click(); }
  else if (act === 'again') { resetJobs(); sfx.click(); }
  else if (act === 'yi') { S.yi = +b.dataset.i; S.shown = 4; sfx.tick(); }
  else if (act === 'yr') { S.play = false; S.yr = +b.dataset.y; $('rRange').value = S.yr; sfx.tick(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'a') { S.secA = !S.secA; S.secAAt = now(); } else S.secB = !S.secB;
    sfx.click();
  }
  render();
});
$('rRange').addEventListener('input', (ev) => { S.play = false; S.yr = +ev.target.value; render(); });

// --- one render per change: controls, readout and the state card -------------------------------------------------
const secChip = (k, emo, open, on, label) => `<button class="chip dq-chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(label)}` : '🔒 ???'}</button>`;
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('sJobs').hidden = v !== 'jobs'; $('sCity').hidden = v !== 'city'; $('sRail').hidden = v !== 'rail';
  if (v === 'jobs') renderJobs(t); else if (v === 'city') renderCity(t); else renderRail(t);
}

function renderJobs(t) {
  const j = t.j, N = CARDS.length, end = S.ci >= N, k = S.res.filter((x) => x && x.ok).length, open = secret.unlocked();
  lab.setGlow('rgba(224, 176, 80, .24)');
  let q = '';
  if (end) q = `<div class="dq-verdict good">${esc(j.end(k, N))}</div><button class="btn" data-act="again">${esc(j.again)}</button>`;
  else {
    const cd = j.cards[S.ci], tgt = CARDS[S.ci].t, r = S.res[S.ci];
    q = `<div class="dq-q"><span class="dq-e">${CARDS[S.ci].e}</span><span>${esc(cd.n)}</span></div><div class="dq-opts">${['v', 'b', 'c'].map((g) => {
      const cls = S.ans === null ? '' : g === tgt ? ' good' : g === S.ans ? ' bad' : ' dim';
      return `<button class="dq-opt dq-${g}${cls}" data-g="${g}"${S.ans !== null ? ' disabled' : ''}>${esc(j.names[g])}</button>`;
    }).join('')}</div>`;
    if (S.ans !== null) q += `<div class="dq-verdict ${r.ok ? 'good' : 'bad'}">${esc(r.ok ? j.right : j.wrong[tgt])}</div><button class="btn" data-act="next">${esc(S.ci === N - 1 ? j.last : j.next)}</button>`;
    q += `<div class="dq-cnt">${S.ci + 1} / ${N}</div>`;
  }
  setHTML($('jQ'), q);
  setHTML($('jSec'), secChip('a', '👑', open, S.secA, t.secrets.a[0]));
  lab.setReadout(end ? `${k}/${N}` : `${S.ci + 1}/${N}`, j.card, S.res.length ? j.ok(k) : '', '#e0b050');
  let st;
  if (S.secA) st = { emo: '👑', title: j.coro.title, lead: j.coro.lead, body: j.coro.body };
  else if (end) st = { emo: '🏆', title: j.end(k, N), lead: j.endLead, body: '' };
  else if (S.ans !== null) { const r = S.res[S.ci]; st = { emo: r.ok ? '✅' : '🤔', title: r.ok ? j.right : j.wrong[CARDS[S.ci].t], lead: j.cards[S.ci].x, body: '' }; }
  else st = { emo: '🤔', title: j.q, lead: j.hint, body: '' };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(t.facts.jobs);
}

function renderCity(t) {
  const c = t.c, revealed = S.guessC !== null, open = secret.unlocked(), p = POP[S.yi][1], ratio = p / POP[0][1];
  lab.setGlow('rgba(95, 168, 160, .26)');
  let q = `<div class="dq-q"><span>${esc(c.q)}</span></div>`;
  if (!revealed) q += `<div class="dq-opts"><button class="dq-opt" data-p="yes">${esc(c.yes)}</button><button class="dq-opt" data-p="no">${esc(c.no)}</button></div>`;
  else q = `<div class="dq-verdict ${S.guessC === 'yes' ? 'good' : 'bad'}">${esc(S.guessC === 'yes' ? c.right : c.wrong)}</div>`;
  setHTML($('cQ'), q);
  setHTML($('cYears'), revealed && !S.auto ? POP.map(([yr], i) => `<button class="chip dq-chip ${i === S.yi ? 'on' : ''}" data-act="yi" data-i="${i}">${yr}</button>`).join('') : '');
  setHTML($('cSec'), secChip('b', '🎆', open, S.secB, t.secrets.b[0]));
  lab.setReadout(fmtN(p), `${revealed && S.yi >= 1 ? c.sub1 : c.sub0} · ${POP[S.yi][0]}`, revealed && S.yi > 0 ? `×${fmtR(ratio)}` : '', '#5fa8a0');
  let st;
  if (S.secB) st = { emo: '🎆', title: c.mill.title, lead: c.mill.lead, body: c.mill.body };
  else if (!revealed) st = { emo: '🏘️', title: c.t0, lead: c.l0, body: c.b0 };
  else st = { ...c.yrs[S.yi](fmtN(p)), body: S.yi > 0 ? c.ratio(fmtR(ratio)) : '' };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(revealed ? [...t.facts.city0, ...t.facts.city1] : t.facts.city0);
}

function renderRail(t) {
  const r = t.r, guessed = S.guessR !== null, y = Math.round(S.yr);
  lab.setGlow('rgba(80, 150, 200, .26)');
  let q = `<div class="dq-q"><span>${esc(r.q)}</span></div>`;
  if (!guessed) q += `<div class="dq-opts">${r.opts.map((o, i) => `<button class="dq-opt" data-p="${i}">${esc(o)}</button>`).join('')}</div>`;
  else q = `<div class="dq-verdict ${S.guessR === 1 ? 'good' : 'bad'}">${esc(S.guessR === 1 ? r.right : r.wrong)}</div>`;
  setHTML($('rQ'), q);
  $('rSl').hidden = !guessed;
  $('rRange').setAttribute('aria-label', r.year);
  setHTML($('rChips'), [1846, 1880, 1910].map((yy) => `<button class="chip dq-chip ${y === yy ? 'on' : ''}" data-act="yr" data-y="${yy}">${yy}</button>`).join(''));
  const done = y >= 1880;
  const sub = !guessed ? r.old : `${r.rv}: ${y <= 1846 ? `${fmtN(KM.before)} km` : done ? `${fmtN(KM.after)} km` : r.mid}`;
  lab.setReadout(guessed ? String(y) : '1846', sub, guessed && done ? `−${fmtN(KM_DIFF)} km` : '', '#4ea8ff');
  let st;
  if (!guessed) st = { emo: '🌊', title: r.t0, lead: r.l0, body: r.b0 };
  else if (y < 1850) st = { ...r.ph[0], body: '' };
  else if (y < 1880) st = { ...r.ph[1], body: r.idea };
  else if (y < 1905) st = { emo: r.ph[2].emo, title: r.ph[2].title, lead: r.ph[2].lead(fmtN(KM.before), fmtN(KM.after), fmtN(KM_DIFF), KM_PCT), body: r.ph[2].body };
  else st = { emo: r.ph[3].emo, title: r.ph[3].title, lead: r.ph[3].lead(fmtN(RAIL_1910)), body: r.idea };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(guessed ? [...t.facts.rail0, ...t.facts.rail1] : t.facts.rail0);
}
render();
</script>
