const nl = (s) => esc(s).replace(/\n/g, '<br>');

// --- the picture: a school corridor, a fox that trots in, sniffs a lunchbox and leaves ----------------------
const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const LOOP = 11, BOXX = 214, FLOOR = 124;
function pose(t) {
  if (t < 3) return { x: lerp(-36, 160, smooth(t / 3)), walk: 1, sn: 0, a: 1, door: 0 };
  if (t < 5.6) { const u = (t - 3) / 2.6; return { x: 160, walk: 0, sn: smooth(Math.sin(u * Math.PI) * 1.5), a: 1, door: 0 }; }
  if (t < 8.6) { const x = lerp(160, 318, smooth((t - 5.6) / 3)); return { x, walk: 1, sn: 0, a: 1 - smooth((x - 292) / 24), door: smooth((t - 6.6) / 0.9) }; }
  return { x: 400, walk: 0, sn: 0, a: 0, door: 1 - smooth((t - 8.6) / 1.2) };
}
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); };
const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, Math.PI * 2); };
const grad = (c, x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };

function drawFox(c, x, gy, k, ph, walk, sn, a, time) {
  if (a <= 0.01) return;
  c.save(); c.translate(x, gy); c.scale(k, k); c.globalAlpha = a; c.lineJoin = 'round'; c.lineCap = 'round';
  ell(c, 0, 2, 30, 5); c.fillStyle = 'rgba(40,20,10,.22)'; c.fill();
  const bob = Math.abs(Math.sin(ph)) * 1.6 * walk, sw = (o) => Math.sin(ph + o) * 6 * walk;
  const leg = (lx, o, col) => { c.strokeStyle = col; c.lineWidth = 5; c.beginPath(); c.moveTo(lx, -10 - bob); c.lineTo(lx + sw(o), -2 - Math.max(0, -Math.sin(ph + o)) * 3 * walk); c.stroke(); };
  leg(-15, Math.PI, '#8a3f1a'); leg(14, 0, '#8a3f1a');              // far legs
  // tail with a white tip, wagging
  c.save(); c.translate(-23, -19 - bob); c.rotate(-0.55 + Math.sin(time * 3.2) * 0.07);
  ell(c, -14, 0, 18, 8); c.fillStyle = grad(c, -30, -8, -6, 8, [[0, '#ff9d52'], [1, '#d9591f']]); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#9a3d17'; c.stroke();
  ell(c, -28, 0, 6.5, 6.5); c.fillStyle = '#fff6e8'; c.fill(); c.strokeStyle = '#c9b79b'; c.lineWidth = 1; c.stroke();
  c.restore();
  // body
  ell(c, 0, -17 - bob, 27, 13); c.fillStyle = (() => { const g = c.createRadialGradient(-9, -26 - bob, 3, 0, -17 - bob, 30); g.addColorStop(0, '#ffb066'); g.addColorStop(0.55, '#ef7a30'); g.addColorStop(1, '#c4501c'); return g; })(); c.fill();
  c.lineWidth = 1.6; c.strokeStyle = '#9a3d17'; c.stroke();
  ell(c, 8, -10 - bob, 15, 5.5); c.fillStyle = 'rgba(255,240,220,.85)'; c.fill();
  leg(-8, 0, '#a24a1d'); leg(21, Math.PI, '#a24a1d');                // near legs
  // head
  c.save(); c.translate(25 + sn * 7, -27 + sn * 11 - bob); c.rotate(sn * 0.42);
  c.beginPath(); c.moveTo(-9, -8); c.lineTo(-6, -23); c.lineTo(2, -11); c.closePath(); c.fillStyle = '#e8672a'; c.fill(); c.strokeStyle = '#9a3d17'; c.stroke();
  c.beginPath(); c.moveTo(2, -10); c.lineTo(8, -23); c.lineTo(11, -8); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(-6, -11); c.lineTo(-5.5, -19); c.lineTo(-1, -12); c.closePath(); c.fillStyle = '#3b1d12'; c.fill();
  c.beginPath(); c.moveTo(4, -11); c.lineTo(7.5, -19); c.lineTo(9, -10); c.closePath(); c.fill();
  ell(c, 0, 0, 13, 11.5); c.fillStyle = (() => { const g = c.createRadialGradient(-4, -5, 2, 0, 0, 15); g.addColorStop(0, '#ffb877'); g.addColorStop(1, '#e8672a'); return g; })(); c.fill(); c.lineWidth = 1.6; c.strokeStyle = '#9a3d17'; c.stroke();
  ell(c, 6, 5.5, 9, 5); c.fillStyle = '#fff6e8'; c.fill();                       // white cheeks
  ell(c, 13, 3, 8.5, 5.3, 0.15); c.fillStyle = '#ffe3c4'; c.fill(); c.lineWidth = 1.2; c.strokeStyle = '#9a3d17'; c.stroke(); // snout
  ell(c, 20.5, 1.2, 2.6, 2.1); c.fillStyle = '#2a1510'; c.fill();                 // nose
  c.beginPath(); c.arc(7, -2.5, 3.1, 0, Math.PI * 2); c.fillStyle = '#1e1210'; c.fill();       // eye
  c.beginPath(); c.arc(6, -3.6, 1.1, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();           // white highlight
  c.restore();
  c.restore();
}

function drawScene(c, W, H, time, gymText) {
  // wall, light from the top left
  c.fillStyle = grad(c, 0, 0, 360, 130, [[0, '#f7e8c6'], [1, '#e1c690']]); c.fillRect(0, 0, W, FLOOR);
  c.fillStyle = grad(c, 0, 80, 0, FLOOR, [[0, '#6d9fa0'], [1, '#4d7f82']]); c.fillRect(0, 88, W, FLOOR - 88); // wainscot
  c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(0, 88, W, 2);
  // window
  rr(c, 218, 22, 54, 52, 4); c.fillStyle = grad(c, 0, 22, 0, 74, [[0, '#9fd4ff'], [1, '#e6f4ff']]); c.fill(); c.lineWidth = 3; c.strokeStyle = '#9a7040'; c.stroke();
  c.beginPath(); c.moveTo(245, 22); c.lineTo(245, 74); c.moveTo(218, 48); c.lineTo(272, 48); c.lineWidth = 2; c.stroke();
  // clock
  ell(c, 132, 36, 13, 13); c.fillStyle = '#fffdf6'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = '#8a5a30'; c.stroke();
  c.lineWidth = 1.8; c.strokeStyle = '#3a2a20'; c.beginPath(); c.moveTo(132, 36); c.lineTo(132, 28); c.moveTo(132, 36); c.lineTo(138, 39); c.stroke();
  // lockers
  for (let i = 0; i < 4; i++) {
    const lx = 8 + i * 28;
    rr(c, lx, 34, 26, 90, 3); c.fillStyle = grad(c, lx, 0, lx + 26, 0, [[0, '#5aa7a0'], [1, '#3b7f7b']]); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#27595a'; c.stroke();
    c.fillStyle = 'rgba(20,50,50,.45)'; for (let j = 0; j < 3; j++) c.fillRect(lx + 6, 42 + j * 4, 14, 1.8);
    ell(c, lx + 20, 82, 2, 2); c.fillStyle = '#e9d9a0'; c.fill();
  }
  // gym door
  const p = pose(time % LOOP), d = p.door;
  rr(c, 292, 44, 52, 84, 4); c.fillStyle = grad(c, 292, 0, 344, 0, [[0, '#2a1f18'], [1, '#14100c']]); c.fill();
  c.fillStyle = 'rgba(255,215,130,.28)'; c.fillRect(298, 52, 40 * d, 70);                 // light from the gym
  const lw = 40 * (1 - 0.8 * d);
  rr(c, 296, 48, lw, 78, 3); c.fillStyle = grad(c, 296, 0, 296 + lw, 0, [[0, '#5aa27c'], [1, '#3a7a5a']]); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#25503b'; c.stroke();
  if (lw > 14) { rr(c, 302, 56, Math.max(0, lw - 12), 18, 3); c.fillStyle = 'rgba(210,240,255,.7)'; c.fill(); }
  c.lineWidth = 3; c.strokeStyle = '#8a5a30'; rr(c, 292, 44, 52, 84, 4); c.stroke();
  c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const gw = c.measureText(gymText).width + 14; rr(c, 318 - gw / 2, 24, gw, 17, 8.5); c.fillStyle = 'rgba(20,24,40,.85)'; c.fill();
  c.fillStyle = '#fff'; c.fillText(gymText, 318, 33);
  // floor
  c.fillStyle = grad(c, 0, FLOOR, 0, H, [[0, '#c99a62'], [1, '#a77a46']]); c.fillRect(0, FLOOR, W, H - FLOOR);
  c.strokeStyle = 'rgba(90,55,20,.25)'; c.lineWidth = 1; c.beginPath();
  for (let i = 0; i < 9; i++) { const y = FLOOR + 6 + i * 9; c.moveTo(0, y); c.lineTo(W, y); }
  c.stroke(); c.fillStyle = 'rgba(70,40,15,.3)'; c.fillRect(0, FLOOR, W, 3);
  // backpack and the lunchbox on the floor
  const bw = (p.sn > 0.05 ? Math.sin(time * 26) * 0.04 * p.sn : 0);
  rr(c, 244, 118, 30, 38, 9); c.fillStyle = grad(c, 244, 0, 274, 0, [[0, '#6b8de0'], [1, '#4565b8']]); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#2c4180'; c.stroke();
  rr(c, 249, 134, 20, 14, 4); c.fillStyle = '#3e58a2'; c.fill();
  ell(c, 230, 156, 18, 3.5); c.fillStyle = 'rgba(40,20,10,.22)'; c.fill();
  c.save(); c.translate(BOXX, 154); c.rotate(bw);
  rr(c, -16, -20, 32, 20, 5); c.fillStyle = grad(c, -16, -20, 16, 0, [[0, '#ff7a6a'], [1, '#d6453a']]); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#8f2a22'; c.stroke();
  rr(c, -16, -20, 32, 7, 4); c.fillStyle = 'rgba(255,255,255,.28)'; c.fill();
  rr(c, -4, -25, 8, 6, 3); c.strokeStyle = '#8f2a22'; c.lineWidth = 2; c.stroke();
  rr(c, -3, -11, 6, 5, 2); c.fillStyle = '#ffe9a8'; c.fill();
  c.restore();
  // the fox, smaller as it walks towards the door
  const gy = lerp(152, 138, smooth((p.x - 240) / 60)), k = lerp(1, 0.82, smooth((p.x - 240) / 60));
  drawFox(c, p.x, gy, k, time * 9, p.walk, p.sn, p.a, time);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const sh = (lab.view === 'machine' ? 0.36 : 0.30) * h, ww = Math.min(w - 20, 580);
  const sc = Math.min(ww / 360, (sh - 16) / 200, 2);
  const px = w / 2 - 180 * sc, py = 6 + Math.max(0, (sh - 16 - 200 * sc) / 2);
  c.save(); c.translate(px, py); c.scale(sc, sc);
  c.save(); rr(c, 0, 0, 360, 200, 12); c.clip();
  drawScene(c, 360, 200, time, T[lang].gym);
  c.restore();
  rr(c, 0, 0, 360, 200, 12); c.lineWidth = 3; c.strokeStyle = '#3a2a1a'; c.stroke();
  c.restore();
  // brass slot of the machine under the picture
  const sx = w / 2 - ww / 2 + 4, sy = py + 200 * sc + 6, sw = ww - 8;
  rr(c, sx, sy, sw, 11, 5.5); c.fillStyle = grad(c, 0, sy, 0, sy + 11, [[0, '#f0d58a'], [0.5, '#c79a45'], [1, '#7a5a22']]); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#4a3512'; c.stroke();
  c.fillStyle = 'rgba(30,20,5,.55)'; rr(c, sx + 14, sy + 4, sw - 28, 3, 1.5); c.fill();
  for (const rx of [sx + 7, sx + sw - 7]) { ell(c, rx, sy + 5.5, 2.2, 2.2); c.fillStyle = '#fff1c0'; c.fill(); }
});

// --- html pieces ---------------------------------------------------------------------------------------------
const sp = (f) => `<div class="gs-sp" style="--sh:${f}"></div>`;
const dial = () => `<div class="gs-dial" role="group">${ID.map((id, i) => `<button class="gs-d${i === S.g ? ' on' : ''}" data-g="${i}" aria-label="${esc(T[lang].g[i].name)}">${EMO[i]}</button>`).join('')}</div>`;
function paper(gi) {
  const g = T[lang].g[gi];
  return `<div class="gs-paper p-${ID[gi]}" style="--rot:${ROT[gi]}deg"><div class="gs-ph"><span>${EMO[gi]} ${esc(g.name)}</span><span>👥 ${esc(g.reader)}</span></div>
    ${g.segs.map((s, k) => `<div class="gs-seg${k === 0 && HEAD[gi] ? ' hd' : ''}" style="--c:${COL[k]};--n:${k}"><i class="gs-lab">${esc(g.tags[k])}</i>${nl(s)}</div>`).join('')}</div>`;
}
const feats = (gi) => { const t = T[lang]; return `<div class="gs-feats"><b>${esc(t.featHead)}</b>${t.g[gi].feats.map((f, k) => `<div><i style="background:${COL[k]}"></i><span>${esc(f)}</span></div>`).join('')}</div>`; };
const dots = (res, i) => [0, 1, 2, 3, 4].map((k) => (k < res.length ? (res[k] ? '✓' : '✗') : k === i ? '◉' : '○')).join(' ');
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

// --- events ----------------------------------------------------------------------------------------------------
gs.addEventListener('click', (ev) => {
  const d = ev.target.closest('[data-g]');
  if (d) { S.g = +d.dataset.g; S.sec = null; sfx.click(); render(); return; }
  const sg = ev.target.closest('[data-seg]');
  if (sg && lab.view === 'slip' && S.s.i < 5 && S.s.pick === null) {
    const j = +sg.dataset.seg, it = T[lang].s.items[S.s.i];
    S.s.pick = j; S.s.res[S.s.i] = j === it.bad; (j === it.bad ? sfx.good : sfx.bad)(); render(); showStage();
  }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-p], [data-st]'); if (!b) return;
  const act = b.dataset.act;
  if (b.dataset.p !== undefined) {
    if (S.m.i >= 5 || S.m.pick !== null) return;
    const p = +b.dataset.p; S.m.pick = p; S.m.res[S.m.i] = p === ROUND_G[S.m.i]; (S.m.res[S.m.i] ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (b.dataset.st !== undefined) { S.style = +b.dataset.st; sfx.tick(); render(); return; }
  if (act === 'turn') { S.g = (S.g + 1) % 5; S.sec = null; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; sfx.click();
  } else if (act === 'mnext') {
    if (S.m.i >= 5) S.m = { i: 0, pick: null, res: [] };
    else if (S.m.pick !== null) { S.m.i++; S.m.pick = null; }
    else return;
    sfx.click();
  } else if (act === 'snext') {
    if (S.s.i >= 5) S.s = { i: 0, pick: null, res: [] };
    else if (S.s.pick !== null) { S.s.i++; S.s.pick = null; }
    else return;
    sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => { if (ev.target.id === 'toneR') { S.tone = +ev.target.value; render(); } });

// --- render ----------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('cV1').style.display = v === 'machine' ? '' : 'none';
  $('cV2').style.display = v === 'match' ? '' : 'none';
  $('cV3').style.display = v === 'slip' ? '' : 'none';
  lab.setFacts(t.facts[v]);
  if (v === 'machine') renderMachine(t); else if (v === 'match') renderMatch(t); else renderSlip(t);
}

function renderMachine(t) {
  const g = t.g[S.g], open = secret.unlocked();
  $('turnB').textContent = t.turn;
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('q', '🎭') + sc('tone', '🎚️');
  $('secBody').innerHTML = S.sec === 'q'
    ? `<div class="chips" style="margin-top:10px">${t.qn.styles.map((n, i) => `<button class="chip gs-pick ${i === S.style ? 'on' : ''}" data-st="${i}">${esc(n)}</button>`).join('')}</div>`
    : S.sec === 'tone'
      ? `<input class="big gs-tone" id="toneR" type="range" min="0" max="2" step="1" value="${S.tone}" aria-label="${esc(t.tn.name)}"><div class="ends"><span>${esc(t.tn.ends[0])}</span><span>${esc(t.tn.ends[1])}</span></div>` : '';
  let body = '';
  if (S.sec === 'q') {
    body = `<div class="gs-paper p-plain" style="--rot:-.4deg"><div class="gs-ph"><span>🎭 ${esc(t.qn.name)}</span><span>${esc(t.qn.styles[S.style])}</span></div><div class="gs-big">${nl(t.qn.texts[S.style])}</div></div>`;
    lab.setReadout('🎭', t.qn.styles[S.style], '', '#a99be0'); lab.setGlow('rgba(169,155,224,.28)');
    lab.setState({ emo: '🎭', title: t.qn.title, lead: t.qn.lead, body: '', extra: '' });
  } else if (S.sec === 'tone') {
    const l = t.tn.l[S.tone], lg = t.g[3];
    body = `<div class="gs-paper p-letter" style="--rot:.4deg"><div class="gs-ph"><span>✉️ ${esc(t.tn.title[S.tone])}</span><span>🎚️ ${esc(t.tn.lvl[S.tone])}</span></div>
      ${l.map((s, k) => `<div class="gs-seg" style="--c:${COL[k]}"><i class="gs-lab" style="animation:none">${esc(lg.tags[k])}</i>${nl(s)}</div>`).join('')}</div>`;
    lab.setReadout('🎚️', t.tn.lvl[S.tone], '', '#d8a86a'); lab.setGlow(GLOW[3]);
    lab.setState({ emo: '🎚️', title: t.tn.title[S.tone], lead: t.tn.lead, body: '', extra: '' });
  } else {
    body = paper(S.g);
    lab.setReadout(EMO[S.g], g.reader, g.purpose, ACC[S.g]); lab.setGlow(GLOW[S.g]);
    lab.setState({ emo: EMO[S.g], title: g.name, lead: `${t.purposeL}: ${g.purpose}. ${t.readerL}: ${g.reader}.`, body: '', extra: feats(S.g) });
  }
  gs.innerHTML = `${sp('36%')}${dial()}${body}`;
}

function renderMatch(t) {
  const i = S.m.i, end = i >= 5, k = S.m.res.filter(Boolean).length, pick = S.m.pick;
  lab.setGlow('rgba(242,193,78,.26)');
  $('mDots').textContent = dots(S.m.res, i);
  $('pickChips').innerHTML = end ? '' : ID.map((id, n) => {
    const cls = pick === null ? '' : n === ROUND_G[i] ? 'ok' : n === pick ? 'no' : '';
    return `<button class="chip gs-pick ${cls}" data-p="${n}"${pick !== null ? ' disabled' : ''}>${EMO[n]} ${esc(t.g[n].name)}</button>`;
  }).join('');
  $('mNext').textContent = end ? t.again : t.next;
  $('mNext').disabled = !end && pick === null;
  let body;
  if (end) {
    body = `<div class="gs-paper p-poem" style="--rot:-.3deg"><div class="gs-big" style="font-style:normal">${esc(t.m.end(k))}</div><div class="gs-sum">${ROUND_G.map((g, n) => `<span class="${S.m.res[n] ? 'ok' : 'no'}">${EMO[g]}</span>`).join('')}</div></div>`;
    lab.setReadout(`${k}/5`, dots(S.m.res, 9), '', '#f2c14e');
    lab.setState({ emo: '🏆', title: t.m.end(k), lead: t.m.endLead, body: '', extra: '' });
  } else {
    const r = t.m.rounds[i], gi = ROUND_G[i];
    const card = `<div class="gs-ask"><b>${esc(t.purposeL)}</b><p>${esc(r.p)}</p><b>${esc(t.readerL)}</b>${esc(r.r)}</div>`;
    body = card + (pick === null ? `<div class="gs-seal"><div><i>?</i>${esc(t.m.sealed)}</div></div>` : paper(gi));
    if (pick === null) {
      lab.setReadout(`${k}/5`, dots(S.m.res, i), '', '#f2c14e');
      lab.setState({ emo: '🎯', title: t.m.q, lead: t.m.lead(i + 1), body: '', extra: '' });
    } else {
      const ok = pick === gi;
      lab.setReadout(`${k}/5`, dots(S.m.res, i + 1), t.g[gi].name, ACC[gi]);
      lab.setState(ok ? { emo: '✅', title: t.m.right, lead: r.why, body: '', extra: feats(gi) }
        : { emo: '🤔', title: t.m.best(t.g[gi].name), lead: r.why, body: t.m.picked(t.g[pick].name), extra: feats(gi) });
    }
  }
  gs.innerHTML = `${sp('30%')}${body}`;
}

function renderSlip(t) {
  const i = S.s.i, end = i >= 5, k = S.s.res.filter(Boolean).length, pick = S.s.pick;
  lab.setGlow('rgba(242,134,107,.26)');
  $('sDots').textContent = dots(S.s.res, i);
  $('sNext').textContent = end ? t.again : t.next;
  $('sNext').disabled = !end && pick === null;
  let body;
  if (end) {
    body = `<div class="gs-paper p-poem" style="--rot:-.3deg"><div class="gs-big" style="font-style:normal">${esc(t.s.end(k))}</div><div class="gs-sum">${SLIP_G.map((g, n) => `<span class="${S.s.res[n] ? 'ok' : 'no'}">${EMO[g]}</span>`).join('')}</div></div>`;
    lab.setReadout(`${k}/5`, dots(S.s.res, 9), '', '#f2866b');
    lab.setState({ emo: '🏆', title: t.s.end(k), lead: t.s.endLead, body: '', extra: '' });
  } else {
    const it = t.s.items[i], gi = SLIP_G[i], hd = SLIP_HEAD[i], done = pick !== null;
    const parts = it.segs.map((s, j) => {
      const cls = ['gs-sg', j === hd ? 'hd' : ''];
      let pre = '', post = '', inner = nl(s);
      if (done && j === it.bad) {
        cls.push(it.ins ? 'miss' : 'slip');
        if (it.ins) pre = `<div class="gs-fix"><small>${esc(t.s.fixed)}</small>${nl(it.fix)}</div>`;
        else { inner = `<span class="gs-mark">${esc(t.s.slipTag)}</span><s>${inner}</s>`; post = `<div class="gs-fix"><small>${esc(t.s.fixed)}</small>${nl(it.fix)}</div>`; }
        if (it.ins) inner = `<span class="gs-mark" style="background:#1f9d63">${esc(t.s.missing)}</span>${inner}`;
      } else if (done && j === pick) cls.push('wrong');
      return `${pre}<button class="${cls.join(' ')}" data-seg="${j}"${done ? ' disabled' : ''}>${inner}</button>${post}`;
    }).join('');
    body = `<div class="gs-paper p-${ID[gi]}" style="--rot:${ROT[gi]}deg"><div class="gs-ph"><span>${EMO[gi]} ${esc(t.g[gi].name)}</span><span>${esc(t.s.lead(i + 1))}</span></div>${parts}</div>`;
    if (!done) {
      lab.setReadout(`${k}/5`, dots(S.s.res, i), '', '#f2866b');
      lab.setState({ emo: '🔎', title: t.s.q, lead: t.s.lead(i + 1), body: '', extra: '' });
    } else {
      const ok = pick === it.bad;
      lab.setReadout(`${k}/5`, dots(S.s.res, i + 1), '', '#f2866b');
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.s.right : t.s.no, lead: it.why, body: '', extra: '' });
    }
  }
  gs.innerHTML = `${sp('30%')}${body}`;
}
render();
</script>
</body>
</html>
