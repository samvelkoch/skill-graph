// --- drawing: the map --------------------------------------------------------------------------------------------
function drawPin(c, x, y, drop) {
  c.save();
  c.fillStyle = 'rgba(0, 0, 0, .3)'; c.beginPath(); c.ellipse(x, y, 6, 2.4, 0, 0, TAU); c.fill();
  const yy = y + drop;
  c.fillStyle = '#e5484d'; c.strokeStyle = '#7a1218'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(x, yy); c.bezierCurveTo(x - 3, yy - 6, x - 8, yy - 10, x - 8, yy - 16); c.arc(x, yy - 16, 8, Math.PI, 0); c.bezierCurveTo(x + 8, yy - 10, x + 3, yy - 6, x, yy); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(x - 1.5, yy - 17.5, 2.8, 0, TAU); c.fill();
  c.restore();
}
function drawMap(c, w, h, t) {
  const t_ = T[lang], stripH = 100, areaH = h - stripH;
  const mw = Math.min(w - 12, (areaH - 8) * EU_ASP), mh = mw / EU_ASP, mx = (w - mw) / 2, my = (areaH - mh) / 2 + 2;
  const P = (lon, lat) => [mx + (((lon - LON0) * Math.PI) / 180 / EU_X) * mw, my + ((merc(LAT1) - merc(lat)) / EU_Y) * mh];
  const geo = { polys: {}, dots: {}, caps: {} };
  c.save();
  c.beginPath(); c.roundRect(mx, my, mw, mh, 16); c.clip();
  const sea = c.createLinearGradient(0, my, 0, my + mh); sea.addColorStop(0, '#1c3b6e'); sea.addColorStop(1, '#10264b');
  c.fillStyle = sea; c.fillRect(mx, my, mw, mh);
  c.strokeStyle = 'rgba(150, 175, 230, .1)'; c.lineWidth = 1;
  for (let lat = 40; lat <= 70; lat += 10) { const [, yy] = P(0, lat); c.beginPath(); c.moveTo(mx, yy); c.lineTo(mx + mw, yy); c.stroke(); }
  for (let lon = -10; lon <= 40; lon += 10) { const [xx] = P(lon, 50); c.beginPath(); c.moveTo(xx, my); c.lineTo(xx, my + mh); c.stroke(); }
  c.lineJoin = 'round';
  const trace = (ring, f) => { c.beginPath(); ring.forEach(([lo, la], i) => { const [xx, yy] = f(lo, la); if (i) c.lineTo(xx, yy); else c.moveTo(xx, yy); }); c.closePath(); };
  c.fillStyle = '#2a3856'; c.strokeStyle = '#2a3856'; c.lineWidth = 3;
  DIM.forEach((r) => { trace(r, P); c.fill(); c.stroke(); });
  c.strokeStyle = '#17203a'; c.lineWidth = 1.2; DIM.forEach((r) => { trace(r, P); c.stroke(); });
  const drawCountry = (id, f, rings) => {
    const found = !!S.found[id], base = CCOL[id], sh = S.shake && S.shake.id === id && t - S.shake.t < 0.5 ? Math.sin((t - S.shake.t) * 50) * 3 * (1 - (t - S.shake.t) / 0.5) : 0;
    c.save(); c.translate(sh, 0);
    c.shadowColor = 'rgba(0, 0, 0, .45)'; c.shadowBlur = found ? 10 : 6; c.shadowOffsetY = 2;
    c.fillStyle = found ? mixHex(base, '#ffffff', 0.28) : mixHex(base, '#1a2440', 0.12);
    rings.forEach((r) => { trace(r, f); c.fill(); });
    c.shadowColor = 'transparent';
    c.lineWidth = found ? 2.4 : 1.6; c.strokeStyle = found ? '#ffffff' : '#18203a';
    rings.forEach((r) => { trace(r, f); c.stroke(); });
    if (S.cur === id && S.misses >= 2) { c.strokeStyle = `rgba(255, 255, 255, ${0.5 + 0.5 * Math.sin(t * 7)})`; c.lineWidth = 3; rings.forEach((r) => { trace(r, f); c.stroke(); }); }

    drawCountry(id, P, LAND[id]);
    geo.polys[id] = LAND[id].map((r) => r.map(([lo, la]) => P(lo, la)));
    geo.dots[id] = P(...DOTS[id]); geo.caps[id] = P(...CAPS[id]);
  });
  c.restore();
  c.lineWidth = 2; c.strokeStyle = 'rgba(150, 175, 230, .45)'; c.beginPath(); c.roundRect(mx, my, mw, mh, 16); c.stroke();
  // Japan in its own little box
  const ix = w - 8 - 104, iy = h - 8 - 84, iw = 104, ih = 84, pad = 8;
  const jsc = Math.min((iw - 2 * pad) / JP_X, (ih - 2 * pad) / JP_Y), jx0 = ix + (iw - JP_X * jsc) / 2, jy0 = iy + (ih - JP_Y * jsc) / 2;
  const PJ = (lon, lat) => [jx0 + (((lon - JP_LON0) * Math.PI) / 180) * jsc, jy0 + (merc(JP_LAT1) - merc(lat)) * jsc];
  c.save(); c.beginPath(); c.roundRect(ix, iy, iw, ih, 14); c.clip(); c.fillStyle = sea; c.fillRect(ix, iy, iw, ih);
  drawCountry('jp', PJ, LAND.jp); c.restore();
  c.lineWidth = 2; c.strokeStyle = 'rgba(150, 175, 230, .45)'; c.beginPath(); c.roundRect(ix, iy, iw, ih, 14); c.stroke();
  geo.polys.jp = LAND.jp.map((r) => r.map(([lo, la]) => PJ(lo, la))); geo.dots.jp = PJ(...DOTS.jp); geo.caps.jp = PJ(...CAPS.jp);
  S.capGeo = geo;
  // tap dots on the countries that are still to find

    if (S.found[id]) return;
    const [dx, dy] = geo.dots[id], pulse = 0.5 + 0.5 * Math.sin(t * 3 + dx * 0.05);
    c.fillStyle = `rgba(255, 255, 255, ${0.12 + 0.12 * pulse})`; c.beginPath(); c.arc(dx, dy, 9 + 2 * pulse, 0, TAU); c.fill();

// --- taps on the picture -------------------------------------------------------------------------------------------
function capHit(x, y) {
  const g = S.capGeo; if (!g) return null;
  for (const id of COUNTRY_IDS) if (g.polys[id].some((r) => pip(x, y, r))) return id;
  let best = null, bd = 24;
  for (const id of COUNTRY_IDS) { const [dx, dy] = g.dots[id], dd = Math.hypot(dx - x, dy - y); if (dd < bd) { bd = dd; best = id; } }
  return best;
}
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, mode = modeNow();
  if (mode === 'capital') {
    if (S.cs !== 2 || S.cur === null || S.wait) return;
    const id = capHit(x, y); if (!id || S.found[id]) return;
    if (id === S.cur) {
      S.found[id] = true; S.pins[id] = S.tNow; S.last = T[lang].capitals[id]; S.misses = 0; S.wait = true; sfx.good();
      const prev = S.cur; S.curShown = prev;
      setTimeout(() => { S.wait = false; S.cur = S.order.find((k) => !S.found[k]) ?? null; render(); }, 1100);
    } else { S.misses++; S.shake = { id, t: S.tNow }; sfx.bad(); }
    render();
    return;
  }
  if (mode === 'nepal') { S.gust = 2.4; sfx.click(); return; }
  if (mode !== 'paint' && mode !== 'design') return;
  const g = S.geo; if (!g || !g.kind) return;
  if (mode === 'paint' && (S.pwin || (S.pi === 1 && S.simStage < 2))) return;
  const u = (x - g.fx) / g.fw; if (u < 0 || u > 1) return;
  const v = (y - g.fy - clothDisp(u, g.fh, S.tNow, S.windV).dy) / g.fh; if (v < 0 || v > 1) return;
  if (S.pcol === null) { sfx.bad(); return; }
  const i = regionAt(g.kind, u, v);
  if (mode === 'design') { S.dcolsBy[S.dlay][i] = S.pcol; sfx.click(); render(); return; }
  S.pcols[i] = S.pcol; sfx.click();
  const R = ROUNDS[S.pi];
  if (R.target.every((n, k) => S.pcols[k] === n)) { S.pwin = true; S.pdone[S.pi] = true; S.gust = 2.6; sfx.good(); }
  render();
});

  else if (act === 'sim') { // paint view, round 2: which flag has the same three colours?
    S.simAns = b.dataset.id; S.simStage = 1; (S.simAns === 'fr' ? sfx.good : sfx.bad)();
  } else if (act === 'simgo') { S.simStage = 2; sfx.click(); }

      const ex = `<div class="fl-ex">${t.capEx.map(([e, c, cap, big]) => `<div><span>${e}</span><b>${esc(c)}</b> · ${esc(t.capWord)}: ${esc(cap)} · ${esc(t.bigWord)}: ${esc(big)}</div>`).join('')}</div>`;
      h = `<div class="fl-verd ok">${esc(t.state.capitalDone[0])}</div><p class="fl-txt">${esc(t.exBig)}</p><div class="fl-go"><button class="btn" data-act="cagain">${esc(t.again)}</button></div>`;
      lab.setState({ emo: '🏛️', title: t.state.capitalDone[0], lead: t.state.capitalDone[1], body: '', extra: ex });
    } else {
      h = `<p class="fl-hint">${esc(t.state.capital0[1])}</p>`;
      lab.setState({ emo: '🏛️', title: t.state.capital0[0], lead: t.state.capital0[1], body: '', extra: '' });
      if (id) {
        askEl.style.display = 'flex';
        askEl.innerHTML = S.wait ? `${flagImg(id)}<b>${esc(t.painted(t.countries[id]))}<br>${esc(t.capitalIs(t.capitals[id]))}</b>` : `${flagImg(id)}<b>${esc(t.tapCountry(t.countries[id]))}</b>`;
      }
    }
  }
  $('fCap').innerHTML = h;
}

function renderSecret(t, mode) {
  lab.setGlow('rgba(224, 176, 80, .24)');
  if (mode === 'design') {
    lab.setReadout('✏️', t.layouts[S.dlay], '', '#e0b050');
    $('fSec').innerHTML = `<div class="chips" style="margin-bottom:10px">${LAYS.map((k) => `<button class="chip ${S.dlay === k ? 'on' : ''}" data-act="lay" data-k="${k}">${esc(t.layouts[k])}</button>`).join('')}</div>
      <p class="fl-hint">${esc(t.tapPart)}</p>${potsHtml()}<div class="fl-go">${windBtn(t)}</div>`;
    lab.setState({ emo: '✏️', title: t.secrets.design[0], lead: t.secretA, body: '', extra: '' });
  } else {
    lab.setReadout('🏔️', t.secrets.nepal[1], '', '#e0b050');
    $('fSec').innerHTML = `<div class="fl-go" style="margin-top:0">${windBtn(t)}</div>`;
    lab.setState({ emo: '🏔️', title: t.secrets.nepal[0], lead: t.secretB, body: '', extra: '' });
  }
}

// --- start ---------------------------------------------------------------------------------------------------------
render();
canvasLoop($('cv'), (c, w, h, dt, time) => {
  S.tNow = time;
  S.gust = Math.max(0, S.gust - dt);
  const tgt = S.gust > 0 ? 1.15 : 0.42 + 0.1 * Math.sin(time * 0.7);
  S.windV += (tgt - S.windV) * Math.min(1, dt * 2.5);
  const mode = modeNow();
  if (mode === 'far') drawFar(c, w, h, dt, time);
  else if (mode === 'capital') drawMap(c, w, h, time);
  else drawScene(c, w, h, time);
});
</script>
