function tapHill(id) {

  if (H.task >= 2) { H.named.add(id); H.last = id; sfx.click(); render(); return; }
  if (H.phase === 'found') return;
  H.named.add(id); H.last = id;
  if (id === TARGET[H.task]) { H.found[H.task] = id; H.phase = 'found'; sfx.good(); showStage(); }
  else {
    H.wrong.add(id); H.tries++; sfx.bad();
    if (H.tries >= 2) { H.named.add(TARGET[H.task]); H.found[H.task] = TARGET[H.task]; H.phase = 'found'; showStage(); }
  }
  render();
}

    const nx = S.page + 1, ok = OPTS[nx][+b.dataset.i] === ORDER[nx];
    S.right.push(ok); S.turn = { from: S.page, to: nx, t: 0 }; S.page = nx; S.mode = 'show'; S.verdict = ok ? 'ok' : 'no'; (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next1') {
    if (S.page === ORDER.length - 1) { S.turn = { from: S.page, to: 0, t: 0 }; S.page = 0; S.mode = 'show'; S.verdict = null; S.right = []; }
    else S.mode = 'pick';
    sfx.click();
  } else if (act === 'bin') {
    const card = CARDS[S.ci], ok = b.dataset.b === ANS[card];
    S.ans = b.dataset.b; S.res[S.ci] = ok; S.fly = 0; (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next2') {
    if (S.ci >= 4) { S.ci = 0; S.res = []; } else S.ci++;
    S.ans = null; S.fly = 1; sfx.click();
  } else if (act === 'next3') { S.task++; S.tries = 0; S.phase = 'ask'; S.last = null; S.wrong.clear(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'a') S.years = !S.years; else { S.statue = !S.statue; S.twOn = true; }
    sfx.click();
  } else if (act === 'twins') { S.twOn = !S.twOn; sfx.click(); }
  render();
});
$('yr').addEventListener('input', (ev) => { S.year = 900 - 10 * +ev.target.value; render(); });

// --- one render per change: controls, readout, state card and facts ---------------------------------------------
function render() {
  const v = lab.view;
  document.body.dataset.v = v;
  $('c1').hidden = v !== 'story'; $('c2').hidden = v !== 'sort'; $('c3').hidden = v !== 'hills';
  const t = T[lang];
  if (v === 'story') renderStory(t); else if (v === 'sort') renderSort(t); else renderHills(t);
}
const secChip = (t, k, label, on) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? esc(label) : '🔒 ???'}</button>`;

function renderStory(t) {
  const V = t.v1, n = ORDER.length, last = S.page === n - 1, pick = S.mode === 'pick', k = S.right.filter(Boolean).length;
  lab.setGlow('rgba(224, 170, 90, .26)');
  let html = `<p class="sw-story">${esc(t.pages[S.page].txt)}</p>`;
  if (pick) {
    html += `<div class="sw-ask">${esc(V.ask)}</div><div class="sw-opts">${OPTS[S.page + 1].map((key, i) =>
      `<button class="sw-opt" data-act="pick" data-i="${i}" aria-label="${esc(t.pages[ORDER.indexOf(key)].cap)}"><canvas width="200" height="150" data-k="${key}"></canvas><span>${esc(t.pages[ORDER.indexOf(key)].cap)}</span></button>`).join('')}</div>`;
  } else html += `<div class="sw-row"><button class="btn" data-act="next1">${last ? '↺ ' + esc(V.again) : esc(V.next) + ' →'}</button></div>`;
  $('c1').innerHTML = html;
  $('c1').querySelectorAll('canvas[data-k]').forEach((cv) => cv.getContext('2d').drawImage(cardImg(cv.dataset.k), 0, 0, 200, 150));
  lab.setReadout(`${S.page + 1}/${n}`, V.word, S.right.length ? `✓ ${k}` : '', '#e0aa5a');
  let st;
  if (pick) st = { emo: '🤔', title: V.ask, lead: V.askLead };
  else if (S.verdict === 'ok') st = { emo: '✅', title: V.okT, lead: V.okL, body: last ? V.endL(k) : '' };
  else if (S.verdict === 'no') st = { emo: '📖', title: V.noT, lead: V.noL, body: last ? V.endL(k) : '' };
  else st = { emo: '📖', title: V.startT, lead: V.startL };
  lab.setState({ body: '', ...st });
  lab.setFacts(t.f1);
}

function renderSort(t) {
  const V = t.v2, end = S.ci >= 4, k = S.res.filter(Boolean).length, card = end ? null : V.cards[S.ci], answered = S.ans !== null;
  lab.setGlow('rgba(201, 138, 88, .26)');
  let html = '';
  if (S.statue) {
    html = `<div class="sw-row"><button class="btn" data-act="twins">${esc(S.twOn ? t.st.on : t.st.off)}</button></div>`;
  } else if (end) html = `<div class="sw-row"><button class="btn" data-act="next2">↺ ${esc(V.again)}</button></div>`;
  else {
    html = `<p class="sw-story">${esc(card.txt)}</p>`;
    if (!answered) html += `<div class="sw-bins">${[['story', '📖', V.bins[0]], ['real', '⛏️', V.bins[1]]].map(([id, e, l]) => `<button class="sw-bin" data-act="bin" data-b="${id}"><span class="e">${e}</span>${esc(l)}</button>`).join('')}</div>`;
    else html += `<div class="sw-row"><button class="btn" data-act="next2">${esc(V.next)} →</button></div>`;
  }
  html += `<div class="sw-row">${secChip(t, 'b', t.st.chip, S.statue)}</div>`;
  $('c2').innerHTML = html;
  const dots = CARDS.map((_, i) => (i < S.ci || (i === S.ci && answered) ? '●' : i === S.ci ? '◉' : '○')).join(' ');
  lab.setReadout(end ? `${k}/4` : `${Math.min(S.ci + 1, 4)}/4`, dots, S.res.length ? `✓ ${k}` : '', '#c98a58');
  let st, facts = t.f2;
  if (S.statue) {
    st = S.twOn ? { emo: '🐺', title: t.st.t0, lead: t.st.l0, body: '' } : { emo: '🔍', title: t.st.t1, lead: t.st.l1, body: t.st.b1 };
    facts = t.f2st;
  } else if (end) { st = { emo: '🏆', title: V.endT(k), lead: V.endL, body: '' }; facts = [...t.f2, t.f2end]; }
  else if (!answered) st = { emo: '🤔', title: V.q, lead: V.qLead, body: '' };
  else {
    const ok = S.res[S.ci]; st = { emo: ok ? '✅' : '🤔', title: ok ? t.right : V.no, lead: card.line, body: '' };
  }
  lab.setState(st);
  lab.setFacts(S.statue || end ? facts : t.f2);
}

function renderHills(t) {
  const V = t.v3, hn = t.hills;
  lab.setGlow('rgba(110, 160, 80, .26)');
  $('c3years').hidden = !S.years;
  $('yr').value = String((900 - S.year) / 10);
  $('yrV').textContent = t.yr.fmt(S.year);
  let html = '';
  if (!S.years && S.task < 2 && S.phase === 'found') html += `<div class="sw-row"><button class="btn" data-act="next3">${esc(V.next)} →</button></div>`;
  html += `<div class="sw-row">${secChip(t, 'a', t.yr.chip, S.years)}</div>`;
  $('c3main').innerHTML = html;
  let st, facts = t.f3;
  if (S.years) {
    const y = S.year, b = y >= 740 ? t.yr.a : y > 390 ? t.yr.b : t.yr.c;
    lab.setReadout(t.yr.fmt(y), t.yr.word, '', '#e0aa5a');
    st = { emo: y >= 740 ? '🛖' : '🧱', title: b[0], lead: b[1], body: t.yr.body }; facts = t.f3yr;
  } else {
    lab.setReadout(`${S.named.size}/7`, V.word, '', '#8fb85a');
    if (S.task >= 2) {
      const all = S.named.size >= 7;
      st = S.last ? { emo: '🧭', title: hn[S.last], lead: S.last === 'cap' ? V.capLine : V.plain, body: all ? V.allL : V.exL } : { emo: '🧭', title: V.exT, lead: V.exL, body: '' };
      if (all && !S.last) st = { emo: '⛰️', title: V.allT, lead: V.allL, body: '' };
    } else if (S.phase === 'found') {
      const id = TARGET[S.task], first = S.tries === 0;
      st = { emo: '✅', title: first ? t.right : V.foundT(hn[id]), lead: (S.task === 0 ? V.found1 : V.found2)(hn[id]), body: '' };
    } else if (S.last && S.wrong.has(S.last) && S.tries > 0) st = { emo: '🤔', title: V.wrongT(hn[S.last]), lead: V.wrongL, body: S.task === 0 ? V.c1 : V.c2 };
    else st = { emo: '🏛️', title: S.task === 0 ? V.t1 : V.t2, lead: S.task === 0 ? V.c1 : V.c2, body: V.hint };
  }
  lab.setState(st);
  lab.setFacts(facts);
}
render();
</script>
