// --- taps ----------------------------------------------------------------------------------------------------
function showStage() {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function pick(id) {
  const v = lab.view;
  if (!IDS[v].includes(id)) return;
  if (v === 'tide') { S.sel = S.sel === id ? null : id; sfx.tick(); }
  else if (v === 'waves') { const A = V.waves; if (A.wt >= 0 || A.done) return; S.wash[id] = !S.wash[id]; sfx.tick(); }
  else { if (S.dRan) return; S.eat[id] = !S.eat[id]; sfx.tick(); }
  render();
}
$('cv').addEventListener('click', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.s, y = (ev.clientY - r.top - G.oy) / G.s;
  let best = null, bd = 1e9;
  for (const q of HIT) { const dd = Math.hypot(q.x - x, q.y - y); if (dd < q.r && dd < bd) { best = q; bd = dd; } }
  if (best) pick(best.id);
});
function markRan() { if (!S.ran) { S.ran = true; S.sel = null; } }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'pick') return pick(b.dataset.id);
  if (act === 'guess') { if (S.sel && !S.ran) { S.pred[S.sel] = b.dataset.g; sfx.click(); render(); } return; }
  if (act === 'tide') {
    const A = V.tide, ph = phaseOf('tide');
    if (!S.ran && !Object.keys(S.pred).length) return;
    if (ph === 'high') { markRan(); S.tgt = 1; } else if (ph === 'low') S.tgt = 0; else return;
    sfx.click(); render(); return;
  }
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const A = V.tide;
    if (b.dataset.k === 'day') {
      if (S.day) { S.day = null; S.tgt = A.tide > 0.5 ? 1 : 0; } else { markRan(); S.hot = false; S.day = { u: 0, b: 0, from: A.tide }; }
    } else {
      S.hot = !S.hot; S.day = null;
      if (S.hot) { markRan(); if (A.tide < 0.5 || S.tgt === 0) S.tgt = 1; }
    }
    sfx.click(); render(); return;
  }
  if (act === 'wave') {
    const A = V.waves;
    if (A.done) { A.done = false; A.wt = -1; S.wash = {}; sfx.click(); render(); return; }
    if (A.wt >= 0) return;
    A.wt = 0; sfx.push(); render(); return;
  }
  if (act === 'dinner') {
    const ph = phaseOf('dinner');
    if (ph === 'low') { S.dRan = true; S.dTgt = 0; } else if (ph === 'high') S.dTgt = 1; else return;
    sfx.click(); render();
  }
});

// --- controls, readout and state card (one render per change) -----------------------------------------------------
function render() {
  const v = lab.view, t = T[lang];
  document.body.dataset.v = v;
  const gg = t.tide.gauge; lab.setGauge(lastGauge < 0 ? 1 : lastGauge, [{ f: 0, label: gg[2] }, { f: 1, label: gg[1] }], gg[0]);
  if (v === 'tide') renderTide(t); else if (v === 'waves') renderWaves(t); else renderDinner(t);
}

function renderTide(t) {
  const A = V.tide, ph = phaseOf('tide'), n = Object.keys(S.pred).length, tt = t.tide, open = secret.unlocked();
  lab.setGlow('rgba(60, 150, 190, .26)');
  const dayOn = !!S.day, moving = ph === 'out' || ph === 'inn';
  const chips = IDS.tide.map((id) => {
    const m = S.pred[id], rev = S.revT && m, ok = rev && m === TRUTH_TIDE[id];
    return `<button class="chip rp-c ${S.sel === id ? 'on' : ''}" data-act="pick" data-id="${id}">${rev ? (ok ? '✅ ' : '❌ ') : ''}${esc(t.an[id])}${m && !S.revT ? esc(` · ${t.acts[m]}`) : ''}</button>`;
  }).join('');
  const opts = S.sel && !S.ran ? `<div class="row2"><span class="lbl">${esc(tt.what(t.an[S.sel]))}</span><div class="chips">${['close', 'hold', 'hide', 'swim'].map((g) => `<button class="chip rp-c ${S.pred[S.sel] === g ? 'on' : ''}" data-act="guess" data-g="${g}">${esc(t.acts[g])}</button>`).join('')}</div></div>` : '';
  const sc = (k, emo, on) => `<button class="chip secret rp-c ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  const label = ph === 'low' ? tt.inn : tt.out, dis = dayOn || moving || (!S.ran && !n);
  $('rpCtl').innerHTML = `<div class="row2"><span class="lbl">${esc(tt.who)}</span><div class="chips">${chips}</div></div>${opts}
    <div class="row2"><button class="btn rp-btn" data-act="tide"${dis ? ' disabled' : ''}>${esc(label)}</button>${sc('day', '🕐', dayOn)}${sc('hot', '☀️', S.hot)}</div>`;
  // state card
  let st, extra = '';
  const rows = IDS.tide.filter((id) => S.pred[id]).map((id) => t.row(t.an[id], t.acts[S.pred[id]], t.did[TRUTH_TIDE[id]], S.pred[id] === TRUTH_TIDE[id]));
  const k = IDS.tide.filter((id) => S.pred[id] === TRUTH_TIDE[id]).length;
  if (dayOn) st = tt.day(S.day.u >= 0.75 ? 2 : S.day.u >= 0.25 ? 1 : 0);

  else if (S.sel && !S.ran) st = tt.sSel(t.an[S.sel]);

    if (n) { st = [k === n ? '✅' : '🤔', k === n ? tt.rights : tt.some(k, n), st[2]]; extra = listRows(rows); }
  }

  const lows = dayOn ? (S.day.u >= 0.75 ? 2 : S.day.u >= 0.25 ? 1 : 0) : 0;
