function clipTool(c, x, y, len, a = 1) { // a silver paper clip, x = left edge, y = centre

// --- the snake ---------------------------------------------------------------------------------------------
function drawSnake(c, x0, yc, cam, th, t) {
  const N = 64, P = [], len = 60 * cam;
  const bw = (u) => th * (u < .5 ? 1 : Math.max(.1, 1 - .9 * Math.pow((u - .5) / .5, 1.5)));
  for (let i = 0; i <= N; i++) {
    const u = i / N, e = Math.pow(cl((u - .12) / .88), 1.2);
    P.push({ x: x0 + u * len, y: yc + th * .55 * e * Math.sin(u * 7.2 - t * 1.3), w: bw(u) });
  }
  const run = (dyk, wk, style, al = 1) => {
    c.save(); c.globalAlpha = al; c.strokeStyle = style; c.lineCap = 'round'; c.lineJoin = 'round';
    for (let i = 0; i < N; i++) {
      const a = P[i], b = P[i + 1], w = (a.w + b.w) / 2, dy = dyk * w;
      c.lineWidth = Math.max(.8, w * wk); c.beginPath(); c.moveTo(a.x, a.y + dy); c.lineTo(b.x, b.y + dy); c.stroke();
    }
    c.restore();
  };
  // shadow on the sand, dark rim, body, belly, shine
  c.save(); c.translate(0, th * .5); run(0, .95, 'rgba(90,60,20,.24)'); c.restore();
  c.save(); c.lineCap = 'round';
  const rim = (wk) => { for (let i = 0; i < N; i++) { const a = P[i], b = P[i + 1]; c.lineWidth = (a.w + b.w) / 2 * wk + 3.4; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); } };
  c.strokeStyle = '#2F7D33'; rim(1); c.restore();
  const g = c.createLinearGradient(0, yc - th * 1.1, 0, yc + th * 1.1); g.addColorStop(0, '#7ED957'); g.addColorStop(1, '#3E9E44');
  run(0, 1, g);
  run(.27, .33, '#D7F5A8', .9);
  run(-.26, .13, 'rgba(255,255,255,.32)');
  // diamond spots
  c.fillStyle = '#2F7D33';
  for (let cm = 9; cm <= 55; cm += 3.6) {
    const i = Math.round(cm / 60 * N), p = P[i], hw = Math.min(cam * 1.15, p.w * .55), hh = p.w * .27;
    if (p.w < th * .4) continue;

    c.strokeStyle = '#E8475A'; c.lineWidth = Math.max(2, th * .09); c.lineCap = 'round';
    c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, sy); c.stroke();

  }
  // head
  const rx = th * .98, ry = th * .8;
  c.save();
  c.beginPath(); c.ellipse(hx, hy, R(rx), R(ry), 0, 0, 7);
  const hg = c.createRadialGradient(hx - th * .3, hy - th * .4, th * .1, hx, hy, th * 1.3); hg.addColorStop(0, '#A4EE7C'); hg.addColorStop(.55, '#7ED957'); hg.addColorStop(1, '#3E9E44');
  c.fillStyle = hg; c.fill(); c.clip();
  c.fillStyle = 'rgba(215,245,168,.9)'; c.beginPath(); c.ellipse(hx + th * .05, hy + th * .62, R(rx * .85), R(th * .3), 0, 0, 7); c.fill();
  c.restore();
  c.beginPath(); c.ellipse(hx, hy, R(rx), R(ry), 0, 0, 7); c.lineWidth = 2.2; c.strokeStyle = '#2F7D33'; c.stroke();
  c.fillStyle = 'rgba(232,71,90,.28)'; c.beginPath(); c.ellipse(hx + th * .12, hy + th * .2, R(th * .17), R(th * .1), 0, 0, 7); c.fill();

    c.fillStyle = '#1B2A1E'; c.beginPath(); c.arc(x + th * .06, y + th * .02, R(th * .15), 0, 7); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(x + th * .1, y - th * .04, R(th * .055), 0, 7); c.fill();
  });

}

// --- scene 1: the snake and its three rulers -----------------------------------------------------------------
function sceneSnake(c, w, h, dt, t) {
  const s = S.sn, qi = s.q, a = s.a[qi];
  let mode = null, el = 0, al = 1;
  if (a !== null) { mode = qi === 0 ? 'r1' : 'r2'; el = Math.max(0, t - s.t0[qi]); }
  else if (s.leave) { mode = s.leave.mode; el = 99; al = 1 - seg(t, s.leave.t, s.leave.t + .4); if (al <= 0) s.leave = null; }
  const base = w * .85 / 60, zo = w * .9 / 100;
  const target = mode === 'r1' && el >= 3.6 && al === 1 ? zo : base;
  const yT = mode ? h * .21 : h * .4;
  if (!s.cam) { s.cam = base; s.yc = yT; }
  const sm = 1 - Math.exp(-dt * 5); s.cam += (target - s.cam) * sm; s.yc += (yT - s.yc) * sm;
  const cam = s.cam, zf = cl((base - cam) / (base - zo)), x0 = w * (.075 - .025 * zf), th = 5.5 * cam, yc = s.yc;
  const u = T[lang].s.units;
  ground(c, w, h);
  c.save(); c.globalAlpha = al;
  if (mode === 'r1') {
    const yC = h * .42, yP = h * .6, yS = h * .8, hs = Math.min(h * .075, 30);
    const cl3 = 3 * cam, hh = Math.max(6, cl3 * .54);
    for (let i = 0; i < 20; i++) { // 20 paper clips, 3 cm each
      const st = .2 + i * .07, p = seg(el, st, st + .4); if (p <= 0) continue;
      c.fillStyle = `rgba(70,45,10,${.2 * p})`; c.beginPath(); c.ellipse(x0 + i * cl3 + cl3 / 2, yC + hh / 2 + 2, R(cl3 * .42), 2.5, 0, 0, 7); c.fill();
      clipTool(c, x0 + i * cl3, yC - (1 - bounce(p)) * h * .1, cl3 * .94, cl(p * 4));
    }
    const nC = Math.max(0, Math.min(20, Math.floor((el - .42) / .07) + 1));
    if (nC > 0) pill(c, `${nC} ${u.clips}`, x0, yC - hh / 2 - 15, { align: 'left' });
    const pl = 15 * cam, pth = Math.max(9, pl * .27);
    for (let j = 0; j < 4; j++) { // 4 pencils, 15 cm each
      const st = 2.1 + j * .35, p = seg(el, st, st + .5); if (p <= 0) continue;
      pencilTool(c, x0 + j * pl, yP - (1 - bounce(p)) * h * .12, pl * .985, cl(p * 4));
    }
    const nP = Math.max(0, Math.min(4, Math.floor((el - 2.4) / .35) + 1));
    if (nP > 0) pill(c, `${nP} ${u.pencils}`, x0, yP - pth / 2 - 15, { align: 'left' });
    const sp = seg(el, 3.8, 4.5);
    if (sp > 0) stickTool(c, w, x0 - (1 - out3(sp)) * w * .3, yS, cam, hs, 0, sp, false);
    const pp = seg(el, 4.6, 5.1);
    if (pp > 0) { // pin at 0.6
      const px = x0 + 60 * cam, py = yS - hs / 2 - (1 - bounce(pp)) * 30;
      c.save(); c.globalAlpha = cl(pp * 4); c.beginPath(); c.moveTo(px, py - 1); c.bezierCurveTo(px - 12, py - 12, px - 8, py - 26, px, py - 26); c.bezierCurveTo(px + 8, py - 26, px + 12, py - 12, px, py - 1);
      c.fillStyle = '#FFC94A'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#1D2447'; c.stroke(); c.fillStyle = '#1D2447'; c.beginPath(); c.arc(px, py - 15, 3.2, 0, 7); c.fill(); c.restore();
      if (pp > .8) pill(c, `${loc('0.6')} ${u.m}`, px, py - 42, { clampW: w });
    }
  } else if (mode === 'r2') {
    const yS = h * .62, hs = Math.min(h * .11, 46), sp = seg(el, .05, .7), tk = seg(el, .6, 1.4), yb = yS - hs / 2 - 24;
    const xt = x0 + 60 * cam, gp = seg(el, 1.2, 1.7);
    if (gp > 0) { // dashed guides from the snake down to the bracket
      c.save(); c.globalAlpha = al * gp; c.setLineDash([5, 5]); c.strokeStyle = 'rgba(60,40,10,.55)'; c.lineWidth = 1.6;
      c.beginPath(); c.moveTo(x0, yc + th * .8); c.lineTo(x0, yb + 6); c.moveTo(xt, yc + th * .6); c.lineTo(xt, yb + 6); c.stroke(); c.restore();
    }
    if (sp > 0) stickTool(c, w, x0 - (1 - out3(sp)) * w * .3, yS, cam, hs, tk, sp, true);
    const pb = seg(el, 1.3, 2.0);
    if (pb > 0) {
      const ex = x0 + (xt - x0) * out3(pb);
      c.strokeStyle = '#3E2A0C'; c.lineWidth = 2.6; c.lineCap = 'round';
      c.beginPath(); c.moveTo(x0, yb); c.lineTo(ex, yb); c.moveTo(x0, yb - 7); c.lineTo(x0, yb + 7); c.moveTo(ex, yb - 7); c.lineTo(ex, yb + 7); c.stroke();
      if (pb > .8) pill(c, `60 ${u.cm}`, (x0 + xt) / 2, yb - 20, { fs: 16, clampW: w });

// --- secret 1: a table measured in feet ----------------------------------------------------------------------
function foot(c, x, y, L, col, flip, a, sc) { // heel at x, toes to the right; L = length in px

  const sq = io(seg(p, 0, .3)), mq = io(seg(p, .3, .8)), bp = back(seg(p, .6, .95)), fadeSmall = 1 - seg(p, .55, .85);

    const x = lerp(lerp(gx, rx, sq), 218 + (j - 4.5) * 3, mq), y = lerp(gy, ry, sq);

function pictureFor(c, r, p) {
  const UL = U(), half = loc('0.5');
  if (r.pic === 'bars') drawBars(c, [0, 1, 2].map(() => ({ tens: 10, l0: `1 ${UL.m}`, l1: `100 ${UL.cm}`, skin: 'bar' })), p);
  else if (r.pic === 'bars2') drawBars(c, [{ tens: 10, l0: `1 ${UL.m}`, l1: `100 ${UL.cm}`, skin: 'bar' }, { tens: 10, l0: `1 ${UL.m}`, l1: `100 ${UL.cm}`, skin: 'bar' }, { tens: 3, l0: `30 ${UL.cm}`, l1: `30 ${UL.cm}`, skin: 'bar' }], p);
  else if (r.pic === 'roads') drawBars(c, [0, 1, 2].map(() => ({ tens: 10, l0: `1 ${UL.km}`, l1: `1000 ${UL.m}`, skin: 'road' })).concat([{ tens: 5, l0: `${half} ${UL.km}`, l1: `500 ${UL.m}`, skin: 'road' }]), p);
  else if (r.pic === 'clocks') drawClocks(c, p);

function sceneMachine(c, w, h, dt, t) {
  panel(c, w, h);
  const m = S.ma, r = MA[m.i], el = m.a === null ? -1 : Math.max(0, t - m.t0), ein = io(seg(t, m.tIn, m.tIn + .5));
  const env = el < 0 ? 0 : seg(el, .6, .9) * (1 - seg(el, 2.1, 2.5));
  m.rot += dt * (.7 + 9 * env);
  const shake = Math.sin(el * 70) * 2.4 * env;
  virt(c, w, h, 375, 410, () => {
    // the picture below the machine: before the answer it shows the input, after it the bigger unit breaking up (or the small ones merging)
    c.save(); c.globalAlpha = ein; c.translate(0, (1 - ein) * 16); pictureFor(c, r, el < 0 ? 0 : io(seg(el, 2, 3.5))); c.restore();
    c.translate(-30, 0); // the machine sits left of centre, its tray on the right
    c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(155, 232, 108, 9, 0, 0, 7); c.fill();
    // tray and output card (behind the body: the card slides out of the slot)
    const outTxt = `${loc(r.opts[r.ok])} ${U()[r.out]}`, ow = el < 0 ? 84 : cardW(c, outTxt), ox = 260 + ow / 2;
    rr(c, 252, 216, ow + 16, 10, 4); const tg = c.createLinearGradient(0, 216, 0, 226); tg.addColorStop(0, '#5562CC'); tg.addColorStop(1, '#343E96'); c.fillStyle = tg; c.fill();
    if (el < 0) { c.save(); c.setLineDash([6, 5]); c.lineWidth = 2; c.strokeStyle = 'rgba(200,210,255,.55)'; rr(c, 260, 168, ow, 48, 10); c.stroke(); c.restore(); txt(c, '?', ox, 192, 26, 'rgba(200,210,255,.75)', 'center', 900); }
    else { const op = out3(seg(el, 2.3, 3.1)); if (op > 0) numCard(c, lerp(ox - 100, ox, op), 192, outTxt, 1, 1, '#7ED957'); }
    // machine body
    c.save(); c.translate(shake, 0);
    const bx = 60, by = 84, bw = 190, bh = 140;
    c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 24; c.shadowOffsetY = 12;
    let g = c.createLinearGradient(bx, by, bx + bw, by + bh); g.addColorStop(0, '#8793EE'); g.addColorStop(.45, '#6C7AE0'); g.addColorStop(1, '#4C59C0');
    rr(c, bx, by, bw, bh, 24); c.fillStyle = g; c.fill(); c.restore();
    rr(c, bx, by, bw, bh, 24); c.lineWidth = 2.2; c.strokeStyle = '#3A459E'; c.stroke();
    g = c.createLinearGradient(0, by, 0, by + bh * .3); g.addColorStop(0, 'rgba(255,255,255,.3)'); g.addColorStop(1, 'rgba(255,255,255,0)'); rr(c, bx + 6, by + 5, bw - 12, bh * .3, 18); c.fillStyle = g; c.fill();
    rr(c, bx + 10, by + bh - 4, 38, 12, 5); c.fillStyle = '#343E96'; c.fill(); rr(c, bx + bw - 48, by + bh - 4, 38, 12, 5); c.fill();
    rr(c, bx + bw - 12, 166, 18, 50, 7); c.fillStyle = '#1B2050'; c.fill();
    [[bx + 15, by + 15], [bx + bw - 15, by + 15], [bx + 15, by + bh - 15], [bx + bw - 15, by + bh - 15]].forEach(([x, y]) => {
      const rg = c.createRadialGradient(x - 1.5, y - 1.5, .5, x, y, 5.5); rg.addColorStop(0, '#EEF1FF'); rg.addColorStop(1, '#5663C8'); c.beginPath(); c.arc(x, y, 5, 0, 7); c.fillStyle = rg; c.fill(); c.lineWidth = .8; c.strokeStyle = '#3A459E'; c.stroke();
    });
    // window with two turning gears
    const wx = 80, wy = 104, ww = 108, wh = 84;
    rr(c, wx - 4, wy - 4, ww + 8, wh + 8, 17); c.fillStyle = '#3A459E'; c.fill();
    g = c.createLinearGradient(0, wy, 0, wy + wh); g.addColorStop(0, '#1A2050'); g.addColorStop(1, '#2C3478'); rr(c, wx, wy, ww, wh, 13); c.fillStyle = g; c.fill();
    c.save(); rr(c, wx, wy, ww, wh, 13); c.clip();
    gear(c, 118, 150, 26, 10, m.rot, '#FFC94A', '#B7791F'); gear(c, 166, 136, 18, 8, -m.rot * 10 / 8 + Math.PI / 8, '#C9D1DE', '#6B7389');
    g = c.createLinearGradient(wx, wy, wx + ww, wy + wh); g.addColorStop(0, 'rgba(255,255,255,.22)'); g.addColorStop(.4, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(wx, wy, ww, wh);
    c.restore();
    // stamp
    const sp = seg(el, 2.2, 2.6);
    if (sp > 0) {
      c.save(); c.translate(222, 130); c.rotate(-.16); c.scale(R(back(sp)), R(back(sp)));
      c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 8; c.shadowOffsetY = 3; c.beginPath(); c.arc(0, 0, 28, 0, 7); c.fillStyle = '#E8475A'; c.fill(); c.restore();
      c.save(); c.translate(222, 130); c.rotate(-.16); c.scale(R(back(sp)), R(back(sp)));
      c.beginPath(); c.arc(0, 0, 28, 0, 7); c.lineWidth = 2; c.strokeStyle = '#fff'; c.stroke(); c.beginPath(); c.arc(0, 0, 23, 0, 7); c.setLineDash([3, 3]); c.lineWidth = 1.2; c.strokeStyle = 'rgba(255,255,255,.7)'; c.stroke(); c.restore();
      c.save(); c.translate(222, 130); c.rotate(-.16); c.scale(R(back(sp)), R(back(sp))); txt(c, r.stamp, 0, 1, r.stamp.length > 4 ? 15 : 18, '#fff', 'center', 900); c.restore();
    }
    // funnel with the input card dropping into it
    c.fillStyle = '#343E96'; c.beginPath(); c.ellipse(155, 46, 49, 10, 0, 0, 7); c.fill();
    const fall = seg(el, 0, .8), inT = r.inn();
    if (el < .85) numCard(c, 155, lerp(28 + Math.sin(t * 2.2) * (el < 0 ? 2.5 : 0), 74, io(fall)), inT, lerp(1, .42, io(fall)), 1 - seg(fall, .85, 1), '#6C7AE0');
    g = c.createLinearGradient(107, 46, 203, 88); g.addColorStop(0, '#95A0F4'); g.addColorStop(1, '#5562CC');
    c.beginPath(); c.moveTo(105, 46); c.lineTo(205, 46); c.lineTo(177, 90); c.lineTo(133, 90); c.closePath(); c.fillStyle = g; c.fill(); c.lineWidth = 2; c.strokeStyle = '#3A459E'; c.stroke();
    c.beginPath(); c.ellipse(155, 46, 50, 10, 0, 0, Math.PI); c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.35)'; c.stroke();
    c.beginPath(); c.ellipse(155, 46, 50, 10, 0, 0, 7); c.lineWidth = 2; c.strokeStyle = '#3A459E'; c.stroke();
    c.restore();
  });
}

// --- the draw loop: one function per picture ---------------------------------------------------------------
function tickDone(t) {
  const v = lab.view; let ch = false;
  if (v === 'snake' && !S.sec) { const s = S.sn, qi = s.q; if (s.a[qi] !== null && !s.done[qi] && t - s.t0[qi] > DUR.sn[qi]) { s.done[qi] = true; ch = true; } }
  else if (v === 'choose') { const m = S.ch; if (m.a !== null && !m.done && t - m.t0 > DUR.ch) { m.done = true; ch = true; } }
  else if (v === 'machine') { const m = S.ma; if (m.a !== null && !m.done && t - m.t0 > DUR.ma) { m.done = true; ch = true; } }
  if (ch) render();
}
let lastRead = '';
function updateReadout(t) {
  const v = lab.view, T_ = T[lang]; let val = '?', sub = '', col = '#7ED957';
  if (v === 'snake') {
    if (S.sec === 'feet') { const n = S.feet.king ? 4 : 7; val = `${T_.sec[S.feet.king ? 'king' : 'child']}: ${n}`; col = '#E8475A'; }
    else if (S.sec === 'km') { val = `${Math.round(cl((t - S.km.t0) / WALK) * 12)} ${U().min}`; sub = `1 ${U().km}`; }
    else {
      const s = S.sn, qi = s.q, a = s.a[qi], u = T_.s.units, el = a === null ? -1 : t - s.t0[qi];
      if (qi === 0) {
        if (a !== null) {
          const nC = Math.max(0, Math.min(20, Math.floor((el - .42) / .07) + 1)), nP = Math.max(0, Math.min(4, Math.floor((el - 2.4) / .35) + 1)), parts = [];
          if (nC > 0) parts.push(`${nC} ${u.clips}`); if (nP > 0) parts.push(`${nP} ${u.pencils}`); if (el >= 4.9) parts.push(`${loc('0.6')} ${u.m}`);
          val = parts.length ? parts.join(' · ') : '…';
        }
      } else val = a !== null && el >= 1.9 ? `60 ${u.cm}` : `? ${u.cm}`;
    }
  } else if (v === 'choose') {
    col = '#FFC94A'; const m = S.ch, el = m.a === null ? -1 : t - m.t0;
    if (m.a === null) val = `${m.i + 1} / ${CH.length}`; else { val = el > .6 ? T_.c.real[m.i] : '…'; sub = `${m.i + 1} / ${CH.length}`; }
  } else {
    col = '#6C7AE0'; const m = S.ma, r = MA[m.i], el = m.a === null ? -1 : t - m.t0;
    if (m.a !== null) val = el > 2.7 ? `${r.inn()} = ${loc(r.opts[r.ok])} ${U()[r.out]}` : '…';
    sub = `${m.i + 1} / ${MA.length}`;
  }
  const key = `${v}|${val}|${sub}`; if (key === lastRead) return; lastRead = key;
  lab.setReadout(esc(val), sub, '', col);
}
canvasLoop($('cv'), (c, w, h, dt, t) => {
  tickDone(t); updateReadout(t);
  const v = lab.view;
  if (v === 'snake') (S.sec === 'feet' ? sceneFeet : S.sec === 'km' ? sceneKm : sceneSnake)(c, w, h, dt, t);
  else if (v === 'choose') sceneChoose(c, w, h, dt, t); else sceneMachine(c, w, h, dt, t);
});

// --- controls -----------------------------------------------------------------------------------------------
const showStage = () => { // on a phone the controls sit below the picture: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function pick(j) {
  const v = lab.view, t = nowS(); let ok;
  if (v === 'snake') { const s = S.sn; if (s.a[s.q] !== null) return; s.a[s.q] = j; s.t0[s.q] = t; s.first = true; ok = j === SN_OK[s.q]; }
  else if (v === 'choose') { const m = S.ch; if (m.a !== null) return; m.a = j; m.t0 = t; m.first = true; ok = j === CH[m.i].ok; m.res[m.i] = ok; }
  else { const m = S.ma; if (m.a !== null) return; m.a = j; m.t0 = t; m.first = true; ok = j === MA[m.i].ok; m.res[m.i] = ok; }
  (ok ? sfx.good : sfx.bad)(); showStage();
}
function next() {
  const v = lab.view, t = nowS(); sfx.click();
  if (v === 'snake') {
    const s = S.sn; s.leave = { mode: s.q === 0 ? 'r1' : 'r2', t };
    if (s.q === 0) s.q = 1; else { s.q = 0; s.a = [null, null]; s.done = [false, false]; }
  } else if (v === 'choose') {
    const m = S.ch; if (m.i >= CH.length - 1) { m.i = 0; m.res = []; } else m.i++; m.a = null; m.done = false; m.tIn = t;
  } else {
    const m = S.ma; if (m.i >= MA.length - 1) { m.i = 0; m.res = []; } else m.i++; m.a = null; m.done = false; m.tIn = t;
  }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'pick') pick(+b.dataset.j);
  else if (act === 'next') next();
  else if (act === 'swap') { S.feet.king = !S.feet.king; S.feet.t0 = nowS(); sfx.click(); }
  else if (act === 'again') { S.km.t0 = nowS(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; sfx.click();
    if (S.sec === 'feet') S.feet.t0 = nowS(); else if (S.sec === 'km') S.km.t0 = nowS();
  }
  render();
});
$('stage').addEventListener('pointerdown', () => { // a tap on the picture skips the animation
  const v = lab.view;
  if (v === 'snake' && !S.sec) { const s = S.sn; if (s.a[s.q] !== null && !s.done[s.q]) s.t0[s.q] -= 10; }
  else if (v === 'choose' && S.ch.a !== null && !S.ch.done) S.ch.t0 -= 10;
  else if (v === 'machine' && S.ma.a !== null && !S.ma.done) S.ma.t0 -= 10;
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
const optBtn = (j, label, a, ok, icon = '') => {
  const cls = a === null ? '' : j === ok ? 'good' : j === a ? 'bad' : 'dim';
  return `<button class="qb ${cls}" data-act="pick" data-j="${j}"${a === null ? '' : ' disabled'}>${icon}<span>${esc(label)}</span></button>`;
};
const verdictHtml = (t, ok, lines, last) =>
  `<div class="vd"><div class="vt ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.wrong)}</div>${lines.map((l) => `<p>${esc(l)}</p>`).join('')}<button class="btn" data-act="next">${esc(last ? t.again : t.next)}</button></div>`;
function render() {
  const t = T[lang], v = lab.view; document.body.dataset.v = v;
  let html = '', st, first;
  if (v === 'snake') {
    const s = S.sn, open = secret.unlocked();
    const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    if (S.sec === 'feet') html = `<p class="hint">${esc(t.secrets.feet[1])}</p><button class="btn" data-act="swap">${esc(t.sec.swap)}</button>`;
    else if (S.sec === 'km') html = `<p class="hint">${esc(t.secrets.km[1])}</p><button class="btn" data-act="again">${esc(t.again)}</button>`;
    else {
      const qi = s.q, a = s.a[qi], q = qi === 0 ? t.s.q1 : t.s.q2, o = qi === 0 ? t.s.o1 : t.s.o2, ico = qi === 0 ? ['📎 ', '✏️ ', '📏 '] : ['', '', ''];
      html = `<div class="q">${esc(q)}</div><div class="qopts">${o.map((x, j) => optBtn(j, ico[j] + x, a, SN_OK[qi])).join('')}</div>`;
      if (a !== null && s.done[qi]) html += verdictHtml(t, a === SN_OK[qi], [qi === 0 ? t.s.r1 : t.s.r2], qi === 1);
    }
    html += `<div class="row2"><div class="chips">${chip('feet', '🦶')}${chip('km', '🏟️')}</div></div>`;
    if (S.sec) { const k = t.secrets[S.sec]; st = { emo: S.sec === 'feet' ? '🦶' : '🏟️', title: k[0], lead: t.sec[S.sec === 'feet' ? 'feetText' : 'kmText'] }; }
    else { first = s.first; st = null; }
    lab.setGlow('rgba(126, 217, 87, .22)');
  } else if (v === 'choose') {
    const m = S.ch, r = CH[m.i], a = m.a;
    html = `<div class="q">${esc(t.c.q(t.c.objects[m.i]))}</div><div class="qopts">${r.opts.map((u, j) => optBtn(j, U()[u], a, r.ok, ICON[KIND[u]])).join('')}</div>`;
    if (a !== null && m.done) html += verdictHtml(t, a === r.ok, [t.c.why[m.i]], m.i === CH.length - 1);
    first = m.first; lab.setGlow('rgba(255, 201, 74, .2)');
  } else {
    const m = S.ma, r = MA[m.i], a = m.a;
    html = `<div class="q">${esc(t.m.q(r.inn(), U()[r.out]))}</div><div class="qopts">${r.opts.map((o, j) => optBtn(j, loc(o), a, r.ok)).join('')}</div>`;
    if (a !== null && m.done) html += verdictHtml(t, a === r.ok, m.i === 2 ? [t.m.why[m.i], t.m.time] : [t.m.why[m.i]], m.i === MA.length - 1);
    first = m.first; lab.setGlow('rgba(108, 122, 224, .32)');
  }
  $('ctrlBody').innerHTML = html;
  if (!st) { const x = t.st[v][first ? 1 : 0]; st = { emo: x[0], title: x[1], lead: x[2] }; }
  lab.setState({ ...st, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  lastRead = ''; updateReadout(nowS());
}
render();
