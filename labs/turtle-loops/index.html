  }
  S.run = { A: mkAnim(acts, watchRate(acts.length)), match, miss, fin: false, pred: S.pred };
  S.pred = null; S.askPending = false; sfx.click(); showStage(); render();
}
function finishRun() {
  const R = S.run; R.fin = true; S.runs[S.lvl]++;
  if (R.match) S.solved[S.lvl] = true;
  (R.match ? sfx.good : sfx.bad)(); render();
}
function renderFind(t) {
  if (S.sec) return renderSecret(t);
  const L = LV[S.lvl], n = L.acts.length, watching = S.phase === 'watch', R = S.run, ruleOn = S.solved[S.lvl] || S.ruleOn[S.lvl];
  const slots = Array.from({ length: 8 }, (_, i) => (S.user.body[i] ? cardHtml(S.user.body[i], '', `data-act="rm" data-i="${i}"`) : '<div class="tl-slot"></div>')).join('');
  const lit = watching ? Math.max(0, S.lit) : n;
  let actions;
  if (S.askPending) {
    actions = `<div class="tl-q">${esc(t.askSame)}</div><div class="tl-yn"><button class="btn" data-act="yn" data-y="1">${esc(t.yes)}</button><button class="btn ghost" data-act="yn" data-y="0">${esc(t.no)}</button></div>`;
  } else {
    actions = `<div class="row2"><button class="btn" data-act="run" ${!S.user.body.length || watching || (R && !R.fin) ? 'disabled' : ''}>▶ ${esc(t.run)}</button>
      <button class="chip" data-act="clear">${esc(t.clear)}</button><button class="chip" data-act="rewatch">↻ ${esc(t.again)}</button>
      ${S.runs[S.lvl] >= 3 && !ruleOn ? `<button class="chip" data-act="rule">💡 ${esc(t.showRule)}</button>` : ''}
      ${S.solved[S.lvl] && S.lvl < LV.length - 1 ? `<button class="chip" data-act="next">${esc(t.next)} →</button>` : ''}</div>`;
  }
  $('secFind').innerHTML = `
    <div class="tl-dots">${LV.map((_, i) => `<button class="tl-dot ${i === S.lvl ? 'on' : ''} ${S.solved[i] ? 'ok' : ''}" data-act="lvl" data-i="${i}" aria-label="${i + 1}">${i + 1}</button>`).join('')}</div>
    <div class="tl-strip">${Array.from({ length: n }, (_, i) => `<i class="${i < lit ? 'on' : ''}"></i>`).join('')}</div>
    <div class="tl-loop"><div class="tl-lh"><b>${esc(t.loop)}</b>
      <button class="tl-st" data-act="ndec" aria-label="−" ${S.user.n <= 1 ? 'disabled' : ''}>−</button><b class="nm">${esc(t.times(S.user.n))}</b>
      <button class="tl-st" data-act="ninc" aria-label="+" ${S.user.n >= 12 ? 'disabled' : ''}>+</button></div>
      <div class="tl-slots">${slots}</div><div class="tl-lf"></div></div>
    <div class="tl-pal">${L.pal.map((k) => cardHtml(k, '', `data-act="add" data-k="${k}"`)).join('')}</div>
    <p class="tl-hint">${esc(t.hintAdd)}</p>${actions}`;
  const matched = R && R.fin && R.match;
  lab.setReadout(`<span style="font-size:19px">${esc(matched ? t.cardsN(n, S.user.body.length) : t.longN(n))}</span>`, '', `${S.lvl + 1}/${LV.length}`, '#4fc26f');
  lab.setGlow('rgba(70,170,110,.26)');
  const extra = ruleOn ? ruleCard(ruleText(L)) : '';
  if (R && R.fin) {
    lab.setState({ emo: R.pred === R.match ? '✅' : '🤔', title: R.pred === R.match ? t.right : t.surprise, lead: R.match ? t.match : t.miss, body: '', extra });
  } else lab.setState({ emo: '🐢', title: t.find.lead, lead: t.find.body, body: '', extra });
  lab.setFacts([t.facts.turtle, t.facts.turn].map((f, i) => ({ ...f, src: FACT_SRC[i ? 'turn' : 'turtle'] })));
}
function renderSecret(t) {
  const k = S.sec, s = SEC[k];
  $('secFind').innerHTML = `${ruleCard(ruleText(s.prog))}
    <div class="row2"><button class="btn" data-act="srun">▶ ${esc(t.run)}</button></div>`;
  S.secDeg = -1;
  lab.setGlow('rgba(245,200,76,.22)');
  lab.setState({ emo: k === 'star' ? '⭐' : '🌸', title: t.secrets[k][0], lead: k === 'star' ? t.starDone : t.flowerDone, body: '', extra: '' });
  lab.setFacts([{ ...t.facts.turn, src: FACT_SRC.turn }]);
}

// --- second view: long or short --------------------------------------------------------------------------------
function startShort() { const d = S.sh, N = S.shN[d], body = SHDEF[d].body, acts = expand({ n: N, body }); S.shA = mkAnim(acts, clamp(acts.length / 2.5, 8, 30)); }
const thumbSvg = (polys) => {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  polys.forEach((pl) => pl.forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }));
  const s = 70 / Math.max(x1 - x0, y1 - y0, 1e-6);
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${polys.map((pl) => `<polyline fill="none" stroke="#3b2a12" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" points="${pl.map(([x, y]) => `${(50 + (x - (x0 + x1) / 2) * s).toFixed(1)},${(50 - (y - (y0 + y1) / 2) * s).toFixed(1)}`).join(' ')}"/>`).join('')}</svg>`;
};
function renderShort(t) {
  const d = S.sh, pred = S.shPred[d], N = S.shN[d], body = SHDEF[d].body, D = SHD[d];
  $('shChips').innerHTML = SHDEF.map((x, i) => `<button class="chip ${i === d ? 'on' : ''}" data-act="dr" data-i="${i}">${esc(t[x.key])}</button>`).join('');
  $('shAsk').innerHTML = pred === null
    ? `<div class="tl-q">${esc(t.askN)}</div><div class="tl-thumbs">${D.thumbs.map((p, i) => `<button class="tl-th" data-act="pickS" data-i="${i}" aria-label="${i + 1}">${thumbSvg(p)}</button>`).join('')}</div>`
    : `<div class="tl-q">${esc(t.askN)}</div><div class="tl-thumbs">${D.thumbs.map((p, i) => `<div class="tl-th ${i === D.ok ? 'ok' : i === pred ? 'no' : ''}">${thumbSvg(p)}</div>`).join('')}</div>`;
  $('shPanel').style.display = pred === null ? 'none' : '';
  if (pred !== null) {
    $('shLong').innerHTML = Array.from({ length: N }, (_, i) => body.map((k) => miniHtml(k, i)).join('')).join('');
    $('shSlots').innerHTML = body.map((k) => cardHtml(k).replace('<button type="button"', '<div')).join('').replace(/<\/button>/g, '</div>');
    $('shName').textContent = t.loop; $('shTimes').textContent = t.times(N);
    const rg = $('shRange'); if (+rg.value !== N) rg.value = N;
  }
  lab.setReadout(`<span style="font-size:19px">${esc(t.cardsN(N * body.length, body.length))}</span>`, '', t.times(N), '#e0b050');
  lab.setGlow('rgba(224,176,80,.24)');
  if (pred === null) lab.setState({ emo: '✂️', title: t.askN, lead: '', body: '', extra: '' });
  else if (S.shV) lab.setState({ emo: pred === D.ok ? '✅' : '🤔', title: pred === D.ok ? t.right : t.surprise, lead: t.short.body, body: '', extra: '' });
  else lab.setState({ emo: '✂️', title: t.short.lead, lead: t.short.body, body: '', extra: '' });
  lab.setFacts([{ ...t.facts.loom, src: FACT_SRC.loom }, { ...t.facts.robot, src: FACT_SRC.robot }]);
}

// --- third view: repeat until ----------------------------------------------------------------------------------
function renderUntil(t) {
  const R = S.room, okIdx = R.d === 5 ? 2 : 1;
  const blk = (name) => `<div class="tl-loop"><div class="tl-lh"><b>${esc(name)}</b></div><div class="tl-slots">${cardHtml('f').replace('<button type="button"', '<div').replace('</button>', '</div>')}</div><div class="tl-lf"></div></div>`;
  $('secUntil').innerHTML = `<div class="tl-two">${blk(t.untilOpts[0])}${blk(t.untilOpts[1])}</div>` + (R.pred === null
    ? `<div class="tl-q">${esc(t.askUntil)}</div><div class="tl-opts">${t.untilOpts.map((o, i) => `<button class="tl-opt" data-act="upick" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="row2"><button class="btn" data-act="urun">▶ ${esc(t.run)}</button><button class="chip" data-act="unew">${esc(t.newRoom)}</button></div>`);
  lab.setReadout(R.pred === null ? '?' : `${R.d}`, R.pred === null ? '' : t.wallSub, '', '#d9825f');
  lab.setGlow('rgba(217,130,95,.24)');
  if (R.shown) {
    const ok = R.pred === okIdx;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.surprise, lead: t.wallAway(R.d), body: '', extra: ruleCard(t.until.body) });
  } else lab.setState({ emo: '🧱', title: t.askUntil, lead: '', body: '', extra: '' });
  lab.setFacts([{ ...t.facts.robot, src: FACT_SRC.robot }]);
}

// --- secrets ---------------------------------------------------------------------------------------------------
function secChips(t) {
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('star', '⭐') + sc('flower', '🌸');
}
function startSecret(k) { S.sec = k; S.secA = mkAnim(SEC[k].acts, clamp(SEC[k].acts.length / 5, 6, 14)); S.secDeg = -1; }

// --- controls --------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  const U = S.user;
  if (a === 'lvl') { if (i !== S.lvl) { S.lvl = i; U.body = []; U.n = 2; startWatch(); sfx.click(); } }
  else if (a === 'add') { if (U.body.length >= 8) return sfx.bad(); U.body.push(b.dataset.k); edited(); sfx.snap(); }
  else if (a === 'rm') { U.body.splice(i, 1); edited(); sfx.tick(); }
  else if (a === 'ndec' || a === 'ninc') { U.n = clamp(U.n + (a === 'ninc' ? 1 : -1), 1, 12); edited(); sfx.tick(); }
  else if (a === 'clear') { U.body = []; edited(); sfx.click(); }
  else if (a === 'rewatch') { startWatch(); sfx.click(); }
  else if (a === 'run') { if (!U.body.length) return; S.askPending = true; sfx.click(); }
  else if (a === 'yn') { S.pred = b.dataset.y === '1'; startRun(); return; }
  else if (a === 'rule') { const L = LV[S.lvl]; S.ruleOn[S.lvl] = true; U.n = L.n; U.body = [...L.body]; edited(); sfx.good(); }
  else if (a === 'next') { S.lvl = Math.min(S.lvl + 1, LV.length - 1); U.body = []; U.n = 2; startWatch(); sfx.click(); }
  else if (a === 'dr') { if (i !== S.sh) { S.sh = i; startShort(); sfx.click(); } }
  else if (a === 'pickS') {
    const d = S.sh; S.shPred[d] = i; S.shN[d] = 8; S.shV = true; startShort();
    (i === SHD[d].ok ? sfx.good : sfx.bad)(); showStage();
  }
  else if (a === 'upick') { const R = S.room; R.pred = i; R.t0 = clock(); R.done = false; sfx.click(); showStage(); }
  else if (a === 'urun') { const R = S.room; R.t0 = clock() - .8; R.done = false; sfx.click(); showStage(); }
  else if (a === 'unew') { const R = S.room; let d; do d = 3 + Math.floor(Math.random() * 7); while (d === R.d); S.room = { d, pred: null, t0: 0, done: false, shown: false }; sfx.click(); }
  else if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { if (lab.view !== 'find') { lab.view = 'find'; lab.renderChrome(); } startSecret(k); showStage(); }
    sfx.click();
  }
  else if (a === 'srun') { startSecret(S.sec); sfx.click(); }
  render();
});
$('shRange').addEventListener('input', (ev) => { S.shN[S.sh] = clamp(Math.round(+ev.target.value), 1, 12); S.shV = false; startShort(); sfx.tick(); render(); });

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secFind').style.display = v === 'find' ? '' : 'none';
  $('secShort').style.display = v === 'short' && !S.sec ? '' : 'none';
  $('secUntil').style.display = v === 'until' && !S.sec ? '' : 'none';
  secChips(t);
  if (v === 'find') renderFind(t); else if (v === 'short') renderShort(t); else renderUntil(t);
}
startWatch();
startShort();
render();
</script>
</body>
</html>
