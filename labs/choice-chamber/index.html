// Each woodlouse gets a fate (the quarter it will settle in, counted from where it really stands), wanders at the local

function launch(D, fates, spot) {

  AN.forEach((a) => { if (!a.placed && !a.drag) pill(c, T[lang].garden.animals[a.id], trayAt(a.i)[0], a.i % 2 ? 457 : 435, { px: 12, h: 20, bg: 'rgba(40,48,80,.8)', lo: 12, hi: 348 }); });
  [...AN].sort((p, q) => (p.drag ? 1 : 0) - (q.drag ? 1 : 0) || p.y - q.y).forEach((a) => {
    const lift = a.drag ? 7 : 0;
    if (S.sel === a) { c.strokeStyle = '#ffd27a'; c.lineWidth = 2.5; c.setLineDash([5, 4]); c.beginPath(); c.arc(a.x, a.y, 26 + Math.sin(time * 5) * 1.5, 0, TAU); c.stroke(); c.setLineDash([]); }
    drawAnimal(c, a.id, a.x, a.y - lift, time + a.t0, lift);
    if (S.rev && a.ok !== null && Math.hypot(a.tx - a.x, a.ty - a.y) < 4) {
      const bx = a.x + 18, by = a.y - 18;
      c.fillStyle = a.ok ? '#2fbf80' : '#e5594f'; c.strokeStyle = '#fff'; c.lineWidth = 1.6; c.beginPath(); c.arc(bx, by, 9, 0, TAU); c.fill(); c.stroke();
      c.strokeStyle = '#fff'; c.lineWidth = 2.2; c.beginPath();
      if (a.ok) { c.moveTo(bx - 4, by); c.lineTo(bx - 1, by + 3.5); c.lineTo(bx + 4.5, by - 3); } else { c.moveTo(bx - 3.5, by - 3.5); c.lineTo(bx + 3.5, by + 3.5); c.moveTo(bx + 3.5, by - 3.5); c.lineTo(bx - 3.5, by + 3.5); }
      c.stroke();
    }
  });
}

// --- frame: update then draw ------------------------------------------------------------------------------------
const turn = (P, dt) => { P.a += (P.t - P.a) * Math.min(1, dt * 5); if (Math.abs(P.t - P.a) < 0.004) P.a = P.t; };
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view, dw = 360, dh = v === 'garden' ? 470 : 360;
  const K = Math.min(w / dw, h / dh); G.K = K; G.ox = (w - dw * K) / 2; G.oy = (h - dh * K) / 2;
  turn(P1w, dt); turn(P1c, dt); turn(P3w, dt);
  tick(D1, dt, finish1); tick(D3, dt, finish3);
  if (D3.phase === 'swap') { S.swT += dt; if (S.swT > 1.3 && P3w.a === P3w.t) { S.wet3 = S.wet3 === 'L' ? 'R' : 'L'; D3.phase = 'set'; S.pred3 = true; S.guess3 = null; render(); } }
  S.nightK += ((S.night ? 1 : 0) - S.nightK) * Math.min(1, dt * 3);
  AN.forEach((a) => { if (!a.drag) { const k = Math.min(1, dt * (S.rev ? 3.2 : 11)); a.x += (a.tx - a.x) * k; a.y += (a.ty - a.y) * k; } });
  c.save(); c.translate(G.ox, G.oy); c.scale(K, K); c.lineJoin = 'round'; c.lineCap = 'round';
  if (v === 'garden') drawGarden(c, time); else drawDishView(c, v, time);
  c.restore();
});

// --- input ---------------------------------------------------------------------------------------------------------
const toDesign = (ev) => { const r = $('cv').getBoundingClientRect(); return { x: (ev.clientX - r.left - G.ox) / G.K, y: (ev.clientY - r.top - G.oy) / G.K }; };
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
let drag = null;
$('cv').addEventListener('pointerdown', (ev) => {
  const p = toDesign(ev), v = lab.view;
  if (v === 'dish') {
    const x = p.x - 180, y = p.y - 180;
    if (S.curl && D1.phase !== 'run') {
      const w = D1.ws.find((q) => Math.hypot(q.x - x, q.y - y) < 18);
      if (w) { w.balled = true; w.bt = 0; sfx.snap(); render(); return; }
    }
    if (D1.phase === 'set' && Math.hypot(x, y) <= R) { S.guess1 = quarterOf(x, y); sfx.tick(); render(); }
  } else if (v === 'garden') {
    if (S.rev) return;
    const a = [...AN].reverse().find((q) => Math.hypot(q.x - p.x, q.y - p.y) < 28);
    if (a) {
      drag = { a, ox: a.x - p.x, oy: a.y - p.y, sx: ev.clientX, sy: ev.clientY, moved: false };
      try { $('cv').setPointerCapture(ev.pointerId); } catch { /* no capture */ }
    } else if (S.sel) {
      const z = zoneAt(p.x, p.y);
      if (z) { const n = AN.filter((q) => q.zone === z.id && q !== S.sel).length; putIn(S.sel, z, z.a[0] + (n % 3) * 26 - 26, z.a[1] + Math.floor(n / 3) * 16); S.sel = null; sfx.snap(); render(); }
    }
  }
});
$('cv').addEventListener('pointermove', (ev) => {
  if (!drag) return; const p = toDesign(ev), a = drag.a;
  if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > 6) { drag.moved = true; a.drag = true; a.zone = null; a.placed = false; S.sel = null; render(); }
  if (drag.moved) { a.x = p.x + drag.ox; a.y = p.y + drag.oy; }
});
const drop = () => {
  if (!drag) return; const { a, moved } = drag; drag = null;
  if (!moved) { S.sel = S.sel === a ? null : a; sfx.tick(); render(); return; } // a tap picks the creature up; the next tap on a place puts it there
  a.drag = false;
  const z = zoneAt(a.x, a.y);
  if (z) { putIn(a, z, a.x, a.y); sfx.snap(); } else { putTray(a); sfx.click(); }
  render();
};
$('cv').addEventListener('pointerup', drop); $('cv').addEventListener('pointercancel', drop);

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-g]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (b.dataset.g) { S.guess3 = b.dataset.g; sfx.click(); }
  else if (act === 'cover' || act === 'wet') {
    if (D1.phase === 'run') return;
    if (act === 'cover') { S.cov = S.cov === 'B' ? 'T' : 'B'; P1c.t += Math.PI; } else { S.wet = S.wet === 'R' ? 'L' : 'R'; P1w.t += Math.PI; }
    S.guess1 = null; D1.phase = 'set'; D1.t = 0; sfx.click();
  } else if (act === 'go1') {
    if (D1.phase === 'set') { if (S.guess1 === null) return; startRun1(); sfx.click(); }
    else if (D1.phase === 'done') { D1.phase = 'set'; S.guess1 = null; D1.ws.forEach((w) => { w.arrived = false; }); sfx.click(); }
  } else if (act === 'go2') {
    if (S.rev) resetGarden(); else if (placedN() === 4) { revealGarden(); showStage(); }
    sfx.click();
  } else if (act === 'go3') {
    if (D3.phase === 'set' && (S.n3 === 0 || S.guess3 !== null)) { startRun3(); sfx.click(); }
    else if (D3.phase === 'done') { D3.phase = 'swap'; S.swT = 0; S.prevSide = S.wet3; P3w.t += Math.PI; D3.ws.forEach((w) => { w.arrived = false; w.balled = false; }); sfx.snap(); }
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'curl') S.curl = !S.curl; else S.night = !S.night;
    sfx.click();
  }
  render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = v;
  $('secDish').hidden = v !== 'dish'; $('secGarden').hidden = v !== 'garden'; $('secSwap').hidden = v !== 'swap';
  $('bCurl').textContent = open ? `🐚 ${t.secrets.curl[0]}` : '🔒 ???'; $('bCurl').classList.toggle('open', open); $('bCurl').classList.toggle('on', open && S.curl);
  if (!S.rev) S.night = false; // night would show where the woodlice hide before the child has placed them
  $('bNight').disabled = open && !S.rev;
  $('bNight').textContent = open ? `🌙 ${t.secrets.night[0]}` : '🔒 ???'; $('bNight').classList.toggle('open', open); $('bNight').classList.toggle('on', open && S.night);
  if (v === 'dish') renderDish(t); else if (v === 'garden') renderGarden(t); else renderSwap(t);
}
function renderDish(t) {
  const d = t.dish, ph = D1.phase, b = bestQ();
  lab.setGlow('rgba(110, 165, 155, .26)');
  $('bCover').textContent = d.cover; $('bWet').textContent = d.wet; $('bCover').disabled = $('bWet').disabled = ph === 'run';
  $('dAsk').textContent = d.pick; $('dAsk').hidden = ph !== 'set';
  $('bGo1').textContent = ph === 'set' ? d.go : ph === 'run' ? d.watch : d.again; $('bGo1').disabled = ph === 'run' || (ph === 'set' && S.guess1 === null);
  let st;
  if (ph === 'done') {
    const n = D1.counts[b], ok = S.guess1 === b, vd = ok ? d.good : d.bad;
    lab.setReadout(n, d.busiest, `${t.damp} · ${t.dark}`, '#6aa4af');
    st = { emo: ok ? '✅' : '🤔', title: vd[0], lead: vd[1](n), body: d.why };
    lab.setFacts(facts('dry', 'hide'));
  } else {
    lab.setReadout(ph === 'run' ? `⏱ ${Math.max(1, Math.ceil(RUN - D1.t))}` : 10, ph === 'run' ? '' : d.sub, ph === 'set' && S.guess1 !== null ? d.guess + qName(S.guess1, t) : '', '#6aa4af');
    st = ph === 'run' ? { emo: '👀', title: d.run[0], lead: d.run[1], body: '' } : S.guess1 === null ? { emo: '🪲', title: d.s0[0], lead: d.s0[1], body: d.s0[2] } : { emo: '📍', title: d.s1[0], lead: d.s1[1], body: '' };
    lab.setFacts(facts('crust', 'legs'));
  }
  if (S.curl && secret.unlocked() && ph === 'set') { st = { emo: '🐚', title: d.curlOn[0], lead: d.curlOn[1], body: '' }; lab.setFacts(facts('pill', 'crust')); }
  lab.setState({ ...st, extra: '' });
}
function renderGarden(t) {
  const g = t.garden, n = placedN(), k = AN.filter((a) => a.ok).length;
  lab.setGlow('rgba(110, 170, 90, .24)');
  $('gAsk').textContent = g.pick; $('gAsk').hidden = S.rev;
  $('bGo2').textContent = S.rev ? g.again : g.show; $('bGo2').disabled = !S.rev && n < 4;
  let st, extra = '';
  if (S.rev) {
    const ti = k === 4 ? g.allGood : g.some(k);
    st = { emo: k === 4 ? '✅' : '🤔', title: ti[0], lead: ti[1], body: g.body };
    extra = `<ul class="cc-lines">${AN.map((a) => `<li class="${a.ok ? '' : 'no'}">${esc(g.ln[a.id])}</li>`).join('')}</ul>`;
    lab.setReadout(`${k}/4`, g.subRight, '', '#7fb85f'); lab.setFacts(facts('hide', 'worm', 'skater'));
  } else {
    lab.setReadout(`${n}/4`, g.sub, '', '#7fb85f');
    st = n === 4 ? { emo: '📍', title: g.s1[0], lead: g.s1[1], body: '' } : { emo: '🌿', title: g.s0[0], lead: g.s0[1], body: g.s0[2] };
    lab.setFacts(facts('crust', 'legs'));
  }
  if (S.night && secret.unlocked()) { st = { emo: '🌙', title: g.night[0], lead: g.night[1], body: '' }; extra = ''; lab.setFacts(facts('night', 'hide')); }
  lab.setState({ ...st, extra });
}
function renderSwap(t) {
  const s = t.swap, ph = D3.phase, side = (k) => t[k === 'L' ? 'left' : 'right'], wet = side(S.wet3);
  lab.setGlow('rgba(90, 150, 170, .26)');
  const pred = ph === 'set' && S.pred3;
  $('ftOpts').hidden = !pred; $('fAsk').hidden = !pred; if (pred) $('fAsk').textContent = s.pred(side(S.prevSide))[1];
  $('ftOpts').innerHTML = pred ? [['stay', s.stay(side(S.prevSide))], ['follow', s.follow]].map(([k, l]) => `<button class="cc-opt${S.guess3 === k ? ' on' : ''}" data-g="${k}">${esc(l)}</button>`).join('') : '';
  const label = ph === 'run' ? s.watch : ph === 'swap' ? s.swapping : ph === 'done' ? s.swapB : s.go;
  $('bGo3').textContent = label; $('bGo3').disabled = ph === 'run' || ph === 'swap' || (pred && S.guess3 === null);
  let st;
  if (ph === 'done') {
    const n = D3.counts[S.wet3], other = D3.counts[S.wet3 === 'L' ? 'R' : 'L'];
    if (S.verdict3 === null) { const r = s.r0(Math.max(n, other), side(n >= other ? S.wet3 : S.wet3 === 'L' ? 'R' : 'L')); st = { emo: '📋', title: r[0], lead: r[1], body: r[2] }; lab.setFacts(facts('crust', 'legs')); }
    else { const vd = S.verdict3 ? s.good : s.bad; st = { emo: S.verdict3 ? '✅' : '🤔', title: vd[0], lead: vd[1](n), body: s.why }; lab.setFacts(facts('swap', 'dry')); }
    lab.setReadout(n, s.sub(wet), '', '#6aa4af');
  } else {
    lab.setReadout(ph === 'run' ? `⏱ ${Math.max(1, Math.ceil(RUN - D3.t))}` : 10, ph === 'run' ? '' : t.dish.sub, '', '#6aa4af');
    if (ph === 'run') st = { emo: '👀', title: s.run[0], lead: s.run[1], body: '' };
    else if (ph === 'swap') st = { emo: '🔁', title: s.swp[0], lead: s.swp[1], body: '' };
    else if (pred) { const r = s.pred(side(S.prevSide)); st = { emo: '🤔', title: r[0], lead: r[1], body: '' }; }
    else st = { emo: '🧪', title: s.s0[0], lead: s.s0[1], body: '' };
    lab.setFacts(facts('crust', 'legs'));
  }
  lab.setState({ ...st, extra: '' });
}
render();
