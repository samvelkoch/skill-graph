const TAU = Math.PI * 2;
const now = () => performance.now() / 1000;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const backOut = (x) => { x = clamp01(x); const s = 1.70158; return Math.max(0, 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2)); };
const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const toHex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return toHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); };

// --- people: a round head with a face, and a child-like body -------------------------------------------------
const KINDS = {

  friend: { skin: '#E6B88F', hair: '#D9A441', shirt: '#E07A5F', pants: '#3B4A64', style: 'long', h: 1 },

  little: { skin: '#F2C9A0', hair: '#B5651D', shirt: '#FFC94D', pants: '#4A5A7A', style: 'tuft', h: .78 },

// --- time-driven changes: called every frame -----------------------------------------------------------------
function tick(time) {
  const v = lab.view;
  if (v === 'light') {
    if (S.sec === 'turtle') {
      const tu = S.tu, el = time - tu.t0;
      if (tu.ph === 'seq') {
        const k = el < 1.4 ? (el > .2 ? 'r' : null) : el < 4.2 ? 'y' : el < 7.5 ? 'g' : null;
        if (tu.k !== k) { tu.k = k; setLamps(k); render(); }
        if (el >= 7.6) { tu.ph = 'idle'; tu.next = time + 1.5; tu.k = null; setLamps(null); render(); }
      }
      return;
    }
    if (S.sec === 'wait') {
      const W = S.wt;
      if (!W.done && time - W.t0 >= 10) { W.done = true; W.got = 2; W.sparkAt = time; W.look = false; sfx.good(); render(); }
      return;
    }
    const l = S.l, M = S.Ml, el = time - l.t0;
    if (l.ph === 'a1') {
      if (l.pick1 === 0 && !l.beeped && el > .9) { l.beeped = true; sfx.bad(); }
      if (el >= l.dur) { l.ph = 'r1'; setLamps('r'); render(); }
    } else if (l.ph === 'a2') {
      if (!l.txt && time >= M.goldAt) { l.txt = true; setLamps('g'); sfx.good(); render(); }
      if (time >= M.walkAt + 2.5) { l.ph = 'free'; l.step = 'go'; render(); }
    }
  } else if (v === 'paths') {
    const p = S.p, M = S.Mp;
    if (p.ph === 'a' && !p.txt && time >= M.goldAt) { p.txt = true; setLamps('g'); render(); }
  } else {
    const n = S.n;
    if (n.ph === 'a' && !n.txt && time >= n.t0 + 1.8) { n.txt = true; render(); }
  }
}

      const show = l.txt || l.ph === 'free'; free = l.ph === 'free';
      main = qBlock(t.l.q2, t.l.o2, { pick: l.pick2, show, best: BEST.light }) + (free ? `<div class="st-next"><button class="btn" data-act="again">${esc(t.again)}</button></div>` : '');
      if (show) { sub = l.pick2 === null ? '' : verdict(l.pick2 === BEST.light); st = full(t.l.r2); }
    }
    if (!S.sec) { const g = GLOW[step]; if (g) lab.setGlow(g); else lab.setGlow('rgba(60, 110, 200, .32)'); } else lab.setGlow(glow);
    const lamps = free && !S.sec ? `<div class="st-lamps">${['stop', 'think', 'go'].map((k) => `<button class="chip st-lamp ${l.step === k ? 'on' : ''}" data-act="lamp" data-k="${k}"><i style="color:${STEP_COL[k]};background:${STEP_COL[k]}"></i>${esc(t.steps[k])}</button>`).join('')}</div>` : '';
    const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    extra = `<div class="st-chips">${sc('turtle', '🐢')}${lamps}${sc('wait', '⏳')}</div>`;
  } else if (v === 'paths') {
    const p = S.p, i = p.i, last = i === 2;
    main = qBlock(t.p.q[i], t.p.o[i], { pick: p.pick, show: p.txt, best: BEST.paths[i] }) + (p.txt ? nextBtn(last ? t.again : t.next) : '');
    val = `${i + 1} / 3`; glow = 'rgba(78, 143, 90, .3)';
    if (p.txt) { const ok = p.pick === BEST.paths[i], th = t.p.then[i][p.pick]; sub = verdict(ok); col = C.green;
      st = last ? full(`${th} ${t.p.why[i]}`) : { emo: ok ? '✅' : '💭', title: verdict(ok), lead: th, body: t.p.why[i] }; }
    lab.setGlow(glow);
  } else {
    const n = S.n, i = n.i, last = i === 2;
    main = qBlock(t.n.q[i], t.n.o[i], { pick: n.pick, show: n.txt, best: BEST.later[i] }) + (n.txt ? nextBtn(last ? t.again : t.next) : '');
    val = `${i + 1} / 3`; glow = 'rgba(150, 90, 160, .26)'; col = '#C79BDF';
    if (n.txt) { const ok = n.pick === BEST.later[i]; sub = verdict(ok); st = last ? full(t.n.why[i]) : { emo: ok ? '✅' : '💭', title: verdict(ok), lead: t.n.why[i], body: '' }; }
    lab.setGlow(glow);
  }
  $('ctrlBody').innerHTML = main + extra;
  lab.setReadout(esc(val), sub, '', col);
  lab.setState(st);
}
render();
</script>
</body>
</html>
