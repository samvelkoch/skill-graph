  c.save(); c.translate(W / 2, cy); c.rotate(ang);

  c.restore();
  if (s.phase === 'drying') drawTimer(c, s.dryT);
}
function drawJoins(c) {
  const j = S.j, { A, B } = mugAnchors(), m = j.m;
  const mugDry = m === 'dry' ? 1 : j.stage === 'drying' || j.stage === 'done' ? j.dryT : 0;
  const hP = m === 'dry' ? pal2(1) : pal2(mugDry);
  const jt = j.stage === 'choose' ? 0 : j.stage === 'joining' ? j.joinT : 1;
  const seq = m === 'slip' ? { sc: ease(jt / 0.3), sl: ease((jt - 0.3) / 0.25), mv: ease((jt - 0.55) / 0.45) } : { sc: 0, sl: 0, mv: ease(jt / 0.8) };
  shadow(c, MUG.cx + 14, MUG.by + 3, 70, 0.5);
  vessel(c, { cx: MUG.cx, by: MUG.by, h: MUG.h, rf: mugR, wall: 6, open: 1, dry: mugDry, pal: m === 'dry' ? pal2(1) : null });
  // the handle: floats to the right, then moves in
  const off = (1 - seq.mv), fall = FALL_AT[m], dt = j.dryT, started = j.stage === 'drying' || j.stage === 'done';
  let hx = off * 58, hy = -off * 18, rot = 0, crack = 0, gone = false;

  const ctr = [(A[0] + B[0]) / 2 + 20, (A[1] + B[1]) / 2];
  c.translate(ctr[0] + hx + crack * (gone ? 0 : 3), ctr[1] + hy); c.rotate(rot); c.translate(-ctr[0], -ctr[1]);

    else if (!gone) { c.save(); c.strokeStyle = `rgba(40,14,6,${0.35 + 0.5 * crack})`; c.lineWidth = 1 + crack * 2.2; [A, B].forEach(([x, y]) => { c.beginPath(); c.moveTo(x + 2, y - 7); c.lineTo(x + 2 + crack * 2, y + 7); c.stroke(); }); c.restore(); }

// --- the loop: animate state, draw, then draw labels in screen pixels ---------------------------------------------
let again = false;
function tick(dt) {
  const w = S.w;
  for (const k of WAYS) { const a = w.d[k], b = w.u[k], st = dt / 1.25; if (a !== b) { w.d[k] = Math.abs(b - a) <= st ? b : a + Math.sign(b - a) * st; if (w.d[k] === b) again = true; } }
  const k = w.kiln;
  if (k.firing) { k.fire = Math.min(1, k.fire + dt / 4.2); if (k.fire >= 1) { k.firing = false; k.fired = true; again = true; } }
  if (k.thumbOn) { k.thumb += dt / 0.7; if (k.thumb >= 1) { k.thumb = 0; k.thumbOn = false; again = true; } }
  if (k.hit > 0) k.hit = Math.max(0, k.hit - dt * 1.3);
  const s = S.s;
  if (s.phase === 'drying') { s.dryT = Math.min(1, s.dryT + dt / 3.2); if (s.dryT >= 1) { s.phase = 'done'; s.log.push({ l: s.leg, b: s.body, o: s.out }); (s.out === s.pred ? sfx.good : sfx.bad)(); again = true; showStage(); } }
  const j = S.j;
  if (j.stage === 'joining') { j.joinT = Math.min(1, j.joinT + dt / (j.m === 'slip' ? 2.4 : 1.1)); if (j.joinT >= 1) { j.stage = 'joined'; sfx.snap(); again = true; } }
  if (j.stage === 'drying') { j.dryT = Math.min(1, j.dryT + dt / 4.6); if (j.dryT >= 1) { j.stage = 'done'; j.log.push({ m: j.m, o: JSTAY(j.m) }); (JSTAY(j.m) === j.pred ? sfx.good : sfx.bad)(); again = true; showStage(); } }
}
// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const opt = (act, k, label, on, dis) => `<button class="cl-opt${on ? ' on' : ''}" data-act="${act}" data-k="${k}"${dis ? ' disabled' : ''}>${esc(label)}</button>`;
const chip = (act, k, label, on, extra = '', dis = false) => `<button class="cl-chip${on ? ' on' : ''}${extra}" data-act="${act}" data-k="${k}"${dis ? ' disabled' : ''}>${esc(label)}</button>`;
const animating = () => WAYS.some((k) => S.w.d[k] !== S.w.u[k]);

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = b.dataset.k, w = S.w, s = S.s, j = S.j;
  if (act === 'wpred') { w.pred = k; w.way = k; sfx.click(); }
  else if (act === 'way') { w.way = k; sfx.click(); }
  else if (act === 'step') { if (animating() || w.u[w.way] >= 3) return; w.u[w.way]++; sfx.snap(); }
  else if (act === 'wagain') { w.pred = null; w.u = { pinch: 0, coil: 0, slab: 0 }; w.d = { pinch: 0, coil: 0, slab: 0 }; w.way = 'pinch'; sfx.click(); }
  else if (act === 'sec') { if (!secret.unlocked()) return secret.open(); w.sec = k; if (k === 'shrink') { w.shr = 0; $('shrR').value = 0; } sfx.click(); }
  else if (act === 'back') { w.sec = null; sfx.click(); }
  else if (act === 'kfire') { if (w.kiln.firing || w.kiln.fired) return; w.kiln.firing = true; w.kiln.fire = 0; w.kiln.dent = false; w.kiln.hard = false; sfx.push(); }
  else if (act === 'kpress') { if (w.kiln.firing || w.kiln.thumbOn) return; w.kiln.thumbOn = true; w.kiln.thumb = 0; if (w.kiln.fired) { w.kiln.hit = 1; w.kiln.hard = true; sfx.snap(); } else { w.kiln.dent = true; sfx.push(); } }
  else if (act === 'knew') { w.kiln = { fire: 0, firing: false, fired: false, thumb: 0, dent: false, thumbOn: false, hit: 0 }; sfx.click(); }
  else if (act === 'leg' || act === 'body') { if (s.phase === 'drying') return; s[act] = +k; if (s.phase === 'done') { s.phase = 'build'; s.dryT = 0; s.out = null; s.pred = null; } sfx.tick(); }
  else if (act === 'spred') { s.pred = k; sfx.click(); }
  else if (act === 'sdry') { if (!s.pred || s.phase !== 'build') return; s.out = outcomeOf(s.leg, s.body); s.phase = 'drying'; s.dryT = 0; sfx.push(); }
  else if (act === 'sagain') { s.phase = 'build'; s.dryT = 0; s.out = null; s.pred = null; sfx.click(); }
  else if (act === 'jm') { if (j.stage === 'joining' || j.stage === 'drying') return; j.m = k; j.stage = 'choose'; j.joinT = 0; j.dryT = 0; j.pred = null; sfx.tick(); }
  else if (act === 'jjoin') { if (j.stage !== 'choose') return; j.stage = 'joining'; j.joinT = 0; sfx.push(); }
  else if (act === 'jpred') { j.pred = k; sfx.click(); }
  else if (act === 'jdry') { if (!j.pred || j.stage !== 'joined') return; j.stage = 'drying'; j.dryT = 0; sfx.push(); }
  else if (act === 'jagain') { j.stage = 'choose'; j.joinT = 0; j.dryT = 0; j.pred = null; sfx.click(); }
  render();
});
$('shrR').addEventListener('input', (ev) => { S.w.shr = +ev.target.value / 100; render(); });

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('cW').hidden = v !== 'ways'; $('cS').hidden = v !== 'stand'; $('cJ').hidden = v !== 'joins';
  if (v === 'ways') renderWays(t); else if (v === 'stand') renderStand(t); else renderJoins(t);
}
function renderWays(t) {
  const w = S.w, tw = t.w, pre = w.pred === null;
  const main = !w.sec;
  $('wPred').hidden = !(main && pre); $('wMake').hidden = !(main && !pre); $('wSec').hidden = !main;
  $('wShr').hidden = w.sec !== 'shrink'; $('wKiln').hidden = w.sec !== 'kiln';
  const open = secret.unlocked(), sc = (k, emo, i) => `<button class="cl-chip${open ? '' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[i][0])}` : '🔒 ???'}</button>`;
  $('wSec').innerHTML = sc('shrink', '📏', 'a') + sc('kiln', '🔥', 'b');
  if (w.sec === 'shrink') return renderShrink(t);
  if (w.sec === 'kiln') return renderKiln(t);
  if (pre) {
    $('wPred').innerHTML = `<p class="cl-q">${esc(tw.q)}</p><div class="cl-row" style="margin-top:2px">${WAYS.map((k) => opt('wpred', k, tw.opt[k], false)).join('')}</div>`;
    lab.setReadout('?', '', '', '#d9825f'); lab.setGlow('rgba(217, 130, 95, .26)');
    lab.setState({ emo: '🤔', title: tw.q, lead: tw.qlead, body: '', extra: '' });
    lab.setFacts(facts('xian')); return;
  }
  const way = w.way, n = WAYS.filter(wDone).length, fin = allDone(), c = Math.min(3, Math.floor(w.d[way] + 1e-6)), nxt = w.u[way];
  const dots = (k) => `<span class="cl-dots">${[0, 1, 2].map((i) => `<i class="${i < Math.floor(w.d[k] + 1e-6) ? 'on' : ''}"></i>`).join('')}</span>`;
  $('wMake').innerHTML = `<div class="cl-row" style="margin-top:0">${WAYS.map((k) => chip('way', k, tw.name[k], k === way, wDone(k) ? ' done' : '')).join('')}</div>
    <div class="cl-row">${fin ? `<button class="btn cl-go" data-act="wagain">${esc(tw.again)}</button>`
      : `<button class="btn cl-go" data-act="step"${nxt >= 3 || animating() ? ' disabled' : ''}>${esc(nxt >= 3 ? tw.made : tw.step[way][nxt])}</button>${dots(way)}`}</div>`;
  lab.setReadout(`${n}/3`, tw.sub, '', '#d9825f'); lab.setGlow('rgba(217, 130, 95, .26)');
  let st;

    const g = tw.name[w.pred];

  } else if (c === 0) st = { emo: '👐', title: tw.ready[way][0], lead: tw.ready[way][1] };
  else st = { emo: ['👍', '🧱', '✨'][c - 1], title: tw.done[way][c - 1][0], lead: tw.done[way][c - 1][1] };
  lab.setState({ ...st, body: '', extra: '' });
  lab.setFacts(fin ? facts('coil', 'xian') : facts('xian'));
}
function renderShrink(t) {
  const w = S.w, sr = t.shr, d = w.shr, len = SHR_LEN * (1 - SHR * d), a = Math.round(SHR_LEN * (1 - SHR)), n = SHR_LEN - a;
  $('shrA').textContent = sr.wet; $('shrB').textContent = sr.dry; $('shrBack').textContent = sr.back;
  lab.setReadout(Math.round(len * 10) / 10, sr.steps, '', '#e0b050'); lab.setGlow('rgba(224, 176, 80, .24)');
  const [ti, le] = d < 0.03 ? sr.t0 : d < 0.97 ? sr.t1 : sr.t2(a, SHR_LEN, n);
  lab.setState({ emo: '📏', title: ti, lead: le, body: '', extra: '' });
  lab.setFacts(facts('shrink'));
}
function renderKiln(t) {
  const k = S.w.kiln, kk = t.k;
  $('kFire').textContent = kk.fire; $('kPress').textContent = kk.press; $('kNew').textContent = kk.again; $('kBack').textContent = kk.back;
  $('kFire').disabled = k.firing || k.fired; $('kPress').disabled = k.firing;
  lab.setReadout(k.fired ? kk.val.cer : kk.val.clay, kk.sub, '', '#e0793a'); lab.setGlow('rgba(224, 121, 58, .28)');
  let st;
  if (k.firing) st = { emo: '🔥', title: kk.firing[0], lead: kk.firing[1] };
  else if (k.fired && k.hard) st = { emo: '🧱', title: kk.hard[0], lead: kk.hard[1] };
  else if (k.fired) st = { emo: '🏺', title: kk.fired[0], lead: kk.fired[1] };
  else if (k.dent) st = { emo: '👍', title: kk.dent[0], lead: kk.dent[1] };
  else st = { emo: '🏺', title: kk.t0[0], lead: kk.t0[1] };

}
function renderStand(t) {
  const s = S.s, ts = t.s, busy = s.phase === 'drying', done = s.phase === 'done';
  $('cS').innerHTML = `<div class="cl-row" style="margin-top:0"><span class="cl-k">${esc(ts.legs)}</span>${[0, 1, 2].map((i) => chip('leg', i, ts.leg[i], s.leg === i, '', busy)).join('')}</div>
    <div class="cl-row"><span class="cl-k">${esc(ts.body)}</span>${[0, 1].map((i) => chip('body', i, ts.bsz[i], s.body === i, '', busy)).join('')}</div>
    ${done ? '' : `<p class="cl-q" style="margin-top:12px">${esc(ts.q)}</p><div class="cl-row" style="margin-top:2px">${['stand', 'sag', 'fall'].map((k) => opt('spred', k, ts.pred[k], s.pred === k, busy)).join('')}</div>`}
    <div class="cl-row">${done ? `<button class="btn cl-go" data-act="sagain">${esc(ts.again)}</button>` : `<button class="btn cl-go" data-act="sdry"${s.pred && !busy ? '' : ' disabled'}>${esc(ts.dry)}</button>`}</div>
    ${s.log.length ? `<div class="cl-log"><b>${esc(ts.tried)}:</b>${s.log.slice(-5).map((e) => `<span class="cl-tag">${esc(ts.leg[e.l])} · ${esc(ts.bsz[e.b])} ${ICON[e.o]}</span>`).join('')}</div>` : ''}`;
  lab.setReadout(s.pred ? ICON[s.pred] : '?', ts.sub, done ? ts.short[s.out] : '', '#d9825f'); lab.setGlow('rgba(217, 130, 95, .26)');
  let st;
  if (done) st = { emo: ICON[s.out], title: ts.out[s.out][0], lead: ts.out[s.out][1], body: s.out === s.pred ? ts.right : ts.wrong };
  else if (busy) st = { emo: '☀️', title: ts.drying[0], lead: ts.drying[1], body: '' };
  else st = { emo: '🐴', title: ts.ready[0], lead: ts.ready[1], body: '' };

}
function renderJoins(t) {

  $('cJ').innerHTML = `<div class="cl-row" style="margin-top:0"><span class="cl-k">${esc(tj.how)}</span>${['press', 'dry', 'slip'].map((k) => chip('jm', k, tj.m[k], j.m === k, '', busy)).join('')}</div>
    ${j.stage === 'choose' ? `<div class="cl-row"><button class="btn cl-go" data-act="jjoin">${esc(tj.join)}</button></div>` : ''}
    ${j.stage === 'joining' ? `<div class="cl-row"><button class="btn cl-go" disabled>${esc(tj.join)}</button></div>` : ''}
    ${j.stage === 'joined' || j.stage === 'drying' ? `<p class="cl-q" style="margin-top:12px">${esc(tj.q)}</p><div class="cl-row" style="margin-top:2px">${['stay', 'fall'].map((k) => opt('jpred', k, tj.pred[k], j.pred === k, j.stage === 'drying')).join('')}</div>
      <div class="cl-row"><button class="btn cl-go" data-act="jdry"${j.pred && j.stage === 'joined' ? '' : ' disabled'}>${esc(tj.dry)}</button></div>` : ''}
    ${done ? `<div class="cl-row"><button class="btn cl-go" data-act="jagain">${esc(tj.again)}</button></div>` : ''}
    ${j.log.length ? `<div class="cl-log"><b>${esc(tj.tried)}:</b>${j.log.slice(-5).map((e) => `<span class="cl-tag">${esc(tj.m[e.m])} ${e.o === 'stay' ? '✅' : '❌'}</span>`).join('')}</div>` : ''}`;
  lab.setReadout(j.log.length || '0', tj.sub, done ? (o === 'stay' ? tj.stayed : tj.fell) : '', '#d9825f'); lab.setGlow('rgba(217, 130, 95, .26)');
  let st;
  if (done) st = { emo: o === 'stay' ? '✅' : '💥', title: tj.out[j.m][0], lead: tj.out[j.m][1], body: o === j.pred ? tj.right : tj.wrong };
  else if (j.stage === 'drying') st = { emo: '☀️', title: tj.drying[0], lead: tj.drying[1], body: '' };
  else if (j.stage === 'joined' || j.stage === 'joining') st = { emo: '🤝', title: tj.joined[j.m][0], lead: tj.joined[j.m][1], body: '' };
  else st = { emo: '🥣', title: tj.ready[0], lead: tj.ready[1], body: '' };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(done ? facts('slip', 'army2') : []);
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  again = false; tick(dt);
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  labels = [];

  for (const l of labels) {
    const x0 = ox + l.x * s, y0 = oy + l.y * s, tw = c.measureText(l.txt).width + 16, px = clamp(x0, tw / 2 + 4, w - tw / 2 - 4);
    c.fillStyle = 'rgba(10,12,20,.8)'; c.beginPath(); c.roundRect(px - tw / 2, y0 - 11, tw, 22, 11); c.fill();
    c.fillStyle = l.gold ? '#ffd58a' : l.ds ? '#ffffff' : '#d3d9e8'; c.globalAlpha = 1; c.fillText(l.txt, px, y0 + 0.5);
  }
  c.restore();
  if (again) render();
});
