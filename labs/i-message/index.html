  const good = (() => { let g = 0; while (g < 4 && S.slots[g] === g) g++; return g; })();
  S.busy = true; S.rbad = good === 4 ? -1 : good; S.rph = 'play'; sfx.click();
  for (let i = 0; i < good; i++) later(250 + i * 480, () => { setScene({ axT: 142 + i * 25 }); sfx.tick(); });
  if (good === 4) {
    later(250 + 4 * 480, () => { setScene({ axT: 232, kimMood: 'surprised', alexMood: 'surprised' }); sfx.good(); });
    later(250 + 4 * 480 + 900, () => { setScene({ kimMood: 'happy' }); S.rph = 'ok'; S.busy = false; render(); showStage(); });
  } else {
    later(250 + good * 480 + 100, () => { for (let j = good; j < 4; j++) if (S.slots[j] !== null) A.wob[j] = nowS(); sfx.bad(); setScene({ alexMood: 'scared' }); });
    later(250 + good * 480 + 900, () => { setScene({ axT: AX0, alexMood: 'upset' }); S.rph = 'wrong'; S.busy = false; render(); showStage(); });
  }
  render();
}
const fillRepair = () => { if (S.rph !== 'ok' && S.rph !== 'wrong') S.rph = 'build'; };

// --- controls ------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i, j = +b.dataset.j;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    clearTimers();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.hs = 0; S.hv = 'H'; sfx.click();
    syncScene(false); render(); return;
  }
  if (S.busy) return;
  if (act === 'opt') {
    if (S.said) resetBuild(true);
    S.pick[i] = j; sfx.snap(); S.pred = null;
    const nx = S.pick.findIndex((p) => p === null); S.slot = nx === -1 ? i : nx;
  } else if (act === 'slot') { if (S.said) resetBuild(true); S.slot = i; S.pred = null; sfx.tick(); }
  else if (act === 'pred') { S.pred = b.dataset.v; sfx.click(); }
  else if (act === 'say') return sayIt();
  else if (act === 'again') { resetBuild(false); sfx.click(); }
  else if (act === 'w') { if (S.dph !== 'mark') return; S.marks.has(i) ? S.marks.delete(i) : S.marks.add(i); sfx.tick(); }
  else if (act === 'dcheck') return detCheck();
  else if (act === 'rew') return detRew(j);
  else if (act === 'dnext') return detNext();
  else if (act === 'dagain') return detAgain();
  else if (act === 'stone') { const e = S.slots.indexOf(null); if (e === -1 || S.rph === 'ok') return; S.slots[e] = i; S.rph = 'build'; sfx.snap(); syncScene(false); }
  else if (act === 'unslot') { if (S.rph === 'ok' || S.slots[i] === null) return; S.slots[i] = null; S.rph = 'build'; sfx.tick(); syncScene(false); }
  else if (act === 'rclear') { S.slots = [null, null, null, null]; S.rph = 'build'; setScene({ axT: AX0 }); syncScene(false); sfx.click(); }
  else if (act === 'cross') return cross();
  else if (act === 'hv') { S.hv = b.dataset.v; S.hs = 0; sfx.click(); syncScene(false); }
  else if (act === 'hnext') { S.hs = S.hs >= 5 ? 0 : S.hs + 1; sfx.click(); if (S.hs === 5 && S.hv === 'H') { A.bang = nowS(); sfx.bad(); } else if (S.hs === 5) sfx.good(); syncScene(false); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const m = /^oI(\d)$/.exec(ev.target.id); if (!m) return;
  S.own[+m[1]] = ev.target.value; syncScene(false); renderOwn(T[lang]);
});

// --- render --------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  $('secBuild').style.display = !sec && v === 'build' ? 'block' : 'none';
  $('secDetect').style.display = !sec && v === 'detect' ? 'block' : 'none';
  $('secRepair').style.display = !sec && v === 'repair' ? 'block' : 'none';
  $('secHarsh').style.display = sec === 'harsh' ? 'block' : 'none';
  $('secOwn').style.display = sec === 'own' ? 'block' : 'none';
  const open = secret.unlocked();
  $('secChips').innerHTML = [['harsh', '🚪'], ['own', '✏️']].map(([k, emo]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setFacts(t.facts[['build', 'detect', 'repair'].indexOf(v)]);
  lab.setGlow('rgba(240, 178, 122, .28)');
  if (sec === 'harsh') renderHarsh(t); else if (sec === 'own') renderOwn(t);
  else if (v === 'build') renderBuild(t); else if (v === 'detect') renderDetect(t); else renderRepair(t);
}

function renderBuild(t) {
  const b = t.b, all = S.pick.every((p) => p !== null), shown = S.shown;
  const pcs = [0, 1, 2, 3].map((i) => {
    const p = S.pick[i], txt = p === null ? `${i + 1}. ${b.slotLab[i]} …` : b.opts[i][p][0];
    const cls = p === null ? '' : shown ? (p === OKI[i] ? 'good' : 'bad') : 'on';
    return `<button class="im-pc ${cls} ${S.slot === i && !shown ? 'cur' : ''}" data-act="slot" data-i="${i}">${esc(txt)}</button>`;
  }).join('');
  let html = `<div class="im-pre">${pcs}</div>`;
  if (!all) {
    const i = S.slot;
    html += `<p class="im-q">${esc(b.pickN(i + 1))}: ${esc(b.slotLab[i])}</p><div class="im-opts">${b.opts[i].map((o, j) =>
      `<button class="im-opt" data-act="opt" data-i="${i}" data-j="${j}">${esc(o[0])}</button>`).join('')}</div>`;
  } else if (!S.said) {
    html += `<p class="im-q">${esc(b.predQ)}</p><div class="im-row" style="margin-top:0">
      <button class="chip ${S.pred === 'up' ? 'on' : ''}" style="min-height:40px" data-act="pred" data-v="up">${esc(b.up)}</button>
      <button class="chip ${S.pred === 'down' ? 'on' : ''}" style="min-height:40px" data-act="pred" data-v="down">${esc(b.down)}</button>
      <button class="btn im-go" data-act="say" ${S.pred ? '' : 'disabled'}>${esc(b.say)}</button></div>`;
  } else if (!shown) html += `<p class="im-q">…</p>`;
  else {
    const why = S.pick.map((p, i) => (p === OKI[i] ? '' : `<li>${i + 1}. ${esc(b.opts[i][p][1])}</li>`)).join('');
    html += (why ? `<p class="im-q">${esc(b.whyHead)}</p><ul class="im-why">${why}</ul>` : '') + `<div class="im-row"><button class="btn im-go" data-act="again">${esc(b.again)}</button></div>`;
  }
  $('secBuild').innerHTML = html;
  if (!shown) {
    lab.setReadout('?', b.sub, '', '#f0b27a');
    lab.setState({ emo: '🐝', title: all ? b.predQ : b.pickN(Math.min(S.slot + 1, 4)), lead: b.story, body: b.intro, extra: '' });
  } else {
    const nb = S.pick.filter((p, i) => p !== OKI[i]).length, r = b.res[S.lvl], ok = (S.pred === 'up') === (nb > 0);
    lab.setReadout(`${4 - nb}/4`, b.sub, '', '#f0b27a');
    lab.setState({ emo: S.lvl === 0 ? '🌉' : '🛡️', title: `${ok ? b.right : b.wrong} ${r.t}`, lead: `${t.kim}: ${r.kim}`, body: `${r.lead} ${ok ? b.rightL : b.wrongL}`, extra: '' });
  }
}

function renderDetect(t) {
  const d = t.d, end = S.di >= 8;
  if (end) {
    $('secDetect').innerHTML = `<div class="im-row" style="margin-top:0"><button class="btn im-go" data-act="dagain">${esc(d.again)}</button></div>`;
    lab.setReadout(`${S.score}/8`, d.count(8, 8), '', '#ff9a3c');
    lab.setState({ emo: '🏆', title: d.endT(S.score, 8), lead: d.endL, body: '', extra: '' });
    return;
  }
  const s = curSent(), toks = parse(s.s), ph = S.dph, checked = ph !== 'mark';
  const words = toks.map((tk, i) => {
    let cls = '';
    if (checked) {
      const m = S.marks.has(i);
      cls = tk.sting ? (m ? 'hit' : 'miss') : (m ? 'fp' : '');
    } else if (S.marks.has(i)) cls = 'sel';
    return `<button class="im-w ${cls}" data-act="w" data-i="${i}" ${checked ? 'disabled' : ''}>${esc(tk.w)}</button>`;
  }).join('');
  let html = `<p class="im-q">${esc(d.count(S.di + 1, 8))} · ${esc(d.q)}</p><div class="im-sent">${words}</div>`;
  if (ph === 'mark') html += `<div class="im-row" style="margin-top:0"><button class="btn im-go" data-act="dcheck">${esc(d.check)}</button></div>`;
  else {
    html += `<div class="im-leg">${esc(d.leg)}</div>`;
    if (ph === 'rewrite') html += `<p class="im-q">${esc(d.rewQ)}</p><div class="im-opts">${s.r.map((r, j) =>
      `<button class="im-opt" data-act="rew" data-j="${j}" ${S.rwrong.has(j) ? 'disabled' : ''}>${esc(r)}</button>`).join('')}</div>`;
    else {
      if (s.r) html += `<div class="im-opts"><button class="im-opt ok" disabled>${esc(s.r[s.ok])}</button></div>`;
      html += `<div class="im-row"><button class="btn im-go" data-act="dnext">${esc(d.next)}</button></div>`;
    }
  }
  $('secDetect').innerHTML = html;
  if (!checked) { lab.setReadout('?', d.count(S.di + 1, 8), '', '#ff9a3c'); lab.setState({ emo: '🔎', title: d.q, lead: '', body: '', extra: '' }); return; }
  lab.setReadout(S.tot ? `${S.fnd}/${S.tot}` : '✓', S.tot ? d.found : d.calmSub, '', '#ff9a3c');
  let st;
  if (ph === 'rewrite' && S.rwrong.size) st = { emo: '🤔', title: d.tRewBad, lead: d.lRewBad };
  else if (ph === 'done' && S.tot) st = { emo: '🌉', title: d.tRew, lead: d.lRew };
  else if (S.tot === 0) st = S.exact ? { emo: '✅', title: d.tCalm, lead: d.lCalm } : { emo: '🙂', title: d.tCalm2, lead: d.lCalm2 };
  else st = S.exact ? { emo: '✅', title: d.tExact, lead: d.lExact } : { emo: '🤔', title: d.tPart, lead: d.lPart(S.fnd, S.tot, S.fp) };
  lab.setState({ ...st, body: ph === 'rewrite' && !S.rwrong.size ? d.rewQ : '', extra: '' });
}

function renderRepair(t) {
  const r = t.r, busy = S.busy, ph = S.rph;
  const pool = POOL_ORDER.filter((k) => !S.slots.includes(k));
  let html = `<p class="im-q">${esc(r.story)}</p>
    <div class="im-slots">${S.slots.map((k, i) => `<button class="im-sl ${k === null ? '' : 'on'} ${ph === 'wrong' && k !== null && i >= S.rbad ? 'bad' : ''} ${ph === 'ok' ? 'good' : ''}" data-act="unslot" data-i="${i}" ${busy ? 'disabled' : ''}>
      ${k === null ? `<b>${i + 1}</b>` : `<b>${STONE_EMO[k]}</b>${esc(r.stones[k][0])}`}</button>`).join('')}</div>`;
  if (pool.length) html += `<div class="im-opts">${pool.map((k) => `<button class="im-st" data-act="stone" data-i="${k}" ${busy ? 'disabled' : ''}>${STONE_EMO[k]} ${esc(r.stones[k][0])}<small>${esc(r.stones[k][1])}</small></button>`).join('')}</div>`;
  html += `<div class="im-row"><button class="btn im-go" data-act="cross" ${S.slots.includes(null) || busy || ph === 'ok' ? 'disabled' : ''}>${esc(r.cross)}</button>
    <button class="btn ghost im-go" data-act="rclear" ${busy ? 'disabled' : ''}>${esc(r.clear)}</button></div>`;
  if (ph === 'ok') html += `<div class="im-say">${esc(t.kim)}: ${esc(r.kimSide)}<br>${esc(r.surp)}</div>`;
  $('secRepair').innerHTML = html;
  const n = S.slots.filter((x) => x !== null).length;
  lab.setReadout(`${n}/4`, r.placed, '', '#8fa6c8');
  if (ph === 'ok') lab.setState({ emo: '🤝', title: r.okT, lead: r.okL, body: `${t.kim}: ${r.kimSide}`, extra: '' });
  else if (ph === 'wrong') {
    const i = S.rbad, k = S.slots[i], msg = k > i ? r.early[k] : r.late;
    lab.setState({ emo: '🪨', title: r.wobT, lead: msg, body: r.wobB, extra: '' });
  } else lab.setState({ emo: '🪨', title: t.views.repair.replace(/^\S+\s/, ''), lead: r.story, body: '', extra: '' });
}

function renderHarsh(t) {
  const h = t.h, lines = S.hv === 'H' ? h.H : h.G, hs = S.hs, cls = S.hv === 'H' ? 'h' : 'g';
  let html = `<p class="im-q">${esc(h.intro)}</p><div class="card seg small" style="margin-bottom:10px">${[['H', h.harsh], ['G', h.gentle]].map(([v, l]) =>
    `<button data-act="hv" data-v="${v}" class="${S.hv === v ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>
    <div class="im-tl">${[0, 1, 2, 3, 4].map((i) => `<i class="${i < hs ? cls : ''}"></i>`).join('')}</div>`;
  lines.slice(0, Math.min(hs, 4)).forEach(([who, s]) => { html += `<div class="im-bub ${who}">${esc(s)}</div>`; });
  if (hs >= 5) html += `<div class="im-end ${cls}">${esc(S.hv === 'H' ? h.endH : h.endG)}</div>`;
  html += `<div class="im-row"><button class="btn im-go" data-act="hnext">${esc(hs >= 5 ? h.again : h.next)}</button></div>`;
  $('secHarsh').innerHTML = html;
  lab.setReadout(`${hs}/5`, h.sub, '', S.hv === 'H' ? '#ff6a55' : '#3ddc97');
  lab.setState(hs >= 5 ? { emo: S.hv === 'H' ? '🚪' : '🤝', title: S.hv === 'H' ? h.tH : h.tG, lead: S.hv === 'H' ? h.lH : h.lG, body: '', extra: '' }
    : { emo: '🚪', title: S.hv === 'H' ? h.harsh : h.gentle, lead: h.intro, body: '', extra: '' });
}

function renderOwn(t) {
  const o = t.o;
  $('oQ').textContent = o.l;
  [0, 1, 2, 3].forEach((i) => { $(`oL${i}`).textContent = o.lab[i]; $(`oI${i}`).placeholder = o.ph[i]; });
  $('oFrame').innerHTML = [0, 1, 2, 3].map((i) => `${PLANK_EMO[i]} ${esc(o.pre[i])}${S.own[i].trim() ? `<u>${esc(S.own[i].trim())}</u>` : '<u>…</u>'}${esc(o.post[i])}`).join('<br>');
  const m = S.own.join(' ').match(o.re), filled = S.own.filter((x) => x.trim()).length;
  $('oWarn').textContent = m ? o.warn(m[0]) : filled ? o.fine : '';
  $('oWarn').style.color = m ? '' : 'var(--ok)';
  $('oNote').textContent = o.note;
  lab.setReadout(`${filled}/4`, o.sub, '', '#f0b27a');
  lab.setState({ emo: '✏️', title: o.t, lead: o.l, body: '', extra: '' });
}

syncScene(true);
render();
</script>
</body>
</html>
