  $('ppW').style.display = !sec && v === 'world' ? '' : 'none';
  $('ppX').style.display = sec ? '' : 'none';
  $('secChips').innerHTML = [['eg', '🏜️'], ['tw', '🗼']].map(([k, e]) => `<button class="chip secret pp-ch ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const asking = !sec && ((v === 'density' && S.dq) || (v === 'world' && !S.wDone));
  askEl.style.display = asking ? '' : 'none';
  bnEl.style.display = !sec && v === 'island' && !S.confirmed ? '' : 'none';
  if (sec) return renderSecret(t);
  if (v === 'island') {
    lab.setGlow('rgba(60,150,170,.28)');
    bnEl.textContent = t.isl.tap(S.pins.length);
    $('ppIpre').style.display = S.confirmed ? 'none' : ''; $('ppIpost').style.display = S.confirmed ? '' : 'none';
    $('bConfirm').textContent = t.isl.confirm; $('bConfirm').disabled = S.pins.length < 3;
    $('bUnpin').textContent = t.isl.unpin; $('bUnpin').style.display = S.pins.length ? '' : 'none';
    $('bRun').textContent = S.running ? t.isl.pause : S.year >= 200 ? t.isl.again : t.isl.run; $('bRedo').textContent = t.isl.redo;
    $('yrA').textContent = t.yearL(0); $('yrB').textContent = t.yearL(200);
    $('bTog').innerHTML = ['h', 'm', 'c', 'heat'].map((k) => `<button class="chip pp-ch ${S.tg[k] ? 'on' : ''}" data-act="tg" data-k="${k}">${esc(t.isl.tg[k])}</button>`).join('');
    islandInfo(); lab.setFacts(S.confirmed ? factsOf('isl') : []);
  } else if (v === 'density') {
    lab.setGlow('rgba(90,170,110,.26)');
    if (S.dq) {
      const P = PRED[S.dq], a = dName(P.a), b = dName(P.b);
      askEl.innerHTML = `<div class="q">${esc(t.den.q(a, b))}</div><div class="opts">${[a, b, t.den.same].map((s, i) => `<button data-a="${i}">${esc(s)}</button>`).join('')}</div>`;
    }
    $('dLbl').textContent = t.den.pick;
    $('dChips').innerHTML = COUNTRIES.map((C) => { const i = S.pick.indexOf(C.id); return `<button class="chip pp-ch ${i === 0 ? 'pp-a on' : i === 1 ? 'pp-b on' : ''}" data-act="pick" data-id="${C.id}"${S.dq ? ' disabled' : ''}>${esc(dName(C.id))}</button>`; }).join('');
    $('dG2').textContent = t.den.g2; $('dG2').style.display = S.rhDone && !S.dq ? '' : 'none';
    $('dCalc').innerHTML = S.dq ? '' : S.pick.map((id, i) => { const C = CBY[id]; return `<div style="border-left:3px solid ${i ? B_COL : A_COL}"><b>${esc(dName(id))}</b>: ${fmtN(C.pop)} ÷ ${fmtN(C.area)} km² = <b>${fmtD(C.d)}</b> ${esc(t.perKm)}</div>`; }).join('');
    $('dLbl').style.display = S.dq ? 'none' : ''; $('dChips').style.display = S.dq ? 'none' : '';
    densityInfo(); lab.setFacts(S.rhDone && !S.dq ? factsOf('den') : []);
  } else {
    lab.setGlow('rgba(240,170,70,.24)');
    if (!S.wDone) askEl.innerHTML = `<div class="q">${esc(t.wor.q)}</div><div class="opts">${t.wor.opts.map((s, i) => `<button data-a="${i}">${esc(s)}</button>`).join('')}</div>`;
    $('ppW').style.display = !S.wDone ? 'none' : '';
    $('wLbl').textContent = t.wor.drag;
    $('wChips').innerHTML = MS.map(([y, b]) => `<button class="chip pp-ch ${S.wy === y ? 'on' : ''}" data-act="ms" data-y="${y}">${b} ${esc(t.bn)} · ${y}</button>`).join('');
    worldInfo(); lab.setFacts(S.wDone ? factsOf('wor') : []);
  }
}
function renderSecret(t) {
  lab.setFacts([]);
  if (S.sec === 'eg') {
    lab.setGlow('rgba(220,180,90,.26)');
    $('ppX').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn pp-btn" data-act="egrev">${esc(S.egRev ? t.eg.hide : t.eg.reveal)}</button></div>`;
    if (S.egRev) { lab.setReadout(`${fmtN(98)} %`, t.eg.sub, t.eg.pill, '#3fae56'); lab.setState({ emo: '🏜️', title: t.eg.t1, lead: t.eg.l1, body: '', extra: '' }); }
    else { lab.setReadout('?', '', '', '#3fae56'); lab.setState({ emo: '🏜️', title: t.secrets.eg[0], lead: t.secrets.eg[1], body: '', extra: '' }); }
  } else {
    lab.setGlow('rgba(255,170,60,.26)');
    const p = S.twP, km2 = 8.3e9 / p / 1e6, pct = Math.round(km2 / 91260 * 100), side = Math.round(Math.sqrt(km2));
    $('ppX').innerHTML = `<div class="chips">${[3, 4, 5].map((q) => `<button class="chip pp-ch ${q === p ? 'on' : ''}" data-act="twp" data-p="${q}">${esc(t.tw.per(q))}</button>`).join('')}</div>
      <div class="row2"><button class="btn pp-btn" data-act="twrev">${esc(S.twRev ? t.eg.hide : t.tw.reveal)}</button></div>`;
    if (S.twRev) { lab.setReadout(`${fmtN(Math.round(km2))} km²`, t.tw.sub(pct), t.tw.pill(p), '#ffa94d');
      lab.setState({ emo: '🗼', title: t.tw.t1(fmtN(Math.round(km2))), lead: t.tw.l1(side, pct), body: t.tw.b(p, fmtN(8.3e9 / p / 1e9, 3), fmtN(Math.round(km2))), extra: '' }); }
    else { lab.setReadout('?', '', t.tw.pill(p), '#ffa94d'); lab.setState({ emo: '🗼', title: t.secrets.tw[0], lead: t.secrets.tw[1], body: '', extra: '' }); }
  }
}
render();
</script>
</body>
</html>
