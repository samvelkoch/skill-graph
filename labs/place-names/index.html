  $('secMean').style.display = v === 'meaning' && !S.sec ? '' : 'none';
  $('secTime').style.display = v === 'time' && !S.sec ? '' : 'none';
  $('secSec').style.display = S.sec ? '' : 'none';
  // the secrets stay hidden until the first guess is made: the quiz would give the guess away
  const open = secret.unlocked(), chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('pnCredit').innerHTML = `<a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">${esc(t.credit)}</a>`;
  $('pnCredit').style.display = v === 'ends' || S.sec === 'castra' ? '' : 'none';
  $('secChips').style.display = S.pred === null ? 'none' : '';
  $('secChips').innerHTML = chip('norse', '📜') + chip('castra', '🏛️');
  if (S.sec) renderSecret(t); else if (v === 'ends') renderEnds(t); else if (v === 'meaning') renderMean(t); else renderTime(t);
}

function renderEnds(t) {
  const e = t.e, n = HAND.length;
  lab.setGlow('rgba(120, 170, 100, .26)');
  if (S.pred === null) {
    $('secEnds').innerHTML = `<div class="pn-card"><p class="pn-q">${esc(e.predQ)}</p><div class="pn-opts">${e.predO.map((o, i) => `<button class="pn-opt" data-act="pred" data-i="${i}">${esc(o)}</button>`).join('')}</div></div>`;
    lab.setReadout('?', e.subPred, '', '#c9a24a');
    lab.setState({ emo: e.s0[0], title: e.s0[1], lead: e.s0[2], body: '', extra: '' });
    lab.setFacts([]);
  } else if (!S.done) {
    const q = TOWNS[HAND[S.cur]];
    $('secEnds').innerHTML = `<div class="pn-card ${S.wrong ? 'pn-shake' : ''}"><p class="pn-sm" style="margin:0 0 4px;text-align:center">${esc(e.sortQ)}</p><div class="pn-name">${esc(q.n)}</div>
      <div class="pn-bk"><button class="n" data-act="bk" data-k="n">${esc(e.bk[0])}</button><button class="e" data-act="bk" data-k="e">${esc(e.bk[1])}</button></div>
      <div class="pn-dots">${HAND.map((_, i) => `<i class="${i < S.cur ? 'on' : ''}"></i>`).join('')}</div></div>`;
    S.wrong = false;
    lab.setReadout(`${S.cur}/${n}`, e.subSort, e.pillGuess(e.predO[S.pred].toLowerCase()), '#c9a24a');
    const [emo, ti, le] = e.sortS(S.cur + 1, n);
    lab.setState({ emo, title: ti, lead: le, body: S.msg ?? '', extra: '' });
    lab.setFacts(e.facts);
  } else {
    $('secEnds').innerHTML = `<div class="pn-btns" style="margin-top:0"><button class="chip" data-act="again">${esc(e.again)}</button><span class="pn-sm" style="color:var(--mut);margin:0">${esc(e.tap)}</span></div>`;
    lab.setReadout(`${IN_N}/${NN}`, e.subDone, e.pillGuess(e.predO[S.pred].toLowerCase()), '#e0aa32');
    const sel = S.sel !== null ? TOWNS[S.sel] : null;
    lab.setState({ emo: S.pred === 0 ? '✅' : '🤔', title: S.pred === 0 ? e.good : e.bad, lead: e.lead(IN_N, NN, IN_E, NE), body: sel ? e.ok(sel.n, sel.end) + ' ' + e.body : e.body, extra: '' });
    lab.setFacts(e.facts);
  }
}

function renderMean(t) {
  const m = t.m, ti = S.ti;
  lab.setGlow('rgba(217, 150, 70, .24)');
  const solvedN = S.solved.filter(Boolean).length;
  if (ti >= 4) {
    $('secMean').innerHTML = `<div class="pn-btns" style="margin-top:0"><button class="btn" data-act="magain">${esc(m.again)}</button></div>`;
    lab.setReadout(`${solvedN}/4`, m.solvedSub, '', '#d99646');
    lab.setState({ emo: m.end[0], title: m.end[1], lead: m.end[2], body: '', extra: '' });
    lab.setFacts(m.facts);
    return;
  }
  const A = S.a !== null ? m.A[S.a] : null, B = S.b !== null ? m.B[S.b] : null, done = S.res?.ok;
  $('secMean').innerHTML = `<div class="pn-card ${S.res && !S.res.ok ? 'pn-shake' : ''}"><p class="pn-sm" style="margin:0 0 4px">${esc(m.task(ti + 1, 4))}</p><p class="pn-q" style="margin:0 0 4px">${esc(m.tasks[ti])}</p>
    <div class="pn-lbl">${esc(m.pickA)}</div><div class="pn-row">${m.A.map((p, i) => `<button class="pn-opt ${S.a === i ? 'on' : ''}" data-act="pa" data-i="${i}" ${done ? 'disabled' : ''}>${esc(p[0])}</button>`).join('')}</div>
    <div class="pn-lbl">${esc(m.pickB)}</div><div class="pn-row">${m.B.map((p, i) => `<button class="pn-opt ${S.b === i ? 'on' : ''}" data-act="pb" data-i="${i}" ${done ? 'disabled' : ''}>${esc(p[0])}</button>`).join('')}</div>
    <div class="pn-btns">${done ? `<button class="btn" data-act="mnext">${esc(m.next)}</button>` : `<button class="btn" data-act="mcheck" ${A && B ? '' : 'disabled'}>${esc(m.check)}</button>`}</div></div>`;
  lab.setReadout(`${solvedN}/4`, m.solvedSub, '', '#d99646');
  if (done) lab.setState({ emo: '✅', title: `${t.right} ${m.names[ti]}`, lead: m.origin[ti], body: '', extra: '' });
  else if (S.res) lab.setState({ emo: '🤔', title: m.wrongT, lead: m.wrong(A, B), body: m.wrongL, extra: '' });
  else if (A && B) lab.setState({ emo: '🧩', title: m.combo(A, B), lead: m.pre(A, B), body: '', extra: '' });
  else if (A) lab.setState({ emo: '🧩', title: A[0] + ' + …', lead: m.preA(A), body: '', extra: '' });
  else if (B) lab.setState({ emo: '🧩', title: '… + ' + B[0], lead: m.preB(B), body: '', extra: '' });
  else { const s0 = m.s0(m.tasks[ti]); lab.setState({ emo: s0[0], title: s0[1], lead: s0[2], body: m.s0b, extra: '' }); }
  lab.setFacts(m.facts);
}

function renderTime(t) {
  const tt = t.t, placed = S.slots.filter((x) => x !== null).length, lockedN = S.locked.filter(Boolean).length, all = lockedN === 6;
  lab.setGlow('rgba(95, 120, 200, .26)');
  const tray = shuffleOrder.filter((k) => !S.slots.includes(k));
  $('secTime').innerHTML = `${tray.length ? `<div class="pn-tray">${tray.map((k) => `<button class="pn-tc" data-act="tray" data-i="${k}"><span class="e">${['🏛️', '🚩', '⚓', '📜', '👑', '🏰'][k]}</span><span>${esc(tt.cards[k].t)}<small>${esc(tt.cards[k].c)}</small></span></button>`).join('')}</div>` : ''}
    <div class="pn-btns">${all ? `<button class="btn" data-act="tagain">${esc(tt.again)}</button>` : `<button class="btn" data-act="tcheck" ${placed === 6 ? '' : 'disabled'}>${esc(tt.check)}</button>`}</div>`;
  lab.setReadout(`${lockedN}/6`, tt.sub, '', '#7f93e0');
  if (all) {
    const yrs = Math.round((1066 - 410) / 50) * 50;
    lab.setState({ emo: '🎉', title: tt.allT, lead: tt.allLead(yrs), body: '', extra: `<div class="pn-card pn-close" style="margin-top:2px">${tt.close}</div>` });
    lab.setFacts(tt.facts);
  } else if (S.msgT !== null) {
    lab.setState({ emo: '🔎', title: tt.k(S.msgT), lead: tt.kLead, body: S.slots.map((x, s) => (S.locked[s] ? `${s + 1}. ${tt.cards[x].t}, ${tt.cards[x].y}` : '')).filter(Boolean).join(' · '), extra: '' });
    lab.setFacts([]);
  } else { lab.setState({ emo: '⏳', title: tt.title0, lead: tt.lead0, body: tt.body0, extra: '' }); lab.setFacts([]); }
}

function renderSecret(t) {
  if (S.sec === 'norse') {
    const s = t.sn, [w, n, m] = s.words[S.nw];
    $('secSec').innerHTML = `<div class="pn-row">${s.words.map((x, i) => `<button class="chip ${S.nw === i ? 'on' : ''}" data-act="nw" data-i="${i}">${esc(x[0])}</button>`).join('')}</div>`;
    lab.setReadout(esc(w), `${s.from}: ${n}`, '', '#ffd666');
    lab.setState({ emo: '📜', title: s.t, lead: s.lead(w, n, m), body: s.body, extra: '' });
    lab.setFacts([{ emo: '📜', text: s.lead(w, n, m), src: s.src }]);
  } else {
    const s = t.sc, c = s.towns[S.cs];
    $('secSec').innerHTML = `<div class="pn-row">${s.towns.map((x, i) => `<button class="chip ${S.cs === i ? 'on' : ''}" data-act="cs" data-i="${i}">${esc(x[0])}</button>`).join('')}</div>`;
    lab.setReadout(esc(c[0]), '', '', '#d49a1c');
    lab.setState({ emo: '🏛️', title: s.t, lead: s.lead, body: c[1] + ' ' + s.body, extra: '' });
    lab.setFacts([{ emo: '🏛️', text: s.lead, src: s.src }]);
  }
}
render();
</script>
</body>
</html>
