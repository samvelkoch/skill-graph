    const lc = sizeCanvas(roadSlots[i].layer, RW * dev, RH * dev); lc.setTransform(roadSlots[i].layer.width / RW, 0, 0, roadSlots[i].layer.height / RH, 0, 0);
    paintRoad(lc, st, fs);
    c.save(); c.shadowColor = 'rgba(0, 0, 0, .5)'; c.shadowBlur = 8 * k * dpr; c.shadowOffsetY = 4 * k * dpr; c.fillStyle = '#06284f'; rr(c, wx - 78, -61, 156, 72, 7); c.fill(); c.restore();
    c.save(); c.translate(wx, -25); blit(c, roadSlots[i], B, RW, RH); c.restore();
  });
  c.restore();
  pill(c, T[lang].m(D), g.ox + g.sc * 170, g.oy + g.sc * 286);
}

// --- secret B: a letter of your own on a 5 x 7 dot grid ----------------------------------------------------------------
const GRID = { cell: 25, gx: 107.5, gy: 104 };
function drawOwn(c, w, h, dt, time) {
  const g = fitBox(w, h), dpr = c.getTransform().a;
  const bgr = c.createRadialGradient(w / 2, h * 0.5, 20, w / 2, h * 0.5, Math.max(w, h) * 0.8); bgr.addColorStop(0, '#2a2330'); bgr.addColorStop(1, '#100d16'); c.fillStyle = bgr; c.fillRect(0, 0, w, h);
  c.save(); c.translate(g.ox, g.oy); c.scale(g.sc, g.sc);
  // the mini sign
  c.save(); c.shadowColor = 'rgba(0, 0, 0, .5)'; c.shadowBlur = 12 * g.sc * dpr; c.shadowOffsetY = 5 * g.sc * dpr;
  const fg = c.createLinearGradient(0, 10, 0, 84); fg.addColorStop(0, '#4a2e20'); fg.addColorStop(1, '#2a180f'); rr(c, 20, 10, 300, 74, 10); c.fillStyle = fg; c.fill(); c.restore();
  const bg = c.createLinearGradient(26, 16, 160, 90); bg.addColorStop(0, '#fffaf0'); bg.addColorStop(1, '#f1e3be'); rr(c, 27, 17, 286, 60, 5); c.fillStyle = bg; c.fill(); c.strokeStyle = '#d3bf8a'; c.lineWidth = 1; c.stroke();
  const word = [...T[lang].word], rest = word.slice(1).join(''), capT = 34, dot = capT / 7, cw = 5 * dot;
  c.font = `800 100px ${FF.inter.fam}`; const cap100 = c.measureText('H').actualBoundingBoxAscent || 72, fs = (100 * capT) / cap100;
  c.font = `800 ${fs}px ${FF.inter.fam}`; const rw = c.measureText(rest).width, total = cw + 5 + rw, x0 = 170 - total / 2, top = 47 - capT / 2;
  c.fillStyle = '#2b1b14';
  for (let i = 0; i < 35; i++) if (S.glyph[i]) { const cx = i % 5, cy = Math.floor(i / 5); rr(c, x0 + cx * dot - 0.15, top + cy * dot - 0.15, dot + 0.3, dot + 0.3, dot * 0.28); c.fill(); }
  c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(rest, x0 + cw + 5, top + capT);
  // the grid
  const { cell, gx, gy } = GRID, cg = c.createLinearGradient(gx - 10, gy - 10, gx + 135, gy + 185); cg.addColorStop(0, '#2c3350'); cg.addColorStop(1, '#171b2e');
  rr(c, gx - 10, gy - 10, 145, 195, 12); c.fillStyle = cg; c.fill(); c.strokeStyle = 'rgba(130, 145, 190, .4)'; c.lineWidth = 1; c.stroke();
  for (let i = 0; i < 35; i++) {
    const cx = gx + (i % 5) * cell + cell / 2, cy = gy + Math.floor(i / 5) * cell + cell / 2;
    if (S.glyph[i]) {
      const dg = c.createRadialGradient(cx - 4, cy - 4, 1, cx, cy, cell * 0.5); dg.addColorStop(0, '#ffe9a8'); dg.addColorStop(1, '#e8a330');
      rr(c, cx - cell * 0.4, cy - cell * 0.4, cell * 0.8, cell * 0.8, cell * 0.22); c.fillStyle = dg; c.fill(); c.strokeStyle = '#a8701a'; c.lineWidth = 1; c.stroke();
    } else { c.beginPath(); c.arc(cx, cy, cell * 0.14, 0, Math.PI * 2); c.fillStyle = 'rgba(255, 255, 255, .2)'; c.fill(); }
  }
  c.restore();
}
const toDesign = (ev) => { const r = $('cv').getBoundingClientRect(), g = fitBox(r.width, r.height); return { x: (ev.clientX - r.left - g.ox) / g.sc, y: (ev.clientY - r.top - g.oy) / g.sc }; };
const cellAt = (ev) => {
  const p = toDesign(ev), cx = Math.floor((p.x - GRID.gx) / GRID.cell), cy = Math.floor((p.y - GRID.gy) / GRID.cell);
  return cx >= 0 && cx < 5 && cy >= 0 && cy < 7 ? cy * 5 + cx : -1;
};

// --- the loop -----------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (!fontsOk) { c.fillStyle = '#0e1220'; c.fillRect(0, 0, w, h); return; }
  if (S.sec === 'road') return drawRoad(c, w, h);
  if (S.sec === 'own') return drawOwn(c, w, h, dt, time);
  if (lab.view === 'read') drawRead(c, w, h, dt, time);
  else if (lab.view === 'mood') drawMood(c, w, h, dt, time);
  else drawSpace(c, w, h, dt, time);
});

// --- controls ------------------------------------------------------------------------------------------------------
function askHTML(kind, q, opts, ok, ans, okText, noText) {
  const done = ans !== null;
  return `<p class="lt-q">${esc(q)}</p><div class="lt-opts">${opts.map((o, i) => `<button type="button" class="lt-opt${done ? (i === ok ? ' good' : i === ans ? ' bad' : ' dim') : ''}" data-act="ask" data-k="${kind}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>${done ? `<p class="lt-verdict ${ans === ok ? 'ok' : 'no'}">${esc(ans === ok ? okText : noText)}</p>` : ''}`;
}
function endDuo() { if (!S.duo) return; S.dd = duoD(); S.duo = false; }
function answer(kind, i) {
  if (kind === 'read') { if (S.askedR) return; S.askedR = true; S.ansR = i; S.tAns = nowS(); (i === 1 ? sfx.good : sfx.bad)(); }
  else if (kind === 'mood') {
    if (S.askedM) return; S.askedM = true; S.ansM = i; (i === 2 ? sfx.good : sfx.bad)();
    S.placed.bank = 'playfair'; S.react.bank = nowS(); S.lastFont = 'playfair';
  } else {
    if (S.askedS) return; S.askedS = true; S.ansS = i; S.showGaps = true; S.tGap = nowS(); (i === 2 ? sfx.good : sfx.bad)();
  }
  showStage(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'ask') return answer(b.dataset.k, +b.dataset.i);
  if (act === 'font') { endDuo(); S.font = b.dataset.f; sfx.click(); }
  else if (act === 'wt') { endDuo(); S.wt = b.dataset.w; sfx.click(); }
  else if (act === 'mode') {
    if (!prof) return;
    S.xs = (b.dataset.m === 'equal' ? xsEq : xsOpt).slice(); S.drag = null; sfx.click();
  } else if (act === 'gaps') { S.showGaps = !S.showGaps; S.tGap = nowS(); sfx.click(); }
  else if (act === 'tile') return; // tiles are handled by pointer events
  else if (act === 'clear') { S.glyph = new Array(35).fill(false); store.set('typefaces:glyph:' + lang, S.glyph.map(Number)); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'ltDist') { endDuo(); S.d = +ev.target.value; render(); }
  else if (ev.target.id === 'ltRoadD') { S.dRoad = +ev.target.value; render(); }
});
// mood tiles: drag a tile onto a shop, or tap a tile and then a shop
let td = null, ghost = null;
const endTile = () => { td = null; ghost?.remove(); ghost = null; S.hover = null; };
$('ltTiles').addEventListener('pointerdown', (ev) => {
  const b = ev.target.closest('.lt-tile'); if (!b) return;
  td = { f: b.dataset.f, x0: ev.clientX, y0: ev.clientY, moved: false };
  try { b.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
});
$('ltTiles').addEventListener('pointermove', (ev) => {
  if (!td) return;
  if (!td.moved && Math.hypot(ev.clientX - td.x0, ev.clientY - td.y0) > 8) {
    td.moved = true; ghost = document.createElement('div'); ghost.className = 'lt-ghost';
    ghost.style.fontFamily = FF[td.f].fam; ghost.style.fontWeight = FF[td.f].bold; ghost.textContent = T[lang].open; document.body.append(ghost);
  }
  if (td.moved) { ghost.style.transform = `translate(${ev.clientX - 40}px, ${ev.clientY - 52}px)`; S.hover = shopAt(ev.clientX, ev.clientY); }
});
$('ltTiles').addEventListener('pointerup', (ev) => {
  if (!td) return;
  const { f, moved } = td, k = moved ? shopAt(ev.clientX, ev.clientY) : null; endTile();
  if (moved) { if (k) place(k, f); }
  else { S.sel = S.sel === f ? null : f; sfx.tick(); render(); }
});
$('ltTiles').addEventListener('pointercancel', endTile);
// the picture: tap a shop with a tile selected; drag the letters in the space view; paint dots in the secret grid
const cv = $('cv');
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec === 'own') {
    const i = cellAt(ev); if (i < 0) return;
    S.paint = !S.glyph[i]; S.glyph[i] = S.paint; sfx.tick(); try { cv.setPointerCapture(ev.pointerId); } catch { /* ok */ } render(); return;
  }
  if (S.sec) return;
  if (lab.view === 'mood' && S.askedM && S.sel) { const k = shopAt(ev.clientX, ev.clientY); if (k) place(k, S.sel); return; }
  if (lab.view === 'space' && S.askedS && prof) {
    const p = toDesign(ev); if (p.y < 80 || p.y > 235) return;
    let best = -1, bd = 1e9;
    prof.forEach((q, i) => {
      const lx = PX(S.xsShow[i] + q.left), rx = PX(S.xsShow[i] + q.right), d = p.x < lx ? lx - p.x : p.x > rx ? p.x - rx : 0, cd = Math.abs(p.x - (lx + rx) / 2);
      if (d <= 12 && (d < bd || (d === bd && cd < Math.abs(p.x - PX(S.xsShow[best] + (prof[best].left + prof[best].right) / 2))))) { bd = d; best = i; }
    });
    if (best < 0) return;
    S.xs = S.xsShow.slice(); S.drag = { i: best, dx: PX(S.xs[best]) - p.x }; sfx.tick();
    try { cv.setPointerCapture(ev.pointerId); } catch { /* ok */ }
  }
});
cv.addEventListener('pointermove', (ev) => {
  if (S.sec === 'own') { if (S.paint === null) return; const i = cellAt(ev); if (i >= 0 && S.glyph[i] !== S.paint) { S.glyph[i] = S.paint; sfx.tick(); } return; }
  const d = S.drag; if (!d || !prof) return;
  const p = toDesign(ev), q = prof[d.i], n = prof.length;
  let x = (p.x + d.dx - lay.x0d) / lay.kd + lay.leftEq;
  const lo = Math.max((16 - lay.x0d) / lay.kd + lay.leftEq - q.left, d.i > 0 ? S.xs[d.i - 1] + offMin(prof[d.i - 1], q, 2) : -1e9);
  const hi = Math.min((324 - lay.x0d) / lay.kd + lay.leftEq - q.right, d.i < n - 1 ? S.xs[d.i + 1] - offMin(q, prof[d.i + 1], 2) : 1e9);
  x = clamp(x, lo, Math.max(lo, hi)); S.xs[d.i] = x; S.xsShow = S.xs.slice();
  spaceReadout(T[lang]); syncModeChips();
});
const endPtr = () => {
  if (S.paint !== null) { S.paint = null; store.set('typefaces:glyph:' + lang, S.glyph.map(Number)); }
  S.drag = null;
};
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);

// --- one render per change ------------------------------------------------------------------------------------------
function onLang() { loadGlyph(); buildProfiles(); render(); }
function onView() { S.sec = null; S.sel = null; S.drag = null; render(); }
function syncModeChips() {
  const eq = isEqual();
  document.querySelectorAll('#ltMode button').forEach((b) => b.classList.toggle('on', (b.dataset.m === 'equal') === eq));
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  show('ltRead', !sec && v === 'read'); show('ltMood', !sec && v === 'mood'); show('ltSpace', !sec && v === 'space'); show('ltRoad', sec === 'road'); show('ltOwn', sec === 'own');
  $('cv').style.touchAction = sec === 'own' ? 'none' : 'pan-y';
  const open = secret.unlocked();
  $('ltSecs').innerHTML = [['road', '🛣️', 'a'], ['own', '🔠', 'b']].map(([k, emo, tk]) => `<button type="button" class="chip lt-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[tk][0])}` : '🔒 ???'}</button>`).join('');
  $('gauge').style.visibility = 'hidden';
  if (sec === 'road') return renderRoad(t);
  if (sec === 'own') return renderOwn(t);
  if (v === 'read') renderRead(t); else if (v === 'mood') renderMood(t); else renderSpace(t);
}
function renderRead(t) {
  const asking = !S.askedR;
  $('ltReadCtl').style.display = asking ? 'none' : 'block';
  $('ltAskRead').innerHTML = askHTML('read', t.readAsk, t.readOpts, 1, S.ansR, t.readRight, t.readWrong);
  $('ltDistL').textContent = t.distance; $('ltDist').value = S.d; $('ltDistV').textContent = t.m(S.d);
  $('ltFonts').innerHTML = FONTS.map((f) => `<button type="button" class="chip lt-c${!S.duo && S.font === f ? ' on' : ''}" data-act="font" data-f="${f}" style="font-family:${FF[f].fam};font-weight:${FF[f].bold}">${esc(t.fonts[f])}</button>`).join('');
  $('ltWt').innerHTML = ['thin', 'bold'].map((w) => `<button type="button" data-act="wt" data-w="${w}" class="${!S.duo && S.wt === w ? 'on' : ''}">${esc(t[w])}</button>`).join('');
  lab.setGlow('rgba(217, 130, 95, .26)');
  if (asking) {
    lab.setReadout('?', '', '', '#7a8bd1'); lab.setState({ emo: '🤔', title: t.readAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); return;
  }
  const st = t.st.read; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' }); lab.setFacts(t.facts.read);
  if (S.duo) { lab.setReadout(t.m(40), '', t.illus, '#7a8bd1'); return; }
  const sc = scoreOf(S.d, S.font, S.wt), s = statusOf(sc);
  lab.setReadout([t.readable, t.hard, t.notReadable][s], t.m(S.d), t.illus, STC[s]);
  $('gauge').style.visibility = 'visible';
  lab.setGauge(sc / 18, [{ f: 0, label: '' }, { f: 0.5, label: t.readable }], '👀');
}
function renderMood(t) {
  const asking = !S.askedM;
  $('ltTilesWrap').style.display = asking ? 'none' : 'block';
  $('ltAskMood').innerHTML = askHTML('mood', t.moodAsk, t.moodOpts, 2, S.ansM, t.moodRight, t.moodWrong);
  $('ltTiles').innerHTML = FONTS.map((f) => `<button type="button" class="lt-tile${S.sel === f ? ' on' : ''}" data-act="tile" data-f="${f}"><span class="lt-tw" style="font-family:${FF[f].fam};font-weight:${FF[f].bold}">${esc(t.open)}</span><span class="lt-tn">${esc(t.fonts[f])}</span></button>`).join('');
  lab.setGlow('rgba(232, 84, 107, .24)');
  if (asking) { lab.setReadout('?', '', '', '#7a8bd1'); lab.setState({ emo: '🤔', title: t.moodAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  const st = t.st.mood, k = fitCount();
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' }); lab.setFacts(t.facts.mood);
  lab.setReadout(t.fits(k), '', S.lastFont ? t.fonts[S.lastFont] : '', k === 3 ? '#3ddc97' : '#e8546b');
}
function renderSpace(t) {
  const asking = !S.askedS;
  $('ltSpaceCtl').style.display = asking ? 'none' : 'flex';
  $('ltAskSpace').innerHTML = askHTML('space', t.spaceAsk, t.spaceOpts, 2, S.ansS, t.spaceRight, t.spaceWrong);
  $('ltAskSpace').style.marginTop = asking ? '0' : '12px';
  $('ltMode').innerHTML = [['equal', t.equal], ['optical', t.optical]].map(([m, label]) => `<button type="button" data-act="mode" data-m="${m}">${esc(label)}</button>`).join('');
  syncModeChips();
  $('ltGaps').textContent = (S.showGaps ? '✓ ' : '') + t.showGaps; $('ltGaps').classList.toggle('on', S.showGaps);
  lab.setGlow('rgba(95, 140, 210, .26)');
  if (asking) { spaceReadout(t); lab.setState({ emo: '🤔', title: t.spaceAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  const st = t.st.space; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' }); lab.setFacts(t.facts.space);
  spaceReadout(t);
}
function renderRoad(t) {
  $('ltRoadL').textContent = t.distance; $('ltRoadD').value = S.dRoad; $('ltRoadV').textContent = t.m(S.dRoad);
  lab.setGlow('rgba(23, 104, 204, .3)'); lab.setReadout(t.m(S.dRoad), '', '', '#1768cc');
  lab.setState({ emo: '🛣️', title: t.secrets.a[0], lead: t.roadText, body: '', extra: '' }); lab.setFacts(t.facts.read);
}
function renderOwn(t) {
  lab.setGlow('rgba(232, 163, 48, .28)'); lab.setReadout('🔠', '', '', '#e8a330');
  lab.setState({ emo: '🔠', title: t.secrets.b[0], lead: t.ownText, body: '', extra: '' }); lab.setFacts([]);
}

// fonts: the canvas needs them loaded before its first text
const loads = [];
FONTS.forEach((f) => [FF[f].thin, FF[f].bold].forEach((wg) => loads.push(document.fonts.load(`${wg} 40px ${FF[f].fam}`, SAMPLE).catch(() => null))));
Promise.race([Promise.all(loads), new Promise((r) => setTimeout(r, 4500))]).then(() => document.fonts.ready).then(() => { fontsOk = true; buildProfiles(); render(); });
render();
</script>
