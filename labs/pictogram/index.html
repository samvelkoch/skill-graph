      make: { n: ['✏️', 'Rajzold le a szavazatokat', 'Egy kép = 2 szavazat.'], f: ['✏️', 'Fél képek a páratlan számokhoz', 'Fél kép = a kulcs fele.'] },
      key: { n: ['🔑', 'Túl sok csillag', 'A diagram nem fér el.'], f: ['🔑', 'Nagyobb kulcs, rövidebb diagram', 'Ugyanazok a számok, kevesebb kép.'] },

};
const TOPICS = [
  { id: 'mt_r8XnXwRA6g', en: 'Representing numbers with objects (age 8+)', ru: 'Изображение чисел с помощью предметов (8+ лет)', hu: 'Számok ábrázolása tárgyakkal (8 éves kortól)' },
];

// --- palette and small helpers -----------------------------------------------------------------------------
const PAPER = '#FFF8EA', INK = '#2B2140', GOLD = '#F2B04A', NAVY = '#1E2A4A';
const SANS = 'Nunito, ui-rounded, system-ui, sans-serif', SERIF = "'EB Garamond', Georgia, serif";
const TAU = Math.PI * 2;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const easeInOut = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };
const easeOutBack = (t) => { t = clamp01(t); const c1 = 1.70158, c3 = c1 + 1; return Math.max(0, 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2)); };
const now = () => performance.now() / 1000;
const fmt = (n) => (Number.isInteger(n) ? String(n) : `${Math.floor(n) || ''}½`);
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, r)); };

// --- data --------------------------------------------------------------------------------------------------
const FACES = [['#FFD27A', GOLD], ['#FF8A8E', '#E5484D'], ['#B58CE8', '#8E5CC9'], ['#FFEB8A', '#FFD84A']];
const READ_PICS = [[3, 0], [2, 1], [5, 0], [0, 1]]; // whole pictures, half picture (apples, key 2)
const READ_Q = [{ rows: [0], ok: 1 }, { rows: [1], ok: 0 }, { rows: [0, 1, 2, 3], ok: 1 }];
const MAKE_KINDS = ['banana', 'apple', 'grape'], MAKE_VOTES = [8, 5, 10], MAKE_TARGET = [4, 2.5, 5];
const STAR_ROWS = [20, 10, 30];
const FRUIT_KEY = ['banana', 'apple', 'grape'];
const MAKE_MAXW = 6; // whole pictures per row in the make view (plus one half)
const FLESH = { apple: '#FFE9C2', banana: '#FFF3B8', grape: '#D9C2F5', star: '#FFE9B0' };

// --- state -------------------------------------------------------------------------------------------------
const S = {
  read: { r: 0, picked: null, revT: null, ticks: 0 },
  make: { picked: null, revT: null, rows: [[], [], []], done: false },
  key: { picked: null, revT: null, k: 1, bk: null, bt: 0, seq: false },
  sec: null, secT: 0, tIn: now(),
};
const lab = shell({ key: 'pictogram', T, topics: TOPICS, views: ['read', 'make', 'key'], onLang: render, onView: () => { S.sec = null; S.tIn = now(); S.key.bk = null; render(); } });
const secret = secretLab('pictogram', () => ({
  secrets: [{ emo: '📏', title: T[lang].secrets.bars[0], desc: T[lang].secrets.bars[1] }, { emo: '🎈', title: T[lang].secrets.trick[0], desc: T[lang].secrets.trick[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="pgQ"></div>
  <div class="row2" id="pgKeyRow"><span class="lbl" id="pgKeyLbl"></span><div class="chips" id="pgKeyChips"></div></div>
  <div class="row2" id="pgSecRow"><div class="chips" id="secChips"></div></div>`;
$('overlay').innerHTML = [0, 2].map((r) => `<div class="pg-rowb" data-r="${r}"><button class="pg-b" data-a="minus"></button><button class="pg-b" data-a="whole"></button><button class="pg-b" data-a="half"></button></div>`).join('');
const rowBtns = [...document.querySelectorAll('.pg-rowb')];

// --- vector icons: drawn in a -1..1 box, all the same size in a chart -------------------------------------
function pathBody(c, kind) {
  c.beginPath();
  if (kind === 'apple') {
    c.moveTo(0, -.58); c.bezierCurveTo(.28, -.92, 1, -.85, 1, -.05); c.bezierCurveTo(1, .58, .62, 1, .32, .98); c.bezierCurveTo(.16, .97, .1, .9, 0, .9);
    c.bezierCurveTo(-.1, .9, -.16, .97, -.32, .98); c.bezierCurveTo(-.62, 1, -1, .58, -1, -.05); c.bezierCurveTo(-1, -.85, -.28, -.92, 0, -.58); c.closePath();
  } else if (kind === 'banana') {
    c.moveTo(-.95, -.35); c.bezierCurveTo(-.8, .75, .55, .95, 1, -.45); c.lineTo(.86, -.62); c.bezierCurveTo(.42, .1, -.45, .05, -.72, -.55); c.closePath();
  } else if (kind === 'grape') {
    for (const [x, y] of GRAPES) { c.moveTo(x + .33, y); c.arc(x, y, .33, 0, TAU); }
  } else { // star
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? .48 : 1.02;
      if (i) c.lineTo(Math.cos(a) * r, Math.sin(a) * r); else c.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    c.closePath();
  }
}
const GRAPES = [[-.55, -.4], [0, -.45], [.55, -.4], [-.28, .12], [.28, .12], [0, .66]];
const leaf = (c, x, y, k) => { // a small green leaf; k mirrors it
  const g = c.createLinearGradient(x, y - .3, x + k * .7, y);
  g.addColorStop(0, '#7BD65F'); g.addColorStop(1, '#2F8A3A');
  c.fillStyle = g; c.strokeStyle = '#256B2D'; c.lineWidth = .05;
  c.beginPath(); c.moveTo(x, y); c.bezierCurveTo(x + k * .2, y - .3, x + k * .58, y - .28, x + k * .7, y - .13);
  c.bezierCurveTo(x + k * .52, y + .12, x + k * .2, y + .14, x, y); c.fill(); c.stroke();
};
function bodyFull(c, kind) {
  c.lineWidth = .07; c.strokeStyle = { apple: '#7A1E26', banana: '#8A6414', grape: '#4A2B78', star: '#B07818' }[kind];
  if (kind === 'apple') {
    pathBody(c, kind);
    const g = c.createRadialGradient(-.4, -.4, .1, 0, .1, 1.4);
    g.addColorStop(0, '#FF9A9C'); g.addColorStop(.5, '#E5484D'); g.addColorStop(1, '#A92A33');
    c.fillStyle = g; c.fill(); c.stroke();
    c.save(); c.globalAlpha = .55; c.fillStyle = '#fff'; c.beginPath(); c.ellipse(-.52, -.28, .11, .3, .5, 0, TAU); c.fill(); c.restore();
    c.strokeStyle = '#5B3A1E'; c.lineWidth = .12; c.beginPath(); c.moveTo(0, -.55); c.quadraticCurveTo(.02, -.85, .14, -1.02); c.stroke();
    leaf(c, .08, -.8, 1);
  } else if (kind === 'banana') {
    pathBody(c, kind);
    const g = c.createLinearGradient(0, -.6, 0, .8);
    g.addColorStop(0, '#FFEB8A'); g.addColorStop(.5, '#FFD84A'); g.addColorStop(1, '#E5A91F');
    c.fillStyle = g; c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = .06; c.beginPath(); c.moveTo(-.78, -.4); c.bezierCurveTo(-.6, .4, .45, .5, .88, -.48); c.stroke();
    c.strokeStyle = '#6B4A1E'; c.lineWidth = .17; c.beginPath(); c.moveTo(-.84, -.45); c.lineTo(-.9, -.74); c.stroke();
    c.fillStyle = '#6B4A1E'; c.beginPath(); c.arc(.93, -.54, .07, 0, TAU); c.fill();
  } else if (kind === 'grape') {
    c.strokeStyle = '#5B3A1E'; c.lineWidth = .1; c.beginPath(); c.moveTo(0, -.7); c.quadraticCurveTo(.02, -.9, .1, -1); c.stroke();
    leaf(c, .06, -.86, 1);
    for (const [x, y] of GRAPES) {
      const g = c.createRadialGradient(x - .12, y - .12, .02, x, y, .42);
      g.addColorStop(0, '#C9A6F2'); g.addColorStop(.55, '#8E5CC9'); g.addColorStop(1, '#5E3A94');
      c.fillStyle = g; c.strokeStyle = '#4A2B78'; c.lineWidth = .06;
      c.beginPath(); c.arc(x, y, .33, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.arc(x - .12, y - .12, .06, 0, TAU); c.fill();
    }
  } else {
    pathBody(c, kind);
    const g = c.createRadialGradient(-.3, -.35, .05, 0, 0, 1.15);
    g.addColorStop(0, '#FFE7A8'); g.addColorStop(.55, GOLD); g.addColorStop(1, '#C98A20');
    c.lineJoin = 'round'; c.fillStyle = g; c.fill(); c.stroke();
    c.save(); c.scale(.5, .5); c.translate(-.1, -.1); pathBody(c, kind); c.fillStyle = 'rgba(255,255,255,.28)'; c.fill(); c.restore();
  }
}
// o: half (left half only, cut face lighter), sc (pop scale), sx/sy (squash), rot, alpha
function drawIcon(c, kind, x, y, s, o = {}) {
  const sc = o.sc ?? 1;
  if (sc < 0.01) return;
  const u = s / 2 * 0.96;

  else if (lab.view === 'make') drawMake(c, w, h, time);
  else drawKey(c, w, h, time);
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const valOf = (items) => items.reduce((a, it) => a + (it.half ? .5 : 1), 0);
function answer(i) {
  const v = lab.view, t = now();
  if (v === 'read') {
    const rd = S.read; if (rd.picked !== null) return;
    rd.picked = i; rd.revT = t + .35; rd.ticks = 0; (i === READ_Q[rd.r].ok ? sfx.good : sfx.bad)();
  } else if (v === 'make') {
    const mk = S.make; if (mk.picked !== null) return;
    mk.picked = i; mk.revT = t; (i === 1 ? sfx.good : sfx.bad)();
    mk.rows[1] = [{ half: false, born: t + .3 }, { half: false, born: t + .65 }, { half: true, born: t + 1 }];
  } else {
    const ky = S.key; if (ky.picked !== null) return;
    ky.picked = i; ky.revT = t; ky.seq = true; ky.k = 10; (i === 2 ? sfx.good : sfx.bad)();
    setTimeout(() => { if (ky.revT === t) { ky.seq = false; render(); } }, 3900);
  }
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.i !== undefined) return answer(+b.dataset.i);
  const a = b.dataset.a;
  if (a === 'next') {
    const rd = S.read;
    if (rd.r < 2) { rd.r++; } else rd.r = 0;
    rd.picked = null; rd.revT = null; S.tIn = now(); sfx.click();
  } else if (a === 'again') {
    const v = lab.view; sfx.click();
    if (v === 'make') S.make = { picked: null, revT: null, rows: [[], [], []], done: false };
    else if (v === 'key') S.key = { picked: null, revT: null, k: 1, bk: null, bt: 0, seq: false };
    S.tIn = now();
  } else if (b.dataset.k !== undefined) {
    S.key.k = +b.dataset.k; S.key.seq = false; sfx.click();
  } else if (a === 'sec') {
    const k = b.dataset.s;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.secT = now(); sfx.click();
    if (S.sec) showStage();
  }
  render();
});
$('overlay').addEventListener('click', (ev) => {
  const b = ev.target.closest('.pg-b'); if (!b || b.disabled) return;
  const r = +b.parentElement.dataset.r, items = S.make.rows[r], hasHalf = items.some((it) => it.half), t = now();
  if (b.dataset.a === 'whole' && items.length < MAKE_MAXW + (hasHalf ? 1 : 0)) { items.splice(hasHalf ? items.length - 1 : items.length, 0, { half: false, born: t }); sfx.click(); }
  else if (b.dataset.a === 'half' && !hasHalf && items.length <= MAKE_MAXW) { items.push({ half: true, born: t }); sfx.click(); }
  else if (b.dataset.a === 'minus' && items.length) { items.pop(); sfx.tick(); }
  render();
});

// --- one render per change: text, controls, readout and the state card -----------------------------------
function qHtml({ q, opts, ok, picked, text, extra }) {
  const t = T[lang];
  return `<div class="pg-q">${esc(q)}</div>
    <div class="pg-opts">${opts.map((o, i) => `<button class="pg-o ${picked === null ? '' : i === ok ? 'ok' : i === picked ? 'no' : ''}" data-i="${i}"${picked !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>
    ${picked === null ? '' : `<div class="pg-fb"><p><span class="v ${picked === ok ? 'ok' : 'no'}">${esc(picked === ok ? t.right : t.wrong)}</span>${esc(text)}</p>${extra || ''}</div>`}`;
}
const btn = (a, label) => `<button class="btn" data-a="${a}">${esc(label)}</button>`;
const setSt = (v, full) => { const [emo, title, lead] = T[lang].st[v][full ? 'f' : 'n']; lab.setState({ emo, title, lead, body: '', extra: '' }); };
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v;
  lab.setGlow('rgba(242, 176, 74, .22)');
  $('pgQ').style.display = sec ? 'none' : '';
  $('pgKeyRow').style.display = v === 'key' && S.key.picked !== null && !sec ? '' : 'none';
  $('pgSecRow').style.display = v === 'read' ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip pg-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-a="sec" data-s="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('bars', '📏') + sc('trick', '🎈');
  rowBtns.forEach((el) => {
    const r = +el.dataset.r, items = S.make.rows[r], hasHalf = items.some((it) => it.half);
    const [mi, wh, ha] = el.querySelectorAll('button');
    mi.textContent = t.m.minus; wh.textContent = t.m.whole; ha.textContent = t.m.half;
    mi.setAttribute('aria-label', `${t.fruits[r]} −`);
    mi.disabled = !items.length; wh.disabled = items.length >= MAKE_MAXW + (hasHalf ? 1 : 0); ha.disabled = hasHalf || items.length > MAKE_MAXW;
  });
  if (sec) {
    const [title, lead] = [t.secrets[sec][0], t.sec[`${sec}Text`]];
    lab.setReadout(sec === 'bars' ? '📏' : '🎈', '', '', GOLD);
    lab.setState({ emo: sec === 'bars' ? '📏' : '🎈', title, lead, body: '', extra: '' });
    return;
  }
  if (v === 'read') {
    const rd = S.read, q = READ_Q[rd.r], n = rd.r + 1, opts = t.r[`o${n}`];
    const dots = [0, 1, 2].map((i) => (i < rd.r ? '●' : i === rd.r ? '◉' : '○')).join(' ');
    $('pgQ').innerHTML = qHtml({ q: t.r[`q${n}`], opts, ok: q.ok, picked: rd.picked, text: t.r[`r${n}`], extra: btn(rd.r === 2 ? 'again' : 'next', rd.r === 2 ? t.again : t.next) });
    if (rd.picked === null) lab.setReadout('?', dots, '', GOLD);
    else {
      const pics = q.rows.reduce((a, i) => a + READ_PICS[i][0] + READ_PICS[i][1] * .5, 0);
      lab.setReadout(opts[q.ok], `${fmt(pics)} × 2`, '', GOLD);
    }
    setSt('read', rd.r === 2 && rd.picked !== null);
  } else if (v === 'make') {
    const mk = S.make, ok = mk.rows.map((it, i) => valOf(it) === MAKE_TARGET[i]);
    const done = mk.picked !== null && ok[0] && ok[2];
    if (done && !mk.done) sfx.good(); mk.done = done;
    $('pgQ').innerHTML = qHtml({ q: t.m.q, opts: t.m.o, ok: 1, picked: mk.picked, text: t.m.r, extra: done ? btn('again', t.again) : '' })
      + (done ? `<div class="pg-done">✓ ${esc(t.m.done)}</div>` : '');
    if (mk.picked === null) lab.setReadout('?', '', '', GOLD);
    else lab.setReadout(`${ok.filter(Boolean).length}/3`, '', '', GOLD);
    setSt('make', done);
  } else {
    const ky = S.key, shown = ky.seq ? null : ky.picked === null ? 1 : ky.k;
    $('pgQ').innerHTML = qHtml({ q: t.k.q, opts: t.k.o, ok: 2, picked: ky.picked, text: t.k.r, extra: ky.picked !== null ? btn('again', t.again) : '' });
    $('pgKeyLbl').textContent = t.chart.key;
    $('pgKeyChips').innerHTML = [1, 2, 5, 10].map((k) => `<button class="chip pg-chip ${shown === k ? 'on' : ''}" data-k="${k}">${k}</button>`).join('');
    if (shown === null || ky.picked === null) lab.setReadout('?', '', '', GOLD);
    else {
      const ps = STAR_ROWS.map((x) => x / shown);
      lab.setReadout(fmt(ps.reduce((a, b) => a + b, 0)), ps.map(fmt).join(' + '), '', GOLD);
    }
    setSt('key', ky.picked !== null && !ky.seq);
  }
}
render();
</script>
</body>
</html>
