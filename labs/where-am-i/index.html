    c.fillStyle = col; c.strokeStyle = 'rgba(60,40,10,.5)'; c.lineWidth = 1; c.beginPath(); c.arc(-112, yy, 6, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = '#3a2f20'; c.font = `800 ${Math.max(12, 15 * sc) / sc}px Nunito, sans-serif`; c.fillText(txt, -98, yy + 1);
    c.strokeStyle = 'rgba(90,70,40,.3)'; c.lineWidth = 1; c.beginPath(); c.moveTo(-100, yy + 13); c.lineTo(76, yy + 13); c.stroke();
    c.restore();
  });
  // the stamp lands with a thump
  const sa = clamp01((age - 1.3) / 0.3), sS = 1 + 0.9 * (1 - eOut(sa));
  if (sa > 0) {
    c.save(); c.globalAlpha = Math.min(1, sa * 2); c.translate(100, -52); c.scale(sS, sS); c.rotate(0.05);
    c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 6; c.shadowOffsetY = 2; rr(c, -26, -32, 52, 64, 3); c.fillStyle = '#fff8e0'; c.fill(); c.shadowBlur = 0;
    c.strokeStyle = '#d9c28a'; c.lineWidth = 2; c.setLineDash([2, 3]); c.stroke(); c.setLineDash([]);
    const sg = c.createLinearGradient(-20, -26, 20, 26); sg.addColorStop(0, '#6aaaf7'); sg.addColorStop(1, '#1f58b8'); rr(c, -20, -26, 40, 52, 2); c.fillStyle = sg; c.fill();
    c.fillStyle = C.land; c.beginPath(); c.arc(0, -2, 13, 0, TAU); c.fill(); c.fillStyle = '#4b9a47'; c.beginPath(); c.arc(-4, -5, 6, 0, TAU); c.fill();
    c.fillStyle = C.gold; c.beginPath(); c.arc(0, -2, 4, 0, TAU); c.fill();
    c.restore();
    // the postmark
    c.save(); c.globalAlpha = sa * 0.7; c.translate(52, -54); c.strokeStyle = '#6a4a8a'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, 21, 0, TAU); c.stroke(); c.beginPath(); c.arc(0, 0, 15, 0, TAU); c.stroke();
    for (const dy of [-5, 0, 5]) { c.beginPath(); c.moveTo(-14, dy); c.quadraticCurveTo(-7, dy - 4, 0, dy); c.quadraticCurveTo(7, dy + 4, 14, dy); c.stroke(); }
    c.restore();
  }
  c.restore();
}

// --- the controls ----------------------------------------------------------------------------------------------
function askCfg(v) {
  const t = T[lang];
  if (v === 'zoom') return { q: t.zoomAsk, opts: t.zoomOpts, ok: 0, pick: S.zPick, done: S.zAsked, right: t.zoomRight, wrong: t.zoomWrong };
  if (v === 'world') return { q: t.worldAsk, opts: t.worldOpts, ok: 1, pick: S.wPick, done: S.wAsked, right: t.worldRight, wrong: t.worldWrong };
  const k = exOf().nb, [q, opts] = t.nbAsk[k], pick = S.nbPick[k];
  return { q, opts, ok: NBOK[k], pick: pick === undefined ? -1 : pick, done: pick !== undefined, right: t.nbRight, wrong: t.nbWrong };
}
function renderAsk(v) {
  const a = askCfg(v);
  $('waAsk').innerHTML = `<div class="wa-q">${esc(a.q)}</div><div class="wa-opts">${a.opts.map((o, i) => {
    const cls = !a.done ? '' : i === a.ok ? ' wa-ok' : i === a.pick ? ' wa-bad' : ' wa-off';
    return `<button class="chip wa-opt${cls}" data-i="${i}"${a.done ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('')}</div>${a.done ? `<div class="wa-verdict ${a.pick === a.ok ? 'wa-vok' : 'wa-vno'}">${esc(a.pick === a.ok ? a.right : a.wrong)}</div>` : ''}`;
}
function renderEx() {
  const t = T[lang], cur = curEx(), v = lab.view;
  $('waEx').style.display = v === 'world' ? 'none' : 'flex';
  $('waEx').innerHTML = Object.keys(EXD).map((k) => `<button class="chip${k === cur ? ' on' : ''}" data-ex="${k}">${esc(t.examples[k])}</button>`).join('');
}
function renderSec() {
  const t = T[lang], open = secret.unlocked();
  const b = (k, emo, i) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[i][0])}` : '🔒 ???'}</button>`;
  $('waSec').innerHTML = b('cont', '🌍', 'a') + b('env', '✉️', 'b');
}
function paintStrip() {
  const t = T[lang], ex = exOf(), cur = clamp(Math.round(Z.pos), 0, 6);
  let html = '';
  for (let i = 6; i >= 0; i--) {
    const name = i === 6 ? t.places[ex.noKey] : placeName(i, ex), off = i > Z.reached && i !== cur;
    html = `<div class="wa-box${i === cur ? ' wa-cur' : ''}${off ? ' wa-off' : ''}" style="--c:${LV[i]};--t:${LT[i]};--bg:${rgba(LV[i], 0.13)};--bg2:${rgba(LV[i], 0.3)}">
      <button class="wa-lab" data-lv="${i}"><span class="wa-n">${i + 1}</span>${esc(t.levels[i])} · ${esc(name)}</button>${html}</div>`;
  }
  $('waStrip').innerHTML = html;
  const bs = document.querySelectorAll('#waZoom .wa-btn');
  bs[0].textContent = `➖ ${t.zoomOut}`; bs[1].textContent = `➕ ${t.zoomIn}`;
  bs[0].disabled = cur <= 0 && !Z.tw; bs[1].disabled = cur >= 6 && !Z.tw;
}
function readZoom() {
  const t = T[lang], lv = clamp(Math.round(Z.pos), 0, 6);
  lab.setReadout(esc(t.levels[lv]), placeName(lv), t.level(lv + 1), C.gold);
}
function readWorld() { const t = T[lang]; lab.setReadout(t.named(S.named.size), '', S.last ? (t.continents[S.last] || t.oceans[S.last]) : '', '#5da1f7'); }
function readNb() {
  const t = T[lang], ex = exOf(), done = S.nbPick[ex.nb] !== undefined;
  lab.setReadout(done ? esc(t.nCount(Math.max(0, S.nbN))) : '?', t.places[ex.country], t.schematic, C.land);
}
function render() {
  const t = T[lang], v = lab.view, st = t.st[v], a = askCfg(v);
  document.body.dataset.v = v;
  document.body.dataset.big = v === 'neighbours' && exOf().nb === 'ru' ? '1' : '0';
  $('waZoom').style.display = v === 'zoom' && S.zAsked ? 'block' : 'none';
  renderAsk(v); renderEx(); renderSec();
  if (v === 'zoom') { paintStrip(); readZoom(); lab.setGlow('rgba(244,201,93,.2)'); }
  else if (v === 'world') { readWorld(); lab.setGlow('rgba(42,111,219,.28)'); }
  else { S.nbN = -1; readNb(); lab.setGlow('rgba(124,195,110,.22)'); }
  // while a prediction is open the card says nothing that gives the answer away
  const open = !a.done;
  let title = st[1], lead = open && v === 'zoom' ? '' : st[2], body = open ? '' : st[3];
  if (S.sec === 'cont') { title = t.secrets.a[0]; lead = t.contText; body = ''; }
  else if (S.sec === 'env') { title = t.secrets.b[0]; lead = t.envText; body = ''; }
  lab.setState({ emo: S.sec === 'cont' ? '🌍' : S.sec === 'env' ? '✉️' : st[0], title, lead, body, extra: '' });
  lab.setFacts(open || S.sec ? [] : t.facts[v]);
}

// --- events ----------------------------------------------------------------------------------------------------
function answer(i) {
  const v = lab.view, a = askCfg(v);
  if (a.done) return;
  if (v === 'zoom') { S.zAsked = true; S.zPick = i; goTo(6, true); }
  else if (v === 'world') { S.wAsked = true; S.wPick = i; S.named.add('pa'); S.last = 'pa'; S.lastHS = 0; S.glowT0 = now(); }
  else { S.nbPick[exOf().nb] = i; S.nbT0 = now(); S.nbN = -1; }
  (i === a.ok ? sfx.good : sfx.bad)();
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const o = ev.target.closest('.wa-opt');
  if (o) return answer(+o.dataset.i);
  const e = ev.target.closest('[data-ex]');
  if (e) { S.ex = e.dataset.ex; S.exPicked = true; S.nbT0 = now(); S.nbN = -1; sfx.click(); render(); return; }
  const sc = ev.target.closest('[data-sec]');
  if (sc) {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === sc.dataset.sec ? null : sc.dataset.sec; S.envT0 = now(); sfx.click(); render(); return;
  }
  const lv = ev.target.closest('[data-lv]');
  if (lv) { S.sec = null; goTo(+lv.dataset.lv, false); sfx.tick(); return; }
  const b = ev.target.closest('[data-act]');
  if (b) { S.sec = null; goTo(clamp(Math.round(Z.queue.length ? Z.queue[Z.queue.length - 1] : (Z.tw ? Z.tw.to : Z.pos)) + (b.dataset.act === 'in' ? 1 : -1), 0, 6), false); sfx.click(); }
});

// --- the loop ----------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  stepZoom(now());
  if (S.sec === 'cont') drawCont(c, w, h, time);
  else if (S.sec === 'env') drawEnv(c, w, h, time);
  else if (v === 'zoom') drawZoom(c, w, h, time);
  else if (v === 'world') drawWorld(c, w, h, time);
  else drawNb(c, w, h, time);
  if (v === 'zoom') {
    const key = `${Math.round(Z.pos)}|${Z.reached}|${!!Z.tw}|${S.zAsked}|${curEx()}`;
    if (key !== S.uk) { S.uk = key; readZoom(); paintStrip(); }
  }
});
render();
</script>
