    st(ok ? '🏆' : '🤔', `${ok ? t.ok : t.g.miss} ${t.g.guess(t.gp[S.gPred])}`, `${t.res[w]} ${t.lesson}`);
    lab.setReadout('8/8', t.roundW, '', '#4ea8ff');
  }
}
function renderF(t, ask, lanes) {
  const F = S.f, ph = F.needPred && F.pred === null ? 'pred' : F.phase;
  farReadout();
  if (ph === 'pred') { ask.style.display = ''; ask.innerHTML = `<div class="q">${esc(t.q.far)}</div>${btns('fp', t.fp)}`; st('🤔', t.q.far, ''); }
  else if (ph === 'ready') { ask.style.display = ''; ask.innerHTML = `<div class="o"><button class="pg-go" data-act="fstart">${esc(t.start)}</button></div>`; st('🔭', t.f.rt, t.f.rd); }
  else if (ph === 'run' || ph === 'pick') {
    lanes.style.display = '';
    lanes.querySelectorAll('button').forEach((bt, k) => {
      const l = F.lanes[k], key = l.busy ? 'busy' : 'simple', col = LANE_COL[key];
      bt.style.borderColor = col; bt.disabled = l.lock !== null || ph === 'pick';
      bt.innerHTML = `<b style="color:${col}">${esc(t[key])}</b><span>${l.lock !== null ? `✓ ${l.lock} ${esc(t.m)}` : esc(t.read)}</span>`;
    });
    if (ph === 'pick') { ask.style.display = ''; ask.innerHTML = `<div class="q">${esc(t.q.glance)}</div>${btns('fpick', F.opts.map((k) => t.signs[k]), F.opts)}`; st('❓', t.q.glance, ''); }
    else st('🔭', F.msg ? t.f.miss : t.f.run, t.f.runL);
  } else {
    const a = F.lanes.find((l) => !l.busy).lock, b = F.lanes.find((l) => l.busy).lock, w = fWinner();
    let line = '';
    if (F.needPred && F.pred !== null) line = `${w === F.pred ? t.ok : t.g.miss} ${t.g.guess(t.fp[F.pred])}`;
    ask.style.display = ''; ask.innerHTML = `<p>${esc(t.res[w])}</p><p>${esc(t.f.done(a, b))}</p><div class="o"><button class="pg-go" data-act="fagain">${esc(t.another)}</button></div>`;
    st('🏁', line || t.res[w], line ? `${t.res[w]} ${t.f.done(a, b)} ${t.lesson}` : `${t.f.done(a, b)} ${t.lesson}`);
  }
}
const SH = ['●', '▲', '■'];
function renderD(t, bub) {
  const D = S.d, n = D.det.filter(Boolean).length, d = t.d, host = $('pgD');
  const svg = (k) => `<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="${SYMS[k].f}" fill="#fff"/><path d="${SYMS[k].s}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;
  host.innerHTML = `
    <div class="pg-row"><span class="pg-lbl">${esc(d.lab.goal)}</span>${d.goals.map((g, k) => `<button class="chip ${D.goal === k ? 'on' : ''}" data-act="goal" data-i="${k}">${esc(g)}</button>`).join('')}</div>
    <div class="pg-row"><span class="pg-lbl">${esc(d.lab.shape)}</span>${SH.map((s, k) => `<button class="chip pg-sh ${D.shape === k ? 'on' : ''}" data-act="shape" data-i="${k}" aria-label="${esc(d.shapes[k])}">${s}</button>`).join('')}
      <span class="pg-lbl" style="min-width:0;margin-left:6px">${esc(d.lab.col)}</span>${COLS.map((c, k) => `<button class="pg-sw ${D.col === k ? 'on' : ''}" style="background:${c}" data-act="col" data-i="${k}" aria-label="${esc(d.cols[k])}"></button>`).join('')}</div>
    <div class="pg-row"><span class="pg-lbl">${esc(d.lab.sym)}</span>${SYMS.map((_, k) => `<button class="pg-sym ${D.sym === k ? 'on' : ''}" data-act="sym" data-i="${k}" aria-label="${esc(d.syms[k])}">${svg(k)}</button>`).join('')}</div>
    <div class="pg-row"><span class="pg-lbl">${esc(d.lab.det)}</span>${d.dets.map((x, k) => `<button class="chip ${D.det[k] ? 'on' : ''}" data-act="det" data-i="${k}">${esc(x)}</button>`).join('')}
      <button class="btn push" data-act="test">${esc(t.test)}</button></div>`;
  const done = D.test && D.res, tt = D.test ? now() - D.test.t0 : 0;
  lab.setReadout(String(n), d.unit(n), '', '#a78bfa');
  if (done && tt > 1.6) st(D.res === 'ok' ? '🦉' : D.res === 'busy' ? '😵' : '🤔', d.ti[D.res], d.le[D.res]);
  else st('🦉', t.q.design, d.lead);
  bub.hidden = true;
}
render();
</script>
