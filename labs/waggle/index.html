  const n = ROUNDS.length, btn = $('rBtn'), R = ROUNDS[S.ri];
  $('rQ').textContent = t.rq;
  btn.textContent = !S.rev ? t.send : S.landed ? (S.ri < n - 1 ? t.next : t.again) : t.send;
  btn.disabled = !S.rev ? !S.tap : !S.landed;
  if (!S.landed) {
    lab.setReadout(t.round(S.ri + 1, n), S.rev ? '' : S.tap ? t.tapped : t.tapMeadow, '', '#f2b632');
    lab.setState({ emo: '🐝', title: t.rdTitle, lead: t.hint, body: t.rdBody });
    return;
  }
  const tr = readTruth(), err = Math.hypot(S.tap.x - tr.x, S.tap.y - tr.y), k = S.right.filter(Boolean).length;
  lab.setReadout(S.ok ? t.right : t.wrong, '', t.off(fmtDist(err, t)), S.ok ? '#3ddc97' : '#ff8a65');
  lab.setState({ emo: S.ok ? '🎉' : '🌼', title: S.ok ? t.right : t.wrong, lead: t.revLead(t.upPh(R.a), t.sunPh(R.a)), body: t.revBody(num(R.D)), extra: S.ri === n - 1 ? `<b>${esc(t.score(k, n))}</b>` : '' });
}
function tellInfo() {
  const p = S.patch, D = Math.hypot(p.x, p.y), a = Math.round(norm(deg(Math.atan2(p.x, p.y)) - sunAz()));
  return { D, a };
}
function renderTell(t) {

  else lab.setState({ emo: '💃', title: t.tTitle, lead: t.tLead, body: t.tBody });
}
function renderHive(t) {
  const ans = S.hAns, job = jobOf(S.age);
  $('hQ').textContent = t.hQ;
  $('hChips').innerHTML = t.hChips.map((c, i) => `<button class="chip${ans === null ? '' : i === 1 ? ' good' : i === ans ? ' bad' : ''}" data-ans="${i}"${ans === null ? '' : ' disabled'}>${esc(c)}</button>`).join('');
  $('hSlide').style.display = ans === null ? 'none' : '';

    lab.setReadout(t.days(3), t.hPredSub, '', '#f2b632');

  }
  lab.setReadout(t.days(S.age), t.jobs[job].s, '', ['#8ecae6', '#ff9bb3', '#ffd166', '#b794f4', '#7cc36b'][job]);
  const verdict = !S.hMoved ? `${ans === 1 ? t.right : t.wrong} ` : '';
