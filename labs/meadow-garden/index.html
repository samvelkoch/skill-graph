  if (S.g[0] === null) { lab.setReadout('?', t.c.sub0, '', '#7fbf5a'); lab.setState({ emo: '🤔', title: t.c.preT, lead: t.c.preL, body: '', extra: '' }); lab.setFacts(F); return; }
  const m = MKINDS.filter((k) => S.counted.has(k)).length, b = BKINDS.filter((k) => S.counted.has(k)).length;
  if (S.phase === 'sort') {
    const k = S.sk.filter(Boolean).length;
    lab.setReadout(`${k}/6`, t.sort.sub, '', '#7fbf5a');
    if (S.si >= 6) lab.setState({ emo: '🏆', title: t.sort.end(k), lead: t.sort.endL, body: '', extra: '' });
    else { const [id, emo, nat] = SORTS[S.si]; lab.setState(S.sans === null ? { emo, title: t.sort.names[id], lead: t.sort.lead, body: '', extra: '' } : { emo, title: `${t.sort.names[id]}: ${nat ? t.sort.nat : t.sort.art}`, lead: t.sort.why[id], body: '', extra: '' }); }
    lab.setFacts(F); return;
  }
  const all = S.counted.size >= 14;
  lab.setReadout(t.c.val(m, b), t.c.sub, all ? t.c.pillAll : t.c.pill, '#7fbf5a');
  if (all) lab.setState({ emo: '🌼', title: t.c.doneT(m, b), lead: t.c.doneL, body: '', extra: '' });
  else if (S.last) lab.setState({ emo: EMO[S.last], title: t.kinds[S.last][0], lead: t.kinds[S.last][1], body: S.dup ? t.c.same : t.c.counted(m, b), extra: '' });
  else lab.setState({ emo: '🔍', title: t.c.look, lead: t.c.lookL, body: '', extra: '' });
  lab.setFacts(F);
}
function paint2(t) {
  lab.setGlow('rgba(200, 170, 80, .24)');
  const y = t.y;
  if (S.g[1] === null) { lab.setReadout(y.years(0), y.subOn, '', '#d9b45a'); lab.setState({ emo: '🧑‍🌾', title: y.pre[0], lead: y.pre[1], body: '', extra: '' }); lab.setFacts([]); return; }
  const yr = Math.round(S.yd), k = plantKinds().size;
  lab.setReadout(y.years(yr), S.care ? y.subOn : y.subOff, y.kinds(k), '#d9b45a');
  let st, emo = '🌱';
  if (S.care) { st = y.careOn; emo = '🧑‍🌾'; }
  else if (S.yd < .5) { st = S.bare ? y.bare : y.left; emo = S.bare ? '🕳️' : '🥬'; }
  else if (S.yd < 2.5) { st = y.weeds; emo = '🌿'; }
  else if (S.yd < 4.8) { st = y.grass; emo = '🌼'; }
  else { st = y.shrubs; emo = '🌳'; }
  lab.setState({ emo, title: st[0], lead: st[1], body: S.wildM ? `${y.meadowNote} ${t.mowNote}` : '', extra: '' });
  lab.setFacts(t.f.v2);
}
function paint3(t) {
  lab.setGlow('rgba(217, 130, 95, .22)');
  const p = t.p, F = t.f;
  $('bPlay').textContent = S.wk >= 10 ? p.again : S.play ? p.pause : p.play;
  if (S.g[2] === null) { lab.setReadout(`${Math.round(S.cb)} ${lang === 'en' ? 'vs' : ':'} ${Math.round(S.cm)}`, p.sub, p.pill(0), '#d9825f'); lab.setState({ emo: '🦋', title: p.preT, lead: p.preL, body: p.preB, extra: '' }); lab.setFacts([F.v3a]); return; }
  const wk = Math.round(S.wk), cb = Math.round(S.cb), cm = Math.round(S.cm);
  lab.setReadout(`${cb} ${lang === 'en' ? 'vs' : ':'} ${cm}`, p.sub, p.pill(wk), '#d9825f');
  if (S.wk >= 1.5 && S.cb > S.cm * 2) lab.setState({ emo: '🐛', title: p.bedT, lead: S.help || S.mix ? p.bedHelpL : p.bedL, body: p.bedB, extra: '' });
  else if (S.wk >= 1.5 && (S.help || S.mix)) lab.setState({ emo: '⚖️', title: p.eqT, lead: p.eqL, body: '', extra: '' });
  else lab.setState({ emo: '🥚', title: p.startT, lead: p.startL, body: '', extra: '' });
  lab.setFacts([F.v3a, F.v3b, F.v3c]);
}
