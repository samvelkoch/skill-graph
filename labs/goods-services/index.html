  sky(c, w, h, t);
  const R = S.r, tt = T[lang], r = Math.min(w * .28, h * .23), cx = w / 2, cy = h * .4, Hh = Math.min(w, h) * .15, m = .44;
  c.fillStyle = lg(c, 0, cy + r * .5, 0, h, [[0, 'rgba(150,205,120,.0)'], [.3, '#a9db86'], [1, '#6fb35a']]); c.fillRect(0, cy + r * .5, w, h);
  const dg = c.createRadialGradient(cx - r * .15, cy - r * .15, 2, cx, cy, r * .62); dg.addColorStop(0, '#fffaf0'); dg.addColorStop(1, '#f2dfb8');
  c.fillStyle = dg; c.strokeStyle = '#c9ab72'; c.lineWidth = 2; c.beginPath(); c.arc(cx, cy, Math.max(0, r * .5), 0, 7); c.fill(); c.stroke();
  emo(c, '🏘️', cx, cy + 1, r * .5);
  const ang = (i) => -Math.PI / 2 + i * Math.PI / 2, pos = (i, rad = r) => [cx + Math.cos(ang(i)) * rad, cy + Math.sin(ang(i)) * rad];
  const onArc = (i, f, rad) => { const a = mixn(ang(i) + m, ang(i) + Math.PI / 2 - m, f); return [cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]; };
  const shown = R.ans !== null && (R.go || R.done);
  const cust = [0, 0, 0, 0], sell = [0, 0, 0, 0], cur = R.run ? R.step : -1;
  for (let i = 0; i < 4; i++) if (R.done || i < R.step || (R.run && i === R.step)) { cust[i] = 1; sell[(i + 1) % 4] = 1; }
  // arrows and coins
  for (let i = 0; i < 4 && shown; i++) {
    const past = R.done || i < R.step, act = i === cur; if (!past && !act) continue;
    c.strokeStyle = act ? '#ffb02e' : 'rgba(255,176,46,.5)'; c.lineWidth = act ? 4 : 3; c.lineCap = 'round'; c.setLineDash([2, 7]);
    c.beginPath(); c.arc(cx, cy, r, ang(i) + m, ang(i) + Math.PI / 2 - m); c.stroke(); c.setLineDash([]);
    const [ex, ey] = onArc(i, 1, r), a1 = ang(i) + Math.PI / 2 - m, tx = -Math.sin(a1), ty = Math.cos(a1);
    c.fillStyle = act ? '#ffb02e' : 'rgba(255,176,46,.6)'; c.beginPath(); c.moveTo(ex + tx * 9, ey + ty * 9); c.lineTo(ex - tx * 3 - ty * 7, ey - ty * 3 + tx * 7); c.lineTo(ex - tx * 3 + ty * 7, ey - ty * 3 - tx * 7); c.closePath(); c.fill();
    if (act) {
      const q = ei((R.t - .5) / 1.0), [kx, ky] = onArc(i, q, r);
      if (R.t > .5) coin(c, kx, ky - Math.sin(Math.PI * q) * 6, 9);
      const q2 = ei((R.t - 1.3) / 1.0), [ix, iy] = onArc(i, 1 - q2, r - 20);
      if (R.t > 1.3) emo(c, ['✂️', '🍎', '🩺', '🥖'][i], ix, iy, 24);
    }
  }
  // people
  for (let i = 0; i < 4; i++) {
    const [px, py] = pos(i), ch = CH[i], isC = cur === i, isS = cur >= 0 && (cur + 1) % 4 === i, feet = py + Hh / 2;
    const hop = (isC && R.t > .1 && R.t < .5 ? Math.sin((R.t - .1) / .4 * Math.PI) * 8 : 0) + (isS && R.t > .9 && R.t < 1.4 ? Math.sin((R.t - .9) / .5 * Math.PI) * 8 : 0);
    if (isC || isS) { c.strokeStyle = isC ? '#4ea8ff' : '#ff8a4c'; c.lineWidth = 3.5; c.beginPath(); c.ellipse(px, feet, Math.max(0, Hh * .5), Math.max(0, Hh * .13), 0, 0, 7); c.stroke(); }
    if (R.ans !== null && !R.go && !R.done && (i === 0 || i === 1)) { c.strokeStyle = '#3ddc97'; c.lineWidth = 3.5; c.beginPath(); c.ellipse(px, feet, Math.max(0, Hh * .5), Math.max(0, Hh * .13), 0, 0, 7); c.stroke(); }
    person(c, px, feet - hop, Hh, { shirt: ch.shirt, hair: ch.hair, hat: ch.hat, long: ch.long, skin: ch.skin, dir: px > cx + 2 ? -1 : 1, hold: true, arm: hop > 0 ? .8 : 0 });
    pill(c, `${ch.e} ${tt.rd.chars[i]}`, px, feet + 15, { size: 12 });
    const tags = [];
    if (R.ans !== null && !R.go && !R.done) { if (i === 0) tags.push(['customer', '#2f7de1']); if (i === 1) tags.push(['seller', '#e8741f']); }
    else { if (cust[i]) tags.push(['customer', '#2f7de1']); if (sell[i]) tags.push(['seller', '#e8741f']); }
    tags.forEach(([k, col], j) => pill(c, tt[k], px, feet - Hh - 12 - j * 22, { bg: col, scale: Math.max(.01, eb(isC || isS ? (R.t - .05) / .35 : 1)) }));
  }
}

// --- the market for sorting -----------------------------------------------------------------------------------
function drawMarket(c, w, h, t) {
  sky(c, w, h, t);
  c.fillStyle = lg(c, 0, h * .5, 0, h, [[0, '#e9d8b4'], [1, '#c9ae7a']]); c.fillRect(0, h * .45, w, h);
  const cols = ['#e5484d', '#ffd24a', '#2f7de1', '#3fae49'];
  c.strokeStyle = '#8a6a3a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, 6); c.quadraticCurveTo(w / 2, 26, w, 6); c.stroke();
  for (let i = 0; i < 9; i++) { const f = (i + .5) / 9, x = f * w, y = 6 + Math.sin(f * Math.PI) * 10 + 1; c.fillStyle = cols[i % 4]; c.beginPath(); c.moveTo(x - 9, y); c.lineTo(x + 9, y); c.lineTo(x, y + 18 + Math.sin(t * 2 + i) * 1.5); c.closePath(); c.fill(); }
}

// --- loop -------------------------------------------------------------------------------------------------------
function update(dt) {
  if (!W || !H) return;
  const v = lab.view;
  if (v === 'street' && S.phase === 'walk' && S.path.length) {
    const [tx, ty] = S.path[0], dx = tx * W - S.cu * W, dy = ty * H - S.cv * H, d = Math.hypot(dx, dy), step = 190 * dt;
    S.wp += dt * 12;
    if (d <= step) { S.cu = tx; S.cv = ty; S.path.shift(); if (!S.path.length) { S.phase = 'ask'; S.face = 1; S.wp = 0; render(); } }
    else { S.cu += dx / d * step / W; S.cv += dy / d * step / H; if (Math.abs(dx) > 1) S.face = Math.sign(dx); }
  }
  if (S.phase === 'reveal') S.rev += dt;
  const R = S.r;
  if (v === 'round' && R.run) {
    R.t += dt;
    if (R.t >= STEP) { R.t = 0; R.step++; sfx.tick(); if (R.step >= 4) { R.run = false; R.done = true; sfx.good(); } render(); }
  }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  W = w; H = h; update(dt);
  if (lab.view === 'street') { if (S.sec === 'both') drawPizza(c, w, h, time); else if (S.sec === 'own') drawStall(c, w, h, time); else drawStreet(c, w, h, time); }
  else if (lab.view === 'round') drawRound(c, w, h, time);
  else drawMarket(c, w, h, time);
});

// --- input --------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function startWalk(id) {
  const g = geo(W, H), i = PL.findIndex((p) => p.id === id);
  let tu, tv;
  if (id === 'bus') { tu = (g.busL - 40) / W; tv = Y2; } else { tu = doorU(g, i, W); tv = i < 3 ? Y1 : Y2; }
  const pts = [], lane = Math.min(g.lane / 2, 20) / W + .01;
  if (Math.abs(S.cv - tv) > .02) { pts.push([lane, S.cv], [lane, tv]); }
  pts.push([tu, tv]);
  S.place = id; S.phase = 'walk'; S.ans = null; S.path = pts; sfx.click(); render();
}
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'street' || S.sec || S.phase === 'walk' || S.phase === 'ask') return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, g = geo(r.width, r.height);
  for (let i = 0; i < 6; i++) { const q = shopRect(g, i); if (x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h + r.height * .04) return startWalk(PL[i].id); }
  if (x >= g.busL - 30 && x <= g.busL + g.bw && y >= r.height * .62 && y <= r.height) startWalk('bus');
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (lab.view === 'round') { S.r.ans = b.dataset.a; (S.r.ans === 'baker' ? sfx.good : sfx.bad)(); render(); return; }
  const p = PL.find((q) => q.id === S.place); if (!p || S.phase !== 'ask') return;
  S.ans = +b.dataset.a; const ok = S.ans === (p.k === 'g' ? 0 : 1);
  S.phase = 'reveal'; S.rev = 0; S.seen[p.id] = p.k; (ok ? sfx.good : sfx.bad)(); showStage(); render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, R = S.r, O = S.so;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  } else if (act === 'stall') { S.stall = b.dataset.k; sfx.click(); }
  else if (act === 'next') {
    if (R.run) return;
    R.go = true; R.run = true; R.done = false; R.step = 0; R.t = 0; sfx.click(); showStage();
  } else if (act === 'check') {
    if (O.checked) { S.so = { at: {}, sel: null, checked: false, stage: 0, hop: {}, first: 0 }; sfx.click(); return render(); }
    O.checked = true; O.stage = 1; O.first = SORT.filter(([id, , k]) => O.at[id] === k).length; (O.first === 9 ? sfx.good : sfx.snap)(); showStage();
    setTimeout(() => {
      if (S.so !== O) return;
      SORT.forEach(([id, , k]) => { if (O.at[id] !== k) { O.at[id] = k; O.hop[id] = 1; } });
      O.stage = 2; sfx.snap(); render();
    }, 1300);
  }
  render();
});
sortEl.addEventListener('click', (ev) => {
  const O = S.so; if (O.checked) return;
  const card = ev.target.closest('[data-card]'), chip = ev.target.closest('[data-chip]'), bk = ev.target.closest('[data-bk]');
  if (card) { O.sel = O.sel === card.dataset.card ? null : card.dataset.card; sfx.tick(); }
  else if (chip) { delete O.at[chip.dataset.chip]; sfx.tick(); }
  else if (bk && O.sel) { O.at[O.sel] = bk.dataset.bk; O.sel = null; sfx.click(); }
  render();
});

// --- one render per change: controls, readout, overlay and the state card ---------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('gsStreet').style.display = v === 'street' ? '' : 'none';
  $('gsRound').style.display = v === 'round' ? '' : 'none';
  $('gsSortC').style.display = v === 'sort' ? '' : 'none';
  sortEl.style.display = v === 'sort' ? '' : 'none';
  askEl.style.display = 'none';
  lab.setFacts(t.facts[v]);
  if (v === 'street') renderStreet(t); else if (v === 'round') renderRound(t); else renderSort(t);
}
function setAsk(html) { askEl.innerHTML = html; askEl.style.display = ''; }

function renderStreet(t) {
  const open = secret.unlocked(), s = t.st, p = PL.find((q) => q.id === S.place);
  lab.setGlow('rgba(255,190,90,.26)');
  $('gsLeg').innerHTML = `<span><i class="gs-dot g"></i>${esc(t.goods)}</span><span><i class="gs-dot s"></i>${esc(t.service)}</span>`;
  const sc = (k, e) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('gsSec').innerHTML = sc('both', '🍕') + sc('own', '🍋');
  $('gsOwn').style.display = S.sec === 'own' ? '' : 'none';
  $('gsPick').textContent = t.sc.pick;
  $('gsStall').innerHTML = [['lem', '🍋'], ['dog', '🐕']].map(([k, e]) => `<button class="chip ${S.stall === k ? 'on' : ''}" data-act="stall" data-k="${k}">${e} ${esc(t.sc[k])}</button>`).join('');
  if (S.sec === 'both') { lab.setReadout('🍕', t.sc.bothSub, '', '#e8921f'); lab.setState({ emo: '🍕', title: t.sc.bothT, lead: t.sc.bothL, body: '', extra: '' }); return; }
  if (S.sec === 'own') {
    const lem = S.stall === 'lem';
    lab.setReadout(lem ? '🍋' : '🐕', t.sc[S.stall], '', lem ? '#e8921f' : '#6c52e0');
    lab.setState({ emo: lem ? '🍋' : '🐕', title: t.sc[lem ? 'lemT' : 'dogT'], lead: t.sc[lem ? 'lemL' : 'dogL'], body: '', extra: '' }); return;
  }
  if (S.phase === 'idle' || !p) { lab.setReadout('👜', s.sub0, '', '#e8921f'); lab.setState({ emo: '🏪', title: s.t0, lead: s.l0, body: '', extra: '' }); return; }
  const name = t.pl[p.id];
  if (S.phase === 'walk') { lab.setReadout('👜', name, '', '#e8921f'); lab.setState({ emo: p.e, title: s.walk(name), lead: s.walkL, body: '', extra: '' }); return; }
  if (S.phase === 'ask') {
    lab.setReadout('?', name, '', '#e8921f');
    lab.setState({ emo: '🤔', title: s.q, lead: '', body: '', extra: '' });
    setAsk(`<div class="q">${esc(s.q)}</div><div class="opts"><button data-a="0">${esc(s.yes)}</button><button data-a="1">${esc(s.no)}</button></div>`); return;
  }
  const goods = p.k === 'g', ok = S.ans === (goods ? 0 : 1), label = t[goods ? 'goods' : 'service'];
  lab.setReadout(label, name, goods ? s.full : s.empty, goods ? '#e8921f' : '#6c52e0');
  lab.setState({ emo: goods ? '🛍️' : '✨', title: label, lead: t.why[p.id], body: s.next, extra: '' });
  setAsk(`<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? (lang === 'ru' ? 'Верно!' : lang === 'hu' ? 'Így van!' : 'Right!') : s.wrong)}</div><p>${esc(t.why[p.id])}</p>`);
}

function renderRound(t) {
  const R = S.r, d = t.rd, k = R.done ? 4 : R.run ? R.step : 0;
  lab.setGlow('rgba(255,190,90,.22)');
  $('gsNext').textContent = R.done ? d.again : d.next;
  $('gsNext').disabled = R.ans === null || R.run;
  if (R.ans === null) {
    lab.setReadout('?', '', '', '#e8921f'); lab.setState({ emo: '🤔', title: d.q, lead: '', body: '', extra: '' });
    setAsk(`<div class="q">${esc(d.q)}</div><div class="opts"><button data-a="baker">${esc(d.opts[0])}</button><button data-a="hair">${esc(d.opts[1])}</button></div>`); return;
  }
  lab.setReadout(`${k}/4`, d.sub, '', '#e8921f');
  if (!R.go) {
    const ok = R.ans === 'baker';
    setAsk(`<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? (lang === 'ru' ? 'Верно!' : lang === 'hu' ? 'Így van!' : 'Right!') : t.st.wrong)}</div><p>${esc(d.right)}</p>`);
    lab.setState({ emo: '🔄', title: d.t1, lead: d.l1, body: '', extra: '' }); return;
  }
  if (R.done) { lab.setState({ emo: '🔄', title: d.endT, lead: d.endL, body: '', extra: '' }); return; }
  const i = R.step, pay = d.chars[i], sel = d.chars[(i + 1) % 4];
  lab.setState({ emo: CH[i].e, title: d.steps[i], lead: `${pay}: ${t.customer}. ${sel}: ${t.seller}.`, body: '', extra: '' });
}

function renderSort(t) {
  const O = S.so, so = t.so, placed = SORT.filter(([id]) => O.at[id]).length, right = SORT.filter(([id, , k]) => O.at[id] === k).length;
  lab.setGlow('rgba(255,190,90,.22)');
  const chip = ([id, e, k]) => `<button class="gs-ch ${O.checked && O.stage === 1 ? (O.at[id] === k ? 'ok' : 'bad') : O.stage === 2 ? 'ok' : ''} ${O.hop[id] ? 'hop' : ''}" data-chip="${id}" aria-label="${esc(so.cards[SORT.findIndex((q) => q[0] === id)])}">${e}</button>`;
  const bk = (k, i) => `<div class="gs-bk ${k === 'g' ? 'g' : 's'} ${O.checked ? 'open' : ''}" data-bk="${k}"><div class="gs-lid"></div><h4>${esc(so.bk[i])}</h4>${SORT.filter(([id]) => O.at[id] === k).map(chip).join('')}</div>`;
  const pool = SORT_ORDER.map((n) => { const [id, e] = SORT[n]; return `<button class="gs-card ${O.at[id] ? 'ph' : ''} ${O.sel === id ? 'sel' : ''}" data-card="${id}"><span class="e">${e}</span>${esc(so.cards[n])}</button>`; }).join('');
  sortEl.innerHTML = `<div class="gs-bks">${bk('g', 0)}${bk('s', 1)}</div><div class="gs-pool">${pool}</div>`;
  $('gsCheck').textContent = O.checked ? so.again : so.check;
  $('gsCheck').disabled = !O.checked && placed < 9;
  if (!O.checked) { lab.setReadout(`${placed}/9`, so.sub, '', '#e8921f'); lab.setState({ emo: '🧺', title: so.t0, lead: so.l0, body: '', extra: '' }); return; }
  lab.setReadout(`${O.first}/9`, '', '', '#e8921f');
  lab.setState({ emo: O.first === 9 ? '🏆' : '🧺', title: O.first === 9 ? so.all : so.some(O.first), lead: so.endL, body: '', extra: '' });
}
render();
</script>
