// --- music data: everything is in scale steps, so the song and its chords move to any key ---------------------
const MAJOR = [0, 2, 4, 5, 7, 9, 11];
const STEP = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
const KEYS = { C: { base: 60, names: ['C', 'D', 'E', 'F', 'G', 'A', 'B'] }, G: { base: 67, names: ['G', 'A', 'B', 'C', 'D', 'E', 'F♯'] } };
const stepMidi = (s, base) => base + MAJOR[s % 7] + 12 * Math.floor(s / 7);
const freqOf = (m) => 440 * 2 ** ((m - 69) / 12);
// "Ode to Joy" (Beethoven, public domain): 8 bars of 4 beats; step 0 = the tonic
const BARS = [

  [['C', 1], ['C', 1], ['D', 1], ['E', 1]], [['E', 1.5], ['D', 0.5], ['D', 2]],
  [['E', 1], ['E', 1], ['F', 1], ['G', 1]], [['G', 1], ['F', 1], ['E', 1], ['D', 1]],
  [['C', 1], ['C', 1], ['D', 1], ['E', 1]], [['D', 1.5], ['C', 0.5], ['C', 2]],
].map((bar) => { let s = 0; return bar.map(([n, d]) => { const o = { step: STEP[n], d, s }; s += d; return o; }); });
const CH = { I: { root: 0, col: '#f0b840' }, IV: { root: 3, col: '#3fc1b5' }, V: { root: 4, col: '#f06a5a' } };
const CH_KEYS = ['I', 'IV', 'V'];
const ROMAN = ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'];
const OTHER_COL = '#a9b3e6';
const chordCol = (root) => CH_KEYS.map((k) => CH[k]).find((c) => c.root === root)?.col ?? OTHER_COL;
const triad = (r) => [r, r + 2, r + 4];                         // steps of a chord: every other note
const barOf = (s) => (s <= 7 ? s : s - 7);                      // the bar that lights for step s (the xylophone has 8 bars)
const voice = (root, base) => { const m = triad(root).map((s) => stepMidi(s, base)); return Math.max(...m) > base + 14 ? m.map((x) => x - 12) : m; };
// fit of a chord in a bar = share of the bar's beats that sound a note of the chord
const fitOf = (b, k) => BARS[b].filter((n) => triad(CH[k].root).map((s) => s % 7).includes(n.step % 7)).reduce((a, n) => a + n.d, 0) / 4 * 100;

// --- sound: a xylophone for the tune, a soft three-sine pad for the chords -----------------------------------
function actx() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); master = AC.createGain(); master.gain.value = 0.9;
      master.connect(comp); comp.connect(AC.destination);
    }
    if (AC.state !== 'running') AC.resume().catch(() => {});
    return AC;
  } catch { return null; }
}
['pointerdown', 'pointerup', 'touchend', 'keydown', 'click'].forEach((e) => addEventListener(e, () => { if (store.get('sound', false)) { unmuteIOS(); actx(); } }, { passive: true }));
// a music lab: the first tap that makes a sound turns the shell's sound on, unless the visitor switched it off before
function wantSound() { if (store.get('sound', null) === null) $('sound').click(); return store.get('sound', false); }
const soundOn = () => store.get('sound', false);
function audioReady() { if (!wantSound()) return false; unmuteIOS(); return !!actx(); }
const mkBus = () => { const g = AC.createGain(); g.connect(master); return g; };
function killBus(b) {
  if (!b || !AC) return;
  try { b.gain.cancelScheduledValues(AC.currentTime); b.gain.setTargetAtTime(0, AC.currentTime, 0.015); } catch { /* already gone */ }
  setTimeout(() => { try { b.disconnect(); } catch { /* already gone */ } }, 250);
}
// xylophone: sine at f, a quiet 4f and a very quiet 10f, 3 ms attack, exponential decay
function mallet(m, when, vol, bus) {
  [[1, 1, 0.9], [4, 0.08, 0.35], [10, 0.02, 0.12]].forEach(([mul, g, d]) => {
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = 'sine'; o.frequency.value = freqOf(m) * mul;
    gn.gain.setValueAtTime(0.0001, when); gn.gain.linearRampToValueAtTime(0.3 * vol * g, when + 0.003); gn.gain.exponentialRampToValueAtTime(0.0001, when + d + 0.003);
    o.connect(gn).connect(bus); o.start(when); o.stop(when + d + 0.05);
  });
}
// pad: one sine per chord note, 0.1 gain each, soft attack and release
function pad(midis, when, dur, vol, bus) {
  midis.forEach((m) => {
    const o = AC.createOscillator(), gn = AC.createGain(), pk = 0.1 * vol;
    o.type = 'sine'; o.frequency.value = freqOf(m);
    gn.gain.setValueAtTime(0.0001, when); gn.gain.linearRampToValueAtTime(pk, when + Math.min(0.05, dur / 3));
    gn.gain.setValueAtTime(pk, when + Math.max(0.06, dur - 0.14)); gn.gain.linearRampToValueAtTime(0.0001, when + dur);
    o.connect(gn).connect(bus); o.start(when); o.stop(when + dur + 0.03);
  });
}
function bassNote(m, when, dur, bus) {
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = 'triangle'; o.frequency.value = freqOf(m);
  gn.gain.setValueAtTime(0.0001, when); gn.gain.linearRampToValueAtTime(0.16, when + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(gn).connect(bus); o.start(when); o.stop(when + dur + 0.03);
}
function maybeHint() {
  if (soundOn() || S.hintDone) return;
  S.hintDone = true;

  clearTimeout(S.hintTm); S.hintTm = setTimeout(() => { b.hidden = true; }, 7000);
}

// --- the player: one run at a time; everything is scheduled up front on the audio clock -----------------------
function stopRun() {
  if (!run) return;
  killBus(run.bus); run = null;
}
function startRun(o) {
  stopRun();
  const bd = o.bd ?? BD, lead = 0.12;
  const r = { kind: o.kind, b0: o.b0 ?? 0, n: o.n ?? 1, total: o.total, bd, t0: now() + lead, bus: null, nk: '', onEnd: o.onEnd, tail: o.tail ?? 0.4 };
  if (audioReady()) { r.bus = mkBus(); o.sched(r.bus, AC.currentTime + lead, bd); }
  run = r;
  maybeHint();
}
const beatNow = () => (run ? Math.max(0, (now() - run.t0) / run.bd) : 0);
// the fit song: bars b0 .. b0+n-1 with their chords
function playBars(b0, n) {
  const base = KEYS[curKey()].base;
  startRun({
    kind: 'fit', b0, n, total: n * 4, onEnd: () => render(),
    sched: (bus, a0, bd) => {
      for (let k = 0; k < n; k++) {
        const b = b0 + k;
        BARS[b].forEach((nt) => mallet(stepMidi(nt.step, base), a0 + (k * 4 + nt.s) * bd, 0.9, bus));
        const s = S.f.slots[b];
        if (s) pad(voice(CH[s].root, base), a0 + k * 4 * bd, 3.9 * bd, 1, bus);
      }
    },
  });
  S.f.sel = b0; S.f.selT = now();
  render();
}
function playBlues() {
  startRun({
    kind: 'blues', n: 12, total: 48, bd: BLUES_BD, tail: 0.5, onEnd: () => render(),
    sched: (bus, a0, bd) => {
      BLUES.forEach((k, b) => {
        const v = voice(CH[k].root, 60), root = stepMidi(CH[k].root, 60) - 12;
        for (let beat = 0; beat < 4; beat++) { // a shuffle: every beat is split long-short, 2 : 1
          const t = a0 + (b * 4 + beat) * bd;
          pad(v, t, bd * 0.55, 1, bus);
          pad(v, t + bd * (2 / 3), bd * 0.28, 0.65, bus);
          if (beat % 2 === 0) bassNote(root, t, bd * 1.8, bus);
          else bassNote(root + 7, t, bd * 0.9, bus);
        }
      });
    },
  });
  render();
}
function homeListen() {
  const seq = ROUNDS[S.h.round], base = KEYS.C.base, starts = [0, 2, 4, 6], durs = [2, 2, 2, 3];
  S.h.heard = false; S.h.shown = 0;
  startRun({
    kind: 'home', total: 9, tail: 0.3, onEnd: () => { S.h.heard = true; S.h.shown = 4; render(); },
    sched: (bus, a0, bd) => seq.forEach((k, i) => {
      const t = a0 + starts[i] * bd;
      pad(voice(CH[k].root, base), t, durs[i] * bd * 0.98, 1, bus);
      triad(CH[k].root).forEach((s, j) => mallet(stepMidi(s, base), t + j * 0.045, 0.55, bus));
    }),
  });
  render();
}
// the stack view: root, third, fifth like a little arpeggio, then all three together
function buildChord(root) {
  stopRun();
  const s = S.s, key = CH_KEYS.find((k) => CH[k].root === root);
  s.root = root; s.t0 = now(); s.struck = [false, false, false];
  if (key) s.built.add(key);
  killBus(s.bus); s.bus = null;
  if (audioReady()) {
    const base = KEYS.C.base, a = AC.currentTime + 0.04;
    s.bus = mkBus();
    triad(root).forEach((st, k) => mallet(stepMidi(st, base), a + k * 0.42, 1, s.bus));
    pad(voice(root, base), a + 1.28, 1.7, 1, s.bus);
  }
  maybeHint();
}

// --- drawing helpers ---------------------------------------------------------------------------------------
function pillT(c, txt, cx, cy, o = {}) {
  const { fill = 'rgba(10,12,22,.82)', col = '#fff', stroke = 'rgba(255,255,255,.2)', sz = 12 } = o;
  c.save(); c.font = `800 ${sz}px ${FONT}`; c.textBaseline = 'middle'; c.textAlign = 'left';
  const pw = c.measureText(txt).width + 18, ph = sz + 10, x0 = clamp(cx - pw / 2, 4, Math.max(4, V.w - pw - 4));

  c.fillStyle = col; c.fillText(txt, x0 + 9, cy + 0.5); c.restore();
}
function xyloGeo(X, Y, W, H) {
  const m = 12, gap = 4, bw = (W - 2 * m - 7 * gap) / 8, cy = Y + H / 2;
  return { X, Y, W, H, cy, bw, bar: (i) => { const hb = H * (1 - 0.28 * i / 7), x = X + m + i * (bw + gap); return { x, y: cy - hb / 2, w: bw, h: hb, cx: x + bw / 2 }; } };
}
function drawBar(c, r, i, o) {
  const light = mixH('#f6d9a6', '#e2ab6f', i / 14), mid = mixH(light, '#c4813f', 0.5), deep = mixH(light, '#6d3d17', 0.72), rad = Math.min(7, r.w / 3);

  c.save();
  c.shadowColor = glow ? o.gc : 'rgba(0,0,0,.5)'; c.shadowBlur = glow ? 8 + 20 * o.g : 5; c.shadowOffsetY = glow ? 0 : 3;
  rr(c, r.x, y, r.w, r.h, rad); c.fillStyle = lg(c, r.x, y, r.x + r.w, y + r.h, [[0, light], [0.45, mid], [1, deep]]); c.fill();
  c.restore();
  c.save();
  c.strokeStyle = 'rgba(90,50,20,.14)'; c.lineWidth = 1; c.beginPath();
  [0.3, 0.62].forEach((f) => { c.moveTo(r.x + r.w * f, y + 8); c.lineTo(r.x + r.w * f + 2, y + r.h - 8); }); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.3)'; rr(c, r.x + 3, y + 4, r.w * 0.24, r.h - 8, 3); c.fill();
  c.fillStyle = 'rgba(255,255,255,.22)'; rr(c, r.x + 2, y + 2, r.w - 4, 5, 2.5); c.fill();
  c.fillStyle = 'rgba(0,0,0,.14)'; rr(c, r.x + 1, y + r.h - 7, r.w - 2, 6, 3); c.fill();
  if (glow) { c.fillStyle = `rgba(255,255,255,${0.3 * o.g})`; rr(c, r.x, y, r.w, r.h, rad); c.fill(); }
  c.strokeStyle = deep; c.lineWidth = 1.5; rr(c, r.x, y, r.w, r.h, rad); c.stroke();
  o.screws.forEach((sy) => { // brass screws on the two rails
    const g = c.createRadialGradient(r.cx - 1, sy + (o.dip || 0) - 1, 0.5, r.cx, sy + (o.dip || 0), 3.8);
    g.addColorStop(0, '#fff6c8'); g.addColorStop(0.5, '#d9a93a'); g.addColorStop(1, '#7a5712');
    c.fillStyle = g; circ(c, r.cx, sy + (o.dip || 0), 3.3); c.fill(); c.strokeStyle = 'rgba(60,40,5,.7)'; c.lineWidth = 0.8; c.stroke();
  });

  c.fillText(o.label, r.cx, y + r.h - 15);
  c.restore();
}
function drawDot(c, x, y, r, col, label, a) {
  if (a < 0.03) return;
  c.save(); c.translate(x, y); c.scale(a, a);
  c.shadowColor = col; c.shadowBlur = 16;
  const g = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
  g.addColorStop(0, mixH(col, '#ffffff', 0.55)); g.addColorStop(0.55, col); g.addColorStop(1, mixH(col, '#2a1208', 0.35));
  circ(c, 0, 0, r); c.fillStyle = g; c.fill();
  c.shadowBlur = 0; c.strokeStyle = mixH(col, '#1a0f0a', 0.6); c.lineWidth = 1.5; c.stroke();
  if (label) { c.fillStyle = '#2b1606'; c.font = `900 ${Math.round(Math.max(12, r * 1.0))}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, 0, 1); }

}
function drawMallet(c, hx, hy, age) { // head at (hx, hy) at the moment of the hit
  const a = age < 0.12 ? easeOut(age / 0.12) : 1, off = age < 0.12 ? 1 - a * a : age > 0.3 ? clamp01((age - 0.3) / 0.2) : 0;
  const bounce = age >= 0.12 && age < 0.3 ? Math.sin((age - 0.12) / 0.18 * Math.PI) * 4 : 0;
  const x = hx + off * 30, y = hy - off * 46 - bounce, phi = lerp(0.95, 0.5, a), len = 50, al = age > 0.3 ? 1 - clamp01((age - 0.3) / 0.2) : 1;

  c.strokeStyle = 'rgba(0,0,0,.3)'; c.lineWidth = 4.5; c.beginPath(); c.moveTo(x + 1.5, y + 2.5); c.lineTo(ex + 1.5, ey + 2.5); c.stroke();
  c.strokeStyle = '#7a4a22'; c.lineWidth = 4; c.beginPath(); c.moveTo(x, y); c.lineTo(ex, ey); c.stroke();
  c.strokeStyle = 'rgba(255,220,170,.55)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x - 0.8, y); c.lineTo(ex - 0.8, ey); c.stroke();

// the xylophone: wooden frame, felt rails with metal rods, 8 bars. o = { dots, rings, mallet }
function drawXylo(c, g, time, kv, o = {}) {
  const { X, Y, W, H } = g;
  c.save();
  if (kv.off) c.translate(kv.off * V.w, 0);
  c.save(); c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 22; c.shadowOffsetY = 10;
  rr(c, X, Y - 10, W, H + 20, 14); c.fillStyle = lg(c, 0, Y - 10, 0, Y + H + 10, [[0, '#b9814a'], [0.5, '#8a5a2e'], [1, '#573519']]); c.fill(); c.restore();
  c.strokeStyle = 'rgba(30,14,4,.85)'; c.lineWidth = 1.8; rr(c, X, Y - 10, W, H + 20, 14); c.stroke();
  c.strokeStyle = 'rgba(255,225,180,.3)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(X + 12, Y - 7); c.lineTo(X + W - 12, Y - 7); c.stroke();
  rr(c, X + 6, Y - 4, W - 12, H + 8, 9); c.fillStyle = lg(c, 0, Y - 4, 0, Y + H + 4, [[0, '#2f1d12'], [1, '#1a100a']]); c.fill();
  const rails = [Y + H * 0.24, Y + H * 0.76];
  rails.forEach((y) => {
    c.lineCap = 'round';
    c.strokeStyle = '#3a1a1c'; c.lineWidth = 7; c.beginPath(); c.moveTo(X + 10, y); c.lineTo(X + W - 10, y); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 2; c.beginPath(); c.moveTo(X + 10, y - 2); c.lineTo(X + W - 10, y - 2); c.stroke();
    c.strokeStyle = lg(c, 0, y - 1.5, 0, y + 1.5, [[0, '#e6ebf5'], [1, '#7d8697']]); c.lineWidth = 2.4; c.beginPath(); c.moveTo(X + 12, y); c.lineTo(X + W - 12, y); c.stroke();
  });
  for (let i = 0; i < 8; i++) {
    const r = g.bar(i), age = S.press[i] != null ? time - S.press[i] : 9;
    let dip = 0, glow = 0;
    if (age >= 0 && age < 1.2) { dip = 3 * Math.exp(-age * 10) * Math.cos(age * 30); glow = Math.exp(-age * 5); }
    drawBar(c, r, i, { dip, g: glow, gc: '#ffe9b0', label: nm(kv.key, i), screws: rails });

// dots of a chord: root, third, fifth (steps beyond the top bar fold back to the low bars)
const chordDots = (k, t0, pulse = 0) => (k ? triad(CH[k].root).map((s, j) => ({ bar: barOf(s), col: CH[k].col, label: String(1 + 2 * j), t0: t0 + j * 0.06, pulse })) : []);
const keyView = (time) => {
  const p = clamp01((time - S.slide.t0) / 0.9);
  if (p >= 1) return { key: curKey(), off: 0 };
  return p < 0.5 ? { key: S.slide.from, off: easeIn(p * 2) } : { key: S.slide.to, off: -(1 - easeOut((p - 0.5) * 2)) };

// --- drawing: the stack view ---------------------------------------------------------------------------------
const qpt = (p0, p1, p2, u) => [(1 - u) * (1 - u) * p0[0] + 2 * (1 - u) * u * p1[0] + u * u * p2[0], (1 - u) * (1 - u) * p0[1] + 2 * (1 - u) * u * p1[1] + u * u * p2[1]];
function strokeQ(c, q, u, col, wd) {
  c.beginPath();
  for (let i = 0; i <= 24; i++) { const [x, y] = qpt(q[0], q[1], q[2], u * i / 24); if (i) c.lineTo(x, y); else c.moveTo(x, y); }

  if (!run) return;
  const sec = now() - run.t0;
  if (sec > run.total * run.bd + run.tail) {
    const r = run; run = null;
    if (r.bus) setTimeout(() => { try { r.bus.disconnect(); } catch { /* gone */ } }, 1800);
    r.onEnd?.(); return;
  }
  if (run.kind === 'fit') {
    const b = Math.max(0, sec / run.bd), k = Math.min(Math.floor(b / 4), run.n - 1), bar = run.b0 + k, lb = b - k * 4;
    const nt = BARS[bar].find((n) => lb >= n.s && lb < n.s + n.d), nk = nt ? `${bar}:${nt.s}` : '';
    if (nk !== run.nk) { run.nk = nk; if (nt) { S.press[nt.step] = time; S.ring = { step: nt.step, t: time }; } }
    if (S.f.sel !== bar) { S.f.sel = bar; S.f.selT = time; }
  }
}
function draw(c, w, h, dt) {
  const time = now();
  V.w = w; V.h = h;
  const mode = curMode(), kv = keyView(time);
  tickRun(time);
  geo.mode = mode; geo.bars = []; geo.slots = []; geo.cols = [];
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (mode === 'stack') drawStack(c, w, h, time, kv);
  else if (mode === 'fit') drawFit(c, w, h, time, kv);
  else if (mode === 'home') drawHome(c, w, h, dt, time, kv);
  else drawBlues(c, w, h, time, kv);
}

// --- taps on the picture -----------------------------------------------------------------------------------
const inR = (r, x, y) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function playNote(step) {
  if (!audioReady()) { maybeHint(); return; }
  mallet(stepMidi(step, KEYS[curKey()].base), AC.currentTime + 0.01, 1, master);
}
function cycleSlot(b) {
  const f = S.f, cur = f.slots[b];
  f.slots[b] = CH_KEYS[cur === null ? 0 : (CH_KEYS.indexOf(cur) + 1) % 3];
  f.popB = b; f.popT = now(); f.note = null; f.sel = b; f.selT = now();
  const was = f.won;
  f.won = f.slots.every((s, i) => s && BEST[i].keys.includes(s));
  playBars(b, 1);
  if (f.won && !was) { sfx.good(); setTimeout(showStage, 200); }
}
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, mode = geo.mode;
  if (mode === 'stack') {
    if (!S.s.asked) return;
    const i = geo.bars.findIndex((b) => inR(b, x, y));
    if (i >= 0) { buildChord(i); render(); }
  } else if (mode === 'fit') {
    if (!S.f.asked) return;
    const b = geo.slots.findIndex((s) => inR(s, x, y));
    if (b >= 0) { cycleSlot(b); render(); return; }
    const col = geo.cols.findIndex((q) => inR(q, x, y));
    if (col >= 0) { S.f.note = null; playBars(col, 1); return; }
    const i = geo.bars.findIndex((q) => inR(q, x, y));
    if (i >= 0) { S.press[i] = now(); playNote(i); maybeHint(); }
  }
});

// --- controls ----------------------------------------------------------------------------------------------
const ask = (q, opts, guess, oks, act) => `<p class="ch-q">${esc(q)}</p><div class="ch-row">${opts.map((o, i) => {
  const cls = guess === null ? '' : oks.includes(i) ? 'ok' : i === guess ? 'bad' : '';
  return `<button class="ch-opt ${cls}" data-act="${act}" data-i="${i}"${guess === null ? '' : ' disabled'}>${esc(o)}</button>`;
}).join('')}</div>`;
const verdict = (ok, text) => `<p class="ch-verdict"><b class="${ok ? 'ok' : 'no'}">${esc(ok ? T[lang].right : T[lang].notQuite)}</b> ${esc(text)}</p>`;
const stepsOf = (root) => triad(root);
const fitsHTML = (b) => `<div class="ch-fits">${CH_KEYS.map((k, i) => `<span style="--c:${CH[k].col}">${esc(k)} · ${esc(T[lang].fitPct(fmtPct(FITS[b][i])))}</span>`).join('')}</div>`;

function render() {
  const t = T[lang], v = lab.view, mode = curMode(), open = secret.unlocked();
  document.body.dataset.v = mode;
  let html = '', ro, st;
  const fine = `<div class="fine">${esc(t.fine)}</div>`;
  if (mode === 'stack') {
    const s = S.s, oks = [t.stackOpts.findIndex((o) => o === noteWord(stepsOf(3), 'C').replaceAll(' · ', ' '))];
    lab.setGlow('rgba(240, 184, 64, .24)');
    if (!s.asked) {
      html = ask(t.stackQ, t.stackOpts, null, oks, 'sPred');
      ro = ['?', '', '', '#f0b840'];
    } else {
      const ok = oks.includes(s.guess);
      html = ask(t.stackQ, t.stackOpts, s.guess, oks, 'sPred') + verdict(ok, t.exStack);
      html += `<div class="ch-table">${CH_KEYS.map((k) => `<div class="ch-tile ${s.built.has(k) ? 'on' : ''}" style="--c:${CH[k].col}">${esc(t.table[k])}<i>${s.built.has(k) ? esc(noteWord(stepsOf(CH[k].root), 'C')) : '? · ? · ?'}</i></div>`).join('')}</div>`;
      if (s.root !== null && !CH_KEYS.some((k) => CH[k].root === s.root)) html += `<p class="ch-verdict">${esc(t.others)}</p>`;
      const nmz = s.root === null ? '?' : noteWord(stepsOf(s.root), 'C'), col = s.root === null ? '#f0b840' : chordCol(s.root);
      ro = [nmz, t.chordWord, s.root === null ? '' : roman(s.root), col];
    }
    st = s.asked && s.built.size === 3 ? t.state.stackDone : t.state.stack0;
    st = { emo: s.asked && s.built.size === 3 ? '✅' : '🧱', title: st[0], lead: st[1] };
  } else if (mode === 'fit') {
    const f = S.f, tot = f.slots.reduce((a, k, b) => a + (k ? fitOf(b, k) : 0), 0) / 8;
    lab.setGlow('rgba(63, 193, 181, .24)');
    if (!f.asked) {
      html = ask(t.fitQ, CH_KEYS, null, [], 'fPred');
      ro = ['?', '', '', '#3fc1b5'];
    } else {
      const oks = CH_KEYS.map((k, i) => (BEST[3].keys.includes(k) ? i : -1)).filter((i) => i >= 0), ok = oks.includes(f.guess);
      html = `<div class="ch-row"><button class="ch-btn main" data-act="play">${esc(run && run.kind === 'fit' && run.n === 8 ? t.stop : t.play)}</button><button class="ch-btn" data-act="clear">${esc(t.clear)}</button></div>`;
      const sl = f.slots[f.sel];
      let info = t.tapSlot;
      if (sl && BEST[f.sel].keys.includes(sl)) info = BEST[f.sel].keys.length > 1 ? t.tie(BEST[f.sel].keys[0], BEST[f.sel].keys[1]) : t.exFit(BEST[f.sel].keys[0]);
      if (f.note === 'pred') {
        html += ask(t.fitQ, CH_KEYS, f.guess, oks, 'fPred') + verdict(ok, BEST[3].keys.length > 1 ? t.tie(BEST[3].keys[0], BEST[3].keys[1]) : t.exFit(BEST[3].keys[0])) + fitsHTML(3);
      } else if (f.won) {
        html += `<p class="ch-verdict"><b class="ok">${esc(t.allFit)}</b> ${esc(t.best(fmtPct(BEST.reduce((a, b) => a + b.fit, 0) / 8)))}</p>`;
      } else html += `<p class="ch-verdict">${esc(info)}</p>`;
      ro = [esc(t.fitPct(fmtPct(tot))), t.fitWord, t.bar(f.sel + 1), '#3fc1b5'];
    }
    st = f.won ? t.state.fitDone : t.state.fit0;
    st = { emo: f.won ? '✅' : '🎶', title: st[0], lead: st[1] };
  } else if (mode === 'home') {
    const h = S.h, seq = ROUNDS[h.round], fin = isHome(seq[3]);
    lab.setGlow('rgba(240, 106, 90, .24)');
    const homeIdx = CH_KEYS.findIndex(isHome), playing = run && run.kind === 'home';
    if (!h.asked) html = ask(t.homeQ, CH_KEYS, null, [], 'hPred');
    else {
      html = ask(t.homeQ, CH_KEYS, h.guess, [homeIdx], 'hPred') + verdict(h.guess === homeIdx, t.exHome);
      if (h.done) {
        html += `<div class="ch-row"><button class="ch-btn main" data-act="again">${esc(t.again)}</button></div>`;
      } else {
        html += `<p class="ch-q" style="margin-top:6px">${esc(t.round(h.round + 1, ROUNDS.length))}</p>`;
        html += `<div class="ch-row"><button class="ch-btn main" data-act="listen"${h.ans !== null ? ' disabled' : ''}>${esc(playing ? t.stop : h.heard ? t.listenAgain : t.listen)}</button></div>`;
        if (h.heard || h.ans !== null) {
          const correct = fin;
          html += `<p class="ch-q">${esc(t.finishedQ)}</p><div class="ch-row">${[[true, t.yes], [false, t.no]].map(([yes, lbl]) => {
            const cls = h.ans === null ? '' : yes === correct ? 'ok' : (h.ans === 'yes') === yes ? 'bad' : '';
            return `<button class="ch-opt ${cls}" data-act="yn" data-y="${yes ? 1 : 0}"${h.ans === null ? '' : ' disabled'}>${esc(lbl)}</button>`;
          }).join('')}</div>`;
        }
        if (h.ans !== null) {
          html += verdict(h.ok, `${t.lastChord(seq[3])} ${t.exHome}`);
          html += `<div class="ch-row"><button class="ch-btn main" data-act="next">${esc(t.next)}</button></div>`;
        }
      }
    }
    ro = [`${h.right} / ${ROUNDS.length}`, t.heardRight, h.ans !== null ? seq[3] : '', '#f06a5a'];
    st = h.done ? t.state.homeDone : t.state.home0;
    st = { emo: h.done ? '✅' : '🏠', title: st[0], lead: st[1] };
  } else { // the 12-bar blues
    const playing = run && run.kind === 'blues', bar = playing ? Math.min(11, Math.floor(beatNow() / 4)) : -1;
    lab.setGlow('rgba(95, 143, 208, .26)');
    html = `<div class="ch-row"><button class="ch-btn main" data-act="play">${esc(playing ? t.stop : t.play)}</button></div>`;
    ro = [bar >= 0 ? BLUES[bar] : '–', t.secrets.blues[1], bar >= 0 ? t.bar(bar + 1) : '', '#5f8fd0'];
    st = { emo: '🎸', title: t.secrets.blues[0], lead: t.secretA };
  }
  const chip = (k, emo, on) => `<button class="chip ch-chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  html += `<div class="ch-sec chips">${chip('blues', '🎸', S.sec === 'blues')}${chip('key', '🎼', S.sec === 'key')}</div>`;
  $('chBody').innerHTML = html;
  lab.setReadout(ro[0], ro[1], ro[2], ro[3]);
  const lead = S.sec === 'key' ? t.secretB : st.lead;
  lab.setState({ emo: S.sec === 'key' ? '🎼' : st.emo, title: S.sec === 'key' ? t.secrets.key[0] : st.title, lead, body: '', extra: fine });
  lab.setFacts(S.sec ? [] : t.facts[v]);
}
function changeView() {
  stopRun();
  if (S.sec) { S.sec = null; S.slide.t0 = -9; }
  render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'sPred') {
    S.s.guess = i; S.s.asked = true; buildChord(3); sfx.click(); render(); setTimeout(showStage, 60);
  } else if (act === 'fPred') {
    const f = S.f; f.guess = i; f.asked = true; f.slots[3] = BEST[3].keys[0]; f.popB = 3; f.popT = now(); f.note = 'pred'; f.sel = 3; f.selT = now();
    f.won = f.slots.every((s, k) => s && BEST[k].keys.includes(s));
    playBars(3, 1); setTimeout(showStage, 60);
  } else if (act === 'hPred') {
    S.h.guess = i; S.h.asked = true; S.h.revealT = now(); sfx.click(); render(); setTimeout(showStage, 60);
  } else if (act === 'play') {
    if (run && (run.kind === 'blues' || run.n === 8)) { stopRun(); render(); return; }
    if (curMode() === 'blues') playBlues(); else { S.f.note = null; playBars(0, 8); }
  } else if (act === 'clear') {
    stopRun(); S.f.slots = Array(8).fill(null); S.f.won = false; S.f.note = null; sfx.click(); render();
  } else if (act === 'listen') {
    if (run) { stopRun(); render(); return; }
    homeListen();
  } else if (act === 'yn') {
    const h = S.h; if (!h.heard || h.ans !== null) return;
    const yes = b.dataset.y === '1', fin = isHome(ROUNDS[h.round][3]);
    h.ans = yes ? 'yes' : 'no'; h.ok = yes === fin; if (h.ok) h.right++;
    h.revealT = now(); (h.ok ? sfx.good : sfx.bad)(); render(); setTimeout(showStage, 60);
  } else if (act === 'next') {
    const h = S.h; stopRun();
    if (h.round < ROUNDS.length - 1) { h.round++; h.heard = false; h.ans = null; h.shown = 0; } else h.done = true;
    sfx.click(); render();
  } else if (act === 'again') {
    const h = S.h; stopRun(); h.round = 0; h.right = 0; h.done = false; h.heard = false; h.ans = null; h.shown = 0; sfx.click(); render();
  } else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    stopRun();
    if (k === 'blues') S.sec = S.sec === 'blues' ? null : 'blues';
    else {
      const from = curKey();
      S.sec = S.sec === 'key' ? null : 'key';
      if (S.sec === 'key') { if (lab.view !== 'fit') { lab.view = 'fit'; lab.renderChrome(); } if (!S.f.asked) { S.f.asked = true; S.f.guess = null; } S.f.note = null; }
      S.slide = { t0: now(), from, to: curKey() };
    }
    sfx.click(); render();
  }
});

canvasLoop($('cv'), draw);
render();
</script>
</body>
