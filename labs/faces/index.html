// --- geometry ------------------------------------------------------------------------------------------------
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

// a convex solid from vertices and faces: normals point outwards, edges and adjacency are derived from the faces
function mk(id, V, F, cols, edgeCol) {

    if (r > 0.02) {
      ctx.save(); ctx.globalAlpha = r;
      const g = ctx.createRadialGradient(cx - 2, ay - 2, 1, cx, ay, 9); g.addColorStop(0, '#fff0b8'); g.addColorStop(1, GOLD);
      ctx.fillStyle = g; ctx.strokeStyle = '#a8791a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, ay, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
      pill(ctx, t_.lVertex, cx, ay - 24, GOLD, w, r);
      pill(ctx, t_.lFace, cx, by + ry + 22, GOLD, w, r);
      pill(ctx, t_.lCurved, cx, cy + Hh * 0.15, '#9ad0ff', w, r);
    }
  } else {
    const Rs = R * 1.18;
    const g = ctx.createRadialGradient(cx - Rs * 0.38, cy - Rs * 0.42, Rs * 0.05, cx, cy, Rs * 1.05);
    g.addColorStop(0, '#d2ebff'); g.addColorStop(0.35, '#4fa3ff'); g.addColorStop(1, '#1b447f');
    ctx.beginPath(); ctx.arc(cx, cy, Rs, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    if (r > 0.01) {
      const g2 = ctx.createRadialGradient(cx - Rs * 0.4, cy - Rs * 0.45, 2, cx - Rs * 0.2, cy - Rs * 0.2, Rs * 0.9);
      g2.addColorStop(0, `rgba(190,230,255,${0.55 * r})`); g2.addColorStop(1, 'rgba(190,230,255,0)'); ctx.fillStyle = g2; ctx.fill();
    }
    ctx.strokeStyle = lineC; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(cx - Rs * 0.4, cy - Rs * 0.5, Rs * 0.16, Rs * 0.09, -0.6, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    if (r > 0.02) pill(ctx, t_.lCurved, cx, cy, '#9ad0ff', w, r);
  }
}

canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  pose.idle += dt;
  if (!dragging && lab.view !== 'curved') {
    if (locked()) { pose.vy = 0; pose.vp = 0; } else {
      pose.yaw += pose.vy * dt; pose.pitch += pose.vp * dt;
      const k = Math.exp(-2.8 * dt); pose.vy *= k; pose.vp *= k;
      if (Math.abs(pose.vy) < 0.02) pose.vy = 0; if (Math.abs(pose.vp) < 0.02) pose.vp = 0;
      if (pose.idle > 3 && !S.auto && !pose.vy && !pose.vp) pose.yaw += 0.3 * dt;
    }
  }
  if (S.auto) pose.yaw += 0.9 * dt;
  if (lab.view === 'curved') { scn = null; drawCurved(ctx, w, h, dt, t); } else drawSolid(ctx, w, h, t);
});

// --- pointer: drag to turn, tap to mark ----------------------------------------------------------------------
let dragging = false, drag = null;
const cv = $('cv');
cv.addEventListener('pointerdown', (ev) => {
  cv.setPointerCapture(ev.pointerId);
  drag = { x: ev.clientX, y: ev.clientY, lx: ev.clientX, ly: ev.clientY, lt: performance.now(), moved: false };
  pose.vy = 0; pose.vp = 0; pose.idle = 0;
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) > 6) drag.moved = true;
  if (!drag.moved) return;
  const now = performance.now(), dt = Math.max(0.008, (now - drag.lt) / 1000), dx = ev.clientX - drag.lx, dy = ev.clientY - drag.ly;
  drag.lx = ev.clientX; drag.ly = ev.clientY; drag.lt = now; pose.idle = 0;
  if (lab.view === 'curved') { S.cpitch = clamp(S.cpitch + dy * 0.008, 0.15, 1.1); return; }
  if (locked()) return;
  dragging = true;
  pose.yaw += dx * 0.011; pose.pitch += dy * 0.011;
  pose.vy = clamp((dx * 0.011) / dt, -6, 6); pose.vp = clamp((dy * 0.011) / dt, -6, 6);
});
const endDrag = (ev) => {
  if (!drag) return;
  const d = drag; drag = null; dragging = false;
  if (performance.now() - d.lt > 90) { pose.vy = 0; pose.vp = 0; }
  if (ev.type === 'pointerup' && !d.moved) {
    const r = cv.getBoundingClientRect(); tap(ev.clientX - r.left, ev.clientY - r.top);
  }
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

function tap(x, y) {
  if (lab.view === 'curved') {
    const k = S.curved;
    if (k !== 'cyl' && !S.rev[k]) { S.rev[k] = true; sfx.good(); render(); }
    return;
  }
  if (!canMark()) return;
  const id = hit(x, y); if (id < 0) return;
  const m = curMode(), arr = getMarks()[m], at = arr.indexOf(id), tot = curSolid().total[m];
  pose.idle = 0;
  if (at >= 0) { arr.splice(at, 1); sfx.click(); } else {
    arr.push(id); sfx.tick();
    if (arr.length === tot) {
      if (lab.view === 'count') S.cnt.done[m] = true;
      sfx.good();
    }
  }
  render();
}

// --- controls ------------------------------------------------------------------------------------------------
function countForMe() {
  cancelTimers();
  const sol = curSolid(), mk_ = getMarks(), tok = S.tok;
  mk_[0] = []; mk_[1] = []; mk_[2] = [];
  const seq = [];
  for (let m = 0; m < 3; m++) for (let i = 0; i < sol.total[m]; i++) seq.push([m, i]);
  const step = clamp(3600 / seq.length, 40, 120);
  S.auto = true; let k = 0;
  const tick = () => {
    if (S.tok !== tok) return;
    if (k >= seq.length) { S.auto = false; sfx.good(); render(); return; }
    const [m, i] = seq[k++]; mk_[m].push(i); S.smode = m; sfx.tick(); render();
    setTimeout(tick, step);
  };
  tick();
}
function runMagic() {
  cancelTimers(); const tok = S.tok; S.magicN = 0;
  for (const id of [...IDS, 'ball']) M[id] = SOL[id].total.map((n) => [...Array(n).keys()]);
  const step = () => {
    if (S.tok !== tok || S.sec !== 'magic') return;
    S.magicN++; render(); sfx.tick();
    const el = $('eu' + (S.magicN - 1)); if (el) el.classList.add('fc-pop');
    if (S.magicN < 6) setTimeout(step, 650);
  };
  setTimeout(step, 700);
}
function goSolids() { lab.view = 'solids'; lab.renderChrome(); enterView('solids'); }
function secretPress(k) {
  if (!secret.unlocked()) { secret.open(); return; }
  if (S.sec === k) { S.sec = null; cancelTimers(); if (S.solid === 'ball') S.solid = 'cube'; resetPose(); render(); return; }
  if (lab.view !== 'solids') goSolids();
  cancelTimers();
  if (k === 'magic') { S.sec = 'magic'; if (S.solid === 'ball') S.solid = 'cube'; S.smode = 0; runMagic(); }
  else { S.sec = 'ball'; S.solid = 'ball'; S.smode = 0; resetPose(); }
  render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-mode], [data-solid], [data-cs], [data-act]'); if (!b || b.disabled || b.classList.contains('fc-off')) return;
  const d = b.dataset;
  if (d.mode !== undefined) { if (lab.view === 'count') S.mode = +d.mode; else S.smode = +d.mode; sfx.click(); }
  else if (d.solid !== undefined) {
    if (S.solid !== d.solid) { cancelTimers(); S.solid = d.solid; if (S.sec === 'ball' && d.solid !== 'ball') S.sec = null; resetPose(); }
    sfx.click();
  } else if (d.cs !== undefined) { S.curved = d.cs; sfx.click(); }
  else if (d.act === 'xray') { S.xray = !S.xray; sfx.click(); }
  else if (d.act === 'clear') { getMarks()[curMode()] = []; sfx.click(); }
  else if (d.act === 'auto') countForMe();
  else if (d.act === 'show') { S.rev[S.curved] = true; sfx.good(); }
  else if (d.act === 'sec') { secretPress(d.k); return; }
  render();
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-g]'); if (!b || b.disabled) return;
  const g = +b.dataset.g;
  if (lab.view === 'count') {
    S.cnt.guess[S.mode] = g; pose.idle = 0; sfx.click();
  } else { S.cylGuess = g; S.rev.cyl = true; (g === 2 ? sfx.good : sfx.bad)(); }
  render();
});

// --- render --------------------------------------------------------------------------------------------------
function secRow() {
  const un = secret.unlocked();
  const b = (k, emo, i) => `<button class="chip secret ${un ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${un ? `${emo} ${esc(T[lang].secrets[i][0])}` : '🔒 ???'}</button>`;
  return `<div class="row2"><div class="chips">${b('magic', '✨', 'a')}${b('ball', '⚽', 'b')}</div></div>`;
}
function modeChips(t, m) {
  const cnt = lab.view === 'count';
  return `<div class="chips">${t.modes.map((l, i) => {
    const off = cnt && i > 0 && !S.cnt.done[i - 1], nxt = cnt && !off && i > 0 && !S.cnt.done[i] && S.cnt.done[i - 1] && S.cnt.guess[i] === null && i !== m;
    return `<button class="chip ${i === m ? 'on' : ''} ${off ? 'fc-off' : ''} ${nxt ? 'fc-next' : ''}" data-mode="${i}"${off ? ' disabled' : ''}>${esc(l)}</button>`;
  }).join('')}</div>`;
}
const ctlBtns = (t, canX, extra) => `<div class="row2"><button class="chip ${S.xray ? 'on' : ''} ${canX ? '' : 'fc-off'}" data-act="xray"${canX ? '' : ' disabled'}>${esc(t.xray)}</button>${extra}</div>`;

function render() {
  const t = T[lang], v = lab.view;
  if (lastView !== v) enterView(v);
  document.body.dataset.v = v;
  if (v === 'count') renderCount(t); else if (v === 'solids') renderSolids(t); else renderCurved(t);
  lab.setFacts(t.facts[v]);
}

function guessCard(t, q, opts, guess, right, done) {
  askEl.hidden = false;
  askEl.innerHTML = `<div class="q">${esc(q)}</div><div class="opts">${opts.map((o) => {
    const cls = done ? (o === right ? 'ok' : o === guess ? 'bad' : '') : o === guess ? 'on' : '';
    return `<button class="fc-opt ${cls}" data-g="${o}"${guess !== null ? ' disabled' : ''}>${o}</button>`;
  }).join('')}</div>`;
}

function renderCount(t) {
  const m = S.mode, mk_ = getMarks()[m], g = S.cnt.guess[m], done = S.cnt.done[m], n = mk_.length;
  guessCard(t, t.q[m], OPT[m], g, CUBE[m], done);
  $('fcBody').innerHTML = `${modeChips(t, m)}
    <div class="fc-sum">${t.modes.map((l, i) => `<div class="fc-cell ${S.cnt.done[i] ? 'ok' : ''}"><span>${esc(l)}</span><b>${S.cnt.done[i] ? CUBE[i] : '?'}</b></div>`).join('')}</div>
    ${ctlBtns(t, g !== null, `<button class="chip ${g === null || done ? 'fc-off' : ''}" data-act="clear"${g === null || done ? ' disabled' : ''}>${esc(t.clear)}</button>`)}
    ${secRow()}`;
  lab.setReadout(done ? `${n}` : `${n} / ?`, t.modes[m], done ? '✓' : '', '#4fa3ff');
  let st;
  if (g === null) st = { emo: '🤔', title: t.q[m], lead: t.pickFirst, body: '' };
  else if (!done) st = { emo: '👆', title: t.tapTitle[m], lead: t.tapLead, body: t.marked(n) };
  else {
    const ok = g === CUBE[m];
    st = { emo: ok ? '✅' : '🔍', title: ok ? t.right : t.notq, lead: ok ? t.has(m, CUBE[m]) : `${t.guessed(g)} ${t.has(m, CUBE[m])}`, body: t.cb[m] };
  }
  lab.setState(st);
}

function tableHTML(t) {
  const ids = [...IDS]; if (S.sec === 'ball' || S.sec === 'magic') ids.push('ball');
  const mg = S.sec === 'magic';
  const rows = ids.map((id, i) => {
    const sol = SOL[id], mk_ = M[id] ?? [[], [], []], c0 = typeof sol.cols === 'string' ? sol.cols : '#f2f2f2';
    const cells = [0, 2, 1].map((m) => { const n = mk_[m].length; return `<td class="${n === sol.total[m] ? 'ok' : n ? '' : 'e'}">${n || '·'}</td>`; }).join('');
    const eu = mg ? `<td class="eu" id="eu${i}">${i < S.magicN ? sol.total[0] + sol.total[2] - sol.total[1] : '·'}</td>` : '';
    return `<tr class="${id === S.solid ? 'cur' : ''}" data-solid="${id}"><td><i class="fc-dot" style="background:${c0}"></i>${esc(t.sn[id])}</td>${cells}${eu}</tr>`;
  }).join('');
  return `<table class="fc-tbl"><tr><th></th>${t.th.map((x) => `<th>${esc(x)}</th>`).join('')}${mg ? '<th class="eu">F + V − E</th>' : ''}</tr>${rows}</table>`;
}

function renderSolids(t) {
  askEl.hidden = true;
  const sol = SOL[S.solid], mk_ = getMarks(), m = S.smode, n = mk_[m].length, tot = sol.total, allDone = [0, 1, 2].every((i) => mk_[i].length === tot[i]);
  const name = t.sn[S.solid];
  const shapes = IDS.map((id) => `<button class="chip ${S.solid === id ? 'on' : ''}" data-solid="${id}">${esc(t.sn[id])}</button>`).join('');
  $('fcBody').innerHTML = `<div class="chips">${shapes}</div>
    <div class="row2" style="margin-top:12px">${modeChips(t, m).replace('class="chips"', 'class="chips" style="flex:1"')}</div>
    ${ctlBtns(t, true, `<button class="chip" data-act="clear">${esc(t.clear)}</button><button class="chip ${S.auto ? 'fc-off' : ''}" data-act="auto">${esc(t.auto)}</button>`)}
    ${tableHTML(t)}
    ${secRow()}`;
  lab.setReadout(n === tot[m] ? `${n}` : `${n} / ?`, `${name} · ${t.modes[m]}`, allDone ? '✓' : '', sol.cols === '#4fa3ff' ? '#4fa3ff' : (typeof sol.cols === 'string' ? sol.cols : '#4fa3ff'));
  let st;
  if (S.sec === 'magic') st = { emo: '✨', title: t.secrets.a[0], lead: t.magicLead, body: t.magicBody };
  else if (S.sec === 'ball' && S.solid === 'ball' && !allDone) st = { emo: '⚽', title: t.secrets.b[0], lead: t.ballLead, body: t.ballBody };
  else if (allDone) st = { emo: '✅', title: t.solidLine(name, tot[0], tot[1], tot[2]), lead: t.solidDone, body: '' };
  else st = { emo: '🔷', title: name, lead: t.solidsLead, body: t.marked(n) };
  lab.setState(st);
}

function renderCurved(t) {
  const k = S.curved, rev = S.rev[k], cylOk = S.cylGuess !== null;
  const chips = ['cyl', 'cone', 'sph'].map((c) => {
    const off = c !== 'cyl' && !cylOk;
    return `<button class="chip ${k === c ? 'on' : ''} ${off ? 'fc-off' : ''}" data-cs="${c}"${off ? ' disabled' : ''}>${esc(t.cn[c])}</button>`;
  }).join('');
  const showBtn = k !== 'cyl' && !rev ? `<button class="chip" data-act="show">${esc(t.show)}</button>` : '';
  $('fcBody').innerHTML = `<div class="chips">${chips}${showBtn}</div>${secRow()}`;
  if (k === 'cyl') guessCard(t, t.cq, [3, 2, 0], S.cylGuess, 2, cylOk);
  else if (!rev) { askEl.hidden = false; askEl.innerHTML = `<div class="q">${esc(t.cTap)}</div>`; } else askEl.hidden = true;
  const nums = { cyl: ['2', t.plusCurved], cone: ['1', t.plusCurvedCone], sph: ['0', t.plusCurvedSph] };
  if (rev) lab.setReadout(nums[k][0], t.flatFaces, nums[k][1], '#ffd166'); else lab.setReadout('?', '', '', '#4fa3ff');
  let st;
  if (k === 'cyl') {
    if (!cylOk) st = { emo: '🤔', title: t.cq, lead: t.cLead, body: '' };
    else { const ok = S.cylGuess === 2; st = { emo: ok ? '✅' : '🔍', title: ok ? t.right : t.notq, lead: ok ? t.cylLead : `${t.guessed(S.cylGuess)} ${t.cylLead}`, body: t.cylBody }; }
  } else if (k === 'cone') st = rev ? { emo: '🔺', title: t.coneT, lead: t.coneDone, body: '' } : { emo: '🔺', title: t.coneT, lead: t.coneLead, body: '' };
  else st = rev ? { emo: '🔵', title: t.sphT, lead: t.sphDone, body: '' } : { emo: '🔵', title: t.sphT, lead: t.sphLead, body: '' };
  lab.setState(st);
}

render();
</script>
