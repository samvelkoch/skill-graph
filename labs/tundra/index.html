    for (const k of [-0.5, 0, 0.5]) { c.beginPath(); c.ellipse(gx, gy, R * Math.abs(Math.cos(k * 1.4)) , R, 0, 0, 6.2832); c.stroke(); }
    for (const k of [-0.55, 0, 0.55]) { c.beginPath(); c.moveTo(gx - R * Math.cos(Math.asin(k)), gy + R * k); c.lineTo(gx + R * Math.cos(Math.asin(k)), gy + R * k); c.stroke(); }
    c.fillStyle = 'rgba(255,255,255,.92)'; c.beginPath(); c.ellipse(gx, gy - R + 8, 32, 10, 0, 0, 6.2832); c.fill(); c.beginPath(); c.ellipse(gx, gy + R - 8, 40, 11, 0, 0, 6.2832); c.fill();
    const B = [[200, 70], [304, 112], [304, 222], [200, 262]], at = (u) => { const v = 1 - u; return [0, 1].map((i) => v * v * v * B[0][i] + 3 * v * v * u * B[1][i] + 3 * v * u * u * B[2][i] + u * u * u * B[3][i]); };
    c.setLineDash([3, 6]); c.strokeStyle = 'rgba(255,225,120,.9)'; c.lineWidth = 2; c.beginPath(); c.moveTo(B[0][0], B[0][1]); c.bezierCurveTo(B[1][0], B[1][1], B[2][0], B[2][1], B[3][0], B[3][1]); c.stroke(); c.setLineDash([]);
    const u = (time * 0.12) % 1, [px, py] = at(u), [qx, qy] = at(Math.min(1, u + 0.02));
    ternFig(c, px, py, 1.3, Math.atan2(qy - py, qx - px), Math.sin(time * 9), true);
    c.restore();
    c.globalAlpha = rv; pill(c, T[lang].an.globeN, gx, gy - R - 12, 'center'); pill(c, T[lang].an.globeS, gx, gy + R + 12, 'center'); c.globalAlpha = 1;
  }
}
function drawMyth(c, time, SN) {

    const EDGE = 262;
    c.fillStyle = lin(c, 0, VIS.Y0, 0, SN, [[0, '#6f9fd6'], [1, '#dbe9f3']]); c.fillRect(X0 - 2, VIS.Y0 - 2, X1 - X0 + 4, SN - VIS.Y0 + 2);
    c.fillStyle = lin(c, 0, SN + 70, 0, Y1, [[0, '#2f6fa8'], [1, '#143c66']]); c.fillRect(EDGE, SN + 70, X1 - EDGE + 2, Y1 - SN - 68);
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1.5; c.beginPath(); for (let x = EDGE + 6; x < X1; x += 22) { c.moveTo(x, SN + 90 + Math.sin(time + x) * 2); c.quadraticCurveTo(x + 6, SN + 85, x + 12, SN + 90 + Math.sin(time + x) * 2); } c.stroke();
    c.beginPath(); c.moveTo(X0 - 2, SN); c.lineTo(EDGE, SN); c.lineTo(EDGE - 4, SN + 32); c.lineTo(EDGE + 3, SN + 52); c.lineTo(EDGE - 3, Y1 + 2); c.lineTo(X0 - 2, Y1 + 2); c.closePath(); c.fillStyle = lin(c, 0, SN, 0, Y1, [[0, '#8a8f58'], [0.06, '#6b5b45'], [1, '#463a30']]); c.fill();
    c.fillStyle = lin(c, 0, SN - 3, 0, SN + 6, [[0, '#7da552'], [1, '#5f7a3c']]); c.fillRect(X0 - 2, SN - 3, EDGE - X0 + 2, 9);
    for (let i = 0; i < 3; i++) {

      if (ph < 0.45) x = lerpN(30, 228, ph / 0.45); else if (ph < 0.62) { x = 228; bob = Math.sin(time * 9) * 0.8; } else if (ph < 0.67) { x = 228; fl = ph < 0.645 ? 1 : -1; } else { x = lerpN(228, 30, (ph - 0.67) / 0.33); fl = -1; }

  } else {
    c.fillStyle = lin(c, 0, VIS.Y0, 0, Y1, [[0, '#1a1f36'], [1, '#2b3150']]); c.fillRect(X0 - 2, VIS.Y0 - 2, X1 - X0 + 4, Y1 - VIS.Y0 + 4);
    const sp = c.createLinearGradient(60, 0, 190, 230); sp.addColorStop(0, 'rgba(255,240,200,.28)'); sp.addColorStop(1, 'rgba(255,240,200,0)'); c.fillStyle = sp; c.beginPath(); c.moveTo(50, VIS.Y0); c.lineTo(86, VIS.Y0); c.lineTo(290, 240); c.lineTo(110, 240); c.closePath(); c.fill();
    const cx = 168, cy = 236;
    ell(c, cx, cy + 14, 128, 30, '#d6dde9'); ell(c, cx, cy + 6, 128, 30, lin(c, 0, cy - 20, 0, cy + 30, [[0, '#ffffff'], [1, '#d3deee']]));
    const L = [];
    for (let i = 0; i < 7; i++) { const a = time * 0.55 + i * 0.8976; L.push([cx + Math.cos(a) * 94, cy + 6 + Math.sin(a) * 18, -Math.sin(a) > 0 ? 1 : -1]); }
    L.sort((p, q) => p[1] - q[1]).forEach(([lx, ly, f]) => lemmingFig(c, lx, ly, 1.25, f, Math.sin(time * 8 + lx) * 0.4));

    c.strokeStyle = '#4a4f66'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 0); c.lineTo(-16, 56); c.moveTo(0, 0); c.lineTo(16, 56); c.moveTo(0, 0); c.lineTo(0, 58); c.stroke();
    c.fillStyle = lin(c, 0, -34, 0, 0, [[0, '#5b6280'], [1, '#2c3148']]); c.beginPath(); c.roundRect(-24, -34, 44, 32, 6); c.fill();
    c.fillStyle = '#1a1d2c'; c.beginPath(); c.roundRect(-38, -26, 16, 16, 3); c.fill(); dot(c, -41, -18, 6, '#10131f'); dot(c, -43, -20, 2, 'rgba(255,255,255,.6)');
    dot(c, -10, -42, 8, '#3a4160'); dot(c, 10, -42, 8, '#3a4160'); c.restore();

}

// --- the loop: animate, draw -------------------------------------------------------------------------------------
function tick(dt) {
  let upd = false;
  if (S.run) {
    S.g = Math.min(1, S.g + dt / 10); S.t = Math.min(11.9, S.g * 12);
    S.rootP = Math.max(S.rootP, Math.min(rootWant('pine', S.g), thawD(S.t)));
    S.rootC = Math.max(S.rootC, Math.min(rootWant(companion(), S.g), thawD(S.t)));
    if (S.g >= 1) finishRun(); else upd = true;
  }
  if (S.heating) { S.heat = Math.min(1, S.heat + dt / 6); if (S.heat >= 1) { S.heating = false; render(); } else upd = true; }
  if (S.tween) { S.st += (S.sGoal - S.st) * Math.min(1, dt * 3); if (Math.abs(S.sGoal - S.st) < 0.02) { S.st = S.sGoal; S.tween = false; paint(); } upd = true; }
  if (S.sAns !== null && S.rvS < 1) S.rvS = Math.min(1, S.rvS + dt / 1.6);
  for (const k of Object.keys(S.rvA)) if (S.rvA[k] < 1) { S.rvA[k] = Math.min(1, S.rvA[k] + dt / 1.8); }
  if (upd) { S.pt += dt; if (S.pt > 0.1) { S.pt = 0; paint(); } }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  tick(dt);
  const sc = Math.min(w / DW, h / DH), ox = (w - DW * sc) / 2, oy = (h - DH * sc) / 2;
  VIS.sc = sc; VIS.X0 = -ox / sc; VIS.X1 = (w - ox) / sc; VIS.Y0 = -oy / sc; VIS.Y1 = (h - oy) / sc;
  c.save(); c.translate(ox, oy); c.scale(sc, sc);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'dig') drawDig(c, time); else if (v === 'summer') drawSummer(c, time); else drawAnimals(c, time);
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function finishRun() {
  S.run = false; S.g = 1; S.t = 7.6; // settle in August, when the thawed layer is deepest
  S.ran.pine = false; S.ran[companion()] = true;
  (S.pick !== 'pine' ? sfx.good : sfx.bad)();
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'plant') { if (S.run) return; S.pick = b.dataset.k; S.g = 0; S.rootP = 0; S.rootC = 0; sfx.click(); }
  else if (a === 'run') {
    if (!S.pick || S.run) return;
    S.run = true; S.g = 0; S.t = 0; S.rootP = 0; S.rootC = 0; sfx.click();
  } else if (a === 'dsec') {
    if (!secret.unlocked()) return secret.open();
    S.sec.dig = true; S.house = 'ground'; S.heat = 0; S.heating = false; sfx.click();
  } else if (a === 'dback') { S.sec.dig = false; S.heating = false; sfx.click(); }
  else if (a === 'hmode') { S.house = b.dataset.k; S.heat = 0; S.heating = false; sfx.click(); }
  else if (a === 'heat') { S.heat = 0; S.heating = true; sfx.push(); }
  else if (a === 'sopt') {
    if (S.sAns !== null) return;
    S.sAns = +b.dataset.k; S.rvS = 0; S.sGoal = 6.5; S.tween = true; (S.sAns === T[lang].sum.ok ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'animal') { S.an = +b.dataset.k; sfx.click(); }
  else if (a === 'aopt') {
    const A = ANIM[S.an]; if (S.aAns[A.id] != null) return;
    S.aAns[A.id] = +b.dataset.k; S.rvA[A.id] = 0; (+b.dataset.k === A.ok ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'asec') {
    if (!secret.unlocked()) return secret.open();
    S.sec.an = true; S.myth = 'wild'; sfx.click();
  } else if (a === 'aback') { S.sec.an = false; sfx.click(); }

$('dSl').addEventListener('input', (ev) => { if (S.run) return; S.t = +ev.target.value; sfx.tick(); paint(); });
$('sSl').addEventListener('input', (ev) => { S.st = S.sGoal = +ev.target.value; S.tween = false; paint(); });

// --- one render per change: controls; paint() updates readout, state card and facts ----------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('secDig').hidden = v !== 'dig'; $('secSum').hidden = v !== 'summer'; $('secAn').hidden = v !== 'animals';
  if (v === 'dig') renderDigCtrl(t); else if (v === 'summer') renderSumCtrl(t); else renderAnCtrl(t);
  paint();
}
const secChip = (key, emo) => (secret.unlocked() ? `${emo} ${esc(T[lang].secrets[key][0])}` : '🔒 ???');

    return `<button class="chip ${S.pick === k ? 'on' : ''}" data-act="plant" data-k="${k}"${S.run ? ' disabled' : ''}>${e} ${esc(d.plants[k])}${mark}</button>`;
  }).join('');
  $('dRun').textContent = S.run ? d.going : S.g >= 1 ? d.again : d.run; $('dRun').disabled = !S.pick || S.run;
  $('dSec').innerHTML = secChip('house', '🏠'); $('dSec').className = `chip secret${secret.unlocked() ? ' open' : ''}`; $('dSec').disabled = S.run;

function renderSumCtrl(t) {

  }).join('');
  $('sV').textContent = S.sAns === null ? '' : S.sAns === s.ok ? s.vOk : s.vNo; $('sV').className = `tn-v ${S.sAns === s.ok ? 'ok' : 'no'}`;
}
function renderAnCtrl(t) {

  if (myth) {

    $('mBack').textContent = a.myth.back; return;

  $('aChips').innerHTML = ANIM.map((x, i) => {

    return `<button class="chip ${i === S.an ? 'on' : ''}" data-act="animal" data-k="${i}">${x.emo} ${esc(a.names[x.id])}${mark}</button>`;
  }).join('');

  }).join('');

function paint() {
  const t = T[lang], v = lab.view;
  if (v === 'dig') paintDig(t); else if (v === 'summer') paintSum(t); else paintAn(t);
}
function paintDig(t) {
  const d = t.dig, f = t.facts;

    lab.setReadout(`${dec(th)} ${d.unit}`, hs.sub, hs.modes[S.house], '#7fa6d8'); lab.setGlow('rgba(110,140,190,.28)');
    const st = S.heat <= 0 ? hs.idle : S.heating ? hs.going : hs[S.house];
    lab.setState({ emo: S.heat <= 0 ? '🏠' : S.heating ? '🔥' : S.house === 'ground' ? '🕳️' : '🧊', title: st[0], lead: st[1], body: '', extra: '' });
    lab.setFacts(f.house); return;
  }
  if (+$('dSl').value !== S.t) $('dSl').value = S.t;
  const m = monthOf(S.t);
  lab.setReadout(`${dec(thawed(S.t))} ${d.unit}`, d.sub, t.months[m], '#7fa6d8'); lab.setGlow('rgba(110,140,190,.28)');
  let st = { emo: '⛏️', title: d.idle[0], lead: d.idle[1], body: '' };
  if (S.pick) {
    const pn = d.plants[S.pick], pe = PLANTS.find((p) => p[0] === S.pick)[1];
    if (S.run) st = { emo: '⏳', title: d.goingS[0], lead: d.goingS[1], body: '' };
    else if (S.g >= 1) { const r = d.res[S.pick]; st = { emo: pe, title: r[0], lead: r[1], body: `${S.pick === 'pine' ? d.noteW : d.noteP} ${d.more}` }; }
    else st = { emo: pe, title: d.picked(pn)[0], lead: d.picked(pn)[1], body: '' };

function paintSum(t) {

  if (+$('sSl').value !== S.st) $('sSl').value = S.st;
  lab.setReadout(`${Math.round(h)} ${lang === 'ru' ? 'ч' : 'h'}`, s.sub, t.months[monthOf(S.st)], '#7fc79a'); lab.setGlow('rgba(120,190,150,.24)');
  let key;
  if (h < 0.5) key = 'polar'; else if (w < 0.12) key = 'winter'; else if (w < 0.9) key = m < 7 ? 'thaw' : 'autumn'; else key = h > 23.5 ? 'midnight' : 'summer';
  const emo = { polar: '🌌', winter: '❄️', thaw: '🌤️', summer: '☀️', midnight: '🌞', autumn: '🍂' }[key];
  if (S.sAns !== null) lab.setState({ emo: S.sAns === s.ok ? '✅' : '🤔', title: S.sAns === s.ok ? s.vOk : s.vNo, lead: s.why[S.sAns], body: `${emo} ${s.seasons[key][0]}: ${s.seasons[key][1]}`, extra: '' });
  else lab.setState({ emo, title: s.seasons[key][0], lead: s.seasons[key][1], body: '', extra: '' });
  lab.setFacts(S.sAns !== null ? [...t.facts.sum, t.facts.sumAfter] : t.facts.sum);
}

  lab.setGlow('rgba(150,170,230,.26)');
  if (S.sec.an) {

    lab.setState({ emo: S.myth === 'wild' ? '🐹' : '🎬', title: st[0], lead: st[1], body: '', extra: '' });
    lab.setFacts(t.facts.myth); return;
  }

  else lab.setState({ emo: got === A.ok ? '✅' : '🤔', title: got === A.ok ? a.vOk : a.vNo, lead: a.res[A.id], body: '', extra: '' });
  lab.setFacts(facts);
}
