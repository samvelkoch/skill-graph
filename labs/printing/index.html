      for (let i = 0; i < 3; i++) { const sx2 = x + cw * .2 + i * (ss + 8), sy2 = y + ch * .8 - ss * 1.15; drawSort(ctx, sx2, sy2, ss, ss * 1.15, null); strokes(ctx, (i + 1) % 4, sx2 + ss / 2, sy2 + ss * .55, ss * .8); }

    ctx.restore();
    pill(ctx, `${side ? L.sec.kr + ' · 1377' : L.sec.cn + ' · 1040s'}`, x + cw / 2, y + 22, x + cw, y + ch, { size: 13 });
  });
  // timeline
  const ty = R.y + R.h - stripH * .42, nodes = [[.14, '1040s', L.sec.bi], [.5, '1377', L.sec.jk], [.86, '≈ 1450', L.sec.gu]];
  ctx.save(); ctx.strokeStyle = 'rgba(255,200,97,.45)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(R.x + R.w * .08, ty); ctx.lineTo(R.x + R.w * .92, ty); ctx.stroke();
  const prog = ((t * .22) % 1) * .84 + .08; ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(R.x + R.w * prog, ty, 4.5, 0, 7); ctx.fill();
  nodes.forEach(([f, yr, nm], i) => {
    const x = R.x + R.w * f;
    ctx.fillStyle = C.gold; ctx.strokeStyle = '#7a4e12'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, ty, 7, 0, 7); ctx.fill(); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff'; ctx.font = font(900, 15); ctx.fillText(yr, x, ty - 14);
    ctx.fillStyle = '#d3d9e8'; ctx.font = font(700, 12); ctx.fillText(nm, x, ty + 24);
  });
  ctx.restore();
}
function drawNews(ctx, R, t, L) {
  warmPanel(ctx, R.x, R.y, R.w, R.h);
  const cx = R.x + R.w / 2, cy = R.y + R.h / 2;
  const sw = Math.min(R.w * .5, 200), sh = Math.min(R.h * .82, sw * 1.4), sx = cx - sw / 2, sy = cy - sh / 2;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
  ctx.fillStyle = lg(ctx, sx, sy, sx + sw, sy + sh, [[0, '#fbf3df'], [1, '#e3d4ae']]); rr(ctx, sx, sy, sw, sh, 4); ctx.fill(); ctx.restore();
  ctx.strokeStyle = '#bfae80'; ctx.lineWidth = 1; rr(ctx, sx, sy, sw, sh, 4); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.font = font(500, sw * .2, SERIF); ctx.fillText('Relation', cx, sy + sh * .15);
  ctx.fillRect(sx + sw * .07, sy + sh * .19, sw * .86, 2); ctx.fillRect(sx + sw * .07, sy + sh * .205, sw * .86, .8);
  ctx.font = font(800, 12); ctx.fillStyle = '#4a3a22'; ctx.fillText(`${L.m.towns.strasbourg} · 1605`, cx, sy + sh * .265);
  ctx.fillRect(sx + sw * .07, sy + sh * .285, sw * .86, .8);
  ctx.strokeStyle = 'rgba(26,26,26,.7)'; ctx.lineWidth = 1.5; ctx.setLineDash([2.4, 1.2, 1.6, 1.2, 3, 1.2]);
  [0, 1].forEach((col) => { const cx0 = sx + sw * (.09 + col * .45), cw0 = sw * .38; for (let i = 0; i < 12; i++) { const yy = sy + sh * (.33 + i * .05); const wv = cw0 * (.7 + .3 * Math.abs(Math.sin(i * 2.3 + col * 1.7))); ctx.beginPath(); ctx.moveTo(cx0, yy); ctx.lineTo(cx0 + wv, yy); ctx.stroke(); } });
  ctx.setLineDash([]);
  const readers = [['👩', .12, .22], ['🧑', .1, .52], ['👨', .13, .82], ['👵', .88, .22], ['🧔', .9, .52], ['👧', .87, .82]];
  readers.forEach(([e, fx, fy], i) => {
    const rx = R.x + R.w * fx, ry = R.y + R.h * fy, per = 3.6, loc = (((t - i * .55) % per) + per) % per, k = loc / 1.1;
    emo(ctx, e, rx, ry, 30);
    if (k < 1) {
      const q = eio(k), x = lerp(cx, rx + (fx < .5 ? 16 : -16), q), y = lerp(cy, ry, q) - Math.sin(Math.PI * q) * 30;
      ctx.save(); ctx.translate(x, y); ctx.rotate((fx < .5 ? -1 : 1) * Math.sin(q * 6) * .4); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 5;
      ctx.fillStyle = '#fbf3df'; rr(ctx, -9, -12, 18, 24, 2); ctx.fill(); ctx.shadowColor = 'transparent';
      ctx.fillStyle = 'rgba(26,26,26,.6)'; for (let j = 0; j < 5; j++) ctx.fillRect(-6, -8 + j * 4, 12, 1); ctx.restore();
    } else {
      const sc = eback(clamp01((loc - 1.1) / .3));
      ctx.save(); ctx.translate(rx + (fx < .5 ? 20 : -20), ry + 8); ctx.rotate(fx < .5 ? -.2 : .2); ctx.scale(sc, sc);
      ctx.fillStyle = '#fbf3df'; rr(ctx, -7, -9, 14, 18, 2); ctx.fill(); ctx.fillStyle = 'rgba(26,26,26,.6)'; for (let j = 0; j < 4; j++) ctx.fillRect(-4.5, -6 + j * 3.4, 9, .9); ctx.restore();
    }
  });
}

// --- state ----------------------------------------------------------------------------------------------------------
const S = {
  sec: null, pad: {},
  race: { ph: 'q1', pick: [null, null], t0: 0, N: 100, start: 0, run: false, dur: 9 },
  type: { ph: 'q1', pick: [null, null], t0: 0, stick: [], inked: false, inkT: -9, pressT: -9, printed: false },
  map: { ph: 'q1', pick: [null, null], t0: 0, year: 1500 },
};
const lab = shell({ key: 'printing', T, topics: TOPICS, views: ['race', 'type', 'map'],
  onLang: () => { S.pad = {}; render(); },
  onView: () => { S.sec = null; render(); } });
lab.setGlow('rgba(255,170,70,.2)');
const secret = secretLab('printing', () => ({
  secrets: [{ emo: '🏯', title: T[lang].secrets.older[0], desc: T[lang].secrets.older[1] }, { emo: '📰', title: T[lang].secrets.news[0], desc: T[lang].secrets.news[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="prRace">
    <div id="prRaceCtl">
      <div class="pr-row"><span class="pr-lbl" id="rN"></span></div>
      <input type="range" class="big" id="rSlider" min="1" max="200" value="100" style="--track: linear-gradient(90deg, #8B5E3C, #FFC861)">
      <div class="ends"><span>1</span><span>200</span></div>
      <div class="row2" style="margin-top:0"><button class="btn" data-act="race" id="rGo"></button></div>
    </div>
    <div class="row2"><div class="chips" id="rChips"></div></div>
  </div>
  <div id="prType">
    <div class="row2" style="margin-top:0"><button class="chip" data-act="undo" id="tUndo"></button><button class="btn" data-act="ink" id="tInk"></button><button class="btn" data-act="press" id="tPress"></button><button class="chip pr-sp" data-act="again" id="tAgain"></button></div>
  </div>
  <div id="prMap">
    <input type="range" class="big" id="mSlider" min="1450" max="1500" value="1500" style="--track: linear-gradient(90deg, #9DC3D6, #FFC861)">
    <div class="ends"><span>1450</span><span>1500</span></div>
  </div>`;
const askEl = Object.assign(document.createElement('div'), { className: 'pr-ask card' });
$('overlay').append(askEl);

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const measure = () => {
  if (askEl.style.display === 'none') return;
  const v = lab.view; S.pad[v] = Math.max(S.pad[v] || 0, askEl.offsetHeight);
};
let lastW = 0;
new ResizeObserver(([e]) => { const w = Math.round(e.contentRect.width); if (w !== lastW) { lastW = w; S.pad = {}; } measure(); }).observe($('stage'));
new ResizeObserver(measure).observe(askEl);

// --- the question card --------------------------------------------------------------------------------------------
function askHTML(L, v, V) {
  const D = L[KEY[v]], k = +V.ph[1] - 1, opts = D['o' + (k + 1)], q = D['q' + (k + 1)], ph = V.ph[0];
  if (ph === 'r') {
    const ok = V.pick[k] === OKI[v][k];
    return `<div class="pr-verdict ${ok ? 'ok' : 'no'}">${esc(ok ? L.right : L.wrong)}</div><p class="pr-text">${esc(D['r' + (k + 1)])}</p>
      <button class="btn pr-next" data-n="1">${esc(L.next)}</button>`;
  }
  return `<div class="pr-q">${esc(q)}</div><div class="pr-opts">${opts.map((o, i) => {
    let cls = '', dis = '';
    if (ph === 'a') { dis = 'disabled'; if (i === OKI[v][k]) cls = 'ok'; else if (i === V.pick[k]) cls = 'no'; }
    return `<button class="pr-opt ${cls}" data-o="${i}" ${dis}>${esc(o)}</button>`;
  }).join('')}</div>`;
}
askEl.addEventListener('click', (ev) => {
  const v = lab.view, V = S[v];
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.o !== undefined && V.ph[0] === 'q') {
    const k = +V.ph[1] - 1, i = +b.dataset.o;
    V.pick[k] = i; (i === OKI[v][k] ? sfx.good : sfx.bad)();
    V.ph = 'a' + (k + 1); V.t0 = now(); render(); showStage();
  } else if (b.dataset.n && V.ph[0] === 'r') {
    sfx.click(); V.ph = V.ph === 'r1' ? 'q2' : 'play'; render();
  }
});

// --- controls ------------------------------------------------------------------------------------------------------
function startRace() {
  const R = S.race; R.start = now(); R.dur = Math.min(R.N, 3 + R.N / 20) * raceU(R.N); R.run = true; sfx.push(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, V = S.type;
  if (act === 'race') startRace();
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  } else if (act === 'undo') { V.stick.pop(); sfx.tick(); }
  else if (act === 'ink') { V.inked = true; V.inkT = now(); sfx.click(); }
  else if (act === 'press') {
    V.pressT = now(); sfx.push();
    setTimeout(() => { V.printed = true; if (V.stick.map((s) => s.ch).join('') === T[lang].t.word) sfx.good(); render(); }, 760);
  } else if (act === 'again') { V.stick = []; V.inked = false; V.printed = false; V.pressT = -9; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'rSlider') { S.race.N = +ev.target.value; S.race.run = false; S.race.start = 0; render(); }
  if (ev.target.id === 'mSlider') { S.map.year = +ev.target.value; render(); }
});
$('cv').addEventListener('pointerdown', (ev) => {
  const V = S.type;
  if (lab.view !== 'type' || V.ph !== 'play' || S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, L = T[lang], G = typeFree(r.width, r.height, L);
  const i = G.cells.findIndex((c) => x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h);
  if (i < 0 || V.inked || V.printed || V.stick.length >= G.n) return;
  V.stick.push({ ch: L.t.case[i], cell: i, t0: now() }); sfx.snap(); render();
});

// --- render: controls, readout, state card ------------------------------------------------------------------------
function render() {
  const L = T[lang], v = lab.view, V = S[v], play = V.ph === 'play', qa = !play;
  document.body.dataset.v = v; document.body.dataset.ph = qa ? 'qa' : 'play';
  askEl.style.display = qa ? '' : 'none';
  if (qa) askEl.innerHTML = askHTML(L, v, V);
  $('prRace').style.display = v === 'race' && play ? '' : 'none';
  $('prType').style.display = v === 'type' && play ? '' : 'none';
  $('prMap').style.display = v === 'map' && play ? '' : 'none';
  $('prRaceCtl').style.display = S.sec ? 'none' : '';
  // race controls
  const R = S.race;
  $('rN').textContent = L.copies(R.N); $('rGo').textContent = L.r.race; $('rSlider').value = R.N;
  const open = secret.unlocked(), sc = (k, e) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(L.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('rChips').innerHTML = sc('older', '🏯') + sc('news', '📰');
  // type controls
  const TV = S.type, n = L.t.word.length;
  $('tUndo').textContent = L.t.undo; $('tInk').textContent = L.t.ink; $('tPress').textContent = L.t.pressBtn; $('tAgain').textContent = L.again;
  $('tUndo').disabled = !TV.stick.length || TV.inked || TV.printed;
  $('tInk').disabled = TV.stick.length !== n || TV.inked;
  $('tPress').disabled = !TV.inked || TV.pressT > 0;
  $('tAgain').disabled = !TV.stick.length;
  $('mSlider').value = S.map.year;
  // readout
  const acc = ACC[v];
  if (S.sec && v === 'race') lab.setReadout('', '', '', acc);
  else if (qa) lab.setReadout('?', '', '', acc);
  else if (v === 'race') {
    const tp = 3 + R.N / 20, k = R.N < tp ? 0 : R.N > tp ? 1 : 2, w = L.r.wins[k];
    lab.setReadout(`<span style="font-size:22px">${esc(w.charAt(0).toUpperCase() + w.slice(1))}</span>`, L.r.model, '', acc);
  } else if (v === 'type') lab.setReadout(esc(TV.stick.map((s) => s.ch).join(' ')) || '–', `${TV.stick.length} / ${n}`, '', acc);
  else lab.setReadout(String(S.map.year), '', '', acc);
  // state card
  if (S.sec && v === 'race') {
    const k = S.sec; lab.setState({ emo: k === 'older' ? '🏯' : '📰', title: L.secrets[k][0], lead: L.sec[k + 'Text'], body: '', extra: '' });
  } else {
    const full = V.ph === 'r2' || play, [e, ti, le, bo] = L.st[v][full ? 1 : 0];
    lab.setState({ emo: e, title: ti, lead: le, body: bo, extra: '' });
  }
  requestAnimationFrame(measure);
}

// --- the loop ----------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (ctx, w, h, dt, time) => {
  const L = T[lang], v = lab.view, V = S[v], qa = V.ph !== 'play', tn = now();
  // phase changes happen here, in time
  if (V.ph[0] === 'a' && tn - V.t0 >= DUR[v][+V.ph[1] - 1]) { V.ph = 'r' + V.ph[1]; render(); }
  if (v === 'race' && S.race.run && tn - S.race.start >= S.race.dur) { S.race.run = false; render(); sfx.good(); }
  const pad = qa && S.pad[v] ? S.pad[v] + 14 : 0;
  const R = { x: 6, y: pad + 4, w: w - 12, h: Math.max(60, h - pad - 10) };
  const rd = qa ? +V.ph[1] : 0, at = V.ph[0] === 'q' ? 0 : tn - V.t0;
  if (v === 'race') {
    if (S.sec === 'older') return drawOlder(ctx, { x: 6, y: 4, w: w - 12, h: h - 10 }, time, L);
    if (S.sec === 'news') return drawNews(ctx, { x: 6, y: 4, w: w - 12, h: h - 10 }, time, L);
    const Rc = S.race;
    if (rd === 0) {
      const tau = Rc.run ? (tn - Rc.start) / raceU(Rc.N) : Rc.start ? Infinity : 0;
      return drawRace(ctx, R, { N: Rc.N, tau, time, L });
    }
    const N = 100, u = raceU(N);
    if (rd === 1) return drawRace(ctx, R, { N, tau: V.ph === 'q1' ? 0 : at / u, time, L });
    if (V.ph === 'q2') return drawRace(ctx, R, { N, tau: Infinity, time, L });
    return drawRace(ctx, R, { N, tau: Infinity, time, L, zoom: seg(at, 0, 1.3), cyc: Math.max(0, at - 1.0), cycle: true });
  }
  if (v === 'type') {
    if (rd === 1) return drawT1(ctx, R, V.ph === 'q1' ? 0 : at, V.ph !== 'q1', L);
    if (rd === 2) return drawT2(ctx, R, V.ph === 'q2' ? 0 : at, L);
    return drawTFree(ctx, w, h, V, L, time);
  }
  const wide = R.w >= 560, G = { L, wide };
  if (rd === 1) return drawMap(ctx, R, { ...G, year: V.ph === 'q1' ? 1450 : 1450 + 50 * seg(at, .5, 9.0), round: 1, at: V.ph === 'q1' ? 0 : at });
  if (rd === 2) return drawMap(ctx, R, { ...G, year: 1500, round: 2, at: V.ph === 'q2' ? -1 : at });
  drawMap(ctx, R, { ...G, year: V.year, round: 0, at: 0 });
});
render();
</script>
