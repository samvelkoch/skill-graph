const TAU = Math.PI * 2;
const C = { screen: '#11152E', glow: '#5FE3FF', ice: '#BFE8FF', choc: '#6B3E26', toast: '#C8843F', stamp: '#FF4D5E', bench: '#E9D9BE' };
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const clampN = (x, a, b) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const lin = (x) => x;
const seg = (p, a, b) => clamp01((p - a) / (b - a));
const mix = (a, b, k) => a + (b - a) * k;
const frac = (x) => x - Math.floor(x);
const rnd = (i) => frac(Math.sin(i * 127.1 + 311.7) * 43758.5453); // deterministic "random" 0..1
const R = (r) => Math.max(0, r);
const hexRGB = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, k, al = 1) => { const A = hexRGB(a), B = hexRGB(b); return `rgba(${Math.round(mix(A[0], B[0], k))},${Math.round(mix(A[1], B[1], k))},${Math.round(mix(A[2], B[2], k))},${al})`; };
const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, R(rx), R(ry), rot, 0, TAU); };
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, R(r), 0, TAU); };
const rrect = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, R(w), R(h), r); };

function shadow(c, x, y, rx, ry, a = 0.35) {
  rx = Math.max(1, rx);
  c.save();
  const g = c.createRadialGradient(x, y, 0, x, y, rx);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.translate(x, y); c.scale(1, R(ry) / rx); c.translate(-x, -y);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, rx, 0, TAU); c.fill();
  c.restore();
}
// a wobbly superellipse: n = 2 is an ellipse, big n is a rounded rectangle; amp wobbles the edge
function shapePath(c, cx, cy, rx, ry, n = 2, amp = 0, t = 0, seed = 0) {
  const N = 56;
  c.beginPath();
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * TAU, ca = Math.cos(a), sa = Math.sin(a);
    const w = 1 + amp * (Math.sin(a * 3 + seed + t * 1.3) * 0.5 + Math.sin(a * 5 - seed * 1.7 + t * 0.9) * 0.35 + Math.sin(a * 2 + seed * 0.4) * 0.4);
    const x = Math.sign(ca) * Math.pow(Math.abs(ca), 2 / n), y = Math.sign(sa) * Math.pow(Math.abs(sa), 2 / n);
    const X = cx + R(rx) * x * w, Y = cy + R(ry) * y * w;
    if (i) c.lineTo(X, Y); else c.moveTo(X, Y);
  }
  c.closePath();
}

function pillText(c, text, cx, cy, maxW, size, bg, fg, box, lead = 0) {
  c.save();
  c.font = `800 ${size}px Nunito, sans-serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const words = String(text).split(' '), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? `${cur} ${w}` : w;
    if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  const lh = size * 1.25, tw = Math.max(...lines.map((l) => c.measureText(l).width));
  const bw = tw + 24 + lead, bh = lines.length * lh + 12, e = 6;
  const x = clampN(cx, box[0] + e + bw / 2, box[2] - e - bw / 2), y = clampN(cy, box[1] + e + bh / 2, box[3] - e - bh / 2);
  c.globalAlpha = 1; c.fillStyle = bg; rrect(c, x - bw / 2, y - bh / 2, bw, bh, Math.min(bh / 2, 16)); c.fill();
  c.fillStyle = fg;
  lines.forEach((l, i) => c.fillText(l, x + lead / 2, y - bh / 2 + 6 + lh * (i + 0.5)));
  c.restore();
  return { x, y, bw, bh };
}

// --- tweens: everything on screen is a function of one progress number --------------------------------------
const tweens = [];
function tween(obj, key, to, dur, done, ez = ease) {
  for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].o === obj && tweens[i].k === key) tweens.splice(i, 1);
  tweens.push({ o: obj, k: key, from: obj[key], to, t: 0, dur, done, ez });
}
function stepTweens(dt) {
  for (const w of tweens.slice()) {
    if (!tweens.includes(w)) continue;
    w.t += dt;
    const f = clamp01(w.t / w.dur);
    w.o[w.k] = mix(w.from, w.to, w.ez(f));
    if (f >= 1) { const i = tweens.indexOf(w); if (i >= 0) tweens.splice(i, 1); w.done?.(); }
  }
}

const FX = { gl: -1, st: -1, then: null };
function startGlitch(then) { FX.gl = 0; FX.st = -1; FX.then = then; sfx.bad(); }
function clearFx() { FX.gl = -1; FX.st = -1; FX.then = null; }
function tickFx(dt) {
  if (FX.gl >= 0) { FX.gl += dt; if (FX.gl >= 0.4) { FX.gl = -1; FX.st = 0; sfx.push(); } }
  else if (FX.st >= 0) {
    const was = FX.st; FX.st += dt;
    if (was < 0.35 && FX.st >= 0.35) { const f = FX.then; FX.then = null; f?.(); }
  }
}

// scene backdrop: night-blue wall and a table; returns where things stand
function backdrop(c, W, H, gf = 0.74) {
  let g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1B2252'); g.addColorStop(1, '#0F1330');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  g = c.createRadialGradient(W / 2, H * 0.55, 0, W / 2, H * 0.55, Math.max(W, H) * 0.65);
  g.addColorStop(0, 'rgba(95,227,255,.16)'); g.addColorStop(1, 'rgba(95,227,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const gy = H * gf;
  g = c.createLinearGradient(0, gy, 0, H);
  g.addColorStop(0, '#2E3569'); g.addColorStop(1, '#1A1F47');
  c.fillStyle = g; c.fillRect(0, gy, W, H - gy);
  c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(0, gy, W, 1.5);
  return { gy, u: Math.min(W * 0.3, H * 0.36) };
}
function plate(c, cx, gy, rx, ry) {
  shadow(c, cx, gy + ry * 0.5, rx * 1.05, ry * 0.9, 0.4);
  ell(c, cx, gy, rx, ry);
  const g = c.createLinearGradient(0, gy - ry, 0, gy + ry);
  g.addColorStop(0, '#F8EED8'); g.addColorStop(1, '#CDBA94');
  c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1; c.stroke();
  ell(c, cx, gy, rx * 0.78, ry * 0.7); c.fillStyle = 'rgba(0,0,0,.07)'; c.fill();
}
// a flame, base centre (x, y)
function flame(c, x, y, h, w, t, a = 1) {
  if (h < 1) return;
  const sway = Math.sin(t * 9 + x) * w * 0.12, fl = 1 + 0.06 * Math.sin(t * 23 + x);
  c.save(); c.globalAlpha = a;
  const cy = y - h * 0.45, gl = c.createRadialGradient(x, cy, 0, x, cy, h * 1.1);
  gl.addColorStop(0, 'rgba(255,170,70,.38)'); gl.addColorStop(1, 'rgba(255,170,70,0)');
  c.fillStyle = gl; c.fillRect(x - h * 1.2, y - h * 1.7, h * 2.4, h * 2.4);
  for (const [s, col] of [[1, '#FF8A2A'], [0.72, '#FFC93C'], [0.4, '#FFF3B0']]) {
    const hh = h * fl * s, ww = w * s;
    c.fillStyle = col; c.beginPath(); c.moveTo(x, y);
    c.bezierCurveTo(x - ww, y - hh * 0.15, x - ww * 0.8, y - hh * 0.7, x + sway * s, y - hh);
    c.bezierCurveTo(x + ww * 0.8, y - hh * 0.7, x + ww, y - hh * 0.15, x, y);
    c.fill();
  }

}
// wavy wisps of steam / smoke / heat, a pure function of p

  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';

    const f = frac(p * 2.4 + j / n), xx = x + (j - (n - 1) / 2) * u * 0.28;
    c.strokeStyle = `rgba(${rgb},${0.4 * Math.sin(Math.PI * f) * amt})`; c.lineWidth = u * 0.07 * (0.6 + f);
    c.beginPath();
    for (let k = 0; k <= 10; k++) {
      const s = k / 10, yy = y - f * u * 0.5 - s * u * 0.55, wx = xx + Math.sin(s * 5 + j * 2 + p * 9) * u * 0.07 * (0.4 + s);
      if (k) c.lineTo(wx, yy); else c.moveTo(wx, yy);

// a drinking glass: draws the water, calls inside(c) clipped to the glass, then the glass edges
function drawGlass(c, cx, base, hwB, hwT, h, wl, inside, edge = 'rgba(225,238,255,.7)', waterCols = ['rgba(170,222,255,.5)', 'rgba(105,180,238,.7)']) {
  const body = () => { c.beginPath(); c.moveTo(cx - hwB, base); c.lineTo(cx - hwT, base - h); c.lineTo(cx + hwT, base - h); c.lineTo(cx + hwB, base); c.closePath(); };
  shadow(c, cx, base + 2, hwB * 1.35, hwB * 0.34, 0.4);

  c.save(); body(); c.clip();

    const wy = base - h * wl, g = c.createLinearGradient(0, wy, 0, base + 1);
    g.addColorStop(0, waterCols[0]); g.addColorStop(1, waterCols[1]);
    c.fillStyle = g; c.fillRect(cx - hwT - 2, wy, hwT * 2 + 4, base - wy + 2);

  ell(c, cx, base - h, hwT, hwT * 0.2); c.stroke();

}

  c.quadraticCurveTo(cx - hw * 0.35, base - ht * 1.35, cx, base - ht);

  c.closePath(); c.fillStyle = fill; c.fill();

// 1. ice cube -> puddle

  const e = ease(seg(p, 0.04, 0.96));

    g.addColorStop(0, 'rgba(205,240,255,.88)'); g.addColorStop(1, 'rgba(110,185,240,.55)');
    c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.55)'; ell(c, cx - rx * 0.35, py - ry * 0.25, rx * 0.22, ry * 0.18, -0.1); c.fill();
    c.fillStyle = 'rgba(255,255,255,.3)'; ell(c, cx + rx * 0.25, py + ry * 0.1, rx * 0.12, ry * 0.1); c.fill();
  }

    const d = s * 0.34 * (1 - e), rr = s * (0.06 + 0.36 * e), x0 = cx - s / 2 - d * 0.3, yt = gy - h, fa = 1 - ease(seg(e, 0.1, 0.7));

      c.fillStyle = 'rgba(115,172,224,.6)'; c.beginPath(); c.moveTo(x0 + s, yt); c.lineTo(x0 + s + d * 0.6, yt - d); c.lineTo(x0 + s + d * 0.6, gy - d); c.lineTo(x0 + s, gy); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1; c.stroke();
      c.fillStyle = 'rgba(245,252,255,.88)'; c.beginPath(); c.moveTo(x0, yt); c.lineTo(x0 + s, yt); c.lineTo(x0 + s + d * 0.6, yt - d); c.lineTo(x0 + d * 0.6, yt - d); c.closePath(); c.fill(); c.stroke();

      c.beginPath(); c.moveTo(x0 + s * 0.2, yt + h * 0.82); c.lineTo(x0 + s * 0.5, yt + h * 0.2); c.moveTo(x0 + s * 0.62, yt + h * 0.32); c.lineTo(x0 + s * 0.72, yt + h * 0.14); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = 1.2;
      [[0.7, 0.68, 0.05], [0.32, 0.5, 0.035], [0.55, 0.82, 0.03]].forEach(([bx, by, br]) => { circ(c, x0 + s * bx, yt + h * by, s * br); c.stroke(); });

// 2. bread -> toast
function slicePath(c, x, y, a, b) {
  c.beginPath();
  c.moveTo(x - a, y + b * 0.95); c.lineTo(x - a, y - b * 0.1);
  c.quadraticCurveTo(x - a * 1.32, y - b * 0.2, x - a * 1.18, y - b * 0.68);
  c.quadraticCurveTo(x - a * 1.05, y - b * 1.05, x - a * 0.5, y - b * 1.02);
  c.quadraticCurveTo(x, y - b * 1.14, x + a * 0.5, y - b * 1.02);
  c.quadraticCurveTo(x + a * 1.05, y - b * 1.05, x + a * 1.18, y - b * 0.68);
  c.quadraticCurveTo(x + a * 1.32, y - b * 0.2, x + a, y - b * 0.1);
  c.lineTo(x + a, y + b * 0.95);
  c.quadraticCurveTo(x, y + b * 1.04, x - a, y + b * 0.95);
  c.closePath();
}
function drawToast(c, cx, gy, u, p, t) {
  const e = ease(seg(p, 0.1, 0.9)), a = u * 0.5, b = u * 0.62, cy = gy - b * 0.95 - u * 0.04;

  slicePath(c, cx, cy, a, b);
  c.fillStyle = mixc('#C58A45', '#6E3D14', e); c.fill();
  c.lineJoin = 'round'; c.strokeStyle = 'rgba(70,35,10,.7)'; c.lineWidth = 1.5; c.stroke();
  // crumb

  slicePath(c, cx, cy, a, b);
  const g = c.createRadialGradient(cx - a * 0.2, cy - b * 0.25, 0, cx, cy, b * 1.1);
  g.addColorStop(0, mixc('#F8E8BC', '#D99C55', e)); g.addColorStop(0.65, mixc('#F0D79F', '#BD7A37', e)); g.addColorStop(1, mixc('#E6C486', '#8B501F', e));
  c.fillStyle = g; c.fill();
  c.save(); c.clip();
  for (let j = 0; j < 26; j++) {
    const x = cx + (rnd(j) - 0.5) * a * 2.4, y = cy + (rnd(j + 40) - 0.5) * b * 2.1, r = u * (0.014 + 0.03 * rnd(j + 80));
    c.fillStyle = `rgba(110,60,15,${0.13 + 0.22 * e})`; ell(c, x, y, r * 1.4, r, rnd(j + 5) * 3); c.fill();
    c.fillStyle = `rgba(255,240,200,${0.18 * (1 - e)})`; ell(c, x - r * 0.3, y - r * 0.4, r * 0.6, r * 0.35, rnd(j + 5) * 3); c.fill();
  }

  c.strokeStyle = mixc('#C58A45', '#4a2508', e, 0.55 * e); c.lineWidth = 5; slicePath(c, cx, cy, a, b); c.stroke();
  c.restore();
  c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 2; c.lineCap = 'round';
  c.beginPath(); c.arc(cx - a * 0.35, cy - b * 0.55, a * 0.5, Math.PI * 1.05, Math.PI * 1.45); c.stroke();
  steam(c, cx, cy - b * 1.05, u, seg(p, 0.2, 0.45) * (1 - 0.6 * seg(p, 0.9, 1)), p, 3, '215,208,205');
}

// 3. chocolate bar -> glossy pool
function drawChoc(c, cx, gy, u, p, t) {
  const e = ease(seg(p, 0.1, 0.95));
  plate(c, cx, gy, u * 1.45, u * 0.34);

  wg.addColorStop(0, `rgba(255,200,120,${0.2 * e})`); wg.addColorStop(1, 'rgba(255,200,120,0)');

  shapePath(c, cx, cy, rx, ry, n, amp, t, 2);
  const g = c.createLinearGradient(cx - rx, cy - ry, cx + rx * 0.6, cy + ry);
  g.addColorStop(0, mixc('#8D5636', '#7A4A2D', e)); g.addColorStop(0.55, C.choc); g.addColorStop(1, '#4A2615');

      c.fillStyle = 'rgba(255,255,255,.14)'; c.fillRect(x + 2, y + 2, cw - 4, 2.5);
      c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(x + 2, y + rh - 4.5, cw - 4, 2.5);
      c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(x + 2, y + 2, 2.5, rh - 4);
      c.fillStyle = 'rgba(0,0,0,.22)'; c.fillRect(x + cw - 4.5, y + 2, 2.5, rh - 4);

    }

// 4. match burns
function drawMatch(c, cx, gy, u, p, t) {

  }).join('') + (ph === 'done' ? `<button class="btn push" data-act="${n === 1 ? 'next' : 'again'}">${esc(n === 1 ? t.next : t.again)}</button>` : '');
  if (ph === 'done') {
    const ok = S3.ans === 1, head = ok ? t.right : t.wrong;
    if (n === 2) lab.setState({ ...card(t.st.new.f), body: `${head} ${N.r2}` });
    else lab.setState({ emo: ok ? '✅' : '🤔', title: head, lead: N.r1, body: '' });
  } else lab.setState(card(t.st.new.n));
}

startRound();
</script>
