const now = () => performance.now() / 1000;
const c01 = (x) => Math.min(1, Math.max(0, x));
const eio = (x) => { x = c01(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const eout = (x) => 1 - Math.pow(1 - c01(x), 3);
const eback = (x) => { x = c01(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const prog = (t0, dur, delay = 0) => (t0 == null ? 0 : c01((now() - t0 - delay) / dur));
const R = (r) => Math.max(0, r);
const rng = (seed) => () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const hexRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => {
  const A = hexRgb(a), B = hexRgb(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * c01(t)).toString(16).padStart(2, '0')).join('');
};
const rgba = (hex, a) => { const [r, g, b] = hexRgb(hex); return `rgba(${r},${g},${b},${a})`; };
const shade = (hex, k) => (k < 1 ? mixc(hex, '#000000', 1 - k) : mixc(hex, '#ffffff', k - 1));
function rr(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// --- parchment and the gold frame (cached, drawn once per size) -----------------------------------------------
const bgCache = {};
function bgCanvas(w, h, kind) {
  const d = Math.min(window.devicePixelRatio || 1, 2), key = `${Math.round(w)}x${Math.round(h)}x${d}`;
  if (bgCache[kind]?.key === key) return bgCache[kind].c;
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * d)); c.height = Math.max(1, Math.round(h * d));
  const g = c.getContext('2d'); g.scale(d, d);
  if (kind === 'paper') paperPaint(g, w, h); else framePaint(g, w, h);
  bgCache[kind] = { key, c };
  return c;
}
function paperPaint(g, w, h) {
  const v = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .2, w / 2, h / 2, Math.hypot(w, h) * .56);
  v.addColorStop(0, PAL.parch); v.addColorStop(.62, '#E8D6AA'); v.addColorStop(1, '#B99A63');
  g.fillStyle = v; g.fillRect(0, 0, w, h);
  const r = rng(7);

  const rope = (arr) => { if (arr.length < 2) return; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); arr.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.strokeStyle = '#4E3716'; ctx.lineWidth = 4.4 * k; ctx.stroke(); ctx.strokeStyle = '#C79A55'; ctx.lineWidth = 3 * k; ctx.stroke(); ctx.setLineDash([2.2 * k, 2.2 * k]); ctx.strokeStyle = '#7A5A28'; ctx.lineWidth = 3 * k; ctx.stroke(); ctx.setLineDash([]); };
  if (rp > .55) { // the back half of the loop, behind the king
    const back = []; for (let i = 0; i <= 16; i++) { const a = Math.PI + i / 16 * Math.PI; back.push([kx + Math.cos(a) * rxw, wy + Math.sin(a) * ryw]); } rope(back);
  }
  bxs.forEach((x, i) => person(ctx, x, by, bs, 'lord', { flip: !!i }));
  person(ctx, kx, ky, ks, 'king');
  rope(pts.slice(0, nPts));
  if (rp >= 1) { const sc = eback((T - 4.6) / .5); emoji(ctx, '⚖️', kx + 30 * k, ky - 36 * ks, 26 * k * sc); }
  ctx.restore();
}
function dotStroke(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, R(r), 0, TAU); ctx.stroke(); }

// --- the one draw loop ---------------------------------------------------------------------------------------------
canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  T18 = T[lang];
  S.season += (S.seasonT - S.season) * Math.min(1, dt * 5);
  ctx.drawImage(bgCanvas(w, h, 'paper'), 0, 0, w, h);
  const v = lab.view;
  if (v === 'pyramid') {
    if (S.sec === 'castle') drawCastle(ctx, w, h, now() - S.secT0);
    else if (S.sec === 'magna') drawMagna(ctx, w, h, now() - S.secT0);
    else drawPyramid(ctx, w, h, t);
  } else if (v === 'deal') drawDeal(ctx, w, h, t);
  else drawVillage(ctx, w, h, t);
  ctx.drawImage(bgCanvas(w, h, 'frame'), 0, 0, w, h);
});

// =============================================================================================================
//  CONTROLS
// =============================================================================================================
const showStage = () => { // on a phone the controls sit below the canvas: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const verdict = (ok, t) => `<div class="verdict ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.wrong)}</div>`;
function qBlock(q, opts, ans, ok) {
  const done = ans !== undefined, long = opts.some((o) => o.length > 26);
  return `<div class="q">${esc(q)}</div><div class="fopts ${long ? 'long' : ''}">${opts.map((o, j) =>
    `<button class="fo ${done ? (j === ok ? 'good' : j === ans ? 'bad' : '') : ''}" data-act="ans" data-j="${j}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
}
const stateOf = (t, view, full) => { const [emo, title, lead, body] = t.st[view][full ? 1 : 0]; return { emo, title, lead, body, extra: `<div class="fine">${esc(t.fine)}</div>` }; };

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'sec') {
    const key = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === key ? null : key; S.secT0 = now(); sfx.click(); showStage();
  } else if (v === 'pyramid') {
    if (act === 'ans') {
      const j = +b.dataset.j, k = S.pq < 2 ? 0 : 1, ok = [2, 1][k] === j;
      S.pa[k] = j; S.pq = k ? 3 : 1; S.t0[k ? 'land' : 'sort'] = now(); (ok ? sfx.good : sfx.bad)(); S.sec = null; showStage();
    } else if (act === 'next') { S.pq = 2; sfx.click(); }
    else if (act === 'again') { S.pq = 0; S.pa = []; S.t0.sort = S.t0.land = null; sfx.click(); }
  } else if (v === 'deal') {
    if (act === 'pick') {
      const i = S.di, key = b.dataset.k, ok = key === ARROWS[i].key;
      S.dAns[i] = key; S.dT[i] = now(); (ok ? sfx.good : sfx.bad)(); showStage();
    } else if (act === 'next') { S.di++; sfx.click(); }
    else if (act === 'again') { S.di = 0; S.dAns = []; S.dOpt = []; S.dT = []; sfx.click(); }
  } else {
    if (act === 'ans') {
      const j = +b.dataset.j, k = S.vq < 2 ? 0 : 1;
      S.va[k] = j; S.vq = k ? 3 : 1; S.t0[k ? 'sheaf' : 'serf'] = now(); (j === 1 ? sfx.good : sfx.bad)();
      if (k) S.seasonT = 2; // harvest time
      showStage();
    } else if (act === 'next') { S.vq = 2; sfx.click(); }
    else if (act === 'again') { S.vq = 0; S.va = []; S.t0.serf = S.t0.sheaf = null; sfx.click(); }
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'season') return;
  S.seasonT = +ev.target.value; villageReadout(T[lang]);
});

function villageReadout(t) {
  const i = clamp(Math.round(S.seasonT), 0, 3);
  lab.setReadout(['🌱', '☀️', '🍂', '❄️'][i], t.v.seasons[i], '', '#C9A13B');
  const sl = $('season'); if (sl) sl.setAttribute('aria-label', t.v.seasons[i]);
}

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  for (const [id, key] of [['secPyr', 'pyramid'], ['secDeal', 'deal'], ['secVil', 'village']]) { if (key !== v) $(id).innerHTML = ''; }
  if (v === 'pyramid') renderPyr(t); else if (v === 'deal') renderDeal(t); else renderVil(t);
}

function renderPyr(t) {
  const q = S.pq, k = q < 2 ? 0 : 1, P = t.p, open = secret.unlocked();
  const qs = [[P.q1, P.o1, 2, P.r1], [P.q2, P.o2, 1, P.r2]][k], ans = S.pa[k], done = q === 1 || q === 3;
  const chip = (key, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-act="sec" data-k="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('secPyr').innerHTML = qBlock(qs[0], qs[1], ans, qs[2])
    + (done ? verdict(ans === qs[2], t) + `<p class="why">${esc(qs[3])}</p><div class="row2" style="margin-top:0"><button class="btn" data-act="${q === 3 ? 'again' : 'next'}">${esc(q === 3 ? t.again : t.next)}</button></div>` : '')
    + `<div class="chips">${chip('castle', '🏰')}${chip('magna', '📜')}</div>`;
  lab.setGlow('rgba(201, 161, 59, .26)');
  if (S.sec) {
    const e = S.sec === 'castle' ? '🏰' : '📜';
    lab.setReadout(e, '', '', '#C9A13B');
    lab.setState({ emo: e, title: t.secrets[S.sec][0], lead: t.sec[S.sec + 'Text'], body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    return;
  }
  lab.setReadout('100', q >= 1 ? `👑 1 · 🏰 3 · ⚔️ 6 · 🌾 90` : '', '', '#C9A13B');
  lab.setState(stateOf(t, 'pyramid', q >= 1));
}

function renderDeal(t) {
  const D = t.d, i = S.di, answered = S.dAns.filter((x) => x !== undefined).length;
  let html;
  if (i < 6) {
    if (!S.dOpt[i]) S.dOpt[i] = shuffle([ARROWS[i].key, ...shuffle(POOL[i]).slice(0, 2)]);
    const ans = S.dAns[i], right = ARROWS[i].key, done = ans !== undefined;
    html = `<div class="q">${esc(D.q(i))}</div><div class="fopts ico">${S.dOpt[i].map((key) => {
      const [e, ...rest] = D.icons[key].split(' '), cls = done ? (key === right ? 'good' : key === ans ? 'bad' : '') : '';
      return `<button class="fo ${cls}" data-act="pick" data-k="${key}"${done ? ' disabled' : ''}><span class="e">${e}</span><span>${esc(rest.join(' '))}</span></button>`;
    }).join('')}</div>`;
    if (done) html += verdict(ans === right, t) + `<p class="why">${esc(D.why[i])}</p><div class="row2" style="margin-top:0"><button class="btn" data-act="next">${esc(t.next)}</button></div>`;
  } else html = `<p class="why">${esc(D.sum)}</p><div class="row2" style="margin-top:0"><button class="btn" data-act="again">${esc(t.again)}</button></div>`;
  $('secDeal').innerHTML = html;
  lab.setGlow('rgba(122, 79, 181, .24)');
  lab.setReadout(`${answered}/6`, [0, 1, 2, 3, 4, 5].map((x) => (S.dAns[x] !== undefined ? '●' : x === i ? '◉' : '○')).join(' '), '', '#C9A13B');
  lab.setState(stateOf(t, 'deal', answered > 0));
}

function renderVil(t) {
  const V = t.v, q = S.vq, k = q < 2 ? 0 : 1, qs = [[V.q1, V.o1, 1, V.r1], [V.q2, V.o2, 1, V.r2]][k], ans = S.va[k], done = q === 1 || q === 3;
  $('secVil').innerHTML = qBlock(qs[0], qs[1], ans, qs[2])
    + (done ? verdict(ans === qs[2], t) + `<p class="why">${esc(qs[3])}</p><div class="row2" style="margin-top:0"><button class="btn" data-act="${q === 3 ? 'again' : 'next'}">${esc(q === 3 ? t.again : t.next)}</button></div>` : '')
    + `<div class="dial"><input class="big" id="season" type="range" min="0" max="3" step="0.01" value="${S.seasonT}" style="--track:linear-gradient(90deg,#8FBF5B,#E0C25A,#A8703F,#E3E9F0)"><div class="ends"><span>🌱</span><span>☀️</span><span>🍂</span><span>❄️</span></div></div>`;
  lab.setGlow('rgba(78, 138, 62, .26)');
  villageReadout(t);
  lab.setState(stateOf(t, 'village', q >= 1));
}
render();
</script>
