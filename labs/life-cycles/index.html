  .sortbox .sq { font: 500 17px/1.2 var(--serif); color: #fff; }
  .pool { display: flex; flex-wrap: wrap; gap: 7px; min-height: 40px; }

  .tok { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--stroke2);

  .ghost { position: fixed; z-index: 60; pointer-events: none; opacity: .92; transform: translate(-50%, -50%); box-shadow: 0 6px 20px rgba(0,0,0,.5); }

  .bucket { border: 2px dashed var(--stroke2); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, background .15s; }

const TAU = Math.PI * 2;
const sm = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
const E = (c, x, y, rx, ry, fill, rot = 0, stroke = null, lw = 1) => {
  c.beginPath(); c.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot, 0, TAU);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
};
const Ln = (c, x1, y1, x2, y2, col, lw) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.stroke(); };
const mixc = (a, b, t) => `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;
// growth that is part smooth, part steps at the shedding moments
const grow = (p, a, b, ms) => { const u = clamp((p - a) / (b - a), 0, 1); let s = 0; for (const m of ms) s += sm(m - .012, m + .018, p); return .45 * u + .55 * s / ms.length; };
const rrect = (c, x, y, w, h, r) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
const fade = (p) => 1 - sm(.965, 1, p); // the adult's life ends just before the loop restarts

function insect(c, kind, x, y, rot, s, ws, phi, fl, al) {
  if (al <= .01) return;
  const K = KINDS[kind];
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.globalAlpha *= al;
  for (const side of [-1, 1]) { c.save(); c.translate(0, K.sy); c.scale(side * fl, 1); c.rotate(phi); c.scale(ws, ws); K.wing(c); c.restore(); }
  K.body(c);
  c.restore();
}

function egg(c, x, y, s, a, o) {

  E(c, x, y, 2.6 * s, 3.4 * s, '#f3ecca', 0, 'rgba(120,100,50,.75)', .5);
  for (const i of [-1, 0, 1]) Ln(c, x + i * .9 * s, y - 2.4 * s, x + i * .9 * s, y + 2.4 * s, 'rgba(150,130,70,.3)', .35);
  if (o && o.dark > .01) E(c, x, y - 1.6 * s, .8 * s, .8 * s, `rgba(70,45,20,${.7 * o.dark})`);
  if (o && o.crack > .01) { c.strokeStyle = `rgba(90,60,30,${o.crack})`; c.lineWidth = .5; c.beginPath(); c.moveTo(x - 2.2 * s, y - .3 * s); c.lineTo(x - s, y - 1.2 * s); c.lineTo(x, y - .2 * s); c.lineTo(x + s, y - 1.2 * s); c.lineTo(x + 2.2 * s, y - .2 * s); c.stroke(); }

    drag.moved = true; drag.ghost = document.createElement('div'); drag.ghost.className = 'tok ghost'; drag.ghost.innerHTML = tok(drag.k, true).replace(/^<span class="tok[^"]*"[^>]*>/, '').replace(/<\/span>$/, ''); document.body.append(drag.ghost);
  }
  if (drag.ghost) {
    drag.ghost.style.left = `${ev.clientX}px`; drag.ghost.style.top = `${ev.clientY}px`;
    sortEl.querySelectorAll('.bucket').forEach((b) => b.classList.remove('hot')); hotBucket(ev.clientX, ev.clientY)?.classList.add('hot');
  }
});
const endDrag = (ev, cancel) => {
  if (!drag) return;
  const d = drag; drag = null; d.ghost?.remove(); sortEl.querySelectorAll('.bucket').forEach((b) => b.classList.remove('hot'));
  if (cancel) return;
  if (d.moved) { const b = hotBucket(ev.clientX, ev.clientY); if (b) drop(d.k, b.dataset.b); }
  else { S.sel = S.sel === d.k ? null : d.k; sfx.click(); sortRender(); }
};
sortEl.addEventListener('pointerup', (ev) => endDrag(ev, false));
sortEl.addEventListener('pointercancel', (ev) => endDrag(ev, true));
sortEl.addEventListener('click', (ev) => { const b = ev.target.closest('.bucket'); if (b && S.sel) drop(S.sel, b.dataset.b); });

// ---------- render (text, chips) and sync (state card) ----------
let lastKey = '';
function renderChips() {
  const t = T[lang], open = secret.unlocked(), v = lab.view;
  const sc = (k) => `<button class="chip secret ${open ? 'open' : ''} ${v === 'grow' && S.grow === SECRET_ANIMAL[k] ? 'on' : ''}" data-k="${k}">${open ? esc(t.secrets[k][0]) : '🔒 ???'}</button>`;
  let mid = '';
  if (v === 'grow') mid = GROW_LIST.map((id) => `<button class="chip ${S.grow === id ? 'on' : ''}" data-k="a:${id}">${AN[id].emo} ${esc(t.an[id].chip)}</button>`).join('');
  else if (v === 'compare') mid = `<span class="hintline">${esc(t.tapRow)}</span>`;
  else mid = `<button class="chip" data-k="reset">${esc(t.sort.reset)}</button>`;
  $('chips').innerHTML = [sc('s1'), mid, sc('s2')].join('');
}
function render() {
  const t = T[lang], v = lab.view;
  $('prow').style.display = v === 'sort' ? 'none' : '';
  $('play').textContent = S.play ? t.pause : t.play;
  renderChips();
  sortEl.style.display = v === 'sort' ? '' : 'none';
  if (v === 'sort') sortRender();
  ask.style.display = S.answered || v !== 'grow' ? 'none' : '';
  if (!S.answered && v === 'grow') ask.innerHTML = S.answer === null
    ? `<div class="q">${esc(t.ask)}</div><div class="opts">${t.opts.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="q" style="color:${S.answer === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(S.answer === 1 ? t.right : t.wrong)}</div><div class="opts"><button>${esc(t.go)} →</button></div>`;
  $('slider').value = Math.round(S.p * 1000);
  sync(true);
}
function sync(force) {
  const t = T[lang], v = lab.view, fine = `<div class="fine">${esc(t.fine)}</div>`;
  if (v === 'sort') {
    const n = Object.keys(S.sorted).length, nf = new Intl.NumberFormat(lang), m = S.sortMsg, s = t.sort;
    lab.setReadout(`${nf.format(n)}/${nf.format(SORT.length)}`, s.count, '', '#ff9a3d'); lab.setGlow('rgba(255,154,61,.2)');
    if (n === SORT.length) lab.setState({ emo: '🎉', title: s.allTitle, lead: s.all, body: '', extra: fine });
    else if (m) lab.setState({ emo: m.ok ? '✅' : '🤔', title: s.items[m.k][0], lead: m.ok ? s.good : s.bad, body: s.items[m.k][1], extra: fine });
    else lab.setState({ emo: '🧩', title: s.title, lead: s.hint, body: '', extra: fine });
    lastKey = ''; return;
  }
  const id = v === 'grow' ? S.grow : S.cmp, an = AN[id], idx = stIdx(an, S.p), ph = phase(an, S.p);
  const key = [v, id, idx, ph, lang].join('|');
  if (!force && key === lastKey) return;
  lastKey = key;
  const A = t.an[id], st = A.st[idx];
  lab.setReadout(esc(st[0]), `${A.chip} · ${A.tag}`, t.ring[ph][0], PHC[ph]); lab.setGlow(an.glow);
  lab.setState({ emo: an.es[idx], title: st[1], lead: st[2], body: '', extra:
    `<div class="kv">${esc(t.lbl.type)}: <b>${esc(A.type)}</b></div>
     <div class="kv">${esc(t.lbl.phase)}: <b style="color:${PHC[ph]}">${esc(t.ring[ph][0])}</b>, ${esc(t.ring[ph][1])}</div>
     <div class="kv">${esc(t.lbl.young)} <b>${esc(an.looks ? t.lbl.yes : t.lbl.no)}</b></div>${fine}` });
}

// ================= 5. canvas =================
const stripGeo = (w, h) => { const sh = clamp(h * .27, 78, 120), cw = w / 4; return { sh, ah: h - sh, cw, ts: Math.min(sh - 28, cw - 22) }; };
const cmpGeo = (w, h) => { const pad = 8, rh = (h - pad * 2) / COMPARE.length, lw = clamp(w * .24, 76, 150), cw = (w - lw - pad) / 4; return { pad, rh, lw, cw, ts: Math.min(rh - 10, cw - 12) }; };
function thumb(c, an, i, cx, cy, ts, live, t) {
  const [fx, fy, z] = an.foc[i], k = ts / (100 / z);
  c.save(); rrect(c, cx - ts / 2, cy - ts / 2, ts, ts, 10); c.clip();
  c.fillStyle = 'rgba(8,12,22,.6)'; c.fillRect(cx - ts / 2, cy - ts / 2, ts, ts);
  c.translate(cx, cy); c.scale(k, k); c.translate(-fx, -fy); an.draw(c, live ? S.p : an.tp[i], live ? t : .7, true);
  c.restore();
  c.save(); rrect(c, cx - ts / 2, cy - ts / 2, ts, ts, 10); c.lineWidth = live ? 2.4 : 1; c.strokeStyle = live ? '#fff' : 'rgba(255,255,255,.2)'; c.stroke(); c.restore();
}
function chevron(c, x, y, s) { c.beginPath(); c.moveTo(x - s * .4, y - s); c.lineTo(x + s * .6, y); c.lineTo(x - s * .4, y + s); c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1.6; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); }
function wrap(c, text, maxW) {
  const lines = []; let cur = '';
  for (const wd of text.split(' ')) { const tst = cur ? `${cur} ${wd}` : wd; if (c.measureText(tst).width > maxW && cur) { lines.push(cur); cur = wd; } else cur = tst; }
  if (cur) lines.push(cur); return lines;
}
function drawGrow(c, w, h, t) {
  const an = AN[S.grow], g = stripGeo(w, h), T_ = T[lang];
  c.save(); c.beginPath(); c.rect(0, 0, w, g.ah); c.clip();
  const k = Math.min(w / 104, (g.ah - 4) / 74); c.translate(w / 2, g.ah / 2 + 2); c.scale(k, k); an.draw(c, S.p, t, false); c.restore();
  // the same animal, stage by stage, and the loop back to the start
  const cur = curMain(an, S.p), y0 = g.ah + 4, cy = y0 + g.ts / 2;
  for (let i = 0; i < 4; i++) { thumb(c, an, i, g.cw * (i + .5), cy, g.ts, i === cur, t); if (i < 3) chevron(c, g.cw * (i + 1), cy, Math.min(7, g.ts * .1)); }
  const ly = y0 + g.ts + 8, x0 = g.cw * .5, x3 = g.cw * 3.5;
  c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 1.2; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(x3, y0 + g.ts + 3); c.lineTo(x3, ly); c.lineTo(x0, ly); c.lineTo(x0, y0 + g.ts + 5); c.stroke(); c.setLineDash([]);
  c.beginPath(); c.moveTo(x0 - 4, y0 + g.ts + 8); c.lineTo(x0, y0 + g.ts + 2); c.lineTo(x0 + 4, y0 + g.ts + 8); c.closePath(); c.fillStyle = 'rgba(255,255,255,.4)'; c.fill();
  c.font = `700 ${clamp(w * .028, 10, 12.5)}px Nunito, system-ui, sans-serif`; c.fillStyle = 'rgba(255,255,255,.55)'; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillText(`↻ ${T_.again}`, w / 2, ly + 15);
  // the generic ring: every life has birth, growth, reproduction, death
  const rr = clamp(w * .045, 15, 26), rx = w - rr - 16, ry = rr + 14, b = [0, ...an.ring, 1], ph = phase(an, S.p);
  for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(rx, ry, rr, -Math.PI / 2 + b[i] * TAU, -Math.PI / 2 + b[i + 1] * TAU); c.strokeStyle = PHC[i]; c.globalAlpha = i === ph ? 1 : .45; c.lineWidth = rr * .38; c.lineCap = 'butt'; c.stroke(); }
  c.globalAlpha = 1;
  const a = -Math.PI / 2 + S.p * TAU; E(c, rx + Math.cos(a) * rr, ry + Math.sin(a) * rr, 4.2, 4.2, '#fff', 0, 'rgba(0,0,0,.5)', 1);
  c.font = `800 ${clamp(w * .026, 10, 12)}px Nunito, system-ui, sans-serif`; c.fillStyle = PHC[ph]; c.textAlign = 'right'; c.fillText(T_.ring[ph][0], w - 8, ry + rr + 15);
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = `900 ${rr * .8}px Nunito, system-ui, sans-serif`; c.fillText('↻', rx, ry + rr * .28);
}
function drawCompare(c, w, h, t) {
  const g = cmpGeo(w, h), fs = clamp(w * .03, 11, 15), fs2 = clamp(w * .024, 9, 12);
  COMPARE.forEach((id, r) => {
    const an = AN[id], y0 = g.pad + r * g.rh, sel = S.cmp === id, cur = curMain(an, S.p), cy = y0 + g.rh / 2;
    rrect(c, 6, y0 + 2, w - 12, g.rh - 4, 12); c.fillStyle = sel ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.03)'; c.fill();
    c.lineWidth = sel ? 2 : 1; c.strokeStyle = sel ? an.col : 'rgba(130,145,190,.18)'; c.stroke();
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.font = `800 ${fs}px Nunito, system-ui, sans-serif`; c.fillStyle = '#fff'; c.fillText(`${an.emo} ${T[lang].an[id].chip}`, 14, y0 + g.rh / 2 - fs2 * 1.2 + (fs2 > 10.5 ? 0 : 2));
    c.font = `700 ${fs2}px Nunito, system-ui, sans-serif`; c.fillStyle = an.col;
    wrap(c, T[lang].an[id].tag, g.lw - 18).slice(0, 3).forEach((ln, i) => c.fillText(ln, 14, y0 + g.rh / 2 + fs2 * (.25 + i * 1.2)));
    for (let j = 0; j < 4; j++) { thumb(c, an, j, g.lw + g.cw * (j + .5), cy, g.ts, j === cur, t); if (j < 3) chevron(c, g.lw + g.cw * (j + 1), cy, Math.min(5, g.ts * .09)); }
  });
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.goto !== null) {
    const d = S.goto - S.p;
    if (Math.abs(d) < .004) { S.p = S.goto; S.goto = null; } else S.p += Math.sign(d) * Math.min(Math.abs(d), dt * .7);
    $('slider').value = Math.round(S.p * 1000); sync();
  } else if (S.play && lab.view !== 'sort') {
    S.p += dt * .045; if (S.p >= 1) S.p -= 1;
    $('slider').value = Math.round(S.p * 1000); sync();
  }
  if (lab.view === 'grow') drawGrow(c, w, h, time);
  else if (lab.view === 'compare') drawCompare(c, w, h, time);
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, w = r.width, h = r.height;
  if (lab.view === 'grow') {
    const g = stripGeo(w, h); if (y < g.ah) return;
    const i = clamp(Math.floor(x / g.cw), 0, 3); S.goto = AN[S.grow].tp[i];
  } else if (lab.view === 'compare') {
    const g = cmpGeo(w, h), row = clamp(Math.floor((y - g.pad) / g.rh), 0, COMPARE.length - 1); S.cmp = COMPARE[row];
    if (x > g.lw) S.goto = AN[S.cmp].tp[clamp(Math.floor((x - g.lw) / g.cw), 0, 3)];
  } else return;
  S.play = false; $('play').textContent = T[lang].play; sfx.click(); sync(true);
});
render();
</script>
