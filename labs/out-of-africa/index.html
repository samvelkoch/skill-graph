  const vg = c.createRadialGradient(BW / 2, BH / 2, 90, BW / 2, BH / 2, 260); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)'); c.fillStyle = vg; c.fillRect(-40, -40, BW + 80, BH + 80);
  c.restore();
}

// --- the controls ---------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function buildJ() {
  const t = T[lang], j = t.j, el = $('oaJ');
  if (!S.jDone) {
    const pool = ['eu', 'am', 'au'].filter((k) => !S.jOrder.includes(k)); // a fixed order that is not the answer
    el.innerHTML = `<div class="oa-q">${esc(j.q)}</div><div class="oa-hint">${esc(j.hint)}</div>
      <div class="oa-slots">${[0, 1, 2].map((i) => { const k = S.jOrder[i]; return `<button class="oa-slot${k ? ' full' : ''}" data-act="jslot" data-i="${i}">${k ? esc(j.cards[k]) : i + 1}</button>`; }).join('')}</div>
      <div class="oa-pool">${pool.map((k) => `<button class="oa-card" data-act="jcard" data-k="${k}">${esc(j.cards[k])}</button>`).join('')}</div>
      <div class="row2"><button class="btn" data-act="jcheck"${S.jOrder.length < 3 ? ' disabled' : ''}>${esc(j.check)}</button><button class="oa-chip" data-act="jreset"${S.jOrder.length ? '' : ' disabled'}>${esc(j.reset)}</button></div>`;
    return;
  }
  const slots = [0, 1, 2].map((i) => `<div class="oa-slot full ${S.jOrder[i] === TRUE[i] ? 'good' : 'miss'}">${esc(j.cards[S.jOrder[i]])}</div>`).join('');
  el.innerHTML = `<div class="oa-ctl" style="margin-top:0"><input type="range" class="big" id="oaSlider" min="0" max="1000" step="1" value="${Math.round(S.p * 1000)}" aria-label="${esc(j.axis)}">
      <div class="ends"><span>${T_MAX}</span><span>${esc(j.axis)}</span><span>${T_MIN}</span></div>
      <div class="row2" style="margin-top:0"><button class="oa-chip" data-act="play">${esc(S.play ? j.pause : j.play)}</button></div></div>
    <div class="oa-verdict ${S.jRes}">${esc(j[S.jRes])}</div>
    <div class="oa-slots" style="margin-top:8px">${slots}</div>
    <div class="oa-real"><b>${esc(j.realLbl)}</b> ${TRUE.map((k) => esc(j.cards[k])).join(' → ')}</div>
    <div class="oa-sub">${esc(j.jump)}</div>
    <div class="chips" style="margin-top:6px">${PL.map((p) => `<button class="oa-chip" data-act="jump" data-k="${p.k}"><i class="oa-dot" style="background:${p.col}"></i>${p.n} ${esc(t.places[p.k])}</button>`).join('')}</div>
    <div class="oa-fine">${esc(j.fine)}</div>`;
}
function buildT() {
  const t = T[lang], tl = t.tl, ans = S.tPick !== null, el = $('oaT');
  const chips = tl.names.map((n, i) => `<button class="oa-opt${ans && i === T_RIGHT ? ' good' : ''}${ans && S.tPick === i && i !== T_RIGHT ? ' bad' : ''}${ans && S.tSel === i ? ' on' : ''}" data-act="tool" data-i="${i}">${esc(n)}</button>`).join('');
  el.innerHTML = ans
    ? `<div class="oa-verdict ${S.tPick === T_RIGHT ? 'good' : 'bad'}">${esc(S.tPick === T_RIGHT ? tl.right : tl.wrong)}</div><div class="oa-hint" style="margin:10px 0 8px">${esc(tl.hint)}</div><div class="oa-opts">${chips}</div>`
    : `<div class="oa-q">${esc(tl.q)}</div><div class="oa-opts">${chips}</div>`;
}
function buildF() {
  const t = T[lang], f = t.f, ans = S.fPick !== null, el = $('oaF');
  if (!ans) { el.innerHTML = `<div class="oa-q">${esc(f.q)}</div><div class="oa-opts">${f.opts.map((o, i) => `<button class="oa-opt" data-act="fopt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`; return; }
  el.innerHTML = `<div class="oa-verdict ${S.fPick === F_RIGHT ? 'good' : 'bad'}">${esc(S.fPick === F_RIGHT ? f.right : f.wrong)}</div>
    <div class="oa-togs">${['fire', 'tent', 'coat'].map((k) => `<button class="oa-tog${S[k] ? ' on' : ''}" data-act="ftog" data-k="${k}">${esc(f.chips[k])}</button>`).join('')}</div>
    <div class="oa-sub">${esc(f.giveLbl)}</div>
    <div class="oa-togs">${['food', 'light', 'safe'].map((k) => `<button class="oa-tog fx${S.fx === k ? ' on' : ''}" data-act="ffx" data-k="${k}">${esc(f.fx[k])}</button>`).join('')}</div>`;
}
function buildSecs() {
  const t = T[lang], open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('oaSecs').innerHTML = sc('a', '🌉') + sc('b', '🎨');
  $('oaSecCtl').innerHTML = S.sec === 'a' ? `<button class="oa-chip on" data-act="sea">${esc(S.seaTgt ? t.sa.fill : t.sa.lower)}</button>` : '';
  $('oaSecCtl').style.display = S.sec === 'a' ? '' : 'none';
}
function syncJ(force) {
  if (lab.view !== 'journey' || S.sec) return;
  const t = T[lang], j = t.j;
  if (!S.jDone) {
    const key = `q|${lang}`;
    lab.setReadout('?', '', '', '#f2a93b');
    if (force || key !== S.jKey) { S.jKey = key; lab.setState({ emo: t.st.q[0], title: t.st.q[1], lead: t.st.q[2], body: '', extra: '' }); lab.setFacts([]); }
    return;
  }
  const Tn = tOf(S.p), tk = Math.round(Tn), reached = PL.filter((p) => Tn <= p.ka + 1e-9), last = reached[reached.length - 1];
  lab.setReadout(String(tk), `${j.unit(tk)} · ${j.placesN(reached.length)}`, j.pillSch, '#f2a93b');
  const key = `${last.k}|${lang}`;
  if (force || key !== S.jKey) { S.jKey = key; const st = t.st[last.k]; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' }); lab.setFacts([t.jf[last.k]]); }
}
function stateT() {
  const t = T[lang], tl = t.tl;
  lab.setGlow('rgba(168, 156, 134, .26)');
  if (S.tPick === null) { lab.setReadout('?', '', '', '#a89c86'); lab.setState({ emo: '🤔', title: tl.q, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  const i = S.tSel, d = tl.det[i];
  lab.setReadout(tl.verbs[i], tl.names[i], '', '#a89c86');
  lab.setState({ emo: ['🪨', '🐴', '🧵', '🏹'][i], title: d[0], lead: d[1], body: d[2], extra: '' });
  lab.setFacts(t.tf);
}
function stateF() {
  const t = T[lang], f = t.f;
  lab.setGlow('rgba(255, 140, 60, .28)');
  if (S.fPick === null) { lab.setReadout('?', '', '', '#ff9a3c'); lab.setState({ emo: '🤔', title: f.q, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  const w = warmOf(S.fire, S.tent, S.coat);
  lab.setReadout(`${w}%`, f.unit, w >= WARM_OK ? f.ok : '', '#ff9a3c');
  if (S.fx) { const x = f.fxs[S.fx]; lab.setState({ emo: x[0], title: x[1], lead: x[2], body: '', extra: '' }); }
  else if (w >= WARM_OK) lab.setState({ emo: f.warm[0], title: f.warm[1], lead: f.warm[2], body: f.warm[3], extra: '' });
  else if (w <= 20) lab.setState({ emo: f.cold[0], title: f.cold[1], lead: f.cold[2], body: '', extra: '' });
  else {
    const m = f.mid[2], lead = !S.fire ? m.noFire : !S.tent && !S.coat ? m.noBoth : !S.tent ? m.noTent : m.noCoat;
    lab.setState({ emo: f.mid[0], title: f.mid[1], lead, body: '', extra: '' });
  }
  lab.setFacts(t.ff);
}
function stateSec() {
  const t = T[lang];
  if (S.sec === 'a') {
    lab.setGlow('rgba(110, 170, 230, .3)'); lab.setReadout(S.seaTgt ? '≈ −125 m' : '0 m', S.seaTgt ? t.sa.ice : t.sa.today, '', '#6ea6e0');
    lab.setState({ emo: '🌉', title: t.sa.title, lead: t.sa.lead, body: '', extra: '' }); lab.setFacts([t.sa.fact]);
  } else {
    lab.setGlow('rgba(217, 130, 95, .28)'); lab.setReadout('32–30', t.j.unit(30), '', '#d9825f');
    lab.setState({ emo: '🎨', title: t.sb.title, lead: t.sb.lead, body: '', extra: '' }); lab.setFacts([t.sb.fact]);
  }
}
function render() {
  const v = lab.view;
  document.body.dataset.v = v;
  $('oaJ').style.display = v === 'journey' ? '' : 'none';
  $('oaT').style.display = v === 'tools' ? '' : 'none';
  $('oaF').style.display = v === 'fire' ? '' : 'none';
  if (v === 'journey') buildJ(); else if (v === 'tools') buildT(); else buildF();
  buildSecs();
  if (S.sec) { stateSec(); return; }
  if (v === 'journey') { lab.setGlow('rgba(242, 169, 59, .26)'); syncJ(true); } else if (v === 'tools') stateT(); else stateF();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'jcard') { if (S.jOrder.length < 3 && !S.jOrder.includes(b.dataset.k)) { S.jOrder.push(b.dataset.k); sfx.tick(); } }
  else if (a === 'jslot') { const i = +b.dataset.i; if (!S.jDone && i < S.jOrder.length) { S.jOrder.splice(i, 1); sfx.tick(); } }
  else if (a === 'jreset') { S.jOrder = []; sfx.click(); }
  else if (a === 'jcheck') {
    if (S.jOrder.length < 3) return;
    S.jRes = S.jOrder.every((k, i) => k === TRUE[i]) ? 'right' : S.jOrder[2] === TRUE[2] ? 'close' : 'wrong';
    S.jDone = true; S.p = 0; S.play = true; S.jKey = ''; (S.jRes === 'right' ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'play') { if (S.p >= 0.999) S.p = 0; S.play = !S.play; sfx.click(); S.jKey = ''; }
  else if (a === 'jump') { const p = PL.find((q) => q.k === b.dataset.k); S.p = Math.min(1, pOf(p.ka) + 0.004); S.play = false; sfx.click(); showStage(); }
  else if (a === 'tool') {
    const i = +b.dataset.i;
    if (S.tPick === null) { S.tPick = i; S.tSel = T_RIGHT; S.tSelT = now(); (i === T_RIGHT ? sfx.good : sfx.bad)(); showStage(); }
    else { S.tSel = i; S.tSelT = now(); sfx.click(); }
  } else if (a === 'fopt') { S.fPick = +b.dataset.i; S.fire = true; (S.fPick === F_RIGHT ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'ftog') { const k = b.dataset.k; S[k] = !S[k]; if (k === 'fire' && !S.fire) S.fx = null; sfx.click(); }
  else if (a === 'ffx') { const k = b.dataset.k; S.fx = S.fx === k ? null : k; if (S.fx) S.fire = true; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k;
    if (S.sec === 'a') S.seaTgt = 1; // the experiment sets itself up
    sfx.click(); showStage();
  } else if (a === 'sea') { S.seaTgt = S.seaTgt ? 0 : 1; sfx.click(); }
  S.jKey = '';
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'oaSlider') return;
  S.p = ev.target.value / 1000; S.play = false; syncJ();
});

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec === 'a') { S.sea += clamp(S.seaTgt - S.sea, -dt / 1.8, dt / 1.8); drawBering(c, w, h, dt, time); return; }
  if (S.sec === 'b') { drawCave(c, w, h, dt, time); return; }
  const v = lab.view;
  if (v === 'journey') {
    if (S.play) {
      S.p = Math.min(1, S.p + dt / 15);
      const sl = $('oaSlider'); if (sl) sl.value = Math.round(S.p * 1000);
      if (S.p >= 1) { S.play = false; buildJ(); }
      syncJ();
    }
    drawJourney(c, w, h, dt, time);
  } else if (v === 'tools') drawTools(c, w, h, dt, time);
  else drawFire(c, w, h, dt, time);
});
render();
</script>
