}

}

const bandOf = (r) => (r < 1.1 ? 0 : r < 1.5 ? 1 : r < 3 ? 2 : 3);
function drawAxisView(c) {
  const a = T[lang].ax, r = ratio(S.s);
  drawCard(c);
  headline(c, a.heads[bandOf(r)]);
  caption(c, a.cap);
  const la = S.asked ? clamp01(S.peel * 1.7 - 0.15) : 0; // the numbers appear as the sticker lifts; before that they are not drawn at all
  drawBars(c, { vals: [A, B], cols: [BLU, ORG], names: a.names, lo: S.sv, hi: AX_TOP, la, va: la });
  if (!S.asked || S.peel < 1) drawSticker(c, S.asked ? S.peel : 0);
}
function drawPicture(c) {
  const p = T[lang].pic, base = 236, sz = 44, e = ease(S.rowsT), k = S.kv, cxA = 78, cxB = 214, gap = sz * 1.12;
  drawCard(c); headline(c, p.head); caption(c, p.cap);
  c.strokeStyle = INK; c.lineWidth = 1.7; c.beginPath(); c.moveTo(22, base); c.lineTo(298, base); c.stroke();
  drawCat(c, cxA, base, sz);
  const bx = cxB - (e * gap) / 2;
  drawCat(c, bx, base, sz * k);
  if (e > 0.02) { c.save(); c.globalAlpha = e; drawCat(c, cxB + gap / 2, base, sz); c.restore(); }
  if (S.pAsked && e < 0.5) { // after the guess: the size of A's cat laid over B's picture, cell by cell
    c.save(); c.globalAlpha = 1 - e * 2; c.strokeStyle = 'rgba(192, 57, 43, .75)'; c.lineWidth = 1; c.setLineDash([4, 3]);
    const W = sz * k, left = bx - W / 2;
    c.beginPath();
    for (let j = 1; j * sz < W - 1; j++) { c.moveTo(left, base - j * sz); c.lineTo(left + W, base - j * sz); c.moveTo(left + j * sz, base); c.lineTo(left + j * sz, base - W); }
    c.stroke();
    c.setLineDash([]); c.lineWidth = 1.4; c.strokeRect(left, base - W, W, W);
    c.strokeStyle = 'rgba(192, 57, 43, .9)'; c.strokeRect(cxA - sz / 2, base - sz, sz, sz);
    c.restore();
  }
  c.save(); c.font = `800 13px ${FONT_N}`; c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillText(`${p.names[0]} · 100`, cxA, 254); c.fillText(`${p.names[1]} · 200`, cxB, 254); c.restore();
  if (e > 0.05) {
    c.save(); c.globalAlpha = e; drawCat(c, 36, 134, 24);
    c.font = `800 13px ${FONT_N}`; c.fillStyle = INK; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(p.legend, 54, 130); c.restore();
  }
}
// secret a: the Reds scored 20, the Blues 22; bar and width sliders
const areaRatio = () => ((GOALS[1] - S.aS) / (GOALS[0] - S.aS)) * S.aW;
const lieOf = (r) => (r - 1) / GOAL_FX;
function drawSecA(c) {
  const t = T[lang].sa, r = areaRatio();
  drawCard(c);
  headline(c, t.heads[r >= 1.9 && r <= 2.1 ? 2 : r < 1.2 ? 0 : 1]); caption(c, t.cap);
  drawBars(c, { vals: GOALS, cols: [RDT, BLU], names: t.teams, lo: S.aSv, hi: GOAL_TOP, widths: [1, S.aWv], va: 1 });
}
function drawSecB(c) {
  const a = T[lang].ax;
  drawCard(c); headline(c, a.heads[bandOf(ratio(S.bS))]); caption(c, a.cap);
  drawBars(c, { vals: [A, B], cols: [BLU, ORG], names: a.names, lo: S.bSv, hi: AX_TOP, va: 1 });
}

// --- the loop --------------------------------------------------------------------------------------------------------
const glide = (cur, tgt, dt) => (Math.abs(tgt - cur) < 0.02 ? tgt : cur + (tgt - cur) * (1 - Math.exp(-dt * 14)));
canvasLoop($('cv'), (c, w, h, dt, time) => {
  S.sv = glide(S.sv, S.s, dt); S.bSv = glide(S.bSv, S.bS, dt); S.aSv = glide(S.aSv, S.aS, dt); S.aWv = glide(S.aWv, S.aW, dt);
  S.kv = glide(S.kv, S.rows ? 1 : S.k, dt);
  S.rowsT = clamp(S.rowsT + (S.rows ? dt : -dt) / 0.7, 0, 1);
  if (S.asked && S.peel < 1) S.peel = Math.min(1, S.peel + dt / 0.9);
  S.swT += dt;
  S.fx = S.fx.map((x, j) => clamp(x + (S.done[j] ? dt : -dt) / 0.9, 0, 1));
  S.ripples.forEach((r) => { r.a += dt / 0.6; });
  S.ripples = S.ripples.filter((r) => r.a < 1);
  const g = fitBox(w, h);
  c.save(); c.translate(g.ox, g.oy); c.scale(g.sc, g.sc);
  if (S.sec === 'a') drawSecA(c);
  else if (S.sec === 'b') drawSecB(c);
  else if (lab.view === 'axis') drawAxisView(c);
  else if (lab.view === 'picture') drawPicture(c);
  else drawSpot(c, time);
  c.restore();
});

// --- controls --------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function askHTML(kind, q, note, opts, ok, ans, okText, noText) {
  if (ans !== null) return `<p class="ct-verdict ${ans === ok ? 'ok' : 'no'}">${esc(ans === ok ? okText : noText)}</p>`;
  return `<p class="ct-q">${esc(q)}</p>${note ? `<p class="ct-note">${esc(note)}</p>` : ''}<div class="ct-opts">${opts.map((o, i) => `<button type="button" class="ct-opt" data-act="ask" data-k="${kind}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
}
function solve(i, gave) {
  if (S.done[i]) return;
  S.done[i] = true; S.gave[i] = gave; S.msg = gave ? (i === FAIR ? 'shownFair' : 'shown') : (i === FAIR ? 'rightFair' : 'right');
  (gave ? sfx.snap : sfx.good)();
  render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'ask') {
    const i = +b.dataset.i;
    if (b.dataset.k === 'axis') { if (S.asked) return; S.asked = true; S.ans = i; (i === 2 ? sfx.good : sfx.bad)(); }
    else { if (S.pAsked) return; S.pAsked = true; S.pAns = i; (i === 1 ? sfx.good : sfx.bad)(); }
    showStage();
  } else if (act === 'rows') { S.rows = !S.rows; sfx.click(); }
  else if (act === 'fair') {
    if (S.done[S.i]) return;
    if (S.i === FAIR) return solve(S.i, false);
    S.miss[S.i]++; S.msg = 'missFair'; sfx.bad();
  } else if (act === 'show') solve(S.i, true);
  else if (act === 'next') {
    if (S.i >= NCH) { S.i = 0; S.done.fill(false); S.gave.fill(false); S.miss.fill(0); S.msg = null; }
    else { S.i++; S.msg = null; }
    S.swT = 0; sfx.click(); showStage();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'axS') S.s = v;
  else if (id === 'picS') S.k = v;
  else if (id === 'saS') S.aS = v;
  else if (id === 'saW') S.aW = v;
  else if (id === 'sbS') S.bS = v;
  else return;
  render();
});
// the picture: tap the trick in "Spot it"
$('cv').addEventListener('click', (ev) => {
  if (S.sec || lab.view !== 'spot' || S.i >= NCH || S.done[S.i]) return;
  const p = toDesign(ev), hs = HS[S.i];
  if (hs) {
    const px = Math.max(0, (TAP_MIN / p.sc - hs.w) / 2), py = Math.max(0, (TAP_MIN / p.sc - hs.h) / 2); // never smaller than 36 CSS px
    if (p.x >= hs.x - px && p.x <= hs.x + hs.w + px && p.y >= hs.y - py && p.y <= hs.y + hs.h + py) return solve(S.i, false);
  }
  S.miss[S.i]++; S.msg = 'miss'; S.ripples.push({ x: p.x, y: p.y, a: 0 }); sfx.bad(); render();
});

function onView() { S.sec = null; S.swT = 0; render(); }

// --- one render per change: controls, readout and the state card -----------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  show('ctAxis', !sec && v === 'axis'); show('ctPic', !sec && v === 'picture'); show('ctSpot', !sec && v === 'spot'); show('ctSa', sec === 'a'); show('ctSb', sec === 'b');
  const open = secret.unlocked();
  $('ctSecs').innerHTML = [['a', '🕵️'], ['b', '📏']].map(([k, emo]) => `<button type="button" class="chip ct-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec === 'a') return renderSa(t);
  if (sec === 'b') return renderSb(t);
  if (v === 'axis') renderAxis(t); else if (v === 'picture') renderPic(t); else renderSpot(t);
}
function renderAxis(t) {
  const a = t.ax, s = S.s, r = ratio(s), pct = Math.round(DATA_FX * 100);
  $('axAsk').innerHTML = askHTML('axis', a.q, a.note, a.opts, 2, S.ans, a.right(A, B, pct), a.wrong(A, B, pct));
  $('axCtl').style.display = S.asked ? 'block' : 'none';
  $('axL').textContent = a.slider; $('axS').value = s; $('axV').textContent = S.asked ? num(s) : ''; // the start value stays out of the DOM while the sticker is on
  lab.setGlow('rgba(217, 130, 60, .26)');
  if (!S.asked) { // predicting: nothing but the question; no numbers, no facts
    lab.setReadout('?', '', '', '#7a8bd1');
    lab.setState({ emo: '🤔', title: a.q, lead: a.note, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const band = s === 0 ? 0 : r < 2 ? 1 : 2, st = a.st(band, s, r);
  lab.setReadout(`×${dec(r)}`, a.sub, a.real(pct), r < 1.5 ? '#3ddc97' : r < 3 ? '#e0a030' : '#e8546b');
  lab.setState({ emo: ['📏', '✂️', '📉'][band], title: st[0], lead: st[1], body: '', extra: '' }); lab.setFacts(t.facts.axis);
}
function renderPic(t) {
  const p = t.pic, k = S.k;
  $('picAsk').innerHTML = askHTML('pic', p.q, p.note, p.opts, 1, S.pAns, p.right, p.wrong);
  $('picCtl').style.display = S.pAsked ? 'block' : 'none';
  $('picL').textContent = p.slider; $('picS').value = k; $('picS').disabled = S.rows; $('picV').textContent = S.pAsked ? `×${dec(k)}` : '';
  $('picRows').textContent = S.rows ? p.big : p.honest;
  lab.setGlow('rgba(224, 138, 74, .26)');
  if (!S.pAsked) {
    lab.setReadout('?', '', '', '#7a8bd1');
    lab.setState({ emo: '🤔', title: p.q, lead: p.note, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const mode = S.rows ? 'rows' : 'big', st = p.st(mode, k), kk = S.rows ? 1 : k;
  lab.setReadout(S.rows ? '×2' : `×${dec(kk * kk)}`, S.rows ? p.sub(1) : p.sub(kk), p.data, S.rows ? '#3ddc97' : kk * kk > 2.2 ? '#e8546b' : '#e0a030');
  lab.setState({ emo: S.rows ? '🐱' : '📐', title: st[0], lead: st[1], body: '', extra: '' }); lab.setFacts(t.facts.pic);
}
function renderSpot(t) {
  const sp = t.spot, i = S.i, end = i >= NCH, solved = !end && S.done[i], n = S.done.filter(Boolean).length;
  const firsts = S.done.filter((d, j) => d && !S.gave[j] && S.miss[j] === 0).length;
  $('spQ').textContent = end ? '' : sp.q; $('spQ').style.display = end ? 'none' : 'block';
  $('spFair').textContent = sp.fair; $('spFair').disabled = end || solved; $('spFair').style.display = end ? 'none' : '';
  const showBtn = !end && !solved && S.miss[i] >= 2;
  $('spShow').textContent = sp.show; $('spShow').hidden = !showBtn;
  $('spNext').hidden = !(end || solved); $('spNext').textContent = end ? sp.again : i === NCH - 1 ? sp.finish : sp.next;
  const msgs = { miss: [sp.miss, 'no'], missFair: [sp.missFair, 'no'], right: [sp.right, 'ok'], rightFair: [sp.rightFair, 'ok'], shown: [sp.shown, 'no'], shownFair: [sp.shownFair, 'ok'] };
  const m = !end && S.msg ? msgs[S.msg] : null;
  $('spMsg').className = `ct-msg ${m ? m[1] : ''}`; $('spMsg').textContent = m ? m[0] : '';
  $('spDots').innerHTML = [...Array(NCH).keys()].map((j) => `<i class="${S.done[j] ? (S.gave[j] || S.miss[j] ? 'help' : 'ok') : j === i ? 'now' : ''}"></i>`).join('');
  lab.setGlow('rgba(200, 95, 42, .26)');
  lab.setReadout(`${n}/${NCH}`, sp.checked, end ? '' : sp.counter(i + 1, NCH), '#e0a030');
  lab.setFacts(t.facts.spot);
  if (end) { lab.setState({ emo: '🕵️', title: sp.endHead, lead: sp.endLead, body: sp.end(firsts), extra: '' }); return; }
  if (solved) {
    const ex = sp.ex[i]({ s: SHACK_S, pct: Math.round(((SHACK[1] - SHACK[0]) / SHACK[0]) * 100), r: Math.round((SHACK[1] - SHACK_S) / (SHACK[0] - SHACK_S)),
      front: PIE[3], back: PIE[0], gaps: [TOWN[1][0] - TOWN[0][0], TOWN[2][0] - TOWN[1][0], TOWN[3][0] - TOWN[2][0]] });
    lab.setState({ emo: i === FAIR ? '✅' : '🔎', title: ex[0], lead: ex[1], body: '', extra: '' }); return;
  }
  lab.setState({ emo: '🔎', title: sp.counter(i + 1, NCH), lead: sp.q, body: S.miss[i] >= 2 ? sp.hint : '', extra: '' });
}
function renderSa(t) {
  const q = t.sa, r = areaRatio(), lf = lieOf(r), win = r >= 1.9 && r <= 2.1;
  $('saGoal').textContent = q.goal;
  $('saL1').textContent = q.sAxis; $('saS').value = S.aS; $('saV1').textContent = num(S.aS);
  $('saL2').textContent = q.sWidth; $('saW').value = S.aW; $('saV2').textContent = `×${dec(S.aW)}`;
  $('saMk').style.left = `${clamp(Math.log10(Math.max(1, lf)) / 2, 0, 1) * 100}%`;
  $('saE1').textContent = `1 · ${t.honest}`;
  lab.setGlow('rgba(74, 127, 167, .28)');
  lab.setReadout(`×${dec(r)}`, q.sub, q.pill(fmt(lf)), win ? '#3ddc97' : lf > 5 ? '#e8546b' : '#e0a030');
  lab.setState(win ? { emo: '🕵️', title: q.winTitle, lead: q.win(fmt(lf)), body: '', extra: '' } : { emo: '🕵️', title: q.goalTitle, lead: q.goal, body: '', extra: '' });
  lab.setFacts(t.facts.axis);
}
function renderSb(t) {
  const q = t.sb, s = S.bS, r = ratio(s), shown = (r - 1) * 100, data = DATA_FX * 100, lf = (r - 1) / DATA_FX, st = q.st(fmt(lf));
  $('sbDef').textContent = q.def;
  $('sbL').textContent = q.sAxis; $('sbS').value = s; $('sbV').textContent = num(s);
  $('sbShownL').textContent = q.shownL; $('sbShown').textContent = `+${fmt(shown)}%`;
  $('sbDataL').textContent = q.dataL; $('sbData').textContent = `+${fmt(data)}%`;
  $('sbLfL').textContent = `${q.lfL} = ${fmt(shown)} ÷ ${fmt(data)}`; $('sbLf').textContent = fmt(lf);
  $('sbMk').style.left = `${clamp(Math.log10(Math.max(1, lf)) / 2, 0, 1) * 100}%`;
  $('sbE1').textContent = q.meter;
  lab.setGlow('rgba(217, 130, 60, .28)');
  lab.setReadout(fmt(lf), q.sub, lf < 1.05 ? `✓ ${t.honest}` : '', lf < 1.05 ? '#3ddc97' : lf < 5 ? '#e0a030' : '#e8546b');
  lab.setState({ emo: '📏', title: st[0], lead: st[1], body: '', extra: '' }); lab.setFacts(t.facts.pic);
}

// fonts: the canvas needs the newspaper fonts before its first text
const SAMPLE = 'ABCabc0123ÁÉÍÓÖŐÚÜŰáéíóöőúüűАБВабв';
Promise.all([`800 19px "Playfair Display"`, `italic 800 13px "Playfair Display"`, `800 13px Nunito`, `900 13px Nunito`, `700 12px Nunito`].map((f) => document.fonts.load(f, SAMPLE).catch(() => null))).then(() => render());
render();
</script>
