// --- numbers and helpers (all declared before anything runs) ----------------------------------------------------
const D2R = Math.PI / 180;
const c01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => { t = c01(t); return t * t * (3 - 2 * t); };
const toward = (v, t, d) => (v < t ? Math.min(t, v + d) : Math.max(t, v - d));
const surf = (a, b, c) => 2 * (a * b + a * c + b * c);
const PAL = {
  lw: { a: '#ea7766', b: '#c9503f', dot: '#fcd6cc' },
  lh: { a: '#3fb0a8', b: '#26807b', dot: '#c2eee8' },
  wh: { a: '#f0bc4d', b: '#cf9526', dot: '#fff2c9' },
  tri: { a: '#a08be0', b: '#7762c0', dot: '#e0d7fc' },
  roof: { a: '#58a6dc', b: '#3a7fb4', dot: '#d3e8f9' },
  paint: { a: '#e8695a', b: '#bd4638', dot: null },
  clay: { a: '#e8e0cf', b: '#c9bfa8', dot: null },

const LIGHT = (() => { const v = [0.25, 0.55, 0.8], m = Math.hypot(...v); return v.map((x) => x / m); })();
const SZ = { w: 0, h: 0 };
const dimsOf = (kind, L, W, H) => (kind === 'lw' ? [L, W] : kind === 'lh' ? [L, H] : [W, H]);

// --- state -------------------------------------------------------------------------------------------------
const S = {

  pick: -1, guess2: -1, rev2: false, bars: 0, sec2: null,                               // view 2
  solid: 'box', a3: 0,                                                                  // view 3
  s3: { box: { sel: [], done: false }, tent: { sel: [], done: false } },

const ROWS = [[1, 4, 6], [2, 3, 4], [1, 1, 24], [2, 2, 6], [1, 2, 12]]; // the five boxes of 24 cubes, the least-paper one is not first
const ROWSA = ROWS.map((r) => surf(...r));
const WIN = ROWSA.indexOf(Math.min(...ROWSA));
const rowName = (r) => `${r[0]} × ${r[1]} × ${r[2]}`;
const SNOW = Array.from({ length: 28 }, (_, i) => ({ x: (i * 0.37) % 1, y: (i * 0.61) % 1, v: 0.03 + ((i * 7) % 5) * 0.012, r: 1 + (i % 3) * 0.6 }));
const dims = () => (S.sec1 === 'paint' ? { L: 3, W: 3, H: 3 } : { L: S.L, W: S.W, H: S.H });
const nowSec = () => performance.now() / 1000;

// --- 3-D: camera, projection, folding -------------------------------------------------------------------------
function camAt(e) { return { psi: 45 * D2R * (1 - e), phi: (35.264 + (90 - 35.264) * e) * D2R }; }
function proj(p, cam, s) {
  const cp = Math.cos(cam.psi), sp = Math.sin(cam.psi), sf = Math.sin(cam.phi), cf = Math.cos(cam.phi);
  const xr = p[0] * cp - p[1] * sp, yr = p[0] * sp + p[1] * cp;
  return [xr * s, (yr * sf - p[2] * cf) * s, yr * cf + p[2] * sf];
}
function area2(q) { let a = 0; for (let i = 0; i < q.length; i++) { const j = (i + 1) % q.length; a += q[i][0] * q[j][1] - q[j][0] * q[i][1]; } return a / 2; }
function normal3(p) {
  const a = [p[1][0] - p[0][0], p[1][1] - p[0][1], p[1][2] - p[0][2]], b = [p[2][0] - p[0][0], p[2][1] - p[0][1], p[2][2] - p[0][2]];
  const n = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], m = Math.hypot(...n) || 1;
  return [n[0] / m, n[1] / m, n[2] / m];
}
// a point is turned about a hinge line (p0 on the paper, n = direction from the hinge to the part that folds); the part goes DOWN (-z) by angle th
function foldPt(p, hg, th) {
  const rx = p[0] - hg.p0[0], ry = p[1] - hg.p0[1], s = rx * hg.n[0] + ry * hg.n[1], q = p[2];
  const ax = rx - s * hg.n[0], ay = ry - s * hg.n[1];
  const s2 = s * Math.cos(th) + q * Math.sin(th), q2 = -s * Math.sin(th) + q * Math.cos(th);
  return [hg.p0[0] + ax + s2 * hg.n[0], hg.p0[1] + ay + s2 * hg.n[1], q2];
}
// the cross-shaped net of an L × W × H box: top in the middle, four sides around it, the bottom hangs on the back side
function netFaces(L, W, H) {
  const rw = Math.min(0.9, L * 0.6), rib = [L / 2 - rw / 2, L / 2 + rw / 2];
  const R = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  return [
    { id: 'T', kind: 'lw', loc: R(0, 0, L, W), rib },
    { id: 'F', kind: 'lh', loc: R(0, W, L, W + H), rib, hinge: [{ p0: [0, W], n: [0, 1] }] },
    { id: 'B', kind: 'lh', loc: R(0, -H, L, 0), rib, hinge: [{ p0: [0, 0], n: [0, -1] }] },
    { id: 'R', kind: 'wh', loc: R(L, 0, L + H, W), hinge: [{ p0: [L, 0], n: [1, 0] }] },
    { id: 'Lf', kind: 'wh', loc: R(-H, 0, 0, W), hinge: [{ p0: [0, 0], n: [-1, 0] }] },
    { id: 'U', kind: 'lw', loc: R(0, -H - W, L, -H), rib, hinge: [{ p0: [0, -H], n: [0, -1], lid: true }, { p0: [0, 0], n: [0, -1] }] },
  ];
}
// u = 0 folded, 1 flat. The bottom lid opens first, then the sides.
function pose(L, W, H, u) {
  const lidA = (Math.PI / 2) * (1 - ease(u / 0.6)), sideA = (Math.PI / 2) * (1 - ease((u - 0.25) / 0.75));
  const faces = netFaces(L, W, H).map((f) => {
    let pts = f.loc.map(([x, y]) => [x, y, 0]);
    for (const hg of f.hinge || []) pts = pts.map((p) => foldPt(p, hg, hg.lid ? lidA : sideA));
    return { ...f, pts };
  });
  let mz = Infinity;
  faces.forEach((f) => f.pts.forEach((p) => { mz = Math.min(mz, p[2]); }));
  faces.forEach((f) => f.pts.forEach((p) => { p[2] -= mz; }));
  return faces;
}
const BB = new Map();
function bboxFor(L, W, H, flat) {
  const k = `${L}.${W}.${H}.${flat}`;
  let r = BB.get(k);
  if (r) return r;
  const cam = camAt(flat ? 1 : 0);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const f of pose(L, W, H, flat ? 1 : 0)) for (const p of f.pts) { const q = proj(p, cam, 1); x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); }
  r = { x0, y0, x1, y1 };
  BB.set(k, r);
  return r;
}

// --- drawing helpers ---------------------------------------------------------------------------------------------
function pill(c, text, x, y, o = {}) {
  c.save();

  c.font = `800 ${size}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + 14, th = size + 10;
  const px = clamp(x - tw / 2, 4, Math.max(4, SZ.w - tw - 4)), py = clamp(y - th / 2, 4, Math.max(4, SZ.h - th - 4));
  c.globalAlpha = o.alpha ?? 1;
  c.fillStyle = o.bg || 'rgba(12,14,24,.84)';
  c.beginPath(); c.roundRect(px, py, tw, th, th / 2); c.fill();
  if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = 1.5; c.stroke(); }
  c.fillStyle = o.fg || '#fff'; c.fillText(text, px + tw / 2, py + th / 2 + 0.5);
  c.restore();
}
// affine map from the face's own (net) coordinates to the screen, from the first three corners
function affine(loc, scr) {
  const ax = loc[1][0] - loc[0][0], ay = loc[1][1] - loc[0][1], bx = loc[2][0] - loc[0][0], by = loc[2][1] - loc[0][1];
  const det = ax * by - ay * bx;
  if (Math.abs(det) < 1e-9) return null;
  const sx = scr[1][0] - scr[0][0], sy = scr[1][1] - scr[0][1], tx = scr[2][0] - scr[0][0], ty = scr[2][1] - scr[0][1];
  const m11 = (sx * by - tx * ay) / det, m12 = (-sx * bx + tx * ax) / det, m21 = (sy * by - ty * ay) / det, m22 = (-sy * bx + ty * ax) / det;
  return [m11, m21, m12, m22, scr[0][0] - (m11 * loc[0][0] + m12 * loc[0][1]), scr[0][1] - (m21 * loc[0][0] + m22 * loc[0][1])];
}
// one face of the paper: outside = patterned paper (dots, ribbon, a cm grid), inside = plain card
function drawFace(c, f, scr, o) {
  const path = () => { c.beginPath(); scr.forEach((q, i) => (i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]))); c.closePath(); };
  const pal = PAL[f.kind] || PAL.lw, k = o.k ?? 0.1;
  c.save(); c.lineJoin = 'round'; c.globalAlpha = o.alpha ?? 1;
  const xs = scr.map((q) => q[0]), ys = scr.map((q) => q[1]);
  if (!o.front) {
    path();
    const g = c.createLinearGradient(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys));
    g.addColorStop(0, '#f1e8d4'); g.addColorStop(1, '#d6cab0');
    c.fillStyle = g; c.fill();
    path(); c.fillStyle = `rgba(20,16,40,${0.1 + k * 0.6})`; c.fill();
  } else {
    if (o.shadow) { path(); c.shadowColor = `rgba(0,0,0,${o.shadow})`; c.shadowBlur = 9; c.shadowOffsetY = 3; c.fillStyle = pal.b; c.fill(); c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0; }
    const m = affine(f.loc, scr);
    c.save(); path(); c.clip();
    if (m) {
      c.transform(...m);
      const lx = f.loc.map((q) => q[0]), ly = f.loc.map((q) => q[1]);
      const x0 = Math.min(...lx), x1 = Math.max(...lx), y0 = Math.min(...ly), y1 = Math.max(...ly);
      const g = c.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, pal.a); g.addColorStop(1, pal.b);
      c.fillStyle = g; c.fillRect(x0 - 1, y0 - 1, x1 - x0 + 2, y1 - y0 + 2);
      if (pal.dot && !o.plain) {
        c.fillStyle = pal.dot; c.globalAlpha = (o.alpha ?? 1) * 0.6;
        for (let i = Math.floor(x0); i < Math.ceil(x1); i++) for (let j = Math.floor(y0); j < Math.ceil(y1); j++) {
          if ((i + j) % 2) continue;
          c.beginPath(); c.arc(i + 0.5, j + 0.5, 0.17, 0, 7); c.fill();
        }
        c.globalAlpha = o.alpha ?? 1;
      }
      if (f.rib && !o.plain) {
        const rg = c.createLinearGradient(f.rib[0], 0, f.rib[1], 0);
        rg.addColorStop(0, '#f1dfa2'); rg.addColorStop(0.5, '#fff3c8'); rg.addColorStop(1, '#d9b863');
        c.fillStyle = rg; c.fillRect(f.rib[0], y0 - 1, f.rib[1] - f.rib[0], y1 - y0 + 2);

      }

    c.restore();

  }

}
function bow(c, x, y, r, a) {

  for (const sg of [-1, 1]) { // two tails
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(sg * r * 0.5, r * 0.6, sg * r * 0.95, r * 1.05); c.lineTo(sg * r * 0.62, r * 0.98); c.quadraticCurveTo(sg * r * 0.3, r * 0.5, 0, 0);

    c.fillStyle = gold(c.createLinearGradient(0, -r * 0.5, 0, r * 0.2)); c.fill(); c.strokeStyle = '#8a6218'; c.lineWidth = 1.2; c.stroke();
    c.beginPath(); c.ellipse(sg * r * 0.62, -r * 0.18, Math.max(0, r * 0.34), Math.max(0, r * 0.18), 0, 0, 7); c.fillStyle = 'rgba(140,100,20,.35)'; c.fill();
    c.restore();
  }
  c.beginPath(); c.arc(0, 0, Math.max(0, r * 0.26), 0, 7); c.fillStyle = gold(c.createLinearGradient(-r * 0.2, -r * 0.2, r * 0.2, r * 0.2)); c.fill(); c.strokeStyle = '#8a6218'; c.lineWidth = 1.2; c.stroke();

const centroid = (q) => [q.reduce((s, p) => s + p[0], 0) / q.length, q.reduce((s, p) => s + p[1], 0) / q.length];

canvasLoop($('cv'), (c, cw, ch, dt, time) => {

// view 1: the box, the net, the counter
function drawUnfold(c, cw, ch, dt) {
  const { L, W, H } = dims(), paint = S.sec1 === 'paint', t = T[lang];
  S.u = toward(S.u, S.rev ? 1 : 0, dt / 1.7);
  const u = S.u, e = ease((u - 0.12) / 0.88), cam = camAt(e);
  const b0 = bboxFor(L, W, H, false), b1 = bboxFor(L, W, H, true);
  const fit = (b) => Math.min((cw * 0.88) / (b.x1 - b.x0), ((ch - 46) * 0.84) / (b.y1 - b.y0), 46);
  const s = lerp(fit(b0), fit(b1), e);
  const cx = lerp((b0.x0 + b0.x1) / 2, (b1.x0 + b1.x1) / 2, e), cy = lerp((b0.y0 + b0.y1) / 2, (b1.y0 + b1.y1) / 2, e);
  const ox = cw / 2 - cx * s, oy = (ch + 34) / 2 - cy * s;

  if (u < 0.7) {
    const fl = pose(L, W, H, 0)[0].pts, base = centroid(fl.map((p) => proj([p[0], p[1], 0], cam, s)));
    const rr = Math.max(10, (L + W) * s * 0.55);
    c.save(); c.globalAlpha = 1 - u / 0.7; c.translate(base[0] + ox, base[1] + oy + 4); c.scale(1, 0.38);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, rr); g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, rr, 0, 7); c.fill(); c.restore();
  }
  const faces = pose(L, W, H, u).map((f) => {
    const sc = f.pts.map((p) => { const q = proj(p, cam, s); return [q[0] + ox, q[1] + oy, q[2]]; });
    return { f, sc, depth: sc.reduce((a, q) => a + q[2], 0) / sc.length, ar: area2(sc), n: normal3(f.pts) };
  }).sort((p, q) => p.depth - q.depth);
  for (const { f, sc, ar, n } of faces) {
    if (Math.abs(ar) < 0.5) continue;
    const front = ar > 0, nn = front ? n : [-n[0], -n[1], -n[2]];
    const dot = Math.max(0, nn[0] * LIGHT[0] + nn[1] * LIGHT[1] + nn[2] * LIGHT[2]);
    const kind = paint ? 'paint' : f.kind;
    drawFace(c, { ...f, kind }, sc.map((q) => [q[0], q[1]]), { front, k: 0.5 * (1 - dot) * (front ? 1 : 0.8), grid: paint ? 0.95 : 0.35 * e, plain: paint, shadow: 0.38 * (1 - 0.75 * e) });
  }
  const top = faces.find((q) => q.f.id === 'T');
  if (!paint && u < 0.3 && top) { const m = centroid(top.sc); bow(c, m[0], m[1] + 2, clamp(Math.min(L, W) * s * 0.32, 8, 28), 1 - u / 0.3); }
  // edge tags on the folded box
  if (u < 0.22 && top) {
    const a = 1 - u / 0.22, P = (x, y, z) => { const q = proj([x, y, z], cam, s); return [q[0] + ox, q[1] + oy]; };
    const dz = Math.min(...pose(L, W, H, 0).flatMap((f) => f.pts.map((p) => p[2])));
    const tags = [[P(L / 2, W, dz), `${t.L[0]} = ${L}`, -12, 14], [P(L, W / 2, dz), `${t.L[1]} = ${W}`, 14, 14], [P(L, W, H / 2), `${t.L[2]} = ${H}`, 18, 0]];
    for (const [p, txt, dx, dy] of tags) pill(c, txt, p[0] + dx, p[1] + dy, { alpha: a, bg: 'rgba(12,14,24,.8)' });
  }
  // face labels on the flat net
  if (S.rev && u > 0.78) {
    const a = c01((u - 0.78) / 0.22);
    for (const { f, sc, ar } of faces) {
      const [x, y] = centroid(sc), [p, q] = dimsOf(f.kind, L, W, H), big = Math.sqrt(Math.abs(ar)) >= 40;
      pill(c, big ? `${p}×${q} = ${p * q}` : `${p * q}`, x, y, { alpha: a, size: 12 });
    }

  const g = S.guess, close = Math.abs(g - SA) <= SA * 0.1;
  if (paint) {
    lab.setReadout(`${SA}`, v1.paintSub, v1.paintPill, '#ea7766');
    lab.setState({ emo: close ? '✅' : '🎨', title: g === SA ? `${t.right} ${v1.paintRes(SA)}` : v1.paintRes(SA), lead: g === SA ? v1.paintL : `${v1.paintBad(g)} ${v1.paintL}`, body: '', extra: `<div class="wb-sumrow tot"><span>${esc(v1.paintRows)}</span></div>` });
  } else {
    const rows = [0, 1, 2].map((i) => { const [p, q] = dimsOf(['lw', 'lh', 'wh'][i], L, W, H); return { p, q, a: p * q, col: PAL[['lw', 'lh', 'wh'][i]].a, nm: v1.kinds[i] }; });
    const extra = rows.map((r) => `<div class="wb-sumrow"><i style="background:${r.col}"></i><span>${esc(`${r.nm}: ${r.p} × ${r.q} = ${r.a}, ${v1.twice}: ${2 * r.a}`)}</span></div>`).join('')
      + `<div class="wb-sumrow tot"><span>${esc(`${2 * rows[0].a} + ${2 * rows[1].a} + ${2 * rows[2].a} = ${SA} ${t.u2}`)}</span></div>`;
    lab.setReadout(`${SA} ${t.u2} · ${V} ${t.u3}`, v1.sub, '', '#ea7766');
    lab.setState({ emo: close ? '✅' : '📐', title: v1.resT(SA), lead: v1.resL, body: `${close ? v1.close(g) : g < SA ? v1.low(g) : v1.high(g)} ${v1.inside(V)}`, extra });
  }
  lab.setFacts(t.f1);
}

function renderCubes(t) {
  const heat = S.sec2 === 'heat', v2 = t.v2, shown = S.rev2 || heat, p = S.pick;
  lab.setGlow('rgba(240, 188, 77, .24)');
  $('wbGo2').textContent = S.rev2 ? v2.again : v2.go; $('wbGo2').disabled = !S.rev2 && p < 0;
  secChip($('wbSec2'), 'heat', '❄️', heat);
  const detail = () => { const [l, w, h] = [...ROWS[p]].sort((a, b) => b - a); return `<div class="wb-sumrow"><span>${esc(v2.row(rowName(ROWS[p]), l, w, h, l * w, l * h, w * h, ROWSA[p]))}</span></div>`; };
  if (!shown) {
    lab.setReadout(`24 ${t.u3}`, v2.same, p >= 0 ? rowName(ROWS[p]) : '', '#f0bc4d');
    lab.setState({ emo: '🧊', title: v2.askT, lead: v2.askL, body: '', extra: '' });
  } else if (heat) {
    lab.setReadout(`${p >= 0 ? ROWSA[p] : ROWSA[WIN]} ${t.u2}`, `24 ${t.u3}`, '', '#ff6b3d');
    lab.setState({ emo: '❄️', title: t.heat.t, lead: t.heat.l, body: '', extra: p >= 0 ? detail() : '' });
  } else {
    const gi = S.guess2;
    lab.setReadout(p >= 0 ? `${ROWSA[p]} ${t.u2} · 24 ${t.u3}` : `24 ${t.u3}`, p >= 0 ? rowName(ROWS[p]) : v2.same, p === WIN ? v2.least : '', '#f0bc4d');
    lab.setState({ emo: gi === WIN ? '✅' : '🧊', title: gi < 0 ? rowName(ROWS[WIN]) : gi === WIN ? t.right : v2.no(rowName(ROWS[WIN])), lead: v2.winL, body: p < 0 ? v2.tap : '', extra: p >= 0 ? detail() : '' });
  }
  lab.setFacts(t.f2);
}

function renderTent(t) {
  const k = S.solid, st = S.s3[k], v3 = t.v3, faces = NETS[k], other = k === 'box' ? 'tent' : 'box';
  lab.setGlow('rgba(88, 166, 220, .26)');
  $('wbSolid').innerHTML = ['box', 'tent'].map((x) => `<button data-solid="${x}" class="${x === k ? 'on' : ''}">${esc(v3[x])}</button>`).join('');
  const n = st.sel.filter(Boolean).length;
  $('wbGo3').textContent = !st.done ? v3.check : !S.s3[other].done ? (k === 'box' ? v3.toTent : v3.toBox) : v3.again;
  $('wbGo3').disabled = !st.done && n === 0;
  if (!st.done) {
    lab.setReadout(`? ${t.u2}`, v3.chosen(n), '', '#58a6dc');
    lab.setState({ emo: k === 'box' ? '📦' : '⛺', title: k === 'box' ? v3.boxT : v3.tentT, lead: k === 'box' ? v3.boxL : v3.tentL, body: '', extra: '' });
  } else {
    const need = faces.filter((f) => f.need), tot = need.reduce((s, f) => s + areaOf(f), 0);
    const miss = faces.filter((f, i) => f.need && !st.sel[i]).length, extraN = faces.filter((f, i) => !f.need && st.sel[i]).length, ok = !miss && !extraN;
    const sum = need.map((f) => areaOf(f)).join(' + ') + ` = ${tot} ${t.u2}`;
    lab.setReadout(`${tot} ${t.u2}`, v3.faces(need.length), '', '#58a6dc');
    lab.setState({
      emo: ok ? '✅' : '🤔', title: ok ? t.right : v3.wrongT,
      lead: ok ? (k === 'box' ? v3.rightBox : v3.rightTent) : [miss ? v3.miss(miss) : '', extraN ? v3.extra(extraN) : ''].filter(Boolean).join(' '),
      body: k === 'tent' ? v3.tri : '', extra: `<div class="wb-sumrow tot"><span>${esc(sum)}</span></div>`,
    });
  }
  lab.setFacts(t.f3);
}
render();
</script>
