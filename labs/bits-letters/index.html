// --- sound: one soft sine beep for Morse, created on the first tap ---------------------------------------------
let AC = null, beepG = null, beepO = null;
function audioReady() {
  if (store.get('sound', null) === null) $('sound').click();
  if (!store.get('sound', false)) return false;
  unmuteIOS();
  try {
    AC ??= new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state !== 'running') AC.resume().catch(() => {});
    return true;
  } catch { return false; }
}
function beepOn() {
  if (!audioReady() || beepO) return;
  const t = AC.currentTime; beepO = AC.createOscillator(); beepG = AC.createGain();
  beepO.type = 'sine'; beepO.frequency.value = 620;
  beepG.gain.setValueAtTime(0.0001, t); beepG.gain.linearRampToValueAtTime(0.16, t + 0.012);
  beepO.connect(beepG).connect(AC.destination); beepO.start(t);
}
function beepOff() {
  if (!beepO) return;
  const t = AC.currentTime, o = beepO, g = beepG; beepO = null; beepG = null;
  try { g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0.0001, t, 0.015); o.stop(t + 0.1); } catch { /* already stopped */ }
}

// --- data helpers ------------------------------------------------------------------------------------------
const val = () => S.bits.reduce((a, b, i) => a + b * VALS[i], 0);
const bin = (v, n = 8) => v.toString(2).padStart(n, '0');
const targetCh = () => SPELL[S.ti] ?? (/^[A-Za-z]$/.test(S.ini) ? S.ini : 'M');
const charOf = (v) => (v === 32 ? '␣' : v > 32 && v < 127 ? String.fromCharCode(v) : v < 32 || v === 127 ? '·' : '▯');
const prefixLen = (b) => (b >= 0xF0 ? 5 : b >= 0xE0 ? 4 : b >= 0xC0 ? 3 : b >= 0x80 ? 2 : 1);
function bytesOf(word) {
  const enc = new TextEncoder();
  return Array.from(word).map((ch) => ({ ch, bytes: Array.from(enc.encode(ch)) }));
}
function wrongRead(bytes) {
  try { const d = new TextDecoder('latin1'); return bytes.map((b) => d.decode(new Uint8Array([b]))); } catch { return bytes.map((b) => String.fromCharCode(b)); }
}
const curWord = () => Array.from(S.bw).slice(0, 6).join('');
const done2 = () => val() === targetCh().charCodeAt(0);

// --- drawing helpers (design box W x H, scaled by min(w / W, h / H)) -------------------------------------------
let FIT = { ox: 0, oy: 0, s: 1 };
function pill(c, txt, x, y, o = {}) {
  c.save(); c.font = o.font || fnt(800, 14); c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(txt).width + (o.pad ?? 20), h = o.h || 26;
  x = Math.min(W - tw / 2 - 2, Math.max(tw / 2 + 2, x));
  c.fillStyle = o.bg || 'rgba(10,12,24,.84)'; c.beginPath(); c.roundRect(x - tw / 2, y - h / 2, tw, h, h / 2); c.fill();
  if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = 1.5; c.stroke(); }
  c.fillStyle = o.fg || '#EDEFF7'; c.fillText(txt, x, y + 1); c.restore();
}
function plate(c, x, y, w, h, r, top, bot, line) {
  const g = c.createLinearGradient(x, y, x + w * 0.4, y + h); g.addColorStop(0, top); g.addColorStop(1, bot);
  c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 10; c.shadowOffsetY = 4; c.fillStyle = g; c.beginPath(); c.roundRect(x, y, w, h, r); c.fill(); c.restore();
  c.strokeStyle = line; c.lineWidth = 1.5; c.beginPath(); c.roundRect(x, y, w, h, r); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x + r, y + 1.5); c.lineTo(x + w - r, y + 1.5); c.stroke();
}
// a bulb: g = glow 0..1, col = its light colour (hex)
function bulb(c, x, y, r, g, col = AMBER) {
  r = Math.max(1, r); g = Math.min(1, Math.max(0, g));
  c.save();
  if (g > 0.02) {
    const b = c.createRadialGradient(x, y, r * 0.4, x, y, r * 2.6); b.addColorStop(0, rgba(col, 0.5 * g)); b.addColorStop(1, rgba(col, 0));
    c.fillStyle = b; c.beginPath(); c.arc(x, y, r * 2.6, 0, TAU); c.fill();
  }
  const sg = c.createLinearGradient(x - r * 0.6, 0, x + r * 0.6, 0); sg.addColorStop(0, '#d9b45a'); sg.addColorStop(1, '#6b5128');
  c.fillStyle = sg; c.strokeStyle = '#2a1f0d'; c.lineWidth = 1.2; c.beginPath(); c.roundRect(x - r * 0.62, y + r * 0.7, r * 1.24, r * 0.72, r * 0.15); c.fill(); c.stroke();
  const gr = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.1);
  gr.addColorStop(0, mix('#3a4060', tint(col, 0.75), g)); gr.addColorStop(0.55, mix('#1a1e34', col, g)); gr.addColorStop(1, mix('#0f1224', shade(col, 0.4), g));
  c.fillStyle = gr; c.strokeStyle = g > 0.5 ? shade(col, 0.55) : '#05070f'; c.lineWidth = 1.5;
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = `rgba(255,255,255,${0.35 + 0.3 * g})`; c.beginPath(); c.ellipse(x - r * 0.38, y - r * 0.4, r * 0.28, r * 0.17, -0.7, 0, TAU); c.fill();
  c.restore();
}

// --- the three pictures ------------------------------------------------------------------------------------
function drawCount(c) {
  const n = S.n, N = 2 ** n, pred = S.phase === 'predict' && !S.rule, e = S.fresh ? ease(S.cT) : 1, t = performance.now() / 1000;
  plate(c, 10, 4, 340, 46, 12, '#8a6a35', '#53401f', '#2a1f0d');

    for (let i = 0; i < N; i++) {

      c.fillStyle = col; c.strokeStyle = shade(col, 0.5); c.lineWidth = 1; c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.fill(); c.stroke();

function drawBytes(c) {
  const T_ = T[lang], word = curWord(), items = bytesOf(word), cps = items.length;
  if (!cps) { pill(c, T_.b.empty, W / 2, H / 2, { font: fnt(800, 16) }); return; }

function drawMorse(c) {
  const T_ = T[lang], w = MWORDS[S.mw], t = performance.now() / 1000;
  const lg = c.createRadialGradient(W / 2, 34, 4, W / 2, 34, 60); lg.addColorStop(0, rgba(AMBER, S.lit ? 0.7 : 0.08)); lg.addColorStop(1, rgba(AMBER, 0));

function drawBroken(c) {

  items.forEach((it, ci) => {
    const cx = x0 + (at + it.bytes.length / 2) * cw, col = PAL[ci % 6];
    c.fillStyle = col; c.font = fnt(800, 26); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(it.ch, cx, 52);
    c.strokeStyle = rgba(col, 0.6); c.lineWidth = 2; c.beginPath(); c.moveTo(cx, 68); c.lineTo(cx, 82); c.stroke();
    at += it.bytes.length;
  });
  list.forEach((q, i) => {
    const cx = x0 + (i + 0.5) * cw, col = PAL[q.ci % 6];
    plate(c, cx - cw / 2 + 2, 118, cw - 4, 28, 8, tint(col, 0.1), shade(col, 0.35), shade(col, 0.6));
    c.fillStyle = '#10131f'; c.font = fnt(800, 14, MONO); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(q.b.toString(16).toUpperCase().padStart(2, '0'), cx, 133);
    c.strokeStyle = 'rgba(245,200,76,.6)'; c.lineWidth = 2; c.beginPath(); c.moveTo(cx, 150); c.lineTo(cx, 164); c.stroke();
    c.fillStyle = '#f5c84c'; c.font = fnt(800, 26); c.fillText(wr[i], cx, 208);
  });
  pill(c, wr.join(''), W / 2, 262, { font: fnt(800, 20), stroke: 'rgba(245,200,76,.6)' });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  S.cT = Math.min(1, S.cT + dt / 0.6); S.revT = Math.min(5, S.revT + dt);
  for (let i = 0; i < 8; i++) S.gl[i] += (S.bits[i] - S.gl[i]) * Math.min(1, dt * 12);
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2; FIT = { ox, oy, s };
  c.save(); c.translate(ox, oy); c.scale(s, s); c.lineJoin = 'round';
  if (S.sec === 'morse') drawMorse(c); else if (S.sec === 'broken') drawBroken(c);
  else if (lab.view === 'count') drawCount(c); else if (lab.view === 'spell') drawSpell(c, time); else drawBytes(c);
  c.restore();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'spell' || S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - FIT.ox) / FIT.s, y = (ev.clientY - r.top - FIT.oy) / FIT.s;
  const i = Math.round((x - 40) / 40);
  if (i < 0 || i > 7 || Math.abs(x - (40 + i * 40)) > 20 || y < 28 || y > 132) return;
  S.bits[i] ^= 1; S.bits[i] ? sfx.click() : sfx.tick();
  if (done2()) { S.doneAt = S.ti; sfx.good(); } else S.doneAt = -1;
  render();
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function say(m) { S.msg = m; S.msgT = performance.now() / 1000; }
function morsePush(sym) {
  const w = MWORDS[S.mw], ch = w[S.li], code = MORSE[ch];
  if (S.sent) return;
  if (sym !== code[S.buf.length]) { S.buf = ''; say(T[lang].m.wrong); sfx.bad(); return; }
  S.buf += sym;
  if (S.buf === code) {
    S.li++; S.buf = '';
    if (S.li >= w.length) { S.sent = true; say(T[lang].m.sent(w)); sfx.good(); } else { say(T[lang].m.ok); sfx.snap(); }
  }
}
const key = $('mKey');
key.addEventListener('pointerdown', (ev) => { ev.preventDefault(); key.setPointerCapture?.(ev.pointerId); if (S.lit) return; S.lit = true; S.pressAt = performance.now(); key.classList.add('dn'); beepOn(); });
const keyUp = () => {
  if (!S.lit) return;
  S.lit = false; key.classList.remove('dn'); beepOff();
  morsePush(performance.now() - S.pressAt < 250 ? '.' : '-'); render();
};
['pointerup', 'pointercancel', 'lostpointercapture'].forEach((e) => key.addEventListener(e, keyUp));
function tap(sym) { S.lit = true; beepOn(); render(); setTimeout(() => { S.lit = false; beepOff(); morsePush(sym); render(); }, sym === '.' ? 110 : 330); }

$('secStrip').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-k]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.k;
  if (S.sec === k) S.sec = null;
  else { S.sec = k; if (k === 'morse') { S.li = 0; S.buf = ''; S.sent = false; S.msg = ''; } }
  sfx.click(); render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-w], [data-m], [data-kw]'); if (!b) return;
  const a = b.dataset.act;
  if (b.dataset.w !== undefined) { S.bw = b.dataset.w; S.g3 = null; S.chk = false; sfx.tick(); }
  else if (b.dataset.m !== undefined) { S.mw = +b.dataset.m; S.li = 0; S.buf = ''; S.sent = false; S.msg = ''; sfx.tick(); }
  else if (b.dataset.kw !== undefined) { S.kw = +b.dataset.kw; sfx.tick(); }
  else if (a === 'g1dec') { S.g1 = clamp((S.g1 ?? 0) - 1, 0, 999); sfx.tick(); }
  else if (a === 'g1inc') { S.g1 = clamp((S.g1 ?? 0) + 1, 0, 999); sfx.tick(); }
  else if (a === 'g3dec') { S.g3 = clamp((S.g3 ?? 0) - 1, 0, 99); sfx.tick(); }
  else if (a === 'g3inc') { S.g3 = clamp((S.g3 ?? 0) + 1, 0, 99); sfx.tick(); }
  else if (a === 'cmain') {
    if (S.phase === 'predict') {
      if (S.g1 === null) return;
      const c = 2 ** (S.n + 1), ok = S.g1 === c;
      S.lastOk = ok; S.lastG = S.g1; if (ok) S.right++;
      S.n++; S.cT = 0; S.fresh = true; S.phase = 'shown'; if (S.right >= 3 || S.n >= 8) S.rule = true;
      (ok ? sfx.good : sfx.bad)(); showStage();
    } else { S.phase = 'predict'; S.g1 = null; S.fresh = false; sfx.click(); }
  } else if (a === 'rule') { S.rule = true; S.phase = 'free'; S.fresh = false; sfx.click(); }
  else if (a === 'snext') {
    if (S.ti >= 3 && done2()) { S.ti = 0; } else if (done2()) S.ti++;
    S.bits = S.bits.map(() => 0); S.doneAt = -1; sfx.click();
  } else if (a === 'soff') { S.bits = S.bits.map(() => 0); S.doneAt = -1; sfx.click(); }
  else if (a === 'bmain') {
    if (!curWord()) return;
    if (!S.chk) {
      if (S.g3 === null) return;
      S.chk = true; S.revT = 0; const n = new TextEncoder().encode(curWord()).length; (S.g3 === n ? sfx.good : sfx.bad)(); showStage();
    } else { const at = PRESETS.indexOf(S.bw); S.bw = PRESETS[(at + 1) % PRESETS.length]; S.g3 = null; S.chk = false; sfx.click(); }
  } else if (a === 'mdot') { tap('.'); return; } else if (a === 'mdash') { tap('-'); return; }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'g1') S.g1 = ev.target.value === '' ? null : clamp(Math.round(+ev.target.value), 0, 999);
  else if (id === 'g3') S.g3 = ev.target.value === '' ? null : clamp(Math.round(+ev.target.value), 0, 99);
  else if (id === 'wi') { S.bw = ev.target.value; S.g3 = null; S.chk = false; }
  else if (id === 'ini') { const v = ev.target.value; if (/^[A-Za-z]$/.test(v)) S.ini = v; S.bits = S.bits.map(() => 0); S.doneAt = -1; }
  else if (id === 'nr') { const n = +ev.target.value; if (n > S.n) { S.cT = 0; S.fresh = true; } S.n = n; S.phase = 'free'; sfx.tick(); }
  else return;
  render();
});

// --- render ----------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  lab.setFacts([{ emo: v === 'count' ? '📜' : v === 'spell' ? '🔠' : '🌐', text: t.facts[v], src: SRC[v] }]);
  const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  show('secCount', !sec && v === 'count'); show('secSpell', !sec && v === 'spell'); show('secBytes', !sec && v === 'bytes');
  show('secMorse', sec === 'morse'); show('secBroken', sec === 'broken');
  const open = secret.unlocked();
  $('secStrip').innerHTML = [['morse', '📡'], ['broken', '🔤']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec === 'morse') return renderMorse(t);
  if (sec === 'broken') return renderBroken(t);
  if (v === 'count') renderCount(t); else if (v === 'spell') renderSpell(t); else renderBytes(t);
}

function renderCount(t) {
  const n = S.n, N = 2 ** n, c = t.c, pred = S.phase === 'predict' && !S.rule, free = S.rule;
  lab.setGlow('rgba(255, 194, 71, .2)');
  $('cPred').style.display = free ? 'none' : ''; $('cFree').style.display = free ? '' : 'none';
  const gi = $('g1'), gv = S.g1 === null ? '' : String(S.g1);
  if (gi.value !== gv && document.activeElement !== gi) gi.value = gv;
  gi.disabled = !pred; gi.setAttribute('aria-label', c.q(n + 1));
  document.querySelectorAll('#cPred .bl-sb').forEach((b) => { b.disabled = !pred; });
  $('cMain').textContent = pred ? c.check : c.next; $('cMain').disabled = pred && S.g1 === null;
  $('cRule').textContent = c.rule; $('cRule').style.display = pred && S.right < 3 ? '' : 'none';
  $('nrL').textContent = `${c.slider}: ${n}`; if ($('nr').value !== String(n)) $('nr').value = n;
  const real = n === 7 ? c.r7 : n === 8 ? c.r8 : '';
  if (pred) {
    lab.setReadout('?', `${n + 1} ${t.bulb(n + 1)}`, '', AMBER);
    lab.setState({ emo: '🔢', title: c.q(n + 1), lead: n === 1 ? c.start : '', body: '', extra: '' });
  } else {
    lab.setReadout(N, `${n} ${t.bulb(n)}`, `${N} ${t.code(N)}`, AMBER);
    if (S.phase === 'shown') {
      const ok = S.lastOk, title = ok ? c.right : c.wrong(S.lastG, N);
      lab.setState({ emo: ok ? '✅' : '🤔', title, lead: S.rule ? c.ruleL(n, N) : c.lead(n, N), body: real, extra: '' });
    } else lab.setState({ emo: '✨', title: c.ruleT, lead: c.ruleL(n, N), body: real, extra: '' });
  }
}

function renderSpell(t) {
  const s = t.s, ch = targetCh(), tv = ch.charCodeAt(0), v = val(), ok = v === tv, last = S.ti >= 3;
  lab.setGlow('rgba(255, 194, 71, .2)');
  $('iniBox').style.display = last ? 'flex' : 'none'; $('iniNote').style.display = last ? '' : 'none';
  $('iniL').textContent = s.ini; $('iniNote').textContent = s.iniNote; if (document.activeElement !== $('ini')) $('ini').value = S.ini;
  $('sNext').textContent = last && ok ? s.again : s.next; $('sNext').disabled = !ok; $('sOff').textContent = s.off;
  lab.setReadout(v, bin(v), `“${charOf(v)}”`, AMBER);
  const odd = v === 32 ? s.sp : v < 32 || v === 127 ? s.ctl : v > 127 ? s.hi : '';
  if (ok) {
    lab.setState({ emo: '✅', title: S.ti >= 3 ? `${s.right} ${s.endT}` : s.right, lead: s.done(ch, tv, bin(tv)), body: S.ti === 1 ? s.cmp : S.ti >= 3 ? s.endL : '', extra: '' });
  } else lab.setState({ emo: '💡', title: s.make(ch), lead: s.tgt(ch, tv), body: odd || s.step(S.ti + 1), extra: '' });
}

function renderBytes(t) {
  const b = t.b, word = curWord(), items = bytesOf(word), cps = items.length, n = new TextEncoder().encode(word).length;
  lab.setGlow('rgba(143, 127, 208, .24)');
  $('bChips').innerHTML = PRESETS.map((w) => `<button class="chip ${w === S.bw ? 'on' : ''}" data-w="${esc(w)}">${esc(w)}</button>`).join('');
  const wi = $('wi'); wi.placeholder = b.own; wi.setAttribute('aria-label', b.own); if (document.activeElement !== wi && wi.value !== S.bw) wi.value = S.bw;
  const gi = $('g3'), gv = S.g3 === null ? '' : String(S.g3);
  if (gi.value !== gv && document.activeElement !== gi) gi.value = gv;
  gi.disabled = S.chk; gi.setAttribute('aria-label', b.q);
  document.querySelectorAll('#g3Row .bl-sb').forEach((x) => { x.disabled = S.chk; });
  $('bMain').textContent = S.chk ? b.next : b.check; $('bMain').disabled = !cps || (!S.chk && S.g3 === null);
  if (!cps) { lab.setReadout('?', '', '', '#8f7fd0'); lab.setState({ emo: '📦', title: b.empty, lead: '', body: '', extra: '' }); return; }
  if (!S.chk) {
    lab.setReadout('?', `${cps} ${t.sym(cps)}`, '', '#8f7fd0');
    lab.setState({ emo: '📦', title: b.q, lead: b.lead, body: '', extra: '' });
  } else {
    lab.setReadout(n, t.byte(n), `${cps} ${t.sym(cps)}`, '#8f7fd0');
    lab.setState({ emo: S.g3 === n ? '✅' : '🤔', title: S.g3 === n ? b.right : b.wrong(S.g3, n), lead: `${b.sum(cps, n)} ${b.legend}`, body: b.per, extra: '' });
  }
}

function renderMorse(t) {
  const m = t.m, w = MWORDS[S.mw];
  lab.setGlow('rgba(255, 194, 71, .24)');
  $('mChips').innerHTML = MWORDS.map((x, i) => `<button class="chip ${i === S.mw ? 'on' : ''}" data-m="${i}">${x}</button>`).join('');
  $('mKey').textContent = m.key; $('mDot').textContent = m.dot; $('mDash').textContent = m.dash;
  lab.setReadout(w, '', '', AMBER);
  lab.setState(S.sent ? { emo: '📡', title: m.sent(w), lead: m.sentL, body: '', extra: '' } : { emo: '📡', title: m.t(w), lead: m.lead, body: '', extra: '' });
}

function renderBroken(t) {
  const k = t.k, w = KWORDS[S.kw], list = bytesOf(w).flatMap((it) => it.bytes), bad = wrongRead(list).join('');
  lab.setGlow('rgba(245, 200, 76, .22)');
  $('kChips').innerHTML = KWORDS.map((x, i) => `<button class="chip ${i === S.kw ? 'on' : ''}" data-kw="${i}">${esc(x)}</button>`).join('');
  lab.setReadout(esc(bad), '', '', '#f5c84c');
  lab.setState(bad === w ? { emo: '🔤', title: k.same(w), lead: k.sameL, body: '', extra: '' } : { emo: '🔤', title: k.t(w, bad), lead: k.lead, body: '', extra: '' });
}
render();
</script>
</body>
</html>
