  const sc = (k, emo, i) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(t.secrets[i][0])}` : '🔒 ???'}</button>`;
  $('wsSecs').innerHTML = sc('flood', '🌊', 'a') + sc('town', '🏙️', 'b');
}
function renderPick(t) {
  let h = '';
  if (S.sec) {
    h = `<div class="row2" style="margin-top:0"><button class="chip" data-act="rep">${esc(S.sec === 'flood' ? t.sa.rep : t.sb.rep)}</button><button class="chip" data-act="exit">✕ ${esc(t.close)}</button></div>`;
    lab.setGlow(S.sec === 'flood' ? 'rgba(70,140,200,.3)' : 'rgba(217,130,95,.26)');
    if (S.sec === 'flood') {
      lab.setReadout('🌊', S.sdone ? t.sa.res.split('.')[0] : '', '', '#4f97c9');
      lab.setState({ emo: '🌊', title: t.secrets.a[0], lead: t.secrets.a[1], body: S.sdone ? t.sa.res : '', extra: '' });
    } else { S.yr = -1; lab.setState({ emo: '🏙️', title: t.secrets.b[0], lead: t.secrets.b[1], body: S.sdone ? t.sb.body : '', extra: '' }); }
    $('wsPick').innerHTML = h; lab.setFacts([]); return;
  }
  lab.setGlow('rgba(120,170,90,.26)'); const run = S.phase === 'run', col = '#82ac63';
  h = spotChips(S.sp, run);
  if (S.phase === 'ask') h += `<div class="ws-q"><div class="ws-qt">${esc(t.pk.q)}</div><div class="ws-opts">${t.pk.opts.map((o, k) => `<button class="ws-opt" data-act="g" data-k="${k}">${esc(o)}</button>`).join('')}</div></div>`;
  else if (run) h += `<div class="row2"><button class="chip" data-act="skip">${esc(t.pk.skip)}</button></div>`;
  else if (S.phase === 'done') h += `<div class="row2"><button class="btn" data-act="again">${esc(t.pk.again)}</button></div>`;
  $('wsPick').innerHTML = h;
  if (S.phase === 'pick') { lab.setReadout('?', t.pk.sub0, '', col); lab.setState({ emo: '🗺️', title: t.pk.t0, lead: t.pk.tap, body: '', extra: '' }); }
  else if (S.phase === 'ask') { lab.setReadout('?', t.spots[S.sp], '', col); lab.setState({ emo: '🤔', title: t.pk.q, lead: `📍 ${t.spots[S.sp]}`, body: '', extra: '' }); }
  else if (run) { const e = Math.max(0, S.evI), hit = hitOf(e, SP[S.sp].f); lab.setState({ emo: EVI[e], title: t.pk.run, lead: `${cap(t.evn[e])}: ${t.ev[e][hit ? 0 : 1]}`, body: '', extra: '' }); lab.setReadout(Math.max(0, S.yr), yrW(Math.max(0, S.yr)), cap(t.evn[e]), col); }
  else {
    const { cls, fin } = S.res, ok = cls === S.guess, sc = SCORE[S.sp];
    lab.setReadout(t.pk.out[cls], `🏠 ${Math.floor(fin)}`, `✓ ${fmt(sc)}/6`, ['#3ddc97', '#f5c84c', '#98A0B8'][cls]);
    lab.setState({ emo: ok ? '✅' : CLSI[cls], title: ok ? t.pk.right : t.pk.wrong, lead: t.pk.line[cls], body: `${t.pk.score(fmt(sc))} ${S.sp === 1 ? t.pk.bestHere : t.pk.best}`, extra: miniHtml(S.sp) });
  }
  lab.setFacts([{ emo: '🏘️', text: t.facts.pick, src: SRC.pick }]);
}
function renderFac(t) {
  lab.setGlow('rgba(224,176,80,.24)'); const i = S.fsel;
  let h = spotChips(i, false);
  if (i >= 0) h += `<div class="ws-tiles">${SP[i].f.map((f, k) => tileHtml(t, k, f, i)).join('')}</div>`;
  $('wsFac').innerHTML = h;
  const found = i >= 0 && SCORE[i] === 6;
  lab.setReadout(i < 0 ? '?' : `${fmt(SCORE[i])}/6`, i < 0 ? t.fa.sub0 : t.spots[i], found ? '★' : '', '#e0b050');
  lab.setState(found ? { emo: '✅', title: t.pk.right, lead: t.fa.found, body: '', extra: whyHtml(t) }
    : { emo: '🔎', title: t.fa.q, lead: i < 0 ? t.fa.t0 : `${cap(t.spots[i])}: ${t.fa.score(fmt(SCORE[i]))}`, body: '', extra: whyHtml(t) });
  lab.setFacts([{ emo: '🏝️', text: t.facts.factors, src: SRC.factors }]);
}
function renderReal(t) {
  lab.setGlow('rgba(80,140,210,.26)'); const id = S.ci, chk = S.chk[id], sel = S.sel[id], solved = S.ok.filter(Boolean).length, last = S.chk.every(Boolean);
  let h = `<div class="chips">${t.re.cities.map((n, i) => `<button class="chip${i === id ? ' on' : ''}" data-act="city" data-i="${i}">${S.ok[i] ? '✓ ' : ''}${esc(n)}</button>`).join('')}</div><div class="ws-tiles">`;
  h += FIC.map((_, k) => tileHtml(t, k, null, null, 'button', chk ? (sel[k] && ANS[k] ? 'ok' : sel[k] ? 'no' : ANS[k] ? 'miss' : '') : sel[k] ? 'sel' : '', `type="button" data-act="tog" data-i="${k}"${chk ? ' disabled' : ''}`)).join('') + '</div>';
  h += `<div class="row2">${chk ? `<button class="btn" data-act="next">${esc(last && id === 2 ? t.re.again : id < 2 ? t.re.next : t.re.again)}</button>` : `<button class="btn" data-act="chk"${sel.some(Boolean) ? '' : ' disabled'}>${esc(t.re.check)}</button>`}</div>`;
  $('wsReal').innerHTML = h;
  lab.setReadout(t.re.cities[id], chk ? '' : t.re.sub0, solved ? `${solved}/3 ✓` : '', '#5b9bd9');
  lab.setState(!chk ? { emo: '🏙️', title: t.re.q, lead: t.re.cities[id], body: '', extra: '' }
    : { emo: S.ok[id] ? '✅' : '🤔', title: S.ok[id] ? t.pk.right : t.re.no, lead: t.re.story[id], body: '', extra: '' });
  lab.setFacts([{ emo: '🌉', text: t.facts.real[0], src: SRC.real[0] }, { emo: '🏰', text: t.facts.real[1], src: SRC.real[1] }]);
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'sp') { if (lab.view === 'pick') return choose(i); return pickFac(i); }
  if (a === 'g') return guess(+b.dataset.k);
  if (a === 'skip') S.rt = EVN * TE;
  else if (a === 'again') { S.phase = 'pick'; S.sp = -1; S.res = null; S.hn = 4; sfx.click(); }
  else if (a === 'sec') {
    const k = b.dataset.k; if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null; else { S.sec = k; S.st = 0; S.sdone = false; S.yr = -1; lab.view = 'pick'; lab.renderChrome(); } sfx.click();
  } else if (a === 'rep') { S.st = 0; S.sdone = false; S.yr = -1; sfx.click(); }
  else if (a === 'exit') S.sec = null;
  else if (a === 'city') { S.ci = i; sfx.click(); }
  else if (a === 'tog') { S.sel[S.ci][i] = !S.sel[S.ci][i]; sfx.tick(); }
  else if (a === 'chk') { const ok = S.sel[S.ci].every((s, k) => s === !!ANS[k]); S.chk[S.ci] = true; S.ok[S.ci] = ok; (ok ? sfx.good : sfx.bad)(); }
  else if (a === 'next') {
    if (S.ci < 2) S.ci++; else { S.ci = 0; S.chk = [false, false, false]; S.ok = [false, false, false]; S.sel = [0, 1, 2].map(() => new Array(6).fill(false)); }
    sfx.click();
  }
  render();
});
render();
</script>
