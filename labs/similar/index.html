  c.fillStyle = 'rgba(255,120,120,.35)'; for (const ex of [0.34, 0.66]) { c.beginPath(); c.ellipse(ex, 0.57, 0.04, 0.03, 0, 0, Math.PI * 2); c.fill(); }
  c.fillStyle = '#e9a67c'; c.beginPath(); c.ellipse(0.5, 0.555, 0.025, 0.02, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#a33d3d'; c.lineWidth = 0.014; c.lineCap = 'round'; c.beginPath(); c.ellipse(0.5, 0.58, 0.08, 0.05, 0, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
  c.restore();
}
function drawPhoto(c, w, h, dt) {
  const t = T[lang].ph, dimL = 34, gap = 30, base = h - 46;
  const u = Math.max(8, Math.min((w - 24 - 2 * dimL - gap) / 6, (base - 52) / 5, 54));
  const total = 6 * u + 2 * dimL + gap, xo = (w - total) / 2 + dimL, x1 = xo + 2 * u + gap + dimL;
  const tgt = S.phStep ? 5 : 2.5;
  S.phH += (tgt - S.phH) * Math.min(1, dt * 5);
  if (Math.abs(tgt - S.phH) < 0.005) S.phH = tgt;
  board(c, w, h, xo, base, u);
  drawFace(c, xo, base, 2 * u, 2.5 * u);
  dimH(c, w, h, xo, xo + 2 * u, base + 17, CW, '2');
  dimV(c, w, h, xo - 17, base, base - 2.5 * u, CH, fmt(2.5));
  drawFace(c, x1, base, 4 * u, S.phH * u);
  dimH(c, w, h, x1, x1 + 4 * u, base + 17, CW, '4');
  dimV(c, w, h, x1 - 17, base, base - S.phH * u, CH, fmt(Math.round(S.phH * 10) / 10));
  const ok = S.phStep === 1;
  pill(c, w, h, ok ? t.pill1 : t.pill0, x1 + 2 * u, base - Math.max(S.phH, 2.5) * u - 16, { font: '900 14px Nunito, sans-serif', edge: ok ? '#1f9d55' : '#d6453d' });
}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function mMain() {
  if (S.mi >= 5) { S.mi = 0; S.mRight = []; S.mRaw = ''; S.mChecked = false; sfx.click(); return; }
  if (!S.mChecked) {
    const g = mGuess(); if (g === null) return;
    const ok = Math.abs(g - mAns(MT[S.mi])) < 1e-6;
    S.mRight[S.mi] = ok; S.mChecked = true; S.mT = 0; (ok ? sfx.good : sfx.bad)(); showStage();
  } else { S.mi++; S.mRaw = ''; S.mChecked = false; S.mT = 0; sfx.click(); }
}
function pMain() {
  if (S.pi >= PT.length) { S.pi = 0; S.pRight = []; S.pRaw = ''; S.pChecked = false; sfx.click(); return; }
  if (!S.pChecked) {
    const g = pGuess(); if (g === null) return;
    const ok = Math.abs(g - PT[S.pi].cm * S.pScale) < 1e-6;
    S.pRight[S.pi] = ok; S.pChecked = true; S.pT = 0; (ok ? sfx.good : sfx.bad)(); showStage();
  } else { S.pi++; S.pRaw = ''; S.pChecked = false; S.pT = 0; sfx.click(); }
}
const step = (raw, d) => { const g = parseNum(raw) ?? 0; return String(clamp(Math.round((g + d) * 10) / 10, 0, 999)).replace('.', lang === 'en' ? '.' : ','); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (k === 'area') { S.aK = S.sec === 'area' ? (S.aK === 2 ? 3 : 2) : 2; S.aT = 0; }
    else { S.phStep = S.sec === 'photo' ? 1 - S.phStep : 0; if (S.sec !== 'photo') S.phH = 2.5; }
    S.sec = k; sfx.click();
  } else if (a === 'back') { S.sec = null; sfx.click(); }
  else if (a === 'cmp') { S.gMode = 'compare'; S.gT = 5; sfx.click(); }
  else if (a === 'again') { S.gPick = null; S.gMode = 'compare'; S.gT = 0; sfx.click(); }
  else if (a === 'mdec' || a === 'minc') { if (S.mChecked) return; S.mRaw = step(S.mRaw, a === 'minc' ? 1 : -1); sfx.tick(); }
  else if (a === 'pdec' || a === 'pinc') { if (S.pChecked) return; S.pRaw = step(S.pRaw, a === 'pinc' ? 0.5 : -0.5); sfx.tick(); }
  else if (a === 'mmain') mMain();
  else if (a === 'pmain') pMain();
  else if (a === 'turn') { S.rul.vert = !S.rul.vert; if (S.pg) { const r = $('cv').getBoundingClientRect(); clampRuler(r.width, r.height); } sfx.click(); }
  else if (a === 'scale') {
    const m = +b.dataset.m; if (m === S.pScale) return;
    S.pScale = m; S.pRaw = ''; S.pChecked = false; S.pT = 0; delete S.pRight[S.pi]; if (S.pi >= PT.length) { S.pi = 0; S.pRight = []; } sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'mI') S.mRaw = ev.target.value;
  else if (ev.target.id === 'pI') S.pRaw = ev.target.value;
  else if (ev.target.id === 'gR') { S.gF = +ev.target.value; S.gMode = 'slide'; sfx.tick(); }
  else return;
  render();
});
$('ctrlBody').addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter') return;
  if (ev.target.id === 'mI') { ev.preventDefault(); mMain(); render(); }
  else if (ev.target.id === 'pI') { ev.preventDefault(); pMain(); render(); }
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-pick]'); if (!b) return;
  S.gPick = b.dataset.pick; S.gT = 0; S.gMode = 'compare';
  (S.gPick === 'x' ? sfx.good : sfx.bad)(); showStage(); render();
});

// --- render: controls, readout and the state card ----------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, asking = v === 'grow' && !S.sec && S.gPick === null;
  document.body.dataset.v = S.sec ? 'sec' : asking ? 'ask' : v;
  $('secGrow').style.display = v === 'grow' && !S.sec && !asking ? '' : 'none';
  $('secMiss').style.display = v === 'missing' && !S.sec ? '' : 'none';
  $('secPlan').style.display = v === 'plan' && !S.sec ? '' : 'none';
  askEl.style.display = asking ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip sm-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.s[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('area', '🟦') + sc('photo', '🖼️') + (S.sec ? `<button class="chip sm-c" data-act="back">${esc(t.s.back)}</button>` : '');
  if (S.sec) renderSec(t);
  else if (v === 'grow') renderGrow(t, asking);
  else if (v === 'missing') renderMiss(t);
  else renderPlan(t);
  const f = t.fact[v];
  lab.setFacts([{ emo: '💡', text: f[0], src: f[1] }]);
}
function renderSec(t) {
  if (S.sec === 'area') {
    const k = S.aK, a = t.ar;
    lab.setGlow('rgba(80,150,230,.28)'); lab.setReadout(k * k, a.sub(k), a.pill(k), '#2f6cbd');
    lab.setState({ emo: '🟦', title: a.t(k), lead: a.l(k), body: a.press, extra: '' });
  } else {
    const p = t.ph, ok = S.phStep === 1;
    lab.setGlow(ok ? 'rgba(61,220,151,.22)' : 'rgba(255,90,70,.22)');
    lab.setReadout(ok ? '× 2 · × 2' : '× 2 · × 1', p.sub, ok ? p.pill1 : p.pill0, ok ? '#1f9d55' : '#d6453d');
    lab.setState({ emo: '🖼️', title: ok ? p.t1 : p.t0, lead: ok ? p.l1 : p.l0, body: p.press, extra: '' });
  }
}
function renderGrow(t, asking) {
  const g = t.g;
  lab.setGlow('rgba(232, 131, 58, .26)');
  askEl.innerHTML = asking
    ? `<div class="q">${esc(g.askQ)}</div><p>${esc(g.askB)}</p><div class="opts"><button data-pick="x">${esc(g.optX)}</button><button data-pick="p">${esc(g.optP)}</button></div>` : '';
  $('gLbl').textContent = g.f; $('gE1').textContent = g.e1; $('gE2').textContent = g.e2;
  $('gR').value = S.gF; $('gR').setAttribute('aria-label', g.f);
  $('gCmp').textContent = g.cmp; $('gAgain').textContent = g.again;
  $('gCmp').classList.toggle('on', S.gMode === 'compare');
  if (asking) {
    lab.setReadout('2 × 3', g.door, '', '#e8833a');
    lab.setState({ emo: '🚪', title: g.stT, lead: g.stL, body: '', extra: '' });
  } else if (S.gMode === 'compare') {
    lab.setReadout('× 2: 4 × 6', '+ 2: 4 × 5', g.rdCmp, '#e8833a');
    lab.setState({ emo: S.gPick === 'x' ? '✅' : '🤔', title: S.gPick === 'x' ? g.right : g.wrong, lead: g.resL, body: g.resB, extra: `<div class="sm-fine">${esc(g.note)}</div>` });
  } else {
    const f = S.gF;
    lab.setReadout(`× ${fmt(f)}`, `2 → ${fmt(2 * f)}, 3 → ${fmt(3 * f)}`, g.rdPill, '#e8833a');
    lab.setState({ emo: '🔍', title: g.sT(f), lead: g.sL(f), body: g.sB(f), extra: '' });
  }
}
function renderMiss(t) {
  const m = t.m, end = S.mi >= 5, k5 = S.mRight.filter(Boolean).length, task = MT[Math.min(S.mi, 4)];
  lab.setGlow('rgba(47, 108, 189, .26)');
  const mi = $('mI'); if (mi.value !== S.mRaw) mi.value = S.mRaw;
  mi.disabled = S.mChecked; mi.setAttribute('aria-label', m.unk);
  $('mU').textContent = m.cm;
  document.querySelectorAll('#secMiss .sm-sb').forEach((b) => { b.disabled = S.mChecked; });
  document.querySelector('#secMiss .sm-cnt').style.display = end ? 'none' : '';
  $('mMain').textContent = end ? m.again : S.mChecked ? m.nxt : m.chk;
  $('mMain').disabled = !end && !S.mChecked && mGuess() === null;
  const dots = [0, 1, 2, 3, 4].map((i) => (i < S.mi ? '●' : i === S.mi ? '◉' : '○')).join(' ');
  if (end) {
    lab.setReadout(`${k5}/5`, dots, '', '#2f6cbd');
    lab.setState({ emo: '🏆', title: m.end(k5), lead: m.endL, body: '', extra: '' });
  } else if (!S.mChecked) {
    lab.setReadout('× ?', dots, '', '#2f6cbd');
    lab.setState({ emo: '📐', title: m.t, lead: m.l(S.mi + 1), body: m.hint, extra: '' });
  } else {
    const [a, b] = mPair(task), ans = mAns(task), g = mGuess();
    lab.setReadout(`× ${fmt(task.k)}`, m.fac(a, b, task.k), '', '#2f6cbd');
    const ok = Math.abs(g - ans) < 1e-6;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? m.right : m.wrong(g, ans), lead: m.calc(task.unk === 'h' ? task.h : task.w, task.k, ans), body: m.fac(a, b, task.k), extra: '' });
  }
}
function renderPlan(t) {
  const p = t.p, end = S.pi >= PT.length, k = S.pRight.filter(Boolean).length, task = PT[Math.min(S.pi, PT.length - 1)];
  lab.setGlow('rgba(95, 174, 98, .26)');
  $('pSeg').innerHTML = [5, 10].map((m) => `<button data-act="scale" data-m="${m}" class="${m === S.pScale ? 'on' : ''}">${esc(p.scale(m))}</button>`).join('');
  $('pTurn').textContent = p.turn;
  const pi = $('pI'); if (pi.value !== S.pRaw) pi.value = S.pRaw;
  pi.disabled = S.pChecked; pi.setAttribute('aria-label', p.m);
  $('pU').textContent = p.m;
  document.querySelectorAll('#secPlan .sm-sb').forEach((b) => { b.disabled = S.pChecked; });
  document.querySelector('#secPlan .sm-cnt').style.display = end ? 'none' : '';
  $('pTurn').style.display = end ? 'none' : '';
  $('pMain').textContent = end ? p.again : S.pChecked ? p.nxt : p.chk;
  $('pMain').disabled = !end && !S.pChecked && pGuess() === null;
  const dots = PT.map((_, i) => (i < S.pi ? '●' : i === S.pi ? '◉' : '○')).join(' ');
  if (end) {
    lab.setReadout(`${k}/${PT.length}`, dots, '', '#5fae62');
    lab.setState({ emo: '🏆', title: p.end(k), lead: p.endL, body: '', extra: '' });
  } else if (!S.pChecked) {
    lab.setReadout(`? ${p.m}`, p.scale(S.pScale), '', '#5fae62');
    lab.setState({ emo: '🗺️', title: p.t, lead: p.l(S.pi + 1, task.n), body: p.hint, extra: '' });
  } else {
    const ans = task.cm * S.pScale, g = pGuess(), ok = Math.abs(g - ans) < 1e-6;
    lab.setReadout(`${fmt(ans)} ${p.m}`, `${fmt(task.cm)} ${t.m.cm} × ${S.pScale} ${p.m}`, p.scale(S.pScale), '#5fae62');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? p.right : p.wrong(g, ans), lead: p.calc(task.cm, S.pScale, ans), body: '', extra: '' });
  }
}

canvasLoop($('cv'), (c, w, h, dt) => {
  if (S.sec === 'area') drawArea(c, w, h, dt);
  else if (S.sec === 'photo') drawPhoto(c, w, h, dt);
  else if (lab.view === 'grow') drawGrow(c, w, h, dt);
  else if (lab.view === 'missing') drawMissing(c, w, h, dt);
  else drawPlan(c, w, h, dt);
});
render();
</script>
