  const g = c.createLinearGradient(0, hz, 0, h); g.addColorStop(0, '#8db25a'); g.addColorStop(.5, '#5f8f40'); g.addColorStop(1, '#3d6b31');
  c.fillStyle = g; c.fillRect(0, hz, w, h - hz);
  c.strokeStyle = 'rgba(30,70,30,.25)'; c.lineWidth = 1; c.beginPath();
  for (let i = 0; i < 26; i++) { const x = (i * 97.3) % w, y = hz + 8 + ((i * 53.7) % Math.max(10, h - hz - 14)); c.moveTo(x, y); c.lineTo(x - 2, y - 5); c.moveTo(x + 4, y); c.lineTo(x + 5, y - 4); }
  c.stroke();
}
function shadow(c, x, y, rx, ry = rx * .08) {
  c.save(); c.fillStyle = 'rgba(15,35,15,.32)'; c.beginPath(); c.ellipse(x, y, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2); c.fill(); c.restore();
}

function drawDino(c, id, x, y, L, walk = 0, time = 0) { // x = tail tip, y = ground, L = length in px
  const d = SH[id], col = d.col, P = (u, v) => [x + u * L, y - v * L];
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  shadow(c, x + L * .5, y + 1, L * .52, Math.max(2, L * .035));
  const leg = (l, dark) => {
    const ph = walk ? Math.sin(time * 9 + (l[0] * 7)) * .03 * walk : 0;
    const a = P(l[0], l[1]), b = P(l[2] + ph, l[3]), wd = Math.max(1.5, l[4] * L);
    c.strokeStyle = '#1c1410'; c.lineWidth = wd + 2; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
    c.strokeStyle = dark ? sh(col, .38) : sh(col, .12); c.lineWidth = wd; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
  };
  d.legs.filter((l) => l[5]).forEach((l) => leg(l, true));
  const top = y - d.top * L, bot = y - L * .08;
  const g = c.createLinearGradient(0, top, 0, bot); g.addColorStop(0, sh(col, -.32)); g.addColorStop(.45, col); g.addColorStop(1, sh(col, .35));
  smooth(c, d.pts.map(([u, v]) => P(u, v)));
  c.fillStyle = g; c.fill(); c.strokeStyle = sh(col, .62); c.lineWidth = Math.max(1, Math.min(2, L * .012)); c.stroke();
  c.save(); smooth(c, d.pts.map(([u, v]) => P(u, v))); c.clip(); // soft light on the back, from the top left
  const hl = c.createLinearGradient(x, 0, x + L, 0); hl.addColorStop(0, 'rgba(255,255,255,.14)'); hl.addColorStop(.6, 'rgba(255,255,255,0)'); c.fillStyle = hl; c.fillRect(x, top, L, bot - top); c.restore();
  d.legs.filter((l) => !l[5]).forEach((l) => leg(l, false));
  if (id === 'tri') { // horns and frill edge
    c.fillStyle = '#f1e6c8'; c.strokeStyle = '#7a6a48'; c.lineWidth = 1;
    for (const t of [[[.90, .33], [1.02, .405], [.94, .30]], [[.975, .27], [1.04, .325], [1.0, .255]]]) { c.beginPath(); t.forEach(([u, v], i) => { const p = P(u, v); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }); c.closePath(); c.fill(); c.stroke(); }
  }
  if (L > 26) { const e = P(d.eye[0], d.eye[1]), r = clamp(L * .011, 1.6, 4); c.fillStyle = '#fff'; c.beginPath(); c.arc(e[0], e[1], r, 0, 7); c.fill(); c.fillStyle = '#1a1210'; c.beginPath(); c.arc(e[0] + r * .2, e[1], r * .55, 0, 7); c.fill(); }
  c.restore();
}

function drawBus(c, x, y, L) { // x = rear, facing right
  const H = L * .25, top = y - H - L * .03;
  c.save(); shadow(c, x + L / 2, y + 1, L * .52, Math.max(2, L * .03));
  const g = c.createLinearGradient(0, top, 0, y - L * .03); g.addColorStop(0, '#ffd96a'); g.addColorStop(.55, '#f2b53c'); g.addColorStop(1, '#c98a22');
  rr(c, x, top, L, H, Math.max(2, L * .04)); c.fillStyle = g; c.fill(); c.strokeStyle = '#6d4a10'; c.lineWidth = 1.5; c.stroke();
  const wy = top + H * .16, wh = H * .32, wg = c.createLinearGradient(0, wy, 0, wy + wh); wg.addColorStop(0, '#9fd0ea'); wg.addColorStop(1, '#4f7fa6');
  c.fillStyle = wg; for (let i = 0; i < 8; i++) { rr(c, x + L * (.05 + i * .108), wy, L * .085, wh, Math.max(1, L * .01)); c.fill(); }
  rr(c, x + L * .92, wy, L * .06, H * .5, Math.max(1, L * .01)); c.fill();
  c.fillStyle = 'rgba(255,255,255,.28)'; c.fillRect(x + L * .02, top + H * .06, L * .96, Math.max(1, H * .04));
  c.fillStyle = '#c0392b'; c.fillRect(x + L * .02, top + H * .62, L * .96, Math.max(1, H * .07));
  for (const wx of [.2, .78]) { const r = Math.max(2, L * .034); c.fillStyle = '#1b1b22'; c.beginPath(); c.arc(x + L * wx, y - L * .03 + 0, r, 0, 7); c.fill(); c.fillStyle = '#aaa'; c.beginPath(); c.arc(x + L * wx, y - L * .03, r * .45, 0, 7); c.fill(); }
  c.restore();
}

function drawKid(c, x, y, H) { // side view, x = centre, y = ground, H = height in px
  const lh = H * .42, th = H * .30, hr = H * .115;
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; shadow(c, x, y + 1, H * .22, Math.max(1.5, H * .03));
  c.strokeStyle = '#3f6aa6'; c.lineWidth = H * .1;
  for (const dx of [-.03, .05]) { c.beginPath(); c.moveTo(x + H * dx, y - lh); c.lineTo(x + H * dx, y - H * .04); c.stroke(); }
  c.fillStyle = '#f4f4f4'; for (const dx of [-.03, .05]) { c.beginPath(); c.ellipse(x + H * dx + H * .03, y - H * .02, H * .07, H * .035, 0, 0, 7); c.fill(); }
  const tg = c.createLinearGradient(x - H * .11, 0, x + H * .11, 0); tg.addColorStop(0, '#f7c85c'); tg.addColorStop(1, '#d9a02f');
  rr(c, x - H * .11, y - lh - th, H * .22, th + H * .04, H * .07); c.fillStyle = tg; c.fill(); c.strokeStyle = '#7a5410'; c.lineWidth = 1; c.stroke();
  c.strokeStyle = '#e8b896'; c.lineWidth = H * .065; c.beginPath(); c.moveTo(x, y - lh - th * .85); c.lineTo(x + H * .1, y - lh - th * .25); c.stroke();
  const hy = y - lh - th - hr * .85, hg = c.createRadialGradient(x - hr * .3, hy - hr * .3, 1, x, hy, hr * 1.2); hg.addColorStop(0, '#fbdcbc'); hg.addColorStop(1, '#e0a97e');
  c.fillStyle = hg; c.beginPath(); c.arc(x, hy, hr, 0, 7); c.fill();
  c.fillStyle = '#5b3a29'; c.beginPath(); c.arc(x - hr * .1, hy - hr * .1, hr * 1.04, Math.PI * .95, Math.PI * 1.95); c.fill();
  if (H > 40) { c.fillStyle = '#1a1210'; c.beginPath(); c.arc(x + hr * .42, hy + hr * .05, Math.max(1, hr * .12), 0, 7); c.fill(); }
  c.restore();
}
function drawKidTop(c, x, y, s) { // from above, s = px per metre, x/y = centre of the body
  c.save(); c.lineCap = 'round';
  c.fillStyle = '#f4f4f4'; c.strokeStyle = '#8a8a96'; c.lineWidth = 1;
  for (const dx of [-.085, .085]) { c.beginPath(); c.ellipse(x + s * dx, y + s * .21, s * .06, s * .12, 0, 0, 7); c.fill(); c.stroke(); }
  c.strokeStyle = '#e8b896'; c.lineWidth = s * .06; for (const dx of [-1, 1]) { c.beginPath(); c.moveTo(x + dx * s * .15, y); c.lineTo(x + dx * s * .19, y + s * .13); c.stroke(); }
  const g = c.createRadialGradient(x - s * .06, y - s * .04, 1, x, y, s * .24); g.addColorStop(0, '#fbd06a'); g.addColorStop(1, '#d19a2a');
  c.fillStyle = g; c.beginPath(); c.ellipse(x, y, s * .19, s * .09, 0, 0, 7); c.fill(); c.strokeStyle = '#7a5410'; c.lineWidth = 1.2; c.stroke();
  const hg = c.createRadialGradient(x - s * .03, y - s * .03, 1, x, y, s * .1); hg.addColorStop(0, '#6b4632'); hg.addColorStop(1, '#3e2819');
  c.fillStyle = hg; c.beginPath(); c.arc(x, y, s * .085, 0, 7); c.fill(); c.restore();
}

// --- scenes -------------------------------------------------------------------------------------------------
function drawLine(c, w, h, dt, time) {
  const hz = h * .5, base = h * .76, gap = Math.min(h * .055, 15), n = S.n;
  backdrop(c, w, h, hz);
  if (S.sec === 'bird') return drawBird(c, w, h, time);
  if (S.sec === 'bones') return drawBones(c, w, h, time);
  const ext = Math.max(13.8, ...DINOS.slice(0, n).map((d) => d.L)), tgt = (w * .88) / ext;
  S.sc = S.sc ? S.sc + (tgt - S.sc) * Math.min(1, dt * 2.6) : tgt; // the camera eases outwards
  const sc = S.sc, x0 = w * .05;
  for (let i = n - 1; i >= 0; i--) { // far rows first
    const d = DINOS[i], e = ease((time - S.at[i]) / 1.6), x = lerp(w + 30, x0, e), walking = e < 1 ? 1 : 0;
    drawDino(c, d.id, x, base - (i + 1) * gap - (walking ? Math.abs(Math.sin(time * 9)) * 2 : 0), d.L * sc, walking, time);
  }
  drawBus(c, x0 + 1.3 * sc, base, 12 * sc);
  drawKid(c, x0 + .35 * sc, base + 2, Math.max(14, 1.2 * sc));
  pill(c, T[lang].bus, x0 + 7.3 * sc, base + 6, w, h, 12);
  if (n > 0 && S.v) { // length label for the newest dinosaur
    const i = S.v.i, d = DINOS[i], xx = x0 + d.L * sc / 2, yy = base - (i + 1) * gap - SH[d.id].top * d.L * sc - 28;
    pill(c, `${T[lang].names[i]} · ${T[lang].m(d.L)}`, xx, yy, w, h, 12);
  }
}

function drawRaptor(c, w, h, dt, time) {
  backdrop(c, w, h, h * .45);
  const sc = Math.min(w * .8 / 3.3, h * .5 / 1.2), base = h * .72, kx = w * .27, rx = w * .46;
  drawKid(c, kx, base, 1.2 * sc);
  pill(c, T[lang].you, kx, base + 8, w, h, 12);
  if (S.rg === null) { // not drawn while the child predicts
    const bob = Math.sin(time * 3) * 3, cx = rx + sc, cy = base - .55 * sc + bob;
    c.save(); c.fillStyle = 'rgba(10,12,22,.55)'; c.beginPath(); c.arc(cx, cy, Math.max(20, sc * .45), 0, 7); c.fill();
    c.fillStyle = '#fff'; c.font = `900 ${Math.max(28, sc * .6)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', cx, cy + 2); c.restore();
    return;
  }
  const e = ease((time - S.rAt) / 1.2), x = lerp(w + 20, rx, e);
  drawDino(c, 'velo', x, base, 2 * sc, e < 1 ? 1 : 0, time);
  if (e >= 1) {
    c.save(); c.setLineDash([5, 5]); c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(kx + 14, base - 1.2 * sc); c.lineTo(rx + 2.1 * sc, base - 1.2 * sc); c.stroke(); c.restore();
    pill(c, `${T[lang].rap.title} · ${T[lang].rap.long}`, rx + sc, base + 8, w, h, 12);
  }
}

function footprint(c, x, y, s, kind) { // an impression in the ground; s = px per metre
  c.save(); c.translate(x, y);
  const paint = (draw) => {
    c.fillStyle = 'rgba(255,230,180,.45)'; c.save(); c.translate(1.5, 1.5); draw(); c.restore();
    c.fillStyle = 'rgba(40,24,10,.5)'; c.save(); c.translate(-1, -1); draw(); c.restore();
    const g = c.createLinearGradient(-s * .3, -s * .4, s * .3, s * .4); g.addColorStop(0, '#6a4e32'); g.addColorStop(1, '#8a6a46'); c.fillStyle = g; draw();
  };
  if (kind === 'rex') paint(() => {
    c.beginPath(); c.ellipse(0, s * .22, s * .15, s * .17, 0, 0, 7); c.fill();
    c.beginPath(); c.ellipse(0, -s * .1, s * .075, s * .3, 0, 0, 7); c.fill();
    for (const k of [-1, 1]) { c.beginPath(); c.ellipse(k * s * .17, -s * .04, s * .07, s * .25, k * .45, 0, 7); c.fill(); }
  });
  else paint(() => {
    c.beginPath(); c.ellipse(0, s * .06, s * .5, s * .38, 0, 0, 7); c.fill();
    for (let i = 0; i < 4; i++) { const a = -2.55 + i * .5; c.beginPath(); c.arc(Math.cos(a) * s * .44, -s * .06 + Math.sin(a) * s * .42 - s * .06, s * .1, 0, 7); c.fill(); }
  });
  c.restore();
}
function drawStep(c, w, h, dt, time) {
  const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#c9ad80'); g.addColorStop(1, '#a58b62'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = 'rgba(80,55,30,.18)'; for (let i = 0; i < 40; i++) { c.beginPath(); c.arc((i * 71.3) % w, (i * 47.9) % h, 1 + (i % 3), 0, 7); c.fill(); }
  const s = Math.min(w * .9 / 2.6, h * .62 / 1.0), cy = h * .46, ax = w * .27, bx = w * .73;
  if (S.sg === null) {
    drawKidTop(c, w * .5, cy, s);
    pill(c, T[lang].you, w * .5, cy + s * .42, w, h, 12);
    const bob = Math.sin(time * 3) * 3; c.save(); c.fillStyle = '#3e2a14'; c.font = `900 ${Math.max(34, s * .5)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', w * .5, cy - s * .55 + bob); c.restore();
    return;
  }
  const e = ease((time - S.sAt) / .9);
  footprint(c, ax, cy, s, 'rex'); footprint(c, bx, cy, s, 'arg');
  drawKidTop(c, lerp(w * .5, ax, e), lerp(cy + s * .1, cy + s * .05, e), s);
  if (e >= 1) drawKidTop(c, bx, cy + s * .05, s);
  const t = T[lang].stp;
  c.save(); c.strokeStyle = 'rgba(30,18,6,.7)'; c.lineWidth = 1.5; c.setLineDash([4, 4]);
  c.beginPath(); c.moveTo(ax - s * .42, cy - s * .4); c.lineTo(ax - s * .42, cy + s * .4); c.moveTo(bx - s * .5, cy + s * .5); c.lineTo(bx + s * .5, cy + s * .5); c.stroke(); c.restore();
  pill(c, `${t.cap} · ${t.eight}`, ax, cy + s * .56, w, h, 12);
  pill(c, `${t.cap2} · ${t.one}`, bx, cy + s * .62, w, h, 12);
}

function drawBird(c, w, h, time) {
  const s = Math.min(w / 300, h / 230), cx = w * .46, cy = h * .46 + Math.sin(time * 3) * 4 * s;
  const gl = c.createRadialGradient(cx, cy, 5, cx, cy, 170 * s); gl.addColorStop(0, 'rgba(255,230,160,.5)'); gl.addColorStop(1, 'rgba(255,230,160,0)'); c.fillStyle = gl; c.fillRect(0, 0, w, h);
  c.save(); c.translate(cx, cy); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  c.strokeStyle = '#3d7a64'; c.lineWidth = 9; c.beginPath(); c.moveTo(-40, 14); c.lineTo(-92, 44); c.stroke(); // tail
  c.strokeStyle = '#265a49'; c.lineWidth = 3; c.beginPath(); c.moveTo(-40, 14); c.lineTo(-92, 44); c.stroke();
  const wa = Math.sin(time * 34) * .5, wing = (alpha, rot) => { c.save(); c.translate(-8, -16); c.rotate(rot); c.fillStyle = `rgba(190,225,215,${alpha})`; c.beginPath(); c.ellipse(-4, -34, 11, 46, 0, 0, 7); c.fill(); c.restore(); };
  wing(.4, -.5 - wa * .5);
  const bg = c.createLinearGradient(0, -30, 0, 36); bg.addColorStop(0, '#3fbf8f'); bg.addColorStop(.6, '#2c8f6d'); bg.addColorStop(1, '#e8dcc0');
  c.save(); c.rotate(-.35); c.fillStyle = bg; c.beginPath(); c.ellipse(0, 0, 58, 26, 0, 0, 7); c.fill(); c.strokeStyle = '#1d5a45'; c.lineWidth = 2; c.stroke(); c.restore();
  const hg = c.createRadialGradient(56, -30, 2, 60, -26, 24); hg.addColorStop(0, '#e2506a'); hg.addColorStop(.5, '#3fbf8f'); hg.addColorStop(1, '#2c8f6d');
  c.fillStyle = hg; c.beginPath(); c.arc(60, -26, 20, 0, 7); c.fill(); c.strokeStyle = '#1d5a45'; c.lineWidth = 2; c.stroke();
  c.strokeStyle = '#2a2a30'; c.lineWidth = 4; c.beginPath(); c.moveTo(78, -28); c.lineTo(150, -22); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(67, -31, 5, 0, 7); c.fill(); c.fillStyle = '#111'; c.beginPath(); c.arc(68.5, -31, 2.8, 0, 7); c.fill();
  wing(.75, .15 + wa);
  c.restore();
  pill(c, T[lang].sec.bird.t, w / 2, h - 36, w, h, 13);
}

function boneGeo(c, b, L, x, y, alpha, dashed) { // draw one bone; x = tail tip, y = ground
  const P = (u, v) => [x + u * L, y - v * L];
  c.save(); c.globalAlpha = alpha; c.lineCap = 'round'; c.lineJoin = 'round';
  if (dashed) c.setLineDash([3, 5]);
  const stroke = (pts, wd) => {
    if (!dashed) { c.strokeStyle = '#3a2f22'; c.lineWidth = wd + 3; c.beginPath(); pts.forEach(([u, v], i) => { const p = P(u, v); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }); c.stroke(); }
    c.strokeStyle = dashed ? '#e8dfc8' : '#f3ead4'; c.lineWidth = dashed ? 1.5 : wd; c.beginPath(); pts.forEach(([u, v], i) => { const p = P(u, v); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }); c.stroke();
  };
  if (b.k === 'line') stroke(b.p, Math.max(3, b.w * L));
  else if (b.k === 'ribs') for (let i = 0; i < 4; i++) stroke([[.48 + i * .045, .33], [.5 + i * .045, .27], [.52 + i * .045, .22]], Math.max(2.5, .013 * L));
  else { const [u, v, rx, ry, rot] = b.e, p = P(u, v); c.fillStyle = dashed ? 'rgba(232,223,200,.18)' : '#f3ead4'; c.strokeStyle = dashed ? '#e8dfc8' : '#3a2f22'; c.lineWidth = dashed ? 1.5 : 2;
    c.beginPath(); c.ellipse(p[0], p[1], rx * L, ry * L, rot, 0, 7); c.fill(); c.stroke();
    if (!dashed) { c.fillStyle = '#3a2f22'; c.beginPath(); c.arc(p[0] + rx * L * .1, p[1] - ry * L * .1, Math.max(2, L * .012), 0, 7); c.fill(); } }
  c.restore();
}
function drawBones(c, w, h, time) {
  const L = w * .86, x = w * .07, y = h * .72, done = S.bones >= BONES.length;
  smooth(c, SH.rex.pts.map(([u, v]) => [x + u * L, y - v * L]));
  c.save(); c.fillStyle = done ? 'rgba(184,105,79,.55)' : 'rgba(255,255,255,.08)'; c.fill(); c.setLineDash([6, 5]); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.5; c.stroke(); c.restore();
  shadow(c, x + L * .5, y + 2, L * .45, 4);
  BONES.forEach((b, i) => boneGeo(c, b, L, x, y, 1, true));
  BONES.forEach((b, i) => { if (i < S.bones) boneGeo(c, b, L, x, y, Math.min(1, ease((time - S.boneAt) / .3) + (i < S.bones - 1 ? 1 : 0)), false); });
  pill(c, done ? `${T[lang].sec.bones.dt}` : T[lang].sec.bones.sub, w / 2, h - 36, w, h, 13);
}

const lab = shell({ key: 'dino-sizes', T, topics: TOPICS, views: ['line', 'raptor', 'step'], onLang: render, onView: render });
const secret = secretLab('dino-sizes', () => ({
  secrets: [{ emo: '🐔', title: T[lang].secrets.a[0], desc: T[lang].secrets.a[1] }, { emo: '🦴', title: T[lang].secrets.b[0], desc: T[lang].secrets.b[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="vLine"><div id="lineQ"></div><div class="chips dz-chips" id="secChips"></div></div>
  <div id="vRaptor"><div id="rapQ"></div></div>
  <div id="vStep"><div id="stepQ"></div></div>`;

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const addBone = () => { if (S.bones >= BONES.length) S.bones = 0; else S.bones++; S.boneAt = now(); sfx.snap(); render(); };

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'line') drawLine(c, w, h, dt, time); else if (v === 'raptor') drawRaptor(c, w, h, dt, time); else drawStep(c, w, h, dt, time);
});
$('cv').addEventListener('click', () => { if (lab.view === 'line' && S.sec === 'bones') addBone(); });

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'pick') {
    const d = DINOS[S.n], truth = d.L > 12 ? 'big' : 'small', ok = b.dataset.g === truth;
    S.v = { i: S.n, ok }; S.at[S.n] = now(); S.n++; (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'add') { S.v = { i: S.n, ok: null }; S.at[S.n] = now(); S.n++; sfx.click(); showStage(); }
  else if (act === 'next') { S.v = null; sfx.click(); }
  else if (act === 'again') { S.n = 0; S.v = null; S.at = []; sfx.click(); }
  else if (act === 'rg') { S.rg = b.dataset.g; S.rAt = now(); (S.rg === 'no' ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'rreset') { S.rg = null; sfx.click(); }
  else if (act === 'sg') { S.sg = b.dataset.g; S.sAt = now(); (S.sg === 'yes' ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'sreset') { S.sg = null; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; if (k === 'bones' && S.sec) { S.bones = 0; } sfx.click();
  } else if (act === 'bone') return addBone();
  render();
});

// --- one render per change ------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  if (v !== 'line') S.sec = null;
  $('vLine').hidden = v !== 'line'; $('vRaptor').hidden = v !== 'raptor'; $('vStep').hidden = v !== 'step';
  if (v === 'line') renderLine(t); else if (v === 'raptor') renderRaptor(t); else renderStep(t);
}
const verdict = (ok, t) => (ok ? { c: 'var(--ok)', s: t.right } : { c: 'var(--wip)', s: t.notq });

function renderLine(t) {
  lab.setGlow('rgba(143, 178, 90, .26)');
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k === 'bird' ? 'a' : 'b'][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('bird', '🐔') + sc('bones', '🦴');
  const q = $('lineQ');
  if (S.sec === 'bird') {
    q.innerHTML = `<div class="dz-note">${esc(t.sec.bird.l)}</div>`;
    lab.setReadout('🐦', t.sec.bird.t, '', '#3fbf8f');
    lab.setState({ emo: '🐔', title: t.sec.bird.t, lead: t.sec.bird.l, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (S.sec === 'bones') {
    const n = S.bones, done = n >= BONES.length;
    q.innerHTML = `<div class="dz-opts"><button class="dz-b go" data-act="bone">${esc(done ? t.again : t.sec.bones.btn)}</button></div>`;
    lab.setReadout(`${n}/7`, '🦴', done ? t.m(12) : '', '#e0d6b8');
    lab.setState({ emo: '🦴', title: done ? t.sec.bones.dt : t.sec.bones.t(n), lead: done ? t.sec.bones.dl : t.sec.bones.l, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const done = S.n >= DINOS.length;
  if (S.v === null) { // predict: the next dinosaur is not drawn and its size is not shown
    const d = DINOS[S.n], name = t.names[S.n];
    q.innerHTML = d.ask
      ? `<p class="dz-q">${esc(t.ask(name))}</p><div class="dz-opts"><button class="dz-b" data-act="pick" data-g="big">${esc(t.bigger)}</button><button class="dz-b" data-act="pick" data-g="small">${esc(t.smaller)}</button></div>`
      : `<p class="dz-q">${esc(name)}</p><div class="dz-opts"><button class="dz-b go" data-act="add">${esc(t.add(name))}</button></div>`;
    lab.setReadout('?', name, '', '#8fb25a');
    lab.setState({ emo: '🚌', title: t.ask(name).replace(/^.*?: /, ''), lead: t.lineIntro, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  const i = S.v.i, d = DINOS[i], name = t.names[i], k = t.buses(d.L), vd = S.v.ok === null ? null : verdict(S.v.ok, t);
  q.innerHTML = `${vd ? `<div class="dz-v" style="color:${vd.c}">${esc(vd.s)}</div>` : `<div class="dz-v" style="color:var(--ok)">${esc(t.same)}</div>`}
    <div class="dz-opts"><button class="dz-b go" data-act="${done ? 'again' : 'next'}">${esc(done ? t.again : t.nextB)}</button></div>`;
  lab.setReadout(t.m(d.L), name, k, '#8fb25a');
  lab.setState({ emo: d.L === 12 ? '🦖' : '🦕', title: vd ? vd.s : t.same, lead: done ? t.doneLead : (S.v.ok === null ? t.leadSame(name, d.L) : d.L > 12 ? t.leadB(name, d.L, k) : t.leadS(name, d.L)), body: '', extra: '' });
  lab.setFacts(done ? [{ emo: '🐘', ...t.facts.line }] : []);
}

function renderRaptor(t) {
  lab.setGlow('rgba(200, 117, 74, .26)');
  const r = t.rap, q = $('rapQ');
  if (S.rg === null) {
    q.innerHTML = `<p class="dz-q">${esc(r.q)}</p><div class="dz-opts"><button class="dz-b" data-act="rg" data-g="yes">${esc(t.yes)}</button><button class="dz-b" data-act="rg" data-g="no">${esc(t.no)}</button></div>`;
    lab.setReadout('?', '', '', '#c8754a'); lab.setState({ emo: '🦖', title: r.q, lead: '', body: '', extra: '' }); lab.setFacts([]); return;
  }
  const vd = verdict(S.rg === 'no', t);
  q.innerHTML = `<div class="dz-v" style="color:${vd.c}">${esc(vd.s)}</div><div class="dz-opts"><button class="dz-b go" data-act="rreset">${esc(t.again)}</button></div>`;
  lab.setReadout(t.m(0.5), r.hip, `${t.you}: ${t.m(1.2)}`, '#c8754a');
  lab.setState({ emo: S.rg === 'no' ? '✅' : '🦖', title: vd.s, lead: r.lead, body: '', extra: '' });
  lab.setFacts([{ emo: '🦃', ...t.facts.raptor }]);
}

function renderStep(t) {
  lab.setGlow('rgba(165, 139, 98, .28)');
  const s = t.stp, q = $('stepQ');
  if (S.sg === null) {
    q.innerHTML = `<p class="dz-q">${esc(s.q)}</p><div class="dz-opts"><button class="dz-b" data-act="sg" data-g="yes">${esc(t.yes)}</button><button class="dz-b" data-act="sg" data-g="no">${esc(t.no)}</button></div>`;
    lab.setReadout('?', '', '', '#a58b62'); lab.setState({ emo: '👣', title: s.q, lead: '', body: '', extra: '' }); lab.setFacts([]); return;
  }
  const vd = verdict(S.sg === 'yes', t);
  q.innerHTML = `<div class="dz-v" style="color:${vd.c}">${esc(vd.s)}</div><div class="dz-opts"><button class="dz-b go" data-act="sreset">${esc(t.again)}</button></div>`;
  lab.setReadout(s.eight, s.sub, s.pill, '#a58b62');
  lab.setState({ emo: S.sg === 'yes' ? '✅' : '👣', title: vd.s, lead: s.lead, body: '', extra: '' });
  lab.setFacts([{ emo: '🦕', ...t.facts.step }]);
}
render();
</script>
