}

  for (let i = 0; i < 8; i++) if (Math.abs(px - barCX(i)) <= G.slot / 2 && py >= pillYof(i) - 14 && py <= pillYof(i) + 40) return i;

  c.fillStyle = bg; circ(c, 0, 0, r); c.fill(); c.strokeStyle = '#16578a'; c.lineWidth = 1.6; c.stroke();
  c.save(); circ(c, 0, 0, r - 0.5); c.clip(); const bl = c.createLinearGradient(0, r * 0.1, 0, r); bl.addColorStop(0, 'rgba(255,255,255,.85)'); bl.addColorStop(1, 'rgba(225,245,255,.7)');
  c.fillStyle = bl; c.beginPath(); c.ellipse(0, r * 0.5, r * 0.62, r * 0.5, 0, 0, Math.PI * 2); c.fill(); c.restore();
  c.fillStyle = '#2a86c9'; c.strokeStyle = '#16578a'; c.lineWidth = 1.2; // wings
  [-1, 1].forEach((s) => { c.save(); c.translate(s * r * 0.92, r * 0.18); c.rotate(s * 0.45 - s * 0.25 * Math.sin(time * 9) * sg); c.beginPath(); c.ellipse(0, 0, r * 0.22, r * 0.45, 0, 0, Math.PI * 2); c.fill(); c.stroke(); c.restore(); });
  c.fillStyle = '#2f93d6'; c.strokeStyle = '#16578a'; c.lineWidth = 1.1; // tuft
  [-0.5, 0, 0.5].forEach((a) => { c.save(); c.translate(Math.sin(a) * r * 0.2, -r * 0.96); c.rotate(a); c.beginPath(); c.ellipse(0, -r * 0.16, r * 0.09, r * 0.24, 0, 0, Math.PI * 2); c.fill(); c.stroke(); c.restore(); });
  const ey = -r * 0.14, ex = r * 0.34;
  if (frE > 0.15) { // squinting eyes and angry brows
    c.strokeStyle = '#14213a'; c.lineWidth = Math.max(2, r * 0.12); c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-ex - r * 0.17, ey - r * 0.17); c.lineTo(-ex + r * 0.1, ey); c.lineTo(-ex - r * 0.17, ey + r * 0.17); c.stroke();
    c.beginPath(); c.moveTo(ex + r * 0.17, ey - r * 0.17); c.lineTo(ex - r * 0.1, ey); c.lineTo(ex + r * 0.17, ey + r * 0.17); c.stroke();
    c.lineWidth = Math.max(1.8, r * 0.09);
    c.beginPath(); c.moveTo(-ex - r * 0.28, ey - r * 0.38); c.lineTo(-ex + r * 0.2, ey - r * 0.24); c.stroke();
    c.beginPath(); c.moveTo(ex + r * 0.28, ey - r * 0.38); c.lineTo(ex - r * 0.2, ey - r * 0.24); c.stroke();
  } else [-ex, ex].forEach((px) => {
    c.fillStyle = '#fff'; circ(c, px, ey, r * 0.24); c.fill(); c.strokeStyle = '#16578a'; c.lineWidth = 1; c.stroke();
    c.fillStyle = '#14213a'; circ(c, px + r * 0.02, ey + r * 0.03, r * 0.135); c.fill();
    c.fillStyle = '#fff'; circ(c, px - r * 0.03, ey - r * 0.04, r * 0.055); c.fill();
  });
  c.fillStyle = frE > 0.15 ? 'rgba(255,90,90,.5)' : 'rgba(255,130,160,.45)'; [-1, 1].forEach((s) => { circ(c, s * r * 0.58, r * 0.2, r * 0.14); c.fill(); });
  const bk = c.createLinearGradient(0, r * 0.02, 0, r * 0.32); bk.addColorStop(0, '#ffc15a'); bk.addColorStop(1, '#ec8a24');
  c.fillStyle = bk; c.strokeStyle = '#b8620f'; c.lineWidth = 1.1;
  const open = sg ? 0.5 + 0.5 * Math.sin(time * 12) : 0;
  c.beginPath(); c.moveTo(-r * 0.15, r * 0.04); c.lineTo(r * 0.15, r * 0.04); c.lineTo(0, r * 0.2); c.closePath(); c.fill(); c.stroke();
  if (sg) { c.fillStyle = '#7a2020'; c.beginPath(); c.ellipse(0, r * 0.25, r * 0.1, r * 0.05 + r * 0.07 * open, 0, 0, Math.PI * 2); c.fill(); }
  c.restore();
  if (sg) for (let k = 0; k < 3; k++) { // singing notes
    const p = ((time * 0.7 + k / 3) % 1), nx = x + (k - 1) * r * 0.9 + Math.sin(time * 3 + k) * 4, ny = y - r * 1.3 - p * 36;
    c.save(); c.globalAlpha = Math.sin(p * Math.PI); c.font = `800 ${Math.round(r * 0.9)}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#ffe27a'; c.fillText(k % 2 ? '♫' : '♪', nx, ny); c.restore();
  }
}

// --- frame -------------------------------------------------------------------------------------------------
function frame(c, w, h, dt, time) {
  geo(w, h);
  const md = mode(), v = lab.view, sec = S.sec;
  rr(c, 0, 0, w, h, 20); c.fillStyle = lg(c, 0, 0, w, h, [[0, '#2b2340'], [1, '#14111f']]); c.fill();
  const lamp = c.createRadialGradient(w * 0.3, 0, 4, w * 0.3, 0, w * 0.9); lamp.addColorStop(0, 'rgba(255,214,140,.2)'); lamp.addColorStop(1, 'rgba(0,0,0,0)');
  c.save(); rr(c, 0, 0, w, h, 20); c.clip(); c.fillStyle = lamp; c.fillRect(0, 0, w, h); c.restore();
  const r = clamp(w * 0.06, 18, 28);
  if (md === 'bars') {
    drawXylo(c, dt, time);
    const bx = barCX(7) + G.slot * 0.05;
    drawBird(c, bx, bodyTop(bx) - r * 1.0 + 3, r, time);
    // echo: only a pulsing note while the tune plays; no light on the bars
    const e = sec ? null : v === 'echo' ? S.e : null;
    if (e && e.playing && !e.card) {
      const p = clamp01(1 - (time - e.pulse) / 0.5), sc = 1 + 0.35 * p * p;
      c.save(); c.translate(w * 0.4, 108); c.scale(sc, sc); circ(c, 0, 0, 24); c.fillStyle = 'rgba(10,12,22,.8)'; c.fill(); c.strokeStyle = 'rgba(255,226,122,.7)'; c.lineWidth = 1.5; c.stroke();
      c.fillStyle = '#ffe27a'; c.font = `800 28px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('♪', 0, 2); c.restore();
    }
    if (e && e.card) drawCard(c, e, w * 0.4, 108);
    if (sec === 'jam') drawBeat(c, w, time);
  } else {
    drawKeys(c, dt, time);
    drawBird(c, w * 0.5, G.ky - 90, r * 1.15, time);
    if (sec === 'move' && S.m.card) drawCard(c, S.m, w / 2, G.ky - 150);
    if (sec === 'move' && S.m.playing && !S.m.card) {
      const p = clamp01(1 - (time - S.m.pulse) / 0.5), sc = 1 + 0.35 * p * p;
      c.save(); c.translate(w * 0.22, G.ky - 90); c.scale(sc, sc); circ(c, 0, 0, 22); c.fillStyle = 'rgba(10,12,22,.8)'; c.fill(); c.strokeStyle = 'rgba(255,226,122,.7)'; c.lineWidth = 1.5; c.stroke();
      c.fillStyle = '#ffe27a'; c.font = `800 26px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('♪', 0, 2); c.restore();
    }
  }
}
function drawCard(c, e, cx, y) { // no sound: the tune appears syllable by syllable instead
  const t = T[lang], items = e.pat.slice(0, e.cardN).map((k) => t.syl[k]);
  c.save(); c.font = `800 18px ${FONT}`;
  const widths = items.map((s) => c.measureText(s).width + 22), total = widths.reduce((a, b) => a + b + 6, -6);
  let x = clamp(cx - total / 2, 6, Math.max(6, G.w - total - 6));
  items.forEach((s, i) => {
    const pw = widths[i];
    rr(c, x, y - 17, pw, 34, 17); c.fillStyle = 'rgba(10,12,22,.88)'; c.fill(); c.strokeStyle = 'rgba(255,226,122,.75)'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = '#ffe27a'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s, x + pw / 2, y + 1); x += pw + 6;
  });
  c.restore();
}
function drawBeat(c, w, time) { // the band: four beats, do - so - do - so
  const J = S.jam, age = time - J.beatT, bump = J.on ? Math.max(0, 1 - age / 0.25) : 0, cx = w * 0.4, cy = 108;
  for (let i = 0; i < 4; i++) {
    const on = J.on && (J.n - 1) % 4 === i, rad = on ? 8 + bump * 3 : 6;
    c.save(); c.shadowColor = on ? '#ffe27a' : 'transparent'; c.shadowBlur = on ? 12 : 0;
    circ(c, cx - 33 + i * 22, cy, rad); c.fillStyle = on ? '#ffe27a' : 'rgba(255,255,255,.22)'; c.fill(); c.restore();
  }
  pill(c, '♪ 90', cx, cy + 28, { sz: 12 });
}
const cv = $('cv');
canvasLoop(cv, frame);

// --- pointer input -----------------------------------------------------------------------------------------
let drag = null;
cv.addEventListener('pointerdown', (ev) => {
  const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top, v = lab.view, sec = S.sec;
  if (mode() === 'keys') {
    const m = keyAt(px, py); if (m === null) return;
    const gate = !sec && v === 'keys' && S.k.guess === null; // before the guess the bird stays neutral
    strike(100 + m, m, { noReact: gate });
    if (sec === 'move' && BCLS[m] !== undefined) echoTap(S.m, BCLS[m], 100 + m);
    return;
  }
  const canLift = !sec && v === 'test' && S.t.ran8 && S.t.phase !== 'running';
  if (canLift) { const li = liftTargetAt(px, py); if (li >= 0) { toggleOut(li); return; } }
  const i = barAt(px, py); if (i < 0) return;
  strike(i, XM[i]);
  if (!sec && v === 'echo') echoTap(S.e, CLS[i], i);
  if (canLift) { drag = { i, y0: py }; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ } }
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const py = ev.clientY - cv.getBoundingClientRect().top;
  if (py - drag.y0 < -24) { const i = drag.i; drag = null; if (S.t.phase !== 'running' && !S.t.out.has(i)) toggleOut(i); }
});
['pointerup', 'pointercancel'].forEach((e) => cv.addEventListener(e, () => { drag = null; }));
render();
</script>
