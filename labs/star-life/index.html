const c01 = (x) => Math.min(1, Math.max(0, x));

const split2 = (c, text, maxW) => {
  c.save(); c.font = '800 12px Nunito, sans-serif';

const FR = [0.14, 0.5, 0.2, 0.16];
function timeline(c, w, y, col, mainText, marker) {
  const t = T[lang], x0 = 14, W = w - 28, G = 3, H = 28, usable = W - 3 * G, xs = [];

  c.restore();
  if (lit > 0.01) { // a soft pulse around the heart
    c.fillStyle = rgba('#ff6b4a', 0.25 * lit * (0.6 + 0.4 * Math.sin(time * 5))); c.beginPath(); c.arc(G.chest[0], G.chest[1], 0.1 * H, 0, 6.283); c.fill();
  }
}
function drawSN(c, x, y, r, time, fade, calm) {
  const g = c.createRadialGradient(x, y, 0, x, y, r * 4);
  g.addColorStop(0, `rgba(255,240,200,${0.85 * fade})`); g.addColorStop(0.3, `rgba(255,150,70,${0.35 * fade})`); g.addColorStop(1, 'rgba(255,100,60,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r * 4, 0, 6.283); c.fill();
  c.save(); c.translate(x, y); c.rotate(time * 0.25); c.globalAlpha = fade;
  for (let i = 0; i < 8; i++) {
    c.rotate(Math.PI / 4); const len = r * (i % 2 ? 2.4 : 3.6), lg = c.createLinearGradient(0, 0, len, 0);
    lg.addColorStop(0, 'rgba(255,230,180,.9)'); lg.addColorStop(1, 'rgba(255,200,120,0)');
    c.fillStyle = lg; c.beginPath(); c.moveTo(0, -r * 0.18); c.lineTo(len, 0); c.lineTo(0, r * 0.18); c.closePath(); c.fill();
  }
  c.restore();
  c.globalAlpha = fade; c.fillStyle = '#fff6dc'; c.beginPath(); c.arc(x, y, r * 0.55, 0, 6.283); c.fill(); c.globalAlpha = 1;
  if (!calm) for (let k = 0; k < 2; k++) {
    const f = ((time * 0.5 + k * 0.5) % 1);
    c.strokeStyle = `rgba(255,220,160,${(1 - f) * 0.6})`; c.lineWidth = 2; c.beginPath(); c.arc(x, y, r * (1.2 + 2.2 * f), 0, 6.283); c.stroke();
  }
}
function drawDust(c, w, h, dt, time) {
  const t = T[lang], mn = Math.min(w, h), asked = S.dAns !== null;
  const SN = { x: w * 0.2, y: h * 0.27, r: mn * 0.075 }, NB = { x: w * 0.64, y: h * 0.33, r: mn * 0.2 };
  const yh = h * 0.93, G = childGeo(w * 0.5, h * 0.955, h * 0.34);
  if (S.dPlaying) { S.dT = Math.min(DUR, S.dT + dt); if (S.dT >= DUR) { S.dPlaying = false; render(); } }
  const T_ = S.dStarted ? S.dT : 0, st = !S.dStarted ? 0 : T_ < 3 ? 1 : T_ < 6.2 ? 2 : T_ < 9.4 ? 3 : 4;
  if (st !== S.dSt) { S.dSt = st; render(); }
  // ground
  c.save(); c.beginPath(); c.arc(w / 2, yh + w * 0.9, w * 0.9, 0, 6.283);
  const gg = c.createLinearGradient(0, yh, 0, h); gg.addColorStop(0, '#26386f'); gg.addColorStop(1, '#0b1024');
  c.fillStyle = gg; c.fill(); c.shadowColor = 'rgba(120,170,255,.7)'; c.shadowBlur = 14; c.strokeStyle = 'rgba(140,185,255,.5)'; c.lineWidth = 1.5; c.stroke(); c.restore();
  // nebula
  const collapse = ease((T_ - 6.2) / 2.6), sc = 1 - 0.7 * collapse;
  let A = T_ < 3 ? 0.16 : T_ < 6.2 ? 0.16 + 0.5 * ease((T_ - 3) / 3.2) : 0.66;
  if (T_ > 8.6) A = lrp(0.66, 0.2, ease((T_ - 8.6) / 1.6));
  for (const b of NBL) {
    const bx = NB.x + Math.cos(b.a + time * 0.08) * NB.r * b.d * sc, by = NB.y + Math.sin(b.a + time * 0.08) * NB.r * b.d * 0.7 * sc, br = NB.r * b.z * sc * (T_ > 6.2 ? 1.1 : 1);
    const g = c.createRadialGradient(bx, by, 0, bx, by, br + 1); g.addColorStop(0, rgba(b.c, A * 0.9)); g.addColorStop(1, rgba(b.c, 0));
    c.fillStyle = g; c.beginPath(); c.arc(bx, by, br + 1, 0, 6.283); c.fill();
  }
  // supernova
  drawSN(c, SN.x, SN.y, SN.r, time, asked ? lrp(1, 0.3, ease(T_ / 3)) : 0.5, !asked || st > 0);
  // new sun and planets
  if (T_ >= 8.4) {
    const pa = ease((T_ - 9.2) / 1.2);
    c.save(); c.globalAlpha = pa * 0.5; c.strokeStyle = 'rgba(200,215,255,.5)'; c.lineWidth = 1;
    for (const f of [0.45, 0.72, 1]) { c.beginPath(); c.ellipse(NB.x, NB.y, mn * 0.3 * f, mn * 0.085 * f, 0, 0, 6.283); c.stroke(); }
    c.restore();
    const drawPl = (back) => PL.forEach((p, j) => {
      const [x, y, s] = planetPos(j, time, NB, mn); if ((s < 0) !== back) return;
      const g = c.createRadialGradient(x - p.r * 0.35, y - p.r * 0.35, 1, x, y, p.r + 0.5);
      g.addColorStop(0, mix(p.c, '#ffffff', 0.6)); g.addColorStop(1, mix(p.c, '#000000', 0.35));
      c.globalAlpha = pa; c.fillStyle = g; c.beginPath(); c.arc(x, y, p.r * 0.8 + 1, 0, 6.283); c.fill(); c.globalAlpha = 1;
    });
    drawPl(true);
    drawStar(c, NB.x, NB.y, mn * 0.045 * easeBack((T_ - 8.4) / 1.4), '#fff0c0', time);
    drawPl(false);
  }
  // atoms
  if (st >= 1) for (const a of ATOMS) {
    const lt = T_ - a.d, P0 = [SN.x, SN.y];
    const ang = Math.atan2(NB.y - SN.y, NB.x - SN.x) + a.a1, dist = mn * (0.28 + 0.2 * a.s1);
    const P1 = [SN.x + Math.cos(ang) * dist, SN.y + Math.sin(ang) * dist * 0.8];
    const P2 = [NB.x + (a.u - 0.5) * NB.r * 1.2 * (T_ > 6.2 ? sc : 1), NB.y + (a.v - 0.5) * NB.r * 0.9 * (T_ > 6.2 ? sc : 1)];
    const pj = planetPos(a.k % 3, time, NB, mn), P3 = [pj[0], pj[1]];
    const sp = a.k === 2 ? G.chest : a.k === 0 ? G.head : a.k === 1 ? G.belly : G.bones[a.j];
    let x, y;
    if (lt < 3) { const e = easeOut(lt / 3); x = lrp(P0[0], P1[0], e); y = lrp(P0[1], P1[1], e); }
    else if (lt < 6.2) { const e = ease((lt - 3) / 3.2); x = lrp(P1[0], P2[0], e) + Math.sin(time * 2 + a.u * 9) * 3 * (1 - e); y = lrp(P1[1], P2[1], e) + Math.cos(time * 2 + a.v * 9) * 3 * (1 - e); }
    else if (lt < 9.4) { const e = ease((lt - 6.2) / 3.2); x = lrp(P2[0], P3[0], e); y = lrp(P2[1], P3[1], e); }
    else { const f = ease((lt - 9.4) / 3.0); x = lrp(P3[0], sp[0], f); y = lrp(P3[1], sp[1], f) - Math.sin(Math.PI * f) * mn * 0.08; }
    const fadeOut = 1 - ease((lt - 12.6) / 0.9), al = c01(lt / 0.4) * fadeOut;
    if (al <= 0.01) continue;
    const r = lt >= 9.4 ? lrp(9, 5, ease((lt - 9.4) / 3)) : 9, col = ATC[a.k];
    c.save(); c.globalAlpha = al;
    const g = c.createRadialGradient(x - r * 0.3, y - r * 0.3, 1, x, y, r);
    g.addColorStop(0, mix(col, '#ffffff', 0.7)); g.addColorStop(1, mix(col, '#000000', 0.3));
    c.shadowColor = col; c.shadowBlur = 8; c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill(); c.shadowBlur = 0;
    if (r > 7.5) { c.fillStyle = a.k === 3 || a.k === 0 ? '#12162a' : '#fff'; c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ATL[a.k], x, y + 1); }
    c.restore();
  }
  // the child
  const lit = ease((T_ - 10.2) / 3);
  drawChild(c, G, lit, time);
  if (lit > 0.7) {
    const al = c01((lit - 0.7) * 3.3), maxW = w / 2 - G.H * 0.15;
    pill(c, w, split2(c, t.ironLbl, maxW), G.cx + 0.22 * G.H, G.chest[1] - 4, { align: 'left', alpha: al, stroke: 'rgba(255,107,74,.6)' });
    pill(c, w, split2(c, t.calLbl, maxW), G.cx - 0.26 * G.H, G.yf - 0.2 * G.H, { align: 'right', alpha: al, stroke: 'rgba(246,240,212,.6)' });
  }
  if (asked && st === 0) pill(c, w, t.dHint, SN.x, SN.y + SN.r * 3.4 + 12, { align: 'center' });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  drawSpace(c, w, h, time);
  const v = lab.view;
  if (v === 'mass') drawMass(c, w, h, dt, time);
  else if (v === 'life') { if (S.secB) drawSunFuture(c, w, h, dt, time); else drawLife(c, w, h, dt, time); }
  else drawDust(c, w, h, dt, time);
});

// --- one render per change: controls, readout, gauge and the state card ----------------------------------------
function gauge(show, frac) {
  $('gauge').style.visibility = show ? 'visible' : 'hidden';
  if (show) lab.setGauge(frac, GTICKS, T[lang].yAxis);
}
function render() {
  const t = T[lang], v = lab.view;
  $('stM').hidden = v !== 'mass'; $('stL').hidden = v !== 'life'; $('stD').hidden = v !== 'dust';
  if (v === 'mass') renderMass(t); else if (v === 'life') renderLife(t); else renderDust(t);
}

function renderMass(t) {
  const m = S.mass, life = LIFE(m), ans = S.mAns !== null, ci = colName(m), sl = $('stMSl');
  lab.setGlow('rgba(224, 138, 60, .26)');
  $('stMAsk').hidden = ans;
  if (!ans) $('stMAsk').innerHTML = askHTML(t.mAsk.q, t.mAsk.opts, 'ansM');
  sl.disabled = !ans; sl.min = S.secA ? '-1' : String(Math.log10(0.2)); sl.value = String(Math.log10(m));
  $('stLo').textContent = t.lo; $('stHi').textContent = t.hi;
  $('stSecA').innerHTML = secChip('a', '🔴', S.secA);
  if (!ans) {
    lab.setReadout(`${fmtM(m)} ☀️`, t.surf(t.col[ci]), '', MC); gauge(false, 0);
    lab.setState({ emo: '🤔', title: t.mAsk.q, lead: '', body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  lab.setReadout(`${fmtM(m)} ☀️`, t.surf(t.col[ci]), t.lives(yearsText(life)), MC); gauge(true, gf(life));
  let st;
  if (S.secA) {
    const ratio = life / UNIVERSE;
    st = ratio >= 1 ? { emo: '🔴', title: t.secrets.a[0], lead: t.secA.over(yearsText(life), ruTimes(sig2(ratio))), body: t.secA.overB }
      : { emo: '🔴', title: t.secrets.a[0], lead: t.secA.under(yearsText(life)), body: t.secA.underB };
  } else if (S.mVerdict) {
    const l1 = LIFE(1), r = sig2(l1 / LIFE(10));
    const rr = ruTimes(r);
    st = { emo: S.mAns === 2 ? '✅' : '🤔', title: S.mAns === 2 ? t.mAsk.right : t.mAsk.wrong, lead: t.mAsk.reveal(yearsText(LIFE(10)), yearsText(l1), rr), body: t.mAsk.body };
  } else {
    const k = m < 0.6 ? 0 : m < 1.6 ? 1 : m < 8 ? 2 : 3, rat = life / LIFE(1), longer = rat >= 1, f = sig2(longer ? rat : 1 / rat);
    const cmpT = Math.abs(Math.log(rat)) < 0.1 ? t.same : t.cmp(ruTimes(f), longer);
    st = { emo: t.cls[k][0], title: t.cls[k][1], lead: t.cls[k][2], body: `${t.lives(yearsText(life))[0].toUpperCase()}${t.lives(yearsText(life)).slice(1)}. ${cmpT}` };
  }
  lab.setState({ ...st, extra: '' });
  lab.setFacts(S.secA ? [] : t.facts.mass);
}

function renderLife(t) {
  const m = STARS[S.star], life = LIFE(m), kind = endOf(m), known = S.mAns !== null;
  lab.setGlow('rgba(122, 92, 214, .28)');
  $('stLAsk').hidden = !S.lAsking || S.secB;
  $('stLMain').hidden = S.secB; $('stSunPanel').hidden = !S.secB;
  if (S.lAsking && !S.secB) $('stLAsk').innerHTML = askHTML(t.lAsk.q(m), t.lAsk.opts, 'ansL');
  $('stChips').innerHTML = Object.keys(STARS).map((k) => `<button class="chip ${k === S.star ? 'on' : ''}" data-act="star" data-k="${k}">${STAR_EMO[k]} ${esc(t.stars[k])} · ${fmtM(STARS[k])}</button>`).join('');
  const pb = $('stPlay');
  pb.textContent = S.playing ? t.going : S.started ? t.again : t.play;
  pb.disabled = S.playing || S.lAsking;
  $('stSecB').innerHTML = secChip('b', '🌞', S.secB);
  $('stBLo').textContent = t.sun.ends[0]; $('stBHi').textContent = t.sun.ends[1];
  $('stBPlay').textContent = t.sun.play;
  if (S.secB) {
    const R = sunR(S.sunT), stg = S.sunT < 0.02 ? 0 : [0, 1].some((j) => planetStatus(j, R) === 2) ? (S.sunT >= 0.97 ? 3 : 2) : 1;
    const s = t.sun.s[stg], lines = PL.map((_, j) => `${t.sun.planets[j]}: ${t.sun.status[planetStatus(j, R)]}`).join(' · ');
    $('stBSl').value = Math.round(S.sunT * 1000); gauge(false, 0);
    lab.setReadout(`×${dec(sig2(R / R_NOW))}`, t.sun.wider, '', LC);
    lab.setState({ emo: s[0], title: s[1], lead: s[2], body: lines, extra: `<div class="st-note">${esc(t.sun.scale)}</div>` });
    lab.setFacts([]);
    return;
  }
  const mm = fmtM(m);
  if (S.lAsking) {
    lab.setReadout(`${mm} ☀️`, t.stars[S.star], '', LC); gauge(false, 0);
    lab.setState({ emo: '🤔', title: t.lAsk.q(m), lead: '', body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const done = S.started && !S.playing && S.t >= TOTAL, ph = S.started ? phaseAt(S.t) : null;
  let pill = '';
  if (done) pill = t.endName[kind];
  else if (S.started && known) pill = `⏳ ${yearsText(lifeYears(ph, life))}`;
  lab.setReadout(`${mm} ☀️`, t.stars[S.star], pill, LC);
  if (S.started && known) gauge(true, gf(lifeYears(ph, life))); else gauge(false, 0);
  let st;
  if (!S.started) st = { emo: STAR_EMO[S.star], title: t.stars[S.star], lead: t.idle(m) };
  else {
    const k = ph.k === 'giant' ? (m < 0.5 ? 'giantD' : m < 8 ? 'giant' : 'giantS') : ph.k === 'end' ? kind : ph.k, x = t.ph[k];
    st = { emo: x[0], title: x[1], lead: x[2] };
    if (ph.k === 'end' && S.lAns !== null && S.verdictFor === S.star && m >= 8) {
      st.lead = `${S.lAns === 1 ? t.lAsk.right : t.lAsk.wrong} ${st.lead}`;
    }
  }
  lab.setState({ ...st, body: '', extra: '' });
  lab.setFacts(S.lAns !== null ? t.facts.life : []);
}

function renderDust(t) {
  const ans = S.dAns !== null, st = S.dSt;
  lab.setGlow('rgba(44, 138, 122, .28)');
  $('stDAsk').hidden = ans;
  if (!ans) $('stDAsk').innerHTML = askHTML(t.dAsk.q, t.dAsk.opts, 'ansD');
  $('stLeg').hidden = !ans;
  $('stLeg').innerHTML = ATC.map((c, i) => `<span><i style="background:${c}"></i>${ATL[i]} ${esc(t.atoms[i])}</span>`).join('');
  const b = $('stDBtn');
  b.hidden = !ans; b.disabled = S.dPlaying; b.textContent = S.dStarted && !S.dPlaying ? t.dAgain : t.dBtn;
  if (!ans) {
    lab.setReadout('?', '', '', DC);
    lab.setState({ emo: '🤔', title: t.dAsk.q, lead: '', body: '', extra: '' }); lab.setFacts([]); gauge(false, 0);
    return;
  }
  gauge(false, 0);
  const d = t.d[st];
  lab.setReadout(`${st}/4`, st === 0 ? '' : d[1], '', DC);
  lab.setState(st === 0 ? { emo: S.dAns === 0 ? '✅' : '🤔', title: S.dAns === 0 ? t.dAsk.right : t.dAsk.wrong, lead: d[2], body: '', extra: '' } : { emo: d[0], title: d[1], lead: d[2], body: '', extra: '' });
  lab.setFacts(t.facts.dust);
}
render();
</script>
