  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'card') chooseCard(+b.dataset.i);
  else if (a === 'guess') { if (S.busy) return; S.guess = b.dataset.g; sfx.tick(); render(); }
  else if (a === 'ask') ask();
  else if (a === 'again') { resetInterview(); render(); }
  else if (a === 'undo') undo();
  else if (a === 'restart') restartSort();
  else if (a === 'check') checkSort();
  else if (a === 'fix') fixSort();
  else if (a === 'opt') choose(+b.dataset.j);
  else if (a === 'next') nextRound();
  else if (a === 'gAgain') restartG();
  else if (a === 'twq') twAsk(+b.dataset.q);
  else if (a === 'twnew') { newTw(); sfx.click(); render(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'a') newTw(); else S.turn = mkG(); sfx.click(); }
  }
  render();
});

// --- render -----------------------------------------------------------------------------------------------
const hl = (q, k) => { const i = k ? q.indexOf(k) : -1; return i < 0 ? esc(q) : `${esc(q.slice(0, i))}<mark>${esc(k)}</mark>${esc(q.slice(i + k.length))}`; };
let lastPanel = null, lastBub = '';
function render() {
  const t = T[lang], u = t.ui;
  if (S.v !== lab.view) { S.v = lab.view; S.sec = null; }
  if (S.sec === 'a' && !S.tw) newTw();
  const m = mode();
  lab.setGlow('rgba(240, 170, 80, .22)');
  const secRow = () => {
    const open = secret.unlocked();
    const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    return `<div class="qz-sec">${sc('a', '🔢')}${sc('b', '🔄')}</div>`;
  };

  // overlay pieces
  const bubText = bubbleText(m, t);
  const bub = $('qBub');
  if (bubText) {
    if (bubText !== lastBub) { bub.textContent = bubText; bub.classList.remove('pop'); void bub.offsetWidth; bub.classList.add('pop'); }
    bub.hidden = false; lastBub = bubText;
  } else { bub.hidden = true; lastBub = ''; }
  const showPanel = m === 'int' && S.panel !== null && !S.busy;
  const panel = $('qPanel');
  if (showPanel) {
    const st = t.int.stories[S.panel]; $('qPt').textContent = st.t; $('qPx').textContent = st.x;
    if (lastPanel !== S.panel) { drawPanelIcon(S.panel); panel.hidden = false; panel.classList.remove('in'); void panel.offsetWidth; panel.classList.add('in'); }
    panel.hidden = false;
  } else { panel.hidden = true; panel.classList.remove('in'); }
  lastPanel = showPanel ? S.panel : null;
  const card = $('qCard'), sortOn = m === 'sort';
  card.hidden = !sortOn; $('qDropC').hidden = !sortOn; $('qDropO').hidden = !sortOn; $('qGrid').hidden = m !== 'tw';

  let h = '', st, readout, facts = true;
  if (m === 'int') {
    const n = S.used.filter(Boolean).length, all = n === 8, ti = t.int;
    const cardsHtml = ti.cards.map((cd, i) => `<button class="qz-c ${S.sel === i ? 'on' : ''}" data-act="card" data-i="${i}" ${S.used[i] || S.busy ? 'disabled' : ''}>${esc(cd.q)}</button>`).join('');
    h += `<div class="qz-sel">${S.sel !== null ? `“${esc(ti.cards[S.sel].q)}”` : all ? '' : esc(u.pick)}</div>`;
    if (S.sel !== null) {
      h += `<div class="qz-pred"><button class="chip ${S.guess === 'short' ? 'on' : ''}" data-act="guess" data-g="short" ${S.busy ? 'disabled' : ''}>${esc(u.chipShort)}</button>
        <button class="chip ${S.guess === 'story' ? 'on' : ''}" data-act="guess" data-g="story" ${S.busy ? 'disabled' : ''}>${esc(u.chipStory)}</button>
        <button class="btn" data-act="ask" ${S.guess === null || S.busy ? 'disabled' : ''}>${esc(u.ask)}</button></div>`;
    }
    h += `<div class="qz-cards">${cardsHtml}</div>`;
    if (all) h += `<div class="qz-btns"><button class="btn" data-act="again">${esc(u.again)}</button></div>`;
    if (S.sel !== null || S.busy) st = { emo: ti.guess[0], title: ti.guess[1], lead: ti.guess[2], body: '' };
    else if (S.shown) {
      const cd = ti.cards[S.shown.i], verdict = S.shown.right ? ti.right : ti.miss, line = S.shown.open ? ti.story : ti.short;
      if (all) st = { emo: ti.end[0], title: ti.end[1], lead: ti.end[2], body: `${verdict} ${cd.why}` };
      else st = { emo: S.shown.open ? '📖' : '💬', title: verdict, lead: line, body: cd.why, extra: n >= 4 ? `<p style="margin:8px 0 0"><b>${esc(ti.kinds[0])}.</b> ${esc(ti.kinds[1])}</p>` : '' };
    } else st = { emo: ti.start[0], title: ti.start[1], lead: ti.start[2], body: '' };
    readout = [`${S.stories}/4`, ti.sub, `❓ ${n}/8`, '#f0b84a'];
  } else if (m === 'sort') {
    const ts = t.sort, placed = S.order.length;
    $('qDropC').disabled = $('qDropO').disabled = S.checked || !S.deck.length;
    const nc = S.order.filter((i) => S.put[i] === 'c').length, no = placed - nc;
    $('qDropC').innerHTML = `<i>${nc ? '×' + nc : ''}</i><b>🔒 ${esc(u.closed)}</b>`; $('qDropO').innerHTML = `<i>${no ? '×' + no : ''}</i><b>🔓 ${esc(u.open)}</b>`;
    const nOk = S.res ? S.res.filter(Boolean).length : 0;
    if (S.checked) { card.className = 'qz-card done'; card.innerHTML = `<b>${nOk}/8</b>${esc(ts.subRight)}`; }
    else if (!S.deck.length) { card.className = 'qz-card done'; card.innerHTML = `<b>✓</b>${esc(ts.allIn[1])}`; }
    else { card.className = 'qz-card' + (card.classList.contains('new') ? ' new' : ''); card.textContent = ts.cards[S.deck[0]].q; }
    h += `<div class="qz-legend">${esc(u.legend)}</div>`;
    h += `<div class="qz-btns"><button class="btn ghost" data-act="undo" ${S.checked || !placed ? 'disabled' : ''}>${esc(u.undo)}</button>
      <button class="btn ghost" data-act="restart" ${!placed ? 'disabled' : ''}>${esc(u.restart)}</button>
      <button class="btn" data-act="check" ${S.checked || S.deck.length ? 'disabled' : ''}>${esc(u.check)}</button></div>`;
    if (S.checked) {
      h += '<div class="qz-rows">' + ts.cards.map((cd, i) => {
        const ok = S.res[i], kind = SORT_ANS[i] === 'c' ? u.closed : u.open;
        return `<div class="qz-row ${ok ? 'ok' : 'bad'}"><span class="mk">${ok ? '✓' : '✗'}</span><div><div class="qq">${hl(cd.q, cd.k)}</div>
          <div class="qs"><b>${esc(kind)}.</b>${ok ? '' : ' ' + esc(cd.why)}</div></div></div>`;
      }).join('') + '</div>';
      if (nOk < 8) h += `<div class="qz-btns"><button class="btn" data-act="fix">${esc(u.fix)}</button></div>`;
      st = { emo: nOk === 8 ? '🏅' : '🔍', title: ts.resT(nOk), lead: nOk === 8 ? ts.res8 : ts.resX, body: '' };
    } else if (!S.deck.length) st = { emo: ts.allIn[0], title: ts.allIn[1], lead: ts.allIn[2], body: '' };
    else st = { emo: ts.start[0], title: ts.start[1], lead: ts.start[2], body: '' };
    readout = S.checked ? [`${nOk}/8`, ts.subRight, '', '#f0b84a'] : [`${placed}/8`, ts.sub, '', '#f0b84a'];
  } else if (m === 'dig' || m === 'tn') {
    const g = G(), turn = m === 'tn', tx = turn ? t.tn : t.dig, rounds = tx.rounds, R = rounds[g.r], N = nRounds(), opts = optsOf();
    const sayText = turn ? R.q : R.say;
    h += `<div class="qz-say"><small>${esc(turn ? tx.say : u.say)}</small>“${esc(sayText)}”</div>`;
    h += '<div class="qz-opts">' + opts.map((o, j) => `<button class="qz-o ${g.crossed.has(j) ? 'bad' : ''} ${g.solved && o.k === 'good' ? 'good' : ''}" data-act="opt" data-j="${j}" ${g.solved || g.crossed.has(j) ? 'disabled' : ''}>${esc(o.t)}</button>`).join('') + '</div>';
    const last = g.r === N - 1;
    if (g.solved) h += `<div class="qz-btns">${last ? `<button class="btn" data-act="gAgain">${esc(u.again)}</button>` : `<button class="btn" data-act="next">${esc(u.next)}</button>`}</div>`;
    const done = g.r + (g.solved ? 1 : 0);
    if (g.solved) {
      if (last) st = { emo: tx.end[0], title: tx.end[1], lead: turn ? tx.end[2] : `${tx.first(g.firsts)} ${tx.end[2]}`, body: '' };
      else st = { emo: '✅', title: tx.right, lead: tx.rightL, body: '' };
    } else if (g.last) st = { emo: '🙅', title: t.int.miss, lead: turn ? tx.wrong : tx[g.last], body: '' };
    else st = { emo: tx.start(g.r + 1)[0], title: tx.start(g.r + 1)[1], lead: tx.start(g.r + 1)[2], body: '' };
    readout = [`${done}/${N}`, tx.sub, '', '#f0b84a'];
  } else if (m === 'tw') {
    const g = S.tw, tw = t.tw;
    $('qGrid').innerHTML = tw.names.map((nm, i) => `<button class="qz-tile ${!g.alive.has(i) ? 'out' : ''} ${g.found && i === g.target ? 'win' : ''}" data-i="${i}" ${g.found ? 'disabled' : ''}><em>${EMO[i]}</em>${esc(nm)}</button>`).join('');
    h += `<div class="qz-log">${g.asked.map((a) => `<div>${esc(tw.qs[a.q])} → <b>${esc(a.ans ? tw.yes : tw.no)}</b></div>`).join('')}</div>`;
    h += '<div class="qz-opts">' + tw.qs.map((q, i) => `<button class="qz-o" data-act="twq" data-q="${i}" ${g.found || g.asked.some((a) => a.q === i) ? 'disabled' : ''}>${esc(q)}</button>`).join('') + '</div>';
    h += `<div class="qz-btns"><button class="btn ghost" data-act="twnew">${esc(tw.newG)}</button></div>`;
    if (g.found) st = { emo: tw.found(tw.names[g.target], g.nq, g.ng)[0], title: tw.found(tw.names[g.target], g.nq, g.ng)[1], lead: tw.found(tw.names[g.target], g.nq, g.ng)[2], body: '' };
    else if (g.last && g.last.t === 'w') st = { emo: tw.wrong[0], title: tw.wrong[1], lead: tw.wrong[2], body: '' };
    else if (g.alive.size === 1) st = { emo: tw.one[0], title: tw.one[1], lead: tw.one[2], body: '' };
    else if (g.last && g.last.t === 'q') st = { emo: '💬', title: `${tw.qs[g.last.q]} ${g.last.ans ? tw.yes : tw.no}`, lead: `${g.alive.size} ${tw.left}`, body: '' };
    else st = { emo: tw.start[0], title: tw.start[1], lead: tw.start[2], body: '' };
    readout = [`${g.alive.size}`, tw.left, `${tw.askedL}: ${g.nq} · ${tw.guessL}: ${g.ng}`, '#f0b84a'];
  }
  h += secRow();
  $('qzCtrl').innerHTML = h;
  lab.setReadout(...readout);
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body ?? '', extra: st.extra ?? '' });
  if (facts) { const v = lab.view; lab.setFacts([{ emo: ['🗝️', '🔢', '📰'][['int', 'sort', 'dig'].indexOf(v)], text: t.facts[v], src: SRC[v] }]); }
}
function bubbleText(m, t) {
  if (m === 'int') return S.bubI !== null && !S.busy ? t.int.cards[S.bubI].a : '';
  if (m === 'dig') { const g = S.dig, R = t.dig.rounds[g.r]; return g.solved ? R.reply : R.say; }
  if (m === 'tn') { const g = S.turn, R = t.tn.rounds[g.r]; return g.solved ? R.opts[R.ok] : R.q; }
  if (m === 'tw') { const g = S.tw; return g.found ? t.tw.yes : g.last && g.last.t === 'q' ? (g.last.ans ? t.tw.yes : t.tw.no) : t.tw.think; }
  return '';
}
render();
</script>
