    lab.setReadout(`${S.g1} %`, b.valPre, '', '#9fbf8f');
    lab.setState({ emo: '🗺️', title: b.preTitle, lead: b.preLead(nf(AREA0)), body: b.preBody, extra: `<div class="tr-fine">${esc(b.fineA)}</div>` });
    lab.setFacts(t.facts.b0);
  } else {
    lab.setReadout(`${sh} %`, b.valSub(nf(AREA1), nf(AREA0)), '1920', '#9fbf8f');
    lab.setState({ emo: '✂️', title: b.title(sh), lead: b.lead(nf(AREA1), nf(AREA0), ps), body: b.dens(Math.round(POP1 / AREA1), Math.round(POP0 / AREA0)), extra: `<div class="tr-fine">${esc(b.fine)}</div>` });
    lab.setFacts(t.facts.b1);
  }
}
function renderPeople(t) {
  const p = t.p, done = S.done2, top = REGS.find((r) => r.id === REG_TOP), mx = Math.max(...REGS.map((r) => r.p));
  lab.setGlow('rgba(227, 195, 119, .26)');
  $('q2').textContent = p.q;
  $('ch2').innerHTML = REGS.map((r) => chipHtml(p.reg[r.id], { act: 'pick2', k: r.id, cls: done ? (r.id === REG_TOP ? 'good' : r.id === S.pick2 ? 'bad' : 'dim') : S.pick2 === r.id ? 'on' : '', dis: done })).join('');
  $('act2').innerHTML = done ? chipHtml(t.again, { act: 'again2' }) + chipHtml(p.modes[0], { act: 'mode2', k: 'n', cls: S.mode2 === 'n' ? 'on' : '' }) + chipHtml(p.modes[1], { act: 'mode2', k: 'p', cls: S.mode2 === 'p' ? 'on' : '' }) : goHtml(t.check, 'go2', !S.pick2);
  if (!done) {
    lab.setReadout('?', p.valPre, '', '#e3c377');
    lab.setState({ emo: '👥', title: p.preTitle, lead: S.pick2 ? p.pick(p.reg[S.pick2]) : p.preLead, body: p.preBody, extra: '' });
    lab.setFacts(t.facts.p0);
  } else {
    lab.setReadout(t.fm(REG_TOT / 1e6), p.valSub, '', '#e3c377');
    const sel = REGS.find((r) => r.id === S.sel2), fine = `<div class="tr-fine">${esc(p.fine)}</div>`;
    if (sel) lab.setState({ emo: '🔎', title: p.full[sel.id], lead: p.selLead(nf(sel.hu), pf(sel.p)), body: p.selBody(sel.oth.map(([k, x]) => `${p.lg[k]} ${pf(x)} %`).join(', ')), extra: fine });
    else lab.setState({ emo: S.pick2 === REG_TOP ? '✅' : '🤔', title: S.pick2 === REG_TOP ? p.ok : p.no, lead: p.lead(p.full[REG_TOP], nf(top.hu)), body: p.body(pf((REG_TOT / 1e6).toFixed(1)), pf(mx)), extra: fine });
    lab.setFacts(t.facts.p1);
  }
}
function renderCuts(t) {
  const c = t.c, done = S.done3, sel = S.sel3;
  lab.setGlow('rgba(255, 106, 82, .24)');
  $('q3').textContent = c.q;
  $('ch3').innerHTML = c.opts.map((o, i) => chipHtml(o, { act: 'pick3', k: i, cls: answerCls(done, i, c.ok, S.pick3), dis: done })).join('');
  $('ph3').textContent = c.pairsHead;
  $('pr3').innerHTML = chipHtml(c.pairs[0], { act: 'sel3', k: 'kom', cls: sel === 'kom' ? 'on' : '' }) + chipHtml(c.pairs[1], { act: 'sel3', k: 'deb', cls: sel === 'deb' ? 'on' : '' });
  $('act3').innerHTML = done ? chipHtml(t.again, { act: 'again3' }) : '';
  const fine = `<div class="tr-fine">${esc(c.spokeFine)}</div>`;
  if (done) lab.setReadout(`${RAIL.rail} %`, c.valSub, '', '#ff6a52'); else lab.setReadout('?', c.valPre, '', '#ff6a52');
  let facts = done ? t.facts.c1 : t.facts.c0;
  if (sel === 'kom') { lab.setState({ emo: '🌉', title: c.komTitle, lead: c.komLead, body: c.komBody, extra: fine }); facts = t.facts.kom.concat(facts); }
  else if (sel === 'deb') lab.setState({ emo: '📍', title: c.debTitle, lead: c.debLead(DIST_DEB), body: c.debBody, extra: fine });
  else if (sel) { const sp = SPOKE.find((q) => q.id === sel); lab.setState({ emo: '📍', title: townTitle(c, sel), lead: c.townLead(DIST[sel]), body: c.townBody(c.ends[END_OF[sp.reg]] || ''), extra: fine }); }
  else if (done) lab.setState({ emo: S.pick3 === c.ok ? '✅' : '🚂', title: c.title(RAIL.rail, S.pick3 === c.ok), lead: c.lead(RAIL.rail), body: c.body(SPOKE.filter((q) => q.reg !== 'hu').length, RAIL), extra: fine });
  else lab.setState({ emo: '🚉', title: c.preTitle, lead: c.preLead, body: c.preBody, extra: fine });
  lab.setFacts(facts);
}
function renderA(t) {
  const s = t.sec, done = S.doneA;
  lab.setGlow('rgba(183, 155, 216, .26)');
  $('qA').textContent = s.aQ;
  $('chA').innerHTML = s.aOpts.map((o, i) => chipHtml(o, { act: 'pickA', k: i, cls: answerCls(done, i, s.aOk, S.pickA), dis: done })).join('');
  $('actA').innerHTML = done ? chipHtml(s.eras[0], { act: 'eraA', k: 0, cls: S.era === 0 ? 'on' : '' }) + chipHtml(s.eras[1], { act: 'eraA', k: 1, cls: S.era === 1 ? 'on' : '' }) + chipHtml(t.again, { act: 'againA' }) : goHtml(s.count, 'goA', S.pickA === null);
  if (!done) {
    lab.setReadout('?', s.aValPre, 'Sopron', '#b79bd8');
    lab.setState({ emo: '🗳️', title: s.aPreTitle, lead: s.aPreLead, body: s.aPreBody, extra: '' });
  } else {
    lab.setReadout(String(SOP_YES), s.aVal, 'Sopron', '#9fbf8f');
    if (S.era === 0) lab.setState({ emo: '📜', title: s.eras[0], lead: s.aEra, body: '', extra: '' });
    else lab.setState({ emo: '🗳️', title: s.aTitle(SOP_YES), lead: s.aLead, body: s.aBody, extra: '' });
  }
  lab.setFacts(done ? t.facts.sop : []);
}
function renderB(t) {
  const s = t.sec, done = S.doneB;
  lab.setGlow('rgba(255, 210, 122, .24)');
  $('qB').textContent = s.bQ;
  $('chB').innerHTML = s.bOpts.map((o, i) => chipHtml(o, { act: 'pickB', k: i, cls: answerCls(done, i, s.bOk, S.pickB), dis: done })).join('');
  $('actB').innerHTML = done ? chipHtml(s.prev, { act: 'evB', k: -1, dis: S.ev === 0 }) + chipHtml(s.next, { act: 'evB', k: 1, dis: S.ev === EVENTS.length - 1 }) + chipHtml(t.again, { act: 'againB' }) : '';
  if (!done) {
    lab.setReadout('?', s.bVal, '', '#ffd27a');
    lab.setState({ emo: '🖋️', title: s.bPreTitle, lead: s.bPreLead, body: s.bPreBody, extra: '' });
  } else {
    const ev = EVENTS[S.ev], txt = s.ev[ev.k];
    lab.setReadout(s.days(DAYS_PEN), s.bVal, '', '#ffd27a');
    lab.setState({ emo: S.ev === 3 ? '🖋️' : '📅', title: txt[0], lead: dateTxt(ev.t), body: txt[1], extra: '' });
  }
  lab.setFacts(t.facts.pen);
}
render();
