      : `<button class="rm-slot" disabled><b>${i + 1}</b></button>`;
  }).join('');
  $('lnPool').innerHTML = POOL.map((id) => `<button class="rm-ch" data-act="rk" data-id="${id}"${S.rank.includes(id) || S.checked ? ' disabled' : ''}><i style="background:${RV[id].col}"></i>${esc(nmOf(id))}</button>`).join('');
  $('lnCheck').textContent = t.check; $('lnCheck').disabled = k < 5 || S.checked; $('lnReset').textContent = t.again; $('lnReset').hidden = k === 0;
  const untraced = LEN_IDS.some((id) => S.pick[id] === undefined);
  $('lnHint').textContent = untraced ? t.lenHint : ''; $('lnHint').hidden = !untraced;
  lab.setFacts(S.checked ? [t.facts.lenPost, ...t.facts.lenPre] : t.facts.lenPre);
  if (!S.checked) {
    lab.setReadout('?', t.placed(k), `${k}/5`, '#e0b050');
    lab.setState({ emo: '📏', title: t.lenT, lead: t.lenLead, body: '', extra: fineHtml(t) });
  } else {
    lab.setReadout(t.lenVal(right), t.lenSub, '', '#e0b050');
    const top4 = Math.floor(LEN[order[3]] / 1000) * 1000, pct = Math.round(LEN.volga / LEN.nile * 100);
    lab.setState({ emo: right === 5 ? '🏆' : '📏', title: t.lenEnd(right), lead: t.lenEndLead(top4, pct), body: t.lenBody, extra: fineHtml(t) });
  }
}
function descr(t, ct) {
  const la = Math.abs(ct.lat).toFixed(1), lo = Math.abs(ct.lon).toFixed(1), np = Object.keys(PAR).sort((a, b) => Math.abs(ct.lat - PAR[a]) - Math.abs(ct.lat - PAR[b]))[0];
  return `${t.city[ct.k]}: ${t.cont[ct.c]} · ${t.sea[ct.w]} · ${t.hemL}: ${t.hemNS[nsOf(ct)]}, ${t.hemEW[ewOf(ct)]} · ${la}° ${t.ns[ct.lat >= 0 ? 0 : 1]}, ${lo}° ${t.ew[ct.lon >= 0 ? 0 : 1]} · ${t.nearL}: ${t.par[np]}, ${Math.abs(ct.lat - PAR[np]).toFixed(1)}°`;
}
function renderWhere() {
  const t = T[lang], W = S.w, eqDone = W.eq !== null, m = MYST[W.round];
  lab.setGlow('rgba(244, 208, 63, .22)');
  const q = $('wQ'), opts = $('wOpts'), clues = $('wClues'), vd = $('wVerdict');
  const inEq = W.step === 0;
  q.hidden = !inEq; opts.hidden = !inEq; clues.hidden = inEq;
  q.textContent = t.eqQ;
  opts.innerHTML = ['eu', 'af', 'au'].map((k, i) => `<button class="rm-opt ${eqDone ? (i === 1 ? 'good' : i === W.eq ? 'bad' : 'dim') : ''}" data-act="eq" data-i="${i}"${eqDone ? ' disabled' : ''}>${esc(t.cont[k])}</button>`).join('');
  vd.className = 'rm-verdict' + (inEq && eqDone ? (W.eq === 1 ? ' good' : ' bad') : '');
  vd.textContent = inEq && eqDone ? (W.eq === 1 ? t.right : t.wrong) : '';
  clues.innerHTML = m.cl.slice(0, W.shown).map((_, i) => `<li><b>${i + 1}</b><span>${esc(t.myst[W.round][i])}</span></li>`).join('');
  const main = $('wMain'), clue = $('wClue');
  if (inEq) { main.hidden = !eqDone; main.textContent = t.go; clue.hidden = true; }
  else {
    clue.hidden = W.found; clue.textContent = t.nextClue; clue.disabled = W.shown >= 3;
    main.hidden = !W.found; main.textContent = W.all ? t.mAgain : W.round < 2 ? t.nextM : t.res;
  }
  $('wLeg').innerHTML = [['arctic', '66.6° N', 1], ['cancer', '23.4° N', 1], ['eq', '0°', 0], ['cap', '23.4° S', 1]].map(([p, d, dash]) => `<div style="--c:${PCOL[p]}"><i class="${dash ? 'dash' : ''}"></i>${esc(t.par[p])} · ${d}</div>`).join('');
  $('wLeg').hidden = inEq && !eqDone; $('wNote').textContent = t.hemNote; $('wNote').hidden = inEq;
  const pre = t.facts.wherePre;
  lab.setFacts(eqDone ? [t.facts.wherePost, ...pre] : pre);
  if (inEq) {
    lab.setReadout('?', t.par.eq, '', '#f4d03f');
    lab.setState(eqDone ? { emo: W.eq === 1 ? '✅' : '🌐', title: W.eq === 1 ? t.right : t.wrong, lead: t.eqLeadR, body: '', extra: '' } : { emo: '🌐', title: t.eqT, lead: t.eqLead, body: '', extra: '' });
    return;
  }
  if (W.all) {
    lab.setReadout('3/3', t.hemL, '', '#3ddc97');
    lab.setState({ emo: '🏆', title: t.allT, lead: t.allLead(W.total), body: '', extra: '' }); return;
  }
  lab.setReadout(W.found ? t.city[m.ans] : `${W.shown}/3`, W.found ? t.cont[CBY[m.ans].c] : t.cluesL, t.of(W.round + 1, 3), '#f4d03f');
  const last = W.last && CBY[W.last];
  if (last && last.k !== m.ans) {
    const bad = m.cl.slice(0, W.shown).findIndex((q2) => !FIT[q2.t](last, q2));
    lab.setState({ emo: '🤔', title: t.that(t.city[last.k]), lead: descr(t, last), body: W.found ? '' : bad >= 0 ? t.notFit(bad + 1) : t.fits, extra: '' });
  } else if (W.found) lab.setState({ emo: '✅', title: t.found(t.city[m.ans]), lead: descr(t, CBY[m.ans]), body: t.foundB(W.shown, W.wrong), extra: '' }); else lab.setState({ emo: '🔎', title: t.mT(W.round + 1), lead: t.mLead, body: t.myst[W.round][W.shown - 1], extra: '' });
}
render();
</script>
