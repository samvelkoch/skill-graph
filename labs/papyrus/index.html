function reedHead(c, x, y) {

}

  c.save(); c.beginPath(); c.roundRect(0, 0, w, h, 18); c.clip();
  c.translate(ox, oy); c.scale(s, s);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const sec = v === 'scroll' && S.unl ? S.sec : null;
  if (sec === 'long') drawLong(c, time);
  else if (sec === 'word') drawWord(c, time);
  else if (v === 'also') drawAlso(c, time);
  else {
    nile(c, time, true); stemStanding(c, time); bench(c); canopy(c);
    if (v === 'make') drawMake(c, time); else drawScroll(c, time, dt);
  }
  c.restore();
  if (v === 'scroll') checkWrite();
});

// --- controls ------------------------------------------------------------------------------------------------
function mkAct() {
  if (busyMake()) return;
  const s = S.s, go = (k) => { S.t[k] = now(); S.last = k; later(DUR[k]); };
  if (s === 0) { go('cut'); S.s = 1; sfx.snap(); }
  else if (s === 1) { go('peel'); S.s = 2; sfx.click(); }
  else if (s === 2) { go('slice'); S.s = 3; sfx.snap(); }
  else if (s === 3) { if (S.laid >= 6) return; S.laidAt[S.laid] = now(); S.laid++; go('lay'); sfx.tick(); if (S.laid === 6) S.s = 4; }
  else if (s === 5) { go('press1'); S.s = 6; sfx.push(); later(DUR.press1 * 0.56); showStage(); }
  else if (s === 6) { go('cross'); S.s = 7; sfx.click(); }
  else if (s === 7) { go('press2'); S.s = 8; sfx.push(); later(DUR.press2 * 0.56); showStage(); }
  else if (s === 8) { go('dry'); S.s = 9; sfx.click(); }
  else if (s === 9) { go('polish'); S.s = 10; sfx.tick(); }
  else if (s === 10 && prog('polish') >= 1) { S.s = 0; S.t = {}; S.last = null; S.laid = 0; S.laidAt = []; S.guess = null; sfx.click(); }
  render();
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-sec], [data-w]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'mk') mkAct();
  else if (act === 'gyes' || act === 'gno') { S.guess = act === 'gyes' ? 'yes' : 'no'; S.s = 5; sfx.click(); render(); }
  else if (act === 'add') { if (S.n < NMAX && S.wrote === 0 && S.rollTo === 0) { S.n++; S.addAt = now(); sfx.snap(); render(); } }
  else if (act === 'write') { if (S.n >= 3 && S.wrote === 0 && S.rollTo === 0 && S.rollV < 0.02) { S.wrote = 1; S.writeT = now(); sfx.click(); render(); } }
  else if (act === 'roll') { if (S.wrote !== 1) { S.rollTo = S.rollTo ? 0 : 1; sfx.push(); render(); later(1.5); } }
  else if (act === 'scAgain') { S.n = 2; S.wrote = 0; S.writeT = null; S.rollTo = 0; S.rollV = 0; sfx.click(); render(); }
  else if (act === 'secOff') { S.sec = null; sfx.click(); render(); }
  else if (b.dataset.sec) { if (!secret.unlocked()) return secret.open(); S.sec = b.dataset.sec; if (S.sec === 'long' && S.long < 1) S.long = 8; sfx.click(); render(); }
  else if (b.dataset.w) { S.word = +b.dataset.w; sfx.click(); render(); }
  else if (act === 'sy' || act === 'sn') {
    if (S.checked || S.cur < 0) return;
    S.sort[S.cur] = act === 'sy' ? 1 : 0; sfx.tick(); nextCur(); render();
  } else if (act === 'check') { if (sortedCount() === 7 && !S.checked) { S.checked = true; const r = ITEMS.filter((id, i) => S.sort[i] === OKI[id]).length; (r === 7 ? sfx.good : sfx.click)(); render(); showStage(); } }
  else if (act === 'alAgain') { S.sort = ITEMS.map(() => null); S.checked = false; nextCur(); sfx.click(); render(); }
});
$('ctrlBody').addEventListener('input', (ev) => { if (ev.target.id === 'rng') { S.long = clamp(+ev.target.value, 0, PITCH.SCROLL); render(); } });
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.s, y = (ev.clientY - r.top - G.oy) / G.s, v = lab.view;
  if (v === 'make') { if (S.s === 3) mkAct(); return; }
  if (v !== 'also' || S.checked) return;
  for (let b = 0; b < 2; b++) {
    const B = BINS[b];
    if (x < B.x || x > B.x + B.w || y < B.y || y > B.y + B.h) continue;
    let n = 0;
    for (let i = 0; i < ITEMS.length; i++) {
      if (binOf(i) !== b) continue;
      const [cx, cy] = cellPos(b, n++);
      if (Math.abs(x - cx) < 25 && Math.abs(y - cy) < 23) { S.sort[i] = null; S.cur = i; sfx.tick(); render(); return; }
    }
    if (S.cur >= 0) { S.sort[S.cur] = b === 0 ? 1 : 0; sfx.tick(); nextCur(); render(); }
    return;
  }
});

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v; S.unl = secret.unlocked();
  $('vMake').hidden = v !== 'make'; $('vScroll').hidden = v !== 'scroll'; $('vAlso').hidden = v !== 'also';
  if (v === 'make') renderMake(t); else if (v === 'scroll') renderScroll(t); else renderAlso(t);
}
function renderMake(t) {
  const m = t.make, s = S.s, busy = busyMake(), pPress1 = prog('press1'), pPress2 = prog('press2');
  lab.setGlow('rgba(240, 190, 90, .26)');
  $('mkAsk').hidden = s !== 4; $('mkGoRow').hidden = s === 4;
  $('mkQ').textContent = m.q;
  document.querySelector('[data-act=gyes]').textContent = `👍 ${t.yes}`; document.querySelector('[data-act=gno]').textContent = `👎 ${t.no}`;
  const polishDone = S.s === 10 && prog('polish') >= 1;
  const key = ['cut', 'peel', 'slice', 'lay', null, 'press', 'cross', 'press2', 'dry', 'polish', polishDone ? 'again' : 'polish'][s];
  const lbl = key === 'lay' ? m.btn.lay(S.laid + 1 > 6 ? 6 : S.laid + 1) : key ? m.btn[key] : '';
  $('mkGo').textContent = busy && key !== 'again' ? m.btn.wait : lbl;
  $('mkGo').disabled = busy || key === null;
  let card;
  if (s === 0) card = m.c.cut; else if (s === 1) card = m.c.peel; else if (s === 2) card = m.c.slice; else if (s === 3) card = m.c.lay(S.laid);
  else if (s === 4) card = m.c.ask; else if (s === 5) card = m.c.test(S.guess === 'yes' ? t.yes : t.no);
  else if (s === 6) card = pPress1 < 0.55 ? m.c.pressing : m.c.fall(S.guess === 'no');
  else if (s === 7) card = m.c.cross;
  else if (s === 8) card = pPress2 < 0.55 ? m.c.pressing : m.c.holds;
  else if (s === 9) card = m.c.dry;
  else card = polishDone ? m.c.done : m.c.polish;
  const emo = ['🌿', '🔪', '🔪', '🧺', '🤔', '⬇️', s === 6 && pPress1 >= 0.55 ? (S.guess === 'no' ? '✅' : '🤔') : '⬇️', '➕', s === 8 && pPress2 >= 0.55 ? '✅' : '⬇️', '☀️', polishDone ? '📜' : '🪨'][s];
  lab.setState({ emo, title: card[0], lead: card[1], body: '', extra: '' });
  const layers = s >= 7 ? 2 : 1;
  lab.setReadout(`${Math.min(s + 1, 10)}/10`, m.steps[s === 6 && pPress1 < 0.55 ? 5 : s], s >= 3 ? m.layers(layers) : '', '#f0be5a');
  let f = t.f.a; // nothing about the layers until the press has shown what happens
  if (s >= 6 && !(s === 6 && pPress1 < 0.55)) f = s >= 10 ? [...t.f.b, ...t.f.b3] : t.f.b;
  lab.setFacts(mkFacts(f));
}
function renderScroll(t) {
  const sc = t.scroll, un = secret.unlocked(), rolled = S.rollTo === 1;
  lab.setGlow('rgba(240, 190, 90, .26)');
  const sec = un ? S.sec : null;
  $('scMain').hidden = !!sec; $('scLong').hidden = sec !== 'long'; $('scWord').hidden = sec !== 'word';
  const writing = S.wrote === 1 && S.writeT != null && now() - S.writeT < glyphCount() * 0.55;
  $('bAdd').textContent = `${sc.btn.add} · ${S.n}/${NMAX}`; $('bAdd').disabled = S.n >= NMAX || S.wrote > 0 || rolled;
  $('bWrite').textContent = sc.btn.write; $('bWrite').disabled = S.n < 3 || S.wrote > 0 || rolled;
  $('bRoll').textContent = rolled ? sc.btn.unroll : sc.btn.roll; $('bRoll').disabled = writing;
  $('bScAgain').textContent = '↻'; $('bScAgain').setAttribute('aria-label', sc.btn.again);
  const sb = (k, emo) => `<button class="pp-chip secret${un ? ' open' : ''}" data-sec="${k}">${un ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('scSec').innerHTML = sb('long', '📏') + sb('word', '🔤');
  if (sec === 'long') {
    const m = S.long, pct = Math.round(m / PITCH.L * 100), full = m >= PITCH.SCROLL;
    $('slLbl').textContent = t.sl.lbl; $('rng').value = m; $('rng').setAttribute('aria-label', t.sl.lbl);
    lab.setGlow('rgba(70, 160, 100, .26)');
    lab.setReadout(`${m} ${t.sl.unit}`, t.sl.sub, t.sl.pill(pct), '#3fae6a');
    lab.setState({ emo: '📏', title: t.sl.title, lead: full ? t.sl.full : t.sl.lead(m, pct), body: '', extra: '' });
    lab.setFacts(mkFacts(t.f.e));
    return;
  }
  if (sec === 'word') {
    const i = S.word, c = t.sw.c[i];
    $('swChips').innerHTML = t.sw.chips.map((x, k) => `<button class="pp-chip${k === i ? ' on' : ''}" data-w="${k}">${esc(x)}</button>`).join('');
    lab.setGlow('rgba(255, 210, 120, .22)');
    lab.setReadout(esc(c[0]), 'papyrus', '', '#e8b84a');
    lab.setState({ emo: i === 2 ? '🧭' : '🔤', title: c[0], lead: c[1], body: '', extra: '' });
    lab.setFacts(mkFacts(t.f.w));
    return;
  }
  let card, emo;
  if (rolled && S.rollV > 0.5) { card = S.wrote ? sc.rolled : sc.rolledBlank; emo = '📜'; }
  else if (writing) { card = sc.writing; emo = '🖋️'; }
  else if (S.wrote) { card = sc.written; emo = '🖼️'; }
  else if (S.n >= 3) { card = sc.ready(S.n); emo = '✍️'; }
  else { card = sc.paste; emo = '🔗'; }
  lab.setState({ emo, title: card[0], lead: card[1], body: '', extra: '' });
  lab.setReadout(String(S.n), `${sc.sheets(S.n).replace(/^\d+\s*/, '')} · ${sc.sub}`, rolled ? sc.pRolled : S.wrote ? sc.pWritten : sc.pPlain, '#f0be5a');
  lab.setFacts(mkFacts(t.f.c));
}
function renderAlso(t) {
  const a = t.also, k = sortedCount(), all = k === 7;
  lab.setGlow('rgba(150, 190, 90, .22)');
  const b = document.querySelectorAll('#alBtns button'); b[0].textContent = a.btn[0]; b[1].textContent = a.btn[1];
  $('alBtns').hidden = S.checked || all; $('alCheck').hidden = S.checked || !all; $('alCheck').textContent = a.check;
  $('alAgain').hidden = !S.checked && k === 0; $('alAgain').textContent = a.again;
  if (S.checked) {
    const r = ITEMS.filter((id, i) => S.sort[i] === OKI[id]).length, c = a.res(r);
    lab.setReadout(`${k}/7`, a.sub, a.right(r), '#8fb04a');
    lab.setState({ emo: r === 7 ? '🏆' : '🧺', title: c[0], lead: c[1], body: '', extra: '' });
    lab.setFacts(mkFacts(t.f.d2));
  } else if (all) {
    lab.setReadout(`${k}/7`, a.sub, '', '#8fb04a');
    lab.setState({ emo: '🧺', title: a.all[0], lead: a.all[1], body: '', extra: '' });
    lab.setFacts(mkFacts(t.f.d1));
  } else {
    lab.setReadout(`${k}/7`, a.sub, '', '#8fb04a');
    lab.setState({ emo: '🤔', title: a.names[ITEMS[S.cur]], lead: a.q, body: '', extra: '' });
    lab.setFacts(mkFacts(t.f.d1));
  }
}
nextCur();
render();
</script>
