    if (shown !== null) badge(c, x + cw - 16, y + 16, shown, rev ? 1 : easeOutBack((time - S.at[i]) / 0.35));
    c.restore();
  });
}

// --- view 3: bases ---------------------------------------------------------------------------------------------
const popR = (n) => Math.sqrt(n / 1000) * GEO.R * 0.2;
function drawBases(c, w, h, time) {
  const t = T[lang], pop = ease(S.pop3), mt = ease(S.modeT);
  if (S.sec && mt > 0.99) { drawSecret(c, w, h, time); return; }
  c.save(); c.globalAlpha = 1 - mt;
  drawMap(c, w, h, {});
  const { cx, cy, R } = GEO;
  c.save(); c.beginPath(); c.arc(cx, cy, R * 0.84, 0, TAU); c.clip();
  if (pop > 0.01) {
    for (const st of STATIONS) {
      if (!st.pop) continue;
      const [x, y] = spos(st.lat, st.lon), a = popR(st.pop[0]) * pop, b = Math.max(2.4, popR(st.pop[1])) * pop;
      c.fillStyle = 'rgba(255,211,107,.34)'; c.strokeStyle = 'rgba(255,225,150,.95)'; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, Math.max(0, a), 0, TAU); c.fill(); c.stroke();
      c.fillStyle = '#6fb3ff'; c.strokeStyle = '#fff'; c.lineWidth = 1.2; c.beginPath(); c.arc(x, y, Math.max(0, b), 0, TAU); c.fill(); c.stroke();
    }
  }
  c.restore();
  for (const st of STATIONS) {
    const [x, y] = spos(st.lat, st.lon), sel = S.sel3 === st.id; st.px = x; st.py = y;
    c.save();
    if (sel) { c.shadowColor = st.col; c.shadowBlur = 12 + 4 * Math.sin(time * 4); }
    c.fillStyle = 'rgba(10,14,28,.88)'; c.strokeStyle = st.col; c.lineWidth = sel ? 3.2 : 2.4; c.beginPath(); c.arc(x, y, sel ? 8.5 : 7, 0, TAU); c.fill(); c.stroke();
    c.shadowColor = 'transparent'; c.fillStyle = sel ? '#fff' : st.col; c.beginPath(); c.arc(x, y, 2.6, 0, TAU); c.fill();
    c.restore();
  }
  const sel = STATIONS.find((s) => s.id === S.sel3);
  if (sel) pill(c, t.st[sel.id][0], sel.px, sel.py + (sel.py > cy ? -24 : 24), { stroke: sel.col });
  else pill(c, t.c3.stationHint, cx, h - 14, { a: 0.9 });
  if (pop > 0.5) pill(c, t.c3.legend, cx, 16, { a: (pop - 0.5) * 2 });
  c.restore();
  if (S.sec && mt > 0.01) { c.save(); c.globalAlpha = mt; drawSecret(c, w, h, time); c.restore(); }
}
function drawSecret(c, w, h, time) {
  const t = T[lang];
  c.fillStyle = grad(c, 0, 0, 0, h, S.sec === 'b' ? '#16324f' : '#12274a', S.sec === 'b' ? '#0a1626' : '#0b1730'); rr(c, 0, 0, w, h, 14); c.fill();
  if (S.sec === 'a') {
    const cols = 10, s = Math.min((w - 36) / cols, (h - 96) / cols), gw = s * cols, x0 = (w - gw) / 2, y0 = 44, count = lerp(WINTER_ALL / PER_ICON, SUMMER_ALL / PER_ICON, ease(S.seas));
    for (let i = 0; i < cols * cols; i++) {
      const lit = c01(count - i), x = x0 + (i % cols) * s + s / 2, y = y0 + Math.floor(i / cols) * s + s / 2;
      c.fillStyle = lit > 0.01 ? mix('#6fb3ff', '#ffd36b', ease(S.seas)) : 'rgba(150,170,210,.22)';
      c.globalAlpha = 0.18 + 0.82 * lit;
      c.beginPath(); c.arc(x, y - s * 0.2, s * 0.15, 0, TAU); c.fill();
      c.beginPath(); c.moveTo(x - s * 0.22, y + s * 0.36); c.quadraticCurveTo(x - s * 0.24, y - s * 0.02, x, y - s * 0.02); c.quadraticCurveTo(x + s * 0.24, y - s * 0.02, x + s * 0.22, y + s * 0.36); c.closePath(); c.fill();
      c.globalAlpha = 1;
    }
    const sum = S.season === 'summer';
    pill(c, `${sum ? t.c3.season.summer : t.c3.season.winter} · ≈ ${num(sum ? SUMMER_ALL : WINTER_ALL)}`, w / 2, 20, { fs: 13 });
    pill(c, t.c3.icon, w / 2, h - 16);
  } else if (S.sec === 'b') {
    for (let i = 0; i < 38; i++) { const sx = (i * 97.3) % w, sy = ((i * 53.7) + time * (14 + (i % 5) * 5)) % h; c.fillStyle = `rgba(235,245,255,${0.25 + (i % 4) * 0.12})`; c.beginPath(); c.arc(sx + Math.sin(time + i) * 5, sy, 1.2 + (i % 3) * 0.6, 0, TAU); c.fill(); }
    const T0 = COLD_START, T1 = -90, top = 34, bot = h - 64, len = bot - top, tx = w * 0.34, tw = 20;
    const yT = (v) => top + (T0 - v) / (T0 - T1) * len, temp = coldTemp(), my = yT(temp);
    c.fillStyle = 'rgba(235,245,255,.14)'; c.strokeStyle = 'rgba(220,235,255,.7)'; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(tx - tw / 2, top); c.lineTo(tx - tw / 2, bot); c.arc(tx, bot + 14, 24, -Math.PI * 0.62, -Math.PI * 0.38, true); c.lineTo(tx + tw / 2, top); c.arc(tx, top, tw / 2, 0, Math.PI, true); c.closePath(); c.fill(); c.stroke();
    const mc = mix('#ff5a4a', '#6fc4ff', ease((COLD_START - temp) / (COLD_START - COLD_END)));
    c.fillStyle = mc; c.beginPath(); c.arc(tx, bot + 14, 19, 0, TAU); c.fill(); rr(c, tx - 5, my, 10, bot + 14 - my, 4); c.fill();
    c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(tx - 7, bot + 8, 5, 7, 0.4, 0, TAU); c.fill();
    c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
    for (let v = T0; v >= T1; v -= 10) {
      const y = yT(v); c.strokeStyle = v === 0 ? '#ffd86b' : 'rgba(220,235,255,.55)'; c.lineWidth = v === 0 ? 2.5 : 1.5;
      c.beginPath(); c.moveTo(tx + tw / 2 + 3, y); c.lineTo(tx + tw / 2 + (v % 20 === 0 ? 16 : 10), y); c.stroke();
      if (v % 20 === 0 || v === 10) { c.fillStyle = v === 0 ? '#ffd86b' : '#cfe0f5'; c.fillText(String(v).replace('-', '−'), tx + tw / 2 + 21, y); }
    }
    pill(c, t.c3.cold.frz, tx + tw / 2 + 74, yT(0), { stroke: '#ffd86b' });
    pill(c, `${t.c3.cold.now}: ${fmtT(temp)}`, w * 0.7, clamp(my, 40, h - 90), { stroke: mc, fs: 13 });
    if (S.coldAt > 0 && nowS() - S.coldAt > COLD_SECS) pill(c, `Vostok · ${t.c3.cold.pill}`, w * 0.7, clamp(my, 40, h - 90) + 30, { col: '#bfe6ff' });
  }
}
const coldTemp = () => lerp(COLD_START, COLD_END, ease((nowS() - S.coldAt) / COLD_SECS));

// --- per-frame animation values -----------------------------------------------------------------------------------
function tick(dt) {
  S.a1 = approach(S.a1, S.rev1 ? 1 : 0, dt, 0.8);
  S.t59 = approach(S.t59, S.y59 ? 1 : 0, dt, 1.1);
  S.pop3 = approach(S.pop3, S.rev3 ? 1 : 0, dt, 0.9);
  S.seas = approach(S.seas, S.season === 'summer' ? 1 : 0, dt, 1.2);
  S.modeT = approach(S.modeT, S.sec ? 1 : 0, dt, 0.5);
}

// --- shell ---------------------------------------------------------------------------------------------------------
const lab = shell({ key: 'antarctica', T, topics: TOPICS, views: ['claims', 'rules', 'bases'], onLang: () => render(), onView: () => render() });
const secret = secretLab('antarctica', () => ({
  secrets: [{ emo: '👥', title: T[lang].secrets.a[0], desc: T[lang].secrets.a[1] }, { emo: '🌡️', title: T[lang].secrets.b[0], desc: T[lang].secrets.b[1] }],
  questions: T[lang].quiz,
}), () => render());

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const F = (...keys) => keys.map((k) => ({ emo: FEMO[k], text: T[lang].f[k], src: SRC[k] }));
const stOf = (id) => STATIONS.find((s) => s.id === id);

// --- interaction -----------------------------------------------------------------------------------------------------
function pickClaim(px, py) {
  const { cx, cy, R } = GEO, dx = (px - cx) / R, dy = (py - cy) / R;
  if (Math.hypot(dx, dy) > R_CLAIM + 0.02) { S.sel1 = null; return; }
  const lon = norm(Math.atan2(dx, -dy) * DEG), here = claimsAt(lon).map((cl) => cl.id);
  if (!here.length) { S.sel1 = inR(UNCL.ranges, lon) ? 'un' : null; return; }
  const at = here.indexOf(S.sel1);
  S.sel1 = here[(at + 1) % here.length];
}
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top, v = lab.view;
  if (v === 'claims') {
    if (!S.rev1 || S.t59 > 0.5) return;
    pickClaim(px, py); sfx.tick(); render();
  } else if (v === 'rules') {
    const hit = HIT.find((q) => px >= q.x && px <= q.x + q.w && py >= q.y && py <= q.y + q.h);
    if (!hit) return;
    S.pick2 = hit.i; sfx.tick(); render();
  } else if (v === 'bases') {
    if (S.sec) { if (S.sec === 'b') { S.coldAt = nowS(); sfx.click(); render(); } return; }
    let best = null, bd = 26;
    for (const st of STATIONS) { const d = Math.hypot(px - st.px, py - st.py); if (d < bd) { bd = d; best = st; } }
    if (best) { S.sel3 = best.id; sfx.tick(); render(); }
  }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = b.dataset.k;
  if (act === 'g1') { S.g1 = k; S.rev1 = true; S.sel1 = null; (k === ANSWER1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'sel1') { S.sel1 = S.sel1 === k ? null : k; if (S.y59) S.y59 = false; sfx.tick(); }
  else if (act === 'y59') { S.y59 = !S.y59; S.seen59 = true; if (S.y59) S.sel1 = null; sfx.click(); showStage(); }
  else if (act === 'redo1') { S.g1 = null; S.rev1 = false; S.sel1 = null; S.y59 = false; sfx.click(); }
  else if (act === 'mark') {
    const i = S.pick2; if (i === null || S.rev2) return;
    S.sorted[i] = k === 'ok'; S.at[i] = nowS(); (k === 'ok' ? sfx.click : sfx.tick)();
    const next = CARDS.findIndex((_, j) => S.sorted[(i + 1 + j) % CARDS.length] === null);
    if (next >= 0) S.pick2 = (i + 1 + next) % CARDS.length;
  }
  else if (act === 'check2') { if (S.sorted.includes(null)) return; S.rev2 = true; S.pick2 = null; S.revAt2 = nowS(); (S.sorted.every((m, i) => m === TRUTH[CARDS[i]]) ? sfx.good : sfx.snap)(); showStage(); }
  else if (act === 'redo2') { S.sorted.fill(null); S.rev2 = false; S.pick2 = 0; sfx.click(); }
  else if (act === 'g3') { S.g3 = +k; S.rev3 = true; S.sel3 = null; (+k === ANSWER3 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'st') { S.sel3 = S.sel3 === k ? null : k; if (S.sec) S.sec = null; sfx.tick(); }
  else if (act === 'redo3') { S.g3 = null; S.rev3 = false; S.sel3 = null; S.sec = null; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; if (S.sec === 'b') S.coldAt = nowS(); sfx.click();
  }
  else if (act === 'season') { S.season = k; sfx.tick(); }
  render();
});

// --- one render per change: controls, readout, state card, facts ---------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  if (v === 'claims') renderClaims(t); else if (v === 'rules') renderRules(t); else renderBases(t);
}
function renderClaims(t) {
  const c1 = t.c1, n = CLAIMS.length;
  lab.setGlow('rgba(110, 170, 255, .26)');
  const fine = `<div class="an-fine">${esc(c1.fine)}</div>`;
  if (!S.rev1) {
    $('ctrlBody').innerHTML = `<div class="an-q">${esc(c1.q(n))}</div><div class="an-opts">${ORDER1.map((k) => `<button class="an-opt" data-act="g1" data-k="${k}">${esc(c1.opt[k])}</button>`).join('')}</div>`;
    lab.setReadout('?', '', '', '#7fb6ff');
    lab.setState({ emo: '🤔', title: c1.askTitle, lead: c1.askLead, body: '', extra: fine });
    lab.setFacts(F('area'));
    return;
  }
  $('ctrlBody').innerHTML = `<div class="chips an-chips">${CLAIMS.map((cl) => `<button class="chip ${S.sel1 === cl.id ? 'on' : ''}" data-act="sel1" data-k="${cl.id}"><i class="an-dot" style="background:${cl.col}"></i>${esc(cname(cl.id, 1))}</button>`).join('')}
    <button class="chip ${S.sel1 === 'un' ? 'on' : ''}" data-act="sel1" data-k="un"><i class="an-dot" style="background:transparent;border:1.5px dashed #cfe0f5"></i>${esc(t.un[0])}</button></div>
    <div class="row2"><button class="chip an-y ${S.y59 ? 'on' : S.seen59 ? '' : 'an-pulse'}" data-act="y59">${S.y59 ? esc(c1.back) : '📜 1959'}</button><button class="chip" data-act="redo1">${esc(c1.redo)}</button></div>`;
  let st, val, sub = '', pillT = '';
  const sel = S.sel1 && S.sel1 !== 'un' ? CLAIMS.find((x) => x.id === S.sel1) : null;
  if (S.y59) {
    st = { emo: '📜', title: c1.y.title, lead: c1.y.lead, body: c1.y.body, extra: fine }; val = '1959'; sub = c1.subY; pillT = c1.pillY;
  } else if (sel) {
    const others = sharesWith(sel);
    st = { emo: '🥧', title: cname(sel.id), lead: c1.terrLead(t.terr[sel.id], fmtRanges(sel.ranges)), body: others.length ? c1.shares(nameList(others.map((o) => o.id))) : c1.alone, extra: fine };
    val = `${Math.round(widthOf(sel.ranges))}°`; sub = c1.sub(cname(sel.id, 1));
  } else if (S.sel1 === 'un') {
    st = { emo: '🧊', title: c1.unTitle, lead: c1.unLead(fmtRanges(UNCL.ranges)), body: c1.unBody, extra: fine };
    val = `${Math.round(widthOf(UNCL.ranges))}°`; sub = t.un[0];
  } else {
    const ok = S.g1 === ANSWER1;
    const names = lang === 'ru' ? joinAnd(OVERLAP_IDS.map((id) => t.country[id][2])) : nameList(OVERLAP_IDS);
    const bands = `<ul class="an-bands">${BANDS.map((b) => `<li><b>${esc(fmtRanges([[b.a, b.b]]))}</b>: ${esc(nameList(b.ids))}</li>`).join('')}</ul>`;
    st = { emo: ok ? '✅' : '🤔', title: ok ? t.right : c1.wrong, lead: c1.overlap(names), body: c1.overlapBody, extra: bands + fine };
    val = String(n); sub = c1.subAll;
  }
  lab.setReadout(val, sub, pillT, '#7fb6ff');
  lab.setState(st);
  lab.setFacts(S.y59 ? F('treaty', 'art4') : F('mbl', 'ring'));
}
function renderRules(t) {
  const c2 = t.c2, done = S.sorted.filter((m) => m !== null).length, right = CARDS.filter((id, i) => S.sorted[i] === TRUTH[id]).length;
  lab.setGlow('rgba(120, 180, 240, .24)');
  $('ctrlBody').innerHTML = S.rev2
    ? `<div class="an-sort"><button class="btn" data-act="redo2">${esc(c2.again)}</button></div>`
    : `<div class="an-sort"><button class="btn ghost an-ok" data-act="mark" data-k="ok">${esc(c2.ok)}</button><button class="btn ghost an-no" data-act="mark" data-k="no">${esc(c2.no)}</button></div>
       <div class="row2"><button class="btn" data-act="check2" ${done === CARDS.length ? '' : 'disabled'}>${esc(c2.check)}</button></div>`;
  if (!S.rev2) {
    lab.setReadout(`${done}/${CARDS.length}`, c2.sorted, '', '#78b4f0');
    const id = S.pick2 !== null ? CARDS[S.pick2] : null;
    lab.setState({ emo: '🤔', title: id ? c2.card[id][0] : c2.askTitle, lead: c2.lead, body: '', extra: '' });
    lab.setFacts(F('signers'));
    return;
  }
  lab.setReadout(`${right}/${CARDS.length}`, c2.rightSub, '', '#78b4f0');
  if (S.pick2 !== null) {
    const id = CARDS[S.pick2], ok = S.sorted[S.pick2] === TRUTH[id];
    lab.setState({ emo: TRUTH[id] ? '✅' : '🚫', title: c2.card[id][0], lead: c2.card[id][1], body: ok ? t.right : '', extra: '' });
  } else lab.setState({ emo: right === CARDS.length ? '🏆' : '🤔', title: c2.end(right), lead: c2.endLead, body: c2.endBody, extra: '' });
  lab.setFacts(F('madrid', 'review'));
}
function renderBases(t) {
  const c3 = t.c3, st = S.sel3 ? stOf(S.sel3) : null;
  lab.setGlow('rgba(255, 211, 107, .2)');
  const chips = `<div class="chips an-chips">${STATIONS.map((s) => `<button class="chip ${S.sel3 === s.id && !S.sec ? 'on' : ''}" data-act="st" data-k="${s.id}"><i class="an-dot" style="background:${s.col}"></i>${esc(t.st[s.id][0])}</button>`).join('')}</div>`;
  let html;
  if (!S.rev3) {
    html = `<div class="an-q">${esc(c3.q)}</div><div class="an-opts col">${c3.opt.map((o, i) => `<button class="an-opt" data-act="g3" data-k="${i}">${esc(o)}</button>`).join('')}</div><div class="row2" style="margin-top:10px">${chips}</div>`;
  } else {
    const un = secret.unlocked();
    const sc = (k, emo) => `<button class="chip secret ${un ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${un ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    html = `${chips}<div class="row2">${sc('a', '👥')}${sc('b', '🌡️')}<button class="chip" data-act="redo3">${esc(c3.redo)}</button></div>`;
    if (S.sec === 'a') html += `<div class="an-season">${['summer', 'winter'].map((s) => `<button class="chip ${S.season === s ? 'on' : ''}" data-act="season" data-k="${s}">${esc(c3.season[s])}</button>`).join('')}</div>`;
  }
  $('ctrlBody').innerHTML = html;
  const mc = stOf('mcmurdo');
  if (!S.rev3) {
    const lead = st ? `${t.st[st.id][1]}. ${t.st[st.id][2]}` : c3.askLead;
    lab.setReadout(String(STATIONS.length), c3.subNone, '', '#ffd36b');
    lab.setState({ emo: st ? st.emo : '🤔', title: st ? t.st[st.id][0] : c3.askTitle, lead, body: '', extra: '' });
    lab.setFacts(F('pole'));
    return;
  }
  if (S.sec === 'a') {
    const sum = S.season === 'summer';
    lab.setReadout(`≈ ${num(sum ? SUMMER_ALL : WINTER_ALL)}`, sum ? c3.sumWord : c3.winWord, '', '#ffd36b');
    lab.setState({ emo: '👥', title: c3.sa.title, lead: c3.sa.lead(num(SUMMER_ALL), num(WINTER_ALL)), body: c3.sa.body, extra: '' });
    lab.setFacts(F('pop'));
    return;
  }
  if (S.sec === 'b') {
    lab.setReadout(fmtT(coldTemp()), c3.cold.sub, nowS() - S.coldAt > COLD_SECS ? c3.cold.pill : '', '#6fc4ff');
    lab.setState({ emo: '🌡️', title: c3.cold.title, lead: c3.cold.lead(c3.cold.date).replace('{T}', fmtT(COLD_END)), body: c3.cold.body, extra: `<div class="an-fine">${esc(c3.cold.again)}</div>` });
    lab.setFacts(F('cold', 'vcore'));
    return;
  }
  const ok = S.g3 === ANSWER3;
  if (st) {
    const info = t.st[st.id], p = st.pop;
    lab.setState({ emo: st.emo, title: info[0], lead: info[2], body: `${info[1]}. ${p ? c3.people(num(p[0]), num(p[1])) : c3.halley}`, extra: '' });
    lab.setReadout(p ? `${num(p[0])} → ${num(p[1])}` : '0', p ? c3.subPop : c3.subHalley, p ? c3.pillY : '', '#ffd36b');
  } else {
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : c3.wrong, lead: c3.revLead(num(mc.pop[0]), num(mc.pop[1])), body: c3.revBody, extra: '' });
    lab.setReadout(`${num(mc.pop[0])} → ${num(mc.pop[1])}`, c3.subPop, c3.pillY, '#ffd36b');
  }
  lab.setFacts(F('pop', 'halley'));
}

// --- go ----------------------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h; tick(dt);
  const v = lab.view;
  if (v === 'claims') drawClaims(c, w, h);
  else if (v === 'rules') drawRules(c, w, h, time);
  else {
    drawBases(c, w, h, time);
    if (S.sec === 'b') { const r = fmtT(coldTemp()); if (r !== S.lastT) { S.lastT = r; lab.setReadout(r, T[lang].c3.cold.sub, nowS() - S.coldAt > COLD_SECS ? T[lang].c3.cold.pill : '', '#6fc4ff'); } }
  }
});
render();
</script>
</body>
</html>
