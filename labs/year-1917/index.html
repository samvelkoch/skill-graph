  if (S.pick === null) {
    lab.setReadout('?', '', '', '#e0a050');
    lab.setState({ emo: '🤔', title: d.q, lead: d.ask, body: '', extra: fine }); lab.setFacts([]); return;
  }
  const [om, od] = osOf(S.day), [nm, nd] = nsOf(S.day), a = t.date(om, od, t.mo), b = t.date(nm, nd, t.mo), ev = EVIDX.indexOf(S.day);
  lab.setReadout('+13', d.plusSub, `${a} → ${b}`, '#e0a050');
  if (!S.moved) lab.setState({ emo: S.pick === d.ok ? '✅' : '🤔', title: S.pick === d.ok ? d.rightT : d.wrongT, lead: d.lead, body: d.after, extra: fine });
  else if (ev >= 0) lab.setState({ emo: '📌', title: `${d.evs[ev].s}: ${a}`, lead: d.evs[ev].t, body: d.day(a, b), extra: fine });
  else lab.setState({ emo: '📅', title: d.dayT, lead: d.day(a, b), body: '', extra: fine });
  lab.setFacts(d.facts);
}
function infoPower(t) {
  const p = t.p, st = S.step;
  lab.setGlow('rgba(125, 155, 214, .24)');
  const fine = `<div class="y-fine">${esc(p.model)}</div>`;
  if (S.secA) {
    const a = t.sa, i = S.aSel;
    lab.setReadout(i < 0 ? '🍞' : a.slogans[i], '', a.chip, '#f5c84c');
    if (i < 0) lab.setState({ emo: '🍞', title: a.title, lead: a.hint, body: '', extra: '' });
    else lab.setState({ emo: ['🕊️', '🌾', '🍞'][i], title: a.slogans[i], lead: a.want[i], body: `${a.cameH}: ${a.came[i]}`, extra: '' });
    lab.setFacts([]); return;
  }
  const facts = [p.facts[0]]; for (let i = 0; i < 3; i++) if (S.ch[i] !== null) facts.push(p.facts[i + 1]);
  if (st === 3) {
    lab.setReadout(p.rd[3], '', p.pill[1], '#f5c84c');
    lab.setState({ emo: '🏛️', title: p.fin.title, lead: p.fin.lead, body: p.fin.body, extra: fine }); lab.setFacts(facts); return;
  }
  const s = p.steps[st], c = S.ch[st];
  lab.setReadout(p.when[st], p.rd[st], p.pill[0], '#7d9bd6');
  if (c === null) lab.setState({ emo: '⚖️', title: s.q, lead: s.intro, body: '', extra: fine });
  else lab.setState({ emo: '🧭', title: `${p.yours}: ${s.opts[c]}`, lead: `${p.real.replace('✓ ', '')}: ${s.hist}`, body: s.ev, extra: fine });
  lab.setFacts(facts.slice(0, st === 0 && c === null ? 1 : facts.length));
}
function infoVotes(t) {
  const v = t.v, pc = (x) => v.pct(x, lang);
  lab.setGlow('rgba(100, 150, 230, .22)');
  if (!S.opened) {
    lab.setReadout(`${S.guess} %`, v.guess, '', '#e0604f');
    lab.setState({ emo: '🗳️', title: v.q, lead: v.ask, body: '', extra: '' }); lab.setFacts([]); return;
  }
  lab.setReadout(pc(PARTIES[1].pct), v.names[1], `${v.guess}: ${S.guess} %`, '#e0604f');
  const note = `<div class="y-fine">${esc(t.fine)}</div>`;
  if (S.card >= 0) { const cd = v.cards[S.card]; lab.setState({ emo: cd[1], title: cd[0], lead: cd[2], body: '', extra: note }); }
  else if (S.tap >= 0) {
    const p = PARTIES[S.tap];
    lab.setState({ emo: '📊', title: `${v.rowT[S.tap]}: ${pc(p.pct)}`, lead: S.tap === 5 ? v.other : v.row(p.votes.toLocaleString(lang), p.seats, SEATS_ALL), body: '', extra: note });
  } else lab.setState({ emo: '📊', title: v.title, lead: v.lead(pc(PARTIES[0].pct), pc(PARTIES[1].pct), `${S.guess} %`), body: v.body, extra: note });
  lab.setFacts(v.facts);
}
