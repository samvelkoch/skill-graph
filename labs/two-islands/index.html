function animate(dt, time) {
  const v = lab.view;
  S.sk = clamp(S.sk + (S.storm ? dt / 0.8 : -dt / 0.8), 0, 1);
  if (v === 'money') {
    const M = S.money, d = M.p - M.dp;
    M.dp = Math.abs(d) < 0.02 ? M.p : M.dp + d * (1 - Math.exp(-dt * M.k));
    if (M.auto) { $('tiR').value = Math.round(M.dp); renderMoneyText(M.dp); if (M.dp === M.p) M.auto = false; }
    return;
  }
  const P = S[v];
  ['a', 'b'].forEach((k) => { const dk = 'd' + k, d = P[k] - P[dk]; P[dk] = Math.abs(d) < 0.02 ? P[k] : P[dk] + d * (1 - Math.exp(-dt * P.k)); });
  const tgt = P.trade && !S.storm && time >= P.hold ? 1 : 0;
  P.tp += clamp(tgt - P.tp, -dt / 0.9, dt / 2.6);
  if (Math.abs(tgt - P.tp) < 0.001) P.tp = tgt;
  if (P.auto) {
    $('tiA').value = Math.round(P.da); $('tiB').value = Math.round(P.db); updateSliderText(P);
    if (P.da === P.a && P.db === P.b) P.auto = false;
  }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  animate(dt, time);
  const s = Math.min(w / 350, h / 440), W0 = w / s, W = v === 'money' ? 350 : Math.min(W0, 560), X0 = (W0 - W) / 2, oy = (h / s - 440) / 2;
  GW = W;
  if (v === 'money') {
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#4a3c78'); g.addColorStop(1, '#251e40'); c.fillStyle = g; c.fillRect(0, 0, w, h);
    const lg = c.createRadialGradient(w * 0.3, h * 0.25, 10, w * 0.3, h * 0.25, Math.max(w, h)); lg.addColorStop(0, 'rgba(255,220,160,.18)'); lg.addColorStop(1, 'rgba(255,220,160,0)'); c.fillStyle = lg; c.fillRect(0, 0, w, h);
  } else sea(c, w, h, time, 1 + 2.2 * S.sk);
  c.save(); c.scale(s, s); c.translate(X0, oy);
  if (v === 'money') sceneMoney(c, w, h, time, dt); else sceneIslands(c, w, h, v, time, W);
  c.restore();
  if (S.sk > 0.01 && v === 'islands') stormFx(c, w, h, time, S.sk);
  if (S.pencil) { c.save(); c.scale(s, s); c.translate(X0, oy); pencilScene(c, w, h, time, W); c.restore(); }
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function reveal(v) {
  const pre = PRESET[v];
  if (v === 'money') { const M = S.money; M.p = pre.p; M.k = 2.2; M.auto = true; return; }
  const P = S[v]; P.a = pre.a; P.b = pre.b; P.trade = true; P.k = 2.2; P.auto = true; P.hold = now() + 1.6;
}
function clearSecrets() { S.stormTok++; S.storm = false; S.stormOn = false; S.pencil = false; }
function onView() { clearSecrets(); render(); }
function runStorm() {
  S.pencil = false; S.stormOn = true;
  if (lab.view !== 'islands') { lab.view = 'islands'; lab.renderChrome(); }
  S.asked.islands = true;
  const P = S.islands, tok = ++S.stormTok;
  Object.assign(P, { a: 10, b: 0, trade: true, k: 2.2, auto: true, hold: now() + 1.4 }); S.storm = false;
  render();
  setTimeout(() => {
    if (tok !== S.stormTok) return;
    S.storm = true; P.trade = false; P.a = 5; P.b = 5; P.k = 2.2; P.auto = true; sfx.bad(); render();
  }, 5000);
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'opt') {
    if (S.guess[v] !== null) return;
    const i = +b.dataset.i; S.guess[v] = i; S.asked[v] = true; store.set('two-islands:asked:' + v, true);
    (i === 0 ? sfx.good : sfx.bad)(); reveal(v); render(); showStage();
  } else if (act === 'trade') {
    if (S.storm) return;
    const P = S[v]; P.trade = !P.trade; P.hold = now(); P.k = 12; sfx.snap(); render();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'a') { if (S.stormOn) { S.stormTok++; S.storm = false; S.stormOn = false; render(); } else runStorm(); }
    else { S.pencil = !S.pencil; S.pencilAt = now(); if (S.pencil) { S.stormOn = false; S.storm = false; S.stormTok++; } }
    sfx.click(); render();
  }
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = lab.view;
  if (id === 'tiA' || id === 'tiB') { const P = S[v]; P.k = 12; P.auto = false; P[id === 'tiA' ? 'a' : 'b'] = +ev.target.value; sfx.tick(); render(); }
  else if (id === 'tiR') { const M = S.money; M.k = 12; M.auto = false; M.p = +ev.target.value; sfx.tick(); render(); }
});

// --- one render per change: controls, readout, state card ---------------------------------------------------
function renderAsk(t, v) {
  const el = $('tiAsk'), g = S.guess[v], asking = !S.asked[v];
  if (!asking && g === null) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const q = { islands: t.qIslands, better: t.qBetter, money: t.qMoney }[v], opts = { islands: t.optsIslands, better: t.optsBetter, money: t.optsMoney }[v], why = { islands: t.islandsWhy, better: t.betterWhy, money: t.moneyWhy }[v];
  el.style.display = 'block';
  el.innerHTML = `<div class="ti-q">${esc(q)}</div><div class="ti-opts">${ORDER[v].map((i) => `<button class="ti-opt${g !== null ? (i === 0 ? ' good' : i === g ? ' bad' : '') : ''}" data-act="opt" data-i="${i}"${g !== null ? ' disabled' : ''}>${esc(opts[i])}</button>`).join('')}</div>`
    + (g !== null ? `<div class="ti-verdict ${g === 0 ? 'ok' : 'no'}"><b>${esc(g === 0 ? t.right : t.notQuite)}</b> ${esc(why)}</div>` : '');
}
function renderMoneyText(p) {
  const t = T[lang], cur = CUR[lang];
  $('tiRn').textContent = t.rate;
  $('tiRv').innerHTML = cur.map((cu) => `<b>${esc(rateText(cu, p))}</b>`).join('');
  $('tiRx').textContent = t.exampleRates;
  const parts = cur.map((cu) => `${fmt(priceOf(cu, p))} ${cu.sym}`);
  lab.setReadout(parts[0], t.priceYours, parts[1] ?? '', '#e6c36a');
}
const sumParts = (f, c) => [f ? `${f} 🐟` : '', c ? `${c} 🥥` : ''].filter(Boolean).join(' + ') || '0';
const gainParts = (f, c) => [f ? `${f > 0 ? '+' : '−'}${Math.abs(f)} 🐟` : '', c ? `${c > 0 ? '+' : '−'}${Math.abs(c)} 🥥` : ''].filter(Boolean).join(' ') || '0';
function renderIsl(t, v, asking) {
  const P = S[v], pa = PROD[v].A, pb = PROD[v].B;
  $('tiAn').textContent = t.islandA; $('tiBn').textContent = t.islandB;
  $('tiAp').textContent = t.perDay(pa[0], pa[1]); $('tiBp').textContent = t.perDay(pb[0], pb[1]);
  if (+$('tiA').value !== Math.round(P.auto ? P.da : P.a)) $('tiA').value = Math.round(P.auto ? P.da : P.a);
  if (+$('tiB').value !== Math.round(P.auto ? P.db : P.b)) $('tiB').value = Math.round(P.auto ? P.db : P.b);
  updateSliderText(P);
  const T_ = $('tiT'); T_.textContent = `${t.trade}: ${P.trade && !S.storm ? t.tradeOn : t.tradeOff}`; T_.classList.toggle('on', P.trade && !S.storm); T_.disabled = S.storm;
  const r = stocks(v, P.a, P.b, P.trade && !S.storm ? 1 : 0);
  $('tiNote').textContent = v === 'better' && P.trade && !S.storm && r.gf > 0 ? t.boat(r.gf, r.gc) : '';
  if (v === 'better') {
    $('tiCost').innerHTML = `<div><i class="ti-dot" style="background:#e8604c"></i><span>${esc(t.islandA)}<small>${esc(t.costLine('1'))}</small></span></div>`
      + `<div class="hi"><i class="ti-dot" style="background:#4c8be8"></i><span>${esc(t.islandB)}<small>${esc(t.costLine('⅓'))}</small></span></div>`;
  }
  const col = v === 'islands' ? '#4ea8ff' : '#f2d49b';
  lab.setGlow(v === 'islands' ? 'rgba(40, 140, 210, .3)' : 'rgba(242, 212, 155, .2)');
  if (asking) { lab.setReadout('?', '', '', col); return; }
  if (v === 'islands') {
    const tf = r.A.f + r.B.f, tc = r.A.c + r.B.c;
    const nA = r.A.f + r.A.c, nB = r.B.f + r.B.c;
    if (r.A.f === r.B.f && r.A.c === r.B.c) lab.setReadout(`${sumParts(r.A.f, r.A.c)} = ${nA}`, t.onEach, t.total(tf, tc), col);
    else lab.setReadout(`<span style="color:#e8604c">●</span> ${nA} &nbsp; <span style="color:#4c8be8">●</span> ${nB}`, t.total(tf, tc), '', col);
  } else {
    const dA = [r.A.f - BASE.A.f, r.A.c - BASE.A.c], dB = [r.B.f - BASE.B.f, r.B.c - BASE.B.c];
    lab.setReadout(`<span style="color:#e8604c">●</span> ${gainParts(...dA)} &nbsp; <span style="color:#4c8be8">●</span> ${gainParts(...dB)}`, t.compared, '', col);
  }
}
function render() {
  const t = T[lang], v = lab.view, asking = !S.asked[v], isl = v !== 'money';
  document.body.dataset.v = v;
  $('tiPlay').style.display = asking ? 'none' : 'block';
  $('tiIsl').style.display = isl ? 'block' : 'none';
  $('tiMoney').style.display = v === 'money' ? 'block' : 'none';
  $('tiCountry').style.display = v === 'money' ? 'block' : 'none';
  $('tiSecs').style.display = asking ? 'none' : 'flex';
  renderAsk(t, v);
  $('tiCost').style.display = v === 'better' ? 'grid' : 'none';
  if (isl) renderIsl(t, v, asking);
  else {
    const M = S.money;
    if (+$('tiR').value !== Math.round(M.auto ? M.dp : M.p)) $('tiR').value = Math.round(M.auto ? M.dp : M.p);
    lab.setGlow('rgba(230, 195, 106, .22)'); renderMoneyText(M.auto ? M.dp : M.p);
    $('tiCountry').innerHTML = `<h4>${esc(t.country)}</h4><div class="ti-cols"><div><h5>${esc(t.sells)}</h5><ul>${t.exports.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>`
      + `<div><h5>${esc(t.buys)}</h5><ul>${t.imports.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div></div><div class="ti-src">Source: OEC, country profiles</div>`;
  }
  const open = secret.unlocked();
  const sc = (k, emo, on) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('tiSecs').innerHTML = sc('a', '🛑', S.stormOn) + sc('b', '✏️', S.pencil);
  const q = { islands: t.qIslands, better: t.qBetter, money: t.qMoney }[v];
  let st;
  if (S.pencil) st = { emo: '✏️', title: t.secrets.b[0], lead: t.secrets.b[1], body: '' };
  else if (S.storm) st = { emo: '🛑', title: t.secrets.a[0], lead: t.secrets.a[1], body: '' };
  else if (asking) st = { emo: '🤔', title: q, lead: '', body: '' };
  else st = t.state[v];
  lab.setState({ ...st, extra: '' });
  lab.setFacts(asking ? [] : t.facts[v]);
}
render();
</script>
