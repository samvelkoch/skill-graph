  c.save(); c.beginPath(); c.arc(GX, GY, GR, 0, Math.PI * 2); c.clip();
  c.fillStyle = '#f2f8ff'; c.beginPath(); c.moveTo(...P(GR, -90 - 26)); c.arc(GX, GY, GR, (-90 - 26) * Math.PI / 180, (-90 + 26) * Math.PI / 180); c.lineTo(...P(GR - 8, -90 + 20)); c.arc(GX, GY, GR - 8, (-90 + 20) * Math.PI / 180, (-90 - 20) * Math.PI / 180, true); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(...P(GR, 90 - 26)); c.arc(GX, GY, GR, (90 - 26) * Math.PI / 180, (90 + 26) * Math.PI / 180); c.lineTo(...P(GR - 8, 90 + 20)); c.arc(GX, GY, GR - 8, (90 + 20) * Math.PI / 180, (90 - 20) * Math.PI / 180, true); c.closePath(); c.fill();
  c.restore();
  c.strokeStyle = '#7fb4e6'; c.lineWidth = 1.8; c.beginPath(); c.arc(GX, GY, GR, 0, Math.PI * 2); c.stroke();
  const hl = c.createRadialGradient(GX - 24, GY - 26, 2, GX - 24, GY - 26, 26); hl.addColorStop(0, 'rgba(255,255,255,.35)'); hl.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = hl; c.beginPath(); c.arc(GX, GY, GR, 0, Math.PI * 2); c.fill();
  if (S.done3) {
    const flow = (r, a0, a1, col, wid) => {
      const pts = [], n = Math.max(2, Math.ceil(Math.abs(a1 - a0) / 6)); for (let i = 0; i <= n; i++) pts.push(P(r, lerp(a0, a1, i / n)));
      line(pts, col, wid);
    };
    const line = (pts, col, wid) => {
      c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = col; c.lineWidth = wid; c.setLineDash([7, 5]); c.lineDashOffset = -NOW * 16;
      c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.stroke(); c.restore();
      const a = pts[pts.length - 2], b = pts[pts.length - 1], d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (b[0] - a[0]) / d, uy = (b[1] - a[1]) / d;
      c.fillStyle = col; c.beginPath(); c.moveTo(b[0] + ux * 5, b[1] + uy * 5); c.lineTo(b[0] - ux * 3 - uy * 5, b[1] - uy * 3 + ux * 5); c.lineTo(b[0] - ux * 3 + uy * 5, b[1] - uy * 3 - ux * 5); c.closePath(); c.fill();
    };
    flow(48, 80, -76, '#ffb067', 2.6);               // warm surface water drifts toward the pole
    line([P(52, -98), P(30, -98)], '#7cc2ff', 3.4);     // sinks near Greenland
    flow(26, -98, -262, '#5aa8f5', 2.6);              // flows deep, far to the south
    line([P(52, 98), P(30, 98)], '#7cc2ff', 3.4);       // sinks near Antarctica
    flow(26, 98, -8, '#5aa8f5', 2.6);                 // flows deep, north
    line([P(28, -8), P(46, -8)], '#9fd0ff', 2.6);       // rises far away
    pill(c, t.s.spots[0], GX, GY - GR - 14, { size: 12.5 });
    pill(c, t.s.spots[1], GX, GY + GR + 14, { size: 12.5 });
  }
}

// --- one canvas, three pictures ------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt) => {
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  EX = { l: -ox / s, r: W + ox / s, t: -oy / s, b: H + oy / s };
  NOW = performance.now() / 1000;
  simTick(NOW);
  c.save(); c.translate(ox, oy); c.scale(s, s);
  const v = lab.view;
  if (v === 'bounce') (S.sec === 'shirt' ? drawShirts(c) : drawBounce(c, dt));
  else if (v === 'loop') drawLoop(c); else drawSink(c);
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function startRun1(delay = 0) { S.run1 = performance.now() / 1000 + delay; S.cnt = 0; S.abs = 0; heatV = 0; readout1(); }
function startSecret(k) {
  if (lab.view !== 'bounce') $('views').querySelector('[data-view=bounce]')?.click();
  if (S.sec === k) { S.sec = null; S.run1 = null; S.cnt = 0; S.abs = 0; heatV = 0; S.fresh1 = false; return; }
  S.sec = k; S.fresh1 = false;
  if (k === 'shirt') { S.shirtT0 = performance.now() / 1000; S.tb = 20; S.tw = 20; }
  else { S.surf = 'snow'; S.sootT0 = performance.now() / 1000; startRun1(1.3); }
}
function drop(which) { S.drop = { t0: performance.now() / 1000, which }; showStage(); }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a], [data-s], [data-sh], [data-i], [data-sec]'); if (!b) return;
  if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    sfx.click(); startSecret(b.dataset.sec); showStage(); render(); return;
  }
  if (b.dataset.s) { // a surface
    S.surf = b.dataset.s; S.sec = null; S.fresh1 = false; startRun1(); sfx.click(); showStage(); render(); return;
  }
  if (b.dataset.sh) { S.shape = b.dataset.sh; sfx.tick(); render(); return; }
  if (b.dataset.i !== undefined) {
    const i = +b.dataset.i;
    if (!S.done3) { S.pick = i; sfx.tick(); } else { S.last3 = i; drop([i]); sfx.click(); }
    render(); return;
  }
  const a = b.dataset.a;
  if (a === 'g-') { S.g1 = clamp(S.g1 - 1, 0, 10); sfx.tick(); }
  else if (a === 'g+') { S.g1 = clamp(S.g1 + 1, 0, 10); sfx.tick(); }
  else if (a === 'send1') { S.done1 = true; S.fresh1 = true; S.ok1 = S.g1 === BOUNCE.ocean; S.surf = 'ocean'; startRun1(); (S.ok1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'again1') {
    if (S.sec === 'shirt') { S.shirtT0 = performance.now() / 1000; S.tb = 20; S.tw = 20; }
    else { if (S.sec === 'soot') S.sootT0 = performance.now() / 1000; startRun1(S.sec === 'soot' ? 1.3 : 0); }
    sfx.click(); showStage();
  } else if (a === 'run10') {
    if (!S.done2 && S.shape === null) return;
    if (!S.done2) { S.w = 0; $('ibW').value = 0; S.pending2 = true; }
    S.q = Math.min(S.q + 10, 40 - S.series.length); sfx.click(); showStage();
  } else if (a === 'run1') { S.q = Math.min(S.q + 1, 40 - S.series.length); sfx.click(); }
  else if (a === 'reset') { S.series = [SIM.area]; S.start = 1; S.shown = 1; S.q = 0; S.anim = null; sfx.click(); }
  else if (a === 'dropall') { if (S.pick === null && !S.done3) return; if (!S.done3) { S.done3 = true; S.ok3 = S.pick === 0; (S.ok3 ? sfx.good : sfx.bad)(); } S.last3 = -1; drop([0, 1, 2, 3]); }
  render();
});
$('ibW').addEventListener('input', (ev) => { S.w = +ev.target.value; render(); });

// --- one render per change: controls, readout and the state card ----------------------------------------------
function readout1() {
  if (lab.view !== 'bounce') return;
  const t = T[lang];
  if (S.sec === 'shirt') lab.setReadout(`${S.tb} / ${S.tw} °C`, t.shirt.sub, '', '#ffb34a');
  else if (!S.run1) lab.setReadout('?', '', '', '#ffcf52');
  else lab.setReadout(String(S.cnt), t.b.of10, t.b.heat(S.abs * 10), '#ffcf52');
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('ibV1').hidden = v !== 'bounce'; $('ibV2').hidden = v !== 'loop'; $('ibV3').hidden = v !== 'sink';
  $('ibSec').innerHTML = ['a', 'b'].map((k, i) => { const key = i ? 'soot' : 'shirt', un = secret.unlocked();
    return `<button type="button" class="chip secret ${un ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-sec="${key}">${un ? (i ? '🌑' : '👕') : '🔒'} ${esc(t.secrets[k][0])}</button>`; }).join('');
  if (v === 'bounce') renderBounce(t); else if (v === 'loop') renderLoop(t); else renderSink(t);
}
function renderBounce(t) {
  const b = t.b, sec = S.sec, pre = !S.done1 && !sec;
  $('ibP1').hidden = !pre; $('ibR1').hidden = pre;
  $('ibQ1').textContent = b.q; $('ibG').textContent = S.g1; $('ibSend1').textContent = b.send;
  $('ibSurf').hidden = !S.done1;
  $('ibSurf').innerHTML = SURFS.map((k) => `<button type="button" class="chip ${!sec && S.surf === k ? 'on' : ''}" data-s="${k}">${SURF_EMO[k]} ${esc(b.surf[k])}</button>`).join('');
  $('ibAgain1').textContent = sec === 'shirt' ? t.shirt.again : b.again;
  const n = sec === 'soot' ? SOOT_BOUNCE : BOUNCE[S.surf];
  if (sec === 'shirt') lab.setState({ emo: '👕', title: t.secrets.a[0], lead: t.shirt.lead, body: t.shirt.body, extra: '' });
  else if (sec === 'soot') lab.setState({ emo: '🌑', title: t.secrets.b[0], lead: t.soot.lead(n), body: t.soot.body, extra: '' });
  else if (!S.done1) lab.setState({ emo: '🤔', title: b.pre[0], lead: b.q, body: b.pre[1], extra: '' });
  else if (S.fresh1) lab.setState({ emo: S.ok1 ? '✅' : '💡', title: S.ok1 ? b.right : b.wrongT(S.g1, n), lead: b.ovLead(n), body: b.ovBody, extra: '' });
  else lab.setState({ emo: SURF_EMO[S.surf], title: b.surf[S.surf], lead: b.res(n), body: b.text[S.surf], extra: `<div>${esc(b.note)}</div>` });
  lab.setGlow('rgba(255, 190, 90, .26)');
  readout1();
  lab.setFacts(S.done1 || sec ? t.facts.bounce : []);
}
function renderLoop(t) {
  const l = t.l, pre = !S.done2;
  $('ibP2').hidden = !pre; $('ibR2').hidden = pre;
  $('ibQ2').textContent = l.q;
  $('ibShapes').innerHTML = SHAPES.map((k) => `<button type="button" class="chip ${S.shape === k ? 'on' : ''}" data-sh="${k}">${esc(l.shapes[k])}</button>`).join('');
  $('ibRun10p').textContent = l.run10; $('ibRun10p').disabled = S.shape === null || S.q > 0;
  $('ibWL').textContent = l.warm; $('ibWV').textContent = `+${S.w}`;
  $('ibRun1').textContent = l.run1; $('ibRun10').textContent = l.run10; $('ibReset').textContent = l.reset;
  const n = S.series.length - 1, ice = S.series[S.series.length - 1];
  lab.setReadout(fmt(ice), l.unit, n ? l.pill(n) : '', '#8fd0ff');
  lab.setGlow('rgba(110, 170, 240, .26)');
  if (!S.done2 && !S.pending2) lab.setState({ emo: '🧊', title: l.pre[0], lead: l.q, body: l.pre[1], extra: '' });
  else if (S.anim || S.q > 0) { const r = l.running(S.anim ? n + 1 : n); lab.setState({ emo: '☀️', title: r[0], lead: r[1], body: '', extra: '' }); }
  else if (S.ok2 !== null && n === 10 && !S.verdictShown) { S.verdictShown = true; lab.setState({ emo: S.ok2 ? '✅' : '💡', title: S.ok2 ? l.right : l.wrongT, lead: S.ok2 ? l.rightLead : l.wrongLead, body: '', extra: '' }); }
  else if (S.verdictShown && n === 10) lab.setState({ emo: S.ok2 ? '✅' : '💡', title: S.ok2 ? l.right : l.wrongT, lead: S.ok2 ? l.rightLead : l.wrongLead, body: '', extra: '' });
  else lab.setState({ emo: '🔁', title: l.idle[0], lead: l.idle[1], body: '', extra: '' });
  if (n !== 10) S.verdictShown = false;
  lab.setFacts(t.facts.loop);
}
function renderSink(t) {
  const s = t.s, dropped = S.done3;
  $('ibQ3').textContent = s.q;
  $('ibDrops').innerHTML = s.liq.map((l, i) => `<button type="button" class="chip ${!dropped && S.pick === i ? 'on' : ''} ${dropped && S.last3 === i ? 'on' : ''}" data-i="${i}"><span class="ib-dot" style="background:${LIQ_COL[i]}"></span>${esc(l[0])}</button>`).join('');
  $('ibDropAll').textContent = s.dropAll; $('ibDropAll').disabled = !dropped && S.pick === null;
  $('ibTap').textContent = dropped ? s.tap : s.pickFirst;
  lab.setGlow('rgba(80, 150, 240, .26)');
  if (!dropped) {
    lab.setReadout('?', '', '', '#5aa8f5');
    lab.setState({ emo: '🧪', title: s.pre[0], lead: s.q, body: s.pre[1], extra: '' });
  } else if (S.last3 >= 0) {
    const i = S.last3; lab.setReadout(esc(s.liq[i][0]), s.liq[i][1], '', LIQ_COL[i]);
    lab.setState({ emo: '💧', title: s.liq[i][0], lead: s.one[i], body: s.body, extra: `<div>${esc(s.globe)}</div>` });
  } else {
    lab.setReadout(esc(s.liq[0][0]), s.liq[0][1], '', LIQ_COL[0]);
    lab.setState({ emo: S.ok3 ? '✅' : '💡', title: S.ok3 ? s.right : s.wrongT, lead: s.lead, body: s.body, extra: `<div>${esc(s.globe)}</div>` });
  }
  lab.setFacts(t.facts.sink);
}
render();
</script>
