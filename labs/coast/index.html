const C = { sea1: '#5FB8E8', sea2: '#1F6FA8', foam: '#FFFFFF', sand: '#F2D59A', cl1: '#C9A27A', cl2: '#B08A63', cl3: '#97734F', grass: '#8CCB6A', weed: '#3E7D4E', mud: '#8A7A64' };
const FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const sm = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeIO = (x) => { x = clamp01(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const easeOut = (x) => { x = clamp01(x); return 1 - (1 - x) * (1 - x); };
const backOut = (x) => { x = clamp01(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const rngOf = (seed) => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const hexRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); };
const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, Math.PI * 2); };
const vgrad = (c, y0, y1, stops) => { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const hgrad = (c, x0, x1, stops) => { const g = c.createLinearGradient(x0, 0, x1, 0); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rgrad = (c, x, y, r, stops) => { const g = c.createRadialGradient(x, y, 0, x, y, Math.max(0.01, r)); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };

// a dark rounded label, clamped inside the canvas
function pill(c, w, text, x, y, align = 'left', size = 13, fill = 'rgba(10,12,20,.8)', ink = '#fff') {
  c.save(); c.globalAlpha = 1;
  c.font = `800 ${size}px Nunito, sans-serif`; c.textBaseline = 'middle'; c.textAlign = 'left';
  const tw = c.measureText(text).width, bw = tw + 18, bh = size + 12;
  let l = align === 'right' ? x - bw : align === 'center' ? x - bw / 2 : x;
  l = Math.min(w - bw - 6, Math.max(6, l));
  c.fillStyle = fill; c.beginPath(); c.roundRect(l, y - bh / 2, bw, bh, bh / 2); c.fill();
  c.fillStyle = ink; c.fillText(text, l + 9, y + 1);
  c.restore();
  return { x: l, w: bw, h: bh };
}
function emoji(c, ch, x, y, size, rot = 0, sx = 1, sy = 1) {
  c.save(); c.globalAlpha = 1; c.fillStyle = '#000';
  c.translate(x, y); c.rotate(rot); c.scale(sx, sy);
  c.font = `${size}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(ch, 0, 0);
  c.restore();
}
function shadow(c, x, y, rx, ry, a = .3) { c.save(); c.globalAlpha = 1; ell(c, x, y, rx, ry); c.fillStyle = `rgba(10,12,20,${a})`; c.fill(); c.restore(); }

function sky(c, w, yb, time, sunX = .14) {
  c.fillStyle = vgrad(c, 0, yb, [[0, mix(C.sea1, '#ffffff', .45)], [1, mix(C.sea1, '#ffffff', .85)]]);
  c.fillRect(0, 0, w, yb + 2);
  c.fillStyle = rgrad(c, w * sunX, yb * .22, yb * .5, [[0, 'rgba(255,248,214,.95)'], [.25, 'rgba(255,244,200,.45)'], [1, 'rgba(255,244,200,0)']]);
  c.fillRect(0, 0, w, yb);
  // clouds drift slowly
  const clouds = [[.25, .16, 1], [.62, .1, .75], [.9, .22, .6]];
  c.save(); c.globalAlpha = 1;
  clouds.forEach(([fx, fy, s], i) => {
    const span = w + 160, x = ((fx * w + time * (5 + i * 2) + 80) % span) - 80, y = yb * fy, r = yb * .05 * s;
    c.fillStyle = 'rgba(255,255,255,.9)';
    [[0, 0, 1], [r * 1.1, -r * .35, 1.2], [r * 2.3, 0, .95], [r * 1.2, r * .25, 1.1]].forEach(([dx, dy, k]) => { ell(c, x + dx, y + dy, r * k * 1.15, r * k * .8); c.fill(); });
  });
  c.restore();

      [-1, 0, 1].forEach((i) => { const mx = x + i * topHW * .72 - mw * .5; c.fillStyle = sand; c.fillRect(mx, top - 5, mw, 6); c.strokeStyle = edge; c.lineWidth = 1.1; c.strokeRect(mx, top - 5, mw, 6); });
      if (p.keep) { c.fillStyle = '#4a3010'; c.beginPath(); c.moveTo(x - hw * .3, base); c.lineTo(x - hw * .3, base - ht * .22); c.quadraticCurveTo(x, base - ht * .36, x + hw * .3, base - ht * .22); c.lineTo(x + hw * .3, base); c.closePath(); c.fill(); }
      c.strokeStyle = 'rgba(100,70,30,.45)'; c.lineWidth = 1; for (let i = 1; i < 4; i++) { const yy = top + (base - top) * i / 4.4; c.beginPath(); c.moveTo(x - hw * .7, yy); c.lineTo(x - hw * .1, yy); c.moveTo(x + hw * .1, yy + 3); c.lineTo(x + hw * .7, yy + 3); c.stroke(); }
      c.restore();
    }
    if (!p.wall && (p.keep || p.dx < 0)) { // the flags 🚩 topple as the sand melts
      const fall = sm((m - .1) / .5), fs = Math.max(14, w * .045);
      emoji(c, '🚩', x + fs * .35 + fall * fs * .6, top - fs * .5 + fall * (base - top + fs * .2), fs, fall * 1.5);
    }
  });
}
function drawGraph(c, w, y0, gh, hr, time, show) {
  const x0 = 14, x1 = w - 14, pad = 14, top = y0 + 8, bot = y0 + gh - 22;
  c.save(); c.globalAlpha = 1;
  c.beginPath(); c.roundRect(4, y0, w - 8, gh, 14); c.fillStyle = 'rgba(14,17,28,.8)'; c.fill(); c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.stroke();
  if (!show) { c.restore(); return; } // before the answer the strip is an empty card: the curve would give the answer away
  const X = (t) => x0 + pad + (x1 - x0 - pad * 2) * t / 24, Y = (l) => bot - (bot - top - 6) * l;
  c.beginPath(); for (let t = 0; t <= 24.01; t += .25) t ? c.lineTo(X(t), Y(lvl(t))) : c.moveTo(X(t), Y(lvl(t)));
  c.lineTo(X(24), bot); c.lineTo(X(0), bot); c.closePath(); c.fillStyle = vgrad(c, top, bot, [[0, 'rgba(95,184,232,.75)'], [1, 'rgba(31,111,168,.25)']]); c.fill();
  c.beginPath(); for (let t = 0; t <= 24.01; t += .25) t ? c.lineTo(X(t), Y(lvl(t))) : c.moveTo(X(t), Y(lvl(t)));
  c.strokeStyle = '#fff'; c.lineWidth = 2.4; c.lineJoin = 'round'; c.stroke();
  // hour labels
  c.fillStyle = '#98A0B8'; c.font = '700 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  [0, 6, 12, 18, 24].forEach((t) => { c.fillText(`${t}`, X(t), y0 + gh - 9); c.strokeStyle = 'rgba(152,160,184,.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(X(t), bot); c.lineTo(X(t), bot + 3); c.stroke(); });
  // the two high tides, shown once the reveal is over
  if (S.t.stage === 'done') {
    [2 + 47 / 60, 15 + 12 / 60].forEach((t) => {
      c.strokeStyle = 'rgba(255,255,255,.4)'; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(X(t), Y(1)); c.lineTo(X(t), bot); c.stroke(); c.setLineDash([]);
      circ(c, X(t), Y(1), 6 + Math.sin(time * 4) * 1); c.fillStyle = '#fff'; c.fill(); c.strokeStyle = '#1F6FA8'; c.lineWidth = 2.5; c.stroke();
      pill(c, w, T[lang].t.high, X(t), Y(1) + 15, 'center', 12);
    });
  }
  // the marker for the current hour
  const hx = X(clamp(hr, 0, 24)), hy = Y(lvl(hr));
  c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(hx, top); c.lineTo(hx, bot); c.stroke();
  circ(c, hx, hy, 6); c.fillStyle = '#FF9F5A'; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
  c.restore();
}

// =====================================================================================================================
//  loop
// =====================================================================================================================
const cvLoop = canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view, W = S.w, Tt = S.t;
  // time-lapse
  if (W.run) {
    W.p = clamp(W.p + W.run * dt / W.dur, 0, 1);
    if (W.run > 0 && W.p >= 1) { W.run = 0; W.stage = W.stage === 'tl1' ? 'r1' : 'r2'; (W.stage === 'r1' ? sfx.good : sfx.snap)(); render(); }
    else if (W.run < 0 && W.p <= 0) { W.run = 0; render(); }
    if (v === 'waves' && !S.sec) drawWavesReadout();
  }
  W.mag += clamp((W.stage === 'r1' && !S.sec ? 1 : 0) - W.mag, -dt * 2.5, dt * 2.5);
  // tide clock
  if (Tt.run) {
    Tt.hour = Math.min(24, Tt.hour + dt * 1.5);
    if (Tt.stage === 'run' && Tt.hour >= 15) { Tt.stage = 'run2'; render(); }
    if (Tt.hour >= 24) { Tt.run = false; Tt.stage = 'done'; render(); }
    $('hr').value = Tt.hour;
    if (v === 'tide') drawTideReadout();
  }
  // erosion steps ease towards the target
  const A = S.arch; if (A.cur !== A.to) { const f = easeIO((time - A.t0) / 1.1); A.cur = lerp(A.from, A.to, f); if (f >= 1) A.cur = A.to; }
  if (v === 'waves') { if (S.sec === 'arch') drawArch(c, w, h, dt, time); else if (S.sec === 'grains') drawGrains(c, w, h, dt, time); else drawWaves(c, w, h, dt, time); }
  else if (v === 'shores') drawShores(c, w, h, dt, time);
  else drawTide(c, w, h, dt, time);
});

// =====================================================================================================================
//  input
// =====================================================================================================================
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('cv').addEventListener('click', (ev) => { // click, not pointerdown: a scroll that starts on the canvas must not answer
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, v = lab.view;
  if (v === 'shores' && S.s.stage === 'ask') {
    const i = S.s.rects.findIndex((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
    if (i >= 0) answerShore(i);
  } else if (v === 'waves' && S.sec === 'grains' && S.gr.geo) {
    const { cx, cy, R } = S.gr.geo; let best = -1, bd = 1e9;
    GRAINS.forEach((g, i) => { const d = Math.hypot(x - (cx + g.x * R), y - (cy + g.y * R)) / (g.r * R); if (d < bd) { bd = d; best = i; } });
    if (bd < 2.2) { S.gr.sel = best; S.gr.pop = 0; sfx.click(); render(); }
  }
});
$('hr').addEventListener('input', () => { S.t.run = false; S.t.hour = +$('hr').value; if (S.t.stage !== 'done') { S.t.stage = 'done'; } render(); });
function answerShore(i) {
  const s = S.s, round = ROUNDS[s.i]; if (s.stage !== 'ask') return;
  s.pick = i; s.stage = 'told'; s.answered = true; if (i === round.shore) s.score++;
  s.placed.push({ kind: round.kind, shore: round.shore, slot: round.slot, t0: now(), seed: s.i * 1.7 + 1 });
  (i === round.shore ? sfx.good : sfx.bad)(); showStage(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i, W = S.w, s = S.s, Tt = S.t;
  if (act === 'a1' && W.stage === 'q1') { W.a1 = i; W.stage = 'tl1'; W.answered = true; W.run = 1; W.dur = 6; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'next1') { W.stage = 'q2'; W.run = -1; W.dur = 1; sfx.click(); }
  else if (act === 'a2' && W.stage === 'q2') { W.a2 = i; W.stage = 'tl2'; W.run = 1; W.dur = 3.6; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'wagain') { W.stage = 'q1'; W.answered = false; W.a1 = W.a2 = null; W.run = -1; W.dur = 1.2; sfx.click(); }
  else if (act === 'shore') answerShore(i);
  else if (act === 'snext') { if (s.i >= 5) s.stage = 'sum'; else { s.i++; s.stage = 'ask'; s.pick = null; s.cardT0 = now(); } sfx.click(); }
  else if (act === 'sagain') { Object.assign(s, { i: 0, stage: 'ask', pick: null, score: 0, placed: [], cardT0: now() }); sfx.click(); }
  else if (act === 'ta' && Tt.stage === 'q') { Tt.a = i; Tt.stage = 'run'; Tt.answered = true; Tt.run = true; Tt.hour = 9; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; if (S.sec === 'grains') S.gr.sel = -1; sfx.click();
  } else if (act === 'erode') erodeStep();
  render();
});

// =====================================================================================================================
//  one render per change: controls, readout and the state card
// =====================================================================================================================
function qa(q, opts, act, sel, ok, locked) {
  return `<div class="q">${esc(q)}</div><div class="qo">${opts.map((o, i) => `<button class="qb ${locked ? (i === ok ? 'ok' : i === sel ? 'no' : '') : ''}" data-act="${act}" data-i="${i}"${locked ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
}
const verdict = (good, text, btn) => `<div class="verdict ${good ? 'ok' : 'no'}">${esc(good ? T[lang].right : T[lang].wrong)}</div><p class="vtext">${esc(text)}</p>${btn ?? ''}`;
const stateCard = (key, answered, extra = '') => { const [emo, title, lead] = T[lang].states[key][answered ? 1 : 0]; lab.setState({ emo, title, lead, body: '', extra }); };

function drawWavesReadout() { lab.setReadout(esc(fmtYears(yearsOf(S.w.p))), '', '', C.sea1); }
function drawTideReadout() {
  const t = T[lang].t, hr = S.t.hour, l = lvl(hr);
  lab.setReadout(esc(t.hour(Math.floor(hr % 24 + 24) % 24)), '', S.t.answered ? (l > .75 ? t.high : l < .25 ? t.low : '') : '', C.sea2);
}
function render() {
  const t = T[lang], v = lab.view, W = S.w, sx = S.s, Tt = S.t;
  // only the visible view keeps its buttons in the DOM
  if (v !== 'waves') $('waQa').innerHTML = '';
  if (v !== 'shores') $('shQa').innerHTML = '';
  if (v !== 'tide') $('tdQa').innerHTML = '';
  document.body.dataset.v = v === 'waves' && S.sec ? S.sec : v;
  $('secW').style.display = v === 'waves' ? '' : 'none';
  $('secS').style.display = v === 'shores' ? '' : 'none';
  $('secT').style.display = v === 'tide' ? '' : 'none';
  if (v === 'waves') {
    const open = secret.unlocked();
    const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    $('secChips').innerHTML = chip('arch', '🏛️') + chip('grains', '🔍');
    $('archRow').style.display = S.sec === 'arch' ? '' : 'none';
    $('erodeB').textContent = t.sec.erode;
    if (S.sec) {
      $('waQa').innerHTML = '';
      if (S.sec === 'arch') {
        const k = Math.round(clamp(S.arch.to, 0, 4));
        lab.setReadout(esc(t.sec.steps[k]), `${k + 1} / 5`, '', C.cl2);
        lab.setState({ emo: '🏛️', title: t.secrets.arch[0], lead: t.sec.archText, body: '', extra: '' });
      } else {
        const g = S.gr.sel >= 0 ? GRAINS[S.gr.sel] : null;
        lab.setReadout(g ? esc(t.sec.kinds[g.kind]) : '🔍', '', '', C.sand);
        lab.setState({ emo: '🔍', title: t.secrets.grains[0], lead: t.sec.grainsText, body: '', extra: '' });
      }
      return;
    }
    $('archRow').style.display = 'none';
    const st = W.stage;
    let html;
    if (st === 'q1' || st === 'tl1' || st === 'r1') {
      html = qa(t.w.q1, t.w.o1, 'a1', W.a1, 1, st !== 'q1');
      if (st === 'r1') html += verdict(W.a1 === 1, t.w.r1, `<button class="btn" data-act="next1">${esc(t.next)}</button>`);
    } else {
      html = qa(t.w.q2, t.w.o2, 'a2', W.a2, 1, st !== 'q2');
      if (st === 'r2') html += verdict(W.a2 === 1, t.w.r2, `<button class="btn" data-act="wagain">${esc(t.again)}</button>`);
    }
    $('waQa').innerHTML = html;
    drawWavesReadout();
    stateCard('waves', W.answered);
  } else if (v === 'shores') {
    const round = ROUNDS[Math.min(sx.i, 5)], told = sx.stage === 'told';
    let html;
    if (sx.stage === 'sum') html = `<div class="verdict ok">${sx.score} / 6</div><p class="vtext">${esc(t.s.sum)}</p><button class="btn" data-act="sagain">${esc(t.again)}</button>`;
    else {
      html = qa(t.s.q(t.s.animals[sx.i]), t.s.shores, 'shore', sx.pick, round.shore, told);
      if (told) html += verdict(sx.pick === round.shore, t.s.why[sx.i], `<button class="btn" data-act="snext">${esc(t.next)}</button>`);
    }
    $('shQa').innerHTML = html;
    const done = sx.placed.length;
    lab.setReadout(`${done}/6`, '', sx.answered ? `✓ ${sx.score}` : '', '#FF9F5A');
    stateCard('shores', sx.answered);
  } else {
    const st = Tt.stage;
    $('tdQa').innerHTML = qa(t.t.q, t.t.o, 'ta', Tt.a, 1, st !== 'q') + (st === 'run2' || st === 'done' ? verdict(Tt.a === 1, t.t.r) : '');
    $('hrRow').style.display = st === 'q' ? 'none' : '';
    $('hr').setAttribute('aria-label', t.views.tide);
    $('hr').value = Tt.hour;
    $('hr0').textContent = t.t.hour(0); $('hr1').textContent = t.t.hour(12); $('hr2').textContent = t.t.hour(24);
    drawTideReadout();
    stateCard('tide', Tt.answered, Tt.answered ? `<div class="fine">${esc(t.fine)}</div>` : '');
  }
}
render();
</script>
