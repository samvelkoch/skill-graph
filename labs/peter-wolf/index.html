let AC = null, master = null, bus = null;
function ac() {

  if (vk === 'bird') { osc('sine', f, 1); osc('sine', f * 2, 0.22); att = 0.035; rel = 0.08; vib = 10; breath = true; }
  else if (vk === 'duck') { osc('sawtooth', f, 1); filt('bandpass', 1200, 2); att = 0.04; rel = 0.09; pk = vol * 2.2; vib = 5; }
  else if (vk === 'cat') { osc('square', f, 1); filt('lowpass', 2000, 0.7); att = 0.012; rel = 0.05; dur *= 0.8; }
  else if (vk === 'grandpa') { osc('sawtooth', f, 1); filt('lowpass', 900, 1); att = 0.05; rel = 0.12; buzz = true; }

function voicing(m, vk, oct) {

  const L = litNow(), sp = S.spot;
  if (L && (sp.hero === L.hero || sp.a <= 0.001)) {
    Object.assign(sp, L, { outline: L.outline ?? null, tummy: !!L.tummy }); sp.a = Math.min(1, sp.a + dt / .35);
  } else sp.a = Math.max(0, sp.a - dt / .2);
  S.wolfUp += ((sp.tummy && sp.hero === 'wolf' && sp.a > 0 ? 1 : 0) - S.wolfUp) * Math.min(1, dt * 5);
}
function drawParts(c) {
  for (const q of PART) {
    const f = q.age / q.life;
    if (q.k === 'note') { c.globalAlpha = clamp(1 - f * f, 0, 1); drawNote(c, q.x, q.y, q.sz, q.col, q.kind, Math.sin(q.age * 3 + q.ph) * .25); }
    else if (q.k === 'smoke') { c.globalAlpha = .4 * (1 - f); c.fillStyle = '#f3f0ea'; circ(c, q.x, q.y, q.sz * (1 + f * 2.4)); c.fill(); }
    else { c.globalAlpha = .55 * (1 - f); c.fillStyle = '#e8d8b0'; circ(c, q.x, q.y, q.sz * (1 + f)); c.fill(); }
  }
  c.globalAlpha = 1;
}

// --- one frame -------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt) => {
  const now = nowS(), s = Math.min(w / VW, h / VH), ox = (w - VW * s) / 2, oy = (h - VH * s) / 2;
  FR = { s, ox, oy };
  tick(now, dt);
  const X0 = -ox / s, X1 = (w - ox) / s, Y0 = -oy / s, Y1 = (h - oy) / s;
  c.save(); c.translate(ox, oy); c.scale(s, s);
  c.lineJoin = 'round'; c.lineCap = 'round';
  drawSky(c, X0, X1, Y0, Y1, now);
  drawForest(c, X0, X1);
  drawMeadow(c, X0, X1, Y1);
  drawPath(c);
  drawPond(c, now);
  drawTree(c);
  drawHouse(c, now);
  drawFence(c);
  drawHero(c, 'wolf', now);
  drawBushes(c);
  drawHero(c, 'bird', now); drawHero(c, 'duck', now); drawHero(c, 'cat', now); drawHero(c, 'grandpa', now);
  drawHero(c, lab.view === 'make' ? S.mk.hero : 'peter', now); // in the third view a new hero takes Peter's place
  c.restore();
  const sp = S.spot;
  if (sp.a > 0.001 && sp.hero) {
    drawSpot(c, w, h, ease(sp.a), HERO[sp.hero]);
    c.save(); c.translate(ox, oy); c.scale(s, s);
    if (sp.outline && sp.outline !== sp.hero) { // the hero whose tune this is
      const H = HERO[sp.outline];
      c.save(); c.globalAlpha = .75 * ease(sp.a); c.strokeStyle = '#ffffff'; c.lineWidth = 2; c.setLineDash([5, 5]); c.lineDashOffset = -now * 12;
      circ(c, H.x, H.y, H.sz * .62); c.stroke(); c.restore();
    }
    if (sp.tummy && sp.hero === 'wolf') { // the duck is still alive inside the wolf
      const H = HERO.wolf, y = H.y - 15 * S.wolfUp + 10;
      c.save(); c.globalAlpha = 1; c.fillStyle = '#fffbe8'; c.strokeStyle = '#e2b552'; c.lineWidth = 1.5; circ(c, H.x, y, 12 * ease(sp.a)); c.fill(); c.stroke();
      c.font = `${15 * ease(sp.a)}px ${EMF}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000'; c.fillText(EMOJI.duck, H.x, y + 1); c.restore();
    }
    const B = BADGE[sp.hero];
    drawBadge(c, B[0], B[1], sp.badge, sp.a, s);
    c.restore();
  }
  c.save(); c.translate(ox, oy); c.scale(s, s); drawParts(c); c.restore();
});

// --- controls ---------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const gTune = () => S.g.order[S.g.i];
function gPlay() { // the tune is hidden while the child guesses: no spotlight, no hops, no badge
  S.g.played = true; const k = gTune();
  playLayers([{ tune: k, voice: k }], { hero: k, visible: S.g.phase === 'rev' });
}
function gPick(k) {
  const g = S.g;
  if (g.phase !== 'await') return;
  if (!g.played) { const b = $('gPlay'); b.classList.remove('pw-pulse'); void b.offsetWidth; b.classList.add('pw-pulse'); return; }
  const tune = gTune(), ok = k === tune;
  g.phase = 'rev'; g.picked = k; g.res[g.i] = ok; if (ok) g.score++;
  if (!ok) S.shake = { hero: k, t0: nowS() };
  if (PL && PL.hero === tune && nowS() < PL.end) PL.visible = true; else playLayers([{ tune, voice: tune }], { hero: tune, visible: true });
  showStage();
}
function gNext() {
  const g = S.g;
  stopAll(); S.shake = null;
  if (g.i >= 5) Object.assign(g, { order: shuffle(HK), i: 0, score: 0, res: [] });
  else g.i++;
  Object.assign(g, { phase: 'await', picked: null, played: false });
}
function swPlay() {
  const w = S.sw, sec = w.sec;
  w.lit = { tune: w.tune, voice: w.voice, sec };
  if (sec === 'a') playLayers([{ tune: 'wolf', voice: 'bird', oct: 1, speed: 2.2 }], { hero: 'bird', visible: true });
  else if (sec === 'b') playLayers([{ tune: 'wolf', voice: 'wolf', vol: .75 }, { tune: 'duck', voice: 'duck', bpm: 60, oct: 1, vol: .5, delay: .5, noLoop: true }], { hero: 'wolf', visible: true });
  else play(w.tune, w.voice, { vis: { hero: w.voice, visible: true } });
}
function swAnswer(k) {
  const w = S.sw;
  w.asked = true; store.set('pw:asked', true); w.ans = k; w.showAns = true; w.sec = null; w.tune = 'bird'; w.voice = 'grandpa';
  swPlay(); showStage();
}
function mkPlay() {
  const m = S.mk, base = [48, 60, 72][m.pitch], bpm = [60, 100, 150][m.speed], pent = [0, 2, 4, 7, 9];
  const deg = (n) => base + pent[n % 5] + 12 * Math.floor(n / 5);
  let pos = 2 + Math.floor(Math.random() * 3), dir = Math.random() < .5 ? -1 : 1;
  const notes = [];
  for (let i = 0; i < 8; i++) {
    notes.push([deg(pos), .5]);
    const step = m.steps ? 2 + Math.floor(Math.random() * 3) : 1;
    if (Math.random() < .3) dir = -dir;
    let np = pos + dir * step;
    if (np < 0 || np > 7) { dir = -dir; np = pos + dir * step; }
    pos = clamp(np, 0, 7);
  }
  m.lit = true;
  playLayers([{ notes, voice: m.voice, bpm, noLoop: true }], { hero: m.hero, visible: true, motion: MOTION[m.hero], tf: bpm / 100 });
  showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, k = b.dataset.k, v = +b.dataset.v, w = S.sw, m = S.mk;
  if (a === 'gplay' || a === 'greplay') gPlay();
  else if (a === 'gnext') gNext();
  else if (a === 'ghero') gPick(k);
  else if (a === 'askplay') playLayers([{ tune: 'bird', voice: 'grandpa' }], { hero: 'grandpa', visible: false });
  else if (a === 'askopt') swAnswer(k);
  else if (a === 'swtune') { w.tune = k; w.sec = null; w.lit = null; w.showAns = false; }
  else if (a === 'swvoice') { w.voice = k; w.sec = null; w.lit = null; w.showAns = false; }
  else if (a === 'swplay') { w.showAns = false; swPlay(); }
  else if (a === 'swsec') {
    if (!secret.unlocked()) { secret.open(); return; }
    w.sec = k; w.showAns = false;
    if (k === 'a') { w.tune = 'wolf'; w.voice = 'bird'; } else { w.tune = 'wolf'; w.voice = 'wolf'; }
    swPlay();
  }
  else if (a === 'mkhero') { m.hero = k; m.lit = false; stopAll(); }
  else if (a === 'mkvoice') m.voice = k;
  else if (a === 'mkpitch') m.pitch = v;
  else if (a === 'mkspeed') m.speed = v;
  else if (a === 'mksteps') m.steps = v;
  else if (a === 'mkplay') mkPlay();
  render();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'guess') return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - FR.ox) / FR.s, y = (ev.clientY - r.top - FR.oy) / FR.s;
  let best = null, bd = 1e9;
  for (const k of HK) { const H = HERO[k], d = Math.hypot(x - H.x, (y - H.y) * .9); if (d < H.sz * .62 && d < bd) { best = k; bd = d; } }
  if (best) { gPick(best); render(); }
});

// --- one render per change: controls, readout, state card and facts -----------------------------------------------
const chip = (a, k, label, on, extra = '') => `<button type="button" class="chip pw-c ${on ? 'on' : ''} ${extra}" data-a="${a}" data-k="${k}">${label}</button>`;
const seg = (a, labels, cur) => labels.map((l, i) => `<button type="button" data-a="${a}" data-v="${i}" class="${i === cur ? 'on' : ''}">${esc(l)}</button>`).join('');
function render() {
  const t = T[lang], v = lab.view;
  $('pwGuess').style.display = v === 'guess' ? 'block' : 'none';
  $('pwSwap').style.display = v === 'swap' ? 'block' : 'none';
  $('pwMake').style.display = v === 'make' ? 'block' : 'none';
  if (v === 'guess') renderGuess(t); else if (v === 'swap') renderSwap(t); else renderMake(t);
  lab.setFacts(t.facts[v]);
}
function renderGuess(t) {
  const g = S.g, tune = gTune(), rev = g.phase === 'rev', last = g.i >= 5, ok = rev && g.picked === tune;
  lab.setGlow('rgba(226, 181, 82, .26)');
  $('gPlay').textContent = `▶ ${t.play}`; $('gPlay').hidden = rev;
  $('gReplay').textContent = `▶ ${t.playBtn}`; $('gReplay').hidden = !rev;
  $('gNext').textContent = last ? `↻ ${t.again}` : `${t.next} →`; $('gNext').hidden = !rev;
  $('gProg').innerHTML = HK.map((_, i) => `<i class="${g.res[i] === true ? 'ok' : g.res[i] === false ? 'no' : i === g.i ? 'cur' : ''}"></i>`).join('');
  $('gChips').innerHTML = HK.map((k) => {
    const el = chip('ghero', k, `${EMOJI[k]} ${esc(t.heroChips[k])}`, rev && g.picked === k, rev && k === tune ? 'pw-ok' : '');
    return rev ? el.replace('<button ', '<button disabled ') : el;
  }).join('');
  lab.setReadout(`${g.score} / 6`, t.recognised, rev ? (ok ? t.right : t.itWas(t.heroes[tune])) : '', '#e2b552');
  if (rev) lab.setState({ emo: EMOJI[tune], title: ok ? t.right : t.itWas(t.heroes[tune]), lead: t.whyHero[tune], body: cap(t.instr[tune]) + '.', extra: last ? `<b>${esc(t.roundEnd(g.score))}</b>` : '' });
  else if (!g.played) lab.setState({ ...t.state.guess, extra: '' });
  else lab.setState({ emo: '🎧', title: t.tapHero, lead: '', body: '', extra: '' });
}
function renderSwap(t) {
  const w = S.sw, asking = !w.asked;
  $('swAsk').style.display = asking ? 'block' : 'none';
  $('swMain').style.display = asking ? 'none' : 'block';
  lab.setGlow('rgba(226, 181, 82, .26)');
  if (asking) {
    $('swQ').textContent = t.qSwap;
    $('swOpts').innerHTML = SWPERM.map((i) => chip('askopt', ['grandpa', 'bird', 'duck'][i], esc(t.optsSwap[i]), false)).join('');
    $('swAskPlay').textContent = `▶ ${t.playBtn}`;
    lab.setReadout(`${EMOJI.bird} → 🎵 ${esc(t.instr.grandpa)}`, t.tuneToVoice, '', '#e2b552');
    lab.setState({ emo: '🤔', title: t.qSwap, lead: '', body: '', extra: '' });
    return;
  }
  $('swTL').textContent = t.tune; $('swVL').textContent = t.voice;
  $('swTune').innerHTML = HK.map((k) => chip('swtune', k, `${EMOJI[k]} ${esc(t.heroChips[k])}`, w.tune === k)).join('');
  $('swVoice').innerHTML = HK.map((k) => chip('swvoice', k, esc(cap(t.instr[k])), w.voice === k)).join('');
  $('swPlay').textContent = `▶ ${t.playBtn}`;
  const open = secret.unlocked();
  const sc = (k, emo) => `<button type="button" class="chip pw-c secret ${open ? 'open' : ''} ${w.sec === k ? 'on' : ''}" data-a="swsec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('swSec').innerHTML = sc('a', '🐺') + sc('b', '🦆');
  const ok = w.ans === 'grandpa';
  lab.setReadout(`${EMOJI[w.tune]} → 🎵 ${esc(t.instr[w.voice])}`, t.tuneToVoice, w.showAns ? (ok ? t.right : t.notQuite) : '', '#e2b552');
  if (w.showAns) lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notQuite, lead: t.swapWhy, body: '', extra: '' });
  else if (w.lit && w.sec) lab.setState({ emo: w.sec === 'a' ? '🐺' : '🦆', title: t.secrets[w.sec][0], lead: t.secrets[w.sec][1], body: '', extra: '' });
  else if (w.lit) lab.setState({ emo: EMOJI[w.lit.voice], title: cap(t.voiceOf(t.heroes[w.lit.voice], t.instr[w.lit.voice])), lead: t.state.swap.lead, body: t.state.swap.body, extra: '' });
  else lab.setState({ ...t.state.swap, extra: '' });
}
function renderMake(t) {
  const m = S.mk, ex = EXPECT[m.hero];
  lab.setGlow('rgba(226, 181, 82, .26)');
  $('mkHL').textContent = t.views.make; $('mkVL').textContent = t.voice;
  $('mkPL').textContent = t.pitch; $('mkSL').textContent = t.speed; $('mkTL').textContent = t.steps;
  $('mkHero').innerHTML = NEWK.map((k) => chip('mkhero', k, `${EMOJI[k]} ${esc(t.newHero[k])}`, m.hero === k)).join('');
  $('mkVoice').innerHTML = HK.map((k) => chip('mkvoice', k, esc(cap(t.instr[k])), m.voice === k)).join('');
  $('mkPitch').innerHTML = seg('mkpitch', t.pitches, m.pitch);
  $('mkSpeed').innerHTML = seg('mkspeed', t.speeds, m.speed);
  $('mkSteps').innerHTML = seg('mksteps', t.stepsOpts, m.steps);
  $('mkPlay').textContent = `▶ ${t.playBtn}`;
  const okv = [ex.pitch.includes(m.pitch), ex.speed.includes(m.speed), ex.steps.includes(m.steps)], n = okv.filter(Boolean).length;
  const stars = '★'.repeat(n) + '☆'.repeat(3 - n);
  $('mkStars').textContent = stars;
  $('mkHint').textContent = n === 3 ? t.fitHints.all : t.fitHints[['pitch', 'speed', 'steps'][okv.indexOf(false)]];
  lab.setReadout(stars, t.fit, '', '#e2b552');
  lab.setState({ ...t.state.make, extra: '' });
}
render();
</script>
