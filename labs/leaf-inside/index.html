  const sc = Math.min((w - 8) / SW, (h - 4) / SH), tx = (w - SW * sc) / 2, ty = (h - SH * sc) / 2;
  shGeo = { tx, ty, sc };
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#3a2a1d'); bg.addColorStop(1, '#1c130c'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  c.fillStyle = 'rgba(255,255,255,.05)'; for (let i = 0; i < 30; i++) { c.beginPath(); c.arc(rnd(i) * w, rnd(i + 9) * h, 1 + rnd(i + 20) * 2, 0, TAU); c.fill(); }
  c.save(); c.translate(tx, ty); c.scale(sc, sc);
  drawSpecimen(c, S.si, time);
  const sp = SPEC[S.si];
  c.save(); c.translate(0, sp.dy);
  sp.rings.forEach(([x, y], k) => {
    const seen = S.rings.has(S.si * 2 + k), r = 15 + (seen ? 0 : 1.8 * Math.sin(time * 3 + k));
    c.beginPath(); c.arc(x, y, r, 0, TAU);
    c.fillStyle = seen ? 'rgba(90,210,130,.35)' : 'rgba(255,255,255,.14)'; c.fill();
    c.lineWidth = 2.2; c.strokeStyle = seen ? '#5fe08f' : '#fff'; c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, 2.4, 0, TAU); c.fill();
  });
  c.restore();
  c.restore();
  if (S.ans[S.si] !== null) { // after the answer: name the parts
    const T_ = T[lang].sh.tags;
    sp.tags.forEach(([k, x, y]) => pillT(c, T_[k], tx + x * sc, ty + (y + sp.dy) * sc, k === 'stem' || k === 'bases' ? '#b9f2a6' : '#ffc999'));
  }
}

// --- canvas, input ------------------------------------------------------------------------------------------------
function step(dt) {
  S.chlA += ((chlOn() ? 1 : 0) - S.chlA) * (1 - Math.exp(-dt * 2.6));
  if (S.day !== null) {
    S.day += dt / 16;
    if (S.day >= 1) { S.day = null; S.light = S.lightSave; if (S.sec === 'day') S.sec = null; render(); }
    else S.light = clamp(1.25 * Math.sin(S.day * TAU) + 0.15, 0, 1);
  }
  if (S.wt !== null) {
    S.water += (S.wt - S.water) * (1 - Math.exp(-dt * 1.0));
    if (Math.abs(S.water - S.wt) < 0.004) { S.water = S.wt; S.wt = null; }
  }
  S.op += (targetOpen() - S.op) * (1 - Math.exp(-dt * 3.2));
  if (lab.view === 'pores' && S.pp !== null) { bars(); const k = stKey(); if (k !== S.stKey) { S.stKey = k; render(); } }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; step(dt);
  if (lab.view === 'shoots') drawShoots(c, w, h, time); else drawLeaf(c, w, h, time);
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  if (lab.view === 'slice' && S.pl !== null && geo) {
    const X = (px - geo.tx) / geo.sc, Y = (py - geo.ty) / geo.sc;
    let k = null;
    if (X >= X0 && X <= X1) {
      if (Math.hypot(X - VX, Y - VY) < VR) k = 'vein';
      else for (const q of ['skin', 'pal', 'spo', 'bot']) if (Y >= BAND[q][0] && Y < BAND[q][1]) k = q;
    }
    if (k) pickLayer(k);
  } else if (lab.view === 'shoots' && shGeo) {
    const X = (px - shGeo.tx) / shGeo.sc, Y = (py - shGeo.ty) / shGeo.sc, sp = SPEC[S.si];
    let best = -1, bd = 30;
    sp.rings.forEach(([x, y], k) => { const d = Math.hypot(X - x, Y - (y + sp.dy)); if (d < bd) { bd = d; best = k; } });
    if (best >= 0) { S.rings.add(S.si * 2 + best); S.clue = [S.si, best]; sfx.click(); render(); }
  }
});
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function pickLayer(k) { S.sel = k; S.seen.add(k); sfx.click(); render(); }
function onView(v) {
  if (v === 'slice' && S.pl === null) S.chlA = 0; // the dots stay hidden until the child has guessed
  S.stKey = '';
  render();
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a === 'slpick') { S.pl = k; S.sel = null; S.chlA = 0; (k === 'pal' ? sfx.good : sfx.bad)(); render(); showStage(); }
  else if (a === 'layer') pickLayer(k);
  else if (a === 'popick') {
    S.pp = +k; S.verdict = true; S.wt = 0.1; S.stKey = ''; (+k === T[lang].po.ok ? sfx.good : sfx.bad)(); render(); showStage();
  } else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (k === 'day') {
      if (S.day !== null) { S.day = null; S.light = S.lightSave; if (S.sec === 'day') S.sec = null; }
      else { S.lightSave = S.light; S.day = 0; S.wt = 0.9; if (S.sec !== 'float') S.sec = 'day'; }
    } else if (S.sec === 'float') S.sec = S.day !== null ? 'day' : null;
    else { S.sec = 'float'; S.wt = 0.9; if (S.day === null) S.light = 0.85; }
    sfx.click(); S.verdict = false; S.stKey = ''; render();
  } else if (a === 'spec') { S.si = +k; sfx.tick(); render(); }
  else if (a === 'sort') {
    if (S.ans[S.si] !== null) return;
    S.ans[S.si] = k; const ok = (k === 'stem') === (S.si !== 3); (ok ? sfx.good : sfx.bad)(); render(); showStage();
  }
});
$('rLight').addEventListener('input', (ev) => {
  if (S.day !== null) { S.day = null; if (S.sec === 'day') S.sec = null; }
  S.light = +ev.target.value / 100; S.verdict = false; S.wt = null; S.stKey = ''; render();
});
$('rWater').addEventListener('input', (ev) => { S.water = +ev.target.value / 100; S.verdict = false; S.wt = null; S.stKey = ''; render(); });

// --- controls and state card ------------------------------------------------------------------------------------
function stState() { // which state card the sliders show
  const t = targetOpen();
  if (S.light < 0.12) return 'dark';
  if (S.water < 0.25 && S.light > 0.3) return 'dry';
  if (t > 0.8) return 'wide';
  return 'half';
}
const stKey = () => [S.verdict, S.sec, S.day === null ? '' : S.day > 0.5 ? 'n' : 'd', stState(), S.light > 0.3].join('|');
function bars() {
  const o = Math.round(clamp(S.op, 0, 1) * 100), l = Math.round(S.light * 100), w = Math.round(S.water * 100), key = `${o}|${l}|${w}|${lang}`;
  if (key === S.bar) return; S.bar = key;
  const t = T[lang].po;
  $('bOpen').style.width = `${o}%`; $('bCo2').style.width = `${o}%`; $('bH2o').style.width = `${o}%`;
  $('vOpen').textContent = `${o}%`; $('vCo2').textContent = `${o}%`; $('vH2o').textContent = `${o}%`;
  $('vLight').textContent = `${l}%`; $('vWater').textContent = `${w}%`;
  if (+$('rLight').value !== l) $('rLight').value = l;
  if (+$('rWater').value !== w) $('rWater').value = w;
  lab.setReadout(`${o}%`, t.sub, t.pill(l, w), '#3ddc97');
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('vSlice').style.display = v === 'slice' ? '' : 'none';
  $('vPores').style.display = v === 'pores' ? '' : 'none';
  $('vShoots').style.display = v === 'shoots' ? '' : 'none';
  if (v === 'slice') renderSlice(t); else if (v === 'pores') renderPores(t); else renderShoots(t);
}
function renderSlice(t) {
  const sl = t.sl; lab.setGlow('rgba(95, 190, 110, .24)');
  const chips = (act) => KEYS.map((k) => `<button class="chip${S.seen.has(k) && act === 'layer' ? ' seen' : ''}${S.sel === k ? ' on' : ''}" data-act="${act}" data-k="${k}">${S.seen.has(k) && act === 'layer' ? '✓ ' : ''}${esc(sl.names[k])}</button>`).join('');
  if (S.pl === null) {
    $('slQ').textContent = sl.q; $('slChips').innerHTML = chips('slpick');
    lab.setReadout('?', '', '', '#5fbe6e');
    lab.setState({ emo: '🤔', title: sl.q, lead: sl.ask, body: '', extra: '' }); lab.setFacts([]); return;
  }
  $('slQ').textContent = sl.tap; $('slChips').innerHTML = chips('layer');
  lab.setReadout(`${S.seen.size}/5`, sl.sub, sl.pill, '#5fbe6e');
  if (S.sel === null) {
    lab.setState({ emo: S.pl === 'pal' ? '✅' : '🤔', title: S.pl === 'pal' ? t.right : t.notq, lead: sl.rightLead, body: sl.tap, extra: '' });
  } else {
    const [name, job, look] = sl.L[S.sel];
    lab.setState({ emo: { skin: '🧴', pal: '🌿', spo: '🫧', vein: '🩸', bot: '💨' }[S.sel], title: name, lead: job, body: look, extra: S.seen.size === 5 ? `<div class="li-fine">${esc(sl.all)}</div>` : '' });
  }
  lab.setFacts(t.facts.slice);
}
function renderPores(t) {
  const po = t.po; lab.setGlow('rgba(80, 170, 220, .24)');
  const pred = S.pp === null;
  $('poPred').hidden = !pred; $('poMain').hidden = pred;
  $('lblLight').textContent = po.light; $('lblWater').textContent = po.water; $('lblOpen').textContent = po.open; $('lblCo2').textContent = po.co2; $('lblH2o').textContent = po.h2o;
  $('rLight').disabled = S.day !== null;
  if (pred) {
    $('poQ').textContent = po.q;
    $('poChips').innerHTML = po.opts.map((o, i) => `<button class="chip" data-act="popick" data-k="${i}">${esc(o)}</button>`).join('');
    lab.setReadout('?', '', '', '#3ddc97'); lab.setState({ emo: '🤔', title: po.q, lead: po.ask, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${(k === 'day' ? S.day !== null : S.sec === 'float') ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('day', '🌙') + sc('float', '🪷');
  S.bar = ''; bars();
  const st = po.st[stState()];
  let state;
  if (S.verdict) state = { emo: S.pp === po.ok ? '✅' : '🤔', title: S.pp === po.ok ? t.right : t.notq, lead: po.revealLead, body: st[1] + ': ' + st[2] };
  else if (S.day !== null) { const d = po.dayD[S.day > 0.5 || S.light < 0.3 ? 1 : 0]; state = { emo: d[0], title: d[1], lead: d[2], body: '' }; }
  else if (lily()) state = { emo: po.floatSt[0], title: po.floatSt[1], lead: po.floatSt[2], body: st[1] + ': ' + st[2] };
  else state = { emo: st[0], title: st[1], lead: st[2], body: '' };
  lab.setState({ ...state, extra: '' });
  lab.setFacts(S.day !== null ? t.facts.day : lily() ? t.facts.float : t.facts.pores);
}
function renderShoots(t) {
  const sh = t.sh, it = sh.items[S.si]; lab.setGlow('rgba(200, 150, 80, .24)');
  $('shTray').innerHTML = sh.items.map((x, i) => {
    const a = S.ans[i], ok = a !== null && (a === 'stem') === (i !== 3);
    return `<button class="chip${i === S.si ? ' on' : ''}${a !== null && ok ? ' seen' : ''}" data-act="spec" data-k="${i}">${a === null ? '' : ok ? '✓ ' : '✗ '}${esc(x.name)}</button>`;
  }).join('');
  $('shPick').textContent = sh.pick;
  const cur = S.ans[S.si];
  $('shAns').innerHTML = [['stem', sh.stem], ['root', sh.root]].map(([k, l]) => `<button class="chip" data-act="sort" data-k="${k}"${cur !== null ? ' disabled' : ''}>${esc(l)}</button>`).join('');
  const done = S.ans.filter((x) => x !== null).length, right = S.ans.filter((a, i) => a !== null && (a === 'stem') === (i !== 3)).length;
  lab.setReadout(`${done}/4`, sh.sub, '', '#e0a458');
  const clue = S.clue && S.clue[0] === S.si ? it.clues[S.clue[1]] : '';
  if (cur === null) {
    lab.setState({ emo: '🔍', title: `${it.name}: ${sh.q}`, lead: sh.rule, body: clue, extra: '' }); lab.setFacts([]);
  } else {
    const ok = (cur === 'stem') === (S.si !== 3);
    lab.setState({ emo: ok ? '✅' : '🤔', title: `${ok ? t.right : t.notq} ${it.is}`, lead: it.why, body: clue,
      extra: done === 4 ? `<div class="li-fine"><b>${esc(sh.end(right))}</b> ${esc(sh.endLead)}</div>` : '' });
    lab.setFacts(t.facts.items[S.si]);
  }
}
render();
</script>
