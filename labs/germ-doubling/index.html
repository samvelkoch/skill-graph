// --- html side -------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, K = S.kp, W = S.wa;
  document.body.dataset.v = sec ? 'sec' : v;
  const pm = sec ? null : v === 'double' ? (S.pred ? 'double' : null) : v === 'keep' ? (K.rev ? null : 'keep') : (W.rev ? null : 'wash');
  // question + options
  $('gdQ').textContent = pm ? t.q[pm] : '';
  const pr = $('gdPred'); pr.hidden = !pm;
  if (pm) {
    pr.className = 'gd-opts ' + (pm === 'double' ? '' : pm === 'keep' ? 'one' : 'two');
    const labels = pm === 'double' ? S.pred.opts.map(fmtN) : pm === 'keep' ? K.order.map((i) => t.keepOpts[i]) : W.order.map((i) => t.washOpts[i]);
    pr.innerHTML = labels.map((x, i) => `<button class="gd-opt" data-act="pick" data-i="${i}">${esc(x)}</button>`).join('');
  }
  // double
  $('gdDbl').hidden = sec || v !== 'double' || !!pm;
  $('gdTap').textContent = t.tap; $('gdTap').disabled = !!S.busy || S.k >= 9;
  $('gdRuleB').textContent = t.showRule; $('gdRuleB').hidden = S.k < 4; $('gdRuleB').classList.toggle('on', S.ruleOpen);
  $('gdReset').textContent = '↺ ' + t.again; $('gdReset').hidden = S.k < 1 || !!S.busy;
  const chain = v === 'double' && !sec;
  $('gdChain').innerHTML = chain ? bubs(S.chain, S.fresh) + (pm === 'double' ? '<span class="gd-arr">→</span><span class="gd-bub q">?</span>' : '') : '';
  // keep
  $('gdKeep').hidden = sec || v !== 'keep' || !!pm;
  if (+$('gdSlider').value !== K.t) $('gdSlider').value = K.t;
  $('gdSlider').setAttribute('aria-label', t.views.keep); $('gdE0').textContent = `0 ${t.u.h}`; $('gdE1').textContent = `6 ${t.u.h}`;
  // wash
  $('gdWash').hidden = sec || v !== 'wash' || !!pm;
  if (v === 'wash' && W.rev) {
    $('gdRows').innerHTML = WORDER.map((id, i) => {
      const m = id.startsWith('soap') ? 'soap' : 'water', s = id.slice(m.length);
      return `<button class="gd-rowb ${id === 'soap20' ? 'best' : ''} ${id === washCombo() ? 'on' : ''}" data-act="combo" data-m="${m}" data-s="${s}"><span>${esc(t.washOpts[i])}</span><span>${PCT[id]} %</span><span class="gd-bar"><i style="width:${PCT[id]}%"></i></span></button>`;
    }).join('');
    const dis = W.run ? 'disabled' : '';
    $('gdPick').innerHTML = ['water', 'soap'].map((m) => `<button class="gd-chip ${W.med === m ? 'on' : ''}" data-act="med" data-v="${m}" ${dis}>${m === 'soap' ? '🧼' : '💧'} ${esc(t.med[m])}</button>`).join('')
      + [3, 20].map((s) => `<button class="gd-chip ${W.secs === s ? 'on' : ''}" data-act="secs" data-v="${s}" ${dis}>⏱ ${esc(t.secs[s])}</button>`).join('');
    $('gdGo').textContent = '💦 ' + t.washBtn; $('gdGo').disabled = !!W.run;
  }
  // secrets
  const sb = $('gdSecBox'); sb.hidden = !sec;
  if (sec === 'ten' && S.ten) sb.innerHTML = `<div class="gd-chain" id="gdTenChain" style="margin:0 0 10px"></div><div class="gd-row"><button class="btn" data-act="replay" ${S.ten.run ? 'disabled' : ''}>${esc(t.replay)}</button></div>`;
  if (sec === 'frz' && S.fz) sb.innerHTML = `<div class="gd-row"><button class="btn" data-act="freeze" style="min-height:46px;font-size:16px">${esc(S.fz.frozen ? t.thaw : t.freeze)}</button><button class="gd-chip" data-act="frzreset">${esc(t.replay)}</button></div>`;
  const open = secret.unlocked();
  $('gdSecChips').innerHTML = [['a', '🕙', t.secrets.a[0]], ['b', '🧊', t.secrets.b[0]]].map(([k, emo, name]) =>
    `<button class="gd-chip secret ${open ? 'open' : ''} ${sec && ((k === 'a') === (sec === 'ten')) ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(name)}` : '🔒 ???'}</button>`).join('');
  // rule card
  const showRule = S.ruleOpen && !sec && v === 'double';
  ruleEl.style.display = showRule ? '' : 'none';
  if (showRule) ruleEl.innerHTML = `<button class="gd-x" type="button" aria-label="×">×</button><h3>${esc(t.ruleTitle)}</h3><p>${esc(t.rule)}</p><div class="gd-chain">${bubs([1, 2, 4, 8, 16], false)}</div>`;
  // readout + state card + facts
  const vd = S.vd[v], pillTxt = sec ? '' : vd === 'ok' ? t.right : vd === 'no' ? t.notq : '';
  const col = sec ? '#4ea8ff' : vd === 'ok' ? '#2fbf84' : vd === 'no' ? '#e59a1f' : '#4ea8ff';
  if (sec === 'ten') {
    lab.setState({ emo: '🕙', title: t.secrets.a[0], lead: t.secrets.a[1], body: t.secBody.ten }); if (S.ten) tenUpdate();
  } else if (sec === 'frz' && S.fz) {
    lab.setState({ emo: '🧊', title: t.secrets.b[0], lead: t.secrets.b[1], body: S.fz.frozen ? t.secBody.frozen : t.secBody.warm });
    lab.setReadout(fmtN(LF.n), gw(LF.n), S.fz.frozen ? '❄ ' + t.frozen : '', col);
  } else if (v === 'double') {
    lab.setReadout(fmtN(L1.n), `${gw(L1.n)} · ${fmtT(20 * S.k)}`, pillTxt, col);
    const st = S.ruleDone ? t.st.doubleRule : t.st.double; lab.setState({ emo: '🔬', title: t.views.double, lead: st[0], body: st[1] });
  } else if (v === 'keep') {
    lab.setReadout(fmtT(K.t), '', pillTxt, col);
    const st = K.rev ? t.st.keepRev : t.st.keep; lab.setState({ emo: '🌡️', title: t.views.keep, lead: st[0], body: st[1] });
  } else {
    const done = !W.run && W.rev && W.gone > 0;
    lab.setReadout(W.rev ? `${t.med[W.med]} · ${t.secs[W.secs]}` : '—', '', pillTxt || (done ? t.gone(Math.round(W.gone * 100)) : ''), col);
    const st = W.rev ? t.st.washRev : t.st.wash; lab.setState({ emo: '🧼', title: t.views.wash, lead: st[0], body: st[1] });
  }
  lab.setFacts(t.facts[v]);
}
render();
</script>
</body>
</html>
