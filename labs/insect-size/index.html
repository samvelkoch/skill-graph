function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function smoothClosed(c, pts) {
  const n = pts.length; c.beginPath(); c.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
  for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
  c.closePath();
}
function smoothOpen(c, pts) {
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);

  $('mBtns').innerHTML = [0, 1, 2, 3].map((i) => `<button class="is-opt${ans ? (i === okSlot ? ' good' : i === S.pick ? ' bad' : '') : ''}" data-pick="${i}"${ans ? ' disabled' : ''}>${i + 1}</button>`).join('');
  $('mNote').textContent = done || ans ? '' : e.mhint;
  $('mNext').innerHTML = done ? `<button class="btn" data-act="again">${esc(e.again)}</button>` : ans ? `<button class="btn" data-act="next">${esc(e.next)}</button>` : '';
  lab.setReadout(`${S.score} / 4`, e.sub2, '', '#c88a5a');
  if (done) { lab.setState({ emo: '🎉', title: e.endT(S.score), lead: e.endL, body: '' }); lab.setFacts(Object.values(t.facts.mouth)); }
  else if (!ans) { lab.setState({ emo: '🤔', title: e.mq(cur), lead: e.mhint, body: '' }); lab.setFacts([]); }
  else {
    const ok = S.pick === okSlot;
    lab.setState({ emo: ok ? '✅' : '👀', title: ok ? t.right : e.mnot, lead: e.rightT(cur), body: e.desc[cur] });
    lab.setFacts([t.facts.mouth[cur]]);
  }
}
render();
</script>
</body>
</html>
