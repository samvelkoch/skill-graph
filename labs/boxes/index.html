const casesRight = () => CASES.reduce((a, cs, i) => a + (C.pick[i] === cs.right ? 1 : 0), 0);

// --- view 3: the race ------------------------------------------------------------------------------------------------
const RG = { LSTR: 84.39, R0: 36.8, LW: 1.22, V: 30.1, TA: 0.7 }; // metres: straight, lane-1 bend radius, lane width; m/s; start-up time
const COL = ['#ff7a59', '#ffd166', '#5ec8f2', '#b69cff'];
const laneR = (n) => RG.R0 + n * RG.LW;
const arcLen = (n, stag) => Math.PI * laneR(n) - (stag ? n * Math.PI * RG.LW : 0);
const pathLen = (n, stag) => arcLen(n, stag) + RG.LSTR;
const startAng = (n, stag) => (stag ? (n * Math.PI * RG.LW) / laneR(n) : 0);
const distOf = (el) => (el < RG.TA ? (RG.V * el * el) / (2 * RG.TA) : RG.V * (el - RG.TA / 2));
const timeAt = (d) => d / RG.V + RG.TA / 2;
const fmt = (x) => (lang === 'en' ? x.toFixed(1) : x.toFixed(1).replace('.', ','));
const laneName = (n) => T[lang].race.opts[0].split(' (')[0].replace('1', String(n + 1));
function raceL(w, h) {
  const ro = Math.min(w * 0.4, h * 0.3), ri = ro * 0.5, ld = (ro - ri) / 4, Ld = Math.max(40, h * 0.94 - 2 * ro);
  return { w, h, ro, ri, ld, Ld, cx: w / 2, cyT: h / 2 - Ld / 2, cyB: h / 2 + Ld / 2 };
}
function stadium(c, L, r) { c.moveTo(L.cx - r, L.cyT); c.arc(L.cx, L.cyT, r, Math.PI, TAU); c.lineTo(L.cx + r, L.cyB); c.arc(L.cx, L.cyB, r, 0, Math.PI); c.closePath(); }
function runnerPose(L, n, d, stag) {
  const A = arcLen(n, stag), D = A + RG.LSTR, rd = L.ri + (n + 0.5) * L.ld, dd = Math.min(d, D);
  if (dd < A) { const phi = startAng(n, stag) + dd / laneR(n); return { x: L.cx + rd * Math.cos(phi), y: L.cyT - rd * Math.sin(phi), hx: -Math.sin(phi), hy: -Math.cos(phi) }; }
  return { x: L.cx - rd, y: L.cyT + ((dd - A) / RG.LSTR) * L.Ld, hx: 0, hy: 1 };
}
function drawRunner(c, p, rs, col, d, moving) {
  const sw = moving ? Math.sin(d * 1.3) : 0;
  c.save(); c.translate(p.x, p.y); c.rotate(Math.atan2(p.hy, p.hx)); c.globalAlpha = 1;
  c.fillStyle = 'rgba(0,0,0,.28)'; ell(c, 1.6, 2.4, rs * 0.95, rs * 1.5); c.fill();
  c.fillStyle = '#2a2f3c'; ell(c, sw * rs * 0.9, -rs * 0.5, rs * 0.55, rs * 0.3); c.fill(); ell(c, -sw * rs * 0.9, rs * 0.5, rs * 0.55, rs * 0.3); c.fill();
  c.fillStyle = '#e9b88f'; circle(c, -sw * rs * 0.7, rs * 1.1, rs * 0.3); c.fill(); circle(c, sw * rs * 0.7, -rs * 1.1, rs * 0.3); c.fill();
  const g = c.createLinearGradient(-rs, -rs, rs, rs); g.addColorStop(0, shade(col, 0.28)); g.addColorStop(1, shade(col, -0.12));
  c.fillStyle = g; ell(c, 0, 0, rs * 0.82, rs * 1.2); c.fill(); c.strokeStyle = shade(col, -0.45); c.lineWidth = 1; c.stroke();
  c.fillStyle = '#e9b88f'; circle(c, rs * 0.12, 0, rs * 0.72); c.fill();
  c.fillStyle = '#3b2a1f'; ell(c, -rs * 0.12, 0, rs * 0.58, rs * 0.7); c.fill();
  c.restore();
}
function drawRace(c, w, h, dt, t) {
  const L = raceL(w, h), ms = now(), stag = R.mode === 'stagger';
  let g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#34873a'); g.addColorStop(1, '#276b2d');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = 'rgba(255,255,255,.04)'; for (let k = 0; k < 10; k++) c.fillRect(0, k * 2 * h / 20, w, h / 20);
  // time and distance
  let d = 0;
  if (R.phase === 'running') {
    d = distOf((ms - R.t0) / 1000);
    for (let n = 0; n < 4; n++) if (!R.fin.some((f) => f.n === n) && d >= pathLen(n, stag)) { R.fin.push({ n, el: timeAt(pathLen(n, stag)) }); sfx.tick(); }
    if (R.fin.length === 4) finishRun();
  } else if (R.phase === 'done') d = 1e9;
  // the track: red surface with a soft outer shadow, white lane lines, the infield
  c.save(); c.shadowColor = 'rgba(0,20,5,.5)'; c.shadowBlur = 16; c.shadowOffsetY = 4; c.beginPath(); stadium(c, L, L.ro); c.fillStyle = '#d9573b'; c.fill(); c.restore();
  g = c.createLinearGradient(L.cx - L.ro, 0, L.cx + L.ro, 0); g.addColorStop(0, 'rgba(255,255,255,.16)'); g.addColorStop(0.5, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.14)');
  c.beginPath(); stadium(c, L, L.ro); stadium(c, L, L.ri); c.fillStyle = '#d9573b'; c.fill('evenodd'); c.fillStyle = g; c.fill('evenodd');
  c.save(); c.beginPath(); stadium(c, L, L.ri); c.clip();
  g = c.createLinearGradient(0, L.cyT - L.ri, 0, L.cyB + L.ri); g.addColorStop(0, '#5cb862'); g.addColorStop(1, '#3a9443'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = 'rgba(255,255,255,.07)'; for (let k = 0; k < 14; k++) c.fillRect(L.cx - L.ri, L.cyT - L.ri + k * 2 * (L.Ld + 2 * L.ri) / 28, 2 * L.ri, (L.Ld + 2 * L.ri) / 28);
  c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1.5; const pw = L.ri * 1.3, ph = (L.Ld + L.ri) * 0.8;
  c.strokeRect(L.cx - pw / 2, h / 2 - ph / 2, pw, ph); c.beginPath(); c.moveTo(L.cx - pw / 2, h / 2); c.lineTo(L.cx + pw / 2, h / 2); c.stroke(); circle(c, L.cx, h / 2, pw * 0.2); c.stroke();
  c.restore();
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.2;
  for (let k = 0; k <= 4; k++) { c.beginPath(); stadium(c, L, L.ri + k * L.ld); c.lineWidth = k === 0 || k === 4 ? 2 : 1.2; c.stroke(); }
  // finish line (chequered) on the left straight, start line or start marks on the bend
  for (let k = 0; k < 8; k++) for (let j = 0; j < 2; j++) { c.fillStyle = (k + j) % 2 ? '#fff' : '#222'; c.fillRect(L.cx - L.ro + k * (L.ro - L.ri) / 8, L.cyB - 3 + j * 3, (L.ro - L.ri) / 8, 3); }
  c.strokeStyle = '#fff'; c.lineCap = 'butt';
  for (let n = 0; n < 4; n++) {
    const phi = startAng(n, stag), r0 = L.ri + n * L.ld, r1 = stag ? r0 + L.ld : L.ro;
    c.lineWidth = 3; c.beginPath(); c.moveTo(L.cx + (stag ? r0 : L.ri) * Math.cos(phi), L.cyT - (stag ? r0 : L.ri) * Math.sin(phi)); c.lineTo(L.cx + r1 * Math.cos(phi), L.cyT - r1 * Math.sin(phi)); c.stroke();
    const rd = L.ri + (n + 0.5) * L.ld;
    pill(c, w, String(n + 1), L.cx + rd, L.cyT + L.ld * 2.2, { fs: 12, ph: 16, pad: 4, bw: 0.5 });
  }
  // runners, back lanes first so the inner ones are on top
  const rs = L.ld * 0.4;
  for (let n = 3; n >= 0; n--) drawRunner(c, runnerPose(L, n, d, stag), rs, COL[n], Math.min(d, pathLen(n, stag)), R.phase === 'running' && d < pathLen(n, stag));
  // the finish order, inside the track
  if (R.fin.length) {
    c.save(); c.font = `800 12px ${FONT}`; c.textBaseline = 'middle';
    const rows = [...R.fin].sort((a, b) => a.el - b.el || a.n - b.n), maxW = L.ri * 2 - 16, together = stag && R.phase === 'done';
    const banner = together ? wrapLines(c, T[lang].race.together, maxW - 20) : [];
    const rh = 20, bh = banner.length * 16 + (banner.length ? 6 : 0), bw = Math.min(maxW, 168), by = h / 2 - (rows.length * rh + bh) / 2;
    rr(c, L.cx - bw / 2, by - 10, bw, rows.length * rh + bh + 20, 14); c.fillStyle = 'rgba(14,17,28,.88)'; c.fill(); c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = '#7dffa0'; c.textAlign = 'center'; banner.forEach((ln, k) => c.fillText(ln, L.cx, by + 8 + k * 16));
    rows.forEach((f, k) => {
      const y = by + bh + k * rh + rh / 2;
      c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText(`${together ? '' : `${k + 1}. `}${laneName(f.n)}`, L.cx - bw / 2 + 28, y);
      c.fillStyle = COL[f.n]; circle(c, L.cx - bw / 2 + 17, y, 4.5); c.fill();
      c.fillStyle = '#d3d9e8'; c.textAlign = 'right'; c.fillText(`${fmt(pathLen(f.n, stag))} ${T[lang].unit}`, L.cx + bw / 2 - 12, y);
    });
    c.restore();
  }
}
function finishRun() {
  R.phase = 'done';
  if (!R.revealed && R.mode === 'same') { R.revealed = true; R.verdict = R.guess === 0; R.showV = true; (R.verdict ? sfx.good : sfx.bad)(); }
  else if (R.mode === 'stagger') sfx.good();
  showStage(); render();
}
const runBlocked = () => R.phase === 'running' || (!R.revealed && R.mode === 'same' && R.guess === null);

// --- the shell wiring: one render per change -------------------------------------------------------------------------
$('bxF').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'pick') { const i = +b.dataset.i; if (S.pick.has(i)) S.pick.delete(i); else S.pick.add(i); sfx.tick(); render(); }
  else if (a === 'check') check();
  else if (a === 'next') toNeed();
  else if (a === 'again') { sfx.click(); startRound(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'a') secretA(); else secretB();
  }
});
$('bxC').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, cs = CASES[C.i];
  if (a === 'case') {
    const k = b.dataset.k;
    if (!C.pick[C.i]) { C.pick[C.i] = k; (k === cs.right ? sfx.good : sfx.bad)(); } else sfx.click();
    C.view = k; C.sceneAt = now(); render();
  } else if (a === 'next') {
    if (C.i < CASES.length - 1) C.i++; else { C.i = 0; C.pick = []; }
    C.view = 'base'; C.sceneAt = now(); sfx.click(); render();
  }
});
$('bxR').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'mode') {
    if (R.phase === 'running' || b.dataset.m === R.mode) return;
    R.mode = b.dataset.m; R.phase = 'ready'; R.fin = []; R.showV = false; sfx.click(); render();
  } else if (a === 'guess') { if (R.phase === 'running') return; R.guess = +b.dataset.g; sfx.tick(); render(); }
  else if (a === 'run') {
    if (runBlocked()) return;
    R.fin = []; R.phase = 'running'; R.t0 = now(); R.showV = false; sfx.click(); render();
  }
});
$('stage').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'fence' || ev.target.tagName !== 'CANVAS') return;
  const r = $('cv').getBoundingClientRect(); tapFence(ev.clientX - r.left, ev.clientY - r.top);
});

const secChips = (t) => {
  const open = secret.unlocked();
  const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.phase === (k === 'a' ? 'secretA' : 'secretB') ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="bx-sec"><div class="chips">${chip('a', '🪟')}${chip('b', '📦')}</div></div>`;
};
function renderFence(t) {
  const ph = S.phase, hide = ph === 'cover' || ph === 'predict', see = [0, 1, 2].filter(sees).length;
  lab.setGlow('rgba(240,170,90,.26)');
  const all = S.cnt.every((n) => n === 1) && S.cnt[0] + S.cnt[1] + S.cnt[2] === 3, allOk = [0, 1, 2].every(sees);
  lab.setReadout(hide ? '? / 3' : `${see} / 3`, t.seesMatch, all ? t.pillSame : (allOk && !hide && ph !== 'intro' && ph !== 'secretA' ? t.pillNeed : ''));
  const st = ph === 'done' ? t.state.fenceDone : t.state.fence;
  lab.setState(st); lab.setFacts(t.facts.fence);
  let html = '';
  if (ph === 'intro' || ph === 'cover') html = `<p class="bx-q">${esc(t.qSame)}</p>`;
  else if (ph === 'predict') {
    html = `<p class="bx-q">${esc(t.qSame)}</p><div class="chips">${t.kids.map((n, i) => `<button class="chip bx-tap ${S.pick.has(i) ? 'on' : ''}" data-act="pick" data-i="${i}" aria-pressed="${S.pick.has(i)}">${esc(n)}</button>`).join('')}</div>
      <div class="bx-row"><button class="btn bx-go" data-act="check"${S.pick.size ? '' : ' disabled'}>${esc(t.check)}</button></div>`;
  } else if (ph === 'reveal') {
    html = `<p class="bx-v"><b class="${S.verdict ? 'ok' : 'no'}">${esc(S.verdict ? t.right : t.notQuite)}</b> ${esc(t.sameExplain)}</p>
      <div class="bx-row first"><button class="btn bx-go" data-act="next">${esc(t.cases.next)}</button></div>`;
  } else if (ph === 'need') {
    html = `<p class="bx-q">${esc(t.needTask)}</p><div class="bx-row first"><button class="chip bx-tap" data-act="again">↺ ${esc(t.tryAgain)}</button></div><p class="bx-tip">${esc(t.tip)}</p>`;
  } else if (ph === 'done') {
    html = `<p class="bx-v"><b class="ok">${esc(t.allSee)}</b></p><div class="bx-row first"><button class="chip bx-tap" data-act="again">↺ ${esc(t.tryAgain)}</button></div>`;
  } else {
    const k = ph === 'secretA' ? 'a' : 'b';
    html = `<p class="bx-v"><b>${esc(t.secrets[k][0])}.</b> ${esc(t.secrets[k][1])}</p><div class="bx-row first"><button class="chip bx-tap" data-act="again">↺ ${esc(t.tryAgain)}</button></div>`;

}
function renderCases(t) {
  lab.setGlow('rgba(110,200,160,.24)');
  lab.setReadout(`${casesRight()} / ${CASES.length}`, t.cases.done, '');
  lab.setState(t.state.cases); lab.setFacts(t.facts.cases);
  const it = t.cases.items[C.i], cs = CASES[C.i], pk = C.pick[C.i], last = C.i === CASES.length - 1;
  const dots = CASES.map((x, i) => `<i class="${i === C.i ? 'cur' : C.pick[i] ? (C.pick[i] === x.right ? 'ok' : 'no') : ''}"></i>`).join('');
  const opt = (k) => `<button class="bx-opt ${pk && k === cs.right ? 'good' : ''} ${pk && k === pk && k !== cs.right ? 'bad' : ''}" data-act="case" data-k="${k}">${esc(t.cases[k])}</button>`;
  $('bxC').innerHTML = `<div class="bx-dots">${dots}</div><p class="bx-q">${it.emo} ${esc(it.text)}</p><p class="bx-v" style="margin-bottom:0">${esc(t.cases.q)}</p>
    <div class="bx-opts">${opt('same')}${opt('need')}</div>
    ${pk ? `<p class="bx-v"><b class="${pk === cs.right ? 'ok' : 'no'}">${esc(pk === cs.right ? t.right : t.notQuite)}</b> ${esc(it.why)}</p><div class="bx-row first"><button class="btn bx-go" data-act="next">${esc(last ? t.tryAgain : t.cases.next)}</button></div>` : ''}`;

function renderRace(t) {
  const ro = t.race, asking = !R.revealed, run = R.phase === 'running';

  const extra = (laneR(3) - laneR(0)) * Math.PI;
  lab.setReadout(asking ? '—' : `+${fmt(extra)} ${t.unit}`, asking ? '' : ro.longer, R.phase === 'done' && R.mode === 'stagger' ? ro.together : '');
  lab.setState(asking ? t.state.raceAsk : t.state.race); lab.setFacts(asking ? [] : t.facts.race);
  const mode = (m, label) => `<button class="chip bx-tap ${R.mode === m ? 'on' : ''}" data-act="mode" data-m="${m}"${m === 'stagger' && asking ? ' disabled' : ''}>${esc(label)}</button>`;
  let html = `<div class="chips">${mode('same', ro.sameStart)}${mode('stagger', ro.stagger)}</div>`;
  if (asking && R.mode === 'same') {
    html += `<p class="bx-q" style="margin-top:12px">${esc(ro.q)}</p><div class="chips">${R.order.map((i) => `<button class="chip bx-tap ${R.guess === i ? 'on' : ''}" data-act="guess" data-g="${i}"${run ? ' disabled' : ''}>${esc(ro.opts[i])}</button>`).join('')}</div>`;
  }
  if (R.showV && R.phase === 'done') html += `<p class="bx-v" style="margin-top:12px"><b class="${R.verdict ? 'ok' : 'no'}">${esc(R.verdict ? t.right : t.notQuite)}</b> ${esc(ro.first)}</p>`;
  if (R.phase === 'done' && R.mode === 'stagger') html += `<p class="bx-v" style="margin-top:12px"><b class="ok">${esc(ro.together)}</b></p>`;
  html += `<div class="bx-row"><button class="btn bx-go" data-act="run"${runBlocked() ? ' disabled' : ''}>▶ ${esc(ro.run)}</button></div>`;

}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('bxF').style.display = v === 'fence' ? 'block' : 'none';
  $('bxC').style.display = v === 'cases' ? 'block' : 'none';
  $('bxR').style.display = v === 'race' ? 'block' : 'none';
  if (v === 'fence') renderFence(t); else if (v === 'cases') renderCases(t); else renderRace(t);

const loop = canvasLoop($('cv'), (c, w, h, dt, t) => {
  if (lab.view === 'fence') drawFence(c, w, h, dt, t);
  else if (lab.view === 'cases') drawCases(c, w, h, dt, t);
  else drawRace(c, w, h, dt, t);
});
C.sceneAt = now();
startRound();
</script>
