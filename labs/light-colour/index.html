  else spectrumBar(c, w * 0.06, w * 0.94, by + 4, bh, L.map((x) => x > 0), fs, t.spec);
  // beam in stages (filter plates)
  const stages = [[1, 1, 1]]; let acc = [1, 1, 1];
  if (filt) FILT[S.filt].forEach((f) => { acc = acc.map((x, i) => x * f[i]); stages.push(acc); });
  const plateX = filt ? (FILT[S.filt].length === 2 ? [w * 0.27, w * 0.35] : [w * 0.31]) : [];
  const edges = [lamp[0] + u * 0.03, ...plateX, P[0]], lerpY = (x) => lerp(lamp[1], P[1], (x - lamp[0]) / (P[0] - lamp[0]));
  const half = (x) => lerp(u * 0.012, R * 0.55, (x - lamp[0]) / (P[0] - lamp[0]));
  for (let i = 0; i < edges.length - 1; i++) {
    const v = stages[Math.min(i, stages.length - 1)]; if (maxOf(v) < 0.05) continue;
    const a = edges[i], b = edges[i + 1];
    c.fillStyle = rgba(beamCol(v), 0.2); c.beginPath(); c.moveTo(a, lerpY(a) - half(a)); c.lineTo(b, lerpY(b) - half(b)); c.lineTo(b, lerpY(b) + half(b)); c.lineTo(a, lerpY(a) + half(a)); c.closePath(); c.fill();
  }
  for (let i = 0; i < plateX.length; i++) {
    const f = FILT[S.filt][i], px = plateX[i], py = lerpY(px), ph = h * 0.11;
    c.fillStyle = rgba(f.map((x) => x * 255), 0.45); c.beginPath(); c.roundRect(px - 5, py - ph, 10, ph * 2, 4); c.fill();
    c.strokeStyle = rgba(f.map((x) => 120 + x * 135), 0.9); c.lineWidth = 1.5; c.stroke();
  }
  bulb(c, lamp[0], lamp[1], u * 0.032, filt ? WARM : (L.every((x) => x === 1) ? WARM : L.map((x) => x * 255)), true);
  // object, rays, eye
  drawObj(c, S.obj, O[0], O[1], R, L);
  text(c, t.objFull[S.obj], O[0], O[1] + R * 1.35 + fs * 0.4, fs, 'rgba(152,160,184,.95)');
  const lightAt = (x) => { let i = 0; while (i < plateX.length && x > plateX[i]) i++; return stages[Math.min(i, stages.length - 1)]; };
  const sc = seen.map((x) => x * 255);
  if (!dark) {
    line(c, [P, eye], rgba(sc, 0.35, 1), 1.6);
    for (let i = -2; i <= 2; i++) { const a = -Math.PI / 2 + i * 0.5 + 0.2; line(c, [P, [P[0] + Math.cos(a) * u * 0.1, P[1] + Math.sin(a) * u * 0.1]], rgba(sc, 0.22), 1.4); }
    photons(c, [lamp, P, eye], 9, u * 0.5, time, (x, y, leg) => {
      if (leg === 0) { const v = lightAt(x); return maxOf(v) < 0.05 ? null : pcol(beamCol(v)); }
      return pcol(sc, clamp(maxOf(seen), 0.5, 1));
    }, u * 0.011);
  } else {
    photons(c, [lamp, P], 7, u * 0.5, time, (x, y, leg, s) => { const v = lightAt(x); return maxOf(v) < 0.05 ? null : pcol(beamCol(v), s > 0.88 ? (1 - s) / 0.12 : 1); }, u * 0.011);
    if (maxOf(L) > 0.05) for (let i = 0; i < 3; i++) { const p = ((time * 0.9 + i / 3) % 1); c.strokeStyle = rgba(beamCol(L), 0.5 * p); c.lineWidth = 1.5; c.beginPath(); c.arc(P[0], P[1], R * 0.7 * (1 - p) + 2, Math.PI, 2 * Math.PI); c.stroke(); }
  }
  eyeDraw(c, eye[0], eye[1], eyeR, true, S.pup);
  const br = u * 0.052, by2 = eye[1] + eyeR + br + 8;
  bubbleBox(c, eye[0], by2, br, t.bubble, fs - 1, () => { if (!dark || S.obj) drawObj(c, S.obj, eye[0], by2 + br * 0.08, br * 0.5, L); });
  // lamp x object = seen
  const sy = h * 0.865, g = sw * 0.95, x0 = w / 2 - (3 * sw + 2 * g) / 2 + sw / 2;
  swatch(c, x0, sy, sw, L, t.capLamp, fs); text(c, '×', x0 + (sw + g) / 2, sy, sw * 0.6, '#98A0B8');
  swatch(c, x0 + (sw + g), sy, sw, RHO[S.obj], t.capObj, fs); text(c, '=', x0 + 1.5 * (sw + g), sy, sw * 0.6, '#98A0B8');
  swatch(c, x0 + 2 * (sw + g), sy, sw, seen, t.capSeen, fs);
}
function colourHit(x, y, w, h) {
  const u = Math.min(w, h * 1.35);
  if (S.secret === 'mix') {
    ['r', 'g', 'b'].forEach((k, i) => { if (Math.hypot(x - w * 0.1, y - (h * (0.2 + i * 0.2) + h * 0.08)) < u * 0.09) S.mix[k] = S.mix[k] ? 0 : 1; });
  } else {
    const filt = S.secret === 'filter', O = [w * (filt ? 0.62 : 0.5), h * (filt ? 0.6 : 0.56)];
    if (Math.hypot(x - O[0], y - O[1]) < u * 0.15) S.obj = OBJ_ORDER[(OBJ_ORDER.indexOf(S.obj) + 1) % OBJ_ORDER.length];
    else return;
  }
  sfx.click(); render();
}

// ---------------------------------------------------------------------------------------------------------
// 9. State card + readout
// ---------------------------------------------------------------------------------------------------------
const kv = (rows) => `<div class="kv">${rows.map(([k, v]) => `<span>${esc(k)}</span><span>${esc(v)}</span>`).join('')}</div>`;
function update() {
  const t = T[lang], v = lab.view, { w, h } = sizeNow();
  if (v === 'see') {
    const g = seeGeo(w, h);
    const key = !S.lamp ? 'seeDark' : !S.eye ? 'seeShut' : S.surf === 'apple' ? 'seeOK' : g.aligned ? 'mirOK' : 'mirMiss', seen = key === 'seeOK' || key === 'mirOK';
    lab.setReadout(esc(seen ? t.seenYes : t.seenNo), seen ? t.enters : t.noEnters, '', seen ? '#ffd25a' : '#646C84');
    lab.setGlow(S.lamp ? 'rgba(255,200,90,.2)' : 'rgba(40,50,90,.25)');
    const [ti, le, bo] = t.st[key];
    lab.setState({ emo: seen ? '👁' : key === 'seeDark' ? '🌑' : key === 'seeShut' ? '🙈' : '🪞', title: ti, lead: le, body: bo, extra: `<div class="fine" style="margin:0">${esc(t.fine.see)}</div>` });
  } else if (v === 'prism') {
    const [lo, hi] = S.band !== null ? [BANDS[S.band].lo, BANDS[S.band].hi] : SRC[S.src], white = S.src === 'w';
    const sel = S.band !== null, bend = !sel ? '' : S.band === 0 ? t.bend.least : S.band === 6 ? t.bend.most : t.bend.mid;
    lab.setReadout(`${fmt(lo)}–${fmt(hi)} ${esc(t.nm)}`, sel ? t.bands[S.band] : white ? t.subVis : t.subBeam, sel ? bend : white ? t.pillSplit : t.pillNo, sel ? rgb(wl2rgb(BANDS[S.band].rep)) : white ? '#a24dff' : rgb(SRC_COL[S.src]));
    lab.setGlow(white ? 'rgba(150,90,255,.22)' : rgba(SRC_COL[S.src], 0.2));
    const [ti, le, bo] = t.st[white ? 'prismW' : 'prismOne'];
    lab.setState({ emo: '🌈', title: ti, lead: le, body: bo, extra: (sel ? `<div style="margin-bottom:6px"><b style="color:${rgb(wl2rgb(BANDS[S.band].rep), 1.1)}">${esc(t.bands[S.band])}</b> · ${esc(t.about)} ${fmt(lo)}–${fmt(hi)} ${esc(t.nm)} · ${esc(bend)}</div>` : '') + `<div class="fine" style="margin:0">${esc(t.fine.prism)}</div>` });
  } else {
    const L = lightNow(), seen = seenNow(L), dark = maxOf(seen) < 0.12, sk = colourKey(seen), mix = S.secret === 'mix', filt = S.secret === 'filter';
    const lampName = maxOf(L) < 0.5 ? t.cw.none : t.cw[colourKey(L, 0.5)];
    const sc = rgb(seen.map((x) => x * 255));
    let key;
    if (mix) key = 'mix' + (L[0] + L[1] + L[2]);
    else if (filt && S.filt === 'rg') key = 'filtStack';
    else if (filt) key = 'filt1';
    else if (S.obj === 'cloth') key = 'colBlack';
    else if (dark) key = 'colDark';
    else key = S.light === 'w' ? 'colWhite' : 'colLit';
    const [ti, le, bo] = t.st[key];
    const title = mix || filt || key === 'colBlack' || key === 'colDark' ? ti : `${t.objFull[S.obj]} · ${ti.toLowerCase()}`;
    lab.setReadout(`<span style="color:${dark ? '#98A0B8' : sc}">●</span> ${esc(t.cw[sk])}`, t.kSee.toLowerCase(), mix ? '' : t.objFull[S.obj], dark ? '#646C84' : sc);
    lab.setGlow(dark ? 'rgba(40,50,90,.25)' : rgba(seen.map((x) => x * 255), 0.24));
    let extra = '';
    if (!mix) {
      const row = (q) => `<span>${esc(fmt(L[q]))} × ${esc(fmt(RHO[S.obj][q]))} = <b>${esc(fmt(seen[q]))}</b></span>`;
      extra = kv([[t.kLamp, lampName], [t.kRefl, t.refl[S.obj]], [t.kSee, t.cw[sk]]])
        + `<div class="calc">${[0, 1, 2].map((q) => `<span style="color:${['#ff7a6e', '#5be08a', '#6fa8ff'][q]}">●</span>${row(q)}`).join('')}</div><div class="fine" style="margin-top:6px">${esc(t.calcNote)}</div>`;
    }
    extra += `<div class="fine" style="margin-top:8px">${esc(t.fine.colour)}</div>`;
    lab.setState({ emo: mix ? '🔴🟢🔵' : filt ? '🎞️' : dark ? '🌑' : '🎨', title, lead: le, body: bo, extra });
  }
}
function render() {
  const t = T[lang];
  buildCtrl(); update();
  ask.style.display = S.answered ? 'none' : '';
  if (!S.answered) ask.innerHTML = S.answer === null
    ? `<div class="q">${esc(t.ask)}</div><div class="opts">${t.opts.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="q" style="color:${S.answer === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(S.answer === 1 ? t.right : t.wrong)}</div><div class="opts"><button>${esc(t.go)} →</button></div>`;
}

// ---------------------------------------------------------------------------------------------------------
// 10. Canvas + pointer
// ---------------------------------------------------------------------------------------------------------
const cvl = canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (lab.view === 'see') drawSee(c, w, h, dt, time);
  else if (lab.view === 'prism') drawPrism(c, w, h, dt, time);
  else drawColour(c, w, h, dt, time);
});
let dragging = false;
const moveEye = (ev) => {
  const r = $('cv').getBoundingClientRect();
  S.ex = clamp((ev.clientX - r.left) / r.width, 0.58, 0.95); S.ey = clamp((ev.clientY - r.top) / r.height, 0.1, YM - 0.1);
  S.dragged = true; update();
};
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'see') { if (x > r.width * 0.5) { dragging = true; $('cv').setPointerCapture(ev.pointerId); moveEye(ev); sfx.tick(); } }
  else if (lab.view === 'prism') { pickBand(x, y, r.width, r.height); sfx.click(); update(); }
  else colourHit(x, y, r.width, r.height);
});
$('cv').addEventListener('pointermove', (ev) => { if (dragging) moveEye(ev); });
const stopDrag = () => { dragging = false; };
$('cv').addEventListener('pointerup', stopDrag);
$('cv').addEventListener('pointercancel', stopDrag);
render();
</script>
</body>
