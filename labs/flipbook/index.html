// --- the bouncing ball: one bounce from the ground back to the ground, tt in 0..1 ---------------------------
function drawBall(c, cx, bottom, r, sy) {

  c.fillStyle = 'rgba(255,255,255,.62)';

// --- view 1: the flipbook -----------------------------------------------------------------------------------
function drawFlip(c, w, h) {

  c.fillStyle = 'rgba(255,255,255,.3)'; rr(c, kx + 2.5, ky + 4, 2.5, kh - 8, 1.2); c.fill();

// --- view 2: make your own (a fish) -------------------------------------------------------------------------
const fishBody = (c) => { c.beginPath(); c.moveTo(0.47, 0.02); c.bezierCurveTo(0.47, -0.14, 0.26, -0.26, -0.02, -0.25); c.bezierCurveTo(-0.2, -0.24, -0.3, -0.1, -0.36, -0.03); c.lineTo(-0.36, 0.03); c.bezierCurveTo(-0.3, 0.1, -0.2, 0.22, -0.02, 0.23); c.bezierCurveTo(0.26, 0.24, 0.47, 0.14, 0.47, 0.02); c.closePath(); };

  c.fillStyle = 'rgba(255,255,255,.38)'; c.beginPath(); c.ellipse(0.12, -0.16, 0.18, 0.035, -0.1, 0, 7); c.fill();
  c.fillStyle = '#f08a24'; c.beginPath(); c.ellipse(0.04, 0.08, 0.1, 0.05, 0.6, 0, 7); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(0.2, -0.17); c.quadraticCurveTo(0.12, 0, 0.2, 0.17); c.lineWidth = 0.016; c.stroke();
  c.beginPath(); c.moveTo(0.47, 0.02); c.quadraticCurveTo(0.43, 0.06, 0.39, 0.05); c.stroke();
  c.fillStyle = '#fff'; c.lineWidth = 0.012; c.beginPath(); c.arc(0.31, -0.06, 0.07, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#1a1208'; c.beginPath(); c.arc(0.33, -0.06, 0.037, 0, 7); c.fill();

function bubbles(c, x, y, s, face, page) { // a few bubbles rising from the fish, a little different on every page

const filled = () => S.dPos.map((p, i) => (p ? i : -1)).filter((i) => i >= 0);
function faceOf(i) { // the fish looks the way it swims
  const P = S.dPos; if (!P[i]) return 1;

function drawDraw(c, w, h, _dt, t) {

  const pw = Math.min(w - 24, availH * 1.3), ph = pw / 1.3, px = (w - pw) / 2, py = 10 + Math.max(0, (availH - ph) / 2);

// --- view 3: the galloping horse ----------------------------------------------------------------------------
// The galloping horse: drawn in body units (about 110 long), facing right, y down, origin at the middle of the barrel.
// Legs are two-segment limbs placed by inverse kinematics from foot targets; the gait table is built from where each hoof lands.
const HORSE = { hipF: [32, 12], hipH: [-44, 8], G: 79, FOOT: [5, 11] };

      S.gT += dt; S.gAcc += dt;
      for (let n = 0; n < 4; n++) {
        const need = S.gPhase === 'slow' ? gDur(S.gJ) : 1 / 12;
        if (S.gAcc < need) break;
        S.gAcc -= need; S.gFrame = (S.gFrame + 1) % 12; S.gWorld++;
        if (S.gPhase === 'run') { if (S.gT > 2.2 && S.gFrame === (AIR - GJ + 12) % 12) { S.gPhase = 'slow'; S.gJ = 0; } }
        else { S.gJ++; if (S.gFrame === AIR) { S.gPhase = 'free'; S.gPlay = false; S.gAcc = 0; sfx.snap(); render(); break; } }
      }
      S.gFps = S.gPhase === 'slow' ? 1 / gDur(S.gJ) : 12;
    } else if (S.gPlay) {
      S.gAcc += dt; const per = 1 / S.gUFps;
      for (let n = 0; S.gAcc >= per && n < 3; n++) { S.gAcc -= per; S.gFrame = (S.gFrame + 1) % 12; S.gWorld++; }
      if (S.gAcc >= per) S.gAcc = 0;
    }
    const key = `${S.gPhase}|${S.gPlay}|${S.gFrame}|${Math.round(S.gFps)}`;
    if (key !== S.gKey) { S.gKey = key; roGallop(); $('gScrub').value = S.gFrame + 1; $('gFrameV').textContent = T[lang].page(S.gFrame + 1, 12); }
  }
  if (m === 'cage') S.cAng += 2 * Math.PI * cageRate() * dt;
  if (m === 'twos' && S.tPlay) S.tAcc = (S.tAcc + dt * S.tFps) % 24;
}
canvasLoop($('cv'), (c, w, h, dt, t) => {
  CW = w; HIT.strip = HIT.page = null;
  const m = S.sec ?? lab.view;
  try {
    update(dt, m);
    ({ flip: drawFlip, draw: drawDraw, gallop: drawGallop, cage: drawCage, twos: drawTwos })[m](c, w, h, dt, t);
  } catch (e) { console.error(e); }
});

// --- pointer: the film strips and the page of the fish ------------------------------------------------------
const cv = $('cv');
const xy = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
function placeFish(x, y) {
  const p = HIT.page; if (!p) return;
  S.dPos[S.dCur] = { u: clamp((x - p.x) / p.w, 0.14, 0.86), v: clamp((y - p.y) / p.h, 0.18, 0.82) };
}
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const [x, y] = xy(ev), m = lab.view, st = HIT.strip;
  if (st && x >= st.x && x <= st.x + st.w && y >= st.y && y <= st.y + st.h) {
    const i = clamp(Math.floor((x - st.x) / (st.w / st.n)), 0, st.n - 1);
    if (m === 'flip') { S.fFrame = i; S.fPlay = false; S.fAcc = 0; }
    else { S.dCur = i; S.dPlay = false; }
    sfx.tick(); render(); return;
  }
  const p = HIT.page;
  if (m === 'draw' && p && x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) {
    S.dDrag = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* no capture */ }
    placeFish(x, y); sfx.click(); render();
  }
});
cv.addEventListener('pointermove', (ev) => { if (!S.dDrag) return; const [x, y] = xy(ev); placeFish(x, y); });
const endDrag = () => {
  if (!S.dDrag) return;
  S.dDrag = false;
  const i = S.dCur;
  if (S.dPos[i] && i < 7 && !S.dPos[i + 1]) setTimeout(() => { if (S.dCur === i && !S.dPlay) { S.dCur = i + 1; render(); } }, 320);
  render();
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// --- controls --------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function gGoto(target) { // the world counter follows the shortest way, so the lines in the background keep their numbers
  S.gWorld += ((target - S.gFrame + 18) % 12) - 6; S.gFrame = target; S.gPlay = false; S.gAcc = 0;
}
const arc = (k) => ({ u: 0.14 + 0.72 * k / 7, v: 0.58 - 0.26 * Math.sin(Math.PI * k / 7) }); // a smooth hop across the page
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const i = +b.dataset.i;
  let reveal = false;
  switch (b.dataset.act) {
    case 'fans': if (S.fAns !== null) return; S.fAns = i; S.fPlay = true; S.fFps = 2; S.fAcc = 0; (i === 1 ? sfx.good : sfx.bad)(); reveal = true; break;
    case 'fgo': S.fPlay = !S.fPlay; S.fAcc = 0; sfx.click(); break;
    case 'dgo': {
      if (S.dPlay) { S.dPlay = false; S.dCur = S.dShow; sfx.click(); break; }
      const idx = filled(); if (idx.length < 2) return;
      S.dPlay = true; S.dPlayed = true; S.dDemo = false; S.dShow = idx[0]; S.dAcc = 0; sfx.click(); reveal = true; break;
    }
    case 'dclear': S.dPos.fill(null); S.dCur = 0; S.dPlay = false; S.dDemo = false; sfx.click(); break;
    case 'dex': S.dPos = S.dPos.map((_, k) => arc(k)); S.dCur = 0; S.dPlay = false; S.dDemo = false; sfx.snap(); break;
    case 'ddemo': S.dDemo = !S.dDemo; S.dPlay = false; S.dClk = 0; sfx.click(); reveal = true; break;
    case 'dans': if (S.dAns !== null) return; S.dAns = i; S.dPlay = false; S.dDemo = true; S.dClk = 0; (i === 0 ? sfx.good : sfx.bad)(); reveal = true; break;
    case 'gans': if (S.gAns !== null) return; S.gAns = i; S.gPhase = 'run'; S.gT = 0; S.gAcc = 0; S.gJ = 0; S.gPlay = true; (i === 1 ? sfx.good : sfx.bad)(); reveal = true; break;
    case 'ggo': S.gPlay = !S.gPlay; S.gAcc = 0; sfx.click(); break;
    case 'tgo': S.tPlay = !S.tPlay; sfx.click(); break;
    case 'sec': {
      if (!secret.unlocked()) { secret.open(); return; }
      S.sec = S.sec === b.dataset.k ? null : b.dataset.k;
      if (S.sec === 'twos') { S.tAcc = 0; S.tPlay = true; }
      sfx.click(); break;
    }
    default: return;
  }
  render();
  if (reveal) requestAnimationFrame(() => setTimeout(showStage, 40));
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'fFps') S.fFps = v;
  else if (id === 'dFps') S.dFps = v;
  else if (id === 'gFps') S.gUFps = v;
  else if (id === 'gScrub') gGoto(v - 1);
  else if (id === 'cSpin') S.cV = v;
  else if (id === 'tFps') S.tFps = v;
  else return;
  render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const opts = (list, ans, right, act, col) => `<div class="fb-opts${col ? ' col' : ''}">${list.map((o, i) => `<button class="fb-opt ${ans === null ? '' : i === right ? 'ok' : i === ans ? 'no' : 'dim'}" data-act="${act}" data-i="${i}"${ans === null ? '' : ' disabled'}>${esc(o)}</button>`).join('')}</div>`;
const verdict = (t, ok, text = '') => `<div class="fb-vd ${ok ? 'ok' : 'no'}"><b>${esc(ok ? t.right : t.notQuite)}</b>${esc(text)}</div>`;
function roGallop() {
  const t = T[lang];
  if (S.gAns === null) lab.setReadout('?', '', '', '#c9a35a');
  else if (S.gPhase !== 'free' || S.gPlay) lab.setReadout(Math.max(1, Math.round(S.gPhase === 'free' ? S.gUFps : S.gFps)), t.fpsSub, '', '#c9a35a');
  else lab.setReadout(t.page(S.gFrame + 1, 12), '', '', '#c9a35a');
}
function render() {
  const t = T[lang], m = S.sec ?? lab.view;
  document.body.dataset.v = m === 'gallop' && S.gAns === null ? 'gask' : m;
  for (const [id, k] of [['secFlip', 'flip'], ['secDraw', 'draw'], ['secGallop', 'gallop'], ['secCage', 'cage'], ['secTwos', 'twos']]) $(id).style.display = m === k ? '' : 'none';
  for (const id of ['fFps', 'dFps', 'gFps', 'tFps']) $(id).setAttribute('aria-label', t.fpsSub);
  $('gScrub').setAttribute('aria-label', t.scrub); $('cSpin').setAttribute('aria-label', t.spin);
  const open = secret.unlocked();
  $('secChips').innerHTML = [['cage', '🐦'], ['twos', '2️⃣']].map(([k, emo]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (m === 'flip') {
    const a = S.fAns;
    $('fq').innerHTML = `<div class="q">${esc(t.flipQ)}</div>${opts(t.flipOpts, a, 1, 'fans', false)}${a === null ? '' : verdict(t, a === 1, t.exFlip)}`;
    $('fGo').textContent = S.fPlay ? t.pause : t.flip; $('fGo').disabled = a === null;
    $('fFps').disabled = a === null; $('fFps').value = S.fFps; $('fFps').setAttribute('aria-label', t.fpsSub);
    lab.setGlow('rgba(229, 72, 77, .24)'); lab.setReadout(S.fFps, t.fpsSub, '', '#e5484d');
    lab.setState(a === null ? { emo: '📖', title: t.state.flip0[0], lead: t.state.flip0[1], body: '', extra: '' }
      : { emo: '🎬', title: t.state.flipDone[0], lead: t.state.flipDone[1], body: '', extra: `<div class="fb-fine">${esc(t.fine)}</div>` });
    lab.setFacts(t.facts.flip);
  } else if (m === 'draw') {
    const k = S.dPos.filter(Boolean).length, a = S.dAns;
    $('dq').innerHTML = S.dPlayed ? `<div class="q">${esc(t.drawQ)}</div>${opts(t.drawOpts, a, 0, 'dans', true)}${a === null ? '' : verdict(t, a === 0, t.exDraw)}` : `<div class="fb-fine">${esc(t.dragFish)}</div>`;
    $('dGo').textContent = S.dPlay ? t.pause : t.play; $('dGo').disabled = k < 2;
    $('dClear').textContent = t.clear; $('dEx').textContent = t.example;
    $('dDemo').style.display = a === null ? 'none' : ''; $('dDemo').textContent = S.dDemo ? t.back : t.cmp;
    $('dLab').textContent = t.fpsSub; $('dFpsV').textContent = t.fps(S.dFps); $('dFps').value = S.dFps;
    lab.setGlow('rgba(245, 159, 44, .24)'); lab.setReadout(t.pages(k), '', t.fps(S.dFps), '#f59f2c');
    lab.setState({ emo: '✏️', title: t.state.draw0[0], lead: t.state.draw0[1], body: '', extra: '' });
    lab.setFacts(t.facts.draw);
  } else if (m === 'gallop') {
    const a = S.gAns, free = S.gPhase === 'free';
    $('gq').innerHTML = `<div class="q">${esc(t.gallopQ)}</div>${opts(t.gallopOpts, a, 1, 'gans', true)}${a === null ? '' : verdict(t, a === 1)}`;
    $('gCtl').style.display = a === null ? 'none' : '';
    $('gLab').textContent = t.scrub; $('gFrameV').textContent = t.page(S.gFrame + 1, 12);
    $('gScrub').disabled = !free; $('gScrub').value = S.gFrame + 1;
    $('gGo').textContent = S.gPlay ? t.pause : t.play; $('gGo').disabled = !free;
    $('gFps').disabled = !free; $('gFps').value = S.gUFps; $('gFpsLab').textContent = t.fpsSub; $('gFpsV').textContent = t.fps(S.gUFps);
    lab.setGlow('rgba(201, 163, 90, .26)'); roGallop();
    lab.setState(free ? { emo: '🐎', title: cap(t.airborne), lead: t.exGallop, body: '', extra: '' } : { emo: '🏇', title: t.state.gallop0[0], lead: t.state.gallop0[1], body: '', extra: '' });
    lab.setFacts(a === null ? [] : t.facts.gallop);
  } else if (m === 'cage') {
    $('cLab').textContent = t.spin; $('cSpin').value = S.cV;
    lab.setGlow('rgba(98, 176, 242, .26)'); lab.setReadout(Math.round(cageRate() * 2), t.fpsSub, '', '#62b0f2');
    lab.setState({ emo: '🐦', title: t.secrets.cage[0], lead: t.cageText, body: '', extra: '' });
    lab.setFacts([]);
  } else {
    $('tGo').textContent = S.tPlay ? t.pause : t.play; $('tLab').textContent = t.fpsSub; $('tFpsV').textContent = t.fps(S.tFps); $('tFps').value = S.tFps;
    lab.setGlow('rgba(229, 72, 77, .24)'); lab.setReadout(S.tFps, t.fpsSub, '', '#e5484d');
    lab.setState({ emo: '2️⃣', title: t.secrets.twos[0], lead: t.twosText, body: '', extra: '' });
    lab.setFacts([]);
  }
}
render();
</script>
