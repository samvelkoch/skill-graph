const towersN = () => S.pieces.filter((p) => p.kind === 'tower').length;
const fishN = () => S.pieces.filter((p) => p.kind === 'fish').length;

function groundStrip(c) {
  const g = c.createLinearGradient(0, GY, 0, GY + 26); g.addColorStop(0, '#f2d9a8'); g.addColorStop(1, '#e3bf85');
  rr(c, 4, GY, 352, 26, 10); c.fillStyle = g; c.fill();

function drawTowers(c, w, h, dt, time) {
  S.moreT = clamp(S.moreT + (S.more ? 1 : -1) * dt / 0.55, 0, 1);
  const mo = sstep(S.moreT), lanes = 1 + mo, AH = h - topH - 6;
  const sc = Math.min((w - 12) / 360, AH / (LH * lanes), 1.6);
  const ox = (w - 360 * sc) / 2, oyA = topH + (AH - LH * sc * lanes) / 2, oyB = oyA + LH * sc;
  const K = S.k, tm = S.tm, X = T[lang];

  const hopOf = (col) => { const e = time - S.bounceAt; return e >= 0 && e < 1.2 ? Math.abs(Math.sin(e * 9 - col * .55)) * 9 * (1 - e / 1.2) : 0; };
  const es = time - S.shakeAt, shake = es >= 0 && es < 0.4 ? Math.sin(es * 50) * 4 * (1 - es / 0.4) : 0;

  c.save(); c.translate(ox, oyA); c.scale(sc, sc);
  groundStrip(c);
  shadowAt(c, KX + CS / 2, GY + 2, CS * .75);

    c.save(); c.setLineDash([6, 5]); c.lineWidth = 2; c.strokeStyle = `rgba(141,90,59,${0.35 + 0.15 * Math.sin(time * 3)})`;
    rr(c, ZR - MAXCOLS * PITCH - 2, GY - K * PITCH - 3, MAXCOLS * PITCH + 2, K * PITCH + 4, 12); c.stroke(); c.restore();
  }

  const nT = towersN(); let ti = 0, fi = 0;

    let tx, ty;
    if (p.kind === 'tower') { p.rank = ti; p.col = ti; tx = ZR - ti * PITCH - CS; ty = GY; ti++; }
    else { const cl = nT + Math.floor(fi / K); p.col = cl; tx = ZR - cl * PITCH - CS; ty = GY - (fi % K) * PITCH; fi++; }
    p.u = (time - p.born) / 0.65;
    const sy0 = p.kind === 'tower' ? GY : GY - K * PITCH - 8;
    p.fly = (uu) => { const e = eOut(uu); return [lerp(KX, tx, e), lerp(sy0, ty, e) - Math.sin(Math.PI * clamp(uu, 0, 1)) * 46]; };
    if (p.u < 1) { [p.cx, p.cy] = p.fly(clamp(p.u, 0, 1)); flying.push(p); }
    else { const f = 1 - Math.exp(-dt * 14); p.cx += (tx - p.cx) * f; p.cy += (ty - p.cy) * f; }
  }
  const drawPiece = (p) => {
    const land = (time - p.born - 0.65) / 0.3, sy = land >= 0 && land < 1 ? 1 - 0.13 * Math.sin(Math.PI * land) : 1;
    const hop = p.u >= 1 ? hopOf(p.col) : 0, col = p.kind === 'tower' ? shadeOf(p.rank) : COR;
    c.save(); c.translate(shake, -hop);
    if (p.u >= 1) shadowAt(c, p.cx + CS / 2, GY + 2, CS * .62);
    if (p.u < 1) for (const g of [0.22, 0.11]) { const uu = p.u - g; if (uu > 0) { const [gx, gy2] = p.fly(uu); column(c, gx, gy2, p.kind === 'tower' ? K : 1, col, { a: g === 0.22 ? .14 : .26 }); } }

  const cols = nT + Math.ceil(fishN() / K);

    c.strokeStyle = 'rgba(141,90,59,.6)'; c.lineWidth = 2.5; c.lineCap = 'round'; c.beginPath();
    c.moveTo(gl, GY + 3); c.lineTo(gl, GY + 8); c.lineTo(ZR - 2, GY + 8); c.lineTo(ZR - 2, GY + 3); c.stroke(); c.restore();
  }

    const bx = BX - 8, by = GY - 114, txt = S.tg === null ? '?' : `${S.tg}?`;
    c.save(); c.font = '900 17px Nunito, sans-serif'; const bw = Math.max(40, c.measureText(txt).width + 22);
    dot(c, bx + 12, by + 34, 3, '#fff'); dot(c, bx + 17, by + 25, 4.5, '#fff');
    rr(c, bx - bw / 2 + 6, by - 14, bw, 30, 15); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#e1c08a'; c.stroke();
    c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, bx + 6, by + 2); c.restore();
  }
  c.restore();

  if (S.shown) pill(c, X.built(tm, K, tm * K), sx(ZR - 87), syA(GY - K * PITCH - 16), { fs: 15, k: eBack((time - S.bounceAt) / 0.4), bg: 'rgba(20,110,70,.92)' });

  else if (act === 'fguess') { S.fg = +v; sfx.click(); }
  else if (act === 'lay') { layCopy(); return; }
  else if (act === 'nextpair') { S.pi = (S.pi + 1) % PAIRS.length; Object.assign(S, { fg: null, cp: [], fitDone: false, ov: null, busy: false }); sfx.click(); }
  else if (act === 'snext') { S.si++; S.picked = null; sfx.click(); }
  else if (act === 'sagain') { Object.assign(S, { si: 0, picked: null, right: 0, res: [] }); sfx.click(); }
  else if (act === 'e1' || act === 'e5') { const k = act === 'e1' ? 1 : 5; for (let i = 0; i < k && S.egg < 40; i++) { S.egg++; S.eggT.push(clock() + i * 0.07); } sfx.tick(); }
  else if (act === 'eundo') { if (S.egg > 0) { S.egg--; S.eggT.pop(); sfx.tick(); } }
  else if (act === 'go') { S.rg = { at: clock(), done: false }; sfx.push(); setTimeout(() => { S.rg.done = true; render(); }, 3900); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'egg') Object.assign(S, { egg: 0, eggT: [], ang: 0.25, vel: 0 }); else S.rg = { at: null, done: false }; }
    sfx.click();
  }
  render();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'stories' || S.si >= 6 || S.picked !== null) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const i = S.hit.findIndex((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
  if (i >= 0) pickStory(i);
});

// --- render: controls, readout and the state card -------------------------------------------------------------
function render() {
  const X = T[lang], v = lab.view, sec = S.sec;
  $('tmT').style.display = !sec && v === 'towers' ? '' : 'none';
  $('tmF').style.display = !sec && v === 'fit' ? '' : 'none';
  $('tmS').style.display = !sec && v === 'stories' ? '' : 'none';
  $('tmEgg').style.display = sec === 'egg' ? '' : 'none';
  $('tmRace').style.display = sec === 'race' ? '' : 'none';
  const open = secret.unlocked();
  $('tmSec').innerHTML = [['egg', '🥚', 'a'], ['race', '🐆', 'b']].map(([k, emo, q]) => `<button class="chip tm-b secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(X.secrets[q][0])}` : '🔒 ???'}</button>`).join('');
  if (sec === 'egg') renderEgg(X); else if (sec === 'race') renderRace(X);
  else if (v === 'towers') renderTowers(X); else if (v === 'fit') renderFit(X); else renderStories(X);
  measureTop();
}

function renderTowers(X) {
  const K = S.k, tm = S.tm, nT = towersN(), nF = fishN(), n = nT * K + nF, pred = S.tg === null, has = S.pieces.length > 0;
  lab.setGlow('rgba(78, 168, 222, .26)');
  sayEl.textContent = X.towerStory(K, tm);
  if (pred) {
    $('tmT').innerHTML = `<div class="tm-q">${esc(X.towerAsk)}</div><div class="chips">${S.tChips.map((c) => `<button class="chip tm-num" data-act="tguess" data-v="${c}">${c}</button>`).join('')}</div>`;
    lab.setReadout('?', '', '', B1);
    lab.setState({ emo: '🤔', title: X.towerAsk, lead: '', body: '', extra: '' });
  } else {
    $('tmT').innerHTML = `<div class="tm-guess">${esc(S.shown ? `${X.yourGuess(S.tg)} · ${X.real(tm * K)}` : X.yourGuess(S.tg))}</div>
      <div class="row2" style="margin-top:6px"><button class="btn tm-btn" data-act="tower">${esc(X.addTower)}</button><button class="chip tm-b" data-act="fish">${esc(X.addOne)}</button><button class="chip tm-b" data-act="undo"${has ? '' : ' disabled'}>${esc(X.undo)}</button></div>
      <div class="row2"><button class="btn tm-btn" data-act="check"${has ? '' : ' disabled'}>${esc(X.check)}</button>${S.solved ? `<button class="chip tm-b tm-more ${S.more ? 'on' : ''}" data-act="more">${esc(X.showMore(tm))}</button><button class="chip tm-b" data-act="newnum">${esc(X.newNums)}</button>` : ''}</div>`;
    lab.setReadout(n, X.fishVal, nT ? X.towersPill(nT) : '', B1);
    const [emo, title, lead, body] = X.st.towers;
    if (S.msg === 'right') lab.setState({ emo: '✅', title: X.towerRight(tm), lead: lead(K, tm), body: body(K, tm), extra: '' });
    else if (S.msg === 'wrong') lab.setState({ emo: '🤔', title: X.towerWrong, lead: lead(K, tm), body: '', extra: '' });
    else if (S.msg === 'notyet') lab.setState({ emo: '🤔', title: X.notYet, lead: lead(K, tm), body: '', extra: '' });
    else lab.setState({ emo, title, lead: lead(K, tm), body: '', extra: '' });
  }
  lab.setFacts(X.facts.towers);
}

function renderFit(X) {
  const [small, big] = PAIRS[S.pi], n = big / small, pred = S.fg === null, laid = S.cp.length;
  lab.setGlow('rgba(244, 162, 89, .26)');
  sayEl.textContent = X.fitAsk(big, small);
  if (pred) {
    const items = [n, big - small, big + small];
    $('tmF').innerHTML = `<div class="tm-q">${esc(X.fitAsk(big, small))}</div><div class="chips">${PERM_F[S.pi].map((i) => `<button class="chip tm-num" data-act="fguess" data-v="${items[i]}">${items[i]}</button>`).join('')}</div>`;
    lab.setReadout('?', '', '', KIT);
    lab.setState({ emo: '🤔', title: X.fitAsk(big, small), lead: '', body: '', extra: '' });
  } else {
    $('tmF').innerHTML = `<div class="tm-guess">${esc(X.yourGuess(S.fg))}</div>
      <div class="row2" style="margin-top:6px"><button class="btn tm-btn" data-act="lay">${esc(X.layCopy)}</button>${S.fitDone ? `<button class="chip tm-b" data-act="nextpair">${esc(X.nextPair)}</button>` : ''}</div>`;
    lab.setReadout(laid, X.copies, S.fitDone ? X.divide(big, small, n) : '', KIT);
    const [emo, title, lead, body] = X.st.fit;
    if (S.ov) lab.setState({ emo: '🙈', title: X.overhang, lead, body: '', extra: '' });
    else if (S.fitDone) lab.setState({ emo: '✅', title: X.fitDone(n, big, small), lead, body: body(n, big, small), extra: '' });
    else lab.setState({ emo, title, lead, body: '', extra: '' });
  }
  sayEl.textContent = S.fitDone && !S.ov ? X.fitDone(n, big, small) : X.fitAsk(big, small);
  lab.setFacts(X.facts.fit);
}

function renderStories(X) {
  const done = S.si >= 6, picked = S.picked !== null, st = STORIES[ORDER[Math.min(S.si, 5)]];
  lab.setGlow('rgba(242, 95, 92, .22)');
  sayEl.textContent = done ? X.score(S.right) : X.stories[ORDER[S.si]];
  const [emo, title, leadT, leadM] = X.st.stories;
  if (done) {
    $('tmS').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn tm-btn" data-act="sagain">${esc(X.again)}</button></div>`;
    lab.setReadout(X.score(S.right), '', '', '#f25f5c');
    lab.setState({ emo: '🏆', title: X.score(S.right), lead: leadT, body: leadM, extra: '' });
  } else {
    $('tmS').innerHTML = `<div class="tm-q">${esc(X.storyAsk)}</div>${picked ? `<div class="row2" style="margin-top:0"><button class="btn tm-btn" data-act="snext">${esc(X.nextStory)}</button></div>` : ''}`;
    const ans = st.k === 0 ? `${st.n} ${mulSym()} ${st.a} = ${st.n * st.a}` : `${st.a} + ${st.n} = ${st.a + st.n}`;
    lab.setReadout(X.score(S.right), '', picked ? ans : '', '#f25f5c');
    if (!picked) lab.setState({ emo, title, lead: X.storyAsk, body: '', extra: '' });
    else { const ok = S.picked === st.k; lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? X.storyRight : X.storyWrong, lead: st.k === 0 ? leadT : leadM, body: '', extra: '' }); }
  }
  lab.setFacts(X.facts.stories);
}

function renderEgg(X) {
  const n = S.egg, bal = n === 24;
  lab.setGlow('rgba(244, 200, 120, .3)');
  sayEl.textContent = X.secrets.a[1];
  $('tmEgg').innerHTML = `<div class="row2" style="margin-top:0"><button class="chip tm-b" data-act="e1">🥚 +1</button><button class="chip tm-b" data-act="e5">🥚 +5</button><button class="chip tm-b" data-act="eundo"${n ? '' : ' disabled'}>${esc(X.undo)}</button></div>`;
  lab.setReadout(n, '', bal ? X.eggsBalance : '', '#e1c08a');
  lab.setState({ emo: '🥚', title: bal ? X.eggsBalance : X.secrets.a[0], lead: bal ? X.secrets.a[0] : X.secrets.a[1], body: '', extra: '' });
  lab.setFacts([]);
}
function renderRace(X) {
  lab.setGlow('rgba(232, 177, 74, .3)');
  sayEl.textContent = X.secrets.b[1];
  const went = S.rg.at !== null;
  $('tmRace').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn tm-btn" data-act="go">${esc(went ? X.again : X.go)}</button></div>`;
  lab.setReadout(SPEEDS.map((q) => Math.round(q)).join(' · '), X.kmh, '', '#e8b14a');
  lab.setState({ emo: '🐆', title: X.secrets.b[0], lead: S.rg.done ? X.raceResult : X.secrets.b[1], body: '', extra: '' });
  lab.setFacts([]);
}

// --- the loop ---------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  if (lab.view !== 'stories' || S.sec) S.hit = [];
  drawCard(c, w, h);
  if (S.sec === 'egg') drawEgg(c, w, h, dt, time);
  else if (S.sec === 'race') drawRace(c, w, h, dt, time);
  else if (lab.view === 'towers') drawTowers(c, w, h, dt, time);
  else if (lab.view === 'fit') drawFit(c, w, h, dt, time);
  else drawStories(c, w, h, dt, time);
});
render();
</script>
