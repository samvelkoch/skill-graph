  c.restore();
}

  c.moveTo(pts[0][0], pts[0][1]);

  for (let i = 1; i < pts.length - 1; i++) c.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);

  const r = $('cv').getBoundingClientRect(), y = ev.clientY - r.top, x = ev.clientX - r.left;
  if (x < g.px - 20 || x > g.px + g.pw + 20 || y < g.py - 10 || y > g.py + g.ph + 10) return;
  const val = clamp(Math.round(g.inv(y)), 0, lab.view === 'apples' ? 18 : 24);
  const cur = lab.view === 'apples' ? S.a : S.d;
  if (cur.g !== val) { cur.g = val; sfx.tick(); render(); }
}
$('cv').addEventListener('pointerdown', (ev) => { if (ev.pointerType === 'mouse') putPoint(ev); });
$('cv').addEventListener('pointerup', (ev) => { if (ev.pointerType !== 'mouse') putPoint(ev); }); // a touch counts as a tap only when it was not a scroll
$('cv').addEventListener('pointermove', (ev) => { if (ev.pointerType === 'mouse' && ev.buttons === 1) putPoint(ev); });

// --- controls ------------------------------------------------------------------------------------------------------
function check() {
  if (lab.view === 'apples') {
    const A = S.a; if (A.g === null) return;
    A.checked = true; A.ok = A.g === 12; A.kg = 4; A.moved = false; an.line = 0; (A.ok ? sfx.good : sfx.bad)(); showStage(); return;
  }
  const D = S.d;
  if (!D.checked) {
    if (D.g === null) return;
    D.checked = true; D.ok[D.ti] = D.g === 24 / NS[D.ti]; an.line = 0; an.dig = 0; (D.ok[D.ti] ? sfx.good : sfx.bad)(); showStage();
  } else {
    D.ti++; D.g = null; D.checked = false; an.dig = 0; sfx.click();
    if (D.ti >= 3) { D.n = 4; D.moved = false; an.line = 0; }
  }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, S3 = S.s;
  if (act === 'gdec' || act === 'ginc') {
    const cur = lab.view === 'apples' ? S.a : S.d, mx = lab.view === 'apples' ? 18 : 24;
    cur.g = cur.g === null ? 10 : clamp(cur.g + (act === 'ginc' ? 1 : -1), 0, mx); sfx.tick();
  } else if (act === 'check') check();
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; an.line = 0; sfx.click();
  } else if (act === 'ans') {
    if (S3.ans[S3.ci] !== null) return;
    const k = b.dataset.k; S3.ans[S3.ci] = k; an.card = 0; (k === CARDS[S3.ci].kind ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'card') { S3.ci = +b.dataset.i; S3.end = false; an.card = S3.ans[S3.ci] === null ? 0 : 1; sfx.tick(); }
  else if (act === 'snext') {
    sfx.click();
    const open = S3.ans.findIndex((q) => q === null); // the summary only when every pair is sorted
    if (open < 0) S3.end = true; else { S3.ci = S3.ci < 4 && S3.ans[S3.ci + 1] === null ? S3.ci + 1 : open; an.card = 0; }
  } else if (act === 'sagain') { S.s = { ci: 0, ans: [null, null, null, null, null], end: false }; an.card = 0; sfx.click(); }
  render();
});
$('dgRange').addEventListener('input', (ev) => {
  const i = +ev.target.value; sfx.tick();
  if (S.sec === 'rect') S.rw = i; else if (S.sec === 'gas') S.gv = i;
  else if (lab.view === 'apples') { S.a.kg = i; S.a.moved = true; }
  else { S.d.n = DL[i]; S.d.moved = true; an.dig = 0; }
  render();
});

// --- one render per change: controls, readout, state card and facts ---------------------------------------------------
function setRange(min, max, val, label, e0, e1) {
  const r = $('dgRange'); r.min = min; r.max = max; r.value = val; r.setAttribute('aria-label', label);
  $('dgSlQ').textContent = label; $('dgE0').textContent = e0; $('dgE1').textContent = e1;
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  const mode = sec ? 'sec' : v === 'apples' ? (S.a.checked ? 'free' : 'pred') : v === 'trench' ? (S.d.ti >= 3 ? 'free' : 'pred') : 'sort';
  $('dgPred').hidden = mode !== 'pred'; $('dgSlide').hidden = !(mode === 'free' || mode === 'sec'); $('dgSort').hidden = mode !== 'sort';
  const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('dgSecRow').innerHTML = chip('rect', '📐') + chip('gas', '💉');
  if (sec) return renderSec(t, sec);
  if (v === 'apples') renderApples(t); else if (v === 'trench') renderTrench(t); else renderSort(t);
}
function renderApples(t) {
  const A = S.a, a = t.a, x = t.ax;
  lab.setGlow('rgba(229, 72, 77, .22)');
  lab.setFacts([{ emo: '⭕', text: t.f.pi, src: SRC.prop }, { emo: '🔑', text: t.f.k, src: SRC.prop }]);
  if (!A.checked) {
    lab.setReadout(`4 ${x.kg} → ?`, `2 ${x.kg} = 6 ${t.coin(6)}`, '', '#e5484d');
    $('dgQ').textContent = a.qLabel; $('dgG').textContent = A.g === null ? '?' : `${A.g} ${t.coin(A.g)}`;
    document.querySelectorAll('.dg-sb').forEach((b) => { b.disabled = false; });
    $('dgCheck').textContent = t.check; $('dgCheck').disabled = A.g === null;
    lab.setState({ emo: '🍎', title: a.qT, lead: a.qL, body: a.qB, extra: '' });
    return;
  }
  const k = A.kg, p = 3 * k;
  setRange(0, 6, k, a.slide, `0 ${x.kg}`, `6 ${x.kg}`);
  lab.setReadout(`${k} ${x.kg} = ${p} ${t.coin(p)}`, a.sub, k ? a.ratio : '', '#e5484d');
  if (!A.moved) {
    lab.setState({ emo: A.ok ? '✅' : '🤔', title: A.ok ? (lang === 'ru' ? 'Верно!' : lang === 'hu' ? 'Így van!' : 'Right!') : a.wrongT(A.g),
      lead: A.ok || A.g !== 8 ? a.rightL(12) : a.addL(A.g), body: a.after, extra: '' });
  } else if (k === 0) lab.setState({ emo: '🍎', title: a.zeroT, lead: a.zeroL, body: a.dblNo, extra: '' });
  else lab.setState({ emo: '🍎', title: a.freeT(k, p, t.coin(p)), lead: a.freeL, body: k % 2 === 0 ? a.dbl(k / 2, k, 3 * k / 2, p) : a.dblNo, extra: '' });
}
function renderTrench(t) {
  const D = S.d, d = t.d, x = t.ax;
  lab.setGlow('rgba(255, 179, 71, .2)');
  lab.setFacts(D.ti >= 3 ? [{ emo: '🏛️', text: t.f.apol, src: SRC.hyp }, { emo: '📐', text: t.f.axes, src: SRC.prop }] : [{ emo: '🏛️', text: t.f.apol, src: SRC.hyp }]); // the curve's facts wait until the curve is shown
  if (D.ti < 3) {
    const n = NS[D.ti], ans = 24 / n;
    document.querySelectorAll('.dg-sb').forEach((b) => { b.disabled = D.checked; });
    $('dgQ').textContent = d.qLabel(n); $('dgG').textContent = D.g === null ? '?' : `${D.g} ${t.day(D.g)}`;
    $('dgCheck').textContent = D.checked ? t.next : t.check; $('dgCheck').disabled = !D.checked && D.g === null;
    if (!D.checked) {
      lab.setReadout(`${n} ${t.digger(n)} → ?`, `2 ${t.digger(2)} = 12 ${t.day(12)}`, d.task(D.ti + 1), '#ffb347');
      lab.setState({ emo: '⛏️', title: d.qT(n), lead: d.qL(n), body: d.qB, extra: '' });
    } else {
      const ok = D.ok[D.ti];
      lab.setReadout(`${n} ${t.digger(n)} = ${ans} ${t.day(ans)}`, `${n} × ${ans} = 24`, d.task(D.ti + 1), '#ffb347');
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? (lang === 'ru' ? 'Верно!' : lang === 'hu' ? 'Így van!' : 'Right!') : d.wrongT(D.g),
        lead: ok ? d.rightL(n, ans) : D.g >= 12 ? d.moreL : d.wrongL(n, ans), body: D.ti < 2 ? d.nextMore : d.nextLast, extra: '' });
    }
    return;
  }
  const n = D.n, dd = 24 / n;
  setRange(0, DL.length - 1, DL.indexOf(n), d.slide, String(DL[0]), String(DL[DL.length - 1]));
  lab.setReadout(`${n} ${t.digger(n)}: ${dd} ${t.day(dd)}`, d.sub, '', '#ffb347');
  if (!D.moved) lab.setState({ emo: '📈', title: d.doneT, lead: d.doneL, body: '', extra: '' });
  else lab.setState({ emo: '⛏️', title: d.freeT(`${n} ${t.digger(n)}`, `${dd} ${t.day(dd)}`), lead: `${n} × ${dd} = 24`,
    body: DL.includes(n / 2) ? d.half(n, dd, n / 2, dd * 2) : d.halfNo, extra: '' });
}
function renderSort(t) {
  const s = t.s, S3 = S.s, done = S3.ans.filter((a) => a !== null).length, k = S3.ans.filter((a, i) => a === CARDS[i].kind).length;
  lab.setGlow('rgba(176, 140, 255, .22)');
  lab.setFacts([{ emo: '💉', text: t.f.boyle, src: SRC.boyle }]);
  lab.setReadout(`${done}/5`, s.sorted, '', '#b08cff');
  const ci = S3.ci, ans = S3.ans[ci], card = CARDS[ci];
  $('dgStrip').innerHTML = CARDS.map((cd, i) => {
    const a = S3.ans[i];
    return `<button class="c ${i === ci && !S3.end ? 'on' : ''} ${a === null ? '' : a === cd.kind ? 'ok' : 'no'}" data-act="card" data-i="${i}" aria-label="${esc(s.cardOf(i + 1))}">${i + 1}</button>`;
  }).join('') + (S3.end ? `<button class="btn" data-act="sagain">${esc(s.again)}</button>`
    : ans !== null ? `<button class="btn" data-act="snext">${esc(S3.ans.every((q) => q !== null) ? s.result : s.next)}</button>` : '');
  if (S3.end) {
    $('dgSq').textContent = ''; $('dgAns').innerHTML = ''; $('dgTest').textContent = s.endB;
    lab.setReadout(`${k}/5`, s.sorted, '', '#b08cff');
    lab.setState({ emo: '🏆', title: s.endT(k), lead: s.endL, body: '', extra: '' });
    return;
  }
  $('dgSq').textContent = s.q;
  $('dgAns').innerHTML = ['dir', 'inv', 'non'].map((kk) => `<button data-act="ans" data-k="${kk}" class="${ans === kk ? 'pick' : ''}" ${ans !== null ? 'disabled' : ''}>${KEMO[kk]} ${esc(s.kn[kk])}</button>`).join('');
  $('dgTest').textContent = ans === null ? s.test : '';
  if (ans === null) lab.setState({ emo: card.emo, title: s.q, lead: s.cards[ci].name, body: s.test, extra: '' });
  else {
    const ok = ans === card.kind;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? (lang === 'ru' ? 'Верно!' : lang === 'hu' ? 'Így van!' : 'Right!') : s.wrongIs[card.kind], lead: s.cards[ci].why, body: '', extra: '' });
  }
}
function renderSec(t, sec) {
  if (sec === 'rect') {
    const w = WL[S.rw], h = 24 / w, r = t.rect;
    setRange(0, WL.length - 1, S.rw, r.slide, String(WL[0]), String(WL[WL.length - 1]));
    lab.setGlow('rgba(70, 211, 184, .22)');
    lab.setFacts([{ emo: '📐', text: t.f.asym, src: SRC.hyp }]);
    lab.setReadout(`${w} × ${h}`, r.sub, r.pill, '#46d3b8');
    lab.setState({ emo: '📐', title: r.t(w, h), lead: r.l, body: r.b, extra: '' });
  } else {
    const V = VL[S.gv], P = 60 / V, g = t.gas;
    setRange(0, VL.length - 1, S.gv, g.slide, String(VL[0]), String(VL[VL.length - 1]));
    lab.setGlow('rgba(255, 179, 71, .22)');
    lab.setFacts([{ emo: '💉', text: t.f.boyle, src: SRC.boyle }]);
    lab.setReadout(`${V} × ${fmt(P)}`, g.sub, g.pill, '#ffb347');
    lab.setState({ emo: '💉', title: g.t(V, fmt(P)), lead: g.l, body: g.b, extra: '' });
  }
}
render();
</script>
