// ---- 2. Helpers: drawing bits and the dealing timeline ------------------------------------------------
const hash = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const rr = (c, x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
const font = (px, wt = 800) => `${wt} ${Math.round(px)}px Nunito, ui-rounded, system-ui, sans-serif`;
const ease = (f) => f * f * (3 - 2 * f);
const GOLD = '#f5c84c', FLY = 0.5, BASE = '#c98a4b';
const tint = (k) => k < 0 ? BASE : `hsl(${22 + (k % 6) * 7} 55% ${47 + (k % 6) * 2}%)`; // each round of dealing gets its own slight tint

// one cookie: round, warm brown, darker chips (half = the left half, for cut cookies)
function cookie(c, x, y, r, fill, seed, half = false) {
  c.beginPath();
  if (half) c.arc(x, y, r, Math.PI / 2, Math.PI * 1.5); else c.arc(x, y, r, 0, Math.PI * 2);
  c.closePath(); c.fillStyle = fill; c.fill();
  c.strokeStyle = 'rgba(60,30,10,.55)'; c.lineWidth = Math.max(1, r * 0.12); c.stroke();
  if (r < 5) return;
  c.fillStyle = 'rgba(70,35,12,.85)';
  for (let j = 0; j < 3; j++) {
    const a = hash(seed * 3 + j) * 6.283, d = r * (0.25 + 0.35 * hash(seed * 7 + j + 5)), px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
    if (half && px > x - r * 0.1) continue;
    c.beginPath(); c.arc(px, py, r * 0.13, 0, 7); c.fill();
  }
}

// scene geometry shared by the share / pack / secret scenes: jar on top, area for plates or boxes, equation at the bottom
function geom(w, h) {
  const jw = clamp(w * 0.48, 120, 200), jh = clamp(h * 0.27, 62, 104), jy = 16, footH = clamp(h * 0.17, 40, 54);
  const cell = Math.min((jw - 18) / 8, (jh - 16) / 5);
  const top = jy + jh + 14;
  return { jar: { x: w / 2 - jw / 2, y: jy, w: jw, h: jh, cell, r: cell * 0.46 }, top, areaH: h - footH - top - 4, footH };
}
function jarBody(c, j) {
  rr(c, j.x, j.y, j.w, j.h, 14); c.fillStyle = 'rgba(180,200,255,.06)'; c.fill();
  c.strokeStyle = 'rgba(190,205,240,.45)'; c.lineWidth = 2; c.stroke();
  rr(c, j.x + j.w * 0.12, j.y - 9, j.w * 0.76, 10, 4); c.fillStyle = 'rgba(120,135,180,.55)'; c.fill();
}
// where cookie i sits in the jar when the jar holds `total` cookies (bottom-up, so the top ones leave first)
function jarSlot(j, i, total) {
  const s = total - 1 - i, row = Math.floor(s / 8), col = s % 8;
  return { x: j.x + (j.w - 8 * j.cell) / 2 + (col + 0.5) * j.cell + (hash(i) - 0.5) * j.cell * 0.15,
           y: j.y + j.h - 8 - (row + 0.5) * j.cell + (hash(i + 50) - 0.5) * j.cell * 0.12 };
}
function jarGlow(c, j, from, total, time) {
  if (total <= from) return;
  let sx = 0, sy = 0;
  for (let i = from; i < total; i++) { const s = jarSlot(j, i, total); sx += s.x; sy += s.y; }
  const n = total - from, x = sx / n, y = sy / n, R = j.cell * (1.6 + Math.sqrt(n)) * (1 + 0.1 * Math.sin(time * 4));
  const g = c.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0, 'rgba(245,200,76,.55)'); g.addColorStop(1, 'rgba(245,200,76,0)');
  c.fillStyle = g; c.fillRect(x - R, y - R, 2 * R, 2 * R);
}

// plates in one or two rows
function plateLayout(p, w, top, areaH) {
  const rows = p > 5 ? 2 : 1, cols = Math.ceil(p / rows), cellW = (w - 16) / cols, rowH = areaH / rows;
  const rx0 = Math.min(cellW / 2 - 4, 80), ry = Math.min(rx0 * 0.55, (rowH - 24) / 2), rx = Math.min(rx0, ry / 0.45), out = [];
  for (let j = 0; j < p; j++) {
    const row = rows === 2 && j >= cols ? 1 : 0, n = rows === 2 ? (row === 0 ? cols : p - cols) : p, idx = row ? j - cols : j;
    out.push({ cx: w / 2 + (idx - (n - 1) / 2) * cellW, cy: top + row * rowH + ry + 4, rx, ry });
  }
  return out;
}
function drawPlate(c, pl, hot) {
  c.beginPath(); c.ellipse(pl.cx, pl.cy, pl.rx, pl.ry, 0, 0, 7); c.fillStyle = 'rgba(211,217,232,.16)'; c.fill();
  c.strokeStyle = hot ? GOLD : 'rgba(211,217,232,.5)'; c.lineWidth = hot ? 3 : 2; c.stroke();
  c.beginPath(); c.ellipse(pl.cx, pl.cy, pl.rx * 0.78, pl.ry * 0.74, 0, 0, 7); c.strokeStyle = 'rgba(211,217,232,.2)'; c.lineWidth = 1; c.stroke();
}
// slots for n cookies piled on a plate ellipse, filled round by round
function pile(n, rx, ry, rMax) {
  n = Math.max(1, n);
  const cols = Math.max(1, Math.ceil(Math.sqrt(n * (rx / ry) * 0.9))), rows = Math.ceil(n / cols);
  const cell = Math.min(2 * rx * 0.8 / cols, 2 * ry * 0.74 / rows), r = Math.min(cell * 0.5 / 1.04, rMax), step = 2 * r * 1.04;
  return { r, at: (k) => {
    const row = Math.floor(k / cols), cnt = Math.min(cols, n - row * cols);
    return { dx: ((k % cols) - (cnt - 1) / 2) * step, dy: (row - (rows - 1) / 2) * step };
  } };
}
function drawEq(c, w, h, footH, alpha, eq, check) {
  c.globalAlpha = alpha; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = '#fff'; c.font = font(clamp(w * 0.052, 16, 26)); c.fillText(eq, w / 2, h - footH * 0.66);
  c.fillStyle = '#98A0B8'; c.font = font(clamp(w * 0.04, 13, 17), 700); c.fillText(check, w / 2, h - footH * 0.24);
  c.globalAlpha = 1;
}
const flyTo = (a, b, f, arc) => { const e = ease(f); return { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e) - Math.sin(Math.PI * e) * arc }; };

// timeline: cookie i of the share scene leaves the jar at launchS(i); of the pack scene at launchG(i)
const launchS = (i, p) => i < p ? i * 0.42 : p * 0.42 + (i - p) / 6;
const launchG = (i, b) => Math.floor(i / b) * 0.55 + (i % b) * 0.045;
const launch = (i) => S.view === 'group' ? launchG(i, S.b) : launchS(i, S.p);

// ---- render: all text + controls ----
const GLOW = { share: 'rgba(201,138,75,.28)', group: 'rgba(78,168,255,.22)', grid: 'rgba(61,220,151,.2)', story: 'rgba(245,200,76,.2)', zero: 'rgba(255,59,48,.16)' };
const ACC = { share: BASE, group: '#4ea8ff', grid: '#3ddc97', story: GOLD, zero: '#ff6b60' };

// ---- 4. Drawing --------------------------------------------------------------------------------------
// advance the timeline; returns {launched, landed}
function tick(dt, D, endT) {
  if (S.phase === 'run') S.t += dt;
  let launched = 0, landed = 0;
  if (S.phase !== 'idle') for (let i = 0; i < D; i++) { const lt = launch(i); if (S.t >= lt) launched++; if (S.t >= lt + FLY) landed++; }
  if (S.phase === 'run' && S.t >= endT) { S.phase = 'done'; render(); }
  S.eqA = lerp(S.eqA, S.phase === 'done' ? 1 : 0, 1 - Math.exp(-dt * 6));
  return { launched, landed };
}

function drawShare(c, w, h, dt, time) {
  const t = T[lang], g = geom(w, h), cc = S.c, p = S.p, q = Math.floor(cc / p), r = cc % p, D = q * p;
  const { launched, landed } = tick(dt, D, D ? launchS(D - 1, p) + FLY : 0.6);
  const pl = plateLayout(p, w, g.top, g.areaH), pi = pile(q, pl[0].rx, pl[0].ry, 15);
  if (S.phase === 'run') {
    const rd = Math.max(1, Math.floor((launched - 1) / p) + 1);
    if (rd !== S.round) { S.round = rd; render(); }
    if (landed > S.landed) sfx.tick();
  }
  S.landed = landed;
  c.globalAlpha = S.answered ? 1 : 0.35;
  jarBody(c, g.jar);
  for (let i = launched; i < cc; i++) { const s = jarSlot(g.jar, i, cc); cookie(c, s.x, s.y, g.jar.r, i >= D ? BASE : BASE, i); }
  if (S.phase === 'done' && r > 0) { jarGlow(c, g.jar, D, cc, time); for (let i = D; i < cc; i++) { const s = jarSlot(g.jar, i, cc); c.beginPath(); c.arc(s.x, s.y, g.jar.r + 2, 0, 7); c.strokeStyle = GOLD; c.lineWidth = 2; c.stroke(); } }
  const hot = S.phase === 'run' && launched > landed ? (launched - 1) % p : -1;
  pl.forEach((q0, j) => drawPlate(c, q0, j === hot));
  const place = (i) => { const q0 = pl[i % p], o = pi.at(Math.floor(i / p)); return { x: q0.cx + o.dx, y: q0.cy + o.dy }; };
  for (let i = 0; i < landed; i++) { const o = place(i); cookie(c, o.x, o.y, pi.r, tint(Math.floor(i / p)), i); }
  for (let i = landed; i < launched; i++) {
    const f = clamp((S.t - launchS(i, p)) / FLY, 0, 1), o = flyTo(jarSlot(g.jar, i, cc), place(i), f, 26);
    cookie(c, o.x, o.y, lerp(g.jar.r, pi.r, ease(f)), tint(Math.floor(i / p)), i);
  }
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = font(clamp(pl[0].rx * 0.4, 13, 18)); c.fillStyle = '#fff';
  pl.forEach((q0, j) => c.fillText(String(Math.max(0, Math.ceil((landed - j) / p))), q0.cx, q0.cy + q0.ry + 12));
  drawEq(c, w, h, g.footH, S.eqA, t.eq(cc, p, q, r), t.check(cc, p, q, r));
  c.globalAlpha = 1;
}

// boxes for the pack scene: choose the number of columns that makes the boxes biggest
function boxLayout(nb, b, w, top, areaH) {
  const gc = Math.ceil(Math.sqrt(b)), gr = Math.ceil(b / gc), bw = gc + 0.6, bh = gr + 0.6, gap = 0.35;
  let best = null;
  for (let nc = 1; nc <= nb; nc++) {
    const nr = Math.ceil(nb / nc), Wu = nc * bw + (nc - 1) * gap, Hu = nr * bh + (nr - 1) * gap, u = Math.min((w - 16) / Wu, areaH / Hu, 30);
    if (!best || u > best.u) best = { u, nc, nr, Hu };
  }
  const { u, nc, nr, Hu } = best, boxes = [];
  for (let i = 0; i < nb; i++) {
    const row = Math.floor(i / nc), cnt = Math.min(nc, nb - row * nc), col = i % nc;
    boxes.push({ x: (w - (cnt * bw + (cnt - 1) * gap) * u) / 2 + col * (bw + gap) * u, y: top + (areaH - Hu * u) / 2 + row * (bh + gap) * u, w: bw * u, h: bh * u });
  }
  return { u, gc, boxes };
}

function drawGroup(c, w, h, dt, time) {
  const t = T[lang], g = geom(w, h), cc = S.c, b = S.b, q = Math.floor(cc / b), r = cc % b, D = q * b;
  const { launched, landed } = tick(dt, D, D ? launchG(D - 1, b) + FLY : 0.6);
  if (S.phase === 'run' && landed > S.landed && Math.floor(landed / b) > Math.floor(S.landed / b)) sfx.snap();
  S.landed = landed;
  const L = boxLayout(Math.max(q, 1), b, w, g.top, g.areaH), u = L.u, cr = u * 0.44;
  jarBody(c, g.jar);
  for (let i = launched; i < cc; i++) { const s = jarSlot(g.jar, i, cc); cookie(c, s.x, s.y, g.jar.r, BASE, i); }
  if (S.phase === 'done' && r > 0) { jarGlow(c, g.jar, D, cc, time); for (let i = D; i < cc; i++) { const s = jarSlot(g.jar, i, cc); c.beginPath(); c.arc(s.x, s.y, g.jar.r + 2, 0, 7); c.strokeStyle = GOLD; c.lineWidth = 2; c.stroke(); } }
  L.boxes.forEach((bx, j) => {
    const full = q > 0 && landed >= (j + 1) * b;
    rr(c, bx.x, bx.y, bx.w, bx.h, u * 0.3); c.fillStyle = full ? 'rgba(201,138,75,.18)' : 'rgba(211,217,232,.07)'; c.fill();
    c.strokeStyle = full ? BASE : 'rgba(211,217,232,.4)'; c.lineWidth = full ? 2 : 1.5; c.setLineDash(q > 0 ? [] : [5, 4]); c.stroke(); c.setLineDash([]);
  });
  const place = (i) => { const bx = L.boxes[Math.floor(i / b)], k = i % b; return { x: bx.x + (0.3 + (k % L.gc) + 0.5) * u, y: bx.y + (0.3 + Math.floor(k / L.gc) + 0.5) * u }; };
  for (let i = 0; i < landed; i++) { const o = place(i); cookie(c, o.x, o.y, cr, tint(Math.floor(i / b)), i); }
  for (let i = landed; i < launched; i++) {
    const f = clamp((S.t - launchG(i, b)) / FLY, 0, 1), o = flyTo(jarSlot(g.jar, i, cc), place(i), f, 26);
    cookie(c, o.x, o.y, lerp(g.jar.r, cr, ease(f)), tint(Math.floor(i / b)), i);
  }
  drawEq(c, w, h, g.footH, S.eqA, t.eq(cc, b, q, r), t.check(cc, b, q, r));
}

// the array: one row per plate, one column per round; the remainder is a dashed, unfinished column
function drawGrid(c, w, h, dt) {
  const t = T[lang], cc = S.c, p = S.p, q = Math.floor(cc / p), r = cc % p, footH = clamp(h * 0.17, 40, 54);
  S.gT += dt; S.turnA = lerp(S.turnA, S.turn ? 1 : 0, 1 - Math.exp(-dt * 7));
  const R = Math.max(1, q + (r > 0 ? 1 : 0)), areaH = h - footH - 24, lm = 22, pad = 10;
  const u = Math.min((w - 2 * pad - lm) / R, areaH / p, 34), gw = u * R, gh = u * p, x0 = (w - gw + lm) / 2, y0 = 10 + (areaH - gh) / 2;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let j = 0; j < p; j++) { // row bands (the plates) fade out when the picture is turned
    rr(c, x0 - 4, y0 + j * u + 1, gw + 8, u - 2, u * 0.4); c.fillStyle = `rgba(211,217,232,${0.07 * (1 - S.turnA)})`; c.fill();
    if (u >= 14) { c.fillStyle = `rgba(152,160,184,${1 - S.turnA})`; c.font = font(clamp(u * 0.42, 10, 14), 700); c.fillText(String(j + 1), x0 - 14, y0 + (j + 0.5) * u); }
  }
  for (let k = 0; k < R; k++) { // column boxes (rounds / boxes of p) fade in
    const partial = k >= q; if (S.turnA < 0.02) break;
    rr(c, x0 + k * u + 1.5, y0 - 3, u - 3, gh + 6, u * 0.4); c.strokeStyle = GOLD; c.globalAlpha = S.turnA * (partial ? 0.6 : 1); c.lineWidth = 2; c.setLineDash(partial ? [4, 4] : []); c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
  }
  for (let i = 0; i < Math.max(cc, p * R); i++) {
    const col = Math.floor(i / p), row = i % p, x = x0 + (col + 0.5) * u, y = y0 + (row + 0.5) * u;
    if (i >= cc) { // the missing cookies of the last column
      if (col < q || (cc === 0 && col > 0)) continue;
      c.beginPath(); c.arc(x, y, u * 0.4, 0, 7); c.strokeStyle = 'rgba(245,200,76,.7)'; c.lineWidth = 1.5; c.setLineDash([3, 3]); c.stroke(); c.setLineDash([]); continue;
    }
    const pr = clamp((S.gT - col * 0.04 - row * 0.012) / 0.25, 0, 1); if (pr <= 0) continue;
    cookie(c, x, y, u * 0.43 * ease(pr), col >= q ? BASE : tint(col), i);
  }
  drawEq(c, w, h, footH, 1, t.eq(cc, p, q, r), t.check(cc, p, q, r));
}

// secret 1: the same 30 ÷ 4 in three stories
function drawStory(c, w, h, dt) {
  const t = T[lang], k = S.story; S.sT += dt;
  const T0 = S.sT, pad = 12, footH = clamp(h * 0.19, 44, 58), area = h - footH - pad;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const pop = (start, len = 0.25) => ease(clamp((T0 - start) / len, 0, 1));
  const endAt = k === 'pizza' ? 3.4 : 30 * 0.07 + 0.3;
  if (k === 'cars') {
    const cw = (w - 2 * pad) / 4, ch = Math.min((area - pad) / 2, cw * 0.85), oy = pad + (area - 2 * ch) / 2;
    for (let j = 0; j < 8; j++) {
      const x0 = pad + (j % 4) * cw, y0 = oy + Math.floor(j / 4) * ch, last = j === 7;
      rr(c, x0 + 4, y0 + ch * 0.12, cw - 8, ch * 0.66, ch * 0.16);
      c.fillStyle = 'rgba(78,168,255,.16)'; c.fill(); c.strokeStyle = last && T0 > endAt ? `rgba(245,200,76,${0.6 + 0.4 * Math.sin(T0 * 5)})` : '#4ea8ff'; c.lineWidth = 2; c.stroke();
      c.fillStyle = '#4ea8ff'; for (const wx of [0.28, 0.72]) { c.beginPath(); c.arc(x0 + cw * wx, y0 + ch * 0.82, ch * 0.09, 0, 7); c.fill(); }
      for (let s = 0; s < 4; s++) {
        const n = j * 4 + s, sx = x0 + cw * (0.33 + 0.34 * (s % 2)), sy = y0 + ch * (0.28 + 0.26 * Math.floor(s / 2)), dr = Math.min(cw, ch) * 0.11;
        if (n < 30) { const pr = pop(n * 0.07); if (pr > 0) { c.beginPath(); c.arc(sx, sy, dr * pr, 0, 7); c.fillStyle = `hsl(${(n * 47) % 360} 75% 62%)`; c.fill(); } }
        else { c.beginPath(); c.arc(sx, sy, dr, 0, 7); c.strokeStyle = 'rgba(245,200,76,.8)'; c.lineWidth = 1.5; c.setLineDash([3, 3]); c.stroke(); c.setLineDash([]); }
      }
    }
  } else if (k === 'toys') {
    const cw = Math.min((w - 2 * pad) / 8, 80), x0 = (w - 8 * cw) / 2, cy = pad + area / 2, dr = cw * 0.15;
    for (let j = 0; j < 8; j++) {
      const cx = x0 + (j + 0.5) * cw, pocket = j === 7, n0 = j * 4;
      if (pocket) { rr(c, cx - cw * 0.46, cy - cw * 0.9, cw * 0.92, cw * 1.9, 10); c.strokeStyle = GOLD; c.lineWidth = 1.5; c.setLineDash([4, 4]); c.stroke(); c.setLineDash([]); }
      const tp = pop(n0 + 3.5 > 29 ? 30 * 0.07 : (n0 + 3) * 0.07);
      c.font = `${Math.round(Math.min(cw * 0.72, 38) * Math.max(tp, 0.001))}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
      c.fillStyle = '#fff'; c.fillText(pocket ? '👛' : '🧸', cx, cy - cw * 0.45);
      for (let s = 0; s < (pocket ? 2 : 4); s++) {
        const pr = pop((n0 + s) * 0.07); if (pr <= 0) continue;
        const px = cx + (s % 2 - 0.5) * dr * 2.5, py = cy + cw * 0.15 + Math.floor(s / 2) * dr * 2.5;
        c.beginPath(); c.arc(px, py, dr * pr, 0, 7); c.fillStyle = GOLD; c.fill(); c.strokeStyle = '#b8901f'; c.lineWidth = 1.5; c.stroke();
      }
    }
  } else {
    const cw = (w - 2 * pad) / 4, rx = Math.min(cw / 2 - 4, 60), ry = rx * 0.5, cy = pad + area * 0.55, pi = pile(8, rx, ry, 12), top = { x: w / 2, y: pad + 12 };
    for (let j = 0; j < 4; j++) {
      const cx = pad + (j + 0.5) * cw; drawPlate(c, { cx, cy, rx, ry }, false);
      for (let kk = 0; kk < 7; kk++) { const g = kk * 4 + j, pr = pop(g * 0.05); if (pr <= 0) continue; const o = pi.at(kk); cookie(c, cx + o.dx, cy + o.dy, pi.r * pr, tint(kk), g); }
      const o = pi.at(7), f = clamp((T0 - 2.4) / 0.7, 0, 1);
      if (f > 0) { const q0 = flyTo(top, { x: cx + o.dx, y: cy + o.dy }, f, 24); cookie(c, q0.x, q0.y, lerp(pi.r * 0.8, pi.r, f), BASE, 200 + j, true); }
      const la = pop(3.2, 0.4);
      if (la > 0) { c.globalAlpha = la; c.fillStyle = GOLD; c.font = font(clamp(rx * 0.45, 14, 20)); c.fillText('7½', cx, cy + ry + 16); c.globalAlpha = 1; }
    }
    if (T0 > 1.5 && T0 < 2.4) for (const dx of [-1, 1]) cookie(c, top.x + dx * 13, top.y, 11, BASE, 300 + dx, false);
  }
  const done = pop(endAt, 0.4);
  drawEq(c, w, h, footH, 1, t.eq(30, 4, 7, 2), '');
  c.globalAlpha = done; c.fillStyle = GOLD; c.font = font(clamp(w * 0.044, 14, 20)); c.fillText(t.storyState[k].title, w / 2, h - footH * 0.24); c.globalAlpha = 1;
}

// secret 2: no plates to deal to
function drawZero(c, w, h, dt, time) {
  const t = T[lang], g = geom(w, h);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  jarBody(c, g.jar);
  if (S.zero === 'cookies') {
    const pl = plateLayout(5, w, g.top, g.areaH);
    pl.forEach((q0) => { drawPlate(c, q0, false); c.fillStyle = '#fff'; c.font = font(clamp(q0.rx * 0.4, 13, 18)); c.fillText('0', q0.cx, q0.cy + q0.ry + 12); });
    drawEq(c, w, h, g.footH, 1, `0 ${t.div} 5 = 0`, `5 ${t.mul} 0 = 0`);
    return;
  }
  for (let i = 0; i < 12; i++) { const s = jarSlot(g.jar, i, 12); cookie(c, s.x, s.y, g.jar.r, BASE, i); }
  const xs = [w * 0.2, w * 0.5, w * 0.8], cy = g.top + g.areaH * 0.55, rx = Math.min(w * 0.12, 54), idx = Math.floor(time / 1.4) % 3;
  S.hx = S.hx ? lerp(S.hx, xs[idx], 1 - Math.exp(-dt * 5)) : xs[idx];
  xs.forEach((x, j) => {
    c.beginPath(); c.ellipse(x, cy, rx, rx * 0.45, 0, 0, 7); c.strokeStyle = `rgba(211,217,232,${0.22 + 0.12 * Math.sin(time * 2 + j)})`; c.lineWidth = 2; c.setLineDash([6, 5]); c.stroke(); c.setLineDash([]);
  });
  const bob = Math.sin(time * 4) * 4, reach = Math.abs(Math.sin(time * 2.2)) * 10;
  c.font = `${Math.round(clamp(w * 0.09, 28, 40))}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; c.fillStyle = '#fff';
  c.fillText('🤚', S.hx, g.top + 6 + reach);
  c.fillStyle = GOLD; c.font = font(clamp(w * 0.08, 24, 34), 900); c.fillText('?', S.hx, cy + 4 + bob);
  drawEq(c, w, h, g.footH, 1, `12 ${t.div} 0 = ?`, `0 ${t.mul} ? = 12`);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const m = mode();
  if (m === 'share') drawShare(c, w, h, dt, time);
  else if (m === 'group') drawGroup(c, w, h, dt, time);
  else if (m === 'grid') drawGrid(c, w, h, dt);
  else if (m === 'story') drawStory(c, w, h, dt);
  else drawZero(c, w, h, dt, time);
});

$('cv').addEventListener('pointerdown', () => {
  const m = mode();
  if (m === 'story') S.sT = 0;
  else if (m === 'grid') S.gT = 0;
  else if ((m === 'group' || (m === 'share' && S.answered)) && S.phase !== 'run') { start(false); sfx.click(); render(); }
});
render();
</script>
