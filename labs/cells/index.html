// the zoom: between level i and i + 1 the dashed circle grows until it fills the view, while the next level fades in inside it
function drawZoom(c, w, H, time) {

  const R = .45 * u / (RAD[i] * u), s = Math.pow(R, p), F = FOC[i](w, H), C = [w / 2, H / 2];

function drawOnion(c, w, H, time) {

  const fade = clamp((time - S.onionAt) / .35, 0, 1);
  c.save(); c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.clip();
  c.fillStyle = plant ? '#e6edc8' : '#efe0ea'; c.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  c.globalAlpha = fade;
  if (plant) { // brick-like boxes with thick walls
    const cw = R * .42, ch = R * .2;
    for (let row = -6; row <= 6; row++) for (let col = -5; col <= 5; col++) {
      const x = cx + col * cw + (row & 1 ? cw / 2 : 0) - cw / 2, y = cy + row * ch - ch / 2;
      c.fillStyle = `rgba(190,215,140,${(.25 + rnd() * .2).toFixed(2)})`; c.fillRect(x, y, cw, ch);
      c.strokeStyle = '#6f8d3e'; c.lineWidth = Math.max(3, R * .022); c.lineJoin = 'miter'; c.strokeRect(x, y, cw, ch);
      c.fillStyle = '#7b4fb4'; c.beginPath(); c.arc(x + cw * (.25 + rnd() * .5), y + ch * (.35 + rnd() * .3), Math.max(2.5, ch * .13), 0, TAU); c.fill();
    }

    const d = R * .46;
    for (let gy = -3; gy <= 3; gy++) for (let gx = -3; gx <= 3; gx++) {
      const bx = cx + gx * d + (gy & 1 ? d / 2 : 0) + (rnd() - .5) * d * .2, by = cy + gy * d * .9 + (rnd() - .5) * d * .2, rb = d * .4 * (.8 + rnd() * .4);
      const pts = []; for (let k = 0; k < 10; k++) { const a = k * TAU / 10, r = rb * (.85 + rnd() * .3); pts.push([bx + Math.cos(a) * r, by + Math.sin(a) * r]); }
      const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      c.beginPath(); c.moveTo(...mid(pts[9], pts[0]));
      for (let k = 0; k < 10; k++) c.quadraticCurveTo(...pts[k], ...mid(pts[k], pts[(k + 1) % 10]));
      c.closePath(); c.fillStyle = 'rgba(255,190,210,.75)'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(200,110,150,.9)'; c.stroke();
      c.fillStyle = '#7b4fb4'; c.beginPath(); c.arc(bx + (rnd() - .5) * rb * .2, by + (rnd() - .5) * rb * .2, rb * .38, 0, TAU); c.fill();

    }
  }
  c.restore();
  c.save(); c.globalAlpha = 1; c.lineWidth = 12; c.strokeStyle = '#161a2c'; c.beginPath(); c.arc(cx, cy, R + 5, 0, TAU); c.stroke();
  c.lineWidth = 2; c.strokeStyle = '#4a5170'; c.beginPath(); c.arc(cx, cy, R - 1, 0, TAU); c.stroke(); c.restore();
}

const gapOff = (r, col) => (col <= 6 ? col - (3 + r) : (10 - r) - col); // how many cells in from the edge of the cut
const SKIN = ['#f3c6b8', '#eeb5ae', '#e6a3a8', '#dc939f', '#cf849a', '#c4789c', '#b76d9c'];

  const k = S.k, chk = k.checked, paired = Object.keys(k.pairs).length, okN = ORG.filter((o) => k.pairs[o] === o).length;
  lab.setGlow('rgba(181, 139, 232, .24)');
  lab.setReadout(`${chk ? okN : paired}/5`, '', '', '#b58be8');
  const cls = (side, key) => {
    const o = side === 'o' ? key : Object.keys(k.pairs).find((x) => k.pairs[x] === key), has = side === 'o' ? !!k.pairs[key] : !!o;
    return [k.sel && k.sel.side === side && k.sel.key === key ? 'sel' : '', has ? 'paired' : '', chk && has ? (side === 'o' ? k.pairs[key] === key : o === key) ? 'good' : 'bad' : ''].join(' ');
  };
  kindsEl.innerHTML = `<div class="kq card">${esc(t.k.q)}</div><div class="kcols">
    <div class="kcol">${ORG.map((o) => `<button class="kc ${cls('o', o)}" data-o="${o}"><span class="e">${EMO[o]}</span><span>${esc(t.k.organs[o])}</span></button>`).join('')}</div><div></div>
    <div class="kcol">${k.pics.map((p) => `<button class="kp ${cls('p', p)}" data-p="${p}"><canvas data-p="${p}"></canvas></button>`).join('')}</div></div>`;
  drawPics();
  $('kCtl').innerHTML = chk
    ? `<div class="verdict" style="color:${okN === 5 ? 'var(--ok)' : 'var(--wip)'}">${esc(okN === 5 ? t.right : t.wrong)}</div>
       <ul class="whys">${ORG.map((o) => `<li><span>${EMO[o]}</span><span>${esc(t.k.why[o])}</span></li>`).join('')}</ul>
       <button class="btn" data-act="kagain">${esc(t.again)}</button>`
    : `<button class="btn" data-act="kcheck"${paired < 5 ? ' disabled' : ''}>${esc(t.check)}</button>`;
  const s = t.st.kinds;
  lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: fineHtml(t) });
}
function renderCount(t) {
  const cc = S.c, done = cc.ans !== null;
  lab.setGlow('rgba(61, 220, 151, .2)');
  cc.txt = '';
  if (!done) {
    lab.setReadout('?', '', '', '#3ddc97');
    askEl.innerHTML = `<div class="q">${esc(t.c.q)}</div><div class="opts">${t.c.o.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`;
    askEl.style.display = ''; cardsEl.style.display = 'none'; cardsEl.innerHTML = ''; $('cCtl').innerHTML = '';
    lab.setState({ emo: '🤔', title: t.c.q, lead: '', body: '', extra: '' });
  } else {
    const ok = cc.ans === 2;
    lab.setReadout('0', '', '', '#3ddc97'); $('val').style.fontSize = 'min(30px, 5.6vw)';
    askEl.innerHTML = `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.wrong)}</div><div class="bigN" id="bigN">0</div>`;
    askEl.style.display = '';
    cardsEl.innerHTML = t.c.cards.map((x, i) => `<div class="cd card${i < cc.shown ? ' on' : ''}">${esc(x)}</div>`).join(''); cardsEl.style.display = '';
    $('cCtl').innerHTML = `<button class="btn" data-act="cagain">${esc(t.again)}</button>`;
    const s = t.st.count;
    lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: fineHtml(t) });
  }
}
render();
</script>
