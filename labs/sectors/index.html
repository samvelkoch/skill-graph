      <span><span class="xx-sw" style="background:${C.T}"></span>${esc(t.lblS)}</span><span>${f(0, 2)} %</span><span>${S.cAns === null ? '?' : f(1, 2) + ' %'}</span></div>
      <div class="xx-fine">${esc(t.cSrc)}</div>`;
    if (S.cAns === null) lab.setState({ emo: '🌍', title: t.cStT, lead: t.cLead, body: t.cBody, extra: nums });
    else lab.setState({ emo: S.cAns === 'svc' ? '🌍' : '🔎', title: S.cAns === 'svc' ? t.cRight : t.cWrong, lead: t.cRes, body: t.cLead, extra: nums });
    lab.setFacts(F('us', 'sch'));
  } else {
    if (S.nAns === null) lab.setState({ emo: '🏞️', title: t.nStT, lead: t.nLead, body: t.nBody, extra: '' });
    else if (S.cmp) lab.setState({ emo: S.nAns === 'farm' ? '🌾' : '🔎', title: S.nAns === 'farm' ? t.nRight.split('!')[0] + '!' : t.cWrong, lead: S.nAns === 'farm' ? t.nRight.slice(t.nRight.indexOf('!') + 1).trim() : t.nWrong, body: t.nLead, extra: `<div class="xx-fine">${esc(t.model)}</div>` });
    else { const [ti, le] = t.nNote[S.last]; lab.setState({ emo: ['🌳', '🌾', '⛏️', '🏭', '🛍️'][S.last], title: ti, lead: le, body: t.nLead, extra: `<div class="xx-fine">${esc(t.model)}</div>` }); }
    lab.setFacts(F('us', 'clark'));
  }
}
function renderSort(t) {
  const c = cur(), K = KIND[S.prod], jobs = t.jobs[S.prod];
  const pool = K.perm.filter((i) => c.place[i] === null).map((i) => `<button class="xx-job${c.sel === i ? ' on' : ''}" data-j="${i}">${esc(jobs[i][0])}</button>`).join('');
  const trays = ['P', 'S', 'T'].map((s) => `<div class="xx-tray" data-s="${s}" role="button" tabindex="0" style="--c:${C[s]}"><b>${esc(t.sec[s][0])}</b><i>${esc(t.sec[s][1])}</i>${
    K.perm.filter((i) => c.place[i] === s).map((i) => `<span class="xx-chip" data-j="${i}">${esc(jobs[i][1])}</span>`).join('')}</div>`).join('');
  sortPane.innerHTML = `<div class="xx-sq"><span class="xx-em">${K.emo}</span><span>${esc(t.sortQ)}</span></div>
    <div class="xx-pool">${pool || `<span class="xx-done">${esc(t.allSorted)}</span>`}</div><div class="xx-trays">${trays}</div>`;
}
render();
</script>
</body>
