// --- drawing helpers ------------------------------------------------------------------------------------------
const RAMP = [[-10, [58, 91, 217]], [0, [74, 163, 232]], [10, [127, 209, 185]], [18, [232, 211, 74]], [25, [245, 154, 61]], [32, [239, 90, 60]]];
const heat = (v) => {
  let i = 0; while (i < RAMP.length - 2 && v > RAMP[i + 1][0]) i++;
  const [a, ca] = RAMP[i], [b, cb] = RAMP[i + 1], t = clamp((v - a) / (b - a), 0, 1);
  return `rgb(${ca.map((x, k) => Math.round(x + (cb[k] - x) * t)).join(',')})`;
};
const cr = (a, x) => { // smooth cyclic curve through 12 monthly values
  const n = 12; x = ((x % n) + n) % n; const i = Math.floor(x), t = x - i;
  const p0 = a[(i + 11) % n], p1 = a[i], p2 = a[(i + 1) % n], p3 = a[(i + 2) % n];
  return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
};
const TONE = { ok: '#3ddc97', bad: '#ff6b6b', sel: '#ffffff' };
function pill(c, text, x, y, o = {}) { // dark rounded label; (x, y) = its centre; stays inside the box [0, bw]
  c.save(); c.font = `${o.w ?? 800} ${o.size ?? 12}px Nunito, sans-serif`; c.textBaseline = 'middle'; c.textAlign = 'left';
  const padL = o.padL ?? 8, tw = c.measureText(text).width, ph = (o.size ?? 12) + 9, pw = tw + padL + 8;
  let px = o.left ? x : x - pw / 2; px = clamp(px, o.minX ?? 2, Math.max(o.minX ?? 2, (o.maxX ?? 9999) - pw));
  c.fillStyle = o.bg ?? 'rgba(8,10,20,.82)'; c.beginPath(); c.roundRect(px, y - ph / 2, pw, ph, ph / 2); c.fill();
  if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = 1.2; c.stroke(); }
  c.fillStyle = o.fg ?? '#fff'; c.fillText(text, px + padL, y + 0.5);
  c.restore(); return { x: px, w: pw };
}

// one climograph: bars = rain (right scale), line = temperature (left scale). o: see the fields used below.
function chart(c, X, Y, W, H, o) {
  const t = T[lang], mini = !!o.mini, hasP = !!o.Pd;
  const L = mini ? 8 : 34, R = mini ? 8 : hasP ? 40 : 14, Tp = mini ? 30 : 42, B = mini ? 8 : 24 + (o.strips ? 46 : 0);
  const px = X + L, py = Y + Tp, pw = W - L - R, ph = H - Tp - B, col = pw / 12, ease = 1 - Math.pow(1 - clamp(o.app ?? 1, 0, 1), 3);
  const yT = (v) => py + (1 - (v - TMIN) / (TMAX - TMIN)) * ph, xm = (m) => px + col * (m + 0.5);
  c.save();
  const bg = c.createLinearGradient(0, Y, 0, Y + H); bg.addColorStop(0, '#1a2244'); bg.addColorStop(1, '#0d1124');
  c.fillStyle = bg; c.beginPath(); c.roundRect(X, Y, W, H, mini ? 10 : 16); c.fill();
  const gl = c.createRadialGradient(X + W * 0.2, Y, 0, X + W * 0.2, Y, W * 0.9); gl.addColorStop(0, 'rgba(120,150,255,.14)'); gl.addColorStop(1, 'rgba(120,150,255,0)');
  c.fillStyle = gl; c.fill();
  c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.stroke();
  c.clip();
  // grid + the two scales
  c.font = '800 12px Nunito, sans-serif'; c.textBaseline = 'middle';
  for (let k = 0; k <= 5; k++) {
    const v = TMIN + k * 10, y = yT(v);
    if (!mini) {
      c.strokeStyle = 'rgba(190,205,255,.10)'; c.lineWidth = 1; c.beginPath(); c.moveTo(px, y); c.lineTo(px + pw, y); c.stroke();
      c.fillStyle = '#ffb199'; c.textAlign = 'right'; c.fillText(nf(v, 0), px - 5, y);
      if (hasP) { c.fillStyle = '#9cc9ff'; c.textAlign = 'left'; c.fillText(nfg(o.pm * k / 5), px + pw + 5, y); }
    }
  }
  if (!mini) {
    c.fillStyle = '#ffb199'; c.textAlign = 'left'; c.fillText('°C', X + 8, Y + 14);
    if (hasP) { c.fillStyle = '#9cc9ff'; c.textAlign = 'right'; c.fillText('mm', X + W - 8, Y + 14); }
  }
  // the 0 °C line
  c.setLineDash([5, 4]); c.strokeStyle = 'rgba(154,215,255,.6)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(px, yT(0)); c.lineTo(px + pw, yT(0)); c.stroke(); c.setLineDash([]);
  // highlighted columns
  for (const h of o.hi ?? []) {
    if (h.what === 'T2') continue;
    c.fillStyle = TONE[h.tone] + '2e'; c.fillRect(px + col * h.m + 1, py, col - 2, ph);
    c.strokeStyle = TONE[h.tone]; c.lineWidth = 1.5; c.strokeRect(px + col * h.m + 1, py, col - 2, ph);
  }
  // bars (rain)
  if (hasP) {
    for (let m = 0; m < 12; m++) {
      const v = o.Pd[m], hh = clamp(v / o.pm, 0, 1) * ph * ease, x = px + col * m + col * 0.2, bw = col * 0.6, base = py + ph;
      if (v <= 0.05) { c.fillStyle = 'rgba(108,182,255,.5)'; c.fillRect(x, base - 1.5, bw, 1.5); continue; }
      const g = c.createLinearGradient(0, base - hh, 0, base); g.addColorStop(0, '#7cc0ff'); g.addColorStop(1, '#2b63c9');
      c.fillStyle = g; c.beginPath(); c.roundRect(x, base - Math.max(hh, 1.5), bw, Math.max(hh, 1.5), [Math.min(3, bw / 2), Math.min(3, bw / 2), 0, 0]); c.fill();
      c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(x + 1, base - Math.max(hh, 1.5), 1.5, Math.max(hh, 1.5));
    }
  }
  // guides (Köppen cut-offs)
  for (const g of o.guides ?? []) {
    c.setLineDash([7, 4]); c.strokeStyle = '#f5c84c'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(px, yT(g)); c.lineTo(px + pw, yT(g)); c.stroke(); c.setLineDash([]);
    pill(c, `${nf(g, 0)} °C`, px + 6, yT(g), { left: true, fg: '#f5c84c', minX: px, maxX: px + pw });
  }

    c.fillStyle = 'rgba(255,255,255,.08)'; c.fillRect(px + col * o.marker, py, col, ph);
    c.setLineDash([3, 3]); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1; c.beginPath(); c.moveTo(xm(o.marker), py); c.lineTo(xm(o.marker), py + ph); c.stroke(); c.setLineDash([]);
  }

  const lines = [];
  if (o.Td) lines.push({ f: (x) => cr(o.Td, x), col: '#ff7a59', p: 1 });
  if (o.T2) lines.push({ f: (x) => cr(o.T2, x - (o.s2 ?? 0)), col: '#4fe0c8', p: o.p2 ?? 1 });
  for (const ln of lines) {
    if (ln.p <= 0) continue;

    c.beginPath();
    for (let x = 0; x <= 11.001; x += 1 / 8) { const X1 = xm(x), Y1 = yT(ln.f(x)); if (x === 0) c.moveTo(X1, Y1); else c.lineTo(X1, Y1); }
    c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = 'rgba(10,12,26,.9)'; c.lineWidth = mini ? 5 : 7; c.stroke();
    c.shadowColor = ln.col; c.shadowBlur = mini ? 0 : 10; c.strokeStyle = ln.col; c.lineWidth = mini ? 2.5 : 3.4; c.stroke(); c.shadowBlur = 0;
    if (!mini) for (let m = 0; m < 12; m++) {
      if (xm(m) > px + (pw + 8) * ln.p) break;
      c.beginPath(); c.arc(xm(m), yT(ln.f(m)), 4, 0, 7); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 2; c.strokeStyle = ln.col; c.stroke();
    }
    c.restore();
  }
  // rings + value labels
  for (const h of o.hi ?? []) {
    if (h.what !== 'T2') continue;
    c.beginPath(); c.arc(xm(h.m), yT(cr(o.T2, h.m - (o.s2 ?? 0))), 8, 0, 7); c.strokeStyle = TONE[h.tone]; c.lineWidth = 2.5; c.stroke();
  }
  for (const r of o.rings ?? []) { c.beginPath(); c.arc(xm(r.m), yT(r.v), 9, 0, 7); c.strokeStyle = '#f5c84c'; c.lineWidth = 2.5; c.stroke(); }
  for (const l of o.labT ?? []) pill(c, `${nf(l.v, 1)} °C`, xm(l.m), yT(l.v) + (l.below ? 20 : -20), { fg: '#ffb199', minX: 2, maxX: X + W - 2 });
  for (const l of o.labP ?? []) pill(c, `${nf(l.v, l.v >= 100 ? 0 : 1)} mm`, xm(l.m), py + ph - clamp(l.v / o.pm, 0, 1) * ph - 14, { fg: '#9cc9ff', minX: 2, maxX: X + W - 2 });

  // month letters
  c.save();
  if (!mini) {
    c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    [...t.mL].forEach((ch, m) => { c.fillStyle = o.marker === m ? '#fff' : '#98A0B8'; c.fillText(ch, xm(m), py + ph + 13); });
  }

  if (o.legend) {
    let x = X + L - 6;
    o.legend.forEach((lg) => {
      const b = pill(c, lg.text, x, Y + 22, { left: true, size: 13, minX: X + 2, maxX: X + W - 2, w: 900, padL: 22 });

  G = mini ? G : { px, py, pw, ph, col, X, Y, W, H };
  c.restore();
}

// --- the map (inline SVG), the monsoon sketch ------------------------------------------------------------------
const mx = (lon) => ((lon + 20) * 4).toFixed(1), my = (lat) => ((72 - lat) * 4).toFixed(1);
const poly = (p) => 'M' + p.map(([a, b]) => `${mx(a)} ${my(b)}`).join('L') + 'Z';
const LAND_D = LAND.map(poly).join('') + poly(JAVA), WATER_D = WATER.map(poly).join('');
function mapSVG(st, cur) { // st: {id: 'ok'|'bad'|'used'}, cur: the id to highlight (answer of this round) or null
  const t = T[lang];

const stageKey = () => {
  const v = lab.view;

  if (v === 'guess') return S.g.done ? 'gend' : 'g' + S.g.order[S.g.ri];

canvasLoop($('cv'), (c, w, h, dt) => {
  const v = lab.view, key = stageKey();

  S.app = Math.min(1, S.app + dt / 0.8);
  const X = 6, Y = 6, W = w - 12, H = h - 12, app = S.app;
  if (v === 'read') {
    const r = S.r, hi = [];
    if (r.ans && r.ti < 2) {
      const tgt = r.ti === 0 ? argmax(BUD.T) : argmax(BUD.P);
      hi.push({ m: tgt, tone: 'ok' }); if (!r.ans.ok) hi.push({ m: r.ans.pick, tone: 'bad' });
    }
    if (r.ans && r.ti === 2) hi.push({ m: argmin(BUD.T), tone: 'ok' });
    chart(c, X, Y, W, H, { Td: BUD.T, Pd: BUD.P, pm: BUD.pm, title: T[lang].city.budapest, app, hi, labT: r.labT, labP: r.labP, marker: r.explore });
  } else if (v === 'guess') {
    const g = S.g;

        const d = CITY[id], x = X + (i % 3) * (cw + gx), y = Y + Math.floor(i / 3) * (chh + gx);
        chart(c, x, y, cw, chh, { Td: d.T, Pd: d.P, pm: d.pm, mini: true, app, title: T[lang].city[id] });
        c.strokeStyle = g.res[id] === 'ok' ? '#3ddc97' : '#ff6b6b'; c.lineWidth = 2; c.beginPath(); c.roundRect(x, y, cw, chh, 10); c.stroke();
      });
    } else {
      const id = g.order[g.ri], d = CITY[id];
      chart(c, X, Y, W, H, { Td: d.T, Pd: d.P, pm: d.pm, title: g.pick ? T[lang].city[id] : '?', app });
    }
  } else {
    const s = S.s;
    s.rev += clamp((s.pick != null ? 1 : 0) - s.rev, -dt / 1.4, dt / 1.4);
    const ts = s.shift * 6; s.shiftNow += clamp(ts - s.shiftNow, -dt * 5, dt * 5);
    if (s.sec === 'kop') {
      const d = CITY[s.kc], hi = [], rings = [{ m: argmin(d.T), v: Math.min(...d.T) }, { m: argmax(d.T), v: Math.max(...d.T) }];
      chart(c, X, Y, W, H, { Td: d.T, Pd: d.P, pm: d.pm, title: T[lang].city[s.kc], app, guides: [18, 10, 0], rings, labT: rings.map((r) => ({ m: r.m, v: r.v })) });
    } else if (s.sec === 'mon') {
      const d = CITY.mumbai;
      chart(c, X, Y, W, H, { Td: d.T, Pd: d.P, pm: d.pm, title: T[lang].city.mumbai, app, hi: [{ m: s.mm, tone: 'sel' }], labP: [{ m: s.mm, v: d.P[s.mm] }] });
    } else {
      const done = s.pick != null, hi = [];
      if (done && s.rev > 0.95) { const w0 = argmax(SYD.T); hi.push({ m: (w0 + Math.round(s.shiftNow)) % 12, tone: 'ok', what: 'T2' }); if (s.pick !== w0) hi.push({ m: (s.pick + Math.round(s.shiftNow)) % 12, tone: 'bad', what: 'T2' }); }
      chart(c, X, Y, W, H, { Td: BUD.T, T2: SYD.T, s2: s.shiftNow, p2: s.rev, app, strips: true, marker: s.mon, hi,
        legend: [{ text: T[lang].s.legend[0], col: '#ff7a59' }, { text: s.rev > 0.02 ? T[lang].s.legend[1] : T[lang].s.legend[1] + ' ?', col: '#4fe0c8' }] });
    }
  }
});

// --- taps ------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const monthAt = (ev) => {
  if (!G) return null;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (y < G.Y || y > G.Y + G.H || x < G.px - 4 || x > G.px + G.pw + 4) return null;
  return clamp(Math.floor((x - G.px) / G.col), 0, 11);
};
$('cv').addEventListener('click', (ev) => {
  const m = monthAt(ev); if (m === null) return;
  const v = lab.view, r = S.r;
  if (v === 'read') {
    if (r.ti < 2 && !r.ans) answerRead(m);
    else if (r.ti >= TASKS) { r.explore = m; sfx.tick(); render(); }
  } else if (v === 'south') {
    const s = S.s;
    if (s.sec === 'mon') { s.mm = m; $('monR').value = m; sfx.tick(); render(); }
    else if (!s.sec && s.pick != null) { s.mon = m; sfx.tick(); render(); }
  }
});
function answerRead(m) {
  const r = S.r, ti = r.ti;
  const tgt = ti === 0 ? argmax(BUD.T) : argmax(BUD.P), ok = m === tgt;
  r.ans = { pick: m, ok };
  if (ti === 0) r.labT.push({ m: tgt, v: BUD.T[tgt] }); else r.labP.push({ m: tgt, v: BUD.P[tgt] });
  (ok ? sfx.good : sfx.bad)(); showStage(); render();
}
// read: the two numeric tasks
const optsFor = (ti) => {
  const lo = argmin(BUD.T), hi = argmax(BUD.T);
  if (ti === 2) return [{ v: Math.round(BUD.P[lo]), kind: 'bar' }, { v: Math.round(BUD.T[lo]), kind: 'ok' }, { v: Math.round(BUD.T[hi]), kind: 'top' }];
  return [{ v: Math.round(BUD.T[hi]), kind: 'top' }, { v: Math.round(BUD.T[hi] + BUD.T[lo]), kind: 'add' }, { v: Math.round(BUD.T[hi] - BUD.T[lo]), kind: 'ok' }];
};
$('rOpts').addEventListener('click', (ev) => {
  const b = ev.target.closest('.cg-opt'); if (!b || b.disabled) return;
  const r = S.r, o = optsFor(r.ti)[+b.dataset.j], lo = argmin(BUD.T);
  r.ans = { pick: +b.dataset.j, kind: o.kind, ok: o.kind === 'ok' };
  if (r.ti === 2) r.labT.push({ m: lo, v: BUD.T[lo], below: false });
  (r.ans.ok ? sfx.good : sfx.bad)(); showStage(); render();
});
$('rNext').onclick = () => {
  const r = S.r;
  if (r.ti >= TASKS) { S.r = { ti: 0, ans: null, labT: [], labP: [], explore: null }; sfx.click(); }
  else { r.ti++; r.ans = null; sfx.click(); }
  render();
};
// guess: tap the map
$('mapBox').addEventListener('click', (ev) => {
  const g = S.g; if (g.pick || g.done) return;
  const svg = $('mapSvg'); if (!svg) return;
  let best = null, bd = 1e9;
  svg.querySelectorAll('.cg-pin').forEach((p) => {
    if (g.res[p.dataset.id]) return;
    const r = p.querySelector('.dot').getBoundingClientRect(), d = Math.hypot(ev.clientX - (r.left + r.width / 2), ev.clientY - (r.top + r.height / 2));
    if (d < bd) { bd = d; best = p.dataset.id; }
  });
  if (!best || bd > 60) return;
  const id = g.order[g.ri]; g.pick = best; g.res[id] = best === id ? 'ok' : 'bad'; g.picked = best;
  (best === id ? sfx.good : sfx.bad)(); showStage(); render();
});
$('gNext').onclick = () => {
  const g = S.g;
  if (g.done) { S.g = { order: shuffle(IDS), ri: 0, pick: null, res: {}, done: false }; sfx.click(); }
  else { g.ri++; g.pick = null; g.picked = null; if (g.ri >= 6) g.done = true; sfx.click(); }
  render();
};
// south
$('mGrid').addEventListener('click', (ev) => {
  const b = ev.target.closest('.cg-opt'); if (!b || b.disabled || S.s.pick != null) return;
  S.s.pick = +b.dataset.m; (S.s.pick === argmax(SYD.T) ? sfx.good : sfx.bad)(); showStage(); render();
});
$('shiftB').onclick = () => { S.s.shift = S.s.shift ? 0 : 1; sfx.click(); render(); };
$('sAgain').onclick = () => { Object.assign(S.s, { pick: null, shift: 0, mon: null }); sfx.click(); render(); };
$('kCities').addEventListener('click', (ev) => { const b = ev.target.closest('[data-c]'); if (!b) return; S.s.kc = b.dataset.c; sfx.tick(); render(); });
$('monR').addEventListener('input', () => { S.s.mm = +$('monR').value; sfx.tick(); render(); });
$('secChips').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-k]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  S.s.sec = S.s.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); render();
});

// --- one render per change ---------------------------------------------------------------------------------------
const fine = () => `<div class="cg-fine">${esc(T[lang].fine)}</div>`;
function render() {
  const v = lab.view;
  document.body.dataset.v = v;
  $('sRead').hidden = v !== 'read'; $('sGuess').hidden = v !== 'guess'; $('sSouth').hidden = v !== 'south';
  if (v === 'read') renderRead(); else if (v === 'guess') renderGuess(); else renderSouth();
}
function renderRead() {
  const t = T[lang], r = S.r, ti = r.ti, rt = t.r, mF = t.mF, done = ti >= TASKS;
  lab.setGlow('rgba(255, 122, 89, .26)');
  const lo = argmin(BUD.T), hi = argmax(BUD.T), wet = argmax(BUD.P);
  const task = done ? null : rt.q[ti], isTap = ti < 2;
  $('rQ').textContent = done ? rt.done[1] : task;
  const opts = !done && !isTap ? optsFor(ti) : [];
  $('rOpts').innerHTML = opts.map((o, j) => `<button class="cg-opt ${r.ans ? (o.kind === 'ok' ? 'ok' : r.ans.pick === j ? 'bad' : '') : ''}" data-j="${j}"${r.ans ? ' disabled' : ''}>${nf(o.v, 0)} °C</button>`).join('');
  $('rOpts').hidden = !opts.length;
  $('rNext').hidden = !(r.ans || done);
  $('rNext').textContent = done ? t.again : t.next;
  let st, val = '?', sub = rt.taskOf(Math.min(ti + 1, TASKS)), pill = '';
  if (done) {
    const m = r.explore;
    if (m == null) { st = { emo: '🔎', title: rt.done[0], lead: rt.done[1] }; val = '✓'; sub = ''; }
    else { st = { emo: '🔎', title: rt.done[0], lead: rt.done[1] }; val = `${nf(BUD.T[m], 1)} °C`; sub = `${nf(BUD.P[m], BUD.P[m] >= 100 ? 0 : 1)} mm`; pill = mF[m]; }
  } else if (!r.ans) {
    st = { emo: '📖', title: rt.pre[0], lead: rt.pre[1] };
  } else {
    const a = r.ans, tN = (x) => nf(x, 1);
    if (ti === 0) { val = `${tN(BUD.T[hi])} °C`; sub = mF[hi]; st = a.ok ? { emo: '✅', title: rt.ok, lead: rt.t1ok(mF[hi], tN(BUD.T[hi])) } : { emo: '🤔', title: rt.no, lead: rt.t1bad(mF[a.pick], mF[hi], tN(BUD.T[hi])) }; }
    else if (ti === 1) { val = `${nf(BUD.P[wet], 1)} mm`; sub = mF[wet]; st = a.ok ? { emo: '✅', title: rt.ok, lead: rt.t2ok(mF[wet], nf(BUD.P[wet], 1)) } : { emo: '🤔', title: rt.no, lead: rt.t2bad(mF[a.pick], mF[wet], nf(BUD.P[wet], 1)), body: a.pick === hi ? rt.t2line : '' }; }
    else if (ti === 2) { val = `${tN(BUD.T[lo])} °C`; sub = mF[lo]; st = a.kind === 'ok' ? { emo: '✅', title: rt.ok, lead: rt.t3ok(mF[lo], tN(BUD.T[lo])) } : { emo: '🤔', title: rt.no, lead: rt.t3bad(mF[lo], tN(BUD.T[lo])), body: a.kind === 'bar' ? rt.t3bar : rt.t3top }; }
    else { const d = BUD.T[hi] - BUD.T[lo]; val = `${tN(d)} °C`; sub = `${mF[hi]} − ${mF[lo]}`; const line = rt.t4ok(tN(BUD.T[hi]), tN(BUD.T[lo]), tN(d));
      st = a.ok ? { emo: '✅', title: rt.ok, lead: line } : { emo: '🤔', title: rt.no, lead: rt.t4bad(tN(BUD.T[hi]), tN(BUD.T[lo]), tN(d)), body: a.kind === 'add' ? rt.t4add : rt.t4top }; }
  }
  lab.setReadout(val, sub, pill, '#ff7a59');
  lab.setState({ body: '', ...st, extra: fine() });
  lab.setFacts([t.f.kop, t.f.wl, t.f.bars].map(([text, src]) => ({ emo: '💡', text, src })));
}
function renderGuess() {
  const t = T[lang], g = S.g, gt = t.g, id = g.order[Math.min(g.ri, 5)], d = CITY[id];
  lab.setGlow('rgba(78, 168, 255, .26)');
  const st = {};
  IDS.forEach((k) => { if (g.res[k]) st[k] = g.done ? g.res[k] : (k === id && g.pick ? g.res[k] : 'used'); });
  if (g.pick && g.pick !== id) st[g.pick] = 'bad';
  if (g.pick) st[id] = 'ok';
  $('mapBox').innerHTML = mapSVG(g.done ? Object.fromEntries(IDS.map((k) => [k, g.res[k]])) : st, null);
  $('mapNote').textContent = gt.mapNote;
  $('gQ').textContent = g.done ? '' : gt.q; $('gQ').hidden = g.done;
  $('gNext').hidden = !(g.pick || g.done);
  $('gNext').textContent = g.done ? t.again : t.next;
  let s, val = '?', sub = gt.round(Math.min(g.ri + 1, 6), 6), pill = '', facts;
  if (g.done) {
    const k = IDS.filter((x) => g.res[x] === 'ok').length;
    s = { emo: k >= 5 ? '🏆' : '🌍', title: gt.endTitle(k), lead: gt.endLead }; val = `${k}/6`; sub = ''; facts = [t.f.normal];
  } else if (!g.pick) {
    s = { emo: '🌍', title: gt.pre[0], lead: gt.pre[1] }; facts = [t.f.normal];
  } else {
    const ok = g.res[id] === 'ok';
    s = { emo: ok ? '✅' : '🤔', title: ok ? gt.ok : gt.bad(t.city[id]), lead: gt.why[id] };
    val = `${nf(d.avg, 1)} °C`; sub = `${nfg(d.tot)} mm`; pill = t.city[id];
    const f = t.f;
    const jjas = sum(CITY.mumbai.P.slice(5, 9));
    facts = [{ moscow: f.moscow, budapest: f.budapest, singapore: f.singapore(nf(Math.min(...CITY.singapore.P), 0), nfg(CITY.singapore.tot)), cairo: f.cairo(nf(CITY.cairo.tot, 0)),
      mumbai: f.mumbai(nfg(jjas), nfg(CITY.mumbai.tot), nf(jjas / CITY.mumbai.tot * 100, 0)), sydney: f.sydney }[id]];
  }
  lab.setReadout(val, sub, pill, '#4ea8ff');
  lab.setState({ ...s, body: '', extra: fine() });
  lab.setFacts(facts.map(([text, src]) => ({ emo: '💡', text, src })));
}
function renderSouth() {
  const t = T[lang], s = S.s, st = t.s, f = t.f;
  lab.setGlow('rgba(79, 224, 200, .24)');
  $('sCmp').hidden = !!s.sec; $('sKop').hidden = s.sec !== 'kop'; $('sMon').hidden = s.sec !== 'mon';
  const open = secret.unlocked();
  $('secChips').innerHTML = ['kop', 'mon'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${s.sec === k ? 'on' : ''}" data-k="${k}" type="button">${open ? `${k === 'kop' ? '🔤' : '🌧️'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const peak = argmax(SYD.T), shifted = s.shift === 1;
  if (s.sec === 'kop') {
    const d = CITY[s.kc], code = t.kop.codeTxt[s.kc] ?? d.code, letters = [...d.code];
    $('kQ').textContent = t.kop.pick;
    $('kCities').innerHTML = IDS.map((k) => `<button class="chip ${k === s.kc ? 'on' : ''}" data-c="${k}" type="button">${esc(t.city[k])}</button>`).join('');
    const parts = d.code === 'BWh' ? ['B', 'W', 'h'] : letters;
    $('kDec').innerHTML = parts.map((ch) => `<div><b>${ch}</b><span>${esc(t.kop[ch])}</span></div>`).join('') + (t.kop.note[s.kc] ? `<div class="cg-fine">${esc(t.kop.note[s.kc])}</div>` : '');
    lab.setReadout(code, t.city[s.kc], '', '#f5c84c');
    lab.setState({ emo: '🔤', title: t.kop.title(t.city[s.kc], code), lead: t.kop.lead, body: '', extra: fine() });
    lab.setFacts([{ emo: '💡', text: f.kop[0], src: f.kop[1] }]);
    return;
  }
  if (s.sec === 'mon') {
    const d = CITY.mumbai, m = s.mm, summer = m >= 5 && m <= 8;
    $('monL').textContent = t.mF[m]; $('monR').value = m;
    $('monSvg').innerHTML = monSVG(m, d.P[m] / 800);
    lab.setReadout(`${nf(d.P[m], d.P[m] >= 100 ? 0 : 1)} mm`, t.mF[m], '', '#6cb6ff');
    lab.setState({ emo: '🌧️', title: t.mon.title, lead: t.mon.lead(t.mF[m], nf(d.P[m], d.P[m] >= 100 ? 0 : 1)), body: t.mon.wind[summer ? 0 : 1], extra: fine() });
    const jjas = sum(d.P.slice(5, 9));
    lab.setFacts([{ emo: '💡', text: f.mon80[0], src: f.mon80[1] }, { emo: '💡', text: f.mumbai(nfg(jjas), nfg(d.tot), nf(jjas / d.tot * 100, 0))[0], src: f.mumbai(0, 0, 0)[1] }]);
    return;
  }
  // compare: predict, then reveal
  $('cQ').textContent = st.q;
  $('mGrid').innerHTML = t.mS.map((m, i) => {
    const cls = s.pick == null ? '' : i === peak ? 'ok' : i === s.pick ? 'bad' : '';
    return `<button class="cg-opt ${cls}" data-m="${i}" type="button"${s.pick != null ? ' disabled' : ''}>${esc(m)}</button>`;
  }).join('');
  $('mGrid').hidden = s.pick != null; $('cQ').hidden = s.pick != null;
  $('shiftB').hidden = s.pick == null; $('shiftB').textContent = shifted ? st.back : st.shift;
  $('sAgain').hidden = s.pick == null; $('sAgain').textContent = t.again;
  let state, val = '?', sub = '', pill = '', facts;
  if (s.pick == null) {
    state = { emo: '🌏', title: st.pre[0], lead: st.pre[1] };
    facts = [f.syd0(nfg(Math.round(sum(SYD.P) / 50) * 50), nfg(Math.round(BUD.tot)))];
  } else {
    const ok = s.pick === peak, mm = t.mF[peak];
    if (shifted) state = { emo: '🔁', title: st.shifted[0], lead: st.shifted[1](nf(Math.min(...SYD.T), 1)) };
    else state = { emo: ok ? '✅' : '🤔', title: ok ? st.ok : st.bad(t.mF[s.pick]), lead: st.reveal(mm, nf(SYD.T[peak], 1), nf(BUD.T[peak], 1)), body: st.hint };
    facts = [f.syd1];
    if (s.mon != null) { const o = st.month(t.mF[s.mon], nf(BUD.T[s.mon], 1), nf(SYD.T[s.mon], 1)); val = o.val; sub = o.sub; } else { val = nf(SYD.T[peak], 1) + ' °C'; sub = mm; }
  }
  lab.setReadout(val, sub, pill, '#4fe0c8');
  lab.setState({ ...state, body: state.body ?? '', extra: fine() });
  lab.setFacts(facts.map(([text, src]) => ({ emo: '💡', text, src })));
}
render();
</script>
