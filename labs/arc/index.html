// --- input on the picture ------------------------------------------------------------------------------------------
const cv = $('cv');
const toD = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - G.ox) / G.s, (ev.clientY - r.top - G.oy) / G.s]; };
function setDot(i, y) {
  const nv = vy(y), changed = nv !== S.dots[i] || !S.touched[i];
  S.dots[i] = nv; S.touched[i] = true; S.sel = i;
  if (changed) { sfx.tick(); render(); }
}
cv.addEventListener('pointerdown', (ev) => {
  const [x, y] = toD(ev), v = lab.view;
  if (y < 84) { if (x >= 0 && x <= W) { S.sel = clamp(Math.floor((x - 5) / 70), 0, 4); sfx.tick(); render(); } return; }
  if (v === 'arc') {
    if (S.revealed || y < 86 || y > PL.bot) return;
    const i = clamp(Math.round((x - 38) / 70), 0, 4);
    S.drag = i; cv.setPointerCapture?.(ev.pointerId); setDot(i, y);
  } else if (v === 'round' && !S.checked3) {
    for (const id of [...TRAY].reverse()) {
      const p = S.pos[id]; if (!p) continue;
      if (x >= p.x && x <= p.x + 80 && y >= p.y && y <= p.y + tokH()) {
        S.place[id] = S.place[id] === 'L' ? 'R' : 'L'; S.pat[id] = ++S.ord; sfx.click(); render(); return;
      }
    }
  }
});
cv.addEventListener('pointermove', (ev) => { if (S.drag >= 0) setDot(S.drag, toD(ev)[1]); });
const endDrag = () => { S.drag = -1; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
$('stExtra').addEventListener('click', (ev) => {
  const li = ev.target.closest('[data-sc]'); if (!li) return;
  S.sel = +li.dataset.sc; sfx.tick(); render();
});

// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function resetArc() { S.dots = [5, 5, 5, 5, 5]; S.touched = [false, false, false, false, false]; S.revealed = false; S.rv = 0; S.sel = 0; }
function resetRound() { for (const id of TRAY) { S.place[id] = 'tray'; S.pat[id] = 0; } S.checked3 = false; S.rv3 = 0; S.was = {}; }
function checkArc() {
  if (S.revealed) { resetArc(); sfx.click(); return; }
  if (!S.touched.every(Boolean)) return;
  S.revealed = true; S.rv = 0; S.sel = TP[S.var]; sfx.good(); showStage();
}
function checkRound() {
  if (S.checked3) { resetRound(); sfx.click(); return; }
  if (!TRAY.every((q) => S.place[q] !== 'tray')) return;
  let ok = 0;
  for (const id of TRAY) { const right = S.place[id] === (CHARS[id].ch ? 'L' : 'R'); S.was[id] = right; if (right) ok++; }
  for (const id of TRAY) { S.place[id] = CHARS[id].ch ? 'L' : 'R'; S.pat[id] = ++S.ord; }
  S.checked3 = true; S.rv3 = 0; (ok === 4 ? sfx.good : sfx.bad)(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-slot], [data-card], [data-sec]'); if (!b) return;
  if (b.dataset.act === 'arc') return checkArc() ?? render();
  if (b.dataset.act === 'round') return checkRound() ?? render();
  if (b.dataset.card !== undefined) { S.pick = S.pick === +b.dataset.card ? null : +b.dataset.card; S.msg = S.pick === null ? 'pre' : 'pick'; sfx.tick(); return render(); }
  if (b.dataset.slot !== undefined) {
    const i = +b.dataset.slot;
    if (S.chain[i] !== null) return;
    if (S.pick === null) { S.msg = 'nopick'; sfx.tick(); return render(); }
    if (S.pick === i) { S.chain[i] = i; S.pick = null; S.msg = S.chain.every((q) => q !== null) ? 'done' : 'pre'; sfx.good(); }
    else { S.shake = i; S.msg = 'wrong'; sfx.bad(); setTimeout(() => { S.shake = -1; render(); }, 450); }
    return render();
  }
  if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    const want = b.dataset.sec === 'a' ? 'fall' : 'early';
    S.var = S.var === want ? 'rise' : want; resetArc(); sfx.click();
    if (lab.view !== 'arc') document.querySelector('#views [data-view="arc"]')?.click();
    render();
  }
});

// --- one render per change ------------------------------------------------------------------------------------------
const capsHtml = (t, key, sel) => `<ol class="ar-caps">${t.caps[key].map((x, i) => `<li class="${i === sel ? 'on' : ''}" data-sc="${i}"><b>${i + 1}</b><span>${esc(x)}</span></li>`).join('')}</ol>`;
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('vArc').style.display = v === 'arc' ? '' : 'none';
  $('vCause').style.display = v === 'cause' ? '' : 'none';
  $('vRound').style.display = v === 'round' ? '' : 'none';
  cv.style.touchAction = v === 'cause' ? 'pan-y' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo, on) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('a', '📉', S.var === 'fall') + sc('b', '⛈️', S.var === 'early');
  if (v === 'arc') renderArc(t); else if (v === 'cause') renderCause(t); else renderRound(t);
}
function renderArc(t) {
  const key = S.var, ax = t.ax[key === 'fall' ? 'fall' : 'rise'], au = AUTH[key], d = S.dots, n = S.touched.filter(Boolean).length;
  lab.setGlow('rgba(255, 180, 84, .24)');
  $('arQ').textContent = ax.q;
  $('arCheck').textContent = S.revealed ? t.again : t.check;
  $('arCheck').disabled = !S.revealed && n < 5;
  $('arLeg').innerHTML = S.revealed ? `<span><i style="background:#8fb8ff"></i>${esc(t.yours)}</span><span><i style="background:#ffb454"></i>${esc(t.story)}</span>` : '';
  if (!S.revealed) {
    lab.setReadout(`${n}/5`, t.ro.dots, '', '#8fb8ff');
    lab.setState({ emo: '📈', title: ax.q, lead: ax.lead, body: '', extra: capsHtml(t, key, S.sel) });
  } else {
    const diffs = d.slice(1).map((x, i) => Math.abs(x - d[i])), mx = Math.max(...diffs), tp = TP[key];
    const gap = d.reduce((a, x, i) => a + Math.abs(x - au[i]), 0);
    const [ti, le] = mx > 0 && diffs[tp - 1] === mx ? t.res.ok(tp + 1) : mx > 0 ? t.res.miss(tp + 1, diffs.indexOf(mx) + 2) : t.res.flat(tp + 1);
    const note = key === 'fall' ? ` ${t.res.fall}` : key === 'early' ? ` ${t.res.early}` : '';
    lab.setReadout(String(gap), t.ro.gap(gap), gap <= 4 ? t.ro.close : '', '#ffb454');
    lab.setState({ emo: mx > 0 && diffs[tp - 1] === mx ? '✅' : '🤔', title: ti, lead: le, body: t.res.gap(gap) + note, extra: capsHtml(t, key, S.sel) });
  }
  lab.setFacts([{ emo: '🎄', text: t.facts.arc.text, src: t.facts.arc.src }]);
}
function renderCause(t) {
  const c = t.chain, placed = S.chain.filter((q) => q !== null).length, last = S.chain.reduce((a, q, i) => (q !== null ? i : a), -1);
  lab.setGlow('rgba(61, 220, 151, .22)');
  $('cQ').textContent = c.q;
  $('slots').innerHTML = c.names.map((nm, i) => {
    const full = S.chain[i] !== null;
    return `<button class="ar-slot ${full ? 'ok full' : ''} ${S.shake === i ? 'shake' : ''} ${!full && S.pick !== null ? 'aim' : ''}" data-slot="${i}"><b>${i + 1}. ${esc(nm)}</b><span>${esc(full ? c.cards[S.chain[i]] : `＋ ${c.empty}`)}</span></button>`;
  }).join('');
  $('cards').innerHTML = SHUF.filter((k) => !S.chain.includes(k)).map((k) => `<button class="ar-card ${S.pick === k ? 'on' : ''}" data-card="${k}">${esc(c.cards[k])}</button>`).join('');
  lab.setReadout(`${placed}/5`, c.unit, last >= 0 ? c.cour(CV[last]) : '', '#3ddc97');
  const m = S.msg === 'done' && placed === 5 ? c.done : c[S.msg] || c.pre;
  lab.setState({ emo: S.msg === 'wrong' ? '🤔' : placed === 5 ? '✅' : '🔗', title: m[0], lead: m[1], body: '', extra: '' });
  lab.setFacts([{ emo: '📖', text: t.facts.cause.text, src: t.facts.cause.src }]);
}
function renderRound(t) {
  const r = t.rd, n = TRAY.filter((q) => S.place[q] !== 'tray').length, ok = TRAY.filter((q) => S.was[q]).length;
  lab.setGlow('rgba(200, 182, 255, .24)');
  $('rQ').textContent = r.q;
  $('rCheck').textContent = S.checked3 ? t.again : t.check;
  $('rCheck').disabled = !S.checked3 && n < 4;
  if (!S.checked3) {
    lab.setReadout(`${n}/4`, r.sorted, '', '#c8b6ff');
    lab.setState({ emo: '🎭', title: r.pre[0], lead: r.pre[1], body: '', extra: capsHtml(t, 'rise', S.sel) });
  } else {
    lab.setReadout(`${ok}/4`, r.right, '', '#c8b6ff');
    const [ti, le] = ok === 4 ? r.all : r.some(ok);
    lab.setState({ emo: ok === 4 ? '✅' : '🤔', title: ti, lead: le, body: r.note, extra: capsHtml(t, 'rise', S.sel) });
  }
  lab.setFacts([{ emo: '📚', text: t.facts.round.text, src: t.facts.round.src }]);
}
render();
</script>
</body>
</html>
