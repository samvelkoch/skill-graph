  }
  return `<div class="hu-row">${['hurricane', 'tornado', 'thunder', 'heat', 'drought'].map((k) => `<button class="chip ${S.ext.sel === k ? 'on' : ''}" data-ek="${k}"${card ? ' disabled' : ''}>${EV[k].emo} ${esc(t.ext.chips[k])}</button>`).join('')}</div>
    ${card ? '' : `<div class="hu-row"><span class="hu-hint">${esc(t.ext.hint)}</span></div>`}`;
}
const FUEL_TICKS = [1, 2, 3, 4, 5].map((n, i) => ({ f: [119, 154, 178, 209, 252][i] / 280, label: String(n) }));
function uiFuel() {
  const t = T[lang], pf = Pd.fuel;
  if (S.gk !== `fuel|${lang}`) { S.gk = `fuel|${lang}`; lab.setGauge(pf.guess === null ? 0 : F.I / 280, FUEL_TICKS, t.cat); }
  if (pf.guess === null) {
    lab.setReadout('?', '', '', '#4ea8ff'); lab.setGauge(0);
    lab.setState({ emo: '🤔', title: t.ask.fuel.q, lead: '', body: '' }); lab.setFacts([]);
    return;
  }
  const I = F.I, c = catOf(I), env = F.env, s = fmt1(env.sst);
  lab.setReadout(Math.round(I), t.kmh, c ? `${t.cat} ${c}` : I >= 63 ? t.storm : t.depression, colOf(I));
  lab.setGauge(I / 280);
  const extra = `<div class="hu-ex">🌊 ${s} °C · ${Math.round(I)} ${t.kmh}</div>`;
  let st;
  if (S.sec === 'south') st = { emo: '🌀', title: t.secrets.south[0], lead: t.sec.south.lead, body: t.sec.south.body, extra };
  else if (S.sec === 'names') {
    const n = t.sec.names, idx = NAMES.indexOf(F.name);
    const list = NAMES.slice(0, 6).map((x) => (x === F.name ? `<b>${x}</b>` : x)).join(' · ') + ' …' + (idx >= 6 ? ` <b>${F.name}</b>` : '');
    st = { emo: '🏷️', title: t.secrets.names[0], lead: F.name ? n.named(F.name) : n.unnamed, body: n.body, extra: `<div class="hu-ex"><b>${esc(n.list)}</b><br>${list}</div>${extra}` };
  } else if (I < 2 && (env.land || env.sst < 26)) st = { emo: '💨', ...t.st.dead };
  else if (env.land) st = { emo: '🏝️', title: t.st.land.title, lead: t.st.land.lead, body: t.st.land.body };
  else if (env.sst < 26) st = { emo: '🧊', title: t.st.cold.title, lead: t.st.cold.lead(s), body: t.st.cold.body };
  else st = { emo: '🔥', title: t.st.warm.title, lead: t.st.warm.lead(s), body: t.st.warm.body };
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body, extra: st.extra || '' });
  lab.setFacts(t.facts.fuel);
}
const INS_TICKS = [{ f: 0.5, label: '130' }, { f: 1, label: '260' }];
function uiInside() {
  const t = T[lang], pd = Pd.inside;
  if (S.gk !== `inside|${lang}`) { S.gk = `inside|${lang}`; lab.setGauge(0, INS_TICKS, t.kmh); }
  if (pd.guess === null) {
    lab.setReadout('?', '', '', '#8aa0d0'); lab.setGauge(0);
    lab.setState({ emo: '🤔', title: t.ask.inside.q, lead: '', body: '' }); lab.setFacts(t.facts.inside);
    return;
  }
  const km = S.ins.km, v = Math.round(windAt(km)), z = zoneOf(km), st = t.ins[z];
  lab.setReadout(v, t.kmh, t.ins.zone[z], ZCOL[z]);
  lab.setGauge(v / 260);
  lab.setState({ emo: z === 'eye' ? '👁️' : z === 'wall' ? '🌪️' : '🌧️', title: st.title, lead: st.lead(v), body: st.body });
  lab.setFacts(t.facts.inside);
}
function uiExt() {
  const t = T[lang], pd = Pd.ext, e = t.ext;
  if (pd.guess === null) {
    lab.setReadout('?', '', '', '#8aa0d0');
    lab.setState({ emo: '🤔', title: t.ask.ext.q, lead: '', body: '' }); lab.setFacts([]);
    return;
  }
  const k = S.ext.sel;
  lab.setReadout(e.val[k], e.across, e.time[k], EV[k].col);
  lab.setState({ emo: EV[k].emo, title: e.chips[k], lead: `↔ ${e.size[k]} · ⏱ ${e.time[k]}`, body: e.desc[k] });
  lab.setFacts(t.facts.extremes);
}
function render() {
  const v = lab.view, k = vkey(v), t = T[lang], pd = Pd[k], card = !pd.done;
  document.body.dataset.v = v;
  lab.setGlow(GLOW[v]);
  askEl.style.display = card ? '' : 'none';
  if (card) askEl.innerHTML = askHTML(v);
  const key = [v, lang, card ? (pd.guess === null ? 'q' : 'r') : 'l', S.sec, secret.unlocked(), S.ext.sel].join('|');
  if (key !== ctrlKey) { ctrlKey = key; $('ctrlBody').innerHTML = ctrlHTML(v, t, card); }
  fitStage();
  $('cv').style.touchAction = v !== 'extremes' && pd.done ? 'none' : 'auto';
  S.gk = '';
  if (v === 'fuel') uiFuel(); else if (v === 'inside') uiInside(); else uiExt();
}

askEl.addEventListener('click', (ev) => {
  const k = vkey(lab.view), pd = Pd[k];
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.a !== undefined) {
    pd.guess = +b.dataset.a; pd.t0 = now();
    const ok = k === 'fuel' ? BEST : 1;
    (pd.guess === ok ? sfx.good : sfx.bad)(); showStage();
  } else if (b.dataset.go) { pd.done = true; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.act === 'reset') { resetStorm(); sfx.click(); uiFuel(); }
  else if (b.dataset.act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    S.sec = S.sec === k ? null : k;
    const pf = Pd.fuel; if (pf.guess === null) { pf.guess = -1; pf.t0 = now(); pf.done = true; }
    resetStorm(); sfx.click(); render();
  } else if (b.dataset.ek) { S.ext.sel = b.dataset.ek; S.ext.selT = now(); sfx.tick(); render(); }
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'huSl') return;
  S.ins.km = +ev.target.value; S.ins.moved = true; uiInside();
});

// dragging on the canvas: steer the storm, or move the wind meter
const cv = $('cv');
let down = false;
function moveTo(ev) {
  const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  if (lab.view === 'fuel') {
    const w = r.width, hh = Math.max(40, r.height - S.y0), s = Math.min(w / 120, hh / 100), ox = (w - 120 * s) / 2, oy = S.y0 + (hh - 100 * s) / 2;
    F.tx = clamp((px - ox) / s, 2, 118); F.ty = clamp((py - oy) / s, 3, 96); F.moved = true;
  } else if (lab.view === 'inside') {
    S.ins.km = Math.round(clamp(((px - 14) / (r.width - 28)) * 300 - 150, -150, 150)); S.ins.moved = true;
    const sl = $('huSl'); if (sl) sl.value = S.ins.km;
    uiInside();
  }
}
cv.addEventListener('pointerdown', (ev) => {
  const k = vkey(lab.view); if (!Pd[k].done || lab.view === 'extremes') return;
  down = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* not needed */ }
  moveTo(ev);
});
cv.addEventListener('pointermove', (ev) => { if (down) moveTo(ev); });
for (const n of ['pointerup', 'pointercancel']) cv.addEventListener(n, () => { down = false; });
addEventListener('resize', () => fitStage());

canvasLoop(cv, (ctx, w, h, dt, t) => {
  const v = lab.view;
  if (v === 'fuel') drawFuel(ctx, w, h, dt, t); else if (v === 'inside') drawInside(ctx, w, h, dt, t); else drawExt(ctx, w, h, dt, t);
});
render();
</script>
</body>
</html>
