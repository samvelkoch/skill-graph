  $('sAdd').innerHTML = `<button class="btn" data-act="add"${n >= NMAX ? ' disabled' : ''}>${esc(sk.add)}</button><button class="chip st-chip" data-act="rem"${n <= 0 ? ' disabled' : ''}>${esc(sk.rem)}</button><button class="chip st-chip" data-act="clr">${esc(sk.clr)}</button>`;
  $('sSecCtl').innerHTML = secOn === 'snow' ? `<button class="btn" data-act="ice">${esc(sc.snowBtn)}</button>`
    : secOn === 'sun' ? `<button class="btn" data-act="sadd"${S.sunN >= 3 ? ' disabled' : ''}>${esc(sc.sunAdd)}</button><button class="chip st-chip" data-act="srem"${S.sunN <= 0 ? ' disabled' : ''}>${esc(sc.sunRem)}</button>` : '';
  const chip = (k, emo) => `<button class="chip st-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('sSecChips').innerHTML = chip('snow', '❄️') + chip('sun', '🕶️');
  $('sFine').textContent = t.fine;
  let st, pct, tg;
  if (secOn === 'snow') {
    tg = S.ice ? 0.9 : 0.5; pct = Math.round(tg * 100);
    st = S.ice ? { emo: '🧊', title: sc.iceT, lead: sc.iceL } : { emo: '❄️', title: sc.snowT, lead: sc.snowL };
    lab.setFacts([{ emo: '❄️', text: t.facts.snow, src: SRC.snow }]);
  } else if (secOn === 'sun') {
    tg = SUN ** S.sunN; pct = Math.round(tg * 100);
    st = { emo: '🕶️', title: sc.sunT(S.sunN), lead: sc.sunL };
    lab.setFacts([{ emo: '❄️', text: t.facts.snow, src: SRC.snow }]);
  } else {
    tg = FRAC ** n; pct = Math.round(tg * 100);
    if (S.sg === null) st = { emo: '🤔', title: sk.title0, lead: sk.q };
    else if (n === 0) st = { emo: '📚', title: sk.ready, lead: sk.readyLead };
    else if (n < 3) st = { emo: '📚', title: sk.stT(n, pct), lead: sk.line(Math.round(FRAC * 100)) };
    else st = { emo: S.sg === 'fade' ? '✅' : '🤔', title: S.sg === 'fade' ? sk.right : sk.wrong, lead: sk.line(Math.round(FRAC * 100)), body: n >= 6 ? sk.end : sk.stT(n, pct) };
    lab.setFacts([{ emo: '❄️', text: t.facts.snow, src: SRC.snow }, { emo: '🪟', text: t.facts.frost, src: SRC.frost }]);
  }
  lab.setReadout(`${pct}%`, sk.sub, sk.pill, '#f0c35a');
  lab.setGauge(tg, [{ f: 0, label: '0%' }, { f: 0.5, label: '50%' }, { f: 1, label: '100%' }], sk.cap);
  lab.setState({ body: '', extra: '', ...st });
}
render();
</script>
</body>
</html>
