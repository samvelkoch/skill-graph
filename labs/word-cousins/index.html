  const open = S.ans.t !== null, p = S.taxiT0 > 0 ? tt - S.taxiT0 : -1;
  let [px, py] = TAXI_HOME, sc = 1, rot = 0;

  else if (p >= 0.45 && p < 1.4) {

    px = TAXI_HIT[0] + (px - TAXI_HIT[0]) * e; py = TAXI_HIT[1] + (py - TAXI_HIT[1]) * e - bounce; sc = 0.7 + 0.3 * e; rot = 0.4 * (1 - e) + Math.sin(q * 12) * 0.08 * (1 - q);
  }

  if (burst >= 0) { c.save(); c.globalAlpha = 1 - burst; c.lineWidth = 3; c.strokeStyle = '#e5484d'; c.beginPath(); c.arc(TAXI_HIT[0], TAXI_HIT[1], 8 + burst * 30, 0, 7); c.stroke(); c.restore(); }
  c.save(); c.translate(px, py); c.rotate(rot); c.scale(sc, sc);

  rr(c, -w / 2, -h / 2, w, h, 14);
  const g = c.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); g.addColorStop(0, '#3a3140'); g.addColorStop(1, '#1e1a2a');
  c.fillStyle = g; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 2; c.strokeStyle = '#e0b050'; c.stroke();
  c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.font = font(900, 24); c.fillText('🚕', -w / 2 + 12, -9);
  c.fillStyle = '#fff'; c.font = font(900, 24); c.fillText('taxi', -w / 2 + 50, -9);
  c.font = font(700, 12.5); c.fillStyle = '#c9cfe2'; c.fillText('Taxi · taksi · такси', -w / 2 + 12, 20);
  c.restore();
  if (open) addHit(TAXI_HOME[0] - 77, TAXI_HOME[1] - 35, 154, 70, 'taxi', '');
  if (p > 0.5 && p < 7) pill(c, t.borrowed, TAXI_HOME[0], TAXI_HOME[1] - 52, { size: 13, alpha: clamp01((p - 0.5) / 0.25) * clamp01((7 - p) / 1), bg: '#6f1d22', stroke: '#e5484d', color: '#fff' });
}

// --- map ---------------------------------------------------------------------------------------------------------
let mapBase = null, mapKey = '';
function mapBaseFor(w, h, d) {
  const key = `${w}|${h}|${d}|${SC}`;
  if (mapBase && key === mapKey) return mapBase;
  const cv = document.createElement('canvas'); cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  const c = cv.getContext('2d'); c.setTransform(d * SC, 0, 0, d * SC, d * OX, d * OY);
  c.lineJoin = 'round';
  c.save(); rr(c, MAP.x0, MAP.y0, MAP.mw, MAP.mh, 14); c.clip();
  let g = c.createRadialGradient(MAP.x0 + MAP.mw * 0.45, MAP.y0 + MAP.mh * 0.4, 10, MAP.x0 + MAP.mw / 2, MAP.y0 + MAP.mh / 2, MAP.mw * 0.7);
  g.addColorStop(0, '#1f4c68'); g.addColorStop(0.6, '#133248'); g.addColorStop(1, '#0a1b2b');
  c.fillStyle = g; c.fillRect(MAP.x0, MAP.y0, MAP.mw, MAP.mh);
  c.strokeStyle = 'rgba(160,200,240,.08)'; c.lineWidth = 1; c.beginPath();
  for (let lo = 0; lo <= 90; lo += 30) { c.moveTo(mpx(lo), MAP.y0); c.lineTo(mpx(lo), MAP.y0 + MAP.mh); }
  for (let la = 20; la <= 70; la += 10) { c.moveTo(MAP.x0, mpy(la)); c.lineTo(MAP.x0 + MAP.mw, mpy(la)); }
  c.stroke();
  g = c.createLinearGradient(0, MAP.y0, 0, MAP.y0 + MAP.mh);
  g.addColorStop(0, '#cdbb88'); g.addColorStop(0.55, '#a39a62'); g.addColorStop(1, '#7d8453');
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 5; c.shadowOffsetY = 1.5;
  c.fillStyle = g; c.fill(LAND); c.restore();
  // the soft region of the Indo-European languages, only over land
  c.save(); c.clip(LAND);
  const ig = c.createLinearGradient(MAP.x0, MAP.y0, MAP.x0 + MAP.mw, MAP.y0 + MAP.mh);
  ig.addColorStop(0, rgba(FC.ie, 0.62)); ig.addColorStop(1, rgba('#d98b3a', 0.62));
  c.fillStyle = ig; c.shadowColor = rgba(FC.ie, 0.8); c.shadowBlur = 10;
  c.fill(toPath(IE_W)); c.fill(toPath(IE_E));
  c.restore();
  c.strokeStyle = 'rgba(255,244,205,.42)'; c.lineWidth = 0.8; c.stroke(LAND);
  // Uralic regions that are on the map from the start

    const pa = toPath(poly);
    c.save(); c.shadowColor = rgba(FC.ur, 0.9); c.shadowBlur = 8; c.fillStyle = rgba(FC.ur, 0.85); c.fill(pa); c.restore();
    c.lineWidth = 1.4; c.strokeStyle = '#0d5a52'; c.stroke(pa);
  }
  // the Ural mountains and the Ob river
  c.save(); c.setLineDash([5, 4]); c.lineWidth = 2.4; c.strokeStyle = '#5a3a22'; c.stroke(toPath(URAL, false)); c.restore();
  c.lineWidth = 2; c.strokeStyle = '#6ec1ff'; c.stroke(toPath(OB, false));
  g = c.createRadialGradient(MAP.x0 + MAP.mw / 2, MAP.y0 + MAP.mh / 2, MAP.mw * 0.3, MAP.x0 + MAP.mw / 2, MAP.y0 + MAP.mh / 2, MAP.mw * 0.64);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
  c.fillStyle = g; c.fillRect(MAP.x0, MAP.y0, MAP.mw, MAP.mh);
  c.restore();
  c.strokeStyle = 'rgba(160,190,230,.35)'; c.lineWidth = 1; rr(c, MAP.x0, MAP.y0, MAP.mw, MAP.mh, 14); c.stroke();
  mapBase = cv; mapKey = key;
  return cv;
}
function drawMap(c, w, h, d) {
  const t = T[lang], tt = now(), done = S.ans.m !== null;
  c.drawImage(mapBaseFor(w, h, d), -OX / SC, -OY / SC, w / SC, h / SC);
  const lp = (lo, la) => [mpx(lo), mpy(la)];
  // the reveal first (under the labels): Mansi and Khanty near the Urals and the Ob
  const r = done ? tt - S.mapT0 : -1, ra = r >= 0 ? eOut(r / 0.9) : 0;
  if (r >= 0) {
    for (const poly of [MANSI, KHANTY]) {
      const pa = toPath(poly);
      c.save(); c.globalAlpha = ra; c.shadowColor = rgba(FC.ur, 1); c.shadowBlur = 12; c.fillStyle = rgba(FC.ur, 0.92); c.fill(pa); c.restore();
      c.save(); c.globalAlpha = ra; c.lineWidth = 1.6; c.strokeStyle = '#0d5a52'; c.stroke(pa); c.restore();
    }
    const [hx, hy] = lp(19.5, 47.2), [kx, ky] = lp(66, 62), cx = (hx + kx) / 2, cy = Math.min(hy, ky) - 40;
    c.save(); c.globalAlpha = ra; c.setLineDash([6, 5]); c.lineWidth = 2; c.strokeStyle = '#ffd166'; c.beginPath(); c.moveTo(hx, hy); c.quadraticCurveTo(cx, cy, kx, ky); c.stroke(); c.restore();
    if (r < 1.8) for (const [lo, la] of [[62, 61.5], [68, 62]]) { const [x, y] = lp(lo, la), e = eOut(r / 1.8); c.save(); c.globalAlpha = 1 - e; c.lineWidth = 2.5; c.strokeStyle = '#ffd166'; c.beginPath(); c.arc(x, y, 6 + e * 26, 0, 7); c.stroke(); c.restore(); }
  }
  // labels: [text, lon, lat, mode (c = centred, l = left edge, r = right edge), dx, dy, style]; each sits on its real place or is pulled
  // aside by a fixed offset and gets a leader to an anchor dot; a collision pass then moves any label that still overlaps another one down.
  const ie = { stroke: rgba(FC.ie, 0.9), dot: FC.ie }, ur = { stroke: FC.ur, bg: mix(FC.ur, '#0A0C14', 0.6), dot: FC.ur };
  const names = t.relatives.split(': ')[1].split(', ');
  const L = [
    [t.langs.fi, 26, 63.5, 'c', 0, 0, ur], [t.langs.et, 25.5, 58.7, 'l', 16, 6, ur], [t.langs.ru, 37.5, 55.7, 'c', 35, 16, ie],
    [t.langs.hu, 19.5, 47.2, 'r', -14, 16, ur], [t.langs.de, 10, 51, 'c', 0, 0, ie], [t.langs.en, -1.5, 52.5, 'c', 0, -18, ie],
    [t.langs.es, -3.7, 40.2, 'c', 0, 0, ie], [t.langs.hi, 78, 25, 'c', 0, 0, ie],
    [t.urals, 59.5, 51, 'c', 0, 18, { stroke: '#8a5a38' }], [t.ob, 66.6, 66.5, 'r', -10, 0, { stroke: '#6ec1ff' }],
  ];
  if (ra > 0.5) L.push([names[0], 62, 61.5, 'r', -14, -6, ur], [names[1], 68, 62, 'c', 22, 30, ur]);

    if (y + ph / 2 > MAP.y0 + MAP.mh - 3) y = MAP.y0 + MAP.mh - 3 - ph / 2;
    placed.push({ x0, x1: x0 + pw, y0: y - ph / 2, y1: y + ph / 2 });

  }

  // legend: under the map
  const ly = MAP.y0 + MAP.mh + 19;
  [['ie', t.fams.ie, MAP.x0 + 8], ['ur', t.fams.uralic, MAP.x0 + 172]].forEach(([k, name, lx]) => {
    c.beginPath(); c.arc(lx, ly, 6, 0, 7); c.fillStyle = FC[k]; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#0c0e1a'; c.stroke();
    pill(c, name, lx + 12, ly, { size: 12.5, align: 'l', w: 700 });
  });
}

// --- secrets -----------------------------------------------------------------------------------------------------
function drawMother(c) {
  const t = T[lang], k = now() - S.secT0;
  c.textBaseline = 'middle'; c.textAlign = 'left';
  c.font = `500 ${fs(34)}px ${SERIF}`;
  const parts = ['m', ' … ', 't', ' … ', 'r'], lit = [0.3, 0, 0.9, 0, 1.5], ws = parts.map((s) => c.measureText(s).width), tot = ws.reduce((a, b) => a + b, 0);
  let x = 180 - tot / 2;
  parts.forEach((s, i) => {
    const a = lit[i] ? eOut((k - lit[i]) / 0.4) : 1;
    c.save(); if (lit[i]) { c.shadowColor = '#ffd166'; c.shadowBlur = 14 * a; c.fillStyle = a > 0.05 ? mix('#98A0B8', '#ffd166', a) : '#98A0B8'; } else c.fillStyle = '#98A0B8';
    c.fillText(s, x, 28); c.restore(); x += ws[i];
  });
  MROWS.forEach(([code, cells, word], ri) => {
    const y = 58 + ri * 46, ru = code === 'ru' && lang === 'ru', row = ru ? MROW_RU : cells;
    const ra = eBack((k - 0.05 * ri) / 0.35);
    if (ra <= 0.01) return;
    c.save(); c.translate(0, y + 19); c.scale(1, Math.max(0.001, ra)); c.translate(0, -(y + 19));
    c.textAlign = 'left'; c.font = font(800, 12.5); c.fillStyle = '#B6BED6'; c.fillText(t.langs[code], 10, y + 19);
    row.forEach((ch, ci) => {
      const tx = 86 + ci * 38, isKey = ci === 0 || ci === 2 || ci === 4, on = isKey && ch && k > (ci === 0 ? 0.3 : ci === 2 ? 0.9 : 1.5);
      if (!ch) { if (ci === 4) { c.setLineDash([4, 4]); rr(c, tx, y, 34, 38, 9); c.lineWidth = 1.2; c.strokeStyle = 'rgba(150,165,215,.3)'; c.stroke(); c.setLineDash([]); } return; }
      c.save();
      if (on) { c.shadowColor = '#ffd166'; c.shadowBlur = 12; }
      rr(c, tx, y, 34, 38, 9);
      const g = c.createLinearGradient(tx, y, tx + 34, y + 38);
      if (on) { g.addColorStop(0, '#ffe08a'); g.addColorStop(1, '#d9a336'); } else { g.addColorStop(0, '#2d3558'); g.addColorStop(1, '#171b33'); }
      c.fillStyle = g; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 1.5; c.strokeStyle = on ? '#8a6414' : '#0c0e1a'; c.stroke();
      c.textAlign = 'center'; c.font = font(900, 20); c.fillStyle = on ? '#2a1d05' : '#d3d9e8'; c.fillText(ch, tx + 17, y + 20);
      c.restore();
    });
    c.textAlign = 'left'; c.font = font(700, 12.5); c.fillStyle = '#98A0B8';
    c.fillText(code === 'ru' ? (lang === 'ru' ? 'mat’' : 'мать') : word, 322, y + 19);
    c.restore();
  });
}
const SPOT = ['#5f8fd0', '#e0b050', '#5fa8a0', '#d9825f', '#8f7fd0'];
function drawCount(c) {
  const k = now() - S.secT0, n = Math.round(7000 * eOut(k / 3)), txt = n.toLocaleString('en').replace(',', ' ');
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `500 ${fs(60)}px ${SERIF}`;
  c.save(); c.shadowColor = 'rgba(255,209,102,.6)'; c.shadowBlur = 18; c.fillStyle = '#fff'; c.fillText(txt + (n >= 7000 ? '+' : ''), 180, 52); c.restore();
  const by = [[], [], [], [], []];
  for (let i = 0; i < n; i++) by[(Math.imul(i + 1, 2654435761) >>> 16) % 5].push(i);
  by.forEach((arr, ci) => {
    c.beginPath();
    for (const i of arr) c.rect(30 + (i % 100) * 3, 100 + Math.floor(i / 100) * 3, 2.2, 2.2);
    c.fillStyle = SPOT[ci]; c.fill();
  });
}

// --- input -------------------------------------------------------------------------------------------------------
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (x < h.x0 || x > h.x1 || y < h.y0 || y > h.y1) continue;
    if (h.kind === 'card') {
      const m = curM(), p = (S.paint[m] ??= {});
      if (p[h.id] === S.col) delete p[h.id]; else p[h.id] = S.col;
      sfx.tick();
    } else if (h.kind === 'leaf') { S.leaf = S.leaf === h.id ? null : h.id; sfx.tick(); }
    else if (h.kind === 'taxi') { S.taxiT0 = now(); sfx.push(); }
    render(); return;
  }
});
const showStage = () => { // on a phone the chips sit below the picture: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(kind, i) {
  if (S.ans[kind] !== null) return;
  S.ans[kind] = i; (i === RIGHT[kind] ? sfx.good : sfx.bad)();
  if (kind === 'c') { S.paint.three = { hu: 0, fi: 0, et: 0 }; S.col = 1; S.revC = now(); }
  else if (kind === 't') S.taxiT0 = now();
  else S.mapT0 = now();
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const o = ev.target.closest('.wc-opt');
  if (o) { answer(o.dataset.k, +o.dataset.i); return; }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'col') { S.col = +b.dataset.i; sfx.tick(); }
  else if (act === 'next') { const l = meanings(); S.mi = (S.mi + 1) % l.length; S.cardT0 = now(); sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { S.sec = k; S.secT0 = now(); if (lab.view !== 'compare') { lab.view = 'compare'; lab.renderChrome(); } }
    sfx.click();
  }
  render();
});

// --- one render per change: controls, readout and the state card ---------------------------------------------------
function askHTML(kind, q, opts, ans, rightMsg, wrongMsg) {
  const done = ans !== null;
  const chips = opts.map((o, i) => `<button class="chip wc-opt${done ? (i === RIGHT[kind] ? ' wc-ok' : i === ans ? ' wc-bad' : ' wc-off') : ''}" data-k="${kind}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = done ? `<div class="wc-verdict ${ans === RIGHT[kind] ? 'wc-vok' : 'wc-vno'}">${esc(ans === RIGHT[kind] ? rightMsg : wrongMsg)}</div>` : '';
  return `<div class="wc-q">${esc(q)}</div><div class="wc-chips">${chips}</div>${verdict}`;
}
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = v;
  $('wcCompCtl').style.display = v === 'compare' && S.ans.c !== null ? 'block' : 'none';
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('wcSecrets').innerHTML = sc('a', '🧑‍🤝‍🧑') + sc('b', '🗣️');
  if (v === 'compare') {
    const m = curM(), done = S.ans.c !== null;
    $('wcAsk').innerHTML = askHTML('c', t.compAsk, t.compOpts, S.ans.c, t.compRight, t.compWrong);
    $('wcHint').textContent = t.tapAlike;
    $('wcPal').innerHTML = GC.map((col, i) => `<button class="wc-dot${S.col === i ? ' wc-on' : ''}" data-act="col" data-i="${i}" style="background:${col}" aria-label="${i + 1}">${i + 1}</button>`).join('');
    $('wcNext').textContent = `${t.nextWord} →`;
    lab.setGlow('rgba(79, 134, 217, .26)');
    lab.setReadout(done ? t.groups(groupsOf(m)) : '?', '', t.meanings[m], '#4f86d9');
    if (S.sec === 'a') lab.setState({ emo: '🧑‍🤝‍🧑', title: t.secrets.a[0], lead: t.secrets.a[1], body: '', extra: '' });
    else if (S.sec === 'b') lab.setState({ emo: '🗣️', title: t.secrets.b[0], lead: t.langCountText, body: '', extra: '' });
    else if (done) { const [emo, title, lead, body] = t.st.compare; lab.setState({ emo, title, lead, body, extra: '' }); }
    else lab.setState({ emo: '🤔', title: t.compAsk, lead: '', body: '', extra: '' });
  } else if (v === 'tree') {
    const done = S.ans.t !== null;
    $('wcAsk').innerHTML = askHTML('t', t.treeAsk, t.treeOpts, S.ans.t, t.treeRight, t.treeWrong);
    lab.setGlow('rgba(224, 176, 80, .24)');
    lab.setReadout(done ? esc(t.treeVal) : '?', '', S.leaf ? t.langs[S.leaf] : '', '#e0b050');
    if (S.sec === 'b') lab.setState({ emo: '🗣️', title: t.secrets.b[0], lead: t.langCountText, body: '', extra: '' });
    else if (done) { const [emo, title, lead, body] = t.st.tree; lab.setState({ emo, title, lead, body, extra: '' }); }
    else lab.setState({ emo: '🤔', title: t.treeAsk, lead: '', body: '', extra: '' });
  } else {
    const done = S.ans.m !== null;
    $('wcAsk').innerHTML = askHTML('m', t.mapAsk, t.mapOpts, S.ans.m, t.mapRight, t.mapWrong);
    lab.setGlow('rgba(60, 191, 174, .24)');
    lab.setReadout(done ? esc(t.fams.uralic[0].toUpperCase() + t.fams.uralic.slice(1)) : '?', '', t.relatives, '#3cbfae');
    if (S.sec === 'b') lab.setState({ emo: '🗣️', title: t.secrets.b[0], lead: t.langCountText, body: '', extra: '' });
    else if (done) { const [emo, title, lead, body] = t.st.map; lab.setState({ emo, title, lead, body, extra: '' }); }
    else lab.setState({ emo: '🤔', title: t.mapAsk, lead: '', body: '', extra: '' });
  }
  lab.setFacts(S.sec ? [] : v === 'map' && S.ans.m === null ? [] : t.facts[v]); // the map fact would answer the map question
  lab.checkStage();
}

// --- the picture ---------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h) => {
  const v = lab.view, box = BOX[v], d = Math.min(window.devicePixelRatio || 1, 2);
  CW = box[0]; CH = box[1]; SC = Math.min(w / CW, h / CH); OX = (w - CW * SC) / 2; OY = (h - CH * SC) / 2;
  hits = [];
  c.save(); c.translate(OX, OY); c.scale(SC, SC); c.lineJoin = 'round'; c.lineCap = 'round';
  if (S.sec === 'a' && v === 'compare') drawMother(c);
  else if (S.sec === 'b') drawCount(c);
  else if (v === 'compare') drawCompare(c);
  else if (v === 'tree') drawTree(c);
  else drawMap(c, w, h, d);
  c.restore();
});
render();
</script>
