// --- matchsticks -------------------------------------------------------------------------------------------
function stick(ctx, x1, y1, x2, y2, th, p, glow) {
  if (p <= 0.001) return;
  const L = Math.hypot(x2 - x1, y2 - y1), ang = Math.atan2(y2 - y1, x2 - x1), ext = th * 0.5;
  const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2 - (1 - p) * 34;
  ctx.save();

  ctx.translate(cx + th * 0.35, cy + th * 0.6); ctx.rotate(ang); // soft shadow, offset in screen space
  rrect(ctx, -L / 2 - ext, -th / 2 - 1, L + 2 * ext, th + 2, th / 2 + 1); ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fill();
  rrect(ctx, -L / 2 - ext, -th / 2, L + 2 * ext, th, th / 2); ctx.fillStyle = 'rgba(0,0,0,.26)'; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = clamp01(p * 2.2);
  ctx.translate(cx, cy); ctx.rotate(ang);
  if (glow > 0.01) {
    ctx.shadowColor = `rgba(255, 205, 70, ${glow})`; ctx.shadowBlur = 18 * glow;
    rrect(ctx, -L / 2 - ext, -th / 2, L + 2 * ext, th, th / 2); ctx.fillStyle = '#ffd24a'; ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  }
  const g = ctx.createLinearGradient(0, -th / 2, 0, th / 2);
  g.addColorStop(0, '#f3dcaa'); g.addColorStop(0.5, '#d9ac6b'); g.addColorStop(1, '#a87a3e');
  rrect(ctx, -L / 2 - ext, -th / 2, L + 2 * ext, th, th / 2); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(70, 40, 10, .55)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-L / 2, th * 0.12); ctx.lineTo(L / 2 - th, th * 0.12);
  ctx.strokeStyle = 'rgba(120, 75, 25, .3)'; ctx.lineWidth = 0.8; ctx.stroke();
  if (glow > 0.01) { rrect(ctx, -L / 2 - ext, -th / 2, L + 2 * ext, th, th / 2); ctx.fillStyle = `rgba(255, 214, 90, ${glow * 0.55})`; ctx.fill(); }

  const hr = th * 0.95, hx = L / 2 + ext * 0.2;
  const hg = ctx.createRadialGradient(hx - hr * 0.35, -hr * 0.4, hr * 0.1, hx, 0, hr);

  ctx.beginPath(); ctx.arc(hx - hr * 0.3, -hr * 0.35, Math.max(0, hr * 0.22), 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
  ctx.restore();
}

const geo = {};
function stickList(kind, N) {
  const key = kind + N; if (geo[key]) return geo[key];

    const horiz = Math.abs(ay - by) < 1e-6, swap = horiz ? ax > bx : ay < by;
    L.push(swap ? [bx, by, ax, ay] : [ax, ay, bx, by]);

  } else {

function drawCloth(ctx, w, h, t, A, K, k) {
  if (A.cloth <= 0.003) return;

function drawStrip(ctx, w, h, dt, t, kind) {
  const K = KIND[kind], A = AN[kind], k = T[lang].k[kind], ph = S.ph[kind], n = S.n[kind], target = K.per * n + 1;
  // the mat under the row
  rrect(ctx, 8, h * 0.02, w - 16, h * 0.355, 16); ctx.fillStyle = 'rgba(0,0,0,.17)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1; ctx.stroke();

  const s = A.s, rowC = h * 0.2, x0 = (w - uw * (sT)) / 2, y0 = rowC - (uh * s) / 2 - 6;
  const th = clamp(s * 0.14, 4.5, 8.5), list = stickList(kind, n), c = Math.min(list.length, Math.ceil(A.shown - 1e-6));
  A.birth.length = Math.min(A.birth.length, c);

    const xo = x0 + (uw * sT - uw * s) / 2;

// --- number rules ------------------------------------------------------------------------------------------

// --- secret: doubling --------------------------------------------------------------------------------------
function drawGrain(ctx, w, h, dt, t) {

  if (G.play) {
    G.acc += dt;
    if (G.acc > 0.3) { G.acc = 0; if (G.k < 64) { G.k++; sfx.tick(); } if (G.k >= 64) G.play = false; render(); }
  }
  const bs = Math.min(w - 24, h * 0.32, 190), cs = bs / 8, bx = (w - bs) / 2, by = 12;
  rrect(ctx, bx - 5, by - 5, bs + 10, bs + 10, 8); const fg = ctx.createLinearGradient(bx, by, bx + bs, by + bs);
  fg.addColorStop(0, '#7a4e2a'); fg.addColorStop(1, '#4a2c14'); ctx.fillStyle = fg; ctx.fill();

// --- secret: squares of squares ----------------------------------------------------------------------------
const LAYER = ['#7ddc9a', '#58c9b0', '#4fb3d6', '#6b93ee', '#9b7cf0', '#d27be0', '#f08fa8', '#f5b45a'];

// --- readouts, state cards, facts --------------------------------------------------------------------------

  $('gpGuessB').textContent = k.guessBtn; $('gpAgainB').textContent = tt.again;
  $('gpQ').textContent = k.q; $('gpCheckB').textContent = tt.check; $('gpBackB').textContent = tt.back;
  const gi = $('gpIn'), gs = S.gi[kind] === null ? '' : String(S.gi[kind]);
  if (gi.value !== gs) gi.value = gs;
  gi.setAttribute('aria-label', k.q); $('gpCheckB').disabled = S.gi[kind] === null;
  stripReadout(kind); stripState(kind);
}
function renderRules() {
  const tt = T[lang], R = S.r, terms = termsOf(R.start, R.add), hit = terms.includes(50), ph = R.ph;
  lab.setGlow('rgba(67, 192, 220, .24)');
  $('gpRS').textContent = tt.r.start; $('gpRSv').textContent = R.start; $('gpRA').textContent = tt.r.add; $('gpRAv').textContent = R.add;
  document.querySelectorAll('[data-act=rd]').forEach((b) => {
    const d = b.dataset.d, s = +b.dataset.s;
    b.disabled = d === 'start' ? (s < 0 ? R.start <= 1 : R.start >= 5) : (s < 0 ? R.add <= 2 : R.add >= 5);
  });
  $('gpRQ').style.display = ph === 'ask' ? '' : 'none'; $('gpRQt').textContent = tt.r.q;
  $('gpRYN').style.display = ph === 'ask' ? '' : 'none'; $('gpYes').textContent = tt.r.yes; $('gpNo').textContent = tt.r.no;
  $('gpRDone').style.display = ph === 'done' ? '' : 'none'; $('gpRetry').textContent = tt.r.retry;
  const first = terms.slice(0, 6).join(', ') + ' …';
  const ok = R.ans === hit;
  lab.setReadout(`<span class="gp-seq">${esc(first)}</span>`, tt.r.sub(R.start, R.add), ph === 'done' ? (ok ? tt.right : tt.notQuite) : '', '#43c0dc');
  if (ph === 'done') {
    const par = R.add % 2 === 0 ? (R.start % 2 ? tt.r.par.oo : tt.r.par.ee) : tt.r.par.od;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? tt.right : tt.notQuite, lead: hit ? tt.r.hit : tt.r.miss, body: par });
  } else lab.setState({ emo: '🔢', title: tt.r.title(R.start, R.add), lead: tt.r.lead, body: '' });
}
function renderGrain() {
  const tt = T[lang], G = S.g, k = G.k, g = grains(k), p = 1 + 3 * (k - 1);
  lab.setGlow('rgba(240, 192, 64, .28)');
  $('gpGL').textContent = tt.g.lbl; $('gpGv').textContent = k;
  const sl = $('gpSl'); if (+sl.value !== k) sl.value = k;
  $('gpPlay').textContent = G.play ? tt.g.pause : tt.g.play;
  const size = g.length > 16 ? 19 : g.length > 9 ? 25 : 34;
  lab.setReadout(`<span style="font-size:${size}px">${esc(g)}</span>${unitHTML(tt.g.unit)}`, tt.g.sub(k), `${tt.g.plus}: ${p}`, '#f0c040');
  lab.setState({ emo: '🌾', title: tt.g.title, lead: tt.g.lead(k, g, p), body: tt.g.body });
}
function renderSq() {
  const tt = T[lang], n = S.q.n;
  lab.setGlow('rgba(88, 201, 176, .26)');
  $('gpQL').textContent = tt.q.lbl; $('gpQn').textContent = n;
  document.querySelector('[data-act=qdec]').disabled = n <= 1; document.querySelector('[data-act=qinc]').disabled = n >= 8;
  lab.setReadout(`${n * n}${unitHTML(tt.q.unit)}`, `${n} × ${n}`, n > 1 ? tt.q.last(n) : '', '#58c9b0');
  lab.setState({ emo: '🟩', title: tt.q.title, lead: tt.q.lead(n), body: tt.q.body });
}
function render() {
  const tt = T[lang], v = lab.view, sec = S.sec, strip = !sec && isStrip();
  $('gpStrip').style.display = strip ? '' : 'none';
  $('gpRules').style.display = !sec && v === 'rules' ? '' : 'none';
  $('gpGrain').style.display = sec === 'grain' ? '' : 'none';
  $('gpSq').style.display = sec === 'sq' ? '' : 'none';
  const open = secret.unlocked();
  $('gpSecs').innerHTML = [['grain', '🌾'], ['sq', '🟩']].map(([k, emo]) =>
    `<button class="gp-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(tt.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const key = sec ?? v;
  if (sec === 'grain') renderGrain(); else if (sec === 'sq') renderSq(); else if (v === 'rules') renderRules(); else renderStrip(v);
  lab.setFacts((FACT_OF[key] ?? []).map((f) => ({ emo: FACT_EMO[f], text: tt.facts[f], src: FACT_SRC[f] })));
}

canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  CW = w; CH = h;
  felt(ctx, w, h);
  if (S.sec === 'grain') drawGrain(ctx, w, h, dt, t);
  else if (S.sec === 'sq') drawSq(ctx, w, h, dt, t);
  else if (lab.view === 'rules') drawRules(ctx, w, h, dt, t);
  else drawStrip(ctx, w, h, dt, t, lab.view);
});
render();
</script>
