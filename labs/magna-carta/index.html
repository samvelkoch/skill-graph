    person(c, 326, 370, { robe: ['#9a6ac8', '#5a3a8a'], hat: 'cap', cap: '#7b4aa8', face: 'smile', arms: 'wave', flip: true, bob: bob(2) });
  } else if (step === 1) {
    person(c, 58, 376, { s: 1.15, robe: ['#e0584e', '#8f1f27'], hat: 'crown', beard: '#a65a2a', collar: true, face: 'angry', arms: 'up', bob: bob(0) });
    person(c, 300, 378, { robe: ['#5aa86a', '#2f6a3c'], hat: 'helmet', face: 'angry', arms: 'up', flip: true, shield: '#c0392b', bob: bob(1) });
    person(c, 326, 306, { s: 1.15, robe: ['#f6f2e8', '#cfc8b6'], hat: 'tiara', face: 'neutral', arms: 'out', flip: true, belt: '#d9a93c' });
    emoji(c, '⚔️', 180, 360 + Math.sin(time * 6) * 2, 34);
  } else if (step === 2) {
    const k = 1 + .04 * Math.sin(time * 4);
    person(c, 62, 372, { s: .85 * k, robe: ['#5a8ad8', '#2e4f9a'], hat: 'bigcrown', face: 'smile', arms: 'out', collar: true, bob: bob(0) });
    pill(c, '🎂 9', 62, 304, { color: '#f0c860', border: '#d9a93c', size: 13 });
    person(c, 300, 380, { robe: ['#5aa86a', '#2f6a3c'], hat: 'helmet', face: 'smile', arms: 'out', flip: true, shield: '#c0392b', bob: bob(1) });
    person(c, 328, 368, { robe: ['#9a6ac8', '#5a3a8a'], hat: 'cap', cap: '#7b4aa8', face: 'smile', arms: 'up', flip: true, bob: bob(2) });
  } else if (step === 3) {
    person(c, 62, 376, { s: 1.0, robe: ['#5a8ad8', '#2e4f9a'], hat: 'crown', collar: true, face: 'neutral', arms: 'out', bob: bob(0) });
    person(c, 302, 380, { robe: ['#5aa86a', '#2f6a3c'], hat: 'cap', cap: '#3d7a4a', face: 'smile', arms: 'up', flip: true, bob: bob(1) });
  }
}

// --- the map of England: where the four surviving copies of 1215 are kept ----------------------------------------
const LAND = [[135, 28], [185, 24], [222, 40], [232, 66], [225, 92], [236, 118], [246, 142], [262, 160], [258, 176], [272, 190], [286, 208], [300, 222], [318, 226], [330, 240],
  [320, 256], [316, 272], [304, 284], [316, 292], [322, 308], [310, 322], [286, 328], [262, 334], [238, 342], [214, 350], [192, 358], [170, 360], [150, 372], [126, 368], [100, 378],
  [78, 392], [64, 382], [78, 364], [104, 352], [130, 342], [148, 326], [124, 318], [98, 300], [88, 276], [100, 252], [96, 232], [112, 214], [128, 200], [142, 184], [140, 160],
  [150, 140], [138, 118], [140, 92], [132, 66]];
const CITIES = { london: [280, 292, [-34, -17]], canterbury: [312, 310, [-2, 18]], oxford: [236, 284, [-32, -14]], lincoln: [256, 202, [-36, -13]], york: [224, 150, [-28, -14]], salisbury: [222, 324, [-6, 18]] };
function drawMap(c, time) {
  const t = T[lang];
  c.fillStyle = lg(c, 0, -300, 0, 400, [0, '#24507c'], [1, '#14304f']); c.fillRect(-500, -400, 1360, 1000);
  c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 1.4; for (let i = 0; i < 12; i++) { const yy = 30 + i * 32, xx = (i * 70 + time * 6) % 360; c.beginPath(); c.moveTo(xx - 20, yy); c.quadraticCurveTo(xx - 10, yy - 4, xx, yy); c.stroke(); }
  c.beginPath(); LAND.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath();
  c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 14; c.shadowOffsetY = 5; c.fillStyle = lg(c, 100, 30, 300, 380, [0, '#86b46a'], [1, '#4c7e48']); c.fill(); c.restore();
  c.strokeStyle = '#2d4f2c'; c.lineWidth = 2; c.lineJoin = 'round'; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1; c.stroke();
  const found = S.found;
  for (const [id, [x, y, [lx, ly]]] of Object.entries(CITIES)) {
    c.fillStyle = '#fff'; c.strokeStyle = '#1c2a1c'; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, 4.5, 0, TAU); c.fill(); c.stroke();
    pill(c, t.places[id], x + lx, y + ly, { size: 13 });
  }
  // pins
  const pin = (x, y, k) => {
    const e = easeBack(k), dy = (1 - e) * -30;
    c.save(); c.translate(x, y + dy); c.scale(e, e);
    c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(0, 1, 6, 2, 0, 0, TAU); c.fill();
    c.fillStyle = lg(c, -6, -26, 6, -12, [0, '#ff7a6a'], [1, '#c0281c']); c.strokeStyle = '#561210'; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(-11, -14, -7, -21); c.quadraticCurveTo(0, -28, 7, -21); c.quadraticCurveTo(11, -14, 0, 0); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, -17, 3.2, 0, TAU); c.fill(); c.restore();
  };
  const pk = (id, n) => clamp01((time - (S['pinAt' + id + n] ?? -9)) / .5);
  if (found.london >= 1) pin(CITIES.london[0] - (found.london >= 2 ? 6 : 0), CITIES.london[1], pk('london', 1));
  if (found.london >= 2) pin(CITIES.london[0] + 6, CITIES.london[1], pk('london', 2));
  if (found.lincoln) pin(CITIES.lincoln[0], CITIES.lincoln[1], pk('lincoln', 1));
  if (found.salisbury) pin(CITIES.salisbury[0], CITIES.salisbury[1], pk('salisbury', 1));
  if (found.london) pill(c, `${t.bl} × 2`, 214, 308, { color: '#f0c860', border: '#d9a93c' });
  const nc = S.noCopy;
  if (nc.id && time - nc.at < 1.4) { const [x, y] = CITIES[nc.id]; pill(c, t.noCopy, x, y - 26 - (time - nc.at) * 6, { color: '#ffc9c4', border: '#ff5a4a' }); }
  pill(c, t.tapPins, 180, 14, { size: 13 });
}

// --- canvas ----------------------------------------------------------------------------------------------
let G = { s: 1, ox: 0, oy: 0 };
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const s = Math.min(w / 360, h / 400), ox = (w - 360 * s) / 2, oy = (h - 400 * s) / 2;
  G = { s, ox, oy };
  c.save(); c.translate(ox, oy); c.scale(s, s);
  const v = lab.view;
  if (S.sec === 'copies') drawMap(c, time);
  else if (S.sec === 'bull') drawHall(c, time, 'hun');
  else if (v === 'after') drawAfter(c, time);
  else if (v === 'before' && S.bPhase === 'done') drawMeadow(c, time);
  else drawHall(c, time, 'eng');
  c.restore();
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.s, y = (ev.clientY - r.top - G.oy) / G.s;
  if (S.sec === 'bull') {
    if (x > PW.x - 6 && x < PW.x + PW.w + 6 && y > PW.y && y < PW.y + PW.h + 36) { S.bullRule = (S.bullRule + 1) % 2; sfx.snap(); render(); }
  } else if (S.sec === 'copies') {
    let best = null, bd = 28;
    for (const [id, [cx, cy]] of Object.entries(CITIES)) { const d = Math.hypot(x - cx, y - cy); if (d < bd) { bd = d; best = id; } }
    if (!best) return;
    if (best === 'london' || best === 'lincoln' || best === 'salisbury') {
      const max = best === 'london' ? 2 : 1;
      if (S.found[best] < max) { S.found[best]++; S['pinAt' + best + S.found[best]] = nowS(); sfx.snap(); } else sfx.tick();
    } else { S.noCopy = { id: best, at: nowS() }; sfx.bad(); }
    render();
  }
});

// --- actions ---------------------------------------------------------------------------------------------
function startAct(id, blocked, done) { S.act = { id, blocked, t0: nowS(), dur: ACT_DUR[id] + (blocked ? .5 : 0), done, fin: false }; }
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const realCount = () => S.on.filter((i) => i !== 'cX').length;

function answerBefore(a) {
  if (S.bPhase !== 'ask') return;
  S.bAns[S.bi] = a; S.bPhase = 'act'; (a === 'no' ? sfx.good : sfx.bad)();
  const i = S.bi;
  startAct(ORDER[i], false, () => {
    if (S.bi !== i) return;
    S.angry = i + 1; S.angryAt = nowS(); sfx.push();
    if (i === 3) { S.bPhase = 'done'; S.meadowAt = nowS(); } else S.bPhase = 'next';
    render();
  });
  render(); showStage();
}
function toggleClause(id) {
  if (S.sealed || S.rp.state === 'run') return;
  if (id === 'cX') { S.refuseAt = nowS(); S.msg = 'x'; sfx.bad(); render(); showStage(); return; }
  const i = S.on.indexOf(id); S.msg = '';
  if (i >= 0) { S.on.splice(i, 1); delete S.rows[id]; sfx.tick(); } else { S.on.push(id); S.rows[id] = nowS(); sfx.click(); }
  render();
}
function sealIt() {
  if (S.sealed || realCount() < 3) return;
  S.sealed = true; S.sealAt = nowS(); S.msg = ''; sfx.snap(); setTimeout(() => sfx.push(), 330); render(); showStage();
}
function runStep() {
  const id = ORDER[S.rp.i], blocked = S.on.includes(CL[id]);
  S.rp.id = id;
  if (id === 'arrest' && blocked && !S.rp.asked) { S.rp.state = 'ask'; render(); showStage(); return; }
  S.rp.state = 'run'; S.rp.last = { id, blocked };
  startAct(id, blocked, () => {
    if (S.rp.state !== 'run' || S.rp.id !== id) return;
    S.rp.i++;
    if (S.rp.i < 4) setTimeout(runStep, 450); else { S.rp.state = 'done'; S.act = null; }
    render();
  });
  render(); showStage();
}
function replay() {
  if (!S.sealed || S.rp.state === 'run' || S.rp.state === 'ask') return;
  S.rp.i = 0; S.rp.state = 'run'; S.act = null; sfx.click(); runStep();
}
function answerCharter(i) {
  if (S.rp.state !== 'ask') return;
  S.cAns = i; S.rp.asked = true; (i === 1 ? sfx.good : sfx.bad)(); runStep();
}
function answerAfter(i) { if (S.aAns !== null) return; S.aAns = i; S.stepAt = nowS(); (i === 1 ? sfx.good : sfx.bad)(); render(); showStage(); }
function nextStep() { if (S.aAns === null) return; if (S.step < 4) { S.step++; S.stepAt = nowS(); sfx.snap(); } else { S.step = 0; S.stepAt = nowS(); sfx.click(); } render(); showStage(); }
function restartBefore() { S.bi = 0; S.bPhase = 'ask'; S.bAns = []; S.angry = 0; S.act = null; sfx.click(); render(); }

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'bans') answerBefore(b.dataset.a);
  else if (act === 'bnext') { S.bi++; S.bPhase = 'ask'; S.act = null; sfx.click(); render(); }
  else if (act === 'brestart') restartBefore();
  else if (act === 'clause') toggleClause(b.dataset.id);
  else if (act === 'seal') sealIt();
  else if (act === 'replay') replay();
  else if (act === 'cans') answerCharter(+b.dataset.i);
  else if (act === 'aans') answerAfter(+b.dataset.i);
  else if (act === 'anext') nextStep();
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; if (S.sec === 'bull') S.bullRule = -1; sfx.click(); render();
  }
});

// --- controls and readouts ---------------------------------------------------------------------------------
const optBtns = (act, opts, ans, ok) => `<div class="mc-opts">${opts.map((o, i) => `<button class="mc-opt ${ans === null ? '' : i === ok ? 'right' : i === ans ? 'wrong' : ''}" data-act="${act}" data-i="${i}"${ans === null ? '' : ' disabled'}>${esc(o)}</button>`).join('')}</div>`;
const verdict = (ok, text) => `<div class="mc-ver"><div class="v ${ok ? 'ok' : 'no'}">${esc(ok ? T[lang].right : T[lang].notQuite)}</div><p>${esc(text)}</p></div>`;

function ctrlBefore(t) {
  if (S.bPhase === 'done') return `<div class="mc-ver"><div class="v ok">${esc(t.state.beforeDone[0])}</div><p>${esc(t.exBefore)}</p></div><div class="mc-row"><button class="btn mc-btn" data-act="brestart">${esc(t.again)}</button></div>`;
  const id = ORDER[S.bi], ans = S.bAns[S.bi], done = S.bPhase !== 'ask';
  let h = `<div class="mc-want">👑 <b>${esc(t.king)}:</b> ${esc(t.wants[id])}</div><div class="mc-q">${esc(t.beforeQ)}</div>`;
  h += `<div class="mc-opts two">${['yes', 'no'].map((k) => `<button class="mc-opt ${!done ? '' : k === 'no' ? 'right' : k === ans ? 'wrong' : ''}" data-act="bans" data-a="${k}"${done ? ' disabled' : ''}>${esc(t[k])}</button>`).join('')}</div>`;
  if (done) h += verdict(ans === 'no', t.exNo);
  if (S.bPhase === 'next') h += `<div class="mc-row"><button class="btn mc-btn" data-act="bnext">${esc(t.next)}</button></div>`;
  return h;
}
function ctrlCharter(t) {
  const rp = S.rp, busy = rp.state === 'run' || rp.state === 'ask';
  let h = '';
  if (!S.sealed) h += `<div class="mc-hint">${esc(t.tapClause)}</div>`;
  h += `<div class="mc-cls">${CHIPS.map((id) => {
    const on = S.on.includes(id);
    return `<button class="mc-cl ${on ? 'on' : ''}" data-act="clause" data-id="${id}"${S.sealed ? ' disabled' : ''}><span class="ck">${on ? '✓' : (CL_ICON[id] ?? '🍬')}</span>${esc(t.clauses[id])}</button>`;
  }).join('')}</div>`;
  if (S.msg === 'x') h += `<div class="mc-msg no">${esc(t.notInCharter)}</div>`;
  if (!S.sealed) { if (realCount() >= 3) h += `<div class="mc-row"><button class="btn mc-btn" data-act="seal">${esc(t.seal)}</button></div>`; return h; }
  if (rp.state === 'ask') h += `<div class="mc-q">${esc(t.charterQ)}</div>${optBtns('cans', t.charterOpts, null, 1)}`;
  else if (S.cAns !== null && rp.state !== 'idle') h += `<div class="mc-q">${esc(t.charterQ)}</div>${optBtns('cans', t.charterOpts, S.cAns, 1)}${verdict(S.cAns === 1, t.exCharter)}`;
  if (rp.last && rp.state !== 'ask') h += `<div class="mc-msg ${rp.last.blocked ? 'ok' : 'no'}">${rp.last.blocked ? `✋ ${esc(t.blocked)} ${esc(t.clauses[CL[rp.last.id]])}` : `… ${esc(t.missing)}`}</div>`;
  if (rp.state === 'done' && S.cAns === null) h += `<div class="mc-ver"><p>${esc(t.exCharter)}</p></div>`;
  if (!busy) h += `<div class="mc-row"><button class="btn mc-btn" data-act="replay">${esc(rp.state === 'idle' ? t.replay : `↻ ${t.replay.replace(/^▶\s*/, '')}`)}</button></div>`;
  return h;
}
function ctrlAfter(t) {
  const keys = ['s1215', 's1215b', 's1216', 's1225', 'sToday'];
  let h = `<div class="mc-q">${esc(t.afterQ)}</div>${optBtns('aans', t.afterOpts, S.aAns, 1)}`;
  if (S.aAns === null) return h;
  h += verdict(S.aAns === 1, t.exAfter);
  h += `<div class="mc-step" style="margin-top:12px">${esc(t.steps[keys[S.step]])}</div>`;
  h += `<div class="mc-row"><button class="btn mc-btn" data-act="anext">${esc(S.step < 4 ? t.next : t.again)}</button></div><div class="mc-note">${esc(t.freeMen)}</div>`;
  return h;
}

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  const row = `<div class="row2"><div class="chips">${sc('bull', '🇭🇺')}${sc('copies', '🔍')}</div></div>`;
  lab.setFacts(t.facts[v]);
  if (S.sec === 'bull') {
    lab.setGlow('rgba(61, 220, 151, .22)'); lab.setReadout('1222', t.andrew, t.secrets.bull[0], '#3aa86a');
    lab.setState({ emo: '🇭🇺', title: t.secrets.bull[0], lead: t.secretA, body: S.bullRule >= 0 ? t.bullRules[S.bullRule] : t.tapBull, extra: `<div class="fine">${esc(t.fine)}</div>` });
    $('ctrlBody').innerHTML = `<div class="mc-hint">${esc(S.bullRule >= 0 ? t.bullRules[S.bullRule] : t.tapBull)}</div>${row}`;
    return;
  }
  if (S.sec === 'copies') {
    const n = S.found.london + S.found.lincoln + S.found.salisbury;
    lab.setGlow('rgba(95, 143, 208, .26)'); lab.setReadout(`${n} / 4`, t.copiesFound, '', '#5f8fd0');
    lab.setState({ emo: '🔍', title: t.secrets.copies[0], lead: n === 4 ? t.secretB : t.tapPins, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    $('ctrlBody').innerHTML = `<div class="mc-hint">${esc(n === 4 ? t.secretB : t.tapPins)}</div>${row}`;
    return;
  }
  if (v === 'before') {
    const n = S.angry;
    lab.setGlow('rgba(200, 70, 60, .26)'); lab.setReadout(t.did(n), t.didWord, t.anger(n), '#c0483c');
    const [ti, le] = S.bPhase === 'done' ? t.state.beforeDone : t.state.before0;
    lab.setState({ emo: S.bPhase === 'done' ? '🏴' : '👑', title: ti, lead: le, body: S.bPhase === 'done' ? t.exBefore : '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    $('ctrlBody').innerHTML = ctrlBefore(t) + row;
  } else if (v === 'charter') {
    lab.setGlow('rgba(217, 169, 60, .26)'); lab.setReadout(String(S.on.length), t.rulesWord, S.sealed ? t.sealed : t.notSealed, '#d9a93c');
    const [ti, le] = S.rp.state === 'done' ? t.state.charterDone : t.state.charter0;
    lab.setState({ emo: S.rp.state === 'done' ? '⚖️' : '📜', title: ti, lead: le, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    $('ctrlBody').innerHTML = ctrlCharter(t) + row;
  } else {
    const keys = ['s1215', 's1215b', 's1216', 's1225', 'sToday'], st = S.aAns === null ? 0 : S.step;
    lab.setGlow('rgba(95, 143, 208, .28)');
    lab.setReadout(st === 4 ? String(new Date().getFullYear()) : st === 3 ? '1225' : st === 2 ? '1216' : '1215', t.ev[keys[st]], st === 1 ? t.cancelled : t.valid, '#5f8fd0');
    const [ti, le] = S.aAns !== null && st === 4 ? t.state.afterDone : t.state.after0;
    lab.setState({ emo: st === 4 && S.aAns !== null ? '🏛️' : '⏳', title: ti, lead: le, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    $('ctrlBody').innerHTML = ctrlAfter(t) + row;
  }
}
render();
</script>
</body>
</html>
