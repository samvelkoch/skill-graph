<script type="module">
import { shell, canvasLoop, secretLab, sfx, $, esc, clamp, lerp, store, ruPlural, lang } from '../lab.js';

const KEY = 'powers-of-ten';
const FONT = '"Nunito", ui-rounded, system-ui, sans-serif';
const MONO = 'ui-monospace, Menlo, Consolas, monospace';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

// ---- helpers --------------------------------------------------------------------------------------------
const SUPD = { 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹', '-': '⁻' };
const sup = (n) => String(n).split('').map((ch) => SUPD[ch]).join('');
const F = (x, max = 6) => new Intl.NumberFormat(lang, { maximumFractionDigits: max, useGrouping: 'always' }).format(x);
const uf = (x, unit, max = 1, disp = 'short') => new Intl.NumberFormat(lang, { style: 'unit', unit, unitDisplay: disp, maximumFractionDigits: max, useGrouping: 'always' }).format(x);
const locStr = (s) => (lang === 'en' ? s : s.replace('.', ','));
const chainUp = (n) => (n === 0 ? '1' : n <= 5 ? Array(n).fill(10).join(' × ') : '10 × 10 × … × 10');
const chainDn = (n) => '1' + Array(-n).fill(' ÷ 10').join('');
const HUS = ['0-s', '1-es', '2-es', '3-as', '4-es', '5-ös', '6-os', '7-es', '8-as', '9-es'];
const huDig = (d, cap) => { const s = `${d === 1 || d === 5 ? 'az' : 'a'} ${HUS[d]}`; return cap ? s[0].toUpperCase() + s.slice(1) : s; };

// ---- words ----------------------------------------------------------------------------------------------
const T = {

  const v = b.dataset.v; sfx.click();
  if (S.secret) { S.secret = null; buildMain(); }
  if (lab.view === 'place') { S.placeStr = v; chartP.load(v); S.sel = 0; S.last = null; S.blocked = false; const i = $('numIn'); if (i) { i.value = locStr(v); i.classList.remove('bad'); } }
  else if (lab.view === 'zoom') zoomSet(+v);
  else if (S.big.mode === 'round') { S.big.num = +v; roundInfo(); buildMain(); }
  else { S.big.mant = v; chartB.load(v, 0); chartB.shiftTo(S.big.n); }
  render();
});

// the opening prediction
const ask = Object.assign(document.createElement('div'), { className: 'ask card' });
$('overlay').append(ask);
ask.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.a) { S.answer = +b.dataset.a; (S.answer === 1 ? sfx.good : sfx.bad)(); }
  else { S.answered = true; store.set(KEY + ':asked', true); }
  render();
});

// ---- render: readout, state card, chips -------------------------------------------------------------------
function render() {
  const t = T[lang], open = secret.unlocked(), view = lab.view;
  const sc = (k) => `<button class="chip secret ${open ? 'open' : ''} ${S.secret === k ? 'on' : ''}" data-k="${k}">${open ? esc(t.secrets[k][0]) : '🔒 ???'}</button>`;
  let mid = '';
  if (view === 'place') mid = ['3.4', '25', '0.04', '700'].map((v) => `<button class="chip ${!S.secret && S.placeStr === v ? 'on' : ''}" data-v="${v}">${F(+v)}</button>`).join('');
  else if (view === 'zoom') mid = ZCHIPS.map((n) => `<button class="chip ${!S.secret && S.zn === n ? 'on' : ''}" data-v="${n}">${STOPS[n + 4].e}</button>`).join('');
  else if (S.big.mode === 'round') mid = [8274500, 3946215, 127350, 6500000].map((n) => `<button class="chip ${!S.secret && S.big.num === n ? 'on' : ''}" data-v="${n}">${F(n)}</button>`).join('');
  else mid = ['2.56', '3.4', '7.1', '1.05'].map((m) => `<button class="chip ${!S.secret && S.big.mant === m ? 'on' : ''}" data-v="${m}">${F(+m)}</button>`).join('');
  $('chips').innerHTML = sc('s1') + mid + sc('s2');
  const set = (id, v) => { const el = $(id); if (el && +el.value !== v) el.value = v; };
  set('zsl', S.zn); set('gsl', S.g); set('msl', S.m); set('nsl', S.big.n);
  const ni = $('numIn'); if (ni && document.activeElement !== ni) ni.value = locStr(S.placeStr);
  const bi = $('bigIn'); if (bi && document.activeElement !== bi) bi.value = S.big.num;

  let ro, st, glow = 'rgba(255,138,61,.22)';
  if (S.secret === 's1') {
    const n = S.g, nm = t.g.names[n];
    ro = [`10${sup(n)}`, nm ?? '', '', '#f5c84c']; glow = 'rgba(245,200,76,.22)';
    st = { emo: '💯', title: t.g.T(n, nm), lead: t.g.L(n), body: t.g.B(n), extra: `<div class="fine">${esc(t.fine.g)}</div>` };
  } else if (S.secret === 's2') {
    const n = S.m;
    ro = [`10${sup(n)}`, F(10 ** n), timeText(n), '#3ddc97']; glow = 'rgba(61,220,151,.2)';
    st = { emo: '⏱️', title: t.m.T(n), lead: `${chainUp(n)} = ${F(10 ** n)}`, body: t.m.B(n), extra: `<div class="note">⏱️ ${esc(uf(10 ** n, 'second', 0, 'long'))} ≈ ${esc(timeText(n))}</div><div class="fine">${esc(t.fine.m)}</div>` };
  } else if (view === 'place') {
    const tl = chartP.tiles[S.sel] ?? chartP.tiles[0], N = chartP.value(), P = t.place, e = tl.te, d = tl.d, sit = P.sit(d, e, t.places);
    const k = S.last?.k, up = (k ?? 1) > 0;
    ro = [F(N), k ? `${F(N / 10 ** k)} ${k > 0 ? '×' : '÷'} ${F(10 ** Math.abs(k))}` : '', '', up ? '#ff8a3d' : '#4ea8ff']; glow = up ? 'rgba(255,138,61,.22)' : 'rgba(78,168,255,.25)';
    const body = S.blocked ? { emo: '🚧', title: P.fullT, lead: P.fullL, body: P.fullB }
      : k ? { emo: k > 0 ? '⬅️' : '➡️', title: P.shT(k), lead: P.shL(k), body: `${P.ba(d, d * 10 ** (e - k), d * 10 ** e)} ${sit}` }
        : { emo: '🔟', title: P.idleT, lead: P.idleL, body: `${sit} ${P.idleB}` };
    const parts = [...chartP.tiles].sort((a, b) => b.te - a.te).map((x) => `${x.d} × ${F(10 ** x.te)}`).join(' + ');
    st = { ...body, extra: `<div class="note">${esc(P.ten(d, N, N / 10))}</div><div class="note">${esc(P.parts)}: ${esc(parts)}</div><div class="fine">${esc(t.fine.place)}</div>` };
  } else if (view === 'zoom') {
    const n = S.zn, s = STOPS[n + 4], eq = Math.abs(s.real / 10 ** n - 1) < 1e-9 ? '=' : '≈', Z = t.zoom;
    ro = [`10${sup(n)} m`, `= ${uf(10 ** n, 'meter', 6)}`, '', `hsl(${210 - (n + 4) * 12}, 85%, 62%)`]; glow = 'rgba(78,168,255,.25)';
    const body = n === 0 ? Z.p0 : n === 1 ? Z.p1 : n > 1 ? Z.pPos(n, F(10 ** n)) : Z.pNeg(n, F(10 ** n));
    st = { emo: s.e, title: Z.names[n + 4], lead: `${Z.about(sizeText(s.real))} ${eq} 10${sup(n)} m`, body, extra: `<div class="fine">${esc(t.fine.zoom)}</div>` };
  } else if (S.big.mode === 'round') {
    const I = roundInfo(), B = t.big, sd = stdOf(S.big.num);
    ro = [F(I.r), B.words(I.r), `${B.nearest} ${F(I.u)}`, '#ff8a3d'];
    st = { emo: '🔢', title: B.rT(S.big.num, B.words(I.r)), lead: B.rL(I.dd, I.up), body: B.rB(I.u, I.lo, I.hi, I.mid), extra: `<div class="note">${esc(B.stdForm)}: ${esc(F(+sd.m))} × 10${sup(sd.e)}</div><div class="fine">${esc(t.fine.round)}</div>` };
  } else {
    const B = t.big, n = S.big.n, v = +S.big.mant * 10 ** n, m = F(+S.big.mant);
    ro = [`${m} × 10${sup(n)}`, `= ${F(v)}`, '', '#c58bff']; glow = 'rgba(197,139,255,.22)';
    st = { emo: '🔬', title: B.sT(m, n, v), lead: B.sL(n), body: B.sB(m, n), extra: `<div class="fine">${esc(t.fine.std)}</div>` };
  }
  lab.setReadout(ro[0], ro[1], ro[2], ro[3]); lab.setGlow(glow); lab.setState(st);
  ask.style.display = S.answered ? 'none' : '';
  if (!S.answered) ask.innerHTML = S.answer === null
    ? `<div class="q">${esc(t.ask)}</div><div class="opts">${t.opts.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="q" style="color:${S.answer === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(S.answer === 1 ? t.right : t.wrong)}</div><div class="opts"><button>${esc(t.go)} →</button></div>`;
}

// ---- scenes on the canvas --------------------------------------------------------------------------------
function digitRow(c, str, w, y, maxUnit, color, rowH) { // grouped digits; color(i, e) -> fill or null (muted)
  const n = str.length, gaps = Math.floor((n - 1) / 3), unit = Math.min(maxUnit, (w * 0.94) / (n + gaps * 0.45)), rowW = n * unit + gaps * unit * 0.45, x0 = (w - rowW) / 2;
  for (let i = 0; i < n; i++) {
    const e = n - 1 - i, x = x0 + i * unit + (gaps - Math.floor(e / 3)) * unit * 0.45, col = color(i, e);
    c.fillStyle = col ? col.bg : 'rgba(130,145,190,.12)'; rr(c, x + 1.5, y, unit - 3, rowH, 8); c.fill();
    if (col?.ring) { c.strokeStyle = col.ring; c.lineWidth = 2.5; rr(c, x + 1.5, y, unit - 3, rowH, 8); c.stroke(); }
    txt(c, str[i], x + unit / 2, y + rowH / 2 + 1, Math.min(rowH * 0.62, unit * 0.8), col ? col.fg : '#7d86a0', 900);
  }
}
function drawRound(c, w, h, dt) {
  const I = roundInfo(), R = S.big, s = String(R.num), p = R.p, t = T[lang].big;
  const rowH = Math.min(46, h * 0.16);
  digitRow(c, s, w, h * 0.05, 46, (i, e) => (e === p ? { bg: '#ff8a3d', fg: '#10131f' } : e === p - 1 ? { bg: '#4ea8ff', fg: '#10131f' } : e > p ? { bg: 'rgba(237,239,247,.16)', fg: '#EDEFF7' } : null), rowH);
  txt(c, I.up ? '▼  +1' : '▼  =', w / 2, h * 0.05 + rowH + h * 0.06, clamp(w * 0.04, 12, 17), I.up ? '#ffb27a' : '#8cc6ff', 900);
  const ts = String(I.r);
  digitRow(c, ts, w, h * 0.05 + rowH + h * 0.115, 40, (i, e) => (ts[i] !== '0' ? { bg: '#3ddc97', fg: '#10131f' } : null), rowH * 0.86);
  const x1 = w * 0.12, x2 = w * 0.88, ly = h * 0.77;
  R.fx += ((R.num - I.lo) / I.u - R.fx) * (1 - Math.exp(-dt * 8));
  c.strokeStyle = 'rgba(200,210,235,.55)'; c.lineWidth = 3; c.beginPath(); c.moveTo(x1, ly); c.lineTo(x2, ly); c.stroke();
  [[x1, I.lo, I.up ? '#98A0B8' : '#3ddc97'], [(x1 + x2) / 2, I.mid, '#f5c84c'], [x2, I.hi, I.up ? '#3ddc97' : '#98A0B8']].forEach(([x, v, col], i) => {
    c.fillStyle = col; c.beginPath(); c.arc(x, ly, i === 1 ? 5 : 8, 0, 7); c.fill();
    fitTxt(c, F(v), clamp(x, w * 0.14, w * 0.86), ly + 24, w * 0.3, 13, i === 1 ? '#f5c84c' : '#D3D9E8', 800);
  });
  txt(c, t.half, w / 2, ly - 16, 11, '#f5c84c', 700);
  const bx = x1 + R.fx * (x2 - x1);
  c.save(); c.shadowColor = '#ff8a3d'; c.shadowBlur = 14; c.fillStyle = '#ff8a3d'; c.beginPath(); c.arc(bx, ly, 10, 0, 7); c.fill(); c.restore();
  fitTxt(c, F(R.num), clamp(bx, w * 0.16, w * 0.84), ly - 34, w * 0.34, 15, '#fff', 900);
}
function drawZoom(c, w, h, dt) {
  const n = S.zn, i = n + 4, st = STOPS[i], prev = STOPS[i - 1], Z = T[lang].zoom;
  S.zs += (n - S.zs) * (1 - Math.exp(-dt * 8)); S.pop = Math.min(1, S.pop + dt * 2.2);
  const ease = 1 - (1 - S.pop) ** 3, padX = w * 0.05, bw = w - 2 * padX, tw = bw / 14, cell = bw / 10;
  fitTxt(c, prev ? Z.row(Z.names[i - 1], Z.names[i]) : Z.start, w / 2, h * 0.07, w * 0.92, clamp(w * 0.034, 12, 17), '#D3D9E8', 700);
  const rowY = h * 0.14, rowH = Math.min(cell * 1.1, h * 0.17);
  if (prev) for (let k = 0; k < 10; k++) {
    c.globalAlpha = clamp(ease * 1.8 - k * 0.07, 0, 1);
    c.fillStyle = 'rgba(78,168,255,.14)'; rr(c, padX + k * cell + 1.5, rowY, cell - 3, rowH, 7); c.fill();
    txt(c, prev.e, padX + (k + 0.5) * cell, rowY + rowH / 2 + 1, Math.min(cell * 0.58, rowH * 0.7), '#fff', 400, 'center', EMOJI);
  }
  c.globalAlpha = 1;
  const barY = h * 0.14 + rowH + h * 0.09, barH = h * 0.27;
  if (prev) txt(c, '≈', w / 2, barY - h * 0.045, h * 0.07, '#f5c84c', 900);
  const g = c.createLinearGradient(padX, 0, w - padX, 0); g.addColorStop(0, 'rgba(255,138,61,.28)'); g.addColorStop(1, 'rgba(255,138,61,.12)');
  c.fillStyle = g; rr(c, padX, barY, bw, barH, 14); c.fill(); c.strokeStyle = 'rgba(255,138,61,.7)'; c.lineWidth = 2; rr(c, padX, barY, bw, barH, 14); c.stroke();
  txt(c, st.e, w / 2, barY + barH * 0.42, Math.min(barH * 0.55, 62) * (0.7 + 0.3 * ease), '#fff', 400, 'center', EMOJI);
  fitTxt(c, Z.names[i], w / 2, barY + barH * 0.84, bw * 0.9, clamp(barH * 0.17, 12, 18), '#fff', 800);
  // ruler: one tick per power of ten
  const ry = h * 0.86;
  c.strokeStyle = 'rgba(200,210,235,.5)'; c.lineWidth = 2; c.beginPath(); c.moveTo(padX, ry); c.lineTo(w - padX, ry); c.stroke();
  const mx = padX + (S.zs + 4 + 0.5) * tw;
  c.fillStyle = 'rgba(255,138,61,.35)'; c.beginPath(); c.arc(mx, ry - tw * 0.55, Math.max(12, tw * 0.55), 0, 7); c.fill();
  STOPS.forEach((s, k) => {
    const x = padX + (k + 0.5) * tw, on = k === i;
    c.strokeStyle = on ? '#ff8a3d' : 'rgba(200,210,235,.6)'; c.lineWidth = on ? 3 : 2; c.beginPath(); c.moveTo(x, ry - 5); c.lineTo(x, ry + 5); c.stroke();
    txt(c, s.e, x, ry - tw * 0.55, clamp(tw * 0.5, 11, 22), '#fff', 400, 'center', EMOJI);
    txt(c, String(s.n), x, ry + 15, clamp(tw * 0.42, 10, 13), on ? '#ff8a3d' : '#98A0B8', 800);
  });
  fitTxt(c, Z.ruler, w / 2, h * 0.965, w * 0.9, 11, '#646C84', 700);
}
function drawGoogol(c, w, h, time) {
  const n = S.g, digits = '1' + '0'.repeat(n), tokens = [];
  for (let k = digits.length; k > 0; k -= 3) tokens.unshift(digits.slice(Math.max(0, k - 3), k));
  const nm = T[lang].g.names[n];
  txt(c, `10${sup(n)}`, w / 2, h * 0.1, Math.min(h * 0.12, 42), '#f5c84c', 900);
  if (nm) fitTxt(c, nm, w / 2, h * 0.21, w * 0.9, Math.min(h * 0.075, 26), n === 100 ? '#ff8a3d' : '#D3D9E8', 800);
  const ax = w * 0.05, aw = w * 0.9, ay = h * 0.3, ah = h * 0.66;
  let fs = 38; for (; fs > 8; fs--) { const per = Math.floor(aw / (fs * 2.25)), lines = Math.ceil(tokens.length / Math.max(1, per)); if (per >= 1 && lines * fs * 1.3 <= ah) break; }
  const per = Math.max(1, Math.floor(aw / (fs * 2.25))), lines = Math.ceil(tokens.length / per), y0 = ay + (ah - lines * fs * 1.3) / 2;
  tokens.forEach((tk, k) => {
    const r = Math.floor(k / per), col = k % per, rowN = Math.min(per, tokens.length - r * per), x0 = ax + (aw - rowN * fs * 2.25) / 2 + col * fs * 2.25, y = y0 + (r + 0.5) * fs * 1.3;
    c.font = `800 ${fs}px ${MONO}`; c.textAlign = 'left'; c.textBaseline = 'middle';
    for (let q = 0; q < tk.length; q++) {
      const one = k === 0 && q === 0;
      c.fillStyle = one ? '#ff8a3d' : `rgba(140,198,255,${0.55 + 0.4 * Math.sin(time * 3 - k * 0.5)})`;
      c.fillText(tk[q], x0 + q * fs * 0.62, y);
    }
  });
}
function drawTens(c, w, h) {
  const n = S.m, t = T[lang];
  const per = n > 5 ? Math.ceil(n / 2) : Math.max(1, n), rows = n > 5 ? 2 : 1, d = Math.min(56, (w * 0.9) / (per * 1.45)), areaY = h * 0.08;
  for (let k = 0; k < n; k++) {
    const r = Math.floor(k / per), col = k % per, rowN = Math.min(per, n - r * per), x = (w - rowN * d * 1.45) / 2 + col * d * 1.45 + d * 0.725, y = areaY + d * 0.6 + r * d * 1.25;
    c.save(); c.shadowColor = '#3ddc97'; c.shadowBlur = 10; c.fillStyle = '#3ddc97'; c.beginPath(); c.arc(x, y, d * 0.5, 0, 7); c.fill(); c.restore();
    txt(c, '10', x, y + 1, d * 0.42, '#10131f', 900);
    if (!(col === rowN - 1)) txt(c, '×', x + d * 0.725, y, d * 0.4, '#98A0B8', 900);
  }
  if (n === 0) txt(c, '1', w / 2, areaY + 30, 40, '#3ddc97', 900);
  const y2 = areaY + d * 1.25 * rows + h * 0.08;
  fitTxt(c, `= ${F(10 ** n)}`, w / 2, y2 + 6, w * 0.92, Math.min(h * 0.14, 52), '#fff', 900);
  fitTxt(c, `${uf(10 ** n, 'second', 0, 'long')}`, w / 2, y2 + h * 0.17, w * 0.92, clamp(h * 0.065, 13, 22), '#98A0B8', 700);
  fitTxt(c, `≈ ${timeText(n)}`, w / 2, y2 + h * 0.27, w * 0.92, Math.min(h * 0.12, 42), '#f5c84c', 900);
}

const cv = canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.secret === 's1') return drawGoogol(c, w, h, time);
  if (S.secret === 's2') return drawTens(c, w, h);
  if (lab.view === 'zoom') return drawZoom(c, w, h, dt);
  if (lab.view === 'place') { chartP.update(dt); return chartP.draw(c, w, h, { sel: S.sel, pointLabel: T[lang].point }); }
  if (S.big.mode === 'round') return drawRound(c, w, h, dt);
  chartB.update(dt); chartB.draw(c, w, h, { sel: -1, pointLabel: T[lang].point });
});

let drag = false;
const zoomAt = (ev) => { const r = $('cv').getBoundingClientRect(), w = r.width, pad = w * 0.05; zoomSet(Math.floor((ev.clientX - r.left - pad) / ((w - 2 * pad) / 14)) - 4); };
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.secret) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'place') { const i = chartP.hit(x, y); if (i >= 0) { S.sel = i; sfx.tick(); render(); } }
  else if (lab.view === 'zoom' && y > r.height * 0.68) { drag = true; $('cv').setPointerCapture(ev.pointerId); zoomAt(ev); }
});
$('cv').addEventListener('pointermove', (ev) => { if (drag) zoomAt(ev); });
['pointerup', 'pointercancel'].forEach((e) => $('cv').addEventListener(e, () => { drag = false; }));

buildMain();
render();
</script>
