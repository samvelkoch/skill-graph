  $('c2opts').style.display = pred ? '' : 'none';
  $('c2opts').innerHTML = pred ? task.o.map((o, i) => `<button data-pk="${i}">${esc(o)}</button>`).join('') : '';
  $('c2sl').style.display = pred || coin ? 'none' : '';
  K.forEach((k, i) => { $('sll' + i).textContent = `${K_EMO[i]} ${t.y.names[k]}`; const el = $('sl' + i); el.value = Y.v[i]; $('slo' + i).textContent = Y.v[i]; el.setAttribute('aria-label', t.y.names[k]); });
  $('c2try').style.display = Y.pick !== null && !coin ? '' : 'none'; $('c2try').textContent = t.y.try;
  $('c2rep').style.display = coin ? '' : 'none'; $('c2rep').textContent = t.y.coin.replay;
  const open = secret.unlocked();
  $('s1').className = `fx-sec ${open ? 'open' : ''} ${Y.mode !== 'town' ? 'on' : ''}`; $('s1').textContent = open ? `🔄 ${t.y.swapT[Y.mode]} · ${t.secrets.swap[0]}` : '🔒 ???';
  $('s2').className = `fx-sec ${open ? 'open' : ''} ${coin ? 'on' : ''}`; $('s2').textContent = open ? `🪙 ${coin ? t.y.coin.back : t.secrets.pay[0]}` : '🔒 ???';
  let st;
  if (coin) {
    const stp = Math.max(0, lastCoinStep); st = { emo: '🪙', title: t.y.coin.t, lead: t.y.coin.steps[stp], body: t.y.coin.lead };
    lab.setReadout(`${stp + 1}/4`, t.y.coin.t, '', '#f2c14e');
  } else {
    lab.setReadout(pred ? '0' : left, t.y.coins, `${t.y.mood} ${mood}%`, '#f2c14e');
    if (pred) st = { emo: '🔮', title: task.q, lead: t.y.pickGo };
    else if (Y.reveal) st = { emo: Y.pick === task.ok ? '✅' : '🤔', title: Y.pick === task.ok ? t.right : t.wrong, lead: task.r };
    else {
      const low = sat.map((q, i) => [q, i]).sort((a, b) => a[0] - b[0])[0];
      const modeLine = Y.mode !== 'town' ? `${t.y.swapT[Y.mode]}: ${t.y.swapL[Y.mode]} ${t.y.swapNote}` : '';
      st = { emo: '🏘️', title: t.y.title, lead: low[0] < 0.6 ? t.y.low[K[low[1]]] : t.y.all, body: modeLine || t.y.lead };
    }
  }
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body || '', extra: '' });
}
function renderTell(t) {

  let st;
  if (ob) st = { emo: '🗳️', title: r.bTitle, lead: r.bL, body: r.b[Math.max(0, R_.bStep)] };
  else if (sent) { const q = r.s[clamp(R_.stage, 0, 2)]; st = { emo: q[0], title: q[1], lead: q[2], body: r.reply[clamp(R_.stage, 0, 2)] }; }
  else st = { emo: '📣', title: r.t0.t, lead: r.t0.l };

  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body || '', extra: '' });
