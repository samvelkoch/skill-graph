    else lab.setState({ emo: '🧩', title: y.pcsT, lead: y.pcsL, body: y.pcsB, extra: '' });
  } else if (!g) {
    ctl = `<div class="row2"><button class="btn tq-main" data-act="gohunt">${esc(y.go)}</button></div>`;
    lab.setReadout('?', '', '', '#2e86ab');
    lab.setState({ emo: '🔒', title: y.lockT, lead: y.lockL, body: '', extra: '' });
  } else {
    const s = fmt(WL.reduce((a, x) => a + x, 0));
    ctl = `<div class="row2"><button class="btn tq-main" data-act="play">${esc(W.done || W.reg > 0 ? y.again : y.play)}</button></div>`;
    lab.setReadout(W.done ? s : '?', W.done ? 'a + c = b + d' : '', '', '#2e86ab');
    if (W.done) lab.setState({ emo: '🧮', title: y.doneT, lead: y.doneL, body: y.doneB(s), extra: '' });
    else lab.setState({ emo: '🧮', title: y.regT, lead: y.regL, body: y.regB, extra: '' });
  }
  $('tqQ').innerHTML = `<div class="chips">${chips}</div>${ctl}`;
}
function renderFit(t) {
  const F = S.f, f = t.fit, i = F.i, sh = FITS[i], ans = F.ans[i], g = gate(), name = f.names[i];
  lab.setGlow('rgba(95, 158, 74, .26)');
  lab.setFacts([{ emo: '🔵', text: t.f.tang, src: SRC.tang }, { emo: '📜', text: t.f.pitot, src: SRC.pitot }]);
  const chips = FITS.map((_, j) => `<button class="chip tq-chip ${j === i ? 'on' : ''}" data-act="fs" data-i="${j}">${esc(f.names[j])}${F.ans[j] === null ? '' : F.ans[j] === FITS[j].B.inc ? ' ✓' : ' ✗'}</button>`).join('');
  const q = `<div class="tq-q">${esc(f.q)}</div>`;
  const yn = `<div class="tq-opts">${[f.no, f.yes].map((o, j) => `<button class="tq-opt ${ans === null ? '' : (j === 1) === sh.B.inc ? 'good' : j === (ans ? 1 : 0) ? 'bad' : ''}" data-act="fp" data-i="${j}"${ans !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
  const done = F.ans.filter((x) => x !== null).length, rights = F.ans.filter((x, j) => x !== null && x === FITS[j].B.inc).length;
  $('tqQ').innerHTML = `<div class="chips" style="margin-bottom:12px">${chips}</div>${q}${yn}${ans === null ? '' : `<div class="row2"><button class="btn tq-main" data-act="fn">${esc(f.next)}</button></div>`}`;
  if (ans === null) {
    lab.setReadout(sh.L.map((x) => fmt(x)).join(' · '), 'a · b · c · d', '', '#5f9e4a');
    lab.setState({ emo: '🤔', title: f.q, lead: f.lead(name), body: '', extra: '' });
    return;
  }
  const ac = sh.L[0] + sh.L[2], bd = sh.L[1] + sh.L[3], eq = Math.abs(ac - bd) < 1e-6, okA = ans === sh.B.inc;
  if (g) lab.setReadout(`${fmt(ac)} ${eq ? '=' : '≠'} ${fmt(bd)}`, 'a + c · b + d', '', '#5f9e4a'); else lab.setReadout(sh.L.map((x) => fmt(x)).join(' · '), 'a · b · c · d', '', '#5f9e4a');
  const gp = Math.min(...sh.B.N.map((_, m) => sh.B.dist(sh.B.cs[0], m) - sh.B.r).filter((x) => x > 1e-6), Infinity);
  const body = [sh.B.inc ? '' : f.gap(fmt(gp)), g ? f.sums(fmt(ac), fmt(bd), eq) : f.lock, done === 6 ? f.score(rights) : ''].filter(Boolean).join(' ');
  lab.setState({ emo: okA ? '✅' : '🤔', title: okA ? t.ok : t.no, lead: sh.B.inc ? f.fitsT : f.notT, body, extra: '' });
}
function renderFam(t) {
  const m = t.fam, s = slider(), P = S.fam.k === 'rhomb' ? rhombP(S.fam.rv) : kiteP(S.fam.kv / 10), L = sideLens(P);
  lab.setGlow('rgba(95, 158, 74, .26)'); lab.setFacts([]);
  $('tqQ').innerHTML = `<div class="chips">${['rhomb', 'kite'].map((k) => `<button class="chip tq-chip ${S.fam.k === k ? 'on' : ''}" data-act="fk" data-k="${k}">${esc(m.kinds[k])}</button>`).join('')}</div>`;
  $('tqSlL').textContent = m.lbl[S.fam.k];
  const sl = $('tqRange'); sl.min = s.min; sl.max = s.max; sl.step = s.step; if (+sl.value !== s.v) sl.value = s.v;
  $('tqSlV').textContent = S.fam.k === 'rhomb' ? `${s.v}°` : fmt(s.v / 10);
  const ac = L[0] + L[2], bd = L[1] + L[3];
  lab.setReadout(`${fmt(ac)} = ${fmt(bd)}`, 'a + c = b + d', '', '#5f9e4a');
  lab.setState({ emo: '🔷', title: m.title, lead: m.lead, body: t.hunt.ruleBody(fmt(ac)), extra: '' });
}
function renderPit(t) {
  const m = t.pit, b = S.bld, eq = b.a + b.c === b.b + b.d;
  lab.setGlow('rgba(233, 162, 59, .26)'); lab.setFacts([]);
  $('tqQ').innerHTML = `<div class="tq-steps">${['a', 'b', 'c', 'd'].map((k, i) => `<div class="tq-step"><span class="tq-sk" style="color:${COL[i]}">${k}</span>
    <button class="tq-sb" data-act="st" data-k="${k}" data-d="-1" aria-label="−"${b[k] <= 2 ? ' disabled' : ''}>−</button><b>${b[k]}</b>
    <button class="tq-sb" data-act="st" data-k="${k}" data-d="1" aria-label="+"${b[k] >= 9 ? ' disabled' : ''}>+</button></div>`).join('')}</div>`;
  lab.setReadout(`${b.a + b.c} ${eq ? '=' : '≠'} ${b.b + b.d}`, 'a + c · b + d', '', '#e9a23b');
  if (eq) lab.setState({ emo: '⭕', title: m.yesT, lead: m.yesL, body: m.body, extra: '' });
  else lab.setState({ emo: '🚫', title: m.noT, lead: m.noL(b.a + b.c, b.b + b.d), body: m.body, extra: '' });
}
render();
</script>
