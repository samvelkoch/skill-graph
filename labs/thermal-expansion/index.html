let SC = 1; // canvas scale, so text never falls under 12 CSS px
const FONT = (px, wt = 700) => `${wt} ${px}px Nunito, ui-rounded, system-ui, sans-serif`;
function rr(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function lg(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function ball(c, x, y, r, col) {
  r = Math.max(0.1, r);
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, '#fff'); g.addColorStop(0.25, col); g.addColorStop(1, 'rgba(10,20,40,.9)');
  c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fillStyle = g; c.fill();
}
function tag(c, text, x, y, al = 'left', col = '#fff') {
  c.save(); c.font = FONT(Math.max(13, 12.5 / SC));
  const w = c.measureText(text).width + 16, h = 22;

  x0 = clamp(x0, 4, W - 4 - w); const y0 = clamp(y - h / 2, 4, H - 4 - h);

  c.fillStyle = col; c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillText(text, x0 + 8, y0 + h / 2 + 0.5); c.restore();
}
function label(c, text, x, y, al = 'left', col = 'rgba(214,224,245,.9)', px = 13, mw = 320) {

}

function render() {
  const t = T[lang], v = lab.view;
  $('sec1').hidden = v !== 'bridge'; $('sec2').hidden = v !== 'liquid'; $('sec3').hidden = v !== 'gas';
  if (v === 'bridge') renderBridge(t); else if (v === 'liquid') renderLiquid(t); else renderGas(t);

  $('sc1').innerHTML = chip('bridge', t.sc.bridge, sc === 'bridge') + chip('rail', t.sc.rail, sc === 'rail') + sec('eiffel', '🗼') + sec('bimetal', '🥪');

    : sc === 'rail' ? `<button class="chip ${S.rail === 'jointed' ? 'on' : ''}" data-act="rail" data-k="jointed">${esc(t.jt)}</button><button class="chip ${S.rail === 'welded' ? 'on' : ''}" data-act="rail" data-k="welded">${esc(t.wd)}</button>` : '';
  $('sc1b').hidden = sc !== 'bridge' && sc !== 'rail';
  const col = mixc('#7cc4ff', '#ff8a4c', (T1 + 20) / 60);
  if (!asked) {
    lab.setReadout(`${nf(T1)} °C`, t.seasonName(T1), '', col);
    lab.setState({ emo: t.pre1[0], title: t.pre1[1], lead: t.q1, body: t.pre1[2], extra: '' });
    lab.setFacts(t.f1);
    lab.setGlow('rgba(110, 165, 255, .28)');
    return;
  }
  lab.setGlow(T1 > 15 ? 'rgba(255, 150, 80, .28)' : 'rgba(110, 165, 255, .28)');
  const dT = T1 - REF; let st, rd, pill = '';
  if (sc === 'bridge' || sc === 'rail') {
    const L = sc === 'bridge' ? L_BR : L_RAIL, mm = ALPHA * L * dT * 1000, gapPx = sc === 'bridge' ? GAP0 - K_PX * mm : 12 - 0.5 * mm, gi = gapPx < 6 ? 0 : gapPx < 11.5 ? 1 : 2;
    rd = t.rd[sc](nf(mm, mm < 10 ? 1 : 0), t.forB(L, dT));
    if (sc === 'bridge' && !S.nogap) { st = t.s1.bridge[T1 <= -5 ? 0 : T1 >= 28 ? 2 : 1]; pill = t.pill1.bridge(t.gapW[gi]); }
    else if (sc === 'bridge') { const buck = T1 > -17; st = t.s1.nogap[T1 <= -17 ? 0 : T1 < 10 ? 1 : 2]; pill = t.pill1.nogap(buck); }
    else if (S.rail === 'jointed') { st = t.s1.jointed[T1 <= -5 ? 0 : T1 >= 28 ? 2 : 1]; pill = t.pill1.jointed(t.gapWp[gi]); }
    else { st = t.s1.welded[T1 <= 4 ? 0 : T1 <= 16 ? 1 : 2]; pill = t.pill1.welded(t.wd1[T1 <= 4 ? 0 : T1 <= 16 ? 1 : 2]); rd = [rd[0], rd[1]]; }
  } else if (sc === 'eiffel') {
    const cm = ALPHA * L_EIF * T1 * 100;
    rd = t.rd.eiffel(nf(cm, 1), t.forB(L_EIF, T1));
    st = T1 === 0 ? t.s1.eiffel0 : t.s1.eiffel(nf(Math.abs(cm), 1), cm > 0);
  } else {
    rd = t.rd.bimetal(nf(T1)); st = t.s1.bimetal[T1 < 18 ? 0 : T1 <= 22 ? 1 : 2];
  }
  lab.setReadout(rd[0], rd[1], pill, col);
  const first = S.rev1 && sc === 'bridge' && !S.nogap;
  const lead = first ? t.lead1(nf(ALPHA * L_BR * 60 * 100, 1)) : st[2];
  const head = first ? verdict(S.g1, t.ok1, t.wrong1) : st[1];
  lab.setState({ emo: first ? (S.g1 === t.ok1 ? '✅' : '🔎') : st[0], title: head, lead, body: '', extra: `<div class="fine">${esc(t.exag[sc])}</div>` });
  lab.setFacts(t.f1b);
}
function renderLiquid(t) {
  const asked = S.g2 !== null, T2 = S.T2;
  question($('pq2'), t.q2, t.o2, 'g2', asked);
  $('lk2').textContent = t.lock2; $('lk2').hidden = asked;
  $('r2').disabled = !asked; $('r2').value = T2; $('l2').textContent = t.sl2; $('e2a').textContent = t.ends2[0]; $('e2b').textContent = t.ends2[1];
  const col = mixc('#7cc4ff', '#ffb27a', T2 / 10);
  if (!asked) {
    lab.setReadout('0 °C', '', '', col);
    lab.setState({ emo: t.pre2[0], title: t.pre2[1], lead: t.q2, body: t.pre2[2], extra: '' });
    lab.setFacts([]); lab.setGlow('rgba(110, 165, 255, .28)');
    return;
  }
  const idx = T2 < 3.7 ? 0 : T2 <= 4.4 ? 1 : 2;
  lab.setReadout(`${nf(T2, 1)} °C`, `${nf(rho(T2), 3)} kg/m³`, t.pill2[idx], col);
  lab.setGlow(T2 < 4.2 ? 'rgba(110, 165, 255, .30)' : 'rgba(255, 170, 110, .26)');
  const first = S.rev2;
  const st = t.s2[idx];
  lab.setState({ emo: first ? (S.g2 === t.ok2 ? '✅' : '🔎') : st[0], title: first ? verdict(S.g2, t.ok2, t.wrong2) : st[1], lead: first ? t.lead2 : st[2], body: t.body2, extra: '' });
  lab.setFacts(t.f2);
}
function renderGas(t) {
  const asked = S.g3 !== null, T3 = S.T3, V3 = S.V3;
  question($('pq3'), t.q3, t.o3, 'g3', asked);
  $('r3t').value = T3; $('r3v').value = V3; $('r3v').disabled = !asked;
  $('l3t').textContent = t.slT; $('e3ta').textContent = t.endsT[0]; $('e3tb').textContent = t.endsT[1];
  $('l3v').textContent = t.slV; $('e3va').textContent = t.endsV[0]; $('e3vb').textContent = t.endsV[1];
  $('lk3').textContent = t.lock3; $('lk3').hidden = asked; $('rs3').textContent = t.reset; $('rs3').hidden = !asked;
  const col = mixc('#7cc4ff', '#ff8a4c', (T3 + 50) / 150);
  if (!asked) {
    lab.setReadout(`${nf(T3)} °C`, `60 ${t.mL}`, '', col);
    lab.setState({ emo: t.pre3[0], title: t.pre3[1], lead: t.q3, body: t.pre3[2], extra: '' });
    lab.setFacts([]); lab.setGlow('rgba(110, 165, 255, .28)');
    return;
  }
  const p = pOf(T3, V3), r = nf(p, 2);
  lab.setReadout(`${nf(p, 2)} ${t.atm}`, t.sub3(V3, nf(T3)), t.pill3(r), col);
  lab.setGlow(T3 > 30 ? 'rgba(255, 150, 80, .28)' : 'rgba(110, 165, 255, .28)');
  let st;
  if (S.last3 === 'guess') st = [S.g3 === t.ok3 ? '✅' : '🔎', verdict(S.g3, t.ok3, t.wrong3), t.lead3(nf(pOf(100, 60), 2), nf(373.15, 0))];
  else if (S.last3 === 'T') st = [t.s3.T[0], t.s3.T[1], t.s3.T[2](r)];
  else st = [t.s3.V[0], t.s3.V[1], t.s3.V[2](`${nf(p * V3, 0)} ${t.pvu}`)];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' });
  lab.setFacts(t.f3);
}
render();
