// --- controls -----------------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const q = ev.target.closest('[data-q]');
  if (q && !q.disabled) {
    const i = +q.dataset.q, v = lab.view;
    if (v === 'journey' && S.jq && S.jq.ans === null) { S.jq.ans = i; S.jPred = true; startCourt(); }
    else if (v === 'keys' && S.kq && S.kq.ans === null) { S.kq.ans = i; S.kPred = true; startRun(true); }
    else if (v === 'pyramid' && S.pq && S.pq.ans === null) { S.pq.ans = i; S.pPred = true; startCheck(); }
    return;
  }
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k;
    if (S.sec === 'mont') { S.mp = [null, null, null]; S.monT = null; }
    if (S.sec === 'houses') { S.hs = 'parl'; S.hT0 = S.clock; }
    sfx.click();
  } else if (a === 'hs') { S.hs = b.dataset.h; S.hT0 = S.clock; sfx.click(); }
  else if (a === 'bill') {
    S.j = { bill: b.dataset.b, stage: 'run', sub: 'leg', t0: S.clock, tc: 0, res: null }; S.jq = null; voteTick = -1; sfx.click();
  } else if (a === 'court') {
    if (S.j.bill === 'b3' && !S.jPred) { S.jq = { ans: null }; sfx.click(); } else startCourt();
  } else if (a === 'jreset') { S.j = { bill: null, stage: 'pick', sub: '', t0: 0, tc: 0, res: null }; S.jq = null; sfx.click(); }
  else if (a === 'kt') {
    if (S.kr && !S.kr.done) return;
    S.k[b.dataset.k] = b.dataset.v === 'ruler'; S.kr = null; if (S.kq && S.kq.ans === null && keyCount() !== 3) S.kq = null; sfx.snap();
  } else if (a === 'scen') { if (S.kr && !S.kr.done) return; S.scen = b.dataset.s; S.kr = null; sfx.tick(); }
  else if (a === 'run') {
    if (keyCount() === 3 && !S.kPred) { S.kq = { ans: null }; sfx.click(); } else startRun(false);
  } else if (a === 'lv') {
    const key = S.deck.shift(); if (!key) return;
    S.pl[key] = +b.dataset.l; S.order.push(key); S.pa[key] = { t0: S.clock }; S.handT0 = S.clock; S.pNote = false; sfx.snap();
  } else if (a === 'pcheck') {
    if (S.deck.length || S.pw || S.pc) return;
    const wrong = S.order.filter((k) => S.pl[k] !== CARD[k].l);
    if (wrong.length) { S.pw = { t0: S.clock, list: wrong }; sfx.bad(); }
    else if (!S.pPred) { S.pq = { ans: null }; sfx.click(); } else startCheck();
  } else if (a === 'preset') {
    Object.assign(S, { deck: ['k3', 'k5', 'k2', 'k1', 'k6', 'k4'], pl: {}, order: [], pa: {}, pw: null, pc: null, pDone: false, pq: null, pNote: false, handT0: S.clock }); sfx.click();
  }
  render();
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - V.ox) / V.s, y = (ev.clientY - r.top - V.oy) / V.s;
  if (S.sec === 'mont') {
    for (let i = 0; i < 3; i++) {
      const p = MON_PAGE(i);
      if (S.mp[i] === null && x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) {
        S.mp[i] = S.clock; sfx.click();
        if (S.mp.every((m) => m !== null)) S.monT = S.clock + .7;
        return;
      }
    }
  } else if (!S.sec && lab.view === 'pyramid' && !S.pc && !S.pw) {
    let best = null, bd = 1e9;
    for (const q of S.chipRects) { const d = Math.hypot(q.x - x, q.y - y); if (d < bd) { bd = d; best = q; } }
    if (best && bd <= 20 / V.s) {                                  // pick a placed rule up again
      S.order.splice(S.order.indexOf(best.k), 1); delete S.pl[best.k]; delete S.pa[best.k]; S.deck.unshift(best.k); S.handT0 = S.clock; S.pNote = false; sfx.tick(); render();
    }
  }
});

// --- one render per change: controls, readout, state card ---------------------------------------------------------------------
function qHTML(q, opts, ok, ans, mode, ex) {
  const t = T[lang];
  const btns = opts.map((o, i) => {
    const cls = mode === 'done' ? (i === ok ? 'good' : i === ans ? 'bad' : '') : ans === i ? 'pick' : '';
    return `<button data-q="${i}" class="${cls}"${mode === 'ask' ? '' : ' disabled'}>${esc(o)}</button>`;
  }).join('');
  const tail = mode === 'done' ? `<div class="verdict" style="color:var(--${ans === ok ? 'ok' : 'wip'})">${esc(ans === ok ? t.right : t.notQuite)}</div><p>${esc(ex)}</p>` : '';
  return `<div class="tp-q"><div class="q">${esc(q)}</div><div class="opts">${btns}</div>${tail}</div>`;
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  $('sJ').style.display = !sec && v === 'journey' ? '' : 'none';
  $('sK').style.display = !sec && v === 'keys' ? '' : 'none';
  $('sP').style.display = !sec && v === 'pyramid' ? '' : 'none';
  $('sS').style.display = sec ? '' : 'none';
  $('qBox').innerHTML = '';
  $('secRow').innerHTML = [['mont', '🖋️'], ['houses', '🌍']].map(([k, emo]) => {
    const open = secret.unlocked();
    return `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  }).join('');
  if (sec) renderSecret(t); else if (v === 'journey') renderJourney(t); else if (v === 'keys') renderKeys(t); else renderPyramid(t);
  lab.setFacts(t.facts[v]);
}
const fine = (t) => `<div class="fine">${esc(t.fine)}</div>`;

function renderJourney(t) {
  const j = S.j, st = j.stage, busy = st === 'run' || st === 'court', s = t.state;
  lab.setGlow('rgba(79,124,172,.3)');
  $('jCards').innerHTML = BILLS.map((b) => `<button class="tp-bill ${j.bill === b ? 'on' : ''}" data-act="bill" data-b="${b}"${busy ? ' disabled' : ''}><span class="e">${BILL_EMO[b]}</span><span>${esc(t.bills[b])}</span></button>`).join('');
  $('jCtl').innerHTML = st === 'force' && !S.jq ? `<button class="btn" data-act="court">${esc(t.challenge)}</button>` : st === 'result' ? `<button class="btn ghost" data-act="jreset">${esc(t.another)}</button>` : '';
  const names = { leg: t.stages.leg, exe: t.stages.exe, force: t.stages.force, court: t.stages.court, result: t.stages.court };
  const val = st === 'pick' ? '—' : esc(st === 'run' ? names[j.sub] : names[st]);
  const pillText = st === 'result' && j.res === 'struck' ? t.struck : st === 'force' || st === 'court' || st === 'result' ? t.inForce : '';
  lab.setReadout(`<span style="font-size:${st === 'pick' ? 34 : 19}px">${val}</span>`, t.ofJourney, pillText, '#4f7cac');
  let c;
  if (st === 'pick') c = { emo: '📜', title: s.journey0[0], lead: s.journey0[1], body: t.pickBill };
  else if (st === 'run') c = j.sub === 'leg' ? { emo: '🏛️', title: t.stages.leg, lead: t.branches.leg } : { emo: '🖊️', title: t.stages.exe, lead: t.branches.exe };
  else if (st === 'force') c = { emo: '✅', title: t.stages.force, lead: '' };
  else if (st === 'court') c = { emo: '⚖️', title: t.stages.court, lead: t.branches.jud };
  else c = { emo: j.res === 'fits' ? '✅' : '⚖️', title: s.journeyDone[0], lead: s.journeyDone[1], body: j.res === 'fits' ? t.fits : t.exJourney };
  lab.setState({ body: '', ...c, extra: fine(t) });
  if (S.jq && j.bill === 'b3') $('qBox').innerHTML = qHTML(t.journeyQ, t.journeyOpts, 2, S.jq.ans, S.jq.ans === null ? 'ask' : st === 'result' ? 'done' : 'wait', t.exJourney);
}
function renderKeys(t) {
  const r = S.kr, n = keyCount(), running = r && !r.done, s = t.state;
  lab.setGlow('rgba(184,69,60,.3)');
  $('kRows').innerHTML = KEYS.map((k) => `<div class="tp-key"><div class="lbl">${esc(t.keysT[k])}</div><div class="tp-seg">
    <button data-act="kt" data-k="${k}" data-v="own" class="${S.k[k] ? '' : 'on'}"${running ? ' disabled' : ''}>${esc(cap(t.own))}</button>
    <button data-act="kt" data-k="${k}" data-v="ruler" class="ruler ${S.k[k] ? 'on' : ''}"${running ? ' disabled' : ''}>${esc(cap(t.ruler))}</button></div></div>`).join('');
  $('kScen').innerHTML = Object.keys(SCEN).map((k) => `<button data-act="scen" data-s="${k}" class="${S.scen === k ? 'on' : ''}"${running ? ' disabled' : ''}>${esc(t.scen[k])}</button>`).join('');
  const asking = S.kq && S.kq.ans === null && n === 3;
  $('kCtl').innerHTML = asking ? '' : `<button class="btn" data-act="run"${running ? ' disabled' : ''}>${esc(t.run)}</button>`;
  lab.setReadout(t.keysN(n), t.keysWord, r?.done ? (r.stop ? t.stoppedBy(t.bn[r.stop]) : t.passed) : '', r?.done && r.stop ? '#2fb77a' : '#b8453c');
  let c;
  if (r?.done) {
    if (S.kPassed3 && S.kStopped) c = { emo: '🛡️', title: s.keysDone[0], lead: s.keysDone[1], body: r.stop ? t.reasons[r.stop] : t.exKeys };
    else if (r.stop) c = { emo: '🛑', title: t.reasons[r.stop], lead: '' };
    else c = { emo: '⚠️', title: cap(t.passed.replace('⚠️ ', '')), lead: r.n === 3 ? t.exKeys : '' };
  } else c = { emo: '🔑', title: s.keys0[0], lead: s.keys0[1] };
  lab.setState({ body: '', ...c, extra: fine(t) });
  let box = '';
  if (S.kq && n === 3 && (S.kq.ans === null || r?.q)) box += qHTML(t.keysQ, t.keysOpts, 1, S.kq.ans, S.kq.ans === null ? 'ask' : r?.q && r.done ? 'done' : 'wait', t.exKeys);
  if (r?.done && !r.stop && r.n === 3) box += `<p class="tp-note">${esc(t.giveBack)}</p>`;
  $('qBox').innerHTML = box;
}
function renderPyramid(t) {
  const busy = !!S.pw || (S.pc && !S.pDone), placed = Object.keys(S.pl).length, s = t.state;
  lab.setGlow('rgba(227,185,74,.28)');
  $('pLv').innerHTML = LV.map((l, i) => `<button style="--lc:${LVCOL[i]}" data-act="lv" data-l="${i}"${S.deck.length && !busy ? '' : ' disabled'}>${esc(t.levels[l])}<small>${esc(t.lvHint[l])}</small></button>`).join('');
  $('pCtl').innerHTML = S.pDone ? `<button class="btn ghost" data-act="preset">${esc(t.again)}</button>`
    : `<button class="btn" data-act="pcheck"${S.deck.length || busy || (S.pq && S.pq.ans === null) ? ' disabled' : ''}>${esc(t.check)}</button>`;
  lab.setReadout(`${placed} / 6`, t.placed, S.pDone ? t.broken(1) : '', '#e3b94a');
  let c;
  if (S.pDone) c = { emo: '📐', title: s.pyramidDone[0], lead: s.pyramidDone[1], body: t.exK5 };
  else if (S.pc) c = { emo: '🔍', title: t.check, lead: '' };
  else if (S.pNote || S.pw) c = { emo: '🤔', title: t.notQuite, lead: t.misplaced };
  else c = { emo: '📐', title: s.pyramid0[0], lead: s.pyramid0[1], body: S.deck.length ? t.place : '' };
  lab.setState({ body: '', ...c, extra: fine(t) });
  if (S.pq) $('qBox').innerHTML = qHTML(t.pyrQ, t.pyrOpts, 1, S.pq.ans, S.pq.ans === null ? 'ask' : S.pDone ? 'done' : 'wait', t.exPyr);
}
function renderSecret(t) {
  const k = S.sec;
  lab.setGlow(k === 'mont' ? 'rgba(255,190,110,.22)' : 'rgba(240,205,106,.22)');
  if (k === 'mont') {
    $('sS').innerHTML = `<p class="tp-note" style="margin-top:0">${esc(t.tapPages)}</p>`;
    lab.setReadout(`<span style="font-size:19px">${esc(t.secrets.mont[0])}</span>`, '', '', '#e0a96a');
    lab.setState({ emo: '🖋️', title: t.secrets.mont[0], lead: t.secrets.mont[1], body: t.secretA, extra: fine(t) });
  } else {
    $('sS').innerHTML = `<div class="tp-seg">${['parl', 'pres'].map((h) => `<button data-act="hs" data-h="${h}" class="${S.hs === h ? 'on' : ''}">${esc(cap(t[h]))}</button>`).join('')}</div>`;
    lab.setReadout(`<span style="font-size:19px">${esc(cap(t[S.hs]))}</span>`, '', '', '#f0cd6a');
    lab.setState({ emo: '🌍', title: t.secrets.houses[0], lead: t.secrets.houses[1], body: t.secretB, extra: fine(t) });
  }
}
render();
</script>
</body>
