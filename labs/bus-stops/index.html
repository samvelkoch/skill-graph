  if (done) { bx = px + pw + 6; by = cy; }
  else if (run) {
    if (rt < 1.6) { const e = ease(c01(rt / 1.6)); bx = lp(cx, px + pw * 0.74, e); by = lp(cy, cy - 12, e); }
    else if (rt < goalT) { const e = ease(c01((rt - 1.6) / (goalT - 1.6))); bx = lp(px + pw * 0.74, px + pw + 6, e); by = lp(cy - 12, cy, e) - Math.sin(e * Math.PI) * 10; }
    else { bx = px + pw + 6; by = cy; }
  }
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(bx, by + 5, 5, 2, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(bx, by, 5.2, 0, Math.PI * 2); c.fill(); c.lineWidth = 1; c.strokeStyle = '#222'; c.stroke();
  c.fillStyle = '#222'; c.beginPath(); c.arc(bx, by, 1.8, 0, Math.PI * 2); c.fill();
  // scoreboard: score and minute
  const scored = done || (run && rt >= goalT), sc = bv(mo, 'score')[scored ? 1 : 0];
  const mEnd = parseInt(bv(mo, 'mclock')[1], 10), minute = done ? mEnd : run ? Math.round(mEnd * c01(rt / mo.dur)) : parseInt(bv(mo, 'mclock')[0], 10);
  const flash = run && rt >= goalT && rt < goalT + 0.8 ? 1 - (rt - goalT) / 0.8 : 0;
  c.fillStyle = 'rgba(0,0,0,.3)'; rr(c, 96, 10, 168, 36, 12); c.fill();
  c.fillStyle = flash > 0 ? `rgb(${lp(16, 90, flash) | 0},${lp(22, 70, flash) | 0},${lp(42, 10, flash) | 0})` : '#10162a'; rr(c, 94, 6, 172, 36, 12); c.fill();
  c.lineWidth = 1.5; c.strokeStyle = flash > 0 ? '#f5c84c' : 'rgba(130,145,190,.5)'; c.stroke();
  c.fillStyle = '#e5484d'; c.beginPath(); c.arc(110, 24, 6, 0, Math.PI * 2); c.fill(); c.fillStyle = '#3b82f6'; c.beginPath(); c.arc(166, 24, 6, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#fff'; c.font = '900 20px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(sc, 138, 25);
  c.fillStyle = '#ffd96b'; c.font = '800 15px Nunito, sans-serif'; c.fillText(`${minute}′`, 226, 25);
}

// --- state -------------------------------------------------------------------------------------------------
const mkV = () => ({ mi: 0, phase: 'predict', pick: new Set(), t0: 0, dur: 1, hits: [], counts: [], ended: false });
const S = { v: { bus: mkV(), party: mkV(), next: mkV(), route: mkV() }, sec: null, ck: { t: 480, shown: 480, n: 0 } };
const mode = () => (lab.view === 'bus' && S.sec ? S.sec : lab.view);
const momOf = (m) => MOM[m][S.v[m].mi];

function finish(m) {
  const V = S.v[m]; if (!V || V.phase !== 'run') return;
  if (m === 'bus' || m === 'route') applyBus(busOf(m));
  if (m === 'route') {
    V.counts.push(BUS.route.people.length); V.mi++; V.phase = 'predict'; V.ended = V.mi >= ROUTE.length; sfx.snap(); render(); return;
  }
  const mo = momOf(m); V.phase = 'done';
  V.hits[V.mi] = mo.tiles.filter(([id, b, a]) => V.pick.has(id) === (b !== a)).length;
  (V.hits[V.mi] === mo.tiles.length ? sfx.good : sfx.snap)();
  render();
}
const settle = () => { for (const k of ['bus', 'party', 'next', 'route']) if (S.v[k].phase === 'run') finish(k); };
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function go() {
  const m = mode();
  if (m === 'clock') { S.ck.t += 10; S.ck.n++; sfx.tick(); render(); return; }
  const V = S.v[m];
  if (V.phase === 'run') return;
  if (m === 'route') {
    if (V.ended) { S.v.route = mkV(); BUS.route = mkBus(0); sfx.click(); render(); return; }
    const [on, off] = ROUTE[V.mi]; V.dur = planBus(BUS.route, off, on); V.phase = 'run'; V.t0 = now(); sfx.click(); render(); showStage(); return;
  }
  const n = MOM[m].length;
  if (V.phase === 'predict') {
    const mo = momOf(m);
    V.dur = mo.scene === 'bus' ? planBus(BUS.main, mo.off, mo.on) : mo.dur;
    V.phase = 'run'; V.t0 = now(); sfx.click(); render(); showStage();
  } else if (V.mi < n - 1) { V.mi++; V.phase = 'predict'; V.pick = new Set(); sfx.click(); render(); }
  else { S.v[m] = mkV(); if (m === 'bus') BUS.main = mkBus(MOM.bus[0].tiles[1][1]); sfx.click(); render(); }
}

// --- drawing -----------------------------------------------------------------------------------------------
const lab = shell({ key: 'bus-stops', T, topics: TOPICS, views: ['bus', 'party', 'next'], onLang: () => render(), onView: () => { settle(); render(); } });
const secret = secretLab('bus-stops', () => ({
  secrets: [{ emo: '📊', title: T[lang].secrets.route[0], desc: T[lang].secrets.route[1] }, { emo: '🕐', title: T[lang].secrets.clock[0], desc: T[lang].secrets.clock[1] }],
  questions: T[lang].quiz,
}), () => render());

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const m = mode(), V = S.v[m];
  if (V && V.phase === 'run' && now() - V.t0 >= V.dur) finish(m);
  if (m === 'clock') S.ck.shown += (S.ck.t - S.ck.shown) * Math.min(1, dt * 5);
  const sc = Math.min(w / 360, h / 260), ox = (w - 360 * sc) / 2, oy = (h - 260 * sc) / 2;
  const g = { vx0: -ox / sc, vx1: 360 + ox / sc, vy0: -oy / sc, vy1: 260 + oy / sc };
  const rt = V && V.phase === 'run' ? now() - V.t0 : 0;
  c.save(); c.translate(ox, oy); c.scale(sc, sc);
  if (m === 'bus' || m === 'route' || m === 'clock') busScene(c, g, time, m, V, rt);
  else {
    const mo = momOf(m);
    if (mo.scene === 'party') partyScene(c, g, time, mo, V, rt);
    else if (mo.scene === 'depot') depotScene(c, g, time, mo, V, rt);
    else pitchScene(c, g, time, mo, V, rt);
  }
  c.restore();
});

// --- controls ----------------------------------------------------------------------------------------------
$('ctrlBody').innerHTML = `
  <div id="bsAsk" class="bs-ask"></div>
  <div id="bsTiles" class="bs-tiles"></div>
  <div id="bsChart" class="bs-chart" hidden></div>
  <div class="row2"><button class="btn" id="bsMain" type="button"></button></div>
  <div class="row2" id="bsSec"><div class="chips" id="bsChips"></div></div>`;
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.tile) {
    const m = mode(), V = S.v[m];
    if (!V || V.phase !== 'predict') return;
    V.pick.has(b.dataset.tile) ? V.pick.delete(b.dataset.tile) : V.pick.add(b.dataset.tile);
    sfx.tick(); render();
  } else if (b.id === 'bsMain') go();
  else if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    settle(); S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; sfx.click(); render();
  }
});

// --- one render per change ---------------------------------------------------------------------------------
const fmtVal = (id, v) => (id === 'fuel' ? `<span class="fb">${Array.from({ length: 8 }, (_, i) => `<i class="${i < v ? 'on' : ''}"></i>`).join('')}</span>` : id === 'pitch' ? '🟩' : esc(v));
function tileHTML(t, id, b, a, state) { // state: {picked, done, flash, ro}
  const changed = b !== a, { picked, done, ro } = state;
  let cls = 'bs-tile', st;
  if (ro) { cls += state.flash ? ' on pulse' : ''; st = state.st || ''; }
  else if (done) { cls += picked === changed ? ' ok' : ' miss'; st = `${picked === changed ? '✓' : '✗'} ${changed ? t.chg : t.same}`; }
  else { cls += picked ? ' on' : ''; st = picked ? t.will : t.stay; }
  const was = !ro && done && changed ? `<span class="w">${esc(t.was)} ${fmtVal(id, b)}</span>` : '';
  const v = !ro && !done ? b : a;
  return `<button type="button" class="${cls}" data-tile="${id}"${ro || done ? ' disabled' : ''} aria-pressed="${!!picked}"><span class="e">${EMOJI[id]}</span><span class="n">${esc(t.c[id])}</span><span class="v">${fmtVal(id, v)}</span><span class="s">${esc(st)}</span>${was}</button>`;
}
function render() {
  const t = T[lang], m = mode(), v = lab.view;
  $('bsSec').hidden = v !== 'bus';
  const open = secret.unlocked();
  $('bsChips').innerHTML = ['route', 'clock'].map((k) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${k === 'route' ? '📊' : '🕐'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('bsChart').hidden = m !== 'route';
  $('bsTiles').hidden = m === 'route';
  lab.setFacts([]);
  if (m === 'route') renderRoute(t); else if (m === 'clock') renderClock(t); else renderMoment(t, m);
}
function renderMoment(t, m) {
  const V = S.v[m], mo = momOf(m), n = MOM[m].length, done = V.phase === 'done', last = V.mi === n - 1, tx = t.m[m][V.mi];
  $('bsAsk').innerHTML = `<b>${esc(tx.t)}.</b> ${esc(t.ask)}`;
  $('bsTiles').innerHTML = mo.tiles.map(([id, b, a]) => tileHTML(t, id, b, a, { picked: V.pick.has(id), done })).join('');
  const mb = $('bsMain');
  mb.textContent = V.phase === 'run' ? t.run : done ? (last ? t.again : t.nxt[m]) : t.go[m];
  mb.disabled = V.phase === 'run';
  lab.setGlow(`${COLOR[m]}33`);
  if (!done) {
    lab.setReadout(`${V.mi + 1}/${n}`, t.unit[m], '', COLOR[m]);
    lab.setState({ emo: EMO[m][V.mi], title: tx.t, lead: tx.l, body: '', extra: '' });
    return;
  }
  const hit = V.hits[V.mi], tot = mo.tiles.length, all = hit === tot;
  const names = (ch) => mo.tiles.filter(([, b, a]) => (b !== a) === ch).map(([id]) => t.c[id].toLocaleLowerCase(lang)).join(', ') || '—';
  const sum = V.hits.reduce((x, y) => x + y, 0);
  lab.setReadout(`${V.mi + 1}/${n}`, t.unit[m], t.pillOf(hit, tot), COLOR[m]);
  lab.setState({ emo: all ? '✅' : '🤔', title: all ? t.right : t.hits(hit, tot), lead: `${t.chgL}: ${names(true)}. ${t.sameL}: ${names(false)}.`, body: tx.w(mo),
    extra: last ? `<div class="fine">${esc(t.all(sum, MOM[m].reduce((x, y) => x + y.tiles.length, 0)))}</div>` : '' });
}
function renderRoute(t) {
  const V = S.v.route, r = t.route, k = V.counts.length, ended = V.ended, n = k ? V.counts[k - 1] : 0;
  $('bsAsk').textContent = r.ask;
  const bw = 26, gap = 13.5, base = 92, sc = 76 / SEATS, bx = (i) => 6 + i * (bw + gap);
  $('bsChart').innerHTML = `<svg viewBox="0 0 320 112" role="img" aria-label="${esc(r.t0)}"><line x1="2" y1="${base}" x2="318" y2="${base}" stroke="#646C84" stroke-width="1"/>
    <line x1="2" y1="${base - SEATS * sc}" x2="318" y2="${base - SEATS * sc}" stroke="#7aa7ff" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="318" y="${base - SEATS * sc - 4}" text-anchor="end" font-size="12" font-weight="800" fill="#7aa7ff">${SEATS} ${esc(r.seatsLbl)}</text>
    ${ROUTE.map((_, i) => { const has = i < k, cnt = V.counts[i], hh = has ? Math.max(2, cnt * sc) : 0;
      return `<rect x="${bx(i)}" y="${base - hh}" width="${bw}" height="${hh}" rx="5" fill="${i === k - 1 ? '#ffe07a' : '#f2b632'}"/>${has ? `<text x="${bx(i) + bw / 2}" y="${base - hh - 3}" text-anchor="middle" font-size="12" font-weight="900" fill="#EDEFF7">${cnt}</text>` : ''}<text x="${bx(i) + bw / 2}" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#98A0B8">${i + 1}</text>`; }).join('')}</svg>`;
  const mb = $('bsMain'); mb.textContent = V.phase === 'run' ? t.run : ended ? r.again : r.btn; mb.disabled = V.phase === 'run';
  lab.setGlow('#f2b63333');
  lab.setReadout(`${k}/${ROUTE.length}`, r.unit, k ? `🧍 ${n}` : '', COLOR.route);
  if (!k) lab.setState({ emo: '📊', title: r.t0, lead: r.l0, body: '', extra: '' });
  else lab.setState({ emo: '📊', title: r.stopTitle(k, n), lead: ended ? r.end(SEATS) : r.lead, body: '', extra: '' });
}
function renderClock(t) {
  const c = t.clock, n = S.ck.n, tm = timeStr(Math.round(S.ck.t)), people = BUS.clock.people.length;
  $('bsAsk').textContent = c.ask;
  const ro = (id, val, ch) => tileHTML(t, id, val, val, { ro: true, st: n ? (ch ? `↻ ${t.chg}` : `= ${t.same}`) : '', flash: ch && n > 0 });
  $('bsTiles').innerHTML = ro('seats', SEATS) + ro('pass', people) + ro('wheels', WHEELS) + ro('fuel', 6) + ro('time', tm, true);
  const mb = $('bsMain'); mb.textContent = c.btn; mb.disabled = false;
  lab.setGlow('#f2b63333');
  lab.setReadout(tm, c.unit, '', COLOR.clock);
  lab.setState(n ? { emo: '🕐', title: c.title(tm), lead: c.lead, body: '', extra: '' } : { emo: '🅿️', title: c.t0, lead: c.l0, body: '', extra: '' });
}
render();
</script>
