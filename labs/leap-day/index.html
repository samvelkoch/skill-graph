  const Y = D.shown, yr = Math.round(Y), sh = dDate(yr);
  setRO(td.date(sh.d, sh.m, td.monG), S.d.answer === null ? '' : td.spring, S.d.answer === null ? '' : td.late(dShift(yr)), '#7ccb62');
  const lw = Math.min(w - 24, 600), lh = Math.min(h * 0.42, 260), lx = (w - lw) / 2;
  drawLandscape(ctx, lx, 12, lw, lh, Y, time);
  pill(ctx, td.may, lx + 38, 12 + lh - 20, { fs: 12, px: 18 });
  const pw = Math.min(w - 60, 250), ph = Math.min(h - lh - 48, 240), px = (w - pw) / 2, py = 12 + lh + 14;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6; rr(ctx, px, py, pw, ph, 14);
  let g = ctx.createLinearGradient(0, py, 0, py + ph); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e6ebf4'); ctx.fillStyle = g; ctx.fill(); ctx.restore();
  ctx.save(); rr(ctx, px, py, pw, ph, 14); ctx.clip(); g = ctx.createLinearGradient(0, py, 0, py + 36); g.addColorStop(0, '#ff5a4d'); g.addColorStop(1, '#d93a30'); ctx.fillStyle = g; ctx.fillRect(px, py, pw, 36); ctx.restore();
  for (const bx of [px + pw * 0.28, px + pw * 0.72]) { ctx.beginPath(); ctx.arc(bx, py + 4, 5, 0, TAU); ctx.fillStyle = '#2a2f45'; ctx.fill(); ctx.beginPath(); ctx.arc(bx, py + 4, 2, 0, TAU); ctx.fillStyle = '#9aa3bd'; ctx.fill(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.font = FONT(900, 15); ctx.fillText(td.mon[sh.m].toUpperCase(), px + pw / 2, py + 21);
  ctx.fillStyle = '#1b2036'; ctx.font = `500 ${Math.min(80, ph * 0.38)}px "EB Garamond", Georgia, serif`; ctx.fillText(String(sh.d), px + pw / 2, py + 36 + (ph - 36) * 0.42);
  ctx.fillStyle = '#5a627c'; ctx.font = FONT(800, 13); ctx.fillText(td.spring, px + pw / 2, py + ph - 36);
  if (S.d.answer !== null) pill(ctx, td.late(dShift(yr)), px + pw / 2, py + ph - 14, { fg: '#ffe39a', bg: 'rgba(14,17,28,.9)', line: 'rgba(255,211,107,.5)' });
}

// --- year checker --------------------------------------------------------------------------------------------
function renderCheck() {
  const t = T[lang].c, y = +$('yIn').value;
  if (!Number.isInteger(y) || y < 1600 || y > 2400) { $('yRes').innerHTML = `<div class="ld-hint">${esc(t.range)}</div>`; return; }
  const d4 = y % 4 === 0, d100 = y % 100 === 0, d400 = y % 400 === 0, leap = d4 && (!d100 || d400), key = !d4 ? 1 : !d100 ? 2 : 3;
  const st = [[d4, true], [d100, d4], [d400, d4 && d100]];
  $('yRes').innerHTML = `<div class="ld-verdict ${leap ? 'y' : 'n'}">${esc(leap ? t.yes : t.no)}</div><div class="ld-hint" style="margin:0 0 8px">${esc(t.why[!d4 ? 0 : !d100 ? 1 : !d400 ? 2 : 3](y))}</div>
    <div style="display:grid;gap:5px">${st.map(([v, on], i) => `<div class="ld-step ${on ? '' : 'off'} ${key === i + 1 ? 'key' : ''}"><span>${esc(t.steps[i])}</span><b style="color:${on ? (v ? 'var(--ok)' : 'var(--wip)') : 'inherit'}">${on ? (v ? '✔ ' + t.yn[0] : '✘ ' + t.yn[1]) : '–'}</b></div>`).join('')}</div>`;
}

// --- secrets -------------------------------------------------------------------------------------------------
const birthYear = () => 1960 + 4 * S.b.i;
function bdayNums() {
  const now = new Date(), cur = now.getFullYear(), b = birthYear(); let n = 0;
  for (let y = b + 4; y <= cur; y += 4) if (isLeap(y) && !(y === cur && (now.getMonth() < 1 || (now.getMonth() === 1 && now.getDate() < 29)))) n++;
  return { n, age: cur - b - (now.getMonth() < 2 ? 1 : 0) };
}
function updateBday() {
  const s = T[lang].s, { n, age } = bdayNums();
  $('bBorn').textContent = s.born(birthYear()); $('bBig').textContent = s.age(age, n);
  $('bCakes').innerHTML = n ? Array.from({ length: n }, () => '<span>🎂</span>').join('') : `<span class="ld-hint" style="font-size:13px">${esc(s.none)}</span>`;
  setRO(esc(s.age(age, n)), s.born(birthYear()), '', '#ff9ccb');
}
function calPos(day, done) { const idx = done && day >= 15 ? day - 11 : day - 1; return [idx % 7, Math.floor(idx / 7)]; }
function applyCal(initial) {
  const cw = +secEl.dataset.cw || 44, chh = 32, top = 22;
  secEl.querySelectorAll('.ld-cal .d').forEach((el) => {
    const day = +el.dataset.d, [c, r] = calPos(day, S.c.done);
    el.style.left = c * cw + 'px'; el.style.top = top + r * (chh + 4) + 'px';
    const gone = S.c.done && day >= 5 && day <= 14;
    if (initial) { el.classList.toggle('gone', gone); el.style.transition = 'none'; void el.offsetWidth; el.style.transition = ''; }
    else if (gone) { el.classList.add('zap'); setTimeout(() => { el.classList.remove('zap'); el.classList.add('gone'); const pf = Object.assign(document.createElement('i'), { className: 'ld-puff', textContent: '💨' }); pf.style.left = el.style.left; pf.style.top = el.style.top; $('cCal')?.append(pf); setTimeout(() => pf.remove(), 900); }, 700); }
    else { el.classList.remove('gone', 'zap'); }
  });
  $('cBtn').textContent = S.c.done ? T[lang].s.back : T[lang].s.go;
}
function buildSec() {
  const s = T[lang].s, key = S.sec + lang; if (S.secBuilt === key) return; S.secBuilt = key;
  if (S.sec === 'a') {
    secEl.innerHTML = `<button class="ld-x" data-x aria-label="×">✕</button><h3>${esc(T[lang].secrets.a[0])}</h3><p>${esc(s.line)}</p>
      <div class="ld-lbl"><span id="bBorn"></span></div><input type="range" class="big" id="bRange" min="0" max="16" step="1" value="${S.b.i}" style="--track:linear-gradient(90deg,#ff9ccb,#ffd36b)">
      <div class="ends"><span>1960</span><span>2024</span></div><div class="ld-big" id="bBig"></div><div class="ld-cakes" id="bCakes"></div>`;
    updateBday();
  } else {
    const cw = Math.max(34, Math.min(46, Math.floor(((secEl.clientWidth || 340) - 28) / 7))); secEl.dataset.cw = cw;
    secEl.innerHTML = `<button class="ld-x" data-x aria-label="×">✕</button><h3>${esc(T[lang].secrets.b[0])}</h3><p>${esc(s.month)}</p>
      <div class="ld-cal" id="cCal" style="width:${cw * 7}px;height:${22 + 5 * 36}px">${s.wd.map((d, i) => `<div class="wd" style="left:${i * cw}px;width:${cw - 4}px">${esc(d)}</div>`).join('')}
      ${Array.from({ length: 31 }, (_, i) => `<div class="d ${i + 1 === 4 || i + 1 === 15 ? 'edge' : ''}" data-d="${i + 1}" style="width:${cw - 4}px;height:32px">${i + 1}</div>`).join('')}</div>
      <p style="text-align:center">${esc(s.lead)}</p><div class="row2" style="justify-content:center;margin:0 0 4px"><button class="btn" id="cBtn"></button></div>
      <div class="ld-rows">${s.rows.map(([f, n, r, k]) => `<div class="ld-row"><span>${f}</span><b>${esc(n)}</b><span class="r">${esc(r)}<br><span style="font-weight:700;color:var(--mut);font-size:12px">${esc(s.skip(k))}</span></span></div>`).join('')}</div>`;
    applyCal(true);
  }
}
secEl.addEventListener('click', (ev) => {
  if (ev.target.closest('[data-x]')) { S.sec = null; sfx.click(); render(); return; }
  if (ev.target.id === 'cBtn') { S.c.done = !S.c.done; sfx.push(); applyCal(false); render(); }
});
secEl.addEventListener('input', (ev) => { if (ev.target.id === 'bRange') { S.b.i = +ev.target.value; sfx.tick(); updateBday(); } });

// --- controls ------------------------------------------------------------------------------------------------
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const i = +b.dataset.a, v = lab.view;
  if (v === 'orbit') { if (O.asked) return; O.asked = true; O.guess = i; startYear(); return; }
  if (v === 'months') { S.m.answer = i; (i === 1 ? sfx.good : sfx.bad)(); }
  else { S.d.answer = i; S.d.target = 300; $('dRange').value = 300; (i === 1 ? sfx.good : sfx.bad)(); }
  render();
});
$('oGo').onclick = () => startYear();
$('oReset').onclick = resetOrbit;
$('mLeap').onclick = () => { S.m.leap = !S.m.leap; sfx.click(); render(); };
$('mGrid').addEventListener('click', (ev) => { const b = ev.target.closest('[data-m]'); if (!b || S.m.answer === null) return; const i = +b.dataset.m; S.m.sel = S.m.sel === i ? null : i; sfx.click(); render(); });
$('dRange').addEventListener('input', () => { S.d.target = +$('dRange').value; sfx.tick(); renderDrift(); });
$('yIn').addEventListener('input', renderCheck);
$('yChips').addEventListener('click', (ev) => { const b = ev.target.closest('[data-y]'); if (!b) return; $('yIn').value = b.dataset.y; sfx.click(); renderCheck(); });
$('secRow').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.sec; S.sec = S.sec === k ? null : k; S.secBuilt = '';
  if (S.sec === 'b') { S.c.done = false; setTimeout(() => { if (S.sec === 'b' && !S.c.done) { S.c.done = true; applyCal(false); render(); } }, 900); }
  sfx.click(); render(); if (S.sec) showStage();
});

// --- one render per change -----------------------------------------------------------------------------------
const askHTML = (q, opts, cls) => `<div class="ld-ask ${cls || ''}"><div class="q">${esc(q)}</div><div class="opts">${opts.map((o, i) => `<button class="ld-opt" data-a="${i}">${esc(o)}</button>`).join('')}</div></div>`;
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = S.sec ? 'sec' : v;
  $('ldOrbit').style.display = v === 'orbit' ? '' : 'none'; $('ldMonths').style.display = v === 'months' ? '' : 'none'; $('ldDrift').style.display = v === 'drift' ? '' : 'none';
  secEl.style.display = S.sec ? '' : 'none';
  $('secRow').innerHTML = [['a', '🎂'], ['b', '📆']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('oGo').textContent = t.oneYear; $('oGo').disabled = !O.asked || !!O.k; $('oReset').textContent = t.again;
  $('mLeap').textContent = (S.m.leap ? '✓ ' : '') + t.m.leap; $('mLeap').classList.toggle('on', S.m.leap);
  $('mGrid').innerHTML = t.m.abbr.map((a, i) => `<button class="ld-mb ${S.m.sel === i ? 'on' : ''}" data-m="${i}" ${S.m.answer === null ? 'disabled' : ''}>${esc(a)}</button>`).join('');
  $('dLbl').textContent = t.d.label; $('dSlide').style.display = S.d.answer === null ? 'none' : '';
  $('yLbl').textContent = t.c.year;
  $('yChips').innerHTML = [2024, 1900, 2000, 2100].map((y) => `<button class="chip" data-y="${y}">${y}</button>`).join('');
  renderCheck();
  if (S.sec) { buildSec(); renderSecState(); return; }
  topEl.style.display = 'none'; topEl.className = 'ld-top';
  askEl.innerHTML = ''; ro = '';
  if (v === 'orbit') renderOrbit(t); else if (v === 'months') renderMonths(t); else renderDrift();
}
function renderSecState() {
  const t = T[lang], k = S.sec;
  lab.setFacts(lab.view === 'orbit' && !O.revealed ? [] : t.facts[lab.view] || []);
  if (k === 'a') { lab.setState({ emo: '🎂', title: t.secrets.a[0], lead: t.s.line, body: '' }); updateBday(); }
  else { lab.setState({ emo: '📆', title: t.secrets.b[0], lead: t.s.lead, body: '' }); setRO(esc(t.s.ro), t.s.month, '', '#ffb547'); }
}
function renderOrbit(t) {
  const to = t.o, n = O.n;
  lab.setGlow('rgba(255, 181, 71, .26)');
  if (!O.asked) { askEl.innerHTML = askHTML(to.q, to.opts, 'bottom'); }
  else if (!O.revealed) { topEl.style.display = ''; topEl.innerHTML = `${esc(to.guess)}<b>${esc(to.opts[O.guess])}</b>`; }
  else { const ok = O.guess === 1; topEl.style.display = ''; topEl.className = 'ld-top ' + (ok ? 'ok' : ''); topEl.innerHTML = `<b>${esc(ok ? to.right : to.wrong)}</b> ${esc(to.rev)}`; }
  let st;
  if (!O.asked) st = { emo: '🤔', title: to.q, lead: to.pick, body: '' };
  else if (O.k) st = O.k === 4 && O.p > RUN ? { emo: '📆', title: to.y[3][0], lead: to.y[3][1], body: '' } : { emo: '🌍', title: to.run[0], lead: to.run[1], body: '' };
  else if (n === 0) st = { emo: '🚩', title: to.ready[0], lead: to.ready[1], body: '' };
  else st = { emo: n === 4 ? '📆' : '⏱️', title: to.y[n - 1][0], lead: to.y[n - 1][1], body: n === 4 ? to.rule : to.note };
  lab.setState(st);
  lab.setFacts(O.revealed ? t.facts.orbit : []);
}
function renderMonths(t) {
  const m = t.m, M = S.m, sel = M.sel;
  lab.setGlow('rgba(255, 154, 74, .24)');
  if (M.answer === null) { askEl.innerHTML = `<div class="ld-cover">${askHTML(m.q, m.opts)}</div>`; lab.setState({ emo: '🤔', title: m.q, lead: m.pick, body: '' }); lab.setFacts([]); return; }
  const ok = M.answer === 1; topEl.style.display = ''; topEl.className = 'ld-top ' + (ok ? 'ok' : ''); topEl.innerHTML = `<b>${esc(ok ? m.right : m.wrong)}</b> ${esc(m.rev)}`;
  if (sel === null) lab.setState({ emo: '🖐️', title: m.rule[0], lead: m.rule[1], body: '' });
  else lab.setState({ emo: '🖐️', title: m.days(cap1(m.names[sel]), mDays(sel)), lead: sel === 1 ? m.feb(mDays(1)) : isKn(sel) ? m.knuckle(cap1(m.names[sel])) : m.dip(cap1(m.names[sel])), body: m.rule[1] });
  lab.setFacts(t.facts.months);
}
function renderDrift() {
  const t = T[lang], td = t.d, D = S.d;
  lab.setGlow('rgba(124, 203, 98, .24)');
  $('dVal').textContent = td.yrs(D.target);
  if (D.answer === null) { askEl.innerHTML = `<div class="ld-cover">${askHTML(td.q, td.opts)}</div>`; lab.setState({ emo: '🤔', title: td.q, lead: td.pick, body: '' }); lab.setFacts([]); return; }
  const ok = D.answer === 1, y = D.target, dd = dShift(y), sh = dDate(y), wi = y < 75 ? 0 : y < 200 ? 1 : 2;
  if (lab.view === 'drift') { topEl.style.display = ''; topEl.className = 'ld-top ' + (ok ? 'ok' : ''); topEl.innerHTML = `<b>${esc(ok ? td.right : td.wrong)}</b> ${esc(td.res(dShift(300)))}`; }
  if (y === 0) lab.setState({ emo: '🌸', title: td.zero[0], lead: td.zero[1], body: td.wxl(td.wx[0]) });
  else lab.setState({ emo: td.emo[wi], title: td.title(y), lead: td.lead(dd, td.date(sh.d, sh.m, td.monG)), body: td.wxl(td.wx[wi]) });
  lab.setFacts(t.facts.drift);
}

// --- loop ----------------------------------------------------------------------------------------------------
canvasLoop(cv, (ctx, w, h, dt, time) => {
  CW = w; CH = h;
  if (S.sec) return;
  const v = lab.view;
  if (v === 'orbit') drawOrbit(ctx, w, h, dt, time); else if (v === 'months') drawMonths(ctx, w, h); else drawDrift(ctx, w, h, dt, time);
});
render();
</script>
