    for (let k = 1; k < p.length; k++) { const m = Math.max(c.measureText(p.slice(0, k).join('-') + '-').width, c.measureText(p.slice(k).join('-')).width); if (m < bw) { bw = m; best = k; } }
    c.fillText(p.slice(0, best).join('-') + '-', cx, cy - 7); c.fillText(p.slice(best).join('-'), cx, cy + 8); return;
  }
  c.font = F(13, s, 900); c.fillText(txt, cx, cy + 1);
}
function sceneWords(c, w, h, dt, time) {
  const { s, ox, oy } = fit(w, h, 360, 304), m = S.m, t = T[lang];
  S.m.geo = { s, ox, oy };
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#1b2250'); bg.addColorStop(1, '#0d1226'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  c.save(); c.translate(ox, oy); c.scale(s, s); c.lineJoin = 'round';
  for (let i = 0; i < 6; i++) {
    const age = time - m.shakeAt, bad = m.shake === i && age < 0.5, dx = bad ? Math.sin(age * 50) * 5 * (1 - age / 0.5) : 0, x = CX[i % 3] + dx, y = CY[Math.floor(i / 3)];
    c.fillStyle = 'rgba(0,0,0,.3)'; rr(c, x + 2, y + 4, CWD, CHT, 14); c.fill();
    const g = c.createLinearGradient(x, y, x + CWD, y + CHT); g.addColorStop(0, '#2d376a'); g.addColorStop(1, '#1b2142'); c.fillStyle = g; rr(c, x, y, CWD, CHT, 14); c.fill();
    c.lineWidth = m.selP === i ? 3.5 : 1.5; c.strokeStyle = bad ? '#ff6b5e' : m.selP === i ? '#ffd75e' : '#4a5a96'; c.stroke();
    c.save(); c.translate(x + 54, y + 50); c.scale(0.95, 0.95); PIC[i](c, time); c.restore();
    const sy = y + 100, placed = m.placed[i] >= 0;
    if (placed) { const sg = c.createLinearGradient(0, sy, 0, sy + 34); sg.addColorStop(0, '#5fe8ae'); sg.addColorStop(1, '#2aa874'); c.fillStyle = sg; rr(c, x + 5, sy, CWD - 10, 34, 12); c.fill(); c.strokeStyle = '#1d7a56'; c.lineWidth = 1.5; c.stroke(); slotText(c, t.w.words[i], x + CWD / 2, sy + 17, CWD - 18, s, '#0c2a1f'); }
    else { c.fillStyle = 'rgba(10,14,28,.7)'; rr(c, x + 5, sy, CWD - 10, 34, 12); c.fill(); c.setLineDash([5, 4]); c.strokeStyle = m.selW >= 0 ? '#ffd75e' : '#4a5a96'; c.lineWidth = 1.5; c.stroke(); c.setLineDash([]);
      c.fillStyle = '#7d89b8'; c.font = F(18, s, 900); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', x + CWD / 2, sy + 18); }
  }
  c.restore();
}

// --- the sea scene of "Storm or calm?" ----------------------------------------------------------------------
function stepStorm(dt) {
  const st = S.st; if (st.phase !== 'play') return;
  st.playT += dt; const idx = Math.floor(st.playT / 2.8);
  if (idx >= st.queue.length) { st.phase = 'done'; st.rtarget = 0.3; st.qi = -1; render(); return; }
  if (idx !== st.qi) { st.qi = idx; const ln = stormPair(st.round)[st.queue[idx]]; st.rtarget = ln.rough; seaSound(!!ln.rough); render(); }
}
function sceneStorm(c, w, h, dt, time) {
  const st = S.st; stepStorm(dt);
  st.rough += (st.rtarget - st.rough) * Math.min(1, dt * 2.5);
  const { s, ox, oy } = fit(w, h, 360, 300), rough = clamp01(st.rough);
  st.wave += (6 + rough * 30 - st.wave) * Math.min(1, dt * 3);
  drawSky(c, w, h, s, ox, oy, rough, time);
  const baseY = oy + 190 * s; drawSea(c, w, h, baseY, st.wave * s, time, rough, s);
  c.save(); c.translate(ox, oy); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  const p = waveP(1, baseY, st.wave * s, rough, s), by = (waveAt(ox + 180 * s, p, 1, time) - oy) / s, ang = Math.sin(time * (1.2 + rough * 2)) * (0.07 + rough * 0.25);
  c.translate(180, by - 4); c.rotate(ang);
  c.strokeStyle = '#5a3a1a'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, -4); c.lineTo(0, -60); c.stroke();
  c.fillStyle = '#f6efe0'; c.strokeStyle = '#8a7a60'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(3, -58); c.lineTo(3, -10); c.lineTo(32, -10); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#e8dcc4'; c.beginPath(); c.moveTo(-3, -52); c.lineTo(-3, -10); c.lineTo(-24, -10); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#e0364a'; c.beginPath(); c.moveTo(0, -60); c.lineTo(12, -56); c.lineTo(0, -52); c.closePath(); c.fill();
  const hg = c.createLinearGradient(0, -6, 0, 14); hg.addColorStop(0, '#e8956a'); hg.addColorStop(1, '#8a4a2c'); c.fillStyle = hg; c.strokeStyle = '#4a2514'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(-36, -6); c.lineTo(36, -6); c.quadraticCurveTo(28, 14, 20, 14); c.lineTo(-20, 14); c.quadraticCurveTo(-28, 14, -36, -6); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#fff'; circ(c, -10, 3, 3); circ(c, 4, 3, 3); circ(c, 18, 3, 3); c.fill();
  c.rotate(-ang); c.translate(-180, -(by - 4));
  if (st.phase === 'play' && st.qi >= 0) pill(c, `▶ ${'AB'[st.queue[st.qi]]}`, 180, 24, s, { size: 18 });
  c.restore();
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'echo') sceneEcho(c, w, h, dt, time); else if (v === 'words') sceneWords(c, w, h, dt, time); else sceneStorm(c, w, h, dt, time);
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'words' || !S.m.geo) return;
  const g = S.m.geo, r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - g.ox) / g.s, y = (ev.clientY - r.top - g.oy) / g.s;
  for (let i = 0; i < 6; i++) { const cx = CX[i % 3], cy = CY[Math.floor(i / 3)]; if (x >= cx && x <= cx + CWD && y >= cy && y <= cy + CHT) { tapPic(i); break; } }
});

// --- actions ---------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function tapPic(i) {
  const m = S.m; playPic(i);
  if (m.placed[i] < 0) { m.selP = i; if (m.selW >= 0) attempt(m.selP, m.selW); }
  render();
}
function tapWord(wi) {
  const m = S.m; if (m.placed.includes(wi)) return;
  m.selW = m.selW === wi ? -1 : wi; if (m.selW >= 0 && m.selP >= 0) attempt(m.selP, m.selW);
  render();
}
function attempt(p, w) {
  const m = S.m; m.last = w;
  if (p === w) { m.placed[p] = w; m.msg = 'right'; sfx.good(); if (m.placed.every((x) => x >= 0)) { showStage(); playPic(2); } }
  else { m.msg = 'wrong'; m.shake = p; m.shakeAt = now(); sfx.bad(); }
  m.selP = -1; m.selW = -1;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'sec') {
    const k = b.dataset.k; if (!secret.unlocked()) return secret.open();
    const here = lab.view === 'echo'; S.sec = here && S.sec === k ? null : k;
    if (k === 'twist') S.tw = { k: S.tw.k, words: [], at: now() };
    if (k === 'rhyme') S.rh = { step: 0, run: false, t: 0, at: [] };
    sfx.click();
    if (!here) { $('views').querySelector('[data-view="echo"]').click(); return; }
  } else if (a === 'pick') {
    if (S.phase === 'guess') { S.pick = i; S.phase = 'sweep'; S.sweepT = 0; S.sweepI = -1; S.seen = []; S.lamp = -1; audioReady(); showStage(); }
    else if (S.phase === 'free') lampTo(i);
  } else if (a === 'nextline') { S.li = (S.li + 1) % LINES[lang].length; S.pick = null; S.phase = 'guess'; S.lamp = -1; S.seen = []; sfx.click(); }
  else if (a === 'tsound') { S.tw = { k: i, words: [], at: now() }; sfx.click(); }
  else if (a === 'tword') { const sd = BANKS[lang].s[S.tw.k], list = sd.w.concat(BANKS[lang].conn); if (S.tw.words.length < 8) { S.tw.words.push(list[i]); S.tw.at = now(); ding(PENTA[S.tw.words.length % 4], 0.1); } }
  else if (a === 'tundo') { S.tw.words.pop(); S.tw.at = now(); sfx.tick(); }
  else if (a === 'tclear') { S.tw.words = []; sfx.click(); }
  else if (a === 'shine') { S.rh = { step: 0, run: true, t: 0, at: [] }; audioReady(); }
  else if (a === 'wpick') { tapWord(i); return; }
  else if (a === 'wagain') { S.m = { placed: [-1, -1, -1, -1, -1, -1], selP: -1, selW: -1, shake: -1, shakeAt: -9, msg: null, last: -1, geo: S.m.geo }; sfx.click(); }
  else if (a === 'sline') {
    const st = S.st;
    if (st.phase === 'guess') { st.pick = i; st.phase = 'play'; st.queue = [0, 1]; st.qi = -1; st.playT = 0; audioReady(); showStage(); }
    else if (st.phase === 'done') { st.phase = 'play'; st.queue = [i]; st.qi = -1; st.playT = 0; }
  } else if (a === 'snext') { const st = S.st; st.round = st.round === 0 ? 1 : 0; st.pick = null; st.phase = 'guess'; st.rtarget = 0.3; st.qi = -1; sfx.click(); }
  render();
});

// --- one render per change: controls, readout, state card, facts --------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  lab.setFacts(t.facts[v] ?? t.facts.echo);
  if (v === 'echo') renderEcho(t); else if (v === 'words') renderWords(t); else renderStorm(t);
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${v === 'echo' && S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('spSec').innerHTML = sc('twist', '🌀') + sc('rhyme', '🔁');
}
const GOLD = '#ffd75e';
function renderEcho(t) {
  if (S.sec === 'twist') return renderTwist(t);
  if (S.sec === 'rhyme') return renderRhyme(t);
  const e = t.e, line = curLine(), lay = echoLay(), free = S.phase === 'free', sweep = S.phase === 'sweep', guess = S.phase === 'guess';
  lab.setGlow('rgba(255,200,90,.22)');
  $('spMain').innerHTML = `<div class="sp-row first"><div class="sp-lbl">${esc(e.askT)}</div>${line.chips.map((k, i) =>
    `<button class="sp-chip ${free && S.lamp === i ? 'on' : ''} ${free && i === line.ok ? 'win' : ''}" data-act="pick" data-i="${i}"${sweep ? ' disabled' : ''}>${esc(k)}${S.seen[i] ? `<small>${countOf(lay, k)}</small>` : ''}</button>`).join('')}</div>`
    + (free ? `<div class="sp-row"><button class="btn" data-act="nextline">${esc(e.next)}</button></div>` : '');
  if (guess) { lab.setReadout('?', e.sub0, '', GOLD); lab.setState({ emo: '🔦', title: e.askT, lead: e.askL, body: '', extra: '' }); return; }
  const k = line.chips[Math.max(0, S.lamp)], n = S.lamp >= 0 ? countOf(lay, k) : '?';
  if (sweep) { lab.setReadout(n, S.lamp >= 0 ? e.sub(k) : '', '', GOLD); lab.setState({ emo: '🔦', title: e.shT, lead: e.shL, body: '', extra: '' }); return; }
  const kn = line.chips[line.ok];
  lab.setReadout(n, e.sub(k), line.kind === 'alli' ? e.devA : e.devS, GOLD);
  if (S.lamp === line.ok) lab.setState({ emo: S.ok ? '✅' : '🤔', title: S.ok ? t.right : e.wrong(kn), lead: line.kind === 'alli' ? e.alli : e.asso, body: '', extra: '' });
  else lab.setState({ emo: '🔦', title: e.times(k, n), lead: e.top(kn, countOf(lay, kn)), body: '', extra: '' });
}
function renderTwist(t) {
  const b = BANKS[lang], sd = b.s[S.tw.k], tw = t.tw, text = S.tw.words.join(' '), n = countOf(layout([text]), sd.k), full = S.tw.words.length >= 8;
  lab.setGlow('rgba(255,200,90,.22)');
  $('spMain').innerHTML = `<div class="sp-row first"><div class="sp-lbl">${esc(tw.pick)}</div>${b.s.map((x, i) => `<button class="sp-chip ${i === S.tw.k ? 'on' : ''}" data-act="tsound" data-i="${i}">${esc(x.k)}</button>`).join('')}</div>
    <div class="sp-row"><div class="sp-lbl">${esc(tw.build)}</div><div class="sp-built">${text ? esc(text) : `<i>${esc(tw.ph)}</i>`}</div></div>
    <div class="sp-row">${sd.w.concat(b.conn).map((w, i) => `<button class="sp-chip word" data-act="tword" data-i="${i}"${full ? ' disabled' : ''}>${esc(w)}</button>`).join('')}</div>
    <div class="sp-row"><button class="sp-chip small" data-act="tundo"${S.tw.words.length ? '' : ' disabled'}>${esc(tw.undo)}</button><button class="sp-chip small" data-act="tclear"${S.tw.words.length ? '' : ' disabled'}>${esc(tw.clear)}</button></div>`;
  lab.setReadout(n, tw.sub(sd.k), '', GOLD);
  lab.setState(n ? { emo: '🌀', title: tw.t1(n, sd.k), lead: n >= 4 ? tw.l1 : tw.l0, body: '', extra: '' } : { emo: '🌀', title: tw.t0, lead: tw.l0, body: '', extra: '' });
}
function renderRhyme(t) {
  const rh = t.rh, V = VERSES[lang], r = S.rh, done = r.step >= 4, scheme = V.g.map((g) => 'AB'[g]).join(' ');
  lab.setGlow('rgba(255,200,90,.22)');
  $('spMain').innerHTML = `<div class="sp-row first"><button class="btn" data-act="shine"${r.run ? ' disabled' : ''}>${esc(r.step ? rh.again : rh.shine)}</button></div>`;
  lab.setReadout(done ? scheme.replace(/ /g, '') : '?', rh.sub, '', GOLD);
  const fine = `<div class="sp-fine">${esc(rh.src)}</div>`;
  lab.setState(done ? { emo: '🔁', title: rh.t1, lead: rh.l1(scheme), body: '', extra: fine } : { emo: '🔁', title: rh.t0, lead: rh.l0, body: '', extra: fine });
}
function renderWords(t) {
  const w = t.w, m = S.m, n = m.placed.filter((x) => x >= 0).length, done = n === 6, title = t.views.words.slice(3); // the tab label without its emoji and space
  lab.setGlow('rgba(255,200,90,.22)');
  $('spMain').innerHTML = `<div class="sp-row first">${SHUF.map((wi) => `<button class="sp-chip word ${m.selW === wi ? 'on' : ''}" data-act="wpick" data-i="${wi}"${m.placed.includes(wi) ? ' disabled' : ''}>${esc(w.words[wi])}</button>`).join('')}</div>`
    + (done ? `<div class="sp-row"><button class="btn" data-act="wagain">${esc(t.s.again)}</button></div>` : '');
  lab.setReadout(`${n}/6`, w.sub, '', '#ffc94a');
  if (done) lab.setState({ emo: '🎉', title: w.doneT, lead: w.doneL, body: '', extra: `<div class="sp-fine">${esc(w.roost)}</div><div class="sp-roost">${['EN', 'RU', 'HU'].map((l, i) => `<span class="sp-pill"><b>${l}</b>${esc(w.roostW[i])}</span>`).join('')}</div>` });
  else if (m.msg === 'right' && m.selP < 0 && m.selW < 0) lab.setState({ emo: '✅', title: t.right, lead: w.rightL(w.words[m.last]), body: '', extra: '' });
  else if (m.msg === 'wrong' && m.selP < 0 && m.selW < 0) lab.setState({ emo: '🤔', title: w.wrongT, lead: w.wrongL, body: '', extra: '' });
  else lab.setState({ emo: '🐝', title, lead: m.selW >= 0 ? w.leadW(w.words[m.selW]) : m.selP >= 0 ? w.leadP : w.lead, body: '', extra: '' });
}
function renderStorm(t) {
  const s = t.s, st = S.st, r = st.round, pair = stormPair(r), okI = stormOk(r), done = st.phase === 'done', play = st.phase === 'play', q = r ? s.q2 : s.q1;
  const hard = pair.map((p) => roughCount(p.text, HARD[lang])), H = HARD[lang], So = SOFT[lang];
  const paint = (text) => tokAll(text).map((x) => (x.k && H.has(x.k) ? `<span class="sp-h">${esc(x.t)}</span>` : x.k && So.has(x.k) ? `<span class="sp-s">${esc(x.t)}</span>` : esc(x.t))).join('');
  lab.setGlow('rgba(95,168,200,.26)');
  $('spMain').innerHTML = `<div class="sp-row first"><div class="sp-lbl">${esc(q)}</div><div class="sp-lines">${pair.map((p, i) =>
    `<button class="sp-line ${done && i === okI ? 'win' : ''}" data-act="sline" data-i="${i}"${play ? ' disabled' : ''}><b>${'AB'[i]}</b><span>${done ? paint(p.text) : esc(p.text)}</span></button>`).join('')}</div></div>`
    + (done ? `<div class="sp-row"><button class="btn" data-act="snext">${esc(r === 0 ? s.nextL : s.again)}</button></div>` : '');
  lab.setReadout(done ? `${hard[0]} : ${hard[1]}` : '?', done ? s.sub : '', '', '#5fa8c8');
  if (done) lab.setState({ emo: st.pick === okI ? '✅' : '🤔', title: st.pick === okI ? t.right : s.wrong('AB'[okI]), lead: r === 0 ? s.doneStorm : s.doneLull, body: s.hear, extra: '' });
  else if (play && st.qi >= 0) lab.setState({ emo: '🌊', title: s.playT('AB'[st.queue[st.qi]]), lead: s.playL, body: '', extra: '' });
  else lab.setState({ emo: '🌊', title: q, lead: s.lead, body: '', extra: '' });
}
render();
