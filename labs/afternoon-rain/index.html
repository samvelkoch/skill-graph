    drawCloud(c, cx, by, sx, s, g, g * .25, 0);
    drawRain(c, cx - sx * .45, cx + sx * .45, by, y + h * .7, flyRain(i, cut), time, false, i * 50);
  }
  for (let i = 0; i < 34; i++) {
    const u = (i / 34 + time * .025) % 1, dens = 1 - cut * .8 * c01((u - .38) / .08);
    c.fillStyle = `rgba(255,255,255,${(.15 + .45 * dens) * .9})`; c.beginPath(); c.ellipse(x + w * (.04 + .92 * u), y + h * (.5 - .1 * Math.sin(u * Math.PI)) + Math.sin(time * .8 + i) * 4, 5, 3, 0, 0, 7); c.fill();
  }
  for (let j = 0; j < 16; j++) {
    const fx = .15 + .67 * hh(j), dens = fx > .42 ? 1 - cut * .9 : 1, ph = (time * .08 * (.7 + hh(j + 4) * .6) + hh(j + 9)) % 1;
    c.fillStyle = `rgba(255,255,255,${Math.sin(Math.PI * ph) * .5 * dens})`; c.beginPath(); c.ellipse(x + w * fx + Math.sin(ph * 6 + j) * 5, y + h * .66 - ph * h * .2, Math.max(0, 3 + ph * 4), Math.max(0, 5 + ph * 7), 0, 0, 7); c.fill();
  }
  for (let i = 0; i < 3; i++) { const n = Math.round(5 * flyRain(i, cut)); pill(c, n ? '💧'.repeat(n) : '–', x + w * [.3, .55, .78][i], y + h * .93, 'c', R); }
  pill(c, T[lang].fly.ocean, x + 8, y + h * .78, 'l', R); pill(c, T[lang].fly.mount, x + w - 8, y + h * .1, 'r', R);
  c.restore();
  c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(R.x, R.y, R.w, R.h, 18); c.stroke();
}

// --- the scene of every panel ------------------------------------------------------------------------------
function leafOf(m) {
  const L = LEAF[m];
  return m >= 9 ? { leaf: L, leafL: '#f2b04a', leafD: '#c45f1b' } : m < 4 ? { leaf: L, leafL: '#bfe58a', leafD: '#6fae45' } : { leaf: L, leafL: '#7bd07a', leafD: '#2f8a45' };
}
function dayScene(which) {
  const h = S.hour, t = T[lang];
  if (which === 'am') return { key: 'am', kind: 'amazon', label: t.places.am, hour: h, rise: 6, set: 18, alt: .93, temp: AM.temp(h), cloud: AM.cloud(h), rain: AM.rain(h),
    storm: Math.min(1, c01((AM.cloud(h) - .5) / .5) * .8 + AM.rain(h) * .2), mist: h < 10 ? c01((10 - h) / 4) * .6 : 0,
    vap: c01((h - 7.5) / 3) * (1 - c01((h - 16) / 3)), mm: mmAt(h), mmMax: 30, unit: 'mm', clock: clock(h) };
  return { key: 'bu', kind: 'bud', label: `${t.places.bu} · ${t.mo[6]}`, hour: h, rise: 5, set: 20.5, alt: .7, temp: BU.temp(h), cloud: .1, rain: 0, vap: .2 * c01((h - 8) / 3),
    mm: 0, mmMax: 30, unit: 'mm', clock: clock(h), ...leafOf(6) };
}
function yearScene(city, m, dt) {
  const man = city === 'am', T_ = man ? MAN_T[m] : BUD_T[m], R_ = man ? MAN_R[m] : BUD_R[m], len = man ? 12 : BLEN[m], rise = man ? 6 : 12.6 - len / 2;
  const cl = sm(city + 'C', man ? c01(.15 + R_ / 330 * .85) : c01(.12 + R_ / 330 * 1.1), dt, 3), tmp = sm(city + 'T', T_, dt, 3);
  const snow = man ? 0 : c01((4.5 - tmp) / 3);
  return { key: city, kind: man ? 'amazon' : 'bud', label: man ? T[lang].places.am : T[lang].places.bu, hour: rise + len * .42, rise, set: rise + len,
    alt: (90 - Math.abs((man ? -3 : 47.5) - DECL[m])) / 90, temp: tmp, cloud: cl, rain: sm(city + 'R', c01(R_ / 330) * (snow > .3 ? 1.6 : .95), dt, 3),
    storm: c01((cl - .55) / .45) * .6, mist: man ? .25 : 0, vap: man ? .75 : c01((tmp - 8) / 16) * .5, snow, mm: sm(city + 'M', R_, dt, 3), mmMax: 350, unit: 'mm',
    ...(man ? {} : leafOf(m)) };
}
const MODEL = { sw: { r: 1, cl: 1, vap: .9, t: 31, mm: 12 }, ww: { r: .3, cl: .25, vap: .35, t: 22, mm: 1.5 }, sd: { r: 0, cl: 0, vap: 0, t: 40, mm: 0 }, wd: { r: 0, cl: 0, vap: 0, t: 24, mm: 0 } };
const mixKey = () => (S.sun ? 's' : 'w') + (S.wet ? 'w' : 'd');
function modelScene(dt) {
  const k = mixKey(), M = MODEL[k], cl = sm('mc', M.cl, dt, 1.6);
  return { key: 'md', kind: 'model', label: S.wet ? T[lang].places.wet : T[lang].places.dry, hour: sm('mh', S.sun ? 12 : 8.8, dt, 2), rise: 6, set: 18, alt: sm('ma', S.sun ? .93 : .4, dt, 2),
    sunK: sm('mk', S.sun ? .9 : .15, dt, 2), temp: sm('mt', M.t, dt, 2), cloud: cl, rain: sm('mr', M.r, dt, 1.6), vap: sm('mv', M.vap, dt, 2), haze: sm('mz', k === 'sd' ? 1 : 0, dt, 1.5),
    storm: sm('ms', k === 'sw' ? .9 : k === 'ww' ? .25 : 0, dt, 1.6), mist: 0, wetT: sm('mw', S.wet ? 1 : 0, dt, 2), mm: sm('mm', M.mm, dt, 1.6), mmMax: 12, unit: 'mm/h', ...leafOf(6) };
}
function hotScenes(dt) {
  const x = S.secT, base = { rise: 6, set: 18, alt: .93, hour: 11.5, sunK: .8 };
  const cl = sm('hc', c01((x - 24) / 10), dt, 2), rn = sm('hr', c01((x - 31) / 6) * .9, dt, 2);
  return [{ key: 'h1', kind: 'amazon', label: T[lang].places.rf, ...base, temp: x, cloud: cl, rain: rn, storm: cl * .4, mist: 0, vap: c01((x - 22) / 10), mm: rn * 10, mmMax: 12, unit: 'mm' },
    { key: 'h2', kind: 'sahara', label: T[lang].places.sa, ...base, temp: x, cloud: 0, rain: 0, haze: c01((x - 24) / 16), mist: 0, vap: 0, mm: 0, mmMax: 12, unit: 'mm' }];
}
function rects(w, h, n) {
  const p = 10, g = 10;
  if (n === 1) return [{ x: p, y: p, w: w - 2 * p, h: h - 2 * p }];
  if (w >= 640) { const pw = (w - 2 * p - g) / 2; return [{ x: p, y: p, w: pw, h: h - 2 * p }, { x: p + pw + g, y: p, w: pw, h: h - 2 * p }]; }
  const ph = (h - 2 * p - g) / 2; return [{ x: p, y: p, w: w - 2 * p, h: ph }, { x: p, y: p + ph + g, w: w - 2 * p, h: ph }];
}

let lastKey = '';
function step(dt) {
  if (S.playing && lab.view === 'day') { S.hour = Math.min(21, S.hour + dt * 1.1); $('hr').value = S.hour; if (S.hour >= 21) { S.playing = false; render(); } }
  if (S.yq[1] !== null && S.yt < 1) S.yt = Math.min(1, S.yt + dt / 1.8);
  if (S.mplay && lab.view === 'year') { S.macc += dt; if (S.macc > .85) { S.macc = 0; if (S.month < 11) { S.month++; $('mo').value = S.month; } else { S.mplay = false; render(); } } }
  const key = `${lab.view}|${Math.round(S.hour * 4)}|${S.month}`;
  if (key !== lastKey) { lastKey = key; refresh(); }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  step(dt);
  const v = lab.view, sec = v === 'rain' ? S.sec : null, t = T[lang];
  if (v === 'rain' && sec !== 'hot') {
    const [r] = rects(w, h, 1);
    if (sec === 'fly') drawFly(c, r, time, dt); else drawScene(c, r, modelScene(dt), time, dt);
  } else if (v === 'rain') {
    const [ra, rb] = rects(w, h, 2), [oa, ob] = hotScenes(dt);
    drawScene(c, ra, oa, time, dt); drawScene(c, rb, ob, time, dt);
  } else if (v === 'day') {
    const [ra, rb] = rects(w, h, 2), a = dayScene('am');
    drawScene(c, ra, a, time, dt); drawScene(c, rb, dayScene('bu'), time, dt);
    drawCover(c, ra, sm('cov', S.guess === null ? 0 : 1, dt, 2.2), a.label, 72);
  } else {
    const [ra, rb] = rects(w, h, 2), cov = sm('ycov', S.yq[1] === null ? 0 : 1, dt, 2.2);
    [[ra, 'am', MAN_T, MAN_R], [rb, 'bu', BUD_T, BUD_R]].forEach(([r, city, tt, rr]) => {
      const sh = r.h * .47, rs = { x: r.x, y: r.y, w: r.w, h: sh }, rc = { x: r.x, y: r.y + sh + 6, w: r.w, h: r.h - sh - 6 };
      drawScene(c, rs, yearScene(city, S.month, dt), time, dt);
      drawChart(c, rc, tt, rr, S.month, S.yt);
      drawCover(c, rc, cov, t.year.hidden, 44);
    });
  }
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a === 'g') { S.guess = k; S.hour = 6; S.playing = true; $('hr').value = 6; (k === 'a' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'dplay') { if (S.hour >= 21) S.hour = 6; S.playing = !S.playing; sfx.click(); }
  else if (a === 'dagain') { S.guess = null; S.hour = 6; S.playing = false; $('hr').value = 6; sfx.click(); }
  else if (a === 'y') {
    const qi = S.yq[0] === null ? 0 : 1; S.yq[qi] = +b.dataset.i;
    if (qi === 1) { S.month = 0; S.mplay = true; S.macc = 0; S.yt = 0; $('mo').value = 0; (yScore() === 2 ? sfx.good : sfx.bad)(); showStage(); } else sfx.click();
  }
  else if (a === 'yplay') { if (S.month >= 11) S.month = 0; S.mplay = !S.mplay; S.macc = 0; $('mo').value = S.month; sfx.click(); }
  else if (a === 'yagain') { S.yq = [null, null]; S.yt = 0; S.month = 6; S.mplay = false; $('mo').value = 6; sfx.click(); }
  else if (a === 'sun') { S.sun = +k; sfx.click(); }
  else if (a === 'wet') { S.wet = +k; sfx.click(); }
  else if (a === 'cut') { S.cut = !S.cut; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.cut = false;
    if (lab.view !== 'rain') { lab.view = 'rain'; lab.renderChrome(); }
    sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, val = +ev.target.value;
  if (id === 'hr') { S.hour = val; S.playing = false; }
  else if (id === 'mo') { S.month = val; S.mplay = false; }
  else if (id === 'tp') S.secT = val;
  else return;
  render();
});

const yScore = () => (S.yq[0] === 1 ? 1 : 0) + (S.yq[1] === 0 ? 1 : 0);
const optBtns = (arr, act, picked, right) => arr.map(([k, label]) => `<button class="ar-opt${picked === undefined ? '' : k == right ? ' ar-good' : k == picked ? ' ar-bad' : ''}" ${picked === undefined ? `data-act="${act}" data-k="${k}" data-i="${k}"` : 'disabled'}>${esc(label)}</button>`).join('');

function renderCtl() {
  const t = T[lang], v = lab.view, sec = v === 'rain' ? S.sec : null;
  document.body.dataset.v = sec === 'hot' ? 'hot' : v;
  $('vDay').style.display = v === 'day' ? '' : 'none'; $('vYear').style.display = v === 'year' ? '' : 'none'; $('vRain').style.display = v === 'rain' ? '' : 'none';
  // day
  const g = S.guess;
  $('dQ').textContent = t.day.q;
  $('dOpts').innerHTML = optBtns(['m', 'a', 'n', 'x'].map((k) => [k, t.day.opts[k]]), 'g', g === null ? undefined : g, 'a');
  $('dV').innerHTML = g === null ? '' : `<b class="${g === 'a' ? 'ok' : 'no'}">${esc(g === 'a' ? t.right : t.no)}</b>${esc(t.day.when)}`;
  $('dPlay').style.display = g === null ? 'none' : '';
  $('dBtn').textContent = S.playing ? t.pause : t.play; $('dAgain').textContent = t.again;
  const a = (6 + 0) , p1 = (14 - 6) / 15 * 100, p2 = (16.3 - 6) / 15 * 100;
  $('hr').style.setProperty('--track', `linear-gradient(90deg, #3a4468 ${p1}%, #4ea8ff ${p1}%, #4ea8ff ${p2}%, #3a4468 ${p2}%)`); void a;
  $('hr').value = S.hour;
  // year
  const qi = S.yq[0] === null ? 0 : S.yq[1] === null ? 1 : 2, done = qi === 2;
  $('yQ').textContent = done ? '' : qi === 0 ? t.year.q1 : t.year.q2; $('yQ').style.display = done ? 'none' : '';
  $('yOpts').innerHTML = done ? '' : optBtns((qi === 0 ? t.year.o1 : t.year.o2).map((l, i) => [i, l]), 'y');
  $('yV').innerHTML = done ? `<b class="${yScore() === 2 ? 'ok' : 'no'}">${esc(t.year.score[yScore()])}</b>${esc(t.year.res1)}<br>${esc(t.year.res2)}` : '';
  $('yPlay').style.display = done ? '' : 'none';
  $('yBtn').textContent = S.mplay ? t.pause : t.play; $('yAgain').textContent = t.again; $('mo').value = S.month;
  // rain
  $('lSun').textContent = t.rain.sun; $('lWet').textContent = t.rain.water;
  const chips = (act, arr, cur) => arr.map((l, i) => `<button class="chip ${cur === i ? 'on' : ''}" data-act="${act}" data-k="${i}">${esc(l)}</button>`).join('');
  $('rSun').innerHTML = chips('sun', t.rain.suns, S.sun); $('rWet').innerHTML = chips('wet', t.rain.waters, S.wet);
  $('mix').style.display = sec ? 'none' : ''; $('sFly').style.display = sec === 'fly' ? '' : 'none'; $('sHot').style.display = sec === 'hot' ? '' : 'none';
  $('cutB').textContent = S.cut ? t.fly.back : t.fly.cut; $('lTp').textContent = t.hot.t; $('tp').value = S.secT; $('tpV').textContent = `${S.secT} °C`;
  const open = secret.unlocked();
  $('secRow').innerHTML = [['fly', '🌊'], ['hot', '🔥']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
}

// readout, state card and facts: cheap, also called while the day or the year plays
function refresh() {
  const t = T[lang], v = lab.view, sec = v === 'rain' ? S.sec : null;
  if (v === 'day') {
    const h = S.hour, g = S.guess, tb = Math.round(BU.temp(h));
    lab.setGlow('rgba(70, 150, 230, .28)');
    if (g === null) {
      lab.setReadout(clock(6), '', '', '#4ea8ff');
      lab.setState({ emo: '🤔', title: t.day.q, lead: t.day.lead0, body: t.day.body0, extra: '' });
    } else {
      const i = h < 10.5 ? 0 : h < 12.5 ? 1 : h < 14 ? 2 : h < 16.3 ? 3 : h < 19 ? 4 : 5, [emo, title, lead] = t.day.ph[i];
      lab.setReadout(clock(h), t.day.sub(Math.round(AM.temp(h)), Math.round(mmAt(h)), tb), '', '#4ea8ff');
      lab.setState({ emo, title, lead, body: t.day.bud(tb), extra: h >= 16.3 ? esc(t.day.wc) : '' });
    }
    lab.setFacts([{ emo: '🌧️', text: t.facts.day, src: SRC.day }]);
  } else if (v === 'year') {
    const m = S.month, qi = S.yq[0] === null ? 0 : 1;
    lab.setGlow('rgba(95, 190, 150, .24)');
    if (S.yq[1] === null) {
      lab.setReadout('?', '', '', '#5fbe96');
      lab.setState({ emo: '🤔', title: qi === 0 ? t.year.q1 : t.year.q2, lead: t.year.lead0, body: t.year.body0, extra: '' });
    } else {
      const si = m === 11 || m < 2 ? 0 : m < 5 ? 1 : m < 8 ? 2 : 3;
      lab.setReadout(t.mo[m], t.year.sub(MAN_T[m], MAN_R[m], BUD_T[m], BUD_R[m]), '', '#5fbe96');
      lab.setState({ emo: t.year.semo[si], title: t.mo[m], lead: t.year.lead(MAN_T[m], MAN_R[m]), body: t.year.body(t.year.seasons[si], BUD_T[m], BUD_R[m]), extra: esc(t.year.avg) });
    }
    lab.setFacts([{ emo: '🌍', text: t.facts.year, src: SRC.year }]);
  } else if (sec === 'fly') {
    const cut = S.cut, [title, lead] = cut ? t.fly.off : t.fly.on, n = [0, 1, 2].map((i) => Math.round(5 * flyRain(i, cut ? 1 : 0)));
    lab.setGlow('rgba(95, 168, 160, .28)');
    lab.setReadout(n.map((x) => '💧'.repeat(x) || '–').join(' · '), t.fly.sub, '', '#5fa8a0');
    lab.setState({ emo: cut ? '🪓' : '🌊', title, lead, body: t.fly.body, extra: '' });
    lab.setFacts([{ emo: '🌳', text: t.facts.rain, src: SRC.rain }]);
  } else if (sec === 'hot') {
    lab.setGlow('rgba(240, 170, 80, .28)');
    lab.setReadout(`${S.secT} °C`, t.hot.sub, '', '#f0aa50');
    lab.setState({ emo: '🔥', title: t.hot.title, lead: t.hot.lead(S.secT), body: '', extra: '' });
    lab.setFacts([{ emo: '🌳', text: t.facts.rain, src: SRC.rain }]);
  } else {
    const k = mixKey(), M = MODEL[k], [emo, title, lead] = t.rain.st[k];
    lab.setGlow(k === 'sw' ? 'rgba(80, 110, 200, .34)' : k === 'sd' ? 'rgba(240, 170, 80, .3)' : 'rgba(95, 168, 160, .26)');
    lab.setReadout(String(M.mm), t.rain.sub, t.rain.lv[M.mm === 0 ? 0 : M.mm < 5 ? 1 : 2], '#4ea8ff');
    lab.setState({ emo, title, lead, body: t.rain.body, extra: '' });
    lab.setFacts([{ emo: '🌳', text: t.facts.rain, src: SRC.rain }]);
  }
}
function render() { renderCtl(); lastKey = ''; refresh(); }
render();
</script>
