  if (!ans) { lab.setReadout('?', '', '', '#3ddc97'); lab.setState({ emo: '🎭', title: t.sureAsk, lead: '', body: '', extra: '' }); }
  else { lab.setReadout(`${esc(top.w)} ${Math.round(top.p * 100)} %`, '', t.mostCommon, '#3ddc97'); const st = t.st.sure; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' }); }
  lab.setFacts(ans ? t.facts.sure : []);
}
startGame(0);
render();
</script>
