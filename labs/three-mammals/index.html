      c.restore();
    });
    pill(c, wt.regions[r], px, py + 17, w, { weight: 700, bg: 'rgba(10,12,22,.75)' });
  }
}

canvasLoop($('cv'), (c, w, h, dt) => {
  const v = lab.view;
  if (v === 'born') { drawBorn(c, w, h, dt); shGeo = null; whGeo = null; }
  else if (v === 'share') { drawShare(c, w, h); whGeo = null; }
  else { drawWhere(c, w, h); shGeo = null; }
});

// --- taps on the canvas -------------------------------------------------------------------------------------
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'share' && shGeo) {
    const g = shGeo, S2 = S.sh;
    if (y >= g.top && y < g.ry && x >= g.cx0 && !S2.checked) { // a header symbol: the whole column
      const f = Math.floor((x - g.cx0) / g.cw); if (f < 0 || f > 5) return;
      const all = ANIMALS.every((_, rr) => S2.tick[rr * 6 + f]);
      ANIMALS.forEach((_, rr) => { S2.tick[rr * 6 + f] = !all; }); sfx.click(); render(); return;
    }
    if (y >= g.ry && y < g.ry + 5 * g.rh) {
      const rr = Math.floor((y - g.ry) / g.rh), f = Math.floor((x - g.cx0) / g.cw);
      if (S2.checked) { if (x < g.cx0) { S2.sel = S2.sel === rr ? -1 : rr; sfx.tick(); render(); } return; }
      if (f >= 0 && f < 6) { S2.tick[rr * 6 + f] = !S2.tick[rr * 6 + f]; sfx.tick(); render(); }
      else if (x < g.cx0) { const all = [0, 1, 2, 3, 4, 5].every((ff) => S2.tick[rr * 6 + ff]); for (let ff = 0; ff < 6; ff++) S2.tick[rr * 6 + ff] = !all; sfx.click(); render(); }
    }
  } else if (lab.view === 'where' && whGeo && !S.wh.checked) {
    const { s, ox, oy } = whGeo, px = (x - ox) / s, py = (y - oy) / s;
    // nearest-region hit test: the exact shape first, then a generous radius around the anchors
    let hit = REGIONS.find((rg) => hitCtx.isPointInPath(PATHS[rg], px, py));
    if (!hit) {
      let best = 1e9;
      for (const rg of REGIONS) { const [ax, ay] = proj(ANCHOR[rg]), dd = Math.hypot((ax - px) * s, (ay - py) * s); if (dd < 34 && dd < best) { best = dd; hit = rg; } }
    }
    if (!hit) return;
    const g = S.wh.group ? 'marsu' : 'mono';
    S.wh.mark[g][hit] = !S.wh.mark[g][hit]; sfx.click(); render();
  }
});

// --- controls -------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'opt') { S.b.guess = +b.dataset.i; (S.b.guess === 0 ? sfx.good : sfx.snap)(); showStage(); }
  else if (a === 'again') { S.b.guess = null; S.b.wipe = 0; S.sec.echidna = S.sec.elephant = false; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec[b.dataset.k] = !S.sec[b.dataset.k]; sfx.click();
  } else if (a === 'sCheck') {
    S.sh.checked = true; S.sh.sel = -1;
    const hits = S.sh.tick.filter((v, i) => v && TRUTH[Math.floor(i / 6)][i % 6]).length, extra = S.sh.tick.filter((v, i) => v && !TRUTH[Math.floor(i / 6)][i % 6]).length;
    (extra === 0 && hits === NTRUE ? sfx.good : sfx.snap)(); showStage();
  } else if (a === 'sClear') { S.sh.tick.fill(false); S.sh.checked = false; S.sh.sel = -1; sfx.click(); }
  else if (a === 'wGroup') { S.wh.group = +b.dataset.g; sfx.tick(); }
  else if (a === 'wCheck') { S.wh.checked = true; sfx.snap(); showStage(); }
  else if (a === 'wClear') { S.wh.mark = { mono: {}, marsu: {} }; S.wh.checked = false; sfx.click(); }
  render();
});
$('bDay').addEventListener('input', (ev) => { S.b.day = +ev.target.value; render(); });

// --- one render per change: controls, readout and the state card -----------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v; document.body.dataset.g = v === 'born' && S.b.guess === null ? '0' : '1';
  $('sCheck').textContent = ''; $('sClear').textContent = ''; $('wCheck').textContent = ''; $('wClear').textContent = ''; // one visible label per button
  $('vBorn').hidden = v !== 'born'; $('vShare').hidden = v !== 'share'; $('vWhere').hidden = v !== 'where';
  if (v === 'born') renderBorn(t); else if (v === 'share') renderShare(t); else renderWhere(t);
}

function renderBorn(t) {
  const B = S.b, bt = t.born, shown = B.guess !== null;
  lab.setGlow('rgba(240, 162, 92, .24)');
  $('bPre').hidden = shown; $('bPost').hidden = !shown;
  if (!shown) {
    $('bQ').textContent = bt.q;
    $('bOpts').innerHTML = bt.opts.map((o, i) => `<button class="tm-opt" data-act="opt" data-i="${i}">${esc(o)}</button>`).join('');
    lab.setReadout('?', bt.ask, '', '#f0a25c');
    lab.setState({ emo: '🦘', title: bt.q, lead: bt.askLead, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const maxD = S.sec.elephant ? 730 : 548, d = clamp(B.day, 0, maxD); B.day = d;
  const sl = $('bDay'); if (+sl.max !== maxD) sl.max = maxD; if (+sl.value !== d) sl.value = d;
  sl.setAttribute('aria-label', bt.dayLbl);
  $('bLbl').textContent = bt.dayLbl;
  $('bAgain').textContent = bt.again;
  const open = secret.unlocked();
  $('bSec').innerHTML = ['echidna', 'elephant'].map((k) => `<button class="chip secret tm-chip ${open ? 'open' : ''} ${S.sec[k] ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'echidna' ? '🦔' : '🐘'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const m = Math.round(d / MD), keys = bornKeys();
  lab.setReadout(bt.val(d), bt.sub(d, m), `🦘 ${t.stage[stageAt('kangaroo', d)]}`, '#f0a25c');
  const rows = keys.map((k) => { const s = stageAt(k, d); return `<div class="tm-st"><i style="background:${SEGCOL[s]}"></i><span><b>${esc(t.names[k])}</b> ${esc(t.stage[s])}</span></div>`; }).join('');
  const notes = ['echidna', 'elephant'].filter((k) => S.sec[k]).map((k) => `<div class="tm-note">${esc(t.secretNotes[k])}</div>`).join('');
  lab.setState({ emo: '🦘', title: bt.title, lead: bt.lead(B.guess === 0, bt.gshort[B.guess]), body: bt.body(KANG_M, POUCH_MONTHS, HORSE_MONTHS), extra: `<div class="tm-st"><span>${esc(bt.rulerNote)}</span></div>` + rows + notes });
  lab.setFacts(t.facts.born);
}

function renderShare(t) {
  const S2 = S.sh, st = t.share, n = S2.tick.filter(Boolean).length;
  lab.setGlow('rgba(78, 168, 255, .22)');
  $('sCheck').textContent = st.check; $('sClear').textContent = st.clear;
  $('sCheck').disabled = S2.checked || n === 0;
  $('sTip').textContent = S2.checked ? st.hint : st.body;
  if (!S2.checked) {
    lab.setReadout(`${n}`, st.pre(n), '', '#4ea8ff');
    lab.setState({ emo: '✅', title: st.q, lead: st.lead, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const hits = S2.tick.filter((v, i) => v && TRUTH[Math.floor(i / 6)][i % 6]).length, extra = S2.tick.filter((v, i) => v && !TRUTH[Math.floor(i / 6)][i % 6]).length;
  const shared = st.feats.filter((_, f) => SHARED_ALL[f]);
  lab.setReadout(`${hits}/${NTRUE}`, st.right(hits, NTRUE), extra ? st.extra(extra) : '', '#3ddc97');
  const note = S2.sel >= 0 ? `<div class="tm-note">${esc(st.notes[ANIMALS[S2.sel]])}</div>` : '';
  lab.setState({ emo: '🔗', title: st.title(shared.length), lead: st.lead2(shared.map((x) => x.toLowerCase()).join(', ')), body: st.body2, extra: note });
  lab.setFacts(t.facts.share);
}

function renderWhere(t) {
  const W = S.wh, wt = t.where, n = Object.values(W.mark.mono).filter(Boolean).length + Object.values(W.mark.marsu).filter(Boolean).length;
  lab.setGlow('rgba(56, 201, 181, .22)');
  $('wGroups').innerHTML = wt.groups.map((g, i) => `<button class="chip tm-chip ${W.group === i ? 'on' : ''}" data-act="wGroup" data-g="${i}"${W.checked ? ' disabled' : ''}>${esc(g)}</button>`).join('');
  $('wCheck').textContent = wt.check; $('wClear').textContent = wt.clear;
  $('wCheck').disabled = W.checked || n === 0;
  if (!W.checked) {
    lab.setReadout(`${n}`, wt.pre(n), '', '#38c9b5');
    lab.setState({ emo: '🗺️', title: wt.q, lead: wt.lead, body: wt.body, extra: '' });
    lab.setFacts([]);
    return;
  }
  let hits = 0, extra = 0;
  for (const g of ['mono', 'marsu']) for (const r of REGIONS) { if (W.mark[g][r]) { if (WTRUTH[g][r]) hits++; else extra++; } }
  lab.setReadout(`${hits}/${WTOTAL}`, wt.right(hits), extra ? wt.extra(extra) : '', '#3ddc97');
  lab.setState({ emo: '🌏', title: wt.title(hits), lead: wt.lead2, body: wt.body2, extra: '' });
  lab.setFacts(t.facts.where);
}
render();
</script>
