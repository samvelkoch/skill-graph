let ac = null, drone = null;

}
function pluck(freq, vol = 0.12, dur = 0.5) {
  if (!snd()) return;

    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();

  } catch { /* silent */ }
}

function droneOn() {
  if (!snd() || drone) return;
  const a = actx(); if (!a) return;
  try {
    const t = a.currentTime, g = a.createGain(), o1 = a.createOscillator(), o2 = a.createOscillator();
    o1.type = 'sine'; o1.frequency.value = 110; o2.type = 'sine'; o2.frequency.value = 164.8;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.04, t + 0.4);
    o1.connect(g); o2.connect(g); g.connect(a.destination); o1.start(t); o2.start(t);

}

function resetRun() { S.R = null; S.attn = 1; S.mem = 1; droneOff(); }
function startRun() {

}
function openLine(R) {
  const id = GAPS[R.li];

  if (id) R.gapN++;

}
function nextLine(R) {
  R.li++;
  if (R.li >= 14) { finishRun(R); return; }

}
function startThink(R, late) {
  R.st = 'think'; R.think = 3; R.pauses++; if (late) R.gap.late = true;

  updateUI();
}
function onBeat(R) {
  if (R.st === 'count') {
    R.cnt++;
    if (R.cnt >= 4) { R.st = 'sing'; R.li = 0; R.bi = 0; openLine(R); note(0); } else note(R.cnt);
    return;
  }
  if (R.st === 'sing') {
    R.bi++; S.mem = Math.min(1, S.mem + 0.02);
    if (R.bi >= 4) { if (R.gap && !R.gap.filled) startThink(R, true); else nextLine(R); } else note(R.bi);

  if (R.st === 'think') {

}
function stepRun(dt) {

$('ctrlBody').addEventListener('click', (ev) => {

  else if (act === 'invent') inventTap();

  else if (act === 'pick') { const k = b.dataset.k; if (S.picks.has(k)) S.picks.delete(k); else S.picks.add(k); sfx.tick(); render(); }

  }
  else if (act === 'secback') { S.sec = null; S.night.run = false; droneOff(); sfx.click(); render(); }
  else if (act === 'nrun') {
    const n = S.night;
    if (n.lines >= 15700) n.lines = 0;
    n.run = !n.run; if (n.run) droneOn(); else droneOff();
    sfx.click(); renderNight(T[lang], $('esFire'));
  }
  else if (act === 'nreset') { S.night.lines = 0; S.night.run = false; droneOff(); sfx.click(); renderNight(T[lang], $('esFire')); }
  else if (act === 'mp') machTap(+b.dataset.i);

});

  }
  if (m.over) {
    const age = S.t - m.over.t0, ex = Math.max(0, m.over.n - (6 - m.over.at));
    for (let k = 0; k < Math.min(ex, 9); k++) {
      const px = slotX(5) + sw + 8 + k * 10, py = y0 + 14 + 120 * age * age * 0.5 + (k % 2) * 6;
      c.globalAlpha = clamp(1 - age / 1.3, 0, 1); c.fillStyle = '#e8402a'; c.strokeStyle = '#6b1b10'; c.beginPath(); c.arc(Math.min(px, SX + SW - 4), py, 4.5, 0, 7); c.fill(); c.stroke();
    }
    c.globalAlpha = 1;
  }
  c.fillStyle = '#4a3418'; c.font = fnt(13, 800); c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(mh.left(6 - m.n), SX + SW / 2, SY + 66);
}

// --- the world map ----------------------------------------------------------------------------------------
const LAND = [
  [[70, 92], [96, 70], [130, 72], [150, 48], [178, 28], [222, 26], [300, 40], [352, 70], [358, 150], [330, 190], [290, 204], [262, 226], [236, 216], [214, 190], [196, 198], [188, 176], [176, 160], [150, 166], [120, 150], [96, 130], [70, 120]],
  [[58, 214], [108, 198], [150, 202], [190, 206], [212, 224], [216, 264], [178, 294], [130, 294], [86, 264], [56, 240]],
];
function worldMap(c, w, h, dt, time) {
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  const sg = c.createLinearGradient(0, 0, 0, h); sg.addColorStop(0, '#0b2742'); sg.addColorStop(1, '#081628');
  c.fillStyle = sg; c.fillRect(0, 0, w, h);
  c.save(); c.translate(ox, oy); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  c.strokeStyle = 'rgba(140,190,255,.09)'; c.lineWidth = 1;
  for (let i = 0; i < 6; i++) { c.beginPath(); c.moveTo(-500, 30 + i * 50); c.lineTo(860, 30 + i * 50); c.stroke(); }
  for (let i = 0; i < 9; i++) { c.beginPath(); c.moveTo(i * 45, -300); c.lineTo(i * 45, 600); c.stroke(); }
  c.strokeStyle = 'rgba(160,210,255,.12)'; c.lineWidth = 1.5;
  for (const [wx, wy] of [[30, 40], [40, 160], [320, 240], [280, 275], [20, 280], [330, 100]]) { c.beginPath(); c.moveTo(wx, wy); c.quadraticCurveTo(wx + 7, wy - 5, wx + 14, wy); c.quadraticCurveTo(wx + 21, wy + 5, wx + 28, wy); c.stroke(); }
  for (const poly of LAND) {
    const path = () => { c.beginPath(); poly.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); };
    path(); c.strokeStyle = 'rgba(255,214,150,.16)'; c.lineWidth = 9; c.stroke();
    const lg = c.createLinearGradient(60, 30, 330, 290); lg.addColorStop(0, '#e6b475'); lg.addColorStop(1, '#a8703c');
    path(); c.fillStyle = lg; c.fill(); c.strokeStyle = '#6b4220'; c.lineWidth = 1.8; c.stroke();
  }
  c.fillStyle = 'rgba(255,240,200,.18)'; // soft hills
  for (const [hx, hy] of [[140, 60], [300, 100], [230, 130], [120, 130], [250, 40], [150, 250], [100, 210]]) { c.beginPath(); c.moveTo(hx - 12, hy + 6); c.lineTo(hx, hy - 6); c.lineTo(hx + 12, hy + 6); c.closePath(); c.fill(); }
  for (const e of EPICS) {
    const sel = S.pin === e.id, seen = S.seen.has(e.id), pu = 0.5 + 0.5 * Math.sin(time * 3 + e.x);
    const col = seen ? '#6ee7a8' : '#ffd36e';
    const gr = c.createRadialGradient(e.x, e.y, 2, e.x, e.y, 24); gr.addColorStop(0, seen ? 'rgba(110,231,168,.55)' : `rgba(255,211,110,${0.45 + 0.25 * pu})`); gr.addColorStop(1, 'rgba(255,211,110,0)');
    c.fillStyle = gr; c.beginPath(); c.arc(e.x, e.y, 24, 0, 7); c.fill();
    if (sel) { c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(e.x, e.y, 12 + pu * 2, 0, 7); c.stroke(); }
    const pg = c.createRadialGradient(e.x - 2, e.y - 2, 1, e.x, e.y, 8); pg.addColorStop(0, '#fff6d6'); pg.addColorStop(1, col);
    c.fillStyle = pg; c.strokeStyle = '#4a3010'; c.lineWidth = 1.5; c.beginPath(); c.arc(e.x, e.y, sel ? 9 : 7.5, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(e.x - 2.2, e.y - 2.4, 1.6, 0, 7); c.fill();
  }
  if (S.pin) {
    const e = EPICS.find((x) => x.id === S.pin), name = T[lang].wd.epics[S.pin][0];
    const fs = Math.max(13, 12 / s); c.font = `800 ${fs}px Nunito, sans-serif`;
    const tw = c.measureText(name).width + 16, px = clamp(e.x, tw / 2 + 4, W - tw / 2 - 4), py = e.y > 60 ? e.y - 26 : e.y + 28;
    pill(c, name, px, py, `800 ${fs}px Nunito, sans-serif`);
  }
  c.restore();
}
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'world') return;
  const r = $('cv').getBoundingClientRect(), s = Math.min(r.width / W, r.height / H), ox = (r.width - W * s) / 2, oy = (r.height - H * s) / 2;
  const x = (ev.clientX - r.left - ox) / s, y = (ev.clientY - r.top - oy) / s;
  let best = null, bd = 26;
  for (const e of EPICS) { const d = Math.hypot(e.x - x, e.y - y); if (d < bd) { bd = d; best = e; } }
  if (best) { S.pin = best.id; S.seen.add(best.id); sfx.snap(); pluck(SCALE[(best.x >> 3) % 6], 0.12, 0.5); render(); }
});

// --- main loop --------------------------------------------------------------------------------------------
function updateNight(dt) {
  const n = S.night; if (!n.run) return;
  const before = Math.floor(n.lines / 1000);
  n.lines = Math.min(15700, n.lines + 450 * dt);
  const after = Math.floor(n.lines / 1000);
  if (after !== before) { for (let i = 0; i < 40; i++) sparks.push({ x: 184 + (Math.random() - 0.5) * 30, y: 236, vx: (Math.random() - 0.5) * 90, vy: -(40 + Math.random() * 90), life: 1 + Math.random(), age: 0 }); pluck(SCALE[after % 6] * 2, 0.1, 0.8); }
  if (n.lines >= 15700) { n.run = false; droneOff(); sfx.good(); renderNight(T[lang], $('esFire')); return; }
  if (after !== before || Math.floor(n.lines) % 50 === 0 || true) nightUI(T[lang]);
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  S.t += dt;
  if (lab.view === 'fire' && !S.sec) stepRun(dt);
  if (lab.view === 'fire' && S.sec === 'night') updateNight(dt);
  const R = S.R;
  let tgt = 1;
  if (S.sec === 'night') { const fr = (S.night.lines % 1000) / 1000; tgt = 1 - 0.7 * fr; if (S.night.lines >= 15700) tgt = 0.35; }
  else if (R && R.st === 'think') tgt = 0.4; else if (R && R.st === 'done') tgt = 0.85;
  S.fireLvl += (tgt - S.fireLvl) * Math.min(1, dt * 3);
  if (lab.view === 'world') worldMap(c, w, h, dt, time); else scene(c, w, h, dt, time);
});
render();
</script>
