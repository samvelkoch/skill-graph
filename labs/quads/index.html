  rectangle: [[1, 1.5], [7, 1.5], [7, 4.5], [1, 4.5]],

const ROUNDS = [
  [[2, 1], [6, 1], [6, 5], [2, 5]],

  [[1.2, 4.6], [4.6, 4.6], [6.3, 1.656], [2.9, 1.656]],

  [[1, 1], [6, 0], [7, 4], [3, 5.5]],
];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const len = (v) => Math.hypot(v[0], v[1]);
const cr = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
const segX = (a, b, c, d) => cr(a, b, c) * cr(a, b, d) < 0 && cr(c, d, a) * cr(c, d, b) < 0;
const area = (P) => Math.abs(P.reduce((s, p, i) => { const q = P[(i + 1) % 4]; return s + p[0] * q[1] - q[0] * p[1]; }, 0)) / 2;
const validShape = (P) => !segX(P[0], P[1], P[2], P[3]) && !segX(P[1], P[2], P[3], P[0]) && area(P) >= 1
  && [0, 1, 2, 3].every((i) => len(sub(P[(i + 1) % 4], P[i])) >= 0.5);
// which rules a quadrilateral meets: parallel within 3 degrees, right within 3 degrees, equal sides within 0.3 unit
function props(P) {
  const e = [0, 1, 2, 3].map((i) => sub(P[(i + 1) % 4], P[i])), l = e.map(len);
  const par = (i, j) => Math.abs(e[i][0] * e[j][1] - e[i][1] * e[j][0]) / ((l[i] * l[j]) || 1) <= SIN3 && e[i][0] * e[j][0] + e[i][1] * e[j][1] < 0;
  const right = [0, 1, 2, 3].map((i) => { const a = (i + 3) % 4; return Math.abs(e[a][0] * e[i][0] + e[a][1] * e[i][1]) / ((l[a] * l[i]) || 1) <= SIN3; });
  const par2 = [par(0, 2), par(1, 3)], eq = Math.max(...l) - Math.min(...l) <= 0.3;
  const para = par2[0] && par2[1], rect = para && right.every(Boolean), rhomb = para && eq, square = rect && rhomb;
  return { par: par2, right, eq, on: [true, para, rect, rhomb, square] };
}

};

function drawMarks(c, q, pr, M, hidden, g) {
  const unit = (v) => { const l = len(v) || 1; return [v[0] / l, v[1] / l]; };
  const e = [0, 1, 2, 3].map((i) => sub(q[(i + 1) % 4], q[i])), m = clamp(g.u * 0.3, 9, 14);

    c.globalAlpha = a; c.beginPath();
    c.moveTo(v[0] + pa[0] * m, v[1] + pa[1] * m); c.lineTo(v[0] + (pa[0] + nb[0]) * m, v[1] + (pa[1] + nb[1]) * m); c.lineTo(v[0] + nb[0] * m, v[1] + nb[1] * m);

function drawTree(c, g, modes, dt, t) {

  c.save(); c.lineCap = 'round';
  for (const [a, b] of EDGES) {
    const A = P(a), B = P(b), x0 = A.x, y0 = A.y + A.h / 2, x1 = B.x, y1 = B.y - B.h / 2;
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 2; c.stroke();
    const la = Math.min(S.cards[b].litA, S.cards[a].litA);
    if (la > 0.02) {
      c.save(); c.globalAlpha = la; c.shadowColor = 'rgba(255,190,90,.8)'; c.shadowBlur = 10;
      c.strokeStyle = modes[b] === 'ok' ? '#6fe8b4' : GOLD; c.lineWidth = 3; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); c.restore();
    }
  }
  c.restore();
  modes.forEach((m, i) => drawCard(c, g, i, m, t, m === 'miss' ? lang_.alsoTag : ''));
}

function drawCover(c, g, amt) {
  if (amt <= 0.001) return;
  const x = 8, y = g.ty0 - 2, w = g.w - 16, h = g.ty1 - y + 4;
  c.save(); c.beginPath(); c.rect(0, y - 4, g.w, h + 8); c.clip();
  c.translate(0, -(1 - amt) * (h + 14));
  rr(c, x, y, w, h, 16);
  const gr = c.createLinearGradient(x, y, x + w, y + h); gr.addColorStop(0, '#2d3558'); gr.addColorStop(1, '#171d36');
  c.fillStyle = gr; c.fill(); c.strokeStyle = 'rgba(130,145,190,.45)'; c.lineWidth = 1.5; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.07)';
  for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(x + w * (0.12 + i * 0.152), y + h * (i % 2 ? 0.3 : 0.7), 14, 0, 7); c.fill(); }
  c.fillStyle = '#e7ebfa'; c.font = '900 56px Nunito, system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('?', g.w / 2, y + h / 2 + 2);
  c.restore();
}

// --- the A-series paper secret ----------------------------------------------------------------------------
function drawPaper(c, w, h, t) {
  const el = t - S.paperT0;
  c.save();
  rr(c, 8, 8, w - 16, h - 16, 18);
  const bg = c.createLinearGradient(0, 0, w, h); bg.addColorStop(0, '#1d2540'); bg.addColorStop(1, '#10152a');
  c.fillStyle = bg; c.fill(); c.strokeStyle = 'rgba(130,145,190,.4)'; c.lineWidth = 1.5; c.stroke();
  c.clip();
  const SQ = Math.SQRT1_2, w0 = Math.min(w * 0.56, (h - 90) * 0.9 / 1.4142), ax = (w - w0) / 2, ay = h - 54;
  const dims = (k) => [w0 * Math.pow(SQ, k), w0 * Math.pow(SQ, k) * 1.4142];
  const names = ['A4', 'A5', 'A6', 'A7'], sizes = ['210 × 297', '148 × 210', '105 × 148', '74 × 105'];
  const fills = [['#fbf6e8', '#e8dfc4'], ['#c9ecdc', '#9ed3bc'], ['#ffe1b8', '#f2bd80'], ['#ffc2d1', '#f08fab']];
  const T0 = 0.9, STEP = 2.2;
  const sheet = (k, x0, y0, ww, hh, alpha = 1) => {
    c.save(); c.globalAlpha = alpha;
    c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 10; c.shadowOffsetY = 3;
    const gr = c.createLinearGradient(x0, y0, x0 + ww, y0 + hh); gr.addColorStop(0, fills[k][0]); gr.addColorStop(1, fills[k][1]);
    c.fillStyle = gr; c.fillRect(x0, y0, ww, hh); c.shadowColor = 'transparent';
    c.strokeStyle = 'rgba(60,45,20,.55)'; c.lineWidth = 1.5; c.strokeRect(x0, y0, ww, hh); c.restore();
  };
  const label = (k) => {
    const [ww, hh] = dims(k); c.font = '900 13px Nunito, system-ui, sans-serif'; c.fillStyle = '#3b2a10'; c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText(names[k], ax + 7, ay - hh + 14);
  };
  let done = 0, last = 0;
  for (let k = 0; k < 3; k++) if (el >= T0 + k * STEP + 1.7) done = k + 1;
  const sh = done, [sw, shh] = dims(sh);
  for (let k = 0; k <= done; k++) { const [ww, hh] = dims(k); sheet(k, ax, ay - hh, ww, hh); }
  for (let k = 0; k <= done; k++) label(k);
  const step = Math.floor((el - T0) / STEP);
  if (step >= 0 && step < 3 && step === done) { // fold the current sheet in half
    const lt = el - T0 - step * STEP, [cw, chh] = dims(step), [nw] = dims(step + 1);
    const c0 = [ax + cw / 2, ay - chh / 4], c1 = [ax + nw / 2, ay - cw / 2];
    if (lt < 0.7) { // dashed fold line and the flap, pulsing
      c.save(); c.setLineDash([7, 5]); c.strokeStyle = '#c0392b'; c.lineWidth = 2; c.beginPath(); c.moveTo(ax - 6, ay - chh / 2); c.lineTo(ax + cw + 6, ay - chh / 2); c.stroke(); c.restore();
      c.save(); c.globalAlpha = 0.25 + 0.2 * Math.sin(lt * 12); c.fillStyle = '#ffd166'; c.fillRect(ax, ay - chh / 2, cw, chh / 2); c.restore();
    } else if (lt < 1.7) {
      const e = ease(clamp01((lt - 0.7) / 1.0)), cx = lerp(c0[0], c1[0], e), cy = lerp(c0[1], c1[1], e);
      c.save(); c.translate(cx, cy); c.rotate(-Math.PI / 2 * e);
      c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 12; c.shadowOffsetY = 4;
      const [fa, fb] = fills[step + 1], gr = c.createLinearGradient(-cw / 2, -chh / 4, cw / 2, chh / 4); gr.addColorStop(0, fa); gr.addColorStop(1, fb);
      c.fillStyle = gr; c.fillRect(-cw / 2, -chh / 4, cw, chh / 2); c.shadowColor = 'transparent';
      c.strokeStyle = 'rgba(60,45,20,.6)'; c.lineWidth = 1.5; c.strokeRect(-cw / 2, -chh / 4, cw, chh / 2); c.restore();
    }
  }
  last = Math.min(3, done);
  // the diagonal: every nested sheet has its corner on one line
  const dg = clamp01((el - (T0 + 3 * STEP + 0.1)) / 1.0);
  if (dg > 0) {
    const [fw, fh] = dims(0), ex = ax + fw * ease(dg), ey = ay - fh * ease(dg);
    c.save(); c.setLineDash([8, 5]); c.strokeStyle = '#c0392b'; c.lineWidth = 2.2; c.beginPath(); c.moveTo(ax, ay); c.lineTo(ex, ey); c.stroke(); c.setLineDash([]);
    for (let k = 0; k < 4; k++) { const [ww, hh] = dims(k); if (ww <= fw * ease(dg) + 0.5) { c.fillStyle = '#c0392b'; c.beginPath(); c.arc(ax + ww, ay - hh, 4, 0, 7); c.fill(); } }
    c.restore();
  }
  // size pill and caption
  const txt = `${names[last]} · ${sizes[last]} mm`, cap = dg >= 1 ? T[lang].paper : '';
  const pill = (s, cy, col) => {
    c.font = '800 12.5px Nunito, system-ui, sans-serif'; const pw = c.measureText(s).width + 24;
    rr(c, (w - pw) / 2, cy - 12, pw, 24, 12); c.fillStyle = 'rgba(10,12,22,.82)'; c.fill(); c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 1; c.stroke();
    c.fillStyle = col; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s, w / 2, cy + 1);
  };
  pill(txt, h - 28, '#ffffff');
  if (cap) pill(cap, 36, '#ffd166');
  c.restore();
}

// --- the main loop -----------------------------------------------------------------------------------------
const cv = $('cv');
canvasLoop(cv, (c, w, h, dt, t) => {
  const g = S.g = layout(w, h), v = lab.view, tn = now();
  // animations
  if (S.anim) {
    const k = clamp01((tn - S.anim.t0) / S.anim.dur), e = ease(k);
    S.P = S.anim.from.map((p, i) => [lerp(p[0], S.anim.to[i][0], e), lerp(p[1], S.anim.to[i][1], e)]);
    S.D = clone(S.P); if (k >= 1) S.anim = null;
  } else S.D.forEach((p, i) => { const q = S.P[i], k = Math.min(1, dt * 22); p[0] += (q[0] - p[0]) * k; p[1] += (q[1] - p[1]) * k; });
  if (S.angAnim) {
    const k = clamp01((tn - S.angAnim.t0) / S.angAnim.dur); S.ang = lerp(S.angAnim.from, S.angAnim.to, ease(k)); if (k >= 1) { S.ang = S.angAnim.to; S.angAnim = null; }
  }
  if (S.coverAnim) { const k = clamp01((tn - S.coverAnim.t0) / S.coverAnim.dur); S.cover = 1 - ease(k); if (k >= 1) S.coverAnim = null; }
  // what is on the board
  let pts, hideMarks = false, modes, coverAmt = 0, ghost = false;
  const paper = S.sec === 'paper';
  if (v === 'bend') { pts = S.D; }
  else if (v === 'names') { pts = ROUNDS[S.r]; hideMarks = !S.checked; }
  else { pts = turnPts(S.ang); hideMarks = S.ans === null; coverAmt = S.cover; ghost = S.ans !== null && S.ang > 2; }
  const pr = props(v === 'bend' ? S.P : pts);
  if (v === 'bend') modes = pr.on.map((o) => (o ? 'lit' : 'dim'));
  else if (v === 'turn') modes = pr.on.map((o) => (o ? 'lit' : 'dim'));
  else { const tr = truth(S.r); modes = [0, 1, 2, 3, 4].map((i) => (!S.checked ? (S.sel[i] ? 'sel' : 'dim') : tr[i] ? (S.sel[i] ? 'ok' : 'miss') : (S.sel[i] ? 'wrong' : 'dim'))); }
  // marks fade
  const M = S.marks, mk = Math.min(1, dt * 10), want = !hideMarks;
  for (let i = 0; i < 4; i++) M.right[i] += (((want && pr.right[i]) ? 1 : 0) - M.right[i]) * mk;
  M.eq += (((want && pr.eq) ? 1 : 0) - M.eq) * mk;
  for (let j = 0; j < 2; j++) M.p[j] += (((want && pr.par[j]) ? 1 : 0) - M.p[j]) * mk;
  // keep the controls in step with the picture
  const key = [v, S.sec, pr.on.join(), Math.round(S.ang), S.cover < 1].join('|');
  if (key !== S.rk) { S.rk = key; render(); }
  if (v === 'turn' && S.angAnim && $('ang').value !== String(Math.round(S.ang))) $('ang').value = Math.round(S.ang);
  // place the drag layer over the board
  const b = g.board, on = v === 'bend' && !paper;
  bd.style.display = on ? 'block' : 'none';
  if (on) { bd.style.left = `${b.x}px`; bd.style.top = `${b.y}px`; bd.style.width = `${b.w}px`; bd.style.height = `${b.h}px`; }
  // draw
  drawBoard(c, g);
  const q = pts.map(pxOf);
  if (ghost) { // the upright square, faint, for comparison
    c.save(); c.setLineDash([5, 5]); c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 1.5; c.beginPath(); turnPts(0).map(pxOf).forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.closePath(); c.stroke(); c.restore();
  }
  drawBand(c, q);
  drawMarks(c, q, pr, M, hideMarks, g);
  if (v === 'bend') {
    const pulse = !S.touched && S.drag < 0 ? 0.5 + 0.5 * Math.sin(t * 4) : 0;
    q.forEach((p, i) => drawKnob(c, p, S.drag === i ? 1 : 0, pulse));
  } else q.forEach((p) => drawPin(c, p));
  drawTree(c, g, modes, dt, t);
  if (v === 'turn') drawCover(c, g, coverAmt);
  if (paper) drawPaper(c, w, h, t);
});
render();
</script>
</body>
