  if (a < .02) return;
  c.save(); c.globalAlpha = a;
  c.fillStyle = rad(c, sx, sy, 2, sx, sy, 76, [[0, 'rgba(255,244,170,.75)'], [1, 'rgba(255,244,170,0)']]); c.beginPath(); c.arc(sx, sy, 76, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(255,225,110,.8)'; c.lineWidth = 2.6; c.lineCap = 'round';
  for (let i = 0; i < 12; i++) { const an = i / 12 * Math.PI * 2 + time * .15; c.beginPath(); c.moveTo(sx + Math.cos(an) * 24, sy + Math.sin(an) * 24); c.lineTo(sx + Math.cos(an) * (i % 2 ? 31 : 36), sy + Math.sin(an) * (i % 2 ? 31 : 36)); c.stroke(); }
  c.fillStyle = rad(c, sx - 5, sy - 5, 1, sx, sy, 19, [[0, '#fffbe0'], [1, '#ffd23f']]); c.beginPath(); c.arc(sx, sy, 18, 0, Math.PI * 2); c.fill();
  c.restore();
}
function drawShade(c, time) {
  const cf = S.cloudF, heat = S.day * (1 - cf), t = T[lang], hz = 165, answered = S.pred.shade !== null;
  const base = mix('#9fd8ff', '#9aa7b5', cf * .55);
  sky(c, hz, mix(base, '#5fb2ee', .4), mix(base, '#e4f4ff', .55));
  const sx = 36 + 114 * S.day, sy = 150 - 100 * S.day;
  sunDisc(c, sx, sy, 1 - cf * .9, time);
  for (const [i, bx, by, sc] of [[0, 64, 62, 1], [1, 170, 40, 1.2], [2, 270, 70, .95]]) { // clouds drift in over the sun
    const e = clamp01(cf * 1.15 - i * .08), ex = eio(e);
    if (e > .01) cloud(c, -130 + (bx + 130) * ex + (i - 1) * 6, by, sc, '#eef2f7', '#aab5c3', clamp01(e * 1.6));
  }
  land(c, hz, cf * .35);
  if (heat > .03) { // sunlight reaches the post thermometer; the screen's roof stops it
    c.fillStyle = `rgba(255,236,140,${.2 * heat})`; c.beginPath(); c.moveTo(sx, sy); c.lineTo(66, 92); c.lineTo(112, 240); c.closePath(); c.fill();
    c.fillStyle = `rgba(255,236,140,${.14 * heat})`; c.beginPath(); c.moveTo(sx, sy); c.lineTo(196, 90); c.lineTo(318, 76); c.closePath(); c.fill();
  }
  post(c); screenBox(c);
  const heated = (S.tSun - T_AIR) / (T_SUN - T_AIR);
  thermo(c, 88, 108, 212, tFrac(S.tSun), { glow: clamp01(heated), ticks: 1, labels: true, lx: 108 });
  thermo(c, 250, 108, 212, tFrac(T_AIR));
  if (heated > .05) { c.strokeStyle = `rgba(255,170,80,${.6 * heated})`; c.lineWidth = 1.8; c.lineCap = 'round'; for (let i = 0; i < 3; i++) { const ph = mod(time * .7 + i / 3, 1), x0 = 80 + i * 8; c.beginPath(); c.moveTo(x0, 90 - ph * 14); c.quadraticCurveTo(x0 + 4, 84 - ph * 14, x0, 78 - ph * 14); c.stroke(); } }
  const f1 = Math.round(S.tSun), hot = f1 > T_AIR;
  pillT(c, `${f1} °C`, 88, 60, { size: 15, bg: hot ? '#d9532f' : 'rgba(14,20,32,.86)', stroke: hot ? '#fff' : null });
  pillT(c, `${T_AIR} °C`, 252, 60, { size: 15 });
  if (answered) pillT(c, t.screen, 252, 285, { size: 12.5 });
}
function drawCelsius(c, time) {
  const t = T[lang], hz = 175;
  sky(c, hz, '#6fbcf2', '#d9f0ff'); land(c, hz, 0);
  const x = 196, topY = 54, botY = 212, span = botY - topY - 8, frac = .3, ly = botY - frac * span;
  blob(c, x + 6, 268, 56, 9, .3);
  thermo(c, x, topY, botY, frac, { w: 24, r: 17 });
  const f = S.flip;
  for (let v = 0; v <= 100; v += 10) { // 1742: 0 at the top; today: 0 at the bottom. The glass never moves, only the numbers do.
    const yOld = topY + 8 + v / 100 * span, yNew = botY - v / 100 * span, y = yOld + (yNew - yOld) * f, big = v % 20 === 0;
    c.strokeStyle = 'rgba(35,55,80,.85)'; c.lineWidth = big ? 1.6 : 1; c.beginPath(); c.moveTo(x + 14, y); c.lineTo(x + 14 + (big ? 10 : 6), y); c.stroke();
    if (big) pillT(c, String(v), x + 44, y, { size: 12.5 });
  }
  const val = Math.round(100 * ((1 - f) * (1 - frac) + f * frac)); // the reading at the mercury level on the scale shown
  c.save(); c.setLineDash([4, 3]); c.strokeStyle = '#c9341f'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(x - 16, ly); c.lineTo(x - 48, ly); c.stroke(); c.restore();
  pillT(c, `${val}°`, x - 70, ly, { size: 15, bg: '#c9341f', stroke: '#fff' });
  // ice at the cold end, steam at the hot end (they never move)
  for (const [ix, iy, r] of [[x - 62, botY + 18, 1], [x - 48, botY + 24, .8]]) {
    c.fillStyle = lin(c, ix - 14, iy - 14, ix + 14, iy + 14, [[0, '#f2fbff'], [1, '#9fd2ef']]); c.beginPath(); c.roundRect(ix - 13 * r, iy - 13 * r, 26 * r, 26 * r, 5); c.fill(); c.strokeStyle = '#5f9cc0'; c.lineWidth = 1.4; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.8)'; c.beginPath(); c.roundRect(ix - 9 * r, iy - 9 * r, 8 * r, 5 * r, 2); c.fill();
  }
  c.fillStyle = lin(c, x - 76, 60, x - 40, 92, [[0, '#a7b2be'], [1, '#69747f']]); c.beginPath(); c.roundRect(x - 78, 74, 38, 20, 5); c.fill(); c.strokeStyle = '#4d5762'; c.lineWidth = 1.4; c.stroke();
  c.strokeStyle = '#4d5762'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(x - 40, 82); c.lineTo(x - 30, 82); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2.6;
  for (let i = 0; i < 3; i++) { const ph = mod(time * .6 + i / 3, 1), x0 = x - 70 + i * 14; c.beginPath(); c.moveTo(x0, 70 - ph * 6); c.bezierCurveTo(x0 + 6, 62 - ph * 6, x0 - 6, 54 - ph * 6, x0, 46 - ph * 6); c.stroke(); }
  pillT(c, f < .5 ? '1742' : t.today, x, 22, { size: 15, bg: f < .5 ? 'rgba(20,28,44,.86)' : '#2a7d4f', stroke: '#fff' });
}

// --- the frame -------------------------------------------------------------------------------------------------
function step(dt, time) {
  // wind: the vane is a damped spring toward the direction the wind comes FROM; the cups spin up with inertia
  if (S.pred.wind !== null) {
    S.clothT = Math.min(1, S.clothT + dt / 1.25);
    const target = DIRS[S.dir] + Math.sin(time * 2.7) * S.str * .5, kS = 40 * (.3 + .7 * Math.min(1, S.str / 3)), n = Math.max(1, Math.ceil(dt * 120)), h = dt / n;
    for (let i = 0; i < n; i++) { S.vaneV += (kS * angDiff(target, S.vane) - 4.4 * S.vaneV) * h; S.vane += S.vaneV * h; }
    S.vane = mod(S.vane, 360);
  }
  S.cupW += (S.str * 1.55 - S.cupW) * (1 - Math.exp(-dt * 1.8)); S.cup += S.cupW * dt;
  S.flow += angDiff(DIRS[S.dir], S.flow) * (1 - Math.exp(-dt * 5)); S.flow = mod(S.flow, 360);
  S.sp += dt * (.1 + .1 * S.str);
  S.cx += dt * (-Math.sin(S.flow * Math.PI / 180) * (6 + S.str * 5) + 2);
  // rain: the slider value is driven by an eased 5 s run after the prediction, and follows the child afterwards
  if (S.anim) {
    S.anim.t += dt; const u = clamp01(S.anim.t / S.anim.dur);
    S.shown = S.anim.to * eio(u); S.min = S.anim.to;
    $('wsMin').value = Math.round(S.shown);
    if (u >= 1) S.anim = null;
  } else { const d = S.min - S.shown; S.shown = Math.abs(d) < .02 ? S.min : S.shown + d * (1 - Math.exp(-dt * 5)); }
  S.rainAmt += ((S.min > 0 && (S.pred.rain !== null || S.sec === 'korea') ? 1 : 0) - S.rainAmt) * (1 - Math.exp(-dt * 4));
  // shade: the morning runs after the prediction; the sun thermometer creeps up
  if (S.pred.shade !== null) S.dayT = Math.min(1, S.dayT + dt / 5.5);
  S.day = eio(S.dayT);
  S.cloudF += ((S.sunny ? 0 : 1) - S.cloudF) * (1 - Math.exp(-dt * 2.2));
  const heatTarget = T_AIR + (T_SUN - T_AIR) * S.day * (1 - S.cloudF);
  S.tSun += (heatTarget - S.tSun) * (1 - Math.exp(-dt * 1.6));
  S.flip += (S.flipTo - S.flip) * (1 - Math.exp(-dt * 3.5)); if (Math.abs(S.flipTo - S.flip) < .002) S.flip = S.flipTo;
}
let roKey = '';
function refreshReadout() {
  const t = T[lang], v = lab.view, p = S.pred[v];
  let val, sub = '', pill = '', col;
  if (v === 'shade' && S.sec === 'celsius') { val = S.flipTo < .5 ? '1742' : t.today; col = '#d9532f'; }
  else if (v === 'wind') { col = '#4f93d6'; if (p === null) val = '?'; else { val = t.windFrom(t.dirsFull[S.dir]); sub = t.strength[S.str]; pill = t.force(S.str); } }
  else if (v === 'rain') {
    col = '#3d8bdd';
    if (S.sec === 'korea') { val = t.mm(num(S.shown * MM_PER_MIN, 1)); sub = t.secrets.b[0]; pill = '1441'; }
    else if (p === null) val = '?';
    else { val = t.mm(num(S.shown * MM_PER_MIN, 1)); sub = t.same; pill = t.times(AREA_RATIO); }
  } else { col = '#e08a35'; if (p === null) val = '?'; else { val = t.air(T_AIR); sub = t.inSun(Math.round(S.tSun)); pill = t.illus; } }
  const key = [lang, v, S.sec, val, sub, pill].join('|');
  if (key === roKey) return;
  roKey = key; lab.setReadout(esc(val), sub, pill, col);
  if (v === 'rain') $('wsMinV').textContent = t.mins(Math.round(S.shown));
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  K = s; VIS = { x0: -ox / s, x1: (w - ox) / s, y0: -oy / s, y1: (h - oy) / s };
  step(dt, time);
  c.save(); c.translate(ox, oy); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'wind') drawWind(c, time); else if (v === 'rain') drawRain(c, time, dt);
  else if (S.sec === 'celsius') drawCelsius(c, time); else drawShade(c, time);
  c.restore();
  refreshReadout();
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function resetRainIfUnasked() { if (S.pred.rain === null) { S.min = 0; S.shown = 0; S.anim = null; $('wsMin').value = 0; } }
function onView() { S.sec = null; resetRainIfUnasked(); render(); }
const goView = (v) => { if (lab.view !== v) $('views').querySelector(`[data-view="${v}"]`)?.click(); };
function toggleSecret(k) {
  if (!secret.unlocked()) return secret.open();
  const name = k === 'a' ? 'celsius' : 'korea';
  if (S.sec === name) { S.sec = null; resetRainIfUnasked(); }
  else {
    goView(k === 'a' ? 'shade' : 'rain'); S.sec = name;
    if (name === 'celsius') { S.flip = 0; S.flipTo = 0; }
    if (name === 'korea' && S.pred.rain === null && S.min === 0) { S.min = 0; $('wsMin').value = 0; }
  }
  sfx.click(); render();
}
function pick(key, i) {
  if (S.pred[key] !== null) return;
  S.pred[key] = i; (i === RIGHT[key] ? sfx.good : sfx.bad)();
  if (key === 'rain') { S.anim = { t: 0, dur: 5, to: 60 }; S.min = 60; }
  roKey = ''; showStage(); render();
}
function askHTML(key, q, opts, ok, no) {
  const p = S.pred[key], right = RIGHT[key];
  const btns = opts.map((o, i) => {
    let cls = 'ws-opt', mark = '';
    if (p !== null) { cls += ' done'; if (i === right) { cls += ' ok'; mark = '✓ '; } else if (i === p) { cls += ' no'; mark = '✗ '; } else cls += ' dim'; }
    return `<button type="button" class="${cls}" data-k="${key}" data-i="${i}">${mark}${esc(o)}</button>`;
  }).join('');
  const verdict = p === null ? '' : `<div class="ws-verdict ${p === right ? 'ok' : 'no'}">${esc(p === right ? ok : no)}</div>`;
  return `<div class="ws-q">${esc(q)}</div><div class="ws-opts">${btns}</div>${verdict}`;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const o = ev.target.closest('.ws-opt');
  if (o) return pick(o.dataset.k, +o.dataset.i);
  const d = ev.target.closest('[data-dir]');
  if (d) { S.dir = d.dataset.dir; sfx.click(); roKey = ''; return render(); }
  const sn = ev.target.closest('[data-sun]');
  if (sn) { S.sunny = sn.dataset.sun === '1'; sfx.click(); return render(); }
  const sc = ev.target.closest('[data-sec]');
  if (sc) return toggleSecret(sc.dataset.sec);
  if (ev.target.closest('#wsFlip')) { S.flipTo = S.flipTo ? 0 : 1; sfx.click(); roKey = ''; render(); }
});
$('wsStr').addEventListener('input', () => { S.str = +$('wsStr').value; sfx.tick(); refreshReadout(); });
$('wsMin').addEventListener('input', () => { S.min = +$('wsMin').value; S.anim = null; sfx.tick(); roKey = ''; });

// --- one render per change: controls, readout, state card and facts --------------------------------------------
const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  show('wsWind', v === 'wind'); show('wsRain', v === 'rain'); show('wsShade', v === 'shade');
  const cel = v === 'shade' && sec === 'celsius', kor = v === 'rain' && sec === 'korea';
  // wind
  $('wsWindCtl').style.display = S.pred.wind !== null ? 'block' : 'none';
  $('wsFromL').textContent = t.from; $('wsStrL').textContent = t.strengthLbl;
  $('wsDirs').innerHTML = ['N', 'E', 'S', 'W'].map((k) => `<button type="button" class="chip ws-ch ${S.dir === k ? 'on' : ''}" data-dir="${k}" aria-label="${esc(t.dirsFull[k])}">${esc(t.dirs[k])}</button>`).join('');
  $('wsStr').value = S.str; $('wsStr').setAttribute('aria-label', t.strengthLbl);
  $('wsWindAsk').innerHTML = askHTML('wind', t.windAsk, t.windOpts, t.windRight, t.windWrong);
  // rain
  $('wsRainCtl').style.display = S.pred.rain !== null || kor ? 'block' : 'none';
  $('wsMinL').textContent = t.rainFor; $('wsMin').setAttribute('aria-label', t.rainFor); $('wsMinV').textContent = t.mins(Math.round(S.shown));
  $('wsRainAsk').style.display = kor ? 'none' : 'block';
  $('wsRainAsk').innerHTML = askHTML('rain', t.rainAsk, t.rainOpts, t.rainRight, t.rainWrong);
  // shade
  $('wsShadeCtl').style.display = S.pred.shade !== null && !cel ? 'block' : 'none';
  $('wsSun').innerHTML = [[1, '☀️', t.sun], [0, '☁️', t.clouds]].map(([k, e, l]) => `<button type="button" class="chip ws-ch ${S.sunny === !!k ? 'on' : ''}" data-sun="${k}">${e} ${esc(l)}</button>`).join('');
  $('wsCelCtl').style.display = cel ? 'block' : 'none'; $('wsFlip').textContent = t.flip;
  $('wsShadeAsk').style.display = cel ? 'none' : 'block';
  $('wsShadeAsk').innerHTML = askHTML('shade', t.shadeAsk, t.shadeOpts, t.shadeRight, t.shadeWrong);
  // secrets
  const sc = (k, emo, i) => `<button type="button" class="chip ws-ch secret ${open ? 'open' : ''} ${(k === 'a' && cel) || (k === 'b' && kor) ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('wsSecrets').innerHTML = sc('a', '🌡️') + sc('b', '👑');
  // state card and facts: never before the prediction is answered
  const p = S.pred[v], ask = { wind: t.windAsk, rain: t.rainAsk, shade: t.shadeAsk }[v];
  if (cel) lab.setState({ emo: '🌡️', title: t.secrets.a[0], lead: t.celsiusText, body: '' });
  else if (kor) lab.setState({ emo: '👑', title: t.secrets.b[0], lead: t.koreaText, body: '' });
  else if (p === null) lab.setState({ emo: '🤔', title: ask, lead: '', body: '' });
  else { const [emo, title, lead, body] = t.st[v]; lab.setState({ emo, title, lead, body }); }
  lab.setFacts(p !== null && !sec ? t.facts[v] : []);
  lab.setGlow({ wind: 'rgba(79, 147, 214, .3)', rain: 'rgba(61, 139, 221, .3)', shade: 'rgba(224, 138, 53, .28)' }[v]);
  roKey = ''; refreshReadout();
}
render();
</script>
