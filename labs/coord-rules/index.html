  const world = (lx, ly) => [rule.at[0] + lx, rule.at[1] + ly];
  const mapAt = (k) => (lx, ly) => { const p = tf(rule, world(lx, ly), k); return [X(p[0]), Y(p[1])]; };
  const K0 = world(...BOAT.tip), K1 = rule.f(K0[0], K0[1]);
  if (v === 'flip' && oa > 0) drawMirror(c, rule.mirror, oa, w, h);
  if (v === 'turn' && oa > 0) { // the arc K0 -> K1 about the centre, with its direction
    const r = Math.hypot(K0[0], K0[1]) * cell, a0 = Math.atan2(K0[1], K0[0]), a1 = a0 + rule.ang;
    c.save(); c.globalAlpha = oa;
    c.strokeStyle = 'rgba(245, 200, 76, .35)'; c.lineWidth = 8; c.beginPath(); c.arc(X(0), Y(0), r, -a0, -a1, rule.ang > 0); c.stroke();
    c.strokeStyle = '#f5c84c'; c.lineWidth = 2.5; c.setLineDash([8, 5]); c.beginPath(); c.arc(X(0), Y(0), r, -a0, -a1, rule.ang > 0); c.stroke(); c.setLineDash([]);
    const tan = a1 + (rule.ang > 0 ? Math.PI / 2 : -Math.PI / 2); head(c, X(K1[0]), Y(K1[1]), Math.atan2(-Math.sin(tan), Math.cos(tan)), 11, '#f5c84c');
    c.strokeStyle = 'rgba(245, 200, 76, .55)'; c.lineWidth = 1.5; c.setLineDash([3, 4]);
    c.beginPath(); c.moveTo(X(K0[0]), Y(K0[1])); c.lineTo(X(0), Y(0)); c.lineTo(X(K1[0]), Y(K1[1])); c.stroke(); c.setLineDash([]);
    dot(c, X(0), Y(0), 5, ['#fff', '#f5c84c']);
    const am = a0 + rule.ang / 2, rr = r * 0.62; tag(c, `${Math.abs(Math.round(rule.ang * 180 / Math.PI))}° ${rule.ang > 0 ? '↺' : '↻'}`, X(0) + Math.cos(am) * rr, Y(0) - Math.sin(am) * rr, '#f5c84c', w, h);
    c.restore();
  }
  if (st.mt > 0) drawBoat(c, mapAt(0), true);
  drawBoat(c, mapAt(e), false);
  if (v === 'slide' && oa > 0) { c.save(); c.globalAlpha = oa; arrow(c, [X(K0[0]), Y(K0[1])], [X(K1[0]), Y(K1[1])], '#7fe0ff', 2.5, [8, 5], 8, 11); c.restore(); }
  if (oa > 0) {
    c.save(); c.globalAlpha = oa;
    dot(c, X(K0[0]), Y(K0[1]), 4.5, IN); dot(c, X(K1[0]), Y(K1[1]), 4.5, OUT);
    tag(c, fp(K0), X(K0[0]), Y(K0[1]) - 17, '#5fd6e8', w, h); tag(c, fp(K1), X(K1[0]), Y(K1[1]) - 17, '#ffd76a', w, h);
    c.restore();
  }
  // the child's tries: input (blue) -> image (gold), numbered like the table
  const r = Math.max(9, cell * 0.36), last = st.tries[st.tries.length - 1];
  st.tries.forEach((t) => {
    const a = [X(t.p[0]), Y(t.p[1])], b = [X(t.q[0]), Y(t.q[1])], isLast = t === last;
    arrow(c, a, b, isLast ? 'rgba(255,255,255,.7)' : 'rgba(255,255,255,.32)', isLast ? 1.8 : 1.2, [4, 4], r + 1, 8);
  });
  st.tries.forEach((t) => { dot(c, X(t.q[0]), Y(t.q[1]), r, OUT, t.n); dot(c, X(t.p[0]), Y(t.p[1]), r, IN, t.n); });
  if (last && !st.q) { tag(c, fp(last.p), X(last.p[0]), Y(last.p[1]) - r - 12, '#5fd6e8', w, h); tag(c, fp(last.q), X(last.q[0]), Y(last.q[1]) - r - 12, '#ffd76a', w, h); }
  if (st.phase === 'predict' || st.phase === 'miss') { // the test point, the guess and (after the check) the real image
    const q = st.q, pulse = 1 + Math.sin(time * 4) * 0.12;
    if (st.phase === 'miss') arrow(c, [X(q[0]), Y(q[1])], [X(st.real[0]), Y(st.real[1])], 'rgba(255,255,255,.6)', 1.8, [4, 4], r + 1, 8);
    dot(c, X(q[0]), Y(q[1]), r, IN, '?');
    if (st.phase === 'predict') { c.strokeStyle = 'rgba(95, 214, 232, .8)'; c.lineWidth = 2; c.beginPath(); c.arc(X(q[0]), Y(q[1]), (r + 6) * pulse, 0, Math.PI * 2); c.stroke(); }
    tag(c, fp(q), X(q[0]), Y(q[1]) - r - 12, '#5fd6e8', w, h);
    if (st.guess) {
      const gx = X(st.guess[0]), gy = Y(st.guess[1]);
      dot(c, gx, gy, r * 0.8, GUESS);
      if (st.phase === 'miss') { c.strokeStyle = '#fff'; c.lineWidth = 2.2; c.beginPath(); c.moveTo(gx - 4, gy - 4); c.lineTo(gx + 4, gy + 4); c.moveTo(gx + 4, gy - 4); c.lineTo(gx - 4, gy + 4); c.stroke(); }
      tag(c, fp(st.guess), gx, gy + r + 14, '#ff7ab0', w, h);
    }
    if (st.phase === 'miss') { dot(c, X(st.real[0]), Y(st.real[1]), r * (1 + Math.sin(time * 5) * 0.08), OUT, '✓'); tag(c, fp(st.real), X(st.real[0]), Y(st.real[1]) - r - 12, '#ffd76a', w, h); }
  }
}

function drawGames(c, w, h, dt, time, X, Y) {
  G.cur = [lerp(G.cur[0], G.pos[0], Math.min(1, dt * 9)), lerp(G.cur[1], G.pos[1], Math.min(1, dt * 9))];
  const sx = X(G.star[0]), sy = Y(G.star[1]), r = geo.cell * (0.55 + Math.sin(time * 4) * 0.05);
  c.save(); c.shadowColor = 'rgba(255, 220, 100, .8)'; c.shadowBlur = 14; c.fillStyle = '#ffd34d'; c.strokeStyle = '#8a5d00'; c.lineWidth = 1.5; c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; c.lineTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr); }
  c.closePath(); c.fill(); c.shadowColor = 'transparent'; c.stroke(); c.restore();
  drawBoat(c, (lx, ly) => [X(G.cur[0] - 2 + lx), Y(G.cur[1] + ly)], false);
  const mk_ = [X(G.cur[0]), Y(G.cur[1])];
  dot(c, mk_[0], mk_[1], 5, IN); tag(c, fp(G.pos), mk_[0], mk_[1] + 17, '#5fd6e8', w, h);
  tag(c, fp(G.star), sx, sy - r - 10, '#ffd76a', w, h);
}

function drawTwice(c, w, h, dt, X, Y) {
  const target = TW.n % 2, step = dt / 0.9;
  TW.cur = clamp(TW.cur + clamp(target - TW.cur, -step, step), 0, 1);
  const f = MIRRORS[TW.mir], at = [1, -5], e = ease(TW.cur), settled = Math.abs(TW.cur - target) < 0.001;
  drawMirror(c, TW.mir, 1, w, h);
  const world = (lx, ly) => [at[0] + lx, at[1] + ly];
  drawBoat(c, (lx, ly) => { const p = world(lx, ly), q = f(p[0], p[1]); return [X(lerp(p[0], q[0], 0)), Y(lerp(p[1], q[1], 0))]; }, true);
  drawBoat(c, (lx, ly) => { const p = world(lx, ly), q = f(p[0], p[1]); return [X(lerp(p[0], q[0], e)), Y(lerp(p[1], q[1], e))]; }, false);
  const K0 = world(...BOAT.tip), K1 = f(K0[0], K0[1]);
  if (settled) { const K = target ? K1 : K0; dot(c, X(K[0]), Y(K[1]), 5, target ? OUT : IN); tag(c, fp(K), X(K[0]), Y(K[1]) - 17, target ? '#ffd76a' : '#5fd6e8', w, h); }
}

// --- taps on the grid ------------------------------------------------------------------------------------------
$('cv').addEventListener('click', (ev) => {
  if (S.mode) return;
  const r = $('cv').getBoundingClientRect(), gx = Math.round((ev.clientX - r.left - geo.ox) / geo.cell), gy = Math.round((geo.oy - (ev.clientY - r.top)) / geo.cell);
  if (Math.abs(gx) > 6.4 || Math.abs(gy) > 6.4) return;
  tap([clamp(gx, -6, 6), clamp(gy, -6, 6)]);
});
function tap(p) {
  const v = lab.view, st = V[v], rule = curRule(v);
  if (st.phase === 'try') {
    if (st.tries.some((t) => same(t.p, p))) { sfx.tick(); return; }
    const img = rule.f(p[0], p[1]);
    if (!inR(img)) { st.off = true; sfx.bad(); render(); return; }
    st.off = false; st.tries.push({ n: ++st.n, p, q: img }); if (st.tries.length > 8) st.tries.shift(); sfx.click(); render();
  } else if (st.phase === 'predict') { st.guess = p; sfx.tick(); render(); }
}

// --- buttons ---------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function startPredict(v) { const st = V[v]; st.q = pickQ(v, curRule(v), st.tries); st.guess = null; st.real = null; st.phase = 'predict'; }
function act(a, d) {
  const v = lab.view, st = V[v], rule = curRule(v);
  if (a === 'test') { if (st.phase === 'try' && st.tries.length >= 2) { startPredict(v); sfx.click(); } }
  else if (a === 'check') {
    if (!st.guess) return;
    const real = rule.f(st.q[0], st.q[1]); st.real = real;
    if (same(st.guess, real)) { st.tries.push({ n: ++st.n, p: st.q, q: real }); st.phase = 'pick'; st.opts = makeOpts(v, rule); st.dead = []; st.wrong = null; st.q = null; sfx.good(); }
    else { st.phase = 'miss'; sfx.bad(); }
    showStage();
  }
  else if (a === 'another') { st.tries.push({ n: ++st.n, p: st.q, q: st.real }); if (st.tries.length > 8) st.tries.shift(); startPredict(v); sfx.click(); }
  else if (a === 'more') { st.phase = 'try'; st.q = null; st.guess = null; sfx.click(); }
  else if (a === 'opt') {
    const i = +d.i, o = st.opts[i]; if (!o || st.dead.includes(i)) return;
    if (o.ok) { st.phase = 'done'; st.res[st.r] = 'own'; st.wrong = null; sfx.good(); showStage(); }
    else { st.dead.push(i); const t = st.tries[st.tries.length - 1]; st.wrong = { txt: `(x, y) → ${o.txt}`, p: t.p, o: o.f(t.p[0], t.p[1]), r: t.q }; sfx.bad(); }
  }
  else if (a === 'show') { st.phase = 'shown'; st.res[st.r] = 'shown'; st.wrong = null; st.q = null; st.guess = null; sfx.snap(); showStage(); }
  else if (a === 'next') {
    if (st.r >= 2) st.phase = 'end';
    else { Object.assign(st, { r: st.r + 1, phase: 'try', tries: [], n: 0, q: null, guess: null, real: null, opts: [], dead: [], mt: 0, off: false, wrong: null }); }
    sfx.click();
  }
  else if (a === 'again') { V[v] = mk(); sfx.click(); }
  else if (a === 'sec') openSecret(d.k);
  else if (a === 'arrow') moveGame(d.k);
  else if (a === 'mir') { TW.mir = d.k; TW.n = 0; TW.cur = 0; sfx.click(); }
  else if (a === 'flip') { TW.n++; sfx.snap(); }
  render();
}
$('ctrlBody').addEventListener('click', (ev) => { const b = ev.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b.dataset); });
addEventListener('keydown', (ev) => {
  if (S.mode !== 'games' || $('secret').classList.contains('open')) return;
  const k = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r' }[ev.key]; if (!k) return;
  ev.preventDefault(); moveGame(k); render();
});
function openSecret(k) {
  if (!secret.unlocked()) { secret.open(); return; }
  const home = k === 'games' ? 'slide' : 'flip';
  if (S.mode === k) { S.mode = null; return; }
  if (k === 'games') { Object.assign(G, { pos: [0, -4], cur: [0, -4], star: [3, 1], n: 0, last: null, got: false, edge: false }); }
  else { TW.n = 0; TW.cur = 0; }
  S.mode = k; sfx.click();
  if (lab.view !== home) $('views').querySelector(`[data-view="${home}"]`).click();
}
function moveGame(k) {
  const a = ARROWS.find((x) => x[0] === k), p = a[2](G.pos[0], G.pos[1]);
  G.got = false;
  if (p[0] < -4 || p[0] > 4 || p[1] < -6 || p[1] > 2) { G.edge = true; sfx.bad(); return; }
  G.edge = false; G.last = { r: a[3], from: G.pos, to: p }; G.pos = p; sfx.tick();
  if (same(p, G.star)) {
    G.n++; G.got = true; sfx.good();
    let s; do { s = [Math.floor(Math.random() * 9) - 4, Math.floor(Math.random() * 9) - 6]; } while (same(s, p));
    G.star = s;
  }
}

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  if ((S.mode === 'games' && v !== 'slide') || (S.mode === 'twice' && v !== 'flip')) S.mode = null;
  document.body.dataset.v = v;
  lab.setGlow({ slide: 'rgba(78, 168, 255, .28)', flip: 'rgba(214, 122, 236, .26)', turn: 'rgba(245, 200, 76, .24)' }[v]);
  const open = secret.unlocked();
  $('crSec').innerHTML = ['games', 'twice'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${S.mode === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'games' ? '🎮' : '🪞'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('crRound').hidden = !!S.mode; $('crGames').hidden = S.mode !== 'games'; $('crTwice').hidden = S.mode !== 'twice';
  if (S.mode === 'games') renderGames(t); else if (S.mode === 'twice') renderTwice(t); else renderRound(t, v);
}
const btn = (a, label, cls = 'chip', dis = false) => `<button class="${cls} cr-btn" data-act="${a}"${dis ? ' disabled' : ''}>${esc(label)}</button>`;

function renderRound(t, v) {
  const st = V[v], rule = curRule(v), ph = st.phase, fin = FIN.includes(ph), last = st.tries[st.tries.length - 1];
  const own = st.res.filter((x) => x === 'own').length, accent = { slide: '#4ea8ff', flip: '#d67aec', turn: '#f5c84c' }[v];
  const desc = v === 'slide' ? t.rd.slide(rule.d[0], rule.d[1]) : t.rd[rule.key];
  // the question stays visible while the child answers
  $('crQ').textContent = ph === 'try' ? t.q.try : ph === 'predict' ? t.q.pred(fp(st.q)) : ph === 'miss' ? t.q.miss : ph === 'pick' ? t.q.pick : ph === 'end' ? t.q.end : t.q.done;
  // the table of tries: the picture's numbers in words
  const rows = st.tries.map((r) => `<div class="cr-row"><i>${r.n}</i><b>${fp(r.p)}</b><u>→</u><b class="out">${fp(r.q)}</b></div>`);
  if (ph === 'predict') rows.push(`<div class="cr-row"><i>?</i><b>${fp(st.q)}</b><u>→</u><b class="out">?</b></div>`);
  if (ph === 'miss') rows.push(`<div class="cr-row"><i>?</i><b>${fp(st.q)}</b><u>→</u><b class="out">${fp(st.real)}</b></div>`);
  $('crTblWrap').innerHTML = rows.length ? `<div class="cr-th">${esc(t.th)}</div><div class="cr-tbl">${rows.join('')}</div>` : '';
  $('crOpts').hidden = ph !== 'pick';
  $('crOpts').innerHTML = ph === 'pick' ? st.opts.map((o, i) => `<button class="cr-opt" data-act="opt" data-i="${i}"${st.dead.includes(i) ? ' disabled' : ''}>(x, y) → ${o.txt}</button>`).join('') : '';
  const show = btn('show', t.b.show);
  $('crBtns').innerHTML = ph === 'try' ? btn('test', t.b.test, 'btn', st.tries.length < 2) + show
    : ph === 'predict' ? btn('check', t.b.check, 'btn', !st.guess) + btn('more', t.b.more) + show
    : ph === 'miss' ? btn('another', t.b.another, 'btn') + show
    : ph === 'pick' ? show
    : ph === 'end' ? btn('again', t.b.again, 'btn')
    : btn('next', st.r >= 2 ? t.b.fin : t.b.next, 'btn');
  // readout
  const val = fin ? `(x, y) → ${rule.txt}` : ph === 'predict' ? `${fp(st.q)} → ?` : ph === 'miss' || ph === 'pick' ? `${fp(last && ph === 'pick' ? last.p : st.q)} → ${fp(ph === 'pick' ? last.q : st.real)}` : last ? `${fp(last.p)} → ${fp(last.q)}` : '(x, y) → ?';
  lab.setReadout(val, t.ruleOf(st.r + 1), t.foundPill(own), accent);
  // state card
  let s;
  if (ph === 'try') s = st.off ? { emo: '🚧', title: t.st.off[0], lead: t.st.off[1], body: '' } : last ? (([a, b, c]) => ({ emo: '⚙️', title: a, lead: b, body: c }))(t.st.tried(fp(last.p), fp(last.q), st.tries.length)) : { emo: '⚙️', title: t.st.start[0], lead: t.st.start[1], body: v === 'turn' ? `${t.st.start[2]} ${t.st.centre}` : t.st.start[2] };
  else if (ph === 'predict') s = st.guess ? { emo: '🎯', title: t.st.pred1(fp(st.guess))[0], lead: t.st.pred1(fp(st.guess))[1], body: '' } : (([a, b, c]) => ({ emo: '🎯', title: a, lead: b, body: c }))(t.st.pred0(fp(st.q)));
  else if (ph === 'miss') s = (([a, b, c]) => ({ emo: '🤔', title: a, lead: b, body: c }))(t.st.miss(fp(st.q), fp(st.guess), fp(st.real)));
  else if (ph === 'pick') s = st.wrong ? (([a, b, c]) => ({ emo: '🤔', title: a, lead: b, body: c }))(t.st.wrong(st.wrong.txt, fp(st.wrong.p), fp(st.wrong.o), fp(st.wrong.r)))
    : (([a, b, c]) => ({ emo: '✅', title: a, lead: b, body: c }))(t.st.hit(fp(last.p), fp(last.q)));
  else if (ph === 'end') s = { emo: '🏆', title: t.st.endT, lead: t.st.endL(own), body: t.st.endB[v] };
  else s = { emo: ph === 'done' ? '🎉' : '👀', title: (ph === 'done' ? t.st.done : t.st.shown)(rule.txt)[0], lead: desc, body: t.st.kept };
  lab.setState({ ...s, extra: '' });
  lab.setFacts(t.facts[v]);
}

function renderGames(t) {
  $('crArr').innerHTML = ARROWS.map(([k, ch, , r]) => `<button class="cr-arr" data-act="arrow" data-k="${k}">${ch} ${r}</button>`).join('');
  lab.setReadout(fp(G.pos), t.g.mark, `⭐ ${G.n}`, '#4ea8ff');
  const l = G.last;
  lab.setState(G.got ? { emo: '⭐', title: t.g.got, lead: t.g.moved(l.r, fp(l.from), fp(l.to)), body: t.g.body, extra: '' }
    : G.edge ? { emo: '🎮', title: t.g.intro[0], lead: t.g.edge, body: t.g.body, extra: '' }
    : l ? { emo: '🎮', title: t.g.intro[0], lead: t.g.moved(l.r, fp(l.from), fp(l.to)), body: t.g.body, extra: '' }
    : { emo: '🎮', title: t.g.intro[0], lead: t.g.intro[1], body: t.g.body, extra: '' });
  lab.setFacts(t.facts.slide);
}

function renderTwice(t) {
  $('crMir').innerHTML = ['y', 'x', 'd'].map((k) => `<button data-act="mir" data-k="${k}" class="${TW.mir === k ? 'on' : ''}">${esc(t.tw.mir[k])}</button>`).join('');
  $('crFlipB').textContent = t.tw.flip; $('crCnt').textContent = t.tw.cnt(TW.n);
  const K0 = [3, -1], K1 = MIRRORS[TW.mir](K0[0], K0[1]), k = TW.n % 2 ? K1 : K0;
  lab.setReadout(fp(k), t.tip, `🪞 ${TW.n}`, '#d67aec');
  let s;
  if (TW.n === 0) s = [t.tw.start[0], t.tw.start[1]];
  else if (TW.n % 2) s = t.tw.once(fp(K0), fp(K1));
  else s = t.tw.twice(fp(K0));
  lab.setState({ emo: '🪞', title: s[0], lead: s[1], body: '', extra: '' });
  lab.setFacts(t.facts.flip);
}
render();
</script>
