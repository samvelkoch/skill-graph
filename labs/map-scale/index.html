      rec.pick = +b.dataset.i; rec.right = o.k === 0; rec.phase = 'done'; S.walkT = 0;
      (rec.right ? sfx.good : sfx.bad)(); lightUp(rec); showStage();
    } else if (act === 'next') {
      S.ti++; S.ru = null; S.snapped = -1; S.aligned = false; S.moved = false; S.walkT = 0; sfx.click();
    } else if (act === 'again') {
      S.tk.forEach((r) => Object.assign(r, { phase: 'measure', pick: null, lit: 0, right: false })); S.ti = 0; S.ru = null; S.moved = false; sfx.click();
    }
  } else if (v === 'zoom') {
    if (act === 'zoom') { S.zN = +b.dataset.n; sfx.click(); }
    else if (act === 'pick1') {
      S.z1 = +b.dataset.i; S.zN = 50000; (S.z1 === 0 ? sfx.good : sfx.bad)(); showStage();
    } else if (act === 'pick2') {
      S.z2 = +b.dataset.i; (S.z2 === 1 ? sfx.good : sfx.bad)(); showStage();
    } else if (act === 'next') { S.zq++; sfx.click(); }
  } else if (v === 'plan') {
    const r = S.it[S.pi], it = ITEMS[S.pi];
    if (act === 'item') { S.pi = +b.dataset.i; sfx.click(); }
    else if (act === 'check') { if (r.touched && r.phase === 'draw') { r.phase = 'ask'; sfx.click(); } }
    else if (act === 'pick') {
      if (r.phase !== 'ask') return;
      const o = it.ord[+b.dataset.i];
      r.pick = +b.dataset.i; r.right = o === 0; r.phase = 'done'; r.morph = 0; r.lit = 1;
      (r.right ? sfx.good : sfx.bad)(); const rec = r; lightUp(rec); showStage();
    } else if (act === 'next') {
      const nx = S.it.findIndex((x, i) => i !== S.pi && x.phase !== 'done');
      if (nx >= 0) S.pi = nx; sfx.click();
    } else if (act === 'again') {
      S.it.forEach((x) => Object.assign(x, { phase: 'draw', w: 1, h: 1, touched: false, pick: null, right: false, morph: 0, lit: 0 })); S.pi = 0; sfx.click();
    }
  }
  render();
});

// --- render: the controls, the readout and the state card ------------------------------------------------------------
const chainHTML = (labels, vals, lit) => labels.map((l, i) => `<div class="ms-st ${i < lit ? 'on' : ''}"><small>${esc(l)}</small><b>${i < lit ? esc(vals[i]) : '?'}</b></div>`).join('') + `<div class="ms-hint">${esc(T[lang].hint)}</div>`;
const optsHTML = (labels, pick, ok, act) => `<div class="ms-opts">${labels.map((l, i) => `<button class="ms-o ${pick === null ? '' : i === ok ? 'good' : i === pick ? 'bad' : ''}" data-act="${act}" data-i="${i}"${pick === null ? '' : ' disabled'}>${esc(l)}</button>`).join('')}</div>`;
const verdictHTML = (right, wrong) => `<div class="ms-v" style="color:${right ? 'var(--ok)' : 'var(--wip)'}">${esc(right ? T[lang].right : wrong || T[lang].notq)}</div>`;
const btn = (act, label, dis) => `<button class="btn ms-btn" data-act="${act}"${dis ? ' disabled' : ''}>${esc(label)}</button>`;
function setUI(q, chain, row) { $('msQ').innerHTML = q; $('msChain').innerHTML = chain; $('msRow').innerHTML = row; }

function secChips(t) {
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('msSec').innerHTML = sc('borges', '🗺️') + sc('world', '🌍');
}

function render() {
  const t = T[lang], v = lab.view;
  secChips(t);
  if (S.sec === 'borges') return renderBorges(t);
  if (S.sec === 'world') return renderWorld(t);
  if (v === 'ruler') renderRuler(t); else if (v === 'zoom') renderZoom(t); else renderPlan(t);
}

function renderBorges(t) {
  lab.setGlow('rgba(110,170,90,.28)');
  const cm = G.w / G.U;
  setUI('', chainHTML(t.b.ch, [`1 ${t.u.cm}`, '× 1', `1 ${t.u.cm}`, `1 ${t.u.cm}`], 4), '');
  lab.setReadout('1 : 1', t.b.sub, '1 cm = 1 cm', '#6fa650');
  lab.setState({ emo: '🗺️', title: t.secrets.borges[0], lead: t.secrets.borges[1], body: t.b.body(cmS(cm), dist(2100)) });
  lab.setFacts(t.facts.plan);
}
function renderWorld(t) {
  lab.setGlow('rgba(80,150,210,.3)');
  setUI('', chainHTML(t.w.ch, [`≈ 1${lang === 'en' ? '.' : ','}6${NB}${t.u.cm}`, `× ${fmtN(1e8)}`, `≈ ${fmtN(1.6e8)}${NB}${t.u.cm}`, `≈ ${fmtN(1600)}${NB}${t.u.km}`], 4), '');
  lab.setReadout(`≈ 1${lang === 'en' ? '.' : ','}6${NB}${t.u.cm}`, `${t.pl.budapest} – ${t.pl.moscow}`, '1 : 100 000 000', '#4f95c6');
  lab.setState({ emo: '🌍', title: t.secrets.world[0], lead: t.w.lead, body: t.w.body });
  lab.setFacts([]);
}

function renderRuler(t) {
  const r = t.r, end = S.ti >= 4, k = TASKS[Math.min(S.ti, 3)], rec = S.tk[Math.min(S.ti, 3)];
  lab.setGlow('rgba(61,155,214,.28)');
  const a = t.pl[k.a], b = t.pl[k.b], pillTxt = `1 : ${fmtN(k.N)}`;
  const nOk = S.tk.filter((x) => x.right).length;
  if (end) {
    setUI('', '', btn('again', t.again));
    lab.setReadout(`${nOk}/4`, '', pillTxt, '#3d9bd6');
    lab.setState({ emo: '🏁', title: r.endTitle(nOk), lead: r.endLead, body: '' });
    lab.setFacts(t.facts.ruler); return;
  }
  const cm = k.cm, realCm = k.d * 100, vals = [cmS(cm), `× ${fmtN(k.N)}`, `${fmtN(realCm)}${NB}${t.u.cm}`, dist(k.d)];
  if (rec.phase === 'measure') {
    setUI('', '', `<button class="chip" data-act="help"${S.ruAnim ? ' disabled' : ''}>${esc(t.help)}</button>`);
    lab.setReadout('—', t.subMap, pillTxt, '#3d9bd6');
    lab.setState({ emo: '📏', title: r.sTitle, lead: r.sLead(a, b), body: r.sBody });
    lab.setFacts([]);
  } else if (rec.phase === 'ask') {
    const o = optsOf(k);
    setUI(`<div>${esc(r.q(a, b, cmS(cm)))}</div><div style="height:10px"></div>${optsHTML(o.map((x) => x.label), null, -1, 'pick')}`, chainHTML(r.ch, vals, 1), '');
    lab.setReadout(cmS(cm), t.subMap, pillTxt, '#3d9bd6');
    lab.setState({ emo: '🤔', title: r.aTitle(a, b, cmS(cm)), lead: r.aLead, body: '' });
    lab.setFacts([]);
  } else {
    const o = optsOf(k), okI = o.findIndex((x) => x.k === 0), pickK = o[rec.pick].k;
    const why = rec.right ? '' : pickK === 1 ? r.big : r.small;
    setUI(`<div>${esc(r.q(a, b, cmS(cm)))}</div><div style="height:10px"></div>${optsHTML(o.map((x) => x.label), rec.pick, okI, 'pick')}${verdictHTML(rec.right, r.not(dist(k.d)))}`,
      chainHTML(r.ch, vals, rec.lit), btn('next', t.next));
    lab.setReadout(dist(k.d), `${cmS(cm)} ${t.subMap}`, pillTxt, '#3d9bd6');
    lab.setState({ emo: rec.right ? '✅' : '🤔', title: `${cmS(cm)} × ${fmtN(k.N)} = ${fmtN(realCm)}${NB}${t.u.cm} = ${dist(k.d)}`, lead: r.oneCm(dist(k.N / 100)), body: `${why ? why + ' ' : ''}${r.walk(Math.round(k.d / 83.33))}` });
    lab.setFacts(t.facts.ruler);
  }
}

function renderZoom(t) {
  const z = t.z, N = S.zN, cm = HL.d * 100 / N;
  lab.setGlow('rgba(61,189,138,.26)');
  const chips = ZOOMS.map((n) => `<button class="chip ${n === N ? 'on' : ''}" data-act="zoom" data-n="${n}">1 : ${fmtN(n)}</button>`).join('');
  const pillTxt = `1 : ${fmtN(N)}`;
  const vals = [cmS(cm), `× ${fmtN(N)}`, `${fmtN(HL.d * 100)}${NB}${t.u.cm}`, dist(HL.d)];
  const c25 = cmS(HL.d * 100 / 25000), c50 = cmS(HL.d * 100 / 50000);
  lab.setFacts(t.facts.zoom);
  if (S.zq === 0) {
    if (S.z1 === null) {
      setUI(`<div>${esc(z.q1)}</div><div style="height:10px"></div>${optsHTML(z.o1, null, -1, 'pick1')}`, '', '');
      lab.setReadout(cmS(cm), t.subMap, pillTxt, '#3dbd8a');
      lab.setState({ emo: '🔍', title: z.t0, lead: z.l0, body: '' });
      lab.setFacts([]);
    } else {
      setUI(`<div>${esc(z.q1)}</div><div style="height:10px"></div>${optsHTML(z.o1, S.z1, 0, 'pick1')}${verdictHTML(S.z1 === 0)}`, chainHTML(t.r.ch, vals, 4), btn('next', t.next));
      lab.setReadout(cmS(cm), t.subMap, pillTxt, '#3dbd8a');
      lab.setState({ emo: S.z1 === 0 ? '✅' : '🤔', title: z.t1, lead: z.e1(c25, c50, dist(HL.d)), body: z.e1b });
    }
  } else if (S.zq === 1) {
    const o2 = ['1 : 25 000', '1 : 50 000', z.o2b];
    if (S.z2 === null) {
      setUI(`<div>${esc(z.q2)}</div><div style="height:10px"></div>${optsHTML(o2, null, -1, 'pick2')}`, '', '');
      lab.setReadout(cmS(cm), t.subMap, pillTxt, '#3dbd8a');
      lab.setState({ emo: '🗺️', title: z.t2q, lead: z.l2q, body: '' });
    } else {
      setUI(`<div>${esc(z.q2)}</div><div style="height:10px"></div>${optsHTML(o2, S.z2, 1, 'pick2')}${verdictHTML(S.z2 === 1)}`, chainHTML(t.r.ch, vals, 4), btn('next', t.next));
      lab.setReadout(cmS(cm), t.subMap, pillTxt, '#3dbd8a');
      lab.setState({ emo: S.z2 === 1 ? '✅' : '🤔', title: z.t2, lead: z.e2, body: '' });
    }
  } else {
    setUI('', chainHTML(t.r.ch, vals, 4), '');
    $('msRow').innerHTML = chips;
    lab.setReadout(cmS(cm), t.subMap, pillTxt, '#3dbd8a');
    lab.setState({ emo: '🔍', title: z.zt(cmS(cm), dist(HL.d)), lead: z.zl, body: z.zb(dist(N / 100)) });
  }
}

function renderPlan(t) {
  const p = t.p, it = ITEMS[S.pi], r = S.it[S.pi], nm = p.it[it.k];
  lab.setGlow('rgba(224,160,61,.26)');
  const chips = ITEMS.map((x, i) => `<button class="chip ${i === S.pi ? 'on' : ''}" data-act="item" data-i="${i}">${x.e} ${esc(p.it[x.k][0])} · ${x.L} × ${x.W} ${esc(t.u.cm)}${S.it[i].phase === 'done' ? ' ✓' : ''}</button>`).join('');
  const Lp = it.L / 50, Wp = it.W / 50;
  const alln = S.it.every((x) => x.phase === 'done');
  if (r.phase === 'draw') {
    setUI('', '', chips + `<button class="btn ms-btn" data-act="check"${r.touched ? '' : ' disabled'}>${esc(t.check)}</button>`);
    lab.setReadout(r.touched ? `${num(r.w, 1)} × ${num(r.h, 1)} ${t.u.cm}` : '—', t.subPaper, '1 : 50', '#e0a03d');
    lab.setState({ emo: it.e, title: p.sTitle(nm[1]), lead: p.sLead, body: p.sBody });
  } else if (r.phase === 'ask') {
    const o = it.ord.map((k) => [cmS(Lp), `${num(it.L)}${NB}${t.u.cm}`, cmS(Lp / 2)][k]);
    setUI(`<div>${esc(p.q[it.k])}</div><div style="height:10px"></div>${optsHTML(o, null, -1, 'pick')}`, '', '');
    lab.setReadout(`${num(r.w, 1)} × ${num(r.h, 1)} ${t.u.cm}`, t.subPaper, '1 : 50', '#e0a03d');
    lab.setState({ emo: '🤔', title: p.aTitle(nm[1]), lead: p.aLead, body: '' });
  } else {
    const o = it.ord.map((k) => [cmS(Lp), `${num(it.L)}${NB}${t.u.cm}`, cmS(Lp / 2)][k]), okI = it.ord.indexOf(0);
    const close = Math.abs(r.w - Lp) <= 0.3 && Math.abs(r.h - Wp) <= 0.3;
    const vals = [cmS(Lp), '× 50', `${num(it.L)}${NB}${t.u.cm}`, `${num(it.L / 100)}${NB}${t.u.m}`];
    setUI(`<div>${esc(p.q[it.k])}</div><div style="height:10px"></div>${optsHTML(o, r.pick, okI, 'pick')}${verdictHTML(r.right)}`,
      chainHTML(p.ch, vals, r.lit), alln ? btn('again', t.again) : btn('next', t.next));
    lab.setReadout(`${num(it.L)} × ${num(it.W)} ${t.u.cm}`, t.subRoom, '1 : 50', '#e0a03d');
    lab.setState({ emo: close ? '✅' : '📐', title: p.rTitle(num(Lp), num(Wp)), lead: close ? p.close : p.off(num(r.w, 1), num(r.h, 1), num(Lp), num(Wp)), body: `${p.rLead(num(it.L), num(it.W))} ${p.rBody}` });
  }
  lab.setFacts(t.facts.plan);
}

// --- the loop ---------------------------------------------------------------------------------------------------------
canvasLoop(cv, (c, w, h, dt, time) => {
  G.w = w; G.h = h; G.U = clamp(Math.floor((Math.min(w, h) - 20) / 11.2), 20, 36); TT = time;
  stepCam(dt);
  if (lab.view === 'plan' && !S.sec) { drawPlan(c, dt); return; }
  drawMapScene(c, dt);
});
render();
</script>
