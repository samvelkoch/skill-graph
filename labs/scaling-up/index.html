const FIX = 60, ING = 1, PRICE = 3, CAP = 120, OVER = 12, UNSOLD = 40; // a shop costs 60 a day, ingredients 1 per cupcake, price 3

const Q0 = 4.8, TRQ = [2.4, 3.4, 4.6], TRC = [0, 20, 60], FRQ = 4.4; // stars: the owner's shop, new bakers by training, franchise partners
const soldAt = (s, D) => Math.min(CAP * s, D);
const overAt = (s) => OVER * (s - 1) ** 2; // managers, vans, an office: grows faster than the number of shops
const profitAt = (s, D) => (PRICE - ING) * soldAt(s, D) - FIX * s - overAt(s);
const bestAt = (D) => { let b = 1; for (let s = 2; s <= 10; s++) if (profitAt(s, D) > profitAt(b, D)) b = s; return b; };
const loyal = (q) => clamp((q - 2) / 2.8, 0.1, 1); // share of the customers who keep coming at that rating
const qsOf = (n, tr, fr) => Array.from({ length: n }, (_, i) => (i === 0 ? Q0 : fr ? FRQ : TRQ[tr]));
const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
const r1 = (x) => Math.round(x * 10) / 10;

  if (lang === 'ru') return `${s} ${d === 0 ? ruPlural(Math.round(a), 'монета', 'монеты', 'монет') : 'монеты'}`;

function shop(c, x, y, w, k = 1, lit = true) {
  if (k <= 0.01) return;
  const h = w;
  c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-w / 2, -h); c.lineJoin = 'round';

  rr(c, w * .15, h * .66, w * .3, h * .22, w * .03);
  c.fillStyle = lit ? lin(c, 0, h * .66, 0, h * .88, [[0, '#ffe3a0'], [1, '#ffb350']]) : '#46435a'; c.fill();

}

    return;
  }
  const ok = S.guessG === 'hill';
  $('gVer').className = `sc-ver ${ok ? 'ok' : 'no'}`;
  $('gVer').innerHTML = `<b>${esc(ok ? t.right : t.no)}</b> ${esc(t.g.ver)}`;
  $('gShopsL').textContent = t.g.shopsL; $('gShopsN').textContent = s; $('gTownL').textContent = t.g.townL; $('gNote').textContent = t.g.townNote;
  document.querySelector('[data-act="g-"]').disabled = s <= 1; document.querySelector('[data-act="g+"]').disabled = s >= 10;
  $('gTowns').innerHTML = TOWNS.map((d, i) => chip(i === S.town ? 'on' : '', 'town', i, `${t.g.towns[i]} · ${d}`)).join('');
  let st;
  if (s === best) st = { emo: '🏆', title: t.g.bTitle, lead: t.g.bLead(s, coin(p)), body: '' };
  else if (cap < D) st = { emo: '🧁', title: t.g.wTitle, lead: t.g.wLead(D, cap), body: t.g.wBody(coin(p)) };
  else st = { emo: '📉', title: t.g.oTitle, lead: t.g.oLead(D, cap), body: t.g.oBody(coin(FIX * s), coin(overAt(s)), coin(p)) };
  lab.setState({ ...st, extra: fine(t) });
  lab.setFacts(t.facts.g);
}

function renderK(t) {
  const k = S.k, fr = S.fr, qs = qsOf(k, S.tr, fr), avg = r1(mean(qs)), avgS = num(avg, 1), total = Math.round(qs.reduce((a, q) => a + 100 * loyal(q), 0));
  const met = goalMet(), open = secret.unlocked();
  if (met && !S.won) { S.won = true; S.winAt = now(); sfx.good(); } else if (!met) S.won = false;
  lab.setGlow('rgba(255, 210, 90, .2)');
  lab.setReadout(`${avgS} ★`, t.shops(k), t.k.cust(total, 100 * k), '#e0a820');
  $('kShopsL').textContent = t.k.shopsL; $('kShopsN').textContent = k; $('kTrL').textContent = t.k.trL;
  document.querySelector('[data-act="k-"]').disabled = k <= 1; document.querySelector('[data-act="k+"]').disabled = k >= (fr ? 8 : 4);
  $('kTr').innerHTML = t.k.tr.map((nm, i) => chip(!fr && i === S.tr ? 'on' : '', 'tr', i, `${nm} · ${TRC[i]} 🪙`, fr)).join('');
  $('kSecs').innerHTML = `<button class="chip secret ${open ? 'open' : ''} ${fr ? 'on' : ''}" data-act="sb">${open ? `🤝 ${esc(t.secChip.b)}` : '🔒 ???'}</button>${chip('', 'rst', undefined, t.k.reset)}`;
  let st;
  if (fr) st = { emo: '🤝', title: t.k.fT, lead: t.k.fL(avgS, t.shops(k)), body: t.k.fB };
  else if (met) st = { emo: '🎉', title: t.k.wonT, lead: t.k.wonL(t.shops(k), avgS), body: t.k.trWhy[S.tr] };
  else if (k === 1) st = { emo: '⭐', title: t.k.sTitle, lead: t.k.sLead, body: t.k.sBody };
  else {
    const i = avg >= 4.5 ? 0 : avg >= 4 ? 1 : avg >= 3.4 ? 2 : 3;
    st = { emo: ['😋', '🙂', '😕', '😟'][i], title: t.k.mids[i], lead: t.k.lead(avgS, t.shops(k)), body: `${t.k.trWhy[S.tr]}${k < 3 ? ` ${t.k.more(3 - k)}` : ''}` };
  }
  lab.setState({ ...st, extra: fine(t) });
  lab.setFacts(t.facts.k);
}
render();
</script>
