// --- pointer: drag the long hand or the ribbon (Day), set the time (Roman), pick a train (Timetable) -----------
const cv = $('cv');
const toDesign = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - G.ox) / G.sc, (ev.clientY - r.top - G.oy) / G.sc]; };
const canDrag = () => { const v = lab.view; return (v === 'day' && S.asked.day) || (v === 'roman' && S.asked.roman && S.sec !== 'gal'); };
function setTime(nt) {
  const v = lab.view, old = v === 'day' ? S.t : S.rt;
  if (nt === old) return;
  if (nt % 5 === 0) sfx.tick();
  if (v === 'day') S.t = nt; else S.rt = nt;
  S.dragged = true; render();
}
function dragMove(ev) {
  const v = lab.view, [x, y] = toDesign(ev);
  if (S.drag === 'rib') { setTime(clamp(Math.round((x - RX0) / RW * 1439), 0, 1439)); return; }
  const deg = (Math.atan2(x - G.cx, -(y - G.cy)) / rad + 360) % 360, M = v === 'day' ? 1440 : 720;
  const d = ((deg / 6 - (S.acc % 60) + 90) % 60) - 30; // the short way round, so the hour hand follows through 12
  S.acc = ((S.acc + d) % M + M) % M;
  setTime(Math.round(S.acc) % M);
}
cv.addEventListener('pointerdown', (ev) => {
  const v = lab.view, [x, y] = toDesign(ev);
  if (v === 'timetable') {
    if (!S.asked.timetable) return;
    const i = G.rows.findIndex((r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
    if (i >= 0) ttPick(i);
    return;
  }
  if (!canDrag()) return;
  const inFace = Math.hypot(x - G.cx, y - G.cy) <= G.R * 1.08;
  const inRib = v === 'day' && x >= RX0 - 8 && x <= RX0 + RW + 8 && y >= 0 && y <= RY + RH + 14;
  if (!inRib && !inFace) return;
  S.drag = inRib ? 'rib' : 'clk';
  if (S.sec === 'mid') S.sec = null;
  S.acc = v === 'day' ? S.t : S.rt;
  cv.setPointerCapture(ev.pointerId);
  dragMove(ev);
});
cv.addEventListener('pointermove', (ev) => { if (S.drag) dragMove(ev); });

  if (v === 'roman') { S.rt = 540; S.acc = 540; }

}

// --- drawing helpers -------------------------------------------------------------------------------------------
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

  rr(c, cx - w / 2, cy - h / 2, w, h, h / 2); c.fillStyle = bg; c.fill();

}

  c.fillStyle = g; c.beginPath(); c.arc(x, y, 24, 0, TAU); c.fill();
  g = c.createRadialGradient(x - 3, y - 3, 1, x, y, 11); g.addColorStop(0, '#ffe08a'); g.addColorStop(0.55, C.sun); g.addColorStop(1, '#e09500');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, 10.5, 0, TAU); c.fill(); c.lineWidth = 1; c.strokeStyle = '#b87400'; c.stroke();
  c.restore();
}

  c.fillStyle = g; c.beginPath(); c.arc(x, y, 20, 0, TAU); c.fill();
  g = c.createRadialGradient(x - 3, y - 3, 1, x, y, 10); g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, C.moon); g.addColorStop(1, '#b4b4b4');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, 9, 0, TAU); c.fill(); c.lineWidth = 1; c.strokeStyle = '#8f8f8f'; c.stroke();
  c.fillStyle = 'rgba(120,120,130,.35)'; c.beginPath(); [[x + 3, y + 2, 2.2], [x - 3, y + 4, 1.4], [x + 1, y - 4, 1.2]].forEach(([a, b, r]) => { c.moveTo(a + r, b); c.arc(a, b, r, 0, TAU); }); c.fill();
  c.restore();
}
function cloud(c, cx, cy, time, alpha) {

  c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 12; c.shadowOffsetY = 5;

  c.fillStyle = g; c.beginPath();
  [[-48, 4, 20], [-22, -12, 26], [14, -16, 28], [46, -2, 22], [70, 8, 14]].forEach(([x, y, r]) => { c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU); });
  c.roundRect(-68, 0, 150, 26, 13); c.fill();
  c.shadowColor = 'transparent'; c.fillStyle = C.night; c.font = '900 28px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 8, 8);
  c.restore();
}

  c.beginPath(); c.moveTo(-w / 2, 16); c.lineTo(-w * 0.34, -len + 10); c.lineTo(0, -len); c.lineTo(w * 0.34, -len + 10); c.lineTo(w / 2, 16); c.closePath();

// one clock face, drawn in a 140-radius box and scaled to R.
// o: { hv minutes (0..720), nums 'two' | 'roman', ringA 0..1 (outer 13–24 ring), lap2, hr (hour to light, 0 = none),
//      numA 0..1 (numerals shown, dots otherwise), four 'IV' | 'IIII', style, handle, time, pulse4 0..1, mark4 }
function drawFace(c, cx, cy, R, o) {
  const k = R / 140, st = o.style ?? STY.classic, roman = o.nums === 'roman', numA = o.numA ?? 1, ringA = o.ringA ?? 0;
  c.save(); c.translate(cx, cy); c.scale(k, k); c.lineJoin = 'round'; c.lineCap = 'round';
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 26 * k; c.shadowOffsetY = 10 * k;
  c.fillStyle = st.rim[2]; c.beginPath(); c.arc(0, 0, 140, 0, TAU); c.fill(); c.restore();
  let g = c.createRadialGradient(-50, -60, 10, 0, 0, 148);
  g.addColorStop(0, st.rim[0]); g.addColorStop(0.55, st.rim[1]); g.addColorStop(1, st.rim[2]);
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, 140, 0, TAU); c.fill(); c.lineWidth = 2; c.strokeStyle = st.rim[3]; c.stroke();
  g = c.createLinearGradient(-90, -100, 90, 100); g.addColorStop(0, st.rim[2]); g.addColorStop(1, st.rim[0]);
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, 130, 0, TAU); c.fill();
  g = c.createRadialGradient(-30, -40, 10, 0, 0, 128); g.addColorStop(0, st.face[0]); g.addColorStop(1, st.face[1]);
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, 126, 0, TAU); c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(0,0,0,.28)'; c.stroke();
  // the outer 13–24 ring
  if (!roman && ringA > 0.01) {
    c.save(); c.globalAlpha = ringA;
    c.fillStyle = rgba(C.teal, 0.2); c.beginPath(); c.arc(0, 0, 126, 0, TAU); c.arc(0, 0, 83, 0, TAU, true); c.fill();
    c.lineWidth = 1.5; c.strokeStyle = rgba(C.teal, 0.75); c.beginPath(); c.arc(0, 0, 83, 0, TAU); c.stroke();
    c.restore();
  }

    c.beginPath(); c.moveTo(Math.sin(a) * r1, -Math.cos(a) * r1); c.lineTo(Math.sin(a) * r2, -Math.cos(a) * r2); c.stroke();

      if (lit && numA > 0.01) {
        c.globalAlpha = numA; const gg = c.createRadialGradient(x - 6, y - 6, 2, x, y, 26); gg.addColorStop(0, '#ffd45e'); gg.addColorStop(1, C.sun);
        c.fillStyle = gg; c.beginPath(); c.arc(x, y, 24, 0, TAU); c.fill(); c.lineWidth = 2; c.strokeStyle = '#a87000'; c.stroke();
      }
      c.globalAlpha = numA; c.fillStyle = st.ink; c.font = "700 28px 'EB Garamond', Georgia, serif";
      c.fillText(h === 4 && o.four === 'IIII' ? 'IIII' : ROMAN[h - 1], x, y + 1);
      if (h === 4 && (o.pulse4 > 0.01 || o.mark4)) {
        c.globalAlpha = o.mark4 ? 1 : o.pulse4; c.lineWidth = 3; c.strokeStyle = C.sun; c.beginPath(); c.arc(x, y, 27 + (o.mark4 ? 0 : (1 - o.pulse4) * 10), 0, TAU); c.stroke();
      }
      c.globalAlpha = 1;
    } else {
      const x = sx * 62, y = sy * 62;
      if (lit) {
        const gg = c.createRadialGradient(x - 5, y - 5, 2, x, y, 20); gg.addColorStop(0, '#ffd45e'); gg.addColorStop(1, C.sun);
        c.fillStyle = gg; c.beginPath(); c.arc(x, y, 18, 0, TAU); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#a87000'; c.stroke();
      }
      c.fillStyle = st.ink; c.font = '900 22px Nunito, sans-serif'; c.fillText(h, x, y + 1);
      if (ringA > 0.01) {
        const X = sx * 102, Y = sy * 102, lit2 = lit && o.lap2;
        c.globalAlpha = ringA;
        if (lit2) { c.fillStyle = C.teal; c.beginPath(); c.arc(X, Y, 15, 0, TAU); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#1c6f65'; c.stroke(); }
        c.fillStyle = lit2 ? '#fff' : C.teal; c.font = '900 16px Nunito, sans-serif'; c.fillText(h + 12, X, Y + 1);
        c.globalAlpha = 1;

  const ah = (o.hv / 720) * 360, am = (o.hv % 60) * 6, hl = roman ? 54 : 48, ml = roman ? 112 : 114;
  hand(c, ah, hl, 10, 'rgba(0,0,0,.25)', 3, 4); hand(c, am, ml, 6, 'rgba(0,0,0,.25)', 3, 4);

  g = c.createRadialGradient(-3, -3, 1, 0, 0, 10); g.addColorStop(0, st.rim[0]); g.addColorStop(1, st.rim[2]);
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, 9, 0, TAU); c.fill(); c.lineWidth = 1.5; c.strokeStyle = st.ink; c.stroke();
  c.fillStyle = st.ink; c.beginPath(); c.arc(0, 0, 3, 0, TAU); c.fill();
  c.restore();
}

// --- Day: the sky ribbon, the lap counter, the digital readout, the clock -------------------------------------
function calendar(c, x, y, num, sy) {
  c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 10; c.shadowOffsetY = 4;
  rr(c, x, y, 58, 56, 8); c.fillStyle = C.cream; c.fill(); c.restore();
  c.save(); rr(c, x, y, 58, 56, 8); c.clip();
  c.fillStyle = C.teal; c.fillRect(x, y, 58, 15); c.restore();
  rr(c, x, y, 58, 56, 8); c.lineWidth = 1.5; c.strokeStyle = '#1c6f65'; c.stroke();
  c.fillStyle = C.cream; [x + 14, x + 44].forEach((px) => { c.beginPath(); c.arc(px, y + 7, 3, 0, TAU); c.fill(); });
  c.save(); c.translate(x + 29, y + 36); c.scale(1, Math.max(0.02, sy));
  c.fillStyle = C.ink; c.font = '900 28px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(num, 0, 1); c.restore();
}
function drawDay(c, time) {
  const t = S.t, asking = !S.asked.day, mid = S.sec === 'mid', lap2 = t >= 720;
  // ribbon: the sky of the whole day, midnight to midnight
  c.save(); rr(c, RX0, RY, RW, RH, 14); c.clip();
  let g = c.createLinearGradient(RX0, 0, RX0 + RW, 0);
  for (let i = 0; i <= 24; i++) g.addColorStop(i / 24, sky(i * 60));
  c.fillStyle = g; c.fillRect(RX0, RY, RW, RH);
  g = c.createLinearGradient(0, RY, 0, RY + RH); g.addColorStop(0, 'rgba(255,255,255,.2)'); g.addColorStop(0.6, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(RX0, RY, RW, RH);
  for (const s of STARS) {
    const a = (1 - daylight(s.f * 1440)) * (0.45 + 0.4 * Math.sin(time * 1.7 + s.p));
    if (a > 0.02) { c.fillStyle = `rgba(255,255,255,${a})`; c.beginPath(); c.arc(RX0 + s.f * RW, RY + s.y, s.r, 0, TAU); c.fill(); }
  }
  for (let i = 0; i <= 24; i++) { // the paths of the sun and the moon
    const u = i / 24, x = RX0 + RW * (0.25 + 0.5 * u), y = GY - Math.sin(Math.PI * u) * AMP;
    c.fillStyle = rgba(C.sun, 0.5); c.beginPath(); c.arc(x, y, 1.5, 0, TAU); c.fill();
    const xm = RX0 + RW * ((0.75 + 0.5 * u) % 1);
    c.fillStyle = rgba(C.moon, 0.32); c.beginPath(); c.arc(xm, y, 1.5, 0, TAU); c.fill();
  }
  const mx = RX0 + RW * t / 1440, su = (t - 360) / 720, mo = ((t - 1080 + 1440) % 1440) / 720;
  if (su > -0.15 && su < 1.15) sunDisc(c, mx, GY - Math.sin(Math.PI * su) * AMP);
  if (mo > -0.15 && mo < 1.15) moonDisc(c, mx, GY - Math.sin(Math.PI * mo) * AMP);
  [['#101b33', -3, 5, 0.045, 1], ['#0a1224', 4, 3, 0.07, 2.4]].forEach(([col, off, amp, fr, ph]) => {
    c.fillStyle = col; c.beginPath(); c.moveTo(RX0, RY + RH + 2);
    for (let x = RX0; x <= RX0 + RW; x += 4) c.lineTo(x, GY + off + amp * Math.sin(x * fr + ph) + 2 * Math.sin(x * 0.11));
    c.lineTo(RX0 + RW, RY + RH + 2); c.closePath(); c.fill();
  });
  c.restore();
  rr(c, RX0, RY, RW, RH, 14); c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,.3)'; c.stroke();
  // the marker: a line with a pointer on top
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2; c.beginPath(); c.moveTo(mx, RY); c.lineTo(mx, RY + RH); c.stroke();
  c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 5; c.fillStyle = '#fff'; c.beginPath(); c.moveTo(mx - 8, 3); c.lineTo(mx + 8, 3); c.lineTo(mx, RY + 3); c.closePath(); c.fill(); c.restore();
  if (!asking) {
    // the two laps under the ribbon, and the hours
    const hw = RW / 2 - 2;
    [[RX0, C.cream, 1 - S.lapMix], [RX0 + RW / 2 + 2, C.teal, 0.35 + 0.65 * S.lapMix]].forEach(([x, col, a], i) => {
      c.globalAlpha = i === 0 ? 0.35 + 0.65 * a : a; rr(c, x, 74, hw, 5, 2.5); c.fillStyle = col; c.fill();
    });
    c.globalAlpha = 1; c.fillStyle = '#98A0B8'; c.font = '800 16px Nunito, sans-serif'; c.textBaseline = 'middle';
    [0, 6, 12, 18, 24].forEach((h) => { c.textAlign = h === 0 ? 'left' : h === 24 ? 'right' : 'center'; c.fillText(pad(h), RX0 + RW * h / 24, 92); });
    // lap counter or, in the secret, the calendar
    if (mid) {
      const e = time - S.m0, k = clamp((e - 2.5) / 0.6, 0, 1);
      calendar(c, 22, 100, k < 0.5 ? S.date : S.date + 1, k < 0.5 ? 1 - 2 * k : 2 * k - 1);
    } else {
      rr(c, 22, 108, 128, 38, 19); c.fillStyle = 'rgba(20, 33, 61, .88)'; c.fill();
      c.lineWidth = 1.5; c.strokeStyle = mixHex(C.cream, C.teal, S.lapMix); c.stroke();
      c.globalAlpha = 1 - 0.65 * S.lapMix; c.fillStyle = C.cream; c.beginPath(); c.arc(42, 127, 5, 0, TAU); c.fill();
      c.globalAlpha = 0.35 + 0.65 * S.lapMix; c.fillStyle = '#45c9b8'; c.beginPath(); c.arc(58, 127, 5, 0, TAU); c.fill(); c.globalAlpha = 1;
      c.fillStyle = mixHex(C.cream, '#7fe3d6', S.lapMix); c.font = '800 16px Nunito, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
      c.fillText(lap2 ? T[lang].lap2 : T[lang].lap1, 72, 128);
    }
  }
  // digital readout (under a cloud until the prediction is answered)
  const DX = 160, DY = 104, DW = 178, DH = 46;
  g = c.createLinearGradient(0, DY, 0, DY + DH); g.addColorStop(0, '#0b1222'); g.addColorStop(1, '#16264a');
  rr(c, DX, DY, DW, DH, 12); c.fillStyle = g; c.fill(); c.lineWidth = 2; c.strokeStyle = C.brass; c.stroke();
  if (!asking) {
    const col = mixHex(C.sun, '#45c9b8', mid ? (t >= 720 ? 1 : 0) : S.lapMix);
    c.save(); c.shadowColor = rgba(col, 0.6); c.shadowBlur = 10; c.fillStyle = col; c.font = '900 32px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(mid ? dig24(t) : dig(t), DX + DW / 2, DY + DH / 2 + 2); c.restore();
  }
  cloud(c, DX + DW / 2 - 8, DY + DH / 2 - 4 - 40 * (1 - S.cloudA), time, S.cloudA);
  // the clock with its two rings
  G.cx = 180; G.cy = 316; G.R = 140;
  drawFace(c, 180, 316, 140, { hv: S.hv, nums: 'two', ringA: S.ringA, lap2, hr: h12(t), handle: !asking, pulse: !S.dragged, time, numA: 1 });
}

// --- Timetable: the station board and the clock -----------------------------------------------------------------
function drawTT(c, time) {
  c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 16; c.shadowOffsetY = 6;
  let g = c.createLinearGradient(0, 8, 0, 222); g.addColorStop(0, '#222a42'); g.addColorStop(1, '#0f1424');
  rr(c, 14, 8, 332, 214, 16); c.fillStyle = g; c.fill(); c.restore();
  rr(c, 14, 8, 332, 214, 16); c.lineWidth = 2.5; c.strokeStyle = C.brass; c.stroke();
  c.fillStyle = C.sun; c.font = '800 16px Nunito, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText('🚆  ' + T[lang].board.toUpperCase(), 30, 28);
  G.rows = [];
  TT.forEach((tm, i) => {
    const x = 24, y = 48 + i * 42, w = 312, h = 38, sel = S.sel === i, done = S.mDone.some((d, j) => d && TARGET[j] === i);
    G.rows.push({ x, y, w, h });
    const bad = S.flashI === i ? clamp(1 - (time - S.flashT) / 0.9, 0, 1) : 0;
    rr(c, x, y, w, h, 10); c.fillStyle = sel ? 'rgba(255,183,3,.14)' : 'rgba(255,255,255,.05)'; c.fill();
    c.lineWidth = sel || done || bad ? 2 : 1; c.strokeStyle = bad > 0.01 ? `rgba(255,59,48,${0.3 + 0.7 * bad})` : done ? '#3ddc97' : sel ? C.sun : 'rgba(255,255,255,.12)'; c.stroke();
    const s = dig24(tm);
    for (let j = 0, px = 34; j < 5; j++) {
      const colon = j === 2, tw = colon ? 10 : 21;
      if (colon) { c.fillStyle = C.sun; c.beginPath(); c.arc(px + 5, y + 14, 2, 0, TAU); c.arc(px + 5, y + 24, 2, 0, TAU); c.fill(); }
      else {
        const k = clamp((time - S.viewAt - j * 0.07 - i * 0.12) / 0.3, 0, 1), sy = Math.abs(Math.cos(k * Math.PI)) * 0.98 + 0.02;
        const tg = c.createLinearGradient(0, y + 4, 0, y + 34); tg.addColorStop(0, '#343b57'); tg.addColorStop(1, '#1a1f33');
        rr(c, px, y + 4, tw, 30, 4); c.fillStyle = tg; c.fill();
        c.save(); c.translate(px + tw / 2, y + 19); c.scale(1, sy);
        c.fillStyle = sel ? '#ffd45e' : C.sun; c.font = '900 22px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(k < 0.5 ? '8' : s[j], 0, 1); c.restore();
        c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(px, y + 18.5, tw, 1.5);
      }
      px += tw + 2;
    }
    c.fillStyle = 'rgba(255,255,255,.14)';
    rr(c, 160, y + 11, 70 + (i * 23) % 50, 6, 3); c.fill(); rr(c, 160, y + 22, 38 + (i * 31) % 40, 6, 3); c.fill();
    if (done) { c.fillStyle = '#3ddc97'; c.beginPath(); c.arc(264, y + 19, 9, 0, TAU); c.fill(); c.strokeStyle = '#0f3a28'; c.lineWidth = 2.2; c.beginPath(); c.moveTo(259.5, y + 19.5); c.lineTo(263, y + 23); c.lineTo(269, y + 15); c.stroke(); }
    rr(c, 296, y + 6, 26, 26, 7); c.fillStyle = C.sun; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#a87000'; c.stroke();
    c.fillStyle = C.night; c.font = '900 17px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(PLATFORM[i], 309, y + 20);
  });
  const sel = S.sel, tm = sel === null ? 0 : TT[sel];
  G.cx = 180; G.cy = 354; G.R = 116;
  drawFace(c, 180, 354, 116, { hv: S.hv, nums: 'two', ringA: S.ringA, lap2: tm >= 720 && sel !== null, hr: sel === null ? 0 : h12(tm), time, numA: 1 });
}

// --- Roman: numerals on the face, and the gallery of three clocks ---------------------------------------------------
function drawRoman(c, time) {
  const asking = !S.asked.roman, hr = h12(S.rt);
  G.cx = 180; G.cy = 264; G.R = 152;
  drawFace(c, 180, 264, 152, { hv: S.hv, nums: 'roman', hr: asking ? 0 : hr, numA: S.numA, four: S.four, handle: !asking, pulse: !S.dragged, time, pulse4: clamp(1 - (time - S.f4) / 0.9, 0, 1) });
  if (!asking) pill(c, `${numeral(hr)} = ${dec(hr)}`, 180, 40, '900 26px Nunito, sans-serif', '#fff', 'rgba(10, 14, 28, .82)', 18, 44);
  if (!asking) pill(c, T[lang].fourCaption, 180, 452, '700 16px Nunito, sans-serif', '#EDEFF7', 'rgba(10, 14, 28, .82)', 12, 30);
}
function drawGallery(c, time) {
  const rows = [[STY.classic, 'IIII', null], [STY.station, 'IIII', null], [STY.ben, 'IV', T[lang].bigBen]];
  rows.forEach(([style, four, name], i) => {
    const cy = 84 + i * 156;
    G.cx = 96; G.cy = cy; G.R = 68;
    drawFace(c, 96, cy, 68, { hv: 610, nums: 'roman', numA: 1, four, style, mark4: true, time });
    c.fillStyle = '#fff'; c.font = "500 54px 'EB Garamond', Georgia, serif"; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(four, 262, cy - (name ? 10 : 0));
    if (name) pill(c, name, 262, cy + 30, '800 16px Nunito, sans-serif', '#EDEFF7', 'rgba(10, 14, 28, .82)', 12, 28);
  });
}

// --- per-frame animation state ----------------------------------------------------------------------------------
function step(dt, time) {
  const v = lab.view, asked = S.asked[v];
  if (S.sec === 'mid') { // the secret: 21:30 → 23:59, a pause, then the day turns over
    const e = time - S.m0, nt = e < 1.7 ? Math.round(lerp(1290, 1439, ease(e / 1.7))) : e < 2.5 ? 1439 : 0;
    if (nt !== S.t) { S.t = nt; S.acc = nt; render(); }
  }
  const tgt = v === 'day' ? S.t % 720 : v === 'timetable' ? (S.sel === null ? 0 : TT[S.sel] % 720) : S.sec === 'gal' ? 610 : S.rt % 720;
  if (S.drag) S.hv = tgt;
  else {
    const d = (((tgt - S.hv + 360) % 720) + 720) % 720 - 360;
    S.hv = Math.abs(d) < 0.05 ? tgt : (S.hv + d * Math.min(1, dt * 8) + 720) % 720;
  }
  const ringT = v === 'day' ? (asked ? (S.t >= 720 ? 1 : 0.28) : 0) : v === 'timetable' ? (!asked ? 0 : S.sel !== null && TT[S.sel] >= 720 ? 1 : 0.28) : 0;
  S.ringA += (ringT - S.ringA) * Math.min(1, dt * 6);
  S.lapMix += ((S.t >= 720 ? 1 : 0) - S.lapMix) * Math.min(1, dt * 8);
  S.numA += ((S.asked.roman ? 1 : 0) - S.numA) * Math.min(1, dt * 5);
  S.cloudA += ((S.asked.day ? 0 : 1) - S.cloudA) * Math.min(1, dt * 4);
  if (v === 'day') { const g = rgba(sky(S.t), 0.34); if (g !== S.glow) { S.glow = g; lab.setGlow(g); } }
}

canvasLoop(cv, (c, w, h, dt, time) => {
  const sc = Math.min(w / W, h / H); G.sc = sc; G.ox = (w - W * sc) / 2; G.oy = (h - H * sc) / 2;
  step(dt, time);
  c.save(); c.translate(G.ox, G.oy); c.scale(sc, sc); c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'day') drawDay(c, time); else if (v === 'timetable') drawTT(c, time); else if (S.sec === 'gal') drawGallery(c, time); else drawRoman(c, time);
  c.restore();
});
render();
</script>
