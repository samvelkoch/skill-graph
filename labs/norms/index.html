  const t = T[lang].belt, y = S.belt.year; panel(c, '#26304a', '#0e1124');

  [[70, 1], [270, 3]].forEach(([x, k]) => { c.fillStyle = 'rgba(255,255,255,.05)'; rr(c, x - 54, 10, 108, 150, 14); c.fill(); figure(c, k, x, 84, false, 0); wtxt(c, T[lang].sort.chutes[k], x, 138, 100, 15, { size: 13 }); });
  const cx = 70 + mv * 200, cy = 190;
  c.save(); c.translate(cx, cy); c.rotate(Math.sin(time * 2) * .02); rr(c, -75, -16, 150, 32, 10);
  c.fillStyle = lg(c, 0, -16, 0, 16, [[0, '#fffaf0'], [1, '#e8dcc0']]); c.fill(); c.strokeStyle = '#a89868'; c.lineWidth = 1.5; c.stroke(); txt(c, t.card, 0, 0.5, { size: 14, color: '#2a2418', w: 900 }); c.restore();
  if (y >= 1970) { c.strokeStyle = '#ffd24d'; c.setLineDash([4, 4]); c.lineWidth = 2; c.beginPath(); c.moveTo(cx - 10, 207); c.lineTo(cx - 10, 224); c.stroke(); c.setLineDash([]); }
  // car + driver
  shadow(c, 170, 300, 90, 8);
  rr(c, 90, 250, 160, 44, 18); c.fillStyle = lg(c, 90, 250, 90, 294, [[0, '#6aa8ff'], [1, '#2f5fc0']]); c.fill(); c.strokeStyle = '#1d3d82'; c.lineWidth = 2; c.stroke();
  rr(c, 120, 226, 90, 34, 14); c.fillStyle = 'rgba(200,225,255,.85)'; c.fill(); c.stroke();
  face(c, 160, 244, 13, '#ffd0a0', { mood: 'smile' });
  if (y >= 1970) { c.strokeStyle = '#ffd24d'; c.lineWidth = 3.5; c.beginPath(); c.moveTo(150, 232); c.lineTo(172, 262); c.stroke(); }
  [125, 215].forEach((x) => { ball(c, x, 296, 13, '#2a2f40'); ball(c, x, 296, 5, '#aab4cc'); });
  // timeline
  const tx = (yr) => 20 + (yr - 1955) / 35 * 300;
  c.strokeStyle = '#6b7599'; c.lineWidth = 3; c.beginPath(); c.moveTo(tx(1955), 340); c.lineTo(tx(1990), 340); c.stroke();
  [1959, 1970, 1983].forEach((m) => { c.fillStyle = y >= m ? '#ffd24d' : '#3a4260'; c.beginPath(); c.arc(tx(m), 340, 6, 0, TAU); c.fill(); txt(c, String(m), tx(m), 358, { size: 13, color: '#c6cde0' }); });
  c.fillStyle = '#fff'; c.beginPath(); c.arc(tx(y), 340, 8, 0, TAU); c.fill(); c.strokeStyle = '#ff3b30'; c.lineWidth = 2.5; c.stroke();
  const last = [1983, 1970, 1959].find((m) => y >= m); if (last) pill(c, t.mk[last], 170, 382, { size: 13 });
}

// --- canvas loop -------------------------------------------------------------------------------------------
const cv = $('cv');
canvasLoop(cv, (c, w, h, dt, time) => {
  const key = S.sec || lab.view; [DW, DH] = BOX[key];
  const s = Math.min(w / DW, h / DH); V = { s, ox: (w - DW * s) / 2, oy: (h - DH * s) / 2 };
  hits.length = 0; c.save(); c.translate(V.ox, V.oy); c.scale(s, s);
  c.save(); rr(c, 0, 0, DW, DH, 18); c.clip();
  ({ sort: drawSort, deal: drawDeal, age: drawAge, pyr: drawPyr, belt: drawBelt })[key](c, dt, time);
  c.restore(); c.restore();
});
cv.addEventListener('pointerdown', (e) => {
  const [x, y] = toDesign(e.clientX, e.clientY);
  for (let i = hits.length - 1; i >= 0; i--) { const q = hits[i]; if (x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h) { q.fn(); return; } }
});

// --- controls ----------------------------------------------------------------------------------------------
$('ctrlBody').innerHTML = `
  <div id="secSort"><div class="nm-row"><button class="nm-btn" id="bSort" data-act="sort"></button></div></div>
  <div id="secDeal"><div class="nm-row" id="dealChips"></div><div id="dealQ"></div></div>
  <div id="secAge"><div class="chips" id="ageCt"></div><div id="agePred" style="margin-top:12px"></div>
    <input class="big" type="range" id="ageR" min="0" max="20" step="1" value="12" style="margin-top:8px"></div>
  <div id="secPyr"><div class="nm-row" id="pyTray"></div><div id="pyTest"></div></div>
  <div id="secBelt"><input class="big" type="range" id="yearR" min="1955" max="1990" step="1" value="1962"></div>
  <div class="nm-row" id="secRow"></div>`;
const btn = (act, label, extra = '', cls = '') => `<button class="nm-btn ${cls}" data-act="${act}" ${extra}>${esc(label)}</button>`;

function resetSort() { S.res = []; Object.assign(S.sort, { ci: 0, pick: [false, false, false, false], phase: 'pick', t: 0 }); }
function resetDeal() { Object.assign(S.deal, { placed: [], sel: null, phase: 0, ans: null, msg: null, flash: null, t2: 0 }); }
function resetPyr() { Object.assign(S.pyr, { slots: [null, null, null, null], sel: null, test: null, guess: null, res: false, fallT: 0, msg: null }); }

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'sort') {
    const q = S.sort;
    if (q.phase === 'pick' && q.pick.some(Boolean)) { q.phase = 'fall'; q.t = 0; sfx.push(); showStage(); }
    else if (q.phase === 'shown') { q.ci++; q.pick = [false, false, false, false]; q.t = 0; q.phase = q.ci >= 10 ? 'end' : 'pick'; sfx.click(); }
    else if (q.phase === 'end') { resetSort(); sfx.click(); }
  } else if (a === 'dq') {
    const d = S.deal; d.ans = i; d.phase = 2; d.t2 = 0; (i === T[lang].deal.ok ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'dagain') { resetDeal(); sfx.click(); }
  else if (a === 'cc') { S.age.cc = i; sfx.tick(); }
  else if (a === 'gdec') { S.age.g = clamp(S.age.g - 1, 8, 18); sfx.tick(); }
  else if (a === 'ginc') { S.age.g = clamp(S.age.g + 1, 8, 18); sfx.tick(); }
  else if (a === 'reveal') { const A = S.age; A.pred[A.cc] = A.g; A.rev[A.cc] = true; A.revT = 0; const ok = A.g === CR[A.cc]; (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = b.dataset.k === 'a' ? 'pyr' : 'belt'; if (S.sec === 'pyr') resetPyr(); sfx.click();
  } else if (a === 'back') { S.sec = null; sfx.click(); }
  else if (a === 'pchip') { S.pyr.sel = S.pyr.sel === i ? null : i; S.pyr.msg = null; sfx.tick(); }
  else if (a === 'prule') { S.pyr.test = i; S.pyr.guess = null; S.pyr.res = false; S.pyr.fallT = 0; sfx.click(); }
  else if (a === 'pg') { const P = S.pyr; P.guess = i; P.res = true; P.fallT = 0; (i === (P.test === 0 ? 1 : 0) ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'pagain') { resetPyr(); sfx.click(); }
  render();
});
$('ageR').addEventListener('input', (e) => { S.age.age = +e.target.value; render(); });
$('yearR').addEventListener('input', (e) => { S.belt.year = +e.target.value; render(); });
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };

// drag (or tap) the labels of the deal
$('dealChips').addEventListener('pointerdown', (e) => {
  const b = e.target.closest('[data-chip]'); if (!b) return; const id = +b.dataset.chip, sx = e.clientX, sy = e.clientY; let moved = false, ghost = null;
  try { b.setPointerCapture(e.pointerId); } catch (_) { /* no capture */ }
  const mv = (ev) => {
    if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) { moved = true; ghost = document.createElement('div'); ghost.className = 'nm-ghost'; ghost.textContent = b.textContent; document.body.append(ghost); b.style.opacity = .4; }
    if (ghost) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; }
  };
  const up = (ev) => {
    b.removeEventListener('pointermove', mv); b.removeEventListener('pointerup', up); b.removeEventListener('pointercancel', up); ghost?.remove(); b.style.opacity = '';
    if (moved) { const [x, y] = toDesign(ev.clientX, ev.clientY); const s = SLOT_RECT.findIndex((R) => x >= R.x && x <= R.x + R.w && y >= R.y && y <= R.y + R.h); if (s >= 0) return placeChip(id, s); }
    else { S.deal.sel = S.deal.sel === id ? null : id; sfx.tick(); }
    render();
  };
  b.addEventListener('pointermove', mv); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
});

// --- render ------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, key = S.sec || v;
  document.body.dataset.v = key;
  S.age.cc ??= OWN[lang] ?? 0;
  const show = { sort: 'secSort', deal: 'secDeal', age: 'secAge', pyr: 'secPyr', belt: 'secBelt' };
  Object.entries(show).forEach(([k, id]) => { $(id).style.display = k === key ? '' : 'none'; });
  ({ sort: renderSort, deal: renderDeal, age: renderAge, pyr: renderPyr, belt: renderBelt })[key](t);
  lab.setFacts(t.facts[v]);
  const u = secret.unlocked();
  $('secRow').innerHTML = (S.sec ? `<button class="nm-chip c" data-act="back">${esc(t.back)}</button>` : '')
    + ['a', 'b'].map((k) => `<button class="nm-chip c ${S.sec === (k === 'a' ? 'pyr' : 'belt') ? 'on' : ''}" data-act="sec" data-k="${k}">${u ? (k === 'a' ? '🏛️' : '🚗') : '🔒'} ${esc(t.sec[k][0])}</button>`).join('');
}
function renderSort(t) {
  const st = t.sort, q = S.sort, k = S.res.filter((r) => r === 'exact').length, b = $('bSort');
  lab.setReadout(`${Math.min(q.ci + 1, 10)} / 10`, st.word, k ? `✔ ${k}` : '');
  if (q.phase === 'pick') { b.textContent = st.drop; b.disabled = !q.pick.some(Boolean); lab.setState({ emo: '🧰', title: st.pickT, lead: st.pickL, body: '' }); }
  else if (q.phase === 'fall') { b.textContent = st.drop; b.disabled = true; lab.setState({ emo: '⚙️', title: st.rattle, lead: '', body: '' }); }
  else if (q.phase === 'shown') {
    const card = st.cards[q.ci], r = S.res[q.ci]; b.disabled = false; b.textContent = st.next;
    lab.setState({ emo: r === 'exact' ? '✅' : '🔍', title: r === 'exact' ? t.deal.right : r === 'part' ? st.part : st.miss, lead: st.real + card.c.map((i) => st.chutes[i]).join(' + '), body: card.why });
  } else { b.disabled = false; b.textContent = t.again; lab.setState({ emo: '🏁', title: st.end(k), lead: st.endL, body: '' }); }
}
function renderDeal(t) {
  const d = T[lang].deal, D = S.deal, chips = d.chips(t.price), q = $('dealQ');
  lab.setReadout(`${D.placed.length} / 6`, '', '');
  $('dealChips').style.display = D.phase === 0 ? '' : 'none';
  $('dealChips').innerHTML = DEAL_ORDER.filter((id) => !D.placed.includes(id)).map((id) => `<button class="nm-chip ${D.sel === id ? 'on' : ''}" data-chip="${id}">${esc(chips[id])}</button>`).join('');
  q.innerHTML = '';
  if (D.phase === 0) lab.setState(D.msg ? { emo: '✋', title: D.msg, lead: '', body: '' } : { emo: '🚲', title: d.t0, lead: d.l0(t.price), body: '' });
  else if (D.phase === 1) {
    lab.setState({ emo: '🔧', title: d.tw, lead: d.twL, body: '' });
    q.innerHTML = `<p class="nm-q">${esc(d.q)}</p><div class="nm-row" style="flex-direction:column;align-items:stretch">${d.opts.map((o, i) => `<button class="nm-chip c" data-act="dq" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  } else {
    const ok = D.ans === d.ok;
    lab.setState({ emo: ok ? '✅' : '🔍', title: ok ? d.right : d.wrongV, lead: (ok ? '' : d.wrongL + ' ') + d.ll, body: '' });
    q.innerHTML = `<div class="nm-row">${btn('dagain', t.again, '', 'ghost')}</div>`;
  }
}
function renderAge(t) {
  const a = t.age, A = S.age, cc = A.cc, rev = A.rev[cc];
  lab.setReadout(String(A.age), a.yrs(A.age), `${FLAG[cc]} ${CODE[cc]}`);
  $('ageR').value = A.age;
  $('ageCt').innerHTML = cOrder().map((i) => `<button class="chip ${i === cc ? 'on' : ''}" data-act="cc" data-i="${i}" style="min-height:38px">${FLAG[i]} ${CODE[i]}</button>`).join('');
  $('agePred').innerHTML = rev ? '' : `<p class="nm-q">${esc(a.q)}</p><div class="nm-row"><div class="nm-step"><button data-act="gdec">−</button><b>${A.g}</b><button data-act="ginc">+</button></div><button class="nm-btn" data-act="reveal">${esc(a.reveal)}</button></div>`;
  const yn = (ok) => (ok ? a.yes : a.no), age = A.age;
  const parts = [`${a.short[1]}: ${PUR[cc] === null ? a.none : yn(age >= PUR[cc])}`, `${a.short[2]}: ${ERN[cc] === null ? a.none : yn(age >= ERN[cc])}`, `${a.short[3]}: ${yn(age >= 18)}`];
  const crim = !rev ? '?' : age >= CR[cc] ? a.yes : LOW[cc] !== null && age >= LOW[cc] ? a.gravest : a.no;
  parts.unshift(`${a.short[0]}: ${crim}`);
  if (rev) { const g = A.pred[cc], ok = g === CR[cc]; lab.setState({ emo: ok ? '✅' : '🔍', title: ok ? a.right : a.wrongV(g, CR[cc]), lead: `${a.cn[cc]}: ${a.cr[cc]}`, body: `${age}: ${parts.join(' · ')}` }); }
  else lab.setState({ emo: '🎂', title: a.t(a.cn[cc], age), lead: a.leadPre, body: parts.join(' · ') });
}
function renderPyr(t) {
  const p = t.pyr, P = S.pyr, all = P.slots.every((x) => x !== null);
  lab.setReadout(`${P.slots.filter((x) => x !== null).length} / 4`, '', '');
  $('pyTray').innerHTML = PYR_ORDER.filter((id) => !P.slots.includes(id)).map((id) => `<button class="nm-chip c ${P.sel === id ? 'on' : ''}" data-act="pchip" data-i="${id}">${esc(p.tiers[id])}</button>`).join('');
  const te = $('pyTest'); te.innerHTML = '';
  if (!all) lab.setState({ emo: '🏛️', title: P.msg || p.t, lead: P.msg ? '' : p.l, body: '' });
  else if (P.test === null) { lab.setState({ emo: '🏛️', title: p.t, lead: p.done, body: '' }); te.innerHTML = `<p class="nm-q">${esc(p.pick)}</p><div class="nm-row" style="flex-direction:column;align-items:stretch">${p.rules.map((r, i) => `<button class="nm-chip c" data-act="prule" data-i="${i}">${esc(r)}</button>`).join('')}</div>`; }
  else if (!P.res) { lab.setState({ emo: '🏛️', title: p.t, lead: p.done, body: '' }); te.innerHTML = `<p class="nm-q">${esc(p.rules[P.test])}</p><div class="nm-row">${p.g.map((g, i) => `<button class="nm-chip c" data-act="pg" data-i="${i}">${esc(g)}</button>`).join('')}</div>`; }
  else { const ok = P.guess === (P.test === 0 ? 1 : 0); lab.setState({ emo: ok ? '✅' : '🔍', title: ok ? p.right : p.wrongV, lead: P.test === 0 ? p.fall : p.stay, body: '' }); te.innerHTML = `<div class="nm-row">${btn('pagain', t.again, '', 'ghost')}</div>`; }
}
function renderBelt(t) {
  const b = t.belt, y = S.belt.year, i = y < 1970 ? 0 : y < 1983 ? 1 : 2;
  lab.setReadout(String(y), '', ''); $('yearR').value = y;
  lab.setState({ emo: ['💭', '📜', '⚖️'][i], title: b.t[i], lead: b.l[i], body: '' });
}
resetDeal();
render();
</script>
</body>
</html>
