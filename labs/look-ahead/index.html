// --- game trees for the picture --------------------------------------------------------------------------------
const TLC = {};
function layoutOf(n) {
  if (TLC[n]) return TLC[n];
  const win = [];
  for (let m = 0; m <= n; m++) win[m] = m > 0 && (!win[m - 1] || (m > 1 && !win[m - 2]));
  const nodes = []; let leaf = 0;
  const build = (m, depth, parent, move) => {
    const nd = { m, depth, parent, move, kids: [], x: 0, win: win[m] }; nodes.push(nd);
    for (let k = 1; k <= 2 && k <= m; k++) nd.kids.push(build(m - k, depth + 1, nd, k));
    nd.x = nd.kids.length ? (nd.kids[0].x + nd.kids[nd.kids.length - 1].x) / 2 : leaf++;
    return nd;
  };
  const root = build(n, 0, null, 0);
  nodes.forEach((nd) => { nd.x01 = leaf > 1 ? nd.x / (leaf - 1) : 0.5; });
  return (TLC[n] = { root, nodes, leaves: leaf });
}

// --- the game tree of the picture (play view) ---------------------------------------------------------------------
function drawTree(c, bx, by, bw, bh, lay, t0, tN, hl, alpha) {
  const D = Math.max(1, lay.root.m), padX = 18, padT = 16, padB = 36;
  const gx = bw - 2 * padX, gy = (bh - padT - padB) / D, sp = lay.leaves > 1 ? gx / (lay.leaves - 1) : 0;

  const rt = (nd) => t0 + 0.4 + 0.38 * nd.m; // a position is coloured after everything below it
  c.save(); c.globalAlpha = alpha; c.lineCap = 'round';
  for (const nd of lay.nodes) {
    if (!nd.parent) continue;
    const x0 = X(nd.parent), y0 = Y(nd.parent), x1 = X(nd), y1 = Y(nd);
    const good = tN >= rt(nd) && !nd.win, chosen = hl && nd.parent === lay.root && nd.move === hl;
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1);
    c.strokeStyle = chosen ? COL.gold : good ? 'rgba(110, 231, 183, .95)' : 'rgba(170, 190, 235, .35)'; c.lineWidth = chosen ? 4 : good ? 2.6 : 1.4; c.stroke();
  }
  for (const nd of lay.nodes) {
    if (!nd.parent) continue;
    const x0 = X(nd.parent), y0 = Y(nd.parent), x1 = X(nd), y1 = Y(nd);
    if (nd.parent === lay.root || (Math.abs(x1 - x0) >= 24 && y1 - y0 >= 24)) pill(c, '−' + nd.move, (x0 + x1) / 2, (y0 + y1) / 2, { a: alpha });
  }
  for (const nd of lay.nodes) {
    const x = X(nd), y = Y(nd), done = tN >= rt(nd), age = (tN - rt(nd)) / 0.35;
    const sc = done && age < 1 ? 1 + 0.28 * Math.sin(Math.PI * c01(age)) : 1, rad = r * sc;
    const a = done ? (nd.win ? ['#c8fbe4', '#2fc58a', '#17805a'] : ['#ffc9c9', '#ef5b5b', '#a63030']) : ['#8a9ab4', '#64748b', '#46546c'];
    c.save(); c.shadowColor = 'rgba(0, 0, 0, .4)'; c.shadowBlur = 5; c.shadowOffsetY = 2;
    const g = c.createRadialGradient(x - rad * 0.35, y - rad * 0.4, rad * 0.1, x, y, rad * 1.1); g.addColorStop(0, a[0]); g.addColorStop(0.55, a[1]); g.addColorStop(1, a[2]);
    c.beginPath(); c.arc(x, y, Math.max(0, rad), 0, 7); c.fillStyle = g; c.fill(); c.restore();
    c.lineWidth = 1.5; c.strokeStyle = 'rgba(8, 14, 28, .75)'; c.stroke();
    if (nd === lay.root) { c.lineWidth = 2; c.strokeStyle = '#fff'; c.beginPath(); c.arc(x, y, Math.max(0, rad + 3), 0, 7); c.stroke(); }
    c.fillStyle = done ? '#0b1220' : '#e8eefc'; c.font = `900 ${r >= 9.5 ? 12 : 10.5}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(nd.m, x, y + 0.5);
    if (hl && nd.parent === lay.root && nd.move === hl) { c.lineWidth = 2.5; c.strokeStyle = COL.gold; c.beginPath(); c.arc(x, y, Math.max(0, r + 4 + Math.sin(tN * 6) * 1.2), 0, 7); c.stroke(); }
  }
  c.restore();
}

// what the strip under the table shows right now
function treeMode(tN) {
  if (G.pred === 'rev') return { kind: 'tree', n: G.n, t0: G.predAt, hl: tN >= G.predAt + 0.4 + 0.38 * G.n + 0.2 ? G.n - 3 : 0 };
  const rb = G.rb;
  if (G.turn === 'robo' && rb && tN >= rb.t0) {
    if (rb.tree) return { kind: 'tree', n: rb.n, t0: rb.t0, hl: tN >= rb.t0 + 0.4 + 0.38 * rb.n + 0.35 ? rb.move : 0 };
    if (rb.big) return { kind: 'text' };
  }
  return null;
}

function drawPlay(c, w, h, dt, tN) {
  const mode = treeMode(tN);
  if (mode && mode.kind === 'tree') PV.last = mode;
  if (mode) PV.hold = mode.kind === 'tree' ? 0.46 : 0.17;
  PV.treeA += clamp((mode && mode.kind === 'tree' ? 1 : 0) - PV.treeA, -dt / 0.25, dt / 0.25);
  const tfT = mode || PV.treeA > 0.02 ? PV.hold : 0;
  PV.tf += (tfT - PV.tf) * Math.min(1, dt * 9);
  const th = h * (1 - PV.tf), g = playGeo(w, th);
  drawFelt(c, w, th);

  // row of matches that are still on the table
  const thinking = G.turn === 'robo' && G.rb && tN >= G.rb.t0;
  for (let i = 0; i < G.n0; i++) {
    if (G.taken[i]) continue;
    const [x, y, a] = slotOf(g, i);
    drawMatch(c, x, y, a, g.L, g.wd, 1, 0);
  }
  // piles
  const pulse = 0.5 + 0.5 * Math.sin(tN * 4);
  pill(c, T[lang].me, g.areaL - 4, g.pileY, { al: 'l', stroke: G.turn === 'me' ? `rgba(255, 212, 121, ${0.5 + 0.5 * pulse})` : G.winner === 'me' ? COL.gold : null });
  // Robo
  const s = Math.min(g.robW * 0.62, th * 0.3), baseY = th - 34;
  const mood = G.winner === 'robo' ? 'happy' : G.winner === 'me' ? 'sad' : thinking ? 'think' : 'idle';
  drawRobo(c, g.rx, baseY, s, tN, mood);
  pill(c, T[lang].robo, g.rx, th - 18, { stroke: G.turn === 'robo' || G.winner === 'robo' ? COL.robo : null });
  // flying and resting taken matches, on top
  for (let i = 0; i < G.n0; i++) {
    const tk = G.taken[i];
    if (!tk) continue;
    const [x0, y0, a0] = slotOf(g, i), [x1, y1, a1] = pileOf(g, tk.by, tk.j, i);
    const p = c01((tN - tk.at) / 0.75), e = eBack(p), lift = Math.sin(Math.PI * c01(p * 1.15)) * 16;
    drawMatch(c, lerp(x0, x1, e), lerp(y0, y1, e) - lift * 0.5, lerp(a0, a1, eIO(p)), g.L, g.wd, lerp(1, g.sc, eIO(p)), lift);
  }

  // strip under the table
  if (th < h - 24) {
    const bx = 6, by = th + 2, bw = w - 12, bh = h - th - 8;
    rr(c, bx, by, bw, bh, 20); c.fillStyle = 'rgba(8, 14, 28, .7)'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(130, 145, 190, .28)'; c.stroke();
    if (PV.last && PV.treeA > 0.02) drawTree(c, bx, by, bw, bh, layoutOf(PV.last.n), PV.last.t0, tN, PV.last.hl, PV.treeA);
    if (mode && mode.kind === 'text') noteBox(c, T[lang].tooMany, bx + 14, by + bh / 2, bw - 28);
    if (PV.treeA > 0.3 && bh > 80) {
      pill(c, T[lang].legWin, bx + 10, by + bh - 14, { dot: COL.win, al: 'l', a: PV.treeA });
      pill(c, T[lang].legLose, bx + bw - 10, by + bh - 14, { dot: COL.lose, al: 'r', a: PV.treeA });
    }
  }
}

// --- ladder (tree view) ------------------------------------------------------------------------------------------
function drawLadder(c, w, h, tN) {
  panel(c, w, h);
  const R = S.rule3 ? 3 : 2, top = 64, bot = h - 34, gap = (bot - top) / 9, r = clamp(gap * 0.36, 11, 17);
  const cx = w >= 520 ? w * 0.42 : w * 0.34, Y = (n) => bot - n * gap;
  pill(c, T[lang].legWin, w - 12, 20, { dot: COL.win, al: 'r' });
  pill(c, T[lang].legLose, w - 12, 44, { dot: COL.lose, al: 'r' });
  const colOf = (n) => {
    if (S.rule3) return tN >= TR.r3At + 0.22 * n ? TRUE[3][n] : null;
    return TR.col[n] ?? null;
  };
  const arrow = (n, k, stroke, lw, dash) => {
    const m = n - k; if (m < 0) return;
    const sd = k === 1 ? -1 : 1, bulge = k === 1 ? 30 : k === 2 ? 40 : 70;
    const x0 = cx + sd * r * 0.8, y0 = Y(n) + r * 0.6, x1 = x0, y1 = Y(m) - r * 0.6 - 3, qx = cx + sd * (r + bulge), qy = (y0 + y1) / 2;
    c.save(); c.setLineDash(dash || []); c.strokeStyle = stroke; c.fillStyle = stroke; c.lineWidth = lw; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(qx, qy, x1, y1); c.stroke(); c.setLineDash([]);
    const ang = Math.atan2(y1 - qy, x1 - qx), hs = 4 + lw;
    c.beginPath(); c.moveTo(x1 + 1, y1 + 1); c.lineTo(x1 - Math.cos(ang - 0.45) * hs * 1.5 + 1, y1 - Math.sin(ang - 0.45) * hs * 1.5 + 1); c.lineTo(x1 - Math.cos(ang + 0.45) * hs * 1.5 + 1, y1 - Math.sin(ang + 0.45) * hs * 1.5 + 1); c.closePath(); c.fill();
    c.restore();
  };
  // faint arrows from every position, brighter ones for the one being coloured
  const target = !S.rule3 && !TR.rev && TR.next <= 9 ? TR.next : -1;
  for (let n = 1; n <= 9; n++) for (let k = 1; k <= R; k++) arrow(n, k, S.rule3 ? 'rgba(170, 190, 235, .13)' : 'rgba(170, 190, 235, .2)', 1.4);
  if (target > 0) for (let k = 1; k <= 2; k++) arrow(target, k, 'rgba(255, 255, 255, .8)', 2.2, [5, 4]);
  if (TR.rev && !S.rule3) {
    const n = TR.rev.n, age = c01((tN - TR.rev.at) / 0.5);
    for (let k = 1; k <= 2; k++) if (n - k >= 0) arrow(n, k, TRUE[2][n - k] === 'l' ? COL.lose : COL.win, 2 + 1.6 * age);
  }
  // rule rings
  if (TR.ruleShown || S.rule3) for (let n = 0; n <= 9; n++) if (TRUE[R][n] === 'l' && (!S.rule3 || colOf(n))) {
    c.save(); c.setLineDash([4, 4]); c.lineDashOffset = -tN * 8; c.strokeStyle = COL.gold; c.lineWidth = 2; c.beginPath(); c.arc(cx, Y(n), Math.max(0, r + 6), 0, 7); c.stroke(); c.restore();
  }
  for (let n = 0; n <= 9; n++) {
    const x = cx, y = Y(n), col = colOf(n);
    let sc = 1, popAt = S.rule3 ? TR.r3At + 0.22 * n : TR.rev && TR.rev.n === n ? TR.rev.at : -9;
    if (col && n > 0) { const age = (tN - popAt) / 0.4; if (age >= 0 && age < 1) sc = 1 + 0.3 * Math.sin(Math.PI * age); }
    const rad = r * sc, a = col === 'w' ? ['#c8fbe4', '#2fc58a', '#17805a'] : col === 'l' ? ['#ffc9c9', '#ef5b5b', '#a63030'] : ['#8a9ab4', '#64748b', '#46546c'];
    c.save(); c.shadowColor = 'rgba(0, 0, 0, .45)'; c.shadowBlur = 7; c.shadowOffsetY = 3;
    const g = c.createRadialGradient(x - rad * 0.35, y - rad * 0.4, rad * 0.1, x, y, rad * 1.1); g.addColorStop(0, a[0]); g.addColorStop(0.55, a[1]); g.addColorStop(1, a[2]);
    c.beginPath(); c.arc(x, y, Math.max(0, rad), 0, 7); c.fillStyle = g; c.fill(); c.restore();
    c.lineWidth = 1.8; c.strokeStyle = 'rgba(8, 14, 28, .8)'; c.stroke();
    c.fillStyle = col ? '#0b1220' : '#e8eefc'; c.font = '900 15px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(n, x, y + 1);
    if (col) { // a mark for people who cannot tell red from green
      const bx = x + rad * 0.8, by = y - rad * 0.8;
      c.beginPath(); c.arc(bx, by, 6.5, 0, 7); c.fillStyle = 'rgba(8, 12, 24, .9)'; c.fill();
      c.fillStyle = col === 'w' ? COL.win : COL.lose; c.font = '900 9px Nunito, sans-serif'; c.fillText(col === 'w' ? '✓' : '✕', bx, by + 0.5);
    }
    if (n === target) { c.save(); c.setLineDash([5, 4]); c.lineDashOffset = -tN * 10; c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, Math.max(0, r + 6 + Math.sin(tN * 5) * 1.5), 0, 7); c.stroke(); c.restore(); }
  }
  noteBox(c, T[lang].zeroNote, cx + 76, Y(0), Math.max(110, w - cx - 86));
}

// --- huge trees (grow view) ---------------------------------------------------------------------------------------
const A_ = 72 * Math.PI / 180, FR = [0, 0.13, 0.28, 0.46, 0.56, 0.67, 0.78, 0.89, 0.95, 1];
const FAN = (() => {
  const a1 = [], a2 = [], a3 = [], w1 = 2 * A_ / 9, w2 = w1 / 8, w3 = w2 / 7;
  for (let j = 0; j < 9; j++) a1.push(-A_ + (j + 0.5) * w1);
  for (let j = 0; j < 9; j++) for (let i = 0; i < 8; i++) a2.push({ p: j, a: -A_ + j * w1 + (i + 0.5) * w2 });
  for (let q = 0; q < 72; q++) for (let i = 0; i < 7; i++) a3.push({ p: q, a: a2[q].a - w2 / 2 + (i + 0.5) * w3 });
  return { a1, a2, a3 };
})();
const HAZE = Array.from({ length: 10 }, (_, L) => Array.from({ length: 150 }, (_, i) => [rnd(i, L * 3), rnd(i, L * 3 + 1), rnd(i, L * 3 + 2)]));
const fAt = (l) => { const i = Math.min(9, Math.floor(l)); return FR[i] + (FR[Math.min(9, i + 1)] - FR[i]) * (l - i); };

function drawGrow(c, w, h, dt, tN) {
  panel(c, w, h);
  const asking = !GR.asked;
  const tgt = asking ? 1 : GR.k;
  GR.lvA += clamp(tgt - GR.lvA, -dt * 3, dt * 3);
  const lv = GR.lvA, barsH = clamp(h * 0.27, 96, 140), cx = w / 2, cy = 22;
  const rx = (w / 2 - 16) / Math.sin(A_), ry = Math.max(60, h - barsH - cy - 12);
  const pt = (f, a) => [cx + rx * f * Math.sin(a), cy + ry * f * Math.cos(a)];
  c.save(); rr(c, 3, 3, w - 6, h - 6, 24); c.clip();
  // haze beyond what can be drawn
  const hazeTop = Math.min(9, Math.ceil(lv - 1e-6));
  if (lv > 3) {
    const fOut = fAt(Math.min(9, lv));
    c.save(); c.translate(cx, cy); c.scale(rx, ry);
    const fg = c.createRadialGradient(0, 0, FR[3], 0, 0, Math.max(FR[3] + 0.01, fOut));
    fg.addColorStop(0, 'rgba(124, 196, 255, 0)'); fg.addColorStop(1, 'rgba(124, 196, 255, .32)');
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, fOut, Math.PI / 2 - A_, Math.PI / 2 + A_); c.closePath(); c.fillStyle = fg; c.fill(); c.restore();
    for (let L = 4; L <= hazeTop; L++) {
      const p = eOut(lv - (L - 1)), f = FR[L];
      c.save(); c.translate(cx, cy); c.scale(rx, ry); c.beginPath(); c.arc(0, 0, f, Math.PI / 2 - A_, Math.PI / 2 + A_); c.restore();
      c.shadowColor = '#7cc4ff'; c.shadowBlur = 16; c.strokeStyle = `rgba(150, 210, 255, ${0.35 * p})`; c.lineWidth = 3 + L * 0.5; c.stroke(); c.shadowBlur = 0;
      c.fillStyle = `rgba(220, 240, 255, ${0.6 * p})`;
      for (const [u, v, q] of HAZE[L]) { const [X, Y] = pt(f + (v - 0.5) * 0.05, -A_ + u * 2 * A_); c.beginPath(); c.arc(X, Y, 0.7 + q * 1.1, 0, 7); c.fill(); }
    }
  }
  // real branches: levels 1 to 3
  const cols = ['', '#ffd479', '#7cc4ff', '#a9b6ff'], lws = [0, 2.4, 1.3, 0.6], als = [0, 0.95, 0.8, 0.6];
  for (let L = 1; L <= 3; L++) {
    const p = eOut(lv - (L - 1)); if (p <= 0) continue;
    const arr = L === 1 ? FAN.a1 : L === 2 ? FAN.a2 : FAN.a3;
    c.beginPath();
    for (let i = 0; i < arr.length; i++) {
      const a = L === 1 ? arr[i] : arr[i].a, pa = L === 1 ? 0 : L === 2 ? FAN.a1[arr[i].p] : FAN.a2[arr[i].p].a;
      const [x0, y0] = L === 1 ? [cx, cy] : pt(FR[L - 1], pa), [x1, y1] = pt(FR[L], a);
      c.moveTo(x0, y0); c.lineTo(lerp(x0, x1, p), lerp(y0, y1, p));
    }
    c.globalAlpha = als[L] * Math.min(1, p * 1.5); c.strokeStyle = cols[L]; c.lineWidth = lws[L]; c.lineCap = 'round'; c.stroke(); c.globalAlpha = 1;
    if (L <= 2 && p > 0.8) {
      c.fillStyle = cols[L];
      for (let i = 0; i < arr.length; i++) { const [x1, y1] = pt(FR[L], L === 1 ? arr[i] : arr[i].a); c.beginPath(); c.arc(x1, y1, L === 1 ? 3.4 : 1.7, 0, 7); c.fill(); }
    }
  }
  // root
  const rg = c.createRadialGradient(cx - 2, cy - 2, 1, cx, cy, 9); rg.addColorStop(0, '#fff3c4'); rg.addColorStop(1, '#e0a73a');
  c.beginPath(); c.arc(cx, cy, 8, 0, 7); c.fillStyle = rg; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#7a5410'; c.stroke();
  // the current level
  if (!asking || GR.ans !== null) {
    const L = clamp(Math.round(lv), 1, 9), f = FR[L];
    c.save(); c.translate(cx, cy); c.scale(rx, ry); c.beginPath(); c.arc(0, 0, f, Math.PI / 2 - A_, Math.PI / 2 + A_); c.restore();
    c.strokeStyle = 'rgba(255, 255, 255, .55)'; c.lineWidth = 1.5; c.setLineDash([3, 5]); c.stroke(); c.setLineDash([]);
  }
  c.restore();
  if (!asking) {
    const L = clamp(Math.round(lv), 1, 9), [px, py] = pt(FR[L], A_ * 0.62);
    pill(c, fmt(COUNTS[L]), px, py, { col: '#ffe6ad', stroke: 'rgba(255, 212, 121, .8)' });
  }
  // two bars: noughts and crosses, and chess
  if (!asking) {
    if (GR.barT0 < 0) GR.barT0 = tN;
    const by0 = h - barsH + 4, x0 = 16, bwid = w - 16 - 4, grow = eOut((tN - GR.barT0) / 1.3);
    pill(c, `${T[lang].ttt}: ${fmt(362880)}`, x0, by0 + 8, { al: 'l' });
    rr(c, x0, by0 + 22, 6, 10, 3); c.fillStyle = COL.gold; c.fill();
    pill(c, T[lang].chess, x0, by0 + 52, { al: 'l' });
    c.save(); rr(c, 3, 3, w - 6, h - 6, 24); c.clip();
    const bg = c.createLinearGradient(x0, 0, w, 0); bg.addColorStop(0, '#a78bfa'); bg.addColorStop(1, '#ff7a7a');
    const L2 = bwid * grow;
    rr(c, x0, by0 + 66, L2 + 20, 14, 7); c.fillStyle = bg; c.fill();
    if (grow > 0.98) { // it keeps going: an arrow at the edge
      const ax = w - 10, ay = by0 + 73;
      c.fillStyle = '#fff'; c.beginPath(); c.moveTo(ax + 4, ay); c.lineTo(ax - 14, ay - 11); c.lineTo(ax - 14, ay + 11); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(8, 12, 24, .8)'; c.lineWidth = 2.5;
      for (const dx of [-34, -26]) { c.beginPath(); c.moveTo(ax + dx, by0 + 64); c.lineTo(ax + dx - 6, by0 + 82); c.stroke(); }
    }
    c.restore();
  }
}

// --- drawing ---------------------------------------------------------------------------------------------------------
function draw(c, w, h, dt) {
  CW = w; CH = h;
  const tN = now(), v = lab.view;
  c.lineJoin = 'round';
  if (v === 'play') drawPlay(c, w, h, dt, tN);
  else if (v === 'tree') drawLadder(c, w, h, tN);
  else drawGrow(c, w, h, dt, tN);
}

// --- controls ---------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const chipsHTML = (items, act, cur) => items.map(([v, label]) => `<button class="chip la-c ${String(cur) === String(v) ? 'on' : ''}" data-act="${act}" data-v="${v}">${esc(label)}</button>`).join('');
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'take') { if (G.turn === 'me' && G.pred !== 'ask' && +b.dataset.k <= G.n) doTake('me', +b.dataset.k); return; }
  if (act === 'pile') { S.pile = +v; if (S.pile !== 10) S.magic = false; sfx.click(); newGame(); return; }
  if (act === 'start') { S.starter = v; if (v !== 'me') S.magic = false; sfx.click(); newGame(); return; }
  if (act === 'new') { sfx.click(); newGame(); return; }
  if (act === 'think') { S.think = !S.think; sfx.click(); render(); return; }
  if (act === 'pred') { if (G.pred === 'ask') answerPred(+v); return; }
  if (act === 'tpick') { tpick(v); return; }
  if (act === 'tnext') { tnext(); return; }
  if (act === 'tagain') { tagain(); return; }
  if (act === 'trule') { TR.ruleShown = true; sfx.click(); render(); return; }
  if (act === 'gpick') { if (!GR.asked) gpick(+v); return; }
  if (act === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    if (v === 'a') { S.magic = true; S.pile = 10; S.starter = 'me'; lab.view = 'play'; lab.renderChrome(); sfx.click(); newGame(); }
    else { S.rule3 = !S.rule3; if (S.rule3) TR.r3At = now(); lab.view = 'tree'; lab.renderChrome(); sfx.click(); render(); }
  }
});
$('laSl').addEventListener('input', (ev) => { if (!GR.asked) return; GR.k = clamp(Math.round(+ev.target.value), 1, 9); sfx.tick(); render(); });

// --- one render per change ----------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('laPlay').style.display = v === 'play' ? 'block' : 'none';
  $('laTree').style.display = v === 'tree' ? 'block' : 'none';
  $('laGrow').style.display = v === 'grow' ? 'block' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo, on) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-v="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('laSecs').innerHTML = sc('a', '🪄', S.magic) + sc('b', '3️⃣', S.rule3);
  if (v === 'play') renderPlay(t); else if (v === 'tree') renderTree(t); else renderGrow(t);
}

function renderPlay(t) {
  const over = G.turn === 'over', me = G.turn === 'me', ask = G.pred === 'ask';
  lab.setGlow('rgba(40, 150, 110, .3)');
  lab.setReadout(G.n, t.left, over ? (G.winner === 'me' ? t.youWin : t.roboWins) : me ? t.yourTurn : t.roboTurn, COL.win);
  $('laPileL').textContent = t.pile; $('laStartL').textContent = t.starts;
  $('laPile').innerHTML = chipsHTML([7, 8, 10].map((n) => [n, n]), 'pile', S.pile);
  $('laStart').innerHTML = chipsHTML([['me', t.me], ['robo', t.robo]], 'start', S.starter);
  $('laThink').textContent = (S.think ? '✓ ' : '') + t.showThinking; $('laThink').classList.toggle('on', S.think);
  $('laNew').textContent = t.newGame; $('laNew').classList.toggle('la-hot', over);
  $('laScore').textContent = t.score(S.score.me, S.score.robo);
  // prediction
  const askEl = $('laAsk');
  if (ask) {
    askEl.style.display = 'block'; askEl.className = 'la-box';
    askEl.innerHTML = `<div class="la-q">${esc(t.qMove)}</div><div class="la-opts">${G.predOrder.map((i) => `<button class="la-opt" data-act="pred" data-v="${i}">${esc(t.optsMove[i])}</button>`).join('')}</div>`;
  } else if (G.pred === 'rev') {
    const k = G.n - 3, ok = G.predAns === k - 1;
    askEl.style.display = 'block'; askEl.className = 'la-box';
    askEl.innerHTML = `<div class="la-say" style="margin:0"><b class="${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.notQuite)}</b> ${esc(t.leave3[k - 1])}</div>`;
  } else { askEl.style.display = 'none'; askEl.innerHTML = ''; }
  // take buttons
  const takeRow = $('laTake');
  takeRow.style.display = ask || over ? 'none' : 'flex';
  takeRow.querySelectorAll('.la-tb').forEach((b) => {
    const k = +b.dataset.k; b.textContent = k === 1 ? t.take1 : t.take2;
    b.disabled = !me || k > G.n;
    const gold = S.magic && me && G.pred === null && k <= G.n && (G.n - k) % 3 === 0;
    b.classList.toggle('la-gold', gold); b.classList.toggle('la-good', G.pred === 'rev' && me && k === G.n - 3);
  });
  $('laSay').innerHTML = S.magic && me && !ask && !over ? `<span class="la-whisper">${esc(t.whisper)}</span>` : '';
  let st = t.state.play;
  if (S.magic && over && G.winner === 'me') st = { emo: '🪄', title: t.secrets.a[0], lead: t.secrets.a[1], body: '' };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(t.facts.play);
}

function renderTree(t) {
  const box = $('laTBox'), n = TR.next, done = n > 9 && !S.rule3;
  lab.setGlow('rgba(80, 130, 220, .3)');
  const coloured = S.rule3 ? 9 : TR.col.slice(1).filter(Boolean).length;
  lab.setReadout(`${coloured} / 9`, t.coloured, '', COL.robo);
  if (S.rule3) box.innerHTML = '';
  else if (done) box.innerHTML = `<div class="la-say" style="margin:10px 0 0"><b class="ok">9 / 9</b></div>`;
  else if (!TR.rev) {
    box.innerHTML = `<div class="la-q" style="margin-top:12px">${esc(t.qPos(n))}</div><div class="la-opts">${TR.order.map((a) => `<button class="la-opt ${a}" data-act="tpick" data-v="${a}">${esc(a === 'w' ? t.win : t.lose)}</button>`).join('')}</div>`;
  } else {
    const ev = TR.rev, truth = TRUE[2][ev.n];
    let why;
    if (truth === 'w') { let k = 1; while (TRUE[2][ev.n - k] !== 'l') k++; why = t.whyWin(ev.n, k); } else why = t.whyLose(ev.n);
    box.innerHTML = `<div class="la-box"><div class="la-say" style="margin:0"><b class="${ev.ok ? 'ok' : 'no'}">${esc(ev.ok ? t.right : t.notQuite)}</b> ${esc(why)}</div></div>
      <div class="row2"><button class="btn" data-act="tnext">${esc(t.next)} →</button></div>`;
  }
  const showRule = (TR.ruleShown && !S.rule3);
  $('laRule').style.display = showRule ? 'block' : 'none'; $('laRule').textContent = t.rule;
  $('laTRuleB').textContent = t.showRule; $('laTRuleB').style.display = TR.ruleShown || S.rule3 ? 'none' : '';
  $('laTAgain').textContent = t.again; $('laTAgain').style.display = !S.rule3 && (done || TR.next > 1) ? '' : 'none';
  let st = t.state.tree;
  if (S.rule3) st = { emo: '3️⃣', title: t.secrets.b[0], lead: t.secrets.b[1], body: '' };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(t.facts.tree);
}

function renderGrow(t) {
  const asking = !GR.asked;
  lab.setGlow('rgba(150, 120, 230, .3)');
  $('laGL').textContent = t.ahead; $('laK').textContent = GR.k; $('laSl').value = GR.k; $('laSl').setAttribute('aria-label', t.ahead);
  $('laNote').textContent = t.earlyNote;
  $('laGAsk').style.display = asking ? 'block' : 'none'; $('laGCtl').style.display = asking ? 'none' : 'block';
  if (asking) {
    lab.setReadout('?', '', '', COL.gold);
    $('laGAsk').innerHTML = `<div class="la-q" style="margin-top:12px">${esc(t.qTwo)}</div><div class="la-opts">${GR.order.map((v) => `<button class="la-opt" data-act="gpick" data-v="${v}">${v}</button>`).join('')}</div>`;
    $('laGSay').innerHTML = '';
  } else {
    lab.setReadout(fmt(COUNTS[GR.k]), t.positions(GR.k), '', COL.gold);
    $('laGAsk').innerHTML = '';
    $('laGSay').innerHTML = GR.ans === null ? '' : `<b class="${GR.ans === 72 ? 'ok' : 'no'}">${esc(GR.ans === 72 ? t.right : t.notQuite)}</b> 9 × 8 = 72`;
  }
  lab.setState({ ...t.state.grow, extra: '' });
  lab.setFacts(t.facts.grow);
}

newGame();
canvasLoop($('cv'), draw);
</script>
