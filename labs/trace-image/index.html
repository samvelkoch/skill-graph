    return `<div style="display:flex;justify-content:center;padding:6px 0;background:linear-gradient(#262d58,#12152e)"><div style="position:relative;width:170px;height:170px">${face(3, 170, { earL: '#f5c84c', dropL: false, earR: '#6fb6ff', dropR: true })}
      <svg viewBox="0 0 100 100" width="170" height="170" style="position:absolute;inset:0" aria-hidden="true"><g class="ring" fill="none" stroke="#ff6b60" stroke-width="1.6" stroke-dasharray="3 2.5"><circle cx="28" cy="58" r="8"/><ellipse cx="72" cy="65" rx="8" ry="11"/></g></svg></div></div>`;
  },
};
const FP = ['88888888', '77777777', '66566656', '44444444', '53311355', '55111155', '45555554', '34444443'].map((r) => [...r].map(Number));
const FP_OTHER = ['22222222', '25522552', '21122112', '22222222', '86666668', '88666688', '98888889', '99999999'].map((r) => [...r].map(Number));
function copyFp(o) {
  let x = FP.map((r) => r.slice());
  if (o.crop) x = x.map((r, ri) => r.map((_, c) => FP[ri][Math.min(7, Math.round(1 + c * 6 / 7))]));
  if (o.filter) x = x.map((r) => r.map((v) => Math.min(9, v + 2)));
  if (o.text) for (let c = 1; c < 7; c++) x[6][c] = 0;
  return x;
}
const matchOf = (a, b) => { let s = 0; for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) s += Math.abs(a[r][c] - b[r][c]); return Math.round(100 * (1 - s / (64 * 9))); };
const fpGrid = (g) => `<div class="ti-fp">${g.flat().map((v) => `<i style="background:hsl(215 55% ${14 + v * 8}%)"></i>`).join('')}</div>`;

// --- state ---------------------------------------------------------------------------------------------------
const S = {
  g1: null, panel1: 'res', clue: 0, coin: null, shown: 100, trust: false,
  g2: null, step: 0, search: false, mods: { crop: false, filter: false, text: false },
  P: [0, 1, 2, 3, 4].map(() => ({ bin: null, chk: null })), sel: 0,
};
const BIN_OK = [1, 1, 0, 0, 2], CHK_OK = [1, 2, 0, 0, 0];
const resolved = (i) => { const p = S.P[i]; return p.bin !== null && (p.bin !== 1 || p.chk !== null); };
let coinTimer = 0;

const lab = shell({ key: 'trace-image', T, topics: TOPICS, views: ['guess', 'trace', 'check'], onLang: render, onView: render });
const secret = secretLab('trace-image', () => ({
  secrets: [{ emo: '😇', title: T[lang].sec.trust[0], desc: T[lang].sec.trust[1] }, { emo: '🔎', title: T[lang].sec.search[0], desc: T[lang].sec.search[1] }],
  questions: T[lang].quiz,
}), () => render());
$('stage').insertAdjacentHTML('afterbegin', '<div id="feed"></div>');

// --- shared HTML pieces ----------------------------------------------------------------------------------------
const phone = (inner) => `<div class="ti-phone"><div class="ti-screen"><div class="ti-sbar"><span>9:41</span><i></i><span>📶 🔋</span></div>
  <div class="ti-head">${esc(T[lang].ph.feed)}<small>${esc(T[lang].ph.drawn)}</small></div>${inner}</div></div>`;
const wrapPic = (svg, label, cls = '') => `<div class="ti-pic ${cls}">${svg}${label ? `<span class="ti-rib">${esc(label)}</span>` : ''}</div>`;
const secChip = (k, on, disabled) => {
  const open = secret.unlocked(), t = T[lang].sec[k];
  return `<button type="button" class="chip secret ti-chip ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}"${open && disabled ? ' disabled style="opacity:.4"' : ''}>${open ? `${k === 'trust' ? '😇' : '🔎'} ${esc(t[0])}` : '🔒 ???'}</button>`;
};

// --- view 1: Guess ----------------------------------------------------------------------------------------------
// 48 right answers out of 100, scattered by a seeded shuffle (the same every time)
const PEOPLE_DOTS = (() => {
  const a = Array.from({ length: 100 }, (_, i) => (i < 48 ? 1 : 0));
  let x = 20220221;
  const rnd = () => { x = (Math.imul(x, 1664525) + 1013904223) >>> 0; return x / 4294967296; };
  for (let i = 99; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
})();
const peopleDots = () => PEOPLE_DOTS;
function coinCount() { return S.coin ? S.coin.slice(0, S.shown).filter(Boolean).length : 0; }
function flip() {
  clearInterval(coinTimer);
  S.coin = Array.from({ length: 100 }, () => Math.random() < 0.5); S.shown = 0; sfx.click();
  coinTimer = setInterval(() => {
    S.shown = Math.min(100, S.shown + 4); sfx.tick();
    if (S.shown >= 100) { clearInterval(coinTimer); sfx.good(); }
    if (lab.view === 'guess') render();
  }, 45);
  render();
}
function render1(t) {
  const v = t.v1, g = S.g1, ans = g !== null, flipping = S.coin && S.shown < 100;
  lab.setGlow('rgba(78, 168, 255, .28)');
  if (!ans) {
    $('feed').innerHTML = phone(`<div class="ti-card"><h4>${esc(v.cap)}</h4>
      <div class="ti-faces">${[0, 1, 2, 3, 4, 5].map((i) => `<div class="ti-fc">${face(i, 100, { glasses: i === 4 })}<b>?</b></div>`).join('')}</div>
      <p class="fine">${esc(v.fine)}</p></div>`);
    $('ctrlBody').innerHTML = `<p class="ti-q">${esc(v.q)}</p><div class="ti-obs">${v.opts.map((o, i) => `<button type="button" class="ti-ob" data-act="g1" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    lab.setReadout('?', v.rSub0, '', '#4ea8ff');
    lab.setState({ emo: '🤔', title: v.preT, lead: v.preL, body: v.preB, extra: `<div class="fine">${esc(t.fine)}</div>` });
    lab.setFacts([]);
    return;
  }
  const done = S.coin && S.shown >= 100, c = coinCount(), verdict = g === 1 ? v.right : v.wrong;
  let main;
  if (S.panel1 === 'trust' && secret.unlocked()) {
    const r = t.tr, h = (x) => Math.round((x - 1) / 6 * 120);
    main = `<div class="ti-card"><h4>${esc(r.t)}</h4><p>${esc(r.l)}</p>
      <div class="ti-bars"><div class="ti-bar"><b>4.48</b><span style="height:${h(4.48)}px"></span>${esc(r.real)}</div><div class="ti-bar fake"><b>4.82</b><span style="height:${h(4.82)}px"></span>${esc(r.fake)}</div></div>
      <p class="fine">${esc(r.scale)}. ${esc(r.note)}</p></div>`;
  } else if (S.panel1 === 'clues') {
    const cl = v.clues[S.clue], fig = [CLUE.hands, CLUE.text, CLUE.ears][S.clue]();
    main = `<div class="ti-card"><h4>${esc(cl.t)}</h4><div class="ti-clue"><div class="fig">${fig}</div><p>${esc(cl.d)}</p></div>
      <p class="fine">${esc(v.clueDraw)}. ${esc(v.clueNote)}</p></div>`;
  } else {
    const pd = peopleDots(), cd = Array.from({ length: 100 }, (_, i) => (S.coin && i < S.shown ? (S.coin[i] ? 1 : 0) : -1));
    const dot = (a) => `<div class="ti-dots">${a.map((x) => `<i class="${x === 1 ? 'y' : x === 0 ? 'n' : ''}"></i>`).join('')}</div>`;
    main = `<div class="ti-card"><h4>${esc(v.cap)}</h4>
      <div class="ti-two"><div class="ti-col"><h5>${esc(v.ppl)}</h5><div class="n">${esc(v.of(48))}</div>${dot(pd)}</div>
      <div class="ti-col"><h5>${esc(v.coin)}</h5><div class="n">${S.coin ? esc(flipping ? v.flipping : v.of(c)) : ''}</div>${dot(cd)}</div></div>
      <p class="fine">${esc(v.resB)}</p></div>`;
  }
  $('feed').innerHTML = phone(main);
  const sub = S.panel1 === 'clues'
    ? `<div class="ti-row">${v.clueChips.map((l, i) => `<button type="button" class="chip ti-chip ${S.clue === i ? 'on' : ''}" data-act="clue" data-i="${i}">${esc(l)}</button>`).join('')}</div>`
    : S.panel1 === 'res' ? `<div class="ti-row"><button type="button" class="btn ti-btn" data-act="flip"${flipping ? ' disabled' : ''}>${esc(S.coin ? v.again : v.flip)}</button></div>` : '';
  $('ctrlBody').innerHTML = `<div class="ti-row"><button type="button" class="chip ti-chip ${S.panel1 === 'res' ? 'on' : ''}" data-act="panel1" data-k="res">${esc(v.tabs[0])}</button>
    <button type="button" class="chip ti-chip ${S.panel1 === 'clues' ? 'on' : ''}" data-act="panel1" data-k="clues">${esc(v.tabs[1])}</button>${secChip('trust', S.panel1 === 'trust')}</div>${sub}`;
  lab.setReadout('48.2%', v.rSub, done ? `🪙 ${c}` : '', '#4ea8ff');
  if (S.panel1 === 'clues') lab.setState({ emo: '🔎', title: v.clueSt.t, lead: v.clueSt.l, body: '', extra: '' });
  else if (S.panel1 === 'trust' && secret.unlocked()) lab.setState({ emo: '😇', title: t.tr.t, lead: t.tr.l, body: t.tr.note, extra: '' });
  else if (done) lab.setState({ emo: '🪙', title: v.coinT(c), lead: v.coinL, body: v.resB, extra: '' });
  else lab.setState({ emo: g === 1 ? '✅' : '🤔', title: verdict, lead: v.resL, body: v.resB, extra: '' });
  lab.setFacts(S.panel1 === 'clues' ? v.clueFacts : S.panel1 === 'trust' && secret.unlocked() ? t.tr.facts : v.facts);
}

// --- view 2: Trace ----------------------------------------------------------------------------------------------
function render2(t) {
  const v = t.v2, g = S.g2, ans = g !== null, k = S.step, c0 = v.cards[0];
  lab.setGlow('rgba(95, 176, 255, .26)');
  const post0 = `<article class="ti-post"><div class="ti-ph">${face(0, 38)}<div><div class="ti-nm">${esc(c0.who)}</div><div class="ti-ts">${esc(c0.when)}</div></div></div>
    <p class="ti-tx">${esc(c0.text)}</p>${wrapPic(floodPic(), t.ph.made)}<div class="ti-meta"><span>🔁 ${esc(c0.reposts)}</span><span>❤️ ${esc(c0.likes)}</span><span>💬</span></div></article>`;
  if (S.search && secret.unlocked() && ans) {
    const s = t.se, cp = copyFp(S.mods), m = matchOf(FP, cp), mo = matchOf(FP, FP_OTHER);
    $('feed').innerHTML = phone(`<div class="ti-card"><h4>${esc(s.t)}</h4><p>${esc(s.l)}</p>
      <div class="ti-three"><div><h5>${esc(s.orig)}</h5>${wrapPic(floodPic(), '', 'sm')}</div><div><h5>${esc(s.fp)}</h5>${fpGrid(FP)}</div></div>
      <div class="ti-three"><div><h5>${esc(s.yours)}</h5>${fpGrid(cp)}<div class="ti-meter"><span style="width:${m}%"></span></div><div class="fine">${esc(s.match(m))}</div></div>
      <div><h5>${esc(s.other)}</h5>${fpGrid(FP_OTHER)}<div class="ti-meter low"><span style="width:${mo}%"></span></div><div class="fine">${esc(s.match(mo))}</div></div></div>
      <p class="fine">${esc(s.found)}</p><ul class="ti-list">${s.list.map((x, i) => `<li class="${i === 0 ? 'first' : ''}">${esc(x)}</li>`).join('')}</ul>
      <p class="fine" style="margin-top:8px">${esc(s.note)}</p></div>`);
    $('ctrlBody').innerHTML = `<div class="ti-row">${['crop', 'filter', 'text'].map((x, i) => `<button type="button" class="chip ti-chip ${S.mods[x] ? 'on' : ''}" data-act="mod" data-k="${x}">${esc(s.mod[i])}</button>`).join('')}${secChip('search', true)}</div>`;
    lab.setReadout(`${m}%`, s.match(m).replace(/^\d+% /, ''), '', '#5fb0ff');
    lab.setState({ emo: '🔎', title: s.t, lead: s.st, body: '', extra: '' });
    lab.setFacts(s.facts);
    return;
  }
  let chain = '';
  if (ans && k > 0) {
    chain = '<div class="ti-chain">';
    for (let i = 1; i <= k; i++) {
      const c = v.cards[i], last = i === k, orig = i === 3;
      if (orig) chain += `<div class="ti-gap">· · ·  ${esc(v.years)}  · · ·</div>`;
      chain += `<article class="ti-post ${orig ? 'orig' : ''} ${last ? 'arrive' : ''}"><span class="ti-when">${esc(c.when)}${orig ? ` · ${esc(c.storm)}` : ''}</span>
        <div class="ti-ph">${face(orig ? 5 : i + 1, 34)}<div class="ti-nm">${esc(c.who)}</div></div><p class="ti-tx">${esc(c.text)}</p>
        ${wrapPic(floodPic(), v.sameTag, 'sm')}${orig ? `<div class="ti-note">${esc(c.note)}</div>` : ''}</article>`;
    }
    chain += '</div>';
  }
  const rw = ans && k === 3 ? `<div class="ti-card arrive"><h4>🌍 ${esc(v.rw.t)}</h4><p>${esc(v.rw.p)}</p><p class="fine">en.wikipedia.org/wiki/Hurricane_Shark</p></div>` : '';
  $('feed').innerHTML = phone(post0 + chain + rw);
  if (!ans) {
    $('ctrlBody').innerHTML = `<p class="ti-q">${esc(v.q)}</p><div class="ti-obs">${v.opts.map((o, i) => `<button type="button" class="ti-ob" data-act="g2" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    lab.setReadout('?', v.rSub0, '', '#5fb0ff');
    lab.setState({ emo: '⏪', title: v.preT, lead: v.preL, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    lab.setFacts([]);
    return;
  }
  $('ctrlBody').innerHTML = `<div class="ti-row"><button type="button" class="btn ti-btn" data-act="${k >= 3 ? 'again2' : 'back'}">${esc(k >= 3 ? v.again : v.back)}</button>${secChip('search', false)}</div>`;
  lab.setReadout(`${k}/3`, v.rSub0, k > 0 ? `⏱ ${v.cards[k].when}` : '', '#5fb0ff');
  if (k === 0) lab.setState({ emo: g === 1 ? '👍' : '🤔', title: g === 1 ? v.right : v.wrong, lead: v.preL, body: '', extra: '' });
  else if (k === 3) lab.setState({ emo: '🕵️', title: v.stT[0], lead: v.stL[0], body: v.stB, extra: '' });
  else lab.setState({ emo: '⏪', title: v.stT[k], lead: v.stL[k], body: '', extra: '' });
  lab.setFacts(k === 3 ? v.facts : []);
}

// --- view 3: Check ----------------------------------------------------------------------------------------------
function postHtml(p, i, t) {
  const v = t.v3, st = S.P[i], done = resolved(i);
  let pic = '';
  if (i === 0) pic = `<div class="ti-pic" style="background:linear-gradient(135deg,#7a1d24,#c23a3a);padding:14px 14px 10px;color:#fff"><div style="font:900 15px/1.25 var(--sans);text-transform:uppercase">${esc(p.text)}</div><div class="fine" style="color:#ffd9d9;margin-top:6px">${esc(p.shot)}</div></div>`;
  else if (i === 1) {
    const bars = Array.from({ length: 28 }, (_, j) => `<rect x="${j * 6 + 1}" y="${14 - (3 + Math.abs(Math.sin(j * 1.7) * 9 + Math.cos(j * .6) * 3))}" width="3.4" height="${2 * (3 + Math.abs(Math.sin(j * 1.7) * 9 + Math.cos(j * .6) * 3))}" rx="1.7" fill="#7fb4ff"/>`).join('');
    pic = `<div class="ti-voice"><span class="pl">▶</span><svg viewBox="0 0 170 28" preserveAspectRatio="none" aria-hidden="true">${bars}</svg><small>${esc(p.voice)}</small></div>`;
  } else if (i === 2) pic = wrapPic(museumPic(), '');
  else if (i === 3) pic = wrapPic(catPic(), '');
  const body = i === 0 ? '' : i === 1 ? `<p class="ti-tx">🗣️ ${esc(v.listen)} “${esc(p.text)}”</p>` : `<p class="ti-tx">${esc(p.text)}</p>`;
  const tag = done ? (st.bin === BIN_OK[i] ? `<span class="ti-tag green">✓ ${esc(v.binNames[st.bin])}</span>` : `<span class="ti-tag red">${esc(v.binNames[st.bin])}</span>`)
    : st.bin === 1 ? `<span class="ti-tag amber">${esc(v.binNames[1])}</span>` : '';
  return `<article class="ti-post pick ${S.sel === i ? 'sel' : ''}" data-i="${i}">${tag}<div class="ti-ph">${face(i + 1, 36)}<div><div class="ti-nm">${esc(p.who)}${p.official ? '<em>✔</em>' : ''}</div><div class="ti-ts">${esc(p.time)}</div></div></div>
    ${body}${pic}<div class="ti-meta">${p.likes ? `<span>❤️ ${esc(p.likes)}</span>` : ''}<span>🔁</span><span>💬</span></div></article>`;
}
function render3(t) {
  const v = t.v3, n = S.P.filter((_, i) => resolved(i)).length, k = S.P.filter((p, i) => resolved(i) && p.bin === BIN_OK[i]).length, all = n === 5;
  lab.setGlow('rgba(61, 220, 151, .22)');
  let html = v.posts.map((p, i) => postHtml(p, i, t)).join('');
  if (all) html += `<div class="ti-card arrive"><h4>${esc(v.sift.t)}</h4><div class="ti-sift">${v.sift.m.map((m, i) => `<div><i>${'SIFT'[i]}</i><span><b>${esc(m[0])}</b>: ${esc(m[1])}</span></div>`).join('')}</div><p class="fine" style="margin-top:8px">${esc(v.sift.who)}</p></div>`;
  $('feed').innerHTML = phone(html);
  const i = S.sel, p = v.posts[i], st = S.P[i], done = resolved(i);
  let ctrl = `<div class="ti-who">${esc(v.post(i + 1, 5))} · ${esc(p.who)}</div>`;
  if (st.bin === null) ctrl += `<p class="ti-q">${esc(v.askBin)}</p><div class="ti-obs">${v.bins.map((b, j) => `<button type="button" class="ti-ob" data-act="bin" data-i="${j}">${esc(b)}</button>`).join('')}</div>`;
  else if (st.bin === 1 && st.chk === null) ctrl += `<p class="ti-q">${esc(v.askChk)}</p><div class="ti-obs">${v.checks.map((b, j) => `<button type="button" class="ti-ob" data-act="chk" data-i="${j}">${esc(b)}</button>`).join('')}</div>`;
  else ctrl += `<div class="ti-row"><button type="button" class="btn ti-btn" data-act="${all ? 'again3' : 'next3'}">${esc(all ? v.again : v.next)}</button></div>`;
  $('ctrlBody').innerHTML = ctrl;
  lab.setReadout(`${n}/5`, v.rSub0, n ? `✓ ${v.rightN(k)}` : '', '#3ddc97');
  if (all && done) lab.setState({ emo: '🏆', title: v.endT(k), lead: v.endL, body: p.why, extra: '' });
  else if (!done) lab.setState({ emo: '🤔', title: v.preT, lead: v.preL, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  else {
    const okBin = st.bin === BIN_OK[i], bestChk = v.checkNames[CHK_OK[i]];
    let title;
    if (okBin && st.bin !== 1) title = v.right;
    else if (okBin) title = st.chk === CHK_OK[i] ? v.checkRight(bestChk) : v.checkWrong(bestChk);
    else title = v.binWrong(v.binNames[BIN_OK[i]], bestChk);
    lab.setState({ emo: okBin ? '✅' : '🤔', title, lead: p.why, body: '', extra: '' });
  }
  const facts = [];
  if (resolved(1)) facts.push(v.facts.voice);
  if (all) facts.push(v.facts.sift);
  lab.setFacts(facts);
}

// --- events ----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
};
const nextOpen = () => { const j = S.P.findIndex((_, i) => !resolved(i)); return j < 0 ? S.sel : j; };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'g1') { S.g1 = i; S.panel1 = 'res'; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'panel1') { S.panel1 = b.dataset.k; sfx.click(); }
  else if (a === 'clue') { S.clue = i; sfx.tick(); }
  else if (a === 'flip') return flip();
  else if (a === 'g2') { S.g2 = i; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'back') { S.step = Math.min(3, S.step + 1); sfx.click(); showStage(); }
  else if (a === 'again2') { S.step = 0; S.search = false; sfx.click(); }
  else if (a === 'mod') { S.mods[b.dataset.k] = !S.mods[b.dataset.k]; sfx.tick(); }
  else if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (k === 'trust') S.panel1 = S.panel1 === 'trust' ? 'res' : 'trust'; else S.search = !S.search;
    sfx.click();
  } else if (a === 'bin') { S.P[S.sel].bin = i; (i === BIN_OK[S.sel] ? sfx.good : sfx.bad)(); if (i !== 1) showStage(); }
  else if (a === 'chk') { S.P[S.sel].chk = i; (i === CHK_OK[S.sel] ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'next3') { S.sel = nextOpen(); sfx.click(); }
  else if (a === 'again3') { S.P = [0, 1, 2, 3, 4].map(() => ({ bin: null, chk: null })); S.sel = 0; sfx.click(); }
  render();
});
$('feed').addEventListener('click', (ev) => {
  const c = ev.target.closest('.ti-post.pick'); if (!c || lab.view !== 'check') return;
  S.sel = +c.dataset.i; sfx.tick(); render();
});

function render() {
  const t = T[lang], v = lab.view;
  if (v === 'guess') render1(t); else if (v === 'trace') render2(t); else render3(t);
}
render();
</script>
</body>
</html>
