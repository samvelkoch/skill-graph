}

// --- view 2: render ------------------------------------------------------------------------------------------
function hl(txt, clues) {
  const ranges = [];
  clues.forEach((cl, k) => { let at = 0; for (;;) { const p = txt.indexOf(cl, at); if (p < 0) break; ranges.push({ s: p, e: p + cl.length, k }); at = p + cl.length; } });
  ranges.sort((a, b) => a.s - b.s);
  let out = '', pos = 0;
  for (const r of ranges) {
    if (r.s < pos) continue;
    out += `${esc(txt.slice(pos, r.s))}<mark class="cd-hl" style="--d:${(r.k * .6 + .1).toFixed(2)}s">${esc(txt.slice(r.s, r.e))}</mark>`; pos = r.e;
  }
  return out + esc(txt.slice(pos));
}
function renderCard(t) {
  const i = S.tx.i, a = S.tx.a, key = `${lang}|${i}|${a === null ? 0 : 1}`;
  if (S.cardKey === key) return;
  S.cardKey = key;
  const txt = t.x.texts[i];
  $('cdTexts').innerHTML = `<div class="cd-card"><i class="cd-tape"></i><p class="cd-text">${a === null ? esc(txt) : hl(txt, t.x.clues[i])}</p><span class="cd-num">${i + 1} / 4</span></div>${LENS_DECO}`;
  if (a !== null) {
    requestAnimationFrame(() => requestAnimationFrame(() => $('cdTexts').querySelectorAll('mark').forEach((m) => m.classList.add('on'))));
    t.x.clues[i].forEach((_, k) => setTimeout(() => { if (S.cardKey === key) sfx.tick(); }, 100 + k * 600));
  }
}
function renderTexts(t) {
  const x = t.x, i = S.tx.i, a = S.tx.a, last = i === 3;
  renderCard(t);
  let h = `<p class="cd-q">${esc(x.q[i])}</p><div class="cd-opts">${x.o[i].map((o, j) => `<button class="cd-opt ${a === null ? '' : j === x.ok[i] ? 'good' : j === a ? 'bad' : 'dim'}" data-j="${j}"${a !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
  if (a !== null) h += `<div class="cd-res"><p class="cd-verdict ${a === x.ok[i] ? 'ok' : 'no'}">${esc(a === x.ok[i] ? t.right : t.wrong)}</p><p class="cd-why">${esc(x.why[i])}</p><button class="btn" data-act="${last ? 'again' : 'next'}">${esc(last ? t.again : t.next)}</button></div>`;
  $('secTexts').innerHTML = h;
  stateCard(t, 'texts'); updateReadout();
}

// --- view 3: render ------------------------------------------------------------------------------------------
function buildBoard(t) {
  const i = S.my.i, y = t.y, key = `${lang}|${i}`;
  if (S.boardKey === key) return;
  S.boardKey = key;
  const rot = ['-2deg', '1.6deg', '-1.2deg', '2deg'], n = y.clues[i].length;
  $('cdBoard').innerHTML = `<div class="cd-note"><i class="cd-pin"></i>${esc(y.m[i])}</div><p class="cd-ask">${esc(y.q[i])}</p>
    <div class="cd-sus">${y.sus[i].map((nm, j) => `<button class="cd-sc" data-j="${j}" style="--r:${rot[j]}" tabindex="-1"><i class="cd-pin"></i>${PORTRAIT[MYK[i][j]]}<span>${esc(nm)}</span><b class="cd-stamp">${esc(y.solved)}</b></button>`).join('')}</div>
    <div class="cd-clues" style="--n:${n}">${y.clues[i].map((cl, k) => `<div class="cd-slot" data-k="${k}"><div class="cd-cc" style="--r:${rot[(k + 2) % 4]}"><i class="cd-pin"></i>${CLUEART[i][k]}<span>${esc(cl)}</span></div></div>`).join('')}</div>
    <div class="cd-bar"><button class="btn" id="cdNext">${esc(y.nextClue)}</button></div>
    <div class="cd-fin" id="cdFin"></div><svg class="cd-str" id="cdStr" aria-hidden="true"></svg>`;
}
function layoutStrings(animate) {
  const bd = $('cdBoard'), svg = $('cdStr'), m = S.my, ok = T[lang].y.ok[m.i];
  if (!bd || !svg || m.a === null) return;
  const r0 = bd.getBoundingClientRect(), mid = (el) => { const r = el.querySelector('.cd-pin').getBoundingClientRect(); return [r.left + r.width / 2 - r0.left, r.top + r.height / 2 - r0.top]; };
  const [tx, ty] = mid(bd.querySelectorAll('.cd-sc')[ok]);
  svg.innerHTML = '';
  bd.querySelectorAll('.cd-slot').forEach((slot, k) => {
    const [px, py] = mid(slot.querySelector('.cd-cc'));
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${px.toFixed(1)} ${py.toFixed(1)} Q${((px + tx) / 2).toFixed(1)} ${(Math.max(py, ty) + 26).toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)}`);
    path.setAttribute('fill', 'none'); path.setAttribute('stroke', '#D63A3A'); path.setAttribute('stroke-width', '2.6'); path.setAttribute('stroke-linecap', 'round');
    path.style.filter = 'drop-shadow(0 2px 1.5px rgba(60,20,10,.45))';
    svg.appendChild(path);
    if (animate) {
      const len = path.getTotalLength();
      path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
      void path.getBoundingClientRect();
      path.style.transition = `stroke-dashoffset .6s ease-out ${(k * .45).toFixed(2)}s`; path.style.strokeDashoffset = 0;
      setTimeout(() => sfx.tick(), k * 450);
    }
  });
}
function syncBoard(t) {
  const m = S.my, y = t.y, n = y.clues[m.i].length, ok = y.ok[m.i], bd = $('cdBoard'), all = m.shown >= n;
  bd.querySelectorAll('.cd-slot').forEach((el, k) => el.classList.toggle('in', k < m.shown));
  $('cdNext').style.display = all ? 'none' : '';
  bd.querySelectorAll('.cd-sc').forEach((el, j) => {
    el.classList.toggle('act', all && m.a === null); el.classList.toggle('win', m.a !== null && j === ok); el.classList.toggle('no', m.a !== null && j === m.a && j !== ok);
    el.tabIndex = all && m.a === null ? 0 : -1;
  });
  const last = m.i === 1;
  $('cdFin').innerHTML = m.a === null ? '' : `<p class="cd-verdict ${m.a === ok ? 'ok' : 'no'}">${esc(m.a === ok ? t.right : t.wrong)}</p><p class="cd-why">${esc(y.why[m.i])}</p><button class="btn" data-act="${last ? 'again' : 'next'}">${esc(last ? t.again : t.next)}</button>`;
  if (m.a !== null) { const anim = !m.str; m.str = true; layoutStrings(anim); } else $('cdStr').innerHTML = '';
}
function renderMys(t) { buildBoard(t); syncBoard(t); stateCard(t, 'mystery'); updateReadout(); }
$('cdBoard').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const m = S.my, t = T[lang], n = t.y.clues[m.i].length;
  if (b.id === 'cdNext') { if (m.shown < n) { m.shown++; sfx.click(); render(); } return; }
  if (b.classList.contains('cd-sc')) {
    if (m.shown < n || m.a !== null) return;
    m.a = +b.dataset.j; const ok = m.a === t.y.ok[m.i]; m.right[m.i] = ok; (ok ? sfx.good : sfx.bad)(); render();
    setTimeout(() => $('cdFin').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 150);
    return;
  }
  if (b.dataset.act === 'next') { m.i++; m.shown = 0; m.a = null; m.str = false; sfx.click(); render(); }
  else if (b.dataset.act === 'again') { S.my = { i: 0, shown: 0, a: null, right: [], str: false }; sfx.click(); render(); }
});
addEventListener('resize', () => { if (lab.view === 'mystery' && S.my.a !== null) layoutStrings(false); });

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const v = lab.view, act = b.dataset.act;
  if (b.classList.contains('cd-opt')) {
    const j = +b.dataset.j;
    if (v === 'scene') {
      if (S.ans[S.step] !== null) return;
      S.ans[S.step] = j; (j === OKQ[S.step] ? sfx.good : sfx.bad)(); startTour(); render(); showStage();
    } else if (S.tx.a === null) {
      S.tx.a = j; const ok = j === T[lang].x.ok[S.tx.i]; S.tx.right[S.tx.i] = ok; (ok ? sfx.good : sfx.bad)(); render(); showStage();
    }
    return;
  }
  if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'tracks') startTracks(); else { S.sunF = .12; $('sunR').value = 12; } }
    sfx.click();
  } else if (act === 'next') { if (v === 'scene') sceneNext(); else { S.tx.i++; S.tx.a = null; } sfx.click(); }
  else if (act === 'again') {
    if (v === 'scene') sceneAgain(); else S.tx = { i: 0, a: null, right: [] };
    sfx.click();
  } else if (act === 'scene') { S.freeScene = b.dataset.k; S.tour = null; S.lens.x = 200; S.lens.y = 170; sfx.click(); }
  else if (act === 'animal') return walkAnimal(b.dataset.k);
  else if (act === 'shuffle') { startTracks(); sfx.click(); }
  render();
});
$('sunR').addEventListener('input', (ev) => { S.sunF = clamp(+ev.target.value / 100, 0, 1); updateReadout(); });

// --- one render per change -----------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secScene').style.display = v === 'scene' ? '' : 'none';
  $('secTexts').style.display = v === 'texts' ? '' : 'none';
  $('ctrlBody').style.display = v === 'mystery' ? 'none' : '';
  lab.setGlow(v === 'scene' ? 'rgba(217, 164, 65, .24)' : v === 'texts' ? 'rgba(255, 229, 138, .16)' : 'rgba(201, 160, 107, .24)');
  // no hidden copies of another view's buttons stay in the page
  if (v !== 'scene') $('cdPick').innerHTML = '';
  if (v !== 'texts') { $('secTexts').innerHTML = ''; $('cdTexts').innerHTML = ''; S.cardKey = ''; }
  if (v !== 'mystery') { $('cdBoard').innerHTML = ''; S.boardKey = ''; }
  if (v === 'scene') renderScene(t); else if (v === 'texts') renderTexts(t); else renderMys(t);
}
render();
</script>
</body>
