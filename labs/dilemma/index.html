  c.fillStyle = g; c.beginPath(); c.ellipse(x, y, 54, 7.5, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  // value token
  c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(x, y + 1, 15, 4, 0, 0, 7); c.fill();
  drawCoin(c, x, y - 16, 16, tok);
  // weights
  S[side].forEach((w, idx) => {
    const [dx, dy] = slotOf(idx), tx = x + dx, ty = y + dy, end = w.born + w.dur;
    if (time < w.born) return;
    if (time >= end) {
      if (!w.landed) { w.landed = true; sfx.tick(); }
      const k = c01((time - end) / 0.3);
      drawWeight(c, tx, ty - Math.sin(k * Math.PI) * 2.5 * (end > 0 ? 1 : 0), w.kind);
    } else {
      const u = (time - w.born) / w.dur, e = easeInOut(u);
      drawWeight(c, w.fx + (tx - w.fx) * e, w.fy + (ty - w.fy) * e - Math.sin(u * Math.PI) * 34, w.kind);
    }
  });
  // front lip
  c.strokeStyle = '#f6e3a0'; c.lineWidth = 2.2; c.beginPath(); c.ellipse(x, y, 54, 7.5, 0, 0.04 * Math.PI, 0.96 * Math.PI); c.stroke();
  c.restore();
  if (labels) pill(c, nameOf(tok), x, y + 42, fsz(13));
}

function drawScale(c, time, labels) {
  const a = S.ang;
  // soft shadow on the table, base and column
  c.save(); c.lineJoin = 'round';
  c.fillStyle = 'rgba(0,0,0,.32)'; c.beginPath(); c.ellipse(186, TABLE + 1, 82, 7, 0, 0, 7); c.fill();
  let g = c.createLinearGradient(0, TABLE - 18, 0, TABLE + 4);
  g.addColorStop(0, '#ecca78'); g.addColorStop(1, '#8f6a22');
  c.fillStyle = g; c.beginPath(); c.ellipse(180, TABLE - 6, 66, 9, 0, 0, 7); c.fill(); c.lineWidth = 1.6; c.strokeStyle = '#5c4214'; c.stroke();
  g = c.createLinearGradient(0, TABLE - 24, 0, TABLE - 10); g.addColorStop(0, '#f7e4a2'); g.addColorStop(1, '#c39a43');
  c.fillStyle = g; c.beginPath(); c.ellipse(180, TABLE - 12, 40, 6, 0, 0, 7); c.fill(); c.stroke();
  g = c.createLinearGradient(168, 0, 192, 0);
  g.addColorStop(0, '#9a7228'); g.addColorStop(0.3, '#f4dd90'); g.addColorStop(0.62, '#c39a43'); g.addColorStop(1, '#6f5019');
  c.fillStyle = g; c.beginPath(); c.moveTo(174, PY); c.lineTo(186, PY); c.lineTo(190, TABLE - 14); c.lineTo(170, TABLE - 14); c.closePath(); c.fill(); c.stroke();
  c.restore();
  drawPan(c, 'L', time, labels); drawPan(c, 'R', time, labels);
  // beam
  c.save(); c.translate(PX, PY); c.rotate(a); c.lineJoin = 'round';
  g = c.createLinearGradient(0, -6, 0, 6); g.addColorStop(0, '#fbeab4'); g.addColorStop(0.5, '#d9b050'); g.addColorStop(1, '#8b6420');
  c.fillStyle = g; c.beginPath(); c.roundRect(-ARM - 8, -5.5, 2 * ARM + 16, 11, 5.5); c.fill(); c.lineWidth = 1.6; c.strokeStyle = '#5c4214'; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(-ARM + 4, -2.6); c.lineTo(ARM - 4, -2.6); c.stroke();
  for (const s of [-1, 1]) {
    const k = c.createRadialGradient(s * ARM - 2, -2.5, 1, s * ARM, 0, 8);
    k.addColorStop(0, '#fff0b8'); k.addColorStop(1, '#a8761f');
    c.fillStyle = k; c.beginPath(); c.arc(s * ARM, 0, 7, 0, 7); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#5c4214'; c.stroke();
  }
  c.restore();
  // pivot
  g = c.createRadialGradient(PX - 3, PY - 3, 1, PX, PY, 12); g.addColorStop(0, '#fff0b8'); g.addColorStop(0.6, '#d9b050'); g.addColorStop(1, '#8b6420');
  c.fillStyle = g; c.beginPath(); c.arc(PX, PY, 11, 0, 7); c.fill(); c.lineWidth = 1.6; c.strokeStyle = '#5c4214'; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.arc(PX - 3.5, PY - 3.5, 2.2, 0, 7); c.fill();
}

function drawCardObj(c, cd, time) {
  if (!cd || time < cd.born) return false;
  const fs = fsz(13.5), lh = fs * 1.22;
  c.save(); c.font = FONT(fs);
  const lines = wrap(c, cd.get(), 226), h = lines.length * lh + 18, wd = 300;
  const u = c01((time - cd.born) / 0.6);
  let x = 30 + (1 - easeOutBack(u)) * 420, y = 8, al = 1;
  if (cd.out !== null) { const o = c01((time - cd.out) / 0.5); y -= o * 26; al = 1 - o; if (o >= 1) { c.restore(); return true; } }
  c.globalAlpha = al; c.translate(x + wd / 2, y + h / 2); c.rotate(-0.012); c.translate(-(x + wd / 2), -(y + h / 2));
  c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 12; c.shadowOffsetY = 5;
  const g = c.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#fff5d6'); g.addColorStop(1, '#efd79b');
  c.fillStyle = g; c.beginPath(); c.roundRect(x, y, wd, h, 10); c.fill();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
  c.lineWidth = 1.5; c.strokeStyle = '#a8842f'; c.stroke();
  c.fillStyle = 'rgba(168,132,47,.18)'; c.beginPath(); c.roundRect(x + 5, y + 5, 40, h - 10, 7); c.fill();
  c.font = `22px ${EMO}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000'; c.fillText(cd.emo, x + 25, y + h / 2 + 1);
  c.font = FONT(fs); c.fillStyle = '#3b2b0e'; c.textAlign = 'left';
  lines.forEach((ln, i) => c.fillText(ln, x + 54, y + 9 + lh * (i + 0.5) + 1));
  c.fillStyle = '#d4493a'; c.beginPath(); c.arc(x + wd / 2, y + 1, 4.5, 0, 7); c.fill(); c.lineWidth = 1; c.strokeStyle = '#7a2218'; c.stroke();
  c.restore();
  return false;
}

function drawPerson(c, p) {
  const r = 11, x = p.x, y = p.y - p.hop;
  c.save(); c.globalAlpha = 1; c.lineJoin = 'round';
  c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(p.x, p.y + r * 0.95, r * 0.9, r * 0.3, 0, 0, 7); c.fill();
  const g = c.createRadialGradient(x - r * 0.4, y - r * 0.5, r * 0.15, x, y, r * 1.1);
  g.addColorStop(0, mix(p.col, '#ffffff', 0.5)); g.addColorStop(1, shade(p.col, 0.22));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.lineWidth = 1.5; c.strokeStyle = shade(p.col, 0.5); c.stroke();
  for (const s of [-1, 1]) {
    const ex = x + s * r * 0.38, ey = y - r * 0.12;
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ex, ey, r * 0.26, 0, 7); c.fill();
    c.fillStyle = '#1c1c2c'; c.beginPath(); c.arc(ex + s * 0.3, ey + 0.5, r * 0.13, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + s * 0.3 - 0.9, ey - 0.4, r * 0.05, 0, 7); c.fill();
  }
  c.strokeStyle = '#3a2a2a'; c.lineWidth = 1.3; c.lineCap = 'round'; c.beginPath(); c.arc(x, y + r * 0.12, r * 0.38, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();
  if (p.you) { c.strokeStyle = '#ffd24a'; c.lineWidth = 2.4; c.beginPath(); c.arc(x, y, r + 3, 0, 7); c.stroke(); }
  c.restore();
}

function drawBubble(c, x, y, w, h, lines, col, emo, tailX, u, fs) {
  if (u <= 0) return;
  const s = 0.6 + 0.4 * easeOutBack(u), lh = fs * 1.22;
  c.save(); c.globalAlpha = c01(u * 1.5);
  c.translate(tailX, y); c.scale(s, s); c.translate(-tailX, -y);
  c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 10; c.shadowOffsetY = 4;
  c.fillStyle = '#fbf6e6'; c.beginPath(); c.roundRect(x, y, w, h, 12); c.fill();
  c.beginPath(); c.moveTo(tailX - 8, y + 1); c.lineTo(tailX, y - 9); c.lineTo(tailX + 8, y + 1); c.closePath(); c.fill();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
  c.lineWidth = 2; c.strokeStyle = col; c.beginPath(); c.roundRect(x, y, w, h, 12); c.stroke();
  c.fillStyle = col; c.beginPath(); c.arc(x + 14, y + 14, 11, 0, 7); c.fill();
  c.font = `13px ${EMO}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000'; c.fillText(emo, x + 14, y + 15);
  c.font = FONT(fs, 700); c.fillStyle = '#2f2a1c'; c.textAlign = 'left';
  lines.forEach((ln, i) => c.fillText(ln, x + 10, y + 32 + lh * i + lh * 0.4));
  c.restore();
}

// --- the loop: physics of the beam, then the picture -------------------------------------------------------
const crowdOn = () => lab.view === 'crowd' && !S.sec;
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const layout = crowdOn() ? 'crowd' : 'scale', DH = layout === 'crowd' ? 480 : 340;
  const f = Math.min(w / DW, h / DH), ox = (w - DW * f) / 2, oy = (h - DH * f) / 2;
  G.f = f; G.tk = f;

  // beam target (degrees): the pull of the landed weights, 5 degrees per unit
  let tgt = 0, k = 55, damp = 6.5, lim = 26;
  if (S.sec === 'temp') { if (S.tp.go) { tgt = -26; k = 220; damp = 4; } }
  else if (S.sec === 'make') tgt = S.mk.lean * 8;
  else if (layout !== 'crowd') tgt = clamp((landedCount('R', time) - landedCount('L', time)) * 5, -22, 22);
  const rt = tgt * Math.PI / 180, L = lim * Math.PI / 180;
  S.vel += (k * (rt - S.ang) - damp * S.vel) * dt; S.ang += S.vel * dt;
  if (S.ang > L) { S.ang = L; S.vel = -Math.abs(S.vel) * 0.35; } else if (S.ang < -L) { S.ang = -L; S.vel = Math.abs(S.vel) * 0.35; }

  c.save(); c.translate(ox, oy); c.scale(f, f); c.lineJoin = 'round';
  // wall with light from the top left
  let g = c.createLinearGradient(0, -80, 0, DH + 80); g.addColorStop(0, '#26305a'); g.addColorStop(1, '#131830');
  c.fillStyle = g; c.fillRect(-700, -700, DW + 1400, DH + 1400);
  g = c.createRadialGradient(40, 10, 10, 40, 10, 340); g.addColorStop(0, 'rgba(255,226,170,.22)'); g.addColorStop(1, 'rgba(255,226,170,0)');
  c.fillStyle = g; c.fillRect(-700, -700, DW + 1400, DH + 1400);

  if (layout === 'scale') {
    g = c.createLinearGradient(0, TABLE, 0, TABLE + 70); g.addColorStop(0, '#80583a'); g.addColorStop(1, '#4a2f1b');
    c.fillStyle = g; c.fillRect(-700, TABLE, DW + 1400, 800);
    c.fillStyle = 'rgba(255,225,180,.45)'; c.fillRect(-700, TABLE, DW + 1400, 2);
    c.fillStyle = 'rgba(0,0,0,.2)'; c.fillRect(-700, TABLE + 26, DW + 1400, 1.5);
    drawScale(c, time, true);
    if (prevCard) { if (drawCardObj(c, prevCard, time)) prevCard = null; }
    if (card) { if (drawCardObj(c, card, time)) card = null; }
  } else {
    drawCrowd(c, time, dt, f);
  }
  c.restore();
});

function drawCrowd(c, time, dt, f) {
  const kg = 0.7, tx0 = 54, ty0 = 8, shelf = ty0 + TABLE * kg;
  let g = c.createLinearGradient(0, shelf, 0, shelf + 12); g.addColorStop(0, '#80583a'); g.addColorStop(1, '#4a2f1b');
  c.fillStyle = g; c.fillRect(-700, shelf, DW + 1400, 12);
  c.fillStyle = 'rgba(255,225,180,.45)'; c.fillRect(-700, shelf, DW + 1400, 1.5);
  g = c.createLinearGradient(0, shelf + 12, 0, 520); g.addColorStop(0, '#2c3764'); g.addColorStop(1, '#1b2244');
  c.fillStyle = g; c.fillRect(-700, shelf + 12, DW + 1400, 1200);
  c.save(); c.translate(tx0, ty0); c.scale(kg, kg); G.tk = f * kg; drawScale(c, time, false); c.restore(); G.tk = f;

  // crowd targets
  const pick = S.v3.pick, grp = { L: [], R: [] };
  if (pick) people.forEach((p) => grp[p.you ? pick : p.side].push(p));
  people.forEach((p) => {
    let tx = p.cx, ty = p.cy;
    if (pick) {
      const side = p.you ? pick : p.side, k = grp[side].indexOf(p), gx = side === 'L' ? 103 : 257;
      tx = gx + ((k % 4) - 1.5) * 27; ty = 266 + Math.floor(k / 4) * 27;
    }
    const sp = Math.min(1, dt * 5), dx = tx - p.x, dy = ty - p.y;
    p.x += dx * sp; p.y += dy * sp;
    p.hop = Math.hypot(dx, dy) > 2 ? Math.abs(Math.sin(time * 16 + p.ph)) * 4 : 0;
  });
  [...people].sort((a, b) => a.y - b.y).forEach((p) => drawPerson(c, p));
  const fs = fsz(13);
  if (pick) {
    const nL = grp.L.length, nR = grp.R.length;
    pill(c, `${VAL.honesty.emo} ${nL}`, 103, 242, fs); pill(c, `${VAL.kindness.emo} ${nR}`, 257, 242, fs);
    const you = people[19]; pill(c, T[lang].you, you.x, you.y - 22 - you.hop, fs, '#f0c24a', '#3a2a10');
    // speech bubbles from both sides
    const t = T[lang].w3, u = c01((time - S.v3.t0) / 0.6), bw = 168, by = 354;
    c.font = FONT(fs, 700);
    const lnL = wrap(c, t.bubH, bw - 20), lnR = wrap(c, t.bubK, bw - 20), n = Math.max(lnL.length, lnR.length), bh = n * fs * 1.22 + 40;
    drawBubble(c, 8, by, bw, bh, lnL, VAL.honesty.c, VAL.honesty.emo, 103, u, fs);
    drawBubble(c, 184, by, bw, bh, lnR, '#d9a52a', VAL.kindness.emo, 257, u, fs);
  }
}

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const res1 = (t = now() + 5) => { const d = landedCount('R', t) - landedCount('L', t); return d < 0 ? 'L' : d > 0 ? 'R' : 'E'; };

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, t = now();
  if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click(); rebuild(); render(); return;
  }
  if (a === 'p1') { // view 1: the guess
    const s = S.v1; if (s.st !== 'ask') return;
    s.pick = b.dataset.p; s.st = 'fly'; sfx.click();
    const cd = C1[s.i]; addW(cd.side, cd.n, 180, 36, t + 0.1); dropCard();
    setTimeout(() => { if (S.v1 === s && s.st === 'fly') { s.st = 'shown'; (s.pick === res1() ? sfx.good : sfx.bad)(); render(); showStage(); } }, 1500);
  } else if (a === 'n1') {
    const s = S.v1; sfx.click();
    if (s.st === 'end') S.v1 = { i: 0, pick: null, st: 'ask' };
    else if (s.i >= 3) { s.i = 4; s.st = 'end'; } else { s.i++; s.pick = null; s.st = 'ask'; }
    rebuild();
  } else if (a === 'c2') { // view 2: a choice before and after the new fact
    const s = S.v2, d = DIL[s.d];
    if (s.step === 0) {
      s.c1 = b.dataset.c; s.step = 1; s.lock = t + 2.4; sfx.click();
      setCard(() => T[lang].w2.dil[s.d].fcap, '💡'); addW(d.side, d.n, 180, 36, t + 0.9);
      setTimeout(() => { render(); }, 2500);
    } else if (s.step === 1 && t >= s.lock) { s.c2 = b.dataset.c; s.step = 2; sfx.click(); showStage(); }
  } else if (a === 'n2') {
    const s = S.v2; sfx.click();
    if (s.d >= 2) S.v2 = { d: 0, step: 0, c1: null, c2: null, lock: 0 }; else S.v2 = { d: s.d + 1, step: 0, c1: null, c2: null, lock: 0 };
    rebuild();
  } else if (a === 'c3') { // view 3: your choice, then the class answers
    const first = !S.v3.pick; S.v3.pick = b.dataset.c; if (first) S.v3.t0 = t; sfx.click(); if (first) setTimeout(showStage, 600);
  } else if (a === 'mv') { // secret: pick values
    const k = b.dataset.k, p = S.mk.picks, i = p.indexOf(k);
    if (i >= 0) p.splice(i, 1); else { p.push(k); if (p.length > 2) p.shift(); }
    S.mk.lean = 0; sfx.click(); rebuild();
  } else if (a === 'ms') { S.mk.sit = +b.dataset.i; sfx.click(); }
  else if (a === 'ml') { S.mk.lean = +b.dataset.l; sfx.click(); }
  else if (a === 'tgo') { // secret: the temptation
    if (S.tp.go) return;
    S.tp.go = true; sfx.push(); addW('L', 4, 100, 30, t); setTimeout(() => { render(); showStage(); }, 1300);
  } else if (a === 'tmore') {
    if (S.tp.coins >= 4) return;
    S.tp.coins++; addW('R', 1, 260, 30, t, 'coin'); sfx.click();
  }
  render();
});

// --- one render per change: controls, readout, state card and facts ------------------------------------------
const btn = (act, attrs, cls, text, dis) => `<button type="button" class="dl-opt ${cls || ''}" data-act="${act}" ${attrs} ${dis ? 'disabled' : ''}>${esc(text)}</button>`;

function render() {
  const t = T[lang], v = lab.view;
  const layout = crowdOn() ? 'crowd' : 'weigh';
  document.body.dataset.v = layout;
  const secOn = { dlW: !S.sec && v === 'weigh', dlF: !S.sec && v === 'fact', dlC: !S.sec && v === 'crowd', dlM: S.sec === 'make', dlT: S.sec === 'temp' };
  for (const id in secOn) $(id).classList.toggle('on', secOn[id]);
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('make', '🛠️') + sc('temp', '🪙');
  if (S.sec === 'make') return renderMake(t);
  if (S.sec === 'temp') return renderTemp(t);
  lab.setFacts(t.facts[v]);
  if (v === 'weigh') renderW(t); else if (v === 'fact') renderF(t); else renderC(t);
}

const leanText = (t, d, nl, nr) => (d < 0 ? t.lean(nl) : d > 0 ? t.lean(nr) : t.level);

function renderW(t) {
  const s = S.v1, w = t.w1, end = s.st === 'end', now_ = now();
  const nl = t.val.honesty, nr = t.val.loyalty;
  lab.setGlow('rgba(224, 176, 80, .24)');
  const Lc = landedCount('L', now_), Rc = landedCount('R', now_);
  lab.setReadout(`${Lc} : ${Rc}`, `${VAL.honesty.emo} ${nl} : ${VAL.loyalty.emo} ${nr}`, s.i === 0 && s.st === 'ask' ? '' : leanText(t, Rc - Lc, nl, nr), '#e0b050');
  const shown = s.st === 'shown', rr = res1();
  const opts = [['L', `◀ ${VAL.honesty.emo} ${nl}`], ['E', w.levelOpt], ['R', `${VAL.loyalty.emo} ${nr} ▶`]];
  let html = '';
  if (!end) {
    html += `<div class="dl-q">${esc(w.q)}</div><div class="dl-opts">${opts.map(([p, lbl]) => btn('p1', `data-p="${p}"`,
      shown && p === rr ? 'good' : (s.st !== 'ask' && s.pick === p ? (shown ? 'bad' : 'sel') : ''), lbl, s.st !== 'ask')).join('')}</div>`;
    if (shown) html += `<div class="dl-row"><button type="button" class="btn push" data-act="n1">${esc(w.next)}</button></div>`;
  } else html += `<div class="dl-row"><button type="button" class="btn" data-act="n1">${esc(w.again)}</button></div>`;
  $('dlW').innerHTML = html;
  if (end) lab.setState({ emo: '⚖️', title: w.end[0], lead: w.end[1], body: '', extra: '' });
  else if (s.st === 'ask') {
    if (s.i === 0) lab.setState({ emo: w.intro[0], title: w.intro[1], lead: w.intro[2], body: w.intro[3], extra: '' });
    else lab.setState({ emo: '📝', title: w.cardN(s.i + 1), lead: `“${w.cards[s.i][0]}”`, body: w.q, extra: '' });
  } else if (s.st === 'fly') lab.setState({ emo: '⚖️', title: w.wait, lead: '', body: '', extra: '' });
  else {
    const ok = s.pick === rr, name = rr === 'L' ? nl : nr;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? w.right : w.wrong, lead: w.cards[s.i][1], body: rr === 'E' ? w.resE : w.res(name), extra: '' });
  }
}

function renderF(t) {
  const s = S.v2, w = t.w2, d = DIL[s.d], td = w.dil[s.d], now_ = now();
  const nl = t.val[d.L], nr = t.val[d.R];
  lab.setGlow('rgba(143, 127, 208, .26)');
  const Lc = landedCount('L', now_), Rc = landedCount('R', now_);
  lab.setReadout(`${Lc} : ${Rc}`, `${VAL[d.L].emo} ${nl} : ${VAL[d.R].emo} ${nr}`, leanText(t, Rc - Lc, nl, nr), '#8f7fd0');
  const lock = s.step === 1 && now_ < s.lock, opts = [['L', td.a, d.L], ['R', td.b, d.R]];
  const mark = (c) => (s.step === 2 && s.c2 === c ? 'sel' : s.step === 1 && s.c1 === c ? 'sel' : '');
  let html = `<div class="dl-p">${esc(td.text)}</div>`;
  if (s.step >= 1) html += `<div class="dl-q">💡 ${esc(td.ftext)}</div>`;
  html += `<div class="dl-opts">${opts.map(([c, lbl, k]) => btn('c2', `data-c="${c}"`, `wide ${s.step === 2 ? mark(c) : ''}`, `${VAL[k].emo} ${lbl}`, s.step === 2 || lock)).join('')}</div>`;
  if (s.step >= 1) { const c1 = opts.find((o) => o[0] === s.c1); html += `<div class="dl-note">${esc(w.first)} ${VAL[c1[2]].emo} ${esc(c1[1])}</div>`; }
  if (s.step === 1 && !lock) html += `<div class="dl-note" style="color:var(--soft)">${esc(w.factAsk)}</div>`;
  if (s.step === 2) html += `<div class="dl-row"><button type="button" class="btn push" data-act="n2">${esc(s.d >= 2 ? w.again : w.next)}</button></div>`;
  $('dlF').innerHTML = html;
  if (s.step === 0) lab.setState({ emo: d.emo, title: td.cap, lead: w.askLead, body: '', extra: '' });
  else if (s.step === 1) lab.setState({ emo: '💡', title: w.factTitle, lead: td.ftext, body: w.factAsk, extra: '' });
  else lab.setState({ emo: '⚖️', title: w.resTitle, lead: s.c1 === s.c2 ? w.same : w.diff, body: td.lesson, extra: '' });
}

function renderC(t) {
  const w = t.w3, pick = S.v3.pick;
  lab.setGlow('rgba(240, 194, 74, .24)');
  const nH = 8 + (pick === 'L' ? 1 : 0), nK = 11 + (pick === 'R' ? 1 : 0);
  lab.setReadout(pick ? `${nH} : ${nK}` : '?', pick ? `${VAL.honesty.emo} ${t.val.honesty} : ${VAL.kindness.emo} ${t.val.kindness}` : w.ask, pick ? w.sub : '', '#f0c24a');
  $('dlC').innerHTML = `<div class="dl-p">${esc(w.text)}</div><div class="dl-opts">${[['L', `${VAL.honesty.emo} ${w.a}`], ['R', `${VAL.kindness.emo} ${w.b}`]]
    .map(([c, lbl]) => btn('c3', `data-c="${c}"`, `wide ${pick === c ? 'sel' : ''}`, lbl)).join('')}</div>`;
  if (!pick) lab.setState({ emo: w.pre[0], title: w.pre[1], lead: w.pre[2], body: '', extra: '' });
  else lab.setState({ emo: '👥', title: w.title, lead: w.counts(nH, nK), body: w.body, extra: '' });
}

function renderMake(t) {
  const m = t.mk, p = S.mk.picks, ready = p.length === 2;
  lab.setFacts([]); lab.setGlow('rgba(95, 168, 160, .26)');
  lab.setReadout(ready ? `${VAL[p[0]].emo} : ${VAL[p[1]].emo}` : '?', ready ? `${t.val[p[0]]} : ${t.val[p[1]]}` : m.capWait, ready ? leanText(t, S.mk.lean, t.val[p[0]], t.val[p[1]]) : '', '#5fa8a0');
  let html = `<div class="dl-row" style="margin-top:0"><span class="lbl">${esc(m.vals)}</span></div><div class="dl-opts" style="margin-top:6px">${VKEYS.map((k) => btn('mv', `data-k="${k}"`, `dl-chip ${p.includes(k) ? 'sel' : ''}`, `${VAL[k].emo} ${t.val[k]}`)).join('')}</div>`;
  html += `<div class="dl-row"><span class="lbl">${esc(m.sit)}</span></div><div class="dl-opts" style="margin-top:6px">${m.sitL.map((l, i) => btn('ms', `data-i="${i}"`, `dl-chip ${S.mk.sit === i ? 'sel' : ''}`, l)).join('')}</div>`;
  if (ready) html += `<div class="dl-opts" style="margin-top:12px">${btn('ml', 'data-l="-1"', S.mk.lean < 0 ? 'sel' : '', `◀ ${VAL[p[0]].emo}`)}${btn('ml', 'data-l="0"', S.mk.lean === 0 ? 'sel' : '', m.level)}${btn('ml', 'data-l="1"', S.mk.lean > 0 ? 'sel' : '', `${VAL[p[1]].emo} ▶`)}</div>`;
  $('dlM').innerHTML = html;
  if (!ready) lab.setState({ emo: m.empty[0], title: m.empty[1], lead: m.empty[2], body: '', extra: '' });
  else lab.setState({ emo: '🛠️', title: m.ready, lead: `${m.sits[S.mk.sit]} ${m.ask(t.pull[p[0]], t.pull[p[1]])}`, body: m.body, extra: '' });
}

function renderTemp(t) {
  const m = t.tp, s = S.tp;
  lab.setFacts([]); lab.setGlow('rgba(229, 96, 77, .26)');
  lab.setReadout(s.go ? '💥' : '?', `${VAL.honesty.emo} ${t.val.honesty} : ${VAL.coins.emo} ${m.extra}`, '', '#e5604d');
  $('dlT').innerHTML = `<div class="dl-p">${esc(m.sit)}</div><div class="dl-opts">${btn('tgo', '', s.go ? '' : 'sel', m.go, s.go)}${s.go ? btn('tmore', '', '', m.more, s.coins >= 4) : ''}</div>`;
  if (!s.go) lab.setState({ emo: m.intro[0], title: m.intro[1], lead: m.intro[2], body: m.intro[3], extra: '' });
  else lab.setState({ emo: m.after[0], title: m.after[1], lead: m.after[2], body: s.coins ? m.more2 : m.after[3], extra: '' });
}

rebuild();
render();
</script>
</body>
</html>
