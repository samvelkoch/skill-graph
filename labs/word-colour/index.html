$('ctrlBody').addEventListener('click', (ev) => {

  if (a === 'sc') { S.sc = +b.dataset.i; sfx.click(); }

  else if (a === 'next') { if (w.ph === 1) { w.ph = 2; w.g = -1; } else { w.ph = 4; w.pos = 3; } sfx.click(); }
  else if (a === 'stop') { w.pos = +b.dataset.i; sfx.tick(); }
  else if (a === 'tab') { S.n.tab = +b.dataset.i; sfx.click(); }
  else if (a === 'tok') { const s = S.n.sel[S.n.tab], j = +b.dataset.j; if (s.has(j)) s.delete(j); else s.add(j); sfx.tick(); }
  else if (a === 'check') { S.n.checked = true; sfx.good(); showStage(); }
  else if (a === 'again') { S.n = freshN(); sfx.click(); }
  else if (a === 'tgt') { S.p.target = +b.dataset.k; S.p.read = false; sfx.click(); }
  else if (a === 'gap') { const s = +b.dataset.s; S.p.pick[s] = (S.p.pick[s] + 1) % 3; S.p.read = false; sfx.tick(); }
  else if (a === 'read') { S.p.pct = pctOf(); S.p.read = true; S.p.speak = 2.6; (S.p.pct === 100 ? sfx.good : sfx.snap)(); showStage(); }
  else if (a === 'sec') { const k = b.dataset.k; if (!secret.unlocked()) return secret.open(); S.sec = S.sec === k ? null : k; if (S.sec === 'a') S.aStop = 0; if (S.sec === 'b') S.bIdx = 0; sfx.click(); }
  else if (a === 'astop') { S.aStop = +b.dataset.i; sfx.tick(); }

  }
