const PI = Math.PI, rad = (d) => d * PI / 180, deg = (r) => r * 180 / PI;

const lamNm = (a, b) => 1e9 / (R_INF * Math.abs(1 / (a * a) - 1 / (b * b)));      // 1/λ = R (1/n² − 1/m²)

  let r = 0, g = 0, b = 0;
  if (l < 440) { r = (440 - l) / 60; b = 1; } else if (l < 490) { g = (l - 440) / 50; b = 1; } else if (l < 510) { g = 1; b = (510 - l) / 20; }
  else if (l < 580) { r = (l - 510) / 70; g = 1; } else if (l < 645) { r = 1; g = (645 - l) / 65; } else r = 1;

  }
  facts(['b1', 'b2', 'b3']);
  const found = S.lit.filter(Boolean).length, extra = `<div>${esc(b.found(found))}${found === 4 ? ` ${esc(b.all)}` : ''}</div>`, L = S.last;
  if (!L) {
    const lb = lamNm(5, 2), la = lamNm(3, 2);
    lab.setReadout(`${nf(lb)} nm`, b.nm, `${b.pb}: ${b.opt(5, 2)}`, wlTxt(lb));
    lab.setState({ emo: '🪜', title: b.go[0], lead: b.go[1], body: b.go[2], extra: `<div>${esc(`${b.pa}: ${b.opt(3, 2)} = ${nf(la)} nm · ${b.pb}: ${b.opt(5, 2)} = ${nf(lb)} nm`)}</div>` + extra }); return;
  }
  const cn = cname(t, L.l), col = isVis(L.l) ? wlTxt(L.l) : '#98A0B8';
  lab.setReadout(`${nf(L.l)} nm`, b.nm, L.up ? b.up(L.m, L.n) : b.ptl(L.m, L.n, cn), col);
  lab.setState({ emo: L.up ? '⬆️' : isVis(L.l) ? '💡' : '🕶️', title: L.up ? b.up(L.m, L.n) : b.down(L.m, L.n, cn), lead: (L.up ? b.uLead : b.dLead)(nf(L.e, 2), nf(L.l)),
    body: isVis(L.l) ? (!L.up && L.n === 2 ? b.vis2 : b.visB) : b.invB, extra });
}

render();

// --- the loop ---------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt) => {
  S.clk += lab.view === 'shoot' ? 0 : dt; // shoot advances its own clock in stepShots
  if (lab.view === 'shoot') drawShoot(c, w, h, dt); else if (lab.view === 'scale') drawScale(c, w, h, dt); else drawBohr(c, w, h, dt);
  if (S.dirty && performance.now() - S.lastInfo > 90) { S.dirty = false; S.lastInfo = performance.now(); skipFacts = true; renderInfo(); skipFacts = false; }
});
</script>
</body>
