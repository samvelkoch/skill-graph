  else if (cardNow && revd(V3.card)) markC(V3.card);
  const ring = (b, col) => { c.strokeStyle = col; c.lineWidth = 2.5; c.shadowColor = col; c.shadowBlur = 10;
    if (b === 'book') rr(c, 156, 34, 48, 24, 6); else if (b === 'table') rr(c, 119, 46, 122, 36, 6); else { c.beginPath(); c.arc(180, 82 + 500, 502, Math.PI * 1.42, Math.PI * 1.58); }
    c.stroke(); c.shadowBlur = 0; };
  for (const [b, col] of Object.entries(lit)) if (col) ring(b, col);
  pill(c, P.names.Book, 180, 18, { color: '#aef0e8' }); pill(c, P.names.Table, 286, 62, { color: '#f1d3a6' }); pill(c, P.names.Earth, 64, 76, { color: '#bfe0ff' });
  // diagram panel
  c.fillStyle = 'rgba(8,11,22,.72)'; rr(c, 0, PH + 8, 360, DH, 16); c.fill(); c.strokeStyle = 'rgba(130,145,190,.22)'; c.lineWidth = 1 / K; c.stroke();
  const oyd = PH + 8 - 100; // the diagram below was laid out from y = 100 (see ARR)
  c.save(); c.translate(0, oyd);
  pill(c, P.names.Earth, 62, 110, { color: '#bfe0ff' }); pill(c, P.names.Book, 180, 110, { color: '#aef0e8' }); pill(c, P.names.Table, 298, 110, { color: '#f1d3a6' });
  drawGlobe(c, 62, 220, 24); drawBook(c, 180, 220, 54, 36); drawTable(c, 298, 214, 84, 30);
  // pair state of each arrow
  const colOf = (id) => { const a = ARR[id]; const ci = a.pair === 0 ? 1 : 2; return revd(ci) ? PAIRCOL[a.pair] : '#e8ecf8'; };
  const lit2 = new Set(); if (cardNow) { lit2.add(cardNow.a); lit2.add(cardNow.b); } else if (V3.sel) { lit2.add(V3.sel); lit2.add(ARR[V3.sel].partner); }
  const anyLit = lit2.size > 0;
  for (const [id, a] of Object.entries(ARR)) {
    const al = !anyLit || lit2.has(id) ? 1 : 0.3, col = colOf(id);
    arrow(c, a.x, a.y0, a.x, a.y1, col, al, 5);
    const lines = P.lab[id]; c.font = font(12.5, 800);
    const wd = Math.max(...lines.map((s) => c.measureText(s).width)) + 14 / K, ht = 36 / K;
    c.globalAlpha = al; c.fillStyle = 'rgba(8,10,20,.86)'; rr(c, clamp(a.lx - wd / 2, 3, 357 - wd), a.ly - ht / 2, wd, ht, 9); c.fill();
    c.fillStyle = col; c.textAlign = 'center'; c.textBaseline = 'middle';
    const lx = clamp(a.lx - wd / 2, 3, 357 - wd) + wd / 2; c.fillText(lines[0], lx, a.ly - 8 / K); c.fillText(lines[1], lx, a.ly + 8 / K); c.globalAlpha = 1;
  }
  // connectors of the pairs that are known
  const known = (pi) => revd(pi === 0 ? 1 : 2) || (free3());
  const conn = (id1, id2, col, text) => {
    const a = ARR[id1], b = ARR[id2], ax = a.x, ay = (a.y0 + a.y1) / 2, bx = b.x, by = (b.y0 + b.y1) / 2, mx = (ax + bx) / 2, my = (ay + by) / 2;
    c.strokeStyle = col; c.lineWidth = 2; c.setLineDash([5 / K, 5 / K]); c.beginPath(); c.moveTo(ax, ay); c.quadraticCurveTo(mx, ay, mx, my); c.quadraticCurveTo(mx, by, bx, by); c.stroke(); c.setLineDash([]);
    pill(c, text, mx, my, { color: col, stroke: col });
  };
  if (known(0) && (!anyLit || (lit2.has('W') && lit2.has('Wp')))) conn('W', 'Wp', PAIRCOL[0], P.pair);
  if (known(1) && (!anyLit || (lit2.has('N') && lit2.has('Np')))) conn('N', 'Np', PAIRCOL[1], P.pair);
  if (revd(0)) pill(c, P.bal, 122, 192, { color: '#3ddc97', stroke: '#3ddc97' });
  c.restore();
  c.restore();
}
function renderPairs() {
  const t = T[lang], P = t.pr, d = cardsDone(), free = free3(), i = V3.card;
  lab.setGlow('rgba(255,138,92,.26)');
  $('q3box').hidden = free;
  if (!free) {
    $('q3').textContent = P.q[i];
    const flip = CARDS[i].flip, order = flip ? [1, 0] : [0, 1], ok = CARDS[i].pair ? 0 : 1, a = V3.ans[i];
    $('o3').innerHTML = order.map((k) => `<button class="ts-opt ${a !== null && k === ok ? 'good' : a === k ? 'bad' : ''}" data-k="${k}"${a !== null ? ' disabled' : ''}>${esc(P.opts[k])}</button>`).join('');
  }
  $('goB3').hidden = free || V3.ans[i] === null; $('goB3').textContent = i >= 2 ? P.last : P.next;
  $('hint3').hidden = !free; $('hint3').textContent = P.tip;
  let st;
  if (free) {
    if (V3.sel) { const a = ARR[V3.sel]; st = ['🔗', ...P.info(P.full[V3.sel], P.on[V3.sel], P.full[a.partner])]; } else st = ['🔗', P.all[0], P.all[1], ''];
  } else if (V3.ans[i] === null) st = ['🧩', P.ask[0], P.ask[1], ''];
  else { const ok = V3.ans[i] === (CARDS[i].pair ? 0 : 1); st = [ok ? '✅' : '🤔', ok ? P.ok[i] : P.no[i], P.lead[i], P.body[i]]; }
  lab.setReadout(`${d}/3`, '', free ? '🔗' : '', '#ff8a5c');
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] || '', extra: '' });
  lab.setFacts([FACT('📖', 'third', NEWTON)]);
}

function renderGate() {
  const g = T[lang].gate;
  $('goG').textContent = g[2];
  lab.setGlow('rgba(78, 168, 255, .3)');
  lab.setReadout('?', '', '', '#4ea8ff');
  lab.setState({ emo: '⛸️', title: g[0], lead: g[1], body: '', extra: '' });
  lab.setFacts([]);
}
// --- one render per change ----------------------------------------------------------------------------------------
function render() {
  const v = lab.view;
  const gated = v !== 'ice' && V1.g[1] === null; // parts 2 and 3 would give away the first guess
  $('v1').hidden = v !== 'ice'; $('v2').hidden = v !== 'boat' || gated; $('v3').hidden = v !== 'pairs' || gated; $('vg').hidden = !gated;
  if (gated) renderGate(); else if (v === 'ice') renderIce(); else if (v === 'boat') renderBoat(); else renderPairs();
  lab.checkStage?.();
}
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function onRevealed() {
  const v = lab.view;
  if (v === 'ice' && !V1.free) { V1.rev[V1.round] = true; (V1.g[V1.round] === iceAnswer() ? sfx.good : sfx.bad)(); }
  else if (v === 'boat' && V2.sc === 'boat' && !V2.rev) { V2.rev = true; (V2.g === 1 ? sfx.good : sfx.bad)(); }
  render();
}

canvasLoop($('cv'), (c, w, h, dt, now) => {
  tick(dt);
  K = 1;
  if (lab.view === 'pairs') { c.fillStyle = 'rgba(0,0,0,0)'; return drawPairs(c, w, h, now); }
  const sh = Math.round(h * 0.52), gy = sh + 8;
  c.save(); c.beginPath(); rr(c, 0, 0, w, sh, 18); c.clip();
  K = Math.min(w / 360, sh / 190); c.translate((w - 360 * K) / 2, (sh - 190 * K) / 2); c.scale(K, K);
  if (lab.view === 'ice') drawIce(c); else drawScene(c, now);
  c.restore(); K = 1;
  if (lab.view === 'ice') iceGraph(c, 0, gy, w, h - gy); else sceneGraph(c, 0, gy, w, h - gy);
});

// --- events ----------------------------------------------------------------------------------------------------------
$('o1').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-i]'); if (!b || b.disabled) return;
  V1.g[V1.round] = +b.dataset.i; sfx.click(); render();
});
$('goB1').addEventListener('click', () => {
  if (!V1.free && V1.g[V1.round] === null) return;
  startSim(TMAX, 0.9, SLOW); sfx.push(); render(); showStage();
});
$('nextB1').addEventListener('click', () => {
  V1.round = 2; V1.m1 = 50; V1.m2 = 75; V1.F = 150; V1.g[2] = null; resetSim(); sfx.click(); render();
});
for (const [id, key] of [['s1', 'm1'], ['s2', 'm2'], ['s3', 'F']]) {
  $(id).addEventListener('input', () => { V1[key] = +$(id).value; V1.free = true; resetSim(); render(); });
}
$('o2').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-i]'); if (!b || b.disabled) return;
  V2.g = +b.dataset.i; sfx.click(); render();
});
$('scChips').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sc]'); if (!b) return;
  const k = b.dataset.sc;
  if ((k === 'hammer' || k === 'cannon') && !secret.unlocked()) return secret.open();
  if (V2.sc !== k) { V2.sc = k; resetSim(); sfx.click(); }
  render();
});
$('nailChips').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-nail]'); if (!b) return;
  V2.p.hammer.sharp = b.dataset.nail === '1'; resetSim(); sfx.tick(); render();
});
for (const [id, key] of [['t1', 'a'], ['t2', 'f']]) {
  $(id).addEventListener('input', () => { V2.p[V2.sc][key] = +$(id).value; resetSim(); render(); });
}
$('goB2').addEventListener('click', () => {
  const sc = V2.sc;
  if (sc === 'boat' && V2.g === null) return;
  if (sc === 'hammer') startSim(1, 0.38, 0.35);
  else { const q = phys(sc); startSim(TMAX, SCN[sc].revAt, sc === 'cannon' ? (tau) => (tau < 0.15 ? 0.1 : SLOW) : SLOW); void q; }
  sfx.push(); render(); showStage();
});
$('goG').addEventListener('click', () => $('views').querySelector('[data-view="ice"]')?.click());
$('o3').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-k]'); if (!b || b.disabled) return;
  const i = V3.card, k = +b.dataset.k, ok = CARDS[i].pair ? 0 : 1;
  V3.ans[i] = k; (k === ok ? sfx.good : sfx.bad)(); render(); showStage();
});
$('goB3').addEventListener('click', () => { if (V3.card < 3) V3.card++; sfx.click(); render(); });
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'pairs' || !free3()) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - LAY.ox) / LAY.k, y = (ev.clientY - r.top - LAY.oy) / LAY.k - (98 + 8 - 100);
  const id = hit3(x, y);
  V3.sel = id && id !== V3.sel ? id : null; sfx.tick(); render();
});

render();
</script>
