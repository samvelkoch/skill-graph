  lab.setFacts(t.facts.tide1);
}
function stockText() {
  const t = T[lang], P = t.ppl;
  if (S.fg === null) { lab.setReadout('?', P.axStock, '', '#7fd1ff'); lab.setState({ emo: '🐟', title: P.fpreT, lead: P.fpreL, body: P.fpreB, extra: '' }); lab.setFacts(t.facts.ppl0); return; }
  const late = F.quota && F.n < 0.06 && F.n <= F.prev + 1e-4, up = F.n > F.prev + 1e-4;
  let lead;
  if (F.mode === 'demo' && !F.running) lead = P.freeL;
  else if (F.mode === 'demo') lead = !F.quota ? P.demoL : up ? P.backL : P.quotaL;
  else lead = !F.quota ? P.fallL : late ? P.lateL : up ? P.backL : P.quotaL;
  lab.setReadout(`${Math.round(F.n * 100)} %`, `${P.axStock} · ${P.yr(F.t)}`, '', '#7fd1ff');
  lab.setState({ emo: '🐟', title: F.mode === 'demo' && !F.running ? P.freeT : P.yr(F.t), lead, body: '', extra: '' });
  lab.setFacts(t.facts.ppl1.concat(t.facts.ppl0.slice(0, 2)));
}
function renderPeople(t) {
  const P = t.ppl, dg = S.sec === 'dogger';
  lab.setGlow('rgba(120, 200, 150, .26)');
  $('pplModes').hidden = dg; $('dgBox').hidden = !dg;
  $('pplUses').hidden = dg || S.pmode !== 'uses'; $('pplStock').hidden = dg || S.pmode !== 'stock';
  $('pplModes').innerHTML = [['uses', P.uses], ['stock', P.fish]].map(([m, l]) => `<button class="chip ${S.pmode === m ? 'on' : ''}" data-act="pmode" data-m="${m}">${esc(l)}</button>`).join('');
  $('useChips').innerHTML = Object.keys(P.cats).map((k) => `<button class="chip ${S.cats[k] ? 'on' : ''}" data-act="cat" data-k="${k}">${esc(P.cats[k])}</button>`).join('');
  const CURV = ['M2 8 L44 8', 'M2 21 C16 20 30 10 44 4', 'M2 4 C10 4 14 20 24 20 S36 6 44 5'], pre = S.fg === null;
  $('fishPred').innerHTML = `<div class="se-q">${esc(P.fq)}</div><div class="se-opts">${P.fopts.map((o, i) => {
    const cls = pre ? '' : i === 2 ? 'good' : i === S.fg ? 'bad' : 'dim';
    return `<button class="se-opt ${cls}" data-act="fg" data-i="${i}"${pre ? '' : ' disabled'}><svg viewBox="0 0 46 24" aria-hidden="true"><path d="${CURV[i]}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>${esc(o)}</button>`;
  }).join('')}</div>${pre ? '' : `<div class="se-verdict ${S.fg === 2 ? 'good' : 'bad'}">${esc(S.fg === 2 ? P.fok : P.fno)}</div>`}`;
  $('fishPost').hidden = pre;
  $('fpL').textContent = P.pressure; $('fpR').textContent = `${P.pLow} → ${P.pHigh}`;
  const demoRun = F.mode === 'demo' && F.running;
  $('fishP').disabled = demoRun;
  $('fQuota').textContent = F.quota ? P.quotaOn : P.quota; $('fQuota').disabled = !(F.mode === 'free' && F.running && !F.quota);
  $('fAgain').textContent = P.again; $('fAgain').disabled = pre;
  $('pplSec').innerHTML = secChip('dogger', '🏝️'); $('pplSec').hidden = S.pmode !== 'uses' && !dg;
  if (dg) {
    const L = S.dgL, p = Math.round(clamp((L - 15) / 21, 0, 1) * 100), sc = t.sec;
    $('dgL').textContent = sc.dgSlider; $('dgV').textContent = `−${fn(L)} ${t.m}`; $('dgNote').textContent = sc.dgNote;
    lab.setReadout(`−${fn(L)} ${t.m}`, sc.dgBank, `${fn(p)} %`, '#e6cf92');
    lab.setState(p === 0 ? { emo: '🏝️', title: sc.dgT0, lead: sc.dgL0(L), body: '', extra: '' }
      : p < 100 ? { emo: '🏝️', title: sc.dgT1, lead: sc.dgL1(L, p), body: '', extra: '' }
      : { emo: '🏝️', title: sc.dgT2, lead: sc.dgL2, body: '', extra: '' });
    lab.setFacts(t.facts.dg); return;
  }
  if (S.pmode === 'stock') { stockText(); return; }
  const pk = S.pick, inf = pk ? P.info[pk.info] : null;
  lab.setReadout(pk ? pk.emo : '🌊', inf ? inf[0] : P.preT, '', '#7fd1ff');
  lab.setState(pk ? { emo: pk.emo, title: inf[0], lead: inf[1], body: '', extra: '' } : { emo: '🌊', title: P.preT, lead: P.preL, body: P.preB, extra: '' });
  lab.setFacts(t.facts.ppl0);
}
render();
</script>
