function decode(s, k) {

    if (f > .1) { palm(c, -18 * f, crustY(-18 * f, sink) + 3, 16 * f, -4); palm(c, 15 * f, crustY(15 * f, sink) + 3, 13 * f, 4); }
  }
  // the coral reef: left and right runs between the reef top and the volcano
  const coralG = c.createLinearGradient(0, A.seaY - 5, 0, A.seaY + 130);
  if (m.drowned) { coralG.addColorStop(0, '#9c8a84'); coralG.addColorStop(1, '#5a4c4e'); } else { coralG.addColorStop(0, '#ffb08a'); coralG.addColorStop(.5, '#ee7f7a'); coralG.addColorStop(1, '#b4506a'); }
  for (const sg of [-1, 1]) {
    const top = [], bottom = [];
    const flush = () => {
      if (top.length < 2) { top.length = 0; bottom.length = 0; return; }
      c.beginPath(); c.moveTo(top[0][0], top[0][1]); top.forEach((p) => c.lineTo(p[0], p[1])); for (let i = bottom.length - 1; i >= 0; i--) c.lineTo(bottom[i][0], bottom[i][1]); c.closePath();
      c.fillStyle = coralG; c.fill(); c.save(); c.clip(); c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 1;
      const off = (sink * S.grow) % 12; for (let y = A.seaY + lag + off; y < bot; y += 12) { c.beginPath(); c.moveTo(-200, y); c.lineTo(200, y); c.stroke(); }
      c.restore(); c.strokeStyle = m.drowned ? 'rgba(60,50,50,.6)' : 'rgba(120,40,60,.55)'; c.lineWidth = 1.2; c.beginPath(); top.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.stroke();
      top.length = 0; bottom.length = 0;
    };
    for (let ax = 2; ax <= 118; ax += 2) {
      const x = sg * ax, tp = reefTop(ax, lag), cy = crustY(x, sink);
      if (tp < cy - 0.5) { top.push([x, tp]); bottom.push([x, cy]); } else flush();
    }
    flush();
  }
  // water over everything below the sea level
  const wg = c.createLinearGradient(0, A.seaY, 0, bot); wg.addColorStop(0, 'rgba(70,190,215,.5)'); wg.addColorStop(.45, 'rgba(24,110,160,.7)'); wg.addColorStop(1, 'rgba(10,50,100,.9)');
  c.fillStyle = wg; c.fillRect(X0, A.seaY, X1 - X0, bot - A.seaY);
  const lagAmt = !m.above ? 1 : clamp01((A.xr - A.cw - m.shore) / 18);
  if (lagAmt > 0 && !m.drowned) { const lgn = c.createLinearGradient(0, A.seaY, 0, A.seaY + 64); lgn.addColorStop(0, `rgba(120,240,225,${.38 * lagAmt})`); lgn.addColorStop(1, 'rgba(120,240,225,0)'); c.fillStyle = lgn; c.fillRect(-(A.xr - A.cw), A.seaY, 2 * (A.xr - A.cw), 64); }
  // waves, foam and sandy islets
  c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.6; c.beginPath();
  for (let x = X0; x <= X1; x += 4) { const y = A.seaY + Math.sin(x * .09 + t * 1.6) * 1.3; x === X0 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke();
  if (lag < 10) { c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1.4; for (const sg of [-1, 1]) for (let k = 0; k < 3; k++) { const x = sg * (A.xr + A.cw + 2 + k * 3 + Math.sin(t * 2 + k) * 1.5); c.beginPath(); c.arc(x, A.seaY + 1, 3 + k, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); } }
  const reefUp = lag < 12, cay = !m.above && !m.drowned && reefUp ? eIO((S.ap - .68) / .25) : 0;
  if (cay > .02) {
    for (const [x, k] of [[-A.xr + 2, 1], [A.xr - 3, .8], [-A.xr - 22, .55]]) {
      const g = c.createLinearGradient(0, A.seaY - 8 * k, 0, A.seaY + 3); g.addColorStop(0, '#fbf0cc'); g.addColorStop(1, '#e0c88c'); c.fillStyle = g; c.beginPath(); c.ellipse(x, A.seaY + 1, 11 * k * cay, 5.5 * k * cay, 0, Math.PI, 0); c.fill();
    }
    palm(c, -A.xr + 2, A.seaY - 1, 15 * cay, -3); palm(c, A.xr - 3, A.seaY - 1, 12 * cay, 3);
  }
  c.restore();
  // labels (canvas pixels)
  const P = (x, y) => [ox + A.W * s / 2 + x * s, oy + y * s];
  if (m.above) { const [x, y] = P(0, crustY(0, sink) - 20); pill(c, w, h, u.volcano, x, y, 'c', 12); }
  if (!m.drowned) { const [x, y] = P(A.xr + A.cw + 10, A.seaY - 34); pill(c, w, h, u.reef, x, y, 'l', 12, '#ffc0a8'); }
  else { const [x, y] = P(A.xr + A.cw + 10, A.seaY - 34); pill(c, w, h, u.drownedLbl, x, y, 'l', 12, '#d8cfd0'); }
  if (lagAmt > .6 && !m.drowned && reefUp) { const [x, y] = P(0, A.seaY + 18); pill(c, w, h, u.lagoon, x, y, 'c', 12, '#9ff2e6'); }
}

// --- drawing: dispatch -----------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, t) => {
  const v = lab.view;
  if (v === 'map') drawMap(c, w, h, dt, t); else if (v === 'animals') drawDrift(c, w, h, dt, t); else drawAtoll(c, w, h, dt, t);
  if (v === 'atoll') { const sl = $('auTime'); if (!S.apDrag && document.activeElement !== sl) sl.value = Math.round(S.ap * 1000); readoutSoon(); } else if (v === 'animals') readoutSoon();
});

// --- controls and prediction blocks ------------------------------------------------------------------------------
function predHTML(v) {
  const t = T[lang], q = t[v + 'Ask'], opts = t[v + 'Opts'], pick = S.pick[v], done = pick !== null, right = RIGHT[v];
  const chips = opts.map((o, i) => `<button class="au-opt${done ? (i === right ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="opt" data-v="${v}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = done ? `<div class="au-verdict ${pick === right ? 'good' : 'bad'}">${esc(pick === right ? t[v + 'Right'] : t[v + 'Wrong'])}</div>` : '';
  return `<div class="au-q">${esc(q)}</div><div class="au-opts">${chips}</div>${verdict}`;
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(v, i) {
  if (S.pick[v] !== null) return;
  S.pick[v] = i; if (v === 'map') S.revT = now();
  (i === RIGHT[v] ? sfx.good : sfx.bad)();
  if (v === 'atoll') { S.apTgt = 1; S.ap = Math.max(S.ap, .12); }
  render(); showStage();
}
function sortAnimal(cat) {
  const k = S.sel; if (!k || S.sorted[k]) return;
  const ok = ANIMALS[k] === cat;
  S.sorted[k] = { pick: cat, ok }; S.last = k; S.sel = null; (ok ? sfx.good : sfx.bad)();
  render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'opt') return answer(b.dataset.v, +b.dataset.i);
  if (a === 'layer') { S.layers[b.dataset.k] = !S.layers[b.dataset.k]; S.revT = Math.min(S.revT, now() - 2); sfx.click(); }
  else if (a === 'an') { if (S.sorted[b.dataset.k]) { S.last = b.dataset.k; } else { S.sel = S.sel === b.dataset.k ? null : b.dataset.k; S.last = null; } sfx.tick(); }
  else if (a === 'cat') return sortAnimal(b.dataset.c);
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k, was = S.sec === k;
    const want = k === 'a' ? 'atoll' : 'map';
    if (lab.view !== want) $('views').querySelector(`[data-view="${want}"]`)?.click(); // the tab's own click; it clears the secret, so set it after
    const answered = k === 'a' ? S.pick.atoll !== null : S.pick.map !== null;
    S.sec = answered && !was ? k : null; sfx.click(); showStage(); // before the view's guess a secret would show the answer: it only opens after it
    if (S.sec === 'a') S.apTgt = Math.max(S.apTgt, .8);
  }
  render();
});
$('auDrift').addEventListener('input', (ev) => { S.dpTgt = ev.target.value / 1000; });
$('auTime').addEventListener('input', (ev) => { S.apDrag = true; S.ap = S.apTgt = ev.target.value / 1000; });
const endDrag = () => { S.apDrag = false; };
$('auTime').addEventListener('change', endDrag); addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);
$('auGrow').addEventListener('input', (ev) => { S.grow = ev.target.value / 1000; });
$('cv').addEventListener('click', (ev) => {
  if (lab.view !== 'map' || S.pick.map === null) return;
  const r = $('cv').getBoundingClientRect(), { s, ox, oy } = fitBox(r.width, r.height, MW, MH);
  const x = (ev.clientX - r.left - ox) / s, y = (ev.clientY - r.top - oy) / s;
  if (!inAus(x, y)) return;
  S.mark = { lon: 108 + x / KX, lat: -7 - y / KY };
  const near = S.layers.people ? [...CITIES, ...SMALLC].find((k) => Math.hypot(k.x - x, k.y - y) <= (k.r || 3) + 5) : null;
  S.city = near ? near.k : null; sfx.tick(); readout(); renderStateMap();
});

// --- readouts, state card, facts -----------------------------------------------------------------------------------
let roKey = '';
function readoutSoon() { readout(); }
function readout() {
  const t = T[lang], v = lab.view;
  if (v === 'map') {
    const ans = S.pick.map !== null, k = `m|${lang}|${ans}|${S.mark?.lon}|${S.mark?.lat}|${S.city}|${S.layers.rain}`;
    if (k === roKey) return; roKey = k;
    if (!ans) return lab.setReadout('?', '', '', '#e8dcc0');
    if (S.city) { const cc = CITIES.find((x) => x.k === S.city); return lab.setReadout(esc(t.cities[S.city]), cc ? `${fmtM(cc.pop)} ${t.millionW} (2023)` : '', '', '#e8dcc0'); }
    if (S.mark) { const q = coastDist(S.mark.lon, S.mark.lat); return lab.setReadout(`${Math.round(q.d / 10) * 10} km`, t.fromSea, '', '#e8dcc0'); }
    return lab.setReadout('📍', t.tap, '', '#e8dcc0');
  }
  if (v === 'animals') {
    const p = S.dp, k = `a|${lang}|${nSorted()}|${p < .02 ? 0 : p > .98 ? 2 : 1}`;
    if (k === roKey) return; roKey = k;
    return lab.setReadout(`${nSorted()} / 6`, t.sortedW, p < .02 ? t.driftThen : p > .98 ? t.driftNow : t.driftMid, '#f4c26b');
  }
  const m = atollModel(S.ap, S.grow), k = `t|${lang}|${m.stage}|${m.above}|${S.pick.atoll}`;
  if (k === roKey) return; roKey = k;
  lab.setReadout(esc(t.stage[m.stage]), m.above ? t.islandAbove : t.islandGone, '', m.drowned ? '#b4a09c' : '#ee7f7a');
}
function renderStateMap() {
  const t = T[lang], ans = S.pick.map !== null;
  if (!ans) { lab.setState({ emo: '🤔', title: t.mapAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  if (secOn('b')) { distCv ??= buildRaster('dist'); const st = t.secBSt; lab.setState({ emo: st[0], title: st[1], lead: st[2].replace('{km}', farKm || '…'), body: st[3], extra: '' }); lab.setFacts([]); return; }
  const st = t.mapSt; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' }); lab.setFacts(t.mapFacts);
}

const svgSecs = () => {
  const t = T[lang], open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${secOn(k) ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return sc('a', '💀') + sc('b', '🧭');
};

function render() {
  const t = T[lang], v = lab.view; roKey = '';
  document.body.dataset.v = v;
  if (!secOn('a')) S.grow = 1;
  $('auMap').hidden = v !== 'map'; $('auAnimals').hidden = v !== 'animals'; $('auAtoll').hidden = v !== 'atoll';
  $('auSecs').innerHTML = svgSecs();
  if (v === 'map') {
    const ans = S.pick.map !== null;
    $('auPredMap').innerHTML = predHTML('map');
    $('auLayers').hidden = !ans;
    $('auLayers').innerHTML = ['rain', 'people', 'tropic'].map((k) => `<button class="chip${S.layers[k] ? ' on' : ''}" data-act="layer" data-k="${k}">${esc(t.layers[k])}</button>`).join('');
    const showList = ans && S.layers.people && !secOn('b');
    $('auList').hidden = !showList;
    $('auList').textContent = showList ? `${t.peopleList} ${CITIES.map((c) => `${t.cities[c.k]} ${fmtM(c.pop)}`).join(' · ')} ${t.millionW}` : '';
    $('auFineMap').textContent = !ans ? '' : secOn('b') ? t.tap : [t.tap, S.layers.rain ? t.rainLeg : '', S.layers.people ? t.peopleLeg : ''].filter(Boolean).join(' · ');
    renderStateMap();
  } else if (v === 'animals') {
    $('auDriftLbl').textContent = t.driftLbl; $('auEnd0').textContent = t.driftEnds[0]; $('auEnd1').textContent = t.driftEnds[1];
    $('auAnQ').textContent = t.animalsAsk;
    $('auGrid').innerHTML = ORDER.map((k) => {
      const d = S.sorted[k];
      return `<button class="au-an${S.sel === k ? ' sel' : ''}" data-act="an" data-k="${k}"><canvas width="128" height="88" data-k="${k}"></canvas><span>${esc(t.an[k])}</span>${d ? `<i class="au-tag ${ANIMALS[k]}">${d.ok ? '✓ ' : ''}${esc(t.catsShort[ANIMALS[k]])}</i>` : ''}</button>`;
    }).join('');
    $('auGrid').querySelectorAll('canvas').forEach((cv) => { const c2 = cv.getContext('2d'); c2.clearRect(0, 0, 128, 88); critter(c2, cv.dataset.k, 64, 46, 1.12); });
    $('auCats').innerHTML = CATS.map((k) => `<button class="au-cat" data-act="cat" data-c="${k}"${S.sel ? '' : ' disabled'}>${esc(t.cats[k][0])}<small>${esc(t.cats[k][1])}</small></button>`).join('');
    const L = S.last && S.sorted[S.last];
    $('auVerdict').innerHTML = L ? `<div class="au-verdict ${L.ok ? 'good' : 'bad'}">${esc(L.ok ? t.right : t.notQuite)} <b>${esc(t.an[S.last])}</b><span class="au-ex">${esc(t.anEx[S.last])}</span></div>` : (S.sel ? '' : `<div class="au-fine">${esc(t.pickFirst)}</div>`);
    const done = nSorted() === 6, st = done ? t.animalsStDone : t.animalsSt0;
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
    lab.setFacts(done ? [t.animalsFacts[0], ...t.animalsFactsDone] : t.animalsFacts);
  } else {
    const ans = S.pick.atoll !== null, sa = secOn('a');
    $('auPredAtoll').innerHTML = predHTML('atoll');
    $('auTimeBox').hidden = !ans; $('auGrowBox').hidden = !sa;
    $('auTimeLbl').textContent = t.timeLbl; $('auTe0').textContent = t.timeEnds[0]; $('auTe1').textContent = t.timeEnds[1];
    $('auGrowLbl').textContent = t.secALbl; $('auGe0').textContent = t.secAEnds[0]; $('auGe1').textContent = t.secAEnds[1];
    $('auTime').value = Math.round(S.ap * 1000); $('auGrow').value = Math.round(S.grow * 1000);
    stateAtoll();
  }
  readout();
}
function stateAtoll() {
  const t = T[lang], ans = S.pick.atoll !== null;
  if (!ans) { lab.setState({ emo: '🤔', title: t.atollAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  if (secOn('a') && S.grow < .98) { const st = t.secASt; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' }); lab.setFacts([]); return; }
  const m = atollModel(S.ap, S.grow), st = t.atollSt[m.stage];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' }); lab.setFacts(t.atollFacts);
}
// the state card follows the stage while the time slider moves
let lastStage = '';
setInterval(() => { if (lab.view === 'atoll' && S.pick.atoll !== null) { const k = atollModel(S.ap, S.grow).stage + (secOn('a') && S.grow < .98); if (k !== lastStage) { lastStage = k; stateAtoll(); } } }, 200);

render();
</script>
