  const onPath = new Set(d.P);
  for (let e = 0; e < NE; e++) {

    c.strokeStyle = `rgba(110,130,200,${0.28 + 0.4 * wv})`; c.lineWidth = 1 + 7 * wv; c.lineCap = 'round'; c.beginPath(); c.moveTo(...A); c.lineTo(...B); c.stroke();
  }
  d.P.forEach((e) => {
    const [A, B] = edgeEnds(e).map((n) => nodeXY(G, n)), wv = d.W[e];
    c.save(); c.shadowColor = '#ffcf5a'; c.shadowBlur = 4 + 12 * wv; c.strokeStyle = wv < 0.3 ? `rgba(255,207,90,${0.55 + wv})` : '#ffd166'; c.lineWidth = 1.4 + 8 * wv; c.lineCap = 'round';
    c.beginPath(); c.moveTo(...A); c.lineTo(...B); c.stroke(); c.restore();
  });
  // pulse along the used path
  const dels = d.P.map((e) => edgeDelay(d.W[e])), tot = dels.reduce((a, b) => a + b, 0), cycle = clamp(d.R / 1000 * 3, 0.4, 1.4), ph = (sg.clock % (cycle + 0.35)) / cycle;
  if (!ask && ph <= 1) {
    let acc = 0;
    for (let i = 0; i < 3; i++) { const f = dels[i] / tot; if (ph <= acc + f || i === 2) { const [A, B] = edgeEnds(d.P[i]).map((n) => nodeXY(G, n)), u = clamp((ph - acc) / f, 0, 1); glowDot(c, lerp(A[0], B[0], u), lerp(A[1], B[1], u), 15, '#fff2b0', 1); break; } acc += f; }
  }
  // nodes
  const nodeCol = [NC[0], NC[1], NC[1], NC[2]];
  G.ys.forEach((col, l) => col.forEach((y) => {
    const r = l === 0 || l === 3 ? G.nodeR * 1.25 : G.nodeR, x = G.X[l];
    somaDraw(c, x, y, r, nodeCol[l], 0);
  }));
  // labels of the skill
  const [ix, iy] = nodeXY(G, [0, 0]), [ox2, oy2] = nodeXY(G, [3, 0]);
  pill(c, t.pr.inl[pr.skill], ix, iy + G.nodeR * 1.25 + 16, 'c', w); pill(c, t.pr.outl[pr.skill], ox2, oy2 + G.nodeR * 1.25 + 16, 'c', w);
  // graph
  const gx0 = 46, gx1 = w - 14, gy0 = G.gy0, gy1 = G.gy1, X = (dd) => gx0 + (dd / DAYS) * (gx1 - gx0), Y = (v) => gy1 - (v / 450) * (gy1 - gy0);
  c.fillStyle = 'rgba(14,17,34,.7)'; c.beginPath(); c.roundRect(2, gy0 - 14, w - 4, gy1 - gy0 + 42, 14); c.fill();
  c.font = '700 12px Nunito, sans-serif'; c.textBaseline = 'middle'; c.lineWidth = 1;
  [0, 200, 400].forEach((v) => { c.strokeStyle = 'rgba(150,165,215,.2)'; c.setLineDash([2, 4]); c.beginPath(); c.moveTo(gx0, Y(v)); c.lineTo(gx1, Y(v)); c.stroke(); c.setLineDash([]); c.fillStyle = '#98A0B8'; c.textAlign = 'right'; c.fillText(nf(v), gx0 - 5, Y(v)); });
  c.textAlign = 'center'; [0, 10, 20, 30].forEach((v) => c.fillText(nf(v), X(v), gy1 + 11)); c.fillText(t.pr.days, (gx0 + gx1) / 2, gy1 + 26);
  c.textAlign = 'left'; c.fillText(t.pr.ms, 8, gy0 - 4);
  if (!ask) {
    if (pr.guess !== 2) { // the child's own guess as a dashed curve
      c.strokeStyle = 'rgba(185,166,255,.85)'; c.lineWidth = 2; c.setLineDash([6, 4]); c.beginPath();
      for (let i = 0; i <= DAYS; i++) { const v = pr.guess === 0 ? sim.R[0] : lerp(sim.R[0], sim.R[DAYS], i / DAYS); i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)); }
      c.stroke(); c.setLineDash([]);
      pill(c, t.pr.yours, gx1, Y(pr.guess === 0 ? sim.R[0] : lerp(sim.R[0], sim.R[DAYS], 0.7)) - 16, 'r', w);
    }
    const cur = Math.min(DAYS, pr.day), top = Math.floor(cur);
    c.save(); c.shadowColor = '#ffcf5a'; c.shadowBlur = 8; c.strokeStyle = '#ffd166'; c.lineWidth = 3; c.lineJoin = 'round'; c.beginPath();
    for (let i = 0; i <= top; i++) i ? c.lineTo(X(i), Y(sim.R[i])) : c.moveTo(X(i), Y(sim.R[i]));
    c.lineTo(X(cur), Y(d.R)); c.stroke(); c.restore();
    glowDot(c, X(cur), Y(d.R), 14, '#ffe9a0', 1); c.fillStyle = '#fff'; c.beginPath(); c.arc(X(cur), Y(d.R), 4, 0, 7); c.fill();
    pill(c, `${nf(d.R)} ${t.pr.ms}`, X(cur) + 10, Y(d.R) - 16, cur > DAYS * 0.6 ? 'r' : 'l', w);
  }
}
function drawTaxi(c, w, h, time) {
  const t = T[lang], k = pr.years / 30, gx = 14, gy = 12, gw = w - 28, gh = h * 0.5, cols = 7, rows = 5;
  c.fillStyle = '#121833'; c.beginPath(); c.roundRect(gx, gy, gw, gh, 16); c.fill();
  const cx = (i) => gx + 22 + (gw - 44) * i / (cols - 1), cy = (j) => gy + 20 + (gh - 40) * j / (rows - 1), hh = (a, b, z) => { const x = Math.sin(a * 12.9898 + b * 78.233 + z * 3.7) * 43758.5453; return x - Math.floor(x); };
  c.lineCap = 'round'; c.lineWidth = 5; c.strokeStyle = '#242c55';
  for (let i = 0; i < cols; i++) { c.beginPath(); c.moveTo(cx(i), cy(0)); c.lineTo(cx(i), cy(rows - 1)); c.stroke(); }
  for (let j = 0; j < rows; j++) { c.beginPath(); c.moveTo(cx(0), cy(j)); c.lineTo(cx(cols - 1), cy(j)); c.stroke(); }
  c.save(); c.shadowColor = '#ffcf5a'; c.shadowBlur = 8; c.strokeStyle = '#ffd166'; c.lineWidth = 3.2;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows - 1; j++) if (hh(i, j, 1) < k) { c.beginPath(); c.moveTo(cx(i), cy(j)); c.lineTo(cx(i), cy(j + 1)); c.stroke(); }
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols - 1; i++) if (hh(i, j, 2) < k) { c.beginPath(); c.moveTo(cx(i), cy(j)); c.lineTo(cx(i + 1), cy(j)); c.stroke(); }
  c.restore();
  c.font = '24px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText('🚕', cx(2 + Math.round(1 + Math.sin(time * 1.2))), cy(2));
  // hippocampus: the back part gets a larger share, the whole stays the same length (schematic)
  const by = gy + gh + 62, bx0 = gx + 28, bx1 = w - gx - 28, share = 0.5 + 0.2 * k, split = 1 - share;
  const pt = (u) => [lerp(bx0, bx1, u), by - Math.sin(u * Math.PI) * 22 + u * 14];
  const seg = (a, b, colr) => { c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 8; c.shadowOffsetY = 3; c.strokeStyle = colr; c.lineWidth = 24; c.lineCap = 'butt'; c.beginPath();
    for (let i = 0; i <= 24; i++) { const [x, y] = pt(lerp(a, b, i / 24)); i ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke(); c.restore(); };
  seg(0, split, '#e07b6a'); seg(split, 1, '#e0b050');

  pill(c, t.pr.hip, w / 2, by - 44, 'c', w);
  pill(c, t.pr.front, pt(split / 2)[0], pt(split / 2)[1] + 30, 'c', w); pill(c, t.pr.back, pt((1 + split) / 2)[0], pt((1 + split) / 2)[1] + 30, 'c', w);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  sg.clock += dt;
  const v = lab.view;
  if (v === 'signal') { drawSignal(c, w, h); if (sigKey() !== sg.key) updateSignal(false); }
  else if (v === 'map') drawMap(c, w, h, time);
  else {
    if (pr.playing) {
      const before = Math.floor(pr.day); pr.day = Math.min(DAYS, pr.day + dt * 7);
      if (pr.day >= DAYS) { pr.playing = false; render(); } else if (Math.floor(pr.day) !== before) updatePractice();
    }
    if (S.sec === 'taxi') drawTaxi(c, w, h, time); else drawPractice(c, w, h);
  }
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function fire() {
  const r = makeRun(sg.push, sg.myelin); sg.runs.push(r); if (sg.runs.length > 2) sg.runs.shift(); sg.demo = false; sfx.snap(); render();
}
function mpPick(a) {
  if (mp.checked || mp.ti >= 5) return;
  mp.guess = a; mp.checked = true; mp.right[mp.ti] = a === TASKS[mp.ti].lobe; (mp.right[mp.ti] ? sfx.good : sfx.bad)(); render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'sgpick') {
    sg.guess = i; sg.phase = 'free'; sg.demo = true; sg.myelin = true; sg.push = PB; sg.runs = [makeRun(PA, true), makeRun(PB, true)];
    (i === 1 ? sfx.good : sfx.bad)(); render(); showStage();
  } else if (a === 'fire') fire();
  else if (a === 'myelin') { sg.myelin = !sg.myelin; sfx.click(); render(); }
  else if (a === 'mpmode') { mp.mode = b.dataset.m; mp.myth = false; sfx.click(); render(); }
  else if (a === 'mplobe') mpPick(b.dataset.l);
  else if (a === 'mpnext') { if (mp.ti >= 5) { mp.ti = 0; mp.right = []; } else mp.ti++; mp.guess = null; mp.checked = false; sfx.click(); render(); }
  else if (a === 'mptime') { mp.time = i; mp.myth = false; sfx.tick(); render(); }
  else if (a === 'myth') { mp.myth = !mp.myth; sfx.click(); render(); }
  else if (a === 'prpick') { pr.guess = i; pr.phase = 'free'; pr.day = 0; pr.playing = true; (i === 2 ? sfx.good : sfx.bad)(); render(); showStage(); }
  else if (a === 'prday') { pr.day = Math.min(DAYS, Math.floor(pr.day + 1e-6) + +b.dataset.n); sfx.tick(); render(); }
  else if (a === 'prreset') { pr.day = 0; sfx.click(); render(); }
  else if (a === 'prskill') { pr.skill = i; pr.day = 0; pr.playing = false; sfx.click(); render(); }
  else if (a === 'sec') {
    const k = b.dataset.k; if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click();
    const to = k === 'taxi' ? 'practice' : 'map';
    if (S.sec && lab.view !== to) { $('views').querySelector(`[data-view="${to}"]`)?.click(); return; }
    render();
  }
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'map' || mp.mode !== 'tasks' || S.sec === 'count' || mp.checked || mp.ti >= 5) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - mapGeo.ox) / mapGeo.s, y = (ev.clientY - r.top - mapGeo.oy) / mapGeo.s;
  const a = ['frontal', 'parietal', 'temporal', 'occipital'].find((l) => hit.isPointInPath(PATH[l], x, y));
  if (a) mpPick(a);
});
$('push').addEventListener('input', (ev) => { sg.push = +ev.target.value; $('pushV').textContent = `${nf(sg.push)} ${T[lang].u.mv}`; });
$('yrs').addEventListener('input', (ev) => { pr.years = +ev.target.value; updatePractice(); });

// --- render: one pass per change -------------------------------------------------------------------------------
function render() {
  const v = lab.view, t = T[lang];
  document.body.dataset.v = v;
  $('vSignal').hidden = v !== 'signal'; $('vMap').hidden = v !== 'map'; $('vPractice').hidden = v !== 'practice';
  const open = secret.unlocked();
  $('secRow').innerHTML = [['taxi', '🚕'], ['count', '🔢']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (v === 'signal') renderSignal(t); else if (v === 'map') renderMap(t); else renderPractice(t);
}

function renderSignal(t) {
  const ask = sg.phase === 'ask';
  $('sgAsk').hidden = !ask; $('sgFree').hidden = ask;
  if (ask) {
    $('sgQ').textContent = t.sg.q(PA, PB);
    $('sgOpts').innerHTML = t.sg.opts.map((o, i) => `<button data-act="sgpick" data-i="${i}">${esc(o)}</button>`).join('');
  } else {
    $('pushL').textContent = t.sg.pushL; $('push').value = sg.push; $('pushV').textContent = `${nf(sg.push)} ${t.u.mv}`;
    $('fireB').textContent = t.sg.fire; $('myB').textContent = t.sg.my(sg.myelin);
    const vd = $('sgVerdict'); vd.hidden = !sg.demo;
    if (sg.demo) vd.innerHTML = `<b class="${sg.guess === 1 ? '' : 'no'}">${esc(sg.guess === 1 ? t.sg.ok : t.sg.no)}</b> ${esc(t.sg.rev(PEAK))}`;
  }
  updateSignal(true);
}
function updateSignal(force) {
  const t = T[lang], key = sigKey(), v = sg.myelin ? SPEED.on : SPEED.off;
  lab.setGlow('rgba(79, 120, 230, .3)');
  lab.setReadout(`${nf(v)} ${lang === 'ru' ? 'м/с' : 'm/s'}`, t.sg.spd(dur(1000 / v)), sg.myelin ? t.sg.pOn : t.sg.pOff, '#4f78e6');
  lab.setFacts(t.facts.signal);
  if (!force && key === sg.key) return;
  sg.key = key;
  const base = key.replace('*', '');
  let st;
  if (base === 'ask') st = ['🤔', t.sg.askT, t.sg.askL, t.sg.terms];
  else { const s = t.sg.st[base]; st = [s[0], s[1], s[2], '']; }
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });

function renderMap(t) {

    $('mpOpts').innerHTML = ['frontal', 'parietal', 'temporal', 'occipital'].map((l) => {
      const cls = mp.checked ? (l === task.lobe ? 'good' : l === mp.guess ? 'bad' : '') : '';
      return `<button data-act="mplobe" data-l="${l}" class="${cls}" style="border-color:${cls ? '' : COL[l][1]}"${mp.checked ? ' disabled' : ''}>${esc(t.mp.lobe[l])}</button>`;
    }).join('');
    $('mpNext').hidden = !(mp.checked || end);
    $('mpNext').textContent = end ? t.mp.again : mp.ti === 4 ? t.mp.last : t.mp.next;
  } else {
    $('mpTimes').innerHTML = t.mp.times.map((l, i) => `<button data-act="mptime" data-i="${i}" class="${i === mp.time ? 'good' : ''}">${esc(l)}</button>`).join('');
    $('mpMyth').textContent = mp.myth ? t.mp.scan : t.mp.myth; $('mpMyth').classList.toggle('on', mp.myth);

function updateMap(t, counting) {

    lab.setReadout(t.mp.cntV, t.mp.cntSub, t.mp.cntPill, '#e0b050');
    lab.setState({ emo: '🔢', title: t.mp.cntT(nf(Math.round(per / 1e6))), lead: t.mp.cntL(nf(NEURONS / 1e9)), body: t.mp.cntB(nf(yrs)), extra: '' }); return;
  }

    else if (!mp.checked) { lab.setReadout('?', t.mp.kick(mp.ti + 1), '', '#e0b050'); lab.setState({ emo: '🤔', title: t.mp.askT, lead: t.mp.askL, body: '', extra: '' }); }
    else { const ok = mp.guess === task.lobe; lab.setReadout(t.mp.lobe[task.lobe], t.mp.kick(mp.ti + 1), '', '#e0b050');
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.mp.right : t.mp.wrong(t.mp.area[task.lobe]), lead: nm[1], body: '', extra: '' }); }
  } else if (mp.myth) {
    lab.setReadout('10 %', t.mp.mythSub, t.mp.pillDay, '#e0b050'); lab.setState({ emo: '💭', title: t.mp.mythT, lead: t.mp.mythL, body: t.mp.mythB, extra: '' });
  } else {
    const I = DAY[mp.time], act = I.filter((x) => x > 0.15).length, top = I.map((x, i) => [x, i]).sort((a, b) => b[0] - a[0]).slice(0, 2).map(([, i]) => t.mp.area[AREAS[i]]);
    lab.setReadout(`${act}/6`, t.mp.active, t.mp.pillDay, '#e0b050');
    lab.setState({ emo: '🧠', title: t.mp.dayT, lead: t.mp.dayL(top[0], top[1]), body: t.mp.dayB, extra: '' });

function renderPractice(t) {

  if (ask) {
    $('prQ').textContent = t.pr.q;
    $('prOpts').innerHTML = t.pr.opts.map((o, i) => `<button data-act="prpick" data-i="${i}">${esc(o)}</button>`).join('');
  } else {
    $('prNorm').hidden = taxi; $('prTaxi').hidden = !taxi;
    $('prSkills').innerHTML = t.pr.skills.map((l, i) => `<button data-act="prskill" data-i="${i}" class="${i === pr.skill ? 'good' : ''}"${pr.playing ? ' disabled' : ''}>${esc(l)}</button>`).join('');
    $('prD1').textContent = t.pr.d1; $('prD7').textContent = t.pr.d7; $('prRs').textContent = t.pr.rs;
    [$('prD1'), $('prD7'), $('prRs')].forEach((b) => { b.disabled = pr.playing; });
    $('prD1').disabled = pr.playing || pr.day >= DAYS; $('prD7').disabled = pr.playing || pr.day >= DAYS;
    $('yrsL').textContent = t.pr.yrsL; $('yrs').value = pr.years; $('yrsV').textContent = nf(pr.years);
    const vd = $('prVerdict'); vd.hidden = !(pr.guess !== null && !taxi && pr.day >= DAYS);
    vd.innerHTML = `<b class="${pr.guess === 2 ? '' : 'no'}">${esc(pr.guess === 2 ? t.pr.ok : t.pr.no)}</b> ${esc(t.pr.rev)}`;
    $('prNote').textContent = taxi ? '' : t.pr.note;

}
function updatePractice() {
  const t = T[lang], taxi = S.sec === 'taxi', ask = pr.phase === 'ask' && !taxi, d = Math.floor(pr.day + 1e-6);
  lab.setGlow('rgba(255, 190, 90, .24)'); lab.setFacts(t.facts.practice);
  if (taxi) {
    $('yrsV').textContent = nf(pr.years);
    lab.setReadout(nf(pr.years), t.pr.yrsSub, t.pr.yrsPill, '#e0b050');
    lab.setState({ emo: '🚕', title: t.pr.yrsT(pr.years), lead: t.pr.yrsL1, body: t.pr.yrsB, extra: '' }); return;
  }
  if (ask) {
    lab.setReadout('?', '', '', '#ffd166');
    lab.setState({ emo: '🤔', title: t.pr.askT, lead: t.pr.askL, body: t.pr.askB, extra: '' }); return;
  }
  const R = dayAt().R, s = d === 0 ? t.pr.s0 : d >= DAYS ? t.pr.s30 : t.pr.sm(d);
  lab.setReadout(`${nf(R)} ${t.pr.ms}`, t.pr.sub(d), t.pr.pill, '#ffd166');
  lab.setState({ emo: s[0], title: s[1], lead: s[2], body: '', extra: '' });
  const vd = $('prVerdict'); if (vd && !taxi) vd.hidden = !(pr.guess !== null && d >= DAYS);
}
render();
