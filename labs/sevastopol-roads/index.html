  for (const [lo, la, nm] of [[33.6, 44.5, t.ft], [-0.12, 51.5, t.lt]]) { const x = L.x(lo), y = L.y(la); c.fillStyle = '#fff'; c.strokeStyle = '#0c1220'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 3.8, 0, 7); c.fill(); c.stroke(); pill(c, nm, x, y + (la > 50 ? -16 : 18), { size: 12 }); }
  if (S.wi.mode !== null) { c.save(); c.translate(p[0], p[1] - 9); c.fillStyle = '#fff6d8'; c.strokeStyle = '#6a5636'; c.lineWidth = 1.2; c.beginPath(); c.roundRect(-8, -5.5, 16, 11, 2); c.fill(); c.stroke(); c.beginPath(); c.moveTo(-8, -5.5); c.lineTo(0, 1); c.lineTo(8, -5.5); c.stroke(); c.restore(); }
  const sy = L.oy + L.mh + 14, bwid = w - 40; c.fillStyle = 'rgba(130,145,190,.14)'; c.beginPath(); c.roundRect(20, sy + 4, bwid, 18, 9); c.fill();
  const done = S.wi.mode !== null && S.wi.t >= 1;
  if (S.wi.mode !== null) { const g = c.createLinearGradient(20, 0, 20 + bwid, 0); g.addColorStop(0, '#e0b05088'); g.addColorStop(1, '#ffe08a'); c.fillStyle = g; c.beginPath(); c.roundRect(20, sy + 4, Math.max(4, bwid * f), 18, 9); c.fill(); }
  pill(c, done ? t.t[S.wi.mode] : t.idle, w / 2, sy + 40, { size: 13.5, bg: done ? 'rgba(14,50,38,.88)' : 'rgba(10,14,26,.82)' });
}
function drawNurse(c, w, h, time) {
  const t = T[lang].nu, rowH = (h - 20) / 4;
  c.fillStyle = 'rgba(12,16,32,.5)'; c.beginPath(); c.roundRect(6, 6, w - 12, h - 12, 14); c.fill();
  for (let i = 0; i < 4; i++) {
    const y = 14 + i * rowH, done = S.nu.done[i], pw_ = Math.min(w * 0.42, 170);
    const g = c.createLinearGradient(0, y, 0, y + rowH - 10); g.addColorStop(0, done ? '#2c5a47' : '#4a3a3a'); g.addColorStop(1, done ? '#1c3b2e' : '#2f2525');
    c.fillStyle = g; c.beginPath(); c.roundRect(14, y, w - 28, rowH - 10, 12); c.fill();
    c.font = FONT(13, 800); c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle';
    const pl = wrapText(c, t.probs[i], pw_ - 8); pl.slice(0, 3).forEach((ln, k) => c.fillText(ln, 24, y + (rowH - 10) / 2 + (k - (pl.length - 1) / 2) * 16));
    c.strokeStyle = done ? '#3ddc97' : 'rgba(255,255,255,.25)'; c.lineWidth = 2; c.setLineDash(done ? [] : [3, 5]); c.beginPath(); c.moveTo(24 + pw_, y + (rowH - 10) / 2); c.quadraticCurveTo(w / 2, y + (rowH - 10) / 2 - 10, w - 24 - pw_ + 8, y + (rowH - 10) / 2); c.stroke(); c.setLineDash([]);
    if (done) { c.fillStyle = '#d9f7e8'; c.textAlign = 'right'; const fl = wrapText(c, t.fixes[i], pw_ - 8); fl.slice(0, 3).forEach((ln, k) => c.fillText(ln, w - 26, y + (rowH - 10) / 2 + (k - (fl.length - 1) / 2) * 16)); }
    else { c.fillStyle = 'rgba(255,255,255,.35)'; c.textAlign = 'right'; c.fillText('?', w - 30, y + (rowH - 10) / 2); }
    if (S.nu.sel === i) { c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.beginPath(); c.roundRect(14, y, w - 28, rowH - 10, 12); c.stroke(); }
  }
}

// --- the loop ------------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h; const v = lab.view;
  // advance the clocks
  if (S.run1 === 1) { const sd = SEA_KM / SHIP_PACE, cd = ROAD_KM / S.pace, mx = Math.max(sd, cd); S.t1 += dt * (mx / 6); if (S.t1 >= mx) { S.t1 = mx; S.run1 = 2; render(); } }
  else if (S.run1 === 2) S.t1 = Math.max(SEA_KM / SHIP_PACE, ROAD_KM / S.pace);
  if (S.run2 === 1) { S.t2 += dt; if (S.t2 > SHOTS * 0.075 + 0.6) { S.run2 = 2; render(); } }
  if (S.run2s === 1) { const plan = sailPlan(S.wind), mx = Math.max(1, plan.T); S.t2s += dt * (mx / 6); if (S.t2s >= mx) { S.t2s = mx; S.run2s = 2; render(); } }
  else if (S.run2s === 2) S.t2s = Math.max(1, sailPlan(S.wind).T);
  if (S.wi.mode !== null && S.wi.t < 1) { S.wi.t = Math.min(1, S.wi.t + dt / (S.wi.mode === 0 ? 4.8 : 0.9)); if (S.wi.t >= 1) render(); }
  for (const p of S.placed) if (p.fly !== undefined && p.fly < 1) p.fly = Math.min(1, p.fly + dt / 0.6);
  if (S.sec === 'wire') drawWire(c, w, h, time);
  else if (S.sec === 'nurse') drawNurse(c, w, h, time);
  else if (v === 'supply') drawSupply(c, w, h, time);
  else if (v === 'range') drawRange(c, w, h, time);
  else drawReign(c, w, h, time);
});

// --- controls --------------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = +b.dataset.k;
  if (a === 'g1') { if (S.g1 !== null) return; S.g1 = k; S.ok1 = k === 1; S.run1 = 1; S.t1 = 0; S.bars = false; (S.ok1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'bars') { S.bars = !S.bars; sfx.click(); }
  else if (a === 'sub') { S.sub = b.dataset.s; sfx.click(); }
  else if (a === 'g2') { if (S.g2 !== null) return; S.g2 = k; S.ok2 = k === 1; S.run2 = 1; S.t2 = 0; (S.ok2 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'dist') { S.dist = k; S.run2 = 1; S.t2 = 0; sfx.click(); }
  else if (a === 'g2s') { if (S.g2s !== null) return; S.g2s = k; S.ok2s = k === 0; S.run2s = 1; S.t2s = 0; S.wind = 0; (S.ok2s ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'place') placeCard(k === 1);
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const id = b.dataset.id; S.sec = S.sec === id ? null : id; if (S.sec === 'wire') S.wi = { mode: null, t: 0 }; sfx.click();
  } else if (a === 'nup') { if (!S.nu.done[k]) { S.nu.sel = k; S.nu.bad = -1; sfx.tick(); } }
  else if (a === 'nuf') {
    if (S.nu.sel === null) return;
    if (k === S.nu.sel) { S.nu.done[k] = true; S.nu.sel = null; S.nu.last = k; sfx.good(); S.nu.bad = -1; } else { S.nu.bad = k; sfx.bad(); }
  } else if (a === 'wi') { S.wi = { mode: k, t: 0 }; sfx.click(); }
  render();
});
$('svPace').addEventListener('input', (ev) => { S.pace = +ev.target.value; render(); });
$('shWind').addEventListener('input', (ev) => { S.wind = +ev.target.value; if (S.run2s !== 1) S.run2s = 2; render(); });
function placeCard(after) {
  if (S.deck >= ORDER.length) return;
  const i = ORDER[S.deck], ok = CARDS[i].a === after; S.placed.push({ i, ok, fly: 0 }); S.sel = i; S.deck++; (ok ? sfx.good : sfx.bad)();
}

// --- one render per change: controls, readout, state card, facts -----------------------------------------------------------
const secChip = (id, emo) => `<button class="sr-chip secret" data-act="sec" data-id="${id}">${secret.unlocked() ? `${emo} ${esc(T[lang].secrets[id][0])}` : '🔒 ???'}</button>`;
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? `${v}-sec` : v === 'range' ? `range-${S.sub}` : v;
  $('secSupply').hidden = !!sec || v !== 'supply'; $('secRange').hidden = !!sec || v !== 'range'; $('secReign').hidden = !!sec || v !== 'reign';
  $('secNurse').hidden = sec !== 'nurse'; $('secWire').hidden = sec !== 'wire';
  $('secRow').innerHTML = secChip('nurse', '🩺') + secChip('wire', '📡');
  document.querySelectorAll('#secRow .sr-chip').forEach((el) => el.classList.toggle('on', el.dataset.id === sec));
  if (sec === 'nurse') return renderNurse(t);
  if (sec === 'wire') return renderWire(t);
  if (v === 'supply') renderSupply(t); else if (v === 'range') renderRange(t); else renderReign(t);
}
function renderSupply(t) {
  const s = t.s, sd = Math.round(SEA_KM / SHIP_PACE), cd = cartDays();
  lab.setGlow('rgba(95, 208, 192, .24)');
  $('svQ').textContent = s.q;
  $('svPick').innerHTML = s.pick.map((p, i) => `<button class="sr-chip ${S.g1 === i ? (S.ok1 ? 'good' : 'bad') : ''}" data-act="g1" data-k="${i}" ${S.g1 !== null ? 'disabled' : ''}>${esc(p)}</button>`).join('');
  $('svPost').hidden = !S.run1;
  if (!S.run1) {
    lab.setReadout('?', '', '', '#e0b050'); lab.setFacts([]);
    lab.setState({ emo: '🧭', title: s.q, lead: s.pre, body: '', extra: '' });
    return;
  }
  $('svPaceL').textContent = s.pace; $('svPaceV').textContent = `${S.pace} km`;
  if (+$('svPace').value !== S.pace) $('svPace').value = S.pace;
  const be = breakEven(), win = cd <= sd;
  $('svBrk').textContent = win ? s.brkWin : s.brk(be);
  $('svToggle').textContent = S.bars ? s.map : s.chart;
  lab.setReadout(`${sd} · ${cd}`, s.val, s.pill, '#e0b050');
  const done = S.run1 === 2;
  lab.setFacts(done ? t.facts1 : []);
  lab.setState({ emo: S.ok1 ? '✅' : '🤔', title: S.ok1 ? s.ok : s.no, lead: s.res(sd, cd, S.pace), body: s.note(nf(roundTo(SEA_KM, 100)), nf(roundTo(ROAD_KM, 100))), extra: '' });
}
function renderRange(t) {
  const r = t.r;
  $('rgSub').innerHTML = ['rifle', 'ship'].map((k, i) => `<button class="sr-chip ${S.sub === k ? 'on' : ''}" data-act="sub" data-s="${k}">${esc(r.sub[i])}</button>`).join('');
  $('rgRifle').hidden = S.sub !== 'rifle'; $('rgShip').hidden = S.sub !== 'ship';
  if (S.sub === 'rifle') {
    lab.setGlow('rgba(107, 135, 182, .26)');
    $('rfQ').textContent = r.q;
    $('rfPick').innerHTML = r.pick.map((p, i) => `<button class="sr-chip ${S.g2 === i ? (S.ok2 ? 'good' : 'bad') : ''}" data-act="g2" data-k="${i}" ${S.g2 !== null ? 'disabled' : ''}>${esc(p)}</button>`).join('');
    $('rfPost').hidden = S.g2 === null;
    if (S.g2 === null) { lab.setReadout('?', '', '', '#6b87b6'); lab.setFacts([]); lab.setState({ emo: '🎯', title: r.q, lead: r.pre, body: '', extra: '' }); return; }
    $('rfDistL').textContent = r.yd(S.dist);
    $('rfDist').innerHTML = [200, 300, 500].map((d) => `<button class="sr-chip ${S.dist === d ? 'on' : ''}" data-act="dist" data-k="${d}">${esc(r.yd(d))}</button>`).join('');
    $('rfNote').textContent = r.note;
    const hs = HIT.s[S.dist], hr = HIT.r[S.dist], fmt = (hh) => (hh ? r.pct(rangeTxt(hh)) : '—');
    lab.setReadout(`${fmt(hs)} · ${fmt(hr)}`, `${r.smooth} · ${r.rifle}`, r.yd(S.dist), '#6b87b6');
    lab.setFacts(S.run2 === 2 ? t.facts2.filter((_, i) => i < 3) : []);
    lab.setState({ emo: S.ok2 ? '✅' : '🤔', title: S.ok2 ? r.ok : r.no, lead: r.res(rangeTxt(HIT.s[300]), rangeTxt(HIT.r[300])), body: hs && hr ? '' : r.none + ' · ' + r.yd(S.dist), extra: '' });
  } else {
    lab.setGlow('rgba(95, 168, 208, .26)');
    $('shQ').textContent = r.qs;
    $('shPick').innerHTML = r.picks.map((p, i) => `<button class="sr-chip ${S.g2s === i ? (S.ok2s ? 'good' : 'bad') : ''}" data-act="g2s" data-k="${i}" ${S.g2s !== null ? 'disabled' : ''}>${esc(p)}</button>`).join('');
    $('shPost').hidden = S.g2s === null;
    if (S.g2s === null) { lab.setReadout('?', '', '', '#5fa8d0'); lab.setFacts([]); lab.setState({ emo: '⛵', title: r.qs, lead: r.pres, body: '', extra: '' }); return; }
    const plan = sailPlan(S.wind), ratio = Math.max(1, plan.T), rs = pf((Math.round(ratio * 10) / 10).toFixed(1));
    $('shWindL').textContent = r.windL; $('shWindV').textContent = S.wind <= 25 ? r.w0 : S.wind >= 155 ? r.w180 : S.wind >= 65 && S.wind <= 115 ? r.w90 : `${S.wind}°`;
    if (+$('shWind').value !== S.wind) $('shWind').value = S.wind;
    lab.setReadout(`×${rs}`, `${r.sail} : ${r.steam}`, r.windL + ' ' + (S.wind <= 25 ? r.w0 : S.wind >= 155 ? r.w180 : `${S.wind}°`), '#5fa8d0');
    lab.setFacts(S.run2s === 2 ? t.facts2.filter((_, i) => i >= 3) : []);
    lab.setState({ emo: S.ok2s ? '✅' : '🤔', title: S.ok2s ? r.ok : r.no, lead: r.ress(rs), body: plan.straight ? r.straight : '', extra: '' });
  }
}
function renderReign(t) {
  const g = t.g, n = CARDS.length, k = S.placed.filter((p) => p.ok).length, done = S.deck >= n;
  lab.setGlow('rgba(192, 122, 184, .26)');
  $('rnQ').textContent = done ? g.done(k, n) : g.q;
  $('rnPick').innerHTML = g.pick.map((p, i) => `<button class="sr-chip" data-act="place" data-k="${i}" ${done ? 'hidden' : ''}>${esc(p)}</button>`).join('');
  $('rnLinks').hidden = !done;
  if (done) $('rnLinks').innerHTML = `<div class="sr-sub">${esc(g.links)}</div><div class="sr-links"><a href="../rail-russia/?lang=${lang}">${esc(LINKS.rail[lang])}</a><a href="../emancipation/?lang=${lang}">${esc(LINKS.em[lang])}</a></div>`;
  lab.setReadout(S.placed.length ? `${k}/${S.placed.length}` : '?', g.war, S.placed.length ? `${S.placed.length} / ${n}` : '', '#c07ab8');
  lab.setFacts(done ? t.facts3 : []);
  const sel = S.sel === null ? null : S.placed.find((p) => p.i === S.sel);
  if (!sel) { lab.setState({ emo: '🗂️', title: g.q, lead: '', body: '', extra: '' }); return; }
  const cd = CARDS[sel.i], tx = g.cards[sel.i], when = cd.a ? g.aft : g.bef;
  lab.setState({ emo: sel.ok ? '✅' : '🤔', title: sel.ok ? g.ok : g.no, lead: `${tx.t}, ${cd.lab}: ${when}.`, body: tx.l, extra: done ? `<div class="fine" style="font-size:11.5px;color:var(--faint)">${esc(g.doneLead)}</div>` : '' });
}
function renderNurse(t) {
  const n = t.nu, all = S.nu.done.every(Boolean);
  lab.setGlow('rgba(61, 220, 151, .22)');
  $('nuQ').textContent = n.q;
  const col = (list, act, order) => order.map((i) => `<button class="sr-chip ${act === 'nup' ? (S.nu.sel === i && !S.nu.done[i] ? 'on' : S.nu.done[i] ? 'good' : '') : (S.nu.done[i] ? 'good' : S.nu.bad === i ? 'bad' : '')}" data-act="${act}" data-k="${i}" ${S.nu.done[i] ? 'disabled' : ''}>${esc(list[i])}</button>`).join('');
  $('nuGrid').innerHTML = `<div class="sr-chips" style="flex-direction:column">${col(n.probs, 'nup', [0, 1, 2, 3])}</div><div class="sr-chips" style="flex-direction:column">${col(n.fixes, 'nuf', [2, 0, 3, 1])}</div>`;
  const cnt = S.nu.done.filter(Boolean).length;
  lab.setReadout(`${cnt}/4`, '', '', '#3ddc97'); lab.setFacts([]);
  if (all) lab.setState({ emo: '🩺', title: n.all, lead: n.allLead, body: n.weak, extra: '' });
  else if (S.nu.last !== undefined && S.nu.done[S.nu.last] && S.nu.bad === -1) lab.setState({ emo: '✅', title: n.good, lead: n.det[S.nu.last], body: n.src[S.nu.last], extra: '' });
  else lab.setState({ emo: '🩺', title: S.nu.bad >= 0 ? n.bad : n.q, lead: '', body: '', extra: '' });
}
function renderWire(t) {
  const w = t.wi;
  lab.setGlow('rgba(255, 224, 138, .22)');
  $('wiQ').textContent = w.q;
  $('wiPick').innerHTML = w.modes.map((m, i) => `<button class="sr-chip ${S.wi.mode === i ? 'on' : ''}" data-act="wi" data-k="${i}">${esc(w.go)}: ${esc(m)}</button>`).join('');
  lab.setReadout(S.wi.mode === null ? '?' : w.t[S.wi.mode], '', '', '#e0b050'); lab.setFacts([]);
  const done = S.wi.mode !== null && S.wi.t >= 1;
  lab.setState({ emo: '📡', title: done ? w.title[S.wi.mode] : w.q, lead: w.lead, body: w.src, extra: '' });
}
render();
</script>
