const playEra = (i) => { setCostume(); play(ERAS[i](), { spb: 0.5, metre: 3, loop: true }); };
function newPosQ() {
  S.pq = rnd(5, S.pq - 1) + 1; S.ppick = 0; S.armsP = ['prep', 1, 2, 3][rnd(4)]; playPos(1.2);
}
function newStepQ() {
  const pool = STEP_IDS, q = pool[rnd(pool.length, pool.indexOf(S.sq))];
  const others = shuffle(pool.filter((x) => x !== q)).slice(0, 2);
  S.sq = q; S.sopts = shuffle([q, ...others]); S.spick = null; playStep(q);
}
function newHistQ() { S.hq = rnd(5, S.hq); S.hpick = -1; S.era = S.hq; playEra(S.era); }
function startSec(k) {
  if (!secret.unlocked()) return secret.open();
  S.sec = k; S.fcount = 0; S.airT = 0; setCostume();
  if (k === 'fouette') play(fouettes(), { spb: 0.5, metre: 2, onEnd: render });
  else play(jete(6), { spb: 0.45, metre: 3, loop: true });
  sfx.snap(); render(); showStage();
}
function enterView() {
  const v = lab.view;
  if (v === 'pos') S.pmode === 'guess' ? newPosQ() : playPos();
  else if (v === 'steps') S.smode === 'guess' ? newStepQ() : playStep(S.step);
  else if (v === 'class') { S.cls.phase = 'idle'; S.cls.input = []; setCostume(); play([{ p: P({ ...f1 }), n: 2 }], { spb: 0.5 }); }
  else S.hmode === 'guess' ? newHistQ() : playEra(S.era);
}
function replay() {
  const v = lab.view;
  if (v === 'pos') playPos(0.8);
  else if (v === 'steps') S.sec ? startSec(S.sec) : playStep(S.smode === 'guess' ? S.sq : S.step);
  else if (v === 'hist') playEra(S.era);
  else if (S.cls.phase === 'idle' || S.cls.phase === 'done') { setCostume(); play([{ p: P({ ...f1 }), n: 1 }], { spb: 0.5 }); }
}

// class: the teacher shows a combination, the child repeats it
const CLS_THUMB = { plie: 0, releve: 0, tendu: 2, passe: 0, port: 1, saute: 1 };
const tempo = () => (S.cls.tempo === 'adagio' ? { metre: 3, spb: 0.46 } : { metre: 2, spb: 0.34 });
function newCombo(n) { const c = []; let last = ''; for (let i = 0; i < n; i++) { let id; do id = CLS_IDS[rnd(CLS_IDS.length)]; while (id === last); c.push(id); last = id; } return c; }
function playCombo(list, done) {
  setCostume();
  const { metre, spb } = tempo(), seq = [{ p: P({ ...f1 }), n: metre, idx: -1 }];
  list.forEach((id, i) => { for (const [p, fr, e] of CLS[id]) seq.push({ p, n: fr * 2 * metre, e, idx: i }); });
  seq.push({ p: P({ ...f1 }), n: metre, idx: -1 });
  play(seq, { spb, metre, onSeg: (i, s) => { S.cls.at = s.idx; }, onEnd: done });
}
function startWatch() {
  const c = S.cls;
  if (!c.combo.length) c.combo = newCombo(c.level);
  c.phase = 'watch'; c.input = []; c.at = -1;
  playCombo(c.combo, () => { c.phase = 'input'; c.at = -1; render(); });
  render(); showStage();
}
function finishReplay() {
  const c = S.cls; c.phase = 'done'; c.at = -1;
  c.ok = c.input.every((x, i) => x === c.combo[i]);
  if (c.ok) { sfx.good(); c.best = Math.max(c.best, c.level - 1); store.set('ballet:best', c.best); } else sfx.bad();
  render();
}

// --- controls ----------------------------------------------------------------------------------------------
const pickB = (act, v, label, cls = '', dis = false) => `<button class="bl-pick ${cls}" data-act="${act}" data-v="${v}" ${dis ? 'disabled' : ''}>${esc(label)}</button>`;
const tile = (act, id, cls = '', dis = false) => `<button class="bl-tile ${cls}" data-act="${act}" data-v="${id}" ${dis ? 'disabled' : ''}><canvas data-thumb="${id}"></canvas><span>${esc(short(id))}</span></button>`;
function ctrl() {
  const t = T[lang], v = lab.view, c = S.cls;
  const mode = (cur) => `<div class="bl-row" style="margin-top:0">${pickB('mode', 'learn', t.learn, cur === 'learn' ? 'on' : '')}${pickB('mode', 'guess', '❓ ' + t.guess, cur === 'guess' ? 'on' : '')}</div>`;
  const dress = `<div class="bl-row"><span class="lbl">${esc(t.dancer)}</span>${pickB('dress', 'girl', '🩰 ' + t.girl, S.dress === 'girl' ? 'on' : '')}${pickB('dress', 'boy', '👕 ' + t.boy, S.dress === 'boy' ? 'on' : '')}</div>`;
  const ans = (act, list, picked, none, right, label) => `<div class="bl-row">${list.map((x) => {
    const st = picked === none ? '' : x === right ? 'good' : x === picked ? 'bad' : '';
    return pickB(act, x, label(x), st, picked !== none);
  }).join('')}</div>`;
  const verdict = (picked, none, right, wrong) => picked === none ? '<p class="bl-verdict"></p>'
    : `<p class="bl-verdict ${picked === right ? 'good' : 'bad'}">${esc(picked === right ? t.right : wrong)}</p><div class="bl-btns"><button class="btn" data-act="next">${esc(t.next)}</button></div>`;
  let html = '';
  if (v === 'pos') {
    html += mode(S.pmode);
    if (S.pmode === 'learn') {
      html += `<div class="bl-row"><span class="lbl">${esc(t.feet)}</span>${[1, 2, 3, 4, 5].map((n) => pickB('feet', n, String(n), S.feet === n ? 'on' : '')).join('')}</div>
        <div class="bl-row"><span class="lbl">${esc(t.arms)}</span>${['prep', 1, 2, 3].map((a) => pickB('arms', a, t.pos.arms[a], String(S.armsP) === String(a) ? 'on' : '')).join('')}</div>
        <div class="bl-range"><div class="cap"><span>${esc(t.turnout)}</span><span id="turnV">${S.turn}°</span></div>
        <input type="range" class="big" id="turn" min="0" max="90" step="5" value="${S.turn}" aria-label="${esc(t.turnout)}"></div>`;
    } else {
      html += `<p class="bl-q">${esc(t.pos.q)}</p><p class="bl-sub">${esc(t.pos.qSub)}</p>`
        + ans('pp', [1, 2, 3, 4, 5], S.ppick, 0, S.pq, (n) => t.pos.feet[n - 1].split(' ')[0])
        + verdict(S.ppick, 0, S.pq, t.pos.wrongIs(t.pos.feet[S.pq - 1]));
    }
    html += dress;
  } else if (v === 'steps') {
    const open = secret.unlocked();
    const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-v="${k}">${open ? `${emo} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`;
    html += mode(S.smode);
    if (S.smode === 'learn') {
      html += `<div class="bl-tiles">${STEP_IDS.map((id) => tile('step', id, !S.sec && S.step === id ? 'on' : '')).join('')}</div>
        <div class="bl-row">${sc('fouette', '🦢')}<button class="bl-pick" data-act="again">${esc(t.again)}</button>${sc('moon', '🌙')}</div>`;
    } else {
      html += `<p class="bl-q">${esc(t.steps.q)}</p><p class="bl-sub">${esc(t.steps.qSub)}</p>`
        + ans('sp', S.sopts, S.spick, null, S.sq, (id) => short(id))
        + verdict(S.spick, null, S.sq, t.steps.wrongIs(short(S.sq)));
    }
    html += dress;
  } else if (v === 'class') {
    const busy = c.phase === 'watch' || c.phase === 'replay';
    html += `<div class="bl-row" style="margin-top:0"><span class="lbl">${esc(t.cls.tempo)}</span>${pickB('tempo', 'adagio', t.cls.adagio, c.tempo === 'adagio' ? 'on' : '', busy)}${pickB('tempo', 'allegro', t.cls.allegro, c.tempo === 'allegro' ? 'on' : '', busy)}</div>`;
    const slots = (list, ref) => `<div class="bl-slots">${Array.from({ length: c.combo.length || c.level }, (_, i) => {
      const id = list[i], st = !id ? '' : ref ? (id === ref[i] ? 'good' : 'bad') : 'fill';
      return `<span class="bl-slot ${st}">${id ? `${i + 1} · ${esc(short(id))}` : i + 1}</span>`;
    }).join('')}</div>`;
    if (c.phase === 'idle') html += `<div class="bl-btns"><button class="btn" data-act="watch">${esc(t.cls.watch)}</button></div>`;
    else if (c.phase === 'input' || busy) {
      html += `<div class="bl-tiles six">${CLS_IDS.map((id) => tile('ct', id, '', c.phase !== 'input')).join('')}</div>${slots(c.input)}
        <div class="bl-btns"><button class="bl-pick" data-act="undo" ${c.phase !== 'input' || !c.input.length ? 'disabled' : ''}>${esc(t.cls.undo)}</button>
        <button class="bl-pick" data-act="retry" ${c.phase !== 'input' ? 'disabled' : ''}>${esc(t.cls.watchAgain)}</button></div>`;
    } else {
      html += `<div class="bl-cmp"><span class="k">${esc(t.cls.teacher)}</span>${slots(c.combo)}<span class="k">${esc(t.cls.you)}</span>${slots(c.input, c.combo)}</div>
        <p class="bl-verdict ${c.ok ? 'good' : 'bad'}">${esc(c.ok ? t.cls.good(Math.min(8, c.level + 1)) : t.cls.bad)}</p>
        <div class="bl-btns">${c.ok ? `<button class="btn" data-act="cnext">${esc(t.cls.nextCombo)}</button>` : `<button class="btn" data-act="retry">${esc(t.cls.tryAgain)}</button>`}</div>`;
    }
    html += dress;
  } else {
    html += mode(S.hmode);
    const years = (i) => t.hist.eras[i][0];
    if (S.hmode === 'learn') html += `<div class="bl-row">${[0, 1, 2, 3, 4].map((i) => pickB('era', i, years(i), S.era === i ? 'on' : '')).join('')}</div>`;
    else html += `<p class="bl-q">${esc(t.hist.q)}</p><p class="bl-sub">${esc(t.hist.qSub)}</p>`
      + ans('hp', [0, 1, 2, 3, 4], S.hpick, -1, S.hq, years) + verdict(S.hpick, -1, S.hq, t.hist.wrongIs(years(S.hq)));
    html += dress;
  }
  $('ctrlBody').innerHTML = html;
  requestAnimationFrame(() => document.querySelectorAll('#ctrlBody canvas[data-thumb]').forEach((cv) => {
    const id = cv.dataset.thumb;
    drawThumb(cv, lab.view === 'class' ? CLS[id][CLS_THUMB[id]][0] : STEPS[id].key);
  }));
}
function drawThumb(cv, p) {
  const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2), w = r.width || 60, h = r.height || 58;
  cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  const ctx = cv.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0);
  const C = COST[S.dress], R = resolve(p, C), k = Math.min((h * 0.95) / 172, (w * 0.95) / 132);
  drawDancer(ctx, R, C, { ox: w / 2 - R.px * k, oy: h - 3, k }, 0);
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v, t = T[lang], c = S.cls;
  if (act === 'mode') {
    const k = lab.view === 'pos' ? 'pmode' : lab.view === 'steps' ? 'smode' : 'hmode';
    if (S[k] === v) return; S[k] = v; S.sec = null; sfx.click(); enterView();
  } else if (act === 'dress') { if (S.dress === v) return; S.dress = v; store.set('ballet:dress', v); sfx.click(); replay(); }
  else if (act === 'feet') { S.feet = +v; sfx.tick(); playPos(); }
  else if (act === 'arms') { S.armsP = v === 'prep' ? 'prep' : +v; sfx.tick(); playPos(); }
  else if (act === 'pp') { S.ppick = +v; (S.ppick === S.pq ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'sp') { S.spick = v; (v === S.sq ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'hp') { S.hpick = +v; (S.hpick === S.hq ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'next') { sfx.click(); lab.view === 'pos' ? newPosQ() : lab.view === 'steps' ? newStepQ() : newHistQ(); }
  else if (act === 'step') { S.sec = null; S.step = v; sfx.click(); playStep(v); showStage(); }
  else if (act === 'again') { sfx.click(); replay(); }
  else if (act === 'sec') return startSec(v);
  else if (act === 'era') { S.era = +v; sfx.click(); playEra(S.era); showStage(); }
  else if (act === 'tempo') { c.tempo = v; sfx.tick(); }
  else if (act === 'watch') { sfx.click(); return startWatch(); }
  else if (act === 'retry') { sfx.click(); return startWatch(); }
  else if (act === 'cnext') { c.level = Math.min(8, c.level + 1); c.combo = []; sfx.click(); return startWatch(); }
  else if (act === 'undo') { c.input.pop(); sfx.tick(); }
  else if (act === 'ct') {
    if (c.phase !== 'input' || c.input.length >= c.combo.length) return;
    c.input.push(v); sfx.tick();
    if (c.input.length === c.combo.length) { c.phase = 'replay'; playCombo(c.input, finishReplay); showStage(); }
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'turn') return;
  S.turn = +ev.target.value; $('turnV').textContent = `${S.turn}°`; playPos(0.35); state(); live();
});

// --- state card, readout, facts ------------------------------------------------------------------------------
function state() {
  const t = T[lang], v = lab.view, c = S.cls;
  if (v === 'pos') {
    if (S.pmode === 'guess' && !S.ppick) return lab.setState({ emo: '❓', title: t.pos.q, lead: t.pos.qSub, body: t.pos.turnBody });
    const n = S.pmode === 'guess' ? S.pq : S.feet;
    return lab.setState({ emo: '🦶', title: t.pos.feet[n - 1], lead: t.pos.feetDo[n - 1], body: `${t.pos.arms[S.armsP]}: ${t.pos.armsDo[S.armsP]}`,
      extra: `<b>${esc(t.pos.turnLead)}</b> ${esc(t.pos.turnBody)}${S.turn < 15 ? `<br><br>${esc(t.pos.parallel)}` : ''}` });
  }
  if (v === 'steps') {
    if (S.sec === 'fouette') return lab.setState({ emo: '🦢', title: t.sec.fTitle, lead: t.sec.fLead, body: t.sec.fBody });
    if (S.sec === 'moon') return lab.setState({ emo: '🌙', title: t.sec.mTitle, lead: t.sec.mLead, body: t.sec.mBody });
    if (S.smode === 'guess' && !S.spick) return lab.setState({ emo: '❓', title: t.steps.q, lead: t.steps.qSub, body: '' });
    const id = S.smode === 'guess' ? S.sq : S.step, [name, mean, how, tip] = t.steps.list[id];
    return lab.setState({ emo: '🩰', title: name, lead: t.steps.means(mean), body: how,
      extra: `<span class="bl-music">${esc(t.steps.music(STEPS[id].m))}</span><br><br>💡 ${esc(tip)}` });
  }
  if (v === 'class') {
    const say = c.phase === 'idle' || c.phase === 'watch' ? t.cls.sayIdle : c.phase === 'input' ? t.cls.sayInput : c.phase === 'replay' ? t.cls.sayReplay : '';
    return lab.setState({ emo: '🎹', title: t.cls.title, lead: t.cls.lead, body: t.cls.body, extra: say ? `<b>${esc(say)}</b>` : '' });
  }
  if (S.hmode === 'guess' && S.hpick < 0) return lab.setState({ emo: '❓', title: t.hist.q, lead: t.hist.qSub, body: '' });
  const [year, title, body] = t.hist.eras[S.era];
  lab.setState({ emo: '🎭', title, lead: year, body });
}
let lastLive = '';
function live() {
  const t = T[lang], v = lab.view, c = S.cls;
  let val = '', sub = '', pl = '';
  if (v === 'pos') {
    const hide = S.pmode === 'guess' && !S.ppick, n = S.pmode === 'guess' ? S.pq : S.feet;
    val = hide ? '?' : t.pos.feet[n - 1]; sub = hide ? '' : `${t.pos.fr[n - 1]} · ${t.pos.arms[S.armsP]} (${t.pos.armsWord})`; pl = `${t.turnout} ${S.turn}°`;
  } else if (v === 'steps') {
    if (S.sec === 'fouette') { val = t.sec.fCount(S.fcount); sub = t.sec.fDeg(S.fcount * 360); pl = '🦢'; }
    else if (S.sec === 'moon') { val = t.sec.mAir(S.airT); sub = t.sec.mSub; pl = `🌙 ${t.sec.moonW}`; }
    else {
      const hide = S.smode === 'guess' && !S.spick, id = S.smode === 'guess' ? S.sq : S.step;
      val = hide ? '?' : short(id); sub = hide ? '' : t.steps.means(t.steps.list[id][1]);
      pl = id === 'pirouette' && !hide ? t.steps.turned(360) : `♪ ${STEPS[id].m}/4`;
    }
  } else if (v === 'class') { val = t.cls.level(c.level); sub = t.cls.sub(c.level, c.best); pl = t.cls.phase[c.phase]; }
  else {
    const hide = S.hmode === 'guess' && S.hpick < 0;
    val = hide ? '?' : t.hist.eras[S.era][0]; sub = hide ? '' : t.hist.eras[S.era][1]; pl = '🎭';
  }
  const key = `${lang}|${val}|${sub}|${pl}`;
  if (key === lastLive) return; lastLive = key;
  lab.setReadout(esc(val), sub, pl, '#ff6fae');
}
function render() {
  document.body.dataset.v = lab.view;
  setCostume(); ctrl(); state(); live();
  lab.setFacts(T[lang].facts[lab.view]);
}

// --- the stage ---------------------------------------------------------------------------------------------
canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  CX.u = Math.min(1, CX.u + dt / 0.9);
  S.eraF += (S.era - S.eraF) * Math.min(1, dt * 3);
  tickPlayer(dt);
  const C = costume(), v = lab.view, moon = v === 'steps' && S.sec === 'moon', tx = T[lang];
  const R = PL.on ? CUR : { ...CUR, lean: CUR.lean + Math.sin(t * 1.6) * 0.4, hS: CUR.hS + Math.sin(t * 0.9) * 1.5 };
  const k = moon ? Math.min((h * 0.78) / (184 + 270), (w * 0.8) / 150) : Math.min((h * 0.84) / 186, (w * (v === 'hist' ? 0.72 : 0.86)) / 150);
  const cam = { ox: w * 0.5, oy: h * (moon ? 0.86 : 0.915), k };
  if (v === 'hist') drawTheatre(ctx, w, h, cam, t, S.eraF);
  else if (moon) drawMoon(ctx, w, h, t);
  else drawStudio(ctx, w, h, cam, t, R, C);
  if (moon) {   // how high the same leap goes on Earth and on the Moon
    for (const [y, label, col] of [[114, tx.sec.earth, '#7fc4ff'], [70 + 44 * 6, tx.sec.moonW, '#ffd27a']]) {
      const sy = cam.oy - y * Math.cos(PITCH) * k;
      ctx.save(); ctx.setLineDash([6, 6]); ctx.strokeStyle = rgba(col, 0.7); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(w * 0.04, sy); ctx.lineTo(w * 0.96, sy); ctx.stroke(); ctx.restore();
      pill(ctx, w, 10, sy - 30, label, { fg: col, size: 12 });
    }
  }
  drawShadow(ctx, R, cam, w);
  const J = drawDancer(ctx, R, C, cam, t);
  if (v === 'hist') {
    drawCurtains(ctx, w, h);
    if (S.hmode === 'learn' || S.hpick >= 0) pill(ctx, w, w / 2, h * 0.1 + 6, tx.hist.eras[S.era][0], { align: 'center', fg: '#ffe2a8', size: 14 });
  }
  if (v === 'pos') drawFeetInset(ctx, w, J, tx.fromAbove);
  if ((v === 'steps' || v === 'class') && PL.on && PL.seq.length > 1) drawCount(ctx, w, h);
  if (v === 'class' && S.cls.at >= 0) {
    const c = S.cls, n = c.combo.length;
    pill(ctx, w, 12, 12, c.phase === 'watch' ? `👩‍🏫 ${c.at + 1} / ${n}` : `${c.at + 1} · ${short(c.input[c.at])}`, { size: 13 });
  }
  if (v === 'steps' && S.sec === 'fouette') pill(ctx, w, 12, 12, `🦢 ${tx.sec.fCount(S.fcount)}`, { size: 14 });
  if (moon || S.sec === 'fouette') live();
});
enterView();
render();
</script>
</body>
</html>
