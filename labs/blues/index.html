// --- the family tree ------------------------------------------------------------------------------------------------
const NODES = {
  work: { x: 62, y: 280, col: '#6c8f5a', dk: false }, spir: { x: 180, y: 284, col: '#6c8f5a', dk: false }, holl: { x: 298, y: 280, col: '#6c8f5a', dk: false },
  blues: { x: 180, y: 228, col: '#3e6fd0', dk: false },
  jazz: { x: 62, y: 170, col: '#f0a53a', dk: true }, rb: { x: 282, y: 176, col: '#9a6bd6', dk: false },
  rr: { x: 250, y: 128, col: '#e2587c', dk: true }, rock: { x: 318, y: 76, col: '#c94b4b', dk: false },
  soul: { x: 168, y: 92, col: '#e07b39', dk: true }, funk: { x: 90, y: 92, col: '#3fb8a8', dk: true }, hip: { x: 130, y: 34, col: '#f2d04a', dk: true },
};
const EDGES = [['work', 'blues', -1, 0], ['spir', 'blues', -1, 0], ['holl', 'blues', -1, 0],
  ['blues', 'jazz', 0, 0.3], ['blues', 'rb', 0, 0.3], ['rb', 'rr', 0.25, 0.52], ['rr', 'rock', 0.48, 0.74], ['rr', 'soul', 0.48, 0.74], ['soul', 'funk', 0.62, 0.84], ['funk', 'hip', 0.76, 1], ['soul', 'hip', 0.76, 1]];
const NODE_T = { blues: -1, work: -1, spir: -1, holl: -1, jazz: 0.3, rb: 0.3, rr: 0.52, rock: 0.74, soul: 0.74, funk: 0.84, hip: 1 };
function nodeBox(c, id, lbl, yr) {
  c.font = font(800, 13); const w1 = c.measureText(lbl).width; c.font = font(700, 12); const w2 = yr ? c.measureText(yr).width : 0;
  const w = Math.max(w1, w2) + 16, h = yr ? fu(13) + fu(12) + 8 : fu(13) + 10;
  return { w, h };
}
function drawNode(c, id, lbl, yr, pop, badge) {
  const n = NODES[id], { w, h } = nodeBox(c, id, lbl, yr), s = Math.max(0.01, pop);
  c.save(); c.translate(n.x, n.y); c.scale(s, s);
  rr(c, -w / 2 + 1, -h / 2 + 3, w, h, 9); c.fillStyle = 'rgba(0,0,0,.35)'; c.fill();
  const g = c.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, shade(n.col, 0.28)); g.addColorStop(1, shade(n.col, -0.12));
  rr(c, -w / 2, -h / 2, w, h, 9); c.fillStyle = g; c.fill(); c.lineWidth = 1.8; c.strokeStyle = shade(n.col, -0.5); c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = n.dk ? '#2a1408' : '#fff';
  if (yr) { c.font = font(800, 13); c.fillText(lbl, 0, -h / 2 + fu(13) / 2 + 4); c.font = font(700, 12); c.globalAlpha = 0.85; c.fillText(yr, 0, h / 2 - fu(12) / 2 - 3); c.globalAlpha = 1; }
  else { c.font = font(800, 13); c.fillText(lbl, 0, 1); }
  if (badge) { ball(c, w / 2 - 2, -h / 2 + 2, 10, '#ffd24d'); c.font = font(900, 12); c.fillStyle = '#2a1408'; c.fillText(String(badge), w / 2 - 2, -h / 2 + 3); }
  c.restore();
}
function edgePath(c, a, b, p) {
  const A_ = NODES[a], B_ = NODES[b], x1 = A_.x, y1 = A_.y - 14, x2 = B_.x, y2 = B_.y + 14, my = (y1 + y2) / 2;
  c.beginPath(); const N = 18;
  for (let i = 0; i <= N; i++) {
    const u = (i / N) * p, v = 1 - u;
    const x = v ** 3 * x1 + 3 * v * v * u * x1 + 3 * v * u * u * x2 + u ** 3 * x2, y = v ** 3 * y1 + 3 * v * v * u * my + 3 * v * u * u * my + u ** 3 * y2;
    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
  }
}
function drawTree(c, now, dt, X0, X1, Y0, Y1) {
  const t = T[lang], tr = t.v3;
  if (S.checked) S.grow = Math.min(1, S.grow + dt / 3); else S.grow = 0;
  const bg = c.createLinearGradient(0, Y0, 0, Y1); bg.addColorStop(0, '#0d1424'); bg.addColorStop(1, '#241a2a');
  c.fillStyle = bg; c.fillRect(X0, Y0, X1 - X0, Y1 - Y0);
  const gl = c.createRadialGradient(180, 200, 10, 180, 200, 190); gl.addColorStop(0, 'rgba(255,190,110,.2)'); gl.addColorStop(1, 'rgba(255,190,110,0)');
  c.fillStyle = gl; c.fillRect(X0, Y0, X1 - X0, Y1 - Y0);
  // the arrow of time
  c.strokeStyle = 'rgba(255,230,190,.5)'; c.lineWidth = 2; c.beginPath(); c.moveTo(16, 252); c.lineTo(16, 44); c.moveTo(10, 52); c.lineTo(16, 42); c.lineTo(22, 52); c.stroke();
  c.font = font(800, 12); c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(255,230,190,.85)'; c.fillText(tr.time, 6, 28);
  // branches
  EDGES.forEach(([a, b, t0, t1]) => {
    const p = t1 <= 0 ? 1 : clamp01((S.grow - t0) / (t1 - t0));
    if (p <= 0) return;
    edgePath(c, a, b, p); c.lineCap = 'round'; c.lineWidth = 7; c.strokeStyle = '#4a2c18'; c.stroke();
    edgePath(c, a, b, p); c.lineWidth = 5; c.strokeStyle = '#8a5a33'; c.stroke();
    edgePath(c, a, b, p); c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,220,170,.4)'; c.stroke();
  });
  const rank = {}; TIME_ORDER.forEach((k, i) => { rank[k] = i + 1; });
  Object.keys(NODES).forEach((id) => {
    const t1 = NODE_T[id], pop = t1 < 0 ? 1 : easeBack((S.grow - t1) / 0.12);
    if (t1 >= 0 && S.grow < t1) return;
    drawNode(c, id, tr.node[id], tr.year[id], pop, S.checked && rank[id] ? rank[id] : 0);
  });
  if (!S.checked) {
    c.font = font(900, 40); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(255,230,190,.8)'; c.fillText('?', 180, 140);
    c.setLineDash([5, 6]); c.lineWidth = 3; c.strokeStyle = 'rgba(255,230,190,.4)'; c.beginPath(); c.moveTo(180, 205); c.lineTo(180, 168); c.stroke(); c.setLineDash([]);
  }
}
const TIME_ORDER = ['jazz', 'rr', 'soul', 'hip'];

// --- the main loop -----------------------------------------------------------------------------------------------------
const cv = $('cv');
canvasLoop(cv, (c, w, h, dt, tt) => {
  const now = nowS();
  SC = Math.min(w / W, h / H); OX = (w - W * SC) / 2; OY = (h - H * SC) / 2;
  tickPlay(now);
  S.bv += (S.bend - S.bv) * Math.min(1, dt * 14);
  const X0 = -OX / SC, X1 = W + OX / SC, Y0 = -OY / SC, Y1 = H + OY / SC;
  c.save(); c.translate(OX, OY); c.scale(SC, SC);
  const v = lab.view;
  if (v === 'tree' && !S.sec) drawTree(c, now, dt, X0, X1, Y0, Y1);
  else {
    const bar = barNow(), pulse = S.playing ? Math.exp(-((now - S.tStart) % BEAT) * 6) : 0;
    drawRoom(c, X0, X1, Y0, Y1, now, pulse);
    if (S.sec === 'swing') drawRoll(c, now, dt);
    else if (S.sec === 'solo') drawTiles(c, now, bar, true);
    else if (v === 'blue') drawBend(c, now);
    else drawTiles(c, now, bar, false);
    drawHaze(c, now);
    drawBassist(c, now); drawGuitarist(c, now);
    drawParts(c, dt);
  }
  c.restore();
});
function tickPlay(now) {
  if (!S.playing) return;
  const el = now - S.tStart;
  if (S.loop) { while (S.sched * S.D < el + 1.5) schedule(S.sched++); }
  else if (el > S.D + 0.3) { if (S.mode === 'chorus') S.reach = 12; S.playing = false; render(); return; }
  while (S.fx.length && S.fx[0].t <= now) {
    const e = S.fx.shift();
    if (now - e.t < 0.3) { spawn(e.midi); S.gHit = e.t; }
  }
  if (S.mode === 'chorus') {
    const nr = clamp(Math.floor(Math.max(0, el) / BAR) + 1, 0, 12);
    if (nr > S.reach) { for (let i = S.reach; i < nr; i++) S.revAt[i] = now; S.reach = nr; render(); return; }
  }
  const b = barNow();
  if (b !== S.lastBar) { S.lastBar = b; if (b >= 0 && el >= 0) { S.bHit = now; render(); } }
}

// --- controls ---------------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'change' || S.sec || S.playing || S.reach > 0) return;
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left - OX) / SC, y = (ev.clientY - r.top - OY) / SC;
  for (let i = 0; i < 12; i++) {
    const q = tileRect(i);
    if (x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h) {
      if (S.g1 === null) S.g1 = i + 1; else if (S.g2 === null) S.g2 = i + 1; else return;
      sfx.click(); render(); return;
    }
  }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-pick], [data-note], [data-feel], [data-card], [data-slot]'); if (!b) return;
  const d = b.dataset, act = d.act;
  if (d.pick !== undefined) { if (S.p2 === null) { S.p2 = +d.pick; sfx.click(); showStage(); } }
  else if (d.note !== undefined) { S.note = +d.note; S.bend = 0; S.moved = false; stopPlay(true); sfx.click(); $('blSlider').value = 0; }
  else if (d.feel !== undefined) {
    S.feel = d.feel; sfx.click();
    if (S.playing && S.mode === 'lick') { const keep = S.mode; startPlay(keep); }
  }
  else if (d.card !== undefined) { if (!S.checked && !S.order.includes(d.card)) { S.order.push(d.card); sfx.tick(); } }
  else if (d.slot !== undefined) { if (!S.checked) { S.order.splice(+d.slot, 1); sfx.tick(); } }
  else if (act === 'play') { if (S.playing && S.mode === 'chorus') stopPlay(true); else startPlay('chorus'); }
  else if (act === 'again') { stopPlay(true); S.g1 = null; S.g2 = null; S.reach = 0; S.revAt = []; sfx.click(); }
  else if (act === 'phrase') { if (S.playing && S.mode === 'phrase') stopPlay(true); else startPlay('phrase'); }
  else if (act === 'check') { if (S.order.length === 4 && !S.checked) { S.checked = true; S.grow = 0; (S.order.every((k, i) => k === TIME_ORDER[i]) ? sfx.good : sfx.bad)(); showStage(); } }
  else if (act === 'clear') { S.order = []; S.checked = false; S.grow = 0; sfx.click(); }
  else if (act === 'swplay') { if (S.playing && S.mode === 'lick') stopPlay(true); else startPlay('lick'); }
  else if (act === 'soplay') { if (S.playing && S.mode === 'solo') stopPlay(true); else startPlay('solo'); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = d.k;
    if (S.sec === k) { S.sec = null; stopPlay(true); }
    else { S.sec = k; startPlay(k === 'swing' ? 'lick' : 'solo'); showStage(); }
    sfx.click();
  }
  render();
});
$('blSlider').addEventListener('pointerdown', () => ensureSound());
$('blSlider').addEventListener('input', (ev) => {
  ensureSound(); S.bend = +ev.target.value / 100; S.moved = true; holdTone(); render();
});
$('soPads').addEventListener('pointerdown', (ev) => {
  const b = ev.target.closest('.bs-pad'); if (!b) return;
  ev.preventDefault(); padHit(+b.dataset.n);
  b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 140);
});

// --- one render per change: controls, readout and the state card ----------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec || v;
  $('bsMain').style.display = sec ? 'none' : '';
  $('vChange').style.display = v === 'change' ? '' : 'none';
  $('vBlue').style.display = v === 'blue' ? '' : 'none';
  $('vTree').style.display = v === 'tree' ? '' : 'none';
  $('vSwing').style.display = sec === 'swing' ? '' : 'none';
  $('vSolo').style.display = sec === 'solo' ? '' : 'none';
  if (sec === 'swing') renderSwing(t); else if (sec === 'solo') renderSolo(t);
  else if (v === 'change') renderChange(t); else if (v === 'blue') renderBlue(t); else renderTree(t);
  lab.setFacts(t.facts[v]);
  const open = secret.unlocked();
  const sc = (k, emo) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('bsSecs').innerHTML = sc('swing', '🥁') + sc('solo', '🎸');
}
function renderChange(t) {
  const q = t.v1, { g1, g2, reach } = S, playing = S.playing && S.mode === 'chorus', bar = barNow();
  const step = g1 === null ? 1 : g2 === null ? 2 : 3;
  $('chQ').textContent = reach > 0 || playing ? q.gs(g1, g2) : step === 1 ? q.q1 : step === 2 ? q.q2 : q.q3;
  const pb = $('chPlay'); pb.textContent = playing ? t.stop : t.play; pb.disabled = step < 3; pb.style.opacity = step < 3 ? '.35' : '';
  const ag = $('chAgain'); ag.textContent = t.again; ag.hidden = g1 === null || playing;
  // readout: only what has been played or what the child guessed
  const chordOf = (i) => CH[PATTERN[i]];
  if (reach > 0) {
    const i = Math.min(11, Math.max(0, playing && bar >= 0 ? bar : reach - 1));
    lab.setReadout(String(i + 1), t.barOf, `${chordOf(i).n} · ${PATTERN[i]}`, chordOf(i).col);
  } else lab.setReadout(g1 === null ? '?' : String(g1), g1 === null ? t.barOf : t.myGuess, g2 !== null ? `V: ${g2}` : '', '#e2a24a');
  // state card
  if (reach >= 9) {
    const n = (g1 === 5 ? 1 : 0) + (g2 === 9 ? 1 : 0);
    lab.setState({ emo: n === 2 ? '✅' : '🎼', title: n === 2 ? t.ok : n === 1 ? t.half : t.no, lead: `${q.r1(g1)} ${q.r2(g2)}`, body: q.pat, extra: '' });
  } else if (reach >= 5) lab.setState({ emo: g1 === 5 ? '✅' : '🎼', title: g1 === 5 ? t.ok : t.no, lead: q.r1(g1), body: q.lp, extra: '' });
  else if (reach > 0 || playing) lab.setState({ emo: '🎧', title: q.tp, lead: q.lp, body: '', extra: '' });
  else lab.setState(step === 1 ? { emo: '🤔', title: q.t1, lead: q.l1, body: '', extra: '' } : step === 2 ? { emo: '🤔', title: q.t2, lead: q.l2, body: '', extra: '' } : { emo: '🎷', title: q.t3, lead: q.l3, body: '', extra: '' });
}
function renderBlue(t) {
  const q = t.v2, n = NOTE[S.note], open = S.p2 !== null, playing = S.playing && S.mode === 'phrase';
  $('blQ').textContent = q.pq; $('blQ').style.display = open ? 'none' : '';
  $('blOpts').style.display = open ? 'none' : '';
  $('blOpts').innerHTML = q.opts.map((o, i) => `<button type="button" class="bs-opt" data-pick="${i}">${esc(o)}</button>`).join('');
  $('blCtl').style.display = open ? '' : 'none';
  $('blNotes').innerHTML = `<button type="button" data-note="3" class="${S.note === 3 ? 'on' : ''}">${esc(q.n3)}</button><button type="button" data-note="7" class="${S.note === 7 ? 'on' : ''}">${esc(q.n7)}</button>`;
  $('blPhrase').textContent = playing ? t.stop : q.phrase;
  $('blLo').textContent = n.lo; $('blHi').textContent = n.hi;
  if (!open) { lab.setReadout('?', '', '', '#8a7bd8'); lab.setState({ emo: '🤔', title: q.pt, lead: q.pq, body: q.pb, extra: '' }); return; }
  const k = S.bend, z = k < 0.2 ? 0 : k > 0.8 ? 2 : 1, p = Math.round(k * 100);
  lab.setReadout(z === 0 ? n.lo : z === 2 ? n.hi : `${n.lo}–${n.hi}`, z === 1 ? q.bend(p) : '', (S.note === 3 ? q.pill3 : q.pill7)[z], mix('#5b86e0', '#ffd24d', k));
  if (!S.moved) {
    const right = S.p2 === 2;
    lab.setState({ emo: right ? '✅' : '🎸', title: right ? t.ok : t.no, lead: right ? q.rOk : q.rNo, body: q.rb, extra: '' });
  } else {
    const [tt, ll] = (S.note === 3 ? q.st3 : q.st7)[z];
    lab.setState({ emo: z === 1 ? '🎵' : z === 0 ? '😢' : '😀', title: tt, lead: ll, body: '', extra: '' });
  }
}
function renderTree(t) {
  const q = t.v3, full = S.order.length === 4;
  $('trQ').textContent = q.q;
  $('trSlots').innerHTML = [0, 1, 2, 3].map((i) => {
    const k = S.order[i], cls = k ? (S.checked ? (k === TIME_ORDER[i] ? 'full good' : 'full bad') : 'full') : '';
    return `<button type="button" class="bs-slot ${cls}" ${k ? `data-slot="${i}"` : ''}><i>${i + 1}</i>${k ? esc(q.cards[k]) : '·'}</button>`;
  }).join('');
  $('trCards').innerHTML = ['rr', 'hip', 'jazz', 'soul'].map((k) => `<button type="button" class="bs-card" data-card="${k}" ${S.order.includes(k) || S.checked ? 'disabled' : ''}>${esc(q.cards[k])}</button>`).join('');
  const ck = $('trCheck'); ck.textContent = t.check; ck.hidden = S.checked; ck.disabled = !full; ck.style.opacity = full ? '' : '.35';
  const cl = $('trClear'); cl.textContent = S.checked ? t.retry : t.clear; cl.hidden = S.order.length === 0;
  const right = S.order.filter((k, i) => k === TIME_ORDER[i]).length;
  if (S.checked) {
    lab.setReadout(`${right}/4`, q.ok(right).replace(/^\d+ /, ''), '', right === 4 ? '#3ddc97' : '#f0a53a');
    lab.setState({ emo: right === 4 ? '✅' : '🌳', title: right === 4 ? t.ok : t.no, lead: `${q.lead}`, body: `${q.ok(right)}. ${q.body}`, extra: '' });
  } else {
    lab.setReadout(`${S.order.length}/4`, '', '', '#f0a53a');
    lab.setState({ emo: '🌳', title: q.t0, lead: q.l0, body: '', extra: '' });
  }
}
function renderSwing(t) {
  const q = t.sw, i = S.feel === 'swung' ? 1 : 0, playing = S.playing && S.mode === 'lick';
  $('swFeel').innerHTML = `<button type="button" data-feel="straight" class="${i === 0 ? 'on' : ''}">${esc(q.straight)}</button><button type="button" data-feel="swung" class="${i === 1 ? 'on' : ''}">${esc(q.swung)}</button>`;
  $('swPlay').textContent = playing ? t.stop : t.play;
  lab.setReadout(q[i ? 'swung' : 'straight'], q.sub[i], q.pill[i], i ? '#e2587c' : '#7aa7ff');
  lab.setState({ emo: '🥁', title: q.t[i], lead: q.l[i], body: q.b, extra: '' });
}
function renderSolo(t) {
  const q = t.so, playing = S.playing && S.mode === 'solo', bar = barNow();
  $('soPlay').textContent = playing ? q.stop : q.start;
  const i = bar >= 0 ? bar : 0, ch = CH[PATTERN[i]];
  lab.setReadout(S.lastPad ?? '♪', playing ? t.barOf : q.last, playing ? `${i + 1} · ${ch.n}` : '', ch.col);
  lab.setState({ emo: '🎸', title: q.t, lead: q.l, body: q.b, extra: '' });
}
render();
</script>
