    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
  }
  lab.setFacts([{ emo: '🛰️', text: q.fact, src: FACT_SRC.s }]);
}

function renderSecA(t) {
  const a = t.sa, d = S.days, us = d * 38, km = d * DRIFT;
  lab.setGlow('rgba(255, 138, 122, .24)');
  setText($('gpDLbl'), a.days); setText($('gpDVal'), String(d)); setVal($('gpD'), d);
  setText($('gpCorr'), a.corr); $('gpCorr').classList.toggle('on', S.corr);
  lab.setReadout(`${dec(S.corr ? 0 : km, 1)} ${t.km}`, a.after(d), S.corr ? a.pillOk : a.pillBad, '#ff8a7a');
  const st = S.corr ? a.s2(dec(DRIFT, 1)) : d === 0 ? a.s0 : a.s1(d, us, dec(km, 1));
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
  lab.setFacts([]);
}
function renderSecB(t) {
  const b = t.sb, R = rec(S.hour), per = CONS.map((_, i) => (S.sysOn[i] ? countAbove(satsOf(i, S.hour, R), 0) : 0)), n = per.reduce((x, y) => x + y, 0), k = S.sysOn.filter(Boolean).length;
  lab.setGlow('rgba(185, 163, 255, .24)');
  hourBox(t);
  $('gpCity').hidden = true;
  const shapes = ['●', '■', '◆', '▲'];
  setHTML($('gpSys'), CONS.map((cn, i) => `<button type="button" class="chip gp-sys ${S.sysOn[i] ? 'on' : ''}" data-act="sys" data-i="${i}"><span class="gp-sh" style="color:${S.sysOn[i] ? '#0A0C14' : cn.col}">${shapes[i]}</span> ${esc(b.sys[i])}${S.sysOn[i] ? ` · ${per[i]}` : ''}</button>`).join(''));
  lab.setReadout(n, t.s.sub, k ? b.pill(k) : '', '#b9a3ff');
  const st = b.st(n, k);
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
  lab.setFacts([]);
}
render();
</script>
