  if (!(x > 0)) return null;

  return { m: m.toFixed(2), e };

// "about 602 thousand billion billion"
function words(N) {
  if (!(N >= 1000)) return '';
  let e3 = Math.floor(Math.log10(N) / 3) * 3, m = N / 10 ** e3;
  m = m >= 100 ? Math.round(m) : m >= 10 ? Math.round(m) : Math.round(m * 10) / 10;
  if (m >= 1000) { m /= 1000; e3 += 3; }
  const rem = e3 % 9, b = Math.floor(e3 / 9), u = [];
  if (rem === 3) u.push('th'); if (rem === 6) u.push('mi');
  for (let i = 0; i < b; i++) u.push('bi');

  if (!u.length) return mt;
  if (lang === 'ru') {

  }

    h = `<div class="mo-row"><button class="chip mo-t" data-act="secAgain">${esc(t.again)}</button><button class="chip mo-t" data-act="secBack">${esc(t.back)}</button></div>`;
  } else if (v === 'rice') {
    const R = S.r, st = r1Stage();
    if (st === 0) h = `<button class="btn mo-go" data-act="pour">${esc(t.r.pour)}</button>`;
    else if (st === 1) h = R.ready ? `<div class="mo-q">${esc(t.r.q)}</div><div class="mo-opts">${[4000, 40000, 400000].map((n, i) => `<button class="mo-o" data-act="rpick" data-i="${i}">${esc(num(n))}</button>`).join('')}</div>` : `<div class="mo-note">${esc(t.r.sub0.length ? '…' : '')}</div>`;
    else {
      const ok = R.pick === 1;
      h = `<div class="mo-q">${esc(t.r.q)}</div><div class="mo-opts">${[4000, 40000, 400000].map((n, i) => `<button class="mo-o ${i === 1 ? 'ok' : i === R.pick ? 'no' : 'dim'}" disabled>${esc(num(n))}</button>`).join('')}</div>
        <div class="mo-v" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.notq)} 1000 ${t.u.g} ÷ ${dec('2.5')} ${t.u.g} × 100 = ${esc(num(40000))}</div>
        <div class="mo-row"><button class="chip mo-t ${R.mode === 'grain' ? 'on' : ''}" data-act="rmode" data-m="grain">🍚 ${esc(t.grains(40000))}</button><button class="chip mo-t ${R.mode === 'bean' ? 'on' : ''}" data-act="rmode" data-m="bean">🫘 ${esc(t.beans(40000))}</button></div>`;
    }
  } else if (v === 'atoms') {
    const A = S.a, pend = A_PEND(), e = EL[A.el[A.act]];
    h = pend ? `<div class="mo-q">${esc(t.a.q)}</div><div class="mo-opts">${optBtns(t.a.opts, null, 2, 'apick')}</div>`
      : `<div class="mo-v" style="color:${A.pick === 2 ? 'var(--ok)' : 'var(--wip)'}">${esc(A.pick === 2 ? t.right : t.notq)}</div>`;
    h += `<div class="${pend ? 'mo-lock' : ''}"><div class="mo-row"><button class="chip mo-t ${A.act === 0 ? 'on' : ''}" data-act="pan" data-i="0">${esc(t.a.left)}</button><button class="chip mo-t ${A.act === 1 ? 'on' : ''}" data-act="pan" data-i="1">${esc(t.a.right)}</button></div>
      <div class="mo-row">${EL.map((x, i) => `<button class="chip mo-t ${A.el[A.act] === i ? 'on' : ''}" data-act="el" data-i="${i}"><b>${x.s}</b> <small>${x.ar}</small></button>`).join('')}</div>
      <div class="mo-sl"><span id="mo-gl">${esc(t.a.mass(A.g[A.act]))}</span><input class="big" id="mo-g" type="range" min="1" max="200" step="1" value="${A.g[A.act]}" style="--track:linear-gradient(90deg,#2a3350,${e.col})"></div></div>
      ${pend ? `<div class="mo-note">${esc(t.a.locked)}</div>` : ''}`;
  } else {
    const M = S.m, pi = presetOf(M.c), f = formulaOf(M.c);
    if (M.pend) {
      const p = PRE.find((q) => q.k === M.pend), ix = PRE.indexOf(p), perm = PERM[ix], vals = [`${fxt(mrOf(p.c), 1)} ${t.u.g}`, `${zOf(p.c)} ${t.u.g}`, `${nOf(p.c)} ${t.u.g}`];
      h = `<div class="mo-q">${esc(t.m.q(formulaOf(p.c)))}</div><div class="mo-opts">${perm.map((k, i) => `<button class="mo-o" data-act="mpick" data-i="${k}">${esc(vals[k])}</button>`).join('')}</div>`;
    } else if (M.verdict) {
      h = `<div class="mo-q">${esc(t.m.q(M.verdict.f))}</div><div class="mo-opts">${M.verdict.perm.map((k) => `<button class="mo-o ${k === 0 ? 'ok' : k === M.verdict.pick ? 'no' : 'dim'}" disabled>${esc(M.verdict.vals[k])}</button>`).join('')}</div>
        <div class="mo-v" style="color:${M.verdict.pick === 0 ? 'var(--ok)' : 'var(--wip)'}">${esc(M.verdict.pick === 0 ? t.right : t.notq)} ${esc(M.verdict.pick === 1 ? t.m.zsum : M.verdict.pick === 2 ? t.m.cnt : '')}</div>`;
    }
    h += `<div class="mo-row">${PRE.map((p, i) => `<button class="chip mo-t ${pi === i ? 'on' : ''}" data-act="pre" data-i="${i}"><b>${formulaOf(p.c)}</b></button>`).join('')}</div>
      <div class="mo-row ${M.pend ? 'mo-lock' : ''}">${BTN.map((e) => `<button class="chip mo-t" data-act="atom" data-e="${e}"><b style="color:${MC[e] === '#5a6070' ? '#aab3c8' : MC[e]}">${e}</b> <small>${dec(MA[e])}</small></button>`).join('')}<button class="chip mo-t" data-act="clr">${esc(t.m.clear)}</button></div>
      <div class="mo-note">${esc(t.m.remove)}</div>`;
  }
  el.innerHTML = h;
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip mo-t secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('mo-sec').innerHTML = `<div class="mo-row" style="margin:0">${sc('a', '🌾')}${sc('b', '💧')}</div>`;
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.secT = 0; sfx.click();
    if (S.sec === 'rice') lab.setGlow('rgba(210,190,120,.28)');
  } else if (act === 'secAgain') { S.secT = 0; sfx.click(); }
  else if (act === 'secBack') { S.sec = null; sfx.click(); }
  else if (act === 'pour') {
    S.r.pourT = 0; S.r.ready = false; sfx.push();
    setTimeout(() => { S.r.ready = true; if (lab.view === 'rice') render(); }, 1700);
  } else if (act === 'rpick') {
    S.r.pick = i; S.r.swapT = performance.now() / 1000; (i === 1 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'rmode') { S.r.mode = b.dataset.m; S.r.swapT = performance.now() / 1000; sfx.click(); }
  else if (act === 'apick') {
    S.a.pick = i; S.a.g = [12, 24]; S.a.el = [1, 3]; (i === 2 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'pan') { S.a.act = i; sfx.click(); }
  else if (act === 'el') { S.a.el[S.a.act] = i; sfx.tick(); }
  else if (act === 'pre') {
    const p = PRE[i]; S.m.c = { ...p.c }; S.m.verdict = null; S.m.disp = 0;
    S.m.pend = S.m.done[p.k] ? null : p.k; sfx.click();
  } else if (act === 'mpick') {
    const p = PRE.find((q) => q.k === S.m.pend), ix = PRE.indexOf(p), perm = PERM[ix];
    const vals = [`${fxt(mrOf(p.c), 1)} ${T[lang].u.g}`, `${zOf(p.c)} ${T[lang].u.g}`, `${nOf(p.c)} ${T[lang].u.g}`];
    S.m.verdict = { f: formulaOf(p.c), perm, pick: i, vals }; S.m.done[p.k] = true; S.m.pend = null; S.m.disp = 0; (i === 0 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'atom') {
    const e = b.dataset.e, tot = nOf(S.m.c); if (tot >= 12) return sfx.bad();
    S.m.c[e] = cnt(S.m.c, e) + 1; S.m.verdict = null; S.m.popKey = `${e}#${S.m.c[e] - 1}`; S.m.popT = performance.now() / 1000; sfx.snap();
  } else if (act === 'clr') { S.m.c = {}; S.m.verdict = null; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'mo-g') return;
  S.a.g[S.a.act] = +ev.target.value; $('mo-gl').textContent = T[lang].a.mass(S.a.g[S.a.act]); card(); ro();
});
function showStage() {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// --- readout, state card, render ---------------------------------------------------------------------------
let lastRO = '';
function setRO(val, sub, pillT, col) {
  const k = [val, sub, pillT, col].join('|'); if (k === lastRO) return; lastRO = k;
  lab.setReadout(val, sub, pillT, col);
}
function ro() {
  const t = T[lang], v = lab.view;
  if (S.sec === 'rice') { const d = Math.round(120 * ease(S.secT / 5)); return setRO(`${d} ${lang === 'en' || lang === 'hu' ? 'm' : 'м'}`, `${sciTxt(NA)} ${t.ofRice}`, '', '#d9c58a'); }
  if (S.sec === 'drop') return setRO(sciHtml(1.6728e21), `${dec('0.05')} ${t.u.g} ÷ 18 ${t.u.gmol} ≈ ${dec('0.0028')} ${t.u.mol}`, '', '#4aa6ec');
  if (v === 'rice') {
    const R = S.r, st = r1Stage(), landed = landedNow();
    if (st === 0) return setRO(fmtMass(0), t.r.sub0, '', '#d9b15f');
    if (st === 1) return setRO(fmtMass(R.disp), t.grains(landed), '', '#d9b15f');
    return setRO(fmtMass(R.disp), R.mode === 'grain' ? t.grains(40000) : t.beans(40000), R.mode === 'bean' ? `${dec('0.5')} ÷ ${dec('0.025')} = 20` : '', '#d9b15f');
  }
  if (v === 'atoms') {
    const A = S.a;
    if (A_PEND()) return setRO('?', '', '', '#4ea8ff');
    const e = EL[A.el[A.act]], g = A.g[A.act], n = g / e.ar, N = n * NA;
    return setRO(sciHtml(N), t.a.molLine(g, e.ar, n >= 100 ? num(n) : n >= 10 ? fx(n, 1) : fx(n, 2)) + ` · ${e.s}`, words(N), e.col === '#5a6070' ? '#7a8196' : e.col);
  }
  const M = S.m, mr = mrOf(M.c);
  if (M.pend) return setRO('?', '', '', '#5fcf7a');
  if (!nOf(M.c)) return setRO(`0 ${t.u.g}`, '', '', '#5fcf7a');
  return setRO(`${fxt(M.disp, 1)} ${t.u.g}`, `${t.m.mole1(formulaOf(M.c))}: ${sumOf(M.c)}`, `Mr = ${dec(mr)}`, '#5fcf7a');
}
let lastFrame = '';
function roFrame() { // animated readouts (scale reading, secrets) follow the canvas
  if (S.sec || lab.view === 'rice' || lab.view === 'mol') ro();
}
function card() {
  const t = T[lang], v = lab.view; let s;
  if (S.sec === 'rice') { s = t.sa(120); lab.setGlow('rgba(210,190,120,.28)'); lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3] }); return lab.setFacts([]); }
  if (S.sec === 'drop') { s = t.sb(1.6728e21); lab.setGlow('rgba(74,166,236,.3)'); lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3] }); return lab.setFacts([]); }
  if (v === 'rice') {
    const st = r1Stage(); lab.setGlow('rgba(217,177,95,.26)');
    s = st === 0 ? t.r.s0 : st === 1 ? t.r.s1(fmtMass(2.5).replace(/ .*/, '')) : (S.r.mode === 'grain' ? t.r.s2 : t.r.s3);
    lab.setFacts(t.facts.rice);
  } else if (v === 'atoms') {
    const A = S.a; lab.setGlow('rgba(78,168,255,.26)');
    if (A_PEND()) s = t.a.pend;
    else if (A.pick !== null && A.g[0] === 12 && A.g[1] === 24 && A.el[0] === 1 && A.el[1] === 3) s = t.a.rev();
    else {
      const nL = A.g[0] / EL[A.el[0]].ar, nR = A.g[1] / EL[A.el[1]].ar;
      if (A.el[0] === A.el[1] && A.g[0] === A.g[1]) s = t.a.sameS;
      else if (Math.abs(nL - nR) / Math.max(nL, nR) < 0.005) s = t.a.sameN;
      else if (A.g[0] === A.g[1]) s = t.a.sameM;
      else s = t.a.free;
    }
    lab.setFacts(t.facts.atoms);
  } else {
    const M = S.m, f = formulaOf(M.c); lab.setGlow('rgba(95,207,138,.24)');
    if (M.pend) s = t.m.pend(formulaOf(PRE.find((q) => q.k === M.pend).c));
    else if (!nOf(M.c)) s = t.m.empty;
    else {
      s = t.m.free(f, sumOf(M.c)); const key = keyOf(M.c);
      if (key === 'H2O1' || key === 'H2O') s = [s[0], s[1], s[2], `${t.m.water} ${s[3]}`];
      else if (GAS.has(key)) s = [s[0], s[1], s[2], `${t.m.gas} ${s[3]}`];
    }
    lab.setFacts(t.facts.mol);
  }
  lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3] });
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  lastRO = '';
  buildCtrl(t, v); card(); ro();
}
render();
</script>
