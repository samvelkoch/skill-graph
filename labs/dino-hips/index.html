  const v = done && ans !== 'auto' ? `<div class="dh-v ${ans === 0 ? 'ok' : 'bad'}">${esc(ans === 0 ? rightMsg : wrongMsg)}</div>` : '';

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
