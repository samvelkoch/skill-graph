const nf = (n) => String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, lang === 'en' ? ',' : ' ');

const dec = (x, d = 1) => { const s = x.toFixed(d); return lang === 'en' ? s : s.replace('.', ','); };
const trim = (s) => s.replace(/([.,]\d*?)0+$/, '$1').replace(/[.,]$/, '');
const KU = { en: 'k', ru: 'к', hu: 'e' };
const compact = (n) => { const a = Math.abs(n); return a >= 1e6 ? trim(dec(a / 1e6, 2)) + 'M' : a >= 1e5 ? Math.round(a / 1e3) + KU[lang] : a >= 1e3 ? trim(dec(a / 1e3, 1)) + KU[lang] : String(Math.round(a)); };
const csg = (n) => (n < 0 ? '−' : n > 0 ? '+' : '') + compact(n);
const pct = (x) => { const a = Math.abs(x * 100); return (x < 0 ? '−' : x > 0 ? '+' : '') + dec(a, a < 10 ? 1 : 0) + (lang === 'hu' ? '%' : ' %'); };
const niceStep = (x) => { const p = Math.pow(10, Math.floor(Math.log10(x))), m = x / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };
const hx = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => '#' + hx(a).map((v, i) => Math.round(v + (hx(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
const lg = (c, x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); };

// pill with 1-2 lines of text on a dark rounded plate, clamped inside the canvas
function pill(c, lines, cx, y, tone, maxW) {
  c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const pw = Math.max(...lines.map((s) => c.measureText(s).width)) + 16, ph = lines.length * 15 + 7;
  const x = clamp(cx - pw / 2, 4, Math.max(4, (maxW || CW) - pw - 4));
  c.fillStyle = 'rgba(10,13,24,.84)'; rr(c, x, y, pw, ph, Math.min(10, ph / 2)); c.fill();
  if (tone) { c.strokeStyle = tone; c.lineWidth = 1.5; c.stroke(); }
  lines.forEach((s, i) => { c.fillStyle = i ? '#c6cde0' : '#fff'; c.fillText(s, x + pw / 2, y + 11 + i * 15); });
  return ph;
}

function layout(w, h) {

  return { tubW, tubX, rh, Y, rimY, bh, botY: rimY + bh, winTop, winH, winBot: winTop + winH, spoutY: Y(0.215), top: y0,
    tapX: [tubX + tubW * 0.27, tubX + tubW * 0.73], drX: [tubX + tubW * 0.32, tubX + tubW * 0.68], gx: tubX + tubW + 14, groundY: Y(0.9) };
}
const wave = (x, time, y) => y + Math.sin(x * 0.07 + time * 2.3) * 2.2 + Math.sin(x * 0.15 - time * 1.6) * 1.2;

}
function stream(c, x, y1, y2, w, cols, time, dir) {

  c.save();
  c.fillStyle = lg(c, x - w / 2, 0, x + w / 2, 0, [[0, cols[0]], [0.5, cols[1]], [1, cols[0]]]);
  rr(c, x - w / 2, y1, w, y2 - y1, Math.min(w / 2, 6)); c.fill();

}
function foot(c, fx, G, side) {

// --- the main loop ---------------------------------------------------------------------------------------------
function placeAsk(w, h, show) {
  const v = lab.view, k = `${v}${w}${h}${S.step}${show}`;
  if (k === S.pk) return; S.pk = k;
  askEl.style.display = show ? 'flex' : 'none';
  if (v === 'why') Object.assign(askEl.style, { left: '8px', top: '8px', width: `${w - 16}px`, height: 'auto' });
  else { const G = layout(w, h).gr; Object.assign(askEl.style, { left: `${G.x}px`, top: `${G.y}px`, width: `${G.w}px`, height: `${G.h}px` }); }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; const v = lab.view, t = T[lang];
  if (v === 'why') { placeAsk(w, h, S.step === 'towns' && S.tAns === null); if (S.step === 'sort') drawSort(c, w, h, time); else drawTowns(c, w, h, dt, time); if (S.step === 'towns') townReadout(); return; }
  const L = layout(w, h), G = tubGeo(L.tub), k = Math.min(1, dt * 9), real = v === 'real';
  let f, ticks = [], cover = false, labs, tgt;
  if (!real) {
    if (S.run) {
      S.t += dt * 3; const end = S.sec === 'boom' ? Math.log(2) / Math.log(1 + gOf()) : 30;
      if (S.t >= end) { S.t = end; S.run = false; S.done = true; render(); }
    }
    S.top += ((S.pend ? 200000 : topFor()) - S.top) * Math.min(1, dt * 3);
    S.lvl += (popAt(S.t) / S.top - S.lvl) * Math.min(1, dt * 10); f = S.lvl;
    const st = niceStep(S.top / 4); for (let q = 0; q <= S.top; q += st) ticks.push({ f: q / S.top, label: q ? compact(q) : '0' });
    cover = S.pend; tgt = (kk) => (S.r[kk] ? Math.max(2.2, S.r[kk] * G.tubW * 0.0024) : 0);
    labs = { b: [`👶 ${t.k.b}`, `${S.r.b} ${t.per1}`], d: [t.k.d, `${S.r.d} ${t.per1}`], mi: [`✈️ ${t.k.mi}`, `${S.r.mi} ${t.per1}`], mo: [`🚪 ${t.k.mo}`, `${S.r.mo} ${t.per1}`] };
    if (S.run) tapsReadout();
  } else {
    const C = REAL[S.ri], nat = C.births - C.deaths, tot = nat + C.mig, half = 1.05 * Math.max(C.births, C.deaths, C.mig), mx = half / 1.05;
    S.rt += dt; if (S.rev) S.rrt += dt;
    const tf = S.rev ? (S.rrt > 0.9 ? tot : nat) : (S.rt > 0.5 ? nat : 0);
    S.lvl += (0.5 + tf / (2 * half) - S.lvl) * Math.min(1, dt * 4); f = S.lvl;
    ticks = [0.1, 0.5, 0.9].map((q) => ({ f: q, label: compact(C.pop + (q - 0.5) * 2 * half) }));
    const open = { b: S.rt > 0.2, d: S.rt > 0.2, mi: S.rev && S.rrt > 0.2, mo: false }, val = { b: C.births, d: C.deaths, mi: C.mig, mo: 0 };
    tgt = (kk) => (open[kk] ? Math.max(2.2, val[kk] / mx * G.tubW * 0.14) : 0);
    labs = { b: [`👶 ${t.k.b}`, nf(C.births)], d: [t.k.d, nf(C.deaths)], mi: [`✈️ ${t.k.mi}`, S.rev ? '+' + nf(C.mig) : '?'], mo: [`🚪 ${t.k.mo}`, '—'] };
  }
  for (const kk of ['b', 'd', 'mi', 'mo']) S.sw[kk] += (tgt(kk) - S.sw[kk]) * k;
  drawTub(c, G, time, { f, sw: S.sw, lab: labs });
  drawGauge(c, G, f, ticks, cover, time);
  placeAsk(w, h, real ? !S.rev : S.pend);
  if (real) drawBars(c, L.gr, t); else if (!S.pend) drawGraph(c, L.gr, t);
});

function resetTaps() {

}

  render();
});
$('ptSeg').addEventListener('click', (ev) => { const b = ev.target.closest('[data-step]'); if (!b) return; S.step = b.dataset.step; S.pk = ''; sfx.click(); render(); });
sortEl.addEventListener('click', (ev) => {
  const nx = ev.target.closest('.pt-next'); if (nx) { S.step = 'towns'; S.pk = ''; sfx.click(); return render(); }
  const b = ev.target.closest('.pt-bin'); if (!b || S.ci >= CARDS.length) return;
  const card = CARDS[S.ci];
  if (+b.dataset.side === card[2]) { S.sorted.push(card); S.ci++; S.msg = ''; sfx.good(); } else { S.msg = T[lang].wrongCard; S.wrongs++; sfx.bad(); }
  render();
});
$('ptTown').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-t]'); if (!b) return;
  if (b.dataset.t === 'reset') { S.pop = [1000, 1000]; S.walk = []; sfx.click(); return render(); }
  if (b.dataset.t === 'again') { S.ci = 0; S.sorted = []; S.msg = ''; sfx.click(); return render(); }
  if (S.tAns === null) return;
  S.tj[+b.dataset.t][+b.dataset.m] = +b.dataset.l; S.tVerdict = false; sfx.tick(); render();
});
$('ptSecs').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.sec; if (lab.view !== 'taps') { lab.view = 'taps'; lab.renderChrome(); }
  S.r = k === 'boom' ? { b: 40, d: 10, mi: 0, mo: 0 } : { b: 15, d: 15, mi: 0, mo: 20 };
  SL.forEach(([kk]) => { $('ptS' + kk).value = S.r[kk]; });
  S.sec = k; S.pend = false; S.keyOK = rk(); S.t = 0; S.run = true; S.done = false; S.pk = ''; sfx.click(); showStage(); render();
});

// --- readouts and the state card --------------------------------------------------------------------------------
function tapsReadout() {
  const t = T[lang], P = popAt(S.t);
  lab.setReadout(nf(S.pend || (S.t === 0 && !S.run && !S.done) ? P0 : P), S.t > 0 ? t.after(Math.floor(S.t)) : t.today, S.done ? verdictPill() : '', '#4ea8ff');
}
const verdictPill = () => (S.sec ? '' : classify(popAt(30) / P0 - 1) === S.pg ? T[lang].ok : T[lang].no);
function townReadout() { const t = T[lang]; lab.setReadout(S.tAns === null ? '?' : `${nf(S.pop[0])} · ${nf(S.pop[1])}`, S.tAns === null ? '' : `${t.town[0]} · ${t.town[1]}`, '', '#e0b050'); }
const ask = (q, o, ids, sel, note) => `<div class="pt-q">${esc(q)}</div><div class="pt-opts">${o.map((l, i) => `<button class="pt-opt${sel === ids[i] ? ' on' : ''}" data-a="${ids[i]}">${esc(l)}</button>`).join('')}</div>${note ? `<div class="pt-note">${esc(note)}</div>` : ''}`;

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v === 'why' ? 'w-' + S.step : v;
  $('ptTaps').style.display = v === 'taps' ? '' : 'none'; $('ptReal').style.display = v === 'real' ? '' : 'none'; $('ptWhy').style.display = v === 'why' ? '' : 'none';
  sortEl.style.display = v === 'why' && S.step === 'sort' ? '' : 'none';
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('ptSecs').innerHTML = sc('boom', '🍼') + sc('leave', '🚪');
  lab.setFacts(t.facts[v]);
  if (v === 'taps') renderTaps(t); else if (v === 'real') renderReal(t); else renderWhy(t);
}
function renderTaps(t) {
  lab.setGlow('rgba(60, 130, 220, .3)');
  const r = S.r, nat = r.b - r.d, mig = r.mi - r.mo, tot = nat + mig, show = !S.pend;
  SL.forEach(([k]) => { $('ptL' + k).textContent = t.k[k]; $('ptV' + k).textContent = `${r[k]} ${t.per}`; });
  const tile = (v) => `${sg(v)} ${t.per1} · ${sg(v * P0 / 1000)} ${t.ppl}`;
  $('ptRows').innerHTML = `<div class="pt-r"><span>${esc(t.nat)}</span><b>${esc(tile(nat))}</b></div><div class="pt-r"><span>${esc(t.mig)}</span><b>${esc(tile(mig))}</b></div>
    <div class="pt-r"><span>${esc(t.tot)}</span><b>${show ? esc(tile(tot)) : '?'}</b></div>`;
  $('ptRun').textContent = S.pend || !S.done ? t.run : t.again; $('ptRun').disabled = S.pend ? !S.guess : S.run;
  askEl.innerHTML = ask(t.ask.taps.q, t.ask.taps.o, ['grow', 'shrink', 'same'], S.guess, t.pick);
  tapsReadout();
  let st;
  if (S.sec && S.done) {
    if (S.sec === 'boom') { const y = Math.round(S.t), [ti, le] = t.boom(y); st = { emo: '🍼', title: ti, lead: le(nf(P0), nf(P0 * 2)), body: t.tBody(sg(nat), sg(mig), sg(tot)) }; }
    else { const pe = popAt(30), ch = pe / P0 - 1; st = { emo: '🚪', title: t.leave(pct(ch).replace('−', '')), lead: t.leaveLead(nf(pe), nf(P0 - pe)), body: t.tBody(sg(nat), sg(mig), sg(tot)) }; }
  } else if (S.done) {
    const ch = popAt(30) / P0 - 1, cl = classify(ch), good = cl === S.pg;
    st = { emo: good ? '✅' : '🤔', title: good ? t.ok : t.no, lead: t.tEnd(nf(popAt(30)), pct(ch), t.verb[cl]), body: t.tBody(sg(nat), sg(mig), sg(tot)), extra: good ? '' : esc(t.guess(t.gname[S.pg])) };
  } else if (S.run) st = { emo: '⏳', title: t.tRun[0], lead: t.tRun[1], body: '' };
  else st = { emo: '🛁', title: t.tIdle[0], lead: t.tIdle[1], body: t.tIdle[2], extra: esc(t.terms) };
  lab.setState(st);
}
function renderReal(t) {
  lab.setGlow('rgba(61, 220, 151, .22)');
  const C = REAL[S.ri], nat = C.births - C.deaths, tot = nat + C.mig, nm = t.cn[C.id];
  $('ptCh').innerHTML = REAL.map((q, i) => `<button class="chip ${i === S.ri ? 'on' : ''}" data-ri="${i}">${q.flag} ${esc(t.cn[q.id][0])} ${t.cn[q.id][1]}</button>`).join('');
  askEl.innerHTML = ask(t.ask.real.q, t.ask.real.o, ['grow', 'shrink'], S.rg);
  if (!S.rev) {
    lab.setReadout(sg(nat), t.nat, '', '#3ddc97');
    lab.setState({ emo: C.flag, title: `${nm[0]}, ${nm[1]}`, lead: t.rNat(nf(C.births), nf(C.deaths), sg(nat)), body: t.rNote, extra: esc(t.src[C.id]) });
  } else {
    const good = S.rg === (tot > 0 ? 'grow' : 'shrink');
    lab.setReadout(sg(tot), t.tot, good ? t.ok : t.no, '#3ddc97');
    const note = C.id === 'de' ? t.rDe : `${t.rHu}${sg(tot)} − (${sg(nat)}) = ${sg(C.mig)}`;
    lab.setState({ emo: good ? '✅' : '🤔', title: good ? t.ok : t.no, lead: `${nf(C.births)} − ${nf(C.deaths)} ${C.mig >= 0 ? '+' : '−'} ${nf(C.mig)} = ${sg(tot)}`, body: `${note} ${t.rZoom}`, extra: esc(t.src[C.id]) });
  }
}
function renderWhy(t) {
  lab.setGlow('rgba(224, 176, 80, .24)');
  $('ptSeg').innerHTML = ['sort', 'towns'].map((s, i) => `<button data-step="${s}" class="${S.step === s ? 'on' : ''}">${esc(t.steps[i])}</button>`).join('');
  if (S.step === 'sort') {
    const n = S.sorted.length, card = CARDS[S.ci];
    $('ptCard').className = 'pt-card' + (card ? '' : ' done');
    $('ptCard').innerHTML = card ? `<div class="e">${card[1]}</div><div class="t">${esc(t.cards[card[0]])}</div>` : `<div class="t">${esc(t.allDone[0])}</div><button class="btn pt-next">${esc(t.next)}</button>`;
    $('ptMsg').textContent = S.msg; $('ptMsg').style.top = card ? '104px' : '96px';
    sortEl.querySelectorAll('.pt-bin').forEach((b, i) => { b.firstElementChild.textContent = (i ? '➡ ' : '⬅ ') + t.bins[i]; b.lastElementChild.innerHTML = S.sorted.filter((q) => q[2] === i).map((q) => `<span>${q[1]}</span>`).join(''); });
    $('ptTown').innerHTML = `<button class="chip" data-t="again">${esc(t.again2)}</button>`;
    lab.setReadout(`${n}/${CARDS.length}`, t.sorted, '', '#e0b050');
    lab.setState(card ? { emo: '🧳', title: t.sortIdle[0], lead: t.sortIdle[1], body: t.sortIdle[2] } : { emo: '🎉', title: t.allDone[0], lead: t.allDone[1], body: '' });
  } else {
    askEl.innerHTML = ask(t.ask.why.q, t.ask.why.o, ['ab', 'ba', 'none'], null);
    const dis = S.tAns === null ? ' disabled' : '';
    $('ptTown').innerHTML = `<div class="pt-lv">${[0, 1].map((i) => [0, 1].map((m) => `<div class="l"><b style="background:${i ? '#e0b050' : '#6a9ac9'}">${i ? 'B' : 'A'}</b>${m ? '🛡️ ' + esc(t.safety) : '💼 ' + esc(t.jobs)}</div>
      <div class="chips">${(m ? t.sl : t.jl).map((l, q) => `<button class="chip ${S.tj[i][m] === q ? 'on' : ''}" data-t="${i}" data-m="${m}" data-l="${q}"${dis}>${esc(l)}</button>`).join('')}</div>`).join('')).join('')}</div>
      <div class="pt-act"><button class="chip" data-t="reset">${esc(t.reset)}</button></div>`;
    townReadout();
    const sA = S.tj[0][0] + S.tj[0][1], sB = S.tj[1][0] + S.tj[1][1], fl = t.flow[sB > sA ? 'ab' : sB < sA ? 'ba' : 'none'];
    if (S.tAns === null) lab.setState({ emo: '🏘️', title: t.wIdle[0], lead: t.wIdle[1], body: t.wIdle[2] });
    else if (S.tVerdict) { const good = S.tAns === 'ab'; lab.setState({ emo: good ? '✅' : '🤔', title: good ? t.ok : t.no, lead: t.flow.ab, body: '' }); }
    else lab.setState({ emo: '🚶', title: t.wIdle[0], lead: fl, body: '' });
  }
}
render();
</script>
