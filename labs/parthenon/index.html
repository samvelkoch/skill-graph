function pill(c, text, cx, cy, maxW, W, H, o = {}) {
  const fs = o.fs || 12.5;

  [[L, wt], [ir, wt]].forEach(([x, ww]) => { c.fillStyle = lg(c, x, 0, x + ww, 0, [[0, '#f6ebd0'], [1, '#d3bd96']]); c.fillRect(x, top, ww, floor - top);

  c.fillStyle = lg(c, 0, top, 0, ceil, [[0, '#fbf1da'], [1, '#d3bd96']]); c.fillRect(L, top, R - L, ceil - top);
  c.strokeStyle = 'rgba(120,90,50,.4)'; for (let x = ix; x < ir; x += iw / 8) { c.beginPath(); c.moveTo(x, top); c.lineTo(x, ceil); c.stroke(); }
  const full = (floor - ceil) * 0.84, hp = full / 7, cxS = w * 0.62, px = w * 0.3, bx = w * 0.42;
  const rv = S.ans >= 0 ? S.at : 0, curt = easeOut(rv / 1.0), gr = ease((rv - 0.7) / 1.8), hs = lerp(hp, full, gr);
  if (S.ans >= 0) {
    // statue on its base, the person, and a measuring bracket in grown-ups
    c.fillStyle = lg(c, cxS - 40, 0, cxS + 40, 0, [[0, '#e8d6b0'], [1, '#a68c63']]); c.fillRect(cxS - 0.12 * full - 6, floor - 8, 0.24 * full + 12, 8);
    drawAthena(c, cxS, floor - 8, hs, c01(gr + 0.3));
    drawPerson(c, px, floor, hp, { tunic: '#6ea7d8', hair: '#4a3020' });
    const n = Math.min(7, Math.floor(hs / hp + 0.02));
    c.strokeStyle = 'rgba(255,230,170,.7)'; c.lineWidth = 1.5; c.setLineDash([4, 3]);
    c.beginPath(); c.moveTo(bx, floor); c.lineTo(bx, floor - hs); c.stroke(); c.setLineDash([]);
    for (let k = 0; k <= n; k++) { c.beginPath(); c.moveTo(bx - 5, floor - k * hp); c.lineTo(bx + 5, floor - k * hp); c.stroke(); }
    for (let k = 1; k <= n; k++) { const yy = floor - (k - 0.5) * hp; c.fillStyle = 'rgba(14,12,20,.82)'; rr(c, bx + 7, yy - 9, 20, 18, 9); c.fill(); c.fillStyle = '#fff'; c.font = `800 12px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(k), bx + 17, yy + 0.5); }
    pill(c, T[lang].i.person, px, floor + h * 0.045, 90, w, h, { fs: 12 });
    if (gr > 0.98) pill(c, '≈ 12 m', cxS, floor - hs - 14, 90, w, h, { fs: 13 });
  }
  // the curtain: opaque until the child has answered, then it lifts
  const ch = (floor - ceil) * (1 - curt);
  if (ch > 1) {
    c.save(); c.beginPath(); c.rect(ix, ceil, iw, ch); c.clip();
    c.fillStyle = lg(c, ix, 0, ir, 0, [[0, '#4a171e'], [0.5, '#6e2530'], [1, '#4a171e']]); c.fillRect(ix, ceil, iw, floor - ceil);
    for (let x = ix; x < ir; x += 18) { c.fillStyle = `rgba(0,0,0,${0.12 + 0.1 * Math.sin(x * 0.5)})`; c.fillRect(x, ceil, 8, floor - ceil); c.fillStyle = 'rgba(255,200,200,.06)'; c.fillRect(x + 9, ceil, 4, floor - ceil); }
    c.restore();
    c.fillStyle = '#e0b04a'; c.fillRect(ix, ceil + ch - 5, iw, 5);
    for (let x = ix + 8; x < ir; x += 22) dot(c, x, ceil + ch + 3, 3.4, '#e0b04a');
    c.save(); c.beginPath(); c.rect(ix, ceil, iw, ch); c.clip();
    c.fillStyle = 'rgba(255,236,200,.92)'; c.font = `900 ${Math.min(iw * 0.4, 150)}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', (ix + ir) / 2, (ceil + floor) / 2); c.restore();
  }
}

// --- loop -------------------------------------------------------------------------------------------------------
function tick(dt) {
  if (!S.sec && lab.view === 'build' && S.phase === 'run') {
    S.bt += dt;
    if (S.bt >= DUR[S.bk] + 0.35) {
      S.bt = 0; S.bk++;
      if (S.bk >= 6) { S.phase = 'done'; S.bk = 5; const k = S.order.filter((id, i) => id === i).length; (k === 6 ? sfx.good : sfx.snap)(); }
      else sfx.snap();
      render();
    }
  }
  if (S.ans >= 0 && S.at < 4) S.at += dt;
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  tick(dt);
  if (S.sec === 'curve') drawCurve(c, w, h);
  else if (S.sec === 'paint') drawBuild(c, w, h, time, true);
  else if (lab.view === 'gods') drawGods(c, w, h, time);
  else if (lab.view === 'build') drawBuild(c, w, h, time, false);
  else drawInside(c, w, h, time);
});

// --- controls -------------------------------------------------------------------------------------------------
const ICON = [
  '<rect x="3" y="21" width="40" height="6" rx="1" fill="#e9d9b8"/><rect x="8" y="15" width="30" height="6" rx="1" fill="#f2e6cc"/><rect x="13" y="9" width="20" height="6" rx="1" fill="#fbf2de"/>',
  '<rect x="4" y="4" width="38" height="4" fill="#fbf2de"/><g fill="#eddcba" stroke="#b89f7a" stroke-width=".8"><rect x="7" y="8" width="6" height="18"/><rect x="16" y="8" width="6" height="18"/><rect x="25" y="8" width="6" height="18"/><rect x="34" y="8" width="6" height="18"/></g><rect x="3" y="26" width="40" height="3" fill="#e9d9b8"/>',
  '<rect x="3" y="10" width="40" height="10" rx="1.5" fill="#f2e6cc" stroke="#b89f7a" stroke-width=".8"/><path d="M3 15h40" stroke="#c9b389" stroke-width=".8"/>',
  '<rect x="3" y="8" width="40" height="16" rx="1.5" fill="#e9d9b8" stroke="#b89f7a" stroke-width=".8"/><g fill="#9c8561"><rect x="9" y="10" width="4" height="12"/><rect x="21" y="10" width="4" height="12"/><rect x="33" y="10" width="4" height="12"/></g><g fill="#b79f78"><circle cx="17" cy="14" r="2"/><circle cx="29" cy="14" r="2"/><path d="M15 17h4l-2 5zM27 17h4l-2 5z"/></g>',
  '<path d="M3 24L23 4l20 20z" fill="#f2e6cc" stroke="#b89f7a" stroke-width="1"/><path d="M11 22L23 10l12 12z" fill="#a68b66"/><rect x="3" y="24" width="40" height="3" fill="#e9d9b8"/>',
  '<circle cx="23" cy="8" r="4.5" fill="#f6ead0"/><path d="M15 28l4-17h8l4 17z" fill="#f0c24d" stroke="#a8741a" stroke-width="1"/><circle cx="12" cy="20" r="6" fill="#e3ad3a" stroke="#a8741a"/>',
];
$('ctrlBody').innerHTML = `
  <div id="paGods"><p class="pa-q" id="gQ"></p><div class="row2" style="margin-top:0"><button class="btn pa-btn" data-act="gmain" id="gMain"></button></div></div>
  <div id="paBuild"><p class="pa-q" id="bQ"></p><div class="pa-tiles" id="tiles"></div>
    <div class="row2"><button class="btn pa-btn" data-act="bmain" id="bMain"></button><button class="chip pa-chip" data-act="bundo" id="bUndo"></button><button class="chip pa-chip" data-act="breplay" id="bReplay"></button></div></div>
  <div id="paInside"><p class="pa-q" id="iQ"></p><div class="pa-opts" id="iOpts"></div></div>
  <div id="paCurve"><div class="pa-range"><span class="pa-l" id="cvL"></span><input class="big" id="curveR" type="range" min="0" max="20" step="1" style="--track:linear-gradient(90deg,#8a7a5a,#6ee7f2)"></div></div>
  <div id="paPaint"><div class="pa-range"><span class="pa-l" id="ptL"></span><input class="big" id="paintR" type="range" min="0" max="100" step="1" style="--track:linear-gradient(90deg,#f4ead2,#2d5db0,#bf4331,#e3b04a)"></div></div>
  <div class="row2" id="secChips"></div>`;

const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };

function resetGods() { S.sel = -1; S.pair = new Array(8).fill(-1); S.checked = false; }
function resetBuild() { S.order = []; S.phase = 'pick'; S.bk = 0; S.bt = 0; }

$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'gods') return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const hit = HIT.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
  if (!hit) return;
  if (hit.k === 'g') { S.sel = S.sel === hit.i && !S.checked ? -1 : hit.i; sfx.click(); }
  else if (!S.checked && S.sel >= 0) {
    S.pair = S.pair.map((p) => (p === hit.i ? -1 : p)); S.pair[S.sel] = hit.i; sfx.snap();
    const nx = [1, 2, 3, 4, 5, 6, 7, 8].map((k) => (S.sel + k) % 8).find((g) => S.pair[g] < 0);
    S.sel = nx === undefined ? -1 : nx;
  } else { sfx.tick(); return; }
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-tile], [data-opt]'); if (!b) return;
  if (b.dataset.tile !== undefined) {
    if (S.phase !== 'pick') return;
    const id = +b.dataset.tile, at = S.order.indexOf(id);
    if (at >= 0) S.order.splice(at, 1); else S.order.push(id);
    sfx.click(); render(); return;
  }
  if (b.dataset.opt !== undefined) {
    if (S.ans >= 0) return;
    S.ans = +b.dataset.opt; S.at = 0; (S.ans === T[lang].i.ok ? sfx.good : sfx.bad)(); showStage(); render(); return;
  }
  const a = b.dataset.act;
  if (a === 'gmain') {
    if (S.checked) { resetGods(); sfx.click(); }
    else if (S.pair.every((p) => p >= 0)) { S.checked = true; S.sel = -1; (S.pair.every((p, g) => p === g) ? sfx.good : sfx.snap)(); showStage(); }
  } else if (a === 'bmain') {
    if (S.phase === 'pick' && S.order.length === 6) { S.phase = 'run'; S.bk = 0; S.bt = 0; sfx.click(); showStage(); }
    else if (S.phase === 'done') { resetBuild(); sfx.click(); }
  } else if (a === 'bundo') { S.order.pop(); sfx.tick(); }
  else if (a === 'breplay') { S.phase = 'run'; S.bk = 0; S.bt = 0; sfx.click(); showStage(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; sfx.click(); if (S.sec) showStage();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'curveR') S.curve = +ev.target.value;
  if (ev.target.id === 'paintR') S.paint = +ev.target.value;
  render();
});

// --- one render per change: controls, readout and the state card ---------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec || v;
  const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
  show('paGods', !sec && v === 'gods'); show('paBuild', !sec && v === 'build'); show('paInside', !sec && v === 'inside'); show('paCurve', sec === 'curve'); show('paPaint', sec === 'paint');
  const open = secret.unlocked();
  $('secChips').innerHTML = [['curve', '📐'], ['paint', '🎨']].map(([k, emo]) =>
    `<button class="chip pa-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec === 'curve') return renderCurve(t);
  if (sec === 'paint') return renderPaint(t);
  if (v === 'gods') renderGods(t); else if (v === 'build') renderBuild(t); else renderInside(t);
}
function renderCurve(t) {
  const k = S.curve, q = t.cv;
  $('cvL').textContent = q.label; $('curveR').value = String(k);
  lab.setGlow('rgba(110, 231, 242, .25)');
  lab.setReadout(`×${k}`, q.sub, q.pill, '#6ee7f2');
  lab.setState({ emo: '📐', title: q.t, lead: q.l, body: q.b, extra: '' });
  lab.setFacts([]);
}
function renderPaint(t) {
  const p = S.paint, q = t.pt;
  $('ptL').textContent = q.label; $('paintR').value = String(p);
  lab.setGlow('rgba(227, 176, 74, .25)');
  lab.setReadout(`${p}%`, q.sub, q.pill, '#e3b04a');
  lab.setState({ emo: '🎨', title: q.t, lead: q.l, body: q.b, extra: '' });
  lab.setFacts([]);
}
function renderGods(t) {
  const g = t.g, n = S.pair.filter((p) => p >= 0).length, all = n === 8, right = S.pair.filter((p, i) => p === i).length;
  lab.setGlow('rgba(240, 180, 90, .25)');
  $('gQ').textContent = g.q;
  $('gMain').textContent = S.checked ? g.again : g.check; $('gMain').disabled = !S.checked && !all;
  lab.setReadout(S.checked ? `${right}/8` : `${n}/8`, S.checked ? g.subRight : g.sub, '', '#f0b45a');
  const sel = S.sel;
  if (S.checked) {
    if (sel >= 0) lab.setState({ emo: '⚡', title: g.names[sel], lead: g.jobs[sel], body: g.symIs(g.syms[sel]), extra: '' });
    else lab.setState({ emo: right === 8 ? '🏆' : '🏛️', title: g.doneT(right), lead: g.doneL, body: g.doneB, extra: '' });
  } else if (sel >= 0) lab.setState({ emo: '👆', title: g.names[sel], lead: S.pair[sel] >= 0 ? g.selL2 : g.selL, body: '', extra: '' });
  else if (all) lab.setState({ emo: '👍', title: g.readyT, lead: g.readyL, body: '', extra: '' });
  else lab.setState({ emo: '⚡', title: g.idleT, lead: g.idleL, body: g.idleB, extra: '' });
  lab.setFacts([{ emo: '🏺', text: t.f.rome, src: SRC_R }]);
}
function tileSvg(id) { return `<svg viewBox="0 0 46 32" aria-hidden="true">${ICON[id]}</svg>`; }
function renderBuild(t) {
  const b = t.b, picked = S.order.length, pick = S.phase === 'pick', done = S.phase === 'done';
  lab.setGlow('rgba(225, 170, 110, .25)');
  $('bQ').textContent = b.q;
  $('tiles').innerHTML = TILEORD.map((id) => {
    const at = S.order.indexOf(id), cls = done && at >= 0 ? (at === id ? 'ok' : 'no') : at >= 0 ? 'on' : '';
    return `<button class="pa-tile ${cls}" data-tile="${id}"${pick ? '' : ' disabled'}>${at >= 0 ? `<span class="pa-n">${at + 1}</span>` : ''}${tileSvg(id)}<span>${esc(b.steps[id])}</span></button>`;
  }).join('');
  $('bMain').style.display = pick || done ? '' : 'none';
  $('bMain').textContent = done ? b.again : b.go; $('bMain').disabled = pick && picked < 6;
  $('bUndo').style.display = pick && picked > 0 ? '' : 'none'; $('bUndo').textContent = b.undo;
  $('bReplay').style.display = done ? '' : 'none'; $('bReplay').textContent = b.replay;
  const colsDone = S.phase === 'done' || (S.phase === 'run' && S.bk >= 2);
  if (pick) {
    lab.setReadout(`${picked}/6`, b.picked, '', '#e1aa6e');
    lab.setState({ emo: '🏗️', title: b.idleT, lead: b.idleL, body: b.idleB, extra: '' });
    lab.setFacts([{ emo: '📜', text: t.f.dates, src: SRC_P }]);
    return;
  }
  const k = done ? 6 : S.bk;
  lab.setReadout(colsDone ? '46' : `${k}/6`, colsDone ? b.colsSub : b.built, done ? '' : b.steps[S.bk], '#e1aa6e');
  if (done) {
    const good = S.order.filter((id, i) => id === i).length;
    lab.setState({ emo: good === 6 ? '🏆' : '🏛️', title: good === 6 ? b.doneAll : b.doneSome(good), lead: b.doneL, body: b.doneB, extra: '' });
  } else lab.setState({ emo: '🏗️', title: b.runT[S.bk], lead: b.runL[S.bk], body: '', extra: '' });
  lab.setFacts([{ emo: '📜', text: t.f.dates, src: SRC_P }]);
}
function renderInside(t) {
  const q = t.i, a = S.ans;
  lab.setGlow('rgba(255, 200, 120, .25)');
  $('iQ').textContent = q.q;
  $('iOpts').innerHTML = q.opts.map((o, j) => `<button class="pa-opt ${a >= 0 ? (j === q.ok ? 'ok' : j === a ? 'no' : '') : ''}" data-opt="${j}"${a >= 0 ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  if (a < 0) {
    lab.setReadout('?', q.valSub, '', '#ffc878');
    lab.setState({ emo: '🔦', title: q.idleT, lead: q.idleL, body: q.idleB, extra: '' });
    lab.setFacts([{ emo: '💥', text: t.f.boom, src: SRC_P }]);
  } else {
    lab.setReadout('≈ 12 m', q.valSubDone, '', '#ffc878');
    lab.setState({ emo: a === q.ok ? '🏆' : '🗿', title: a === q.ok ? q.right : q.wrong, lead: q.lead, body: q.body, extra: '' });
    lab.setFacts([{ emo: '💥', text: t.f.boom, src: SRC_P }, { emo: '🏛️', text: t.f.nash, src: SRC_N }]);
  }
}
render();
</script>
