// --- the model: UK Highway Code values (reaction 0.67 s, braking 6.6 m/s² on a dry road) ---------------------
const CAR = 4.5, RT = 0.67, DEC = 6.6, PBALL = 18; // metres; PBALL = where the ball rolls out, ahead of the point where the driver sees it
const SPEEDS = [20, 30, 40, 50, 60];

const half = (n) => Math.round(n * 2) / 2;
const plan = (kmh, rt = RT, mult = 1) => {
  const v = kmh / 3.6, think = v * rt, brake = (v * v) / (2 * DEC) * mult, total = think + brake;
  return { kmh, v, think, brake, total, cl: half(total / CAR) };
};
const fmtCL = (n) => (n < 1 ? '½' : `${Math.floor(n)}${n % 1 ? '½' : ''}`);

  if (night) {
    for (let i = 0; i < 22; i++) { c.fillStyle = `rgba(255,255,255,${.35 + hash(i) * .5})`; circ(c, hash(i + 40) * w, hash(i + 80) * yFar * .55, .8 + hash(i + 3)); c.fill(); }
    c.fillStyle = rg(c, w * .84, h * .11, 2, w * .84, h * .11, 46, [[0, 'rgba(255,245,200,.45)'], [1, 'rgba(255,245,200,0)']]); circ(c, w * .84, h * .11, 46); c.fill();
    c.fillStyle = rg(c, w * .84 - 4, h * .11 - 4, 1, w * .84, h * .11, 15, [[0, '#fffbe8'], [1, '#e8dca8']]); circ(c, w * .84, h * .11, 14); c.fill();
  } else {
    c.fillStyle = rg(c, w * .14, h * .09, 4, w * .14, h * .09, 80, [[0, 'rgba(255,240,170,.9)'], [1, 'rgba(255,240,170,0)']]); circ(c, w * .14, h * .09, 80); c.fill();
    c.fillStyle = '#fff6c8'; circ(c, w * .14, h * .09, 15); c.fill();
    c.fillStyle = 'rgba(255,255,255,.75)';
    for (let i = -1; i < 4; i++) { const cx = ((i * 210 - K.x * ppm * .08) % (w + 230) + w + 230) % (w + 230) - 60, cy = h * (.07 + hash(i + 9) * .1); ell(c, cx, cy, 34, 9); c.fill(); ell(c, cx + 16, cy - 6, 20, 9); c.fill(); }
  }
  houses(c, w, h, night, K.x * ppm * .25, yFar + 2);
  // far kerb, road
  c.fillStyle = night ? '#2e3552' : '#c3c9d6'; c.fillRect(0, yFar, w, yRT - yFar);
  c.fillStyle = night ? '#454d70' : '#e1e5ee'; c.fillRect(0, yFar, w, 3);
  c.fillStyle = night ? lg(c, 0, yRT, 0, yRB, [[0, '#171b2b'], [1, '#262b3f']]) : lg(c, 0, yRT, 0, yRB, [[0, '#3f4455'], [1, '#5a6074']]); c.fillRect(0, yRT, w, yRB - yRT);
  c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(0, yRT, w, 2);
  let pm = 5; while (pm * ppm < 30) pm *= 2;
  c.fillStyle = night ? 'rgba(220,225,245,.55)' : 'rgba(240,243,250,.8)';
  for (let i = Math.floor((K.x - w / 2 / ppm) / pm) - 1; i < Math.ceil((K.x + w / 2 / ppm) / pm) + 1; i++) { rr(c, sx(i * pm), yLane - 2, pm * .5 * ppm, 4, 2); c.fill(); }
  // near kerb
  c.fillStyle = night ? lg(c, 0, yRB, 0, yRB + h * .1, [[0, '#3c4464'], [1, '#2a3050']]) : lg(c, 0, yRB, 0, yRB + h * .1, [[0, '#dfe3ec'], [1, '#bcc3d2']]); c.fillRect(0, yRB, w, h * .12);
  c.fillStyle = night ? '#566086' : '#f3f5fa'; c.fillRect(0, yRB, w, 3);
  c.fillStyle = night ? '#171c34' : '#8f98ad'; c.fillRect(0, yRB + h * .12, w, h - yRB - h * .12);
  c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(0, yRB + 3, w, 3);

  // paint: yellow while the driver reacts, red while the brakes work
  const thinkEnd = R.xt + R.p.think, py = gy - 3, ph = h * .06;
  if (front > R.xt) {
    const x0 = sx(R.xt), x1 = sx(Math.min(front, thinkEnd));
    c.fillStyle = lg(c, 0, py, 0, py + ph, [[0, '#ffe680'], [1, '#f0b400']]); rr(c, x0, py, Math.max(0, x1 - x0), ph, 3); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x0, py, Math.max(0, x1 - x0), 2);
  }
  if (front > thinkEnd) {
    const x0 = sx(thinkEnd), x1 = sx(front);
    c.fillStyle = lg(c, 0, py, 0, py + ph, [[0, '#ff7a6b'], [1, '#d62f2a']]); rr(c, x0, py, Math.max(0, x1 - x0), ph, 3); c.fill();
    c.fillStyle = 'rgba(70,0,0,.55)'; c.fillRect(x0, py + ph * .24, Math.max(0, x1 - x0), 2.5); c.fillRect(x0, py + ph * .66, Math.max(0, x1 - x0), 2.5);
  }
  if (front >= R.xt && R.go) { // the spot where the driver sees the danger
    c.strokeStyle = night ? 'rgba(255,224,130,.8)' : 'rgba(255,255,255,.75)'; c.lineWidth = 2; c.setLineDash([5, 5]);
    c.beginPath(); c.moveTo(sx(R.xt), yRT); c.lineTo(sx(R.xt), yRB + 6); c.stroke(); c.setLineDash([]);
  }
  // headlight beam
  const b = R.go ? 1 : 0, fx = sx(front);
  if (night) {
    const bl = Math.max(36 * ppm, 70), hy = gy - .2 * Lp;
    c.fillStyle = lg(c, fx, 0, fx + bl, 0, [[0, 'rgba(255,240,180,.55)'], [1, 'rgba(255,240,180,0)']]);
    c.beginPath(); c.moveTo(fx - 2, hy); c.lineTo(fx + bl, yRT + 2); c.lineTo(fx + bl, yRB + 4); c.closePath(); c.fill();
  }
  // car
  const tB = R.ta + R.tr, u = clamp01((R.t - tB) / R.tb), braking = R.go && R.t >= tB && !R.done;
  const dive = braking ? clamp01((R.t - tB) / .18) * (1 - u) : R.done ? 0 : 0;
  const alert = R.go && R.t >= R.ta, phone = S.sec === 'a';
  drawCar(c, fx, gy, Lp, { dive, spin: R.spin, braking, alert: alert && !phone || (phone && R.t >= R.ta + R.tr * .5), phone: phone && R.t < R.ta + R.tr * .5 + .01, eyesDown: phone && !alert });
  // tyre smoke
  S.parts.forEach((q) => {
    const a = 1 - q.age / 1.1, X = sx(q.x), Y = gy - 2 - q.age * 14 - q.dy;
    c.fillStyle = `rgba(225,228,238,${.4 * a})`; circ(c, X, Y, (q.r + q.age * 7) * Math.max(.6, Lp / 100)); c.fill();
  });
  // the ball (day) or the child (night)
  const since = R.t - R.ta;
  if (!night && R.go && since >= 0) {
    const d = clamp01(since / 1.7), e = easeOut(d), bx = sx(R.xt + PBALL);
    const by = lerp(yFar + h * .03, yKB, e) - Math.abs(Math.sin(d * Math.PI * 4)) * (1 - d) * h * .05 * (d > .02 ? 1 : 0), br = h * lerp(.022, .036, e);
    drawBall(c, bx, by, br, d * 9);
  }
  if (night) {
    const cx0 = sx(0), seen = R.go && R.t >= R.ta, k = seen ? easeOut(clamp01((R.t - R.ta) / .45)) : 0;
    const kh = clamp(ppm * 3.4, 38, 54), halo = { dark: .3, bright: .65, refl: .95 }[S.cloth];
    if (k > 0) { c.fillStyle = rg(c, cx0, yKB - kh * .5, 2, cx0, yKB - kh * .5, kh * 1.7, [[0, `rgba(255,236,160,${halo * k})`], [1, 'rgba(255,236,160,0)']]); circ(c, cx0, yKB - kh * .5, kh * 1.7); c.fill(); }
    drawKid(c, cx0, yKB, kh, S.cloth, lerp(.2, 1, k));
    if (k > 0 && S.cloth === 'refl') { // a sparkle on the reflector
      const sp = (1 + Math.sin(time * 6)) / 2; c.save(); c.translate(cx0 + kh * .18, yKB - kh * .23); c.rotate(time);
      c.fillStyle = `rgba(255,255,255,${.5 + .5 * sp})`; for (let i = 0; i < 2; i++) { c.rotate(Math.PI / 2); rr(c, -9 - 3 * sp, -1.2, 18 + 6 * sp, 2.4, 1.2); c.fill(); } c.restore();
    }
  }
  // posts every car length (every few when they would crowd), numbered from the point where the driver saw the danger
  if (R.go) {
    let step = 1; for (const q of [1, 2, 5, 10, 20, 50]) { step = q; if (q * K.pp >= 34) break; }
    const lim = R.done ? R.xt + total + CAR * 1.2 : front;
    for (let n = step; R.xt + n * CAR <= lim; n += step) {
      const px = sx(R.xt + n * CAR); if (px < -20 || px > w + 20) continue;
      const pop = R.done ? 1 : clamp01((front - (R.xt + n * CAR) + .5) / 1.5), sc = easeBack(pop);
      c.save(); c.translate(px, yKB + h * .04); c.scale(sc, sc);
      c.fillStyle = 'rgba(0,0,0,.3)'; ell(c, 0, 1, 6, 2); c.fill();
      c.fillStyle = lg(c, -4, 0, 4, 0, [[0, '#ffffff'], [1, '#c4cadb']]); rr(c, -3.6, -22, 7.2, 22, 3); c.fill(); c.strokeStyle = '#7d869c'; c.lineWidth = 1; c.stroke();
      c.fillStyle = '#e8453c'; rr(c, -3.6, -22, 7.2, 5, 2.5); c.fill();
      c.font = '800 12px Nunito, system-ui, sans-serif'; const tw = c.measureText(String(n)).width + 10;
      rr(c, -tw / 2, -42, tw, 17, 8); c.fillStyle = 'rgba(10,13,24,.82)'; c.fill(); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(n), 0, -33); c.restore();
    }
  }
  // the "!" over the driver
  if (R.go && alert) {
    const dur = R.ta + R.tr + .9, life = R.t - R.ta;
    if (R.t < dur) {
      const sc = easeBack(clamp01(life / .3)) * (R.t > dur - .2 ? (dur - R.t) / .2 : 1), s = Lp / 100, bx = fx - Lp + 62 * s, byy = gy - 50 * s - 16;
      c.save(); c.translate(bx, byy); c.scale(sc, sc);
      c.fillStyle = rg(c, -3, -4, 1, 0, 0, 13, [[0, '#fff0a0'], [1, '#ffc928']]); circ(c, 0, 0, 12); c.fill(); c.strokeStyle = '#9a6e00'; c.lineWidth = 1.5; c.stroke();
      c.fillStyle = '#7a1d00'; c.font = '900 17px Nunito, system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('!', 0, 1); c.restore();
    }
  }
  // the result: a bracket over the road (yellow + red, then the room left in green at night) and a label
  if (R.done) {
    const ya = h * .468, x0 = sx(R.xt), x1 = sx(R.xt + total), xm = sx(thinkEnd);
    const seg = (a, bb, col) => { c.strokeStyle = 'rgba(10,13,24,.8)'; c.lineWidth = 8; c.lineCap = 'round'; c.beginPath(); c.moveTo(a, ya); c.lineTo(bb, ya); c.stroke(); c.strokeStyle = col; c.lineWidth = 5; c.beginPath(); c.moveTo(a, ya); c.lineTo(bb, ya); c.stroke(); };
    seg(x0, xm, '#ffd23f'); seg(xm, x1, '#ff4d4d'); if (night) seg(x1, sx(0), '#3ddc97'); c.lineCap = 'butt';
    const pa = clamp01((R.t - R.ta - R.tr - R.tb) * 3), lines = [{ t: clTxt(R.p.cl), s: 15, b: 1 }, { t: `${Math.round(total)} ${T[lang].m}`, s: 12, col: '#c9d0e6' }];
    c.save(); c.globalAlpha = pa; pill(c, w, lines, (x0 + x1) / 2, h * .36);
    if (night) { const sn = T[lang].seen(R.see); pill(c, w, [{ t: sn[0], s: 12, b: 1 }, { t: sn[1], s: 12, col: '#ffe29a' }], x0, h * .15); }
    c.restore();
  }
  if (S.fade > 0) { c.fillStyle = `rgba(10,12,20,${S.fade})`; c.fillRect(0, 0, w, h); S.fade = Math.max(0, S.fade - dt * 3.2); }
}

// --- html side: chips, question, table, rule card, readout, state card --------------------------------------------
const bar = (think, brake, gap, max) => {
  const pc = (m) => (clamp(m / max, 0, 1) * 100).toFixed(1);
  return `<div class="sd-bar"><i class="y" style="width:${pc(think)}%"></i><i class="r" style="width:${pc(brake)}%"></i>${gap > 0 ? `<i class="g" style="width:${pc(gap)}%"></i>` : ''}</div>`;
};
const trow = (lbl, b, num) => `<div class="sd-tr"><span class="sd-tl">${lbl}</span>${b}<b class="sd-tn">${num}</b></div>`;
const thead = (a) => `<div class="sd-th"><span>${esc(a[0])}</span><span>${esc(a[1])}</span></div>`;
function tableHTML(t, v) {
  if (S.sec === 'a') {
    const rows = [[t.phone[0], plan(50)], [t.phone[1], plan(50, 1.5)]], mx = rows[1][1].total;
    return rows.map(([l, p]) => trow(`${esc(l)}<br><small style="color:var(--mut)">${p.kmh} ${t.kmh} · ${p === rows[1][1] ? 1.5 : RT} ${t.s}</small>`, bar(p.think, p.brake, 0, mx), fmtCL(p.cl))).join('');
  }
  if (S.sec) return '';
  if (v === 'stop') {
    const ks = Object.keys(S.rec.stop).map(Number).sort((a, b) => a - b); if (!ks.length) return '';
    return thead(t.head.stop) + ks.map((k) => { const p = S.rec.stop[k]; return trow(`${k} ${t.kmh}`, bar(p.think, p.brake, 0, plan(60).total), fmtCL(p.cl)); }).join('');
  }
  if (v === 'road') {
    const ks = ['dry', 'wet', 'ice'].filter((k) => S.rec.road[k]); if (!ks.length) return '';
    return thead(t.head.road) + ks.map((k) => { const p = S.rec.road[k]; return trow(esc(t.surf[k]), bar(p.think, p.brake, 0, plan(40, RT, 10).total), fmtCL(p.cl)); }).join('');
  }
  const ks = ['dark', 'bright', 'refl'].filter((k) => S.rec.night[k]); if (!ks.length) return '';
  return thead(t.head.night) + ks.map((k) => { const p = S.rec.night[k]; return trow(esc(t.cloth[k]), bar(p.think, p.brake, p.see - p.total, SEE.refl), `≈${p.see} ${t.m}`); }).join('');
}
const chipH = (act, k, label, on, dis) => `<button class="sd-chip${on ? ' on' : ''}" data-act="${act}" data-k="${k}"${dis ? ' disabled' : ''}>${esc(label)}</button>`;

function render() {
  const t = T[lang], v = lab.view, sec = S.sec, R = S.run, run = S.phase === 'run', done = S.phase === 'done';
  document.body.dataset.v = v;
  // chips
  let chips = '';
  if (!sec) {
    if (v === 'stop') chips = SPEEDS.map((k) => chipH('speed', k, k, S.kmh === k, run)).join('') + `<span class="sd-unit">${esc(t.kmh)}</span>`;
    else if (v === 'road') chips = ['dry', 'wet', 'ice'].map((k) => chipH('surf', k, t.surf[k], S.surf === k, run || (k !== 'dry' && !S.rec.road.dry))).join('');
    else chips = ['dark', 'bright', 'refl'].map((k) => chipH('cloth', k, t.cloth[k], S.cloth === k, run || (k === 'refl' && !S.rec.night.dark))).join('');
  }
  $('sdChips').innerHTML = chips;
  // question
  const q = S.q;
  if (q) {
    const opts = q.key === 'stop' ? q.vals.map(clTxt) : q.key === 'night' ? t.nightOpts : t.roadOpts;
    $('sdQBox').innerHTML = `<div class="sd-q">${esc(t.q[q.key])}</div><div class="sd-opts">${opts.map((o, i) =>
      `<button class="sd-opt${done && i === q.ok ? ' good' : done && i === S.guess ? ' bad' : ''}" data-act="ans" data-k="${i}"${S.phase === 'ask' ? '' : ' disabled'}>${esc(o)}</button>`).join('')}</div>`;
  } else $('sdQBox').innerHTML = '';
  $('sdGo').textContent = t.go; $('sdGo').hidden = S.phase === 'ask'; $('sdGo').disabled = run;
  const nStop = Object.keys(S.rec.stop).length;
  $('sdRuleB').textContent = t.showRule; $('sdRuleB').hidden = !(v === 'stop' && !sec && nStop >= 3); $('sdRuleB').classList.toggle('on', S.ruleOpen);
  $('sdLeg').innerHTML = `<span><i class="y"></i>${esc(t.leg[0])}</span><span><i class="r"></i>${esc(t.leg[1])}</span>`;
  $('sdTab').innerHTML = tableHTML(t, v);
  const open = secret.unlocked();
  $('sdSec').innerHTML = [['a', '📱'], ['b', '🧊']].map(([k, emo]) =>
    `<button class="sd-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  // rule card
  const showRule = S.ruleOpen && !sec && v === 'stop';
  ruleEl.style.display = showRule ? '' : 'none';
  if (showRule) {
    const a = plan(30), b = plan(60);
    ruleEl.innerHTML = `<button class="sd-x" type="button" aria-label="×">×</button><h3>${esc(t.ruleTitle)}</h3><p>${esc(t.rule)}</p><div class="sd-tab">${[a, b].map((p) =>
      trow(`${p.kmh} ${t.kmh}`, bar(p.think, p.brake, 0, b.total), `${Math.round(p.think)} + ${Math.round(p.brake)} ${t.m}`)).join('')}</div>`;
  }
  // readout and state card
  const col = S.verdict === 'ok' ? '#2fbf84' : S.verdict === 'no' ? '#e59a1f' : '#4ea8ff';
  const pillTxt = S.verdict === 'ok' ? t.ok : S.verdict === 'no' ? t.no : '';
  if (done && R) {
    const p = R.p;
    if (R.kind === 'night') { const gap = R.see - p.total, gcl = half(gap / CAR); lab.setReadout(fmtCL(gcl), t.subRoom(unitOf(gcl), Math.round(gap)), pillTxt, col); }
    else lab.setReadout(fmtCL(p.cl), t.sub(unitOf(p.cl), Math.round(p.total)), pillTxt, col);
  } else {
    const sp = curSpec(), name = sec === 'a' ? '📱' : sec === 'b' ? t.surf.ice : v === 'road' ? t.surf[S.surf] : v === 'night' ? t.cloth[S.cloth] : '';
    lab.setReadout(`${sp.p.kmh} ${esc(t.kmh)}${name ? ` · ${esc(name)}` : ''}`, '', '', col);
  }
  if (sec) lab.setState({ emo: sec === 'a' ? '📱' : '🧊', title: t.secrets[sec][0], lead: t.secrets[sec][1], body: '' });
  else lab.setState({ emo: { stop: '🚗', road: '🌧️', night: '🌙' }[v], title: t.views[v], lead: t.state[v][0], body: t.state[v][1] });
  lab.setFacts(t.facts[v]);
}

// --- input -------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (S.phase === 'run' && a !== 'rule') return;
  if (a === 'speed') { S.kmh = +k; S.ruleOpen = false; sfx.tick(); prep(); }
  else if (a === 'surf') { S.surf = k; S.ruleOpen = false; sfx.tick(); prep(); }
  else if (a === 'cloth') { S.cloth = k; S.ruleOpen = false; sfx.tick(); prep(); }
  else if (a === 'go') go();
  else if (a === 'ans') go(+k);
  else if (a === 'rule') { S.ruleOpen = !S.ruleOpen; sfx.click(); render(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.ruleOpen = false; sfx.click(); prep();
  }
});
ruleEl.addEventListener('click', () => { S.ruleOpen = false; sfx.click(); render(); });

canvasLoop($('cv'), (c, w, h, dt, time) => { update(dt); scene(c, w, h, dt, time); });
prep();
</script>
</body>
</html>
