function decode(s, k) {

}

  c.beginPath(); c.rect(-18.75, -18.5, W * ps, H * ps); c.clip();
  c.translate(-W * ps / 2, -H * ps / 2); c.scale(ps, ps);
  c.fillStyle = '#b7c9cc'; c.fillRect(0, 0, W, H);

  c.restore();
  // chairs and delegations
  const ans = S.pick.berlin !== null, since = now() - S.enterT;
  for (let i = 0; i < 14; i++) {

// secret A: borders drawn with a ruler

  c.translate(ox, oy); c.scale(s, s);
  const p = eOut((now() - S.secT) / 1.4);
  // dunes
  const dune = (y0, amp, col, ph) => { c.fillStyle = col; c.beginPath(); c.moveTo(-300, 500); for (let x = -300; x <= 700; x += 20) c.lineTo(x, y0 + Math.sin(x / 60 + ph) * amp); c.lineTo(700, 500); c.closePath(); c.fill(); };
  dune(300, 14, 'rgba(200,160,95,.45)', 0.5); dune(340, 10, 'rgba(180,140,80,.5)', 2); dune(60, 8, 'rgba(255,240,200,.25)', 4);
  // two lands tinted by two rulers, split by a straight line

  c.fillStyle = 'rgba(192,57,43,.17)'; c.beginPath(); [B(-2), B(2), [-1000, B(2)[1]], [-1000, B(-2)[1]]].forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.fill();
  c.fillStyle = 'rgba(46,134,193,.17)'; c.beginPath(); [B(-2), B(2), [1500, B(2)[1]], [1500, B(-2)[1]]].forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.fill();

  const [x0, y0] = B(0), [x1, y1] = B(1), ang = Math.atan2(y1 - y0, x1 - x0), len = Math.hypot(x1 - x0, y1 - y0);
  c.strokeStyle = '#5a3d1c'; c.lineWidth = 2.4; c.setLineDash([9, 6]); c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0 + (x1 - x0) * p, y0 + (y1 - y0) * p); c.stroke(); c.setLineDash([]);
  // huts: one people, villages on both sides
  const hut = (x, y, k) => {
    c.save(); c.translate(x, y); c.scale(k, k);
    c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(2, 11, 15, 5, 0, 0, 7); c.fill();
    const bd = c.createLinearGradient(-11, 0, 11, 0); bd.addColorStop(0, '#e3b27a'); bd.addColorStop(1, '#9c6238');
    c.fillStyle = bd; c.strokeStyle = '#4a2c14'; c.lineWidth = 1.4; rr(c, -11, -3, 22, 14, 5); c.fill(); c.stroke();
    const rf = c.createLinearGradient(-14, -16, 12, 0); rf.addColorStop(0, '#e8c36a'); rf.addColorStop(1, '#9a7324');
    c.fillStyle = rf; c.beginPath(); c.moveTo(-14, -2); c.lineTo(0, -17); c.lineTo(14, -2); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#3a2210'; c.beginPath(); c.moveTo(-3, 11); c.lineTo(-3, 5); c.quadraticCurveTo(0, 1, 3, 5); c.lineTo(3, 11); c.closePath(); c.fill();
    c.restore();
  };
  const L = [[118, 135, 1], [96, 182, 0.9], [132, 222, 1]], Rr = [[218, 168, 1], [236, 214, 0.9], [252, 268, 1]];
  L.forEach(([x, y, k], i) => { c.globalAlpha = eOut((now() - S.secT - 0.5 - i * 0.12) / 0.4); hut(x, y, k); });
  Rr.forEach(([x, y, k], i) => { c.globalAlpha = eOut((now() - S.secT - 0.7 - i * 0.12) / 0.4); hut(x, y, k); });
  c.globalAlpha = eOut((now() - S.secT - 1.2) / 0.6);
  c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 2; c.setLineDash([2, 5]); c.lineCap = 'round';
  [[132, 222, 252, 268], [118, 135, 218, 168]].forEach(([a, b, d2, e2]) => { c.beginPath(); c.moveTo(a + 8, b - 4); c.quadraticCurveTo((a + d2) / 2 + 8, Math.min(b, e2) - 34, d2 - 8, e2 - 4); c.stroke(); });
  c.setLineDash([]); c.globalAlpha = 1;

  const slide = (1 - eOut((now() - S.secT) / 0.9)) * 150;
  c.save(); c.translate(x0 + (x1 - x0) * 0.5, y0 + (y1 - y0) * 0.5); c.rotate(ang);

  c.strokeStyle = '#7a5a28'; c.lineWidth = 1.4; rr(c, -rl / 2, -rw, rl, rw, 3); c.stroke();

  c.restore();
}

// secret B: the languages that stayed (three speech bubbles; no claims about single countries)
function drawLang(c, w, h, dt, time) {
  c.drawImage(mapLayer(w, h), 0, 0, w, h);
  c.fillStyle = 'rgba(10,14,26,.62)'; rr(c, 0, 0, w, h, 14); c.fill();
  const t = T[lang], cols = [POW.Britain, POW.France, POW.Portugal], k = Math.min(1.15, w / 330, h / 330);
  for (let i = 0; i < 3; i++) {

    const sc = e * k * (sel ? 1.12 : dim ? 0.9 : 1), cx = w / 2 + (i - 1) * 6, cy = h * (0.22 + i * 0.27) + Math.sin(time * 1.6 + i) * 2;

    const g = c.createLinearGradient(-bw / 2, -bh / 2, bw / 2, bh / 2); g.addColorStop(0, mix(cols[i], '#ffffff', 0.25)); g.addColorStop(1, mix(cols[i], '#000000', 0.18));

    c.shadowColor = 'transparent'; c.strokeStyle = mix(cols[i], '#000000', 0.45); c.lineWidth = 1.6; c.stroke();
    c.fillStyle = '#fff'; c.font = '900 28px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t.hello[i], 0, 2);
    c.restore();
  }
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (S.sec === 'a') { drawRule(c, w, h, dt, time); return; }
  if (S.sec === 'b') { drawLang(c, w, h, dt, time); return; }
  if (v === 'map') {
    if (S.mp !== S.mpTgt && !S.drag) S.mp = S.mpTgt > S.mp ? Math.min(S.mpTgt, S.mp + dt / 2.6) : Math.max(S.mpTgt, S.mp - dt / 2.6);
    drawMap(c, w, h, dt, time, 'map'); syncMap(dt);
  } else if (v === 'berlin') drawBerlin(c, w, h, dt, time);
  else drawMap(c, w, h, dt, time, 'free');
});

// --- the map's controls: slider, year buttons, the bar by power ------------------------------------------------
function syncMap(dt) {
  const t = T[lang];
  S.yearCats = DOTS.map((d) => (tOf(d) >= 0.5 ? catB(d) : catA(d)));
  const cur = {}; S.yearCats.forEach((k) => { cur[k] = (cur[k] || 0) + 1; });
  let moving = false;
  SEGS.forEach((g) => {
    const tg = cur[g.k] || 0, v = S.bw[g.k], nv = Math.abs(tg - v) < 0.01 ? tg : v + (tg - v) * Math.min(1, dt * 9);
    if (nv !== v) { S.bw[g.k] = nv; moving = true; }
  });
  if (moving || S.lastMp < 0) {
    SEGS.forEach((g) => {
      const span = $('saBar').querySelector(`[data-k="${g.k}"]`), item = $('saLeg').querySelector(`[data-k="${g.k}"]`), n = Math.round(S.bw[g.k]);
      span.style.flexGrow = S.bw[g.k]; span.style.flexBasis = '0'; span.style.display = S.bw[g.k] > 0.02 ? '' : 'none';
      item.style.display = n > 0 ? 'inline-flex' : 'none'; item.querySelector('b').textContent = n;
    });
  }
  const yr = S.mp >= 0.5 ? 1 : 0;
  if (S.lastMp < 0 || yr !== S.shownYr) { S.shownYr = yr; mapTexts(); }
  if (S.lastMp !== S.mp) {
    S.lastMp = S.mp;
    if (!S.drag) $('saSlider').value = Math.round(S.mp * 1000);
    $('saY0').classList.toggle('on', yr === 0); $('saY1').classList.toggle('on', yr === 1);
  }
}
// the texts that follow the year shown: share caption, readout
function mapTexts() {
  const t = T[lang], ans = S.pick.map !== null, yr = S.shownYr;
  $('saShare').textContent = yr ? t.share1914 : t.share1880;
  if (!ans) { lab.setReadout('?', '', t.pillSchem, '#e8dcc0'); return; }
  const cnt = yr ? CNT14 : CNT80;
  const keys = [...PW, ...(yr ? ['independent'] : ['foothold'])].filter((k) => cnt[k]).sort((a, b) => cnt[b] - cnt[a]);
  lab.setReadout(yr ? t.mapVal : t.mapVal0, keys.map((k) => `${t.powers[k]} ${cnt[k]}`).join(' · '), t.pillSchem, '#e8dcc0');
}

// --- prediction blocks: question, three chips, verdict (the chips stay after the tap) ------------------------------------
function predHTML(v) {
  const t = T[lang], q = t[v + 'Ask'], opts = t[v + 'Opts'], pick = S.pick[v], done = pick !== null, right = RIGHT[v];
  const chips = opts.map((o, i) => `<button class="sa-opt${done ? (i === right ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="opt" data-v="${v}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = done ? `<div class="sa-verdict ${pick === right ? 'good' : 'bad'}">${esc(pick === right ? t[v + 'Right'] : t[v + 'Wrong'])}</div>` : '';
  return `<div class="sa-q">${esc(q)}</div><div class="sa-opts">${chips}</div>${verdict}`;
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(v, i) {
  if (S.pick[v] !== null) return;
  S.pick[v] = i; S.revT[v] = now();
  (i === RIGHT[v] ? sfx.good : sfx.bad)();
  if (v === 'map' && i === RIGHT[v]) S.mpTgt = 1; // the map crossfades to 1914; after a wrong guess the child switches it
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'opt') return answer(b.dataset.v, +b.dataset.i);
  if (a === 'yr') { if (S.pick.map === null) return; S.mpTgt = +b.dataset.y; S.drag = false; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.secT = now(); S.langSel = null; sfx.click(); showStage();
  } else if (a === 'lang') { S.langSel = S.langSel === +b.dataset.i ? null : +b.dataset.i; sfx.tick(); }
  render();
});
$('saSlider').addEventListener('input', (ev) => {
  if (S.pick.map === null) return;
  S.drag = true; S.mp = S.mpTgt = ev.target.value / 1000;
});
const endDrag = () => { S.drag = false; };
$('saSlider').addEventListener('change', endDrag); addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);

// --- one render per change: controls, readout and the state card -------------------------------------------------
const svgEth = `<svg viewBox="0 0 52 52" aria-hidden="true"><defs><linearGradient id="saG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9e48f"/><stop offset="1" stop-color="#c49a1c"/></linearGradient></defs>
  <path d="M26 6 C34 6 41 9 41 9 V26 C41 37 34 44 26 48 C18 44 11 37 11 26 V9 C11 9 18 6 26 6Z" fill="url(#saG)" stroke="#6b4e10" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="26" cy="26" r="6" fill="#f4d03f" stroke="#6b4e10" stroke-width="1.5"/><circle cx="24.5" cy="24.5" r="2" fill="#fff6cf"/>
  <line x1="44" y1="4" x2="12" y2="49" stroke="#6a4a2a" stroke-width="3" stroke-linecap="round"/><path d="M46 2 L48 11 L40 8 Z" fill="#cfd5df" stroke="#4a5060" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
const svgLib = `<svg viewBox="0 0 52 52" aria-hidden="true"><defs><linearGradient id="saS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf3da"/><stop offset="1" stop-color="#d9c79a"/></linearGradient></defs>
  <rect x="9" y="8" width="34" height="36" rx="4" fill="url(#saS)" stroke="#7d6a43" stroke-width="1.8"/><rect x="6" y="5" width="40" height="7" rx="3.5" fill="#e3d2a1" stroke="#7d6a43" stroke-width="1.6"/><rect x="6" y="40" width="40" height="7" rx="3.5" fill="#e3d2a1" stroke="#7d6a43" stroke-width="1.6"/>
  <text x="26" y="31" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="900" font-size="12" fill="#5a3d1c">1847</text></svg>`;

function render() {
  const t = T[lang], v = lab.view, ans = S.pick[v] !== null;
  document.body.dataset.v = v;
  $('saMap').style.display = v === 'map' ? 'block' : 'none';
  $('saBerlin').style.display = v === 'berlin' ? 'block' : 'none';
  $('saFree').style.display = v === 'free' ? 'block' : 'none';
  $('saPredMap').innerHTML = predHTML('map'); $('saPredBerlin').innerHTML = predHTML('berlin'); $('saPredFree').innerHTML = predHTML('free');
  // map controls

  $('saY0').disabled = $('saY1').disabled = locked; $('saSlider').disabled = locked;
  $('saY1').classList.toggle('sa-pulse', S.pick.map !== null && S.pick.map !== RIGHT.map && S.mpTgt === 0);
  $('saNoBetween').textContent = t.noBetween;
  $('saFine').textContent = `${cap1(t.schematic)} · ${t.islands}`;
  $('saBar').parentElement.querySelectorAll('#saLeg [data-k]').forEach((el) => { el.querySelector('.n').textContent = t.powers[el.dataset.k]; });
  S.lastMp = -1;
  // free: the two cards appear after the answer
  $('saCards').style.display = ans && v === 'free' ? 'grid' : 'none';
  $('saCards').innerHTML = `<div class="sa-card">${svgEth}<div><b>${esc(t.ethiopia)}</b><p>${esc(t.adwa)}</p></div></div><div class="sa-card">${svgLib}<div><b>${esc(t.liberia)}</b><p>${esc(t.liberiaText)}</p></div></div>`;
  // secrets row and the language pills
  const open = secret.unlocked(), sc = (k, emo, i) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('saSecs').innerHTML = sc('a', '📏') + sc('b', '🗣️');
  $('saLangs').style.display = S.sec === 'b' ? 'flex' : 'none';
  $('saLangs').innerHTML = t.langNames.map((n, i) => `<button class="sa-lang${S.langSel === i ? ' on' : ''}" style="--c:${[POW.Britain, POW.France, POW.Portugal][i]}" data-act="lang" data-i="${i}">${esc(n)}</button>`).join('');
  // readout, state card, facts
  if (v === 'map') { S.lastMp = -1; mapTexts(); }
  else if (v === 'berlin') lab.setReadout(ans ? t.berlinVal : t.berlinVal0, '', t.berlinPill, '#b8923f');
  else lab.setReadout(ans ? t.freeVal : '?', '', ans ? t.freePill : '', GOLD);
  lab.setGlow(v === 'map' ? 'rgba(232, 220, 192, .22)' : v === 'berlin' ? 'rgba(184, 146, 63, .26)' : 'rgba(244, 208, 63, .24)');

    lab.setFacts([]);
  } else if (!ans) {
    lab.setState({ emo: '🤔', title: t[v + 'Ask'], lead: '', body: '', extra: '' });
    lab.setFacts([]);
  } else {
    const st = t.st[v];

    lab.setFacts(t.facts[v]);
  }
}
