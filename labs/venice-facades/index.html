const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

// --- controls ------------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'vfCheck') {
    const placed = MOVABLE.filter((id) => S.place[id] !== null); if (!placed.length) return;
    S.right = 0;
    for (const id of placed) { S.marks[id] = S.place[id] === RIGHT_BIN[id]; if (S.marks[id]) S.right++; }
    S.checked = true;
    const allOk = S.right === placed.length;
    S.verdict = allOk ? 'ok' : 'bad';
    if (allOk && placed.length === 3) { S.rule = true; store.set('venice-facades:rule', true); showStage(); }
    (allOk ? sfx.good : sfx.bad)();
  } else if (b.id === 'vfRule') { solveSort(); S.rule = true; S.verdict = null; store.set('venice-facades:rule', true); sfx.good(); showStage(); }
  else if (b.id === 'vfReset') {
    for (const id of MOVABLE) { S.place[id] = null; } S.marks = {}; S.checked = false; S.right = 0; S.rule = false; S.verdict = null; S.sel = null;
    store.set('venice-facades:rule', false); sfx.click();
  } else if (b.dataset.ans) {
    S.bAns = b.dataset.ans; S.bAsked = true; store.set('venice-facades:bAsked', true);
    (S.bAns === 'got' ? sfx.good : sfx.bad)(); showStage();
  } else if (b.dataset.v) {
    if (!S.bAsked) return; // the part chips stay inert while the prediction is open
    const part = b.closest('[data-part]').dataset.part, v = b.dataset.v;
    if (S.b[part] === v) return;
    S.anim[part] = { prev: S.b[part], t0: now() }; S.b[part] = v; sfx.snap();
  } else if (b.id === 'vfPlay') {
    S.canal = true; if (S.year >= 1699) { S.year = 1000; } S.playing = true; sfx.click();
  } else if (b.dataset.sec) {
    const k = b.dataset.sec;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.secT0 = now(); S.sel = null;
    if (k === 'heavy') { S.flip = S.flipD = 0; $('vfFlip').value = 0; }
    sfx.click(); showStage();
  }
  render();
});
$('vfYear').addEventListener('input', (ev) => { S.year = +ev.target.value; S.playing = false; if (!S.canal) { S.canal = true; S.camX = null; } render(); });
$('vfFlip').addEventListener('input', (ev) => { S.flip = +ev.target.value / 100; });

// --- one render per change ----------------------------------------------------------------------------------------------
function chips(part, opts) {
  return Object.entries(opts).map(([k, l]) => `<button class="chip vf-c ${S.b[part] === k ? 'on' : ''}" data-v="${k}">${esc(l)}</button>`).join('');
}
function render() {
  const tt = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec === 'heavy' ? 'heavy' : sec === 'map' ? 'map' : v;
  document.body.dataset.tray = MOVABLE.every((id) => S.place[id] !== null) ? 'empty' : 'full';
  $('vfSort').hidden = !!sec || v !== 'sort';
  $('vfBuild').hidden = !!sec || v !== 'build';
  $('vfTime').hidden = !!sec || v !== 'time';
  $('vfHeavy').hidden = sec !== 'heavy';
  const open = secret.unlocked();
  $('vfSec').innerHTML = [['heavy', '🕌', tt.secrets.a[0]], ['map', '🏛️', tt.secrets.b[0]]].map(([k, e, l]) =>
    `<button class="chip vf-c secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${e} ${esc(l)}` : '🔒 ???'}</button>`).join('');
  if (sec === 'heavy') {
    lab.setReadout('🕌', '', '', PINK); lab.setGlow('rgba(217, 140, 122, .26)');
    lab.setState({ emo: '🕌', title: tt.secrets.a[0], lead: tt.heavyCaption, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (sec === 'map') {
    lab.setReadout('🏛️', '', '', GOLD); lab.setGlow('rgba(216, 167, 62, .26)');
    lab.setState({ emo: '🏛️', title: tt.secrets.b[0], lead: tt.palladioCaption, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (v === 'sort') renderSort(tt); else if (v === 'build') renderBuild(tt); else renderTime(tt);
}
function renderSort(tt) {
  lab.setGlow('rgba(216, 167, 62, .24)');
  const placed = MOVABLE.filter((id) => S.place[id] !== null).length, st = tt.st.sort;
  $('vfCheck').textContent = tt.check; $('vfCheck').hidden = S.rule; $('vfCheck').disabled = !placed;
  $('vfCheck').style.opacity = placed ? '' : '.4';
  $('vfRule').textContent = tt.showRule; $('vfRule').hidden = S.rule;
  $('vfReset').hidden = !S.rule;
  const vd = $('vfSortV');
  vd.className = 'vf-verdict' + (S.verdict ? ' ' + S.verdict : '');
  vd.textContent = S.rule ? '' : S.verdict === 'ok' ? tt.sortRight : S.verdict === 'bad' ? tt.sortWrong : '';
  lab.setReadout(esc(tt.sorted(placed)), '', S.checked ? `✓ ${S.right}` : '', '#b8902f');
  if (S.rule) { lab.setState({ emo: '👀', title: tt.ruleTitle, lead: tt.ruleText, body: st[3], extra: '' }); lab.setFacts(tt.facts.sort); }
  else { lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' }); lab.setFacts([tt.facts.sort[1]]); }
}
function renderBuild(tt) {
  lab.setGlow('rgba(217, 140, 122, .24)');
  const asking = !S.bAsked, st = tt.st.build;
  $('vfBAsk').hidden = !asking; $('vfParts').hidden = asking;
  $('vfBQ').textContent = tt.buildAsk;
  $('vfBOpts').innerHTML = ['byz', 'got', 'ren'].map((k) => `<button class="chip vf-c" data-ans="${k}">${esc(cap(tt.styles[k]))}</button>`).join('');
  const vd = $('vfBV');
  vd.hidden = !S.bAns; vd.className = 'vf-verdict ' + (S.bAns === 'got' ? 'ok' : 'bad');
  vd.textContent = S.bAns ? (S.bAns === 'got' ? tt.buildRight : tt.buildWrong) : '';
  $('vfLA').textContent = tt.arches; $('vfLC').textContent = tt.columns; $('vfLT').textContent = tt.top;
  $('vfCA').innerHTML = chips('arch', tt.archOpts); $('vfCC').innerHTML = chips('col', tt.colOpts); $('vfCT').innerHTML = chips('top', tt.topOpts);
  lab.setFacts(tt.facts.build);
  if (asking) { lab.setReadout('?', '', '', PINK); lab.setState({ emo: '🤔', title: tt.buildAsk, lead: '', body: '', extra: '' }); return; }
  const sc = scoreOf(S.b), unit = lang === 'ru' ? ruPlural(sc.top, 'очко', 'очка', tt.points) : tt.points;
  const val = sc.mix ? `${cap(tt.styles[sc.best])} + ${tt.styles[sc.second]}` : cap(tt.styles[sc.best]);
  lab.setReadout(esc(val), sc.mix ? tt.mix : '', `${sc.top} ${unit}`, PINK);
  const colr = { byz: GOLD, got: PINK, ren: STS };
  $('vfMeter').innerHTML = ['byz', 'got', 'ren'].map((k) => `<div class="vf-mrow ${k === sc.best ? 'win' : ''}"><span>${esc(cap(tt.styles[k]))}</span>
    <div class="vf-track"${k === 'ren' ? ` style="box-shadow: inset 0 0 0 1px ${REN_BLUE}"` : ''}><i style="width:${(sc.p[k] / 7) * 100}%;background:linear-gradient(90deg, ${darken(colr[k], 0.15)}, ${lighten(colr[k], 0.25)})"></i></div><b>${sc.p[k]}</b></div>`).join('');
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
}
function timeReadout() {
  if (lab.view !== 'time' || S.sec) return;
  const tt = T[lang];
  if (!S.tChecked && !S.canal) { lab.setReadout('?', '', '', '#7cc3bf'); return; }
  let newest = null; TB.forEach((b) => { if (S.year >= b.y) newest = b; });
  lab.setReadout(String(Math.round(S.year)), newest ? `${tt.newest}: ${tt.names[newest.id]}` : '', newest ? cap(tt.styles[STYLE[newest.id]]) : '', '#3f8f8a');
}
function renderTime(tt) {
  lab.setGlow('rgba(124, 195, 191, .24)');
  const asking = !S.tChecked && !S.canal, st = tt.st.time;
  $('vfTQ').hidden = !asking; $('vfTQ').textContent = tt.timeAsk;
  const vd = $('vfTV');
  vd.hidden = !S.tChecked; vd.className = 'vf-verdict ' + (S.tOk ? 'ok' : 'bad');
  vd.textContent = S.tChecked ? (S.tOk ? tt.timeRight : tt.timeWrong) : '';
  $('vfYRow').hidden = asking;
  $('vfYear').setAttribute('aria-label', tt.year);
  if (+$('vfYear').value !== Math.round(S.year)) $('vfYear').value = Math.round(S.year);
  timeReadout();
  if (asking) { lab.setState({ emo: '🤔', title: tt.timeAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
  lab.setFacts(tt.facts.time);
}

// --- drawing loop (everything it uses is declared above) -----------------------------------------------------------
canvasLoop(cv, (c, w, h, dt, t) => {
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (S.sec === 'heavy') drawHeavy(c, w, h, dt, t);
  else if (S.sec === 'map') drawMap(c, w, h, dt, t);
  else if (lab.view === 'sort') drawSort(c, w, h, dt, t);
  else if (lab.view === 'build') drawBuild(c, w, h, dt, t);
  else drawTime(c, w, h, dt, t);
});
render();
</script>
</body>
