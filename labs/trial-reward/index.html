  else if (main === 'time' && s.step > 0) {
    if (ph === 'verdict') { const ok = s.guess === 'w'; st = { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notQuite, lead: `${tt.circTitle} ${tt.circLead}`, body: `${tt.tally(c20.cheese, k)} ${tt.circBody}` }; }
    else st = { emo: '🔄', title: tt.circTitle, lead: `${tt.circLead} ${tt.tally(c20.cheese, k)}`, body: tt.circBody };
  } else if (main === 'cheese') {
    const ok = ph === 'verdict' && s.guess === 'c';
    st = { emo: ok ? '✅' : '🧀', title: ok ? t.right : tt.cheese[0], lead: ok ? tt.cheese[0] : tt.tally(c20.cheese, k), body: ok ? `${tt.tally(c20.cheese, k)} ${tt.cheese[1]}` : tt.cheese[1] };
  } else if (main === 'trap') {
    const ok = ph === 'verdict' && s.guess === 't';
    st = { emo: ok ? '✅' : '⚠️', title: ok ? t.right : tt.trap[0], lead: ok ? tt.trap[0] : tt.tallyT(c20.trap, k), body: ok ? `${tt.tallyT(c20.trap, k)} ${tt.trap[1]}` : tt.trap[1] };
  } else st = { emo: '🌫️', title: tt.wander[0], lead: tt.tally(c20.cheese, k), body: tt.wander[1] };
  lab.setState({ body: '', extra: '', ...st });
  lab.setReadout(a.tries, t.unit(a.tries), settled ? `🧀 ${c20.cheese}/${k}` : '', '#d9825f');
  lab.setFacts(ph === 'verdict' || ph === 'free' ? (settled ? [t.facts.boat] : []) : []);
}

// --- the picture ------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  advance(dt);
  const v = lab.view;
  if (v === 'curious') drawCurious(c, w, h, time); else drawSingle(c, w, h, time, v === 'maze' ? A1 : A3, v);
});
render();
</script>
