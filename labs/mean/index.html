const FONT = "'Nunito', system-ui, sans-serif";

}
function tag(c, s, x, y, size, col, align = 'center') {

  c.fillStyle = 'rgba(10,12,20,.85)'; rr(c, x0, y - size - 2, tw, size + 8, 7); c.fill();

}

}
function legend(c, items, x, y, size) {

function drawLevel(c, w, h, dt) {
  const t = T[lang], H = S.H, n = H.length, m = mean(H);
  const top = 30, bot = 32, padX = Math.max(10, w * 0.04), colW = (w - 2 * padX) / n;
  const s = Math.min(colW * 0.82, (h - top - bot) / 12.2), base = h - bot;
  G = { mode: 'level', n, colW, padX, s, base };
  if (S.dir === 1) S.p = Math.min(1, S.p + dt / 1.9);
  else if (S.dir === -1) { S.p = Math.max(0, S.p - dt / 0.8); if (S.p === 0) S.dir = 0; }
  const done = S.p >= 1;
  const act = S.p > 0;
  if (done !== S.done || act !== S.act) { if (done && !S.done) sfx.snap(); S.done = done; S.act = act; render(); }
  const e = ease(S.p);
  c.fillStyle = 'rgba(130,145,190,.2)'; c.fillRect(padX * 0.5, base, w - padX, 3);
  const fs = clamp(colW * 0.3, 11, 17);
  for (let i = 0; i < n; i++) {
    const cx = padX + (i + 0.5) * colW, d = lerp(H[i], m, e), col = PAL[i % PAL.length];
    if (S.sel === i && S.p === 0) { c.fillStyle = 'rgba(255,255,255,.07)'; rr(c, cx - colW / 2 + 2, base - 12 * s - 4, colW - 4, 12 * s + 4, 8); c.fill(); }
    const full = Math.floor(d + 1e-6);
    for (let k = 0; k < full; k++) cube(c, cx, base - (k + 1) * s, s, col);
    const fr = d - full;
    if (fr > 0.01) cube(c, cx, base - (full + fr) * s, s, col, 0.9, fr);
    txt(c, N(d, S.p > 0 ? (done ? 2 : 1) : 0), cx, base + fs + 6, fs, S.sel === i && S.p === 0 ? '#fff' : '#aeb7d6');
  }
  const my = base - m * s;
  hline(c, my, padX * 0.5, w - padX * 0.5, '#ffd9a8', [8, 6], 2.5);
  tag(c, `${t.mean} ${ap(m)}${N(m)}`, w - 6, Math.max(18, my - 6), clamp(w * 0.034, 11, 15), '#ffb347', 'right');
  // flying cubes (decorative: they show where the surplus goes)

// bar chart used by "add & divide" and "outlier"
function drawBars(c, w, h, vals, yMax, o) {

  vals.forEach((v, i) => {

    if (o.q === i) {
      c.fillStyle = col + '55'; rr(c, cx - bw / 2, base - bh, bw, bh, Math.min(6, bw * 0.2)); c.fill();
      c.save(); c.setLineDash([4, 4]); c.strokeStyle = col; c.lineWidth = 2; rr(c, cx - bw / 2, base - bh, bw, bh, Math.min(6, bw * 0.2)); c.stroke(); c.restore();
      txt(c, '?', cx, base - bh / 2 + 8, clamp(bw * 0.5, 14, 28), '#fff', 900);
    } else {
      c.fillStyle = col; rr(c, cx - bw / 2, base - bh, bw, bh, Math.min(6, bw * 0.2)); c.fill();
      c.fillStyle = 'rgba(255,255,255,.22)'; rr(c, cx - bw / 2 + 2, base - bh + 2, bw - 4, Math.min(5, bh), 3); c.fill();

function drawCalc(c, w, h) {
  const t = T[lang], k = calc(), n = k.vals.length, tot = sum(k.vals), m = tot / n;
  const eq = `${k.vals.join(' + ')} = ${tot}`;
  txt(c, eq, w / 2, 24, fitText(c, eq, w - 20, 19), '#cfd6ee', 800);
  const eq2 = t.calcL(tot, n, m);
  txt(c, eq2, w / 2, 56, fitText(c, eq2, w - 20, 26, 900), '#ffb347', 900);
  const Y = drawBars(c, w, h, k.vals, k.max, { top: 82, bot: 24, gmode: 'calc', q: k.puz ? n - 1 : -1, color: (i) => PAL[i % PAL.length] });
  const fs = clamp(w * 0.034, 11, 15);
  if (k.puz) {
    const ty = Y(k.target);
    hline(c, ty, G.padX * 0.5, w - G.padX * 0.5, '#5ad19a', [3, 5], 2.5);
    tag(c, `${t.target} ${k.target}`, 6, Math.max(100, ty - 6), fs, '#5ad19a', 'left');
  }
  const my = Y(m);
  hline(c, my, G.padX * 0.5, w - G.padX * 0.5, '#ffd9a8', [8, 6], 2.5);
  tag(c, `${t.mean} ${ap(m)}${N(m)}`, w - 6, Math.max(100, my - 6), fs, '#ffb347', 'right');
}

function drawOutlier(c, w, h) {
  const t = T[lang], o = outd(), n = o.vals.length, m1 = mean(o.vals), m0 = mean(o.base), md = median(o.vals);
  const Y = drawBars(c, w, h, o.vals, o.max, { top: 40, bot: 26, gmode: 'outlier', color: (i) => (i === n - 1 ? '#ff4f8b' : '#5b8def') });
  const x0 = G.padX * 0.5, x1 = w - G.padX * 0.5;
  hline(c, Y(m0), x0, x1, 'rgba(255,255,255,.45)', [3, 6], 2);
  hline(c, Y(md), x0, x1, '#4de1d2', [2, 4], 3);
  hline(c, Y(m1), x0, x1, '#ffb347', [8, 6], 2.5);
  txt(c, t.newL, G.padX + (n - 0.5) * G.colW, G.base + 17, clamp(G.colW * 0.32, 10, 14), '#ff9ec0');
  legend(c, [{ col: '#ffb347', dash: [8, 6], label: t.mean }, { col: 'rgba(255,255,255,.6)', dash: [3, 6], label: t.before }, { col: '#4de1d2', dash: [2, 4], label: t.midVal }], 10, 20, clamp(w * 0.031, 10, 13));
}

function drawFam(c, w, h) {
  const t = T[lang], fam = S.fam, n = fam.length, m = mean(fam), cols = n + 1, pad = Math.max(8, w * 0.03), cw = (w - 2 * pad) / cols;
  const ground = h - 38, es = Math.min(cw * 0.46, (ground - 70) / 4.6), bodyH = es * 4.5, bodyW = cw * 0.84;
  G = { mode: 'nb', cols, cw, pad };
  const ef = `${es}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
  const child = (cx, y, frac, ghost) => {
    c.font = ef; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    const ew = c.measureText('🧒').width, x0 = cx - ew / 2;
    if (ghost) { c.globalAlpha = 0.22; c.fillText('🧒', x0, y); c.globalAlpha = 1; }
    c.save(); c.beginPath(); c.rect(x0 - 1, y - es * 1.3, ew * frac + 1, es * 1.6); c.clip(); c.fillText('🧒', x0, y); c.restore();
  };
  for (let i = 0; i < cols; i++) {
    const cx = pad + (i + 0.5) * cw, isMean = i === n, v = isMean ? m : fam[i];
    const col = isMean ? '#ffb347' : PAL[(i + 2) % PAL.length];
    c.save();
    c.fillStyle = isMean ? 'rgba(255,179,71,.08)' : 'rgba(130,145,190,.12)'; rr(c, cx - bodyW / 2, ground - bodyH, bodyW, bodyH, 10); c.fill();
    if (isMean) c.setLineDash([6, 5]);
    c.strokeStyle = col; c.lineWidth = 2; rr(c, cx - bodyW / 2, ground - bodyH, bodyW, bodyH, 10); c.stroke();
    c.restore();
    c.fillStyle = col; c.beginPath(); c.moveTo(cx - bodyW / 2 - 3, ground - bodyH); c.lineTo(cx, ground - bodyH - es * 0.8); c.lineTo(cx + bodyW / 2 + 3, ground - bodyH); c.closePath(); c.globalAlpha = 0.85; c.fill(); c.globalAlpha = 1;
    const full = Math.floor(v + 1e-9), fr = v - full;
    for (let k = 0; k < full; k++) child(cx, ground - 5 - k * es * 1.05, 1, false);
    if (fr > 0.001) child(cx, ground - 5 - full * es * 1.05, fr, true);
    txt(c, N(v), cx, ground + clamp(cw * 0.3, 12, 18) + 4, clamp(cw * 0.3, 12, 18), isMean ? '#ffb347' : '#cfd6ee', 900);
    if (isMean) txt(c, t.meanFam, cx, 16, clamp(cw * 0.2, 9, 13), '#ffb347', 800);
  }
}

function drawSee(c, w, h, dt) {
  const t = T[lang], d = SEE[S.see.k], mn = mean(d), f = S.see.f, bal = Math.abs(mn - f) < 0.051;
  const pad = Math.max(18, w * 0.06), unit = (w - 2 * pad) / 10, X = (v) => pad + v * unit;
  const fy = h * 0.58, th = 10, bs = Math.min(unit * 0.8, h * 0.09, 34), fx = X(f);
  G = { mode: 'sw', pad, unit };
  const target = bal ? 0 : Math.sign(mn - f) * clamp(Math.abs(mn - f) * 0.09, 0.07, 0.4);
  S.tilt += (target - S.tilt) * Math.min(1, dt * 7);
  const gy = fy + Math.min(78, h * 0.28);
  c.fillStyle = 'rgba(130,145,190,.2)'; c.fillRect(pad * 0.4, gy, w - pad * 0.8, 3);
  c.fillStyle = bal ? '#5ad19a' : '#8a93b8'; c.beginPath(); c.moveTo(fx, fy + th / 2); c.lineTo(fx - 26, gy); c.lineTo(fx + 26, gy); c.closePath(); c.fill();
  c.save(); c.translate(fx, fy); c.rotate(S.tilt);
  c.fillStyle = '#c9d2f0'; rr(c, X(-0.4) - fx, -th / 2, 10.8 * unit, th, 4); c.fill();
  for (let v = 0; v <= 10; v++) {
    c.fillStyle = 'rgba(10,12,20,.5)'; c.fillRect(X(v) - fx - 1, -th / 2, 2, th);
    txt(c, String(v), X(v) - fx, th / 2 + clamp(unit * 0.4, 11, 15), clamp(unit * 0.4, 10, 14), '#8a93b8', 700);
  }
  const stack = {};
  for (const v of d) {
    const k = stack[v] = (stack[v] || 0) + 1;
    c.fillStyle = PAL[(v + 2) % PAL.length]; rr(c, X(v) - fx - bs / 2 + 1, -th / 2 - k * bs + 1, bs - 2, bs - 2, 4); c.fill();
    c.fillStyle = 'rgba(255,255,255,.28)'; c.fillRect(X(v) - fx - bs / 2 + 4, -th / 2 - k * bs + 3, bs - 8, 3);
  }
  c.restore();
  if (bal) tag(c, `${t.mean} ${N(mn)}`, fx, gy + 24, clamp(w * 0.036, 12, 16), '#5ad19a');
  else txt(c, '◀  ▶', fx, gy + 22, 14, '#8a93b8', 800);
}

canvasLoop($('cv'), (c, w, h, dt) => {
  const m = mode();
  if (m === 'level') drawLevel(c, w, h, dt);
  else if (m === 'calc') drawCalc(c, w, h);
  else if (m === 'outlier') drawOutlier(c, w, h);
  else if (m === 'nb') drawFam(c, w, h);
  else drawSee(c, w, h, dt);
});

// ---------------------------------------------------------------------------------------------------------
// 7. Pointer: drag towers / bars / the support, tap families
// ---------------------------------------------------------------------------------------------------------
const cv = $('cv');
let drag = null;
function edit(p, down) {
  const m = mode();
  if (G.mode !== m) return;
  if (m === 'level') {
    if (down) { drag.idx = clamp(Math.floor((p.x - G.padX) / G.colW), 0, G.n - 1); S.sel = drag.idx; }
    if (p.y > G.base + 2) { render(); return; }
    const v = clamp(Math.ceil((G.base - p.y) / G.s - 1e-6), 1, 12);
    if (v !== S.H[drag.idx]) { S.H[drag.idx] = v; resetShare(); sfx.tick(); }
    else if (down && S.p > 0) resetShare();
  } else if (m === 'calc') {
    const c = calc();
    if (down) drag.idx = clamp(Math.floor((p.x - G.padX) / G.colW), 0, G.n - 1);
    if (c.puz && drag.idx !== G.n - 1) return;
    const v = clamp(Math.round(((G.base - p.y) / G.plotH) * G.yMax), 0, G.yMax);
    if (c.puz) { if (v !== S.cal.x) { S.cal.x = v; sfx.tick(); } }
    else if (v !== S.cal.v[drag.idx]) { S.cal.v[drag.idx] = v; sfx.tick(); }
  } else if (m === 'outlier') {
    const v = clamp(Math.round(((G.base - p.y) / G.plotH) * G.yMax), 0, G.yMax);
    if (v !== S.out.x) { S.out.x = v; sfx.tick(); }
  } else if (m === 'nb') {
    if (!down) return;
    const i = Math.floor((p.x - G.pad) / G.cw);
    if (i >= 0 && i < S.fam.length) { S.fam[i] = (S.fam[i] + 1) % 5; sfx.click(); }
  } else {
    const f = clamp(Math.round(((p.x - G.pad) / G.unit) * 10) / 10, 0, 10);
    if (f !== S.see.f) { S.see.f = f; sfx.tick(); }
  }
  render();
}
const pos = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
cv.addEventListener('pointerdown', (ev) => { cv.setPointerCapture(ev.pointerId); drag = { idx: 0 }; edit(pos(ev), true); });
cv.addEventListener('pointermove', (ev) => { if (drag) edit(pos(ev), false); });
const endDrag = () => { drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

render();
</script>
</body>
