// --- html side ----------------------------------------------------------------------------------------------
const letBtns = (act, dis, st = {}) => ['A', 'B', 'C'].map((k) => `<button class="mf-let ${st[k] || ''}" style="--c:${COL[k]}" data-act="${act}" data-k="${k}" ${dis ? 'disabled' : ''}>${k}</button>`).join('');
const pills = (s) => [...s].map((k) => `<span class="mf-lt" style="--c:${COL[k]}">${k}</span>`).join('');
const sndHint = (t) => (!store.get('sound', false) ? `<button class="mf-snd" data-act="snd">${esc(t.snd)}</button>` : '');
const secChips = (t) => { const open = secret.unlocked(); return `<div class="mf-row">${[['a', '🔁'], ['b', '🎡']].map(([k, e]) =>
  `<button class="mf-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('')}</div>`; };
const playBtn = (t, dis) => `<button class="btn mf-play" data-act="play" ${dis ? 'disabled' : ''}>${S.play ? t.stop : t.listen}</button>`;
function render() {
  const t = T[lang], v = lab.view, h = S.hear, bd = S.build, so = S.songs, sec = S.sec;
  let html = '', val = '', sub = '', pill = '', color = '#4ea8ff', st;
  if (sec) {
    const f = SECF[sec], shown = f.slice(0, S.secN);
    html = `<div class="mf-q">${esc(t.secrets[sec][1])}</div><div class="mf-row">${playBtn(t)}</div>${sndHint(t)}${secChips(t)}`;
    val = shown + (S.secN < f.length || sec === 'b' ? '…' : '') || '…'; st = { emo: sec === 'a' ? '🔁' : '🎡', title: t.secrets[sec][0], lead: t.secrets[sec][1], body: '' };
  } else if (v === 'hear') {
    const rows = h.rounds.slice(-5).reverse().map((r) => `<tr><td>♪ ${esc(t.partsN(r.form.length))}</td><td>${pills(r.wrote)}</td><td class="${r.ok ? 'ok' : 'no'}">${pills(r.form)} ${r.ok ? '✓' : '!'}</td></tr>`).join('');
    html = `<div class="mf-q">${esc(t.q.hear)}</div>
      <div class="mf-row">${playBtn(t)}${h.checked ? `<button class="btn" data-act="next">${esc(t.next)}</button>` : `<button class="btn" data-act="check" ${h.labels.some((l) => !l) ? 'disabled' : ''}>${esc(t.check)}</button>`}
      <button class="mf-chip ${h.ruleOpen ? 'on' : ''}" data-act="rule" ${h.rounds.length >= 3 ? '' : 'hidden'}>${esc(t.showRule)}</button></div>
      <div class="mf-pick">${esc(t.pick)}</div><div class="mf-row">${letBtns('let', h.checked || h.sel === null)}</div>${sndHint(t)}
      ${rows ? `<table class="mf-table"><thead><tr>${t.head.map((x) => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>` : ''}${secChips(t)}`;
    if (h.checked) { const ok = h.rounds[h.rounds.length - 1].ok; val = h.form; sub = names(h.form); pill = ok ? t.right : t.notQuite; color = ok ? '#2fbf84' : '#e59a1f'; }
    else val = t.round(h.rounds.length + 1);
    st = { emo: '🚂', title: t.views.hear, lead: t.state.hear[0], body: t.state.hear[1] };
  } else if (v === 'build') {
    const optSt = (k) => (!bd.asked ? '' : k === 'ABA' ? 'good' : k === bd.guess ? 'bad' : '');
    html = `<div class="mf-q">${esc(t.q.build)}</div><div class="mf-row">${['ABA', 'AAB', 'ABC'].map((k) => `<button class="mf-opt ${optSt(k)}" data-act="bq" data-k="${k}" ${bd.asked ? 'disabled' : ''}>${k}</button>`).join('')}</div>`;
    if (bd.asked) html += `<div class="mf-pick">${esc(t.add)}</div><div class="mf-row">${letBtns('add', bd.cars.length >= 6)}<button class="mf-chip" data-act="del" ${bd.cars.length ? '' : 'disabled'}>${esc(t.del)}</button><button class="mf-chip" data-act="clear" ${bd.cars.length ? '' : 'disabled'}>${esc(t.clear)}</button></div>
      <div class="mf-row">${playBtn(t, !bd.cars.length)}</div>${sndHint(t)}`;
    html += secChips(t);
    if (bd.asked) { const f = bd.cars.join(''); val = f || '—'; sub = names(f); pill = bd.guess === 'ABA' && f === 'ABA' ? t.right : ''; color = '#2fbf84'; }
    else val = '?';
    st = bd.asked ? { emo: '🧱', title: t.views.build, lead: t.state.build[0], body: t.buildDone + ' ' + t.state.build[1] } : { emo: '🧱', title: t.views.build, lead: t.state.build0[0], body: t.state.build0[1] };
  } else {
    const sg = SONGS[so.i], tx = t.songs[sg.id], a = so.ans[so.i], last = sg.form.slice(-1), full = a !== null;
    const aSt = (k) => (!full ? '' : k === last ? 'good' : k === a ? 'bad' : '');
    const lines = tx.lines ? `<ul class="mf-lines">${tx.lines.map((l, i) => `<li>${esc(l)} → ${i < tx.lines.length - 1 || full ? `<span class="mf-lt" style="--c:${COL[sg.form[i]]}">${sg.form[i]}</span>` : '?'}</li>`).join('')}</ul>` : '';
    html = `<div class="mf-row">${SONGS.map((s, i) => `<button class="mf-chip ${i === so.i ? 'on' : ''}" data-act="song" data-k="${i}">${esc(t.songs[s.id].t)}</button>`).join('')}</div>
      <div class="mf-song"><b>${esc(tx.t)}${sg.id === 'ro' ? `<span class="mf-tag">${esc(t.songs.simple)}</span>` : ''}</b><span>${esc(tx.s)}</span>${lines}${full && tx.note ? `<p class="mf-note">${esc(tx.note)}</p>` : ''}</div>
      <div class="mf-pick">${esc(t.q.songs)}</div><div class="mf-row">${letBtns('ans', full, { A: aSt('A'), B: aSt('B'), C: aSt('C') })}${playBtn(t)}</div>${sndHint(t)}${secChips(t)}`;
    val = full ? sg.form : sg.form.slice(0, -1) + '?'; if (full) { sub = names(sg.form); pill = a === last ? t.right : t.notQuite; color = a === last ? '#2fbf84' : '#e59a1f'; }
    st = { emo: '🎼', title: t.views.songs, lead: t.state.songs[0], body: t.state.songs[1] };
  }
  $('ctrlBody').innerHTML = html;
  lab.setReadout(esc(val), sub, pill, color); lab.setState(st);
  lab.setFacts(sec ? [] : t.facts[v]);
  const rule = $('mfRule'), open = h.ruleOpen && v === 'hear' && !sec;
  rule.hidden = !open;
  if (open) rule.innerHTML = `<button class="mf-x" type="button" aria-label="×">×</button><h3>${esc(t.ruleTitle)}</h3><p>${esc(t.rule)}</p>
    <div class="mf-mini">${[...'ABA'].map((k) => `<span style="--c:${COL[k]}">${k}</span>`).join('')}</div><div class="mf-mini">${[...'ABAC'].map((k) => `<span style="--c:${COL[k]}">${k}</span>`).join('')}</div>`;
}
render();
</script>
</body>
</html>
