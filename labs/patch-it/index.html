    if (ch === 'in' && !it.safe && S.infAt2 === null) S.infAt2 = t0 + 1.0;
    showStage();
  } else if (a === 'next2') { S.i2++; S.res2 = null; S.inT2 = now(); sfx.click(); }
  else if (a === 'again2') { S.i2 = 0; S.res2 = null; S.right2 = []; S.infAt2 = null; S.inT2 = now(); sfx.click(); }
  else if (a === 'sec2') { if (!secret.unlocked()) return secret.open(); S.sec2 = 'brain'; sfx.click(); }
  else if (a === 'back2') { S.sec2 = null; sfx.click(); }
  else if (a === 'copyB') { if (S.brainN < 4) { S.brainAt[S.brainN] = now(); S.brainN++; sfx.snap(); } }
  else if (a === 'rstB') { S.brainN = 0; S.brainAt = []; sfx.click(); }
  else if (a === 'g3') { S.g3 = i; S.ph3 = 'rev'; S.rev3 = now(); (i === T[lang].v3.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'go3') { S.ph3 = 'lay'; S.run3 = null; S.done3 = false; sfx.click(); }
  else if (a === 'back3') { S.ph3 = 'pred'; S.g3 = null; S.run3 = null; S.done3 = false; S.tok3++; sfx.click(); }
  else if (a === 'tog') { const k = b.dataset.k; S.on[k] = !S.on[k]; sfx.tick(); S.run3 = null; S.done3 = false; S.tok3++; }
  else if (a === 'send') {
    S.run3 = planRun3(); S.t3 = now(); S.done3 = false; sfx.push(); showStage();
    const last = Math.max(...S.run3.map((x) => x.delay + x.dur)), tok = ++S.tok3;
    setTimeout(() => { if (S.tok3 === tok) { S.done3 = true; render(); } }, (last + (S.on.bk && S.run3.some((x) => x.res === 'in') ? 2.2 : 1.1)) * 1000);
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'wd') return;
  S.day = clamp(Math.round(+ev.target.value), 0, 70); paintWanna(T[lang]);
  const q = $('c1').querySelector('.pi-q'); if (q) q.textContent = T[lang].wanna.rd(S.day);
});

// --- one render per change -------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('c1').hidden = v !== 'holes'; $('c2').hidden = v !== 'bait'; $('c3').hidden = v !== 'layers';
  if (v === 'holes') renderHoles(t); else if (v === 'bait') renderBait(t); else renderLayers(t);
  lab.checkStage?.();
}
render();
</script>
