  c.fillStyle = '#e8d9bd'; c.beginPath(); c.moveTo(258, 206); c.lineTo(258, 180); c.lineTo(244, 206); c.closePath(); c.fill();
  c.fillStyle = '#7a4a2a'; c.beginPath(); c.moveTo(238, 207); c.quadraticCurveTo(262, 218, 292, 207); c.lineTo(288, 205); c.lineTo(242, 205); c.closePath(); c.fill();
  g = c.createLinearGradient(0, 320, 0, H); g.addColorStop(0, '#f3dca4'); g.addColorStop(1, '#dcb872'); c.fillStyle = g;
  c.beginPath(); c.moveTo(0, 338); c.quadraticCurveTo(120, 318, 230, 330); c.quadraticCurveTo(310, 338, W, 320); c.lineTo(W, H); c.lineTo(0, H); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 336); c.quadraticCurveTo(120, 316, 230, 328); c.quadraticCurveTo(310, 336, W, 318); c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.lineCap = 'round';
  for (const [x, y] of [[90, 150], [118, 138]]) { c.beginPath(); c.moveTo(x - 9, y); c.quadraticCurveTo(x - 4, y - 7, x, y); c.quadraticCurveTo(x + 4, y - 7, x + 9, y); c.stroke(); }
}
function sceneCity(c) {
  let g = c.createLinearGradient(0, 0, 0, 340); g.addColorStop(0, '#243064'); g.addColorStop(0.7, '#9a6f9e'); g.addColorStop(1, '#f0a37a'); c.fillStyle = g; c.fillRect(0, 0, W, 345);
  g = c.createRadialGradient(240, 300, 4, 240, 300, 90); g.addColorStop(0, 'rgba(255,214,150,.95)'); g.addColorStop(1, 'rgba(255,170,110,0)'); c.fillStyle = g; c.fillRect(120, 200, 240, 140);
  const bl = [[0, 40, 150], [34, 36, 110], [66, 44, 170], [108, 34, 120], [140, 50, 200], [188, 38, 130], [224, 46, 175], [268, 34, 115], [300, 62, 155]];
  bl.forEach(([x, w, h], i) => {
    const far = i % 2 === 0, top = 340 - h;
    const gg = c.createLinearGradient(x, top, x + w, top); gg.addColorStop(0, far ? '#2a2f58' : '#1d2142'); gg.addColorStop(1, far ? '#1c2040' : '#12152e');
    c.fillStyle = gg; c.fillRect(x, top, w, h);
    for (let wy = top + 8; wy < 330; wy += 12) for (let wx = x + 6; wx < x + w - 6; wx += 9) { if (hr(i * 97 + wx + wy * 3) > 0.45) { c.fillStyle = hr(wx * 7 + wy) > 0.3 ? 'rgba(255,214,120,.9)' : 'rgba(255,240,190,.9)'; c.fillRect(wx, wy, 4.5, 6); } }
  });
  g = c.createLinearGradient(0, 335, 0, H); g.addColorStop(0, '#343a5c'); g.addColorStop(1, '#1b1f36'); c.fillStyle = g; c.fillRect(0, 335, W, H - 335);
  c.fillStyle = '#4a5078'; c.fillRect(0, 335, W, 9);
  c.strokeStyle = 'rgba(255,230,160,.7)'; c.lineWidth = 3; c.setLineDash([22, 16]); c.beginPath(); c.moveTo(0, 392); c.lineTo(W, 392); c.stroke(); c.setLineDash([]);
  c.strokeStyle = '#2a2d46'; c.lineWidth = 4; c.beginPath(); c.moveTo(320, 340); c.lineTo(320, 250); c.quadraticCurveTo(320, 238, 306, 238); c.stroke();
  g = c.createRadialGradient(304, 242, 2, 304, 242, 36); g.addColorStop(0, 'rgba(255,230,160,.9)'); g.addColorStop(1, 'rgba(255,230,160,0)'); c.fillStyle = g; c.fillRect(268, 206, 72, 72);
}
function sceneMount(c) {
  let g = c.createLinearGradient(0, 0, 0, 300); g.addColorStop(0, '#6ea3e6'); g.addColorStop(1, '#e6f1fb'); c.fillStyle = g; c.fillRect(0, 0, W, 340);
  g = c.createRadialGradient(70, 70, 4, 70, 70, 60); g.addColorStop(0, 'rgba(255,245,200,1)'); g.addColorStop(1, 'rgba(255,245,200,0)'); c.fillStyle = g; c.fillRect(0, 0, 150, 140);
  const peak = (pts, fill, snow) => {
    c.fillStyle = fill; c.beginPath(); c.moveTo(pts[0][0], 340); pts.forEach(([x, y]) => c.lineTo(x, y)); c.lineTo(pts[pts.length - 1][0], 340); c.closePath(); c.fill();
    if (snow) for (const [x, y] of snow) { c.fillStyle = '#fff'; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 22, y + 30); c.lineTo(x - 8, y + 24); c.lineTo(x, y + 34); c.lineTo(x + 9, y + 24); c.lineTo(x + 22, y + 30); c.closePath(); c.fill(); }
  };
  peak([[-10, 250], [70, 170], [110, 200], [190, 120], [270, 205], [310, 170], [370, 240]], '#8da6cc', [[190, 120], [70, 170], [310, 170]]);
  peak([[-10, 290], [60, 230], [130, 270], [220, 215], [300, 270], [370, 235]], '#5f7fa8', null);
  g = c.createLinearGradient(0, 300, 0, H); g.addColorStop(0, '#6fb36f'); g.addColorStop(1, '#376f43'); c.fillStyle = g;
  c.beginPath(); c.moveTo(0, 318); c.quadraticCurveTo(100, 296, 200, 316); c.quadraticCurveTo(290, 332, W, 306); c.lineTo(W, H); c.lineTo(0, H); c.closePath(); c.fill();
  const pine = (x, y, s) => { for (let i = 0; i < 3; i++) { const gg = c.createLinearGradient(x - 12 * s, 0, x + 12 * s, 0); gg.addColorStop(0, '#2f7a4b'); gg.addColorStop(1, '#1d5434'); c.fillStyle = gg; c.beginPath(); c.moveTo(x, y - 34 * s + i * 13 * s); c.lineTo(x - (11 + i * 4) * s, y - 14 * s + i * 13 * s); c.lineTo(x + (11 + i * 4) * s, y - 14 * s + i * 13 * s); c.closePath(); c.fill(); } c.fillStyle = '#5a3a22'; c.fillRect(x - 2 * s, y + 6 * s, 4 * s, 8 * s); };
  pine(30, 326, 1.2); pine(62, 332, 0.9); pine(330, 322, 1.3); pine(300, 334, 0.9);
  c.fillStyle = '#b5703f'; c.fillRect(250, 306, 40, 26); c.fillStyle = '#7a3f27'; c.beginPath(); c.moveTo(244, 307); c.lineTo(270, 286); c.lineTo(296, 307); c.closePath(); c.fill();
  c.fillStyle = '#ffd88a'; c.fillRect(262, 314, 9, 9);
}
function draw3(c, dt, time) {
  c.save();
  c.beginPath(); c.roundRect(0, 0, W, H, 18); c.clip();
  [sceneSea, sceneCity, sceneMount][S.place](c, time);
  c.restore();
  const t = T[lang], pl = t.c3.places[S.place];
  person(c, 112, 396, 152, { ...LEO, wave: true, mood: 'smile' });
  if (S.pred3 !== null) { // the reveal: what the place adds, and what stays
    c.save(); c.beginPath(); c.roundRect(0, 0, W, H, 18); c.clip();
    emo(c, pl.hob[0], 222, 322, 34); emo(c, pl.food[0], 290, 350, 34);
    pill(c, `“${pl.word}”`, 252, 262, { fs: 14 });
    pill(c, `❤️ ${t.c3.sameTag}`, 112, 214, { fs: 13.5, bg: 'rgba(60,40,10,.88)', stroke: 'rgba(255,196,80,.9)', fg: '#ffe2a8' });
    c.restore();
  }
}

// --- controls and render -----------------------------------------------------------------------------------------
const lab = shell({ key: 'my-circles', T, topics: TOPICS, views: ['circles', 'labels', 'places'], onLang: render, onView: render });
const secret = secretLab('my-circles', () => ({
  secrets: [{ emo: '🧠', title: T[lang].secrets.id[0], desc: T[lang].secrets.id[1] }, { emo: '🌱', title: T[lang].secrets.born[0], desc: T[lang].secrets.born[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="sec1"><div id="q1"></div><div class="chips" id="gchips"></div>
    <div class="row2"><div class="mc-step"><button type="button" data-act="pp" aria-label="‹">‹</button><span id="pname"></span><button type="button" data-act="pn" aria-label="›">›</button></div>
      <button type="button" class="chip mc-c" data-act="newc" id="newc"></button></div>
    <div class="row2"><div class="chips" id="secChips"></div></div></div>
  <div id="sec2"><div class="row2" style="margin-top:0"><div class="card seg small" id="partSeg"></div></div><div id="q2" style="margin-top:12px"></div><div class="chips" id="nchips"></div></div>
  <div id="sec3"><div id="q3"></div><div class="chips" id="pchips"></div></div>`;

let noorTimers = [];
function playNoor() {
  noorTimers.forEach(clearTimeout); S.nOn = [0, 0, 0, 0];
  noorTimers = [0, 1, 2, 3].map((i) => setTimeout(() => { S.nOn[i] = 1; sfx.tick(); render(); }, 900 * (i + 1)));
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const sharers = () => { const k = act().length; return S.crowd.filter((p) => cntOf(p) === k).map((p) => p.i); };

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'g') {
    if (S.a[i]) { if (act().length <= 1) return; S.a[i] = 0; } else S.a[i] = 1;
    sfx.tick(); arrange();
  } else if (a === 'ans1') {
    arrange(); const n = sharers().length, yes = b.dataset.v === 'yes', right = yes === (n > 0);
    S.pred1 = b.dataset.v; S.v1 = { right, key: act().join(''), seed: S.seed }; (right ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'pp' || a === 'pn') {
    S.sel = S.sel === null ? 0 : (S.sel + (a === 'pn' ? 1 : 29)) % 30; S.sec = null; sfx.tick();
  } else if (a === 'newc') {
    S.seed++; S.crowd = makeCrowd(S.seed); S.pkey = ''; S.sel = null; arrange(); sfx.click();
  } else if (a === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  } else if (a === 'part') { S.part = b.dataset.p; sfx.click(); }
  else if (a === 'ans2') { S.pred2 = b.dataset.v; (S.pred2 === 'no' ? sfx.good : sfx.bad)(); playNoor(); showStage(); }
  else if (a === 'n') { S.nOn[i] = S.nOn[i] ? 0 : 1; sfx.tick(); }
  else if (a === 'pick') { S.choice = i; sfx.click(); showStage(); }
  else if (a === 'ans3') { S.pred3 = i; (i === T[lang].c3.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'pl') { S.place = i; sfx.click(); }
  render();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'circles') return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - GEO.ox) / GEO.k, y = (ev.clientY - r.top - GEO.oy) / GEO.k;
  let best = null, bd = 26;
  for (const p of S.crowd) { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } }
  S.sel = best ? best.i : null; if (best) { S.sec = null; sfx.click(); }
  render();
});

const stateRows = (rows) => rows.map(([e, txt]) => `<div class="mc-row">${e} ${txt}</div>`).join('');
function render() {
  const t = T[lang], v = lab.view;
  $('sec1').style.display = v === 'circles' ? '' : 'none';
  $('sec2').style.display = v === 'labels' ? '' : 'none';
  $('sec3').style.display = v === 'places' ? '' : 'none';
  if (v === 'circles') r1(t); else if (v === 'labels') r2(t); else r3(t);
}

function r1(t) {
  const c1 = t.c1, ids = act(), k = ids.length, rev = S.pred1 !== null;
  arrange();
  const all = sharers(); S.all = all; S.k = k; S.n = all.length;
  lab.setGlow('rgba(78, 168, 255, .26)');
  $('q1').innerHTML = rev ? '' : k >= 4
    ? `<div class="mc-q"><p>${esc(c1.q)}</p><div class="mc-opts"><button type="button" class="mc-b" data-act="ans1" data-v="yes">${esc(c1.yes)}</button><button type="button" class="mc-b" data-act="ans1" data-v="no">${esc(c1.no)}</button></div></div>`
    : `<div class="mc-q"><p class="mc-note">${esc(c1.hint(k))}</p></div>`;
  $('gchips').innerHTML = GR.map((g, i) => `<button type="button" class="chip mc-c ${S.a[i] ? 'on' : ''}" style="--c:${g.col}" data-act="g" data-i="${i}">${g.e} ${esc(t.g[i].c)}</button>`).join('');
  $('pname').textContent = S.sel === null ? '—' : NAMES[lang][S.sel];
  $('newc').textContent = c1.newc;
  const open = secret.unlocked();
  const sc = (kk, e, title) => `<button type="button" class="chip secret mc-c ${open ? 'open' : ''} ${S.sec === kk ? 'on' : ''}" data-act="sec" data-k="${kk}">${open ? `${e} ${esc(title)}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('id', '🧠', t.secrets.id[0]) + sc('born', '🌱', t.secrets.born[0]);
  lab.setReadout(esc(String(k)), c1.sub(k), rev ? c1.pill(S.n) : '', '#4ea8ff');
  const fine = `<div class="mc-fine">${esc(c1.simple)}</div>`;
  let funnel = '';
  if (rev) {
    funnel = `<div class="mc-fn"><div class="mc-fh">${esc(c1.fnHead)}</div>${ids.map((_, j) => {
      const n = S.crowd.filter((p) => cntOf(p) >= j + 1).length;
      return `<div class="mc-fr"><span>${esc(c1.fnRow(j + 1))}</span><i><u style="width:${n / 30 * 100}%"></u></i><b>${n}</b></div>`;
    }).join('')}</div>`;
  }
  let st;
  if (S.sec === 'id') st = { emo: '🧠', title: c1.idT, lead: c1.idL, body: c1.idB, extra: `<div class="mc-fine">en.wikipedia.org/wiki/Social_identity_theory</div>` };
  else if (S.sec === 'born') {
    const gv = ids.filter((i) => GR[i].given).map((i) => t.g[i].s).join(', '), ch = ids.filter((i) => !GR[i].given).map((i) => t.g[i].s).join(', ');
    st = { emo: '🌱', title: c1.bornT, lead: c1.bornL, body: c1.bornB(gv, ch), extra: '' };
  } else if (S.sel !== null) {
    const p = S.crowd[S.sel], sh = ids.filter((i) => p.m[i]), [nm, lead] = c1.share(NAMES[lang][S.sel], sh.length, k, sh.map((i) => t.g[i].s).join(', '));
    st = { emo: '🙂', title: nm, lead, body: rev ? '' : c1.tapHint, extra: funnel + fine };
  } else if (rev) {
    const vd = S.v1 && S.v1.key === ids.join('') && S.v1.seed === S.seed ? `${S.v1.right ? c1.right : c1.wrong} ` : '';
    st = { emo: S.n === 0 ? '🔎' : '✨', title: vd + c1.live(S.n), lead: S.n === 0 ? c1.expl0 : c1.expl1, body: c1.body, extra: funnel + fine };
  } else st = { emo: '⭕', title: c1.preTitle(k), lead: c1.preLead, body: c1.tapHint, extra: fine };
  lab.setState(st);
  lab.setFacts(t.f1);
}

function r2(t) {
  const c2 = t.c2, label = S.part === 'label';
  lab.setGlow('rgba(143, 127, 208, .28)');
  $('partSeg').innerHTML = c2.part.map((l, i) => `<button type="button" data-act="part" data-p="${i ? 'choice' : 'label'}" class="${label === (i === 0) ? 'on' : ''}">${esc(l)}</button>`).join('');
  lab.setFacts(S.pred2 === null ? [t.f2[1]] : t.f2);
  if (label) {
    const shown = S.nOn.reduce((a, b) => a + b, 0), r = S.nOn.filter((x, i) => x && NOORC[i].truth).length, w = shown - r;
    $('q2').innerHTML = S.pred2 === null
      ? `<div class="mc-q"><p>${esc(c2.q)}</p><div class="mc-opts"><button type="button" class="mc-b" data-act="ans2" data-v="yes">${esc(c2.yes)}</button><button type="button" class="mc-b" data-act="ans2" data-v="no">${esc(c2.no)}</button></div></div>`
      : `<div class="mc-q"><p class="mc-note">${esc(c2.add)}</p></div>`;
    $('nchips').innerHTML = S.pred2 === null ? '' : NOORC.map((n, i) => `<button type="button" class="chip mc-c ${S.nOn[i] ? 'on' : ''}" style="--c:${n.col}" data-act="n" data-i="${i}">${n.e} ${esc(c2.circ[i].s)}</button>`).join('');
    lab.setReadout(esc(String(1 + shown)), c2.sub(1 + shown), '', '#8f7fd0');
    if (S.pred2 === null) lab.setState({ emo: '🎮', title: c2.preTitle, lead: c2.preLead, body: '', extra: '' });
    else {
      const rows = NOORC.map((n, i) => (S.nOn[i] ? [n.e, `${esc(c2.circ[i].f)} → “${esc(c2.guess[i])}”: <b>${esc(n.truth ? c2.ok : c2.ko)}</b>`] : null)).filter(Boolean);
      lab.setState({ emo: '🏷️', title: `${S.pred2 === 'no' ? c2.right : c2.wrong} ${c2.ansTitle}`, lead: shown === 0 ? c2.wait : c2.so(r, w, shown === 4), body: c2.ansBody, extra: stateRows(rows) });
    }
  } else {
    $('nchips').innerHTML = '';
    $('q2').innerHTML = `<div class="mc-q"><p>${esc(c2.sLead)}</p><p>${esc(c2.sQ)}</p><div class="mc-opts">${c2.opts.map((o, i) => `<button type="button" class="mc-b ${S.choice === i ? 'on' : ''}" data-act="pick" data-i="${i}">${esc(o)}</button>`).join('')}</div></div>`;
    lab.setReadout('2', c2.sub2, '', '#3ddc97');
    if (S.choice === null) lab.setState({ emo: '🤔', title: c2.sTitle, lead: c2.sLead, body: c2.sQ, extra: '' });
    else lab.setState({ emo: ['🤔', '🌟', '💭'][S.choice], title: c2.out[S.choice][0], lead: c2.out[S.choice][1], body: c2.outBody, extra: '' });
  }
}

function r3(t) {
  const c3 = t.c3, pl = c3.places[S.place], rev = S.pred3 !== null;
  lab.setGlow('rgba(95, 168, 160, .26)');
  $('q3').innerHTML = rev ? '' : `<div class="mc-q"><p>${esc(c3.q)}</p><div class="mc-opts">${c3.opts.map((o, i) => `<button type="button" class="mc-b" data-act="ans3" data-i="${i}">${esc(o)}</button>`).join('')}</div></div>`;
  $('pchips').innerHTML = c3.places.map((p, i) => `<button type="button" class="chip mc-c ${S.place === i ? 'on' : ''}" style="--c:#5fa8a0" data-act="pl" data-i="${i}">${p.e} ${esc(p.n)}</button>`).join('');
  lab.setReadout(esc(`${pl.e} ${pl.n}`), c3.sub, '', '#5fa8a0');
  lab.setFacts(rev ? t.f3.concat(t.f3b) : t.f3);
  if (!rev) lab.setState({ emo: pl.e, title: c3.preTitle, lead: c3.preLead, body: '', extra: '' });
  else {
    const rows = stateRows([[pl.hob[0], `<b>${esc(c3.rows[0])}:</b> ${esc(pl.hob[1])}`], ['💬', `<b>${esc(c3.rows[1])}:</b> “${esc(pl.word)}”`], [pl.food[0], `<b>${esc(c3.rows[2])}:</b> ${esc(pl.food[1])}`]]);
    lab.setState({ emo: '❤️', title: `${S.pred3 === c3.ok ? c3.right : c3.wrong} ${c3.ansTitle}`, lead: c3.ansLead, body: c3.ansBody, extra: `${rows}<div class="mc-same"><b>${esc(c3.sameH)}:</b> ${esc(c3.same)}</div>` });
  }
}

// --- the canvas loop (last: everything it reads is declared above) -----------------------------------------------
let GEO = { k: 1, ox: 0, oy: 0 };
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const k = Math.min(w / W, h / H);
  KS = k; GEO = { k, ox: (w - W * k) / 2, oy: (h - H * k) / 2 };
  c.save(); c.translate(GEO.ox, GEO.oy); c.scale(k, k); c.lineJoin = 'round';
  const v = lab.view;
  if (v === 'circles') draw1(c, dt, time); else if (v === 'labels') draw2(c, dt); else draw3(c, dt, time);
  c.restore();
});
render();
</script>
