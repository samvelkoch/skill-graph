// --- the model: a 100 x 100 km map, three fixed points, a transport cost per tonne-km ----------------------------

const hyp = Math.hypot;
function mkLine(pts, kind) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + hyp(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, len: cum[cum.length - 1], kind };
}
const RIV = mkLine(RIVER, 'river');
// nearest point of a polyline: distance d, arc length s along the line, and the point itself
function proj(L, x, y, out) {
  let bd = 1e9, bs = 0, bx = 0, by = 0;
  for (let i = 0; i < L.pts.length - 1; i++) {
    const a = L.pts[i], b = L.pts[i + 1], dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
    const t = clamp(((x - a[0]) * dx + (y - a[1]) * dy) / l2, 0, 1), qx = a[0] + dx * t, qy = a[1] + dy * t, d = hyp(x - qx, y - qy);
    if (d < bd) { bd = d; bs = L.cum[i] + Math.sqrt(l2) * t; bx = qx; by = qy; }
  }
  out.d = bd; out.s = bs; out.x = bx; out.y = by;
  return out;
}
function pointAt(L, s) {
  let i = 1;
  while (i < L.pts.length - 1 && L.cum[i] < s) i++;
  const a = L.pts[i - 1], b = L.pts[i], t = (s - L.cum[i - 1]) / (L.cum[i] - L.cum[i - 1]);
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}

  let body = '';
  if (key === 'magn') body = `<path d="M6 60 L28 20 L40 38 L52 12 L78 60 Z" fill="url(#o)" stroke="#3d1a0e" stroke-width="1.6" stroke-linejoin="round"/>${arrowSvg(72, 50, 104, 62, '#ff9a68')}${plant(118, 76)}`;
  else if (key === 'ruhr') body = `<path d="M10 14 Q36 4 50 24 Q58 44 36 54 Q12 56 8 34 Z" fill="#2a2a33" stroke="#9aa0b4" stroke-width="1.6"/><path d="M118 0 C126 24 100 44 112 66 S126 84 120 92" stroke="#27678f" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M118 0 C126 24 100 44 112 66 S126 84 120 92" stroke="#4aa3e0" stroke-width="8" fill="none" stroke-linecap="round"/>${arrowSvg(52, 40, 78, 58, '#c8cde0')}${plant(88, 76)}`;
  else body = `<path d="M-6 70 C30 60 60 72 90 50 S140 26 168 30" stroke="#27678f" stroke-width="20" fill="none" stroke-linecap="round"/><path d="M-6 70 C30 60 60 72 90 50 S140 26 168 30" stroke="#4aa3e0" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M-6 70 C30 60 60 72 90 50 S140 26 168 30" stroke="#cfeaff" stroke-width="2" fill="none" opacity=".6"/>${arrowSvg(34, 60, 66, 53, '#cfeaff')}${plant(96, 40)}`;
  return `<svg viewBox="0 0 160 92" aria-hidden="true">${defs}${land}${body}</svg>`;
}

// --- one render per change: controls, readout and the state card -------------------------------------------------
function readout() {
  const t = T[lang], v = lab.view, [wO, wC] = curW(), net = curNet();
  if (v === 'triangle') {
    const val = S.tri ? t.cost(fmt(coins(tcost(net, S.tri.P.x, S.tri.P.y, ...W0)))) : '?';
    lab.setReadout(val, t.costSub, t.loads(nf(W0[0]), nf(W0[1])), '#e0a040');
  } else if (v === 'heavy') {
    const b = best(net, wO, wC);
    lab.setReadout(`${Math.round(hyp(b.x - O[0], b.y - O[1]))} ${t.km}`, t.cost(fmt(coins(b.T))), t.loads(nf(wO), nf(wC)), '#c0623a');
  } else {
    const b = best(net, ...W0);
    lab.setReadout(t.cost(fmt(coins(b.T))), t.costSub, S.R.river ? t.riverPill : t.loads(nf(W0[0]), nf(W0[1])), '#3b8fd0');
  }
}
function renderLive() { // the numbers that follow a dragged plant (no DOM rebuild)
  readout();
  if (lab.view !== 'triangle' || !S.tri) return;
  const t = T[lang], net = curNet(), b = best(net, ...W0), P = S.tri.P;
  const km = Math.round(hyp(P.x - b.x, P.y - b.y)), extra = Math.max(0, Math.round(coins(tcost(net, P.x, P.y, ...W0) - b.T)));
  const el = $('fsLive');
  if (el) { el.textContent = t.fromBest(km, fmt(extra)); el.style.color = km <= 7 ? 'var(--ok)' : 'var(--wip)'; }
}
function render() {
  const t = T[lang], v = lab.view, ans = answered(), net = curNet(), [wO, wC] = curW();
  document.body.dataset.v = v;
  buildHeat(net, wO, wC);
  $('cv').style.touchAction = v === 'triangle' || railing() ? 'none' : 'pan-y';
  $('fsHeavy').style.display = v === 'heavy' && ans ? 'block' : 'none';
  $('fsReal').style.display = v === 'real' && ans ? 'block' : 'none';
  // the question, the chips (they stay after the answer: right one green, a wrong tap red) and the verdict
  let ask = '';
  if (v === 'triangle') {
    ask = `<div class="fs-q">${esc(t.triAsk)}</div>`;
    if (S.tri) ask += `<div class="fs-v"><span style="color:${S.tri.right ? 'var(--ok)' : 'var(--wip)'}">${esc(S.tri.right ? t.triRight : t.triWrong)}</span><span class="fs-live" id="fsLive"></span></div>`;
  } else {
    const heavy = v === 'heavy', st = heavy ? S.H : S.R, right = heavy ? heavyRight() : realRight(), opts = heavy ? t.heavyOpts : t.realOpts;
    ask = `<div class="fs-q">${esc(heavy ? t.heavyAsk : t.realAsk)}</div><div class="chips">${(heavy ? HEAVY_ORDER : REAL_ORDER).map((i) =>
      `<button class="chip fs-c ${st.ans !== null ? 'fs-done' : ''} ${st.ans !== null && i === right ? 'fs-ok' : st.ans === i ? 'fs-bad' : ''}" type="button" data-pick="${i}">${esc(opts[i])}</button>`).join('')}</div>`;
    if (st.ans !== null) ask += `<div class="fs-v" style="color:${st.ans === right ? 'var(--ok)' : 'var(--wip)'}">${esc(st.ans === right ? (heavy ? t.heavyRight : t.realRight) : (heavy ? t.heavyWrong : t.realWrong))}</div>`;
  }
  $('fsAsk').innerHTML = ask;
  // sliders (built once; only their text and values change)
  $('fsWoL').textContent = t.oreW; $('fsWcL').textContent = t.coalW;
  const unit = lang === 'ru' ? 'т' : 't';
  $('fsWoV').textContent = `${nf(S.H.wO)} ${unit}`; $('fsWcV').textContent = `${nf(S.H.wC)} ${unit}`;
  if (+$('fsWo').value !== S.H.wO) $('fsWo').value = S.H.wO;
  if (+$('fsWc').value !== S.H.wC) $('fsWc').value = S.H.wC;
  // the river button and the real towns
  $('fsRiverB').textContent = `🌊 ${t.addRiver}`; $('fsRiverB').className = `chip fs-c ${S.R.river ? 'on' : ''}`;
  $('fsTownB').innerHTML = ['magn', 'ruhr', 'duna'].map((k) => `<button class="chip fs-c ${S.R.town === k ? 'on' : ''}" type="button" data-town="${k}">${esc(t.towns[k])}</button>`).join('');
  const tk = S.R.town;
  $('fsTown').innerHTML = tk ? `<div class="fs-tc">${sketch(tk)}<div><h4>${esc(t.towns[tk])}</h4><p>${esc(t.townText[tk])}</p><div class="fs-pulls">${
    (tk === 'magn' ? [['⛰️', 'ore']] : tk === 'ruhr' ? [['⚫', 'coal'], ['🌊', 'river']] : [['🌊', 'river']]).map(([e, k]) => `<span>${e} ${esc(t.pull[k])}</span>`).join('')}</div></div></div>` : '';
  // the two secrets
  const open = secret.unlocked(), dis = open && !ans ? ' fs-dis' : '';
  const sc = (k, emo, on) => `<button class="chip fs-c secret ${open ? 'open' : ''} ${on ? 'on' : ''}${dis}" type="button" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('fsSec').innerHTML = sc('a', '📐', S.sec === 'a') + sc('b', '🚂', S.sec === 'b' || !!S.rail);
  // readout, glow, state card, facts
  lab.setGlow(v === 'triangle' ? 'rgba(224, 160, 64, .26)' : v === 'heavy' ? 'rgba(192, 98, 58, .28)' : 'rgba(59, 143, 208, .28)');
  renderLive();
  let card;
  if (S.sec === 'a' && ans) card = { emo: '📐', title: t.secrets.a[0], lead: t.weberText, body: '' };
  else if (S.sec === 'b' && ans) card = { emo: '🚂', title: t.secrets.b[0], lead: S.rail ? t.secrets.b[1] : t.railText, body: '' };
  else if (v === 'triangle' || ans) { const s = t.st[v]; card = { emo: s[0], title: s[1], lead: s[2], body: s[3] }; }
  else card = { emo: t.st[v][0], title: v === 'heavy' ? t.heavyAsk : t.realAsk, lead: '', body: '' };
  lab.setState({ ...card, extra: '' });
  lab.setFacts(ans ? t.facts[v] : []);
}
render();
</script>
