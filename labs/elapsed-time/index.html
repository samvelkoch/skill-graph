function hopsOf(a, b) {
  const out = []; let cur = a;
  if (a % 60 !== 0) {
    const next = Math.ceil(a / 60) * 60;
    if (next >= b) return [{ from: a, to: b, kind: 'rest', min: b - a }];
    out.push({ from: a, to: next, kind: 'to', min: next - a }); cur = next;
  }
  const H = Math.floor((b - cur) / 60);
  if (H > 0) { out.push({ from: cur, to: cur + H * 60, kind: 'hours', min: H * 60 }); cur += H * 60; }
  if (b > cur) out.push({ from: cur, to: b, kind: 'rest', min: b - cur });
  return out;
}
// the same, backwards from b down to a
function hopsBack(b, a) {
  const out = []; let cur = b;

    out.push({ from: b, to: prev, kind: 'to', min: b - prev }); cur = prev;
  }
  const H = Math.floor((cur - a) / 60);
  if (H > 0) { out.push({ from: cur, to: cur - H * 60, kind: 'hours', min: H * 60 }); cur -= H * 60; }

}

// --- small drawing helpers -----------------------------------------------------------------------------------
const FONT = (g, px, wgt = 800) => `${wgt} ${Math.max(12, Math.round(px * g.k))}px Nunito, sans-serif`;
function pillW(c, g, txt, fs = 12.5) { c.font = FONT(g, fs); return c.measureText(txt).width + 16 * g.k; }
// text on a dark rounded pill, clamped inside the canvas
function pill(c, g, txt, cx, cy, o = {}) {
  const ph = Math.max(22, (o.h ?? 22) * g.k), pw = pillW(c, g, txt, o.fs);
  const x = clamp(cx - pw / 2, 4, Math.max(4, g.w - pw - 4));
  c.save(); c.globalAlpha = o.alpha ?? 1;
  c.fillStyle = 'rgba(8,10,22,.84)'; c.strokeStyle = o.color ?? 'rgba(224,230,240,.5)'; c.lineWidth = 1.5;
  c.beginPath(); c.roundRect(x, cy - ph / 2, pw, ph, ph / 2); c.fill(); c.stroke();
  c.fillStyle = o.text ?? '#fff'; c.font = FONT(g, o.fs ?? 12.5); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, x + pw / 2, cy + 1);
  c.restore(); return { x, w: pw, cx: x + pw / 2 };
}
const grad = (c, x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };

function drawTrain(c, g, x, y, a = 1) {
  const s = g.k; c.save(); c.globalAlpha = a; c.lineJoin = 'round';

  c.beginPath(); c.roundRect(x - 20 * s, y - 11 * s, 40 * s, 21 * s, [5 * s, 11 * s, 4 * s, 4 * s]); c.fill();
  c.shadowColor = 'transparent'; c.save(); c.clip();
  c.fillStyle = CORAL; c.fillRect(x - 20 * s, y + 2.5 * s, 40 * s, 3.5 * s);
  c.fillStyle = 'rgba(255,255,255,.45)'; c.fillRect(x - 20 * s, y - 11 * s, 40 * s, 2 * s); c.restore();
  c.lineWidth = 1.6; c.strokeStyle = INK; c.beginPath(); c.roundRect(x - 20 * s, y - 11 * s, 40 * s, 21 * s, [5 * s, 11 * s, 4 * s, 4 * s]); c.stroke();
  [-15, -5, 5].forEach((dx) => { c.fillStyle = DAY; c.beginPath(); c.roundRect(x + dx * s, y - 7.5 * s, 8 * s, 7 * s, 2 * s); c.fill(); c.strokeStyle = INK; c.lineWidth = 1; c.stroke(); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x + (dx + 1) * s, y - 6.7 * s, 2.5 * s, 1.5 * s); });
  c.fillStyle = DAY; c.beginPath(); c.moveTo(x + 14 * s, y - 7.5 * s); c.lineTo(x + 18 * s, y - 3 * s); c.lineTo(x + 14 * s, y - 1 * s); c.closePath(); c.fill();
  [-11, 11].forEach((dx) => { c.fillStyle = INK; c.beginPath(); c.arc(x + dx * s, y + 10.5 * s, 3.2 * s, 0, Math.PI * 2); c.fill(); c.fillStyle = '#6b7594'; c.beginPath(); c.arc(x + dx * s, y + 10.5 * s, 1.2 * s, 0, Math.PI * 2); c.fill(); });

}

}
function drawEmoji(c, g, ch, x, y, px = 22, a = 1) {

  c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 6; c.shadowOffsetY = 2; c.fillText(ch, x, y); c.restore();
}
function clockFace(c, g, cx, cy, r, h, m, col) {
  c.save(); r = Math.max(2, r);
  c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 6; c.shadowOffsetY = 2;
  const gr = c.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#aab5cf');
  c.fillStyle = gr; c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
  c.shadowColor = 'transparent'; c.lineWidth = 2.2; c.strokeStyle = col; c.stroke();
  c.strokeStyle = NIGHT; c.lineWidth = 1.2;
  for (let i = 0; i < 12; i++) { const an = i * Math.PI / 6, r1 = r * (i % 3 ? 0.82 : 0.74); c.beginPath(); c.moveTo(cx + Math.cos(an) * r1, cy + Math.sin(an) * r1); c.lineTo(cx + Math.cos(an) * r * 0.9, cy + Math.sin(an) * r * 0.9); c.stroke(); }
  const ha = ((h % 12) + m / 60) / 12 * Math.PI * 2 - Math.PI / 2, ma = m / 60 * Math.PI * 2 - Math.PI / 2;
  c.lineCap = 'round'; c.strokeStyle = NIGHT; c.lineWidth = 2.6; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(ha) * r * 0.5, cy + Math.sin(ha) * r * 0.5); c.stroke();
  c.strokeStyle = '#d9534f'; c.lineWidth = 1.8; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(ma) * r * 0.78, cy + Math.sin(ma) * r * 0.78); c.stroke();
  c.fillStyle = NIGHT; c.beginPath(); c.arc(cx, cy, 2, 0, Math.PI * 2); c.fill();
  c.restore();
}

// the shaded time line: day and night hours, ticks, hour labels, moons at midnight
function drawAxis(c, g, lit) {
  const { w, X, Y, k, vl, vr, ppm } = g, top = Y(LY - 12), bh = 15 * k, ly = Y(LY + 3);
  const h0 = Math.floor(vl / 60) - 1, h1 = Math.ceil(vr / 60) + 1;
  c.save();
  c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 10 * k; c.shadowOffsetY = 4 * k; c.fillStyle = DAY; c.fillRect(0, top, w, bh); c.restore();
  for (let h = h0; h <= h1; h++) {
    const hr = mod(h, 24), night = hr >= 21 || hr < 6, x0 = X(h * 60), x1 = X((h + 1) * 60);
    c.fillStyle = night ? NIGHT : DAY; c.fillRect(x0, top, x1 - x0 + 0.6, bh);
    if (night && 60 * ppm > 30) {
      c.fillStyle = 'rgba(224,230,240,.7)';
      for (let i = 0; i < 2; i++) { const sx = x0 + (((h * 37 + i * 53) % 29) / 29 * 0.8 + 0.1) * (x1 - x0), sy = top + (((h * 17 + i * 31) % 11) / 11 * 0.6 + 0.2) * bh; c.beginPath(); c.arc(sx, sy, 0.9 * k, 0, Math.PI * 2); c.fill(); }
    }
  }
  c.fillStyle = grad(c, 0, top, 0, top + bh, [[0, 'rgba(255,255,255,.14)'], [0.5, 'rgba(255,255,255,0)'], [1, 'rgba(0,0,0,.22)']]); c.fillRect(0, top, w, bh);
  c.strokeStyle = INK; c.lineWidth = 1; c.beginPath(); c.moveTo(0, top); c.lineTo(w, top); c.stroke();
  // moons at every midnight in view
  for (let m = Math.ceil(vl / 1440) * 1440; m <= vr; m += 1440) {
    const mx = X(m), my = Y(LY - 4.5), r = 5.5 * k;
    c.fillStyle = LINE; c.beginPath(); c.arc(mx, my, r, 0, Math.PI * 2); c.fill();
    c.fillStyle = NIGHT; c.beginPath(); c.arc(mx + r * 0.5, my - r * 0.2, r * 0.85, 0, Math.PI * 2); c.fill();
  }
  // the line itself and its ticks
  c.strokeStyle = LINE; c.lineWidth = 2 * k; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, ly); c.lineTo(w, ly); c.stroke();
  const step = [1, 2, 3, 6, 12].find((s) => 60 * s * ppm >= 30) ?? 24, full = 60 * step * ppm >= 46;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let h = Math.ceil(vl / 60); h <= Math.floor(vr / 60); h++) {
    const x = X(h * 60), big = mod(h, 6) === 0, col = lit.get(h * 60);
    c.strokeStyle = col ?? LINE; c.lineWidth = (big ? 2.4 : 1.3) * k; c.beginPath(); c.moveTo(x, ly); c.lineTo(x, Y(LY + (big ? 15 : 9))); c.stroke();
    if (mod(h, step) === 0 || (col && 60 * ppm >= 24)) {
      c.font = FONT(g, big ? 13 : 12, big ? 900 : 700); c.fillStyle = col ?? (big ? LINE : '#98A0B8');
      c.fillText(full ? `${pad2(mod(h, 24))}:00` : pad2(mod(h, 24)), clamp(x, 14, w - 14), Y(LY + 27));
    }
  }
  c.font = FONT(g, 12, 800); c.fillStyle = '#98A0B8';
  for (let m = Math.ceil(vl / 1440) * 1440; m <= vr; m += 1440) c.fillText(T[lang].midnight, clamp(X(m), 30, w - 30), Y(LY + 41));
}

// one hop arc: a half-ellipse that lands on the line; p = how much of it is drawn
function arcPath(c, x1, x2, y0, hh, p) {
  const n = 40; c.beginPath(); let px = x1, py = y0, ax = x1, ay = y0;
  for (let i = 0; i <= n; i++) {
    const t = i / n * p, an = Math.PI * t, x = x1 + (x2 - x1) * (1 - Math.cos(an)) / 2, y = y0 - hh * Math.sin(an);
    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    ax = px; ay = py; px = x; py = y;
  }
  return { x: px, y: py, dx: px - ax, dy: py - ay };
}
function drawArcs(c, g, hs, T_, back) {
  const { X, Y, k, w } = g, y0 = Y(LY - 14), t = T[lang];
  // labels first (their levels only depend on the full geometry), so they never collide
  const labs = hs.map((hp) => {
    const txt = hp.kind === 'hours' ? t.plusH(hp.min / 60) : t.plusM(hp.min), text = back ? txt.replace('+', '−') : txt;
    const pw = pillW(c, g, text), cx = clamp((X(hp.from) + X(hp.to)) / 2, pw / 2 + 4, w - pw / 2 - 4);
    return { text, pw, cx, hh: clamp(Math.abs(X(hp.to) - X(hp.from)) * 0.42, 14 * k, 62 * k), lv: 0 };
  });
  labs.forEach((l, i) => { while (labs.slice(0, i).some((q) => q.lv === l.lv && Math.abs(q.cx - l.cx) < (q.pw + l.pw) / 2 + 4)) l.lv++; });
  hs.forEach((hp, i) => {
    const p = ease((T_ - 0.55 - i * 0.95) / 0.9), col = KIND[hp.kind], x1 = X(hp.from), x2 = X(hp.to), L = labs[i];
    if (p <= 0.002) return;
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
    c.shadowColor = col; c.shadowBlur = 10; c.strokeStyle = col; c.lineWidth = Math.max(3, 4 * k);
    const tip = arcPath(c, x1, x2, y0, L.hh, p); c.stroke();
    c.shadowBlur = 0; c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 1.2;
    const len = Math.hypot(tip.dx, tip.dy) || 1, ux = tip.dx / len, uy = tip.dy / len, as = 7 * k;
    c.beginPath(); c.moveTo(tip.x + ux * as * 0.8, tip.y + uy * as * 0.8); c.lineTo(tip.x - ux * as + -uy * as * 0.7, tip.y - uy * as + ux * as * 0.7); c.lineTo(tip.x - ux * as + uy * as * 0.7, tip.y - uy * as - ux * as * 0.7); c.closePath(); c.fill(); c.stroke();
    c.restore();
    if (p > 0.55) pill(c, g, L.text, L.cx, y0 - L.hh - (15 + L.lv * 25) * k, { color: col, alpha: ease((p - 0.55) / 0.45) });
    if (p > 0.985) { c.save(); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 1.4; c.beginPath(); c.arc(x2, Y(LY - 4), 4.2 * k, 0, Math.PI * 2); c.fill(); c.stroke(); c.restore(); }
  });
}
function litOf(hs, T_) {
  const m = new Map();
  hs.forEach((hp, i) => { if (ease((T_ - 0.55 - i * 0.95) / 0.9) > 0.97 && hp.to % 60 === 0) m.set(hp.to, KIND[hp.kind]); });
  return m;
}
// the clock pills under the markers; they push each other apart and get a leader line when moved
function drawPills(c, g, items) {
  const { Y, k } = g, cy = Y(LY + 66);
  const ws = items.map((it) => { c.font = FONT(g, 12, 700); const lw = c.measureText(it.label).width; c.font = FONT(g, 16, 900); return { lw, tw: c.measureText(it.time).width }; });
  const pw = ws.map((o) => o.lw + o.tw + 24 * k), ph = 28 * k;
  let xs = items.map((it, i) => it.x - pw[i] / 2);
  if (items.length === 2) {
    const [a, b] = items; // a is the left one
    if (xs[0] + pw[0] + 6 > xs[1]) { const mid = (a.x + b.x) / 2; xs[0] = mid - 3 - pw[0]; xs[1] = mid + 3; }
    if (xs[0] < 4) { xs[0] = 4; xs[1] = Math.max(xs[1], 4 + pw[0] + 6); }
    if (xs[1] + pw[1] > g.w - 4) { xs[1] = g.w - 4 - pw[1]; xs[0] = Math.min(xs[0], xs[1] - pw[0] - 6); }
  }
  items.forEach((it, i) => {
    const x = clamp(xs[i], 4, Math.max(4, g.w - pw[i] - 4)), ccx = x + pw[i] / 2;
    if (Math.abs(ccx - it.x) > 10 * k) { c.save(); c.strokeStyle = it.color; c.globalAlpha = 0.6; c.lineWidth = 1.4; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(it.x, Y(LY + 33)); c.lineTo(ccx, cy - ph / 2); c.stroke(); c.restore(); }
    c.save(); c.globalAlpha = it.alpha ?? 1;
    c.fillStyle = 'rgba(8,10,22,.88)'; c.strokeStyle = it.color; c.lineWidth = 1.8; c.beginPath(); c.roundRect(x, cy - ph / 2, pw[i], ph, ph / 2); c.fill(); c.stroke();
    c.textBaseline = 'middle'; c.textAlign = 'left';
    c.font = FONT(g, 12, 700); c.fillStyle = '#98A0B8'; c.fillText(it.label, x + 11 * k, cy + 1);
    c.font = FONT(g, 16, 900); c.fillStyle = '#fff'; c.fillText(it.time, x + 11 * k + ws[i].lw + 4 * k, cy + 1);
    c.restore();
  });
}
// the bracket under everything: start → end, with the total in the middle
function drawTotal(c, g, a, b, txt, alpha) {
  const { X, Y, k } = g, x1 = X(a), x2 = X(b), y = Y(LY + 98);
  c.save(); c.globalAlpha = alpha; c.strokeStyle = LINE; c.lineWidth = 2 * k; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x1, y - 7 * k); c.lineTo(x1, y); c.lineTo(x2, y); c.lineTo(x2, y - 7 * k); c.stroke(); c.restore();
  pill(c, g, `= ${txt}`, (x1 + x2) / 2, y, { fs: 14, h: 26, color: LINE, alpha });
}
function handle(c, g, x, time) {
  const { Y, k } = g, y = Y(LY - 4), r = 24 * k;
  c.save(); c.strokeStyle = `rgba(255,255,255,${0.35 + 0.25 * Math.sin(time * 3.5)})`; c.lineWidth = 2; c.setLineDash([4, 4]);
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
  c.fillStyle = 'rgba(255,255,255,.75)';
  [-1, 1].forEach((d) => { c.beginPath(); c.moveTo(x + d * (r + 8 * k), y); c.lineTo(x + d * (r + 1 * k), y - 5 * k); c.lineTo(x + d * (r + 1 * k), y + 5 * k); c.closePath(); c.fill(); });
  c.restore();
}

// --- the scene of the current view ---------------------------------------------------------------------------
function scene(time) {
  const v = lab.view;
  if (S.sec === 'zone') return { kind: 'zone', key: 'zone', a: 840, b: 990, hs: hopsOf(840, 990), lo: 720, hi: 1065, T: time - S.secT0 };
  if (S.sec === 'back') return { kind: 'back', key: 'back', a: 1045, b: 1150, hs: hopsBack(1150, 1045), lo: 1000, hi: 1185, T: time - S.secT0 };
  const s = V[v], rev = s.pick !== null, Tm = !rev ? -1 : s.ready ? 99 : time - s.t0;
  if (v === 'trip') { const tr = tripOf(s.late); return { kind: 'trip', key: 'trip', s, tr, a: TA0, b: tr.end, hs: hopsOf(TA0, tr.end), lo: 520, hi: 810, T: Tm, rev }; }
  if (v === 'hops') {
    const pad = Math.max(30, 0.12 * (s.b - s.a)); let lo = s.a - pad, hi = s.b + pad;
    if (hi - lo < 200) { const m = (lo + hi) / 2; lo = m - 100; hi = m + 100; }
    return { kind: 'line', key: 'hops', s, a: s.a, b: s.b, hs: hopsOf(s.a, s.b), lo, hi, T: Tm, rev, veh: 'train' };
  }
  return { kind: 'line', key: 'midnight', s, a: s.a, b: s.b, hs: hopsOf(s.a, s.b), lo: Math.min(1200, s.a - 40), hi: Math.max(1620, s.b + 40), T: Tm, rev, veh: 'bus' };
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const t = T[lang], sc = scene(time), { hs } = sc;
  // the time window eases towards what the scene needs; while a marker is dragged it only grows
  let tl = sc.lo, th = sc.hi;
  if (drag && S.frz && sc.kind === 'line') { const e = 30 / Math.max(0.4, w / (win.hi - win.lo)); tl = Math.min(S.frz.lo, sc.a - e); th = Math.max(S.frz.hi, sc.b + e); }
  if (win.key !== sc.key) { win.lo = tl; win.hi = th; win.key = sc.key; }
  else { const e = 1 - Math.exp(-dt * 9); win.lo += (tl - win.lo) * e; win.hi += (th - win.hi) * e; }
  const ppm = Math.max(0.4, w / (win.hi - win.lo)), mid = (win.lo + win.hi) / 2, vl = mid - w / (2 * ppm), vr = vl + w / ppm;
  const k = clamp(Math.min(w / W0, h / H0), 0.6, 1.5), oy = (h - H0 * k) / 2;
  const g = { w, h, k, ppm, vl, vr, X: (m) => (m - vl) * ppm, Y: (d) => oy + d * k };
  const { X, Y } = g;
  const lit = sc.T >= 0 ? litOf(hs, sc.T) : new Map();

  // progress of the reveal: unlock the markers / the slider once the last hop has landed
  if (sc.kind === 'line' || sc.kind === 'trip') { if (sc.rev && !sc.s.ready && sc.T >= doneT(hs.length)) { sc.s.ready = true; render(); } }
  else if (!S.secDone && sc.T >= doneT(hs.length)) { S.secDone = true; render(); }

  drawAxis(c, g, lit);
  geo = null;

  if (sc.kind === 'line') {
    const { s } = sc, bx = X(s.a), ex = X(s.b);
    if (sc.rev) drawArcs(c, g, hs, sc.T, false);
    if (sc.veh === 'train') drawTrain(c, g, bx, Y(LY - 4)); else drawBus(c, g, bx, Y(LY - 4));
    drawFlag(c, g, ex, Y(LY - 4));
    if (s.ready) {
      handle(c, g, bx, time); handle(c, g, ex, time);
      geo = { drag: true, markers: [{ id: 'a', x: bx }, { id: 'b', x: ex }], vl, ppm, y0: Y(LY - 70), y1: Y(LY + 120) };
    }
    drawPills(c, g, [{ x: bx, label: t.start, time: hhmm(s.a), color: GOLD }, { x: ex, label: t.end, time: hhmm(s.b), color: CORAL }]);
    if (sc.rev) drawTotal(c, g, s.a, s.b, fmt(s.b - s.a), totA(sc.T, hs.length));
  } else if (sc.kind === 'trip') {
    const { tr } = sc, y1 = Y(LY - 10), bh = 11 * k;
    // the bus that left (red ghost) when the first train was late
    if (!tr.caught) {
      c.save(); c.fillStyle = 'rgba(255,90,90,.22)'; c.strokeStyle = RED; c.lineWidth = 1.6; c.setLineDash([5, 4]);
      c.beginPath(); c.roundRect(X(TB0), y1, (TB1 - TB0) * ppm, bh, 4 * k); c.fill(); c.stroke(); c.setLineDash([]);
      c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); const cx = X(TB0) + 13 * k, cy = y1 + bh / 2; c.moveTo(cx - 5, cy - 5); c.lineTo(cx + 5, cy + 5); c.moveTo(cx + 5, cy - 5); c.lineTo(cx - 5, cy + 5); c.stroke(); c.restore();
    }
    // wait: grey dashed
    if (tr.wait > 0) {
      c.save(); c.fillStyle = 'rgba(140,150,180,.16)'; c.strokeStyle = GREY; c.lineWidth = 1.6; c.setLineDash([5, 4]);
      c.beginPath(); c.roundRect(X(tr.arr), y1, tr.wait * ppm, bh, 4 * k); c.fill(); c.stroke(); c.restore();
    }
    // rides: gold bars
    const ride = (m0, m1) => {
      c.save(); c.fillStyle = grad(c, 0, y1, 0, y1 + bh, [[0, '#ffe59a'], [1, '#d3a031']]); c.strokeStyle = INK; c.lineWidth = 1.3;
      c.beginPath(); c.roundRect(X(m0), y1, (m1 - m0) * ppm, bh, 4 * k); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.4)'; c.fillRect(X(m0) + 4 * k, y1 + 1.5 * k, Math.max(0, (m1 - m0) * ppm - 8 * k), 1.5 * k); c.restore();
    };
    ride(TA0, tr.arr); ride(tr.dep, tr.end);
    if (sc.rev) drawArcs(c, g, hs, sc.T, false);
    drawTrain(c, g, X(TA0), Y(LY - 4));
    if (!tr.caught) drawBus(c, g, X(TB0), Y(LY - 4), 0.4);
    drawBus(c, g, X(tr.dep), Y(LY - 4));
    drawFlag(c, g, X(tr.end), Y(LY - 4));
    drawPills(c, g, [{ x: X(TA0), label: t.start, time: hhmm(TA0), color: GOLD }, { x: X(tr.end), label: t.end, time: hhmm(tr.end), color: CORAL }]);
    if (sc.rev) drawTotal(c, g, TA0, tr.end, fmt(tr.total), totA(sc.T, hs.length));
  } else if (sc.kind === 'zone') {
    const bx = X(840), ex = X(990), rows = [Y(LY + 62), Y(LY + 98)], r = 15 * k;
    drawArcs(c, g, hs, sc.T, false);
    drawEmoji(c, g, '✈️', bx, Y(LY - 6), 22); drawFlag(c, g, ex, Y(LY - 4));
    // guide lines from the markers down to the clocks
    c.save(); c.strokeStyle = 'rgba(224,230,240,.3)'; c.lineWidth = 1.2; c.setLineDash([3, 4]);
    [bx, ex].forEach((x) => { c.beginPath(); c.moveTo(x, Y(LY + 33)); c.lineTo(x, rows[0] - r); c.stroke(); }); c.restore();
    const names = [t.places.bud, t.places.lon];
    names.forEach((nm, i) => pill(c, g, nm, 0, rows[i], { fs: 12.5, h: 22, color: i ? CORAL : GOLD, text: '#fff' }));
    const clocks = [[[14, 0], [16, 30]], [[13, 0], [15, 30]]];
    const lp = names.map((nm) => pillW(c, g, nm)); // keep the row names clear of the clocks
    clocks.forEach((row, i) => row.forEach(([hh, mm], j) => {
      const cx = j ? ex : bx, a = i === 1 && j === 1 ? totA(sc.T, hs.length) : 1;
      if (cx - r < lp[i] + 10) return;
      c.save(); c.globalAlpha = a; clockFace(c, g, cx, rows[i], r, hh, mm, i ? CORAL : GOLD);
      c.fillStyle = '#fff'; c.font = FONT(g, 14, 900); c.textAlign = 'left'; c.textBaseline = 'middle'; c.shadowColor = 'rgba(0,0,0,.7)'; c.shadowBlur = 4;
      c.fillText(`${pad2(hh)}:${pad2(mm)}`, cx + r + 5 * k, rows[i] + 1); c.restore();
    }));
    const a2 = totA(sc.T, hs.length);
    if (a2 > 0.01) {
      c.save(); c.globalAlpha = a2; c.strokeStyle = CORAL; c.lineWidth = 1.6; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(ex, rows[0] + r); c.lineTo(ex, rows[1] - r); c.stroke(); c.restore();
      pill(c, g, t.plusH(1).replace('+', '−'), ex - r - 36 * k, (rows[0] + rows[1]) / 2, { color: CORAL, alpha: a2 });
    }
  } else { // back
    const bx = X(1045), ex = X(1150), done = totA(sc.T, hs.length);
    drawArcs(c, g, hs, sc.T, true);
    drawEmoji(c, g, '🎬', bx, Y(LY - 6), 22, done); drawFlag(c, g, ex, Y(LY - 4));
    drawPills(c, g, [{ x: bx, label: t.start, time: hhmm(1045), color: GOLD, alpha: done }, { x: ex, label: t.end, time: hhmm(1150), color: CORAL }]);
    drawTotal(c, g, 1045, 1150, fmt(105), done);
  }
  $('cv').style.cursor = geo ? 'grab' : 'default';
});

// --- dragging the markers ------------------------------------------------------------------------------------
function setMarker(id, m) {
  const v = lab.view, s = V[v];
  if (v === 'hops') {
    if (id === 'a') s.a = Math.max(clamp(m, 0, s.b - 1), s.b - 540); else s.b = clamp(m, s.a + 1, Math.min(s.a + 540, 2879));
  } else {
    if (id === 'a') s.a = Math.max(clamp(m, 1200, Math.min(1500, s.b - 1)), s.b - 360); else s.b = clamp(m, s.a + 1, Math.min(s.a + 360, 1740));
  }
}
const cv = $('cv');
cv.addEventListener('pointerdown', (ev) => {
  if (!geo?.drag) return;
  const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  if (py < geo.y0 || py > geo.y1) return;
  const [m0, m1] = geo.markers, d0 = Math.abs(px - m0.x), d1 = Math.abs(px - m1.x);
  if (Math.min(d0, d1) > 32) return;
  const id = d0 === d1 ? (px >= m0.x ? 'b' : 'a') : d0 < d1 ? 'a' : 'b';
  try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ }
  drag = { id, last: px, lastT: performance.now() }; S.frz = { lo: win.lo, hi: win.hi };
  cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag || !geo) return;
  const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, tn = performance.now();
  const speed = Math.abs(px - drag.last) / Math.max(1, tn - drag.lastT); // px per ms
  drag.last = px; drag.lastT = tn;
  const step = speed > 0.9 ? 5 : 1, raw = geo.vl + px / geo.ppm, m = Math.round(raw / step) * step, s = V[lab.view], was = s[drag.id];
  setMarker(drag.id, m);
  if (s[drag.id] !== was) { sfx.tick(); render(); }
});
const endDrag = () => { drag = null; S.frz = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('etChips').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-i]'); if (!b) return;
  const v = lab.view, s = V[v]; if (s.pick !== null) return;
  s.pick = +b.dataset.i; s.t0 = now() + 0.15; s.ready = false;
  (s.pick === RIGHT[v] ? sfx.good : sfx.bad)(); render(); showStage();
});
$('etRange').addEventListener('input', (ev) => { const s = V.trip; if (!s.ready) return; s.late = +ev.target.value; sfx.tick(); render(); });
$('etSec').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-k]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.k;
  S.sec = S.sec === k ? null : k; S.secT0 = now() + 0.15; S.secDone = false; sfx.click(); render(); if (S.sec) showStage();
});

// --- one render per change: controls, readout and the state card -------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, s = V[v], asked = s.pick !== null;
  const open = secret.unlocked(), sc = (k, emo, key) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-k="${k}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('etSec').innerHTML = sc('zone', '🌍', 'a') + sc('back', '⏪', 'b');
  $('etAsk').style.display = sec ? 'none' : 'block';
  $('etLate').style.display = !sec && v === 'trip' ? 'block' : 'none';
  $('etTT').style.display = !sec && v === 'trip' ? 'block' : 'none';
  lab.setGlow(sec === 'zone' ? 'rgba(244, 201, 93, .22)' : sec === 'back' ? 'rgba(46, 196, 182, .26)' : GLOW[v]);

  if (sec === 'zone') {
    lab.setReadout(esc(t.dur(2, 30)), `${t.places.bud} 14:00 → ${t.places.lon} 15:30`, '', GOLD);
    lab.setState({ emo: '🌍', title: t.secrets.a[0], lead: t.zoneText, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  if (sec === 'back') {
    lab.setReadout(S.secDone ? '17:25' : '?', `19:10 − ${t.dur(1, 45)}`, '', TEAL);
    lab.setState({ emo: '⏪', title: t.secrets.b[0], lead: S.secDone ? t.backText : t.secrets.b[1], body: '', extra: '' });
    lab.setFacts([]); return;
  }

  // the prediction: question, chips (kept after the answer), verdict
  const [qk, ok_, rk, wk] = ASK[v], right = RIGHT[v];
  $('etQ').textContent = t[qk];
  $('etChips').innerHTML = t[ok_].map((o, i) => `<button class="et-chip${asked ? ' done' : ''}${asked && i === right ? ' ok' : ''}${asked && i === s.pick && i !== right ? ' bad' : ''}" data-i="${i}">${esc(o)}</button>`).join('');
  const vd = $('etVerdict');
  vd.className = `et-verdict ${asked ? (s.pick === right ? 'ok' : 'bad') : ''}`;
  vd.textContent = asked ? (s.pick === right ? t[rk] : t[wk]) : '';
  vd.style.display = asked ? '' : 'none';

  const st = t.st[v], extra = asked && v === 'hops' ? `<div class="et-note">${esc(t.why60)}</div>` : '';
  lab.setFacts(t.facts[v]);
  if (v === 'trip') {
    const tr = tripOf(s.late);
    $('etLateL').textContent = t.late; $('etLateV').textContent = s.late ? t.plusM(s.late) : t.dur(0, 0);
    $('etRange').disabled = !s.ready; $('etRange').value = String(s.late);
    const row = (nm, ico, a, b, cls = '') => `<span class="nm">${ico} ${esc(nm)}</span><span class="tm ${cls}">${a}</span><span class="tm ${cls}">${b}</span>`;
    const arrTxt = s.late ? `<s>${hhmm(TA1)}</s> <span class="late">${hhmm(tr.arr)}</span>` : hhmm(TA1);
    $('etTT').innerHTML = `<div class="et-tt-h">${esc(t.timetable)}</div><div class="et-tt-g">
      <span></span><span class="hd">${esc(t.from)}</span><span class="hd">${esc(t.to)}</span>
      ${row(t.trainA, '🚆', `${esc(t.places.bud)} ${hhmm(TA0)}`, `${esc(t.places.szol)} ${arrTxt}`)}
      ${row(t.busB, '🚌', `${esc(t.places.szol)} ${hhmm(TB0)}`, `${esc(t.places.kecs)} ${hhmm(TB1)}`, tr.caught ? '' : 'miss')}
      <span class="nx${tr.caught ? '' : ' on'}">↳</span><span class="tm nx${tr.caught ? '' : ' on'}">${esc(t.nextBus)}</span><span class="tm nx${tr.caught ? '' : ' on'}">${esc(t.places.kecs)} ${hhmm(TN1)}</span></div>`;
    if (asked) lab.setReadout(esc(fmt(tr.total)), tr.wait > 0 ? t.rideWait(fmt(tr.ride), fmt(tr.wait)) : `${t.ride} ${fmt(tr.ride)}`, tr.caught ? t.caught : t.missed, CORAL);
    else lab.setReadout('?', '', '', CORAL);
  } else {
    const hs = hopsOf(s.a, s.b);
    if (asked) {
      const cross = Math.floor(s.b / 1440) > Math.floor(s.a / 1440);
      lab.setReadout(esc(fmt(s.b - s.a)), t.span(hhmm(s.a), hhmm(s.b)), v === 'midnight' && cross ? t.pastMidnight : t.sumPill(hs.map((hp) => fmt(hp.min))), ACC[v]);
    } else lab.setReadout('?', t.span(hhmm(s.a), hhmm(s.b)), '', ACC[v]);
  }
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: asked ? st[3] : '', extra });
}
render();
</script>
