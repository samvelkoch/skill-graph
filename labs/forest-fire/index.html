// --- model constants ---------------------------------------------------------------------------------------
const N = 60;                 // the grid is N x N cells
const WIND_P = 0.5, WIND_JUMP = 2; // illustrative: with wind, a burning tree may also light the tree 2 cells downwind (to the east)
const PC4 = 59, PC8 = 41;     // site-percolation thresholds 0.5927 (4 neighbours) and 0.407 (8 neighbours), as percent
const DENS = []; for (let d = 30; d <= 80; d += 2) DENS.push(d);
const PER = 20;               // forests per density in "Many"
const STEP_DT = 0.055;        // seconds per fire step on screen
const BREAK_DENS = 70;        // forest density in "Better"

// --- the model ---------------------------------------------------------------------------------------------
// cell states: 0 bare soil, 1 tree, 2 burning, 3 ember, 4 ash
const mulberry = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rseed = () => Math.floor(Math.random() * 4294967296);
function plant(dens, rnd) { // dens in 0..1
  const g = new Uint8Array(N * N);
  for (let i = 0; i < g.length; i++) g[i] = rnd() < dens ? 1 : 0;
  return g;
}
const countOf = (g, v) => { let n = 0; for (let i = 0; i < g.length; i++) if (g[i] === v) n++; return n; };
function ignite(g, cl) { // the fire starts along the left edge: every tree of column 0 burns at step 0
  const st = new Uint8Array(N * N);
  for (let i = 0; i < st.length; i++) st[i] = g[i] && !(cl && cl[i]) ? 1 : 0;
  for (let y = 0; y < N; y++) if (st[y * N] === 1) st[y * N] = 2;
  return { st, n: 0, crossStep: -1, burning: countOf(st, 2), burnt: countOf(st, 2), trees0: countOf(st, 1) + countOf(st, 2), over: false };
}
function stepSim(sim, wind) {
  const st = sim.st, nx = st.slice();
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x, s = st[i];
    if (s === 2) nx[i] = 3;
    else if (s === 3) nx[i] = 4;
    else if (s === 1) {
      let hit = (x > 0 && st[i - 1] === 2) || (x < N - 1 && st[i + 1] === 2) || (y > 0 && st[i - N] === 2) || (y < N - 1 && st[i + N] === 2);
      if (!hit && wind && x >= WIND_JUMP && st[i - WIND_JUMP] === 2 && Math.random() < WIND_P) hit = true;
      if (hit) nx[i] = 2;
    }
  }
  sim.st = nx; sim.n++;
  let b = 0, e = 0, burnt = 0;
  for (let i = 0; i < nx.length; i++) { const v = nx[i]; if (v === 2) { b++; burnt++; if (i % N === N - 1 && sim.crossStep < 0) sim.crossStep = sim.n; } else if (v === 3) { e++; burnt++; } else if (v === 4) burnt++; }
  sim.burning = b; sim.burnt = burnt; sim.over = b === 0 && e === 0;
}
// does the fire cross at all? (used for the many-forests sweep; same rule as the step model, without the animation)
function crosses(g, nb8) {
  const seen = new Uint8Array(N * N), stack = [];
  for (let y = 0; y < N; y++) { const i = y * N; if (g[i]) { seen[i] = 1; stack.push(i); } }
  while (stack.length) {
    const i = stack.pop(), x = i % N, y = (i / N) | 0;
    if (x === N - 1) return true;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if ((!dx && !dy) || (!nb8 && dx && dy)) continue;
      const X = x + dx, Y = y + dy;
      if (X < 0 || Y < 0 || X >= N || Y >= N) continue;
      const j = Y * N + X;
      if (g[j] && !seen[j]) { seen[j] = 1; stack.push(j); }
    }
  }
  return false;
}
// can a fire get through at all, if every possible jump happens? (the union of all possible spreading links)
function canCross(g, cl, wind) {
  const seen = new Uint8Array(N * N), stack = [];
  for (let y = 0; y < N; y++) { const i = y * N; if (g[i] && !cl[i]) { seen[i] = 1; stack.push(i); } }
  while (stack.length) {
    const i = stack.pop(), x = i % N;
    if (x === N - 1) return true;
    const near = [];
    if (x > 0) near.push(i - 1);
    if (x < N - 1) near.push(i + 1);
    if (i >= N) near.push(i - N);
    if (i < N * N - N) near.push(i + N);
    if (wind && x + WIND_JUMP < N) near.push(i + WIND_JUMP);
    for (const j of near) if (g[j] && !cl[j] && !seen[j]) { seen[j] = 1; stack.push(j); }
  }
  return false;
}
// fewest trees to clear so that no fire can cross: a minimum vertex cut (max-flow, every tree has capacity 1)
function minCut(g, wind) {
  const n = N * N, SRC = 2 * n, SNK = SRC + 1, V = SNK + 1, INF = 1e9;
  const head = new Int32Array(V).fill(-1), to = [], cap = [], nxt = [];
  const add = (a, b, c) => { to.push(b); cap.push(c); nxt.push(head[a]); head[a] = to.length - 1; to.push(a); cap.push(0); nxt.push(head[b]); head[b] = to.length - 1; };
  for (let i = 0; i < n; i++) {
    if (!g[i]) continue;
    const x = i % N, y = (i / N) | 0;
    add(2 * i, 2 * i + 1, 1);
    if (x > 0 && g[i - 1]) add(2 * i + 1, 2 * (i - 1), INF);
    if (x < N - 1 && g[i + 1]) add(2 * i + 1, 2 * (i + 1), INF);
    if (y > 0 && g[i - N]) add(2 * i + 1, 2 * (i - N), INF);
    if (y < N - 1 && g[i + N]) add(2 * i + 1, 2 * (i + N), INF);
    if (wind && x + WIND_JUMP < N && g[i + WIND_JUMP]) add(2 * i + 1, 2 * (i + WIND_JUMP), INF);
    if (x === 0) add(SRC, 2 * i, INF);
    if (x === N - 1) add(2 * i + 1, SNK, INF);
  }
  let flow = 0;
  const prev = new Int32Array(V);
  for (;;) {
    prev.fill(-1); prev[SRC] = -2;
    const q = [SRC];
    for (let qi = 0; qi < q.length && prev[SNK] === -1; qi++) {
      const u = q[qi];
      for (let e = head[u]; e !== -1; e = nxt[e]) if (cap[e] > 0 && prev[to[e]] === -1) { prev[to[e]] = e; q.push(to[e]); }
    }
    if (prev[SNK] === -1) return flow;
    let v = SNK;
    while (v !== SRC) { const e = prev[v]; cap[e] -= 1; cap[e ^ 1] += 1; v = to[e ^ 1]; }
    flow++;
  }
}

const crown = (x, p, pal, r = .46, shadow = true) => {
  const cx = .5, cy = .46;
  if (shadow) { x.fillStyle = 'rgba(0,0,0,.34)'; x.beginPath(); x.ellipse(p * (cx + .07), p * (cy + .13), p * r * .95, p * r * .78, 0, 0, 7); x.fill(); }

  x.fillStyle = g; x.beginPath(); x.arc(p * cx, p * cy, p * r, 0, 7); x.fill();
  x.lineWidth = Math.max(.6, p * .05); x.strokeStyle = 'rgba(0,0,0,.38)'; x.stroke();
  x.fillStyle = 'rgba(255,255,255,.24)'; x.beginPath(); x.ellipse(p * (cx - .14), p * (cy - .16), p * .12, p * .075, -.6, 0, 7); x.fill();
};

        const g = x.createLinearGradient(0, s * .1, 0, s * .7); g.addColorStop(0, '#fff6c0'); g.addColorStop(1, '#ff8a1e');
        x.fillStyle = g; x.beginPath(); x.moveTo(s * .5, s * .02); x.bezierCurveTo(s * .8, s * .3, s * .82, s * .56, s * .5, s * .64); x.bezierCurveTo(s * .18, s * .56, s * .22, s * .3, s * .5, s * .02); x.fill();
      }),
      ember: mk((x, s) => { crown(x, s, ['#ff9060', '#9c2f1d', '#401109'], .43); x.fillStyle = 'rgba(255,170,90,.85)'; x.beginPath(); x.arc(s * .4, s * .5, s * .07, 0, 7); x.arc(s * .6, s * .4, s * .06, 0, 7); x.fill(); }),

const pillText = (c, text, x, y, align = 'left') => {

  const tw = c.measureText(text).width + 16, bx = align === 'right' ? x - tw : align === 'center' ? x - tw / 2 : x;
  c.fillStyle = 'rgba(10,12,20,.82)'; c.beginPath(); c.roundRect(bx, y - 11, tw, 22, 11); c.fill();

};
const board = (w, h) => {
  const pad = 10, top = 32, side = Math.max(60, Math.min(w - 2 * pad - 8, h - top - pad));

// --- drawing: the forest ---------------------------------------------------------------------------------------
function drawGrid(c, B, st, cl, skin, time, t, opt) {
  const coffee = skin === 'coffee', sp = sprites(B.cs, skin);
  c.save();
  c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 16; c.shadowOffsetY = 4;
  const bg = c.createLinearGradient(B.x, B.y, B.x + B.s, B.y + B.s);
  if (coffee) { bg.addColorStop(0, '#3a2518'); bg.addColorStop(1, '#1d110a'); } else { bg.addColorStop(0, '#4a3b2d'); bg.addColorStop(1, '#2c231b'); }
  c.fillStyle = bg; c.beginPath(); c.roundRect(B.x - 3, B.y - 3, B.s + 6, B.s + 6, 8); c.fill();
  c.restore();
  const cs = B.cs, sz = cs + 0.7;
  const burning = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x, v = st[i], X = B.x + x * cs, Y = B.y + y * cs;
    if (v === 0) {
      if (coffee) c.drawImage(sp.grain, X, Y, sz, sz);
      else if (cl && cl[i]) c.drawImage(sp.cleared, X, Y, sz, sz);
    } else if (v === 1) c.drawImage(sp.tree[(x * 7 + y * 13) & (sp.tree.length - 1)] ?? sp.tree[0], X, Y, sz, sz);
    else if (v === 2) { c.drawImage(sp.fire, X, Y, sz, sz); burning.push(X, Y, i); }
    else if (v === 3) c.drawImage(sp.ember, X, Y, sz, sz);
    else c.drawImage(sp.ash, X, Y, sz, sz);
  }
  // glow of the burning cells
  if (burning.length) {
    c.save(); c.globalCompositeOperation = 'lighter';
    for (let k = 0; k < burning.length; k += 3) {
      c.globalAlpha = clamp(0.55 + 0.3 * Math.sin(time * 11 + burning[k + 2] * 1.7), 0.2, 1, );
      c.drawImage(sp.glow, burning[k] - cs * 1.1, burning[k + 1] - cs * 1.1, cs * 3.2, cs * 3.2);
    }
    c.restore();
  }
  // the starting edge and the goal edge
  const fl = 0.7 + 0.3 * Math.sin(time * 8);
  const eg = c.createLinearGradient(B.x - 9, 0, B.x, 0);
  eg.addColorStop(0, coffee ? 'rgba(90,180,255,0)' : 'rgba(255,140,40,0)'); eg.addColorStop(1, coffee ? `rgba(120,200,255,${.85 * fl})` : `rgba(255,170,60,${.9 * fl})`);
  c.fillStyle = eg; c.fillRect(B.x - 9, B.y, 9, B.s);
  c.save(); c.setLineDash([5, 4]); c.strokeStyle = (opt && opt.reached) ? `rgba(255,170,60,${.6 + .4 * fl})` : 'rgba(120,225,200,.55)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(B.x + B.s + 5, B.y); c.lineTo(B.x + B.s + 5, B.y + B.s); c.stroke(); c.restore();
  pillText(c, `${coffee ? '💧' : '🔥'} ${coffee ? t.water.el : t.el}`, Math.max(6, B.x - 6), 17);
  pillText(c, t.er, Math.min(c.canvas.clientWidth - 6, B.x + B.s + 8), 17, 'right');
}

// --- drawing: the chart of "many forests" ------------------------------------------------------------------------
function drawChart(c, w, h, time, t) {
  const m = S.m, L = 48, R = w - 16, Tp = 30, Bt = h - 46;
  const X = (d) => L + (d - 30) / 50 * (R - L), Y = (f) => Bt - f * (Bt - Tp);
  c.save();
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#171b2e'); bg.addColorStop(1, '#0f1220');
  c.fillStyle = bg; c.beginPath(); c.roundRect(6, 6, w - 12, h - 12, 14); c.fill();
  c.font = '700 12px Nunito, sans-serif'; c.textBaseline = 'middle'; c.lineWidth = 1;
  for (const f of [0, .5, 1]) {
    c.strokeStyle = f === 0 ? 'rgba(200,210,255,.4)' : 'rgba(200,210,255,.14)'; c.beginPath(); c.moveTo(L, Y(f)); c.lineTo(R, Y(f)); c.stroke();
    c.fillStyle = '#98A0B8'; c.textAlign = 'right'; c.fillText(`${f * 100}`, L - 8, Y(f));
  }
  c.textAlign = 'center';
  for (let d = 30; d <= 80; d += 10) { c.strokeStyle = 'rgba(200,210,255,.08)'; c.beginPath(); c.moveTo(X(d), Tp); c.lineTo(X(d), Bt); c.stroke(); c.fillStyle = '#98A0B8'; c.fillText(d, X(d), Bt + 14); }
  c.fillStyle = '#c6cde0'; c.fillText(t.many.xl, (L + R) / 2, Bt + 33);
  c.textAlign = 'left'; c.fillText(t.many.yl, L, 17);
  const curve = (data, color, wid, alpha, fill) => {
    if (!data.length) return;
    const pts = data.map(([d, f]) => [X(d), Y(f)]);
    c.save(); c.globalAlpha = alpha; c.lineJoin = 'round'; c.lineCap = 'round';
    const path = () => { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length - 1; i++) c.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2); if (pts.length > 1) c.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]); };
    if (fill && pts.length > 1) { path(); c.lineTo(pts[pts.length - 1][0], Bt); c.lineTo(pts[0][0], Bt); c.closePath(); const g = c.createLinearGradient(0, Tp, 0, Bt); g.addColorStop(0, 'rgba(255,170,60,.30)'); g.addColorStop(1, 'rgba(255,170,60,0)'); c.fillStyle = g; c.fill(); }
    path(); c.strokeStyle = color; c.lineWidth = wid; c.stroke();
    c.restore();
    return pts;
  };
  if (m.guess === null) {
    pillText(c, t.many.wait, w / 2, (Tp + Bt) / 2, 'center');
  } else {
    if (m.nb8 && m.prev4) curve(m.prev4, '#98A0B8', 2, .5, false);
    if (m.done) { // the theory line, only after the reveal
      const th = m.nb8 ? PC8 : PC4;
      c.save(); c.setLineDash([5, 4]); c.strokeStyle = 'rgba(120,225,200,.8)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(X(th), Tp); c.lineTo(X(th), Bt); c.stroke(); c.restore();
      pillText(c, t.many.theory(th), clamp(X(th) + 6, L, R - 100), Tp + 14);
    }
    const pts = curve(m.data, '#ffb347', 3.2, 1, true);
    if (pts) for (let i = 0; i < pts.length; i++) {
      c.fillStyle = '#ffd37a'; c.strokeStyle = '#7a4a10'; c.lineWidth = 1.5; c.beginPath(); c.arc(pts[i][0], pts[i][1], 3.6, 0, 7); c.fill(); c.stroke();
    }
    if (!m.done && m.data.length) { const [d, f] = m.data[m.data.length - 1]; c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1; c.beginPath(); c.arc(X(d), Y(f), 7 + 2 * Math.sin(time * 10), 0, 7); c.stroke(); }
    c.font = '700 12px Nunito, sans-serif';
    if (m.nb8 && m.prev4) pillText(c, `${t.many.nb8}`, R, Tp + 14, 'right'); else pillText(c, `${m.nb8 ? t.many.nb8 : t.many.nb4}`, R, Tp + 14, 'right');
  }
  c.restore();
}

// --- the animation loop --------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view, t = T[lang];
  c.lineJoin = 'round';
  if (v === 'many') { sweepTick(dt); drawChart(c, w, h, time, t); return; }
  const B = board(w, h); S.geo = B;
  if (v === 'run') {
    if (S.p1 === 'run' && S.sim) {
      S.acc += dt;
      let k = 0;
      while (S.acc >= STEP_DT && k < 3 && !S.sim.over) { S.acc -= STEP_DT; stepSim(S.sim, false); k++; }
      if (k) { if (S.sim.over) finish1(); else render(); }
    }
    const st = S.sim ? S.sim.st : S.g;
    drawGrid(c, B, st, null, S.skin, time, t, { reached: S.sim && S.sim.crossStep >= 0 });
  } else {
    const b = S.b;
    if (b.phase === 'run' && b.sim) {
      S.acc += dt;
      let k = 0;
      while (S.acc >= STEP_DT && k < 3 && !b.sim.over) { S.acc -= STEP_DT; stepSim(b.sim, b.wind); k++; }
      if (k) { if (b.sim.over) finish3(); else render(); }
    }
    let st = b.sim && (b.phase === 'run' || b.phase === 'done') ? b.sim.st : null;
    if (!st) { st = new Uint8Array(N * N); for (let i = 0; i < st.length; i++) st[i] = b.g[i] && !b.cl[i] ? 1 : 0; }
    drawGrid(c, B, st, b.cl, null, time, t, { reached: b.sim && b.sim.crossStep >= 0 });
    if (b.wind) { // wind streaks moving east
      c.save(); c.strokeStyle = 'rgba(220,235,255,.22)'; c.lineWidth = 2; c.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const y = B.y + B.s * (i + .5) / 6 + Math.sin(i * 2.1) * 6, ph = (time * 70 + i * 61) % (B.s + 50), x = B.x - 25 + ph;
        c.beginPath(); c.moveTo(x, y); c.bezierCurveTo(x + 8, y - 5, x + 16, y + 5, x + 26, y); c.stroke();
      }
      c.restore();
      pillText(c, `💨 ${t.wind}`, w / 2 + 3, 17, 'center');
    }
  }
});

// --- many forests: one density per tick ---------------------------------------------------------------------------
function startSweep() { const m = S.m; m.data = []; m.i = 0; m.acc = 0; m.done = false; }
function sweepTick(dt) {
  const m = S.m;
  if (lab.view !== 'many' || m.guess === null || m.done) return;
  m.acc += dt;
  if (m.acc < 0.09) return;
  m.acc = 0;
  const d = DENS[m.i]; let c = 0;
  for (let k = 0; k < PER; k++) if (crosses(plant(d / 100, Math.random), m.nb8)) c++;
  m.data.push([d, c / PER]); m.i++;
  if (m.i >= DENS.length) { m.done = true; sfx.good(); render(); showStage(); } else render();
}
function stats(data) {
  let lo = data[0][0], hi = null, d50 = null;
  for (const [d, f] of data) if (f <= 0.1) lo = d;
  for (const [d, f] of data) if (f >= 0.9) { hi = d; break; }
  for (let i = 0; i < data.length; i++) if (data[i][1] >= 0.5) {
    if (i === 0) d50 = data[0][0]; else { const [d0, f0] = data[i - 1], [d1, f1] = data[i]; d50 = d0 + (0.5 - f0) / (f1 - f0) * (d1 - d0); }
    break;
  }
  return { lo, hi: hi ?? data[data.length - 1][0], d50: d50 === null ? data[data.length - 1][0] : Math.round(d50) };
}

// --- helpers for the three views -----------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const setHTML = (el, html) => { if (el.dataset.h !== html) { el.dataset.h = html; el.innerHTML = html; } };
const pct = (sim) => Math.round(100 * sim.burnt / Math.max(1, sim.trees0));
const rulesCard = (tr) => `<div class="ff-card"><b>${esc(tr.rulesH)}</b><ul>${tr.rules.map((r) => `<li>${esc(r)}</li>`).join('')}</ul></div>`;
const newForest1 = () => { S.g = plant(S.dens / 100, mulberry(rseed())); S.sim = null; S.p1 = 'plan'; S.guess1 = null; };

function finish1() {
  const crossed = S.sim.crossStep >= 0;
  S.h.push({ d: S.dens, g: S.guess1, c: crossed, w: !!S.skin });
  S.p1 = 'done';
  (S.guess1 === (crossed ? 'yes' : 'no') ? sfx.good : sfx.bad)();
  render(); showStage();
}
function finish3() {
  const b = S.b, crossed = b.sim.crossStep >= 0, key = `${b.wind ? 1 : 0}`;
  if (b.bestKey !== key) { b.best = minCut(b.g, b.wind); b.bestKey = key; }
  b.res = { crossed, safe: !canCross(b.g, b.cl, b.wind), gap: canCross(b.g, b.cl, false), n: countOf(b.cl, 1) };
  b.phase = 'done';
  (!crossed ? sfx.good : sfx.bad)();
  render(); showStage();
}

// drawing the firebreak: drag over the trees (a swipe that starts on a tree clears, on a cleared cell restores)
const cellAt = (ev) => {
  const r = $('cv').getBoundingClientRect(), B = S.geo;
  const x = Math.floor((ev.clientX - r.left - B.x) / B.cs), y = Math.floor((ev.clientY - r.top - B.y) / B.cs);
  return x < 0 || y < 0 || x >= N || y >= N ? null : [x, y];
};
function paintAt(x, y) {
  const b = S.b, k = b.brush;
  for (let dy = 0; dy < k; dy++) for (let dx = 0; dx < k; dx++) {
    const X = x + dx, Y = y + dy;
    if (X >= N || Y >= N) continue;
    const i = Y * N + X;
    if (b.paint === 'clear') { if (b.g[i]) b.cl[i] = 1; } else b.cl[i] = 0;
  }
}
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'better' || S.b.phase === 'run') return;
  const c = cellAt(ev); if (!c) return;
  const b = S.b, i = c[1] * N + c[0];
  b.paint = b.g[i] && !b.cl[i] ? 'clear' : b.cl[i] ? 'restore' : 'clear';
  b.last = c; editedStrip(); paintAt(c[0], c[1]); sfx.tick();
  try { $('cv').setPointerCapture(ev.pointerId); } catch { /* no capture */ }
  render();
});
$('cv').addEventListener('pointermove', (ev) => {
  const b = S.b; if (!b.paint || lab.view !== 'better') return;
  const c = cellAt(ev); if (!c || !b.last) return;
  const [x0, y0] = b.last, n = Math.max(Math.abs(c[0] - x0), Math.abs(c[1] - y0));
  for (let s = 1; s <= n; s++) paintAt(Math.round(x0 + (c[0] - x0) * s / n), Math.round(y0 + (c[1] - y0) * s / n));
  b.last = c; render();
});
const endPaint = () => { S.b.paint = null; S.b.last = null; };
$('cv').addEventListener('pointerup', endPaint);
$('cv').addEventListener('pointercancel', endPaint);

// --- render: controls, readout, state card and facts -----------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('v1').style.display = v === 'run' ? '' : 'none';
  $('v2').style.display = v === 'many' ? '' : 'none';
  $('v3').style.display = v === 'better' ? '' : 'none';

  if (v === 'run') render1(t); else if (v === 'many') render2(t); else render3(t);
}

function render1(t) {

  $('ask').style.display = S.p1 === 'plan' ? '' : 'none';
  $('askQ').textContent = tr.q; $('aYes').textContent = tr.yes; $('aNo').textContent = tr.no;
  $('newF').textContent = tr.newf; $('newF').disabled = run;
  const open = secret.unlocked();
  $('cof').textContent = open ? `☕ ${t.secrets.a[0]}` : '🔒 ???'; $('cof').classList.toggle('open', open); $('cof').classList.toggle('on', !!S.skin); $('cof').disabled = run;
  setHTML($('hist'), S.h.length ? `<span class="k">${esc(t.run.hist)}</span>${S.h.slice(-6).map((r) => { const ok = r.g === (r.c ? 'yes' : 'no'); return `<span class="ff-h ${ok ? 'ok' : 'no'}">${r.d}% ${r.c ? (r.w ? '💧' : '🔥') : '🛑'} ${ok ? '✓' : '✗'}</span>`; }).join('')}` : '');
  const extra = S.skin ? `<div class="ff-card">${esc(t.water.note)}</div>` : rulesCard(t.run);
  lab.setReadout(`${sim ? pct(sim) : 0}%`, tr.sub, tr.pill(S.dens), S.skin ? '#4ea8ff' : '#ff8a3a');
  if (S.p1 === 'plan') lab.setState({ emo: S.skin ? '☕' : '🌲', title: tr.t0(S.dens), lead: tr.l0, body: tr.q, extra });
  else if (run) lab.setState({ emo: S.skin ? '💧' : '🔥', title: tr.tb, lead: tr.lb(sim.n, sim.burning), body: '', extra });
  else {
    const crossed = sim.crossStep >= 0, ok = S.guess1 === (crossed ? 'yes' : 'no'), p = pct(sim);
    lab.setState({ emo: ok ? '✅' : '🤔', title: `${ok ? t.run.okv : t.run.nov} ${crossed ? tr.cross : tr.stop}`,
      lead: crossed ? tr.crossL(sim.crossStep, p) : tr.stopL(sim.n, p), body: t.run.again, extra });
  }
  const fl = [t.facts.hist, t.facts.full]; if (S.skin) fl.unshift(t.facts.coffee);
  lab.setFacts(fl);
}

function render2(t) {
  const m = S.m, tm = t.many, gated = S.h.length < 3, asking = !gated && m.guess === null;
  lab.setGlow('rgba(78, 168, 255, .25)');
  $('gate').style.display = gated ? '' : 'none';
  $('gateT').textContent = tm.gate; $('gateB').textContent = tm.gateBtn;
  $('ask2').style.display = asking ? '' : 'none';
  $('askQ2').textContent = tm.q;
  setHTML($('opts2'), ['line', 'jump', 'flat'].map((k) => `<button class="ff-opt" data-g="${k}">${ICON[k]}<span>${esc(tm.opts[k])}</span></button>`).join(''));
  const open = secret.unlocked();
  $('again2').textContent = tm.again; $('again2').style.display = !gated && m.guess !== null ? '' : 'none'; $('again2').disabled = !m.done;
  $('nb8').textContent = open ? `🔀 ${t.secrets.b[0]}` : '🔒 ???'; $('nb8').classList.toggle('open', open); $('nb8').classList.toggle('on', m.nb8);
  $('nb8').style.display = !gated && m.guess !== null ? '' : 'none'; $('nb8').disabled = open && !m.done;
  const forests = m.data.length * PER, total = DENS.length * PER;
  lab.setReadout(String(forests), tm.sub, m.guess !== null && !m.done && m.i < DENS.length ? tm.pill(DENS[m.i]) : '', '#4ea8ff');
  if (gated) lab.setState({ emo: '🔒', title: tm.gateT, lead: tm.gate, body: '', extra: '' });
  else if (asking) lab.setState({ emo: '🤔', title: tm.stq, lead: tm.stl, body: '', extra: '' });
  else if (!m.done) lab.setState({ emo: '🎲', title: tm.tb, lead: tm.lb(forests, total), body: '', extra: '' });
  else {
    const s = stats(m.data), ok = m.guess === 'jump', th = m.nb8 ? PC8 : PC4;
    if (m.nb8) lab.setState({ emo: '🔀', title: tm.nb8T, lead: tm.nb8L(s.d50, th), body: '', extra: '' });
    else lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? tm.okT : tm.noT, lead: tm.lead(s.lo, s.hi), body: tm.body(s.d50, th), extra: '' });
  }
  lab.setFacts(m.done ? (m.nb8 ? [t.facts.thr8, t.facts.thr] : [t.facts.thr]) : []);
}

function render3(t) {
  const b = S.b, tb = t.better, n = countOf(b.cl, 1), run = b.phase === 'run';
  lab.setGlow('rgba(100, 200, 120, .25)');
  $('wind').textContent = b.wind ? tb.windOn : tb.windOff; $('wind').classList.toggle('on', b.wind); $('wind').disabled = run;
  $('brush').textContent = b.brush === 1 ? tb.thin : tb.wide; $('brush').disabled = run;
  $('light').textContent = tb.light; $('light').disabled = run || n === 0;
  $('reset').textContent = tb.reset; $('reset').disabled = run || n === 0;
  $('newF3').textContent = tb.newf; $('newF3').disabled = run;
  $('windNote').textContent = b.wind ? tb.windNote(Math.round(WIND_P * 100), WIND_JUMP) : '';
  const card = `<div class="ff-card leaves"><b>${esc(tb.leavesH)}</b>${esc(tb.leaves)}</div>`;
  lab.setReadout(String(n), tb.sub, tb.pill(BREAK_DENS), '#5fcf7a');
  const r = b.res;
  if (run) lab.setState({ emo: '🔥', title: t.run.tb, lead: t.run.lb(b.sim.n, b.sim.burning), body: '', extra: card });
  else if (b.phase === 'done' && r) {
    let st;
    if (r.crossed) st = r.gap || !b.wind ? { emo: '🔥', title: tb.through, lead: tb.throughL(r.n, b.best) } : { emo: '💨', title: tb.jump, lead: tb.jumpL(r.n, b.best) };
    else if (!r.safe) st = { emo: '🍀', title: tb.luck, lead: tb.luckL };
    else st = { emo: r.n === b.best ? '🏆' : '✅', title: r.n === b.best ? tb.hold1 : tb.hold, lead: tb.holdL(r.n, b.best) };
    lab.setState({ ...st, body: '', extra: card });
  } else if (n === 0) lab.setState({ emo: '🛠️', title: tb.t0, lead: tb.l0, body: b.wind ? tb.lW : '', extra: card });
  else lab.setState({ emo: '🛠️', title: tb.tN(n), lead: tb.lN, body: b.wind ? tb.lW : '', extra: card });
  const fl = [t.facts.brk, t.facts.cedar, t.facts.sf];
  if (S.m.done) fl.push(t.facts.thr); // the threshold only after the "Many" prediction has been revealed
  lab.setFacts(fl);
}
render();
</script>
