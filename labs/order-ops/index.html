// --- secret 1: two calculators -------------------------------------------------------------------------------------------
const SIMPLE = [['C', '±', '%', '/'], ['7', '8', '9', '*'], ['4', '5', '6', '-'], ['1', '2', '3', '+'], ['0:2', '.', '=']];
const SCI = [['sin', 'cos', 'tan', '√', 'π'], ['(', ')', 'x²', '%', 'C'], ['7', '8', '9', '/', '⌫'], ['4', '5', '6', '*', '^'], ['1', '2', '3', '-', 'ans'], ['0', '.', '±', '+', '=']];
const CALC_KEYS = ['2', '+', '3', '*', '4', '='], KEY0 = .8, KEYDT = .85;
function drawCalc(c, x, y, w, h, kind, pressed, pressAge, lines, time) {

  const g = c.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, body[0]); g.addColorStop(1, body[1]);

  const dg = sci ? shade(COL.board, .6) : mix(COL.green, COL.chalk, .62);
  c.fillStyle = dg; c.beginPath(); c.roundRect(x + pad, y + pad, w - 2 * pad, dh, 8); c.fill(); c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = 1.5; c.stroke();
  c.textAlign = 'right'; c.textBaseline = 'middle';
  const tx = x + w - pad - 8;
  if (sci) {
    c.font = FNT(700, 12); c.fillStyle = rgba(COL.chalk, .7); c.fillText(lines[0], tx, y + pad + dh * .3, w - 2 * pad - 16);
    c.font = FNT(900, Math.min(30, dh * .5)); c.fillStyle = COL.tock; c.fillText(lines[1], tx, y + pad + dh * .72);
  } else { c.font = FNT(900, Math.min(32, dh * .6)); c.fillStyle = COL.board; c.fillText(lines[1], tx, y + pad + dh * .55); }

  rows.forEach((row, ri) => {
    let ci = 0;
    row.forEach((lab_) => {
      const [name, span] = lab_.split(':'), sp = +(span || 1), kx = x + pad + ci * (kw + gap), kww = kw * sp + gap * (sp - 1);
      const isOp = /^[+\-*\/]$/.test(name), isEq = name === '=', isFn = sci && ri < 2 || name === 'C' || name === '±' || name === '%' || name === '⌫' || name === '^' || name === 'ans';
      const on = pressed === name && pressAge >= 0 && pressAge < .3, dy = on ? 2 : 0;
      const base = isEq ? (sci ? COL.tock : COL.tick) : isOp ? COL.sign : isFn ? (sci ? mix(COL.board, '#ffffff', .12) : mix(COL.chalk, COL.board, .45)) : (sci ? mix(COL.board, '#ffffff', .24) : COL.chalk);

      const kg = c.createLinearGradient(0, ky + ri * (kh + gap), 0, ky + ri * (kh + gap) + kh); kg.addColorStop(0, tint(base, on ? .5 : .14)); kg.addColorStop(1, shade(base, .16));
      c.fillStyle = kg; c.strokeStyle = shade(base, .5); c.lineWidth = 1.2;
      c.beginPath(); c.roundRect(kx, ky + ri * (kh + gap) + dy, kww, kh, Math.min(8, kh * .3)); c.fill(); c.stroke();
      c.shadowColor = 'transparent';
      c.fillStyle = isOp || isEq || (!sci && !isFn) ? COL.board : (sci ? COL.chalk : COL.board); c.font = FNT(900, clamp(Math.min(kh * .46, kw * .55), 12, 19)); c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(/^[-*\/]$/.test(name) ? sg(name) : name, kx + kww / 2, ky + ri * (kh + gap) + kh / 2 + 1 + dy);

}
function drawCalcScene(c, w, h, time) {
  const R = S.robots, st = Math.max(0, time - R.secT0), bot = botOf(w, 'robots');
  const gap = 12, cw = Math.min(190, (w - 16 - gap) / 2), ch = Math.min(cw * 2.0, h - bot - 58), top = 12 + 28;
  const m = CALC_KEYS.filter((_, i) => st >= KEY0 + i * KEYDT).length;
  const last = m ? CALC_KEYS[m - 1] : null, age = m ? st - (KEY0 + (m - 1) * KEYDT) : -1;
  const typed = CALC_KEYS.slice(0, m).map((k) => (/^[-+*\/]$/.test(k) ? ' ' + sg(k) + ' ' : k)).join('').trim();
  const simple = ['0', '2', '2', '3', '5', '4', '20'][m], eq = m === CALC_KEYS.length;

  [['simple', x0, COL.tick, I18('tick'), ['', simple]], ['sci', x0 + cw + gap, COL.tock, I18('tock'), [typed, eq ? fmtN(AST('2 + 3 * 4').val) : (m ? ['2', '2', '3', '3', '4'][Math.min(m - 1, 4)] : '0')]]].forEach(([kind, x, col, name, lines]) => {

// --- secret 2: the shop receipt ----------------------------------------------------------------------------------------
const SHOP_AT = [.6, 1.9, 3.2, 4.9], SHOP_GROUP = [0, 0, 0, 1, 1, 1, 1, 2, 2, 3, 3], SHOP_GLOW = [[0, 2], [4, 6], [8, 8]];
function drawShopScene(c, w, h, time, Lr) {
  const t = T[lang], st = Math.max(0, time - S.robots.secT0), ast = AST(SHOP), fs = fsFor(ast, Lr.maxW);
  const list = [...toks(ast, NONE, [], []), { key: 'eq', s: '=', kind: 'op', anc: [] }, { key: 'res', s: fmtN(ast.val), kind: 'val', anc: [] }];
  const L = place(list, fs);
  let gi = -1, gk = 0;
  SHOP_GLOW.forEach((g, i) => { const k = (st - SHOP_AT[i]) / 1.0; if (k >= 0 && k < 1) { gi = i; gk = Math.sin(k * Math.PI); } });
  drawBoard(c, Lr.board, { A: L, q: 0, glowK: gk, glowFn: gi >= 0 ? (tk) => tk.idx >= SHOP_GLOW[gi][0] && tk.idx <= SHOP_GLOW[gi][1] : null,
    alphaFn: (tk, i) => clamp01((st - SHOP_AT[SHOP_GROUP[i]]) / .3) }, time);

  const rw = Math.min(280, w - 32), rx = (w - rw) / 2, ry = Lr.board.y + Lr.board.h + 24, lh = 34, hh = 34;
  const rh = hh + lh * 3 + 14 + 44, tooth = 10, bot = botOf(w, 'robots');
  const paper = (yy) => {
    c.beginPath(); c.moveTo(rx, yy); c.lineTo(rx + rw, yy); c.lineTo(rx + rw, yy + rh);
    const n = Math.round(rw / tooth), tw = rw / n;
    for (let i = n; i > 0; i--) { c.lineTo(rx + (i - .5) * tw, yy + rh + 8); c.lineTo(rx + (i - 1) * tw, yy + rh); }
    c.closePath();
  };
  const yy = Math.max(Lr.board.y + Lr.board.h + 10, Math.min(ry, h - bot - 8 - rh - 10)); // slides up when the stage is short
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 16; c.shadowOffsetY = 6;
  const pg = c.createLinearGradient(rx, 0, rx + rw, 0); pg.addColorStop(0, '#fff'); pg.addColorStop(1, shade(COL.chalk, .06));
  c.fillStyle = pg; paper(yy); c.fill(); c.shadowColor = 'transparent'; c.restore();
  c.save(); c.fillStyle = COL.board; c.textBaseline = 'middle';
  c.font = '700 15px "Courier New", ui-monospace, monospace';
  c.fillStyle = rgba(COL.board, .35); c.textAlign = 'center'; c.fillText('· · · · · · · · · · ·', rx + rw / 2, yy + hh / 2);
  SHOP_LINES.forEach(([qty, price], i) => {
    const ly = yy + hh + i * lh + lh / 2, lit = clamp01((st - SHOP_AT[i]) / .3) * (1 - clamp01((st - SHOP_AT[i] - 1.2) / .4));
    if (lit > 0) { c.fillStyle = rgba(COL.sign, .45 * lit); c.beginPath(); c.roundRect(rx + 6, ly - lh / 2 + 3, rw - 12, lh - 6, 8); c.fill(); }
    c.fillStyle = COL.board; c.textAlign = 'left'; c.font = '700 15px "Courier New", ui-monospace, monospace';
    c.fillText(t.sec.lines[i], rx + 14, ly, rw * .45);
    c.textAlign = 'center'; c.fillStyle = rgba(COL.board, .8); c.fillText(sg('*') + ' ' + price, rx + rw * .64, ly);
    const ta = (st - SHOP_AT[i] - .5) / .4;
    if (ta > 0) { c.save(); c.translate(rx + rw - 16, ly); const k = eback(ta); c.scale(Math.max(.0001, k), Math.max(.0001, k)); c.textAlign = 'right'; c.font = '900 17px "Courier New", ui-monospace, monospace'; c.fillStyle = COL.board; c.fillText(String(qty * price), 0, 0); c.restore(); }
  });
  const dy = yy + hh + lh * 3 + 4;
  c.strokeStyle = rgba(COL.board, .5); c.lineWidth = 1.5; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(rx + 12, dy); c.lineTo(rx + rw - 12, dy); c.stroke(); c.setLineDash([]);
  c.fillStyle = COL.board; c.textAlign = 'left'; c.font = '900 16px "Courier New", ui-monospace, monospace'; c.fillText(t.sec.total, rx + 14, dy + 24);

// --- the canvas loop -----------------------------------------------------------------------------------------------
const active = (v, V) => (v === 'robots' ? (V.i === 2 ? V.play !== null : V.pick !== null) : V.pick !== null);
canvasLoop($('cv'), (c, w, h, dt, time) => {
  backdrop(c, w, h);
  const v = lab.view, V = S[v];
  if (active(v, V) && !V.sec && !V.fin && time - V.t0 >= V.dur) { // the reveal is over: show the explanation and the readout
    V.fin = true;
    if (v === 'robots' && V.i === 0) V.seen = true;
    render();
  }
  if (v === 'robots') drawRobotsView(c, w, h, time);
  else if (v === 'brackets') drawBracketsView(c, w, h, time);
  else drawTreeView(c, w, h, time);
});
$('cv').addEventListener('pointerdown', () => { // a tap on the picture skips to the end of the reveal
  const v = lab.view, V = S[v];
  if (active(v, V) && !V.sec && !V.fin) V.t0 = now() - V.dur - .01;
});

// --- questions, controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function qInfo(v, V) {
  const t = T[lang], i = V.i;
  if (v === 'robots') return { q: i ? t.r.q2 : t.r.q1, opts: i ? t.r.o2 : t.r.o1, ok: RQ[i].ok, why: i ? t.r.r2 : t.r.r1, total: 2 };
  if (v === 'brackets') return { q: i ? t.b.make(BR[i].target) : t.b.q, opts: i ? t.b.rounds[i - 1].o : t.b.o, ok: BR[i].ok, why: i ? t.b.rounds[i - 1].why : t.b.r, total: 4 };

}
function doPick(v, V, j) {

  const info = qInfo(v, V);
  V.pick = j; V.t0 = now(); V.fin = false;
  if (v === 'robots') V.dur = V.i === 0 ? T1.end : T2.end;
  else if (v === 'brackets') { V.segs = bracketPlan(V.i, j); V.dur = V.segs.reduce((a, g) => a + g.dur, 0); }
  else V.dur = .5 + order(AST(TR[V.i].sum)).length * STEP + .8;

  render(); showStage();
}
function doNext(v, V) {
  sfx.click();
  if (v === 'robots') { V.i++; V.qT0 = now(); }
  else V.i = V.i >= qInfo(v, V).total - 1 ? 0 : V.i + 1;
  V.pick = null; V.fin = false; V.segs = null;
  render();
}
$('overlay').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const v = lab.view, V = S[v];
  if (b.dataset.p !== undefined) doPick(v, V, +b.dataset.p);
  else if (b.dataset.go) doNext(v, V);
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const R = S.robots;
  if (b.dataset.fp !== undefined) {
    R.play = +b.dataset.fp; R.t0 = now(); R.fin = false; R.sec = null;
    R.dur = FPT.step0 + order(AST(FP[R.play])).length * STEP + .4; sfx.click(); render(); showStage();
  } else if (b.dataset.again) {
    Object.assign(R, { i: 0, pick: null, play: null, sec: null, fin: false, qT0: now() }); sfx.click(); render();
  } else if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.sec;
    R.sec = R.sec === k ? null : k; R.secT0 = now(); sfx.click(); render(); if (R.sec) showStage();
  }
});

// --- one render per change: controls, overlay card, readout, state card --------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, V = S[v], rb = v === 'robots';
  document.body.dataset.v = v;
  $('obPlay').style.display = rb && V.i === 2 && !V.sec ? '' : 'none';
  $('obSecRow').style.display = rb && V.seen ? '' : 'none';
  if (rb) {
    $('obPlay').innerHTML = FP.map((s, i) => `<button class="chip ${V.play === i ? 'on' : ''}" data-fp="${i}">${esc(ex(s))}</button>`).join('') + `<button class="chip" data-again="1">${esc(t.again)}</button>`;
    const open = secret.unlocked();
    const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${V.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    $('secChips').innerHTML = sc('calc', '📱') + sc('shop', '🧾');
  }
  renderAsk(t, v, V);
  // readout: the answer stays hidden until the reveal is over
  let val = '?', sub = '', pill = '', col = COL.tick;
  if (rb) {
    lab.setGlow('rgba(61, 214, 198, .22)');
    if (V.sec) { val = V.sec === 'calc' ? `${fmtN(AST('2 + 3 * 4', true).val)} ≠ ${fmtN(AST('2 + 3 * 4').val)}` : fmtN(AST(SHOP).val); sub = V.sec === 'shop' ? ex(SHOP) : ''; }
    else if (V.i < 2) { if (V.pick !== null && V.fin) { val = fmtN(AST(RQ[V.i].sum).val); sub = t.r.rule; } }
    else if (V.play !== null && V.fin) { val = fmtN(AST(FP[V.play]).val); sub = t.r.rule; }
  } else if (v === 'brackets') {
    col = COL.frame; lab.setGlow('rgba(255, 209, 102, .2)');
    pill = t.b.make(BR[V.i].target);
    if (V.pick !== null && V.fin) { val = fmtN(AST(BR[V.i].opts[BR[V.i].ok]).val); sub = ex(BR[V.i].opts[BR[V.i].ok]); }
  } else {
    col = COL.green; lab.setGlow('rgba(61, 220, 151, .2)');
    if (V.pick !== null && V.fin) { val = fmtN(AST(TR[V.i].sum).val); sub = ex(TR[V.i].sum); }
  }
  lab.setReadout(val, sub, pill, col);
  const done = V.pick !== null && V.fin;
  const full = rb ? (V.i === 2 || (V.i === 1 && done)) : V.i === 3 && done;
  const [emo, title, lead, body] = CARDS[v][full ? 'full' : 'neutral'][lang];
  lab.setState({ emo, title, lead, body, extra: v === 'tree' && done ? `<div>${esc(t.t.deep)}</div>` : '' });
}
function renderAsk(t, v, V) {

    el.style.display = V.sec ? '' : 'none';

    return;
  }
  el.style.display = '';
  const info = qInfo(v, V);
  if (V.pick === null) {
    el.innerHTML = `<div class="ob-q">${esc(info.q)}</div><div class="ob-opts">${info.opts.map((o, j) => `<button class="ob-o" data-p="${j}">${esc(o)}</button>`).join('')}</div>`;
    return;
  }

  el.innerHTML = `<div class="ob-row"><span class="ob-v ${ok ? 'ok' : 'bad'}">${esc(ok ? t.right : t.wrong)}</span>${V.fin ? `<button class="btn ob-go" data-go="1">${esc(last ? t.again : t.next)}</button>` : ''}</div>${V.fin ? `<p class="ob-t">${esc(info.why)}</p>` : ''}`;
