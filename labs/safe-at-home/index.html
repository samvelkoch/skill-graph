    S.selT = now(); sfx.click(); render(); return;
  }
  if (b.closest('#o2')) { // prediction on the pair
    if (S.pg !== null || S.sel.length !== need()) return;
    S.pg = b.dataset.g; S.res = groupRes(S.sel); S.revT = now();
    if (!S.three) S.tested[pairKey(S.sel[0], S.sel[1])] = true;
    (S.pg === S.res ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (b.id === 'n2') { resetPairs(); sfx.click(); render(); return; }
  if (b.dataset.sc !== undefined) { S.si = +b.dataset.sc; sfx.click(); render(); return; }
  if (b.dataset.card !== undefined) { // steps: place a card
    const pl = S.pl[S.si]; if (S.ck[S.si]) return;
    if (pl.length >= 3) { sfx.bad(); return; }
    pl.push(+b.dataset.card); sfx.tick(); render(); return;
  }
  if (b.dataset.slot !== undefined) { if (!S.ck[S.si]) { S.pl[S.si].splice(+b.dataset.slot, 1); sfx.tick(); render(); } return; }
  if (b.id === 'n3') {
    const sc = t.st.sc[S.si];
    if (!S.ck[S.si]) { if (S.pl[S.si].length < 3) return; S.ck[S.si] = true; S.okc[S.si] = S.pl[S.si].every((x, k) => x === sc.order[k]); S.cT = now(); (S.okc[S.si] ? sfx.good : sfx.bad)(); render(); showStage(); return; }
    if (S.ck.every(Boolean)) { S.ck = [false, false, false, false]; S.okc = [false, false, false, false]; S.pl = [[], [], [], []]; S.si = 0; }
    else { let k = S.si; do { k = (k + 1) % 4; } while (S.ck[k]); S.si = k; }
    sfx.click(); render();
  }
});

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('sec1').hidden = v !== 'signs'; $('sec2').hidden = v !== 'pairs'; $('sec3').hidden = v !== 'steps';
  $('secLbl').textContent = t.secretRow;
  $('secChips').innerHTML = ['a', 'b'].map((k) => {
    const open = secret.unlocked(), on = open && (k === 'a' ? S.sa && v === 'signs' : S.three && v === 'pairs');
    return `<button type="button" class="chip secret${open ? ' open' : ''}${on ? ' on' : ''}" data-act="sec" data-k="${k}">${open ? (k === 'a' ? '🏷️' : '🧴') : '🔒'} ${esc(t.secrets[k][0])}</button>`;
  }).join('');
  if (v === 'signs') renderSigns(t); else if (v === 'pairs') renderPairs(t); else renderSteps(t);
}
function optButtons(list, text, right, chosen) {
  return list.map((o) => `<button type="button" class="sa-opt${chosen !== null ? (o === right ? ' good' : o === chosen ? ' bad' : '') : ''}" data-o="${o}" ${chosen !== null ? 'disabled' : ''}>${esc(text(o))}</button>`).join('');
}
function renderSigns(t) {
  const lbl = S.sa, n = lbl ? 5 : 9, arr = lbl ? S.la : S.g, i = lbl ? S.li : S.i, sym = lbl ? LABELS[i] : i, a = arr[i], done = arr.filter((x) => x !== null).length;
  const list = lbl ? optOrder(sym, LABEL_WRONG[i], i + 1) : optOrder(sym, WRONG_OPTS[sym], sym);
  const txt = lbl ? t.sa : t.s1;
  $('q1').textContent = txt.q;
  $('o1').innerHTML = optButtons(list, lbl ? (o) => t.act[o] : (o) => t.sym[o].n, sym, a);
  const nb = $('n1'); nb.hidden = a === null; nb.textContent = done === n ? txt.again : txt.next;
  const right = arr.filter((x, k) => x !== null && x === (lbl ? LABELS[k] : k)).length, ok = a === sym;
  lab.setReadout(`${done}/${n}`, txt.unit, a === null ? '' : (ok ? `✅ ${t.ok}` : `🤔 ${t.no}`));
  if (a === null) lab.setState({ emo: lbl ? '🏷️' : '⚠️', title: txt.title(i + 1), lead: txt.ask, body: txt.body });
  else {
    const s = t.sym[sym];
    lab.setState({ emo: ok ? '✅' : '🤔', title: `${ok ? t.ok : t.no} ${lbl ? s.n : s.n}`, lead: lbl ? t.act[sym] : s.means, body: lbl ? s.means : s.todo,
      extra: done === n ? `<div class="sa-sum">${esc(txt.sum(right))}</div>` : '' });
  }
  const facts = [];
  if (!lbl) { if (done > 0) facts.push({ emo: '🌍', ...t.facts.ghs }); if (done === 9) facts.push({ emo: '💀', ...t.facts.ghs2 }); }
  lab.setFacts(facts);
}
function groupText(t, ids, res) {
  if (res === 'gas') { for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) { const k = pairKey(ids[i], ids[j]); if (k === '02') return t.p.gasA; if (k === '03') return t.p.gasB; } }
  if (res === 'risk') return ids.includes(4) ? t.p.noteFlame : ids.includes(1) ? t.p.noteDrain : t.p.noteBleach;
  return t.p.okText;
}
function renderPairs(t) {
  const nd = need(), ready = S.sel.length === nd, rev = ready && S.pg !== null, names = S.sel.map((id) => t.bot[id][1]).join(' + ');
  $('q2').textContent = ready ? (S.three ? t.p.q3 : t.p.q2) : (S.three ? t.p.pick3 : t.p.pick);
  $('o2').innerHTML = ['gas', 'risk', 'ok'].map((g) => `<button type="button" class="sa-opt${rev ? (g === S.res ? ' good' : g === S.pg ? ' bad' : '') : ''}" data-g="${g}" ${!ready || rev ? 'disabled' : ''}>${esc(t.p.opts[g])}</button>`).join('');
  $('n2').hidden = !rev; $('n2').textContent = t.p.another;
  const cnt = Object.keys(S.tested).length;
  lab.setReadout(`${cnt}/15`, t.p.unit, rev ? `${t.p.emo[S.res]} ${S.pg === S.res ? t.ok : t.no}` : '');
  if (!ready) lab.setState({ emo: '🧴', title: t.p.emptyT, lead: t.p.emptyL, body: t.p.emptyB });
  else if (!rev) lab.setState({ emo: '🤔', title: names, lead: t.p.waitL, body: '' });
  else {
    const ok = S.pg === S.res;
    lab.setState({ emo: t.p.emo[S.res], title: `${ok ? t.ok : t.no} ${t.p.res[S.res]}`, lead: `${names}: ${groupText(t, S.sel, S.res)}`,
      body: t.p.rule, extra: S.sel.includes(2) && !S.sel.includes(0) ? `<div class="sa-sum">${esc(t.p.vinegarNote)}</div>` : '' });
  }
  const facts = [];
  if (rev || cnt > 0) { if (S.tested['02'] && S.tested['03']) facts.push({ emo: '☠️', ...t.facts.gas }); facts.push({ emo: '🏥', ...t.facts.acc }); }
  lab.setFacts(facts);
}
function renderSteps(t) {
  const si = S.si, sc = t.st.sc[si], pl = S.pl[si], ck = S.ck[si], solved = S.ck.filter(Boolean).length, right = S.okc.filter(Boolean).length;
  $('scn').innerHTML = t.st.sc.map((x, k) => `<button type="button" class="chip${k === si ? ' on' : ''}" data-sc="${k}">${x.chip}${S.ck[k] ? ` <span class="tick">${S.okc[k] ? '✓' : '·'}</span>` : ''}</button>`).join('');
  $('q3').textContent = `${sc.title} ${t.st.q}`;
  $('slots').innerHTML = [0, 1, 2].map((p) => {
    const id = pl[p], cls = ck && id !== undefined ? (id === sc.order[p] ? ' good' : ' bad') : id !== undefined ? ' full' : '';
    return `<button type="button" class="sa-slot${cls}" data-slot="${p}" ${ck || id === undefined ? 'disabled' : ''}><span class="n">${p + 1}</span><span>${id === undefined ? '…' : esc(sc.cards[id].replace('{n}', t.num))}</span></button>`;
  }).join('');
  $('cards').innerHTML = sc.show.filter((id) => !pl.includes(id)).map((id) => `<button type="button" class="sa-opt" data-card="${id}" ${ck ? 'disabled' : ''}>${esc(sc.cards[id].replace('{n}', t.num))}</button>`).join('');
  const nb = $('n3'); nb.disabled = !ck && pl.length < 3; nb.textContent = !ck ? t.st.check : solved === 4 ? t.st.again : t.st.next;
  lab.setReadout(`${solved}/4`, t.st.unit, ck ? (S.okc[si] ? `✅ ${t.ok}` : `🤔 ${t.no}`) : '');
  if (!ck) lab.setState({ emo: sc.emo, title: sc.title, lead: t.st.ask, body: t.st.body });
  else {
    const ok = S.okc[si], used = pl.includes(sc.bad);
    const list = `<div class="sa-sum">${esc(t.st.rightOrder)}</div><ol class="sa-ol">${sc.order.map((id) => `<li>${esc(sc.cards[id].replace('{n}', t.num))}</li>`).join('')}</ol>${solved === 4 ? `<div class="sa-sum">${esc(t.st.sum(right))}</div>` : ''}`;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ok : (used ? t.st.badUsed : t.st.closeT), lead: sc.why, body: used ? sc.badWhy : '', extra: list });
  }
  const facts = [];
  if (ck) { facts.push({ emo: si === 2 ? '🚫' : si === 3 ? '🌬️' : '🚿', ...t.facts[si === 2 ? 'vomit' : si === 3 ? 'air' : 'rinse'] }, { emo: '📞', ...t.facts.eu }, { emo: '📞', ...t.facts.ru }); }
  lab.setFacts(facts);
}
render();
</script>
