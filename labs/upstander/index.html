  for (let k = 0; k < 5; k++) {
    const up = S.ch[k] === 'reply' || S.ch[k] === 'report', cur = k === S.ci && !done && show;
    node(c, NODE.cls[k][0], NODE.cls[k][1], 10, up ? GCOL[2] : S.ch[k] ? GCOL[1] : '#9aa3c4', cur ? `rgba(255,255,255,${.6 + .4 * Math.sin(S.clock * 6)})` : null);
    c.fillStyle = '#15182a'; c.fillText(nm[k][0], NODE.cls[k][0], NODE.cls[k][1] + 1);
  }
  if (S.down) pill('🚩', GC[0], 36, { maxW: 40 });
  if (!show) pill(T[lang].c.hidL, 262, 296, { maxW: 180 });
}
function seenNow() { return 1 + 5 + S.reach.reduce((a, b) => a + (b || 0), 0); }

// --- canvas loop ---------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt) => {
  S.clock += dt;
  const s = Math.min(w / W, h / H);
  G = { w, h, s, ox: (w - W * s) / 2, oy: (h - H * s) / 2 };
  const v = lab.view;
  if (v === 'chat') bgNight(c, w, h); else bgYard(c, w, h);
  c.save(); c.translate(G.ox, G.oy); c.scale(s, s);
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (v === 'watch') sceneWatch(c, dt); else if (v === 'step') sceneStep(c, dt); else sceneChat(c, dt);
  c.restore();
  flushPills(c);
  if (v === 'watch' && S.sec === 'ten' && S.tm && !S.tmDone && S.tt >= (S.tm === 'peer' ? 12 : 20)) { S.tmDone = true; render(); }
});

// --- input ---------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'watch' || !S.tap || !S.pred || S.sec) return;
  const r = $('cv').getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  let best = -1, bd = 34;
  for (let i = 0; i < S.n; i++) { const d = Math.hypot(px - (G.ox + WS[i].x * G.s), py - (G.oy + (WS[i].y + 6) * G.s)); if (d < bd) { bd = d; best = i; } }
  if (best < 0) return;
  S.up = best; S.upAt = S.clock; S.tap = false; sfx.good(); render(); showStage();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (lab.view !== 'watch') { lab.view = 'watch'; lab.renderChrome(); }
    S.tap = false;
    if (S.sec === k) S.sec = null;
    else { S.sec = k; S.pk = 0; S.tm = null; S.tt = 0; S.tmDone = false; }
    sfx.click();
  } else if (act === 'back') { S.sec = null; sfx.click(); }
  else if (act === 'wp') { S.pred = ['more', 'less', 'same'][i]; S.n = 1; S.nv = 1; S.maxN = 1; sfx.click(); }
  else if (act === 'tap') { S.tap = !S.tap; sfx.click(); }
  else if (act === 'wreset') { S.up = -1; S.upAt = null; S.tap = false; sfx.click(); }
  else if (act === 'pk') { S.pk = i; sfx.click(); }
  else if (act === 'tm') { S.tm = b.dataset.m; S.tt = 0; S.tmDone = false; sfx.click(); }
  else if (act === 'sit') { S.sit = i; S.opt = null; S.ph = 0; sfx.click(); }
  else if (act === 'opt') {
    S.opt = b.dataset.o; S.ph = 0; S.tried[S.sit + b.dataset.o] = true;
    (S.opt === 'fight' || S.opt === 'laugh' ? sfx.bad : sfx.good)(); showStage();
  } else if (act === 'cp') { S.gp = i; sfx.click(); }
  else if (act === 'ch') chatPick(b.dataset.o);
  else if (act === 'creset') { S.gp = null; S.ci = 0; S.ch = []; S.reach = []; S.down = false; S.t0 = []; S.msgs = []; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'upN') return;
  S.n = +ev.target.value; S.maxN = Math.max(S.maxN, S.n); sfx.tick();
  render(true);
});
function chatPick(o) {
  const k = S.ci; if (k >= 5 || !S.gp) return;
  let base = { like: Math.ceil(FR[k] / 2), fwd: FR[k], scroll: 0, reply: 0, report: 0 }[o];
  const replies = S.ch.filter((x) => x === 'reply').length;
  let reach = S.down ? 0 : Math.max(0, base - replies);
  if (o === 'report') { reach = 0; S.down = true; }
  S.ch[k] = o; S.reach[k] = reach; S.t0[k] = S.clock;
  S.msgs.push({ n: T[lang].c.names[k], t: T[lang].c.say[o], col: SHIRT[k], o, k });
  S.ci++;
  (o === 'reply' || o === 'report' ? sfx.good : o === 'scroll' ? sfx.tick : sfx.bad)();
  showStage();
}

// --- render: controls, readout, state card, facts ------------------------------------------------------------
function render(keepCtrl) {
  const t = T[lang], v = lab.view;
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip up-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : esc(t.ui.lock)}</button>`;
  const secRow = `<div class="up-row up-sep">${sc('pink', '🩷')}${sc('ten', '⏱️')}${S.sec ? `<button class="chip up-c" data-act="back">${esc(t.ui.back)}</button>` : ''}</div>`;
  lab.setGlow(v === 'chat' ? 'rgba(110, 120, 255, .26)' : 'rgba(95, 190, 120, .26)');
  let html = '';
  if (v === 'watch') html = S.sec ? rSecret(t) : rWatch(t, keepCtrl);
  else if (v === 'step') html = rStep(t);
  else html = rChat(t);
  if (!keepCtrl) $('ctrlBody').innerHTML = html + secRow;
  lab.setFacts([{ emo: ['🧪', '🎥', '🩷'][['watch', 'step', 'chat'].indexOf(v)], text: t.facts[['watch', 'step', 'chat'].indexOf(v)], src: SRC[['watch', 'step', 'chat'].indexOf(v)] }]);
}
function rWatch(t, keep) {
  const w = t.w;
  if (!S.pred) {
    lab.setReadout('?', w.hidSub, '', '#ffd75e');
    lab.setState({ emo: '🤔', title: w.hidT, lead: w.hidL, body: w.hidB });
    return `<p class="up-q">${esc(w.q)}</p><div class="up-opts row">${w.opts.map((o, i) => `<button class="up-opt" data-act="wp" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  }
  const pct = Math.round(chance(S.n)), age = S.upAt == null ? -1 : S.clock - S.upAt;
  lab.setReadout(`${pct} %`, w.sub, w.pill(S.n), '#ffd75e');
  if (S.upAt != null) lab.setState({ emo: '🙋', title: w.doneT, lead: w.doneL, body: w.doneB });
  else if (S.tap) lab.setState({ emo: '👆', title: w.tapT, lead: w.tapL, body: w.tapB });
  else if (S.maxN >= 5) {
    const ok = S.pred === 'less';
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ui.right : t.ui.notq, lead: ok ? w.rightL : w.wrongL, body: w.moreB });
  } else lab.setState({ emo: '👀', title: w.slT, lead: w.slL, body: w.slB });
  void age;
  if (keep) return '';
  return `<div class="up-lbl"><span>${esc(w.n(S.n))}</span></div>
    <input type="range" class="big" id="upN" min="1" max="12" step="1" value="${S.n}" style="--track:linear-gradient(90deg,#ffd75e,#5a6aa8)" aria-label="${esc(w.n(S.n))}">
    <div class="up-row"><button class="chip up-c ${S.tap ? 'on' : ''}" data-act="tap">${esc(w.stepBtn)}</button>${S.upAt != null ? `<button class="chip up-c" data-act="wreset">${esc(t.ui.again)}</button>` : ''}</div>`;
}
function rSecret(t) {
  if (S.sec === 'pink') {
    lab.setReadout(['1', '50', '120'][S.pk], '', '', '#ff7eb6');
    lab.setState({ emo: '🩷', title: t.pk.t[S.pk], lead: t.pk.lbl[S.pk], body: t.pk.l[S.pk] });
    return `<div class="up-opts row">${t.pk.steps.map((s, i) => `<button class="up-opt ${S.pk === i ? 'on' : ''}" data-act="pk" data-i="${i}">${esc(s)}</button>`).join('')}</div>`;
  }
  const run = S.tm != null;
  lab.setReadout(run ? t.tn.s(Math.min(S.tt, 10).toFixed(0)) : '0', '', '', '#ffb84a');
  lab.setState({ emo: '⏱️', title: t.tn.t, lead: run ? (S.tm === 'peer' ? t.tn.l1 : t.tn.l0) : t.tn.go, body: '' });
  return `<div class="up-opts row"><button class="up-opt ${S.tm === 'none' ? 'on' : ''}" data-act="tm" data-m="none">${esc(t.tn.t0)}</button><button class="up-opt ${S.tm === 'peer' ? 'on' : ''}" data-act="tm" data-m="peer">${esc(t.tn.t1)}</button></div>`;
}
function rStep(t) {
  const s = t.s, opt = S.opt, tried = Object.keys(S.tried).length;
  lab.setReadout(opt ? `${SCORE[opt]} %` : '?', opt ? s.meter : s.sits[S.sit][0], '', '#3ddc97');
  if (opt) lab.setState({ emo: opt === 'fight' ? '⛔' : opt === 'laugh' ? '😬' : '🙋', title: s.res[opt][0], lead: s.res[opt][1], body: s.stress });
  else lab.setState({ emo: '🤔', title: s.defT, lead: s.sits[S.sit][1], body: s.stress });
  void tried;
  return `<div class="up-row" style="margin-top:0">${s.sits.map((x, i) => `<button class="chip up-c ${S.sit === i ? 'on' : ''}" data-act="sit" data-i="${i}">${esc(x[0])}</button>`).join('')}</div>
    <p class="up-q" style="margin-top:10px">${esc(s.q)}</p>
    <div class="up-opts">${SITOPTS[S.sit].map((o) => `<button class="up-opt ${opt === o ? 'on' : ''} ${o === 'fight' ? 'bad' : ''}" data-act="opt" data-o="${o}">${esc(s.opts[o][0])}${s.opts[o][1] ? `<small>${esc(s.opts[o][1])}</small>` : ''}</button>`).join('')}</div>`;
}
function rChat(t) {
  const c = t.c;
  if (!S.gp) {
    lab.setReadout('?', c.hidT, '', '#ff5a5f');
    lab.setState({ emo: '🤔', title: c.hidT, lead: c.hidL, body: c.hidB });
    return `<p class="up-q">${esc(c.q)}</p><div class="up-opts row">${['6', '15', '30'].map((o, i) => `<button class="up-opt" data-act="cp" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  }
  const guess = ['6', '15', '30'][S.gp], seen = seenNow(), k = S.ci;
  lab.setReadout(seen, c.sub, c.pill(guess), '#ff5a5f');
  if (k >= 5) {
    lab.setState({ emo: S.ch.some((x) => x === 'reply' || x === 'report') ? '💚' : '😟', title: c.endT(seen), lead: c.endL(guess, TOTAL), body: c.endB });
    return `<div class="up-row" style="margin-top:0"><button class="chip up-c" data-act="creset">${esc(t.ui.again)}</button></div>`;
  }
  const last = S.ch[k - 1];
  if (last) lab.setState({ emo: last === 'reply' || last === 'report' ? '💚' : last === 'scroll' ? '😐' : '🔴', title: c.res[last][0], lead: c.res[last][1], body: '' });
  else lab.setState({ emo: '📱', title: c.turn(c.names[k]), lead: c.hidL, body: '' });
  return `<div class="up-who"><i style="background:${SHIRT[k]}">${esc(c.names[k][0])}</i><b>${esc(c.who(k + 1, c.names[k]))}</b></div>
    <p class="up-q">${esc(c.turn(c.names[k]))}</p>
    <div class="up-opts">${['like', 'fwd', 'scroll', 'reply', 'report'].map((o) => `<button class="up-opt" data-act="ch" data-o="${o}">${esc(c.act[o])}</button>`).join('')}</div>`;
}
render();
</script>
</body>
</html>
