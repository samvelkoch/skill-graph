const W = 400, H = 320, PI = Math.PI, TAU = PI * 2;
const C = { stone: '#D9C7A3', stoneD: '#A8926B', wood: '#A0703F', sky: '#8EC5E8', hill: '#9DB86B', cyp: '#3E6B3A', push: '#FFD166',
  crack: '#E5484D', water: '#5BB6E6', ink: '#2B2140', bg: '#1C2232' };
const c01 = (x) => Math.min(1, Math.max(0, x));
const eio = (t) => { t = c01(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eo = (t) => 1 - Math.pow(1 - c01(t), 3);
const ei = (t) => { t = c01(t); return t * t * t; };
const hx = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const shade = (h, t) => (t >= 0 ? mix(h, '#ffffff', t) : mix(h, '#000000', -t));
const rgba = (h, a) => { const [r, g, b] = hx(h); return `rgba(${r},${g},${b},${a})`; };
const rng = (seed) => () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const SKYL = mix(C.sky, '#ffffff', .62);
const GRASS = shade(C.hill, -.12);

function rr(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// a cut stone block, light from the top left
function slab(ctx, x, y, w, h, o = {}) {
  if (w <= 0 || h <= 0) return;
  const base = o.c ?? C.stone, r = o.r ?? 1.4;

  else if (a === 'squeeze' || a === 'poke') { if (E.cracked) { E.cracked = false; } E.mode = a; E.t0 = clock; sfx.click(); }
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'arSlide') return;
  setLoad(+ev.target.value); ev.target.setAttribute('aria-label', T[lang].m.load(M.n));
});

function tick(dt) {
  tickParticles(dt);
  for (const v of ['build', 'beam', 'rome']) {
    const st = V[v];
    if (st.ans !== null && !st.done && clock >= st.at + DUR[v][st.round]) {
      st.done = true; if (st.round === 2) st.fin = true;
      if (v === lab.view) render();
    }
  }
  tickBuild(dt); tickBeam(dt);
  if (lab.view === 'build' && SEC.k) { const s = SEC.k === 'dome' ? `${Math.round(domePhi() * 180 / PI)}°` : `${Math.round(E.p * 100)}%`; if (s !== E.lastP) { E.lastP = s; renderReadout(); } }
}
canvasLoop($('cv'), (ctx, w, h, dt) => {
  clock += dt; tick(dt);
  const k = Math.min(w / W, h / H); VP = { k, ox: (w - W * k) / 2, oy: (h - H * k) / 2 };
  ctx.save(); ctx.translate(VP.ox, VP.oy); ctx.scale(k, k);
  ctx.globalAlpha = 1;
  const v = lab.view;
  if (v === 'build') { if (SEC.k) drawSecret(ctx); else drawBuild(ctx); }
  else if (v === 'beam') drawBeamView(ctx);
  else drawRome(ctx);
  ctx.restore();
});
render();
</script>
