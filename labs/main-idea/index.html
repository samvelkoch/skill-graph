    return lab.setFacts([t.facts.pick]);
  }
  if (v === 'pick') updPick(t, u); else if (v === 'odd') updOdd(t, u); else updNotes(t, u);
}
function updPick(t, u) {
  const ty = S.pk;
  lab.setFacts([t.facts.pick]);
  if (ty === null || !S.shown) { lab.setReadout('?', '', '', '#4ea8ff'); return lab.setState({ emo: EM[S.ti], title: t.topics[S.ti], lead: u.pickLead, body: u.pickBody, extra: '' }); }
  const both = S.stage === 2 ? u.both : '';
  if (ty === 0) { lab.setReadout('4/4', u.dry, t.right, '#3ddc97'); lab.setState({ emo: '☂️', title: t.right, lead: u.rightLead, body: u.rightBody, extra: '' }); }
  else if (ty === 1) { lab.setReadout('1/4', u.dry, u.pillSmall, '#f5c84c'); lab.setState({ emo: '💦', title: t.small, lead: u.smallLead, body: both || u.rightBody, extra: '' }); }
  else { lab.setReadout('4/4', u.dry, u.strangers(3), '#ff8a5c'); lab.setState({ emo: '🌍', title: t.big, lead: u.bigLead, body: both || u.rightBody, extra: '' }); }
}
function updOdd(t, u) {
  const o = S.o;
  lab.setFacts([t.facts.odd]);
  if (o.pk === null || !o.shown) { lab.setReadout('?', '', '', '#4ea8ff'); return lab.setState({ emo: '🔎', title: t.odd[S.oi][0], lead: u.oddLead, body: u.oddBody, extra: '' }); }
  if (o.pk === 4) { lab.setReadout('✓', '', t.right, '#3ddc97'); lab.setState({ emo: '☂️', title: t.right, lead: u.oddRight, body: '', extra: '' }); }
  else { lab.setReadout('✗', '', u.oddNo, '#f5c84c'); lab.setState({ emo: '✨', title: u.oddNo, lead: u.oddNoLead, body: '', extra: '' }); }
}
function updNotes(t, u) {
  const n = S.n, N = t.notes;
  lab.setFacts([t.facts.notes]);
  const words = (s) => s.trim().split(/\s+/).filter(Boolean).length;
  if (n.done) {
    const a = N.s.reduce((x, s) => x + words(s[0]), 0), b = N.s.reduce((x, s) => x + words(s[1]), 0);
    lab.setReadout('4/4', u.nKeys, u.nPill(a, b), '#3ddc97');
    return lab.setState({ emo: '📝', title: u.nDone, lead: u.nDoneLead(a, b), body: u.nDoneBody, extra: '' });
  }
  lab.setReadout(`${n.i}/4`, u.nKeys, '', '#e8b04a');
  if (n.msg === 'bad') lab.setState({ emo: '🙈', title: u.nBad, lead: u.nLead, body: u.nBody, extra: '' });
  else if (n.msg === 'ok') lab.setState({ emo: '📌', title: u.nOk, lead: u.nLead, body: u.nBody, extra: '' });
  else lab.setState({ emo: '📝', title: t.views.notes, lead: u.nLead, body: u.nBody, extra: '' });
}

// ---- events -----------------------------------------------------------------------------------------------------
$('overlay').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || S.sec) return;
  if (b.classList.contains('mi-ub')) pickUmb(b);
  else if (b.classList.contains('mi-cell')) pickOdd(b);
  else if (b.classList.contains('mi-ch')) pickNote(b);
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null; else { S.sec = k; if (v !== 'pick') { lab.view = 'pick'; lab.renderChrome(); } }
    sfx.click(); render(); return showStage();
  }
  sfx.click();
  if (S.sec) S.sec = null;
  else if (act === 'again') { newN(); S.key = ''; }
  else if (v === 'pick') { S.ti = (S.ti + 1) % 5; if (S.ti === 0) S.lap++; S.pk = null; S.shown = false; S.stage = 0; }
  else if (v === 'odd') { S.oi = (S.oi + 1) % 3; newO(); }
  render();
});

let lastW = innerWidth;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 2) return; lastW = innerWidth; S.key = ''; render(); });
render();
</script>
