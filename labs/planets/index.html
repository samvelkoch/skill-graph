const ease = (x) => { const k = clamp(x, 0, 1); return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; };
const rnd = (seed) => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const ROCKS = Array.from({ length: 110 }, () => ({ a: R2() * TAU, d: (R2() - .5) * .075, r: .5 + R2() * .9, c: R2() < .5 ? '#a8a199' : '#7f776c' }));

// --- geometry ----------------------------------------------------------------------------------------------
function layout(w, h, v) {
  const tray = v === 'order' ? TRAYH : 0, ah = h - tray;
  const R = Math.max(40, Math.min(w, ah) / 2 - 10);
  return { cx: w / 2, cy: ah / 2, R, f: R / 170, ty: ah };
}
const orbitPos = (i, L, years) => { const a = TH0[i] + TAU * years / PY[i]; return { x: L.cx + RR[i] * L.R * Math.cos(a), y: L.cy - RR[i] * L.R * Math.sin(a) }; };
const spreadPos = (i, L) => ({ x: L.cx + RR[i] * L.R * Math.cos(SP[i]), y: L.cy - RR[i] * L.R * Math.sin(SP[i]) });
function plutoAt(E, L) {
  const b = PA * Math.sqrt(1 - PE * PE), x0 = PA * (Math.cos(E) - PE), y0 = b * Math.sin(E), cw = Math.cos(PW), sw = Math.sin(PW);
  return { x: L.cx + (x0 * cw - y0 * sw) * L.R, y: L.cy - (x0 * sw + y0 * cw) * L.R };
}
function plutoPos(L) {
  const M = TAU * (S.years - S.p0) / 248; let E = M;
  for (let k = 0; k < 8; k++) E = M + PE * Math.sin(E);
  return plutoAt(E, L);
}
const freeUnits = (i) => { // free flight in units of R, from the orbit position at the moment of switching off
  const F = S.free, p = F.pos0[i], d = F.dir[i], v = .022 * KMS[i] * F.t;
  return { x: p.x + d.x * v, y: p.y + d.y * v };
};
function planetWorld(i, L) {
  if (S.sec === 'free' && S.free) {
    let u = freeUnits(i);
    if (S.back) {
      const to = { x: (orbitPos(i, L, S.years).x - L.cx) / L.R, y: (orbitPos(i, L, S.years).y - L.cy) / L.R }, f = S.back.from[i], e = ease(S.back.t / 1.6);
      u = { x: lerp(f.x, to.x, e), y: lerp(f.y, to.y, e) };
    }
    return { x: L.cx + u.x * L.R, y: L.cy + u.y * L.R };
  }
  return orbitPos(i, L, S.years);
}
const slotPos = (k, L) => spreadPos(k, L);

// --- drawing helpers ---------------------------------------------------------------------------------------
function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function pill(c, text, x, y, o = {}) {
  c.save(); c.globalAlpha = 1;
  c.font = '800 12px Nunito, system-ui, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left';
  const tw = c.measureText(text).width, pw = tw + 14, ph = 20;
  const px = clamp(o.left ? x : x - pw / 2, 3, Math.max(3, CW - pw - 3)), py = clamp(y - ph / 2, 3, Math.max(3, CH - ph - 3));
  rrect(c, px, py, pw, ph, 10); c.fillStyle = 'rgba(8,10,22,.82)'; c.fill();
  if (o.stroke) { c.lineWidth = 1.5; c.strokeStyle = o.stroke; c.stroke(); }
  c.fillStyle = o.color || '#fff'; c.fillText(text, px + 7, py + ph / 2 + .5);
  c.restore();
}
function drawBg(c, w, h, time) {
  const g = c.createRadialGradient(w / 2, h * .45, 10, w / 2, h / 2, Math.max(w, h) * .75);
  g.addColorStop(0, '#0e1530'); g.addColorStop(1, '#03040a');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  for (const s of STARS) {
    c.fillStyle = `rgba(220,230,255,${.22 + .35 * (.5 + .5 * Math.sin(time * s.sp + s.ph))})`;
    c.beginPath(); c.arc(s.x * w, s.y * h, s.r, 0, TAU); c.fill();
  }
}
function drawSun(c, x, y, R, time, z = 1) {
  const rs = R * .075, p = 1 + Math.sin(time * 1.7) * .03;
  let g = c.createRadialGradient(x, y, rs * .8, x, y, rs * 5 * p);
  g.addColorStop(0, 'rgba(255,200,90,.55)'); g.addColorStop(.25, 'rgba(255,150,40,.2)'); g.addColorStop(1, 'rgba(255,120,20,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, rs * 5 * p, 0, TAU); c.fill();
  c.save(); c.translate(x, y); c.rotate(time * .05); c.strokeStyle = 'rgba(255,214,120,.16)'; c.lineWidth = rs * .14; c.lineCap = 'round';
  for (let k = 0; k < 12; k++) {
    const a = k * TAU / 12, l = rs * (2.1 + .5 * Math.sin(time * 1.3 + k * 2));
    c.beginPath(); c.moveTo(Math.cos(a) * rs * 1.15, Math.sin(a) * rs * 1.15); c.lineTo(Math.cos(a) * l, Math.sin(a) * l); c.stroke();
  }
  c.restore();
  g = c.createRadialGradient(x - rs * .3, y - rs * .3, rs * .1, x, y, rs);
  g.addColorStop(0, '#fffde6'); g.addColorStop(.45, '#ffd84a'); g.addColorStop(.85, '#ff9d1c'); g.addColorStop(1, '#f0680f');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, rs, 0, TAU); c.fill();
}
function drawBelt(c, L, alpha, time, z = 1) {
  if (alpha <= 0) return;
  c.save();
  for (const r of ROCKS) {
    const a = r.a + time * .02, d = (BELT + r.d) * L.R;
    c.globalAlpha = alpha * .85; c.fillStyle = r.c;
    c.beginPath(); c.arc(L.cx + d * Math.cos(a), L.cy - d * Math.sin(a), Math.max(0, r.r * L.f), 0, TAU); c.fill();
  }
  c.restore();
}

// features painted on the disc (already clipped), local coordinates, r = radius
const ell = (c, x, y, a, b, rot) => { c.beginPath(); c.ellipse(x, y, Math.max(0, a), Math.max(0, b), rot, 0, TAU); c.fill(); };
const FEAT = {
  0: (c, r) => {
    for (const [x, y, s] of [[-.35, -.2, .22], [.32, .25, .17], [.05, -.52, .12], [-.12, .5, .15], [.55, -.15, .1]]) {
      c.beginPath(); c.arc(x * r, y * r, Math.max(0, s * r), 0, TAU); c.fillStyle = 'rgba(60,56,52,.45)'; c.fill();

    }
  },
  1: (c, r) => {
    c.lineCap = 'round'; c.lineWidth = r * .24; c.strokeStyle = 'rgba(255,244,214,.5)';
    c.beginPath(); c.arc(-.1 * r, .1 * r, r * .55, .2, 2.5); c.stroke();
    c.beginPath(); c.arc(.2 * r, -.1 * r, r * .85, 3.4, 5.3); c.stroke();
    c.strokeStyle = 'rgba(160,115,50,.3)'; c.beginPath(); c.arc(.1 * r, .2 * r, r * .9, .2, 1.8); c.stroke();
  },
  2: (c, r) => {
    c.fillStyle = '#4f9d5a';
    for (const [x, y, a, b, rot] of [[-.38, -.18, .34, .2, .6], [.32, .3, .3, .2, -.5], [.12, -.55, .22, .12, .1], [-.1, .5, .2, .1, .3]]) ell(c, x * r, y * r, a * r, b * r, rot);
    c.fillStyle = 'rgba(255,255,255,.62)';
    for (const [x, y, a, b, rot] of [[-.05, .12, .6, .09, .4], [.25, -.28, .45, .07, -.3], [-.3, .45, .4, .06, .1]]) ell(c, x * r, y * r, a * r, b * r, rot);
  },
  3: (c, r) => {
    c.fillStyle = 'rgba(140,58,36,.55)';
    for (const [x, y, a, b] of [[-.3, .1, .3, .2], [.35, -.25, .22, .15], [.1, .45, .25, .12]]) ell(c, x * r, y * r, a * r, b * r, .3);
    c.fillStyle = 'rgba(255,255,255,.85)'; ell(c, 0, -.88 * r, .35 * r, .14 * r, 0);

  4: (c, r) => {
    const cols = ['#b9794f', '#ecd7b6', '#c9976b', '#f1e0c4', '#b9794f', '#e8cfa8', '#a96b45'], bh = 2 * r / cols.length;
    cols.forEach((col, k) => { c.fillStyle = col; c.fillRect(-r, -r + k * bh, 2 * r, bh + .6); });
    c.fillStyle = '#c4472e'; ell(c, .32 * r, .28 * r, .3 * r, .17 * r, 0);
    c.strokeStyle = 'rgba(255,200,170,.55)'; c.lineWidth = Math.max(.4, r * .04); c.stroke();
  },
  5: (c, r) => {
    const cols = ['#cdb17a', '#ecd9a8', '#d9bf88', '#f0e0b5', '#c8ab72'], bh = 2 * r / cols.length;
    cols.forEach((col, k) => { c.fillStyle = col; c.fillRect(-r, -r + k * bh, 2 * r, bh + .6); });
  },
  6: (c, r) => { c.fillStyle = 'rgba(255,255,255,.22)'; ell(c, 0, -.3 * r, r, .12 * r, 0); ell(c, 0, .38 * r, r, .09 * r, 0); },
  7: (c, r) => {
    c.fillStyle = 'rgba(255,255,255,.2)'; ell(c, 0, -.05 * r, r, .12 * r, 0);
    c.fillStyle = 'rgba(20,36,140,.7)'; ell(c, -.2 * r, .25 * r, .3 * r, .18 * r, .2);
    c.fillStyle = 'rgba(255,255,255,.5)'; ell(c, .25 * r, -.35 * r, .35 * r, .06 * r, -.2);
  },
  8: (c, r) => {
    c.fillStyle = 'rgba(110,86,70,.55)'; ell(c, -.45 * r, -.1 * r, .35 * r, .5 * r, 0);
    c.fillStyle = 'rgba(240,228,216,.9)'; ell(c, .15 * r, .1 * r, .42 * r, .36 * r, .3); ell(c, .3 * r, -.12 * r, .22 * r, .22 * r, 0);
  },
  9: (c, r) => {
    for (const [x, y, s] of [[-.3, -.15, .25], [.3, .2, .2], [-.05, .5, .14], [.45, -.4, .12]]) {
      c.beginPath(); c.arc(x * r, y * r, Math.max(0, s * r), 0, TAU); c.fillStyle = 'rgba(80,80,92,.4)'; c.fill();
    }
  },
};
// i: 0-7 planets, 8 Pluto, 9 Moon. (lx, ly): unit vector from the planet towards the light.
function drawPlanet(c, i, x, y, r, lx, ly, spin = 0) {
  r = Math.max(.6, r);
  const [lc, bc, dc] = LIGHT[i];
  c.save(); c.globalAlpha = 1;
  let g = c.createRadialGradient(x, y, r * .8, x, y, r * 1.8);
  g.addColorStop(0, bc + '55'); g.addColorStop(1, bc + '00');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r * 1.8, 0, TAU); c.fill();
  if (i === 5) { // Saturn, seen from above: a ring round the planet
    const ro = r * 2, ri = r * 1.38;
    c.beginPath(); c.arc(x, y, ro, 0, TAU); c.arc(x, y, ri, 0, TAU, true);
    g = c.createRadialGradient(x, y, ri, x, y, ro);
    g.addColorStop(0, '#9b8658'); g.addColorStop(.34, '#e6d3a2'); g.addColorStop(.52, '#cfb883'); g.addColorStop(.58, '#463b28');
    g.addColorStop(.66, '#463b28'); g.addColorStop(.72, '#d8c28e'); g.addColorStop(1, '#a08c60');
    c.fillStyle = g; c.fill();
  }
  g = c.createRadialGradient(x + lx * r * .4, y + ly * r * .4, r * .05, x, y, r * 1.1);
  g.addColorStop(0, lc); g.addColorStop(.55, bc); g.addColorStop(1, dc);
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = g; c.fill();
  if (r > 2.2) { c.save(); c.clip(); c.translate(x, y); c.rotate(spin); FEAT[i](c, r); c.restore(); }
  g = c.createRadialGradient(x + lx * r * .55, y + ly * r * .55, r * .3, x + lx * r * .2, y + ly * r * .2, r * 1.5);
  g.addColorStop(0, 'rgba(2,4,18,0)'); g.addColorStop(.55, 'rgba(2,4,18,0)'); g.addColorStop(1, 'rgba(2,4,18,.68)');
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = g; c.fill();
  c.lineWidth = .8; c.strokeStyle = 'rgba(0,0,0,.35)'; c.stroke();
  if (r > 6) {
    g = c.createRadialGradient(x + lx * r * .5, y + ly * r * .5, 0, x + lx * r * .5, y + ly * r * .5, r * .45);
    g.addColorStop(0, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  }

}
const toSun = (x, y, L) => { const dx = L.cx - x, dy = L.cy - y, d = Math.hypot(dx, dy) || 1; return [dx / d, dy / d]; };
const ring = (c, x, y, r, color, w, dash) => { c.save(); c.setLineDash(dash || []); c.lineWidth = w; c.strokeStyle = color; c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); c.stroke(); c.restore(); };

// --- the Orbits view ---------------------------------------------------------------------------------------
function drawOrbit(c, w, h, L, time) {
  if (S.race) return drawRace(c, w, h, L, time);
  const { cx, cy, R, f } = L, free = S.sec === 'free', pl = S.sec === 'pluto';
  const hid = (i) => pl && i < 4;
  const P = []; for (let i = 0; i < 8; i++) P[i] = planetWorld(i, L);
  const ez = ease(S.zoomT), z = 1 + 3.4 * ez, cam = { x: lerp(cx, P[2].x, ez), y: lerp(cy, P[2].y, ez) };
  const S2 = (p) => ({ x: (p.x - cam.x) * z + cx, y: (p.y - cam.y) * z + cy });
  const mr = 15 * f, moon = { x: P[2].x + Math.cos(S.moonA) * mr, y: P[2].y - Math.sin(S.moonA) * mr };
  if (S.zoomT > .02) {
    const last = S.trail[S.trail.length - 1];
    if (!last || Math.hypot(last.x - moon.x, last.y - moon.y) > .35) { S.trail.push({ x: moon.x, y: moon.y }); if (S.trail.length > 420) S.trail.shift(); }
  } else S.trail.length = 0;
  geo.pl = {};

  c.save(); c.translate(cx, cy); c.scale(z, z); c.translate(-cam.x, -cam.y);
  // orbit rings
  for (let i = 0; i < 8; i++) {
    const on = S.sel === i;
    ring(c, cx, cy, RR[i] * R, free ? 'rgba(160,175,220,.12)' : hid(i) ? 'rgba(160,175,220,.09)' : on ? 'rgba(150,196,255,.62)' : 'rgba(160,175,220,.22)', (on ? 1.6 : 1) / z, free ? [3 / z, 5 / z] : null);
  }
  if (pl) { // Pluto's stretched, tilted orbit: the part inside Neptune's orbit is drawn brighter
    let prev = plutoAt(0, L), prevIn = Math.hypot(prev.x - cx, prev.y - cy) < RR[7] * R;
    for (let k = 1; k <= 160; k++) {
      const q = plutoAt(k / 160 * TAU, L), dIn = Math.hypot(q.x - cx, q.y - cy) < RR[7] * R, inside = dIn || prevIn;
      c.beginPath(); c.moveTo(prev.x, prev.y); c.lineTo(q.x, q.y);
      c.strokeStyle = inside ? 'rgba(255,211,122,.95)' : 'rgba(201,169,143,.55)'; c.lineWidth = (inside ? 2.2 : 1.2) / z; c.stroke();
      prev = q; prevIn = dIn;
    }
  }
  drawBelt(c, L, 1, time, z);
  drawSun(c, cx, cy, R, time, z);
  // straight-line paths of the secret
  if (free && S.free) {
    for (let i = 0; i < 8; i++) {
      const a = S.free.pos0[i], p = P[i], fade = S.back ? 1 - ease(S.back.t / 1.6) : 1, q = S.back ? S.back.from[i] : null;
      const ex = q ? cx + q.x * R : p.x, ey = q ? cy + q.y * R : p.y;
      const g = c.createLinearGradient(cx + a.x * R, cy + a.y * R, ex, ey);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(255,255,255,${.5 * fade})`);
      c.strokeStyle = g; c.lineWidth = 1.2 / z; c.beginPath(); c.moveTo(cx + a.x * R, cy + a.y * R); c.lineTo(ex, ey); c.stroke();
    }
  }
  // Moon's path and orbit
  if (S.trail.length > 2) {
    c.lineCap = 'round'; c.lineJoin = 'round';
    const n = S.trail.length, step = 6;
    for (let k = 0; k < n - 1; k += step) {
      const e = Math.min(n - 1, k + step + 1);
      c.beginPath(); c.moveTo(S.trail[k].x, S.trail[k].y);
      for (let j = k + 1; j <= e; j++) c.lineTo(S.trail[j].x, S.trail[j].y);
      c.strokeStyle = `rgba(210,220,255,${.08 + .6 * ez * (k / n)})`; c.lineWidth = 1.6 / z; c.stroke();
    }
  }
  if (!hid(2) && !free) ring(c, P[2].x, P[2].y, mr, 'rgba(200,215,255,.28)', 1 / z);
  // planets
  for (let i = 7; i >= 0; i--) {
    if (hid(i)) continue;
    const p = P[i], r = SZ[i] * f, [lx, ly] = toSun(p.x, p.y, L);
    drawPlanet(c, i, p.x, p.y, r, lx, ly, i === 2 ? time * .8 : 0);
    const s = S2(p); geo.pl[i] = { x: s.x, y: s.y, r: r * z * (i === 5 ? 2 : 1) };
    if (S.sel === i) ring(c, p.x, p.y, r * (i === 5 ? 2 : 1) + 4 / z, 'rgba(255,255,255,.85)', 1.3 / z, [3 / z, 3 / z]);
  }
  if (!hid(2) && !free) { const [lx, ly] = toSun(moon.x, moon.y, L); drawPlanet(c, 9, moon.x, moon.y, 2.3 * f, lx, ly); }
  let plu = null;
  if (pl) {
    plu = plutoPos(L); const [lx, ly] = toSun(plu.x, plu.y, L);
    drawPlanet(c, 8, plu.x, plu.y, SZ[8] * f, lx, ly);
    const s = S2(plu); geo.pl[8] = { x: s.x, y: s.y, r: SZ[8] * f * z };
    if (S.sel === 8) ring(c, plu.x, plu.y, SZ[8] * f + 4 / z, 'rgba(255,255,255,.85)', 1.3 / z, [3 / z, 3 / z]);
  }
  c.restore();

  // labels, on top, in screen space
  const label = (text, p, dy, o) => { const s = S2(p); if (s.x > -10 && s.x < w + 10 && s.y > -10 && s.y < h + 10) pill(c, text, s.x, s.y + dy, o); };
  if (S.zoomT > .5) {
    label(NAME(2), P[2], SZ[2] * f * z + 14, { color: '#9fd0ff' });
    label(T[lang].moon, moon, -(2.3 * f * z + 14), { color: '#e6e6f0' });
  } else if (S.sel !== null && geo.pl[S.sel]) {

// --- the Race ----------------------------------------------------------------------------------------------
function drawRace(c, w, h, L, time) {
  const { cx, cy, R, f } = L, r = S.race, t = T[lang];
  geo.pl = {};
  for (const i of RACE) ring(c, cx, cy, RACE_R[i] * R, 'rgba(160,175,220,.34)', 1.2);
  // the start / finish line

  c.save(); c.setLineDash([5, 5]); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(cx, cy); c.lineTo(ex, ey); c.stroke(); c.restore();
  c.save(); c.globalAlpha = 1; c.fillStyle = '#fff'; c.font = '20px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🏁', ex, ey); c.restore();
  drawSun(c, cx, cy, R, time);
  for (const i of RACE) {
    const a = RACE_TH + TAU * r.rt / PY[i], x = cx + RACE_R[i] * R * Math.cos(a), y = cy - RACE_R[i] * R * Math.sin(a), rad = SZ[i] * f * 1.35;
    if (r.win === i) {

  RACE.forEach((i, k) => {
    const laps = Math.floor(r.rt / PY[i] + 1e-9);
    pill(c, `${r.win === i ? '🏆 ' : ''}${NAME(i)}   ${laps}`, 8, 40 + k * 24, { left: true, color: COL[i], stroke: r.win === i ? '#ffe178' : null });
  });
}

// --- the Order view ----------------------------------------------------------------------------------------
function newOrd() {
  let p;
  do { p = [0, 1, 2, 3, 4, 5, 6, 7].sort(() => Math.random() - .5); } while (p.filter((x, j) => x === j).length > 1);
  return { tok: p.map((pi, home) => ({ i: pi, home, slot: null, x: NaN, y: NaN, k: 0, drag: false, ok: false })), sel: null, checked: false, nOk: 0, beltT: 0, drag: null, hover: -1 };
}
const trayPos = (tok, w, L) => ({ x: (tok.home % 4 + .5) * w / 4, y: L.ty + 30 + Math.floor(tok.home / 4) * 62 });

  const O = S.ord, { cx, cy, R, f } = L, bt = O.beltT;

    c.fillStyle = `rgba(110,150,255,${.08 * bt})`; c.beginPath(); c.arc(cx, cy, R * .99, 0, TAU); c.arc(cx, cy, R * (BELT + .035), 0, TAU, true); c.fill();
  }

  drawBelt(c, L, bt, time);
  // empty slots

    for (let k = 0; k < 8; k++) {
      if (O.tok.some((t) => t.slot === k)) continue;
      const p = slotPos(k, L), hov = O.hover === k;
      c.save(); c.setLineDash([3, 3]); c.lineWidth = hov ? 2 : 1.2; c.strokeStyle = hov ? '#7fb2ff' : 'rgba(255,255,255,.5)';
      c.beginPath(); c.arc(p.x, p.y, 12, 0, TAU); c.fillStyle = hov ? 'rgba(60,100,200,.55)' : 'rgba(8,10,22,.6)'; c.fill(); c.stroke(); c.restore();
      c.save(); c.fillStyle = '#cfd8ff'; c.font = '800 12px Nunito, system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(k + 1), p.x, p.y + .5); c.restore();
    }
  }
  drawSun(c, cx, cy, R, time);
  // the tray
  c.save(); rrect(c, 6, L.ty + 4, w - 12, TRAYH - 10, 16); c.fillStyle = 'rgba(14,18,40,.72)'; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(130,145,190,.28)'; c.stroke(); c.restore();
  if (bt > 0) {
    c.save(); c.globalAlpha = bt;

    T[lang].od.legend.forEach((s, k) => {
      const y = L.ty + 30 + k * 34; c.fillStyle = sw[k]; rrect(c, 20, y - 11, 4, 22, 2); c.fill();
      c.fillStyle = '#e8ecff'; c.font = '800 13px Nunito, system-ui, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(s, 34, y + .5);

    if (isNaN(tok.x)) { tok.x = tp.x; tok.y = tp.y; } else if (!tok.drag) { tok.x += (tp.x - tok.x) * a; tok.y += (tp.y - tok.y) * a; }
    tok.k += ((tok.drag ? .55 : tok.slot !== null ? 1 : 0) - tok.k) * (1 - Math.exp(-12 * dt));

    drawPlanet(c, i, tok.x, tok.y, r, lx0 / ld, ly0 / ld, i === 2 ? time * .8 : 0);
    if (O.sel === tok) ring(c, tok.x, tok.y, r * big + 5, 'rgba(255,255,255,.9)', 1.5, [3, 3]);
    if (O.checked) ring(c, tok.x, tok.y, r * big + 5, tok.ok ? '#3ddc97' : '#f5c84c', 2.2);

    const ang = SP[tok.slot !== null ? tok.slot : 0], ox = lerp(0, Math.cos(ang), k), oy = lerp(1, -Math.sin(ang), k), od = Math.hypot(ox, oy) || 1, off = r * big + 13;
    pill(c, NAME(i), tok.x + ox / od * off, tok.y + oy / od * off, { color: COL[i] });

}

// --- the Birthdays view ------------------------------------------------------------------------------------
function drawBday(c, w, h, L, time) {
  const { cx, cy, R, f } = L, N = counts(S.age), e = S.bRev ? ease(S.bT / 1.2) : 0, best = Math.max(...N), win = N.indexOf(best);
  geo.pl = {};
  for (let i = 0; i < 8; i++) ring(c, cx, cy, RR[i] * R, 'rgba(160,175,220,.24)', 1);
  drawSun(c, cx, cy, R, time);
  for (let i = 0; i < 8; i++) {
    const p = spreadPos(i, L), r = SZ[i] * f * 1.15, big = i === 5 ? 2 : 1, [lx, ly] = toSun(p.x, p.y, L);
    drawPlanet(c, i, p.x, p.y, r, lx, ly, i === 2 ? time * .8 : 0);
    geo.pl[i] = { x: p.x, y: p.y, r: r * big };
    if (S.bRev) {
      if (i === win) ring(c, p.x, p.y, r * big + 5, '#3ddc97', 2.4);

    pill(c, S.bRev ? `🎂 ${Math.floor(N[i] * e)}` : NAME(i), p.x + ox * off, p.y + oy * off, { color: S.bRev ? (i === win ? '#7ff0b8' : '#fff') : COL[i] });

}

// --- the loop ----------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  const v = lab.view, L = layout(w, h, v);
  step(dt, v);
  drawBg(c, w, h, time);
  if (v === 'orbit') drawOrbit(c, w, h, L, time); else if (v === 'order') drawOrder(c, w, h, L, dt, time); else drawBday(c, w, h, L, time);
  live();
});
function step(dt, v) {
  if (v === 'orbit') {
    S.moonA += dt * 2.8;
    const r = S.race;
    if (r) {
      if (r.phase === 'run') {
        r.rt += dt / 6;
        if (r.win < 0) {
          let best = -1; for (const p of RACE) if (r.rt >= PY[p] && (best < 0 || PY[p] < PY[best])) best = p;
          if (best >= 0) { r.win = best; sfx.good(); render(); }
        }
        if (r.rt >= 1) { r.rt = 1; r.phase = 'done'; render(); }
      }
    } else if (S.sec === 'free' && S.free) {
      if (S.back) { S.back.t += dt; if (S.back.t >= 1.6) { S.sec = null; S.free = null; S.back = null; render(); } } else S.free.t += dt;
    } else S.years += dt * rate();
  }
  S.zoomT += clamp((v === 'orbit' && S.zoom && !S.race ? 1 : 0) - S.zoomT, -dt / .7, dt / .7);
  if (v === 'bday' && S.bRev) S.bT += dt;
  if (v === 'order' && S.ord) S.ord.beltT += clamp((S.ord.checked ? 1 : 0) - S.ord.beltT, -dt / .9, dt / .9);
}

// --- readout and state: one place, called from render() and from the loop ----------------------------------
function readout() {
  const t = T[lang], v = lab.view;
  if (v === 'orbit') {
    if (S.race) {
      const r = S.race;
      return r.phase === 'ask' ? ['🏁', t.rc.sub, '', '#ffd24a'] : [num(r.rt), t.yrsSub, r.win >= 0 ? `🏆 ${NAME(r.win)}` : '', '#ffd24a'];
    }
    if (S.sec === 'free') return [S.back ? t.fr.vOn : t.fr.v, t.fr.sub, '', '#ff7a6b'];
    return [num(S.years), t.yrsSub, S.zoom ? '' : `${NAME(S.sel)} · ${t.yearTxt[S.sel]}`, '#ffb347'];
  }
  if (v === 'order') {
    const O = S.ord;
    return O.checked ? [`${O.nOk}/8`, t.od.okSub, '', '#7fb2ff'] : [`${O.tok.filter((x) => x.slot !== null).length}/8`, t.od.placed, '', '#7fb2ff'];
  }
  const N = counts(S.age), win = N.indexOf(Math.max(...N));
  return [String(S.age), t.bd.old(S.age), S.bRev ? `🏆 ${t.bd.most}: ${NAME(win)}` : '', '#ff9ec4'];
}
function live() {
  const [a, b, p, col] = readout(), key = [a, b, p, lang, lab.view].join('|');
  if (key !== lastRO) { lastRO = key; lab.setReadout(a, b, p, col); }
  const el = $('pl-laps'); if (el) { const s = num(S.years / PY[S.sel]); if (el.textContent !== s) el.textContent = s; }
}

// --- controls ----------------------------------------------------------------------------------------------
const dot = (i) => `<i class="pl-dot" style="background:${COL[i]}"></i>`;
const chip = (act, attrs, inner, on) => `<button class="chip pl-chip ${on ? 'on' : ''}" data-act="${act}" ${attrs}>${inner}</button>`;
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'spd') { S.speed = +b.dataset.k; sfx.click(); }
  else if (a === 'pl') { S.sel = i; sfx.tick(); }
  else if (a === 'zoom') { S.zoom = !S.zoom; sfx.click(); }
  else if (a === 'race') { S.race = { phase: 'ask', guess: null, rt: 0, win: -1 }; S.zoom = false; sfx.click(); }
  else if (a === 'rback') { S.race = null; sfx.click(); }
  else if (a === 'ragain') { S.race = { phase: 'ask', guess: null, rt: 0, win: -1 }; sfx.click(); }
  else if (a === 'rguess') { S.race.guess = i; S.race.phase = 'run'; sfx.click(); showStage(); }
  else if (a === 'check') checkOrder();
  else if (a === 'oagain') { S.ord = newOrd(); sfx.click(); }
  else if (a === 'age') { S.age = clamp(S.age + +b.dataset.d, 1, 14); S.bg = null; S.bRev = false; S.bT = 0; sfx.tick(); }
  else if (a === 'bguess') bGuess(i);
  else if (a === 'sec') return runSecret(b.dataset.k);
  else if (a === 'back') { S.back = { t: 0, from: [0, 1, 2, 3, 4, 5, 6, 7].map((k) => { const u = freeUnits(k); return { x: u.x, y: u.y }; }) }; sfx.snap(); }
  render();
});
function bGuess(i) {

  const N = counts(S.age); S.bg = i; S.bRev = true; S.bT = 0;
  (N[i] === Math.max(...N) ? sfx.good : sfx.bad)(); showStage();
}
function checkOrder() {
  const O = S.ord; if (O.checked || O.tok.some((x) => x.slot === null)) return;
  O.tok.forEach((x) => { x.ok = x.slot === x.i; });
  O.nOk = O.tok.filter((x) => x.ok).length; O.checked = true; O.sel = null;
  O.tok.forEach((x) => { x.slot = x.i; });
  (O.nOk === 8 ? sfx.good : sfx.bad)(); showStage();
}
function runSecret(k) {
  if (!secret.unlocked()) return secret.open();
  if (lab.view !== 'orbit') { lab.view = 'orbit'; lab.renderChrome(); }
  S.race = null; S.zoom = false;
  if (S.sec === k) { // pressing again puts the scene back
    if (k === 'free') { if (!S.back) S.back = { t: 0, from: [0, 1, 2, 3, 4, 5, 6, 7].map((q) => { const u = freeUnits(q); return { x: u.x, y: u.y }; }) }; }
    else { S.sec = null; if (S.sel === 8) S.sel = 2; }
  } else if (k === 'pluto') { S.sec = 'pluto'; S.free = null; S.back = null; S.p0 = S.years; S.sel = 8; }
  else {
    S.sec = 'free'; S.back = null;
    const pos0 = [], dir = [];
    for (let i = 0; i < 8; i++) { const a = TH0[i] + TAU * S.years / PY[i]; pos0.push({ x: RR[i] * Math.cos(a), y: -RR[i] * Math.sin(a) }); dir.push({ x: -Math.sin(a), y: -Math.cos(a) }); }
    S.free = { t: 0, pos0, dir }; if (S.sel === 8) S.sel = 2;
  }
  sfx.click(); render();

// --- pointer: pick a planet, or drag a planet token ---------------------------------------------------------
const cv = $('cv');
const at = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
function nearestSlot(px, py, maxD) {
  const L = layout(CW, CH, 'order'); let best = -1, bd = maxD;
  for (let k = 0; k < 8; k++) { const p = slotPos(k, L), d = Math.hypot(p.x - px, p.y - py); if (d < bd) { bd = d; best = k; } }
  return best;
}
function placeTok(tok, k) {
  const O = S.ord, other = O.tok.find((x) => x.slot === k && x !== tok);
  if (other) other.slot = null;
  tok.slot = k; O.sel = null; sfx.snap();
}
cv.addEventListener('pointerdown', (ev) => {
  const p = at(ev), v = lab.view;
  if (v === 'order') {
    const O = S.ord; if (O.checked) return;
    let hit = null, best = 28;
    for (const t of O.tok) { const d = Math.hypot(t.x - p.x, t.y - p.y); if (d < best) { best = d; hit = t; } }
    if (hit) { O.drag = { tok: hit, sx: p.x, sy: p.y, moved: false }; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ } return; }
    if (O.sel) { const k = nearestSlot(p.x, p.y, 30); if (k >= 0) { placeTok(O.sel, k); render(); } }
    return;
  }
  if ((v === 'orbit' && S.race) || (v === 'bday' && S.bRev)) return;
  let hit = -1, best = 1e9;
  for (const [i, g] of Object.entries(geo.pl)) { const d = Math.hypot(g.x - p.x, g.y - p.y); if (d < Math.max(g.r + 12, 24) && d < best) { best = d; hit = +i; } }
  if (hit < 0) return;

});
cv.addEventListener('pointermove', (ev) => {
  const O = S.ord; if (lab.view !== 'order' || !O?.drag) return;
  const p = at(ev), d = O.drag;
  if (!d.moved && Math.hypot(p.x - d.sx, p.y - d.sy) > 7) { d.moved = true; d.tok.drag = true; d.tok.slot = null; O.sel = null; }
  if (d.moved) { d.tok.x = p.x; d.tok.y = p.y - 16; O.hover = nearestSlot(p.x, p.y - 8, 46); }
});
function endDrag(ev) {

  const d = O.drag, tok = d.tok; O.drag = null; O.hover = -1;
  if (d.moved) {
    tok.drag = false;
    const p = at(ev), k = ev.type === 'pointerup' ? nearestSlot(p.x, p.y - 8, 46) : -1;
    if (k >= 0) placeTok(tok, k); else tok.slot = null;
  } else if (tok.slot !== null) { tok.slot = null; O.sel = tok; sfx.tick(); }
  else { O.sel = O.sel === tok ? null : tok; sfx.tick(); }
  render();
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// --- one render per change -----------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  if (!S.ord) S.ord = newOrd();
  document.body.dataset.v = v;
  $('secOrbit').style.display = v === 'orbit' && !S.race ? '' : 'none';
  $('secRace').style.display = v === 'orbit' && S.race ? '' : 'none';
  $('secOrder').style.display = v === 'order' ? '' : 'none';
  $('secBday').style.display = v === 'bday' ? '' : 'none';
  const sc = (k, emo) => `<button class="chip pl-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('pluto', '🧊') + sc('free', '🧲') + (S.sec === 'free' && !S.back && lab.view === 'orbit' ? chip('back', '', esc(t.fr.back), false) : '');
  const F = (k, emo) => ({ emo, text: t.facts[k], src: SRC[k] });

}
function renderOrbit(t, F) {

      ? `<p class="pl-q">${esc(t.rc.q)}</p><div class="pl-btns">${RACE.map((i) => chip('rguess', `data-i="${i}"`, `${dot(i)}${esc(NAME(i))}`, false)).join('')}</div>
         <div class="row2">${chip('rback', '', esc(t.rc.back), false)}</div>`

    let st;

  const link = `../solar-scale/?lang=${lang}`;
  const note = `<div class="pl-note">${esc(t.lapsL)} <b id="pl-laps"></b></div><div class="pl-note" style="margin-top:8px">${esc(t.squeeze)} <a href="${link}">${esc(t.scaleLink)}</a>.</div>`;
  let st;
  if (free) st = { emo: '🧲', title: t.fr.title, lead: t.fr.lead, body: t.fr.body, extra: '' };
  else if (S.zoom) st = { emo: '🌍', title: t.zm.title, lead: t.zm.lead, body: t.zm.body, extra: '' };
  else {
    const i = S.sel;
    st = { emo: '🪐', title: NAME(i), lead: i === 8 ? t.pc.lead : t.type[i < 4 ? 'rocky' : 'giant'], body: i === 8 ? t.pc.body : `${t.yearL} ${t.yearTxt[i]}.`, extra: note };
    if (i === 8) st.extra = `<div class="pl-note">${esc(t.yearL)} ${esc(t.yearTxt[8])}.</div>` + note;
  }
  lab.setState(st);
  lab.setFacts(pl ? [F('iau', '🧊'), F('nep', '🔭')] : [F('nep', '🔭'), F('sat', '🪐')]);
}
function renderOrder(t, F) {
  const O = S.ord, all = O.tok.every((x) => x.slot !== null);
  lab.setGlow('rgba(127,178,255,.26)');
  $('secOrder').innerHTML = `<div class="pl-btns">${O.checked ? `<button class="btn pl-btn" data-act="oagain">${esc(t.od.again)}</button>` : `<button class="btn pl-btn" data-act="check"${all ? '' : ' disabled'}>${esc(t.od.check)}</button>`}</div>`;
  let st;
  if (!O.checked) st = { emo: '🔢', title: t.od.title, lead: t.od.lead, body: t.od.body };
  else st = { emo: O.nOk === 8 ? '🏆' : '🤔', title: O.nOk === 8 ? t.od.allOk : t.od.some(O.nOk), lead: O.nOk === 8 ? t.od.allLead : t.od.someLead, body: t.od.end };
  lab.setState({ ...st, extra: '' });
  lab.setFacts([F('jup', '🪐'), F('iau', '🧊')]);
}
function renderBday(t, F) {
  const N = counts(S.age), win = N.indexOf(Math.max(...N)), b = t.bd;
  lab.setGlow('rgba(255,158,196,.26)');
  const pls = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => chip('bguess', `data-i="${i}"`, `${dot(i)}${esc(NAME(i))}${S.bRev ? ` <b>${N[i]}</b>` : ''}`, S.bg === i)).join('');
  $('secBday').innerHTML = `<div class="pl-step"><span class="lbl">${esc(b.age)}</span><button class="pl-sb" data-act="age" data-d="-1" aria-label="−"${S.age <= 1 ? ' disabled' : ''}>−</button><span class="pl-age">${S.age}</span><button class="pl-sb" data-act="age" data-d="1" aria-label="+"${S.age >= 14 ? ' disabled' : ''}>+</button></div>
    <div class="row2"><span class="lbl">${esc(t.plL)}</span><div class="chips">${pls}</div></div>`;
  let st;
  if (!S.bRev) st = { emo: '🎂', title: b.title, lead: b.lead, body: '' };
  else st = { emo: S.bg === win ? '🏆' : '🤔', title: S.bg === win ? b.right : b.wrong, lead: b.lead2(N[0], S.age, N[4]), body: b.body };
  lab.setState({ ...st, extra: '' });
  lab.setFacts([F('ven', '🌅')]);
}
render();
</script>
