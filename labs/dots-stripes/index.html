const PAL = { d: { l: '#8dbcff', m: '#3d7ee8', d: '#1f4fa8' }, s: { l: '#ffcb8a', m: '#f0902a', d: '#a85a0c' } };
function badge(c, x, y, r, team, a = 1) {

  } else {
    c.strokeStyle = 'rgba(255,255,255,.92)'; c.lineWidth = r * 0.3;

  }

}

function pill(c, txt, x, y, o = {}) { // dark rounded label, never smaller than 12 px on screen

  let x0 = o.align === 'left' ? x : o.align === 'right' ? x - pw : x - pw / 2;
  x0 = Math.min(Math.max(x0, 2), DW - pw - 2);

  { eye: 'n', skin: 4, hair: 0, hs: 'buzz', top: '#8a5fb5', bottom: '#4a4458', outfit: 'tee', age: 'child' },
  { eye: 'n', skin: 0, hair: 1, hs: 'pony', top: '#c85a7a', bottom: '#34406b', outfit: 'sweater', age: 'child' },
];
const KIDPOS = [[130, 214], [188, 214], [246, 214], [304, 214], [160, 262], [218, 262], [276, 262], [334, 262]];
const KIDORDER = [0, 4, 1, 5, 2, 6, 3, 7];
const TEACHER = { skin: 2, hair: 4, hs: 'bob', age: 'adult', outfit: 'cardigan', top: '#5f7fa0', bottom: '#3b3a4f' };
function eyeChip(c, x, y, kind) {
  c.fillStyle = 'rgba(10,12,20,.8)'; rr(c, x - 14, y - 9, 28, 18, 9); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(x, y, 10, 6.2, 0, 0, TAU); c.fill();
  c.fillStyle = kind === 'b' ? '#3b86d8' : '#6a3d1e'; c.beginPath(); c.arc(x, y, 4.6, 0, TAU); c.fill();
  c.fillStyle = '#111'; c.beginPath(); c.arc(x, y, 2, 0, TAU); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(x - 1.5, y - 1.5, 1, 0, TAU); c.fill();
}
function drawEye(c, w, h) {
  const day = S.e.day, better = day === 1 ? 'b' : 'n';
  const wg = c.createLinearGradient(0, 0, 0, h); wg.addColorStop(0, '#efe6d4'); wg.addColorStop(1, '#cdb894'); c.fillStyle = wg; c.fillRect(0, 0, w, h);
  place(c, w, h, 360, 300);
  c.fillStyle = wg; c.fillRect(-400, -400, 1160, 1000);
  c.fillStyle = '#b79c74'; c.fillRect(-400, 176, 1160, 600);
  const fg = c.createLinearGradient(0, 176, 0, 300); fg.addColorStop(0, '#c4a780'); fg.addColorStop(1, '#a98b64'); c.fillStyle = fg; c.fillRect(-400, 176, 1160, 600);
  c.fillStyle = '#3f5a4c'; rr(c, 12, 76, 120, 66, 6); c.fill(); c.strokeStyle = '#8a6a44'; c.lineWidth = 4; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2; c.beginPath(); c.moveTo(26, 98); c.lineTo(84, 98); c.moveTo(26, 114); c.lineTo(100, 114); c.stroke();
  c.fillStyle = '#bcd9ee'; rr(c, 296, 70, 52, 62, 4); c.fill(); c.strokeStyle = '#8a6a44'; c.lineWidth = 3; c.stroke(); c.beginPath(); c.moveTo(322, 70); c.lineTo(322, 132); c.stroke();
  const order = KIDORDER.map((i, s) => ({ k: KIDS[i], p: KIDPOS[s] })).sort((a, b) => a.p[1] - b.p[1]);
  shadow(c, 52, 266, 120); figure(c, TEACHER, null, 52, 266, 120, { mood: 'calm', arms: { l: ARMS.down, r: ARMS.open } });
  for (const { k, p } of order) {
    const good = k.eye === better; shadow(c, p[0], p[1] + 20, 60);
    const hh = figure(c, k, null, p[0], p[1] + 20, 66, { mood: good ? 'laugh' : 'sad' });
    eyeChip(c, p[0], p[1] + 20 - hh - 10, k.eye);
  }
  const bub = $('bub'); if (bub) bub.style.setProperty('--tx', `${clamp(G.ox + 52 * G.K - 8, 22, bub.offsetWidth - 22)}px`);
}

// --- shell, controls ---------------------------------------------------------------------------------------
const lab = shell({ key: 'dots-stripes', T, topics: TOPICS, views: ['coin', 'harvest', 'well'], onLang: render, onView: () => { S.sec = null; render(); } });
const secret = secretLab('dots-stripes', () => ({
  secrets: [{ emo: '🔄', title: T[lang].secrets.swap[0], desc: T[lang].secrets.swap[1] }, { emo: '👀', title: T[lang].secrets.eye[0], desc: T[lang].secrets.eye[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="vCoin">
    <div id="cFlipB"><button class="btn" data-a="toss" id="cTossB"></button></div>
    <div id="cTask">
      <input type="range" class="big" id="cSl" min="0" max="10" step="1" value="5" aria-label="coins">
      <div class="ends"><span id="cLE"></span><span id="cRE"></span></div>
      <div class="row2" style="margin-top:2px"><span class="fine" id="cNum"></span><button class="btn push" data-a="give" id="cGive"></button></div>
    </div>
    <div id="cRes">
      <div class="optq" id="cOQ"></div>
      <div class="opts2" id="cOpts"></div>
      <div class="row2"><button class="btn ghost" data-a="again" id="cAgain"></button></div>
    </div>
  </div>
  <div id="vHarvest">
    <div class="th"><div class="thl"><span id="thT"></span></div><div class="thb"><i id="thf"></i></div><div class="the"><span id="thC"></span><span id="thW"></span></div></div>
    <div class="chips" id="hActs"></div>
    <div class="row2"><button class="btn" data-a="hstep" id="hStep"></button><button class="btn ghost" data-a="hagain" id="hAgain"></button></div>
  </div>
  <div id="vWell"><div class="row2" style="margin-top:0"><button class="btn ghost" data-a="wagain" id="wAgain"></button></div></div>
  <div id="vEye">
    <div class="mood"><div class="ml"><span id="eBL"></span><span id="eBV"></span></div><div class="mb"><i id="eBb" style="background:#3b86d8"></i></div></div>
    <div class="mood"><div class="ml"><span id="eNL"></span><span id="eNV"></span></div><div class="mb"><i id="eNb" style="background:#8a5a34"></i></div></div>
    <div class="row2"><button class="btn" data-a="eday" id="eNext"></button></div>
  </div>
  <div class="row2" id="secRow"></div>`;
const askEl = Object.assign(document.createElement('div'), { className: 'ask card' });
const bubEl = Object.assign(document.createElement('div'), { id: 'bub', className: 'bub' });
$('overlay').append(askEl, bubEl);
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const COL = '#5b8def';
const withSrc = (list, srcs) => list.map((f, i) => ({ ...f, src: srcs[i] }));
const nameOf = (v) => (lang === 'ru' ? NAMES_RU : NAMES)[v.team][v.j];
function setBub(html, spk) { bubEl.style.display = html ? '' : 'none'; bubEl.innerHTML = html || ''; bubEl.dataset.spk = spk == null ? '' : String(spk.id); }

// --- one render per change: controls, readout and the state card -------------------------------------------
function render() {
  const t = T[lang], v = lab.view, eye = S.sec === 'eye';
  document.body.dataset.v = eye ? 'eye' : v;
  const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
  show('vCoin', !eye && v === 'coin'); show('vHarvest', !eye && v === 'harvest'); show('vWell', !eye && v === 'well'); show('vEye', eye);
  askEl.style.display = 'none'; setBub('');
  const open = secret.unlocked();
  const sc = (k, emo, on) => `<button class="chip secret ds-chip ${open ? 'open' : ''} ${on ? 'on' : ''}" data-a="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('swap', '🔄', !eye && v === 'harvest' && S.h.swapped) + sc('eye', '👀', eye);
  if (eye) renderEye(t); else if (v === 'coin') renderCoin(t); else if (v === 'harvest') renderHarvest(t); else renderWell(t);
}
function renderCoin(t) {
  const C = S.c, tc = t.coin, ph = C.phase, own = C.own, oth = other(own);
  $('cFlipB').style.display = ph === 'flip' || ph === 'tossing' ? '' : 'none';
  $('cTossB').textContent = tc.toss; $('cTossB').disabled = ph === 'tossing';
  $('cTask').style.display = ph === 'tasks' ? '' : 'none';
  $('cRes').style.display = ph === 'result' ? '' : 'none';
  if (ph === 'flip' || ph === 'tossing') {
    lab.setReadout('?', '', '', COL); lab.setState({ emo: tc.st0[0], title: tc.st0[1], lead: tc.st0[2], body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (ph === 'predict') {
    askEl.style.display = '';
    askEl.innerHTML = `<div class="q">${esc(tc.q)}</div><p>${esc(tc.qLead)}</p><div class="opts"><button data-g="y">${esc(tc.yes)}</button><button data-g="n">${esc(tc.no)}</button></div>`;
    lab.setReadout('?', '', '', COL); lab.setState({ emo: '🪙', title: tc.got(t.team[own]), lead: tc.gotLead, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (ph === 'tasks') {
    const lt = leftTeam(C, C.round), sl = $('cSl');
    sl.value = C.sl; sl.style.setProperty('--track', `linear-gradient(90deg, ${PAL[lt].m}, ${PAL[other(lt)].m})`);
    $('cLE').textContent = t.whoS[lt]; $('cRE').textContent = t.whoS[other(lt)];
    $('cNum').textContent = tc.sl(C.sl, 10 - C.sl); $('cGive').textContent = tc.give;
    lab.setReadout(`${C.round + 1}/6`, tc.rd, '', COL);
    lab.setState({ emo: '🪙', title: tc.taskT(C.round + 1), lead: tc.taskLead, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const a = sumOf(C.give), b = 60 - a;
  $('cOQ').textContent = tc.optQ; $('cAgain').textContent = tc.again;
  $('cOpts').innerHTML = [['A', tc.optA], ['B', tc.optB]].map(([k, o]) => `<button class="chip optb ${C.pick === k ? 'on' : ''}" data-a="opt" data-k="${k}"><b>${o[0]}</b>${esc(o[1])}</button>`).join('');
  lab.setReadout(`${a} : ${b}`, `${tc.coins}: ${tc.ratio}`, '', COL);
  if (C.pick) lab.setState({ emo: '🪙', title: tc.line, lead: tc.after, body: '', extra: '' });
  else lab.setState({ emo: '📊', title: tc.resTitle, lead: tc.resLead(t.team[own], a, t.team[oth], b), body: `${tc.guessed(C.guess === 'y' ? tc.yesW : tc.noW)} ${tc.sch}`, extra: '' });
  lab.setFacts(withSrc(t.facts.coin, FSRC.coin));
}
function renderHarvest(t) {
  const H = S.h, tt = t.h, step = H.step, done = H.turned != null, off = done || step === 0 || step >= 7;
  $('thT').textContent = tt.thermo; $('thC').textContent = `❄️ ${tt.cold}`; $('thW').textContent = `${tt.warm} ☀️`;
  $('hActs').innerHTML = `<button class="chip ds-chip" data-a="hsay" ${off ? 'disabled' : ''}>${esc(tt.say)}</button>
    <button class="chip ds-chip ${H.asked ? 'on' : ''}" data-a="hask" ${off || H.asked ? 'disabled' : ''}>${esc(tt.ask)}</button>
    <button class="chip ds-chip" data-a="hlog" ${done || step < 3 ? 'disabled' : ''}>${step < 3 ? esc(tt.logLock) : `📜 ${esc(tt.log)}`}</button>`;
  $('hStep').textContent = step === 0 ? tt.next : tt.step; $('hStep').disabled = done || step >= 7;
  $('hAgain').textContent = tt.again; $('hAgain').style.display = done || step >= 7 ? '' : 'none';
  const extra = H.swapped ? `<div class="fine">${esc(tt.swapNote)}</div>` : '';
  const spk = speakerOf(H);
  if (done) {
    setBub(`<div class="lg">📜 <b>${esc(tt.logTitle)}</b><br>${esc(tt.logText)}</div><span class="nm">${esc(nameOf(spk))}</span>“${esc(tt.calmSay)}”`, spk);
    lab.setState({ emo: '🌤️', title: tt.endT(H.turned), lead: tt.endL[H.turned], body: tt.line, extra });
  } else if (step === 0) lab.setState({ emo: tt.intro[0], title: tt.intro[1], lead: tt.intro[2], body: tt.intro[3], extra });
  else if (step <= 6) {
    setBub(`<span class="nm">${esc(nameOf(spk))}</span>“${esc(H.asked ? tt.asks[step - 1] : tt.lines[step - 1])}”`, spk);
    lab.setState({ emo: '🗣️', title: tt.stTitle(step), lead: tt.notes[step - 1], body: H.asked ? tt.askNote : '', extra });
  } else lab.setState({ emo: tt.cold7[0], title: tt.cold7[1], lead: tt.cold7[2], body: tt.line, extra });
  lab.setReadout(step === 0 ? '❄️' : `${Math.min(step, 6)}/6`, tt.steps, '', '#6fa8d8');
  lab.setFacts(withSrc(t.facts.harvest, FSRC.harvest));
}
function renderWell(t) {
  const Wd = S.w, tw = t.w, n = Wd.pulls.length, d = Wd.pulls.filter((id) => id < 6).length, s = n - d;
  $('wAgain').textContent = tw.again;
  lab.setReadout(`${n}/8`, n ? tw.team(d, s) : tw.none, Wd.done ? '' : n ? tw.need(8 - n) : '', '#3d9bd6');
  if (Wd.done) lab.setState({ emo: tw.up[0], title: tw.up[1], lead: tw.up[2], body: tw.line, extra: '' });
  else lab.setState({ emo: tw.st0[0], title: tw.st0[1], lead: tw.st0[2], body: n >= 6 && (d === 0 || s === 0) ? tw.oneBadge : '', extra: '' });
  lab.setFacts(withSrc(t.facts.well, FSRC.well));
}
function renderEye(t) {
  const te = t.eye, day = S.e.day, bl = day === 1 ? 88 : 22, br = day === 1 ? 22 : 88;
  $('eBL').textContent = `${te.mood}: ${te.blue}`; $('eNL').textContent = `${te.mood}: ${te.brown}`;
  $('eBV').textContent = ''; $('eNV').textContent = '';
  $('eBb').style.width = `${bl}%`; $('eNb').style.width = `${br}%`;
  $('eNext').textContent = day === 1 ? te.next : te.back;
  setBub(`<span class="nm">${esc(te.teacher)}</span>“${esc(day === 1 ? te.say1 : te.say2)}”`, null);
  lab.setReadout(te.day(day), '', te.school, '#c9a15a');
  lab.setState({ emo: '👀', title: te.title, lead: day === 1 ? te.l1 : te.l2, body: day === 2 ? `${te.body} ${te.line}` : te.body, extra: '' });
  lab.setFacts(withSrc([t.facts.harvest[1]], [FSRC.harvest[1]]));
}

// --- actions -----------------------------------------------------------------------------------------------
const fresh = () => Object.assign(S.dis, { temp: 0.92, blend: 0, intro: 1 });
function hAdvance() { const H = S.h; if (H.turned != null || H.step >= 7) return; H.step++; H.asked = false; sfx.tick(); render(); }
function wToggle(id) {
  const Wd = S.w; if (Wd.done) return;
  if (Wd.pulls.includes(id)) { Wd.pulls = Wd.pulls.filter((x) => x !== id); sfx.tick(); }
  else if (Wd.pulls.length < 8) { Wd.pulls = [...Wd.pulls, id]; sfx.snap(); if (Wd.pulls.length === 8) { Wd.done = true; sfx.good(); } }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, C = S.c, H = S.h;
  if (a === 'toss') { C.phase = 'tossing'; C.tossAt = performance.now() / 1000; sfx.click(); }
  else if (a === 'give') {
    const own = leftTeam(C, C.round) === C.own ? C.sl : 10 - C.sl;
    C.give.push(own); C.round++; C.sl = 5; S.dis.jl = 5; S.dis.jr = 5;
    if (C.round >= 6) { C.phase = 'result'; C.resAt = performance.now() / 1000; sfx.good(); } else sfx.snap();
  } else if (a === 'opt') { C.pick = b.dataset.k; sfx.click(); }
  else if (a === 'again') { S.c = newCoin(newSeed()); S.dis.jl = 0; S.dis.jr = 0; sfx.click(); }
  else if (a === 'hsay' || a === 'hstep') { hAdvance(); return; }
  else if (a === 'hask') { if (H.asked || H.step < 1 || H.step > 6 || H.turned != null) return; H.asked = true; H.asks++; sfx.click(); }
  else if (a === 'hlog') { if (H.step < 3 || H.turned != null) return; H.turned = H.step; sfx.good(); }
  else if (a === 'hagain') { S.h = newHarvest(newSeed()); fresh(); sfx.click(); }
  else if (a === 'wagain') { S.w = newWell(); sfx.click(); }
  else if (a === 'eday') { S.e.day = S.e.day === 1 ? 2 : 1; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'swap') {
      if (lab.view !== 'harvest') document.querySelector('#views [data-view=harvest]')?.click();
      S.sec = null; const nb = other(S.h.blame); S.h = newHarvest(S.h.sd, nb); S.h.swapped = true; fresh();
    } else { S.sec = S.sec === 'eye' ? null : 'eye'; S.e.day = 1; }
    sfx.click(); render(); showStage(); return;
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => { if (ev.target.id === 'cSl') { S.c.sl = clamp(+ev.target.value, 0, 10); render(); } });
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-g]'); if (!b) return;
  S.c.guess = b.dataset.g; S.c.phase = 'tasks'; sfx.click(); render();
});
$('views').addEventListener('click', () => { if (S.sec) { S.sec = null; render(); } });

// the well: tap a villager to put them on the rope or take them off; drag works too
const cv = $('cv');
const toDesign = (ev) => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left - G.ox) / G.K, y: (ev.clientY - r.top - G.oy) / G.K }; };
const wellOn = () => lab.view === 'well' && !S.sec && !S.w.done;
cv.addEventListener('pointerdown', (ev) => {
  if (!wellOn()) return;
  const p = toDesign(ev); let best = null;
  for (const v of WCROWD) {
    const q = S.dis.P[v.id]; if (!q) continue; const hh = q.h * AGEK[LOOKS[v.look].age];
    if (Math.abs(p.x - q.x) < 24 && p.y > q.y - hh - 6 && p.y < q.y + 8 && (!best || q.y > S.dis.P[best.id].y)) best = v;
  }
  if (best) { drag = { id: best.id, sx: p.x, sy: p.y, moved: false }; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ } }
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return; const p = toDesign(ev), q = S.dis.P[drag.id];
  if (!drag.moved && Math.hypot(p.x - drag.sx, p.y - drag.sy) > 8) drag.moved = true;
  if (drag.moved && q) { q.x = clamp(p.x, 10, 350); q.y = clamp(p.y + 24, 40, 340); }
});
const endDrag = (ev) => {
  if (!drag) return; const d = drag; drag = null; const p = toDesign(ev), on = S.w.pulls.includes(d.id);
  if (!d.moved) wToggle(d.id);
  else if (p.y < 252 && !on) wToggle(d.id);
  else if (p.y >= 252 && on) wToggle(d.id);
  render();
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { drag = null; });

canvasLoop(cv, (c, w, h, dt, t) => {
  const v = S.sec === 'eye' ? 'eye' : lab.view;
  c.save();
  if (v === 'coin') drawCoin(c, w, h, dt, t); else if (v === 'harvest') drawHarvest(c, w, h, dt, t); else if (v === 'well') drawWell(c, w, h, dt, t); else drawEye(c, w, h);
  c.restore();
});
render();
</script>
