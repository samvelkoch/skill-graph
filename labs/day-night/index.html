const CITIES = [

];
const ISS_MIN = 92, ISS_RING = 1.3;          // orbit time in minutes (well known); ring radius / Earth radius (drawn, not real)
const mod = (x, m) => ((x % m) + m) % m;
const pad = (n) => String(n).padStart(2, '0');
const clock = (h) => { const m = Math.floor(mod(h, 24) * 60 + 1e-6) % 1440; return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
const phaseOf = (s) => (s >= 5 && s < 7 ? 'rise' : s >= 7 && s < 17 ? 'day' : s >= 17 && s < 19 ? 'set' : 'night');
const EMO = { night: '🌙', rise: '🌅', day: '☀️', set: '🌇' };
const sinAlt = (s) => Math.sin(Math.PI * (s - 6) / 12);
const toA = (c) => (typeof c === 'string' ? [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)) : c);
const mixA = (a, b, t) => { a = toA(a); b = toA(b); return a.map((v, i) => lerp(v, b[i], t)); };
const css = (a) => `rgb(${a.map(Math.round).join(',')})`;
function skyCols(s) {
  const dw = clamp((s + 0.15) / 0.5, 0, 1), tw = clamp(1 - Math.abs(s - 0.05) / 0.28, 0, 1) * 0.85;
  return { top: mixA('#060a1f', '#2f78d6', dw), hor: mixA(mixA('#101a3d', '#a9d6ff', dw), '#ff8a4a', tw), dw };
}

const S = { t: 9, d: 0, m: 0, city: 0, play: true, drag: false, answered: store.get('day-night:asked', false), answer: null, secret: null, geo: null };
const utc = () => S.t - 1;                                  // S.t is the clock in Budapest (UTC+1)
const sol = (c) => mod(utc() + c.lon / 15, 24);              // local solar hour from longitude
const zoneH = (c) => mod(utc() + c.off, 24);                 // clock hour in the city's standard time zone
const solarTarget = (hr) => mod(hr - CITIES[0].lon / 15 + 1, 24); // Budapest clock at which Budapest has solar hour `hr`

const lab = shell({ key: 'day-night', T, topics: TOPICS, views: ['spin', 'sky', 'zones'], onLang: () => render(), onView: () => { S.secret = null; render(); } });

$('scrub').addEventListener('input', () => { MODE().set(+$('scrub').value); S.play = false; sfx.tick(); syncPlay(); });
$('play').onclick = () => { S.play = !S.play; sfx.click(); syncPlay(); };
function syncPlay() { $('play').textContent = S.play ? T[lang].chips.pause : T[lang].chips.play; }

  dot(c, ex + Math.cos(pa) * re, ey + Math.sin(pa) * re, day ? '#ffd166' : '#7b8cff', Math.max(4.5, re * 0.15));
  const fs = clamp(w / 30, 11, 14); c.fillStyle = '#fff'; c.font = `800 ${fs}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(`📍 ${t.phase[day ? 'day' : 'night']}`, ex, ey + (ey > cy ? re + fs * 1.4 : -re - fs * 1.4));
  c.fillStyle = 'rgba(255,255,255,.6)'; c.fillText(t.sc.sunW, cx, cy + sr * 1.9);
}

function drawIss(c, w, h, time) {
  const t = T[lang], R = Math.min(w * 0.2, h * 0.22), cx = w * 0.42, cy = h * 0.5, r = R * ISS_RING, sr = clamp(h * 0.09, 16, 32), sx = w - sr - 10, i = issState(S.m);
  const sg = c.createLinearGradient(cx, 0, 0, 0); sg.addColorStop(0, 'rgba(0,0,12,.5)'); sg.addColorStop(1, 'rgba(0,0,12,.05)');
  c.fillStyle = sg; c.fillRect(0, cy - R, cx, 2 * R);
  drawSun(c, sx, cy, sr, time); drawRays(c, sx - sr * 1.7, cx, cy, R, time);
  drawEarth(c, cx, cy, R, -(S.m / 60) * Math.PI / 12, 0, null);
  c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 1.5; c.setLineDash([5, 6]); c.beginPath(); c.arc(cx, cy, r, 0, 7); c.stroke(); c.setLineDash([]);
  const px = cx + Math.cos(i.psi) * r, py = cy - Math.sin(i.psi) * r, fs = clamp(w / 28, 12, 16);
  c.fillStyle = i.sun ? 'rgba(255,209,102,.35)' : 'rgba(123,140,255,.3)'; c.beginPath(); c.arc(px, py, fs * 1.2, 0, 7); c.fill();
  c.font = `${fs * 1.6}px serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🛰️', px, py);
  if (i.since < 6) { c.font = `${fs * 1.8}px serif`; c.fillText('🌅', px + (px > cx ? 1 : -1) * fs * 2.2, py - fs * 1.6); }
  c.fillStyle = 'rgba(255,255,255,.7)'; c.font = `800 ${fs * 0.9}px Nunito, sans-serif`; c.fillText('ISS', px, py + fs * 1.9);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.play && !S.drag) {
    if (S.secret === 'stop') S.d = mod(S.d + dt * 30, 365);
    else if (S.secret === 'iss') S.m = mod(S.m + dt * 28, 300);
    else S.t = mod(S.t + dt * 1.2, 24);
    const md = MODE(); $('scrub').value = md.get();
  }
  if (S.secret === 'stop') drawStop(c, w, h, time); else if (S.secret === 'iss') drawIss(c, w, h, time);
  else if (lab.view === 'sky') drawSky(c, w, h, time); else if (lab.view === 'zones') drawZones(c, w, h, time); else drawSpin(c, w, h, time);
  refresh();
});

// drag the Earth: turning it by hand changes the time
let lastAng = 0;
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.secret || lab.view !== 'spin' || !S.geo) return;
  const r = $('cv').getBoundingClientRect(); lastAng = Math.atan2(ev.clientY - r.top - S.geo.cy, ev.clientX - r.left - S.geo.cx);
  S.drag = true; try { $('cv').setPointerCapture(ev.pointerId); } catch { /* ignore */ }
});
$('cv').addEventListener('pointermove', (ev) => {
  if (!S.drag) return;
  const r = $('cv').getBoundingClientRect(), a = Math.atan2(ev.clientY - r.top - S.geo.cy, ev.clientX - r.left - S.geo.cx);
  let da = a - lastAng; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
  lastAng = a; S.t = mod(S.t - da * 12 / Math.PI, 24); S.play = false; syncPlay(); $('scrub').value = MODE().get();
});
const endDrag = () => { S.drag = false; };
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag);
render();
</script>
</body>
