// --- numbers: the neutral copy of every sum; digits, swaps and marks are computed from it -----------------------
const MINUS = '−';
const ROUNDS = {
  add: [{ a: 27, b: 15, op: '+' }, { a: 38, b: 24, op: '+' }, { a: 45, b: 35, op: '+' }],
  take: [{ a: 52, b: 17, op: MINUS }, { a: 43, b: 28, op: MINUS }, { a: 35, b: 17, op: '+' }],
  big: [{ a: 365, b: 278, op: '+' }, { a: 403, b: 156, op: MINUS }, { a: 999, b: 1, op: '+' }],
};
const RIGHT = { add: [1, 2, 0], take: [2, 0, 2], big: [2, 0, 1] };
const GK = { add: 'a', take: 't', big: 'h' };
const FREE0 = { add: { a: 19, b: 26, op: '+' }, take: { a: 61, b: 24, op: MINUS }, big: { a: 478, b: 256, op: '+' } };
const dg = (n) => [n % 10, Math.floor(n / 10) % 10, Math.floor(n / 100) % 10, Math.floor(n / 1000) % 10]; // ones, tens, hundreds, thousands
const resOf = (R) => (R.op === '+' ? R.a + R.b : R.a - R.b);
function swapsOf(R) { // carries (add) or breaks (take) of a sum
  const A = dg(R.a), B = dg(R.b);
  let n = 0;
  if (R.op === '+') { let c = 0; for (let p = 0; p < 4; p++) { c = A[p] + B[p] + c >= 10 ? 1 : 0; n += c; } }
  else for (let p = 0; p < 4; p++) {
    if (A[p] < B[p]) { let q = p + 1; while (q < 4 && A[q] === 0) q++; for (let r = q; r > p; r--) { A[r]--; A[r - 1] += 10; n++; } }
    A[p] -= B[p];
  }
  return n;
}

const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const shade = (h, k) => mix(h, '#000000', k), tint = (h, k) => mix(h, '#ffffff', k);
const rgba = (h, a) => { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; };
const INKCOL = COL.map((c) => shade(c, 0.42));
const clamp01 = (x) => Math.max(0, Math.min(1, x));

// --- animation engine: async scripts built on tweens that the canvas loop steps; RUN cancels them all ----------------
let RUN = 0;
const TW = [];
const stopAnim = () => { RUN++; TW.length = 0; };
function mkQ(instant = false) {
  const id = RUN;
  const tw = (ms, fn, ease = eio) => new Promise((res) => {
    if (instant) { fn(1, 1); res(); return; }
    TW.push({ id, ms, t: 0, fn, ease, res });
  });
  return {
    tw, instant, wait: (ms) => tw(ms, () => {}), snd: (f) => { if (!instant) f(); }, now: () => (instant ? -99 : NOW()),
    fx: (o) => { if (!instant) SC.fx.push({ ...o, t0: NOW() }); },
  };
}
function stepTweens(dt) {
  for (const k of TW.slice()) {
    if (k.id !== RUN) { TW.splice(TW.indexOf(k), 1); continue; }
    k.t += dt * 1000;
    const p = clamp(k.t / k.ms, 0, 1);
    k.fn(k.ease(p), p);
    if (p >= 1) { TW.splice(TW.indexOf(k), 1); k.res(); }
  }
}

// --- geometry: the scene is drawn in design units (about 340 x 460) and scaled to the stage ---------------------------
const ROW = { dot: 19, mark: 44, A: 70, B: 104, line: 122, ans: 148, below: 174, paperH: 180, matY: 194, label: 210, cnt: 232, ZT: 250 };
const SC = {};
function geom() {
  const cv = $('cv'), w = cv.clientWidth || 375, h = cv.clientHeight || 457;
  const s = Math.min(w / 340, h / 460), DW = w / s, DH = h / s;
  const bw = Math.min(DW - 16, 540), left0 = (DW - bw) / 2, signW = 26, x0 = left0 + signW;
  const nc = SC.nc || 2, colW = (bw - signW) / nc, L = Math.min(colW * 0.86, 104);
  return { w, h, s, DW, DH, bw, left0, x0, nc, colW, L, c: L * 0.17, t: L / 10, ZT: ROW.ZT, ZB: DH - 14, cx: (p) => x0 + (nc - 1 - p + 0.5) * colW };
}
const dims = (G, k) => (k === 0 ? { w: G.c, h: G.c, dp: G.c * 0.55 } : k === 1 ? { w: G.L, h: G.t, dp: G.t * 0.8 } : k === 2 ? { w: G.L, h: G.L, dp: G.t * 0.8 } : { w: G.L, h: G.L, dp: G.L * 0.55 });

// --- scene: blocks on the mat, digits and marks on the paper ---------------------------------------------------------
const GORD = { A: 0, B: 1, C: 2, S: 3 }; // groups in a column: first number, second number, carried in, all pushed together
const cmpB = (p, q) => GORD[p.g] - GORD[q.g] || p.ord - q.ord || p.id - q.id;
const colBlocks = (p) => SC.blocks.filter((b) => b.p === p && b.mode !== 'free').sort(cmpB);
function addBlock(k, g, x, y) {
  const b = { id: SC.nid++, k, p: k, g, ord: SC.ord++, x, y, hx: x, hy: y, sc: 1, a: 1, fl: 0, mode: 'rest', top: false };
  SC.blocks.push(b);

}
const removeBlock = (b) => { SC.blocks = SC.blocks.filter((x) => x !== b); };
function setupScene(a, b, op, ghost = false) {
  Object.assign(SC, {
    a, b, op, blocks: [], nid: 1, ord: 1, ans: [null, null, null, null], carry: [null, null, null, null],
    bor: [0, 1, 2, 3].map(() => ({ dec: 0, inc: 0, t0: -99 })), cnt: [null, null, null, null], link: { p: 0, a: 0 }, pill: null,
    ghost: { n: ghost ? dg(b)[0] : 0, a: ghost ? 1 : 0, red: 0 }, shake: -99, fx: [], snap: true,
  });

  const A = dg(a), B = dg(b);

setupScene(27, 15, '+');

// where every resting block wants to be: cubes in rows of five, rods and flats in vertical piles
function layout(G) {
  for (let p = 0; p < 4; p++) {
    const list = colBlocks(p);
    if (!list.length) continue;
    const cx = G.cx(p), ox = -dims(G, p).dp * 0.35;
    if (p === 0) {
      const pitch = G.c * 1.22;
      let top = G.ZT, last = null, n = 0;
      for (const b of list) {
        if (b.g !== last) { if (last) top += Math.ceil(n / 5) * pitch + G.c * 0.4; last = b.g; n = 0; }
        b.hx = cx + ((n % 5) - 2) * pitch + ox; b.hy = top + pitch / 2 + Math.floor(n / 5) * pitch; n++;
      }
    } else if (p < 3) {
      const ih = p === 1 ? G.t : G.L, base = p === 1 ? G.t * 1.6 : 26;
      let units = 0, last = null;
      const ups = list.map((b, i) => { const u = i === 0 ? 0 : 1 + (b.g !== last ? 0.8 : 0); last = b.g; units += u; return units; });
      const step = units > 0 ? Math.min(base, (G.ZB - G.ZT - ih - dims(G, p).dp) / units) : 0;
      list.forEach((b, i) => { b.hx = cx + ox; b.hy = G.ZT + ih / 2 + ups[i] * step; });
    } else list.forEach((b) => { b.hx = cx + ox; b.hy = G.ZT + G.L / 2 + 6; });
  }
}
const relayout = () => layout(geom());
function settle() {

  SC.snap = false;
}
const ghostPos = (G, idx) => { const pitch = G.c * 1.22; return { x: G.cx(0) + ((idx % 5) - 2) * pitch - G.c * 0.19, y: G.ZT + pitch / 2 + Math.floor(idx / 5) * pitch }; };

// where ten blocks of kind k meet, and where the one block that stands for them sits
function gatherPts(G, k) {
  const cx = G.cx(k), bot = G.ZB - 6;
  if (k === 0) { const y = bot - G.t; return { pts: Array.from({ length: 10 }, (_, i) => ({ x: cx - G.L / 2 + (i + 0.5) * G.t, y, sc: G.t / G.c })), res: { x: cx, y } }; }
  if (k === 1) { const top = bot - G.L - G.t; return { pts: Array.from({ length: 10 }, (_, i) => ({ x: cx, y: top + (i + 0.5) * G.t, sc: 1 })), res: { x: cx, y: top + G.L / 2 } }; }

  return { pts: Array.from({ length: 10 }, (_, i) => ({ x: x0 + i * st, y: y0 - i * st, sc: 1 })), res: { x: x0, y: y0 } };
}

// --- block moves ---------------------------------------------------------------------------------------------------
function moveTo(Q, b, pt, ms, H = 0) {

    b.sc = s.sc + ((pt.sc ?? 1) - s.sc) * e;

const homeOf = (b) => ({ get x() { return b.hx; }, get y() { return b.hy; } });
const setCount = (Q, p) => { SC.cnt[p] = Q.instant ? null : { n: colBlocks(p).length, t0: NOW() }; };

}
function burst(Q, x, y, col, n = 14) {

    Q.fx({ type: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, col, dur: 0.6 });

}

// the ones, tens ... of a column are pushed into one group
async function pushTogether(Q, p) {
  const list = colBlocks(p);
  if (list.every((b) => b.g === 'S')) return;
  list.forEach((b, i) => { b.g = 'S'; b.ord = i; });
  SC.ord = Math.max(SC.ord, list.length + 1);
  setCount(Q, p);
  Q.snd(sfx.tick);
  await Q.wait(700);
}
// ten blocks meet, snap into one block of the next kind, which hops into the next column
async function swapUp(Q, p) {
  const G = geom(), ten = colBlocks(p).slice(0, 10), gp = gatherPts(G, p);
  ten.forEach((b) => { b.mode = 'free'; b.top = true; });
  relayout();
  Q.snd(sfx.push);
  await Promise.all(ten.map((b, i) => Q.wait(i * 32).then(() => moveTo(Q, b, gp.pts[i], 520))));
  Q.snd(sfx.snap);
  Q.fx({ type: 'ring', x: gp.res.x, y: gp.res.y, r: G.L * 0.75, dur: 0.55 });
  await Q.tw(170, (e) => ten.forEach((b) => { b.fl = e; }));
  ten.forEach(removeBlock);
  const nb = addBlock(p + 1, 'C', gp.res.x, gp.res.y);
  nb.mode = 'hold'; nb.top = true; nb.sc = 1.15;
  SC.carry[p + 1] = Q.now();
  if (p + 1 >= SC.ncT) { const from = SC.nc; SC.ncT = p + 2; Q.tw(450, (e) => { SC.nc = from + (SC.ncT - from) * e; }); }
  relayout();

  burst(Q, gp.res.x, gp.res.y, COL[p - 1]);

  await Q.wait(300);

// the whole sum, place by place: blocks move first, then the digit is written
async function playAdd(Q) {
  const nres = String(SC.a + SC.b).length;
  for (let p = 0; p < nres; p++) {
    await pushTogether(Q, p);
    setCount(Q, p);
    await linkOn(Q, p);
    if (colBlocks(p).length >= 10) { await swapUp(Q, p); setCount(Q, p); await Q.wait(150); }
    await writeDigit(Q, p, colBlocks(p).length);
    await linkOff(Q);
    SC.cnt[p] = null;
  }
}
async function playSub(Q) {
  const B = dg(SC.b), P = String(SC.a).length, nres = String(SC.a - SC.b).length;
  if (SC.ghost.a > 0) await Q.tw(300, (e) => { SC.ghost.a = 1 - e; });
  for (let p = 0; p < P; p++) {
    const need = B[p];
    setCount(Q, p);
    await linkOn(Q, p);
    if (colBlocks(p).length < need) {
      let q = p + 1;
      while (q < P && colBlocks(q).length === 0) q++;
      for (let r = q; r > p; r--) await breakDown(Q, r);
      setCount(Q, p);
      await Q.wait(150);
    }
    await takeAway(Q, p, need);
    setCount(Q, p);
    if (p < nres) await writeDigit(Q, p, colBlocks(p).length); else await Q.wait(200);
    await linkOff(Q);
    SC.cnt[p] = null;
  }
}
async function playSum(Q) {
  await (SC.op === '+' ? playAdd(Q) : playSub(Q));

// --- the wrong answers, shown kindly -----------------------------------------------------------------------------------
function rebuildAsk(v, r) { // back to the question's picture, instantly

  stopAnim();
  const Q = mkQ();
  if (v === 'add' && r === 0) { if (pick === 0) await wrongOverflow(Q); else if (pick === 2) await wrongThrow(Q, v, r); }
  if (v === 'take' && r === 0) { if (pick === 0) await wrongBackwards(Q, v, r); else if (pick === 1) await wrongCant(Q); }
  await playSum(Q);
  const V = VS[v];
  V.ph = 'done'; if (r === 2) V.done = true;
  (pick === RIGHT[v][r] ? sfx.good : sfx.bad)();
  render();
}
async function playFree(v) {
  const V = VS[v], F = V.free;
  stopAnim();
  const Q = mkQ();
  setupScene(F.a, F.b, F.op); settle();
  V.mode = 'free'; V.fph = 'play'; render(); showStage();
  await playSum(Q);
  V.fph = 'done'; sfx.good(); render();
}

// free play: steppers
const rng = (v, k, F) => (v === 'add' ? [10, 99] : v === 'take' ? (k === 'a' ? [10, 99] : [10, F.a]) : k === 'a' ? [100, 999] : F.op === '+' ? [100, 999] : [100, F.a]);
function setFree(v, k, n) {
  const V = VS[v], F = V.free;
  F[k] = n;
  if (F.op !== '+' && F.b > F.a) F.b = F.a;
  stopAnim(); V.mode = 'free'; V.fph = 'idle';
  setupScene(F.a, F.b, F.op); settle();
  sfx.tick(); render();
}
function freeStep(k, s) {
  const v = lab.view, F = VS[v].free, [lo, hi] = rng(v, k, F), n = clamp(F[k] + s, lo, hi);
  if (n !== F[k]) setFree(v, k, n);
}
function shopStep(k, s) {
  const lo = k === 'a' ? 10 : SH.a + 1, hi = k === 'a' ? SH.b - 1 : 99, n = clamp(SH[k] + s, lo, hi);
  if (n === SH[k]) return;
  SH[k] = n; sfx.tick(); shopPlay();
}
const stepClick = (b) => (b.dataset.w === 'shop' ? shopStep : freeStep)(b.dataset.st, +b.dataset.s);
const stepper = (w, k, val, id) => `<div class="ex-st"><button class="ex-sb" data-w="${w}" data-st="${k}" data-s="-1" aria-label="${MINUS}">${MINUS}</button>
  <input id="${id}" data-w="${w}" data-k="${k}" type="number" inputmode="numeric" value="${val}"><button class="ex-sb" data-w="${w}" data-st="${k}" data-s="1" aria-label="+">+</button></div>`;
let rep = null;
$('ctrlBody').addEventListener('pointerdown', (ev) => {
  const b = ev.target.closest('[data-st]'); if (!b) return;
  ev.preventDefault();
  stepClick(b);
  clearTimeout(rep);
  rep = setTimeout(function again() { stepClick(b); rep = setTimeout(again, 80); }, 380);
});
const stopRep = () => { clearTimeout(rep); rep = null; };
addEventListener('pointerup', stopRep); addEventListener('pointercancel', stopRep);
$('ctrlBody').addEventListener('change', (ev) => {
  const i = ev.target.closest('input[data-k]'); if (!i) return;
  const k = i.dataset.k, n = Math.round(+i.value);
  if (i.dataset.w === 'shop') { const lo = k === 'a' ? 10 : SH.a + 1, hi = k === 'a' ? SH.b - 1 : 99; SH[k] = clamp(Number.isFinite(n) ? n : SH[k], lo, hi); shopPlay(); return; }
  const v = lab.view, F = VS[v].free, [lo, hi] = rng(v, k, F);
  setFree(v, k, clamp(Number.isFinite(n) ? n : F[k], lo, hi));
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-i], [data-act], [data-st]'); if (!b) return;
  const v = lab.view, V = VS[v];
  if (b.dataset.st) { if (ev.detail === 0) stepClick(b); return; }
  if (b.dataset.i !== undefined) {
    if (V.ph !== 'ask' || V.mode === 'free' || S.sec) return;
    V.pick = +b.dataset.i; V.ph = 'play'; sfx.click();
    render(); showStage();
    reveal(v, V.r, V.pick);
    return;
  }
  const act = b.dataset.act;
  if (act === 'next') { V.r++; V.ph = 'ask'; V.pick = null; sfx.click(); enter(); render(); showStage(); }
  else if (act === 'again') { Object.assign(V, { r: 0, ph: 'ask', pick: null, done: false, mode: 'round', fph: 'idle' }); sfx.click(); enter(); render(); }
  else if (act === 'play') { sfx.click(); playFree(v); }
  else if (act === 'op') { const F = V.free; F.op = b.dataset.o; if (F.op !== '+' && F.b > F.a) F.b = F.a; setFree(v, 'b', F.b); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    stopAnim();
    for (const x in VS) { if (VS[x].ph === 'play') { VS[x].ph = 'done'; if (VS[x].r === 2) VS[x].done = true; } if (VS[x].fph === 'play') VS[x].fph = 'done'; }
    sfx.click();
    if (S.sec === k) { S.sec = null; enter(); render(); return; }
    S.sec = k; normFrame();
    if (k === 'shop') shopPlay();
    render();
  } else if (act === 'f1') frameAdd(1);
  else if (act === 'f10') frameAdd(10);
  else if (act === 'fres') { FR.n = [0, 0, 0]; FR.busy = false; stopAnim(); sfx.click(); render(); }
});

// --- one render per change: panel, readout and the state card ---------------------------------------------------------
function mainPanel(t, v, V) {
  const g = t[GK[v]], r = V.r, fin = V.ph === 'done', right = RIGHT[v][r], opts = g['o' + (r + 1)];
  const dots = [0, 1, 2].map((i) => (i < r || (i === r && fin) ? '●' : i === r ? '◉' : '○')).join(' ');
  const num = opts.every((o) => o.length <= 6);
  let h = `<div class="ex-dots">${dots}</div><div class="ex-q">${esc(g['q' + (r + 1)])}</div><div class="ex-opts ${num ? 'num' : ''}">`;
  h += opts.map((o, i) => {
    let cls = '';
    if (V.pick !== null) cls = fin ? (i === right ? 'good' : i === V.pick ? 'bad' : 'dim') : (i === V.pick ? 'pick' : 'dim');
    return `<button class="ex-o ${cls}" data-i="${i}"${V.ph !== 'ask' ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('') + '</div>';
  if (fin) {
    const ok = V.pick === right;
    h += `<div class="ex-res"><div class="v" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.wrong)}</div><p>${esc(g['r' + (r + 1)])}</p></div>`;
    if (r < 2) h += `<div class="row2"><button class="btn" data-act="next">${esc(t.next)}</button></div>`;
  }
  return h;
}
function renderFree(t, v, V) {
  const el = $('exFree'), sig = `${v}|${lang}|${V.done}|${V.free.op}|${S.sec}`;
  if (!V.done || S.sec) { el.innerHTML = ''; el.dataset.sig = ''; return; }
  const F = V.free;
  if (el.dataset.sig !== sig) {
    const mid = v === 'big'
      ? `<div class="ex-ops">${[['+', t.h.plus], [MINUS, t.h.minus]].map(([o, l]) => `<button class="chip ${F.op === o ? 'on' : ''}" data-act="op" data-o="${o}">${esc(l)}</button>`).join('')}</div>`
      : `<span class="ex-sign">${v === 'add' ? '+' : MINUS}</span>`;
    el.innerHTML = `<div class="ex-free">${stepper('free', 'a', F.a, 'fa')}${mid}${stepper('free', 'b', F.b, 'fb')}</div>
      <div class="ex-btns" style="margin-top:12px"><button class="btn" data-act="play" id="exPlay">${esc(t[GK[v]].go)}</button><button class="btn ghost" data-act="again">${esc(t.again)}</button></div>`;
    el.dataset.sig = sig;
  }
  for (const k of ['a', 'b']) { const i = $(k === 'a' ? 'fa' : 'fb'); if (i && document.activeElement !== i) i.value = F[k]; }
  $('exPlay').disabled = V.fph === 'play';
}
function readout(t, v, V) {
  const R = V.mode === 'free' ? V.free : ROUNDS[v][V.r], done = V.mode === 'free' ? V.fph === 'done' : V.ph === 'done';
  const eq = `${R.a} ${R.op} ${R.b}`;
  lab.setReadout(done ? `${eq} = ${resOf(R)}` : eq, done ? t.swaps(swapsOf(R)) : '', '', ACCENT[v]);
}
function renderSecret(t) {
  const k = S.sec, el = $('exSec');
  $('exMain').innerHTML = ''; $('exFree').innerHTML = ''; $('exFree').dataset.sig = '';
  lab.setGlow(k === 'frame' ? 'rgba(255, 201, 77, .22)' : 'rgba(61, 214, 198, .22)');
  if (k === 'frame') {
    el.innerHTML = `<div class="ex-btns"><button class="btn" data-act="f1">${esc(t.sec.plus1)}</button><button class="btn" data-act="f10">${esc(t.sec.plus10)}</button><button class="btn ghost" data-act="fres">${esc(t.again)}</button></div>`;
    lab.setReadout(String(frVal()), `${FR.n[2]} ${t.cols[0]} · ${FR.n[1]} ${t.cols[1]} · ${FR.n[0]} ${t.cols[2]}`, '', COL[0]);
    lab.setState({ emo: '🧮', title: t.secrets.frame[0], lead: t.sec.frameText, body: '' });
  } else {
    el.innerHTML = `<div class="ex-free">${stepper('shop', 'a', SH.a, 'sa')}<span class="ex-sign">→</span>${stepper('shop', 'b', SH.b, 'sb')}</div>`;
    const d = SH.b - SH.a;
    lab.setReadout(shopDone() ? `${SH.b} ${MINUS} ${SH.a} = ${d}` : `${SH.b} ${MINUS} ${SH.a}`, shopDone() ? `${SH.hops.map(([f, tt]) => tt - f).join(' + ')} = ${d}` : '', '', COL[1]);
    lab.setState({ emo: '🛒', title: t.secrets.shop[0], lead: t.sec.shopText, body: '' });
  }
}
function render() {
  const t = T[lang], v = lab.view, V = VS[v], open = secret.unlocked();
  $('exChipRow').style.display = v === 'add' ? '' : 'none';
  $('exChips').innerHTML = [['frame', '🧮'], ['shop', '🛒']].map(([k, emo]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (S.sec) { renderSecret(t); return; }
  $('exSec').innerHTML = '';
  lab.setGlow(GLOW[v]);
  $('exMain').innerHTML = V.mode === 'free' ? '' : mainPanel(t, v, V);
  renderFree(t, v, V);
  readout(t, v, V);
  const cd = CARDS[lang][v][V.done ? 'f' : 'n'];
  lab.setState({ emo: cd[0], title: cd[1], lead: cd[2], body: cd[3] });
}
enter();
render();
</script>
