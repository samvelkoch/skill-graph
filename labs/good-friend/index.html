    if (card.sorry) { const j = S.rc.indexOf(1); if (j >= 0) { S.rc[j] = 2; S.rmend = true; } }
    hop(KR); sfx.good();
  } else { const j = S.rc.indexOf(0); if (j >= 0) S.rc[j] = 1; sfx.bad(); }
  showStage();
}
function secretTap(k) {
  if (!secret.unlocked()) return secret.open();
  S.rsec = S.rsec === k ? null : k;
  if (S.rsec === 'new') { S.newM = 0; S.newT = {}; S.newLast = null; }
  if (S.rsec === 'far') { S.farM = 0; S.farD = 1; S.sendAt = -9; }
  sfx.click();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, d = b.dataset;
  if (a === 'rg') playCard(d.g);
  else if (a === 'rnext') { S.ri++; S.rrev = false; sfx.click(); }
  else if (a === 'ragain') { S.ri = 0; S.rres = []; S.rrev = false; S.rm = 0; S.rc = [0, 0, 0]; sfx.click(); }
  else if (a === 'sec') secretTap(d.k);
  else if (a === 'snew') {
    if (!S.newT[d.k]) { S.newT[d.k] = true; S.newM = Math.min(18, S.newM + 2); hop(KR); sfx.good(); } else sfx.tick();
    S.newLast = d.k; showStage();
  } else if (a === 'fdist') { S.farD = +d.i; sfx.tick(); }
  else if (a === 'fsend') { S.farM = Math.min(18, S.farM + 2); S.sendAt = clock; hop(KL); hop(KR); sfx.good(); showStage(); }
  else if (a === 'tr') {
    const j = +d.j, ok = j === STORY[S.ti].ans; S.trate = j; S.tstep = 1; S.tres[S.ti] = ok; S.tbad = [];
    if (STORY[S.ti].ans === 0) { hop(KL); hop(KR); } (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'ts') {
    const j = +d.j;
    if (j === STORY[S.ti].sok) { S.tstep = 2; hop(KR); sfx.good(); showStage(); } else { if (!S.tbad.includes(j)) S.tbad.push(j); sfx.bad(); }
  } else if (a === 'tnext') { S.ti++; S.tstep = 0; S.trate = null; S.tbad = []; sfx.click(); }
  else if (a === 'tagain') { S.ti = 0; S.tstep = 0; S.trate = null; S.tres = []; S.tbad = []; sfx.click(); }
  else if (a === 'yq') { const j = +d.j; S.yans = j; S.ymode = 'verdict'; (j === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'yreset') { S.age = 5; S.boost = new Array(FR.length).fill(0); S.ymode = 'age'; sfx.click(); }
  render();
});
$('ageR').addEventListener('input', () => {
  const v = clamp(Math.round(+$('ageR').value), 5, 11);
  if (v !== S.age) { S.age = v; S.ymode = 'age'; sfx.tick(); render(); }
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'years' || S.yans === null) return;
  const rc = $('cv').getBoundingClientRect(), px = (ev.clientX - rc.left - GEO.ox) / GEO.s, py = (ev.clientY - rc.top - GEO.oy) / GEO.s;
  let best = -1, bd = 30;
  FR.forEach((_, i) => { if (FA[i].a < 0.2) return; const [x, y] = frPos(i), dd = Math.hypot(px - x, py - y); if (dd < bd) { bd = dd; best = i; } });
  if (best < 0) return;
  if (effD(best) > 0) S.boost[best] = Math.min(2, S.boost[best] + 1);
  S.helloI = best; S.helloAt = clock; S.ymode = 'hello'; sfx.good(); render();
});

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('secRecipe').hidden = v !== 'recipe'; $('secTest').hidden = v !== 'test'; $('secYears').hidden = v !== 'years';
  KL.tx = 58; KR.tx = 302; bubbleNow = null;
  if (v === 'recipe') renderRecipe(t); else if (v === 'test') renderTest(t); else renderYears(t);
}
const optBtn = (act, attrs, label, cls = '') => `<button type="button" class="gf-opt ${cls}" data-act="${act}" ${attrs}>${esc(label)}</button>`;

function renderRecipe(t) {
  const r = t.r, sc = t.s, n = CARDS.length, sec = S.rsec, open = secret.unlocked();
  lab.setGlow('rgba(224, 176, 80, .22)');
  const m = sec === 'new' ? S.newM : sec === 'far' ? S.farM : S.rm;
  JT = { m, c: sec ? [0, 0, 0] : S.rc };
  const cracks = JT.c.filter((x) => x === 1).length;
  lab.setReadout(m, t.marb(m), cracks ? t.crk(cracks) : '', '#e0b050');
  let html = '', st, facts = r && t.f.rec;
  if (!sec) {
    const done = S.ri >= n, card = !done && CARDS[S.ri], tx = !done && r.cards[S.ri];
    if (!done) {
      html = `<div class="gf-card"><div class="gf-n">${esc(r.n(S.ri + 1))}</div><div class="gf-act"><span class="e">${card.e}</span>${esc(tx.act)}</div></div>`;
      if (!S.rrev) html += `<div class="gf-q">${esc(r.q)}</div><div class="gf-opts">${optBtn('rg', 'data-g="fill"', r.fill)}${optBtn('rg', 'data-g="crack"', r.crack)}</div>`;
      else html += `<div class="gf-opts">${optBtn('rnext', '', r.next, 'go')}</div>`;
      bubbleNow = { emo: card.e, side: 'L' };
      if (!S.rrev) { setKid(KL, 'calm'); setKid(KR, 'calm'); st = { emo: '🤔', title: r.askT, lead: r.askL }; }
      else {
        const ok = S.rres[S.ri];
        if (card.k === 'fill') { setKid(KL, card.sorry ? 'sad' : 'smile', 'toward'); setKid(KR, 'smile', 'cheer'); }
        else { setKid(KL, card.laugh ? 'laugh' : 'calm', card.laugh ? 'rest' : 'toward'); setKid(KR, 'sad', 'rest', true); }
        st = { emo: card.k === 'fill' ? '🫙' : '💥', title: ok ? t.right : t.notQuite, lead: card.sorry && S.rmend ? r.mend : tx.res };
      }
    } else {
      const k = S.rres.filter(Boolean).length;
      html = `<div class="gf-opts">${optBtn('ragain', '', r.again, 'go')}</div>`;
      setKid(KL, 'smile', 'cheer'); setKid(KR, 'smile', 'cheer');
      st = { emo: '🏆', title: r.endT(k), lead: r.endL, body: r.endB };
      facts = [...t.f.rec, t.f.share];
    }
  } else if (sec === 'new') {
    html = `<div class="gf-opts">${['hello', 'ask', 'invite'].map((k) => optBtn('snew', `data-k="${k}"`, sc[k])).join('')}</div>`;
    const all = ['hello', 'ask', 'invite'].every((k) => S.newT[k]);
    setKid(KL, 'smile', S.newLast ? 'wave' : 'rest'); setKid(KR, S.newLast ? 'smile' : 'calm', all ? 'cheer' : 'rest');
    bubbleNow = S.newLast ? { emo: { hello: '👋', ask: '❓', invite: '🎲' }[S.newLast], side: 'L' } : null;
    st = S.newLast ? { emo: '🤝', title: sc.newRes[S.newLast][0], lead: sc.newRes[S.newLast][1], body: all ? sc.newAll : '' } : { emo: '🤝', title: sc.newIntro[0], lead: sc.newIntro[1] };
    facts = [t.f.rec[0], t.f.newF];
  } else {
    html = `<div class="gf-opts">${sc.dist.map((l, i) => optBtn('fdist', `data-i="${i}"`, l, S.farD === i ? 'go' : '')).join('')}</div>
      <div class="gf-opts">${optBtn('fsend', '', sc.send)}</div>`;
    [KL.tx, KR.tx] = [[92, 268], [58, 302], [34, 326]][S.farD];
    setKid(KL, 'smile', S.farM ? 'wave' : 'rest'); setKid(KR, 'smile', S.farM ? 'wave' : 'rest');
    st = S.farM ? { emo: '✉️', title: sc.farRes[0], lead: sc.farRes[1] } : { emo: '✉️', title: sc.farIntro[0], lead: sc.farIntro[1] };
    facts = [t.f.test[1]];
  }
  $('rMain').innerHTML = html;
  const chip = (k, emo) => `<button type="button" class="gf-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(sc[k][0])}` : '🔒 ???'}</button>`;
  $('rChips').innerHTML = chip('new', '🤝') + chip('far', '✉️') + (sec ? `<button type="button" class="gf-chip" data-act="sec" data-k="${sec}">${esc(sc.back)}</button>` : '');
  lab.setState({ ...st, body: st.body ?? '', extra: '' });
  lab.setFacts(facts);
}

function renderTest(t) {
  const x = t.x, n = STORY.length, i = S.ti, end = i >= n;
  lab.setGlow('rgba(95, 168, 160, .24)');
  lab.setReadout(`${Math.min(i + 1, n)}/${n}`, '', '', '#5fa8a0');
  let html = '', st;
  if (end) {
    const k = S.tres.filter(Boolean).length;
    JT = { m: 0, c: [0, 0, 0] }; setKid(KL, 'smile', 'cheer'); setKid(KR, 'smile', 'cheer');
    html = `<div class="gf-opts">${optBtn('tagain', '', x.again, 'go')}</div>`;
    st = { emo: '🏆', title: x.endT(k), lead: x.endL };
    lab.setReadout(`${k}/${n}`, '', '', '#5fa8a0');
  } else {
    const M = STORY[i], tx = x.stories[i], step = S.tstep;
    html = `<div class="gf-card"><div class="gf-n">${esc(x.n(i + 1))}</div><div class="gf-act"><span class="e">${M.e}</span>${esc(tx.s)}</div></div>`;
    bubbleNow = { emo: M.e, side: 'L' };
    if (step === 0) {
      JT = { m: 0, c: [0, 0, 0] }; setKid(KL, 'calm'); setKid(KR, 'calm');
      html += `<div class="gf-q">${esc(x.q)}</div><div class="gf-opts">${x.rate.map((l, j) => optBtn('tr', `data-j="${j}"`, l)).join('')}</div>`;
      st = { emo: '🤔', title: x.askT, lead: x.askL };
    } else {
      const a = M.ans, ok = S.tres[i];
      const after = step === 2;
      JT = a === 0 ? { m: after ? 6 : 4, c: [0, 0, 0] } : a === 1 ? { m: after ? 2 : 0, c: [1, 0, 0] } : { m: after ? 4 : 0, c: [after ? 2 : 1, 0, 0] };
      if (a === 0) { setKid(KL, 'smile', 'toward'); setKid(KR, 'smile', 'cheer'); }
      else if (a === 1) { setKid(KL, after ? 'calm' : M.laugh ? 'laugh' : 'calm'); setKid(KR, after ? 'calm' : 'sad', 'rest', !after); }
      else if (after) { setKid(KL, 'smile', 'toward'); setKid(KR, 'smile', 'cheer'); }
      else { setKid(KL, 'calm'); setKid(KR, 'sad'); }
      html += `<div class="gf-q">${esc(x.sayQ)}</div><div class="gf-opts v">${tx.say.map((l, j) => {
        const good = after && j === M.sok, bad = S.tbad.includes(j);
        return `<button type="button" class="gf-opt ${bad ? 'bad' : ''} ${good ? 'go' : ''}" data-act="ts" data-j="${j}"${after || bad ? ' disabled' : ''}>${esc(l)}</button>`;
      }).join('')}</div>`;
      if (after) html += `<div class="gf-opts">${optBtn('tnext', '', x.next, 'go')}</div>`;
      if (!after) st = { emo: a === 0 ? '🫙' : '💥', title: ok ? t.right : t.notQuite, lead: `${x.rate[a]}. ${tx.why}`, body: S.tbad.length ? x.badSay : '' };
      else st = { emo: '💬', title: x.rate[a], lead: tx.res, body: '' };
    }
  }
  $('tMain').innerHTML = html;
  lab.setState({ ...st, body: st.body ?? '', extra: '' });
  lab.setFacts(t.f.test);
}

function renderYears(t) {
  const y = t.y, a = S.age, ev = y.ev[a], asked = S.yans !== null;
  lab.setGlow('rgba(95, 168, 160, .24)');
  KL.tx = 58; KR.tx = 302; setKid(ME, 'smile'); ME.look = 0;
  lab.setReadout(a, y.unit(a), '', '#5fa8a0');
  $('ySl').hidden = !asked;
  if (String($('ageR').value) !== String(a)) $('ageR').value = a;
  $('ageLbl').textContent = `${y.age}: ${a}`; $('ageNote').textContent = y.note;
  $('yHint').textContent = y.tap; $('yReset').textContent = y.reset;
  let st;
  if (!asked) {
    $('yMain').innerHTML = `<div class="gf-q">${esc(y.q)}</div><div class="gf-opts v">${y.opts.map((l, j) => optBtn('yq', `data-j="${j}"`, l)).join('')}</div>`;
    st = { emo: '🤔', title: y.askT, lead: y.askL, body: '' };
  } else {
    $('yMain').innerHTML = '';
    if (S.ymode === 'verdict') st = { emo: '🌱', title: S.yans === 1 ? t.right : t.notQuite, lead: y.ansL, body: y.ansB };
    else if (S.ymode === 'hello') st = { emo: '👋', title: y.hello[0], lead: y.hello[1], body: '' };
    else st = { emo: ['🏡', '🏫', '📦', '🎨', '🚪', '🙂', '🌍'][a - 5], title: ev[0], lead: ev[1], body: '' };
  }
  lab.setState({ ...st, extra: '' });
  lab.setFacts(asked ? t.f.years : []);
}
render();
</script>
