    <button class="bp-b main push" data-act="farNext">${esc(last ? f.again : f.next)}</button></div>`;
  lab.setReadout(esc(t.col[ans]), f.sub(n), ok ? '✓' : '✗', HEX[ans]);
  lab.setState({ emo: ok ? '🎉' : '🤔', title: ok ? t.rightV : f.wrong(t.col[S.pick], t.col[ans]), lead: f.how(n, p, q, r), body: f.howB });
}

function renderTrans(t) {
  const x = t.trans, ph = S.ph;
  lab.setGlow('rgba(78, 168, 255, .22)');
  const stepLbl = `<span class="bp-lbl">${esc(x.step(ph + 1, 5))}</span>`;
  if (ph < 3) {
    const B = BUILD[ph], kind = B.kind, full = S.seq.length === 6, syms = kind === 'sound' ? [0, 1] : [0, 1, 2];
    const symBtn = (i) => (kind === 'sound' ? `<button class="bp-b sym" data-act="sym" data-i="${i}"${S.ok || full ? ' disabled' : ''}>${SYM.sound[i]} ${esc(x[['clap', 'stomp'][i]])}</button>`
      : `<button class="bp-b sym" data-act="sym" data-i="${i}"${S.ok || full ? ' disabled' : ''}>${SYM[kind][i]}</button>`);
    $('cc').innerHTML = `<div class="bp-row first">${stepLbl}</div><p class="bp-q" style="margin-top:8px">${esc(x.q[kind])}</p>
      <div class="bp-row first">${syms.map(symBtn).join('')}</div>
      <div class="bp-row"><button class="bp-b" data-act="undo"${S.seq.length && !S.ok ? '' : ' disabled'}>${esc(x.undo)}</button>
      ${kind === 'sound' ? `<button class="bp-b" data-act="play"${S.seq.length ? '' : ' disabled'}>${esc(x.play)}</button>` : ''}
      ${S.ok ? `<button class="bp-b main push" data-act="transNext">${esc(x.next)}</button>` : `<button class="bp-b main push" data-act="check"${full ? '' : ' disabled'}>${esc(x.check)}</button>`}</div>
      ${kind === 'sound' ? `<p class="bp-note">${esc(x.snd)}</p>` : ''}`;
    lab.setReadout(`${S.seq.length}/6`, x.tiles, S.ok ? '✓' : '', '#4ea8ff');
    if (S.ok) lab.setState({ emo: '🎉', title: t.rightV, lead: x.okL[kind], body: '' });
    else if (S.checked) lab.setState({ emo: '🤔', title: x.wrongT, lead: x.wrongL, body: '' });
    else lab.setState({ emo: ['👏', '🔤', '🔢'][ph], title: x.st0[kind], lead: x.lead[kind], body: x.body });
    return;
  }
  const R = REV[ph - 3], done = S.revDone, last = ph >= 4;
  $('cc').innerHTML = `<div class="bp-row first">${stepLbl}</div><p class="bp-q" style="margin-top:8px">${esc(x.revQ)}</p>
    ${R.kind === 'sound' ? `<div class="bp-row first"><button class="bp-b" data-act="play">${esc(x.play)}</button></div><p class="bp-note">${esc(x.snd)}</p>` : ''}
    <div class="bp-opts">${R.opts.map((o, j) => `<button class="bp-opt${S.revWrong.includes(j) ? ' no' : ''}${done && j === R.ok ? ' yes' : ''}" data-act="opt" data-j="${j}" aria-label="${esc(x.opt(j + 1))}"${done || S.revWrong.includes(j) ? ' disabled' : ''}>${o.map(miniBead).join('')}</button>`).join('')}</div>
    ${done ? `<div class="bp-row"><button class="bp-b main push" data-act="transNext">${esc(last ? x.again : x.next)}</button></div>` : ''}`;
  lab.setReadout('?', x.which, done ? '✓' : '', '#4ea8ff');
  if (done) lab.setState({ emo: '🎉', title: t.rightV, lead: x.revOkL, body: '' });
  else if (S.revMsg === 'wrong') lab.setState({ emo: '🤔', title: x.revWT, lead: x.revWL, body: '' });
  else lab.setState({ emo: '🧵', title: x.revT, lead: x.revL[R.kind], body: '' });
}

render();
</script>
</body>
</html>
