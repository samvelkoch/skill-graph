      <svg class="trk" viewBox="0 0 200 206"><circle cx="102" cy="103" r="72" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/></svg>
      ${STOP_ANG.map((a, i) => `<button class="wf-stop" data-act="stop" data-k="${i}" style="left:${102 + Math.sin(a * Math.PI / 180) * 72 - 20}px;top:${103 - Math.cos(a * Math.PI / 180) * 72 - 20}px">${face(KINDS[i])}</button>`).join('')}
      <div class="wf-knob"><div class="wf-rot" id="rot"><i></i></div></div>
    </div>
    <div class="wf-side" id="side"></div>
  </div>
</section>
<section class="wf-v" id="v3"></section>
<section class="wf-v" id="s1"></section>
<section class="wf-v" id="s2"></section>`;
$('overlay').append(sc);
$('stage').style.touchAction = 'manipulation';

$('ctrlBody').innerHTML = `
  <div class="row2" style="margin-top:0"><button class="btn" id="wfMain" data-act="main"></button><button class="chip" id="wfReset" data-act="reset"></button></div>
  <div class="row2"><div class="chips" id="secChips"></div></div>`;

function fit() {
  const st = $('stage'), w = st.clientWidth;
  if (!w) return;
  st.style.height = `${Math.round(Math.min(w * H / W, 660))}px`;
  const h = st.clientHeight, s = Math.max(.2, Math.min(w / W, h / H));
  sc.style.transform = `scale(${s})`; sc.style.left = `${(w - W * s) / 2}px`; sc.style.top = `${(h - H * s) / 2}px`;
}
new ResizeObserver(fit).observe($('stage'));
addEventListener('resize', fit);

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const mode = () => (S.sec === 'wrong' ? 's1' : S.sec === 'head' ? 's2' : lab.view);
const fact = (t, k) => [{ ...t.facts[k], src: t.facts[k].src || T.en.facts[k].src }];

// --- actions ----------------------------------------------------------------------------------------------------
function answerGuess(i) {
  if (S.pick !== null) return;
  const k = S.order[S.gi];
  S.pick = i; S.res[S.gi] = i === k;
  (i === k ? sfx.good : sfx.bad)(); render(); showStage();
}
function restartGuess() { S.order = shuffle([0, 1, 2]); S.gi = 0; S.pick = null; S.res = [null, null, null]; sfx.click(); }
function answerDial(dir) {
  if (S.pend === null) return;
  const a = stats(KINDS[S.cur]).wps, b = stats(KINDS[S.pend]).wps, ok = (b > a ? 'up' : 'down') === dir;
  S.last = { from: S.cur, to: S.pend, ok };
  S.cur = S.pend; S.just = S.pend; if (!S.seen.includes(S.cur)) S.seen.push(S.cur);
  S.pend = null; (ok ? sfx.good : sfx.bad)(); render(); showStage();
}
function resetDial() { S.cur = 1; S.seen = [1]; S.pend = null; S.last = null; S.just = null; sfx.click(); }
function placeIn(slot, i) {
  S.place = S.place.map((p) => (p === i ? null : p));
  S.place[slot] = i; S.sel = null; sfx.snap(); render();
}
function checkWhere() {
  S.mine = S.place.slice(); S.okN = S.mine.filter((p, s) => p === s).length; S.chk = true; S.sel = null;
  (S.okN >= 4 ? sfx.good : sfx.bad)(); render(); showStage();
}
function resetWhere() { S.place = [null, null, null, null, null, null]; S.sel = null; S.chk = false; sfx.click(); }
function toggleWord(j) {
  if (S.hl.chk) return;
  const ws = S.hl.words, at = ws.indexOf(j);
  if (at >= 0) ws.splice(at, 1); else if (ws.length < 3) ws.push(j); else { sfx.bad(); return; }
  sfx.tick();
}
function checkHead() { S.hl.chk = true; const k = S.hl.words.filter((j) => BANK[j][0] === S.hl.aud).length; (k === 3 ? sfx.good : sfx.bad)(); render(); }

sc.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a === 'plate') return answerGuess(+k);
  if (a === 'stop') { const i = +k; if (i === S.cur) { sfx.tick(); return; } S.pend = S.pend === i ? null : i; sfx.click(); }
  else if (a === 'ask') return answerDial(k);
  else if (a === 'askx') { S.pend = null; sfx.click(); }
  else if (a === 'slot') { if (S.sel !== null && !S.chk && !ev.target.closest('.wf-sn')) return placeIn(+k, S.sel); return; }
  else if (a === 'aud') { S.hl = { aud: k, words: [], chk: false }; sfx.click(); }
  else if (a === 'word') toggleWord(+k);
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, m = mode();
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    S.sec = S.sec === k ? null : k; if (S.sec === 'head') S.hl = { aud: 'child', words: [], chk: false };
    sfx.click();
  } else if (a === 'main') {
    if (m === 'guess') { if (S.pick === null) return; if (S.gi >= 2) restartGuess(); else { S.gi++; S.pick = null; sfx.click(); } }
    else if (m === 'where') { if (S.chk) resetWhere(); else if (S.place.every((p) => p !== null)) checkWhere(); }
    else if (m === 's2') { if (S.hl.chk) { S.hl.words = []; S.hl.chk = false; sfx.click(); } else if (S.hl.words.length === 3) checkHead(); }
  } else if (a === 'reset') { if (m === 'dial') resetDial(); else if (m === 'where') resetWhere(); }
  render();
});

// dragging a line from the tray (or from a place) to a place; a plain tap selects it instead
let drag = null;
const v3 = $('v3');
v3.addEventListener('pointerdown', (ev) => {
  const c = ev.target.closest('.wf-sn'); if (!c || S.chk) return;
  const r = c.getBoundingClientRect();
  drag = { i: +c.dataset.i, x: ev.clientX, y: ev.clientY, moved: false, el: c, ghost: null, w: r.width, id: ev.pointerId };
  try { c.setPointerCapture(ev.pointerId); } catch { /* pointer already gone */ }
});
v3.addEventListener('pointermove', (ev) => {
  if (!drag || ev.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) > 7) {
    drag.moved = true; drag.el.classList.add('drag');
    drag.ghost = drag.el.cloneNode(true); drag.ghost.className += ' wf-ghost'; drag.ghost.style.width = `${drag.w}px`; document.body.append(drag.ghost);
  }
  if (!drag.moved) return;
  drag.ghost.style.left = `${ev.clientX - drag.w / 2}px`; drag.ghost.style.top = `${ev.clientY - 34}px`;
  const over = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.wf-slot');
  v3.querySelectorAll('.wf-slot.hover').forEach((e) => { if (e !== over) e.classList.remove('hover'); });
  over?.classList.add('hover');
});
const endDrag = (ev) => {
  if (!drag || ev.pointerId !== drag.id) return;
  const d = drag; drag = null; d.ghost?.remove();
  if (ev.type === 'pointercancel') { render(); return; }
  if (d.moved) {
    const over = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.wf-slot');
    if (over) placeIn(+over.dataset.k, d.i); else { S.place = S.place.map((p) => (p === d.i ? null : p)); S.sel = null; sfx.click(); render(); }
  } else { S.sel = S.sel === d.i ? null : d.i; sfx.tick(); render(); }
};
v3.addEventListener('pointerup', endDrag); v3.addEventListener('pointercancel', endDrag);

// --- render -------------------------------------------------------------------------------------------------------
let keys = {};
const once = (id, key, fn) => { if (keys[id] !== key) { keys[id] = key; fn(); return true; } return false; };

function render() {
  const t = T[lang], m = mode();
  document.querySelectorAll('.wf-v').forEach((e) => e.classList.toggle('on', e.id === { guess: 'v1', dial: 'v2', where: 'v3', s1: 's1', s2: 's2' }[m]));
  const un = secret.unlocked();
  $('secChips').innerHTML = [['wrong', '🙃'], ['head', '📰']].map(([k, emo]) =>
    `<button class="chip secret ${un ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${un ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  fit();
  if (m === 'guess') renderGuess(t); else if (m === 'dial') renderDial(t); else if (m === 'where') renderWhere(t); else if (m === 's1') renderWrong(t); else renderHead(t);
  lab.checkStage?.();
}

function mainBtn(label, disabled, hide = false) { const b = $('wfMain'); b.textContent = label; b.disabled = disabled; b.hidden = hide; }

function renderGuess(t) {
  const g = t.g, k = S.order[S.gi], kind = KINDS[k], done = S.pick !== null;
  lab.setGlow('rgba(229, 72, 77, .22)');
  $('wfReset').hidden = true;
  [...$('envs').children].forEach((e, i) => {
    e.classList.toggle('open', i === S.gi);
    e.classList.toggle('ok', S.res[i] === true); e.classList.toggle('no', S.res[i] === false);
    e.lastElementChild.textContent = S.res[i] === true ? '✓' : S.res[i] === false ? '✕' : i + 1;
  });
  once('c1', `${S.gi}|${k}|${lang}|${S.order.join('')}`, () => {
    const dx = (S.gi - 1) * 105;
    $('c1').innerHTML = cardHTML(kind, 'in'); $('c1').firstElementChild.style.setProperty('--dx', `${dx}px`);
  });
  $('c1').classList.toggle('lit', done);
  $('q1').textContent = g.q; $('q1').classList.toggle('gone', done);
  [...$('plates').children].forEach((b, i) => {
    b.textContent = t.rd[KINDS[i]]; b.disabled = done;
    b.classList.toggle('ok', done && i === k); b.classList.toggle('no', done && i === S.pick && i !== k); b.classList.toggle('dim', done && i !== k && i !== S.pick);
  });
  $('curt').classList.toggle('up', done);
  once('rds', `${done}|${k}|${S.pick}`, () => {
    $('rds').innerHTML = done ? KINDS.map((x, i) => `<div class="wf-rd ${i === k ? 'right' : i === S.pick ? 'wrong' : ''}">${face(x)}</div>`).join('') : '';
  });
  const ex = 58.5 + 81 * k;
  $('linep').setAttribute('d', `M180 298 C180 336 ${ex} 322 ${ex} 364`);
  $('line').classList.toggle('on', done);
  const score = S.res.filter((x) => x === true).length, n = S.res.filter((x) => x !== null).length;
  if (!done) {
    lab.setReadout('?', g.ver(S.gi + 1), '', '#ffd23f');
    lab.setState({ emo: '📮', title: g.q, lead: g.lead(S.gi + 1), body: g.body, extra: '' }); lab.setFacts([]);
  } else {
    lab.setReadout(`${score}/${n}`, g.sub, '', '#ffd23f');
    lab.setState({ emo: S.pick === k ? '✅' : '🤔', title: S.pick === k ? g.right : g.no, lead: g.was(t.fw[kind]), body: S.gi >= 2 ? g.done(score) : '',
      extra: `<div class="wf-cl"><b>${esc(g.clues)}</b>${t.clues[kind].map((c) => `<span>🟡 ${esc(c)}</span>`).join('')}</div>` });
    lab.setFacts(fact(t, 'guess'));
  }
  mainBtn(S.gi >= 2 ? g.again : g.next, !done);
}

function renderDial(t) {
  const d = t.d, cur = KINDS[S.cur], nLong = LONG[lang];
  lab.setGlow('rgba(63, 181, 168, .25)');
  mainBtn('', true, true); $('wfReset').hidden = false; $('wfReset').textContent = d.reset;
  once('c2', `${S.cur}|${lang}`, () => { $('c2').innerHTML = cardHTML(cur, 'in2'); });
  $('rot').style.transform = `rotate(${STOP_ANG[S.cur]}deg)`;
  document.querySelectorAll('.wf-stop').forEach((b, i) => { b.classList.toggle('cur', i === S.cur); b.classList.toggle('pend', i === S.pend); b.title = t.rd[KINDS[i]]; });
  const side = $('side');
  if (S.pend !== null) {
    side.innerHTML = `<div class="wf-ask"><p>${esc(d.ask(t.to[KINDS[S.pend]]))}</p><button data-act="ask" data-k="up">${esc(d.up)}</button><button data-act="ask" data-k="down">${esc(d.down)}</button><button class="x" data-act="askx">${esc(d.x)}</button></div>`;
  } else {
    const st = KINDS.map(stats), mw = Math.max(...st.map((s) => s.wps)), ml = Math.max(...st.map((s) => s.long), 1);
    const block = (cls, title, f, mx, dp) => `<div class="blk ${cls}"><h4>${esc(title)}</h4>${KINDS.map((x, i) => {
      const seen = S.seen.includes(i), w = Math.round(f(st[i]) / mx * 100);
      return `<div class="wf-row ${i === S.cur ? 'cur' : ''} ${seen ? '' : 'un'}"><span class="ic">${face(x)}</span><span class="bar">${seen ? `<i style="width:${S.just === i ? 0 : w}%" data-w="${w}"></i>` : ''}</span><b>${seen ? dec(f(st[i]), dp) : '·'}</b></div>`;
    }).join('')}</div>`;
    side.innerHTML = `<div class="wf-ch">${block('w', d.c1, (s) => s.wps, mw, 1)}${block('l', d.c2(nLong), (s) => s.long, ml, 0)}</div>`;
    if (S.just !== null) { S.just = null; requestAnimationFrame(() => requestAnimationFrame(() => side.querySelectorAll('i[data-w]').forEach((i) => { i.style.width = `${i.dataset.w}%`; }))); }
  }
  lab.setReadout(esc(t.rd[cur]), d.sub, '', '#3fb5a8');
  if (S.pend !== null) {
    lab.setState({ emo: '🤔', title: d.tq, lead: d.ask(t.to[KINDS[S.pend]]), body: '', extra: '' }); lab.setFacts([]);
  } else if (S.last) {
    const { from, to, ok } = S.last, a = stats(KINDS[from]), b = stats(KINDS[to]);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? d.right : d.no, lead: `${b.wps > a.wps ? d.longer : d.shorter} ${d.avg(dec(a.wps), dec(b.wps))}`,
      body: `${d.lw(a.long, b.long)} ${t.note[KINDS[to]]}`, extra: '' });
    lab.setFacts(fact(t, 'dial'));
  } else {
    lab.setState({ emo: '🎚️', title: d.t0, lead: d.l0, body: d.b0(nLong), extra: '' }); lab.setFacts(fact(t, 'dial'));
  }
}

function renderWhere(t) {
  const w = t.w, placed = S.place.filter((p) => p !== null).length;
  lab.setGlow('rgba(245, 200, 76, .2)');
  $('wfReset').hidden = S.chk; $('wfReset').textContent = w.reset;
  const sn = (i, extra = '') => `<div class="wf-sn s${i} ${S.sel === i ? 'sel' : ''} ${extra}" data-i="${i}">${esc(w.items[i][0])}</div>`;
  const slots = w.places.map(([emo, name, kind], s) => {
    const shown = S.chk ? s : S.place[s];
    const cls = S.chk ? (S.mine[s] === s ? 'right' : 'fix') : '';
    return `<div class="wf-slot ${cls}" data-act="slot" data-k="${s}"><div class="hd"><span class="e">${emo}</span><span class="n">${esc(name)}</span><span class="ic">${face(kind)}</span></div>${S.chk ? `<span class="bg">${cls === 'right' ? '✓' : '!'}</span>` : ''}${shown !== null ? (S.chk ? `<div class="wf-sn s${shown}" style="cursor:default">${esc(w.items[shown][0])}</div>` : sn(shown)) : ''}</div>`;
  }).join('');
  const tray = TRAY.map((i) => `<div class="wf-cell">${S.place.includes(i) || S.chk ? '' : sn(i)}</div>`).join('');
  $('v3').innerHTML = `<div class="wf-slots">${slots}</div><div class="wf-tl">${esc(w.tray)}</div><div class="wf-tray">${tray}</div>`;
  mainBtn(S.chk ? t.ui.again : t.ui.check, !S.chk && placed < 6);
  lab.setReadout(S.chk ? `${S.okN}/6` : `${placed}/6`, S.chk ? '' : '', '', '#f5c84c');
  if (S.chk) {
    lab.setState({ emo: S.okN === 6 ? '🏆' : '📍', title: w.res(S.okN), lead: w.rl, body: '',
      extra: `<div class="wf-cl">${w.places.map(([emo], s) => `<span>${emo} ${esc(w.items[s][1])}</span>`).join('')}</div>` });
    lab.setFacts(fact(t, 'where'));
  } else {
    lab.setState({ emo: '📍', title: w.t0, lead: w.l0, body: w.placed(placed), extra: '' }); lab.setFacts(fact(t, 'where'));
  }
}

function renderWrong(t) {
  const x = t.wr;
  lab.setGlow('rgba(255, 140, 90, .22)');
  mainBtn('', true, true); $('wfReset').hidden = true;
  const card1 = `<div class="wf-card c-child"><p>${esc(x.t1)}</p></div>`;
  const card2 = `<div class="wf-card c-off"><p>${esc(x.t2)}</p></div>`;
  $('s1').innerHTML = `<div class="wf-pan" style="top:10px">${card1}<div class="rd"><span class="q">?</span>${face('parent', 'puzzled')}</div></div>
    <div class="wf-pan" style="top:236px">${card2}<div class="rd"><span class="q">?</span>${face('child', 'puzzled')}</div></div>`;
  lab.setReadout('🙃', '', '', '#ff8c5a');
  lab.setState({ emo: '🙃', title: x.title, lead: x.lead, body: x.body, extra: '' }); lab.setFacts([]);
}

function renderHead(t) {
  const h = t.hl, aud = S.hl.aud, ws = S.hl.words;
  lab.setGlow('rgba(255, 120, 200, .22)');
  $('wfReset').hidden = true; mainBtn(S.hl.chk ? t.ui.again : t.ui.check, !S.hl.chk && ws.length < 3);
  const wordOf = (j) => h.w[BANK[j][0]][BANK[j][1]];
  const cols = ['#e5484d', '#1f9d92', '#e38a12'];
  const text = ws.length ? ws.map((j, n) => aud === 'child' ? `<span style="color:${cols[n % 3]}">${esc(wordOf(j))}</span>` : esc(wordOf(j))).join(' ') : `<span class="ph">${esc(h.ph)}</span>`;
  const k = ws.filter((j) => BANK[j][0] === aud).length;
  $('s2').innerHTML = `<div class="wf-prev ${aud}"><span class="tag">${esc(t.rd[aud])}</span><div class="h">${text}</div></div>
    <div class="wf-auds">${KINDS.map((x) => `<button class="wf-aud ${x === aud ? 'on' : ''}" data-act="aud" data-k="${x}"><span class="c">${face(x)}</span>${esc(t.rd[x])}</button>`).join('')}</div>
    <div class="wf-words">${BANK.map(([a], j) => {
      const on = ws.includes(j), fit = S.hl.chk && a === aud;
      return `<button class="wf-word ${on && !S.hl.chk ? 'on' : ''} ${S.hl.chk && on ? (fit ? 'good' : 'bad') : ''} ${S.hl.chk && !on && fit ? 'fit' : ''}" data-act="word" data-k="${j}" ${S.hl.chk ? 'disabled' : ''}>${esc(wordOf(j))}</button>`;
    }).join('')}</div>`;
  lab.setReadout(S.hl.chk ? `${k}/3` : `${ws.length}/3`, '', '', '#ff78c8');
  lab.setState(S.hl.chk ? { emo: k === 3 ? '🏆' : '📰', title: h.res(k), lead: k === 3 ? h.good : h.some, body: '', extra: '' }
    : { emo: '📰', title: t.secrets.head[0], lead: h.prompt(t.fw[aud]), body: h.ph, extra: '' });
  lab.setFacts([]);
}
render();
</script>
</body>
</html>
