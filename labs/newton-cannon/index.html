  const ay = started ? y0 + rulerPx * (0.5 * APPLE_G * at * at) / APPLE_FALL : y0;
  c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(appleX, gY + 3, aR * (1.1 - 0.35 * (yEnd - ay) / rulerPx), 2.6, 0, 0, TAU); c.fill();
  drawApple(c, appleX, ay, aR);
  if (!asking) {
    drawRuler(c, appleX + 22, y0, yEnd);
    pills.push([`${dec(APPLE_FALL, 1)} ${t.mU}`, appleX + 30, (y0 + yEnd) / 2, { align: 'left', stroke: GOLD }]);
  }
  c.restore();
  pills.push([t.apple, side ? ap.x + 8 : ap.x + ap.w - 8, 16, { align: side ? 'left' : 'right' }]);
  if (started && !asking) pills.push([`${dec(at, 1)} ${t.sU}`, side ? ap.x + 8 : ap.x + ap.w - 8, 42, { align: side ? 'left' : 'right', color: GOLD }]);
  // --- the Moon panel
  c.save(); c.beginPath(); c.roundRect(mo.x, mo.y, mo.w, mo.h, 16); c.clip();
  const mg = c.createLinearGradient(0, mo.y, 0, mo.y + mo.h); mg.addColorStop(0, '#0b1026'); mg.addColorStop(1, '#141b3d'); c.fillStyle = mg; c.fillRect(mo.x, mo.y, mo.w, mo.h);
  for (const s of STARS) { c.fillStyle = `rgba(255,255,255,${s.a * 0.8 * (0.75 + 0.25 * Math.sin(time * 1.3 + s.p))})`; c.beginPath(); c.arc(mo.x + s.x * mo.w, mo.y + s.y * mo.h, s.r, 0, TAU); c.fill(); }
  c.translate(mox, moy);
  const eX = 120, eY = 175, rho = 100, moonX = eX, moonY = eY - rho;
  c.save(); c.setLineDash([4, 6]); c.strokeStyle = 'rgba(217,212,199,.38)'; c.lineWidth = 1.2; c.beginPath(); c.arc(eX, eY, rho, 0, TAU); c.stroke(); c.restore();
  c.save(); c.setLineDash([2, 4]); c.strokeStyle = 'rgba(237,239,247,.45)'; c.lineWidth = 1; c.beginPath(); c.moveTo(eX, eY - 8); c.lineTo(moonX, moonY + 8); c.stroke(); c.restore();
  drawEarth(c, eX, eY, 7);
  // the Moon's velocity arrow
  c.save(); c.strokeStyle = 'rgba(237,239,247,.8)'; c.fillStyle = 'rgba(237,239,247,.8)'; c.lineWidth = 1.6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(moonX + 11, moonY); c.lineTo(moonX + 34, moonY); c.stroke();
  c.beginPath(); c.moveTo(moonX + 40, moonY); c.lineTo(moonX + 33, moonY - 3.5); c.lineTo(moonX + 33, moonY + 3.5); c.closePath(); c.fill(); c.restore();
  drawMoonSphere(c, moonX, moonY, 7.5);
  pills.push(['× 60', mox + eX - 28, moy + (eY + moonY) / 2, { align: 'center' }]);
  pills.push([t.worldNames.earth, mox + eX, moy + eY + 22, { align: 'center' }]);
  pills.push([t.moonMin, mo.x + 8, mo.y + 16, { align: 'left' }]);
  // the zoom circle: appears with the answer
  if (!asking) {
    const lx = 282, ly = 150, lr = 58, P0x = lx - 48, P0y = ly - 30, Lp = 96, gapPx = rulerPx * MOON_GAP / APPLE_FALL;
    // the cone from the Moon to the lens
    const dx = lx - moonX, dy = ly - moonY, d = Math.hypot(dx, dy), base = Math.atan2(dy, dx), half = Math.asin(lr / d), tl = Math.sqrt(d * d - lr * lr);
    const T1 = [moonX + tl * Math.cos(base - half), moonY + tl * Math.sin(base - half)], T2 = [moonX + tl * Math.cos(base + half), moonY + tl * Math.sin(base + half)];
    c.fillStyle = 'rgba(255,255,255,.05)'; c.beginPath(); c.moveTo(moonX, moonY); c.lineTo(T1[0], T1[1]); c.lineTo(T2[0], T2[1]); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1; c.beginPath(); c.moveTo(moonX, moonY); c.lineTo(T1[0], T1[1]); c.moveTo(moonX, moonY); c.lineTo(T2[0], T2[1]); c.stroke();
    c.save(); c.beginPath(); c.arc(lx, ly, lr, 0, TAU); c.clip();
    const lg = c.createRadialGradient(lx - 14, ly - 18, 6, lx, ly, lr); lg.addColorStop(0, '#1b2350'); lg.addColorStop(1, '#0a0f26'); c.fillStyle = lg; c.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
    const eg = c.createRadialGradient(lx, ly + 100, 40, lx, ly + 96, 90); eg.addColorStop(0, '#2a6fdb'); eg.addColorStop(1, '#174a9c'); c.fillStyle = eg; c.beginPath(); c.ellipse(lx, ly + 96, 86, 52, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(127,200,255,.5)'; c.lineWidth = 1.5; c.stroke();
    // where the Moon would go without gravity: a straight dashed line
    c.setLineDash([5, 5]); c.strokeStyle = 'rgba(237,239,247,.8)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(P0x, P0y); c.lineTo(P0x + Lp + 12, P0y); c.stroke(); c.setLineDash([]);
    // the real path bends to the Earth
    const pathY = (uu) => P0y + gapPx * uu * uu;
    c.strokeStyle = '#ff9f43'; c.lineWidth = 2.4; c.lineCap = 'round'; c.beginPath();
    for (let q = 0; q <= 30; q++) { const uu = u * q / 30; if (q) c.lineTo(P0x + Lp * uu, pathY(uu)); else c.moveTo(P0x, P0y); }
    c.stroke();
    const mxL = P0x + Lp * u, myL = pathY(u);
    if (u > 0.03) { c.save(); c.globalAlpha = .55; c.setLineDash([2, 2]); c.strokeStyle = '#d9d4c7'; c.lineWidth = 1.2; c.beginPath(); c.arc(mxL, P0y, 6.5, 0, TAU); c.stroke(); c.restore(); if (myL - P0y > 6) drawRuler(c, mxL, P0y, myL); }
    drawMoonSphere(c, mxL, myL, 6.5);
    c.restore();
    c.strokeStyle = 'rgba(237,239,247,.7)'; c.lineWidth = 1.8; c.beginPath(); c.arc(lx, ly, lr, 0, TAU); c.stroke();
    pills.push([`${intF(V_MOON * 60 * u)} ${t.km}`, mox + lx, moy + ly - 44, { align: 'center', size: 12 }]);
    pills.push([`${dec(MOON_GAP * u * u, 1)} ${t.mU}`, mox + lx, moy + ly + lr + 16, { align: 'center', stroke: GOLD, color: GOLD }]);
    if (started) pills.push([`${Math.round(60 * u)} ${t.sU}`, mo.x + 8, mo.y + 42, { align: 'left', color: GOLD }]);
  }
  c.restore();
  c.restore(); // translate/scale
  for (const [text, x, y, o] of pills) { const [sx, sy] = S2(x, y); pill(c, w, text, sx, sy, o); }
  c.restore();
}

// --- the frame loop ---------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  clockT = time;
  const v = lab.view;
  c.save();
  if (v === 'cannon') drawCannonView(c, w, h, dt, time);
  else if (v === 'worlds') drawWorldsView(c, w, h, dt, time);
  else drawMoonView(c, w, h, dt, time);
  c.restore();
  if (S.dirty) { S.dirty = false; render(); }
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => { // on a phone the controls sit below the canvas: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function startDrop() { S.wT = 0; S.wRun = true; sfx.click(); S.dirty = true; }
function startPlay() { S.mT = 0; sfx.click(); S.dirty = true; }
$('ctrlBody').addEventListener('click', (ev) => {
  const o = ev.target.closest('.nc-opt');
  if (o && !o.disabled) {
    const i = +o.dataset.i, which = o.parentElement.dataset.k;
    if (which === 'c') { S.cAns = i; S.cAsk = 'demo'; (i === 2 ? sfx.good : sfx.bad)(); S.mode = null; S.shots = []; setSlider(7); S.demo = { step: 0 }; fire(7); showStage(); }
    else if (which === 'w') { S.wAns = i; S.wAsk = 'done'; (i === 1 ? sfx.good : sfx.bad)(); startDrop(); showStage(); }
    else if (which === 'm') { S.mAns = i; S.mAsk = 'done'; (i === 1 ? sfx.good : sfx.bad)(); startPlay(); showStage(); }
    render(); return;
  }
  const sec = ev.target.closest('[data-sec]');
  if (sec) { if (!secret.unlocked()) return secret.open(); sfx.click(); setMode(sec.dataset.sec); render(); return; }
  const id = ev.target.closest('button')?.id;
  if (id === 'ncFire') {
    if (S.cAsk !== 'done') return;
    if (S.mode) { S.mode = null; }
    fire(S.sp); render();
  } else if (id === 'ncDrop') { if (S.wAsk === 'done') startDrop(); }
  else if (id === 'ncPlay') { if (S.mAsk === 'done') startPlay(); }
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'ncSp') { S.sp = Math.round(+ev.target.value * 10) / 10; if (S.mode) S.mode = null; sfx.tick(); render(); }
  else if (ev.target.id === 'ncMs') { S.wMass = Math.round(+ev.target.value); sfx.tick(); render(); }
});

// --- one render per change: controls, readout and the state card ---------------------------------------------
const askHtml = (k, q, opts, ans, right, vRight, vWrong) => {
  const chips = opts.map((o, i) => {
    let cls = 'nc-opt';
    if (ans !== null) cls += i === right ? ' good' : i === ans ? ' bad' : ' dim';
    return `<button class="${cls}" data-i="${i}"${ans !== null ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  const verdict = ans === null ? '' : `<div class="nc-verdict ${ans === right ? 'ok' : 'no'}">${esc(ans === right ? vRight : vWrong)}</div>`;
  return `<div class="nc-q">${esc(q)}</div><div class="nc-opts" data-k="${k}">${chips}</div>${verdict}`;
};
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  for (const [k, id] of [['cannon', 'ncCannon'], ['worlds', 'ncWorlds'], ['moon', 'ncMoon']]) $(id).classList.toggle('nc-off', v !== k);
  if (v === 'cannon') renderCannon(t); else if (v === 'worlds') renderWorlds(t); else renderMoon(t);
}
function renderCannon(t) {
  lab.setGlow('rgba(255, 159, 67, .2)');
  const asking = S.cAsk === 'open', done = S.cAsk === 'done';
  $('ncCannon').classList.toggle('nc-done', !asking);
  $('ncCAsk').innerHTML = askHtml('c', t.cannonAsk, t.cannonOpts, S.cAns, 2, t.cannonRight, t.cannonWrong);
  $('ncCCtl').classList.toggle('nc-off', asking);
  $('ncCCtl').classList.toggle('nc-lock', !done);
  $('ncSp').disabled = !done; $('ncFire').disabled = !done;
  $('ncSpL').textContent = t.speed; $('ncSpV').textContent = t.kms(dec(S.sp, 1)); $('ncFire').textContent = t.fire;
  const open = secret.unlocked();
  const sc = (k, emo, n) => `<button class="chip secret ${open ? 'open' : ''} ${S.mode === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[n][0])}` : '🔒 ???'}</button>`;
  $('ncSecs').innerHTML = done ? sc('iss', '🛰️', 'a') + sc('esc', '🚀', 'b') : '';
  const last = curList()[curList().length - 1];
  if (asking) { lab.setReadout('?', '', '', '#e0791a'); lab.setState({ emo: '🤔', title: t.cannonAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  if (S.mode === 'iss' && S.iss) {
    lab.setReadout(esc(t.kms(dec(VC, 1))), t.orbit(intF(Math.round(S.iss.period / 60))), t.sunrises(S.iss.sun), '#e0791a');
    lab.setState({ emo: '🛰️', title: t.secrets.a[0], lead: t.issText, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (S.mode === 'esc' && last) {
    lab.setReadout(esc(t.kms(dec(last.v, 1))), resultOf(last, t), '', '#e0791a');
    lab.setState({ emo: '🚀', title: t.secrets.b[0], lead: t.escText(dec(VESC, 2)), body: '', extra: '' }); lab.setFacts([]); return;
  }
  const shown = S.demo ? last : (last && Math.abs(last.v - S.sp) < 0.05 ? last : null);
  lab.setReadout(esc(t.kms(dec(S.demo && last ? last.v : S.sp, 1))), shown ? resultOf(shown, t) : '', t.circle(dec(VC, 1)), '#e0791a');
  const [emo, title, lead, body] = t.st.cannon;
  lab.setState({ emo, title, lead, body, extra: '' }); lab.setFacts(t.facts.cannon);
}
function renderWorlds(t) {
  lab.setGlow('rgba(42, 111, 219, .3)');
  const asking = S.wAsk === 'open';
  $('ncWorlds').classList.toggle('nc-done', !asking);
  $('ncWAsk').innerHTML = askHtml('w', t.worldsAsk, t.worldsOpts, S.wAns, 1, t.worldsRight, t.worldsWrong);
  $('ncWCtl').classList.toggle('nc-off', asking);
  $('ncDrop').textContent = t.drop; $('ncMsL').textContent = t.mass; $('ncMsV').textContent = `${S.wMass} ${t.kg}`;
  if (asking) { lab.setReadout('?', '', '', '#2a6fdb'); lab.setState({ emo: '🤔', title: t.worldsAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  const slow = WORLDS.reduce((a, b) => (fallT(b.g) > fallT(a.g) ? b : a));
  lab.setReadout(esc(t.g(dec(slow.g, 2))), '', t.fallTime(dec(fallT(slow.g), 1)), '#2a6fdb');
  const [emo, title, lead, body] = t.st.worlds;
  lab.setState({ emo, title, lead, body, extra: '' }); lab.setFacts(t.facts.worlds);
}
function renderMoon(t) {
  lab.setGlow('rgba(217, 212, 199, .16)');
  const asking = S.mAsk === 'open';
  $('ncMoon').classList.toggle('nc-done', !asking);
  $('ncMAsk').innerHTML = askHtml('m', t.moonAsk, t.moonOpts, S.mAns, 1, t.moonRight, t.moonWrong);
  $('ncMCtl').classList.toggle('nc-off', asking);
  $('ncPlay').textContent = t.again;
  if (asking) { lab.setReadout('?', '', '', '#5a6384'); lab.setState({ emo: '🤔', title: t.moonAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  lab.setReadout(esc(t.moonVal(dec(MOON_GAP, 1))), '', t.weaker, '#5a6384');
  const [emo, title, lead, body] = t.st.moon;
  lab.setState({ emo, title, lead, body, extra: '' }); lab.setFacts(t.facts.moon);
}
setSlider(7);
render();
</script>
