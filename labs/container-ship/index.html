  c.strokeStyle = '#ffd36a'; c.beginPath(); c.moveTo(tx(1), 372); c.lineTo(tx(Math.max(1, N)), 372); c.stroke();

  else if (act === 'pick3') {

    S.marks = null; sfx.tick();

  c.save(); c.translate(ox, oy); c.scale(s, s);
  const v = lab.view;
  if (S.sec === 'boxes') drawBoxes(c, tt); else if (S.sec === 'cranes') drawCranes(c, tt);
  else if (v === 'load') {
    drawLoad(c, tt);
    const sm = sim();
    if (sm.on && !S.boxDone && sm.pB >= 1) { S.boxDone = true; (S.g1 === T[lang].v1.ok ? sfx.good : sfx.click)(); render(); }
    if (sm.on && !S.handDone && sm.pH >= 1) { S.handDone = true; render(); }
    if (sm.on && !S.boxDone) { const k = T[lang].v1.clock(sm.h); if (k !== S.tick1) { S.tick1 = k; lab.setReadout(k, T[lang].v1.rd1, '', '#e0a050'); } }
  } else if (v === 'shirt') drawShirt(c, tt);
  else drawDates(c, tt);
  c.restore();
});
render();
</script>
