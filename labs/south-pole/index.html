const clamp01 = (x) => Math.min(1, Math.max(0, x));

const parseHex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

function spline(pts, n = 16) {

    out.push({ x: f(p0[0], p1[0], p2[0], p3[0]), y: f(p0[1], p1[1], p2[1], p3[1]) });

    c.fillStyle = 'rgba(40,70,100,.22)'; ell(c, 6, 2, 62, 8); c.fill();
    const ig = c.createLinearGradient(-50, -40, 50, 0); ig.addColorStop(0, '#ffffff'); ig.addColorStop(1, '#cfdde9');
    c.fillStyle = ig; c.beginPath(); c.ellipse(0, 0, 52, 40, 0, Math.PI, TAU); c.closePath(); c.fill(); c.strokeStyle = '#9bb4c8'; c.lineWidth = 1.2; c.stroke();
    c.strokeStyle = 'rgba(140,170,195,.7)'; c.lineWidth = 1;
    for (let r = 1; r <= 3; r++) { c.beginPath(); c.ellipse(0, 0, 52 - r * 4, 40 * (1 - r * 0.24), 0, Math.PI, TAU); c.stroke(); }
    c.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI + (i + 1) * Math.PI / 7; c.moveTo(Math.cos(a) * 14, Math.sin(a) * 11); c.lineTo(Math.cos(a) * 51, Math.sin(a) * 39); } c.stroke();
    c.fillStyle = '#f2b45a'; c.beginPath(); c.moveTo(-17, 0); c.quadraticCurveTo(-17, -17, -6, -17); c.lineTo(2, -17); c.quadraticCurveTo(10, -17, 10, 0); c.closePath(); c.fill();
    c.fillStyle = '#7a5a30'; c.beginPath(); c.moveTo(-12, 0); c.quadraticCurveTo(-12, -11, -4, -11); c.lineTo(0, -11); c.quadraticCurveTo(6, -11, 6, 0); c.closePath(); c.fill();
    c.restore();
    // wooden rack with a fur anorak
    c.save(); c.translate(80, 232);
    c.fillStyle = 'rgba(40,70,100,.22)'; ell(c, 4, 2, 44, 6); c.fill();
    c.strokeStyle = '#6a4423'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(-36, 0); c.lineTo(-30, -138); c.moveTo(36, 0); c.lineTo(30, -138); c.moveTo(-40, -120); c.lineTo(40, -120); c.stroke();
    const fg = c.createLinearGradient(-30, 0, 30, 0); fg.addColorStop(0, '#b78d5e'); fg.addColorStop(1, '#8a6038');
    c.fillStyle = fg; c.strokeStyle = '#5e3f22'; c.lineWidth = 1.4; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-14, -116); c.quadraticCurveTo(-30, -112, -33, -86); c.lineTo(-44, -44); c.lineTo(-33, -40); c.lineTo(-27, -62); c.lineTo(-27, -22); c.quadraticCurveTo(0, -14, 27, -22); c.lineTo(27, -62); c.lineTo(33, -40); c.lineTo(44, -44); c.lineTo(33, -86); c.quadraticCurveTo(30, -112, 14, -116); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#efe4d0'; c.beginPath(); c.moveTo(-27, -26); for (let i = 0; i <= 9; i++) c.lineTo(-27 + i * 6, -22 + (i % 2 ? 5 : -2)); c.lineTo(27, -30); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#efe4d0'; ell(c, 0, -118, 24, 17); c.fill(); c.stroke();
    c.fillStyle = '#4a3524'; ell(c, 0, -116, 15, 11); c.fill();
    c.strokeStyle = '#efe4d0'; c.lineWidth = 1.4; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(-33, -70); c.quadraticCurveTo(0, -62, 33, -70); c.stroke(); c.setLineDash([]);
    c.fillStyle = C.red; c.fillRect(-22, -52, 44, 4);
    c.restore();
    // dog team
    const ph = time * 7;
    c.save(); c.translate(0, 0);
    c.save(); c.translate(160, 252); c.scale(1.15, 1.15); sledge(c, { bundle: true, crates: 2, flag: C.red, time });
    c.strokeStyle = '#5a4630'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(31, -8); c.lineTo(50, -11); c.moveTo(31, -8); c.lineTo(70, -12); c.stroke();
    c.save(); c.translate(70, -2.5); dog(c, ph + 1.4, 0.7, 1); c.restore();
    c.save(); c.translate(52, 0); dog(c, ph, 0.7, 0); c.restore();
    c.save(); c.translate(94, 0); dog(c, ph + 2.2, 0.7, 0); c.restore();
    c.restore(); c.restore();
  }
  c.restore();
}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = b.dataset.k, d = S.dep, g = S.g;
  if (act === 'rguess') { S.guess = +k; sfx.click(); }
  else if (act === 'rgo') {
    if (S.playing) { S.playing = false; sfx.click(); }
    else { if (S.rt >= 90) { S.rt = 0; } S.started = true; S.playing = true; sfx.click(); showStage(); }
  } else if (act === 'dguess') { d.guess = +k; sfx.click(); }
  else if (act === 'dgo') {
    if (d.phase !== 'idle') return;
    if (!d.predicted && d.guess === null) return;
    if (!d.predicted) { d.set = new Set(); d.stocked = new Set(); }
    d.note = null; d.v = ''; d.res = null;
    const list = [...d.set].sort((a, b2) => a - b2).map((kk, i) => ({ k: kk, arr: kk * 0.12 + i * 0.3 + 0.15 }));
    d.layList = list; d.layTotal = list.length ? list[list.length - 1].arr + 0.22 + 0.45 : 0; d.stocked = new Set();
    d.t = 0; sfx.click(); showStage();
    if (list.length) { d.phase = 'lay'; render(); } else beginTrip();
    return;
  } else if (act === 'dclr') { if (d.phase === 'idle') { d.set = new Set(); d.stocked = new Set(); d.note = null; sfx.tick(); } }
  else if (act === 'gpull') { g.pull = k; resetGear(); sfx.click(); }
  else if (act === 'gfeet') { g.feet = k; resetGear(); sfx.click(); }
  else if (act === 'gclo') { g.clothes = k; resetGear(); sfx.click(); }
  else if (act === 'grun') { if (!g.running && g.pull) { startGear(); showStage(); } return; }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click();
  }
  render();
});
$('cv').addEventListener('click', (ev) => {
  if (lab.view !== 'depots' || S.sec) return;
  const d = S.dep; if (!d.predicted || d.phase !== 'idle') return;
  const r = $('cv').getBoundingClientRect(), sc = Math.min(r.width / DW, r.height / DH);
  const dx = (ev.clientX - r.left - (r.width - DW * sc) / 2) / sc, dy = (ev.clientY - r.top - (r.height - DH * sc) / 2) / sc;
  if (dy < 90) return;
  const k = Math.round((dx - DX0) / DU);
  if (k < 1 || k > 9) return;
  if (d.set.has(k)) { d.set.delete(k); d.stocked.delete(k); sfx.tick(); }
  else if (d.set.size < 4) { d.set.add(k); sfx.snap(); }
  else { sfx.bad(); return; }
  d.note = null;
  render();
});
function onView() { S.sec = null; if (lab.view !== 'race') S.playing = false; render(); }

// --- one render per change: controls, readout and the state card ------------------------------------------------------
let rkey = '';
function liveReadout() {
  const v = lab.view, g = S.g;
  const k = v === 'race' ? `r${Math.floor(S.rt)}${S.started}` : v === 'depots' ? `d${S.dep.live}${S.dep.set.size}` : `g${gearLive().km}|${gearLive().cold}|${g.t > 0 || g.done}`;
  if (k !== rkey) { rkey = k; readout(); }
}
function readout() {
  const t = T[lang], v = lab.view, ACC = '#9cc9e8';
  if (v === 'race') {
    const rt = S.rt; let pill = '';
    if (S.started) pill = rt < 56 ? t.daysTo(t.amundsen, Math.ceil(56 - rt)) : rt < 59 ? `${t.amundsen}: ${t.atPole}` : rt < 90 ? t.daysTo(t.scott, Math.ceil(90 - rt)) : `${t.scott}: ${t.atPole}`;
    lab.setReadout(esc(fmt(rt)), t.today, pill, ACC);
  } else if (v === 'depots') lab.setReadout(String(S.dep.live ?? 4), t.crates, t.depots(S.dep.set.size), ACC);
  else { const g = S.g, L = gearLive(), on = g.t > 0 || g.done; lab.setReadout(on ? String(L.km) : '–', t.kmDay, on ? `${t.cold}: ${L.cold}/5` : '', ACC); }
}
const verdict = (el, ok, text) => { el.style.color = ok ? 'var(--ok)' : 'var(--wip)'; el.textContent = text; };
const chips = (items, act, cur, off, res) => items.map(([k, label]) => `<button class="chip sp-chip ${res ? (k === res.ok ? 'sp-ok' : k === cur ? 'sp-bad' : '') : cur === k ? 'on' : ''}" data-act="${act}" data-k="${k}"${off ? ' disabled' : ''}>${esc(label)}</button>`).join('');

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('spRace').style.display = v === 'race' ? 'block' : 'none';
  $('spDep').style.display = v === 'depots' ? 'block' : 'none';
  $('spGear').style.display = v === 'gear' ? 'block' : 'none';
  const open = secret.unlocked();
  $('spSecrets').innerHTML = [['a', '⛺'], ['b', '🏠']].map(([k, emo]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''} sp-chip" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setGlow('rgba(120, 170, 215, .28)');
  let st;
  if (v === 'race') st = renderRace(t); else if (v === 'depots') st = renderDepots(t); else st = renderGear(t);
  if (S.sec) st = { emo: S.sec === 'a' ? '⛺' : '🏠', title: t.secrets[S.sec][0], lead: S.sec === 'a' ? t.tentText : t.inuitText, body: '', extra: '', facts: st.facts };
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body ?? '', extra: st.extra ?? '' });
  lab.setFacts(st.facts ?? []);
  rkey = ''; readout();
}
const factsOf = (t, k) => t.facts[k].map((f) => ({ emo: f.emo, text: f.text, src: f.src }));

function renderRace(t) {
  const sd = S.raceDone, shown = S.raceDone && !S.playing && S.rt >= 90;
  $('spRaceAsk').innerHTML = `<div class="sp-q">${esc(t.raceAsk)}</div><div class="chips">${chips(t.raceOpts.map((o, i) => [i, o]), 'rguess', S.guess, S.playing || S.started, S.raceDone ? { ok: 0 } : null)}</div>`;
  const go = $('spGo'); go.style.display = S.guess === null && !S.raceDone ? 'none' : ''; go.textContent = S.playing ? t.pause : t.start;
  $('spRaceV').style.color = ''; if (shown) verdict($('spRaceV'), S.rightRace, S.rightRace ? t.raceRight : t.raceWrong); else $('spRaceV').textContent = '';
  $('spPlans').innerHTML = `<div class="sp-plan" style="--c:${C.red}"><b>🐕 ${esc(t.amundsen)}</b>${esc(t.planA)}</div><div class="sp-plan" style="--c:#5b7fc0"><b>⚙️ ${esc(t.scott)}</b>${esc(t.planS)}</div>`;
  if (!sd) return { emo: '🤔', title: t.raceAsk, lead: t.st.race[2], facts: [] };
  return { emo: t.st.race[0], title: t.st.race[1], lead: t.st.race[2], body: t.st.race[3], facts: factsOf(t, 'race') };
}
function renderDepots(t) {
  const d = S.dep, busy = d.phase !== 'idle';
  $('spDepAsk').innerHTML = d.predicted ? '' : `<div class="sp-q">${esc(t.depAsk)}</div><div class="chips">${chips(t.depOpts.map((o, i) => [i, o]), 'dguess', d.guess, busy)}</div>`;
  const go = $('spDGo'); go.style.display = d.predicted || d.guess !== null ? '' : 'none'; go.textContent = t.go; go.disabled = busy;
  const clr = $('spDClr'); clr.style.display = d.predicted ? '' : 'none'; clr.textContent = t.clearDepots; clr.disabled = busy || !d.set.size;
  const vEl = $('spDepV');
  if (d.v === 'first') verdict(vEl, d.firstOK, d.firstOK ? t.depRight : t.depWrong);
  else if (d.v === 'run' && d.res) verdict(vEl, d.res.ok, d.res.ok ? t.home : t.outOfFood);
  else vEl.textContent = '';
  if (!d.predicted) return { emo: '🤔', title: t.depAsk, lead: '', facts: [] };
  const extra = d.won ? `<div class="sp-flags"><span>🚩 80°</span><span>🚩 81°</span><span>🚩 82°</span><i>${esc(t.realDepots)}</i></div>` : '';
  return { emo: t.st.depots[0], title: t.st.depots[1], lead: t.st.depots[2], body: t.st.depots[3], extra, facts: factsOf(t, 'depots') };
}
function renderGear(t) {
  const g = S.g, busy = g.running;
  const pullItems = [['dogs', t.pullOpts[0]], ['ponies', t.pullOpts[1]], ['motor', t.pullOpts[2]]];
  $('spGearAsk').innerHTML = `${g.first ? '' : `<div class="sp-q">${esc(t.gearAsk)}</div>`}<div class="sp-grp" style="margin-top:0"><span class="sp-lbl">${esc(t.pull)}</span><div class="chips">${chips(pullItems.map(([k, o]) => [k, `${{ dogs: '🐕', ponies: '🐴', motor: '⚙️' }[k]} ${o}`]), 'gpull', g.pull, busy)}</div></div>`;
  $('spGearRest').innerHTML = g.pull === null ? '' : `
    <div class="sp-grp"><span class="sp-lbl">${esc(t.feet)}</span><div class="chips">${chips([['skis', `🎿 ${t.feetOpts[0]}`], ['boots', `🥾 ${t.feetOpts[1]}`]], 'gfeet', g.feet, busy)}</div></div>
    <div class="sp-grp"><span class="sp-lbl">${esc(t.clothes)}</span><div class="chips">${chips([['fur', `🧥 ${t.clothesOpts[0]}`], ['wool', `🧶 ${t.clothesOpts[1]}`]], 'gclo', g.clothes, busy)}</div></div>
    <div class="row2"><button class="btn" data-act="grun"${busy ? ' disabled' : ''}>${esc(t.testRun)}</button></div>`;
  $('spLog').innerHTML = g.log.map((e) => `<span>${{ dogs: '🐕', ponies: '🐴', motor: '⚙️' }[e.pull]}${{ skis: '🎿', boots: '🥾' }[e.feet]}${{ fur: '🧥', wool: '🧶' }[e.clothes]} · ${e.km} ${esc(t.kmDay)} · ${esc(t.cold)} ${e.lv}/5</span>`).join('');
  const vEl = $('spGearV'); if (g.v === 'first') verdict(vEl, g.firstOK, g.firstOK ? t.gearRight : t.gearWrong); else vEl.textContent = '';
  if (!g.first) return { emo: '🤔', title: t.gearAsk, lead: '', facts: [] };
  return { emo: t.st.gear[0], title: t.st.gear[1], lead: t.st.gear[2], body: t.st.gear[3], facts: factsOf(t, 'gear') };
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec) { drawSecret(c, w, h, time); return; }
  const v = lab.view;
  if (v === 'race') drawMap(c, w, h, dt, time); else if (v === 'depots') drawStrip(c, w, h, dt, time); else drawGear(c, w, h, dt, time);
  liveReadout();
});
render();
</script>
