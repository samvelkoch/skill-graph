    Math.round(Math.max(Math.abs(P.th[0]), Math.abs(P.th[1])) * 57.3), S.Q, S.d.toFixed(1), S.zapped, S.noSpark, S.zapT > 0 && now() - S.zapT < 0.7, S.tgt, S.hq, S.wq].join('|');
}
function syncSlider() { const sl = $('stSlider'); if (sl && !S.dragSl) sl.value = String(Math.round(S.cl * 100)); }

// --- pointer: drag the balloon (rub view and the two secrets) -------------------------------------------------------------
const cv = $('cv');
const toDesign = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - G.ox) / G.s, (ev.clientY - r.top - G.oy) / G.s]; };
const draggable = () => { const sc = curScene(); return sc === 'hair' || sc === 'water' || (sc === 'rub' && S.pick.rub !== null); };
cv.addEventListener('pointerdown', (ev) => {
  if (!draggable()) return;
  const [x, y] = toDesign(ev), b = S.bal;
  if (Math.hypot(x - b.x, y - b.y) > b.R + 18) return;
  b.st = 'drag'; b.path = null; b.onDone = null; b.vy = 0; b.gx = b.x; b.gy = b.y; S.grab = [x - b.x, y - b.y]; S.travel = 0; S.slid = false;
  try { cv.setPointerCapture(ev.pointerId); } catch { /* not captured */ }
  ev.preventDefault();
});
cv.addEventListener('pointermove', (ev) => {
  if (S.bal.st !== 'drag') return;
  const [x, y] = toDesign(ev); S.bal.gx = x - S.grab[0]; S.bal.gy = y - S.grab[1];
});
const endDrag = () => { if (S.bal.st === 'drag') { S.bal.st = 'rest'; releaseCheck(); } };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls -----------------------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, P = S.pair;
  if (a === 'opt') return answer(b.dataset.v, +b.dataset.i);
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k;
    enterScene(curScene()); sfx.click(); showStage();
  }
  else if (a === 'rub') { if (S.q >= MAXQ) sfx.bad(); else { runPath([[64, 262], [158, 262], [64, 262]], null); sfx.click(); } }
  else if (a === 'hold') { holdTo(); sfx.click(); }
  else if (a === 'tgt') { S.target = b.dataset.k; if (S.bal.st === 'stuck' || S.bal.st === 'slide') { S.bal.st = 'rest'; } S.slid = false; sfx.click(); }
  else if (a === 'reset') { resetRub(); sfx.click(); }
  else if (a === 'rubL') { P.last = null; pairHop(0, 0); pairHop(0, 0.12); sfx.click(); }
  else if (a === 'rubR') { P.last = null; pairHop(1, 0); pairHop(1, 0.12); sfx.click(); }
  else if (a === 'touchL') { pairDischarge(0); sfx.click(); }
  else if (a === 'touchR') { pairDischarge(1); sfx.click(); }
  else if (a === 'near') { P.near = !P.near; sfx.click(); }
  else if (a === 'shuffle') { S.noSpark = false; shuffleHop(0); shuffleHop(0.14); sfx.click(); }
  else if (a === 'stgt') { S.tgt = b.dataset.k; S.noSpark = false; sfx.click(); }
  else if (a === 'hairRub') { runPath([[200, 160], [340, 160], [200, 160], [340, 160]], null); sfx.click(); }
  else if (a === 'hairReset') { S.hq = 0; sfx.click(); }
  else if (a === 'waterMore') { S.wq = Math.min(14, S.wq + 2); sfx.tick(); }
  else if (a === 'waterOff') { S.wq = 0; sfx.click(); }
  render();
});
$('stSlider').addEventListener('input', (ev) => {
  if (S.pick.spark === null) return;
  S.dragSl = true; S.dTgt = S.d = DMAX - (DMAX - DMIN) * ev.target.value / 100; S.noSpark = false;
});
const endSl = () => { S.dragSl = false; syncSlider(); };
$('stSlider').addEventListener('change', endSl); addEventListener('pointerup', endSl); addEventListener('pointercancel', endSl);

// --- render: controls (rebuilt on a change of view, answer or language) and the info (readout, state card, facts) ----------------
function predHTML(v) {
  const t = T[lang][v], pick = S.pick[v], done = pick !== null, right = RIGHT[v];
  const chips = t.opts.map((o, i) => `<button class="st-opt${done ? (i === right ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="opt" data-v="${v}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = done ? `<div class="st-verdict ${pick === right ? 'good' : 'bad'}">${esc(pick === right ? t.right : t.wrong)}</div>` : '';
  return `<div class="st-q">${esc(t.ask)}</div><div class="st-opts">${chips}</div>${verdict}`;
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, sc = curScene(), ans = S.pick[v] !== null;
  document.body.dataset.v = sc;
  cv.style.touchAction = draggable() ? 'none' : 'pan-y';
  $('stPred').innerHTML = sec ? '' : predHTML(v);
  $('stRub').hidden = !(!sec && v === 'rub' && ans);
  $('stPair').hidden = !(!sec && v === 'pair' && ans);
  $('stSpark').hidden = !(!sec && v === 'spark' && ans);
  $('stHair').hidden = sec !== 'hair'; $('stWater').hidden = sec !== 'water';
  const set = (sel, txt) => { document.querySelector(sel).textContent = txt; };
  set('#stRub [data-act=rub]', t.rub.rubB); set('#stRub [data-act=hold]', t.rub.hold[S.target === 'wall' ? 0 : 1]); set('#stRub [data-act=reset]', t.rub.reset); $('stTip').textContent = t.rub.tip;
  $('stTgt').innerHTML = [['wall', t.rub.wall], ['paper', t.rub.paper]].map(([k, l]) => `<button data-act="tgt" data-k="${k}" class="${S.target === k ? 'on' : ''}">${esc(l)}</button>`).join('');
  set('#stPair [data-act=rubL]', t.pair.rubL); set('#stPair [data-act=rubR]', t.pair.rubR); set('#stPair [data-act=touchL]', t.pair.touchL); set('#stPair [data-act=touchR]', t.pair.touchR);
  set('#stPair [data-act=near]', S.pair.near ? t.pair.far : t.pair.near);
  set('#stSpark [data-act=shuffle]', t.spark.shuffle);
  $('stSTgt').innerHTML = ['metal', 'wood', 'wool'].map((k) => `<button data-act="stgt" data-k="${k}" class="${S.tgt === k ? 'on' : ''}">${esc(t.spark.tg[k])}</button>`).join('');
  $('stSlider').disabled = !ans; $('stSlider').setAttribute('aria-label', t.spark.dist); set('#stFar', t.spark.far); set('#stClose', t.spark.close);
  set('#stHair [data-act=hairRub]', t.hair.rub); set('#stHair [data-act=hairReset]', t.hair.reset);
  set('#stWater [data-act=waterMore]', t.water.more); set('#stWater [data-act=waterOff]', t.water.off);
  const open = secret.unlocked(), scb = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k === 'hair' ? 'a' : 'b'][0])}` : '🔒 ???'}</button>`;
  $('stSecs').innerHTML = scb('hair', '💇') + scb('water', '💧');
  S.sig = '';
  renderInfo(); syncSlider();
  lab.checkStage();
}
function renderInfo() {
  const t = T[lang], v = lab.view, sc = curScene(), st = (a) => lab.setState({ emo: a[0], title: a[1], lead: a[2], body: '', extra: '' });
  if (sc === 'hair') {
    lab.setReadout(`+${S.hq}`, t.hair.rubs(S.hq), '', '#c98a4a'); lab.setGlow('rgba(201, 138, 74, .24)');
    st(S.hq > 0 ? t.hair.s1 : t.hair.s0); lab.setFacts([]); return;
  }
  if (sc === 'water') {
    lab.setReadout(fmtq(S.wq), '', '', '#5aa6e0'); lab.setGlow('rgba(90, 166, 224, .26)'); st(t.water.s); lab.setFacts([]); return;
  }
  const ans = S.pick[v] !== null;
  if (!ans) {
    lab.setReadout('?', '', '', v === 'rub' ? '#e5303a' : v === 'pair' ? '#f2b227' : '#7fb6ff');
    lab.setGlow(v === 'rub' ? 'rgba(229, 48, 58, .22)' : v === 'pair' ? 'rgba(242, 178, 39, .22)' : 'rgba(127, 182, 255, .22)');
    lab.setState({ emo: '🤔', title: t[v].ask, lead: '', body: '', extra: '' }); lab.setFacts([]); return;
  }
  lab.setFacts(t.facts[v]);
  if (v === 'rub') {
    const q = S.q, paper = S.target === 'paper', b = S.bal, need = paper ? PAPER_MIN : STICK_MIN;
    lab.setReadout(`🎈 ${fmtq(q)} · 🧶 ${q ? '+' + q : '0'}`, '', q ? (q >= need ? t.enough : t.more) : '', '#e5303a'); lab.setGlow('rgba(229, 48, 58, .22)');
    let a;
    if (!paper && b.st === 'stuck') a = t.rub.stuck(q);
    else if (!paper && (b.st === 'slide' || S.slid)) a = q > 0 ? t.rub.slid(q, STICK_MIN) : t.rub.fall;
    else if (paper && S.liftN > 0) a = t.rub.up(S.liftN);
    else if (paper && S.near && q > 0) a = t.rub.no(q, PAPER_MIN);
    else if (!paper && S.near && q > 0) a = t.rub.near;
    else a = q > 0 ? t.rub.s1(q) : t.rub.s0;
    st(a);
  } else if (v === 'pair') {
    const P = S.pair, J = P.qL + P.qR, both = P.qL > 0 && P.qR > 0, any = J > 0, p = t.pair, deg = Math.round(Math.max(Math.abs(P.th[0]), Math.abs(P.th[1])) * 57.3);
    const rel = [both ? p.like : null, P.near && any ? p.opp : null].filter(Boolean).join(' · ') || p.none;
    lab.setReadout(`${fmtq(P.qL)} · ${fmtq(P.qR)}`, rel, p.swing(deg), '#f2b227'); lab.setGlow('rgba(242, 178, 39, .22)');
    st(P.last === 'touch' && !P.near ? p.sTouch : P.near && any ? p.sOpp : both ? p.sLike : any ? p.sOne : p.sNone);
  } else {
    const p = t.spark, r = (S.Q / S.d).toFixed(1), zapping = S.zapT > 0 && now() - S.zapT < 0.7;
    lab.setReadout(fmtq(S.Q), p.sub(Math.round(S.d)), p.pill(r), '#7fb6ff'); lab.setGlow('rgba(127, 182, 255, .24)');
    st(zapping ? p.zap : S.noSpark ? p[S.tgt] : S.Q > 0 ? p.s1(S.Q) : S.zapped && S.tgt === 'metal' && S.Q === 0 && now() - S.zapT < 6 ? p.zap : p.s0);
  }
}
render();
</script>
