  const F = t.fac, ans = S.facPick !== null, right = F.right;
  lab.setGlow('rgba(79, 174, 150, .24)');
  const A4 = sumSide(0, 5) / sumSide(0, 2), X4 = sumSide(1, 5) / sumSide(1, 2), R4 = ratio(5);
  // prediction: three options; the verdict appears after the tap, with numbers computed from the table
  const chips = F.opts.map((o, i) => `<button class="wt-opt${ans ? (i === right ? ' good' : i === S.facPick ? ' bad' : ' dim') : ''}" data-act="fopt" data-i="${i}"${ans ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const vd = ans ? F.verdict(S.facPick === right, x1(A4), x1(X4), x1(R4)) : null;
  $('wtFacPred').innerHTML = `<div class="wt-q">${esc(F.q)}</div><div class="wt-opts">${chips}</div>${ans ? `<div class="wt-verdict ${S.facPick === right ? 'good' : 'bad'}">${esc(vd[0])} ${esc(vd[1])}</div>` : ''}`;
  // year picker after the reveal
  $('wtYears').style.display = ans ? 'grid' : 'none';
  $('wtYears').innerHTML = ans ? YEARS.map((y, i) => `<button class="wt-opt${S.y === i ? ' on' : ''}" data-act="year" data-i="${i}">${y}</button>`).join('') : '';
  // legend (the countries; in "Take one away" they are switches)
  const pick = S.sec === 'drop';
  $('wtLeg').className = `wt-leg${pick ? ' pick' : ''}`;
  $('wtLeg').innerHTML = ans ? KEYS.map((k) => `<button class="wt-sw${pick && S.drop.has(k) ? ' off' : ''}" data-act="drop" data-k="${k}"${pick ? '' : ' tabindex="-1"'}><i style="background:${CCOL[k]}"></i>${esc(t.countries[k])}</button>`).join('') : '';
  // the secrets row appears after the prediction (it would give the answer away before)
  const open = secret.unlocked(), sc = (k, emo, id) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === id ? 'on' : ''}" data-act="sec" data-k="${id}">${open ? `${emo} ${esc(t.sec[id][0])}` : '🔒 ???'}</button>`;
  $('wtSecs').style.display = ans ? 'flex' : 'none';
  $('wtSecs').innerHTML = sc('scales', '⚖️', 'scales') + sc('drop', '➖', 'drop');
  $('wtFacFine').textContent = ans ? `${F.legend} ${F.fine}` : '';
  // readout, state card, facts
  const i = S.y ?? 5, drop = S.sec === 'drop' ? S.drop : null;
  if (!ans) {
    lab.setReadout('?', F.pre, '', '#4fae96');
    lab.setState({ emo: '🤔', title: F.q, lead: F.lead, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const A = sumSide(0, i, drop), X = sumSide(1, i, drop), r = ratio(i, drop);
  lab.setReadout(r === null ? '–' : `×${x1(r)}`, F.sub(fmt(A), fmt(X)), String(YEARS[i]), '#4fae96');
  const names = [...S.drop].map((k) => t.countries[k]).join(', ');
  if (S.sec === 'scales') lab.setState({ emo: '⚖️', title: F.st(YEARS[i], fmt(A), fmt(X), r === null ? null : x1(r))[0], lead: t.sc.lead, body: '', extra: '' });
  else if (S.sec === 'drop') lab.setState(S.drop.size
    ? { emo: '➖', title: t.dr.title(names), lead: t.dr.lead(names, YEARS[i], r === null ? null : x1(r)), body: t.dr.body, extra: '' }
    : { emo: '➖', title: t.secrets.b[0], lead: t.dr.none, body: t.dr.body, extra: '' });
  else {
    const st = F.st(YEARS[i], fmt(A), fmt(X), r === null ? null : x1(r));
    const parts = KEYS.filter((k) => PROD[k][i] > 0).map((k) => `${t.countries[k]} ${fmt(PROD[k][i])}`).join(' · ');
    lab.setState({ emo: '✈️', title: st[0], lead: st[1], body: parts, extra: `<div class="wt-fine">${esc(F.tap)}</div>` });
  }
  const pct = (k) => fmt(PROD[k][5]);
  lab.setFacts([
    { emo: '🇺🇸', text: lang === 'en' ? `In 1944 the USA built ${pct('us')} aircraft, more than Germany (${pct('de')}) and Japan (${pct('jp')}) together.`
      : lang === 'ru' ? `В 1944 году США построили ${pct('us')} самолётов — больше, чем Германия (${pct('de')}) и Япония (${pct('jp')}) вместе.`
      : `1944-ben az USA ${pct('us')} repülőgépet gyártott, többet, mint Németország (${pct('de')}) és Japán (${pct('jp')}) együtt.`, src: 'https://en.wikipedia.org/wiki/World_War_II_aircraft_production' },
    { emo: '📉', text: lang === 'en' ? 'In the table France’s output stops after 1940 and Italy’s after 1943; the page notes that they capitulated in those years.'
      : lang === 'ru' ? 'В таблице выпуск Франции заканчивается после 1940 года, а Италии — после 1943; страница отмечает, что они капитулировали в эти годы.'
      : 'A táblázatban Franciaország gyártása 1940 után, Olaszországé 1943 után megszakad; az oldal megjegyzi, hogy ezekben az években kapituláltak.', src: 'https://en.wikipedia.org/wiki/World_War_II_aircraft_production' },
    { emo: '🏭', text: lang === 'en' ? `Germany’s output rose every year to ${fmt(PROD.de[5])} in 1944, then fell to ${fmt(PROD.de[6])} in 1945.`
      : lang === 'ru' ? `Выпуск Германии рос каждый год до ${fmt(PROD.de[5])} в 1944 году, а в 1945 упал до ${fmt(PROD.de[6])}.`
      : `Németország gyártása évről évre nőtt, 1944-ben ${fmt(PROD.de[5])} volt, 1945-ben ${fmt(PROD.de[6])}-ra esett.`, src: 'https://en.wikipedia.org/wiki/World_War_II_aircraft_production' },
  ]);
}
function renderBat(t) {
  const B = t.bat, done = S.bl.filter(Boolean).length, all = done === 4;
  lab.setGlow('rgba(217, 164, 65, .24)');
  $('wtBatQ').textContent = B.q;
  const verdictOf = (i) => { const b = BATS[i], m = S.bm[i], dist = m < b.s ? b.s - m : m > b.e ? m - b.e : 0, n = Math.round(dist); return dist === 0 ? ['good', B.right] : dist <= TOL ? ['good', B.close(n)] : ['bad', B.far(n)]; };
  $('wtCards').innerHTML = B.list.map((c, i) => {
    const locked = S.bl[i], vd = locked ? verdictOf(i) : null;
    return `<button class="wt-card${S.sel === i ? ' sel' : ''}" style="--c:${BATS[i].col}" data-act="card" data-i="${i}"><b>${esc(c.name)}</b>${locked ? `<span class="wt-d">${esc(c.date)}</span>` : `<span class="wt-d">${esc(c.hint)}</span>`}${locked ? `<p>${esc(c.why)}</p><div class="wt-r ${vd[0]}">${esc(vd[1])}</div>` : ''}</button>`;
  }).join('');
  $('wtPlace').textContent = all ? B.again : `${B.place}: ${B.list[S.sel].name}`;
  $('wtPlace').disabled = !all && (S.bm[S.sel] === null || S.bl[S.sel]);
  $('wtBatFine').textContent = `${B.anchors.join(' · ')}. ${B.fine}`;
  const good = S.bl.filter((l, i) => l && (() => { const b = BATS[i], m = S.bm[i]; return (m < b.s ? b.s - m : m > b.e ? m - b.e : 0) <= TOL; })()).length;
  lab.setReadout(all ? `${good}/4` : `${done}/4`, all ? B.sum(good) : B.ready, '', '#d9a441');
  if (!done) lab.setState({ emo: '🤔', title: B.q, lead: B.lead, body: '', extra: '' });
  else if (all) lab.setState({ emo: '🏆', title: B.sum(good), lead: B.sumLead, body: '', extra: '' });
  else {
    const last = S.bl.lastIndexOf(true), c = B.list[last];
    lab.setState({ emo: '⚔️', title: `${c.name} · ${c.date}`, lead: c.why, body: verdictOf(last)[1], extra: '' });
  }
  lab.setFacts(B.facts.filter((f, i) => S.bl[i]));
}
function renderMap(t) {
  const M = t.map, ans = S.mapPick !== null, i = S.snap;
  lab.setGlow('rgba(224, 122, 69, .22)');
  const chips = MAPYEARS.map((y) => `<button class="wt-opt${ans ? (y === PEAKYEAR ? ' good' : y === S.mapPick ? ' bad' : ' dim') : ''}" data-act="mopt" data-y="${y}"${ans ? ' disabled' : ''}>${y}</button>`).join('');
  const vd = ans ? M.verdict(S.mapPick === PEAKYEAR, monthLabel(mo(SNAP[PEAK][0], SNAP[PEAK][1])), SRCYEAR) : null;
  $('wtMapPred').innerHTML = ans
    ? `<div class="wt-verdict ${S.mapPick === PEAKYEAR ? 'good' : 'bad'}" style="margin:0 0 10px">${esc(vd[0])} ${esc(vd[1])}</div>`
    : `<div class="wt-q">${esc(M.q)}</div><div class="wt-years">${chips}</div>`;
  // after the answer: one column per snapshot, taller = more dots on the Axis side
  const mx = Math.max(...CNT);
  $('wtDates').style.display = ans ? 'grid' : 'none';
  $('wtDates').innerHTML = ans ? SNAP.map((s, k) => `<button class="wt-bar${k === i ? ' on' : ''}${k === PEAK ? ' peak' : ''}${s[0] === S.mapPick && S.mapPick !== PEAKYEAR ? ' guess' : ''}" data-act="snap" data-i="${k}" aria-label="${esc(monthLabel(mo(s[0], s[1])))}"><i style="height:${Math.round(CNT[k] / mx * 46) + 2}px"></i><span>${esc(lang === 'hu' ? MON.hu[s[1] - 1] : MON[lang][s[1] - 1])}</span><b>${s[0]}</b></button>`).join('') : '';
  $('wtSlider').disabled = !ans; $('wtSlider').value = String(i);
  $('wtSlider').parentElement.style.display = ans ? 'block' : 'none';
  $('wtMapLeg').className = 'wt-leg';
  $('wtMapLeg').innerHTML = ['A', 'W', 'N'].map((k, j) => `<span class="wt-sw dot"><i style="background:${MCOL[k]}"></i>${esc(M.legend[j])}</span>`).join('');
  $('wtMapFine').textContent = ans ? `${M.tip} ${M.fine}` : M.fine;
  if (!ans) {
    lab.setReadout('?', '', '', '#e07a45');
    lab.setState({ emo: '🤔', title: M.q, lead: M.lead, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const [val, sub] = M.val(CNT[i], NDOT);
  lab.setReadout(val, sub, monthLabel(mo(SNAP[i][0], SNAP[i][1])), '#e07a45');
  lab.setState({ emo: i === PEAK ? '🌍' : '🗺️', title: monthLabel(mo(SNAP[i][0], SNAP[i][1])), lead: M.ev[i], body: '', extra: '' });
  lab.setFacts(M.facts);
}
render();
</script>
