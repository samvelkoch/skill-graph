  poly([P(wx, 0, z1), P(wx, wy, z1), P(wx, wy, z0), P(wx, 0, z0)], cols[2]);
  poly([P(0, 0, z1), P(wx, 0, z1), P(wx, wy, z1), P(0, wy, z1)], cols[0]);

}
function drawTanks(c, w, h, e, pour, time) {

  const kz = (0.4 * h) / (MEAN.bai / 1000), EE = ease(cl(e)); // px per km of depth (stretched)
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#12203f'); bg.addColorStop(1, '#0a1124'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const floor = c.createRadialGradient(w / 2, yb, 10, w / 2, yb, w * 0.7); floor.addColorStop(0, 'rgba(90,140,200,.2)'); floor.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = floor; c.fillRect(0, 0, w, h);
  const items = [
    { s: sB, ox: pad + 0.866 * sB * k, cols: ['rgba(120,214,240,.95)', 'rgba(46,146,196,.95)', 'rgba(30,106,152,.95)'], mean: MEAN.bai / 1000, key: 'bai', area: AREA.bai, vol: VOL.bai },
    { s: sS, ox: w - pad - 0.866 * sS * k, cols: ['rgba(165,185,247,.95)', 'rgba(92,121,212,.95)', 'rgba(68,96,176,.95)'], mean: MEAN.sup / 1000, key: 'sup', area: AREA.sup, vol: VOL.sup },
  ];
  const poured = ['rgba(120,214,240,.95)', 'rgba(46,146,196,.95)', 'rgba(30,106,152,.95)'];
  for (const it of items) {
    const oy = yb - it.s * k, P = (x, y, z) => [it.ox + (x - y) * 0.866 * k, oy + (x + y) * 0.5 * k - z];
    // soft shadow
    c.beginPath(); [[0, 0], [it.s, 0], [it.s, it.s], [0, it.s]].forEach(([x, y], i) => { const q = P(x * 1.05 - it.s * 0.025, y * 1.05 - it.s * 0.025, -3); i ? c.lineTo(q[0] + 3, q[1] + 3) : c.moveTo(q[0] + 3, q[1] + 3); });

      if (EE > 0.95) glass(P, c, it.s, it.s, full);
    } else {
      slab(P, c, it.s, it.s, 0, base, it.cols);
      if (pour > 0.001) { const add = pour * (VOL.bai / AREA.sup) * kz; slab(P, c, it.s, it.s, base, base + add, poured); glass(P, c, it.s, it.s, base + (VOL.bai / AREA.sup) * kz); }
    }
    const lx = clamp(it.ox, 70, w - 70), la = 1;
    const lines = [T_.lake[it.key], `${T_.w.area}: ${fmt(it.area)} ${T_.u.km2}`];
    if (EE > 0.9) lines.push(`${T_.w.mean}: ${fmt(it.mean * 1000)} ${T_.u.m}`, `${T_.w.vol}: ${fmt(it.vol)} ${T_.u.km3}`);
    pill(c, lines.join('\n'), lx, yb + 12 + (lines.length * 14.5 + 7) / 2, { a: la, color: it.key === 'bai' ? '#bfe9ff' : '#cfd8ff' });
  }
}

// --- drawing: the winter secret --------------------------------------------------------------------------------
function drawIce(c, w, h, time) {
  const T_ = T[lang], y0 = 70, kS = (h - y0 - 24) / 45; // px per metre, a 45 m window
  const sky = c.createLinearGradient(0, 0, 0, y0); sky.addColorStop(0, '#16264a'); sky.addColorStop(1, '#6d8fb8'); c.fillStyle = sky; c.fillRect(0, 0, w, y0);
  c.beginPath(); c.moveTo(0, y0); for (let x = 0; x <= w; x += 8) c.lineTo(x, y0 - 14 - 12 * Math.sin(x * 0.03) - 8 * Math.sin(x * 0.081 + 1)); c.lineTo(w, y0); c.closePath(); c.fillStyle = '#4a5f86'; c.fill();
  const wy = y0 + kS, wg = c.createLinearGradient(0, wy, 0, h); wg.addColorStop(0, '#5fc4ea'); wg.addColorStop(0.35, '#1c6fa8'); wg.addColorStop(1, '#061c3a'); c.fillStyle = wg; c.fillRect(0, wy, w, h - wy);
  // light rays
  c.save(); c.globalAlpha = 0.12; c.fillStyle = '#e8fbff';
  for (let i = 0; i < 5; i++) { const x = w * (0.12 + i * 0.2) + Math.sin(time * 0.4 + i) * 6; c.beginPath(); c.moveTo(x, wy); c.lineTo(x + 26, wy); c.lineTo(x + 70, y0 + 38 * kS); c.lineTo(x + 30, y0 + 38 * kS); c.closePath(); c.fill(); }
  c.restore();
  // fish
  [[8, 0.35, 0], [18, 0.5, 90], [27, 0.28, 200]].forEach(([dm, sp, off], i) => {
    const x = ((time * 14 * sp * 3 + off) % (w + 80)) - 40, y = y0 + dm * kS + Math.sin(time + i) * 3;
    c.save(); c.translate(x, y); c.fillStyle = '#d9f1ff';
    c.beginPath(); c.moveTo(11, 0); c.quadraticCurveTo(2, -6, -8, -1); c.lineTo(-14, -6); c.lineTo(-13, 6); c.lineTo(-8, 1); c.quadraticCurveTo(2, 6, 11, 0); c.fill();
    c.fillStyle = '#10243f'; c.beginPath(); c.arc(7, -1, 1.2, 0, Math.PI * 2); c.fill(); c.restore();
  });
  // fog beyond what you can see: from 30 m to 40 m
  const fg = c.createLinearGradient(0, y0 + 30 * kS, 0, y0 + 40 * kS); fg.addColorStop(0, 'rgba(6,28,58,0)'); fg.addColorStop(1, 'rgba(6,28,58,.92)'); c.fillStyle = fg; c.fillRect(0, y0 + 30 * kS, w, 10 * kS);
  c.fillStyle = 'rgba(6,28,58,.92)'; c.fillRect(0, y0 + 40 * kS, w, h);
  // the ice: about 1 m (0.5–1.4 m)
  const ig = c.createLinearGradient(0, y0, 0, wy); ig.addColorStop(0, '#f4fbff'); ig.addColorStop(1, '#a9ddf2'); c.fillStyle = ig; c.fillRect(0, y0, w, kS);
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, y0 + 0.5); c.lineTo(w, y0 + 0.5); c.stroke();
  c.strokeStyle = 'rgba(70,130,170,.35)'; c.beginPath(); c.moveTo(w * 0.3, y0); c.lineTo(w * 0.33, y0 + kS * 0.6); c.lineTo(w * 0.31, y0 + kS); c.moveTo(w * 0.78, y0); c.lineTo(w * 0.8, y0 + kS * 0.7); c.stroke();
  // a person for scale (about 1.75 m)
  const px = w * 0.5, ph = 1.75 * kS; c.fillStyle = '#e8924f'; c.strokeStyle = '#e8924f'; c.lineCap = 'round'; c.lineWidth = Math.max(2, 0.3 * kS);
  c.beginPath(); c.moveTo(px, y0 - ph * 0.15); c.lineTo(px, y0 - ph * 0.7); c.stroke(); c.beginPath(); c.arc(px, y0 - ph * 0.88, Math.max(1.6, ph * 0.12), 0, Math.PI * 2); c.fill();
  // ruler
  c.strokeStyle = 'rgba(255,255,255,.4)'; c.fillStyle = '#d9e6ff'; c.lineWidth = 1; c.font = '700 12px Nunito, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.beginPath(); c.moveTo(10, y0); c.lineTo(10, y0 + 40 * kS); for (let m = 0; m <= 40; m += 10) { c.moveTo(10, y0 + m * kS); c.lineTo(16, y0 + m * kS); } c.stroke();
  for (let m = 10; m <= 40; m += 10) c.fillText(`${m} ${T_.u.m}`, 20, y0 + m * kS);
  // brackets and names
  c.strokeStyle = '#ffd37a'; c.lineWidth = 2; c.beginPath(); c.moveTo(w - 16, wy); c.lineTo(w - 16, y0 + 40 * kS); c.moveTo(w - 22, wy); c.lineTo(w - 10, wy); c.moveTo(w - 22, y0 + 40 * kS); c.lineTo(w - 10, y0 + 40 * kS); c.stroke();
  pill(c, T_.sec.iceV, w - 62, y0 + 20 * kS, { color: '#ffd37a' });
  c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(w * 0.22, y0 - 34); c.lineTo(w * 0.22, y0 + kS * 0.5); c.stroke();
  pill(c, T_.sec.iceI, w * 0.22, y0 - 44, { color: '#EDEFF7' });
}

// --- the single canvas loop ------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  const v = lab.view, gated = v !== 'depth' && S.g1 === null;
  S.t1 = approach(S.t1, S.g1 !== null ? 1 : 0, dt / 2.4);
  S.t3 = approach(S.t3, S.g3 !== null ? 1 : 0, dt / 1.4);
  S.pv += (S.pt - S.pv) * Math.min(1, dt * 4.5); S.pour += (S.pourT - S.pour) * Math.min(1, dt * 5);
  c.save(); c.beginPath(); c.roundRect(0, 0, w, h, 18); c.clip();
  if (S.sec === 'ice') drawIce(c, w, h, time);
  else if (S.sec === 'rivers') { frame(c, w, h, 1); drawMap(c, w / 2, h * 0.5 - 6, mapSize(w, h), { rivers: true, time, label: 1 }); }
  else if (v === 'depth') drawDepth(c, w, h, time);
  else if (gated) { frame(c, w, h, 1); drawMap(c, w / 2, h * 0.5 - 6, mapSize(w, h), { label: 1, scale: 1 }); }
  else if (v === 'rift') drawRift(c, w, h, S.pv, time);
  else drawTanks(c, w, h, S.t3, S.pour, time);
  c.restore();
});

// --- events ----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('qOpts').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const i = +b.dataset.i, v = lab.view, ok = v === 'depth' ? i === 1 : v === 'rift' ? i === 0 : i === 1;
  if (v === 'depth') S.g1 = i; else if (v === 'rift') { S.g2 = i; S.pt = 0; S.slR = 0; S.movedR = false; } else S.g3 = i;
  (ok ? sfx.good : sfx.bad)(); render(); showStage();
});
$('sl').addEventListener('input', () => {
  const x = +$('sl').value / 100;
  if (lab.view === 'rift') { S.slR = x; S.pt = x; S.movedR = true; } else { S.slW = x; S.pourT = x; S.movedW = x > 0.01; }
  sfx.tick(); render();
});
$('gateGo').addEventListener('click', () => $('views').querySelector('[data-view=depth]')?.click());
$('secChips').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; sfx.click(); render();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'depth' || S.g1 === null || S.sec || !S.cols.length) return;
  const x = ev.clientX - $('cv').getBoundingClientRect().left, hit = S.cols.find((q) => x >= q.x0 && x < q.x1);
  if (!hit) return;
  S.sel = hit.k === 'bai' || S.sel === hit.k ? null : hit.k; sfx.tick(); render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------
function render() {
  const t = T[lang], v = lab.view, gated = v !== 'depth' && S.g1 === null, g = { depth: S.g1, rift: S.g2, water: S.g3 }[v], asking = !gated && g === null;
  lab.setGlow(v === 'depth' ? 'rgba(60, 130, 190, .3)' : v === 'rift' ? 'rgba(200, 150, 90, .24)' : 'rgba(80, 160, 210, .28)');
  // chips for the two secrets
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}" type="button">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('ice', '🧊') + sc('rivers', '🏞️');
  // question or gate or slider
  const q = { depth: t.d, rift: t.r, water: t.w }[v];
  $('qBox').hidden = !asking; $('gateBox').hidden = !gated;
  $('qText').textContent = q.q; $('qOpts').innerHTML = q.opts.map((o, i) => `<button type="button" data-i="${i}">${esc(o)}</button>`).join('');
  $('gateTxt').textContent = t.gate.l; $('gateGo').textContent = t.gate.go;
  const sl = !gated && g !== null && v !== 'depth';
  $('slBox').hidden = !sl;
  if (sl) { $('slLbl').textContent = v === 'rift' ? t.r.slider : t.w.slider; const val = Math.round((v === 'rift' ? S.slR : S.slW) * 100); if (+$('sl').value !== val) $('sl').value = val; $('slNote').textContent = v === 'rift' ? t.r.illus : t.w.note; }
  $('hint').hidden = !(v === 'depth' && S.g1 !== null); $('hint').textContent = t.d.hint;
  const credit = `<div class="fine">${esc(t.credit)}</div>`;
  let st, ro, facts = [];
  if (S.sec === 'ice') { st = { emo: '🧊', title: t.sec.iceT, lead: t.sec.iceL, body: '', extra: '' }; ro = [`30–40 ${t.u.m}`, t.sec.iceI, '']; }
  else if (S.sec === 'rivers') { st = { emo: '🏞️', title: t.sec.riversT, lead: t.sec.riversL, body: '', extra: credit }; ro = ['330 → 1', '', '']; }
  else if (gated) { st = { emo: '🔒', title: t.gate.t, lead: t.gate.l, body: '', extra: credit }; ro = ['?', q.sub, '']; }
  else if (v === 'depth') {
    if (S.g1 === null) { st = { emo: '🤔', title: t.d.preT, lead: t.d.preL, body: '', extra: credit }; ro = ['?', t.d.sub, '']; }
    else {
      const sel = COLS.find((k) => k.k === S.sel), n = Math.floor(D.bai / D.ost);
      if (sel) {
        const r = Math.round(D.bai / sel.d), name = sel.tower ? t.tower[sel.k].replace('\n', ' ') : t.lake[sel.k], val = `${sel.k === 'lad' ? '≈ ' : ''}${fmt(sel.d, sel.k === 'bal' ? 1 : 0)} ${t.u.m}`;
        st = { emo: sel.tower ? '🗼' : '🌊', title: `${name}: ${val}`, lead: sel.tower ? t.d.towerL(r) : t.d.lakeL(r), body: '', extra: `<div class="fine">${esc(t.d.note)}</div>` };
        ro = [val, name, `${t.lake.bai} ${r}×`];
      } else {
        const k = S.g1 === 0 ? Math.round(D.bai / 160) : Math.round(16000 / D.bai);
        st = { emo: S.g1 === 1 ? '✅' : '🤔', title: S.g1 === 1 ? t.right : t.wrong, lead: t.d.lead(D.bai) + (S.g1 === 1 ? '' : ' ' + (S.g1 === 0 ? t.d.more(k) : t.d.less(k))), body: t.d.stack(n, D.ost), extra: `<div class="fine">${esc(t.d.note)}</div>${credit}` };
        ro = [`${fmt(D.bai)} ${t.u.m}`, t.d.sub, ''];
      }
      facts = t.facts.d.map((f) => ({ emo: f.emo, text: f.text(Math.round((D.bai - ELEV) / 10) * 10), src: f.src }));
    }
  } else if (v === 'rift') {
    if (S.g2 === null) { st = { emo: '🤔', title: t.r.preT, lead: t.r.preL, body: '', extra: '' }; ro = ['?', t.r.sub, '']; }
    else {
      if (!S.movedR) st = { emo: S.g2 === 0 ? '✅' : '🤔', title: S.g2 === 0 ? t.right : t.wrong, lead: S.g2 === 0 ? t.r.lead : t.r.leadW, body: t.r.body, extra: '' };
      else { const x = S.slR, s = x < 0.05 ? t.r.st[0] : x < 0.6 ? t.r.st[1] : t.r.st[2]; st = { emo: x < 0.05 ? '🪨' : x < 0.6 ? '⛏️' : '🏞️', title: s[0], lead: s[1], body: '', extra: '' }; }
      ro = [`${RATE[0]}–${RATE[1]} ${lang === 'ru' ? 'мм' : 'mm'}`, t.r.rate, t.r.per100(RATE[0] * 10, RATE[1] * 10)];
      facts = t.facts.r.map((f) => ({ emo: f.emo, text: f.text(), src: f.src }));
    }
  } else {
    const nerpa = `<div class="bk-nerpa"><div class="e">🦭</div><div><b>${esc(t.w.n.h)}</b><p>${esc(t.w.n.t)}</p></div></div>`;
    if (S.g3 === null) { st = { emo: '🤔', title: t.w.preT, lead: t.w.preL(AREA.bai, AREA.sup), body: '', extra: nerpa }; ro = ['?', t.w.sub, '']; }
    else {
      const r = VOL.bai / VOL.sup, m = Math.round(RISE);
      if (!S.movedW) st = { emo: S.g3 === 1 ? '✅' : '🤔', title: S.g3 === 1 ? t.right : t.wrong, lead: t.w.lead(VOL.bai, VOL.sup, r), body: t.w.body(MEAN.bai, MEAN.sup), extra: nerpa };
      else st = { emo: '💧', title: t.w.pourT, lead: t.w.pour(m), body: '', extra: nerpa };
      ro = S.pourT > 0.01 ? [`${fmt(Math.round(S.pourT * RISE))} ${t.u.m}`, t.w.slider, ''] : [`${fmt(VOL.bai)} ${t.u.km3}`, t.w.sub, `${fmt(VOL.sup)} ${t.u.km3} · ${t.lake.sup}`];
      facts = t.facts.w.map((f) => ({ emo: f.emo, text: f.text(), src: f.src }));
    }
  }
  lab.setState(st); lab.setReadout(ro[0], ro[1], ro[2], v === 'rift' ? '#e0b070' : '#4ea8ff'); lab.setFacts(S.sec ? [] : facts);
}
render();
</script>
