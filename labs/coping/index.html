const W = 360, H = 420;
let K = 1;
const ease = (x) => { x = clamp(x, 0, 1); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

const smooth = (cur, target, dt, rate = 5) => cur + (target - cur) * (1 - Math.exp(-dt * rate));
const rr = (c, x, y, w, h, r) => { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
const ell = (c, x, y, rx, ry) => { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, Math.PI * 2); };
const fnt = (n, wgt = 800) => `${wgt} ${Math.max(n, 12.5 / K)}px Nunito, sans-serif`;
const wrap = (c, text, maxW) => {
  const lines = []; let cur = '';
  for (const w of String(text).split(' ')) { const tr = cur ? `${cur} ${w}` : w; if (c.measureText(tr).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tr; }
  if (cur) lines.push(cur); return lines;
};
function pill(c, text, cx, cy, maxW, size = 13, col = '#fff') {
  c.save(); c.font = fnt(size);
  const f = Math.max(size, 12.5 / K), lines = wrap(c, text, maxW - 20), lh = f * 1.25;
  const w = Math.min(maxW, Math.max(...lines.map((l) => c.measureText(l).width)) + 22), h = lines.length * lh + 12;
  const x = clamp(cx - w / 2, 4, W - w - 4), y = clamp(cy - h / 2, 4, H - h - 4);
  c.fillStyle = 'rgba(10,14,28,.82)'; rr(c, x, y, w, h, 12); c.fill();
  c.fillStyle = col; c.textAlign = 'center'; c.textBaseline = 'middle';
  lines.forEach((l, i) => c.fillText(l, x + w / 2, y + 6 + lh * (i + .5)));
  c.restore(); return { x, y, w, h };
}

function sky(c, w, h, ground) {

}

function kid(c, x, y, r, mood, time, fake = false) {
  y += Math.sin(time * 2) * 1.5;
  c.save();

  const hg = c.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r * 1.05); hg.addColorStop(0, '#ffe3c4'); hg.addColorStop(1, '#eeb27e');

  c.fillStyle = '#6a4330'; c.beginPath(); c.arc(x, y, r * 1.03, Math.PI, Math.PI * 2);
  c.quadraticCurveTo(x + r * .35, y - r * .5, x, y - r * .48); c.quadraticCurveTo(x - r * .5, y - r * .42, x - r * 1.03, y); c.fill();
  c.fillStyle = 'rgba(240,130,130,.35)'; ell(c, x - r * .6, y + r * .32, r * .17, r * .1); c.fill(); ell(c, x + r * .6, y + r * .32, r * .17, r * .1); c.fill();
  const blink = (time % 4) < .12;
  for (const s of [-1, 1]) {
    const ex = x + s * r * .36, ey = y + r * .04;
    if (blink) { c.strokeStyle = '#2b2118'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(ex - r * .12, ey); c.lineTo(ex + r * .12, ey); c.stroke(); }
    else {

  c.beginPath(); c.moveTo(x - r * .26, my); c.quadraticCurveTo(x, my + m * r * .34, x + r * .26, my); c.stroke();

  c.restore();
}

function sun(c, x, y, r, time, a) {
  if (a <= .01) return;
  c.save(); c.globalAlpha = a; c.translate(x, y);
  c.strokeStyle = '#f6d36a'; c.lineWidth = 3; c.lineCap = 'round';
  for (let i = 0; i < 10; i++) { const an = i / 10 * Math.PI * 2 + time * .3; c.beginPath(); c.moveTo(Math.cos(an) * r * 1.25, Math.sin(an) * r * 1.25); c.lineTo(Math.cos(an) * r * 1.65, Math.sin(an) * r * 1.65); c.stroke(); }
  const g = c.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r); g.addColorStop(0, '#fff3b0'); g.addColorStop(1, '#f2b73c');
  c.fillStyle = g; c.strokeStyle = '#c98a1c'; c.lineWidth = 1.5; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill(); c.stroke();
  c.restore();
}

function cloud(c, x, y, s, time, rainTo, rainAmt = 1) {
  if (s <= .03) return;
  const sc = .4 + .6 * s, puffs = [[-48, 14, 30], [-18, -8, 40], [24, -4, 38], [56, 14, 28], [4, 16, 36]];
  c.save(); c.translate(x, y); c.scale(sc, sc);
  c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 14; c.shadowOffsetY = 7;
  c.strokeStyle = '#23274a'; c.lineWidth = 4;
  for (const [px, py, pr] of puffs) { c.beginPath(); c.arc(px, py, pr, 0, Math.PI * 2); c.stroke(); }
  c.shadowColor = 'transparent';
  for (const [px, py, pr] of puffs) {
    const g = c.createRadialGradient(px - pr * .35, py - pr * .4, pr * .1, px, py, pr);
    g.addColorStop(0, '#7b82a8'); g.addColorStop(1, '#3a3f66'); c.fillStyle = g; c.beginPath(); c.arc(px, py, pr, 0, Math.PI * 2); c.fill();
  }
  c.restore();
  const n = Math.round((3 + 7 * s) * rainAmt), y0 = y + 38 * sc, len = Math.max(10, rainTo - y0);
  c.save(); c.strokeStyle = 'rgba(150,185,240,.85)'; c.lineWidth = 2; c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const ph = ((time * .8 + i * .37) % 1), xx = x + (-48 + (i + .5) * (100 / Math.max(1, n))) * sc * (i % 2 ? .95 : 1.05), yy = y0 + ph * len;
    c.globalAlpha = Math.sin(ph * Math.PI) * .9; c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx - 2, yy + 9); c.stroke();
  }
  c.restore();
}

$('ctrlBody').addEventListener('click', (ev) => {

  else if (act === 'rebreak') { S.kinFill = [0, 0, 0, 0, 0]; S.kin = 0; sfx.click(); }

    store.set('coping:box', S.box); sfx.tick();

  } else if (act === 'anext') { A.ti++; sfx.click(); }

  else if (act === 'pred') { C.pred = k; sfx.click(); C.moods = [2]; C.day = 0; S.d.line = 0; }

});

function applyTool(sz) {
  const B = S.b, P = bData(), tool = B.pending; if (!tool) return;
  const ti = B.ti, e = eff(ti, tool), cl = cls(e), prev = P.size;
  const bounced = TR[ti].B.includes(tool) && P.used.every((u) => TR[ti].B.includes(u));
  B.busy = true; B.pending = null; B.fly = { tool, t0: now() };
  P.used.push(tool); sfx.snap();
  const after = Math.max(.05, prev - e);
  later(900, () => { P.size = after; sfx.tick(); render(); });
  let end = 1300;
  if (bounced) {
    later(1500, () => { B.morn = now(); });
    later(2300, () => { P.size = Math.min(1, prev - e * .2); render(); });
    end = 3300;
  }
  later(end, () => {
    P.last = { tool, guess: sz, cls: cl, ok: sz === cl, bounced };
    B.busy = false;
    if (P.used.length >= 2) P.done = true;
    (P.last.ok ? sfx.good : sfx.bad)();
    render(); showStage();
  });
}

function doAction(id) {
  const C = S.c, prev = C.moods[C.moods.length - 1], g = GAIN[id];
  const good = g >= 1.4;
  const heal = id === 'pretend' ? 0 : .15;
  const m = clamp(prev + g + heal + (good || id === 'breathe' ? C.streak * .2 : 0), 0, 9);
  C.streak = good ? C.streak + 1 : id === 'breathe' ? C.streak : 0;
  C.moods.push(m); C.acts.push(id); C.day++;
  C.fxKey = id === 'pretend' ? 'mask' : id === 'nothing' ? 'flat' : good ? 'good' : 'small';
  (good ? sfx.good : id === 'pretend' || id === 'nothing' ? sfx.bad : sfx.tick)(); showStage();
}

    lab.setReadout('?', '', '', '#5fd0b0');
    lab.setState({ emo: '📈', title: u.bStartT, lead: u.bStartL, body: '', extra: ex });
    return `<div class="cp-q">${esc(u.bPredQ)}</div><div class="cp-row c2">${['quick', 'long'].map((k) => btn('pred', k, esc(u.bPredA[k]))).join('')}</div>`;
  }
  const m = C.moods[C.moods.length - 1];
  lab.setReadout(m.toFixed(1).replace('.', lang === 'en' ? '.' : ','), '/ 10', d < 7 ? u.bDayT(d + 1) : '', '#5fd0b0');
  const fx = C.fxKey ? u.fx[C.fxKey] : '';
  if (d >= 7) {
    const shape = weekShape(), same = shape === C.pred;
    lab.setState({ emo: same ? '✅' : '🤔', title: same ? u.rightQ : u.notq, lead: `${shape === 'quick' ? u.shapeQ : u.shapeL} ${same ? u.matched : u.differs}`, body: u.playTwice, extra: ex });
    return `<div class="cp-row c1">${btn('cagain', undefined, u.again2, 'go')}</div>`;
  }
  lab.setState({ emo: C.fxKey ? '💭' : '📈', title: d ? u.bDayT(d + 1) : u.bDayT(1), lead: fx || u.bDayL, body: fx ? u.bDayL : '', extra: ex });
  return `<div class="cp-q">${esc(u.day(d + 1))}</div><div class="cp-row c1">${DAYS[d].map((id) => btn('do', id, esc(t.acts[id]), 'left')).join('')}</div>`;
}

render();
</script>
</body>
</html>
