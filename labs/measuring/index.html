  const bg = c.createRadialGradient(tx - 4, bulbY - 4, 1, tx, bulbY, br); bg.addColorStop(0, '#ff8a7c'); bg.addColorStop(.5, '#e5301f'); bg.addColorStop(1, '#9d140a');
  circ(c, tx, bulbY, br); c.fillStyle = bg; c.fill(); c.strokeStyle = 'rgba(100,110,125,.6)'; c.lineWidth = 1.2; c.stroke();
  circ(c, tx - br * 0.3, bulbY - br * 0.3, br * 0.22); c.fillStyle = 'rgba(255,255,255,.7)'; c.fill();
  c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(tx - 4.2, yHigh - 10, 1.6, bulbY - yHigh - br);
  // front of the water (the thermometer is seen through it), ice, steam
  c.save(); cup(); c.clip(); c.fillStyle = wc; c.globalAlpha = 0.3; c.fillRect(cupL - 4, waterY, cupW + 8, cupBot - waterY + 4); c.restore();
  const sw = (cupW / 2 - sideAt(waterY)), sy = 8;
  c.beginPath(); c.ellipse(tx, waterY, sw, sy, 0, 0, Math.PI * 2); c.fillStyle = mixHex(wcHex, '#ffffff', 0.45); c.globalAlpha = 0.85; c.fill(); c.globalAlpha = 1; c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.2; c.stroke();
  if (v <= 2) for (const [dx, dy, s0] of [[-0.55, 0.1, 24], [0.5, -0.05, 20], [0.25, 0.3, 17]]) {
    const ix = tx + dx * sw, iy = waterY + dy * sy - 6 + Math.sin(t * 1.5 + dx * 5) * 1.5;
    c.save(); c.translate(ix, iy); c.rotate(dx * 0.5); const ig = c.createLinearGradient(-s0 / 2, -s0 / 2, s0 / 2, s0 / 2); ig.addColorStop(0, 'rgba(255,255,255,.95)'); ig.addColorStop(1, 'rgba(170,215,245,.85)');
    rr(c, -s0 / 2, -s0 / 2, s0, s0 * 0.85, 5); c.fillStyle = ig; c.fill(); c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 1.2; c.stroke(); c.restore();
  }

  c.beginPath(); c.ellipse(tx, rimY, cupW / 2, 9, 0, 0, Math.PI * 2); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.4)'; rr(c, cupL + 12, rimY + 18, 5, (cupBot - rimY) * 0.62, 2.5); c.fill();
  // magnifier after the reveal

    const z = ease(th.ct / 0.5), R0 = Math.min(72, w * 0.19), r = R0 * z, bx = w - R0 - 8, by = clamp(yv, R0 + 8, h - R0 - 8);
    c.save(); c.setLineDash([3, 4]); c.beginPath(); c.moveTo(tx + 8, yv); c.lineTo(bx - r, by); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.5; c.stroke(); c.restore();

    c.fillStyle = '#e5301f'; c.fillRect(tub - 3, by, 6, r);

      if (ten) { c.font = `900 13px ${FONT}`; c.textAlign = 'right'; c.fillStyle = '#3a2a1c'; c.fillText(String(d), tub - 28, yy); }

      rr(c, tub + 12, yy - 8, tw, 16, 8); c.fillStyle = last ? '#16a867' : 'rgba(40,40,60,.85)'; c.fill();

}

// --- the secret experiments ----------------------------------------------------------------------------------
const KIDS = [{ skin: '#f3cfa8', hair: '#5a3a22', shirt: '#5b8def', st: 0 }, { skin: '#d9a273', hair: '#2a1c14', shirt: '#e96f6f', st: 1 }, { skin: '#f6d9bd', hair: '#d89a3b', shirt: '#59b98c', st: 2 }];
function drawKid(c, x, y, s, k) {
  c.save();
  const sg = c.createLinearGradient(0, y + s, 0, y + s * 2.5); sg.addColorStop(0, mixHex(k.shirt, '#ffffff', .25)); sg.addColorStop(1, mixHex(k.shirt, '#000000', .2));

  const hg = c.createRadialGradient(x - s * 0.35, y - s * 0.4, s * 0.1, x, y, s * 1.1); hg.addColorStop(0, mixHex(k.skin, '#ffffff', .35)); hg.addColorStop(1, k.skin);
  if (k.st === 1) { circ(c, x - s * 1.05, y - s * 0.3, s * 0.38); c.fillStyle = k.hair; c.fill(); circ(c, x + s * 1.05, y - s * 0.3, s * 0.38); c.fill(); }
  circ(c, x, y, s); c.fillStyle = hg; c.fill(); c.strokeStyle = 'rgba(80,45,20,.35)'; c.lineWidth = 1.2; c.stroke();
  c.beginPath(); c.arc(x, y, s * 1.03, Math.PI * 1.04, Math.PI * 1.96); c.quadraticCurveTo(x + s * (k.st === 2 ? 0.2 : 0.5), y - s * (k.st === 2 ? 0.1 : 0.45), x - s * 0.95, y - s * 0.28); c.closePath(); c.fillStyle = k.hair; c.fill();
  for (const dx of [-0.36, 0.36]) {
    c.beginPath(); c.ellipse(x + dx * s, y + s * 0.1, s * 0.11, s * 0.15, 0, 0, Math.PI * 2); c.fillStyle = '#2b2230'; c.fill();
    circ(c, x + dx * s - s * 0.035, y + s * 0.05, s * 0.04); c.fillStyle = '#fff'; c.fill();
    circ(c, x + dx * s * 1.55, y + s * 0.38, s * 0.15); c.fillStyle = 'rgba(240,110,110,.3)'; c.fill();
  }
  c.beginPath(); c.arc(x, y + s * 0.32, s * 0.28, 0.15 * Math.PI, 0.85 * Math.PI); c.strokeStyle = '#7a3b2a'; c.lineWidth = 2; c.lineCap = 'round'; c.stroke();
  c.restore();
}
function tapCard(i) {
  const s = S.s3; if (s.found) return;
  if (s.v[i] === 78) { s.found = true; sfx.good(); } else { s.flash = 0.45; s.tapped = i; sfx.bad(); }
  render();
}
function drawThreeScene(c, w, h, dt, t) {
  const s = S.s3, tt = T[lang];
  s.fix = approach(s.fix, s.found ? 1 : 0, dt / 1.5); s.flash = Math.max(0, s.flash - dt);
  const bx = 12, bw = w - 24, by = Math.max(14, h * 0.05), bh = clamp(h * 0.075, 26, 40);
  c.save(); c.shadowColor = 'rgba(60,35,10,.4)'; c.shadowBlur = 10; c.shadowOffsetY = 5;
  const dg = c.createLinearGradient(0, by, 0, by + bh); dg.addColorStop(0, '#a8743f'); dg.addColorStop(1, '#7a4c24'); rr(c, bx, by, bw, bh, 8); c.fillStyle = dg; c.fill(); c.restore();
  c.fillStyle = 'rgba(255,230,190,.35)'; c.fillRect(bx + 8, by + 3, bw - 16, 2);
  c.strokeStyle = 'rgba(50,25,5,.22)'; c.lineWidth = 1; for (let k = 1; k < 5; k++) { c.beginPath(); c.moveTo(bx + 10, by + bh * k / 5); c.lineTo(bx + bw - 10, by + bh * k / 5 + (k % 2 ? 1 : -1)); c.stroke(); }

    c.save();
    if (s.found && !isOdd) c.globalAlpha = 0.82;
    c.shadowColor = 'rgba(60,35,10,.38)'; c.shadowBlur = 12; c.shadowOffsetY = 6; rr(c, x0, y0, cw, ch, 14);
    const cg = c.createLinearGradient(0, y0, 0, y0 + ch); cg.addColorStop(0, '#fffaf0'); cg.addColorStop(1, '#efe3c6'); c.fillStyle = cg; c.fill(); c.shadowColor = 'transparent';

    // speech bubble with the measurement

    c.strokeStyle = 'rgba(77,51,8,.8)'; for (let q = 0; q <= 10; q++) { c.beginPath(); c.moveTo(x0 + 16 + (tw2 - 8) * q / 10, ty + 1); c.lineTo(x0 + 16 + (tw2 - 8) * q / 10, ty + (q % 5 ? 6 : 9)); c.stroke(); }

}

// --- draw loop -----------------------------------------------------------------------------------------------
const view = canvasLoop($('cv'), (c, w, h, dt, t) => {
  c.drawImage(deskImg(w, h), 0, 0, w, h);
  const m = mode();
  if (m === 'ruler' || m === 'broken') drawRulerScene(c, w, h, dt, t, m);
  else if (m === 'jug') drawJugScene(c, w, h, dt, t);
  else if (m === 'thermo') drawThermoScene(c, w, h, dt, t);
  else drawThreeScene(c, w, h, dt, t);

// --- one render per change: controls, readout, state card, facts --------------------------------------------
function chainOf(v) {
  const n0 = Math.round(v / 10) * 10, dir = v >= n0 ? 1 : -1, steps = Math.abs(v - n0) / 2, list = [];
  for (let i = 0; i <= steps; i++) list.push(n0 + dir * 2 * i);
  return { n0, steps, list: list.join(', '), exact: steps === 0 };
}
function render() {
  const t = T[lang], m = mode(), p = P();
  document.body.dataset.v = m;
  $('msQ').textContent = t.q[m];
  $('msRow').style.display = m === 'three' ? 'none' : '';
  $('msAgainRow').style.display = m === 'three' ? '' : 'none'; $('msAgain').textContent = t.again;
  $('msEye').style.display = m === 'jug' ? '' : 'none'; $('msEyeL').textContent = t.eye;
  $('msTemp').style.display = m === 'thermo' ? '' : 'none'; $('msTempL').textContent = t.temp; $('msCool').textContent = `🧊 ${t.cool}`; $('msWarm').textContent = `${t.warm} 🔥`;
  $('tempR').style.setProperty('--track', 'linear-gradient(90deg,#4ea8ff,#e5484d)'); $('tempR').value = String(S.th.T);
  const unlocked = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ms-chip ${unlocked ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${unlocked ? `${emo} ${esc(t.secrets[k][0])}` : t.locked}</button>`;
  $('msSecs').innerHTML = sc('three', '🔁') + sc('broken', '🪚');
  if (p) {
    $('msUnit').textContent = t.unit[m]; $('msIn').readOnly = p.checked; $('msIn').inputMode = m === 'thermo' ? 'text' : 'decimal';
    $('msGo').textContent = p.checked ? t.next[m] : t.check; $('msGo').disabled = !p.checked && p.guess === null;
  }
  lab.setFacts(t.facts[lab.view] ?? []);
  ({ ruler: rRuler, broken: rBroken, jug: rJug, thermo: rThermo, three: rThree })[m](t, p);
}
const verdictPill = (p, t) => (p.right ? `✓ ${t.ok}` : t.no);
function rRuler(t, p) {
  lab.setGlow('rgba(232, 183, 60, .28)'); const st = t.st.ruler, { start: s, end: e, len: L } = p;
  if (!p.checked) { lab.setReadout('?', '', '', '#e8b73c'); const [a, b, c] = st.p; return lab.setState({ emo: '✏️', title: a, lead: b, body: c }); }
  lab.setReadout(`${N(L)} ${t.cm}`, `${t.w.start} ${N(s)} ${t.cm} → ${t.w.end} ${N(e)} ${t.cm}`, verdictPill(p, t), '#e8b73c');
  const [a, b, c] = p.right ? st.right(N(s), N(e), N(L)) : p.guess === e ? st.end(N(s), N(e), N(L)) : st.other(N(s), N(e), N(L));
  lab.setState({ emo: p.right ? '✅' : '🤔', title: a, lead: b, body: c });
}
function rBroken(t, p) {
  lab.setGlow('rgba(226, 87, 76, .26)'); const st = t.st.broken;
  if (!p.checked) { lab.setReadout('?', '', '', '#e2574c'); const [a, b, c] = st.p; return lab.setState({ emo: '🪚', title: a, lead: b, body: c }); }
  lab.setReadout(`6 ${t.cm}`, `${t.w.start} 4 ${t.cm} → ${t.w.end} 10 ${t.cm}`, verdictPill(p, t), '#e2574c');
  const [a, b, c] = p.right ? st.right : p.guess === 10 ? st.end : st.other;
  lab.setState({ emo: p.right ? '✅' : '🤔', title: a, lead: b, body: c });
}
function rJug(t, p) {
  lab.setGlow('rgba(78, 168, 255, .3)'); const st = t.st.jug;
  if (!p.checked) { lab.setReadout('?', '', '', '#4ea8ff'); const [a, b, c] = st.p; return lab.setState({ emo: '🥛', title: a, lead: b, body: c }); }
  lab.setReadout(`${p.ml} ${t.ml}`, '', verdictPill(p, t), '#4ea8ff');

  lab.setState({ emo: p.right ? '✅' : '🤔', title: a, lead: b, body: c });
}
function rThermo(t, p) {
  lab.setGlow('rgba(229, 72, 77, .26)'); const st = t.st.thermo;
  if (!p.checked) { lab.setReadout('?', '', '', '#e5484d'); const [a, b, c] = st.p; return lab.setState({ emo: '🌡️', title: a, lead: b, body: c }); }
  lab.setReadout(`${p.T} ${t.deg}`, '', verdictPill(p, t), '#e5484d');
  const ch = chainOf(p.T), oneEach = !ch.exact && p.guess === ch.n0 + Math.sign(p.T - ch.n0) * ch.steps;
  const [a, b, c] = p.right ? st.right(p.T, ch.list, ch.exact) : oneEach ? st.one(p.T, ch.list) : st.other(p.T, ch.list, ch.exact);

}
function rThree(t) {

  if (!s.found) {
    lab.setReadout('?', '', '', '#3ddc97');
    const [a, b, c] = s.tapped === null ? st.p : st.wrong; return lab.setState({ emo: s.tapped === null ? '🔁' : '🤔', title: a, lead: b, body: c });
  }
  lab.setReadout(`72 ${t.cm}`, t.w.typ, `✓ ${t.ok}`, '#3ddc97');
  const [a, b, c] = st.right(78, 72); lab.setState({ emo: '✅', title: a, lead: b, body: c });
}
render();
