  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'q') { S.q = i; S.picks.clear(); S.rev = false; bringBack(); sfx.click(); }
  else if (act === 'go') { if (!S.picks.size) return; S.rev = true; const rel = relevant(); pullList(rel); chips.forEach((ch) => { if (!rel.includes(ch.i)) startChip(ch, 1, .1, 1, 'drift', { x: (ch.i & 1 ? 1 : -1) * 10, y: 10, r: ((ch.i % 3) - 1) * .05 }); }); sfx.push(); setTimeout(() => sfx.good(), 900); showStage(); }
  else if (act === 'again') { S.picks.clear(); S.rev = false; bringBack(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    bringBack(); S.picks.clear(); S.rev = false; sfx.click();
    if (b.dataset.k === 'a') { S.sec = 'big'; S.a = { step: 0, bad: new Set(), msg: '' }; setTimeout(applyBig, 250); }
    else { S.sec = 'two'; S.b = { pick: null, checked: false, flip: Math.random() < .5, t: 0 }; }
    showStage();
  } else if (act === 'close') { S.sec = null; bringBack(); sfx.click(); }
  else if (act === 'aopt') {
    const st = T[lang].a.steps[S.a.step];
    if (i === st.ok) { S.a.step++; S.a.bad = new Set(); S.a.msg = ''; sfx.good(); applyBig(); showStage(); }
    else { S.a.bad.add(i); S.a.msg = st.no; sfx.bad(); }
  } else if (act === 'bgo') { if (S.b.pick === null) return; S.b.checked = true; S.b.t = now(); sfx.good(); showStage(); }
  else if (act === 'bagain') { S.b = { pick: null, checked: false, flip: !S.b.flip, t: 0 }; sfx.click(); }
  else if (act === 'nopt') {
    if (S.n.pick !== null) return;
    S.n.pick = i; S.n.tAns = now(); const ok = NK[S.n.r][i] === 'good'; S.n.res[S.n.r] = ok; (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'nnext') { S.n.r++; S.n.pick = null; sfx.click(); }
  else if (act === 'nagain') { S.n = { r: 0, pick: null, tAns: 0, res: [] }; sfx.click(); }
  else if (act === 'pdrop' || act === 'pchk') {
    const P = S.p; P.res = act === 'pdrop' ? 'drop' : 'check'; P.phase = 'done'; P.tRes = now(); (act === 'pdrop' ? sfx.click : sfx.good)();
  } else if (act === 'pagain') { initP(); sfx.click(); }
  render();
});

// --- render ------------------------------------------------------------------------------------------------
const secChips = (t, open) => `<div class="row2"><div class="chips">${[['a', '🌊'], ['b', '⚖️']].map(([k, e]) =>
  `<button class="chip secret ${open ? 'open' : ''} ${(S.sec === 'big' && k === 'a') || (S.sec === 'two' && k === 'b') ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('')}</div></div>`;
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('rqM').hidden = v !== 'magnet'; $('rqN').hidden = v !== 'notes'; $('rqP').hidden = v !== 'src';
  cv.style.touchAction = v === 'src' ? 'none' : 'pan-y';
  lab.setGlow(v === 'magnet' ? 'rgba(76, 201, 176, .24)' : v === 'notes' ? 'rgba(224, 176, 80, .24)' : 'rgba(143, 127, 208, .26)');
  lab.setFacts(t.facts[v].map((f) => ({ ...f, src: FSRC[v] })));
  if (v === 'magnet') renderM(t); else if (v === 'notes') renderN(t); else renderP(t);
}
function renderM(t) {
  const m = t.m, open = secret.unlocked(); let html = '', st;
  if (S.sec === 'big') {
    const A = S.a, step = A.step, s = t.a.steps[step];
    html += s ? `<p class="rq-q">${esc(s.q)}</p><div class="rq-opts">${s.opts.map((o, i) => `<button class="rq-opt ${A.bad.has(i) ? 'bad dim' : ''}" data-act="aopt" data-i="${i}" ${A.bad.has(i) ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>` : '';
    if (A.msg && s) html += `<p class="rq-lead">${esc(A.msg)}</p>`;
    html += `<div class="row2"><button class="chip" data-act="close">✕ ${esc(t.a.close)}</button></div>`;
    st = step === 0 ? { emo: '🌊', title: t.a.t0, lead: t.a.lead0 } : step === 1 ? { emo: '🧐', title: t.a.t1, lead: t.a.lead1 } : { emo: '🎯', title: t.a.t2, lead: t.a.lead2 };
    lab.setReadout(step === 0 ? '10+' : step === 1 ? '6' : '3', '', '', '#4cc9b0');
  } else if (S.sec === 'two') {
    const B = S.b, tb = t.b;
    html += `<p class="rq-q">${esc(tb.lead)}</p><button class="btn rq-go" data-act="${B.checked ? 'bagain' : 'bgo'}" ${!B.checked && B.pick === null ? 'disabled' : ''}>${esc(B.checked ? tb.again : tb.ask)}</button>`;
    html += `<div class="row2"><button class="chip" data-act="close">✕ ${esc(t.a.close)}</button></div>`;
    const good = B.pick === (B.flip ? 1 : 0);
    st = !B.checked ? (B.pick === null ? { emo: '⚖️', title: tb.t0, lead: tb.lead } : { emo: '🤔', title: tb.pickT, lead: tb.pickL }) : good ? { emo: '✅', title: tb.okT, lead: tb.okL } : { emo: '🤔', title: tb.noT, lead: tb.noL };
    lab.setReadout(B.checked ? tb.gv : '?', B.checked ? tb.guide : '', '', '#4cc9b0');
  } else {
    html += `<div class="chips">${m.qs.map((q, i) => `<button class="chip ${S.q === i ? 'on' : ''}" data-act="q" data-i="${i}">${esc(q)}</button>`).join('')}</div>`;
    if (!S.rev) html += `<p class="rq-lead">${esc(m.lead)}</p><button class="btn rq-go" data-act="go" ${S.picks.size ? '' : 'disabled'}>${esc(m.go)}</button>`;
    else html += `<button class="btn rq-go" data-act="again">${esc(m.again)}</button>`;
    if (!S.rev) { st = { emo: '🧲', title: m.t0, lead: m.lead }; lab.setReadout('?', m.chosen(S.picks.size), '', '#4cc9b0'); }
    else {
      const { hit, extra } = score(), perfect = hit === 3 && extra === 0;
      st = { emo: perfect ? '🎯' : '🤔', title: perfect ? m.right : m.found(hit), lead: perfect ? m.keepAll : m.keep, body: extra ? m.extra(extra) : '' };
      lab.setReadout(`${hit}/3`, m.matches, extra ? m.extra(extra) : '', '#4cc9b0');
    }
  }
  html += secChips(t, open);
  $('rqM').innerHTML = html;
  lab.setState({ body: '', extra: '', ...st });
}
function renderN(t) {
  const n = t.n, N = S.n; let html = '', st;
  if (N.r >= 3) {
    const k = N.res.filter(Boolean).length;
    html = `<button class="btn rq-go" data-act="nagain">${esc(n.again)}</button>`;
    st = { emo: '🏆', title: n.end(k), lead: n.endLead }; lab.setReadout(`${k}/3`, '', '', '#e0b050');
  } else {
    const R = n.r[N.r], kinds = NK[N.r];
    html = `<p class="rq-q">${esc(n.q)}</p><div class="rq-opts">${kinds.map((kd, i) => {
      const txt = kd === 'copy' ? R.s : kd === 'good' ? R.good : R.changed;
      const cls = N.pick === null ? '' : kd === 'good' ? 'good' : N.pick === i ? 'bad' : 'dim';
      return `<button class="rq-opt ${cls}" data-act="nopt" data-i="${i}" ${N.pick === null ? '' : 'disabled'}>${esc(txt)}</button>`;
    }).join('')}</div>`;
    if (N.pick !== null) html += `<button class="btn rq-go" data-act="nnext">${esc(n.next)}</button>`;
    if (N.pick === null) st = { emo: '✏️', title: n.q, lead: n.lead(N.r + 1) };
    else {
      const kd = kinds[N.pick];
      st = kd === 'good' ? { emo: '✅', title: n.right, lead: n.lGood } : kd === 'copy' ? { emo: '📋', title: n.tCopy, lead: n.lCopy } : { emo: '🤔', title: n.tChanged, lead: n.lChanged };
    }
    lab.setReadout(`${N.r + 1}/3`, n.round, '', '#e0b050');
  }
  $('rqN').innerHTML = html;
  lab.setState({ body: '', extra: '', ...st });
}
function renderP(t) {
  const p = t.p, P = S.p; let html = '', st;
  if (P.phase === 'flash') html = `<p class="rq-q">${esc(p.who)}</p><div class="rq-opts"><button class="rq-opt" data-act="pdrop">${esc(p.dropB)}</button><button class="rq-opt" data-act="pchk">${esc(p.chkB)}</button></div>`;
  else if (P.phase === 'done') html = `<button class="btn rq-go" data-act="pagain">${esc(p.again)}</button>`;
  else html = `<p class="rq-q">${esc(p.lead)}</p>`;
  if (P.phase === 'done') st = P.res === 'drop' ? { emo: '🗑️', title: p.dropT, lead: p.dropL } : { emo: '🔍', title: p.chkT, lead: p.chkL };
  else if (P.phase === 'flash') st = { emo: '❓', title: p.allT, lead: p.allL };
  else if (P.msg === 'wrong') st = { emo: '🤔', title: p.wrongT, lead: p.wrongL };
  else if (P.matched > 0) st = { emo: '🏷️', title: p.okT, lead: p.okL(P.matched) };
  else st = { emo: '🏷️', title: p.t0, lead: p.lead };
  lab.setReadout(`${P.matched}/4`, p.unit, '', '#8f7fd0');
  $('rqP').innerHTML = html;
  lab.setState({ body: '', extra: '', ...st });
}

canvasLoop(cv, (c, w, h, dt) => {
  const s = Math.min(w / W, h / H); G = { s, ox: (w - W * s) / 2, oy: (h - H * s) / 2 };
  desk(c, w, h);
  c.save(); c.translate(G.ox, G.oy); c.scale(s, s);
  const tn = now();
  if (lab.view === 'magnet') drawMagnetView(c, tn); else if (lab.view === 'notes') drawNotes(c, tn); else drawSrc(c, tn, dt);
  c.restore();
});
render();
</script>
