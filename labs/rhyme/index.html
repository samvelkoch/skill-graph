    lines: [['Koppints két sorvégre,', 'amelyek ugyanúgy hangzanak.'], ['Nevezd meg a képletet', 'betűkkel.'], ['Számold meg a sorokat', 'és a versszakokat.']],
    views: { find: '🔎 Rímkeresés', name: '🔤 Nevezd meg', count: '🔢 Sorok és versszakok' },
    again: '↻ Újra az elejéről', retry: '↻ Még egyszer', check: '✓ Ellenőrzés', mix: '🔀 Keverés', right: 'Így van!', notq: 'Nem egészen.',
    poems: {
      find: { ti: '„Anyám tyúkja”', au: 'Petőfi Sándor, 1847', pat: 'AABB', st: [4], lines: [['Ej, mi a kő! tyúkanyó, ', 'kend', ''], ['A szobában lakik itt ', 'bent', '?'], ['Lám, csak jó az isten, jót ', 'ád', ','], ['Hogy fölvitte a kend ', 'dolgát', '!']] },
      name: { ti: '„Szeptember végén”', au: 'Petőfi Sándor, 1847', pat: 'ABAB', st: [4], lines: [['Még nyílnak a völgyben a kerti ', 'virágok', ','], ['Még zöldel a nyárfa az ablak ', 'előtt', ','], ['De látod amottan a téli ', 'világot', '?'], ['Már hó takará el a bérci ', 'tetőt', '.']] },
      count: { ti: '„Itt van az ősz, itt van ujra”', au: 'Petőfi Sándor, 1848', pat: 'ABCBDEFE', st: [4, 4], lines: [['Itt van az ősz, itt van ', 'ujra', ','], ['S szép, mint mindig, ', 'énnekem', '.'], ['Tudja isten, hogy mi ', 'okból', ''], ['Szeretem? de ', 'szeretem', '.'],
        ['Kiülök a ', 'dombtetőre', ','], ['Innen nézek ', 'szerteszét', ','], ['S hallgatom a fák ', 'lehulló', ''], ['Levelének lágy ', 'neszét', '.']] },
    },
    find: { sub: 'talált pár', t0: 'Keresd meg a rímelő sorokat', l0: 'Koppints az egyik sor végére, aztán egy másik sor végére, amely ugyanúgy hangzik.',
      tp: 'Egy pár!', lp: (a, b) => `„${a}” és „${b}” ugyanúgy hangzik a végén.`, tb: 'Ez nem pár', lb: 'Ez a két sorvég nem hangzik egyformán. Mondd ki hangosan, és próbáld újra.',
      td: 'Megvan minden pár!', ld: 'A rímelő sorok ugyanazt a betűt kapják. Nézd a jobb oldali sávot.' },
    name: { q: 'Melyik rímképlet ez?', t0: 'Melyik rímképlet ez?', l0: 'Olvasd fel hangosan a négy sort, és figyeld, hogyan végződnek. A gyöngyök a válaszod után mutatják a képletet.', sub: 'képlet',
      poemBtn: (p) => `${p} vers`, lead: (p, g) => `Ez ${p}. ${g}`, body: 'A rímelő sorok ugyanazt a betűt kapják, ezért a betűk mutatják a képletet.',
      other: 'Másik képlet. Hol vannak most az egyforma színek?' },
    count: { q: 'Hány sor és hány versszak van ebben?', t0: 'Számold meg a sorokat és a versszakokat', l0: 'Állítsd be mindkét számot, aztán nyomd meg az Ellenőrzést. A sorszámok és a versszakok kapcsai az ellenőrzéskor jelennek meg.',
      lines: 'Sorok', stanzas: 'Versszakok', val: (l, s) => `${l ?? '?'} sor · ${s ?? '?'} versszak`, sub0: 'a tipped', lead: (l, s) => `A versben ${l} sor van ${s} versszakban.`,
      body: 'Minden versszakban csak a 2. és a 4. sor rímel: ABCB DEFE. A szürke gyöngyöknek nincs rímpárjuk. A kapocs egy versszakot jelöl, a köz mutatja, hol ér véget.' },
    secrets: { none: ['Rím nélkül', 'Vers szürke gyöngyökkel'], abba: ['Készítsd el a saját ABBA-dat', 'Rakd sorrendbe a sorokat'] },
    none: { ti: 'Ehhez a laborhoz írva', au: 'itt nincs rím', t: 'Vers rím nélkül', l: 'Két sorvég sem hangzik egyformán, ezért minden gyöngy szürke marad.',
      b: 'Ezt a három sort ehhez a laborhoz írtuk, nem híres költő írta. Egy vers rím nélkül is vers.', sub: 'talált rím',
      lines: [['Eső az ', 'ablakon', ','], ['a macska minden cseppet ', 'néz', ','], ['aztán ', 'elalszik', '.']] },
    abba: { ti: 'Négy sor', au: 'rakd sorrendbe', sub: 'cél: ABBA', t0: 'Készítsd el a saját ABBA-dat',
      l0: 'Koppints az egyik sorra, aztán egy másikra: helyet cserélnek. Az 1. és a 4. sornak kell rímelnie, a 2. és a 3.-nak is. Nyomd meg az Ellenőrzést.',
      ok: 'ABBA! Ez a te saját versed.', okl: 'A két szélső sor rímel, és a két középső is.', no: (p) => `Ez ${p}.`, nol: 'Ez még nem ABBA. Cserélj helyet a sorok között, és ellenőrizd újra.',
      cards: [['Reggel fölkel a ', 'nap', '.', 0], ['Kertünk végén áll a ', 'fa', '.', 1], ['Mit csinálunk ', 'ma', '?', 1], ['Kiskutyánk a hógolyóba ', 'kap', '.', 0]] },
    grp: (g) => g.map(([L, w]) => `${L}: ${w.join(' – ')}`).join(' · '),
    quiz: [
      { q: 'Az 1. és 2. sor rímel, a 3. és 4. sor is rímel. Mi a rímképlet?', opts: ['AABB', 'ABAB', 'ABBA'], ok: 0 },
      { q: 'Két szó attól rímel, hogy ugyanazok a betűk vannak a végén, vagy attól, hogy ugyanúgy hangzik a végük?', opts: ['Ugyanúgy hangzik a végük', 'Ugyanazok a betűk vannak a végén', 'Ugyanolyan hosszúak'], ok: 0 },
      { q: 'Mi a versszak?', opts: ['A vers sorainak egy csoportja, utána üres hellyel', 'A sor utolsó szava', 'Olyan vers, amely rímel'], ok: 0 },
    ],
  },
};
const TOPICS = [{ id: 'sg_lit_29', en: 'Rhyme and stanza', ru: 'Рифма и строфа', hu: 'Rím és versszak' }];
const FACTS = { find: ['greek', 'hungary'], name: ['onegin'], count: ['stanza', 'onegin'], none: ['greek'], abba: ['stanza'] };

// --- colours: A coral, B teal, C gold, D violet, E blue -------------------------------------------------------
const COL = { A: '#ee6c5b', B: '#27b3a6', C: '#f2b233', D: '#8b6ee0', E: '#4a8fe6' };
const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const shade = (h, k) => `rgb(${rgb(h).map((v) => Math.round(v * (1 - k))).join(',')})`;
const tint = (h, k) => `rgb(${rgb(h).map((v) => Math.round(v + (255 - v) * k)).join(',')})`;

// --- state -------------------------------------------------------------------------------------------------
const S = {
  f: [false, false, false, false], sel: null, shake: [], neu: null, msg: '', last: null, anim: false,
  n: { guess: null, done: false, poem: 0 },
  c: { l: null, s: null, done: false },
  sec: null, nn: { sel: null, shake: [] },
  ab: { order: [0, 1, 3, 2], sel: null, done: false, pop: [] },
};
let animTimer = 0, neuTimer = 0;
const lab = shell({ key: 'rhyme', T, topics: TOPICS, views: ['find', 'name', 'count'], onLang: render, onView: () => { S.sec = null; S.sel = null; render(); } });
const secret = secretLab('rhyme', () => ({
  secrets: [{ emo: '🌊', title: T[lang].secrets.none[0], desc: T[lang].secrets.none[1] }, { emo: '🧩', title: T[lang].secrets.abba[0], desc: T[lang].secrets.abba[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = '<div class="rh-ctl" id="rhCtl"></div>';
const ctl = $('rhCtl'), stage = $('overlay');
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const startAnim = () => { S.anim = true; clearTimeout(animTimer); animTimer = setTimeout(() => { S.anim = false; }, 3200); };
const spaced = (p) => p.split('').join(' ');
const groups = (p) => { const m = new Map(); p.lines.forEach((l, i) => { const L = p.pat[i]; if (!m.has(L)) m.set(L, []); m.get(L).push(l[1]); }); return [...m].filter(([, w]) => w.length > 1); };

// --- the poem card --------------------------------------------------------------------------------------------
// o: rev[i] bead and letter shown, hl last words, tap rows are buttons, br brackets, nums line numbers (numsOn shown), sel, shake, pop, neu (only these animate), anim, dash
function cardHTML(p, o) {
  const pat = o.pat ?? p.pat, cnt = {};
  for (const ch of pat) cnt[ch] = (cnt[ch] || 0) + 1;
  const tag = o.tap ? 'button' : 'div';
  let i = 0, html = '';
  p.st.forEach((n, si) => {
    const first = i;
    let rows = '';
    for (let k = 0; k < n; k++, i++) {
      const [pre, end, post] = p.lines[i], L = pat[i], grey = cnt[L] === 1, col = COL[L] || '#8a8f9c';
      const rev = !!(o.rev && o.rev[i]), a = o.anim && (!o.neu || o.neu.includes(i));
      const d = o.neu ? 0 : i * 0.32, ds = `animation-delay:${d.toFixed(2)}s`;
      const lit = rev && !grey;
      const cls = ['rh-row', o.sel === i ? 'rh-sel' : '', o.shake?.includes(i) ? 'rh-shake' : '', o.pop?.includes(i) ? 'rh-pop' : ''].join(' ');
      rows += `<${tag} class="${cls}" data-i="${i}"${o.tap ? ' type="button"' : ''}>
        <span class="rh-num ${o.numsOn ? 'on' : ''} ${o.anim && o.numsOn ? 'rh-a' : ''}" style="${ds}">${i + 1}</span>
        <span class="rh-txt">${esc(pre)}<span class="rh-end">${esc(end)}</span>${esc(post)}</span>
        <span class="rh-bead"><i class="rh-fill ${lit ? 'on' : ''} ${a && lit ? 'rh-a' : ''}" style="--c1:${tint(col, 0.28)};--c2:${shade(col, 0.2)};${ds}">${lit ? L : ''}</i></span>
        <span class="rh-let ${rev ? 'on' : ''} ${a && rev ? 'rh-a' : ''}" style="color:${grey ? '#8c8576' : shade(col, 0.28)};${ds}">${o.dash ? '–' : L}</span>
      </${tag}>`;
    }
    const sd = `animation-delay:${(first * 0.32 + 0.15).toFixed(2)}s`;
    html += `<div class="rh-st"><i class="rh-br ${o.br ? 'on' : ''} ${o.anim && o.br && o.brAnim ? 'rh-a' : ''}" style="${sd}"></i>${o.badge ? `<span class="rh-sn ${o.br ? 'on' : ''} ${o.anim && o.br ? 'rh-a' : ''}" style="${sd}">${si + 1}</span>` : ''}${rows}</div>`;
  });
  return `<div class="rh-card ${o.hl ? 'rh-hl' : ''} ${o.nums ? 'rh-nums' : ''}"><div class="rh-meta">${esc(p.ti)}<span>${esc(p.au)}</span></div>${html}</div>`;
}

// --- interaction --------------------------------------------------------------------------------------------
stage.addEventListener('click', (ev) => {
  const r = ev.target.closest('button.rh-row'); if (!r) return;
  const i = +r.dataset.i;
  if (S.sec === 'none') return noneTap(i);
  if (S.sec === 'abba') return abTap(i);
  if (lab.view === 'find') findTap(i);
});
function findTap(i) {
  if (S.f[i]) return;
  const p = T[lang].poems.find;
  S.msg = '';
  if (S.sel === null) { S.sel = i; sfx.tick(); }
  else if (S.sel === i) { S.sel = null; sfx.tick(); }
  else {
    const a = S.sel; S.sel = null;
    if (p.pat[a] === p.pat[i]) {
      S.f[a] = S.f[i] = true; S.neu = [a, i]; S.last = [a, i]; sfx.good(); startAnim();
      clearTimeout(neuTimer); neuTimer = setTimeout(() => { S.neu = null; }, 1200);
    } else { S.shake = [a, i]; S.msg = 'bad'; sfx.bad(); setTimeout(() => { S.shake = []; render(); }, 450); }
  }
  render();
}
function noneTap(i) {
  if (S.nn.sel === null) { S.nn.sel = i; sfx.tick(); }
  else if (S.nn.sel === i) { S.nn.sel = null; sfx.tick(); }
  else { S.nn.shake = [S.nn.sel, i]; S.nn.sel = null; sfx.bad(); setTimeout(() => { S.nn.shake = []; render(); }, 450); }
  render();
}
function abTap(i) {
  const ab = S.ab;
  if (ab.sel === null) { ab.sel = i; sfx.tick(); }
  else if (ab.sel === i) { ab.sel = null; sfx.tick(); }
  else {
    const a = ab.sel; ab.sel = null;
    [ab.order[a], ab.order[i]] = [ab.order[i], ab.order[a]];
    ab.done = false; ab.pop = [a, i]; sfx.snap();
    setTimeout(() => { ab.pop = []; }, 500);
  }
  render();
}
const abPat = (order = S.ab.order) => { const cards = T[lang].abba.cards, seen = []; return order.map((k) => { const g = cards[k][3]; if (!seen.includes(g)) seen.push(g); return 'ABCD'[seen.indexOf(g)]; }).join(''); };

ctl.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, t = T[lang];
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    S.sec = S.sec === k ? null : k;
    S.nn = { sel: null, shake: [] };
    if (k === 'abba') S.ab = { order: [0, 1, 3, 2], sel: null, done: false, pop: [] };
    sfx.click();
  } else if (act === 'reset') {
    S.f = [false, false, false, false]; S.sel = null; S.msg = ''; S.last = null; S.neu = null; sfx.click();
  } else if (act === 'opt') {
    if (S.n.done) return;
    S.n.guess = b.dataset.v; S.n.done = true; S.n.poem = 0;
    (S.n.guess === t.poems.name.pat ? sfx.good : sfx.bad)(); startAnim(); render(); showStage(); return;
  } else if (act === 'poem') { S.n.poem = +b.dataset.p; sfx.click(); startAnim(); }
  else if (act === 'retry') { S.n = { guess: null, done: false, poem: 0 }; sfx.click(); }
  else if (act === 'step') {
    if (S.c.done) return;
    const k = b.dataset.k, cur = S.c[k], n = Math.max(1, Math.min(12, (cur ?? (+b.dataset.s > 0 ? 0 : 2)) + +b.dataset.s));
    S.c[k] = n; sfx.tick();
  } else if (act === 'cretry') { S.c = { l: null, s: null, done: false }; sfx.click(); }
  else if (act === 'ccheck') {
    if (S.c.l === null || S.c.s === null || S.c.done) return;
    S.c.done = true; (S.c.l === 8 && S.c.s === 2 ? sfx.good : sfx.bad)(); startAnim(); render(); showStage(); return;
  } else if (act === 'abcheck') {
    S.ab.done = true; S.ab.sel = null; (abPat() === 'ABBA' ? sfx.good : sfx.bad)(); startAnim(); render(); showStage(); return;
  } else if (act === 'abmix') {
    let o; do { o = [0, 1, 2, 3].sort(() => Math.random() - 0.5); } while (o.join() === S.ab.order.join() || abPat(o) === 'ABBA');
    S.ab = { order: o, sel: null, done: false, pop: [] }; sfx.click();
  }
  render();
});

// --- one render per change: stage, controls, readout, state card and facts --------------------------------------
const secRow = (t) => {
  const open = secret.unlocked(), emo = { none: '🌊', abba: '🧩' };
  return `<div class="row2"><div class="chips">${['none', 'abba'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo[k]} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('')}</div></div>`;
};
function render() {
  const t = T[lang], v = lab.view, sc = S.sec || v;
  lab.setGlow('rgba(240, 177, 60, .22)');
  let ctrl = '', st, ro;
  if (sc === 'find') {
    const p = t.poems.find, n = S.f.filter(Boolean).length / 2, done = n === 2;
    stage.innerHTML = cardHTML(p, { rev: S.f, hl: true, tap: true, br: true, sel: S.sel, shake: S.shake, neu: S.neu, anim: S.anim });
    ro = [`${n}/2`, t.find.sub, done ? spaced(p.pat) : '', COL.A];
    if (S.msg === 'bad') st = { emo: '🤔', title: t.find.tb, lead: t.find.lb };
    else if (done) st = { emo: '🎉', title: t.find.td, lead: t.find.ld };
    else if (n === 1 && S.last) st = { emo: '🫧', title: t.find.tp, lead: t.find.lp(p.lines[S.last[0]][1], p.lines[S.last[1]][1]) };
    else st = { emo: '🔎', title: t.find.t0, lead: t.find.l0 };
    ctrl = `<div class="row2" style="margin-top:0"><button class="chip" data-act="reset">${esc(t.again)}</button></div>`;
  } else if (sc === 'name') {
    const N = S.n, p = t.poems.name, q = t.poems.find, cur = N.poem === 1 ? q : p, done = N.done;
    stage.innerHTML = cardHTML(cur, { rev: done ? [1, 1, 1, 1] : null, br: true, anim: S.anim });
    const ok = N.guess === p.pat;
    if (!done) {
      ro = ['?', t.name.sub, '', COL.B];
      st = { emo: '🤔', title: t.name.t0, lead: t.name.l0 };
    } else {
      ro = [spaced(cur.pat), t.name.sub, N.poem === 0 ? (ok ? t.right : t.notq) : '', N.poem === 0 && !ok ? '#e0a23a' : '#2fb58a'];
      st = N.poem === 0
        ? { emo: ok ? '🎉' : '💡', title: ok ? t.right : t.notq, lead: t.name.lead(p.pat, t.grp(groups(p))), body: t.name.body }
        : { emo: '🔁', title: cur.pat, lead: t.grp(groups(cur)), body: t.name.other };
    }
    ctrl = `<p class="rh-q">${esc(t.name.q)}</p><div class="rh-opts">${['AABB', 'ABAB', 'ABBA'].map((o) =>
      `<button class="rh-opt ${done ? (o === p.pat ? 'good' : o === N.guess ? 'bad' : '') : ''}" data-act="opt" data-v="${o}"${done ? ' disabled' : ''}>${o}</button>`).join('')}</div>`;
    if (done) ctrl += `<div class="row2"><div class="chips"><button class="chip ${N.poem === 0 ? 'on' : ''}" data-act="poem" data-p="0">${esc(t.name.poemBtn(p.pat))}</button><button class="chip ${N.poem === 1 ? 'on' : ''}" data-act="poem" data-p="1">${esc(t.name.poemBtn(q.pat))}</button><button class="chip" data-act="retry">${esc(t.retry)}</button></div></div>`;
  } else if (sc === 'count') {
    const C = S.c, p = t.poems.count, done = C.done, ok = C.l === 8 && C.s === 2;
    stage.innerHTML = cardHTML(p, { rev: done ? new Array(8).fill(true) : null, br: done, brAnim: true, badge: true, nums: true, numsOn: done, anim: S.anim });
    ro = done ? [t.count.val(8, 2), '', ok ? t.right : t.notq, ok ? '#2fb58a' : '#e0a23a'] : [t.count.val(C.l, C.s), t.count.sub0, '', COL.C];
    st = done ? { emo: ok ? '🎉' : '💡', title: ok ? t.right : t.notq, lead: t.count.lead(8, 2), body: t.count.body } : { emo: '🔢', title: t.count.t0, lead: t.count.l0 };
    const stp = (k, lbl) => `<div class="rh-stp"><span class="lbl">${esc(lbl)}</span><div><button class="rh-sb" data-act="step" data-k="${k}" data-s="-1" aria-label="−"${done || C[k] === null || C[k] <= 1 ? ' disabled' : ''}>−</button><b>${C[k] ?? '?'}</b><button class="rh-sb" data-act="step" data-k="${k}" data-s="1" aria-label="+"${done || (C[k] ?? 0) >= 12 ? ' disabled' : ''}>+</button></div></div>`;
    ctrl = `<p class="rh-q">${esc(t.count.q)}</p><div class="rh-steps">${stp('l', t.count.lines)}${stp('s', t.count.stanzas)}</div>
      <div class="row2">${done ? `<button class="btn ghost rh-push" data-act="cretry">${esc(t.retry)}</button>` : `<button class="btn rh-push" data-act="ccheck"${C.l === null || C.s === null ? ' disabled' : ''}>${esc(t.check)}</button>`}</div>`;
  } else if (sc === 'none') {
    const n = t.none, p = { ti: n.ti, au: n.au, pat: 'ABC', st: [3], lines: n.lines };
    stage.innerHTML = cardHTML(p, { rev: [1, 1, 1], dash: true, hl: true, tap: true, br: true, sel: S.nn.sel, shake: S.nn.shake });
    ro = ['0', n.sub, '', '#8a8f9c'];
    st = { emo: '🌊', title: n.t, lead: n.l, body: n.b };
  } else { // abba
    const A = t.abba, ab = S.ab, pat = abPat(), ok = pat === 'ABBA';
    const p = { ti: A.ti, au: A.au, pat, st: [4], lines: ab.order.map((k) => A.cards[k]) };
    stage.innerHTML = cardHTML(p, { rev: ab.done ? [1, 1, 1, 1] : null, hl: true, tap: true, br: true, sel: ab.sel, pop: ab.pop, anim: S.anim });
    ro = [ab.done ? spaced(pat) : '? ? ? ?', A.sub, ab.done ? (ok ? t.right : '') : '', '#2fb58a'];
    st = !ab.done ? { emo: '🧩', title: A.t0, lead: A.l0 } : ok ? { emo: '🎉', title: A.ok, lead: A.okl } : { emo: '🤔', title: A.no(pat), lead: A.nol };
    ctrl = `<div class="row2" style="margin-top:0"><button class="btn" data-act="abcheck">${esc(t.check)}</button><button class="chip" data-act="abmix">${esc(t.mix)}</button></div>`;
  }
  ctl.innerHTML = ctrl + secRow(t);
  lab.setReadout(ro[0], ro[1], ro[2], ro[3]);
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body ?? '', extra: '' });
  lab.setFacts(FACTS[sc].map((k) => F[lang][k]));
}
render();
</script>
</body>
</html>
