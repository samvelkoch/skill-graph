  c.setLineDash([3, 5]); c.strokeStyle = 'rgba(255,208,100,.4)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(E[0], E[1]); c.lineTo(S1[0], S1[1]); c.stroke(); c.setLineDash([]);
  // Earth's orbit
  c.strokeStyle = 'rgba(120,190,255,.38)'; c.lineWidth = 1.4; c.beginPath(); c.arc(cx, cy, oR, 0, 7); c.stroke();
  // constellations
  const labels = [], gs = full ? 28 : 0;
  for (const k of RING) {

      c.strokeStyle = `rgba(190,210,255,${0.12 + 0.55 * lit})`; c.lineWidth = 1.2; c.beginPath();

      c.stroke();
      g.gl.forEach((q, i) => starDot(c, gx + q[0] * gs / 2, gy + q[1] * gs / 2, 3.2 - (3.4 - g.st[i][2]) * 0.2, g.st[i][3], 0.3 + 0.7 * lit));

  c.restore();
  if (full) { placeLabels(c, labels, r); pill(c, T[lang].sun, cx, cy + 25, 'center', 0.9); }

// --- the sky from a window at midnight (facing south; north on the Southern Hemisphere) -------------------------
function drawWindow(c, r, pr, lat, time) {
  const t = T[lang], fr = Math.min(12, r.w * 0.03), I = { x: r.x + fr, y: r.y + fr, w: r.w - 2 * fr, h: r.h - 2 * fr - 8 };
  const yH = I.y + I.h * 0.87, aS = (yH - I.y - 8) / 76, zS = I.w / 190, face = lat >= 0 ? 180 : 0, cx = I.x + I.w / 2;
  const pos = (al, az) => { const rel = ((az - face + 540) % 360) - 180; return [cx + rel * zS, yH - al * aS, rel]; };
  c.save(); c.beginPath(); c.roundRect(I.x, I.y, I.w, I.h, 14); c.clip();
  const sg = c.createLinearGradient(0, I.y, 0, yH); sg.addColorStop(0, '#04061a'); sg.addColorStop(0.6, '#101c45'); sg.addColorStop(1, '#2c4a80');
  c.fillStyle = sg; c.fillRect(I.x, I.y, I.w, I.h);

      const A = pos(a[i][0], a[i][1]), B = pos(a[j][0], a[j][1]); if (Math.abs(A[2]) > 110 || Math.abs(B[2]) > 110) continue;

  }

  // horizon: hills, roofs and trees in silhouette
  c.fillStyle = '#070912'; c.beginPath(); c.moveTo(I.x, I.y + I.h); c.lineTo(I.x, yH - 4);
  c.quadraticCurveTo(I.x + I.w * 0.15, yH - 14, I.x + I.w * 0.3, yH - 3); c.quadraticCurveTo(I.x + I.w * 0.45, yH + 5, I.x + I.w * 0.6, yH - 6);
  c.quadraticCurveTo(I.x + I.w * 0.8, yH - 16, I.x + I.w, yH - 2); c.lineTo(I.x + I.w, I.y + I.h); c.closePath(); c.fill();
  const hx = (f) => I.x + I.w * f;

    const by = yH - 2 + (f === 0.33 ? 2 : 0); c.fillStyle = '#070912'; c.fillRect(hx(f) - wd / 2, by - ht, wd, ht + 8);
    c.beginPath(); c.moveTo(hx(f) - wd / 2 - 3, by - ht); c.lineTo(hx(f), by - ht - 9); c.lineTo(hx(f) + wd / 2 + 3, by - ht); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,210,120,.55)'; c.fillRect(hx(f) - 3, by - ht + 4, 5, 5);
  }
  for (const f of [0.22, 0.5, 0.78]) { c.fillStyle = '#070912'; c.beginPath(); c.arc(hx(f), yH - 14, 8, 0, 7); c.fill(); c.fillRect(hx(f) - 1.5, yH - 8, 3, 10); }

  c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.beginPath(); c.roundRect(r.x, r.y, r.w, r.h, 18); c.stroke();

// --- the whole sky as a round map: zenith in the middle, north at the top, east on the left ---------------------
function drawAll(c, r, pr, lat, doy, time) {
  const t = T[lang]; panelBg(c, r, '#0b1030', '#070a1c');
  const R0 = Math.min(r.w, r.h - 30) / 2 - 17, cx = r.x + r.w / 2, cy = r.y + (r.h - 22) / 2 + 2;
  const XY = (al, az) => { const p = (90 - al) / 90 * R0; return [cx - p * Math.sin(az * R), cy - p * Math.cos(az * R)]; };
  c.save(); c.beginPath(); c.arc(cx, cy, R0, 0, 7); c.clip();
  const sg = c.createRadialGradient(cx, cy, 0, cx, cy, R0); sg.addColorStop(0, '#04061a'); sg.addColorStop(0.7, '#0e1a44'); sg.addColorStop(1, '#2a4678'); c.fillStyle = sg; c.fillRect(cx - R0, cy - R0, 2 * R0, 2 * R0);
  for (const b of pr.bg) { if (b[0] < 0.5) continue; const [x, y] = XY(b[0], b[1]); c.globalAlpha = b[3] * (0.75 + 0.25 * Math.sin(time * b[4] + b[5])); c.fillStyle = '#dfe8ff'; c.beginPath(); c.arc(x, y, b[2], 0, 7); c.fill(); }
  c.globalAlpha = 1;
  // the circle of stars that never set: every star closer to the pole than the latitude
  if (lat > 0) {
    const pts = []; for (let a = 0; a <= 360; a += 4) { const [al, az] = altaz(a, 90 - lat, lstMid(doy), lat); pts.push(XY(Math.max(0, al), az)); }
    c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.closePath();
    c.fillStyle = 'rgba(255,217,138,.07)'; c.fill(); c.setLineDash([5, 5]); c.strokeStyle = 'rgba(255,217,138,.75)'; c.lineWidth = 1.5; c.stroke(); c.setLineDash([]);
  }
  const labels = [];
  for (const k in G) {
    const g = G[k], a = pr.g[k], hi = k === 'dip' || k === 'cas';
    c.strokeStyle = hi ? 'rgba(255,217,138,.8)' : 'rgba(170,200,255,.5)'; c.lineWidth = hi ? 1.8 : 1.2; c.beginPath();
    for (const [i, j] of g.ln) { if (a[i][0] < 0 || a[j][0] < 0) continue; const A = XY(a[i][0], a[i][1]), B = XY(a[j][0], a[j][1]); c.moveTo(A[0], A[1]); c.lineTo(B[0], B[1]); }
    c.stroke();
    const vis = [];
    a.forEach((q, i) => { if (q[0] < 0.5) return; const [x, y] = XY(q[0], q[1]); starDot(c, x, y, q[2], hi ? '#ffe9b8' : g.st[i][3], 1); if (q[0] > 4) vis.push([x, y]); });
    if (vis.length >= Math.min(2, g.st.length) || (g.st.length === 1 && vis.length)) labels.push({ text: t.c[k], x: vis.reduce((s, p) => s + p[0], 0) / vis.length, y: Math.min(...vis.map((p) => p[1])) - 15, dir: -1 });
  }
  if (pr.pol[0] > 0) { const [px, py] = XY(pr.pol[0], pr.pol[1]); c.strokeStyle = '#fff1c0'; c.lineWidth = 1.4; c.beginPath(); c.arc(px, py, 6, 0, 7); c.stroke(); starDot(c, px, py, 1.98, '#fff7e0', 1); labels.push({ text: t.c.pol, x: px, y: py + 17, dir: 1 }); }
  placeLabels(c, labels, { x: cx - R0, y: cy - R0, w: 2 * R0, h: 2 * R0 });
  c.restore();
  c.strokeStyle = 'rgba(160,185,255,.55)'; c.lineWidth = 2; c.beginPath(); c.arc(cx, cy, R0, 0, 7); c.stroke();
  c.font = '900 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#cfdcff';
  c.fillText(t.dirs[0], cx, cy - R0 - 9); c.fillText(t.dirs[2], cx, cy + R0 + 9); c.fillText(t.dirs[1], cx - R0 - 9, cy); c.fillText(t.dirs[3], cx + R0 + 9, cy);
  pill(c, t.allSky, r.x + 8, r.y + 16, 'left');
  pill(c, dayLabel(doy), r.x + r.w - 8, r.y + 16, 'right');

}

// --- layout, loop ---------------------------------------------------------------------------------------------
function lay(w, h, v) {
  const wide = w >= 640, g = 8;
  if (v === 'orbit') return wide ? { orb: { x: 0, y: 0, w: w * 0.5 - g / 2, h }, sky: { x: w * 0.5 + g / 2, y: 0, w: w * 0.5 - g / 2, h } }
    : { orb: { x: 0, y: 0, w, h: h * 0.6 - g / 2 }, sky: { x: 0, y: h * 0.6 + g / 2, w, h: h * 0.4 - g / 2 } };
  return wide ? { orb: { x: 0, y: 0, w: w * 0.34 - g / 2, h }, sky: { x: w * 0.34 + g / 2, y: 0, w: w * 0.66 - g / 2, h } }
    : { orb: { x: 0, y: 0, w, h: h * 0.28 - g / 2 }, sky: { x: 0, y: h * 0.28 + g / 2, w, h: h * 0.72 - g / 2 } };
}
let LAY = null;
const gate = (v) => (v === 'always' && S.p.sky === null ? 'lock' : S.p[v] === null ? 'ask' : null);
function tick(dt) {
  if (S.rev) { S.rev.t += dt / 2.6; const e = ease(Math.min(1, S.rev.t)); S.d1 = S.rev.from + (S.rev.to - S.rev.from) * e; if (S.rev.t >= 1) S.rev = null; }
  else if (S.play && lab.view === 'orbit' && !S.drag) S.d1 = 1 + ((S.d1 - 1 + dt * 30) % 365);
  if (Math.abs(S.d1 - S.k1) >= 0.5) { S.k1 = S.d1; if (lab.view === 'orbit') update(); }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  tick(dt);
  const v = lab.view, L = lay(w, h, v); LAY = L;
  hitEl.hidden = !(v === 'orbit' && !gate(v));
  Object.assign(hitEl.style, { left: `${L.orb.x}px`, top: `${L.orb.y}px`, width: `${L.orb.w}px`, height: `${L.orb.h}px` });
  if (gate(v)) return;
  c.lineJoin = 'round';
  const doy = doyOf(v);
  if (v === 'orbit') { drawOrbit(c, L.orb, doy, true, time); drawWindow(c, L.sky, project(doy, curLat()), curLat(), time); }
  else if (v === 'sky') { drawOrbit(c, L.orb, doy, false, time); drawWindow(c, L.sky, project(doy, lat2()), lat2(), time); }
  else { drawOrbit(c, L.orb, doy, false, time); drawAll(c, L.sky, project(doy, curLat()), curLat(), doy, time); }
});

// --- controls --------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const names = (a) => a.map((k) => T[lang].c[k]).join(', ');
hitEl.addEventListener('pointerdown', (ev) => { S.drag = true; S.rev = null; hitEl.setPointerCapture?.(ev.pointerId); dragTo(ev); });
hitEl.addEventListener('pointermove', (ev) => { if (S.drag) dragTo(ev); });
['pointerup', 'pointercancel'].forEach((e) => hitEl.addEventListener(e, () => { S.drag = false; }));
function dragTo(ev) {
  if (!LAY) return;
  const b = $('stage').getBoundingClientRect(), o = LAY.orb, cx = b.left + o.x + o.w / 2, cy = b.top + o.y + o.h / 2;
  const theta = Math.atan2(-(ev.clientY - cy), ev.clientX - cx) / R;
  S.d1 = clamp(dayFromAngle(theta), 1, 365); S.play = false; update(); refreshPlay();
}
const refreshPlay = () => { $('playB').textContent = S.play ? T[lang].v1.pause : T[lang].v1.play; };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'play') { S.play = !S.play; S.rev = null; sfx.click(); }
  else if (act === 'month') { S.m2 = +b.dataset.i; sfx.tick(); }
  else if (act === 'city') { S.city = +b.dataset.i; S.south = false; sfx.tick(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'south') S.south = !S.south; else S.rise = !S.rise;
    sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'r1') { S.d1 = +ev.target.value; S.play = false; S.rev = null; refreshPlay(); update(); }
  else if (ev.target.id === 'r3') { S.d3 = +ev.target.value; update(); }
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const v = lab.view;
  if (b.dataset.go) { $('views').querySelector('[data-view="sky"]')?.click(); return; }
  const i = +b.dataset.i, ok = T[lang].ask[v].ok;
  S.p[v] = i; (i === ok ? sfx.good : sfx.bad)();
  if (v === 'orbit') { S.d1 = 15; S.rev = { from: 15, to: 196, t: 0 }; }
  render(); showStage();
});

// --- render: build the controls, then update the readout, state card and facts -------------------------------
function render() {
  const t = T[lang], v = lab.view, g = gate(v), open = secret.unlocked();
  $('c1').style.display = v === 'orbit' && !g ? '' : 'none';
  $('c2').style.display = v === 'sky' && !g ? '' : 'none';
  $('c3').style.display = v === 'always' && !g ? '' : 'none';
  askEl.hidden = !g;
  if (g === 'lock') askEl.innerHTML = `<div class="q">${esc(t.ask.always.q)}</div><p>${esc(t.lock)}</p><button class="go" data-go="1">${esc(t.lockGo)} →</button>`;
  else if (g) askEl.innerHTML = `<div class="q">${esc(t.ask[v].q)}</div><div class="opts">${t.ask[v].opts.map((o, i) => `<button data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  const cityChips = () => t.cities.map((n, i) => `<button class="chip ${i === S.city && !S.south ? 'on' : ''}" data-act="city" data-i="${i}">📍 ${esc(n)}</button>`).join('');
  const sc = (k, emo, label, on) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(label)}` : '🔒 ???'}</button>`;
  // verdict lines
  for (const [id, key] of [['v1v', 'orbit'], ['v2v', 'sky'], ['v3v', 'always']]) {
    const el = $(id), p = S.p[key];
    el.hidden = p === null;
    if (p !== null) { const a = t.ask[key], good = p === a.ok; el.className = `verd ${good ? 'ok' : 'no'}`; el.innerHTML = `<b>${esc(good ? t.right : a.w[p])}</b>${esc(a.rev)}`; }
  }
  $('r1').setAttribute('aria-label', t.v1.sl); $('r3').setAttribute('aria-label', t.v1.sl); $('h1').textContent = t.v1.hint; refreshPlay();
  $('l2m').textContent = t.v2.month;
  $('mchips').innerHTML = DOY2.map((d, i) => `<button class="chip ${i === S.m2 ? 'on' : ''}" data-act="month" data-i="${i}">${esc(dayLabel(d))}</button>`).join('');
  $('cchips2').innerHTML = cityChips(); $('cchips3').innerHTML = cityChips();
  $('sec2').innerHTML = sc('south', '🌏', t.sec.a[0], S.south); $('sec3').innerHTML = sc('rise', '⏱️', t.sec.b[0], S.rise);
  $('h2').textContent = t.v2.hint; $('h3').textContent = t.v3.hint;
  update();
}
function update() {
  const t = T[lang], v = lab.view, g = gate(v), fine = `<div class="fine">${esc(t.fine)}</div>`;
  if (v === 'orbit') $('r1').value = Math.round(S.d1);
  if (v === 'always') $('r3').value = Math.round(S.d3);
  if (g) { // asking: nothing that gives the answer away
    lab.setReadout('?', '', '', '#4ea8ff'); lab.setFacts([]);
    lab.setState({ emo: '🤔', title: g === 'lock' ? t.ask.always.q : t.ask[v].q, lead: g === 'lock' ? t.lock : '', body: '', extra: '' });
    return;
  }
  if (v === 'orbit') {
    lab.setGlow('rgba(255, 190, 80, .22)');
    const sa = sunRA(S.d1), dOri = angDiff(G.ori.c, sa), kind = dOri > 100 ? 'up' : dOri < 50 ? 'behind' : 'edge';
    const night = RING.filter((k) => angDiff(G[k].c, sa) > 100);
    lab.setReadout(dayLabel(S.d1), t.v1.sub, t.v1.pill[kind], '#ffbe50');
    const st = t.v1.st[kind];
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: t.v1.night(names(night)), extra: fine });
    lab.setFacts(t.facts.orbit);
  } else if (v === 'sky') {
    lab.setGlow('rgba(78, 168, 255, .24)');
    const doy = DOY2[S.m2], lat = lat2(), pr = project(doy, lat), label = dayLabel(doy);
    const ups = ALLN.filter((k) => meanAlt(pr.g[k]) > 8).sort((a, b) => meanAlt(pr.g[b]) - meanAlt(pr.g[a])), downs = ALLN.filter((k) => !ups.includes(k));
    lab.setReadout(label, `${t.cities[S.city]}${S.south ? ` → ${t.south}` : ''}`, `${Math.abs(lat).toFixed(1)}° ${lat >= 0 ? 'N' : 'S'}`.replace('N', t.dirs[0]).replace('S', t.dirs[2]), '#4ea8ff');
    let extra = fine;
    if (S.south) lab.setState({ emo: t.v2.south[0], title: t.v2.south[1], lead: t.v2.south[2], body: ups.length ? t.v2.up(names(ups)) : '', extra });
    else {
      if (S.m2 === 2) extra = `<div class="fine">${esc(t.v2.sco(t.cities[S.city], Math.round(90 - lat + G.sco.st[2][1])))}</div>` + fine;
      lab.setState({ emo: '🌌', title: t.v2.title(label), lead: ups.length ? t.v2.up(names(ups)) : t.v2.none, body: downs.length ? t.v2.down(names(downs)) : '', extra });
    }
    lab.setFacts(S.south ? t.facts.south : t.facts.sky);
  } else {
    lab.setGlow('rgba(255, 217, 138, .2)');
    const doy = S.d3, lat = curLat(), pr = project(doy, lat), label = dayLabel(doy);
    const dip = G.dip.st, lowK = dip.reduce((m, q, i) => (q[1] < dip[m][1] ? i : m, 0)), lowAlt = Math.round(lat - (90 - dip[lowK][1]));
    const upS = (k) => (meanAlt(pr.g[k]) > 5 ? t.v3.upS : t.v3.downS);
    lab.setReadout(label, t.cities[S.city], t.v3.pill, '#ffd98a');
    let extra = fine;
    if (S.rise) {
      const b = G.ori.st[0], r0 = riseTime(b[0], b[1], doy, lat), r1 = riseTime(b[0], b[1], doy + 1, lat), r30 = riseTime(b[0], b[1], doy + 30, lat);
      const wrap = (x) => (x > 12 ? x - 24 : x < -12 ? x + 24 : x), early1 = wrap(r0 - r1) * 60, early30 = wrap(r0 - r30);
      const fr = ((r0 - 12 + 24) % 24) / 24;
      extra = `<div class="rise"><div class="rbar"><i style="left:${(fr * 100).toFixed(1)}%"></i></div><div class="rlab"><span>12:00</span><span>18:00</span><span>00:00</span><span>06:00</span><span>12:00</span></div></div>
        <div class="fine">${esc(t.v3.rise(hhmm(r0), Math.round(early1), early30.toFixed(1)))} (${esc(t.v3.riseNote)})</div>` + fine;
    }
    lab.setState({ emo: '⭐', title: t.v3.title(label), lead: t.v3.st(upS('ori'), upS('sco')), body: t.v3.body(Math.round(lat), G.dip.nm[lowK], lowAlt), extra });
    lab.setFacts(S.rise ? t.facts.sid(sidText()) : t.facts.always(dm(90 - VEGA_DEC)));
  }
}
render();
