// --- drawing helpers ---------------------------------------------------------------------------------------
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, r)); };
// a dark rounded pill with text (>= 12 px), clamped inside the canvas
function pill(c, text, cx, cy, w, h, opt = {}) {
  c.save();
  c.font = `800 ${opt.size ?? 12}px Nunito, sans-serif`;
  const tw = c.measureText(text).width + 16, bh = 22;
  const x = clamp(cx - tw / 2, 4, Math.max(4, w - tw - 4)), y = clamp(cy - bh / 2, 4, Math.max(4, h - bh - 4));
  c.globalAlpha = 1; c.fillStyle = opt.bg ?? 'rgba(10,12,20,.84)'; rr(c, x, y, tw, bh, 11); c.fill();
  if (opt.line) { c.strokeStyle = opt.line; c.lineWidth = 1; c.stroke(); }
  c.fillStyle = opt.color ?? '#EDEFF7'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, x + tw / 2, y + bh / 2 + 1);
  c.restore();
}

    c.save(); c.beginPath(); c.rect(X0, SY0 - 6, xb - X0, NS * SSH + 8); c.clip();

  c.strokeStyle = '#7a6a48'; c.lineWidth = 1.2; c.stroke();
  g = c.createLinearGradient(0, 64, 0, 94); g.addColorStop(0, '#b4584a'); g.addColorStop(1, '#8a3a30'); c.fillStyle = g; rr(c, 25, 65, 52, 28, 3); c.fill();
  c.strokeStyle = 'rgba(255,220,200,.35)'; c.beginPath(); c.moveTo(25, 79); c.lineTo(77, 79); c.stroke();

  // trees

    c.strokeStyle = 'rgba(255,225,190,.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(hx + 1, 15); c.lineTo(hx + 17, 15); c.stroke();

// screen position of a point of the plan
const scr = (X, Y, sc, x, y) => [X + x * sc, Y + y * sc];

// --- the payment graph -----------------------------------------------------------------------------------------
function drawPay(c, w, h, time) {
  const sc = Math.min(w * 0.9 / SW, h * 0.26 / SH), sw = SW * sc, sx = (w - sw) / 2, sy = 8;
  const f = S.landRevealed ? S.cut * CUT[S.prov] : 0;

  const cal = S.sec !== null;
  // payment bar over the years: fills up to the price tick and beyond
  const by = sy + SH * sc + 12, bx0 = 22, bx1 = w - 22, bh = 16, bw = bx1 - bx0;
  const fullPaid = cal ? (S.sec === 'end' ? paidAt(Math.min(YEARS, 1907 - S.start)) : TOT) : (S.payRev ? paidAt(S.year) : 0);
  c.fillStyle = 'rgba(130,145,190,.16)'; rr(c, bx0, by, bw, bh, 8); c.fill();
  const bf = clamp01(fullPaid / TOT) * bw;

    const gg = c.createLinearGradient(bx0, 0, bx1, 0); gg.addColorStop(0, '#e0b050'); gg.addColorStop(1, CORAL);

    c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(bx0, by, bf, 4); c.restore();
  }
  const px = bx0 + PRICE / TOT * bw;
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(px, by - 4); c.lineTo(px, by + bh + 4); c.stroke();
  c.fillStyle = '#EDEFF7'; c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillText(String(PRICE), px, by + bh + 17);
  if (fullPaid > 0) { c.textAlign = 'left'; c.fillText(`${T[lang].pay.barLbl}: ${num(fullPaid)}`, bx0, by + bh + 17); }
  // graph frame

  c.fillStyle = 'rgba(10,12,20,.5)'; rr(c, 8, gy0 - 14, w - 16, gy1 - gy0 + 14 + 32, 14); c.fill();
  const d0 = cal ? 1861 : 0, d1 = cal ? 1932 : YEARS;
  const tx = (v) => gx0 + (v - d0) / (d1 - d0) * (gx1 - gx0), ty = (v) => gy1 - v / YM * (gy1 - gy0);
  c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.strokeStyle = 'rgba(190,205,255,.14)'; c.lineWidth = 1;

  c.textAlign = 'center'; c.textBaseline = 'top';
  for (const v of cal ? [1861, 1880, 1900, 1920] : [0, 10, 20, 30, 40, 49]) c.fillText(String(v), tx(v), gy1 + 5);
  c.strokeStyle = 'rgba(190,205,255,.4)'; c.beginPath(); c.moveTo(gx0, gy0); c.lineTo(gx0, gy1); c.lineTo(gx1, gy1); c.stroke();
  c.fillStyle = '#98A0B8'; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(T[lang].pay.yLbl, gx0 + 6, gy0 - 2);
  if (!cal) { c.textAlign = 'right'; c.fillText(T[lang].pay.xLbl, gx1, gy1 + 28); }
  // the price: a flat line
  c.strokeStyle = GOLD; c.lineWidth = 2; c.setLineDash([7, 5]); c.beginPath(); c.moveTo(gx0, ty(PRICE)); c.lineTo(gx1, ty(PRICE)); c.stroke(); c.setLineDash([]);
  pill(c, T[lang].pay.priceLbl, gx1 - 44, ty(PRICE) - 16, w, h, { color: GOLD, line: GOLD });
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (cal) {
    const s = S.start, e = s + YEARS, cutY = 1907;
    c.strokeStyle = 'rgba(232,115,90,.4)'; c.lineWidth = 2.5; c.setLineDash([2, 6]); c.beginPath(); c.moveTo(tx(s), ty(0)); c.lineTo(tx(e), ty(TOT)); c.stroke(); c.setLineDash([]);

  }
}

// --- the timeline of the reforms -----------------------------------------------------------------------------
const YR = [1861, 1875];
function drawTimeline(c, w, h, dt) {
  const t = T[lang].more, x0 = 36, x1 = w - 36, tx = (y) => x0 + (y - YR[0]) / (YR[1] - YR[0]) * (x1 - x0), cy = h / 2, amp = Math.min(10, h * 0.03);
  const ry = (x) => cy + Math.sin((x - x0) / (x1 - x0) * Math.PI * 2.2) * amp;
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#171c2e'); g.addColorStop(1, '#0f1320'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  // the river of time: a smooth band
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = 'rgba(95,140,200,.22)'; c.lineWidth = 18; c.beginPath();
  for (let x = x0 - 14; x <= x1 + 14; x += 6) (x === x0 - 14 ? c.moveTo(x, ry(x)) : c.lineTo(x, ry(x))); c.stroke();
  c.strokeStyle = 'rgba(190,205,255,.5)'; c.lineWidth = 2; c.beginPath();
  for (let x = x0 - 14; x <= x1 + 14; x += 6) (x === x0 - 14 ? c.moveTo(x, ry(x)) : c.lineTo(x, ry(x))); c.stroke();
  // yearly ticks
  c.fillStyle = 'rgba(190,205,255,.5)';
  for (let y = YR[0]; y <= YR[1]; y++) { c.beginPath(); c.arc(tx(y), ry(tx(y)), y === 1861 ? 0 : 2, 0, 7); c.fill(); }
  const nodes = [
    { y: 1861, dy: -0, start: true },
    ...T.en.more.reforms.map((r, i) => ({ y: r.y, dy: i % 2 === 0 ? -66 : 66, i })),
  ];
  const R = Math.min(26, w / 15);
  for (const nd of nodes) {
    const nx = tx(nd.y), base = ry(nx), ny = nd.start ? base : base + nd.dy * Math.min(1, h / 300);
    if (!nd.start) { c.strokeStyle = 'rgba(190,205,255,.35)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(nx, base); c.lineTo(nx, ny - Math.sign(nd.dy) * R); c.stroke(); }
    const lit = nd.start ? true : S.rlit[nd.i];
    if (!nd.start) S.litT[nd.i] += ((lit ? 1 : 0) - S.litT[nd.i]) * Math.min(1, dt * 7);
    const k = nd.start ? 1 : S.litT[nd.i], r = R * (nd.start ? 0.9 : 1) * (1 + (k > 0.5 ? 0.06 * Math.sin(k * 3.14) : 0));
    c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.arc(nx + 2, ny + 4, r, 0, 7); c.fill();
    const gg = c.createRadialGradient(nx - r * 0.4, ny - r * 0.4, 2, nx, ny, r);
    if (k > 0.5 || nd.start) { gg.addColorStop(0, '#ffe39a'); gg.addColorStop(1, '#c9902f'); } else { gg.addColorStop(0, '#3a4262'); gg.addColorStop(1, '#232943'); }
    c.fillStyle = gg; c.beginPath(); c.arc(nx, ny, r, 0, 7); c.fill();
    c.strokeStyle = k > 0.5 || nd.start ? '#fff3cf' : 'rgba(190,205,255,.4)'; c.lineWidth = 1.8; c.stroke();
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.globalAlpha = 1; c.fillStyle = '#fff';
    if (nd.start) { c.font = `${Math.round(r * 1.05)}px sans-serif`; c.fillText('🕊️', nx, ny + 1); }
    else if (k > 0.5) { c.font = `${Math.round(r * 1.0)}px sans-serif`; c.fillText(t.reforms[nd.i].emo, nx, ny + 1); }
    else { c.font = '900 18px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.fillText('?', nx, ny + 1); }
    // the year under or over the node, and the short tag once it is matched
    const out = nd.start ? 1 : Math.sign(nd.dy);
    const yy = nd.start ? ny + r + 18 : ny + out * (r + 16);
    pill(c, String(nd.y), nx, yy, w, h, { size: 12, color: '#D3D9E8' });
    if (!nd.start && k > 0.5) {
      const tag = typeof t.reforms[nd.i].tag === 'function' ? t.reforms[nd.i].tag(ARMY[0], ARMY[1]) : t.reforms[nd.i].tag;
      pill(c, tag, nx, yy + out * 26, w, h, { size: 12, color: GOLD, line: GOLD });
    }
  }
}

// --- animation loop ------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  S.afterV += (S.after - S.afterV) * Math.min(1, dt * 4);
  if (S.cutAnim) {
    S.cutT = Math.min(1, S.cutT + dt / 1.8); S.cut = ease(S.cutT);
    if (S.cutT >= 1) S.cutAnim = false;
    $('landSl').value = Math.round(S.cut * 100); paintLand();
  }
  if (S.payRev && S.revP < 1) S.revP = Math.min(1, S.revP + dt / 1.5);
  if (v === 'more') { drawTimeline(c, w, h, dt); return; }
  if (v === 'land' && S.step === 'pay') { drawPay(c, w, h, time); return; }
  const sc = Math.min(w * 0.94 / SW, h * 0.94 / SH), X = (w - SW * sc) / 2, Y = (h - SH * sc) / 2;
  const free = v === 'free';
  const f = free ? 0 : S.landRevealed ? S.cut * CUT[S.prov] : 0;
  drawScene(c, X, Y, sc, { f, tie: free ? S.afterV : 1, ring: free ? S.afterV : 0 });
  const P = (x, y) => scr(X, Y, sc, x, y), T_ = T[lang].plan;
  if (free) {

  }
  if (!free) {

    const xb = X0 + f * (X1 - X0), [sx, sy] = P((xb + X1) / 2, 128 + 6); pill(c, T_.strips, sx, sy + 8, w, h, { color: '#ffe7ae' });
  }

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect(), keep = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bar-keep')) || 0;

};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'fpick') { // view 1: sort a card
    if (S.fpick !== null) return;
    const card = T.en.fr.cards[FR_ORDER[S.ci]], j = +b.dataset.j;
    S.fpick = j; if (S.ci >= S.fright.length) S.fright[S.ci] = j === card.a;
    (j === card.a ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'fnext') {
    if (S.ci >= FR_ORDER.length - 1) { S.fdone = true; S.fpick = null; S.after = 0; sfx.click(); }
    else { S.ci++; S.fpick = null; sfx.click(); }
  } else if (a === 'fagain') { S.ci = 0; S.fpick = null; S.fright = []; S.fdone = false; S.after = 0; S.afterV = 0; sfx.click(); }
  else if (a === 'ftog') { S.after = +b.dataset.v; sfx.tick(); }
  else if (a === 'step') { S.step = b.dataset.s; sfx.click(); }
  else if (a === 'lpick') { // land: predict, then reveal
    S.landGuess = +b.dataset.j; S.landRevealed = true; S.cutAnim = true; S.cutT = 0; S.cut = 0;
    (S.landGuess === 2 ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'prov') { S.prov = b.dataset.p; S.cutAnim = false; if (S.cut < 0.5) S.cut = 1; $('landSl').value = Math.round(S.cut * 100); sfx.tick(); }
  else if (a === 'gdec') { S.payGuess = clamp(S.payGuess - 1, 1, YEARS); sfx.tick(); }
  else if (a === 'ginc') { S.payGuess = clamp(S.payGuess + 1, 1, YEARS); sfx.tick(); }
  else if (a === 'pcheck') { S.payRev = true; S.pverdict = true; S.revP = 0; S.year = CROSSY; $('yearSl').value = CROSSY; (S.payGuess === CROSSY ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'pagain') { S.payRev = false; S.pverdict = false; S.revP = 0; S.year = 0; S.sec = null; $('yearSl').value = 0; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    S.step = 'pay'; S.payRev = true; S.revP = 1; S.pverdict = false;
    if (S.sec === k) S.sec = null; else { S.sec = k; if (k === 'late' && S.start === 1861) S.start = 1875; $('startSl').value = S.start; }
    sfx.click(); showStage();
  } else if (a === 'rpick') {
    if (S.rpick !== null) return;
    const ri = RF_ORDER[S.ri], j = +b.dataset.j;
    S.rpick = j; if (S.ri >= S.rright.length) S.rright[S.ri] = j === ri;
    S.rlit[ri] = true; (j === ri ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'rnext') {
    if (S.ri >= RF_ORDER.length - 1) S.rdone = true; else S.ri++;
    S.rpick = null; sfx.click();
  } else if (a === 'ragain') { S.ri = 0; S.rpick = null; S.rright = []; S.rdone = false; S.rlit = [false, false, false, false]; S.litT = [0, 0, 0, 0]; sfx.click(); }
  render();
});
$('landSl').addEventListener('input', (ev) => { S.cutAnim = false; S.cut = +ev.target.value / 100; paintLand(); });

// --- one render per change ------------------------------------------------------------------------------------
function render() {
  const v = lab.view;
  document.body.dataset.v = v === 'land' && S.step === 'pay' ? 'pay' : v;
  $('secFree').style.display = v === 'free' ? '' : 'none';
  $('secLand').style.display = v === 'land' ? '' : 'none';
  $('secMore').style.display = v === 'more' ? '' : 'none';
  if (v === 'free') renderFree(); else if (v === 'land') renderLand(); else renderMore();
  lab.checkStage();
}

function renderFree() {
  const t = T[lang], f = t.fr, n = FR_ORDER.length;
  lab.setGlow('rgba(224, 176, 80, .24)');
  const dots = FR_ORDER.map((_, i) => (i < S.ci || (i === S.ci && S.fpick !== null) ? (S.fright[i] ? '●' : '◌') : i === S.ci ? '◉' : '○')).join(' ');
  if (S.fdone) {
    const k = S.fright.filter(Boolean).length;
    $('frBox').innerHTML = `<div class="em-grid c2">${f.tog.map((l, i) => `<button class="em-opt ${S.after === i ? 'good' : ''}" data-act="ftog" data-v="${i}">${esc(l)}</button>`).join('')}</div>
      <div class="em-nav"><button class="btn ghost" data-act="fagain">${esc(f.again)}</button></div>`;
    lab.setReadout(`${k}/${n}`, f.end(k, n), '', GOLD);
    const [tt, ll] = S.after ? f.after : f.before;
    lab.setState({ emo: S.after ? '🕊️' : '⛓️', title: tt, lead: ll, body: S.after ? f.endLead : '', extra: '' });
    lab.setFacts(t.facts.free);
    return;
  }
  const card = f.cards[FR_ORDER[S.ci]], j = S.fpick, a = T.en.fr.cards[FR_ORDER[S.ci]].a;
  $('frBox').innerHTML = `<div class="em-card"><small>${esc(f.count(S.ci + 1, n))}</small>${esc(card.t)}</div>
    <p class="em-q" style="margin-top:12px">${esc(f.q)}</p>
    <div class="em-grid c3">${f.bk.map((l, i) => `<button class="em-opt ${j === null ? '' : i === a ? 'good' : i === j ? 'bad' : 'dim'}" data-act="fpick" data-j="${i}" ${j === null ? '' : 'disabled'}>${esc(l)}</button>`).join('')}</div>
    <div class="em-nav">${j === null ? '' : `<button class="btn" data-act="fnext">${esc(S.ci >= n - 1 ? '✓' : f.next)}</button>`}</div>`;
  lab.setReadout(`${Math.min(S.ci + (j === null ? 0 : 1), n)}/${n}`, dots, '', GOLD);
  if (j === null) lab.setState({ emo: '🗂️', title: f.prompt, lead: f.promptLead, body: '', extra: '' });
  else lab.setState({ emo: j === a ? '✅' : '🤔', title: j === a ? f.right : f.wrong, lead: `${f.bk[a]}.`, body: card.why, extra: '' });
  lab.setFacts([]);
}

function renderLand() {
  const t = T[lang], l = t.land, p = t.pay;
  $('stepSeg').innerHTML = [['land', l.stepL], ['pay', l.stepP]].map(([k, lb]) => `<button data-act="step" data-s="${k}" class="${S.step === k ? 'on' : ''}">${esc(lb)}</button>`).join('');
  $('landBox').style.display = S.step === 'land' ? '' : 'none';
  $('payBox').style.display = S.step === 'pay' ? '' : 'none';
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('late', '🗓️') + sc('end', '✅');
  if (S.step === 'land') {
    lab.setGlow('rgba(224, 176, 80, .24)');
    $('lPick').innerHTML = S.landGuess === null ? `<p class="em-q">${esc(l.q)}</p><div class="em-grid c3">${l.opts.map((o, i) => `<button class="em-opt" data-act="lpick" data-j="${i}">${esc(o)}</button>`).join('')}</div>` : `<p class="em-q">${esc(l.q)}</p>
      <div class="em-grid c3">${l.opts.map((o, i) => `<button class="em-opt ${i === 2 ? 'good' : i === S.landGuess ? 'bad' : 'dim'}" disabled>${esc(o)}</button>`).join('')}</div>`;
    $('lRev').hidden = S.landGuess === null;
    $('slA').textContent = l.sl[0]; $('slB').textContent = l.sl[1]; $('lGo').textContent = l.toPay;
    $('provChips').innerHTML = ['mos', 'sim'].map((k) => `<button class="chip ${S.prov === k ? 'on' : ''}" data-act="prov" data-p="${k}">${esc(l.prov[k])}</button>`).join('');
    paintLand();
  } else renderPay();
}
// the readout and state of the land step follow the slider without touching the controls
function paintLand() {
  const t = T[lang], l = t.land;
  if (lab.view !== 'land' || S.step !== 'land') return;
  if (S.landGuess === null) {
    lab.setReadout('?', '', '', GOLD);
    lab.setState({ emo: '🌾', title: l.q, lead: l.lead0, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const share = CUT[S.prov] * S.cut * 100, over = S.prov === 'sim' && S.cut > 0.995, rest = 100 - share;
  lab.setReadout(`${over ? '≤ ' : ''}${num(rest)} %`, l.keep, share < 0.05 ? '' : l.lostPill(`${num(share)} %`, over), GOLD);
  const name = l.prov[S.prov];
  const verdict = S.landGuess === 2 ? l.right : l.wrong, end = S.cut >= 0.98;
  if (S.cut < 0.02) lab.setState({ emo: S.landGuess === 2 ? '✅' : '🤔', title: verdict, lead: l.revT, body: l.revLead, extra: '' });
  else lab.setState({ emo: '✂️', title: name, lead: l.cutT(`${over ? '> ' : ''}${num(share)} %`), body: `${verdict} ${l.revLead}${end ? ` ${l.cutLead(name)}` : ''}`, extra: end ? `<div class="em-fine">${esc(l.fine)}</div>` : '' });
  lab.setFacts(end ? t.facts.land : []);
}

function renderPay() {
  const t = T[lang], p = t.pay;
  lab.setGlow('rgba(232, 115, 90, .26)');
  const cal = S.sec !== null;
  $('pPick').innerHTML = S.payRev ? (cal ? '' : `<div class="em-nav" style="margin-top:0"><button class="btn ghost" data-act="pagain">${esc(p.again)}</button></div>`)
    : `<p class="em-q">${esc(p.rules)}</p><p class="em-q" style="margin-top:6px">${esc(p.q)}</p>
      <div class="em-step"><button class="em-sb" data-act="gdec" aria-label="−">−</button><b>${esc(p.year(S.payGuess))}</b><button class="em-sb" data-act="ginc" aria-label="+">+</button><button class="btn" data-act="pcheck">${esc(p.check)}</button></div>`;
  $('pRev').hidden = !S.payRev;
  $('yRow').hidden = cal; $('sRow').hidden = !cal;
  $('yA').textContent = '0'; $('yB').textContent = String(YEARS);
  $('sA').textContent = '1861'; $('sB').textContent = '1883';
  paintPay();
}
function paintPay() {
  if (lab.view !== 'land' || S.step !== 'pay') return;
  const t = T[lang], p = t.pay;
  if (S.sec) {
    const s = S.start, e = s + YEARS;
    if (S.sec === 'late') {
      lab.setReadout(num(TOT), p.lateSub, `${s}–${e}`, CORAL);
      lab.setState({ emo: '🗓️', title: t.secrets.late[0], lead: p.lateT(s, e), body: p.lateLead, extra: `<div class="em-fine">${esc(p.fine)}</div>` });
      lab.setFacts(t.facts.late);
    } else {
      const yrs = Math.min(YEARS, 1907 - s), paid = paidAt(yrs), left = Math.round((TOT - paid) * 10) / 10;
      lab.setReadout(num(paid), p.endSub, left > 0 ? `− ${num(left)}` : p.none, CORAL);
      lab.setState({ emo: '✅', title: t.secrets.end[0], lead: p.endT(num(paid), num(left)), body: p.endLead, extra: `<div class="em-fine">${esc(p.fine)}</div>` });
      lab.setFacts(t.facts.end);
    }
    return;
  }
  if (!S.payRev) {
    lab.setReadout('?', p.guessSub(S.payGuess), '', CORAL);
    lab.setState({ emo: '💰', title: p.q, lead: p.rules, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const y = S.year, paid = paidAt(y), diff = Math.round(Math.abs(paid - PRICE) * 10) / 10, over = paid > PRICE;
  lab.setReadout(num(paid), p.sub, over ? p.pillOver : p.pill(y), CORAL);
  const right = S.payGuess === CROSSY;
  if (S.pverdict) lab.setState({ emo: right ? '✅' : '🤔', title: right ? p.right : p.off(S.payGuess, CROSSY), lead: p.revLead(num(ANN), CROSSY, num(paidAt(CROSSY)), num(TOT)), body: '', extra: `<div class="em-fine">${esc(p.fine)}</div>` });
  else lab.setState({ emo: over ? '📈' : '💰', title: over ? p.aboveT : p.belowT, lead: `${p.cur(y, num(paid))}. ${over ? p.over(num(diff)) : p.short(num(diff))}`, body: '', extra: `<div class="em-fine">${esc(p.fine)}</div>` });
  lab.setFacts(t.facts.pay);
}

function renderMore() {
  const t = T[lang], m = t.more, n = RF_ORDER.length;
  lab.setGlow('rgba(143, 127, 208, .26)');
  const dots = RF_ORDER.map((_, i) => (i < S.ri || (i === S.ri && S.rpick !== null) ? (S.rright[i] ? '●' : '◌') : i === S.ri ? '◉' : '○')).join(' ');
  if (S.rdone) {
    const k = S.rright.filter(Boolean).length;
    $('mrBox').innerHTML = `<div class="em-nav" style="margin-top:0"><button class="btn ghost" data-act="ragain">${esc(m.again)}</button></div>`;
    lab.setReadout(`${k}/${n}`, m.end(k, n), '', '#8f7fd0');
    lab.setState({ emo: '🏛️', title: m.end(k, n), lead: m.endLead, body: '', extra: '' });
    lab.setFacts(t.facts.more);
    return;
  }
  const ri = RF_ORDER[S.ri], r = m.reforms[ri], j = S.rpick;
  $('mrBox').innerHTML = `<div class="em-card"><small>${esc(m.count(S.ri + 1, n))}</small>${esc(r.q)}</div>
    <p class="em-q" style="margin-top:12px">${esc(m.q)}</p>
    <div class="em-grid c2">${m.reforms.map((x, i) => `<button class="em-opt ${j === null ? '' : i === ri ? 'good' : i === j ? 'bad' : 'dim'}" data-act="rpick" data-j="${i}" ${j === null ? '' : 'disabled'}>${esc(x.n)} · ${x.y}</button>`).join('')}</div>
    <div class="em-nav">${j === null ? '' : `<button class="btn" data-act="rnext">${esc(S.ri >= n - 1 ? '✓' : m.next)}</button>`}</div>`;
  lab.setReadout(`${Math.min(S.ri + (j === null ? 0 : 1), n)}/${n}`, dots, '', '#8f7fd0');
  if (j === null) lab.setState({ emo: '🏛️', title: m.prompt, lead: m.promptLead, body: '', extra: '' });
  else lab.setState({ emo: j === ri ? '✅' : '🤔', title: `${j === ri ? m.right : m.wrong} ${r.n}, ${r.y}`, lead: r.lead, body: '', extra: '' });
  lab.setFacts([]);
}
render();
</script>
