let wood = null;
function paintWood(g, w, h) {
  const bg = g.createLinearGradient(0, 0, w, h);

  g.fillStyle = bg; g.fillRect(0, 0, w, h);

    const y0 = hash(i * 3.1) * h, amp = 2 + hash(i * 7.7) * 5, ph = hash(i * 1.9) * 6, dark = i % 3 !== 0;
    g.strokeStyle = dark ? `rgba(40,20,8,${0.05 + hash(i * 5.3) * 0.1})` : `rgba(255,214,160,${0.03 + hash(i * 2.3) * 0.05})`;
    g.lineWidth = 0.8 + hash(i * 9.1) * 2.2;
    g.beginPath();
    for (let x = 0; x <= w + 12; x += 12) { const y = y0 + Math.sin(x / 70 + ph) * amp; if (x) g.lineTo(x, y); else g.moveTo(x, y); }
    g.stroke();
  }
  const v = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,4,0,.55)');
  g.fillStyle = v; g.fillRect(0, 0, w, h);
}

    const g = cv.getContext('2d'); g.scale(d, d); paintWood(g, w, h); wood = { cv, w, h, d };

}

  c.strokeStyle = 'rgba(255,220,170,.3)'; c.beginPath(); c.moveTo(tx, ty + 4 * rowH + 1); c.lineTo(tx + tw, ty + 4 * rowH + 1); c.stroke();
  label(c, 'Σ', tx + 8, yS, { size: 14, color: '#d8c9ae' });
  label(c, '360°', tx + 72 - 44, yS, { size: 13, color: '#fff', align: 'left' });
  label(c, asked ? '= 1' : '= ?', tx + 72, yS, { size: 13, color: asked ? GREEN : '#b9ab94' });
  if (s.n) label(c, num(s.n), tx + tw - 4, yS, { size: 12, align: 'right', color: '#d8c9ae' });
}
function wheelAngleAt(ev) {
  const r = $('cv').getBoundingClientRect(), L = S.s.geo; if (!L) return null;
  const dx = ev.clientX - r.left - L.cx, dy = ev.clientY - r.top - L.cy;
  return { raw: ((Math.atan2(dx, -dy) * 180 / Math.PI - S.s.rot) % 360 + 360) % 360, dx, dy };
}
function startSpin(batch) {
  const s = S.s; if (s.anim || s.pred === null) return;
  const res = []; let theta = 0;
  for (let k = 0; k < (batch ? 400 : 1); k++) { theta = Math.random() * 360; res.push(sectorOf(theta)); }
  // the pointer reads the wheel angle -rot: the wheel must stop at a rotation congruent to -theta (mod 360)
  const from = s.rot, want = (((-theta) % 360) + 360) % 360;
  let to = from - (((from % 360) + 360) % 360) + want + 360 * (batch ? 2 : 4);
  if (to < from + 720) to += 360;
  s.anim = { from, to, t0: nowS(), dur: batch ? 1.5 : 1.9, res, batch };
  sfx.push(); dirty = true;
}
$('cv').addEventListener('pointerdown', (ev) => {
  const v = lab.view;
  if (v === 'die') {
    const L = S.d.geo; if (!L || S.d.pred === null) return;
    const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, i = Math.floor((y - L.y0) / L.rowH);
    if (i < 0 || i > 5 || x < L.tx - 8 || x > L.tx + L.tw + 8) return;
    const f = i + 1, at = S.d.ev.indexOf(f); if (at >= 0) S.d.ev.splice(at, 1); else S.d.ev.push(f);
    S.d.ev.sort((a, b) => a - b); sfx.tick(); dirty = true; render();
  } else if (v === 'spin') {
    const s = S.s, L = s.geo; if (!L || s.anim) return;
    const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    let best = -1, bd = 28;
    s.b.forEach((a, i) => {
      if (i === 0 && s.pred === null) return;
      const m = -Math.PI / 2 + ((a + s.rot) * Math.PI) / 180, px = L.cx + Math.cos(m) * (L.R - 5), py = L.cy + Math.sin(m) * (L.R - 5), d = Math.hypot(x - px, y - py);
      if (d < bd) { bd = d; best = i; }
    });
    if (best >= 0) { s.drag = best; try { $('cv').setPointerCapture(ev.pointerId); } catch { /* ignore */ } ev.preventDefault(); sfx.tick(); }
  }
});
$('cv').addEventListener('pointermove', (ev) => {
  const s = S.s; if (lab.view !== 'spin' || s.drag === null) return;
  const a = wheelAngleAt(ev); if (!a) return;
  const i = s.drag, cur = s.b[i], diff = ((a.raw - cur + 540) % 360) - 180;
  const lo = (i > 0 ? s.b[i - 1] : 0) + 10, hi = (i < 2 ? s.b[i + 1] : 360) - 10;
  const v = clamp(Math.round((cur + diff) / 5) * 5, lo, hi);
  if (v !== cur) { s.b[i] = v; s.n = 0; s.cnt = [0, 0, 0, 0]; dirty = true; sfx.tick(); }
});
const endDrag = () => { if (S.s.drag !== null) { S.s.drag = null; dirty = true; } };
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag);

canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  drawWood(c, w, h);
  if (lab.view === 'die') drawDie(c, w, h, dt, time);
  else if (lab.view === 'pin') { drawPinView(c, w, h, dt, time); gate(); }
  else drawSpin(c, w, h, dt, time);
  if (dirty) { dirty = false; live(); }
});
// a new question or button appears when throws cross a threshold: rebuild the controls once
function gate() {
  const sig = `${canQ2()}|${!S.sec && S.p.a2 !== null && E.pin.n >= 1000 && !S.p.revealed}|${curExp().n >= MAXN}`;
  if (sig !== S.p.sig) { S.p.sig = sig; render(); }
}

// --- controls --------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const optsHtml = (list, act, sel) => `<div class="pc-opts">${list.map((o, i) => `<button class="pc-opt" data-act="${act}" data-i="${i}"${sel === i ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
const chip = (act, k, text, off) => `<button class="chip pc-c" data-act="${act}" data-k="${k}"${off ? ' disabled' : ''}>${esc(text)}</button>`;
const verdict = (v) => (v ? `<p class="pc-v"><b class="${v.ok ? '' : 'no'}">${esc(v.head)}</b> ${esc(v.text)}</p>` : '');
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i, k = +b.dataset.k, t = T[lang], d = S.d, p = S.p, s = S.s;
  if (act === 'dn') { d.dn = DN[i]; (d.dn === 6 ? sfx.good : sfx.bad)(); if (d.dn === 6) showStage(); }
  else if (act === 'pe') { d.pred = i; d.ev = [2, 4, 6]; (isEven(i) ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'roll1' || act === 'roll10') {
    if (!d.rolling) { const n = act === 'roll1' ? 1 : 10; d.pend = Array.from({ length: n }, () => 1 + Math.floor(Math.random() * 6)); d.rolling = true; d.rollAt = nowS(); sfx.push(); }
  }
  else if (act === 'p1') { p.a1 = i; p.last = 1; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'p2') { p.a2 = i; p.last = 2; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'thr') { const e = curExp(), n = Math.min(k, MAXN - e.n - e.q); if (n > 0) { e.q += n; sfx.tick(); } }
  else if (act === 'reveal') { p.revealed = true; sfx.good(); showStage(); }
  else if (act === 'again') { E.pin = mkExp(newP(), 18); p.revealed = false; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const key = b.dataset.key; S.sec = S.sec === key ? null : key; sfx.click();
  }
  else if (act === 'sp') { s.pred = i; (OPT_SPIN[i] === 100 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'spin1') startSpin(false);
  else if (act === 'spin400') startSpin(true);
  dirty = true; render();
});

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('cv').style.touchAction = v === 'spin' ? 'none' : 'pan-y';
  const q = [], r = [];
  if (v === 'die') {
    const d = S.d;
    if (!(d.dn === 6)) q.push(`<div class="pc-q"><div class="q">${esc(t.die.q0)}</div>${optsHtml(DN.map((x) => `1/${x}`), 'dn', null)}</div>`);
    else if (d.pred === null) q.push(`<div class="pc-q"><div class="q">${esc(t.die.qE)}</div>${optsHtml(OPT_EVEN.map((g) => fs(fr(g[0], g[1]))), 'pe', null)}</div>`);
    else { const g = OPT_EVEN[d.pred], ok = isEven(d.pred); q.push(verdict({ ok, head: ok ? t.die.right : t.die.wrongT(fs(fr(g[0], g[1])), '1/2'), text: t.die.rightL('1/2') }), `<p class="pc-hint">${esc(t.die.hintTap)}</p>`); }
    r.push(`<div class="row2"><button class="chip pc-c" data-act="roll1">${esc(t.die.roll1)}</button><button class="chip pc-c" data-act="roll10">${esc(t.die.roll10)}</button></div>`);
  } else if (v === 'pin') {
    const p = S.p, e = curExp(), blocked = !S.sec && (p.a1 === null || canQ2()), big = !S.sec && p.a2 === null, full = e.n + e.q >= MAXN;
    if (!S.sec) {
      if (p.a1 === null) q.push(`<div class="pc-q"><div class="q">${esc(t.pin.q1)}</div>${optsHtml(t.pin.o1, 'p1', null)}</div>`);
      else if (canQ2()) q.push(`<div class="pc-q"><div class="q">${esc(t.pin.q2)}</div>${optsHtml(t.pin.o2, 'p2', null)}</div>`);
      else if (p.last === 1) q.push(verdict({ ok: p.a1 === 1, head: p.a1 === 1 ? t.die.right : t.die.notq, text: t.pin.v1[p.a1 === 1 ? 0 : p.a1 === 0 ? 1 : 2] }));
      else if (p.last === 2) q.push(verdict({ ok: p.a2 === 1, head: p.a2 === 1 ? t.die.right : t.die.notq, text: t.pin.v2[p.a2 === 1 ? 0 : 1] }));
    }
    const sizes = S.sec ? [1, 10, 100, 1000, 10000] : [1, 10, 100, 1000];
    r.push(`<div class="row2"${q.length && !S.sec ? '' : ' style="margin-top:0"'}><span class="lbl">${esc(t.pin.thr)}</span>${sizes.map((n) => chip('thr', n, `${num(n)}×`, blocked || full || (big && n >= 100))).join('')}</div>`);
    const extra = [];
    if (!S.sec && p.a2 !== null && E.pin.n >= 1000 && !p.revealed) extra.push(`<button class="btn pc-wide" data-act="reveal">${esc(t.pin.reveal)}</button>`);
    if (!S.sec && p.revealed) extra.push(`<button class="btn pc-wide" data-act="again">${esc(t.pin.again)}</button>`);
    if (extra.length) r.push(`<div class="row2">${extra.join('')}</div>`);
    const open = secret.unlocked(), sc = (key, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-act="sec" data-key="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
    r.push(`<div class="row2"><span class="lbl">${esc(t.pin.secLbl)}</span><div class="chips">${sc('coin', '🪙')}${sc('needle', '📍')}</div></div>`);
  } else {
    const s = S.s;
    if (s.pred === null) q.push(`<div class="pc-q"><div class="q">${esc(t.spin.q)}</div>${optsHtml(t.spin.o, 'sp', null)}</div>`);
    else { const ok = OPT_SPIN[s.pred] === 100; q.push(verdict({ ok, head: ok ? t.die.right : t.die.notq, text: t.spin.v[ok ? 0 : 1] })); }
    r.push(`<div class="row2"${s.pred === null ? '' : ' style="margin-top:0"'}><button class="chip pc-c" data-act="spin1"${s.pred === null || s.anim ? ' disabled' : ''}>${esc(t.spin.spin1)}</button><button class="chip pc-c" data-act="spin400"${s.pred === null || s.anim ? ' disabled' : ''}>${esc(t.spin.spin400)}</button></div>`);
    r.push(`<p class="pc-hint">${esc(s.pred === null ? t.spin.lock : t.spin.hint)}</p>`);
  }
  $('cbq').innerHTML = q.join(''); $('cbr').innerHTML = r.join('');
  live();
}

// --- readout, state card and facts: also called while throws and spins run ----------------------------------------
function live() {
  const t = T[lang], v = lab.view;
  let ro, st, facts;
  if (v === 'die') {
    lab.setGlow('rgba(214, 160, 80, .26)');
    const d = S.d, chosen = d.dn !== null;
    if (!(d.dn === 6)) {
      if (!chosen) { ro = ['?', t.die.subTot, '', '#e0b050']; st = { emo: '🎲', title: t.die.ask0[0], lead: t.die.ask0[1] }; }
      else {
        const tot = fr(6, d.dn), big = tot.n > tot.d;
        ro = [fs(tot), `6 × 1/${d.dn}`, '', '#e0b050'];
        st = { emo: '🤔', title: big ? t.die.bigT : t.die.smallT, lead: (big ? t.die.bigL : t.die.smallL)(fs(tot)) };
      }
    } else if (d.pred === null) { ro = ['?', t.die.subQ, '', '#e0b050']; st = { emo: '🎲', title: t.die.ok[0], lead: t.die.ok[1], body: t.die.ask1[1] }; }
    else {
      const k = d.ev.length, f = fs(fr(k, 6)), list = d.ev.join(', ');
      if (!k) { ro = ['0', t.die.subEv('–'), '', '#e0b050']; st = { emo: '🎲', title: t.die.evNone[0], lead: t.die.evNone[1] }; }
      else {
        ro = [f, t.die.subEv(list), d.rolls ? t.pills.roll(d.rolls) : '', '#e0b050'];
        const hits = d.ev.reduce((a, x) => a + d.tal[x - 1], 0);
        const even = JSON.stringify(d.ev) === '[2,4,6]', ok = isEven(d.pred);
        st = { emo: even ? (ok ? '✅' : '🤔') : '🎲', title: even ? (ok ? t.die.right : t.die.wrongT(fs(fr(OPT_EVEN[d.pred][0], OPT_EVEN[d.pred][1])), '1/2')) : t.die.evT(list, f), lead: even ? t.die.rightL(f) : t.die.evL, body: d.rolls ? t.die.evFreq(d.rolls, hits, dec(hits / d.rolls)) : '' };
      }
    }
    facts = [{ emo: '🎲', text: t.facts.die1, src: SRC.dice }];
  } else if (v === 'pin') {
    const p = S.p, e = curExp(), n = e.n, k = e.k;
    if (S.sec === 'coin') {
      lab.setGlow('rgba(240, 190, 80, .26)');
      ro = [n ? dec(k / n) : '?', n ? `${num(k)} / ${num(n)} ${t.pin.cUp}` : t.pin.cYl, n ? t.pills.coin(n) : '', '#e0b050'];
      st = n ? { emo: '🪙', title: t.pin.cT, lead: t.pin.cL(n, k, dec(k / n)), body: n >= 10000 ? t.pin.cB(n, k, dec(k / n, 4)) : '' } : { emo: '🪙', title: t.pin.cStart[0], lead: t.pin.cStart[1] };
      facts = [{ emo: '🪙', text: t.facts.coin, src: SRC.kerrich }];
    } else if (S.sec === 'needle') {
      lab.setGlow('rgba(190, 200, 230, .24)');
      ro = [k ? dec(2 * n / k, 3) : '?', k ? 'π ≈ 2 × n ÷ h' : t.pin.nNone, n ? t.pills.ndl(n) : '', '#d9dee8'];
      st = n ? { emo: '📍', title: t.pin.nT, lead: k ? t.pin.nL(n, k, dec(2 * n / k, 3)) : t.pin.nNone, body: t.pin.nB } : { emo: '📍', title: t.pin.nStart[0], lead: t.pin.nStart[1] };
      facts = [{ emo: '📍', text: t.facts.needle, src: SRC.buffon }];
    } else {
      lab.setGlow('rgba(229, 72, 77, .22)');
      const est = n ? dec(k / n) : '?';
      ro = [p.revealed ? dec(E.pin.p) : est, p.revealed ? t.pin.tr : n ? `${num(k)} / ${num(n)} ${t.pin.up}` : t.pin.yl, n ? t.pills.thr(n) : '', '#e5484d'];
      if (p.a1 === null) st = { emo: '🤔', title: t.pin.s0[0], lead: t.pin.s0[1] };
      else if (canQ2()) st = { emo: '🤔', title: t.pin.s2[0], lead: t.pin.s2[1] };
      else if (p.revealed) {
        const a = E.pin.hist[10], b = E.pin.hist[1000], pp = E.pin.p, ea = Math.abs(a - pp), eb = Math.abs(b - pp);
        st = { emo: '👁', title: t.pin.revT(dec(pp)), lead: t.pin.revL(dec(a), dec(b)), body: t.pin.revB(dec(ea), dec(eb), eb <= ea), extra: `<div class="fine" style="font-size:11px;color:var(--faint)">${esc(t.pin.note)}</div>` };
      }
      else if (p.a2 !== null && n >= 1000) st = { emo: '👁', title: t.pin.s4[0], lead: t.pin.s4[1] };
      else if (n === 0) st = { emo: '📌', title: t.pin.s1[0], lead: t.pin.s1[1] };
      else if (p.a2 !== null && n < 1000) st = { emo: '📌', title: t.pin.s3[0], lead: t.pin.sL(n, k, dec(k / n)), body: t.pin.s3[1] };
      else st = { emo: '📌', title: t.pin.sT, lead: t.pin.sL(n, k, dec(k / n)), body: t.pin.sB };
      if (!p.revealed) st.extra = `<div class="fine" style="font-size:11px;color:var(--faint)">${esc(t.pin.note0)}</div>`;
      facts = [{ emo: '📌', text: t.facts.pin, src: SRC.pin }];
    }
  } else {
    lab.setGlow('rgba(245, 184, 58, .24)');
    const s = S.s, ang = angles(), asked = s.pred !== null, P = fr(ang[0], 360);
    ro = [asked ? fs(P) : '?', asked ? t.spin.sub1 : t.spin.sub0, s.n ? t.pills.spin(s.n) : '', '#f5b83a'];
    if (!asked) st = { emo: '🎡', title: t.spin.s0[0], lead: t.spin.s0[1] };
    else if (s.n === 0) { const ok = OPT_SPIN[s.pred] === 100; st = { emo: ok ? '✅' : '🎡', title: ok ? t.die.right : t.spin.sTitle, lead: t.spin.v[ok ? 0 : 1], body: t.spin.sLead }; }
    else {
      const exp = s.n * ang[0] / 360, e1 = Number.isInteger(exp) ? String(exp) : dec(exp, 1);
      if (s.n === 400 && ang[0] === 90) st = { emo: '🎡', title: t.spin.chkT, lead: t.spin.chk(OPT_SPIN[s.pred], s.cnt[0], '100'), body: t.spin.cmpB };
      else st = { emo: '🎡', title: t.spin.cmpT, lead: t.spin.cmpL(s.n, s.cnt[0], e1), body: t.spin.cmpB };
    }
    facts = S.p.a2 !== null ? [{ emo: '📈', text: t.facts.lln, src: SRC.lln }] : []; // gated: it would answer the second prediction of Pin
  }
  lab.setReadout(ro[0], ro[1], ro[2], ro[3]);
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead ?? '', body: st.body ?? '', extra: st.extra ?? '' });
  lab.setFacts(facts);
}
render();
</script>
