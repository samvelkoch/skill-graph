const W = 360, H = 300;
let G = { w: 0, h: 0, s: 1, ox: 0, oy: 0 };
const ease = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const lerpn = (a, b, t) => a + (b - a) * t;
const pills = [];
const pill = (txt, dx, dy, o = {}) => pills.push({ txt, dx, dy, ...o });
const wrapText = (c, text, maxW) => {
  const out = []; let line = '';
  for (const w of String(text).split(' ')) {
    const tryL = line ? line + ' ' + w : w;
    if (line && c.measureText(tryL).width > maxW) { out.push(line); line = w; } else line = tryL;
  }
  if (line) out.push(line);
  return out;
};
function flushPills(c) {
  c.font = '800 12px Nunito, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'center'; c.lineJoin = 'round';
  for (const p of pills) {
    const maxW = Math.min(p.maxW || 170, G.w - 16), lines = wrapText(c, p.txt, maxW - 16);
    const tw = Math.max(...lines.map((l) => c.measureText(l).width)) + 16, th = lines.length * 15 + 8;
    const x = clamp(G.ox + p.dx * G.s, tw / 2 + 4, Math.max(tw / 2 + 4, G.w - tw / 2 - 4)), y = clamp(G.oy + p.dy * G.s, th / 2 + 4, Math.max(th / 2 + 4, G.h - th / 2 - 4));
    c.globalAlpha = p.a ?? 1;
    const bg = p.bg || 'rgba(10,12,20,.84)', edge = p.bg ? 'rgba(0,0,0,.28)' : 'rgba(255,255,255,.2)';
    c.fillStyle = bg; c.strokeStyle = edge; c.lineWidth = 1.2;
    if (p.tx != null) { // the tail of a speech bubble
      const tx = G.ox + p.tx * G.s, ty = G.oy + p.ty * G.s;
      if (ty > y + th / 2 + 3) {
        const bx = clamp(tx, x - tw / 2 + 14, x + tw / 2 - 14);
        c.beginPath(); c.moveTo(bx - 6, y + th / 2 - 2); c.lineTo(tx, ty); c.lineTo(bx + 6, y + th / 2 - 2); c.closePath(); c.fill(); c.stroke();
      }
    }
    c.beginPath(); c.roundRect(x - tw / 2, y - th / 2, tw, th, Math.min(14, th / 2)); c.fill(); c.stroke();
    if (p.tx != null) { // hide the seam between tail and bubble
      const tx = G.ox + p.tx * G.s, ty = G.oy + p.ty * G.s;
      if (ty > y + th / 2 + 3) { const bx = clamp(tx, x - tw / 2 + 14, x + tw / 2 - 14); c.fillRect(bx - 5, y + th / 2 - 3, 10, 3); }
    }
    c.fillStyle = p.fg || '#fff';
    lines.forEach((l, i) => c.fillText(l, x, y - th / 2 + 4 + 7.5 + i * 15 + 0.5));
  }
  c.globalAlpha = 1; pills.length = 0;
}

  const key = wKey(), gs = S.w.guess[key], f = wFlags(), vd = f[0] && f[1] && f[2], res = w.res[key], tried = Object.keys(S.w.guess).length;
  const days = `<div class="bn-lbl">${esc(w.whenL)}</div><div class="bn-row">${w.days.map((d, k) => `<button class="chip bn-c ${S.w.days === k ? 'on' : ''}" data-act="wd" data-v="${k}">${esc(d)}</button>`).join('')}<button class="chip bn-c ${S.w.days === 'all' ? 'on' : ''}" data-act="wd" data-v="all">${esc(w.all)}</button></div>`;
  const who = `<div class="bn-lbl">${esc(w.whoL)}</div><div class="bn-row">${w.who.map((x, k) => `<button class="chip bn-c ${S.w.who === ['friend', 'group'][k] ? 'on' : ''}" data-act="ww" data-v="${['friend', 'group'][k]}">${esc(x)}</button>`).join('')}</div>`;
  let body;
  if (gs == null) {
    lab.setReadout('?', w.hidT, '', '#ffd75e');
    lab.setState({ emo: '🤔', title: w.hidT, lead: w.hidL, body: '' }); lab.setFacts([]);
    body = `<p class="bn-q" style="margin-top:12px">${esc(w.q)}</p><div class="bn-opts row">${opt('wg', 'data-v="yes"', t.ui.yes)}${opt('wg', 'data-v="no"', t.ui.no)}</div>`;
  } else {
    const ok = (gs === 'yes') === !!vd, yes = f.filter(Boolean).length;
    lab.setReadout(`${yes}/3`, w.sub, '', '#ffd75e');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ui.right : t.ui.notq, lead: `${res[0]}.`, body: res[1] }); facts(t.facts.w);
    body = `<p class="bn-q" style="margin-top:12px">${esc(w.q)}</p><div class="bn-opts row">${opt('wg', 'disabled', t.ui.yes, gs === 'yes' ? (vd ? 'safe' : 'bad') : vd ? 'safe' : '')}${opt('wg', 'disabled', t.ui.no, gs === 'no' ? (!vd ? 'safe' : 'bad') : !vd ? 'safe' : '')}</div>${checkRows(t, f)}`;
  }
  return `${days}${who}${body}<p class="bn-note">${esc(w.tried(tried))} · ${esc(t.ui.dot)}</p>`;
}
function helpList() { return LISTS[S.h.mode][S.h.role]; }
function rHelp(t) {
  const h = t.h, md = S.h.mode, ri = ROLES.indexOf(S.h.role), a = S.h.act;
  if (!sortedAny()) {
    lab.setReadout('🔒', t.w.gateT, '', '#3ddc97');
    lab.setState({ emo: '🔎', title: t.w.gateT, lead: h.gateL, body: '' }); lab.setFacts([]);
    return `<p class="bn-q">${esc(h.gateL)}</p><button class="chip bn-c" data-act="gosort">${esc(t.w.gateBtn)}</button>`;
  }
  const total = ROLES.reduce((n, r) => n + LISTS[md][r].filter((k) => GOOD.has(k)).length, 0), found = Object.keys(S.h.found).filter((k) => k.startsWith(md + ':')).length;
  lab.setReadout(`${found}/${total}`, h.sub, '', '#3ddc97');
  if (a) {
    const g = GOOD.has(a);
    lab.setState({ emo: g ? '💚' : '⛔', title: g ? h.helps : h.nots, lead: h.a[a][2], body: h.a[a][3] });
    lab.setFacts(Object.keys(S.h.tried).some((k) => k.startsWith(`${md}:tell`)) ? t.facts.h : []);
  } else { lab.setState({ emo: '🤔', title: h.hidT, lead: h.hidL[md === 'play' ? 0 : 1], body: '' }); lab.setFacts([]); }
  const modes = `<div class="bn-row">${h.modes.map((x, k) => `<button class="chip bn-c ${md === ['play', 'online'][k] ? 'on' : ''}" data-act="hm" data-v="${['play', 'online'][k]}">${k ? '📱' : '🛝'} ${esc(x)}</button>`).join('')}</div>`;
  const roles = `<div class="bn-row" style="margin-top:8px">${h.roles.map((x, k) => `<button class="chip bn-c ${S.h.role === ROLES[k] ? 'on' : ''}" data-act="hr" data-v="${ROLES[k]}">${['🧒', '🧑', '🧑‍🏫'][k]} ${esc(x)}</button>`).join('')}</div>`;
  const opts = helpList().map((k) => {
    const tried = S.h.tried[`${md}:${k}`];
    return opt('ha', `data-k="${k}"`, h.a[k][0], tried ? (GOOD.has(k) ? 'safe' : 'bad') : '') + '';
  }).join('');
  return `${modes}${roles}<p class="bn-q" style="margin-top:12px">${esc(h.ask[ri])}</p><div class="bn-opts">${opts}</div>`;
}
function rOnline(t) {
  const o = t.on, k = S.on.c, g = S.on.guess[k], f = onFlags(k), vd = k === 1, cs = o.cases[k];
  const cases = `<div class="bn-row">${o.cases.map((x, j) => `<button class="chip bn-c ${k === j ? 'on' : ''}" data-act="oc" data-v="${j}">${esc(x.n)}</button>`).join('')}</div>`;
  if (g == null) {
    lab.setReadout('?', o.hidT, '', '#ffd75e'); lab.setState({ emo: '📱', title: o.hidT, lead: o.hidL, body: '' }); lab.setFacts([]);
    return `${cases}<p class="bn-say">${esc(cs.say)}</p><p class="bn-q">${esc(o.q)}</p><div class="bn-opts row">${opt('og', 'data-v="yes"', t.ui.yes)}${opt('og', 'data-v="no"', t.ui.no)}</div>`;
  }
  const ok = (g === 'yes') === vd, why = vd ? o.whyB : o.whyA;
  lab.setReadout(`${f.filter(Boolean).length}/3`, o.sub, '', '#ffd75e');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ui.right : t.ui.notq, lead: `${why[0]}.`, body: why[1] }); facts(t.facts.on);
  return `${cases}<p class="bn-say">${esc(cs.say)}</p>${checkRows(t, f)}<div class="bn-row bn-go"><button class="chip bn-c ${S.on.saved[k] ? 'on' : ''}" data-act="osave">${esc(o.save)}</button><button class="chip bn-c ${S.on.shown[k] ? 'on' : ''}" data-act="oshow">${esc(o.show)}</button></div><p class="bn-note">${esc(o.step)}</p>`;
}
function rTell(t) {
  const l = t.tl, i = S.tl.i, it = l.items[i], g = S.tl.guess[i], right = S.tl.guess.filter((x, j) => x != null && x === l.items[j].k).length;
  const chips = `<div class="bn-row">${l.items.map((x, j) => `<button class="chip bn-c ${j === i ? 'on' : ''}" data-act="ti" data-v="${j}">${S.tl.guess[j] != null ? '✓ ' : ''}${esc(x.n)}</button>`).join('')}</div>`;
  if (g == null) {
    lab.setReadout('?', l.hidT, '', '#ffd75e'); lab.setState({ emo: '🙋', title: l.hidT, lead: l.hidL, body: '' }); lab.setFacts([]);
    return `${chips}<p class="bn-say">${esc(it.say)}</p><p class="bn-q">${esc(l.q)}</p><div class="bn-opts">${opt('tg', 'data-v="help"', l.opts[0])}${opt('tg', 'data-v="trouble"', l.opts[1])}</div>`;
  }
  const ok = g === it.k;
  lab.setReadout(`${right}/4`, l.sub, '', '#ffd75e');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ui.right : t.ui.notq, lead: `${it.k === 'help' ? l.helpL : l.troubleL}.`, body: it.why }); facts(t.facts.tl);
  return `${chips}<p class="bn-say">${esc(it.say)}</p><div class="bn-opts">${opt('tg', 'disabled', l.opts[0], it.k === 'help' ? 'safe' : g === 'help' ? 'bad' : '')}${opt('tg', 'disabled', l.opts[1], it.k === 'trouble' ? 'safe' : g === 'trouble' ? 'bad' : '')}</div><p class="bn-note">${esc(l.hint)}</p>`;
}

// --- input ---------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v, i = +b.dataset.i;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  } else if (act === 'back') { S.sec = null; sfx.click(); }
  else if (act === 'sc') { S.sort.i = i; S.sort.at = S.clock; sfx.click(); }
  else if (act === 'cat') {
    const k = CATS[+b.dataset.j]; S.sort.ans[S.sort.i] = k; S.any = true; (k === verdict(SCENES[S.sort.i].f) ? sfx.good : sfx.bad)();
  } else if (act === 'next') {
    if (S.sort.i < 5) S.sort.i++; else { S.sort.ans = [null, null, null, null, null, null]; S.sort.i = 0; }
    S.sort.at = S.clock; sfx.click();
  } else if (act === 'gosort') { $('views').querySelector('[data-view="sort"]')?.click(); return; }
  else if (act === 'wd') { S.w.days = v === 'all' ? 'all' : +v; sfx.click(); }
  else if (act === 'ww') { S.w.who = v; sfx.click(); }
  else if (act === 'wg') {
    S.w.guess[wKey()] = v; const f = wFlags(); ((v === 'yes') === !!(f[0] && f[1] && f[2]) ? sfx.good : sfx.bad)();
  } else if (act === 'hm') { S.h.mode = v; S.h.act = null; sfx.click(); }
  else if (act === 'hr') { S.h.role = v; S.h.act = null; sfx.click(); }
  else if (act === 'ha') {
    const k = b.dataset.k; S.h.act = k; S.h.at = S.clock; S.h.tried[`${S.h.mode}:${k}`] = true;
    if (GOOD.has(k)) { S.h.found[`${S.h.mode}:${k}`] = true; sfx.good(); } else sfx.bad();
    showStage();
  } else if (act === 'oc') { S.on.c = +v; sfx.click(); }
  else if (act === 'og') { S.on.guess[S.on.c] = v; ((v === 'yes') === (S.on.c === 1) ? sfx.good : sfx.bad)(); }
  else if (act === 'osave') { S.on.saved[S.on.c] = true; S.on.tSave = S.clock; sfx.snap(); showStage(); }
  else if (act === 'oshow') { S.on.shown[S.on.c] = true; S.on.tShow = S.clock; sfx.good(); showStage(); }
  else if (act === 'ti') { S.tl.i = i === undefined || isNaN(i) ? +v : i; sfx.click(); }
  else if (act === 'tg') { S.tl.guess[S.tl.i] = v; (v === T[lang].tl.items[S.tl.i].k ? sfx.good : sfx.bad)(); }
  render();
});
render();
</script>
