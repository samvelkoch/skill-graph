    if (yi !== S.y[a.k] || done) { S.y[a.k] = done ? a.to : yi; render(); }
  }
  if (S.g.f !== null && S.hatch < 1) S.hatch = Math.min(1, S.hatch + dt / 1.1);
  // weights of the crown and the assembly for each scale
  const ids = new Set(Object.keys(S.placed));
  const target = ['f', 'e'].map((kk) => {
    if (v === 'paris') return kk === 'f' ? wAt('f', S.y.f) : START;
    if (v === 'london') return kk === 'e' ? wAt('e', S.y.e) : START;
    return lockedY ? START : wAt(kk, 1700, ids);
  });
  const act = L3 ? [!lockedY, !lockedY] : [k === 'f', k === 'e'];
  c.save(); c.translate(ox, oy); c.scale(sc, sc);
  [0, 1].forEach((i) => {
    const cur = S.cur[i], tg = target[i], r = Math.min(1, dt * 8);
    cur.c += (tg.c - cur.c) * r; cur.a += (tg.a - cur.a) * r;
    const sp = S.sp[i], tgA = -ANG * Math.tanh((tg.c - tg.a) / 6);
    sp.v += ((tgA - sp.a) * 55 - sp.v * 7.5) * dt; sp.a += sp.v * dt;
    const cx = i === 0 ? 95 : 265;
    drawScale(c, cx, sp.a, cur.c, cur.a, act[i] ? 1 : 0.38);
    pill(c, T[lang].names[i], cx, 206, fs(13), act[i] ? '#EDEFF7' : '#98A0B8', 'rgba(10,12,20,.82)');
    if (L3 && placedCount() === EVENTS.length) pill(c, T[lang].cv.end[i], cx, 232, fs(12.5), '#fff', i === 0 ? 'rgba(111,143,224,.55)' : 'rgba(224,112,95,.55)');
  });
  c.font = `700 ${fs(12.5)}px Nunito, sans-serif`; c.fillStyle = '#98A0B8'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(T[lang].legend, W / 2, 256);

  // the ribbon: 1600 to 1700, 3 px per year
  c.lineCap = 'round'; c.lineJoin = 'round';
  const drag = S.drag && yearAtClient(S.drag.cx, S.drag.cy), hot = L3 && !lockedY && (S.sel || S.drag);
  if (hot) {
    c.save(); c.strokeStyle = `rgba(255,255,255,${.35 + .25 * Math.sin(time * 5)})`; c.lineWidth = 1.5; c.setLineDash([5, 4]);
    c.beginPath(); c.roundRect(X0 - 14, 270, 300 + 28, 80, 14); c.stroke(); c.restore();
  }
  c.strokeStyle = 'rgba(130,145,190,.18)'; c.lineWidth = 1;
  [1600, 1625, 1650, 1675, 1700].forEach((yr) => { c.beginPath(); c.moveTo(X(yr), LY + 4); c.lineTo(X(yr), 344); c.stroke(); });
  c.lineWidth = 5; c.strokeStyle = 'rgba(130,145,190,.3)'; c.beginPath(); c.moveTo(X(1600), LY); c.lineTo(X(1700), LY); c.stroke();
  c.font = `700 ${fs(12)}px Nunito, sans-serif`; c.fillStyle = '#98A0B8'; c.textAlign = 'center'; c.textBaseline = 'middle';
  [1600, 1625, 1650, 1675, 1700].forEach((yr) => c.fillText(yr, Math.min(Math.max(X(yr), 18), W - 18), 358));
  if (k) {
    const col = COL[k], yf = S.yf[k], cap = capOf(k), pend = S.g[k] === null;
    c.strokeStyle = col; c.lineWidth = 5; c.beginPath(); c.moveTo(X(1600), LY); c.lineTo(X(yf), LY); c.stroke();
    if (k === 'e') { c.font = `700 ${fs(12)}px Nunito, sans-serif`; c.fillStyle = '#c9cfe3'; c.textAlign = 'left'; c.fillText(T[lang].cv.parl, X0 - 6, 272); }
    if (pend) { // the part of the ribbon that is still closed
      c.save(); c.beginPath(); c.roundRect(X(cap + 1), LY - 7, X(1700) - X(cap + 1) + 4, 14, 7); c.clip();
      c.fillStyle = 'rgba(150,160,190,.16)'; c.fillRect(X(cap + 1), LY - 7, 140, 14);
      c.strokeStyle = 'rgba(190,200,230,.4)'; c.lineWidth = 1.5;
      for (let sx = X(cap + 1) - 14; sx < X(1700) + 14; sx += 9) { c.beginPath(); c.moveTo(sx, LY + 7); c.lineTo(sx + 14, LY - 7); c.stroke(); }
      c.restore();
      c.font = `900 ${fs(16)}px Nunito, sans-serif`; c.fillStyle = 'rgba(210,216,236,.85)'; c.textAlign = 'center'; c.fillText('?', (X(cap + 1) + X(1700)) / 2, LY - 20);
    }
    for (const e of EVENTS) {
      if (e.k !== k || (pend && e.y > cap)) continue;
      const on = e.y <= yf;
      c.beginPath(); c.arc(X(e.y), LY, on ? 5.5 : 4, 0, 6.2832);
      if (on) { c.fillStyle = col; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.stroke(); } else { c.strokeStyle = col; c.lineWidth = 1.5; c.stroke(); }
    }
    if (k === 'f' && S.hatch > 0) { // the answer of part 1: no meeting for the rest of the century
      const x1 = X(1615), x2 = X(1615 + 85 * S.hatch);
      c.fillStyle = 'rgba(224,112,95,.22)'; c.strokeStyle = 'rgba(224,112,95,.85)'; c.lineWidth = 1.5;
      c.beginPath(); c.roundRect(x1, 309, Math.max(1, x2 - x1), 15, 7); c.fill(); c.stroke();
      if (S.hatch > .95) { c.font = `800 ${fs(12)}px Nunito, sans-serif`; c.fillStyle = '#f6c1b8'; c.textAlign = 'center'; c.fillText(T[lang].cv.nocall, (x1 + x2) / 2, 317); }
    }
    // the year marker
    pill(c, String(Math.round(yf)), X(yf), 289, fs(12.5), '#fff', col);
    c.beginPath(); c.arc(X(yf), LY, 8, 0, 6.2832); c.fillStyle = '#fff'; c.fill(); c.strokeStyle = col; c.lineWidth = 3; c.stroke();
  } else if (!lockedY) {
    for (const [id, yr] of Object.entries(S.placed)) {
      const e = EV[id], x = X(yr), col = COL[e.k], ly = [289, 322, 337][e.row];
      if (e.row) { c.strokeStyle = col; c.globalAlpha = .45; c.lineWidth = 1; c.beginPath(); c.moveTo(x, LY + 6); c.lineTo(x, ly - 8); c.stroke(); c.globalAlpha = 1; }
      c.beginPath(); c.arc(x, LY, 5.5, 0, 6.2832); c.fillStyle = col; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.stroke();
      c.font = `800 ${fs(12)}px Nunito, sans-serif`; c.fillStyle = e.k === 'f' ? '#a9bdf2' : '#f2a99e'; c.textAlign = 'center'; c.fillText(yr, x, ly);
    }
    if (drag !== null) {
      c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.5; c.setLineDash([4, 3]); c.beginPath(); c.moveTo(X(drag), 276); c.lineTo(X(drag), 344); c.stroke(); c.setLineDash([]);
      pill(c, String(drag), X(drag), 289, fs(12.5), '#0A0C14', '#fff');
    }
  } else {
    c.font = `800 ${fs(13)}px Nunito, sans-serif`; c.fillStyle = 'rgba(210,216,236,.75)'; c.textAlign = 'center'; c.fillText('🔒', W / 2, 288);
  }
  // secret overlays on the ribbon
  if (S.sec === 'long') {
    const x1 = X(1643), g = c.createLinearGradient(x1, 0, X(1700), 0); g.addColorStop(0, 'rgba(240,200,110,.9)'); g.addColorStop(1, 'rgba(200,150,60,.9)');
    c.fillStyle = g; c.strokeStyle = '#7a5420'; c.lineWidth = 1.2; c.beginPath(); c.roundRect(x1, 327, X(1700) - x1 + 8, 15, 7); c.fill(); c.stroke();
    c.font = `800 ${fs(12)}px Nunito, sans-serif`; c.fillStyle = '#2a1a05'; c.textAlign = 'center'; c.fillText(T[lang].cv.long, (x1 + X(1700)) / 2, 335);
  } else if (S.sec === 'law') {
    const x1 = X(1689), x2 = X(1700) + 18;
    c.fillStyle = '#7fd6a0'; c.strokeStyle = '#2f7a4d'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(x1, 329); c.lineTo(x2 - 6, 329); c.lineTo(x2 - 6, 325); c.lineTo(x2 + 6, 334.5); c.lineTo(x2 - 6, 344); c.lineTo(x2 - 6, 340); c.lineTo(x1, 340); c.closePath(); c.fill(); c.stroke();
    c.font = `800 ${fs(12)}px Nunito, sans-serif`; c.fillStyle = '#9fe6bb'; c.textAlign = 'right'; c.fillText(T[lang].cv.law, x1 - 6, 335);
  }
  c.restore();
  tPrev = time;
});

// --- part 3: placing events on the ribbon -------------------------------------------------------------------
function yearAtClient(cx, cy) { // the year under a screen point, or null when it is not on the ribbon
  const r = $('cv').getBoundingClientRect(), { sc, ox, oy } = S.geo;
  const px = (cx - r.left - ox) / sc, py = (cy - r.top - oy) / sc;
  if (py < 266 || py > 362 || px < 18 || px > 342) return null;
  return clamp(Math.round(1600 + (px - X0) / 3), 1600, 1700);
}
function place(id, auto) {
  S.placed[id] = EV[id].y; S.last = id; S.sel = null; S.fb = auto ? { id, auto: true } : null; sfx.good();
}
function dropTile(id, yr) {
  if (!EV[id] || S.placed[id]) return;
  if (Math.abs(yr - EV[id].y) <= TOL) place(id, false);
  else {
    S.miss[id] = (S.miss[id] || 0) + 1; sfx.bad();
    if (S.miss[id] >= 3) place(id, true); else S.fb = { id, dir: yr < EV[id].y ? 'early' : 'late' };
  }
  render();
}
let d0 = null, ghost = null;
const endDrag = () => { d0 = null; ghost?.remove(); ghost = null; S.drag = null; };
$('tiles').addEventListener('pointerdown', (ev) => {
  const b = ev.target.closest('.kp-tile'); if (!b) return;
  d0 = { id: b.dataset.id, x: ev.clientX, y: ev.clientY, moved: false };
});
addEventListener('pointermove', (ev) => {
  if (!d0) return;
  if (!d0.moved && Math.hypot(ev.clientX - d0.x, ev.clientY - d0.y) > 8) {
    d0.moved = true; ghost = document.createElement('div'); ghost.className = 'kp-ghost'; ghost.textContent = T[lang].ev[d0.id].n; document.body.append(ghost);
  }
  if (d0.moved) { ghost.style.left = `${ev.clientX}px`; ghost.style.top = `${ev.clientY}px`; S.drag = { id: d0.id, cx: ev.clientX, cy: ev.clientY }; }
});
addEventListener('pointerup', (ev) => {
  if (!d0) return;
  const d = d0, moved = d.moved; endDrag();
  if (moved) { const yr = yearAtClient(ev.clientX, ev.clientY); if (yr !== null) dropTile(d.id, yr); else render(); }
  else { S.sel = S.sel === d.id ? null : d.id; sfx.tick(); render(); }
});
addEventListener('pointercancel', endDrag);
$('cv').addEventListener('click', (ev) => {
  if (lab.view !== 'years' || !S.sel || locked3()) return;
  const yr = yearAtClient(ev.clientX, ev.clientY); if (yr !== null) dropTile(S.sel, yr);
});

// --- controls ------------------------------------------------------------------------------------------------
$('yr').addEventListener('input', (ev) => {
  const k = vk(); if (!k) return;
  const cap = capOf(k); let y = +ev.target.value;
  if (y > cap) { y = cap; ev.target.value = cap; }
  S.anim = null;
  const before = reachedEv(k, S.y[k])?.id;
  S.y[k] = S.yf[k] = y;
  if (reachedEv(k, y)?.id !== before) sfx.snap();
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const g = ev.target.closest('[data-g]');
  if (g) {
    const k = vk();
    if (!k || S.g[k] !== null) return;
    S.g[k] = +g.dataset.g; (S.g[k] === OK[k] ? sfx.good : sfx.bad)();
    S.anim = { k, to: AUTO[k] };
    render(); showStage(); return;
  }
  const go = ev.target.closest('[data-go]');
  if (go) { $('views').querySelector(`[data-view="${go.dataset.go}"]`)?.click(); return; }
  const sb = ev.target.closest('[data-act=sec]');
  if (sb) {
    if (!secret.unlocked()) { secret.open(); return; }
    S.sec = S.sec === sb.dataset.k ? null : sb.dataset.k; sfx.click(); render();
  }
});

// --- one render per change: controls, readout and the state card --------------------------------------------
const FINE = () => `<div class="fine">${esc(T[lang].fine)}</div>`;
function secState(t) {
  if (S.sec === 'long') return { emo: '⏳', title: t.sx.long.title(REIGN.y), lead: t.sx.long.lead(REIGN.y, REIGN.d), body: t.sx.long.body, extra: FINE() };
  return { emo: '📜', title: t.sx.law.title, lead: t.sx.law.lead, body: t.sx.law.body(NOW_Y - 1689), extra: FINE() };
}
function render() {
  const t = T[lang], k = vk(), both = bothGuessed();
  document.body.dataset.v = lab.view;
  $('secYear').hidden = !k; $('secTiles').hidden = !!k;
  if (!both) S.sec = null;
  const open = secret.unlocked();
  const chip = (key, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-act="sec" data-k="${key}"${both ? '' : ' disabled'}>${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = chip('long', '⏳') + chip('law', '📜');
  if (k) renderYear(t, k); else renderYears(t);
}
function renderYear(t, k) {
  const y = S.y[k], r = reachedEv(k, y), pend = S.g[k] === null, P = t.pred[k], i = k === 'f' ? 0 : 1, ok = S.g[k] === OK[k];
  $('pred').innerHTML = pend
    ? `<div class="kp-q">${esc(P.q)}</div><div class="kp-opts">${P.opts.map((o, j) => `<button class="kp-opt" data-g="${j}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="kp-v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.wrong)}</div><p class="kp-rev">${esc(P.rev)}</p>`;
  const yr = $('yr'); if (+yr.value !== y) yr.value = y;
  $('yrLbl').textContent = t.yearLbl; yr.setAttribute('aria-label', t.yearLbl);
  $('yrNote').textContent = pend ? t.lock(CAP[k]) : '';
  lab.setGlow(k === 'f' ? 'rgba(111, 143, 224, .28)' : 'rgba(224, 112, 95, .26)');
  lab.setReadout(String(y), t.names[i], r ? t.ev[r.id].n : '', COL[k]);
  if (S.sec) lab.setState(secState(t));
  else if (!r) lab.setState({ emo: '⚖️', title: `${t.names[i]}, ${y}`, lead: t.start[k], body: '', extra: FINE() });
  else { const e = t.ev[r.id]; lab.setState({ emo: r.emo, title: `${r.y} · ${e.n}`, lead: e.d, body: e.b, extra: FINE() }); }
  const list = (k === 'f' ? FACTS.paris : FACTS.london).filter(([, fy]) => y >= fy && !pend);
  lab.setFacts(list.map(([id, , emo, src]) => ({ emo, text: t.facts[id], src })));
}
function renderYears(t) {
  const locked = locked3(), N = EVENTS.length, p = placedCount(), y3 = t.y3, done = p === N;
  $('lockBox').hidden = !locked; $('tileBox').hidden = locked;
  lab.setGlow('rgba(224, 176, 80, .26)');
  if (locked) {
    $('lockBox').innerHTML = `<p>${esc(y3.lockText)}</p><div class="row2" style="margin-top:0">${S.g.f === null ? `<button class="btn ghost" data-go="paris">${esc(y3.goParis)}</button>` : ''}${S.g.e === null ? `<button class="btn ghost" data-go="london">${esc(y3.goLondon)}</button>` : ''}</div>`;
    lab.setReadout('🔒', '', '', '#e0b050');
    lab.setState(S.sec ? secState(t) : { emo: '🔒', title: y3.lockTitle, lead: y3.lockLead, body: '', extra: FINE() });
    lab.setFacts([]);
    return;
  }
  $('tileKey').innerHTML = ['f', 'e'].map((kk, i) => `<span><i style="background:${COL[kk]}"></i>${esc(y3.key[i])}</span>`).join('');
  $('tiles').innerHTML = ORDER.filter((id) => !S.placed[id]).map((id) => `<button class="kp-tile${S.sel === id ? ' sel' : ''}" data-id="${id}"><i style="background:${COL[EV[id].k]}"></i>${esc(t.ev[id].n)}</button>`).join('');
  $('tileNote').textContent = S.sel ? y3.tapNote : '';
  lab.setReadout(`${p}/${N}`, y3.placed, S.last && S.placed[S.last] ? String(S.placed[S.last]) : '', '#e0b050');
  let st;
  if (S.sec) st = secState(t);
  else if (S.fb && !S.fb.auto) st = { emo: '🤔', title: (S.fb.dir === 'early' ? y3.early : y3.late)(t.ev[S.fb.id].n), lead: y3.hint, body: '', extra: FINE() };
  else if (done) st = { emo: '⚖️', title: y3.endTitle, lead: y3.endLead, body: y3.endBody, extra: FINE() };
  else if (S.last) { const e = EV[S.last], x = t.ev[S.last]; st = { emo: e.emo, title: `${e.y} · ${x.n}`, lead: S.fb?.auto ? y3.auto(e.y) : x.d, body: S.fb?.auto ? x.d : x.b, extra: FINE() }; }
  else st = { emo: '📏', title: y3.introTitle, lead: y3.introLead, body: y3.introBody, extra: FINE() };
  lab.setState(st);
  lab.setFacts([['yf1', '🏛️', U.parl], ...(done ? [['yf2', '🤝', U.glor]] : [])].map(([id, emo, src]) => ({ emo, text: t.facts[id], src })));
}
render();
