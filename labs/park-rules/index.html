const W0 = 360, H0 = 300, TAU = Math.PI * 2;
const V = { s: 1, ox: 0, oy: 0, w: 360, h: 300 };
const c01 = (x) => clamp(x, 0, 1);
const ease = (t) => { t = c01(t); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - Math.pow(1 - c01(t), 3);
const back = (t) => { t = c01(t); return 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2); };
const lerpv = (a, b, t) => a + (b - a) * t;
const shade = (h, a) => { const n = parseInt(h.slice(1), 16), f = (v) => Math.round(clamp(a < 0 ? v * (1 + a) : v + (255 - v) * a, 0, 255));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map((v) => f(v).toString(16).padStart(2, '0')).join(''); };
const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const lg = (c, x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rg = (c, x, y, r0, r1, stops) => { const g = c.createRadialGradient(x, y, Math.max(0, r0), x, y, Math.max(0.1, r1)); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rr = (c, x, y, w, h, r) => { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); };
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); };

};
// a text pill in screen pixels (≥12 px), centre at screen (sx, sy), kept inside the canvas
function pill(c, text, sx, sy, o = {}) {
  const size = o.size || 12.5;
  c.save(); c.font = `800 ${size}px Nunito, system-ui, sans-serif`;
  const pw = c.measureText(text).width + 18, ph = size + 11;
  const x = clamp(sx - pw / 2, 4, Math.max(4, V.w - pw - 4)), y = clamp(sy - ph / 2, 4, Math.max(4, V.h - ph - 4));
  rr(c, x, y, pw, ph, ph / 2); c.fillStyle = o.bg || 'rgba(14,17,30,.82)'; c.fill();
  c.fillStyle = o.color || '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.globalAlpha = 1; c.fillText(text, x + pw / 2, y + ph / 2 + 0.5);

}

// --- secret: two cars, one road -----------------------------------------------------------------------------
function car(c, x, y, dir, col, wob) {

  c.fillStyle = '#20232e'; for (const [wx, wy] of [[-17, -16], [11, -16], [-17, 10], [11, 10]]) { rr(c, wx, wy, 11, 6, 2.5); c.fill(); }
  rr(c, -28, -14, 56, 28, 10); c.fillStyle = lg(c, -28, -14, 28, 14, [[0, shade(col, 0.4)], [0.5, col], [1, shade(col, -0.25)]]); c.fill(); c.strokeStyle = shade(col, -0.5); c.lineWidth = 1.4; c.stroke();

  c.beginPath(); c.moveTo(14, -9); c.lineTo(23, -7); c.lineTo(23, 7); c.lineTo(14, 9); c.closePath(); c.fillStyle = '#9fd6ff'; c.fill(); c.strokeStyle = 'rgba(0,0,40,.5)'; c.lineWidth = 1; c.stroke();
  c.beginPath(); c.moveTo(-12, -8); c.lineTo(-17, -6); c.lineTo(-17, 6); c.lineTo(-12, 8); c.closePath(); c.fillStyle = '#7fb4de'; c.fill();

}
const LANE_N = 120, LANE_S = 172;
function roadState(t) { // positions of both cars at time t for the chosen agreement
  const rule = S.rr, aY = rule === 1 ? LANE_N : LANE_S, bY = rule === 0 ? LANE_N : LANE_S, st = ease(t / 0.9);
  let ax = 44 + 70 * t, bx = 316 - 70 * t, jam = rule === 2;

}
function drawRoad(c, w, h, time) {

  c.fillStyle = lg(c, 0, 0, 0, 300, [[0, '#86d878'], [1, '#55b05a']]); c.fillRect(-100, -50, 580, 420);
  for (const [tx, ty, r] of [[30, 40, 22], [120, 28, 17], [250, 44, 24], [340, 30, 18], [60, 262, 24], [170, 276, 18], [290, 266, 23], [350, 252, 16]]) {
    c.fillStyle = 'rgba(0,50,10,.22)'; circ(c, tx + 5, ty + 6, r); c.fill(); c.fillStyle = rg(c, tx - r * 0.3, ty - r * 0.3, 1, r * 1.3, [[0, '#6fcf7c'], [1, '#2f8f4c']]); circ(c, tx, ty, r); c.fill();

  c.fillStyle = lg(c, 0, 92, 0, 200, [[0, '#4d5366'], [1, '#383d4d']]); c.fillRect(-100, 92, 580, 108);
  c.fillStyle = '#fff'; c.globalAlpha = 0.8; c.fillRect(-100, 96, 580, 2); c.fillRect(-100, 194, 580, 2); c.globalAlpha = 1;

  }

}

// --- ui -------------------------------------------------------------------------------------------------------
const optsHtml = (opts, guess, ok, reveal) => `<div class="pk-opts">${opts.map(([e, tx], i) => {

  return `<button class="pk-opt ${cls}" data-act="opt" data-o="${i}" ${guess === null ? '' : 'disabled'}><span class="pk-e">${e}</span><span class="pk-t">${esc(tx)}</span></button>`;
}).join('')}</div>`;
const verdictHtml = (good, text) => `<div class="pk-verdict ${good ? 'good' : ''}"><b>${esc(good ? T[lang].right : T[lang].notq)}</b>${text ? ' ' + esc(text) : ''}</div>`;
const chipsHtml = (names, sel, act, emos) => `<div class="pk-signs">${names.map((n, i) => `<button class="pk-sign ${sel === i ? 'sel' : ''}" data-act="${act}" data-i="${i}">${emos ? `<span class="pk-se">${emos[i]}</span>` : ''}<span>${esc(n)}</span></button>`).join('')}</div>`;

function renderCtrl() {

  } else if (m === 'watch') {

      h += `<div class="pk-sl"><label for="wsl" id="wlab">${esc(t.w.slider(S.wn))}</label><input id="wsl" class="big" type="range" min="0" max="6" step="1" value="${S.wn}" style="--track:linear-gradient(90deg,#ff7a6b,#ffd25a,#3ddc97)"></div><p class="pk-hint">${esc(t.w.sliderHint)}</p>`;

}
let rKey = '';
function renderInfo() {

  if (m === 'off') {

      lab.setReadout(`${n}/5`, t.tried, `${rs[0]} ${rs[1]}`, '#5fb87a');
    } else {

function render() { renderCtrl(); renderInfo(); }

// --- events ------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i, o = +b.dataset.o, m = mode();
  if (act === 'sign') {
    sfx.click();
    if (S.rule === i) { S.rule = null; S.guess = null; S.rev = false; S.ct = 0; } else { S.rule = i; S.guess = null; S.rev = false; S.ct = 0; }
  } else if (act === 'back') { sfx.click(); S.rule = null; S.guess = null; S.rev = false; S.ct = 0; }

  else if (act === 'rrule') { sfx.click(); S.rr = S.rr === i ? null : i; S.rg = null; S.rt = 0; S.rrev = false; }

  } else if (act === 'opt') {

    else if (m === 'swing' && S.sg === null) { S.sg = o; S.sim = 0; S.sdone = false; }
    else if (m === 'watch' && S.wg === null) { S.wg = o; S.wrev = false; resetWatch(); }
    else if (m === 'road' && S.rg === null) { S.rg = o; S.rt = 0; S.rrev = false; }
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'wsl') return;
  S.wn = +ev.target.value; resetWatch(); $('wlab').textContent = T[lang].w.slider(S.wn); renderInfo();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (mode() !== 'rights') return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const cd = CARDS.find((k) => x >= k.x && x <= k.x + k.w && y >= k.y && y <= k.y + k.h); if (!cd) return;
  if (S.pairs[cd.i]) return;
  if (!S.sel || S.sel.side === cd.side) { S.sel = { side: cd.side, i: cd.i }; sfx.tick(); }
  else if (S.sel.i === cd.i) { S.pairs[cd.i] = true; S.mt[cd.i] = 0; S.sel = null; sfx.snap(); if (S.pairs.every(Boolean)) { sfx.good(); } }
  else { const rr_ = cd.side === 0 ? cd.i : S.sel.i, jj = cd.side === 1 ? cd.i : S.sel.i; S.shake = { r: rr_, j: jj, t: 0 }; S.sel = null; S.msg = 3; sfx.bad(); }

// --- loop ---------------------------------------------------------------------------------------------------
function step(dt) {

    if (!S.rev && S.ct >= 3.2) { S.rev = true; S.tried.add(S.rule); (S.guess === T[lang].rules[S.rule].ok ? sfx.good : sfx.bad)(); render(); showStage(); }
  } else if (m === 'swing' && S.sg !== null && !S.sdone) {

  } else if (m === 'watch' && S.wg !== null) {
    S.wt += dt;
    if (S.wt > WATCH_LEAVE) S.wc = Math.max(0, S.wc - WATCH_RATE * (6 - S.wn) * dt);

      S.wrev = true; const ok = T[lang].w.ok, good = S.wg === ok; (good ? sfx.good : sfx.bad)();
      document.querySelectorAll('#ctrlBody .pk-opt').forEach((bt, i) => { bt.className = `pk-opt ${i === ok ? 'ok' : i === S.wg ? 'no' : 'dim'}`; });
      const vd = $('wverd'); if (vd) vd.innerHTML = verdictHtml(good, '');
    }
  } else if (m === 'road' && S.rg !== null && !S.rrev) {

  }
  const key = m === 'swing' ? Math.floor(S.sim / 60) : m === 'watch' ? Math.round(S.wc * 100) + (S.wt < WATCH_LEAVE ? 'a' : 'b') : '';
  if (key !== rKey) { rKey = key; renderInfo(); }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  step(dt);
  const m = mode();
  if (m === 'off') drawPark(c, w, h, time, { off: S.rev || S.guess !== null ? S.rule : -1, ct: S.ct, hl: S.rule !== null && S.guess === null ? S.rule : -1, pre: S.rule !== null && S.guess === null ? S.rule : -1 });

    if (S.wg !== null && S.wt >= 2.2) pill(c, T[lang].w.nobody, w / 2, h - 18);
  } else drawRoad(c, w, h, time);

render();
