// --- drawing helpers -------------------------------------------------------------------------------------------
// a glowing disc: soft halo out to gl, then the body with a lit side; pal = [core, mid, edge] as hex, A = opacity
function glowDisc(c, x, y, r, gl, A, pal, off = 0.25) {
  const g = c.createRadialGradient(x, y, r * 0.8, x, y, gl);
  g.addColorStop(0, rgba(pal[2], 0.5 * A)); g.addColorStop(1, rgba(pal[2], 0));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, gl, 0, TAU); c.fill();
  const d = c.createRadialGradient(x - r * off, y - r * off * (off > 0.4 ? 0 : 1), 0, x, y, r);
  d.addColorStop(0, rgba(pal[0], A)); d.addColorStop(0.65, rgba(pal[1], A)); d.addColorStop(1, rgba(pal[2], A));
  c.fillStyle = d; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}
// a star far away: a bright dot with a small glow
function dotStar(c, x, y, r, gl, col, A, glowA = 0.45) {
  const g = c.createRadialGradient(x, y, 0, x, y, gl);
  g.addColorStop(0, rgba(col, glowA * A)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, gl, 0, TAU); c.fill();
  c.fillStyle = rgba(col, A); c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}
function drawStars(c, w, h, time, place, vis) {
  for (const s of STARS) {
    const v = vis(s); if (v <= 0.01) continue;
    const [X, Y] = place(s.x * w, s.y * h, s);
    if (X < -20 || X > w + 20 || Y < -20 || Y > h + 20) continue;
    const tw = 0.88 + 0.12 * Math.sin(time * 1.6 + s.ph), a = (0.3 + 0.7 * s.b) * tw * v, r = 0.55 + s.b;
    if (s.b > 0.7) dotStar(c, X, Y, r, r * 5, s.tint, a, 0.4); else { c.fillStyle = rgba(s.tint, a); c.beginPath(); c.arc(X, Y, r, 0, TAU); c.fill(); }
  }
}
function label(c, text, x, y, size, col, align = 'center', A = 1) {
  c.save(); c.globalAlpha = A; c.font = `800 ${size}px Nunito, sans-serif`; c.textAlign = align; c.textBaseline = 'middle';
  c.shadowColor = 'rgba(0,0,0,.85)'; c.shadowBlur = 5; c.fillStyle = col; c.fillText(text, x, y); c.restore();
}
const emoji = (c, e, x, y, size) => { c.save(); c.globalAlpha = 1; c.fillStyle = '#fff'; c.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(e, x, y); c.restore(); };

// --- view 1: fly away ------------------------------------------------------------------------------------------
function nearest(logd) {
  let best = 0, bd = 9;
  STOPS.forEach(([, v], i) => { const df = Math.abs(Math.log10(v) - logd); if (df < bd) { bd = df; best = i; } });
  return { k: STOPS[best][0], diff: bd };
}
// the Sun seen from distance d: a disc of radius r (= R0 / d); when it gets tiny it becomes a bright dot that dims with distance
function drawSun(c, x, y, r, d) {
  const t = d <= 47 ? 0 : clamp(Math.log10(d / 47) / Math.log10(276000 / 47), 0, 1);
  const gl = Math.max(r * 2.6, clamp(60 / Math.sqrt(d), 6, 40));
  if (r >= 1.5) glowDisc(c, x, y, r, gl, 1, PAL_SUN);
  else dotStar(c, x, y, lerp(1.5, 1.4, t), gl, '#ffe2a0', lerp(1, 0.9, t), lerp(0.55, 0.3, t));
}
function drawFly(c, w, h, dt, time) {
  const a = F.anim;
  if (a) {
    const u = (time - a.t0) / a.dur;
    F.logd = lerp(a.from, a.to, ease(u));
    if (u >= 1) { F.logd = a.to; F.anim = null; a.end?.(); }
  }
  const rate = dt / (F.eT > F.e ? 3.5 : 1);
  F.e += clamp(F.eT - F.e, -rate, rate);
  if (F.phase === 'fly2' && F.e > 0.999) { F.phase = 'r2'; render(); }
  syncFly();

  c.fillStyle = '#03040a'; c.fillRect(0, 0, w, h);
  const oy = V.oy, ah = h - oy, cx = w / 2, cy = oy + ah / 2, R0 = 0.22 * Math.min(w, ah);
  const d = 10 ** F.logd, r = R0 / d, e = ease(F.e), kk = F.logd / LMAX;
  // stars drift a little with the flight; the trip to Alpha Centauri A pans and zooms the whole field
  const par = (x, y, s) => { const k = 1 - 0.08 * kk * s.depth; return [cx + (x - cx) * k, cy + (y - cy) * k]; };
  const A0 = STARS[0], ap = par(A0.x * w, A0.y * h, A0);
  const scx = lerp(cx, ap[0], e), scy = lerp(cy, ap[1], e), zoom = lerp(1, 1.7, e);
  const tr = (X, Y) => [cx + (X - scx) * zoom, cy + (Y - scy) * zoom];
  drawStars(c, w, h, time, (x, y, s) => { const [X, Y] = par(x, y, s); return tr(X, Y); }, (s) => (s === A0 ? 0 : 1));

  // Alpha Centauri A: a dot among the stars until we fly to it, then a sun of its own
  const [ax, ay] = tr(ap[0], ap[1]), ra = lerp(1.6, R0 * 0.85, Math.pow(e, 2.4));
  if (ra < 2.2) dotStar(c, ax, ay, 1.6, 8, '#fff4cc', 1, 0.45); else glowDisc(c, ax, ay, ra, ra * 2.4, 1, PAL_A);
  if (F.phase === 'q2') { c.strokeStyle = rgba('#ffffff', 0.5 + 0.3 * Math.sin(time * 3)); c.lineWidth = 1.5; c.beginPath(); c.arc(ax, ay, 14, 0, TAU); c.stroke(); }

  // our Sun
  const [sx, sy] = tr(cx, cy);
  if (sx > -R0 * 3 && sx < w + R0 * 3) drawSun(c, sx, sy, r, d);
  const n = nearest(F.logd);
  if (n.diff < 0.12 && e < 0.05) label(c, T[lang].f.stops[n.k], sx, Math.min(h - 12, sy + Math.min(r, ah * 0.3) + 24), 13, '#d3d9e8', 'center', (1 - n.diff / 0.12) * (1 - e * 20));
}
// readout, slider and chips follow the flight without rebuilding the controls
function syncFly() {
  if (S.sec) return;
  const t = T[lang], d = 10 ** F.logd, n = nearest(F.logd), at = n.diff < 0.08, key = `${lang}|${Math.round(d)}|${at ? n.k : ''}`;
  if (key !== F.key) {
    F.key = key;
    lab.setReadout(esc(t.f.au(Math.round(d))), at ? t.f.light[n.k] : '', '', '#ffb830');
    document.querySelectorAll('#stopChips .chip').forEach((b) => b.classList.toggle('on', at && b.dataset.stop === n.k));
  }
  const thr = $('thr'), v = Math.round(F.logd / LMAX * 1000);
  if (+thr.value !== v) thr.value = v;
}

// secret 1: zoom out from the Sun to the whole Milky Way
function drawGalaxy(c, w, h, time) {
  c.fillStyle = '#03040a'; c.fillRect(0, 0, w, h);
  const u = clamp((time - S.t0) / 7, 0, 1), e = ease(u), s1 = Math.min(w, h) * 0.46, s = Math.exp(lerp(Math.log(s1 * 14), Math.log(s1), e));
  const fx = lerp(SUN_GAL[0], 0, e), fy = lerp(SUN_GAL[1], 0, e), cx = w / 2, cy = h / 2;
  const P = (x, y) => [cx + (x - fx) * s, cy + (y - fy) * s];
  const [gx, gy] = P(0, 0);
  const hz = c.createRadialGradient(gx, gy, 0, gx, gy, s * 1.05);
  hz.addColorStop(0, 'rgba(255,215,160,.28)'); hz.addColorStop(0.3, 'rgba(150,165,230,.12)'); hz.addColorStop(1, 'rgba(100,120,200,0)');
  c.fillStyle = hz; c.beginPath(); c.arc(gx, gy, s * 1.05, 0, TAU); c.fill();
  const k = lerp(1.8, 1, e);
  for (const [list, col, al] of [[GAL.arm, '#b8ccff', 0.8], [GAL.arm2, '#ffffff', 0.7], [GAL.bulge, '#ffd9a0', 0.85]]) {
    c.fillStyle = rgba(col, al);
    for (const [x, y, z] of list) { const [X, Y] = P(x, y); if (X > -3 && X < w + 3 && Y > -3 && Y < h + 3) c.fillRect(X, Y, z * k, z * k); }
  }
  const [sx, sy] = P(SUN_GAL[0], SUN_GAL[1]);
  dotStar(c, sx, sy, 2.4, 11, '#ffd24a', 1, 0.7);
  const al = clamp((e - 0.3) / 0.4, 0, 1);
  if (al > 0) {
    c.strokeStyle = rgba('#ffffff', al * (0.55 + 0.3 * Math.sin(time * 3))); c.lineWidth = 1.5; c.beginPath(); c.arc(sx, sy, 11, 0, TAU); c.stroke();
    label(c, T[lang].sec.here, clamp(sx, 50, w - 50), sy - 24, 13, '#fff', 'center', al);
  }
}
// secret 2: two light pulses race to Earth; the Sun's takes 8 min 20 s (a timer, sped up), Alpha Centauri's 4.4 years (a calendar)
function drawLight(c, w, h, time) {
  c.fillStyle = '#03040a'; c.fillRect(0, 0, w, h);
  drawStars(c, w, h, time, (x, y) => [x, y], () => 0.3);
  const t = T[lang], el = time - S.t0, xs = 44, xe = w - 44, ys = [h * 0.27, h * 0.72], ps = [clamp(el / 3.2, 0, 1), clamp(el / 13, 0, 1)];
  const lanes = [{ e: '☀️', name: t.sec.sun, col: '#ffd24a', res: t.f.light.earth }, { e: '⭐', name: t.sec.alpha, col: '#ffe9a8', res: t.f.light.alpha }];
  lanes.forEach((L, i) => {
    const y = ys[i], p = ps[i], x0 = xs + 24, x1 = xe - 24, px = lerp(x0, x1, p);
    c.save(); c.setLineDash([4, 5]); c.strokeStyle = 'rgba(130,145,190,.4)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); c.restore();
    const tg = c.createLinearGradient(x0, 0, Math.max(px, x0 + 1), 0); tg.addColorStop(0, rgba(L.col, 0)); tg.addColorStop(1, rgba(L.col, 0.9));
    c.strokeStyle = tg; c.lineWidth = 3; c.beginPath(); c.moveTo(x0, y); c.lineTo(px, y); c.stroke();
    dotStar(c, px, y, 5, 18, L.col, 1, 0.6);
    emoji(c, L.e, xs, y, 30); emoji(c, '🌍', xe, y, 30);
    label(c, L.name, xs, y + 30, 12, '#98A0B8'); label(c, t.sec.earth, xe, y + 30, 12, '#98A0B8');
    if (p >= 1) {
      const fl = clamp(1 - (el - (i ? 13 : 3.2)) / 0.6, 0, 1);
      if (fl > 0) { c.strokeStyle = rgba(L.col, fl); c.lineWidth = 2; c.beginPath(); c.arc(xe, y, 18 + (1 - fl) * 22, 0, TAU); c.stroke(); }
      label(c, `✓ ${L.res}`, w / 2, y + 56, 13, '#fff', 'center', 1);
    }
  });
  // the timer for the Sun's light, counted fast
  const sec = 500 * ps[0], clock = `⏱ ${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
  label(c, clock, w / 2, ys[0] - 32, 24, '#ffd24a');
  // the calendar for the star's light: about 53 months flip by
  const m = Math.round(53 * ps[1]);
  if (m !== S.lm) { S.lm = m; S.flip = time; }
  const mi = S.cal + m, date = new Date(Math.floor(mi / 12), ((mi % 12) + 12) % 12, 1), loc = lang;
  c.save(); c.translate(w / 2, ys[1] - 40); c.scale(1, 0.6 + 0.4 * clamp((time - S.flip) / 0.12, 0, 1));
  c.fillStyle = '#f3f1ea'; c.beginPath(); c.roundRect(-58, -27, 116, 54, 8); c.fill();
  c.fillStyle = '#ff3b30'; c.beginPath(); c.roundRect(-58, -27, 116, 17, [8, 8, 0, 0]); c.fill();
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.font = '800 12px Nunito, sans-serif';
  c.fillText(String(date.getFullYear()), 0, -18);
  c.fillStyle = '#15182a'; c.font = '900 22px Nunito, sans-serif'; c.fillText(date.toLocaleDateString(loc, { month: 'short' }), 0, 6);
  c.restore();
}

// --- view 2: daytime stars -------------------------------------------------------------------------------------
function syncDay() {
  if (!D.started) return;
  const pct = Math.round(D.dim * 100), key = `${lang}|${pct}`;
  if (key !== D.key) { D.key = key; lab.setReadout(`${pct}%`, T[lang].d.dim, '', '#4ea8ff'); }
  const r = $('dimR'); if (+r.value !== pct) r.value = pct;
}
function drawDay(c, w, h, dt, time) {
  if (D.anim) { const u = (time - D.anim.t0) / D.anim.dur; D.dim = 1 - ease(u); if (u >= 1) { D.dim = 0; D.anim = null; } }
  D.moon += clamp((D.ans2 !== null ? 1 : 0) - D.moon, -dt / 1.2, dt / 1.2);
  syncDay();
  const dim = D.dim, night = 1 - dim, oy = V.oy, m = Math.min(w, h), gy = h * 0.95;
  const g = c.createLinearGradient(0, 0, 0, gy);
  g.addColorStop(0, mix('#2f78d6', '#02030b', night)); g.addColorStop(1, mix('#bfe3ff', '#0d1634', night));
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  // the stars are only there once the question is answered; the dimmer the day, the more of them show (the bright ones first)
  if (D.started) drawStars(c, w, h, time, (x, y) => [x, y], (s) => clamp((night - (1 - s.b) * 0.55) / 0.25, 0, 1));
  const sy = oy + (gy - oy) * 0.28 + 10, sr = m * 0.07;
  if (dim > 0.01) glowDisc(c, w * 0.72, sy, sr, sr * 5, dim, PAL_SUN);
  if (D.moon > 0.01) { // a pale half Moon, lit on the side that faces the Sun
    const mx = w * 0.26, my = sy + m * 0.05, mr = m * 0.06;
    c.save(); c.globalAlpha = D.moon * 0.9; c.fillStyle = '#f3f0e4'; c.beginPath(); c.arc(mx, my, mr, -Math.PI / 2, Math.PI / 2); c.closePath(); c.fill();
    c.globalAlpha = D.moon * 0.22; c.strokeStyle = '#f3f0e4'; c.lineWidth = 1; c.beginPath(); c.arc(mx, my, mr, 0, TAU); c.stroke(); c.restore();
  }
  // the town
  const body = mix('#27304f', '#05070f', night), la = clamp((0.6 - dim) / 0.3, 0, 1) * 0.85;
  c.fillStyle = body; c.fillRect(0, gy, w, h - gy);
  for (const b of BLD) {
    const bx = b.x * w, bw = b.bw * w, bh = b.bh * h, top = gy - bh;
    c.fillStyle = body; c.fillRect(bx, top, bw, bh + 1);
    if (la < 0.02) continue;
    const cols = Math.max(1, Math.floor((bw - 6) / 10)), rows = Math.max(1, Math.floor((bh - 8) / 12));
    c.fillStyle = rgba('#ffd877', la);
    for (let ry = 0; ry < rows; ry++) for (let cx = 0; cx < cols; cx++) if (b.win[(ry * cols + cx) % 90]) c.fillRect(bx + 5 + cx * 10, top + 6 + ry * 12, 5, 6);
  }
}

// --- view 3: star sizes ----------------------------------------------------------------------------------------
// pixels per solar radius for a step: the biggest star shown fills about a fifth of the stage, and the whole row must fit
function szScale(step, w, h) {
  const m = Math.min(w, h * 0.82);
  if (step === 4) return 0.95 * m / 700;
  const ids = [0, 1, 2, 3].filter((i) => i <= step), Rmax = Math.max(...ids.map((i) => SZ[i].R)), sumR = ids.reduce((x, i) => x + SZ[i].R, 0);
  return Math.min(0.22 * m / Rmax, (w - 28 - (ids.length - 1) * 12) / (2 * sumR));
}
function drawSizes(c, w, h, dt, time) {
  c.fillStyle = '#03040a'; c.fillRect(0, 0, w, h);
  drawStars(c, w, h, time, (x, y) => [x, y], () => 0.45);
  if (!Z.started) return;
  const t = T[lang], step = Z.step, lt = Math.log(szScale(step, w, h));
  if (Z.ls === null) Z.ls = lt;
  Z.ls += (lt - Z.ls) * Math.min(1, dt * 3.2);
  const s = Math.exp(Z.ls);
  // the Betelgeuze arc waits until the camera has almost arrived; at the last step only the Sun stays next to it
  for (let i = 0; i < 5; i++) {
    const want = i === 4 ? (step === 4 && Math.abs(Z.ls - lt) < 0.5 ? 1 : 0) : (i <= step && (step < 4 || i === 1) ? 1 : 0);
    Z.p[i] += clamp(want - Z.p[i], -dt / 0.7, dt / 0.7);
  }
  const cy = h * 0.44, gap = 12; let run = 16;
  const pos = SZ.map((q, i) => { const r = q.R * s, rv = Math.max(r, 3), x = run + Z.p[i] * rv; run += Z.p[i] * (2 * rv + gap); return { x, r }; });
  SZ.forEach((q, i) => {
    const p = Z.p[i], { x, r } = pos[i]; if (p < 0.01) return;
    if (r < 1.2) dotStar(c, x, cy, 1.3, 7, q.pal[0], p, 0.5);
    else if (i === 4) glowDisc(c, x, cy, r, r * 1.12, p, q.pal, 0.6);
    else glowDisc(c, x, cy, r, r * 1.6, p, q.pal);
  });
  if (step >= 3 && Z.p[1] > 0.5 && pos[1].r < 14) { // a tag for the tiny Sun
    const x = clamp(pos[1].x, 34, w - 34);
    c.strokeStyle = 'rgba(211,217,232,.6)'; c.lineWidth = 1; c.beginPath(); c.moveTo(pos[1].x, cy - 6); c.lineTo(pos[1].x, cy - 22); c.stroke();
    label(c, t.z.names.sun, x, cy - 32, 13, '#d3d9e8', 'center', Z.p[1]);
  }
  label(c, t.z.names[SZ[step].k], w / 2, h - 36, 16, '#fff'); label(c, t.z.times(t.z.n[step]), w / 2, h - 16, 14, '#ffd9a0');
}

// --- main loop --------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const want = askEl.style.display !== 'none' && askEl.offsetHeight ? askEl.offsetHeight + 14 : 0;
  V.oy += (want - V.oy) * Math.min(1, dt * 8);
  const v = lab.view;
  if (v === 'fly') { if (S.sec === 'galaxy') drawGalaxy(c, w, h, time); else if (S.sec === 'light') drawLight(c, w, h, time); else drawFly(c, w, h, dt, time); }
  else if (v === 'day') drawDay(c, w, h, dt, time);
  else drawSizes(c, w, h, dt, time);
  c.globalAlpha = 1;
});

};
const qCard = (q, opts) => `<div class="q">${esc(q)}</div><div class="opts">${opts.map((o, i) => `<button data-o="${i}">${esc(o)}</button>`).join('')}</div>`;
const verdict = (ok) => `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? T[lang].right : T[lang].wrong)}</div>`;
const vCard = (ok, text, go = true) => `${verdict(ok)}${text ? `<p>${esc(text)}</p>` : ''}${go ? `<div class="opts"><button data-go="1">${esc(T[lang].next)}</button></div>` : ''}`;
const setCard = (html) => { askEl.style.display = html ? '' : 'none'; askEl.innerHTML = html || ''; };
const fine = () => `<div class="fine">${esc(T[lang].fine)}</div>`;

askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const v = lab.view;
  if (b.dataset.o !== undefined) {
    const o = +b.dataset.o;
    if (v === 'fly' && F.phase === 'q1') {
      F.a1 = o; F.phase = 'fly1'; showStage();
      F.anim = { from: F.logd, to: LMAX, t0: now(), dur: 4, end: () => { F.phase = 'r1'; (F.a1 === 1 ? sfx.good : sfx.bad)(); render(); } };
    } else if (v === 'fly' && F.phase === 'q2') { F.a2 = o; F.phase = 'fly2'; F.eT = 1; (o === 2 ? sfx.good : sfx.bad)(); showStage(); }
    else if (v === 'day' && D.ans === null) { D.ans = o; (o === 1 ? sfx.good : sfx.bad)(); }
    else if (v === 'sizes' && Z.ans === null) { Z.ans = o; (o === 1 ? sfx.good : sfx.bad)(); }
  } else if (b.dataset.go) {
    sfx.click();
    if (v === 'fly') { if (F.phase === 'r1') F.phase = 'q2'; else if (F.phase === 'r2') { F.phase = 'free'; store.set('sunstar:done', true); } }
    else if (v === 'day') { D.started = true; D.dim = 1; D.anim = { t0: now(), dur: 5 }; showStage(); }
    else { Z.started = true; Z.step = 0; showStage(); }
  }
  render();
});

const goStop = (k) => {
  const to = Math.log10(STOPS.find(([n]) => n === k)[1]);
  F.anim = { from: F.logd, to, t0: now(), dur: clamp(Math.abs(to - F.logd) * 0.45 + 0.5, 0.6, 2.4) }; F.eT = 0; S.sec = null;
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (b.dataset.stop) { goStop(b.dataset.stop); sfx.tick(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; F.anim = null;
    if (S.sec) {
      S.t0 = now(); S.lm = -1; S.flip = -9;
      const d = new Date(); S.cal = d.getFullYear() * 12 + d.getMonth() - 53; // the light left about 53 months ago
    }
    sfx.click();
  } else if (act === 'again') { Object.assign(F, { phase: 'q1', a1: null, a2: null, logd: 0, anim: null, e: 0, eT: 0 }); S.sec = null; sfx.click(); }
  else if (b.dataset.o2 !== undefined) { D.ans2 = +b.dataset.o2; (D.ans2 === 0 ? sfx.good : sfx.bad)(); }
  else if (b.dataset.step !== undefined) { Z.step = +b.dataset.step; sfx.click(); }
  else if (act === 'znext') { Z.step = Math.min(4, Z.step + 1); sfx.click(); }
  render();
});
$('thr').addEventListener('input', () => {
  if (F.phase !== 'free') return;
  F.anim = null; F.eT = 0; F.logd = +$('thr').value / 1000 * LMAX;
  if (S.sec) { S.sec = null; render(); }
});
$('dimR').addEventListener('input', () => { D.anim = null; D.dim = +$('dimR').value / 100; });

// --- one render per change: controls, card over the stage, readout and the state card -------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secFly').style.display = v === 'fly' ? '' : 'none';
  $('secDay').style.display = v === 'day' ? '' : 'none';
  $('secSizes').style.display = v === 'sizes' && Z.started ? '' : 'none';
  $('ctrl').style.display = v === 'sizes' && !Z.started ? 'none' : '';
  if (v === 'fly') renderFly(t); else if (v === 'day') renderDay(t); else renderSizes(t);
}
const asking = (q, lead = '') => ({ emo: '🤔', title: q, lead, body: '', extra: fine() });
const cardOf = (a, lead, body, extra = '') => ({ emo: a[0], title: a[1], lead: lead ?? a[2], body: body ?? a[3], extra: extra + fine() });

function renderFly(t) {
  const f = t.f, free = F.phase === 'free', open = secret.unlocked();
  F.key = '';
  lab.setGlow('rgba(255, 184, 48, .22)');
  $('thrLbl').textContent = f.throttle; $('endL').textContent = f.stops.earth; $('endR').textContent = f.stops.alpha;
  $('thr').disabled = !free; $('thr').setAttribute('aria-label', f.throttle);
  $('stopChips').innerHTML = STOPS.map(([k]) => `<button class="chip" data-stop="${k}"${free ? '' : ' disabled'}>${esc(f.stops[k])}</button>`).join('');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}"${open && !free ? ' disabled' : ''}>${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('galaxy', '🌌') + sc('light', '💡');
  $('againB').textContent = `↻ ${f.again}`; $('againB').style.display = free ? '' : 'none';
  const ph = F.phase, ok1 = F.a1 === 1, ok2 = F.a2 === 2;
  setCard(ph === 'q1' ? qCard(f.q1, f.o1) : ph === 'r1' ? vCard(ok1, f.r1) : ph === 'q2' ? qCard(f.q2, f.o2) : ph === 'fly2' ? vCard(ok2, '', false) : ph === 'r2' ? vCard(ok2, f.r2) : null);
  if (S.sec) {
    const k = S.sec, emo = k === 'galaxy' ? '🌌' : '💡';
    lab.setReadout(emo, t.secrets[k][1], '', '#ffd24a');
    lab.setState({ emo, title: t.secrets[k][0], lead: t.sec[`${k}Text`], body: '', extra: fine() });
    return;
  }
  F.key = ''; syncFly();
  lab.setState(free ? cardOf(t.st.fly)
    : ph === 'q1' || ph === 'fly1' ? asking(f.q1) : ph === 'r1' ? asking(f.q1, f.r1)
    : ph === 'r2' ? asking(f.q2, f.r2) : asking(f.q2));
}

function renderDay(t) {
  const d = t.d, ans = D.ans, st = D.started;
  lab.setGlow('rgba(78, 168, 255, .24)');
  $('dimWrap').style.display = st ? '' : 'none';
  $('dimLbl').textContent = d.dim; $('dimR').setAttribute('aria-label', d.dim);
  $('dayQ2').style.display = st ? '' : 'none';
  const a2 = D.ans2;
  $('dayQ2').innerHTML = a2 === null ? qCard(d.q2, d.o2).replace(/data-o=/g, 'data-o2=')
    : `<div class="verdict" style="color:${a2 === 0 ? 'var(--ok)' : 'var(--wip)'}">${esc(a2 === 0 ? t.right : t.wrong)}</div><p>${esc(d.r2)}</p>`;
  setCard(ans === null ? qCard(d.q, d.o) : !st ? vCard(ans === 1, '') : null);
  if (!st) { lab.setReadout('?', '', '', '#4ea8ff'); lab.setState(asking(d.q)); return; }
  D.key = ''; syncDay();
  const link = a2 === null ? '' : `<a class="mlink" href="../moon/?lang=${lang}">${esc(t.moon)}</a><br>`;
  lab.setState(cardOf(t.st.day, d.r, `${t.st.day[2]} ${t.st.day[3]}`, link));
}

function renderSizes(t) {
  const z = t.z, ans = Z.ans, st = Z.started, step = Z.step;
  lab.setGlow('rgba(255, 106, 42, .2)');
  setCard(ans === null ? qCard(z.q, z.o) : !st ? vCard(ans === 1, '') : null);
  if (!st) { lab.setReadout('?', '', '', '#ff6a2a'); lab.setState(asking(z.q)); return; }
  $('szChips').innerHTML = SZ.map((q, i) => `<button class="chip ${i === step ? 'on' : ''}" data-step="${i}">${esc(z.names[q.k])}</button>`).join('');
  $('znext').textContent = t.next; $('znext').style.display = step >= 4 ? 'none' : '';
  lab.setReadout(esc(z.names[SZ[step].k]), z.times(z.n[step]), '', '#ff6a2a');
  lab.setState(step === 4 ? cardOf(t.st.sizes, z.r, z.most) : cardOf(t.st.sizes));
}
render();
</script>
</body>
</html>
