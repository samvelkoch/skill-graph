  $('hSnk').hidden = !H.snk; $('hSel').hidden = H.snk; $('hQ').hidden = H.snk;
  if (H.snk) {
    $('aimT').textContent = sn.aim; $('aimL').textContent = sn.full; $('aimR').textContent = sn.glance;
    const busy = Q.run && !Q.done;
    $('aim').disabled = busy;
    $('hAct').innerHTML = `<button class="btn" data-act="shoot"${busy ? ' disabled' : ''}>${esc(sn.shoot)}</button><button class="chip bk-chip push" data-act="snkoff">${esc(sn.back)}</button>`;
    return;
  }
  const seg = (key, cur) => [0, 1].map((i) => `<button data-act="sel${key}" data-i="${i}" class="${cur === i ? 'on' : ''}">${esc(i ? h.heavy : h.light)} · ${MS[i]} ${h.kg}</button>`).join('');
  $('hSel').innerHTML = `<span class="lbl">${esc(h.striker)}</span><div class="card seg small">${seg('a', H.a)}</div><span class="lbl">${esc(h.target)}</span><div class="card seg small">${seg('b', H.b)}</div>`;
  $('hQ').innerHTML = `<div style="height:12px"></div>` + qHtml(h.q, h.o, H.guess, outcomeH().k, H.shown);
  $('hAct').innerHTML = (H.shown ? `<button class="btn" data-act="hagain">${esc(t.again)}</button>` : '') + secretChip('snk', '🎯', t.secrets.stop[0]).replace('chip secret', 'chip secret push');
}
function ctrlK(t) {
  const k = t.k, um = UNIT_M[lang];
  if (K.phase === 'free') {
    $('kSel').innerHTML = `<span class="lbl">${esc(k.hLbl)}</span><div class="card seg small">${[0.5, 1, 1.5, 2].map((x) => `<button data-act="kh" data-h="${x}" class="${K.h === x ? 'on' : ''}">${fmt(x, x % 1 ? 1 : 0)} ${um}</button>`).join('')}</div>`;
    $('kQ').innerHTML = '';
    $('kAct').innerHTML = `<button class="btn" data-act="kdrop">${esc(K.run ? k.dropAgain : k.drop)}</button>`;
  } else {
    $('kSel').innerHTML = '';
    $('kQ').innerHTML = K.phase === 'ask1' ? qHtml(k.q1, k.o1, K.guess, 2, K.shown) : qHtml(k.q2, k.o2, K.guess, 2, K.shown);
    $('kAct').innerHTML = K.shown ? `<button class="btn push" data-act="knext">${esc(t.next)}</button>` : '';
  }
}
function render() {
  const t = T[lang], v = lab.view;
  $('secC').hidden = v !== 'cradle'; $('secH').hidden = v !== 'heavy'; $('secK').hidden = v !== 'clay';
  if (v === 'cradle') { ctrlC(t); infoC(t); } else if (v === 'heavy') { ctrlH(t); infoH(t); } else { ctrlK(t); infoK(t); }
}
const showStage = () => { // on a phone the controls sit below the picture: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v = lab.view, i = +b.dataset.i;
  if (a === 'pick') {
    if (v === 'cradle') { if (C.guess !== null) return; C.guess = i; releaseC(); }
    else if (v === 'heavy') { if (H.guess !== null) return; H.guess = i; H.run = true; H.v[0] = V0 * PX2; sfx.push(); }
    else { if (K.guess !== null) return; K.guess = i; K.run = true; K.t = 0; }
    showStage();
  } else if (a === 'cnext') {
    resetC(); if (C.phase === 'ask1') { C.phase = 'ask2'; holdC(2); } else C.phase = 'free';
    sfx.click();
  } else if (a === 'pullk') { resetC(); holdC(+b.dataset.k); sfx.click(); }
  else if (a === 'pull3') { if (!secret.unlocked()) return secret.open(); resetC(); holdC(3); sfx.click(); }
  else if (a === 'letgo') releaseC();
  else if (a === 'sela') { H.a = i; resetH(); sfx.tick(); }
  else if (a === 'selb') { H.b = i; resetH(); sfx.tick(); }
  else if (a === 'hagain') { resetH(); sfx.click(); }
  else if (a === 'snk') { if (!secret.unlocked()) return secret.open(); H.snk = true; resetQ(); sfx.click(); }
  else if (a === 'snkoff') { H.snk = false; resetH(); sfx.click(); }
  else if (a === 'shoot') { resetQ(); Q.v[0] = [QV, 0]; Q.run = true; sfx.push(); }
  else if (a === 'knext') {
    if (K.phase === 'ask1') { K.phase = 'ask2'; resetK(2); } else { K.phase = 'free'; K.ghost = null; resetK(K.h === 2 ? 1 : K.h); }
    sfx.click();
  } else if (a === 'kh') { resetK(+b.dataset.h); sfx.tick(); }
  else if (a === 'kdrop') { resetK(K.h); K.run = true; sfx.push(); }
  render();
});
$('aim').addEventListener('input', (ev) => { Q.aim = +ev.target.value / 100; resetQ(); render(); });
$('cv').addEventListener('pointerdown', () => { if (lab.view === 'cradle' && C.phase === 'free' && C.held) { releaseC(); render(); } });

resetC(); holdC(1); resetH(); resetQ(); resetK(1);
render();
canvasLoop($('cv'), (c, w, h, dt) => {
  const v = lab.view;
  if (v === 'cradle') { stepC(dt); drawCradle(c, w, h); readoutC(); }
  else if (v === 'heavy') { if (H.snk) stepQ(dt); else stepH(dt); drawHeavy(c, w, h); }
  else { stepK(dt); drawClay(c, w, h); }
  if (C.dirty || H.dirty || K.dirty || Q.dirty) { C.dirty = H.dirty = K.dirty = Q.dirty = false; render(); }
});
</script>
