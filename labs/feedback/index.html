}
function sceneDrafts(c, w, h, dt) {

// --- secret b: the sandwich test -------------------------------------------------------------------------------
const SB_VAL = [[[0.2, 0.8], [0.92, 0.78]], [[0.15, 0.75], [0.95, 0.82]], [[0.25, 0.8], [0.9, 0.76]]];
const swapOf = (i) => i === 1;

  const sw = swapOf(rd), pan = [sw ? 1 : 0, sw ? 0 : 1]; // index of version (0 wrapped, 1 straight) on left, right

// --- main loop -------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  SC = Math.min(w / W, h / H); TIME = time;
  bgWall(c, w, h);
  c.save(); c.translate((w - W * SC) / 2, (h - H * SC) / 2); c.scale(SC, SC);

// --- controls & render -----------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const btn = (act, txt, extra = '', cls = '') => `<button class="fb-b ${cls}" data-act="${act}" ${extra}>${esc(txt)}</button>`;
const secRow = (t) => {
  const open = secret.unlocked(), one = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="fb-lbl">${esc(t.secLbl)}</div><div class="chips">${one('a', '🦋')}${one('b', '🥪')}</div>`;

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, d = b.dataset;
  if (a === 'sec') {

  } else if (a === 'pick') { S.g.sel = d.id; sfx.tick(); }

  else if (a === 'greset') { S.g = mkG(); sfx.click(); }
  else if (a === 'rreact') reactR(d.v);
  else if (a === 'rnext') { if (S.r.i >= 5) { S.r = mkR(); } else { S.r.i++; S.r.phase = 'react'; S.r.out = null; S.r.asked = false; S.r.cm = 0.6; if (S.r.i < 5 && COMM[S.r.i].kind === 'pers') S.r.mood = Math.max(0.1, S.r.mood - 0.25); } sfx.click(); }
  else if (a === 'play') { S.k.t = 0.001; S.k.playing = true; sfx.click(); }
  else if (a === 'kcard') { if (!S.k.sent) { const s = S.k.slots, i = s.indexOf(d.id); if (i >= 0) s[i] = null; else { const e = s.indexOf(null); if (e >= 0) s[e] = d.id; } sfx.tick(); } }

  else if (a === 'kclear') { S.k.slots = [null, null, null]; S.k.sent = false; S.k.applied = null; S.k.res = null; S.k.t = 0; S.k.playing = false; sfx.click(); }

  else if (a === 'dpick') dPick(d.k);

  else if (a === 'spred') { S.s.pred = d.v; S.s.done = true; const ok = d.v === 'straight'; if (ok) S.s.rights++; (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'snext') { if (S.s.round >= 2) S.s = { round: 0, pred: null, done: false, rights: 0, rev: 0 }; else { S.s.round++; S.s.pred = null; S.s.done = false; S.s.rev = 0; } sfx.click(); }

});
function giveGuess(v) {
  const g = S.g, card = CARDS.find((x) => x[0] === g.sel); if (!card) return;
  const kind = card[1], ans = kind === 'spec' ? 'both' : kind === 'pers' ? 'noa' : 'none', now_ = now();
  if (kind === 'spec') { g.t[card[2]] = 1; g.mood = Math.min(1, g.mood + 0.14); g.spec++; g.glyph = '💡'; g.hop = now_; }
  else if (kind === 'vague') { g.shrug = now_; g.glyph = '🤷'; }
  else { g.mood = Math.max(0.04, g.mood - 0.3); g.glyph = '💔'; }
  g.glyphAt = now_; g.used[g.sel] = true; g.res = { ok: v === ans, kind }; g.sel = null;
  (g.res.ok ? sfx.good : sfx.bad)(); showStage();
}
function reactR(v) {

  if (v === 'ask') { r.asked = true; r.phase = 'asked'; r.cm = Math.min(1, r.cm + 0.15); r.out = P ? 'askP' : 'askU'; sfx.click(); return; }

const KIND = { S1: 'star', S2: 'star', W1: 'wish', W2: 'wish', V: 'x', P: 'x' };
function sendK() {
  const k = S.k, s = k.slots; if (s.includes(null)) return;

const DORD = [[0, 1, 2], [1, 2, 0], [2, 0, 1], [1, 0, 2], [0, 2, 1]];

function render() {

function ctlG(t) {

function ctlR(t) {
  const r = S.r, tr = t.r, P = r.i < 5 && COMM[r.i].kind === 'pers';

function ctlK(t) {

    html += `<div class="fb-list">${['V', 'W2', 'S1', 'P', 'S2', 'W1'].map((id) => `<button class="fb-b ${k.slots.includes(id) ? 'on' : ''}" data-act="kcard" data-id="${id}" ${k.sent ? 'disabled' : ''}>${esc(tk.c[id])}</button>`).join('')}</div>`;
    html += `<div class="row2">${k.sent ? btn('kclear', tk.retry) : `${btn('ksend', tk.send, filled < 3 ? 'disabled' : '', 'go')}${btn('kclear', tk.clear)}`}</div><div class="fb-hint">${esc(tk.hint)}</div>`;

function ctlA(t) {
