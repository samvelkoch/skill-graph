// '.' grass, '#' hedge (a wall), '~' pond, '*' flower bed (decoration), 'S' strawberry. d: 0 up, 1 right, 2 down, 3 left.
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const mk = (rows, x, y, d) => {
  const g = { rows, start: { x, y, d }, goal: null };
  rows.forEach((r, yy) => [...r].forEach((ch, xx) => { if (ch === 'S') g.goal = { x: xx, y: yy }; }));

};
const kinds = (...ks) => ks.map((k) => ({ k }));
const seq = (s) => kinds(...s);
const rep = (n, ks) => ({ k: 'rep', n, c: kinds(...ks) });
const cellAt = (g, x, y) => (x < 0 || y < 0 || x > 5 || y > 5 ? '#' : g.rows[y][x]);
const isWall = (g, x, y) => cellAt(g, x, y) === '#';

function assignIds(prog) {
  let n = 0;
  const go = (list) => list.forEach((x) => { x.id = n++; if (x.c) go(x.c); });
  go(prog);
}
function topOf(prog, id) {
  let n = 0;
  for (let i = 0; i < prog.length; i++) {
    const x = prog[i], start = n; n++;
    if (x.c) n += x.c.length;
    if (id >= start && id < n) return i;
  }
  return -1;
}

// runs the program; trace[0] is the start, trace[i] the state after step i (bi = id of the block that ran)
function run(g, prog, stopOnGoal) {
  assignIds(prog);
  const s = { x: g.start.x, y: g.start.y, d: g.start.d }, tr = [{ ...s, bi: -1, kind: 'S' }];
  let over = false;
  const push = (bi, kind, q) => { tr.push({ x: s.x, y: s.y, d: s.d, bi, kind, q }); if (tr.length > 300) over = true; };
  const ahead = () => isWall(g, s.x + DIRS[s.d][0], s.y + DIRS[s.d][1]);
  const exec = (nodes) => {
    for (const n of nodes) {
      if (over) return;
      if (n.k === 'rep') { for (let i = 0; i < n.n && !over; i++) exec(n.c); continue; }
      if (n.k === 'F') {
        const nx = s.x + DIRS[s.d][0], ny = s.y + DIRS[s.d][1];
        if (isWall(g, nx, ny)) push(n.id, 'B');
        else {
          s.x = nx; s.y = ny;
          if (cellAt(g, nx, ny) === '~') { push(n.id, 'W'); tr.fell = true; over = true; }
          else { push(n.id, 'F'); if (stopOnGoal && cellAt(g, nx, ny) === 'S') over = true; }
        }
      } else if (n.k === 'L' || n.k === 'R') { s.d = (s.d + (n.k === 'R' ? 1 : 3)) % 4; push(n.id, 'T'); }
      else if (!ahead()) push(n.id, 'N', 2);
      else {
        if (n.k === 'W') s.d = (s.d + 1) % 4;
        else if (n.k === 'WL') s.d = (s.d + 3) % 4;
        else { s.d = (s.d + 1) % 4; if (ahead()) s.d = (s.d + 2) % 4; }
        push(n.id, 'T', 1);
      }
    }
  };
  exec(prog);
  tr.goal = !tr.fell && cellAt(g, s.x, s.y) === 'S';
  return tr;
}
const diverge = (a, b) => {
  const n = Math.max(a.length, b.length);
  for (let i = 1; i < n; i++) { const p = a[i], q = b[i]; if (!p || !q || p.x !== q.x || p.y !== q.y || p.d !== q.d) return i; }
  return -1;
};

// --- the player: one trace, animated step by step --------------------------------------------------------------
const P = { g: null, prog: [], trace: [], good: null, div: null, k: 0, anim: null, mode: 'idle', stop: 0, ms: 420, next: 0, done: null, fx: [], sz: { w: 300, h: 300 } };
function setup(g, prog, goodProg, sog) {
  P.g = g; P.prog = prog; P.trace = run(g, prog, sog);
  P.good = goodProg ? run(g, goodProg, sog) : null;
  P.div = null;
  if (P.good) {
    const idx = diverge(P.trace, P.good);
    if (idx > 0) { const s = P.trace[Math.min(idx, P.trace.length - 1)]; P.div = { idx, x: s.x, y: s.y, top: topOf(prog, s.bi) }; }
  }

}
function resetRobot() { P.k = 0; P.anim = null; P.mode = 'idle'; P.done = null; P.fx = []; }
function play(stop, ms, done) { P.mode = 'auto'; P.stop = stop; P.ms = ms; P.done = done || null; P.next = 0; }
const fkOf = () => (P.div ? Math.min(P.div.idx, P.trace.length - 1) : -1);
function tick(time) {
  const a = P.anim;
  if (a && time >= a.t0 + a.dur) {
    P.k = a.to; P.anim = null; P.next = time + P.ms / 1000 * 0.08;
    const s = P.trace[P.k];
    if (s.kind === 'W') splash(s.x, s.y, time);
    if (s.kind === 'B') leaves(s.x + DIRS[s.d][0], s.y + DIRS[s.d][1], time);
    if (P.k === P.trace.length - 1 && P.trace.goal && lab.view !== 'tests') sparkle(s.x, s.y, time);
    onLanded();
  }
  if (!P.anim && P.mode === 'auto') {
    if (P.k >= P.trace.length - 1 || P.k >= P.stop) { P.mode = 'idle'; const d = P.done; P.done = null; if (d) d(); }
    else if (time >= P.next) {
      const to = P.trace[P.k + 1];
      P.anim = { t0: time, dur: P.ms / 1000 * 0.92, from: P.k, to: P.k + 1 };
      (to.kind === 'B' || to.kind === 'W' ? sfx.bad : to.kind === 'T' ? sfx.click : sfx.tick)();

    }

}
const easeIO = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const easeBack = (u) => 1 + 2.2 * Math.pow(u - 1, 3) + 1.2 * Math.pow(u - 1, 2);
function pose(time) {
  const tr = P.trace, a = P.anim;
  if (!a) { const s = tr[P.k]; return { x: s.x, y: s.y, ang: s.d * Math.PI / 2, hop: 0, sq: 0, sink: s.kind === 'W' ? 1 : 0, q: 0, kind: s.kind }; }
  const f = tr[a.from], t = tr[a.to], u = clamp((time - a.t0) / a.dur, 0, 1);
  let x = f.x, y = f.y, hop = 0, sq = 0, dd = (((t.d - f.d) % 4) + 4) % 4, ang = f.d, sink = 0, q = 0;
  if (dd === 3) dd = -1;
  if (t.kind === 'F' || t.kind === 'W') {
    const e = easeIO(u); x = f.x + (t.x - f.x) * e; y = f.y + (t.y - f.y) * e; hop = Math.sin(Math.PI * u) * 0.26;
    const land = clamp((u - 0.8) / 0.2, 0, 1); sq = Math.sin(Math.PI * land) * 0.14;
    if (t.kind === 'W') sink = clamp((u - 0.55) / 0.45, 0, 1);
  } else if (t.kind === 'B') { const n = Math.sin(Math.PI * u) * 0.17; x += DIRS[f.d][0] * n; y += DIRS[f.d][1] * n; sq = Math.sin(Math.PI * u) * 0.06; }
  else if (t.kind === 'T') { ang = f.d + dd * easeBack(u); if (t.q) q = u > 0.15 && u < 0.95 ? 1 : 0; }
  else if (t.kind === 'N') { ang = f.d + Math.sin(u * Math.PI * 3) * 0.12; q = u > 0.15 && u < 0.95 ? 2 : 0; }
  return { x, y, ang: ang * Math.PI / 2, hop, sq, sink, q: q ? (t.q === 1 ? 1 : 2) : 0, kind: t.kind };
}

// --- controls -------------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const el = ev.target.closest('button'); if (!el || el.disabled) return;

    } else if (v === 'fix' && S.fix.mode === 'debug' && !busy) {

  if (el.dataset.o) { const s = S.tests; if (s.running) return; s.opt = el.dataset.o; s.variant = el.dataset.o; sfx.snap(); tSetup(); runAll(); return; }

// --- the garden scene --------------------------------------------------------------------------------------------------
function showDash() {

}
function drawRobotAndTrails(c, L, time, o = {}) {

    c.lineWidth = Math.max(2, cell * 0.07); c.strokeStyle = 'rgba(255,255,255,.95)'; c.stroke();

    const s = P.trace[i]; if (i === 0 ? P.k === 0 : !(s.kind === 'F')) continue;
    const [x, y] = tc(L, s.x, s.y); c.save(); c.translate(x, y); c.rotate(s.d * Math.PI / 2);
    for (const sx of [-1, 1]) { c.beginPath(); c.ellipse(sx * cell * 0.1, sx > 0 ? cell * 0.07 : -cell * 0.07, cell * 0.055, cell * 0.09, 0, 0, Math.PI * 2); c.fillStyle = '#f7cf55'; c.fill(); c.lineWidth = 1; c.strokeStyle = '#b8860b'; c.stroke(); }
    c.restore();
  }
  // the first tile where the run leaves the plan
  if (o.flash && P.div) {
    const [x, y] = tc(L, P.div.x, P.div.y), a = 0.3 + 0.2 * Math.sin(time * 8);
    rr(c, x - cell / 2 + 1, y - cell / 2 + 1, cell - 2, cell - 2, cell * 0.2); c.fillStyle = `rgba(255,50,50,${a})`; c.fill(); c.lineWidth = Math.max(2, cell * 0.06); c.strokeStyle = '#ff4a40'; c.stroke();
  }

}
function drawScene(c, w, h, time) {

function drawThumbs(time) {

function drawLog(c, w, h, time) {

  c.fillStyle = '#d9b86a'; for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(x + pw * 0.045, y + ph * (0.14 + i * 0.24), 4, 0, Math.PI * 2); c.fill(); }

}

// --- the message relay (secret B) ----------------------------------------------------------------------------------------

  const t = T[lang].sx.b, r = S.relay, cw = Math.min(w * 0.6, 300), nw = Math.min(110, cw * 0.55), nh = 36, top = 14, gap = (h - 2 * top - 5 * nh) / 4;
  const emo = ['👩‍💻', '💾', '👨‍💻', '🔥', '🪐'], nx = 10, axl = nx + nw / 2;

    const y = top + i * (nh + gap);
    c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 6; c.shadowOffsetY = 2; rr(c, nx, y, nw, nh, 12);

    c.font = '18px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(emo[i], nx + 8, y + nh / 2 + 1);
    c.font = '800 12px Nunito, sans-serif'; c.fillText(t.nodes[i], nx + 32, y + nh / 2 + 1);
  }

    c.save(); c.translate(dx, 0);
    c.strokeStyle = red ? '#ff4a40' : '#98A0B8'; c.fillStyle = c.strokeStyle; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(axl, y0 + 2); c.lineTo(axl, y1 - 6); c.stroke();
    c.beginPath(); c.moveTo(axl - 6, y1 - 8); c.lineTo(axl + 6, y1 - 8); c.lineTo(axl, y1 - 1); c.closePath(); c.fill();
    const lines = t.u[i].split(' → '), px = axl + 14, ph = lines.length > 1 ? 34 : 20, py = (y0 + y1) / 2 - ph / 2;
    c.font = '800 12px Nunito, sans-serif'; const tw = Math.max(...lines.map((s, k) => c.measureText((k ? '→ ' : '') + s).width)) + 14;
    rr(c, px, py, Math.min(tw, cw - px + 6), ph, 9); c.fillStyle = red ? 'rgba(120,30,30,.92)' : 'rgba(10,12,22,.85)'; c.fill(); c.lineWidth = 1; c.strokeStyle = red ? '#ff4a40' : 'rgba(150,160,210,.5)'; c.stroke();
    c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle';
    lines.forEach((s, k) => c.fillText((k ? '→ ' : '') + s, px + 7, py + ph / (lines.length * 2) + k * (ph / lines.length) + 0.5));
    if (red) { c.font = '22px sans-serif'; c.fillText('🐞', cw - 6, py - 4); }
    c.restore();
    S.hit.push({ x: nx, y: y0 - 6, w: cw, h: gap + 12, id: i });
  }
  // Mars
  const px = cw + 14, pw = w - px - 10, py = 10, ph = h - 20;
  if (pw < 60) return;
  c.save(); rr(c, px, py, pw, ph, 14); const bg = c.createLinearGradient(px, py, px, py + ph); bg.addColorStop(0, '#0a0e22'); bg.addColorStop(1, '#1b1730'); c.fillStyle = bg; c.fill(); c.clip();
  for (let i = 0; i < 22; i++) { c.fillStyle = `rgba(255,255,255,${0.3 + hs(i, 1, 2) * 0.5})`; c.fillRect(px + hs(i, 3, 4) * pw, py + hs(i, 5, 6) * ph * 0.7, 1.5, 1.5); }
  const cx = px + pw / 2, R = pw * 0.5, cy = py + ph * 0.84, r0 = R * 1.55;
  const atm = c.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 1.18); atm.addColorStop(0, 'rgba(255,170,110,.55)'); atm.addColorStop(1, 'rgba(255,170,110,0)');
  c.fillStyle = atm; c.beginPath(); c.arc(cx, cy, R * 1.18, 0, Math.PI * 2); c.fill();
  const mg = c.createRadialGradient(cx - R * 0.3, cy - R * 0.4, R * 0.1, cx, cy, R * 1.05); mg.addColorStop(0, '#f09a6a'); mg.addColorStop(0.6, '#c9603c'); mg.addColorStop(1, '#7d3320');
  c.fillStyle = mg; c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(80,30,20,.3)'; for (const [dx, dy, rr2] of [[-0.3, -0.55, 0.12], [0.25, -0.4, 0.08], [0.0, -0.8, 0.07]]) { c.beginPath(); c.arc(cx + dx * R, cy + dy * R, rr2 * R, 0, Math.PI * 2); c.fill(); }

  c.fillStyle = '#4a6fd0'; c.fillRect(-14, -2, 9, 5); c.fillRect(5, -2, 9, 5); c.fillStyle = '#d9dde8'; rr(c, -4, -5, 8, 11, 2); c.fill(); c.strokeStyle = '#59607a'; c.lineWidth = 1; c.stroke();

canvasLoop($('cv'), (c, w, h, dt, time) => {
  P.sz = { w, h };
  tick(time);
  c.lineJoin = 'round';
  if (S.sec === 'a') drawLog(c, w, h, time);
  else if (S.sec === 'b') drawRelay(c, w, h, time);
  else { drawScene(c, w, h, time); S.hit = []; }
  if (lab.view === 'tests' && !S.sec) drawThumbs(time);
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (!S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, t = performance.now() / 1000;
  const hit = S.hit.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
  if (!hit) return;
  if (S.sec === 'a') { if (hit.id === 'moth') { S.moth.t0 = t; sfx.snap(); } else { S.moth.t0 = null; sfx.click(); } }
  else if (!S.relay.found) {
    if (hit.id === 1) { S.relay.found = true; S.relay.t0 = t; S.relay.wrong = false; sfx.good(); }
    else { S.relay.shake = { i: hit.id, t0: t }; S.relay.wrong = true; sfx.bad(); }
  }
  render();
});

loadRound(0);
