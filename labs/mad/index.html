}

// --- dragging ----------------------------------------------------------------------------------------------
const canDrag = () => !S.sec && ((lab.view === 'strings' && S.pr.strings !== null) || (lab.view === 'outlier' && S.far !== null));
const toDesign = (ev) => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left - G.ox) / G.s, y: (ev.clientY - r.top - G.oy) / G.s }; };
const valAt = (x) => clamp(Math.round((x - X0) / UNIT), 0, 20);
function dragTo(p) {
  if (lab.view === 'strings' && S.dragI >= 0) {
    const nv = valAt(p.x);
    if (nv !== S.v[S.dragI]) { S.v[S.dragI] = nv; sfx.tick(); renderInfo(); }
  } else if (lab.view === 'outlier' && S.farDrag) {
    const nv = valAt(p.x), from = S.far;
    if (nv !== from) {
      const dir = Math.sign(nv - from);
      for (let x = from + dir; x !== nv + dir; x += dir) S.trace.set(x, madOf([...BASE3, x]));
      S.far = nv; sfx.tick(); renderInfo();
    }
  }
}
cv.addEventListener('pointerdown', (ev) => {
  if (!canDrag()) return;
  const p = toDesign(ev);
  if (lab.view === 'strings') {
    let best = -1, bd = 14;
    for (let i = 0; i < 6; i++) { const d = Math.abs(p.y - (ROW0 + ROWH * i)); if (d < bd) { bd = d; best = i; } }
    if (best < 0 || p.x < X0 - 24 || p.x > X1 + 24) return;
    S.dragI = best;
  } else {
    if (p.y > 176) return;
    S.farDrag = true;
  }
  S.dragged = true;
  try { cv.setPointerCapture(ev.pointerId); } catch { /* no capture */ }
  dragTo(p);
});
cv.addEventListener('pointermove', (ev) => { if (S.dragI >= 0 || S.farDrag) dragTo(toDesign(ev)); });
const endDrag = () => { S.dragI = -1; S.farDrag = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls --------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function addFar() {
  S.far = 20; S.farDX = xv(20); S.farT = 0; S.dragged = false;
  S.trace = new Map([[20, madOf([...BASE3, 20])]]);
}
function answer(i) {
  const v = lab.view, a = ASK[v];
  if (S.pr[v] !== null) return;
  S.pr[v] = i; S.revT = 0;
  (i === a.ok ? sfx.good : sfx.bad)();
  if (v === 'outlier') addFar();
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.p !== undefined) return answer(+b.dataset.p);
  const act = b.dataset.act;
  if (act === 'lay') { S.layT = 0; sfx.click(); }
  else if (act === 'far') { addFar(); sfx.push(); }
  else if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.sec;
    S.sec = S.sec === k ? null : k; S.secT = 0; sfx.click();
    render(); return;
  }
  renderInfo();
});

// --- one render per change: controls, readout and the state card ------------------------------------------------
function renderBody() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  let h = '';
  if (!S.sec) {
    const a = ASK[v], p = S.pr[v];
    h += `<div class="md-q">${esc(t[a.q])}</div><div class="md-opts">${t[a.o].map((o, i) => {
      const cls = p === null ? '' : i === a.ok ? 'ok' : i === p ? 'bad' : 'dim';
      return `<button class="md-opt ${cls}" data-p="${i}"${p !== null ? ' disabled' : ''}>${esc(o)}</button>`;
    }).join('')}</div>`;
    if (p !== null) h += `<div class="md-verdict ${p === a.ok ? 'ok' : 'bad'}">${esc(t[p === a.ok ? a.right : a.wrong])}</div>`;
    if (p !== null && v === 'strings') h += `<div class="row2"><button class="btn" data-act="lay">${esc(t.lay)}</button></div>`;
    if (p !== null && v === 'outlier') h += `<div class="row2"><button class="btn" data-act="far">${esc(t.addFar)}</button></div>`;
  }
  h += `<div class="row2">${['a', 'b'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${k === 'a' ? '📏' : '🌡️'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('')}</div>`;
  $('mdBody').innerHTML = h;
}
const ACC = '#2a9d8f';
function renderInfo() {
  const t = T[lang], v = lab.view, p = S.pr[v];
  if (S.sec === 'a') {
    lab.setGlow('rgba(233, 196, 106, .22)');
    lab.setReadout('−9 + 9 = 0', '', '', ACC);
    lab.setState({ emo: '📏', title: t.secrets.a[0], lead: t.zeroText, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (S.sec === 'b') {
    lab.setGlow('rgba(244, 162, 97, .24)');
    lab.setReadout(`${fmt1(madOf(TOWN_C))} · ${fmt1(madOf(TOWN_I))}`, t.madSub, t.sameMean, ACC);
    lab.setState({ emo: '🌡️', title: t.secrets.b[0], lead: t.weatherText, body: '', extra: '' }); lab.setFacts([]); return;
  }
  lab.setGlow(v === 'strings' ? 'rgba(42, 157, 143, .28)' : v === 'teams' ? 'rgba(244, 162, 97, .24)' : 'rgba(233, 196, 106, .22)');
  const st = t.st[v];
  if (p === null) {
    // prediction open: the answer stays out of the readout, the pill and the card
    lab.setReadout(v === 'outlier' ? t.madVal(fmt1(madOf(BASE3))) : '?', v === 'outlier' ? t.madSub : '', '', ACC);
    lab.setState({ emo: st[0], title: st[1], lead: '', body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (v === 'strings') {
    const m = mean(S.v), tot = S.v.reduce((a, x) => a + Math.abs(x - m), 0);
    lab.setReadout(t.madVal(fmt1(tot / 6)), t.madSub, t.totalPill(fmtN(tot), 6), ACC);
  } else if (v === 'teams') lab.setReadout(t.teamsVal(fmt2(madOf(TEAM_A)), fmt2(madOf(TEAM_B))), t.madSub, t.sameMean, ACC);
  else lab.setReadout(t.madVal(fmt1(madOf(S.far === null ? BASE3 : [...BASE3, S.far]))), t.madSub, S.far === null ? '' : t.farPill(S.far), ACC);
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
  lab.setFacts(t.facts[v]);
}
function render() {
  document.body.dataset.drag = canDrag() ? '1' : '0';
  document.body.dataset.h = HEIGHT[S.sec ?? lab.view] > 340 ? 'tall' : '';
  renderBody(); renderInfo();
}
canvasLoop(cv, (c, w, h, dt) => drawFrame(c, w, h, dt, c.getTransform()));
render();
</script>
</body>
</html>
