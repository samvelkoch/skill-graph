  ctx.strokeStyle = '#4a3324'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(wx, wy + wh); ctx.lineTo(wx, wy + ra); ctx.arc(wx + ra, wy + ra, ra, Math.PI, 0); ctx.lineTo(wx + ww, wy + wh); ctx.closePath(); ctx.stroke();
  ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh); ctx.moveTo(wx, wy + wh * 0.42); ctx.lineTo(wx + ww, wy + wh * 0.42); ctx.stroke();
  ctx.fillStyle = '#5a4130'; ctx.fillRect(wx - 10, wy + wh, ww + 20, 8);
  // the desk
  const dg = ctx.createLinearGradient(0, h * 0.66, 0, h); dg.addColorStop(0, '#5a3d28'); dg.addColorStop(1, '#2a1b11'); ctx.fillStyle = dg; ctx.fillRect(0, h * 0.67, w, h * 0.33);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, h * 0.67, w, 4);
  // the notebook and the writing
  const nb = [[.3, .73], [.7, .71], [.75, .9], [.25, .92]];
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); nb.forEach(([x, y], i) => (i ? ctx.lineTo(x * w + 5, y * h + 6) : ctx.moveTo(x * w + 5, y * h + 6))); ctx.closePath(); ctx.fill();
  const pg = ctx.createLinearGradient(w * 0.25, 0, w * 0.75, 0); pg.addColorStop(0, '#e2d6b6'); pg.addColorStop(0.5, '#f3ead0'); pg.addColorStop(1, '#e6dcc0');
  ctx.fillStyle = pg; ctx.beginPath(); nb.forEach(([x, y], i) => (i ? ctx.lineTo(x * w, y * h) : ctx.moveTo(x * w, y * h))); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(80,60,40,.5)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(w * 0.5, h * 0.72); ctx.lineTo(w * 0.5, h * 0.91); ctx.stroke();
  S.writeT += dt * 0.35; const wp = S.writeT % 5, L = Math.floor(wp), fr = wp - L;
  ctx.strokeStyle = '#2a2018'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  let tip = { x: w * 0.54, y: h * 0.75 };
  for (let i = 0; i <= L; i++) {
    const ly = h * (0.752 + i * 0.027), x0 = w * 0.54 + i * 1.5, len = w * 0.17 * (i < L ? 1 : fr);
    ctx.beginPath(); for (let x = 0; x <= len; x += 3) { const y = ly + Math.sin(x * 0.9 + i) * 1.3; if (x === 0) ctx.moveTo(x0 + x, y); else ctx.lineTo(x0 + x, y); } ctx.stroke();
    if (i === L) tip = { x: x0 + len, y: ly };
  }
  // the hand, the arm and the quill
  const hand = { x: tip.x + 18, y: tip.y - 24 };
  ctx.strokeStyle = '#1b1410'; ctx.lineWidth = 20; ctx.beginPath(); ctx.moveTo(hand.x + 6, hand.y + 4); ctx.quadraticCurveTo(w * 0.3, h * 0.78, w * 0.12, h * 1.02); ctx.stroke();
  ctx.strokeStyle = 'rgba(224,160,96,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(hand.x + 12, hand.y - 4); ctx.quadraticCurveTo(w * 0.31, h * 0.76, w * 0.15, h * 1.0); ctx.stroke();
  ctx.strokeStyle = '#d9d0b8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(tip.x, tip.y); ctx.lineTo(tip.x + 44, tip.y - 56); ctx.stroke();
  ctx.fillStyle = '#efe6cc'; ctx.beginPath(); ctx.ellipse(tip.x + 38, tip.y - 52, 6, 24, 0.62, 0, TAU); ctx.fill();
  ctx.fillStyle = '#d9a98a'; ctx.beginPath(); ctx.arc(hand.x, hand.y, 8, 0, TAU); ctx.fill();
  // ink pot
  ctx.fillStyle = '#10141c'; ctx.beginPath(); ctx.ellipse(w * 0.19, h * 0.86, 15, 9, 0, 0, TAU); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(w * 0.19 - 5, h * 0.855, 4, 2, -0.3, 0, TAU); ctx.fill();
  // the candle and its light
  const kx = w * 0.86, ky = h * 0.8, fk = 1 + Math.sin(tm * 11) * 0.08 + Math.sin(tm * 17) * 0.05;
  ctx.fillStyle = '#6a5a40'; ctx.beginPath(); ctx.ellipse(kx, ky + 38, 18, 6, 0, 0, TAU); ctx.fill();
  const cg = ctx.createLinearGradient(kx - 8, 0, kx + 8, 0); cg.addColorStop(0, '#fff0d0'); cg.addColorStop(1, '#c8b890'); ctx.fillStyle = cg; rr(ctx, kx - 8, ky, 16, 40, 3); ctx.fill();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const gl2 = ctx.createRadialGradient(kx, ky - 8, 2, kx, ky - 8, w * 0.7); gl2.addColorStop(0, `rgba(255,170,70,${0.4 * fk})`); gl2.addColorStop(1, 'rgba(255,170,70,0)');
  ctx.fillStyle = gl2; ctx.fillRect(0, 0, w, h); ctx.restore();
  ctx.fillStyle = '#ffd36a'; ctx.beginPath(); ctx.moveTo(kx, ky - 22 * fk); ctx.quadraticCurveTo(kx + 8, ky - 8, kx, ky); ctx.quadraticCurveTo(kx - 8, ky - 8, kx, ky - 22 * fk); ctx.fill();
  ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.ellipse(kx, ky - 6, 2.6, 6, 0, 0, TAU); ctx.fill();
  if (fl > 0.2) { ctx.fillStyle = `rgba(190,210,255,${fl * 0.1})`; ctx.fillRect(0, 0, w, h); }
  pill(ctx, T[lang].fr.title, w / 2, h - 18, w, { al: 'c' });
}
function drawSunset(ctx, w, h, dt, tm) {
  const v = S.veil, m = 12, x0 = m, y0 = m, W = w - m * 2, H = h - m * 2, hz = y0 + H * 0.62;
  ctx.fillStyle = '#17120e'; ctx.fillRect(0, 0, w, h);
  ctx.save(); rr(ctx, x0, y0, W, H, 6); ctx.clip();
  const sk = ctx.createLinearGradient(0, y0, 0, hz);
  const stops = [[0, '#2b6cb0', '#2a1538'], [0.45, '#6aa5d8', '#6b1f4e'], [0.8, '#f3cfa0', '#d2452e'], [1, '#ffe8b8', '#ffa43a']];
  for (const [s, a, b] of stops) sk.addColorStop(s, mix(a, b, v));
  ctx.fillStyle = sk; ctx.fillRect(x0, y0, W, hz - y0);
  const sx = x0 + W * 0.5, sy = hz - H * 0.07, sr = 22 + 12 * v;
  const gl = ctx.createRadialGradient(sx, sy, sr * 0.5, sx, sy, W * 0.7);
  gl.addColorStop(0, rgba(mix('#ffe6a0', '#ff7a3a', v), 0.75)); gl.addColorStop(0.4, rgba(mix('#ffc870', '#d2352a', v), 0.3 + 0.2 * v)); gl.addColorStop(1, rgba('#ff7a3a', 0));
  ctx.fillStyle = gl; ctx.fillRect(x0, y0, W, hz - y0);
  // streaks of the veil and low clouds lit from below
  for (let i = 0; i < 7; i++) {
    const cyp = hz - H * (0.04 + i * 0.07), cxp = x0 + ((i * 0.31 + tm * 0.004 * (1 + i * 0.2)) % 1.3 - 0.15) * W;
    ctx.fillStyle = rgba(mix('#ffd9b0', '#ff5a30', v), (0.1 + 0.4 * v) * (1 - i * 0.07)); ctx.beginPath(); ctx.ellipse(cxp, cyp, W * (0.18 + i * 0.02), H * 0.012 + H * 0.006 * (i % 3), 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = mix('#fff2c0', '#ffd8a0', v); ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
  // sea and the sun's path on it
  const sg = ctx.createLinearGradient(0, hz, 0, y0 + H); sg.addColorStop(0, mix('#8fb4d8', '#a8402e', v)); sg.addColorStop(1, mix('#1c3550', '#2a1226', v));
  ctx.fillStyle = sg; ctx.fillRect(x0, hz, W, y0 + H - hz);

    const y = hz + 3 + i * ((y0 + H - hz - 4) / 16), wd = (sr * 1.6 + i * 3) * (0.5 + 0.5 * Math.sin(tm * 2 + i * 1.3) ** 2) + 6;
    ctx.fillStyle = rgba(mix('#fff0c0', '#ffc070', v), 0.55 - i * 0.025); ctx.fillRect(sx - wd / 2, y, wd, 2);
  }

  ctx.fillStyle = mix('#2a3a4a', '#1a0e1c', v); ctx.beginPath(); ctx.moveTo(x0, hz); ctx.quadraticCurveTo(x0 + W * 0.08, hz - H * 0.1, x0 + W * 0.22, hz - H * 0.02); ctx.lineTo(x0 + W * 0.3, hz); ctx.closePath(); ctx.fill();
  const bx = x0 + W * 0.78, by = hz + 8 + Math.sin(tm * 1.2) * 1.5;
  ctx.fillStyle = '#150b14'; ctx.beginPath(); ctx.moveTo(bx - 20, by); ctx.quadraticCurveTo(bx, by + 8, bx + 20, by); ctx.lineTo(bx + 16, by - 4); ctx.lineTo(bx - 16, by - 4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(bx - 2, by - 4); ctx.lineTo(bx - 2, by - 34); ctx.lineTo(bx + 14, by - 6); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(bx - 5, by - 6); ctx.lineTo(bx - 5, by - 28); ctx.lineTo(bx - 17, by - 8); ctx.closePath(); ctx.fill();

}

// --- shell, secrets, controls (every constant above exists before this point) --------------------------------------
const lab = shell({ key: 'volcanic-winter', T, topics: TOPICS, views: ['erupt', 'summer', 'compare'], onLang: render, onView: () => { S.sec = null; render(); } });
const secret = secretLab('volcanic-winter', () => ({
  secrets: [{ emo: '📖', title: T[lang].secrets.frank[0], desc: T[lang].secrets.frank[1] }, { emo: '🌅', title: T[lang].secrets.sunset[0], desc: T[lang].secrets.sunset[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="cErupt" hidden>
    <input id="vei" class="big" type="range" min="4" max="8" step="1" value="6" style="--track: linear-gradient(90deg, #f5c84c, #ff7a3d, #b02a30)">
    <div class="ends" id="veiEnds"><span></span><span></span></div>
    <div class="row2" style="margin-top:0"><button class="btn vw-big" id="goBtn"></button></div>
  </div>
  <div id="cSummer" hidden>
    <input id="mon" class="big" type="range" min="0" max="11" step="1" value="5" style="--track: linear-gradient(90deg, #cfe0f5, #7fc46a, #e0b84a, #b87a4a, #cfe0f5)">
    <div class="vw-mons" id="monEnds"><span></span><span></span></div>
    <div class="row2" style="margin-top:6px"><div class="card seg small" id="modeSeg"></div><button class="chip" id="globeBtn" hidden></button></div>
  </div>
  <div id="cCompare" hidden><div class="chips" id="cmpChips"></div></div>
  <div id="cSecret" hidden>
    <div id="sunCtl" hidden><input id="veilS" class="big" type="range" min="0" max="100" step="1" value="60" style="--track: linear-gradient(90deg, #f6d9a8, #ff9a50, #b02a30)"><div class="ends" id="sunEnds"><span></span><span></span></div></div>
    <div id="frCtl" hidden><button class="btn vw-big" id="thunBtn"></button></div>
  </div>
  <div class="row2" id="secRow"></div>`;
const askEl = Object.assign(document.createElement('div'), { className: 'vw-ask card' });
askEl.hidden = true;
$('overlay').append(askEl);

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const startEruption = () => {
  photons.length = 0; hits.length = 0; sparks.length = 0;
  S.run = true; S.el = 0; S.phase = 'rise'; S.axS = S.vei >= 8 ? 5 : 1;
};
const idleEruption = () => { S.run = false; S.el = -1; S.fresh1 = false; photons.length = 0; hits.length = 0; sparks.length = 0; S.phase = 'idle'; };

$('vei').addEventListener('input', (ev) => { S.vei = +ev.target.value; idleEruption(); sfx.tick(); render(); });
$('mon').addEventListener('input', (ev) => { S.month = +ev.target.value; sfx.tick(); render(); });
$('veilS').addEventListener('input', (ev) => { S.veil = +ev.target.value / 100; render(); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const id = b.id, d = b.dataset;
  if (id === 'goBtn') { S.fresh1 = false; startEruption(); sfx.push(); showStage(); }
  else if (id === 'thunBtn') { S.flash = 1; S.nextFl = 6; sfx.bad(); }
  else if (id === 'globeBtn') { S.globe = true; S.gT = 0; sfx.click(); }
  else if (d.mode) { S.mode = d.mode; sfx.click(); }
  else if (d.sel) { S.sel = +d.sel; sfx.click(); }
  else if (d.sec) {
    if (d.sec === 'off') { S.sec = null; sfx.click(); }
    else { if (!secret.unlocked()) return secret.open(); S.sec = d.sec; sfx.click(); S.nextFl = 1.5; }
  }
  render();
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.p1) {
    S.p1 = d.p1; const ok = d.p1 === 'cool';
    S.vmsg = { ok, text: T[lang].e[ok ? 'right' : 'wrong'][0] }; S.vAge = 0; S.fresh1 = true;
    (ok ? sfx.good : sfx.bad)(); startEruption(); showStage();
  } else if (d.p2) { S.p2 = d.p2; S.globe = true; S.gT = 0; (d.p2 === 'ind' ? sfx.good : sfx.bad)(); showStage(); }
  else if (d.act === 'back') { S.globe = false; sfx.click(); }
  render();
});
$('cv').addEventListener('click', (ev) => {
  if (lab.view !== 'compare' || S.sec) return;
  const r = $('cv').getBoundingClientRect(), y = ev.clientY - r.top, G = cmpGeom(r.width, r.height);
  for (const [top, rh] of [[G.top1, G.rh1], [G.top2, G.rh2]]) for (let i = 0; i < 3; i++) if (y >= top + 24 + i * rh && y < top + 24 + (i + 1) * rh) { S.sel = i; sfx.click(); render(); return; }
});

// the canvas loop draws whatever the view and the secret ask for
function draw(ctx, w, h, dt, tm) {
  S.vAge += dt;
  if (S.sec === 'frank') return drawFrank(ctx, w, h, dt, tm);
  if (S.sec === 'sunset') return drawSunset(ctx, w, h, dt, tm);
  if (S.lastView !== lab.view) { S.lastView = lab.view; S.cmpT = 0; }
  if (lab.view === 'erupt') drawErupt(ctx, w, h, dt, tm);
  else if (lab.view === 'summer') { if (S.p2 !== null && S.globe) drawGlobe(ctx, w, h, dt, tm); else drawVillage(ctx, w, h, dt, tm); }
  else drawCompare(ctx, w, h, dt, tm);
}

// --- one render per change: controls, readout, state card, facts ---------------------------------------------------
function secChips(t) {
  const open = secret.unlocked();
  if (S.sec) return `<button class="chip" data-sec="off">${esc(t.back)}</button>`;
  const one = (k, emo) => `<button class="chip secret ${open ? 'open' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return one('frank', '📖') + one('sunset', '🌅');
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v;
  $('cErupt').hidden = sec || v !== 'erupt' || S.p1 === null;
  $('cSummer').hidden = sec || v !== 'summer';
  $('cCompare').hidden = sec || v !== 'compare';
  $('cSecret').hidden = !sec;
  $('sunCtl').hidden = sec !== 'sunset'; $('frCtl').hidden = sec !== 'frank';
  $('secRow').innerHTML = secChips(t);
  $('veiEnds').children[0].textContent = t.e.ends[0]; $('veiEnds').children[1].textContent = t.e.ends[1];
  $('goBtn').textContent = S.run ? t.e.again : t.e.go;
  $('monEnds').children[0].textContent = t.mon3[0]; $('monEnds').children[1].textContent = t.mon3[11];
  $('sunEnds').children[0].textContent = t.su.ends[0]; $('sunEnds').children[1].textContent = t.su.ends[1];
  $('thunBtn').textContent = t.fr.btn;
  $('modeSeg').innerHTML = [['y', t.s.modes[0]], ['n', t.s.modes[1]]].map(([m, l]) => `<button data-mode="${m}" class="${S.mode === m ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('globeBtn').hidden = !(S.p2 !== null && !S.globe); $('globeBtn').textContent = t.s.globe;
  $('cmpChips').innerHTML = v !== 'compare' ? '' : [0, 1, 2].map((i) => `<button class="chip ${S.sel === i ? 'on' : ''}" data-sel="${i}">${esc(t.c.chip[i])}</button>`).join('');
  renderAsk(t);
  const f = (k) => ({ emo: k === 'shel' ? '📖' : k === 'tamb' ? '🌋' : '🌡️', text: t.facts[k], src: SRC[k] });
  if (sec === 'frank') renderFrank(t, f);
  else if (sec === 'sunset') renderSunset(t);
  else if (v === 'erupt') renderErupt(t, f);
  else if (v === 'summer') renderSummer(t, f);
  else renderCompare(t, f);
}
function renderAsk(t) {
  const v = lab.view; let html = '';
  if (!S.sec) {
    if (v === 'erupt' && S.p1 === null) html = `<div class="q">${esc(t.e.q)}</div><div class="opts">${['warm', 'cool', 'same'].map((k, i) => `<button data-p1="${k}">${esc(t.e.opts[i])}</button>`).join('')}</div>`;
    else if (v === 'summer' && S.p2 === null) html = `<div class="q">${esc(t.s.q)}</div><div class="opts">${['eu', 'ind'].map((k, i) => `<button data-p2="${k}">${esc(t.s.opts[i])}</button>`).join('')}</div>`;
    else if (v === 'summer' && S.globe) { const ok = S.p2 === 'ind', r = t.s[ok ? 'right' : 'wrong']; html = `<div class="verdict ${ok ? 'ok' : 'no'}">${esc(r[0])}</div><p>${esc(r[1])}</p><div class="opts"><button data-act="back">${esc(t.s.back)}</button></div>`; }
  }
  askEl.hidden = !html; askEl.innerHTML = html;
}
function renderErupt(t, f) {
  const e = t.e;
  lab.setGlow('rgba(255, 110, 60, .26)');
  eruptReadout(t); S.rk = eruptReadoutKey();
  if (S.p1 === null) { lab.setState({ emo: '🤔', title: e.q, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  const vei = S.vei, i = vei - 4;
  let st;
  switch (S.phase) {
    case 'rise': st = vei === 4 ? e.riseLow : e.rise; break;
    case 'spread': st = vei === 4 ? e.spreadLow : e.spread; break;
    case 'cool': st = vei === 4 ? e.coolLow : e.cool(e.pk[i]); break;
    case 'fade': st = vei === 4 ? e.coolLow : e.fade; break;
    default: st = null;
  }
  const verdict = S.fresh1 ? e[S.p1 === 'cool' ? 'right' : 'wrong'] : null;
  const fine = `<div class="vw-fine">${esc(e.fine)}</div>`;
  if (!st) { const d = e.idle(vei, e.vols[i]); lab.setState({ ...d, extra: fine }); }
  else lab.setState({ emo: st[0], title: st[1], lead: st[2], body: verdict ? `${verdict[0]} ${verdict[1]}` : (vei === 8 ? e.pk[4] : ''), extra: fine });
  lab.setFacts([f('pina')]);
}
function renderSummer(t, f) {
  const s = t.s, mi = S.month, row = (S.mode === 'y' ? M1816 : MNORM)[mi];
  lab.setGlow('rgba(120, 150, 200, .24)');
  const key = S.mode === 'y' ? (row[7] >= 0.7 ? 'frost' : row[5] >= 0.4 ? 'snow' : row[6] >= 0.3 ? 'coldrain' : 'grey')
    : (row[5] >= 0.3 ? 'snow' : row[6] >= 0.25 ? 'rain' : row[1] < 0.3 ? 'sun' : 'grey');
  const emo = { snow: '❄️', rain: '🌧️', coldrain: '🌧️', frost: '🧊', sun: '☀️', grey: '☁️' }[key];
  const line = S.mode === 'y' ? s.lines[mi] : s.normal[NORM_LINE[mi]];
  lab.setReadout(`${t.mons[mi]}${S.mode === 'y' ? ' 1816' : ''}`, s.wk[key], S.mode === 'y' && row[7] >= 0.4 ? `🧊 ${s.wk.frost}` : '', '#8fb6e8');
  if (S.p2 !== null && S.globe) { const r = s[S.p2 === 'ind' ? 'right' : 'wrong']; lab.setState({ emo: '🌍', title: r[0], lead: r[1], body: '', extra: '' }); }
  else lab.setState({ emo, title: s.wk[key], lead: line, body: S.mode === 'y' ? s.note : '', extra: '' });
  const list = [f('shel')]; if (S.p2 !== null) list.unshift(f('tamb'));
  lab.setFacts(list);
}
function renderCompare(t, f) {
  const c = t.c, i = S.sel, st = c.st[i];
  lab.setGlow('rgba(245, 200, 76, .22)');
  lab.setReadout(i === 2 ? t.e.several : `${minus(c.cool[i])} °C`, `${c.names[i]} · VEI ${6 + i}`, c.tags[i], '#f5c84c');
  lab.setState({ emo: '🌋', title: st[0], lead: st[1], body: st[2] + (i === 1 && S.p2 !== null ? c.where : ''), extra: '' });
  const list = []; if (S.p2 !== null) list.push(f('tamb')); if (S.p1 !== null) list.push(f('pina')); list.push(f('shel'));
  lab.setFacts(list);
}
function renderFrank(t, f) {
  lab.setGlow('rgba(217, 163, 95, .22)');
  lab.setReadout('1816', t.fr.sub, t.fr.pill, '#d9a35f');
  lab.setState({ emo: '📖', title: t.fr.title, lead: t.fr.lead, body: '', extra: '' });
  lab.setFacts([f('shel')]);
}
function renderSunset(t) {
  lab.setGlow('rgba(255, 110, 60, .3)');
  lab.setReadout(`${Math.round(S.veil * 100)}%`, t.su.sub, '', '#ff8a4a');
  lab.setState({ emo: '🌅', title: t.su.title, lead: t.su.lead, body: '', extra: '' });
  lab.setFacts([]);
}

canvasLoop($('cv'), draw);
render();
</script>
