  $('dgChips').innerHTML = n ? `<button class="chip" data-act="bury">${esc(d.again)}</button>` : '';
  lab.setReadout(`${n}/7`, d.sub, n === 7 ? d.all[0] : '', '#c49a62');
  if (S.sel && S.dug[S.sel] !== undefined) lab.setState({ emo: DIG.find((q) => q[0] === S.sel)[3], title: d.f[S.sel][0], lead: d.f[S.sel][1], body: n === 7 ? d.all[1] : '', extra: '' });
  else lab.setState({ emo: '⛏️', title: d.pre[0], lead: d.pre[1], body: '', extra: '' });
  lab.setFacts(S.dug.an !== undefined ? [{ emo: '🧊', ...t.facts.cryo }] : []);
}
render();
</script>
</body>
