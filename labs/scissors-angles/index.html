function r2(t) {

  const hid = sl ? 360 - S.sl.b[2] : 360 - S.pac.m;

    const a = v.stAsk[S.mode]; lab.setState({ emo: a[0], title: a[1], lead: a[2], body: '', extra: '' }); lab.setFacts([]); return;
  }
  const nk = nameKey(hid), hl = sl ? [nk, 'full'] : ['reflex', 'full'];
  gl.innerHTML = ['straight', 'reflex', 'full'].map((k) => `<div class="${hl.includes(k) ? 'on' : ''}"><b>${esc(v.gl[k][0])}</b>: ${esc(v.gl[k][1])}</div>`).join('');
  const sum = sl ? `${slSizes().join(' + ')} = 360°` : `${S.pac.m}° + ${hid}° = 360°`;
  lab.setReadout(`${hid}°`, `${t.names[nk]} · ${sum}`, '', CORAL);
  const r = v.stRev[S.mode]; lab.setState({ emo: r[0], title: r[1], lead: r[2], body: sum, extra: '' }); lab.setFacts(v.facts[S.mode]);

function r3(t) {

  $('ac3mapL').textContent = v.map;

  $('ac3q').textContent = v.q;
  $('ac3work').hidden = all;
  $('ac3pickL').textContent = v.pick; $('ac3ruleL').textContent = v.rule; $('ac3L').textContent = v.size; $('ac3chk').textContent = t.chk;
  $('ac3unk').innerHTML = M.unk.map((j, i) => `<button type="button" class="chip ac-c${S.sel === j ? ' on' : ''}" data-act="pick" data-i="${j}"${st.solved[j] ? ' disabled style="opacity:.55"' : ''}><span class="ac-g">${GREEK[i]}</span>${st.solved[j] ? ` = ${M.val[j]}° ✓` : ''}</button>`).join('');
  $('ac3rules').innerHTML = ['opp', 'str', 'arc'].map((r) => `<button type="button" class="chip ac-c${S.rule === r ? ' on' : ''}" data-act="rule" data-r="${r}">${esc(v.rules[r])}</button>`).join('');
  $('ac3V').textContent = `${S.g3}°`; $('ac3g').value = S.g3;
  const msg = $('ac3msg'); msg.hidden = !S.msg; msg.textContent = S.msg; msg.className = `ac-verdict ${S.msgOk ? 'ok' : 'no'}`;
  $('ac3next').hidden = !all; $('ac3next').textContent = v.next;
  const items = st.log.map((e) => `<li>${GREEK[M.unk.indexOf(e.u)]} = ${M.val[e.u]}° · ${esc(v.rules[e.rule])}: ${esc(e.math)}</li>`).join('');
  const extra = items ? `<ul class="ac-log">${items}</ul>` : '';

  const total = M.unk.length;

  const s = all ? v.stDone : solvedN ? v.stMid(solvedN, total) : v.stAsk;

function rSecA(t) {

  const s = eq ? v.same : v.diff(x, y); lab.setState({ emo: s[0], title: s[1], lead: s[2], body: '', extra: '' }); lab.setFacts([]);
