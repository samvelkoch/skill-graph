  if (landed && S.snd1 !== r) { S.snd1 = r; S.right1[r] = ok; (ok ? sfx.good : sfx.bad)(); }
  const badge = landed ? `<span class="ac-badge ${R.stat ? 'st' : 'on'}">${esc(R.stat ? t.v1.stat : t.v1.one)}</span>` : '';
  let h = `<span class="ac-round">${esc(t.v1.round(r + 1))}</span><div class="ac-q">${esc(q.q)}${badge}</div>`;
  if (!guessed) h += `<div class="ac-lbl">${esc(t.v1.q)}</div><div class="ac-row" style="margin-top:0">${chip('g1', 'data-g="same"', esc(t.v1.same))}${chip('g1', 'data-g="diff"', esc(t.v1.diff))}</div>`;
  else {
    h += `<div class="ac-row" style="margin-top:0">${['same', 'diff'].map((g) => chip('g1', `data-g="${g}" disabled`, esc(t.v1[g]), landed ? ((g === 'diff') === R.stat ? 'good' : S.g1 === g ? 'bad' : '') : S.g1 === g ? 'on' : '')).join('')}</div>`;
    if (landed) h += `<div class="ac-twin"><b>${esc(t.v1.twin)}</b>${esc(q.tw)}<span class="ac-badge ${R.stat ? 'on' : 'st'}">${esc(R.stat ? t.v1.one : t.v1.stat)}</span></div>
      <div class="ac-row"><button class="btn" data-act="next1">${esc(r >= 3 ? t.fin : t.next)}</button></div>`;
  }
  $('vOne').innerHTML = h;
  const n = S.right1.filter((x, i) => i < r || (i === r && landed)).length;
  lab.setReadout(`${k} / 4`, t.right, t.v1.round(r + 1), '#6aa8ff');
  if (!guessed) lab.setState({ emo: '🤔', title: t.v1.hint[0], lead: t.v1.hint[1], body: '', extra: '' });
  else if (!landed) lab.setState({ emo: '🙋', title: t.v1.wait, lead: t.v1.waitL, body: '', extra: '' });
  else lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ok : t.no, lead: R.stat ? t.v1.okS : t.v1.okO, body: '', extra: '' });
  void n;
}

function renderCol(t) {
  const time = now(), key = Q2[S.qi], ctx = CTX[key], recs = S.recs2, n = recs.length, started = n > 0;
  lab.setGlow('rgba(245, 200, 76, .24)');
  const L = ctx.labels(t), landedAll = landedOf(recs, time), m = modeOf(ctx, recs, time), done24 = landedAll === 24;
  const total = S.row1 ? 6 : 24;
  let h = `<div class="ac-row" style="margin-top:0">${Q2.map((k, i) => chip('q2', `data-i="${i}"`, esc(t.cq[k][0]), i === S.qi ? 'on' : '')).join('')}</div>`;
  h += `<div class="ac-lbl">${esc(t.v2.q)}</div><div class="ac-row" id="predChips" style="margin-top:0">${L.map((l, b) => chip('pred', `data-i="${b}" ${started ? 'disabled' : ''}`, esc(ctx.num ? ctx.mode(b, t) : l), S.pred === b ? (done24 ? (m === b ? 'good' : 'bad') : 'on') : done24 && m === b ? 'good' : '')).join('')}</div>`;
  h += `<div class="ac-row"><button class="btn" data-act="all" ${n >= total ? 'disabled' : ''}>${esc(t.v2.all)}</button>${chip('row1', '', esc(t.v2.row), S.row1 ? 'on' : '')}${started ? chip('redo', '', esc(t.v2.redo)) : ''}</div>`;
  h += tallyTable(t, ctx, recs, time);
  $('vCol').innerHTML = h;
  const pillTxt = n ? `${t.v2.common}: ${m >= 0 ? ctx.mode(m, t) : t.v2.unclear}` : '';
  lab.setReadout(`${n} / 24`, t.v2.asked, pillTxt, '#f5c84c');
  if (S.pred === null && !started) lab.setState({ emo: '🤔', title: t.v2.g1[0], lead: t.v2.g1[1], body: '', extra: '' });
  else if (!started) lab.setState({ emo: '👆', title: t.v2.tap, lead: '', body: '', extra: '' });
  else if (done24) {
    const ok = S.pred === m, rg = ctx.num ? rangeOf(ctx, recs, time)[2] : '';
    lab.setState({ emo: ok ? '✅' : '📊', title: ok ? t.ok : t.no, lead: t.v2.doneL(ctx.mode(m, t)) + (rg ? ' ' + rg.charAt(0).toUpperCase() + rg.slice(1) + '.' : ''), body: t.v2.doneB, extra: '' });
  } else if (S.row1 && landedAll === 6) lab.setState({ emo: '🔍', title: t.v2.smallT, lead: t.v2.smallL(m >= 0 ? ctx.mode(m, t) : t.v2.unclear), body: '', extra: '' });
  else lab.setState({ emo: '✍️', title: t.v2.run(n), lead: t.v2.runL, body: '', extra: '' });
}

function renderFix(t) {
  const time = now(), f = S.f, F = t.f[f], picked = S.pick !== null, landed = S.fixedMade && landedOf(S.recs3, time) === 24;
  const k = S.right3.filter(Boolean).length;
  lab.setGlow('rgba(111, 207, 138, .24)');
  if (S.end3) {
    $('vFix').innerHTML = `<div class="ac-row"><button class="btn" data-act="again3">${esc(t.again)}</button></div>`;
    lab.setReadout(`${k} / 3`, t.right, '', '#6fcf8a');
    lab.setState({ emo: '🏆', title: t.v3.endT(k), lead: t.v3.endL, body: '', extra: '' }); return;
  }
  const ok = picked && S.pick === FIXOK[f];
  if (landed && S.snd3 !== f) { S.snd3 = f; S.right3[f] = ok; (ok ? sfx.good : sfx.bad)(); }
  let h = `<span class="ac-round">${esc(t.v3.prog(f + 1))}</span><div class="ac-fz">${esc(F.fz)}</div><div class="ac-lbl">${esc(t.v3.pick)}</div>`;
  h += F.opts.map((o, i) => `<button class="ac-opt ${picked ? (i === FIXOK[f] && S.fixedMade ? 'good' : i === S.pick && S.fixedMade ? 'bad' : '') : ''}" data-act="pick" data-i="${i}" ${picked ? 'disabled' : ''}>${esc(o)}</button>`).join('');
  if (landed) h += `<div class="ac-row"><button class="btn" data-act="next3">${esc(f >= 2 ? t.fin : t.next)}</button></div>`;
  $('vFix').innerHTML = h;
  lab.setReadout(`${k} / 3`, t.right, t.v3.prog(f + 1), '#6fcf8a');
  if (!picked) lab.setState({ emo: '🤔', title: F.fz, lead: t.v3.pick, body: '', extra: '' });
  else if (!S.fixedMade) lab.setState({ emo: '🗣️', title: t.v3.fz[0], lead: t.v3.fz[1], body: '', extra: '' });
  else if (!landed) lab.setState({ emo: '📊', title: t.v3.fx[0], lead: t.v3.fx[1], body: '', extra: '' });
  else lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ok : t.no, lead: ok ? t.v3.okL : t.v3.noL, body: t.v3.fx[1], extra: '' });
}

function renderA(t) {
  const time = now(), done = S.aGo && landedOf(S.recsA[0], time) === 24 && landedOf(S.recsA[1], time) === 24, started = S.recsA[0].length > 0;
  lab.setGlow('rgba(165, 139, 255, .26)');
  $('vSecA').innerHTML = `<div class="ac-q">${esc(t.sa.q)}</div><div class="ac-row" style="margin-top:0"><button class="btn" data-act="askA">${esc(t.sa.go)}</button></div>`;
  if (done && !S.sndA) { S.sndA = true; sfx.good(); }
  lab.setReadout(done ? '4A · 4B' : '?', done ? `${t.range(0, 3, '')} · ${t.range(0, 5, '')}` : '', '', '#a58bff');
  if (!started) lab.setState({ emo: '🏫', title: t.secrets.a[0], lead: t.secrets.a[1], body: '', extra: '' });
  else if (!done) lab.setState({ emo: '🙋', title: t.sa.wait, lead: t.sa.waitL, body: '', extra: '' });
  else lab.setState({ emo: '📊', title: t.sa.doneT, lead: t.sa.doneL, body: '', extra: '' });
}

function renderB(t) {
  const time = now(), recs = S.recsB, n = recs.length, ctx = CTX.sport, landed = landedOf(recs, time), m = modeOf(ctx, recs, time);
  lab.setGlow('rgba(255, 143, 107, .26)');
  $('vSecB').innerHTML = `<div class="ac-q">${esc(t.sb.q)}</div><div class="ac-row" style="margin-top:0">${chip('askB', 'data-m="club"', '⚽ ' + esc(t.sb.club), S.bMode === 'club' ? 'on' : '')}${chip('askB', 'data-m="all"', esc(t.sb.whole), S.bMode === 'all' ? 'on' : '')}</div>${n ? tallyTable(t, ctx, recs, time) : ''}`;
  lab.setReadout(`${n}`, t.v2.asked, n ? `${t.v2.common}: ${m >= 0 ? ctx.mode(m, t) : t.v2.unclear}` : '', '#ff8f6b');
  if (!n) lab.setState({ emo: '⚽', title: t.sb.start[0], lead: t.sb.start[1], body: '', extra: '' });
  else if (landed < n) lab.setState({ emo: '🙋', title: t.v2.run(n), lead: t.v2.runL, body: '', extra: '' });
  else if (S.bMode === 'club') lab.setState({ emo: '⚽', title: t.sb.clubT, lead: t.sb.clubL, body: '', extra: '' });
  else lab.setState({ emo: '🏫', title: t.sb.allT, lead: t.sb.allL, body: '', extra: '' });
}
render();
</script>
</body>
</html>
