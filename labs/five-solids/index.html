function drawCorner(c, w, h, dt, time) {
  const t = T[lang], guessed = S.cg !== null;
  if (guessed && S.five) { drawFive(c, w, h, time, (i) => [t.sol[FIVE[i]], FIVE_CFG[i]], (i) => { const p = PLATO[i]; return () => [p.h, p.s, 18, 40]; }); return; }

    c.globalAlpha = 1 - ft; c.fillStyle = pg; c.beginPath(); c.arc(ox, oy, Math.max(0, pr), 0, Math.PI * 2); c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(190,205,255,.25)'; c.stroke();
    // the gap: the part of the turn that is still empty

      c.closePath(); c.fillStyle = 'rgba(255,255,255,.07)'; c.fill(); c.setLineDash([5, 5]); c.lineWidth = 1.3; c.strokeStyle = 'rgba(255,255,255,.55)'; c.stroke(); c.setLineDash([]);

// a row of solids with labels; used by Corner (the five) and World (dice, Plato)
function drawFive(c, w, h, time, labels, pal) {
  const slots = rowSlots(5, w, h);
  FIVE.forEach((k, i) => {

    shadow(c, s.x, s.y + s.R * 0.98, s.R, 0.3);
    drawSolid(c, sol, s.x, s.y, s.R, time * 0.5 + i * 0.7 + S.yawOff, TILT, { dots: false, pal: pal ? pal(i) : null, hue: 232 });
    if (S.pick === i) { c.beginPath(); c.arc(s.x, s.y, s.R * 1.18, 0, Math.PI * 2); c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,.55)'; c.setLineDash([4, 4]); c.stroke(); c.setLineDash([]); }

function drawKepler(c, w, h, time, layers) {

}

function drawLocked(c, w, h, time) {

// --- pointer: drag the picture sideways to turn the solids; a tap picks ------------------------------------------
const cvs = $('cv');
cvs.addEventListener('pointerdown', (ev) => { S.drag = { x: ev.clientX, y0: ev.clientY, tot: 0, moved: false }; try { cvs.setPointerCapture(ev.pointerId); } catch { /* no capture */ } });
cvs.addEventListener('pointermove', (ev) => {
  const d = S.drag; if (!d) return;
  const dx = ev.clientX - d.x; d.x = ev.clientX; d.tot += Math.abs(dx);
  if (d.tot > 6) d.moved = true;
  if (d.moved && (lab.view !== 'corner' || S.ft > 0.5)) S.yawOff += dx * 0.012;
});
cvs.addEventListener('pointerup', (ev) => {
  const d = S.drag; S.drag = null; if (!d || d.moved || Math.abs(ev.clientY - d.y0) > 8) return;
  const r = cvs.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const hit = hits.find((q) => x >= q.x0 && x <= q.x1 && y >= q.y0 && y <= q.y1);
  if (hit) tapped(hit);
});
cvs.addEventListener('pointercancel', () => { S.drag = null; });
function tapped(hit) {
  if (lab.view === 'count') {
    if (hit.act === 'pick') { S.vd = null; startCount(hit.arg); }
    else if (hit.act === 'main') {
      const sol = curSol();
      if (!S.started) startCount(S.sel, S.sec);
      else if (!progress(sol, S.cT).done) S.cT = sched(sol).end + 0.01;
      else startCount(S.sel, S.sec);
    }
    render();
  } else if (lab.view === 'world' && hit.act === 'five' && (S.w === 'dice' || S.w === 'plato')) { S.pick = S.pick === hit.arg ? -1 : hit.arg; sfx.click(); render(); }
  else if (lab.view === 'corner' && hit.act === 'five') { S.pick = S.pick === hit.arg ? -1 : hit.arg; sfx.click(); render(); }
}

// --- controls ----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'guess') {
    const n = +b.dataset.v, key = PRED[S.pi].key, F = SOL[key].F, ok = n === F;
    S.pg = n; S.vd = { ok, F }; if (ok) { S.rights++; sfx.good(); } else sfx.bad();
    if (S.rights >= 2) S.rule = true;
    startCount(key); showStage();
  } else if (act === 'next') { S.pi = Math.min(3, S.pi + 1); S.pg = null; S.vd = null; sfx.click(); }
  else if (act === 'rule') { S.rule = true; sfx.good(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'frame') { S.vd = null; startCount(S.sel, 'frame'); showStage(); }
    else { S.w = 'kepler'; S.ksec = true; S.kl = 0; sfx.click(); }
  } else if (act === 'cg') {
    S.cg = +b.dataset.v; (S.cg === 1 ? sfx.good : sfx.bad)(); S.fold = false; S.ft = 0;
  } else if (act === 'poly') { S.cm = +b.dataset.m; S.fold = false; sfx.tick(); }
  else if (act === 'kadd') { S.ck = Math.min(8, S.ck + 1); S.fold = false; sfx.tick(); }
  else if (act === 'krem') { S.ck = Math.max(0, S.ck - 1); S.fold = false; sfx.tick(); }
  else if (act === 'fold') { if (!fits(S.cm, S.ck)) return; S.fold = !S.fold; sfx.snap(); }
  else if (act === 'five') { S.five = !S.five; S.pick = -1; sfx.click(); }
  else if (act === 'wi') { S.w = b.dataset.k; S.ksec = false; S.pick = -1; sfx.click(); }
  else if (act === 'bg') { S.bg = +b.dataset.v; (S.bg === SOL.ball.F ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'kstep') { S.kl = clamp(S.kl + +b.dataset.s, 0, 5); sfx.tick(); }

// --- render: controls, readout and the state card for each view -------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('sCount').hidden = v !== 'count'; $('sCorner').hidden = v !== 'corner'; $('sWorld').hidden = v !== 'world';
  if (v === 'count') renderCount(t); else if (v === 'corner') renderCorner(t); else renderWorld(t);

function renderCount(t) {

  readCount();

  if (S.pi < 3 && ready) {
    const q = t.c.q[S.pi], o = PRED[S.pi];
    if (S.pg === null) h += `<div class="fs-q">${esc(q)}</div><div class="fs-opts">${o.opts.map((n) => `<button class="fs-opt" data-act="guess" data-v="${n}">${n}</button>`).join('')}</div>`;
    else {
      const F = SOL[o.key].F;
      h += `<div class="fs-q small">${esc(q)}</div><div class="fs-opts">${o.opts.map((n) => `<button class="fs-opt ${n === F ? 'good' : n === S.pg ? 'bad' : ''}" disabled>${n}</button>`).join('')}</div>`;
      h += `<div class="row2">${S.pi < 2 ? `<button class="btn" data-act="next">${esc(t.c.next)} →</button>` : ''}${!S.rule ? `<button class="chip" data-act="rule">${esc(t.c.rule)}</button>` : ''}</div>`;
      if (finished) h += `<p class="fs-tip" style="margin-top:10px">${esc(t.c.done)}</p>`;
    }
  } else if (S.pi < 3) h += `<p class="fs-tip">${esc(t.c.tip(Math.min(3, S.rows.length)))}</p>`;
  else h += `<p class="fs-tip">${esc(t.c.done)}</p>${!S.rule ? `<div class="row2"><button class="chip" data-act="rule">${esc(t.c.rule)}</button></div>` : ''}`;
  if (S.rows.length) {
    h += `<table class="fs-tb"><tr><th>${esc(t.c.th)}</th><th>${t.L.v}</th><th>${t.L.e}</th><th>${t.L.f}</th><th>${esc(t.c.sum)}</th></tr>${S.rows.map((k) => {
      const s = SOL[k]; return `<tr><td>${esc(t.sol[k])}</td><td>${s.V}</td><td>${s.E}</td><td>${s.F}</td>${S.rule ? `<td class="ok">${s.V - s.E + s.F}</td>` : '<td class="x">?</td>'}</tr>`;
    }).join('')}</table>`;
  }
  h += `<div class="row2"><button class="chip secret ${open ? 'open' : ''} ${S.sec === 'frame' ? 'on' : ''}" data-act="sec" data-k="frame">${open ? `🖼️ ${esc(t.secrets.frame[0])}` : '🔒 ???'}</button></div>`;
  $('sCount').innerHTML = h;
  // state card
  let st;
  const nm = t.sol[S.sec === 'frame' ? 'frame' : S.sel];
  if (S.sec === 'frame') st = done ? { emo: '🖼️', title: t.c.frT(sol.V, sol.E, sol.F), lead: t.c.frL, body: S.rule ? t.c.frR : t.c.frX } : { emo: '🖼️', title: nm, lead: t.c.counting, body: '' };
  else if (S.pi < 3 && ready && S.pg === null) st = { emo: '🧩', title: t.c.puzzleT, lead: t.c.q[S.pi], body: '' };
  else if (S.vd && !done) st = { emo: '🧩', title: S.vd.ok ? t.c.right : t.c.wrong(S.vd.F), lead: t.c.counting, body: '' };
  else if (S.vd && done && !S.rule) st = { emo: S.vd.ok ? '✅' : '🤔', title: S.vd.ok ? t.c.right : t.c.wrong(S.vd.F), lead: t.cnt(sol.V, sol.E, sol.F), body: t.c.lookT };
  else if (done && S.rule) st = { emo: '📏', title: t.c.ruleT, lead: `${nm}: ${sol.V} − ${sol.E} + ${sol.F} = ${sol.V - sol.E + sol.F}`, body: t.c.ruleB };
  else if (done) st = { emo: '🔢', title: nm, lead: t.cnt(sol.V, sol.E, sol.F), body: t.c.again };
  else if (S.started) st = { emo: '🔢', title: nm, lead: t.c.counting, body: '' };
  else st = { emo: '🔢', title: t.c.startT, lead: t.c.startL, body: t.legend };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(S.rule ? t.facts.count1 : t.facts.count0);

    h += `<div class="row2" style="margin-top:0"><button class="chip" data-act="five">${esc(k.paper)}</button></div><p class="fs-tip" style="margin-top:10px">${esc(k.fiveB)}</p>`;
    lab.setReadout('5', '', '', TEAL);
    lab.setState({ emo: '🎉', title: k.five[0], lead: S.pick >= 0 ? `${T[lang].sol[FIVE[S.pick]]}: ${SOL[FIVE[S.pick]].V} − ${SOL[FIVE[S.pick]].E} + ${SOL[FIVE[S.pick]].F} = ${SOL[FIVE[S.pick]].V - SOL[FIVE[S.pick]].E + SOL[FIVE[S.pick]].F}` : k.five[1], body: '', extra: '' });
    $('sCorner').innerHTML = h;
    lab.setFacts(t.facts.corner);
    return;
  }
  h += `<div class="fs-polys">${[3, 4, 5, 6, 7, 8].map((q) => `<button class="fs-poly ${S.cm === q ? 'on' : ''}" data-act="poly" data-m="${q}" aria-label="${esc(k.poly[q])}">${polySvg(q)}<b>${q}</b></button>`).join('')}</div>`;
  h += `<div class="row2"><div class="fs-step"><button class="fs-sb" data-act="krem" aria-label="${esc(k.rem)}" ${K <= 0 ? 'disabled' : ''}>−</button><b>${K}</b><button class="fs-sb" data-act="kadd" aria-label="${esc(k.add)}" ${K >= 8 ? 'disabled' : ''}>+</button></div>
    <button class="btn push" data-act="fold" ${ok ? '' : 'disabled'}>${esc(S.fold ? k.unfold : k.fold)}</button></div>`;
  h += `<div class="fs-found">${S.found.length ? `<span>${esc(k.found(S.found.length))}</span>${S.found.map((f) => { const [mm, kk] = f.split('x').map(Number); return `<span class="fs-fnd">${kk} × ${polySvg(mm, 10)}</span>`; }).join('')}` : ''}${S.fiveSeen ? `<button class="chip" data-act="five">${esc(k.solids)}</button>` : ''}</div>`;
  $('sCorner').innerHTML = h;
  const gap = Math.round((360 - sum) * 10) / 10;
  lab.setReadout(K ? `${K} × ${fmt(deg)}° = ${fmt(sum)}°` : `${fmt(deg)}°`, K === 0 ? '' : K < 3 ? '' : over ? k.over(fmt(sum - 360)) : flat ? k.nogap : k.gap(fmt(gap)),
    K < 3 ? (K ? k.pill.few : '') : ok ? k.pill.gap : flat ? k.pill.flat : k.pill.over, TEAL);
  let st;
  if (K === 0) st = k.stEmpty; else if (K < 3) st = k.stFew; else if (over) st = k.stOver(fmt(sum - 360)); else if (flat) st = k.stFlat;
  else if (foldedNow) st = k.stFold; else st = k.stGap(fmt(gap));
  const emo = K === 0 ? '📐' : K < 3 ? '✋' : over ? '🚫' : flat ? '🟰' : foldedNow ? '✅' : '📐';
  const intro = S.found.length === 0 && !S.fold && K === 3 && m === 3 ? (S.cg === 1 ? k.afterR : k.afterW) : '';
  lab.setState({ emo, title: st[0], lead: st[1], body: intro, extra: '' });
  lab.setFacts(t.facts.corner);
}

function renderWorld(t) {
  lab.setGlow('rgba(150,120,255,.22)');
  const w = t.w;
  if (S.cg === null) {
    $('sWorld').innerHTML = `<div class="fs-q">${esc(t.k.lockL)}</div><div class="row2"><button class="btn" data-act="goto" data-v="corner">📐 ${esc(t.k.lockB)}</button></div>`;
    lab.setReadout('🔒', '', '', '#9a82ff');
    lab.setState({ emo: '🔒', title: t.k.lockT, lead: t.k.lockL, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const open = secret.unlocked(), key = S.w, sol = key === 'virus' ? SOL.ico : key === 'ball' ? SOL.ball : null;
  let h = `<div class="chips">${['dice', 'virus', 'plato', 'kepler', 'ball'].map((k) => `<button class="chip ${S.w === k && !S.ksec ? 'on' : ''}" data-act="wi" data-k="${k}">${esc(w.chips[k])}</button>`).join('')}</div>`;
  if (key === 'ball' && S.bg === null) {
    const b = SOL.ball;
    h += `<div class="fs-q" style="margin-top:14px">${esc(w.ballQ(b.V, b.E))}</div><div class="fs-opts">${[b.E / 3, b.F, b.V + b.E].map((n) => `<button class="fs-opt" data-act="bg" data-v="${n}">${n}</button>`).join('')}</div>`;
    if (!S.rule) h += `<div class="row2"><button class="chip" data-act="goto" data-v="count">${esc(w.goCount)}</button></div>`;
  } else if (key === 'ball') {
    const b = SOL.ball, pent = b.faces.filter((f) => f.length === 5).length, hex = b.faces.filter((f) => f.length === 6).length;
    void pent; void hex;
    h += `<div class="fs-opts" style="margin-top:14px">${[b.E / 3, b.F, b.V + b.E].map((n) => `<button class="fs-opt ${n === b.F ? 'good' : n === S.bg ? 'bad' : ''}" disabled>${n}</button>`).join('')}</div>`;
  }
  if (key === 'kepler' && S.ksec) {
    h += `<div class="row2"><div class="fs-step"><button class="fs-sb" data-act="kstep" data-s="-1" ${S.kl <= 0 ? 'disabled' : ''}>−</button><b>${S.kl}</b><button class="fs-sb" data-act="kstep" data-s="1" ${S.kl >= 5 ? 'disabled' : ''}>+</button></div><span class="fs-tip">${esc(w.layer(S.kl))}</span></div>`;
  }
  h += `<div class="row2"><button class="chip secret ${open ? 'open' : ''} ${S.ksec ? 'on' : ''}" data-act="sec" data-k="kepler">${open ? `🪐 ${esc(t.secrets.kepler[0])}` : '🔒 ???'}</button></div>`;
  $('sWorld').innerHTML = h;
  // readout and state card
  let st = w[key] || w.kepler, extra = '', body = '';
  const eulerLine = (s, nm) => `<li>${esc(nm)}: ${s.V} − ${s.E} + ${s.F} = <b>${s.V - s.E + s.F}</b></li>`;
  const list = (keys) => (S.rule ? `<div class="fs-lock">${esc(w.eulerT)}</div><ul class="fs-eul">${keys.map((k) => eulerLine(SOL[k], t.sol[k])).join('')}</ul>` : `<div class="fs-tip">${esc(w.noRule)}</div>`);
  if (key === 'dice' || key === 'plato') {
    extra = list(FIVE);
    const p = S.pick; lab.setReadout(p >= 0 ? `${key === 'dice' ? FIVE_DIE[p] : t.w.el[[0, 1, 2, 4, 3][p]]}` : (key === 'dice' ? 'd4 · d6 · d8 · d12 · d20' : '🔥 🌍 💨 💧 ✨'), p >= 0 ? `${t.L.v} ${SOL[FIVE[p]].V} · ${t.L.e} ${SOL[FIVE[p]].E} · ${t.L.f} ${SOL[FIVE[p]].F}` : '', '', '#9a82ff');
  } else if (key === 'virus') {
    extra = list(['ico']); lab.setReadout(`${t.L.v} ${sol.V} · ${t.L.e} ${sol.E} · ${t.L.f} ${sol.F}`, '', '', '#9a82ff');
  } else if (key === 'kepler') {
    if (S.ksec) {
      st = S.kl === 0 ? w.kl0 : w.kl(t.sol[KEP.order[S.kl - 1]], w.planets[S.kl - 1], w.planets[S.kl]);
      lab.setReadout(`${S.kl} / 5`, '', '', '#9a82ff');
    } else { body = w.keplerB; extra = list(FIVE); lab.setReadout('1596', '', '', '#9a82ff'); }
  } else {
    const b = SOL.ball;
    if (S.bg === null) { st = [w.ballT, w.ballQ(b.V, b.E)]; lab.setReadout(`${t.L.v} ${b.V} · ${t.L.e} ${b.E} · ${t.L.f} ?`, '', '', '#9a82ff'); }
    else {
      const pent = b.faces.filter((f) => f.length === 5).length, hex = b.faces.filter((f) => f.length === 6).length, okk = S.bg === b.F;
      st = [okk ? w.ballR : w.ballW(b.F), `${t.sol.ball}: ${b.V} − ${b.E} + ${b.F} = ${b.V - b.E + b.F}`]; body = w.ballB(pent, hex);
      lab.setReadout(`${t.L.v} ${b.V} · ${t.L.e} ${b.E} · ${t.L.f} ${b.F}`, '', S.rule ? `${b.V} − ${b.E} + ${b.F} = ${b.V - b.E + b.F}` : '', '#9a82ff');
    }
  }
  lab.setState({ emo: key === 'ball' && S.bg !== null ? (S.bg === SOL.ball.F ? '✅' : '🤔') : { dice: '🎲', virus: '🦠', plato: '🏛️', kepler: '🪐', ball: '⚽' }[key], title: st[0], lead: st[1], body, extra });
  lab.setFacts(key === 'ball' ? (S.bg === null ? t.facts.ball0 : t.facts.ball1) : t.facts[key]);
}
render();
</script>
</body>
</html>
