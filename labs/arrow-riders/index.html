function drawSize(c, w, h, dt) {

    c.strokeStyle = `rgba(255,190,100,${q})`; c.lineWidth = 1.8; c.setLineDash([5, 3]); c.stroke(); c.setLineDash([]);
  }

  if (rev && z.eu) { poly(c, B, EUR); c.fillStyle = 'rgba(155,229,143,.16)'; c.fill(); c.strokeStyle = '#9be58f'; c.lineWidth = 2; c.stroke(); }
  if (showRu) pill(c, t.russiaN, ...proj(B, 90, 66), { fg: '#bfeaff', stroke: '#6fd0ff' });

    const [kx, ky] = proj(B, ...KARAK); c.fillStyle = '#fff'; ell(c, kx, ky, 3.2, 3.2); c.fill(); c.strokeStyle = '#d9402f'; c.lineWidth = 1.6; c.stroke();
    pill(c, `1279 · ${t.approx}`, B.ox + 8, B.oy + B.mh - 14, { al: 'l', sz: 12 });
  }

    c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.setLineDash([2, 5]); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2; c.beginPath(); R.P.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.stroke(); c.setLineDash([]);

    const [hx, hy] = mk(fHorse, '#8d7a5e', 20), [rx, ry] = mk(fRel, '#ff9f2e', -20);

}

// view 3: the station and the paiza
function paintYard(c, w, h) {
  const hz = h * 0.4, R = rnd(5), gy = h * 0.8;
  c.fillStyle = lg(c, 0, 0, 0, hz, [[0, '#86aedb'], [1, '#f2e2bf']]); c.fillRect(0, 0, w, hz + 2);
  c.fillStyle = rg(c, w * 0.12, hz * 0.3, 0, w * 0.4, [[0, 'rgba(255,240,200,.7)'], [1, 'rgba(255,240,200,0)']]); c.fillRect(0, 0, w, hz);
  ridge(c, w, hz + 2, h * 0.16, 9, '#9fb6d8', '#c4d2e6', R, true); ridge(c, w, hz + 3, h * 0.08, 12, '#85a0c9', '#aec2de', R, false);
  c.fillStyle = lg(c, 0, hz, 0, h, [[0, '#d9c27c'], [0.4, '#caa55c'], [1, '#a47c3a']]); c.fillRect(0, hz + 1, w, h - hz);
  for (let i = 0; i < 12; i++) { c.fillStyle = i % 2 ? 'rgba(255,235,160,.14)' : 'rgba(110,75,20,.14)'; ell(c, R() * w, hz + 20 + R() * (h - hz - 20), 26 + R() * 44, 7 + R() * 12); c.fill(); }
  for (let i = 0; i < 90; i++) { const x = R() * w, y = hz + 8 + R() * (h - hz - 8); c.strokeStyle = R() > 0.5 ? 'rgba(120,85,25,.4)' : 'rgba(250,225,130,.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 1, y - 3, x + 2.5, y - 5); c.stroke(); }
  yurt(c, w * 0.8, hz + h * 0.2, Math.min(w, h) / 150); yurt(c, w * 0.55, hz + h * 0.09, 1.1);
  c.strokeStyle = '#6b4a24'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(w * 0.3, hz + h * 0.12); c.lineTo(w * 0.3, hz - h * 0.12); c.stroke();
  c.fillStyle = '#d9402f'; c.beginPath(); c.moveTo(w * 0.3, hz - h * 0.12); c.lineTo(w * 0.3 + 24, hz - h * 0.1); c.lineTo(w * 0.3, hz - h * 0.07); c.closePath(); c.fill();
  const fy = gy - h * 0.1; c.strokeStyle = '#7a5530'; c.lineWidth = 3;
  [fy - 14, fy - 4].forEach((y) => { c.beginPath(); c.moveTo(w * 0.62, y); c.lineTo(w, y); c.stroke(); });
  for (let x = w * 0.64; x < w; x += w * 0.07) { c.lineWidth = 4; c.beginPath(); c.moveTo(x, fy - 20); c.lineTo(x, fy + 4); c.stroke(); }
  c.save(); c.translate(w * 0.69, fy + 2); c.scale(0.8, 0.8); horse(c, HC[0], 0, false, false); c.restore();
  c.save(); c.translate(w * 0.8, fy + 4); c.scale(0.8, 0.8); horse(c, HC[2], 0, false, false); c.restore();
  c.fillStyle = 'rgba(80,50,15,.14)'; ell(c, w * 0.45, gy + 6, w * 0.5, h * 0.06); c.fill();
}
function updatePaiza(dt) { const p = S.p; if (p.pt >= 0 && p.pt < 6) { p.pt += dt; if (p.pt >= 6) readout(); } }
function drawPaiza(c, w, h) {
  const t = T[lang], p = S.p, gy = h * 0.8, PS = clamp(Math.min(w / 235, h / 230), 1, 2.4), TT = 1.35, ease = easeIO;
  c.drawImage(cached('yard', w, h, paintYard), 0, 0, w, h);
  const qx = (i) => w * (0.08 + 0.17 * i), fx = w * 0.58, hx = w * 0.88, kx = w * 0.73, ph = (p.pt * 9) || 0;
  const hs = PS * 0.95, winnerIn = p.order.indexOf('m');
  // the fresh grey horse waits by the keeper until the messenger mounts it
  const mounted = p.pt >= 0 && p.pt - winnerIn * TT >= 1.3;
  if (!mounted) { c.save(); c.translate(hx, gy - 2); c.scale(hs, hs); c.fillStyle = 'rgba(40,25,10,.25)'; ell(c, 0, 1, 18, 3.5); c.fill(); horse(c, HC[1], 0, false, false); c.restore(); }
  c.save(); c.translate(kx, gy); c.scale(PS, PS);
  c.fillStyle = 'rgba(40,25,10,.3)'; ell(c, 0, 1, 9, 2.6); c.fill();
  c.fillStyle = '#2e2018'; rr(c, -4.5, -10, 3.8, 10, 1.6); c.fill(); rr(c, 0.7, -10, 3.8, 10, 1.6); c.fill();
  c.beginPath(); c.moveTo(-6.5, -9); c.lineTo(6.5, -9); c.lineTo(5.2, -32); c.lineTo(-5.2, -32); c.closePath(); c.fillStyle = lg(c, -6, -32, 6, -9, [[0, '#4a82d0'], [1, '#2a5290']]); c.fill();
  c.fillStyle = '#e8b94a'; c.fillRect(-6, -19, 12, 2.2);
  c.fillStyle = lg(c, -4, -42, 4, -34, [[0, '#f2c79a'], [1, '#d99e6c']]); ell(c, 0, -38, 5.2, 5.2); c.fill();
  c.fillStyle = '#2a1a10'; ell(c, -2, -38.5, 0.7, 0.8); c.fill(); ell(c, 1.4, -38.5, 0.7, 0.8); c.fill();
  c.fillStyle = '#5a3a28'; ell(c, 0, -42.6, 6.8, 3.2); c.fill(); c.fillStyle = '#3b6fb6'; c.beginPath(); c.arc(0, -43, 5.2, Math.PI, 0); c.closePath(); c.fill();
  c.restore();
  const who = (i) => p.order[i];

    const type = who(i), win = type === 'm', ti = p.pt - i * TT;
    let x = qx(i), mv = false, bubble = null, show = true;
    if (p.pt >= 0 && ti >= 0) {
      if (ti < 0.5) { x = lerp(qx(i), fx, ease(ti / 0.5)); mv = true; }
      else if (ti < 0.95) { x = fx; bubble = win ? '✅' : '❌'; }
      else if (win) { if (ti < 1.3) { x = lerp(fx, hx - 14 * PS, ease((ti - 0.95) / 0.35)); mv = true; } else show = false; }
      else { const q = clamp((ti - 0.95) / 0.5, 0, 1); x = lerp(fx, qx(i), ease(q)); mv = q < 1; bubble = '❌'; }
    }

      const q = (ti - 1.3) / 0.9; if (q < 1) drawRider(c, hx + (w + 70 - hx) * q * q, gy - 2, hs * 1.0, ph, true, HC[1], false);

      if (bubble) { const bx = x, by = gy - 66 * PS; c.fillStyle = '#fff'; rr(c, bx - 15, by - 14, 30, 26, 10); c.fill(); c.beginPath(); c.moveTo(bx - 4, by + 11); c.lineTo(bx, by + 17); c.lineTo(bx + 4, by + 11); c.fill(); emoji(c, bubble, bx, by, 17); }
      pill(c, t.roles[type], x, gy + 17, { sz: 12 });
    }
    if (type === 'm' && show && !mv && !bubble) pill(c, t.paizaTag, x + 20 * PS, gy - 75 * PS, { sz: 12, fg: '#ffe9a8', stroke: '#e8b94a' });
  }
}

// ---------------------------------------------------------------------------------------------------------------
// controls, readout, state card
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function resetRelay() { S.phase = 'set'; S.guess = null; S.sec = null; S.t = 0; S.x = 0; S.cx = 0; S.st = 1; S.night = 0; S.k = 0; S.mv = false; S.lastIdx = 0; S.horse = 0; S.swap = 9; S.puffs = []; S.cfg = makeCfg(ROUTE, S.sp, S.none); }
function startRun(cfg) { S.cfg = cfg; S.phase = 'run'; S.t = 0; S.x = 0; S.cx = 0; S.st = 1; S.night = 0; S.k = 0; S.lastIdx = 0; S.horse = 0; S.swap = 9; S.puffs = []; }
function makeOpts() {
  const right = S.cfg.days, one = ROUTE / ONE;
  const o = right >= one - 1 ? [right, 4, 10] : [right, one, Math.round((right + one) / 2)];
  S.opts = shuffle([...new Set(o)]);
}
const optHtml = (list, mine, ok, done, fmtOpt) => list.map((o, i) => {
  const cls = done ? (i === ok ? 'good' : i === mine ? 'bad' : '') : '';
  return `<button class="ar-opt ${cls}" data-act="opt" data-i="${i}" ${done ? 'disabled' : ''}>${esc(fmtOpt ? fmtOpt(o) : o)}</button>`;
}).join('');
function readout() {
  const t = T[lang], v = lab.view; let r;
  if (v === 'relay') {
    const g = S.cfg;
    if (S.phase === 'run') r = S.sec ? [fmt(S.x), `${t.km}`, ''] : ['?', `${fmt(S.x)} ${t.km}`, ''];
    else if (S.phase === 'done') r = S.sec === 'a' ? [fmt(g.R), `${t.km} ${t.oneDay}`, ''] : S.sec === 'b' ? [g.days, t.dayw(g.days), `${t.caravanT}: ${t.about} ${Math.round(S.cx)} ${t.km}`] : [g.days, t.dayw(g.days), t.perDay(g.daily)];
    else r = [fmt(ROUTE), `${t.km} · ${t.karak} →`, ''];
  } else if (v === 'size') {
    const z = S.z, dec = lang === 'en' ? '17.1' : '17,1';
    if (z.ride >= 0) { const day = Math.floor((z.ride / 9) * RIDE_DAYS), end = z.ride >= 9; r = end ? [`${REL_DAYS} / ${RIDE_DAYS}`, t.rideSub, ''] : [`${t.day} ${day}`, `${fmt(Math.min(6000, day * 250))} ${t.km}`, '']; }
    else if (z.revT >= 0) r = ['24', `${t.mkm} · ${t.mongol}`, `${t.russiaN} ≈ ${dec}`];
    else r = ['?', t.sub.size, ''];
  } else r = S.p.pt >= 0 ? ['🐎', t.sub.paizaDone, ''] : ['?', t.sub.paiza, ''];
  const k = r.join('|') + lang; if (k === S.ro) return; S.ro = k;
  lab.setReadout(r[0], r[1], r[2], '#e0a23a');
}
function setFacts(list) { lab.setFacts(list); }
function render() {
  const t = T[lang], v = lab.view;
  $('arR').style.display = v === 'relay' ? '' : 'none'; $('arS').style.display = v === 'size' ? '' : 'none'; $('arP').style.display = v === 'paiza' ? '' : 'none';
  const open = secret.unlocked();
  $('arSec').innerHTML = ['a', 'b'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k && v === 'relay' ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'a' ? '🏇' : '🐫'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  S.ro = '';
  if (v === 'relay') renderRelay(t); else if (v === 'size') renderSize(t); else renderPaiza(t);
  readout();
}
function renderRelay(t) {
  const g = S.cfg, ph = S.phase, secrun = !!S.sec;
  $('arSpL').textContent = `${t.spL}: ${S.sp} ${t.km}`; $('arSp').value = S.sp; $('arSp').disabled = S.none;
  $('arE1').textContent = `30 ${t.km}`; $('arE2').textContent = `200 ${t.km}`;
  const nb = $('arNone'); nb.textContent = t.noSt; nb.classList.toggle('on', S.none);
  const go = $('arGo'); go.textContent = t.send; go.hidden = !(ph === 'set' || (ph === 'done' && !secrun));
  let ask = '';
  if (!secrun && (ph === 'ask' || (ph === 'done'))) {
    const done = ph === 'done', mine = S.opts.indexOf(S.guess), ok = S.opts.indexOf(g.days);
    ask = `<div class="ar-ask"><p class="ar-q">${esc(t.qR)}</p><div class="ar-opts">${optHtml(S.opts, mine, ok, done, (n) => t.days(n))}</div>`
      + (done ? `<p class="ar-v ${S.right ? 'ok' : ''}">${esc(S.right ? t.right : t.wrongR(g.days))}</p>` : '') + '</div>';
  }
  $('arAskR').innerHTML = ask;
  let card, facts = [];
  if (secrun) { card = ph === 'run' ? t.card.rRun : S.sec === 'a' ? t.card.long(g.daily) : t.card.cara(g.days, Math.round(S.cx)); if (ph === 'done') facts = t.facts.relay; }
  else if (ph === 'set') card = t.card.rSet; else if (ph === 'ask') card = t.card.rAsk; else if (ph === 'run') card = t.card.rRun;
  else {
    const k = g.none ? 'none' : g.d <= 40 ? 'near' : 'far', c = t.card[k]; facts = t.facts.relay;
    card = { emo: '🐎', title: c.title, lead: `${t.days(g.days)}, ${t.perDay(g.daily)}.`, body: c.body };
  }
  lab.setState(card); setFacts(facts);
}
function renderSize(t) {
  const z = S.z, rev = z.revT >= 0, mine = z.guess;
  $('arAskS').innerHTML = `<div class="ar-ask" style="margin-top:0"><p class="ar-q">${esc(t.qS)}</p><div class="ar-opts ar-col">${optHtml(t.oS, mine, 0, rev)}</div>`
    + (rev ? `<p class="ar-v ${mine === 0 ? 'ok' : ''}">${esc(mine === 0 ? t.right : t.wrongS)}</p>` : '') + '</div>';
  $('arSB').innerHTML = rev ? `<button class="chip ${z.ru ? 'on' : ''}" data-act="zru">${esc(t.russiaToday)}</button><button class="chip ${z.eu ? 'on' : ''}" data-act="zeu">${esc(t.europe)}</button>`
    + `<button class="btn ar-go" data-act="ride">${esc(t.rideAcross)}</button>` : '';
  lab.setState(!rev ? t.card.sAsk : z.ride >= 9 ? t.card.sRide(REL_DAYS, RIDE_DAYS) : z.ride >= 0 ? t.card.sRide(REL_DAYS, RIDE_DAYS) : t.card.sRev);
  setFacts(rev ? t.facts.size : []);
}
function renderPaiza(t) {
  const p = S.p, rev = p.pt >= 0, mine = p.guess;
  $('arAskP').innerHTML = `<div class="ar-ask" style="margin-top:0"><p class="ar-q">${esc(t.qP)}</p><div class="ar-opts ar-col">${optHtml(t.oP, mine, 0, rev)}</div>`
    + (rev ? `<p class="ar-v ${mine === 0 ? 'ok' : ''}">${esc(mine === 0 ? t.right : t.wrongP)}</p>` : '') + '</div>';
  $('arPB').innerHTML = rev ? `<button class="btn ar-go" data-act="replay">${esc(t.again)}</button>` : '';
  lab.setState(rev ? t.card.pRev : t.card.pAsk); setFacts(rev ? t.facts.paiza : []);
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v = lab.view;
  if (a === 'none') { S.none = !S.none; resetRelay(); sfx.click(); }
  else if (a === 'go') { resetRelay(); S.phase = 'ask'; makeOpts(); sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; lab.view = 'relay'; lab.renderChrome(); sfx.click();
    resetRelay(); S.sec = k; startRun(k === 'a' ? makeCfg(300, 30, false) : makeCfg(ROUTE, 30, false)); S.sec = k; render(); showStage(); return;
  } else if (a === 'opt') {
    const i = +b.dataset.i;
    if (v === 'relay' && S.phase === 'ask') { S.guess = S.opts[i]; startRun(makeCfg(ROUTE, S.sp, S.none)); sfx.click(); showStage(); }
    else if (v === 'size' && S.z.revT < 0) { S.z.guess = i; S.z.revT = 0; (i === 0 ? sfx.good : sfx.bad)(); showStage(); }
    else if (v === 'paiza' && S.p.pt < 0) { S.p.guess = i; S.p.pt = 0; (i === 0 ? sfx.good : sfx.bad)(); showStage(); }
  } else if (a === 'zru') { S.z.ru = !S.z.ru; sfx.click(); }
  else if (a === 'zeu') { S.z.eu = !S.z.eu; sfx.click(); }
  else if (a === 'ride') { S.z.ride = 0; sfx.click(); showStage(); }
  else if (a === 'replay') { S.p.pt = 0; sfx.click(); showStage(); }
  render();
});
$('arSp').addEventListener('input', (ev) => { S.sp = +ev.target.value; if (S.phase !== 'set' || S.sec) resetRelay(); else S.cfg = makeCfg(ROUTE, S.sp, S.none); sfx.tick(); render(); });

canvasLoop($('cv'), (c, w, h, dt, time) => {
  W = w; H = h;
  const v = lab.view;
  if (v === 'relay') { updateRelay(dt); drawRelay(c, w, h, dt, time); }
  else if (v === 'size') { updateSize(dt); drawSize(c, w, h, dt); }
  else { updatePaiza(dt); drawPaiza(c, w, h); }
});
render();
