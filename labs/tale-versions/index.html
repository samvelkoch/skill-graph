  const bk = ev.target.closest('[data-book]');
  if (bk) { const i = +bk.dataset.book; S.book = i; const e = [0, 1, 2, 3, 4].find((r) => !S.grid[r][i]); if (e !== undefined) S.cur = [e, i]; sfx.tick(); S.msg = false; return render(); }
  const c = ev.target.closest('.tv-cell'); if (!c) return;
  const r = +c.dataset.r, b = +c.dataset.b; S.book = b; if (!S.grid[r][b]) S.cur = [r, b]; sfx.tick(); S.msg = false; render();
}
// chips: a tap puts the picture in the highlighted place; a drag drops it on any place
let drag = null;
$('ctrlBody').addEventListener('pointerdown', (ev) => {
  const ch = ev.target.closest('.tv-chip'); if (!ch) return;
  drag = { chip: ch.dataset.chip, el: ch, x: ev.clientX, y: ev.clientY, ghost: null, id: ev.pointerId };
  try { ch.setPointerCapture(ev.pointerId); } catch { /* ignore */ }
});
$('ctrlBody').addEventListener('pointermove', (ev) => {
  if (!drag || ev.pointerId !== drag.id) return;
  if (!drag.ghost && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) > 7) {
    drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add('tv-ghost'); document.body.append(drag.ghost); drag.el.style.opacity = '.35';
  }
  if (drag.ghost) { drag.ghost.style.left = ev.clientX + 'px'; drag.ghost.style.top = ev.clientY + 'px'; }
});
const endDrag = (ev, ok) => {
  if (!drag || ev.pointerId !== drag.id) return;
  const d = drag; drag = null; d.ghost?.remove(); d.el.style.opacity = '';
  try { d.el.releasePointerCapture(ev.pointerId); } catch { /* ignore */ }
  if (!ok) return;
  if (d.ghost) { // dropped: find the place under the finger
    const hit = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.tv-cell');
    if (hit) placeChip(d.chip, +hit.dataset.r, +hit.dataset.b);
  } else placeChip(d.chip, S.cur[0], S.cur[1]);
};
$('ctrlBody').addEventListener('pointerup', (ev) => endDrag(ev, true));
$('ctrlBody').addEventListener('pointercancel', (ev) => endDrag(ev, false));
$('ctrlBody').addEventListener('keydown', (ev) => { const ch = ev.target.closest?.('.tv-chip'); if (ch && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); placeChip(ch.dataset.chip, S.cur[0], S.cur[1]); } });

// --- view 2: where is it from ---------------------------------------------------------------------------------
function renderWhere(t) {
  const W = S.w, placed = Object.keys(W.at).length, all = placed === 3;
  const occ = (spot) => Object.keys(W.at).find((id) => W.at[id] === spot);
  const rings = Object.keys(SPOT).map((sp) => {
    const x = MX(SPOT[sp].lon), y = MY(SPOT[sp].lat), o = occ(sp), n = o ? W.order.indexOf(o) : -1;
    const ring = `<g class="tv-spot" data-spot="${sp}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="23" fill="transparent"/>
      <circle r="17" fill="rgba(255,255,255,.12)" stroke="${W.armed ? '#f1c54b' : 'rgba(255,255,255,.75)'}" stroke-width="2" stroke-dasharray="${W.armed ? '4 3' : '3 3'}"/>
      ${n >= 0 ? `<circle r="11" fill="${NUMCOL[n]}" stroke="rgba(0,0,0,.4)" stroke-width="1.2"/><text y="5" text-anchor="middle" font-size="14" font-weight="900" fill="#2a1c0e" font-family="Nunito, system-ui, sans-serif">${n + 1}</text>` : `<text y="5" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" font-family="Nunito, system-ui, sans-serif">?</text>`}</g>`;
    return ring;
  }).join('');
  const labels = Object.keys(SPOT).map((sp) => {
    const x = MX(SPOT[sp].lon), y = MY(SPOT[sp].lat) + 31, tale = TALES.find((q) => q.spot === sp).id;
    return pill(x, Math.min(y, 156), W.rev ? `${t.where.names[tale]} · ${t.where.spots[sp]}` : t.where.spots[sp]);
  }).join('');
  let pins = '';
  if (W.rev) pins = TALES.map((q, i) => {
    const x = MX(SPOT[q.spot].lon), y = MY(SPOT[q.spot].lat), mine = W.at[q.id] === q.spot, got = occ(q.spot), n = got ? W.order.indexOf(got) : -1;
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="tv-pin" style="animation-delay:${i * 0.18}s"><circle r="19" fill="#fff" stroke="${mine ? '#3ddc97' : '#ffd25a'}" stroke-width="3"/>
      <svg x="-16" y="-16" width="32" height="32" viewBox="0 0 60 60">${plate(q.id, 'clC')}</svg>
      ${n >= 0 ? `<circle cx="-15" cy="-15" r="9" fill="${mine ? '#3ddc97' : '#ff8a70'}" stroke="rgba(0,0,0,.4)"/><text x="-15" y="-10.6" text-anchor="middle" font-size="12" font-weight="900" fill="#1a1208" font-family="Nunito, system-ui, sans-serif">${mine ? '✓' : '✗'}</text>` : ''}</g></g>`;
  }).join('');
  const svg = `<svg viewBox="0 0 360 168" role="img" aria-label="${esc(t.where.t0)}"><defs><linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#29547f"/><stop offset="1" stop-color="#1b3a5e"/></linearGradient>
    <linearGradient id="gLand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4be84"/><stop offset="1" stop-color="#9c8a55"/></linearGradient></defs>
    <rect width="360" height="168" fill="url(#gSea)"/>
    <g fill="url(#gLand)" stroke="rgba(255,255,255,.35)" stroke-width="1" stroke-linejoin="round"><polygon points="${pts(EURASIA)}"/><polygon points="${pts(AFRICA)}"/><polygon points="${pts(SINAI)}"/></g>
    <g fill="#2b5a86" stroke="rgba(255,255,255,.3)" stroke-width=".8"><polygon points="${pts(BLACK)}"/><polygon points="${pts(CASPIAN)}"/><polygon points="${pts(GULF)}"/></g>
    <polyline points="${pts(NILE)}" fill="none" stroke="#6fb4e0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect width="360" height="168" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="2"/>${labels}${W.rev ? '' : rings}${pins}</svg>`;
  const cards = W.order.map((id, i) => {
    const sp = W.at[id], q = TALES.find((x) => x.id === id), ok = W.rev && sp === q.spot;
    return `<button class="tv-wc ${W.armed === id ? 'armed' : ''} ${sp ? 'placed' : ''}" data-card="${id}"><span class="num" style="background:${NUMCOL[i]}">${i + 1}</span>
      <span class="tx">${esc(t.where.cards[id])}${W.rev ? `<span class="res ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'} ${esc(t.where.full[id])}</span>` : sp ? `<span class="to">${esc(t.where.to(t.where.spots[sp]))}</span>` : ''}</span></button>`;
  }).join('');
  $('tv').innerHTML = DEFS + `<div class="tv-map">${svg}</div><div class="tv-wcards">${cards}</div>`;
  $('ctl').innerHTML = W.rev ? `<div class="row2" style="margin-top:0"><button class="btn" data-act="again2">${esc(t.where.again)}</button></div>`
    : `<div class="row2" style="margin-top:0"><button class="btn" data-act="reveal" ${all ? '' : 'disabled'}>${esc(t.where.go)}</button></div>`;
  lab.setReadout(`${placed}/3`, t.where.cnt, '', '#e0a458');
  if (W.rev) {
    const k = TALES.filter((q) => W.at[q.id] === q.spot).length;
    lab.setState({ emo: k === 3 ? '✅' : '🤔', title: k === 3 ? t.where.right : t.where.some(k), lead: t.where.lead, body: t.where.body, extra: '' });
  } else lab.setState({ emo: '🗺️', title: t.where.t0, lead: W.armed ? t.where.lAr : all ? t.where.lReady : t.where.l0, body: '', extra: '' });
  lab.setFacts(t.facts.where);
}
function whereClick(ev) {
  const W = S.w; if (W.rev) return;
  const c = ev.target.closest('[data-card]');
  if (c) { const id = c.dataset.card; if (W.armed === id) W.armed = null; else { W.armed = id; delete W.at[id]; } sfx.tick(); return render(); }
  const sp = ev.target.closest('[data-spot]')?.dataset.spot; if (!sp) return;
  const there = Object.keys(W.at).find((id) => W.at[id] === sp);
  if (W.armed) { if (there) delete W.at[there]; W.at[W.armed] = sp; W.armed = null; sfx.snap(); }
  else if (there) { delete W.at[there]; W.armed = there; sfx.tick(); }
  render();
}
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'start' }); };

// --- view 3: same and different --------------------------------------------------------------------------------
function renderVenn(t) {
  const V = S.v, placed = STM.filter(([id]) => V.place[id]).length, all = placed === 8;
  const card = (id) => { const r = V.res[id], cls = ['tv-st']; if (V.armed === id) cls.push('armed'); if (r === 'ok') cls.push('ok'); if (r === 'no') cls.push('no'); if (r === 'back') cls.push('back');
    return `<button class="${cls.join(' ')}" data-st="${id}">${esc(t.venn.st[id])}</button>`; };
  const zone = (z, i) => `<div class="tv-zone ${z} ${V.armed ? 'armed-t' : ''}" data-zone="${z}"><div class="tv-zh">${z === 'l' ? '🔵' : z === 'r' ? '🔴' : '🟡'}<span>${esc(t.venn.zones[i])}</span></div>${STM.filter(([id]) => V.place[id] === z).map(([id]) => card(id)).join('')}</div>`;
  const rest = V.order.filter((id) => !V.place[id]);
  $('tv').innerHTML = DEFS + `<div class="tv-venn"><div class="tv-bk l"></div><div class="tv-bk r"></div>${ZONES.map(zone).join('')}</div>
    <div class="tv-trayv" data-zone="tray" aria-label="${esc(t.venn.tray)}">${rest.map(card).join('')}</div>`;
  const wrong = Object.keys(V.res).filter((id) => V.res[id] === 'back' || V.res[id] === 'no');
  $('ctl').innerHTML = V.solved || V.shown ? `<div class="row2" style="margin-top:0"><button class="btn" data-act="again3">${esc(t.venn.again)}</button></div>`
    : `<div class="row2" style="margin-top:0"><button class="btn" data-act="check" ${all && !V.busy ? '' : 'disabled'}>${esc(t.venn.check)}</button>${V.last !== null ? `<button class="chip" data-act="show">${esc(t.venn.show)}</button>` : ''}</div>`;
  lab.setReadout(`${placed}/8`, t.venn.cnt, '', '#e0a458');
  const list = (ids) => `<ul class="tv-whys">${ids.map((id) => `<li><b>“${esc(t.venn.st[id])}”</b>: ${esc(t.venn.why[id])}</li>`).join('')}</ul>`;
  if (V.solved) lab.setState({ emo: '✅', title: t.venn.right, lead: t.venn.rightL, body: '', extra: '' });
  else if (V.shown) lab.setState({ emo: '💡', title: t.venn.shownT, lead: t.venn.shownL, body: '', extra: list(STM.map((x) => x[0])) });
  else if (V.last !== null && wrong.length) lab.setState({ emo: '🤔', title: t.venn.some(V.last), lead: t.venn.someL, body: '', extra: list(wrong) });
  else lab.setState({ emo: '⚖️', title: t.venn.t0, lead: t.venn.l0, body: '', extra: '' });
  lab.setFacts(t.facts.venn);
}
function vennClick(ev) {
  const V = S.v; if (V.busy || V.solved || V.shown) return;
  const c = ev.target.closest('[data-st]');
  if (c) {
    const id = c.dataset.st; if (V.res[id] === 'ok') return;
    if (V.armed === id) { V.armed = null; } else if (V.armed && V.place[id]) { /* tap on a placed card while another is armed: drop the armed one into this zone */ const z = V.place[id]; V.place[V.armed] = z; delete V.res[V.armed]; V.armed = null; sfx.snap(); }
    else { V.armed = id; if (V.place[id]) delete V.place[id]; delete V.res[id]; }
    sfx.tick(); return render();
  }
  const z = ev.target.closest('[data-zone]')?.dataset.zone; if (!z || !V.armed) return;
  if (z === 'tray') { V.armed = null; return render(); }
  V.place[V.armed] = z; delete V.res[V.armed]; V.armed = null; sfx.snap(); render();
}
function vennCheck() {
  const V = S.v; let k = 0;
  for (const [id, z] of STM) { if (V.place[id] === z) { V.res[id] = 'ok'; k++; } else V.res[id] = 'no'; }
  V.last = k;
  if (k === 8) { V.solved = true; sfx.good(); render(); showStage(); return; }
  sfx.bad(); V.busy = true; render(); showStage();
  setTimeout(() => { for (const [id] of STM) if (V.res[id] === 'no') { delete V.place[id]; V.res[id] = 'back'; } V.busy = false; render(); }, 1100);
}

// --- secrets -------------------------------------------------------------------------------------------------
function renderMake(t) {
  const m = t.mk, [h, g, p, w, q] = S.mk, H = m.help[h], G = m.gift[g], P = m.place[p], Wh = m.who[w];
  const text = [m.s1(H[1]), m.s2(H[2], G[1], P[1]), m.s3[q](cap(Wh[1]))];
  const emos = [['🐟', '🧚', '🐄', '🐦'][h], ['🪶', '🎠', '🏮'][g], ['🎊', '💃', '🧺', '🌊'][p], ['🤴', '👑', '🏺'][w], ['👣', '🧩', '🎵'][q]];
  $('tv').innerHTML = DEFS + `<div class="tv-page"><div class="tv-rib">${emos.map((e) => `<span>${e}</span>`).join('')}</div>${text.map((s) => `<p>${esc(s)}</p>`).join('')}
    <span class="tv-badge ${q === 0 ? 'ok' : 'nw'}">${esc(q === 0 ? m.ok : m.nw)}</span></div>`;
  const chipsFor = (si, list, emoList) => `<div class="tv-mk"><div class="row2" style="margin-top:0"><span class="lbl">${esc(m.slots[si])}</span></div><div class="chips">${list.map((o, i) => `<button class="chip ${S.mk[si] === i ? 'on' : ''}" data-mk="${si}:${i}">${emoList[i]} ${esc(o[0])}</button>`).join('')}</div></div>`;
  $('ctl').innerHTML = chipsFor(0, m.help, ['🐟', '🧚', '🐄', '🐦']) + chipsFor(1, m.gift, ['🪶', '🎠', '🏮']) + chipsFor(2, m.place, ['🎊', '💃', '🧺', '🌊']) + chipsFor(3, m.who, ['🤴', '👑', '🏺']) + chipsFor(4, m.test, ['👣', '🧩', '🎵']);
  lab.setReadout(emos.join(' '), '', '', '#e0a458');
  lab.setState({ emo: q === 0 ? '✅' : '✨', title: m.t, lead: q === 0 ? m.ok : m.nw, body: '', extra: '' });
}
const TX = (y) => 18 + (y / 2000) * 324;
function timeSvg(t) {
  // one lane per tale, so no label ever sits on another; the year line crosses all lanes
  const items = [['rho', 24, 'start'], ['ye', 62, 'start'], ['cen', 100, 'end'], ['gri', 138, 'end']];
  const ticks = [1, 500, 1000, 1500, 2000].map((y) => `<line x1="${TX(y)}" y1="168" x2="${TX(y)}" y2="180" stroke="#d8c08a" stroke-width="2"/><text x="${TX(y)}" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#cfd6ea" font-family="Nunito, system-ui, sans-serif">${y}</text>`).join('');
  const lanes = items.map(([, cy]) => `<line x1="18" y1="${cy}" x2="342" y2="${cy}" stroke="#fff" stroke-opacity=".08" stroke-width="1"/>`).join('');
  const show = items.filter(([id]) => S.year >= DATES[id]);
  const body = show.map(([id, cy, anc]) => {
    const isNew = !S.seen.has(id); S.seen.add(id);
    const x = TX(DATES[id]), cx = Math.max(x, 32);
    return `<g><line x1="${x.toFixed(1)}" y1="${cy}" x2="${x.toFixed(1)}" y2="174" stroke="#f1c54b" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="${x.toFixed(1)}" cy="174" r="3.5" fill="#f1c54b"/>
      <g class="${isNew ? 'tv-tdrop' : ''}">${id === 'rho' ? `<circle class="tv-glow" cx="${cx.toFixed(1)}" cy="${cy}" r="23" fill="#ffd96b" fill-opacity=".6"/>` : ''}
      <circle cx="${cx.toFixed(1)}" cy="${cy}" r="17" fill="#fff" stroke="${id === 'rho' ? '#ffd96b' : '#e8d9a8'}" stroke-width="3"/><svg x="${(cx - 14).toFixed(1)}" y="${cy - 14}" width="28" height="28" viewBox="0 0 60 60">${plate(id, 'clC')}</svg>
      ${pill(anc === 'start' ? cx + 23 : cx - 23, cy, t.tm.lab[id], anc)}</g></g>`;
  }).join('');
  for (const id of [...S.seen]) if (S.year < DATES[id]) S.seen.delete(id);
  const nx = TX(S.year);
  return `<svg viewBox="0 0 360 206" role="img" aria-label="${esc(t.tm.t0)}">${lanes}<line x1="18" y1="174" x2="342" y2="174" stroke="#8a7440" stroke-width="7" stroke-linecap="round"/><line x1="18" y1="174" x2="342" y2="174" stroke="#e7cf8a" stroke-width="4" stroke-linecap="round"/>${ticks}${body}
    <line x1="${nx.toFixed(1)}" y1="6" x2="${nx.toFixed(1)}" y2="174" stroke="#fff" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="${nx.toFixed(1)}" cy="174" r="6.5" fill="#ff6b5a" stroke="#fff" stroke-width="2"/></svg>`;
}
function timeUpdate(t) {
  $('tvTime').innerHTML = timeSvg(t);
  $('yrSl').setAttribute('aria-valuetext', t.tm.year(S.year));
  const y = S.year, any = y >= DATES.gri;
  lab.setReadout(esc(t.tm.year(y)), t.tm.sub, '', '#e0a458');
  lab.setState({ emo: '⏳', title: t.tm.t0, lead: any ? t.tm.l1 : t.tm.l0, body: '', extra: '' });
}
function renderTime(t) {
  $('tv').innerHTML = DEFS + `<div class="tv-time" id="tvTime"></div>`;
  $('ctl').innerHTML = `<div class="tv-sl"><input type="range" class="big" id="yrSl" min="1" max="2000" step="1" value="${S.year}" style="--track:linear-gradient(90deg,#e7cf8a,#f1c54b)"></div>`;
  $('yrSl').addEventListener('input', (ev) => { S.year = +ev.target.value; timeUpdate(T[lang]); });
  timeUpdate(t);
}

// --- wiring --------------------------------------------------------------------------------------------------
$('ctrlBody').innerHTML = `<div id="ctl"></div><div class="row2" id="secRow"></div>`;
$('overlay').innerHTML = `<div id="tv"></div>`;
$('overlay').addEventListener('click', (ev) => {
  if (S.sec) return;
  if (lab.view === 'line') line1Click(ev); else if (lab.view === 'where') whereClick(ev); else vennClick(ev);
});
$('ctrlBody').addEventListener('click', (ev) => {
  const sec = ev.target.closest('[data-sec]');
  if (sec) {
    if (!secret.unlocked()) return secret.open();
    const k = sec.dataset.sec; S.sec = S.sec === k ? null : k; sfx.click(); S.seen.clear(); return render();
  }
  const mk = ev.target.closest('[data-mk]');
  if (mk) { const [s, i] = mk.dataset.mk.split(':').map(Number); S.mk[s] = i; sfx.tick(); return render(); }
  const act = ev.target.closest('[data-act]')?.dataset.act; if (!act) return;
  if (act === 'again1') { S.grid = Array.from({ length: 5 }, () => Array(4).fill(null)); S.cur = [0, 0]; S.book = 0; S.msg = false; sfx.click(); }
  else if (act === 'reveal') { if (Object.keys(S.w.at).length < 3) return; S.w.rev = true; S.w.armed = null; Object.keys(S.w.at).every((id) => S.w.at[id] === TALES.find((q) => q.id === id).spot) ? sfx.good() : sfx.bad(); render(); showStage(); return; }
  else if (act === 'again2') { S.w = { order: shuffle(['ye', 'rho', 'tam']), at: {}, armed: null, rev: false }; sfx.click(); }
  else if (act === 'check') { if (STM.some(([id]) => !S.v.place[id])) return; vennCheck(); return; }
  else if (act === 'show') { const V = S.v; for (const [id, z] of STM) { V.place[id] = z; V.res[id] = 'ok'; } V.armed = null; V.shown = true; sfx.click(); render(); showStage(); return; }
  else if (act === 'again3') S.v = { order: shuffle(STM.map((x) => x[0])), place: {}, armed: null, res: {}, busy: false, shown: false, solved: false, last: null };
  render();
});

function render() {
  const t = T[lang], u = secret.unlocked();
  document.body.dataset.v = S.sec || lab.view;
  lab.setGlow('rgba(224, 164, 88, .24)');
  if (S.sec === 'make') renderMake(t);
  else if (S.sec === 'time') renderTime(t);
  else if (lab.view === 'line') renderLine(t);
  else if (lab.view === 'where') renderWhere(t);
  else renderVenn(t);
  if (S.sec) lab.setFacts(t.facts[lab.view]);
  const sc = (k, emo) => `<button class="chip secret ${u ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${u ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('make', '✏️') + sc('time', '⏳');
}
render();
</script>
