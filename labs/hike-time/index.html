    const tog = (k) => `<button class="chip ${sk[k] ? 'on' : ''}" data-act="tog" data-k="${k}">${esc(s.chips[k])}</button>`;
    $('secSketch').innerHTML = `<div class="chips">${SYMS.map(chip).join('')}</div><div class="chips" style="margin-top:6px">${tog('arrow')}${tog('key')}</div>
      <ul class="ht-clues" style="margin-top:12px">${s.clues.map((q, i) => `<li class="${cl[i] === 1 ? 'ok' : cl[i] === -1 ? 'no' : ''}"><span class="mk">${cl[i] === 1 ? '✔' : cl[i] === -1 ? '✖' : '○'}</span><span>${esc(q)}</span></li>`).join('')}</ul>
      ${allOk ? `<div class="row2"><button class="btn" data-act="next">${esc(s.done.next)}</button></div>` : ''}`;
    const nOk = cl.filter((x) => x === 1).length;
    lab.setReadout(`${nOk}/5`, s.readP1, '', '#5fa85a');
    if (allOk) lab.setState({ emo: '🗺️', title: s.done.title, lead: s.done.lead, body: '', extra: '' });
    else if (sk.sel) { const x = s.sel(s.names[sk.sel]); lab.setState({ emo: '✏️', title: x.title, lead: x.lead, body: '', extra: '' }); }
    else lab.setState({ emo: '✏️', title: s.s0.title, lead: s.s0.lead, body: '', extra: '' });
    lab.setFacts(t.facts.sketch); return;
  }
  const arrived = atPond(), path = sk.walk.map((d) => D[d]).join(' '), m = Math.abs(sk.pos.gate.c - sk.pos.pond.c) + Math.abs(sk.pos.gate.r - sk.pos.pond.r);
  $('secSketch').innerHTML = `<div class="ht-dirs">${[0, 1, 2, 3].map((d) => `<button class="ht-btn" data-act="dir" data-d="${d}"${arrived ? ' disabled' : ''}>${['⬆', '➡', '⬇', '⬅'][d]} ${esc(D[d])}</button>`).join('')}</div>
    <div class="ht-path">${esc(path) || '&nbsp;'}</div>
    <div class="row2"><button class="chip" data-act="undo"${sk.walk.length ? '' : ' disabled'}>${esc(s.undo)}</button><button class="chip" data-act="wreset">${esc(s.reset)}</button><button class="chip" data-act="back">${esc(s.back)}</button></div>`;
  lab.setReadout(String(sk.walk.length), s.readP2(sk.walk.length), arrived ? `✓ ${path}` : '', '#5fa85a');
  if (arrived) { const x = s.arrived(path, sk.walk.length, m); lab.setState({ emo: '✅', title: x.title, lead: x.lead, body: x.body, extra: '' }); }
  else if (sk.walk.length) { const x = s.way(path); lab.setState({ emo: '🚶', title: x.title, lead: x.lead, body: '', extra: '' }); }
  else lab.setState({ emo: '🚶', title: s.p2.title, lead: s.p2.lead, body: '', extra: '' });
  lab.setFacts(t.facts.sketch);
}
render();
</script>
