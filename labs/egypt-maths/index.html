function roll(c, x, cy, w) {

function paper(c, x, y, w, h) {

  for (let i = N; i >= 0; i--) c.lineTo(x + w * i / N, y + h + e(i + 57));
  for (let i = N; i >= 0; i--) c.lineTo(x + e(i + 83), y + h * i / N);
  c.closePath();
  c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 22; c.shadowOffsetY = 8;
  const g = c.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, '#f1e1b0'); g.addColorStop(.5, '#e6d09a'); g.addColorStop(1, '#d5ba80');
  c.fillStyle = g; c.fill();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
  c.clip();
  c.lineCap = 'round'; c.lineWidth = 1;

}

  else if (a === 'another') { S[S.mode] = freshTask(); S.rowT0 = now(); sfx.click(); }
  else if (a === 'clear') { kOf().ticks = []; sfx.tick(); }
  else if (a === 'any') { S.anyGuess = d.a === '1'; S.anyMoved = false; S.rowT0 = now(); sfx.click(); showStage(); }
  else if (a === 'yn') { S[d.q === 'a' ? 'qa' : 'qb'] = d.a === '1'; sfx.tick(); }
  else if (a === 'show') { S.ph = 1; bump(); sfx.click(); showStage(); }
  else if (a === 'nph') { S.ph = 2; bump(); sfx.click(); }
  else if (a === 'scribe') { S.ph = 3; S.step = 0; bump(); sfx.click(); }
  else if (a === 'step') { S.step = S.step >= 7 ? 0 : S.step + 1; bump(); if (S.step === 7) sfx.good(); else (S.step % 3 === 0 || S.step === 1 || S.step === 5) ? sfx.snap() : sfx.click(); }
  else if (a === 'g3') { S.g3 = d.a; S.p3 = 'reveal'; S.seked = 7.5; sfx.click(); showStage(); }
  else if (a === 'next3') { S.p3 = 'task'; S.ti3 = 0; S.wasSolved = false; sfx.click(); }
  else if (a === 'nextT') { if (S.ti3 >= 2) S.p3 = 'free'; else S.ti3++; S.wasSolved = false; sfx.click(); }
  render();
});
$('anyR').addEventListener('input', (ev) => { S.anyN = +ev.target.value; S.anyMoved = true; sfx.tick(); render(); });
$('sk').addEventListener('input', (ev) => { S.seked = +ev.target.value; sfx.tick(); render(); });

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('v1').hidden = v !== 'rows'; $('v2').hidden = v !== 'bread'; $('v3').hidden = v !== 'slope';
  if (v === 'rows') renderRows(t); else if (v === 'bread') renderBread(t); else renderSlope(t);
  lab.setFacts(t.facts[v]);
}
const btn = (act, label, extra = '', cls = 'eg-btn') => `<button class="${cls}" data-act="${act}" ${extra}>${esc(label)}</button>`;

function renderRows(t) {
  const r = t.r, m = S.mode, k = kOf(), open = secret.unlocked(), mulLike = m === 'mul' || m === 'div';
  lab.setGlow('rgba(214, 170, 90, .26)');
  const sc = (key, emo) => `<button class="eg-chip secret ${open ? 'open' : ''} ${m === key ? 'on' : ''}" data-act="mode" data-m="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('modes').innerHTML = `<button class="eg-chip ${m === 'mul' ? 'on' : ''}" data-act="mode" data-m="mul">${esc(t.modes.mul)}</button>`
    + `<button class="eg-chip ${m === 'any' ? 'on' : ''}" data-act="mode" data-m="any">${esc(t.modes.any)}</button>` + sc('div', '➗') + sc('eye', '👁️');
  $('v1ask').hidden = !(m === 'any' && S.anyGuess === null);
  $('v1any').hidden = !(m === 'any' && S.anyGuess !== null);
  $('v1act').hidden = !mulLike;
  if (m === 'any') {
    if (S.anyGuess === null) {
      $('v1ask').innerHTML = `<div class="eg-q">${esc(r.anyAsk)}</div><div class="eg-yn">${btn('any', t.yes, 'data-a="1"', 'eg-chip')}${btn('any', t.no, 'data-a="0"', 'eg-chip')}</div>`;
      lab.setReadout('?', r.anySub, '', '#d6aa5a');
      lab.setState({ emo: '🔢', title: r.anyQ, lead: r.anyLead, body: '', extra: '' });
    } else {
      const parts = bitsOf(S.anyN);
      $('anyR').value = S.anyN; $('anyLbl').textContent = S.anyN;
      lab.setReadout(String(S.anyN), r.anySub, '', '#d6aa5a');
      lab.setState(S.anyMoved ? { emo: '🔢', title: r.anyT(S.anyN, parts), lead: r.num(S.anyN), body: r.anyLead2, extra: '' }
        : { emo: S.anyGuess ? '✅' : '🤔', title: S.anyGuess ? t.rightW : t.notQ, lead: r.anyYes, body: r.anyLead2, extra: '' });
    }
    return;
  }
  if (m === 'eye') {
    const sum = EYE.reduce((a, e, i) => a + (S.eye[i] ? e[1] : 0), 0), all = S.eye.every(Boolean);
    lab.setReadout(sum ? eyeSum(sum) : '0', r.whole, '', '#d9822b');
    lab.setState({ emo: '👁️', title: r.eyeT, lead: all ? r.all : sum ? r.lit(eyeSum(sum)) : r.tap, body: r.note, extra: '' });
    return;
  }
  const tp = tickedP(k), n = k.n, mm = k.m, D = n * mm, bits = bitsOf(n), L = bits.join(' + '), R = bits.map((p) => p * mm).join(' + ');
  $('v1act').innerHTML = k.checked ? btn('another', t.another) : btn('check', t.check, tp.length ? '' : 'disabled') + (tp.length ? btn('clear', t.clear, '', 'eg-btn ghost') : '');
  if (S.note === 'gate' && m === 'mul') lab.setState({ emo: '🔒', title: t.gate.t, lead: t.gate.l, body: '', extra: '' });
  else if (!k.checked) lab.setState({ emo: '📜', title: r.q(m === 'mul' ? n : D), lead: m === 'mul' ? (k.first ? r.leadFirst(n) : r.lead(n)) : r.leadDiv(D), body: '', extra: '' });
  else lab.setState({ emo: k.ok ? '✅' : '🤔', title: k.ok ? t.rightW : r.wrong(sumVal(k), targetOf(k)), lead: m === 'mul' ? r.doneMul(L, R, n, mm) : r.doneDiv(L, R, n, mm), body: m === 'mul' ? r.body : r.bodyDiv, extra: '' });
  lab.setReadout(k.checked ? (m === 'mul' ? `${n} × ${mm} = ${D}` : `${D} ÷ ${mm} = ${n}`) : (m === 'mul' ? `${n} × ${mm}` : `${D} ÷ ${mm}`),
    r.ticked(m === 'div' ? tp.map((p) => p * mm) : tp, sumVal(k)), '', '#d6aa5a');
}

function renderBread(t) {
  const b = t.b, ph = S.ph, st = S.step;
  lab.setGlow('rgba(224, 140, 70, .24)');
  $('v2ask').hidden = ph !== 0;
  if (ph === 0) {
    const row = (q, key, label) => `<div class="eg-yn"><span class="t">${esc(label)}</span>${btn('yn', t.yes, `data-q="${q}" data-a="1"`, `eg-chip ${S[key] === true ? 'on' : ''}`)}${btn('yn', t.no, `data-q="${q}" data-a="0"`, `eg-chip ${S[key] === false ? 'on' : ''}`)}</div>`;
    $('v2ask').innerHTML = `<div class="eg-q">${esc(b.q)}</div>${row('a', 'qa', b.qa)}${row('b', 'qb', b.qb)}`;
  }
  const act = ph === 0 ? btn('show', t.show, S.qa === null || S.qb === null ? 'disabled' : '')
    : ph === 1 ? btn('nph', t.next) : ph === 2 ? btn('scribe', `${b.steps[0][0]} →`) : btn('step', b.steps[st][2]);
  $('v2act').innerHTML = act;
  let state, val = '?', pill_ = '';
  if (ph === 0) state = { emo: '🍞', title: b.q, lead: b.lead };
  else if (ph === 1) { val = b.valW; state = { emo: S.qa === false ? '✅' : '🤔', title: S.qa === false ? t.rightW : t.notQ, lead: b.r1 }; }
  else if (ph === 2) { val = '1/2'; state = { emo: S.qb === false ? '✅' : '🤔', title: S.qb === false ? t.rightW : t.notQ, lead: b.r2 }; }
  else {
    val = st < 2 ? '0' : st < 3 ? '1/3' : st < 5 ? '2/3' : st < 7 ? '2/3 + 1/5' : '2/3 + 1/5 + 1/30';
    if (st === 7) pill_ = b.done;
    state = { emo: st === 7 ? '🏆' : st % 3 === 0 || st === 1 || st === 5 ? '🍞' : '🤲', title: b.steps[st][0], lead: b.steps[st][1], body: st === 7 ? b.fin : '' };
  }
  lab.setState({ body: '', extra: '', ...state });
  lab.setReadout(val, b.sub, pill_, '#e08c46');
}

function renderSlope(t) {
  const s = t.s, ph = S.p3, tg = TARGETS[S.ti3], solved = ph === 'task' && Math.abs(S.seked - tg) < .01;
  lab.setGlow('rgba(233, 169, 107, .26)');
  if (solved && !S.wasSolved) sfx.good();
  S.wasSolved = solved;
  $('v3ask').hidden = ph !== 'predict';
  $('v3sl').hidden = ph === 'predict';
  if (ph === 'predict') $('v3ask').innerHTML = `<div class="eg-q">${esc(s.q)}</div><div class="eg-sub">${esc(s.setup)}</div><div class="eg-row">${btn('g3', s.opt[0], 'data-a="s"')}${btn('g3', s.opt[1], 'data-a="f"')}</div>`;
  $('sk').value = S.seked; $('skLbl').textContent = fmtS(S.seked);
  $('v3act').innerHTML = ph === 'reveal' ? btn('next3', s.revealBtn) : solved ? btn('nextT', S.ti3 >= 2 ? s.free : t.next) : '';
  let st;
  if (ph === 'predict') st = { emo: '🔺', title: s.q, lead: s.lead, body: s.body };
  else if (ph === 'reveal') st = { emo: S.g3 === 'f' ? '✅' : '🤔', title: S.g3 === 'f' ? t.rightW : t.notQ, lead: s.verdict(Math.round(deg(5)), Math.round(deg(7.5))) };
  else if (ph === 'task') st = solved ? { emo: '✅', title: t.rightW, lead: s.solvedL(S.seked) } : { emo: '🎯', title: s.task, lead: s.taskL(S.ti3 + 1) };
  else st = { emo: '🔺', title: s.free, lead: s.freeL };
  lab.setState({ body: '', extra: '', ...st });
  lab.setReadout(fmtS(S.seked), s.sub, ph === 'predict' ? '' : `${dec(deg(S.seked))}°`, '#e0a458');
}
render();
</script>
