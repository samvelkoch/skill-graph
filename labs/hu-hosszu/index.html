    render(); showStage();
  } else if (act === 'snext') { s.qi = 1; s.ans = null; s.phase = 'ask'; s.cur = Q_PAIR[1]; setStretch(Q_PAIR[1], { mark: true }); sfx.click(); render(); }
  else if (act === 'pick') { S.sec = null; s.cur = +b.dataset.i; setStretch(s.cur, { handleOn: true }); M.hint = true; M.dragged = false; sfx.click(); render(); }
  else if (act === 'sagain') { resetStretch(); sfx.click(); render(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; if (S.sec) startSecret(k); sfx.click(); render();
  } else if (act === 'wstart') { w.i = 0; w.phase = 'ask'; w.ans = null; setWrite(); sfx.click(); render(); }
  else if (act === 'wans') {
    if (w.phase !== 'ask') return;
    w.ans = +b.dataset.j; w.phase = 'anim'; sfx.click();
    const r = WR[w.i]; M.blocks = mkBlocks(r.word); M.hide = false; M.buildT0 = now() + .15;
    M.blocks.forEach((x) => { x.pop = 0; x.ea = 0; });
    M.buildEnd = M.buildT0 + M.blocks.length * .3 + 1.2;
    render(); showStage();
  } else if (act === 'wnext') {
    if (w.i >= WR.length - 1) { w.i = 0; w.right = []; } else w.i++;
    w.phase = 'ask'; w.ans = null; setWrite(); sfx.click(); render();
  } else if (act === 'fans') {
    if (f.phase !== 'ask') return;
    f.pick = +b.dataset.j; f.right[f.i] = f.pick === FX[f.i].ok; f.tMode = now(); sfx.click(); (f.right[f.i] ? sfx.good : sfx.bad)();
    if (f.right[f.i]) f.phase = 'done';
    else { f.phase = 'wrong'; const i = f.i; setTimeout(() => { if (S.f.i === i && S.f.phase === 'wrong') { S.f.phase = 'done'; S.f.tMode = now(); render(); } }, 1200); }
    render(); showStage();
  } else if (act === 'fnext') {
    if (f.i >= FX.length - 1) { S.f = { i: 0, pick: null, phase: 'ask', right: [], tMode: now() }; } else { f.i++; f.pick = null; f.phase = 'ask'; f.tMode = now(); }
    sfx.click(); render();
  }
});

// --- rendering of the controls, readout and state card ------------------------------------------------------------
function updateReadout() {
  const t = T[lang], v = lab.view;
  if (v === 'stretch') {
    if (S.sec === 'longest') lab.setReadout('hosszú · rövid', '', '', GOLD);
    else if (S.sec === 'rhyme') lab.setReadout('🎶', '', '', GOLD);
    else { const pr = PAIRS[M.pair]; lab.setReadout(esc(curWord()), M.long ? pr.gl[lang] : pr.gs[lang], M.long ? t.st.long : t.st.short, VOW); }
  } else if (v === 'write') {
    const w = S.w;
    if (w.i < 0) lab.setReadout('✍️', '', '', CON);
    else if (w.phase === 'done') lab.setReadout(esc(wordOf(mkBlocks(WR[w.i].word))), t.w.gloss[w.i], `${w.i + 1} / ${WR.length}`, CON);
    else lab.setReadout('?', t.w.gloss[w.i], `${w.i + 1} / ${WR.length}`, CON);
  } else lab.setReadout(`${S.f.i + 1}/${FX.length}`, t.f.q, '', GOLD);
}
function stateCard(t, key, full) { const [emo_, title, lead, body] = t.state[key][full ? 1 : 0]; lab.setState({ emo: emo_, title, lead, body, extra: '' }); }
function render() {
  const t = T[lang], v = lab.view, rules = v === 'write' && S.w.i < 0;
  document.body.dataset.v = v; document.body.dataset.r = rules ? '1' : '';
  $('hhRules').style.display = rules ? '' : 'none';
  if (v === 'stretch') renderStretch(t); else if (v === 'write') renderWrite(t); else renderFix(t);
  updateReadout(); syncSpeak();
}
const verdict = (ok, why) => `<div class="hh-verdict ${ok ? 'good' : 'bad'}">${esc(ok ? T[lang].right : T[lang].wrong)}</div><p class="hh-why">${esc(why)}</p>`;
function renderStretch(t) {
  const s = S.s, free = s.qi === 1 && s.phase === 'done', open = secret.unlocked();
  lab.setGlow('rgba(91, 141, 239, .3)');
  let html = '';
  if (!free || !S.sec) {
    const list = s.qi === 0 ? t.st.o1 : t.st.o2;
    if (!free) {
      html += `<div class="hh-q">${esc(s.qi === 0 ? t.st.q1 : t.st.q2)}</div><div class="hh-opts">${Q_ORDER[s.qi].map((j) => {
        const cls = s.phase === 'done' ? (j === 0 ? 'good' : j === s.ans ? 'bad' : '') : '';
        return `<button class="hh-opt ${cls}" data-act="ans" data-j="${j}"${s.phase !== 'ask' ? ' disabled' : ''}>${esc(list[j])}</button>`; }).join('')}</div>`;
    }
  }
  if (s.phase === 'done' && (!free || (!S.sec && s.cur === Q_PAIR[1]))) {
    html += verdict(s.ans === 0, s.qi === 0 ? t.st.r1 : t.st.r2);
    if (s.qi === 0) html += `<div class="hh-nextrow"><button class="btn hh-btn" data-act="snext">${esc(t.next)}</button></div>`;
  }
  if (free) {
    const sc = (k, e) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    html += `<div class="chips hh-chips">${PAIRS.map((p, i) => `<button class="chip ${!S.sec && s.cur === i ? 'on' : ''}" data-act="pick" data-i="${i}">${p.es} ${p.s}</button>`).join('')}</div>
      <div class="chips hh-chips">${sc('longest', '🐍')}${sc('rhyme', '🎶')}<button class="chip" data-act="sagain">${esc(t.again)}</button></div>`;
  }
  $('ctrlBody').innerHTML = html;
  if (S.sec === 'longest') lab.setState({ emo: '🐍', title: t.secrets.longest[0], lead: t.sec.longText, body: '', extra: '' });
  else if (S.sec === 'rhyme') lab.setState({ emo: '🎶', title: t.secrets.rhyme[0], lead: t.sec.rhymeText, body: '', extra: '' });
  else stateCard(t, 'stretch', free);
}
function pairHtml(kind, a, i) {
  if (kind === 'v') {
    const [s] = a, dbl = 'öü'.includes(s);
    return `<span class="hh-pair" style="--i:${i}"><span class="hh-mb v hh-s">${s}</span><span class="hh-arr">→</span><span class="hh-mb v hh-l"><span class="hh-lt">${BASEG[s] ?? s}</span><i class="hh-ac">${dbl ? '˝' : '´'}</i></span></span>`;
  }
  return `<span class="hh-pair" style="--i:${i}"><span class="hh-mb c hh-s">${a}</span><span class="hh-arr">→</span><span class="hh-mb c hh-l"><i class="hh-cl">${a[0]}</i><span class="hh-lt">${a}</span></span></span>`;
}
function renderWrite(t) {
  const w = S.w;
  lab.setGlow('rgba(76, 195, 138, .26)');
  if (w.i < 0) {
    $('hhRules').innerHTML = `<div class="hh-rule card"><p>${esc(t.w.ruleV)}</p><div class="hh-pairs">${RV.map((a, i) => pairHtml('v', a, i)).join('')}</div></div>
      <div class="hh-rule card"><p>${esc(t.w.ruleC)}</p><div class="hh-pairs">${RC.map((a, i) => pairHtml('c', a, i)).join('')}</div></div>`;
    $('ctrlBody').innerHTML = `<div class="hh-nextrow" style="margin-top:0"><button class="btn hh-btn" data-act="wstart">${esc(t.next)}</button></div>`;
    stateCard(t, 'write', false); return;
  }
  const r = WR[w.i], last = w.i === WR.length - 1;
  let html = `<div class="hh-q">${esc(t.w.q)}</div><div class="hh-opts">${r.opts.map((o, j) => {
    const cls = w.phase === 'done' ? (j === r.ok ? 'good' : j === w.ans ? 'bad' : '') : '';
    return `<button class="hh-opt serif ${cls}" data-act="wans" data-j="${j}"${w.phase !== 'ask' ? ' disabled' : ''}>${esc(o)}</button>`; }).join('')}</div>`;
  if (w.phase === 'done') html += verdict(w.ans === r.ok, t.w.why[w.i]) + `<div class="hh-nextrow"><button class="btn hh-btn" data-act="wnext">${esc(last ? t.again : t.next)}</button></div>`;
  $('ctrlBody').innerHTML = html;
  stateCard(t, 'write', last && w.phase === 'done');
}
function renderFix(t) {
  const f = S.f, x = FX[f.i], last = f.i === FX.length - 1;
  lab.setGlow('rgba(242, 176, 74, .24)');
  const chosen = f.phase === 'ask' ? '…' : f.phase === 'wrong' ? x.o[f.pick] : x.o[x.ok];
  const cls = f.phase === 'ask' ? '' : f.phase === 'wrong' ? 'bad' : 'good';
  const sent = esc(x.s.endsWith('…') ? x.s + '.' : x.s).replace('…', `<span class="hh-gap ${cls}">${esc(chosen)}</span>`);
  const tr = t.f.tr[f.i];
  let html = `<div class="hh-sent">${sent}</div>${tr ? `<div class="hh-tr">${esc(tr)}</div>` : '<div class="hh-tr"></div>'}
    <div class="hh-opts">${x.o.map((o, j) => {
      const c2 = f.phase === 'done' ? (j === x.ok ? 'good' : j === f.pick ? 'bad' : '') : f.phase === 'wrong' && j === f.pick ? 'bad' : '';
      return `<button class="hh-opt serif ${c2}" data-act="fans" data-j="${j}"${f.phase !== 'ask' ? ' disabled' : ''}>${esc(o)}</button>`; }).join('')}</div>`;
  if (f.phase === 'done') html += verdict(f.pick === x.ok, t.f.why[f.i]) + `<div class="hh-nextrow"><button class="btn hh-btn" data-act="fnext">${esc(last ? t.again : t.next)}</button></div>`;
  $('ctrlBody').innerHTML = html;
  stateCard(t, 'fix', last && f.phase === 'done');
}

enterView();
render();
</script>
