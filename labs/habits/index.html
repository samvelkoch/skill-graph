      <div class="row2" style="margin-top:6px"><button class="chip hb-t" data-act="fm" ${S.run ? 'disabled' : ''}>${esc(t.g.m5)}</button><button class="chip hb-t" data-act="fp" ${S.run ? 'disabled' : ''}>${esc(t.g.p5)}</button>
      ${S.run === 2 ? `<button class="chip hb-t hb-go" data-act="again">${esc(t.g.again)}</button>` : `<button class="chip hb-t hb-go" data-act="run" ${ready && !S.run ? '' : 'disabled'}>${esc(t.g.run)}</button>`}</div>`;
    st = S.rev ? { emo: isRight() ? '✅' : '🤔', title: t.g.verdict(isRight()), lead: t.g.lead(S.flag, S.trueDay), body: t.g.model(HAB[S.habit].tau), extra: esc(t.g.real) }
      : S.run ? { emo: t.g.s2[0], title: t.g.s2[1], lead: t.g.s2[2], body: '', extra: '' }
      : ready ? { emo: t.g.s1(S.flag)[0], title: t.g.s1(S.flag)[1], lead: t.g.s1(S.flag)[2], body: '', extra: '' }
      : { emo: t.g.s0[0], title: t.g.s0[1], lead: t.g.s0[2], body: '', extra: '' };
    void done;
  } else if (v === 'cue') {
    const c = S.next || S.cfg, pend = !!S.next;
    html = `<div class="row2" style="margin-top:0"><span class="lbl">${esc(t.c.cueL)}</span><div class="chips">${chip('cfg', 'cs', t.c.cs, c.same, pend)}${chip('cfg', 'cr', t.c.cr, !c.same, pend)}</div></div>
      <div class="row2" style="margin-top:8px"><span class="lbl">${esc(t.c.rewL)}</span><div class="chips">${chip('cfg', 'rn', t.c.rn, c.now, pend)}${chip('cfg', 'rl', t.c.rl, !c.now, pend)}</div></div>
      ${pend ? `<div class="hb-q"><p>${esc(t.c.q)}</p><div class="hb-step">${chip('hl', 'hi', t.c.hi, false)}${chip('hl', 'lo', t.c.lo, false)}</div></div>` : ''}`;
    st = pend ? { emo: t.c.s1[0], title: t.c.s1[1], lead: t.c.s1[2], body: '', extra: '' }
      : S.prev ? { emo: S.cueOk ? '✅' : '🤔', title: S.cueOk ? (lang === 'ru' ? 'Верно!' : lang === 'hu' ? 'Így van!' : 'Right!') : (lang === 'ru' ? 'Не совсем' : lang === 'hu' ? 'Nem egészen' : 'Not quite'), lead: t.c.lead(S.cueA, S.cueB), body: t.c[S.cueWhy], extra: '' }
      : { emo: t.c.s0[0], title: t.c.s0[1], lead: t.c.s0[2], body: '', extra: '' };
  } else if (v === 'miss') {
    const busy = S.mq.length > 0, q = S.mGuess === null, end = left() < 1;
    html = q ? `<p class="hb-ask">${esc(t.m.q)}</p><div class="row2" style="margin-top:6px">${chip('mg', 'yes', t.m.yes, false)}${chip('mg', 'no', t.m.no, false)}</div>`
      : `<div class="row2" style="margin-top:0"><button class="chip hb-t" data-act="d1" ${busy || end ? 'disabled' : ''}>${esc(t.m.d1)}</button><button class="chip hb-t" data-act="d10" ${busy || end ? 'disabled' : ''}>${esc(t.m.d10)}</button>${end ? `<button class="chip hb-t hb-go" data-act="mAgain">${esc(t.m.again)}</button>` : ''}</div>
      <div class="row2" style="margin-top:8px"><button class="chip hb-t" data-act="skip" ${busy || S.mSkips >= 5 || end ? 'disabled' : ''}>${esc(t.m.skip(S.mSkips))}</button><button class="chip hb-t" data-act="stop" ${busy || left() < 14 ? 'disabled' : ''}>${esc(t.m.stop)}</button>${!end && S.m.A.length > 31 ? `<button class="chip hb-t" data-act="mAgain">${esc(t.m.again)}</button>` : ''}</div>`;
    const anyOff = S.m.kind.includes('off'), anySkip = S.mSkips > 0;
    if (busy && !anySkip && !anyOff) st = { emo: t.m.s1[0], title: t.m.s1[1], lead: t.m.s1[2], body: '', extra: '' };
    else if (end && !busy) st = { emo: t.m.end[0], title: t.m.end[1], lead: t.m.end[2], body: '', extra: '' };
    else if (S.mLast === 'off' || (anyOff && S.m.kind[S.m.kind.length - 1] === 'off')) { const o = t.m.off(S.mOff0, Math.round(missCur())); st = { emo: o[0], title: o[1], lead: o[2], body: o[3], extra: '' }; }
    else if (anySkip && S.m.kind[S.m.kind.length - 1] === 'skip') { const o = t.m.s2(S.mGuess === 'no'); st = { emo: o[0], title: o[1], lead: o[2], body: o[3], extra: '' }; }
    else if (anySkip || anyOff) { const o = t.m.back; st = { emo: o[0], title: o[1], lead: o[2], body: o[3], extra: '' }; }
    else st = q ? { emo: t.m.s0[0], title: t.m.s0[1], lead: t.m.s0[2], body: '', extra: '' } : { emo: t.m.s1[0], title: t.m.s1[1], lead: t.m.s1[2], body: '', extra: '' };
  } else if (v === 'break') {
    const run = S.bk.run, r = S.bk.runs;
    html = `<div class="row2" style="margin-top:0"><div class="chips">${chip('bsel', 'will', t.b.will, S.bk.sel === 'will', !!run)}${chip('bsel', 'cue', t.b.cue, S.bk.sel === 'cue', !!run)}</div></div>
      <div class="row2"><button class="chip hb-t hb-go" data-act="brun" ${run ? 'disabled' : ''}>${esc(t.b.run)}</button></div>`;
    const a = r.will && Math.round(r.will[60]), b = r.cue && Math.round(r.cue[60]);
    st = r.will && r.cue ? ((o) => ({ emo: o[0], title: o[1], lead: o[2], body: o[3], extra: '' }))(t.b.s2(a, b))
      : r.will || r.cue ? ((o) => ({ emo: o[0], title: o[1], lead: o[2], body: '', extra: '' }))(t.b.s1(r.will ? a : b))
      : { emo: t.b.s0[0], title: t.b.s0[1], lead: t.b.s0[2], body: '', extra: '' };
  } else {
    const run = S.mo.run, arr = S.mo.arr;
    html = `<p class="hb-sub">${esc(t.o.a)} · ${esc(t.o.f)}</p><div class="row2" style="margin-top:0"><button class="chip hb-t hb-go" data-act="mrun" ${run ? 'disabled' : ''}>${esc(t.o.run)}</button></div>`;
    st = arr && !run ? ((o) => ({ emo: o[0], title: o[1], lead: o[2], body: o[3], extra: '' }))(t.o.s1(Math.round(arr[0][90]), Math.round(arr[1][90])))
      : { emo: t.o.s0[0], title: t.o.s0[1], lead: t.o.s0[2], body: '', extra: '' };
  }
  $('ctrlBody').innerHTML = html + secRow(t);
  readout();
  lab.setState(st);
}
render();
</script>
</body>
</html>
