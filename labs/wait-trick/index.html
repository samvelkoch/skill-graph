function update(dt) {
  S.t += dt;

  if (v === 'pie') {
    const R = S.run;
    if (R.on) {
      R.t += dt; R.w += ACT[R.act].r * dt;
      if (R.w >= 1) { R.w = 1; R.on = false; R.res = 'popped'; popBalloon(); sfx.bad(); render(); }
      else if (R.t >= RUN) { R.t = RUN; R.on = false; R.res = 'done'; sfx.good(); render(); }
      else { const sec = Math.ceil(RUN - R.t); if (sec !== S.lastSec) { S.lastSec = sec; renderInfo(); } }
    }
    S.wd += (R.w - S.wd) * Math.min(1, dt * 7);
    S.bv += ((R.res === 'popped' ? 0 : 1) - S.bv) * Math.min(1, dt * (R.res === 'popped' ? 30 : 6));
    S.cov += ((R.on && R.act === 'cover' ? 1 : 0) - S.cov) * Math.min(1, dt * 8);
    S.tk += ((R.res ? 1 : 0) - S.tk) * Math.min(1, dt * 3);
    S.shards.forEach((s) => { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 260 * dt; s.rot += s.vr * dt; s.life -= dt * 1.1; });
    S.shards = S.shards.filter((s) => s.life > 0);
  } else if (v === 'turn') {
    P.forEach((p) => {
      p.q = clamp(p.q + clamp(((p.res === 'good') ? 1 : 0) - p.q, -dt / 2.8, dt / 2.8), 0, 1);
      const tw = p.res === 'good' ? 0.12 : p.res === 'push' ? 0.25 : p.res === 'shout' ? 1 : 0.5;
      p.w += (tw - p.w) * Math.min(1, dt * 4);
    });
  } else {
    const q = S.p3; q.t += dt;
    if (q.phase === 'day1' && q.t >= DUR1) { q.phase = 'day1end'; q.t = 0; render(); }
    else if (q.phase === 'day2' && q.t >= (q.out === 'kept' ? DUR2K : DUR2B)) { q.phase = 'end'; q.t = 0; sfx[q.ok ? 'good' : 'tick'](); render(); }
  }

  const day2 = q.phase === 'pred' || q.phase === 'day2' || q.phase === 'end';
  const val = q.phase === 'end' ? (kept ? pp.long : pp.short) : '—';
  lab.setReadout(val, day2 ? pp.day2 : pp.day1, t.model, '#c08a5c');
  let st;
  if (q.phase === 'pick') st = { emo: '🐻', title: pp.day1, lead: pp.q1 };
  else if (q.phase === 'day1') st = { emo: '🐻', title: pp.day1, lead: pp.bear1 };
  else if (q.phase === 'day1end') { const m = kept ? pp.keptEnd : pp.forgotEnd; st = { emo: kept ? '🖍️' : '😕', title: m[0], lead: m[1] }; }
  else if (q.phase === 'pred') st = { emo: '🤔', title: pp.day2, lead: pp.q2 };
  else if (q.phase === 'day2') st = { emo: '⏳', title: pp.day2, lead: pp.bear2 };
  else { const m = kept ? pp.revKept : pp.revBroken; st = { emo: kept ? '🤝' : '🍪', title: m[0], lead: m[1], body: pp.bubble, extra: `<div class="wt-v ${q.ok ? 'ok' : 'no'}">${esc(q.ok ? pp.ok : pp.no)}</div>` }; }
  lab.setState({ body: '', extra: '', ...st });
  lab.setFacts(q.phase === 'end' ? pp.facts : []);
}
render();
</script>
