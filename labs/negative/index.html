// ---------- helpers ----------
const VOSTOK = -89.2, HI_T = 40, HI_F = 6, LO_F = -3, TARGETS = [-3, -1, 0, 2, 5];

const nfs = {};

const fit = (c, s, maxW, size, weight = 800) => { let f = size; c.font = `${weight} ${f}px ${SANS}`; while (f > 9 && c.measureText(s).width > maxW) { f -= 1; c.font = `${weight} ${f}px ${SANS}`; } return f; };

// ---------- state ----------
const S = {
  th: { temp: 5, ref: null, goal: null, hit: false },
  li: { floor: 2, goal: null, hit: false, blocked: 0 },
  nl: { A: -7, B: 5, scale: 20, task: false, i: 0, msg: '', landed: false, sub: -3 },
  trip: { th: { from: 5, t: 0 }, li: { from: 2, t: 0 } },
  answered: store.get('negative:asked', false), answer: null, secret: null, drag: null,
};
const D = { temp: 5, floor: 2, frog: -7, hop: null };
const lo = () => (S.secret === 's2' ? -90 : -30);
const stepN = () => (S.nl.scale === 20 ? 1 : 10);
const tripBump = (k, cur) => { const tr = S.trip[k], now = Date.now(); if (now - tr.t > 2500) tr.from = cur; tr.t = now; };
const tripSet = (k, v) => { S.trip[k] = { from: v, t: Date.now() + 20000 }; };

const lab = shell({ key: 'negative', T, topics: TOPICS, views: ['th', 'li', 'nl'], onLang: render, onView: () => { S.secret = null; if (S.nl.task) S.nl.task = false; render(); } });
const secret = secretLab('negative', () => ({
  secrets: [{ emo: '➖', title: T[lang].secrets.s1[0], desc: T[lang].secrets.s1[1] }, { emo: '🥶', title: T[lang].secrets.s2[0], desc: T[lang].secrets.s2[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `<div class="row2" id="stepsRow"><span class="lbl" id="lblSteps"></span><div class="chips" id="steps"></div></div>
  <div class="row2"><span class="lbl" id="lblTry"></span><div class="chips" id="chips"></div></div>`;

// ---------- actions ----------
function goalCheck(o, cur) { if (o.goal !== null && !o.hit && cur === o.goal) { o.hit = true; sfx.good(); } }
function setTemp(v) { S.th.temp = clamp(v, lo(), HI_T); goalCheck(S.th, S.th.temp); render(); }
function setFloor(f, viaClick) {
  if (f < LO_F || f > HI_F) { S.li.blocked = performance.now(); sfx.bad(); setTimeout(render, 2600); return render(); }
  if (!viaClick) tripBump('li', S.li.floor);
  S.li.floor = f; goalCheck(S.li, f); render();
}
function nlChange() { S.nl.landed = false; D.hop = null; S.nl.msg = ''; }
function setMarker(which, v) {
  const n = S.nl, lim = S.secret === 's1' ? 15 : n.scale;
  const x = clamp(Math.round(v / stepN()) * stepN(), -lim, lim);
  if (n[which] === x) return;
  n[which] = x; if (S.secret === 's1') n.B = n.A - n.sub;
  nlChange(); sfx.tick(); render();
}
function hop() {
  const n = S.nl; if (n.task || n.A === n.B) return;
  const steps = Math.min(16, Math.abs(n.B - n.A) / stepN());
  D.frog = n.A; D.hop = { from: n.A, to: n.B, t: 0, dur: clamp(steps * 0.17, 0.5, 2.8), nh: steps }; n.landed = false; sfx.click();
}
function startPreset(k) {
  S.nl.msg = '';
  if (k === 'th1') { Object.assign(S.th, { temp: -4, ref: null, goal: 3, hit: false }); tripSet('th', -4); }
  else if (k === 'th2') { Object.assign(S.th, { temp: 3, ref: null, goal: -5, hit: false }); tripSet('th', 3); }
  else if (k === 'th3') { Object.assign(S.th, { temp: -8, ref: S.th.ref === -3 ? null : -3, goal: null }); tripSet('th', -8); }
  else if (k === 'th4') { Object.assign(S.th, { temp: VOSTOK, ref: null, goal: null }); tripSet('th', 0); }
  else if (k === 'li1') { Object.assign(S.li, { floor: 2, goal: -3, hit: false }); tripSet('li', 2); }
  else if (k === 'li2') { Object.assign(S.li, { floor: -2, goal: 4, hit: false }); tripSet('li', -2); }
  else if (k === 'nl1') { Object.assign(S.nl, { scale: 20, task: true, i: 0, A: 12, landed: false }); D.hop = null; }
  else if (k === 'nl2') { Object.assign(S.nl, { scale: 20, task: false, A: -7, B: 5 }); nlChange(); hop(); }
  else if (k === 'nl3') { Object.assign(S.nl, { scale: 400, task: false, A: -120, B: 350 }); nlChange(); hop(); }
}
function checkTask() {
  const n = S.nl, t = T[lang], target = TARGETS[n.i];
  if (n.A === target) {
    sfx.good(); const k = Math.abs(target), w = t.step(k);
    n.msg = target < 0 ? t.okL(fmt(target), fmt(k), w) : target > 0 ? t.okR(fmt(target), fmt(k), w) : t.ok0; n.i++;
    if (n.i >= TARGETS.length) { n.task = false; n.msg = t.taskDone; }
  } else { sfx.bad(); n.msg = n.A > target ? t.missL(fmt(n.A), fmt(target)) : t.missR(fmt(n.A), fmt(target)); }
  render();
}

// ---------- controls ----------
$('steps').addEventListener('click', (ev) => {
  const b = ev.target.closest('.chip'); if (!b) return; const v = lab.view;
  if (b.dataset.d) {
    const d = +b.dataset.d;
    if (v === 'th') { tripBump('th', S.th.temp); setTemp(S.th.temp + d); sfx.tick(); }
    else if (v === 'li') { setFloor(S.li.floor + d); sfx.click(); }
  } else if (b.dataset.act === 'hop') hop();
  else if (b.dataset.act === 'swap') { [S.nl.A, S.nl.B] = [S.nl.B, S.nl.A]; nlChange(); sfx.click(); render(); }
  else if (b.dataset.sub) { S.nl.sub = +b.dataset.sub; S.nl.B = S.nl.A - S.nl.sub; nlChange(); hop(); render(); }
});
$('chips').addEventListener('click', (ev) => {
  const k = ev.target.closest('.chip')?.dataset.k; if (!k) return;
  if (k === 's1' || k === 's2') {
    if (!secret.unlocked()) return secret.open();
    if (S.secret === k) S.secret = null;
    else {
      S.secret = k;
      if (k === 's1') { lab.view = 'nl'; Object.assign(S.nl, { scale: 20, task: false, A: 5, sub: -3, B: 8 }); nlChange(); hop(); }
      else { lab.view = 'th'; S.th.ref = null; S.th.goal = null; }
      lab.renderChrome();
    }
    if (S.secret !== 's2') S.th.temp = clamp(S.th.temp, -30, HI_T);
    sfx.click(); return render();
  }
  sfx.click(); startPreset(k); render();
});

// ---------- opening prediction ----------
const ask = Object.assign(document.createElement('div'), { className: 'ask card' });
$('overlay').append(ask);
ask.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.a) { S.answer = +b.dataset.a; (S.answer === 1 ? sfx.good : sfx.bad)(); Object.assign(S.th, { temp: -8, ref: -3 }); tripSet('th', -3); }
  else { S.answered = true; store.set('negative:asked', true); }
  render();
});

// ---------- state card + readout ----------
function stateTh(t) {
  const { temp, ref, goal, hit } = S.th, tr = S.trip.th, d = temp - tr.from, k = sign(temp), n = fmt(Math.abs(temp));
  const lead = k === 'neg' ? t.leadBelow(n, t.deg(Math.abs(temp))) : k === 'pos' ? t.leadAbove(n, t.deg(Math.abs(temp))) : t.leadZero;
  const a = Math.abs(d), move = d === 0 ? '' : (d > 0 ? t.up : t.down)(fmt(a), t.deg(a), fmt(tr.from), fmt(temp));
  const parts = [];
  if (goal !== null && !hit && S.th.goalQ) parts.push('🎯 ' + S.th.goalQ);
  if (move) parts.push((hit && goal !== null ? t.reached + ' ' : '') + move);
  if (ref !== null) {
    const g = Math.abs(temp - ref);
    parts.push(temp < ref ? t.colder(fmt(temp), fmt(ref), fmt(g), t.deg(g)) : temp > ref ? t.warmer(fmt(temp), fmt(ref), fmt(g), t.deg(g)) : t.same);
  }
  if (!move && ref === null && !parts.length) parts.push(t.thHint);
  if (S.secret === 's2') parts.push(t.s2Body(fmt(VOSTOK), fmt(-VOSTOK), t.deg(1.5)));
  return { emo: k === 'neg' ? '❄️' : k === 'zero' ? '🧊' : '☀️', title: t.zone[k], lead, body: parts.join(' '), fine: S.secret === 's2' ? t.fine.s2 : t.fine.th };
}
function stateLi(t) {
  const { floor, goal, hit, blocked } = S.li, tr = S.trip.li, d = floor - tr.from, k = sign(floor), a = Math.abs(d);
  const title = k === 'pos' ? t.liTitle.pos(fmt(floor)) : k === 'zero' ? t.liTitle.zero : t.liTitle.neg(fmt(floor), fmt(-floor));
  const lead = k === 'zero' ? t.liLead.zero : t.liLead[k](fmt(Math.abs(floor)), t.flo(Math.abs(floor)));
  const move = d === 0 ? '' : (d > 0 ? t.liUp : t.liDown)(fmt(a), t.flo(a), fmt(tr.from), fmt(floor));
  const parts = [];
  if (performance.now() - blocked < 2500 && blocked) parts.push(t.blocked);
  if (goal !== null && !hit && S.li.goalQ) parts.push('🎯 ' + S.li.goalQ);
  if (move) parts.push((hit && goal !== null ? t.reached + ' ' : '') + move);
  if (!move) parts.push(t.liHint);
  return { emo: '🛗', title, lead, body: parts.join(' '), fine: t.fine.li };
}
function stateNl(t) {
  const n = S.nl;
  if (n.task || (n.msg && !n.task && n.i >= TARGETS.length)) {
    return { emo: '📍', title: t.chips.nl1, lead: n.task ? t.taskLead(fmt(TARGETS[n.i])) : t.taskDone, body: n.task ? [n.msg, t.taskBody(n.i, TARGETS.length)].filter(Boolean).join(' ') : '', fine: t.fine.nl };
  }
  const d = n.B - n.A, a = Math.abs(d);
  if (S.secret === 's1') {
    const sub = n.sub, m = Math.abs(sub);
    return { emo: '➖', title: sub < 0 ? `${fmt(n.A)} − (${fmt(sub)}) = ${fmt(n.B)}` : `${fmt(n.A)} − ${fmt(sub)} = ${fmt(n.B)}`, lead: sub < 0 ? t.s1Neg : t.s1Pos,
      body: sub < 0 ? t.s1BodyNeg(fmt(m), t.coin(m), fmt(n.A), fmt(n.B)) : t.s1BodyPos(fmt(m), fmt(n.A), fmt(n.B)), fine: t.fine.nl };
  }
  const move = a === 0 ? t.nlEmpty : (d > 0 ? t.nlR : t.nlL)(fmt(a), fmt(n.A), fmt(n.B));
  return { emo: '🐸', title: `${t.nlDist}: ${fmt(a)}`, lead: t.nlLead(fmt(n.A), fmt(n.B), fmt(a)), body: `${move} ${t.nlHint}`, fine: t.fine.nl };
}
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  const q = { th1: t.q.th1, th2: t.q.th2 }; S.th.goalQ = q[S.th.goal === 3 ? 'th1' : S.th.goal === -5 ? 'th2' : ''] ?? ''; S.li.goalQ = S.li.goal === -3 ? t.q.li1 : S.li.goal === 4 ? t.q.li2 : '';
  $('lblSteps').textContent = t.lblSteps; $('lblTry').textContent = t.lblTry;
  const chip = (k, label, on, extra = '') => `<button class="chip ${on ? 'on' : ''}" data-k="${k}" ${extra}>${esc(label)}</button>`;
  const sc = (k) => `<button class="chip secret ${open ? 'open' : ''} ${S.secret === k ? 'on' : ''}" data-k="${k}">${open ? esc(t.secrets[k][0]) : '🔒 ???'}</button>`;
  let steps = '', presets = [];
  if (v === 'th') {
    steps = [-10, -5, -1, 1, 5, 10].map((d) => `<button class="chip" data-d="${d}">${sgn(d)}</button>`).join('');
    presets = [chip('th1', t.chips.th1), chip('th2', t.chips.th2), chip('th3', t.chips.th3, S.th.ref !== null)];
    if (S.secret === 's2') presets.push(chip('th4', t.chips.th4));
  } else if (v === 'li') {
    steps = [-5, -3, -1, 1, 3, 5].map((d) => `<button class="chip" data-d="${d}">${sgn(d)}</button>`).join('');
    presets = [chip('li1', t.chips.li1), chip('li2', t.chips.li2)];
  } else {
    if (S.secret === 's1') steps = [3, 1, -1, -3, -5].map((s) => `<button class="chip ${S.nl.sub === s ? 'on' : ''}" data-sub="${s}">${s < 0 ? `− (−${fmt(-s)})` : `− ${fmt(s)}`}</button>`).join('');
    else if (!S.nl.task) steps = `<button class="chip" data-act="hop">${esc(t.hop)}</button><button class="chip" data-act="swap">${esc(t.swap)}</button>`;
    presets = [chip('nl1', t.chips.nl1, S.nl.task), chip('nl2', t.chips.nl2), chip('nl3', t.chips.nl3, S.nl.scale === 400)];
  }
  $('steps').innerHTML = steps; $('stepsRow').style.display = steps ? '' : 'none';
  $('chips').innerHTML = [sc('s1'), ...presets, sc('s2')].join('');

  let st;
  if (v === 'th') {
    st = stateTh(t); const k = sign(S.th.temp), c = k === 'neg' ? `hsl(${205 + Math.min(1, -S.th.temp / 40) * 20},90%,62%)` : `hsl(${40 - S.th.temp / 40 * 35},95%,58%)`;
    lab.setReadout(`${fmt(S.th.temp)} °C`, t.thSub[k], t.thPill[k], c); lab.setGlow(k === 'neg' ? 'rgba(78,168,255,.24)' : 'rgba(255,138,61,.22)');
  } else if (v === 'li') {
    st = stateLi(t); const k = sign(S.li.floor);
    lab.setReadout(fmt(S.li.floor), t.liSub[k], '', zcol(S.li.floor)); lab.setGlow('rgba(245,200,76,.18)');
  } else {
    st = stateNl(t);
    lab.setReadout(S.nl.task ? fmt(S.nl.A) : fmt(Math.abs(S.nl.B - S.nl.A)), S.nl.task ? t.nlMarker : t.nlDist, '', S.nl.task ? COLA : GOLD); lab.setGlow('rgba(61,220,151,.18)');
  }
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body, extra: `<div class="fine">${esc(st.fine)}</div>` });
  ask.style.display = S.answered ? 'none' : '';
  if (!S.answered) ask.innerHTML = S.answer === null
    ? `<div class="q">${esc(t.ask)}</div><div class="opts">${t.opts.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="q" style="color:${S.answer === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(S.answer === 1 ? t.right : t.wrong)}</div><div class="opts"><button>${esc(t.go)} →</button></div>`;
}

// ---------- geometry ----------
function thGeo(w, h) {
  const r = clamp(Math.min(w, h) * 0.065, 14, 28), tw = clamp(Math.min(w, h) * 0.07, 18, 34), yt = h * 0.07, yb = h * 0.82 - r * 0.2, cx = w * 0.30, l = lo();
  return { r, tw, yt, yb, cx, bulbY: yb + r * 0.8, Y: (v) => yb - (v - l) / (HI_T - l) * (yb - yt), invY: (y) => l + (yb - y) / (yb - yt) * (HI_T - l), sx0: cx + tw / 2 + 64 };
}
function liGeo(w, h) {
  const top = h * 0.04, fh = (h * 0.92) / 10, bx0 = w * 0.16, bx1 = w * 0.60, shaftW = clamp(fh * 1.35, 30, 52);
  return { top, fh, bx0, bx1, shaftW, sx0: bx1 - shaftW - 8, px0: w * 0.64, Yt: (f) => top + (HI_F - f) * fh };
}
function nlGeo(w, h) {
  const x0 = w * 0.07, x1 = w * 0.93, sc = S.nl.scale, ly = h * 0.60;
  return { x0, x1, ly, pr: clamp(w * 0.034, 13, 17), X: (v) => x0 + (v + sc) / (2 * sc) * (x1 - x0), inv: (x) => (x - x0) / (x1 - x0) * 2 * sc - sc };
}

// ---------- drawing ----------
const flakes = Array.from({ length: 30 }, (_, i) => ({ x: (i * 0.618034) % 1, ph: (i * 0.37) % 1, sp: 0.05 + (i % 5) * 0.012, sz: 0.7 + (i % 4) * 0.2 }));
function drawTh(c, w, h, dt, time) {
  const g = thGeo(w, h), { cx, tw, r, yt, yb, bulbY, Y, sx0 } = g, y0 = Y(0), T_ = T[lang];
  D.temp += (S.th.temp - D.temp) * Math.min(1, dt * 12);
  const temp = D.temp, cold = temp < 0, fs = clamp(w * 0.03, 11, 14);
  // sky tint and scene
  const tint = c.createLinearGradient(0, yt, 0, y0); tint.addColorStop(0, cold ? 'rgba(120,170,255,.00)' : 'rgba(255,170,80,.00)'); tint.addColorStop(1, cold ? 'rgba(120,170,255,.10)' : 'rgba(255,170,80,.12)');
  c.fillStyle = tint; c.fillRect(sx0, yt, w - sx0 - 8, y0 - yt);
  const ph = h * 0.13, pw = w - 8 - sx0;
  const water = c.createLinearGradient(0, y0, 0, y0 + ph); water.addColorStop(0, '#2d6fb5'); water.addColorStop(1, '#16335f');
  rr(c, sx0, y0, pw, ph, 12); c.fillStyle = water; c.fill();
  if (cold) { const it = clamp(-temp / 20, 0, 1) * ph * 0.6 + 2; rr(c, sx0, y0, pw, it, Math.min(10, it)); c.fillStyle = 'rgba(214,240,255,.92)'; c.fill(); }
  else { c.strokeStyle = 'rgba(180,220,255,.5)'; c.lineWidth = 1.5; for (let k = 0; k < 3; k++) { c.beginPath(); for (let x = 0; x <= pw - 16; x += 4) { const yy = y0 + 10 + k * 12 + Math.sin(x * 0.12 + time * 2 + k) * 2; x ? c.lineTo(sx0 + 8 + x, yy) : c.moveTo(sx0 + 8 + x, yy); } c.stroke(); } }
  if (cold) {
    const n = Math.floor(clamp(3 + (-temp) * 0.9, 3, flakes.length));
    for (let i = 0; i < n; i++) { const f = flakes[i], yy = yt + ((time * f.sp + f.ph) % 1) * (y0 - yt - 4), xx = sx0 + 10 + f.x * (pw - 20) + Math.sin(time + i) * 6; c.font = `${fs * f.sz * 1.3}px ${SANS}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText('❄', xx, yy); }
  } else {
    const sx = w - 44, sy = yt + 34, sr = 14 + Math.min(temp, 40) * 0.2, glow = c.createRadialGradient(sx, sy, 2, sx, sy, sr * 3);
    glow.addColorStop(0, 'rgba(255,200,90,.55)'); glow.addColorStop(1, 'rgba(255,200,90,0)'); c.fillStyle = glow; c.beginPath(); c.arc(sx, sy, sr * 3, 0, 7); c.fill();
    c.fillStyle = '#ffc857'; c.beginPath(); c.arc(sx, sy, sr, 0, 7); c.fill();
    c.strokeStyle = '#ffc857'; c.lineWidth = 2.5; for (let k = 0; k < 10; k++) { const a = k * Math.PI / 5 + time * 0.3; c.beginPath(); c.moveTo(sx + Math.cos(a) * (sr + 4), sy + Math.sin(a) * (sr + 4)); c.lineTo(sx + Math.cos(a) * (sr + 9), sy + Math.sin(a) * (sr + 9)); c.stroke(); }
  }
  // zero line
  c.setLineDash([6, 5]); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(cx + tw / 2, y0); c.lineTo(w - 8, y0); c.stroke(); c.setLineDash([]);
  txt(c, T_.cv.zero, sx0 + 4, y0 - fs * 0.9, fs, '#9ec8ff', { align: 'left', weight: 700 });
  // markers: reference and record
  const mark = (v, label, col) => { const yy = Y(v); c.setLineDash([4, 4]); c.strokeStyle = col; c.lineWidth = 2; c.beginPath(); c.moveTo(cx + tw / 2, yy); c.lineTo(w - 8, yy); c.stroke(); c.setLineDash([]); txt(c, label, w - 10, yy - fs, fs, col, { align: 'right' }); };
  if (S.th.ref !== null) mark(S.th.ref, `${fmt(S.th.ref)} °C`, GOLD);
  if (S.secret === 's2') mark(VOSTOK, `${T_.cv.vostok} ${fmt(VOSTOK)} °C`, '#ff7a7a');
  // thermometer glass
  rr(c, cx - tw / 2, yt - 4, tw, bulbY - yt + 4, tw / 2); c.fillStyle = 'rgba(22,28,48,.92)'; c.fill(); c.strokeStyle = '#8a94b8'; c.lineWidth = 2; c.stroke();
  c.beginPath(); c.arc(cx, bulbY, r, 0, 7); c.fillStyle = 'rgba(22,28,48,.95)'; c.fill(); c.stroke();
  const col = cold ? `hsl(${205 + Math.min(1, -temp / 40) * 20},90%,62%)` : `hsl(${40 - temp / 40 * 35},95%,58%)`, iw = tw * 0.46;
  c.fillStyle = col; c.beginPath(); c.arc(cx, bulbY, r * 0.78, 0, 7); c.fill();
  const yl = Y(temp); rr(c, cx - iw / 2, yl, iw, bulbY - yl, iw / 2); c.fill();
  // ticks
  const l = lo();
  for (let v = Math.ceil(l / 5) * 5; v <= HI_T; v += 5) {
    const yy = Y(v), major = v % 10 === 0;
    c.strokeStyle = v === 0 ? '#fff' : 'rgba(200,210,235,.55)'; c.lineWidth = v === 0 ? 2.5 : 1.2; c.beginPath(); c.moveTo(cx - tw / 2 - (major ? 10 : 5), yy); c.lineTo(cx - tw / 2, yy); c.stroke();
    if (major) txt(c, fmt(v), cx - tw / 2 - 14, yy, fs, v === 0 ? '#fff' : v < 0 ? '#9ec3ff' : '#ffc9a0', { align: 'right', weight: v === 0 ? 900 : 700 });
  }
  // trip arrow
  const tr = S.trip.th, fy = Y(tr.from), ty = Y(temp);
  if (Math.abs(fy - ty) > 4) {
    const xa = cx + tw / 2 + 20, up = ty < fy, ac = up ? GOLD : '#7fb6ff';
    c.setLineDash([3, 3]); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1; c.beginPath(); c.moveTo(cx + tw / 2, fy); c.lineTo(xa + 8, fy); c.stroke(); c.setLineDash([]);
    c.strokeStyle = ac; c.fillStyle = ac; c.lineWidth = 3; c.beginPath(); c.moveTo(xa, fy); c.lineTo(xa, ty - (up ? -8 : 8)); c.stroke();
    c.beginPath(); c.moveTo(xa, ty); c.lineTo(xa - 6, ty + (up ? 11 : -11)); c.lineTo(xa + 6, ty + (up ? 11 : -11)); c.closePath(); c.fill();
    pill(c, sgn(S.th.temp - tr.from), xa + 24, (fy + ty) / 2, fs, 'rgba(10,12,20,.85)', ac);
  }
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(cx, yl, iw / 2 + 2, 0, 7); c.stroke();
}

function drawLi(c, w, h, dt) {
  const g = liGeo(w, h), { top, fh, bx0, bx1, shaftW, sx0, px0, Yt } = g, t = T[lang];
  D.floor += (S.li.floor - D.floor) * Math.min(1, dt * 4);
  const lf = clamp(fh * 0.5, 11, 17), gy = Yt(-1);
  // soil, building
  c.fillStyle = '#33251f'; rr(c, bx0 - 12, gy, bx1 - bx0 + 24, Yt(LO_F) + fh - gy + 6, 8); c.fill();
  c.strokeStyle = '#3ddc97'; c.lineWidth = 3; c.beginPath(); c.moveTo(bx0 - 24, gy); c.lineTo(bx1 + 24, gy); c.stroke();
  for (let f = HI_F; f >= LO_F; f--) {
    const y = Yt(f), under = f < 0, cur = Math.round(D.floor) === f;
    rr(c, bx0, y + 1, bx1 - bx0, fh - 2, 4); c.fillStyle = under ? '#262634' : '#1d2644'; c.fill();
    if (cur) { rr(c, bx0, y + 1, bx1 - bx0, fh - 2, 4); c.fillStyle = 'rgba(255,211,110,.14)'; c.fill(); }
    if (!under) for (let k = 0; k < 3; k++) { const ww = (sx0 - bx0 - 20) / 3 - 6; rr(c, bx0 + 10 + k * (ww + 6), y + fh * 0.22, ww, fh * 0.5, 3); c.fillStyle = (f * 7 + k * 3) % 3 === 0 ? 'rgba(255,217,138,.18)' : 'rgba(255,217,138,.5)'; c.fill(); }
    if (f === 0) txt(c, t.cv.ground, bx0 + 12, y + fh / 2, clamp(fh * 0.28, 9, 12), '#3ddc97', { align: 'left', weight: 800 });
    if (f === LO_F) { txt(c, '🚗', bx0 + 24, y + fh / 2, fh * 0.55, '#fff'); txt(c, t.cv.garage, bx0 + 12 + fh * 0.7, y + fh / 2, clamp(fh * 0.28, 9, 12), '#9aa3c2', { align: 'left', weight: 800 }); }
    if (under && f !== LO_F) { c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 2; c.setLineDash([8, 8]); c.beginPath(); c.moveTo(bx0 + 10, y + fh * 0.8); c.lineTo(sx0 - 10, y + fh * 0.8); c.stroke(); c.setLineDash([]); }
    txt(c, fmt(f), bx0 - 10, y + fh / 2, cur ? lf * 1.2 : lf, cur ? '#fff' : zcol(f), { align: 'right', weight: cur ? 900 : 700 });
  }
  // shaft, cable, cab
  c.fillStyle = '#0b0f1c'; c.fillRect(sx0, top, shaftW, Yt(LO_F) + fh - top);
  const cy = Yt(D.floor) + fh / 2;
  c.strokeStyle = '#8a94b8'; c.lineWidth = 2; c.beginPath(); c.moveTo(sx0 + shaftW / 2, top); c.lineTo(sx0 + shaftW / 2, cy - fh / 2 + 2); c.stroke();
  rr(c, sx0 + 3, cy - fh / 2 + 3, shaftW - 6, fh - 6, 5); c.fillStyle = '#d8c08a'; c.fill(); c.strokeStyle = '#fff3cf'; c.lineWidth = 1.5; c.stroke();
  txt(c, '🧑', sx0 + shaftW / 2, cy + 1, fh * 0.52, '#fff');
  // panel
  const pw = w - px0 - 10, ptop = h * 0.12, ph = h * 0.6;
  rr(c, px0, ptop, pw, ph, 14); c.fillStyle = 'rgba(14,17,28,.72)'; c.fill(); c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1.5; c.stroke();
  const moving = Math.abs(D.floor - S.li.floor) > 0.05;
  const fl = S.li.floor, big = clamp(pw * 0.55, 30, 70);
  txt(c, fmt(fl), px0 + pw / 2, ptop + ph * 0.3, big, zcol(fl), { serif: true, weight: 500 });
  txt(c, moving ? (D.floor < S.li.floor ? '▲' : '▼') : '●', px0 + pw / 2, ptop + ph * 0.58, clamp(pw * 0.16, 11, 18), moving ? GOLD : '#4a5270');
  const tr = S.trip.li, d = fl - tr.from;
  if (d !== 0) { const eq = `${fmt(tr.from)} ${d > 0 ? '+' : '−'} ${fmt(Math.abs(d))} = ${fmt(fl)}`, f = fit(c, eq, pw - 14, clamp(pw * 0.17, 12, 22)); txt(c, eq, px0 + pw / 2, ptop + ph * 0.82, f, '#fff', { weight: 800 }); }
  if (S.li.blocked && performance.now() - S.li.blocked < 900) txt(c, '✕', px0 + pw / 2, ptop + ph * 0.58, 22, '#ff6a6a');
}

function drawNl(c, w, h, dt, time) {
  const g = nlGeo(w, h), { x0, x1, ly, pr, X } = g, n = S.nl, t = T[lang], sc = n.scale, fs = clamp(w * 0.03, 10, 14);
  // frog motion
  if (D.hop) {
    D.hop.t += dt; const k = clamp(D.hop.t / D.hop.dur, 0, 1); D.frog = lerp(D.hop.from, D.hop.to, k);
    if (k >= 1) { D.hop = null; n.landed = true; sfx.snap(); }
  } else D.frog += ((n.landed ? n.B : n.A) - D.frog) * Math.min(1, dt * 14);
  // line + ticks
  c.strokeStyle = '#c6cde0'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(x0 - 10, ly); c.lineTo(x1 + 10, ly); c.stroke();
  const minor = sc === 20 ? 1 : 50, lab5 = sc / 4;
  for (let v = -sc; v <= sc; v += minor) {
    const x = X(v), major = v % lab5 === 0; c.strokeStyle = v === 0 ? '#fff' : 'rgba(200,210,235,.55)'; c.lineWidth = v === 0 ? 3 : 1.3;
    c.beginPath(); c.moveTo(x, ly - (major ? 9 : 5)); c.lineTo(x, ly + (major ? 9 : 5)); c.stroke();
    if (major) txt(c, fmt(v), x, ly + 24, fs * 1.05, v === 0 ? '#fff' : zcol(v), { weight: v === 0 ? 900 : 700 });
  }
  txt(c, '← ' + t.cv.smaller, x0, ly + 52, fs, '#7fb6ff', { align: 'left', weight: 700 });
  txt(c, t.cv.bigger + ' →', x1, ly + 52, fs, '#ffb067', { align: 'right', weight: 700 });
  const closeAB = Math.abs(X(n.A) - X(n.B)) < pr * 2 + 2, yB = closeAB ? ly - pr * 2 - 6 : ly;
  // task progress
  if (n.task || (n.i >= TARGETS.length && n.msg)) {
    const sz = clamp(w * 0.045, 13, 20), gap = sz * 2.4, sx = w / 2 - (TARGETS.length - 1) * gap / 2;
    TARGETS.forEach((v, i) => txt(c, fmt(v), sx + i * gap, h * 0.3, sz, i < n.i ? '#3ddc97' : i === n.i ? '#fff' : '#646c84', { weight: 900 }));
  }
  // arc and distance
  const isTask = n.task;
  if (!isTask && n.A !== n.B) {
    const xa = X(n.A), xb = X(n.B), ch = clamp(Math.abs(xb - xa) * 0.28, 26, h * 0.26), top = ly - 10;
    c.strokeStyle = GOLD; c.lineWidth = 3; c.beginPath(); c.moveTo(xa, top); c.quadraticCurveTo((xa + xb) / 2, top - ch * 2, xb, top); c.stroke();
    const dir = Math.sign(xb - xa), ex = xb, ey = top;
    c.fillStyle = GOLD; c.beginPath(); c.moveTo(ex, ey + 2); c.lineTo(ex - dir * 11 - 3, ey - 10); c.lineTo(ex - dir * 11 + 7, ey - 6); c.closePath(); c.fill();
    pill(c, fmt(Math.abs(n.B - n.A)), (xa + xb) / 2, top - ch, clamp(w * 0.04, 13, 18), GOLD, '#1a1405');
  }
  // pins
  const pin = (v, y, col) => { const x = X(v); if (y !== ly) { c.strokeStyle = col; c.lineWidth = 2; c.beginPath(); c.moveTo(x, y + pr); c.lineTo(x, ly); c.stroke(); } c.beginPath(); c.arc(x, y, pr, 0, 7); c.fillStyle = col; c.fill(); c.strokeStyle = '#0b0f1c'; c.lineWidth = 2; c.stroke(); const s = fmt(v); txt(c, s, x, y + 1, fit(c, s, pr * 1.9, 13, 900), '#0b0f1c', { weight: 900 }); };
  if (!isTask) pin(n.B, yB, COLB);
  pin(n.A, ly, COLA);
  // frog
  if (!isTask) {
    const fsz = clamp(w * 0.07, 24, 34); let bounce = 0;
    if (D.hop) bounce = Math.abs(Math.sin(Math.PI * clamp(D.hop.t / D.hop.dur, 0, 1) * D.hop.nh)) * fsz * 1.1;
    const fx = X(D.frog);
    c.save(); c.translate(fx, ly - pr - fsz * 0.55 - 6 - bounce - (closeAB && !D.hop ? pr : 0)); if (D.hop && D.hop.to < D.hop.from) c.scale(-1, 1);
    txt(c, '🐸', 0, 0, fsz, '#fff'); c.restore();
  }
}

canvasLoop($('cv'), (c, w, h, dt, time) => { lab.view === 'th' ? drawTh(c, w, h, dt, time) : lab.view === 'li' ? drawLi(c, w, h, dt) : drawNl(c, w, h, dt, time); });

// ---------- pointer ----------
const cv = $('cv');
const at = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top, w: r.width, h: r.height }; };
function dragTo(p) {
  const v = lab.view;
  if (v === 'th') { const nv = clamp(Math.round(thGeo(p.w, p.h).invY(p.y)), lo(), HI_T); if (nv !== S.th.temp) { sfx.tick(); setTemp(nv); } }
  else if (v === 'li') { const g = liGeo(p.w, p.h), f = clamp(HI_F - Math.floor((p.y - g.top) / g.fh), LO_F, HI_F); if (f !== S.li.floor) { sfx.tick(); S.li.floor = f; goalCheck(S.li, f); render(); } }
  else if (S.drag === 'A' || S.drag === 'B') setMarker(S.drag, nlGeo(p.w, p.h).inv(p.x));
}
cv.addEventListener('pointerdown', (ev) => {
  const p = at(ev), v = lab.view; cv.setPointerCapture(ev.pointerId);
  if (v === 'th') { S.drag = 'th'; S.trip.th = { from: S.th.temp, t: Date.now() }; }
  else if (v === 'li') { S.drag = 'li'; S.trip.li = { from: S.li.floor, t: Date.now() }; }
  else { const g = nlGeo(p.w, p.h); S.drag = (S.nl.task || S.secret === 's1' || Math.abs(p.x - g.X(S.nl.A)) <= Math.abs(p.x - g.X(S.nl.B))) ? 'A' : 'B'; }
  dragTo(p);
});
cv.addEventListener('pointermove', (ev) => { if (S.drag) dragTo(at(ev)); });
const release = () => { const d = S.drag; S.drag = null; if (d === 'A' && S.nl.task && lab.view === 'nl') checkTask(); };
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', () => { S.drag = null; });
render();
</script>
