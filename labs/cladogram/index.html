// paper
let paperPat = null;

// ink lines with a slight hand-drawn wobble (two passes: a bold line and a thin offset one)
function inkPath(c, pts, seed) {
  c.beginPath();
  let first = true;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    const len = Math.hypot(x1 - x0, y1 - y0), k = Math.max(1, Math.ceil(len / 9));
    const nx = len ? -(y1 - y0) / len : 0, ny = len ? (x1 - x0) / len : 0;
    for (let j = (i === 1 ? 0 : 1); j <= k; j++) {
      const t = j / k, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
      const wv = Math.sin(x * 0.31 + y * 0.23 + seed) * 0.9 + Math.sin(x * 0.07 - y * 0.11 + seed * 2) * 0.6;
      if (first) { c.moveTo(x + nx * wv, y + ny * wv); first = false; } else c.lineTo(x + nx * wv, y + ny * wv);
    }
  }
}

}

// --- Traits view and the finished tree ---------------------------------------------------------------------------

// --- Closer view: three animals, the tree hidden; after the answer the little tree grows --------------------------------
function drawCloser(c, w, h, dt, time) {
  if (S.round >= ROUNDS.length) { drawTree(c, w, h, dt, time, { n: NF, focus: -1, sel: [] }); S.hit = []; return; }

  S.rv = clamp(S.rv + (S.pick !== null ? 1 : -1) * dt / 0.9, 0, 1);
  const e = ease(S.rv), ap = easeBack((time - S.roundT) / 0.55);

  const nameW = Math.max(...[F, R, W].map((id) => c.measureText(nm(id)).width));

  const pre = { [F]: [w / 2, h * 0.3, rf], [rd.o[0]]: [w * 0.27, h * 0.72, rc], [rd.o[1]]: [w * 0.73, h * 0.72, rc] };
  const leafX = w - 10 - nameW - 8 - rc, yW = h * 0.2, yF = h * 0.5, yR = h * 0.8;
  const post = { [W]: [leafX, yW, rc], [F]: [leafX, yF, rc], [R]: [leafX, yR, rc] };
  const pos = (id) => [lerp(pre[id][0], post[id][0], e), lerp(pre[id][1], post[id][1], e), lerp(pre[id][2], post[id][2], e)];
  // the little tree

  const X0 = 22, xB = X0 + Math.max(46, fW.length * 24 + 14), xA = Math.min(xB + Math.max(50, own.length * 24 + 24), leafX - rc - 28);
  const yA = (yF + yR) / 2, yB = (yW + yA) / 2, ta = clamp01((S.rv - 0.55) / 0.4), bsc = easeBack((S.rv - 0.6) / 0.4);
  if (ta > 0.01) {
    c.save(); c.globalAlpha = ta;
    const lx = leafX - rc;
    inkLine(c, [[X0, yB], [xB, yB]], INK, 3.4, 1, 1);
    inkLine(c, [[xB, yB], [xB, yW], [lx, yW]], INK, 3.4, 1, 2);

    inkLine(c, [[xA, yA], [xA, yF], [lx, yF]], ORANGE, 4.4, 1, 4);

    fW.forEach((q, i) => badge(c, X0 + 20 + i * 24, yB, q, bsc, 10.5));

    c.shadowColor = 'rgba(235,120,30,.9)'; c.shadowBlur = 10; c.lineWidth = 3;
    c.strokeStyle = ORANGE; c.fillStyle = 'rgba(255,200,120,.6)'; c.beginPath(); c.arc(xA, yA, 8, 0, 7); c.fill(); c.stroke();
    c.strokeStyle = GOLD; c.fillStyle = 'rgba(255,230,150,.6)'; c.beginPath(); c.arc(xB, yB, 8, 0, 7); c.fill(); c.stroke();
    c.shadowBlur = 0; c.shadowColor = 'transparent';
    pill(c, T[lang].cvShared(fR.length), xA + 12, yA, { left: true, bg: 'rgba(200,90,20,.92)' });

    c.save(); c.globalAlpha = e; c.textAlign = 'left'; c.fillText(nm(id), x + rr + 7, y + 1); c.restore();
  }
  S.hit = S.pick === null ? rd.o.map((id, i) => ({ i, x: pre[id][0], y: pre[id][1], r: pre[id][2] + 10 })) : [];

  inkLine(c, trunk, '#4a3523', 4.6, 1, 6);
  inkLine(c, rexPts, '#a85a2d', 4.6, 1, 7);
  inkLine(c, birdPts, '#3b6f8f', 4.6, 1, 8);

    const g = c.createLinearGradient(xa + 2, 0, xa + 26, 0); g.addColorStop(0, 'rgba(244,234,210,0)'); g.addColorStop(1, 'rgba(244,234,210,.96)');

  c.strokeStyle = tg; c.lineWidth = 8; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 0); c.lineTo(34, -20); c.stroke();
  const mg = c.createRadialGradient(-2, -2, 1, 0, 0, 9); mg.addColorStop(0, '#fff4c8'); mg.addColorStop(0.5, '#ffa23a'); mg.addColorStop(1, '#c8452a');
  c.fillStyle = mg; c.shadowColor = 'rgba(255,120,30,.8)'; c.shadowBlur = 10; c.beginPath(); c.arc(0, 0, 8, 0, 7); c.fill(); c.restore();
  pill(c, T[lang].cv.ast, xa - 56, 13, { w, fs: 12 });
  // axis

  c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'top';

// --- secret A: drag the crocodile next to the lizard -------------------------------------------------------------
function drawSecA(c, w, h, dt, time) {
  const A = S.a;
  const L = drawTree(c, w, h, dt, time, { n: NF, focus: -1, sel: [], skip: 'croc' });
  const home = L.leaf.croc, r = L.r;
  let px = home.x, py = home.y, lift = 0;
  if (A.drag) { px = A.x; py = A.y; lift = 1; }
  else if (A.back) {
    const u = clamp01((time - A.back.t0) / 0.6), e = easeBack(u);
    px = lerp(A.back.x0, home.x, e); py = lerp(A.back.y0, home.y, e);

      c.save(); c.setLineDash([5, 6]); c.strokeStyle = near === 'lizard' ? '#d0452a' : '#2fb673'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(px, py); c.lineTo(q.x, q.y); c.stroke(); c.restore();
      pill(c, T[lang].cvShared(n), mx, my, { w, bg: near === 'lizard' ? 'rgba(180,50,30,.92)' : 'rgba(30,130,85,.92)' });
    }
  }

  if (lift) { c.shadowColor = 'rgba(60,35,10,.45)'; c.shadowBlur = 16; c.shadowOffsetY = 8; }

      const bx = clamp(lz.x - bw / 2 - 20, 8, w - bw - 8), by = clamp((lz.y + L.leaf.croc.y) / 2 - bh / 2, 8, h - bh - 8);

      c.fillStyle = '#a02a14'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(l1, bx + bw / 2, by + 15);
      c.font = '900 15px Nunito, sans-serif'; c.fillText(l2, bx + bw / 2, by + 33); c.restore();
    }

}

// --- secret B: Archaeopteryx, sort the clues ------------------------------------------------------------------------
const HOT = [[0.84, -0.3], [0.46, -0.52], [-0.8, 0.34], [-0.2, -0.34]]; // teeth, wing claws, tail, feathers (on the silhouette's unit box)
function drawSecB(c, w, h, dt, time) {
  const B = S.b, t = T[lang].sb, pad = 12, ph = Math.round(h * 0.62), pw = w - 2 * pad;

    if (!done) { c.strokeStyle = sel ? ORANGE : 'rgba(224,160,32,.9)'; c.lineWidth = sel ? 3.5 : 2.2; c.beginPath(); c.arc(x, y, (sel ? 17 : 14) * pulse, 0, 7); c.stroke(); }
    const col = done === 'd' ? '#b5532a' : done === 'b' ? '#3e86b8' : sel ? ORANGE : '#e8a032';
    c.fillStyle = col; c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 11, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.font = '900 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(done ? '✓' : String(i + 1), x, y + 0.5);
    c.restore();
  });
  if (B.sel !== null) pill(c, `${B.sel + 1}. ${t.items[B.sel].n}`, w / 2, pad + ph - 18, { w, fs: 13 });
  // bins
  const by = pad + ph + 10, bh = h - by - pad, bw = (w - 3 * pad) / 2;
  [['d', pad, 'rgba(181,83,42,.14)', '#b5532a'], ['b', pad * 2 + bw, 'rgba(62,134,184,.14)', '#3e86b8']].forEach(([k, bx, fill, stroke]) => {
    c.fillStyle = fill; c.strokeStyle = stroke; c.lineWidth = 2; c.beginPath(); c.roundRect(bx, by, bw, bh, 14); c.fill(); c.stroke();
    c.fillStyle = INK; c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText((k === 'd' ? '🦖 ' : '🐦 ') + t.bins[k], bx + 12, by + 17);
    c.font = '700 12px Nunito, sans-serif'; let row = 0;
    sorted.forEach((s, i) => { if (s === k) { c.fillText(t.items[i].n, bx + 12, by + 40 + row * 18); row++; } });
  });
}

// --- the main draw: pick the scene ------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  paper(c, w, h);
  const v = lab.view;
  c.save(); c.lineJoin = 'round';
  if (S.sec === 'a') drawSecA(c, w, h, dt, time);
  else if (S.sec === 'b') drawSecB(c, w, h, dt, time);
  else if (v === 'feat') drawFeat(c, w, h, dt, time);
  else if (v === 'closer') drawCloser(c, w, h, dt, time);
  else drawBirds(c, w, h, dt, time);
  c.restore();
});

// --- pointer input on the picture ------------------------------------------------------------------------------
const cv = $('cv');
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
};
const local = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
function toggleSel(id) {
  const i = S.sel.indexOf(id);
  if (i >= 0) S.sel.splice(i, 1); else { S.sel.push(id); if (S.sel.length > 2) S.sel.shift(); }
  sfx.tick(); render();
}
cv.addEventListener('pointerdown', (ev) => {
  const [x, y] = local(ev), v = lab.view;
  if (S.sec === 'a') {
    const lf = LAY.leaf.croc;
    if (lf && Math.hypot(x - lf.x, y - lf.y) < lf.r + 14 && !S.a.back) {
      Object.assign(S.a, { drag: true, ox: x - lf.x, oy: y - lf.y, x: lf.x, y: lf.y, msg: null });
      try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ }
      sfx.click(); render();
    }
  } else if (S.sec === 'b') {
    const i = S.b.hs.findIndex((q) => Math.hypot(x - q.x, y - q.y) < q.r);
    if (i >= 0 && !S.b.sorted[i]) { S.b.sel = i; S.b.msg = null; sfx.tick(); render(); }
  } else if (v === 'feat') {
    const id = IDS.find((k) => { const q = LAY.leaf[k]; return q && (Math.hypot(x - q.x, y - q.y) < q.r + 8 || (x > q.x && Math.abs(y - q.y) < q.r)); });
    if (id) toggleSel(id);
  } else if (v === 'closer' && S.pick === null) {
    const q = S.hit.find((hh) => Math.hypot(x - hh.x, y - hh.y) < hh.r);
    if (q) answerCloser(q.i);
  } else if (v === 'birds') {
    for (const b of BIRDS) {
      if (b.id === 'pigeon' && S.bpick === null) continue;
      const bx = b.id === 'trex' ? BV.tx(TAST) - BV.r - 8 : BV.tx(b.t), by = b.id === 'theropod' ? BV.yM : b.id === 'trex' ? BV.yT : BV.yB;
      if (Math.hypot(x - bx, y - by) < BV.r + 8) { S.tAnim = false; S.t = Math.max(b.t, S.bpick === null ? TAST : 0); sfx.tick(); birdsSync(); break; }
    }
  }
});
cv.addEventListener('pointermove', (ev) => {
  if (!S.a.drag) return;
  const [x, y] = local(ev), r = cv.getBoundingClientRect();
  S.a.x = clamp(x - S.a.ox, 0, r.width); S.a.y = clamp(y - S.a.oy, 0, r.height);
});
const endDrag = () => {
  const A = S.a;
  if (!A.drag) return;
  A.drag = false;
  let near = null, nd = 1e9;
  for (const id of IDS) { if (id === 'croc') continue; const q = LAY.leaf[id], d = Math.hypot(A.x - q.x, A.y - q.y); if (d < nd) { nd = d; near = id; } }
  const close = near && nd < LAY.r * 2.6;
  A.msg = close && near === 'lizard' ? 'refuse' : close && (near === 'trex' || near === 'pigeon') ? 'fits' : 'miss';
  A.msgT = now(); A.back = { x0: A.x, y0: A.y, t0: now() };
  (A.msg === 'refuse' ? sfx.bad : sfx.snap)();
  render();
};
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls ------------------------------------------------------------------------------------------------
function answerCloser(i) {
  if (S.pick !== null) return;
  const rd = ROUNDS[S.round]; S.pick = i; S.picks[S.round] = i === okIdx(rd);
  (S.picks[S.round] ? sfx.good : sfx.bad)(); render(); showStage();
}
function answerBirds(i) {
  if (S.bpick !== null) return;
  S.bpick = i; S.tAnim = true; (i === T[lang].br.ok ? sfx.good : sfx.bad)(); render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, d = b.dataset;
  if (act === 'f') {
    const k = +d.k;
    if (k > S.n) return;
    if (k === S.n) { S.n++; S.popAt[k] = now(); sfx.good(); } else sfx.tick();
    S.focus = k;
  } else if (act === 'reset') { S.n = 0; S.focus = -1; S.sel = []; S.popAt = []; sfx.click(); }
  else if (act === 'row') return toggleSel(d.id);
  else if (act === 'copt') return answerCloser(+d.i);
  else if (act === 'cnext') {
    if (S.round >= ROUNDS.length) { S.round = 0; S.picks = []; } else S.round++;
    S.pick = null; S.rv = 0; S.roundT = now(); sfx.click();
  } else if (act === 'bopt') return answerBirds(+d.i);
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === d.k ? null : d.k;
    if (S.sec === 'a') Object.assign(S.a, { drag: false, back: null, msg: null });
    if (S.sec === 'b') S.b = { sel: null, sorted: [null, null, null, null], msg: null, hs: [] };
    sfx.click(); if (S.sec) showStage();
  } else if (act === 'bf') { const k = +d.k; if (!S.b.sorted[k]) { S.b.sel = k; S.b.msg = null; sfx.tick(); } }
  else if (act === 'sortD' || act === 'sortB') {
    const B = S.b, bin = act === 'sortD' ? 'd' : 'b';
    if (B.sel === null) { B.msg = 'pick'; sfx.bad(); }
    else if (T[lang].sb.items[B.sel].ok === bin) { B.sorted[B.sel] = bin; B.last = B.sel; B.sel = null; B.msg = 'ok'; sfx.good(); }
    else { B.msg = 'wrong'; sfx.bad(); }
  }
  render();
});
$('bSlider').addEventListener('input', (ev) => {
  S.tAnim = false; let t = TMAX - +ev.target.value;
  if (S.bpick === null && t < TAST) { t = TAST; ev.target.value = String(TMAX - TAST); }
  S.t = t; birdsSync();
});

// --- one render per change: controls, readout, state card and facts -------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  cv.classList.toggle('cg-drag', sec === 'a');
  $('vF').hidden = !(v === 'feat' && !sec); $('vC').hidden = !(v === 'closer' && !sec); $('vB').hidden = !(v === 'birds' && !sec);
  $('vSA').hidden = sec !== 'a'; $('vSB').hidden = sec !== 'b';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('a', '🐊') + sc('b', '🦅');
  if (sec === 'a') renderSecA(t); else if (sec === 'b') renderSecB(t);
  else if (v === 'feat') renderFeat(t); else if (v === 'closer') renderCloser(t); else renderBirds(t);
}

function renderFeat(t) {
  const n = S.n, sel = S.sel;
  lab.setGlow('rgba(95, 168, 100, .24)');
  $('fChips').innerHTML = t.feat.map((f, k) => `<button class="chip${k === S.focus ? ' on' : ''}${k === n ? ' next' : ''}" data-act="f" data-k="${k}"${k > n ? ' disabled' : ''}><span class="cg-n">${k + 1}</span>${esc(f.s)}</button>`).join('')
    + `<button class="chip" data-act="reset"${n ? '' : ' disabled'}>${esc(t.reset)}</button>`;
  $('fCap').textContent = t.tbl;
  $('fTable').innerHTML = `<colgroup><col class="cg-c0">${'<col>'.repeat(NF)}</colgroup><thead><tr><th></th>${t.feat.map((_, k) => `<th class="${k === S.focus ? 'cg-on' : ''}">${k + 1}</th>`).join('')}</tr></thead><tbody>`
    + IDS.map((id) => `<tr class="${sel.includes(id) ? 'cg-sel' : ''}"><td class="cg-name"><button class="cg-rowb" data-act="row" data-id="${id}">${esc(nm(id))}</button></td>${HAS[id].map((hv, k) => `<td class="${k === S.focus ? 'cg-on' : ''}">${hv && k < n ? '<i class="cg-dot"></i>' : ''}</td>`).join('')}</tr>`).join('') + '</tbody>';
  if (sel.length === 2) {
    const N = shared(sel[0], sel[1], n);
    lab.setReadout(String(N), `${t.sharedW(N)} · ${nm(sel[0])} + ${nm(sel[1])}`, '', '#e0a020');
    const list = sharedList(sel[0], sel[1], n).map((k) => t.feat[k].s).join(', ');
    lab.setState({ emo: '🔗', title: `${nm(sel[0])} + ${nm(sel[1])}`, lead: N ? t.pair.lead(N, list) : t.pair.zero, body: t.pair.body, extra: '' });
  } else {
    lab.setReadout(`${n}/${NF}`, t.onTree, '', '#e0a020');
    if (n === 0) lab.setState({ emo: '🌿', title: t.start[0], lead: t.start[1], body: t.start[2], extra: '' });
    else { const k = S.focus >= 0 ? S.focus : n - 1; lab.setState({ emo: FICO[k], title: `${k + 1}. ${t.feat[k].s}`, lead: t.feat[k].lead, body: t.feat[k].body, extra: '' }); }
  }
  lab.setFacts([{ emo: '🦴', text: t.facts.feat, src: SRC.feat }]);
}

function renderCloser(t) {
  const c = t.cl, end = S.round >= ROUNDS.length;
  lab.setGlow('rgba(224, 160, 32, .22)');
  if (end) {
    const k = S.picks.filter(Boolean).length;
    $('cQ').textContent = c.rule; $('cOpts').innerHTML = '';
    $('cNext').hidden = false; $('cNext').textContent = c.again;
    lab.setReadout(`${k}/${ROUNDS.length}`, c.sub, '', '#e0a020');
    lab.setState({ emo: '🏆', title: c.sum(k, ROUNDS.length), lead: c.sumLead, body: c.sumBody, extra: '' });
    lab.setFacts([{ emo: '🌿', text: t.facts.closer, src: SRC.closer }]);
    return;
  }
  const rd = ROUNDS[S.round], okI = okIdx(rd), R = rd.o[okI], W = rd.o[1 - okI], F = rd.f, asked = S.pick === null;
  $('cQ').textContent = c.q(F, rd.o[0], rd.o[1]);
  $('cOpts').innerHTML = rd.o.map((id, i) => `<button class="cg-opt${asked ? '' : i === okI ? ' good' : i === S.pick ? ' bad' : ' dim'}" data-act="copt" data-i="${i}"${asked ? '' : ' disabled'}>${esc(nm(id))}</button>`).join('');
  $('cNext').hidden = asked; $('cNext').textContent = S.round === ROUNDS.length - 1 ? c.last : c.next;
  if (asked) {
    lab.setReadout('?', c.askSub, c.round(S.round + 1, ROUNDS.length), '#e0a020');
    lab.setState({ emo: '🤔', title: c.askTitle, lead: c.askLead, body: '', extra: '' });
    lab.setFacts([]);
  } else {
    const nR = shared(F, R), nW = shared(F, W), good = S.pick === okI;
    lab.setReadout(`${nR} : ${nW}`, c.sub, good ? c.right : c.wrong, good ? '#2fb673' : '#e5484d');
    const used = [...new Set([...sharedList(F, R)])];
    const key = `<div class="cg-key">${used.map((k) => `<span><i class="cg-n">${k + 1}</i>${esc(t.feat[k].s)}</span>`).join('')}</div>`;
    lab.setState({ emo: good ? '✅' : '🌿', title: good ? c.right : c.wrong, lead: `${c.pair(nm(F), nm(R), nR)} ${c.pair(nm(F), nm(W), nW)}`, body: c.rule, extra: key });
    lab.setFacts([{ emo: '🌿', text: t.facts.closer, src: SRC.closer }]);
  }
}

function birdStage() {
  const done = S.bpick !== null;
  if (S.t <= TAST + 0.5) return done ? 'done' : 'ast';
  return S.t > 185 ? 'e0' : S.t > 110 ? 'e1' : 'e2';
}
function birdsLive() {
  if (lab.view !== 'birds' || S.sec) return;
  const t = T[lang], b = t.br, done = S.bpick !== null, st = birdStage();
  const key = `${Math.round(S.t)}|${st}|${done}|${lang}`;
  if (key === S.lastKey) return;
  S.lastKey = key;
  lab.setReadout(String(Math.round(S.t)), b.mya, done ? (S.bpick === b.ok ? b.right : b.wrong) : '', done && S.bpick === b.ok ? '#2fb673' : done ? '#e5484d' : '#5b8fb0');
  if (st === 'done') lab.setState({ emo: b.st.done[0], title: S.bpick === b.ok ? b.right : b.wrong, lead: b.st.done[1], body: b.st.done[2], extra: `<div>${esc(b.fine)}</div>` });
  else lab.setState({ emo: b.st[st][0], title: b.st[st][1], lead: b.st[st][2], body: b.st[st][3], extra: `<div>${esc(b.fine)}</div>` });
  lab.setFacts(done ? [{ emo: '🐦', text: t.facts.birds, src: SRC.birds }] : []);
}
function birdsSync() {
  const sl = $('bSlider'), v = String(Math.round(TMAX - S.t));
  if (sl.value !== v) sl.value = v;
  birdsLive();
}
function renderBirds(t) {
  const b = t.br, done = S.bpick !== null;
  lab.setGlow('rgba(91, 143, 176, .24)');
  $('bQ').textContent = b.q;
  $('bOpts').innerHTML = b.opts.map((o, i) => `<button class="cg-opt${!done ? '' : i === b.ok ? ' good' : i === S.bpick ? ' bad' : ' dim'}" data-act="bopt" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  $('bE0').textContent = b.endL; $('bE1').textContent = b.endR;
  $('bSlider').style.setProperty('--track', done ? 'linear-gradient(90deg, #c9a45a, #5b8fb0)' : `linear-gradient(90deg, #c9a45a 0 ${((TMAX - TAST) / TMAX) * 100}%, rgba(130,145,190,.25) ${((TMAX - TAST) / TMAX) * 100}%)`);
  $('bSlider').setAttribute('aria-label', b.mya);
  S.lastKey = ''; birdsSync();
}

function renderSecA(t) {
  const s = t.sa, A = S.a, n1 = shared('croc', 'lizard'), n2 = shared('croc', 'pigeon');
  lab.setGlow('rgba(95, 168, 100, .24)');
  $('saHint').textContent = s.lead;
  lab.setReadout(`${n2} : ${n1}`, s.val, '', '#2fb673');
  if (A.msg === 'refuse') lab.setState({ emo: '🚫', title: s.refuseTitle, lead: s.refuseLead(n1, n2), body: s.refuseBody, extra: '' });
  else if (A.msg === 'fits') lab.setState({ emo: '🐊', title: s.title, lead: s.fits, body: s.body, extra: '' });
  else if (A.msg === 'miss') lab.setState({ emo: '🐊', title: s.title, lead: s.miss, body: s.body, extra: '' });
  else lab.setState({ emo: '🐊', title: s.title, lead: s.lead, body: s.body, extra: '' });
  lab.setFacts([]);
}
function renderSecB(t) {
  const s = t.sb, B = S.b, cnt = B.sorted.filter(Boolean).length, all = cnt === 4;
  lab.setGlow('rgba(150, 140, 210, .26)');
  $('sbChips').innerHTML = s.items.map((it, i) => `<button class="chip${B.sel === i ? ' on' : ''}" data-act="bf" data-k="${i}"${B.sorted[i] ? ' disabled' : ''}><span class="cg-n">${B.sorted[i] ? '✓' : i + 1}</span>${esc(it.n)}</button>`).join('');
  $('sortD').textContent = s.sortD; $('sortB').textContent = s.sortB;
  $('sortD').disabled = $('sortB').disabled = all;
  lab.setReadout(`${cnt}/4`, s.sorted, '', '#8f7fd0');
  if (all) lab.setState({ emo: '🦅', title: s.doneTitle, lead: s.doneLead, body: s.doneBody, extra: '' });
  else if (B.msg === 'ok' && B.last !== undefined && B.last !== null) lab.setState({ emo: '✅', title: s.items[B.last].n, lead: s.items[B.last].why, body: s.body, extra: '' });
  else if (B.msg === 'wrong' && B.sel !== null) lab.setState({ emo: '🤔', title: s.items[B.sel].n, lead: s.wrongPre + s.items[B.sel].hint, body: '', extra: '' });
  else if (B.msg === 'pick') lab.setState({ emo: '🤔', title: s.title, lead: s.pick, body: s.body, extra: '' });
  else if (B.sel !== null) lab.setState({ emo: '🔎', title: s.items[B.sel].n, lead: s.body, body: '', extra: '' });
  else lab.setState({ emo: '🦅', title: s.title, lead: s.lead, body: s.body, extra: '' });
  lab.setFacts([]);
}
S.roundT = now();
render();
</script>
</body>
</html>
