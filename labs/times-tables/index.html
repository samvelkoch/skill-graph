// --- data and state ------------------------------------------------------------------------------------------
const TASKS = [[6, 7], [7, 8], [8, 6], [9, 7], [12, 4]];   // build rounds: rows x columns

const EASY = [1, 2, 5, 10];

const ease = (x) => x * x * (3 - 2 * x);

const divSign = () => (lang === 'en' ? '÷' : ':');
const startTask = () => { S.split = Math.floor(TASKS[S.ti][1] / 2); S.guess = null; S.phase = 'ask'; S.rt = 0; };

// --- drawing helpers -----------------------------------------------------------------------------------------
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function dot(c, x, y, r, col) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = col; c.fill(); }
function dotGrid(c, x, y, rows, cols, u, col) {
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) dot(c, x + (j + 0.5) * u, y + (i + 0.5) * u, Math.max(2.5, u * 0.15), col);
}

// --- view 1: the map -----------------------------------------------------------------------------------------
function mapGeo(w, h) {
  const hdr = 24, cs = Math.floor(Math.min((w - hdr - 8) / 12, (h - hdr - 8) / 12));
  return { hdr, cs, x0: Math.round((w - hdr - 12 * cs) / 2 + hdr), y0: Math.round((h - hdr - 12 * cs) / 2 + hdr) };
}
function drawMap(c, w, h) {
  const g = G.map = mapGeo(w, h), { hdr, cs, x0, y0 } = g;
  const dv = S.sec === 'divide' && S.mapDone, [tot, d] = DV[S.dvi], ans = tot / d;
  const { r, c: cc } = S.sel, flip = S.mT > 0.5, R = flip ? cc : r, C = flip ? r : cc;
  const known = S.mapDone || S.mapAns !== null; // the product of the first question stays hidden until it is answered
  const shown = dv ? Math.floor(S.walkPos + 1e-6) : 0;
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = FONT(700, 12);
  for (let i = 0; i < 12; i++) {
    const rowHot = dv ? i + 1 === d : i + 1 === R, colHot = dv ? S.found && i + 1 === ans : i + 1 === C;
    c.fillStyle = rowHot ? '#fff' : '#8a93ad'; c.fillText(i + 1, x0 - hdr / 2, y0 + i * cs + cs / 2);
    c.fillStyle = colHot ? (dv ? '#3ddc97' : '#fff') : '#8a93ad'; c.fillText(i + 1, x0 + i * cs + cs / 2, y0 - hdr / 2);
  }
  for (let i = 0; i < 12; i++) for (let j = 0; j < 12; j++) {
    let fill = i === j ? 'rgba(245,200,76,.26)' : 'rgba(130,145,190,.12)';
    if (dv) fill = i === d - 1 ? 'rgba(78,168,255,.22)' : i === j ? 'rgba(245,200,76,.1)' : 'rgba(130,145,190,.06)';
    rr(c, x0 + j * cs + 1, y0 + i * cs + 1, cs - 2, cs - 2, 4); c.fillStyle = fill; c.fill();
  }
  if (dv) {
    for (let j = 0; j < shown; j++) {
      const hit = S.found && j === ans - 1, x = x0 + j * cs, y = y0 + (d - 1) * cs;
      rr(c, x + 1, y + 1, cs - 2, cs - 2, 4); c.fillStyle = hit ? '#3ddc97' : 'rgba(78,168,255,.55)'; c.fill();
      c.fillStyle = hit ? '#0A0C14' : '#fff'; c.font = FONT(800, 12); c.fillText(d * (j + 1), x + cs / 2, y + cs / 2 + 0.5);
    }

      <button class="btn push" id="chk" data-act="chk"${S.guess === null ? ' disabled' : ''}>${esc(t.check)}</button></div>`;
  }
  if (S.phase === 'anim') { lab.setReadout(`${a} × ${bb} = ?`, dots, '', '#d9825f'); return q; }
  const ok = S.right[S.ti];
  lab.setReadout(`${a} × ${bb} = ${n}`, dots, '', '#d9825f');
  return `${q}${verdict(ok, ok ? t.right : t.wrong)}<div class="row2"><button class="btn push" data-act="bnext">${esc(t.next)}</button></div>`;
}

function renderPatterns(t) {
  const p = t.p, n = S.pn, ans = S.pAns[n], over = ans !== undefined && S.pDone;
  lab.setGlow('rgba(160,120,220,.26)');
  lab.setReadout(`${n}×`, over ? `${n}, ${2 * n}, ${3 * n}, …` : '', '', TCOL[n]);
  const tabs = `<div class="chips">${TABLES.map((x) => `<button class="chip ${x === n ? 'on' : ''}" data-act="tbl" data-n="${x}">${x}×</button>`).join('')}</div>`;
  const opts = ORDER[n % 3].map((i) => {
    const cls = !over ? '' : i === 0 ? 'good' : i === ans ? 'bad' : '';
    return `<button class="chip ${cls}" data-act="pans" data-i="${i}"${ans === undefined && !over ? '' : ' disabled'}>${esc(p.opts[n][i])}</button>`;
  }).join('');
  return `${tabs}<div class="qline" style="margin-top:14px">${esc(p.q(n))}</div><div class="chips">${opts}</div>` +
    (over ? `${verdict(ans === 0, ans === 0 ? t.right : t.notq)}<p class="vtext">${esc(p.why[n])}</p>` : '');
}

render();
</script>
</body>
</html>
