  .push { margin-left: auto; }
  @media (max-width: 760px) {

  } else if (X.sec === 'big') {
    const k = X.big, b = BIG[k];
    ctrl = `<div class="chips">${BIG.map((o, i) => `<button class="chip ${i === k ? 'on' : ''}" data-act="big" data-i="${i}" aria-label="${esc(t.sec.names[i])}">${o.emo}</button>`).join('')}</div>`;
    lab.setReadout(`${num(b.n)} ${unitL(b.u)}`, t.sec.names[k], '', '#5fa8a0');
    lab.setState({ emo: b.emo, title: `${cap(t.sec.names[k])}: ${num(b.n)} ${unitL(b.u)}`, lead: k === 4 ? t.sec.bigText : '', body: '', extra: '' });
  } else if (!Rl.made) {
    ctrl = `<div class="row2" style="margin-top:0"><button class="btn" data-act="make"${Rl.makeT0 >= 0 ? ' disabled' : ''}>${esc(tr.make)}</button></div>`;
    lab.setReadout(`0–15 ${t.cm}`, '', '', '#e0b050');
    general('ruler');
  } else {
    ctrl = `<div class="qline">${esc(tr.q)}</div>${stepHTML(Rl.g, Rl.done, t.cm)}`;
    if (!Rl.done) {
      ctrl += `<div class="row2"><button class="btn" data-act="check">${esc(t.check)}</button></div>`;
      lab.setReadout(`? ${t.cm}`, d, '', '#e0b050');
      if (Rl.showMade) lab.setState({ emo: t.st.ruler[0], title: t.st.ruler[1], lead: tr.madeOf, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
      else general('ruler');
    } else {
      ctrl += `<div class="row2"><button class="btn push" data-act="next">${esc(t.next)}</button></div>`;
      const g = Rl.g, ok = g === n;
      const msg = ok ? tr.right : g === rd.b ? tr.readEnd : g === n + 1 ? tr.marks : tr.wrong(n);
      lab.setReadout(`${n} ${t.cm}`, d, '', '#e0b050');
      lab.setState({ emo: ok ? '✅' : '🤔', title: msg, lead: `${n} ${t.cm}`, body: '', extra: '' });
    }
  }
  $('ctrlBody').innerHTML = ctrl + secChips(t);
}

function renderGuess(t) {
  const tg = t.g, it = GI[G.i], perm = G.perm[G.i], opt = G.done ? it.opts[G.pick] : null;
  lab.setGlow('rgba(217, 130, 95, .24)');
  const label = `${num(it.cm[0])} ${unitL(it.cm[1])}`;
  let ctrl = `<p class="note">${esc(tg.body)}</p><div class="qline"><span class="thing">${esc(cap(tg.things[it.k]))}</span> · ${esc(tg.q)}</div>`;
  ctrl += `<div class="opts2">${perm.map((j) => {
    const o = it.opts[j], cls = !G.done ? '' : j === 0 ? 'good' : j === G.pick ? 'bad' : 'off';
    return optHTML(`${num(o[0])} ${unitL(o[1])}`, cls, 'pick', j, G.done);
  }).join('')}</div>`;
  if (G.done) ctrl += `<div class="row2"><button class="btn push" data-act="next">${esc(t.next)}</button></div>`;
  $('ctrlBody').innerHTML = ctrl;
  lab.setReadout(G.done ? label : '?', G.n && !(G.i === 0 && !G.done && G.n >= GI.length) ? tg.score(G.k, G.n) : '', '', '#d9825f');
  if (!G.done) general('guess');
  else lab.setState({ emo: opt[2] === 'ok' ? '✅' : '🤔', title: opt[2] === 'ok' ? tg.right : opt[2] === 'unit' ? tg.unit : tg.wrong, lead: `${cap(tg.things[it.k])}: ${label}`, body: '', extra: '' });
}
render();
</script>
</body>
</html>
