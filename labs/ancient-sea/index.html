  return { fx: frameC[0] - fw / 2, fy: frameC[1] - fh / 2, fw, fh, s, ox, oy, P: (x, y) => [ox + x * s, oy + y * s], inv: (X, Y) => [(X - ox) / s, (Y - oy) / s] };
}

const WAVES = [[-8, 44.5], [2, 38.5], [5, 40.5], [6, 37.6], [8, 38.2], [11, 39.0], [12.8, 39.7], [14.8, 39.3], [17.5, 37.9], [19.6, 38.7], [21, 36.5], [25, 33.4], [28.5, 32.9], [31.5, 32.8],
  [33.5, 33.9], [30.5, 35.6], [27.5, 35.2], [17.0, 33.0], [13, 35.0], [8, 36.0], [4, 38], [35, 35.2], [15.4, 43.3], [16.6, 42.3], [34, 43.5], [38, 43], [31, 44.5], [24.6, 39.6], [-10, 34.5]].map(G);

function drawMap(c, L, t, o = {}) {
  const { s } = L, lw = (px) => px / s;
  // paper edge: a parchment band round the map, an antique double line
  c.save();
  c.shadowColor = 'rgba(0, 0, 0, .45)'; c.shadowBlur = 14; c.shadowOffsetY = 4;
  c.fillStyle = COL.parch; c.beginPath(); c.roundRect(L.fx - 10, L.fy - 10, L.fw + 20, L.fh + 20, 8); c.fill();
  c.restore();
  c.lineWidth = 2.5; c.strokeStyle = COL.coast; c.beginPath(); c.roundRect(L.fx - 10, L.fy - 10, L.fw + 20, L.fh + 20, 8); c.stroke();
  c.lineWidth = 0.9; c.beginPath(); c.roundRect(L.fx - 5.5, L.fy - 5.5, L.fw + 11, L.fh + 11, 3); c.stroke();
  c.fillStyle = COL.coast; for (const [px, py] of [[L.fx - 10, L.fy - 10], [L.fx + L.fw + 10, L.fy - 10], [L.fx - 10, L.fy + L.fh + 10], [L.fx + L.fw + 10, L.fy + L.fh + 10]]) { c.beginPath(); c.arc(px, py, 3.2, 0, 7); c.fill(); }

  c.save();
  c.beginPath(); c.rect(L.fx, L.fy, L.fw, L.fh); c.clip();
  c.translate(L.ox, L.oy); c.scale(s, s);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const landG = c.createLinearGradient(0, 0, MAP_W, MAP_H); landG.addColorStop(0, COL.parch); landG.addColorStop(1, COL.parch2);
  const seaG = c.createLinearGradient(0, 0, MAP_W * 0.6, MAP_H); seaG.addColorStop(0, COL.sea2); seaG.addColorStop(1, COL.sea);
  c.fillStyle = landG; c.fillRect(-300, -300, MAP_W + 600, MAP_H + 600);

  // seas, with a lighter shallow band along every shore
  const seas = [[SEA, true], [BLACK, true], [MARMARA, true], [SUEZ, true], [AQABA, true]];
  for (const [pts] of seas) {
    c.beginPath(); smooth(c, pts); c.fillStyle = seaG; c.fill();
    c.save(); c.clip(); c.strokeStyle = 'rgba(200, 235, 250, .32)'; c.lineWidth = lw(9); c.stroke(); c.strokeStyle = 'rgba(200, 235, 250, .28)'; c.lineWidth = lw(4); c.stroke(); c.restore();
  }
  c.strokeStyle = seaG; c.lineWidth = lw(clamp(s * 2.2, 2, 5)); for (const st of STRAITS) { c.beginPath(); smooth(c, st, false); c.stroke(); }
  // waves
  c.strokeStyle = 'rgba(255, 255, 255, .34)'; c.lineWidth = lw(1.3);
  for (const [i, [x, y]] of WAVES.entries()) {
    const k = 7 / s, dx = Math.sin(t * 0.6 + i) * 1.2 / s; c.beginPath(); c.moveTo(x - k + dx, y); c.quadraticCurveTo(x - k / 2 + dx, y - k * 0.6, x + dx, y); c.quadraticCurveTo(x + k / 2 + dx, y + k * 0.6, x + k + dx, y); c.stroke();
  }
  // islands
  const isl = [...LAND_ISL.map((i) => i.p), CRIMEA];
  for (const p of isl) { c.beginPath(); smooth(c, p); c.strokeStyle = 'rgba(200, 235, 250, .5)'; c.lineWidth = lw(6); c.stroke(); }
  for (const p of isl) { c.beginPath(); smooth(c, p); c.fillStyle = landG; c.fill(); c.strokeStyle = COL.coast; c.lineWidth = lw(1.2); c.stroke(); }
  // coastlines of the big seas
  c.strokeStyle = COL.coast; c.lineWidth = lw(1.6);
  for (const [pts] of seas) { c.beginPath(); smooth(c, pts); c.stroke(); }
  // hills as little chevrons
  c.strokeStyle = 'rgba(156, 122, 72, .72)'; c.lineWidth = lw(1.1);
  const step = Math.max(10 / s, 13 / s), hw = 3.6 / s, hh = 3.2 / s;
  c.beginPath();
  for (const line of HILLS) for (let i = 1; i < line.length; i++) {
    const [ax, ay] = line[i - 1], [bx, by] = line[i], len = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.round(len / step));
    for (let k = 0; k <= n; k++) { const x = ax + (bx - ax) * k / n + ((k * 7 + i) % 3 - 1) / s, y = ay + (by - ay) * k / n + ((k * 5 + i) % 3 - 1) / s;
      c.moveTo(x - hw, y + hh); c.lineTo(x, y - hh); c.lineTo(x + hw, y + hh);
      c.moveTo(x + 5 / s - hw * 0.7, y + 4 / s + hh * 0.7); c.lineTo(x + 5 / s, y + 4 / s - hh * 0.7); c.lineTo(x + 5 / s + hw * 0.7, y + 4 / s + hh * 0.7); }
  }
  c.stroke();
  // the Nile
  c.beginPath(); smooth(c, DELTA_FILL); c.fillStyle = 'rgba(156, 122, 72, .24)'; c.fill();
  c.strokeStyle = 'rgba(156, 122, 72, .24)'; c.lineWidth = lw(9); c.beginPath(); smooth(c, NILE, false); c.stroke();
  c.strokeStyle = COL.sea; c.lineWidth = lw(2.2); c.beginPath(); smooth(c, NILE, false); c.stroke();
  c.lineWidth = lw(1.5); for (const d of DELTA) { c.beginPath(); smooth(c, d, false); c.stroke(); }

  // found countries glow in gold, a wrong tap flashes red
  for (const [key, g] of Object.entries(o.glow || {})) {
    if (g <= 0.01) continue;
    const pulse = 0.85 + 0.15 * Math.sin(t * 3);
    for (const p of GLOW[key]) {
      c.save(); c.beginPath(); smooth(c, p); c.fillStyle = `rgba(255, 201, 74, ${0.24 * g * pulse})`; c.fill();
      c.shadowColor = COL.gold; c.shadowBlur = 16 * g; c.strokeStyle = COL.gold; c.lineWidth = lw(2.8 * g + 0.4); c.stroke(); c.stroke(); c.restore();
    }
  }
  if (o.flash && o.flash.f > 0) {
    const { f, key, at } = o.flash;
    if (key && GLOW[key]) for (const p of GLOW[key]) { c.beginPath(); smooth(c, p); c.fillStyle = `rgba(229, 72, 77, ${0.42 * f})`; c.fill(); c.strokeStyle = `rgba(229, 72, 77, ${f})`; c.lineWidth = lw(2.4); c.stroke(); }
    else if (at) { const r = (16 + (1 - f) * 18) / s; c.beginPath(); c.arc(at[0], at[1], r, 0, 7); c.fillStyle = `rgba(229, 72, 77, ${0.35 * f})`; c.fill(); c.strokeStyle = `rgba(229, 72, 77, ${f})`; c.lineWidth = lw(2); c.stroke(); }
  }
  o.under?.(c, L, t);
  c.restore();

  // aged-paper shading over the map, and the graduated edge
  c.save(); c.beginPath(); c.rect(L.fx, L.fy, L.fw, L.fh); c.clip();
  const cx0 = L.fx + L.fw / 2, cy0 = L.fy + L.fh / 2, vg = c.createRadialGradient(cx0, cy0, Math.min(L.fw, L.fh) * 0.35, cx0, cy0, Math.hypot(L.fw, L.fh) * 0.55);
  vg.addColorStop(0, 'rgba(110, 70, 20, 0)'); vg.addColorStop(1, 'rgba(110, 70, 20, .24)'); c.fillStyle = vg; c.fillRect(L.fx, L.fy, L.fw, L.fh);
  c.restore();
  c.lineWidth = 1.6; c.strokeStyle = COL.coast; c.strokeRect(L.fx, L.fy, L.fw, L.fh);
  // checker band: one square per 5 degrees
  c.save(); c.beginPath(); c.rect(L.fx - 5, L.fy - 5, L.fw + 10, L.fh + 10); c.clip();
  c.fillStyle = COL.coast;
  for (let lo = -10, k = 0; lo < 40; lo += 5, k++) { const [x] = L.P(...G([lo, 0])), [x2] = L.P(...G([lo + 5, 0])); if (k % 2 === 0) { c.fillRect(x, L.fy - 4.5, x2 - x, 3); c.fillRect(x, L.fy + L.fh + 1.5, x2 - x, 3); } }
  c.restore();
  if (!o.noRose) rose(c, L);
}
function rose(c, L) { // compass rose over the desert corner
  const [X, Y] = L.P(...G([-4.0, 31.2])), R = clamp(L.s * 95, 16, 44);
  if (X < L.fx || X > L.fx + L.fw || Y < L.fy || Y > L.fy + L.fh) return;
  c.save(); c.translate(X, Y); c.globalAlpha = 0.92; c.lineJoin = 'round';
  c.strokeStyle = COL.coast; c.lineWidth = 1; c.beginPath(); c.arc(0, 0, R * 0.62, 0, 7); c.stroke(); c.beginPath(); c.arc(0, 0, R * 0.7, 0, 7); c.stroke();
  const star = (len, wd, rot, dark, light) => { for (const half of [0, 1]) { c.save(); c.rotate(rot); c.beginPath(); c.moveTo(0, -len); c.lineTo(wd * (half ? -1 : 1), 0); c.lineTo(0, 0); c.closePath(); c.fillStyle = half ? light : dark; c.fill(); c.lineWidth = 0.8; c.strokeStyle = COL.coast; c.stroke(); c.restore(); } };
  for (let i = 0; i < 4; i++) star(R * 0.55, R * 0.12, Math.PI / 4 + i * Math.PI / 2, COL.coast, COL.parch);
  for (let i = 0; i < 4; i++) star(R, R * 0.17, i * Math.PI / 2, i === 0 ? COL.terra : COL.wood, COL.cream);
  c.beginPath(); c.arc(0, 0, R * 0.08, 0, 7); c.fillStyle = COL.coast; c.fill();
  c.font = `600 ${Math.max(12, R * 0.4)}px EB Garamond, Georgia, serif`; c.fillStyle = COL.ink; c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillText(({ en: 'N', ru: 'С', hu: 'É' })[lang] || 'N', 0, -R - 1);
  c.restore();
}

// --- things that live on the map: amphora, ship, ox-cart, mountains, coins ------------------------------------
// the amphora: origin at the centre of the body, h = total height, tip pointing down
function amphora(c, x, y, h, { rot = 0, tone = 0, detail = h > 46 } = {}) {
  c.save(); c.globalAlpha = 1; c.translate(x, y); c.rotate(rot); c.lineJoin = 'round'; c.lineCap = 'round';
  const body = () => {
    c.beginPath(); c.moveTo(-.075 * h, -.5 * h); c.lineTo(-.07 * h, -.4 * h); c.quadraticCurveTo(-.25 * h, -.33 * h, -.235 * h, -.08 * h); c.quadraticCurveTo(-.22 * h, .25 * h, 0, .5 * h);
    c.quadraticCurveTo(.22 * h, .25 * h, .235 * h, -.08 * h); c.quadraticCurveTo(.25 * h, -.33 * h, .07 * h, -.4 * h); c.lineTo(.075 * h, -.5 * h); c.closePath();
  };
  // handles
  c.strokeStyle = '#8E3F1F'; c.lineWidth = Math.max(1.4, .05 * h);
  for (const sg of [-1, 1]) { c.beginPath(); c.moveTo(sg * .07 * h, -.45 * h); c.bezierCurveTo(sg * .24 * h, -.52 * h, sg * .29 * h, -.34 * h, sg * .21 * h, -.27 * h); c.stroke(); }
  const g = c.createLinearGradient(-.24 * h, 0, .24 * h, 0);
  g.addColorStop(0, tone ? '#D98458' : '#E8946A'); g.addColorStop(.45, COL.terra); g.addColorStop(1, '#8E3F1F');
  body(); c.fillStyle = g; c.fill();
  c.save(); body(); c.clip();
  c.fillStyle = 'rgba(40, 18, 8, .72)';
  c.fillRect(-.3 * h, -.3 * h, .6 * h, .035 * h); c.fillRect(-.3 * h, .02 * h, .6 * h, .035 * h);
  if (detail) { // a zig-zag band, little dots on the shoulder and a pale shine
    c.strokeStyle = 'rgba(40, 18, 8, .72)'; c.lineWidth = Math.max(1, .016 * h); c.beginPath();
    for (let i = -6; i < 6; i++) { c.moveTo(i * .045 * h, -.17 * h); c.lineTo((i + .5) * .045 * h, -.08 * h); c.lineTo((i + 1) * .045 * h, -.17 * h); }
    c.stroke();
    c.fillStyle = 'rgba(40, 18, 8, .6)'; for (let i = -3; i <= 3; i++) { c.beginPath(); c.arc(i * .06 * h, -.24 * h, .012 * h, 0, 7); c.fill(); }
    c.fillStyle = 'rgba(255, 235, 200, .28)'; c.beginPath(); c.ellipse(-.12 * h, -.06 * h, .03 * h, .16 * h, .1, 0, 7); c.fill();
  }
  c.restore();
  body(); c.lineWidth = Math.max(1, .018 * h); c.strokeStyle = '#5A2812'; c.stroke();
  c.beginPath(); c.ellipse(0, -.5 * h, .09 * h, .028 * h, 0, 0, 7); c.fillStyle = '#E8946A'; c.fill(); c.stroke(); // the rim
  c.restore();
}

function ship(c, x, y, sc, t, wake = true) { // side view, bow to the right, origin on the waterline
  c.save(); c.globalAlpha = 1; c.translate(x, y + Math.sin(t * 2.4) * 1.2 * sc); c.rotate(Math.sin(t * 1.9) * 0.03); c.scale(sc, sc); c.lineJoin = 'round'; c.lineCap = 'round';
  c.fillStyle = 'rgba(10, 40, 70, .35)'; c.beginPath(); c.ellipse(0, 4, 28, 3.2, 0, 0, 7); c.fill();
  if (wake) { c.strokeStyle = 'rgba(255, 255, 255, .6)'; c.lineWidth = 1.4; for (const k of [0, 1]) { c.beginPath(); c.moveTo(-26 - k * 7, 2 + k * 2); c.quadraticCurveTo(-34 - k * 7, 3 + k * 2, -40 - k * 9, 1 + k * 2); c.stroke(); } }
  // amphorae in a row on the deck (behind the rail)
  for (let i = 0; i < 6; i++) amphora(c, -15 + i * 5.6, -9, 10, { tone: i % 2 });
  // hull
  const hg = c.createLinearGradient(0, -10, 0, 4); hg.addColorStop(0, '#B07A42'); hg.addColorStop(.5, COL.wood); hg.addColorStop(1, '#5E3C1B');
  c.beginPath(); c.moveTo(-23, -10); c.quadraticCurveTo(-25, 1, -14, 4); c.lineTo(14, 4); c.quadraticCurveTo(26, 2, 29, -12); c.quadraticCurveTo(24, -6, 17, -6); c.lineTo(-17, -6); c.quadraticCurveTo(-21, -7, -23, -10); c.closePath();
  c.fillStyle = hg; c.fill(); c.lineWidth = 1.2; c.strokeStyle = '#3F2610'; c.stroke();
  c.strokeStyle = 'rgba(40, 20, 8, .45)'; c.lineWidth = .8; c.beginPath(); c.moveTo(-18, -1.5); c.lineTo(20, -1.5); c.stroke();
  c.fillStyle = COL.terra; c.fillRect(-19, -6.4, 38, 1.6); // painted stripe under the rail
  c.fillStyle = '#fff'; c.beginPath(); c.arc(21, -3.4, 1.9, 0, 7); c.fill(); c.fillStyle = '#222'; c.beginPath(); c.arc(21.5, -3.4, 0.9, 0, 7); c.fill(); // the painted eye
  // steering oar
  c.strokeStyle = '#5E3C1B'; c.lineWidth = 1.8; c.beginPath(); c.moveTo(-21, -9); c.lineTo(-27, 5); c.stroke();
  // mast, yard and sail
  c.strokeStyle = '#5E3C1B'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -6); c.lineTo(0, -44); c.stroke();
  c.lineWidth = 1.8; c.beginPath(); c.moveTo(-16, -39); c.lineTo(16, -39); c.stroke();
  const sw = Math.sin(t * 1.6) * 1.2;
  c.beginPath(); c.moveTo(-15, -38); c.lineTo(15, -38); c.quadraticCurveTo(20 + sw, -26, 15, -15); c.quadraticCurveTo(0, -11 + sw, -15, -15); c.quadraticCurveTo(-20 - sw, -26, -15, -38); c.closePath();
  const sg = c.createLinearGradient(-15, -38, 15, -15); sg.addColorStop(0, '#FFF6DC'); sg.addColorStop(1, '#E4D0A0');
  c.fillStyle = sg; c.fill();
  c.save(); c.clip(); c.fillStyle = '#B7412C'; c.fillRect(-22, -30, 44, 5); c.restore();
  c.lineWidth = 1; c.strokeStyle = '#8A6A3A'; c.stroke();
  c.fillStyle = COL.terra; c.beginPath(); c.moveTo(0, -44); c.lineTo(10 + sw, -42); c.lineTo(0, -40); c.closePath(); c.fill();
  c.restore();
}

function cart(c, x, y, sc, t, moving = true) { // ox-cart: two oxen ahead of a wooden cart, facing right
  c.save(); c.globalAlpha = 1; c.translate(x, y); c.scale(sc, sc); c.lineJoin = 'round'; c.lineCap = 'round';
  const ph = moving ? t * 5 : 0;
  c.fillStyle = 'rgba(40, 25, 8, .3)'; c.beginPath(); c.ellipse(0, 3, 38, 3.5, 0, 0, 7); c.fill();
  const ox = (ox0, oy0, col, dark, off) => {
    c.save(); c.translate(ox0, oy0);
    c.fillStyle = dark; for (const [lx, ph2] of [[-8, 0], [6, 1.6]]) { const sw = moving ? Math.sin(ph + ph2 + off) * 2.2 : 0; c.beginPath(); c.roundRect(lx + sw - 1.5, -8, 3, 9, 1.2); c.fill(); }
    const bg = c.createLinearGradient(0, -20, 0, -6); bg.addColorStop(0, col); bg.addColorStop(1, dark);
    c.beginPath(); c.ellipse(0, -13, 12, 7, 0, 0, 7); c.fillStyle = bg; c.fill(); c.lineWidth = 1; c.strokeStyle = '#3F2610'; c.stroke();
    c.beginPath(); c.ellipse(13, -17, 5.2, 4, -.3, 0, 7); c.fill(); c.stroke(); // head
    c.fillStyle = '#F6EBCB'; c.beginPath(); c.moveTo(11, -20); c.quadraticCurveTo(9, -26, 13, -26); c.quadraticCurveTo(11, -23, 13.5, -20); c.fill(); // horn
    c.fillStyle = '#fff'; c.beginPath(); c.arc(15, -18, 1.2, 0, 7); c.fill(); c.fillStyle = '#222'; c.beginPath(); c.arc(15.4, -18, .6, 0, 7); c.fill();
    c.strokeStyle = dark; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-12, -15); c.quadraticCurveTo(-17, -12, -15, -7); c.stroke(); // tail
    c.restore();
  };
  ox(22, -2, '#6E4521', '#4B2D12', 1); ox(25, 1, '#9A6A38', COL.wood, 0);
  c.strokeStyle = '#5E3C1B'; c.lineWidth = 1.8; c.beginPath(); c.moveTo(-2, -10); c.lineTo(30, -17); c.stroke(); // pole and yoke
  // the cart
  const cg = c.createLinearGradient(0, -22, 0, -6); cg.addColorStop(0, '#B07A42'); cg.addColorStop(1, COL.wood);
  c.beginPath(); c.moveTo(-33, -22); c.lineTo(-2, -22); c.lineTo(-5, -9); c.lineTo(-30, -9); c.closePath(); c.fillStyle = cg; c.fill(); c.lineWidth = 1.1; c.strokeStyle = '#3F2610'; c.stroke();
  c.strokeStyle = 'rgba(40, 20, 8, .45)'; c.lineWidth = .8; c.beginPath(); c.moveTo(-32, -16); c.lineTo(-3.5, -16); c.stroke();
  for (let i = 0; i < 3; i++) amphora(c, -25 + i * 9, -25, 11, { tone: i % 2 });
  const wr = ph * 0.9; // wheel
  c.beginPath(); c.arc(-17, -7, 8, 0, 7); c.fillStyle = '#C69A62'; c.fill(); c.lineWidth = 1.6; c.strokeStyle = '#5E3C1B'; c.stroke();
  c.lineWidth = 1.1; c.beginPath(); for (let i = 0; i < 4; i++) { const a = wr + i * Math.PI / 4; c.moveTo(-17 + Math.cos(a) * 7, -7 + Math.sin(a) * 7); c.lineTo(-17 - Math.cos(a) * 7, -7 - Math.sin(a) * 7); } c.stroke();
  c.beginPath(); c.arc(-17, -7, 1.7, 0, 7); c.fillStyle = '#5E3C1B'; c.fill();
  c.restore();
}

function peak(c, x, y, h) { // a mountain with a snowy tip, light from the top-left; (x, y) is the foot centre
  const w = h * 0.85;
  c.save(); c.globalAlpha = 1; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(x - w, y); c.lineTo(x, y - h); c.lineTo(x, y); c.closePath(); c.fillStyle = '#B58C55'; c.fill();
  c.beginPath(); c.moveTo(x, y - h); c.lineTo(x + w, y); c.lineTo(x, y); c.closePath(); c.fillStyle = '#8A6538'; c.fill();
  c.beginPath(); c.moveTo(x - w, y); c.lineTo(x, y - h); c.lineTo(x + w, y); c.closePath(); c.lineWidth = 1; c.strokeStyle = '#5E3C1B'; c.stroke();
  const k = 0.3; c.beginPath(); c.moveTo(x - w * k, y - h * (1 - k)); c.lineTo(x, y - h); c.lineTo(x + w * k, y - h * (1 - k)); c.lineTo(x + w * k * 0.35, y - h * (1 - k) + h * 0.1); c.lineTo(x - w * k * 0.1, y - h * (1 - k) - h * 0.02); c.lineTo(x - w * k * 0.55, y - h * (1 - k) + h * 0.09); c.closePath();
  c.fillStyle = '#fff'; c.fill(); c.stroke();
  c.restore();
}
function coins(c, x, y, n, sc = 1) { // a stack of gold coins
  for (let i = 0; i < n; i++) {
    const cy = y - i * 3.2 * sc;
    c.save(); c.globalAlpha = 1; c.beginPath(); c.ellipse(x, cy, 8 * sc, 3.6 * sc, 0, 0, 7); c.fillStyle = '#E0A425'; c.fill(); c.lineWidth = 1; c.strokeStyle = '#8A5A2B'; c.stroke();
    c.beginPath(); c.ellipse(x, cy - 1.6 * sc, 8 * sc, 3.6 * sc, 0, 0, 7); c.fillStyle = COL.gold; c.fill(); c.stroke(); c.restore();
  }
}
const emojiDisc = (c, e, x, y, r, s) => { // an emoji on a round parchment disc (drawn in design coordinates, r in design units)
  c.save(); c.globalAlpha = 1; c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = 'rgba(246, 235, 203, .94)'; c.fill(); c.lineWidth = 1 / s; c.strokeStyle = COL.coast; c.stroke();
  c.font = `${r * 1.35}px serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000'; c.fillText(e, x, y + r * 0.08); c.restore();
};

const TL_MAX = 5100; // years from 3000 BCE

}

const cardVisible = () => (lab.view === 'map' ? S.m.phase !== 'done' : true);
let LL = null; // the last map layout, for taps

// --- what lives on the map ------------------------------------------------------------------------------------
function mapUnder(c, L, t) {
  const s = L.s, v = lab.view, lw = (px) => px / s;
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (v === 'race' && S.r.phase !== 'trade') {
    c.setLineDash([7 / s, 6 / s]); c.lineWidth = lw(2.6);
    c.strokeStyle = 'rgba(246, 235, 203, .95)'; c.beginPath(); smooth(c, SHIP_ROUTE, false); c.stroke();
    c.strokeStyle = COL.ink; c.beginPath(); smooth(c, CART_ROUTE, false); c.stroke(); c.setLineDash([]);
    for (const [x, y] of PEAKS) peak(c, x, y + 7 / s, 26 / s);
    // the town at the end of the road: three little houses
    const [tx, ty] = CITY.town;
    for (const [dx, dy, k] of [[-9, 3, 1], [0, -3, 1.25], [9, 3, 1]]) {
      const hx = tx + dx / s, hy = ty + dy / s, u = 7 * k / s;
      c.fillStyle = COL.cream; c.fillRect(hx - u * .7, hy - u * .6, u * 1.4, u * 1.2); c.lineWidth = lw(1); c.strokeStyle = COL.ink; c.strokeRect(hx - u * .7, hy - u * .6, u * 1.4, u * 1.2);
      c.beginPath(); c.moveTo(hx - u * .9, hy - u * .6); c.lineTo(hx, hy - u * 1.4); c.lineTo(hx + u * .9, hy - u * .6); c.closePath(); c.fillStyle = COL.terra; c.fill(); c.stroke();
    }
    cityDot(c, CITY.athens[0], CITY.athens[1], s, t, false);
    const R = S.r, d = R.t0 >= 0 ? (t - R.t0) * 5 : 0, run = R.t0 >= 0;
    const fS = run ? clamp01(d / 6) : 0, fC = run ? clamp01(d / 30) : 0;
    const drawV = (route, f, fn, k) => {
      const p = atRoute(route, f), dir = route === R_SHIP && f < 0.4 ? 1 : -1; // one flip: the ship first sails east round Euboea, then west into the gulf
      c.save(); c.translate(p.x, p.y); c.scale(dir * k / s, k / s); fn(c); c.restore(); return p;
    };
    // the cart first (it is on land), then the ship
    drawV(R_CART, fC, (cc) => cart(cc, 0, 0, 1, t, run && fC < 1), 0.72);
    drawV(R_SHIP, fS, (cc) => ship(cc, 0, 0, 1, t, run && fS < 1), 0.8);
  } else if (v === 'race') { // trade lanes
    const lanes = [[R_ATH, ['🫒', '🍷', '🫒', '🍷'], 'rgba(255, 220, 160, .95)'], [R_ALEX, ['🌾', '🌾', '🌾'], 'rgba(255, 255, 255, .9)']];
    c.setLineDash([6 / s, 6 / s]); c.lineWidth = lw(2.2); c.lineDashOffset = -t * 14 / s;
    for (const [r, , col] of lanes) { c.strokeStyle = col; c.beginPath(); r.p.forEach(([px, py], i) => (i ? c.lineTo(px, py) : c.moveTo(px, py))); c.stroke(); }
    c.setLineDash([]);
    for (const [r, icons] of lanes) icons.forEach((e, i) => { const f = (t * 0.07 + i / icons.length) % 1, p = atRoute(r, f); emojiDisc(c, e, p.x, p.y + Math.sin(t * 3 + i) * 1.2 / s, 10 / s, s); });
    for (const k of ['athens', 'rome', 'alex']) cityDot(c, CITY[k][0], CITY[k][1], s, t, S.r.sel === k);
  } else if (v === 'map' && S.m.round >= 3) {
    cityDot(c, CITY.rome[0], CITY.rome[1], s, t, !S.m.found[3] && S.m.round === 3); cityDot(c, CITY.athens[0], CITY.athens[1], s, t, !S.m.found[4] && S.m.round === 4);
  }
}

// --- drawing ---------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view, M = S.m, R = S.r, TL = S.t, tn = nowS();
  S.tp += ((S.sec || !cardVisible() ? 0 : askEl.offsetHeight + 22) - S.tp) * Math.min(1, dt * 8);
  // the "Next" buttons wait until the reveal has played
  if (M.ans !== null && !M.ready && tn - M.t0 > 2.4) { M.ready = true; render(); }
  if (R.t0 >= 0 && !R.ready && tn - R.t0 > 7) { R.ready = true; render(); }
  if (TL.t0 >= 0 && !TL.ready && tn - TL.t0 > 3.8) { TL.ready = true; render(); }
  if (R.t0 >= 0 && R.phase === 'run') readout();
  if (S.sec === 'amphora') { drawAmphoraScene(c, w, h, tn, S); return; }
  if (S.sec === 'olympics') { drawOlympics(c, w, h, tn, S); return; }
  if (v === 'time') { drawTimeline(c, w, h, tn, S, S.tp); return; }

  const zT = v === 'race' && R.phase !== 'trade' ? 1 : 0;
  S.z += (zT - S.z) * Math.min(1, dt * 3.5); if (Math.abs(zT - S.z) < 0.003) S.z = zT;
  const L = LL = layout(w, h, S.tp, S.z);
  const gt = { italy: 0, greece: 0, egypt: 0 };
  if (v === 'map') {
    if (M.phase === 'v') { if (tn - M.t0 > 2.0) gt.italy = gt.greece = 1; }
    else if (M.phase === 'find' || M.phase === 'done') { gt.italy = M.found[0] ? 1 : 0; gt.greece = M.found[1] ? 1 : 0; gt.egypt = M.found[2] ? 1 : 0; }
  }
  for (const k of Object.keys(S.g)) S.g[k] += clamp(gt[k] - S.g[k], -dt * 2, dt * 2);
  const fl = M.flash, ff = fl ? clamp01(1 - (tn - fl.t0) / 1.3) : 0;
  drawMap(c, L, time, { glow: S.g, flash: fl && v === 'map' ? { f: ff, key: fl.key, at: fl.at } : null, under: mapUnder, noRose: S.z > 0.4 });

  // labels in screen space
  const P = (pt) => L.P(pt[0], pt[1]), tm = T[lang].m, o = { w, h };
  if (v !== 'race' && M.ans !== null) { // the sea writes its own name
    const p = clamp01((tn - M.t0) / 1.8);
    const a = L.P(...G([11.4, 34.6])), cc = L.P(...G([19.5, 32.6])), b = L.P(...G([28.0, 33.8]));
    curveText(c, tm.sea, a, cc, b, p, Math.max(14, L.s * 62));
  }
  if (v === 'map') {
    for (let i = 0; i < 5; i++) {
      if (!M.found[i]) continue;
      if (i < 3) { const [X, Y] = P(labelPos[PLACE_KEY[i]]); pill(c, tm.places[i], X, Y, { size: 14, ...o }); }
      else { const [X, Y] = P(CITY[PLACE_KEY[i]]); pill(c, tm.places[i], X + 8, Y - 16, { size: 13, align: 'left', ...o }); }
    }
    if (fl && ff > 0) { const [X, Y] = P(fl.at); pill(c, fl.name, X, Y - 26, { size: 14, bg: 'rgba(255, 232, 226, .96)', stroke: '#E5484D', fg: '#8A1F1F', ...o }); }
  }
  if (v === 'race' && R.phase !== 'trade') {
    const [ax, ay] = P(CITY.athens); pill(c, tm.places[4], ax - 12, ay + 6, { size: 13, align: 'right', ...o });
    const d = R.t0 >= 0 ? (tn - R.t0) * 5 : 0;
    if (R.t0 >= 0) {
      const ps = atRoute(R_SHIP, clamp01(d / 6)), pc = atRoute(R_CART, clamp01(d / 30)), [sx, sy] = P([ps.x, ps.y]), [cx, cy] = P([pc.x, pc.y]);
      pill(c, T[lang].r.day(Math.min(6, Math.floor(d))), sx, sy - 52, { size: 13, fg: '#fff', bg: 'rgba(30, 90, 140, .92)', stroke: '#fff', font: 'Nunito, sans-serif', weight: 800, ...o });
      pill(c, T[lang].r.day(Math.min(30, Math.floor(d))), cx, cy - 46, { size: 13, fg: '#fff', bg: 'rgba(138, 90, 43, .95)', stroke: '#fff', font: 'Nunito, sans-serif', weight: 800, ...o });
      if (d >= 30) { // the ship brought far more: coin stacks at the town
        const k = ease((d - 30) / 6), [tx, ty] = P(CITY.town);
        coins(c, tx + 44, ty + 34, Math.round(12 * k), 1); coins(c, tx + 78, ty + 34, Math.round(3 * k), 1);
        c.save(); c.globalAlpha = 1; c.font = '20px serif'; c.textAlign = 'center'; c.fillStyle = '#000'; c.fillText('⛵', tx + 44, ty + 56); c.fillText('🐂', tx + 78, ty + 56); c.restore();
      }
    }
  }
  if (v === 'race' && R.phase === 'trade') {
    for (const [k, name] of [['athens', tm.places[4]], ['rome', tm.places[3]], ['alex', T[lang].r.alex]]) { const [X, Y] = P(CITY[k]); pill(c, name, X + 8, Y - 15, { size: 13, align: 'left', ...o }); }
  }
});

// --- taps ------------------------------------------------------------------------------------------------------
const nameOf = (key) => { const m = T[lang].m; const i = PLACE_KEY.indexOf(key); return i >= 0 ? m.places[i] : m.land[key]; };
function regionAt(x, y) { // which land (or sea) is under a design point; null = open water
  for (const isl of LAND_ISL) if (inPoly(isl.p, x, y)) return isl.k === 'malta' ? null : isl.k;
  if (inPoly(CRIMEA, x, y)) return null;
  for (const p of [BLACK, MARMARA, SUEZ, AQABA, SEA]) if (inPoly(p, x, y)) return null;
  for (const k of Object.keys(REGION)) if (inPoly(REGION[k], x, y)) return k;
  let best = null, bd = 1e9;
  for (const [k, ax, ay] of ANCHORS) { const d = Math.hypot(ax - x, ay - y); if (d < bd) { bd = d; best = k; } }
  return best;
}
function mapTap(X, Y) {
  const M = S.m, L = LL;
  if (M.phase !== 'find' || M.lock || !L) return;
  if (X < L.fx || X > L.fx + L.fw || Y < L.fy || Y > L.fy + L.fh) return;
  const [x, y] = L.inv(X, Y);
  let key = null, at = [x, y];
  if (M.round >= 3) for (const k of ['rome', 'athens']) { const [cx, cy] = L.P(...CITY[k]); if (Math.hypot(X - cx, Y - cy) <= 22) { key = k; at = CITY[k]; } }
  if (!key) key = regionAt(x, y);
  if (!key) { sfx.tick(); return; }
  const tn = nowS();
  if (key === PLACE_KEY[M.round]) {
    M.found[M.round] = true; M.msg = ''; M.flash = null; M.lock = true; sfx.good();
    setTimeout(() => { M.round++; M.lock = false; if (M.round >= 5) M.phase = 'done'; render(); }, 1200);
  } else {
    M.flash = { t0: tn, key: GLOW[key] ? key : null, at, name: nameOf(key) }; M.msg = T[lang].m.notThis(nameOf(key)); sfx.bad();
  }
  render();
}
function raceTap(X, Y) {
  if (S.r.phase !== 'trade' || !LL) return;
  for (const k of ['athens', 'rome', 'alex']) { const [cx, cy] = LL.P(...CITY[k]); if (Math.hypot(X - cx, Y - cy) <= 22) { S.r.sel = k; sfx.click(); render(); return; } }
}
function timeTap(X, Y) {
  const TL = S.t; if (TL.t0 < 0) return;
  const r = $('cv').getBoundingClientRect(), g = tlGeom(r.width, r.height, S.tp), tn = nowS();
  for (let i = EVENTS.length - 1; i >= 0; i--) {
    if (tn - TL.t0 < i * 0.5 + 0.7) continue;
    const p = cardPos(g, EVENTS[i]);
    if (Math.abs(X - p.x) <= g.cardW / 2 + 4 && Y >= p.y - 4 && Y <= p.y + g.cardH + 4) { TL.sel = i; sfx.tick(); render(); return; }
  }
}
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), X = ev.clientX - r.left, Y = ev.clientY - r.top, v = lab.view;
  if (S.sec === 'amphora') {
    if (S.am.length >= HOLD_N) S.am = []; else { S.am.push({ i: S.am.length, t0: nowS() }); }
    sfx.click(); render();
  } else if (S.sec === 'olympics') {
    if (S.oly.t0 < 0 || S.oly.done) { S.oly = { t0: nowS(), order: [0, 1, 2].sort(() => Math.random() - 0.5), done: false }; sfx.snap(); }
  } else if (v === 'map') mapTap(X, Y);
  else if (v === 'race') raceTap(X, Y);
  else timeTap(X, Y);
});

// --- cards and controls ----------------------------------------------------------------------------------------
const showStage = () => { // on a phone the controls sit below the canvas: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const verdictHtml = (ok, text, ready) => `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? T[lang].right : T[lang].wrong)}</div><p>${esc(text)}</p>${ready ? `<div class="opts"><button class="go" data-next>${esc(T[lang].next)}</button></div>` : ''}`;
const quizHtml = (q, opts) => `<div class="q">${esc(q)}</div><div class="opts">${opts.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`;
const taskHtml = (a, b, extra = '') => `<div class="task">${esc(a)}</div>${b ? `<div class="hint">${esc(b)}</div>` : ''}${extra}`;
const GOODS = { athens: [['🫒', 'oil'], ['🍷', 'wine']], alex: [['🌾', 'grain']], rome: [['🫒', 'oil'], ['🍷', 'wine'], ['🌾', 'grain']] };

askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const v = lab.view, tn = nowS();
  if (b.dataset.a !== undefined) {
    const i = +b.dataset.a, ok = i === 0;
    if (v === 'map') { Object.assign(S.m, { ans: i, t0: tn, phase: 'v', ready: false }); }
    else if (v === 'race') { Object.assign(S.r, { ans: i, t0: tn, phase: 'run', ready: false }); }
    else Object.assign(S.t, { ans: i, t0: tn, ready: false });
    (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (b.dataset.next !== undefined) {
    sfx.click();
    if (v === 'map') { S.m.phase = 'find'; S.m.round = 0; S.m.msg = ''; }
    else if (v === 'race') { S.r.phase = 'trade'; S.r.sel = null; }
    else S.t.free = true;
  }
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('.chip'); if (!b) return;
  const k = b.dataset.k;
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === k ? null : k;
  S.am = []; S.oly = { t0: -1, order: [0, 1, 2], done: true };
  sfx.click(); render(); if (S.sec) showStage();
});

let rkey = '';
function readout() {
  const v = lab.view, t = T[lang];
  let val = '?', sub = '', col = '#FFC94A';
  if (S.sec === 'amphora') { val = `${S.am.length}/${HOLD_N}`; sub = '🏺'; col = '#C8643B'; }
  else if (S.sec === 'olympics') { val = '192 m'; col = '#C8643B'; }
  else if (v === 'map') { val = S.m.phase === 'find' || S.m.phase === 'done' ? `${S.m.found.filter(Boolean).length}/5` : '?'; }
  else if (v === 'race') {
    col = '#5FA8D3';
    if (S.r.phase === 'run') val = t.r.day(Math.min(30, Math.floor((nowS() - S.r.t0) * 5)));
    else if (S.r.phase === 'trade') val = '🫒 🍷 🌾';
  } else { col = '#C8643B'; if (S.t.ans !== null) { val = '≈ 2000'; sub = t.t.gap; } }
  const key = val + sub + col; if (key === rkey) return; rkey = key;
  lab.setReadout(val, sub, '', col);
}

function render() {
  const v = lab.view, t = T[lang], M = S.m, R = S.r, TL = S.t, open = secret.unlocked();
  // the two secret chips live in the map view
  $('ctrlBody').style.display = v === 'map' ? '' : 'none';
  const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = chip('amphora', '🏺') + chip('olympics', '🏟️');
  // the question / verdict / task card over the picture
  let html = '', small = false, big = false;
  if (v === 'map') {
    if (M.phase === 'q') { html = quizHtml(t.m.q1, t.m.o1); big = true; }
    else if (M.phase === 'v') { html = verdictHtml(M.ans === 0, t.m.r1, M.ready); big = true; }
    else if (M.phase === 'find') { small = true; html = taskHtml(t.m.find(t.m.places[M.round]), t.m.hints[M.round], M.msg ? `<div class="hint" style="color:var(--wip);font-weight:800">${esc(M.msg)}</div>` : ''); }
  } else if (v === 'race') {
    if (R.phase === 'ask') { html = quizHtml(t.r.q, t.r.o); big = true; }
    else if (R.phase === 'run') { html = verdictHtml(R.ans === 0, t.r.r, R.ready); big = true; }
    else {
      small = true;
      const sel = R.sel, name = sel === 'alex' ? t.r.alex : sel === 'rome' ? t.m.places[3] : t.m.places[4];
      html = sel ? taskHtml(name, '', `<div class="goods">${GOODS[sel].map(([e, g]) => `<span>${e} ${esc(t.r.goods[g])}</span>`).join('')}</div>`) : taskHtml(t.r.tapCity, '');
    }
  } else {
    if (TL.ans === null) { html = quizHtml(t.t.q, t.t.o); big = true; }
    else if (!TL.free) { html = verdictHtml(TL.ans === 0, t.t.r, TL.ready); big = true; }
    else { small = true; html = TL.sel >= 0 ? taskHtml(t.t.ev[TL.sel], t.t.facts[TL.sel]) : taskHtml(t.t.tap, ''); }
  }
  askEl.innerHTML = html; askEl.style.display = S.sec || !html ? 'none' : ''; askEl.classList.toggle('small', small);
  document.body.dataset.v = S.sec ? 'sec' : v + (big ? '-big' : '');
  // readout glow and the state card
  lab.setGlow(v === 'map' ? 'rgba(255, 201, 74, .2)' : v === 'race' ? 'rgba(95, 168, 211, .3)' : 'rgba(200, 100, 59, .24)');
  rkey = ''; readout();
  if (S.sec) { const k = S.sec; lab.setState({ emo: k === 'amphora' ? '🏺' : '🏟️', title: t.secrets[k][0], lead: t.secrets[k][1], body: t.sec[`${k}Text`], extra: '' }); return; }
  const full = v === 'map' ? M.phase === 'done' : v === 'race' ? R.ans !== null : TL.ans !== null;
  const [emo, title, lead, body] = t.st[v][full ? 1 : 0];
  lab.setState({ emo, title, lead, body, extra: v === 'race' ? `<div class="fine">${esc(t.fine)}</div>` : '' });
}
render();
</script>
</body>
</html>
