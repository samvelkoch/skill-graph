  c.beginPath(); c.moveTo(0, 16); c.bezierCurveTo(-30, -4, -18, -26, 0, -10); c.bezierCurveTo(18, -26, 30, -4, 0, 16); c.closePath();
  const g = c.createLinearGradient(-20, -20, 20, 16); g.addColorStop(0, '#ff8794'); g.addColorStop(1, col);
  c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(120,20,40,.7)'; c.lineWidth = 1.4; c.stroke();
  c.beginPath(); c.ellipse(-8, -8, 4.5, 2.6, -0.6, 0, TAU); c.fillStyle = 'rgba(255,255,255,.55)'; c.fill();
  c.restore();
};

// --- state -------------------------------------------------------------------------------------------------
const isCalm = (x) => x <= 0.3 + 1e-6;
const START = [0.82, 0.68, 0.74], CALM = 0.3, FLOOR = 0.1, CUT = { name: 0.2, breathe: 0.2, wait: 0.15, talk: 0.15, push: 0 }, FXDUR = { name: 2.6, breathe: 9, wait: 2.6, talk: 2.6, push: 2.6 };
const LAD = [0.2, 0.38, 0.52, 0.66, 0.8];
const S = {
  g1: null, t1: 0, real: false, ph1: -1, A1: 0,
  g2: null, dial: 0, dialShow: 0,
  sit: 0, a3: START[0], a3show: 0, used: {}, last: null, fx: null,
  sec: null, age: 12, rung: 0, la: LAD[0], lashow: LAD[0],
  hp: 0,
};
const lab = shell({ key: 'brain-alarm', T, topics: TOPICS, views: ['roads', 'body', 'steer'], onLang: () => render(), onView: () => render() });
const secret = secretLab('brain-alarm', () => ({
  secrets: [{ emo: '🌳', title: T[lang].secrets.front[0], desc: T[lang].secrets.front[1] }, { emo: '🪜', title: T[lang].secrets.lad[0], desc: T[lang].secrets.lad[1] }],

const showStage = () => {

};

// --- controls ------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = b.dataset.k, i = +b.dataset.i;
  if (act === 'g1') { S.g1 = i; S.t1 = now(); S.ph1 = -1; (i === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'real') { S.real = i === 1; S.t1 = now(); S.ph1 = -1; sfx.click(); }
  else if (act === 'replay') { S.t1 = now(); S.ph1 = -1; sfx.click(); }
  else if (act === 'g2') { S.g2 = i; S.dial = 1; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'pre') { S.dial = i / 2; sfx.click(); }
  else if (act === 'sit') { S.sit = i; S.a3 = START[i]; S.used = {}; S.last = null; S.fx = null; sfx.click(); }
  else if (act === 'tool') {
    if (S.used[k]) return;
    S.used[k] = true; S.last = k; S.fx = { k, t0: now() }; S.a3 = Math.max(FLOOR, S.a3 - CUT[k]);
    (k === 'push' ? sfx.bad : sfx.good)();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click();
  } else if (act === 'stay') { S.la = Math.max(0.08, S.la - 0.12); sfx.tick(); }
  else if (act === 'up') { if (isCalm(S.la) && S.rung < 4) { S.rung++; S.la = LAD[S.rung]; sfx.snap(); } }
  else if (act === 'restart') { S.rung = 0; S.la = LAD[0]; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'dial' && S.g2 !== null) { S.dial = +ev.target.value / 100; render(); }
  else if (ev.target.id === 'ageR') { S.age = +ev.target.value; render(); }
});

// --- render: controls, readout, state card and facts for the current view ----------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('c1').hidden = v !== 'roads'; $('c2').hidden = v !== 'body'; $('c3').hidden = v !== 'steer';
  if (v === 'roads') renderRoads(t); else if (v === 'body') renderBody(t); else renderSteer(t);
}
const opts = (list, act, cur, dis) => list.map((o, i) => `<button class="ba-opt" data-act="${act}" data-i="${i}"${dis ? ' disabled' : ''}>${esc(o)}</button>`).join('');

function renderRoads(t) {
  const r = t.r, g = S.g1, ph = S.ph1 < 0 ? 0 : S.ph1;
  lab.setGlow('rgba(95, 168, 160, .26)');
  if (g === null) {
    setHTML($('c1'), `<div class="ba-q">${esc(r.q)}</div><div class="ba-opts">${opts(r.opts, 'g1')}</div>`);
    lab.setReadout('?', '', '', '#5fa8a0');
    lab.setState({ emo: '🤔', title: r.q, lead: r.preL, body: '', extra: fineBox(t) });
    lab.setFacts([]); return;
  }
  const verdict = g === 0 ? r.right : r.no[g];
  setHTML($('c1'), `<p class="ba-verdict${g === 0 ? '' : ' no'}">${g === 0 ? '<b>' + esc(r.right.split('!')[0]) + '!</b>' + esc(r.right.slice(r.right.indexOf('!') + 1)) : esc(verdict)}</p>
    <div class="ba-row">${r.tg.map((x, i) => `<button class="ba-btn${(i === 1) === S.real ? ' on' : ''}" data-act="real" data-i="${i}">${esc(x)}</button>`).join('')}<button class="ba-btn" data-act="replay">${esc(r.again)}</button></div>`);
  const st = ph === 0 ? r.ph[0] : ph === 1 ? r.ph[1] : S.real ? r.snake : r.stick;
  const lv = ph === 1 ? 2 : ph === 2 ? (S.real ? 1 : 0) : 0;
  lab.setReadout(esc(t.lvl[lv]), r.sub, t.sm, lv === 2 ? '#ff5a4d' : lv === 1 ? '#f5c84c' : '#3ddc97');
  lab.setState({ emo: st.emo, title: st.t, lead: st.l, body: verdict, extra: fineBox(t) });
  lab.setFacts(t.facts.r);
}

function renderBody(t) {
  const b = t.b, g = S.g2, l = lvlOf(S.dial);
  lab.setGlow('rgba(224, 120, 90, .24)');
  const v2 = g === 1 ? `<b>${esc(b.right.split('!')[0])}!</b>${esc(b.right.slice(b.right.indexOf('!') + 1))}` : esc(b.no);
  setHTML($('c2a'), g === null ? `<div class="ba-q">${esc(b.q)}</div><div class="ba-opts">${opts(b.opts, 'g2')}</div>` : `<p class="ba-verdict${g === 1 ? '' : ' no'}">${v2}</p>`);
  $('c2b').hidden = g === null;
  $('dial').disabled = g === null; $('dial').setAttribute('aria-label', b.dial);
  const dv = String(Math.round(S.dial * 100)); if ($('dial').value !== dv) $('dial').value = dv;
  $('dEndL').textContent = b.endL; $('dEndR').textContent = b.endR;
  setHTML($('dPre'), b.pre.map((x, i) => `<button class="ba-btn${lvlOf(S.dial) === i && Math.abs(S.dial - i / 2) < 0.01 ? ' on' : ''}" data-act="pre" data-i="${i}">${esc(x)}</button>`).join(''));
  if (g === null) {
    lab.setReadout('?', '', '', '#e0785a');
    lab.setState({ emo: '🤔', title: b.q, lead: b.preL, body: '', extra: fineBox(t) });
    lab.setFacts([]); return;

  lab.setReadout(esc(t.lvl[l]), b.sub, t.sm, l === 2 ? '#ff5a4d' : l === 1 ? '#f5c84c' : '#3ddc97');
  lab.setState({ emo: b.s[l].emo, title: b.s[l].t, lead: b.s[l].l, body: g === 1 ? b.right : b.no, extra: fineBox(t) });

}

function renderSteer(t) {
  const s = t.s, sec = S.sec, open = secret.unlocked();
  const secChips = [['front', '🌳'], ['lad', '🪜']].map(([k, e]) => `<button class="ba-btn${sec === k ? ' on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  setHTML($('c3s'), secChips);
  if (sec === 'front') {
    lab.setGlow('rgba(79, 209, 197, .24)');
    setHTML($('c3a'), '');
    setHTML($('c3b'), `<div class="ba-lbl">${esc(t.fr.age)}: <b id="ageV" style="color:#fff"></b></div><input type="range" class="big" id="ageR" min="6" max="40" step="1" value="12" style="--track: linear-gradient(90deg, #4fd1c5, #8f7fd0)">`);
    const ar = $('ageR'); if (ar && +ar.value !== S.age) ar.value = S.age;
    const av = $('ageV'); if (av) av.textContent = S.age;
    setHTML($('c3c'), '');
    const k = S.age <= 12 ? 0 : S.age <= 19 ? 1 : S.age <= 24 ? 2 : 3, f = t.fr.s[k];
    lab.setReadout(`${S.age}`, t.fr.yr, t.sm, '#4fd1c5');
    lab.setState({ emo: f.emo, title: f.t, lead: f.l, body: '', extra: fineBox(t) });
    lab.setFacts(t.facts.front); return;
  }
  if (sec === 'lad') {
    lab.setGlow('rgba(143, 127, 208, .26)');
    setHTML($('c3a'), ''); setHTML($('c3b'), '');
    const L = t.lad, end = S.rung === 4 && isCalm(S.la), ok = isCalm(S.la) && !end;
    setHTML($('c3c'), `<div class="ba-row"><button class="ba-btn go" data-act="stay"${end ? ' disabled' : ''}>${esc(L.stay)}</button><button class="ba-btn go" data-act="up"${ok ? '' : ' disabled'}>${esc(L.up)}</button><button class="ba-btn" data-act="restart">${esc(L.again)}</button></div>`);
    const l = lvlOf(S.la);
    lab.setReadout(esc(t.lvl[l]), L.stp(S.rung + 1), t.sm, l === 2 ? '#ff5a4d' : l === 1 ? '#f5c84c' : '#3ddc97');
    const st = end ? L.end : ok ? L.ok : { emo: L.run.emo, t: L.stp(S.rung + 1), l: L.run.l };
    lab.setState({ emo: st.emo, title: st.t, lead: st.l, body: '', extra: fineBox(t) });
    lab.setFacts(t.facts.lad); return;
  }
  lab.setGlow('rgba(95, 140, 208, .26)');
  setHTML($('c3a'), `<div class="ba-lbl">${esc(s.lblSit)}</div><div class="ba-row">${s.sits.map((x, i) => `<button class="ba-btn${S.sit === i ? ' on' : ''}" data-act="sit" data-i="${i}">${esc(x.name)}</button>`).join('')}</div>`);
  setHTML($('c3b'), `<div class="ba-lbl">${esc(s.lblTool)}</div><div class="ba-row">${Object.keys(s.tools).map((k) => `<button class="ba-btn${S.used[k] ? ' used' : ''}" data-act="tool" data-k="${k}"${S.used[k] ? ' disabled' : ''}>${esc(s.tools[k])}</button>`).join('')}</div>`);
  setHTML($('c3c'), '');
  const l = lvlOf(S.a3), calm = isCalm(S.a3);
  lab.setReadout(esc(t.lvl[l]), s.sub, t.sm, l === 2 ? '#ff5a4d' : l === 1 ? '#f5c84c' : '#3ddc97');
  let st;
  if (calm) st = { emo: '😌', t: s.calm.t, l: s.calm.l };
  else if (S.last) st = { emo: S.last === 'push' ? '🙈' : '🧭', t: s.after[S.last].t, l: s.after[S.last].l };
  else st = { emo: '😬', t: s.sits[S.sit].name, l: s.start };
  lab.setState({ emo: st.emo, title: st.t, lead: st.l, body: s.keep, extra: fineBox(t) });
  lab.setFacts(t.facts.s);
}

// --- pictures ---------------------------------------------------------------------------------------------------
function drawScene(c, [x, y, w, h], reveal, real, A, tm) { // the forest path as the eyes see it
  c.save(); rr(c, x, y, w, h, 16); c.clip();
  const sky = c.createLinearGradient(0, y, 0, y + h); sky.addColorStop(0, '#2c4d52'); sky.addColorStop(0.55, '#476a55'); sky.addColorStop(1, '#2a3a2b');
  c.fillStyle = sky; c.fillRect(x, y, w, h);
  radial(c, x + w * 0.7, y + h * 0.18, w * 0.5, 'rgba(255,230,160,A)', 0.35);
  // far and near trees
  for (const [fx, fw, col] of [[0.08, 16, '#1f3a30'], [0.3, 12, '#223f34'], [0.62, 12, '#223f34'], [0.9, 18, '#1d352c']]) {
    const tx = x + w * fx; c.fillStyle = col; c.fillRect(tx - fw / 2, y + h * 0.05, fw, h * 0.7);
    c.beginPath(); c.ellipse(tx, y + h * 0.1, fw * 2.2, h * 0.16, 0, 0, TAU); c.fill();
  }
  for (const [fx, fw] of [[0.0, 30], [0.97, 34]]) {
    const tx = x + w * fx, g = c.createLinearGradient(tx - fw, 0, tx + fw, 0); g.addColorStop(0, '#17271f'); g.addColorStop(1, '#2b3f2d');
    c.fillStyle = g; c.fillRect(tx - fw / 2, y, fw, h);
  }
  // path
  const pg = c.createLinearGradient(0, y + h * 0.45, 0, y + h); pg.addColorStop(0, '#8d7a56'); pg.addColorStop(1, '#b49a6c');
  c.beginPath(); c.moveTo(x + w * 0.44, y + h * 0.42); c.bezierCurveTo(x + w * 0.46, y + h * 0.6, x + w * 0.3, y + h * 0.8, x + w * 0.08, y + h);
  c.lineTo(x + w * 0.96, y + h); c.bezierCurveTo(x + w * 0.74, y + h * 0.8, x + w * 0.62, y + h * 0.6, x + w * 0.57, y + h * 0.42); c.closePath();
  c.fillStyle = pg; c.fill();
  const bg = c.createLinearGradient(0, y + h * 0.7, 0, y + h); bg.addColorStop(0, 'rgba(30,50,30,0)'); bg.addColorStop(1, 'rgba(30,50,30,.5)');
  c.fillStyle = bg; c.fillRect(x, y + h * 0.7, w, h * 0.3);
  // the curved thing: a dark silhouette first, details once the long route has arrived
  const cx = x + w * 0.5, cy = y + h * 0.76, sc = Math.min(w / 340, h / 150) * 1.0 + 0.2;
  const P = [[cx - 56 * sc, cy + 4 * sc], [cx - 26 * sc, cy - 20 * sc], [cx + 6 * sc, cy + 24 * sc], [cx + 56 * sc, cy - 2 * sc]];
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = 'rgba(0,0,0,.28)'; c.lineWidth = 12 * sc; c.beginPath(); c.moveTo(P[0][0], P[0][1] + 5); c.bezierCurveTo(P[1][0], P[1][1] + 5, P[2][0], P[2][1] + 5, P[3][0], P[3][1] + 5); c.stroke();
  c.strokeStyle = '#2b2a1b'; c.lineWidth = 9 * sc; c.beginPath(); c.moveTo(P[0][0], P[0][1]); c.bezierCurveTo(P[1][0], P[1][1], P[2][0], P[2][1], P[3][0], P[3][1]); c.stroke();
  if (reveal > 0) {
    c.save(); c.globalAlpha = reveal;
    const m = (t) => bez(P[0], P[1], P[2], P[3], t);
    if (!real) {
      const g = c.createLinearGradient(P[0][0], 0, P[3][0], 0); g.addColorStop(0, '#8a6a45'); g.addColorStop(1, '#6b4f33');
      c.strokeStyle = g; c.lineWidth = 8 * sc; c.beginPath(); c.moveTo(P[0][0], P[0][1]); c.bezierCurveTo(P[1][0], P[1][1], P[2][0], P[2][1], P[3][0], P[3][1]); c.stroke();
      c.strokeStyle = 'rgba(255,220,170,.35)'; c.lineWidth = 2 * sc; c.beginPath(); c.moveTo(P[0][0], P[0][1] - 2 * sc); c.bezierCurveTo(P[1][0], P[1][1] - 2 * sc, P[2][0], P[2][1] - 2 * sc, P[3][0], P[3][1] - 2 * sc); c.stroke();
      c.strokeStyle = '#6b4f33'; c.lineWidth = 3 * sc;
      for (const [tt, dx, dy] of [[0.3, 6, -14], [0.68, 8, 12]]) { const p = m(tt); c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(p[0] + dx * sc, p[1] + dy * sc); c.stroke(); }
    } else {
      const g = c.createLinearGradient(P[0][0], 0, P[3][0], 0); g.addColorStop(0, '#5d8a3c'); g.addColorStop(1, '#3f6a2b');
      c.strokeStyle = g; c.lineWidth = 9 * sc; c.beginPath(); c.moveTo(P[0][0], P[0][1]); c.bezierCurveTo(P[1][0], P[1][1], P[2][0], P[2][1], P[3][0], P[3][1]); c.stroke();
      c.strokeStyle = '#d6c25a'; c.lineWidth = 3.4 * sc; c.setLineDash([2.5 * sc, 6 * sc]);
      c.beginPath(); c.moveTo(P[0][0], P[0][1]); c.bezierCurveTo(P[1][0], P[1][1], P[2][0], P[2][1], P[3][0], P[3][1]); c.stroke(); c.setLineDash([]);
      const hd = P[3]; c.beginPath(); c.ellipse(hd[0] + 6 * sc, hd[1] - 2 * sc, 11 * sc, 7 * sc, -0.2, 0, TAU); c.fillStyle = '#4f7d33'; c.fill();
      c.beginPath(); c.arc(hd[0] + 8 * sc, hd[1] - 5 * sc, 2.3 * sc, 0, TAU); c.fillStyle = '#ffe36a'; c.fill();
      c.beginPath(); c.arc(hd[0] + 8.6 * sc, hd[1] - 5 * sc, 1 * sc, 0, TAU); c.fillStyle = '#111'; c.fill();
      c.strokeStyle = '#e04a4a'; c.lineWidth = 1.4 * sc; c.beginPath(); c.moveTo(hd[0] + 16 * sc, hd[1] - 1 * sc); c.lineTo(hd[0] + 23 * sc, hd[1] - 1 * sc);
      c.moveTo(hd[0] + 23 * sc, hd[1] - 1 * sc); c.lineTo(hd[0] + 27 * sc, hd[1] - 4 * sc); c.moveTo(hd[0] + 23 * sc, hd[1] - 1 * sc); c.lineTo(hd[0] + 27 * sc, hd[1] + 2 * sc); c.stroke();
    }
    c.restore();
  }
  if (A > 0.02) { // a red edge glow while the alarm rings
    const vg = c.createRadialGradient(x + w / 2, y + h / 2, Math.min(w, h) * 0.3, x + w / 2, y + h / 2, Math.max(w, h) * 0.75);
    vg.addColorStop(0, 'rgba(255,40,30,0)'); vg.addColorStop(1, `rgba(255,40,30,${0.5 * A * (0.8 + 0.2 * Math.sin(tm * 14))})`);
    c.fillStyle = vg; c.fillRect(x, y, w, h);
  }
  c.restore();
  rr(c, x, y, w, h, 16); c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1.2; c.stroke();
  return [cx, cy];
}

function animRoads() { // the timeline of the play-through, in seconds since the answer
  const play = S.g1 !== null, t = play ? now() - S.t1 : 0, real = S.real;
  let A = 0;
  if (play) A = t < TS ? 0 : t < TS + 0.35 ? easeOut((t - TS) / 0.35) : t < TF + 0.4 ? 1 : real ? mixn(1, 0.7, ease((t - TF - 0.4) / 1.5)) : mixn(1, 0.12, ease((t - TF - 0.4) / 2));
  const ph = !play ? -1 : t < TS ? 0 : t < TF ? 1 : 2;
  return { play, t, A, ph, real };
}

function litRoute(c, R, d, col, w, alpha = 1) { // a dotted route, glowing as far as the signal has travelled
  if (d <= 0) return;
  c.save(); c.globalAlpha = alpha; c.lineCap = 'round'; c.setLineDash([]);
  routePath(c, R, 0, d); c.strokeStyle = `rgba(${col},.25)`; c.lineWidth = w * 2.6; c.stroke();
  c.setLineDash([0.1, w * 2.2]); routePath(c, R, 0, d); c.strokeStyle = `rgb(${col})`; c.lineWidth = w; c.stroke();
  c.restore();
}
function ghostRoute(c, R, col, w) { // the whole route, faint, once the answer is in
  c.save(); c.lineCap = 'round'; c.setLineDash([0.1, w * 2.2]); routePath(c, R, 0, R.len); c.strokeStyle = `rgba(${col},.4)`; c.lineWidth = w; c.stroke(); c.restore();
}
const COL = { et: '255,196,80', ta: '255,130,30', tv: '30,190,170' };
function alarmBurst(c, p, k, tm) { // an orange "!" with short rays
  const s = 11 * k; if (s <= 0) return;
  c.save(); c.translate(p[0], p[1]); c.strokeStyle = '#ff9a3c'; c.lineWidth = 2.2; c.lineCap = 'round';
  for (let i = 0; i < 7; i++) { const a = Math.PI * (1.1 + 0.8 * i / 6), r0 = s + 3, r1 = s + 8 + 2 * Math.sin(tm * 16 + i); c.beginPath(); c.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); c.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); c.stroke(); }
  c.beginPath(); c.arc(0, 0, s, 0, TAU); c.fillStyle = '#ff6a1a'; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
  c.fillStyle = '#fff'; c.font = `900 ${FS(15) * k}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('!', 0, 1); c.restore();
}
function chestHeart(c, p, A) { // a beating heart on the hoodie, faster when the alarm rings
  c.beginPath(); c.arc(p[0], p[1], 14, 0, TAU); c.fillStyle = 'rgba(255,255,255,.88)'; c.fill();

  drawHead(c, { A: 0.1, pfc: 0.4 + 0.55 * pulse, regions: true });
  c.strokeStyle = 'rgba(40,190,170,.85)'; c.lineWidth = 2.4; c.lineCap = 'round'; // little arcs around the front: "changing"
  for (let i = 0; i < 3; i++) { const a = tm * 1.4 + i * 2.1, r = 36 + 6 * Math.sin(a); c.beginPath(); c.arc(PFC[0], PFC[1], r, a, a + 0.8); c.stroke(); }
  c.restore();
  c.font = `800 ${FS(13)}px ${FONT}`; const stillW = c.measureText(f.still).width + FS(13) * 1.1;
  headLabels(c, H, t, ['front'], B.BW, 352 - stillW - 8);
  pill(c, f.still, 352, hy - 52, { size: 13, bg: 'rgba(79,209,197,.92)', fg: '#082a27', align: 'r' });
  pill(c, t.r.lab.simp, 352, 300, { size: 12, weight: 700, fg: '#98A0B8', align: 'r' });
  // age line
  const X0 = 26, X1 = 334, xa = (a) => X0 + (a - 6) / 34 * (X1 - X0), Y = 378;
  rr(c, X0 - 4, Y - 5, X1 - X0 + 8, 10, 5); c.fillStyle = 'rgba(130,145,190,.2)'; c.fill();
  rr(c, xa(13), Y - 7, xa(20) - xa(13), 14, 7); const tg = c.createLinearGradient(xa(13), 0, xa(20), 0); tg.addColorStop(0, '#4fd1c5'); tg.addColorStop(1, '#8f7fd0'); c.fillStyle = tg; c.fill();
  c.font = `700 ${FS(12.5)}px ${FONT}`; c.fillStyle = '#98A0B8'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  for (const a of [10, 20, 30, 40]) c.fillText(String(a), xa(a), Y + 26);
  c.fillStyle = '#D3D9E8'; c.fillText(f.teen, (xa(13) + xa(20)) / 2, Y - 16);
  // the "25" flag, crossed out once you pass it
  const fxp = xa(25); c.strokeStyle = '#98A0B8'; c.lineWidth = 2; c.beginPath(); c.moveTo(fxp, Y - 6); c.lineTo(fxp, Y - 50); c.stroke();
  c.beginPath(); c.moveTo(fxp, Y - 50); c.lineTo(fxp + 34, Y - 42); c.lineTo(fxp, Y - 34); c.closePath(); c.fillStyle = S.age >= 25 ? 'rgba(255,90,70,.9)' : 'rgba(150,160,190,.85)'; c.fill();
  c.font = `900 ${FS(12.5)}px ${FONT}`; c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText(f.myth, fxp + 4, Y - 38);
  if (S.age >= 25) { c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(fxp + 3, Y - 30); c.lineTo(fxp + 36, Y - 52); c.stroke(); }
  // the marker
  const kx = xa(S.age); c.beginPath(); c.arc(kx, Y, 13, 0, TAU); c.fillStyle = '#fff'; c.fill(); c.strokeStyle = '#4fd1c5'; c.lineWidth = 4; c.stroke();
  c.font = `900 ${FS(12.5)}px ${FONT}`; c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(`${f.yr} ${S.age}`, kx, Y + 48);
}

// secret: the fear ladder ----------------------------------------------------------------------------------------
function drawLadder(c, B, dt, tm) {
  const t = T[lang], L = t.lad;
  S.lashow += (S.la - S.lashow) * Math.min(1, dt * 4); S.hp += dt * (1.1 + 3.4 * S.lashow) * TAU;
  const LY = (i) => 410 - i * 76;
  // rails
  for (const x of [38, 96]) { const g = c.createLinearGradient(x - 5, 0, x + 5, 0); g.addColorStop(0, '#6f4d2f'); g.addColorStop(1, '#a37a4e'); rr(c, x - 5, 70, 10, 392, 5); c.fillStyle = g; c.fill(); }
  for (let i = 0; i < 5; i++) { const g = c.createLinearGradient(0, LY(i) - 5, 0, LY(i) + 5); g.addColorStop(0, '#b88c58'); g.addColorStop(1, '#8a6439'); rr(c, 36, LY(i) - 5, 62, 10, 4); c.fillStyle = g; c.fill(); }
  c.font = `800 ${FS(12)}px ${FONT}`; c.fillStyle = '#98A0B8'; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(L.cap.toUpperCase(), 122, 60, 230);
  for (let i = 0; i < 5; i++) {
    const y = LY(i), cur = i === S.rung, done = i < S.rung;
    c.globalAlpha = cur ? 1 : done ? 0.75 : 0.55;
    words(c, `${i + 1}. ${L.steps[i]}`, 122, y - 22, 228, 13, cur ? '#fff' : '#D3D9E8', 800);
    rr(c, 122, y + 6, 226, 10, 5); c.fillStyle = 'rgba(130,145,190,.2)'; c.fill();
    const lv = cur ? S.lashow : done ? Math.max(0.08, CALM - 0.05) : LAD[i];
    rr(c, 122, y + 6, Math.max(10, 226 * lv), 10, 5); c.fillStyle = lv > 0.67 ? '#ff5a4d' : lv > 0.34 ? '#f5c84c' : '#3ddc97'; c.fill();
    c.globalAlpha = 1;
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.5; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(122 + 226 * CALM, y + 3); c.lineTo(122 + 226 * CALM, y + 19); c.stroke(); c.setLineDash([]);
  }
  // the child on the current rung
  const y = LY(S.rung) - 7, x = 67, A = S.lashow, bob = Math.sin(S.hp) * 1.2 * A;
  c.save(); c.translate(x, y + bob);
  rr(c, -11, -30, 22, 28, 9); const bg = c.createLinearGradient(0, -30, 0, -2); bg.addColorStop(0, '#6c8fe0'); bg.addColorStop(1, '#4a69b8'); c.fillStyle = bg; c.fill();
  c.beginPath(); c.arc(0, -42, 13, 0, TAU); const hg = c.createRadialGradient(-4, -46, 2, 0, -42, 14); hg.addColorStop(0, '#f6d2b4'); hg.addColorStop(1, '#d9a784'); c.fillStyle = hg; c.fill(); c.strokeStyle = 'rgba(95,55,40,.6)'; c.lineWidth = 1.2; c.stroke();
  c.beginPath(); c.arc(0, -47, 13, Math.PI * 1.05, TAU * 0.99); c.strokeStyle = '#5a3a28'; c.lineWidth = 4; c.stroke();
  c.fillStyle = '#2a2230'; c.beginPath(); c.arc(-4.5, -42, 1.7, 0, TAU); c.arc(4.5, -42, 1.7, 0, TAU); c.fill();
  c.strokeStyle = '#8a3b3b'; c.lineWidth = 1.8; c.lineCap = 'round'; c.beginPath(); const sm = 3 - 7 * A; c.moveTo(-4, -36); c.quadraticCurveTo(0, -36 + sm, 4, -36); c.stroke();
  if (A > 0.6) { c.beginPath(); c.moveTo(14, -52); c.bezierCurveTo(17, -48, 17, -45, 14, -45); c.bezierCurveTo(11, -45, 11, -48, 14, -52); c.fillStyle = '#7ec8ff'; c.fill(); }
  c.restore();
  drawHeart(c, 336, 94, 12, 0.18 * Math.pow(Math.max(0, Math.sin(S.hp)), 3));
}

// --- the loop -----------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, tm) => {
  const v = lab.view, sec = v === 'steer' ? S.sec : null;
  const land = w / h >= 1.3 && !sec, BW = land ? 680 : 360, BH = land ? 420 : v === 'roads' ? 470 : 480, s = Math.min(w / BW, h / BH);
  const B = { land, BW, BH, s };
  SC = s; c.save(); c.translate((w - BW * s) / 2, (h - BH * s) / 2); c.scale(s, s);
  if (v === 'roads') drawRoads(c, B, dt, tm);
  else if (v === 'body') drawBody(c, B, dt, tm);
  else if (sec === 'front') drawFront(c, B, dt, tm);
  else if (sec === 'lad') drawLadder(c, B, dt, tm);
  else drawSteer(c, B, dt, tm);
  c.restore();
});
render();
</script>
