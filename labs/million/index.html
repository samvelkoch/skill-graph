  const st = t.st.seconds;
  if (Ss.ans === null) lab.setState({ emo: '🤔', title: t.secondsAsk, lead: '', body: '' });
  else lab.setState({ emo: st[0], title: st[1], lead: Ss.bil ? st[3] : st[2], body: '' });
}
render();
</script>
