  c.save(); c.translate(geo.ox, geo.oy); c.scale(geo.sc, geo.sc);
  if (kind === 'size') drawSize(c, time); else if (kind === 'ask') drawAsk(c, time); else if (kind === 'again') drawAgain(c, time);
  else if (kind === 'call') drawCall(c, time); else drawHelpers(c, time);
  c.restore();
});
render();
</script>
