  const mx = xOf(S.yrs); c.beginPath(); c.arc(mx, ry, 8, 0, 7); c.fillStyle = !rev ? '#f5c84c' : caught ? '#3ddc97' : '#ff5d5d'; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2.2; c.stroke();
}

// --- view 3: two fields and the seven days -------------------------------------------------------------------
const ZONE = { lord: { x: 4, y: 28, w: 170, h: 226 }, own: { x: 186, y: 28, w: 170, h: 226 } };
const slotOf = (i) => {
  const z = S.tiles[i].z;
  if (z === 'tray') return { x: 8 + i * 50, y: 282, w: 44, h: 56, k: 0 };
  const k = S.tiles.slice(0, i).filter((q) => q.z === z).length, Z = ZONE[z];
  return { x: Z.x + 3 + (k % 4) * 42, y: 76 + Math.floor(k / 4) * 50, w: 38, h: 46, k: 1 };
};
function field(c, z, time, hot) {
  const Z = ZONE[z], lord = z === 'lord', t = T[lang];
  c.save();
  c.shadowColor = 'rgba(0, 0, 0, .35)'; c.shadowBlur = 10; c.shadowOffsetY = 3;
  rr(c, Z.x, Z.y, Z.w, Z.h, 18); c.fillStyle = lord ? lg(c, 0, Z.y, 0, Z.y + Z.h, [[0, '#e0bd62'], [1, '#b58a35']]) : lg(c, 0, Z.y, 0, Z.y + Z.h, [[0, '#8fb06f'], [1, '#5f8a52']]); c.fill();
  c.restore();
  c.save(); rr(c, Z.x, Z.y, Z.w, Z.h, 18); c.clip();
  c.strokeStyle = lord ? 'rgba(120, 84, 22, .42)' : 'rgba(50, 80, 40, .42)'; c.lineWidth = 2; c.lineCap = 'round';
  for (let i = 0; i < 9; i++) { const yy = Z.y + 56 + i * 20; c.beginPath(); c.moveTo(Z.x, yy); c.bezierCurveTo(Z.x + 50, yy - 7, Z.x + 120, yy + 7, Z.x + Z.w, yy - 2); c.stroke(); }
  c.fillStyle = lord ? 'rgba(255, 236, 160, .55)' : 'rgba(200, 235, 160, .5)';
  for (let i = 0; i < 26; i++) { const xx = Z.x + 12 + ((i * 53) % (Z.w - 24)), yy = Z.y + 62 + ((i * 37) % (Z.h - 76)); c.beginPath(); c.ellipse(xx, yy + Math.sin(time * 2 + i) * 0.6, 2, 3.6, 0.2, 0, 7); c.fill(); }
  const sh = c.createLinearGradient(Z.x, Z.y, Z.x + Z.w, Z.y + Z.h); sh.addColorStop(0, 'rgba(255, 255, 255, .16)'); sh.addColorStop(1, 'rgba(0, 0, 0, .12)'); c.fillStyle = sh; c.fillRect(Z.x, Z.y, Z.w, Z.h);
  c.restore();
  rr(c, Z.x, Z.y, Z.w, Z.h, 18); c.strokeStyle = hot ? '#fff' : 'rgba(40, 28, 12, .75)'; c.lineWidth = hot ? 3 : 2; c.stroke();
  rr(c, Z.x + 14, Z.y + 8, Z.w - 28, 30, 8); c.fillStyle = lg(c, 0, Z.y + 8, 0, Z.y + 38, [[0, '#8a6540'], [1, '#6a4a2c']]); c.fill(); c.strokeStyle = '#33220f'; c.lineWidth = 1.3; c.stroke();
  text(c, lord ? t.w.lord : t.w.own, Z.x + Z.w / 2, Z.y + 24, '800 13px Nunito, sans-serif', '#f8ecd0');
}
function tile(c, q, i, drag) {
  const t = T[lang], w = lerp(44, 38, q.k), h = lerp(56, 46, q.k);
  c.save(); c.shadowColor = 'rgba(0, 0, 0, .4)'; c.shadowBlur = drag ? 12 : 5; c.shadowOffsetY = drag ? 6 : 2;
  rr(c, q.x, q.y - (drag ? 3 : 0), w, h, 8); c.fillStyle = lg(c, 0, q.y, 0, q.y + h, [[0, '#f8efd6'], [1, '#e0d0a6']]); c.fill(); c.restore();
  rr(c, q.x, q.y - (drag ? 3 : 0), w, h, 8); c.strokeStyle = '#7b6a3f'; c.lineWidth = 1.5; c.stroke();
  if (q.z !== 'tray') { rr(c, q.x + 4, q.y + 4 - (drag ? 3 : 0), w - 8, 5, 2.5); c.fillStyle = q.z === 'lord' ? '#d49a2a' : '#4f9a52'; c.fill(); }
  text(c, t.w.days[i], q.x + w / 2, q.y + h / 2 + (q.z === 'tray' ? 0 : 3) - (drag ? 3 : 0), '800 14px Nunito, sans-serif', '#2b2210');
}
function sceneWeek(c, time) {
  const t = T[lang], kinds = S.sec === 'kinds';
  landscape(c, time, 262);
  if (kinds) {
    c.fillStyle = 'rgba(10, 14, 30, .82)'; rr(c, 4, 28, 352, 226, 18); c.fill();
    text(c, t.kd.cap, 180, 50, '800 13px Nunito, sans-serif', '#d3d9e8');
    const rows = [[t.kd.st, CENSUS.state, '#6fa3e8'], [t.kd.lo, CENSUS.lords, '#e0b050'], [t.kd.ot, CENSUS.other, '#8d95ae']], mx = 250 / 23.2e6;
    rows.forEach(([lbl, v, col], i) => {
      const y = 70 + i * 58, w = v * mx * ease(S.kt);
      text(c, lbl, 22, y + 3, '700 12px Nunito, sans-serif', '#aab3d0', 'left');
      rr(c, 22, y + 14, Math.max(4, w), 24, 8); c.fillStyle = lg(c, 0, y + 14, 0, y + 38, [[0, col], [1, 'rgba(20, 26, 50, .35)']]); c.fill();
      c.globalAlpha = 0.85; c.fillStyle = col; rr(c, 22, y + 14, Math.max(4, w), 24, 8); c.fill(); c.globalAlpha = 1;
      text(c, `${(v / 1e6).toFixed(1)}`, 22 + Math.max(4, w) + 8, y + 27, '900 15px Nunito, sans-serif', '#fff', 'left');
    });
  } else {
    const hot = S.drag && S.drag.moved ? S.drag.over : null;
    field(c, 'lord', time, hot === 'lord'); field(c, 'own', time, hot === 'own');
  }
  if (!S.cmp) {
    rr(c, 4, 264, 352, 76, 16); c.fillStyle = 'rgba(10, 14, 30, .6)'; c.fill();
    if (!kinds && S.tiles.some((q) => q.z === 'tray')) text(c, t.w.tray, 180, 273, '700 12px Nunito, sans-serif', '#d3d9e8');
    else if (kinds) text(c, t.w.tray, 180, 273, '700 12px Nunito, sans-serif', 'rgba(211, 217, 232, .5)');
  }
  if (!kinds) S.tiles.forEach((q, i) => { if (!(S.drag && S.drag.i === i)) tile(c, q, i, false); });
  if (!kinds && S.drag) tile(c, S.tiles[S.drag.i], S.drag.i, true);
  if (S.cmp && S.sec !== 'kinds') {
    c.fillStyle = 'rgba(10, 14, 30, .72)'; rr(c, 4, 262, 352, 134, 16); c.fill();
    const a = ease(S.ct);
    text(c, t.w.yours, 18, 278, '800 12px Nunito, sans-serif', '#aab3d0', 'left');
    S.tiles.forEach((q, i) => {
      const x = 18 + i * 47, col = q.z === 'lord' ? '#d49a2a' : q.z === 'own' ? '#4f9a52' : '#6b7595';
      rr(c, x, 288, 43, 26, 7); c.fillStyle = col; c.fill(); text(c, t.w.days[i], x + 21.5, 302, '800 12px Nunito, sans-serif', '#10162b');
    });
    text(c, t.w.man, 18, 336, '800 12px Nunito, sans-serif', '#aab3d0', 'left');
    const tot = 324, wd = [3 / 7, 3 / 7, 1 / 7].map((f) => f * tot * a), gap = 3; let x = 18;
    [[wd[0], '#d49a2a', `${t.w.segL} 3`], [wd[1], '#4f9a52', `${t.w.segO} 3`], [wd[2], '#7f8fb8', t.w.segS]].forEach(([w, col, lbl]) => {
      rr(c, x, 346, Math.max(0, w - gap), 30, 8); c.fillStyle = col; c.fill(); if (a > 0.9) text(c, lbl, x + (w - gap) / 2, 361.5, '800 12px Nunito, sans-serif', '#10162b'); x += w;
    });
  }
}

// --- per-frame animation -----------------------------------------------------------------------------------
function step(dt) {
  const v = lab.view;
  const tgt = v === 'leave' ? (S.g[S.stop] !== null ? 1 : 0) : v === 'run' ? (S.rrev[S.era] ? 1 : 0) : 0;
  S.rv = clamp(S.rv + clamp(tgt - S.rv, -dt * 2.2, dt * 2.2), 0, 1);
  const open = v === 'leave' && S.g[S.stop] !== null && STOPS[S.stop].kind === 'week' ? 1 : 0;
  S.gate = clamp(S.gate + clamp(open - S.gate, -dt * 1.4, dt * 1.4), 0, 1);
  const cartTgt = open && S.gate > 0.8 ? 1 : 0, c0 = S.cart;
  S.cart = clamp(S.cart + (cartTgt ? dt * 0.4 : 0), 0, 1);
  S.move = S.cart > c0 && S.cart < 1 ? 1 : 0;
  S.wh += 330 * (S.cart - c0) / 13;
  const rt = v === 'run' && S.rrev[S.era] ? 1 : 0;
  S.rp = clamp(S.rp + clamp(rt - S.rp, -dt * 0.6, dt * 0.45), 0, 1);
  S.ct = clamp(S.ct + (S.cmp ? dt * 1.2 : -dt * 3), 0, 1);
  S.kt = clamp(S.kt + (S.sec === 'kinds' ? dt * 1.1 : -dt * 3), 0, 1);
  if (v === 'week') for (let i = 0; i < 7; i++) {
    const q = S.tiles[i], s = slotOf(i);
    if (!q.init) { q.x = s.x; q.y = s.y; q.k = s.k; q.init = true; }
    if (S.drag && S.drag.i === i) continue;
    const f = Math.min(1, dt * 14); q.x += (s.x - q.x) * f; q.y += (s.y - q.y) * f; q.k += (s.k - q.k) * f;
  }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const sc = Math.min(w / W, h / H), ox = (w - W * sc) / 2, oy = (h - H * sc) / 2;
  G.ox = ox; G.oy = oy; G.sc = sc;
  step(dt);
  drawSky(c, w, h, time);
  c.save(); c.translate(ox, oy); c.scale(sc, sc); c.lineJoin = 'round';
  const v = lab.view;
  if (v === 'leave') sceneLeave(c, time); else if (v === 'run') sceneRun(c, time); else sceneWeek(c, time);
  c.restore();
});

// --- input -------------------------------------------------------------------------------------------------
const cv = $('cv');
const pt = (ev) => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left - G.ox) / G.sc, y: (ev.clientY - r.top - G.oy) / G.sc }; };
const zoneAt = (p) => (p.y >= 262 ? 'tray' : p.x >= ZONE.lord.x && p.x <= ZONE.lord.x + ZONE.lord.w && p.y >= ZONE.lord.y ? 'lord' : p.x >= ZONE.own.x && p.x <= ZONE.own.x + ZONE.own.w && p.y >= ZONE.own.y ? 'own' : null);
const resetCart = () => { S.cart = 0; S.gate = 0; S.move = 0; S.rv = 0; };
cv.addEventListener('pointerdown', (ev) => {
  const p = pt(ev), v = lab.view;
  if (v === 'leave') {
    if (p.y < 340) return;
    let best = -1, bd = 46; STOPS.forEach((_, i) => { const d = Math.abs(40 + i * (280 / 3) - p.x); if (d < bd) { bd = d; best = i; } });
    if (best >= 0 && best !== S.stop) { S.stop = best; S.sec = null; resetCart(); sfx.tick(); render(); }
    return;
  }
  if (v !== 'week' || S.cmp || S.sec === 'kinds') return;
  for (let i = 6; i >= 0; i--) {
    const q = S.tiles[i], w = lerp(44, 38, q.k), h = lerp(56, 46, q.k);
    if (p.x >= q.x && p.x <= q.x + w && p.y >= q.y && p.y <= q.y + h) {
      S.drag = { i, dx: p.x - q.x, dy: p.y - q.y, x0: p.x, y0: p.y, moved: false, over: null };
      try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
      ev.preventDefault(); return;
    }
  }
});
cv.addEventListener('pointermove', (ev) => {
  const d = S.drag; if (!d) return;
  const p = pt(ev); if (Math.hypot(p.x - d.x0, p.y - d.y0) > 6) d.moved = true;
  const q = S.tiles[d.i]; q.x = p.x - d.dx; q.y = p.y - d.dy; d.over = zoneAt({ x: p.x, y: p.y });
});
const endDrag = (ev) => {
  const d = S.drag; if (!d) return; S.drag = null;
  const q = S.tiles[d.i], p = pt(ev);
  if (!d.moved) q.z = q.z === 'tray' ? 'lord' : q.z === 'lord' ? 'own' : 'lord';
  else { const z = zoneAt(p); if (z) q.z = z; }
  sfx.snap(); render();
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { S.drag = null; });

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'stop') { S.stop = +b.dataset.i; S.sec = null; resetCart(); sfx.tick(); }
  else if (act === 'opt') { S.g[S.stop] = b.dataset.k; (b.dataset.k === STOPS[S.stop].kind ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'ldReset') { S.g = [null, null, null, null]; S.stop = 0; resetCart(); sfx.click(); }
  else if (act === 'era') { S.era = +b.dataset.i; if (!S.rrev[S.era]) S.yrs = ERAS[S.era].yrs; S.rp = 0; sfx.tick(); }
  else if (act === 'guess') {
    const era = ERAS[S.era], caught = S.yrs <= era.term, ok = (b.dataset.k === 'yes') === caught;
    S.rrev[S.era] = true; S.rg[S.era] = { ok, y: S.yrs }; S.rp = 0; (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'cmp') {
    if (S.tiles.slice(0, 6).some((q) => q.z === 'tray')) return;
    const L = S.tiles.filter((q) => q.z === 'lord').length, sunL = S.tiles[6].z === 'lord';
    S.cmp = true; S.ct = 0; S.verdict = L === 3 ? (sunL ? 'sun' : 'ok') : 'bad'; (S.verdict === 'ok' ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'wkAgain') { S.tiles.forEach((q) => { q.z = 'tray'; }); S.cmp = false; S.verdict = null; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k; if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; if (S.sec === 'kinds') S.cmp = false, S.verdict = null; sfx.click();
  }
  render();
});
$('rnSl').addEventListener('input', (ev) => { S.yrs = clamp(Math.round(+ev.target.value), 0, MAXY); if (S.rrev[S.era]) S.rp = 0; render(); });

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secLeave').style.display = v === 'leave' ? '' : 'none';
  $('secRun').style.display = v === 'run' ? '' : 'none';
  $('secWeek').style.display = v === 'week' ? '' : 'none';
  cv.style.touchAction = v === 'week' ? 'none' : 'pan-y';
  if (v === 'leave') renderLeave(t); else if (v === 'run') renderRun(t); else renderWeek(t);
}
const secChip = (k, emo, t) => { const open = secret.unlocked(); return `<button class="chip yd-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`; };

function renderLeave(t) {
  const st = STOPS[S.stop], g = S.g[S.stop], rev = g !== null, L = t.l, done = S.g.every((x) => x !== null), k = S.g.filter((x, i) => x === STOPS[i].kind).length;
  lab.setGlow('rgba(224, 176, 80, .26)');
  $('ldStops').innerHTML = STOPS.map((s, i) => { const gg = S.g[i], mk = gg === null ? '' : gg === s.kind ? ' ✓' : ' ✗'; return `<button class="chip yd-c ${i === S.stop ? 'on' : ''}" data-act="stop" data-i="${i}">${s.y}${mk}</button>`; }).join('');
  $('ldQ').textContent = L.q;
  $('ldOpts').innerHTML = st.ord.map((key) => `<button data-act="opt" data-k="${key}" class="${rev ? (key === st.kind ? 'good' : key === g ? 'bad' : 'dim') : ''}"${rev ? ' disabled' : ''}>${esc(L.opts[key])}</button>`).join('');
  $('ldSec').innerHTML = secChip('say', '🗣️', t) + (done ? `<button class="chip yd-c" data-act="ldReset">${esc(L.reset)}</button>` : '');
  const fine = `<div class="yd-fine">${esc(t.fine)}${done ? ` · ${esc(L.done(k))}` : ''}</div>`;
  lab.setReadout(st.y, t.day, rev ? L.pill[st.kind] : '', '#e0b050');
  if (S.sec === 'say') {
    lab.setState({ emo: '🗣️', title: t.say.title, lead: t.say.lead, body: t.say.body, extra: fine });
    lab.setFacts([{ emo: '🗣️', text: t.say.fact, src: t.say.src }]);
    return;
  }
  if (!rev) lab.setState({ emo: '🤔', title: L.q, lead: L.pick, body: '', extra: fine });
  else { const r = L.r[st.y]; lab.setState({ emo: st.kind === 'week' ? '🚪' : '🔒', title: `${g === st.kind ? t.right : t.wrong} ${r[0]}`, lead: r[1], body: r[2], extra: fine }); }
  lab.setFacts(t.facts.leave);
}

function renderRun(t) {
  const era = ERAS[S.era], n = S.yrs, rev = S.rrev[S.era], caught = n <= era.term, R = t.r, rg = S.rg[S.era];
  lab.setGlow('rgba(217, 130, 95, .26)');
  $('rnEras').innerHTML = ERAS.map((e, i) => `<button class="chip yd-c ${i === S.era ? 'on' : ''}" data-act="era" data-i="${i}">${e.y}${S.rrev[i] ? (S.rg[i].ok ? ' ✓' : ' ✗') : ''}</button>`).join('');
  $('rnLbl').textContent = R.lbl;
  const sl = $('rnSl'); if (+sl.value !== n) sl.value = n; sl.setAttribute('aria-label', R.lbl);
  $('rnQ').textContent = R.q;
  $('rnOpts').innerHTML = [['yes', R.yes], ['no', R.no]].map(([k, l]) => `<button data-act="guess" data-k="${k}" class="${rev ? ((k === 'yes') === caught ? 'good' : rg && (rg.y === n) && !rg.ok ? 'bad' : 'dim') : ''}"${rev ? ' disabled' : ''}>${esc(l)}</button>`).join('');
  const fine = `<div class="yd-fine">${esc(t.fine)}</div>`;
  lab.setReadout(n, R.sub(n), rev ? R.pill(caught) : '', '#d9825f');
  if (!rev) lab.setState({ emo: '🏃', title: R.preT, lead: R.pre(n, era.y), body: R.q, extra: fine });
  else {
    const v = rg && rg.y === n ? `${rg.ok ? t.right : t.wrong} ` : '';
    lab.setState({ emo: caught ? '⛓️' : '🌲', title: v + (caught ? R.yesT : R.noT), lead: R.info(era.y, era.term), body: R.body(n, era.term, caught), extra: fine });
  }
  const f = t.facts, list = [f.run1, f.run2]; if (S.rrev[1]) list.push(f.run3);
  lab.setFacts(list);
}

function renderWeek(t) {
  const W_ = t.w, L = S.tiles.filter((q) => q.z === 'lord').length, placed = S.tiles.filter((q) => q.z !== 'tray').length, kinds = S.sec === 'kinds', f = t.facts;
  lab.setGlow('rgba(143, 176, 111, .26)');
  $('wkQ').textContent = W_.q;
  $('wkCmp').textContent = W_.cmp; $('wkCmp').disabled = S.tiles.slice(0, 6).some((q) => q.z === 'tray') || S.cmp;
  $('wkAgain').textContent = W_.again; $('wkAgain').style.display = placed > 0 || S.cmp ? '' : 'none';
  $('wkSec').innerHTML = secChip('kinds', '🧮', t);
  const fine = `<div class="yd-fine">${esc(t.fine)}</div>`;
  if (kinds) {
    const fmt = (v) => (v / 1e6).toFixed(1).replace('.', lang === 'en' ? '.' : ',');
    lab.setReadout(fmt(CENSUS.state), t.kd.st, fmt(CENSUS.lords), '#8fb06f');
    lab.setState({ emo: '🧮', title: t.kd.title, lead: t.kd.lead(fmt(CENSUS.state), fmt(CENSUS.lords)), body: t.kd.body(fmt(CENSUS.other)), extra: fine });
    lab.setFacts([f.kinds]); return;
  }
  if (!S.cmp) {
    lab.setReadout(L, W_.sub(L), W_.pre(placed), '#8fb06f');
    lab.setState({ emo: '📅', title: W_.title, lead: W_.lead, body: '', extra: fine });
    lab.setFacts([f.week3]);
  } else {
    lab.setReadout(L, W_.sub(L), W_.post, '#8fb06f');
    const v = S.verdict;
    lab.setState({ emo: v === 'ok' ? '✅' : '🤔', title: v === 'ok' ? W_.ok : v === 'sun' ? W_.sun : W_.bad(L), lead: W_.okLead, body: W_.body, extra: fine });
    lab.setFacts([f.week1, f.week2, f.week3]);
  }
}
render();
</script>
