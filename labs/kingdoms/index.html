    c.beginPath(); c.arc(x, y, rr_, 0, 7); c.fillStyle = 'rgba(255,253,244,.8)'; c.fill(); c.strokeStyle = 'rgba(176,138,84,.9)'; c.lineWidth = 1.1; c.stroke(); c.fillStyle = '#fff'; c.beginPath(); c.arc(x - rr_ * 0.35, y - rr_ * 0.35, rr_ * 0.28, 0, 7); c.fill(); }
  for (const q of YDOT) { const x = jx + 5 + q.u * (jw - 10), y = bot - q.v * (bot - top); c.beginPath(); c.arc(x, y, 3, 0, 7); c.fillStyle = '#c9b258'; c.fill(); c.strokeStyle = '#6f6430'; c.lineWidth = 1; c.stroke(); }
  c.restore();
  rr(c, jx, jy, jw, jh, 16); c.fillStyle = 'rgba(190,220,255,.07)'; c.fill(); c.strokeStyle = 'rgba(200,225,255,.75)'; c.lineWidth = 3; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(jx + 10, jy + 24); c.lineTo(jx + 10, jy + jh * 0.5); c.stroke();
  const y0 = bot - doughF(0) * inner; c.save(); c.setLineDash([5, 4]); c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(jx - 8, y0); c.lineTo(jx + jw + 8, y0); c.stroke(); c.restore();
  tagText(c, w, h, t.bread.mark, jx + jw + 8 + 26, y0);
  // the lens: one yeast cell and the bubbles it gives off
  const R = Math.min(w * 0.17, 62), lx = w * 0.8, ly = h * 0.3, nb = Math.floor((m / 60) * 8);
  c.beginPath(); c.arc(lx, ly, R, 0, 7); c.fillStyle = rg(c, lx - R * 0.3, ly - R * 0.3, 2, lx, ly, R, [[0, '#fdf3dc'], [1, '#e0c78c']]); c.fill();
  c.save(); c.beginPath(); c.arc(lx, ly, R - 2, 0, 7); c.clip();
  c.translate(lx, ly + R * 0.38); c.scale(R / 30, R / 30); drawYeastCell(c, { x: 0, y: 0, d: 20 }, R / 30);
  for (let i = 0; i < nb; i++) { const ph = (time * 0.5 + i / 8) % 1, bx = Math.sin(i * 2.3) * 9 + Math.sin(time + i) * 2, by = -10 - ph * 26, br = 2 + (i % 3);
    c.globalAlpha = 1 - ph * 0.5; c.beginPath(); c.arc(bx, by, br, 0, 7); c.fillStyle = 'rgba(255,255,255,.85)'; c.fill(); c.strokeStyle = 'rgba(150,115,70,.9)'; c.lineWidth = 0.9; c.stroke(); }
  c.restore();
  c.beginPath(); c.arc(lx, ly, R, 0, 7); c.strokeStyle = lg(c, lx - R, ly - R, lx + R, ly + R, [[0, '#f0d58a'], [0.5, '#b88a3a'], [1, '#6e4f1c']]); c.lineWidth = 5; c.stroke();
  if (nb > 0) tagText(c, w, h, t.bread.co2, lx, ly - R - 14);
  tagText(c, w, h, t.bread.cap, w / 2, h - 16, { size: 12 });
}
function rBread(t) {
  const b = t.bread, m = S.bt, ratio = doughF(m) / doughF(0), st = m < 3 ? b.t0 : b.tN;
  lab.setGlow('rgba(243, 178, 75, .22)'); $('btEnd').textContent = `60 ${b.min}`; $('bt').setAttribute('aria-label', b.min); $('bt').value = m;
  lab.setReadout(`${m} ${b.min}`, b.hgt(dec(ratio.toFixed(1))), m >= 3 ? b.co2 : '', '#f3b24b');
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: `<div class="kg-fine">${esc(b.fine)}</div>` });
  lab.setFacts(t.facts.bread);
}

// --- view 3: one question sorts the table ------------------------------------------------------------------------
function ruleTargets(w, h) {
  const out = {}, panels = [], q = S.q;
  if (!S.checked || !q) {
    const cw = (w - 16) / 3, chh = (h - 16) / 3, k = Math.min((cw - 14) / 100, (chh - 34) / 100, 0.8);
    ORDER.forEach((id, i) => { out[id] = { x: 8 + (i % 3 + 0.5) * cw, y: 8 + Math.floor(i / 3) * chh + 6 + k * 50, k, nm: 8 + Math.floor(i / 3) * chh + 6 + k * 100 + 14 }; });
    return { out, panels };
  }
  const groups = q === 'moves' ? ['yes', 'some', 'no'] : ['yes', 'no'], fr = q === 'moves' ? [0.29, 0.29, 0.42] : [0.5, 0.5], gap = 6, usable = w - 16 - gap * (groups.length - 1);
  let x = 8;
  groups.forEach((gname, gi) => {
    const pw = usable * fr[gi], ids = ORDER.filter((id) => valOf(id, q) === gname), ncols = pw > 130 ? 2 : 1, rows = Math.max(1, Math.ceil(ids.length / ncols)), hd = 28, rowh = Math.min(104, (h - 16 - hd - 6) / rows);
    const k = Math.min((pw / ncols - 8) / 100, (rowh - 22) / 100, 0.7);
    ids.forEach((id, i) => { const yy = 8 + hd + 4 + Math.floor(i / ncols) * rowh; out[id] = { x: x + ((i % ncols) + 0.5) * pw / ncols, y: yy + k * 50 + 2, k, nm: yy + k * 100 + 14 }; });
    panels.push({ g: gname, x, y: 8, w: pw, h: h - 16, n: ids.length }); x += pw + gap;
  });
  return { out, panels };
}
function drawRule(c, w, h, dt, time) {
  const t = T[lang], r = t.rule, gated = !S.checked;
  tableBG(c, w, h);
  const { out, panels } = ruleTargets(w, h); RG = out;
  const tint = { yes: '#3ddc97', no: '#98a0b8', some: '#f5c84c' };
  panels.forEach((p) => {
    rr(c, p.x, p.y, p.w, p.h, 14); c.fillStyle = 'rgba(255,255,255,.06)'; c.fill(); c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = 1.2; c.stroke();
    rr(c, p.x + 6, p.y + 6, p.w - 12, 22, 11); c.fillStyle = 'rgba(10,12,20,.55)'; c.fill();
    c.fillStyle = tint[p.g]; c.font = '900 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(`${r[p.g]} · ${p.n}`, p.x + p.w / 2, p.y + 18);
  });
  ORDER.forEach((id) => {
    const p = step(PR, id, out[id], dt);
    if (!panels.length) { c.save(); c.fillStyle = 'rgba(255,255,255,.07)'; rr(c, p.x - 46, p.y - p.k * 50 - 6, 92, p.k * 100 + 34, 14); c.fill(); c.restore(); }
    drawItem(c, id, p.x, p.y, p.k, gated ? 0.4 : 1);
    nameText(c, t.items[id][0], p.x, out[id].nm - 2 + (p.y - out[id].y), 90, '#e9dfcc');
    const ring = id === 'mushroom' ? KC.fungi : id === 'moss' || id === 'oak' ? KC.plant : null;
    if (ring && !gated) { c.save(); c.strokeStyle = ring; c.lineWidth = 3; c.globalAlpha = 0.9; c.beginPath(); c.arc(p.x, p.y, p.k * 56 + 3, 0, 7); c.stroke(); c.restore(); }
  });
  if (gated) tagText(c, w, h, r.gatePill, w / 2, h / 2, { size: 14 });
}
function rRule(t) {
  const r = t.rule, q = S.q, gated = !S.checked;
  lab.setGlow('rgba(193, 112, 74, .22)');
  $('gateBox').hidden = !gated || S.sec === 'giant'; $('gateBtn').textContent = r.gateGo;
  $('ruleQs').hidden = gated || S.sec === 'giant'; $('giantBox').hidden = S.sec !== 'giant';
  $('ruleQs').innerHTML = `<p class="kg-q">${esc(r.ask)}</p>` + ['light', 'moves', 'cells'].map((k) => `<button class="kg-opt${q === k ? ' on' : ''}" data-a="q" data-k="${k}">${esc(r.qs[k])}</button>`).join('');
  if (S.sec === 'giant') return rGiant(t);
  if (gated) { lab.setReadout('?', '', r.gatePill, '#c1704a'); lab.setState({ emo: '🧺', title: r.gate[0], lead: r.gate[1], body: '', extra: '' }); lab.setFacts([]); return; }
  if (!q) { lab.setReadout('?', '', '', '#c1704a'); lab.setState({ emo: '🔎', title: r.ask, lead: r.askLead, body: '', extra: '' }); lab.setFacts([]); return; }
  const cnt = (g) => ORDER.filter((id) => valOf(id, q) === g).length, split = valOf('mushroom', q) !== valOf('oak', q) && valOf('moss', q) !== valOf('mushroom', q);
  lab.setReadout(`${cnt('yes')} | ${cnt('no')}`, `${r.yes} | ${r.no}`, split ? r.pillOk : r.pillNo, '#c1704a');
  if (q === 'light') lab.setState({ emo: '✅', title: r.ok, lead: r.okLead, body: r.okBody, extra: '' }); else lab.setState({ emo: '🤔', title: r[q][0], lead: r[q][1], body: '', extra: '' });
  lab.setFacts(S.found ? t.facts.rule : []);
}

// --- secret: the giant fungus -------------------------------------------------------------------------------------
const gKey = (a) => (a > 40 ? 'near' : a > 0.8 ? 'mid' : 'far');
function drawGiant(c, w, h, dt, time) {
  const t = T[lang], a = gaOf(S.gz, w, h), key = gKey(a);
  if (key !== S.stageKey) { S.stageKey = key; render(); } else rdGiant(t, a);
  c.fillStyle = lg(c, 0, 0, 0, h, [[0, '#1f2d1d'], [1, '#121a12']]); c.fillRect(0, 0, w, h);
  c.save(); c.translate(w / 2, h / 2); c.scale(a, a); c.lineJoin = 'round'; c.lineCap = 'round';
  if (a > 12) for (const q of LITTER) { c.globalAlpha = clamp01((a - 12) / 40) * 0.5; c.fillStyle = q.c < 0.5 ? '#4a3a24' : '#2c3a22'; c.beginPath(); c.ellipse(q.x, q.y, q.rx, q.ry, q.a, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  const pa = clamp01((0.9 - a) / 0.7);
  if (pa > 0.01) { // the patch, with football pitches tiled over it
    c.beginPath(); BLOB.pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath();
    c.fillStyle = rg(c, 0, 0, 0, 0, 0, BLOB.rmax, [[0, `rgba(226,176,84,${0.55 * pa})`], [1, `rgba(190,140,60,${0.4 * pa})`]]); c.fill();
    c.save(); c.clip();
    if (a < 0.3) { c.globalAlpha = pa * clamp01((0.3 - a) / 0.15) * 0.4; c.strokeStyle = '#fff'; c.lineWidth = 1 / a * 0.8; c.beginPath();
      for (let x = -3000; x <= 3000; x += PITCH[0]) { c.moveTo(x, -3000); c.lineTo(x, 3000); } for (let y = -3000; y <= 3000; y += PITCH[1]) { c.moveTo(-3000, y); c.lineTo(3000, y); } c.stroke(); }
    c.restore(); c.globalAlpha = 1; c.strokeStyle = `rgba(255,224,150,${0.9 * pa})`; c.lineWidth = 2 / a; c.beginPath(); BLOB.pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); c.stroke();
  }
  const ra = clamp01((a - 0.6) / 4) * (1 - clamp01((a - 90) / 200));
  if (ra > 0.01) { c.globalAlpha = ra * 0.85; c.strokeStyle = '#120d0a'; c.lineWidth = Math.max(1.4, 0.06 * a) / a; for (const pts of RHIZ) { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.stroke(); } c.globalAlpha = 1; }
  if (a > 1.5) for (const q of MUSH) {
    const s = q.s, cap = q.c, aa = clamp01((a - 1.5) / 5);
    c.globalAlpha = aa; c.beginPath(); c.moveTo(q.x - cap * 0.22, q.y + cap * 0.2); c.lineTo(q.x - cap * 0.2, q.y + cap * 1.9 * s); c.lineTo(q.x + cap * 0.2, q.y + cap * 1.9 * s); c.lineTo(q.x + cap * 0.22, q.y + cap * 0.2); c.closePath(); c.fillStyle = '#e8d6a8'; c.fill();
    c.beginPath(); c.ellipse(q.x, q.y + cap * 0.2, cap, cap * 0.68, 0, Math.PI, 0); c.bezierCurveTo(q.x + cap, q.y + cap * 0.5, q.x - cap, q.y + cap * 0.5, q.x - cap, q.y + cap * 0.2); c.closePath();
    c.fillStyle = rg(c, q.x - cap * 0.3, q.y - cap * 0.3, 0, q.x, q.y, cap * 1.3, [[0, '#dcb066'], [1, '#8f6030']]); c.fill(); c.strokeStyle = '#5e3c1c'; c.lineWidth = 1.2 / a; c.stroke();
  }
  c.globalAlpha = 1;
  // a football pitch, for scale
  const px = BLOB.rmax * 0.3, py = -BLOB.rmax * 0.22;
  if (a > 0.04 && a < 12) {
    c.save(); c.translate(px, py); c.fillStyle = '#2f9a52'; c.fillRect(-PITCH[0] / 2, -PITCH[1] / 2, PITCH[0], PITCH[1]); c.strokeStyle = '#fff'; c.lineWidth = Math.max(1, 1.2 / a); c.strokeRect(-PITCH[0] / 2, -PITCH[1] / 2, PITCH[0], PITCH[1]);
    if (PITCH[0] * a > 30) { c.beginPath(); c.moveTo(0, -PITCH[1] / 2); c.lineTo(0, PITCH[1] / 2); c.stroke(); c.beginPath(); c.arc(0, 0, 9.15, 0, 7); c.stroke(); }
    c.restore();
  }
  c.restore();
  if (a > 0.04 && a < 12) { const sx = w / 2 + px * a, sy = h / 2 + py * a; tagText(c, w, h, t.giant.pitchCap, sx, sy - Math.max(26, PITCH[1] * a + 14)); }
  scaleBar(c, w, h, a, fmtM);
}
function rdGiant(t, a) {
  const g = t.giant, pa = clamp01((0.9 - a) / 0.7);
  lab.setReadout(fmtM(Math.max(1, $('cv').getBoundingClientRect().width) / a), g.viewLbl, pa > 0.3 ? g.pitches(fmtN(PITCH_N)) : '', '#d9b36a');
}
function rGiant(t) {
  const g = t.giant, w = $('cv').getBoundingClientRect().width || 340, h = $('cv').getBoundingClientRect().height || 400, a = gaOf(S.gz, w, h), key = gKey(a);
  lab.setGlow('rgba(143, 191, 106, .2)'); $('gzL').textContent = g.near[1]; $('gzR').textContent = `${dec((GA_M2 / 1e6).toFixed(1))} ${t.units.km}²`; $('gz').setAttribute('aria-label', g.zoomLbl);
  rdGiant(t, a);
  const st = key === 'far' ? g.far(dec((GA_M2 / 1e6).toFixed(1)), fmtN(PITCH_N)) : g[key];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: `<div class="kg-fine">${esc(g.fine)}</div>` });
  lab.setFacts(t.facts.giant);
}

// --- loop, events, render -----------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (lab.view === 'base') drawBase(c, w, h, dt, time);
  else if (lab.view === 'scope') (S.sec === 'bread' ? drawBread : drawScope)(c, w, h, dt, time);
  else (S.sec === 'giant' ? drawGiant : drawRule)(c, w, h, dt, time);
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(); if (lab.view === 'base') baseTap(ev.clientX - r.left, ev.clientY - r.top);
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a === 'plant' || a === 'animal') return place(a);
  if (a === 'check') { mainBase(); return render(); }
  if (a === 'g2') { S.g2 = b.dataset.k; S.moved = false; S.pT = 0.75; (S.g2 === 'y' ? sfx.good : sfx.bad)(); showStage(); return render(); }
  if (a === 'q') { S.q = b.dataset.k; if (S.q === 'light') { if (!S.found) sfx.good(); S.found = true; } else sfx.bad(); showStage(); return render(); }
  if (a === 'gate') return $('views').querySelector('[data-view="base"]').click();
  if (a === 'sec') {
    const k = b.dataset.k; if (!secret.unlocked()) return secret.open();
    const want = k === 'bread' ? 'scope' : 'rule';
    if (lab.view !== want) { $('views').querySelector(`[data-view="${want}"]`).click(); S.sec = k; } else S.sec = S.sec === k ? null : k;
    S.stageKey = ''; sfx.click(); render();
  }
});
$('zoom').addEventListener('input', (ev) => {
  let v = ev.target.value / 1000; if (S.g2 === null && v > 0.3) { v = 0.3; ev.target.value = 300; }
  S.p = S.pT = v; S.moved = true; render();
});
$('bt').addEventListener('input', (ev) => { S.bt = +ev.target.value; render(); });
$('gz').addEventListener('input', (ev) => { S.gz = ev.target.value / 1000; S.stageKey = ''; render(); });

function render() {
  const v = lab.view, t = T[lang], open = secret.unlocked();
  document.body.dataset.v = v;
  $('s1').hidden = v !== 'base'; $('s2').hidden = v !== 'scope'; $('s3').hidden = v !== 'rule'; $('secRow').hidden = v === 'base';
  const sc = (k, emo, idx) => `<button class="chip kg-b secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-a="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('bread', '🍞') + sc('giant', '🍄');
  if (v === 'base') rBase(t); else if (v === 'scope') rScope(t); else rRule(t);
}
render();
</script>
