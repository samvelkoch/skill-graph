  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = lab.view;
  if (a === 'opt') {
    const key = v === 'power' ? 'p1' : v === 'army' ? 'a2' : 'p3';
    if (S[key] !== null) return;
    S[key] = +b.dataset.i; (S[key] === OK[key] ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'part') { S.sel = b.dataset.k; beamV += 0.5; sfx.tick(); }
  else if (a === 'year') { S.prevYr = S.yr1; S.yr1++; S.yrT = 0; S.sel = 'yr'; sfx.click(); showStage(); }
  else if (a === 'stop') { S.yv = clamp(STOPS[0] - +b.dataset.y, 0, SPAN); sfx.click(); }
  else if (a === 'sort') {
    const card = T[lang].pt.F[ORD[S.si]], c = +b.dataset.c, ok = c === card[1];
    S.sres[S.si] = ok; S.sfb = { ok }; (ok ? sfx.good : sfx.bad)();
  } else if (a === 'next') { S.si++; S.sfb = null; sfx.click(); }
  else if (a === 'again') { S.si = 0; S.sres = []; S.sfb = null; sfx.click(); }
  else if (a === 'gotoarmy') { $('views').querySelector('[data-view=army]')?.click(); return; }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  }
  render();
});
$('rfYr').addEventListener('input', (ev) => { S.yv = clamp(+ev.target.value, 0, SPAN); render(); });

// --- one render per change ---------------------------------------------------------------------------------------
const askHTML = (q, opts) => `<p class="rf-q">${esc(q)}</p><div class="rf-opts">${opts.map((o, i) => `<button class="rf-opt" data-act="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
const doneHTML = (q, opts, key, reveal, t) => {
  const ok = S[key] === OK[key];
  return `<p class="rf-q small">${esc(q)}</p><p class="rf-ans ${ok ? 'good' : 'bad'}"><b>${esc(ok ? t.right : t.wrong)}</b>${esc(opts[OK[key]])}. ${esc(reveal)}</p>`;
};
const fine = (t) => `<div class="rf-fine">${esc(t.illus)}</div>`;

function render() {
  const t = T[lang], v = lab.view;
  $('rfSlide').hidden = !(v === 'army' && S.a2 !== null);
  if (v === 'power') rPower(t); else if (v === 'army') rArmy(t); else rTitles(t);
  const open = secret.unlocked();
  $('rfSec').innerHTML = ['a', 'b'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${t.sec[k].emo} ${esc(t.sec[k].chip)}` : '🔒 ???'}</button>`).join('');
  if (S.sec) {
    const sc = t.sec[S.sec];
    lab.setState({ emo: sc.emo, title: sc.title, lead: sc.lead, body: sc.body, extra: '' }); lab.setFacts([sc.fact]);
  }
}

function rPower(t) {
  const p = t.pw, g = $('rfMain');
  lab.setGlow('rgba(199, 154, 58, .26)');
  if (S.p1 === null) {
    g.innerHTML = askHTML(p.q, p.opts);
    lab.setReadout('2', p.rd, '', '#c79a3a');
    lab.setState({ emo: '⚖️', title: p.pre[0], lead: p.pre[1], body: '', extra: fine(t) }); lab.setFacts([]);
    return;
  }
  g.innerHTML = doneHTML(p.q, p.opts, 'p1', p.reveal, t) + `<p class="rf-note" style="margin:0 0 8px">${esc(p.tap)}</p>
    <div class="chips">${['senate', 'assem', 'cons', 'army'].map((k) => `<button class="chip ${S.sel === k ? 'on' : ''}" data-act="part" data-k="${k}">${esc(p.parts[k])}</button>`).join('')}</div>
    <div class="row2"><button class="btn" data-act="year">${esc(p.year)}</button></div>`;
  lab.setReadout('2', p.rd, p.yr(S.yr1), '#c79a3a');
  const ok = S.p1 === OK.p1;
  if (S.sel === 'ans') lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: p.reveal, body: '', extra: fine(t) });
  else if (S.sel === 'yr') { const [ti, le] = p.yrCard(S.yr1); lab.setState({ emo: '🗓️', title: ti, lead: le, body: '', extra: fine(t) }); }
  else lab.setState({ emo: { senate: '🏛️', assem: '🗳️', cons: '🪑', army: '🛡️' }[S.sel], title: p.roles[S.sel][0], lead: p.roles[S.sel][1], body: '', extra: fine(t) });
  lab.setFacts(t.facts.p);
}

function rArmy(t) {
  const p = t.pa, g = $('rfMain');
  lab.setGlow('rgba(139, 79, 176, .26)');
  if (S.a2 === null) {
    g.innerHTML = askHTML(p.q, p.opts);
    lab.setReadout(t.bc(STOPS[0]), '', t.pill, '#8b4fb0');
    lab.setState({ emo: '🛡️', title: p.pre[0], lead: p.pre[1], body: '', extra: fine(t) }); lab.setFacts([]);
    return;
  }
  g.innerHTML = doneHTML(p.q, p.opts, 'a2', p.reveal, t);
  const year = yearOf(S.yv), si = stopOf(year), card = p.cards[si];
  $('rfSlideLab').textContent = `${p.slide}: ${t.bc(year)}`;
  const yr = $('rfYr'); if (+yr.value !== S.yv) yr.value = S.yv;
  $('rfStops').innerHTML = STOPS.map((y, i) => `<button class="chip ${i === si ? 'on' : ''}" data-act="stop" data-y="${y}">${esc(p.chips[i])}</button>`).join('');
  lab.setReadout(t.bc(year), p.rd, t.pill, '#8b4fb0');
  lab.setState({ emo: ['🌾', '🪖', '🌊', '📜', '⚓', '🌿'][si], title: card[0], lead: card[1], body: '', extra: fine(t) });
  lab.setFacts(t.facts.a);
}

function rTitles(t) {
  const p = t.pt, g = $('rfMain'), placed = S.sres.length;
  lab.setGlow('rgba(166, 58, 54, .24)');
  if (S.p3 === null) {
    g.innerHTML = askHTML(p.q, p.opts);
    lab.setReadout('?', p.rd, '', '#a63a36');
    lab.setState({ emo: '📜', title: p.pre[0], lead: p.pre[1], body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  let html = doneHTML(p.q, p.opts, 'p3', p.reveal, t);
  const k = S.sres.filter(Boolean).length;
  lab.setFacts(t.facts.t);
  lab.setReadout(`${placed}/6`, p.rd, '', '#a63a36');
  if (S.a2 === null) {
    g.innerHTML = html + `<p class="rf-note">${esc(p.gate)}</p><div class="row2"><button class="btn" data-act="gotoarmy">${esc(p.gateBtn)}</button></div>`;
    lab.setState({ emo: '🛡️', title: p.pre[0], lead: p.gate, body: '', extra: '' });
    return;
  }
  if (S.si >= 6) {
    g.innerHTML = html + `<div class="row2"><button class="btn" data-act="again">${esc(p.again)}</button></div>`;
    lab.setReadout(`${k}/6`, p.rd, '', '#a63a36');
    lab.setState({ emo: '🏆', title: p.end(k), lead: p.endLead, body: p.endBody(SPAN), extra: '' });
    return;
  }
  const card = p.F[ORD[S.si]];
  html += `<div class="rf-cnt">${esc(p.of(S.si + 1))}</div><div class="rf-card">${esc(card[0])}</div>`;
  if (S.sfb === null) {
    html += `<div class="rf-two"><button class="rf-opt" data-act="sort" data-c="0">${esc(p.same)}</button><button class="rf-opt" data-act="sort" data-c="1">${esc(p.diff)}</button></div>`;
    lab.setState({ emo: '📜', title: p.of(S.si + 1), lead: p.lead, body: '', extra: '' });
  } else {
    html += `<p class="rf-ans ${S.sfb.ok ? 'good' : 'bad'}"><b>${esc(S.sfb.ok ? t.right : t.wrong)}</b>${esc(card[1] === 0 ? p.same : p.diff)}. ${esc(card[2])}</p>
      <div class="row2"><button class="btn" data-act="next">${esc(p.next)}</button></div>`;
    lab.setState({ emo: S.sfb.ok ? '✅' : '🤔', title: S.sfb.ok ? t.right : t.wrong, lead: card[2], body: '', extra: '' });
  }
  g.innerHTML = html;
}
render();
</script>
</body>
</html>
