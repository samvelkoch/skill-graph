function drawRing(ctx, tt, photo) {
  disc(ctx, CC.x, CC.y, 62, null, null);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
  const g = ctx.createRadialGradient(CC.x - 20, CC.y - 25, 6, CC.x, CC.y, 64); g.addColorStop(0, 'rgba(255,226,140,.75)'); g.addColorStop(1, 'rgba(240,180,70,.45)');
  disc(ctx, CC.x, CC.y, 62, g); ctx.restore(); disc(ctx, CC.x, CC.y, 62, null, '#c58a2c', 2);
  KIDS.forEach((o, i) => { const [x, y] = ringPos(i); kid(ctx, x, y + Math.sin(tt * (photo ? 4 : 2) + i) * (photo ? 3 : 1.5), 0.62, o, photo ? 1 : 0); });
}
function drawClass(ctx, tt) {
  drawRing(ctx, tt, S.photoT > 0);
  S.centre.forEach((ci, k) => {
    if (S.rev && S.rev.card === ci && tt < S.rev.flyT) return;
    const a = S.rev && S.rev.card === ci ? (tt - S.rev.flyT) / 0.8 : 9, e = eo3(a);
    tile(ctx, lerp(180, CSLOT[k][0], e), lerp(24, CSLOT[k][1], e) - Math.sin(Math.PI * c01(a)) * 30, 34, CCARDS[ci].e, 1 + 0.1 * Math.max(0, Math.sin(Math.PI * c01((a - 1) * 4))));
  });
  if (S.centre.length) { ctx.font = FONT(14); ctx.fillStyle = '#4a3410'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(T[lang].cls.centre, CC.x, 250); }
  const R = S.rev;
  if (S.sel !== null && !(R && R.done)) { // the card under test sits in a banner, its result still hidden
    pill(ctx, `${CCARDS[S.sel].e}  ${T[lang].cls.cards[S.sel]}`, 180, 22);
  }
  if (R) {
    CCARDS[R.card].h.forEach((h, i) => {
      const a = (tt - R.t0 - i * 0.14) / 0.35; if (a <= 0) return;
      const [x, y] = ringPos(i), sc = eob(a);
      ctx.save(); ctx.translate(x, y - 32); ctx.scale(sc, sc);
      disc(ctx, 0, 0, 11, h ? '#2fbf7a' : '#e5584a', '#fff', 1.5);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.beginPath();
      if (h) { ctx.moveTo(-5, 0); ctx.lineTo(-1.5, 4); ctx.lineTo(5, -4); } else { ctx.moveTo(-4, -4); ctx.lineTo(4, 4); ctx.moveTo(4, -4); ctx.lineTo(-4, 4); }
      ctx.stroke(); ctx.restore();
    });
    if (!R.shared) { // a card that not everyone shares falls out of the circle
      const a = (tt - R.t0 - 1.5) / 0.9;
      if (a > 0 && a < 1) { ctx.save(); ctx.globalAlpha = 1 - a * a; ctx.translate(180 + a * 40, 24 + a * a * 330); ctx.rotate(a * 2); tile(ctx, 0, 0, 34, CCARDS[R.card].e, 1, 1); ctx.restore(); }
    }
  }
  if (S.photoT > 0) {
    ctx.save(); rr(ctx, 6, 6, W - 12, H - 12, 12); ctx.lineWidth = 8; ctx.strokeStyle = '#f6f2e8'; ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 8; ctx.stroke(); ctx.restore();
    pill(ctx, T[lang].cls.cap, 180, 26);
    const fl = c01(1 - (tt - S.photoT) / 0.7); if (fl > 0) { ctx.fillStyle = `rgba(255,255,255,${fl * 0.85})`; ctx.fillRect(0, 0, W, H); }
  }
}

// --- secrets -----------------------------------------------------------------------------------------------------------
const MIN = [[[3, 0.8], [5, 2.4], [7, 4.1], [8, 5.5], [4, 3.3]], [[2, 1.5], [6, 0.4], [5, 3.9], [9, 2.1], [7, 5.2]]];
const ringR = (k, a, seed) => k * 6.2 * (1 + 0.07 * Math.sin(3 * a + seed * 1.7 + k * 0.3) + 0.05 * Math.sin(5 * a + seed * 2.9));
function print(ctx, cx, cy, R, seed, zt) {
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
  const pg = ctx.createRadialGradient(cx - 20, cy - 25, 5, cx, cy, R); pg.addColorStop(0, '#f8ecdc'); pg.addColorStop(1, '#e3cfb6'); ctx.fillStyle = pg; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  const z = 1 + zt * 1.25; ctx.translate(cx, cy); ctx.scale(z, z);
  ctx.strokeStyle = '#8a4f3a'; ctx.lineWidth = 2.3; ctx.lineCap = 'round';
  for (let k = 1; k <= 12; k++) {
    const g0 = seed * 1.3 + k * 0.9, gap = 0.45 + (k % 3) * 0.15; ctx.beginPath();
    for (let a = g0 + gap; a <= g0 + Math.PI * 2; a += 0.1) { const r = ringR(k, a, seed); const px = r * Math.cos(a) * 0.85, py = r * Math.sin(a) * 1.08 + (seed - 1) * 4; a === g0 + gap ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
    ctx.stroke();
  }
  if (zt > 0.3) MIN[seed - 1].forEach(([k, a]) => { const r = ringR(k, a, seed); disc(ctx, r * Math.cos(a) * 0.85, r * Math.sin(a) * 1.08 + (seed - 1) * 4, 3.4, '#ffd24a', '#7a4a00', 1.2); });
  ctx.restore();
  ctx.save(); ctx.strokeStyle = '#c9b79a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
function drawFp(ctx, tt, dt) {
  S.zt = lerp(S.zt, S.zoom, Math.min(1, dt * 5));
  const twin = { skin: '#f2c9a5', hair: '#8a4a2a', style: 'short', shirt: '#7aa0e8' };
  [95, 265].forEach((x, i) => { kid(ctx, x, 52 + Math.sin(tt * 2 + i) * 1.5, 0.6, twin); pill(ctx, T[lang].fp.twin[i], x, 138); print(ctx, x, 245, 78, i + 1, S.zt); });
}
function drawHello(ctx, tt) {
  drawRing(ctx, tt, false);
  S.helloQ.forEach((q) => { if (tt >= q.at && !S.said[q.i]) { S.said[q.i] = tt; sfx.click(); render(); } });
  KIDS.forEach((_, i) => {
    const at = S.said[i]; if (!at) return; const a = tt - at; if (a > 2.6) return;
    const [x, y] = ringPos(i), sc = eob(a / 0.35);
    ctx.save(); ctx.globalAlpha = c01((2.6 - a) * 3); ctx.translate(x, y - 38); ctx.scale(sc, sc); ctx.translate(-x, -(y - 38));
    pill(ctx, HELLO[i], x, y - 38, 16); ctx.restore();
  });
}

const loop = canvasLoop(cv, (ctx, w, h, dt, t) => {
  backdrop(ctx, w, h);
  const s = Math.min(w / W, h / H); ctx.save(); ctx.translate((w - W * s) / 2, (h - H * s) / 2); ctx.scale(s, s);
  const tt = now(), v = lab.view;
  if (S.sec === 'fp') drawFp(ctx, tt, dt); else if (S.sec === 'hello') drawHello(ctx, tt);
  else if (v === 'two') drawTwo(ctx, t, tt); else if (v === 'look') drawLook(ctx, tt, dt); else drawClass(ctx, tt);
  ctx.restore();
});

// --- input ----------------------------------------------------------------------------------------------------------------
let drag = false;
cv.addEventListener('pointerdown', (ev) => {
  const p = toD(ev);
  if (S.sec === 'hello') { KIDS.forEach((_, i) => { const [x, y] = ringPos(i); if (Math.hypot(p.x - x, p.y - (y + 30)) < 42) { S.said[i] = now(); sfx.click(); render(); } }); return; }
  if (lab.view !== 'look' || S.sec) return;
  drag = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ }
  const dy = ev.pointerType === 'touch' ? 34 : 0; S.lens.x = S.lensT.x = clamp(p.x, 10, W - 10); S.lens.y = S.lensT.y = clamp(p.y - dy, 10, H - 10); checkFound();
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return; const p = toD(ev), dy = ev.pointerType === 'touch' ? 34 : 0;
  S.lens.x = S.lensT.x = clamp(p.x, 10, W - 10); S.lens.y = S.lensT.y = clamp(p.y - dy, 10, H - 10); checkFound();
});
['pointerup', 'pointercancel'].forEach((e) => cv.addEventListener(e, () => { drag = false; }));

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function pickTwo(c) {
  const card = CARDS[S.i];
  if (c !== card.w) { S.wrongAt = now(); S.msg = 'no'; sfx.bad(); render(); return; }
  S.placed[S.i] = { w: c, t0: now(), landed: false }; if (c === 'b') S.mid++;
  S.msg = c; sfx.snap(); S.i++; S.curT = now() + 0.6; if (S.i >= 10) showStage(); render();
}
function resetTwo() { Object.assign(S, { g: 5, locked: false, i: 0, placed: [], mid: 0, msg: null, wrongAt: -9, glowT: -9 }); }
function predict(v) {
  const sh = CCARDS[S.sel].h.every(Boolean), t0 = now();
  S.pred = v; S.rev = { card: S.sel, t0, shared: sh, done: false, flyT: t0 + 1.6 }; S.tried[S.sel] = sh; if (sh) S.centre.push(S.sel);
  sfx.click(); showStage(); render();
  setTimeout(() => {
    if (!S.rev || S.rev.card !== S.sel) return;
    S.rev.done = true; (sh === (v === 'yes') ? sfx.good : sfx.bad)();
    if (S.centre.length >= SHARED_N && S.photoT <= 0) S.photoT = now();
    render();
  }, sh ? 2000 : 2500);
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click();
    if (k === 'fp') { S.zoom = 0; S.zt = 0; }
    if (k === 'hello') { S.said = {}; S.helloQ = []; }
  } else if (a === 'gdec') { S.g = clamp(S.g - 1, 0, 10); sfx.tick(); }
  else if (a === 'ginc') { S.g = clamp(S.g + 1, 0, 10); sfx.tick(); }
  else if (a === 'lock') { S.locked = true; S.curT = now(); sfx.click(); }
  else if (a === 'pick') pickTwo(k);
  else if (a === 'again2') { resetTwo(); sfx.click(); }
  else if (a === 'lens') { S.lensT = k === '0' ? { x: 95, y: 215 } : { x: 265, y: 215 }; sfx.click(); }
  else if (a === 'card') { if (S.tried[+k] === undefined) { S.sel = +k; S.pred = null; S.rev = null; sfx.click(); } }
  else if (a === 'pred') predict(k);
  else if (a === 'again3') { Object.assign(S, { sel: null, pred: null, rev: null, tried: {}, centre: [], photoT: -9 }); sfx.click(); }
  else if (a === 'zoom') { S.zoom = S.zoom ? 0 : 1; sfx.click(); }
  else if (a === 'hello') { const tt = now(); S.said = {}; S.helloQ = KIDS.map((_, i) => ({ i, at: tt + i * 0.55 })); sfx.click(); }
  render();
});

// --- one render per change ------------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('ctrlBody').dataset.v = v;
  cv.style.touchAction = v === 'look' && !S.sec ? 'none' : '';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('c-sec').innerHTML = sc('fp', '🖐️') + sc('hello', '👋');
  lab.setFacts(t.facts[v]);
  if (S.sec === 'fp') return renderFp(t);
  if (S.sec === 'hello') return renderHello(t);
  if (v === 'two') renderTwo(t); else if (v === 'look') renderLook(t); else renderClass(t);
}
function renderTwo(t) {
  const q = t.two, m = $('c-main'); lab.setGlow('rgba(232, 128, 106, .24)');
  if (!S.locked) {
    m.innerHTML = `<div class="sd-q">${esc(q.gQ)}</div><div class="sd-step"><button class="sd-sb" data-act="gdec" aria-label="−"${S.g <= 0 ? ' disabled' : ''}>−</button><span class="sd-g">${S.g}</span><button class="sd-sb" data-act="ginc" aria-label="+"${S.g >= 10 ? ' disabled' : ''}>+</button></div><button class="btn sd-big" data-act="lock">${esc(q.lock)}</button>`;
    lab.setReadout(String(S.g), q.gSub, '', '#e8806a');
    lab.setState({ emo: '🤔', title: q.gTitle, lead: q.gLead, body: '', extra: '' });
    return;
  }
  if (S.i < 10) {
    const c = t.cards[S.i], ok = S.msg && S.msg !== 'no';
    m.innerHTML = `<div class="sd-bubs"><div class="sd-bub sd-bz"><b>${esc(q.says[0])}</b>${esc(c.z)}</div><div class="sd-bub sd-bo"><b>${esc(q.says[1])}</b>${esc(c.o)}</div></div>
      <div class="sd-pick"><button class="z" data-act="pick" data-k="z">${esc(q.pick[0])}</button><button class="b" data-act="pick" data-k="b">🤝 ${esc(q.pick[1])}</button><button class="o" data-act="pick" data-k="o">${esc(q.pick[2])}</button></div>`;
    lab.setReadout(String(S.mid), q.mid, q.cardOf(S.i + 1), '#e8806a');
    lab.setState({ emo: S.msg === 'no' ? '🤔' : '🧩', title: q.sTitle, lead: S.msg === 'no' ? q.no : ok ? q.ok[S.msg] : q.sLead, body: '', extra: '' });
    return;
  }
  const hit = S.g === S.mid;
  m.innerHTML = `<div class="sd-q">${esc(hit ? q.right : q.miss(S.mid))}</div><p class="sd-note">${esc(q.yours(S.g))}</p><button class="btn sd-big" data-act="again2">${esc(q.again)}</button>`;
  lab.setReadout(String(S.mid), q.mid, q.yours(S.g), '#e8806a');
  lab.setState({ emo: hit ? '✅' : '🤝', title: hit ? q.right : q.miss(S.mid), lead: q.dLead, body: '', extra: '' });
}
function renderLook(t) {
  const q = t.look, n = nFound(); lab.setGlow('rgba(242, 193, 78, .22)');
  $('c-main').innerHTML = `<p class="sd-note">${esc(q.drag)}</p><div class="row2" style="margin-top:0"><button class="chip" data-act="lens" data-k="0">${esc(q.toZ)}</button><button class="chip" data-act="lens" data-k="1">${esc(q.toO)}</button></div>`;
  lab.setReadout(`${n}/8`, '', '', '#f2c14e');
  const names = [t.zoe, t.omar];
  const list = [0, 1].map((k) => q.items.map((it, j) => S.found[`${k}${j}`] ? `${SPOT_E[j]} ${esc(it)}` : null).filter(Boolean).length ? `<div class="fine"><b>${esc(names[k])}:</b> ${q.items.map((it, j) => S.found[`${k}${j}`] ? `${SPOT_E[j]} ${esc(it)}` : null).filter(Boolean).join(' · ')}</div>` : '').join('');
  lab.setState(n === 0 ? { emo: '👀', title: q.t0, lead: q.l0, body: '', extra: '' }
    : n < 8 ? { emo: '🔍', title: q.tN(n), lead: q.lN, body: '', extra: list }
    : { emo: '💛', title: q.tD, lead: q.lD, body: '', extra: list });
}
function renderClass(t) {
  const q = t.cls, R = S.rev, m = $('c-main'); lab.setGlow('rgba(240, 180, 70, .24)');
  const cards = `<div class="sd-cards">${q.cards.map((c, i) => `<button data-act="card" data-k="${i}" class="${S.sel === i ? 'on' : ''} ${R && !R.done && R.card === i ? '' : S.tried[i] === true ? 'yes' : S.tried[i] === false ? 'no' : ''}"${S.tried[i] !== undefined ? ' disabled' : ''}><span class="e">${CCARDS[i].e}</span><span>${esc(c)}</span></button>`).join('')}</div>`;
  const photo = S.photoT > 0 && R && R.done;
  if (S.sel === null) m.innerHTML = `<p class="sd-note">${esc(q.pick)}</p>${cards}`;
  else if (!S.pred) m.innerHTML = `<div class="sd-q">${esc(q.q)}</div><div class="sd-yn"><button data-act="pred" data-k="yes">${esc(q.yes)}</button><button data-act="pred" data-k="no">${esc(q.no)}</button></div>`;
  else m.innerHTML = `<p class="sd-note">${esc(R.done ? q.pick : q.wait)}</p>${cards}${S.centre.length || Object.keys(S.tried).length ? `<button class="chip" data-act="again3">${esc(q.again)}</button>` : ''}`;
  if (S.sel !== null && S.pred && R.done) { /* the cards stay visible for the next pick */ }
  lab.setReadout(String(S.centre.filter((ci) => !R || R.done || R.card !== ci).length), q.sub, '', '#f0b446');
  if (S.sel === null) lab.setState({ emo: '🏫', title: q.t0, lead: q.l0, body: '', extra: '' });
  else if (!S.pred) lab.setState({ emo: '🤔', title: q.q, lead: `${CCARDS[S.sel].e} ${q.cards[S.sel]}`, body: '', extra: '' });
  else if (!R.done) lab.setState({ emo: '👀', title: q.wait, lead: '', body: '', extra: '' });
  else {
    const hit = R.shared === (S.pred === 'yes'), n = CCARDS[R.card].h.filter(Boolean).length;
    lab.setState(photo ? { emo: '📸', title: q.tP, lead: q.lP, body: '', extra: '' }
      : { emo: hit ? '✅' : '🤔', title: hit ? q.rightV : q.missV, lead: R.shared ? q.yesL : q.noL(n), body: '', extra: '' });
  }
}
function renderFp(t) {
  const q = t.fp; lab.setGlow('rgba(200, 160, 120, .24)');
  $('c-main').innerHTML = `<button class="btn sd-big" data-act="zoom">${esc(S.zoom ? q.out : q.zoom)}</button>`;
  lab.setReadout(S.zoom ? '×2' : '×1', q.sub, '', '#c8a078');
  lab.setState({ emo: '🖐️', title: q.t, lead: q.l, body: '', extra: '' });
}
function renderHello(t) {
  const q = t.hello, n = Object.keys(S.said).length; lab.setGlow('rgba(240, 180, 70, .24)');
  $('c-main').innerHTML = `<button class="btn sd-big" data-act="hello">${esc(q.say)}</button>`;
  lab.setReadout(`${n}/8`, q.sub, '', '#f0b446');
  lab.setState({ emo: '👋', title: q.t, lead: q.l, body: '', extra: '' });
}
render();
</script>
