<style>
  /* no gauge in this lab: give its column back to the stage */

  }
  .ask { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); width: min(560px, calc(100% - 16px)); padding: 14px 16px;

  .ask p { margin: 0 0 10px; color: var(--soft); font-size: 13px; }

  .zoom { display: inline-flex; gap: 4px; }

  .chip.go { background: var(--red); border-color: var(--red); color: #fff; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin: 2px 0 8px; }

// how many planets of this size would fit in the empty gap to the nearest neighbour (km / km), 2 significant digits

  const g = Math.min(...[PLANETS[i - 1], PLANETS[i + 1]].filter(Boolean).map((q) => Math.abs(q.a - p.a) * 1e6));

});

// --- the scale model: everything on screen comes from here ---------------------------------------------------
function model() {
  const sun = SUNS.find((s) => s.k === S.sun) ?? SUNS[1], k = sun.m / SUN_KM; // metres of model per km of space
  return {
    sun, k, sunM: sun.m,
    pl: PLANETS.map((p) => ({ ...p, size: p.d * k, dist: p.a * 1e6 * k })),
    vc: C_KMS * k,                       // light speed in the model, m/s
    prox: PROXIMA_LY * LY_KM * k,        // Proxima Centauri, m
  };
}
const nf = (x, o) => new Intl.NumberFormat(lang, o).format(x);
function len(m) {
  const U = T[lang].u;
  if (m <= 0) return `0 ${U.m}`;
  let v, u;
  if (m >= 999.5) { v = m / 1000; u = U.km; } else if (m >= 0.995) { v = m; u = U.m; } else if (m >= 0.00995) { v = m * 100; u = U.cm; } else { v = m * 1000; u = U.mm; }
  return `${nf(v, v >= 100 ? { maximumFractionDigits: 0 } : v >= 10 ? { maximumFractionDigits: 1 } : { maximumSignificantDigits: 2 })} ${u}`;
}
function dur(s) {
  const t = T[lang], U = t.tu;
  if (s < 59.5) return `${nf(s, { maximumFractionDigits: s < 10 && s > 0 ? 1 : 0 })} ${U.s}`;
  if (s < 3599.5) { let mi = Math.floor(s / 60), se = Math.round(s - mi * 60); if (se === 60) { mi++; se = 0; } return se ? `${mi} ${U.min} ${se} ${U.s}` : `${mi} ${U.min}`; }
  if (s < 2 * 86400) { let hh = Math.floor(s / 3600), mi = Math.round((s - hh * 3600) / 60); if (mi === 60) { hh++; mi = 0; } return mi ? `${hh} ${U.h} ${mi} ${U.min}` : `${hh} ${U.h}`; }
  const d = Math.round(s / 86400); return `${nf(d)} ${t.days(d)}`;
}
const steps = (m) => { const n = Math.round(m / STEP); return `${nf(n)} ${T[lang].steps(n)}`; };
function like(m) {
  if (m < 0.0007) return 'tiny';
  let best = null, bd = Math.log(1.5);
  for (const [k, s] of OBJ) { const d = Math.abs(Math.log(m / s)); if (d < bd) { bd = d; best = k; } }
  return best;
}
const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const niceStep = (x) => { const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p; };

// --- camera helpers (metres of the model; x = 0 is the centre of the Sun) ----------------------------------
const defaultCam = (w = G.w) => { const m = model(), mpp = m.pl[2].dist * 1.25 / w; return { x0: -0.08 * w * mpp, mpp }; };

const starCam = (w = G.w) => { const m = model(), mpp = m.prox * 1.12 / w; return { x0: -0.04 * w * mpp, mpp }; };

function zoomAt(px, f) {
  const [lo, hi] = mppLimits(), c = S.cam, world = c.x0 + px * c.mpp;
  c.mpp = clamp(c.mpp * f, lo, hi); c.x0 = world - px * c.mpp;
}
function flyTo(xm, mpp) { S.camTo = { cx: xm, mpp }; S.follow = null; }

// --- switching views (with the "fly apart" animation) ------------------------------------------------------
function goView(v, viaButton) {

  if (from !== v) S.morph = { from, to: v, t: 0, dur: from === 'book' && v === 'walk' ? 2.6 : 1.6, fromCam: { ...S.cam } };
  S.prevView = v;

}

const STARS = Array.from({ length: 140 }, () => [Math.random(), Math.random(), Math.random()]);
function starfield(c, w, h) {
  for (const [x, y, b] of STARS) { c.fillStyle = `rgba(220,228,255,${0.12 + 0.35 * b})`; c.fillRect(x * w, y * h, b > 0.85 ? 1.6 : 1, b > 0.85 ? 1.6 : 1); }
}
const font = (wt, px) => `${wt} ${px}px Nunito, sans-serif`;
function sunDisc(c, x, y, r, glow = true) {
  if (glow && r > 0.3) {
    const g = c.createRadialGradient(x, y, r * 0.9, x, y, r * 1.35 + 2);
    g.addColorStop(0, 'rgba(255,190,70,.45)'); g.addColorStop(1, 'rgba(255,150,40,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r * 1.35 + 2, 0, 7); c.fill();
  }
  const g2 = c.createRadialGradient(x - r * 0.25, y - r * 0.25, r * 0.1, x, y, Math.max(r, 0.01));
  g2.addColorStop(0, '#fff6c8'); g2.addColorStop(0.6, '#ffcf4a'); g2.addColorStop(1, '#ff9a2a');
  c.fillStyle = g2; c.beginPath(); c.arc(x, y, Math.max(r, 0.01), 0, 7); c.fill();
}
function planetDisc(c, p, x, y, r) {
  if (p.k === 'saturn' && r > 0.8) {
    c.strokeStyle = 'rgba(232,210,154,.75)'; c.lineWidth = Math.max(0.6, r * 0.28);
    c.beginPath(); c.ellipse(x, y, r * 2.2, r * 0.6, -0.25, 0, 7); c.stroke();
  }
  if (r > 3) {
    const g = c.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, p.col); g.addColorStop(1, 'rgba(10,12,20,.9)');
    c.fillStyle = g;
  } else c.fillStyle = p.col;
  c.beginPath(); c.arc(x, y, Math.max(r, 0.01), 0, 7); c.fill();
}
function ring(c, x, y, col, rad = 9) {
  c.save(); c.strokeStyle = col; c.globalAlpha = 0.85; c.lineWidth = 1.4; c.setLineDash([3, 3]);
  c.beginPath(); c.arc(x, y, rad, 0, 7); c.stroke(); c.restore();
}

// layouts: where the Sun and the planets sit in each view (screen pixels)
const BOOK_R = [0.45, 0.75, 0.8, 0.6, 1.7, 1.45, 1.1, 1.05];
function bookLayout(w, h) {
  const cy = h * 0.56, R = h * 0.42, sx = -R * 0.55;
  const x0 = sx + R + w * 0.06, x1 = w - 22, slot = (x1 - x0) / 8, s = Math.min(h * 0.06, slot / 3.6);
  return { sun: { x: sx, y: cy, r: R }, pl: BOOK_R.map((f, i) => ({ x: x0 + slot * (i + 0.5), y: cy, r: f * s })) };
}
function sizesLayout(w, h) {
  const cy = h * 0.56, sunRight = w * 0.24, margin = 14, avail = w - sunRight - margin * 2;
  const ratios = PLANETS.map((p) => p.d / SUN_KM), sum = ratios.reduce((a, b) => a + b, 0), minGap = clamp(w * 0.03, 10, 26);
  let R = h * 0.9;
  if (2 * R * sum + 9 * minGap > avail) R = (avail - 9 * minGap) / (2 * sum);
  const gap = (avail - 2 * R * sum) / 9;
  let x = sunRight + margin + gap;
  const pl = ratios.map((q) => { const r = R * q, o = { x: x + r, y: cy, r }; x += 2 * r + gap; return o; });
  return { sun: { x: sunRight - R, y: cy, r: R }, pl };
}
function walkLayout(w, h, cam) {
  const m = model(), X = (x) => (x - cam.x0) / cam.mpp;
  return { sun: { x: X(0), y: h * 0.52, r: m.sunM / 2 / cam.mpp }, pl: m.pl.map((p) => ({ x: X(p.dist), y: h * 0.52, r: p.size / 2 / cam.mpp })) };
}
const layoutOf = (v, w, h, cam) => (v === 'book' ? bookLayout(w, h) : v === 'sizes' ? sizesLayout(w, h) : walkLayout(w, h, cam));

function drawBook(c, w, h) {
  const t = T[lang], L = bookLayout(w, h), fs = clamp(w * 0.017, 10, 13);
  // orbits like in a textbook
  c.strokeStyle = 'rgba(130,145,190,.22)'; c.lineWidth = 1;
  for (const p of L.pl) { c.beginPath(); c.arc(L.sun.x, L.sun.y, p.x - L.sun.x, -0.5, 0.5); c.stroke(); }
  sunDisc(c, L.sun.x, L.sun.y, L.sun.r);
  c.font = font(800, fs); c.textAlign = 'center'; c.textBaseline = 'middle';
  L.pl.forEach((q, i) => {
    planetDisc(c, PLANETS[i], q.x, q.y, q.r);
    c.fillStyle = 'rgba(237,239,247,.85)';
    c.fillText(t.pl[PLANETS[i].k], q.x, q.y + (i % 2 ? -1 : 1) * (Math.max(...L.pl.map((z) => z.r)) + fs * 1.2));
  });
  c.fillStyle = '#5a2a00'; c.font = font(900, fs * 1.05); c.textAlign = 'right'; c.fillText(t.pl.sun, L.sun.x + L.sun.r - 8, L.sun.y);
  // the stamp
  c.save(); c.translate(w - 14, 24); c.rotate(-0.06); c.font = font(900, fs * 1.1); c.textAlign = 'right';
  const tw = c.measureText(t.stamp).width;
  c.strokeStyle = 'rgba(255,59,48,.85)'; c.lineWidth = 2; c.strokeRect(-tw - 10, -fs * 0.95, tw + 20, fs * 1.9);
  c.fillStyle = 'rgba(255,59,48,.95)'; c.fillText(t.stamp, 0, 1); c.restore();
}

function drawSizes(c, w, h) {
  const t = T[lang], m = model(), L = sizesLayout(w, h), fs = clamp(w * 0.016, 9.5, 12.5);
  sunDisc(c, L.sun.x, L.sun.y, L.sun.r, false);
  c.fillStyle = '#5a2a00'; c.font = font(900, fs * 1.1); c.textAlign = 'right'; c.textBaseline = 'middle';
  c.fillText(t.pl.sun, L.sun.x + L.sun.r - 10, L.sun.y - fs * 0.7);
  c.font = font(800, fs); c.fillText(len(m.sunM), L.sun.x + L.sun.r - 10, L.sun.y + fs * 0.7);
  const maxR = Math.max(...L.pl.map((q) => q.r));
  L.pl.forEach((q, i) => {
    const p = m.pl[i];
    planetDisc(c, p, q.x, q.y, q.r);
    if (q.r < 3) ring(c, q.x, q.y, p.col, 7);
    const up = i % 2 === 0, y = q.y + (up ? -1 : 1) * (maxR + fs * 1.6);
    c.textAlign = 'center'; c.fillStyle = '#fff'; c.font = font(900, fs); c.fillText(t.pl[p.k], q.x, up ? y - fs * 1.1 : y);
    c.fillStyle = 'rgba(211,217,232,.85)'; c.font = font(700, fs * 0.95); c.fillText(len(p.size), q.x, up ? y : y + fs * 1.1);
  });
  c.textAlign = 'left'; c.fillStyle = 'rgba(152,160,184,.9)'; c.font = font(800, fs);
  c.fillText(t.sizeNote, w * 0.26, 18);
}

function drawWalk(c, w, h, time) {
  const t = T[lang], m = model(), cam = S.cam, fs = clamp(w * 0.016, 10, 12.5);
  const X = (x) => (x - cam.x0) / cam.mpp, y0 = h * 0.52, vis = (x, pad = 80) => x > -pad && x < w + pad;
  const dEnd = S.star ? m.prox : m.pl[7].dist;
  // the line along which we lay the planets out
  const a0 = clamp(X(0), 0, w), a1 = clamp(X(dEnd), 0, w);
  if (a1 > a0) { c.strokeStyle = 'rgba(130,145,190,.28)'; c.lineWidth = 1; c.beginPath(); c.moveTo(a0, y0); c.lineTo(a1, y0); c.stroke(); }
  // ruler: distance from the Sun
  const yR = h - 36, step = niceStep(cam.mpp * clamp(w / 5, 70, 160));
  c.strokeStyle = 'rgba(130,145,190,.35)'; c.beginPath(); c.moveTo(Math.max(0, X(0)), yR); c.lineTo(w, yR); c.stroke();
  c.font = font(700, fs * 0.9); c.textAlign = 'center'; c.textBaseline = 'top'; c.fillStyle = 'rgba(152,160,184,.85)';
  for (let i = Math.max(0, Math.ceil(cam.x0 / step)), n = 0; n < 40; i++, n++) {
    const x = X(i * step); if (x > w + 20) break;
    c.beginPath(); c.moveTo(x, yR - 4); c.lineTo(x, yR + 4); c.stroke();
    c.fillText(len(i * step), x, yR + 7);
  }
  // labels in two rows above the line; skip a label when both rows are taken
  const rows = [[], []];
  const label = (x, txt, col, bold) => {
    c.font = font(bold ? 900 : 800, fs); const tw = c.measureText(txt).width + 10, lo = x - tw / 2, hi = x + tw / 2;
    const r = rows.findIndex((row) => row.every(([a, b]) => hi < a || lo > b)); if (r < 0) return;
    rows[r].push([lo, hi]); c.fillStyle = col; c.textAlign = 'center'; c.textBaseline = 'middle';
    const y = y0 - 22 - r * (fs + 8); c.fillText(txt, x, y);
    c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y + fs * 0.6); c.lineTo(x, y0 - 10); c.stroke();
  };
  // the Sun, at its true size
  const sx = X(0), sr = m.sunM / 2 / cam.mpp;
  if (sx + sr > -80 && sx - sr < w + 80) {
    sunDisc(c, sx, y0, sr);
    if (sr < 5) ring(c, sx, y0, '#ffcf4a');
    if (sr < w * 0.3) label(clamp(sx, 30, w - 30), `${t.pl.sun} · ${len(m.sunM)}`, '#ffcf4a', true);
  }
  // planets, at their true size; a dashed ring marks where the tiny ones are
  let anyRing = false;
  for (const p of m.pl) {
    const x = X(p.dist), r = p.size / 2 / cam.mpp;
    if (x + r < -80 || x - r > w + 80) continue;
    planetDisc(c, p, x, y0, r);
    if (r < 5) { ring(c, x, y0, p.col); anyRing = true; }
    label(x, `${t.pl[p.k]} · ${len(p.size)}`, '#EDEFF7', false);
  }
  if (S.star) {
    const x = X(m.prox);
    if (vis(x)) { c.fillStyle = '#ffe9b0'; c.beginPath(); c.arc(x, y0, 1.5, 0, 7); c.fill(); ring(c, x, y0, '#ffe9b0', 11); label(x, `⭐ ${t.proxima}`, '#ffe9b0', true); }
  }
  // sunlight racing out
  if (S.light) {
    const x = X(S.lightX);
    if (vis(x, 10)) {
      const g = c.createLinearGradient(x - 14, 0, x + 2, 0); g.addColorStop(0, 'rgba(255,210,90,0)'); g.addColorStop(1, 'rgba(255,210,90,.55)');
      c.fillStyle = g; c.fillRect(x - 14, y0 - 60, 16, 120);
      c.strokeStyle = '#ffd25a'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, y0 - 62); c.lineTo(x, y0 + 62); c.stroke();
      c.fillStyle = '#ffd25a'; c.font = font(900, fs); c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(`💡 ${dur(S.lightX / m.vc)}`, clamp(x, 40, w - 40), y0 + 76);
    }
  }
  // the walker
  const wx = X(S.walker);
  if (vis(wx, 20) && !S.light) {
    c.strokeStyle = 'rgba(255,59,48,.8)'; c.lineWidth = 2; c.beginPath(); c.moveTo(wx, y0 + 4); c.lineTo(wx, y0 + 16); c.stroke();
    c.save(); c.translate(wx, y0 + 34); c.scale(-1, 1); // the emoji walks to the left; turn it around
    c.font = `${Math.round(fs * 2.1)}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('🚶', 0, 0); c.restore();
  }
  // which body is next, beyond the right edge
  const right = cam.x0 + w * cam.mpp;
  const bodies = [...m.pl.map((p) => [t.pl[p.k], p.dist]), ...(S.star ? [[t.proxima, m.prox]] : [])];
  const nxt = bodies.find(([, d]) => d > right);
  c.font = font(800, fs); c.textBaseline = 'middle';
  if (nxt) { c.textAlign = 'right'; c.fillStyle = 'rgba(237,239,247,.75)'; c.fillText(t.next(nxt[0], len(nxt[1] - Math.max(S.walker, 0))), w - 10, y0 + 34); }
  if (X(0) < -40) { c.textAlign = 'left'; c.fillStyle = 'rgba(255,207,74,.75)'; c.fillText(`← ${t.pl.sun}`, 10, y0 + 34); }
  // the minimap: the whole row from the Sun to Neptune (or to Proxima Centauri)
  const mmL = 14, mmR = w - 14, mmY = 14, R = dEnd * 1.03, MX = (x) => mmL + x / R * (mmR - mmL);
  c.fillStyle = 'rgba(130,145,190,.16)'; c.fillRect(mmL, mmY - 3, mmR - mmL, 6);
  for (const p of m.pl) { c.fillStyle = p.col; c.beginPath(); c.arc(MX(p.dist), mmY, 2.2, 0, 7); c.fill(); }
  c.fillStyle = '#ffcf4a'; c.beginPath(); c.arc(mmL, mmY, 3.5, 0, 7); c.fill();
  if (S.star) { c.fillStyle = '#ffe9b0'; c.beginPath(); c.arc(MX(m.prox), mmY, 3, 0, 7); c.fill(); }
  const v0 = clamp(MX(Math.max(cam.x0, 0)), mmL, mmR), v1 = clamp(MX(right), mmL, mmR);
  c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1.2; c.strokeRect(v0, mmY - 7, Math.max(2, v1 - v0), 14);
  if (!S.light) { c.fillStyle = '#ff3b30'; c.beginPath(); const mx = MX(S.walker); c.moveTo(mx, mmY + 5); c.lineTo(mx - 4, mmY + 11); c.lineTo(mx + 4, mmY + 11); c.fill(); }
  c.font = font(800, fs * 0.9); c.textBaseline = 'top'; c.fillStyle = 'rgba(152,160,184,.9)';
  c.textAlign = 'left'; c.fillText(S.star ? `☀️ ${t.solar}` : t.pl.sun, mmL, mmY + 12);
  c.textAlign = 'right'; c.fillText(S.star ? `⭐ ${t.proxima} · ${len(m.prox)}` : `${t.pl.neptune} · ${len(m.pl[7].dist)}`, mmR, mmY + 12);
  // footnotes
  c.textAlign = 'center'; c.textBaseline = 'bottom'; c.font = font(700, fs * 0.85); c.fillStyle = 'rgba(100,108,132,.95)';
  c.fillText(anyRing ? `${t.ringNote} · ${t.hint}` : t.hint, w / 2, h - 4);
}

function drawMorph(c, w, h, dt) {
  const M = S.morph, m = model();
  M.t += dt / M.dur;
  const A = layoutOf(M.from, w, h, M.fromCam), B = layoutOf(M.to, w, h, S.cam);
  const e1 = ease(clamp(M.t / 0.5, 0, 1)), e2 = ease(clamp((M.t - 0.3) / 0.7, 0, 1));
  const [er, ep] = M.to === 'book' ? [e2, e1] : [e1, e2]; // shrink first, then fly apart (and the other way round)
  const lr = (a, b, k) => Math.exp(lerp(Math.log(Math.max(a, 1e-3)), Math.log(Math.max(b, 1e-3)), k));
  sunDisc(c, lerp(A.sun.x, B.sun.x, ep), lerp(A.sun.y, B.sun.y, ep), lr(A.sun.r, B.sun.r, er));
  A.pl.forEach((a, i) => {
    const b = B.pl[i], x = lerp(a.x, b.x, ep), y = lerp(a.y, b.y, ep), r = lr(a.r, b.r, er);
    if (x < -200 || x > w + 200) return;
    planetDisc(c, m.pl[i], x, y, r);
    if (r < 4 && M.to !== 'book') ring(c, x, y, m.pl[i].col, 4 + 5 * er);
  });
  if (M.t >= 1) { S.morph = null; render(); }
}

function update(dt) {
  const m = model(), w = G.w;
  if (S.walking) {
    S.walker = Math.min(S.walker + WALK * S.speed * dt, m.pl[7].dist);
    if (S.walker >= m.pl[7].dist) { S.walking = false; sfx.good(); render(); }
    if (S.follow === 'walker') S.cam.x0 = S.walker - 0.3 * w * S.cam.mpp;
  }
  if (S.light) {
    const end = S.star ? m.prox : m.pl[7].dist;
    S.lightX = Math.min(S.lightX + m.vc * S.speed * dt, end);
    if (!S.lightHitEarth && S.lightX >= m.pl[2].dist) { S.lightHitEarth = true; sfx.good(); }
    if (S.follow === 'light') S.cam.x0 = S.lightX - 0.45 * w * S.cam.mpp;
  }
  if (S.camTo) {
    const k = 1 - Math.exp(-dt * 4.5), c = S.cam, cx = c.x0 + w / 2 * c.mpp;
    const ncx = lerp(cx, S.camTo.cx, k), nm = Math.exp(lerp(Math.log(c.mpp), Math.log(S.camTo.mpp), k));
    c.mpp = nm; c.x0 = ncx - w / 2 * nm;
    if (Math.abs(Math.log(nm / S.camTo.mpp)) < 0.002 && Math.abs(ncx - S.camTo.cx) < nm) { c.mpp = S.camTo.mpp; c.x0 = S.camTo.cx - w / 2 * c.mpp; S.camTo = null; }
  }
  // arrivals and other moments that change the explanation
  const ws = walkState();
  const key = `${lang}|${lab.view}|${S.sun}|${ws.i}|${ws.near}|${S.light}|${S.lightHitEarth}|${S.star}`;
  if (key !== stateKey) { if (lab.view === 'walk' && S.walking && ws.near) sfx.snap(); render(); }
  if (S.walking || S.light || S.camTo) readout(false);
}

canvasLoop($('cv'), (c, w, h, dt) => {
  if (w !== G.w && S.camReady) { const cx = S.cam.x0 + G.w / 2 * S.cam.mpp; S.cam.mpp *= G.w / w; S.cam.x0 = cx - w / 2 * S.cam.mpp; }
  G.w = w; G.h = h;
  if (!S.camReady) { S.cam = defaultCam(w); S.camReady = lab.view === 'walk'; }
  update(dt);
  starfield(c, w, h);
  if (S.morph) drawMorph(c, w, h, dt);
  else if (lab.view === 'book') drawBook(c, w, h);
  else if (lab.view === 'sizes') drawSizes(c, w, h);
  else drawWalk(c, w, h);
});

// --- touch, mouse and wheel on the true-scale strip --------------------------------------------------------
const cv = $('cv'), ptrs = new Map();
const loc = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'walk' || S.morph) return;
  const p = loc(ev);
  if (p.y < 34 && ptrs.size === 0) { // tap on the minimap: jump there
    const m = model(), R = (S.star ? m.prox : m.pl[7].dist) * 1.03, xm = clamp((p.x - 14) / (G.w - 28), 0, 1) * R;
    flyTo(xm, S.cam.mpp); sfx.tick(); return;
  }
  try { cv.setPointerCapture(ev.pointerId); } catch { /* fine without capture */ }
  ptrs.set(ev.pointerId, { ...p, x0: p.x });
});
cv.addEventListener('pointermove', (ev) => {
  if (!ptrs.has(ev.pointerId)) return;
  const p = loc(ev), prev = ptrs.get(ev.pointerId);
  if (ptrs.size === 1) {
    if (Math.abs(p.x - prev.x0) < 4 && S.follow) return; // a tap, not a drag
    S.camTo = null; S.follow = null; S.cam.x0 -= (p.x - prev.x) * S.cam.mpp;
  }
  else if (ptrs.size === 2) {
    const [o] = [...ptrs.entries()].filter(([id]) => id !== ev.pointerId).map(([, q]) => q);
    const d0 = Math.abs(prev.x - o.x) || 1, d1 = Math.abs(p.x - o.x) || 1;
    S.camTo = null; zoomAt((p.x + o.x) / 2, clamp(d0 / d1, 0.5, 2));
  }
  ptrs.set(ev.pointerId, { ...p, x0: prev.x0 });
});
const up = (ev) => ptrs.delete(ev.pointerId);
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', (ev) => {
  if (lab.view !== 'walk') return;
  ev.preventDefault(); S.camTo = null; // zooming keeps following the walker
  zoomAt(loc(ev).x, Math.exp(clamp(ev.deltaY, -200, 200) * 0.0025));
}, { passive: false });

render();
</script>
</body>
</html>
