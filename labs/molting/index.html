const c01 = (x) => clamp(x, 0, 1);
const ease = (t) => { t = c01(t); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - (1 - c01(t)) ** 3;
const backOut = (t) => { t = c01(t); return 1 + 2.5 * (t - 1) ** 3 + 1.5 * (t - 1) ** 2; };
const hx = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const toHex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return toHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); };
const shade = (h, k) => (k >= 0 ? mix(h, '#000000', k) : mix(h, '#ffffff', -k));
const num = (n, d = 1) => n.toFixed(d).replace('.', lang === 'en' ? '.' : ',');
const rnd = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU); };
// a dark rounded label; returns its rectangle. a: anchor 'l' | 'c' | 'r'; W: canvas width to stay inside
function tag(c, text, x, y, o = {}) {
  const { a = 'c', fg = '#fff', bg = 'rgba(8,12,24,.84)', size = 12, W = 0, wt = 800, h = 22 } = o;
  c.save(); c.font = `${wt} ${size}px Nunito, sans-serif`; c.textBaseline = 'middle'; c.textAlign = 'left';
  const pw = c.measureText(text).width + 16;
  let x0 = a === 'l' ? x : a === 'r' ? x - pw : x - pw / 2;
  if (W) x0 = clamp(x0, 3, Math.max(3, W - pw - 3));
  c.fillStyle = bg; c.beginPath(); c.roundRect(x0, y - h / 2, pw, h, h / 2); c.fill();
  c.fillStyle = fg; c.fillText(text, x0 + 8, y + 0.5);
  c.restore();
  return { x: x0, y: y - h / 2, w: pw, h };
}

const CHILD = [[0, 49.5], [3, 60.6], [6, 66.7], [9, 71.1], [12, 74.9], [18, 81.5], [24, 86.4], [30, 91.3], [36, 95.6]]; // child length/height, cm
const childH = (x) => { // smooth cubic Hermite through the points
  x = clamp(x, 0, 36);
  let i = 0; while (i < CHILD.length - 2 && x > CHILD[i + 1][0]) i++;
  const slope = (j) => (j <= 0 ? (CHILD[1][1] - CHILD[0][1]) / (CHILD[1][0] - CHILD[0][0])
    : j >= CHILD.length - 1 ? (CHILD[j][1] - CHILD[j - 1][1]) / (CHILD[j][0] - CHILD[j - 1][0])
      : ((CHILD[j][1] - CHILD[j - 1][1]) / (CHILD[j][0] - CHILD[j - 1][0]) + (CHILD[j + 1][1] - CHILD[j][1]) / (CHILD[j + 1][0] - CHILD[j][0])) / 2);
  const [x0, y0] = CHILD[i], [x1, y1] = CHILD[i + 1], hh = x1 - x0, u = (x - x0) / hh;
  const h00 = 2 * u ** 3 - 3 * u ** 2 + 1, h10 = u ** 3 - 2 * u ** 2 + u, h01 = -2 * u ** 3 + 3 * u ** 2, h11 = u ** 3 - u ** 2;
  return h00 * y0 + h10 * hh * slope(i) + h01 * y1 + h11 * hh * slope(i + 1);
};

// --- grow: the state of the crab at the current age ------------------------------------------------------------------
function growState() {
  if (S.anim) {
    const i = S.anim.i, t = S.anim.t, wOld = 1.25 ** i, wNew = 1.25 ** (i + 1);
    const out = ease(t / 0.8), sw = ease((t - 0.8) / 0.8), dk = ease((t - 1.6) / 0.6);
    return { anim: true, count: i + 1, W: lerp(wOld, wNew, sw), wOld, soft: 1 - dk, out, sw, dk };
  }
  const count = MOLTS.filter((m) => m <= S.age + 1e-9).length;
  const soft = count ? c01(1 - (S.age - MOLTS[count - 1]) / 0.3) : 0;
  return { anim: false, count, W: 1.25 ** count, soft, out: 1, sw: 1, dk: 1 };
}
function advanceGrow(dt) {
  if (!S.playing || S.p.grow === null) return;
  if (S.anim) {
    S.anim.t += dt;
    if (S.anim.t >= ANIM_LEN) { S.age = MOLTS[S.anim.i] + 0.3; S.anim = null; sfx.tick(); }
    return;
  }
  const prev = S.age, nxt = Math.min(36, prev + SPEED * dt);
  const k = MOLTS.findIndex((m) => m > prev + 1e-9 && m <= nxt + 1e-9);
  if (k >= 0) { S.age = MOLTS[k]; S.anim = { i: k, t: 0 }; sfx.snap(); return; }
  S.age = nxt;
  if (nxt >= 36) S.playing = false;
}
function syncGrow() {
  const t = T[lang], f = growState(), ans = S.p.grow !== null, mo = Math.floor(S.age + 1e-6);
  const key = [f.W.toFixed(2), f.count, f.soft > 0.02, mo, S.playing, ans, lang].join('|');
  if (key === S.gk) return;
  S.gk = key;
  lab.setReadout(`${num(f.W)} ${t.cm}`, t.molts(f.count), ans && f.soft > 0.02 ? t.soft : '', '#e2552d');
  $('moAgeV').textContent = t.months(mo);
  $('moPlay').textContent = S.playing ? '⏸' : `▶ ${t.play}`;
  if (!S.drag) $('moAge').value = S.age;
}

// --- drawing helpers: the crab -----------------------------------------------------------------------------------------
const CRAB_YS = [-0.02, 0.15, 0.32, 0.48];
const crabLeg = (s, i) => { const yy = CRAB_YS[i]; return [s * 0.8, yy, s * 1.45, yy - 0.26 + i * 0.02, s * (1.78 - i * 0.06), yy + 0.22 + i * 0.12]; };
const crabClaw = (s) => [s * 0.62, -0.4, s * 1, -0.8, s * 0.7, -1.05];
// a crab seen from above, facing up: carapace half-width R (px). soft: 0 hard orange-red .. 1 pale pink new shell
function drawCrab(c, x, y, R, soft = 0, alpha = 1, o = {}) {
  R = Math.max(0.5, R);
  const base = mix('#e2552d', '#f6b2a1', soft), lite = shade(base, -0.4), dark = shade(base, 0.45), pr = o.px ?? R, lw = 1.6 / pr;
  c.save(); c.translate(x, y); c.scale(R, R); c.globalAlpha = alpha; c.lineJoin = 'round'; c.lineCap = 'round';
  if (!o.noShadow) { c.fillStyle = 'rgba(0,0,0,.2)'; ell(c, 0.1, 0.18, 1.2, 0.95); c.fill(); }
  const path = (p, n) => { c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < n; i += 2) c.lineTo(p[i], p[i + 1]); c.stroke(); };
  for (const s of [-1, 1]) for (let i = 0; i < 4; i++) {
    const p = crabLeg(s, i);
    c.strokeStyle = dark; c.lineWidth = 0.17 + lw * 2; path(p, 6);
    c.strokeStyle = base; c.lineWidth = 0.17; path(p, 6);
    c.strokeStyle = lite; c.globalAlpha = alpha * 0.45; c.lineWidth = 0.05; path(p, 6); c.globalAlpha = alpha;
  }
  for (const s of [-1, 1]) {
    const p = crabClaw(s);
    c.strokeStyle = dark; c.lineWidth = 0.24 + lw * 2; path(p, 6);
    c.strokeStyle = base; c.lineWidth = 0.24; path(p, 6);
    c.save(); c.translate(s * 0.64, -1.3); c.rotate(s * 0.16);
    const g = c.createRadialGradient(-0.1, -0.2, 0.02, 0, 0, 0.5); g.addColorStop(0, lite); g.addColorStop(1, base);
    c.fillStyle = g; c.strokeStyle = dark; c.lineWidth = lw * 1.2;
    ell(c, 0, 0, 0.3, 0.4); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(0, -0.4); c.lineTo(0, -0.1); c.stroke();
    c.restore();
  }
  // tucked abdomen flap
  c.fillStyle = shade(base, 0.2); c.strokeStyle = dark; c.lineWidth = lw; ell(c, 0, 0.84, 0.2, 0.15); c.fill(); c.stroke();
  // carapace
  c.beginPath(); c.moveTo(-0.98, 0);
  c.bezierCurveTo(-1, -0.55, -0.55, -0.72, 0, -0.72); c.bezierCurveTo(0.55, -0.72, 1, -0.55, 0.98, 0);
  c.bezierCurveTo(0.95, 0.55, 0.5, 0.78, 0, 0.78); c.bezierCurveTo(-0.5, 0.78, -0.95, 0.55, -0.98, 0); c.closePath();
  const g = c.createRadialGradient(-0.4, -0.4, 0.05, 0, 0, 1.25); g.addColorStop(0, lite); g.addColorStop(0.45, base); g.addColorStop(1, shade(base, 0.3));
  c.fillStyle = g; c.fill(); c.strokeStyle = dark; c.lineWidth = lw * 1.3; c.stroke();
  c.strokeStyle = shade(base, 0.28); c.globalAlpha = alpha * 0.7; c.lineWidth = lw * 1.1;
  c.beginPath(); c.moveTo(-0.55, -0.08); c.quadraticCurveTo(0, 0.2, 0.55, -0.08); c.stroke();
  c.beginPath(); c.moveTo(-0.28, -0.46); c.quadraticCurveTo(0, -0.3, 0.28, -0.46); c.stroke();
  c.globalAlpha = alpha; c.fillStyle = 'rgba(255,255,255,.3)'; ell(c, -0.4, -0.3, 0.3, 0.13, -0.5); c.fill();
  // eyes on short stalks
  for (const s of [-1, 1]) {
    c.strokeStyle = base; c.lineWidth = 0.08; c.beginPath(); c.moveTo(s * 0.2, -0.62); c.lineTo(s * 0.3, -0.84); c.stroke();
    c.fillStyle = '#fff'; c.strokeStyle = dark; c.lineWidth = lw; ell(c, s * 0.3, -0.88, 0.1, 0.1); c.fill(); c.stroke();
    c.fillStyle = '#1a1220'; ell(c, s * 0.3, -0.89, 0.05, 0.05); c.fill();
    c.fillStyle = '#fff'; ell(c, s * 0.28, -0.92, 0.02, 0.02); c.fill();
  }
  if (o.crack) { // the old shell split along the back
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = lw * 1.6; c.globalAlpha = alpha;
    c.beginPath(); c.moveTo(-0.62, 0.55); c.lineTo(-0.3, 0.7); c.lineTo(-0.1, 0.6); c.lineTo(0.2, 0.74); c.lineTo(0.5, 0.6); c.stroke();
  }
  c.restore();
}

const PEBBLES = (() => { const r = rnd(7); return Array.from({ length: 26 }, () => [r(), r(), 2 + r() * 4, r() > 0.5]); })();
const ROCKS = (() => { const r = rnd(11); return Array.from({ length: 30 }, (_, i) => ({ t: (i + r() * 0.6) / 30, r: 7 + r() * 8, k: r(), d: r() * 6 })); })();
function drawPool(c, P, time, f, ans, t) {
  const Rmax = Math.min(P.w * 0.21, P.h * 0.29), u = (Rmax * 2) / 7.45; // px per cm of shell width
  const R = (cm) => (cm * u) / 2;
  c.save(); c.beginPath(); c.roundRect(P.x, P.y, P.w, P.h, 22); c.clip();
  let g = c.createLinearGradient(P.x, P.y, P.x + P.w, P.y + P.h); g.addColorStop(0, '#e8d3a8'); g.addColorStop(1, '#c4a877');
  c.fillStyle = g; c.fillRect(P.x, P.y, P.w, P.h);
  for (const p of PEBBLES) { c.fillStyle = p[3] ? 'rgba(255,248,225,.55)' : 'rgba(120,95,60,.28)'; ell(c, P.x + p[0] * P.w, P.y + p[1] * P.h, p[2] * 1.4, p[2], p[0] * 6); c.fill(); }
  g = c.createLinearGradient(0, P.y, 0, P.y + P.h); g.addColorStop(0, 'rgba(42,127,158,.62)'); g.addColorStop(1, 'rgba(23,80,106,.8)');
  c.fillStyle = g; c.fillRect(P.x, P.y, P.w, P.h);
  c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 2;
  for (let k = 0; k < 6; k++) {
    c.beginPath();
    for (let x = 0; x <= P.w; x += 8) { const yy = P.y + P.h * (0.12 + 0.15 * k) + Math.sin(x * 0.045 + time * 0.8 + k * 1.7) * 6; x ? c.lineTo(P.x + x, yy) : c.moveTo(P.x, yy); }
    c.stroke();
  }
  c.restore();
  // the crab (and, while it backs out, the empty old shell)
  const cx = P.x + P.w / 2, cy = P.y + (P.h - 2.74 * Rmax) / 2 - 4 + 1.68 * Rmax;
  const rNew = R(f.W);
  if (f.anim) {
    const gOff = 0.5 * rNew, ga = 0.6 * (1 - f.dk);
    if (ga > 0.01) drawCrab(c, cx, cy + gOff, R(f.wOld), 0, ga, { noShadow: true, crack: true });
    drawCrab(c, cx, cy + gOff * (1 - f.out), rNew, f.soft, 1);
  } else drawCrab(c, cx, cy, rNew, f.soft, 1);
  // rim of rocks
  const per = 2 * (P.w + P.h);
  for (const r of ROCKS) {
    let d = r.t * per, x, y;
    if (d < P.w) { x = P.x + d; y = P.y; } else if ((d -= P.w) < P.h) { x = P.x + P.w; y = P.y + d; } else if ((d -= P.h) < P.w) { x = P.x + P.w - d; y = P.y + P.h; } else { d -= P.w; x = P.x; y = P.y + P.h - d; }
    const rr = r.r, gg = c.createRadialGradient(x - rr * 0.35, y - rr * 0.4, 1, x, y, rr * 1.1);
    gg.addColorStop(0, '#b9ad9c'); gg.addColorStop(1, '#5a544b');
    c.fillStyle = gg; c.strokeStyle = '#2e2a26'; c.lineWidth = 1.5; ell(c, x, y, rr * 1.15, rr * 0.9, r.k * 3); c.fill(); c.stroke();
  }
  c.strokeStyle = 'rgba(20,30,40,.6)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(P.x, P.y, P.w, P.h, 22); c.stroke();
  // scale bar: 2 cm
  const by = P.y + P.h - 15, bx = P.x + 18;
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(bx, by); c.lineTo(bx + 2 * u, by); c.moveTo(bx, by - 5); c.lineTo(bx, by + 5); c.moveTo(bx + 2 * u, by - 5); c.lineTo(bx + 2 * u, by + 5); c.stroke();
  tag(c, `2 ${t.cm}`, bx + 2 * u + 8, by, { a: 'l' });
  tag(c, t.illus, P.x + P.w - 12, P.y + 17, { a: 'r', fg: '#cfe9f2' });

    c.save(); c.globalAlpha = c01(f.soft * 1.5);
    const rx = P.x + 24, ry = P.y + 20, gr = c.createRadialGradient(rx - 4, ry - 5, 1, rx, ry, 13);
    gr.addColorStop(0, '#c9c3b8'); gr.addColorStop(1, '#6a645a');
    c.fillStyle = gr; c.strokeStyle = '#2e2a26'; c.lineWidth = 1.5; ell(c, rx, ry, 13, 10); c.fill(); c.stroke();
    tag(c, t.soft, rx + 18, ry, { a: 'l', fg: '#ffd2c6' });
    c.restore();
  }
}

function drawGraph(c, G, f, ans, t) {
  c.save();
  c.fillStyle = 'rgba(10,14,28,.66)'; c.strokeStyle = 'rgba(130,145,190,.28)'; c.lineWidth = 1;
  c.beginPath(); c.roundRect(G.x, G.y, G.w, G.h, 18); c.fill(); c.stroke();
  c.font = '800 12px Nunito, sans-serif';

  const px = G.x + 34, pw = G.w - 34 - 42, py = G.y + (one ? 36 : 55), ph = G.y + G.h - 40 - py;

  c.font = '700 12px Nunito, sans-serif'; c.textBaseline = 'middle';
  for (let k = 0; k <= 4; k++) {
    const y = py + ph - (k / 4) * ph;
    c.strokeStyle = k ? 'rgba(160,175,215,.14)' : 'rgba(200,210,240,.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(px, y); c.lineTo(px + pw, y); c.stroke();
    c.fillStyle = '#ff9a55'; c.textAlign = 'right'; c.fillText(k * 2, px - 6, y);
    c.fillStyle = '#4fd9cb'; c.textAlign = 'left'; c.fillText(Math.round(40 + k * 15), px + pw + 6, y);
  }
  c.textAlign = 'center';
  for (let m = 0; m <= 36; m += 6) {
    c.strokeStyle = m ? 'rgba(160,175,215,.12)' : 'rgba(200,210,240,.5)'; c.beginPath(); c.moveTo(X(m), py); c.lineTo(X(m), py + ph); c.stroke();
    c.fillStyle = '#c6cde0'; c.fillText(m, X(m), py + ph + 13);
  }
  c.fillStyle = '#98a0b8'; c.fillText(`${t.age}, ${t.mo}`, px + pw / 2, py + ph + 29);
  if (!ans) { c.restore(); return; } // before the guess: the axes only
  c.save(); c.beginPath(); c.rect(px - 2, py - 6, pw + 4, ph + 12); c.clip();
  const pts = [[0, 1]], done = f.anim ? f.count - 1 : f.count;

function drawGroups(c, w, h, dt, time) {

// --- secret A: the cicada leaves its skin ------------------------------------------------------------------------------------------
function drawCicada(c, w, h) {
  const t = S.secT % 15, ts = T[lang].secrets.a[0];

  c.strokeStyle = 'rgba(255,235,200,.25)'; c.lineWidth = 2; c.beginPath(); c.moveTo(tx - 1, 0); c.lineTo(tx - 1, h); c.stroke();

    const bgd = c.createRadialGradient(xs - 0.08 * L, ys - 0.2 * L, 2, xs, ys, 0.55 * L); bgd.addColorStop(0, '#d9b070'); bgd.addColorStop(1, '#8a5c2a');
    c.fillStyle = bgd; c.strokeStyle = '#4a2f12'; c.lineWidth = 1.8; ell(c, xs, ys, 0.25 * L, 0.5 * L); c.fill(); c.stroke();
    ell(c, xs - 0.02 * L, ys - 0.5 * L, 0.2 * L, 0.17 * L); c.fill(); c.stroke();
    c.fillStyle = '#2a1a0c'; ell(c, xs - 0.1 * L, ys - 0.52 * L, 0.04 * L, 0.04 * L); c.fill();
    c.strokeStyle = '#6b4a20'; c.lineWidth = 1.2; for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(xs - 0.2 * L, ys + (0.05 + k * 0.1) * L); c.lineTo(xs + 0.2 * L, ys + (0.05 + k * 0.1) * L); c.stroke(); }

// --- secret B: the giant spider crab ----------------------------------------------------------------------------------------------
function drawGiant(c, w, h) {
  const t = S.secT, tt = T[lang], mu = tt.mu;
  let g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#2a7f9e'); g.addColorStop(1, '#0e2f40'); c.fillStyle = g; c.fillRect(0, 0, w, h);

  c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 2; for (let k = 0; k < 5; k++) { c.beginPath(); for (let x = 0; x <= w; x += 10) { const y = h * (0.1 + 0.14 * k) + Math.sin(x * 0.03 + t * 0.7 + k) * 7; x ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke(); }
  const s = Math.min((w * 0.86) / 3.7, (h - 60) / 3.3), sp = easeOut(t / 1.8);

  c.lineCap = 'round'; c.lineJoin = 'round';
  c.fillStyle = 'rgba(0,0,0,.18)'; ell(c, cx, cy + 0.12 * s, 0.5 * s * sp + 8, 0.28 * s); c.fill();

    const cl = [P(sg * 0.2, -0.12), P(sg * 0.95, -0.3), P(sg * 1.45, -0.18), P(sg * 1.82, 0.0)]; segs(cl, 0.07);

    c.fillStyle = pg; c.strokeStyle = dk; c.lineWidth = 2; ell(c, 0, 0, 0.1 * s * sp + 2, 0.16 * s * sp + 2); c.fill(); c.stroke(); c.restore();
  }
  const bg = c.createRadialGradient(cx - 0.1 * s, cy - 0.1 * s, 2, cx, cy, 0.4 * s); bg.addColorStop(0, '#ff8a5d'); bg.addColorStop(0.6, orange); bg.addColorStop(1, '#a8341a');
  c.fillStyle = bg; c.strokeStyle = dk; c.lineWidth = 2; ell(c, cx, cy, 0.27 * s, 0.33 * s); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.7)'; for (const [dx, dy] of [[-0.1, -0.1], [0.08, -0.14], [0.12, 0.06], [-0.06, 0.1], [0, -0.02]]) { ell(c, cx + dx * s, cy + dy * s, 0.025 * s, 0.025 * s); c.fill(); }

  c.fillStyle = kid; c.strokeStyle = '#2b3550'; c.lineWidth = 1.5;

  c.beginPath(); c.roundRect(chx - 0.17 * s, fy - ch + 0.24 * s, 0.34 * s, 0.5 * s, 0.1 * s); c.fill(); c.stroke();

// --- the loop ------------------------------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec) { S.secT += dt; (S.sec === 'a' ? drawCicada : drawGiant)(c, w, h); return; }
  const v = lab.view;
  if (v === 'grow') { advanceGrow(dt); drawGrow(c, w, h, time); syncGrow(); }
  else if (v === 'size') drawSize(c, w, h, dt, time);
  else drawGroups(c, w, h, dt, time);
});

  } else if (act === 'key') {

});

    if (S.sel === 'woodlouse') S.woodSeen = true;
    S.sel = ANIMALS.find((k) => !S.placed[k]) ?? null; S.msg = null;
  } else { S.flash = { b: bin.b, t: 0 }; S.shake = 0.5; S.msg = 'wrong'; sfx.bad(); }
  render();
});

// --- render: controls, readout and the state card -------------------------------------------------------------------------------------
const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
function renderPred(v, t) {
  const cfg = { grow: [t.growAsk, t.growOpts, t.growRight, t.growWrong], size: [t.sizeAsk, t.sizeOpts, t.sizeRight, t.sizeWrong], groups: [t.groupsAsk, t.groupsOpts, t.groupsRight, t.groupsWrong] }[v];
  const [q, opts, right, wrong] = cfg, a = S.p[v], ok = PRED[v];
  $('pred-' + v).innerHTML = `<div class="mo-q">${esc(q)}</div><div class="mo-opts">${opts.map((o, i) => `<button type="button" class="mo-opt${a === null ? '' : i === ok ? ' ok' : i === a ? ' no' : ' dim'}" data-p="${v}" data-i="${i}"${a === null ? '' : ' disabled'}>${esc(o)}</button>`).join('')}</div>${a === null ? '' : `<div class="mo-v ${a === ok ? 'ok' : 'no'}">${esc(a === ok ? right : wrong)}</div>`}`;
}
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = v;
  show('moGrow', v === 'grow'); show('moSize', v === 'size'); show('moGroups', v === 'groups');
  const sc = (k, emo) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('moSec').innerHTML = sc('a', '🦗') + sc('b', '🦀');
  renderPred('grow', t); renderPred('size', t); renderPred('groups', t);
  if (S.sec) {
    const k = S.sec, emo = k === 'a' ? '🦗' : '🦀';
    lab.setGlow(k === 'a' ? 'rgba(42, 127, 158, .3)' : 'rgba(226, 85, 45, .22)');
    lab.setReadout(esc(t.secrets[k][0]), t.secrets[k][1], '', '#2a7f9e');
    lab.setState({ emo, title: t.secrets[k][0], lead: k === 'a' ? t.cicadaText : t.giantText, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  if (v === 'grow') renderGrow(t); else if (v === 'size') renderSize(t); else renderGroups(t);
}
function renderGrow(t) {
  const ans = S.p.grow !== null, f = growState();
  lab.setGlow('rgba(226, 85, 45, .24)');
  $('moTime').classList.toggle('mo-lock', !ans);
  $('moAge').disabled = !ans; $('moPlay').disabled = !ans;
  $('moAgeL').textContent = t.age; $('moAge').setAttribute('aria-label', t.age);
  $('moTicks').style.display = ans ? 'block' : 'none';
  $('moNoteG').textContent = ans ? t.noteGrow : '';
  S.gk = ''; syncGrow();
  if (!ans) lab.setState({ emo: '🤔', title: t.growAsk, lead: '', body: '' });
  else lab.setState({ emo: t.st.grow[0], title: t.st.grow[1], lead: t.st.grow[2], body: t.st.grow[3] });
  lab.setFacts(ans ? t.facts.grow : []);
  void f;
}
function renderSize(t) {
  const ans = S.p.size !== null, open = S.sizeOpen, half = S.W / 2, reach = reachOf(S.O), big = half > reach;
  lab.setGlow('rgba(46, 196, 182, .22)');
  $('moSlW').classList.toggle('mo-lock', !open); $('moSlO').classList.toggle('mo-lock', !open);
  $('moW').disabled = !open; $('moO').disabled = !open;
  $('moW').value = S.W; $('moO').value = S.O;
  $('moWL').textContent = t.bodyW; $('moWV').textContent = `${S.W} ${t.cm}`;
  $('moOL').textContent = t.oxygen; $('moOV').textContent = `${S.O} %`; $('moTodayL').textContent = t.today;
  $('moNoteS').textContent = ans ? t.noteSize : '';
  if (!ans) lab.setReadout(esc(t.wCm(S.W)), '', '', '#2ec4b6');
  else lab.setReadout(esc(t.wCm(S.W)), t.reach(reach), big ? t.tooBig : t.canLive, big ? '#e2552d' : '#2ec4b6');
  if (!ans) lab.setState({ emo: '🤔', title: t.sizeAsk, lead: '', body: '' });
  else lab.setState({ emo: t.st.size[0], title: t.st.size[1], lead: t.st.size[2], body: t.st.size[3] });
  lab.setFacts(ans ? t.facts.size : []);
}
function renderGroups(t) {
  const ans = S.p.groups !== null, done = Object.keys(S.placed).length;
  lab.setGlow('rgba(246, 178, 161, .2)');
  const kc = (q, labels, cur) => `<div class="mo-kq">${esc(t[q === 's' ? 'q1' : 'q2'])}</div><div class="mo-kc">${labels.map((l, i) => `<button type="button" data-act="key" data-q="${q}" data-i="${i}" class="${cur === i ? 'on' : ''}"${ans ? '' : ' disabled'}>${esc(l)}</button>`).join('')}</div>`;
  $('moKey').innerHTML = kc('s', t.sections, S.key.s) + kc('l', t.legs, S.key.l);
  lab.setReadout(esc(t.sorted(done)), '', S.woodSeen ? t.woodlouse : '', '#e2552d');
  if (!ans) lab.setState({ emo: '🤔', title: t.groupsAsk, lead: '', body: '' });
  else if (S.msg === 'wrong') lab.setState({ emo: '🤔', title: t.tryAgain, lead: t.groupsWrong, body: '' });
  else lab.setState({ emo: t.st.groups[0], title: t.st.groups[1], lead: t.st.groups[2], body: t.st.groups[3] });
  lab.setFacts(ans ? t.facts.groups : []);
}
render();
</script>
