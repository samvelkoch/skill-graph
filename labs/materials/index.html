const HOT = [['metal', 3.0], ['plastic', 0.98], ['wood', 0.8]]; // how fast each handle carries the heat

  if (wf > 0) { c.fillStyle = 'rgba(15,45,110,.42)'; c.fillRect(x - tw / 2, top + th * (1 - wf), tw, th * wf); }
  c.restore();
  if (i === 2) { c.strokeStyle = TOWEL_COL[i]; c.lineWidth = 3; for (let k = 0; k < 7; k++) { const fx = x - tw / 2 + (k + 0.5) * tw / 7; c.beginPath(); c.moveTo(fx, top + th); c.lineTo(fx, top + th + 6); c.stroke(); } }

function drawFair(c, w, h, dt, time) {
  const t = T[lang], f = t.f, ph = S.fPhase, run = ph === 'run' || ph === 'done';

  const y0 = S.fy0, H = Math.max(120, h - y0), cfg = SETUPS[ph === 'setup' ? S.fi : 2], tt = run ? time - S.fT0 : -1;

    if (ph === 'done' && i === 1) { c.save(); c.strokeStyle = '#f5c84c'; c.lineWidth = 2; c.beginPath(); c.roundRect(x - colW * 0.46, y0 - 2, colW * 0.92, jt - y0 + 2 * 0, 14); c.stroke(); c.restore(); }
    drawTowel(c, x, top, tw, th, i, run ? prog * SOAK[i] / 100 : 0);
    // the bowl, with water seen through it

    const bowl = poly([[x - bwid / 2, yt], [x + bwid / 2, yt], [x + bwid * 0.37, yb], [x - bwid * 0.37, yb]]);

    if (lvl > 0.5) { c.save(); c.clip(bowl); c.fillStyle = 'rgba(80,160,235,.72)'; c.beginPath(); c.moveTo(x - bwid, yb); c.lineTo(x - bwid, yb - lvl); for (let q = 0; q <= 12; q++) c.lineTo(x - bwid + bwid * 2 * q / 12, yb - lvl + Math.sin(time * 3 + q) * 1.2); c.lineTo(x + bwid, yb); c.closePath(); c.fill(); c.restore(); }
    c.strokeStyle = 'rgba(225,235,255,.9)'; c.lineWidth = 2.4; c.lineJoin = 'round'; c.stroke(bowl); c.restore();
    txt(c, f.towels[i], x, yb + 16, 13);
    if (!run) {
      txt(c, `📏 ${cfg.cm[i]} ${f.cm}`, x, yb + 38, 12.5, '#D3D9E8', 'center', 700);
      txt(c, `💧 ${cfg.ml[i]} ${f.ml}`, x, yb + 57, 12.5, '#D3D9E8', 'center', 700);
      txt(c, `⏱ 1 ${t.min}`, x, yb + 76, 12.5, '#D3D9E8', 'center', 700);
    } else {
      // the water that is left, measured in a jug
      if (pour > 0 && pour < 1) { c.save(); c.strokeStyle = 'rgba(80,160,235,.9)'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(x + bwid / 2, yt + 2); c.quadraticCurveTo(x + bwid / 2 + 14, (yt + jt) / 2, x, jt + 2); c.stroke(); c.restore(); }
      const jml = (100 - SOAK[i]) * pour, jl = jh * jml / 100;
      c.save(); c.globalAlpha = 1; c.fillStyle = 'rgba(80,160,235,.8)'; c.fillRect(x - jw / 2 + 1.5, jt + jh - jl, jw - 3, jl);
      c.strokeStyle = 'rgba(225,235,255,.9)'; c.lineWidth = 2.4; c.lineJoin = 'round'; c.beginPath(); c.roundRect(x - jw / 2, jt, jw, jh, 6); c.stroke();
      c.lineWidth = 1.5; c.strokeStyle = 'rgba(225,235,255,.7)'; c.beginPath(); for (let k = 1; k < 4; k++) { const yy = jt + jh * (1 - k / 4); c.moveTo(x - jw / 2, yy); c.lineTo(x - jw / 2 + 8, yy); } c.stroke(); c.restore();
      if (pour > 0.02) txt(c, `${Math.round(jml)} ${f.ml}`, x, jt + jh + 13, 12.5);

    }
  }
  if (run) {
    txt(c, f.left, 14, jt - 9, 12, '#98A0B8', 'left', 700);

  }
}

  lab.setReadout(n ? `${k}/${n}` : '?', n ? s.score(k, n) : '', '', '#f5a54c');
  const tray = A_KEYS.map((x) => `<button class="ob ${o === x ? 'on' : ''} ${S.aRes[x] ? 'done' : ''}" data-o="${x}"><span class="e">${OBJA[x][0]}</span><span class="n">${esc(s.objsA[x])}</span></button>`).join('');
  const pic = !o ? '<div class="big"><span class="huge">❔</span></div>' : S.aChecked ? `<div class="big xr">${xraySvg(t, o)}</div>` : `<div class="big"><span class="huge">${OBJA[o][0]}</span></div>`;
  const chips = MATS.map((m) => {
    const sel = S.aSel.includes(m), cls = S.aChecked ? (sel && truth.includes(m) ? 'good' : sel ? 'bad' : truth.includes(m) ? 'miss' : '') : sel ? 'sel' : '';
    return `<button class="chip mat ${cls}" data-m="${m}"><span class="sw" style="background-image:url(${swatchUrl[m]})"></span>${esc(t.mats[m])}</button>`;
  }).join('');
  let msg = '';
  if (S.aChecked) msg = `<div class="v" style="color:${S.aOk ? 'var(--ok)' : 'var(--wip)'}">${esc(S.aOk ? t.right : t.wrong)}</div>${o === 'pencil' ? esc(s.many) : ''}`;
  sortEl.innerHTML = `<p class="qa">${esc(s.qA)}</p><div class="tray">${tray}</div>${pic}<div class="mats">${chips}</div><div class="msg">${msg}</div>`;
  $('sMain').textContent = S.aChecked ? t.next : t.check;
  $('sMain').disabled = !S.aChecked && (!o || !S.aSel.length);
}
function renderSortB(t) {
  const s = t.s, ru = S.rule, truth = (x) => (OBJB[x][1][ru] ? 'yes' : 'no');
  const where = (x) => (S.bChecked ? truth(x) : S.place[x] || 'tray');
  lab.setReadout(S.bChecked ? `${S.bScore}/${B_KEYS.length}` : '?', s.rules[ru], '', RULE_COL[ru]);
  $('ruleChips').innerHTML = s.rules.map((r, i) => `<button class="chip rule ${i === ru ? 'on' : ''}" data-act="rule" data-r="${i}"><i class="rd" style="--c:${RULE_COL[i]}"></i>${esc(r)}</button>`).join('');
  const chip = (x) => {
    const cls = [S.bSel === x ? 'on' : '', S.bChecked ? (S.place[x] === truth(x) ? 'ok' : 'no') : ''].join(' ');
    const dots = [0, 1, 2].filter((r) => S.bDone[r]).map((r) => `<i class="${OBJB[x][1][r] ? 'y' : ''}" style="--c:${RULE_COL[r]}"></i>`).join('');
    return `<button class="ob ${cls}" data-o="${x}"><span class="e">${OBJB[x][0]}</span><span class="n">${esc(s.objsB[x])}</span><span class="dd">${dots}</span></button>`;
  };
  const of = (w) => B_KEYS.filter((x) => where(x) === w).map(chip).join('');
  let msg = '';
  if (S.bChecked) msg = `<div class="v" style="color:${S.bScore === B_KEYS.length ? 'var(--ok)' : 'var(--wip)'}">${esc(S.bScore === B_KEYS.length ? t.right : t.wrong)} · ${esc(s.score(S.bScore, B_KEYS.length))}</div>${ru > 0 ? esc(s.resort) : ''}`;
  sortEl.innerHTML = `<p class="qa">${esc(s.qB(s.rules[ru]))}</p><div class="tray">${of('tray')}</div>
    <div class="bins"><div class="bin" data-bin="yes"><h4>${esc(s.yes)}</h4><div class="its">${of('yes')}</div></div><div class="bin" data-bin="no"><h4>${esc(s.no)}</h4><div class="its">${of('no')}</div></div></div>
    <div class="msg">${msg}</div>`;
  $('sMain').textContent = S.bChecked ? t.next : t.check;
  $('sMain').disabled = !S.bChecked && !B_KEYS.every((x) => S.place[x]);
}

// --- fair test: the question card ----------------------------------------------------------------------------------
function renderFair(t) {
  const f = t.f, ph = S.fPhase, i = S.fi, run = ph === 'run' || ph === 'done';
  document.body.dataset.fp = run ? 'run' : 'setup';
  lab.setGlow('rgba(95, 168, 160, .24)');
  stateCard(t, 'fair');
  lab.setReadout(ph === 'done' ? `${SOAK[1]} ${esc(f.ml)}` : '?', ph === 'done' ? f.towels[1] : '', '', '#5fa8a0');
  const head = `<div class="t">${esc(f.title)}</div>`;
  let html;
  if (ph === 'setup') {
    const ans = S.fAns[i], dots = FAIR.map((_, j) => (S.fAns[j] !== null ? '●' : j === i ? '◉' : '○')).join(' ');
    if (ans === null) html = `${head}<div class="pg">${dots}</div><div class="q">${esc(f.q)}</div><div class="opts"><button data-a="yes">${esc(f.yes)}</button><button data-a="no">${esc(f.no)}</button></div>`;
    else { const ok = (ans === 'yes') === FAIR[i]; html = `${head}<div class="pg">${dots}</div><div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.wrong)}</div><p>${esc(f[WHY[i]])}</p><div class="opts"><button data-a="next">${esc(t.next)}</button></div>`; }
  } else if (ph === 'guess') {
    html = `${head}<div class="q">${esc(f.guess)}</div><div class="opts">${f.towels.map((n, j) => `<button class="${S.fGuess === j ? 'on' : ''}" data-a="g${j}">${esc(n)}</button>`).join('')}</div>
      <div class="opts"><button data-a="run"${S.fGuess === null ? ' disabled' : ''}>${esc(f.run)} ▶</button></div>`;
  } else if (ph === 'run') html = head;
  else html = `${head}<div class="verdict" style="color:${S.fGuess === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(S.fGuess === 1 ? t.right : t.wrong)}</div><p>${esc(f.data)}</p><div class="opts"><button data-a="again">${esc(f.again)}</button></div>`;
  fairEl.innerHTML = html;
}
render();
</script>
</body>
</html>
