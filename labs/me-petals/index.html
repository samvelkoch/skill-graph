function v1Layout() {
  const e1 = ease(S.fl), e2 = ease(S.rv);
  return { R: lerp(lerp(135, 105, e1), 95, e2), y: lerp(lerp(190, 150, e1), 122, e2), sR: lerp(58, 70, e2), sY: lerp(338, 322, e2), e1, e2 };
}
// model of the flower at 5, 7 and 9 (simple model): each petal either stays, changes, or is new
function agePetals(age) {
  const c = S.pet.map((v, i) => (v >= 0 ? v : DEFAULT_PET[i])), P = (i, opt, mark) => ({ col: SLOTS[i].col, emo: SLOTS[i].emo[opt], st: 'full', mark });
  if (age === 5) return [P(0, (c[0] + 1) % 4), P(1, c[1]), { col: SLOTS[2].col, st: 'bud' }, P(3, c[3]), P(4, c[4]), P(5, c[5])];
  if (age === 7) return [P(0, c[0], 'chg'), P(1, c[1], 'same'), P(2, c[2], 'new'), P(3, c[3], 'same'), P(4, c[4], 'same'), P(5, c[5], 'same')];
  return [P(0, (c[0] + 2) % 4, 'chg'), P(1, (c[1] + 1) % 4, 'chg'), P(2, c[2], 'same'), P(3, c[3], 'same'), P(4, c[4], 'same'), P(5, c[5], 'same'),
    { col: EXTRA.swim.col, emo: EXTRA.swim.emo, st: 'full', mark: 'new' }, { col: EXTRA.cook.col, emo: EXTRA.cook.emo, st: 'full', mark: 'new' }];
}
const ageCounts = (age) => { const m = agePetals(age).map((p) => p.mark); return [m.filter((x) => x === 'same').length, m.filter((x) => x === 'chg').length, m.filter((x) => x === 'new').length]; };
const myFace = () => S.me;
const activeSec = () => (S.sec === 'gift' && lab.view === 'strong' ? 'gift' : S.sec === 'yet' && lab.view === 'grow' ? 'yet' : null);

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view, t = T[lang], sec = activeSec();
  S.fl += clamp((isFull() ? 1 : 0) - S.fl, -dt * 2.5, dt * 2.5);
  S.rv += clamp((S.g1 && v === 'petals' ? 1 : 0) - S.rv, -dt * 2.2, dt * 2.2);
  const s = Math.min(w / 360, h / 420), ox = (w - 360 * s) / 2, oy = (h - 420 * s) / 2; XF = { ox, oy, s };
  const scene = v === 'strong' && sec !== 'gift' && S.si < 6;
  if (!scene) gardenBg(c, w, h, time);
  c.save(); c.translate(ox, oy); c.scale(s, s);
  if (scene) {
    SCENES[S.si](c, time);
    const a = S.sa[S.si];
    if (a !== undefined) { const q = SCENE_Q[S.si]; pill(c, `${QE[q]} ${t.q[q]}`, 180, 26, { bg: 'rgba(14,17,28,.88)', fs: 15 }); }
  } else {
    gardenHills(c);
    if (v === 'petals') {
      const L = v1Layout(), sel = S.g1 ? -1 : S.sel;
      const hl = S.g1 ? S.pet.map((p, i) => p >= 0 && (p === ANA.pet[i] || p === BEN.pet[i])) : null;
      if (L.e1 > 0.01) {
        c.globalAlpha = L.e1;
        const open = L.e2 > 0.5;
        [[ANA, 95, t.ana], [BEN, 265, t.ben]].forEach(([d, x, name]) => {
          drawFlower(c, x, L.sY, L.sR, d.face, open ? flowerOf(d, S.pet.map((p, i) => p >= 0 && p === d.pet[i])) : budPetals(), { t: time, mood: 'grin' });
          pill(c, name, x, 406);
        });
        c.globalAlpha = 1;
      }
      drawFlower(c, 180, L.y, L.R, myFace(), myPetals({ selI: sel, hl }), { t: time, stem: L.R * 2.15 });
    } else if (v === 'strong') {
      if (sec === 'gift') {
        const pet = SLOTS.map((s) => ({ col: s.col, st: 'bud' }));
        pet.push(S.gift === null ? { col: '#ffd166', st: 'empty' } : { col: '#ffd166', emo: QE[S.gift], st: 'full', sc: ease((time - S.popAt) * 2.5) });
        drawFlower(c, 180, 200, 118, FRIEND, pet, { t: time, stem: 230, mood: S.gift === null ? 'smile' : 'laugh' });
      } else {
        const two = S.pick.length;
        const fy = 372, H = 250;
        drawPerson(c, 180, fy, H, { ...S.me, shirt: '#f2bb44', pants: '#4a5a8a', mood: two === 2 ? 'grin' : 'smile', armL: two === 2 ? [118, 196] : null, armR: two === 2 ? [242, 196] : null });
        for (let i = 0; i < 2; i++) {
          const q = S.pick[i], yy = 34 + i * 34;
          if (q === undefined) { c.save(); c.setLineDash([5, 5]); c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(120, yy - 13, 120, 26, 13); c.stroke(); c.restore(); }
          else pill(c, `${QE[q]} ${t.q[q]}`, 180, yy, { fs: 15 });
        }
      }
    } else {
      const yet = sec === 'yet', asked = !!S.g3, age = yet || !asked ? 7 : S.age;
      let pet = agePetals(age).map((p) => (yet || !asked ? { ...p, mark: null } : p));
      const pop = ease((time - S.popAt) * 2.2);
      pet = pet.map((p) => (p.mark === 'new' || p.mark === 'chg' ? { ...p, sc: lerp(0.55, 1, pop) } : p));
      if (yet && S.yet.item >= 0) { const n = S.yet.n; pet = [...pet, { col: '#b58de8', emo: YETE[S.yet.item], st: n >= 3 ? 'full' : 'dash', k: n / 3 }]; }
      drawFlower(c, 180, 200, yet && S.yet.item >= 0 ? 112 : 124, myFace(), pet, { t: time, stem: 250, mood: yet && S.yet.n >= 3 ? 'grin' : 'smile' });
      pill(c, t.p3.model, 180, 22, { fs: 13, bg: 'rgba(14,17,28,.85)' });
      if (!yet && asked) pill(c, t.p3.age(age), 180, 406, { fs: 14 });
      if (!yet && S.g3 && age > 5) pill(c, `↻ ${t.p3.leg[0]}   ✦ ${t.p3.leg[1]}   ✓ ${t.p3.leg[2]}`, 180, 380, { fs: 12 });
    }
  }
  c.restore();
});

// tap a petal on the picture to go back to it
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'petals' || S.g1) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - XF.ox) / XF.s, y = (ev.clientY - r.top - XF.oy) / XF.s, L = v1Layout();
  const dx = x - 180, dy = y - L.y, d = Math.hypot(dx, dy);
  if (d < L.R * 0.3 || d > L.R * 1.05) return;
  const i = Math.round((Math.atan2(dy, dx) + Math.PI / 2) / (Math.PI / 3) + 6) % 6;
  S.sel = i; sfx.tick(); render();
});

// --- controls ------------------------------------------------------------------------------------------------
const hairIcon = (i) => {
  const h = HAIR[i], sk = SKIN[S.me.skin];
  const back = h.s === 'long' ? `<path d="M5 15C5 3 25 3 25 15L25.5 27H4.5Z" fill="${h.c}"/>`
    : h.s === 'curly' ? `<g fill="${h.c}"><circle cx="7.5" cy="11" r="4.4"/><circle cx="11.5" cy="6.8" r="4.4"/><circle cx="18.5" cy="6.8" r="4.4"/><circle cx="22.5" cy="11" r="4.4"/></g>` : '';
  return `<svg viewBox="0 0 30 30" width="30" height="30" aria-hidden="true">${back}<circle cx="15" cy="16.5" r="8.5" fill="${sk}"/><path d="M6.5 15.5C6.5 5.5 23.5 5.5 23.5 15.5C20 11.5 10 11.5 6.5 15.5Z" fill="${h.c}"/></svg>`;
};
const faceRows = (t) => `
  <div class="mp-row"><span class="mp-lbl">${esc(t.face.skin)}</span>${SKIN.map((c, i) => `<button class="mp-sw ${S.me.skin === i ? 'on' : ''}" data-act="skin" data-i="${i}" aria-label="${esc(t.face.skin)} ${i + 1}"><i style="background:${c}"></i></button>`).join('')}</div>
  <div class="mp-row"><span class="mp-lbl">${esc(t.face.hair)}</span>${HAIR.map((h, i) => `<button class="mp-sw ${S.me.hair === i ? 'on' : ''}" data-act="hair" data-i="${i}" aria-label="${esc(t.face.hair)} ${i + 1}">${hairIcon(i)}</button>`).join('')}</div>
  <div class="mp-row"><button class="mp-gl ${S.me.glasses ? 'on' : ''}" data-act="glasses">${esc(t.face.glasses)}</button></div>`;
const secRow = () => {
  const open = secret.unlocked(), t = T[lang], a = activeSec();
  const b = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${a === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="mp-sec">${b('gift', '🎁')}${b('yet', '🌱')}</div>`;
};
const goView = (v) => $('views').querySelector(`[data-view="${v}"]`)?.click();
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const nextEmpty = (from) => { for (let k = 1; k <= 6; k++) { const i = (from + k) % 6; if (S.pet[i] < 0) return i; } return from; };

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i, t = T[lang];
  if (act === 'skin') { S.me.skin = i; sfx.tick(); }
  else if (act === 'hair') { S.me.hair = i; sfx.tick(); }
  else if (act === 'glasses') { S.me.glasses = !S.me.glasses; sfx.tick(); }
  else if (act === 'slot') { S.sel = i; sfx.tick(); }
  else if (act === 'card') { S.pet[S.sel] = +b.dataset.j; sfx.snap(); S.sel = nextEmpty(S.sel); }
  else if (act === 'g1') { S.g1 = b.dataset.g; (S.g1 === (sameFlower() ? 'yes' : 'no') ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'again1') { S.g1 = null; sfx.click(); }
  else if (act === 'ans') { // scene answer
    if (S.sa[S.si] !== undefined) return;
    S.sa[S.si] = +b.dataset.j; (S.sa[S.si] === SCENE[S.si].ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next') { S.si++; sfx.click(); }
  else if (act === 'pickq') { const q = +b.dataset.q, at = S.pick.indexOf(q); if (at >= 0) S.pick.splice(at, 1); else { S.pick.push(q); if (S.pick.length > 2) S.pick.shift(); } sfx.tick(); }
  else if (act === 'again2') { S.si = 0; S.sa = []; S.pick = []; S.sec = null; sfx.click(); }
  else if (act === 'g3') { S.g3 = b.dataset.g; S.age = 5; S.popAt = performance.now() / 1000; (S.g3 === 'no' ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'age') { S.age = i; S.popAt = performance.now() / 1000; sfx.click(); }
  else if (act === 'giftq') { S.gift = i; S.popAt = performance.now() / 1000; sfx.good(); }
  else if (act === 'yetp') { S.yet = { item: i, n: 0 }; S.popAt = performance.now() / 1000; sfx.click(); }
  else if (act === 'prac') { S.yet.n = Math.min(3, S.yet.n + 1); (S.yet.n >= 3 ? sfx.good : sfx.snap)(); }
  else if (act === 'yetagain') { S.yet = { item: -1, n: 0 }; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    const home = k === 'gift' ? 'strong' : 'grow';
    if (lab.view !== home) { S.sec = k; S.gift = null; S.yet = { item: -1, n: 0 }; goView(home); return; }
    S.sec = activeSec() === k ? null : k; if (k === 'gift') S.gift = null; else S.yet = { item: -1, n: 0 };
    sfx.click();
  }
  void t; render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------------
function render() {
  const v = lab.view, t = T[lang];
  if (v === 'petals') renderPetals(t); else if (v === 'strong') renderStrong(t); else renderGrow(t);
}

function renderPetals(t) {
  const p = t.p1, n = filled(), full = isFull(), sel = S.sel;
  lab.setGlow('rgba(240, 144, 95, .24)');
  const dots = S.pet.map((val, i) => `<button class="mp-dot ${val < 0 ? 'empty' : ''} ${i === sel && !S.g1 ? 'on' : ''}" style="background:${SLOTS[i].col}" data-act="slot" data-i="${i}" aria-label="${esc(t.slots[i].label)}">${val >= 0 ? SLOTS[i].emo[val] : '+'}</button>`).join('');
  let body = '';
  if (S.g1) {
    body = `<div class="mp-btnrow"><button class="btn ghost" data-act="again1">${esc(p.again)}</button></div>`;
  } else {
    body += `<div class="mp-dots">${dots}</div><div class="mp-head"><small>${esc(t.petalOf(sel + 1))}</small>${esc(t.slots[sel].label)}</div>`;
    body += `<div class="mp-cards">${[0, 1, 2, 3].map((j) => `<button class="mp-card ${S.pet[sel] === j ? 'on' : ''}" data-act="card" data-j="${j}"><span class="e">${SLOTS[sel].emo[j]}</span><span>${esc(slotOpt(t, sel, j))}</span></button>`).join('')}</div>`;
    if (full) body += `<div class="mp-ask"><div class="q">${esc(p.q)}</div><div class="mp-opts"><button class="btn" data-act="g1" data-g="yes">${esc(p.yes)}</button><button class="btn" data-act="g1" data-g="no">${esc(p.no)}</button></div></div>`;
    body += faceRows(t);
  }
  $('ctrlBody').innerHTML = body + secRow();
  if (!S.g1) {
    lab.setReadout(`${n}/6`, p.sub, '', '#f0905f'); lab.setFacts(T[lang].facts.petals);
    lab.setState(full ? { emo: '🤔', title: p.q, lead: p.askL, body: '' } : { emo: '🌼', title: p.fillT, lead: p.fillL, body: '' });
  } else {
    const ana = matches(S.pet, ANA.pet), ben = matches(S.pet, BEN.pet), same = sameFlower(), truth = same ? 'yes' : 'no', verdict = S.g1 === truth ? p.ok : p.bad;
    lab.setReadout(`${ana}/6`, `${t.ana}: ${p.same}`, `${t.ben}: ${ben}/6`, '#f0905f');
    lab.setFacts(T[lang].facts.petals);
    lab.setState({
      emo: same ? '🎉' : '🌼', title: same ? p.sameT : p.diffT, lead: `${verdict} ${p.match(t.ana, ana)} ${p.match(t.ben, ben)}`,
      body: same ? p.sameB : ana + ben > 0 ? p.someB : p.noneB, extra: `<div class="mp-note">${esc(p.pair(ANA_BEN))}</div>`,
    });
  }
}

function renderStrong(t) {
  const p = t.p2, sec = activeSec(), i = S.si;
  lab.setGlow('rgba(232, 105, 154, .22)');
  lab.setFacts(T[lang].facts.strong);
  if (sec === 'gift') {
    const g = t.gift, chips = t.q.map((w, q) => `<button class="mp-card ${S.gift === q ? 'on' : ''}" data-act="giftq" data-i="${q}"><span class="e">${QE[q]}</span><span>${esc(w)}</span></button>`).join('');
    $('ctrlBody').innerHTML = `<div class="mp-cards">${chips}</div>` + secRow();
    lab.setReadout(S.gift === null ? '0' : '1', g.sub, '', '#e8699a');
    lab.setState(S.gift === null ? { emo: '🎁', title: g.t, lead: g.l, body: '' } : { emo: '💛', title: g.got(t.q[S.gift]), lead: g.comp[S.gift], body: p.note });
    return;
  }
  if (i < 6) {
    const sc = SCENE[i], a = S.sa[i], done = a !== undefined;
    const cards = sc.opts.map((q, j) => `<button class="mp-card ${done ? (j === sc.ok ? 'good' : j === a ? 'bad' : '') : ''}" data-act="ans" data-j="${j}"${done ? ' disabled' : ''}><span class="e">${QE[q]}</span><span>${esc(t.q[q])}</span></button>`).join('');
    $('ctrlBody').innerHTML = `<div class="mp-cards">${cards}</div>${done ? `<div class="mp-btnrow"><button class="btn" data-act="next">${esc(i === 5 ? p.own : p.next)}</button></div>` : ''}` + secRow();
    lab.setReadout(`${S.sa.filter((x) => x !== undefined).length}/6`, p.sub, '', '#e8699a');
    lab.setState(done
      ? { emo: a === sc.ok ? '✅' : '💡', title: a === sc.ok ? p.ok : p.bad, lead: p.acts[i], body: p.note }
      : { emo: '🧐', title: p.q, lead: p.lead(i + 1), body: '' });
    return;
  }
  const two = S.pick.length === 2, got = S.sa.filter((x, k) => x === SCENE[k].ok).length;
  $('ctrlBody').innerHTML = `<div class="mp-cards">${t.q.map((w, q) => `<button class="mp-card ${S.pick.includes(q) ? 'on' : ''}" data-act="pickq" data-q="${q}"><span class="e">${QE[q]}</span><span>${esc(w)}</span></button>`).join('')}</div>
    <div class="mp-btnrow"><button class="btn ghost" data-act="again2">${esc(p.again)}</button></div>` + secRow();
  lab.setReadout(`${got}/6`, p.sub, '', '#e8699a');
  lab.setState(two ? { emo: '🌟', title: p.two(t.q[S.pick[0]], t.q[S.pick[1]]), lead: p.twoL, body: '' } : { emo: '🙋', title: p.ownT, lead: p.ownL, body: '' });
}

function renderGrow(t) {
  const p = t.p3, sec = activeSec();
  lab.setGlow('rgba(143, 128, 227, .24)');
  if (sec === 'yet') {
    const y = S.yet, chips = t.yetItems.map((w, k) => `<button class="mp-card ${y.item === k ? 'on' : ''}" data-act="yetp" data-i="${k}"><span class="e">${YETE[k]}</span><span>${esc(w)}</span></button>`).join('');
    $('ctrlBody').innerHTML = `<div class="mp-cards">${chips}</div>${y.item >= 0 ? `<div class="mp-btnrow">${y.n >= 3 ? `<button class="btn ghost" data-act="yetagain">${esc(p.again)}</button>` : `<button class="btn" data-act="prac">${esc(p.prac)}</button>`}</div>` : ''}` + secRow();
    lab.setReadout(`${y.n}/3`, p.yetSub, '', '#b58de8'); lab.setFacts([]);
    lab.setState(y.item < 0 ? { emo: '🌱', title: p.yetT, lead: p.yetL, body: '' }
      : y.n >= 3 ? { emo: '🌸', title: p.yetDoneT, lead: p.yetDoneB, body: '' } : { emo: '🌱', title: p.yetT, lead: p.yetN(y.n), body: '' });
    return;
  }
  if (!S.g3) {
    $('ctrlBody').innerHTML = `<div class="mp-ask"><div class="q">${esc(p.q)}</div><div class="mp-opts"><button class="btn" data-act="g3" data-g="yes">${esc(p.yes)}</button><button class="btn" data-act="g3" data-g="no">${esc(p.no)}</button></div></div>` + secRow();
    lab.setReadout('?', p.sub, '', '#8f80e3'); lab.setFacts([]);
    lab.setState({ emo: '🤔', title: p.q, lead: p.askL, body: '' });
    return;
  }
  const verdict = S.g3 === 'no' ? p.ok : p.bad, age = S.age;
  $('ctrlBody').innerHTML = `<div class="mp-row"><span class="mp-lbl">${esc(p.ageL)}</span>${[5, 7, 9].map((a) => `<button class="mp-gl ${age === a ? 'on' : ''}" data-act="age" data-i="${a}" style="min-width:56px">${a}</button>`).join('')}</div>
    <div class="mp-note">${esc(p.model)}</div>` + secRow();
  lab.setReadout(String(age), p.sub, '', '#8f80e3'); lab.setFacts(T[lang].facts.grow);
  if (age === 5) lab.setState({ emo: '🌱', title: p.age(5), lead: p.start(verdict), body: p.startB });
  else { const [s, c, n] = ageCounts(age); lab.setState({ emo: '🌸', title: p.age(age), lead: p.since(age === 7 ? 5 : 7, s, c, n), body: age === 7 ? p.b7 : p.b9 }); }
}
render();
</script>
</body>
</html>
