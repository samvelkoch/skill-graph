<style>
  #gauge { display: none; }
  #stage { container-type: inline-size; }
  body[data-v=move] #stage { min-height: 500px; }
  body[data-v=change] #stage { min-height: 440px; }
  body[data-v=everywhere] #stage { height: auto; min-height: 0; }
  body[data-v=everywhere] #overlay { position: static; }
  body[data-v=everywhere] #cv { display: none; }

  /* question / verdict card on top of the scene */
  .ask { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: min(560px, calc(100% - 16px)); padding: 12px 16px; text-align: center; }
  .ask .q { font: 500 22px/1.2 var(--serif); color: #fff; margin-bottom: 10px; text-wrap: balance; }
  .ask .opts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .ask button { padding: 9px 18px; min-height: 40px; border-radius: 999px; border: 1px solid var(--stroke2); background: rgba(130, 145, 190, .1); font-weight: 800; cursor: pointer; }
  .ask button:hover { background: rgba(130, 145, 190, .25); }
  .ask p { margin: 0 0 6px; color: var(--soft); font-size: 13.5px; font-weight: 700; }
  .ask .verdict { font: 500 22px/1.15 var(--serif); margin-bottom: 6px; }
  .ask .verdict.ok { color: var(--ok); } .ask .verdict.no { color: var(--wip); }
  .ask .clues { list-style: none; margin: 0 0 8px; padding: 0; color: var(--soft); font-weight: 800; font-size: 14px; }
  .ask .clues li { padding: 2px 0; }
  .ask .clues li::before { content: '• '; color: var(--faint); }
  .fine { font-size: 11px; color: var(--faint); }
  .note { margin-top: 8px; font-size: 12.5px; color: var(--wip); font-weight: 700; }
  .note:empty { display: none; }

  /* the four needs: covered by a solid card until the child has answered */
  .needs { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: min(520px, calc(100% - 16px)); overflow: hidden;
    padding: 8px 14px; border-radius: 16px; background: rgba(10, 12, 22, .86); border: 1px solid var(--stroke2); }
  .nrow { display: grid; grid-template-columns: 24px 76px 1fr 20px; align-items: center; gap: 8px; height: 30px; }
  .ni { font-size: 18px; text-align: center; }
  .nl { font-size: 13px; font-weight: 800; color: var(--soft); white-space: nowrap; }
  .nbar { height: 14px; border-radius: 999px; background: rgba(130, 145, 190, .18); overflow: hidden; }
  .nbar i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width .6s .2s; }
  .nbar i.c0 { background: #e5484d; } .nbar i.c1 { background: #f5c84c; } .nbar i.c2 { background: #3ddc97; }
  .nv { font-size: 14px; font-weight: 900; text-align: center; color: var(--soft); opacity: 0; transition: opacity .3s .7s; }
  .needs.open .nv { opacity: 1; }
  .ncover { position: absolute; inset: 0; background: #171c33; display: grid; place-items: center; font: 900 46px/1 var(--sans); color: #aab3d6; transition: transform .5s; }
  .needs.open .ncover { transform: translateY(105%); }
  .needs.nt, .needs.nt * { transition: none !important; }

  /* controls */
  .chip.big { font-size: 26px; padding: 4px 10px; min-height: 46px; min-width: 52px; justify-content: center; }
  #placeChips .chip { min-height: 38px; }
  .row2.dim { opacity: .35; pointer-events: none; }
  .chcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .chcard { text-align: left; padding: 10px 12px; min-height: 44px; border-radius: 14px; border: 1px solid var(--stroke2); background: rgba(130, 145, 190, .08);
    cursor: pointer; display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
  .chcard:hover { background: rgba(130, 145, 190, .18); }
  .chcard.on { border-color: #fff; background: rgba(255, 255, 255, .14); }
  .chcard span { font-size: 12px; color: var(--mut); font-weight: 600; line-height: 1.35; }

  /* view 2: six cards that flip */
  .evgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @container (min-width: 560px) { .evgrid { grid-template-columns: repeat(3, 1fr); } }
  .evc { perspective: 900px; }
  .evi { display: grid; min-height: 250px; transition: transform .6s; transform-style: preserve-3d; }
  .evc.flipped .evi { transform: rotateY(180deg); }
  .face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; padding: 12px 10px; display: flex; flex-direction: column;
    align-items: center; text-align: center; gap: 6px; border-radius: 18px; border: 1px solid var(--stroke); background: rgba(16, 19, 32, .94); }
  .face.back { transform: rotateY(180deg); justify-content: center; }
  .face .pe { font-size: 44px; line-height: 1.1; }
  .face .pn { font: 500 20px/1.1 var(--serif); color: #fff; }
  .face .pq { color: var(--mut); font-size: 13px; font-weight: 700; flex: 1; display: flex; align-items: center; }
  .face .pb { display: flex; gap: 8px; }
  .face .pb button { padding: 8px 16px; min-height: 40px; border-radius: 999px; border: 1px solid var(--stroke2); background: rgba(130, 145, 190, .1); font-weight: 800; cursor: pointer; }
  .face .pb button:hover { background: rgba(130, 145, 190, .25); }
  .face .an { font-size: 13px; font-weight: 800; color: var(--ink); line-height: 1.5; }
  .face .ft { font-size: 12px; color: var(--soft); line-height: 1.4; font-weight: 600; }
  .face .su { font-size: 12.5px; color: var(--wip); font-weight: 800; }
  .face .hd { font-size: 12px; color: var(--mut); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

  @media (max-width: 760px) {
    body[data-v=move] #stage { height: min(150vw, 620px); min-height: 0; }
    body[data-v=change] #stage { height: min(125vw, 540px); min-height: 0; }
    .ask .q, .ask .verdict { font-size: 18px; } .ask { padding: 10px 12px; } .ask button { padding: 7px 14px; font-size: 13px; }
  }
</style>

    for (let i = 0; i <= 40; i++) { const a = i / 40 * 6.283, r = 54 + 6 * Math.sin(3 * a + t * 1.5) + 4 * Math.cos(5 * a - t); c[i ? 'lineTo' : 'moveTo'](w / 2 + Math.cos(a) * r * 1.2, cy + Math.sin(a) * r); }
    c.closePath(); c.fillStyle = '#04050b'; c.fill(); c.strokeStyle = 'rgba(160,170,230,.35)'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#8f9bd8'; c.font = '900 54px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', w / 2, cy + 3);
    return;
  }
  const place = guess ? m.answer : S.p, emo = guess ? m.reveal.split(' ')[0] : AEMO[S.a];
  SCENE[place](c, w, h, gy, t, S.iceT);
  drawAnimal(c, emo, place, w, gy, t, top);
}
const unlockedBtn = (t, k, emo) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${secret.unlocked() ? `${emo} ${esc(t.secrets[k][0])}` : `${t.sec.lock} ???`}</button>`;

// paint the four bars; vals = null keeps them empty and covered
function paintNeeds(vals, animate) {
  if (!animate) needsEl.classList.add('nt');
  needsEl.classList.toggle('open', !!vals);
  needsEl.querySelectorAll('.nrow').forEach((row, i) => {
    const v = vals ? vals[i] : 0, bar = row.querySelector('i');
    bar.style.width = `${v * 50}%`; bar.className = `c${v}`;
    row.querySelector('.nv').textContent = vals ? ['✕', '◐', '✓'][v] : '';
  });
  void needsEl.offsetWidth; // commit without a transition, then let later changes animate
  needsEl.classList.remove('nt');
}
function resetPair() {
  S.ans = null; S.rev = false; S.tok++; S.note = false;
  if (S.sec === 'heat' && !(S.a === 'bear' && S.p === 'polar')) S.sec = null;
}
function answerMove(a) {
  S.ans = a; S.rev = false; S.animNext = true; const tok = ++S.tok;
  sfx.click(); render();
  setTimeout(() => {
    if (tok !== S.tok) return;
    S.rev = true;
    ((a === 'yes') === isFine(NEEDS[S.a][S.p]) ? sfx.good : sfx.bad)();
    render(); showStage();
  }, 850);
}
function answerGuess(k) {
  const g = S.g;
  if (g.solved) return;
  if (k === T[lang].sec.mysteries[g.i].answer) { g.solved = true; g.wrong = false; sfx.good(); showStage(); } else { g.wrong = true; sfx.bad(); }
  render();
}

function renderMove(t) {
  const guess = S.sec === 'guess', heat = S.sec === 'heat', a = t.ask;
  lab.setGlow('rgba(224, 160, 80, .26)');
  $('lblA').textContent = t.animalRow; $('lblP').textContent = t.placeRow;
  $('animalRow').classList.toggle('dim', guess);
  $('animalChips').innerHTML = ANIMALS.map((k) => `<button class="chip big ${!guess && k === S.a ? 'on' : ''}" data-an="${k}" aria-label="${esc(t.animals[k])}" title="${esc(t.animals[k])}">${AEMO[k]}</button>`).join('');
  $('placeChips').innerHTML = PLACES.map((k) => `<button class="chip ${!guess && k === S.p ? 'on' : ''}" data-pl="${k}">${PEMO[k]} ${esc(t.places[k][0])}</button>`).join('');
  $('secChips').innerHTML = unlockedBtn(t, 'heat', '🌡️') + unlockedBtn(t, 'guess', '🕵️');
  $('heatBox').style.display = heat ? '' : 'none';
  $('heatL').textContent = t.sec.warmer; $('heatV').textContent = `+${S.heat} °C`; $('heatR').value = S.heat; $('heatR').setAttribute('aria-label', t.sec.warmer);
  needsEl.querySelectorAll('.nl').forEach((el, i) => { el.textContent = t.needs[i]; });
  const anim = S.animNext; S.animNext = false;

  if (guess) { // mystery animal: the Place row is the answer
    const g = S.g, m = t.sec.mysteries[g.i];
    lab.setReadout('🕵️', '●'.repeat(g.i + 1) + '○'.repeat(3 - g.i), '', '#8f7fd0');
    askEl.style.display = '';
    askEl.innerHTML = g.solved
      ? `<div class="verdict ok">${esc(t.sec.guessRight)}</div><p style="font-size:16px">${esc(m.reveal)}</p><div class="opts"><button data-next="1">${esc(t.sec.next)} →</button></div>`
      : `<div class="q">${esc(t.sec.guessQ)}</div><ul class="clues">${m.clues.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>${g.wrong ? `<div class="verdict no" style="font-size:16px">${esc(t.sec.guessWrong)}</div>` : ''}`;
    lab.setState({ emo: '🕵️', title: t.secrets.guess[0], lead: t.sec.guessQ, body: '', extra: '' });
    return;
  }
  const vals = heat ? HEAT[S.heat] : S.ans ? NEEDS[S.a][S.p] : null, fine = vals && isFine(vals);
  paintNeeds(vals, anim);
  lab.setReadout(`${AEMO[S.a]}${PEMO[S.p]}`, t.sub(t.animals[S.a], t.places[S.p][0]), heat ? (fine ? t.pillHome : '') : (S.rev && fine ? t.pillHome : ''), '#e0a050');
  if (heat) {
    askEl.style.display = 'none';
    lab.setState({ emo: '🌡️', title: t.secrets.heat[0], lead: t.sec.heatText, body: '', extra: '' });
    return;
  }
  askEl.style.display = '';
  const q = `<div class="q">${esc(a.q(t.who[S.a], t.where[S.p]))}</div>`;
  if (!S.ans) askEl.innerHTML = `${q}<div class="opts"><button data-a="yes">${esc(a.yes)}</button><button data-a="no">${esc(a.no)}</button></div>`;
  else if (!S.rev) askEl.innerHTML = q;
  else {
    const right = (S.ans === 'yes') === fine, v = NEEDS[S.a][S.p];
    const names = (n) => t.needs.filter((_, i) => v[i] === n).map((x) => x.toLowerCase()).join(', ');
    const lines = [];
    if (v.includes(0)) lines.push(a.missing(names(0)));
    if (v.includes(1)) lines.push(a.few(names(1)));
    if (!v.includes(0) && !v.includes(1)) lines.push(a.allGood);
    if (isHome(S.a, S.p)) lines.push(a.home);
    askEl.innerHTML = `<div class="verdict ${right ? 'ok' : 'no'}">${esc(right ? a.right : a.wrong)}</div>${lines.map((x) => `<p>${esc(x)}</p>`).join('')}`;
  }
  lab.setState({ emo: PEMO[S.p], title: t.places[S.p][0], lead: t.places[S.p][1], body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
}

// --- view 2: everywhere --------------------------------------------------------------------------------------
const backHtml = (k, ans) => {
  const e = T[lang].everywhere, P = e.places[k];
  return `<div class="hd">${EVEMO[k]} ${esc(P.name)}</div><div class="an">${P.animals.split(' · ').map(esc).join('<br>')}</div><div class="ft">${esc(P.fact)}</div>${ans === 'no' ? `<div class="su">${esc(e.surprise)}</div>` : ''}`;
};
function renderEvCards() {
  const e = T[lang].everywhere;
  evEl.innerHTML = EV.map((k) => {
    const ans = S.ev[k], P = e.places[k];
    return `<div class="evc ${ans ? 'flipped' : ''}" data-k="${k}"><div class="evi">
      <div class="face front"><div class="pe">${EVEMO[k]}</div><div class="pn">${esc(P.name)}</div><div class="pq">${esc(e.askLine)}</div>
        <div class="pb"><button data-ans="yes">${esc(e.yes)}</button><button data-ans="no">${esc(e.no)}</button></div></div>
      <div class="face back">${ans ? backHtml(k, ans) : ''}</div></div></div>`;
  }).join('');
}
function evStatus() {
  const e = T[lang].everywhere, n = Object.keys(S.ev).length;
  lab.setReadout(e.count(n), '', '', '#4ea8ff');
  lab.setState(n === 6 ? { emo: '🌍', title: e.doneTitle, lead: e.doneLead, body: '', extra: '' } : { emo: '🌍', title: e.askLine, lead: '', body: '', extra: '' });
}
function renderEvery() {
  lab.setGlow('rgba(78, 168, 255, .26)');
  renderEvCards(); evStatus();
}

// --- view 3: change ------------------------------------------------------------------------------------------
const aliveAt = (k, tt) => k === 'road' ? FROGS - FATE.filter((f, i) => f === 'v' && (tt - (0.9 + i * 0.5)) / 1.7 >= 0.85).length
  : k === 'drain' ? FROGS - DORD.filter((_, j) => tt >= 0.8 + j * 0.42 + 0.25).length : FROGS;
const geo = (w, h) => ({ pondL: w * 0.04, pondR: w * 0.64, bankY: h * 0.42, bot: h * 0.9, roadX: w * 0.72, roadW: Math.max(34, w * 0.1), farX: w * 0.92 });
const frogBase = (f, g) => [lerp(g.pondL + 30, g.pondR - 26, (f & 3) / 3) + ((f * 37) % 11 - 5), g.bankY + 38 + (f >> 2) * ((g.bot - g.bankY - 70) / 2.4) + ((f * 53) % 9 - 4)];
function frogAt(f, k, tt, g) {
  let [x, y] = frogBase(f, g), a = 1, hop = 0;
  if (k === 'road') {
    const i = ATT.indexOf(f), u = i < 0 ? 0 : sat((tt - (0.9 + i * 0.5)) / 1.7);
    if (u > 0) {
      if (FATE[i] === 'x') {
        const e = ease(u), farY = lerp(g.bankY, g.bot, 0.55);
        x = lerp(x, g.farX + ((i * 9) % 24 - 12), e); y = lerp(y, farY + ((i * 13) % 20 - 10), e);
      } else {
        x = lerp(x, g.roadX + g.roadW / 2 + ((i * 7) % 10 - 5), ease(sat(u / 0.7)));
        a = u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3;
      }
      if (u < 1) hop = Math.abs(Math.sin(u * Math.PI * 6)) * 12;
    }
  } else if (k === 'drain') {
    const j = DORD.indexOf(f);
    if (j >= 0) a = 1 - sat((tt - (0.8 + j * 0.42)) / 0.5);
    else if (tt > 2.5) { // the two left hop toward the edge
      const u = sat((tt - 2.5) / 3.3), e = ease(u);
      x = lerp(x, g.pondR + 4, e); y = lerp(y, g.bankY + 44, e); if (u < 1) hop = Math.abs(Math.sin(u * Math.PI * 7)) * 10;
    }
  }
  return { x, y: y - hop, a };
}
function drawChange(c, w, h, dt, rt) {
  const ch = S.ch;
  if (ch.playing) {
    ch.t += dt;
    if (ch.t >= DUR) { ch.t = DUR; ch.playing = false; ch.done = true; ((CHRES[ch.k] === ch.ans) ? sfx.good : sfx.bad)(); render(); showStage(); }
  }
  const k = ch.ans === null ? null : ch.k, tt = k ? ch.t : 0, g = geo(w, h);
  let level = 1;
  if (k === 'summer') level = tt < 3 ? lerp(1, 0.6, ease(tt / 3)) : lerp(0.6, 1, ease((tt - 3) / 3));
  if (k === 'drain') level = 1 - ease(sat(tt / 5.2));
  const brown = k === 'drain' ? 1 - level : 0, roadK = k === 'road' ? ease(sat(tt / 0.8)) : 0, sunK = k === 'summer' ? sat((1 - level) / 0.4) : 0;
  const alive = aliveAt(k, tt);
  if (alive !== S.shownAlive) { S.shownAlive = alive; lab.setReadout(alive, T[lang].change.frogs, '', '#6fb36f'); }

  c.fillStyle = grad(c, 0, g.bankY, [[0, mix('#6db8e6', '#f2b552', sunK * 0.6)], [1, mix('#d6efe0', '#ffe3a0', sunK * 0.6)]]); c.fillRect(0, 0, w, h);
  if (sunK > 0) { c.fillStyle = `rgba(255,236,150,${0.3 * sunK})`; dot(c, w * 0.2, h * 0.17, 56 + Math.sin(rt * 3) * 4); c.fillStyle = `rgba(255,243,176,${sunK})`; dot(c, w * 0.2, h * 0.17, 32); }
  c.fillStyle = '#3f8a4a'; for (let i = 0; i < 9; i++) dot(c, i * w / 8, g.bankY - 2, 24 + (i % 3) * 7);
  c.fillStyle = mix('#4f9a4a', '#a8a050', brown * 0.5); c.fillRect(0, g.bankY, w, h - g.bankY);
  // the next pond, always there on the far side
  const fy = lerp(g.bankY, g.bot, 0.55);
  c.fillStyle = grad(c, fy - 40, fy + 40, [[0, '#3f9fb0'], [1, '#1d5f73']]); c.beginPath(); c.ellipse(g.farX, fy, w * 0.075, (g.bot - g.bankY) * 0.3, 0, 0, 7); c.fill();
  reed(c, g.farX - w * 0.05, fy - 8, 34, rt, 1, '#3f9a4a'); reed(c, g.farX + w * 0.05, fy - 4, 30, rt, 3, '#3f9a4a');
  if (roadK > 0) { // the new road
    c.save(); c.translate((1 - roadK) * 70, 0); c.globalAlpha = roadK;
    c.fillStyle = '#4a4d57'; c.fillRect(g.roadX, g.bankY - 24, g.roadW, h - g.bankY + 24);
    c.fillStyle = '#6b6f7c'; c.fillRect(g.roadX, g.bankY - 24, 3, h - g.bankY + 24); c.fillRect(g.roadX + g.roadW - 3, g.bankY - 24, 3, h - g.bankY + 24);
    c.fillStyle = '#f5c84c'; for (let y = g.bankY - 20; y < h; y += 30) c.fillRect(g.roadX + g.roadW / 2 - 1.5, y, 3, 16);
    c.restore(); c.globalAlpha = 1;
  }
  // the pond: a soil basin, water inside it, cracks when it dries
  const bt = g.bankY + 4, rad = 26, wTop = lerp(g.bot - 6, g.bankY + 10, level);
  c.save(); c.beginPath(); c.roundRect(g.pondL, bt, g.pondR - g.pondL, g.bot - bt, rad); c.clip();
  c.fillStyle = '#6b4a2f'; c.fillRect(g.pondL, bt, g.pondR - g.pondL, g.bot - bt);
  if (level > 0.02) {
    c.fillStyle = grad(c, wTop, g.bot, [[0, '#4aa8bb'], [1, '#1d5f73']]); c.fillRect(g.pondL, wTop, g.pondR - g.pondL, g.bot - wTop);
    c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1.5; c.beginPath();
    for (let x = g.pondL; x <= g.pondR; x += 6) c[x === g.pondL ? 'moveTo' : 'lineTo'](x, wTop + Math.sin(x / 14 + rt * 2) * 1.6); c.stroke();
  }
  if (brown > 0.4) {
    c.strokeStyle = `rgba(40,25,12,${(brown - 0.4) * 1.2})`; c.lineWidth = 1.5; c.beginPath();
    for (let i = 0; i < 7; i++) { const x = g.pondL + 24 + i * (g.pondR - g.pondL - 48) / 6, y = g.bot - 30 - (i % 3) * 40; c.moveTo(x, y); c.lineTo(x + 16, y + 12); c.lineTo(x + 8, y + 26); c.moveTo(x + 16, y + 12); c.lineTo(x + 32, y + 8); }
    c.stroke();
  }
  c.restore();
  const rc = mix('#3f9a4a', '#8a6a3a', brown);
  for (let i = 0; i < 3; i++) { reed(c, g.pondL + 8 + i * 12, g.bankY + 20, 62 + (i % 2) * 14, rt, i, rc); reed(c, g.pondR - 8 - i * 12, g.bankY + 20, 66 + (i % 2) * 10, rt, i + 2, rc); }
  // frogs
  c.fillStyle = '#000'; c.font = `28px ${EMO}`; c.textAlign = 'center'; c.textBaseline = 'middle'; // opaque fill: it tints colour emoji
  for (let f = 0; f < FROGS; f++) {
    const fr = frogAt(f, k, tt, g);
    if (fr.a <= 0.01) continue;
    c.globalAlpha = fr.a; c.fillText('🐸', fr.x, fr.y + Math.sin(rt * 2 + f) * 1.5);
  }
  c.globalAlpha = 1;
  if (roadK > 0) { // cars drive over everything
    c.save(); c.globalAlpha = roadK;
    for (let i = 0; i < 4; i++) {
      const dir = i % 2 ? -1 : 1, cx = g.roadX + g.roadW * (dir > 0 ? 0.28 : 0.72), cy = (((rt * 110 * dir + i * 97) % (h + 60)) + (h + 60)) % (h + 60) - 30;
      c.save(); c.translate(cx, cy); c.rotate(dir > 0 ? -Math.PI / 2 : Math.PI / 2); c.fillStyle = '#000'; c.font = `26px ${EMO}`; c.fillText(['🚗', '🚙', '🚚', '🚕'][i], 0, 0); c.restore();
    }
    c.restore();
  }
}
function renderChange(t) {
  const c = t.change, ch = S.ch;
  lab.setGlow('rgba(111, 179, 111, .24)');
  $('chCards').innerHTML = CH.map((k) => `<button class="chcard ${ch.k === k ? 'on' : ''}" data-ch="${k}"><b>${esc(c.cards[k])}</b><span>${esc(c.desc[k])}</span></button>`).join('');
  $('chNote').textContent = c.note;
  S.shownAlive = null; // the next frame writes the readout
  if (ch.k && ch.ans === null) {
    askEl.style.display = '';
    askEl.innerHTML = `<div class="q">${esc(c.q)}</div><div class="opts">${c.opts.map((o, i) => `<button data-o="${i}">${esc(o)}</button>`).join('')}</div>`;
    lab.setState({ emo: c.cards[ch.k].split(' ')[0], title: c.cards[ch.k].split(' ').slice(1).join(' '), lead: c.desc[ch.k], body: '', extra: '' });
  } else if (ch.done) {
    const right = CHRES[ch.k] === ch.ans;
    askEl.style.display = '';
    askEl.innerHTML = `<div class="verdict ${right ? 'ok' : 'no'}">${esc(right ? c.right : c.wrong)}</div><p>${esc(c.why[ch.k])}</p>`;
    lab.setState({ emo: right ? '✅' : '🤔', title: right ? c.right : c.wrong, lead: c.why[ch.k], body: '', extra: '' });
  } else {
    askEl.style.display = 'none';
    if (ch.k) lab.setState({ emo: c.cards[ch.k].split(' ')[0], title: c.cards[ch.k].split(' ').slice(1).join(' '), lead: c.desc[ch.k], body: '', extra: '' });
    else lab.setState({ emo: '🐸', title: c.q, lead: '', body: '', extra: '' });
  }
}

// --- events --------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, t) => {
  if (lab.view === 'move') drawMove(c, w, h, dt, t); else if (lab.view === 'change') drawChange(c, w, h, dt, t);
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.an) { if (S.sec === 'guess') return; S.a = d.an; resetPair(); sfx.click(); }
  else if (d.pl) { if (S.sec === 'guess') return answerGuess(d.pl); S.p = d.pl; resetPair(); sfx.click(); }
  else if (d.sec) {
    if (!secret.unlocked()) return secret.open();
    S.note = false;
    if (S.sec === d.sec) S.sec = null;
    else if (d.sec === 'heat') { S.a = 'bear'; S.p = 'polar'; resetPair(); S.sec = 'heat'; S.heat = 0; } // moves the bear onto the ice by itself
    else { if (S.g.solved) { S.g.i = (S.g.i + 1) % 4; } S.g.solved = false; S.g.wrong = false; S.sec = 'guess'; }
    sfx.click();
  } else if (d.ch) { S.ch = { k: d.ch, ans: null, t: 0, playing: false, done: false }; sfx.click(); }
  else return;
  render();
});
$('heatR').addEventListener('input', (ev) => { S.heat = +ev.target.value; S.animNext = true; sfx.tick(); render(); });
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.a) answerMove(b.dataset.a);
  else if (b.dataset.next) { S.g.i = (S.g.i + 1) % 4; S.g.solved = false; S.g.wrong = false; sfx.click(); render(); }
  else if (b.dataset.o !== undefined) { S.ch.ans = +b.dataset.o; S.ch.t = 0; S.ch.playing = true; sfx.click(); render(); }
});
evEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-ans]'); if (!b) return;
  const card = b.closest('.evc'), k = card.dataset.k;
  if (S.ev[k]) return;
  S.ev[k] = b.dataset.ans;
  card.querySelector('.back').innerHTML = backHtml(k, S.ev[k]);
  card.classList.add('flipped');
  (Object.keys(S.ev).length === 6 ? sfx.good : sfx.click)();
  evStatus();
});

// --- one render per change -----------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secMove').style.display = v === 'move' ? '' : 'none';
  $('secChange').style.display = v === 'change' ? '' : 'none';
  needsEl.style.display = v === 'move' && S.sec !== 'guess' ? '' : 'none';
  evEl.style.display = v === 'everywhere' ? '' : 'none';
  askEl.style.display = 'none';
  if (v === 'move') renderMove(t); else if (v === 'everywhere') renderEvery(); else renderChange(t);
}
render();
</script>
