    $('lyAsk').innerHTML = `<p class="ob-q">${esc(L.ask(S.s, name))}</p><div class="ob-opts">${L.btn.map((b, j) => `<button class="ob-opt" data-act="lyAns" data-k="${j}">${esc(b)}</button>`).join('')}</div><div style="height:10px"></div>`;
    lb.setReadout(`${S.s} / 4`, name, '', '#e0cfa2');
    lb.setState({ emo: '🤔', title: L.pendT(S.s, name), lead: L.pendL, body: '', extra: `<div class="ob-fine">${esc(L.fine)}</div>` });
  } else {
    const a = S.ans[i], ok = a === TRUTH[i], tr = TRUTH[i];
    $('lyRes').innerHTML = `<div class="ob-res"><span><b class="${ok ? 'ok' : 'no'}">${esc(ok ? L.right : L.no)}</b> ${esc(L.vlab[tr])}</span>${S.s === S.rev && S.rev < 4 ? `<button class="chip ob-next ob-chip" data-act="lyNext" style="background:#fff;color:#0A0C14">${esc(L.next)}</button>` : ''}</div>`;
    const all = S.rev === 4, k = S.ans.filter((x, j) => x === TRUTH[j]).length;
    lb.setReadout(`${S.s} / 4`, name, L.vlab[tr], ['#3ddc97', '#f5c84c', '#ff8aa0'][tr]);
    lb.setState({ emo: L.emo[i], title: `${name}: ${L.vlab[tr]}`, lead: L.why[i], body: i === 3 ? `${L.sum(k)} ${L.palNote}` : '', extra: `<div class="ob-fine">${esc(L.fine)}</div>` });
  }
  const pal = S.s === 4 && S.rev === 4;
  $('lyPal').hidden = !pal;
  if (pal) {
    $('palLbl').textContent = L.pal;
    $('swat').innerHTML = PALC.map((c, j) => `<button class="ob-sw ${c === S.col ? 'on' : ''}" style="background:${c}" data-act="col" data-v="${c}" aria-label="${esc(L.colNames[j])}"></button>`).join('');
    $('patts').innerHTML = PATS.map((p, j) => `<button class="chip ob-chip ${p === S.pat ? 'on' : ''}" data-act="pat" data-v="${p}">${esc(L.patt[j])}</button>`).join('');
  }
  lb.setFacts(t.facts.lay);
}
function renderTime(t, lb) {
  const M = t.tm, asked = S.hAns !== null, ei = Math.round(S.hT), open = secret.unlocked();
  lb.setGlow('rgba(110,140,190,.28)');
  $('tmAsk').hidden = asked; $('tmRes').hidden = !asked;
  $('tmSl').disabled = !asked || S.statue; $('tmSl').value = S.hT;
  $('tmTicks').innerHTML = M.eras.map((n, j) => `<span class="${asked && !S.statue && j === ei ? 'on' : ''}">${esc(n)}</span>`).join('');
  $('tmSec').className = `chip secret ob-chip ${open ? 'open' : ''} ${S.statue ? 'on' : ''}`;
  $('tmSec').textContent = open ? `🏛️ ${t.secrets.statue[0]}` : '🔒 ???';
  if (!asked) {
    $('tmAsk').innerHTML = `<p class="ob-q">${esc(M.ask)}</p><div class="ob-opts">${M.opts.map((o, j) => `<button class="ob-opt" data-act="tmAns" data-k="${j}">${esc(o)}</button>`).join('')}</div><div style="height:10px"></div>`;
  } else {
    const ok = S.hAns === 1;
    $('tmVerd').innerHTML = `<span><b class="${ok ? 'ok' : 'no'}">${esc(ok ? M.right : M.no)}</b></span>`;
  }
  if (S.statue) {
    lb.setReadout('1854', M.statueLbl, M.spike[0], '#c8c2b0');
    lb.setState({ emo: '🏛️', title: M.statue[0], lead: M.statue[1], body: M.statue[2], extra: '' });
    lb.setFacts(t.facts.st); return;
  }
  lb.setReadout(M.eras[ei], M.sub[ei], M.spike[ei], '#7fa6d6');
  if (!asked) lb.setState({ emo: '🕰️', title: M.pend[0], lead: M.pend[1], body: M.pend[2], extra: '' });
  else lb.setState({ emo: ['🗿', '⛏️', '🦖'][ei], title: M.era[ei][0], lead: M.era[ei][1], body: M.era[ei][2], extra: '' });
  lb.setFacts(asked ? t.facts.t1 : t.facts.t0);
}
function renderColour(t, lb) {
  const C = t.co, open = secret.unlocked(), refI = ['fossil', 'black', 'ginger'].indexOf(S.cref);
  lb.setGlow('rgba(200,150,100,.26)');
  $('coNorm').hidden = false;
  $('coSec').className = `chip secret ob-chip ${open ? 'open' : ''} ${S.tyrant ? 'on' : ''}`;
  $('coSec').textContent = open ? `🪶 ${t.secrets.tyr[0]}` : '🔒 ???';
  if (S.tyrant) {
    $('coNorm').hidden = true;
    lb.setReadout('~8 m', C.tyrLbl[1], '', '#a7c27a');

    lb.setFacts(t.facts.ty); return;

  $('coZl').textContent = `🔍 ${C.zoom}: ${C.ends[0]}`; $('coZr').textContent = C.ends[1];
  $('coCmp').textContent = C.cmp;
  $('coRef').innerHTML = ['fossil', 'black', 'ginger'].map((k, j) => `<button class="chip ob-chip ${k === S.cref ? 'on' : ''}" data-act="ref" data-v="${k}">${esc(C.chips[j])}</button>`).join('');
  const ask = $('coAsk'), verd = $('coVerd');
  if (!S.cDone) {
    ask.hidden = false; verd.hidden = true;
    ask.innerHTML = `<p class="ob-q">${esc(C.q)}</p><div class="ob-opts">${C.opts.map((o, j) => `<button class="ob-opt" data-act="coAns" data-k="${j}"${S.cZoomed ? '' : ' disabled'}>${esc(o)}</button>`).join('')}</div>${S.cZoomed ? '' : `<p class="ob-fine" style="margin:6px 0 0">${esc(C.zoomFirst)}</p>`}`;
  } else {
    ask.hidden = true; verd.hidden = false;

  }
  const seen = S.cz >= 0.5, shp = C.shape[shapeOf(S.cref)];
  lb.setReadout(seen ? shp : '?', seen ? C.shSub : C.zoomFirst, seen ? (S.cref === 'fossil' ? (S.cDone ? C.pillFos : '') : C.pillRef[shapeOf(S.cref)]) : '', '#d8a878');
  if (S.cref !== 'fossil') lb.setState({ emo: '🪶', title: C.ref[shapeOf(S.cref)][0], lead: C.ref[shapeOf(S.cref)][1], body: C.ref[shapeOf(S.cref)][2], extra: '' });
  else if (!S.cDone) lb.setState({ emo: '🔬', title: C.pend[0], lead: C.pend[1], body: C.pend[2], extra: '' });
  else lb.setState({ emo: '🔬', title: S.cPick === 1 ? C.right : C.no, lead: C.rev[0], body: C.rev[1],
    extra: `<span class="ob-leg"><span class="ob-dot" style="background:${REVEAL.stripe}"></span>${esc(C.leg[0])}</span><span class="ob-leg"><span class="ob-dot" style="background:${REVEAL.base}"></span>${esc(C.leg[1])}</span>` });
  void refI;
  lb.setFacts(S.cDone ? t.facts.c1 : t.facts.c0);
}
render();
