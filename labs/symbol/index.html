  else { c.beginPath(); c.arc(0, -50, 11.5, Math.PI, 0); c.closePath(); c.fillStyle = '#4c6b32'; c.fill(); c.strokeStyle = '#2d4219'; c.lineWidth = 1.3; c.stroke(); rr(c, -12, -51, 24, 4, 2); c.fillStyle = '#3d5728'; c.fill(); c.stroke(); }

  else { glow(c, 128, 28, 30, '255,246,200', 0.8); ell(c, 128, 28, 9, 9, '#fff6c8'); }

function drawRoad(c, t, dt) {

// --- canvas loop and taps ---------------------------------------------------------------------------------------------
const cv = $('cv');
canvasLoop(cv, (c, w, h, dt, t) => {
  G.sc = Math.max(0.2, Math.min(w / W, h / H)); G.ox = (w - W * G.sc) / 2; G.oy = (h - H * G.sc) / 2;
  c.save(); c.translate(G.ox, G.oy); c.scale(G.sc, G.sc);
  if (S.sec === 'colour') drawRoom(c, t, dt, true);
  else if (S.sec === 'own') drawFable(c, t, dt);
  else if (lab.view === 'room') drawRoom(c, t, dt, false);
  else if (lab.view === 'fable') drawFable(c, t, dt);
  else drawRoad(c, t, dt);
  c.restore();
});
cv.addEventListener('pointerdown', (ev) => {
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.sc, y = (ev.clientY - r.top - G.oy) / G.sc;
  if (S.sec) return;
  if (lab.view === 'room') {
    let best = -1, bd = 1e9; OB.forEach((o, i) => { const d = Math.hypot(x - o.x, y - o.y); if (d < o.r + 8 && d < bd) { bd = d; best = i; } });
    if (best < 0) return;
    const R = S.room;
    if (R.sel === best && R.ans[best] !== null) R.flipT[best] = R.flipT[best] ? 0 : 1; else R.sel = best;
    sfx.tick(); render();
  } else if (lab.view === 'fable' && S.fab.stage === 0) {
    const i = Math.floor(x / 72); if (y < 90 || y > 232 || i < 0 || i > 4) return;
    S.fab.sel = i; sfx.tick(); render();
  } else if (lab.view === 'road') {
    if (y < 10 || y > 262) return;
    S.road.sel = x < 180 ? 0 : 1; sfx.tick(); render();
  }
});

// --- controls ---------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect(), keep = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bar-keep')) || 0;
  if (r.top < keep || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const nextOpen = (arr, from) => { for (let k = 1; k <= arr.length; k++) { const i = (from + k) % arr.length; if (arr[i] === null) return i; } return -1; };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = +b.dataset.k, v = lab.view;
  const R = S.room, F = S.fab, Rd = S.road, C = S.col, O = S.own;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  } else if (act === 'obj') { R.sel = k; sfx.tick(); }
  else if (act === 'opt') {
    R.ans[R.sel] = k; R.flipT[R.sel] = 1; (k === OB[R.sel].ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'rnext') {

// --- one render per change: controls, readout and the state card --------------------------------------------------------
const secRow = (t) => {
  const open = secret.unlocked();
  const chip = (key, emo, ti) => `<button class="sy-chip ${open ? '' : 'dim'} ${S.sec === key ? 'on' : ''}" data-act="sec" data-k="${key}" style="${open ? '' : 'border-style:dashed'}">${open ? `${emo} ${esc(ti)}` : '🔒 ???'}</button>`;
  return `<div class="sy-sec"><div class="sy-row" style="margin:0">${chip('colour', '🎨', t.secrets.a[0])}${chip('own', '✍️', t.secrets.b[0])}</div></div>`;
};
const opts = (list, ok, picked, act) => `<div class="sy-opts">${list.map((o, j) => {

function render() {
  const t = T[lang], v = lab.view;
  lab.setFacts(t.facts[v] || []);
  lab.setGlow(S.sec === 'colour' ? 'rgba(180, 90, 100, .28)' : S.sec === 'own' ? 'rgba(232, 134, 58, .26)' : v === 'room' ? 'rgba(240, 180, 90, .26)' : v === 'fable' ? 'rgba(232, 134, 58, .26)' : 'rgba(127, 176, 232, .26)');

function renderRoom(t) {

  lab.setReadout(esc(f.names[O.a]), f.traits[O.t], '', '#e8863a');
  lab.setState({ emo: '✍️', title: o.title, lead: lines.join(' '), body: O.m === null ? o.hold : o.res(o.morals[O.m]), extra: '' });
  const row = (label, items, cur, act) => `<div class="sy-sub">${esc(label)}</div><div class="sy-row" style="margin-top:2px">${items.map((x, k) => `<button class="sy-chip ${k === cur ? 'on' : ''}" data-act="${act}" data-k="${k}">${esc(x)}</button>`).join('')}</div>`;
  const sits = o.sits.map((s, k) => `${o.sitEmo[k]} ${s}`);
  return `${row(o.a, f.names, O.a, 'oa')}${row(o.t, f.traits, O.t, 'ot')}${row(o.s, sits, O.s, 'os')}
    <div class="sy-sub">${esc(o.title)}</div>${lines.map((l) => `<p class="sy-line">${esc(l)}</p>`).join('')}
    <div class="sy-q">${esc(o.mq)}</div><div class="sy-row" style="margin-top:2px">${o.morals.map((m, k) => `<button class="sy-chip ${k === O.m ? 'on' : ''}" data-act="om" data-k="${k}">${esc(m)}</button>`).join('')}</div>`;
}
render();
</script>
</body>
</html>
