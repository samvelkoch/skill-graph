  else {
    $('objBend').innerHTML = objChips(LISTS.bend);
    const acts = Object.keys(ITEMS[curObj()].acts), a = curAct(), emo = { squash: '✊', bend: '〰️', twist: '🌀', stretch: '↔️' };
    $('actBend').innerHTML = acts.map((k) => `<button class="chip sq-act ${k === a && !S.sec ? 'on' : ''}" data-act="act" data-a="${k}">${emo[k]} ${esc(t.act[k])}</button>`).join('');
  }
  if (sec === 'limit') return renderLimit(t, col[0]);
  if (sec === 'warm') return renderWarm(t, col[0]);
  const id = curObj(), act = curAct(), res = curRes(), nm = name(id), who = `${nm} · ${t.act[act]}`;
  if (S.ph !== 'done') {
    lab.setReadout('?', '', '', col[0]);
    lab.setState({ emo: '🤔', title: nm, lead: t.pick, body: '', extra: '' });
    lab.setFacts([]);
    if (S.ph === 'ask') {
      askEl.hidden = false;
      askEl.innerHTML = `<div class="sq-who">${esc(who)}</div><div class="sq-q">${esc(t.ask)}</div><div class="sq-bd">${KEYS.map((k) => `<button class="sq-b" data-g="${k}"><span class="e">${BADGE[k]}</span>${esc(t.res[k])}</button>`).join('')}</div>`;
    }
    return;
  }
  const right = S.guess === res;
  lab.setReadout(BADGE[res], t.res[res], right ? t.right : '', col[0]);
  lab.setState({ emo: BADGE[res], title: `${nm}: ${t.res[res].toLowerCase()}`, lead: right ? t.right : t.notq, body: t.o[id][1], extra: '' });
  lab.setFacts(t.facts[v]);
  askEl.hidden = false;
  askEl.innerHTML = `<div class="sq-v" style="color:${right ? 'var(--ok)' : 'var(--wip)'}">${esc(right ? t.right : t.notq)}</div>
    <div class="sq-bd">${KEYS.map((k) => `<div class="sq-b ${k === res ? 'ok' : k === S.guess ? 'no' : 'dim'}"><span class="e">${BADGE[k]}</span>${esc(t.res[k])}</div>`).join('')}</div>
    <div class="sq-btns"><button class="sq-btn" data-r="1">${esc(t.again)}</button><button class="sq-btn main" data-n="1">${esc(t.next)}</button></div>`;
}
function renderLimit(t, color) {
  const s = t.sec, sp = S.sp;
  $('spE0').textContent = s.limitEnds[0]; $('spE1').textContent = s.limitEnds[1]; $('spNew').textContent = s.newSpring;
  $('spRange').disabled = !!sp.rel;
  const m = sp.rel ? null : sp.msg;
  lab.setReadout('🧷', m ? t.res[m === 'back' ? 'back' : 'stays'] : s.limitLead, '', color);
  const st = m === 'back' ? s.limitBack : m === 'stays' ? s.limitStays : null;
  lab.setState(st ? { emo: m === 'back' ? '🔁' : '✋', title: st[0], lead: st[1], body: '', extra: '' } : { emo: '🧷', title: t.secrets.limit[0], lead: s.limitLead, body: '', extra: '' });
  lab.setFacts([]);
}
function renderWarm(t, color) {
  const s = t.sec, w = S.wm, cold = w.temp < 50;
  $('wmE0').textContent = s.warmEnds[0]; $('wmE1').textContent = s.warmEnds[1];
  $('wmGo').textContent = w.ph === 'idle' ? s.bendIt : s.redo; $('wmGo').disabled = w.ph === 'act';
  lab.setReadout(cold ? '❄️' : '🖐️', cold ? s.cold : s.warm, '', color);
  if (w.ph === 'done') { const d = cold ? s.coldDone : s.warmDone; lab.setState({ emo: cold ? '💥' : '✋', title: d[0], lead: d[1], body: '', extra: '' }); }
  else lab.setState({ emo: '🍫', title: t.secrets.warm[0], lead: s.warmLead, body: '', extra: '' });
  lab.setFacts([]);
}
function renderSort(t, color) {
  const s = t.sort, placed = SORT.filter((id) => S.place[id]).length;
  askEl.hidden = true;
  const main = $('sortMain');
  main.hidden = false; main.disabled = false;
  $('sortHint').textContent = '';
  if (S.jobs) {
    const last = S.ji >= s.jobs.length - 1;
    main.hidden = S.jans === null; main.textContent = last ? s.again : s.next;
    $('secSort').hidden = S.jans === null;
    lab.setReadout(`${S.jright}/${s.jobs.length}`, s.jobsT, '', color);
    const j = s.jobs[S.ji];
    lab.setState(S.jans === null ? { emo: j[0], title: s.jobsT, lead: s.jobLead, body: '', extra: '' }
      : { emo: BADGE[j[2]], title: `${j[1]}: ${t.res[j[2]].toLowerCase()}`, lead: S.jans === j[2] ? t.right : t.notq, body: j[3], extra: '' });
    lab.setFacts(S.ji === s.jobs.length - 1 && S.jans !== null ? t.facts.sort : []);
    return;
  }
  if (S.checked) {
    const k = SORT.length - S.wrong.length;
    main.textContent = s.toJobs;
    lab.setReadout(`${k}/${SORT.length}`, s.score(k), '', color);
    lab.setState({ emo: S.wrong.length ? '🔀' : '🏆', title: s.score(k), lead: S.wrong.length ? s.jumped : s.perfect, body: '', extra: '' });
    lab.setFacts(t.facts.sort);
    return;
  }
  main.textContent = s.check; main.disabled = placed < SORT.length;
  $('sortHint').textContent = placed < SORT.length ? s.lead : s.allDone;
  lab.setReadout(`${placed}/${SORT.length}`, '', '', color);
  lab.setState({ emo: '🗂️', title: s.title, lead: s.lead, body: s.body, extra: '' });
  lab.setFacts([]);
}
sortRender();
render();
</script>
