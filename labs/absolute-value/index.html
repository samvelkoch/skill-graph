    ell(c, x, y, rx, ry); c.fillStyle = lg(c, x - rx, y - ry, x + rx, y + ry, [[0, mix(col, '#ffffff', 0.45)], [1, col]]); c.fill(); c.lineWidth = 1.2; c.strokeStyle = shade(col, 0.5); c.stroke();
    ell(c, x, y, rx * 0.6, ry * 0.55); c.strokeStyle = 'rgba(255,255,255,.4)'; c.stroke();
  }
  c.restore();
}
function drawDebt(c, w, h, dt, time) {
  setF(w, h, LW, 380);
  const t = T[lang], el = time - S.secAt, rv = eo(el / 1.1);
  c.fillStyle = lg(c, 0, 0, 0, h, [[0, '#0b1024'], [1, '#1b2442']]); c.fillRect(0, 0, w, h);
  toScene(c);
  const LY = 214, x0 = 30, x1 = 410, X = (v) => x0 + (v + 25) / 50 * (x1 - x0), z0 = X(0), u = (x1 - x0) / 50;
  c.fillStyle = lg(c, z0, 0, -F.ox / F.s, 0, [[0, 'rgba(91,192,235,.16)'], [1, 'rgba(91,192,235,0)']]); c.fillRect(-F.ox / F.s, 70, z0 + F.ox / F.s, 250);
  c.fillStyle = lg(c, z0, 0, (w - F.ox) / F.s, 0, [[0, 'rgba(255,159,110,.16)'], [1, 'rgba(255,159,110,0)']]); c.fillRect(z0, 70, (w - F.ox) / F.s - z0, 250);
  c.save(); c.strokeStyle = 'rgba(244,201,93,.85)'; c.lineWidth = 1.7; c.setLineDash([6, 5]); c.beginPath(); c.moveTo(z0, 76); c.lineTo(z0, 300); c.stroke(); c.restore();
  // coins: 20 ghost coins (the debt) on the cool side, 15 gold coins on the warm side, stacks of five
  const baseY = LY - 24;
  for (let col = 0; col < 7; col++) {
    const neg = col < 4, cx = neg ? X(-17.5 + col * 5) : X(2.5 + (col - 4) * 5);
    for (let k = 0; k < 5; k++) {
      const born = (neg ? col * 5 + k : (col - 4) * 5 + k) * 0.045, a = clamp((el - born) / 0.25, 0, 1);
      if (a <= 0) continue;
      c.globalAlpha = a; coin(c, cx, baseY - 4 - k * 8 - (1 - a) * 12, u * 2.3, 5.4, 4, WARM, neg);
    }
  }
  c.globalAlpha = 1;
  ruler(c, x0, x1, LY, -25, 25, 5);
  rope(c, z0, LY + 26, X(-20), LY + 26, 7, rv); rope(c, z0, LY + 26, X(15), LY + 26, 7, rv); anchor(c, z0, LY + 26);
  c.restore();
  obst(x0 - 12, LY - 14, x1 - x0 + 24, 28);
  if (rv > 0.7) {
    const o = { alpha: clamp((rv - 0.7) / 0.3, 0, 1), col: '#fff', stroke: 'rgba(255,255,255,.4)' };
    label(c, t.abs(num(-20), 20), [{ x: X(-10), y: LY + 56, a: 'C' }, { x: X(-10), y: LY + 82, a: 'C' }], o);
    label(c, t.abs(num(15), 15), [{ x: X(7.5), y: LY + 56, a: 'C' }, { x: X(7.5), y: LY + 82, a: 'C' }], o);
  }
}

// --- readout, state card and facts: one function, called every frame, writes only on change ----------------------
function readout() {
  const t = T[lang], v = lab.view;
  let val, sub = '', pill = '', color = GOLD, st, facts = [];
  if (S.sec === 'cold') {
    val = esc(`${t.abs(num(-89.2), num(89.2))} °C`); sub = `${t.abs(35, 35)} °C`; color = COOL;
    st = { emo: '🌡️', title: t.secrets.a[0], lead: t.coldText };
  } else if (S.sec === 'debt') {
    val = esc(t.abs(num(-20), 20)); sub = t.abs(15, 15); color = COOL;
    st = { emo: '🏦', title: t.secrets.b[0], lead: t.debtText };
  } else {
    const asked = S.pick[v] !== null, p = PRED[v];
    st = asked ? { emo: t.st[v][0], title: t.st[v][1], lead: t.st[v][2], body: t.st[v][3] } : { emo: '🤔', title: p.ask(t), lead: '' };
    if (asked) facts = t.facts[v];
    if (v === 'lift') {
      const f = asked ? Math.round(S.cab) : -3, d = Math.abs(f); color = signCol(f);
      val = esc(f === 0 && asked ? t.ground : t.floor(num(f)));
      if (asked) { sub = t.floorsAway(d); pill = t.abs(num(f), d); }
    } else if (v === 'heights') {
      color = SEA;
      if (asked && S.place) { const m = PL[S.place].m; val = esc(t.mAbs(num(m), num(Math.abs(m)))); sub = `${num(m)} m`; pill = t.places[S.place]; color = signCol(m); }
      else val = '?';
    } else {
      const A = S.A, B = S.B;
      if (!asked) { val = esc(`A = ${num(A)}`); sub = `B = ${num(B)}`; }
      else {
        val = esc(A < B ? t.smaller('A', 'B') : B < A ? t.smaller('B', 'A') : 'A = B');
        sub = Math.abs(A) < Math.abs(B) ? t.closer('A') : Math.abs(B) < Math.abs(A) ? t.closer('B') : t.same;
        pill = t.dist(Math.abs(A - B)); color = '#ffffff';
      }
    }
  }
  const key = [lang, S.sec, v, val, sub, pill, color, st.title, facts.length].join('|');
  if (key === S.rkey) return;
  S.rkey = key;
  lab.setReadout(val, sub, pill, color);
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body ?? '', extra: '' });
  lab.setFacts(facts);
}

// --- controls ---------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function pickOpt(i) {
  const v = lab.view; if (S.pick[v] !== null) return;
  S.pick[v] = i; S.revAt[v] = now();
  if (v === 'heights') { S.shown = { gellert: now(), dead: now() }; S.place = 'dead'; }
  (i === PRED[v].ok ? sfx.good : sfx.bad)(); showStage(); render();
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, asked = S.pick[v] !== null;
  document.body.dataset.v = sec === 'debt' ? 'compare' : sec ? 'lift' : v;
  const p = PRED[v], pk = S.pick[v];
  $('avPred').style.display = sec ? 'none' : 'block';
  $('avPred').innerHTML = `<p class="av-q">${esc(p.ask(t))}</p><div class="av-opts">${p.opts(t).map((o, i) =>
    `<button type="button" class="av-opt ${pk === null ? '' : i === p.ok ? 'good' : i === pk ? 'bad' : 'dim'}" data-i="${i}"${pk === null ? '' : ' disabled'}>${esc(o)}</button>`).join('')}</div>${
    pk === null ? '' : `<div class="av-verdict ${pk === p.ok ? 'good' : 'bad'}">${esc(pk === p.ok ? p.right(t) : p.wrong(t))}</div>`}`;
  $('avLift').style.display = !sec && v === 'lift' && asked ? 'block' : 'none';
  $('avHeights').style.display = !sec && v === 'heights' && asked ? 'block' : 'none';
  $('avCompare').style.display = !sec && v === 'compare' && asked ? 'block' : 'none';
  $('avZoom').innerHTML = ['near', 'whole'].map((z) => `<button type="button" class="av-chip ${S.zoom === z ? 'on' : ''}" data-act="zoom" data-z="${z}">${esc(t[z])}</button>`).join('');
  $('avPlaces').innerHTML = PLK.map((k) => `<button type="button" class="av-chip ${S.place === k ? 'on' : ''}" data-act="place" data-k="${k}">${esc(t.places[k])}</button>`).join('');
  const open = secret.unlocked();
  $('avSec').innerHTML = [['cold', '🌡️', t.secrets.a[0]], ['debt', '🏦', t.secrets.b[0]]].map(([k, e, ttl]) =>
    `<button type="button" class="av-sec ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${e} ${esc(ttl)}` : '🔒 ???'}</button>`).join('');
  $('cv').style.touchAction = !sec && v === 'lift' && asked ? 'none' : 'pan-y';
  S.rkey = ''; readout();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.classList.contains('av-opt')) { pickOpt(+b.dataset.i); return; }
  if (b.dataset.sec) {
    if (!secret.unlocked()) { secret.open(); return; }
    S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; S.secAt = now(); sfx.click(); render(); return;
  }
  const act = b.dataset.act;
  if (act === 'up' || act === 'down') { S.liftT = clamp(Math.round(S.liftT) + (act === 'up' ? 1 : -1), -4, 6); S.moved = true; sfx.tick(); }
  else if (act === 'zoom') { S.zoom = b.dataset.z; if (S.zoom === 'near' && S.place && Math.abs(PL[S.place].m) > 500) S.place = 'dead'; sfx.click(); }
  else if (act === 'place') { heightsSelect(b.dataset.k); return; }
  else if (act && /^[ab][+-]$/.test(act)) { const k = act[0].toUpperCase(), n = clamp(S[k] + (act[1] === '+' ? 1 : -1), -10, 10); if (n !== S[k]) { S[k] = n; sfx.tick(); } }
  render();
});
// pointer: drag the cabin (lift), tap a place (heights), drag A or B (compare)
const cv = $('cv'), pt = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const [px, py] = pt(ev), v = lab.view;
  if (v === 'lift' && S.pick.lift !== null) { S.drag = true; S.moved = true; cv.setPointerCapture(ev.pointerId); S.liftT = floorAt(py); }
  else if (v === 'heights' && S.pick.heights !== null) {
    let best = null, bd = 36; for (const hh of S.hits) { const d = Math.hypot(hh.x - px, hh.y - py); if (d < bd) { bd = d; best = hh.k; } }
    if (best) heightsSelect(best);
  } else if (v === 'compare' && S.pick.compare !== null) {
    S.dragK = py < F.oy + 192 * F.s ? 'A' : 'B'; cv.setPointerCapture(ev.pointerId);
    const n = cmpAt(px); if (n !== S[S.dragK]) { S[S.dragK] = n; sfx.tick(); }
  }
});
cv.addEventListener('pointermove', (ev) => {
  const [px, py] = pt(ev);
  if (S.drag) S.liftT = floorAt(py);
  else if (S.dragK) { const n = cmpAt(px); if (n !== S[S.dragK]) { S[S.dragK] = n; sfx.tick(); } }
});
const release = () => { if (S.drag) { S.drag = false; S.liftT = Math.round(S.liftT); sfx.snap(); } S.dragK = null; };
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);

// --- go -----------------------------------------------------------------------------------------------------------
canvasLoop(cv, (c, w, h, dt, time) => {
  if (S.sec === 'cold') drawCold(c, w, h, dt, time);
  else if (S.sec === 'debt') drawDebt(c, w, h, dt, time);
  else if (lab.view === 'lift') drawLift(c, w, h, dt, time);
  else if (lab.view === 'heights') drawHeights(c, w, h, dt, time);
  else drawCompare(c, w, h, dt, time);
  readout();
});
render();
</script>
