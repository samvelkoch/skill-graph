// --- run plan: where the ball is at time tt after the release -------------------------------------------------
function plan(g, k, r, m) {
  const sn = Math.sin(g.th), cs = Math.cos(g.th), v = vOf(k), Kc = g.L / (TFULL * vOf(4)), vp = Kc * v; // vp: px/s at the bottom
  const Mx = g.Xb - g.run * k / 4, My = g.floorY - g.Hf * k / 4;
  const sx = Mx + r * sn, sy = My - r * cs, sJ = r * (cs - 1) / sn;
  const Jx = g.Xb + r * sn + sJ * cs, Jy = g.floorY - r;
  const Ls = Math.hypot(Jx - sx, Jy - sy), t1 = 2 * Ls / vp, xc = g.X0 - r, tc = t1 + (xc - Jx) / vp;
  const u0 = 0.6 * vp * Math.sqrt(m), B = (0.6 * Kc) ** 2 / (2 * CM_PER_V2 * PXCM); // the box slows down at a constant rate: slide ∝ v² · m
  return { g, k, r, m, v, vp, sx, sy, Jx, Jy, Ls, t1, tc, xc, u0, B, tStop: u0 / B, end: tc + u0 / B };
}
function pose(p, tt) {
  const { r } = p; let x, y, ang, spd = p.v, box = 0;
  if (tt < p.t1) { const q = Math.max(0, tt) / p.t1, f = q * q; x = lerp(p.sx, p.Jx, f); y = lerp(p.sy, p.Jy, f); ang = p.Ls * f / r; spd = p.v * q; }
  else if (tt < p.tc) { x = p.Jx + p.vp * (tt - p.t1); y = p.Jy; ang = (p.Ls + x - p.Jx) / r; }
  else { const u = Math.min(tt - p.tc, p.tStop); box = p.u0 * u - 0.5 * p.B * u * u; x = p.xc + box; y = p.Jy; ang = (p.Ls + p.xc - p.Jx + box) / r; }
  return { x, y, ang, spd, box };
}

  c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = 1.3; c.stroke();
  c.fillStyle = '#1c2540'; rr(c, x + CARL * 0.56, cy - h / 2 + 3.5, CARL * 0.2, h - 7, 4); c.fill();       // windscreen
  c.fillStyle = '#26315a'; rr(c, x + CARL * 0.16, cy - h / 2 + 4.5, CARL * 0.14, h - 9, 3); c.fill();      // rear window
  c.fillStyle = 'rgba(255,255,255,.25)'; rr(c, x + CARL * 0.33, cy - h / 2 + 3, CARL * 0.22, 4, 2); c.fill();   // roof highlight
  c.fillStyle = '#fff6c0'; for (const dy of [-8, 8]) { c.beginPath(); c.ellipse(x + CARL - 2, cy + dy, 2.5, 3.5, 0, 0, 7); c.fill(); }
  c.fillStyle = brk ? '#ff2a2a' : '#7a1f24'; for (const dy of [-8, 8]) { rr(c, x, cy + dy - 3, 3.5, 6, 1.5); c.fill(); }
  if (brk) { c.fillStyle = 'rgba(255,40,40,.25)'; c.beginPath(); c.ellipse(x - 4, cy, 9, 15, 0, 0, 7); c.fill(); }
}

// --- shell, secrets, controls ------------------------------------------------------------------------------------------
const lab = shell({ key: 'speed-energy', T, topics: TOPICS, views: ['ramp', 'tower', 'weight'], onLang: () => render(), onView: () => { S.sec = null; render(); } });
const secret = secretLab('speed-energy', () => ({
  secrets: [{ emo: '🎳', title: T[lang].sec.bowl[0], desc: T[lang].sec.bowl[1] }, { emo: '🚗', title: T[lang].sec.school[0], desc: T[lang].sec.school[1] }],
  questions: T[lang].quiz,
}), () => render());

// --- the canvas loop -------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt) => {
  const mode = MODE(), H = DH[mode], sc = Math.min(w / W, h / H);
  S.sc = sc; S.xf = { s: sc, ox: (w - W * sc) / 2, oy: (h - H * sc) / 2 };
  c.save(); c.translate(S.xf.ox, S.xf.oy); c.scale(sc, sc); c.lineJoin = 'round'; c.lineCap = 'round';
  const bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, 'rgba(150,170,230,.11)'); bg.addColorStop(1, 'rgba(30,36,64,.04)');
  c.fillStyle = bg; rr(c, 0, 0, W, H, 14); c.fill();
  if (mode === 'ramp') sceneRamp(c, dt); else if (mode === 'tower') sceneTower(c, dt); else if (mode === 'weight') sceneWeight(c, dt);
  else if (mode === 'bowl') sceneBowl(c, dt); else sceneSchool(c, dt);
  c.restore();
});

$('ctrlBody').innerHTML = `<div id="cR"></div><div id="cT"></div><div id="cW"></div><div id="cB"></div><div id="cC"></div><div class="se-row" id="secRow"></div>`;
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const pick = (cls, act, key, val, label, on, dis) => `<button class="se-pick${on ? ' on' : ''}" data-a="${act}" data-${key}="${val}"${dis ? ' disabled' : ''}>${esc(label)}</button>`;

function resetRamp() { const R = S.r; R.phase = 'idle'; R.t = 0; R.hit = false; R.flag = null; }
function resetTower() { const x = S.t; x.phase = 'idle'; x.t = 0; x.hit = false; x.guess = null; }
function resetWeight() { const x = S.w; x.phase = 'idle'; x.t = 0; x.hit = false; x.pick = null; x.res = null; }
function resetBowl() { const x = S.b; x.phase = 'idle'; x.t = 0; x.hit = false; }
function resetSchool() { const x = S.c; x.phase = 'idle'; x.t = 0; }

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, R = S.r, Tw = S.t, Wt = S.w, B = S.b, C = S.c;
  if (a === 'rk') { if (R.phase === 'done') resetRamp(); R.k = +b.dataset.k; sfx.tick(); }
  else if (a === 'rf') { if (R.phase === 'done') resetRamp(); R.flag = clamp((R.flag ?? 40) + +b.dataset.s, 0, 100); sfx.tick(); }
  else if (a === 'rgo') { if (R.phase === 'done') resetRamp(); else if (R.flag != null) { R.phase = 'run'; R.t = 0; R.hit = false; sfx.push(); } }
  else if (a === 'tk') { if (Tw.phase === 'done') resetTower(); Tw.k = +b.dataset.k; sfx.tick(); }
  else if (a === 'tg') { if (Tw.phase === 'done') resetTower(); Tw.guess = clamp((Tw.guess ?? 6) + +b.dataset.s, 0, 12); sfx.tick(); }
  else if (a === 'tgo') { if (Tw.phase === 'done') resetTower(); else if (Tw.guess != null) { Tw.phase = 'run'; Tw.t = 0; Tw.hit = false; sfx.push(); } }
  else if (a === 'wl' || a === 'wh') { if (Wt.phase === 'done') resetWeight(); Wt[a === 'wl' ? 'lm' : 'hm'] = +b.dataset.k; sfx.tick(); }
  else if (a === 'wp') { if (Wt.phase === 'done') resetWeight(); Wt.pick = b.dataset.p; sfx.tick(); }
  else if (a === 'wgo') { if (Wt.phase === 'done') resetWeight(); else if (Wt.pick) { Wt.phase = 'run'; Wt.t = 0; Wt.hit = false; sfx.push(); } }
  else if (a === 'bk') { if (B.phase === 'done') resetBowl(); B.k = +b.dataset.k; sfx.tick(); }
  else if (a === 'bgo') { if (B.phase === 'done') resetBowl(); else if (B.phase === 'idle') { B.phase = 'run'; B.t = 0; B.hit = false; sfx.push(); } }
  else if (a === 'ck') { if (C.phase === 'done') resetSchool(); C.kmh = +b.dataset.k; sfx.tick(); }
  else if (a === 'cgo') { if (C.phase === 'done') resetSchool(); else if (C.phase === 'idle') { C.phase = 'run'; C.t = 0; sfx.push(); } }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k;
    if (S.sec === 'bowl') resetBowl(); if (S.sec === 'school') resetSchool(); sfx.click();
  }
  render();
});

// the picture's own taps: a start mark on the ramp, or the flag on the floor
const toD = (ev) => { const r = $('cv').getBoundingClientRect(); return [(ev.clientX - r.left - S.xf.ox) / S.xf.s, (ev.clientY - r.top - S.xf.oy) / S.xf.s]; };
const setFlagAt = (x) => {
  const R = S.r; if (R.phase === 'run') return;
  if (R.phase === 'done') resetRamp();
  R.flag = clamp(Math.round((x - (G1.X0 + BW)) / PXCM), 0, 100); render();
};
$('cv').addEventListener('pointerdown', (ev) => {
  if (MODE() !== 'ramp' || S.r.phase === 'run') return;
  const [x, y] = toD(ev), k = [1, 2, 3, 4].find((q) => { const [dx, dy] = discPos(G1, q, 16); return Math.hypot(x - dx, y - dy) < 20; });
  if (k) { if (S.r.phase === 'done') resetRamp(); S.r.k = k; sfx.tick(); render(); return; }
  if (y > G1.floorY - 70 && y < G1.floorY + 44 && x > G1.X0 + BW - 24) { S.drag = true; $('cv').setPointerCapture?.(ev.pointerId); setFlagAt(x); sfx.tick(); }
});
$('cv').addEventListener('pointermove', (ev) => { if (S.drag) setFlagAt(toD(ev)[0]); });
['pointerup', 'pointercancel'].forEach((e) => $('cv').addEventListener(e, () => { S.drag = false; }));

// --- one render per change: controls, readout, state card and facts ---------------------------------------------------------
function render() {
  const mode = MODE(), t = T[lang];
  document.body.dataset.v = mode;
  ['cR', 'cT', 'cW', 'cB', 'cC'].forEach((id) => { $(id).hidden = true; });
  const open = secret.unlocked();
  $('secRow').innerHTML = [['bowl', '🎳'], ['school', '🚗']].map(([k, e]) =>
    `<button class="se-sec${open ? ' open' : ''}${S.sec === k ? ' on' : ''}" data-a="sec" data-k="${k}">${open ? `${e} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`).join('');
  ({ ramp: renderRamp, tower: renderTower, weight: renderWeight, bowl: renderBowl, school: renderSchool })[mode](t);
  lab.checkStage?.();
}
const runsList = (title, rows) => rows.length ? `<div class="se-runs"><span class="se-lbl">${esc(title)}</span>${rows.map((x) => `<span>${esc(x)}</span>`).join('')}</div>` : '';

function renderRamp(t) {
  const R = S.r, r = t.r, done = R.phase === 'done', run = R.phase === 'run', k = R.k, el = $('cR'); el.hidden = false;
  el.innerHTML = `<div class="se-row"><span class="se-lbl">${esc(r.startLbl)}</span><div class="se-seg">${[1, 2, 3, 4].map((i) => pick('', 'rk', 'k', i, i, i === k, run)).join('')}</div></div>
    <div class="se-row"><span class="se-lbl">${esc(r.flagLbl)}</span><button class="se-pick" data-a="rf" data-s="-5"${run ? ' disabled' : ''} aria-label="−5">◀</button>
      <span class="se-val">${R.flag == null ? '—' : `${R.flag} ${esc(t.cm)}`}</span><button class="se-pick" data-a="rf" data-s="5"${run ? ' disabled' : ''} aria-label="+5">▶</button></div>
    <div class="se-row"><button class="btn se-go" data-a="rgo"${run || (!done && R.flag == null) ? ' disabled' : ''}>${esc(done ? r.again : r.go)}</button></div>`;
  lab.setGlow('rgba(95, 208, 196, .24)');
  const shown = Object.entries(R.runs).filter(([q]) => done || +q !== k).sort((a, b) => a[0] - b[0]);
  const extra = runsList(r.runs, shown.map(([q, x]) => r.run(q, num(x.v), x.d)));
  if (done) {
    const d = R.runs[k].d, ok = Math.abs(d - R.flag) <= 4, all = Object.entries(R.runs).map(([q, x]) => ({ k: +q, v: num(x.v), d: x.d, vv: x.v })).sort((a, b) => a.vv - b.vv);
    lab.setReadout(`${d} ${esc(t.cm)}`, r.bottom(num(vOf(k))), t.mk(k), MC[k]);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? r.right : d > R.flag ? r.farther : r.nearer, lead: ok ? r.rightLead(d) : r.offLead(d, R.flag),
      body: `${r.energy} ${all.length >= 2 ? r.cmp(all[0], all[all.length - 1]) : r.next}`, extra });
  } else if (run) {
    lab.setReadout('?', r.sub, t.mk(k), MC[k]); lab.setState({ emo: '👀', title: r.rolling, lead: r.rollLead, body: '', extra });
  } else {
    lab.setReadout('?', r.sub, t.mk(k), MC[k]);
    lab.setState({ emo: '🎯', title: r.q, lead: R.flag == null ? r.lead0 : `${r.flagAt(R.flag)}. ${r.leadFlag}`, body: '', extra });
  }
  lab.setFacts(t.facts.ramp);
}

function renderTower(t) {
  const Tw = S.t, q = t.t, done = Tw.phase === 'done', run = Tw.phase === 'run', k = Tw.k, n = blocksOf(k), el = $('cT'); el.hidden = false;
  el.innerHTML = `<div class="se-row"><span class="se-lbl">${esc(q.startLbl)}</span><div class="se-seg">${[1, 2, 4].map((i) => pick('', 'tk', 'k', i, q.speeds[i], i === k, run)).join('')}</div></div>
    <div class="se-row"><span class="se-lbl">${esc(q.guessLbl)}</span><button class="se-pick" data-a="tg" data-s="-1"${run ? ' disabled' : ''} aria-label="−1">−</button>
      <span class="se-val">${Tw.guess == null ? '—' : Tw.guess}</span><button class="se-pick" data-a="tg" data-s="1"${run ? ' disabled' : ''} aria-label="+1">+</button></div>
    <div class="se-row"><button class="btn se-go" data-a="tgo"${run || (!done && Tw.guess == null) ? ' disabled' : ''}>${esc(done ? t.r.again : t.r.go)}</button></div>`;
  lab.setGlow('rgba(240, 185, 77, .24)');
  const shown = Object.entries(Tw.runs).filter(([s]) => done || +s !== k).sort((a, b) => a[0] - b[0]);
  const extra = runsList(q.runs, shown.map(([s, v]) => `${q.speeds[s]} · ${t.bl(v)}`)) + (!done && Tw.guess != null && !run ? `<div class="se-lbl" style="margin-top:8px">${esc(q.mine)}</div>` : '');
  if (done) {
    const g = Tw.guess, ok = g === n;
    lab.setReadout(`${n}`, q.bottom(num(vOf(k))), q.speeds[k], '#f0b94d');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? q.right : n > g ? q.more : q.fewer, lead: q.lead(n, g), body: Object.keys(Tw.runs).length >= 2 ? q.energy : `${q.energy} ${q.next}`, extra });
  } else if (run) {
    lab.setReadout('?', q.sub, q.speeds[k], '#f0b94d'); lab.setState({ emo: '👀', title: q.rolling, lead: q.rollLead, body: '', extra });
  } else {
    lab.setReadout('?', q.sub, q.speeds[k], '#f0b94d');
    lab.setState({ emo: '🧱', title: q.q, lead: Tw.guess == null ? q.lead0 : q.leadG(Tw.guess), body: '', extra });
  }
  lab.setFacts(t.facts.tower);
}

function renderWeight(t) {
  const Wt = S.w, w = t.w, done = Wt.phase === 'done', run = Wt.phase === 'run', el = $('cW'); el.hidden = false;
  const va = num(vOf(Wt.lm)), vb = num(vOf(Wt.hm)), sameSp = Wt.lm === Wt.hm;
  el.innerHTML = `<div class="se-row"><span class="se-lbl">${esc(w.startL)}</span><div class="se-seg">${[1, 2, 3, 4].map((i) => pick('', 'wl', 'k', i, i, i === Wt.lm, run)).join('')}</div></div>
    <div class="se-row"><span class="se-lbl">${esc(w.startH)}</span><div class="se-seg">${[1, 2, 3, 4].map((i) => pick('', 'wh', 'k', i, i, i === Wt.hm, run)).join('')}</div></div>
    <div class="se-row"><div class="se-seg">${['h', 'l', 's'].map((p) => pick('', 'wp', 'p', p, w.opts[p], Wt.pick === p, run)).join('')}</div></div>
    <div class="se-row"><button class="btn se-go" data-a="wgo"${run || (!done && !Wt.pick) ? ' disabled' : ''}>${esc(done ? t.r.again : t.r.go)}</button></div>`;
  lab.setGlow('rgba(120, 140, 255, .24)');
  const extra = esc(w.info(Wt.lm, Wt.hm, va, vb)) + `<br>${esc(w.note)}`;
  if (done) {
    const res = Wt.res, ok = res === Wt.pick, dl = Math.round(dOf(Wt.lm, 1)), dh = Math.round(dOf(Wt.hm, 2));
    lab.setReadout(`${dl} · ${dh} ${esc(t.cm)}`, w.done, `${Wt.lm} · ${Wt.hm}`, '#8aa0ff');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? w.right : w.wrong, lead: `${w.out[res]} ${w.lead(dl, dh)}`, body: res === 'h' ? (sameSp ? w.bodyH : w.bodyH2) : res === 'l' ? w.bodyL : w.bodyS, extra });
  } else if (run) {
    lab.setReadout('?', w.sub, `${Wt.lm} · ${Wt.hm}`, '#8aa0ff'); lab.setState({ emo: '👀', title: w.rolling, lead: w.rollLead, body: '', extra });
  } else {
    lab.setReadout('?', w.sub, `${Wt.lm} · ${Wt.hm}`, '#8aa0ff');
    lab.setState({ emo: '⚖️', title: w.q, lead: Wt.pick ? `${w.opts[Wt.pick]}. ${w.leadP}` : w.lead0, body: sameSp ? w.same : w.diff, extra });
  }
  lab.setFacts(t.facts.weight);
}

function renderBowl(t) {
  const B = S.b, q = t.bowl, done = B.phase === 'done', run = B.phase === 'run', n = bowlPins(B.k), el = $('cB'); el.hidden = false;
  el.innerHTML = `<div class="se-row"><span class="se-lbl">${esc(q.startLbl)}</span><div class="se-seg">${[1, 2, 4].map((i) => pick('', 'bk', 'k', i, t.t.speeds[i], i === B.k, run)).join('')}</div></div>
    <div class="se-row"><button class="btn se-go" data-a="bgo"${run ? ' disabled' : ''}>${esc(done ? q.again : q.go)}</button></div>`;
  lab.setGlow('rgba(217, 167, 102, .24)');
  const extra = runsList(q.runs, Object.entries(B.runs).sort((a, b) => a[0] - b[0]).map(([s, v]) => `${t.t.speeds[s]} · ${v}/10`));
  if (done) { lab.setReadout(`${n}/10`, q.sub, t.t.speeds[B.k], '#e8bc7b'); lab.setState({ emo: '🎳', title: q.done(n), lead: q.lead, body: q.body, extra }); }
  else if (run) { lab.setReadout('?', q.sub, t.t.speeds[B.k], '#e8bc7b'); lab.setState({ emo: '🎳', title: q.rolling, lead: q.rollLead, body: '', extra }); }
  else { lab.setReadout('?', q.sub, t.t.speeds[B.k], '#e8bc7b'); lab.setState({ emo: '🎳', title: q.idle, lead: q.idleLead, body: '', extra }); }
  lab.setFacts([]);
}

function renderSchool(t) {
  const C = S.c, q = t.sch, done = C.phase === 'done', run = C.phase === 'run', d = brakeD(C.kmh), el = $('cC'); el.hidden = false;
  el.innerHTML = `<div class="se-row"><span class="se-lbl">${esc(q.startLbl)}</span><div class="se-seg">${[20, 30, 40, 50, 60].map((i) => pick('', 'ck', 'k', i, i, i === C.kmh, run)).join('')}</div></div>
    <div class="se-row"><button class="btn se-go" data-a="cgo"${run ? ' disabled' : ''}>${esc(done ? q.again : q.go)}</button></div>`;
  lab.setGlow('rgba(245, 200, 76, .2)');
  if (done) {
    const e = (C.kmh / 30) ** 2, es = num(e, Math.abs(e - Math.round(e)) < 0.05 ? 0 : 1), late = BX + d * PXM > XZ;
    lab.setReadout(`${num(d, 0)} ${esc(t.m)}`, q.sub, `${C.kmh} ${t.kmh}`, '#f5c84c');
    lab.setState({ emo: late ? '⚠️' : '✅', title: late ? q.late : q.ok, lead: q.lead(num(d, 1), es), body: q.body, extra: '' });
  } else if (run) { lab.setReadout('?', q.sub, `${C.kmh} ${t.kmh}`, '#f5c84c'); lab.setState({ emo: '🚗', title: q.rolling, lead: q.rollLead, body: '', extra: '' }); }
  else { lab.setReadout('?', q.sub, `${C.kmh} ${t.kmh}`, '#f5c84c'); lab.setState({ emo: '🚗', title: q.idle, lead: q.idleLead, body: '', extra: '' }); }
  lab.setFacts(done ? t.facts.school : []);
}
render();
</script>
</body>
</html>
