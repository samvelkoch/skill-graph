      c.strokeStyle = '#4f9a3f'; c.lineWidth = 3; c.beginPath(); c.moveTo(sx, GROUND - 2); c.lineTo(sx, GROUND - 2 - 40 * g); c.stroke();
      leaf(c, sx, GROUND - 2 - 28 * g, sx - 18 * g, GROUND - 2 - 38 * g, 8 * g, '#5cb847'); leaf(c, sx, GROUND - 2 - 34 * g, sx + 18 * g, GROUND - 2 - 44 * g, 8 * g, '#5cb847');
    }
  }
}
function drawBird(c, x, y, dir, time, beak) {
  c.save(); c.translate(x, y); c.scale(dir, 1); c.lineWidth = 1.3;
  const f = Math.sin(time * 18);
  ell(c, -16, 2, 10, 4, '#2f7fb8', null, -.2); ell(c, 0, 0, 16, 11, '#4aa3df', '#2a6a9a'); ell(c, 12, -7, 8, 8, '#4aa3df', '#2a6a9a');
  ell(c, -2, -4 - 6 * f, 11, 5, '#2f7fb8', null, -.4 - .5 * f);
  c.fillStyle = '#f4a62a'; c.beginPath(); c.moveTo(19, -8); c.lineTo(28, -5); c.lineTo(19, -3); c.closePath(); c.fill();
  ell(c, 14, -9, 1.8, 1.8, '#fff'); ell(c, 14.6, -9, .9, .9, '#111');
  if (beak) ell(c, 29, -3, 3, 3, '#d92d4b');
  c.restore();
}
function scenePop(c, ta, time) {
  skyGround(c, '#6da6d6', '#cfe8f5');
  const dry = win(ta, 0, 2.6), tw = win(ta, 2.6, 3.4), podCol = mix('#5aa846', '#b8935a', dry), A = [150, 225];
  c.strokeStyle = '#4f8a3e'; c.lineWidth = 5; c.beginPath(); c.moveTo(200, GROUND); c.quadraticCurveTo(206, 320, 176, 222); c.stroke();
  leaf(c, 202, 340, 250, 316, 20, '#4f8a3e'); leaf(c, 196, 300, 148, 280, 18, '#4f8a3e');
  c.lineCap = 'round';
  if (tw < .02) {
    c.fillStyle = podCol; c.strokeStyle = mix('#3a7a2e', '#8a6a30', dry); c.lineWidth = 2; c.beginPath(); c.roundRect(A[0], A[1] - 10, 96, 20, 10); c.fill(); c.stroke();
    for (let j = 0; j < 5; j++) ell(c, A[0] + 16 + j * 16, A[1], 6.5, 6.5, mix('#7fc664', '#c5a56a', dry));
  } else {
    [-1, 1].forEach((sgn) => {
      const th = sgn * tw * 1.0, tx = A[0] + 96 * Math.cos(th), ty = A[1] + 96 * Math.sin(th), mx = (A[0] + tx) / 2 + sgn * tw * 4, my = (A[1] + ty) / 2 - sgn * tw * 20;
      c.strokeStyle = '#7a5a28'; c.lineWidth = 14; c.beginPath(); c.moveTo(...A); c.quadraticCurveTo(mx, my, tx, ty); c.stroke();
      c.strokeStyle = podCol; c.lineWidth = 9; c.stroke();
    });
  }
  const VX = [-110, -60, 20, 80, 130], VY = [150, 190, 210, 170, 140];
  for (let j = 0; j < 5; j++) {
    const x0 = A[0] + 16 + j * 16, y0 = A[1], tau = ta - (3.0 + j * .08);
    if (tau < 0) continue;
    const x = x0 + VX[j] * tau, y = Math.min(GROUND - 5, y0 - VY[j] * tau + 190 * tau * tau);
    ell(c, x, y, 5.5, 5.5, '#8fd16f', '#4f8a3e');
  }
}
const REVEAL = { dandelion: [9.5, sceneWind], burdock: [8.4, sceneFur], coconut: [10, sceneWater], berries: [9.5, sceneBerries], pea: [8, scenePop] };
function drawCards(c) {
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let i = 0; i < 5; i++) {
    const x = 13 + i * 76, key = SEED_KEYS[i], done = D.ans[key] !== undefined, cur = i === D.cur;
    c.save(); c.fillStyle = 'rgba(20,24,42,.94)'; c.strokeStyle = cur ? '#fff' : 'rgba(130,145,190,.4)'; c.lineWidth = cur ? 3 : 1.5;
    c.beginPath(); c.roundRect(x, 10, 70, 66, 12); c.fill(); c.stroke();
    c.translate(x + 35, 43); c.scale(1.05, 1.05); ICON[key](c); c.restore();
    if (done) {
      const ok = D.ans[key] === ANSWER[key];
      c.save(); ell(c, x + 58, 22, 10, 10, ok ? '#3ddc97' : '#f5c84c'); c.fillStyle = '#10131f'; c.font = '900 15px Nunito, sans-serif'; c.fillText(ok ? '✓' : '!', x + 58, 23); c.restore();
    }
  }
}
function drawDispersal(c, w, h, time) {
  c.fillStyle = '#0c0f1a'; c.fillRect(0, 0, w, h);
  fitIn(c);
  const key = SEED_KEYS[D.cur], answered = D.ans[key] !== undefined;
  c.save(); c.beginPath(); c.roundRect(8, 92, 384, 352, 16); c.clip();
  if (answered) { const [per, fn] = REVEAL[key]; fn(c, (time - (D.rt[key] ?? 0)) % per, time); }
  else {
    const g = c.createLinearGradient(0, 92, 0, 444); g.addColorStop(0, '#1a2038'); g.addColorStop(1, '#262f52'); c.fillStyle = g; c.fillRect(8, 92, 384, 352);
    c.save(); c.translate(200, 292); c.scale(4, 4); ICON[key](c); c.restore();
  }
  c.restore();
  c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(8, 92, 384, 352, 16); c.stroke();
  c.font = '500 26px "EB Garamond", Georgia, serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.strokeStyle = 'rgba(10,14,30,.9)'; c.lineWidth = 5; c.strokeText(T[lang].d.names[key], 200, 120); c.fillStyle = '#fff'; c.fillText(T[lang].d.names[key], 200, 120);
  drawCards(c);
  c.restore();
}
function seedling(c, x, h, droop, col) {
  c.strokeStyle = col; c.lineWidth = 3.4; c.beginPath(); c.moveTo(x, 402); c.quadraticCurveTo(x + droop * .3, 402 - h * .6, x + droop, 402 - h); c.stroke();
  leaf(c, x + droop, 402 - h, x + droop - 13, 402 - h - 6 + droop * .3, 9, col); leaf(c, x + droop, 402 - h, x + droop + 13, 402 - h - 6, 9, col);
}
function drawQ3(c, w, h, time) {
  meadow(c, w, h);
  const ta = D.step === 3 ? time - D.t3 : -1, sa = win(ta, 0, .8), sh = win(ta, .2, 1.2);
  if (sa > 0) {
    drawSun(c, 344, 56, 32, time, sa);
    c.save(); c.globalAlpha = .18 * sa; c.fillStyle = '#ffe680'; c.beginPath(); c.moveTo(344, 70); c.lineTo(282, 402); c.lineTo(360, 402); c.closePath(); c.fill(); c.restore();
    const gh = 14 + 124 * win(ta, .3, 4.5);
    c.strokeStyle = '#4fa83a'; c.lineWidth = 6; c.beginPath(); c.moveTo(320, 402); c.lineTo(320, 402 - gh); c.stroke();
    for (let i = 0; i < 5; i++) {
      const y = 402 - 22 - i * 24, k = clamp((gh - (402 - y)) / 30, 0, 1);
      if (k > 0) { leaf(c, 320, y, 320 - 34 * k, y - 14 * k, 12 * k, '#5cb847'); leaf(c, 320, y, 320 + 34 * k, y - 14 * k, 12 * k, '#5cb847'); }
    }
    seedling(c, 40, 24, -8, '#7c9a5a'); seedling(c, 182, 22, 9, '#7c9a5a');
    const g = c.createRadialGradient(110, 330, 10, 110, 330, 175); g.addColorStop(0, `rgba(0,0,0,${.45 * sh})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(-80, 150, 360, 260);
  }
  // the big parent plant
  c.strokeStyle = '#3f8a3a'; c.lineWidth = 16; c.beginPath(); c.moveTo(110, 402); c.lineTo(110, 160); c.stroke();
  [[330, -1], [270, 1], [210, -1]].forEach(([y, s]) => { leaf(c, 110, y, 110 + s * 92, y - 36, 56, '#3f8a3a', '#2c6a28'); leaf(c, 110, y - 24, 110 - s * 84, y - 56, 52, '#3f8a3a', '#2c6a28'); });
  [[20, 130], [58, 92], [110, 80], [162, 92], [200, 130]].forEach(([x, y]) => leaf(c, 110, 172, x, y, 46, '#4a9a42', '#2c6a28'));
  c.restore();
}

// --- pointer: tap a plant part / pick a seed card ---------------------------------------------------------------
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - TF.ox) / TF.s, y = (ev.clientY - r.top - TF.oy) / TF.s;
  if (lab.view === 'parts') {
    if (P.sec || P.step === 2 || P.step === 3) return;
    const p = hitPart(x, y); P.part = p === P.part ? null : p; if (p) sfx.tick(); render();
  } else if (lab.view === 'seeds' && D.step === 1) {
    for (let i = 0; i < 5; i++) if (x >= 13 + i * 76 && x <= 83 + i * 76 && y >= 10 && y <= 76) {
      D.cur = i; if (D.ans[SEED_KEYS[i]] !== undefined) D.rt[SEED_KEYS[i]] = now(); sfx.tick(); render(); return;
    }
  }
});

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const s = Math.min(w / W0, h / H0);
  TF = { s, ox: (w - W0 * s) / 2, oy: (h - H0 * s) / 2 };
  const v = lab.view;
  if (v === 'parts') drawParts(c, w, h, time);
  else if (v === 'sprout') (S.step < 2 ? drawSprout : drawJars)(c, w, h, time);
  else if (D.step === 0) drawPollen(c, w, h, time);
  else if (D.step === 1) drawDispersal(c, w, h, time);
  else drawQ3(c, w, h, time);
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const marks = (chosen, ok, n) => Array.from({ length: n }, (_, i) => (i === ok ? 'good' : i === chosen ? 'bad' : 'dim'));
const qbox = (q, opts, o = {}) => `<div class="qbox"><div class="q">${esc(q)}</div><div class="obs ${o.col ? 'col' : ''}">${opts.map((x, i) =>
  `<button class="ob ${o.mark?.[i] ?? ''}" data-act="ans" data-i="${i}"${o.mark ? ' disabled' : ''}>${esc(x)}</button>`).join('')}</div></div>`;
const rowBtn = (act, label, cls = 'btn') => `<button class="${cls}" data-act="${act}">${esc(label)}</button>`;

function answer(v, i) {
  let ok;
  if (v === 'parts') {
    P.sec = null; P.part = null;
    if (P.step === 0) { ok = i === 1; P.ans[0] = i; P.step = 1; P.flow = true; P.t0 = now(); }
    else if (P.step === 2) { ok = i === 1; P.ans[1] = i; P.step = 3; P.t0 = now(); }
    else return false;
  } else if (v === 'sprout') {
    if (S.step === 0) { ok = i === 1; S.ans[0] = i; S.step = 1; S.t0 = now(); }
    else if (S.step === 2) { ok = i === 0; S.ans[1] = i; S.step = 3; S.t0 = now(); }
    else return false;
  } else if (D.step === 1) {
    const key = SEED_KEYS[D.cur]; if (D.ans[key] !== undefined) return false;
    ok = WAYS[i] === ANSWER[key]; D.ans[key] = WAYS[i]; D.rt[key] = now();
  } else if (D.step === 2) { ok = i === 1; D.ans.q3 = i; D.step = 3; D.t3 = now(); }
  else return false;
  (ok ? sfx.good : sfx.bad)();
  return true;
}
function next(v) {
  if (v === 'parts') { P.part = null; P.sec = null; P.step = P.step === 1 ? 2 : 4; }
  else if (v === 'sprout') S.step = 2;
  else if (D.step === 0) { D.step = 1; D.cur = 0; D.ans = {}; D.rt = {}; }
  else {
    for (let k = 1; k <= 5; k++) { const i = (D.cur + k) % 5; if (D.ans[SEED_KEYS[i]] === undefined) { D.cur = i; return; } }
    D.step = 2;
  }
}
function again(v) {
  if (v === 'parts') Object.assign(P, { step: 0, ans: [null, null], part: null, sec: null, hi: [false, false], flow: false });
  else if (v === 'sprout') Object.assign(S, { step: 0, ans: [null, null] });
  else Object.assign(D, { step: 0, cur: 0, ans: {}, rt: {}, a0: now() });
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view; let did = false;
  if (act === 'ans') did = answer(v, +b.dataset.i);
  else if (act === 'next') { next(v); sfx.click(); }
  else if (act === 'again') { again(v); sfx.click(); }
  else if (act === 'replay') { D.a0 = now(); sfx.click(); }
  else if (act === 'hi') { P.hi[+b.dataset.k] = !P.hi[+b.dataset.k]; sfx.tick(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; P.sec = P.sec === k ? null : k; P.part = null; if (k === 'spiral') P.hi = [false, false]; sfx.click();
  }
  render();
  if (did) showStage();
});

// --- one render per change: controls and the state card --------------------------------------------------------
let lastView = null;
function render() {
  const t = T[lang], v = lab.view;
  if (v !== lastView) { lastView = v; if (v === 'seeds' && D.step === 0) D.a0 = now(); } // the bee flight starts when the child arrives
  document.body.dataset.v = v;
  lab.setReadout('', '', '');
  document.querySelector('.readout').style.display = v === 'sprout' && (S.step === 1 || S.step === 3) ? '' : 'none';
  $('val').textContent = '';
  capEl.style.display = 'none';
  if (v === 'parts') renderParts(t); else if (v === 'sprout') renderSprout(t); else renderSeeds(t);
}
const verdict = (t, ok, lead, body = '') => ({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead, body, extra: `<div class="fine">${esc(t.fine)}</div>` });
const cardOf = (t, k, o = {}) => { const [emo, title, lead, body] = t.cards[k]; return { emo, title, lead: o.lead ? lead : '', body: o.body ? body : '', extra: `<div class="fine">${esc(t.fine)}</div>` }; };

function renderParts(t) {
  const p = t.p, st = P.step, open = secret.unlocked();
  lab.setGlow('rgba(110, 190, 90, .26)');
  let html = '';
  if (st === 0) html = qbox(p.q1, p.o1);
  else if (st === 1) html = qbox(p.q1, p.o1, { mark: marks(P.ans[0], 1, 3) }) + `<div class="rowc">${rowBtn('next', t.next)}</div>`;
  else if (st === 2) html = qbox(p.q2, p.o2);
  else if (st === 3) html = qbox(p.q2, p.o2, { mark: marks(P.ans[1], 1, 3) }) + `<div class="rowc">${rowBtn('next', t.next)}</div>`;
  const sc = (k, emo, label) => `<button class="chip secret ${open ? 'open' : ''} ${P.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(label)}` : '🔒 ???'}</button>`;
  const hi = P.sec === 'spiral' ? [0, 1].map((i) => `<button class="chip ${P.hi[i] ? 'on' : ''}" data-act="hi" data-k="${i}">${i ? 55 : 34}</button>`).join('') : '';
  html += `<div class="rowc"><div class="chips">${sc('bee', '🐝', t.sec.uv)}${sc('spiral', '🌀', t.secrets.spiral[0])}${hi}</div>${st === 4 ? rowBtn('again', t.again, 'btn ghost') : ''}</div>`;
  if (P.flow && !P.sec && (st === 1 || st === 4)) {
    html += `<div class="legend"><span><i style="background:#ffe066"></i>${esc(p.light)}</span><span><i style="background:#4aa8ff"></i>${esc(p.water)}</span><span><i style="background:#ffd24a"></i>${esc(p.sugar)}</span></div>`;
  }
  $('ctrlBody').innerHTML = html;
  let card;
  if (P.sec === 'bee') card = { emo: '🐝', title: t.sec.uv, lead: t.sec.uvText, body: '', extra: '' };
  else if (P.sec === 'spiral') card = { emo: '🌀', title: t.secrets.spiral[0], lead: t.sec.spiralText, body: '', extra: '' };
  else if (P.part && st !== 2 && st !== 3) card = st === 0
    ? { emo: '🌿', title: cap1(p.names[P.part]), lead: '', body: t.cards.parts[3], extra: '' }
    : { emo: '🌿', title: cap1(p.names[P.part]), lead: p.jobs[P.part], body: '', extra: `<div class="fine">${esc(t.fine)}</div>` };
  else if (st === 0) card = { ...cardOf(t, 'parts'), body: t.cards.parts[3] };
  else if (st === 1) card = verdict(t, P.ans[0] === 1, p.r1);
  else if (st === 2) card = cardOf(t, 'parts');
  else if (st === 3) card = verdict(t, P.ans[1] === 1, p.r2);
  else card = cardOf(t, 'parts', { lead: true, body: true });
  lab.setState(card);
}
function renderSprout(t) {
  const s = t.s, st = S.step;
  lab.setGlow('rgba(170, 125, 70, .26)');
  let html = '';
  if (st === 0) html = qbox(s.q1, s.o1);
  else if (st === 1) html = qbox(s.q1, s.o1, { mark: marks(S.ans[0], 1, 3) }) + `<div class="rowc">${rowBtn('next', t.next)}</div>`;
  else if (st === 2) html = qbox(s.q2, s.jars.map((x, i) => `${'abc'[i]} · ${x}`), { col: true });
  else html = qbox(s.q2, s.jars.map((x, i) => `${'abc'[i]} · ${x}`), { col: true, mark: marks(S.ans[1], 0, 3) }) + `<div class="rowc">${rowBtn('again', t.again, 'btn ghost')}</div>`;
  $('ctrlBody').innerHTML = html;
  let card;
  if (st === 0 || st === 2) card = cardOf(t, 'sprout');
  else if (st === 1) card = verdict(t, S.ans[0] === 1, s.r1);
  else card = verdict(t, S.ans[1] === 0, s.r2, t.cards.sprout[2]);
  lab.setState(card);
}
function renderSeeds(t) {
  const d = t.d, st = D.step;
  lab.setGlow('rgba(240, 190, 60, .24)');
  let html = '', card;
  if (st === 0) {
    html = `<div class="rowc" style="margin-top:0">${rowBtn('replay', t.again, 'chip')}${rowBtn('next', d.next)}</div>`;
    capEl.style.display = ''; capEl.textContent = d.pollen;
    card = cardOf(t, 'seeds', { lead: true });
  } else if (st === 1) {
    const key = SEED_KEYS[D.cur], ans = D.ans[key], labels = WAYS.map((k) => d.ways[k]);
    html = qbox(d.q, labels, ans === undefined ? {} : { mark: marks(WAYS.indexOf(ans), WAYS.indexOf(ANSWER[key]), 5) });
    if (ans !== undefined) html += `<div class="rowc">${rowBtn('next', t.next)}</div>`;
    card = ans === undefined ? { emo: '🌱', title: cap1(d.names[key]), lead: '', body: '', extra: `<div class="fine">${esc(t.fine)}</div>` }
      : verdict(t, ans === ANSWER[key], d.why[key]);
  } else if (st === 2) {
    html = qbox(d.q3, d.o3); card = cardOf(t, 'seeds');
  } else {
    html = qbox(d.q3, d.o3, { mark: marks(D.ans.q3, 1, 3) }) + `<div class="rowc">${rowBtn('again', t.again, 'btn ghost')}</div>`;
    card = verdict(t, D.ans.q3 === 1, d.r3);
  }
  $('ctrlBody').innerHTML = html;
  lab.setState(card);
}
render();
</script>
