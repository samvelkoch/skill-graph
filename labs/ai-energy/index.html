    c.fillStyle = lin(c, 0, y, 0, y + 23, [[0, '#222c48'], [1, '#0f1526']]); c.strokeStyle = '#0a0f1d'; c.lineWidth = 1; rr(c, x, y, 29, 23, 3); c.fill(); c.stroke();
    for (let s = 0; s < 3; s++) {
      const yy = y + 4 + s * 6.2;
      c.fillStyle = '#313c5f'; rr(c, x + 3, yy, 17, 3.6, 1.5); c.fill();
      const on = Math.sin(t * (2 + act * 5) + i * 1.7 + j * 2.3 + s * 1.1) + act * 1.2 > 0.1;
      c.fillStyle = on ? ['#46e39a', '#ffc24d', '#5fd4ff'][(i + j + s) % 3] : '#2a3552'; c.beginPath(); c.arc(x + 24, yy + 1.8, 1.6, 0, 7); c.fill();
    }
  }
  c.fillStyle = '#1a2340'; c.strokeStyle = '#0a0f1d'; rr(c, BX + BW / 2 - 12, BY + BH - 22, 24, 22, 3); c.fill(); c.stroke();
  c.fillStyle = 'rgba(160,200,255,.25)'; c.fillRect(BX + BW / 2 - 0.6, BY + BH - 20, 1.2, 18);

  // ---- cooling tank + pipe ----
  c.fillStyle = lin(c, 0, 234, 0, 244, [[0, '#9fb0c8'], [1, '#56657f']]); c.strokeStyle = '#2a354c'; c.lineWidth = 1; rr(c, BX + BW, 236, TX - BX - BW + 2, 6, 2); c.fill(); c.stroke();
  rr(c, BX + BW, 192, 36, 5, 2); c.fill(); c.stroke(); rr(c, BX + BW + 30, 192, 6, 11, 2); c.fill(); c.stroke();
  c.fillStyle = lin(c, TX, 0, TX + TW, 0, [[0, '#9fb0c8'], [0.35, '#e1ebf6'], [1, '#6b7b94']]); c.strokeStyle = '#2a354c'; c.lineWidth = 1.3;
  rr(c, TX, TY, TW, TH, 5); c.fill(); c.stroke();
  c.fillStyle = '#eef4fb'; c.beginPath(); c.ellipse(TX + TW / 2, TY, TW / 2, 5, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#0d2840'; rr(c, TX + 7, TY + 12, TW - 14, TH - 20, 4); c.fill();
  c.save(); rr(c, TX + 7, TY + 12, TW - 14, TH - 20, 4); c.clip();
  const wy = TY + 20; c.fillStyle = lin(c, 0, wy, 0, TY + TH, [[0, '#6fd0ff'], [1, '#1d6fc0']]);
  c.beginPath(); c.moveTo(TX + 7, wy); for (let x = 0; x <= TW - 14; x += 3) c.lineTo(TX + 7 + x, wy + Math.sin(t * 2.4 + x * 0.5) * 0.9); c.lineTo(TX + TW - 7, TY + TH); c.lineTo(TX + 7, TY + TH); c.closePath(); c.fill();
  c.restore();
  A.drops.forEach((d) => { c.fillStyle = rad(c, TX + 17, d.y - 1, 0.5, 3.4, [[0, '#ffffff'], [1, '#3aa5f0']]); c.beginPath(); c.ellipse(TX + 17, d.y, 2.2, 3, 0, 0, 7); c.fill(); });
  if (S.sec === 'water') pills.push({ text: tx.water.pill, x: 262, y: 282 });

  // ---- cable from phone ----
  c.lineCap = 'round'; c.strokeStyle = '#141b32'; c.lineWidth = 6; c.beginPath(); c.moveTo(...CABLE[0]); c.bezierCurveTo(...CABLE[1], ...CABLE[2], ...CABLE[3]); c.stroke();
  c.strokeStyle = `rgba(95,212,255,${0.4 + act * 0.55})`; c.lineWidth = 2.6; c.stroke();
  const np = 1 + Math.round(act * 4);
  for (let k = 0; k < np; k++) { const [px, py] = bez(CABLE, (t * (0.5 + act * 0.9) + k / np) % 1); c.fillStyle = '#d6f6ff'; c.beginPath(); c.arc(px, py, 2.4, 0, 7); c.fill(); }
  c.lineCap = 'butt';

  // ---- people ----
  const crowd = v === 'sum' && S.p2 !== null ? (S.step === null ? 10 : [1, 30, 100, 0][S.step]) : 1;
  const blink = (t % 4) > 3.86;
  if (v === 'sum' && S.p2 !== null && S.step === 3) {
    const gx = 64, gy = 198, gr = 38;
    c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(gx + 4, 248, 36, 5, 0, 0, 7); c.fill();
    c.fillStyle = rad(c, gx - 12, gy - 14, 2, gr * 1.3, [[0, '#8fd6ff'], [0.55, '#2f86d6'], [1, '#14437f']]); c.strokeStyle = '#0d2c5c'; c.lineWidth = 1.4;
    c.beginPath(); c.arc(gx, gy, gr, 0, 7); c.fill(); c.stroke();
    c.save(); c.beginPath(); c.arc(gx, gy, gr - 0.5, 0, 7); c.clip(); c.fillStyle = '#5fbf7a';
    const ro = (t * 8) % 76;
    for (let q = -1; q <= 1; q++) {
      c.save(); c.translate(-ro + q * 76, 0);
      [[gx - 18, gy - 12, 16, 11], [gx + 10, gy + 6, 14, 17], [gx - 6, gy + 22, 11, 7], [gx + 20, gy - 18, 9, 7]].forEach(([x, y, a, b]) => { c.beginPath(); c.ellipse(x + 38, y, a, b, 0.3, 0, 7); c.fill(); });
      c.restore();
    }
    c.fillStyle = 'rgba(255,255,255,.28)'; c.beginPath(); c.ellipse(gx - 14, gy - 18, 16, 9, -0.6, 0, 7); c.fill(); c.restore();
  } else if (crowd === 1) {
    c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(36, 252, 22, 4.5, 0, 0, 7); c.fill();
    c.fillStyle = lin(c, 20, 224, 50, 252, [[0, '#ffb070'], [1, '#d4622c']]); c.strokeStyle = '#8a3c18'; c.lineWidth = 1.3;
    c.beginPath(); c.moveTo(18, 252); c.quadraticCurveTo(16, 226, 36, 224); c.quadraticCurveTo(56, 226, 54, 252); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = '#e9a77a'; c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); c.moveTo(46, 238); c.lineTo(54, 226); c.stroke(); c.lineCap = 'butt';
    face(c, 36, 212, 15, SKIN[0], HAIR[0], blink);
    // phone
    c.save(); c.translate(60, 224); c.rotate(-0.08);
    c.fillStyle = lin(c, 0, 0, 22, 40, [[0, '#4a5478'], [1, '#1c2238']]); c.strokeStyle = '#0b0f1c'; c.lineWidth = 1.3; c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 5; c.shadowOffsetY = 2;
    rr(c, 0, 0, 22, 40, 5); c.fill(); c.stroke(); c.shadowColor = 'transparent';
    c.fillStyle = lin(c, 0, 3, 0, 37, [[0, '#8fd0ff'], [1, '#3b78d4']]); rr(c, 2.5, 3.5, 17, 31, 3); c.fill();
    c.fillStyle = 'rgba(255,255,255,.85)'; rr(c, 5, 8, 12, 5, 2.5); c.fill(); rr(c, 5, 16, 9, 5, 2.5); c.fill();
    c.restore();
  } else {
    const grid = crowd === 10 ? { cols: 5, rows: 2, dx: 19, dy: 20, r: 8, x0: 22, y0: 196 } : crowd === 30 ? { cols: 6, rows: 5, dx: 15, dy: 17, r: 6.4, x0: 16, y0: 164 } : { cols: 11, rows: 9, dx: 8, dy: 9, r: 3.5, x0: 16, y0: 164 };
    c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.ellipse(60, 252, 50, 5, 0, 0, 7); c.fill();
    let idx = 0;
    for (let j = 0; j < grid.rows; j++) for (let i = 0; i < grid.cols; i++, idx++) {
      const bob = Math.sin(t * 2 + idx * 1.3) * 0.6;
      face(c, grid.x0 + i * grid.dx, grid.y0 + j * grid.dy + bob, grid.r, SKIN[idx % 4], HAIR[(idx * 3) % 4], blink && idx % 3 === 0);
    }
  }
  // chat bubble (phone side) in one / sum / src
  const typing = v === 'sum' && S.p2 !== null && S.step === 3 ? false : true;
  if (typing) {
    const bx0 = 10, by0 = 124, bob = Math.sin(t * 2) * 1.2;
    c.save(); c.translate(0, bob);
    c.shadowColor = 'rgba(0,0,0,.3)'; c.shadowBlur = 6; c.shadowOffsetY = 2;
    c.fillStyle = lin(c, bx0, by0, bx0, by0 + 32, [[0, '#ffffff'], [1, '#d6e2f4']]); c.strokeStyle = '#8fa4c8'; c.lineWidth = 1.2;
    rr(c, bx0, by0, 70, 30, 12); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(bx0 + 16, by0 + 29); c.lineTo(bx0 + 12, by0 + 40); c.lineTo(bx0 + 28, by0 + 29); c.closePath(); c.fill(); c.shadowColor = 'transparent';
    c.fillStyle = '#e6eefb'; c.fillRect(bx0 + 14, by0 + 28, 14, 2);
    if (S.sec === 'useful') { c.fillStyle = '#3b4a6e'; c.font = '800 16px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🌬️ ?', bx0 + 35, by0 + 16); }
    else for (let k = 0; k < 3; k++) { c.fillStyle = '#4a5c86'; c.beginPath(); c.arc(bx0 + 22 + k * 13, by0 + 15 + Math.sin(t * 5 - k * 0.9) * 2.4, 3.3, 0, 7); c.fill(); }
    c.restore();
  }

  // ---- view 1: bulb + kettle after the reveal ----
  if (v === 'one') {
    const bx = 52, by = 66, lit = A.rv > 0.4 ? ease((A.rv - 0.4) / 0.4) : 0;
    const cyc = A.bt % 7, on = lit * (cyc < 5.6 ? 1 : Math.max(0, 1 - (cyc - 5.6) / 0.3));
    if (on > 0.02) { c.fillStyle = rad(c, bx, by, 4, 46, [[0, `rgba(255,226,120,${0.55 * on})`], [1, 'rgba(255,226,120,0)']]); c.beginPath(); c.arc(bx, by, 46, 0, 7); c.fill(); }
    c.fillStyle = lin(c, bx - 9, by + 14, bx + 9, by + 30, [[0, '#b3bccd'], [1, '#6b7589']]); c.strokeStyle = '#3d4658'; c.lineWidth = 1; rr(c, bx - 8, by + 14, 16, 11, 3); c.fill(); c.stroke();
    c.fillStyle = rad(c, bx - 6, by - 7, 1, 22, [[0, on > 0.02 ? '#fffbe0' : '#e6edf8'], [0.6, on > 0.02 ? `rgb(255,${Math.round(210 + 20 * on)},${Math.round(110 - 40 * on)})` : '#9fb0cc'], [1, on > 0.02 ? '#ffae2e' : '#5d6c8c']]);
    c.strokeStyle = on > 0.02 ? '#d98410' : '#44526f'; c.lineWidth = 1.2; c.beginPath(); c.arc(bx, by, 17, 0, 7); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(bx - 6, by - 8, 4.5, 2.8, -0.6, 0, 7); c.fill();
    if (lit > 0) {
      const frac = cyc < 5.6 ? 1 - cyc / 5.6 : 0;
      c.lineWidth = 3.2; c.lineCap = 'round'; c.strokeStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.arc(bx, by, 28, 0, 7); c.stroke();
      c.strokeStyle = '#ffd36b'; c.beginPath(); c.arc(bx, by, 28, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); c.stroke(); c.lineCap = 'butt';
      pills.push({ text: tx.one.bulb, x: bx, y: by + 46, a: lit });
      // kettle
      const kx = 180, ky = 62, ks = 0.7 + 0.3 * ease((A.rv - 0.6) / 0.4);
      c.save(); c.globalAlpha = clamp((A.rv - 0.5) / 0.4, 0, 1); c.translate(kx, ky); c.scale(ks, ks);
      c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(2, 26, 24, 4, 0, 0, 7); c.fill();
      c.fillStyle = lin(c, -20, -14, 20, 24, [[0, '#f0f4fa'], [0.5, '#aeb9cc'], [1, '#6c7890']]); c.strokeStyle = '#47516a'; c.lineWidth = 1.3;
      c.beginPath(); c.moveTo(-17, 24); c.quadraticCurveTo(-22, -4, -9, -10); c.lineTo(9, -10); c.quadraticCurveTo(22, -4, 17, 24); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(-17, 10); c.quadraticCurveTo(-30, 8, -31, -6); c.lineTo(-24, -6); c.quadraticCurveTo(-23, 2, -14, 2); c.closePath(); c.fill(); c.stroke();
      c.strokeStyle = '#47516a'; c.lineWidth = 4; c.beginPath(); c.moveTo(16, 14); c.bezierCurveTo(34, 12, 34, -8, 12, -9); c.stroke();
      c.strokeStyle = '#d8606a'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(16, 14); c.bezierCurveTo(34, 12, 34, -8, 12, -9); c.stroke();
      c.fillStyle = lin(c, -9, -16, 9, -10, [[0, '#dce4f0'], [1, '#8190aa']]); c.strokeStyle = '#47516a'; c.lineWidth = 1.2;
      c.beginPath(); c.ellipse(0, -11, 10, 3.6, 0, 0, 7); c.fill(); c.stroke(); c.fillStyle = '#d8606a'; c.beginPath(); c.arc(0, -16, 2.6, 0, 7); c.fill();
      c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(-9, 4, 3, 10, 0.1, 0, 7); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 2; c.lineCap = 'round';
      for (let k = 0; k < 3; k++) { const ph = (t * 0.8 + k * 0.33) % 1; c.globalAlpha = (1 - ph) * 0.6 * clamp((A.rv - 0.5) / 0.4, 0, 1); c.beginPath(); c.moveTo(-27 - ph * 4, -9 - ph * 16); c.quadraticCurveTo(-29 + Math.sin(ph * 9) * 3, -16 - ph * 16, -26, -22 - ph * 16); c.stroke(); }
      c.restore();
      pills.push({ text: tx.one.kt, x: kx, y: ky + 36, a: clamp((A.rv - 0.5) / 0.4, 0, 1) });
    }
  }
  // ---- secret: useful question map card ----
  if (S.sec === 'useful') {
    c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 8; c.shadowOffsetY = 2;
    c.fillStyle = lin(c, 14, 20, 94, 90, [[0, '#d8eeff'], [1, '#7db6e6']]); c.strokeStyle = '#2d5d8e'; c.lineWidth = 1.3; rr(c, 14, 20, 82, 66, 10); c.fill(); c.stroke(); c.restore();
    c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 1.4;
    for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(20, 36 + k * 16); c.bezierCurveTo(40, 26 + k * 16, 60, 48 + k * 16, 90, 34 + k * 16); c.stroke(); }
    [[34, 50], [60, 42], [78, 62]].forEach(([x, y], k) => { c.fillStyle = '#3ddc97'; c.strokeStyle = '#17724c'; c.lineWidth = 1; c.beginPath(); c.arc(x, y, 5.5, 0, 7); c.fill(); c.stroke();
      c.save(); c.translate(x, y); c.rotate(t * 2 + k); c.strokeStyle = '#fff'; c.lineWidth = 1.3; for (let q = 0; q < 3; q++) { c.rotate(Math.PI * 2 / 3); c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -4.2); c.stroke(); } c.restore(); });
    pills.push({ text: tx.useful.pill, x: 56, y: 100 });
  }
  c.restore();

  // ---- pills in screen pixels ----
  pills.forEach((p) => {
    const X = ox + p.x * sc, Y = oy + p.y * sc;
    if (p.a !== undefined) { c.save(); c.globalAlpha = clamp(p.a, 0, 1); pill(c, w, h, p.text, X, Y); c.restore(); }
    else pill(c, w, h, p.text, X, Y, { bare: p.bare, fs: p.meter ? 13 : 12, color: p.meter ? '#bff0ff' : '#fff' });
  });
  if (v === 'sum' && S.p2 !== null) pill(c, w, h, `${nf(nOfSum())} 💬`, ox + 56 * sc, oy + 108 * sc);
  if (v === 'src') pill(c, w, h, tx.src.pill, ox + 180 * sc, oy + 284 * sc);
});

// --- text per view ---------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  $('v1').hidden = v !== 'one'; $('v2').hidden = v !== 'sum'; $('v3').hidden = v !== 'src';
  lab.setGlow('rgba(255, 200, 80, .22)');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = `<div class="chips">${sc('water', '💧')}${sc('useful', '🌬️')}</div>`;
  lab.setFacts([t.facts[v === 'one' ? 0 : v === 'sum' ? 1 : 2]]);
  let st;
  if (v === 'one') {
    const o = t.one;
    $('v1q').innerHTML = S.p1 === null
      ? `<div class="ai-q">${esc(o.q)}</div><div class="ai-opts">${o.opts.map((x, i) => `<button class="ai-opt" data-p1="${i}">${esc(x)}</button>`).join('')}</div>`
      : `<button class="chip ai-chip" data-again="1">${esc(o.again)}</button>`;
    if (S.p1 === null) { lab.setReadout('?', '', '', '#ffc24d'); st = { emo: '🤔', title: o.q, lead: o.lead0, body: '' }; }
    else {
      lab.setReadout(fmtE(WH), o.sub, o.pill, '#ffc24d');
      st = { emo: S.p1 === 1 ? '✅' : '💡', title: S.p1 === 1 ? t.right : `${t.wrong} ${o.fb[S.p1]}`, lead: o.res, body: o.kettle };
    }
  } else if (v === 'sum') {
    const o = t.sum;
    $('v2q').innerHTML = S.p2 === null ? `<div class="ai-q">${esc(o.q)}</div><div class="ai-opts">${o.opts.map((x, i) => `<button class="ai-opt" data-p2="${i}">${esc(x)}</button>`).join('')}</div>` : '';
    $('v2s').hidden = S.p2 === null;
    $('steps').innerHTML = o.chips.map((x, i) => `<button class="ai-step ${S.step === i ? 'on' : ''}" data-step="${i}">${esc(x)}</button>`).join('');
    if (S.step !== null) $('sl').value = S.step;
    if (S.p2 === null) { lab.setReadout('?', '', '', '#ffc24d'); st = { emo: '🤔', title: o.q, lead: o.lead0, body: '' }; }
    else {
      const n = nOfSum(), E = fmtE(n * WH), q = `${nf(n)} ${o.q1(n)}`;
      lab.setReadout(E, o.sub, q, '#ffc24d');
      if (S.step === null) st = { emo: S.p2 === 1 ? '✅' : '💡', title: S.p2 === 1 ? t.right : t.wrong, lead: o.fb, body: o.nudge };
      else st = { emo: ['🙋', '🏫', '🏘️', '🌍'][S.step], title: o.who[S.step], lead: o.line(q, E), body: o.eq[S.step] };
    }
  } else {
    const o = t.src, k = SRCS.indexOf(S.src);
    $('srcChips').innerHTML = SRCS.map((s, i) => `<button class="chip ai-chip ${S.src === s ? 'on' : ''}" data-src="${s}">${esc(o.chips[i])}</button>`).join('');
    lab.setReadout(o.val[k], o.cloud[k], '', ['#7a7f8c', '#46e39a', '#ffc24d'][k]);
    st = { emo: ['🏭', '🌬️', '☀️'][k], title: o.title[k], lead: o.lead[k], body: o.body };
  }
  if (S.sec === 'water') {
    let lead = t.water.lead;
    if (v === 'sum' && S.p2 !== null) lead = S.step === null ? `${t.sum.ten}: ${t.about} ${t.water.ten}.` : t.water.tot(`${nf(nOfSum())} ${t.sum.q1(nOfSum())}`, t.water.vol[S.step]);
    st = { emo: '💧', title: t.water.title, lead, body: '' };
  } else if (S.sec === 'useful') st = { emo: '🌬️', title: t.useful.title, lead: t.useful.lead, body: t.useful.body, extra: `<div class="fine">${esc(t.useful.src)}</div>` };
  lab.setState({ extra: '', ...st });
}
render();
</script>
