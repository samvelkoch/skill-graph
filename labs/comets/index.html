// --- drawing helpers --------------------------------------------------------------------------------------------
function scene(o, w, h, pad, ext = 0.5) {

  if (sceneCache.has(key)) return sceneCache.get(key);
  const top = 44, cs = Math.cos(o.phi), sn = Math.sin(o.phi);
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i <= 180; i++) {
    const E = (i / 180) * TAU, x = o.a * (Math.cos(E) - o.e), y = o.b * Math.sin(E), X = x * cs - y * sn, Y = x * sn + y * cs;
    x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y);
  }
  { const x = o.q + o.a * ext, X = x * cs, Y = x * sn; x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y); } // room for the tail beyond the closest point
  const s = Math.max(1, Math.min((w - 2 * pad) / (x1 - x0), (h - top - pad) / (y1 - y0)));
  const sc = { s, cs, sn, ox: w / 2 - ((x0 + x1) / 2) * s, oy: top + (h - top - pad / 2) / 2 - ((y0 + y1) / 2) * s };
  if (sceneCache.size > 40) sceneCache.clear();
  sceneCache.set(key, sc);
  return sc;
}
const toS = (sc, x, y) => [sc.ox + (x * sc.cs - y * sc.sn) * sc.s, sc.oy + (x * sc.sn + y * sc.cs) * sc.s];
const unit = (v) => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };

}

  c.closePath();

}
