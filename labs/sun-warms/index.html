// --- the scenes -----------------------------------------------------------------------------------------------------
const DRAW = { stone: drawStone, bucket: drawBucket, car: drawCar, bench: drawBench, shirt: drawShirt, house: drawHouse, sand: drawSand, sea: drawSea };

function drawDay(c, e, time, dt) {

  c.fillStyle = vgrad(c, e.y0, HZ, kf(SKYT, h), kf(SKYB, h)); c.fillRect(e.x0, e.y0, e.x1 - e.x0, HZ - e.y0 + 1);

// --- time and the loop ---------------------------------------------------------------------------------------------------
let lastKey = '', drag = null;
function tick(dt) {
  const u = S.sh, v = lab.view;
  if (!drag) { const k = 1 - Math.exp(-dt * 12); u.ux += (u.tx - u.ux) * k; u.uy += (u.ty - u.uy) * k; }
  if (v === 'shade' && u.play && revealed('shade')) { u.m = Math.min(60, u.m + dt * 10); if (u.m >= 60) u.play = false; } // an hour in six seconds
  if (v === 'shirts' && S.si.play && revealed('shirts')) { S.si.m = Math.min(60, S.si.m + dt * 10); if (S.si.m >= 60) S.si.play = false; }
  if (v === 'day' && S.dy.play) { S.dy.f = Math.min(1, S.dy.f + dt / 12); if (S.dy.f >= 1) S.dy.play = false; }
  const key = v === 'day' ? `d${Math.round(S.dy.f * 84)}${S.dy.play}` : v === 'shade' ? `s${Math.round(u.m)}${u.play}${u.sec}` : `i${Math.round(S.si.m)}${S.si.play}${S.si.sec}`;
  if (key !== lastKey) { lastKey = key; render(); }
}
canvasLoop(cv, (c, w, h, dt, time) => {
  tick(dt);
  const k = Math.min(w / W, h / H), ox = (w - W * k) / 2, oy = (h - H * k) / 2;
  VIEW.k = k; VIEW.ox = ox; VIEW.oy = oy;
  c.save(); c.translate(ox, oy); c.scale(k, k);
  const e = { x0: -ox / k, x1: (w - ox) / k, y0: -oy / k, y1: (h - oy) / k };
  if (lab.view === 'day') drawDay(c, e, time, dt); else drawYard(c, e, time, dt, lab.view);
  c.restore();
});

// --- dragging the umbrella --------------------------------------------------------------------------------------------------
const toDesign = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - VIEW.ox) / VIEW.k, (ev.clientY - r.top - VIEW.oy) / VIEW.k]; };
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'shade' || !revealed('shade')) return;
  const [x, y] = toDesign(ev), u = S.sh, by = u.uy - UMB.up;
  const inCanopy = ((x - u.ux) / 64) ** 2 + ((y - (by - 6)) / 46) ** 2 < 1, inPole = Math.abs(x - u.ux) < 16 && y > by && y < u.uy + 8;
  const inShade = ((x - u.ux - 34) / 60) ** 2 + ((y - u.uy - 4) / 26) ** 2 < 1;
  if (!(inCanopy || inPole || inShade)) return;
  drag = { dx: x - u.ux, dy: y - u.uy };
  try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
  u.m = 0; u.play = false; u.moved = true; u.verdict = false; sfx.click(); render();
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const [x, y] = toDesign(ev), u = S.sh;
  u.ux = u.tx = clamp(x - drag.dx, 16, 304); u.uy = u.ty = clamp(y - drag.dy, 186, 316);
  render();
});
const endDrag = () => { if (!drag) return; drag = null; S.sh.play = true; sfx.snap(); render(); };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// --- one render per change: controls, readout, state card and facts ------------------------------------------------------------
let factKey = '';
const setFactsOnce = (list) => { const k = JSON.stringify(list.map((f) => f.text)); if (k === factKey) return; factKey = k; lab.setFacts(list); };
const fact = (t, k) => ({ emo: FEMO[k], text: t.f[k], src: SRC[k] });
const clock = (h) => { const m = Math.floor(h * 6 + 1e-6) * 10, hh = Math.floor(m / 60); return `${hh}:${String(m % 60).padStart(2, '0')}`; };

function render() {
  const t = T[lang], v = lab.view, st = GS(v), sec = t[SEC[v]], rev = revealed(v);
  cv.style.touchAction = v === 'shade' && rev ? 'none' : 'pan-y';
  cv.style.cursor = v === 'shade' && rev ? 'grab' : 'default';
  // question

  askEl.hidden = rev;
  if (!rev) {
    const html = `<div class="q">${esc(sec.q)}</div><div class="opts">${ORDER[v].map((k) => `<button type="button" data-g="${k}">${esc(sec.opts[k])}</button>`).join('')}</div>`;
    if (askEl.dataset.k !== html) { askEl.innerHTML = html; askEl.dataset.k = html; }
  }

  $('swTime').hidden = !showTime;
  if (v === 'day') {

    tm.style.setProperty('--track', 'linear-gradient(90deg,#f5b76a,#5aa9ee 28%,#5aa9ee 55%,#f08a5d 78%,#1a2250)');
    $('swLbl').textContent = t.clock; $('swVal').textContent = clock(hourOf(S.dy.f)); $('swA').textContent = t.ends.c; $('swB').textContent = t.ends.d;
  } else {
    tm.min = 0; tm.max = 60; tm.value = Math.round(st.m); tm.style.removeProperty('--track');
    $('swLbl').textContent = t.mins; $('swVal').textContent = `${Math.round(st.m)} ${t.min}`; $('swA').textContent = t.ends.a; $('swB').textContent = t.ends.b;
  }
  // chips

  $('swRun').hidden = !rev;

  $('swUmb').hidden = !(v === 'shade' && rev); $('swUmb').textContent = t.umb;
  const secKey = v === 'shade' ? 'sand' : v === 'shirts' ? 'houses' : null, secEmo = v === 'shade' ? '🏖️' : '🏠', open = secret.unlocked();
  $('swSec').hidden = !(secKey && rev);

function verdictOf(v, t, lead, body) { const ok = GS(v).guess === CORRECT[v]; return { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.miss, lead, body }; }

function renderShade(t, rev) {
  const u = S.sh, sh = t.sh;

  if (!rev) {
    lab.setReadout('?', '', '', '#f5b84a');
    lab.setState({ emo: '🤔', title: sh.q, lead: sh.lead, body: '', extra: '' }); return;
  }
  lab.setReadout(`${Math.round(u.m)}`, t.min, '', '#f5b84a');
  const objs = objsFor('shade'), lits = objs.map(isLit), s = u.sec === 'sand' ? t.sand : null;
  let st;
  if (u.verdict) st = verdictOf('shade', t, sh.v(finalT(SHADE[0]), finalT(SHADE[1], false)), sh.vb);
  else if (s) {

    else if (lits[0]) st = { emo: '🥵', title: s.hot[0], lead: s.hot[1](Math.round(targetT(objs[0])), Math.round(targetT(objs[1]))), body: s.hot[2] };

  lab.setState({ ...st, extra: '' });
}
function renderDay(t, rev) {
  const d = t.dy, f = S.dy.f, h = hourOf(f);
  lab.setGlow('rgba(127, 180, 232, .26)');
  setFactsOnce([fact(t, 'sun'), fact(t, 'roof')]);
  lab.setReadout(clock(h), `${t.air} ${Math.round(airT(h))} °C`, '', '#7fb4e8');
  const lb = dayLit(BENCH.x, h), ls = dayLit(STONE.x, h);
  const s = !sunUp(h) ? d.night : lb && ls ? d.both : !lb ? d.benchShade : d.stoneShade;
  const emo = !sunUp(h) ? '🌙' : '🌅';
  if (!rev) { lab.setState({ emo: '🤔', title: d.q, lead: d.lead, body: `${s[0]}. ${s[1]}`, extra: '' }); return; }
  if (S.dy.verdict) { lab.setState({ ...verdictOf('day', t, d.v(Math.round(dayTemp('stone', (20 - H0) / (H1 - H0))), Math.round(dayTemp('stone', NOON_F))), d.vb), extra: '' }); return; }
  lab.setState({ emo, title: s[0], lead: s[1], body: '', extra: '' });
}
render();
</script>
