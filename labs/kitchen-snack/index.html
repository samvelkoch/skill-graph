  cb.innerHTML = `<p class="ks-verd"><b class="${right ? '' : 'no'}">${esc(right ? t.right : t.notq)}</b>${esc(right ? k.ok : k.no)}</p>
    <div class="ks-row">${['apple', 'carrot'].map((f) => btn(`ks-b ${S.food === f ? 'on' : ''}`, 'food', f, `${S.done[f] ? '✓ ' : ''}${k.foods[f]}`)).join('')}</div>
    <div class="ks-row">${['bridge', 'claw', 'flat'].map((g) => btn(`ks-b ${S.grip === g ? 'on' : ''}`, 'grip', g, k.grips[g])).join('')}</div>
    <div class="ks-row">${btn('ks-b go', 'cut', undefined, k.cut, S.cutAnim ? ' disabled' : '')}${cp > 0 && !S.cutAnim ? btn('ks-b', 'redo', undefined, t.again) : ''}${sb}</div>
    <p class="ks-steps" style="margin-top:10px">${esc(k.steps)}</p>`;
  lab.setReadout(`${nd}/2`, k.sub, '', '#e0b050');
  let st;
  if (S.secB) st = { emo: '🧑‍🍳', title: k.secT[0], lead: k.secT[1], body: '' };
  else if (nd === 2 && cp === 1 && !S.cutAnim) st = { emo: '🏆', title: k.both[0], lead: k.both[1], body: '' };
  else if (!h.placed) st = { emo: '✋', title: k.place[0], lead: k.place[1], body: '' };
  else if (S.grip === 'flat') st = { emo: '⚠️', title: k.red[0], lead: k.red[1], body: '' };
  else if (cp >= 1 && S.cutOk) {
    const g = S.lastCut?.grip, f = S.lastCut?.food;
    st = S.cutOk === 'ok' ? (g === 'bridge' ? { emo: '✅', title: k.okB[0], lead: k.okB[1], body: '' } : { emo: '✅', title: k.okC[0], lead: k.okC[1], body: '' })
      : { emo: '👍', title: (f === 'apple' ? k.altA : k.altC)[0], lead: (f === 'apple' ? k.altA : k.altC)[1], body: '' };
  } else if (S.cutAnim) st = { emo: '🔪', title: k.steps, lead: '', body: '' };
  else st = { emo: '👌', title: k.clr[0], lead: k.clr[1], body: '' };
  lab.setState({ ...st, extra: `<div class="ks-note">🧑‍🍳 ${esc(k.near)}</div>` });
  lab.setFacts(k.facts.post);
}

function renderClean() {
  const t = T[lang], cl = t.clean, cb = $('cb'), sc = S.scrub;
  lab.setGlow('rgba(111, 168, 224, .24)');
  const sb = secBtn('brown', '🍎', cl.secB[0]);
  if (S.sec === 'brown') {
    cb.innerHTML = `<div class="ks-row">${btn(`ks-b ${S.lemon ? 'on' : ''}`, 'lemon', undefined, cl.lemon)}${sb}</div>
      <div class="ks-row"><span class="ks-lbl">${esc(cl.wait)}</span></div><input class="big ks-wait" id="wait" type="range" min="0" max="100" value="${Math.round(S.wait * 100)}" aria-label="${esc(cl.wait)}">
      <p class="ks-note">${esc(t.simple)}</p>`;
    lab.setReadout('🍎', cl.secB[1], '', '#d9825f');
    lab.setState({ emo: '🍎', title: cl.secT[0], lead: cl.secT[1], body: '', extra: '' });
    lab.setFacts(cl.facts.brown);
    return;
  }
  let facts = cl.facts.pre, st, ctl = '', ro;
  if (S.ct === 0) {
    const done = sc.stopped !== null, s = Math.floor(sc.stopped ?? sc.el);
    ctl = done ? `<p class="ks-verd"><b class="${sc.stopped >= 20 ? '' : 'no'}">${esc((sc.stopped >= 20 ? cl.r0ok : cl.r0no)[0])}</b>${esc((sc.stopped >= 20 ? cl.r0ok : cl.r0no)[1](s))}</p><div class="ks-row">${btn('ks-b', 'scrub', undefined, t.again)}${btn('ks-b go', 'cnext', undefined, t.next)}</div>`
      : `<p class="ks-q">${esc(cl.q0)}</p><div class="ks-row">${btn('ks-b go', 'scrub', undefined, cl.scrub, sc.on ? ' disabled' : '')}${btn('ks-b', 'stop', undefined, cl.stop, sc.on ? '' : ' disabled')}</div>`;
    ro = [s, cl.sub[0]];
    st = done ? { emo: sc.stopped >= 20 ? '✅' : '⏱️', title: (sc.stopped >= 20 ? cl.r0ok : cl.r0no)[0], lead: (sc.stopped >= 20 ? cl.r0ok : cl.r0no)[1](s), body: '' }
      : { emo: '🧼', title: cl.scrub.replace(/^\S+\s/, ''), lead: cl.q0, body: '' };
    if (done) facts = cl.facts.post0;
  } else if (S.ct === 1) {
    const r = S.ordRes;
    ctl = r ? `<p class="ks-verd"><b class="${r === 'ok' ? '' : 'no'}">${esc(cl['r1' + r][0])}</b>${esc(cl['r1' + r][1])}</p><div class="ks-row">${btn('ks-b go', 'cnext', undefined, t.next)}</div>`
      : `<p class="ks-q">${esc(cl.q1)}</p>`;
    ro = [`${S.order.length}/3`, cl.sub[1]];
    st = r ? { emo: r === 'ok' ? '✅' : '🧼', title: cl['r1' + r][0], lead: cl['r1' + r][1], body: '' } : { emo: '🧼', title: cl.q1, lead: '', body: '' };
    facts = r ? cl.facts.post : cl.facts.pre;
  } else if (S.ct === 2) {
    const placed = S.items.filter((q) => q.board).length, all = placed === 4;
    ctl = all ? `<p class="ks-verd"><b>${esc(t.right)}</b>${esc(cl.r2[1])}</p><div class="ks-row">${btn('ks-b go', 'cnext', undefined, t.next)}</div>`
      : `<p class="ks-q">${esc(cl.q2)}</p>${S.bmis && S.sel ? `<p class="ks-verd"><b class="no">${esc(t.notq)}</b>${esc(cl.wrong)}</p>` : ''}`;
    ro = [`${placed}/4`, cl.sub[2]];
    st = all ? { emo: '✅', title: cl.r2[0], lead: cl.r2[1], body: '' } : { emo: '🔪', title: cl.q2, lead: S.bmis && S.sel ? cl.wrong : '', body: '' };
    facts = all ? cl.facts.post : cl.facts.pre;
  } else {
    ctl = `<div class="ks-row">${btn('ks-b go', 'cagain', undefined, t.again)}</div>`;
    ro = ['✓', cl.end[0]]; st = { emo: '🏆', title: cl.end[0], lead: cl.end[1], body: '' }; facts = cl.facts.post;
  }
  cb.innerHTML = `${ctl}<div class="ks-row">${sb}</div>`;
  lab.setReadout(ro[0], ro[1], '', '#6fa8e0');
  lab.setState({ ...st, extra: '' });
  lab.setFacts(facts);
}
render();
</script>
</body>
</html>
