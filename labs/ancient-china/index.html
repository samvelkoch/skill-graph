  c.strokeStyle = '#a99468'; c.lineWidth = 1.2; rr(c, -96, -80, 192, 160, 4); c.stroke();

function scenePrint(c, st, tt) {

const stepOfDemo = () => (S.demo === 'paper' ? 5 : S.demo === 'print' ? 4 : 0);
function drawIdeas(c, w, h, dt, time) {

// --- controls and prediction blocks --------------------------------------------------------------------------
const ideaDone = () => S.rank.length === 3;

  }).join('');

const GL = ['M2 3H16M9 3V19M2 19H16', 'M2 3L16 19M16 3L2 19', 'M2 11H16M5 3V19M13 3V19'];

  const script = `<g class="b">${tab(6, GL[0])}${tab(44, GL[1])}${tab(82, GL[2])}</g><g class="a">${tab(6, GL[1])}${tab(44, GL[1])}${tab(82, GL[1])}</g>`;
  const knife = (x, r) => `<g transform="translate(${x} 8) rotate(${r} 18 14)"><circle cx="5" cy="19" r="4" fill="none" stroke="${bs}" stroke-width="2"/><path d="M10 18 Q22 6 36 10 L36 17 Q22 18 10 25 Z" fill="${bz}" stroke="${bs}" stroke-width="1.5" stroke-linejoin="round"/></g>`;
  const spade = (x) => `<path transform="translate(${x} 4)" d="M8 2 H26 V18 H31 V34 H24 V26 H10 V34 H3 V18 H8 Z" fill="${bz}" stroke="${bs}" stroke-width="1.5" stroke-linejoin="round"/>`;

function qinCtlHTML() {

const TOTAL = 21196, MING = 8850, EARLYKM = 3080;

const showStage = () => {
  const r = $('stage').getBoundingClientRect();

};

// --- one render per change ----------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, secOn = !!S.sec;
  document.body.dataset.v = v;
  $('cnQin').hidden = secOn || v !== 'qin'; $('cnWall').hidden = secOn || v !== 'wall'; $('cnIdeas').hidden = secOn || v !== 'ideas'; $('cnSecCtl').hidden = !secOn;
  // Qin
  $('cnPredQin').innerHTML = predHTML('qin');
  if (S.pick.qin !== null) { if (S.built.qin !== lang) { $('cnQinCtl').innerHTML = qinCtlHTML(); S.built.qin = lang; } } else { $('cnQinCtl').innerHTML = ''; S.built.qin = ''; }
  S.lastYr = -1;
  // Wall
  $('cnPredWall').innerHTML = predHTML('wall');
  $('cnYa').textContent = t.yBC(300); $('cnYb').textContent = t.yAD(1644); $('cnYm').textContent = t.wYear;
  if (S.pick.wall !== null) { $('cnWallCtl').innerHTML = wallCtlHTML(); S.built.wall = lang; } else { $('cnWallCtl').innerHTML = ''; S.built.wall = ''; }
  // Ideas
  $('cnPredIdeas').innerHTML = ideasPredHTML();
  $('cnDemoChips').innerHTML = [['paper', t.dPaper], ['compass', t.dCompass], ['print', t.dPrint]].map(([k, l]) => `<button class="cn-chip${S.demo === k ? ' on' : ''}" data-act="demo" data-k="${k}">${esc(l)}</button>`).join('');

    $('cnBowlLbl').textContent = t.bowl; $('cnCompTxt').textContent = S.rubs >= 4 ? t.compassAfter : t.compassBefore;
  }
  $('cnTimeline').innerHTML = ideaDone() ? timelineHTML() : '';
  // secrets
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('cnSecs').innerHTML = sc('a', '🪖') + sc('b', '🌊');

  if (S.sec) {
    const sd = S.sec === 'a' ? t.armyT : t.siltT;
    lab.setState({ emo: sd[0], title: sd[1], lead: sd[2], body: sd[3], extra: '' }); lab.setFacts([]);
    lab.setReadout(S.sec === 'a' ? `${Math.round(S.army * 108)}` : `${Math.round(S.silt * 100)} %`, S.sec === 'a' ? t.armyPill(Math.round(S.army * 108)) : t.siltPill, '', '#c98a1b');

}
function syncQin() {
  const t = T[lang], yr = S.mp >= 0.5 ? 1 : 0;

  S.lastYr = yr;
  lab.setReadout(yr ? t.yr1 : t.yr0, yr ? t.k1 : t.k7, '', '#c84b3c');
  const box = $('cnQinCtl'); box.classList.toggle('cn-after', yr === 1);
  const y0 = $('cnY0'), y1 = $('cnY1'); if (y0) { y0.classList.toggle('on', yr === 0); y1.classList.toggle('on', yr === 1); y1.classList.toggle('cn-pulse', S.pick.qin !== RIGHT.qin && S.mpTgt === 0); }
}
let lastWt = -1;
function syncWall() {
  const t = T[lang];
  if (lastWt === S.wt && S.lastYr === 9) return;
  lastWt = S.wt; S.lastYr = 9;
  const y = S.wt >= 0.999 ? 1644 : YEAR(S.wt);
  lab.setReadout(y < 0 ? t.yBC(-y) : t.yAD(y), S.wt >= 0.8548 ? t.ming : S.wt > 0.02 ? t.early : '', S.orbit === 'low' ? t.orbLowP : S.orbit === 'moon' ? t.orbMoonP : '', '#c25a3f');
}
function syncIdeas() {

  else lab.setReadout(t.stepOf(S.step[S.demo] + 1, n), (S.demo === 'paper' ? t.pSteps : t.prSteps)[S.step[S.demo]], fin ? dates[S.demo] : '', S.demo === 'paper' ? '#b08a52' : '#7a5230');

// --- events -----------------------------------------------------------------------------------------------------
function answer(v, i) {

}
$('ctrlBody').addEventListener('click', (ev) => {

  } else if (a === 'rreset') { S.rank = []; sfx.click(); }
  else if (a === 'demo') { S.demo = b.dataset.k; S.stepT = now(); sfx.click(); }
  else if (a === 'next') { const n = stepOfDemo(); S.step[S.demo] = S.step[S.demo] < n - 1 ? S.step[S.demo] + 1 : 0; S.stepT = now(); sfx.snap(); }
  else if (a === 'rub') { if (S.rubs < 4) { S.rubs++; S.rubT = now(); sfx.snap(); } }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.secT = now(); sfx.click(); showStage();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, val = +ev.target.value;
  if (id === 'cnMp') { if (S.pick.qin === null) return; S.drag = true; S.mp = S.mpTgt = val / 1000; }
  else if (id === 'cnYear') { S.wt = val / 1000; }
  else if (id === 'cnBowl') { S.bowl = (val * Math.PI) / 180; }
  else if (id === 'cnSecRange') { if (S.sec === 'a') S.army = val / 1000; else S.silt = val / 1000; if (S.sec === 'a') S.secT = Math.min(S.secT, now() - 3); render(); }
});
const endDrag = () => { S.drag = false; };
addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (S.sec === 'a') { drawArmy(c, w, h, dt, time); return; }
  if (S.sec === 'b') { drawSilt(c, w, h, dt, time); return; }
  if (v === 'qin') {
    if (S.mp !== S.mpTgt && !S.drag) S.mp = S.mpTgt > S.mp ? Math.min(S.mpTgt, S.mp + dt / 2.4) : Math.max(S.mpTgt, S.mp - dt / 2.4);
    drawQin(c, w, h, dt, time); syncQin();
    const sl = $('cnMp'); if (sl && !S.drag) sl.value = Math.round(S.mp * 1000);
  } else if (v === 'wall') { if (S.orbit) drawSpace(c, w, h, dt, time); else drawWall(c, w, h, dt, time); syncWall(); }
  else drawIdeas(c, w, h, dt, time);
});
render();
