// --- the wind model: ONE table for directions (u = east, p = toward the pole; both hemispheres) -----------------
const RAD = Math.PI / 180, TAU = Math.PI * 2, rnd = Math.random;
const sst = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const WARM = [255, 138, 64], COLD = [118, 196, 255];
const BELT = { trade: { u: -1, p: -0.55, c: [255, 176, 70] }, west: { u: 1, p: 0.5, c: [88, 214, 182] }, polar: { u: -0.8, p: -0.5, c: [150, 204, 255] } };
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function weights(a) { const bt = 1 - sst(26, 34, a), bp = sst(56, 64, a); return { bt, bw: Math.max(0, 1 - bt - bp), bp }; }
// surface wind at a latitude: east and north components, weaker near the equator and near 30° (calm belts)
function windVec(lat) {
  const a = Math.abs(lat), h = lat < 0 ? -1 : 1, { bt, bw, bp } = weights(a);
  const calm = (1 - 0.9 * Math.exp(-((a / 4.5) ** 2))) * (1 - 0.65 * Math.exp(-(((a - 30) / 4.5) ** 2)));
  return { u: (BELT.trade.u * bt + BELT.west.u * bw + BELT.polar.u * bp) * calm, v: h * (BELT.trade.p * bt + BELT.west.p * bw + BELT.polar.p * bp) * calm, calm };
}
function beltColor(lat) { const { bt, bw, bp } = weights(Math.abs(lat)); return [0, 1, 2].map((i) => BELT.trade.c[i] * bt + BELT.west.c[i] * bw + BELT.polar.c[i] * bp); }
function beltOf(a) { return a < 4 ? 'doldrums' : a < 27 ? 'trade' : a < 33 ? 'horse' : a < 60 ? 'west' : 'polar'; }
// the compass point the wind comes FROM, taken from the same table
function fromIdx(belt, lat) { const b = BELT[belt], u = b.u, v = (lat < 0 ? -1 : 1) * b.p; return Math.round((((Math.atan2(-u, -v) / RAD) + 360) % 360) / 45) % 8; }

// --- coastlines: Natural Earth rings from labs/poles/geo.js ---------------------------------------------------
function decode(s, k) {
  const out = []; let i = 0, x = 0, y = 0;
  const one = () => { let r = 0, sh = 0, b; do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32); return r & 1 ? ~(r >> 1) : r >> 1; };
  while (i < s.length) { x += one(); y += one(); out.push(x / k, y / k); }
  return out;
}
const RINGS = GLOBE.map((s) => decode(s, 10));
const MLON0 = -125, MLON = 190, MLAT0 = 80, MLAT = 140; // the map shows lon -125…65, lat 80…-60
const MAPP = new Path2D(), DISCP = new Path2D();
for (const a of RINGS) {
  let maxLat = -99, box = false;
  for (let i = 0; i < a.length; i += 2) { maxLat = Math.max(maxLat, a[i + 1]); if (a[i] > -135 && a[i] < 75 && a[i + 1] > -62 && a[i + 1] < 88) box = true; }
  if (box && maxLat > -58) {
    let pl = null;
    for (let i = 0; i < a.length; i += 2) {
      const x = (a[i] - MLON0) / MLON, y = (MLAT0 - a[i + 1]) / MLAT;
      if (i === 0 || Math.abs(a[i] - pl) > 180) MAPP.moveTo(x, y); else MAPP.lineTo(x, y);
      pl = a[i];
    }
    MAPP.closePath();
  }
  if (maxLat > -10) { // seen from above the North Pole: distance from the centre = colatitude, east is anticlockwise
    for (let i = 0; i < a.length; i += 2) {
      const lon = a[i] * RAD, r = Math.min(1.7, (90 - a[i + 1]) / 90), x = -r * Math.sin(lon), y = -r * Math.cos(lon);
      if (i === 0) DISCP.moveTo(x, y); else DISCP.lineTo(x, y);
    }
    DISCP.closePath();
  }
}

function renderSpin(t) {
  const P = t.P, asked = S.guess2 !== null;
  $('ask2').hidden = asked; $('c2').hidden = !asked;
  $('q2').textContent = P.q;
  $('o2').innerHTML = P.opts.map((o, i) => `<button class="wb-opt" data-q="2" data-g="${i}">${esc(o)}</button>`).join('');
  $('spinSeg').innerHTML = [[1, P.spinOn], [0, P.spinOff]].map(([m, l]) => `<button data-act="spin" data-v="${m}" class="${!!m === S.spin ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('rollB').textContent = P.again;
  lab.setGlow('rgba(88, 214, 182, .22)');
  if (!asked) {
    lab.setReadout('?', '', '', '#58d6b6');
    lab.setState({ emo: '🤔', title: P.askTitle, lead: P.askLead, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  lab.setReadout(S.spin ? '3' : '1', P.sub, S.spin ? P.pillOn : P.pillOff, '#58d6b6');
  const st = S.spin ? P.on(S.guess2 === 1 ? P.right : P.wrong) : P.off;
  lab.setState({ emo: S.spin ? '🌀' : '➡️', title: st.title, lead: st.lead, body: st.body, extra: `<div class="fine">${esc(P.note)}</div>` });
  lab.setFacts(S.spin ? [P.f1, P.f2] : [P.f1]);
}
function readPick(t, p) {
  const W = t.W, lat = Math.round(p.lat), a = Math.abs(p.lat), belt = beltOf(a), n = Math.abs(lat), ls = n === 0 ? '0°' : W.lat(n, p.lat < 0);
  const calm = belt === 'doldrums' || belt === 'horse';
  const lead = calm ? W.calmWind : W.from(W.dirs[fromIdx(belt, p.lat)]);
  const wet = S.guess3 === null ? W.wet.lock : a < 8 ? W.wet.rain : a >= 20 && a <= 38 ? W.wet.dry : a >= 46 && a <= 66 ? W.wet.storm : a >= 70 ? W.wet.polar : W.wet.mid;
  const name = p.pin ? `${W.pins[p.pin]} · ${W.belts[belt]}` : W.belts[belt];
  return { name, ls, lead, wet, calm, belt, nm: W.nm[belt], pill: calm ? W.calmPill : W.dirs[fromIdx(belt, p.lat)] };
}
function renderWorld(t) {
  const W = t.W, open = S.guess2 !== null;
  $('gate3').hidden = open; $('main3').hidden = !open;
  lab.setGlow('rgba(80, 190, 255, .22)');
  if (!open) {
    $('gateB').textContent = W.gateBtn;
    lab.setReadout('?', '', '', '#4ea8ff');
    lab.setState({ emo: '🔒', title: W.gateTitle, lead: W.gateLead, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  const sec = S.sec, ud = secret.unlocked();
  $('ask3').hidden = !(S.guess3 === null && !sec);
  $('q3').textContent = W.q;
  $('o3').innerHTML = W.opts.map((o, i) => `<button class="wb-opt" data-q="3" data-g="${i}">${esc(o)}</button>`).join('');
  $('pinRow').hidden = !!sec || S.guess3 === null;
  $('pinRow').innerHTML = ['sahara', 'amazon', 'uk'].map((id) => `<button class="chip" data-act="pin" data-id="${id}">📍 ${esc(W.pins[id])}</button>`).join('');
  $('secDol').hidden = sec !== 'dol'; $('secSink').hidden = sec !== 'sink';
  const sc = (k, emo) => `<button class="chip secret ${ud ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${ud ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('dol', '⛵') + sc('sink', '🚿');
  if (sec === 'dol') return renderDol(t);
  if (sec === 'sink') return renderSink(t);
  if (S.pick) {
    const r = readPick(t, S.pick), b = r.belt === 'doldrums' || r.belt === 'horse' ? BELT.trade.c : BELT[r.belt].c;
    lab.setReadout(esc(t.W.belts[r.belt]), r.ls, r.pill, rgba(b));
    lab.setState({ emo: '🗺️', title: `${r.name} · ${r.ls}`, lead: r.lead, body: r.wet, extra: `${r.nm ? `<p class="fine"><b>${esc(r.nm)}</b></p>` : ''}<div class="fine">${esc(W.general)}</div>` });
  } else if (S.guess3 !== null) {
    lab.setReadout('?', W.tapSub, '', '#4ea8ff');
    lab.setState({ emo: S.ok3 ? '✅' : '🤔', title: W.verdict(S.ok3 ? W.right ?? t.P.right : t.P.wrong), lead: W.vLead, body: W.vBody, extra: `<div class="fine">${esc(W.general)}</div>` });
  } else {
    lab.setReadout('?', W.tapSub, '', '#4ea8ff');
    lab.setState({ emo: '🗺️', title: W.tap, lead: W.tapLead, body: '', extra: `<div class="fine">${esc(W.general)}</div>` });
  }
  lab.setFacts(S.guess3 === null ? [W.f1, W.f2] : [W.f3, W.f4, W.f5]);
}
function renderDol(t) {
  const D = t.D, lat = S.dolLat, a = Math.abs(lat), wv = windVec(lat), sp = Math.abs(wv.u), n = (S.dolFound.eq ? 1 : 0) + (S.dolFound.hl ? 1 : 0);
  $('dTask').textContent = D.task; [0, 1, 2].forEach((i) => { $(`dE${i}`).textContent = D.ends[i]; });
  const sl = $('dolLat'); if (+sl.value !== lat) sl.value = lat; sl.setAttribute('aria-label', D.cap);
  const st = sp < 0.45 ? (a < 15 ? D.eq : D.hl) : wv.u < 0 ? D.e : D.w;
  lab.setReadout(sp < 0.45 ? D.calm : D.steady, a === 0 ? '0°' : t.W.lat(a, lat < 0), D.pill(n), '#ffd27a');
  lab.setState({ emo: sp < 0.45 ? '😴' : '⛵', title: st.title, lead: st.lead, body: st.body, extra: '' });
  lab.setFacts(D.facts.slice(0, S.guess3 === null ? 1 : 2));
}
function renderSink(t) {
  const K = t.K, sk = S.sk, ph = sk.phase;
  $('kTask').textContent = K.task;
  $('kStir').innerHTML = ['cw', 'ccw', 'none'].map((k) => `<button class="chip ${sk.stir === k ? 'on' : ''}" data-act="stir" data-v="${k}"${ph !== 'idle' ? ' disabled' : ''}>${esc(K[k])}</button>`).join('');
  $('kHemi').innerHTML = [0, 1].map((i) => `<button class="chip ${sk.hemi === i ? 'on' : ''}" data-act="hemi" data-v="${i}">${i ? '🌏' : '🌍'} ${esc(K.hemi[i])}</button>`).join('');
  $('kPlug').textContent = ph === 'idle' ? K.plug : K.fill; $('kPlug').disabled = ph === 'drain';
  lab.setReadout(sk.result === null ? '?' : sk.result === 0 ? '↻' : '↺', K.sub, K.hemi[sk.hemi], '#7fb8e8');
  if (ph === 'done') lab.setState({ emo: '🚿', title: K.res(K.dirs[sk.result]), lead: sk.stir === 'none' ? K.leadNone : K.leadStir, body: K.body, extra: '' });
  else lab.setState({ emo: '🚿', title: K.title, lead: K.lead, body: '', extra: '' });
  lab.setFacts(ph === 'done' ? K.facts : []);
}
render();
</script>
