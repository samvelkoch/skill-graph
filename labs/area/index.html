const rectArea = (w, l) => w * l;
const rectPerim = (w, l) => 2 * (w + l);
const circleR = (P) => P / (2 * Math.PI);                 // circumference P = 2πr
const circleArea = (P) => P * P / (4 * Math.PI);          // πr² with r = P / 2π
const wallArea = (P, d) => d * (P - 2 * d);               // fence on three sides: d + (P − 2d) + d = P
const halfCircleArea = (P) => P * P / (2 * Math.PI);      // a half-circle against the wall: arc πr = P
const pairsOf = (A) => { const out = []; for (let r = 1; r * r <= A; r++) if (A % r === 0) out.push([r, A / r]); return out; };
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
// perimeter of a set of grid squares: every side of a filled square that touches an empty square (or the outside)
// needs fence, including the sides around a hole
function polyPerim(g, C, R) {
  let p = 0;
  for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) {
    if (!g[y * C + x]) continue;
    for (const [dx, dy] of DIRS) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= C || ny >= R || !g[ny * C + nx]) p++; }
  }
  return p;
}
function neighbours(g, C, R, x, y) {
  let n = 0;
  for (const [dx, dy] of DIRS) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < C && ny < R && g[ny * C + nx]) n++; }
  return n;
}
// GEO-END

const maxK = () => S.P / 2 - 1; // widest rectangle side, and the deepest wall pen
function setK(k, animate) {
  k = clamp(Math.round(k), 1, maxK());
  const cur = S.mode === 'wall' ? S.d : S.w;
  if (k === cur) return;
  if (S.mode === 'wall') S.d = k; else S.w = k;
  S.fillAt = animate ? now() : -1e9;

}

$('fenceChips').addEventListener('click', (ev) => {

  const k = b.dataset.k;

    if (!secret.unlocked()) return secret.open();
    S.mode = S.mode === k ? 'rect' : k;
    if (S.mode === 'wall') S.d = clamp(S.d, 1, maxK());
  } else {
    const P = +k; if (P === S.P) return;
    const old = S.P; S.P = P;
    S.w = clamp(Math.round(S.w * P / old), 1, maxK()); S.d = clamp(Math.round(S.d * P / old), 1, maxK());
  }
  S.fillAt = now(); sfx.click(); render();
});

      : `<div class="verdict" style="color:${S.answer === 'square' ? 'var(--ok)' : 'var(--wip)'}">${esc(a.v[S.answer])}</div>
         <p>${esc(a.t[S.answer])}</p><div class="opts"><button>${esc(a.go)} →</button></div>`;

function renderPen(t, unitLine, asking) {
  lab.setGlow('rgba(61, 220, 151, .22)');
  if (asking) {
    // nothing here may give the answer away before the guess
    if (S.answer === null) {
      lab.setReadout(`? ${t.m2}`, t.both, '', '#3ddc97');
      lab.setState({ emo: '🤔', title: t.askState.title, lead: t.askState.lead, body: t.askState.body, extra: unitLine });
    } else {
      lab.setReadout(esc(t.vs(20, 36)), t.both, '', '#3ddc97');
      lab.setState({ emo: '🐇', title: t.revealTitle, lead: t.revealLead, body: t.revealBody, extra: `<div class="rule">🐇 ${esc(t.rule)}</div>${unitLine}` });
    }
    return;
  }
  const P = S.P, N = P / 2;
  const ruleLine = `<div class="rule">🐇 ${esc(t.rule)}</div>`;
  if (S.mode === 'circle') {
    const A = circleArea(P), r = circleR(P), sq = (P / 4) ** 2;
    lab.setReadout(`≈ ${nf(A, 1)} ${t.m2}`, t.circleSub(P), `🐇 × ${Math.floor(A / RABBIT)}`, '#f5c84c');
    lab.setState({ emo: '🌕', title: t.circleTitle, lead: t.circleLead(P, nf(A, 1)), body: t.circleBody(P, nf(r, 2), nf(A, 1), sq),
      extra: `${ruleLine}${unitLine}<div class="fine">${esc(t.circleFine)}</div>` });
    return;
  }
  if (S.mode === 'wall') {
    const d = S.d, l = P - 2 * d, A = wallArea(P, d);
    lab.setReadout(`${A} ${t.m2}`, t.wallSub(d, l, P), `🐇 × ${Math.floor(A / RABBIT)}`, '#f5c84c');
    lab.setState({ emo: '🧱', title: t.wallTitle, lead: t.wallLead(d, l, A), body: t.wallBody(P, d, l, wallArea(P, P / 4), nf(halfCircleArea(P), 1)),
      extra: `${ruleLine}${unitLine}<div class="fine">${esc(t.fine)}</div>` });
    return;
  }
  const w = S.w, l = N - w, A = rectArea(w, l);
  const shape = w === l ? 'square' : Math.min(w, l) <= 2 ? 'thin' : Math.abs(w - l) <= 2 ? 'near' : 'rect';
  lab.setReadout(`${A} ${t.m2}`, t.penSub(w, l, rectPerim(w, l)), `🐇 × ${Math.floor(A / RABBIT)}`, '#3ddc97');
  lab.setState({ emo: shape === 'square' ? '🟩' : shape === 'thin' ? '📏' : '▭', title: t.shapes[shape], lead: t.penLead(w, l, A),
    body: t.penBody(w, l, P, rectArea(1, N - 1), rectArea(N / 2, N / 2)) + (shape === 'square' ? t.penSquare : ''),
    extra: `${ruleLine}${unitLine}<div class="fine">${esc(t.fine)}</div>` });
}

function renderTiles(t, unitLine) {
  const list = pairsOf(S.A), [r, c] = list[S.pair], P = rectPerim(r, c);
  lab.setGlow('rgba(255, 138, 61, .22)');
  lab.setReadout(`${S.A} ${t.m2}`, t.rowsOf(r, c), `${t.fence} ${P} ${t.m}`, '#ff8a3d');
  const ls = list.map(([a, b]) => `${a} × ${b} → ${rectPerim(a, b)} ${t.m}`).join(', ');
  lab.setState({ emo: '🧱', title: `${r} × ${c} = ${S.A}`, lead: t.tilesLead(r, c, S.A), body: t.tilesBody(r, c, S.A, P),
    extra: `${esc(t.tilesExtra(S.A, ls))}${unitLine}` });
}

function renderDraw(t, unitLine) {
  const A = S.cells.reduce((s, x) => s + x, 0), P = polyPerim(S.cells, DC, DR), L = S.last;
  lab.setGlow('rgba(78, 168, 255, .22)');
  lab.setReadout(`${A} ${t.m2}`, `${t.fence} ${P} ${t.m}`, L ? t.deltaPill(L.d) : '', L && L.d <= 0 && L.add ? '#3ddc97' : '#4ea8ff');
  let body = t.drawIdle;
  if (L) {
    body = L.add ? t.addMsg(L.n, L.d) : t.remMsg(L.n, L.d);
    if (L.add && L.d === 0) body += t.wow.same;
    if (L.add && L.d < 0) body += t.wow.less;
    if (!L.add && L.d > 0) body += t.wow.more;
    if (!L.add && L.d === 0) body += t.wow.still;
  }
  lab.setState({ emo: '✏️', title: t.drawTitle, lead: t.drawLead(A, P), body, extra: `${esc(t.holeNote)}${unitLine}` });
}

const C = { grass: '#2e9a5d', grass2: '#36ad69', fence: '#d39a5c', post: '#f0c58a', mut: '#98A0B8', faint: '#646C84', grid: 'rgba(130,145,190,.16)', soil: 'rgba(130,145,190,.06)' };
const EMOJI = (px) => `${px}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
const font = (wt, px) => `${wt} ${px}px Nunito, sans-serif`;
let geo = {};

function gardenGrid(c, ox, oy, cols, rows, cell) {
  c.fillStyle = C.soil; c.fillRect(ox, oy, cols * cell, rows * cell);
  c.strokeStyle = C.grid; c.lineWidth = 1; c.beginPath();
  for (let i = 0; i <= cols; i++) { c.moveTo(ox + i * cell, oy); c.lineTo(ox + i * cell, oy + rows * cell); }
  for (let j = 0; j <= rows; j++) { c.moveTo(ox, oy + j * cell); c.lineTo(ox + cols * cell, oy + j * cell); }
  c.stroke();
}
// a rectangle of grass tiles, the first `shown` of them in reading order
function tiles(c, ox, oy, cols, rows, cell, shown, numbers) {
  for (let k = 0; k < Math.min(shown, cols * rows); k++) {
    const x = k % cols, y = Math.floor(k / cols);
    c.fillStyle = (x + y) % 2 ? C.grass2 : C.grass; c.fillRect(ox + x * cell, oy + y * cell, cell, cell);
    c.strokeStyle = 'rgba(8,30,16,.55)'; c.lineWidth = 1; c.strokeRect(ox + x * cell + 0.5, oy + y * cell + 0.5, cell - 1, cell - 1);
    if (numbers && cell >= 18) {
      c.fillStyle = 'rgba(255,255,255,.88)'; c.font = font(800, clamp(cell * 0.36, 9, 15)); c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(String(k + 1), ox + (x + 0.5) * cell, oy + (y + 0.5) * cell + 1);
    }
  }
}
// a fence along a polyline (in pixels) with a post at every metre
function fence(c, pts, cell, closed) {
  const lw = clamp(cell * 0.16, 2.5, 5);
  c.strokeStyle = C.fence; c.lineWidth = lw; c.lineJoin = 'round'; c.lineCap = 'round';
  c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); if (closed) c.closePath(); c.stroke();
  c.fillStyle = C.post; const ps = lw * 1.5;
  const segs = closed ? [...pts, pts[0]] : pts;
  for (let i = 0; i + 1 < segs.length; i++) {
    const [x0, y0] = segs[i], [x1, y1] = segs[i + 1], n = Math.round(Math.hypot(x1 - x0, y1 - y0) / cell);
    for (let k = 0; k <= n; k++) c.fillRect(x0 + (x1 - x0) * k / n - ps / 2, y0 + (y1 - y0) * k / n - ps / 2, ps, ps);
  }
}
// a walker that runs along the fence once and counts the metres
function walker(c, pts, cell, s, closed) {
  const segs = closed ? [...pts, pts[0]] : pts;
  let left = s * cell;
  for (let i = 0; i + 1 < segs.length; i++) {
    const [x0, y0] = segs[i], [x1, y1] = segs[i + 1], L = Math.hypot(x1 - x0, y1 - y0);
    if (left <= L || i + 2 === segs.length) {
      const f = L ? clamp(left / L, 0, 1) : 0, x = x0 + (x1 - x0) * f, y = y0 + (y1 - y0) * f;
      dot(c, x, y, Math.floor(s));
      return;
    }
    left -= L;
  }
}
function dot(c, x, y, n) {
  c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, 6, 0, 7); c.fill();
  c.fillStyle = '#0A0C14'; c.font = font(900, 12); c.textAlign = 'center'; c.textBaseline = 'middle';
  const s = `${n} ${T[lang].m}`, tw = c.measureText(s).width + 10;
  c.fillStyle = 'rgba(10,12,20,.85)'; c.fillRect(x + 9, y - 20, tw, 18);
  c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText(s, x + 14, y - 11);
}
function label(c, s, x, y, align = 'center', color = '#EDEFF7', px = 12) {
  c.fillStyle = color; c.font = font(900, px); c.textAlign = align; c.textBaseline = 'middle'; c.fillText(s, x, y);
}
function rabbits(c, x, y, bw, bh, n, cell, time) {
  if (n <= 0) return;
  let cols = clamp(Math.round(Math.sqrt(n * bw / bh)), 1, n);
  const rows = Math.ceil(n / cols); cols = Math.ceil(n / rows);
  const px = clamp(Math.min(bw / cols, bh / rows) * 0.62, 10, 34);
  c.font = EMOJI(px); c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const cx = x + ((i % cols) + 0.5) * bw / cols, cy = y + (Math.floor(i / cols) + 0.5) * bh / rows;
    const hop = Math.abs(Math.sin(time * 3 + i * 1.7)) * Math.min(px * 0.3, bh / rows * 0.2);
    c.fillText('🐇', cx + Math.sin(time * 0.7 + i) * px * 0.08, cy - hop);
  }
}

function penLayout(w, h) {
  const pad = 10, wide = w > h * 1.25;
  return wide
    ? { g: { x: pad, y: 30, w: w * 0.6 - pad, h: h - 30 - pad }, ch: { x: w * 0.6 + 44, y: h * 0.22, w: w * 0.4 - 44 - pad * 2, h: h * 0.56 } }
    : { g: { x: pad, y: 28, w: w - 2 * pad, h: h * 0.64 - 28 }, ch: { x: pad + 34, y: h * 0.64 + 30, w: w - 2 * pad - 40, h: h * 0.36 - 66 } };
}

function drawPen(c, w, h, time) {
  if (!S.asked) return drawCompare(c, w, h, time);
  const t = T[lang], P = S.P, N = P / 2, wall = S.mode === 'wall', circ = S.mode === 'circle';
  const { g, ch } = penLayout(w, h);
  const GC = wall ? P - 2 : 14, GR = wall ? N - 1 : 14, padL = 36, padT = wall ? 30 : 18, padB = wall ? 22 : 18;
  const cell = Math.max(4, Math.min((g.w - padL - 6) / GC, (g.h - padT - padB) / GR));
  const ox = g.x + padL + (g.w - padL - 6 - GC * cell) / 2, oy = g.y + padT;
  gardenGrid(c, ox, oy, GC, GR, cell);
  const prog = clamp((time - S.fillAt) / 1.0, 0, 1), walk = clamp((time - S.fillAt) / 1.8, 0, 1);
  geo = { ox, oy, cell, ch, N };

  if (circ) {
    const r = circleR(P) * cell, cx = ox + GC * cell / 2, cy = oy + GR * cell / 2;
    c.save(); c.beginPath(); c.arc(cx, cy, r * Math.min(1, prog * 1.2), 0, 7); c.clip();
    for (let y = 0; y < GR; y++) for (let x = 0; x < GC; x++) { c.fillStyle = (x + y) % 2 ? C.grass2 : C.grass; c.fillRect(ox + x * cell, oy + y * cell, cell, cell); }
    c.strokeStyle = 'rgba(8,30,16,.55)'; c.lineWidth = 1; c.beginPath();
    for (let i = 0; i <= GC; i++) { c.moveTo(ox + i * cell, oy); c.lineTo(ox + i * cell, oy + GR * cell); }
    for (let j = 0; j <= GR; j++) { c.moveTo(ox, oy + j * cell); c.lineTo(ox + GC * cell, oy + j * cell); }
    c.stroke(); c.restore();
    const lw = clamp(cell * 0.16, 2.5, 5);
    c.strokeStyle = C.fence; c.lineWidth = lw; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.stroke();
    c.fillStyle = C.post;
    for (let k = 0; k < P; k++) { const a = k / P * 2 * Math.PI; c.fillRect(cx + Math.cos(a) * r - lw * 0.75, cy + Math.sin(a) * r - lw * 0.75, lw * 1.5, lw * 1.5); }
    // radius
    c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.5; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + r, cy); c.stroke(); c.setLineDash([]);
    label(c, `r ≈ ${nf(circleR(P), 2)} ${t.m}`, cx + r / 2, cy - 10, 'center', '#fff', 11);
    if (prog >= 1) rabbits(c, cx - r * 0.66, cy - r * 0.62, r * 1.32, r * 1.3, Math.floor(circleArea(P) / RABBIT), cell, time);
    if (walk < 1) { const a = walk * 2 * Math.PI; dot(c, cx + Math.cos(a) * r, cy + Math.sin(a) * r, Math.floor(walk * P)); }
    // chart: the rectangles for this fence, and the circle as a line above them
    drawChart(c, ch, Array.from({ length: N - 1 }, (_, i) => ({ k: i + 1, v: rectArea(i + 1, N - i - 1) })), null, circleArea(P), t.chart.x, t.chart.y);
    return;
  }

  const pw = wall ? P - 2 * S.d : S.w, pl = wall ? S.d : N - S.w, A = pw * pl;
  if (wall) {
    // a brick wall along the top of the garden
    const wy = oy - 14;
    c.fillStyle = '#8a4b3a'; c.fillRect(ox - 4, wy, GC * cell + 8, 12);
    c.strokeStyle = 'rgba(30,10,6,.6)'; c.lineWidth = 1; c.beginPath();
    for (let x = ox - 4; x < ox + GC * cell + 4; x += 16) { c.moveTo(x, wy); c.lineTo(x, wy + 6); c.moveTo(x + 8, wy + 6); c.lineTo(x + 8, wy + 12); }
    c.moveTo(ox - 4, wy + 6); c.lineTo(ox + GC * cell + 4, wy + 6); c.stroke();
    label(c, t.wall.toUpperCase(), ox + GC * cell - 4, wy - 8, 'right', '#c98a73', 10.5);
  }
  tiles(c, ox, oy, pw, pl, cell, Math.floor(prog * A), false);
  // every corner on this line uses all of the fence
  c.fillStyle = 'rgba(255,255,255,.35)';
  for (let k = 1; k <= N - 1; k++) { const [x, y] = wall ? [P - 2 * k, k] : [k, N - k]; c.beginPath(); c.arc(ox + x * cell, oy + y * cell, 2.2, 0, 7); c.fill(); }
  { const [x, y] = wall ? [P - 2 * (N - 1), N - 1] : [1, N - 1]; label(c, t.fenceOf(P), ox + x * cell + 10, oy + y * cell + 12, 'left', C.mut, 11); }
  const X = (x) => ox + x * cell, Y = (y) => oy + y * cell;
  const path = wall ? [[X(0), Y(0)], [X(0), Y(pl)], [X(pw), Y(pl)], [X(pw), Y(0)]] : [[X(0), Y(0)], [X(pw), Y(0)], [X(pw), Y(pl)], [X(0), Y(pl)]];
  fence(c, path, cell, !wall);
  // side lengths
  label(c, `${pw} ${t.m}`, X(pw / 2), wall ? Y(pl) + 13 : Y(0) - 10, 'center', C.post);
  label(c, `${pl} ${t.m}`, X(0) - 7, Y(pl / 2), 'right', C.post);
  if (prog >= 1) rabbits(c, X(0), Y(0), pw * cell, pl * cell, Math.floor(A / RABBIT), cell, time);
  if (walk < 1) walker(c, path, cell, walk * P, !wall);
  // the corner handle
  const hx = X(pw), hy = Y(pl), hr = clamp(cell * 0.45, 9, 14);
  if (!S.dragged) { const p = (time * 1.2) % 1; c.strokeStyle = `rgba(255,255,255,${0.6 * (1 - p)})`; c.lineWidth = 2; c.beginPath(); c.arc(hx, hy, hr + p * 16, 0, 7); c.stroke(); }
  c.fillStyle = '#fff'; c.beginPath(); c.arc(hx, hy, hr, 0, 7); c.fill();
  c.fillStyle = '#3ddc97'; c.beginPath(); c.arc(hx, hy, hr * 0.4, 0, 7); c.fill();
  // chart: area for every shape this fence can make
  const bars = Array.from({ length: N - 1 }, (_, i) => ({ k: i + 1, v: wall ? wallArea(P, i + 1) : rectArea(i + 1, N - i - 1) }));
  drawChart(c, ch, bars, wall ? S.d : S.w, null, wall ? t.chart.xWall : t.chart.x, t.chart.y);
}

function drawChart(c, box, bars, cur, line, xLab, yLab) {
  const n = bars.length, vmax = Math.max(...bars.map((b) => b.v), line ?? 0), bw = box.w / n;
  geo.chart = { ...box, n };
  label(c, yLab, box.x - 30, box.y - 14, 'left', C.mut, 11);
  c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(box.x, box.y + box.h + 0.5); c.lineTo(box.x + box.w, box.y + box.h + 0.5); c.stroke();
  const best = Math.max(...bars.map((b) => b.v));
  bars.forEach((b, i) => {
    const bh = b.v / vmax * box.h, x = box.x + i * bw + bw * 0.14, y = box.y + box.h - bh, on = b.k === cur;
    c.fillStyle = on ? '#3ddc97' : b.v === best ? 'rgba(61,220,151,.5)' : 'rgba(61,220,151,.26)';
    c.fillRect(x, y, bw * 0.72, bh);
    if (on || (cur === null && b.v === best)) label(c, String(b.v), x + bw * 0.36, y - 9, 'center', '#fff', 12);
    if (bw >= 16 || i % 2 === 0) label(c, String(b.k), x + bw * 0.36, box.y + box.h + 11, 'center', on ? '#fff' : C.faint, 10);
  });
  label(c, xLab, box.x + box.w / 2, box.y + box.h + 26, 'center', C.mut, 11);
  if (line !== null) {
    const y = box.y + box.h - line / vmax * box.h;
    c.strokeStyle = '#f5c84c'; c.lineWidth = 2; c.setLineDash([6, 4]); c.beginPath(); c.moveTo(box.x, y); c.lineTo(box.x + box.w, y); c.stroke(); c.setLineDash([]);
    label(c, `○ ${nf(line, 1)}`, box.x + box.w, y - 9, 'right', '#f5c84c', 12);
  }
}

// the opening question: two pens with the same 24 m of fence, area hidden until the guess
function drawCompare(c, w, h, time) {
  const t = T[lang], top = (askEl.offsetHeight || 120) + 22, pens = [[10, 2], [6, 6]];
  const cell = Math.max(6, Math.min((w - 40 - 40) / 19, (h - top - 56) / 6, 40));
  const total = 19 * cell, x0 = (w - total) / 2 + 20, base = top + 18 + 6 * cell + Math.max(0, (h - top - 56 - 6 * cell) / 2);
  const revealed = S.answer !== null, prog = clamp((time - S.revealAt) / 1.2, 0, 1);
  let x = x0;
  for (const [pw, pl] of pens) {
    const oy = base - pl * cell, A = pw * pl;
    gardenGrid(c, x, oy, pw, pl, cell);
    if (revealed) tiles(c, x, oy, pw, pl, cell, Math.floor(prog * A), true);
    else label(c, '?', x + pw * cell / 2, oy + pl * cell / 2, 'center', 'rgba(255,255,255,.55)', clamp(cell * 1.1, 16, 40));
    fence(c, [[x, oy], [x + pw * cell, oy], [x + pw * cell, base], [x, base]], cell, true);
    label(c, `${pw} ${t.m}`, x + pw * cell / 2, oy - 10, 'center', C.post);
    label(c, `${pl} ${t.m}`, x - 7, oy + pl * cell / 2, 'right', C.post);
    label(c, t.fenceOf(24), x + pw * cell / 2, base + 16, 'center', C.mut, 11.5);
    if (revealed && prog >= 1) {
      label(c, `${A} ${t.m2}`, x + pw * cell / 2, base + 34, 'center', '#3ddc97', 15);
      rabbits(c, x, oy, pw * cell, pl * cell, Math.floor(A / RABBIT), cell, time);
    }
    x += (pw + 3) * cell;
  }
}

function drawTiles(c, w, h, time) {
  const t = T[lang], list = pairsOf(S.A), [r, cn] = list[S.pair], A = S.A, P = rectPerim(r, cn);
  const split = h * 0.6, labL = 38, labR = r > 1 ? 34 : 8;
  const avail = w - labL - labR - 16;
  const cell = Math.max(4, Math.min(avail / cn, (split - 30 - 70) / r, 46));
  const rw = cn * cell, rh = r * cell, ox = labL + 8 + (avail - rw) / 2, oy = 30 + 14 + Math.max(0, (split - 30 - 70 - rh) / 2);
  const step = clamp(1.5 / A, 0.05, 0.12), shown = clamp(Math.floor((time - S.tileAt) / step) + 1, 0, A), done = shown >= A;
  gardenGrid(c, ox, oy, cn, r, cell);
  tiles(c, ox, oy, cn, r, cell, shown, true);
  // running total at the end of each finished row
  for (let y = 0; y < r; y++) if (shown >= (y + 1) * cn && r > 1) label(c, `${(y + 1) * cn}`, ox + rw + 8, oy + (y + 0.5) * cell, 'left', C.mut, 11);
  fence(c, [[ox, oy], [ox + rw, oy], [ox + rw, oy + rh], [ox, oy + rh]], cell, true);
  label(c, `${cn} ${t.m}`, ox + rw / 2, oy - 10, 'center', C.post);
  label(c, `${r} ${t.m}`, ox - 7, oy + rh / 2, 'right', C.post);
  c.fillStyle = '#fff'; c.font = `500 ${clamp(w * 0.045, 20, 30)}px "EB Garamond", serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(done ? `${r} × ${cn} = ${A}` : String(shown), w / 2, oy + rh + 30);
  if (done) label(c, `${cn} + ${r} + ${cn} + ${r} = ${P} ${t.m}`, w / 2, oy + rh + 58, 'center', C.post, 13);
  // how much fence each shape of the same area needs
  const n = list.length, rowH = Math.min(30, (h - split - 34) / n), bx = 74, maxLen = w - bx - 66, maxP = rectPerim(1, A);
  label(c, t.fenceNeeded.toUpperCase(), 10, split + 12, 'left', C.faint, 10.5);
  geo = { bars: { y0: split + 26, rowH, n } };
  list.forEach(([a, b], i) => {
    const y = split + 26 + i * rowH, on = i === S.pair, f = rectPerim(a, b), len = Math.max(4, f / maxP * maxLen);
    label(c, `${a} × ${b}`, 10, y + rowH / 2, 'left', on ? '#fff' : C.mut, 12.5);
    c.fillStyle = on ? C.fence : 'rgba(211,154,92,.3)'; c.fillRect(bx, y + rowH * 0.2, len, rowH * 0.6);
    label(c, `${f} ${t.m}`, bx + len + 8, y + rowH / 2, 'left', on ? '#fff' : C.mut, 12.5);
  });
}

function drawFree(c, w, h, time) {
  const t = T[lang], cell = Math.max(8, Math.min((w - 24) / DC, (h - 40) / DR)), ox = (w - DC * cell) / 2, oy = 30 + (h - 30 - DR * cell) / 2;
  geo = { ox, oy, cell };
  gardenGrid(c, ox, oy, DC, DR, cell);
  const g = S.cells, on = (x, y) => x >= 0 && y >= 0 && x < DC && y < DR && g[y * DC + x];
  for (let y = 0; y < DR; y++) for (let x = 0; x < DC; x++) if (on(x, y)) {
    c.fillStyle = (x + y) % 2 ? C.grass2 : C.grass; c.fillRect(ox + x * cell, oy + y * cell, cell, cell);
    c.strokeStyle = 'rgba(8,30,16,.55)'; c.lineWidth = 1; c.strokeRect(ox + x * cell + 0.5, oy + y * cell + 0.5, cell - 1, cell - 1);
  }
  // the fence: every side where a square meets an empty one
  const lw = clamp(cell * 0.14, 2.5, 5);
  c.strokeStyle = C.fence; c.lineWidth = lw; c.lineCap = 'round'; c.beginPath();
  for (let y = 0; y < DR; y++) for (let x = 0; x < DC; x++) if (on(x, y)) {
    const X = ox + x * cell, Y = oy + y * cell;
    if (!on(x, y - 1)) { c.moveTo(X, Y); c.lineTo(X + cell, Y); }
    if (!on(x, y + 1)) { c.moveTo(X, Y + cell); c.lineTo(X + cell, Y + cell); }
    if (!on(x - 1, y)) { c.moveTo(X, Y); c.lineTo(X, Y + cell); }
    if (!on(x + 1, y)) { c.moveTo(X + cell, Y); c.lineTo(X + cell, Y + cell); }
  }
  c.stroke();
  // the change in fence floats up from the square you just touched
  const L = S.last;
  if (L && time - L.t < 1.8) {
    const a = 1 - (time - L.t) / 1.8, col = L.d < 0 ? '61,220,151' : L.d === 0 ? '245,200,76' : '255,138,61';
    c.globalAlpha = a; label(c, `${sgn(L.d)} ${t.m}`, ox + (L.x + 0.5) * cell, oy + L.y * cell - 8 - (1 - a) * 18, 'center', `rgb(${col})`, 15); c.globalAlpha = 1;
  }
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (lab.view === 'pen') drawPen(c, w, h, time);
  else if (lab.view === 'tiles') drawTiles(c, w, h, time);
  else drawFree(c, w, h, time);
});

// --- pointer: drag the pen corner, tap the chart, tap the fence bars, paint squares --------------------------
let drag = null;
const local = (ev) => { const r = $('cv').getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
function penPoint(x, y, animate) {
  const { ox, oy, cell, N } = geo, gx = (x - ox) / cell, gy = (y - oy) / cell;
  // the corner can only sit on the line where all of the fence is used: snap to the nearest point of it
  setK(S.mode === 'wall' ? (2 * S.P - 2 * gx + gy) / 5 : (gx - gy + N) / 2, animate);
}
function chartHit(x, y) {
  const b = geo.chart; if (!b || x < b.x || x > b.x + b.w || y < b.y - 20 || y > b.y + b.h + 20) return 0;
  return Math.floor((x - b.x) / (b.w / b.n)) + 1;
}
function paint(x, y, val) {
  const i = y * DC + x; if (S.cells[i] === val) return;
  const before = polyPerim(S.cells, DC, DR), n = neighbours(S.cells, DC, DR, x, y);
  S.cells[i] = val;
  const d = polyPerim(S.cells, DC, DR) - before;
  S.last = { d, n, add: !!val, x, y, t: now() };
  (val && d <= 0 ? sfx.snap : sfx.click)(); render();
}
$('cv').addEventListener('pointerdown', (ev) => {
  const [x, y] = local(ev);
  if (lab.view === 'pen') {
    if (!S.asked || S.mode === 'circle' || geo.N === undefined) return;
    const k = chartHit(x, y);
    if (k) { S.dragged = true; return setK(k, true); }
    const { ox, oy, cell } = geo, gx = (x - ox) / cell, gy = (y - oy) / cell;
    if (gx < -1 || gy < -1 || gx > S.P + 1 || gy > S.P / 2 + 1) return;
    drag = { kind: 'pen' }; S.dragged = true; $('cv').setPointerCapture(ev.pointerId); penPoint(x, y, false);
  } else if (lab.view === 'tiles') {
    const b = geo.bars; if (!b) return;
    const i = Math.floor((y - b.y0) / b.rowH);
    if (i >= 0 && i < b.n && i !== S.pair) { S.pair = i; S.tileAt = now(); sfx.click(); render(); }
  } else {
    const { ox, oy, cell } = geo, cx = Math.floor((x - ox) / cell), cy = Math.floor((y - oy) / cell);
    if (!Number.isFinite(cx) || !Number.isFinite(cy) || cx < 0 || cy < 0 || cx >= DC || cy >= DR) return;
    const val = S.cells[cy * DC + cx] ? 0 : 1;
    drag = { kind: 'paint', val, last: cy * DC + cx }; $('cv').setPointerCapture(ev.pointerId);
    paint(cx, cy, val);
  }
});
$('cv').addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const [x, y] = local(ev);
  if (drag.kind === 'pen' && lab.view === 'pen') penPoint(x, y, false);
  else if (drag.kind === 'paint' && lab.view === 'draw') {
    const { ox, oy, cell } = geo, cx = Math.floor((x - ox) / cell), cy = Math.floor((y - oy) / cell);
    if (cx < 0 || cy < 0 || cx >= DC || cy >= DR || cy * DC + cx === drag.last) return;
    drag.last = cy * DC + cx; paint(cx, cy, drag.val);
  }
});
const endDrag = () => { drag = null; };
$('cv').addEventListener('pointerup', endDrag);
$('cv').addEventListener('pointercancel', endDrag);

S.fillAt = now(); S.tileAt = now();
render();
</script>
