  const a = angleOf(ev); let d = a - S.drag.last; d = ((d + 540) % 360) - 180; S.drag.last = a;
  const rec = rr(curId()); rec.raw = clamp(rec.raw + d, 0, 360);
});
const endDrag = () => { S.drag = null; cv.style.cursor = ''; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const id = b.id;
  if (b.dataset.shape) { S.shape = b.dataset.shape; S.sec = null; S.ang = 0; S.auto = null; S.flash = null; S.drag = null; sfx.click(); }
  else if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.sec; S.sec = S.sec === k ? null : k; S.auto = null; S.flash = null; S.ang = 0; S.mirror = false; sfx.click();
    if (S.sec === 'trisk') rr('trisk').raw = 0;
  } else if (b.dataset.n) { rr(S.shape).guess = +b.dataset.n; sfx.click(); showStage(); }
  else if (id === 'tsAuto') return startAuto();
  else if (id === 'tsAgain') { resetShape(curId()); sfx.click(); return; }
  else if (id === 'tsIceTurn') { S.iceTo += 60; sfx.click(); }
  else if (id === 'tsMir') { S.mirror = !S.mirror; S.ang = 0; rr('trisk').raw = 0; sfx.click(); }
  else if (b.dataset.ang) { if (S.aAnim || S.aDone || S.ai >= AN_ORD.length) return; startAnim(+b.dataset.ang); showStage(); return; }
  else if (id === 'tsRule') { S.aRule = true; sfx.click(); }
  else if (id === 'tsNext') {
    if (S.ai >= AN_ORD.length) { S.ai = 0; S.aRule = true; S.aOk = []; } else S.ai++;
    S.aGuess = null; S.aDone = false; S.aAng = 0; S.aFlash = null; sfx.click();
  }
  else if (id === 'tsCheck') {
    if (!S.checked) { S.checked = true; S.lmode = 'turn'; const ok = [...S.marked].every((k) => TURN.has(k)) && S.marked.size === TURN.size; (ok ? sfx.good : sfx.bad)(); showStage(); }
  }
  else if (id === 'tsClear') { S.marked = new Set(); S.checked = false; S.lmode = 'turn'; sfx.click(); }
  render();
});
$('tsGrow').addEventListener('input', () => { S.grow = +$('tsGrow').value / 100; render(); });
$('tsMode').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b || !S.checked) return; S.lmode = b.dataset.m; sfx.tick(); render(); });
$('tsCells').addEventListener('click', (ev) => {
  const b = ev.target.closest('.ts-cell'); if (!b || S.checked) return;
  const k = b.dataset.l; if (S.marked.has(k)) S.marked.delete(k); else S.marked.add(k);
  sfx.tick(); render();
});
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };

// --- render: controls, readout and the state card -------------------------------------------------------------
function updateReadout() {
  const t = T[lang];
  if (lab.view !== 'spin') return;
  if (S.sec === 'ice') { lab.setReadout(S.grow > 0.1 ? 6 : 0, t.ice.rdSub, t.ice.rdPill(((Math.round(S.iceAng) % 360) + 360) % 360), '#8fd0ff'); return; }
  const id = curId(), rec = rr(id), n = ORD[id], deg = Math.round(clamp(S.ang, 0, 360));
  if (id === 'trisk' && S.mirror) { lab.setReadout(0, t.tri.rdMir, t.sp.deg(deg), '#e0a233'); return; }
  if (locked(id)) lab.setReadout('?', t.sp.rdLock, '', '#8a7dff');
  else if (rec.done) lab.setReadout(n, t.sp.rdDone, id === 'trisk' ? t.sp.deg(deg) : t.sp.guess(rec.guess), '#3ddc97');
  else lab.setReadout(rec.nf, t.sp.rdSo, t.sp.deg(deg), '#8a7dff');
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('vSpin').hidden = v !== 'spin'; $('vAngle').hidden = v !== 'angle'; $('vLet').hidden = v !== 'letters';
  $('cv').style.display = v === 'letters' ? 'none' : 'block';
  $('tsGridWrap').hidden = v !== 'letters';
  if (v === 'spin') renderSpin(t); else if (v === 'angle') renderAngle(t); else renderLetters(t);
  lab.checkStage();
}
function renderSpin(t) {
  const id = curId(), rec = rr(id), n = ORD[id], open = secret.unlocked(), ice = S.sec === 'ice', tri = S.sec === 'trisk';
  lab.setGlow(ice ? 'rgba(110, 190, 255, .28)' : tri ? 'rgba(224, 162, 51, .26)' : 'rgba(138, 125, 255, .28)');
  $('tsShapes').innerHTML = SHAPE_IDS.map((k) => `<button type="button" class="chip ts-ch${!S.sec && S.shape === k ? ' on' : ''}" data-shape="${k}">${esc(t.shapes[k])}</button>`).join('');
  $('tsSecs').innerHTML = [['ice', '❄️'], ['tri', '🦵']].map(([k, e]) => {
    const key = k === 'tri' ? 'trisk' : k;
    return `<button type="button" class="chip ts-ch secret ${open ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-sec="${key}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  }).join('');
  const free = ice || tri;
  $('tsGuess').hidden = free;
  $('tsMy').textContent = t.sp.q;
  $('tsNums').innerHTML = [1, 2, 3, 4, 5, 6].map((k) => `<button type="button" class="chip ts-n${rec.guess === k ? ' on' : ''}${rec.done && k === n ? ' ok' : ''}" data-n="${k}"${rec.guess !== null ? ' disabled' : ''}>${k}</button>`).join('');
  $('tsBtns').hidden = ice;
  $('tsAuto').textContent = t.sp.auto; $('tsAuto').disabled = locked(id) || !!S.auto;
  $('tsAgain').textContent = t.sp.again; $('tsAgain').hidden = tri ? false : rec.guess === null;
  $('tsIceCtl').hidden = !ice; $('tsGrowLbl').textContent = t.ice.grow; $('tsIceTurn').textContent = t.ice.turn;
  if (+$('tsGrow').value !== Math.round(S.grow * 100)) $('tsGrow').value = Math.round(S.grow * 100);
  $('tsTriCtl').hidden = !tri; $('tsMir').textContent = t.tri.mir; $('tsMir').classList.toggle('on', S.mirror);
  updateReadout();
  let st;
  if (ice) {
    const g = S.grow > 0.15; st = { emo: '❄️', title: t.ice[g ? 's1' : 's0'][0], lead: t.ice[g ? 's1' : 's0'][1], body: '' };
    lab.setFacts(t.facts.ice);
  } else if (tri) {
    if (S.mirror) st = { emo: '🪞', title: t.tri.s1[0], lead: t.tri.s1[1], body: '' };
    else if (rec.done) { const d = t.tri.sD(n); st = { emo: '✅', title: d[0], lead: d[1], body: '' }; }
    else st = { emo: '🦵', title: t.tri.s0[0], lead: t.tri.s0[1], body: '' };
    lab.setFacts(t.facts.tri);
  } else if (locked(id)) st = { emo: '🤔', title: t.sp.lock[0], lead: t.sp.lock[1], body: '' };
  else if (!rec.done) st = { emo: '🌀', title: t.sp.turnT, lead: t.sp.turnL(rec.guess), body: t.sp.turnB(rec.nf) };
  else {
    const g = rec.guess;
    if (g === n) st = { emo: '✅', title: t.sp.ok, lead: n === 1 ? t.sp.ok1 : t.sp.okL(n), body: t.sp.body };
    else st = { emo: '🤔', title: t.sp.bad(n), lead: g === n + 1 ? t.sp.plus1 : g === 1 && n > 1 ? t.sp.one : t.sp.other(n), body: t.sp.body };
  }
  lab.setState({ ...st, extra: '' });
  if (!free) lab.setFacts(t.facts.spin);
}
function renderAngle(t) {
  const end = S.ai >= AN_ORD.length, n = AN_ORD[Math.min(S.ai, AN_ORD.length - 1)], s = 360 / n, k = rightCount(), rule = ruleOn(), busy = !!S.aAnim;
  lab.setGlow('rgba(255, 190, 90, .26)');
  $('tsAng').innerHTML = AN_CHIPS.map((a) => {
    const cls = S.aGuess === a ? (S.aDone ? (a === s ? ' ok on' : ' no on') : ' on') : (S.aDone && a === s ? ' ok' : '');
    return `<button type="button" class="chip ts-ang${cls}" data-ang="${a}"${busy || S.aDone || end ? ' disabled' : ''}>${a}°</button>`;
  }).join('');
  $('tsAng').hidden = end; $('tsAq').hidden = end; $('tsAq').textContent = t.an.q;
  $('tsRule').hidden = rule || end; $('tsRule').textContent = t.an.showRule;
  $('tsNext').hidden = !(S.aDone || end); $('tsNext').textContent = end ? t.an.again : t.an.next;
  let st = '';
  const ruleBox = rule ? `<div class="ts-rule">${esc(t.an.rule)}<small>${esc(t.an.ruleSub)}</small></div>` : '';
  if (end) {
    lab.setReadout(`${k}/${AN_ORD.length}`, t.an.task(AN_ORD.length, AN_ORD.length), '', '#ffbe5a');
    lab.setState({ emo: '🏆', title: t.an.endT(k, AN_ORD.length), lead: t.an.endL, body: '', extra: ruleBox });
    lab.setFacts(t.facts.angle); return;
  }
  const pillTx = t.an.task(S.ai + 1, AN_ORD.length);
  if (S.aAnim) {
    lab.setReadout(n, t.an.rdPre, pillTx, '#ffbe5a');
    lab.setState({ emo: '🌀', title: t.an.turning(S.aGuess), lead: t.an.turningL, body: '', extra: '' });
  } else if (S.aDone) {
    lab.setReadout(`${s}°`, rule ? t.an.ruleApply(s, n) : t.an.rdPost, pillTx, '#ffbe5a');
    const g = S.aGuess;
    if (g === s) st = { emo: '✅', title: t.an.okT, lead: t.an.okL(s) };
    else if (fitsAt(g)) st = { emo: '🤔', title: t.an.multT(g), lead: t.an.multL(s) };
    else st = { emo: '🤔', title: t.an.noT(g), lead: t.an.noL(s) };
    lab.setState({ ...st, body: rule ? t.an.ruleApply(s, n) : '', extra: ruleBox });
  } else {
    lab.setReadout(n, t.an.rdPre, pillTx, '#ffbe5a');
    lab.setState({ emo: '📐', title: t.an.title, lead: t.an.lead(n), body: rule ? t.an.ruleApply('?', n).replace('?°', '?') : '', extra: ruleBox });
  }
  lab.setFacts(rule ? t.facts.angle : []);
}
function renderLetters(t) {
  const L = t.le, m = S.lmode, ck = S.checked, mk = S.marked;
  lab.setGlow('rgba(95, 168, 160, .26)');
  const hit = [...mk].filter((x) => TURN.has(x)).length, bad = mk.size - hit, miss = TURN.size - hit;
  const onlyTurn = [...TURN].filter((x) => !MIR[x]), both = [...TURN].filter((x) => MIR[x]), mirN = Object.keys(MIR).length;
  [...$('tsCells').children].forEach((b) => {
    const k = b.dataset.l; let d = '';
    if (ck) {
      if (m === 'turn') d = TURN.has(k) ? (mk.has(k) ? 'hit' : 'miss') : mk.has(k) ? 'bad' : '';
      else if (m === 'mirror') d = MIR[k] ? 'mir' : '';
      else d = TURN.has(k) ? (MIR[k] ? 'both' : 'turn') : MIR[k] ? 'mir' : 'none';
    }
    if (d) b.dataset.k = d; else b.removeAttribute('data-k');
    b.classList.toggle('on', !ck && mk.has(k));
    b.classList.toggle('flip', ck && m === 'turn');
    const g = b.querySelector('.ml'), mv = ck && m !== 'turn' ? MIR[k] ?? '' : '';
    g.innerHTML = (mv.includes('v') ? '<line x1="0" y1="-.72" x2="0" y2=".72"/>' : '') + (mv.includes('h') ? '<line x1="-.6" y1="0" x2=".6" y2="0"/>' : '');
  });
  $('tsCheck').hidden = ck; $('tsCheck').textContent = L.check; $('tsCheck').disabled = mk.size === 0;
  $('tsMode').hidden = !ck; $('tsClear').hidden = !ck; $('tsClear').textContent = L.again;
  $('tsMode').innerHTML = Object.entries(L.modes).map(([k, l]) => `<button type="button" data-m="${k}" class="${k === m ? 'on' : ''}">${esc(l)}</button>`).join('');
  const legs = !ck ? [] : m === 'turn' ? [['hit', '#3ddc97'], ...(miss ? [['miss', '#f5c84c']] : []), ...(bad ? [['bad', '#ff6b6b']] : [])]
    : m === 'mirror' ? [['mir', '#6fb6ff']] : [['both', '#3ddc97'], ['turn', '#f5c84c'], ['mir', '#6fb6ff'], ['none', '#646c84']];
  $('tsLeg').innerHTML = legs.map(([k, col]) => `<span><i style="background:${col}"></i>${esc(L.leg[k])}</span>`).join('');
  const turnList = list([...TURN]);
  if (!ck) {
    lab.setReadout(mk.size, L.marked, '', '#5fa8a0');
    lab.setState({ emo: '🔤', title: L.q, lead: L.lead, body: '', extra: '' });
    lab.setFacts(t.facts.letters); return;
  }
  if (m === 'turn') {
    const perfect = bad === 0 && miss === 0;
    lab.setReadout(TURN.size, L.rdTurn, `${hit}/${TURN.size}`, '#3ddc97');
    lab.setState(perfect ? { emo: '✅', title: L.perfect, lead: L.turnLP(TURN.size, turnList), body: '', extra: '' }
      : { emo: '🤔', title: L.found(hit, TURN.size), lead: L.turnL(turnList), body: '', extra: '' });
  } else if (m === 'mirror') {
    lab.setReadout(mirN, L.rdMir, '', '#6fb6ff');
    lab.setState({ emo: '🪞', title: L.mirT(mirN), lead: L.mirL, body: L.mirB, extra: '' });
  } else {
    lab.setReadout(onlyTurn.length, L.rdBoth, '', '#f5c84c');
    lab.setState({ emo: '⚖️', title: L.bothT(list(onlyTurn)), lead: L.bothL(list(both)), body: L.mirB, extra: '' });
  }
  lab.setFacts(t.facts.letters);
}

canvasLoop(cv, (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'spin') {
    stepSpin(dt, time);
    drawSpin(c, w, h, dt, time);
  } else if (v === 'angle') { stepAngle(dt, time); drawAngle(c, w, h, dt, time); }
});
render();
</script>
