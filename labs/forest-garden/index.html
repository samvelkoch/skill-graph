const clamp01 = (x) => Math.min(1, Math.max(0, x));

const sstep = (a, b, x) => ease((x - a) / (b - a));
const rnd = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const perm = (n) => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hexA = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));

function rr(ctx, x, y, w, h, r) {

  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// --- model: a ring of 12 plots around a village ------------------------------------------------------------
// Each year the village clears the nearest plot that has rested at least R years (the one that rested the shortest
// among the ready ones). If none is ready it must take the one that rested longest. A cleared plot is farmed 2 years.
// Soil: +0.08 a year under forest (max 1), -0.3 a year under a field (min 0.05). Harvest: 6 baskets x soil per field.
const NP = 12, NEED = 8;
function simulate(R, cattle) {
  const P = Array.from({ length: NP }, (_, i) => ({ kind: cattle && i >= 4 ? 'pasture' : 'forest', age: 30, left: 0, soil: 1 }));
  const snaps = [{ P: P.map((p) => ({ ...p })), h: 0 }];
  const clear = (left) => {
    const cand = P.map((_, i) => i).filter((i) => P[i].kind === 'forest');
    if (!cand.length) return;
    const ready = cand.filter((i) => P[i].age >= R);
    const i = ready.length ? ready.reduce((b, j) => (P[j].age < P[b].age ? j : b)) : cand.reduce((b, j) => (P[j].age > P[b].age ? j : b));
    P[i].kind = 'field'; P[i].left = left;
  };
  for (let y = 1; y <= 30; y++) {
    for (const p of P) if (p.kind === 'field' && p.left === 0) { p.kind = 'forest'; p.age = 0; }
    if (y === 1) clear(1); // one field is already in its second year
    clear(2);
    let h = 0;
    for (const p of P) if (p.kind === 'field') h += 6 * p.soil;
    for (const p of P) {
      if (p.kind === 'field') { p.soil = Math.max(0.05, p.soil - 0.3); p.left--; }
      else if (p.kind === 'forest') { p.soil = Math.min(1, p.soil + 0.08); p.age = Math.min(30, p.age + 1); }
    }
    snaps.push({ P: P.map((p) => ({ ...p })), h });
  }
  return snaps;
}
const truthOf = (sn) => {
  const avg = (a, b) => { let s = 0; for (let y = a; y <= b; y++) s += sn[y].h; return s / (b - a + 1); };
  const d = avg(28, 30) - avg(1, 3);

};
const zoneOf = (R) => (R <= 4 ? 's' : R >= 10 ? 'l' : 'm');

const soilAt = (d, de) => {

const stepText = (t, y) => (y < 1 ? '' : y === 1 ? `${t.fieldSteps.cut} ${t.fieldSteps.burn}` : y === 2 ? t.fieldSteps.garden : y <= 5 ? t.fieldSteps.leave : y <= 15 ? t.fieldSteps.young : t.fieldSteps.tall);

const D = Array.from({ length: NP }, () => ({ sz: 1, crop: 0, soil: 1, pas: 0, fld: 0 }));
const targetsOf = (p) => {
  const fld = p.kind === 'field' ? 1 : 0, pas = p.kind === 'pasture' ? 1 : 0;
  return { sz: fld || pas ? 0 : 0.12 + 0.88 * clamp(p.age / 14, 0, 1), crop: fld ? (p.left === 1 ? 0.5 : 1) : 0, soil: p.soil, pas, fld };

  ctx.strokeStyle = '#a3d977'; ctx.lineWidth = Math.max(1, s * 0.025); ctx.beginPath(); // a bean vine climbing the stalk

function drawField(ctx, w, h, dt, t) {

      ctx.fillStyle = q < 0.55 ? '#0b0807' : q < 0.8 ? '#c06a3c' : q < 0.92 ? '#e8dfcf' : '#d9a05b';

}

// --- drawing: view 3 (four plants to tap) -------------------------------------------------------------------
function plantGeom(w, h) { return { gy: h * 0.55, xs: [0.14, 0.38, 0.62, 0.86].map((q) => q * w), H: [0.38, 0.42, 0.37, 0.5].map((q) => q * h) }; }
function trunk(ctx, x, gy, H, w0, w1, c0, c1) {
  const g = ctx.createLinearGradient(x - w0, 0, x + w0, 0); g.addColorStop(0, c0); g.addColorStop(1, c1);
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - w0, gy); ctx.lineTo(x - w1, gy - H); ctx.lineTo(x + w1, gy - H); ctx.lineTo(x + w0, gy); ctx.closePath(); ctx.fill();

function blob(ctx, x, y, r, col) {
  const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.45, r * 0.1, x, y, r * 1.1);

}
function drawPlant(ctx, k, x, gy, H, q, t) { // q = width unit
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ell(ctx, x, gy + 3, q * 0.1, 5); ctx.fill();

    ctx.fillStyle = '#d79a6b'; rr(ctx, x - q * 0.011, gy - H * 0.55, q * 0.024, H * 0.3, 3); ctx.fill(); ctx.strokeStyle = '#7a4a28'; ctx.stroke();
    [[0, -0.84, 0.1], [-0.07, -0.74, 0.075], [0.07, -0.75, 0.078], [0.0, -0.95, 0.07]].forEach(([dx, dy, r]) => blob(ctx, x + dx * q * 1.5, gy + dy * H, r * q * 1.3, '#2f8f4e'));
    ctx.fillStyle = '#f7a8c4'; for (let i = 0; i < 9; i++) { circ(ctx, x + (rnd(i + 3) - 0.5) * q * 0.2, gy - H * (0.7 + rnd(i + 8) * 0.28), 2); ctx.fill(); }

function drawPlants(ctx, w, h, dt, t) {
  const { gy, xs, H } = plantGeom(w, h), q = Math.min(w, h * 0.8);

  ctx.fillStyle = '#2c6a38'; ctx.fillRect(0, gy - 2, w, 7);

  ctx.globalAlpha = 1;
  PLANTS.forEach((k, i) => {
    const done = S.pl.done[k], sel = S.pl.open === k;
    if (!done || sel) { // glow
      const a = (sel ? 0.5 : 0.28 + 0.14 * Math.sin(t * 2.2 + i)), cyy = gy - H[i] * 0.55, r = H[i] * 0.62;
      const g = ctx.createRadialGradient(xs[i], cyy, 2, xs[i], cyy, r); g.addColorStop(0, `rgba(255,228,120,${a.toFixed(3)})`); g.addColorStop(1, 'rgba(255,228,120,0)');

    if (done) { ctx.save(); ctx.globalAlpha = 1; ctx.fillStyle = done.ok ? '#2fa56e' : '#d29a2e'; circ(ctx, xs[i] + q * 0.1, gy - H[i] - 4, 10); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.font = '800 12px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(done.ok ? '✓' : '•', xs[i] + q * 0.1, gy - H[i] - 3.5); ctx.restore(); }
    pill(ctx, T[lang].plantNames[k], xs[i], gy + 20 + (i % 2) * 26, 'center');

}

// --- go ----------------------------------------------------------------------------------------------------
snapD(); render();
canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  CW = w; CH = h;
  ctx.save(); rr(ctx, 0, 0, w, h, 20); ctx.clip();
  const v = lab.view;
  if (v === 'rest') {
    if (S.running) { S.acc += dt; while (S.acc >= 0.4 && S.running) { S.acc -= 0.4; advance(); } }
    stepD(dt); drawRest(ctx, w, h, dt, t);
  } else if (v === 'field') drawField(ctx, w, h, dt, t);
  else drawPlants(ctx, w, h, dt, t);
  ctx.restore();
});
