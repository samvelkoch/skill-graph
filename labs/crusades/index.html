    }
    c.strokeStyle = on ? '#fff3c4' : S.seen[i] ? '#3ddc97' : `rgba(255, 245, 210, ${.55 + pulse * .4})`; c.lineWidth = on ? 2.5 : 2; c.setLineDash(on ? [] : [5, 4]);
    c.beginPath(); c.ellipse(h.x, h.y, h.r * (on ? 1 : .94 + pulse * .08), h.r * (i === 1 ? .8 : 1) * (on ? 1 : .94 + pulse * .08), 0, 0, 7); c.stroke(); c.setLineDash([]);
    const bx = h.x + (i === 1 ? -h.r * .9 : -h.r * .72), by = h.y - h.r * (i === 1 ? .55 : .72);
    c.fillStyle = S.seen[i] ? '#3ddc97' : 'rgba(34, 24, 12, .85)'; c.beginPath(); c.arc(bx, by, 9, 0, 7); c.fill(); c.strokeStyle = 'rgba(255, 245, 210, .7)'; c.lineWidth = 1; c.stroke();
    c.fillStyle = S.seen[i] ? '#10151f' : '#fff7e0'; c.font = `900 ${12}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(S.seen[i] ? '✓' : String(i + 1), bx, by + 1);
  });
  if (S.place !== null) pill(c, T[lang].city.places[S.place].name, W / 2, 112, fs, { anchor: 'c' });
  if (S.g2 !== null) {
    const ruler = rulerAt(S.year);
    pill(c, T[lang].city.cap(S.year, T[lang].city[ruler === 'cru' ? 'cru' : 'mus']), W / 2, 286, fs, { anchor: 'c', stroke: COL[ruler] });
  }
}

// --- the canvas loop -----------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const { s, ox, oy } = viewBox(w, h), fs = 12.5 / s, v = lab.view;
  // time-driven state
  S.moveT = Math.max(0, S.moveT - dt);
  if (!S.sec && v === 'road' && S.play) { S.m = Math.min(35, S.m + dt * 2.6); S.moveT = .3; if (S.m >= 35) { S.play = false; checkRoadEnd(); render(); } }
  if (!S.sec && v === 'ships' && ['out', 'dock', 'back'].includes(S.phase)) {
    S.pt += dt;
    const ph = S.pt < DUR.out ? 'out' : S.pt < DUR.out + DUR.dock ? 'dock' : S.pt < DUR.out + DUR.dock + DUR.back ? 'back' : 'done';
    if (ph !== S.phase) { S.phase = ph; if (ph === 'done') { S.trips++; S.coins += 12; (picksRight() === 3 ? sfx.good : sfx.snap)(); } else sfx.tick(); render(); }
  }
  if (S.sec && S.splay) { S.sp = Math.min(1, S.sp + dt / 11); if (S.sp >= 1) S.splay = false; $('crXs').value = Math.round(S.sp * 1000); }
  if (!S.sec && v === 'road' && S.play) $('crRs').value = S.m;
  const key = `${S.sec}|${v}|${stopIdx(S.m, T[lang].road.stops)}|${Math.floor(S.m + 1e-6)}|${S.done1}|${S.sec ? secStage() : ''}|${S.sec && !S.splay ? 'p' : ''}`;
  if (key !== S.lastK) { S.lastK = key; render(); }
  c.save(); c.translate(ox, oy); c.scale(s, s);
  c.beginPath(); rr(c, 0, 0, W, H, 14); c.save(); c.shadowColor = 'rgba(0, 0, 0, .5)'; c.shadowBlur = 14; c.shadowOffsetY = 4; c.fillStyle = '#d9bd82'; c.fill(); c.restore(); c.clip();
  if (S.sec) drawSecret(c, time, fs, dt);
  else if (v === 'road') drawRoad(c, time, fs, dt);
  else if (v === 'city') drawJerusalem(c, time, fs);
  else drawShips(c, time, fs, dt);
  c.restore();
  c.save(); c.translate(ox, oy); c.scale(s, s); c.beginPath(); rr(c, 0.75, 0.75, W - 1.5, H - 1.5, 14); c.strokeStyle = 'rgba(90, 60, 25, .85)'; c.lineWidth = 1.8; c.stroke(); c.restore();
});

$('cv').addEventListener('click', (ev) => {
  if (S.sec || lab.view !== 'city') return;
  const r = $('cv').getBoundingClientRect(), { s, ox, oy } = viewBox(r.width, r.height);
  const x = (ev.clientX - r.left - ox) / s, y = (ev.clientY - r.top - oy) / s;
  let best = -1, bd = 1e9;
  HS.forEach((h, i) => { const d = Math.hypot((x - h.x) / (i === 1 ? 1 : 1), (y - h.y) / (i === 1 ? .8 : 1)) - Math.max(h.r, 20 / s); if (d < 0 && d < bd) { bd = d; best = i; } });
  if (best >= 0) pickPlace(best);
});

// --- logic -----------------------------------------------------------------------------------------------------
const secStage = () => { const st = T[lang].sec[S.sec].st; let i = 0; while (i < st.length - 1 && S.sp >= st[i + 1].p) i++; return i; };
const picksRight = () => S.picks.filter((id) => GOODS.find((g) => g[0] === id)[2]).length;
function checkRoadEnd() { if (S.g1 !== null && S.m >= 34.99 && !S.done1) { S.done1 = true; (S.g1 === 2 ? sfx.good : sfx.snap)(); } }
function pickPlace(i) { S.place = i; S.seen[i] = true; S.mode2 = 'place'; sfx.snap(); render(); }

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'g1') { S.g1 = i; sfx.click(); }
  else if (a === 'play') { if (S.m >= 35) S.m = 0; S.play = !S.play; sfx.click(); }
  else if (a === 'again1') { S.g1 = null; S.m = 0; S.play = false; S.done1 = false; sfx.click(); }
  else if (a === 'place') return pickPlace(i);
  else if (a === 'g2') { S.g2 = i; S.visC = S.visM = false; markYear(); sfx.click(); }
  else if (a === 'good') {
    if (S.phase !== 'pick') return;
    const id = b.dataset.id, k = S.picks.indexOf(id);
    if (k >= 0) S.picks.splice(k, 1); else if (S.picks.length < 3) S.picks.push(id); else return;
    sfx.tick();
  } else if (a === 'send') { if (S.picks.length !== 3 || S.phase !== 'pick') return; S.phase = 'out'; S.pt = 0; sfx.push(); }
  else if (a === 'resend') { S.phase = 'pick'; S.picks = []; S.pt = 0; sfx.click(); }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.sp = 0; S.splay = false; $('crXs').value = 0; sfx.click(); }
  else if (a === 'xplay') { if (S.sp >= 1) S.sp = 0; S.splay = !S.splay; sfx.click(); }
  else if (a === 'xback') { S.sec = null; S.splay = false; sfx.click(); }
  render(); showStage(a);
});
const showStage = (a) => {
  if (!['send', 'play', 'xplay', 'g1', 'sec'].includes(a)) return;
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
};
let lastTick = 0;
const tickSoft = () => { const n = performance.now(); if (n - lastTick > 90) { lastTick = n; sfx.tick(); } };
$('crRs').addEventListener('input', (ev) => { S.play = false; S.m = +ev.target.value; S.moveT = .3; tickSoft(); checkRoadEnd(); render(); });
$('crYs').addEventListener('input', (ev) => { S.year = +ev.target.value; S.mode2 = 'ruler'; markYear(); tickSoft(); render(); });
$('crXs').addEventListener('input', (ev) => { S.splay = false; S.sp = +ev.target.value / 1000; tickSoft(); render(); });
function markYear() { if (S.g2 === null) return; const r = rulerAt(S.year); if (r === 'cru') S.visC = true; else S.visM = true; }

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v;
  $('sRoad').style.display = !sec && v === 'road' ? '' : 'none';
  $('sCity').style.display = !sec && v === 'city' ? '' : 'none';
  $('sShips').style.display = !sec && v === 'ships' ? '' : 'none';
  $('sSec').style.display = sec ? '' : 'none';
  const open = secret.unlocked();
  $('crSecRow').innerHTML = `<div class="cr-lbl">${'🔬'}</div><div class="cr-chips">${['a', 'b'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" type="button" data-act="sec" data-k="${k}">${open ? `${k === 'a' ? '🧭' : '👑'} ${esc(t.sec[k].title)}` : '🔒 ???'}</button>`).join('')}</div>`;
  if (sec) renderSecret(t); else if (v === 'road') renderRoad(t); else if (v === 'city') renderCity(t); else renderShips(t);
}
const fine = (t) => `<div class="fine">${esc(t.fine)}</div>`;
const chipsHtml = (opts, act, o = {}) => `<div class="cr-chips">${opts.map((x, i) => `<button class="chip ${o.good === i ? 'cr-good' : ''} ${o.mine === i ? 'cr-mine' : ''}" type="button" data-act="${act}" data-i="${i}"${o.lock ? ' disabled' : ''}>${esc(x)}</button>`).join('')}</div>`;

function renderRoad(t) {
  const r = t.road;
  lab.setGlow('rgba(200, 147, 47, .3)');
  $('rQ').innerHTML = S.g1 === null ? `<p class="cr-q">${esc(r.q)}</p>${chipsHtml(r.opts, 'g1')}`
    : S.done1 ? `<p class="cr-q">${esc(r.q)}</p>${chipsHtml(r.opts, 'g1', { good: 2, mine: S.g1, lock: true })}`
      : `<p class="cr-q" style="margin:0">${esc(r.q)}</p><div class="cr-note" style="margin:4px 0 0">${esc(r.yours)}: <b style="color:#fff">${esc(r.opts[S.g1])}</b></div>`;
  $('rWalk').style.display = S.g1 === null ? 'none' : '';
  $('crRs').value = S.m; $('crPlay').textContent = S.play ? r.pause : r.play; $('crDrag').textContent = S.done1 ? '' : r.drag;
  $('rV').innerHTML = S.done1 ? `<div class="cr-v ${S.g1 === 2 ? 'ok' : ''}"><b>${esc(S.g1 === 2 ? r.right : '')}</b>${esc(S.g1 === 2 ? r.rightT : r.wrongT)}</div><div class="cr-row"><button class="chip" type="button" data-act="again1">${esc(r.again)}</button></div>` : '';
  if (S.g1 === null) {
    lab.setReadout('?', '', '', '#c8932f');
    lab.setState({ emo: r.intro.emo, title: r.intro.title, lead: r.intro.lead, body: '', extra: fine(t) });
  } else {
    const idx = stopIdx(S.m, r.stops), st = S.m >= 34.99 ? r.end : r.stops[idx];
    lab.setReadout(esc(monthLabel(t, S.m)), r.month(Math.floor(S.m + 1e-6)), st.at, '#c8932f');
    lab.setState({ emo: st.emo, title: st.at, lead: st.lead, body: '', extra: fine(t) });
  }
  lab.setFacts(t.facts.road);
}

function renderCity(t) {
  const c = t.city;
  lab.setGlow('rgba(229, 143, 106, .3)');
  const seen = S.seen.filter(Boolean).length;
  $('cPl').innerHTML = `<p class="cr-q">${esc(c.prompt)}</p><div class="cr-chips">${c.places.map((p, i) => `<button class="chip cr-place ${S.seen[i] ? 'seen' : ''} ${S.place === i ? 'on' : ''}" type="button" data-act="place" data-i="${i}">${p.emo} ${esc(p.who)}${S.seen[i] ? ' ✓' : ''}</button>`).join('')}</div>`;
  $('cQ').innerHTML = S.g2 === null ? `<div class="cr-sec"><p class="cr-q">${esc(c.q)}</p>${chipsHtml(c.opts, 'g2')}</div>` : '';
  $('cT').style.display = S.g2 === null ? 'none' : '';
  const ruler = rulerAt(S.year);
  $('crYw').innerHTML = S.g2 === null ? '' : `<span class="cr-dot" style="background:${COL[ruler]}"></span>${esc(c.who)} ${esc(c[ruler])}`;
  $('crYy').textContent = S.year; $('crYs').value = S.year;
  $('crYd').textContent = S.visC && S.visM ? '' : c.drag;
  const done = S.g2 !== null && S.visC && S.visM, good = S.g2 === 1;
  $('crYs').style.background = `linear-gradient(90deg, ${COL.cru} 0 45.8%, ${COL.mus} 45.8% 67.7%, ${COL.cru} 67.7% 75.5%, ${COL.mus} 75.5% 100%)`;
  $('cV').innerHTML = done ? `<div class="cr-v ${good ? 'ok' : ''}"><b>${esc(good ? t.ships.right : '')}</b>${esc(good ? c.rightT : c.wrongT)}</div>` : '';
  if (S.g2 === null) lab.setReadout(`${seen}/3`, '', '', '#e58f6a');
  else lab.setReadout(String(S.year), c[ruler], '', COL[ruler]);
  let st;
  if (S.mode2 === 'place' && S.place !== null) { const p = c.places[S.place]; st = { emo: p.emo, title: p.name, lead: p.text }; }
  else if (S.g2 !== null) { const y = S.year; const r = y === 1291 ? c.r5 : y < 1187 ? c.r1 : y < 1229 ? c.r2 : y < 1244 ? c.r3 : c.r4; st = { emo: r.emo, title: r.title, lead: r.lead }; }
  else st = { emo: '🏙️', title: c.prompt, lead: '' };
  lab.setState({ ...st, body: '', extra: fine(t) });
  lab.setFacts(t.facts.city);
}

function renderShips(t) {
  const sh = t.ships, ph = S.phase, picking = ph === 'pick';
  lab.setGlow('rgba(60, 130, 170, .3)');
  $('gQ').innerHTML = `<p class="cr-q">${esc(sh.q)}</p>`;
  $('gChips').innerHTML = ORDER.map((id) => {
    const g = GOODS.find((x) => x[0] === id), on = S.picks.includes(id);
    return `<button class="chip ${on ? 'on' : ''}" type="button" data-act="good" data-id="${id}"${picking ? '' : ' disabled'}>${g[1]} ${esc(sh.goods[id])}</button>`;
  }).join('');
  $('gAct').innerHTML = picking ? `<span class="cr-note" style="margin:0">${esc(sh.n(S.picks.length))}</span><button class="btn push" type="button" data-act="send"${S.picks.length === 3 ? '' : ' disabled'} style="margin-left:auto">${esc(sh.send)}</button>`
    : ph === 'done' ? `<button class="chip" type="button" data-act="resend">${esc(sh.again)}</button>` : '';
  const k = picksRight();
  $('gV').innerHTML = ph === 'done' ? `<div class="cr-v ${k === 3 ? 'ok' : ''}"><b>${k === 3 ? esc(sh.right) : ''}</b>${k === 3 ? '' : esc(sh.part(k))}</div>` : '';
  lab.setReadout(`🪙 ${S.coins}`, S.trips ? sh.trips(S.trips) : '', '', '#f4c542');
  const st = sh['s_' + ph];
  lab.setState({ emo: st.emo, title: ph === 'done' && k === 3 ? `${sh.right} ${st.title}` : st.title, lead: st.lead, body: ph === 'done' ? sh.coins : '', extra: fine(t) });
  lab.setFacts(t.facts.ships);
}

function renderSecret(t) {
  const sc = t.sec, st = sc[S.sec].st[secStage()], cfg = SEC[S.sec];
  lab.setGlow(S.sec === 'a' ? 'rgba(168, 55, 47, .3)' : 'rgba(47, 111, 158, .3)');
  $('crXplay').textContent = S.splay ? sc.pause : sc.play; $('crXback').textContent = sc.close;
  const y = cfg.y0 === cfg.y1 ? cfg.y0 : Math.round(lerp(cfg.y0, cfg.y1, clamp((S.sp - .1) / .75, 0, 1)));
  $('crXyr').textContent = `${sc.year}: ${y}`; $('crXs').value = Math.round(S.sp * 1000);
  lab.setReadout(String(y), sc[S.sec].title, '', S.sec === 'a' ? '#a8372f' : '#2f6f9e');
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: '', extra: fine(t) });
  lab.setFacts([]);
}
render();
</script>
</body>
