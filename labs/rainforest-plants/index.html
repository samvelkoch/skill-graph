function trunkPath(c, x, yb, yt, wb, wt) {
  c.beginPath(); c.moveTo(x - wb, yb);

  c.bezierCurveTo(x + wt * 1.15, (yb + yt) / 2, x + wb * .8, (yb + yt) / 2 + (yb - yt) * .12, x + wb, yb); c.closePath();
}
function trunk(c, x, yb, yt, wb, wt, k = 0, alpha = 1, hollow = 0, pal = 0) {

  const dark = pal === 1 ? ['#3a342b', '#2b261f', '#1c1914'] : ['#2a1d13', '#1f150e', '#150e09'];

}

const lightAt = (y, gy, cy) => .05 + .95 * Math.pow(c01((gy - y) / (gy - (cy - 12))), 1.5);

    for (const fr of [.25, .45, .65, .85]) { const y = ty + (gy - ty) * fr; if (y > ty + gl * (gy - ty)) continue; c.strokeStyle = `rgba(179,157,116,${q})`; c.lineWidth = th * .8; c.beginPath(); c.ellipse(cx, y, R(y), 5 * sc, 0, 0.1, Math.PI - .1); c.stroke(); }

// === controls --------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const syncSlider = () => { const s = $('rpSlider'); if (s) s.value = Math.round(S.figT * 1000); };
function pickLight(k) {
  const L = S.L; if (L.phase !== 'ask') return;
  L.pick = k; L.phase = 'run'; L.t = 0; (k === 'liana' ? sfx.good : sfx.click)(); showStage(); render();
}
function pickRain(k) {
  const R = S.R; if (R.phase !== 'ask') return;
  initRain(); R.pick = k; R.phase = 'run'; sfx.click(); showStage(); render();
}
function addFrog() {
  const Y = S.Y, live = Y.frogs.filter((f) => f.st !== 'leave');
  if (Y.ans === null || Y.flip || live.length >= 10) return;
  const used = new Set(live.map((f) => f.slot)); let slot = 0; while (used.has(slot)) slot++;
  Y.frogs.push({ slot, st: 'jump', t: 0, dur: .6, land: 0 }); sfx.tick(); showStage();
}
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'light' || S.L.phase !== 'ask') return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, w = r.width, xs = [w * .17, w * .5, w * .8];
  const i = xs.reduce((b, v, j) => (Math.abs(v - x) < Math.abs(xs[b] - x) ? j : b), 0);
  if (Math.abs(xs[i] - x) < w * .17) pickLight(['tree', 'liana', 'orchid'][i]);
});

  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = b.dataset.k;
  if (act === 'pickL') pickLight(k);
  else if (act === 'pickR') pickRain(k);
  else if (act === 'ans') { if (S.Y.ans === null) { S.Y.ans = k; (k === 'yes' ? sfx.good : sfx.bad)(); render(); } }
  else if (act === 'again') {
    if (lab.view === 'light') Object.assign(S.L, { phase: 'ask', pick: null, t: 0 });

  }
  else if (act === 'add') addFrog();
  else if (act === 'clear') { S.Y.frogs.forEach((f, i) => { if (f.st === 'on') { f.st = 'leave'; f.t = -i * .06; f.dur = .5; } }); S.Y.flip = false; sfx.click(); render(); }
  else if (act === 'flip') { S.Y.flip = !S.Y.flip; sfx.click(); render(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.play = false;
    if (S.sec === 'tall') { S.tallT = 0; S.stack = false; S.sA = 0; }
    if (S.sec === 'fig') { S.figT = 0; syncSlider(); }
    sfx.click(); render();
  }
  else if (act === 'stack') { S.stack = !S.stack; sfx.click(); render(); }
  else if (act === 'play') { if (S.figT >= .99) { S.figT = 0; syncSlider(); } S.play = !S.play; sfx.click(); render(); }
});
$('rpSlider').addEventListener('input', (ev) => { S.figT = +ev.target.value / 1000; S.play = false; render(); });

// --- render: controls, readout and the state card -------------------------------------------------------------
const figStage = () => (S.figT < .12 ? 0 : S.figT < .5 ? 1 : S.figT < .85 ? 2 : 3);
function stageKey() {
  if (S.sec === 'tall') return 'tall' + (S.stack ? 1 : 0);
  if (S.sec === 'fig') return 'fig' + figStage();
  const v = lab.view;
  if (v === 'light') { const L = S.L; return 'l' + (L.phase === 'ask' ? 0 : L.phase === 'done' ? 3 : L.t < VERDICT_T ? 1 : 2); }
  if (v === 'rain') { const R = S.R; return 'r' + (R.phase === 'ask' ? 0 : R.phase === 'done' || R.t >= RD + 8 ? 4 : R.tipDone ? 3 : R.t >= RD ? 2 : 1); }
  const Y = S.Y, n = Y.frogs.filter((f) => f.st === 'on').length;
  return 'y' + (Y.ans === null ? 0 : n >= 10 ? 2 : n > 0 ? 1 : 3) + (Y.flip ? 'f' : '');
}
const opt = (act, k, label, cls = '', dis = false) => `<button class="rp-opt ${cls}" data-act="${act}" data-k="${k}"${dis ? ' disabled' : ''}>${esc(label)}</button>`;
let lastRO = '', lastKey = '';
function readout() {
  const t = T[lang], v = lab.view;
  let val, sub = '', pillTxt = '', col = '#5fbf4a';
  if (S.sec === 'tall') { val = '🌳'; sub = t.sx.lbl.kapok; }
  else if (S.sec === 'fig') { val = '🌿'; sub = t.sx.fig[0]; }
  else if (v === 'light') {
    const L = S.L;
    if (L.phase === 'ask') val = '?';
    else { const i = ['tree', 'liana', 'orchid'].indexOf(L.pick), k = L.lights[i], word = t.l.lvl[k < .3 ? 0 : k < .85 ? 1 : 2]; val = `☀️ ${word}`; sub = t.l.names[L.pick]; col = '#ffc93c'; }
  } else if (v === 'rain') {
    const R = S.R;
    if (R.phase === 'ask') val = '?';
    else { const d = (x) => '💧'.repeat(Math.ceil(x * 3 - .001)) || '·'; val = `<span style="font-size:19px">${esc(t.r.names.round)} ${d(R.wet.round)} &nbsp; ${esc(t.r.names.tip)} ${d(R.wet.tip)}</span>`; col = '#5ab4e8'; }
  } else {
    const n = S.Y.frogs.filter((f) => f.st === 'on').length; val = `🐸 ${n}`; sub = t.y.cnt(n); col = '#6fcb55';
    if (S.Y.ans !== null && n > 0) pillTxt = t.y.afloat;
  }
  const key = val + '|' + sub + '|' + pillTxt; if (key === lastRO) return; lastRO = key;
  lab.setReadout(val, sub, pillTxt, col);
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 's-' + sec : v;
  $('rpMain').hidden = !!sec; $('rpTall').hidden = sec !== 'tall'; $('rpFig').hidden = sec !== 'fig';
  const open = secret.unlocked(), sc = (k, emo) => `<button class="rp-opt ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}" style="border-style:${open ? 'solid' : 'dashed'}">${open ? `${emo} ${esc(t.sx[k][0])}` : '🔒 ???'}</button>`;
  $('rpSec').innerHTML = sc('tall', '🌳') + sc('fig', '🌿');
  const st = stageKey(); lastKey = st; lastRO = '';
  if (sec === 'tall') {
    $('rpTall').innerHTML = `<div class="rp-chips"><button class="rp-opt" data-act="stack">${esc(S.stack ? t.sx.unstack : t.sx.stack)}</button></div>`;
    const s = S.stack ? t.sx.t1 : t.sx.t0;
    lab.setState({ emo: '🌳', title: s[0], lead: s[1], body: '' }); lab.setFacts([{ emo: '🌳', text: t.facts.kapok[0], src: t.facts.kapok[1] }]); lab.setGlow('rgba(120,190,230,.28)');
  } else if (sec === 'fig') {
    $('rpPlay').textContent = S.play ? '❚❚' : t.sx.play; $('rpEnd0').textContent = t.sx.seedEnd; $('rpEnd1').textContent = t.sx.laterEnd; $('rpSlider').setAttribute('aria-label', t.sx.time);
    const s = t.sx['f' + figStage()];
    lab.setState({ emo: '🌿', title: s[0], lead: s[1], body: '' }); lab.setFacts([]); lab.setGlow('rgba(80,170,90,.28)');
  } else if (v === 'light') renderLight(t, st);
  else if (v === 'rain') renderRain(t, st);
  else renderLily(t, st);
  readout();
}
function renderLight(t, st) {
  const L = S.L, ask = L.phase === 'ask', done = L.phase === 'done', q = t.l, ok = L.pick === 'liana';
  lab.setGlow('rgba(255,210,90,.26)');
  const emo = { tree: '🌳', liana: '🍃', orchid: '🌸' };
  const chips = ['tree', 'liana', 'orchid'].map((k) => {
    let cls = ''; if (L.phase !== 'ask' && L.t >= VERDICT_T) cls = k === 'liana' ? 'good' : L.pick === k ? 'bad' : '';
    return opt('pickL', k, `${emo[k]} ${q.names[k]}`, cls, !ask);
  }).join('');
  $('rpMain').innerHTML = `<p class="rp-q">${esc(q.q)}</p><div class="rp-chips">${chips}</div>${done ? `<div class="rp-row"><button class="btn" data-act="again">${esc(t.again)}</button></div>` : ''}`;
  if (st === 'l0') lab.setState({ emo: '🤔', title: q.q, lead: q.ask, body: '' });
  else if (st === 'l1') lab.setState({ emo: '🌱', title: q.a[0], lead: q.a[1], body: '' });
  else if (st === 'l2') lab.setState({ emo: ok ? '🎉' : '🍃', title: ok ? t.right : t.wrong, lead: q.b, body: '' });
  else lab.setState({ emo: '🌳', title: q.c[0], lead: q.c[1], body: q.c[2] });
  lab.setFacts([{ emo: '🌳', text: t.facts.kapok[0], src: t.facts.kapok[1] }, { emo: '🍫', text: t.facts.cacao[0], src: t.facts.cacao[1] }]);
}
function renderRain(t, st) {
  const R = S.R, ask = R.phase === 'ask', done = R.phase === 'done', q = t.r, ok = R.pick === 'tip';
  lab.setGlow('rgba(90,180,230,.26)');
  const reveal = st === 'r3' || st === 'r4';
  const chips = ['round', 'tip', 'both'].map((k) => opt('pickR', k, q.names[k], reveal ? (k === 'tip' ? 'good' : R.pick === k ? 'bad' : '') : '', !ask)).join('');
  $('rpMain').innerHTML = `<p class="rp-q">${esc(q.q)}</p><div class="rp-chips">${chips}</div>${done ? `<div class="rp-row"><button class="btn" data-act="again">${esc(t.again)}</button></div>` : ''}`;
  if (st === 'r0') lab.setState({ emo: '🤔', title: q.q, lead: q.ask, body: '' });
  else if (st === 'r1') lab.setState({ emo: '🌧️', title: q.a[0], lead: q.a[1], body: '' });
  else if (st === 'r2') lab.setState({ emo: '💧', title: q.b[0], lead: q.b[1], body: '' });
  else if (st === 'r3') lab.setState({ emo: ok ? '🎉' : '💧', title: ok ? t.right : t.wrong, lead: q.c, body: '' });
  else lab.setState({ emo: '🍄', title: q.d[0], lead: q.d[1], body: '' });
  lab.setFacts([{ emo: '🌺', text: t.facts.raff[0], src: t.facts.raff[1] }]);
}
function renderLily(t, st) {
  const Y = S.Y, q = t.y, n = Y.frogs.filter((f) => f.st === 'on').length, live = Y.frogs.filter((f) => f.st !== 'leave').length;
  lab.setGlow('rgba(90,200,160,.26)');
  const ask = Y.ans === null;
  let html = `<p class="rp-q">${esc(q.q)}</p><div class="rp-chips">` + ['yes', 'no'].map((k) => opt('ans', k, q[k], !ask && n >= 10 ? (k === 'yes' ? 'good' : Y.ans === k ? 'bad' : '') : (!ask && Y.ans === k ? 'on' : ''), !ask)).join('') + '</div>';
  html += `<div class="rp-row"><button class="btn" data-act="add"${ask || Y.flip || live >= 10 ? ' disabled style="opacity:.35"' : ''}>${esc(q.add)}</button>`
    + `<button class="rp-opt" data-act="clear"${n === 0 ? ' disabled' : ''}>${esc(q.clear)}</button>`
    + `<button class="rp-opt" data-act="flip"${ask ? ' disabled' : ''}>${esc(Y.flip ? q.unflip : q.flip)}</button></div>`;
  $('rpMain').innerHTML = html;
  if (st.startsWith('y0')) lab.setState({ emo: '🤔', title: q.q, lead: q.ask, body: '' });
  else if (Y.flip) lab.setState({ emo: '🔄', title: q.flipped[0], lead: q.flipped[1], body: '' });
  else if (st.startsWith('y2')) { const ok = Y.ans === 'yes'; lab.setState({ emo: ok ? '🎉' : '🐸', title: ok ? t.right : t.wrong, lead: q.done, body: '' }); }
  else if (st.startsWith('y3')) lab.setState({ emo: '🐸', title: q.on0[0], lead: q.on0[1], body: '' });
  else lab.setState({ emo: '🐸', title: q.on[0], lead: q.on[1], body: '' });
  lab.setFacts([{ emo: '🪷', text: t.facts.lily[0], src: t.facts.lily[1] }]);
}

// --- loop ----------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  c.save();
  if (S.sec === 'tall') drawTall(c, w, h, dt, time);
  else if (S.sec === 'fig') drawFig(c, w, h, dt, time);
  else if (lab.view === 'light') drawLightScene(c, w, h, dt, time);
  else if (lab.view === 'rain') drawRainScene(c, w, h, dt, time);
  else drawLily(c, w, h, dt, time);
  c.restore();
  const k = stageKey(); if (k !== lastKey) render(); else readout();
});
render();
</script>
</body>
</html>
