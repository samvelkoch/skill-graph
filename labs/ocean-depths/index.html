  const nm = [['angler', an, 1.25], ['hatchet', ha, 1.25], ['jelly', je, 2.7]];
  nm.forEach(([k, o, dy]) => { const sel = { angler: 'lure', hatchet: 'hide', jelly: 'alarm' }[k] === S.glowSel; txt(c, gt.names[k], o.x, o.y + o.u * dy + fs, fs, sel ? '#7ff5dc' : '#fff', 'center', sel ? 1 : .6); });
  if (!S.tapped) { const o = L[{ lure: 'angler', hide: 'hatchet', alarm: 'jelly' }[S.glowSel]]; c.strokeStyle = `rgba(127,245,220,${.4 + .4 * Math.sin(time * 4)})`; c.lineWidth = 2; c.beginPath(); c.arc(o.x, o.y, o.u * 1.9 + Math.sin(time * 4) * 3, 0, 6.3); c.stroke(); txt(c, gt.hint, w / 2, h - 12, fs, '#7ff5dc', 'center'); }
}

// ---------------------------------------------------------------- vents scene
function drawVents(c, w, h, dt, time) {
  const t = T[lang], x = t.vents, U = Math.min(w, h * 1.25), fs = clamp(w / 40, 10, 14);
  S.e += (S.eT - S.e) * (1 - Math.exp(-dt * 3)); const e = S.e;
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#02050f'); bg.addColorStop(1, '#050c1c'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const cx = w * .5, yF = h * .84, chH = h * .42, chW = U * .2, yTop = yF - chH;
  glowDot(c, cx, yTop, U * (.2 + .25 * e), '255,120,40', .12 + .45 * e);
  glowDot(c, cx, yF, U * .45, '255,110,50', .06 + .16 * e);
  snow(c, w, h, time, 0, .18);
  // floor
  c.fillStyle = '#1a1412'; c.beginPath(); c.moveTo(0, h); for (let px = 0; px <= w; px += 8) c.lineTo(px, yF + Math.sin(px / 37) * 5 + Math.sin(px / 13) * 2); c.lineTo(w, h); c.fill();
  // chimney
  c.fillStyle = '#2b2522'; c.beginPath(); c.moveTo(cx - chW * .55, yF + 4); c.lineTo(cx - chW * .28, yTop); c.lineTo(cx + chW * .28, yTop); c.lineTo(cx + chW * .55, yF + 4); c.closePath(); c.fill();
  c.fillStyle = `rgba(255,120,40,${.15 + .5 * e})`; c.beginPath(); c.ellipse(cx, yTop, chW * .28, chW * .06, 0, 0, 6.3); c.fill();
  // bacteria on the chimney
  const nb = Math.round(70 * e);
  for (let i = 0; i < nb; i++) { const b = S.bac[i], wd = lerp(chW * 1.1, chW * .56, b.t), px = cx + b.u * wd / 2 * 1.08, py = yF - b.t * chH + Math.sin(time * 2 + b.ph) * 1.5; glowDot(c, px, py, 4, '130,255,160', .65); c.fillStyle = '#c9ffd6'; c.fillRect(px - 1, py - 1, 2, 2); }
  // plume particles
  S.acc += dt * e * 36; while (S.acc > 1 && S.vp.length < 140) { S.acc -= 1; const chem = Math.random() < .3; S.vp.push({ x: cx + (Math.random() - .5) * chW * .3, y: yTop, vx: (Math.random() - .5) * U * .03 + U * .01, vy: -U * (.1 + Math.random() * .15), a: 0, life: 2.6 + Math.random() * 1.6, chem }); }
  S.acc = Math.min(S.acc, 2);
  S.vp = S.vp.filter((q) => (q.a += dt) < q.life);
  for (const q of S.vp) {
    q.x += (q.vx + Math.sin(q.a * 2 + q.x) * 4) * dt; q.y += q.vy * dt; q.vy *= (1 - dt * .25); const f = q.a / q.life;
    if (q.chem) { c.fillStyle = `rgba(255,236,120,${(1 - f) * .9})`; c.beginPath(); c.arc(q.x, q.y, 2, 0, 6.3); c.fill(); }
    else { c.fillStyle = `rgba(120,108,112,${(1 - f) * .3})`; c.beginPath(); c.arc(q.x, q.y, U * (.012 + .05 * f), 0, 6.3); c.fill(); }
  }
  // tube worms
  const nw = Math.round(1 + 11 * e);
  for (let i = 0; i < nw; i++) {
    const wv = S.worms[i], px = cx + wv.dx * U * 1.1, hh = U * (.1 + .1 * wv.hh) * (.55 + .45 * e), sw = Math.sin(time * 1.3 + wv.ph) * U * .01;
    c.strokeStyle = e > .15 ? '#f2eee4' : '#7c7a74'; c.lineWidth = U * .022; c.lineCap = 'round'; c.beginPath(); c.moveTo(px, yF + 3); c.quadraticCurveTo(px + sw, yF - hh * .5, px + sw * 1.6, yF - hh); c.stroke();
    c.fillStyle = e > .15 ? '#ff4d5e' : '#7a3a40'; c.beginPath(); c.ellipse(px + sw * 1.6, yF - hh - U * .01, U * .014, U * .026, 0, 0, 6.3); c.fill();
  }
  // crabs
  const ncr = e > .7 ? 3 : e > .35 ? 1 : 0;
  for (let i = 0; i < ncr; i++) { const px = cx + (i - 1) * U * .32 + Math.sin(time * .4 + i * 2) * U * .06, py = yF + 10 + (i % 2) * 8; c.fillStyle = '#e8d9c8'; c.beginPath(); c.ellipse(px, py, U * .03, U * .02, 0, 0, 6.3); c.fill(); c.strokeStyle = '#e8d9c8'; c.lineWidth = 2; c.beginPath(); c.moveTo(px - U * .03, py); c.lineTo(px - U * .05, py - U * .02); c.moveTo(px + U * .03, py); c.lineTo(px + U * .05, py - U * .02); c.stroke(); }
  // labels
  txt(c, x.hot, cx, Math.max(yTop - U * .3, fs + 34), fs, '#ffd9b0', 'center', .9);
  txt(c, x.bac, cx + chW * .75, yF - chH * .45, fs, '#a8ffc2', 'left', .85);
  txt(c, x.worms, cx - U * .3, yF - U * .2, fs, '#fff', 'right', .85);
  // no sunlight badge
  c.save(); c.font = FONT(fs); const bw = Math.min(w - 20, c.measureText(x.sun).width + 34); c.fillStyle = 'rgba(10,20,40,.7)'; c.beginPath(); if (c.roundRect) c.roundRect(10, 10, bw, fs + 14, 10); else c.rect(10, 10, bw, fs + 14); c.fill(); c.restore();
  c.fillStyle = '#ffd166'; c.beginPath(); c.arc(24, 10 + (fs + 14) / 2, 5, 0, 6.3); c.fill(); c.strokeStyle = '#ff5d5d'; c.lineWidth = 2; c.beginPath(); c.moveTo(17, 10 + (fs + 14) / 2 - 7); c.lineTo(31, 10 + (fs + 14) / 2 + 7); c.stroke();
  txt(c, x.sun, 38, 10 + (fs + 14) / 2 + fs * .35, fs, '#fff', 'left');
}

// ---------------------------------------------------------------- loop + input
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.auto) { const k = cur(); S[k] = Math.min(1, S[k] + (k === 'p' ? .04 : .09) * dt); S[k + 'T'] = S[k]; if (S[k] >= 1) { S.auto = false; render(); } }
  else if (lab.view === 'dive') { const e = 1 - Math.exp(-dt * 5); S.p += (S.pT - S.p) * e; S.lower += (S.lowerT - S.lower) * e; }
  const sl = $('slider'), want = Math.round((lab.view === 'vents' ? S.e : S[cur()]) * 1000);
  if (lab.view !== 'glow' && Math.abs(+sl.value - want) > 1) sl.value = want;
  if (lab.view === 'dive') (S.secret === 'everest' ? drawEverest : S.secret === 'squeeze' ? drawSqueeze : drawDive)(c, w, h, dt, time);
  else if (lab.view === 'glow') drawGlow(c, w, h, dt, time);
  else drawVents(c, w, h, dt, time);
  updateText();
});
$('cv').addEventListener('pointermove', (ev) => {
  if (lab.view !== 'dive' || S.secret) return;
  const r = $('cv').getBoundingClientRect(); S.subTX = clamp((ev.clientX - r.left) / r.width, .12, .88); S.steered = true;
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'glow' && S.L) {
    const L = S.L, cand = [['lure', L.angler], ['hide', L.hatchet], ['alarm', L.jelly]];
    let best = null, bd = 1e9; for (const [k, o] of cand) { const d = Math.hypot(x - o.x, y - o.y); if (d < bd) { bd = d; best = k; } }
    trigger(best); render();
  } else if (lab.view === 'vents') {
    if (Math.abs(x - r.width / 2) < r.width * .15) { S.eT = S.eT > .6 ? 0 : S.eT > .15 ? .85 : .35; sfx.click(); }
  } else if (lab.view === 'dive' && !S.secret) { S.subTX = clamp(x / r.width, .12, .88); S.steered = true; }
});
render();
</script>
