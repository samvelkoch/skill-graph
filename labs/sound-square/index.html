    return;
  }
  if (a === 'next') { stopGuess(); G.i = (G.i + 1) % ROUNDS.length; shuffleRound(); render(); return; }
}
$('ctrlBody').addEventListener('click', (ev) => { const b = ev.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b.dataset.k); });
$('overlay').addEventListener('click', (ev) => { const b = ev.target.closest('[data-act]'); if (b) act(b.dataset.act, b.dataset.k); });

// --- one render per change -------------------------------------------------------------------------------------
function render() {
  const t = T[lang], u = t.u, v = lab.view;
  $('sqSnd').hidden = soundOn(); $('sqSnd').textContent = u.snd;
  $('sqQ').textContent = t.q[v];
  $('sqModes').hidden = v === 'guess';
  $('sqModes').innerHTML = [['smooth', u.smooth], ['snap', u.steps]].map(([k, l]) => `<button class="chip ${(k === 'snap') === MODE.snap ? 'on' : ''}" data-act="mode" data-k="${k}">${esc(l)}</button>`).join('');
  $('sqWrite').hidden = v !== 'write'; $('sqGuess').hidden = v !== 'guess';
  if (v === 'guess' && isFull()) { document.documentElement.classList.remove('sq-full'); setFull(false); return; }
  const full = isFull(), canBack = W.strokes.length && W.phase !== 'rec';
  $('sqFs').innerHTML = v === 'guess' ? '' : !full ? `<button class="x" data-act="full" title="${esc(u.full)}" aria-label="${esc(u.full)}">⛶</button>`
    : [['smooth', u.smooth], ['snap', u.steps]].map(([k, l]) => `<button class="${(k === 'snap') === MODE.snap ? 'on' : ''}" data-act="mode" data-k="${k}">${esc(l)}</button>`).join('')
      + (v === 'write' ? `<button data-act="back" ${canBack ? '' : 'disabled'}>${esc(W.phase === 'play' ? u.stop : u.back)}</button><button data-act="clear" ${canBack ? '' : 'disabled'}>${esc(u.clear)}</button>` : '')
      + `<button class="x" data-act="full" title="${esc(u.exit)}" aria-label="${esc(u.exit)}">✕</button>`;
  $('sqSecs').innerHTML = [['a', '🦇'], ['b', '🪞']].map(([k, emo]) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? emo : '🔒'} ${esc(t.secrets[k][0])}</button>`).join('');
  lab.setFacts(FACTS[v].map((f) => ({ emo: f.emo, src: f.src, text: f[lang] })));
  $('overlay').innerHTML = v === 'guess' && G.phase === 'ready' ? `<button class="sq-go" data-act="go">${esc(u.go)}</button>` : '';
  lastRead = '';
  if (v === 'play') renderPlay(t, u); else if (v === 'write') renderWrite(t, u); else renderGuess(t, u);
  if (S.sec && v !== 'guess') {
    const emo = S.sec === 'a' ? '🦇' : '🪞';
    lab.setReadout(emo, esc(t.secrets[S.sec][0]), '', '#f5c84c');
    lab.setState({ emo, title: t.secrets[S.sec][0], lead: t.secrets[S.sec][1], body: '', extra: '' });
  }
}
function renderPlay(t, u) {
  lab.setReadout('♪', esc(u.idleSub), '', '#c9a8ff');
  lab.setState({ emo: '🟪', title: u.playT, lead: u.playL, body: u.playB, extra: '' });
}
function renderWrite(t, u) {
  const n = W.strokes.length, d = W.strokes.filter(isDot).length;
  $('sqWrite').innerHTML = `<button class="sq-b main" data-act="back" ${W.strokes.length && W.phase !== 'rec' ? '' : 'disabled'}>${esc(W.phase === 'play' ? u.stop : u.back)}</button><button class="sq-b" data-act="clear" ${W.strokes.length && W.phase !== 'rec' ? '' : 'disabled'}>${esc(u.clear)}</button>`;
  if (W.phase === 'empty') {
    lab.setReadout('0:08', esc(u.empty), '', '#c9a8ff');
    lab.setState({ emo: '✏️', title: u.emptyT, lead: u.emptyL, body: '', extra: '' });
  } else if (W.phase === 'rec') {
    lab.setReadout('●', esc(u.rec), '', '#ff6b8b');
    lab.setState({ emo: '✏️', title: u.recT, lead: u.recL, body: '', extra: '' });
  } else {
    lab.setReadout(esc(u.counts(n - d, d)), esc(u.ready), '', '#3ddc97');
    lab.setState({ emo: '📜', title: u.doneT, lead: u.doneL, body: '', extra: '' });
  }
}
function renderGuess(t, u) {
  const rev = G.phase === 'reveal', off = !G.heard || G.phase === 'playing' || rev;
  $('sqCards').innerHTML = [0, 1, 2].map((pos) => `<button class="sq-card ${rev && G.order[pos] === 0 ? 'good' : ''} ${rev && G.guess === pos && G.order[pos] !== 0 ? 'bad' : ''}" data-act="pick" data-k="${pos}" ${off ? 'disabled' : ''} aria-label="${pos + 1}">${cardSvg(scoreOf(pos))}</button>`).join('');
  $('sqGRow').innerHTML = (G.phase === 'guess' ? `<button class="sq-b" data-act="replay">${esc(u.replay)}</button>` : '')
    + (rev ? `<button class="sq-b" data-act="replay">${esc(u.replay)}</button><button class="sq-b main" data-act="next">${esc(u.next)}</button>` : '');
  if (!rev) {
    lab.setReadout('?', esc(u.tuneNo(G.i + 1, ROUNDS.length)), '', '#c9a8ff');
    lab.setState({ emo: '🎭', title: u.hidT, lead: G.heard ? u.pick : u.hidL, body: '', extra: '' });
  } else {
    const ok = G.order[G.guess] === 0;
    lab.setReadout(ok ? '✓' : '✗', esc(u.tuneNo(G.i + 1, ROUNDS.length)), '', ok ? '#3ddc97' : '#ff9a3c');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? u.ok : u.no, lead: u.was(u.names[G.i]), body: ok ? '' : u.seeGlow, extra: '' });
  }
}
render();
</script>
</body>
</html>
