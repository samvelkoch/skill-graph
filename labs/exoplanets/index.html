  const zg = c.createRadialGradient(cx, cy, zl, cx, cy, zh); zg.addColorStop(0, 'rgba(61,220,151,.18)'); zg.addColorStop(0.5, 'rgba(61,220,151,.4)'); zg.addColorStop(1, 'rgba(61,220,151,.18)');

  pill(c, t.zone, cx, cy - zh - 11 < 12 ? cy - zh + 14 : cy - zh - 11, { align: 'c', W: w, col: 'rgba(61,220,151,.7)' });
  drawStar(c, cx, cy, 9, ['#ffd2b0', '#ff7a45', '#9a1f10'], '255,90,50');
  TP.forEach((p, i) => { S.tpAng[i] += (TAU * 1.25 * dt) / p[2]; });
  TP.forEach((p, i) => {
    const r = rOf(p[1]), x = cx + r * Math.cos(S.tpAng[i]), y = cy + r * Math.sin(S.tpAng[i]), inz = p[1] > TP_ZONE[0] && p[1] < TP_ZONE[1];
    c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.strokeStyle = S.tpSel === i ? 'rgba(255,255,255,.5)' : 'rgba(150,165,215,.2)'; c.lineWidth = 1; c.stroke();
    const pal = inz ? PLAN.zone : i < 3 ? PLAN.hot : PLAN.cold;
    if (S.tpSel === i) { c.beginPath(); c.arc(x, y, 12, 0, TAU); c.strokeStyle = '#fff'; c.lineWidth = 1.6; c.stroke(); }
    drawPlanet(c, x, y, 6.5, pal, -0.5, -0.5);
    c.font = '900 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#e6ebff';
    const dx = x - cx, dy = y - cy, dd = Math.max(1, Math.hypot(dx, dy)); c.fillText(p[0], x + (dx / dd) * 14, y + (dy / dd) * 14);
    p.x = x; p.y = y;
  });
  S.hzGeo = { cx, cy, Rm };
}

// --- the loop -------------------------------------------------------------------------------------------------
canvasLoop(cv, (c, w, h, dt, time) => {
  const v = lab.view, e = 1 - Math.exp(-dt * 5);
  D.Rp += (S.Rp - D.Rp) * e; D.a += (S.a - D.a) * e;
  if (v === 'tr' && !S.paused) { const ds = SPEED * dt; S.t += ds; S.phi += (TAU * ds) / periodOf(D.a); }
  c.save(); c.beginPath(); c.roundRect(0, 0, w, h, 20); c.clip();
  sky(c, w, h);
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (v === 'tr') drawTr(c, w, h, dt); else if (v === 'my') drawMy(c, w, h, dt, time); else drawHz(c, w, h, dt);
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------
$('sTr').innerHTML = `<div id="qBox"></div>
  <div id="freeBox" hidden>
    <div class="ex-row"><span id="lSize"></span><b id="vSize"></b></div>
    <input type="range" class="big" id="rSize" min="0" max="1000" step="1" style="--track:linear-gradient(90deg,#6aa8ff,#ffb35c)">
    <div class="chips" id="chSize"></div>
    <div class="ex-row"><span id="lDist"></span><b id="vDist"></b></div>
    <input type="range" class="big" id="rDist" min="0" max="1000" step="1" style="--track:linear-gradient(90deg,#ff9a5c,#7fb8ff)">
    <div class="ends"><span id="eNear"></span><span id="eFar"></span></div>
  </div>
  <div class="row2" id="trChips"></div>
  <p class="ex-fine" id="trFine"></p>`;
$('sMy').innerHTML = '<div id="myBox"></div>';
$('sHz').innerHTML = '<div id="hzBox"></div>';

const uOfSize = (Rp) => Math.round((Math.log(Rp) / Math.log(R_JUP)) * 1000);
const uOfDist = (a) => Math.round((Math.log(a / A_MIN) / Math.log(A_MAX / A_MIN)) * 1000);
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

// the small sketch of one option of a prediction: dashed = now, solid = the option
function sketch(qs, i) {
  const W = 100, Hh = 56, base = qs === 1 ? { Rp: 4, a: 0.08 } : { Rp: 8, a: 0.08 }, span = 36, t0 = 4;
  const mk = (Rp, a) => { const P = periodOf(a), ro = roOf(a), k = Rp / RS_RE; return (tt) => dipAt((TAU * (tt - t0)) / P, ro, k) * 100; };
  const f0 = mk(base.Rp, base.a), dep0 = depthPct(base.Rp);
  const fo = qs === 1 ? mk(base.Rp * Math.sqrt([2, 4, 1][i]), base.a) : mk(base.Rp, base.a * Math.pow([1, 2, Math.pow(2, 1.5)][i], 2 / 3));
  const sc = (Hh - 14) / (qs === 1 ? dep0 * 4.4 : dep0 * 1.4);
  const path = (f) => { let d = ''; for (let x = 0; x <= W; x += 1) d += `${x ? 'L' : 'M'}${x} ${(8 + f((x / W) * span) * sc).toFixed(1)}`; return d; };
  return `<svg viewBox="0 0 ${W} ${Hh}" aria-hidden="true"><rect width="${W}" height="${Hh}" rx="6" fill="rgba(8,10,22,.7)"/>
    <line x1="0" y1="8" x2="${W}" y2="8" stroke="rgba(200,215,255,.3)"/><path d="${path(f0)}" fill="none" stroke="#7b86a8" stroke-width="1.3" stroke-dasharray="3 3"/>
    <path d="${path(fo)}" fill="none" stroke="#ffd479" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

function renderTr(t) {
  const tr = t.tr, ph = S.ph, P = periodOf(S.a), dep = depthPct(S.Rp), free = ph === 4;
  lab.setGlow('rgba(255,190,90,.22)');
  $('qBox').hidden = free; $('freeBox').hidden = !free;
  if (!free) {
    const qs = ph < 2 ? 1 : 2, g = qs === 1 ? S.g1 : S.g2, cor = qs === 1 ? COR.c1 : COR.c2, rev = ph === 1 || ph === 3, opts = qs === 1 ? tr.o1 : tr.o2;
    setHTML($('qBox'), `<div class="ex-q">${esc(qs === 1 ? tr.q1 : tr.q2)}</div><p class="ex-sub">${esc(tr.hint)}</p><div class="ex-opts">${opts.map((o, i) =>
      `<button class="ex-opt ${rev ? (i === cor ? 'good' : i === g ? 'bad' : 'dim') : ''}" data-act="g" data-i="${i}"${rev ? ' disabled' : ''}>${sketch(qs, i)}<span>${esc(o)}</span></button>`).join('')}</div>${
      rev ? `<div class="ex-acts"><button class="btn" data-act="next">${esc(ph === 1 ? tr.next : tr.free)}</button></div>` : ''}`);
  } else {
    $('lSize').textContent = tr.size; $('vSize').textContent = fmt(S.Rp, S.Rp < 2 ? 1 : 1);
    $('lDist').textContent = tr.dist; $('vDist').textContent = auStr(S.a, 2);
    $('eNear').textContent = tr.near; $('eFar').textContent = tr.far;
    $('rSize').setAttribute('aria-label', tr.size); $('rDist').setAttribute('aria-label', tr.dist);
    const us = String(uOfSize(S.Rp)), ud = String(uOfDist(S.a));
    if ($('rSize').value !== us) $('rSize').value = us;
    if ($('rDist').value !== ud) $('rDist').value = ud;
    setHTML($('chSize'), [[1, tr.earth], [R_NEP, tr.nep], [R_JUP, tr.jup]].map(([r, n]) => `<button class="chip ex-chip ${Math.abs(S.Rp - r) < 0.02 ? 'on' : ''}" data-act="size" data-r="${r}">${esc(n)}</button>`).join(''));
  }
  const unlocked = secret.unlocked();
  setHTML($('trChips'), `${free ? `<button class="chip ex-chip" data-act="pause">${esc(S.paused ? tr.play : tr.pause)}</button>${S.wob ? '' : `<button class="chip ex-chip" data-act="zoom">${esc(tr.zoom(S.zoom))}</button>`}` : ''}
    <button class="chip secret ex-chip ${unlocked ? 'open' : ''} ${S.wob ? 'on' : ''}" data-act="wob">${unlocked ? esc(t.wb.chip) : '🔒 ???'}</button>`);
  $('trFine').textContent = tr.fine;
  if (S.wob) {
    const tug = (100 * Math.pow(S.Rp / R_JUP, 2)) / Math.sqrt(S.a / 0.05);
    lab.setReadout(fmt(tug, tug < 10 ? 1 : 0), t.wb.sub, '', '#7fb0ff');
    lab.setState({ emo: '🌀', title: t.wb.title, lead: t.wb.lead, body: t.wb.body, extra: '' });
    lab.setFacts(t.facts.wb); return;
  }
  lab.setReadout(pct(dep), tr.dipSub, tr.pill(days(P)), '#ffd479');
  const ok = (qs, g) => g === (qs === 1 ? COR.c1 : COR.c2);
  if (ph === 0 || ph === 2) lab.setState({ emo: '🤔', title: tr.askT, lead: tr.askL, body: '', extra: '' });
  else if (ph === 1) lab.setState({ emo: ok(1, S.g1) ? '✅' : '🤔', title: ok(1, S.g1) ? tr.ok : tr.no, lead: tr.r1(pct(depthPct(4)), pct(depthPct(8))), body: '', extra: '' });
  else if (ph === 3) lab.setState({ emo: ok(2, S.g2) ? '✅' : '🤔', title: ok(2, S.g2) ? tr.ok : tr.no, lead: tr.r2(days(periodOf(0.08)), days(periodOf(0.16)), fmt(Math.pow(2, 1.5), 1)), body: '', extra: '' });
  else if (dep < 0.03 && S.zoom === 1) lab.setState({ emo: '🔍', title: tr.tinyT, lead: tr.tinyL(pct(dep)), body: tr.freeB, extra: '' });
  else lab.setState({ emo: '🌑', title: tr.freeT(pct(dep)), lead: tr.freeL(sizeStr(S.Rp), days(P)), body: tr.freeB, extra: '' });
  lab.setFacts(t.facts.tr);
}

function renderMy(t) {
  const m = t.my, pz = S.pz, two = pz.level === 2, unlocked = S.g1 !== null;
  lab.setGlow('rgba(127,200,255,.2)');
  lab.setReadout(pct(S.hd), m.sub, m.pill(days(Math.abs(S.v2 - S.v1))), '#ff9fb4');
  let html;
  if (!unlocked) {
    html = `<div class="ex-lock"><p><b>${esc(m.lockT)}</b></p><p>${esc(m.lockL)}</p><button class="btn" data-act="golight">${esc(m.lockB)}</button></div>`;
  } else {
    const grp = (label, key, labels, correct) => `<div class="ex-grp"><div class="ex-row"><span>${esc(label)}</span></div><div class="chips">${labels.map((l, i) => {
      const cls = S.checked ? (i === correct ? 'ex-good' : i === S.sel[key] ? 'ex-bad' : '') : '';
      return `<button class="chip ex-chip ${S.sel[key] === i && !S.checked ? 'on' : ''} ${cls}" data-act="m${key}" data-i="${i}"${S.checked ? ' disabled' : ''}>${esc(l)}</button>`;
    }).join('')}</div></div>`;
    html = `<div class="chips"><button class="chip ex-chip ${!two ? 'on' : ''}" data-act="lvl" data-l="1">${esc(m.lvl1)}</button><button class="chip ex-chip ${two ? 'on' : ''}" data-act="lvl" data-l="2">${esc(m.lvl2)}</button></div>
      ${grp(two ? m.q1b : m.q1, 'size', m.sizes, pz.sizeAns)}${grp(two ? m.q2b : m.q2, 'year', pz.years.map((y) => days(y)), pz.years.indexOf(pz.yearAns))}
      <div class="ex-acts">${S.checked ? `<button class="btn" data-act="newstar">${esc(m.newStar)}</button>` : `<button class="btn" data-act="check"${S.sel.size === null || S.sel.year === null ? ' disabled' : ''}>${esc(m.check)}</button>`}</div>
      <p class="ex-fine">${esc(m.guide(pct(depthPct(1)), pct(depthPct(R_NEP)), pct(depthPct(R_JUP))))}</p>`;
  }
  setHTML($('myBox'), html);
  if (S.checked) {
    const big = pz.planets[0], small = pz.planets[two ? 1 : 0];
    const sizeOk = S.sel.size === pz.sizeAns, yearOk = pz.years[S.sel.year] === pz.yearAns;
    lab.setState({ emo: sizeOk && yearOk ? '✅' : '🤔', title: sizeOk && yearOk ? m.ok : sizeOk || yearOk ? m.half : m.no,
      lead: two ? m.t1b(pct(big.depth), sizeStr(big.R)) : m.t1(pct(big.depth), sizeStr(big.R)), body: two ? m.t2b(days(small.P)) : m.t2(days(small.P)), extra: '' });
  } else lab.setState({ emo: '🔎', title: m.askT, lead: two ? m.askL2 : m.askL1, body: m.drag, extra: '' });
  lab.setFacts(t.facts.my);
}

function renderHz(t) {
  const h = t.hz, st = statusOf(S.ahz, S.star), pred = S.hzPred, unlocked = secret.unlocked();
  lab.setGlow(S.trap ? 'rgba(255,110,70,.22)' : 'rgba(61,220,151,.2)');
  let html = '';
  if (!S.trap) {
    html += `<div class="ex-q">${esc(h.q)}</div><div class="ex-opts txt">${h.o.map((o, i) =>
      `<button class="ex-opt ${pred !== null ? (i === 2 ? 'good' : i === pred ? 'bad' : 'dim') : ''}" data-act="hzg" data-i="${i}"${pred !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
    if (pred !== null) html += `<div class="chips ex-grp">${['red', 'sun', 'hot'].map((k) => `<button class="chip ex-chip ${S.star === k ? 'on' : ''}" data-act="star" data-k="${k}">${esc(h.stars[k])}</button>`).join('')}</div>`;
    html += `<p class="ex-fine">${esc(h.zoneLine)}</p><p class="ex-fine">${esc(h.drag)} ${esc(h.fine)}</p>`;
  }
  html += `<div class="row2"><button class="chip secret ex-chip ${unlocked ? 'open' : ''} ${S.trap ? 'on' : ''}" data-act="trap">${unlocked ? esc(t.tp.chip) : '🔒 ???'}</button></div>`;
  setHTML($('hzBox'), html);
  if (S.trap) {
    const sel = S.tpSel >= 0 ? TP[S.tpSel] : null;
    lab.setReadout(sel ? days(sel[2]) : '7', sel ? t.tp.selT(sel[0].toUpperCase()) : t.tp.sub, '', '#ff8a55');
    lab.setState(sel ? { emo: '🪐', title: t.tp.selT(sel[0]), lead: t.tp.selL(days(sel[2]), auStr(sel[1], 3)), body: t.tp.selB(fmt(sel[3], 2)), extra: '' }
      : { emo: '🪐', title: t.tp.title, lead: t.tp.lead, body: t.tp.body, extra: '' });
    lab.setFacts(t.facts.tp); return;
  }
  lab.setReadout(auStr(S.ahz, S.ahz < 1 ? 2 : 1), h.sub(h.names[S.star]), h[st], PCOL[st]);
  const emo = { hot: '🔥', zone: '💧', cold: '❄️' }[st], lead = { hot: h.leadHot, zone: h.leadZone, cold: h.leadCold }[st];
  const extra = pred !== null ? `<b>${esc(pred === 2 ? h.ok : h.no)}</b> ${esc(h.rv)}` : '';
  lab.setState({ emo, title: h[st], lead, body: st === 'zone' ? h.zoneLine : '', extra });
  lab.setFacts(t.facts.hz);
}

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('sTr').hidden = v !== 'tr'; $('sMy').hidden = v !== 'my'; $('sHz').hidden = v !== 'hz';
  if (v === 'tr') renderTr(t); else if (v === 'my') renderMy(t); else renderHz(t);
}

// --- events --------------------------------------------------------------------------------------------------
$('rSize').addEventListener('input', (ev) => { S.Rp = Math.exp((Math.log(R_JUP) * +ev.target.value) / 1000); sfx.tick(); render(); });
$('rDist').addEventListener('input', (ev) => { S.a = A_MIN * Math.exp((Math.log(A_MAX / A_MIN) * +ev.target.value) / 1000); sfx.tick(); render(); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'g') { // a prediction in the Light view
    S.wob = false;
    if (S.ph === 0) { S.g1 = i; S.ph = 1; S.Rp = 8; S.ghost = depthPct(4); } else { S.g2 = i; S.ph = 3; S.a = 0.16; S.ghost = null; }
    (i === (S.ph === 1 ? COR.c1 : COR.c2) ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next') { S.ghost = null; S.ph = S.ph === 1 ? 2 : 4; sfx.click(); }
  else if (act === 'size') { S.Rp = +b.dataset.r; sfx.click(); }
  else if (act === 'zoom') { S.zoom = S.zoom === 1 ? 10 : S.zoom === 10 ? 100 : 1; sfx.click(); }
  else if (act === 'pause') { S.paused = !S.paused; sfx.click(); }
  else if (act === 'wob') { if (!secret.unlocked()) return secret.open(); S.wob = !S.wob; sfx.click(); }
  else if (act === 'golight') { $('views').querySelector('[data-view=tr]')?.click(); return; }
  else if (act === 'lvl') { S.lvl = +b.dataset.l; resetPuzzle(); sfx.click(); }
  else if (act === 'msize') { S.sel.size = i; sfx.tick(); }
  else if (act === 'myear') { S.sel.year = i; sfx.tick(); }
  else if (act === 'check') {
    S.checked = true;
    (S.sel.size === S.pz.sizeAns && S.pz.years[S.sel.year] === S.pz.yearAns ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'newstar') { resetPuzzle(); sfx.click(); }
  else if (act === 'hzg') { // the prediction in the Zone view: the star is swapped for the hot one
    S.hzPred = i; S.star = 'hot'; (i === 2 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'star') { S.star = b.dataset.k; sfx.click(); }
  else if (act === 'trap') { if (!secret.unlocked()) return secret.open(); S.trap = !S.trap; S.tpSel = -1; sfx.click(); }
  render();
});
function resetPuzzle() { S.pz = genPuzzle(S.lvl); S.hd = 0; S.v1 = 5; S.v2 = 15; S.sel = { size: null, year: null }; S.checked = false; }
// dragging on the picture: handles in the Case view, the planet in the Zone view
const at = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
function dragTo(x, y) {
  const v = lab.view;
  if (v === 'my' && S.geo) {
    const g = S.geo, tt = clamp(((x - g.L.cl) / (g.L.cr - g.L.cl)) * PWIN, 0, PWIN);
    if (S.drag === 'h') S.hd = clamp(g.dOf(y), 0, 1.3 * g.D0); else if (S.drag === 'v1') S.v1 = tt; else if (S.drag === 'v2') S.v2 = tt;
  } else if (v === 'hz' && S.drag === 'planet' && S.hzGeo) {
    const g = S.hzGeo, dx = x - g.cx, dy = y - g.cy;
    S.ang = Math.atan2(dy, dx); S.ahz = aOfR(Math.hypot(dx, dy), g.Rm);
    const st = statusOf(S.ahz, S.star);
    if (st !== S.hzWas) { if (st === 'zone') sfx.good(); S.hzWas = st; }
  }
  render();
}
cv.addEventListener('pointerdown', (ev) => {
  const [x, y] = at(ev), v = lab.view;
  if (v === 'my' && S.geo) {
    const g = S.geo, inY = y > g.L.ct - 10 && y < g.L.cb + 10;
    const sc = [['h', Math.min(Math.hypot(x - g.hx, y - g.hy) - 8, x > g.L.cl ? Math.abs(y - g.hy) : 99)], ['v1', Math.min(Math.hypot(x - g.x1, y - g.vy) - 8, inY ? Math.abs(x - g.x1) : 99)], ['v2', Math.min(Math.hypot(x - g.x2, y - g.vy) - 8, inY ? Math.abs(x - g.x2) : 99)]].sort((p, q) => p[1] - q[1])[0];
    if (sc[1] > 26) return;
    S.drag = sc[0]; cv.setPointerCapture(ev.pointerId); dragTo(x, y);
  } else if (v === 'hz' && S.hzGeo) {
    if (S.trap) {
      let best = -1, bd = 26;
      TP.forEach((p, i) => { const d = Math.hypot(x - p.x, y - p.y); if (d < bd) { bd = d; best = i; } });
      S.tpSel = best; if (best >= 0) sfx.click(); render();
    } else { S.drag = 'planet'; cv.setPointerCapture(ev.pointerId); dragTo(x, y); }
  }
});
cv.addEventListener('pointermove', (ev) => { if (S.drag) { const [x, y] = at(ev); dragTo(x, y); } });
['pointerup', 'pointercancel'].forEach((e) => cv.addEventListener(e, () => { S.drag = null; }));

render();
</script>
</body>
</html>
