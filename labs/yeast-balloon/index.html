function limb(c, x1, y1, r1, x2, y2, r2, c1, c2) { // tapered capsule with a light-to-dark gradient across it
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, a = Math.atan2(dy, dx);
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, rm = (r1 + r2) / 2;
  const g = c.createLinearGradient(mx + nx * rm, my + ny * rm, mx - nx * rm, my - ny * rm); g.addColorStop(0, c1); g.addColorStop(1, c2 || c1);

const TMAX = 60, NST = 120, TSPEED = TMAX / 13, K_SUG = 0.8, K_RATE = 0.12, COLD = 5, WARM = 35, HOT = 70;
const act = (Tc) => (Tc <= 33 ? 0.02 + 0.98 * Math.exp(-(((Tc - 33) / 14) ** 2)) : Math.exp(-(((Tc - 33) / 11) ** 2))) * (1 - smooth(48, 58, Tc));
function sim(Tc, s0) { // sugar eaten at a rate that rises with warmth and saturates with sugar; balloon size = share of 3 spoons turned into gas
  const out = new Float32Array(NST + 1), a = act(Tc);
  let s = s0;
  for (let i = 1; i <= NST; i++) { s = Math.max(0, s - K_RATE * a * s / (K_SUG + s) * 0.5); out[i] = (s0 - s) / 3; }
  return out;
}
const vAt = (arr, clock) => { const f = clamp(clock / 0.5, 0, NST), i = Math.min(NST - 1, Math.floor(f)); return arr[i] + (arr[i + 1] - arr[i]) * (f - i); };
const rateAt = (arr, clock) => { const i = Math.min(NST - 1, Math.floor(clamp(clock / 0.5, 0, NST))); return clamp((arr[i + 1] - arr[i]) / 0.5 / 0.03, 0, 1); };

// --- steps ---------------------------------------------------------------------------------------------------------
function stepRun(dt) {
  const R = S.run;
  S.mv += ((R.phase === 'run' ? 1 : 0) - S.mv) * Math.min(1, dt * 5);
  const capEff = CAP * (S.thin ? THIN : 1);
  if (R.phase === 'run') {
    let rem = dt * R.ts;
    while (rem > 1e-6 && R.phase === 'run') {
      const d = Math.min(rem, 0.1); rem -= d;
      R.supply += (Math.min(R.need, capEff) - R.supply) / TAU * d;
      const def = Math.max(0, R.need - R.supply);
      R.L = clamp(R.L + (A_LAC * def - 0.02 * R.L) * d, 0, 1.2);
      R.speed = R.v0 * (1 - 0.45 * smooth(0.65, 1.05, R.L));
      R.d += R.speed * d; R.t += d;
      if (R.burnAt === null && R.L > 0.65) R.burnAt = Math.min(R.d, 100);
      if (R.d >= 100) { R.d = 100; R.speed = 0; R.R = clamp(R.supply / capEff, 0, 1); R.phase = S.pan === null ? 'stopped' : 'recover'; }
    }
  } else {
    R.speed = 0;
    if (R.phase === 'recover') {
      R.L = Math.max(0, R.L - 0.3 * R.L * dt); R.R += (R.L - R.R) / 1.2 * dt;
      R.supply += (0.1 - R.supply) / 6 * dt;
      if (R.L < 0.03) { R.L = 0; R.R = 0; R.supply = 0.1; R.phase = 'done'; }
    } else if (R.phase === 'idle' || R.phase === 'done') { R.L = Math.max(0, R.L - 0.3 * R.L * dt); R.supply += (0.1 - R.supply) / 6 * dt; }
  }
}
function stepAtp(dt) { S.coinT = Math.min(1, S.coinT + dt / 1.6); S.hlT = Math.max(0, S.hlT - dt); }
function stepAll(dt) {
  if (lab.view === 'yeast') { if (S.running) { S.clock = Math.min(TMAX, S.clock + dt * TSPEED); if (S.clock >= TMAX) S.running = false; } }

}

  if (S.sweep) return { st: { emo: '🌡️', title: y.sweepTitle, lead: y.sweepLead, body: '', extra: fine }, ro, facts, glow: 'rgba(255,179,71,.24)' };
  if (S.running) return { st: { emo: '🫧', title: `${S.ok1 ? t.right : t.notThis} ${y.watch}`, lead: y.runLead, body: '', extra: fine }, ro, facts, glow: 'rgba(255,179,71,.24)' };
  const fin = ss.map((a) => a[NST]), win = fin.indexOf(Math.max(...fin));
  return { st: { emo: '🏆', title: win === 1 && mid >= 25 && mid <= 40 ? y.doneWarm : y.doneAny(S.temps[win]), lead: y.doneLead, body: y.doneBody, extra: fine }, ro, facts, glow: 'rgba(255,179,71,.24)' };
}
function liveS() {
  const t = T[lang], sp = t.sp, R = S.run, fine = `<div class="fine" style="font-size:11px;color:var(--faint)">${esc(t.fine)}</div>`;
  const ro = [`${Math.round(R.d)} ${sp.m}`, sp.lacSub(sp.lv[lacLevel(R.L)]), R.phase === 'run' ? (Math.max(0, R.need - R.supply) > 0.05 ? sp.pillAn : sp.pillAer) : '', '#ff7a4a'];
  const burn = R.burnAt !== null ? sp.burnAt(Math.round(R.burnAt)) : '';
  const facts = S.pan !== null && (R.phase === 'recover' || R.phase === 'done') ? sp.facts.map(([text, src, emo]) => ({ text, src, emo })) : [];
  let st;
  if (R.phase === 'run') {
    const note = [R.startL > 0.3 ? sp.carry : '', S.thin ? sp.thinNote : ''].filter(Boolean).join(' ');
    st = R.need < 0.5 ? { emo: '🏃', title: sp.jogTitle, lead: sp.jogLead } : R.L > 0.65 ? { emo: '🔥', title: sp.burnTitle, lead: sp.burnLead } : { emo: '🏃', title: sp.sprintTitle, lead: sp.sprintLead };
    st.body = note; st.extra = fine;
  } else if (R.phase === 'stopped') st = { emo: '🥵', title: sp.stopTitle, lead: sp.stopLead, body: burn, extra: fine };
  else if (R.phase === 'recover') st = { emo: '🫁', title: sp.recTitle, lead: sp.recLead, body: `${sp.recBody} ${burn}`.trim(), extra: fine };
  else if (R.ran) st = { emo: '😌', title: sp.restTitle, lead: sp.restLead, body: burn, extra: fine };
  else st = { emo: '🏁', title: sp.idleTitle, lead: sp.idleLead, body: '', extra: fine };
  return { st, ro, facts, glow: 'rgba(255,122,74,.24)' };
}
function liveA() {
  const t = T[lang], at = t.at, n = SORT.length, e = 1 - (1 - S.coinT) ** 3, done = S.sortAt >= n;
  const ro = [`~${Math.round(30 * e)} vs ${Math.round(2 * e)}`, at.sub, `${S.sortOk}/${Math.min(S.sortAt + (S.last ? 1 : 0), n)}`, '#ffd76a'];
  let st;
  if (S.last) { const it = SORT[S.last.i], tx = at.items[it[0]]; st = { emo: S.last.ok ? '✅' : '🤔', title: S.last.ok ? t.right : at.wrong(it[1]), lead: tx[1], body: '', extra: '' }; }
  else if (done) st = { emo: '🏆', title: at.endTitle(S.sortOk, n), lead: at.endLead, body: '', extra: '' };
  else st = { emo: '🪙', title: at.startTitle, lead: at.startLead, body: '', extra: '' };
  const facts = done && !S.last ? at.facts.map(([text, src, emo]) => ({ text, src, emo })) : [];
  return { st, ro, facts, glow: 'rgba(255,215,106,.24)' };
}
let lastLive = '';
function updateLive() {
  const v = lab.view, o = v === 'yeast' ? liveY() : v === 'sprint' ? liveS() : liveA();
  const key = JSON.stringify([lang, v, o.st, o.ro, o.facts.length]);
  if (key === lastLive) return;
  lastLive = key;
  lab.setGlow(o.glow); lab.setState(o.st); lab.setReadout(...o.ro); lab.setFacts(o.facts);
}

// --- controls ------------------------------------------------------------------------------------------------------
const uiKey = () => {
  const v = lab.view;
  if (v === 'yeast') return `y|${lang}|${S.pick1 === null}|${S.sweep}|${secret.unlocked()}`;
  if (v === 'sprint') return `s|${lang}|${S.pan === null}|${S.run.phase}|${S.pace}|${S.thin}|${secret.unlocked()}`;
  return `a|${lang}|${S.sortAt}|${S.last ? S.last.i : -1}`;
};
let lastUi = '';
function render() {
  lastUi = uiKey(); lastLive = '';
  const t = T[lang], v = lab.view, open = secret.unlocked();
  const sec = (k, emo, on) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  if (v === 'yeast') {
    const y = t.y;
    if (S.pick1 === null) {
      yb.innerHTML = `<div class="yb-qt">${esc(y.q)}</div><div class="yb-opts">${y.opts.map((o, i) => `<button class="chip yb-opt" data-act="pick1" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    } else {
      yb.innerHTML = `<div class="yb-lbl"><span>${esc(y.sugar)}</span></div>
        <input class="big" id="sugar" type="range" min="1" max="3" step="0.5" value="${S.sugar}" style="--track:linear-gradient(90deg,#3a4160,#e8c36a)" aria-label="${esc(y.sugar)}">
        <div class="ends"><span>${esc(y.sugarEnds[0])}</span><span>${esc(y.sugarEnds[1])}</span></div>
        <div class="yb-lbl"><span>${esc(y.bath)}</span><b id="tv">${S.temps[1]} °C</b></div>
        <input class="big" id="tmid" type="range" min="5" max="70" step="5" value="${S.temps[1]}" aria-label="${esc(y.bath)}">
        <div class="ends"><span>5 °C</span><span>70 °C</span></div>
        <div class="row2" style="margin-top:2px"><button class="chip" data-act="fresh">${esc(y.fresh)}</button>${sec('sweep', '🌡️', S.sweep)}</div>
        <div class="yb-note">${esc(y.freshNote)}</div>`;
    }
  } else if (v === 'sprint') {
    const sp = t.sp, R = S.run, running = R.phase === 'run', ask = R.phase === 'stopped' && S.pan === null, jogOk = S.pan !== null;
    if (ask) yb.innerHTML = `<div class="yb-qt">${esc(sp.q)}</div><div class="yb-opts">${sp.opts.map((o, i) => `<button class="chip yb-opt" data-act="pan" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    else yb.innerHTML = `<div class="row2" style="margin-top:0"><button class="chip ${S.pace === 'sprint' ? 'on' : ''}" data-act="pace" data-p="sprint"${running ? ' disabled' : ''}>${esc(sp.sprint)}</button>
      <button class="chip ${S.pace === 'jog' ? 'on' : ''} ${jogOk ? '' : 'yb-lock'}" data-act="pace" data-p="jog"${running || !jogOk ? ' disabled' : ''}>${jogOk ? '' : '🔒 '}${esc(sp.jog)}</button>
      <button class="btn push" data-act="run"${running ? ' disabled' : ''}>${esc(running ? sp.running : R.ran ? sp.again : sp.run)}</button></div>
      <div class="row2">${sec('thin', '⛰️', S.thin).replace('data-act="sec"', `data-act="sec"${running ? ' disabled' : ''}`)}${jogOk ? '' : `<span class="yb-note" style="margin:0">${esc(sp.jogLock)}</span>`}</div>`;
  } else {
    const at = t.at, n = SORT.length;
    let h = `<div class="row2" style="margin-top:0"><button class="chip" data-act="replay3">${esc(at.replay)}</button></div>`;
    if (S.last) h += `<div class="yb-item" style="margin-top:12px">${esc(at.items[SORT[S.last.i][0]][0])}</div><button class="btn" data-act="next3">${esc(S.sortAt + 1 >= n ? at.last : at.next)}</button>`;
    else if (S.sortAt < n) h += `<div class="yb-item" style="margin-top:12px">${esc(at.items[SORT[S.sortAt][0]][0])}</div><div class="yb-qt" style="font-size:13px;color:var(--soft)">${esc(at.sortQ)}</div>
      <div class="yb-two"><button class="chip" data-act="sort" data-a="1">${esc(at.with)}</button><button class="chip" data-act="sort" data-a="0">${esc(at.without)}</button></div>`;
    else h += `<div class="row2"><button class="btn" data-act="resort">${esc(at.again)}</button></div>`;
    yb.innerHTML = h;
  }
  updateLive();
}

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
};
function startRun() {
  const R = S.run;
  if (R.phase === 'run' || (R.phase === 'stopped' && S.pan === null)) return;
  const jog = S.pace === 'jog' && S.pan !== null;
  R.need = jog ? 0.32 : 1; R.v0 = jog ? 2.6 : 6.5; R.ts = jog ? 3 : 1; R.d = 0; R.t = 0; R.burnAt = null; R.startL = R.L; R.phase = 'run'; R.ran = true; R.speed = R.v0;
  S.p2 = []; sfx.click(); showStage(); render();
}
yb.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'pick1') { const i = +b.dataset.i; S.pick1 = i; S.ok1 = i === 1; (S.ok1 ? sfx.good : sfx.bad)(); restartY(); showStage(); }
  else if (act === 'fresh') { restartY(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'sweep') S.sweep = !S.sweep; else if (S.run.phase !== 'run') S.thin = !S.thin;
    sfx.click();
  } else if (act === 'pace') { S.pace = b.dataset.p; sfx.tick(); }
  else if (act === 'run') { startRun(); return; }
  else if (act === 'pan') { const i = +b.dataset.i; S.pan = i; S.panOk = i === 1; (S.panOk ? sfx.good : sfx.bad)(); if (S.run.phase === 'stopped') S.run.phase = 'recover'; showStage(); }
  else if (act === 'replay3') { S.coinT = 0; sfx.click(); }
  else if (act === 'sort') {
    const a = b.dataset.a === '1', it = SORT[S.sortAt], ok = a === it[1];
    S.last = { i: S.sortAt, ok }; if (ok) S.sortOk++; S.hl = it[1] ? 'a' : 'n'; S.hlT = 1.6; (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next3') { S.last = null; S.sortAt++; S.hl = null; sfx.tick(); }
  else if (act === 'resort') { S.sortAt = 0; S.sortOk = 0; S.last = null; S.hl = null; sfx.click(); }
  render();
});
yb.addEventListener('input', (ev) => {
  if (ev.target.id === 'sugar') S.sugar = +ev.target.value;
  else if (ev.target.id === 'tmid') { S.temps[1] = +ev.target.value; const tv = $('tv'); if (tv) tv.textContent = `${S.temps[1]} °C`; }
  else return;
  restartY(); updateLive();
});

// --- the loop ----------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  SC = Math.min(w / DW, h / DH);
  stepAll(dt);
  c.save(); c.translate((w - DW * SC) / 2, (h - DH * SC) / 2); c.scale(SC, SC);
  panelBg(c);
  c.lineCap = 'butt'; c.lineJoin = 'miter';
  if (lab.view === 'yeast') drawYeast(c, dt, time); else if (lab.view === 'sprint') drawSprint(c, dt, time); else drawAtp(c, dt, time);
  c.restore();
  if (uiKey() !== lastUi) render(); else updateLive();
});
render();
</script>
</body>
</html>
