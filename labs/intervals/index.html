// --- state -------------------------------------------------------------------------------------------------

// --- sound: a soft piano-like tone (a sine, a quiet octave above and a hint of the 3rd partial, fast decay) -------

// --- drawing -----------------------------------------------------------------------------------------------

// --- the picture's loop ------------------------------------------------------------------------------------
function stepScene(dt, now) {
  SC.v += ((SC.lo - SC.loA) * 130 - SC.v * 14) * dt; SC.loA += SC.v * dt; // a slightly springy glide
  if (Math.abs(SC.lo - SC.loA) < 0.002 && Math.abs(SC.v) < 0.01) { SC.loA = SC.lo; SC.v = 0; }
  const hp = SC.hop;
  if (hp) {
    const p = clamp((now - hp.t0) / HOP_DT, 0, hp.n);
    while (hp.fired < Math.floor(p + 1e-9)) { hp.fired++; sfx.tick(); ping(SC.lo + hp.fired, 0, hue(hp.fired / hp.n)); }
    SC.p = p;
    if (p >= hp.n && !hp.endAt) hp.endAt = now + 0.35;
    if (hp.endAt && now >= hp.endAt) { SC.hop = null; SC.p = null; hp.cb?.(); }
  }
}

// --- the shell ---------------------------------------------------------------------------------------------
const mode = () => S.sec ?? lab.view;
const lab = shell({ key: 'intervals', T, topics: TOPICS, views: ['count', 'slide', 'ear'], onLang: () => render(), onView: () => { epoch++; S.sec = null; enter(); render(); } });
const secret = secretLab('intervals', () => ({
  secrets: [{ emo: '📏', title: T[lang].secrets.pyth[0], desc: T[lang].secrets.pyth[1] }, { emo: '😈', title: T[lang].secrets.devil[0], desc: T[lang].secrets.devil[1] }],
  questions: T[lang].quiz,
}), () => render());
const cv = $('cv');
// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

// --- the shared scene: where the pins are, whether the hops and the bar show -------------------------------
function snapScene(lo, size, o = {}) {
  SC.lo = SC.loA = lo; SC.v = 0; SC.size = size; SC.showHi = o.showHi ?? true; SC.arc = o.arc ?? false; SC.p = null; SC.hop = null; SC.loAt = SC.hiAt = nowS();
}
function startHop(n, cb) { // the dot hops from key to key; one soft click per hop
  SC.arc = true;
  if (n <= 0) { SC.p = null; cb?.(); return; }
  SC.hop = { n, t0: nowS() + 0.15, fired: 0, cb, endAt: 0 }; SC.p = 0;
}

// --- count -------------------------------------------------------------------------------------------------
function loadCount() { const [lo, hi] = PAIRS[C.i]; C.phase = 'ask'; C.guess = null; snapScene(lo, hi - lo, { arc: false }); }
function countGuess(n) {
  if (C.phase !== 'ask') return;
  const [lo, hi] = PAIRS[C.i]; C.guess = n; C.phase = 'hop'; sfx.click();
  startHop(hi - lo, () => { C.phase = 'done'; C.right[C.i] = C.guess === hi - lo; (C.right[C.i] ? sfx.good : sfx.bad)(); render(); showStage(); });
  render();
}
function countNext() {
  if (C.phase === 'done') { C.i++; if (C.i >= 6) { C.phase = 'sum'; snapScene(0, 12, { arc: true }); } else loadCount(); }
  else if (C.phase === 'sum') { Object.assign(C, { i: 0, phase: 'ask', guess: null, right: [] }); loadCount(); }
  sfx.click(); render();
}

// --- slide (and the tritone secret) ---------------------------------------------------------------------------
function movePair(n) {
  const m = mode(), max = m === 'devil' ? 12 : NS - SC.size; n = clamp(n, 0, max);
  if (n === SC.lo) return;
  if (m === 'slide' && (SL.stage === 0 || SL.stage === 2)) return; // the prediction comes first
  const step = Math.sign(n - SC.lo); let reveal = 0;
  while (SC.lo !== n) {
    SC.lo += step;
    if (m === 'slide') {
      if (SL.stage === 1 && SC.lo === 2) { SL.stage = 2; SL.ok1 = SL.g1 === A1; reveal = 1; }
      else if (SL.stage === 3 && SC.lo === 11) { SL.stage = 4; SL.ok2 = SL.g2 === A2; reveal = 2; }
    }
    if (reveal) break; // stop on the key that answers the question
  }
  (m === 'devil' ? D : SL).lo = SC.lo;
  wantSound(); playTogether(SC.lo, SC.lo + SC.size);
  if (reveal) { const ok = reveal === 1 ? SL.ok1 : SL.ok2; later(450, () => { (ok ? sfx.good : sfx.bad)(); showStage(); }); }
  render();
}
function slGuess(pc) {
  if (SL.stage === 0) { SL.g1 = pc; SL.stage = 1; } else if (SL.stage === 2) { SL.g2 = pc; SL.stage = 3; } else return;
  sfx.click(); render();
}

// --- ear ---------------------------------------------------------------------------------------------------
function newBag() { // 8 rounds: each of the five jumps once, three more at random, never the same twice in a row
  for (let tries = 0; tries < 60; tries++) {
    const bag = shuffle([0, 1, 2, 3, 4, ...[0, 1, 2].map(() => Math.floor(Math.random() * 5))]);
    if (bag.every((v, i) => i === 0 || v !== bag[i - 1])) return bag;
  }
  return [0, 3, 1, 4, 2, 3, 0, 1];
}
const curIv = () => IVS[E.bag[Math.min(E.round, 7)]];
function earNewRound() {
  E.root = Math.floor(Math.random() * 8); E.heard = false; E.picked = null; E.phase = 'ask';
  if (E.v && E.v.kind !== 'q') E.v = null;
  snapScene(E.root, curIv().n, { showHi: false, arc: false }); // the high pin and the hops stay hidden until the answer
}
function earScene() { const shown = E.phase !== 'ask'; snapScene(E.root, curIv().n, { showHi: shown, arc: shown }); }
function earAnswerQ(v) { // the same jump from C, then from F: a demo
  E.qDone = true; E.qOk = v === 'yes'; E.v = { ok: E.qOk, kind: 'q' }; E.demoing = true;
  (E.qOk ? sfx.good : sfx.bad)();
  snapScene(0, 7, { arc: true }); wantSound(); playMelodic(0, 7); startHop(7, null);
  later(2600, () => { SC.arc = false; SC.lo = 5; });
  later(3300, () => { playMelodic(5, 12); startHop(7, null); });
  later(6000, () => { E.demoing = false; earNewRound(); render(); });
  render(); showStage();
}
function earListen() {
  ensureSound();
  if (E.demoing) { E.demoing = false; epoch++; earNewRound(); }
  if (E.v && E.v.kind === 'q') E.v = null;
  playMelodic(E.root, E.root + curIv().n); E.heard = true; render();
}
function earPick(k) {
  if (E.phase !== 'ask' || !E.heard) return;
  const iv = curIv(), ok = k === iv.k;
  E.picked = k; E.phase = 'answered'; E.last = iv.n; E.v = { ok, kind: 'r' }; if (ok) E.score++;
  (ok ? sfx.good : sfx.bad)();
  SC.showHi = true; SC.hiAt = nowS(); startHop(iv.n, null); render(); showStage();
}
function earNext() {
  if (E.phase === 'answered') { if (E.round >= 7) E.phase = 'end'; else { E.round++; earNewRound(); } }
  else if (E.phase === 'end') { Object.assign(E, { round: 0, score: 0, bag: newBag(), v: null, last: null }); earNewRound(); }
  sfx.click(); render();
}

// --- the monochord -----------------------------------------------------------------------------------------
function setBridge(x) {
  const G = monoGeo(); Y.f = snapF(clamp((x - G.nut) / (G.end - G.nut), 0.3, 1));
  const sl = $('ivBr'); if (sl) sl.value = Y.f * 100;

}
function pluck() {
  ensureSound();
  const sem = semisOf(Y.f), two = Y.f < 0.97; // the whole string first, then the shortened one
  tone(0, 0, 1, 1.6); ping(0, 0, TEAL);
  if (two) { tone(sem, 0.65, 1, 1.8); ping(clamp(Math.round(sem), 0, NS), 0.65, CORAL); }
  Y.pluck = { at: nowS() + (two ? 0.65 : 0) };
}

// --- entering a view, and the controls ---------------------------------------------------------------------
function enter() {
  SC.hop = null; SC.p = null;
  const m = mode();
  if (m === 'count') {
    if (C.phase === 'sum') snapScene(0, 12, { arc: true });
    else if (C.phase === 'done') { const [lo, hi] = PAIRS[C.i]; snapScene(lo, hi - lo, { arc: true }); }
    else loadCount();
  } else if (m === 'slide') snapScene(SL.lo, 7, { arc: true });
  else if (m === 'devil') snapScene(D.lo, 6, { arc: true });
  else if (m === 'ear') { if (E.demoing) { E.demoing = false; earNewRound(); } else earScene(); }
  else snapScene(0, 0, { showHi: false });
}
const secRow = (t) => {
  const open = secret.unlocked();
  const chip = (k, emo) => `<button class="chip iv-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;

};
$('ctrlBody').addEventListener('click', (ev) => {

// pointer: tap a key (count), drag the pair (slide, tritone), drag the bridge (monochord)

const pos = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cv.addEventListener('pointerdown', (ev) => {

// --- one render per change: controls, readout and the state card --------------------------------------------

function render() {

  const cards = IVS.map(({ k, n }) => {
    const cls = !asking ? (k === iv.k ? 'good' : k === E.picked ? 'bad' : '') : '';
    return `<button class="iv-card ${cls}" data-act="card" data-k="${k}"${asking && E.heard ? '' : ' disabled'}><b>${esc(t.names[n])}</b><span>${esc(t.cards[k])}</span></button>`;
  }).join('');
  return `${verdict(E.v ? E.v.ok : null)}
    <div class="iv-q"><span>${esc(t.whichCard)}</span><span class="iv-dots">${dotsOf(E.round, 8)}</span></div>
    <div class="row2" style="margin-top:0"><button class="btn" data-act="listen">${esc(E.heard ? t.again : t.listen)}</button>${E.phase === 'answered' ? `<button class="btn" style="margin-left:auto" data-act="enext">${esc(t.next)}</button>` : ''}</div>
    <div class="iv-cards">${cards}</div>`;
}

function renderDevil(t) {
  lab.setGlow('rgba(229, 72, 77, .26)');
  const lo = D.lo;
  lab.setReadout(`${noteName(lo)} – ${noteName(lo + 6)}`, `6 ${t.semitones}`, t.names[6], DEVIL);
  lab.setState({ emo: '😈', title: t.secrets.devil[0], lead: t.secretB, body: '', extra: '' });
  return `<div class="row2" style="margin-top:0"><button class="iv-arr" data-act="sl" data-d="-1" aria-label="${esc(t.left)}"${lo <= 0 ? ' disabled' : ''}>${esc(t.left)}</button>
    <button class="iv-arr" data-act="sl" data-d="1" aria-label="${esc(t.right2)}"${lo >= 12 ? ' disabled' : ''}>${esc(t.right2)}</button>
    <button class="chip iv-chip" data-act="play">${esc(t.play)}</button></div>`;
}

function pythLite() { // readout and state card of the monochord: no rebuild, so a slider drag keeps going
  const t = T[lang], mk = markOf(Y.f), sem = semisOf(Y.f);
  lab.setReadout(mk ? mk[1] : Y.f.toFixed(2), `+${mk ? Math.round(sem) : sem.toFixed(1)} ${t.semitones}`, mk && mk[0] === 0.5 ? t.names[12] : mk && mk[0] < 0.99 ? t.names[7] : '', WARM);
  lab.setState({ emo: '📏', title: t.secrets.pyth[0], lead: t.secretA, body: '', extra: '' });
}
function renderPyth(t) {
  lab.setGlow('rgba(217, 160, 91, .26)');
  pythLite();
  return `<div class="iv-q"><span>${esc(t.slideBridge)}</span></div>
    <input id="ivBr" class="big" type="range" min="30" max="100" step="0.5" value="${Y.f * 100}" style="--track: linear-gradient(90deg, #ffcf70, #a56b35)" aria-label="${esc(t.slideBridge)}">
    <div class="row2"><button class="chip iv-chip" data-act="play">${esc(t.play)}</button></div>`;
}

// --- go --------------------------------------------------------------------------------------------------------
E.bag = newBag();
enter();
render();
canvasLoop(cv, (c, w, h, dt) => {
  const now = nowS();
  LY = layoutFor(w, h);
  stepScene(dt, now);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const m = mode();
  if (m === 'pyth') drawPyth(c, now); else drawPair(c, now, m);
});
</script>
</body>
