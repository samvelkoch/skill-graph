const TAU = Math.PI * 2, INK = '#2E2A4A', GRASS = '#BFE3C0', PAVE = '#F3E3C3', WARM = '#FF8A5B', COOL = '#5B8DEF';
const clamp01 = (x) => clamp(x, 0, 1);
const ease = (t) => { t = clamp01(t); return t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2; };
const backOut = (t) => { t = clamp01(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2; };
const rgbOf = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mixc = (a, b, t) => { const p = rgbOf(a), q = rgbOf(b); return '#' + p.map((v, i) => Math.round(v + (q[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const shade = (h, k) => mixc(h, '#000000', k);
const tint = (h, k) => mixc(h, '#ffffff', k);
const rgba = (h, a) => { const [r, g, b] = rgbOf(h); return `rgba(${r},${g},${b},${a})`; };
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const now = () => performance.now() / 1000;
const ordOf = (key, n) => [...Array(n).keys()]; // options keep the order given in the spec
let CW = 0, CH = 0;

// a dark, rounded label that is always readable and kept inside the canvas
function pill(c, text, x, y, size = 12, color = '#fff') {
  c.save(); c.globalAlpha = 1; c.font = `800 ${size}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + 16, th = size + 10;
  x = clamp(x, tw / 2 + 4, Math.max(tw / 2 + 4, CW - tw / 2 - 4)); y = clamp(y, th / 2 + 4, Math.max(th / 2 + 4, CH - th / 2 - 4));
  c.fillStyle = 'rgba(30,27,52,.8)'; c.beginPath(); c.roundRect(x - tw / 2, y - th / 2, tw, th, th / 2); c.fill();
  c.fillStyle = color; c.fillText(text, x, y + 1); c.restore();
}
const poly = (c, pts) => { c.beginPath(); pts.forEach(([X, Y], i) => (i ? c.lineTo(X, Y) : c.moveTo(X, Y))); c.closePath(); };

function cloud(c, x, y, s) {
  c.beginPath(); c.ellipse(x, y, s * 1.2, s * .5, 0, 0, TAU); c.ellipse(x - s * .7, y + s * .12, s * .7, s * .38, 0, 0, TAU);
  c.ellipse(x + s * .75, y + s * .14, s * .8, s * .4, 0, 0, TAU); c.ellipse(x, y - s * .25, s * .7, s * .5, 0, 0, TAU); c.fill();
}
const CLOUDS = [[.1, .1, 26, 4], [.55, .06, 20, 3], [.85, .2, 24, 5]];
function drawSky(c, w, h, time, to = 1) {
  const g = c.createLinearGradient(0, 0, 0, h * to); g.addColorStop(0, '#9AD0FF'); g.addColorStop(1, '#DDF1FF');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.save(); c.globalAlpha = .75; c.fillStyle = '#fff';
  for (const [fx, fy, sz, sp] of CLOUDS) cloud(c, ((fx * w + time * sp) % (w + 160)) - 80, fy * h * to, sz);
  c.restore();
}

  if (who !== 'fix') { const ah = Math.atan2(dy, dx); c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.moveTo(ep[0], ep[1]); c.arc(ep[0], ep[1], mw * .5, ah - .46, ah + .46); c.closePath(); c.fill(); }
  c.setLineDash([2, 3]); c.strokeStyle = 'rgba(255,138,91,.9)'; c.lineWidth = 1.5; const b0 = M(BALL0[0], BALL0[1]), b1 = M(BALL1[0], BALL1[1]); c.beginPath(); c.moveTo(b0[0], b0[1]); c.lineTo(b1[0], b1[1]); c.stroke(); c.setLineDash([]);
  const dot = (x, y, col, r) => { const [a, b] = M(x, y); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 1.2; c.beginPath(); c.arc(a, b, r, 0, TAU); c.fill(); c.stroke(); };
  const cm = M(CASTLE.x, CASTLE.y); c.fillStyle = SAND; c.strokeStyle = SANDD; c.lineWidth = 1.5; c.beginPath(); c.roundRect(cm[0] - sx * .7, cm[1] - sx * .4, sx * 1.4, sx * .8, 3); c.fill(); c.stroke();
  if (!fix) dot(-.8, -.25, KIDS.ben.shirt, 3.6);
  dot(fix ? .55 : -3.6, fix ? .55 : .2, COOL, 4.2); dot(fix ? 3.45 : 2.0, fix ? .55 : 2.1, WARM, 4.2);
  c.restore();
}

// ================================================================================================================
// controls: one render per change
// ================================================================================================================
const ctrl = () => $('ctrlIn');
const abBtns = (key, list, ok, pick, shown, extra = '') => ordOf(key, list.length).map((i) =>
  `<button class="ab ${extra} ${pick === null ? '' : shown ? (i === ok ? 'good' : i === pick ? 'bad' : '') : i === pick ? 'pick' : ''}" data-a="pick" data-i="${i}"${pick !== null ? ' disabled' : ''}>${esc(list[i])}</button>`).join('');
const verdict = (t, good, text) => `<div class="vd ${good ? 'ok' : 'no'}"><b>${esc(good ? t.right : t.wrong)}</b>${esc(text)}</div>`;
const setCard = (view, t) => { const [emo, title, lead] = t.st[view][(view === 'feel' ? S.f.end : S.asked[view]) ? 1 : 0]; lab.setState({ emo, title, lead, body: '', extra: view === 'see' ? `<div class="fine">${esc(t.fine)}</div>` : '' }); };

function render() {
  const t = T[lang], v = lab.view;
  storyEl.style.display = v === 'feel' ? '' : 'none'; bubsEl.style.display = v === 'sides' ? '' : 'none';
  if (v === 'see') renderSee(t); else if (v === 'feel') renderFeel(t); else renderSides(t);
}

function renderSee(t) {
  const open = secret.unlocked(), ex = S.round >= 3; let h = '';
  document.body.toggleAttribute('data-mt', S.sec === 'mountains');
  lab.setGlow('rgba(91, 141, 239, .28)');
  const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-a="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  if (S.sec === 'duck') {
    h += `<div class="row2 first"><button class="chip" data-a="duck">${esc(t.sec.duckBtn)}</button></div>`;
    lab.setReadout('🦆 🐰', t.secrets.duck[0], '', COOL); lab.setState({ emo: '🦆', title: t.secrets.duck[0], lead: t.sec.duckText, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  } else if (S.sec === 'mountains') {
    lab.setReadout('⛰️', t.secrets.mountains[0], '', COOL); lab.setState({ emo: '⛰️', title: t.secrets.mountains[0], lead: t.sec.mtText, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  } else if (!ex) {
    const r = SEE[S.round], opts = t.s[r.o];
    h += `<div class="qq">${esc(t.s[r.q])}</div><div class="abs">${abBtns('s' + S.round, opts, r.ok, S.pick, S.shown)}</div>`;
    if (S.shown) h += verdict(t, S.pick === r.ok, t.s[r.r]) + `<div class="row2"><button class="btn" data-a="next">${esc(t.next)}</button></div>`;
    lab.setReadout(`${S.round + 1}/3`, '', '', COOL); setCard('see', t);
  } else {
    h += `<input class="big" id="walk" type="range" min="0" max="360" step="1" value="${S.deg}" aria-label="${esc(t.s.walk)}" style="--track:linear-gradient(90deg,#5B8DEF,#FF8A5B,#5B8DEF)">
      <div class="ends"><span>0°</span><span>${esc(t.s.walk)}</span><span>360°</span></div><div class="row2 first"><button class="chip" data-a="again">${esc(t.again)}</button></div>`;
    readWalk(t); setCard('see', t);
  }
  h += `<div class="row2"><div class="chips">${chip('duck', '🦆')}${chip('mountains', '⛰️')}</div></div>`;
  ctrl().innerHTML = h;
}
function readWalk(t = T[lang]) {
  const a = Math.abs(((S.deg + 180) % 360 + 360) % 360 - 180), glyph = a < 50 ? '6' : a > 130 ? '9' : '';
  lab.setReadout(`${Math.round(S.deg)}°`, t.s.walk, glyph, COOL);
}

function renderFeel(t) {
  const F = S.f, card = FEEL[F.i], q = card.qs[F.q], say = F.say > 0;
  lab.setGlow('rgba(255, 209, 102, .26)'); let h = '';
  const nm = q.kid === 'friend' ? t.f.friend : t.names[q.kid];
  if (F.end) {
    h = `<div class="row2 first"><button class="btn" data-a="again">${esc(t.again)}</button></div>`;
  } else if (!say) {
    h += `<div class="qq">${esc(t.f.q(nm))}</div><div class="abs">${abBtns(`f${F.i}.${F.q}`, t.f.opts[q.st], q.ok, F.pick, F.st === 'shown')}</div>`;
    if (F.st === 'shown') {
      const why = F.q === card.qs.length - 1 ? t.f.why[card.why] : '';
      h += `<div class="vd ${F.pick === q.ok ? 'ok' : 'no'}"><b>${esc(F.pick === q.ok ? t.right : t.wrong)}</b>${esc(why)}</div><div class="row2"><button class="btn" data-a="next">${esc(t.next)}</button></div>`;
    }
  } else {
    h += `<div class="qq">${esc(t.f.say)}</div><div class="abs col">${abBtns('say', t.f.sayOpts, 1, F.spick, F.sst === 'shown', 'bub')}</div>`;
    if (F.sst === 'shown') h += `<div class="vd ${F.spick === 1 ? 'ok' : 'no'}"><b>${esc(F.spick === 1 ? t.right : t.wrong)}</b></div><div class="row2"><button class="btn" data-a="next">${esc(t.next)}</button></div>`;
  }
  ctrl().innerHTML = h;
  // the story stays on the card while the child answers
  const lines = card.qs.length > 1 && F.q === 1 ? [t.f.stories[card.qs[0].st], t.f.stories[q.st]] : [t.f.stories[q.st]];
  storyEl.innerHTML = lines.length > 1 ? `<small>${esc(lines[0])}</small>${esc(lines[1])}` : esc(lines[0]);
  lab.setReadout(`${F.i + 1}/4`, '', '', '#FFD166'); setCard('feel', t);
}

function renderSides(t) {
  const D = S.d, fix = D.fixAt > 0; let h = '';
  lab.setGlow('rgba(255, 138, 91, .26)');
  if (D.step === 0) h += `<div class="row2 first"><div class="card seg small" id="eyesSeg">${['sam', 'lena'].map((k) => `<button data-a="eyes" data-e="${k}" class="${D.eyes === k ? 'on' : ''}">${esc(t.t[k + 'Eyes'])}</button>`).join('')}</div></div>`;
  if (D.step === 0 || D.step === 1) {
    const two = D.step === 1, qs = two ? t.t.q2 : t.t.q, opts = two ? t.t.o2 : t.t.o, ok = two ? 0 : 2;
    h += `<div class="qq" style="${D.step === 0 ? 'margin-top:12px' : ''}">${esc(qs)}</div><div class="abs ${two ? 'col' : ''}">${abBtns('d' + D.step, opts, ok, D.pick, D.shown)}</div>`;
    if (D.shown) h += verdict(t, D.pick === ok, two ? t.t.r2 : t.t.r) + `<div class="row2"><button class="btn" data-a="${two ? 'again' : 'next'}">${esc(two ? t.again : t.next)}</button></div>`;
  }
  ctrl().innerHTML = h;
  const bub = (k) => `<div class="sbub ${k}"><b>${esc(t.names[k])}</b>${esc(t.t[k])}${D.both ? '<i>✓</i>' : ''}</div>`;
  bubsEl.innerHTML = D.both || fix ? bub('sam') + bub('lena') : bub(D.eyes);
  lab.setReadout(`${Math.min(D.step, 1) + 1}/2`, '', '', WARM); setCard('sides', t);
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, i = +b.dataset.i;
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; if (S.sec === 'duck') S.dh = 0; sfx.click(); render(); return;
  }
  if (a === 'duck') { S.dh = S.dh === 1 ? 2 : 1; sfx.click(); return; }
  if (a === 'again') { restart(); return; }
  if (lab.view === 'see') pickOrNextSee(a, i);
  else if (lab.view === 'feel') pickOrNextFeel(a, i);
  else pickOrNextSides(a, b.dataset.e, i);
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'walk') return;
  S.deg = +ev.target.value; S.th = S.deg * Math.PI / 180; S.tw = null; readWalk();
});

function restart() {
  S.tok++; sfx.click();
  if (lab.view === 'see') { S.round = 0; S.pick = null; S.shown = false; S.th = 0; S.tw = null; S.eyeAt = -1; S.deg = 0; }
  else if (lab.view === 'feel') { Object.assign(S.f, { i: 0, q: 0, st: 'ask', pick: null, say: 0, sst: 'ask', spick: null, end: false, mood: {}, tint: {}, faces: {}, cardAt: now() }); }
  else Object.assign(S.d, { step: 0, pick: null, shown: false, fixAt: 0, t0: now(), both: false });
  render();
}

// view 1
function pickOrNextSee(a, i) {
  if (a === 'pick') {
    if (S.pick !== null) return;
    const r = SEE[S.round]; S.pick = i; S.asked.see = true; sfx.click(); showStage();
    const spin = r.scene !== 'teddy', t0 = now();
    if (spin) { S.tw = { a: 0, b: Math.PI, t0, dur: 1.2 }; S.eyeAt = t0 + 1.3; } else S.eyeAt = t0 + .3;
    render();
    later(spin ? 2200 : 1300, () => { S.shown = true; (i === r.ok ? sfx.good : sfx.bad)(); render(); });
  } else if (a === 'next') {
    S.tok++; S.round++; S.pick = null; S.shown = false; S.eyeAt = -1; S.th = 0; S.tw = null; S.deg = 0; sfx.click(); render();
  }
}
// view 2
function pickOrNextFeel(a, i) {
  const F = S.f, card = FEEL[F.i], q = card.qs[F.q];
  if (a === 'pick') {
    if (F.say > 0) {
      if (F.sst !== 'ask') return;
      F.spick = i; F.sst = 'wait'; F.mood.friend = 'smile'; S.asked.feel = true; sfx.click(); showStage(); render();
      later(900, () => { F.sst = 'shown'; (i === 1 ? sfx.good : sfx.bad)(); render(); });
    } else {
      if (F.st !== 'ask') return;
      F.pick = i; F.st = 'wait'; F.mood[q.kid] = q.mood; F.tint[q.kid] = .001; S.asked.feel = true; sfx.click(); showStage(); render();
      later(1000, () => { F.st = 'shown'; (i === q.ok ? sfx.good : sfx.bad)(); render(); });
    }
  } else if (a === 'next') {
    S.tok++; sfx.click();
    if (F.say === 0 && F.q < card.qs.length - 1) { F.q++; F.st = 'ask'; F.pick = null; }
    else if (F.say === 0 && card.say) { F.say = 1; F.sst = 'ask'; F.spick = null; }
    else if (F.i < FEEL.length - 1) { F.i++; F.q = 0; F.st = 'ask'; F.pick = null; F.say = 0; F.mood = {}; F.tint = {}; F.faces = {}; F.cardAt = now(); }
    else F.end = true;
    render();
  }
}
// view 3
function pickOrNextSides(a, e, i) {
  const D = S.d;
  if (a === 'eyes') { D.eyes = e; sfx.click(); render(); return; }
  if (a === 'pick') {
    if (D.pick !== null) return;
    D.pick = i; S.asked.sides = true; sfx.click(); showStage();
    if (D.step === 0) { D.both = true; render(); later(700, () => { D.shown = true; (i === 2 ? sfx.good : sfx.bad)(); render(); }); }
    else { D.fixAt = now(); D.both = true; render(); later(2600, () => { D.shown = true; (i === 0 ? sfx.good : sfx.bad)(); render(); }); }
  } else if (a === 'next') { S.tok++; D.step = 1; D.pick = null; D.shown = false; sfx.click(); render(); }
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  if (lab.view === 'see') { if (S.sec === 'duck') drawDuck(c, w, h, dt, time); else if (S.sec === 'mountains') drawMountains(c, w, h, dt, time); else drawSee(c, w, h, dt, time); }
  else if (lab.view === 'feel') drawFeel(c, w, h, dt, time);
  else drawSides(c, w, h, dt, time);
});
S.f.cardAt = now(); S.d.t0 = now();
render();
</script>
