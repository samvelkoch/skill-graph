// --- drawing: the map with its line ------------------------------------------------------------------------------

// --- drawing: the rivers map ---------------------------------------------------------------------------------------
function drawRivers(c, w, h, dt, time, L, cn, need) {
  const t = T[lang], r = L.map, { s, ox, oy } = fitMap(cn, r), ans = has('p3');
  c.drawImage(mapLayer(cn, r), r.x, r.y, r.w, r.h);
  G.map = { s, ox, oy }; G.sources = []; G.prof = null; knob.hidden = true;
  pill(c, w, h, t.cont[cn.id], r.x + 8, r.y + 8, 'l', 12, '#fff');
  if (need) { pill(c, w, h, t.needT[need], r.x + r.w / 2, r.y + r.h / 2, 'c', 13, '#fff'); return; }
  const sx = (x) => ox + x * s, sy = (y) => oy + y * s;
  c.save(); c.translate(ox, oy); c.scale(s, s); c.lineCap = 'round'; c.lineJoin = 'round';
  if (ans) { // the rivers stay hidden until the guess: their lines would show which way the water runs
    c.strokeStyle = 'rgba(150,210,255,.6)'; c.lineWidth = 1.2 / s; c.stroke(cn.rMin);
    c.save(); c.shadowColor = 'rgba(90,170,255,.8)'; c.shadowBlur = 6; c.strokeStyle = '#7ccbff'; c.lineWidth = 2.2 / s; c.stroke(cn.rMaj); c.restore();
  }

  for (const key of RKEYS[cn.id]) {
    const rt = ROUTES[key], dropped = S.dropped[cn.id].has(key);
    if (!dropped || !ans) continue;
    const active = S.drop && S.drop.key === key, p = active ? clamp01((time - S.drop.t0) / S.drop.dur) : 1, dist = p * rt.len;
    c.beginPath(); c.moveTo(rt.pts[0][0], rt.pts[0][1]);
    let pos = rt.pts[0];
    for (let i = 1; i < rt.pts.length; i++) {
      if (rt.cum[i] <= dist) { c.lineTo(rt.pts[i][0], rt.pts[i][1]); pos = rt.pts[i]; }
      else { const f = (dist - rt.cum[i - 1]) / Math.max(1e-6, rt.cum[i] - rt.cum[i - 1]); pos = [lerp(rt.pts[i - 1][0], rt.pts[i][0], f), lerp(rt.pts[i - 1][1], rt.pts[i][1], f)]; c.lineTo(pos[0], pos[1]); break; }
    }
    c.save(); c.shadowColor = 'rgba(255,209,102,.9)'; c.shadowBlur = 8; c.strokeStyle = active ? '#ffd166' : 'rgba(255,209,102,.7)'; c.lineWidth = 3.4 / s; c.stroke(); c.restore();

    for (const key of Object.keys(t.rv.lab)) {

      c.font = '800 12px Nunito, sans-serif';
      const tw = c.measureText(t.rv.lab[key]).width + 16, lx = clamp(sx(cn.px(a[0])) + 6, 4, w - 4 - tw);
      let ly = sy(cn.py(a[1])) - 24;
      for (let g = 0; g < 6; g++) { const hit = boxes.find((b) => lx < b.x + b.w && lx + tw > b.x && ly < b.y + b.h && ly + 22 > b.y); if (!hit) break; ly = hit.y - 25; }
      boxes.push(pill(c, w, h, t.rv.lab[key], lx, ly, 'l', 12, '#cfe9ff'));
    }
  }

  for (const key of keys) {
    const rt = ROUTES[key], X = sx(rt.pts[0][0]), Y = sy(rt.pts[0][1]), busy = S.drop && S.drop.key === key && time < S.drop.t0 + S.drop.dur;

    c.fillStyle = g; c.strokeStyle = '#0d3a66'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(X, Y - 12); c.quadraticCurveTo(X + 8, Y - 1, X, Y + 5); c.quadraticCurveTo(X - 8, Y - 1, X, Y - 12); c.closePath(); c.fill(); c.stroke();
    c.restore();

  // the travelling drop and its landing

  if (cur) {
    const X = sx(cur.pos[0]), Y = sy(cur.pos[1]);
    if (cur.p < 1) {
      const g = c.createRadialGradient(X - 1.5, Y - 1.5, 0.5, X, Y, 6); g.addColorStop(0, '#fff'); g.addColorStop(1, '#2f8fe0');
      c.fillStyle = g; c.strokeStyle = '#0d3a66'; c.lineWidth = 1.5; c.beginPath(); c.arc(X, Y, 5.5, 0, 7); c.fill(); c.stroke();
    }
  }
  if (last) {
    const endP = last.pts[last.pts.length - 1], X = sx(endP[0]), Y = sy(endP[1]), done = clamp01((time - (S.drop.t0 + S.drop.dur)) / 0.9);
    if (time >= S.drop.t0 + S.drop.dur) {
      const k = eOut(done);
      c.strokeStyle = `rgba(255,255,255,${0.8 * (1 - k)})`; c.lineWidth = 2; c.beginPath(); c.arc(X, Y, Math.max(0, 5 + 22 * k), 0, 7); c.stroke();

}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view, cn = C(), L = layoutOf(w, h, v); G.L = L;
  const id = cn.id, tgt = effLat(), d = tgt - S.latV[id];
  S.latV[id] = Math.abs(d) < 0.01 ? tgt : S.latV[id] + d * Math.min(1, dt * 9);
  const need = needOf();
  if (v === 'rivers') { drawRivers(c, w, h, dt, time, L, cn, need); return; }
  const P = profile(cn, S.latV[id]);
  if (L.prof && !need) drawProfile(c, w, h, dt, time, L, cn, P, need); // first: the map reads the profile's geometry
  drawMapPart(c, w, h, time, L, cn, P, need);
  if (L.prof && need) drawProfile(c, w, h, dt, time, L, cn, P, need);
});

// --- pointers: scrub the profile, tap the map, drag the knob ---------------------------------------------------------
const cv = $('cv');
const inR = (x, y, r) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function setCur(x) { if (!G.prof) return; S.cur = clamp((x - G.prof.x0) / (G.prof.x1 - G.prof.x0), 0, 1); }
function setLatFromY(y) {
  const cn = C(); if (!G.map || isLocked()) return;
  const lat = cn.lat1 - (y - G.map.oy) / (KS * G.map.s), snap = clamp(Math.round(lat / 2) * 2, cn.latMin, cn.latMax);
  if (snap !== S.lat[cn.id]) { S.lat[cn.id] = snap; sfx.tick(); render(); }
}
function startDrop(key) {
  const cn = C(); if (RINFO[key].c !== cn.id) return;
  S.drop = { key, t0: now(), dur: clamp(2.4 + ROUTES[key].km / 1500, 2.6, 5.5) }; S.dropped[cn.id].add(key); sfx.click(); render();
}
const posOf = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cv.addEventListener('pointerdown', (ev) => {
  const [x, y] = posOf(ev), L = G.L; if (!L) return;
  S.down = { x, y, type: ev.pointerType };
  if (lab.view !== 'rivers' && inR(x, y, L.prof) && !needOf() && (lab.view !== 'slice' || has('p1'))) { S.scrub = true; setCur(x); try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ } }
  else if (lab.view !== 'rivers' && inR(x, y, L.map) && ev.pointerType === 'mouse') { S.mdown = true; setLatFromY(y); }
});
cv.addEventListener('pointermove', (ev) => { const [x, y] = posOf(ev); if (S.scrub) setCur(x); else if (S.mdown) setLatFromY(y); });
const endPtr = (ev, cancelled) => {
  const [x, y] = posOf(ev), d = S.down;
  if (d && !cancelled && Math.hypot(x - d.x, y - d.y) < 8) {
    if (lab.view === 'rivers' && has('p3')) { const hit = G.sources.map((q) => ({ q, dd: Math.hypot(q.x - x, q.y - y) })).sort((a, b) => a.dd - b.dd)[0]; if (hit && hit.dd < 30) startDrop(hit.q.key); }
    else if (lab.view !== 'rivers' && d.type !== 'mouse' && inR(x, y, G.L.map)) setLatFromY(y);
  }
  S.down = null; S.scrub = false; S.mdown = false;
};
cv.addEventListener('pointerup', (ev) => endPtr(ev, false)); cv.addEventListener('pointercancel', (ev) => endPtr(ev, true));
let kdrag = false;
knob.addEventListener('pointerdown', (ev) => { kdrag = true; try { knob.setPointerCapture(ev.pointerId); } catch { /* fine */ } ev.preventDefault(); });
knob.addEventListener('pointermove', (ev) => { if (kdrag) setLatFromY(ev.clientY - cv.getBoundingClientRect().top); });
knob.addEventListener('pointerup', () => { kdrag = false; }); knob.addEventListener('pointercancel', () => { kdrag = false; });
$('acLat').addEventListener('input', (ev) => { if (isLocked()) return; S.lat[S.cont] = +ev.target.value; sfx.tick(); render(); });

// --- predictions ---------------------------------------------------------------------------------------------------------
const PKEY = { slice: 'p1', rain: 'p2', rivers: 'p3' };
const rightOf = (v, cn) => (v === 'slice' ? CONT[cn].right1 : v === 'rain' ? { sa: 1, na: 0 }[cn] : 1);
function predHTML(v, cn) {
  const t = T[lang], pick = S[PKEY[v]][cn], done = pick !== null, right = rightOf(v, cn);
  const opts = v === 'slice' ? t.o.slice : t.o[v][cn];
  const chips = opts.map((o, i) => `<button class="ac-opt${done ? (i === right ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="opt" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = done ? `<div class="ac-verdict ${pick === right ? 'good' : 'bad'}">${esc(t.v[v][cn][pick === right ? 0 : 1])}</div>` : '';
  return `<div class="ac-q">${esc(t.q[v][cn])}</div><div class="ac-opts">${chips}</div>${verdict}`;
}
function answer(i) {
  const v = lab.view, cn = S.cont, k = PKEY[v];
  if (S[k][cn] !== null || needOf()) return;
  const l = lockedLat(); if (l !== null) S.lat[cn] = l; // the line stays where the question put it
  S[k][cn] = i; S.revT[k] = now();
  (i === rightOf(v, cn) ? sfx.good : sfx.bad)();
  if (v === 'rivers') startDrop(FIRST_DROP[cn]); else render();
  showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'opt') return answer(+b.dataset.i);
  if (a === 'cont') { if (S.cont === b.dataset.k) return; S.cont = b.dataset.k; S.cur = null; S.drop = null; S.rain.length = 0; S.latV[S.cont] = effLat(); sfx.click(); }
  else if (a === 'goto') { $('views').querySelector(`[data-view="${b.dataset.v}"]`)?.click(); showStage(); return; }
  else if (a === 'drop') return startDrop(b.dataset.k);
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k, want = k === 'wind' ? 'rain' : 'slice', was = S.sec === k && lab.view === want;
    if (lab.view !== want) $('views').querySelector(`[data-view="${want}"]`)?.click();
    S.sec = was ? null : k; S.secT = now(); sfx.click(); showStage();
  }
  render();
});

// --- one render per change: controls, readout, the state card and the facts ----------------------------------------------
const COLORS = { slice: '#c9a15d', rain: '#4ea8ff', rivers: '#6fc3ff' };
function render() {
  const t = T[lang], v = lab.view, cn = C(), id = cn.id, need = needOf();
  document.body.dataset.v = v;
  $('acCont').innerHTML = ['sa', 'na'].map((k) => `<button class="chip${S.cont === k ? ' on' : ''}" data-act="cont" data-k="${k}">${esc(t.cont[k])}</button>`).join('');
  const nb = $('acNeed'); nb.hidden = !need;
  if (need) nb.innerHTML = `<b>${esc(t.needT[need])}</b><br>${esc(t.needL[need])}<br><button class="btn" data-act="goto" data-v="${need}">${esc(t.needB[need])}</button>`;
  $('acPred').innerHTML = need ? '' : predHTML(v, id);
  // latitude slider
  const showLat = v !== 'rivers' && !need, lat = effLat();
  $('acLatBox').style.display = showLat ? '' : 'none';
  const sl = $('acLat'); sl.min = cn.latMin; sl.max = cn.latMax; sl.value = lat; sl.disabled = isLocked(); sl.setAttribute('aria-label', t.latLbl);
  $('acLatLbl').textContent = t.latLbl; $('acLatVal').textContent = t.lat(lat); $('acLatA').textContent = t.lat(cn.latMin); $('acLatB').textContent = t.lat(cn.latMax);
  // legend and rivers panel
  const P = profile(cn, lat), model = S.sec === 'wind';
  const showLeg = v === 'rain' && has('p2') && !need && !model;
  $('acLegend').style.display = showLeg ? 'flex' : 'none';
  $('acLegend').innerHTML = showLeg ? ['rain', 'forest', 'grass', 'desert', 'rock'].map((k) => `<div><i style="background:${VEG_COL[k]}"></i>${esc(t.veg[k])}</div>`).join('') : '';
  const rv = $('acRiv'); rv.style.display = v === 'rivers' && !need && has('p3') ? 'block' : 'none'; if (rv.style.display === 'none') rv.innerHTML = '';
  if (rv.style.display === 'block') {
    const mx = DISCH[0][1];
    rv.innerHTML = `<div class="ac-drops">${RKEYS[id].map((k) => `<button class="chip${S.drop && S.drop.key === k ? ' on' : ''}" data-act="drop" data-k="${k}">${esc(t.rv.chips[k])}</button>`).join('')}</div>
      <div class="ac-bars"><h4>${esc(t.rv.bars)}</h4>${DISCH.map(([k, q]) => `<div class="ac-bar"><span>${esc(t.rv.names[k])}</span><span class="t"><i style="width:${(q / mx * 100).toFixed(1)}%"></i></span><b>${FMT(q)}</b></div>`).join('')}</div>`;
  }
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('acSecs').innerHTML = sc('wind', '🔄') + sc('scale', '📏');
  $('acFine').textContent = t.fine;
  lab.setGlow(v === 'slice' ? 'rgba(201, 161, 93, .26)' : v === 'rain' ? 'rgba(78, 168, 255, .28)' : 'rgba(111, 195, 255, .26)');
  // readout, state card, facts
  const col = COLORS[v];
  if (need) { lab.setReadout('🔒', '', '', col); lab.setState({ emo: '🔒', title: t.needT[need], lead: t.needL[need], body: '', extra: '' }); lab.setFacts([]); return; }
  if (v === 'slice') {
    if (!has('p1')) { lab.setReadout(esc(t.lat(lat)), t.lineSub[id], '', col); lab.setState({ emo: '🤔', title: t.q.slice[id], lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
    const m = r100(P.e[P.pk]), km = r100(spanKmTo(cn, P)), st = t.st.slice;
    lab.setReadout(`${esc(FMT(m))} ${esc(t.unitM)}`, st.peakSub, t.approx, col);
    if (S.sec === 'scale') {
      const K = Math.max(10, Math.round((G.K || 200) / 10) * 10);
      lab.setState({ emo: '📏', title: t.st.scale.t, lead: t.st.scale.l(FMT(K)), body: t.st.scale.b, extra: '' }); lab.setFacts([]);
    } else { lab.setState({ emo: '🗻', title: st[id], lead: st.peak(FMT(m), FMT(km)), body: S.p1.sa !== null && S.p1.na !== null ? `${st.body} ${st.both}` : st.body, extra: '' }); lab.setFacts(t.facts.slice[id]); }
    return;
  }
  if (v === 'rain') {
    const dirE = windDir(cn, lat) < 0 ? 'e' : 'w';
    if (!has('p2')) { lab.setReadout(esc(t.lat(lat)), t.windSub[dirE], '', col); lab.setState({ emo: '🤔', title: t.q.rain[id], lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
    if (S.sec === 'wind') { lab.setReadout('🔄', t.modelCap, '', col); lab.setState({ emo: '🔄', title: t.st.wind.t, lead: t.st.wind.l, body: t.st.wind.b, extra: '' }); lab.setFacts([]); return; }
    const st = t.st.rain, coastDry = id === 'sa' && lat >= -30 && lat <= -6 && Math.min(P.rn[P.first], P.rn[P.first + 1], P.rn[P.first + 2]) < 250;
    lab.setReadout(`${esc(FMT(r50(P.wet)))} mm`, st.sub(FMT(r50(P.dry))), t.approx, col);
    lab.setState({ emo: '🌧️', title: st[dirE], lead: st.lead, body: st.body(FMT(r50(P.wet)), FMT(r50(P.dry))), extra: coastDry ? `<div>${esc(st.cold)}</div>` : '' });
    lab.setFacts(t.facts.rain[id]); return;
  }
  // rivers
  if (!has('p3')) { lab.setReadout('?', '', '', col); lab.setState({ emo: '🤔', title: t.q.rivers[id], lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  const d = S.drop && RINFO[S.drop.key].c === id ? S.drop.key : null;
  if (!d) { lab.setReadout('💧', '', '', col); lab.setState({ emo: '💧', title: t.rv.hint, lead: '', body: '', extra: '' }); }
  else {
    const info = RINFO[d], km = ROUTES[d].km, oc = t.rv.oc[info.oc];
    const both = RKEYS[id].some((k) => S.dropped[id].has(k) && RINFO[k].oc === 'pacific') && RKEYS[id].some((k) => S.dropped[id].has(k) && RINFO[k].oc !== 'pacific');
    lab.setReadout(`${esc(FMT(km))} km`, t.rv.path[d], t.rv.pill, col);
    lab.setState({ emo: '💧', title: `${t.rv.path[d]} → ${t.rv.ocT[info.oc]}`, lead: t.rv.lead(FMT(km), oc), body: t.rv.why[d], extra: both ? `<div>${esc(t.rv.divide)}</div>` : '' });
  }
  lab.setFacts(t.facts.rivers[id]);
}
// the vertical stretch of the slice picture: how many times taller than true scale (needs the last frame's geometry)
function spanKmTo(cn, P) { return (P.pk - P.first) * STEP * 111.32 * Math.cos(P.lat * Math.PI / 180); }
render();
</script>
</body>
</html>
