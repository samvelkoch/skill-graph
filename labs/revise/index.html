// parse one sentence: words (with an optional fix) and its ending
function parse(s) {
  const m = s.match(/^(.*?)(\{\|([.!?])\}|[.!?])$/);
  let body = s, end = { ch: '', missing: false };
  if (m) { body = m[1]; end = m[3] ? { ch: m[3], missing: true } : { ch: m[2], missing: false }; }
  const words = body.trim().split(/\s+/).map((tok) => {
    const k = tok.match(/^\{([^|}]*)\|([^}]*)\}(.*)$/);
    return k ? { show: k[1] + k[3], fix: k[2] + k[3] } : { show: tok, fix: null };
  });
  return { words, end };
}
const textOf = (p) => {

const sentOf = (p, edited) => {
  const { words, end } = parse(textOf(p));

};

  if (has('s4') && has('s6') && ix('s6') < ix('s4')) c -= 10;
  if (!has('s5')) c += 20;
  if (!has('s1')) c -= 15;
  if (!has('s3')) c -= 5;
  if (!has('s4')) c -= 25;
  if (!has('s6')) c -= 15;
  if (rep('s3') === 'r2') c += 20; else if (rep('s3')) c -= 5;
  for (const p of P) if (p.rep && p.rep[0] === 'g') c -= 10;
  if (has('a2')) c -= 10;

  return clamp(c, 0, 100);
}

  S.mood2 = S.chk3 ? clamp(score / 4 - 1, -1, 1) : 0.1;
  $('bench').innerHTML = `<div class="rv-pan" id="pan">${S.chk3
    ? `<div class="rv-q v">${esc(t.v3.res(score)[1])}</div>${S.wrong3.size ? `<div class="rv-mini">${esc(t.v3.resLead2)}</div>` : ''}<div class="rv-row"><button class="rv-ch go" data-act="again3">${esc(t.v3.again)}</button></div>`
    : `<div class="rv-q">${esc(t.v3.idle[2])}</div><div class="rv-row"><button class="rv-ch go" data-act="check3"${all ? '' : ' disabled'}>${esc(t.v3.check)}</button></div>`}</div>
    <div class="rv-zones">${zone('R', '🔨 ✂️ 🏗️ 🔧')}${zone('E', '🔍')}</div>
    <div class="rv-pile" data-zone="P"><div class="rv-mini">${esc(t.v3.pile)}</div>${CARD_ORDER.filter((k) => !S.cards[k]).map((k) => cardHtml(k, t)).join('')}</div>`;
  const st = S.chk3 ? t.v3.res(score) : t.v3.idle;
  lab.setReadout(S.chk3 ? `${score}/8` : `${placed}/8`, S.chk3 ? t.meter.bench : '', '', '#a97c4d'); lab.setGlow('rgba(169, 124, 77, .3)');
  lab.setGauge(S.chk3 ? score / 8 : 0, [{ f: 0, label: '0' }, { f: 1, label: '8' }], t.meter.bench); $('gauge').style.visibility = S.chk3 ? 'visible' : 'hidden';
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: `<div class="fine" style="font-size:11px;color:var(--faint)">${esc(t.fine)}</div>` });
  lab.setFacts(t.facts.bench);
}
function place(k, z) {
  if (S.chk3) return;
  S.cards[k] = z === 'P' ? null : z; S.sel3 = null; sfx.snap(); render();
}

// --- render ------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('bench').dataset.v = v;
  if (v === 'revise') renderRevise(t); else if (v === 'edit') renderEdit(t); else renderBench(t);
  // the lens sweeps once per visit to the Edit view
  const lens = $('lens'); if (lens && S.lensDone !== S.lens) { S.lensDone = S.lens; lens.classList.remove('go'); void lens.offsetWidth; lens.classList.add('go'); } else if (lens) lens.classList.remove('go');
  // controls under the picture: undo / reset, and the two secrets
  $('secUndo').style.display = v === 'revise' ? '' : 'none';
  $('secUndo').innerHTML = `<button class="chip" data-act="undo"${S.hist.length ? '' : ' disabled'}>${esc(t.undo)}</button><button class="chip" data-act="reset">${esc(t.reset)}</button>`;
  const open = secret.unlocked();
  const reading = S.say >= 0;
  $('secSec').innerHTML = `<button class="chip secret ${open ? 'open' : ''} ${S.edited ? 'on' : ''}" data-act="secA">${open ? `🪚 ${esc(t.secrets.a[0])}` : '🔒 ???'}</button>`
    + `<button class="chip secret ${open ? 'open' : ''} ${reading ? 'on' : ''}" data-act="secB">${open ? esc(reading ? t.ctl.stop : t.ctl.aloud) : '🔒 ???'}</button>`;
  lab.checkStage?.();
}
function resetDraft() {
  S.P = ORIG.map((id) => ({ id, rep: null })); S.hist = []; S.tool = null; S.selId = null; S.opt = null; S.verdict = null; S.edited = false; S.wasted = null;
}

// --- events ------------------------------------------------------------------------------------------------
$('rv').addEventListener('click', (ev) => {
  const t = T[lang], el = ev.target.closest('button, [data-card], [data-zone]'); if (!el) return;
  const v = lab.view;
  if (v === 'revise') {
    if (el.dataset.tool) { S.tool = S.tool === el.dataset.tool ? null : el.dataset.tool; S.selId = null; S.opt = null; S.verdict = null; S.wasted = null; sfx.click(); render(); }
    else if (el.classList.contains('rv-pl') && !el.classList.contains('ghost')) {
      if (!S.tool) { S.verdict = null; $('pan').innerHTML = `<div class="rv-q">${esc(t.pick0)}</div>`; sfx.tick(); return; }
      S.selId = el.dataset.id; S.opt = null; sfx.tick(); render();
    }
    else if (el.dataset.opt) { S.opt = el.dataset.opt; sfx.click(); render(); }
    else if (el.dataset.pred) { S.guessNow = el.dataset.pred; commit(el.dataset.pred); }
    else if (el.dataset.cancel) { S.tool = null; S.selId = null; S.opt = null; sfx.click(); render(); }
  } else if (v === 'edit') {
    if (el.dataset.k && !S.chk2) { if (S.marks.has(el.dataset.k)) S.marks.delete(el.dataset.k); else S.marks.add(el.dataset.k); sfx.tick(); render(); }
    else if (el.dataset.act === 'check2') { S.chk2 = true; const errs = errorsOf(), f = errs.filter((e) => S.marks.has(e.k)).length; (f === errs.length ? sfx.good : sfx.bad)(); render(); showStage(); }
    else if (el.dataset.act === 'again2') { S.chk2 = false; S.marks = new Set(); S.lens++; sfx.click(); render(); }
  } else {
    if (el.dataset.act === 'check3') {
      S.chk3 = true; S.wrong3 = new Set();
      for (const k of CARD_ORDER) { if (S.cards[k] !== CARD_BENCH[k]) { S.wrong3.add(k); S.cards[k] = CARD_BENCH[k]; } }
      (S.wrong3.size === 0 ? sfx.good : sfx.bad)(); S.sel3 = null; render(); showStage();
    } else if (el.dataset.act === 'again3') { S.cards = {}; S.chk3 = false; S.wrong3 = new Set(); S.sel3 = null; sfx.click(); render(); }
    else if (el.dataset.grip) { /* drag only */ }
    else if (el.dataset.card && !S.chk3) { S.sel3 = S.sel3 === el.dataset.card ? null : el.dataset.card; sfx.tick(); render(); }
    else if (el.dataset.zone && S.sel3 && !S.chk3) place(S.sel3, el.dataset.zone);
  }
});
// dragging a card by its grip
let drag = null;
$('rv').addEventListener('pointerdown', (ev) => {
  const g = ev.target.closest('[data-grip]'); if (!g || S.chk3 || lab.view !== 'bench') return;
  const card = g.closest('[data-card]'), r = card.getBoundingClientRect();
  drag = { k: g.dataset.grip, id: ev.pointerId, x: ev.clientX, y: ev.clientY, on: false, card, w: r.width, gh: null };
  g.setPointerCapture?.(ev.pointerId);
});
const zoneAt = (x, y) => {
  const els = document.elementsFromPoint(x, y);
  return els.find((e) => e.dataset?.zone)?.dataset.zone ?? null;
};
addEventListener('pointermove', (ev) => {
  if (!drag || ev.pointerId !== drag.id) return;
  if (!drag.on && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) > 8) {
    drag.on = true; const gh = drag.card.cloneNode(true); gh.classList.add('rv-gh'); gh.style.width = `${Math.min(drag.w, 190)}px`; document.body.append(gh); drag.gh = gh; drag.card.style.opacity = '.35';
  }
  if (drag.on) {
    drag.gh.style.left = `${ev.clientX - 20}px`; drag.gh.style.top = `${ev.clientY - 20}px`;
    const z = zoneAt(ev.clientX, ev.clientY);
    document.querySelectorAll('.rv-zone').forEach((e) => e.classList.toggle('over', e.dataset.zone === z));
  }
});
const endDrag = (ev) => {
  if (!drag || ev.pointerId !== drag.id) return;
  const d = drag; drag = null;
  document.querySelectorAll('.rv-zone').forEach((e) => e.classList.remove('over'));
  if (!d.on) return;
  d.gh?.remove(); d.card.style.opacity = '';
  const z = ev.type === 'pointerup' ? zoneAt(ev.clientX, ev.clientY) : null;
  if (z) place(d.k, z);
};
addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'undo') {
    const last = S.hist.pop(); if (!last) return;
    S.P = JSON.parse(last); S.verdict = null; S.tool = null; S.selId = null; S.opt = null; S.wasted = null; sfx.click(); render();
  } else if (act === 'reset') { stopSay(); resetDraft(); sfx.click(); render(); }
  else if (act === 'secA') {
    if (!secret.unlocked()) return secret.open();
    if (lab.view !== 'revise') $('views').querySelector('[data-view="revise"]').click();
    stopSay(); resetDraft(); S.edited = true; sfx.click(); render(); showStage();
  } else if (act === 'secB') {
    if (!secret.unlocked()) return secret.open();
    if (S.say >= 0) { stopSay(); sfx.click(); render(); return; }
    if (lab.view === 'bench') $('views').querySelector('[data-view="revise"]').click();
    sfx.click(); startSay(); showStage();
  }
});

render();
</script>
</body>
