const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);

const rnd = (seed) => { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }; // stable pseudo-random 0..1

// text on the canvas always sits in a dark pill and is clamped inside the canvas
function pill(c, text, x, y, w, h, o = {}) {
  const size = o.size ?? 12.5;
  c.save(); c.font = `800 ${size}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const pw = c.measureText(text).width + 18, ph = size + 10;
  const px = clamp(x, pw / 2 + 4, Math.max(pw / 2 + 4, w - pw / 2 - 4)), py = clamp(y, ph / 2 + 4, Math.max(ph / 2 + 4, h - ph / 2 - 4));
  c.globalAlpha = o.alpha ?? 1;
  c.fillStyle = o.fill ?? 'rgba(11,20,36,.84)'; c.strokeStyle = o.stroke ?? 'rgba(255,255,255,.28)'; c.lineWidth = 1;
  c.beginPath(); c.roundRect(px - pw / 2, py - ph / 2, pw, ph, ph / 2); c.fill(); c.stroke();
  c.fillStyle = o.color ?? '#fff'; c.fillText(text, px, py + 0.5);
  c.restore();
}

function smooth(P, seg, closed) {

    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);

      const t = s / seg, t2 = t * t, t3 = t2 * t;

    }
  }
  out.push(closed ? out[0] : P[n - 1]);
  return out;
}
function makePath(ctrl, closed = false) {
  const pts = smooth(ctrl, 10, closed), n = pts.length, cum = [0], nx = [], ny = [];
  for (let i = 1; i < n; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    nx.push(-dy / l); ny.push(dx / l);
  }
  return { pts, cum, nx, ny, total: cum[n - 1], closed };
}
// position and heading at distance s along a path
function at(P, s) {
  s = P.closed ? ((s % P.total) + P.total) % P.total : clamp(s, 0, P.total);
  let lo = 0, hi = P.cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P.cum[m] <= s) lo = m; else hi = m; }
  const a = P.pts[lo], b = P.pts[hi], seg = P.cum[hi] - P.cum[lo] || 1, f = (s - P.cum[lo]) / seg;

}

// --- ribbons: a wide soft band with many small arrows streaming along it --------------------------------------------
// o: { p: how much is drawn (0..1), alpha, t: time, speed: px per second of the streaks }
function drawRibbon(c, rb, G, k, o) {
  const { pts, nx, ny } = rb.path, n = pts.length, closed = rb.path.closed;
  const last = Math.max(1, Math.floor((n - 1) * clamp01(o.p ?? 1)));
  if (last < 3) return;

  const X = (i) => G.x + pts[i][0] * S0, Y = (i) => G.y + pts[i][1] * S0;
  const half = (i) => Math.max(rb.widthAt(i / (n - 1)) * S0, rb.minW * k) / 2;
  const paint = (al) => {
    if (closed) return rgba(rb.pal[1], al);
    const g = c.createLinearGradient(X(0), Y(0), X(n - 1), Y(n - 1));
    g.addColorStop(0, rgba(rb.pal[0], al)); g.addColorStop(1, rgba(rb.pal[1], al));
    return g;
  };
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  for (const [m, al] of [[1, 0.10], [0.66, 0.13], [0.36, 0.17]]) { // layered bands make the soft glow
    c.beginPath();
    for (let i = 0; i <= last; i++) { const h = half(i) * m, x = X(i) + nx[i] * h, y = Y(i) + ny[i] * h; if (i) c.lineTo(x, y); else c.moveTo(x, y); }
    for (let i = last; i >= 0; i--) { const h = half(i) * m; c.lineTo(X(i) - nx[i] * h, Y(i) - ny[i] * h); }
    c.closePath(); c.fillStyle = paint(al * a); c.fill();
  }
  const lanes = [-0.8, -0.4, 0, 0.4, 0.8];
  lanes.forEach((off, j) => {
    c.beginPath();
    for (let i = 0; i <= last; i++) { const h = half(i) * off, x = X(i) + nx[i] * h, y = Y(i) + ny[i] * h; if (i) c.lineTo(x, y); else c.moveTo(x, y); }
    c.setLineDash([[8, 14, 6, 12, 9][j] * k, [20, 26, 18, 28, 22][j] * k]);
    c.lineDashOffset = -(o.t * o.speed * k + j * 13);
    c.strokeStyle = paint((j === 2 ? 0.95 : 0.7) * a); c.lineWidth = (j === 2 ? 2.4 : 1.7) * k; c.stroke();
  });
  c.setLineDash([]);
  // small chevrons riding along the middle of the band
  c.strokeStyle = `rgba(255,255,255,${0.6 * a})`; c.lineWidth = 1.6 * k;
  for (let m = 0; m < 9; m++) {
    const u = (m / 9 + o.t * 0.035) % 1, i = Math.floor(u * (n - 1));
    if (i >= last || i < 1) continue;
    const dx = X(i + 1) - X(i), dy = Y(i + 1) - Y(i), ang = Math.atan2(dy, dx), off = (m % 3 - 1) * 0.35 * half(i);
    c.save(); c.translate(X(i) + nx[i] * off, Y(i) + ny[i] * off); c.rotate(ang);
    c.beginPath(); c.moveTo(-4.2 * k, -3.6 * k); c.lineTo(0, 0); c.lineTo(-4.2 * k, 3.6 * k); c.stroke(); c.restore();
  }
  if (o.p < 1) { // a glowing head while the ribbon draws itself
    const r = 15 * k, g = c.createRadialGradient(X(last), Y(last), 0, X(last), Y(last), r);
    g.addColorStop(0, rgba('#FFFFFF', 0.85 * a)); g.addColorStop(1, rgba(rb.pal[0], 0));
    c.fillStyle = g; c.beginPath(); c.arc(X(last), Y(last), r, 0, 7); c.fill();
  }
  c.restore();
}

  const hl = c.createLinearGradient(L.tx, 0, L.tx + L.tw * 0.2, 0); hl.addColorStop(0, 'rgba(255,255,255,.22)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = hl; c.beginPath(); c.roundRect(L.tx + 5 * k, L.ty + 8 * k, L.tw * 0.14, L.th - 22 * k, 8 * k); c.fill();
  c.fillStyle = 'rgba(255,255,255,.14)'; c.beginPath(); c.roundRect(L.tx - 2 * k, L.ty + L.th - 6 * k, L.tw + 4 * k, 9 * k, 4 * k); c.fill();
  c.restore();
  // jugs
  const tilt = (!v0 || e < 0) ? 0 : e < 0.7 ? ease(e / 0.7) : e < 3.1 ? 1 : 1 - ease((e - 3.1) / 0.8);
  const flow = !v0 ? 0 : ease((e - 0.7) / 0.2) * (1 - ease((e - 3.0) / 0.2));
  const level = 0.8 - 0.62 * clamp01((e - 0.8) / 2.3);
  const jugs = K.q === 0 ? [{ f: 0.56, col: COL.cold, mir: false, sh: false, kind: 'cold' }]
    : [{ f: 0.43, col: '#CFEFFF', mir: false, sh: false, kind: 'fresh' }, { f: 0.57, col: COL.salt, mir: true, sh: true, kind: 'salt' }];
  const spoutY = L.ty - 14 * k;
  for (const j of jugs) {
    const px = L.tx + L.tw * j.f;
    drawJug(c, px, spoutY, k, tilt, j.col, level, j.mir, j.sh);
    if (flow > 0.02) { // the stream from the spout to the water
      const sy = I.y;
      c.save(); c.lineCap = 'round'; c.strokeStyle = rgba(j.col, 0.85 * flow); c.lineWidth = 4.6 * k * flow; c.beginPath();
      for (let y = spoutY, i = 0; y <= sy; y += 4, i++) { const x = px + Math.sin(y * 0.12 + t * 9) * 0.8 * k; if (i) c.lineTo(x, y); else c.moveTo(x, y); }
      c.stroke(); c.strokeStyle = `rgba(255,255,255,${0.35 * flow})`; c.lineWidth = 1.4 * k; c.stroke(); c.restore();
    }
  }
  if (K.b > 0.01) drawBelt(c, L, t, K.b, k);
  readout();
}
// the conveyor belt: cold, salty water sinks near Greenland, and warm water is pulled north to replace it
function drawBelt(c, L, t, b, k) {
  const { ix, iy, iw, ih } = L, a = ease(b), k2 = k * 0.62;
  c.save(); c.globalAlpha = a;
  c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.roundRect(ix + 3, iy + 5, iw, ih, 14); c.fill();
  c.beginPath(); c.roundRect(ix, iy, iw, ih, 14); c.save(); c.clip(); c.translate(ix, iy);
  drawSea(c, iw, ih, t);
  const s2 = Math.min(iw / W, ih / H), G2 = { x: (iw - W * s2) / 2, y: (ih - H * s2) / 2, s: s2 };
  drawRibbon(c, RB.deep, G2, k2, { p: 1, t, speed: 40, alpha: 0.7 });
  drawRibbon(c, RB.warm, G2, k2, { p: 1, t, speed: 60, alpha: 1 });
  drawLand(c, G2, k2, ATL);
  const sx = G2.x + AX(-33) * s2, sy = G2.y + AY(60.5) * s2, r = 30 * k2 * (1 + 0.1 * Math.sin(t * 3));
  const g = c.createRadialGradient(sx, sy, 0, sx, sy, r * 1.6); g.addColorStop(0, rgba(COL.cold, 0.75)); g.addColorStop(1, rgba(COL.cold, 0));
  c.fillStyle = g; c.beginPath(); c.arc(sx, sy, r * 1.6, 0, 7); c.fill();
  c.strokeStyle = COL.cold2; c.lineWidth = 2.2 * k2; c.lineCap = 'round'; c.lineJoin = 'round';
  for (let j = 0; j < 3; j++) { // three arrows sinking
    const ph = (t * 0.9 + j / 3) % 1, ax = sx + (j - 1) * 9 * k2 * 1.4, ay = sy - 8 * k2 + ph * 22 * k2;
    c.globalAlpha = a * Math.sin(Math.PI * ph);
    c.beginPath(); c.moveTo(ax, ay - 7 * k2); c.lineTo(ax, ay + 7 * k2); c.moveTo(ax - 4.5 * k2, ay + 2 * k2); c.lineTo(ax, ay + 7.5 * k2); c.lineTo(ax + 4.5 * k2, ay + 2 * k2); c.stroke();
  }
  c.restore(); c.globalAlpha = a;
  c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(ix, iy, iw, ih, 14); c.stroke();
  c.restore();
}

// --- readout, state card and controls ----------------------------------------------------------------------------------------
function readout() {
  const t = T[lang], v = lab.view;
  let val = '?', sub = '', pl = '', col = '#FF8A4C';
  if (v === 'coasts') {
    if (S.sec === 'turtle') val = t.sec.years(turtleYears());
    else if (S.sec === 'ice') val = '❄️';
    else if (S.c.t1 >= 0) {
      const b = S.c.bk[S.c.bk.length - 1];
      if (b?.info) { val = b.info.kind === 'warm' ? t.c.warm : t.c.cold; sub = b.info.name ? t.c.names[b.info.name] : ''; } else { val = '🌊'; sub = t.c.drop; }
      if (S.c.t2 >= 0) pl = t.c.trip;
    }
  } else if (v === 'ducks') {
    col = '#4FB3FF';
    if (S.d.pick !== null) { val = t.d.months(Math.floor(S.d.months)); if (S.d.months >= 10) pl = t.d.alaska; }
  } else {
    col = '#9B7BFF';
    if (S.tk.pick !== null) val = '↓';
    if (S.tk.b > 0.5) pl = t.t.belt;
  }
  const key = [lang, v, val, sub, pl].join('|');
  if (key === lastRO) return;
  lastRO = key; lab.setReadout(val, sub, pl, col);
}
const secAvail = () => allDone() || secret.unlocked();
function ctrlHtml(t) {
  const v = lab.view, R = stateOf(v), qd = qDef(v, R.q ?? 0), asked = R.pick !== null;
  let h = `<div class="cu-q">${esc(qd.q)}</div><div class="cu-opts">${qd.o.map((o, i) =>
    `<button class="cu-o ${asked ? (i === qd.ok ? 'good' : i === R.pick ? 'bad' : 'dim') : ''}" data-act="pick" data-i="${i}"${asked ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
  if (asked) {
    h += `<div class="cu-v ${R.pick === qd.ok ? 'ok' : 'no'}">${esc(R.pick === qd.ok ? t.right : t.wrong)}</div><p class="cu-r">${esc(qd.r)}</p>`;
    if (v !== 'ducks' && R.q === 0) h += `<button class="btn cu-next" data-act="next">${esc(t.next)}</button>`;
    if (v === 'ducks') h += `<div class="row2"><button class="btn ghost" data-act="again">${esc(t.again)}</button>
      <label class="cu-sp"><span class="lbl">${esc(t.d.speed)}</span><input class="big" id="cuSpeed" type="range" min="0" max="2" step="1" value="${S.d.speed}" aria-label="${esc(t.d.speed)}"><b id="cuSpeedV">${SPEEDS[S.d.speed]}×</b></label></div>`;
    if (v === 'tank' && R.q === 1) h += `<button class="btn ghost cu-next" data-act="again">${esc(t.again)}</button>`;
  }
  if (secAvail()) {
    const open = secret.unlocked();
    const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    h += `<div class="row2"><div class="chips cu-chips">${chip('turtle', '🐢')}${chip('ice', '❄️')}</div></div>`;
  }
  return h;
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v !== 'coasts') S.sec = null;
  $('ctrlBody').innerHTML = ctrlHtml(t);
  let st;
  if (S.sec) st = [S.sec === 'turtle' ? '🐢' : '❄️', t.secrets[S.sec][0], S.sec === 'turtle' ? t.sec.turtleText : t.sec.iceText, ''];
  else st = t.st[v][isDone(v) ? 1 : 0];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] });
  lab.setGlow(v === 'coasts' ? 'rgba(255, 138, 76, .22)' : v === 'ducks' ? 'rgba(79, 179, 255, .26)' : 'rgba(155, 123, 255, .22)');
  lastRO = ''; readout();
}

// --- interaction ---------------------------------------------------------------------------------------------------------------
const showStage = () => { // on a phone the controls sit below the scene: bring the reveal into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function pick(v, i) {
  const R = stateOf(v);
  if (R.pick !== null) return;
  R.pick = i; (i === qDef(v, R.q ?? 0).ok ? sfx.good : sfx.bad)();
  if (v === 'coasts') { if (R.q === 0) R.t1 = 0; else R.t2 = 0; }
  else if (v === 'ducks') { R.e = 0; R.months = 0; R.al = -1; }
  else startPour();
  showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'pick') pick(v, +b.dataset.i);
  else if (act === 'next') {
    const R = stateOf(v); R.q = 1; R.pick = null; sfx.click();
    if (v === 'tank') { R.plumes = []; R.e = 0; R.b = 0; }
  } else if (act === 'again') {
    sfx.click();
    if (v === 'ducks') { S.d.e = 0; S.d.months = 0; S.d.al = -1; } else startPour();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (v !== 'coasts') { lab.view = 'coasts'; lab.renderChrome(); }
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k;
    if (S.sec === 'turtle') S.tt = 0; else S.icT = 0;
    sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => { // the speed slider keeps its element while dragging: no full render
  if (ev.target.id !== 'cuSpeed') return;
  S.d.speed = clamp(+ev.target.value, 0, 2); $('cuSpeedV').textContent = `${SPEEDS[S.d.speed]}×`; sfx.tick();
});
$('cv').addEventListener('pointerdown', (ev) => { // free play on the map: drop a bottle on the sea
  if (lab.view !== 'coasts' || S.sec || S.c.t1 < 0) return;
  const r = $('cv').getBoundingClientRect(), G = mapRect(r.width, r.height);
  const x = (ev.clientX - r.left - G.x) / G.s, y = (ev.clientY - r.top - G.y) / G.s;
  if (x < 0 || x > W || y < 0 || y > H || onLand(x, y)) return;
  S.c.bk.push({ x, y, trail: [], tt: 0, rip: 0, ang: 0, info: null });
  if (S.c.bk.length > 5) S.c.bk.shift();
  sfx.click();
});

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'coasts') drawCoasts(c, w, h, dt, time);
  else if (v === 'ducks') drawDucks(c, w, h, dt, time);
  else drawTank(c, w, h, dt, time);
});
render();
</script>
