$c.addEventListener('input', (ev) => {
  const P = S.pw;
  if (ev.target.id === 'pwLen') { P.len = clamp(+ev.target.value, 1, 16); if (P.phase === 'cmp') P.phase = 'free'; genTiles(); render(); }
  else if (ev.target.id === 'pwIn') { P.typed = ev.target.value.slice(0, 40); P.listT = 0; render(); }
});

// --- one render per change: controls, readout and the state card -------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secLock').style.display = v === 'lock' ? 'block' : 'none';
  $('secPw').style.display = v === 'password' ? 'block' : 'none';
  scEl.style.display = v === 'secret' ? 'block' : 'none';
  $('cv').style.display = v === 'secret' ? 'none' : 'block';
  if (v === 'lock') renderLock(t); else if (v === 'password') renderPw(t); else renderSecretView(t);
}
function renderLock(t) {
  const L = S.lk, n = S.n, N = 10 ** n;
  lab.setGlow('rgba(226, 181, 82, .26)');
  $('lkN').textContent = n; $('lkWL').textContent = t.wheels;
  $c.querySelector('[data-act=wm]').disabled = n <= 1; $c.querySelector('[data-act=wp]').disabled = n >= 4;
  $('lkRun').textContent = t.run; $('lkRun').disabled = S.ask || isBusy();
  $('lkHint').textContent = t.setCode;
  const open = secret.unlocked();
  $('lkSec').innerHTML = `<button class="chip secret ${open ? 'open' : ''} ${S.sec === 'lucky' ? 'on' : ''}" data-act="seca" type="button">${open ? `🎲 ${esc(t.secrets.a[0])}` : '🔒 ???'}</button>`;
  if (S.ask) {
    const base = n === 1 ? [10, 1, 11] : [N, 10 * n, 10 + n];
    $('lkQ').innerHTML = `<div class="pw-qt">${esc(t.qLock(n))}</div><div class="pw-opts">${S.ord.map((i) => `<button class="pw-opt" data-act="ans" data-v="${base[i]}" type="button">${fmt(base[i])}</button>`).join('')}</div>`;
    lab.setReadout('?', '', '', '#e2b552');
    lab.setState({ emo: '🤔', title: t.qLock(n), lead: '', body: '' });
    lab.setFacts([]);
    return;
  }
  const formula = Array(n).fill(10).join(' × ');
  $('lkQ').innerHTML = S.guess === null ? '' : `<div class="pw-verdict">${S.guess === N ? `<b class="ok">${esc(t.right)}</b>` : `<b class="no">${esc(t.notQuite)}</b>`} ${esc(n > 1 ? `${formula} = ${fmt(N)}` : fmt(N))}</div>`;
  lab.setReadout(fmt(N), n > 1 ? formula : '', t.codes, '#e2b552');
  const st = t.state.lock;
  if (S.sec === 'lucky') {
    const avg = L.runs.length ? Math.round(L.runs.reduce((a, b) => a + b, 0) / L.runs.length) : 0;
    lab.setState({ emo: '🎲', title: t.secrets.a[0], lead: t.secrets.a[1], body: avg ? t.luckyAvg(fmt(avg)) : '' });
  } else if (L.phase === 'found') lab.setState({ emo: '🔓', title: t.opened(fmt(L.K)), lead: st.lead, body: st.body });
  else lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body });
  lab.setFacts(t.facts.lock);
}
function renderPw(t) {
  const P = S.pw, A = alphabet(), asking = P.phase === 'ask', cmp = P.phase === 'cmp';
  lab.setGlow('rgba(124, 196, 255, .24)');
  if (!P.chars.length) genTiles();
  $('pwFree').style.display = asking ? 'none' : 'block';
  if (asking) {
    $('pwQ').innerHTML = `<div class="pw-qt">${esc(t.qWords)}</div><div class="pw-opts">${P.ord.map((i) => `<button class="pw-opt" data-act="pa" data-v="${i}" type="button">${esc(t.optsWords[i])}</button>`).join('')}</div>`;
    lab.setReadout('?', '', '', '#7cc4ff');
    lab.setState({ emo: '🤔', title: t.qWords, lead: '', body: '' });
    lab.setFacts([]);
    return;
  }
  $('pwQ').innerHTML = cmp ? `<div class="pw-verdict">${P.answer === 1 ? `<b class="ok">${esc(t.right)}</b>` : `<b class="no">${esc(t.notQuite)}</b>`} ${esc(t.wordsWin)}</div>` : '';
  const open = secret.unlocked();
  $('pwSec').innerHTML = `<button class="chip secret ${open ? 'open' : ''} ${P.list ? 'on' : ''}" data-act="secb" type="button">${open ? `📋 ${esc(t.secrets.b[0])}` : '🔒 ???'}</button>`;
  $('pwSliders').style.display = P.list ? 'none' : 'block';
  $('pwList').style.display = P.list ? 'block' : 'none';
  let val, sub, tm = '', st = t.state.password;
  if (P.list) {
    const typed = P.typed, match = POP.indexOf(typed.toLowerCase());
    $('pwListL').textContent = t.listPick;
    const inp = $('pwIn'); if (inp.value !== typed) inp.value = typed;
    $('pwPops').innerHTML = POP.map((p) => `<button class="pw-pop" data-act="pop" data-v="${esc(p)}" type="button">${esc(p)}</button>`).join('');
    const res = $('pwRes');
    if (!typed) { val = '?'; sub = ''; res.className = 'pw-res'; res.textContent = ''; }
    else if (match >= 0) { val = esc(typed.slice(0, 16)); sub = t.cracked; res.className = 'pw-res ok'; res.textContent = `✓ ${t.cracked}`; }
    else {
      const ks = { d: /\d/.test(typed), l: /[a-z]/.test(typed), u: /[A-Z]/.test(typed), s: /[^a-zA-Z0-9]/.test(typed) };
      const a2 = Object.keys(KS).reduce((s, k) => s + (ks[k] ? KS[k] : 0), 0), cnt = a2 ** typed.length;
      val = esc(typed.slice(0, 16)); sub = `${big(cnt)} ${t.howMany}`;
      res.className = 'pw-res no'; res.textContent = `${t.notOnList} ${t.billion} ${dur(cnt / 1e9)}`;
    }
    st = { emo: '📋', title: t.secrets.b[0], lead: t.secrets.b[1], body: '' };
  } else {
    $('pwLL').textContent = t.length; $('pwLV').textContent = P.len;
    const sl = $('pwLen'); if (+sl.value !== P.len) sl.value = P.len;
    $('pwKinds').innerHTML = Object.keys(KS).map((k) => `<button class="pw-kind ${P.kinds[k] ? 'on' : ''}" data-act="kind" data-k="${k}" type="button">${esc(t.kinds[k])}</button>`).join('');
    $('pwNote').textContent = t.logNote;
    const count = A ** P.len;
    if (cmp) { val = big(7776 ** 3); sub = t.wordsNote; }
    else { val = big(count); sub = factors(A, P.len); tm = `${t.billion} <b>${esc(dur(count / 1e9))}</b>`; }
  }
  $('pwTime').innerHTML = P.list ? '' : tm;
  lab.setReadout(val, sub, '', '#7cc4ff');
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body });
  lab.setFacts(t.facts.password);
}
render();
</script>
