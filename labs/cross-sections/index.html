  drawScene(c, cam, info.solid, info.pl, { alpha: 1, planeA: pa, hs, slice: info.show ? { an: info.an, a: pa, dots: true } : null });
  drawFlat(c, L.card, info.an, info.show, cam, dt, now);
  updateReadout(info);
  drawConfetti(c, w, h, dt, now);
});

// --- readout, controls and state card, one render per change ------------------------------------------------------
function updateReadout(info) {
  const t = T[lang], v = lab.view, C = S.cube, O = S.sol, K = S.scan;
  let val, sub, pill_, col;
  if (v === 'scanner') { val = t.round(K.round + 1); sub = ''; pill_ = t.score(K.score); col = '#a9791a'; }
  else if (v === 'cube') {
    const k = foundCount(); pill_ = k === SHAPES5.length ? t.allFound : t.found(k, SHAPES5.length); col = '#7e63c4';
    const nm = info && info.show ? info.an.cls.name : null;
    if (!(info && info.show)) { val = '?'; sub = ''; } else if (!nm) { val = '–'; sub = ''; } else { val = info.an.cls.sides ? t.sides(info.an.cls.sides) : t.shapes[nm]; sub = info.an.cls.sides ? t.shapes[nm] : ''; }
  } else {
    pill_ = t.solidsNames[S.sol.id]; col = '#3f8fd6';
    const nm = info && info.show ? info.an.cls.name : null;
    if (!(info && info.show)) { val = '?'; sub = ''; } else if (!nm) { val = '–'; sub = ''; } else { val = t.shapes[nm]; sub = info.an.cls.sides ? t.sides(info.an.cls.sides) : ''; }
  }
  const key = `${lang}|${v}|${val}|${sub}|${pill_}`;
  if (key === readKey) return;
  readKey = key; lab.setReadout(esc(val), sub, pill_, col);
}
function askHTML(q, opts, right, ans, okTxt, badTxt) {
  const chips = opts.map((o, i) => {
    let cls = 'chip cs-pc';
    if (ans !== null) cls += i === right ? ' cs-ok' : i === ans ? ' cs-bad' : ' cs-dim';
    return `<button type="button" class="${cls}" data-act="pick" data-i="${i}">${esc(o)}</button>`;
  }).join('');
  const vd = ans === null ? '' : `<div class="cs-vd ${ans === right ? 'ok' : 'bad'}">${esc(ans === right ? okTxt : badTxt)}</div>`;
  return `<div class="cs-q">${esc(q)}</div><div class="chips cs-cr">${chips}</div>${vd}`;
}
function syncSliders(skipActive) {
  const P = currentParams(), t = T[lang];
  for (const el of document.querySelectorAll('#csSl input[data-k]')) {
    const k = el.dataset.k;
    if (!(skipActive && document.activeElement === el)) el.value = String(P[k]);
    $(k === 'tilt' ? 'csVTilt' : k === 'turn' ? 'csVTurn' : 'csVPos').textContent = k === 'pos' ? `${Math.round(P[k] * 100)}%` : `${Math.round(P[k])}°`;
  }
  $('csLTilt').textContent = t.tilt; $('csLTurn').textContent = t.turn; $('csLPos').textContent = t.pos;
}
function render() {
  const t = T[lang], v = lab.view, C = S.cube, O = S.sol, K = S.scan;
  document.body.dataset.v = v;
  const isCube = v === 'cube', isSol = v === 'solids', isScan = v === 'scanner';
  const P = currentParams(), asked = isCube ? C.asked : isSol ? O.asked : true;
  let ask, ans;
  if (isCube) { ans = C.ans; ask = askHTML(t.cubeAsk, t.cubeOpts, 1, ans, t.cubeRight, t.cubeWrong); }
  else if (isSol) { ans = O.ans; ask = askHTML(t.solidsAsk, t.solidsOpts, 2, ans, t.solidsRight, t.solidsWrong); }
  else { ans = K.ans; const rt = K.order[K.round]; ask = askHTML(t.scanAsk, t.scanOpts, rt, ans, t.scanRight, t.scanWrong(t.scanOpts[rt])); }
  $('csAsk').innerHTML = ask; $('csAsk').className = 'cs-ask' + (ans !== null ? ' cs-done' : '');
  // sliders: built once, only their state changes here
  const locked = !asked || !!P.glide || !!S.sec;
  $('csSl').style.display = isScan ? 'none' : 'block'; $('csSl').classList.toggle('cs-off', locked);
  $('csRowTurn').style.display = isCube || (isSol && O.id === 'pyramid') ? 'grid' : 'none';
  const tl = document.querySelector('#csSl input[data-k=tilt]'); tl.max = isCube ? '80' : '90';
  document.querySelectorAll('#csSl input').forEach((el) => { el.disabled = locked; });
  syncSliders(false);
  // chips
  $('csFound').style.display = isCube && C.asked ? 'flex' : 'none'; // the shapes would give the answer away before the guess
  $('csFound').innerHTML = SHAPES5.map((k) => `<span class="chip cs-chip${C.found[k] ? ' cs-got' : ''}${C.pop === k && C.found[k] ? ' cs-pop' : ''}" style="cursor:default">${svgIcon(k)}${esc(t.shapes[k])}</span>`).join('');
  C.pop = '';
  $('csSolids').style.display = isSol ? 'flex' : 'none';
  $('csSolids').className = 'chips' + (O.asked ? '' : ' cs-off');
  $('csSolids').innerHTML = ['cylinder', 'cone', 'pyramid', 'sphere'].map((k) => `<button type="button" class="chip cs-chip${O.id === k ? ' on' : ''}" data-act="solid" data-id="${k}">${esc(t.solidsNames[k])}</button>`).join('');
  $('csNext').style.display = isScan && K.ans !== null ? 'flex' : 'none'; $('csNextB').textContent = `${t.next} →`;
  const open = secret.unlocked();
  $('csSec').style.display = isCube || isSol ? 'flex' : 'none';
  $('csSec').className = 'row2' + (asked ? '' : ' cs-off');
  $('csSec').innerHTML = [['a', '🔺'], ['b', '🎲']].map(([k, emo]) => `<button type="button" class="chip secret cs-chip ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  // state card
  lab.setGlow(isCube ? 'rgba(150, 120, 220, .28)' : isSol ? 'rgba(80, 150, 230, .28)' : 'rgba(224, 176, 80, .24)');
  if (S.sec === 'a') lab.setState({ emo: '🔺', title: t.secrets.a[0], lead: t.tetraText, body: '', extra: '' });
  else if (S.sec === 'b') lab.setState({ emo: '🎲', title: t.secrets.b[0], lead: t.cornerText, body: '', extra: '' });
  else if (isScan && ans === null) lab.setState({ emo: '🤔', title: t.scanAsk, lead: '', body: '', extra: '' });
  else if (isScan) { const s = t.st.scanner; lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' }); }
  else if (!asked) lab.setState({ emo: '🤔', title: isCube ? t.cubeAsk : t.solidsAsk, lead: '', body: '', extra: '' });
  else { const s = isCube ? t.st.cube : t.st.solids; lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' }); }
  lab.setFacts(t.facts[isCube ? 'cube' : isSol ? 'solids' : 'scanner']);
  readKey = '';
  updateReadout(isScan ? null : sceneInfo(nowS()));
}
render();
</script>
