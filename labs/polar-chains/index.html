  const gone = v === 'gone', gate = gone && !S.s.checked;
  const sc = gone && S.c.sel ? healthOf(S.c.sel) : null;
  const dispH = (id) => (sc ? lerp(1, sc.h[id], ease((t - S.c.t0 - sc.depth[id] * 0.7) / 0.6)) : 1);
  if (vk === 's') { // the krill swarm behind the krill node; it thins out when krill become scarce
    const n = Math.round(30 * (gone ? dispH('kri') : 1)), [kx, ky] = nodes.kri;
    for (let i = 0; i < n; i++) {
      const a = rnd(i) * TAU + t * 0.1 * (rnd(i + 3) - 0.5), r = 36 + Math.sqrt(rnd(i + 20)) * 38, x = kx + Math.cos(a) * r, y = ky + Math.sin(a) * r * 0.8 + Math.sin(t * 0.9 + i) * 2, dir = Math.cos(a) > 0 ? 1 : -1;
      c.save(); c.globalAlpha = 0.75; c.translate(x, y); c.rotate(-0.3 * dir); c.scale(0.3 * dir, 0.3); krill(c, 1, t, i); c.restore();
    }
  }
  const geo = (key) => { const [a, b] = key.split('>'); return edgeGeom(nodes[a], nodes[b]); };
  if (gone) {
    if (!gate) for (const key of CH.s.req) {
      const [a, b] = key.split('>'), g = geo(key), act = sc && sc.h[a] < 1 && sc.h[b] < 1, p = act ? ease((t - S.c.t0 - sc.depth[a] * 0.7 - 0.35) / 0.4) : 0;
      arrow(c, g, 1, 'rgba(235,248,255,.45)', 2, null, 0, null);
      if (p > 0) arrow(c, g, p, '#ff8a5e', 3.2, [7, 6], -t * 26, 'rgba(255,120,70,.7)');
    }
  } else {
    for (const e of st.edges) arrow(c, geo(e.key), ease((t - e.t0) / 0.35), e.opt ? '#bfe9ff' : '#ffe08f', 3.4, null, 0, t - e.t0 < 0.9 ? 'rgba(255,214,120,.9)' : 'rgba(255,200,80,.45)');
    if (S.bounce) {
      const bo = S.bounce, p = (t - bo.t0) / 0.55;
      if (p >= 1) S.bounce = null; else if (nodes[bo.a]) {
        const A = nodes[bo.a], q = back(p), end = [lerp(bo.x, A[0], q), lerp(bo.y, A[1], q)];
        c.save(); c.globalAlpha = 1 - ease(p * 0.9); c.strokeStyle = '#ff6b5e'; c.lineWidth = 3; c.setLineDash([6, 5]); c.lineCap = 'round';
        c.beginPath(); c.moveTo(A[0], A[1]); c.lineTo(end[0], end[1]); c.stroke(); c.setLineDash([]); dot(c, end[0], end[1], 5, '#ff6b5e'); c.restore();
      }
    }
    if (S.drag && S.drag.vk === vk) {
      const A = nodes[S.drag.from]; c.save(); c.strokeStyle = '#fff'; c.lineWidth = 3; c.setLineDash([7, 6]); c.lineCap = 'round'; c.lineDashOffset = -t * 20;
      c.beginPath(); c.moveTo(A[0], A[1]); c.lineTo(S.drag.x, S.drag.y); c.stroke(); c.setLineDash([]); dot(c, S.drag.x, S.drag.y, 6, 'rgba(255,255,255,.9)'); c.restore();
    }
  }
  const hiddenN = vk === 'n' && !gone && !S.n.checked, late = ['cod', 'rsl', 'bea'];
  for (const id of Object.keys(nodes)) {
    const [x, y] = nodes[id];
    if (hiddenN && late.includes(id)) { questionMark(c, x, y); continue; }
    const rev = vk === 'n' && !gone && late.includes(id) ? back((t - S.n.revT) / 0.5) : 1, o = { pop: rev };
    if ((S.sel && S.sel.vk === vk && S.sel.id === id && !gone) || (S.drag && S.drag.vk === vk && S.drag.from === id && !gone)) { o.ring = '#ffe08f'; o.ringW = 3.5; o.glow = `rgba(255,224,143,${0.3 + 0.15 * Math.sin(t * 6)})`; }
    if (gone && sc) {
      const d = dispH(id); o.alpha = 0.4 + 0.6 * d; o.grey = (1 - d) * 0.5;
      if (id === S.c.sel) { o.ring = '#ffb05e'; o.ringW = 3.5; o.glow = 'rgba(255,176,94,.35)'; o.alpha = 1; o.grey = 0; }
    }
    medallion(c, id, x, y, t, o);
    pill(c, tx.n[id].lab, x, y + R + 15);
    if (gone && sc) {
      if (id === S.c.sel) badge(c, x + 22, y - 22, '↓', '#e8782e');
      else if (dispH(id) < HUNGRY && t - S.c.t0 - sc.depth[id] * 0.7 > 0.5) badge(c, x + 22, y - 22, '!', '#d94a3d');
    }
    if (!gone && st.checked && !st.edges.length && rev >= 1 && CH[vk].opts.includes(id)) { // the guess, marked, until the first arrow
      const ok = CH[vk].truth.includes(id); badge(c, x + 22, y - 22, ok ? '✓' : '✗', ok ? '#2fae74' : '#d94a3d');
    }
  }
  c.restore();
});

// --- pointer: drag from food to eater, or tap the food then tap the eater ---------------------------------------
const pt = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - G.ox) / G.s, (ev.clientY - r.top - G.oy) / G.s]; };
const nodeAt = (vk, x, y) => Object.entries(ND[vk]).find(([, p]) => Math.hypot(p[0] - x, p[1] - y) <= HIT)?.[0] ?? null;
cv.addEventListener('pointerdown', (ev) => {
  const vk = vkOf(lab.view); if (!vk || !S[vk].checked || doneOf(vk)) return;
  const [x, y] = pt(ev), id = nodeAt(vk, x, y);
  if (S.sel && S.sel.vk === vk && id && id !== S.sel.id) { const a = S.sel.id; S.sel = null; attempt(vk, a, id, x, y); return; }
  if (!id) { S.sel = null; if (S[vk].msg?.k === 'sel') { S[vk].msg = null; render(); } return; }
  S.sel = null; S.drag = { vk, from: id, x, y, sx: x, sy: y }; try { cv.setPointerCapture(ev.pointerId); } catch { /* no capture */ }
  sfx.tick();
});
cv.addEventListener('pointermove', (ev) => { if (!S.drag) return; const [x, y] = pt(ev); S.drag.x = x; S.drag.y = y; });
cv.addEventListener('pointerup', (ev) => {
  const d = S.drag; if (!d) return; S.drag = null;
  const [x, y] = pt(ev), id = nodeAt(d.vk, x, y);
  if (id && id !== d.from) attempt(d.vk, d.from, id, x, y);
  else if (Math.hypot(x - d.sx, y - d.sy) < 12) { S[d.vk].msg = { k: 'sel', a: d.from }; S.sel = { vk: d.vk, id: d.from }; render(); }
  else S.bounce = { a: d.from, x, y, t0: now() };
});
cv.addEventListener('pointercancel', () => { S.drag = null; });

function attempt(vk, a, b, px, py) {
  const C = CH[vk], st = S[vk], key = `${a}>${b}`;
  if (st.edges.some((e) => e.key === key)) { st.msg = { k: 'dup', a, b }; sfx.tick(); render(); return; }
  const isReq = C.req.includes(key), isOpt = C.opt.includes(key);
  if (isReq || isOpt) {
    st.edges.push({ key, opt: isOpt, t0: now() }); st.msg = { k: 'good', a, b, rare: key === 'wha>orc' }; sfx.good();
    if (doneOf(vk)) { S.sel = null; setTimeout(showStage, 300); }
  } else {
    const rev = C.req.includes(`${b}>${a}`) || C.opt.includes(`${b}>${a}`);
    st.msg = { k: rev ? 'rev' : vk === 's' && key === 'pen>sea' ? 'seal' : 'gen', a, b };
    S.bounce = { a, x: px, y: py, t0: now() }; sfx.bad();
  }
  render();
}
// on a phone the controls sit below the picture: bring the reveal into view
function showStage() {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// --- control panel -------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, vk = vkOf(lab.view);
  if (act === 'pick' && vk) { const p = S[vk].picks; p.has(b.dataset.id) ? p.delete(b.dataset.id) : p.add(b.dataset.id); sfx.tick(); }
  else if (act === 'check' && vk) {
    const st = S[vk], truth = CH[vk].truth, ok = st.picks.size === truth.length && truth.every((x) => st.picks.has(x));
    st.checked = true; st.revT = now(); (ok ? sfx.good : sfx.bad)(); setTimeout(showStage, 150);
  } else if (act === 'reset' && vk) { S[vk].edges = []; S[vk].msg = null; S.sel = null; sfx.click(); }
  else if (act === 'gogo') { document.querySelector('#views [data-view="south"]')?.click(); return; }
  else if (act === 'cpick') { S.c.pick = b.dataset.id; S.c.sel = b.dataset.id; S.c.t0 = now(); S.c.moved = false; sfx.click(); setTimeout(showStage, 150); }
  else if (act === 'csel') { S.c.sel = b.dataset.id; S.c.t0 = now(); S.c.moved = true; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; if (k === 'space') S.zoom = 0; sfx.click();
  } else if (act === 'day') { const n = clamp(S.days + +b.dataset.d, 1, 7); if (n !== S.days) { S.days = n; S.dayT = now(); sfx.tick(); } }
  else if (act === 'zoom') { S.zoom = (S.zoom + 1) % 3; sfx.click(); }
  render();
});

// --- render: controls, readout, state card and facts for every view -------------------------------------------
const names = (t, ids) => ids.map((i) => t.n[i].lab).join(', ');
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v === 'gone') renderGone(t); else renderChain(t, vkOf(v));
}
function renderChain(t, vk) {
  const C = CH[vk], st = S[vk], tx = vk === 's' ? t.s : t.nth, done = doneOf(vk), ok = st.picks.size === C.truth.length && C.truth.every((x) => st.picks.has(x));
  const req = C.req.filter((r) => st.edges.some((e) => e.key === r)).length;
  lab.setGlow(vk === 's' ? 'rgba(58, 169, 205, .28)' : 'rgba(150, 200, 255, .24)');
  const chips = C.opts.map((id) => {
    const cls = !st.checked ? (st.picks.has(id) ? 'on' : '') : st.picks.has(id) ? (C.truth.includes(id) ? 'good' : 'bad') : C.truth.includes(id) ? 'miss' : '';
    return `<button class="pc-chip ${cls}" data-act="pick" data-id="${id}"${st.checked ? ' disabled' : ''}>${esc(t.n[id].lab)}</button>`;
  }).join('');
  $('ctrlBody').innerHTML = `<div class="pc-q">${esc(tx.q)}</div><div class="pc-chips">${chips}</div>` + (!st.checked
    ? `<div class="pc-row"><button class="btn pc-btn" data-act="check"${st.picks.size ? '' : ' disabled'}>${esc(t.chk)}</button></div>`
    : `${done ? '' : `<div class="pc-hint">${esc(t.draw[1])}</div>`}<div class="pc-row"><button class="chip" data-act="reset">${esc(t.reset)}</button></div>`);
  const F = t.facts, fact = (k, e) => ({ emo: e, text: F[k][0], src: F[k][1] });
  if (!st.checked) {
    lab.setReadout('?', tx.q, '', '#3aa9cd');
    lab.setState({ emo: vk === 's' ? '🦐' : '🧭', title: tx.q, lead: tx.sub, body: '' });
    lab.setFacts(vk === 's' ? [fact('size', '🦐'), fact('dens', '🌊')] : [fact('cod70', '🐟')]);
    return;
  }
  lab.setReadout(`${req}/${C.req.length}`, t.arrows, '', '#3aa9cd');
  const m = st.msg, A = m && t.n[m.a], B = m && m.b && t.n[m.b];
  const missed = C.truth.filter((x) => !st.picks.has(x)), extra = [...st.picks].filter((x) => !C.truth.includes(x));
  if (done) lab.setState({ emo: '🏆', title: tx.doneT, lead: tx.doneL, body: '' });
  else if (m && m.k === 'good') lab.setState({ emo: '✅', title: m.rare ? t.rare : t.sent(B, A), lead: t.toGo(C.req.length - req), body: C.opt.includes(`${m.a}>${m.b}`) ? t.optNote : '' });
  else if (m && m.k === 'sel') lab.setState({ emo: '👉', title: A.lab, lead: t.pickEater, body: '' });
  else if (m) lab.setState({ emo: '🙅', title: { rev: t.bRev, seal: t.bSeal, gen: t.bGen, dup: t.bDup }[m.k], lead: t.toGo(C.req.length - req), body: '' });
  else lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: tx.lead, body: [extra.length ? tx.extra(names(t, extra)) : '', missed.length ? tx.missed(names(t, missed)) : '', `${t.draw[0]}. ${t.draw[1]}`].filter(Boolean).join(' ') });
  lab.setFacts(vk === 's' ? [fact('crab', '🦭'), fact('ade', '🐧'), fact('dens', '🌊')] : [fact('codEat', '🐟'), fact('bear', '🐻‍❄️'), fact('peng', '🐧')]);
}
function renderGone(t) {
  const g = t.g, c = S.c;
  lab.setGlow('rgba(255, 176, 94, .22)');
  if (!S.s.checked) { // gated: the picture would show who eats krill
    $('ctrlBody').innerHTML = `<div class="pc-hint">${esc(g.gateL)}</div><div class="pc-row"><button class="btn pc-btn" data-act="gogo">${esc(g.gateGo)}</button></div>`;
    lab.setReadout('–', '', '', '#ffb05e'); lab.setState({ emo: '🔒', title: g.gateT, lead: g.gateL, body: '' }); lab.setFacts([]); return;
  }
  const hp = (id) => healthOf(id).hungry.length;
  let body = '';
  if (!c.pick) {
    body = `<div class="pc-q">${esc(g.q)}</div><div class="pc-chips">${['orc', 'pen', 'kri'].map((id) => `<button class="pc-chip" data-act="cpick" data-id="${id}">↓ ${esc(t.n[id].lab)}</button>`).join('')}</div><div class="pc-hint">${esc(g.qs)}</div>`;
    lab.setReadout('?', g.who, '', '#ffb05e'); lab.setState({ emo: '✂️', title: g.q, lead: g.qs, body: '' }); lab.setFacts([]);
  } else {
    const h = healthOf(c.sel), nm = t.n[c.sel].lab, first = !c.moved;
    body = `<div class="pc-lbl">${esc(g.from)}</div><div class="pc-chips">${ORDER.map((id) => `<button class="pc-chip ${id === c.sel ? 'src' : ''}" data-act="csel" data-id="${id}">↓ ${esc(t.n[id].lab)}</button>`).join('')}</div>`;
    lab.setReadout(h.hungry.length, g.hungry, `↓ ${nm}`, '#ffb05e');
    lab.setState({ emo: h.hungry.length ? '😟' : '🙂', title: first ? (c.pick === 'kri' ? t.right : t.notq) : `↓ ${nm}`,
      lead: h.hungry.length ? g.some(names(t, h.hungry)) : g.none, body: first ? `${g.cmp(hp('kri'), hp('pen'), hp('orc'))} ${g.try}` : '' });
    lab.setFacts([{ emo: '🦐', text: t.facts.bio[0], src: t.facts.bio[1] }, { emo: '🐋', text: t.facts.whale[0], src: t.facts.whale[1] }]);
    const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    body += `<div class="pc-secs">${sc('dinner', '🐋')}${sc('space', '🛰️')}</div>`;
    if (S.sec === 'dinner') {
      body += `<div class="pc-row"><button class="chip" data-act="day" data-d="-1"${S.days <= 1 ? ' disabled' : ''}>${esc(t.dn.minus)}</button><button class="chip" data-act="day" data-d="1"${S.days >= 7 ? ' disabled' : ''}>${esc(t.dn.plus)}</button></div>`;
      const n = S.days * KRILL_DAY;
      lab.setReadout(`${n} ${t.dn.u}`, `${S.days} ${t.dn.day(S.days)} × ${KRILL_DAY} ${t.dn.u}`, '', '#ffb05e');
      lab.setState({ emo: '🐋', title: t.dn.t(KRILL_DAY), lead: t.dn.lead, body: '' }); lab.setFacts([{ emo: '⚖️', text: t.facts.dinner[0], src: t.facts.dinner[1] }]);
    } else if (S.sec === 'space') {
      body += `<div class="pc-row"><button class="chip" data-act="zoom">${esc(S.zoom === 2 ? t.sp.again : t.sp.zoom)}</button></div>`;
      lab.setReadout(`${S.zoom + 1}/3`, t.sp.names[S.zoom], '', '#ffb05e');
      lab.setState({ emo: '🛰️', title: t.sp.names[S.zoom], lead: t.sp.leads[S.zoom], body: '' });
      lab.setFacts(S.zoom === 2 ? [{ emo: '🛰️', text: t.facts.space[0], src: t.facts.space[1] }, { emo: '📏', text: t.facts.swarm[0], src: t.facts.swarm[1] }] : [{ emo: '🌊', text: t.facts.dens[0], src: t.facts.dens[1] }]);
    }
  }
  $('ctrlBody').innerHTML = body;
}
render();
</script>
