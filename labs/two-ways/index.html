const seriesSolve = (list, shunt) => {
  const el = list.map((b) => (b.st === 'in' ? { R: R_N } : b.st === 'dead' && shunt ? { R: 0 } : { open: true }));
  const opens = el.filter((e) => e.open).length, sumR = el.reduce((s, e) => s + (e.open ? 0 : e.R), 0);
  const I = opens || sumR === 0 ? 0 : VB / sumR;
  const rows = list.map((b, i) => {
    const e = el[i], V = e.open ? (opens === 1 ? VB : null) : I * e.R, P = e.open ? 0 : I * I * e.R;
    return { st: b.st, R: R_N, V, I, P, g: glowOf(P), open: !!e.open, shorted: !e.open && e.R === 0 };

  return { kind: 'series', rows, I, opens };
};
function model() {
  const v = lab.view;
  if (S.sec === 'stairs') return { kind: 'stairs', lit: S.swA === S.swB };
  if (S.sec === 'lights') return seriesSolve(S.dead.map((d) => ({ st: d ? 'dead' : 'in' })), S.shunt);
  if (v === 'chain') return seriesSolve(Array.from({ length: S.n1 }, (_, i) => ({ st: S.out1 === i ? 'out' : 'in' })), false);
  if (v === 'side') {
    const R = RT[S.uneq ? 1 : 0].slice(0, S.nb);
    const rows = R.map((r, i) => { const open = S.out2[i], I = open ? 0 : VB / r, P = open ? 0 : VB * I; return { R: r, V: open ? 0 : VB, I, P, g: glowOf(P), open }; });
    return { kind: 'side', rows, I: rows.reduce((s, r) => s + r.I, 0) };
  }
  const gated = S.p2 === null;
  const rows = APPL.map((a, i) => ({ P: a.P, I: a.P / MAINS_V, on: !gated && S.on[i] }));
  const demand = rows.reduce((s, r) => s + (r.on ? r.I : 0), 0);
  return { kind: 'home', rows, demand, I: S.trip ? 0 : demand, gated };
}

function dots(c, pts, id, I, k, rad) {

  else if (q.v === 'side') { S.p2 = j; S.nb++; S.just2 = true; S.v2 = ok; }
  else { S.p3 = j; S.on[0] = true; S.just3 = true; S.v3 = ok; S.still = false; checkTrip(); }
  render(); showStage();
}
function doAct(a, i, s) {
  if (a === 'n1') {
    const n = clamp(S.n1 + s, 1, 3); if (n === S.n1) return;
    S.n1 = n; if (S.out1 >= n) S.out1 = -1; S.just1 = false; sfx.tick();
  } else if (a === 'un1' || a === 'bulb') unscrew1(i);
  else if (a === 'nb') {
    const n = clamp(S.nb + s, 1, 3); if (n === S.nb) return;
    if (n > S.nb && S.p2 === null) { S.prev2 = sideTotal(); S.q = { v: 'side' }; sfx.click(); }
    else { S.nb = n; if (n < 2) S.uneq = false; S.just2 = false; sfx.tick(); }
  } else if (a === 'uneq') { if (S.nb >= 2) { S.uneq = !S.uneq; S.just2 = false; sfx.click(); } }
  else if (a === 'un2' || a === 'bulb2') { if (S.p1 !== null && i < S.nb) { S.out2[i] = !S.out2[i]; S.just2 = false; sfx.snap(); } }
  else if (a === 'app') {
    if (S.p2 === null) return;
    if (!S.on[i] && i === 0 && S.p3 === null) { S.q = { v: 'home' }; sfx.click(); }
    else { S.on[i] = !S.on[i]; S.just3 = false; S.still = false; sfx.tick(); checkTrip(); }
  } else if (a === 'reset') {
    if (demandNow() > I_MAX) { S.still = true; A.flash = 0.8; sfx.bad(); } else { S.trip = false; S.still = false; sfx.snap(); }
  } else if (a === 'gate') { $('views').querySelector('[data-view="side"]')?.click(); return; }
  else if (a === 'swA') { S.swA = 1 - S.swA; sfx.snap(); }
  else if (a === 'swB') { S.swB = 1 - S.swB; sfx.snap(); }
  else if (a === 'shunt') { S.shunt = !S.shunt; sfx.click(); }
  else if (a === 'fresh') { S.dead = [false, false, false, false, false]; sfx.click(); }
  else if (a === 'dead') { S.dead[i] = !S.dead[i]; sfx.snap(); }
  render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.qo !== undefined) { answer(+b.dataset.qo); return; }
  if (b.dataset.sec) {
    if (!secret.unlocked()) { secret.open(); return; }
    const k = b.dataset.sec;
    S.sec = S.sec === k ? null : k; // each secret sets its own scene up
    if (S.sec === 'stairs') { S.swA = 0; S.swB = 0; }
    if (S.sec === 'lights') { S.dead = [false, false, false, false, false]; S.shunt = false; }
    sfx.click(); render(); return;
  }
  if (b.dataset.act) doAct(b.dataset.act, +b.dataset.i, +b.dataset.s);
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - A.ox) / sc, y = (ev.clientY - r.top - A.oy) / sc;
  const hit = HIT.find((h) => x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h);
  if (hit) doAct(hit.act, hit.i, 0);
});

// --- one render per change: controls, table, readout and the state card -------------------------------------
const tableHTML = (t, head, rows, tot) => `<table><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((x) => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}<tr class="tot">${tot.map((x) => `<td>${esc(x)}</td>`).join('')}</tr></tbody></table>`;
function render() {
  const t = T[lang], v = lab.view, m = model(), sec = S.sec, u = t.u;
  const asking = !!S.q && S.q.v === v && !sec;
  const show = (id, on) => { $(id).hidden = !on; };
  show('qBox', asking);
  show('cChain', v === 'chain' && !sec && !asking);
  show('cSide', v === 'side' && !sec && !asking);
  show('cHome', v === 'home' && !sec && !asking && !m.gated);
  show('cGate', v === 'home' && !sec && !asking && !!m.gated);
  show('cStairs', sec === 'stairs'); show('cLights', sec === 'lights');
  const open = secret.unlocked();
  const sc_ = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc_('stairs', '🪜') + sc_('lights', '🎄');

  // prediction card
  if (asking) {
    const q = v === 'chain' ? t.c : v === 'side' ? t.s : t.h;
    $('qBox').innerHTML = `<p class="tw-q">${esc(q.q)}</p><div class="tw-opts">${q.opts.map((o, j) => `<button data-qo="${j}">${esc(o)}</button>`).join('')}</div>`;
  }
  // chain controls
  $('l1').textContent = t.stepBulbs; $('l2').textContent = t.unscrew; $('n1').textContent = S.n1;
  document.querySelectorAll('[data-act=n1]').forEach((b) => { b.disabled = (+b.dataset.s < 0 && S.n1 <= 1) || (+b.dataset.s > 0 && S.n1 >= 3); });
  $('un1').innerHTML = Array.from({ length: S.n1 }, (_, i) => `<button class="chip ${S.out1 === i ? 'out' : ''}" data-act="un1" data-i="${i}"${S.p1 === null && S.n1 < 2 ? ' disabled' : ''}>${S.out1 === i ? '↻' : '🔧'} ${esc(t.bulb)} ${i + 1}</button>`).join('');
  $('need').hidden = !(S.n1 < 2 && S.p1 === null); $('need').textContent = t.need;
  // side controls
  $('l3').textContent = t.stepBranches; $('l4').textContent = t.unscrew; $('nb').textContent = S.nb;
  document.querySelectorAll('[data-act=nb]').forEach((b) => { b.disabled = (+b.dataset.s < 0 && S.nb <= 1) || (+b.dataset.s > 0 && S.nb >= 3); });
  $('uneq').textContent = `⚖️ ${S.uneq ? t.equal : t.unequal}`; $('uneq').disabled = S.nb < 2;
  $('un2row').hidden = S.p1 === null;
  $('un2').innerHTML = Array.from({ length: S.nb }, (_, i) => `<button class="chip ${S.out2[i] ? 'out' : ''}" data-act="un2" data-i="${i}">${S.out2[i] ? '↻' : '🔧'} ${esc(t.bulb)} ${i + 1}</button>`).join('');
  // home controls
  $('app').innerHTML = APPL.map((a, i) => `<button class="${S.on[i] ? 'on' : ''}" data-act="app" data-i="${i}"><span class="e">${a.emo}</span><span class="n">${esc(t.appl[i])}</span><span class="w">${a.P} ${u.W}</span></button>`).join('');
  $('reset').hidden = !S.trip; $('reset').textContent = t.h.reset;
  $('gateTxt').textContent = t.h.gateL; $('gateGo').textContent = t.h.gateGo;
  $('bA').textContent = t.swA; $('bB').textContent = t.swB; $('bSh').textContent = t.shunts(S.shunt); $('bFr').textContent = t.fresh;

  // table, state card, readout, facts
  let st, emo, tbl = '', facts = [], col = '#ffc069';
  const head = [t.th.bulb, `R (${u.R})`, `U (${u.V})`, `I (${u.A})`];
  if (m.kind === 'stairs') {
    st = [t.st.title(m.lit), t.st.lead, t.st.body]; emo = '🪜'; facts = t.facts.stairs;
    lab.setGlow('rgba(255, 200, 90, .2)');
    lab.setReadout(m.lit ? `${f(1)} ${u.A}` : `${f(0)} ${u.A}`, t.ro.chain, `🔋 ${VB} ${u.V}`, col);
  } else if (m.kind === 'series') {
    const lights = sec === 'lights', n = m.rows.length;
    lab.setGlow(lights ? 'rgba(80, 200, 140, .18)' : 'rgba(255, 190, 80, .2)');
    const closedR = m.opens ? '—' : String(m.rows.reduce((s, b) => s + (b.shorted ? 0 : R_N), 0));
    tbl = tableHTML(t, head, m.rows.map((b, i) => [`${t.bulb} ${i + 1}${b.st === 'out' ? ' 🔧' : b.st === 'dead' ? ' ✖' : ''}`, b.shorted ? '0' : String(R_N), b.V === null ? '—' : f1(b.V), f(b.I)]), [t.total, closedR, f1(VB), f(m.I)]);
    lab.setReadout(`${f(m.I)} ${u.A}`, t.ro.chain, `🔋 ${VB} ${u.V}`, col);
    if (lights) {
      const k = S.dead.filter(Boolean).length, work = 5 - k;
      if (S.shunt && work === 0) st = t.lt.none;
      else if (k === 0) st = t.lt.fresh(VB / 5);
      else if (S.shunt) st = t.lt.shunt(k, VB / work);
      else st = t.lt.dark;
      emo = '🎄'; facts = t.facts.lights;
    } else {
      facts = t.facts.chain;
      if (asking) { st = [t.c.askT, t.c.askL, '']; emo = '🤔'; }
      else if (S.out1 >= 0) { st = t.c.gap(S.just1, S.v1); emo = S.just1 ? (S.v1 ? '✅' : '🤔') : '🔧'; }
      else if (S.n1 === 1) { st = t.c.one(m.I); emo = '💡'; }
      else { st = t.c.many(S.n1, VB / S.n1, m.I); emo = '⛓️'; }
    }
  } else if (m.kind === 'side') {
    lab.setGlow('rgba(78, 168, 255, .2)'); facts = t.facts.side;
    tbl = tableHTML(t, head, m.rows.map((b, i) => [`${t.bulb} ${i + 1}${b.open ? ' 🔧' : ''}`, String(b.R), f1(b.V), f(b.I)]), [t.total, m.I > 0 ? f1(VB / m.I) : '—', f1(VB), f(m.I)]);
    lab.setReadout(`${f(m.I)} ${u.A}`, t.ro.side, `🔋 ${VB} ${u.V}`, '#8fc2ff');
    const k = m.rows.filter((b) => b.open).length;
    if (asking) { st = [t.s.askT, t.s.askL, '']; emo = '🤔'; }
    else if (k > 0) { st = t.s.open(k, S.nb); emo = '🔧'; }
    else if (S.just2 && S.nb >= 2) { st = t.s.rev(S.v2, S.prev2, m.I); emo = S.v2 ? '✅' : '🤔'; }
    else if (S.nb === 1) { st = t.s.one(m.I); emo = '💡'; }
    else if (S.uneq) { st = t.s.uneq(m.rows.map((b) => `${b.R} ${u.R}: ${f(b.I)} ${u.A}`).join(' · '), m.I); emo = '⚖️'; }
    else { st = t.s.many(S.nb, m.rows[0].I, m.I); emo = '🪜'; }
  } else {
    lab.setGlow('rgba(255, 140, 90, .2)');
    const onRows = m.rows.map((r, i) => ({ ...r, i })).filter((r) => r.on);
    facts = m.gated ? [t.facts.home[0]] : S.p3 === null ? t.facts.home : [...t.facts.home, t.facts.kettle];
    if (onRows.length) tbl = tableHTML(t, [t.th.app, `P (${u.W})`, `I (${u.A})`], onRows.map((r) => [t.appl[r.i], String(r.P), f(r.I)]), [t.total, String(onRows.reduce((s, r) => s + r.P, 0)), f(m.demand)]);
    lab.setReadout(`${f1(m.I)} ${u.A}`, t.ro.home, `🔌 ${MAINS_V} ${u.V}`, '#ff8f5c');
    if (asking) { st = [t.c.askT, t.h.askL, '']; emo = '🤔'; }
    else if (m.gated) { st = [t.h.gateT, t.h.gateL, '']; emo = '🔒'; }
    else if (S.trip) { st = S.still ? t.h.still(m.demand) : t.h.trip(m.demand); emo = '⚡'; }
    else if (S.just3 && S.on[0]) { st = t.h.rev(S.v3, APPL[0].P / MAINS_V); emo = S.v3 ? '✅' : '🤔'; }
    else if (onRows.length) { st = t.h.on(onRows.map((r) => f1(r.I)).join(' + '), m.demand, I_MAX - m.demand); emo = '🏠'; }
    else { st = t.h.intro; emo = '🏠'; }
  }
  $('tbl').innerHTML = tbl;
  lab.setState({ emo, title: st[0], lead: st[1], body: st[2] ?? '', extra: '' });
  lab.setFacts(facts);
}
render();
</script>
