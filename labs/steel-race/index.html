  });
  c.beginPath(); c.arc(X(cur), ly, 6, 0, 6.3); c.fillStyle = '#fff'; c.fill();
  c.textAlign = 'right'; c.font = '800 12px Nunito, sans-serif';
  c.fillStyle = COL.gb; c.fillText(T[lang].n.gb, w - 10, ly - 30); c.fillStyle = COL.de; c.fillText(T[lang].n.de, w - 10, ly + 32);
}

canvasLoop($('cv'), (c, w, h, dt, t) => {
  CW = w; CH = h;
  c.lineJoin = 'round';
  if (lab.view === 'steel') drawSteel(c, w, h, dt, t); else if (lab.view === 'ideas') drawIdeas(c, w, h, dt, t); else drawFleets(c, w, h, dt, t);
});

// --- state cards and controls ---------------------------------------------------------------------------------
const visibleIdx = () => Object.fromEntries(KEYS.map((k) => [k, Math.round(idx(k, S.yf))]));
function stateSteel() {
  const t = T[lang], s = t.st, n = t.n, v = visibleIdx(), started = S.run || S.done;
  const extra = `<div class="fine">${esc(started ? s.exFull(pct('us'), pct('de'), pct('gb')) : s.exShort)}</div>`;
  $('stYl').innerHTML = `${esc(t.year)}: <b>${Math.round(S.yf)}</b>`;
  lab.setReadout(String(Math.round(S.yf)), s.h1, started && S.yf > Y0 + 3 ? `${n[KEYS.reduce((b, k) => (v[k] > v[b] ? k : b), 'us')]} ↑` : '', '#e8b64c');
  if (S.done && Math.round(S.yf) === Y1) lab.setState({ emo: '🏭', title: s.done(fmtMul(mul('us')), fmtMul(mul('de')), fmtMul(mul('gb'))), lead: s.doneLead(pct('us'), pct('gb'), fmtMul(mul('us')), fmtMul(mul('gb'))), body: '', extra });
  else if (started) lab.setState({ emo: '🔥', title: s.run, lead: s.runLead(Math.round(S.yf), v.us, v.de, v.gb), body: '', extra });
  else if (S.g1 !== null && S.g2 !== null) lab.setState({ emo: '🔥', title: s.ready[0], lead: s.ready[1], body: '', extra });
  else lab.setState({ emo: '🤔', title: s.pre[0], lead: s.pre[1], body: '', extra });
}
function renderSteel() {
  const t = T[lang], s = t.st, n = t.n, locked = S.run || S.done;
  lab.setGlow('rgba(232, 182, 76, .26)');
  const opt = (q, val, label, okVal) => {
    const sel = q === 1 ? S.g1 === val : S.g2 === val;
    let cls = 'sr-opt';
    if (S.done) cls += val === okVal ? ' good' : sel ? ' bad' : ' dim'; else if (sel) cls += ' on';
    return `<button class="${cls}" data-q="${q}" data-v="${val}"${locked ? ' disabled' : ''}>${esc(label)}</button>`;
  };
  const v1 = S.done ? (S.g1 === Q1OK ? s.v1ok(n[Q1OK]) : s.v1no(n[Q1OK])) : '', v2 = S.done ? (S.g2 === Q2OK ? s.v2ok(Q2OPTS[Q2OK]) : s.v2no(Math.round(idx('gb', Y1)))) : '';
  $('stQs').innerHTML = `
    <div class="sr-qs"><div class="sr-q">${esc(s.q1)}</div><div class="sr-opts">${KEYS.map((k) => opt(1, k, n[k], Q1OK)).join('')}</div>${v1 ? `<div class="sr-v ${S.g1 === Q1OK ? 'good' : 'bad'}">${esc(v1)}</div>` : ''}</div>
    <div class="sr-qs"><div class="sr-q">${esc(s.q2)}</div><div class="sr-opts">${Q2OPTS.map((q, i) => opt(2, i, String(q), Q2OK)).join('')}</div>${v2 ? `<div class="sr-v ${S.g2 === Q2OK ? 'good' : 'bad'}">${esc(v2)}</div>` : ''}</div>`;
  $('stGo').textContent = s.go; $('stGo').disabled = S.g1 === null || S.g2 === null || locked; $('stGo').hidden = S.done;
  $('stAgain').textContent = s.again; $('stAgain').hidden = !S.done;
  $('stWait').textContent = S.g1 === null || S.g2 === null ? s.wait : ''; $('stWait').hidden = !($('stWait').textContent);
  $('stYl').innerHTML = `${esc(t.year)}: <b>${Math.round(S.yf)}</b>`;
  $('stYr').disabled = !S.done; $('stYr').value = String(Math.round(S.yf));
  stateSteel();
  lab.setFacts(S.done ? s.facts.map((text, i) => ({ emo: '🏭', text, src: SRC.steel })) : []);
}

const nm = (x) => x.name.replace(/^\S+\s/, '');
const accepted = (cd, g) => cd.ys.reduce((b, y) => (Math.abs(y - g) < Math.abs(b - g) ? y : b), cd.ys[0]);
function renderIdeas() {
  const t = T[lang], d = t.id, n = t.n, ended = S.ci >= 5, secOn = S.sec !== null;
  lab.setGlow('rgba(90, 160, 240, .26)');
  const open = secret.unlocked();
  $('idSec').innerHTML = [['elec', '💡'], ['chem', '🧪']].map(([k, emo]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`).join('');
  $('idMain').hidden = secOn;
  $('idSub').hidden = !secOn;
  if (secOn) {
    const subs = S.sec === 'elec' ? ['gas', 'el'] : ['dye', 'fert'];
    $('idSubChips').innerHTML = subs.map((k) => `<button class="chip ${S.sub === k ? 'on' : ''}" data-sub="${k}">${esc(t.sec[k])}</button>`).join('');
    const o = S.sec === 'elec' ? t.el[S.sub] : t.ch[S.sub];
    lab.setReadout(S.sec === 'elec' ? (S.sub === 'el' ? '💡' : '🔥') : (S.sub === 'fert' ? '🌱' : '🧪'), t.sec[S.sec][0], '', '#e8b64c');
    lab.setState({ emo: S.sec === 'elec' ? '💡' : '🧪', title: o[0], lead: o[1], body: o[2], extra: `<div class="fine">${esc(t.fine)}</div>` });
    lab.setFacts([]);
    return;
  }
  const cd = CARDS[Math.min(S.ci, 4)], txt = d.cards[Math.min(S.ci, 4)];
  $('idQ').textContent = ended ? '' : `${d.cardN(S.ci + 1)} · ${txt.name}`; $('idQ').hidden = ended;
  $('idYl').innerHTML = `${esc(t.year)}: <b>${S.yg}</b>`; $('idYl').hidden = ended;
  $('idYr').hidden = ended; $('idYr').disabled = S.ck; $('idYr').value = String(S.yg);
  $('idCo').hidden = ended;
  $('idCo').innerHTML = LANES.map((k) => {
    let cls = 'sr-opt'; if (S.ck) cls += k === cd.c ? ' good' : S.cg === k ? ' bad' : ' dim'; else if (S.cg === k) cls += ' on';
    return `<button class="${cls}" data-co="${k}"${S.ck ? ' disabled' : ''}>${esc(n[k])}</button>`;
  }).join('');
  $('idGo').textContent = ended ? d.again : S.ck ? d.next : d.check;
  $('idGo').disabled = !ended && !S.ck && (S.cg === null || !S.ygT);
  const w_ = !ended && !S.ck && (S.cg === null || !S.ygT); let st;
  if (ended) {
    const k = S.res.filter(Boolean).length, cnt = { gb: 0, de: 0, us: 0 }; CARDS.forEach((x) => cnt[x.c]++);
    lab.setReadout(`${k}/5`, d.end(k), '', '#5aa0f0');
    st = { emo: '🏆', title: d.end(k), lead: d.endLead(cnt.gb, cnt.de, cnt.us), body: d.endBody };
    lab.setFacts(d.cards.map((x, i) => ({ emo: CARDS[i].emo, text: x.how, src: x.src })));
  } else if (S.ck) {
    const yOk = Math.abs(accepted(cd, S.yg) - S.yg) <= 3, cOk = S.cg === cd.c, both = yOk && cOk;
    lab.setReadout(String(cd.y), nm(txt), both ? d.ok : d.no, both ? '#3ddc97' : '#f5c84c');
    st = { emo: both ? '✅' : '🤔', title: both ? d.ok : d.no, lead: `${d.dy(Math.abs(accepted(cd, S.yg) - S.yg))} ${cOk ? d.cOk : d.cNo(n[cd.c])}`, body: '' };
    lab.setFacts([{ emo: cd.emo, text: txt.how, src: txt.src }]);
  } else {
    lab.setReadout(S.ygT ? String(S.yg) : '?', nm(txt), S.cg === null ? '' : n[S.cg], '#5aa0f0');
    st = { emo: cd.emo, title: nm(txt), lead: d.q, body: w_ ? d.wait : '' };
    lab.setFacts(d.facts.map((text) => ({ emo: '⚡', text, src: SRC.sir })));
  }
  lab.setState({ ...st, extra: `<div class="fine">${esc(t.fine)}</div>` });
}

const evIndex = () => { let k = -1; EV.forEach(([ey], i) => { if (ey <= FY0 + S.fy / 10 + 1e-6) k = i; }); return k; };
function renderFleets() {
  const t = T[lang], f = t.fl, n = t.n;
  lab.setGlow('rgba(224, 96, 90, .26)');
  const yr = FY0 + S.fy / 10;
  $('flQ').textContent = f.q;
  $('flOpts').innerHTML = f.opts.map((o, i) => {
    let cls = 'sr-opt'; if (S.fdone) cls += i === FOK ? ' good' : S.fg === i ? ' bad' : ' dim';
    return `<button class="${cls}" data-f="${i}"${S.fdone ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  $('flV').innerHTML = S.fdone ? `<div class="sr-v ${S.fg === FOK ? 'good' : 'bad'}">${esc(f.v(S.fg === FOK))}</div>` : `<div class="sr-wait">${esc(f.tapHint)}</div>`;
  $('flYl').innerHTML = `${esc(t.year)}: <b>${Math.floor(yr)}</b>`; $('flYr').value = String(S.fy);
  const k = evIndex();
  lab.setReadout(String(Math.floor(yr)), S.fdone ? '' : '', S.fdone ? f.lab(FLEET.gb, FLEET.de) : '', '#e0605a');
  const evText = k < 0 ? '' : f.ev[k];
  if (S.fdone) {
    lab.setState({ emo: '⚓', title: f.rev(FLEET.gb, FLEET.de), lead: f.revLead(PLAN), body: evText, extra: `<div class="fine">${esc(f.revEx(TABLE.gb, TABLE.de))}</div>` });
    lab.setFacts([...f.facts, ...f.factsAfter].map((text, i) => ({ emo: '⚓', text, src: SRC.race })));
  } else {
    if (yr > 1910.35) lab.setState({ emo: '⚓', title: f.later[0], lead: f.later[1], body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    else if (k < 0) lab.setState({ emo: '⚓', title: f.pre[0], lead: f.pre[1], body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    else lab.setState({ emo: f.evEmo[k], title: `${f.evTitle[k]}`, lead: evText, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    lab.setFacts(f.facts.map((text) => ({ emo: '⚓', text, src: SRC.race })));
  }
}

function render() {
  const v = lab.view;
  document.body.dataset.v = v;
  $('vSteel').hidden = v !== 'steel'; $('vIdeas').hidden = v !== 'ideas'; $('vFleets').hidden = v !== 'fleets';
  if (v === 'steel') renderSteel(); else if (v === 'ideas') renderIdeas(); else renderFleets();
}

// --- events ---------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.q) { if (S.run || S.done) return; if (d.q === '1') S.g1 = d.v; else S.g2 = +d.v; sfx.click(); }
  else if (b.id === 'stGo') { if (S.g1 === null || S.g2 === null) return; S.run = true; S.rt = 0; S.yf = Y0; S.lastY = -1; sfx.click(); showStage(); }
  else if (b.id === 'stAgain') { S.g1 = null; S.g2 = null; S.run = false; S.done = false; S.rt = 0; S.yf = Y0; S.ymax = 130; sfx.click(); }
  else if (d.co) { if (S.ck) return; S.cg = d.co; sfx.click(); }
  else if (b.id === 'idGo') {
    if (S.ci >= 5) { S.ci = 0; S.res = []; S.ck = false; S.cg = null; S.ygT = false; S.yg = 1880; S.cx = -1; sfx.click(); }
    else if (!S.ck) {
      const cd = CARDS[S.ci], x = (yy) => 16 + (yy - IY0) / (IY1 - IY0) * (CW - 32), lh = (CH - 30 - 56) / 3;
      S.gx = x(S.yg); S.gy = 56 + LANES.indexOf(S.cg) * lh + lh / 2 + 6;
      const ok = Math.abs(accepted(cd, S.yg) - S.yg) <= 3 && S.cg === cd.c; S.res[S.ci] = ok; S.ck = true; (ok ? sfx.good : sfx.bad)(); showStage();
    } else { S.ci++; S.ck = false; S.cg = null; S.ygT = false; S.yg = 1880; $('idYr').value = '1880'; S.cx = -1; sfx.click(); }
  } else if (d.sec) { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === d.sec ? null : d.sec; S.sub = S.sec === 'elec' ? 'gas' : 'dye'; S.subT = 0; sfx.click(); }
  else if (d.sub) { S.sub = d.sub; sfx.click(); }
  else if (d.f) { if (S.fdone) return; S.fg = +d.f; S.fdone = true; S.ft = 0; (S.fg === FOK ? sfx.good : sfx.bad)(); showStage(); }
  else return;
  render();
});
$('stYr').addEventListener('input', (ev) => { if (!S.done) return; S.yf = +ev.target.value; render(); });
$('idYr').addEventListener('input', (ev) => { if (S.ck) return; S.yg = +ev.target.value; S.ygT = true; render(); });
$('flYr').addEventListener('input', (ev) => { S.fy = +ev.target.value; render(); });
render();
</script>
</body>
</html>
