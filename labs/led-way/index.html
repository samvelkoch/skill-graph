  A.la += (ta - A.la) * k(7); A.lb += (tb - A.lb) * k(7); A.lamp += ((on ? 1 : 0) - A.lamp) * k(8);
  A.off += 110 * dt;
  const lamp = A.lamp, H = 340;
  wood(c, H);
  // the staircase the lamp lights
  rr(c, 16, 14, 328, 50, 12); c.fillStyle = lg(c, 0, 14, 0, 64, [[0, '#272b3a'], [1, '#1a1d29']]); c.fill();
  for (let i = 0; i < 6; i++) {
    const x = 24 + i * 52, y = 56 - i * 6, tone = mixh('#3a3f55', '#e8c98a', lamp * 0.85);
    rr(c, x, y, 50, 64 - y, 3); c.fillStyle = lg(c, 0, y, 0, 64, [[0, mixh(tone, '#ffffff', 0.12)], [1, mixh(tone, '#000000', 0.25)]]); c.fill();
  }
  glowAt(c, 180, 40, 110, '#ffd36b', 0.28 * lamp);
  // battery and lamp
  rr(c, 58, 294, 92, 28, 8); c.fillStyle = '#14161e'; c.fill();
  drawCell(c, 62, 297, 42, 22, 1); drawCell(c, 106, 297, 42, 22, 1);
  glowAt(c, 252, 306, 30 + 70 * lamp, '#ffc84a', 0.7 * lamp);
  c.beginPath(); c.arc(252, 308, 19, 0, 7); c.fillStyle = rg(c, 246, 300, 2, 24, [[0, 'rgba(255,255,255,.38)'], [1, 'rgba(160,175,225,.2)']]); c.fill();
  if (lamp > 0) { c.fillStyle = `rgba(255, 214, 120, ${0.5 * lamp})`; c.fill(); }
  c.strokeStyle = 'rgba(225,232,255,.6)'; c.lineWidth = 1.4; c.stroke();
  c.save(); c.strokeStyle = mixh('#6a6570', '#fff3c0', lamp); c.lineWidth = 2.2; if (lamp > 0.05) { c.shadowColor = '#ffc84a'; c.shadowBlur = 12 * lamp; }
  c.beginPath(); c.moveTo(238, 308); c.quadraticCurveTo(245, 296, 252, 308); c.quadraticCurveTo(259, 320, 266, 308); c.stroke(); c.restore();
  // plates
  [[34, 'b'], [222, 't']].forEach(([x, who]) => {
    c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 10; c.shadowOffsetY = 4; rr(c, x, 78, 104, 188, 14); c.fillStyle = '#d8d2c4'; c.fill(); c.restore();
    rr(c, x, 78, 104, 188, 14); c.fillStyle = lg(c, x, 78, x + 104, 266, [[0, '#efeadf'], [1, '#c4bdac']]); c.fill(); c.strokeStyle = '#9d9684'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = '#3a3530'; font(c, 13); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(who === 'b' ? T[lang].s3.b : T[lang].s3.t, x + 52, 94);
  });
  font(c, 12); c.fillStyle = '#5a5347'; c.textAlign = 'center';
  c.fillText('▲ ' + T[lang].s3.up, 86, 114); c.fillText('▼ ' + T[lang].s3.down, 86, 244); c.fillText('▲ ' + T[lang].s3.up, 276, 114); c.fillText('▼ ' + T[lang].s3.down, 276, 244);
  // wires
  wire(c, PLUS, '#d9473f'); wire(c, [[150, 308], [234, 308]], '#2b2d36'); wire(c, WLAMP, '#2b2d36');
  for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) if (S.W[a][b]) wire(c, edgePts(a, b), EC[a][b], 5);
  if (on) { // current: bottom lever, the wire, top lever, lamp, battery
    const path = [...PLUS, [CA[0], CA[1]], TA[S.a], ...edgePts(S.a, S.b), CB, ...[...WLAMP].reverse(), [234, 308], [150, 308], [62, 308]];
    dotsAlong(c, path, A.off, 24, A.lamp);
  }
  [CA, CB, ...TA, ...TB].forEach((p) => screw(c, p));
  const dyA = lerp(-50, 50, A.la), dyB = lerp(-50, 50, A.lb);
  leverDraw(c, CA, 68, dyA, 84.4); leverDraw(c, CB, -68, dyB, 84.4);
}

// --- the loop ----------------------------------------------------------------------------------------------
const cv = $('cv');
canvasLoop(cv, (c, w, h, dt) => {
  const H = lab.view === 'stairs' ? 340 : 300, s = Math.min(w / W, h / H);
  SC = s; VB.s = s; VB.ox = (w - W * s) / 2; VB.oy = (h - H * s) / 2;
  c.save(); c.translate(VB.ox, VB.oy); c.scale(s, s);
  if (lab.view === 'stairs') drawStairs(c, dt); else drawBoard(c, dt);
  c.restore();
});
cv.addEventListener('click', (ev) => { // a tap on a switch plate flips it (after the prediction)
  if (lab.view !== 'stairs' || S.p3 === null) return;
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left - VB.ox) / VB.s, y = (ev.clientY - r.top - VB.oy) / VB.s;
  if (y < 78 || y > 266) return;
  if (x >= 34 && x <= 138) flipLever('a'); else if (x >= 222 && x <= 326) flipLever('b');
});

// --- controls ------------------------------------------------------------------------------------------------
function flipLever(who) { S[who] = S[who] ? 0 : 1; S.show3 = null; sfx.snap(); render(); }
$('spin').addEventListener('input', (ev) => { S.spin = +ev.target.value; render(); });
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, d = b.dataset;
  if (act === 'comp') { S.comp = d.c; S.sec = null; S.flip = false; S.show1 = null; sfx.click(); if (d.c === 'buzzer') beep(0.67); }
  else if (act === 'g1') { S.p1 = +d.i; S.flip = true; S.show1 = 'verdict'; sfx[+d.i === 1 ? 'good' : 'bad'](); showStage(); }
  else if (act === 'flip') { if (S.comp === 'led' && S.p1 === null) return; S.flip = !S.flip; S.show1 = null; sfx.snap(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === d.k ? null : d.k; S.show1 = null; sfx.click();
    if (S.sec === 'dyn') { S.spin = 0; $('spin').value = 0; } if (S.sec === 'col') S.col = 0;
  } else if (act === 'col') { S.col = +d.i; sfx.tick(); }
  else if (act === 'g2') { S.p2 = +d.i; S.cells = 2; S.show2 = 'verdict'; sfx[+d.i === 0 ? 'good' : 'bad'](); beep(0.67); showStage(); }
  else if (act === 'cm') { S.cells = clamp(S.cells + +d.d, 1, 3); S.show2 = null; sfx.tick(); if (S.comp2 === 'buzzer') beep(S.cells / 3); }
  else if (act === 'c2') { S.comp2 = d.c; S.show2 = null; sfx.click(); if (d.c === 'buzzer') beep(S.cells / 3); }
  else if (act === 'w') { S.W[+d.a][+d.b] ^= 1; sfx.snap(); S.show3 = null; }
  else if (act === 'g3') { S.p3 = +d.i; S.a = 0; S.b = 0; S.show3 = 'verdict'; const on = lampOn(S.W, 0, 0); sfx[(+d.i === 0) === on ? 'good' : 'bad'](); showStage(); }
  else if (act === 'fl') { flipLever(d.s); return; }
  else if (act === 'swap') { S.W = [[S.W[0][1], S.W[0][0]], [S.W[1][1], S.W[1][0]]]; S.show3 = null; sfx.snap(); }
  else if (act === 'clear') { S.W = [[0, 0], [0, 0]]; S.show3 = null; sfx.click(); }
  render();
});

// --- one render per change: controls, readout and the state card -----------------------------------------
const chip = (act, data, label, on, extra = '') => `<button class="chip lw-c ${on ? 'on' : ''}" data-act="${act}" ${Object.entries(data).map(([k, v]) => `data-${k}="${v}"`).join(' ')}${extra}>${label}</button>`;
function render() {
  const v = lab.view;
  document.body.dataset.v = v;
  $('v1').hidden = v !== 'swap'; $('v2').hidden = v !== 'cells'; $('v3').hidden = v !== 'stairs';
  if (v === 'swap') renderSwap(T[lang]); else if (v === 'cells') renderCells(T[lang]); else renderStairs(T[lang]);
}
const askHtml = (q, opts, act) => `<div class="q">${esc(q)}</div><div class="lw-opts">${opts.map((o, i) => `<button class="lw-opt" data-act="${act}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
const fact = (t, key, emo) => ({ emo, text: t.facts[key].text, src: t.facts[key].src });

function renderSwap(t) {
  const sec = S.sec, open = secret.unlocked(), predicting = !sec && S.comp === 'led' && S.p1 === null;
  lab.setGlow(sec === 'col' ? rgba(LEDS[S.col].c, 0.28) : 'rgba(255, 190, 90, .26)');
  $('p1').hidden = !predicting; if (predicting) $('p1').innerHTML = askHtml(t.s1.ask.q, t.s1.ask.opts, 'g1');
  $('c1').innerHTML = ['bulb', 'buzzer', 'motor', 'led'].map((k) => chip('comp', { c: k }, `${COMP_EMO[k]} ${esc(t.cn[k])}`, !sec && S.comp === k)).join('');
  const canTurn = !sec && (S.comp === 'bulb' || (S.comp === 'led' && !predicting));
  $('r1').hidden = !canTurn; $('r1').innerHTML = canTurn ? chip('flip', {}, `↻ ${esc(t.turn)}`, false) : '';
  $('colBox').hidden = sec !== 'col';
  $('colBox').innerHTML = sec === 'col' ? t.col.names.map((n, i) => `<button class="chip lw-c ${S.col === i ? 'on' : ''}" data-act="col" data-i="${i}"><span class="lw-dot" style="background:${LEDS[i].c}"></span>${esc(n)}</button>`).join('') : '';
  $('dynBox').hidden = sec !== 'dyn';
  $('spinCap').textContent = t.dyn.spin; $('spinL').textContent = t.dyn.ends[0]; $('spinR').textContent = t.dyn.ends[1];
  const scb = (k, emo) => `<button class="chip lw-c secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`;
  $('sec1').innerHTML = scb('col', '🌈') + scb('dyn', '⚡');
  if (sec === 'col') {
    const L = LEDS[S.col];
    lab.setReadout(`${L.nm} ${t.col.nm}`, t.col.sub, t.col.names[S.col], L.c);
    lab.setState({ emo: '🌈', title: t.col.title(t.col.names[S.col]), lead: t.col.lead(L.nm, L.mats), body: t.col.body, extra: '' });
    lab.setFacts([fact(t, 'gap', '🌈'), fact(t, 'nobel', '🏅')]);
    return;
  }
  if (sec === 'dyn') {
    const sp = S.spin / 100, st = sp < 0 ? t.dyn.back : sp > 0.3 ? t.dyn.lit : sp > 0.04 ? t.dyn.slow : t.dyn.zero;
    lab.setReadout(`${Math.abs(S.spin)} %`, t.dyn.sub, sp > 0.3 ? t.dyn.pLit : t.dyn.pDark, '#f5c84c');
    lab.setState({ emo: sp > 0.3 ? '⚡' : '🌀', title: st[0], lead: st[1], body: '', extra: '' });
    lab.setFacts([fact(t, 'gen', '⚡'), fact(t, 'rev', '📜')]);
    return;
  }
  const m = calc(S.comp, 2, S.flip);
  lab.setReadout(`${m.mA} mA`, t.cur, '🔋 × 2', '#ffb84a');
  let st;
  if (predicting) st = ['🤔', t.s1.ask.q, `${t.s1.led[1]} ${t.s1.ask.lead}`];
  else if (S.show1 === 'verdict') st = ['🔴', S.p1 === 1 ? t.right : t.wrong, t.s1.ledDark[1]];
  else if (S.comp === 'bulb' && S.flip) st = ['💡', ...t.s1.bulbTurned];
  else if (S.comp === 'led') st = ['🔴', ...(S.flip ? t.s1.ledDark : t.s1.ledLit)];
  else st = [COMP_EMO[S.comp], ...t.s1[S.comp]];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: `<div class="lw-fine">${esc(t.s1.extra)}</div>` });
  lab.setFacts([fact(t, 'bulb', '💡'), fact(t, 'holonyak', '📜')]);
}

function renderCells(t) {
  const n = S.cells, predicting = S.p2 === null, comp = S.comp2;
  lab.setGlow('rgba(95, 168, 160, .26)');
  const bk = `${comp}|${n}|${S.p2 !== null}`;
  if (bk !== S.bk) { S.bk = bk; if (comp === 'ledx' && n >= 3 && !predicting) S.burnAt = now(); }
  $('p2').hidden = !predicting; if (predicting) $('p2').innerHTML = askHtml(t.s2.ask.q, t.s2.ask.opts, 'g2');
  $('cellsBox').hidden = predicting;
  const m = calc(comp === 'ledr' ? 'led' : comp, n, false);
  if (!predicting) {
    $('stepper').innerHTML = `<button class="lw-sb" data-act="cm" data-d="-1" aria-label="−"${n <= 1 ? ' disabled' : ''}>−</button><b>🔋 ${esc(t.cw(n))}</b><button class="lw-sb" data-act="cm" data-d="1" aria-label="+"${n >= 3 ? ' disabled' : ''}>+</button>`;
    $('c2').innerHTML = ['buzzer', 'bulb', 'motor', 'ledr', 'ledx'].map((k) => chip('c2', { c: k }, `${COMP_EMO[k]} ${esc(t.cn[k])}`, comp === k)).join('');
    const cur = comp === 'ledx' ? (n === 2 ? 1 : 0) : clamp(m.mA / IMAX[comp === 'ledr' ? 'led' : comp], 0, 1);
    const eff = comp === 'ledx' ? (n === 2 ? 1 : 0) : clamp(m.lv, 0, 1);
    $('mCurK').textContent = t.s2.mCur; $('mEffK').textContent = comp === 'buzzer' ? t.s2.mBuzzer : comp === 'motor' ? t.s2.mMotor : t.s2.mBright;
    $('mCur').style.width = `${Math.round(cur * 100)}%`; $('mEff').style.width = `${Math.round(eff * 100)}%`;
    $('mCurW').classList.toggle('warn', comp === 'ledx' && n >= 2);
    $('mNote').textContent = t.s2.note;
  }
  let st, val, sub = t.cur, pill = `🔋 × ${n}`;
  if (predicting) st = ['🤔', t.s2.ask.q, t.s2.ask.lead];
  else if (S.show2 === 'verdict') st = ['🔊', S.p2 === 0 ? t.right : t.wrong, t.s2.tell];
  else if (comp === 'ledr') st = ['🔴', ...t.s2.ledr[n - 1]];
  else if (comp === 'ledx') st = ['⚠️', ...t.s2.ledx[n - 1]];
  else st = [COMP_EMO[comp], `${t.cn[comp]}: ${t.cw(n)}`, t.s2[comp][n - 1]];
  if (comp === 'ledx' && n >= 2) { val = '⚠'; sub = t.s2.warn; pill = ''; }
  else val = `${m.mA} mA`;
  lab.setReadout(val, sub, pill, '#5fa8a0');
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: !predicting && comp === 'ledx' && n >= 2 ? `<div class="lw-safe">⚠️ ${esc(t.s2.safe)}</div>` : '' });
  lab.setFacts([fact(t, 'limit', '🔌'), fact(t, 'volts', '🌈')]);
}

function renderStairs(t) {
  const s3 = t.s3, wst = wiring(S.W), valid = wst === 'ok', pre = S.p3 === null;
  lab.setGlow('rgba(255, 190, 90, .22)');
  $('p3').hidden = !(pre && valid); if (pre && valid) $('p3').innerHTML = askHtml(s3.ask.q, s3.ask.opts, 'g3');
  $('howCap').textContent = s3.how;
  const dot = (a, b) => `<span class="lw-dot" style="background:${EC[a][b]}"></span>`, ar = (x) => (x ? '▼' : '▲');
  $('w3').innerHTML = [[0, 0], [0, 1], [1, 0], [1, 1]].map(([a, b]) => `<button class="chip lw-c ${S.W[a][b] ? 'on' : ''}" data-act="w" data-a="${a}" data-b="${b}">${dot(a, b)} ${esc(s3.b)} ${ar(a)} — ${esc(s3.t)} ${ar(b)}</button>`).join('');
  $('x3').innerHTML = (pre ? '' : chip('fl', { s: 'a' }, `⇅ ${esc(s3.flipB)}`, false) + chip('fl', { s: 'b' }, `⇅ ${esc(s3.flipT)}`, false) + chip('swap', {}, `🔀 ${esc(s3.swap)}`, false)) + chip('clear', {}, `🧹 ${esc(s3.clear)}`, false);
  const on = !pre && lampOn(S.W, S.a, S.b);
  let st, extra = '';
  if (pre) st = valid ? ['🪜', s3.ok[0], s3.ok[1]] : ['🪜', ...s3[wst]];
  else if (S.show3 === 'verdict') {
    const ok = (S.p3 === 0) === on;
    st = ['🪜', ok ? t.right : t.wrong, on ? s3.onLead : s3.offLead];
  } else st = [on ? '🪜' : '🌙', `${s3.lamp(on)}: ${s3.b} ${ar(S.a)} · ${s3.t} ${ar(S.b)}`, valid ? (on ? s3.onLead : s3.offLead) : s3[wst][1]];
  if (!pre) {
    const cell = (a, b) => `<td class="${S.W[a][b] ? 'on' : ''} ${S.a === a && S.b === b ? 'cur' : ''}">${S.W[a][b] ? '●' : '○'} ${esc(S.W[a][b] ? s3.on : s3.off)}</td>`;
    extra = `<div class="lw-cap">${esc(s3.tt)}</div><table class="lw-tt"><tr><th></th><th>${esc(s3.t)} ▲</th><th>${esc(s3.t)} ▼</th></tr>` +
      `<tr><th>${esc(s3.b)} ▲</th>${cell(0, 0)}${cell(0, 1)}</tr><tr><th>${esc(s3.b)} ▼</th>${cell(1, 0)}${cell(1, 1)}</tr></table><div class="lw-fine" style="margin-top:8px">${esc(s3.tip)}</div>`;
  }
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra });
  if (pre) lab.setReadout('?', `${s3.b} ▲ · ${s3.t} ▲`, valid ? '✓' : '', '#e0b050');
  else lab.setReadout(on ? `● ${s3.on}` : `○ ${s3.off}`, `${s3.b} ${ar(S.a)} · ${s3.t} ${ar(S.b)}`, valid ? '✓' : '', '#e0b050');
  lab.setFacts(pre ? [fact(t, 'trav', '🪜')] : [fact(t, 'trav', '🪜'), fact(t, 'four', '🔀')]);
}
render();
</script>
</body>
</html>
