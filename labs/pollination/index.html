// --- the loop: playback by real time ------------------------------------------------------------------------------------
function tick(dt) {
  if (S.auto) { S.at += dt / 15; S.season = sm(S.at); if (S.at >= 1) { S.season = 1; S.auto = false; } $('plSeason').value = Math.round(S.season * 1000); }
  if (S.wait > 0) { S.wait -= dt; if (S.wait <= 0) S.playing = true; }
  else if (S.playing) {
    S.U += dt / 7; if (S.U >= 1) S.U = 1; S.day = 30 * sm(S.U); $('plDays').value = Math.round(S.day * 10);
    if (S.U >= 1) {
      S.playing = false;
      if (S.seq) { S.prev = series(S.L); S.prevL = S.L; S.L = S.seq.L1; S.seq = null; S.day = 0; S.U = 0; S.wait = 0.9; render(); }
    }
  }
  if (S.rplay) { S.rU += dt / 10; S.rday = 60 * sm(S.rU); if (S.rU >= 1) { S.rday = 60; S.rplay = false; } $('plRDays').value = Math.round(S.rday); }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  tick(dt);
  const v = lab.view;

  else if (v === 'pests') drawPests(c, w, h, time);
  else if (S.sec === 'aus') drawAus(c, w, h, time);

  // the prediction: question, chips (kept after the answer), verdict
  if (S.sec) askEl.innerHTML = '';
  else {
    const [qk, ok, rk, wk] = ASK[v], a = S.p[v];
    askEl.innerHTML = `<div class="pl-q">${esc(t[qk])}</div><div class="pl-opts">${t[ok].map((o, i) => `<button type="button" class="chip pl-opt ${a === null ? '' : i === RIGHT[v] ? 'pl-ok' : i === a ? 'pl-bad' : ''}" data-i="${i}"${a === null ? '' : ' disabled'}>${esc(o)}</button>`).join('')}</div>`
      + (a === null ? '' : `<div class="pl-verdict" style="color:${a === RIGHT[v] ? 'var(--ok)' : 'var(--wip)'}">${esc(a === RIGHT[v] ? t[rk] : t[wk])}</div>`);
  }
  // control labels
  $('plSeasonLbl').textContent = t.season; $('plSeasonVal').textContent = '';
  $('plTicks').innerHTML = t.seasons.map((s) => `<span>${esc(s)}</span>`).join('');
  $('plLadyLbl').textContent = t.ladybirds; $('plLadyVal').textContent = S.L; $('plLady').value = S.L;
  $('plDaysLbl').textContent = t.days; $('plDaysVal').textContent = `0–30`; $('plDays').value = Math.round(S.day * 10);
  $('plPlay').textContent = `▶ ${t.play}`;
  $('plCrewLbl').textContent = t.crew; $('plRDaysLbl').textContent = t.days; $('plRDaysVal').textContent = `0–60`; $('plRDays').value = Math.round(S.rday);
  $('plCrewSeg').innerHTML = [[1, t.on], [0, t.off]].map(([m, l]) => `<button type="button" data-m="${m}" class="${!!m === S.crew ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('plCrewRow').style.display = S.sec === 'aus' ? 'none' : 'flex';
  const open = secret.unlocked();
  const sc = (k, emo, i) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${(k === 'aus' && S.sec === 'aus') || (k === 'cit' && S.sec === 'cit') ? 'on' : ''}" data-k="${k}">${open ? `${emo} ${esc(t.secrets[i][0])}` : '🔒 ???'}</button>`;
  $('plSecrets').innerHTML = sc('aus', '🦘', 'a') + sc('cit', '🍊', 'b');
  // state card and facts
  if (pr) { lab.setState({ emo: '🤔', title: t[ASK[v][0]], lead: '', body: '', extra: '' }); lab.setFacts([]); }
  else if (S.sec === 'aus') { lab.setState({ emo: '🦘', title: t.secrets.a[0], lead: t.ausText, body: '', extra: '' }); lab.setFacts([]); }
  else if (S.sec === 'cit') { lab.setState({ emo: '🍊', title: t.secrets.b[0], lead: t.citrusText, body: '', extra: '' }); lab.setFacts([]); }
  else { const [emo, title, lead, body] = t.st[v]; lab.setState({ emo, title, lead, body, extra: '' }); lab.setFacts(t.facts[v]); }
  roKey = ''; readout();
}
render();
</script>
</body>
</html>
