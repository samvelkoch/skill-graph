// --- helpers and state (everything is declared before shell() runs) -------------------------------------------
const rnd = (n) => Math.floor(Math.random() * n);

function shuffle(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1); [b[i], b[j]] = [b[j], b[i]]; } return b; }

const grp = (a) => [0, 1, 2].map((g) => Number(a.slice(g * 4, g * 4 + 4).join('')));
function bNew() {
  const years = POOL[rnd(POOL.length)].join('').split('').map(Number);
  let s = shuffle(years), k = 0;
  while (k++ < 200 && (s.join('') === years.join('') || grp(s).some((v) => v >= 1000 && v <= 2099))) s = shuffle(years);

const LEARN_S = 20, DIST_S = 30, SHOW_S = 6;

// --- digits: logic ---------------------------------------------------------------------------------------------
function aStart() {
  stopTimers(); A.seq = [];
  for (let i = 0; i < A.len; i++) { let d; do d = rnd(10); while (i && d === A.seq[i - 1]); A.seq.push(d); }
  A.typed = []; A.idx = -1; A.phase = 'show'; sfx.click();
  A.seq.forEach((_, i) => later(() => { A.idx = i; A.t0 = nowS(); sfx.tick(); }, 700 + i * 1000));
  later(() => { A.idx = -1; A.phase = 'recall'; render(); }, 700 + A.len * 1000 + 250);
  render();
}
function aSubmit() {
  A.exp = A.mode === 'back' ? [...A.seq].reverse() : A.seq;
  A.ok = A.typed.length === A.len && A.typed.every((d, i) => d === A.exp[i]);
  A.phase = 'fb';
  if (A.ok) { A.passed = A.len; sfx.good(); } else { A.fails++; sfx.bad(); }
  render(); showStage();
}
function aNext() {
  if (A.ok) { if (A.len >= 16) return aDone(); A.len++; A.fails = 0; }
  else if (A.fails >= 2) return aDone();
  A.phase = 'ready'; A.typed = []; render();
}
function aDone() {
  A.low = A.passed === 0; A.span = A.low ? startLen() - 1 : A.passed;
  A.spans.push({ n: A.span, back: A.mode === 'back' });
  if (A.mode === null && !A.low && A.span > A.best) { A.best = A.span; store.set('memory-span:best', A.best); }
  A.showV = A.mode === null && A.pred !== null && !A.vdone; if (A.showV) A.vdone = true;
  A.phase = 'done'; sfx.good(); render(); showStage();
}
function setMode(m) {

  if (A.mode === 'change') dNew(); else aReset();
  sfx.click(); render();
}

// --- rows: logic -----------------------------------------------------------------------------------------------
const bRow = () => (B.order[B.trial] === 'year' ? B.years : B.shuf);
function bStart() {

}
function bSubmit() {
  const row = bRow(), n = row.filter((d, i) => B.typed[i] === d).length;
  B.score[B.order[B.trial]] = n; B.phase = 'fb'; (n >= 9 ? sfx.good : sfx.bad)(); render(); showStage();
}
function bNext() {
  if (B.trial === 0) { B.trial = 1; B.phase = 'ready'; B.typed = []; }
  else {
    const d = B.score.year - B.score.shuf;
    B.res = d >= 2 ? 'year' : d <= -2 ? 'shuf' : 'same';
    B.showV = B.pred !== null && !B.vdone; B.vdone = true; B.phase = 'result';
    (B.res === PK[B.pred] ? sfx.good : sfx.bad)();

  render(); showStage();
}

// --- words: logic ----------------------------------------------------------------------------------------------
const cWords = () => WORDS[lang][C.lists[C.trial]];
function cStart() {
  stopTimers(); C.phase = 'learn'; C.t0 = nowS(); C.text = ''; sfx.click();
  later(() => {
    C.phase = 'distract'; C.t0 = nowS(); C.dn = 190 + rnd(10); C.dTyped = []; render();
    later(() => { C.phase = 'recall'; render(); }, DIST_S * 1000);
  }, LEARN_S * 1000);

}
function cDistractSubmit() {
  const ans = C.dn - 3;
  if (C.dTyped.join('') === String(ans)) { C.dn = ans; sfx.tick(); } else { C.badAt = nowS(); sfx.bad(); }
  C.dTyped = []; render();
}
function cSubmit() {
  const toks = C.text.split(/[\s,;.:/]+/).map(norm).filter(Boolean);
  C.found = cWords().map((w) => toks.includes(norm(w)));
  C.score[C.order[C.trial]] = C.found.filter(Boolean).length; C.phase = 'fb'; sfx.good(); render(); showStage();
}
function cNext() {
  if (C.trial === 0) { C.trial = 1; C.phase = 'ready'; C.text = ''; C.found = []; }
  else {
    const d = C.score.story - C.score.rote;
    C.res = d >= 2 ? 'story' : d <= -2 ? 'rote' : 'same';
    C.showV = C.pred !== null && !C.vdone; C.vdone = true; C.phase = 'result';
    (C.res === WK[C.pred] ? sfx.good : sfx.bad)();
  }
  render(); showStage();
}

// --- input -------------------------------------------------------------------------------------------------------
function press(k) {
  const v = lab.view;
  const push = (arr, n) => { if (k === 'del') arr.pop(); else if (/^\d$/.test(k) && arr.length < n) arr.push(+k); };
  if (v === 'digits' && A.mode !== 'change' && A.phase === 'recall') {
    if (k === 'go') { if (A.typed.length) aSubmit(); return; }
    push(A.typed, A.len); sfx.tick(); if (A.typed.length === A.len) return aSubmit(); render();
  } else if (v === 'rows' && B.phase === 'recall') {
    if (k === 'go') { if (B.typed.length) bSubmit(); return; }
    push(B.typed, 12); sfx.tick(); if (B.typed.length === 12) return bSubmit(); render();
  } else if (v === 'words' && C.phase === 'distract') {
    if (k === 'go') { if (C.dTyped.length) cDistractSubmit(); return; }
    push(C.dTyped, 3); sfx.tick(); if (C.dTyped.length === String(C.dn - 3).length) return cDistractSubmit(); render();
  }
}

// bar chart in a dark panel; spec { title, legend, bars: [{v, label, color}], max, ticks, band, line, empty }

}

// --- drawing the three views -----------------------------------------------------------------------------------
function drawDigits(c, cx, cy, cw, ch, time) {
  const t = T[lang], mid = cx + cw / 2, my = cy + ch / 2, big = Math.min(ch * 0.62, 96);
  if (A.phase === 'predict') { text(c, '?', mid, my + 4, big, '#c9bd9f'); return; }
  if (A.phase === 'ready') { pips(c, mid, cy + 22, A.len, 0, cw); text(c, t.d.n(A.len), mid, my + 6, Math.min(ch * 0.2, 28), INK); return; }

  text(c, (A.low ? '≤' : '') + A.span, mid, my - 4, big * 0.95, A.mode === 'back' ? '#c27a35' : '#2b8a93');
  text(c, t.d.card.span, mid, my + big * 0.55, 14, '#8a7f63', 'center', 800);

  text(c, t.r.card.chunks, cx + 18, cy + ch * 0.56, 12, '#8a7f63', 'left', 800);

  if (C.phase === 'ready') { text(c, '10', mid, my + 2, Math.min(ch * 0.4, 60), INK); return; }

canvasLoop($('cv'), (c, w, h, dt, time) => {
  table(c, w, h);
  const v = lab.view;
  if (v === 'digits' && A.mode === 'change') return drawChange(c, w, h, time);
  const cw = Math.min(w - 24, 460), ch = clamp(h * (v === 'words' ? 0.56 : 0.46), 128, v === 'words' ? 250 : 230), cx = (w - cw) / 2, cy = 12;

// --- one render per change: controls, readout and the state card ---------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  const o = v === 'digits' ? viewDigits(t) : v === 'rows' ? viewRows(t) : viewWords(t);
  const q = o.q;
  $('msQ').hidden = !q;
  if (q) {
    $('msQText').textContent = q.text;
    $('msOpts').innerHTML = q.opts.map((s, i) => `<button type="button" class="ms-opt" data-pick="${i}">${esc(s)}</button>`).join('');
  }
  $('msPad').hidden = !o.pad;
  $('msPad').querySelector('[data-k=del]').setAttribute('aria-label', t.ui.del);
  $('msPad').querySelector('[data-k=go]').setAttribute('aria-label', t.ui.ok);
  $('msTxt').hidden = !o.txt;
  if (o.txt) { $('msTxt').placeholder = t.w.ph; if ($('msTxt').value !== C.text) $('msTxt').value = C.text; }
  $('msMain').hidden = !o.main; if (o.main) $('msMain').textContent = o.main;
  const showSec = v === 'digits';
  $('msSec').hidden = !showSec;
  if (showSec) {
    const open = secret.unlocked();
    $('msSec').innerHTML = [['back', '↩️'], ['change', '🔍']].map(([k, e]) =>
      `<button type="button" class="chip secret ${open ? 'open' : ''} ${A.mode === k ? 'on' : ''}" data-m="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : t.ui.locked}</button>`).join('');
  }
  lab.setGlow(o.glow);
  lab.setReadout(o.read[0], o.read[1], o.read[2], o.read[3]);
  lab.setState(o.state);
  lab.setFacts(o.facts);
}
const fact = (t, k, emo) => ({ emo, text: t.facts[k][0], src: t.facts[k][1] });

function viewDigits(t) {
  const col = A.mode === 'back' ? '#d98f4e' : '#4fb0b8', b = A.mode === 'back', d = t.d;
  const o = { glow: 'rgba(79, 176, 184, .26)', q: null, pad: false, txt: false, main: null, facts: [], read: ['?', '', '', col] };
  const pill = A.spans.length && A.best ? `🏅 ${A.best}` : '';
  if (A.mode === 'change') {
    o.glow = 'rgba(224, 164, 60, .24)';
    const found = D.phase === 'found';
    o.read = [D.phase === 'ready' ? '?' : D.blinks, t.c.sub, '', GOLD];
    o.main = D.phase === 'run' ? null : D.phase === 'found' ? t.c.fresh : t.c.start;
    o.state = { emo: '🔍', title: found ? t.c.found(D.blinks) : t.c.title, lead: found ? t.c.foundLead : D.miss ? t.c.miss : t.c.lead, body: '', extra: '' };
    return o;
  }
  const ph = A.phase;
  if (ph === 'predict') {
    o.q = { text: d.q, opts: d.opts };
    o.state = { emo: '🧠', title: d.q, lead: d.predLead, body: '', extra: '' };
    return o;
  }
  if (ph === 'ready') {
    const [ti, le] = d.ready(A.len, b); o.main = d.go; o.read = [A.len, d.unit(A.len), pill, col];
    o.state = { emo: '👀', title: ti, lead: le, body: A.pred !== null && !b && !A.vdone ? t.ui.guess(d.opts[A.pred]) : '', extra: '' };
  } else if (ph === 'show') {
    const [ti, le] = d.show(A.len); o.read = [A.len, d.unit(A.len), pill, col]; o.state = { emo: '👀', title: ti, lead: le, body: '', extra: '' };
  } else if (ph === 'recall') {
    const [ti, le] = d.recall(b); o.pad = true; o.read = [`${A.typed.length}/${A.len}`, d.unit(A.len), pill, col]; o.state = { emo: '⌨️', title: ti, lead: le, body: '', extra: '' };
  } else if (ph === 'fb') {
    const last = !A.ok && A.fails >= 2 || A.ok && A.len >= 16;
    o.main = last ? t.ui.result : t.ui.next; o.read = [A.ok ? '✓' : '✗', d.unit(A.len), pill, col];
    o.state = A.ok ? { emo: '✅', title: t.ui.right, lead: d.hit(A.len)[0], body: '', extra: '' }
      : { emo: '🤔', title: (A.fails >= 2 ? d.miss2 : d.miss1)[0], lead: (A.fails >= 2 ? d.miss2 : d.miss1)[1], body: '', extra: '' };
  } else {
    o.main = t.ui.again; o.read = [(A.low ? '≤' : '') + A.span, d.card.span, pill, col];
    const verdict = A.showV ? `${A.span >= 0 && PREDOK(A.span) ? t.ui.right : t.ui.no} ${t.ui.guess(d.opts[A.pred])}` : '';
    o.state = { emo: '🏁', title: d.done(A.span, A.low), lead: verdict, body: b ? d.bodyBack : d.body, extra: '' };
    o.facts = [fact(t, 'miller', '📄'), fact(t, 'kinds', '🔢'), fact(t, 'cowan', '🔬')];
  }
  return o;
}
function PREDOK(s) { return A.pred === 0 ? s <= 5 : A.pred === 1 ? s >= 6 && s <= 8 : s >= 9; }

function viewRows(t) {
  const r = t.r, col = GOLD, o = { glow: 'rgba(224, 164, 60, .24)', q: null, pad: false, txt: false, main: null, facts: [], read: ['?', '', '', col] };
  const ph = B.phase, tr = `${B.trial + 1}/2`;
  if (ph === 'predict') { o.q = { text: r.q, opts: r.opts }; o.state = { emo: '🧩', title: r.qs, lead: r.predLead, body: '', extra: '' }; return o; }
  if (ph === 'ready') {
    const [ti, le] = r.ready(B.trial + 1); o.main = r.go; o.read = [tr, r.sub, '', col];
    o.state = { emo: '👀', title: ti, lead: le, body: B.trial === 0 ? t.ui.guess(r.opts[B.pred]) : '', extra: '' };
  } else if (ph === 'show') {
    o.read = [Math.max(0, Math.ceil(SHOW_S - (nowS() - B.t0))), t.w.card.sec, '', col]; o.state = { emo: '👀', title: r.show[0], lead: r.show[1], body: '', extra: '' };
  } else if (ph === 'recall') {
    o.pad = true; o.read = [`${B.typed.length}/12`, '', '', col]; o.state = { emo: '⌨️', title: r.recall[0], lead: r.recall[1], body: '', extra: '' };
  } else if (ph === 'fb') {
    const [ti, le] = r.fb(B.score[B.order[B.trial]]); o.main = B.trial === 0 ? t.ui.next : t.ui.result; o.read = [`${B.score[B.order[B.trial]]}/12`, '', '', col];
    o.state = { emo: '📋', title: ti, lead: le, body: '', extra: '' };
  } else {
    o.main = t.ui.again; o.read = [`${B.score.year} : ${B.score.shuf}`, `${t.ch.rowsBars[1]} : ${t.ch.rowsBars[0]}`, '', col];
    const verdict = B.showV ? `${B.res === PK[B.pred] ? t.ui.right : t.ui.no} ${t.ui.guess(r.opts[B.pred])}` : '';
    o.state = { emo: B.res === 'year' ? '🧩' : '🎲', title: r.res[B.res][0], lead: verdict, body: r.res[B.res][1], extra: '' };
    o.facts = [fact(t, 'bits', '🧩'), fact(t, 'chunk', '📏')];
  }
  return o;
}

function viewWords(t) {
  const w = t.w, col = '#9b86e0', o = { glow: 'rgba(155, 134, 224, .26)', q: null, pad: false, txt: false, main: null, facts: [fact(t, 'ebb', '📈')], read: ['?', '', '', col] };
  const ph = C.phase, kind = C.order[C.trial], left = (dur) => Math.max(0, Math.ceil(dur - (nowS() - C.t0)));
  if (ph === 'predict') { o.q = { text: w.q, opts: w.opts }; o.state = { emo: '📝', title: w.qs, lead: w.predLead, body: '', extra: '' }; return o; }
  if (ph === 'ready') {
    const [ti, le] = w.ready(C.trial + 1, kind); o.main = w.go; o.read = [`${C.trial + 1}/2`, '', '', col];
    o.state = { emo: kind === 'rote' ? '🔁' : '📖', title: ti, lead: le, body: C.trial === 0 ? t.ui.guess(w.opts[C.pred]) : '', extra: '' };
  } else if (ph === 'learn') {
    const [ti, le] = w.learn(kind); o.read = [left(LEARN_S), w.sub, '', col]; o.state = { emo: kind === 'rote' ? '🔁' : '📖', title: ti, lead: le, body: '', extra: '' };
  } else if (ph === 'distract') {
    const [ti, le] = w.dist(C.dn); o.pad = true; o.read = [left(DIST_S), w.sub, '', col]; o.state = { emo: '➖', title: ti, lead: le, body: '', extra: '' };
  } else if (ph === 'recall') {
    o.txt = true; o.main = t.ui.done; o.read = ['?', '', '', col]; o.state = { emo: '✍️', title: w.recall[0], lead: w.recall[1], body: '', extra: '' };
  } else if (ph === 'fb') {
    const [ti, le] = w.fb(C.score[kind]); o.main = C.trial === 0 ? t.ui.next : t.ui.result; o.read = [`${C.score[kind]}/10`, '', '', col];
    o.state = { emo: '📋', title: ti, lead: le, body: '', extra: '' };
  } else {
    o.main = t.ui.again; o.read = [`${C.score.story} : ${C.score.rote}`, `${t.ch.wordsBars[1]} : ${t.ch.wordsBars[0]}`, '', col];
    const verdict = C.showV ? `${C.res === WK[C.pred] ? t.ui.right : t.ui.no} ${t.ui.guess(w.opts[C.pred])}` : '';
    o.state = { emo: C.res === 'story' ? '📖' : '🔁', title: w.res[C.res][0], lead: verdict, body: w.res[C.res][1], extra: '' };
    o.facts = [fact(t, 'craik', '🧠'), fact(t, 'ebb', '📈')];
  }
  return o;
}
