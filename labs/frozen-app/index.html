const fill = (d, cap) => { // max-min fairness: the smallest wishes are met first, the rest is split evenly
  const idx = d.map((_, i) => i).sort((a, b) => d[a] - d[b]), out = d.map(() => 0); let left = Math.max(0, cap);
  idx.forEach((i, k) => { const fair = left / (idx.length - k); out[i] = Math.min(d[i], fair); left -= out[i]; });
  return out;
};

// --- drawing helpers ---------------------------------------------------------------------------------------
const W = 360, H = 440;
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); };
const lg = (c, x0, y0, x1, y1, st) => { const g = c.createLinearGradient(x0, y0, x1, y1); st.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rg = (c, x, y, r0, r1, st) => { const g = c.createRadialGradient(x, y, Math.max(0, r0), x, y, Math.max(0.01, r1)); st.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const tone = (hex, k) => { // k > 0 darker, k < 0 lighter; hex in, hex out
  const n = parseInt(hex.slice(1), 16), f = (v) => Math.round(clamp(k >= 0 ? v * (1 - k) : v + (255 - v) * -k, 0, 255)).toString(16).padStart(2, '0');
  return `#${f((n >> 16) & 255)}${f((n >> 8) & 255)}${f(n & 255)}`;
};
const shadow = (c, a = 0.35, b = 8, dy = 3) => { c.shadowColor = `rgba(0,0,0,${a})`; c.shadowBlur = b; c.shadowOffsetY = dy; };
const noShadow = (c) => { c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0; };
const eio = (t) => (t < 0.5 ? 2 * t * t : 1 - ((-2 * t + 2) ** 2) / 2);
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function pill(c, txt, cx, cy, col = '#eef1fb') {

  const tw = c.measureText(txt).width + 18, x = clamp(cx - tw / 2, 4, W - tw - 4);
  c.fillStyle = 'rgba(8,10,20,.84)'; rr(c, x, cy - 11, tw, 22, 11); c.fill();

}

// --- model of the current picture ---------------------------------------------------------------------------
const WIN = [[28, 21], [184, 21], [28, 91], [184, 91]];
function model() {
  const v = lab.view, M = { run: new Array(8).fill(false), spd: new Array(8).fill(0), units: [], hog: false, swapped: 0, cpu: new Array(8).fill(0), busy: 0, leak: 0 };
  if (v === 'turns' && S.sec !== 'leak') { const n = Math.round(S.nShow); for (let i = 0; i < 8; i++) M.run[i] = i < n; }
  else if (v === 'turns' || v === 'frozen') {
    for (let i = 0; i < 4; i++) M.run[i] = !(v === 'frozen' && S.f.closed[i]) && !(v === 'frozen' && S.sec === 'unsaved' && i === 1 && S.u.closed);
    if (v === 'turns') M.leak = Math.round(S.hoursShow / 48 * 8);
    if (v === 'frozen' && S.sec === 'unsaved') M.run[1] = !S.u.closed;
    if (v === 'frozen' && S.sec !== 'unsaved' && S.f.out === 'restart' && S.f.rt > 0.5) M.run.fill(false);
    M.hog = v === 'frozen' && S.sec !== 'unsaved' && M.run[3];
  }
  M.run.forEach((r, i) => { if (r) for (let k = 0; k < APPS[i].mem; k++) M.units.push({ app: i }); });
  for (let k = 0; k < M.leak; k++) M.units.push({ app: -1 });
  M.swapped = Math.max(0, Math.min(5, M.units.length - MEMCAP));
  const capEff = Math.max(0.4, 1 - 0.1 * M.swapped), list = [];
  M.run.forEach((r, i) => { if (r && !(M.hog && i === 3)) list.push(i); });
  const sh = fill(list.map((i) => APPS[i].dem), capEff - (M.hog ? HOG : 0));
  list.forEach((i, k) => { M.spd[i] = clamp01(sh[k] / APPS[i].dem); M.cpu[i] = sh[k]; });
  if (M.hog) { M.spd[3] = 0; M.cpu[3] = 0.98 - sh.reduce((a, b) => a + b, 0) * 0.5; }
  const want = list.reduce((a, i) => a + APPS[i].dem, 0) + (M.hog ? HOG : 0);
  M.busy = M.hog ? 0.98 : clamp01(want / capEff);
  return M;
}

// --- animation state ---------------------------------------------------------------------------------------
const A = { ph: new Array(8).fill(0), bar: new Array(8).fill(0), app: new Array(8).fill(0), flash: new Array(8).fill(0), beads: [], slice: 0, cur: -1, last: 0, swing: 0,
  pile: 0, heat: 0, cell: [], t: 0, wire: 0 };
function step(dt, M) {
  const v = lab.view;
  S.nShow += clamp(S.n - S.nShow, -dt * 3, dt * 3);
  S.hoursShow += clamp(S.hours - S.hoursShow, -dt * 40, dt * 40);
  if (v === 'frozen' && S.f.out === 'restart') S.f.rt += dt;
  A.t += dt; A.wire += dt * (0.4 + M.busy * 2);
  for (let i = 0; i < 8; i++) {
    A.ph[i] += dt * M.spd[i];
    A.bar[i] = (A.bar[i] + dt * 0.5 * M.spd[i]) % 1;
    A.app[i] += clamp((M.run[i] ? 1 : 0) - A.app[i], -dt * 4, dt * 4);
    A.flash[i] = Math.max(0, A.flash[i] - dt * 3);
  }
  A.heat += clamp((M.hog ? 1 : 0) - A.heat, -dt * 1.5, dt * 1.5);
  A.swing = Math.max(0, A.swing - dt * 4);
  // round robin: one bead per slice to the next running app
  const list = []; for (let i = 0; i < 8; i++) if (M.run[i]) list.push(i);
  A.slice += dt;
  if (list.length && A.slice >= 0.15) {
    A.slice = 0;
    const next = list.find((i) => i > A.cur) ?? list[0];
    A.cur = next; A.last = next; A.swing = 1; A.beads.push({ app: next, t: 0 });
  }
  if (!list.length) A.cur = -1;
  for (const b of A.beads) b.t += dt / 0.42;
  A.beads = A.beads.filter((b) => {
    if (b.t < 1) return true;
    A.flash[b.app] = 1; if (b.app === 3 && M.hog) A.pile = Math.min(15, A.pile + 1);
    return false;
  });
  if (!M.hog) A.pile = Math.max(0, A.pile - dt * 18);
}

function drawLaptop(c, M, time) {

  c.lineWidth = 1.5; c.strokeStyle = '#12162a'; c.stroke();

  // the conducting arm points at the app that has the turn
  const tx = 40 + 40 * A.last, sx = cx + 22, sy = by - 14;
  const ang = clamp(Math.atan2(250 - sy, tx - sx), -1.45, -0.15) + Math.sin(A.swing * 6) * 0.25 * A.swing;
  const hx = sx + Math.cos(ang) * 22, hy = sy + Math.sin(ang) * 22;
  arm(sx, sy, hx, hy);
  c.strokeStyle = '#fff'; c.lineWidth = 2.2; c.beginPath(); c.moveTo(hx, hy); c.lineTo(hx + Math.cos(ang - 0.2) * 26, hy + Math.sin(ang - 0.2) * 26); c.stroke();
  c.fillStyle = '#ffd9b8'; c.strokeStyle = '#a06a45'; c.lineWidth = 1.2; c.beginPath(); c.arc(hx, hy, 5, 0, 7); c.fill(); c.stroke();
  // head
  c.fillStyle = rg(c, cx - 6, 292, 2, 22, [[0, '#ffe6cc'], [1, '#f0b98a']]); c.beginPath(); c.arc(cx, 304, 19, 0, 7); c.fill(); c.strokeStyle = '#a06a45'; c.lineWidth = 1.5; c.stroke();
  c.fillStyle = '#2a2236'; c.beginPath(); c.arc(cx, 301, 20, Math.PI * 1.08, Math.PI * 1.92); c.quadraticCurveTo(cx + 4, 292, cx - 14, 296); c.fill();
  const look = clamp((tx - cx) / 160, -1, 1) * 1.6;
  for (const dx of [-7, 7]) { c.fillStyle = '#fff'; c.beginPath(); c.ellipse(cx + dx, 305, 4.6, 5.4, 0, 0, 7); c.fill(); c.strokeStyle = '#a06a45'; c.lineWidth = 0.8; c.stroke();
    c.fillStyle = '#1f2440'; c.beginPath(); c.arc(cx + dx + look, 306, 2.6, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(cx + dx + look - 0.8, 305, 0.9, 0, 7); c.fill(); }
  c.fillStyle = 'rgba(255,120,110,.35)'; c.beginPath(); c.arc(cx - 12, 312, 3.4, 0, 7); c.arc(cx + 12, 312, 3.4, 0, 7); c.fill();
  c.strokeStyle = '#8a4a3a'; c.lineWidth = 1.6; c.beginPath();
  if (hot) { c.fillStyle = '#8a4a3a'; c.ellipse(cx, 316, 3, 4, 0, 0, 7); c.fill(); c.fillStyle = '#7fd0ff'; c.beginPath(); c.moveTo(cx + 18, 292); c.quadraticCurveTo(cx + 23, 300, cx + 18, 303); c.quadraticCurveTo(cx + 13, 300, cx + 18, 292); c.fill(); }
  else { c.arc(cx, 313, 5, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke(); }
  c.restore();
}

function drawBeads(c) {
  c.save();
  for (const b of A.beads) {
    const t = eio(clamp01(b.t)), P0 = [178, 296], P2 = [40 + 40 * b.app, 240], P1 = [178 + (P2[0] - 178) * 0.35, 224];
    const at = (u) => [(1 - u) ** 2 * P0[0] + 2 * (1 - u) * u * P1[0] + u * u * P2[0], (1 - u) ** 2 * P0[1] + 2 * (1 - u) * u * P1[1] + u * u * P2[1]];
    for (let k = 3; k >= 1; k--) { const [x, y] = at(Math.max(0, t - k * 0.05)); c.fillStyle = APPS[b.app].col; c.globalAlpha = 0.18 * (4 - k); c.beginPath(); c.arc(x, y, 4.5 - k * 0.6, 0, 7); c.fill(); }
    c.globalAlpha = 1; const [x, y] = at(t);
    shadow(c, 0.4, 4, 2); c.fillStyle = rg(c, x - 1.8, y - 1.8, 0.5, 6.5, [[0, '#fff'], [0.35, APPS[b.app].col], [1, tone(APPS[b.app].col, 0.4)]]); c.beginPath(); c.arc(x, y, 5.5, 0, 7); c.fill(); noShadow(c);
    c.strokeStyle = tone(APPS[b.app].col, 0.5); c.lineWidth = 1; c.stroke();
  }
  // the pile of beads stuck under the frozen game
  const n = Math.round(A.pile); let k = 0;
  for (let row = 0; row < 4 && k < n; row++) for (let q = 0; q < 6 - row && k < n; q++, k++) {
    const x = 160 - (5 - row) * 4.6 + q * 9.2, y = 281 - row * 7;
    c.fillStyle = rg(c, x - 1.5, y - 1.5, 0.5, 5.5, [[0, '#fff'], [0.4, '#ff9a4a'], [1, '#a03a20']]); c.beginPath(); c.arc(x, y, 4.6, 0, 7); c.fill(); c.strokeStyle = '#6a2616'; c.lineWidth = 0.8; c.stroke();
  }
  c.restore();
}

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function go(view, sec) { // open a view with a secret experiment set up
  if (lab.view === view) { S.sec = sec; resetSec(); render(); return; }
  S.pendingSec = sec; $('views').querySelector(`[data-view="${view}"]`)?.click();
}
$('nIn').addEventListener('input', () => { S.n = +$('nIn').value; S.verdict = false; sfx.tick(); render(); });
$('hIn').addEventListener('input', () => { S.hours = +$('hIn').value; render(); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, F = S.f, U = S.u;
  if (act === 'ans') {
    S.answer = +b.dataset.i; S.verdict = true; S.asked = true; store.set('frozen-app:asked', true); S.n = 8; (S.answer === 1 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) { S.sec = null; resetSec(); } else go(k === 'unsaved' ? 'frozen' : 'turns', k);
    sfx.click();
  } else if (act === 'back') { S.sec = null; resetSec(); sfx.click(); }
  else if (act === 'rest') { S.hours = 0; $('hIn').value = 0; sfx.good(); }
  else if (act === 'dec') {
    const i = +b.dataset.i;
    if (i === 1) { F.phase = 'tm'; sfx.click(); }
    else { F.phase = 'out'; F.out = i === 0 ? 'restart' : 'wait'; F.rt = 0; sfx.bad(); showStage(); }
  } else if (act === 'pick') {
    const i = +b.dataset.i; F.closed[i] = true; F.last = i;
    if (i === 3) { F.phase = 'right'; sfx.good(); } else { F.phase = 'wrong'; sfx.bad(); }
    showStage();
  } else if (act === 'fzAgain') { S.f = { phase: 'decide', closed: [false, false, false, false], out: null, rt: 0, last: -1 }; sfx.click(); }
  else if (act === 'uauto') { U.auto = !U.auto; sfx.click(); }
  else if (act === 'usave') { U.saved = true; sfx.good(); }
  else if (act === 'uclose') {
    if (!U.closed && !U.blank) { U.closed = true; U.res = null; sfx.click(); }
    else if (U.closed) { U.closed = false; U.res = (U.saved || U.auto) ? 'back' : 'lost'; U.blank = U.res === 'lost'; (U.res === 'back' ? sfx.good : sfx.bad)(); showStage(); }
    else { S.u = { auto: U.auto, saved: false, closed: false, blank: false, res: null }; sfx.click(); }
  } else if (act === 'check') { checkJobs(); }
  else if (act === 'jagain') { newRound(); sfx.click(); }
  render();
});

// --- the Jobs view: drag a job onto an app (pointer events), or tap a job and then an app ------------------
const task = (id) => T[lang].jb.tasks[id], japp = (id) => T[lang].jb.appsN[id];
function place(taskId, appId) {
  const a = S.j.assign;
  const from = a.indexOf(taskId); if (from >= 0) a[from] = -1;
  a[appId] = taskId; S.j.sel = -1; sfx.snap();
}
function checkJobs() {
  const J = S.j; if (J.checked || J.assign.some((x) => x < 0)) return;
  J.checked = true; J.mine = J.assign.slice();
  const k = J.mine.filter((tk, ap) => tk === ap).length; (k === 6 ? sfx.good : sfx.bad)();
  J.assign = [0, 1, 2, 3, 4, 5]; // the reveal always shows the right pairs
}
function newRound() {
  const J = S.j; J.round++; const r = J.round % 5 + 1;
  J.tray = J_TRAY.map((_, i) => J_TRAY[(i + r) % 6]); J.assign = new Array(6).fill(-1); J.sel = -1; J.checked = false; J.mine = null;
}
let drag = null;
jobsEl.addEventListener('pointerdown', (ev) => {
  const card = ev.target.closest('.fa-card[data-t]'); if (!card || S.j.checked) return;
  drag = { id: +card.dataset.t, x: ev.clientX, y: ev.clientY, moved: false, ghost: null, id_p: ev.pointerId };
  try { card.setPointerCapture(ev.pointerId); } catch { /* no capture */ }
});
jobsEl.addEventListener('pointermove', (ev) => {
  if (!drag || ev.pointerId !== drag.id_p) return;
  if (!drag.moved && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) > 7) {
    drag.moved = true; const g = document.createElement('div'); g.className = 'fa-card ghost';
    g.innerHTML = `<span class="e">${task(drag.id)[0]}</span><span>${esc(task(drag.id)[1])}</span>`; document.body.append(g); drag.ghost = g;
  }
  if (drag.moved) {
    drag.ghost.style.left = `${ev.clientX}px`; drag.ghost.style.top = `${ev.clientY}px`;
    const el = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.fa-slot');
    jobsEl.querySelectorAll('.fa-slot.hot').forEach((e) => e.classList.remove('hot')); el?.classList.add('hot');
  }
});
const endDrag = (ev) => {
  if (!drag || ev.pointerId !== drag.id_p) return;
  const d = drag; drag = null; d.ghost?.remove();
  if (d.moved) {
    const slot = ev.type === 'pointerup' ? document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.fa-slot') : null;
    if (slot) place(d.id, +slot.dataset.a);
  } else if (ev.type === 'pointerup') { S.j.sel = S.j.sel === d.id ? -1 : d.id; sfx.tick(); }
  render();
};
jobsEl.addEventListener('pointerup', endDrag); jobsEl.addEventListener('pointercancel', endDrag);
jobsEl.addEventListener('click', (ev) => {
  const slot = ev.target.closest('.fa-slot'); if (!slot || S.j.checked) return;
  const ap = +slot.dataset.a;
  if (S.j.sel >= 0) place(S.j.sel, ap); else if (S.j.assign[ap] >= 0) { S.j.assign[ap] = -1; sfx.tick(); }
  render();
});

// --- one render per change: controls, readout, gauge, facts and the state card -----------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  const asking = v === 'turns' && !S.asked, leak = v === 'turns' && S.sec === 'leak', us = v === 'frozen' && S.sec === 'unsaved';
  $('sTurns').style.display = v === 'turns' ? '' : 'none';
  $('sFrozen').style.display = v === 'frozen' ? '' : 'none';
  $('sJobs').style.display = v === 'jobs' ? '' : 'none';
  $('tnAsk').style.display = asking ? '' : 'none';
  $('tnSl').style.display = v === 'turns' && !asking && !leak ? '' : 'none';
  $('lkSl').style.display = leak ? '' : 'none';
  const sc = (k, emo) => { const open = secret.unlocked(); return `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`; };
  $('secRow').innerHTML = sc('unsaved', '💾') + sc('leak', '🧹') + (S.sec ? `<button class="chip" data-act="back">${esc(t.jb.back)}</button>` : '');
  $('secRow').style.display = asking ? 'none' : '';
  $('gauge').classList.toggle('fa-off', v === 'jobs');
  lab.setFacts([{ emo: FACT_EMO[v], text: t.facts[v], src: FACT_SRC[v] }]);
  if (v === 'turns') renderTurns(t, asking, leak); else if (v === 'frozen') renderFrozen(t, us); else renderJobs(t);
}
const memGauge = (t, M) => lab.setGauge(Math.min(1, M.units.length / MEMCAP), [{ f: 0, label: '0%' }, { f: 0.5, label: '50%' }, { f: 1, label: '100%' }], t.cap.mem);

function renderTurns(t, asking, leak) {
  const M = model(), n = M.run.filter(Boolean).length, busy = Math.round(M.busy * 100);
  lab.setGlow('rgba(95, 168, 160, .26)');
  memGauge(t, M);
  if (asking) {
    $('tnAsk').innerHTML = `<p class="fa-q">${esc(t.tn.q)}</p><div class="fa-opts">${t.tn.opts.map((o, i) => `<button class="fa-opt" data-act="ans" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    lab.setReadout(n, t.tn.open, '', '#5fa8a0');
    lab.setState({ emo: '🤔', title: t.tn.q, lead: '', body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    return;
  }
  if (leak) {
    const H = S.hours, L = M.leak, st = H === 0 ? t.lk.fresh : L < 4 ? t.lk.some : t.lk.full;
    $('hLbl').textContent = t.lk.since; $('hNum').textContent = t.lk.hours(H); $('restB').textContent = t.lk.restart;
    lab.setReadout(t.lk.hours(H), t.lk.since, t.tn.busy(busy), '#d9a441');
    lab.setState({ emo: '🧹', title: st[0], lead: st[1], body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    return;
  }
  $('nLbl').textContent = t.tn.open; $('nNum').textContent = S.n; $('nIn').value = S.n;
  const sp = M.run.map((r, i) => r ? `${APPS[i].emo} ${Math.round(M.spd[i] * 100)}%` : null).filter(Boolean).join(' · ');
  let head;
  if (S.verdict) { head = [S.answer === 1 ? t.tn.yes : t.tn.no, t.tn.lead]; }
  else if (n === 1) head = t.tn.one;
  else if (M.swapped > 0) head = t.tn.full;
  else if (M.busy >= 0.99 || M.run.reduce((a, r, i) => a + (r ? APPS[i].dem : 0), 0) > 1) head = t.tn.busy2;
  else head = t.tn.ok;
  lab.setReadout(n, t.tn.open, t.tn.busy(busy), '#5fa8a0');
  lab.setState({ emo: '🔄', title: head[0], lead: head[1], body: `${esc(t.tn.speeds)}: ${sp}`, extra: `<div class="fine">${esc(t.fine)}</div>` });
}

function keysHtml(t) {
  return `<div class="fa-keys"><span class="fa-key" style="border:0;background:none;padding-left:0">${esc(t.fz.open)}:</span>${t.fz.keys.map(([k, v]) => `<span class="fa-key">${k === 'Windows' || k === 'Mac' ? '⌨️' : '📱'} ${esc(k)} ${k === 'Windows' || k === 'Mac' ? `<kbd>${esc(v)}</kbd>` : esc(v)}</span>`).join('')}</div>`;
}
function renderFrozen(t, us) {
  const M = model(), F = S.f, U = S.u;
  lab.setGlow('rgba(110, 140, 220, .26)');
  lab.setGauge(M.busy, [{ f: 0, label: '0%' }, { f: 0.5, label: '50%' }, { f: 1, label: '100%' }], t.cap.cpu);
  let html = '', st, pill = '';
  if (us) {
    const dis = (b) => (b ? ' disabled' : '');
    html = `<div class="row2" style="margin-top:0"><button class="chip ${U.auto ? 'on' : ''}" data-act="uauto"${dis(U.closed || U.blank)}>${esc(t.us.auto)}</button>
      <button class="chip" data-act="usave"${dis(U.saved || U.closed || U.blank)}>${esc(t.us.save)}</button>
      <button class="chip" data-act="uclose">${esc(U.blank ? t.us.again : U.closed ? t.us.reopen : t.us.close)}</button></div>`;
    st = U.res === 'lost' ? t.us.lost : U.res === 'back' ? t.us.back : U.closed ? t.us.closed : U.auto ? t.us.auto2 : U.saved ? t.us.saved : t.us.open;
    lab.setReadout('💾', t.secrets.unsaved[0], '', '#7fc4ff');
    $('sFrozen').innerHTML = html;
    lab.setState({ emo: '💾', title: st[0], lead: st[1], body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    return;
  }
  const busy = Math.round(M.busy * 100);
  if (F.phase === 'decide') {
    html = `<div class="fa-opts">${t.fz.choices.map(([e, l], i) => `<button class="fa-opt" data-act="dec" data-i="${i}"><span class="e">${e}</span>${esc(l)}</button>`).join('')}</div>`;
    st = t.fz.dec; pill = `🧊 ${t.lbl.nr}`;
  } else if (F.phase === 'tm') {
    html = `<div class="fa-tm"><div class="h">${esc(t.lbl.tm)} · ${esc(t.fz.use)}</div>${[0, 1, 2, 3].map((i) => {
      const hot = i === 3, pct = hot ? 98 : [3, 6, 12][i];
      return `<button class="fa-row ${hot ? 'hot' : ''}" data-act="pick" data-i="${i}"><span>${APPS[i].emo}</span><span class="n">${esc(t.apps[i])}${hot ? `<em>${esc(t.lbl.nr)}</em>` : ''}</span><span class="u"><i style="width:${pct}%"></i></span><b>${pct}%</b></button>`;
    }).join('')}</div>${keysHtml(t)}`;
    st = t.fz.tm; pill = `🧊 ${t.lbl.nr}`;
  } else {
    html = `<div class="row2" style="margin-top:0"><button class="chip" data-act="fzAgain">${esc(t.fz.again)}</button></div>${F.phase === 'right' ? keysHtml(t) : ''}`;
    if (F.phase === 'out') st = F.out === 'restart' ? t.fz.restart : t.fz.wait;
    else if (F.phase === 'wrong') st = F.last === 0 ? t.fz.wrongMusic : t.fz.wrong(t.apps[F.last]);
    else st = t.fz.right;
    pill = F.phase === 'right' ? '✅ OK' : F.out === 'restart' ? '' : `🧊 ${t.lbl.nr}`;
  }
  lab.setReadout(`${busy}%`, t.cap.cpu, pill, F.phase === 'right' ? '#3ddc97' : '#6e8cdc');
  $('sFrozen').innerHTML = html;
  lab.setState({ emo: F.phase === 'right' ? '✅' : '🧊', title: st[0], lead: st[1], body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
}

function renderJobs(t) {
  const J = S.j, jb = t.jb;
  lab.setGlow('rgba(155, 120, 230, .26)');
  const placed = J.assign.filter((x) => x >= 0).length, k = J.checked ? J.mine.filter((tk, ap) => tk === ap).length : 0;
  $('jChk').textContent = jb.check; $('jChk').disabled = J.checked || placed < 6; $('jAg').textContent = jb.again; $('jAg').style.display = J.checked ? '' : 'none';
  const cardAt = (r) => {
    const id = J.tray[r], on = J.assign.includes(id);
    return `<button class="fa-card ${J.sel === id ? 'sel' : ''} ${on ? 'placed' : ''}" data-t="${id}" ${J.checked ? 'disabled' : ''}><span class="e">${task(id)[0]}</span><span>${esc(task(id)[1])}</span></button>`;
  };
  const slotAt = (r) => {
    const ap = J_SLOTS[r], got = J.assign[ap], cls = J.checked ? (J.mine[ap] === ap ? 'ok' : 'bad') : '';
    let a;
    if (J.checked) {
      a = `<span class="a">✓ ${task(ap)[0]} ${esc(task(ap)[2])}</span>`;
      if (J.mine[ap] !== ap) a += `<span class="w">✗ ${J.mine[ap] >= 0 ? `${task(J.mine[ap])[0]} ${esc(task(J.mine[ap])[2])}` : ''}</span>`;
    } else a = `<span class="a">${got >= 0 ? `${task(got)[0]} ${esc(task(got)[2])}` : esc(jb.free)}</span>`;
    return `<div class="fa-slot ${cls}" data-a="${ap}"><span class="ic">${japp(ap)[0]}</span><span class="n">${esc(japp(ap)[1])}</span>${a}</div>`;
  };
  jobsEl.innerHTML = `<div class="fa-win"><div class="fa-bar"><i style="background:#ff6b5f"></i><i style="background:#ffc04a"></i><i style="background:#4cd47a"></i><span>${esc(jb.win)}</span></div>
    <div class="fa-grid">${[0, 1, 2, 3, 4, 5].map((r) => cardAt(r) + slotAt(r)).join('')}</div></div>`;
  const st = J.checked ? jb.sAll(k) : placed === 0 && J.sel < 0 ? jb.s0 : jb.sPart(placed);
  lab.setReadout(J.checked ? jb.val(k) : jb.val(placed), jb.sub, '', '#9b78e6');
  lab.setGauge(0, [], '');
  lab.setState({ emo: J.checked ? (k === 6 ? '🏆' : '🧩') : '🧩', title: st[0], lead: st[1], body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
}
render();
</script>
