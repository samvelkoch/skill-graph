function frameBox(c, x, y, w, h, pr, kind, time) { // one framed memory; pr = how much of the picture is painted (0..1)

  else if (kind === 2) { c.fillStyle = '#d9f0c9'; c.fillRect(ix, iy, iw, ih); c.strokeStyle = '#3b6ea5'; c.lineWidth = 3; for (const bx of [ix + 26, ix + iw - 26]) { c.beginPath(); c.arc(bx, iy + ih - 24, 14, 0, TAU); c.stroke(); } c.beginPath(); c.moveTo(ix + 26, iy + ih - 24); c.lineTo(ix + iw / 2, iy + ih - 50); c.lineTo(ix + iw - 26, iy + ih - 24); c.stroke(); }
  else { // the invented one: a mall corridor, a small child, a man in a blue shirt

    c.fillStyle = '#9fd0e8'; rr(c, ix + 6, iy + 10, 28, 40, 3); c.fill(); rr(c, ix + iw - 34, iy + 10, 28, 40, 3); c.fill();

    if (pr > 0.8) drawPerson(c, ix + iw / 2 + 16, iy + ih - 4, ih * 0.58, { age: 'adult', pose: 'straight', noShadow: true, top: '#3b82c4', hair: '#3a2a22', hairStyle: 'short', mood: 'smile' });
  }

canvasLoop($('cv'), (c, w, h, dt, time) => {
  K = Math.min(w / W, h / H);
  c.save(); c.translate((w - W * K) / 2, (h - H * K) / 2); c.scale(K, K);
  c.save(); rr(c, 0, 0, W, H, 20); c.clip();
  const tt = T[lang], mode = S.sec || lab.view;
  if (mode === 'witness') drawWitness(c, dt, time, tt);
  else if (mode === 'interviewer') drawInterviewer(c, time, tt);
  else if (mode === 'diary') drawDiary(c, time, tt);
  else if (mode === 'mall') drawMall(c, time, tt);
  else drawWord(c, dt, time, tt);
  const v = c.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.22)'); c.fillStyle = v; c.fillRect(0, 0, W, H);
  c.restore(); c.restore();
});

// --- controls --------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('wsl').addEventListener('input', (ev) => { S.w.guess = +ev.target.value; $('wsv').textContent = `${S.w.guess} ${T[lang].unit}`; });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i, w = S.w;
  if (a === 'watch') { w.step = 1; w.clock = 0; w.play = true; sfx.click(); }
  else if (a === 'q1') { w.g = w.guess; w.step = 3; sfx.click(); }
  else if (a === 'q2') { w.apples = ['yes', 'no', 'unsure'][i]; w.step = 4; w.clock = 0; w.play = true; sfx.click(); showStage(); }
  else if (a === 'replay') { w.clock = 0; w.play = true; sfx.click(); showStage(); }
  else if (a === 'fresh') { S.w = { run: w.run + 1, step: 0, clock: 0, play: false, guess: 20, g: null, apples: null }; $('wsl').value = 20; sfx.click(); }
  else if (a === 'frame') { S.i.f = i; if (!needsObj(i)) S.i.o = null; S.i.res = null; sfx.tick(); }
  else if (a === 'obj') { S.i.o = i; S.i.res = null; sfx.tick(); }
  else if (a === 'ask') {
    const [info, ideas] = scoreOf(S.i.f, S.i.o ?? 0), key = `${S.i.f}-${needsObj(S.i.f) ? S.i.o : 0}`;
    S.i.res = { info, ideas }; S.i.resAt = now(); if (!S.i.log.some((l) => l.key === key)) S.i.log.push({ key, f: S.i.f, o: S.i.o ?? 0, info, ideas });
    (ideas === 0 && info >= 20 ? sfx.good : sfx.snap)(); showStage();
  }
  else if (a === 'dpred') { S.d.pred = i; S.d.msg = ''; sfx.click(); }
  else if (a === 'span') {
    const id = b.dataset.id, t = T[lang];
    if (id === 's' || id === 's2') { S.d.msg = t.d.same; sfx.tick(); }
    else if (!S.d.found.includes(id)) { S.d.found.push(id); S.d.msg = t.d.f[id]; sfx.good(); }
    else S.d.msg = t.d.f[id];
  }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k;
    if (S.sec === 'mall') S.mall = { step: 0, pred: null, at: now() };
    if (S.sec === 'word') S.wd = { pred: null, word: 0 };
    sfx.click();
  }
  else if (a === 'mnext') { S.mall.step++; S.mall.at = now(); sfx.click(); }
  else if (a === 'mpred') { S.mall.pred = i; S.mall.step = 4; S.mall.at = now(); sfx.good(); }
  else if (a === 'mreset') { S.mall = { step: 0, pred: null, at: now() }; sfx.click(); }
  else if (a === 'wpred') { S.wd.pred = i; S.wd.word = 3; sfx.good(); }
  else if (a === 'word') { S.wd.word = i; sfx.tick(); }
  render();
});

// --- one render per change ---------------------------------------------------------------------------------------------
function render() {
  document.body.dataset.v = S.sec || lab.view; // the layout follows the view (see the CSS)
  const t = T[lang], v = lab.view, mode = S.sec || v;
  show('sW', mode === 'witness'); show('sI', mode === 'interviewer'); show('sD', mode === 'diary'); show('sM', mode === 'mall'); show('sX', mode === 'word');
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('mall', '🛍️') + sc('word', '✂️');
  ({ witness: renderW, interviewer: renderI, diary: renderD, mall: renderM, word: renderX })[mode](t);
}

function renderW(t) {
  const w = S.w, vi = verbOf(w.run), word = t.words[vi], st = w.step, tw = t.w;
  lab.setGlow('rgba(240,160,90,.28)');
  show('wReady', st === 0); show('wQ1', st === 2); show('wQ2', st === 3); show('wRev', st === 4);
  $('wReadyT').textContent = tw.s0[1]; $('wWatch').textContent = tw.go;
  $('wq1').textContent = tw.q1[vi]; $('wQ1b').textContent = tw.next; $('wsv').textContent = `${w.guess} ${t.unit}`;
  $('wq2').textContent = tw.q2;
  $('wq2c').innerHTML = [t.yes, t.no, t.unsure].map((l, i) => `<button class="chip lq-chip" data-act="q2" data-i="${i}">${esc(l)}</button>`).join('');
  if (st === 0) { lab.setReadout('?', '', '', '#f0a05a'); lab.setState({ emo: '🎙️', title: tw.s0[0], lead: tw.s0[1], body: tw.s0[2], extra: '' }); }
  else if (st === 1) { lab.setReadout('👀', '', '', '#f0a05a'); lab.setState({ emo: '👀', title: tw.playing[0], lead: tw.playing[1], body: '', extra: '' }); }
  else if (st === 2 || st === 3) { lab.setReadout('?', '', st === 2 ? tw.st1 : tw.st2, '#f0a05a'); lab.setState({ emo: '💭', title: tw.think, lead: st === 2 ? tw.q1[vi] : tw.q2, body: '', extra: '' }); }
  else {
    const ans = { yes: t.yes, no: t.no, unsure: t.unsure }[w.apples];
    lab.setReadout(`8 <small>${esc(t.unit)}</small>`, tw.really, `${tw.you}: ${w.g} ${t.unit}`, '#f0a05a');
    lab.setState({ emo: '🎞️', title: tw.rev[0], lead: tw.rev[1], body: `${tw.revBody(w.g, ans, word)} ${tw.lead2}`, extra: '' });
    const order = [0, 1, 2, 3];
    $('wRev').innerHTML = `<div class="lq-lbl">${esc(tw.c1)}</div><div class="lq-bars">${order.map((k) => `<div class="lq-bar ${k === vi ? 'me' : ''}"><span>${esc(t.words[k])}</span><div class="tr"><div class="fl" style="width:${(VERB_MEAN[k] / 40.8 * 100).toFixed(1)}%"></div>${k === vi ? `<span class="you">${esc(tw.you)}</span>` : ''}</div></div>`).join('')}</div>
      <div class="lq-ends"><span>◂ ${esc(tw.slow)}</span><span>${esc(tw.fast)} ▸</span></div><div class="lq-note">${esc(tw.n1)}</div>
      <div class="lq-lbl">${esc(tw.c2)}</div><div class="lq-groups">${GLASS.map((n, k) => `<div class="lq-grp ${(vi === 3 && k === 0) || (vi === 1 && k === 1) ? 'me' : ''}"><div class="dots">${Array.from({ length: 50 }, (_, j) => `<i class="${j < n ? 'on' : ''}"></i>`).join('')}</div><div class="nm"><em>${n}</em> / 50<br>${esc(tw.g[k])}</div></div>`).join('')}</div>
      <div class="lq-note">${esc(tw.n2)}<br>${esc(tw.mine(w.g, ans, word))}</div>
      <div class="lq-row"><button class="chip" data-act="replay">${esc(tw.again)}</button><button class="chip" data-act="fresh">${esc(tw.fresh)}</button></div>`;
  }
  lab.setFacts(t.facts.w);
}

function renderI(t) {
  const ti = t.i, I = S.i, f = I.f, r = I.res;
  lab.setGlow('rgba(150,120,230,.28)');
  const ready = f !== null && (!needsObj(f) || I.o !== null), good = I.log.filter((l) => l.ideas === 0 && l.info >= 20).length;
  const objSet = t.i.objs[f === 3 ? 1 : 0];
  $('sI').innerHTML = `<div class="lq-lbl">${esc(ti.start)}</div><div class="lq-row">${ti.frames.map((x, k) => `<button class="chip lq-chip ${f === k ? 'on' : ''}" data-act="frame" data-i="${k}">${esc(x)}</button>`).join('')}</div>
    <div class="lq-lbl">${esc(ti.then)}</div><div class="lq-row">${objSet.map((x, k) => `<button class="chip lq-chip ${I.o === k && f !== null && needsObj(f) ? 'on' : ''}" data-act="obj" data-i="${k}"${f !== null && needsObj(f) ? '' : ' disabled'}>${esc(x)}</button>`).join('')}</div>
    <button class="btn lq-go" data-act="ask"${ready ? '' : ' disabled'}>${esc(ti.ask)}</button>
    <div class="lq-meter"><div class="t"><span>${esc(ti.info)}</span><span>${r ? r.info : 0} / 30</span></div><div class="tr"><div class="fl" style="width:${r ? r.info / 30 * 100 : 0}%;background:linear-gradient(90deg,#3ddc97,#2fb7a3)"></div></div></div>
    <div class="lq-meter"><div class="t"><span>${esc(ti.ideas)}</span><span>${r ? r.ideas : 0} / 30</span></div><div class="tr"><div class="fl" style="width:${r ? r.ideas / 30 * 100 : 0}%;background:linear-gradient(90deg,#ffb347,#ff7a3d)"></div></div></div>
    <div class="lq-legend"><span><i style="background:#45d483"></i>${esc(ti.lg[0])}</span><span><i style="background:#ff9f43"></i>${esc(ti.lg[1])}</span></div>
    ${I.log.length ? `<div class="lq-lbl">${esc(ti.log)}</div><ul class="lq-log">${I.log.map((l) => `<li class="${l.ideas === 0 && l.info >= 20 ? 'ok' : ''}">${esc(qText(t, l.f, l.o))}<span>${l.info} · ${l.ideas}</span></li>`).join('')}</ul>` : ''}
    <div class="lq-note">${esc(ti.goal)} ${esc(ti.n)}</div>`;
  lab.setReadout(`${Math.min(3, good)} / 3`, '', '', '#a68bf0');
  let st = { emo: '❓', title: ti.s0[0], lead: ti.s0[1] };
  if (good >= 3) st = { emo: '🏆', title: ti.win[0], lead: ti.win[1] };
  else if (r) { const k = r.ideas > 0 ? ti.plant : r.info >= 20 ? ti.good : ti.thin; st = { emo: r.ideas > 0 ? '💭' : r.info >= 20 ? '✅' : '🤏', title: k[0], lead: k[1] }; }
  lab.setState({ ...st, body: '', extra: '' }); lab.setFacts(t.facts.i);
}

function renderD(t) {
  const td = t.d, D = S.d, n = D.found.length;
  lab.setGlow('rgba(220,180,110,.26)');
  const segs = (arr, who) => arr.map((s) => (typeof s === 'string' ? esc(s) : `<button class="lq-sp ${D.found.includes(s[0]) ? 'found' : ''} ${s[0] === 's' || s[0] === 's2' ? 'same' : ''}" data-act="span" data-id="${s[0]}">${esc(s[1])}</button>`)).join('');
  $('sD').innerHTML = D.pred === null
    ? `<p class="lq-q">${esc(td.pred)}</p><div class="lq-pred">${td.ch.map((x, k) => `<button class="chip lq-chip" data-act="dpred" data-i="${k}">${esc(x)}</button>`).join('')}</div>
       <div class="lq-text"><h4>${esc(td.dt)}</h4>${segs(td.dsegs).replace(/data-act="span"/g, 'data-act="none" disabled')}</div>`
    : `<div class="lq-text"><h4>${esc(td.dt)}</h4>${segs(td.dsegs)}</div><div class="lq-text"><h4>${esc(td.mt)}</h4>${segs(td.msegs)}</div>
       <div class="lq-msg">${esc(D.msg)}</div>`;
  lab.setReadout(D.pred === null ? '?' : `${n} / 4`, D.pred === null ? '' : td.cnt(n).replace(/:.*$/, ''), '', '#e0b86a');
  if (D.pred === null) lab.setState({ emo: '📔', title: td.title, lead: td.pred, body: '', extra: '' });
  else if (n >= 4) lab.setState({ emo: '🕰️', title: td.done[0], lead: td.done[1], body: td.body, extra: '' });
  else lab.setState({ emo: '🔎', title: td.title, lead: td.lead, body: td.cnt(n), extra: '' });
  lab.setFacts(t.facts.d);
}

function renderM(t) {
  const tm = t.mall, m = S.mall, k = Math.min(m.step, 4);
  lab.setGlow('rgba(150,120,230,.3)');
  const s = tm.s[k];
  $('sM').innerHTML = m.step === 3
    ? `<p class="lq-q">${esc(s[1])}</p><div class="lq-pred">${tm.ch.map((x, j) => `<button class="chip lq-chip" data-act="mpred" data-i="${j}">${esc(x)}</button>`).join('')}</div>`
    : m.step < 3 ? `<button class="btn lq-go" data-act="mnext">${esc(tm.next)}</button>` : `<button class="btn lq-go" data-act="mreset">${esc(tm.reset)}</button>`;
  lab.setReadout(m.step === 4 ? '1 / 4' : '?', '', '', '#a68bf0');
  lab.setState({ emo: '🛍️', title: s[0], lead: m.step === 3 ? '' : s[1], body: '', extra: '' });
  lab.setFacts(t.facts.d);
}

function renderX(t) {
  const tw = t.word, wd = S.wd;
  lab.setGlow('rgba(80,160,230,.28)');
  $('sX').innerHTML = wd.pred === null
    ? `<p class="lq-q">${esc(tw.pq)}</p><div class="lq-pred">${tw.ch.map((x, k) => `<button class="chip lq-chip" data-act="wpred" data-i="${k}">${esc(x)}</button>`).join('')}</div><div class="lq-note">${esc(tw.note)}</div>`
    : `<div class="lq-lbl">${esc(tw.tr)}</div><div class="lq-row">${t.words.map((x, k) => `<button class="chip lq-chip ${wd.word === k ? 'on' : ''}" data-act="word" data-i="${k}">“${esc(x)}”</button>`).join('')}</div><div class="lq-note">${esc(tw.note)}</div>`;
  lab.setReadout('30', '', '', '#5ea8e8');
  const s = wd.pred === null ? tw.s0 : tw.s1;
  lab.setState({ emo: '✂️', title: s[0], lead: s[1], body: '', extra: '' });
  lab.setFacts(t.facts.w);
}
render();
</script>
</body>
</html>
