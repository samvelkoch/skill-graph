const SANS = 'Nunito, sans-serif';
function fitText(c, s, x, y, size, weight, color, maxW, align = 'center') {
  let z = size;
  c.font = `${weight} ${z}px ${SANS}`;
  while (z > 12 && c.measureText(s).width > maxW) { z--; c.font = `${weight} ${z}px ${SANS}`; }
  c.fillStyle = color; c.textAlign = align; c.textBaseline = 'middle'; c.fillText(s, x, y);
}
function pill(c, s, x, y, bg, fg, size = 14) {
  c.font = `900 ${size}px ${SANS}`;
  const tw = c.measureText(s).width + 16;
  c.fillStyle = bg; c.beginPath(); c.roundRect(x - tw / 2, y - 11, tw, 22, 11); c.fill();
  c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s, x, y + 1);
}
function cupcake(c, x, y, s, col) {
  const top = y - s * 0.05;
  c.fillStyle = col; c.beginPath();
  c.moveTo(x - s * 0.42, top); c.lineTo(x + s * 0.42, top); c.lineTo(x + s * 0.3, y + s * 0.45); c.lineTo(x - s * 0.3, y + s * 0.45); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = Math.max(1, s * 0.04);
  for (const k of [-0.18, 0, 0.18]) { c.beginPath(); c.moveTo(x + s * k * 1.1, top + s * 0.04); c.lineTo(x + s * k * 0.8, y + s * 0.42); c.stroke(); }
  c.fillStyle = '#fff4f6';
  for (const [dy, rx, ry] of [[-0.02, 0.46, 0.2], [-0.2, 0.34, 0.17], [-0.34, 0.2, 0.13]]) { c.beginPath(); c.ellipse(x, top + s * dy, s * rx, s * ry, 0, 0, Math.PI * 2); c.fill(); }

  return `<div class="stp"><span class="lbl">${esc(label)}</span><div>
    <button class="sb" data-act="step" data-k="${k}" data-s="-1" aria-label="−"${val <= lo ? ' disabled' : ''}>−</button><b>${val}</b>
    <button class="sb" data-act="step" data-k="${k}" data-s="1" aria-label="+"${val >= hi ? ' disabled' : ''}>+</button></div></div>`;
};
const totalStepper = (val) => {
  const [lo, hi] = rng('ans'), btn = (s, l, cls = '') => `<button class="sb ${cls}" data-act="step" data-k="ans" data-s="${s}" aria-label="${l}"${(s < 0 ? val <= lo : val >= hi) ? ' disabled' : ''}>${l}</button>`;
  return `<div class="cnt">${btn(-5, '−5', 'five')}${btn(-1, '−')}<b>${val}</b>${btn(1, '+')}${btn(5, '+5', 'five')}</div>`;
};
const dots = (n, i) => `<div class="dots">${Array.from({ length: n }, (_, k) => `<i class="${k < i ? 'done' : k === i ? 'on' : ''}"></i>`).join('')}</div>`;
const btnHtml = (act, label, extra = '', cls = 'btn') => `<button class="${cls}" data-act="${act}" ${extra}>${esc(label)}</button>`;
const chipsHtml = (t) => {
  const open = secret.unlocked();
  return `<div class="row2"><div class="chips">${[['zero', '0️⃣'], ['split', '✂️']].map(([k, e]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('')}</div></div>`;
};
const setSt = (k, o = {}) => {
  const t = T[lang], s = t.st[k];
  lab.setState({ emo: o.emo ?? s[0], title: o.title ?? s[1], lead: o.lead ?? s[2], body: o.body ?? s[3], extra: (o.extra ?? '') + `<div class="fine">${esc(t.fine)}</div>` });
};

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  const out = v === 'plates' ? renderPlates(t) : v === 'turn' ? renderTurn(t) : renderHops(t);
  $('ctrlBody').innerHTML = out + chipsHtml(t);
}

function renderPlates(t) {
  const p = t.p, free = S.sec === 'zero' || S.part === 'free';
  lab.setGlow('rgba(224, 114, 143, .26)');
  const seg = S.sec ? '' : `<div class="card seg small">${[['free', p.free], ['story', p.story]].map(([k, l]) => `<button data-act="part" data-p="${k}" class="${S.part === k ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>`;
  if (free) {
    lab.setReadout(`${S.plates} × ${S.each}`, p.read(S.plates, S.each), '', '#e0728f');
    setSt('plates', S.sec === 'zero' ? { emo: '0️⃣', title: t.secrets.zero[0], lead: t.sec.zeroText, body: '' } : {});
    return `${seg}<div class="steps">${stepper('plates', p.plates, S.plates)}${stepper('each', p.each, S.each)}</div>`;
  }
  const st = STORIES[S.si], { a, b } = st, head = dots(STORIES.length, S.si), done = S.ph === 'done';
  const next = btnHtml('next', t.next);
  if (st.trap) {
    if (!done) {
      lab.setReadout('?', '', '', '#e0728f'); setSt('plates');
      return `${seg}${head}<p class="sq">${esc(p.trapQ(st.trap, a, b))}</p><div class="opts">${btnHtml('trap', p.yes, 'data-v="yes"', 'btn ghost')}${btnHtml('trap', p.no, 'data-v="no"', 'btn ghost')}</div>`;
    }
    const sum = st.trap.reduce((x, y) => x + y, 0);
    lab.setReadout(`${st.trap.join(' + ')} = ${sum}`, '', '', '#e0728f');
    setSt('plates', S.trapAns === 'no' ? { emo: '✅', title: p.trapRight(a, b) } : { emo: '🤔', title: p.trapWrong(a, b) });
    return `${seg}${head}<div class="acts">${next}</div>`;
  }
  if (done) {
    lab.setReadout(`${a} × ${b}`, p.read(a, b), '', '#e0728f');
    const n = a * b;
    setSt('plates', S.ans === n ? { emo: '✅', title: p.right } : S.ans === a + b ? { emo: '🤔', title: p.added(a, b) } : { emo: '🤔', title: p.wrong(n) });
    return `${seg}${head}<div class="acts">${next}</div>`;
  }
  lab.setReadout('?', '', '', '#e0728f');
  if (S.ph === 'set') {
    setSt('plates');
    return `${seg}${head}<p class="sq">${esc(p.storyText(a, b))}</p><div class="steps">${stepper('sp', p.plates, S.sp)}${stepper('se', p.each, S.se)}</div>
      <div class="acts">${btnHtml('ready', t.ready)}</div>`;
  }
  setSt('plates', S.swapped && S.ph === 'ask' ? { emo: '🔁', title: p.swapped } : {});
  return `${seg}${head}<p class="sq">${esc(p.total)}</p>${S.ph === 'ask' ? `${totalStepper(S.ans)}<div class="acts">${btnHtml('check', t.check)}</div>` : ''}`;
}

function renderTurn(t) {
  const u = t.tu;
  lab.setGlow('rgba(224, 176, 80, .24)');
  if (S.sec === 'split') {
    lab.setReadout(`${SR} × ${SC}`, `= ${SR * SC}`, '', '#e0b050');
    setSt('turn', { emo: '✂️', title: splitLine(), lead: t.sec.cut, body: '' });
    return `<p class="sq">${esc(t.sec.cut)}</p>`;
  }
  const [R, C] = TURN[S.ti], T = R * C, head = dots(TURN.length, S.ti);
  if (S.tAns === null) {
    lab.setReadout(`${R} × ${C}`, '', '', '#e0b050');
    setSt('turn', S.noteSeen ? { extra: `<div class="note">${esc(u.note)}</div>` } : {});
    return `${head}<p class="sq">${esc(u.q(R, C))}</p><div class="opts">${[['more', u.more], ['fewer', u.fewer], ['same', u.same]].map(([k, l]) => btnHtml('tu', l, `data-v="${k}"`, 'btn ghost')).join('')}</div>`;
  }
  if (!S.tDone) { lab.setReadout(`${R} × ${C}`, '', '', '#e0b050'); setSt('turn'); return head; }
  lab.setReadout(String(T), `${R} × ${C} = ${C} × ${R}`, '', '#e0b050');
  const ok = S.tAns === 'same';
  setSt('turn', { emo: ok ? '✅' : '🤔', title: ok ? u.right : u.wrong, lead: S.divide ? u.divLine(T, R, C) : undefined, extra: `<div class="note">${esc(u.note)}</div>` });
  return `${head}<div class="acts">${btnHtml('divide', u.divide, '', `chip ${S.divide ? 'on' : ''}`)}${btnHtml('tnext', t.next)}</div>`;
}

function renderHops(t) {
  const hp = t.h, { step, n, from } = HOPS[S.hi], end = from + step * n, head = dots(HOPS.length, S.hi);
  lab.setGlow('rgba(95, 201, 138, .24)');
  lab.setReadout(`${from} + ${step} × ${n}${S.hDone ? ` = ${end}` : ''}`, '', '', '#5fc98a');
  if (S.hDone) {
    const f = S.flag, verdict = f === end ? { emo: '✅', title: hp.right } : Math.abs(f - end) === step ? { emo: '🤔', title: hp.oneOff } : { emo: '🤔', title: hp.wrong(end) };
    setSt('hops', verdict);
    return `${head}<p class="sq">${esc(hp.q(step, n, from))}</p><div class="acts">${btnHtml('hnext', t.next)}</div>`;
  }
  setSt('hops');
  const hopping = S.hStart >= 0;
  return `${head}<p class="sq">${esc(hp.q(step, n, from))}</p>${S.flag === null ? `<p class="hint">${esc(hp.place)}</p>` : ''}
    <div class="acts">${btnHtml('hop', hp.hop, S.flag === null || hopping ? 'disabled' : '')}</div>`;
}
render();
</script>
</body>
</html>
