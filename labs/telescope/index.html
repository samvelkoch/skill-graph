// --- model: a seeded sky; an object shows when its flux x collected light passes the limit ------------------------
const TAU = Math.PI * 2;
const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const FMIN = 1 / 1.2e6, NOBJ = 2600, SMUDGE = 3e-5; // faint ones (flux below SMUDGE) are far galaxies, drawn as little smudges
const CAT = (() => {
  const r = rng(7), a = [];
  for (let i = 0; i < NOBJ; i++) {
    const u = 0.001 + 0.999 * r(), ang = r() * TAU, rad = Math.sqrt(r());
    a.push({ x: Math.cos(ang) * rad, y: Math.sin(ang) * rad, f: FMIN / (u * u), c: Math.floor(r() * 5), p: r(), s: r() });
  }
  for (let i = 0; i < 8; i++) { // a few stars your own eye can see
    const ang = r() * TAU, rad = 0.15 + 0.8 * Math.sqrt(r());
    a.push({ x: Math.cos(ang) * rad, y: Math.sin(ang) * rad, f: 1.2 + r() * 4.8, c: Math.floor(r() * 5), p: r(), s: r() });
  }
  return a;
})();
const ARMS = (() => {
  const r = rng(21), g = () => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(r() * TAU), a = [];
  for (let k = 0; k < 2; k++) for (let i = 0; i < 130; i++) {
    const u = i / 129;
    a.push({ r: (0.14 + 0.86 * u) * (1 + g() * 0.04), th: k * Math.PI + 4.2 * u + g() * 0.13, o: 0.45 + 0.55 * r(), s: 1 + r() * 1.2, c: r() < 0.3 ? '#ffe3b0' : '#bcd0ff' });
  }
  return a;
})();
const NEB = (() => {
  const r = rng(11), a = [];
  for (let i = 0; i < 22; i++) a.push({ dx: (r() - 0.5) * 0.34, dy: (r() - 0.5) * 0.24, r: 0.05 + 0.06 * r(), o: 0.16 + 0.2 * r(), c: Math.floor(r() * 3) });

})();

const mixc = (a, b, t) => `rgb(${a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(',')})`;

function drawGalaxy(c, x, y, rad, a, det) {
  c.save(); c.translate(x, y); c.rotate(-0.5);
  c.save(); c.scale(1, 0.5);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, Math.max(0.5, rad));

function drawNebula(c, cx, cy, k, a, det) {

// the round eyepiece view: o = { L: light collected (in eyes), z: zoom, M: magnification, jup, noExt }
function eyepiece(c, cx, cy, R, o) {
  const { L, z } = o, k = R * z;
  c.save();
  const bg = c.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.05, cx, cy, R * 1.05);
  bg.addColorStop(0, '#0f1a44'); bg.addColorStop(0.6, '#080e2b'); bg.addColorStop(1, '#03051a');
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fillStyle = bg; c.fill(); c.clip();
  if (!o.jup && !o.noExt) {
    const ex = extVis(L, o.M);
    if (ex.a > 0.02) {
      drawNebula(c, cx, cy, k, ex.a * 0.9, ex.det);
      const gx = cx + GAL.x * k, gy = cy + GAL.y * k, gr = GAL.r * k;

    const v = s.f * L; if (v < 0.85) continue;
    const px = s.x * k, py = s.y * k; if (px * px + py * py > R * R) continue;
    const al = clamp((v - 0.85) / 0.3, 0, 1), X = cx + px, Y = cy + py;

      if (mag > 2) { c.globalAlpha = al * 0.16; c.beginPath(); c.arc(X, Y, r * 3, 0, TAU); c.fill(); }
      c.globalAlpha = al; c.beginPath(); c.arc(X, Y, r, 0, TAU); c.fill();
    }
  }
  c.globalAlpha = 1;
  if (o.jup) drawJupiter(c, cx, cy, R, z);
  const vg = c.createRadialGradient(cx, cy, R * 0.62, cx, cy, R);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)');

  const open = secret.unlocked();
  $('sec1').innerHTML = `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.galileo ? 'on' : ''}" data-act="gal">${open ? `🪐 ${esc(t.secrets.gal[0])}` : '🔒 ???'}</button>`
    + (S.galileo ? `<button type="button" class="chip" data-act="night">🌙 ${esc(t.gal.n)}</button>` : '');
  if (g === null) {
    lab.setReadout(`${nf(L)}×`, t.lightSub, '', '#7aa2ff');
    lab.setState({ emo: '🔭', title: a.q, lead: a.lead0, body: '', extra: fineHTML(a.fine) });
    lab.setFacts(t.facts.dials); return;
  }
  const ex = extVis(L, S.M);
  if (S.galileo) {
    const k = moonsSeen(z, S.night), n = Math.round(S.night) + 1;
    lab.setReadout(`${nf(L)}×`, t.lightSub, t.moonsPill(k), '#7aa2ff');
    lab.setState({ emo: '🪐', title: t.gal.t(n, k), lead: S.night < 1 ? t.gal.l0 : t.gal.l1, body: t.gal.b, extra: fineHTML(a.fine) });
  } else {
    lab.setReadout(`${nf(L)}×`, t.lightSub, t.starsPill(countVis(L, z)), '#7aa2ff');
    const [ti, le] = S.last === 'M' ? [a.zoomT, a.zoomL] : S.last === 'W' ? [a.wideT, a.wideL] : [a.tryT, a.tryL];
    lab.setState({ emo: S.last === 'M' ? '🔎' : S.last === 'W' ? '🪞' : '🎛️', title: ti, lead: le, body: ex.a * ex.det > 0.35 ? a.arms : '', extra: fineHTML(a.fine) });
  }
  lab.setFacts(t.facts.dials);
}

function curL2() { return S.deep ? Lof(6500) * deepX(S.expT) : Lof(INST[S.inst]); }
function ro2(t) {
  const L = S.g1 === null ? 1 : curL2();
  lab.setReadout(`${nf(L)}×`, t.lightSub, S.g1 === null ? '' : t.objPill(countVis(L, 1)), '#f0be5a');
}
function r2(t) {
  const a = t.v2, g = S.g2, open1 = S.g1 !== null;
  lab.setGlow('rgba(240, 190, 90, .22)');
  $('s2lock').style.display = open1 ? 'none' : '';
  $('s2main').style.display = open1 ? '' : 'none';
  if (!open1) {
    $('lockMsg').textContent = a.lock; $('lockGo').textContent = a.go;
    ro2(t);
    lab.setState({ emo: '🔒', title: a.lockT, lead: a.lockL, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  const Lh = Lof(2400);
  askBlock($('ask2'), '2', { q: a.q, opts: a.opts }, g, a.res(nf(Lh)));
  $('instChips').innerHTML = a.short.map((nm, i) => {
    const lk = i >= 3 && g === null;
    return `<button type="button" class="chip ${S.inst === i && !S.deep ? 'on' : ''}" data-inst="${i}"${lk ? ' disabled' : ''}>${lk ? '🔒 ' : ''}${esc(nm)} · ${esc(a.dl[i])}</button>`;
  }).join('');
  const open = secret.unlocked();
  $('sec2').innerHTML = g === null ? '' : `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.deep ? 'on' : ''}" data-act="deep">${open ? `🌌 ${esc(t.secrets.deep[0])}` : '🔒 ???'}</button>`
    + (S.deep && S.expT >= 12 ? `<button type="button" class="chip" data-act="deep">↺ ${esc(a.again)}</button>` : '');
  ro2(t);
  const L = curL2(), d = INST[S.inst];
  if (S.deep) {
    lab.setState({ emo: '🌌', title: a.deepT, lead: a.deepL, body: a.deepB, extra: fineHTML(a.squeeze(nf(INST[4] / D0))) });
  } else if (g === null) {
    lab.setState({ emo: '🔭', title: a.q, lead: a.lead0, body: `${a.long[S.inst]}: ${a.bodyN(countVis(L, 1))}`, extra: '' });
  } else {
    lab.setState({ emo: ['👁️', '🔭', '🔭', '🛰️', '🪞'][S.inst], title: a.long[S.inst], lead: S.inst === 0 ? a.baseL : a.formula(nf(d), nf(L)), body: a.bodyN(countVis(L, 1)),
      extra: fineHTML(a.squeeze(nf(INST[4] / D0))) });
  }
  lab.setFacts(t.facts.eye);
}

const hTxt = () => { const hk = hOf(S.t3); return `${hk < 10 ? hk.toFixed(1) : nf(hk)} km`; };
function ro3(t) {
  lab.setReadout(hTxt(), t.v3.sub, t.v3.pills[cat3()], '#6fb4ff');
}
function r3(t) {
  const a = t.v3, g = S.g3;
  lab.setGlow('rgba(100, 160, 255, .26)');
  askBlock($('ask3'), '3', { q: a.q, opts: a.opts }, g, a.res(FAR_B));
  $('air').style.display = g === null ? 'none' : '';
  $('hL').textContent = a.hl; $('rH').setAttribute('aria-label', a.hl); $('hV').textContent = hTxt();
  $('chips3').innerHTML = [0, 0.2, 1].map((tt, i) => `<button type="button" class="chip ${Math.abs(S.t3g - tt) < 0.02 ? 'on' : ''}" data-act="h" data-t="${tt}">${['🌲', '⛰️', '🛰️'][i]} ${esc(a.chips[i])}</button>`).join('');
  if (+$('rH').value !== Math.round(S.t3 * 1000)) $('rH').value = Math.round(S.t3 * 1000);
  S.cat3 = cat3(); ro3(t);
  if (g === null) lab.setState({ emo: '🌠', title: a.q, lead: a.lead0, body: a.pre, extra: '' });
  else lab.setState({ emo: ['✨', '🌫️', '🔭'][S.cat3], title: a.st[S.cat3][0], lead: a.st[S.cat3][1], body: a.body(HUBBLE_KM, FAR_T), extra: fineHTML(a.fine) });
  lab.setFacts(t.facts.sky);
}
render();
</script>
</body>
</html>
