let lastKey = ''; // the readout's last text (upd is called every frame)
// --- time ------------------------------------------------------------------------------------------------------
function stepAll(dt, time) {
  const v = lab.view;
  if (v === 'drop') {
    if (S.sec === 'brown') brownStep(dt, time);
    else if (S.sec === 'smell') { rooms[0].step(dt); rooms[1].step(dt); }
    else if (S.phase === 'cmp') {
      cold.step(dt); hot.step(dt);
      if (hot.even !== null) { S.cmpDone += dt; if (S.cmpDone > 6) { S.phase = 'free'; main.C = S.temp; main.reset(); render(); } }
    } else main.step(dt);
  } else if (v === 'wall') { if (S.pred.wall !== null) wall.step(dt); }
  else if (S.pred.cell !== null) cellStep(dt);
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  K = Math.min(w / W0, h / H0); DT = dt;
  const ox = (w - W0 * K) / 2, oy = (h - H0 * K) / 2;
  stepAll(dt, time);
  c.save(); c.translate(ox, oy); c.scale(K, K); c.lineJoin = 'round'; c.lineCap = 'round';
  panel(c);
  const v = lab.view;
  if (v === 'drop') { if (S.sec === 'brown') drawBrown(c, time); else if (S.sec === 'smell') drawSmell(c, time); else drawDrop(c, time); }
  else if (v === 'wall') drawWall(c, time);
  else drawCell(c, time);
  c.restore();
  upd();
});

// --- the readout (called by the loop and by render) -----------------------------------------------------------
function upd() {
  const t = T[lang], v = lab.view;
  let val = '', sub = '', pill_ = '', col = '#ff4fa3';
  if (v === 'drop') {
    if (S.sec === 'brown') { val = '🔬'; col = '#e0a93a'; }
    else if (S.sec === 'smell') { val = `${fmt1(rooms[0].clock())} · ${fmt1(rooms[1].clock())} ${t.sec}`; col = '#d696ff'; }
    else {
      pill_ = t.particles(N);
      if (S.phase === 'cmp') { val = `${t.deg(10)} · ${t.deg(70)}`; sub = hot.even !== null ? `${t.deg(70)}: ${t.even(Math.round(hot.even))}` : t.spreading; }
      else { val = t.deg(S.temp); sub = main.on ? (main.even !== null ? t.even(Math.round(main.even)) : t.spreading) : ''; }
    }
  } else if (v === 'wall') {
    col = '#ff6b6b'; if (S.pred.wall !== null) pill_ = t.sides(wall.left(), NW - wall.left());
    val = S.pred.wall === null ? '?' : t.net(wall.toR - wall.toL);
  } else {
    col = '#8fd694';
    const a = tSmall(), b = tBig();
    if (S.pred.cell === null) val = '?';
    else if (a !== null && b !== null) { val = t.ratio(fmt1(b / a)); sub = t.ratioSub; pill_ = t.times(fmt1(a), fmt1(b)); }
    else val = '…';
  }
  const key = [val, sub, pill_, col].join('|');
  if (key === lastKey) return;
  lastKey = key; lab.setReadout(val, sub, pill_, col);
}

  S.pred[k] = i; (i === RIGHT[k] ? sfx.good : sfx.bad)();

  $('dfSl').style.display = sec ? 'none' : 'flex';
  $('dfTL').textContent = t.temp; $('dfT').value = S.temp; $('dfT').disabled = !free; $('dfT').setAttribute('aria-label', t.temp);
  $('dfDropRow').style.display = sec || S.phase === 'ask' ? 'none' : 'flex';
  $('dfDropB').textContent = S.phase === 'cmp' || main.on ? t.again : t.drop;
  const open = secret.unlocked();
  const sc = (k, emo, n) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[n][0])}` : '🔒 ???'}</button>`;
  $('dfSecRow').innerHTML = sc('brown', '🔬', 'a') + sc('smell', '🌸', 'b');
  const ctl = $('dfSecCtl');
  ctl.style.display = sec ? 'flex' : 'none';
  ctl.innerHTML = sec === 'brown' ? `<button class="chip ${S.mol ? 'on' : ''}" data-act="mol">${esc(t.showMolecules)}</button>`
    : sec === 'smell' ? `<button class="btn df-btn" data-act="sagain">${esc(t.again)}</button>` : '';
  if (sec === 'brown') lab.setState({ emo: '🔬', title: t.secrets.a[0], lead: t.brownText, body: '' });
  else if (sec === 'smell') lab.setState({ emo: '🌸', title: t.secrets.b[0], lead: t.smellText, body: '' });
  else lab.setState(stateOf('drop', t));
  lab.setFacts(t.facts.drop);
}
function renderWall(t) {

  $('dfAskWall').innerHTML = askHTML('wall');
  $('dfWallRow').style.display = S.pred.wall === null ? 'none' : 'flex'; $('dfWallB').textContent = t.again;
  lab.setState(stateOf('wall', t)); lab.setFacts(t.facts.wall);
}
function renderCell(t) {
  lab.setGlow('rgba(143, 214, 148, .24)');
  $('dfAskCell').innerHTML = askHTML('cell');
  $('dfCellRow').style.display = S.pred.cell === null ? 'none' : 'flex'; $('dfCellB').textContent = t.start;
  lab.setState(stateOf('cell', t)); lab.setFacts(t.facts.cell);
}
