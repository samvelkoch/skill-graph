// --- audio: one context, one master gain, one voice at a time, only from the lab's own buttons --------------
const MASTER = 0.12;
const AU = { ctx: null, master: null, voice: null };
const soundOn = () => $('sound').textContent === '🔊';
function ensureAudio() {
  try {
    if (!AU.ctx) {
      AU.ctx = new (window.AudioContext || window.webkitAudioContext)();
      AU.master = AU.ctx.createGain(); AU.master.gain.value = MASTER; AU.master.connect(AU.ctx.destination);
    }
    if (AU.ctx.state === 'suspended') AU.ctx.resume().catch(() => {});
    return AU.ctx;
  } catch { AU.ctx = null; return null; }
}
function stopVoice(fade = 0.04) {
  const v = AU.voice; AU.voice = null;
  if (!v || !AU.ctx) return;
  try {
    // the envelope keeps running; a separate gain that is only ever touched here fades the voice out
    const t = AU.ctx.currentTime, g = v.out.gain;
    g.setValueAtTime(1, t); g.linearRampToValueAtTime(0, t + fade);
    v.o.stop(t + fade + 0.02);
  } catch { /* already stopped */ }
}
// the only way this lab makes a tone: guarded here, so nothing outside 110–1760 Hz can ever play
function play({ f, amp, type = 'triangle', attack = 0.008, hold = 0, decay = 1.4, slide = 0 }) {
  if (!soundOn() || !(f >= 110 && f <= 1760)) return;
  const ctx = ensureAudio(); if (!ctx) return;
  stopVoice(0.03);
  try {
    const now = ctx.currentTime, t = now + 0.035, peak = clamp(amp, 0.05, 1);
    const o = ctx.createOscillator(), g = ctx.createGain(), out = ctx.createGain();
    out.gain.value = 1;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(clamp(f + slide, 110, 1760), t + 0.3);
    g.gain.setValueAtTime(0.0001, now); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    if (hold) g.gain.setValueAtTime(peak, t + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + decay);
    o.connect(g).connect(out).connect(AU.master);
    o.start(now); o.stop(t + attack + hold + decay + 0.05);
    AU.voice = { o, out };
  } catch { /* no audio: stay silent */ }
}

  $('cString').classList.toggle('show', v === 'string');

  $('cVoice').classList.toggle('show', v === 'voice');
  lab.setGauge(0, t.ticks.map((label, i) => ({ f: [0, 0.3, 0.6, 1][i], label })), t.gaugeCap);
  if (v === 'string') renderString(t); else if (v === 'drum') renderDrum(t); else renderVoice(t);

  askEl.style.display = S.asked || v !== 'string' ? 'none' : '';
  if (!S.asked) {
    askEl.innerHTML = S.answer === null
      ? `<div class="q">${esc(t.ask)}</div><div class="opts">${['higher', 'louder', 'both'].map((k) => `<button data-a="${k}">${esc(t.a[k])}</button>`).join('')}</div>`
      : `<div class="verdict" style="color:${S.answer === 'louder' ? 'var(--ok)' : 'var(--wip)'}">${esc(S.answer === 'louder' ? t.yesV : t.noV)}</div>
         <p>${esc(S.answer === 'louder' ? t.yesT : t.noT)}</p><div class="opts"><button>${esc(t.go)} →</button></div>`;
  }
}

function renderString(t) {
  const f = fString(), pk = pitchKey(f);
  $('lenLbl').textContent = `${t.lenLbl}: ${S.secret ? lenTxt(L0 * F0 / f) : lenTxt(S.L)}`;
  $('len').value = String(S.L);
  $('lenL').textContent = t.ends[0]; $('lenR').textContent = t.ends[1];
  const open = secret.unlocked();
  const sc = (k) => `<button class="chip secret ${open ? 'open' : ''} ${S.secret === k ? 'on' : ''}" data-k="${k}">${open ? `${k === 'low' ? '🐘' : '🦇'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  const lens = [[1, t.whole], [2, '½'], [3, '⅓'], [4, '¼']];
  $('lenChips').innerHTML = [sc('low'), ...lens.map(([d, label]) => `<button class="chip ${!S.secret && Math.abs(S.L - L0 / d) < 0.13 ? 'on' : ''}" data-k="${d}">${esc(label)}</button>`), sc('high')].join('');
  $('thickLbl').textContent = t.thickLbl; $('tightLbl').textContent = t.tightLbl; $('strLbl').textContent = t.strLbl;
  $('thick').innerHTML = seg([['thick', t.thick.thick], ['thin', t.thick.thin]], S.thin ? 'thin' : 'thick');
  $('tight').innerHTML = seg([['normal', t.tight.normal], ['tight', t.tight.tight]], S.tight ? 'tight' : 'normal');
  $('str').innerHTML = seg(t.str.map((label, i) => [i, label]), STRENGTHS.indexOf(S.strength));
  $('pluck').textContent = t.pluck;

  lab.setReadout(`${esc(nf(f))} ${esc(t.hz)}`, t.perSec(f), t.pill[pk], PITCH_COLOR[pk]);
  const glow = { low: 'rgba(78,168,255,.30)', mid: 'rgba(61,220,151,.26)', high: 'rgba(255,138,61,.30)', tooLow: 'rgba(168,85,247,.28)', tooHigh: 'rgba(245,200,76,.26)' };
  lab.setGlow(glow[pk]);

  if (S.secret) {
    const s = t.sec[S.secret];
    lab.setState({ emo: S.secret === 'low' ? '🐘' : '🦇', title: s.title, lead: s.lead, body: s.body(lenTxt(L0 * F0 / f)),
      extra: `<div class="stats"><span>🔢 ${esc(t.count)} <b>${esc(durTxt(f))}</b></span></div><div class="fine">${esc(t.secFine)}</div>` });
    return;
  }
  const ratio = L0 / S.L, oct = [2, 4].some((r) => Math.abs(ratio - r) < 0.01);
  const lead = S.why ? t.why[S.why] : S.plucked ? t.sPluck : t.sIdle;
  lab.setState({ emo: '🎸', title: t.sTitle(f), lead, body: t.sBody(f), extra: `<div class="stats">
      <span>🎵 ${esc(t.note)}: <b>${esc(noteOf(f))}</b></span>
      <span>🔢 ${esc(t.count)} <b>${esc(durTxt(f))}</b></span>
      ${oct ? `<span class="hl">🎹 ${esc(t.octave)}</span>` : ''}
    </div><div class="fine">${esc(t.fine)}</div>` });
}

function renderDrum(t) {
  $('dLvLbl').textContent = t.lvLbl;
  $('dLv').innerHTML = seg(t.drumLv.map((label, i) => [i, label]), D.level);
  $('voiceBtn').textContent = t.voiceBtn[D.level]; $('hitBtn').textContent = t.hit;
  lab.setReadout(`${esc(nf(DRUM_F))} ${esc(t.hz)}`, t.perSec(DRUM_F), t.drumLv[D.level].replace(/^\S+\s/, ''), ['#4ea8ff', '#3ddc97', '#ff8a3d'][D.level]);
  lab.setGlow(['rgba(78,168,255,.22)', 'rgba(61,220,151,.26)', 'rgba(255,138,61,.32)'][D.level]);
  const x = D.mode === 'voice' ? t.dVoice : D.mode === 'hit' ? t.dHit : null;
  lab.setState({ emo: '🥁', title: x ? x.title : t.dIdle.title, lead: x ? x.leads[D.lv] : t.dIdle.lead, body: x ? x.body : t.dIdle.body,
    extra: `<div class="fine">${esc(t.dFine)}</div>` });
}

function renderVoice(t) {
  const f = fVoice(), pk = pitchKey(f);
  $('foldLbl').textContent = t.foldLbl; $('fold').value = String(V.s);
  $('foldL').textContent = t.foldEnds[0]; $('foldR').textContent = t.foldEnds[1];
  $('vLvLbl').textContent = t.lvLbl;
  $('vLv').innerHTML = seg(t.voiceLv.map((label, i) => [i, label]), V.level);
  $('humBtn').textContent = t.hum;
  lab.setReadout(`${esc(nf(f))} ${esc(t.hz)}`, t.perSec(f), t.pill[pk], PITCH_COLOR[pk]);
  lab.setGlow({ low: 'rgba(78,168,255,.26)', mid: 'rgba(61,220,151,.26)', high: 'rgba(255,138,61,.30)' }[pk]);
  lab.setState({ emo: '🗣️', title: t.vTitle, lead: V.why ? t.vWhy[V.why] : t.vIdle, body: t.vBody(f),
    extra: `<div class="stats"><span>🎵 ${esc(t.note)}: <b>${esc(noteOf(f))}</b></span></div><div class="fine">${esc(t.vFine)}</div>` });
}

// --- drawing helpers ------------------------------------------------------------------------------------------
const rr = (c, x, y, w, h, r) => { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); };
const font = (wt, px) => `${wt} ${px}px Nunito, sans-serif`;

// the "sound screen": a fixed 0.02 s window, so wave spacing shows how fast and wave height shows how big
function soundScreen(c, x, y, w, h, f, amp, ghost, silent) {
  const t = T[lang], fs = clamp(w * 0.024, 10, 12.5);
  c.fillStyle = '#06130e'; rr(c, x, y, w, h, 14); c.fill();
  c.strokeStyle = 'rgba(61,220,151,.35)'; c.lineWidth = 1.2; c.stroke();
  c.save(); rr(c, x, y, w, h, 14); c.clip();
  c.strokeStyle = 'rgba(61,220,151,.09)'; c.lineWidth = 1;
  for (let i = 1; i < 10; i++) { c.beginPath(); c.moveTo(x + w * i / 10, y); c.lineTo(x + w * i / 10, y + h); c.stroke(); }
  for (let j = 1; j < 4; j++) { c.beginPath(); c.moveTo(x, y + h * j / 4); c.lineTo(x + w, y + h * j / 4); c.stroke(); }
  const top = y + fs * 2.2, mid = (top + y + h - fs * 1.6) / 2, A = (y + h - fs * 1.6 - top) / 2 - 2;
  c.strokeStyle = 'rgba(61,220,151,.25)'; c.beginPath(); c.moveTo(x, mid); c.lineTo(x + w, mid); c.stroke();
  const trace = (ff, a, style, lw, dash) => {
    const cycles = ff * WINDOW, perPx = cycles / w;
    if (perPx > 0.3) { // too many waves to draw one by one: a solid band
      c.fillStyle = style; c.globalAlpha = 0.5; c.fillRect(x, mid - a * A, w, 2 * a * A); c.globalAlpha = 1; return;
    }
    c.strokeStyle = style; c.lineWidth = lw; c.setLineDash(dash); c.beginPath();
    const n = Math.ceil(w);
    for (let i = 0; i <= n; i++) { const yy = mid - a * A * Math.sin(2 * Math.PI * cycles * i / n); i ? c.lineTo(x + i, yy) : c.moveTo(x, yy); }
    c.stroke(); c.setLineDash([]);
  };
  if (ghost) trace(ghost.f, ghost.amp, 'rgba(237,239,247,.38)', 1.5, [4, 4]);
  c.shadowColor = 'rgba(61,220,151,.8)'; c.shadowBlur = 8;
  trace(f, amp, '#3ddc97', 2.5, []);
  c.shadowBlur = 0;
  // labels
  c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillStyle = '#7fe6b9'; c.font = font(800, fs);
  c.fillText(`${t.screen} · ${t.window}`, x + 10, y + fs * 1.1);
  c.fillStyle = 'rgba(127,230,185,.75)'; c.font = font(700, fs * 0.95);
  c.fillText(t.waves(nf(f * WINDOW, f * WINDOW >= 10 ? 0 : 1)), x + 10, y + h - fs * 0.9);
  if (ghost) { c.textAlign = 'center'; c.fillStyle = 'rgba(237,239,247,.6)'; c.fillText(`- - ${t.last}: ${nf(ghost.f)} ${t.hz}`, x + w / 2, y + h - fs * 0.9); }
  // loudness bar
  const bw = clamp(w * 0.18, 44, 90), bx = x + w - bw - 10, by = y + fs * 1.1;
  c.textAlign = 'right'; c.fillStyle = '#7fe6b9'; c.font = font(800, fs);
  c.fillText(silent ? '🔇' : t.loud, bx - 6, by);
  c.fillStyle = 'rgba(61,220,151,.15)'; rr(c, bx, by - 4, bw, 8, 4); c.fill();
  c.fillStyle = '#3ddc97'; rr(c, bx, by - 4, Math.max(0, bw * (silent ? 0 : amp)), 8, 4); c.fill();
  if (silent && amp > 0.02) {
    c.textAlign = 'center'; c.fillStyle = '#f5c84c'; c.font = font(800, fs * 1.05);
    c.fillText(t.silent, x + w / 2, top + 4);
  }
  c.restore();
}

// --- the string ---------------------------------------------------------------------------------------------
let G = {};
function drawString(c, w, h, dt) {
  const t = T[lang], fs = clamp(w * 0.024, 10, 13), f = fString(), slow = slowString();
  const pad = clamp(w * 0.05, 14, 40), xb = pad + 8, xn = w - pad - 22, ys = h * 0.3, mp = Math.min(h * 0.13, 48);
  const xc = S.secret ? xn : xb + (S.L / L0) * (xn - xb);
  G = { xb, xn, xc, ys, mp };
  if (!S.pull) { S.ph += 2 * Math.PI * f / slow * dt; S.amp *= Math.exp(-dt / 4); if (S.amp < 0.003) S.amp = 0; }
  // board
  const by0 = ys - mp - 12, bh = 2 * mp + 24;
  const wood = c.createLinearGradient(0, by0, 0, by0 + bh); wood.addColorStop(0, '#3b2717'); wood.addColorStop(1, '#2a1b10');
  c.fillStyle = wood; rr(c, xb - 14, by0, xn - xb + 40, bh, 12); c.fill();
  // fret marks at 1/2, 1/3, 1/4 of the length
  if (!S.secret) for (const d of [2, 3, 4]) { const fx = xb + (xn - xb) / d; c.fillStyle = 'rgba(200,190,170,.18)'; c.fillRect(fx - 1, by0 + 4, 2, bh - 8); }
  // the dead part beyond the clamp
  const lw = S.thin ? 2.4 : 4.6;
  if (xc < xn - 1) { c.strokeStyle = 'rgba(220,205,170,.35)'; c.lineWidth = lw; c.beginPath(); c.moveTo(xc, ys); c.lineTo(xn, ys); c.stroke(); }
  // the shake envelope (how big the shake is) and the size arrow
  const amp = S.pull ? Math.abs(S.pull.dy) / mp : S.amp;
  if (!S.pull && amp > 0.03) {
    c.strokeStyle = 'rgba(245,200,76,.35)'; c.lineWidth = 1; c.setLineDash([3, 5]);
    for (const sgn of [-1, 1]) { c.beginPath(); for (let i = 0; i <= 60; i++) { const u = i / 60, x = lerp(xb, xc, u), y = ys + sgn * mp * amp * Math.sin(Math.PI * u); i ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke(); }
    c.setLineDash([]);
    const ax = (xb + xc) / 2 + Math.min(40, (xc - xb) * 0.18), a0 = ys - mp * amp, a1 = ys + mp * amp;
    if (a1 - a0 > 14) {
      c.strokeStyle = '#f5c84c'; c.fillStyle = '#f5c84c'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(ax, a0); c.lineTo(ax, a1); c.stroke();
      for (const [yy, d] of [[a0, 1], [a1, -1]]) { c.beginPath(); c.moveTo(ax, yy); c.lineTo(ax - 4, yy + 6 * d); c.lineTo(ax + 4, yy + 6 * d); c.fill(); }
      c.font = font(800, fs * 0.9); c.textBaseline = 'middle';
      const right = ax + 7 + c.measureText(t.size).width < xc - 14;
      c.textAlign = right ? 'left' : 'right'; c.fillText(t.size, right ? ax + 7 : ax - 7, a0 + 6);
    }
  }
  // the string itself
  const sg = c.createLinearGradient(0, ys - 3, 0, ys + 3); sg.addColorStop(0, '#fff6dc'); sg.addColorStop(1, '#c9b27a');
  c.strokeStyle = sg; c.lineWidth = lw; c.lineCap = 'round'; c.beginPath();
  if (S.pull) { c.moveTo(xb, ys); c.lineTo(clamp(S.pull.x, xb + 4, xc - 4), ys + S.pull.dy); c.lineTo(xc, ys); }
  else for (let i = 0; i <= 90; i++) { const u = i / 90, x = lerp(xb, xc, u), y = ys + mp * S.amp * Math.sin(Math.PI * u) * Math.cos(S.ph); i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke(); c.lineCap = 'butt';
  // bridge (left), clamp (movable), tuning peg (right)
  c.fillStyle = '#d9cfb8'; c.beginPath(); c.moveTo(xb - 6, ys + 9); c.lineTo(xb + 6, ys + 9); c.lineTo(xb, ys - 2); c.fill();
  if (!S.secret) {
    c.fillStyle = '#c9ced9'; rr(c, xc - 6, ys - mp * 0.55, 12, mp * 1.1, 4); c.fill();
    c.strokeStyle = 'rgba(10,12,20,.45)'; c.lineWidth = 1;
    for (let k = -2; k <= 2; k++) { c.beginPath(); c.moveTo(xc - 3, ys + k * 6); c.lineTo(xc + 3, ys + k * 6); c.stroke(); }
    c.fillStyle = 'rgba(237,239,247,.7)'; c.font = font(800, fs * 0.85); c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(t.clampTip, xc, ys - mp * 0.55 - 8);
  }
  const pegR = S.tight ? 8 : 7;
  c.fillStyle = '#e2c27a'; c.beginPath(); c.arc(xn + 8, ys, pegR, 0, 7); c.fill();
  c.strokeStyle = '#6b4f1d'; c.lineWidth = 2; c.beginPath(); c.moveTo(xn + 8, ys); c.lineTo(xn + 8 + Math.cos(S.tight ? 1.2 : 0.3) * pegR, ys - Math.sin(S.tight ? 1.2 : 0.3) * pegR); c.stroke();
  // slowed-down label
  c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = '#f5c84c'; c.font = font(800, fs);
  c.fillText(`🐢 ${t.slowed(slow)}`, xb - 8, Math.max(fs * 0.8, by0 - fs * 0.9));
  // ruler with the length of the shaking part
  const ry = by0 + bh + 6;
  if (!S.secret) {
    c.strokeStyle = 'rgba(152,160,184,.5)'; c.lineWidth = 1; c.fillStyle = 'rgba(152,160,184,.8)'; c.font = font(700, fs * 0.8); c.textAlign = 'center'; c.textBaseline = 'top';
    for (let cm = 0; cm <= L0; cm += 5) {
      const x = xb + cm / L0 * (xn - xb), big = cm % 10 === 0;
      c.beginPath(); c.moveTo(x, ry); c.lineTo(x, ry + (big ? 6 : 3)); c.stroke();
      if (big && (w > 480 || cm % 20 === 0)) c.fillText(String(cm), x, ry + 7);
    }
  }
  c.fillStyle = '#fff'; c.font = font(900, fs); c.textAlign = 'center'; c.textBaseline = 'top';
  const lenLabel = S.secret ? `${lenTxt(L0 * F0 / f)} (${t.notScale})` : lenTxt(S.L);
  c.fillText(lenLabel, S.secret ? (xb + xn) / 2 : (xb + xc) / 2, ry + fs * 1.6);
  // a hint when it is quiet
  if (!S.plucked && !S.pull && S.asked) { c.fillStyle = 'rgba(237,239,247,.75)'; c.font = font(800, fs); c.textBaseline = 'middle'; c.fillText(t.tip, (xb + xn) / 2, ys + mp * 0.62); }
  // sound screen
  const sy = Math.max(ry + fs * 3.2, h * 0.56);
  soundScreen(c, pad * 0.6, sy, w - pad * 1.2, h - sy - 4, f, S.pull ? 0 : S.amp, S.ghost, !!S.secret);
  lab.setGauge(S.secret ? 0 : S.amp);
}

// --- the drum with rice -------------------------------------------------------------------------------------
let DG = {};
function drawDrum(c, w, h, dt, time) {
  const t = T[lang], fs = clamp(w * 0.024, 10, 13);
  const kx = w * 0.13, ky = h * 0.3, ks = clamp(h * 0.14, 28, 60);
  const cx = w * 0.64, Rw = Math.min(w * 0.24, h * 0.36), ry = Rw * 0.26, topY = h * 0.3, bodyH = h * 0.17;
  DG = { cx, Rw, ry, topY, bodyH };
  const A = Rw * 0.16, om = 2 * Math.PI * DRUM_F / SLOW, g = A * om * om / 2.8;
  // drive and decay of the skin
  const ta = clock - D.t0;
  if (D.mode === 'voice' && ta > ARRIVE && ta < ARRIVE + EMIT) D.amp += (LEVELS[D.lv] - D.amp) * Math.min(1, dt * 2.5);
  else D.amp *= Math.exp(-dt / (D.mode === 'hit' ? 2.2 : 1.2));
  if (D.amp < 0.003) D.amp = 0;
  // rice: a bouncing-ball-on-a-shaking-skin model, in small sub-steps so grains never fall through
  const n = Math.max(1, Math.ceil(dt / 0.004)), hs = dt / n;
  for (let k = 0; k < n; k++) {
    D.ph += om * hs;
    const sn = Math.sin(D.ph), cs = Math.cos(D.ph);
    for (const gr of D.grains) {
      const shape = Math.cos(Math.PI / 2 * Math.min(1, Math.hypot(gr.x, gr.z * 0.5)));
      const sy = A * D.amp * shape * sn, sv = A * D.amp * shape * om * cs, sa = -A * D.amp * shape * om * om * sn;
      if (gr.on) { gr.y = sy; gr.vy = sv; if (sa < -g) gr.on = false; }
      else {
        gr.vy -= g * hs; gr.y += gr.vy * hs;
        if (gr.y <= sy) { gr.y = sy; gr.vy = sv; gr.on = true; gr.x = clamp(gr.x + (Math.random() - 0.5) * 0.03, -0.8, 0.8); gr.rot += (Math.random() - 0.5) * 1.5; }
      }
    }
  }
  // the child and the distance
  c.font = `${ks}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('🧒', kx, ky);
  const mx = kx + ks * 0.45, dx1 = cx - Rw - 6;
  const dy = topY + bodyH + ry + fs * 1.2;
  c.strokeStyle = 'rgba(152,160,184,.6)'; c.lineWidth = 1; c.setLineDash([4, 4]);
  c.beginPath(); c.moveTo(kx, dy); c.lineTo(cx, dy); c.stroke(); c.setLineDash([]);
  c.fillStyle = 'rgba(152,160,184,.9)'; c.font = font(800, fs); c.textBaseline = 'middle';
  c.fillText(t.meter, (kx + cx) / 2, dy - fs * 0.8);
  // sound waves in the air: pressure ridges spreading out from the mouth, one per shake
  const v = (cx - kx) / ARRIVE, lam = v / (DRUM_F / SLOW);
  if (D.mode === 'voice' && ta < ARRIVE + EMIT + (Rw * 2) / v) {
    const L = LEVELS[D.lv];
    c.strokeStyle = `rgba(245,200,76,${0.35 + 0.55 * L})`; c.lineWidth = 1 + 3.5 * L;
    for (let j = 0; j < 8; j++) {
      const r = v * ta - j * lam;
      if (r <= 0 || r > v * (ta - 0) || r < v * (ta - EMIT) || r > cx + Rw - mx) continue;
      c.beginPath(); c.arc(mx, ky, r, -0.42, 0.42); c.stroke();
    }
  }
  // drum body
  c.fillStyle = '#9e2a24'; c.fillRect(cx - Rw, topY, 2 * Rw, bodyH);
  c.fillStyle = '#7d201b'; c.beginPath(); c.ellipse(cx, topY + bodyH, Rw, ry, 0, 0, Math.PI); c.fill();
  c.strokeStyle = 'rgba(255,220,180,.5)'; c.lineWidth = 1.5;
  for (let i = 0; i < 6; i++) { const x0 = cx - Rw + (i + 0.5) * 2 * Rw / 6; c.beginPath(); c.moveTo(x0 - Rw / 6, topY + 4); c.lineTo(x0 + Rw / 6, topY + bodyH - 2); c.stroke(); }
  // skin
  const disp = A * D.amp * Math.sin(D.ph);
  c.fillStyle = '#eadcbc'; c.beginPath(); c.ellipse(cx, topY, Rw, ry, 0, 0, 2 * Math.PI); c.fill();
  const sh = c.createRadialGradient(cx, topY, 2, cx, topY, Rw * 0.9);
  sh.addColorStop(0, disp > 0 ? `rgba(255,255,255,${clamp(disp / A, 0, 1) * 0.5})` : `rgba(90,70,40,${clamp(-disp / A, 0, 1) * 0.45})`); sh.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = sh; c.beginPath(); c.ellipse(cx, topY, Rw, ry, 0, 0, 2 * Math.PI); c.fill();
  // the skin's middle line, seen from the front: it bulges up and down
  c.strokeStyle = '#b39a6a'; c.lineWidth = 2; c.beginPath();
  for (let i = 0; i <= 40; i++) { const u = i / 40 * 2 - 1, y = topY - disp * Math.cos(Math.PI / 2 * Math.abs(u)); i ? c.lineTo(cx + u * Rw, y) : c.moveTo(cx + u * Rw, y); }
  c.stroke();
  c.strokeStyle = '#d9d2c4'; c.lineWidth = 3; c.beginPath(); c.ellipse(cx, topY, Rw, ry, 0, 0, 2 * Math.PI); c.stroke();
  // rice
  for (const gr of [...D.grains].sort((a, b) => a.z - b.z)) {
    const shape = Math.cos(Math.PI / 2 * Math.min(1, Math.hypot(gr.x, gr.z * 0.5)));
    const gx = cx + gr.x * Rw, gy = topY + gr.z * ry * 0.75 - gr.y - 2 + (1 - shape) * 0;
    c.save(); c.translate(gx, gy); c.rotate(gr.rot); c.fillStyle = '#fbf7ec'; c.strokeStyle = 'rgba(120,100,70,.5)'; c.lineWidth = 0.6;
    c.beginPath(); c.ellipse(0, 0, Math.max(2.2, Rw * 0.028), Math.max(1.1, Rw * 0.013), 0, 0, 2 * Math.PI); c.fill(); c.stroke(); c.restore();
  }
  c.fillStyle = 'rgba(237,239,247,.6)'; c.font = font(800, fs * 0.9); c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText(`← ${t.rice}`, cx + Rw + 6, topY - ry * 0.4);
  // labels
  c.textAlign = 'left'; c.fillStyle = '#f5c84c'; c.font = font(800, fs);
  c.fillText(`🐢 ${t.slowed(SLOW)}`, 10, fs * 0.9);
  if (!D.mode) { c.textAlign = 'center'; c.fillStyle = 'rgba(237,239,247,.75)'; c.fillText(t.drumTip, cx, topY - ry - A - fs * 1.4); }
  const sy = Math.max(h * 0.58, dy + fs * 0.9);
  soundScreen(c, 8, sy, w - 16, h - sy - 4, DRUM_F, D.amp, D.ghost, false);
  lab.setGauge(D.amp);
}

// --- the voice box (vocal folds seen from above) -------------------------------------------------------------
let VG = {};
function drawVoice(c, w, h, dt) {
  const t = T[lang], fs = clamp(w * 0.024, 10, 13), f = fVoice();
  const cx = w / 2, cy = h * 0.29, R = Math.min(w * 0.2, h * 0.22);
  VG = { cx, cy, R };
  if (clock < V.humEnd) V.amp += (V.target - V.amp) * Math.min(1, dt * 6); else { V.amp *= Math.exp(-dt * 3); if (V.amp < 0.003) V.amp = 0; }
  V.ph += 2 * Math.PI * f / SLOW * dt;
  // throat
  c.fillStyle = '#5a2633'; c.beginPath(); c.ellipse(cx, cy, R * 1.05, R, 0, 0, 2 * Math.PI); c.fill();
  c.fillStyle = '#1c070c'; c.beginPath(); c.ellipse(cx, cy, R * 0.86, R * 0.84, 0, 0, 2 * Math.PI); c.fill();
  // folds: tighter = longer and thinner
  const open = V.amp * (0.5 - 0.5 * Math.cos(V.ph)), gap = 1 + R * 0.2 * open;
  const Lf = R * (0.66 + 0.1 * V.s), tw = R * (0.5 - 0.2 * V.s);
  for (const sgn of [-1, 1]) {
    const gr = c.createLinearGradient(cx, 0, cx + sgn * tw * 1.4, 0); gr.addColorStop(0, '#ffd0d6'); gr.addColorStop(1, '#d9707f');
    c.fillStyle = gr; c.beginPath();
    c.moveTo(cx, cy - Lf);
    c.quadraticCurveTo(cx + sgn * gap * 2, cy, cx, cy + Lf);
    c.quadraticCurveTo(cx + sgn * tw * 2.1, cy, cx, cy - Lf);
    c.fill();
  }
  c.fillStyle = '#e9a0ab'; c.beginPath(); c.ellipse(cx, cy - Lf, R * 0.12, R * 0.06, 0, 0, 2 * Math.PI); c.fill();
  // labels
  c.fillStyle = 'rgba(237,239,247,.8)'; c.font = font(800, fs * 0.9); c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(`▲ ${t.front}`, cx, cy - R - fs * 0.9);
  c.textAlign = 'left'; c.fillStyle = '#ffd0d6';
  const lx = cx + R * 1.12;
  const below = lx + c.measureText(`← ${t.folds}`).width > w - 6;
  if (!below) c.fillText(`← ${t.folds}`, lx, cy);
  else { c.textAlign = 'center'; c.fillText(t.folds, cx, cy + R + fs * 0.9); }
  c.fillStyle = 'rgba(237,239,247,.6)'; c.textAlign = 'center'; c.font = font(700, fs * 0.85);
  c.fillText(t.topView, cx, cy + R + fs * (below ? 2.1 : 1.1), w - 16);
  c.fillText(t.air, cx, cy + R + fs * (below ? 3.1 : 2.1), w - 16);
  c.textAlign = 'left'; c.fillStyle = '#f5c84c'; c.font = font(800, fs);
  c.fillText(`🐢 ${t.slowed(SLOW)}`, 10, fs * 0.9);
  if (!V.hummed) { c.textAlign = 'right'; c.fillStyle = 'rgba(237,239,247,.75)'; c.fillText(t.voiceTip, w - 10, fs * 0.9); }
  const sy = Math.max(h * 0.58, cy + R + fs * 4);
  soundScreen(c, 8, sy, w - 16, h - sy - 4, f, V.amp, V.ghost, false);
  lab.setGauge(V.amp);
}

canvasLoop($('cv'), (c, w, h, dt) => {
  clock += dt;
  if (lab.view === 'string') drawString(c, w, h, dt);
  else if (lab.view === 'drum') drawDrum(c, w, h, dt);
  else drawVoice(c, w, h, dt);
});

// --- pointer: pull and release the string, drag the clamp, hit the drum, tap the throat ---------------------
const pos = (ev) => { const r = $('cv').getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
$('cv').addEventListener('pointerdown', (ev) => {
  const [x, y] = pos(ev);
  if (lab.view === 'drum') {
    const { cx, Rw, ry, topY, bodyH } = DG;
    if (Math.abs(x - cx) < Rw && y > topY - ry - Rw * 0.4 && y < topY + bodyH + ry) drumAction('hit');
    return;
  }
  if (lab.view === 'voice') { if (Math.hypot(x - VG.cx, y - VG.cy) < VG.R * 1.1) hum(); return; }
  const { xb, xc, ys, mp } = G;
  if (!S.secret && Math.abs(x - xc) < 22 && Math.abs(y - ys) < mp) { S.dragClamp = true; $('cv').setPointerCapture?.(ev.pointerId); return; }
  if (x > xb + 4 && x < xc - 4 && Math.abs(y - ys) < Math.max(34, mp * 1.1)) {
    stopVoice(0.04);
    S.pull = { x, y0: y, dy: 0 }; $('cv').setPointerCapture?.(ev.pointerId);
  }
});
$('cv').addEventListener('pointermove', (ev) => {
  const [x, y] = pos(ev), { xb, xn, mp } = G;
  if (S.dragClamp) {
    const L = clamp(Math.round((x - xb) / (xn - xb) * L0 * 4) / 4, LMIN, L0);
    if (L !== S.L) { const why = L < S.L ? 'shorter' : 'longer'; setString(() => { S.L = L; }); S.why = why; sfx.tick(); render(); }
  } else if (S.pull) { S.pull.x = x; S.pull.dy = clamp(y - S.pull.y0, -mp, mp); }
});
const release = () => {
  if (S.dragClamp) { S.dragClamp = false; return; }
  if (!S.pull) return;
  const d = Math.abs(S.pull.dy) / G.mp; S.pull = null;
  if (d < 0.12) pluck(S.strength);
  else { S.strength = Math.round(d * 100) / 100; pluck(S.strength); }
};
$('cv').addEventListener('pointerup', release);
$('cv').addEventListener('pointercancel', () => { S.pull = null; S.dragClamp = false; });

render();
</script>
</body>
