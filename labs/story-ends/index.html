  lab.setReadout(S.ended ? '🏁' : '…', t.eg.pill(S.n), '', '#f0a878');
  const st = S.ended ? t.eg.done : t.eg.st(S.n); lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' });
}
S.tileAt = [-9, -9];
render();
</script>
