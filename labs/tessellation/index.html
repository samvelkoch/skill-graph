// --- secret a: bees ---------------------------------------------------------------------------------------------
const BEE = [{ k: 'tri', n: 3, a0: -Math.PI / 2 }, { k: 'sq', n: 4, a0: -Math.PI / 4 }, { k: 'hex', n: 6, a0: 0 }];
const beeEdge = (n, A) => n * Math.sqrt(4 * A * Math.tan(Math.PI / n) / n); // perimeter of a regular n-gon with area A
function beeStats(A) { return BEE.map((b) => ({ ...b, P: beeEdge(b.n, A) })); }
function drawBees(ctx, w, h, t) {
  floor(ctx, w, h, false);
  const st = beeStats(S.area), f = Math.min(w / 335, h / 290), Apx = 3200 * f * f * (S.area / 100), maxP = 70, e = easeOut((t - S.secT) / 0.9);
  const barX = 18, barW = w - 36 - 74, cy = h * 0.3;
  const Rof = (b) => { const s = Math.sqrt(4 * Apx * Math.tan(Math.PI / b.n) / b.n); return s / (2 * Math.sin(Math.PI / b.n)); };
  const ly = cy + Rof(BEE[0]) * 0.5 + 16;
  st.forEach((b, i) => {
    const R = Rof(b), s = 2 * R * Math.sin(Math.PI / b.n), cx = w * (1 / 6 + i / 3);
    const pts = regPoly(cx, cy, R, b.n, b.a0), c = centroid(pts), col = COL[b.k][0];
    const p = drawPoly(ctx, pts, c[0], c[1], s / (2 * Math.tan(Math.PI / b.n)), col, { grout: 0 });
    ctx.save(); polyPath(ctx, p); ctx.setLineDash([7, 5]); ctx.lineDashOffset = -t * 18; ctx.lineWidth = 3; ctx.strokeStyle = '#ffd166'; ctx.stroke(); ctx.restore();
    pill(ctx, T[lang].shape[b.k], cx, ly, w, { size: 12 });
    // the edge, unrolled into a bar
    const by = h * 0.64 + i * h * 0.11, len = clamp01(b.P / maxP) * barW * e;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.06)'; rr(ctx, barX, by - 8, barW, 16, 8); ctx.fill();
    const g = ctx.createLinearGradient(0, by - 8, 0, by + 8); g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
    ctx.fillStyle = g; rr(ctx, barX, by - 8, Math.max(8, len), 16, 8); ctx.fill();
    ctx.restore();
    pill(ctx, `${fmt(b.P)} ${lang === 'ru' ? 'см' : 'cm'}`, barX + barW + 38, by, w, { size: 12.5, col: i === 2 ? '#ffd166' : '#fff' });
    if (i === 2) { ctx.save(); ctx.font = '16px system-ui, sans-serif'; ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText('🐝', barX + Math.max(8, len) - 22, by + 1); ctx.restore(); }
  });
}

// --- secret b: Escher's lizards ----------------------------------------------------------------------------------
function escherPath(ctx, ox, oy, s) {
  const { cx, cy, dx, dy } = S.esc;
  const q = (x0, y0, vx, vy, x1, y1) => ctx.quadraticCurveTo(2 * vx - (x0 + x1) / 2, 2 * vy - (y0 + y1) / 2, x1, y1);
  ctx.beginPath(); ctx.moveTo(ox, oy);
  q(ox, oy, ox + cx * s, oy + cy * s, ox + s, oy);                              // top: out
  q(ox + s, oy, ox + s + dx * s, oy + dy * s, ox + s, oy + s);                  // right: out
  q(ox + s, oy + s, ox + cx * s, oy + s + cy * s, ox, oy + s);                  // bottom: the same bump, moved down = in
  q(ox, oy + s, ox + dx * s, oy + dy * s, ox, oy);                              // left: the same bump, moved left = in
  ctx.closePath();
}
function drawEscher(ctx, w, h, t) {
  floor(ctx, w, h, false);
  const s = Math.min(w, h) * 0.34, ox = w / 2 - s / 2, oy = h / 2 - s / 2;
  S.geo = { ox, oy, s };
  const I = Math.ceil(w / s) + 2, J = Math.ceil(h / s) + 2;
  for (let j = -J; j <= J; j++) for (let i = -I; i <= I; i++) {
    const x = ox + i * s, y = oy + j * s;
    if (x > w + s || y > h + s || x < -2 * s || y < -2 * s) continue;
    escherPath(ctx, x, y, s);
    paintTile(ctx, [x - s * .3, y - s * .3, x + s * 1.3, y + s * 1.3], ((i + j) % 2 + 2) % 2 ? ['#6fd1b0', '#2f8a72'] : ['#f6c26a', '#c07a24'], 1);
    ctx.save(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + s * .36, y + s * .4, s * .065, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1a2230'; ctx.beginPath(); ctx.arc(x + s * .38, y + s * .41, s * .033, 0, TAU); ctx.fill(); ctx.restore();
  }
  escherPath(ctx, ox, oy, s); ctx.save(); ctx.lineWidth = 3; ctx.strokeStyle = '#ffd166'; ctx.stroke(); ctx.restore();
  const hs = [[ox + S.esc.cx * s, oy + S.esc.cy * s], [ox + s + S.esc.dx * s, oy + S.esc.dy * s]], pulse = 1 + 0.12 * Math.sin(t * 4);
  hs.forEach(([x, y]) => {
    ctx.save(); const gl = ctx.createRadialGradient(x, y, 2, x, y, 20); gl.addColorStop(0, 'rgba(255,230,140,.65)'); gl.addColorStop(1, 'rgba(255,230,140,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, 20, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#d99a10'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, Math.max(0, 8 * pulse), 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore();
  });
}

// --- the shell ---------------------------------------------------------------------------------------------------
const lab = shell({ key: 'tessellation', T, topics: TOPICS, views: ['corners', 'tile', 'borders'], onLang: render, onView: () => { S.sec = null; render(); } });
const secret = secretLab('tessellation', () => ({
  secrets: [{ emo: '🐝', title: T[lang].sec.bees[0], desc: T[lang].sec.bees[1] }, { emo: '🖼️', title: T[lang].sec.escher[0], desc: T[lang].sec.escher[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="secCor"><div class="tl-ask" id="corAsk"></div><div class="row2" style="margin-top:0"><div class="chips" id="corChips"></div></div><div class="row2" id="corAgainRow"><button class="chip tl-chip" data-act="c-again" id="corAgain"></button></div></div>
  <div id="secTile">
    <div class="row2" style="margin-top:0"><div class="card seg small" id="modeSeg"></div></div>
    <div id="tileOne"><div class="row2"><div class="chips" id="tileChips"></div></div><div class="row2"><button class="btn tl-btn" data-act="t-go" id="tileGo"></button></div></div>
    <div id="tileTwo"><p class="tl-note" id="mixPickNote"></p><div class="tl-yn" id="mixChips" style="flex-wrap:wrap"></div></div>
  </div>
  <div id="secBor"><div class="tl-note" id="bQ" style="color:#fff;font-weight:800"></div><div class="tl-opts" id="bOpts"></div><div class="row2"><button class="btn tl-btn" data-act="b-next" id="bNext"></button></div></div>
  <div id="secBees"><p class="tl-note" id="areaLbl"></p><input type="range" class="big tl-rng" id="areaIn" min="50" max="200" step="10"></div>
  <div id="secEsc"><div class="row2" style="margin-top:0"><button class="chip tl-chip" data-act="e-reset" id="escReset"></button></div></div>
  <div class="row2" id="secChips"></div>`;
const cv = $('cv');

canvasLoop(cv, (ctx, w, h, dt, t) => {
  if (S.sec === 'bees') drawBees(ctx, w, h, t);
  else if (S.sec === 'escher') drawEscher(ctx, w, h, t);
  else if (lab.view === 'corners') drawCorners(ctx, w, h, t);
  else if (lab.view === 'tile') drawTileView(ctx, w, h, t);
  else drawBorders(ctx, w, h, t);
});

// --- interaction --------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const pos = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec !== 'escher') return;
  const [px, py] = pos(ev), { ox, oy, s } = S.geo, e = S.esc;
  const dc = Math.hypot(px - (ox + e.cx * s), py - (oy + e.cy * s)), dd = Math.hypot(px - (ox + s + e.dx * s), py - (oy + e.dy * s));
  if (Math.min(dc, dd) > 30) return;
  S.drag = dc <= dd ? 'c' : 'd'; cv.setPointerCapture(ev.pointerId); ev.preventDefault();
});
cv.addEventListener('pointermove', (ev) => {
  if (!S.drag) return;
  const [px, py] = pos(ev), { ox, oy, s } = S.geo, e = S.esc;
  if (S.drag === 'c') { e.cx = clamp((px - ox) / s, 0.15, 0.85); e.cy = clamp((py - oy) / s, -0.45, 0.45); }
  else { e.dx = clamp((px - ox - s) / s, -0.45, 0.45); e.dy = clamp((py - oy) / s, 0.15, 0.85); }
});
const endDrag = () => { S.drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'c-shape') { S.sh1 = +v; if (S.rev1[SHAPES[S.sh1].k]) S.t1 = now(); sfx.click(); }
  else if (act === 'c-pred') { const k = SHAPES[S.sh1].k; S.pred1[k] = v; S.rev1[k] = true; S.t1 = now(); (v === (SH[k].fit ? 'yes' : 'no') ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'c-again') { S.t1 = now(); sfx.click(); }
  else if (act === 't-mode') { S.mode2 = v; S.t2 = null; S.fin2 = false; S.pick2 = null; sfx.click(); }
  else if (act === 't-shape') { S.sh2 = +v; S.t2 = null; S.fin2 = false; sfx.click(); }
  else if (act === 't-go') { S.t2 = now(); S.fin2 = false; sfx.snap(); showStage(); }
  else if (act === 't-pick') { S.pick2 = v; S.t2 = now(); S.fin2 = false; (v === 'sq' ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'b-pick') { const bb = S.b; if (bb.pick !== null) return; bb.pick = +v; bb.t = now(); const o = bb.opts[bb.pick], ok = o[0] === bb.ans[0] && o[1] === bb.ans[1]; if (ok) bb.score++; (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'b-next') { const bb = S.b; if (bb.pick === null) return; if (bb.end) S.b = newRound(0, 0); else if (bb.r >= 3) bb.end = true; else S.b = newRound(bb.r + 1, bb.score); sfx.click(); }
  else if (act === 'e-reset') { S.esc = { cx: 0.42, cy: -0.3, dx: 0.3, dy: 0.55 }; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === v ? null : v; S.secT = now(); sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => { if (ev.target.id === 'areaIn') { S.area = +ev.target.value; render(); } });

// --- one render per change: controls, readout and the state card ----------------------------------------------------
const nm = (t, k) => t.shape[k];
function drawOptCanvases() {
  document.querySelectorAll('#bOpts canvas').forEach((c) => {
    const o = S.b.opts[+c.dataset.i], ctx = c.getContext('2d');
    ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 56, 56); drawCell(ctx, 28, 28, 48, o[0], o[1], 1);
  });
}
function render() {
  const t = T[lang], v = lab.view, sec = secret.unlocked() ? S.sec : null;
  S.sec = sec;
  const show = (id, on) => { $(id).hidden = !on; };
  show('secCor', !sec && v === 'corners'); show('secTile', !sec && v === 'tile'); show('secBor', !sec && v === 'borders');
  show('secBees', sec === 'bees'); show('secEsc', sec === 'escher');
  cv.style.touchAction = sec === 'escher' ? 'none' : '';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip tl-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-v="${k}">${open ? `${emo} ${esc(t.sec[k === 'bees' ? 'bees' : 'escher'][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('bees', '🐝') + sc('escher', '🖼️');
  if (sec === 'bees') return renderBees(t);
  if (sec === 'escher') return renderEscher(t);
  if (v === 'corners') renderCorners(t); else if (v === 'tile') renderTile(t); else renderBorders(t);
}

function renderCorners(t) {
  const sp = SHAPES[S.sh1], k = sp.k, rev = !!S.rev1[k], c = t.c, a = sp.a, per = sp.per, gap = 360 - per * a;
  lab.setGlow('rgba(80, 140, 230, .28)');
  $('corChips').innerHTML = SHAPES.map((x, i) => `<button class="chip tl-chip ${i === S.sh1 ? 'on' : ''}" data-act="c-shape" data-v="${i}">${esc(nm(t, x.k))} ${x.a}°</button>`).join('');
  $('corAsk').innerHTML = rev ? '' : `<p class="tl-q">${esc(c.ask)}</p><div class="tl-yn"><button class="btn tl-btn" data-act="c-pred" data-v="yes">${esc(c.yes)}</button><button class="btn tl-btn ghost" data-act="c-pred" data-v="no">${esc(c.no)}</button></div><div style="height:12px"></div>`;
  $('corAgainRow').hidden = !rev; $('corAgain').textContent = c.again;
  if (!rev) {
    lab.setReadout('?', c.sub(nm(t, k), a), '', '#5b8fe0');
    lab.setState({ emo: '🤔', title: c.ask, lead: c.lead(nm(t, k), a), body: '', extra: '' });
    lab.setFacts([]); return;
  }
  const right = S.pred1[k] === (sp.fit ? 'yes' : 'no');
  lab.setReadout(`${per} × ${a}° = ${per * a}°`, sp.fit ? c.okSub : c.gapSub(gap), sp.fit ? c.pillOk : c.pillNo, sp.fit ? '#2fbf84' : '#e5484d');
  lab.setState({ emo: sp.fit ? '✅' : '🕳️', title: right ? t.right : t.wrong, lead: sp.fit ? c.okLead(per, a) : c.noLead(per, a, gap), body: '', extra: '' });
  lab.setFacts(SHAPES.every((x) => S.rev1[x.k]) ? [{ emo: '💡', text: t.facts.corners, src: FACT_SRC.corners }] : []);
}

function renderTile(t) {
  const tt = t.t, mix = S.mode2 === 'two', sp = SHAPES[S.sh2];
  lab.setGlow('rgba(230, 170, 70, .26)');
  $('modeSeg').innerHTML = [['one', tt.one], ['two', tt.two]].map(([m, l]) => `<button data-act="t-mode" data-v="${m}" class="${m === S.mode2 ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('tileOne').hidden = mix; $('tileTwo').hidden = !mix;
  lab.setFacts([{ emo: '💡', text: t.facts.tile, src: FACT_SRC.tile }]);
  if (!mix) {
    $('tileChips').innerHTML = SHAPES.map((x, i) => `<button class="chip tl-chip ${i === S.sh2 ? 'on' : ''}" data-act="t-shape" data-v="${i}">${esc(nm(t, x.k))}</button>`).join('');
    $('tileGo').textContent = S.t2 === null ? tt.go : tt.again;
    const a = sp.a, per = sp.per;
    if (!S.fin2) {
      lab.setReadout(`${a}°`, tt.sub(nm(t, sp.k)), '', '#e0a940');
      lab.setState({ emo: '🧩', title: S.t2 === null ? tt.idleTitle : nm(t, sp.k), lead: S.t2 === null ? tt.idleLead : '', body: '', extra: '' });
    } else if (sp.fit) {
      lab.setReadout('360°', `${per} × ${a}°`, tt.pillOk, '#2fbf84');
      lab.setState({ emo: '✅', title: tt.okTitle(nm(t, sp.k)), lead: tt.okLead(per, a), body: '', extra: '' });
    } else {
      lab.setReadout(`${per * a}°`, `${per} × ${a}° ≠ 360°`, tt.pillNo, '#e5484d');
      lab.setState({ emo: '🕳️', title: tt.noTitle(nm(t, sp.k)), lead: tt.noLead(per, a), body: '', extra: '' });
    }
    return;
  }
  const pk = S.pick2, picks = ['hex', 'sq', 'tri'];
  $('mixPickNote').textContent = tt.mixPick;
  $('mixChips').innerHTML = picks.map((k) => `<button class="chip tl-chip ${pk === k ? 'on' : ''}" data-act="t-pick" data-v="${k}">${esc(nm(t, k))}</button>`).join('');
  if (!pk) {
    lab.setReadout('135° + 135° + ?', '= 360°', '', '#e0a940');
    lab.setState({ emo: '🤔', title: tt.mixTitle, lead: tt.mixLead, body: '', extra: '' });
    return;
  }
  const a = SH[pk].a, sum = 270 + a;
  lab.setReadout(`${sum}°`, `135° + 135° + ${a}°`, sum === 360 ? tt.pillFit : sum < 360 ? tt.pillGap : tt.pillOver, sum === 360 ? '#2fbf84' : '#e5484d');
  lab.setState(sum === 360 ? { emo: '✅', title: tt.mixOk, lead: tt.mixOkLead, body: '', extra: '' }
    : { emo: '🕳️', title: t.wrong, lead: sum < 360 ? tt.mixLow(a) : tt.mixHigh(a), body: '', extra: '' });
}

function renderBorders(t) {
  const b = S.b, bt = t.b, answered = b.pick !== null, mv = bt.moves[ROUNDS[b.r]];
  lab.setGlow('rgba(90, 110, 220, .28)');
  lab.setFacts([{ emo: '💡', text: t.facts.borders, src: FACT_SRC.borders }]);
  $('bQ').textContent = bt.q;
  $('bOpts').innerHTML = b.opts.map((o, i) => {
    const isAns = o[0] === b.ans[0] && o[1] === b.ans[1];
    const cls = answered ? (isAns ? 'good' : i === b.pick ? 'bad' : '') : '';
    return `<button class="tl-opt ${cls}" data-act="b-pick" data-v="${i}" ${answered ? 'disabled' : ''} aria-label="${i + 1}"><canvas width="112" height="112" data-i="${i}"></canvas></button>`;
  }).join('');
  drawOptCanvases();
  $('bNext').hidden = !answered; $('bNext').textContent = b.end ? bt.again : b.r >= 3 ? bt.result : bt.next;
  if (b.end) {
    lab.setReadout(`${b.score}/4`, bt.sub(b.score), '', '#6b7be8');
    lab.setState({ emo: '🏆', title: bt.endTitle(b.score), lead: bt.endLead, body: '', extra: '' });
    $('bNext').hidden = false; return;
  }
  lab.setReadout(`${b.r + 1}/4`, bt.sub(b.score), '', '#6b7be8');
  if (!answered) lab.setState({ emo: '🎀', title: bt.round(b.r + 1), lead: bt.lead, body: '', extra: '' });
  else {
    const ok = b.opts[b.pick][0] === b.ans[0] && b.opts[b.pick][1] === b.ans[1];
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: ok ? bt.rightLead(mv) : bt.wrongLead(mv), body: '', extra: '' });
  }
}

function renderBees(t) {
  const s = t.sec, A = S.area, st = beeStats(A), [p3, p4, p6] = st.map((x) => x.P);
  lab.setGlow('rgba(240, 190, 60, .26)');
  $('areaLbl').textContent = `${s.area}: ${A} ${lang === 'ru' ? 'см²' : 'cm²'}`;
  const inp = $('areaIn'); if (+inp.value !== A) inp.value = A;
  lab.setReadout(s.bVal(A), s.bSub, s.bPill, '#e0b050');
  lab.setState({ emo: '🐝', title: s.bTitle, lead: s.bLead(A, p3, p4, p6), body: s.bBody(Math.round((1 - p6 / p4) * 100), Math.round((1 - p6 / p3) * 100)), extra: '' });
  lab.setFacts([]);
}
function renderEscher(t) {
  const s = t.sec;
  lab.setGlow('rgba(80, 200, 160, .26)'); $('escReset').textContent = s.reset;
  lab.setReadout(s.eVal, s.eSub, '', '#4fc3a1');
  lab.setState({ emo: '🖼️', title: s.eTitle, lead: s.eLead, body: '', extra: '' });
  lab.setFacts([]);
}
render();
</script>
