    COPIES.forEach(([tx, ty], i) => {
      const t0 = .5 + i * .12, q = clamp((tr - t0) / .6, 0, 1); if (q <= 0) return;
      const e = ease(q), x = lerp(DX[2], tx, e), y = lerp(118, ty, e) - 30 * Math.sin(Math.PI * q);
      c.save(); c.translate(x, y); c.scale(.5 + .5 * back(q), .5 + .5 * back(q)); phoneObj(c, 0, 0, 16, 26, (i % 3 - 1) * .15, true); c.restore();
    });
  }
  // Pip and the friend
  const px = cur3(), moving = Math.abs(px - S.walk3.to) > .5;
  const right = rev && ((j === 0 && an === 'no') || (j > 0 && an === 'ask'));
  const asked = rev && an === 'ask';
  let fm = 'smile', heart = false;
  if (rev && j > 0) { if (asked) { fm = 'smile'; heart = true; } else fm = 'sad'; }
  kid(c, 276, 262, 17, '#6fa8ee', { mood: fm, hair: 'cap', hc: '#2d4f8a', look: -.5, tear: fm === 'sad' });
  if (heart) emo(c, '❤️', 276, 218 - 3 * Math.sin(t * 3), 18);
  if (rev && j > 0 && !asked) emo(c, '💢', 296, 226, 16);
  let by = moving ? Math.abs(Math.sin(t * 11)) * 4 : 0;
  if (S.j >= 3) by = Math.abs(Math.sin(t * 5)) * 7;
  kid(c, px, 262, 17, '#f2b441', { mood: rev ? (right ? 'grin' : 'open') : S.j >= 3 ? 'grin' : 'smile', hair: 'tuft', hc: '#b5651d', by, look: moving ? 1 : 0 });
  phoneObj(c, px + 24, 232 - by, 22, 36, .2, true);
  c.restore();
}

canvasLoop($('cv'), (c, w, h, dt, tm) => {
  const t = now();
  if (S.sec || lab.view === 'how') drawDuo(c, w, h, dt, t);
  else if (lab.view === 'photo') drawPhoto(c, w, h, dt, t);
  else drawAsk(c, w, h, dt, t);
});

// --- controls ----------------------------------------------------------------------------------------------
const btn = (act, label, extra = '', cls = '') => `<button class="btn ${cls}" data-act="${act}" ${extra}>${esc(label)}</button>`;
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, t = T[lang];
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null;
    else {
      S.sec = k; sfx.click();
      if (k === 'a') S.sa = { step: 0, at: 0, pick: null }; else S.sb = { r: 0, pick: [null, null], at: 0 };
    }
    return render();
  }
  if (act === 'ans') { // view 1
    const i = S.i; if (S.ans[i] !== undefined || !S.ready) return;
    S.ans[i] = b.dataset.v; S.revT[i] = now() + .15;
    const ok = SP[i].ask === (b.dataset.v === 'ask'); (ok ? sfx.good : sfx.bad)(); setTimeout(showStage, 200);
  } else if (act === 'next') {
    S.i++; sfx.click(); if (S.i < 7) startWalk(S.i);
  } else if (act === 'again') { S.i = 0; S.ans = []; S.revT = []; startWalk(0); sfx.click(); }
  else if (act === 'chip') { const i = S.slots.indexOf(null); if (i >= 0 && !S.slots.includes(b.dataset.id) && (S.hph === 'build')) { S.slots[i] = b.dataset.id; sfx.tick(); } }
  else if (act === 'slot') { const i = +b.dataset.s; if (S.hph === 'build' && !S.lock[i]) { S.slots[i] = null; sfx.tick(); } }
  else if (act === 'send') {
    if (S.slots.includes(null)) return;
    S.att++; const wrong = S.slots.map((id, i) => id !== CORRECT[i]);
    S.lock = wrong.map((x) => !x);
    if (!wrong.some(Boolean)) { S.hph = 'good'; sfx.good(); }
    else if (S.att >= 2) { S.slots = CORRECT.slice(); S.lock = [true, true, true]; S.hph = 'shown'; sfx.snap(); }
    else { S.hph = 'bad'; sfx.bad(); }
    setTimeout(showStage, 100);
  } else if (act === 'retry') { S.slots = S.slots.map((id, i) => (S.lock[i] ? id : null)); S.hph = 'build'; sfx.click(); }
  else if (act === 'tono') { S.hph = 'no'; S.hrep = []; sfx.click(); }
  else if (act === 'rep') {
    const r = +b.dataset.r;
    if (r === 1) { S.hph = 'end'; sfx.good(); } else { if (!S.hrep.includes(r)) S.hrep.push(r); sfx.bad(); }
  } else if (act === 'hagain') { S.slots = [null, null, null]; S.lock = [false, false, false]; S.att = 0; S.hph = 'build'; S.hrep = []; sfx.click(); }
  else if (act === 'ans3') { // view 3
    const j = S.j; if (S.a3[j] !== undefined || !S.ready3) return;
    S.a3[j] = b.dataset.v; S.r3[j] = now() + .15;
    const ok = (j === 0) === (b.dataset.v === 'no'); (ok ? sfx.good : sfx.bad)(); setTimeout(showStage, 200);
  } else if (act === 'next3') { S.j++; sfx.click(); if (S.j < 3) startWalk3(S.j); }
  else if (act === 'again3') { S.j = 0; S.a3 = []; S.r3 = []; startWalk3(0); sfx.click(); }
  else if (act === 'saask') { S.sa = { step: 1, at: now(), pick: null }; sfx.good(); clearTimeout(S.sat); S.sat = setTimeout(() => { if (S.sec === 'a' && S.sa.step === 1) { S.sa.step = 2; sfx.tick(); render(); } }, 3200); }
  else if (act === 'sapick') { S.sa.pick = +b.dataset.p; S.sa.step = 3; (S.sa.pick === 0 ? sfx.good : sfx.bad)(); }
  else if (act === 'saagain') { S.sa = { step: 0, at: 0, pick: null }; sfx.click(); }
  else if (act === 'sbpick') { const r = S.sb.r; if (S.sb.pick[r] === null) { S.sb.pick[r] = +b.dataset.p; (S.sb.pick[r] < 2 ? sfx.good : sfx.bad)(); } }
  else if (act === 'sbnext') { S.sb.r++; sfx.click(); }
  else if (act === 'sbagain') { S.sb = { r: 0, pick: [null, null], at: 0 }; sfx.click(); }
  render();
});

// --- render ------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec || v;
  $('cAsk').style.display = !sec && v === 'ask' ? '' : 'none';
  $('cHow').style.display = !sec && v === 'how' ? '' : 'none';
  $('cPhoto').style.display = !sec && v === 'photo' ? '' : 'none';
  $('cSa').style.display = sec === 'a' ? '' : 'none';
  $('cSb').style.display = sec === 'b' ? '' : 'none';
  const open = secret.unlocked();
  $('secRow').innerHTML = ['a', 'b'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'a' ? '🔄' : '🎒'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setFacts(t.facts[v === 'how' ? 'none' : v === 'ask' ? 'ask' : 'photo'] || []);
  if (sec === 'a') return renderSa(t);
  if (sec === 'b') return renderSb(t);
  if (v === 'ask') renderAsk(t); else if (v === 'how') renderHow(t); else renderPhoto(t);
}

function renderAsk(t) {
  const a = t.ask, i = S.i, end = i >= 7;
  lab.setGlow('rgba(242, 180, 65, .22)');
  if (end) {
    const k = SP.filter((s, n) => s.ask === (S.ans[n] === 'ask')).length;
    $('cAsk').innerHTML = `<div class="pm-one">${btn('again', t.again)}</div>`;
    lab.setReadout(`${k}/7`, t.unit, '', '#f2b441');
    return lab.setState({ emo: '🏆', title: a.end(k), lead: a.endLead, body: '', extra: '' });
  }
  const an = S.ans[i], sit = a.sits[i], sp = SP[i];
  if (an === undefined) {
    $('cAsk').innerHTML = `<p class="pm-q">${esc(sit.q)}</p><div class="pm-two">${btn('ans', a.btnAsk, `data-v="ask" ${S.ready ? '' : 'disabled'}`)}${btn('ans', a.btnGo, `data-v="go" ${S.ready ? '' : 'disabled'}`)}</div>`;
    lab.setReadout(`${i + 1}/7`, t.unit, '', '#f2b441');
    return lab.setState({ emo: '🤔', title: a.title, lead: sit.q, body: '', extra: '' });
  }
  const ok = sp.ask === (an === 'ask');
  let lead;
  if (sp.ask) lead = an === 'ask' ? sit.say : sit.bad; else lead = sit.free;
  const done = S.ans.filter((x, n) => x !== undefined && SP[n].ask === (x === 'ask')).length;
  $('cAsk').innerHTML = `<p class="pm-q">${esc(sit.q)}</p><div class="pm-one">${btn('next', i === 6 ? a.fin : t.next)}</div>`;
  lab.setReadout(`${i + 1}/7`, t.unit, ok ? '✓' : '', '#f2b441');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : (sp.ask ? a.noAsk : a.noGo), lead, body: sit.why, extra: '' });
}

function renderHow(t) {
  const h = t.how, ph = S.hph; lab.setGlow('rgba(95, 168, 160, .24)');
  const lbl = (id) => `${EMO[id]} ${h.pool[id]}`;
  if (ph === 'no' || ph === 'end') {
    const sel = S.hrep, end = ph === 'end';
    $('cHow').innerHTML = `<div class="pm-opts">${h.replies.map((r, n) => `<button class="pm-opt ${sel.includes(n) ? 'bad' : ''} ${end && n === 1 ? 'good' : ''}" data-act="rep" data-r="${n}" ${end || sel.includes(n) ? 'disabled' : ''}>${esc(r)}</button>`).join('')}</div>${end ? `<div class="pm-one">${btn('hagain', t.again)}</div>` : ''}`;
    lab.setReadout(end ? '✓' : '?', '', '', '#5fa8a0');
    if (end) return lab.setState({ emo: '✅', title: t.right, lead: h.rightLead, body: '', extra: '' });
    return lab.setState({ emo: '🙅', title: h.noTitle, lead: sel.length ? h.wrongLead : h.noLead, body: '', extra: '' });
  }
  const n = S.slots.filter(Boolean).length, finished = ph === 'good' || ph === 'shown';
  const slots = `<div class="pm-slots">${S.slots.map((id, i) => {
    const cls = ph === 'bad' || finished ? (S.lock[i] ? 'ok' : 'bad') : '';
    return `<div class="pm-slot ${cls}" data-act="slot" data-s="${i}" role="button"><span class="l">${i + 1}. ${esc(h.slots[i])}</span><span class="c">${id ? esc(lbl(id)) : ''}</span></div>`;
  }).join('')}</div>`;
  const pool = `<div class="pm-pool">${POOL.map((id) => `<button class="chip" data-act="chip" data-id="${id}" ${S.slots.includes(id) || ph !== 'build' ? 'disabled' : ''}>${esc(lbl(id))}</button>`).join('')}</div>`;
  let act = '';
  if (ph === 'build') act = `<div class="pm-one">${btn('send', h.send, n < 3 ? 'disabled' : '')}</div>`;
  else if (ph === 'bad') act = `<div class="pm-one">${btn('retry', h.retry)}</div>`;
  else act = `<div class="pm-one">${btn('tono', h.toNo)}</div>`;
  $('cHow').innerHTML = `<p class="pm-q">${esc(h.scene)}</p>${slots}${ph === 'build' ? pool : ''}${act}`;
  lab.setReadout(finished ? '✓' : `${n}/3`, '', '', '#5fa8a0');
  if (ph === 'build') return lab.setState({ emo: '🧩', title: h.bTitle, lead: h.bLead, body: h.scene, extra: '' });
  if (ph === 'bad') {
    const react = S.slots.includes('x') || S.slots.includes('y') ? h.grab : S.slots.includes('z') ? h.beg : h.order;
    return lab.setState({ emo: '😕', title: react, lead: h.badLead, body: '', extra: '' });
  }
  lab.setState({ emo: '😊', title: ph === 'good' ? t.right : h.shownTitle, lead: h.goodLead, body: '', extra: '' });
}

function renderPhoto(t) {
  const p = t.photo, j = S.j, end = j >= 3; lab.setGlow('rgba(224, 160, 80, .24)');
  if (end) {
    const k = [0, 1, 2].filter((n) => (n === 0) === (S.a3[n] === 'no')).length;
    $('cPhoto').innerHTML = `<div class="pm-one">${btn('again3', t.again)}</div>`;
    lab.setReadout(`${k}/3`, '', '', '#e0a050');
    return lab.setState({ emo: '🏆', title: p.end(k), lead: p.endLead, body: '', extra: '' });
  }
  const an = S.a3[j], dots = [0, 1, 2].map((n) => (n < j ? '●' : n === j ? '◉' : '○')).join(' ');
  if (an === undefined) {
    $('cPhoto').innerHTML = `<p class="pm-q">${esc(p.qs[j])}</p><div class="pm-two">${btn('ans3', p.btnAsk, `data-v="ask" ${S.ready3 ? '' : 'disabled'}`)}${btn('ans3', p.btnNo, `data-v="no" ${S.ready3 ? '' : 'disabled'}`)}</div>`;
    lab.setReadout(`${j + 1}/3`, dots, '', '#e0a050');
    return lab.setState({ emo: '🤔', title: p.title, lead: p.qs[j], body: j === 0 ? p.body0 : '', extra: '' });
  }
  const ok = (j === 0) === (an === 'no');
  $('cPhoto').innerHTML = `<p class="pm-q">${esc(p.qs[j])}</p><div class="pm-one">${btn('next3', j === 2 ? p.fin : t.next)}</div>`;
  lab.setReadout(`${j + 1}/3`, dots, ok ? '✓' : '', '#e0a050');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : (j === 0 ? p.noNo : p.noAsk), lead: p.why[j], body: '', extra: '' });
}

function renderSa(t) {
  const a = t.sa, st = S.sa.step; lab.setGlow('rgba(95, 168, 160, .24)');
  lab.setReadout(st === 3 ? (S.sa.pick === 0 ? '✓' : '·') : '?', '', '', '#5fa8a0');
  let html = '';
  if (st === 0) html = `<div class="pm-one">${btn('saask', a.ask)}</div>`;
  else if (st === 1) html = `<div class="pm-one">${btn('x', a.playing, 'disabled')}</div>`;
  else if (st === 2) html = `<div class="pm-opts">${a.opts.map((o, n) => `<button class="pm-opt" data-act="sapick" data-p="${n}">${esc(o)}</button>`).join('')}</div>`;
  else html = `<div class="pm-opts">${a.opts.map((o, n) => `<button class="pm-opt ${n === 0 ? 'good' : n === S.sa.pick ? 'bad' : ''}" disabled>${esc(o)}</button>`).join('')}</div><div class="pm-one">${btn('saagain', a.again || t.again)}</div>`;
  $('cSa').innerHTML = html;
  if (st === 0) lab.setState({ emo: '🎾', title: a.t0, lead: a.l0, body: '', extra: '' });
  else if (st === 1) lab.setState({ emo: '😀', title: a.t1, lead: a.l1, body: '', extra: '' });
  else if (st === 2) lab.setState({ emo: '✋', title: a.t2, lead: a.l2, body: '', extra: '' });
  else lab.setState(S.sa.pick === 0 ? { emo: '✅', title: a.okT, lead: a.okL, body: '', extra: '' } : { emo: '🤔', title: a.noT, lead: a.noL, body: '', extra: '' });
}

function renderSb(t) {
  const b = t.sb, s = S.sb, r = s.r, end = r >= 2; lab.setGlow('rgba(217, 130, 95, .24)');
  if (end) {
    $('cSb').innerHTML = `<div class="pm-one">${btn('sbagain', t.again)}</div>`;
    lab.setReadout('✓', '', '', '#d9825f');
    return lab.setState({ emo: '🎒', title: b.endT, lead: b.endL, body: '', extra: '' });
  }
  const rd = b.rounds[r], pk = s.pick[r];
  $('cSb').innerHTML = `<p class="pm-q">${esc(rd.q)}</p><div class="pm-opts">${rd.opts.map((o, n) => `<button class="pm-opt ${pk !== null && n < 2 ? 'good' : ''} ${pk === n && n === 2 ? 'bad' : ''}" data-act="sbpick" data-p="${n}" ${pk !== null ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>${pk !== null ? `<div class="pm-one">${btn('sbnext', t.next)}</div>` : ''}`;
  lab.setReadout(b.round(r + 1), '', '', '#d9825f');
  if (pk === null) return lab.setState({ emo: '🎒', title: b.t0, lead: b.lead, body: rd.q, extra: '' });
  lab.setState(pk < 2 ? { emo: '😊', title: b.good, lead: pk === 0 ? b.fyes : b.fno, body: b.lead, extra: '' } : { emo: '😢', title: b.hurt, lead: b.fbad, body: b.lead, extra: '' });
}
render();
</script>
</body>
