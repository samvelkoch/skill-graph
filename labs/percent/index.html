const MINT = '#3FBF86', MINT2 = '#7EE0B0', BLUE = '#5B8DEF', GOLD = '#FFC94A', PINK = '#FF8FB1', ORANGE = '#FF9F5A', PAPER = '#FFF6E6';
const now = () => performance.now() / 1000;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const easeIO = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const backOut = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const nf = (x) => String(Math.round(x * 100) / 100).replace('.', lang === 'en' ? '.' : ',');
const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };
// rounded rectangle path; the radius can never go negative (arc/roundRect would throw and freeze the loop)
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2))); };
function stageBg(c, w, h) {
  const g = c.createLinearGradient(0, 0, w * 0.4, h);
  g.addColorStop(0, '#1C2150'); g.addColorStop(1, '#2A3170');
  rr(c, 0, 0, w, h, 20); c.fillStyle = g; c.fill();
  rr(c, 0.5, 0.5, w - 1, h - 1, 20); c.strokeStyle = 'rgba(130,145,190,.28)'; c.lineWidth = 1; c.stroke();
}
// dark text pill, clamped inside the canvas
function pill(c, txt, x, y, o = {}) {
  c.save(); c.globalAlpha = o.a ?? 1;
  c.font = o.font || '800 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const ph = o.h || 26, pw = c.measureText(txt).width + (o.px ?? 20), x0 = clamp(x - pw / 2, 6, (o.W || 1e9) - pw - 6);
  rr(c, x0, y - ph / 2, pw, ph, ph / 2); c.fillStyle = o.bg || 'rgba(10,12,30,.82)'; c.fill();
  if (o.border) { c.strokeStyle = o.border; c.lineWidth = 1.5; c.stroke(); }
  c.fillStyle = o.fg || '#fff'; c.fillText(txt, x0 + pw / 2, y + 1);
  c.restore();
  return { x0, pw };
}
function emo(c, s, x, y, size) {
  c.save(); c.globalAlpha = 1; c.fillStyle = '#fff'; c.font = `${size}px Nunito, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s, x, y); c.restore();
}

// --- the 100-grid: tiles fill one by one ----------------------------------------------------------------------
const READ = [...Array(100).keys()];
const DIAG = [...READ].sort((a, b) => ((a / 10 | 0) + a % 10) - ((b / 10 | 0) + b % 10) || a - b);
const G = { n: 0, cnt: 0, shown: 0, ord: READ, rank: READ, rate: 40, t: new Array(100).fill(-9), hiT: -1, doneT: 0 };
const rankOf = (ord) => { const r = new Array(100); ord.forEach((i, k) => { r[i] = k; }); return r; };
function resetGrid(ord = READ) { Object.assign(G, { n: 0, cnt: 0, shown: 0, ord, rank: rankOf(ord), hiT: -1, doneT: 0 }); }
function fillTo(n, rate = 40) { G.n = n; G.rate = rate; if (n < G.cnt) { G.cnt = n; G.shown = n; } }
function stepGrid(dt, time) {
  if (G.shown < G.n) {
    G.shown = Math.min(G.n, G.shown + dt * G.rate);
    const to = G.shown >= G.n ? G.n : Math.floor(G.shown);
    for (let k = G.cnt; k < to; k++) { G.t[G.ord[k]] = time; if ((k + 1) % 5 === 0) sfx.tick(); }
    G.cnt = Math.max(G.cnt, to);
  }
}
function drawGrid(c, w, h, time, y0, free) {
  const t = T[lang], g = S.g, bot = g.q === 1 && !free ? 82 : 56;

  const want = (S.cardH ? S.cardH + 18 : 12);
  S.yo = S.yo ? S.yo + (want - S.yo) * Math.min(1, dt * 10) : want;
  if (v === 'grid' && !sec) {
    stepGrid(dt, time);
    if (G.n > 0 && G.cnt >= G.n && !(G.doneT > 0)) G.doneT = time;
    if (G.cnt < G.n) G.doneT = 0;
    if (S.g.q === 1 && S.g.ans !== null && G.cnt >= 9 && G.hiT < 0) G.hiT = time + 0.25;
    drawGrid(c, w, h, time, S.yo, free);
  } else if (sec === 'survey') drawSurvey(c, w, h, time);
  else if (sec === 'century') drawCentury(c, w, h, time);
  else if (v === 'battery') (S.b.q === 0 ? drawBatteries : drawPlant)(c, w, h, time, S.yo);
  else if (v === 'build') drawBuild(c, w, h, time, S.yo);
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------------
// on a phone the question sits on top of the scene, but the answer may need scrolling: bring the stage into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function startGridQuestion() {
  const q = S.g.q; resetGrid(q === 2 ? DIAG : READ);
  if (q === 3) fillTo(S.free, 400);
}
function answer(i) {
  const v = lab.view;
  if (v === 'grid') {
    const g = S.g; if (g.ans !== null) return;
    g.ans = i; g.any = true; G.doneT = 0;
    if (g.q === 0) fillTo(24); else if (g.q === 1) fillTo(9, 30); else fillTo(100, 80);
    (i === RIGHT.g[g.q] ? sfx.good : sfx.bad)();
  } else if (v === 'battery') {
    const B = S.b; if (B.ans !== null) return;
    B.ans = i; B.any = true; B.rt = now(); (i === RIGHT.b[B.q] ? sfx.good : sfx.bad)();
  } else if (v === 'build') {
    const P = S.p; if (P.ans !== null) return;
    P.ans = i; P.any = true; P.rt = now(); (i === RIGHT.c ? sfx.good : sfx.bad)();
  }
  showStage(); render();
}
function next() {
  const v = lab.view; sfx.click();
  if (v === 'grid') {
    const g = S.g; if (g.q === 3) return;
    g.q++; g.ans = null; startGridQuestion();
  } else if (v === 'battery') {
    const B = S.b; B.ans = null; B.q = B.q === 0 ? 1 : 0;
  } else if (v === 'build') {
    Object.assign(S.p, { ri: 0, blocks: [], ok: false, bad: null, ans: null });
  }
  render();
}
askEl.addEventListener('click', (ev) => {
  const o = ev.target.closest('.ob'); if (o) return answer(+o.dataset.i);
  if (ev.target.closest('[data-act=next]')) next();
});
$('sl').addEventListener('input', () => { S.free = +$('sl').value; fillTo(S.free, 400); render(); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, P = S.p;
  if (act === 'again') { S.g = { q: 0, ans: null, any: S.g.any }; startGridQuestion(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.secAt = now(); sfx.click();
  } else if (act === 'blk') {
    if (P.ok) return;
    const k = +b.dataset.k;
    if (pctOf() + k > 100) { sfx.bad(); return; }
    P.blocks.push({ k, at: now() }); P.bad = null; sfx.snap();
  } else if (act === 'undo') { if (P.ok || !P.blocks.length) return; P.blocks.pop(); P.bad = null; sfx.click(); }
  else if (act === 'main') {
    if (P.ok) { P.ri++; P.blocks = []; P.ok = false; P.bad = null; P.ans = null; sfx.click(); }
    else if (P.blocks.length) {
      const tot = pctOf();
      if (tot === ROUNDS[P.ri][0]) { P.ok = true; P.bad = null; P.any = true; sfx.good(); } else { P.bad = tot; sfx.bad(); }
    }
  }
  render();
});
$('cv').addEventListener('pointerdown', () => { if (lab.view === 'grid' && S.sec === 'survey') S.secAt = now(); });

// --- one render per change: controls, readout and the state card ------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = v === 'grid' ? S.sec : null, free = v === 'grid' && S.g.q === 3 && !sec;
  document.body.dataset.v = sec ? 'sec' : free ? 'free' : v;
  $('secGrid').style.display = v === 'grid' ? '' : 'none';
  $('secBuild').style.display = v === 'build' ? '' : 'none';
  if (v === 'grid') renderGrid(t, sec, free); else if (v === 'battery') renderBattery(t); else renderBuild(t);
}
resetGrid();
render();
</script>
</body>
