$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), v = lab.view;
  if (v === 'night') { if (!S.rev2 && S.thrown < TOT) { S.auto = false; S.thrown = Math.min(TOT, S.thrown + 14); } return; }
  if (v !== 'dates' || !S.geo) return;
  const { s, ox, oy } = S.geo, X = ((ev.clientX - r.left - ox) / s - MX3) / K3, Y = ((ev.clientY - r.top - oy) / s - MY3) / K3;
  if (!hitCtx.isPointInPath(LAND, X, Y)) { S.pick = null; render(); return; }
  let best = 0, bd = 1e9; COLS.forEach(([x, y], i) => { const d = (x - X) ** 2 + (y - Y) ** 2; if (d < bd) { bd = d; best = i; } });
  S.pick = best; sfx.tick(); render();
});

// --- one render per change: controls, readout and the state card ------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secTax').hidden = v !== 'tax'; $('secNight').hidden = v !== 'night'; $('secDates').hidden = v !== 'dates';
  if (v === 'tax') renderTax(t); else if (v === 'night') renderNight(t); else renderDates(t);
}
function renderTax(t) {
  const tt = t.tax, a = S.act, A = tt.acts[a], rev = S.rev[a], g = S.pred[a], open = secret.unlocked(), seatsMode = S.sec === 'seats' && open;
  lab.setGlow('rgba(91, 143, 217, .28)');
  $('seatsChip').className = `chip secret ${open ? 'open' : ''} ${seatsMode ? 'on' : ''}`;
  $('seatsChip').textContent = open ? tt.seatsChip : '🔒 ???';
  $('seatsBox').hidden = !seatsMode; $('seatsLbl').textContent = tt.seatsLbl; $('seatsR').value = S.seats;
  $('actChips').hidden = seatsMode; $('predBox').hidden = seatsMode;
  if (seatsMode) {
    const n = S.seats, p = fmt1(100 * n / (COMMONS + n));
    lab.setReadout(n, tt.seatsUnit, n ? tt.seatsPill(p) : '', '#f2c14e');
    lab.setState({ emo: '🪑', title: tt.seatsTitle(n), lead: tt.seatsLead(n, p), body: tt.seatsBody(n), extra: `<div class="tt-fine">${esc(fineTax(tt))}</div>` });
    lab.setFacts(t.facts.tax0.slice(2));
    return;
  }
  $('actChips').innerHTML = tt.acts.map((x, i) => `<button class="chip ${i === a ? 'on' : ''}" data-act="act" data-i="${i}">${x.yr}${S.rev[i] ? ' ✓' : ''}</button>`).join('');
  if (!rev) {
    $('predBox').innerHTML = `<div class="tt-q">${esc(tt.ask)}</div><div class="tt-pred">${tt.opts.map((o, i) => `<button data-act="pred" data-g="${i}">${esc(o)}</button>`).join('')}</div><div class="tt-tip">${esc(tt.boy)}</div>`;
    lab.setReadout(A.yr, A.name, '', '#5b8fd9');
    lab.setState({ emo: ['📜', '🏷️', '🫖'][a], title: `${A.yr}: ${A.name}`, lead: A.set, body: A.q, extra: '' });
    lab.setFacts(t.facts.tax0);
  } else {
    const all = S.rev.every(Boolean), last = a === 2;
    $('predBox').innerHTML = `<div class="tt-pred">${tt.opts.map((o, i) => `<button disabled class="${i === g ? 'pick' : ''}">${esc(o)}</button>`).join('')}</div>
      <button class="btn tt-go" data-act="next">${esc(last ? tt.again : tt.next(tt.acts[a + 1].yr))}</button>`;
    lab.setReadout(A.yr, A.name, `📣 ${tt.pill}`, '#ff6a5e');
    lab.setState({ emo: ['📣', '🚫', '🫖'][a], title: A.rev[0], lead: `${g === 0 ? t.no : t.yes} ${tt.refused}`, body: `${A.rev[1]} ${A.rev[2]}`,
      extra: `${all ? `<div>${esc(tt.sum)}</div>` : ''}<div class="tt-fine">${esc(fineTax(tt))}</div>` });
    lab.setFacts(t.facts.tax1);
  }
}
function renderNight(t) {
  const tn = t.night, n = Math.min(TOT, Math.floor(S.thrown + 1e-6)), done = n >= TOT, open = secret.unlocked(), cupsMode = S.sec === 'cups' && open;
  lab.setGlow('rgba(70, 90, 170, .3)');
  $('chestLbl').textContent = tn.slider; $('chestR').value = n; $('chestR').disabled = S.rev2;
  $('allB').textContent = tn.all; $('allB').disabled = done || S.auto || S.rev2; $('again2B').textContent = tn.again; $('again2B').hidden = n === 0 && !S.rev2;
  $('cupsChip').className = `chip secret ${open ? 'open' : ''} ${cupsMode ? 'on' : ''}`; $('cupsChip').textContent = open ? tn.cupsChip : '🔒 ???';
  $('cupsBox').hidden = !cupsMode; $('cupsLbl').textContent = tn.cupsLbl; $('gramR').value = S.grams;
  const kg = fmtInt(KG);
  if (done && !S.rev2) $('askBox').innerHTML = `<div class="tt-q">${esc(tn.ask[0])}</div><div class="tt-pred col">${tn.opts.map((o, i) => `<button data-act="pred2" data-g="${i}">${esc(o)}</button>`).join('')}</div>`;
  else if (S.rev2) $('askBox').innerHTML = `<div class="tt-pred col">${tn.opts.map((o, i) => `<button disabled class="${i === 1 ? 'good' : i === S.p2 ? 'pick' : ''}">${esc(o)}</button>`).join('')}</div>`;
  else $('askBox').innerHTML = '';
  if (cupsMode) {
    const m = fmt1(KG * 1000 / S.grams / 1e6), g = fmt1(S.grams);
    lab.setReadout(m, tn.cupsUnit, `${g} g`, '#e8d3a6');
    lab.setState({ emo: '☕', title: tn.cupsTitle(m), lead: tn.cupsLead(g, m, kg), body: tn.cupsBody, extra: '' });
    lab.setFacts(S.rev2 ? t.facts.night1 : t.facts.night0);
    return;
  }
  lab.setReadout(n, tn.unit(TOT), done ? tn.pill(kg) : '', '#b9814b');
  if (S.rev2) {
    lab.setState({ emo: '🔒', title: tn.rev[0], lead: S.p2 === 1 ? t.yes : tn.wrong[S.p2], body: tn.rev[1], extra: '' });
    lab.setFacts(t.facts.night1);
  } else if (done) {
    lab.setState({ emo: '🏛️', title: tn.ask[0], lead: tn.ask[1], body: '', extra: '' }); lab.setFacts(t.facts.night0);
  } else {
    lab.setState({ emo: '🌙', title: tn.s0[0], lead: tn.s0[1], body: tn.body0(n, TOT), extra: '' }); lab.setFacts(t.facts.night0);
  }
}
function renderDates(t) {
  const td = t.dates, k = S.order.filter((x, i) => x === i).length;
  lab.setGlow('rgba(227, 168, 95, .26)');
  $('regChips').innerHTML = td.regs.map((r, i) => `<button class="chip ${S.reg === i ? 'on' : ''}" data-act="reg" data-r="${i}"><span class="tt-dot" style="background:${REGC[i]}"></span>${esc(r)}</button>`).join('');
  $('cardList').innerHTML = S.order.map((cid, i) => {
    const cls = S.checked ? (cid === i ? 'ok' : 'no') : '';
    return `<div class="tt-row ${cls}"><span class="n">${i + 1}</span><span class="e">${EMO[cid]}</span><span class="nm">${esc(td.cards[cid])}</span>${S.checked
      ? `<span class="yr">${YEARS[cid]}</span>`
      : `<button class="tt-mv" data-act="up" data-i="${i}" aria-label="${esc(td.up)}"${i === 0 ? ' disabled' : ''}>▲</button><button class="tt-mv" data-act="down" data-i="${i}" aria-label="${esc(td.down)}"${i === 4 ? ' disabled' : ''}>▼</button>`}</div>`;
  }).join('');
  $('checkB').textContent = S.checked ? td.again : td.check;
  const sub = S.pick !== null ? `📍 ${td.cols[S.pick]} · ${td.regs[COLS[S.pick][2]]}` : td.placed;
  if (!S.checked) {
    lab.setReadout('5', sub, '', '#e3a85f');
    lab.setState({ emo: '❓', title: td.s0[0], lead: td.s0[1], body: td.body0, extra: `<div class="tt-fine">${esc(td.fine)}</div>` });
    lab.setFacts(t.facts.dates0);
  } else {
    lab.setReadout(`${k}/5`, sub, td.pill(k), k === 5 ? '#3ddc97' : '#e3a85f');
    lab.setState({ emo: k === 5 ? '🏆' : '🧭', title: td.res(k), lead: td.lead(YEARS[4] - YEARS[0]), body: td.body, extra: `<div class="tt-fine">${esc(td.fine)}</div>` });
    lab.setFacts(t.facts.dates1);
  }
}
render();
</script>
</body>
