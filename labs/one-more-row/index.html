// --- drawing: the crate and the apples -----------------------------------------------------------------------
function geom(w, h, rows, cols, top, bot, labW) {
  const availW = w - 28 - labW - 20, availH = h - top - bot - 20;
  const cell = Math.max(8, Math.min(availW / cols, availH / rows, 46));
  const gw = cols * cell, gh = rows * cell, cw = gw + 20 + labW, ch = gh + 20;
  const cx = (w - cw) / 2, cy = top + (h - top - bot - ch) / 2;
  return { cx, cy, cw, ch, gx: cx + 10 + labW, gy: cy + 10, gw, gh, cell, labW };
}
function crate(c, G) {

  const g = c.createLinearGradient(G.cx, G.cy, G.cx + G.cw, G.cy + G.ch);
  g.addColorStop(0, '#e6b077'); g.addColorStop(0.5, '#bd8449'); g.addColorStop(1, '#94602f');
  rr(c, G.cx, G.cy, G.cw, G.ch, 14); c.fillStyle = g; c.fill();
  c.restore();
  c.save();
  rr(c, G.cx, G.cy, G.cw, G.ch, 14); c.clip();
  c.strokeStyle = 'rgba(60,35,10,.25)'; c.lineWidth = 1;
  for (let i = 1; i < 4; i++) { const yy = G.cy + (G.ch * i) / 4; c.beginPath(); c.moveTo(G.cx, yy); c.lineTo(G.cx + G.cw, yy); c.stroke(); }
  const hi = c.createLinearGradient(G.cx, G.cy, G.cx, G.cy + 14); hi.addColorStop(0, 'rgba(255,240,210,.45)'); hi.addColorStop(1, 'rgba(255,240,210,0)');
  c.fillStyle = hi; c.fillRect(G.cx, G.cy, G.cw, 14);
  c.restore();
  rr(c, G.cx, G.cy, G.cw, G.ch, 14); c.strokeStyle = '#5b3716'; c.lineWidth = 1.6; c.stroke();
  // bed
  const bx = G.gx - 4, by = G.gy - 4, bw = G.gw + 8, bh = G.gh + 8;
  const bg = c.createLinearGradient(bx, by, bx + bw, by + bh); bg.addColorStop(0, '#5a381b'); bg.addColorStop(1, '#7f552a');
  rr(c, bx, by, bw, bh, 8); c.fillStyle = bg; c.fill();
  rr(c, bx, by, bw, bh, 8); c.strokeStyle = 'rgba(20,10,0,.6)'; c.lineWidth = 1.4; c.stroke();
  rr(c, bx + 1.5, by + 1.5, bw - 3, bh - 3, 7); c.strokeStyle = 'rgba(255,225,170,.14)'; c.lineWidth = 1; c.stroke();
  c.fillStyle = '#6c4420';
  for (const [nx, ny] of [[G.cx + 5, G.cy + 5], [G.cx + G.cw - 5, G.cy + 5], [G.cx + 5, G.cy + G.ch - 5], [G.cx + G.cw - 5, G.cy + G.ch - 5]]) { c.beginPath(); c.arc(nx, ny, 1.8, 0, 7); c.fill(); }
}
function rowGlow(c, G, from, to, kind, a = 1) {

  g.addColorStop(0, gold ? 'rgba(255,214,110,.42)' : 'rgba(90,220,195,.34)'); g.addColorStop(1, gold ? 'rgba(255,190,70,.26)' : 'rgba(60,190,170,.22)');
  rr(c, G.gx - 2, G.gy + from * G.cell + 1, G.gw + 4, (to - from) * G.cell - 2, 7); c.fillStyle = g; c.fill();
  c.strokeStyle = gold ? 'rgba(255,222,130,.95)' : 'rgba(130,240,215,.95)'; c.lineWidth = 1.6; c.stroke();
  c.restore();
}

  c.strokeStyle = '#2d6f2b'; c.lineWidth = 0.8; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.ellipse(-r * 0.4, -r * 0.35, Math.max(0, r * 0.2), Math.max(0, r * 0.12), -0.7, 0, 7); c.fill();

}
function rowLabel(c, G, i, a = 1) {

  c.save();
  c.translate(x + w / 2, y + h / 2 - e * (y + h + 70)); c.rotate(-e * 0.16); c.translate(-w / 2, -h / 2);
  c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 16; c.shadowOffsetY = 8;
  const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#fbf6ea'); g.addColorStop(1, '#d8cdb8');
  rr(c, 0, 0, w, h, 16); c.fillStyle = g; c.fill();
  c.shadowColor = 'transparent';
  c.save(); rr(c, 0, 0, w, h, 16); c.clip();
  c.fillStyle = 'rgba(214,72,72,.34)';
  for (let i = 0; i * 28 < w; i++) c.fillRect(i * 28 + 7, 0, 14, h);
  for (let j = 0; j * 28 < h; j++) c.fillRect(0, j * 28 + 7, w, 14);
  const f1 = c.createLinearGradient(0, 0, w, 0);
  f1.addColorStop(0, 'rgba(255,255,255,.28)'); f1.addColorStop(0.25, 'rgba(0,0,0,.1)'); f1.addColorStop(0.5, 'rgba(255,255,255,.22)'); f1.addColorStop(0.78, 'rgba(0,0,0,.12)'); f1.addColorStop(1, 'rgba(255,255,255,.12)');
  c.fillStyle = f1; c.fillRect(0, 0, w, h);
  const f2 = c.createLinearGradient(0, 0, 0, h); f2.addColorStop(0, 'rgba(255,255,255,.3)'); f2.addColorStop(1, 'rgba(60,40,20,.2)');

  c.restore();

  const fs = Math.min(72, h * 0.34);
  c.font = FONT(fs, 900); c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = 5; c.strokeStyle = 'rgba(255,255,255,.85)'; c.strokeText(label, w / 2, h / 2 + 2);

function basket(c, bx, by, bw, front) {
  const hw = bw / 2, bh = 26;
  if (!front) {
    c.fillStyle = '#4a2c10'; c.beginPath(); c.ellipse(bx, by + 8, Math.max(0, hw), 6, 0, 0, 7); c.fill();
    return;
  }
  c.save();
  c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 8; c.shadowOffsetY = 4;
  const g = c.createLinearGradient(bx - hw, by, bx + hw, by + bh);
  g.addColorStop(0, '#e8b46c'); g.addColorStop(0.5, '#c58a45'); g.addColorStop(1, '#8f5a26');
  c.beginPath(); c.moveTo(bx - hw, by + 8); c.lineTo(bx + hw, by + 8); c.lineTo(bx + hw * 0.78, by + 8 + bh); c.quadraticCurveTo(bx, by + 8 + bh + 5, bx - hw * 0.78, by + 8 + bh); c.closePath();
  c.fillStyle = g; c.fill(); c.restore();
  c.strokeStyle = 'rgba(70,40,10,.35)'; c.lineWidth = 1;
  for (let i = 1; i < 3; i++) { const yy = by + 8 + (bh * i) / 3; c.beginPath(); c.moveTo(bx - hw * (1 - 0.07 * i), yy); c.lineTo(bx + hw * (1 - 0.07 * i), yy); c.stroke(); }
  c.beginPath(); c.moveTo(bx - hw, by + 8); c.lineTo(bx + hw, by + 8); c.lineTo(bx + hw * 0.78, by + 8 + bh); c.quadraticCurveTo(bx, by + 8 + bh + 5, bx - hw * 0.78, by + 8 + bh); c.closePath();
  c.strokeStyle = '#5b3716'; c.lineWidth = 1.4; c.stroke();
  rr(c, bx - hw - 2, by + 4, bw + 4, 8, 4); c.fillStyle = '#d9a257'; c.fill(); c.strokeStyle = '#5b3716'; c.stroke();
}

// --- scene: Neighbours -----------------------------------------------------------------------------------------
function drawNear(c, w, h, dt) {
  const P = PROBS[S.pi], cc = P.c, rs = Math.max(P.kb, P.r), G = geom(w, h, rs, cc, 46, 50, 24);
  const rev = S.step === 'reveal';
  if (rev) S.rv = Math.min(1, S.rv + dt / 3.6);
  const rv = rev ? S.rv : 0, lift = rev ? cl01(rv / 0.22) : 0, la = ease(lift);
  crate(c, G);
  rowGlow(c, G, 0, P.kb, 'gold', cl01((la - 0.3) / 0.5));
  const aw = G.gw + 90;
  for (let i = 0; i < rs; i++) {
    let dx = 0, a = 1, show = false;
    if (i < Math.min(P.kb, P.r)) { show = la > 0.3; a = cl01((la - 0.3) / 0.5); }
    else if (P.mode === 'add' && i < P.r) { const p = cl01((rv - (0.28 + 0.15 * (i - P.kb))) / 0.36); if (p > 0) { show = true; dx = (1 - easeBack(p)) * aw; } }
    else if (P.mode === 'sub' && i >= P.r) { const p = cl01((rv - 0.34) / 0.42); show = la > 0.3; a = cl01((la - 0.3) / 0.5) * (1 - cl01((p - 0.55) / 0.45)); dx = easeIO(p) * aw; }
    if (!show) continue;
    for (let j = 0; j < cc; j++) apple(c, G.gx + (j + 0.5) * G.cell + dx, G.gy + (i + 0.5) * G.cell, G.cell * 0.42, a, dx / (G.cell * 0.42));
    rowLabel(c, G, i, a);
  }
  if (P.mode === 'add') { const k = cl01((rv - (0.28 + 0.15 * (P.r - P.kb - 1) + 0.34)) / 0.1); rowGlow(c, G, P.kb, P.r, 'teal', k); }
  cloth(c, G.cx - 6, G.cy - 6, G.cw + 12, G.ch + 12, lift, '?');
  pill(c, w, `${P.r} × ${cc} = ${rev && rv > 0.8 ? P.ans : '?'}`, w / 2, 24, { fs: 16 });
  const base = P.kb * cc, d = Math.abs(P.r - P.kb) * cc;
  if (!rev || rv < 0.5) pill(c, w, `⭐ ${P.kb} × ${cc} = ${base}`, w / 2, h - 26, { fg: '#ffe08a', line: 'rgba(255,214,110,.6)', a: rev ? 1 - cl01((rv - 0.35) / 0.15) : 1 });
  if (rev && rv > 0.45) pill(c, w, `${base} ${P.mode === 'sub' ? '−' : '+'} ${d} = ${P.ans}`, w / 2, h - 26, { fs: 17, a: ease((rv - 0.45) / 0.2), fg: '#fff', line: 'rgba(130,240,215,.7)' });
}

// --- scene: Backwards -----------------------------------------------------------------------------------------
function drawBack(c, w, h, dt) {
  const F = FAMS[S.bi], n = F.r * F.c, G = geom(w, h * 0.56, F.r, F.c, 40, 2, 22);
  const rev = S.bstep === 'rev';
  if (rev) S.brv = Math.min(1, S.brv + dt / 4.6);
  const rv = rev ? S.brv : 0, lift = rev ? cl01(rv / 0.14) : 0;
  const nb = S.dir === null ? 0 : S.dir === 0 ? F.c : F.r, m = nb ? n / nb : 0;
  const bw = nb ? Math.min(70, (w - 24) / nb - 6) : 0, tot = nb * bw + (nb - 1) * 6, bx0 = (w - tot) / 2, by = h * 0.79;
  const ar = Math.min(7, bw * 0.17), dur = 0.28;
  const bcx = (g) => bx0 + bw / 2 + g * (bw + 6);
  const slot = (g, k) => ({ x: bcx(g) + ((k % 2) - 0.5) * ar * 2.2, y: by + 3 - Math.floor(k / 2) * ar * 1.7 });
  crate(c, G);
  if (nb) for (let g = 0; g < nb; g++) basket(c, bcx(g), by, bw, false);
  for (let i = 0; i < F.r; i++) for (let j = 0; j < F.c; j++) {
    const hx = G.gx + (j + 0.5) * G.cell, hy = G.gy + (i + 0.5) * G.cell, r = G.cell * 0.42;
    if (!nb || !rev) { apple(c, hx, hy, r, 1, 0); continue; }
    const g = S.dir === 0 ? j : i, k = S.dir === 0 ? i : j;
    const t0 = 0.16 + 0.5 * (g / Math.max(1, nb - 1)) + 0.01 * k, p = cl01((rv - t0) / dur), e = easeIO(p), s = slot(g, k);
    apple(c, lerp(hx, s.x, e), lerp(hy, s.y, e) - Math.sin(Math.PI * e) * 28, lerp(r, ar, e), 1, e * 5);
  }
  if (nb) for (let g = 0; g < nb; g++) {
    basket(c, bcx(g), by, bw, true);
    const tEnd = 0.16 + 0.5 * (g / Math.max(1, nb - 1)) + 0.01 * (m - 1) + dur;
    if (rev && rv > tEnd) { const pp = easeBack((rv - tEnd) / 0.1); pill(c, w, String(m), bcx(g), by + 48 + (1 - pp) * 6, { fs: 14, a: cl01(pp) }); }
  }
  cloth(c, G.cx - 6, G.cy - 6, G.cw + 12, G.ch + 12, lift, '?');
  pill(c, w, `${F.r} × ${F.c} = ${n}`, w / 2, 22, { fs: 16 });
}

// --- scene: My grid ------------------------------------------------------------------------------------------
function routeOf(r, c) {
  const k = (a, b) => a >= 1 && a <= 10 && b >= 1 && b <= 10 && isKnown(a, b);
  const L = [];
  if (r === 9 && k(10, c)) L.push({ kind: 'subRow', a: 10, b: c, lab: `−${c}` });
  if (c === 9 && k(r, 10)) L.push({ kind: 'subCol', a: r, b: 10, lab: `−${r}` });
  if (r % 2 === 0 && k(r / 2, c)) L.push({ kind: 'dbl', a: r / 2, b: c, lab: '×2' });
  if (c % 2 === 0 && k(r, c / 2)) L.push({ kind: 'dbl', a: r, b: c / 2, lab: '×2' });
  if (k(r - 1, c)) L.push({ kind: 'addRow', a: r - 1, b: c, lab: `+${c}` });
  if (k(r, c - 1)) L.push({ kind: 'addCol', a: r, b: c - 1, lab: `+${r}` });
  if (k(r + 1, c)) L.push({ kind: 'subRow', a: r + 1, b: c, lab: `−${c}` });
  if (k(r, c + 1)) L.push({ kind: 'subCol', a: r, b: c + 1, lab: `−${r}` });
  return L[0] ?? null;
}
let gridG = null;
function counts() { let K = 0, M = 0; for (let r = 1; r <= 10; r++) for (let c = 1; c <= 10; c++) { if (isKnown(r, c)) K++; else if (routeOf(r, c)) M++; } return { K, M }; }
function drawGrid(c, w, h) {
  const cell = Math.floor(Math.min((w - 12) / 11, (h - 12) / 11)), ox = Math.round((w - 11 * cell) / 2), oy = Math.round((h - 11 * cell) / 2);
  gridG = { cell, ox, oy };
  c.font = FONT(Math.max(12, cell * 0.42), 900); c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let i = 1; i <= 10; i++) {
    c.fillStyle = '#aeb6cc';
    c.fillText(String(i), ox + (i + 0.5) * cell, oy + cell / 2);
    c.fillText(String(i), ox + cell / 2, oy + (i + 0.5) * cell);
  }
  const sel = S.sel, rt = sel && !isKnown(sel[0], sel[1]) ? routeOf(sel[0], sel[1]) : null;
  for (let r = 1; r <= 10; r++) for (let q = 1; q <= 10; q++) {
    const x = ox + q * cell + 1.5, y = oy + r * cell + 1.5, s = cell - 3, kn = isKnown(r, q), reach = !kn && routeOf(r, q);
    const g = c.createLinearGradient(x, y, x + s, y + s);
    if (kn) { g.addColorStop(0, '#ffe79a'); g.addColorStop(1, '#e2a73a'); } else if (reach) { g.addColorStop(0, 'rgba(110,230,205,.34)'); g.addColorStop(1, 'rgba(60,170,150,.2)'); } else { g.addColorStop(0, 'rgba(140,155,200,.14)'); g.addColorStop(1, 'rgba(100,115,160,.07)'); }
    c.save();
    if (kn) { c.shadowColor = 'rgba(255,200,80,.5)'; c.shadowBlur = 6; }
    rr(c, x, y, s, s, 6); c.fillStyle = g; c.fill(); c.restore();
    rr(c, x, y, s, s, 6); c.strokeStyle = kn ? '#a8741f' : reach ? 'rgba(130,240,215,.7)' : 'rgba(130,145,190,.28)'; c.lineWidth = 1.2; c.stroke();
    if (kn) { c.fillStyle = '#3d2806'; c.font = FONT(Math.max(12, cell * 0.4), 900); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(r * q), x + s / 2, y + s / 2 + 0.5); }
  }
  if (sel) {
    const x = ox + sel[1] * cell + 1.5, y = oy + sel[0] * cell + 1.5, s = cell - 3;
    if (rt) { // arrow from the known neighbour to the chosen square
      const ax = ox + (rt.b + 0.5) * cell, ay = oy + (rt.a + 0.5) * cell, bx = ox + (sel[1] + 0.5) * cell, by = oy + (sel[0] + 0.5) * cell;
      const ang = Math.atan2(by - ay, bx - ax), sx = ax + Math.cos(ang) * cell * 0.3, sy = ay + Math.sin(ang) * cell * 0.3, ex = bx - Math.cos(ang) * cell * 0.3, ey = by - Math.sin(ang) * cell * 0.3;
      c.save(); c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 3; c.lineCap = 'round'; c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 5;
      c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke();
      c.beginPath(); c.moveTo(ex, ey); c.lineTo(ex - Math.cos(ang - 0.5) * 9, ey - Math.sin(ang - 0.5) * 9); c.lineTo(ex - Math.cos(ang + 0.5) * 9, ey - Math.sin(ang + 0.5) * 9); c.closePath(); c.fill();
      c.restore();
      const mx = (ax + bx) / 2, my = (ay + by) / 2;
      pill(c, w, rt.lab, mx + (Math.abs(bx - ax) < 2 ? cell * 0.75 : 0), my + (Math.abs(bx - ax) < 2 ? 0 : -cell * 0.62), { fs: 14, bg: 'rgba(14,17,28,.9)', line: '#fff' });
    }
    c.save(); c.shadowColor = 'rgba(255,255,255,.7)'; c.shadowBlur = 8; rr(c, x - 1, y - 1, s + 2, s + 2, 7); c.strokeStyle = '#fff'; c.lineWidth = 2.6; c.stroke(); c.restore();
  }
}

// --- secrets -------------------------------------------------------------------------------------------------
function drawNines(c, w, h, dt) {
  const n = S.nn, G = geom(w, h, 10, n, 44, 54, 24);
  S.t2 += dt;
  const p = ease((S.t2 - 0.7) / 1.4);
  crate(c, G);
  rowGlow(c, G, 0, 9, 'teal', 1);
  rowGlow(c, G, 9, 10, 'gold', 1 - p);
  for (let i = 0; i < 10; i++) {
    const last = i === 9, a = last ? 1 - p : 1, dy = last ? -p * 14 : 0;
    for (let j = 0; j < n; j++) apple(c, G.gx + (j + 0.5) * G.cell, G.gy + (i + 0.5) * G.cell + dy, G.cell * 0.42, a, 0);
    rowLabel(c, G, i, a);
  }
  pill(c, w, `10 × ${n} = ${10 * n}`, w / 2, 24, { fs: 16 });
  pill(c, w, `${10 * n} − ${n} = ${9 * n}`, w / 2, h - 26, { fs: 17, a: ease((S.t2 - 1.2) / 0.5), line: 'rgba(130,240,215,.7)' });
}
function drawSwap(c, w, h, dt) {
  const tgt = S.swap ? 1 : 0;
  S.swapA = tgt > S.swapA ? Math.min(1, S.swapA + dt / 1.3) : Math.max(0, S.swapA - dt / 1.3);
  const e = easeIO(S.swapA), th = e * Math.PI / 2, rows = 3, cols = 8;
  const cell = Math.max(8, Math.min((w - 70) / 8, (h - 130) / 8, 38)), gw = cols * cell, gh = rows * cell;
  const cx = w / 2, cy = h / 2;
  c.save(); c.translate(cx, cy); c.rotate(th);
  crate(c, { cx: -gw / 2 - 10, cy: -gh / 2 - 10, cw: gw + 20, ch: gh + 20, gx: -gw / 2, gy: -gh / 2, gw, gh, cell, labW: 0 });
  c.restore();
  rowGlowRot(c, cx, cy, th, gw, gh);
  const cs = Math.cos(th), sn = Math.sin(th);
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
    const x = (j - (cols - 1) / 2) * cell, y = (i - (rows - 1) / 2) * cell;
    apple(c, cx + x * cs - y * sn, cy + x * sn + y * cs, cell * 0.42, 1, 0);
  }
  const flipped = e > 0.5;
  pill(c, w, flipped ? '8 × 3 = 24' : '3 × 8 = 24', w / 2, 24, { fs: 16 });
  pill(c, w, '🍎 24', w / 2, h - 24, { fs: 15 });
}
function rowGlowRot(c, cx, cy, th, gw, gh) { // a soft gold outline that turns with the crate
  c.save(); c.translate(cx, cy); c.rotate(th);
  rr(c, -gw / 2 - 3, -gh / 2 - 3, gw + 6, gh + 6, 8); c.strokeStyle = 'rgba(255,222,130,.9)'; c.lineWidth = 1.6; c.stroke();
  c.restore();
}

canvasLoop($('cv'), (c, w, h, dt) => {
  if (S.sec === 'a') drawNines(c, w, h, dt); else if (S.sec === 'b') drawSwap(c, w, h, dt);
  else if (lab.view === 'near') drawNear(c, w, h, dt); else if (lab.view === 'back') drawBack(c, w, h, dt); else drawGrid(c, w, h);
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const nextProb = () => { S.pi = (S.pi + 1) % PROBS.length; S.step = 'move'; S.mv = null; S.guess = null; S.rv = 0; };
const nextFam = () => { S.bi = (S.bi + 1) % FAMS.length; S.dir = null; S.bstep = 'pick'; S.bguess = null; S.brv = 0; };
const numOpts = (ans, wrong) => [ans, ...wrong].sort((a, b) => a - b);
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, d = b.dataset;
  if (act === 'mv') { S.mv = +d.i; S.step = 'num'; sfx.click(); }
  else if (act === 'num') { S.guess = +d.v; S.step = 'reveal'; S.rv = 0; (S.guess === PROBS[S.pi].ans ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'next') { nextProb(); sfx.click(); }
  else if (act === 'pick') { S.dir = +d.i; S.bstep = 'num'; sfx.click(); }
  else if (act === 'bnum') { S.bguess = +d.v; S.bstep = 'rev'; S.brv = 0; const F = FAMS[S.bi], n = F.r * F.c; (S.bguess === n / (S.dir === 0 ? F.c : F.r) ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'other') { S.dir = 1 - S.dir; S.bstep = 'num'; S.bguess = null; S.brv = 0; sfx.click(); }
  else if (act === 'bnext') { nextFam(); sfx.click(); }
  else if (act === 'preset') {
    const p = [1, 2, 5, 10][+d.i], cells = []; for (let r = 1; r <= 10; r++) for (let q = 1; q <= 10; q++) if (r === p || q === p) cells.push([r, q]);
    const all = cells.every(([r, q]) => isKnown(r, q));
    for (const [r, q] of cells) all ? S.known.delete(key(r, q)) : S.known.add(key(r, q));
    saveKnown(); sfx.tick();
  }
  else if (act === 'clear') { S.known = new Set(); saveKnown(); sfx.click(); }
  else if (act === 'toggle' && S.sel) { setKnown(S.sel[0], S.sel[1], !isKnown(S.sel[0], S.sel[1])); sfx.snap(); }
  else if (act === 'ndec') { S.nn = clamp(S.nn - 1, 1, 10); S.t2 = 0; sfx.tick(); }
  else if (act === 'ninc') { S.nn = clamp(S.nn + 1, 1, 10); S.t2 = 0; sfx.tick(); }
  else if (act === 'nagain') { S.t2 = 0; sfx.click(); }
  else if (act === 'turn') { S.swap = !S.swap; sfx.push(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === d.k ? null : d.k; if (S.sec === 'a') S.t2 = 0; sfx.click();
  }
  render();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'grid' || S.sec || !gridG) return;
  const r = $('cv').getBoundingClientRect(), q = Math.floor((ev.clientX - r.left - gridG.ox) / gridG.cell), row = Math.floor((ev.clientY - r.top - gridG.oy) / gridG.cell);
  if (q < 1 || q > 10 || row < 1 || row > 10) return;
  S.sel = [row, q]; sfx.tick(); render();
});

// --- one render per change -----------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = S.sec ? 'sec' : v;
  const open = secret.unlocked();
  const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  const secRow = `<div class="row2"><span class="lbl">${esc(t.sec)}</span><div class="chips">${chip('a', '9️⃣')}${chip('b', '🔄')}</div></div>`;
  let body = '';
  lab.setFacts([{ emo: FACT_EMO[v], text: t.facts[v], src: FACT_SRC[v] }]);
  if (S.sec === 'a') body = renderNines(t);
  else if (S.sec === 'b') body = renderSwap(t);
  else if (v === 'near') body = renderNear(t);
  else if (v === 'back') body = renderBack(t);
  else body = renderGrid(t);
  $('ctrlBody').innerHTML = body + secRow;
}
const opts = (arr, act, key2, cls = '') => `<div class="ob-opts ${cls}">${arr.map((x, i) => `<button class="ob-opt ${key2 === 'v' ? 'num' : ''}" data-act="${act}" data-${key2 === 'v' ? 'v' : 'i'}="${key2 === 'v' ? x : i}">${esc(key2 === 'v' ? x : x)}</button>`).join('')}</div>`;

function renderNear(t) {
  const P = PROBS[S.pi], n = t.near, rev = S.step === 'reveal';
  lab.setGlow('rgba(230, 80, 70, .26)');
  if (!rev) {
    lab.setReadout(`${P.r} × ${P.c}`, '= ?', '', '#e8504a');
    lab.setState({ emo: '🍎', title: n.stuck(P.r, P.c), lead: `${n.known(P.kb, P.c)} ${n.under}`, body: S.step === 'move' ? n.qMove : n.qNum, extra: '' });
    return `<p class="ob-q">${esc(n.known(P.kb, P.c))}</p><p class="ob-q2">${esc(S.step === 'move' ? n.qMove : n.qNum)}</p>` +
      (S.step === 'move' ? opts(n.mv[S.pi], 'mv', 'i') : opts(numOpts(P.ans, P.wrong), 'num', 'v', 'row'));
  }
  const ok = S.guess === P.ans, good = S.mv === P.ok;
  lab.setReadout(`${P.r} × ${P.c} = ${P.ans}`, `${P.kb} × ${P.c} = ${P.kb * P.c}`, '', '#e8504a');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.verdict : n.bad(P.ans), lead: n.exp[S.pi], body: good ? '' : n.move(n.mv[S.pi][P.ok]), extra: '' });
  return `<div class="ob-opts"><button class="ob-opt" data-act="next">${esc(n.next)}</button></div>`;
}
function renderBack(t) {
  const F = FAMS[S.bi], n = F.r * F.c, b = t.back, dv = t.div;
  lab.setGlow('rgba(224, 176, 80, .26)');
  const ks = [F.c, F.r]; // dir 0: share into c baskets (r each); dir 1: share into r baskets (c each)
  if (S.dir === null) {
    lab.setReadout(`${n} ${dv} ?`, '= ?', '', '#e0b050');
    lab.setState({ emo: '🧺', title: b.title, lead: b.under(F.r, F.c, n), body: b.pick, extra: '' });
    return `<p class="ob-q">${esc(b.under(F.r, F.c, n))}</p><p class="ob-q2">${esc(b.pick)}</p>` + opts(ks.map((k) => b.share(k)), 'pick', 'i');
  }
  const k = ks[S.dir], m = n / k;
  if (S.bstep === 'num') {
    const wrong = [k, m + 1 === k ? m - 1 : m + 1];
    lab.setReadout(`${n} ${dv} ${k}`, '= ?', '', '#e0b050');
    lab.setState({ emo: '🧺', title: b.title, lead: b.ask(n, k), body: '', extra: '' });
    return `<p class="ob-q">${esc(b.ask(n, k))}</p>` + opts(numOpts(m, wrong), 'bnum', 'v', 'row');
  }
  const ok = S.bguess === m, eq = (a, bb, cc) => `${a} ${dv} ${bb} = ${cc}`;
  lab.setReadout(eq(n, k, m), `${m} × ${k} = ${n}`, '', '#e0b050');
  const fam = [`${F.r} × ${F.c} = ${n}`, `${F.c} × ${F.r} = ${n}`, eq(n, F.c, F.r), eq(n, F.r, F.c)];
  const hi = S.dir === 0 ? 2 : 3;
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.verdict : b.bad(m), lead: eq(n, k, m), body: b.body,
    extra: `<div class="ob-fam">${fam.map((x, i) => `<div class="${i === hi ? 'hi' : ''}">${esc(x)}</div>`).join('')}</div>` });
  return `<div class="ob-opts row"><button class="ob-opt" data-act="other">${esc(b.other)}</button><button class="ob-opt" data-act="bnext">${esc(b.next)}</button></div>`;
}
function renderGrid(t) {
  const g = t.grid, { K, M } = counts(), sel = S.sel;
  lab.setGlow('rgba(95, 184, 168, .26)');
  lab.setReadout(g.val(K), g.sub, g.pill(M), '#5fb8a8');
  const pr = [1, 2, 5, 10].map((p, i) => {
    let all = true; for (let r = 1; r <= 10; r++) for (let q = 1; q <= 10; q++) if ((r === p || q === p) && !isKnown(r, q)) all = false;
    return `<button class="chip ${all ? 'on' : ''}" data-act="preset" data-i="${i}">${esc(g.p[i])}</button>`;
  }).join('');
  let tog = '';
  if (!sel) lab.setState({ emo: '🔢', title: g.idleT, lead: g.idleL, body: g.idleB, extra: '' });
  else {
    const [r, q] = sel, kn = isKnown(r, q);
    if (kn) lab.setState({ emo: '⭐', title: g.knownT(r, q), lead: g.knownL, body: g.knownB, extra: '' });
    else {
      const rt = routeOf(r, q);
      lab.setState(rt ? { emo: '➡️', title: `${r} × ${q}`, lead: g.rt[rt.kind](rt.a, rt.b, rt.a * rt.b, r * q), body: '', extra: '' }
        : { emo: '🤔', title: `${r} × ${q}`, lead: g.noRoute, body: g.noRouteB, extra: '' });
    }
    tog = `<button class="chip ${kn ? '' : 'on'}" data-act="toggle" style="margin-left:auto">${esc(kn ? g.forget : g.know)}</button>`;
  }
  return `<div class="row2" style="margin-top:0"><div class="chips">${pr}<button class="chip" data-act="clear">${esc(g.clear)}</button></div>${tog}</div>`;
}
function renderNines(t) {
  const n = S.nn, s = t.nines, d = String(9 * n).split('');
  lab.setGlow('rgba(95, 184, 168, .26)');
  lab.setReadout(`9 × ${n} = ${9 * n}`, `10 × ${n} − ${n}`, '', '#5fb8a8');
  lab.setState({ emo: '9️⃣', title: s.t, lead: s.l(n), body: d.length === 1 ? s.b1 : s.b(d), extra: '' });
  return `<div class="ob-step"><button class="ob-sb" data-act="ndec" aria-label="−">−</button><b>9 × ${n}</b><button class="ob-sb" data-act="ninc" aria-label="+">+</button><button class="chip" data-act="nagain" style="margin-left:8px">${esc(s.turn)}</button></div>`;
}
function renderSwap(t) {
  const s = t.swap, a = S.swap ? 8 : 3, b = S.swap ? 3 : 8;
  lab.setGlow('rgba(224, 176, 80, .26)');
  lab.setReadout(`${a} × ${b} = 24`, '', '', '#e0b050');
  lab.setState({ emo: '🔄', title: s.t, lead: s.l(a, b), body: '', extra: '' });
  return `<div class="ob-opts"><button class="ob-opt" data-act="turn">${esc(s.turn)}</button></div>`;
}
render();
</script>
</body>
</html>
