  if (tv > 0.7) { txt(c, 'z', 232, 224, { col: 'rgba(200,215,255,.8)', font: '800 18px Nunito, sans-serif' }); txt(c, 'z', 246, 208, { col: 'rgba(200,215,255,.6)', font: '800 14px Nunito, sans-serif' }); }
  const bt = lerp(40, 18, tv), en = lerp(100, 100 / 15, tv);
  thermo(c, 330, 90, 190, bt, 45); pill(c, `${Math.round(bt)} °C`, 322, 74); pill(c, T[lang].sec.temp, 322, 340, { font: '700 13.5px Nunito, sans-serif' });
  rr(c, 26, 90, 22, 190, 8); c.fillStyle = 'rgba(130,145,190,.2)'; c.fill();
  const eh = 190 * en / 100; rr(c, 26, 90 + 190 - eh, 22, eh, 8); c.fillStyle = lg(c, 0, 90, 0, 280, ['#ffd28a', '#e0a458']); c.fill();
  pill(c, `${Math.round(en)}%`, 37, 74); pill(c, T[lang].sec.energy, 60, 340, { font: '700 13.5px Nunito, sans-serif' });
}
function sceneKomodo(c, t) {
  const t2 = T[lang], P = 14, ph = ((t - S.k0) % P) / P * 12, tick = Math.floor(ph), within = (ph - tick) * (P / 12);   // seconds since the last meal began
  const eating = within < 0.7, ep = eating ? within / 0.7 : 1;
  const sk = c.createLinearGradient(0, 0, 0, 230); sk.addColorStop(0, '#1d2a58'); sk.addColorStop(1, '#e0a060'); c.fillStyle = sk; c.fillRect(-20, -20, DW + 40, 250);
  const gr = c.createLinearGradient(0, 230, 0, 400); gr.addColorStop(0, '#7a5c3a'); gr.addColorStop(1, '#3c2b19'); c.fillStyle = gr; c.fillRect(-20, 230, DW + 40, 190);
  ell(c, 290, 66, 20, 20, '#ffd98a');
  if (!eating) { c.strokeStyle = 'rgba(255,217,138,.5)'; c.lineWidth = 2; for (let i = 0; i < 8; i++) { const a = i * TAU / 8 + t * 0.2; c.beginPath(); c.moveTo(290 + Math.cos(a) * 26, 66 + Math.sin(a) * 26); c.lineTo(290 + Math.cos(a) * 34, 66 + Math.sin(a) * 34); c.stroke(); } }
  const belly = 1 + (eating ? ep : 1 - Math.min(1, (within - 0.7) / 4)) * 0.12;
  c.save(); c.translate(150, 262); c.scale(1, belly); c.translate(-150, -262);
  lizard(c, 150, 262, 1.55, { pal: ['#a8977a', '#5d5040'], t, nib: eating ? Math.sin(ep * Math.PI) : 0 });
  c.restore();
  if (eating) { const r = (1 - ep); ell(c, 262, 258, 24 * r + 1, 14 * r + 1, '#8a5a3a'); ell(c, 258, 254, 8 * r, 5 * r, 'rgba(255,255,255,.2)'); }
  pill(c, eating ? t2.sec.komMeal(KOM_MEAL) : t2.sec.komBask, 180, 150, { bg: eating ? 'rgba(224,164,88,.92)' : 'rgba(10,12,22,.82)', col: eating ? '#1c1408' : '#EDEFF7' });
  const x0 = 30, x1 = 330, y = 346;
  rr(c, x0, y - 3, x1 - x0, 6, 3); c.fillStyle = 'rgba(255,255,255,.18)'; c.fill();
  for (let i = 0; i < 12; i++) { const px = x0 + (x1 - x0) * (i + 0.5) / 12; ell(c, px, y, 5, 5, i <= tick ? '#ffb347' : 'rgba(255,255,255,.3)'); }
  const cx = x0 + (x1 - x0) * ph / 12; ell(c, cx, y, 8, 8, '#fff'); ell(c, cx, y, 4.5, 4.5, '#e0a458');
  pill(c, t2.sec.komYear, 180, 376, { font: '700 13.5px Nunito, sans-serif' });
}

// the canvas loop: one design box per scene, scaled to fit width and height
const BOX = { food: 366, morning: 414, size: 440, tor: 360, kom: 396 };
canvasLoop($('cv'), (c, w, h, dt, time) => {
  S.tv += ((S.tor ? 1 : 0) - S.tv) * Math.min(1, dt * 2.2);
  const key = S.sec === 'tor' ? 'tor' : S.sec === 'kom' ? 'kom' : lab.view;
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#12172f'); bg.addColorStop(1, '#0b0e1f'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const DH = BOX[key] || 400, sc = Math.min(w / DW, h / DH) * 0.98;
  c.save(); c.translate((w - DW * sc) / 2, (h - DH * sc) / 2); c.scale(sc, sc);
  c.beginPath(); c.rect(0, 0, DW, DH); c.clip();
  if (key === 'food') { sceneFood(c, time); const dk = `${Math.floor(dayNow(time))}`; if (S.run !== null && dk !== S.dayKey) { S.dayKey = dk; render(); } }
  else if (key === 'morning') sceneMorning(c, time, dt);
  else if (key === 'size') sceneSize(c, time);
  else if (key === 'tor') sceneTorpor(c, time);
  else sceneKomodo(c, time);
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function askHTML(v, q, opts, g) {
  const keys = OPTK[v], okk = askOk[v];
  return `<div class="lz-q">${esc(q)}</div><div class="lz-opts">${opts.map((o, i) => {
    const k = keys[i], cls = g === null ? '' : k === okk ? ' ok' : k === g ? ' on' : '';
    return `<button type="button" class="lz-opt${cls}" data-act="pick" data-v="${v}" data-k="${k}"${g === null ? '' : ' disabled'}>${esc(o)}</button>`;
  }).join('')}</div>`;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, now = nowS();
  if (act === 'pick') {
    const v = b.dataset.v, k = b.dataset.k, ok = k === askOk[v];
    if (v === 'food' && S.g1 === null) { S.g1 = k; S.run = now; S.dayKey = '0'; }
    else if (v === 'morning' && S.g2 === null) { S.g2 = k; S.air = 10; S.rock = false; S.fresh2 = true; S.rt0 = now; }
    else if (v === 'size' && S.g3 === null) { S.g3 = k; S.an = 0; }
    else return;
    (ok ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (act === 'again') { S.run = now; S.dayKey = '0'; sfx.click(); }
  else if (act === 'rock') { S.rock = !S.rock; S.fresh2 = false; sfx.click(); }
  else if (act === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = b.dataset.k; S.tor = false; S.k0 = now; sfx.click(); }
  else if (act === 'back') { S.sec = null; sfx.click(); }
  else if (act === 'tor') { S.tor = b.dataset.k === '1'; sfx.click(); }
  else if (act === 'restart') { S.k0 = now; sfx.click(); }
  else if (act === 'an') { S.an = +b.dataset.k; sfx.tick(); }
  else if (act === 'cube') { S.cube = +b.dataset.k; sfx.tick(); }
  render();
});
$('air').addEventListener('input', (ev) => { S.air = +ev.target.value; S.fresh2 = false; render(); });

// --- one render per change ------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = v === 'morning' ? S.sec : null;
  document.body.dataset.v = sec ? 'sec' : v;
  $('lzFood').hidden = v !== 'food'; $('lzMorn').hidden = v !== 'morning'; $('lzSize').hidden = v !== 'size';
  if (v === 'food') renderFood(t); else if (v === 'morning') (sec ? renderSecret(t) : renderMorning(t)); else renderSize(t);
}
function renderFood(t) {
  const f = t.f, d = dayNow(nowS()), mL = Math.round(PEL - PEL * d / 7), lL = Math.round(PEL - PEL_L * d / 7), ok = S.g1 === 'mouse';
  lab.setGlow('rgba(224, 164, 88, .26)');
  $('q1').innerHTML = askHTML('food', f.q, f.opts, S.g1);
  $('rerun').hidden = S.g1 === null || d < 7; $('rerun').textContent = f.again;
  if (S.g1 === null) {
    lab.setReadout('7', f.subPre, '', '#e0a458'); lab.setState({ emo: '🥣', title: f.pre[0], lead: f.pre[1], body: '', extra: '' }); lab.setFacts(f.factsPre);
  } else if (d < 7) {
    lab.setReadout(`${mL} · ${lL}`, f.sub, '', '#e0a458'); lab.setState({ emo: '📅', title: f.run[0], lead: f.run[1](Math.min(7, Math.floor(d) + 1)), body: '', extra: '' }); lab.setFacts(f.facts);
  } else {
    lab.setReadout(`${mL} · ${lL}`, f.sub, '', '#e0a458');
    lab.setState({ emo: ok ? '✅' : '🤔', title: f.end(ok, PEL, PEL_L), lead: f.endLead, body: f.endBody(RATIO), extra: `<div class="fine">${esc(t.fineBase)}</div>` }); lab.setFacts(f.facts);
  }
}
function renderMorning(t) {
  const m = t.m, Tl = lizT(S.air, S.rock), pct = Math.round(lizSpeed(Tl) * 100), ok = S.g2 === 'mouse';
  lab.setGlow('rgba(110, 170, 255, .26)');
  $('q2').innerHTML = askHTML('morning', m.q, m.opts, S.g2);
  $('lzSlide').hidden = false; $('secCtl').hidden = true;
  $('airLbl').textContent = m.air; $('e1').textContent = m.ends[0]; $('e2').textContent = m.ends[1];
  if (+$('air').value !== S.air) $('air').value = S.air;
  $('rockB').textContent = S.rock ? m.rockOn : m.rockOff; $('rockB').classList.toggle('on', S.rock);
  $('ill').textContent = S.g2 === null ? '' : m.ill;
  const sc = (k, emo) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('tor', '🐦') + sc('kom', '🦎');
  lab.setReadout(`${S.air} °C`, m.sub, m.pill(MOUSE_T, Tl), '#6ea8ff');
  if (S.g2 === null) { const [a, b] = m.pre(MOUSE_T, Tl); lab.setState({ emo: '🌡️', title: a, lead: b, body: '', extra: '' }); lab.setFacts(m.factsPre); return; }
  const [a, b] = m.post(S.fresh2 ? (ok ? t.right : t.notq) : '', pct, Tl, MOUSE_T);
  lab.setState({ emo: ok && S.fresh2 ? '✅' : '🦎', title: a, lead: b, body: pct < 80 ? m.hintRock : m.hintOk, extra: '' });
  lab.setFacts(S.g1 === null ? m.facts.slice(0, 2) : m.facts);
}
function renderSize(t) {
  const s = t.s, ok = S.g3 === 'shrew';
  lab.setGlow('rgba(143, 160, 216, .28)');
  $('q3').innerHTML = askHTML('size', s.q, s.opts, S.g3);
  $('sizeCtl').hidden = S.g3 === null;
  if (S.g3 === null) { lab.setReadout('?', s.sub, '', '#8fa0d8'); lab.setState({ emo: '📏', title: s.pre[0], lead: s.pre[1], body: '', extra: '' }); lab.setFacts(s.factsPre); return; }
  $('anLbl').textContent = s.animal; $('cbLbl').textContent = s.cube;
  $('anChips').innerHTML = s.names.map((n, i) => `<button class="chip ${S.an === i ? 'on' : ''}" data-act="an" data-k="${i}">${esc(n)}</button>`).join('');
  $('cbChips').innerHTML = [1, 2, 3].map((n) => `<button class="chip ${S.cube === n ? 'on' : ''}" data-act="cube" data-k="${n}">${esc(s.cm(n))}</button>`).join('');
  const a = ANIMALS[S.an], n = S.cube;
  lab.setReadout(prec(a.pg), s.sub, `${s.names[S.an]}`, '#8fa0d8');
  lab.setState({ emo: ok ? '✅' : '🤔', title: s.post(ok, SHREW_X_ELEPHANT), lead: s.lead(s.names[S.an], s.masses[S.an], prec(a.e), prec(a.pg)), body: s.body(n, 6 * n * n, n * n * n, num(6 / n)), extra: `<div class="fine">${esc(s.fine)}</div>` });
  lab.setFacts(s.facts(num(ELE_LO, 1), num(ELE_HI, 0)));
}
function renderSecret(t) {
  const sc = t.sec, k = S.sec;
  $('q2').innerHTML = ''; $('lzSlide').hidden = true; $('secCtl').hidden = false;
  if (k === 'tor') {
    lab.setGlow('rgba(120, 130, 255, .3)');
    $('secCtl').innerHTML = `<button class="chip ${S.tor ? '' : 'on'}" data-act="tor" data-k="0">${esc(sc.awake)}</button><button class="chip ${S.tor ? 'on' : ''}" data-act="tor" data-k="1">${esc(sc.torpor)}</button><button class="chip" data-act="back">${esc(sc.back)}</button>`;
    const bt = Math.round(lerp(40, 18, S.tor ? 1 : 0)), en = Math.round(S.tor ? 100 / 15 : 100);
    lab.setReadout(`${bt} °C`, sc.torSub, sc.torPill(en), '#7a86ff');
    const [a, b] = S.tor ? sc.torTitle : sc.torAwake;
    lab.setState({ emo: S.tor ? '😴' : '🐦', title: a, lead: b, body: S.tor ? sc.torBody : '', extra: '' }); lab.setFacts(sc.torFacts);
  } else {
    lab.setGlow('rgba(224, 160, 96, .3)');
    $('secCtl').innerHTML = `<button class="chip" data-act="restart">${esc(sc.restart)}</button><button class="chip" data-act="back">${esc(sc.back)}</button>`;
    lab.setReadout('12', sc.komSub, sc.komPill(KOM_DAYS), '#e0a060');
    lab.setState({ emo: '🦎', title: sc.komTitle, lead: sc.komLead(KOM_KG, num(KOM_MEAL)), body: sc.komBody, extra: '' }); lab.setFacts(sc.komFacts);
  }
}
render();
</script>
