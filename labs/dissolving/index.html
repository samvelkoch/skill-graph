const SOL = { salt: [35.9, 36.1, 36.4, 36.7, 37.0, 37.5, 37.9], sugar: [203.9, 219.5, 238.1, 260.4, 287.3, 320.5, 362.1] };

const MIX = { sand: ['water', 'sand'], chalk: ['water', 'chalk'], salt: ['water', 'salt'], iron: ['iron', 'sand'] };

  sand: { sieve: 'TS', filter: 'TS', evap: 'WN', magnet: 'NN' },

const effP = (B) => (B.tool === 'magnet' ? clamp((B.p - 0.2) / 0.35, 0, 1) : B.p);
function places(mix, tool, p) {
  const per = { src: [0, 0], tool: [0, 0], below: [0, 0], steam: [0, 0], mag: [0, 0] };
  MIX[mix].forEach((k, i) => {
    const f = FATE[mix][tool][i], m = MASS[k], mv = f === 'N' ? 0 : p;
    per.src[i] += m * (1 - mv);
    if (f !== 'N') per[WHERE[f]][i] += m * mv;
  });
  return per;
}

}

  c.beginPath(); c.arc(tx, tb + 6, 8, 0, 6.283); c.fill();

}
function drawZ1(c, w, h, dt, time) {
  const p = S.z1.p, t = T[lang], fs = clamp(w * 0.03, 10, 13), pw = Math.min(w * 0.36, h * 0.55), py = h * 0.5, phh = pw * 0.28;
  const cxs = [w * 0.26, w * 0.74];
  // left: sugar water on gentle heat
  const ev = clamp(p / 0.6, 0, 1), cf = ease((ev - 0.55) / 0.4);
  pan(c, cxs[0], py, pw, phh);
  c.save(); c.beginPath(); c.moveTo(cxs[0] - pw * 0.46, py + 3); c.lineTo(cxs[0] - pw * 0.41, py + phh - 2); c.lineTo(cxs[0] + pw * 0.41, py + phh - 2); c.lineTo(cxs[0] + pw * 0.46, py + 3); c.closePath(); c.clip();
  const wl = 1 - ev; if (wl > 0.02) { c.fillStyle = 'rgba(90,170,255,.55)'; c.fillRect(cxs[0] - pw / 2, py + phh - phh * 0.9 * wl, pw, phh); }
  c.fillStyle = '#fff2dc'; for (let i = 0; i < 60 * cf; i++) c.fillRect(cxs[0] - pw * 0.4 + rnd(i * 1.9) * pw * 0.8, py + phh - 3 - rnd(i * 2.7) * phh * 0.25, 3.4, 3.4);
  c.restore();
  flame(c, cxs[0], py + phh + pw * 0.2, pw * 0.5, pw * 0.1, time, 0);
  if (ev > 0.02 && ev < 0.99) for (let i = 0; i < 7; i++) { const ph2 = (time * 0.4 + i / 7) % 1; c.fillStyle = `rgba(215,235,255,${(1 - ph2) * 0.35})`; c.beginPath(); c.arc(cxs[0] + Math.sin(i * 2.3 + time) * pw * 0.2, py - ph2 * h * 0.28, 5 + ph2 * 11, 0, 6.283); c.fill(); }
  // right: dry sugar on strong heat
  pan(c, cxs[1], py, pw, phh);
  const stage = p < 0.2 ? 0 : p < 0.4 ? 1 : p < 0.7 ? 2 : 3;
  const colr = [null, 'rgba(255,230,170,.85)', `hsl(${lerp(38, 22, (p - 0.4) / 0.3)},85%,${lerp(55, 32, (p - 0.4) / 0.3)}%)`, `hsl(20,30%,${lerp(20, 8, clamp((p - 0.7) / 0.3, 0, 1))}%)`][stage];
  c.save(); c.beginPath(); c.moveTo(cxs[1] - pw * 0.46, py + 3); c.lineTo(cxs[1] - pw * 0.41, py + phh - 2); c.lineTo(cxs[1] + pw * 0.41, py + phh - 2); c.lineTo(cxs[1] + pw * 0.46, py + 3); c.closePath(); c.clip();
  if (stage === 0) { c.fillStyle = '#fff2dc'; for (let i = 0; i < 60; i++) c.fillRect(cxs[1] - pw * 0.4 + rnd(i * 1.9 + 9) * pw * 0.8, py + phh - 3 - rnd(i * 2.7 + 4) * phh * 0.25, 3.4, 3.4); }
  else { c.fillStyle = colr; c.fillRect(cxs[1] - pw / 2, py + phh * 0.55, pw, phh); }
  c.restore();
  flame(c, cxs[1], py + phh + pw * 0.2, pw * 0.7, pw * 0.2, time, 2);
  if (p > 0.55) for (let i = 0; i < 8; i++) { const ph2 = (time * 0.35 + i / 8) % 1; c.fillStyle = `rgba(70,70,80,${(1 - ph2) * 0.4 * clamp((p - 0.55) / 0.3, 0, 1)})`; c.beginPath(); c.arc(cxs[1] + Math.sin(i * 2.9 + time * 1.2) * pw * 0.2, py - ph2 * h * 0.3, 6 + ph2 * 13, 0, 6.283); c.fill(); }
  label(c, t.cv.pan1, cxs[0], h * 0.12, fs, '#c6cde0', w); label(c, t.cv.pan2, cxs[1], h * 0.12, fs, '#c6cde0', w);
  if (p >= 0.95) { label(c, `✓ ${t.cv.redis}`, cxs[0], h * 0.9, fs, '#3ddc97', w); label(c, `✗ ${t.cv.noredis}`, cxs[1], h * 0.9, fs, '#f5c84c', w); }
}

// ---------------------------------------------------------------------------------------------------------
// 11. Secret 2: fizzy bottle on the scale
// ---------------------------------------------------------------------------------------------------------
function drawZ2(c, w, h, dt, time) {
  const z = S.z2, t = T[lang], fs = clamp(w * 0.03, 10, 13);
  if (z.t >= 0) z.t += dt;
  const gas = z2Gas(), reading = z2Reading();
  const cx = w * 0.3, bw = Math.min(w * 0.22, h * 0.32), bh = h * 0.34, bTop = h * 0.3, nw = bw * 0.36, nTop = h * 0.12, bot = bTop + bh;
  const sw = bw * 2.3, sh = Math.max(38, h * 0.15), sTop = bot + 6;
  const water = bot - bh * 0.6;
  // bottle
  const path = () => { c.beginPath(); c.moveTo(cx - nw / 2, nTop); c.lineTo(cx - nw / 2, bTop - 10); c.quadraticCurveTo(cx - nw / 2, bTop, cx - bw / 2, bTop + 14); c.lineTo(cx - bw / 2, bot - 8); c.quadraticCurveTo(cx - bw / 2, bot, cx - bw / 2 + 8, bot); c.lineTo(cx + bw / 2 - 8, bot); c.quadraticCurveTo(cx + bw / 2, bot, cx + bw / 2, bot - 8); c.lineTo(cx + bw / 2, bTop + 14); c.quadraticCurveTo(cx + nw / 2, bTop, cx + nw / 2, bTop - 10); c.lineTo(cx + nw / 2, nTop); };
  c.save(); path(); c.closePath(); c.clip();
  c.fillStyle = 'rgba(90,170,255,.45)'; c.fillRect(cx - bw / 2, water, bw, bot - water);
  // bubbles in the water while it fizzes
  const act = z.t > 0.6 && gas < 1 ? 1 : 0;
  if (act) for (let i = 0; i < 26; i++) { const tb = (time * 0.7 + i * 0.37) % 1.1, y = bot - 6 - (tb / 1.1) * (bot - water - 4); c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc(cx + Math.sin(i * 12.9) * bw * 0.36, y, 1.6 + (i % 3), 0, 6.283); c.fill(); }
  // gas collecting under the lid
  if (z.lid && gas > 0) { c.fillStyle = 'rgba(255,255,255,.6)'; for (let i = 0; i < 50 * gas; i++) c.fillRect(cx - nw / 2 + 2 + rnd(i * 1.3) * (nw - 4) + Math.sin(time * 3 + i) * 1.5, nTop + 14 + rnd(i * 2.1 + 3) * (water - nTop - 24), 2.4, 2.4); }
  c.restore();
  path(); c.strokeStyle = 'rgba(220,235,255,.7)'; c.lineWidth = 2.4; c.stroke();
  if (z.lid) { c.fillStyle = '#c0392b'; rr(c, cx - nw / 2 - 3, nTop - 9, nw + 6, 10, 3); c.fill(); }
  // gas leaving an open bottle
  if (!z.lid && z.t > 0.6 && gas < 1) for (let i = 0; i < 12; i++) { const ph = (time * 0.55 + i / 12) % 1; c.fillStyle = `rgba(255,255,255,${(1 - ph) * 0.6})`; c.beginPath(); c.arc(cx + Math.sin(i * 5.7 + time) * (6 + ph * 22), nTop - ph * h * 0.12, 2.5 + ph * 3, 0, 6.283); c.fill(); }
  // the tablet: beside the bottle, then lifted over the neck and dropped in
  const tx0 = cx + bw * 0.95, ty0 = sTop - 4;
  let tx = tx0, ty = ty0;
  if (z.t >= 0) { const a = ease(z.t / 0.3), b = ease((z.t - 0.3) / 0.3); tx = lerp(tx0, cx, a); ty = lerp(ty0, nTop - 24, a); ty = lerp(ty, water + 6, b); }
  if (z.t < 0 || z.t < 0.6) { c.fillStyle = '#f2f2f8'; c.beginPath(); c.ellipse(tx, ty, bw * 0.17, bw * 0.07, 0, 0, 6.283); c.fill(); }
  drawScale(c, cx, sTop, sw, sh, gm(reading, 1));
  // before / after
  if (z.t >= 0.6) {
    const rx = w * 0.7, ok = gas >= 1;
    text(c, t.cv.before, rx, h * 0.3, fs, '#98a0b8', 'center'); text(c, gm(254, 1), rx, h * 0.3 + fs * 2.1, fs * 1.8, '#edeff7', 'center', 900);
    text(c, ok ? t.cv.after : t.cv.now, rx, h * 0.3 + fs * 4.4, fs, '#98a0b8', 'center'); text(c, gm(reading, 1), rx, h * 0.3 + fs * 6.5, fs * 1.8, z.lid ? '#3ddc97' : '#f5c84c', 'center', 900);
    if (!z.lid && gas > 0.02) label(c, `${t.cv.lost}: ${gm(gas, 1)} (${t.cv.gas})`, rx, h * 0.3 + fs * 8.8, fs, '#f5c84c', w);
  }
}

// ---------------------------------------------------------------------------------------------------------
// 12. Main loop
// ---------------------------------------------------------------------------------------------------------
let acc = 0;
const cl = canvasLoop($('cv'), (c, w, h, dt, time) => {
  const m = mode();
  if (m === 'dissolve') drawD(c, w, h, dt, time);
  else if (m === 'back') drawB(c, w, h, dt, time);
  else if (m === 'limit') drawL(c, w, h, dt, time);
  else if (m === 's1') drawZ1(c, w, h, dt, time);
  else drawZ2(c, w, h, dt, time);
  acc += dt; if (acc > 0.2) { acc = 0; renderState(); }
});
$('cv').addEventListener('pointerdown', stirAt);
$('cv').addEventListener('pointermove', stirAt);
renderCtrl(); renderState();
</script>
</body>
