// --- small helpers ------------------------------------------------------------------------------------------
function clamp01(x) { return Math.min(1, Math.max(0, x)); }
const ease = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);
const easeBack = (t) => { t = clamp01(t); const c1 = 1.70158, c3 = c1 + 1; return Math.max(0, 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2)); };
const hex2 = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgba = (h, a) => { const [r, g, b] = hex2(h); return `rgba(${r},${g},${b},${a})`; };
const mixc = (a, b, t) => { const A = hex2(a), B = hex2(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const shade = (h, k) => (k < 0 ? mixc(h, '#000000', -k) : mixc(h, '#ffffff', k));
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); };
const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); };
const rrect = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); };
const heartPath = (c, x, y, s) => {
  c.beginPath(); c.moveTo(x, y + s * .9);
  c.bezierCurveTo(x + s * 1.5, y - s * .1, x + s * .9, y - s * 1.3, x, y - s * .5);
  c.bezierCurveTo(x - s * .9, y - s * 1.3, x - s * 1.5, y - s * .1, x, y + s * .9); c.closePath();
};
const dropPath = (c, x, y, r) => {
  c.beginPath(); c.moveTo(x, y - r * 2);
  c.quadraticCurveTo(x + r * 1.1, y - r * .4, x + r * .95, y + r * .1);
  c.arc(x, y + r * .1, Math.max(0, r * .95), 0, Math.PI);
  c.quadraticCurveTo(x - r * 1.1, y - r * .4, x, y - r * 2); c.closePath();
};
const sparkle = (c, x, y, r, col, a) => {
  c.save(); c.globalAlpha = clamp01(a); c.fillStyle = col; c.beginPath();
  for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * .28 : r, an = i * Math.PI / 4 - Math.PI / 2; c.lineTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr); }
  c.closePath(); c.fill(); c.restore();
};
const glow = (c, x, y, r, col, a) => {
  if (a < .01) return;
  const g = c.createRadialGradient(x, y, 0, x, y, Math.max(.1, r));
  g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; circ(c, x, y, r); c.fill();
};
const blinkOf = (t) => { const p = t % 4.3; return p < .14 ? 1 - Math.sin(p / .14 * Math.PI) : 1; };

// --- the child, the faces and the body ----------------------------------------------------------------------
function hairPath(c) {
  c.beginPath(); c.moveTo(-15.8, 1);
  c.bezierCurveTo(-18, -14, -9, -20.5, 0, -20.2);
  c.bezierCurveTo(10, -20.5, 18, -14, 15.8, 1);
  c.bezierCurveTo(15.5, -6, 11, -9.5, 5, -10.5);
  c.bezierCurveTo(1, -12.5, -6, -12.5, -9, -9);
  c.bezierCurveTo(-12, -6.5, -15, -4, -15.8, 1);
  c.closePath();
}
function mouth(c, f) {
  const wv = 4.7 * f.w, endY = -f.curve * 1.5, C = endY + f.curve * 5.2, gap = f.open * 7.5;
  c.save(); c.translate(0, 8.8); c.lineJoin = 'round'; c.lineCap = 'round';
  if (gap > .5) {
    const C2 = C + gap * 2;
    const lens = () => { c.beginPath(); c.moveTo(-wv, endY); c.quadraticCurveTo(0, C, wv, endY); c.quadraticCurveTo(0, C2, -wv, endY); c.closePath(); };
    lens(); c.fillStyle = '#5B2432'; c.fill();
    c.save(); lens(); c.clip();
    if (f.teeth > .05) { c.fillStyle = '#FBF7EE'; c.fillRect(-wv - 1, Math.min(endY, (endY + C) / 2) - 1, wv * 2 + 2, 1 + gap * .55 * f.teeth + Math.abs(f.curve) * 1.4); }
    if (f.curve > .5 && f.open > .4) { ell(c, 0, (endY + C2) / 2 - gap * .1, wv * .5, gap * .32); c.fillStyle = '#E8707F'; c.fill(); }
    c.restore();
    lens(); c.lineWidth = 1.05; c.strokeStyle = '#4A1C28'; c.stroke();
  } else {
    c.beginPath(); c.moveTo(-wv, endY); c.quadraticCurveTo(0, C, wv, endY);
    c.lineWidth = 1.7; c.strokeStyle = '#6B2E3A'; c.stroke();
  }
  c.restore();
}
function brows(c, f, hair) {
  c.strokeStyle = hair; c.lineWidth = 1.9; c.lineCap = 'round';
  const by = -6.6 - f.by * 2.3;
  for (const s of [-1, 1]) {
    const iy = by - f.tilt * 2.8, ox = s * 9.4, oy = by + f.tilt * 1.1;
    c.beginPath(); c.moveTo(s * 2.4, iy); c.quadraticCurveTo(s * 6, (iy + oy) / 2 - 1.1, ox, oy); c.stroke();
  }
}
function eyes(c, f, t, bl) {
  const open = Math.max(0, f.eye * bl), gx = Math.sin(t * .6) * .5;
  for (const s of [-1, 1]) {
    const x = s * 5.5, y = 1.8;
    c.globalAlpha = 1 - clamp01(f.cres);
    if (open > .06 && f.cres < .98) {
      const rx = 3.6, ry = 4.4 * open;
      ell(c, x, y, rx, ry); c.fillStyle = '#fff'; c.fill(); c.lineWidth = .8; c.strokeStyle = 'rgba(40,25,40,.5)'; c.stroke();
      c.save(); ell(c, x, y, rx, ry); c.clip();
      circ(c, x + gx, y + .3, 2.35 * f.pupil); c.fillStyle = '#2B2233'; c.fill();
      circ(c, x + gx - .8, y - .7, .9); c.fillStyle = '#fff'; c.fill();
      circ(c, x + gx + .9, y + 1, .45); c.fill();
      c.restore();
    }
    c.globalAlpha = clamp01(f.cres);
    if (f.cres > .02) { c.beginPath(); c.arc(x, y + 1.4, 3.3, Math.PI * 1.1, Math.PI * 1.9); c.lineWidth = 1.6; c.lineCap = 'round'; c.strokeStyle = '#2B2233'; c.stroke(); }
  }
  c.globalAlpha = 1;
}
// the head, drawn about its own centre; head radius is about 15 units
function drawHead(c, f, t, ex) {
  const hair = ex.hair || '#4A2F22', skin = COL.skin;
  c.globalAlpha = 1; c.lineWidth = .9; c.strokeStyle = 'rgba(90,45,25,.4)';
  for (const s of [-1, 1]) { ell(c, s * 15.2, 1.6, 2.7, 3.5); c.fillStyle = shade(skin, -.08); c.fill(); c.stroke(); }
  if (ex.bun) { circ(c, 0, -20.5, 5.6); c.fillStyle = hair; c.fill(); }
  const g = c.createRadialGradient(-5, -7, 2, 0, 0, 19);
  g.addColorStop(0, shade(skin, .28)); g.addColorStop(.55, skin); g.addColorStop(1, shade(skin, -.16));
  ell(c, 0, 0, 15.4, 16.2); c.fillStyle = g; c.fill(); c.stroke();
  const bl = clamp01(f.blush);
  if (bl > .02) for (const s of [-1, 1]) { circ(c, s * 8.8, 6.6, 3.3); c.fillStyle = rgba('#FF8A7A', .38 * bl); c.fill(); }
  if (ex.heat > .01) {
    const hg = c.createRadialGradient(0, 3, 2, 0, 3, 17);
    hg.addColorStop(0, rgba(COL.anger, .62 * ex.heat)); hg.addColorStop(1, rgba(COL.anger, .2 * ex.heat));
    ell(c, 0, 0, 15.4, 16.2); c.fillStyle = hg; c.fill();
  }
  hairPath(c);
  const hg2 = c.createLinearGradient(-14, -20, 12, -4); hg2.addColorStop(0, shade(hair, .22)); hg2.addColorStop(1, hair);
  c.fillStyle = hg2; c.fill(); c.lineWidth = .9; c.strokeStyle = 'rgba(15,10,20,.55)'; c.stroke();
  c.beginPath(); c.arc(-3, -14, 9, Math.PI * 1.15, Math.PI * 1.55); c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 1.2; c.lineCap = 'round'; c.stroke();
  brows(c, f, shade(hair, -.2));
  eyes(c, f, t, blinkOf(t + (ex.seed || 0)));
  mouth(c, f);
  if (ex.tears > .05) {
    for (const s of [-1, 1]) for (let k = 0; k < 2; k++) {
      const p = (t * .55 + k * .5 + (s > 0 ? .27 : 0)) % 1;
      c.globalAlpha = Math.sin(p * Math.PI) * clamp01(ex.tears);
      dropPath(c, s * 6.6, 4.6 + p * 9, .95); c.fillStyle = '#A9CBFF'; c.fill();
    }
    c.globalAlpha = 1;
  }
  if (ex.sweat > .3) {
    const p = (t * .35) % 1; c.globalAlpha = clamp01(ex.sweat) * Math.sin(p * Math.PI);
    dropPath(c, 12.2, -9 + p * 6, 1.3); c.fillStyle = '#BFE0FF'; c.fill(); c.globalAlpha = 1;
  }
}

// the whole child: feet at (x, y), one unit is u pixels, the child is about 100 units tall
function drawPerson(c, o) {
  const { x, y, u, t, Z, face } = o, shirt = o.shirt || COL.shirt, pants = o.pants || '#39406B', hair = o.hair || '#4A2F22';
  const hop = Math.max(Z.bouncy, o.hop || 0), hopY = hop ? Math.abs(Math.sin(t * 7)) * hop * 5 : 0;
  const trem = (Z.heart * .35 + Z.fists * .2) * Math.sin(t * 31) * .35;
  const wF = Z.fists, wH = Math.min(1, Math.max(Z.heavy, Z.tears * .5, Z.throat * .3)), wB = Z.bouncy, wX = Z.heart, sum = Math.max(1, wF + wH + wB + wX);
  const sway = Math.sin(t * 7) * 9 * wB;
  const a1 = 10 + ((16 - 10) * wF + (3 - 10) * wH + (118 - 10) * wB + (24 - 10) * wX) / sum + sway;
  const a2 = 6 + ((12 - 6) * wF + (2 - 6) * wH + (138 - 6) * wB + (-100 - 6) * wX) / sum + sway;
  const shrug = wF * 1.8, d = wH * 3.2, hy = -80 + wH * 5.2, sy = -57 + d - shrug;
  c.save(); c.translate(x, y);
  // shadow on the floor
  c.save(); c.translate(0, 1); c.scale(1, .17);
  const sg = c.createRadialGradient(0, 0, 0, 0, 0, 27 * u * (1 - hopY * .02));
  sg.addColorStop(0, 'rgba(5,6,16,.5)'); sg.addColorStop(1, 'rgba(5,6,16,0)'); c.fillStyle = sg; circ(c, 0, 0, 27 * u); c.fill(); c.restore();
  c.scale(u, u); c.translate(trem, -hopY); c.lineJoin = 'round'; c.lineCap = 'round';
  const ol = 'rgba(10,12,30,.5)';
  // legs and shoes
  for (const s of [-1, 1]) {
    const lg = c.createLinearGradient(s * 6.2 - 4.7, 0, s * 6.2 + 4.7, 0); lg.addColorStop(0, shade(pants, .14)); lg.addColorStop(1, shade(pants, -.16));
    rrect(c, s * 6.2 - 4.7, -33, 9.4, 30, 3.5); c.fillStyle = lg; c.fill(); c.lineWidth = .9; c.strokeStyle = ol; c.stroke();
    ell(c, s * 7.2, -2.6, 7, 3.7); c.fillStyle = COL.ink; c.fill(); c.stroke();
    ell(c, s * 7.2 + s * 1.5, -1.2, 5.2, 1.5); c.fillStyle = 'rgba(0,0,0,.14)'; c.fill();
  }
  // neck and T-shirt
  rrect(c, -3.4, -66 + d, 6.8, 9, 2.5); c.fillStyle = shade(COL.skin, -.1); c.fill();
  const tg = c.createLinearGradient(-14, 0, 14, 0); tg.addColorStop(0, shade(shirt, .2)); tg.addColorStop(.5, shirt); tg.addColorStop(1, shade(shirt, -.2));
  rrect(c, -14, -59 + d - shrug, 28, 29 - d + shrug, 7); c.fillStyle = tg; c.fill(); c.lineWidth = .9; c.strokeStyle = ol; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1.8; c.beginPath(); c.moveTo(-13, -37); c.lineTo(13, -37); c.stroke();
  ell(c, 0, -59 + d - shrug, 5.3, 3.1); c.fillStyle = shade(COL.skin, -.12); c.fill();
  // arms: sleeve, forearm, hand
  const handPos = [];
  for (const s of [-1, 1]) {
    const p0 = [s * 14.2, sy + 1], r1 = a1 * Math.PI / 180, r2 = a2 * Math.PI / 180;
    const p1 = [p0[0] + s * Math.sin(r1) * 14, p0[1] + Math.cos(r1) * 14], p2 = [p1[0] + s * Math.sin(r2) * 13.5, p1[1] + Math.cos(r2) * 13.5];
    handPos.push(p2);
    const seg = (pa, pb, wd, col) => {
      c.strokeStyle = ol; c.lineWidth = wd + 1.4; c.beginPath(); c.moveTo(...pa); c.lineTo(...pb); c.stroke();
      c.strokeStyle = col; c.lineWidth = wd; c.beginPath(); c.moveTo(...pa); c.lineTo(...pb); c.stroke();
    };
    const sk = mixc(COL.skin, COL.anger, wF * .3);
    seg(p1, p2, 6.6, sk); seg(p0, p1, 8.6, shirt);
    circ(c, p2[0], p2[1], 4.2 + wF * 1.2); c.fillStyle = sk; c.fill(); c.lineWidth = .9; c.strokeStyle = ol; c.stroke();
    if (wF > .3) { c.strokeStyle = `rgba(120,50,40,${.6 * wF})`; c.lineWidth = .7; for (let k = -1; k <= 1; k++) { c.beginPath(); c.moveTo(p2[0] - 2.4, p2[1] + k * 1.6); c.lineTo(p2[0] + 2.4, p2[1] + k * 1.6); c.stroke(); } }
  }
  // head
  c.save(); c.translate(0, hy); c.rotate(wH * .08);
  drawHead(c, face, t, { hair, bun: o.bun, heat: Z.face, tears: Z.tears, sweat: Z.heart, seed: o.seed });
  c.restore();
  // body glows and little effects (all in the same units)
  const a = (k) => clamp01(Z[k]);
  if (a('face') > .02) {
    glow(c, 0, hy, 24, COL.anger, .42 * a('face'));
    c.lineWidth = 1.3; c.lineCap = 'round';
    for (let k = 0; k < 3; k++) {
      const p = (t * .9 + k * .33) % 1, x0 = -8 + k * 8, y0 = hy - 20 - p * 10;
      c.globalAlpha = Math.sin(p * Math.PI) * a('face'); c.strokeStyle = COL.anger;
      c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(x0 + 2.4, y0 - 3, x0, y0 - 6); c.quadraticCurveTo(x0 - 2.4, y0 - 9, x0, y0 - 12); c.stroke();
    }
    c.globalAlpha = 1;
  }
  if (a('fists') > .02) for (const hp of handPos) glow(c, hp[0], hp[1], 11, COL.anger, .62 * a('fists'));
  if (a('heart') > .02) {
    const hz = 1.1 + 2.6 * a('heart'), ph = (t * hz) % 1, pulse = Math.pow(Math.max(0, Math.sin(ph * Math.PI)), 3);
    glow(c, 6, -49, 15, COL.fear, .55 * a('heart'));
    c.strokeStyle = rgba(COL.fear, (1 - ph) * .7 * a('heart')); c.lineWidth = 1; circ(c, 6, -49, 4 + ph * 12); c.stroke();
    heartPath(c, 6, -49, 2.9 * (1 + .28 * pulse) * (.6 + .4 * a('heart'))); c.fillStyle = shade(COL.fear, .3); c.fill(); c.lineWidth = .7; c.strokeStyle = shade(COL.fear, -.35); c.stroke();
  }
  if (a('tummy') > .02) {
    glow(c, 0, -38, 13, COL.fear, .42 * a('tummy'));

  $('flNextRow').style.display = done ? '' : 'none';
  $('flNext').textContent = (kind === 'size' || R.i < 2) ? t.next : t.again;
}
function renderFree(t, sec) {
  $('flFam').innerHTML = FAMS.map((k) => `<button class="chip ${V.fam === k ? 'on' : ''}" data-act="fam" data-k="${k}"><i class="fl-dot" style="background:${COL[k]}"></i>${esc(t.fam[k])}</button>`).join('');
  $('flRange').style.setProperty('--track', `linear-gradient(90deg, ${COL.calm}, ${COL[V.fam]})`);
  $('flRange').value = Math.round(V.Lt * 100); $('flRange').setAttribute('aria-label', t.name);
  $('twoJn').textContent = t.fam.joy; $('twoFn').textContent = t.fam.fear;
  $('twoJ').style.setProperty('--track', `linear-gradient(90deg, rgba(130,145,190,.25), ${COL.joy})`);
  $('twoF').style.setProperty('--track', `linear-gradient(90deg, rgba(130,145,190,.25), ${COL.fear})`);
  $('twoJ').value = Math.round(S.two.j * 100); $('twoF').value = Math.round(S.two.f * 100);
  $('fcBn').textContent = t.sec.brows; $('fcMn').textContent = t.sec.mouth;
  $('fcB').style.setProperty('--track', 'linear-gradient(90deg, #FF6B5B, rgba(130,145,190,.35), #9B7BFF)');
  $('fcM').style.setProperty('--track', 'linear-gradient(90deg, #6D9BFF, rgba(130,145,190,.35), #FFC94D)');
  $('fcB').value = Math.round(S.face.b * 100); $('fcM').value = Math.round(S.face.m * 100);
  const open = secret.unlocked();
  const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('flChips').innerHTML = chip('two', '🎢') + chip('face', '🎭') + `<button class="chip" data-act="again">${esc(t.again)}</button>`;
}
function renderReadout() {
  const t = T[lang], v = lab.view, M = modeOf(), R = S[v];
  const dots = (R) => [0, 1, 2].map((n) => (n < R.i ? '●' : n === R.i ? '◉' : '○')).join(' ');
  if (M === 'free') {
    const wd = wordIdx(V.Lt);
    lab.setReadout(esc(wd < 0 ? t.s.calm : t.s.levels[V.fam][wd]), wd < 0 ? '' : t.fam[V.fam], '', wd < 0 ? COL.calm : COL[V.fam]);
  } else if (M === 'two') lab.setReadout('🎢', '', '', COL.fear);
  else if (M === 'face') { const gw = guessOf(S.face.b, S.face.m); lab.setReadout(GUESS_EMO[gw], '', t.sec.looks(t.sec.looksWords[gw]), COL.joy); }
  else if (v === 'size') lab.setReadout(R.phase === 'done' ? esc(t.s.o[R.i][SIZE_RIGHT[R.i]]) : '?', dots(R), '', COL[FAMS[R.i]]);
  else if (v === 'body') lab.setReadout({ anger: '😠', fear: '😨', sad: '😢' }[B_FAM[R.i]], dots(R), '', COL[B_FAM[R.i]]);
  else lab.setReadout(['🧱', '🚪', '🎈'][R.i], dots(R), '', COL[W_FAM[R.i]]);
}
function renderCard(t, v, sec) {
  if (sec === 'two') return lab.setState({ emo: '🎢', title: t.secrets.two[0], lead: t.sec.twoText, body: '', extra: '' });
  if (sec === 'face') return lab.setState({ emo: '🎭', title: t.secrets.face[0], lead: t.sec.faceText, body: '', extra: '' });
  const [emo, title, lead, body] = t.card[v][S[v].complete ? 'f' : 'n'];
  lab.setState({ emo, title, lead, body, extra: '' });
}
setupRound('size');
render();
</script>
