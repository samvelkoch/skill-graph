    c.lineWidth = 3.5; c.lineCap = 'round'; c.strokeStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc(cx, cy, 16, 0, Math.PI * 2); c.stroke();
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 5; c.beginPath(); c.arc(cx, cy, 16, 0, Math.PI * 2); c.stroke();
    c.strokeStyle = '#22263d'; c.lineWidth = 3.5; c.beginPath(); c.arc(cx, cy, 16, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p); c.stroke();
  }
  c.beginPath(); c.arc(cx, cy, 5.5, 0, Math.PI * 2); c.fillStyle = '#0b0b10'; c.fill();
  const below = top + ch + 12, t = T[lang].ai;
  if (k < .98) {
    c.save(); c.globalAlpha = 1 - k;
    const msg = A.phase === 'see' ? t.look : t.instr;
    let y = pillText(c, msg, cx, below, w - 28);
    if (A.phase === 'stare') pillText(c, `${A.sec} ${t.sec}`, cx, y + 6, 120);
    c.restore();
  }
  if (k > .02) {
    const R2 = Math.max(10, Math.min(w * .22, (h - below - 40) / 2)), cy2 = below + R2 + 4, p = A.slide;
    c.save(); c.globalAlpha = k;
    drawWheel(c, cx, cy2, R2, 0, { hi: [set.oi], pins: [{ i: set.si, label: '', fill: '#fff', ink: '#1b1e30' }], line: { a: set.si, b: set.oi, p } });
    c.restore();
    c.globalAlpha = k; pillText(c, `${t.names[set.k][0]} → ${t.names[set.k][1]}`, cx, cy2 + R2 + 8, w - 28); c.globalAlpha = 1;
  }
}

// --- view 3: make it pop -------------------------------------------------------------------------------------------
function drawPoster(c, x, y, w, h, bg, fg, word) {
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 20; c.shadowOffsetY = 8;
  c.beginPath(); c.roundRect(x, y, w, h, Math.min(16, w * .08)); c.fillStyle = lg(c, x, y, x + w, y + h, [[0, light(bg, .05)], [1, dark(bg, .05)]]); c.fill(); c.restore();
  c.lineWidth = 1.5; c.strokeStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.roundRect(x, y, w, h, Math.min(16, w * .08)); c.stroke();
  c.save(); c.beginPath(); c.roundRect(x + w * .05, y + w * .05, w * .9, h - w * .1, Math.min(10, w * .05)); c.lineWidth = Math.max(1, w * .012); c.strokeStyle = fg; c.globalAlpha = .55; c.stroke(); c.restore();
  let fs = h * .17; c.font = `900 ${fs}px Nunito, sans-serif`;
  const tw = c.measureText(word).width; if (tw > w * .74) { fs *= w * .74 / tw; c.font = `900 ${fs}px Nunito, sans-serif`; }
  c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(word, x + w / 2, y + h * .28);
  const s = Math.min(w * .27, h * .17), cx = x + w / 2, cy = y + h * .65;
  c.lineJoin = 'round'; shapePath(c, 'star', cx, cy, s); c.fillStyle = fg; c.fill(); c.lineWidth = Math.max(1, s * .12); c.strokeStyle = fg; c.stroke();
  c.fillRect(x + w * .24, y + h * .87, w * .52, Math.max(2, h * .012));
}
function drawPosterView(c, w, h) {
  const t = T[lang], bg = COLS[S.pbg], fg = COLS[S.pfg];
  let ph = h * .8, pw = ph * .75;
  if (pw > w * .56) { pw = w * .56; ph = pw / .75; }
  const gw = Math.min(w - pw - 44, pw * .62), gh = gw / .75, px = (w - pw - gw - 18) / 2, py = (h - ph) / 2;
  drawPoster(c, px, py, pw, ph, bg, fg, t.po.word);
  const gx = px + pw + 18, gy = py + (ph - gh) / 2 - 12;
  drawPoster(c, gx, gy, gw, gh, greyOf(bg), greyOf(fg), t.po.word);
  pillText(c, t.po.gray, gx + gw / 2, gy + gh + 10, gw + 24);
}

// --- secret a: red and green stripes -------------------------------------------------------------------------------
function drawStripes(c, w, h) {
  const x = 14, y = 14, ww = w - 28, hh = h - 28 - 38, sw = S.sw, cols = S.spair ? [COLS[4], COLS[2]] : [COLS[4], COLS[10]];
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 20; c.shadowOffsetY = 6; c.beginPath(); c.roundRect(x, y, ww, hh, 18); c.fillStyle = '#222'; c.fill(); c.restore();
  c.save(); c.beginPath(); c.roundRect(x, y, ww, hh, 18); c.clip();
  for (let px = x, i = 0; px < x + ww; px += sw, i++) { c.fillStyle = cols[i % 2]; c.fillRect(px, y, sw + .5, hh); }
  c.restore();
  c.lineWidth = 1.5; c.strokeStyle = 'rgba(0,0,0,.45)'; c.beginPath(); c.roundRect(x, y, ww, hh, 18); c.stroke();
  pillText(c, T[lang].sa.pair[S.spair], w / 2, y + hh + 8, w - 28);
}

canvasLoop(cv, (c, w, h, dt, time) => {
  W = w; H = h; c.lineJoin = 'round';
  if (S.sec === 'a') { G.wheel = null; drawStripes(c, w, h); return; }
  if (S.sec === 'b') { G.wheel = null; drawAI(c, w, h, dt, time, S.ap); return; }
  if (lab.view === 'pairs') drawPairs(c, w, h, dt, time);
  else { G.wheel = null; if (lab.view === 'afterimage') drawAI(c, w, h, dt, time, S.ai); else drawPosterView(c, w, h); }
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, n = +b.dataset.n, P = S.pr;
  if (act === 'pick') {
    P.pick = n; P.phase = 'rev'; P.t0 = now(); P.rot0 = S.rot; P.right[P.i] = n === (ROUNDS[P.i].a + 6) % 12; S.pa = ROUNDS[P.i].a; S.pb = n;
    (P.right[P.i] ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next') { P.i++; P.phase = 'ask'; P.pick = null; sfx.click(); }
  else if (act === 'finish') { P.phase = 'free'; S.pa = ROUNDS[2].a; S.pb = P.pick; S.act = 2; sfx.click(); }
  else if (act === 'again') { S.pr = { i: 0, phase: 'ask', pick: null, right: [], t0: 0, rot0: 0 }; sfx.click(); }
  else if (act === 'pin') { S.act = n; sfx.tick(); }
  else if (act === 'setc') { S[S.act === 1 ? 'pa' : 'pb'] = n; sfx.tick(); }
  else if (act === 'aiGuess' || act === 'apGuess') { S.ai.guess = n; S.ai.phase = 'ready'; sfx.click(); }
  else if (act === 'aiStart') { const A = b.dataset.a === 'ap' ? S.ap : S.ai; A.phase = 'stare'; A.t0 = now(); A.sec = 20; A.slide = 0; A.kk = 0; sfx.click(); showStage(); }
  else if (act === 'aiStop') { const A = b.dataset.a === 'ap' ? S.ap : S.ai; A.phase = A.quiz && A.guess === null ? 'predict' : 'ready'; sfx.click(); }
  else if (act === 'aiSee') { S.ai.seen = n; S.ai.phase = 'explain'; S.ai.slide = 0; (S.ai.guess === S.ai.set.ok ? sfx.good : sfx.click)(); showStage(); }
  else if (act === 'aiNext') { S.ai = S.ai.k === 0 ? newAI(1, true) : newAI(0, true); sfx.click(); }
  else if (act === 'apAgain') { S.ap = newAI(2, false); sfx.click(); }
  else if (act === 'pbg') { S.pbg = n; sfx.tick(); }
  else if (act === 'pfg') { S.pfg = n; sfx.tick(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null; else { S.sec = k; if (k === 'b') S.ap = newAI(2, false); else { S.sw = 3; S.spair = 0; } }
    sfx.click();
  } else if (act === 'spair') { S.spair = n; sfx.tick(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'cwSl') { const A = S.sec === 'b' ? S.ap : S.ai; A.slide = clamp(+ev.target.value, 0, 1); }
  else if (id === 'cwSw') S.sw = clamp(Math.round(+ev.target.value), 2, 40);
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
let lastCtl = '';
function setCtl(html) { if (html !== lastCtl) { $('ctrlBody').innerHTML = html; lastCtl = html; } }
const swatches = (act, cur, list) => `<div class="cw-sws">${list.map((i) => `<button class="cw-sw ${i === cur ? 'on' : ''}" data-act="${act}" data-n="${i}" style="background:${COLS[i]}" aria-label="${esc(nm(i))}" title="${esc(nm(i))}"></button>`).join('')}</div>`;
const roPair = (a, b) => `<span class="cw-ro">${dot(a)}${esc(nm(a))} + ${dot(b)}${esc(nm(b))}</span>`;
const ALL12 = [...Array(12).keys()];

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = S.sec ? 'pairs' : v;
  let r;
  if (S.sec === 'a') r = renderStripes(t); else if (S.sec === 'b') r = renderAI(t, S.ap, 'ap'); else r = v === 'pairs' ? renderPairs(t) : v === 'afterimage' ? renderAI(t, S.ai, 'ai') : renderPoster(t);
  const sc = (k, emo) => { const open = secret.unlocked(); return `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`; };
  setCtl(`${r.ctl}<div class="cw-row">${sc('a', '🎄')}${sc('b', '🍎')}</div>`);
  const sl = $('cwSl'); if (sl) sl.value = (S.sec === 'b' ? S.ap : S.ai).slide;
  const sw = $('cwSw'); if (sw) sw.value = S.sw;
  lab.setReadout(r.ro[0], r.ro[1], r.ro[2], r.color);
  lab.setState(r.st);
  lab.setFacts(t.facts[S.sec === 'b' ? 'afterimage' : S.sec === 'a' ? 'pairs' : v].map((f) => ({ emo: f.emo, text: f.text, src: f.src })));
}

function renderPairs(t) {
  const P = S.pr, rd = ROUNDS[P.i], color = '#e2552a';
  if (P.phase === 'ask') {
    const q = t.pr.q(nm(rd.a));
    return { color, ctl: `<div class="cw-q">${esc(q)}</div><div class="cw-opts">${rd.opts.map((o) => `<button class="cw-opt" data-act="pick" data-n="${o}"><i style="background:${COLS[o]}"></i>${esc(nm(o))}</button>`).join('')}</div>`,
      ro: ['?', t.pr.round(P.i + 1), ''], st: { emo: '🎨', title: q, lead: t.pr.pick, body: '', extra: '' } };
  }
  if (P.phase === 'rev') {
    const opp = (rd.a + 6) % 12, ok = P.pick === opp, rel = relOf(rd.a, P.pick), across = t.pr.across(nm(rd.a), nm(opp)), lead = t.relTxt.opp(cap(nm(rd.a)), nm(opp));
    const head = ok ? t.right : t.pr.guess(nm(P.pick));
    return { color, ctl: `<div class="cw-v" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(head)}</div><p class="cw-note">${esc(across)}</p><button class="btn" data-act="${P.i < 2 ? 'next' : 'finish'}">${esc(P.i < 2 ? t.pr.next : t.pr.finish)}</button>`,
      ro: [roPair(rd.a, P.pick), '', t.rel[rel]], st: { emo: ok ? '✅' : '🤔', title: head, lead: across, body: lead, extra: '' } };
  }
  const a = S.pa, b = S.pb, rel = relOf(a, b), k = P.right.filter(Boolean).length;
  const ctl = `<div class="row2" style="margin-top:0"><div class="card seg small">${[1, 2].map((n) => `<button data-act="pin" data-n="${n}" class="${S.act === n ? 'on' : ''}">${esc(t.pr.pin[n - 1])}</button>`).join('')}</div><button class="chip" data-act="again">${esc(t.pr.again)}</button></div>
    <div style="margin-top:12px">${swatches('setc', S.act === 1 ? a : b, ALL12)}</div>`;
  return { color, ctl, ro: [roPair(a, b), '', t.rel[rel]],
    st: { emo: '🎨', title: cap(t.rel[rel]), lead: `${cap(nm(a))} + ${nm(b)}`, body: relLead(t, rel, a, b), extra: P.right.length === 3 ? `<b>${esc(t.pr.end(k))}</b> ${esc(t.pr.endLead)}` : '' } };
}

function renderAI(t, A, id) {
  const q = t.ai, set = A.set, color = '#d84a5a', opts = q.o[A.k] || [];
  const stop = `<button class="chip" data-act="aiStop" data-a="${id}">${esc(q.stop)}</button>`;
  const start = `<button class="btn cw-big" data-act="aiStart" data-a="${id}">${esc(q.start)}</button>`;
  if (A.phase === 'predict') {
    return { color, ctl: `<div class="cw-q">${esc(q.q)}</div><div class="cw-opts">${opts.map((o, i) => `<button class="chip cw-big" data-act="aiGuess" data-n="${i}">${esc(o)}</button>`).join('')}</div>`,
      ro: ['?', '', ''], st: { emo: '👁️', title: q.q, lead: q.instr, body: '', extra: '' } };
  }
  if (A.phase === 'ready') {
    const g = A.quiz ? q.guess(opts[A.guess]) : T[lang].secrets.b[0];
    return { color, ctl: `${A.quiz ? `<p class="cw-note">${esc(g)}</p>` : `<p class="cw-note">${esc(q.instr)}</p>`}<div class="cw-row" style="margin-top:0">${start}</div>`,
      ro: ['20', q.sec, ''], st: { emo: A.quiz ? '👁️' : '🍎', title: g, lead: q.instr, body: '', extra: '' } };
  }
  if (A.phase === 'stare') {
    return { color, ctl: `<p class="cw-note">${esc(q.stareT)}</p><div class="cw-row" style="margin-top:0">${stop}</div>`,
      ro: [String(A.sec), q.sec, ''], st: { emo: '👁️', title: q.stareT, lead: q.instr, body: '', extra: '' } };
  }
  if (A.phase === 'see') {
    return { color, ctl: `<div class="cw-note">${esc(q.look)}</div><div class="cw-q">${esc(q.see)}</div><div class="cw-opts">${opts.map((o, i) => `<button class="chip cw-big" data-act="aiSee" data-n="${i}">${esc(o)}</button>`).join('')}</div>`,
      ro: ['?', '', ''], st: { emo: '👀', title: q.see, lead: q.look, body: '', extra: '' } };
  }
  const right = A.quiz && A.guess === set.ok, head = A.quiz ? (right ? t.right : q.guess(opts[A.guess])) : T[lang].secrets.b[0];
  const last = A.k === 1, track = `linear-gradient(90deg, ${set.col}, ${set.after})`;
  const btn = A.quiz ? `<button class="btn" data-act="aiNext">${esc(last ? q.again : q.next)}</button>` : `<button class="btn" data-act="apAgain">${esc(q.again)}</button>`;
  return { color, ctl: `<div class="cw-note">${esc(q.slide)}</div><input type="range" class="big cw-sl" id="cwSl" min="0" max="1" step="0.01" style="--track:${track}" aria-label="${esc(q.slide)}">
    <div class="ends"><span>${esc(q.names[set.k][0])}</span><span>${esc(q.names[set.k][1])}</span></div><div class="cw-row" style="margin-top:0">${btn}</div>`,
  ro: [`${dot(set.si)}→ ${dot(set.oi)}`, `${q.names[set.k][0]} → ${q.names[set.k][1]}`, ''], st: { emo: right ? '✅' : '🧠', title: head, lead: q.ex[set.k], body: '', extra: '' } };
}

function renderPoster(t) {
  const a = S.pbg, b = S.pfg, rel = relOf(a, b), color = '#e0a020';
  const gd = Math.abs(hx(greyOf(COLS[a]))[0] - hx(greyOf(COLS[b]))[0]) / 255, gi = gd < .25 ? 2 : gd < .45 ? 1 : 0;
  const all = [...ALL12, 12, 13];
  const ctl = `<div class="cw-lbl" style="margin-top:0">${esc(t.po.bg)}</div>${swatches('pbg', a, all)}<div class="cw-lbl">${esc(t.po.fg)}</div>${swatches('pfg', b, all)}`;
  return { color, ctl, ro: [roPair(a, b), '', t.rel[rel]],
    st: { emo: '🖼️', title: cap(t.rel[rel]), lead: relLead(t, rel, a, b), body: t.po.grey[gi], extra: '' } };
}

function renderStripes(t) {
  const color = '#c8352f', s = t.sa;
  const ctl = `<div class="row2" style="margin-top:0"><div class="card seg small">${s.pair.map((p, i) => `<button data-act="spair" data-n="${i}" class="${S.spair === i ? 'on' : ''}">${esc(p)}</button>`).join('')}</div></div>
    <div class="cw-lbl">${esc(s.width)}</div><input type="range" class="big" id="cwSw" min="2" max="40" step="1" style="--track:linear-gradient(90deg, #E2202C, #2DAA4C)" aria-label="${esc(s.width)}">`;
  return { color, ctl, ro: [`${dot(4)}+ ${dot(S.spair ? 2 : 10)}`, s.pair[S.spair], ''],
    st: { emo: '🎄', title: t.secrets.a[0], lead: t.secrets.a[1], body: S.spair ? s.calm : '', extra: '' } };
}
render();
</script>
