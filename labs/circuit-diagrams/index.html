const inRect = (x, y, r) => r && x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3];
const cutSpot = (h) => { const mid = h.g.L / 2, ext = PARTS.has(h.e.t) ? extOf(h.e, h.z.real, h.z.ps) + CG + 4 : 0; let d = h.along; if (ext && Math.abs(d - mid) < ext) d = d < mid ? mid - ext : mid + ext; return clamp(d, CG + 2, h.g.L - CG - 2); };
function toggleTorch() { const sw = TC.edges.find((e) => e.id === 'sw'); sw.closed = !sw.closed; sfx.click(); render(); }
$('cv').addEventListener('click', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, v = lab.view;
  if (S.sec === 'torch') {
    const h = hitZones(x, y);
    if (inRect(x, y, G.torchBtn) || (h && h.e.t === 'switch' && Math.abs(h.along - h.g.L / 2) < 34)) toggleTorch();
    return;
  }
  if (S.sec) return;
  if (v === 'match') {
    const h = hitZones(x, y); if (!h || h.e.t === 'wire') return;
    const asked = S.pred.match !== null;
    if (!asked) S.sel = S.sel && S.sel.t === h.e.t ? null : { t: h.e.t };
    else { if (h.z.id !== 'T' && h.z.id !== 'B') return; S.sel = S.sel && S.sel.k === h.e.id ? null : { k: h.e.id }; }
    sfx.tick(); render();
  } else if (v === 'read') {
    if (S.pred.read === null) return;
    const h = hitZones(x, y); if (!h || h.e.t === 'cell') return;
    const mid = h.g.L / 2, ext = extOf(h.e, h.z.real, h.z.ps), onPart = PARTS.has(h.e.t) && Math.abs(h.along - mid) <= ext + 6;
    if (h.e.t === 'switch' && onPart) { h.e.closed = !h.e.closed; sfx.click(); }
    else if (h.e.cut !== null) { h.e.cut = null; sfx.snap(); }
    else if (!onPart) { h.e.cut = cutSpot(h); sfx.push(); }
    S.rdSel = { e: h.e, t: S.now };
    render();
  } else if (v === 'build') {
    if (S.pred.build === null) return;
    const s = G.slots.find((q) => inRect(x, y, q.rect)); if (!s) return;
    const i = BC.edges.findIndex((e) => e.id === s.id);
    if (S.pal) { S.board[i] = S.board[i] === S.pal ? null : S.pal; sfx.snap(); }
    else if (S.board[i]) { S.board[i] = null; sfx.tick(); }

$('cv').addEventListener('pointermove', (ev) => {
  if (ev.pointerType === 'touch') return;
  let cur = '';
  if (!S.sec && lab.view === 'read' && S.pred.read !== null) {
    const r = $('cv').getBoundingClientRect(), h = hitZones(ev.clientX - r.left, ev.clientY - r.top);
    if (h && h.e.t !== 'cell') {
      const onPart = PARTS.has(h.e.t) && Math.abs(h.along - h.g.L / 2) <= extOf(h.e, h.z.real, h.z.ps) + 6;
      cur = (h.e.t === 'switch' && onPart) || h.e.cut !== null ? 'pointer' : !onPart ? SCISSORS : '';
    }
  } else if (S.sec === 'torch' || (lab.view === 'match') || (lab.view === 'build' && S.pred.build !== null)) cur = 'pointer';
  $('cv').style.cursor = cur;
});
const SCISSORS = `url("data:image/svg+xml,${encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28'><text x='2' y='22' font-size='22'>✂️</text></svg>")}") 14 14, crosshair`;

// --- sound: a short buzz ------------------------------------------------------------------------------------
let actx = null;
function buzz() {
  if (!store.get('sound', false)) return;
  try {
    actx ??= new (window.AudioContext || window.webkitAudioContext)();
    unmuteIOS(); if (actx.state !== 'running') actx.resume().catch(() => {});
    const t0 = actx.currentTime, g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.07, t0 + 0.03); g.gain.setValueAtTime(0.07, t0 + 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
    g.connect(actx.destination);
    for (const f of [440, 443, 880]) { const o = actx.createOscillator(); o.type = 'square'; o.frequency.value = f; const og = actx.createGain(); og.gain.value = f > 800 ? 0.35 : 1; o.connect(og).connect(g); o.start(t0); o.stop(t0 + 0.52); }
  } catch { /* no audio: stay silent */ }
}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function runTest() {
  const need = NEED[S.task].slice().sort().join(), have = S.board.filter((x) => x && x !== 'wire').sort().join(), full = S.board.every(Boolean);
  if (have !== need) { S.tested = 'parts'; S.run = false; sfx.bad(); }
  else if (!full) { S.tested = 'open'; S.run = false; sfx.bad(); }
  else { S.tested = 'ok'; S.run = true; sfx.good(); if (S.board.includes('buzzer')) buzz(); }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'ask') {
    if (S.pred[v] !== null) return;
    const i = +b.dataset.i, ok = { match: 1, read: 2, build: 2 }[v];
    S.pred[v] = i; (i === ok ? sfx.good : sfx.bad)();
    if (v === 'match') { S.pairT = performance.now() / 1000; S.sel = null; }
    showStage();
  } else if (act === 'togS') { const e = RD.edges.find((x) => x.id === 'sw'); e.closed = !e.closed; sfx.click(); S.rdSel = { e, t: S.now }; }
  else if (act === 'mend') { RD.edges.forEach((e) => { e.cut = null; }); sfx.snap(); }
  else if (act === 'togT') { toggleTorch(); return; }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.sel = null; sfx.click(); showStage();
  } else if (act === 'pal') { S.pal = S.pal === b.dataset.k ? null : b.dataset.k; sfx.tick(); }
  else if (act === 'test') { runTest(); }
  else if (act === 'next') { if (S.task >= 2) S.task = 0; else S.task++; S.board = [null, null, null, null]; S.tested = null; S.run = false; sfx.click(); }
  else if (act === 'clear') { S.board = [null, null, null, null]; S.tested = null; S.run = false; sfx.click(); }
  render();
});

// --- one render per change: controls, readout and the state card ---------------------------------------------
const icon = (k) => ({
  cell: '<path d="M2 14H20M20 3V25M27 9V19M27 14H46" /><path d="M27 8V20" stroke-width="5"/>',
  bulb: '<circle cx="24" cy="14" r="8"/><path d="M18.3 8.3L29.7 19.7M29.7 8.3L18.3 19.7M2 14H16M32 14H46"/>',
  switch: '<path d="M2 18H12M36 18H46M12 18L33 6"/><circle cx="12" cy="18" r="1.6"/><circle cx="36" cy="18" r="1.6"/>',
  buzzer: '<path d="M2 20H12M36 20H46M12 20H36M12 20A12 12 0 0 1 36 20"/>',
  wire: '<path d="M2 14H46"/>',
}[k]);
function askHTML(t, v) {
  const [q, opts, ok, yes, no] = { match: [t.matchAsk, t.matchOpts, 1, t.matchRight, t.matchWrong], read: [t.readAsk, t.readOpts, 2, t.readRight, t.readWrong], build: [t.buildAsk, t.buildOpts, 2, t.buildRight, t.buildWrong] }[v];
  const p = S.pred[v];
  return `<div class="cd-q">${esc(q)}</div><div class="cd-opts">${opts.map((o, i) => `<button type="button" class="cd-opt${p === null ? '' : ` done ${i === ok ? 'ok' : i === p ? 'bad' : 'dim'}`}" data-act="ask" data-i="${i}">${esc(o)}</button>`).join('')}</div>${p === null ? '' : `<div class="cd-v ${p === ok ? 'ok' : 'bad'}">${esc(p === ok ? yes : no)}</div>`}`;
}
const show = (id, on, d = 'block') => { $(id).hidden = !on; if (on) $(id).style.display = d; };
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, asked = S.pred[v] !== null;
  document.body.dataset.v = sec ? 'sec' : v;
  $('cdAsk').style.display = sec ? 'none' : '';
  $('cdAsk').innerHTML = askHTML(t, v);
  show('cdRead', !sec && v === 'read' && asked); show('cdBuild', !sec && v === 'build' && asked); show('cdTorch', sec === 'torch');
  const open = secret.unlocked();
  const sc = (k, emo) => `<button type="button" class="chip secret cd-chip ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k === 'torch' ? 'a' : 'b'][0])}` : '🔒 ???'}</button>`;
  $('cdSecRow').innerHTML = sc('torch', '🔦') + sc('short', '⚡');

    const on = TC.edges.find((e) => e.id === 'sw').closed;
    $('cdTogT').textContent = `🔘 ${on ? t.sClosed : t.sOpen}`;
    ro = [t.lit(on ? t.parts.bulb : t.none), '', on ? t.sClosed : t.sOpen, '#ffd166'];

    ro = [t.lit(t.none), '', t.short, '#ff6b57'];
    st = { emo: '⚡', title: t.secrets.b[0], lead: t.shortText, body: '' };
  } else if (v === 'match') {
    ro = asked ? [t.diagram('B'), '', t.oneLoop, '#c69c6d'] : ['?', '', '', '#c69c6d'];
    st = asked ? { emo: t.st.match[0], title: t.st.match[1], lead: t.st.match[2], body: t.st.match[3] } : { emo: '🤔', title: t.matchAsk, lead: '', body: '' };

  } else if (v === 'read') {
    const sw = RD.edges.find((e) => e.id === 'sw'), name = sw.closed ? t.sClosed : t.sOpen;

      const ana = analyse(RD), names = [...ana.lit].map((e) => e.name).sort();
      ro = [esc(t.lit(names.length ? names.join(` ${t.and} `) : t.none)), '', name, '#ffd166'];
      facts = t.facts.read;
    } else ro = ['?', '', name, '#ffd166'];
    $('cdTogS').textContent = `🔘 ${name}`; $('cdMend').textContent = `🩹 ${t.mend}`; $('cdMend').style.display = RD.edges.some((e) => e.cut !== null) ? '' : 'none';
    $('cdHint').textContent = t.cutHint;
    st = asked ? { emo: t.st.read[0], title: t.st.read[1], lead: t.st.read[2], body: t.st.read[3] } : { emo: '🤔', title: t.readAsk, lead: '', body: '' };
  } else {
    const full = S.board.every(Boolean);
    ro = asked ? [t.task(S.task + 1), '', full ? t.loopClosed : t.loopOpen, '#8ab4f8'] : ['?', '', '', '#8ab4f8'];
    if (asked) {
      facts = t.facts.build;
      $('cdTask').textContent = t.tasks[S.task];
      $('cdPal').innerHTML = PAL.map((k) => `<button type="button" class="cd-pb${S.pal === k ? ' on' : ''}" data-act="pal" data-k="${k}" aria-label="${esc(t.parts[k])}"><svg viewBox="0 0 48 28">${icon(k)}</svg><span>${esc(t.parts[k])}</span></button>`).join('');
      $('cdTest').textContent = t.test; $('cdTest').disabled = S.tested === 'ok';
      const nx = $('cdNext'); nx.hidden = S.tested !== 'ok'; nx.style.display = S.tested === 'ok' ? '' : 'none'; nx.textContent = S.task >= 2 ? '↺' : '→'; nx.setAttribute('aria-label', S.task >= 2 ? t.again : t.next);
      $('cdClear').textContent = '🗑️'; $('cdClear').setAttribute('aria-label', t.clear);
      st = { emo: t.st.build[0], title: t.st.build[1], lead: t.st.build[2], body: `${t.st.build[3]} ${t.cellNote}` };
      if (S.tested === 'parts') st = { emo: '🤔', title: t.wrongParts, lead: t.tasks[S.task], body: '' };
      else if (S.tested === 'open') st = { emo: '🔌', title: cap(t.loopOpen), lead: t.tasks[S.task], body: '' };
