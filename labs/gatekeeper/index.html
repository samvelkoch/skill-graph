// --- conditions ----------------------------------------------------------------------------------------------
const LEVELS = [

function testCond(k, v) {

    case 'shape': return v.s === k.val;
    case 'size': return v.z === k.val;
    case 'even': return v.n % 2 === 0;
    default: return k.op === '>' ? v.n > k.val : k.op === '<' ? v.n < k.val : k.op === '≥' ? v.n >= k.val : v.n === k.val;
  }

function condText(k, t) {
  if (k.attr === 'even') return `${t.attrs.number} ${t.attrs.even}`;
  if (k.attr === 'number') return `${t.attrs.number} ${k.op} ${k.val}`;
  return `${t.attrs[k.attr]} = ${t.vals[k.attr][k.val]}`;

const describe = (v, t) => `${t.vals.colour[v.c]} ${t.vals.shape[v.s]}, ${t.vals.size[v.z]}, ${v.n}`;

// --- state -------------------------------------------------------------------------------------------------
const GOAL_FN = [(v) => v.z === 1, (v) => v.c !== 0, (v) => v.n > 12, (v) => v.s === 2];
const GOAL_SETS = [

  [[0, 0, 1, 4], [1, 1, 0, 12], [2, 2, 1, 7], [0, 1, 0, 15], [1, 0, 1, 9], [2, 0, 0, 3], [0, 2, 1, 18], [1, 2, 0, 6], [2, 1, 1, 10], [1, 0, 0, 13]],
  [[0, 1, 0, 5], [1, 0, 1, 13], [2, 2, 0, 12], [1, 1, 1, 19], [0, 2, 1, 8], [2, 0, 0, 14], [1, 1, 1, 1], [0, 2, 0, 16], [2, 0, 0, 11], [0, 1, 1, 20]],
  [[1, 2, 0, 7], [0, 0, 1, 12], [2, 1, 1, 3], [0, 2, 0, 16], [1, 0, 1, 9], [2, 1, 0, 18], [0, 2, 1, 5], [2, 0, 1, 2], [1, 1, 0, 14], [1, 2, 1, 11]],

const S = {

const lab = shell({ key: 'gatekeeper', T, topics: TOPICS, views: ['find', 'write', 'input'], onLang: render, onView: onView });
const secret = secretLab('gatekeeper', () => ({
  secrets: [{ emo: '🚪', title: T[lang].secrets.doors[0], desc: T[lang].secrets.doors[1] }, { emo: '🐞', title: T[lang].secrets.bug[0], desc: T[lang].secrets.bug[1] }],
  questions: T[lang].quiz,

function newThreshold() { S.I.t = 20 + 5 * pick(9); }
newThreshold();

// --- dealing visitors ----------------------------------------------------------------------------------------------
const mkV = () => ({ c: pick(3), s: pick(3), z: pick(2), n: 1 + pick(20) });
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = pick(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function dealTray() {

  } else if (S.sec === 'bug') {
    t = shuffle([10, 9, 11, 12, 8, 10].map((n) => ({ ...mkV(), n })));
  } else {
    for (let i = 0; i < 60; i++) {
      t = Array.from({ length: 6 }, mkV);
      const keys = new Set(t.map((v) => `${v.c}${v.s}${v.z}${v.n}`)), cnt = t.filter((v) => testCond(LEVELS[S.lvl], v)).length;

dealTray();

function destOf(v) {

  if (S.sec === 'bug') return (S.bugFix ? v.n >= 10 : v.n > 10) ? 0 : 1;
  return testCond(LEVELS[S.lvl], v) ? 0 : 1;
}
const selV = () => (S.sel === 'm' ? { ...S.maker } : S.sel !== null ? S.tray[S.sel] : null);

function resetRound() { S.log = []; S.tests = 0; S.streak = 0; S.verdict = null; S.last = null; S.sel = null; S.secTests = 0; S.secDone = false; }

function startTest(guess) {
  const v = selV();
  if (!v || S.anim) return;
  S.anim = { v, guess, dest: destOf(v), t0: now(), idx: S.sel, done: false };
  S.verdict = null; S.last = null; sfx.click(); render();
}
function markFound() { S.found = Math.max(S.found, Math.min(4, S.lvl + 1)); store.set('found', S.found); }
function finishTest() {
  const A = S.anim; S.anim = null;
  const right = A.guess === A.dest;
  (right ? sfx.good : sfx.bad)();
  S.tests++; S.log.unshift({ v: A.v, dest: A.dest, right }); if (S.log.length > 14) S.log.pop();
  if (A.idx !== 'm' && S.tray[A.idx]) S.tray[A.idx].used = { dest: A.dest, right };
  S.sel = A.idx === 'm' ? 'm' : null;
  let newly = false;
  if (!S.sec) {
    S.streak = right ? S.streak + 1 : 0;
    if (S.streak >= 3 && !S.revealed) { S.revealed = true; S.flipAt = now(); newly = true; markFound(); }
  } else {
    S.secTests++;
    if (S.sec === 'doors' && ((A.v.c === 0 && A.v.s === 0) || S.secTests >= 5)) S.secDone = true;

  for (const sx of [-1, 1]) { const lx = cx + sx * (ow / 2 + 34 * s), ly = wallTop + 70 * s; const lgl = c.createRadialGradient(lx, ly, 2, lx, ly, 34 * s); lgl.addColorStop(0, 'rgba(255,214,120,.75)'); lgl.addColorStop(1, 'rgba(255,214,120,0)'); c.fillStyle = lgl; c.beginPath(); c.arc(lx, ly, 34 * s, 0, Math.PI * 2); c.fill(); c.fillStyle = '#ffe9a8'; rrect(c, lx - 5, ly - 8, 10, 16, 4); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#6b5a2f'; c.stroke(); }
  if (sec === 'bug') { // the sign on the wall

    c.fillStyle = '#c99a5b'; rrect(c, sx - sw / 2, sy - 18, sw, 36, 8); c.fill(); c.lineWidth = 2; c.strokeStyle = '#7a5530'; c.stroke();
    c.fillStyle = '#3b2512'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t2.sign, sx, sy + 1, sw - 8); c.restore();
  }

  if (A) {

    if (e < 0.55) { pos = { x: cx, y: lerp(waitY, scanY, eio(e / 0.55)) }; }
    else if (e < 1.8) { pos = { x: cx, y: scanY }; scan = e < 1.45 ? (e - 0.55) / 0.9 : 1; look = { x: 0, y: scanY - (footY - 113 * s) }; if (e >= 1.45) face = DEST_EMO[A.dest]; }
    else {
      const u = clamp01((e - 1.8) / 1.1), [a, b, c2, e2] = path(A.dest); pos = bez(a, b, c2, e2, eio(u)); px = lerp(56, 44, eio(u)); hop = Math.abs(Math.sin(u * Math.PI * 6)) * 5 * (1 - 0.3 * u); face = DEST_EMO[A.dest];

  } else { v = selV(); if (v) pos = { x: cx, y: waitY + Math.sin(t * 2.2) * 2 }; }
  drawRobot(c, cx, footY, s, { look, scan: scan > 0 && scan < 1 ? 1 : 0, face: A && e >= 1.45 ? face : null }, t);
  if (scan > 0 && pos) { // scanning beam

  }

  }
  if (pos && v) {
    c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(pos.x, pos.y + px * 0.42, px * 0.34, 5, 0, 0, Math.PI * 2); c.fill();
    drawToken(c, v, pos.x, pos.y - hop, px, sq || {});

  } else if (!A) {

    c.fillStyle = 'rgba(255,255,255,.8)'; c.font = `900 22px ${SANS}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', cx, waitY + 1);
  }

}

// --- drawing: write view -------------------------------------------------------------------------------------------
function sceneWrite(c, w, h, W, H, ox, oy, t) {
  const t2 = T[lang], Wd = S.W, k = wCond(), sw = Wd.swap;
  bg(c, w, h, ox, oy, '#101a40', '#16283f');
  const lines = [[kw(t2.code.if), { k: 'cond', s: condText(k, t2), hid: false, sx: 1 }], [kw(t2.code.then), em(sw ? '🌊' : '🌳'), kw(t2.code.else), em(sw ? '🌳' : '🌊')]];
  const cardBot = drawCode(c, W / 2, 10, W - 14, lines, 0);
  const gap = W / 5, px = Math.min(56, gap - 6), qy = cardBot + 46, set = GOAL_SETS[Wd.goal], zy = qy + 78 + px / 2 + 40;
  const zw = W / 2 - 12, zh = H - zy - 6;

    const g = c.createLinearGradient(0, zy, 0, zy + zh); g.addColorStop(0, top); g.addColorStop(1, bot);
    c.fillStyle = g; rrect(c, x0, zy, zw, zh, 18); c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,.22)'; c.stroke();
    c.save(); rrect(c, x0, zy, zw, zh, 18); c.clip();

    else { c.lineWidth = 1.6; for (let i = 0; i < 4; i++) { const ph = (t * 0.4 + i / 4) % 1; c.strokeStyle = `rgba(255,255,255,${0.3 * (1 - ph)})`; c.beginPath(); c.ellipse(x0 + zw * (0.25 + 0.2 * i), zy + zh * 0.7 - (i % 2) * 20, 10 + ph * 24, 4 + ph * 8, 0, 0, Math.PI * 2); c.stroke(); } }
    c.restore();
    emo(c, label, x0 + 22, zy + 22, 22);
  };
  zone(8, '#4a9a5e', '#1d4b36', '🌳', 0); zone(W / 2 + 4, '#3c93e0', '#16407f', '🌊', 1);
  const ran = Wd.res, cnt = [0, 0];
  const slot = (d, m) => { const x0 = d === 0 ? 8 : W / 2 + 4, col = m % 3, row = Math.floor(m / 3); return { x: x0 + 44 + col * ((zw - 88) / 2), y: zy + 54 + row * 36 }; };
  set.forEach((v, i) => {
    const col = i % 5, row = Math.floor(i / 5), x = gap * (col + 0.5), y = qy + row * 78, goal = GOAL_FN[Wd.goal](v) ? 0 : 1;
    c.save(); c.setLineDash([4, 5]); c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,.25)'; c.beginPath(); c.arc(x, y, px / 2 - 2, 0, Math.PI * 2); c.stroke(); c.restore();

    let p = { x, y }, size = px, wrong = false, landed = false;

      p = { x: lerp(x, sl.x, e), y: lerp(y, sl.y, e) - Math.sin(u * Math.PI) * 26 }; size = lerp(px, 46, e); landed = u >= 1; wrong = ran.wrong[i];
    }

}

// --- drawing: sensor view ------------------------------------------------------------------------------------------
const STARS = Array.from({ length: 26 }, (_, i) => [((i * 61) % 100) / 100, ((i * 37 + 11) % 100) / 100, 1 + (i % 3) * 0.5]);
const SKY = [[0, '#060a20', '#17255a'], [0.35, '#27327a', '#ff8a5e'], [0.7, '#3f86e0', '#ffcf9a'], [1, '#3d9bff', '#c4e8ff']];
function skyAt(L) {
  let i = 0; while (i < SKY.length - 2 && L > SKY[i + 1][0]) i++;
  const a = SKY[i], b = SKY[i + 1], u = clamp01((L - a[0]) / (b[0] - a[0]));
  return [mixH(a[1], b[1], u), mixH(a[2], b[2], u)];
}
function sceneInput(c, w, h, W, H, ox, oy, t, dt) {
  const t2 = T[lang], I = S.I;
  I.shown += (I.light - I.shown) * Math.min(1, dt * 9);
  const L = clamp01(I.shown / 100), on = I.phase !== 'guess' && I.light < I.t ? 1 : 0;
  I.lampA += (on - I.lampA) * Math.min(1, dt * 10);
  const floorY = H * 0.8;
  bg(c, w, h, ox, oy, '#4a5373', '#2b3150');
  const fg = c.createLinearGradient(0, floorY, 0, H + oy); fg.addColorStop(0, '#74503a'); fg.addColorStop(1, '#3a281f'); c.fillStyle = fg; c.fillRect(-ox - 2, floorY, w + 4, h - floorY + oy + 2);
  c.fillStyle = '#8d93ad'; c.fillRect(-ox - 2, floorY - 7, w + 4, 8);
  c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 1.5; for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(-ox, floorY + i * (H - floorY) / 4); c.lineTo(W + ox, floorY + i * (H - floorY) / 4); c.stroke(); }
  const tx0 = W * 0.8, tTop = H * 0.66;
  for (const sx of [-1, 1]) { c.fillStyle = '#5a3f2b'; rrect(c, tx0 + sx * 46 - 5, tTop, 10, floorY + 30 - tTop, 3); c.fill(); }
  const tg = c.createLinearGradient(0, tTop - 6, 0, tTop + 8); tg.addColorStop(0, '#9a7452'); tg.addColorStop(1, '#6e4f35'); c.fillStyle = tg; rrect(c, tx0 - 62, tTop - 6, 124, 14, 6); c.fill();
  // darkness grows as the light fades

  c.fillStyle = `rgba(4,7,22,${(1 - L) * 0.72})`; c.fillRect(-ox - 2, floorY + 38, w + 4, h);
  // window

  c.save(); rrect(c, wx, wy, ww, wh, 10); c.clip();
  const sg = c.createLinearGradient(0, wy, 0, wy + wh); sg.addColorStop(0, skyT); sg.addColorStop(1, skyB); c.fillStyle = sg; c.fillRect(wx, wy, ww, wh);
  const starA = clamp01((0.5 - L) / 0.35);
  if (starA > 0) for (const [fx, fy, r] of STARS) { c.fillStyle = `rgba(255,255,230,${starA * (0.6 + 0.4 * Math.sin(t * 2 + fx * 20))})`; c.beginPath(); c.arc(wx + fx * ww, wy + fy * wh * 0.7, r, 0, Math.PI * 2); c.fill(); }
  const sunY = lerp(wy + wh + 36, wy + 56, eout(L)), sunX = wx + ww * lerp(0.72, 0.45, L);
  const sgl = c.createRadialGradient(sunX, sunY, 4, sunX, sunY, 70); sgl.addColorStop(0, 'rgba(255,240,170,.8)'); sgl.addColorStop(1, 'rgba(255,200,100,0)'); c.fillStyle = sgl; c.beginPath(); c.arc(sunX, sunY, 70, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#ffe680'; c.beginPath(); c.arc(sunX, sunY, 22, 0, Math.PI * 2); c.fill();
  const moonA = clamp01((0.5 - L) / 0.3);
  if (moonA > 0) { const mx = wx + ww * 0.3, my = lerp(wy + wh + 30, wy + 58, eout(moonA)); c.fillStyle = '#f3efd6'; c.beginPath(); c.arc(mx, my, 15, 0, Math.PI * 2); c.fill(); c.fillStyle = 'rgba(160,160,140,.35)'; c.beginPath(); c.arc(mx - 4, my - 3, 3.5, 0, Math.PI * 2); c.arc(mx + 5, my + 4, 2.5, 0, Math.PI * 2); c.fill(); }
  c.fillStyle = mixH('#0b1a2a', '#3f8a5c', L); c.beginPath(); c.moveTo(wx, wy + wh); c.lineTo(wx, wy + wh * 0.82); c.quadraticCurveTo(wx + ww * 0.3, wy + wh * 0.66, wx + ww * 0.6, wy + wh * 0.84); c.quadraticCurveTo(wx + ww * 0.85, wy + wh * 0.72, wx + ww, wy + wh * 0.8); c.lineTo(wx + ww, wy + wh); c.fill();
  c.restore();
  c.lineWidth = 7; c.strokeStyle = '#d9c9a6'; rrect(c, wx, wy, ww, wh, 10); c.stroke();
  c.lineWidth = 4; c.beginPath(); c.moveTo(wx + ww / 2, wy); c.lineTo(wx + ww / 2, wy + wh); c.moveTo(wx, wy + wh * 0.5); c.lineTo(wx + ww, wy + wh * 0.5); c.stroke();
  c.fillStyle = '#bfae88'; rrect(c, wx - 8, wy + wh + 2, ww + 16, 9, 4); c.fill();
  // sensor
  const sx = W * 0.66, sy = wy + 18, lampX = tx0, lampBase = tTop - 6;
  c.strokeStyle = on ? '#ffd166' : '#8a92b0'; c.lineWidth = 2.5; c.setLineDash([6, 5]); c.beginPath(); c.moveTo(sx, sy + 78); c.bezierCurveTo(sx, lampBase - 20, lampX - 40, lampBase + 10, lampX - 8, lampBase - 4); c.stroke(); c.setLineDash([]);
  if (I.phase !== 'guess') { const u = (t * 0.8) % 1, q = bez({ x: sx, y: sy + 78 }, { x: sx, y: lampBase - 20 }, { x: lampX - 40, y: lampBase + 10 }, { x: lampX - 8, y: lampBase - 4 }, u); c.fillStyle = '#7fffd0'; c.beginPath(); c.arc(q.x, q.y, 3.5, 0, Math.PI * 2); c.fill(); }
  const bg3 = c.createLinearGradient(sx - 22, sy, sx + 22, sy + 40); bg3.addColorStop(0, '#f2f4fb'); bg3.addColorStop(1, '#aab2cc'); c.fillStyle = bg3; rrect(c, sx - 24, sy, 48, 40, 12); c.fill(); c.lineWidth = 2; c.strokeStyle = '#59627f'; c.stroke();
  const lens = c.createRadialGradient(sx - 3, sy + 14, 1, sx, sy + 18, 12); lens.addColorStop(0, '#fff'); lens.addColorStop(1, mixH('#6a5a2a', '#ffd25a', L)); c.fillStyle = lens; c.beginPath(); c.arc(sx, sy + 19, 11, 0, Math.PI * 2); c.fill(); c.stroke();

  c.fillStyle = '#071018'; rrect(c, sx - lw / 2, sy + 44, lw, 24, 7); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#3b5a58'; c.stroke();
  c.fillStyle = '#7cffb2'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, sx, sy + 57); c.restore();

  c.fillStyle = '#3a3f58'; c.beginPath(); c.ellipse(lampX, lampBase, 20, 5, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#59627f'; rrect(c, lampX - 3, lampBase - 52, 6, 52, 3); c.fill();
  if (A > 0.01) { c.save(); c.globalCompositeOperation = 'screen'; const cone = c.createLinearGradient(0, lampBase - 42, 0, floorY + 40); cone.addColorStop(0, `rgba(255,205,100,${0.35 * A})`); cone.addColorStop(1, 'rgba(255,205,100,0)'); c.fillStyle = cone; c.beginPath(); c.moveTo(lampX - 28, lampBase - 44); c.lineTo(lampX + 28, lampBase - 44); c.lineTo(lampX + 120, floorY + 40); c.lineTo(lampX - 120, floorY + 40); c.closePath(); c.fill();
    const gl = c.createRadialGradient(lampX, lampBase - 56, 4, lampX, lampBase - 56, 170); gl.addColorStop(0, `rgba(255,214,120,${0.6 * A})`); gl.addColorStop(1, 'rgba(255,170,60,0)'); c.fillStyle = gl; c.beginPath(); c.arc(lampX, lampBase - 56, 170, 0, Math.PI * 2); c.fill(); c.restore(); }
  const sh = c.createLinearGradient(lampX - 30, 0, lampX + 30, 0); sh.addColorStop(0, shade); sh.addColorStop(0.5, mixH('#b8c0da', '#fff0b0', A)); sh.addColorStop(1, shade);
  c.fillStyle = sh; c.beginPath(); c.moveTo(lampX - 24, lampBase - 84); c.lineTo(lampX + 24, lampBase - 84); c.lineTo(lampX + 38, lampBase - 46); c.lineTo(lampX - 38, lampBase - 46); c.closePath(); c.fill(); c.lineWidth = 2; c.strokeStyle = '#59627f'; c.stroke();
  pillText(c, `${t2.sensor.lamp} ${on ? t2.sensor.on : t2.sensor.off}`, lampX, tTop + 40, W, 13, on ? '#ffd166' : '#c6cde0');
  // the program card
  const revealed = I.phase === 'done', flash = revealed && t - I.flashAt < 1.2 ? 1 - (t - I.flashAt) / 1.2 : 0;
  const lines = [[kw(t2.code.if), tx(`${t2.sensor.light} <`), tile(String(I.t), revealed, I.revAt, t), kw(t2.code.then), tx(`${t2.sensor.lamp} ${t2.sensor.on}`, '#ffd166')], [kw(t2.code.else), tx(`${t2.sensor.lamp} ${t2.sensor.off}`)]];
  drawCode(c, W / 2, 10, W - 14, lines, flash);
}

// --- the loop ------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, t) => {
  const W = Math.min(w, 520), H = Math.min(h, 560), ox = (w - W) / 2, oy = (h - H) / 2, v = lab.view;
  c.save(); c.translate(ox, oy);
  if (v === 'find') sceneFind(c, w, h, W, H, ox, oy, t);
  else if (v === 'write') sceneWrite(c, w, h, W, H, ox, oy, t);
  else sceneInput(c, w, h, W, H, ox, oy, t, dt);
  c.restore();
});
render();
</script>
