};

};

  c.beginPath(); c.moveTo(dx + 13, dy - 9); c.lineTo(dx + 20, dy - 7); c.lineTo(dx + 13, dy - 5); c.closePath(); c.fillStyle = '#f27c1c'; c.fill();

  } else {
    $('q2').textContent = w.q1; $('h2').textContent = w.dots;
    html = `<button type="button" class="chip" data-a="again2">${esc(w.again)}</button>`;
  }
  $('o2').innerHTML = html;
  const mname = esc(cap(t.monF[V.m]));
  if (tk === 2) lab.setReadout(mname, `${w.bud} ${fmt(D[V.m])} · ${w.mos} ${fmt(M[V.m])} °C`, w.gapPill(GAP[V.m]), COL.bud);
  else lab.setReadout(mname, '', '', COL.mos);
  if (tk === 0 && V.a0 === null) lab.setState({ emo: '🌡️', title: w.s0T, lead: w.s0L, body: w.s0B, extra: '' });
  else if (tk === 0) lab.setState({ emo: V.a0 === RIGHT0 ? '✅' : '🤔', title: V.a0 === RIGHT0 ? w.ok0 : w.no0(GAP[JUL]), lead: w.l0(D[JUL], M[JUL], GAP[JUL]), body: '', extra: '' });
  else if (tk === 1) lab.setState({ emo: '🔎', title: w.s1T, lead: w.s1L, body: '', extra: '' });
  else lab.setState({ emo: V.g1 === GAPMAX ? '✅' : '🤔', title: V.g1 === GAPMAX ? w.ok1 : w.no1(GAPMAX), lead: w.l1(GAPMAX, D[GAPMAX], M[GAPMAX], GAP[GAPMAX]), body: w.b1(HOT, GAP[HOT]), extra: '' });
  lab.setFacts(t.facts.towns);
}
function renderTraps(t) {
  const r = t.tr, rd = X.r, picked = X.pick !== null, done = picked && X.rev >= 1, opts = rd === 0 ? r.o0 : r.o1, right = rd === 0 ? 1 : 0;
  lab.setGlow('rgba(255, 122, 107, .2)');
  $('q3').textContent = rd === 0 ? r.q0 : r.q1;
  let html = opts.map((o, i) => {
    const cls = !picked ? '' : i === right ? ' lg-good' : i === X.pick ? ' lg-bad' : '';
    return `<button type="button" class="chip${cls}" data-t="${i}"${picked ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  if (done) html += `<button type="button" class="btn lg-btn" data-a="${rd === 0 ? 'next3' : 'again3'}">${esc(rd === 0 ? r.next : r.again)}</button>`;
  $('o3').innerHTML = html;
  const da = SA[4] - SA[0], db = SB[4] - SB[0];
  if (!picked) lab.setReadout('?', rd === 0 ? r.sub0 : r.sub1, r.trap(rd + 1), COL.bad);
  else lab.setReadout(rd === 0 ? `+${da} · +${db}` : `${fmt(RATE_FIRST, 0)} · ${fmt(RATE_LAST, 1)}`, rd === 0 ? r.sub0d : r.sub1d, r.trap(rd + 1), COL.bad);
  if (!picked) lab.setState({ emo: '🪤', title: rd === 0 ? r.s0T : r.s1T, lead: rd === 0 ? r.s0L : r.s1L, body: '', extra: '' });
  else if (!done) lab.setState({ emo: '👀', title: LOOK[lang], lead: '', body: '', extra: '' });
  else {
    const ok = X.pick === right;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? r.ok : rd === 0 ? r.no0 : r.no1,
      lead: rd === 0 ? r.l0(SA[0], SA[4], SB[0], SB[4]) : r.l1(SC[1] - SC[0], t.dayN(SD[1] - SD[0]), SC[4] - SC[3], t.dayN(SD[4] - SD[3])),
      body: rd === 0 ? r.b0 : r.b1, extra: rd === 0 ? `<div class="lg-fine">${esc(r.note)}</div>` : '' });
  }
  lab.setFacts(t.facts.traps);
}
render();
</script>
