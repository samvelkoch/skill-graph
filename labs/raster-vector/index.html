  if (S.grown && S.diff && S.g >= 1) tag(c, tt.diffB.replace(/^\S+\s/, ''), L.xB + 8, L.y + F - 14);
}

function drawFormat(c, w, h, dt) {
  const t = T[lang], ft = t.f;
  S.bigS += (S.big - S.bigS) * (1 - Math.exp(-dt * 3.2));
  G.w = w; G.h = h; G.s = 1;
  if (S.ti >= 4) { // result: the four pictures with a tick or a cross
    const gap = 8, F = Math.min((w - 20 - 3 * gap) / 4, h - 70, 150), x0 = (w - (4 * F + 3 * gap)) / 2, y0 = (h - F - 34) / 2 + 6;
    ITEMS.forEach((it, i) => {
      const x = x0 + i * (F + gap), ok = S.right[i];
      frame(c, x, y0, F, () => { c.save(); c.translate(x, y0); it.draw(c, F, true); c.restore(); }, ok ? '#3ddc97' : '#ff5a4d');
      tag(c, `${ok ? '✓' : '✗'} ${it.ok === 'r' ? '🔲' : '✏️'}`, x + F / 2, y0 + F + 16, { center: true, color: ok ? '#3ddc97' : '#ff8a80' });
    });
    return;
  }
  const it = ITEMS[S.ti];
  if (!S.pick) { // one picture, the real thing
    const F = Math.max(80, Math.min(w - 40, h - 36, 320)), x = (w - F) / 2, y = (h - F) / 2 + 2;
    frame(c, x, y, F, () => { c.save(); c.translate(x, y); it.draw(c, F, true); c.restore(); });
    return;
  }
  const L = lay(w, h), F = L.F, sz = F * lerp(0.2, 0.96, clamp(S.bigS / 100, 0, 1));
  const okR = it.ok === 'r', mine = S.pick;
  label(c, `${okR ? '✓ ' : ''}${ft.asPix}`, L.xA, L.y, F, okR ? '#3ddc97' : '#C6CDE0'); label(c, `${okR ? '' : '✓ '}${ft.asShp}`, L.xB, L.y, F, okR ? '#C6CDE0' : '#3ddc97');
  const bg = () => { c.fillStyle = '#0d1019'; c.fillRect(0, 0, w, h); };
  frame(c, L.xA, L.y, F, () => {
    bg(); const px = L.xA + (F - sz) / 2, py = L.y + (F - sz) / 2;
    c.imageSmoothingEnabled = it.smooth || sz < it.res; c.drawImage(it.rast, px, py, sz, sz);
  }, okR ? '#3ddc97' : 'rgba(130,145,190,.4)');
  frame(c, L.xB, L.y, F, () => {
    bg(); c.save(); c.translate(L.xB + (F - sz) / 2, L.y + (F - sz) / 2); it.draw(c, sz, false); c.restore();
  }, okR ? 'rgba(130,145,190,.4)' : '#3ddc97');
  tag(c, `${it.res}×${it.res}`, L.xA + 8, L.y + F - 14);
  tag(c, ft.mine, mine === 'r' ? L.xA + F / 2 : L.xB + F / 2, L.y + F + 16, { center: true, color: '#98A0B8' });
}

// --- pointer: pan the zoomed pictures, drag the curve's dots, move the crop frame ---------------------------------------
const cv = $('cv');
const at = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
const inBox = (px, py, x, y, F) => px >= x && px <= x + F && py >= y && py <= y + F;
function moveCrop(px, py) {
  const q = TOT / G.F;
  S.cx = clamp(Math.round((px - G.xA) * q - CROP / 2), 0, TOT - CROP); S.cy = clamp(Math.round((py - G.y) * q - CROP / 2), 0, TOT - CROP);
}
cv.addEventListener('pointerdown', (ev) => {
  const [px, py] = at(ev), v = lab.view;
  if (v === 'zoom' && S.sec === 'bez' && G.bez) {
    const { x, y, F } = G.bez; let best = -1, bd = 34 * 34;
    S.bez.forEach(([u, w], i) => { const d = (x + u * F - px) ** 2 + (y + w * F - py) ** 2; if (d < bd) { bd = d; best = i; } });
    if (best >= 0) drag = { k: 'bez', i: best };
  } else if (v === 'zoom' && !S.sec && S.rev1 && (inBox(px, py, G.xA, G.y, G.F) || inBox(px, py, G.xB, G.y, G.F))) drag = { k: 'pan', x: px, y: py };
  else if (v === 'shrink' && S.crop && inBox(px, py, G.xA, G.y, G.F)) { drag = { k: 'crop' }; moveCrop(px, py); }
  if (drag) { cv.setPointerCapture(ev.pointerId); ev.preventDefault(); }
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const [px, py] = at(ev);
  if (drag.k === 'pan') { S.fx = clamp(S.fx - (px - drag.x) / G.s, 0, RES); S.fy = clamp(S.fy - (py - drag.y) / G.s, 0, RES); drag.x = px; drag.y = py; }
  else if (drag.k === 'bez') { const { x, y, F } = G.bez; S.bez[drag.i] = [clamp((px - x) / F, 0.04, 0.96), clamp((py - y) / F, 0.04, 0.96)]; render(); }
  else if (drag.k === 'crop') moveCrop(px, py);
});
const endDrag = () => { drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const zToSlider = (z) => Math.round(Math.log(z) / Math.log(16) * 100);
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'pick1') {
    S.guess1 = +b.dataset.i; S.rev1 = true; S.showV1 = true; S.zt = 8; S.rate = 2.4; S.zs = 1; S.fx = 44; S.fy = 27;
    (S.guess1 === T[lang].z.ok ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'look') { S.look = !S.look; S.showV1 = false; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  } else if (a === 'pick2') {
    S.guess2 = +b.dataset.i; S.asked2 = true; S.seen2 = true; S.grown = true; S.g = 0; S.showV2 = true; (S.guess2 === T[lang].s.ok ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'grow') { S.seen2 = true; S.grown = true; S.g = 0; S.showV2 = false; sfx.click(); showStage(); }
  else if (a === 'smooth') { S.smooth = b.dataset.m === '1'; S.showV2 = false; sfx.click(); }
  else if (a === 'diff') { S.diff = !S.diff; S.showV2 = false; sfx.click(); }
  else if (a === 'crop') { S.crop = !S.crop; sfx.click(); }
  else if (a === 'pick3') {
    S.pick = b.dataset.k; S.right[S.ti] = S.pick === ITEMS[S.ti].ok; S.big = 100; S.bigS = 20; (S.right[S.ti] ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'next') {
    if (S.ti >= 4) { S.ti = 0; S.right = []; S.pick = null; } else { S.ti++; S.pick = null; }
    sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'zr') { S.zt = 16 ** (v / 100); S.rate = 10; S.showV1 = false; }
  else if (id === 'fr') S.fn = v;
  else if (id === 'nr') { S.ni = v; S.grown = false; S.g = 0; S.diff = false; S.showV2 = false; }
  else if (id === 'sr') { S.big = v; S.bigS = v; }
  else return;
  render();
});

// --- one render per change ----------------------------------------------------------------------------------
function readout1() {
  const t = T[lang], N = RES;
  if (S.sec === 'bez') lab.setReadout('8', t.bez.sub, '', '#6fd0ff');
  else if (S.sec === 'font') lab.setReadout(`${S.fn} px`, t.font.sub, t.font.pill(t.pts(D_ON.length + D_OFF.length)), '#9fd0ff');
  else if (!S.rev1) lab.setReadout('1×', t.z.sub, '', '#4ea8ff');
  else lab.setReadout(`${fmtZ(S.zs)}×`, t.z.sub, t.z.pill(t.px(rasterRes(G.F) ** 2), t.cmds(CMDS.length)), '#4ea8ff');
}
function render1(t) {
  const z = t.z, open = secret.unlocked(), N = RES, n = CMDS.length;
  lab.setGlow('rgba(78, 168, 255, .26)');
  $('sec1').innerHTML = [['bez', '✒️'], ['font', '🔤']].map(([k, e]) => `<button class="chip rv secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-a="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const predict = !S.rev1 && !S.sec, free = S.rev1 && !S.sec;
  $('p1').hidden = !predict; $('f1').hidden = !free; $('fbox').hidden = S.sec !== 'font';
  document.body.dataset.drag = (free || S.sec === 'bez') ? '1' : '0';
  $('p1').innerHTML = predict ? z.opts.map((o, i) => `<button class="rv-opt" data-a="pick1" data-i="${i}">${esc(o)}</button>`).join('') : '';
  $('zl').textContent = z.zoom; $('zr').value = zToSlider(S.zt); $('lookB').textContent = S.look ? z.unlook : z.look; $('lookB').classList.toggle('on', S.look);
  $('fl').textContent = t.font.lbl; $('fr').value = S.fn;
  $('h1').textContent = S.sec === 'bez' ? t.bez.hint : free ? z.hint : '';
  readout1();
  if (S.sec === 'bez') {
    const p = S.bez.map(([u, v]) => [Math.round(u * RES), Math.round(v * RES)]);
    lab.setState({ emo: '✒️', title: t.bez.t, lead: t.bez.l, body: `M ${p[0].join(' ')}  C ${p[1].join(' ')},  ${p[2].join(' ')},  ${p[3].join(' ')}`, extra: '' });
    lab.setFacts([]); return;
  }
  if (S.sec === 'font') {
    lab.setState({ emo: '🔤', title: t.font.t, lead: t.font.l(t.pts(D_ON.length + D_OFF.length), S.fn), body: '', extra: '' });
    lab.setFacts([]); return;
  }
  if (!S.rev1) { lab.setState({ emo: '🤔', title: z.q, lead: z.ql, body: '', extra: '' }); lab.setFacts(t.facts.zoom); return; }
  const wide = (rasterRes(G.F) / DPR() / RES) * S.zt >= 15;
  let st;
  if (S.showV1) st = { emo: S.guess1 === z.ok ? '✅' : '🤔', title: S.guess1 === z.ok ? z.right : z.no, lead: z.lead, body: '' };
  else if (S.look) { const [a, b] = z.inside(t.nums(N * N), t.cmds(n)); st = { emo: '🔍', title: a, lead: b, body: wide ? '' : z.small }; }
  else if (S.zt < 2.5) st = { emo: '🖼️', title: z.same[0], lead: z.same[1], body: '' };
  else { const [a, b] = z.diff(); st = { emo: '🔲', title: a, lead: b, body: '' }; }
  lab.setState({ ...st, extra: '' }); lab.setFacts(t.facts.zoom);
}

function render2(t) {
  const s = t.s, N = SIZES[S.ni], total = TOT * TOT;
  lab.setGlow('rgba(224, 176, 80, .24)');
  const askNow = N <= 16 && !S.grown && !S.asked2 && !S.crop;
  document.body.dataset.drag = S.crop ? '1' : '0';
  $('nbox').hidden = S.crop; $('nl').textContent = s.lbl; $('nr').value = S.ni;
  $('p2').innerHTML = askNow ? s.opts.map((o, i) => `<button class="rv-opt" data-a="pick2" data-i="${i}">${esc(o)}</button>`).join('') : '';
  const growBtn = N < TOT && !S.grown && !askNow && !S.crop ? `<button class="chip rv on" data-a="grow">${esc(s.grow)}</button>` : '';
  const chips = S.crop ? `<button class="chip rv" data-a="crop">${esc(s.back)}</button>`
    : growBtn + (S.grown ? `<button class="chip rv ${!S.smooth ? 'on' : ''}" data-a="smooth" data-m="0">${esc(s.blocky)}</button><button class="chip rv ${S.smooth ? 'on' : ''}" data-a="smooth" data-m="1">${esc(s.smoothB)}</button><button class="chip rv ${S.diff ? 'on' : ''}" data-a="diff">${esc(s.diffB)}</button>` : '')
      + (S.seen2 ? `<button class="chip rv" data-a="crop">${esc(s.cropB)}</button>` : '');
  $('c2').innerHTML = chips; $('c2').hidden = !chips;
  $('h2').textContent = S.crop ? s.hint : '';
  if (S.crop) lab.setReadout(`${CROP}×${CROP}`, s.subCrop, s.pill(CROP * CROP, total), '#e0b050');
  else lab.setReadout(`${N}×${N}`, s.sub, s.pill(N * N, total), '#e0b050');
  let st;
  if (S.crop) { const [a, b] = s.crop(CROP, TOT / CROP); st = { emo: '✂️', title: a, lead: b, body: '' }; }
  else if (N === TOT) st = { emo: '📷', title: s.start[0], lead: s.start[1], body: '' };
  else if (!S.grown) { const [a, b] = askNow ? s.q(N) : S.seen2 ? s.again(N) : s.more(N); st = { emo: '🤔', title: a, lead: b, body: '' }; }
  else if (S.diff) st = { emo: '🔎', title: s.diff[0], lead: s.diff[1], body: '' };
  else st = { emo: S.showV2 && S.guess2 === s.ok ? '✅' : '🔍', title: S.showV2 ? (S.guess2 === s.ok ? s.right : s.no) : s.lost, lead: s.lead(N), body: S.smooth ? s.smooth : '' };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(S.grown || S.crop ? [...t.facts.shrink, t.facts.shrinkB] : t.facts.shrink);
}

function render3(t) {
  const ft = t.f, end = S.ti >= 4, k = S.right.filter(Boolean).length;
  lab.setGlow('rgba(61, 220, 151, .22)');
  document.body.dataset.drag = '0';
  const pre = !end && !S.pick;
  $('p3').hidden = !pre; $('sbox').hidden = pre || end; $('nx').hidden = pre;
  $('p3').innerHTML = pre ? ft.opts.map((o, i) => `<button class="rv-opt" data-a="pick3" data-k="${i ? 'v' : 'r'}">${esc(o)}</button>`).join('') : '';
  $('sl').textContent = ft.size; $('se0').textContent = ft.small; $('se1').textContent = ft.big; $('sr').value = S.big;
  $('nx').textContent = end ? ft.again : ft.next;
  const dots = [0, 1, 2, 3].map((i) => (i < S.ti ? (S.right[i] ? '●' : '○') : i === S.ti ? '◉' : '·')).join(' ');
  if (end) {
    const [a, b] = ft.end(k);
    lab.setReadout(`${k}/4`, dots, '', '#3ddc97'); lab.setState({ emo: '🏆', title: a, lead: b, body: '', extra: '' });
  } else if (pre) {
    const task = ft.tasks[S.ti];
    lab.setReadout(`${S.ti + 1}/4`, ft.sub, '', '#3ddc97'); lab.setState({ emo: ITEMS[S.ti].emo, title: task.t, lead: task.need, body: ft.q, extra: '' });
  } else {
    const task = ft.tasks[S.ti], ok = S.right[S.ti];
    lab.setReadout(`${S.ti + 1}/4`, dots, ok ? '✓' : '✗', '#3ddc97'); lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? ft.right : ft.no, lead: task.why, body: '', extra: '' });
  }
  lab.setFacts(t.facts.format);
}

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('s1').hidden = v !== 'zoom'; $('s2').hidden = v !== 'shrink'; $('s3').hidden = v !== 'format';
  if (v === 'zoom') render1(t); else if (v === 'shrink') render2(t); else render3(t);
}

canvasLoop($('cv'), (c, w, h, dt) => {
  const v = lab.view;
  if (v === 'zoom') drawZoom(c, w, h, dt); else if (v === 'shrink') drawShrink(c, w, h, dt); else drawFormat(c, w, h, dt);
});
render();
</script>
</body>
