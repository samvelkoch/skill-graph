  $('obQ').textContent = t.q;
  $('obAns').innerHTML = ['egg', 'baby'].map((k) => {
    const cls = r.pick === null ? '' : k === truth ? 'good' : k === r.pick ? 'bad' : '';
    return `<button class="ob-pick ${cls}" data-pick="${k}"${r.pick !== null || r.busy ? ' disabled' : ''}><span class="e">${k === 'egg' ? '🥚' : '🍼'}</span>${esc(t[k])}</button>`;
  }).join('');
  if (r.pick === null) {
    lab.setState({ emo: '🚪', title: an[0], lead: v === 'surprise' ? t.askS : t.askN, body: '', extra: '' }); lab.setFacts([]);
  } else {
    lab.setState({ emo: r.pick === truth ? '✅' : '🤔', title: `${r.pick === truth ? t.right : t.wrong} ${t.is[truth]}`, lead: an[1], body: '', extra: '' });
    lab.setFacts((t.facts[id] || []).map((x, i) => ({ emo: FACT_EMO[id] || '💡', text: x, src: FACT_SRC[id][i] || FACT_SRC[id][0] })));
  }
}
function renderGrow(t) {
  const g = S.grow, tk = g.track, st = STG[tk](g.t), stages = t.stages[tk], total = stages.length;
  lab.setGlow('rgba(110, 200, 120, .26)');
  $('obTracks').innerHTML = ['frog', 'butterfly', 'cat'].map((k) => `<button class="chip ${k === tk ? 'on' : ''}" data-track="${k}"${g.done ? '' : ' disabled'}>${esc(t.tracks[k])}</button>`).join('');
  $('obTimeL').textContent = t.time;
  const sl = $('obT'); sl.disabled = !g.done; sl.setAttribute('aria-label', t.sliderLabel);
  if (+sl.value !== Math.round(g.t * 100)) sl.value = Math.round(g.t * 100);
  $('obEnds').innerHTML = `<span>${esc(t.young)}</span><span>${esc(t.older)}</span>`;
  $('obSecRow').hidden = true;
  if (!g.done) {
    lab.setReadout(esc(stages[0][1]), t.step(1, total), '', '#6ec878');
    const key = lang + '|' + g.pick;
    if (g.pick === null) {
      askEl.innerHTML = `<div class="q">${esc(t.growQ)}</div><div class="th">${['frog', 'tiny', 'swim'].map((k) => `<button class="ob-th" data-opt="${k}"><canvas width="168" height="108" data-th="${k}"></canvas><span>${esc(t.growOpt[k])}</span></button>`).join('')}</div>`;
      thumbs();
      lab.setState({ emo: '🥚', title: t.growQ, lead: t.growPick, body: '', extra: '' });
    } else {
      const ok = g.pick === 'swim';
      askEl.innerHTML = `<div class="v" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.wrong)}</div><p>${esc(t.growAns)}</p><button class="btn" data-go="1">${esc(t.growGo)}</button>`;
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: t.growAns, body: '', extra: '' });
    }
    void key;
    lab.setFacts([]); return;
  }
  const [emo, name, lead] = stages[st];
  if (st !== g.lastStage) { g.lastStage = st; sfx.tick(); }
  lab.setReadout(esc(name), t.step(st + 1, total), t.same, '#6ec878');
  lab.setState({ emo, title: name, lead, body: '', extra: '' });
  lab.setFacts((t.growFacts[tk] || []).map((x, i) => ({ emo: tk === 'frog' ? '🐸' : '🦋', text: x, src: (GROW_SRC[tk] || [])[i] || (GROW_SRC[tk] || [])[0] })));
}

// --- the loop (a failed frame must never stop the next one) -----------------------------------------------------------
let warned = false;
canvasLoop($('cv'), (c, w, h, dt, tm) => {
  try {
    stepDoor(dt);
    if (lab.view === 'grow') drawGrow(c, w, h, tm);
    else if (lab.view === 'nest' && S.sec) drawSecret(c, w, h, tm);
    else drawAnimalScene(c, w, h, tm);
  } catch (e) { if (!warned) { warned = true; console.error(e); } }
});
render();
</script>
</body>
</html>
