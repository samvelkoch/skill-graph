// monotone cubic (Fritsch-Carlson) through the yearly points: a smooth curve that never overshoots; only used to draw and animate between years
function pchip(ys) {
  const n = ys.length, d = [], m = new Array(n).fill(0);
  for (let i = 0; i < n - 1; i++) d[i] = ys[i + 1] - ys[i];
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  const f = (x) => {
    x = Math.min(n - 1, Math.max(0, x));
    const i = Math.min(n - 2, Math.floor(x)), t = x - i, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * m[i + 1];
  };
  return { f, m, ys };
}

// --- colours and canvas helpers -------------------------------------------------------------------------------
const hx = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
let CW = 0, CH = 0;
// text on a dark rounded pill, clamped inside the canvas
function tag(c, text, x, y, col = '#fff') {
  c.save(); c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + 14, bx = clamp(x - tw / 2, 4, Math.max(4, CW - tw - 4)), by = clamp(y - 10, 4, Math.max(4, CH - 24));
  c.fillStyle = 'rgba(10,12,22,.82)'; c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = 1;
  c.beginPath(); c.roundRect(bx, by, tw, 20, 10); c.fill(); c.stroke();
  c.fillStyle = col; c.fillText(text, bx + tw / 2, by + 10.5); c.restore();
}
// a smooth path through points (quadratic curves between midpoints)
function smoothPath(c, pts) {
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) c.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
  const l = pts[pts.length - 1]; c.lineTo(l[0], l[1]);
}
// the pchip curve of one sex as exact cubic Beziers (x = age 0..19, y = height)
function curvePath(c, sx, mapX, mapY) {
  const { ys, m } = F[sx];
  c.beginPath(); c.moveTo(mapX(0), mapY(ys[0]));
  for (let i = 0; i < ys.length - 1; i++) c.bezierCurveTo(mapX(i + 1 / 3), mapY(ys[i] + m[i] / 3), mapX(i + 2 / 3), mapY(ys[i + 1] - m[i + 1] / 3), mapX(i + 1), mapY(ys[i + 1]));
}
function panelBg(c, x, y, w, h, r = 16) {
  c.beginPath(); c.roundRect(x, y, w, h, r); c.fillStyle = 'rgba(14,17,28,.6)'; c.fill();
  c.strokeStyle = 'rgba(130,145,190,.22)'; c.lineWidth = 1; c.stroke();
}

// a person from the shared module: o = { age (years, 0..80), sex, skin, shirt, pants, hair, grey, glasses, cane, lean, outfit, hairStyle, shoe }
const SHOE_COLS = ['#e9564f', '#2f6fd6', '#f2f0ea', '#e7a33a', '#4c9a6a', '#c0466f'];
function person(c, cx, foot, h, o) {
  if (!(h > 4)) return;
  const age = o.age, girl = o.sex === 'girls', lean = o.lean || 0;
  const cls = age < 2 ? 'toddler' : age < 12 ? 'child' : age < 18 ? 'teen' : age < 65 ? 'adult' : 'older';
  const skin = o.skin || '#f0c29c', hair = mix(o.hair || '#6a4528', '#cfd2dc', o.grey || 0);
  c.save();
  if (lean) { c.translate(cx, foot); c.rotate(lean); c.translate(-cx, -foot); } // the upper body leans from the feet
  if (age < 1) babyFigure(c, cx, foot, h, { skin, hair, top: o.shirt || '#8fd0c8' });
  else {
    const hs = o.hairStyle || (girl ? (cls === 'toddler' || cls === 'child' ? 'pigtails' : cls === 'teen' ? 'pony' : cls === 'adult' ? 'long' : 'bun') : (cls === 'teen' ? 'side' : 'short'));
    const young = cls === 'toddler' || cls === 'child' || cls === 'teen', outfit = o.outfit || (girl ? 'dress' : 'tee');
    const shoe = o.shoe || { kind: young ? 'sneaker' : cls === 'older' ? 'loafer' : 'boot', col: young ? SHOE_COLS[((o.shirt || '#5f8fd0').charCodeAt(2) + (o.shirt || '#5f8fd0').charCodeAt(5)) % SHOE_COLS.length] : '#3a2a22' };
    drawPerson(c, cx, foot, h, { age: cls, skin, hair, hairStyle: hs, top: o.shirt || '#5f8fd0', bottom: o.pants || '#3d4a78', outfit,
      lower: girl && outfit !== 'dress' ? 'skirt' : undefined, tights: girl && outfit !== 'dress' ? true : undefined,
      sleeves: outfit === 'tee' || outfit === 'dress' ? 'short' : 'long', shoe, mood: 'smile', look: 0, pose: 'straight', glasses: o.glasses ? 'round' : undefined, rim: true,
      arms: { l: ARMS.down, r: ARMS.down } });
    if (o.cane) { // a walking stick planted beside the right hand: a dark shape and a slightly smaller lit copy
      const A = { heads: 5.35, arm: 0.39, aw: 0.048, shw: 0.12, neck: 0.24, slope: 0.028 };
      const r = h / A.heads / 2, sh = foot - h + r * 1.14 + r + A.neck * r, aw = A.aw * h, ua = A.arm * h * 0.46, fa = A.arm * h * 0.4;
      const jx = cx + A.shw * h - aw * 0.52, jy = sh + A.slope * h + aw * 0.5, ex = jx + Math.sin(0.16) * ua, ey = jy + Math.cos(0.16) * ua;
      const px = ex + Math.sin(0.08) * fa, py = ey + Math.cos(0.08) * fa + aw * 0.3, w = Math.max(2.5, h * 0.024);
      const stick = (dx, dy, col, ww) => { c.strokeStyle = col; c.lineWidth = ww; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(px + h * 0.01 + dx, foot + dy); c.lineTo(px + dx, py + dy); c.quadraticCurveTo(px - 0.002 * h + dx, py - h * 0.05 + dy, px - h * 0.04 + dx, py - h * 0.045 + dy); c.stroke(); };
      stick(0, 0, '#5a3d1e', w); stick(-w * 0.14, -w * 0.1, '#9a7240', w * 0.62);
    }
  }
  c.restore();
}
// a baby under one year in the module's flat style: a dark shape and a slightly smaller lit copy shifted to the top left
function babyFigure(c, cx, foot, h, o) {
  const shape = (col, k, dx, dy, parts) => { c.fillStyle = col; for (const [x, y, rx, ry] of parts) { c.beginPath(); c.ellipse(cx + (x * k + dx) * h, foot - (y * k + dy) * h, rx * k * h, ry * k * h, 0, 0, 7); c.fill(); } };
  const dark = (col) => mix(col, '#3a2c6a', 0.28), both = (col, parts) => { shape(dark(col), 1, 0, 0, parts); shape(col, 0.9, -0.012, 0.014, parts); };
  c.save();
  c.fillStyle = 'rgba(20,12,40,.3)'; c.beginPath(); c.ellipse(cx, foot, h * 0.3, h * 0.04, 0, 0, 7); c.fill();
  both(o.skin, [[-0.1, 0.07, 0.07, 0.07], [0.1, 0.07, 0.07, 0.07]]); // feet and legs
  both(o.skin, [[-0.27, 0.34, 0.055, 0.1], [0.27, 0.34, 0.055, 0.1]]); // arms
  both(o.top, [[0, 0.3, 0.2, 0.25]]); // a onesie
  both(o.skin, [[0, 0.7, 0.3, 0.3]]); // the big head
  const hr = h * 0.3;
  c.strokeStyle = o.hair; c.lineWidth = Math.max(1.5, hr * 0.12); c.lineCap = 'round';
  c.beginPath(); c.moveTo(cx - hr * 0.1, foot - h * 0.97); c.quadraticCurveTo(cx + hr * 0.25, foot - h * 1.12, cx + hr * 0.4, foot - h * 0.98); c.stroke();
  if (hr >= 5) {
    c.fillStyle = '#2a2438';
    for (const s of [-1, 1]) { c.beginPath(); c.ellipse(cx + s * hr * 0.38, foot - h * 0.67, Math.max(1.2, hr * 0.09), Math.max(1.4, hr * 0.11), 0, 0, 7); c.fill(); }
    c.strokeStyle = '#7a3b3b'; c.lineWidth = Math.max(1, hr * 0.06); c.beginPath(); c.arc(cx, foot - h * 0.6, hr * 0.2, Math.PI * 0.18, Math.PI * 0.82); c.stroke();
  }
  c.restore();
}

// a soft glow behind a figure; drawn for all figures first, so it never covers a neighbour
function haloAt(c, cx, foot, h, age, rgb) {
  const sw = (0.20 + 0.12 * Math.exp(-age / 5)) * h / 2, rx = sw * 2 + 6, ry = h * 0.6 + 6, cy = foot - h / 2;
  c.save(); c.translate(cx, cy); c.scale(rx / ry, 1);
  const g = c.createRadialGradient(0, 0, ry * 0.1, 0, 0, ry); g.addColorStop(0, `rgba(${rgb},.5)`); g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, ry, 0, 7); c.fill(); c.restore();
}

function animate(dt) {
  if (S.play === 1) { // back to birth first, then forward through the years
    S.d1 += (0 - S.d1) * Math.min(1, dt * 8);
    if (S.d1 < 0.04) { S.d1 = 0; S.play = 2; S.age1 = 0; render(); }
  } else if (S.play === 2) {
    S.d1 = Math.min(AMAX, S.d1 + dt * 2.2);
    const a = Math.floor(S.d1 + 1e-6);
    if (a !== S.age1) { S.age1 = a; render(); }
    if (S.d1 >= AMAX) { S.play = 0; S.age1 = AMAX; render(); }
  } else S.d1 += (S.age1 - S.d1) * Math.min(1, dt * 7);
  S.d3 += (S.age3 - S.d3) * Math.min(1, dt * 3.5);
}

// --- controls -------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'stages') return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (y < 6) return;
  const i = clamp(Math.floor(x / (r.width / 5)), 0, 4);
  if (S.st2 === 'task') {
    if (S.pick2 !== null) return;
    S.pick2 = i; S.rev = TASK_WHO[S.task]; (i === S.rev ? sfx.good : sfx.bad)(); showStage();
  } else { S.sel = i; sfx.tick(); }
  render();
});
$('age1').addEventListener('input', (ev) => { S.age1 = +ev.target.value; S.play = 0; S.sec = null; sfx.tick(); render(); });
$('age3').addEventListener('input', (ev) => { S.age3 = +ev.target.value; sfx.tick(); render(); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = b.dataset.k, i = +b.dataset.i;
  if (act === 'sex') { S.sex = k; sfx.click(); }
  else if (act === 'pick1') {
    S.pick1 = i; S.st1 = 'free'; S.play = 1; S.sec = null; (PICK_AGES[i] === BEST[S.sex] ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click(); showStage();
  } else if (act === 'next2') {
    S.task++; S.pick2 = null; S.rev = null; S.sel = null;
    if (S.task >= TASK_WHO.length) S.st2 = 'free';
    sfx.click();
  } else if (act === 'redo2') { S.st2 = 'task'; S.task = 0; S.pick2 = null; S.rev = null; S.sel = null; sfx.click(); }
  else if (act === 'pick12') {
    S.pick12 = i; S.st3 = 'ask18'; S.age3 = 12; const best = tallestAt(12); (i === best ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'pick18') {
    S.pick18 = i; S.st3 = 'free'; S.age3 = 18; (i === sameAnswer18() ? sfx.good : sfx.bad)(); showStage();
  }
  render();
});

// --- helpers for the model of view 3 --------------------------------------------------------------------------
const heightsAt = (a) => [0, 1, 2].map((i) => frH(S.sex, i, a));
const tallestAt = (a) => { const hs = heightsAt(a); return hs.indexOf(Math.max(...hs)); };
const spreadAt = (a) => { const hs = heightsAt(a); return Math.max(...hs) - Math.min(...hs); };
const sameAnswer18 = () => (spreadAt(18) <= 1 ? 3 : tallestAt(18)); // option 3 is "about the same"

// --- render: controls, readout, state card and facts for every view -------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('sec1').hidden = v !== 'door'; $('sec2').hidden = v !== 'stages'; $('sec3').hidden = v !== 'timing';
  $('sexSeg').innerHTML = [['girls', t.girl], ['boys', t.boy]].map(([k, l]) => `<button data-act="sex" data-k="${k}" class="${S.sex === k ? 'on' : ''}">${esc(l)}</button>`).join('');
  if (v === 'door') r1(t); else if (v === 'stages') r2(t); else r3(t);
}

function r1(t) {
  const sx = S.sex, asking = S.st1 === 'ask', a = S.age1, d = t.d;
  lab.setGlow('rgba(224, 176, 80, .24)');
  $('sl1').hidden = asking; $('secRow1').hidden = asking;
  if (asking) {
    $('ask1').innerHTML = `<div class="qline">${esc(d.q)}</div><div class="qopts">${d.opts.map((o, i) => `<button data-act="pick1" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    lab.setReadout('?', '', '', '#e0b050');
    lab.setState({ emo: '🤔', title: d.q, lead: d.ask, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const pa = PICK_AGES[S.pick1], g1 = gain(sx, BEST[sx]), right = pa === BEST[sx];
  $('ask1').innerHTML = `<div class="vd ${right ? 'ok' : 'no'}">${esc(right ? `${t.right} ${d.vRight(g1)}` : d.vWrong(g1, gain(sx, pa)))}</div>`;
  $('ageLbl1').textContent = t.age; $('ageVal1').textContent = String(a);
  if (+$('age1').value !== a) $('age1').value = String(a);
  const open = secret.unlocked();
  $('secChips').innerHTML = [['day', '🔍'], ['tall', '📏']].map(([k, emo]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const fine = `<div class="fine">${esc(d.fine)}</div>`;
  if (S.sec === 'day') {
    lab.setReadout(`${n2(MORNING)} ${t.cm}`, d.dayRd, '', '#e0b050');
    lab.setState({ emo: '🌅', title: d.day[0], lead: d.day[1](n2(MORNING)), body: d.day[2], extra: '' });
    lab.setFacts([]); return;
  }
  if (S.sec === 'tall') {
    lab.setReadout(`${n0(WAD)} ${t.cm}`, d.tallRd, '', '#e0b050');
    lab.setState({ emo: '📏', title: d.tall[0], lead: d.tall[1](n0(F[sx].f(AMAX))), body: d.tall[2], extra: '' });
    lab.setFacts([]); return;
  }
  const cm = WHO[sx][a], g = a >= 1 ? gain(sx, a) : 0;
  lab.setReadout(`${n0(cm)} ${t.cm}`, `${t.age} ${a}`, a >= 1 ? d.pill(g) : '', '#e0b050');
  const pk = PEAK[sx];
  let st;
  if (a === 0) st = { emo: '🍼', title: d.born[0], lead: d.born[1](n0(cm)), body: d.born[2] };
  else if (a === 1) st = { emo: '👶', title: d.first[0], lead: d.first[1](g), body: d.first[2] };
  else if (a <= 4) st = { emo: '🧒', title: d.fast[0], lead: d.fast[1](g), body: d.fast[2] };
  else if (a < pk - 2) { const [lo, hi] = RANGE(sx); st = { emo: '🧒', title: d.steady[0], lead: d.steady[1](g), body: d.steady[2](lo, hi) }; }
  else if (a <= pk) st = { emo: '🚀', title: d.up[0], lead: d.up[1](g), body: d.up[2] };
  else if (Math.round(g * 10) >= 10) st = { emo: '🧑', title: d.slow[0], lead: d.slow[1](g), body: d.slow[2] };
  else st = { emo: '🧍', title: d.done[0], lead: d.done[1](n0(cm)), body: d.done[2] };
  lab.setState({ ...st, extra: fine });
  lab.setFacts(t.facts.door);
}

function r2(t) {
  const s = t.s, task = S.st2 === 'task';
  lab.setGlow('rgba(111, 191, 143, .22)');
  if (task) {
    const [emo, q] = s.tasks[S.task], done = S.pick2 !== null, who = TASK_WHO[S.task];
    const good = S.pick2 === who;
    $('ask2').innerHTML = `<div class="qline">${emo} ${esc(q)}</div>` + (done
      ? `<div class="vd ${good ? 'ok' : 'no'}">${esc(good ? t.right : s.bad(s.full[who]))}</div><div class="nextrow"><button class="btn" data-act="next2">${esc(S.task === TASK_WHO.length - 1 ? s.explore : t.next)}</button></div>`
      : `<div class="fine">${esc(s.n(S.task + 1))} · ${esc(s.tap)}</div>`);
    if (!done) {
      lab.setReadout('?', '', '', '#6fbf8f');
      lab.setState({ emo: '🤔', title: s.which, lead: `${q}`, body: s.tap, extra: '' });
      lab.setFacts([]); return;
    }
    const st = s.st[who];
    lab.setReadout(s.full[who], s.ages[who], '', '#6fbf8f');
    lab.setState({ emo: st[0], title: s.full[who], lead: st[1], body: st[2], extra: '' });
    lab.setFacts([]); return;
  }
  $('ask2').innerHTML = `<div class="qline">${esc(s.freeT)}</div><div class="nextrow"><button class="chip" data-act="redo2">${esc(s.redo)}</button></div>`;
  if (S.sel === null) {
    lab.setReadout('?', '', '', '#6fbf8f');
    lab.setState({ emo: '🌱', title: s.freeT, lead: s.freeL, body: s.freeB, extra: `<div class="fine">${esc(s.about)}</div>` });
  } else {
    const st = s.st[S.sel];
    lab.setReadout(s.full[S.sel], s.ages[S.sel], '', '#6fbf8f');
    lab.setState({ emo: st[0], title: s.full[S.sel], lead: st[1], body: st[2], extra: `<div class="fine">${esc(s.freeB)}</div>` });
  }
  lab.setFacts(t.facts.stages);
}

function r3(t) {
  const m = t.m, st = S.st3, sx = S.sex;
  lab.setGlow('rgba(155, 127, 224, .22)');
  $('sl3').hidden = st !== 'free';
  const names = FR.map((f, i) => `${f.emo} ${m.fr[i]}`);
  const a = Math.round(S.age3);
  const hs = heightsAt(S.age3).map(n0);
  if (st === 'ask12') {
    $('ask3').innerHTML = `<div class="qline">${esc(m.q12)}</div><div class="qopts">${names.map((n, i) => `<button data-act="pick12" data-i="${i}">${esc(n)}</button>`).join('')}</div>`;
    lab.setReadout(`${t.age} 10`, '', '', '#9b7fe0');
    lab.setState({ emo: '🤔', title: m.q12, lead: m.look, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  const best12 = tallestAt(12), ok12 = S.pick12 === best12;
  const v12 = `<div class="vd ${ok12 ? 'ok' : 'no'}">${esc(ok12 ? t.right : m.no)} ${esc(m.v12(names[best12]))}</div>`;
  if (st === 'ask18') {
    $('ask3').innerHTML = `${v12}<div class="qline">${esc(m.q18)}</div><div class="qopts">${[...names, m.same].map((n, i) => `<button data-act="pick18" data-i="${i}">${esc(n)}</button>`).join('')}</div>`;
    lab.setReadout(`${t.age} 12`, '', '', '#9b7fe0');
    lab.setState({ emo: '🤔', title: m.q18, lead: m.sub12(hs[0], hs[1], hs[2]), body: m.hd(12), extra: '' });
    lab.setFacts(t.facts.timing); return;
  }
  const ans = sameAnswer18(), ok18 = S.pick18 === ans, sp18 = spreadAt(18);
  const v18 = `<div class="vd ${ok18 ? 'ok' : 'no'}">${esc(ok18 ? t.right : m.no)} ${esc(ans === 3 ? m.v18(sp18) : m.v18no(names[ans]))}</div>`;
  $('ask3').innerHTML = `${v12}${v18}`;
  $('ageLbl3').textContent = t.age; $('ageVal3').textContent = String(a);
  if (+$('age3').value !== a) $('age3').value = String(a);
  const sp = spreadAt(S.age3);
  lab.setReadout(`${t.age} ${a}`, `${hs[0]} · ${hs[1]} · ${hs[2]} ${t.cm}`, '', '#9b7fe0');
  const mean = heightsAt(S.age3).reduce((x, y) => x + y, 0) / 3;
  const [ti, le] = sp >= 2 ? m.freeBig(sp) : a >= 16 ? m.freeEq(n0(mean)) : m.freeNear(n0(mean));
  lab.setState({ emo: sp >= 2 ? '⏱️' : '🤝', title: ti, lead: le, body: m.body, extra: '' });
  lab.setFacts(t.facts.timing);
}
canvasLoop($('cv'), (c, w, h, dt) => {
  CW = w; CH = h; animate(dt);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'door') drawDoor(c, w, h); else if (v === 'stages') drawStages(c, w, h); else drawTiming(c, w, h);
});
render();
</script>
</body>
</html>
