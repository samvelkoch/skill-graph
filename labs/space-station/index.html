// --- physics of the loose things ---------------------------------------------------------------------------------
function nudge(o, px, py) {
  const dx = o.x - px, dy = o.y - py, d = Math.hypot(dx, dy);

}
function step(dt) {

    if (o.grow) { o.r = Math.min(o.grow, o.r + dt * 22); o.fh = o.r; if (o.r >= o.grow) o.grow = 0; }
    o.x += o.vx * dt; o.y += o.vy * dt; o.a += o.w * dt;
    o.sx *= Math.exp(-9 * dt); o.sy *= Math.exp(-9 * dt); o.wob *= Math.exp(-1.1 * dt);
    const e = st ? 0.72 : 0.36;
    if (o.x < WL + o.r) { o.x = WL + o.r; if (o.vx < 0) { o.sx = Math.min(0.16, -o.vx / 600); o.vx = -o.vx * e; if (st) o.w += o.vy * 0.004; } }
    if (o.x > WR - o.r) { o.x = WR - o.r; if (o.vx > 0) { o.sx = Math.min(0.16, o.vx / 600); o.vx = -o.vx * e; if (st) o.w -= o.vy * 0.004; } }
    if (o.y < WT + o.fh) { o.y = WT + o.fh; if (o.vy < 0) { o.sy = Math.min(0.16, -o.vy / 600); o.vy = -o.vy * e; if (st) o.w += o.vx * 0.004; } }

  rr(c, -20, -25, 40, 50, 14); c.fillStyle = lg(c, -20, -25, 20, 25, [[0, '#ffffff'], [1, '#c3cce2']]); c.fill(); c.strokeStyle = '#97a3bf'; c.lineWidth = 1.5; c.stroke();
  rr(c, -10, -12, 20, 14, 3); c.fillStyle = '#9aa6c2'; c.fill(); circ(c, -4, -5, 2.2); c.fillStyle = '#f6a15f'; c.fill(); circ(c, 3, -5, 2.2); c.fillStyle = '#5fb4ff'; c.fill();
  c.fillStyle = '#f6a15f'; rr(c, -20, 10, 40, 5, 2); c.fill();
  for (const s of [-1, 1]) {
    const ex = s * 36, ey = 10 + Math.sin(now * 1.2 + s) * 3;
    c.strokeStyle = '#97a3bf'; c.lineWidth = 13; c.beginPath(); c.moveTo(s * 18, -16); c.lineTo(ex, ey); c.stroke();
    c.strokeStyle = '#f4f7fd'; c.lineWidth = 10.5; c.beginPath(); c.moveTo(s * 18, -16); c.lineTo(ex, ey); c.stroke();
    circ(c, ex, ey, 7); c.fillStyle = '#9aa6c2'; c.fill(); c.strokeStyle = '#6d7893'; c.lineWidth = 1; c.stroke();
  }
  if (part === 'cool') {  // peek at the tubes under the suit
    c.save(); rr(c, -20, -25, 40, 50, 14); c.clip(); c.fillStyle = 'rgba(40,110,200,.35)'; c.fillRect(-22, -27, 44, 54);
    c.strokeStyle = '#8fd0ff'; c.lineWidth = 2.4; for (let i = 0; i < 6; i++) { c.beginPath(); c.moveTo(-20, -20 + i * 9); for (let xx = -20; xx <= 20; xx += 4) c.lineTo(xx, -20 + i * 9 + Math.sin(xx * 0.5 + i + now * 3) * 2.2); c.stroke(); } c.restore();
  }
  circ(c, 0, -42, 21); c.fillStyle = lg(c, -20, -60, 20, -22, [[0, '#ffffff'], [1, '#b9c3dc']]); c.fill(); c.strokeStyle = '#8390b3'; c.lineWidth = 1.6; c.stroke();
  c.beginPath(); c.ellipse(0, -41, 14.5, 12.5, 0, 0, TAU); c.fillStyle = lg(c, -14, -52, 14, -30, [[0, '#ffe58a'], [0.5, '#d9a82c'], [1, '#8a6410']]); c.fill(); c.strokeStyle = '#6b4c0a'; c.lineWidth = 1.2; c.stroke();
  c.beginPath(); c.ellipse(-4.5, -45, 5.5, 3, -0.5, 0, TAU); c.fillStyle = 'rgba(255,255,255,.7)'; c.fill();
  circ(c, 5, -37, 2); c.fillStyle = 'rgba(120,180,255,.7)'; c.fill();
  c.restore();
  for (const k of ['helm', 'pack', 'cool']) {
    const [lx, ly] = PART_XY[k], px = x + lx * sc, py = y + ly * sc, on = part === k, pulse = 0.5 + 0.5 * Math.sin(now * 3 + lx);
    c.save(); circ(c, px, py, (on ? 22 : 15) + pulse * 3); c.strokeStyle = on ? '#ffd96a' : `rgba(255,255,255,${0.35 + 0.4 * pulse})`; c.lineWidth = on ? 3 : 2; c.stroke();
    if (!on) { circ(c, px, py, 4); c.fillStyle = `rgba(255,255,255,${0.5 + 0.4 * pulse})`; c.fill(); } c.restore();
  }
}
function sceneSuit(c, now) {
  c.save(); rr(c, 14, 14, 372, 272, 40); c.fillStyle = '#04060f'; c.fill(); c.clip(); drawStars(c, 14, 14, 372, 272, now);
  const ex = 110, ey = 420, R = 215;
  circ(c, ex, ey, R + 8); c.fillStyle = rg(c, ex, ey, R, ex, ey, R + 9, [[0, 'rgba(110,190,255,.55)'], [1, 'rgba(110,190,255,0)']]); c.fill();
  circ(c, ex, ey, R); c.fillStyle = rg(c, ex - 40, ey - R * 0.9, 10, ex, ey, R, [[0, '#4da6ff'], [0.5, '#1f64c4'], [1, '#0a2a6a']]); c.fill();
  c.save(); circ(c, ex, ey, R); c.clip(); for (let i = 0; i < 5; i++) { c.beginPath(); c.ellipse(ex - 110 + i * 62 + (now * 3) % 30, ey - R + 30 + rnd(i) * 14, 40, 7, 0, 0, TAU); c.fillStyle = 'rgba(255,255,255,.25)'; c.fill(); } c.restore();
  // a corner of the station with a tether
  rr(c, 14, 70, 70, 56, 10); c.fillStyle = lg(c, 0, 70, 0, 126, [[0, '#eef2fa'], [1, '#98a5c0']]); c.fill(); c.fillStyle = '#f08a45'; c.fillRect(14, 106, 70, 6);
  c.fillStyle = lg(c, 14, 0, 60, 0, [[0, '#2a4a9a'], [1, '#4a76d0']]); c.fillRect(30, 40, 44, 22); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1; c.strokeRect(30, 40, 44, 22); c.beginPath(); c.moveTo(52, 40); c.lineTo(52, 62); c.stroke();
  c.restore();
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(84, 112); c.quadraticCurveTo(150, 190, SUIT_C.x - 24, SUIT_C.y + 18); c.stroke();
  drawSuit(c, now, S.part);
}

// --- the controls and the information below the picture -----------------------------------------------------------
const verdictHtml = (ok, t) => `<div class="ss-ver ${ok ? 'ok' : 'miss'}">${esc(ok ? t.good : t.miss)}</div>`;
function buildCabin(t) {
  const c = t.cab, el = $('sCabin');
  if (S.pick === null) {
    el.innerHTML = `<div class="ss-q">${esc(c.q)}</div><div class="ss-opts">${c.o.map((x, i) => `<button class="ss-opt" data-act="pick" data-i="${i}">${ICON.cab[i]}<span>${esc(x)}</span></button>`).join('')}</div>`;
  } else {
    el.innerHTML = `${verdictHtml(S.pick === 1, t)}<div class="ss-ans">${esc(c.q)} ✔ ${esc(c.o[1])}</div>
      <div class="row2"><div class="card seg small" id="modeSeg"><button data-act="mode" data-m="earth" class="${S.mode === 'earth' ? 'on' : ''}">${esc(c.earth)}</button><button data-act="mode" data-m="station" class="${S.mode === 'station' ? 'on' : ''}">${esc(c.sta)}</button></div></div>
      <div class="row2"><button class="chip ss-tall" data-act="tip" id="bTip">${esc(c.tip)}</button><button class="chip ss-tall" data-act="put">${esc(c.put)}</button></div>`;
  }
}
function buildDay(t) {
  const d = t.day, i = S.card, cd = d.cards[i], pk = S.picks[i], el = $('sDay');
  const chips = d.cards.map((x, k) => `<button class="chip ${k === i ? 'on' : ''} ${S.picks[k] !== null ? 'done' : ''}" data-act="card" data-i="${k}" aria-label="${esc(x.n)}">${CARD_EMO[k]}${S.picks[k] !== null ? ' ✓' : ''}</button>`).join('');
  let body;
  if (pk === null) body = `<div class="ss-q">${esc(cd.q)}</div><div class="ss-opts two">${cd.o.map((x, k) => `<button class="ss-opt" data-act="dpick" data-i="${k}">${ICON[CARD_ICONS[i][k]]}<span>${esc(x)}</span></button>`).join('')}</div>`;
  else body = `<div class="ss-q">${esc(cd.q)}</div><div class="ss-opts two">${cd.o.map((x, k) => `<button class="ss-opt ${k === CARD_OK[i] ? 'good' : k === pk ? 'miss' : ''}" disabled>${ICON[CARD_ICONS[i][k]]}<span>${esc(x)}</span></button>`).join('')}</div>
    ${verdictHtml(pk === CARD_OK[i], t).replace('class="ss-ver', 'style="margin-top:10px" class="ss-ver')}<div class="row2" style="margin-top:4px"><button class="chip ss-tall" data-act="next">${esc(d.next)}</button></div>`;
  el.innerHTML = `<div class="ss-cards">${chips}</div>${body}`;
}
const playLabel = (t) => (S.wPlay ? t.win.pause : t.win.play);
function buildWin(t) {
  const w = t.win, el = $('sWin');
  if (S.wp === null) { el.innerHTML = `<div class="ss-q">${esc(w.q)}</div><div class="ss-opts">${w.o.map((x, i) => `<button class="ss-opt" data-act="wpick" data-i="${i}"><span>${esc(x)}</span></button>`).join('')}</div>`; return; }
  el.innerHTML = `${verdictHtml(S.wp === 1, t)}<div class="ss-ans">${esc(w.q)} ✔ ${esc(w.o[1])}</div>
    <input class="big ss-range" id="wRange" type="range" min="0" max="${DAY_MIN}" step="1" value="${Math.round(S.wt)}" aria-label="${esc(w.clockSub)}">
    <div class="row2"><button class="chip ss-tall" data-act="wplay" id="wPlay">${esc(playLabel(t))}</button><button class="chip ss-tall" data-act="wagain">${esc(w.again)}</button></div>`;
}
function buildTall(t) {
  const s = t.sec;
  $('sTall').innerHTML = `<div class="ss-lbl">${esc(s.tallS)}</div><input class="big ss-range" id="tRange" type="range" min="0" max="100" step="1" value="${Math.round(S.tallK * 100)}" aria-label="${esc(s.tallS)}"><div class="ss-hint">${esc(s.tallB)}</div>`;
}
const PART_EMO = { helm: '⛑️', pack: '🎒', cool: '🧊' };
function buildSuit(t) {
  const s = t.sec;
  $('sSuit').innerHTML = `<div class="ss-parts">${['helm', 'pack', 'cool'].map((k) => `<button class="chip ss-tall ${S.part === k ? 'on' : ''}" data-act="part" data-k="${k}">${PART_EMO[k]} ${esc(s.parts[k][0])}</button>`).join('')}</div><div class="ss-hint">${esc(s.suitB)}</div>`;
}
function buildSecRow(t) {
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ss-tall ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('tall', '📏') + sc('suit', '🧑‍🚀');
}
function buildCtrl() {
  const t = T[lang], v = lab.view, sec = S.sec;
  $('sCabin').hidden = !(!sec && v === 'cabin'); $('sDay').hidden = !(!sec && v === 'day'); $('sWin').hidden = !(!sec && v === 'window');
  $('sTall').hidden = sec !== 'tall'; $('sSuit').hidden = sec !== 'suit';
  if (!sec) { if (v === 'cabin') buildCabin(t); else if (v === 'day') buildDay(t); else buildWin(t); }
  else if (sec === 'tall') buildTall(t); else buildSuit(t);
  buildSecRow(t);
}
const facts = (key, n = 99) => T[lang].facts[key].slice(0, n).map((text, i) => ({ emo: FEMO[key][i], text, src: SRC[key][i] }));
function winReadout() {
  const w = T[lang].win; S.clk = Math.floor(S.wt);
  lab.setReadout(fmtClock(S.wt), w.clockSub, S.wp === null ? '' : `🌅 ${sunriseCount()}`, '#4d8fe6');
}
function info() {
  const t = T[lang], v = lab.view, sec = S.sec;
  if (sec === 'tall') {
    const s = t.sec; lab.setGlow('rgba(120,160,240,.3)');
    lab.setReadout(`+${numFmt(3 * easeOut(S.tallK))}%`, s.tallRo, '', '#8fb0f0');
    lab.setState({ emo: '📏', title: s.tallT, lead: s.tallL, body: s.tallB }); lab.setFacts(facts('tall')); return;
  }
  if (sec === 'suit') {
    const s = t.sec, p = S.part; lab.setGlow('rgba(255,217,106,.26)');
    lab.setReadout(p ? PART_EMO[p] : '👆', p ? s.parts[p][0] : s.suitRo, '', '#ffd96a');
    lab.setState({ emo: p ? PART_EMO[p] : '🧑‍🚀', title: p ? s.parts[p][0] : s.suitT, lead: p ? s.parts[p][1] : s.suitL, body: p ? '' : s.suitB }); lab.setFacts(facts('suit')); return;
  }
  if (v === 'cabin') {
    const c = t.cab, st = S.mode === 'station'; lab.setGlow('rgba(110,150,230,.28)');
    if (S.pick === null) {
      lab.setReadout('?', c.askRo, '', '#6e96e6'); lab.setState({ emo: '🥤', title: c.askT, lead: c.askL, body: '' });
    } else {
      const tipped = S.tip && S.tip.t >= 1.2, same = tipped && S.tip.mode === S.mode;
      lab.setReadout(`${S.ground} / ${S.objs.filter((o) => o.id !== 'water').length}`, c.ro, (st ? c.sta : c.earth).replace(/^\S+\s*/, ''), '#6e96e6');
      const [title, lead] = same ? (st ? [c.stTipT, c.stTipL] : [c.erTipT, c.erTipL]) : (st ? [c.stT, c.stL] : [c.erT, c.erL]);
      lab.setState({ emo: st ? '🛰️' : '🌍', title, lead, body: c.hint });
    }
    $('bTip')?.toggleAttribute('disabled', !!(S.tip && S.tip.t < TIPEND));
    lab.setFacts(facts('cabin')); return;
  }
  if (v === 'day') {
    const d = t.day, i = S.card, cd = d.cards[i], pk = S.picks[i], opened = S.picks.filter((x) => x !== null).length; lab.setGlow('rgba(246,161,95,.24)');
    lab.setReadout(`${opened} / 4`, d.ro, '', '#f6a15f');
    if (pk === null) lab.setState({ emo: CARD_EMO[i], title: cd.n, lead: d.pre, body: d.hint });
    else lab.setState({ emo: CARD_EMO[i], title: cd.t, lead: cd.l, body: pk === CARD_OK[i] ? t.good : t.miss });
    const list = facts('day'); if (S.picks[2] === null) list.pop(); lab.setFacts(list); return;
  }
  const w = t.win; lab.setGlow('rgba(80,140,230,.3)');
  if (S.wp === null) {
    winReadout(); lab.setState({ emo: '🪟', title: w.askT, lead: w.askL, body: '' }); lab.setFacts(facts('win', 2)); return;
  }
  const n = sunriseCount(), end = S.wt >= DAY_MIN - 0.01;
  winReadout();
  lab.setState({ emo: '🌅', title: end ? w.endT : w.midT(n), lead: end ? w.endL : w.midL, body: '' }); lab.setFacts(facts('win'));
}
function render() { buildCtrl(); info(); lab.checkStage?.(); }
const sigNow = () => `${lab.view}|${S.sec}|${S.mode}|${S.pick}|${S.ground}|${S.tip ? S.tip.t >= TIPEND : 0}|${S.tip ? S.tip.t >= 1.2 : 0}|${S.objs.length}|${S.wt >= DAY_MIN - 0.01}|${sunriseCount()}|${S.wPlay}|${Math.round(S.tallK * 100)}`;

// --- events -------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'pick') {
    S.pick = i; S.objs.forEach((o) => { o.held = false; });
    S.objs.slice(1).forEach((o, k) => { o.born = S.now + 0.9 + k * 0.18; });
    S.mode = 'station'; S.tip = null; S.cupEmpty = false; startTip(); (i === 1 ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'mode') setMode(b.dataset.m);
  else if (a === 'tip') startTip();
  else if (a === 'put') putBack();
  else if (a === 'card') { S.card = i; S.cardT = 0; sfx.click(); }
  else if (a === 'dpick') { S.picks[S.card] = i; S.cardT = 0; (i === CARD_OK[S.card] ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'next') { S.card = (S.card + 1) % 4; S.cardT = 0; sfx.click(); }
  else if (a === 'wpick') { S.wp = i; S.wt = 0; S.wPlay = true; S.wLast = 0; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'wplay') { if (S.wt >= DAY_MIN - 0.01) S.wt = 0; S.wPlay = !S.wPlay; S.wLast = sunriseCount(); sfx.click(); }
  else if (a === 'wagain') { S.wt = 0; S.wPlay = true; S.wLast = 0; sfx.click(); }
  else if (a === 'part') { S.part = S.part === b.dataset.k ? null : b.dataset.k; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; if (S.sec === 'tall') S.tallK = 0; if (S.sec === 'suit') S.part = null; sfx.click(); showStage();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const t = T[lang];
  if (ev.target.id === 'wRange') { S.wt = +ev.target.value; S.wPlay = false; S.wLast = sunriseCount(); const p = $('wPlay'); if (p) p.textContent = playLabel(t); info(); }
  else if (ev.target.id === 'tRange') { S.tallK = +ev.target.value / 100; info(); }
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), { s, ox, oy } = S.k, px = (ev.clientX - r.left - ox) / s, py = (ev.clientY - r.top - oy) / s;
  if (S.sec === 'suit') {
    let best = null, bd = 34;
    for (const k of ['helm', 'pack', 'cool']) { const d = Math.hypot(SUIT_C.x + PART_XY[k][0] * SUIT_C.sc - px, SUIT_C.y + PART_XY[k][1] * SUIT_C.sc - py); if (d < bd) { bd = d; best = k; } }
    if (best) { S.part = best; sfx.click(); render(); }
    return;
  }
  if (S.sec || lab.view !== 'cabin' || S.pick === null) return;
  for (const o of [...S.objs].reverse()) {
    if (o.born != null && S.now < o.born) continue;
    if (Math.hypot(o.x - px, (o.y - py) * 0.9) <= Math.max(o.r, o.fh) + 10) { nudge(o, px, py); break; }
  }
});

// --- the loop ------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  S.now = time;
  const v = lab.view;
  if (!S.sec && v === 'cabin') { updateTip(dt); if (S.pick !== null) step(dt); updatePud(dt); }
  else if (S.tip && S.tip.t < TIPEND) updateTip(dt);
  if (S.cardT < 5) S.cardT += dt;
  if (v === 'window' && !S.sec) {
    if (S.wp === null) { S.wt += dt * 1; if (S.wt >= DAY_MIN) S.wt = 0; }
    else if (S.wPlay) {
      S.wt = Math.min(DAY_MIN, S.wt + dt * (DAY_MIN / 20));
      const n = sunriseCount(); if (n > S.wLast) { S.wLast = n; S.wPop = time; sfx.tick(); }
      if (S.wt >= DAY_MIN) { S.wPlay = false; sfx.good(); $('wPlay') && ($('wPlay').textContent = playLabel(T[lang])); }
      const rg_ = $('wRange'); if (rg_) rg_.value = Math.round(S.wt);
    }
  }
  const sg = sigNow(); if (sg !== S.sig) { S.sig = sg; info(); }
  if (v === 'window' && !S.sec && Math.floor(S.wt) !== S.clk) winReadout();
  const s = Math.min(w / 400, h / 300), ox = (w - 400 * s) / 2, oy = (h - 300 * s) / 2; S.k = { s, ox, oy };
  c.fillStyle = lg(c, 0, 0, 0, h, [[0, '#090c18'], [1, '#121830']]); c.fillRect(0, 0, w, h);
  c.save(); c.translate(ox, oy); c.scale(s, s);
  if (S.sec === 'tall') sceneTall(c, time); else if (S.sec === 'suit') sceneSuit(c, time);
  else if (v === 'cabin') sceneCabin(c, time); else if (v === 'day') sceneDay(c, time); else sceneWin(c, time);
  c.restore();
});
render();
</script>
