const KRAFT = '#C69C6D', PINK = '#FF8FB1', INK = '#2B2140', COOKIE = '#D9A04E';
const clamp01 = (x) => Math.min(1, Math.max(0, x));

const easeO = (x) => 1 - Math.pow(1 - x, 3);
const backO = (x) => { const k = 1.70158; return 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2); };

// k > 0 darkens, k < 0 lightens; hex in, rgb() string out (final fill only)
const adj = (hex, k) => { const n = parseInt(hex.slice(1), 16); return `rgb(${[(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(k >= 0 ? v * (1 - k) : v + (255 - v) * -k))})`; };
const mulberry = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// the division sentence, split into coloured parts; g = group that pops in later (1: the quotient, 2: the remainder)
function divParts(a, b, q, r) {
  const head = { t: `${a}${lang === 'en' ? ' ÷ ' : ' : '}${b} = ` };
  const qp = { t: String(q), col: KRAFT, g: 1 }, rp = { t: String(r), col: PINK, g: 2 };
  if (lang === 'en') return [head, qp, { t: ' r ', g: 2 }, rp];
  if (lang === 'ru') return [head, qp, { t: ' (ост. ', g: 2 }, rp, { t: ')', g: 2 }];
  return [head, qp, { t: ', maradék ', g: 2 }, rp];
}
const divText = (a, b) => divParts(a, b, Math.floor(a / b), a % b).map((p) => p.t).join('');
// q × b + r = a, the check line; the + r part disappears when nothing is left
function chkParts(a, b) {
  const q = Math.floor(a / b), r = a % b, mul = lang === 'en' ? ' × ' : ' · ';
  return [{ t: String(q), col: KRAFT }, { t: `${mul}${b}` }, ...(r ? [{ t: ' + ' }, { t: String(r), col: PINK }] : []), { t: ` = ${a}` }];
}
const chkText = (a, b) => chkParts(a, b).map((p) => p.t).join('');
function partsHTML(parts, show) {
  return parts.map((p) => {
    if (p.g && !show(p.g)) return p.g === 1 ? '?' : '';
    return p.col ? `<span style="color:${p.col}">${esc(p.t)}</span>` : esc(p.t);
  }).join('');
}

// --- boxes and slots ---------------------------------------------------------------------------------------
// a box for b cookies: cols x rows slots, padded by .28 of a slot on every side
const SHAPE = { 2: [2, 1], 3: [3, 1], 4: [2, 2], 5: [5, 1], 6: [3, 2], 7: [4, 2], 8: [4, 2] };
const shapeOf = (b) => SHAPE[b] || [b, 1];
function slotXY(bx, by, s, b, i) {
  const [cols, rows] = shapeOf(b), p = 0.28 * s, r = Math.floor(i / cols), ci = i % cols;
  const inRow = r === rows - 1 ? b - cols * (rows - 1) : cols;
  return [bx + p + (cols - inRow) * s / 2 + (ci + 0.5) * s, by + p + (r + 0.5) * s];
}
// n boxes in a grid that uses the area as well as it can; returns the slot size s and each box's top-left corner
function layoutBoxes(n, b, x0, y0, x1, y1, cap = 40) {
  const [cols, rows] = shapeOf(b), AW = Math.max(40, x1 - x0), AH = Math.max(40, y1 - y0), bwU = cols + 0.56, bhU = rows + 0.56, g = 0.34;
  let best = null;
  for (let m = 1; m <= n; m++) {
    const R = Math.ceil(n / m);
    const s = Math.min(AW / (m * bwU + (m - 1) * g), AH / (R * bhU + (R - 1) * g), cap);

function drawWeek(c, w, h, dt, time) {
  const t_ = T[lang], n = S.days, d = n - S.wp;
  S.wp += Math.sign(d) * Math.min(Math.abs(d), clamp(Math.abs(d) * 1.5, 2.5, 8) * dt);
  const rn = clamp(Math.min(w, h) * 0.075, 17, 28), cx = w / 2, cy = h / 2 + 8, Rw = Math.max(60, Math.min(w * 0.34, h / 2 - rn - 34)), step = (2 * Math.PI) / 7;
  const ang = (i) => -Math.PI / 2 + i * step, wp = S.wp, laps = Math.floor(wp / 7 + 1e-6), rest = wp - 7 * laps;
  // the path round the week: full laps in box brown, the days that are left in pink
  c.save(); c.lineCap = 'round';
  c.strokeStyle = 'rgba(255,240,210,.3)'; c.lineWidth = 6; c.beginPath(); c.arc(cx, cy, Rw, 0, 7); c.stroke();
  if (laps >= 1) { c.strokeStyle = KRAFT; c.lineWidth = 9; c.shadowColor = 'rgba(30,15,5,.5)'; c.shadowBlur = 6; c.beginPath(); c.arc(cx, cy, Rw, 0, 7); c.stroke(); c.shadowBlur = 0; }
  if (rest > 0.02) { c.strokeStyle = PINK; c.lineWidth = 9; c.beginPath(); c.arc(cx, cy, Rw, ang(0), ang(rest)); c.stroke(); }
  c.restore();
  const target = n % 7, arrived = Math.abs(n - S.wp) < 0.02;
  for (let i = 0; i < 7; i++) {
    const x = cx + Math.cos(ang(i)) * Rw, y = cy + Math.sin(ang(i)) * Rw, hit = i === target && arrived, r = rn * (hit ? 1.18 : 1);
    c.save();
    c.shadowColor = 'rgba(30,15,5,.5)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
    const g = c.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, '#FFF8E8'); g.addColorStop(1, hit ? '#FFC2D5' : '#F0DDB8');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
    c.lineWidth = i === 0 || hit ? 3 : 1.5; c.strokeStyle = hit ? PINK : i === 0 ? KRAFT : '#8A6A44'; c.stroke();
    c.fillStyle = INK; c.font = `900 ${Math.round(r * 0.62)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t_.sec.days[i], x, y + 1);
    c.restore();
  }
  pill(c, w, t_.x.today, cx, cy - Rw - rn - 16, { fs: 12 });
  // the cookie that walks round, hopping from day to day
  const th = ang(rest), hop = Math.abs(Math.sin(Math.PI * wp)) * rn * 0.45, arrivedFrac = Math.abs(n - S.wp) < 0.02 ? 0 : hop;
  cookie(c, cx + Math.cos(th) * Rw, cy + Math.sin(th) * Rw, rn * 0.6, 3, { lift: arrivedFrac });
  // the weekday it lands on, in the middle
  const day = t_.sec.days[Math.round(wp) % 7];
  c.save(); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(43,33,64,.88)'; rr(c, cx - Rw * 0.52, cy - Rw * 0.4, Rw * 1.04, Rw * 0.8, 18); c.fill();
  c.fillStyle = PINK; c.font = `900 ${Math.round(Rw * 0.36)}px Nunito, sans-serif`; c.fillText(day, cx, cy - Rw * 0.1);
  c.fillStyle = '#fff'; c.font = `800 ${clamp(Rw * 0.13, 12, 16)}px Nunito, sans-serif`; c.fillText(t_.sec.inDays(n), cx, cy + Rw * 0.2);
  c.restore();
}
function drawOdd(c, w, h, dt) {
  const n = S.odd, T_ = T[lang];
  S.od += Math.sign(n - S.od) * Math.min(Math.abs(n - S.od), 14 * dt);
  const botH = clamp(h * 0.27, 96, 160), y0b = h - botH, plateR = Math.max(24, Math.min((botH - 44) / 2, w * 0.15, 62)), plate = { x: w / 2, y: y0b + 8 + plateR, R: plateR };
  const lay = layoutBoxes(10, 2, 12, 14, w - 12, y0b - 10, 44), pairs = Math.floor(n / 2), odd = n % 2;
  for (let j = 0; j < 10; j++) boxBase(c, lay.pos[j].x, lay.pos[j].y, lay.s, 2, { a: 1, ghost: true });
  for (let j = 0; j < pairs; j++) boxBase(c, lay.pos[j].x, lay.pos[j].y, lay.s, 2, { a: easeO(clamp01(S.od - 2 * j + 0.5)) });
  drawPlate(c, w, plate.x, plate.y, plate.R, 1, T_.b.left);
  const sock = (x, y, fs, u) => {
    if (u <= 0) return;
    c.save(); c.globalAlpha = 1; c.fillStyle = '#000'; c.font = `${Math.round(fs * (0.4 + 0.6 * backO(clamp01(u))))}px ${EMOJI}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🧦', x, y + 1); c.restore();
  };
  for (let k = 0; k < 2 * pairs; k++) {
    const [x, y] = slotXY(lay.pos[k >> 1].x, lay.pos[k >> 1].y, lay.s, 2, k % 2);
    sock(x, y, lay.s * 0.85, S.od - k);
  }
  if (odd) sock(plate.x, plate.y, plate.R * 0.9, S.od - 2 * pairs);
}

// --- controls, readout, state card --------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const isAsking = () => { const v = lab.view; return v === 'boxes' ? asking1() : v === 'smaller' ? S.g2 === null : S.g3 === null; };
function pick(i) {
  const v = lab.view, now = nowS();
  if (v === 'boxes') { const ok = i === R1[S.r1].ok; S.g1 = i; start1(false); (ok ? sfx.good : sfx.bad)(); }
  else if (v === 'smaller') { S.g2 = i; S.N2 = 0; S.T2 = 16; S.adds2 = []; S.ringA = null; (i === 1 ? sfx.good : sfx.bad)(); }
  else { const ok = i === STORY_OK[S.i3]; S.g3 = i; S.t3 = now; S.d3 = false; S.snd3 = 0; (ok ? sfx.good : sfx.bad)(); }
  render(); showStage();
}
askEl.addEventListener('click', (ev) => { const b = ev.target.closest('button[data-i]'); if (b) pick(+b.dataset.i); });

function rvHTML(q, ok, why, btn) {
  const t = T[lang];
  return `<div class="qq">${esc(q)}</div><div class="vd" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.wrong)}</div><p>${esc(why)}</p>${btn || ''}`;
}
const nextBtn = (act, label, enabled) => `<div class="row2"><button class="btn" data-act="${act}"${enabled ? '' : ' disabled'}>${esc(label)}</button></div>`;

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'next1') {
    if (S.r1 === 0) { S.r1 = 1; S.g1 = null; S.t1 = null; S.d1 = false; }
    else { S.r1 = 2; S.g1 = null; start1(true); }
    sfx.click();
  } else if (act === 'again1') { S.r1 = 0; S.g1 = null; S.t1 = null; S.d1 = false; S.sec = null; sfx.click(); }
  else if (act === 'pack') { start1(false); sfx.click(); showStage(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k;
    if (S.sec === 'week') S.wp = 0;
    if (S.sec === 'odd') S.od = 0;
    sfx.click(); if (S.sec) showStage();
  } else if (act === 'n2inc') { if (S.g2 === null) return; S.T2 = Math.min(30, Math.max(S.T2, S.N2) + 1); sfx.tick(); }
  else if (act === 'n2dec') { if (S.N2 > 0) { S.N2--; S.adds2.length = S.N2; S.T2 = S.N2; S.ringA = null; sfx.tick(); } }
  else if (act === 'pack2') { const n = Math.max(S.N2, S.T2) || 16; S.N2 = 0; S.adds2 = []; S.T2 = n; S.ringA = null; sfx.click(); showStage(); }
  else if (act === 'next3') { S.i3++; S.g3 = null; S.t3 = null; S.d3 = false; sfx.click(); }
  else if (act === 'again3') { S.i3 = 0; S.g3 = null; S.t3 = null; S.d3 = false; S.endAll = false; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'sN' || id === 'sB') { if (id === 'sN') S.fN = v; else S.fB = v; start1(true); }
  else if (id === 'sW') { S.days = v; }
  else if (id === 'sO') { S.odd = v; }
  else if (id === 's2B') { S.b2 = v; settle2(); }
  else return;
  render();
});

// the readout is a function of state and time, so it can follow the scene
function ro(time) {
  const t = T[lang], v = lab.view;
  if (v === 'boxes' && S.sec === 'week') { const n = S.days; return { val: partsHTML(divParts(n, 7, Math.floor(n / 7), n % 7), () => true), sub: t.sec.inDays(n), pill: '' }; }
  if (v === 'boxes' && S.sec === 'odd') { const n = S.odd; return { val: partsHTML(divParts(n, 2, Math.floor(n / 2), n % 2), () => true), sub: '', pill: n % 2 ? t.x.odd : t.x.even }; }
  if (v === 'boxes' || (v === 'story' && S.i3 === 1)) {
    const N = v === 'boxes' ? cur1().N : 26, b = v === 'boxes' ? cur1().b : 4, tt = v === 'boxes' ? run1(time) : run3(time);
    const parts = divParts(N, b, Math.floor(N / b), N % b);
    if (tt < 0) return { val: partsHTML(parts, () => false), sub: v === 'story' ? dots() : '', pill: '' };
    const pl = plan1(N, b);
    return { val: partsHTML(parts, (g) => tt >= (g === 1 ? pl.tQ : pl.tR)), sub: v === 'story' ? dots() : tt >= pl.tC ? chkText(N, b) : '', pill: v === 'boxes' && tt >= pl.tR ? `${t.b.left}: ${N % b}` : '' };
  }
  if (v === 'smaller') {
    if (S.g2 === null) return { val: partsHTML(divParts('?', S.b2, '?', '?'), () => false), sub: '', pill: '' };
    const n = S.landed2, parts = divParts(n, S.b2, Math.floor(n / S.b2), n % S.b2);
    return { val: partsHTML(parts, () => true), sub: '', pill: S.b2 === 5 ? t.s.never : '' };
  }
  const parts = divParts(26, 4, 6, 2), tt = run3(time), P = S.i3 === 0 ? carPlan : S.i3 === 2 ? ribPlan : plan1(26, 4);
  if (tt < 0) return { val: partsHTML(parts, () => false), sub: dots(), pill: '' };
  return { val: partsHTML(parts, (g) => tt >= (g === 1 ? P.tQ : P.tR)), sub: dots(), pill: '' };
}
const dots = () => [0, 1, 2].map((i) => (i < S.i3 ? '●' : i === S.i3 ? '◉' : '○')).join(' ');
let roKey = '';
function syncRo(time) {
  const r = ro(time), key = `${r.val}|${r.sub}|${r.pill}`;
  if (key === roKey) return;
  roKey = key; lab.setReadout(r.val, r.sub, r.pill, '#A9743F');
}

function stateOf(t) {
  const v = lab.view;
  if (v === 'boxes' && S.sec) { const k = S.sec; return { emo: k === 'week' ? '📅' : '⚖️', title: t.secrets[k][0], lead: t.sec[k === 'week' ? 'weekText' : 'oddText'], body: '' }; }
  const key = v === 'boxes' ? 'boxes' : v === 'smaller' ? 'smaller' : 'story';
  const full = v === 'boxes' ? S.r1 === 2 || (S.r1 === 1 && S.g1 !== null && S.d1) : v === 'smaller' ? S.done2 : S.endAll;
  const [emo, title, lead, body] = t.st[key][full ? 1 : 0];
  return { emo, title, lead, body };
}

const setVal = (id, v) => { const e = $(id); if (e.value !== String(v)) e.value = v; };
function render() {
  const t = T[lang], v = lab.view, time = nowS(), asking = isAsking();
  document.body.dataset.v = asking ? 'ask' : v;
  lab.setGlow('rgba(198, 156, 109, .26)');
  $('p1').style.display = v === 'boxes' ? '' : 'none';
  $('p2').style.display = v === 'smaller' ? '' : 'none';
  $('p3').style.display = v === 'story' ? '' : 'none';
  askEl.style.display = asking ? '' : 'none';
  if (v !== 'boxes') { $('rv1').innerHTML = ''; $('bPack').textContent = ''; $('bAgain1').textContent = ''; }
  if (v !== 'smaller') { $('rv2').innerHTML = ''; $('bPack2').textContent = ''; }
  if (v !== 'story') $('rv3').innerHTML = '';
  if (asking) {
    let q, o;
    if (v === 'boxes') { const rd = R1[S.r1]; q = t.b[rd.q]; o = t.b[rd.o]; }
    else if (v === 'smaller') { q = t.s.q; o = t.s.o; }
    else { q = t.t.q[S.i3]; o = t.t.o[S.i3]; }
    askEl.innerHTML = `<div class="q">${esc(q)}</div><div class="o${o.some((x) => x.length > 14) ? ' col' : ''}">${o.map((x, i) => `<button data-i="${i}">${esc(x)}</button>`).join('')}</div>`;
  }
  if (v === 'boxes') {
    const rd = R1[S.r1], revealed = S.r1 < 2 && S.g1 !== null, free = S.r1 === 2;
    $('rv1').style.display = revealed && !S.sec ? '' : 'none';
    $('rv1').innerHTML = revealed ? rvHTML(t.b[rd.q], S.g1 === rd.ok, t.b[rd.r], nextBtn('next1', t.next, S.d1)) : '';
    $('free1').style.display = free && !S.sec ? '' : 'none';
    $('lN').textContent = t.b.cookies; $('lB').textContent = t.b.size; setVal('sN', S.fN); setVal('sB', S.fB);
    $('vN').textContent = S.fN; $('vB').textContent = S.fB;
    $('bPack').textContent = t.b.pack; $('bAgain1').textContent = t.again;
    $('secCtl').style.display = S.sec ? '' : 'none';
    $('wk').style.display = S.sec === 'week' ? '' : 'none'; $('od').style.display = S.sec === 'odd' ? '' : 'none';
    setVal('sW', S.days); setVal('sO', S.odd);
    $('vW').textContent = t.sec.inDays(S.days); $('vO').textContent = S.odd;
    const unlocked = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${unlocked ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${unlocked ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    $('chips').innerHTML = sc('week', '📅') + sc('odd', '⚖️');
  } else if (v === 'smaller') {
    const revealed = S.g2 !== null;
    $('rv2').style.display = revealed ? '' : 'none';
    $('rv2').innerHTML = revealed ? rvHTML(t.s.q, S.g2 === 1, t.s.r, '') : '';
    $('free2').style.display = revealed ? '' : 'none';
    $('l2B').textContent = t.b.size; $('l2N').textContent = t.b.cookies; $('bPack2').textContent = t.b.pack;
    setVal('s2B', S.b2); $('v2B').textContent = S.b2;
    $('v2N').textContent = Math.max(S.N2, S.T2);
  } else {
    const revealed = S.g3 !== null, last = S.i3 === 2;
    $('rv3').style.display = revealed ? '' : 'none';
    $('rv3').innerHTML = !revealed ? '' : rvHTML(t.t.q[S.i3], S.g3 === STORY_OK[S.i3], t.t.why[S.i3], nextBtn(last ? 'again3' : 'next3', last ? t.again : t.next, S.d3));
  }
  lab.setState({ ...stateOf(t), extra: '' });
  syncRo(time);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  c.save(); c.beginPath(); c.roundRect(0, 0, w, h, 20); c.clip();
  wood(c, w, h);
  c.lineJoin = 'round';
  const v = lab.view;
  if (v === 'boxes') { if (S.sec === 'week') drawWeek(c, w, h, dt, time); else if (S.sec === 'odd') drawOdd(c, w, h, dt); else drawBoxes(c, w, h, time); }
  else if (v === 'smaller') drawSmaller(c, w, h, time, dt);
  else drawStory(c, w, h, time);
  c.restore();
  syncRo(time);
  const n2 = String(Math.max(S.N2, S.T2));
  if ($('v2N').textContent !== n2) $('v2N').textContent = n2;
});
render();
</script>
