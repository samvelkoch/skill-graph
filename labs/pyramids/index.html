const C = { sand: '#E8C27A', wet: '#B8935A', sky: '#F6E7C1', skyLow: '#F2C98B', stone: '#E6DCC3', wood: '#9B6B3D', nile: '#3E8FA8', linen: '#F4F1E8',

const TAU = Math.PI * 2;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => { t = clamp01(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);
const rgbOf = (hx) => { const n = parseInt(hx.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const toHex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = rgbOf(a), B = rgbOf(b); return toHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); };
const shade = (hx, k) => (k >= 0 ? mix(hx, '#000000', k) : mix(hx, '#FFFFFF', -k)); // k > 0 darker, k < 0 lighter
const rgba = (hx, a) => { const [r, g, b] = rgbOf(hx); return `rgba(${r},${g},${b},${a})`; };
const rnd = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const clock = () => performance.now() / 1000;
const SKIN = mix(C.wood, C.sand, 0.22), ROCK = mix(C.sand, C.stone, 0.45), WATER = mix(C.nile, '#FFFFFF', 0.45), ROPE = mix(C.wood, C.linen, 0.5);
const NUMLOC = { en: 'en-US', ru: 'ru-RU', hu: 'hu-HU' };

const disc = (c, x, y, r, fill, stroke, lw = 1) => {
  c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.stroke(); }
};
const rrect = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, r)); };
const poly = (c, pts) => { c.beginPath(); pts.forEach(([X, Y], i) => (i ? c.lineTo(X, Y) : c.moveTo(X, Y))); c.closePath(); };
const softShadow = (c, x, y, rx, ry, a = 0.28) => { c.save(); c.globalAlpha = 1; c.fillStyle = rgba(C.ink, a); c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, TAU); c.fill(); c.restore(); };

// a dark rounded label that stays inside the canvas
function pill(c, W, H, text, x, y, o = {}) {
  c.save(); c.globalAlpha = o.alpha ?? 1;
  const size = o.size ?? 13;
  c.font = `800 ${size}px Nunito, sans-serif`; c.textBaseline = 'middle';
  const tw = c.measureText(text).width, bw = tw + 18, bh = size + 11;
  let bx = o.align === 'l' ? x : o.align === 'r' ? x - bw : x - bw / 2, by = y - bh / 2;
  bx = clamp(bx, 4, Math.max(4, W - bw - 4)); by = clamp(by, 4, Math.max(4, H - bh - 4));
  c.fillStyle = o.bg ?? 'rgba(30,26,46,.82)'; rrect(c, bx, by, bw, bh, bh / 2); c.fill();
  if (o.edge) { c.lineWidth = 1.2; c.strokeStyle = o.edge; c.stroke(); }
  c.fillStyle = o.fg ?? '#fff'; c.textAlign = 'center'; c.fillText(text, bx + bw / 2, by + bh / 2 + 0.5);
  c.restore();
  return { x: bx, y: by, w: bw, h: bh };
}

// --- the desert at Giza: sky, low sun, far pyramids, dunes, ripples, heat shimmer ------------------------------
function farPyramids(c, w, hz, list = [[0.5, 0.11], [0.67, 0.165], [0.86, 0.09]]) {
  for (const [fx, fh] of list) {
    const hw = w * fh * 1.05, ph = hw * 0.66, x = w * fx, by = hz + 2;
    let g = c.createLinearGradient(x - hw, by - ph, x, by);
    g.addColorStop(0, shade(C.lit, -0.2)); g.addColorStop(1, C.lit);
    c.fillStyle = g; poly(c, [[x - hw, by], [x, by - ph], [x, by]]); c.fill();
    g = c.createLinearGradient(x, by - ph, x + hw, by);
    g.addColorStop(0, C.dark); g.addColorStop(1, shade(C.dark, 0.1));
    c.fillStyle = g; poly(c, [[x, by - ph], [x + hw, by], [x, by]]); c.fill();
    g = c.createLinearGradient(0, by - ph, 0, by);
    g.addColorStop(0, rgba(C.skyLow, 0)); g.addColorStop(1, rgba(C.skyLow, 0.55));
    c.fillStyle = g; poly(c, [[x - hw, by], [x, by - ph], [x + hw, by]]); c.fill();
  }
}

}

function renderReadout() {
  const v = lab.view, S = V[v], t = T[lang], c = ACCENT[v];
  lab.setGlow(GLOW[v]);
  if (v === 'sledge') {
    if (S.sec === 'diary') return lab.setReadout(t.sec.day(diaryDay(S, clock()).day), '', '', c);
    if (S.sec === 'north') { const deg = lerp(26, 0.06, ease((clock() - S.secAt) / 5.2)); return lab.setReadout(deg < 0.5 ? '&lt; 0.1°' : `${Math.round(deg)}°`, '', '', c); }
    if (S.r === 2) { const w = S.water / 100; return lab.setReadout(esc(t.s.need(Math.round(needOf(w)))), t.s.state[stateOf(w)], '', c); }
    if (S.ph === 'ask') return lab.setReadout('?', '', '', c);
    return lab.setReadout(esc(t.s.need(5)), t.s.state[1], '', c);
  }
  if (v === 'build') {
    if (S.r === 2) return lab.setReadout(esc(t.b.cubes((S.layers * (S.layers + 1) * (2 * S.layers + 1)) / 6)), t.b.layers(S.layers), '', c);
    if (S.ph === 'ask') return lab.setReadout('?', '', '', c);
    if (S.r === 0) return lab.setReadout(esc(buildText(clock() - S.t0)), '', '', c);
    return lab.setReadout(esc(`${t.b.about} ${fmt(BLOCKS)}`), '', '', c);
  }
  if (S.ph === 'ask') return lab.setReadout('?', '', '', c);
  return lab.setReadout(`73 ${esc(t.b.m)} × 20 ${esc(t.b.m)}`, '', '', c);
}
function render() {
  const v = lab.view, S = V[v], t = T[lang];
  document.body.dataset.v = v;
  const full = (S.r === 1 && S.ph === 'rev') || S.r === 2, [emo, title, lead, body] = STATE[v][lang][full ? 'f' : 'n'];
  if (v === 'sledge' && S.sec) {
    const k = S.sec;
    lab.setState({ emo: k === 'diary' ? '📜' : '🧭', title: t.secrets[k][0], lead: t.secrets[k][1], body: t.sec[k + 'Text'], extra: '' });
  } else lab.setState({ emo, title, lead, body, extra: '' });
  $('ctrlBody').innerHTML = controls(v, S, t);
  renderReadout();
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const v = lab.view, S = V[v], act = b.dataset.act, now = clock();
  if (act === 'pick') {
    if (S.ph !== 'ask') return;
    const i = +b.dataset.i; S.pick = i; S.ph = 'rev'; S.t0 = now; S.lastRead = '';
    (i === qaOf(v, S).ok ? sfx.good : sfx.bad)();
    render(); showStage(); return;
  }
  if (act === 'next') { S.r++; S.ph = S.r >= 2 ? 'play' : 'ask'; S.pick = null; S.t0 = now; S.lastRead = ''; sfx.click(); render(); showStage(); return; }
  if (act === 'again') {
    S.r = 0; S.ph = 'ask'; S.pick = null; S.t0 = now; S.sec = null; S.lastRead = ''; sfx.click();
    if (v === 'sledge') S.water = 50;
    if (v === 'sphinx') { wind.length = 0; chips.length = 0; }
    render(); showStage(); return;
  }
  if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) { secret.open(); return; }
    S.sec = S.sec === k ? null : k; S.secAt = now; S.lastRead = ''; sfx.click(); render(); showStage(); return;
  }
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'py-slider') { V.sledge.water = +ev.target.value; sfx.tick(); renderReadout(); }
  else if (id === 'py-layers') { const S = V.build, n = +ev.target.value; if (n > S.layers) S.grow = 0; S.layers = n; sfx.tick(); renderReadout(); const a = ev.target; a.setAttribute('aria-label', T[lang].b.layers(n)); }
});

// --- the loop --------------------------------------------------------------------------------------------------
let logged = false;
const cvEl = $('cv');
canvasLoop(cvEl, (c, W, H, dt) => {
  c.setTransform(cvEl.width / W, 0, 0, cvEl.height / H, 0, 0);
  c.globalAlpha = 1; c.setLineDash([]); c.lineWidth = 1; c.lineCap = 'butt'; c.lineJoin = 'miter'; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.shadowBlur = 0;
  const t = clock(), v = lab.view;
  try {
    if (v === 'sledge') drawSledgeView(c, W, H, dt, t);
    else if (v === 'build') drawBuildView(c, W, H, dt, t);
    else drawSphinxView(c, W, H, dt, t);
  } catch (e) { if (!logged) { logged = true; console.error(e); } }
});
render();
</script>
</body>
</html>
