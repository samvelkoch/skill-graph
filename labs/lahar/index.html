  for (let i = 0; i < 300; i++) {
    const x = padX + (i % 50) * cell + (cell - sq) / 2, y = gy + Math.floor(i / 50) * rowH + (rowH - sq) / 2, on = i < shown, boom = on && O.years[i];
    if (boom) continue;
    c.fillStyle = on ? 'rgba(150,170,220,.5)' : 'rgba(130,145,190,.14)'; c.beginPath(); c.roundRect(x, y, sq, sq, Math.max(0, sq * 0.22)); c.fill();
  }
  for (const i of st.E) if (i < shown) {
    const x = padX + (i % 50) * cell + cell / 2, y = gy + Math.floor(i / 50) * rowH + rowH / 2, pop = 1 + 0.5 * Math.max(0, 1 - (shown - i) / 14);
    const g = c.createRadialGradient(x, y, 0, x, y, cell * 2.4); g.addColorStop(0, 'rgba(255,90,79,.7)'); g.addColorStop(1, 'rgba(255,90,79,0)'); c.fillStyle = g; c.beginPath(); c.arc(x, y, cell * 2.4, 0, TAU); c.fill();
    c.fillStyle = '#ff5a4f'; c.strokeStyle = '#ffd0cb'; c.lineWidth = 1; c.beginPath(); c.roundRect(x - sq * pop * 0.8, y - sq * pop * 0.8, sq * pop * 1.6, sq * pop * 1.6, 3); c.fill(); c.stroke();
  }
  if (O.years && p < 1) { const i = shown, x = padX + (i % 50) * cell, y = gy + Math.floor(i / 50) * rowH; c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.strokeRect(x, y + (rowH - sq) / 2 - 1, cell, sq + 2); }
  // the same years on one line, with the gaps between eruptions
  const ty0 = gy + gh + 22, tbot = h - 12, base = tbot - 26, x0 = padX, x1 = w - padX, X = (i) => x0 + ((i + 0.5) / 300) * (x1 - x0);
  c.fillStyle = 'rgba(16,19,31,.9)'; c.strokeStyle = 'rgba(130,145,190,.25)'; c.beginPath(); c.roundRect(padX - 8, ty0 - 8, w - padX * 2 + 16, tbot - ty0 + 16, 14); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(190,205,255,.5)'; c.lineWidth = 2; c.beginPath(); c.moveTo(x0, base); c.lineTo(x1, base); c.stroke();
  c.font = '800 12px Nunito, sans-serif'; c.textBaseline = 'top'; c.fillStyle = '#98A0B8';
  [0, 100, 200, 300].forEach((yr) => { const x = x0 + (yr / 300) * (x1 - x0); c.strokeStyle = 'rgba(190,205,255,.35)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, base - 5); c.lineTo(x, base + 5); c.stroke(); if (yr) { c.setLineDash([3, 4]); c.beginPath(); c.moveTo(x, base - 5); c.lineTo(x, ty0 + 4); c.stroke(); c.setLineDash([]); } c.textAlign = yr === 0 ? 'left' : yr === 300 ? 'right' : 'center'; c.fillText(String(yr), x, base + 8); });
  const stem = clamp((base - ty0) * 0.45, 40, 90), vis = st.E.filter((i) => i < shown);
  vis.forEach((i, n) => {
    const x = X(i); c.strokeStyle = '#ff5a4f'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x, base); c.lineTo(x, base - stem); c.stroke();
    c.fillStyle = '#ff5a4f'; c.strokeStyle = '#ffd0cb'; c.lineWidth = 1; c.beginPath(); c.arc(x, base - stem, 6, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(x - 1.8, base - stem - 1.8, 1.6, 0, TAU); c.fill();
    if (n) { const xa = X(vis[n - 1]), g = i - vis[n - 1], mn = g === st.gap && p >= 1, yy = base - stem - 16;
      c.strokeStyle = mn ? '#ffd43b' : 'rgba(255,255,255,.55)'; c.lineWidth = mn ? 3 : 1.5; c.beginPath(); c.moveTo(xa, yy + 4); c.lineTo(xa, yy); c.lineTo(x, yy); c.lineTo(x, yy + 4); c.stroke();
      if (mn) pill(c, T[lang].gap(g), (xa + x) / 2, yy - 28, { center: true, min: padX - 4, max: w - padX + 4, bg: 'rgba(60,48,0,.92)', col: '#ffd43b' });
      else if (x - xa >= 24) { c.fillStyle = '#c6cde0'; c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillText(String(g), (xa + x) / 2, yy - 2); } }
  });
}

function drawAlert(c, w, h, dt, time) {
  const A = S.al;
  if (A.stage === 'boom') {
    A.at += dt;
    if (!A.done && A.at > tEnd('large') + 0.8) { A.done = true; A.out = outcome(); (A.out.key === 'inTime' ? sfx.good : sfx.bad)(); render(); }
    return drawScene(c, w, h, time, { t: A.at, wind: 'E', size: 'large', picks: evacSet(), status: true, zones: false, legend: false });
  }
  if (A.stage === 'case') return;
  const pad = 10, lw = w < 420 ? 62 : 90, pw = w - pad * 2 - lw - 10, ph = (h - pad * 2 - 16) / 3, day = A.day, lv = lvAt(day);
  SKEYS.forEach((key, n) => {
    const x = pad, y = pad + n * (ph + 8), val = SIG[key][day - 1], f = Math.pow(val / SMAX[key], 0.65), nd = A.needle[n];
    const acc = (f - nd.x) * 120 - nd.v * 14; nd.v += acc * dt; nd.x += nd.v * dt;
    const g = c.createLinearGradient(x, y, x, y + ph); g.addColorStop(0, '#1a2038'); g.addColorStop(1, '#0f1220');
    c.fillStyle = g; c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(x, y, pw, ph, 16); c.fill(); c.stroke();
    pill(c, T[lang].signals[key], x + 10, y + 8, { bg: 'rgba(130,145,190,.16)', col: '#d3d9e8', max: x + pw - 6 });
    const R = Math.min(46, (ph - 54) * 0.9, pw * 0.27), cx = x + 14 + R, cy = y + ph - 28;
    c.lineWidth = 8; c.lineCap = 'butt';
    [[0, 0.4, '#6fae5a'], [0.4, 0.65, '#ffd43b'], [0.65, 0.85, '#ffa94d'], [0.85, 1, '#ff5a4f']].forEach(([a, b, col]) => { c.strokeStyle = col; c.beginPath(); c.arc(cx, cy, Math.max(0, R), Math.PI + a * Math.PI, Math.PI + b * Math.PI - 0.02); c.stroke(); });
    const ang = Math.PI + clamp(nd.x, 0, 1.04) * Math.PI;
    c.strokeStyle = 'rgba(0,0,0,.5)'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(cx + 1, cy + 1); c.lineTo(cx + Math.cos(ang) * (R - 3) + 1, cy + Math.sin(ang) * (R - 3) + 1); c.stroke();
    c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(ang) * (R - 3), cy + Math.sin(ang) * (R - 3)); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(cx, cy, 5, 0, TAU); c.fill();
    c.fillStyle = SCOL[key]; c.font = '900 16px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(Math.round(val)), cx, cy + 16);
    // the graph of every day so far
    const sx0 = cx + R + 18, sx1 = x + pw - 12, sy0 = y + 40, sy1 = y + ph - 14;
    if (sx1 - sx0 > 40) {
      const X = (d) => sx0 + ((d - 1) / 29) * (sx1 - sx0), Y = (v) => sy1 - clamp01(v / SMAX[key]) * (sy1 - sy0);
      c.strokeStyle = 'rgba(190,205,255,.25)'; c.lineWidth = 1; c.beginPath(); c.moveTo(sx0, sy1); c.lineTo(sx1, sy1); c.stroke();
      const sg = c.createLinearGradient(0, sy0, 0, sy1); sg.addColorStop(0, SCOL[key] + '66'); sg.addColorStop(1, SCOL[key] + '00');
      c.beginPath(); c.moveTo(X(1), sy1); for (let d = 1; d <= day; d++) c.lineTo(X(d), Y(SIG[key][d - 1])); c.lineTo(X(day), sy1); c.closePath(); c.fillStyle = sg; c.fill();
      c.strokeStyle = SCOL[key]; c.lineWidth = 2; c.lineJoin = 'round'; c.beginPath(); for (let d = 1; d <= day; d++) { const px = X(d), py = Y(SIG[key][d - 1]); if (d === 1) c.moveTo(px, py); else c.lineTo(px, py); } c.stroke();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(X(day), Y(val), 4, 0, TAU); c.fill();
    }
  });
  // the traffic light
  const lx = w - pad - lw, ly = pad, lh = h - pad * 2, g = c.createLinearGradient(lx, 0, lx + lw, 0); g.addColorStop(0, '#222842'); g.addColorStop(1, '#10131f');
  c.fillStyle = g; c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(lx, ly, lw, lh, 18); c.fill(); c.stroke();
  const lr = Math.min(lw * 0.34, (lh - 70) / 8.6);
  ['red', 'orange', 'yellow', 'green'].forEach((k, i) => {
    const cx = lx + lw / 2, cy = ly + 18 + lr + i * (lr * 2 + 12), on = k === lv;
    c.fillStyle = on ? LVC[k] : LVC[k] + '33'; c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 2; c.beginPath(); c.arc(cx, cy, Math.max(0, lr), 0, TAU); c.fill(); c.stroke();
    if (on) { const gl = c.createRadialGradient(cx, cy, lr * 0.5, cx, cy, lr * 2.3); gl.addColorStop(0, LVC[k] + '88'); gl.addColorStop(1, LVC[k] + '00'); c.fillStyle = gl; c.beginPath(); c.arc(cx, cy, lr * 2.3, 0, TAU); c.fill(); c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc(cx - lr * 0.3, cy - lr * 0.3, lr * 0.28, 0, TAU); c.fill(); }
  });
  pill(c, `${T[lang].day} ${day}`, lx + lw / 2, ly + lh - 28, { center: true, min: lx + 2, max: lx + lw + 2 });
}

function drawMapView(c, w, h, dt, time) {
  if (S.t >= 0) { S.t = Math.min(S.t + dt, 999); if (!S.mapSeen && S.t > tEnd(S.size) + 1.4) { S.mapSeen = true; render(); } }
  if (S.sec === 'a' && secret.unlocked()) return drawSecretA(c, w, h, time);
  if (S.sec === 'b' && secret.unlocked()) return drawSecretB(c, w, h, time);
  drawScene(c, w, h, time, { t: S.t, wind: S.wind, size: S.size, picks: S.picks, status: true, zones: true, legend: true });
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  c.lineJoin = 'round';
  if (lab.view === 'map') drawMapView(c, w, h, dt, time); else if (lab.view === 'odds') drawOdds(c, w, h, dt, time); else drawAlert(c, w, h, dt, time);
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const startErupt = () => { S.t = 0; S.sec = null; sfx.snap(); showStage(); };
function startBoom() { const A = S.al; A.stage = 'boom'; A.at = 0; A.done = false; A.day = 30; sfx.snap(); showStage(); }
function pickTown(i) { if (S.picks.has(i)) S.picks.delete(i); else S.picks.add(i); sfx.tick(); render(); }
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'map' || S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  let best = -1, bd = 26;
  TOWNS.forEach((q, i) => { const d = Math.hypot(x - q.px, y - q.py); if (d < bd) { bd = d; best = i; } });
  if (best >= 0) pickTown(best);
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, A = S.al;
  if (a === 'town') return pickTown(+b.dataset.i);
  if (a === 'go') startErupt();
  else if (a === 'wind') { S.wind = b.dataset.k; if (S.t >= 0) S.t = 0; sfx.click(); }
  else if (a === 'size') { S.size = b.dataset.k; if (S.t >= 0) S.t = 0; sfx.click(); }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === b.dataset.k ? null : b.dataset.k; if (S.sec && lab.view !== 'map') { lab.view = 'map'; lab.renderChrome(); } sfx.click(); }
  else if (a === 'roll') { doRoll(); showStage(); }
  else if (a === 'wk') { if (+b.dataset.d <= maxDay()) { A.day = +b.dataset.d; sfx.tick(); } }
  else if (a === 'lv') { const i = DEC.indexOf(A.day); if (i >= 0) { A.lv[i] = b.dataset.k; sfx.click(); } }
  else if (a === 'rep') { A.stage = 'play'; A.day = 1; A.lv = [null, null, null, null]; A.done = false; A.out = null; sfx.click(); }
  else if (a === 'arm') { A.stage = 'case'; sfx.click(); }
  render();
});
$('lhDay').addEventListener('input', (ev) => {
  const A = S.al; if (A.stage !== 'play') return;
  A.day = Math.min(+ev.target.value, maxDay()); sfx.tick();
  if (A.day >= 30) startBoom();
  render();
});
$('overlay').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-ask]'); if (!b) return;
  const kind = b.dataset.ask, O = kind === 'od' ? S.od : S.al;
  if (b.dataset.o != null) { O.pick = +b.dataset.o; (O.pick === 0 ? sfx.good : sfx.bad)(); }
  else if (kind === 'od') { doRoll(); showStage(); }
  else { S.al.asked = true; S.al.stage = 'play'; sfx.click(); showStage(); }
  render();
});

// --- one render per change: controls, readout, state card, facts ---------------------------------------------
function askHtml(kind, t) {
  const O = kind === 'od' ? S.od : S.al, q = kind === 'od' ? t.qOdds : t.qExact, opts = kind === 'od' ? t.optsOdds : t.optsExact, why = kind === 'od' ? t.oddsWhy : t.exactWhy;
  if (O.pick === null) return `<div class="q">${esc(q)}</div>${O.order.map((i) => `<button class="o" data-ask="${kind}" data-o="${i}">${esc(opts[i])}</button>`).join('')}`;
  const ok = O.pick === 0;
  return `<div class="v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.notQuite)}</div><p>${esc(why)}</p><button class="o" data-ask="${kind}" style="width:auto;display:inline-block;background:#fff;color:#0A0C14;padding:9px 24px">${esc(kind === 'od' ? t.roll : `${t.day} 1 →`)}</button>`;
}
function render() {
  const t = T[lang], v = lab.view, A = S.al;
  document.body.dataset.v = v === 'map' ? 'map' : v === 'odds' ? (S.od.asked ? 'odds' : 'odds-ask') : `alert-${A.stage}`;
  $('lhMap').style.display = v === 'map' ? 'block' : 'none';
  $('lhOdds').style.display = v === 'odds' && S.od.asked ? 'block' : 'none';
  $('lhAlert').style.display = v === 'alert' ? 'block' : 'none';
  askO.style.display = v === 'odds' && !S.od.asked ? 'block' : 'none';
  askA.style.display = v === 'alert' && A.stage === 'ask' ? 'block' : 'none';
  outEl.style.display = v === 'alert' && A.stage === 'boom' && A.done ? 'block' : 'none';
  storyEl.style.display = v === 'alert' && A.stage === 'case' ? 'block' : 'none';
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip lh-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('lhSec').innerHTML = sc('a', '🌾') + sc('b', '🏔️');
  if (v === 'map') renderMap(t); else if (v === 'odds') renderOdds(t); else renderAlert(t);
}
function renderMap(t) {
  const run = S.t >= 0, secOn = S.sec && secret.unlocked();
  lab.setGlow('rgba(160, 110, 60, .28)');
  $('lhPick').textContent = run ? '' : t.pickTowns; $('lhPick').style.display = run ? 'none' : 'block';
  $('lhTowns').innerHTML = TOWNS.map((_, i) => `<button class="chip lh-c ${S.picks.has(i) ? 'on' : ''}" data-act="town" data-i="${i}" aria-pressed="${S.picks.has(i)}">${S.picks.has(i) ? '✓ ' : ''}${esc(t.towns[i])}</button>`).join('');
  $('lhGo').textContent = run ? t.replay : t.erupt;
  $('lhOpt').style.display = run ? 'block' : 'none';
  $('lhWl').textContent = t.wind; $('lhSl').textContent = t.size;
  $('lhWind').innerHTML = ['N', 'E', 'S', 'W'].map((d) => `<button class="chip lh-c ${S.wind === d ? 'on' : ''}" data-act="wind" data-k="${d}">${GLYPH[d]} ${esc(t.dir[d])}</button>`).join('');
  $('lhSize').innerHTML = ['small', 'large'].map((d) => `<button class="chip lh-c ${S.size === d ? 'on' : ''}" data-act="size" data-k="${d}">${esc(t[d])}</button>`).join('');
  if (secOn) { const e = S.sec === 'a' ? '🌾' : '🏔️', s = t.secrets[S.sec]; lab.setReadout(run ? t.ofFive(TOWNS.filter((_, i) => statusOf(i, S.wind, S.size).st === 'lahar').length) : '?', run ? t.hitByLahar : '', '', '#a8743f'); lab.setState({ emo: e, title: s[0], lead: s[1], body: '', extra: '' }); lab.setFacts([]); return; }
  if (!run) { lab.setReadout('?', '', '', '#a8743f'); lab.setState({ emo: '🌋', title: t.views.map, lead: t.pickTowns, body: '', extra: '' }); lab.setFacts([]); return; }
  const hit = TOWNS.map((_, i) => i).filter((i) => statusOf(i, S.wind, S.size).st === 'lahar');
  lab.setReadout(t.ofFive(hit.length), t.hitByLahar, '', '#a8743f');
  const missed = hit.filter((i) => !S.picks.has(i));
  lab.setFacts(t.facts.map);
  lab.setState({ ...t.state.map, extra: missed.map((i) => `<div>⚠️ <b>${esc(t.towns[i])}</b>: ${esc(t.missed)}</div>`).join('') });
}
function renderOdds(t) {
  const O = S.od; lab.setGlow('rgba(255, 90, 79, .22)');
  askO.innerHTML = askHtml('od', t); $('lhRoll').textContent = t.roll;
  if (!O.asked) { lab.setReadout('?', '', '', '#ff5a4f'); lab.setState({ emo: '🤔', title: t.qOdds, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  const st = oddsStats(O.years);
  lab.setReadout(String(st.n), t.eruptions, st.gap != null ? t.gap(st.gap) : '', '#ff5a4f');
  lab.setState({ ...t.state.odds, body: t.oddsWhy, extra: '' }); lab.setFacts(t.facts.odds);
}
function renderAlert(t) {
  const A = S.al; lab.setGlow('rgba(255, 169, 77, .24)');
  askA.innerHTML = askHtml('al', t);
  $('lhPlay').style.display = A.stage === 'play' ? 'block' : 'none';
  $('lhPost').style.display = (A.stage === 'boom' && A.done) || A.stage === 'case' ? 'flex' : 'none';
  $('lhRep').textContent = t.replay; $('lhArm').textContent = t.armeroBtn; $('lhArm').style.display = A.stage === 'case' ? 'none' : '';
  if (A.stage === 'ask') { lab.setReadout('?', '', '', '#ffa94d'); lab.setState({ emo: '🤔', title: t.qExact, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  lab.setFacts(t.facts.alert);
  const lv = lvAt(A.day), dec = DEC.indexOf(A.day);
  lab.setReadout(t.levels[lv], t.alertOn(A.day), '', LVC[lv]);
  $('lhDayT').textContent = `${t.day} ${A.day}`; $('lhDay').value = A.day;
  $('lhWks').innerHTML = DEC.map((d, i) => `<button class="lh-wk" data-act="wk" data-d="${d}" aria-label="${esc(t.day)} ${d}" ${d > maxDay() ? 'disabled' : ''} style="--c:${A.lv[i] ? LVC[A.lv[i]] : 'transparent'}">${d}</button>`).join('');
  $('lhSetL').textContent = dec >= 0 ? t.setLevel : `${t.levels[lv]}: ${t.levelDo[lv]}`;
  $('lhLvs').innerHTML = LV.map((k) => `<button class="lh-lv ${dec >= 0 && A.lv[dec] === k ? 'on' : ''}" data-act="lv" data-k="${k}" style="--c:${LVC[k]}" ${dec < 0 ? 'disabled' : ''}><b>${esc(t.levels[k])}</b><span>${esc(t.levelDo[k])}</span></button>`).join('');
  if (A.stage === 'play') { lab.setState({ ...t.state.alert, extra: '' }); return; }
  if (A.stage === 'boom') {
    if (!A.done) { lab.setState({ ...t.state.map, extra: '' }); return; }
    const o = A.out, em = { inTime: '✅', late: '⚠️', early: '⏳' }[o.key];
    lab.setState({ emo: em, title: t.outcome[o.key], lead: t.cost(o.days), body: t.state.alert.body, extra: '' });
    outEl.innerHTML = `<div class="t" style="color:${o.key === 'inTime' ? 'var(--ok)' : 'var(--wip)'}">${esc(t.outcome[o.key])}</div><div class="lh-bar">${Array.from({ length: 30 }, (_, i) => `<i style="--c:${LVC[lvAt(i + 1)]}"></i>`).join('')}</div><div class="c">${esc(t.cost(o.days))}</div>`;
    return;
  }
  const art = [['🌋', 'linear-gradient(135deg,#5b3a2a,#2a1c30)'], ['🗺️', 'linear-gradient(135deg,#2f5f4a,#1c2a3a)'], ['🧊', 'linear-gradient(135deg,#3a5f8a,#1c2440)'], ['🌊', 'linear-gradient(135deg,#7a5a3a,#2a1c18)']];
  storyEl.innerHTML = `<div class="lh-sg">${t.armero.map((s, i) => `<div class="lh-sp"><div class="lh-sa" style="--g:${art[i][1]}">${art[i][0]}</div><span class="lh-sn">${i + 1}</span><p>${esc(s)}</p></div>`).join('')}</div><div class="lh-less">${esc(t.armeroLesson)}</div>`;
  lab.setState({ emo: '🇨🇴', title: t.armeroBtn, lead: t.armeroLesson, body: '', extra: '' });
}
render();
</script>
</body>
