  const top = dy + dh + 14, cw = (w - 30) / 2, ch = (h - top - 14) / 2;
  s.cards.forEach((cd, i) => {
    const sel = S.num === i, x = 10 + (i % 2) * (cw + 10), y = top + Math.floor(i / 2) * (ch + 8) - (sel ? 3 + Math.sin(t * 3) : 0);
    if (sel) { c.shadowColor = 'rgba(245,200,76,.9)'; c.shadowBlur = 18; }
    rr(c, x, y, cw, ch, 12); c.fillStyle = lg(c, 0, y, 0, y + ch, [0, '#fffaf0'], [1, '#efe2c0']); c.fill(); c.shadowBlur = 0;
    c.lineWidth = sel ? 3 : 1; c.strokeStyle = sel ? '#f5c84c' : '#bda673'; c.stroke();
    line(c, [[x + 10, y + ch * .3], [x + cw - 10, y + ch * .3]], 'rgba(214,80,80,.55)', 1.5);
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#3b2a14';
    c.font = '500 30px "EB Garamond", Georgia, serif'; c.fillText(cd.n, x + cw / 2, y + ch * .16);
    c.font = '800 12.5px Nunito, sans-serif'; const ls = wrapLines(c, cd.name, cw - 16).slice(0, 2);
    ls.forEach((l, q) => c.fillText(l, x + cw / 2, y + ch * .55 + q * 16 - (ls.length - 1) * 8));
  });
}

// --- page chrome and controls ---------------------------------------------------------------------------------------
const lab = shell({ key: 'folk-tale', T, topics: TOPICS, views: ['bricks', 'three', 'build'], onLang: () => render(), onView: () => { S.sec = null; render(); } });
const secret = secretLab('folk-tale', () => ({
  secrets: [{ emo: '👠', title: T[lang].secrets.cinder[0], desc: T[lang].secrets.cinder[1] }, { emo: '🔢', title: T[lang].secrets.atu[0], desc: T[lang].secrets.atu[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = '<div id="sBricks"></div><div id="sThree"></div><div id="sBuild"></div><div id="sCinder"></div><div id="sAtu"></div><div class="ft-sec" id="secRow"></div>';
$('overlay').insertAdjacentHTML('beforeend', '<div class="ft-book" id="ftBook"><div class="ft-text" id="ftText"></div><div class="ft-strip" id="ftStrip"></div></div>');
canvasLoop($('cv'), (c, w, h, dt, t) => {
  if (S.sec === 'cinder') drawCinder(c, w, h, t); else if (S.sec === 'atu') drawAtu(c, w, h, t);
  else if (lab.view === 'bricks') drawBricks(c, w, h, t); else if (lab.view === 'three') drawThree(c, w, h, t); else drawBuild(c, w, h, t);
});

$('ftStrip').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-pg]'); if (!b) return;
  const p = +b.dataset.pg;
  if (p !== S.page) { S.dir = p > S.page ? 1 : -1; S.pageT = now(); S.page = p; }
  if (S.brick !== null) {
    const br = S.brick;
    if (ANS[br].includes(p)) { S.found[br] = true; S.msg = { ok: true, b: br }; S.brick = null; S.burst = now(); sfx.good(); }
    else { S.msg = { ok: false }; S.wobT = now(); sfx.bad(); }
  } else { S.msg = null; sfx.tick(); }
  render();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'build') return;
  const r = $('cv').getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  const i = geo.findIndex((g) => px >= g.x && px <= g.x + g.w && py >= g.y && py <= g.y + g.h);
  if (i >= 0) { S.slot = i; S.last = null; sfx.tick(); render(); }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, i = +el.dataset.i, j = +el.dataset.j, t = T[lang];
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === el.dataset.k ? null : el.dataset.k; sfx.click();
  } else if (act === 'brick') { S.brick = S.brick === i ? null : i; S.msg = null; sfx.tick(); }
  else if (act === 'brreset') { S.found = [false, false, false, false, false]; S.brick = null; S.msg = null; S.page = 0; sfx.click(); }
  else if (act === 'tale') { S.tale = i; sfx.tick(); }
  else if (act === 'opt') {
    const k = S.tale; if (S.shown[k]) return;
    S.ans[k] = j; S.shown[k] = true; S.revT[k] = now(); (j === t.tr.tales[k].ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next') {
    let n = (S.tale + 1) % 3; for (let q = 0; q < 3; q++) { const cand = (S.tale + 1 + q) % 3; if (!S.shown[cand]) { n = cand; break; } }
    S.tale = n; sfx.click();
  } else if (act === 'again') { S.shown[S.tale] = false; S.ans[S.tale] = null; sfx.click(); }
  else if (act === 'slot') { S.slot = i; S.last = null; sfx.tick(); }
  else if (act === 'pick') {
    S.pick2[S.slot] = j; S.last = { slot: S.slot, j }; const o = t.bd.opts[S.slot][j]; (o.ok ? sfx.good : sfx.bad)();
    if (o.ok) for (let q = 1; q <= 5; q++) { const cand = (S.slot + q) % 5, pj = S.pick2[cand]; if (pj === null || !t.bd.opts[cand][pj].ok) { S.slot = cand; break; } }
  } else if (act === 'breset') { S.pick2 = [null, null, null, null, null]; S.slot = 0; S.last = null; sfx.click(); }
  else if (act === 'place') { S.place = i; sfx.tick(); }
  else if (act === 'num') { S.num = i; sfx.tick(); }
  render();
});
// on a phone the options sit below the picture: bring the reveal into view
function showStage() { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); }

// --- one render per change ----------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  const showV = (id, on) => { $(id).hidden = !on; };
  showV('sBricks', !sec && v === 'bricks'); showV('sThree', !sec && v === 'three'); showV('sBuild', !sec && v === 'build'); showV('sCinder', sec === 'cinder'); showV('sAtu', sec === 'atu');
  $('ftBook').hidden = !(!sec && v === 'bricks');
  const open = secret.unlocked();
  $('secRow').innerHTML = ['cinder', 'atu'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? esc(t.sc[k].chip) : '🔒 ???'}</button>`).join('');
  if (sec === 'cinder') renderCinder(t); else if (sec === 'atu') renderAtu(t);
  else if (v === 'bricks') renderBricks(t); else if (v === 'three') renderThree(t); else renderBuild(t);
}
const fact = (f, emo) => ({ emo, text: f.text, src: f.src });

function renderBricks(t) {
  const n = S.found.filter(Boolean).length, p = S.page, gp = glowSet(), k = t.bk;
  lab.setGlow('rgba(224, 169, 58, .26)');
  $('ftText').innerHTML = `<span class="ft-n">${esc(t.book)} · ${esc(t.page(p + 1))}</span><p>${esc(t.pages[p])}</p>`;
  $('ftStrip').className = 'ft-strip' + (S.brick !== null ? ' ask' : '');
  $('ftStrip').innerHTML = [0, 1, 2, 3, 4, 5].map((i) => `<button type="button" class="ft-pg${i === p ? ' cur' : ''}${gp.has(i) ? ' gold' : ''}" data-pg="${i}" aria-label="${esc(t.pgAria(i + 1))}">${i + 1}</button>`).join('');
  $('sBricks').innerHTML = `<p class="ft-lbl">${esc(k.pickLbl)}</p><div class="ft-chips">${t.brNames.map((nm, i) =>
    `<button type="button" class="chip${S.found[i] ? ' found' : ''}${S.brick === i ? ' on' : ''}" data-act="brick" data-i="${i}">${S.found[i] ? '✓' : BR_EMO[i]} ${esc(nm)}</button>`).join('')}</div>
    <p class="ft-hint">${esc(k.hint)}</p>${n ? `<div class="ft-row" style="margin-top:6px"><button type="button" class="chip" data-act="brreset">${esc(k.again)}</button></div>` : ''}`;
  lab.setReadout(`${n}/5`, k.sub, n === 5 ? '🌟' : '', '#e0a93a');
  let st;
  if (n === 5 && !(S.msg && !S.msg.ok)) st = { emo: '🏆', title: k.doneT, lead: k.doneL };
  else if (S.msg && S.msg.ok) st = { emo: '🌟', title: k.got(t.brNames[S.msg.b]), lead: t.brFound[S.msg.b] };
  else if (S.msg) st = { emo: '🤔', title: k.miss, lead: k.missL };
  else if (S.brick !== null) st = { emo: '🔎', title: k.sel(t.brNames[S.brick]), lead: k.selL };
  else st = { emo: '📖', title: k.t0, lead: k.l0 };
  lab.setState({ ...st, body: '' });
  lab.setFacts([fact(t.facts.grimm, '📚'), fact(t.facts.afan, '📜')]);
}
function renderThree(t) {
  const k = S.tale, tl = t.tr.tales[k], sh = S.shown[k], a = S.ans[k], r = t.tr;
  lab.setGlow('rgba(95, 168, 208, .26)');
  $('sThree').innerHTML = `<p class="ft-lbl">${esc(r.lbl)}</p><div class="ft-chips">${r.tales.map((x, i) => `<button type="button" class="chip${S.tale === i ? ' on' : ''}" data-act="tale" data-i="${i}">${S.shown[i] ? '✓ ' : ''}${esc(x.chip)}</button>`).join('')}</div>
    <p class="ft-q">${esc(tl.q)}</p>
    <div class="ft-opts">${tl.opts.map((o, j) => `<button type="button" class="ft-opt${sh ? (j === tl.ok ? ' good' : j === a ? ' bad' : '') : ''}${a === j ? ' mine' : ''}" data-act="opt" data-j="${j}"${sh ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>
    ${sh ? `<div class="ft-row"><button type="button" class="chip" data-act="next">${esc(r.next)}</button><button type="button" class="chip" data-act="again">${esc(r.again)}</button></div>` : ''}`;
  lab.setReadout(`${S.shown.filter(Boolean).length}/3`, r.sub, sh ? r.pill : '', '#5fa8d0');
  if (!sh) lab.setState({ emo: '🔮', title: tl.name, lead: tl.intro, body: r.look });
  else lab.setState({ emo: a === tl.ok ? '🌟' : '🤔', title: a === tl.ok ? r.right : r.wrong, lead: tl.lesson, body: a === tl.ok ? '' : r.wrongL });
  lab.setFacts([fact(t.facts.goats, '🐐')]);
}
function renderBuild(t) {
  const b = t.bd, picks = S.pick2.map((j, i) => (j === null ? null : b.opts[i][j])), okf = picks.map((p) => !!p && p.ok), n = okf.filter(Boolean).length;
  lab.setGlow('rgba(217, 130, 95, .26)');
  $('sBuild').innerHTML = `<p class="ft-lbl">${esc(b.slotLbl)}</p><div class="ft-chips">${b.slots.map((nm, i) => `<button type="button" class="chip${S.slot === i ? ' on' : ''}${okf[i] ? ' found' : ''}" data-act="slot" data-i="${i}">${okf[i] ? '✓' : SLOT_EMO[i]} ${esc(nm)}</button>`).join('')}</div>
    <div class="ft-row">${b.opts[S.slot].map((o, j) => `<button type="button" class="ft-card${S.pick2[S.slot] === j ? ' on' : ''}" data-act="pick" data-j="${j}">${o.e} ${esc(o.t)}</button>`).join('')}</div>
    <div class="ft-row"><button type="button" class="chip" data-act="breset">${esc(b.reset)}</button></div>`;
  lab.setReadout(`${n}/5`, b.sub, n === 5 ? b.pill : '', '#d9825f');
  const cur = S.last ? b.opts[S.last.slot][S.last.j] : null, miss = b.slots.filter((_, i) => !okf[i]).join(', ');
  let st;
  if (n === 5) st = { emo: '🏆', title: b.doneT, lead: b.doneL };
  else if (cur && !cur.ok) st = { emo: '🧱', title: b.bad, lead: cur.why };
  else if (cur) st = { emo: '✅', title: b.good(cur.t), lead: b.goodL, body: b.miss(miss) };
  else if (n > 0) st = { emo: '🧱', title: b.miss(miss), lead: b.l0 };
  else st = { emo: '✨', title: b.t0, lead: b.l0 };
  lab.setState({ body: '', ...st });
  lab.setFacts([fact(t.facts.hu, '🎉')]);
}
function renderCinder(t) {
  const s = t.sc.cinder, p = s.places[S.place];
  lab.setGlow('rgba(240, 200, 100, .26)');
  $('sCinder').innerHTML = `<p class="ft-lbl">${esc(s.lbl)}</p><div class="ft-chips">${s.places.map((x, i) => `<button type="button" class="chip${S.place === i ? ' on' : ''}" data-act="place" data-i="${i}">${esc(x.place)}</button>`).join('')}</div>`;
  lab.setReadout(`${S.place + 1}/4`, s.sub, '', '#e0a93a');
  lab.setState({ emo: '👠', title: `${p.tale} · ${p.place}`, lead: p.when, body: p.body, extra: esc(s.extra) });
  lab.setFacts([fact(t.facts.cox, '👠')]);
}
function renderAtu(t) {
  const s = t.sc.atu, c = s.cards[S.num];
  lab.setGlow('rgba(240, 200, 100, .26)');
  $('sAtu').innerHTML = `<p class="ft-lbl">${esc(s.lbl)}</p><div class="ft-chips">${s.cards.map((x, i) => `<button type="button" class="chip${S.num === i ? ' on' : ''}" data-act="num" data-i="${i}">${esc(x.n)}</button>`).join('')}</div>`;
  lab.setReadout(c.n, s.sub, '', '#e0a93a');
  lab.setState({ emo: '🔢', title: `${c.n} · ${c.name}`, lead: s.lead(c.n), body: s.body, extra: '' });
  lab.setFacts([fact(t.facts.atu, '🔢')]);
}
render();
</script>
