const D2R = Math.PI / 180, TILT = 23.44;
const PLACES = { bud: 47.5, eq: 0, pole: 89.99, syd: -33.9 };
const PRESETS = [['newyear', '🎆', 0], ['spring', '🌷', 78], ['longest', '☀️', 171], ['holiday', '🏖️', 200], ['school', '🎒', 243], ['autumn', '🍂', 264], ['shortest', '🎄', 354]];
// the Sun's ecliptic longitude, measured from the March equinox (≈ day 78 of a 365-day year); good to a day or two
const sunLon = (day) => 2 * Math.PI * (day - 78) / 365.24;
function astro(day, lat, tilt) {
  const lam = sunLon(day), dec = Math.asin(Math.sin(tilt * D2R) * Math.sin(lam));
  const phi = lat * D2R, x = -Math.tan(phi) * Math.tan(dec);
  const w0 = x <= -1 ? Math.PI : x >= 1 ? 0 : Math.acos(x);
  const dayH = 24 * w0 / Math.PI;
  const noon = 90 - Math.abs(lat - dec / D2R);
  // Earth–Sun distance: eccentricity 0.0167, closest about 3 January
  const dist = 149.6 * (1 - 0.0167 * Math.cos(2 * Math.PI * (day - 3) / 365.25));
  let season;
  if (tilt < 1) season = 'none';
  else if (dayH >= 23.99) season = 'polarDay';
  else if (dayH <= 0.01) season = 'polarNight';
  else if (Math.abs(lat) < 12 && tilt < 30) season = 'tropic';
  else {
    const q = Math.floor((((lam / D2R) % 360) + 360) % 360 / 90);
    season = (lat >= 0 ? ['spring', 'summer', 'autumn', 'winter'] : ['autumn', 'winter', 'spring', 'summer'])[q];
  }
  return { lam, dec, dayH, noon, dist, season };
}
// the Sun's altitude and azimuth (from south, westward positive) at hour angle H
function sunPos(lat, dec, H) {
  const phi = lat * D2R;
  const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
  return [alt, az];
}

const lab = shell({ key: 'seasons', T, topics: TOPICS, views: ['orbit', 'beam', 'sky'], onLang: render, onView: render });

function render() {
  const t = T[lang], a = astro(S.day, PLACES[S.place], S.tilt);
  const key = S.tilt < 1 ? 'none' : S.tilt > 90 ? 'tipped' : a.season;
  const seasonName = t.seasons[S.tilt > 90 ? a.season : key];
  $('slider').value = String(Math.round(S.day));
  $('months').innerHTML = Array.from({ length: 12 }, (_, m) => `<span>${esc(new Intl.DateTimeFormat(lang, { month: 'short' }).format(new Date(2025, m, 1)).replace('.', ''))}</span>`).join('');
  const open = secret.unlocked();
  const sChip = (k) => `<button class="chip secret ${open ? 'open' : ''} ${(k === 'none' && S.tilt < 1) || (k === 'tipped' && S.tilt > 90) ? 'on' : ''}" data-k="${k}">${open ? `${t.emo[k]} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('chips').innerHTML = [sChip('none'), ...PRESETS.map(([k, e, d]) => `<button class="chip ${Math.round(S.day) === d ? 'on' : ''}" data-k="${k}" data-d="${d}" title="${esc(dateOf(d))}">${e} ${esc(t.presets[k])}</button>`), sChip('tipped')].join('');
  $('placeLbl').textContent = t.place;
  $('places').innerHTML = Object.keys(PLACES).map((k) => `<button data-p="${k}" class="${S.place === k ? 'on' : ''}">${esc(t.places[k])}</button>`).join('');
  $('play').textContent = S.playing ? t.pause : t.play;

  // state card: what is going on at this place today, and why
  const [lead, body] = t.text[key];
  const night = 24 - a.dayH;
  const stats = `<div class="stats">
    <span>☀️ ${esc(t.day)}: <b>${esc(hm(a.dayH))}</b></span><span>🌙 ${esc(t.night)}: <b>${esc(hm(night))}</b></span>
    <span class="wide">📐 ${esc(t.noon)}: <b>${a.noon > 0 ? `${nf(a.noon)}°` : esc(t.below)}</b></span>
    ${lab.view === 'orbit' ? `<span class="wide">📏 ${esc(t.dist)}: <b>${nf(a.dist, 1)} ${esc(t.mkm)}</b></span>` : ''}
  </div>
  ${lab.view === 'orbit' && S.tilt > 1 && S.tilt < 90 ? `<div class="fine" style="color:var(--soft)">${esc(t.distNote)}</div>` : ''}
  ${S.place === 'syd' && S.tilt > 1 && S.tilt < 90 ? `<div class="fine" style="color:var(--soft)">🦘 ${esc(t.south)}</div>` : ''}
  <div class="fine">${esc(t.fine)}</div>`;
  lab.setState({ emo: t.emo[key], title: seasonName, lead, body, extra: stats });
  const SEASON_COLOR = { summer: '#ff7a3d', winter: '#4ea8ff', spring: '#3ddc97', autumn: '#f5a524', polarDay: '#f5c84c', polarNight: '#5b5fd6', tropic: '#3ddc97', none: '#98A0B8', tipped: '#a855f7' };
  const SEASON_GLOW = { summer: 'rgba(255,122,61,.30)', winter: 'rgba(78,168,255,.30)', spring: 'rgba(61,220,151,.25)', autumn: 'rgba(245,165,36,.26)', polarDay: 'rgba(245,200,76,.30)', polarNight: 'rgba(60,60,160,.30)', tropic: 'rgba(61,220,151,.25)', none: 'rgba(130,145,190,.2)', tipped: 'rgba(168,85,247,.28)' };
  const sk = S.tilt > 90 ? a.season : key;
  lab.setReadout(esc(dateOf(S.day)), `${t.places[S.place]} · ${nf(Math.abs(PLACES[S.place]), 1)}° ${PLACES[S.place] >= 0 ? t.dirs[0] : t.dirs[2]}`, seasonName, SEASON_COLOR[sk]);
  lab.setGlow(SEASON_GLOW[sk]);
  lab.setGauge(clamp(a.noon, 0, 90) / 90, [0, 20, 45, 66, 90].map((d, i) => ({ f: d / 90, label: t.ticks[i] })), t.gaugeCap);

  // the opening question
  askEl.style.display = S.asked ? 'none' : '';
  if (!S.asked) {
    askEl.innerHTML = S.answer === null
      ? `<div class="q">${esc(t.ask)}</div><div class="opts"><button data-a="dist">${t.a1}</button><button data-a="tilt">${t.a2}</button></div>`
      : `<div class="verdict" style="color:${S.answer === 'tilt' ? 'var(--ok)' : 'var(--wip)'}">${esc(S.answer === 'tilt' ? t.yesV : t.noV)}</div>
         <p>${esc(S.answer === 'tilt' ? t.yesT : t.noT)}</p><div class="opts"><button>${esc(t.go)} →</button></div>`;
  }
}

// --- drawing ------------------------------------------------------------------------------------------------
const C = { sun: '#ffcf4a', ray: 'rgba(255,207,74,.55)', mut: '#98A0B8', faint: '#646C84', ink: '#EDEFF7', place: '#ff3b30' };
function sunDisc(c, x, y, r, time) {
  const g = c.createRadialGradient(x, y, r * 0.2, x, y, r * 3.2);
  g.addColorStop(0, 'rgba(255,214,90,.9)'); g.addColorStop(0.3, 'rgba(255,170,50,.25)'); g.addColorStop(1, 'rgba(255,140,40,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r * 3.2, 0, 7); c.fill();
  c.fillStyle = C.sun; c.beginPath(); c.arc(x, y, r * (1 + 0.02 * Math.sin(time * 3)), 0, 7); c.fill();
}

// Orbit: a real little 3D scene. The orbit lies in the X–Y plane, the Sun at the origin, the axis leans toward +X.
// Each pixel of the Earth is lit by the true dot product with the direction to the Sun, so the day/night line is right.
const off = document.createElement('canvas'), offc = off.getContext('2d');
function drawOrbit(c, w, h, time) {
  const t = T[lang], a = astro(S.day, PLACES[S.place], S.tilt);
  const elev = 22 * D2R, cx = w / 2, cy = h * 0.5;
  const Re = clamp(Math.min(w, h) * 0.105, 26, 64), D = Math.min(w / 2 - Re * 1.7, h * 0.95);
  const right = [1, 0, 0], up = [0, Math.sin(elev), Math.cos(elev)], toCam = [0, -Math.cos(elev), Math.sin(elev)];
  const dot = (p, q) => p[0] * q[0] + p[1] * q[1] + p[2] * q[2];
  const proj = (p) => [cx + dot(p, right) * D, cy - dot(p, up) * D];
  // orbit ring and month labels
  c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1.5; c.beginPath();
  for (let i = 0; i <= 120; i++) { const th = i / 120 * 2 * Math.PI, [x, y] = proj([Math.cos(th), Math.sin(th), 0]); i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke();
  c.font = '800 10.5px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let m = 0; m < 12; m++) {
    const d = (new Date(2025, m, 15) - new Date(2025, 0, 1)) / 864e5, th = sunLon(d) + Math.PI / 2;
    const [x, y] = proj([Math.cos(th) * 1.13, Math.sin(th) * 1.13, 0]);
    c.fillStyle = C.faint; c.fillText(new Intl.DateTimeFormat(lang, { month: 'short' }).format(new Date(2025, m, 1)).replace('.', '').toUpperCase(), x, y);
  }
  // the Earth: heliocentric longitude = the Sun's longitude + 180°, drawn so that June sits on the left
  const th = a.lam + Math.PI / 2, P = [Math.cos(th), Math.sin(th), 0], toSun = [-P[0], -P[1], 0];
  const tl = S.tilt * D2R, A = [Math.sin(tl), 0, Math.cos(tl)];
  const [ex, ey] = proj(P), behind = dot(P, toCam) < 0;
  const drawEarth = () => {
    const d = Math.min(window.devicePixelRatio || 1, 2), n = Math.ceil(Re * 2 * d);
    if (off.width !== n) { off.width = off.height = n; }
    const img = offc.createImageData(n, n), px = img.data, phiP = PLACES[S.place] * D2R;
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n * 2 - 1, v = 1 - (j + 0.5) / n * 2, r2 = u * u + v * v;
      if (r2 > 1) continue;
      const z = Math.sqrt(1 - r2);
      const N = [u * right[0] + v * up[0] + z * toCam[0], u * right[1] + v * up[1] + z * toCam[1], u * right[2] + v * up[2] + z * toCam[2]];
      const lit = dot(N, toSun), lat = Math.asin(clamp(dot(N, A), -1, 1));
      const day = clamp(lit * 4 + 0.5, 0, 1); // a soft terminator
      let R = lerp(10, 40, day), G = lerp(16, 120, day), B = lerp(40, 220, day);
      const latD = lat / D2R;
      if (Math.abs(latD) > 70) { R = lerp(R, lerp(60, 235, day), 0.8); G = lerp(G, lerp(70, 240, day), 0.8); B = lerp(B, lerp(90, 250, day), 0.8); }
      if (Math.abs(latD) < 0.9 * (1 + 1 / Re)) { R += 40; G += 40; B += 40; }
      if (Math.abs(lat - phiP) < 1.6 * D2R * (40 / Re) && S.place !== 'pole') { R = lerp(R, 255, 0.7); G = lerp(G, 80, 0.7); B = lerp(B, 70, 0.7); }
      const k = (j * n + i) * 4, edge = clamp((1 - Math.sqrt(r2)) * n * 0.5, 0, 1);
      px[k] = R; px[k + 1] = G; px[k + 2] = B; px[k + 3] = 255 * edge;
    }
    offc.putImageData(img, 0, 0);
    // axis through the poles
    const top = [ex + dot(A, right) * Re * 1.45, ey - dot(A, up) * Re * 1.45], bot = [ex - dot(A, right) * Re * 1.45, ey + dot(A, up) * Re * 1.45];
    c.strokeStyle = 'rgba(237,239,247,.5)'; c.lineWidth = 2; c.beginPath(); c.moveTo(...bot); c.lineTo(...top); c.stroke();
    c.drawImage(off, ex - Re, ey - Re, Re * 2, Re * 2);
    c.strokeStyle = '#EDEFF7'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(ex + dot(A, right) * Re, ey - dot(A, up) * Re); c.lineTo(...top); c.stroke();
    c.fillStyle = '#EDEFF7'; c.font = '900 11px Nunito, sans-serif'; c.fillText(t.dirs[0], top[0] + 9, top[1] - 4);
    // the place, at local noon
    const hor = [toSun[0] - dot(toSun, A) * A[0], toSun[1] - dot(toSun, A) * A[1], toSun[2] - dot(toSun, A) * A[2]];
    const hl = Math.hypot(...hor) || 1, cp = Math.cos(phiP), sp = Math.sin(phiP);
    const Np = [cp * hor[0] / hl + sp * A[0], cp * hor[1] / hl + sp * A[1], cp * hor[2] / hl + sp * A[2]];
    if (dot(Np, toCam) > -0.15) {
      const px2 = ex + dot(Np, right) * Re, py2 = ey - dot(Np, up) * Re;
      c.fillStyle = C.place; c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(px2, py2, 5, 0, 7); c.fill(); c.stroke();
    }
    // tilt label
    if (S.tilt > 1) { c.fillStyle = C.mut; c.font = '800 11px Nunito, sans-serif'; c.fillText(`${t.axis} · ${nf(S.tilt, S.tilt > 90 ? 0 : 1)}°`, ex, ey + Re + 18); }
  };
  if (behind) drawEarth();
  // sunlight toward the Earth
  const [sx, sy] = [cx, cy], sr = clamp(Math.min(w, h) * 0.07, 16, 42);
  c.strokeStyle = C.ray; c.lineWidth = 2; c.setLineDash([4, 7]); c.lineDashOffset = -time * 25;
  const dx = ex - sx, dy = ey - sy, L = Math.hypot(dx, dy);
  for (const o of [-0.5, 0, 0.5]) {
    const nx = -dy / L * Re * o, ny = dx / L * Re * o;
    c.beginPath(); c.moveTo(sx + dx / L * sr * 1.4 + nx, sy + dy / L * sr * 1.4 + ny); c.lineTo(ex - dx / L * Re * 1.15 + nx, ey - dy / L * Re * 1.15 + ny); c.stroke();
  }
  c.setLineDash([]);
  sunDisc(c, sx, sy, sr, time);
  if (!behind) drawEarth();
}

// Sunbeam: the same bundle of light at today's noon angle, landing on a floor of squares
function drawBeam(c, w, h, time) {
  const t = T[lang], a = astro(S.day, PLACES[S.place], S.tilt);
  const gy = h * 0.8, tile = clamp(w * 0.055, 18, 38), Bw = tile * 3;
  const ang = a.noon * D2R;
  // floor
  const n = Math.ceil(w / tile) + 1, x0 = w * 0.42 - 1.5 * tile;
  for (let i = -n; i < n; i++) {
    const x = x0 + i * tile; if (x > w || x + tile < 0) continue;
    c.fillStyle = i % 2 ? 'rgba(130,145,190,.10)' : 'rgba(130,145,190,.16)'; c.fillRect(x, gy, tile - 1, tile * 0.55);
  }
  c.strokeStyle = 'rgba(200,210,235,.4)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, gy); c.lineTo(w, gy); c.stroke();
  // the overhead Sun for comparison: exactly 3 squares
  c.strokeStyle = 'rgba(237,239,247,.22)'; c.setLineDash([5, 6]);
  c.strokeRect(x0, gy - h * 0.5, Bw, h * 0.5); c.setLineDash([]);
  c.fillStyle = C.faint; c.font = '800 10.5px Nunito, sans-serif'; c.textAlign = 'center'; c.fillText(t.overhead, x0 + Bw / 2, gy - h * 0.5 + 16);
  if (a.noon <= 0.3) {
    c.fillStyle = C.mut; c.font = '500 22px "EB Garamond", serif'; c.fillText(t.beamNone, w / 2, gy - h * 0.3);
    return;
  }
  // today's beam: comes from upper left at the noon angle, patch length = width / sin(angle)
  const patch = Bw / Math.sin(ang), px0 = x0, px1 = x0 + patch;
  const dx = Math.cos(ang), far = h * 1.4;
  const strength = Math.sin(ang);
  const grad = c.createLinearGradient(0, 0, 0, gy);
  grad.addColorStop(0, `rgba(255,207,74,${0.06 + 0.2 * strength})`); grad.addColorStop(1, `rgba(255,207,74,${0.15 + 0.45 * strength})`);
  c.fillStyle = grad;
  c.beginPath(); c.moveTo(px0, gy); c.lineTo(px1, gy); c.lineTo(px1 - dx * far, gy - Math.sin(ang) * far); c.lineTo(px0 - dx * far, gy - Math.sin(ang) * far); c.closePath(); c.fill();
  // rays, moving
  c.strokeStyle = 'rgba(255,215,100,.75)'; c.lineWidth = 1.6; c.setLineDash([10, 12]); c.lineDashOffset = -time * 60;
  for (let k = 0; k <= 6; k++) {
    const fx = px0 + patch * k / 6;
    c.beginPath(); c.moveTo(fx - dx * far, gy - Math.sin(ang) * far); c.lineTo(fx, gy); c.stroke();
  }
  c.setLineDash([]);
  // the lit patch on the floor, brighter when the light is concentrated
  c.fillStyle = `rgba(255,207,74,${0.25 + 0.6 * strength})`; c.fillRect(px0, gy, Math.min(patch, w - px0), tile * 0.55);
  // angle arc
  c.strokeStyle = C.ink; c.lineWidth = 1.5; c.beginPath(); c.arc(px1, gy, 36, Math.PI, Math.PI + ang, false); c.stroke();
  c.fillStyle = C.ink; c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'right';
  c.fillText(`${nf(a.noon)}°`, Math.min(w - 6, px1 - 42), gy - 10);
  // the message
  const squares = patch / tile;
  c.textAlign = 'center'; c.fillStyle = '#fff'; c.font = `500 ${clamp(w * 0.034, 17, 26)}px "EB Garamond", serif`;
  c.fillText(t.beamSay(nf(squares, squares < 10 ? 1 : 0)), w * 0.5, h * 0.1);
  c.fillStyle = C.mut; c.font = '700 12.5px Nunito, sans-serif';
  c.fillText(`${t.strength}: ${nf(strength * 100)}% ${t.ofTop}`, w * 0.5, h * 0.1 + 22);
  // a 24-hour ring: day vs night
  const rx = w - Math.min(70, w * 0.13), ry = h * 0.36, rr = Math.min(52, w * 0.09);
  c.lineWidth = 10; c.strokeStyle = 'rgba(91,95,214,.55)'; c.beginPath(); c.arc(rx, ry, rr, 0, 7); c.stroke();
  const frac = a.dayH / 24;
  c.strokeStyle = C.sun; c.beginPath(); c.arc(rx, ry, rr, Math.PI / 2 - frac * Math.PI, Math.PI / 2 + frac * Math.PI, true); c.stroke();
  c.fillStyle = '#fff'; c.font = '900 14px Nunito, sans-serif'; c.textAlign = 'center';
  c.fillText(`${Math.floor(a.dayH)}:${String(Math.round((a.dayH % 1) * 60) % 60).padStart(2, '0')}`, rx, ry + 1);
  c.fillStyle = C.mut; c.font = '800 10px Nunito, sans-serif'; c.fillText(t.day.toUpperCase(), rx, ry + 16);
}

// Sky: the Sun's path across the sky today (solid), and on the longest and shortest days (dashed)
function drawSky(c, w, h, time) {
  const t = T[lang], lat = PLACES[S.place], a = astro(S.day, lat, S.tilt);
  const pad = 10, W = w - 2 * pad, top = 8, hy = h * 0.74, skyH = (hy - top - 26);
  const south = lat < 0 ? Math.PI : 0; // look toward the equator: south from the north, north from the south
  const X = (az) => { let d = az - south; d = Math.atan2(Math.sin(d), Math.cos(d)); return pad + W / 2 + d / Math.PI * W / 2; };
  const Y = (alt) => hy - alt / (Math.PI / 2) * skyH;
  // the animated Sun walks today's path once every 8 seconds
  const H = ((time / 8) % 1) * 2 * Math.PI - Math.PI, [salt] = sunPos(lat, a.dec, H);
  const light = clamp((salt / D2R + 6) / 18, 0, 1);
  const sky = c.createLinearGradient(0, top, 0, hy);
  sky.addColorStop(0, `rgb(${lerp(8, 40, light)},${lerp(10, 110, light)},${lerp(30, 200, light)})`);
  sky.addColorStop(1, `rgb(${lerp(20, 150, light)},${lerp(22, 190, light)},${lerp(50, 235, light)})`);
  c.save(); c.beginPath(); c.roundRect ? c.roundRect(pad, top, W, h - top - 6, 16) : c.rect(pad, top, W, h - top - 6); c.clip();
  c.fillStyle = sky; c.fillRect(pad, top, W, hy - top);
  c.fillStyle = S.place === 'pole' ? '#d9e2ef' : '#1d2a22'; c.fillRect(pad, hy, W, h - hy);
  // altitude grid
  c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1; c.font = '800 10px Nunito, sans-serif'; c.textAlign = 'left'; c.fillStyle = 'rgba(255,255,255,.45)';
  for (const d of [30, 60, 90]) { const y = Y(d * D2R); c.beginPath(); c.moveTo(pad, y); c.lineTo(pad + W, y); c.stroke(); c.fillText(`${d}°`, pad + 6, y - 3); }
  const path = (dec, style, width, dash) => {
    c.strokeStyle = style; c.lineWidth = width; c.setLineDash(dash); c.beginPath();
    let px = null;
    for (let i = 0; i <= 240; i++) {
      const [al, az] = sunPos(lat, dec, -Math.PI + i / 240 * 2 * Math.PI), x = X(az), y = Y(al);
      if (px === null || Math.abs(x - px) > W / 2) c.moveTo(x, y); else c.lineTo(x, y);
      px = x;
    }
    c.stroke(); c.setLineDash([]);
  };
  // below the horizon the paths are only hinted; above it they are drawn in full
  path(a.dec, 'rgba(255,207,74,.22)', 2, [3, 6]);
  c.save(); c.beginPath(); c.rect(pad, top, W, hy - top); c.clip();
  if (S.tilt > 1) {
    path(Math.asin(Math.sin(S.tilt * D2R)), 'rgba(255,170,90,.55)', 1.5, [5, 6]);
    path(-Math.asin(Math.sin(S.tilt * D2R)), 'rgba(120,180,255,.55)', 1.5, [5, 6]);
  }
  path(a.dec, C.sun, 3, []);
  c.restore();
  // labels of the dashed paths at their noon
  if (S.tilt > 1) {
    c.font = '800 10.5px Nunito, sans-serif'; c.textAlign = 'center';
    for (const [d, col, day] of [[1, 'rgba(255,190,120,.9)', 171], [-1, 'rgba(150,200,255,.9)', 354]]) {
      const dec = d * Math.asin(Math.sin(S.tilt * D2R)), [al] = sunPos(lat, dec, 0);
      if (al > 0.05) { c.fillStyle = col; c.fillText(dateOf(day, { day: 'numeric', month: 'short' }), X(south) + 34, Y(al) - 6); }
    }
  }
  // noon height marker
  const [nal] = sunPos(lat, a.dec, 0);
  if (nal > 0) {
    c.strokeStyle = 'rgba(255,255,255,.6)'; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(X(south), hy); c.lineTo(X(south), Y(nal)); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#fff'; c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'right'; c.fillText(`${nf(nal / D2R)}°`, X(south) - 8, (hy + Y(nal)) / 2);
  }
  // the Sun itself
  const [, saz] = sunPos(lat, a.dec, H);
  if (salt > -0.02) sunDisc(c, X(saz), Y(salt), 12, time);
  else { c.fillStyle = 'rgba(255,207,74,.25)'; c.beginPath(); c.arc(X(saz), Y(salt), 8, 0, 7); c.fill(); }
  // a little house for scale, and the compass points along the horizon
  const hx = pad + W * 0.18;
  c.fillStyle = '#0d1219'; c.fillRect(hx, hy - 22, 26, 22); c.beginPath(); c.moveTo(hx - 4, hy - 22); c.lineTo(hx + 13, hy - 36); c.lineTo(hx + 30, hy - 22); c.fill();
  c.fillStyle = salt > 0 ? '#0d1219' : '#ffd25a'; c.fillRect(hx + 9, hy - 15, 7, 7);
  c.fillStyle = S.place === 'pole' ? '#1d2a3a' : 'rgba(255,255,255,.75)'; c.font = '900 12px Nunito, sans-serif'; c.textAlign = 'center';
  for (const [k, az] of [[0, Math.PI], [1, -Math.PI / 2], [2, 0], [3, Math.PI / 2]]) {
    const x = X(az); if (x < pad + 8 || x > pad + W - 8) continue;
    c.fillText(t.dirs[k], x, hy + 18);
  }
  c.restore();
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.playing) { S.day = (S.day + dt * 30) % 365; if (Math.floor(time * 6) !== Math.floor((time - dt) * 6)) render(); }
  if (lab.view === 'orbit') drawOrbit(c, w, h, time);
  else if (lab.view === 'beam') drawBeam(c, w, h, time);
  else drawSky(c, w, h, time);
});
render();
</script>
</body>
</html>
