  } else if (act === 'nextp') { nextPick(); sfx.click(); }
  else if (act === 'seep') { const pl = PLACES.find((p) => p.id === S.pick); if (pl) { S.btype = pl.type; S.mode = 'close'; sfx.click(); } }
  else if (act === 'redo') { S.ans = {}; S.pick = 'mar'; sfx.click(); }
  else if (act === 'tg') {
    S.tg = +b.dataset.k; S.tgRight = S.tg === 1; S.stop = 2; S.rew = false; (S.tgRight ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'stop') { S.stop = +b.dataset.k; S.rew = false; sfx.tick(); }
  else if (act === 'rew') { if (!secret.unlocked()) return secret.open(); S.rew = !S.rew; if (S.rew) S.rwT = 0; sfx.click(); }
  render();
});

// --- one render per change: controls, readout and the state card ------------------------------------------------
function chip(act, label, on, extra = '') { return `<button class="chip ${on ? 'on' : ''}" data-act="${act}" ${extra}>${label}</button>`; }
function render() {
  const t = T[lang], v = lab.view;
  $('secHeat').style.display = v === 'heat' ? '' : 'none';
  $('secEdges').style.display = v === 'edges' ? '' : 'none';
  $('secSpeed').style.display = v === 'speed' ? '' : 'none';
  if (v === 'heat') renderHeat(t); else if (v === 'edges') renderEdges(t); else renderSpeed(t);
}
function renderHeat(t) {
  const h = t.heat, tapped = S.guess !== null, hasRun = S.run;
  lab.setGlow('rgba(240, 130, 60, .28)');
  $('lblPos').textContent = h.pos;
  $('hx').value = Math.round(S.hx * 100); $('hx').setAttribute('aria-label', h.pos);
  $('heatSeg').innerHTML = h.lv.map((n, i) => `<button data-act="heat" data-v="${i + 1}" class="${S.heat === i + 1 ? 'on' : ''}">${esc(n)}</button>`).join('');
  $('goBtn').textContent = hasRun ? h.again : h.go; $('goBtn').disabled = !hasRun && !tapped;
  lab.setReadout(String(S.heat), h.sub, hasRun ? h.pill : '', '#f08a3a');
  if (!tapped) lab.setState({ emo: '🔥', title: h.askT, lead: h.askL, body: '', extra: '' });
  else if (!hasRun) lab.setState({ emo: '📍', title: h.tapT, lead: h.tapL, body: '', extra: '' });
  else lab.setState({ emo: S.right ? '✅' : '🤔', title: S.right ? h.okT : h.noT, lead: S.right ? h.okL : h.noL, body: h.body, extra: `<div class="mt-fine">${esc(h.fine)}</div>` });
  lab.setFacts([{ emo: '🌍', text: h.fact, src: SRC.plate }]);
}
function renderEdges(t) {
  const e = t.edges, mode = S.mode, pl = PLACES.find((p) => p.id === S.pick), done = placeDone();
  lab.setGlow('rgba(95, 168, 255, .24)');
  $('modeSeg').innerHTML = [['close', e.close], ['map', e.map]].map(([m, l]) => `<button data-act="mode" data-m="${m}" class="${mode === m ? 'on' : ''}">${esc(l)}</button>`).join('');
  const open = secret.unlocked();
  $('iceChipWrap').innerHTML = `<button class="chip secret ${open ? 'open' : ''} ${mode === 'ice' ? 'on' : ''}" data-act="ice">${open ? `🌋 ${esc(e.chip)}` : '🔒 ???'}</button>`;
  $('closeBox').style.display = mode === 'close' ? '' : 'none';
  $('mapBox').style.display = mode === 'map' ? '' : 'none';
  $('typeSeg').innerHTML = ['apart', 'together', 'sliding'].map((k) => `<button data-act="type" data-t="${k}" class="${S.btype === k ? 'on' : ''}">${esc(e.types[k])}</button>`).join('');
  $('mapFine').textContent = mode === 'map' ? e.approx : '';
  if (mode === 'close') {
    const st = e.st[S.btype];
    lab.setReadout(e.types[S.btype], '', '', TYPE_COL[S.btype]);
    lab.setState({ emo: { apart: '↔️', together: '⤵️', sliding: '↕️' }[S.btype], title: st[0], lead: st[1], body: st[2], extra: S.btype === 'apart' && !S.guessed ? `<div class="mt-fine">${esc(e.tip)}</div>` : '' });
    lab.setFacts(e.facts);
  } else if (mode === 'ice') {
    lab.setReadout('🌋', e.chip, '', '#ffd25a');
    lab.setState({ emo: '🌋', title: e.ice[0], lead: e.ice[1], body: e.ice[2], extra: '' });
    lab.setFacts(e.factsIce);
  } else {
    lab.setReadout(e.n(done), e.nSub, '', '#5fb4ff');
    const opts = $('mapOpts'), q = $('mapQ'), after = $('mapAfter');
    const k = PLACES.filter((p) => S.ans[p.id] === p.type).length;
    if (pl && S.ans[pl.id] === undefined) { // the question: nothing about this place is shown yet
      q.textContent = `${e.places[pl.id]}: ${e.ask}`; q.style.display = ''; opts.style.display = '';
      opts.innerHTML = ['apart', 'together', 'sliding'].map((kk) => `<button class="mt-opt" data-act="ans" data-t="${kk}">${esc(e.types[kk])}</button>`).join('');
      after.innerHTML = '';
      lab.setState({ emo: '📍', title: e.places[pl.id], lead: e.ask, body: '', extra: '' });
    } else if (pl) { // the verdict for that place, then on to the next one or to its close-up
      const ok = S.ans[pl.id] === pl.type;
      q.style.display = 'none'; opts.style.display = 'none';
      after.innerHTML = chip('nextp', esc(e.next), false) + chip('seep', esc(e.see), false);
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? e.okT : e.noT, lead: e.expl[pl.id], body: '', extra: '' });
    } else { // all four are in
      q.style.display = 'none'; opts.style.display = 'none';
      after.innerHTML = chip('redo', esc(e.again), false);
      lab.setState({ emo: '🏁', title: e.doneT(k), lead: e.doneL, body: '', extra: '' });
    }
    lab.setFacts(done === PLACES.length ? e.facts.concat(e.factsDone) : e.facts);
  }
}
function renderSpeed(t) {
  const s = t.speed, asked = S.tg !== null, opts = $('spOpts');
  lab.setGlow('rgba(95, 200, 160, .22)');
  opts.style.display = asked ? 'none' : ''; $('spStops').style.display = asked ? '' : 'none';
  if (!asked) {
    opts.innerHTML = [1e3, 1e6, 1e8].map((y, k) => `<button class="mt-opt" data-act="tg" data-k="${k}">${esc(dist(y))}</button>`).join('');
    lab.setReadout('?', s.q, '', '#5fc8a0');
    lab.setState({ emo: '🤔', title: s.askT, lead: s.askL, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  $('stopSeg').innerHTML = s.stops.map((p, i) => `<button data-act="stop" data-k="${i}" class="${!S.rew && S.stop === i ? 'on' : ''}">${esc(p[0])} ${esc(p[1])}</button>`).join('');
  const open = secret.unlocked();
  $('rewChipWrap').innerHTML = `<button class="chip secret ${open ? 'open' : ''} ${S.rew ? 'on' : ''}" data-act="rew">${open ? `⏪ ${esc(s.chip)}` : '🔒 ???'}</button>`;
  if (S.rew) {
    const d = dist(REW_YEARS);
    lab.setReadout(d, s.names[3].replace(/^100/, '200'), s.rate(dist(1)), '#ffb347');
    lab.setState({ emo: '🌍', title: s.rew[0], lead: s.rew[1](d, s.rate(dist(1))), body: s.rew[2], extra: '' });
    lab.setFacts(s.factsRew);
    return;
  }
  const y = YEARS[S.stop], d = dist(y), st = s.st[S.stop];
  lab.setReadout(d, s.after(s.names[S.stop]), s.rate(dist(1)), '#5fc8a0');
  const verdict = S.tgRight ? `${s.okT} ` : `${s.noT} `;
  lab.setState({ emo: ['💅', '⏳', '🌊', '🌍'][S.stop], title: S.stop === 2 ? `${verdict}${st[0]}` : st[0], lead: st[1](d), body: st[2], extra: '' });
  lab.setFacts(s.facts);
}

// --- the picture loop ---------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'heat') drawHeat(c, w, h, dt, time);
  else if (v === 'edges') {
    if (S.mode === 'map') drawMap(c, w, h, dt, time);
    else if (S.mode === 'ice') drawIce(c, w, h, dt, time);
    else if (S.btype === 'apart') drawApart(c, w, h, dt, time);
    else if (S.btype === 'together') drawTogether(c, w, h, dt, time);
    else drawSliding(c, w, h, dt, time);
  } else drawSpeed(c, w, h, dt, time);
});
render();
</script>
</body>
