<!doctype html>

<style>

<body>
<script type="module">

// --- texts -------------------------------------------------------------------------------------------------
const T = {

    cards: {
      bar: ['🍫', 'Tenths and hundredths', 'The first digit after the point counts strips (tenths).', 'The second counts squares (hundredths). Compare strips first.'],

    },
    fine: 'The “longer is larger” and “shorter is larger” mistakes are well documented: Steinle & Stacey (1998), Resnick et al. (1989).',

      { q: 'Which is more: 0.5 or 0.25?', opts: ['0.25, because 25 is more than 5', '0.5, half is more than a quarter', 'They are equal'], ok: 1 },

      { q: 'Are 0.7 and 0.70 the same amount?', opts: ['No, 0.70 is more', 'Yes, 7 tenths are 70 hundredths', 'No, 0.7 is more'], ok: 1 } ],
  },
  ru: {
    name: 'Десятые и сотые', title: 'Где больше?',
    lines: [['Одна плитка —', 'это одно целое.'], ['Десятые — полоски,', 'сотые — квадратики.'], ['Смотри на разряд,', 'а не на длину.']],
    views: { bar: '🍫 Сравни', fraction: '🔁 Дроби', line: '📏 Прямая' },
    check: 'Проверить', next: 'Дальше ▶', tenths: 'Десятые', hundredths: 'Сотые', unit: { m: 'м', cm: 'см' },
    b: { split: (t, h, v) => `${v} = ${t} ${ruPlural(t, 'десятая', 'десятых', 'десятых')} + ${h} ${ruPlural(h, 'сотая', 'сотых', 'сотых')} = ${t * 10 + h}/100` },

    secrets: { thou: ['Тысячные', 'Разрежь один квадратик на десять полосок.'], metre: ['Метровая линейка', 'Сотые доли метра — это сантиметры.'] },
    sec: { thouText: 'Третья цифра считает тысячные: 0,125 = 125/1000.', metreText: (v, cm) => `${v} м = ${cm} см. Один сантиметр — одна сотая метра.`, third: 'Тысячные' },
    cards: {
      bar: ['🍫', 'Десятые и сотые', 'Первая цифра после запятой считает полоски — десятые.', 'Вторая считает квадратики — сотые. Сначала сравнивай полоски.'],
      fraction: ['🔁', 'Одно и то же, два способа', '6/10 и 0,6 — одинаковое количество шоколада.', 'Сотым нужно два места: 5/100 = 0,05.'],
      line: ['📏', 'Между десятыми', 'Каждая десятая на прямой делится на десять сотых.', '0,35 — ровно посередине между 0,3 и 0,4.'],
    },
    fine: 'Ошибки «длиннее — значит больше» и «короче — значит больше» хорошо изучены: Steinle & Stacey (1998), Resnick et al. (1989).',
    quiz: [
      { q: 'Что больше: 0,5 или 0,25?', opts: ['0,25 — ведь 25 больше 5', '0,5 — половина больше четверти', 'Они равны'], ok: 1 },
      { q: 'Как записать 7/100 десятичной дробью?', opts: ['0,7', '0,07', '7,100'], ok: 1 },
      { q: '0,7 и 0,70 — это одно и то же?', opts: ['Нет, 0,70 больше', 'Да, 7 десятых — это 70 сотых', 'Нет, 0,7 больше'], ok: 1 } ],
  },
  hu: {
    name: 'Tizedek és századok', title: 'Melyik a több?',
    lines: [['Egy tábla', 'egy egész.'], ['A tizedek csíkok,', 'a századok kockák.'], ['A helyiértéket nézd,', 'ne a hosszát.']],
    views: { bar: '🍫 Hasonlítsd', fraction: '🔁 Törtek', line: '📏 Számegyenes' },
    check: 'Ellenőrzés', next: 'Tovább ▶', tenths: 'Tizedek', hundredths: 'Századok', unit: { m: 'm', cm: 'cm' },
    b: { split: (t, h, v) => `${v} = ${t} tized + ${h} század = ${t * 10 + h}/100` },
    c: { q: 'Melyik táblában van több csoki?', left: '◀ Ebben', equal: 'Egyenlő', right: 'Ebben ▶', game: 'Rejtvények', free: 'Szabadon',
         right_: 'Igen! A csokik is ezt mutatják.', longer: 'A több számjegy még nem több. Előbb a tizedeket hasonlítsd össze.',
         shorter: 'A kevesebb számjegy sem jelent többet. Előbb a tizedeket hasonlítsd össze.', zero: 'A 0,7 és a 0,70 ugyanannyi: 7 tized az 70 század.',
         look: 'Nézd a táblákat: előbb a csíkokat számold.' },
    fr: { q: 'Írd fel ezt a törtet tizedes törtként.', right: 'Egyezik!', place: 'A századok a második helyre kerülnek: 7/100 = 0,07. A nulla tartja a tizedek helyét.',
          digits: 'Egy negyed 25 század, nem az 1-es és a 4-es számjegy.', look: (c) => `Most nem: ${c}.`, same: (f, d) => `${f} = ${d}` },
    ln: { q: (t) => `Hol van ${t}? Koppints a számegyenesre.`, great: 'Telitalálat!', close: 'Nagyon közel!', far: (t) => `Itt van ${t}. Nagyíts bele a tizedébe.` },
    secrets: { thou: ['Ezredek', 'Vágj szét egy kockát tíz vékony szeletre.'], metre: ['Méterrúd', 'A méter századai a centiméterek.'] },
    sec: { thouText: 'A harmadik számjegy az ezredeket számolja: 0,125 = 125/1000.', metreText: (v, cm) => `${v} m = ${cm} cm. Egy centiméter a méter századrésze.`, third: 'Ezredek' },
    cards: {
      bar: ['🍫', 'Tizedek és századok', 'A tizedesvessző utáni első számjegy a csíkokat (tizedeket) számolja.', 'A második a kockákat (századokat). Előbb a csíkokat hasonlítsd össze.'],
      fraction: ['🔁', 'Ugyanannyi, kétféleképpen', 'A 6/10 és a 0,6 ugyanannyi csoki.', 'A századokhoz két hely kell: 5/100 = 0,05.'],
      line: ['📏', 'A tizedek között', 'A számegyenesen minden tized tíz századra oszlik.', 'A 0,35 félúton van a 0,3 és a 0,4 között.'],
    },
    fine: 'A „hosszabb a nagyobb” és a „rövidebb a nagyobb” hibát jól leírták: Steinle & Stacey (1998), Resnick et al. (1989).',
    quiz: [
      { q: 'Melyik a több: 0,5 vagy 0,25?', opts: ['A 0,25, mert 25 több, mint 5', 'A 0,5, mert a fél több, mint a negyed', 'Egyenlők'], ok: 1 },
      { q: 'Hogyan írod fel a 7/100-ot tizedes törtként?', opts: ['0,7', '0,07', '7,100'], ok: 1 },
      { q: 'A 0,7 és a 0,70 ugyanannyi?', opts: ['Nem, a 0,70 több', 'Igen, 7 tized az 70 század', 'Nem, a 0,7 több'], ok: 1 } ],
  },
};
const TOPICS = [
  { id: 'mt_TqDq6jyOmL', en: "Decimal equivalents of tenths and hundredths", ru: "Десятичная запись десятых и сотых долей", hu: "Tizedek és századok tizedestört alakja" },
  { id: 'mt_DRlbMok2lT', en: "Fraction-Decimal Equivalents", ru: "Соответствие обыкновенных и десятичных дробей", hu: "Törtek és tizedestörtek megfeleltetése" },
  { id: 'mt_933BohS9BH', en: "Comparing Decimals", ru: "Сравнение десятичных дробей", hu: "Tizedes törtek összehasonlítása" },
  { id: 'mt_Vi4Vo5xs_g', en: "Decimals for Tenths & Hundredths", ru: "Десятичные дроби для десятых и сотых", hu: "Tizedes törtek a tizedekhez és századokhoz" },
];

// --- numbers -------------------------------------------------------------------------------------------------
// every value is kept as whole hundredths (n = 37 for 0.37), so nothing depends on floating point
const fmt = (x, p = 2) => { const s = x.toFixed(p); return lang === 'en' ? s : s.replace('.', ','); };
const fmtN = (n, p = 2) => fmt(n / 100, p);
// [value, digits written]: 0.7 and 0.70 are the same amount, written with 1 and 2 digits
const PAIRS = [[[.4, 1], [.38, 2]], [[.5, 1], [.25, 2]], [[.7, 1], [.7, 2]], [[.09, 2], [.1, 1]], [[.62, 2], [.6, 1]], [[.3, 1], [.03, 2]], [[.45, 2], [.5, 1]]];
const CARDS = [[3, 10, 30, 1], [7, 100, 7, 2], [1, 2, 50, 1], [1, 4, 25, 2], [27, 100, 27, 2], [3, 4, 75, 2], [9, 100, 9, 2]]; // numerator, denominator, hundredths, digits
const TARGETS = [[.45, 2], [.07, 2], [.8, 1], [.25, 2], [.6, 1], [.99, 2]];
const GOLD = '#ffd45a';

// --- state -------------------------------------------------------------------------------------------------
const S = {
  mode: 'game', pi: 0, ans: null, vkey: null, t: 3, h: 7, d3: 5,
  fi: 0, d1: 0, d2: 0, fTouched: false, fChecked: false, fkey: null,
  li: 0, pin: null, lChecked: false, lkey: null,
  rev: 0, vOn: false, // rev: 0..1 animation of the reveal; vOn: the verdict text replaces the question
};
const lab = shell({ key: 'decimals', T, topics: TOPICS, views: ['bar', 'fraction', 'line'], onLang: render, onView: () => { syncRev(); render(); } });
const secret = secretLab('decimals', () => ({
  secrets: [{ emo: '🔬', title: T[lang].secrets.thou[0], desc: T[lang].secrets.thou[1] }, { emo: '📏', title: T[lang].secrets.metre[0], desc: T[lang].secrets.metre[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="secCmp">
    <div id="cmpAns"></div>
    <div id="cmpSteps" class="steps"></div>
    <div class="row2"><div class="card seg small" id="modeSeg"></div><div class="chips" id="secChips"></div></div>
  </div>
  <div id="secFr"><div class="steps" id="frSteps"></div><div class="row2"><button class="btn push" id="frMain" data-act="frMain"></button></div></div>
  <div id="secLn"><div class="row2 m0"><button class="btn push" id="lnMain" data-act="lnMain"></button></div></div>`;
const askEl = Object.assign(document.createElement('div'), { className: 'ask card' });
$('overlay').append(askEl);

// --- round-by-round helpers ------------------------------------------------------------------------------
const isGame = () => lab.view !== 'bar' || S.mode === 'game';
const revealed = () => (lab.view === 'bar' ? S.ans !== null : lab.view === 'fraction' ? S.fChecked : S.lChecked);
const syncRev = () => { S.rev = revealed() ? 1 : 0; S.vOn = revealed(); };
// the pairs swap sides now and then so the bigger bar is not always on the same side
function curPair() {
  const i = S.pi % PAIRS.length, flip = (i % 2 === 1) !== (Math.floor(S.pi / PAIRS.length) % 2 === 1);
  const p = PAIRS[i].map(([v, d]) => ({ n: Math.round(v * 100), d }));
  return flip ? p.reverse() : p;
}
const curCard = () => { const [num, den, n, d] = CARDS[S.fi % CARDS.length]; return { num, den, n, d }; };
const curTarget = () => { const [v, d] = TARGETS[S.li % TARGETS.length]; return { v, n: Math.round(v * 100), d }; };
const tenthOf = (v) => clamp(Math.floor(v * 10 + 1e-9), 0, 9);

function answer(a) {
  const [L, R] = curPair(), want = L.n === R.n ? 'equal' : L.n > R.n ? 'left' : 'right';
  let k;
  if (a === want) k = 'right_';
  else if (L.n === R.n) k = 'zero';
  else if (a === 'equal') k = 'look';
  else { const ch = a === 'left' ? L : R, ot = a === 'left' ? R : L; k = ch.d > ot.d ? 'longer' : ch.d < ot.d ? 'shorter' : 'look'; }
  S.ans = a; S.vkey = k; (a === want ? sfx.good : sfx.bad)(); showStage();
}
function checkFr() {
  const { num, den, n } = curCard(), a = S.d1 * 10 + S.d2;
  let k;
  if (a === n) k = 'right';
  else if (den === 100 && num < 10 && S.d1 === num) k = 'place';
  else if (num === 1 && den === 4 && (a === 14 || a === 40)) k = 'digits';
  else k = 'look';
  S.fChecked = true; S.fkey = k; (k === 'right' ? sfx.good : sfx.bad)(); showStage();
}
function checkLn() {
  if (S.pin === null) return;
  const d = Math.abs(S.pin - curTarget().v);
  S.lChecked = true; S.lkey = d <= 0.02 + 1e-9 ? 'great' : d <= 0.06 + 1e-9 ? 'close' : 'far'; (S.lkey === 'far' ? sfx.bad : sfx.good)(); showStage();
}
function nextRound() {
  const v = lab.view;
  if (v === 'bar') { S.pi++; S.ans = null; S.vkey = null; }
  else if (v === 'fraction') { S.fi++; S.d1 = 0; S.d2 = 0; S.fTouched = false; S.fChecked = false; S.fkey = null; }
  else { S.li++; S.pin = null; S.lChecked = false; S.lkey = null; }
  S.rev = 0; S.vOn = false; sfx.click();
}
function enterMode(m) {
  S.mode = m;
  if (m === 'free') { S.t = 3; S.h = 7; } else if (m === 'thou') { S.t = 1; S.h = 2; S.d3 = 5; } else if (m === 'metre') { S.t = 7; S.h = 5; }
  syncRev();
}
// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

// --- drawing helpers -----------------------------------------------------------------------------------------
function txt(c, s, x, y, size, weight, color, align = 'center', maxW = 0) {
  c.font = `${weight} ${size}px Nunito, sans-serif`; c.fillStyle = color; c.textAlign = align; c.textBaseline = 'middle';
  if (maxW) while (size > 12 && c.measureText(s).width > maxW) { size -= 0.5; c.font = `${weight} ${size}px Nunito, sans-serif`; }
  c.fillText(s, x, y);
}
// the chocolate bar: 10 strips (tenths) of 10 squares (hundredths); n squares are filled, strip by strip, each from the bottom up
const sq = (x, y, W, H, k) => { const cw = W / 10, ch = H / 10, g = Math.max(1.5, Math.min(cw, ch) * 0.08), col = Math.floor(k / 10), row = k % 10;
  return [x + col * cw + g / 2, y + (9 - row) * ch + g / 2, cw - g, ch - g, Math.min(cw, ch) * 0.16]; };
function drawBar(c, x, y, W, H, n, o = {}) {
  c.save();
  if (o.glow) { c.shadowColor = `rgba(255, 210, 100, ${0.85 * o.glow})`; c.shadowBlur = 30 * o.glow; }
  c.fillStyle = '#2e1a0f'; c.beginPath(); c.roundRect(x - 4, y - 4, W + 8, H + 8, 12); c.fill();
  c.restore();
  c.lineCap = 'round'; c.lineWidth = 1.4;
  for (let k = 0; k < 100; k++) {
    const on = k < n, [X, Y, w, hh, r] = sq(x, y, W, H, k);
    c.beginPath(); c.roundRect(X, Y, w, hh, r); c.fillStyle = on ? '#6e3f23' : '#d8c7b2'; c.fill();
    c.strokeStyle = on ? '#9a6340' : '#f3e9db'; c.beginPath(); c.moveTo(X + r, Y + 1); c.lineTo(X + w - r, Y + 1); c.moveTo(X + 1, Y + r); c.lineTo(X + 1, Y + hh - r); c.stroke();
    c.strokeStyle = on ? '#4a2815' : '#b9a68f'; c.beginPath(); c.moveTo(X + r, Y + hh - 1); c.lineTo(X + w - r, Y + hh - 1); c.moveTo(X + w - 1, Y + r); c.lineTo(X + w - 1, Y + hh - r); c.stroke();
  }
  if (o.mark && o.markA > 0) { // squares only one of the two bars has
    c.save(); c.globalAlpha = o.markA; c.strokeStyle = GOLD; c.lineWidth = 2.6;
    for (let k = o.mark[0]; k < o.mark[1]; k++) { const [X, Y, w, hh, r] = sq(x, y, W, H, k); c.beginPath(); c.roundRect(X, Y, w, hh, r); c.stroke(); }
    c.restore();
  }
}

function renderFraction(t) {
  const { num, den } = curCard(), a = S.d1 * 10 + S.d2;
  lab.setGlow('rgba(224, 176, 80, .24)');
  $('frSteps').style.setProperty('--cols', 2);
  $('frSteps').innerHTML = stepper('d1', t.tenths, S.d1, S.fChecked) + stepper('d2', t.hundredths, S.d2, S.fChecked);
  $('frMain').dataset.act = S.fChecked ? 'next' : 'frMain';
  $('frMain').textContent = S.fChecked ? t.next : t.check;
  lab.setReadout(`${num}/${den} = ${S.fTouched ? fmtN(a) : fmtN(0, 2).slice(0, -2) + '□□'}`, '', '', '#e0b050');
}
function renderLine(t) {
  const tg = curTarget();
  lab.setGlow('rgba(95, 168, 160, .26)');
  $('lnMain').dataset.act = S.lChecked ? 'next' : 'lnMain';
  $('lnMain').textContent = S.lChecked ? t.next : t.check;
  $('lnMain').disabled = !S.lChecked && S.pin === null;
  lab.setReadout(fmtN(tg.n, tg.d), '', '', '#5fa8a0');
}
render();
</script>
</body>
