const dayWord = (n, frac) => (lang === 'en' ? (n === 1 ? 'day' : 'days') : lang === 'ru' ? (frac ? 'дня' : ruPlural(n, 'день', 'дня', 'дней')) : 'nap');
const yearWord = (n, frac) => (lang === 'en' ? (n === 1 ? 'year' : 'years') : lang === 'ru' ? (frac ? 'года' : ruPlural(n, 'год', 'года', 'лет')) : 'év');
// time for a trip, in hours -> a readable string in the current language
function fmtT(hours) {
  const u = U[lang], sec = hours * 3600;
  if (sec < 1) { const s = parseFloat(sec.toFixed(5)); return s === 0 ? `< ${dec(0.00001, 5)} ${u.s}` : `${dec(s, 5)} ${u.s}`; }
  if (Math.round(sec * 10) / 10 < 60) return `${dec(sec, 1)} ${u.s}`;
  const m = Math.round(sec / 60);
  if (m < 60) return `${m} ${u.min}`;
  if (hours < 48) { const h = Math.floor(m / 60), mm = m % 60; return mm ? `${h} ${u.h} ${mm} ${u.min}` : `${h} ${u.h}`; }
  const days = hours / 24;
  if (days < 365) { const n = days < 100 ? Math.round(days * 10) / 10 : Math.round(days); if (n < 365) return `${dec(n, 1)} ${dayWord(n, n % 1 !== 0)}`; }
  const yrs = days / 365.25;
  if (yrs < 10) { const n = Math.round(yrs * 10) / 10; return `${dec(n, 1)} ${yearWord(n, n % 1 !== 0)}`; }
  const n = Math.round(yrs); return `${nb(n)} ${yearWord(n, false)}`;
}

    else lab.setReadout(esc(dec(C / WATER / EQ, 1)), t.lapsPerSec, t.secrets.b[0], '#1d8be0');
    lab.setState(sec === 'a' ? { emo: '🌙', title: t.secrets.a[0], lead: t.moonText, body: '', extra: '' }
      : { emo: '💧', title: t.secrets.b[0], lead: t.waterText, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  if (asking) {                                                           // while the child predicts, the answer stays hidden everywhere
    lab.setGlow({ tunnel: 'rgba(110,150,255,.25)', trips: 'rgba(60,160,150,.25)', storm: 'rgba(130,100,255,.3)' }[v]);
    lab.setReadout('?', '', '', '#5b6cff');
    lab.setState({ emo: '🤔', title: q, lead: '', body: '', extra: '' });
    lab.setFacts([]); return;
  }
  const [emo, title, lead, body] = t.st[v];
  const facts = t.facts[v].map((f, i) => ({ ...f, src: f.src || T.en.facts[v][i].src }));
  if (v === 'tunnel') {
    lab.setGlow('rgba(110,150,255,.25)'); lab.setState({ emo, title, lead, body, extra: '' }); lab.setFacts(facts);
    const rc = RACERS.find((r) => r.k === S.racer);
    if (S.racer === 'light') lab.setReadout(esc(dec(C / EQ, 1)), t.lapsPerSec, t.racers.light, '#5b6cff');
    else lab.setReadout(esc(fmtT(EQ / rc.v)), t.lapSub, t.racers[S.racer], '#5b6cff');
  } else if (v === 'trips') {
    const rc = RACERS.find((r) => r.k === S.trRacer), n = Math.floor(C / (2 * d)), moon = S.dest === 3;
    lab.setGlow('rgba(60,160,150,.25)'); lab.setFacts(facts);
    lab.setState({ emo, title, lead: moon ? t.moonBody : t.tripBody(d, n), body: '', extra: '' });
    lab.setReadout(esc(fmtT(d / rc.v)), t.byRacer(t.racers[S.trRacer]), moon ? t.moonLine : t.lightTrips(n), '#1d9a8e');
  } else {
    lab.setGlow('rgba(130,100,255,.3)'); lab.setState({ emo, title, lead, body, extra: '' }); lab.setFacts(facts);
    const lt = fmtT(S.dist / C / 3600);
    lab.setReadout(esc(fmtT(S.dist / SND / 3600)), t.thunderSub, t.lightAfter(lt), '#7a5bff');
  }
}
render();
</script>
