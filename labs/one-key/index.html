  return `<button class="ok-opt ${cls}" data-act="${act}" data-i="${i}">${esc(o)}</button>`;
}).join('')}</div>`;
const keyList = (keys, leaked) => `<div class="ok-keys">${keys.map((k, i) => `<div class="ok-key${i === LEAK ? ' leak' : ''}"><span>${SITE[i].emo}</span><code>${esc(k)}</code>${i === LEAK && leaked ? `<i>${esc(leaked)}</i>` : ''}</div>`).join('')}</div>`;

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('sec1').style.display = v === 'leak' ? '' : 'none';
  $('sec2').style.display = v === 'keys' ? '' : 'none';
  $('sec3').style.display = v === 'lock' ? '' : 'none';
  if (v === 'leak') renderLeak(t); else if (v === 'keys') renderKeys(t); else renderLock(t);
}
function renderLeak(t) {
  const L = t.l1, R = S.R1, started = !!R, done = started && R.done, P = planFor('leak'), same = S.m1 === 'same', ri = rightIdx1();
  lab.setGlow('rgba(255, 150, 70, .24)');
  $('sec1').innerHTML = `<div class="chips">${['same', 'diff'].map((k) => `<button class="chip ${S.m1 === k ? 'on' : ''}" data-act="m1" data-v="${k}">${esc(L.modes[k])}</button>`).join('')}</div>
    <div class="ok-q">${esc(L.q)}</div>${optsHtml(L.opts, 'g1', S.g1, done, ri)}${secRow(t)}`;
  if (!started) {
    lab.setReadout('?', L.readQ, L.short[S.m1], '#e0b050');
    lab.setState({ emo: '🧸', title: L.q, lead: L.pick, body: '' });
    lab.setFacts([]);
  } else if (!done) {
    lab.setReadout('…', L.readD, L.short[S.m1], '#e0b050');
    lab.setState({ emo: '🦊', title: L.run[0], lead: L.run[1], body: '' });
    lab.setFacts(t.f1);
  } else {
    const ok = S.g1 === ri;
    lab.setReadout(`${P.n}/6`, L.readD, L.short[S.m1], same ? '#ff5a4d' : '#3ddc97');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : L.wrong, lead: same ? L.sameT(P.n) : L.diffT, body: `${same ? L.sameB : L.diffB} ${L.tryOther}` });
    lab.setFacts(t.f1);
  }
}
function renderKeys(t) {
  const L = t.l2, R = S.R2, A = S.g2 !== null, started = !!R, done = started && R.done, P = planFor('keys'), setA = S.set === 'a';
  lab.setGlow('rgba(95, 168, 160, .26)');
  let h = '';
  if (!A) h += `<div class="ok-q">${esc(L.q)}</div>${optsHtml(L.opts, 'g2', null, false, 1)}`;
  else {
    h += `<div class="chips">${['a', 'b'].map((k) => `<button class="chip ${S.set === k ? 'on' : ''}" data-act="set" data-v="${k}">${esc(L.sets[k])}</button>`).join('')}</div>`;
    h += `<div class="row2">${setA ? `<span class="lbl">${esc(L.base)}</span><div class="chips">${BASES.map((b, i) => `<button class="chip ${S.base === i ? 'on' : ''}" data-act="base" data-i="${i}">${esc(b)}</button>`).join('')}</div>` : `<button class="chip" data-act="reroll">${esc(L.reroll)}</button>`}</div>`;
  }
  h += `<div class="row2"><span class="lbl">${esc(L.keysH)}</span></div>${keyList(P.keys, L.leaked)}${secRow(t)}`;
  $('sec2').innerHTML = h;
  if (S.sec === 'phrase') {
    lab.setReadout('3', t.secrets.ph[0], '', '#e0b050');
    lab.setState({ emo: '🎲', title: t.ph.title, lead: t.ph.lead, body: t.ph.body });
    lab.setFacts(A ? t.f2 : []); return;
  }
  if (!started) {
    lab.setReadout('6', L.readPre, L.short[S.set], '#5fa8a0');
    lab.setState({ emo: '🔑', title: L.q, lead: L.pick, body: '' });
    lab.setFacts([]);
  } else if (!done) {
    lab.setReadout('…', L.readD, L.short[S.set], '#5fa8a0');
    lab.setState({ emo: '🦊', title: L.run[0], lead: L.run[1], body: '' });
    lab.setFacts(t.f2);
  } else {
    lab.setReadout(`${P.n}/6`, L.readD, L.short[S.set], setA ? '#ff5a4d' : '#3ddc97');
    if (setA) lab.setState({ emo: S.g2 === 1 ? '✅' : '🤔', title: S.g2 === 1 ? t.right : t.l1.wrong, lead: L.aT(P.n), body: L.aB });
    else lab.setState({ emo: '🛡️', title: L.bT, lead: L.bB, body: '' });
    lab.setFacts(t.f2);
  }
}
function renderLock(t) {
  const L = t.l3, R = S.R3, A = S.g3 !== null, started = !!R, done = started && R.done, two = S.two;
  lab.setGlow('rgba(78, 168, 255, .26)');
  let h = '';
  if (!A) h += `<div class="ok-q">${esc(L.q)}</div>${optsHtml(L.opts, 'g3', null, false, 0)}`;
  else {
    h += `<div class="chips">${[[1, L.on], [0, L.off]].map(([k, l]) => `<button class="chip ${two === !!k ? 'on' : ''}" data-act="two" data-v="${k}">${esc(l)}</button>`).join('')}</div>`;
    if (done) h += `<div class="ok-q">${esc(L.keepQ)}</div><div class="ok-opts">${L.keep.map(([e, tx], i) => `<button class="ok-opt ${S.keep === i ? (i < 2 ? 'good' : 'bad') : ''}" data-act="keep" data-i="${i}">${e} ${esc(tx)}</button>`).join('')}</div>`;
  }
  h += secRow(t);
  $('sec3').innerHTML = h;
  if (S.sec === 'leak') {
    lab.setReadout('🔎', t.secrets.lk[0], '', '#4ea8ff');
    lab.setState({ emo: '🔎', title: t.lk.title, lead: t.lk.lead, body: t.lk.body });
    lab.setFacts(t.fl); return;
  }
  const locks = two ? 2 : 1;
  if (!started) {
    lab.setReadout('2', L.readPre, '', '#4ea8ff');
    lab.setState({ emo: '📱', title: L.q, lead: L.pick, body: '' });
    lab.setFacts([]);
  } else if (!done) {
    lab.setReadout(String(locks), L.readD(locks), '', '#4ea8ff');
    const r = two ? L.run : L.runOff;
    lab.setState({ emo: '🦊', title: r[0], lead: r[1], body: '' });
    lab.setFacts(t.f3);
  } else if (S.keep !== null) {
    const [e, ti, le] = L.keepFb[S.keep];
    lab.setReadout(String(locks), L.readD(locks), two ? L.pill.out : L.pill.in, two ? '#3ddc97' : '#ff5a4d');
    lab.setState({ emo: e, title: ti, lead: le, body: '' });
    lab.setFacts(t.f3);
  } else {
    const ok = two && S.g3 === 0;
    lab.setReadout(String(locks), L.readD(locks), two ? L.pill.out : L.pill.in, two ? '#3ddc97' : '#ff5a4d');
    lab.setState(two ? { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.l1.wrong, lead: L.onT, body: L.onB } : { emo: '😬', title: L.offT, lead: L.offB, body: '' });
    lab.setFacts(t.f3);
  }
}
render();
</script>
