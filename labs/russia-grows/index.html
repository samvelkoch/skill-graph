    const bx = 28 + c.measureText(a).width + 18; pin(c, bx, y, 5, '#4ec9ff', '#04202c'); c.fillStyle = '#e8ecf6'; c.fillText(b, bx + 10, y + 1);
  } else {
    c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#98A0B8'; c.fillText(t.schem, w / 2, h - L.room / 2);
  }
}

// secret a: Alaska changes owner
function drawAlaska(c, w, h, dt, time, L) {
  const t = T[lang], p = eIO(clamp01((now() - S.secT - 0.8) / 1.6));
  paintDots(c, L, (d) => {
    if (d.k === 3) return mix('#df6f4b', '#3d6cb0', p);
    return (d.k === 1 || d.k === 2) && d.now ? mix(NEUTRAL, NOW, 0.5) : NEUTRAL;
  });
  pillBoxes = [];
  const [ax, ay] = P(L, 197, 64.5);
  pill(c, w, h, t.sa.label, ax - 10, ay - 40, 'c', 13, p > 0.5 ? '#8fb6ff' : '#ff9a76');
  if (p > 0.5) pill(c, w, h, t.sa.pill, w / 2, h - L.room / 2 - 8, 'c', 15, GOLD);
}
// secret b: the Trans-Siberian, Moscow to Vladivostok
function trainP() { return clamp01((now() - S.secT - 0.4) / 8); }
function drawTrain(c, w, h, dt, time, L) {
  const t = T[lang], p = eIO(trainP());
  paintDots(c, L, (d) => ((d.k === 1 || d.k === 2) && d.now ? mix(NEUTRAL, NOW, 0.45) : NEUTRAL));
  strokePartial(c, L, SM_ROUTE, 1, 'rgba(255,255,255,.28)', 2);
  const head = strokePartial(c, L, SM_ROUTE, p, '#ffffff', 3.2);
  pillBoxes = [];
  const gl = c.createRadialGradient(head[0], head[1], 0, head[0], head[1], 16); gl.addColorStop(0, 'rgba(255,255,255,.7)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = gl; c.beginPath(); c.arc(head[0], head[1], 16, 0, 7); c.fill();
  pin(c, head[0], head[1], 7, '#ff6b5b', '#3a0a06');
  const [mx, my] = P(L, 37.6, 55.75), [vx, vy] = P(L, 131.9, 43.1);
  pin(c, mx, my, 5, '#ffffff', '#1a1200'); pin(c, vx, vy, 5, '#ffffff', '#1a1200');
  pill(c, w, h, t.moscow, mx - 10, my + 10, 'l', 12); pill(c, w, h, t.time.cities[4], vx + 10, vy + 10, 'r', 12);
  const day = Math.min(7, Math.floor(p * 6.1667) + 1), km = Math.round(9289 * p);
  pill(c, w, h, `${t.sb.day(day)} · ${km.toLocaleString(lang)} ${t.sb.km}`, w / 2, h - L.room / 2 - 8, 'c', 15, '#fff');
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const L = layout(w, h); S.L = L;
  c.drawImage(baseLayer(w, h, L), 0, 0, w, h);
  const v = lab.view;
  if (v === 'grow') { // the slider's tween, and the readout that follows it
    if (S.u !== S.uTgt && !S.drag) S.u = S.uTgt > S.u ? Math.min(S.uTgt, S.u + dt * 1.1) : Math.max(S.uTgt, S.u - dt * 1.1);
    syncGrow(dt);
  }
  if (S.sec === 'a') { drawAlaska(c, w, h, dt, time, L); return; }
  if (S.sec === 'b') { drawTrain(c, w, h, dt, time, L); trainText(); return; }
  if (v === 'grow') drawGrow(c, w, h, dt, time, L); else if (v === 'time') drawTime(c, w, h, dt, time, L); else drawBorder(c, w, h, dt, time, L);
});

// --- the controls and the texts that follow them ------------------------------------------------------------
function syncGrow(dt) {
  if (S.pick.grow === null || S.sec || lab.view !== 'grow') return;
  const stop = stopOf();
  if (stop !== S.stopShown) { S.stopShown = stop; growTexts(); }
  const tg = AREA[stop];
  if (Math.abs(tg - S.area) > 0.004) { S.area += (tg - S.area) * Math.min(1, dt * 7); if (Math.abs(tg - S.area) <= 0.004) S.area = tg; growReadout(); }
  if (!S.drag) { const sl = $('rgSlider'), v = String(Math.round(S.u * 1000)); if (sl.value !== v) sl.value = v; }
  document.querySelectorAll('#rgYrs .rg-yr').forEach((b, i) => b.classList.toggle('on', i === stop && Math.abs(S.u - i) < 0.02));
}
function growReadout() {
  const t = T[lang], stop = stopOf(), txt = nf(S.area);
  if (txt === S.areaTxt && S.stopShown === stop && S.lastLang === lang) return;
  S.areaTxt = txt; S.lastLang = lang;
  lab.setReadout(txt, `${t.mkm} · ${t.stops[stop]}`, t.est, PCOL[stop]);
}
function growTexts() {
  const t = T[lang], stop = stopOf();
  growReadout();
  const st = t.grow.st[stop];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' });
}
function trainText() {
  const t = T[lang], p = eIO(trainP()), day = Math.min(7, Math.floor(p * 6.1667) + 1), km = Math.round(9289 * p);
  const key = `${day}|${km}|${lang}`;
  if (key === S.trainKey) return;
  S.trainKey = key; lab.setReadout(t.sb.day(day), `${km.toLocaleString(lang)} ${t.sb.km}`, t.sb.sub, '#ffffff');
}
function predHTML(v) {
  const t = T[lang], q = t[v].ask, opts = t[v].opts ?? timeOpts(), pick = S.pick[v], done = pick !== null, right = RIGHT[v];
  const chips = opts.map((o, i) => `<button class="rg-opt${done ? (i === right ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="opt" data-v="${v}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  let verdict = '';
  if (done) {
    const ok = pick === right, tt = t[v];
    const msg = v === 'grow' ? (ok ? tt.right : tt.wrong) : v === 'time' ? (ok ? tt.right : tt.wrong)(fmtTime(12 + CITY[4].off - MSK), CITY[4].off - MSK) : (ok ? tt.right : tt.wrong)(NLAND);
    verdict = `<div class="rg-verdict ${ok ? 'good' : 'bad'}">${esc(msg)}</div>`;
  }
  return `<div class="rg-q">${esc(q)}</div><div class="rg-opts">${chips}</div>${verdict}`;
}
function answer(v, i) {
  if (S.pick[v] !== null) return;
  S.pick[v] = i; S.revT[v] = now(); (i === RIGHT[v] ? sfx.good : sfx.bad)();
  if (v === 'time') S.hour = 12;
  if (v === 'grow') { S.stopShown = -1; S.area = AREA[0]; S.areaTxt = ''; }
  render(); showStage();
}
function pickNb(i) { S.sel = i; S.seen.add(i); sfx.tick(); render(); }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'opt') return answer(b.dataset.v, +b.dataset.i);
  if (a === 'stop') { if (S.pick.grow === null) return; S.uTgt = +b.dataset.i; S.drag = false; sfx.click(); }
  else if (a === 'nb') return pickNb(+b.dataset.i);
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.secT = now(); S.trainKey = ''; sfx.click(); showStage();
  } else if (a === 'replay') { S.secT = now(); S.trainKey = ''; sfx.click(); }
  render();
});
$('rgSlider').addEventListener('input', (ev) => { if (S.pick.grow === null) return; S.drag = true; S.u = S.uTgt = ev.target.value / 1000; });
const endDrag = () => { S.drag = false; };
$('rgSlider').addEventListener('change', endDrag); addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);
$('rgHour').addEventListener('input', (ev) => { if (S.pick.time === null) return; S.hour = ev.target.value / 4; render(); });
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'border' || S.sec || S.pick.border === null || !S.L) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  let best = -1, bd = 22 * 22;
  NB.forEach((n, i) => { const [X, Y] = P(S.L, n.lo, n.la), q = (X - x) ** 2 + (Y - y) ** 2; if (q < bd) { bd = q; best = i; } });
  if (best >= 0) pickNb(best);
});

// --- one render per change: controls, readout and the state card ---------------------------------------------
function render() {
  const t = T[lang], v = lab.view, ans = S.pick[v] !== null, sec = S.sec;
  document.body.dataset.v = v;
  $('rgGrow').style.display = !sec && v === 'grow' ? 'block' : 'none';
  $('rgTime').style.display = !sec && v === 'time' ? 'block' : 'none';
  $('rgBorder').style.display = !sec && v === 'border' ? 'block' : 'none';
  $('rgSecCtl').style.display = sec ? 'block' : 'none';
  $('rgReplay').textContent = t.again;
  $('rgPredGrow').innerHTML = predHTML('grow'); $('rgPredTime').innerHTML = predHTML('time'); $('rgPredBorder').innerHTML = predHTML('border');
  // grow
  const lockG = S.pick.grow === null;
  $('rgGrowCtl').style.display = lockG ? 'none' : 'block'; // nothing to slide before the guess
  $('rgYrs').innerHTML = t.stops.map((s, i) => `<button class="rg-yr" data-act="stop" data-i="${i}">${esc(s)}</button>`).join('');
  $('rgE0').textContent = t.grow.ends[0]; $('rgE1').textContent = t.grow.ends[1];
  $('rgSlider').setAttribute('aria-label', t.grow.slide);
  $('rgLeg').innerHTML = t.legend.map((s, i) => `<div><i style="background:${i < 5 ? PCOL[i] : FORMERC}"></i>${esc(s)}</div>`).join('');
  $('rgFine').textContent = t.schem;
  // time
  $('rgTimeCtl').style.display = ans || v !== 'time' ? 'block' : 'none';
  $('rgHour').disabled = S.pick.time === null; $('rgHour').value = String(Math.round(S.hour * 4));
  $('rgHourL').textContent = t.time.hour; $('rgHourV').textContent = fmtTime(S.hour);
  const ansT = S.pick.time !== null;
  // the clocks (and their UTC offsets) exist in the page only after the guess
  $('rgClocks').innerHTML = !ansT ? '' : CITY.map((q, i) => {
    const raw = cityHour(i, S.hour), utc = `UTC${q.off >= 0 ? '+' : '−'}${Math.abs(q.off)}`;
    return `<div class="rg-clk"><span class="n">${i + 1}</span><span class="nm">${esc(t.time.cities[i])}<small>${utc}</small></span><span class="tm">${fmtTime(raw)}${esc(dayTag(raw, t).trim() ? ' ' + (raw >= 24 ? '+1' : '−1') : '')}</span></div>`;
  }).join('');
  $('rgTimeFine').textContent = t.time.note;
  // border
  $('rgBorderCtl').style.display = S.pick.border === null ? 'none' : 'block';
  const nm = t.border.names, chip = (i) => `<button class="chip rg-nb ${NB[i].sea ? 'sea' : 'land'}${S.seen.has(i) ? ' seen' : ''}${S.sel === i ? ' on' : ''}" data-act="nb" data-i="${i}">${esc(nm[i])}</button>`;
  $('rgBorderCtl').innerHTML = S.pick.border === null ? '' : `<div class="rg-grp">${esc(t.border.land)}</div><div class="chips">${NB.map((_, i) => i).filter((i) => !NB[i].sea).map(chip).join('')}</div>
    <div class="rg-grp">${esc(t.border.sea)}</div><div class="chips">${NB.map((_, i) => i).filter((i) => NB[i].sea).map(chip).join('')}</div>
    <div class="rg-fine">${esc(t.schem)}</div>`;
  // secrets row
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('rgSecs').innerHTML = sc('a', '🛷') + sc('b', '🚂');
  // readout, state card, facts
  lab.setGlow(v === 'grow' ? 'rgba(235, 162, 79, .24)' : v === 'time' ? 'rgba(255, 214, 102, .22)' : 'rgba(255, 209, 102, .2)');
  if (sec) {
    const s = sec === 'a' ? t.sa : t.sb;
    lab.setState({ emo: sec === 'a' ? '🛷' : '🚂', title: s.title, lead: s.lead, body: s.body, extra: '' });
    lab.setFacts(t.facts[sec]);
    if (sec === 'a') lab.setReadout('1867', t.sa.pill, t.sa.label, '#3d6cb0'); else { S.trainKey = ''; trainText(); }
    return;
  }
  if (v === 'grow') {
    if (!ans) { lab.setReadout('?', '', '', '#eba24f'); lab.setState({ emo: '🤔', title: t.grow.ask, lead: '', body: '', extra: '' }); lab.setFacts([]); }
    else {
      if (S.stopShown < 0) { S.stopShown = stopOf(); S.area = AREA[S.stopShown]; }
      S.lastLang = ''; growTexts();
      const rv = t.grow.reveal;
      if (S.u === 0 && S.uTgt === 0 && !S.drag) lab.setState({ emo: rv[0], title: rv[1], lead: rv[2], body: rv[3], extra: '' });
      lab.setFacts(t.facts.grow);
    }
  } else if (v === 'time') {
    if (!ans) { lab.setReadout(fmtTime(S.hour), t.time.cities[1], '', '#ffd666'); lab.setState({ emo: '🤔', title: t.time.ask, lead: '', body: '', extra: '' }); lab.setFacts([]); }
    else {
      const raw = cityHour(4, S.hour), d = CITY[4].off - MSK;
      lab.setReadout(fmtTime(S.hour), t.time.cities[1], `${t.time.cities[4]} ${fmtTime(raw)}${dayTag(raw, t)}`, '#ffd666');
      lab.setState({ emo: '🌐', title: t.time.title, lead: t.time.lead, body: t.time.line(fmtTime(S.hour), fmtTime(raw) + dayTag(raw, t), d), extra: '' });
      lab.setFacts(t.facts.time);
    }
  } else {
    if (!ans) { lab.setReadout('?', '', '', '#ffd166'); lab.setState({ emo: '🤔', title: t.border.ask, lead: '', body: '', extra: '' }); lab.setFacts([]); }
    else {
      const k = S.seen.size, sel = S.sel;
      lab.setReadout(String(NLAND), t.border.landSub(NSEA), t.border.seen(k, NB.length), '#ffd166');
      lab.setState({ emo: '🧭', title: sel === null ? t.border.title : nm[sel], lead: sel === null ? t.border.lead(NLAND, NSEA) : NB[sel].sea ? t.border.kindSea : t.border.kindLand, body: '', extra: '' });
      lab.setFacts(t.facts.border);
    }
  }
}
render();
</script>
