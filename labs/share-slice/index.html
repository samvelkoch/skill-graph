const now = () => performance.now() / 1000;
const c01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => { t = c01(t); return t * t * (3 - 2 * t); };
const gcd = (a, b) => (b ? gcd(b, a % b) : a);
const frac = (p, q) => { const g = gcd(p, q); p /= g; q /= g; return q === 1 ? String(p) : `${p}/${q}`; };
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

      if (rev) { c.save(); c.globalAlpha = ease(tt / 0.5); c.strokeStyle = 'rgba(80,40,12,.8)'; c.lineWidth = 1.6; c.beginPath(); for (let j = 1; j < d; j++) { c.moveTo(ox + j * pw, oy); c.lineTo(ox + j * pw, oy + ch + th); } c.stroke(); c.restore(); }
      continue;
    }
    for (let j = 0; j < d; j++) {
      const q = i * d + j, e = ease((tt - 0.6 - q * 0.17) / 0.35), X = ox + j * pw + (j - (d - 1) / 2) * 3 * e, Y = oy - 5 * e;
      slab(c, X, Y, pw, ch, th, Math.min(5, pw / 2));
      if (e > 0.02) {
        c.save(); c.globalAlpha = e; c.beginPath(); c.arc(X + pw / 2, Y + ch / 2, 10, 0, Math.PI * 2); c.fillStyle = 'rgba(14,17,28,.88)'; c.fill();
        c.lineWidth = 1; c.strokeStyle = 'rgba(255,255,255,.35)'; c.stroke();
        c.font = '900 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(String(q + 1), X + pw / 2, Y + ch / 2 + 1); c.restore();
      }
    }
  }
  if (rev && tt >= 0.6) pill(c, w, T[lang].pce(Math.min(total, Math.floor((tt - 0.6) / 0.17) + 1)), w / 2, 18);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  c.lineJoin = 'round'; c.lineCap = 'round'; innerWidthOfCanvas = w; innerHeightOfCanvas = h;
  const v = lab.view;
  if (v === 'fit') return drawFit(c, w, h, time);
  if (v === 'rule') { if (S.r.phase === 'ask') return drawEq(c, w, h, S.r.a, S.r.n); return drawScene(c, w, h, ruleP(time), time); }
  drawScene(c, w, h, shareP(time), time);
  if (S.phase === 'cutting' && !S.sec && time - S.tCut > shareTotal(S.n)) { S.phase = 'ask'; render(); }
});

// --- controls ----------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-i]'); if (!b) return;
  const act = b.dataset.act, R = S.r;
  if (b.dataset.i !== undefined) { // an answer option
    const i = +b.dataset.i;
    if (lab.view === 'share' && S.phase === 'ask') {
      S.guess = i; S.phase = 'revealed'; S.revT = now(); logRow(S.a, S.n); (S.opts[i].ok ? sfx.good : sfx.bad)(); showStage();
    } else if (lab.view === 'fit' && S.f.phase === 'ask') {
      S.f.guess = i; S.f.phase = 'revealed'; S.f.revT = now(); (S.f.opts[i].ok ? sfx.good : sfx.bad)(); showStage();
    } else return;
  } else if (act === 'pa') { S.a = +b.dataset.v; resetShare(); sfx.tick(); }
  else if (act === 'ndec' || act === 'ninc') { const n = clamp(S.n + (act === 'ninc' ? 1 : -1), 2, 6); if (n === S.n) return; S.n = n; resetShare(); sfx.tick(); }
  else if (act === 'cut') {
    if (S.phase === 'revealed' || S.sec) resetShare();
    else if (S.phase === 'setup') { S.phase = 'cutting'; S.tCut = now(); S.guess = null; S.opts = shareOpts(S.a, S.n); }
    sfx.click();
  } else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { if (lab.view !== 'share') { lab.view = 'share'; lab.renderChrome(); } S.sec = k; S.secT = now(); S.phase = 'setup'; }
    sfx.click();
  } else if (act === 'ddec' || act === 'dinc') R.den = clamp((R.den ?? 12) + (act === 'dinc' ? 1 : -1), 2, 60), sfx.tick();
  else if (act === 'rcheck') {
    if (R.phase === 'ask') {
      if (!R.den) return;
      R.guess = R.den; R.ok = R.den === R.a * R.n; R.phase = 'revealed'; R.revT = now(); R.tries++; R.streak = R.ok ? R.streak + 1 : 0; logRow(R.a, R.n);
      (R.ok ? sfx.good : sfx.bad)(); showStage();
      if (R.streak >= 2 && !R.ruleShown) { R.ruleShown = true; setTimeout(() => { if (S.r === R && R.phase === 'revealed' && lab.view === 'rule') { R.ruleOpen = true; render(); } }, 1900); }
    } else { Object.assign(R, newPair(R), { phase: 'ask', ruleOpen: false, guess: null, den: 12 }); sfx.click(); }
  } else if (act === 'rule') { R.ruleOpen = !R.ruleOpen; sfx.click(); }
  else if (act === 'fw') { S.cw = +b.dataset.v; newFit(); sfx.tick(); }
  else if (act === 'fd') { S.pd = +b.dataset.v; newFit(); sfx.tick(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'ssDen') return;
  S.r.den = ev.target.value === '' ? null : clamp(Math.round(+ev.target.value), 1, 60); render();
});
$('ctrlBody').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.id === 'ssDen') { ev.preventDefault(); $('ssChk').click(); } });
ruleEl.addEventListener('click', () => { S.r.ruleOpen = false; sfx.click(); render(); });

// --- one render per change ---------------------------------------------------------------------------------
const GLOW = 'rgba(230,160,70,.26)', ACC = '#c9822a';
function optsHtml(opts, guess, done) {
  return opts.map((o, i) => `<button class="ss-opt ${done ? (o.ok ? 'good' : i === guess ? 'bad' : 'dim') : ''}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o.l)}</button>`).join('');
}
const chips = (list, act, on, label) => list.map((v) => `<button class="ss-chip ${v === on ? 'on' : ''}" data-act="${act}" data-v="${v}">${label(v)}</button>`).join('');
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('ssShare').style.display = v === 'share' ? '' : 'none';
  $('ssRule').style.display = v === 'rule' ? '' : 'none';
  $('ssFit').style.display = v === 'fit' ? '' : 'none';
  lab.setGlow(GLOW);
  const open = secret.unlocked();
  $('ssSec').innerHTML = [['a', '🔬'], ['b', '🧩']].map(([k, e]) => `<button class="ss-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setFacts([t.facts[v]]);
  ruleEl.style.display = v === 'rule' && S.r.ruleOpen ? '' : 'none';
  if (v === 'share') renderShare(t); else if (v === 'rule') renderRule(t); else renderFit(t);
}
function renderShare(t) {
  const { a, n } = cur(), N = a * n, ph = S.phase, rev = ph === 'revealed' && !S.sec, d = t.div;
  $('ssL1').textContent = t.lblPiece; $('ssL2').textContent = t.lblFriends;
  $('ssA').innerHTML = chips([2, 3, 4], 'pa', S.a, (x) => `1/${x}`);
  $('ssN').textContent = S.n;
  document.querySelectorAll('#ssShare [data-act=ndec]').forEach((b) => { b.disabled = S.n <= 2; });
  document.querySelectorAll('#ssShare [data-act=ninc]').forEach((b) => { b.disabled = S.n >= 6; });
  const cb = $('ssCut'); cb.textContent = ph === 'revealed' || S.sec ? t.again : t.cut; cb.disabled = !S.sec && (ph === 'cutting' || ph === 'ask');
  const asking = !S.sec && (ph === 'ask' || ph === 'revealed');
  $('ssQ1').textContent = asking ? t.qShare : '';
  $('ssO1').innerHTML = asking ? optsHtml(S.opts, S.guess, ph === 'revealed') : '';
  const hit = rev && S.opts[S.guess]?.ok;
  if (S.sec === 'a') {
    lab.setReadout(`1/200`, t.sub, `1/2 ${d} 100 = 1/200`, ACC); lab.setState({ emo: '🔬', title: t.sa[0], lead: t.sa[1], body: '', extra: '' });
  } else if (S.sec === 'b') {
    lab.setReadout('1/3', t.secrets.b[0], '4 × 1/12 = 1/3', ACC); lab.setState({ emo: '🧩', title: t.sb[0], lead: t.sb[1], body: '', extra: '' });
  } else if (rev) {
    lab.setReadout(`1/${N}`, t.sub, eq(a, n), ACC);
    lab.setState({ emo: hit ? '✅' : '🤔', title: hit ? t.right : t.notFrac(S.opts[S.guess].l, N), lead: t.fills(N), body: eq(a, n), extra: '' });
  } else {
    lab.setReadout(`1/${a} ${d} ${n} = ?`, '', '', ACC);
    if (ph === 'setup') { const [ti, le] = t.setup(a, n); lab.setState({ emo: '🍰', title: ti, lead: le, body: '', extra: '' }); }
    else if (ph === 'cutting') { const [ti, le] = t.cutting(n); lab.setState({ emo: '🔪', title: ti, lead: le, body: '', extra: '' }); }
    else lab.setState({ emo: '🍰', title: t.qShare, lead: t.askLead, body: '', extra: '' });
  }
}
function renderRule(t) {
  const R = S.r, N = R.a * R.n, d = t.div, rev = R.phase === 'revealed';
  const inp = $('ssDen'), dv = R.den === null ? '' : String(R.den); if (inp.value !== dv) inp.value = dv;
  inp.disabled = rev; $('ssChk').textContent = rev ? t.next : t.check; $('ssChk').disabled = !rev && !R.den;
  document.querySelectorAll('#ssRule .ss-sb').forEach((b) => { b.disabled = rev; });
  const rb = $('ssRuleB'); rb.textContent = t.showRule; rb.hidden = !(R.tries >= 3 || R.ruleShown); rb.classList.toggle('on', R.ruleOpen);
  ruleEl.innerHTML = `<button class="ss-x" type="button" aria-label="×">×</button><h3>${esc(t.ruleTitle)}</h3><p>${esc(t.rule)}</p>`;
  const rows = S.log.slice(-6).map((r, i, arr) => `<tr class="${i === arr.length - 1 ? 'now' : ''}"><td>1/${r.a}</td><td>${r.n}</td><td>1/${r.a * r.n}</td></tr>`).join('');
  $('ssTable').innerHTML = `<tr>${t.th.map((x) => `<th>${esc(x)}</th>`).join('')}</tr>${rows || `<tr><td class="ss-empty" colspan="3">${esc(t.empty)}</td></tr>`}`;
  if (rev) {
    lab.setReadout(`1/${N}`, t.sub, eq(R.a, R.n), ACC);
    lab.setState({ emo: R.ok ? '✅' : '🤔', title: R.ok ? t.right : t.notFrac(`1/${R.guess}`, N), lead: t.fills(N), body: eq(R.a, R.n), extra: '' });
  } else {
    lab.setReadout(`1/${R.a} ${d} ${R.n} = ?`, '', '', ACC);
    lab.setState({ emo: '🧐', title: `1/${R.a} ${d} ${R.n} = ?`, lead: t.ruleAsk, body: '', extra: '' });
  }
}
function renderFit(t) {
  const w = S.cw, dd = S.pd, F = S.f, d = t.div, rev = F.phase === 'revealed', R = w * dd, q = t.qFit(dd, w);
  $('ssL3').textContent = t.lblCakes; $('ssL4').textContent = t.lblSize;
  $('ssW').innerHTML = chips([1, 2, 3, 4], 'fw', S.cw, (x) => x);
  $('ssD').innerHTML = chips([2, 3, 4], 'fd', S.pd, (x) => `1/${x}`);
  $('ssQ2').textContent = q; $('ssO2').innerHTML = optsHtml(F.opts, F.guess, rev);
  if (rev) {
    const hit = F.opts[F.guess].ok;
    lab.setReadout(String(R), '', `${w} ${d} 1/${dd} = ${R} — ${t.bigger(w)}`, ACC);
    lab.setState({ emo: hit ? '✅' : '🤔', title: hit ? t.right : t.notNum(F.opts[F.guess].l, R), lead: t.fitFills(dd, w), body: `${w} ${d} 1/${dd} = ${R}`, extra: '' });
  } else {
    lab.setReadout(`${w} ${d} 1/${dd} = ?`, '', '', ACC);
    lab.setState({ emo: '🍰', title: q, lead: t.fitLead, body: '', extra: '' });
  }
}
render();
