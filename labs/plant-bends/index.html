  if (id === 'restG') { resetG(); sfx.click(); return render(); }
  if (id === 'doorC') { S.door = !S.door; sfx.click(); return render(); }
  if (id === 'playM') { if (S.mazeDay >= MAZE_DAYS) S.mazeDay = 0; S.playM = !S.playM; sfx.click(); return render(); }
  if (id === 'playS') { S.playS = !S.playS; sfx.click(); return render(); }
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'clockT') S.hour = v; else if (id === 'mazeD') { S.mazeDay = v; S.playM = false; } else if (id === 'sunT') { S.sunH = v; S.playS = false; } else return;
  render();
});
// dragging the lamp: press anywhere inside the box to put it there, then slide
const cv = $('cv');
const toDesign = (ev) => { const r = cv.getBoundingClientRect(), g = S.geo; return [(ev.clientX - r.left - g.ox) / g.s, (ev.clientY - r.top - g.oy) / g.s]; };
cv.addEventListener('pointerdown', (ev) => {
  if (mode() !== 'light' || S.aL === null) return;
  const [x, y] = toDesign(ev); if (x < 20 || x > 340 || y < 16 || y > 282) return;
  S.drag = true; S.moved = true; cv.setPointerCapture(ev.pointerId); setLamp(x, y); render();
});
cv.addEventListener('pointermove', (ev) => { if (!S.drag) return; const [x, y] = toDesign(ev); setLamp(x, y); });
const endDrag = () => { S.drag = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- render: controls and visibility (text of the card and the readout is in sync) ----------------------------------------
function render() {
  const t = T[lang], m = mode(), v = lab.view, open = secret.unlocked();
  const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  show('pbL', !S.sec && v === 'light'); show('pbG', !S.sec && v === 'gravity'); show('pbC', !S.sec && v === 'clock'); show('pbM', S.sec === 'a'); show('pbS', S.sec === 'b');
  cv.style.touchAction = m === 'light' && S.aL !== null ? 'none' : 'pan-y';
  // light
  $('askL').innerHTML = askHTML('L', t.light.ask, t.light.opts, ANSWER.L, S.aL, t.light.reveal);
  $('ctlL').style.display = S.aL === null ? 'none' : 'block';
  $('lampLbl').textContent = t.lamp;
  const lampAt = (x) => Math.abs(S.lampT.x - x) < 8 && S.lampT.y < 130;
  $('lampChips').innerHTML = [['L', t.lampL, 50], ['A', t.lampA, 180], ['R', t.lampR, 310]].map(([p, l, x]) => `<button type="button" class="chip pb-c${lampAt(x) ? ' on' : ''}" data-act="lamp" data-p="${p}">${esc(l)}</button>`).join('');
  const done = S.day >= S.maxDay - 1e-6;
  $('playL').textContent = S.playing ? t.pause : !done ? t.play : S.maxDay < 15 ? t.more : t.play; $('playL').disabled = done && S.maxDay >= 15 && !S.playing;
  $('restL').textContent = t.restart; $('dragNote').textContent = t.drag;
  // gravity
  $('askG').innerHTML = askHTML('G', t.grav.ask, t.grav.opts, ANSWER.G, S.aG, t.grav.reveal);
  $('ctlG').style.display = S.aG === null ? 'none' : 'flex';
  $('turnG').textContent = t.grav.turn; $('turnG').disabled = S.gRem > 0 || S.alpha !== S.jarT; $('restG').textContent = t.restart;
  // clock
  $('askC').innerHTML = askHTML('C', t.clock.ask, t.clock.opts, ANSWER.C, S.aC, t.clock.reveal);
  $('ctlC').style.display = S.aC === null ? 'none' : 'block';
  $('doorC').textContent = S.door ? t.clock.close : t.clock.open;
  if (+$('clockT').value !== S.hour) $('clockT').value = S.hour;
  // secrets
  $('playM').textContent = S.playM ? t.pause : t.play; $('playS').textContent = S.playS ? t.pause : t.sun.playDay;
  if (+$('mazeD').value !== S.mazeDay) $('mazeD').value = S.mazeDay;
  if (+$('sunT').value !== S.sunH) $('sunT').value = S.sunH;
  $('pbSecs').innerHTML = [['a', '🌀'], ['b', '🌻']].map(([k, emo]) => `<button type="button" class="chip pb-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.chips[k])}` : '🔒 ???'}</button>`).join('');
  sync(true);
}
render();
</script>
