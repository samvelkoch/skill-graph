const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);

function fitFont(c, text, maxW, size, weight = 800, min = 10) {
  let s = size; c.font = `${weight} ${s}px Nunito, sans-serif`;

}

function pill(c, text, cx, cy, W, size = 13, maxW = W - 24) {
  c.save(); fitFont(c, text, maxW, size); c.textAlign = 'center'; c.textBaseline = 'middle';
  const pw = c.measureText(text).width + 22, ph = size + 12, x = clamp(cx - pw / 2, 6, W - 6 - pw);
  c.globalAlpha = 1; c.fillStyle = 'rgba(10,12,20,.8)'; rr(c, x, cy - ph / 2, pw, ph, ph / 2); c.fill();
  c.fillStyle = '#fff'; c.fillText(text, x + pw / 2, cy + 1); c.restore();
}
function badge(c, x, y, ok, p, R) {
  const s = backOut(p); if (s <= 0.01) return;
  c.save(); c.globalAlpha = 1; c.translate(x, y); c.scale(s, s);
  const g = c.createRadialGradient(-R * 0.3, -R * 0.35, R * 0.1, 0, 0, R);
  g.addColorStop(0, ok ? '#7CF0B8' : '#FF9A8C'); g.addColorStop(1, ok ? '#23B572' : '#DC3D45');
  c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 10; c.fillStyle = g; c.beginPath(); c.arc(0, 0, pos(R), 0, Math.PI * 2); c.fill();
  c.shadowBlur = 0; c.lineWidth = 3; c.strokeStyle = '#fff'; c.stroke();
  c.lineWidth = R * 0.24; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#fff'; c.beginPath();
  if (ok) { c.moveTo(-R * 0.42, R * 0.02); c.lineTo(-R * 0.1, R * 0.34); c.lineTo(R * 0.44, -R * 0.32); }
  else { c.moveTo(-R * 0.34, -R * 0.34); c.lineTo(R * 0.34, R * 0.34); c.moveTo(R * 0.34, -R * 0.34); c.lineTo(-R * 0.34, R * 0.34); }
  c.stroke(); c.restore();
}
function cloud(c, x, y, r) {
  c.save(); c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath();
  c.arc(x, y, pos(r * 0.8), 0, 7); c.arc(x + r * 0.9, y - r * 0.25, pos(r), 0, 7); c.arc(x + r * 1.8, y, pos(r * 0.75), 0, 7);
  c.rect(x, y, r * 1.8, r * 0.75); c.fill(); c.restore();
}

  const t = T[lang], v = lab.view, V = VS[v], secK = v === 'slip' ? S.sec : null;
  let val = '?', sub = '', pill_ = '', color = '#FF6B4A', key;
  if (v === 'slip') {
    if (secK) { val = secK === 'scribe' ? '✍️' : '🎯'; sub = t.secrets[secK][0]; color = '#FFB86B'; key = secK; }
    else if (V.qi === 0 && V.pick === null) key = 'ask';
    else { val = `<span class="pushv"><span>${esc(t.s.push)}</span><span class="bar"><i id="pushFill"></i></span></span>`; sub = t.s.quakes(Q.count); key = 'push' + Q.count; }
  } else if (v === 'count') {
    color = '#FFA43A';
    if (V.scene === 'car' || V.pick === null) { val = V.scene === 'car' && V.pick !== null ? '🚗' : '?'; key = 'c' + val; }
    else {
      const nm = countNums(V.rt), st = nm.stage, n = [nm.n1, nm.n2, nm.n3][st];
      val = (st === 2 ? '≈ ' : '') + fmt(n); sub = t.c.levels[st]; pill_ = t.c.perYear; key = val + sub;
    }
  } else {
    color = '#5FD0B0';
    if (V.pick === null) key = 'ask';
    else if (!V.done) { val = '👀'; key = 'look'; }
    else { val = `${PR.k}/3`; sub = t.f.steps.join(' · '); key = val; }
  }
  const full = `${v}|${key}|${lang}`;
  if (full !== rk) { rk = full; lab.setReadout(val, sub, pill_, color); }
  if (v === 'slip' && !secK) { const f = $('pushFill'); if (f) f.style.width = `${clamp01(Q.s / Q.thr) * 100}%`; }
}

function tick(dt) {
  stepSim(dt);
  const v = lab.view;
  if (v === 'slip' && S.sec === 'scribe') stepScribe(dt);
  if (v === 'slip' && S.sec === 'rings') RG.age += dt;
  const V = VS[v];
  if (V.pick !== null) {
    const prev = V.rt; V.rt += dt;
    if (v === 'safe') badgeSounds(prev, V.rt);
    if (!V.fin && V.rt >= DUR[v][V.qi]) {
      V.fin = true;
      if (V.qi === NQ[v] - 1) { V.done = true; if (v === 'slip') release(); }
      render();
    }
  }
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  tick(dt);
  const v = lab.view;
  if (v === 'slip') { if (S.sec === 'scribe') drawScribe(c, w, h, time); else if (S.sec === 'rings') drawRings(c, w, h, time); else drawSlip(c, w, h, time); }
  else if (v === 'count') drawCount(c, w, h, time);
  else drawSafe(c, w, h, time);
  updateReadout();
});
render();
</script>
</body>
