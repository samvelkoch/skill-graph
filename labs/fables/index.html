  if (kind === 'lafontaine') for (const s of [-1, 1]) for (let j = 0; j < 3; j++) { circ(ctx, s * 19, -8 + j * 12, 9); paint(ctx, mix(C.track, C.ink, 0.5), line, 1); }
  circ(ctx, 0, -6, 17); paint(ctx, ballG(ctx, 0, -6, 17, skin, 0.2), line, 1.5);
  if (kind === 'aesop') { ctx.beginPath(); ctx.moveTo(-14, 2); ctx.quadraticCurveTo(0, 36, 14, 2); ctx.quadraticCurveTo(0, 14, -14, 2); ctx.closePath(); paint(ctx, '#F2F2F2', line, 1.2);
    for (let j = 0; j < 7; j++) { const a = Math.PI * 1.1 + j * 0.22; ell(ctx, Math.cos(a) * 18, -6 + Math.sin(a) * 18, 5, 2.4, a + Math.PI / 2); paint(ctx, C.hill, mix(C.hill, C.ink, 0.5), 1); } }
  if (kind === 'lafontaine') { ctx.beginPath(); ctx.arc(0, -8, 18, Math.PI * 1.05, Math.PI * 1.95); ctx.quadraticCurveTo(0, -10, -18, -8); paint(ctx, mix(C.track, C.ink, 0.5), line, 1.2); }
  if (kind === 'krylov') { ctx.beginPath(); ctx.arc(0, -8, 17.5, Math.PI * 1.02, Math.PI * 1.98); ctx.quadraticCurveTo(0, -14, -17, -8); paint(ctx, mix(C.ink, '#FFFFFF', 0.55), line, 1.2); for (const s of [-1, 1]) { ell(ctx, s * 16, 0, 3, 6); ctx.fillStyle = mix(C.ink, '#FFFFFF', 0.55); ctx.fill(); } }
  if (kind === 'heltai') { ctx.beginPath(); ctx.arc(0, -10, 19, Math.PI, TAU); ctx.lineTo(24, -10); ctx.lineTo(-24, -10); ctx.closePath(); paint(ctx, mix(C.red, C.ink, 0.35), line, 1.3); ctx.beginPath(); ctx.moveTo(-10, 4); ctx.quadraticCurveTo(0, 22, 10, 4); ctx.quadraticCurveTo(0, 10, -10, 4); ctx.closePath(); paint(ctx, mix(C.ink, '#FFFFFF', 0.3), line, 1); }
  circ(ctx, -6, -5, 1.8); ctx.fillStyle = C.ink; ctx.fill(); circ(ctx, 6, -5, 1.8); ctx.fill();
  ctx.strokeStyle = line; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 2, 6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  // what each one holds: a scroll, a quill, a book
  if (kind === 'aesop') { rrect(ctx, 14, 26, 30, 12, 6); paint(ctx, C.parch, line, 1.2); circ(ctx, 14, 32, 4); paint(ctx, mix(C.parch, C.track, 0.4), line, 1); circ(ctx, 44, 32, 4); paint(ctx, mix(C.parch, C.track, 0.4), line, 1); }
  else if (kind === 'lafontaine') { ctx.strokeStyle = line; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(14, 44); ctx.lineTo(44, 8); ctx.stroke(); ctx.beginPath(); ctx.moveTo(44, 8); ctx.quadraticCurveTo(60, 8, 54, 26); ctx.quadraticCurveTo(46, 22, 44, 8); paint(ctx, '#FFFFFF', line, 1.2); }
  else { rrect(ctx, 14, 26, 28, 20, 3); paint(ctx, kind === 'krylov' ? mix(C.red, C.ink, 0.4) : mix(C.hill, C.ink, 0.4), line, 1.2); ctx.fillStyle = C.gold; ctx.fillRect(18, 30, 20, 2); ctx.fillRect(18, 35, 14, 2); }
  ctx.restore();
}
const PKIND = { en: ['aesop', 'lafontaine'], ru: ['aesop', 'lafontaine', 'krylov'], hu: ['aesop', 'heltai', 'lafontaine'] };
function drawAesop(ctx, w, h, sc, dt, t) {
  const ox = (w - 680 * sc) / 2, oy = (h - 400 * sc) / 2, u = easeS((t - S.secT) / 1.3), people = T[lang].sec.people, kinds = PKIND[lang];
  stageBg(ctx, w, h);
  ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc);
  const W = 560 * u, x0 = 340 - W / 2, x1 = 340 + W / 2, y0 = 44, y1 = 352;
  if (W > 4) {
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8; ctx.fillStyle = C.parch; ctx.fillRect(x0, y0, W, y1 - y0); ctx.restore();
    ctx.fillStyle = lin(ctx, x0, 0, x1, 0, [0, hexA('#7A5C2E', 0.28)], [0.12, 'rgba(0,0,0,0)'], [0.88, 'rgba(0,0,0,0)'], [1, hexA('#7A5C2E', 0.28)]); ctx.fillRect(x0, y0, W, y1 - y0);
    ctx.save(); ctx.beginPath(); ctx.rect(x0 + 6, y0, W - 12, y1 - y0); ctx.clip();
    const n = people.length, step = 540 / n;
    ctx.strokeStyle = mix(C.track, C.ink, 0.35); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(340 - 270 + step / 2 - 60, 190); ctx.lineTo(340 + 270 - step / 2 + 60, 190); ctx.stroke();
    people.forEach(([nm, pl, wh], i) => {
      const cx = 340 - 270 + step * (i + 0.5), a = c01((u - 0.55 - i * 0.12) / 0.3);
      ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 14);
      circ(ctx, cx, 124, 52); paint(ctx, lin(ctx, 0, 72, 0, 176, [0, '#FFF8E4'], [1, mix(C.parch, C.track, 0.4)]), mix(C.gold, C.ink, 0.45), 3);
      ctx.save(); circ(ctx, cx, 124, 50); ctx.clip(); person(ctx, cx, 112, kinds[i], t); ctx.restore();
      circ(ctx, cx, 190, 8); paint(ctx, C.gold, mix(C.gold, C.ink, 0.5), 2);
      ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let fs = 30; ctx.font = `500 ${fs}px ${SERIF}`; while (fs > 22 && ctx.measureText(nm).width > step - 14) { fs -= 1; ctx.font = `500 ${fs}px ${SERIF}`; }
      ctx.fillText(nm, cx, 226);
      ctx.fillStyle = mix(C.ink, C.parch, 0.25); ctx.font = `700 22px ${SANS}`;
      [...wrapText(ctx, pl, step - 10), ...wrapText(ctx, wh, step - 10)].forEach((l, j) => ctx.fillText(l, cx, 258 + j * 25));
      ctx.restore();
    });
    ctx.restore();
    for (const [x, s] of [[x0, -1], [x1, 1]]) { rrect(ctx, x - 14, y0 - 8, 28, y1 - y0 + 16, 12); paint(ctx, lin(ctx, x - 14, 0, x + 14, 0, [0, mix(C.track, C.ink, 0.35)], [0.45, mix(C.track, '#FFFFFF', 0.25)], [1, mix(C.track, C.ink, 0.45)]), mix(C.track, C.ink, 0.6), 1.6);
      circ(ctx, x, y0 - 10, 8); paint(ctx, C.gold, mix(C.gold, C.ink, 0.5), 1.4); circ(ctx, x, y1 + 10, 8); paint(ctx, C.gold, mix(C.gold, C.ink, 0.5), 1.4); }
  }
  ctx.restore();
}
// secret 2: two animals of your choice in a small meadow, with the moral on a banner
function drawMine(ctx, w, h, sc, dt, t) {
  const M = S.mine, ox = (w - 680 * sc) / 2, oy = h - 400 * sc, X0 = -ox / sc, X1 = (w - ox) / sc, Y0 = -oy / sc;
  ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc);
  meadowBack(ctx, X0, X1, Y0, 0.2, t);
  oak(ctx, 335, 304, t);
  [[M.a, 190, 0], [M.b, 480, 1.7]].forEach(([n, x, ph]) => {
    ctx.save(); ctx.globalAlpha = 0.25; ctx.fillStyle = C.ink; ell(ctx, x, 342, 44, 8); ctx.fill(); ctx.restore();
    emoji(ctx, AEMO[n], x, 296 - Math.abs(Math.sin(t * 2 + ph)) * 6, 86);
  });
  for (const f of FLOWERS) if (f.y >= 340 && f.x > X0 - 10 && f.x < X1 + 10) flower(ctx, f, t);
  banner(ctx, 340, 74, T[lang].sec.moralsFull[M.m], (t - S.secT) / 0.9, 560, 26);
  ctx.restore();
}

// --- state --------------------------------------------------------------------------------------------------------------------
const nowS = () => performance.now() / 1000;
const S = {
  r: { p: 0, ph: 'story', a1: null, a2: null, t: nowS(), t2: 0, fired: false, bound: -1 },
  l: { i: 0, a: null, t: nowS(), done: false },
  f: { i: 0, a: null, t: nowS(), done: false },
  sec: null, secT: 0, mine: { m: 0, a: 0, b: 1 },
};
const lab = shell({ key: 'fables', T, topics: TOPICS, views: ['race', 'lesson', 'fits'], onLang: render, onView: render });
const secret = secretLab('fables', () => ({
  secrets: [{ emo: '📜', title: T[lang].secrets.aesop[0], desc: T[lang].secrets.aesop[1] }, { emo: '✍️', title: T[lang].secrets.mine[0], desc: T[lang].secrets.mine[1] }],
  questions: T[lang].quiz,
}), () => render());

canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  const sc = Math.min(w / 680, h / 400), v = lab.view;
  ctx.save(); rrect(ctx, 0, 0, w, h, 18); ctx.clip();
  if (v === 'race' && S.sec === 'aesop') drawAesop(ctx, w, h, sc, dt, t);
  else if (v === 'race' && S.sec === 'mine') drawMine(ctx, w, h, sc, dt, t);
  else if (v === 'race') drawRace(ctx, w, h, sc, dt, t);
  else if (v === 'lesson') drawLesson(ctx, w, h, sc, dt, t);
  else drawFits(ctx, w, h, sc, dt, t);
  ctx.restore();
  rrect(ctx, 0.5, 0.5, w - 1, h - 1, 18); ctx.strokeStyle = 'rgba(130,145,190,.28)'; ctx.lineWidth = 1; ctx.stroke();
});

// --- the controls: parchment, notebook, questions --------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const optsHtml = (items, ans, ok, emos) => `<div class="fb-opts">${items.map((o, j) => {
  const cls = ans === null ? '' : j === ok ? ' good' : j === ans ? ' bad' : '';
  return `<button class="fb-o${cls}" data-act="pick" data-j="${j}"${ans === null ? '' : ' disabled'}>${emos ? `<span class="fb-em">${emos[j]}</span>` : ''}<span>${esc(o)}</span></button>`;
}).join('')}</div>`;
const verdict = (t, ans, ok) => `<div class="fb-v ${ans === ok ? 'ok' : 'no'}">${esc(ans === ok ? t.right : t.wrong)}</div>`;
const nextBtn = (label, act) => `<button class="fb-next" data-act="${act}">${esc(label)}</button>`;

function raceHtml(t) {
  const R = S.r, tr = t.r;
  if (S.sec === 'aesop') return `<div class="fb-card"><p>${esc(t.sec.aesopText)}</p></div>`;
  if (S.sec === 'mine') {
    const M = S.mine, sc = t.sec;
    const story = sc.tpl[M.m].map((s) => s.replace(/\{Bacc\}/g, (sc.animalsAcc || sc.animals)[M.b]).replace(/\{A\}/g, sc.animals[M.a]).replace(/\{B\}/g, sc.animals[M.b])).join(' ');
    const chips = (list, cur, act, dis) => list.map((n, i) => `<button class="chip ${i === cur ? 'on' : ''}" data-act="${act}" data-i="${i}"${dis === i ? ' disabled' : ''}>${act === 'mm' ? '' : `${AEMO[i]} `}${esc(n)}</button>`).join('');
    return `<div class="fb-card"><p>${esc(story)}</p><p style="font-size:14.5px;opacity:.75">${esc(sc.mineText)}</p></div>
      <div class="fb-pick">${chips(sc.morals, M.m, 'mm')}</div>
      <div class="fb-pick"><span class="fb-n">1</span>${chips(sc.animals, M.a, 'ma', M.b)}</div>
      <div class="fb-pick"><span class="fb-n">2</span>${chips(sc.animals, M.b, 'mb', M.a)}</div>`;
  }
  const para = R.ph === 'story' ? R.p : R.ph === 'q1' ? 2 : 3;
  let h = `<div class="fb-card"><p>${esc(tr.story[para])}</p>`;
  if (R.ph === 'story') h += nextBtn(t.next, 'next');
  else if (R.ph === 'q1') h += `<div class="fb-q">${esc(tr.q1)}</div>${optsHtml(tr.o1, null, R_OK1)}`;
  else if (R.ph === 'r1') h += verdict(t, R.a1, R_OK1) + `<p class="fb-why">${esc(tr.r1)}</p>` + nextBtn(t.next, 'next');
  else if (R.ph === 'q2') h += `<div class="fb-q">${esc(tr.q2)}</div>${optsHtml(tr.o2, null, R_OK2)}`;
  else h += `<div class="fb-q">${esc(tr.q2)}</div>${optsHtml(tr.o2, R.a2, R_OK2)}` + verdict(t, R.a2, R_OK2) + `<p class="fb-why">${esc(tr.r2)}</p>` + nextBtn(t.again, 'again');
  return h + '</div>';
}
function lessonHtml(t) {
  const L = S.l, i = L.i;
  let h = `<div class="fb-card"><p>${esc(t.l.story[i])}</p><div class="fb-q">${esc(t.l.q)}</div>${optsHtml(t.l.o[i], L.a, L_OK[i])}`;
  if (L.a !== null) { h += verdict(t, L.a, L_OK[i]) + `<p class="fb-why">${esc(t.l.why[i])}</p>`; h += nextBtn(i < 2 ? t.next : t.again, i < 2 ? 'next' : 'again'); }
  return h + '</div>';
}
function fitsHtml(t) {
  const F = S.f, i = F.i, o = t.f.o[i];
  let h = `<div class="fb-nb"><p>${esc(t.f.story[i])}</p><div class="fb-q">${esc(t.f.q)}</div>${optsHtml(o.map((n) => t.f.titles[n]), F.a, F_OK[i], o.map((n) => FEMO[n]))}`;
  if (F.a !== null) { h += verdict(t, F.a, F_OK[i]) + `<p>${esc(t.f.why[i])}</p>`; h += nextBtn(i < 3 ? t.next : t.again, i < 3 ? 'next' : 'again'); }
  return h + '</div>';
}
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = v;
  let h = v === 'race' ? raceHtml(t) : v === 'lesson' ? lessonHtml(t) : fitsHtml(t);
  if (v === 'race') {
    const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    h += `<div class="row2 fb-chips"><div class="chips">${sc('aesop', '📜')}${sc('mine', '✍️')}</div></div>`;
  }
  $('ctrlBody').innerHTML = h;
  const done = v === 'race' ? S.r.ph === 'r2' : v === 'lesson' ? S.l.done : S.f.done;
  const [emo, title, lead, body] = t.cards[v][done ? 'f' : 'n'];
  lab.setState({ emo, title, lead, body, extra: '' });
  lab.setGlow(v === 'race' ? 'rgba(123, 182, 97, .24)' : v === 'lesson' ? 'rgba(232, 185, 49, .2)' : 'rgba(110, 139, 200, .26)');
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view, j = +b.dataset.j, now = nowS();
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.secT = now; sfx.click();
  } else if (act === 'mm') { S.mine.m = +b.dataset.i; S.secT = now; sfx.tick(); }
  else if (act === 'ma') { S.mine.a = +b.dataset.i; sfx.tick(); }
  else if (act === 'mb') { S.mine.b = +b.dataset.i; sfx.tick(); }
  else if (v === 'race') {
    const R = S.r;
    if (act === 'next') {
      sfx.click();
      if (R.ph === 'story') { if (R.p < 2) { R.p++; R.t = now; } else R.ph = 'q1'; }
      else if (R.ph === 'r1') R.ph = 'q2';
    } else if (act === 'pick') {
      if (R.ph === 'q1') { R.a1 = j; R.ph = 'r1'; R.t = now; R.fired = false; (j === R_OK1 ? sfx.good : sfx.bad)(); showStage(); }
      else if (R.ph === 'q2') { R.a2 = j; R.ph = 'r2'; R.t2 = now; (j === R_OK2 ? sfx.good : sfx.bad)(); showStage(); }
    } else if (act === 'again') { S.r = { p: 0, ph: 'story', a1: null, a2: null, t: now, t2: 0, fired: false, bound: -1 }; dust = []; conf = []; sfx.click(); }
  } else if (v === 'lesson') {
    const L = S.l;
    if (act === 'pick' && L.a === null) { L.a = j; L.t = now; L.done = L.i === 2; (j === L_OK[L.i] ? sfx.good : sfx.bad)(); showStage(); }
    else if (act === 'next') { L.i++; L.a = null; L.t = now; sfx.click(); }
    else if (act === 'again') { S.l = { i: 0, a: null, t: now, done: false }; sfx.click(); }
  } else {
    const F = S.f;
    if (act === 'pick' && F.a === null) { F.a = j; F.t = now; F.done = F.i === 3; (j === F_OK[F.i] ? sfx.good : sfx.bad)(); showStage(); }
    else if (act === 'next') { F.i++; F.a = null; F.t = now; sfx.click(); }
    else if (act === 'again') { S.f = { i: 0, a: null, t: now, done: false }; sfx.click(); }
  }
  render();
});
render();
