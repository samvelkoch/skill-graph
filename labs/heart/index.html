const ss = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const bump = (p, a, b) => (p > a && p < b ? Math.sin(Math.PI * (p - a) / (b - a)) : 0);
const RICH = [255, 72, 56], POOR = [140, 30, 88];
const mixc = (o) => [0, 1, 2].map((i) => Math.round(lerp(POOR[i], RICH[i], clamp(o, 0, 1))));

// 3. Paths: a closed loop of points, each with oxygen level, width, kind and section
// ---------------------------------------------------------------------------------------------------------
function chaikin(p, n = 3) {
  for (let k = 0; k < n; k++) {
    const q = [p[0]];
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i], b = p[i + 1];
      q.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]);
    }
    q.push(p[p.length - 1]); p = q;
  }
  return p;
}
const wave = (x0, y, x1, amp, cyc, n = 80) => Array.from({ length: n + 1 }, (_, i) => {
  const u = i / n;
  return [x0 + (x1 - x0) * u, y + amp * Math.sin(u * cyc * TAU) * Math.min(1, u * 8, (1 - u) * 8)];
});
// a capillary wave that follows a curved guide line (the lungs and the belly are not straight)
function waveAlong(guide, amp, cyc, n = 150) {
  const p = chaikin(guide, 3), loc = [0];
  for (let i = 1; i < p.length; i++) loc.push(loc[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
  const L = loc[loc.length - 1], out = [];
  let j = 1;
  for (let i = 0; i <= n; i++) {
    const u = i / n, dd = L * u;
    while (j < p.length - 1 && loc[j] < dd) j++;
    const a = p[j - 1], b = p[j], sg = (loc[j] - loc[j - 1]) || 1, e = (dd - loc[j - 1]) / sg;
    const k = amp * Math.sin(u * cyc * TAU) * Math.min(1, u * 8, (1 - u) * 8);
    out.push([lerp(a[0], b[0], e) - (b[1] - a[1]) / sg * k, lerp(a[1], b[1], e) + (b[0] - a[0]) / sg * k]);
  }
  return out;
}
function buildPath(defs) {
  const P = []; let d = 0; const secs = [];
  defs.forEach((df, si) => {
    const pts = df.smooth ? chaikin(df.pts, 3) : df.pts;
    const loc = [0]; let len = 0;
    for (let i = 1; i < pts.length; i++) { len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); loc.push(len); }
    const d0 = d, ox = (i) => lerp(df.o[0], df.o[1], ss(len ? loc[i] / len : 0));
    pts.forEach((p, i) => {
      if (si > 0 && i === 0) return;                          // shared point with the previous section
      P.push({ x: p[0], y: p[1], o: ox(i), w: df.w, kind: df.kind, si, d: d0 + loc[i] });
    });
    d = d0 + len;
    secs.push({ k: df.k, kind: df.kind, d0, d1: d, w: df.w, pts: pts.map((p, i) => ({ x: p[0], y: p[1], o: ox(i) })) });
  });
  return { P, secs, total: d };
}
function sample(path, dist) {
  const P = path.P, tot = path.total;
  const d = ((dist % tot) + tot) % tot;
  let lo = 0, hi = P.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P[m].d <= d) lo = m; else hi = m; }
  const a = P[lo], b = P[hi], u = clamp((d - a.d) / ((b.d - a.d) || 1), 0, 1);
  return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), o: lerp(a.o, b.o, u), w: lerp(a.w, b.w, u), kind: b.kind, si: b.si };
}
function segDist(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - a.x) * dx + (py - a.y) * dy) / l2, 0, 1) : 0;
  return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
}
function nearest(path, x, y) {
  let best = 1e9, si = -1, kind = null;
  for (let i = 1; i < path.P.length; i++) {
    const d = segDist(x, y, path.P[i - 1], path.P[i]);
    if (d < best) { best = d; si = path.P[i].si; kind = path.P[i].kind; }
  }
  return { d: best, si, kind };
}

// The heart sits in the child's chest, tipped toward the child's left (the right of the picture).
// hp(u, v) turns a point in heart units (about -1..1) into a point of the 120 x 104 drawing box.
const HEART = { x: 62, y: 50, s: 14, rot: -0.32 };
const hp = (u, v) => {
  const ca = Math.cos(HEART.rot), sa = Math.sin(HEART.rot);
  return [HEART.x + HEART.s * (u * ca - v * sa), HEART.y + HEART.s * (u * sa + v * ca)];

const INK = '#2B2233', SEL = '#F2B632', ARTERY = '#E0313F', VEIN = '#5A62C8', O2C = '#35B6F0', CO2C = '#9C9488';

// Inside view: the box is 140 units wide (x -10..130) and leaves a strip at the bottom for the "Muscles & body" pill.
const fitI = (w, h) => { const s = Math.min(w / 140, (h - 38) / 104); return { s, ox: (w - 140 * s) / 2 + 10 * s, oy: 4 + Math.max(0, (h - 38 - 104 * s) / 2) }; };
function txt(c, s, x, y, size, o = {}) {
  c.font = `${o.w ?? 800} ${size}px ${FONT}`; c.textAlign = o.al ?? 'center'; c.textBaseline = o.bl ?? 'middle';
  if (o.halo !== false) { c.lineWidth = 3; c.lineJoin = 'round'; c.strokeStyle = 'rgba(10,12,20,.85)'; c.strokeText(s, x, y); }

function rr(c, x, y, w, h, r) {
  const [tl, tr, br, bl] = Array.isArray(r) ? r : [r, r, r, r];

  c.lineTo(x + w, y + h - br); c.arcTo(x + w, y + h, x + w - br, y + h, br); c.lineTo(x + bl, y + h); c.arcTo(x, y + h, x, y + h - bl, bl);

const beatEnv = (p) => bump(p, 0, 0.14) + 0.55 * bump(p, 0.18, 0.36);          // "lub-dub"
const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const shade = (h, k) => { const f = (v) => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k); const [r, g, b] = hexRgb(h); return `rgb(${f(r)},${f(g)},${f(b)})`; };

const rnd = (() => { let a = 11; return () => (a = (a * 16807) % 2147483647) / 2147483647; })();
const bez = (a, b, c2, d, t) => { const m = 1 - t; return [m * m * m * a[0] + 3 * m * m * t * b[0] + 3 * m * t * t * c2[0] + t * t * t * d[0], m * m * m * a[1] + 3 * m * m * t * b[1] + 3 * m * t * t * c2[1] + t * t * t * d[1]]; };

// The warm "book page" the picture sits on: gradient, soft vignette, faint dotted paper. Leaves the canvas clipped to the page.
function panel(c, w, h) {
  rr(c, 0, 0, w, h, 16); c.clip();
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#F7F1E8'); g.addColorStop(1, '#EADFCF');
  c.fillStyle = g; c.fillRect(0, 0, w, h);

  v.addColorStop(0, 'rgba(120,85,60,0)'); v.addColorStop(1, 'rgba(120,85,60,.14)');

    const d = document.createElement('canvas'); d.width = d.height = 14;
    const x = d.getContext('2d'); x.fillStyle = 'rgba(110,80,60,.07)'; x.beginPath(); x.arc(7, 7, 1.1, 0, TAU); x.fill();

}
// A dark label pill. lines = [{ s, size, col, w }]. (x, y) is its centre, or its top-left / top-right corner (o.anchor). Returns its rect.
function pill(c, lines, x, y, o = {}) {
  const padX = o.padX ?? 9, padY = 5, gap = 1.5;
  let tw = 0, th = padY * 2 - gap;
  lines.forEach((l) => { c.font = `${l.w ?? 800} ${l.size}px ${FONT}`; tw = Math.max(tw, c.measureText(l.s).width); th += l.size * 1.2 + gap; });
  const W = tw + padX * 2, H = th, m = 4;

  c.fillStyle = 'rgba(30,26,43,.93)'; c.fill(); c.shadowColor = 'transparent';
  c.lineWidth = 1; c.strokeStyle = o.border ?? 'rgba(242,201,76,.75)'; c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  let yy = y0 + padY;
  lines.forEach((l) => { c.font = `${l.w ?? 800} ${l.size}px ${FONT}`; c.fillStyle = l.col ?? '#fff'; c.fillText(l.s, x0 + W / 2, yy + l.size * 0.6); yy += l.size * 1.2 + gap; });

// a thin line from the edge of a pill to the thing it names
function leader(c, r, tx, ty) {
  const sx = clamp(tx, r.x, r.x + r.w), sy = clamp(ty, r.y, r.y + r.h);

// the same, but the line bends through some waypoints first (to keep clear of the lungs)
function leaderVia(c, r, via, tx, ty) {

// 6. Simulation step (shared heartbeat, breathing, flowing cells)
// ---------------------------------------------------------------------------------------------------------
function step(dt, time) {
  const v = lab.view;
  HRS.tgt = v === 'move' ? ACT[S.act].hr : v === 'loop' ? S.bpm : (S.paused ? 0 : 75 * S.speed);
  HRS.cur += (HRS.tgt - HRS.cur) * (1 - Math.exp(-dt / 0.8));
  if (Math.abs(HRS.tgt - HRS.cur) < 0.05) HRS.cur = HRS.tgt;
  beat += dt * HRS.cur / 60;
  if (beat >= 1) { beat -= Math.floor(beat); if (HRS.cur > 1) { sfx.push(); ripples.push(time); } }
  while (ripples.length && time - ripples[0] > 1) ripples.shift();
  breath = (breath + dt * brOf(HRS.cur) / 60) % 1;
  const f = HRS.cur / 75;
  const adv = (sim, kp, lap, pulseGain) => {
    const v0 = sim.path.total / lap * f, env = 1 + pulseGain * beatEnv(beat);
    for (let i = 0; i < sim.d.length; i++) {
      const p = sample(sim.path, sim.d[i]);
      sim.d[i] += v0 * kp[p.kind] * (p.kind === 'artery' || p.kind === 'heart' ? env : 1) * dt;
    }
  };
  adv(sim1, KP1, LAP1[0], 0.5); adv(sim3, KP3, LAP1[1], 0);
  if (v === 'loop') {
    const n = Math.random() < 10 * f * dt * 2 ? 1 : 0;
    for (let i = 0; i < n && PT.length < 46; i++) PT.push({ bed: Math.random() < 0.5 ? 'lungcap' : 'bodycap', k: Math.random() < 0.5 ? 'o2' : 'co2', u: 0.04 + 0.92 * Math.random(), t: 0 });
  }
  for (let i = PT.length - 1; i >= 0; i--) { PT[i].t += dt / 1.1; if (PT[i].t >= 1) PT.splice(i, 1); }
  if (v === 'inside') {
    const si = sample(path3, sim3.d[0]).si;
    if (si !== S.sec3) { S.sec3 = si; renderState(); }
  }
  if (v === 'loop') {
    const n = Math.floor(sim1.d[0] / path1.total);
    if (n !== lastLap && $('lapLine')) { lastLap = n; $('lapLine').textContent = T[lang].laps(n); }
  }
  liveReadout(false);
}

  lobed(c, cx, cy, rx, ry, 6, ph, k); c.lineWidth = 0.55; c.strokeStyle = 'rgba(160,55,80,.95)'; c.stroke();
}
function drawInside(c, w, h, time) {
  const t = T[lang], f = fitI(w, h), s = f.s, X = (x) => f.ox + x * s, Y = (y) => f.oy + y * s;
  const fs = clamp(s * 4.3, 12, 14);
  const atr = bump(beat, 0, 0.16), ven = bump(beat, 0.16, 0.5);
  const closed = ss((beat - 0.15) / 0.05) * (1 - ss((beat - 0.5) / 0.06)), open = 1 - closed;       // AV valves open while the chambers fill
  const br = (1 - Math.cos(breath * TAU)) / 2;
  const virt = () => { c.save(); c.translate(f.ox, f.oy); c.scale(s, s); c.lineCap = 'round'; c.lineJoin = 'round'; };
  // lungs on top, the body (muscle) below
  virt();
  drawLungWide(c, 36, 13.5, 22, 10.5, 1 + 0.05 * br, 0.6); drawLungWide(c, 84, 13.5, 22, 10.5, 1 + 0.05 * br, 2.1);
  const mg = c.createLinearGradient(0, 90, 0, 104); mg.addColorStop(0, '#C9434F'); mg.addColorStop(1, '#9E2B38');
  rr(c, -9, 90.5, 138, 13, 5); c.save(); c.shadowColor = 'rgba(90,20,30,.3)'; c.shadowBlur = 6 * DPR; c.shadowOffsetY = 2 * DPR; c.fillStyle = mg; c.fill(); c.restore();
  c.save(); rr(c, -9, 90.5, 138, 13, 5); c.clip();
  c.strokeStyle = 'rgba(229,123,133,.5)'; c.lineWidth = 0.4;
  for (let x = -20; x < 130; x += 3.4) { c.beginPath(); c.moveTo(x, 104); c.lineTo(x + 9, 90); c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,.14)'; c.fillRect(-9, 90.5, 138, 3.5);
  c.restore();
  rr(c, -9, 90.5, 138, 13, 5); c.lineWidth = 0.5; c.strokeStyle = '#7E1F2B'; c.stroke();
  c.restore();
  pill(c, [{ s: plain(t.parts.lungs.tag), size: fs }], X(22), Y(7.5), { cw: w, ch: h });
  pill(c, [{ s: plain(t.parts.body.tag), size: fs }], w / 2, Math.min(Y(103.5) + 4 + 12.2, h - 6 - 12.2), { cw: w, ch: h });   // fully on the stage, centred under the band
  // vessels, then the heart on top of their ends
  virt();
  drawTubes(c, path3, null, time);
  const hs = (1 + 0.02 * ven) * HK; c.translate(HC[0], HC[1]); c.scale(hs, hs); c.translate(-HC[0], -HC[1]);
  c.save(); c.shadowColor = 'rgba(90,10,30,.4)'; c.shadowBlur = 10 * DPR; c.shadowOffsetY = 3 * DPR;
  const mu = c.createLinearGradient(27, 30, 95, 86); mu.addColorStop(0, '#D63A4C'); mu.addColorStop(1, '#A0182E');
  c.fillStyle = mu; c.fill(IN.muscle); c.restore();
  c.save(); c.clip(IN.muscle);
  const sh = c.createRadialGradient(88, 80, 4, 88, 80, 40); sh.addColorStop(0, 'rgba(70,0,20,.38)'); sh.addColorStop(1, 'rgba(70,0,20,0)');
  c.fillStyle = sh; c.fillRect(20, 20, 90, 80);
  c.strokeStyle = 'rgba(255,205,195,.5)'; c.lineWidth = 1.1;
  c.beginPath(); c.moveTo(28.5, 52); c.quadraticCurveTo(27.4, 38, 38, 31.4); c.stroke();
  c.beginPath(); c.moveTo(68.8, 38); c.quadraticCurveTo(71, 31.6, 80, 31.4); c.stroke();
  c.restore();
  c.lineWidth = 0.5; c.strokeStyle = '#7A1022'; c.stroke(IN.muscle);
  // the four rooms: oxygen-poor blood on the right of the heart, oxygen-rich on the left
  Object.entries(IN_C).forEach(([k, [cx, cy, rich]]) => {
    const sq = k.endsWith('a') ? atr : ven;
    c.save(); c.translate(cx, cy); c.scale(1 - 0.1 * sq, 1 - 0.1 * sq); c.translate(-cx, -cy);
    const hex = rich ? '#FF4838' : '#8C1E58', g = c.createLinearGradient(0, cy - 14, 0, cy + 14);
    g.addColorStop(0, shade(hex, 0.16 + 0.1 * sq)); g.addColorStop(1, shade(hex, -0.14));
    c.fillStyle = g; c.fill(IN[k]);
    c.save(); c.clip(IN[k]); c.lineWidth = 2.4; c.strokeStyle = 'rgba(60,0,20,.4)'; c.stroke(IN[k]); c.restore();
    c.restore();
  });
  // doors between the rooms (the valves)
  const channel = (x, y, ww, hh, hex) => { const g = c.createLinearGradient(0, y, 0, y + hh); g.addColorStop(0, shade(hex, 0.1)); g.addColorStop(1, hex); c.fillStyle = g; c.fillRect(x, y, ww, hh); };
  channel(35, 51, 11, 7, '#8C1E58'); channel(74, 51, 10, 7, '#FF4838');
  const neck = (x, y, ww, hh, color) => { rr(c, x, y, ww, hh, 1.2); c.fillStyle = color; c.fill(); c.lineWidth = 0.4; c.strokeStyle = 'rgba(54,16,40,.9)'; c.stroke(); };
  neck(53.1, 51.5, 3.4, 7, ARTERY); neck(62.3, 51.5, 3.4, 7, ARTERY); neck(26.6, 46.6, 5.2, 5, VEIN); neck(77.4, 32.2, 3.2, 5.4, VEIN);
  const flap = (bx, by, tx, ty, bow) => {
    c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo((bx + tx) / 2 + bow, (by + ty) / 2, tx, ty);
    c.lineWidth = 1.5; c.strokeStyle = '#A99E86'; c.stroke(); c.lineWidth = 0.95; c.strokeStyle = '#FFFDF6'; c.stroke();
  };
  const L = (a, b) => lerp(a, b, open);
  [[35.5, 45.5, 40, 41, 35, 46.2], [74.5, 83.5, 78.6, 79.4, 74, 84.2]].forEach(([bl, br2, tl, tr, ol, or]) => {   // tricuspid, mitral
    flap(bl, 56.4, L(tl, ol), L(61.4, 64.6), L(0.8, -0.6)); flap(br2, 56.4, L(tr, or), L(61.4, 64.6), L(-0.8, 0.6));
  });
  [[53.4, 56.2, 54.5, 55.1, 53.1, 56.5], [62.6, 65.4, 63.7, 64.3, 62.3, 65.7]].forEach(([bl, br2, tl, tr, ol, or]) => {   // pulmonary, aortic
    const o2 = closed;
    flap(bl, 56.2, lerp(tl, ol, o2), lerp(58.6, 53.8, o2), 0); flap(br2, 56.2, lerp(tr, or, o2), lerp(58.6, 53.8, o2), 0);
  });
  c.restore();
  // names of the rooms: compact pills in the free space beside the heart, each with a short line to its room
  inRects.length = 0;
  const here = D3[S.sec3]?.k;
  const lines = Object.entries(IN_LBL).map(([k, L]) => {
    const [l1, l2] = t.ch[k], zone = (L.a === 'tr' ? L.x - L.l : L.r - L.x) * s;
    let size = clamp(s * 4.9, 12, 13);
    for (; size > 10; size -= 0.25) { c.font = `700 ${size}px ${FONT}`; if (Math.max(c.measureText(l1).width, c.measureText(l2).width) + 12 <= zone) break; }
    size = Math.max(10, size);
    const r = pill(c, [{ s: l1, size, w: 700 }, { s: l2, size, w: 700 }], X(L.x), Y(L.y), { anchor: L.a, cw: w, ch: h, padX: 6, border: here === k ? SEL : undefined });
    inRects.push({ k, x: r.x - 2, y: r.y - 2, w: r.w + 4, h: r.h + 4 });
    return [r, X(L.tgt[0]), Y(L.tgt[1])];
  });
  lines.forEach(([r, tx, ty]) => leader(c, r, tx, ty));
  virt(); drawCells(c, sim3, 1.35, 0.8); c.restore();
}
function hit3(x, y, s) {
  const xo = HC[0] + (x - HC[0]) / HK, yo = HC[1] + (y - HC[1]) / HK;      // the heart is drawn at HK size: test in its own units
  for (const k of Object.keys(IN_HIT)) if (SC.isPointInPath(IN_HIT[k], xo, yo)) return k;
  const n = nearest(path3, x, y);
  if (n.d < Math.max(4, 17 / s)) return D3[n.si].k;
  if (y < 27 && x > 10 && x < 110) return 'lungs';
  if (y > 88) return 'body';
  return null;
}

// ---------------------------------------------------------------------------------------------------------
// 10. Go
// ---------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  DPR = c.getTransform().a || 1;
  step(dt, time);
  c.save(); panel(c, w, h);
  if (lab.view === 'loop') drawLoop(c, w, h, time);
  else if (lab.view === 'move') drawMove(c, w, h, dt, time);
  else drawInside(c, w, h, time);
  rr(c, 0.75, 0.75, w - 1.5, h - 1.5, 15.5); c.lineWidth = 1.5; c.strokeStyle = 'rgba(43,34,51,.25)'; c.stroke();
  c.restore();
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), f = (lab.view === 'inside' ? fitI : fitV)(r.width, r.height);
  const px = ev.clientX - r.left, py = ev.clientY - r.top, x = (px - f.ox) / f.s, y = (py - f.oy) / f.s;
  if (lab.view === 'loop') { const k = tapTag(px, py) ?? hit1(x, y, f.s); S.sel = !k || k === S.sel ? null : k; sfx.click(); renderChips(); renderState(); }
  else if (lab.view === 'inside') {
    const k = inRects.find((q) => px >= q.x && px <= q.x + q.w && py >= q.y && py <= q.y + q.h)?.k ?? hit3(x, y, f.s); if (!k) return;
    const i = D3.findIndex((d) => d.k === k), sc = path3.secs[i];
    sim3.d[0] = Math.floor(sim3.d[0] / path3.total) * path3.total + sc.d0 + 0.12 * (sc.d1 - sc.d0);
    S.sec3 = i; sfx.click(); renderState();
  }
});
renderAll();
</script>
