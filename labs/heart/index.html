function chaikin(p, n = 3) {
  for (let k = 0; k < n; k++) {
    const q = [p[0]];
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i], b = p[i + 1];
      q.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]);
    }
    q.push(p[p.length - 1]); p = q;
  }
  return p;
}
const wave = (x0, y, x1, amp, cyc, n = 80) => Array.from({ length: n + 1 }, (_, i) => {
  const u = i / n;
  return [x0 + (x1 - x0) * u, y + amp * Math.sin(u * cyc * TAU) * Math.min(1, u * 8, (1 - u) * 8)];
});
function buildPath(defs) {
  const P = []; let d = 0; const secs = [];
  defs.forEach((df, si) => {
    const pts = df.smooth ? chaikin(df.pts, 3) : df.pts;
    const loc = [0]; let len = 0;
    for (let i = 1; i < pts.length; i++) { len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); loc.push(len); }
    const d0 = d;
    pts.forEach((p, i) => {
      if (si > 0 && i === 0) return;                          // shared point with the previous section
      P.push({ x: p[0], y: p[1], o: lerp(df.o[0], df.o[1], ss(len ? loc[i] / len : 0)), w: df.w, kind: df.kind, si, d: d0 + loc[i] });
    });
    d = d0 + len; secs.push({ k: df.k, kind: df.kind, d0, d1: d });
  });
  return { P, secs, total: d };
}
function sample(path, dist) {
  const P = path.P, tot = path.total;
  const d = ((dist % tot) + tot) % tot;
  let lo = 0, hi = P.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P[m].d <= d) lo = m; else hi = m; }
  const a = P[lo], b = P[hi], u = clamp((d - a.d) / ((b.d - a.d) || 1), 0, 1);
  return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), o: lerp(a.o, b.o, u), w: lerp(a.w, b.w, u), kind: b.kind, si: b.si };
}
function segDist(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - a.x) * dx + (py - a.y) * dy) / l2, 0, 1) : 0;
  return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
}
function nearest(path, x, y) {
  let best = 1e9, si = -1, kind = null;
  for (let i = 1; i < path.P.length; i++) {
    const d = segDist(x, y, path.P[i - 1], path.P[i]);
    if (d < best) { best = d; si = path.P[i].si; kind = path.P[i].kind; }
  }
  return { d: best, si, kind };
}

const fitV = (w, h) => { const s = Math.min(w / 120, h / 104) * 0.98; return { s, ox: (w - 120 * s) / 2, oy: (h - 104 * s) / 2 }; };

}
const fitSize = (c, s, maxW, size, w = 800) => { c.font = `${w} ${size}px ${FONT}`; const m = c.measureText(s).width; return m > maxW ? size * maxW / m : size; };

  c.bezierCurveTo(cx - 1.1 * s, cy + 0.35 * s, cx - 0.5 * s, cy + 0.65 * s, cx, cy + 1.0 * s);
  c.bezierCurveTo(cx + 0.5 * s, cy + 0.65 * s, cx + 1.1 * s, cy + 0.35 * s, cx + 1.1 * s, cy - 0.2 * s);

  c.lineTo(x + w, y + h - br); c.arcTo(x + w, y + h, x + w - br, y + h, br); c.lineTo(x + bl, y + h); c.arcTo(x, y + h, x, y + h - bl, bl);

function drawVessels(c, path, f, sel, time) {

// ---------------------------------------------------------------------------------------------------------
// 6. Simulation step (shared heartbeat, breathing, flowing cells)
// ---------------------------------------------------------------------------------------------------------
function step(dt, time) {
  const v = lab.view;
  HRS.tgt = v === 'move' ? ACT[S.act].hr : v === 'loop' ? S.bpm : (S.paused ? 0 : 75 * S.speed);
  HRS.cur += (HRS.tgt - HRS.cur) * (1 - Math.exp(-dt / 0.8));
  if (Math.abs(HRS.tgt - HRS.cur) < 0.05) HRS.cur = HRS.tgt;
  beat += dt * HRS.cur / 60;
  if (beat >= 1) { beat -= Math.floor(beat); if (HRS.cur > 1) { sfx.push(); ripples.push(time); } }
  breath = (breath + dt * brOf(HRS.cur) / 60) % 1;
  const f = HRS.cur / 75;
  const adv = (sim, kp, lap, pulseGain) => {
    const v0 = sim.path.total / lap * f, env = 1 + pulseGain * beatEnv(beat);
    for (let i = 0; i < sim.d.length; i++) {
      const p = sample(sim.path, sim.d[i]);
      sim.d[i] += v0 * kp[p.kind] * (p.kind === 'artery' || p.kind === 'heart' ? env : 1) * dt;
    }
  };
  adv(sim1, KP1, LAP1[0], 0.5); adv(sim3, KP3, LAP1[1], 0);
  if (v === 'loop') {
    const n = Math.random() < 10 * f * dt * 2 ? 1 : 0;
    for (let i = 0; i < n && PT.length < 46; i++) PT.push({ bed: Math.random() < 0.5 ? 'lungcap' : 'bodycap', k: Math.random() < 0.5 ? 'o2' : 'co2', u: 0.04 + 0.92 * Math.random(), t: 0 });
  }
  for (let i = PT.length - 1; i >= 0; i--) { PT[i].t += dt / 1.1; if (PT[i].t >= 1) PT.splice(i, 1); }
  if (v === 'inside') {
    const si = sample(path3, sim3.d[0]).si;
    if (si !== S.sec3) { S.sec3 = si; renderState(); }
  }
  if (v === 'loop') {
    const n = Math.floor(sim1.d[0] / path1.total);
    if (n !== lastLap && $('lapLine')) { lastLap = n; $('lapLine').textContent = T[lang].laps(n); }
  }
  liveReadout(false);
}

function drawLoop(c, w, h, time) {
  const t = T[lang], f = fitV(w, h), s = f.s, X = (x) => f.ox + x * s, Y = (y) => f.oy + y * s;
  const fs = clamp(s * 3.6, 10, 15), sel = S.sel;
  const br = (1 - Math.cos(breath * TAU)) / 2, k = 1 + 0.09 * br;
  // lungs + muscles backdrop
  lungShape(c, f, [43, 77], 16, 16.5, 10.5, k, sel === 'lungs' ? '#fff' : null);
  c.save(); rr(c, X(22), Y(83), 76 * s, 18.5 * s, 6 * s);
  c.fillStyle = 'rgba(255,120,90,.07)'; c.fill(); c.lineWidth = sel === 'body' ? 3 : 1.4; c.strokeStyle = sel === 'body' ? '#fff' : 'rgba(255,150,120,.35)'; c.stroke();
  c.clip(); c.strokeStyle = 'rgba(255,130,100,.1)'; c.lineWidth = 1;
  for (let x = 14; x < 110; x += 4.5) { c.beginPath(); c.moveTo(X(x), Y(83)); c.lineTo(X(x + 12), Y(101.5)); c.stroke(); }
  c.restore();
  drawVessels(c, path1, f, sel === 'artery' || sel === 'vein' || sel === 'cap' ? sel : null, time);
  // heart
  const hp = 1 + 0.09 * beatEnv(beat), size = 16 * s;
  c.save(); c.translate(X(60), Y(48)); c.scale(hp, hp);

  c.fillStyle = 'rgba(255,72,56,.5)'; c.fillRect(0, -size * 1.2, size * 1.3, size * 2.4);
  c.restore();
  heartPath(c, 0, 0, size); c.lineWidth = sel === 'heart' ? 3.5 : 2; c.strokeStyle = sel === 'heart' ? '#fff' : 'rgba(255,160,150,.85)'; c.stroke();
  c.restore();

    const sc = sec1(p.bed), q = sample(path1, sc.d0 + p.u * (sc.d1 - sc.d0)), e = p.t;
    const lung = p.bed === 'lungcap', o2 = p.k === 'o2';

  txt(c, t.parts.lungs.tag, X(60), Y(3.6), fs); txt(c, t.parts.heart.tag, X(60), Y(77), fs * 1.1);
  txt(c, t.parts.vein.tag, X(36), Y(77), fs * 0.95); txt(c, t.parts.artery.tag, X(84), Y(77), fs * 0.95);
  txt(c, t.parts.cap.tag, X(60), Y(86.2), fs * 0.85, { col: 'rgba(237,239,247,.7)' });
  txt(c, t.parts.body.tag, X(60), Y(99.6), fs * 0.95, { w: 700 });
}
function hit1(x, y) {
  if (((x - 60) / 17.5) ** 2 + ((y - 48) / 16.5) ** 2 < 1) return 'heart';
  const n = nearest(path1, x, y);
  if (n.d < 3.6) return n.kind;
  if (y < 28 && x > 24 && x < 96) return 'lungs';
  if (y > 81 && x > 20 && x < 100) return 'body';
  return null;
}

// ---------------------------------------------------------------------------------------------------------
// 8. Scene 2: exercise
// ---------------------------------------------------------------------------------------------------------
const pulseWave = (p) => {
  const base = p < 0.1 ? Math.sin(p / 0.1 * Math.PI / 2) : (0.32 + 0.68 * Math.exp(-(p - 0.1) * 7)) * (1 - 0.97 * ss((p - 0.3) / 0.7));
  return base + 0.1 * Math.exp(-(((p - 0.42) / 0.04) ** 2)) - 0.04 * Math.exp(-(((p - 0.34) / 0.03) ** 2));
};
function drawMove(c, w, h, dt, time) {
  const t = T[lang], a = ACT[S.act];
  const top = h * 0.6, u = Math.min(w * 0.15, top * 0.26), hx = w * 0.25, hy = top * 0.4, lx = w * 0.75;
  const inten = clamp((HRS.cur - 60) / 130, 0, 1);
  // activity figure
  const bounce = a.step ? -Math.abs(Math.sin(time * a.step * Math.PI)) * u * 0.14 : 0;
  c.font = `${u * 1.0}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  if (S.act === 'sprint') { c.strokeStyle = 'rgba(200,220,255,.5)'; c.lineWidth = 2; c.lineCap = 'round'; for (let i = 0; i < 3; i++) { const yy = hy + (i - 1) * u * 0.3, xx = w * 0.5 - u * (0.75 + 0.15 * ((time * 6 + i) % 1)); c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx - u * 0.45, yy); c.stroke(); } }
  c.fillStyle = '#fff'; c.fillText(a.e, w * 0.5, hy + bounce);
  // heart
  const pulse = 1 + 0.12 * beatEnv(beat);
  while (ripples.length && time - ripples[0] > 0.8) ripples.shift();
  ripples.forEach((r0) => { const e = (time - r0) / 0.8; c.beginPath(); c.arc(hx, hy, u * (1.0 + e * 0.7), 0, TAU); c.strokeStyle = `rgba(255,90,80,${0.45 * (1 - e)})`; c.lineWidth = 2; c.stroke(); });
  c.save(); c.translate(hx, hy); c.scale(pulse, pulse);
  heartPath(c, 0, 0, u * 0.95);
  const g = c.createRadialGradient(-u * 0.3, -u * 0.4, u * 0.1, 0, 0, u * 1.3); g.addColorStop(0, '#ff8a7a'); g.addColorStop(0.5, '#e0243a'); g.addColorStop(1, '#8c0f26');
  c.fillStyle = g; c.fill(); c.lineWidth = 2; c.strokeStyle = 'rgba(255,190,180,.7)'; c.stroke(); c.restore();
  txt(c, String(Math.round(HRS.cur)), hx, hy + u * 1.35, u * 0.62, { w: 900 });
  txt(c, t.beatsMin, hx, hy + u * 1.35 + u * 0.46, Math.min(u * 0.26, fitSize(c, t.beatsMin, w * 0.4, u * 0.26)), { w: 700, col: 'rgba(237,239,247,.7)' });
  // lungs
  const br = (1 - Math.cos(breath * TAU)) / 2, k = 1 + 0.16 * br, ly = hy;
  c.save(); c.translate(lx, ly);
  c.strokeStyle = 'rgba(255,190,205,.55)'; c.lineWidth = 3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, -u * 1.15); c.lineTo(0, -u * 0.35); c.moveTo(0, -u * 0.35); c.lineTo(-u * 0.55, 0); c.moveTo(0, -u * 0.35); c.lineTo(u * 0.55, 0); c.stroke();
  [-0.8, 0.8].forEach((sx) => {
    lobe(c, sx * u, 0.05 * u, u * 0.72, u * 0.98, k);
    c.fillStyle = `rgba(255,150,175,${0.2 + 0.18 * br})`; c.fill(); c.lineWidth = 2; c.strokeStyle = 'rgba(255,175,195,.7)'; c.stroke();
  });
  c.restore();
  txt(c, String(Math.round(brOf(HRS.cur))), lx, hy + u * 1.35, u * 0.62, { w: 900 });
  txt(c, t.breathMin, lx, hy + u * 1.35 + u * 0.46, fitSize(c, t.breathMin, w * 0.4, u * 0.26, 700), { w: 700, col: 'rgba(237,239,247,.7)' });
  // bottom area
  const x0 = 12, x1 = w - 12, y0 = top + 6, y1 = h - 8;
  c.save(); rr(c, x0, y0, x1 - x0, y1 - y0, 12); c.fillStyle = 'rgba(8,10,18,.45)'; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(130,145,190,.22)'; c.stroke(); c.clip();
  const fz = clamp((y1 - y0) * 0.11, 10, 13);
  if (S.secret === 'day') {
    txt(c, t.day.canvas, x0 + 12, y0 + fz + 2, fz, { al: 'left', halo: false, w: 700, col: 'rgba(237,239,247,.75)' });
    const rh = (y1 - y0 - fz * 2 - 8) / 5, maxN = ACT.sprint.hr * 1440, bx = x0 + 12 + rh * 1.2, bw = x1 - bx - 12 - fz * 5.5;
    ACTS.forEach((k2, i) => {
      const n = ACT[k2].hr * 1440, y = y0 + fz * 2 + 6 + rh * (i + 0.5), cur = k2 === S.act;
      c.font = `${rh * 0.7}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(ACT[k2].e, x0 + 12 + rh * 0.5, y);
      rr(c, bx, y - rh * 0.28, Math.max(4, bw * n / maxN), rh * 0.56, 4); c.fillStyle = cur ? '#ff5a4a' : 'rgba(255,90,74,.35)'; c.fill();
      txt(c, fmt(n), bx + Math.max(4, bw * n / maxN) + 6, y, Math.min(fz, rh * 0.8), { al: 'left', halo: false, w: cur ? 900 : 700, col: cur ? '#fff' : 'rgba(237,239,247,.7)' });
    });
  } else if (S.secret === 'lap') {
    S.lapA = ((S.lapA ?? 0) + dt * TAU * (HRS.cur / REST_HR) / 10) % TAU; S.lapB = ((S.lapB ?? 0) + dt * TAU / 10) % TAU;
    const cy = (y0 + y1) / 2, R = Math.min((y1 - y0) * 0.4, w * 0.17), cx = x0 + 14 + R + 4;
    [[R, S.lapA, '#ff5a4a'], [R * 0.6, S.lapB, '#8fe3ff']].forEach(([r, ang, cc]) => {
      c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 2; c.stroke();
      c.beginPath(); c.arc(cx + r * Math.sin(ang), cy - r * Math.cos(ang), Math.max(4, R * 0.1), 0, TAU); c.fillStyle = cc; c.fill();
    });
    const tx = cx + R + 22, lap = Math.round(REST_LAP * REST_HR / a.hr), pm = new Intl.NumberFormat(lang, { maximumFractionDigits: 1 }).format(a.hr / REST_HR), ls = clamp((y1 - y0) * 0.13, 11, 15);
    txt(c, `${t.lap.now}: ${t.lap.time} ≈ ${fmt(lap)} s`, tx, cy - ls * 1.6, ls, { al: 'left', halo: false, col: '#ff8a7a', w: 900 });
    txt(c, `${t.lap.rest}: ${t.lap.time} ≈ ${fmt(REST_LAP)} s`, tx, cy - ls * 0.3, ls, { al: 'left', halo: false, col: '#8fe3ff', w: 800 });
    txt(c, `${pm} ${t.lap.perMin}`, tx, cy + ls * 1.0, ls, { al: 'left', halo: false, w: 700, col: 'rgba(237,239,247,.8)' });
    txt(c, t.lap.scale, tx, cy + ls * 2.3, ls * 0.85, { al: 'left', halo: false, w: 600, col: 'rgba(237,239,247,.5)' });
  } else {
    // scrolling pulse trace over the last few seconds
    hist.push({ t: time, v: pulseWave(beat) }); while (hist.length && time - hist[0].t > 6.2) hist.shift();
    const WIN = 6, pps = (x1 - x0 - 24) / WIN, base = y1 - 12, amp = (y1 - y0 - fz * 2 - 20) * (0.62 + 0.3 * inten);
    c.strokeStyle = 'rgba(130,145,190,.12)'; c.lineWidth = 1;
    for (let j = 0; j <= WIN; j++) { const gx = x1 - 12 - ((time % 1) + j) * pps; if (gx > x0 + 4) { c.beginPath(); c.moveTo(gx, y0 + fz * 2); c.lineTo(gx, y1 - 4); c.stroke(); } }
    txt(c, t.trace, x0 + 12, y0 + fz + 2, fz, { al: 'left', halo: false, w: 700, col: 'rgba(237,239,247,.6)' });
    c.beginPath();
    hist.forEach((q, i) => { const x = x1 - 12 - (time - q.t) * pps, y = base - q.v * amp; i ? c.lineTo(x, y) : c.moveTo(x, y); });
    c.lineJoin = 'round'; c.lineWidth = 3; c.strokeStyle = '#ff5a4a'; c.stroke();
    const last = hist[hist.length - 1]; if (last) { c.beginPath(); c.arc(x1 - 12, base - last.v * amp, 4.5, 0, TAU); c.fillStyle = '#fff'; c.fill(); }
  }
  c.restore();
}

// ---------------------------------------------------------------------------------------------------------
// 9. Scene 3: inside the heart
// ---------------------------------------------------------------------------------------------------------
const CH = { ra: [36, 34, 19, 19, 7], rv: [36, 56, 24, 26, [3, 3, 3, 13]], la: [65, 34, 19, 19, 7], lv: [60, 56, 26, 26, [3, 3, 13, 3]] };
function drawInside(c, w, h, time) {
  const t = T[lang], f = fitV(w, h), s = f.s, X = (x) => f.ox + x * s, Y = (y) => f.oy + y * s;
  const fs = clamp(s * 3.3, 9, 14);
  const atr = bump(beat, 0, 0.16), ven = bump(beat, 0.16, 0.5);
  lungShape(c, f, [45, 81], 15, 17, 11, 1 + 0.06 * (1 - Math.cos(breath * TAU)) / 2);
  c.save(); rr(c, X(10), Y(88.5), 104 * s, 14.5 * s, 6 * s); c.fillStyle = 'rgba(255,120,90,.07)'; c.fill(); c.lineWidth = 1.4; c.strokeStyle = 'rgba(255,150,120,.35)'; c.stroke(); c.restore();
  // chambers
  Object.entries(CH).forEach(([k, [x, y, cw, ch, r]]) => {
    const rich = k === 'la' || k === 'lv', sq = k.endsWith('a') ? atr : ven, scl = 1 - 0.07 * sq;
    const cx = X(x + cw / 2), cy = Y(y + ch / 2);
    c.save(); c.translate(cx, cy); c.scale(scl, scl); c.translate(-cx, -cy);
    const rad = Array.isArray(r) ? r.map((q) => q * s) : r * s;
    rr(c, X(x), Y(y), cw * s, ch * s, rad);
    c.fillStyle = col(rich ? 1 : 0, 0.22 + 0.2 * sq); c.fill();
    c.lineWidth = (k === 'lv' ? 2.4 : 1.3) * s; c.strokeStyle = `rgba(255,170,150,${0.55 + 0.35 * sq})`; c.stroke();
    c.restore();
  });
  c.lineWidth = 1.6 * s; c.strokeStyle = 'rgba(255,170,150,.6)'; c.beginPath(); c.moveTo(X(60), Y(56)); c.lineTo(X(60), Y(80)); c.stroke();
  // valves (one-way doors, drawn half open)
  c.strokeStyle = 'rgba(255,230,205,.9)'; c.lineWidth = 1.1 * s; c.lineCap = 'round';
  [[38.5, 42.5, 49.5, 45.5], [69, 73.5, 81, 76.5]].forEach(([ax, bx, cxv, dx]) => {
    c.beginPath(); c.moveTo(X(ax), Y(54.5)); c.lineTo(X(bx), Y(57.8)); c.moveTo(X(cxv), Y(54.5)); c.lineTo(X(dx), Y(57.8)); c.stroke();
  });
  // chamber names
  Object.keys(CH).forEach((k) => {
    const [x, y, cw, ch] = CH[k], [l1, l2] = t.ch[k], mw = (cw - 3) * s;
    const z = Math.min(fitSize(c, l1, mw, fs), fitSize(c, l2, mw, fs));
    const cy = Y(y + ch / 2 - (k.endsWith('v') ? 5 : 0));
    txt(c, l1, X(x + cw / 2), cy - z * 0.6, z, { w: 800, col: 'rgba(237,239,247,.82)', halo: false });
    txt(c, l2, X(x + cw / 2), cy + z * 0.6, z, { w: 800, col: 'rgba(237,239,247,.82)', halo: false });
  });
  drawVessels(c, path3, f, null, time);
  drawCells(c, sim3, f, KP3);
  txt(c, t.parts.lungs.tag, X(62), Y(3.8), fs * 1.1); txt(c, t.parts.body.tag, X(61), Y(101.4), fs);
}
function hit3(x, y) {
  for (const [k, [cx, cy, cw, ch]] of Object.entries(CH)) if (x >= cx && x <= cx + cw && y >= cy && y <= cy + ch) return k;
  const n = nearest(path3, x, y);
  if (n.d < 4) return D3[n.si].k;
  if (y < 27 && x > 24 && x < 102) return 'lungs';
  if (y > 88) return 'body';
  return null;
}

// ---------------------------------------------------------------------------------------------------------
// 10. Go
// ---------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  step(dt, time);
  if (lab.view === 'loop') drawLoop(c, w, h, time);
  else if (lab.view === 'move') drawMove(c, w, h, dt, time);
  else drawInside(c, w, h, time);
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), f = fitV(r.width, r.height);
  const x = (ev.clientX - r.left - f.ox) / f.s, y = (ev.clientY - r.top - f.oy) / f.s;
  if (lab.view === 'loop') { const k = hit1(x, y); S.sel = !k || k === S.sel ? null : k; sfx.click(); renderChips(); renderState(); }
  else if (lab.view === 'inside') {
    const k = hit3(x, y); if (!k) return;
    const i = D3.findIndex((d) => d.k === k), sc = path3.secs[i];
    sim3.d[0] = Math.floor(sim3.d[0] / path3.total) * path3.total + sc.d0 + 0.12 * (sc.d1 - sc.d0);
    S.sec3 = i; sfx.click(); renderState();
  }
});
renderAll();
