const hex2rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

  s /= 100; l /= 100;

  return rgb2hex(255 * f(0), 255 * f(8), 255 * f(4));
};

    const bh = R * .5, ys = [ly - bh - 2, ly + 2];
    [e1, e2].forEach((ex, k) => {
      const rx = lx + (ex - xm) * z;
      c.fillStyle = C.juice; c.fillRect(lx - R, ys[k], rx - (lx - R), bh);
      c.fillStyle = C.water; c.fillRect(rx, ys[k], lx + R - rx, bh);
    });
    c.setLineDash([4, 3]); c.lineWidth = 2; c.strokeStyle = C.glow; c.beginPath(); c.moveTo(lx + (e1 - xm) * z, ly - R); c.lineTo(lx + (e1 - xm) * z, ly + R); c.stroke();
    c.restore();
    c.lineWidth = 3; c.strokeStyle = '#fff'; c.beginPath(); c.arc(lx, ly, R, 0, 7); c.stroke();
    c.restore();
  }
}

// --- secret: the tree and its shadow ---------------------------------------------------------------------------
function drawTree(c, w, h, time) {
  const t = T[lang], f = S.f, th = Math.atan(1 / f), m = t.sec.metre;
  const bs = clamp((w - 90) / 16.3, 12, 26), PH = 4 * bs + 118, parkH = h - PH - 12, gy = parkH * .74;
  c.save(); c.beginPath(); c.roundRect(0, 0, w, h, 18); c.clip();
  const sky = c.createLinearGradient(0, 0, 0, gy); sky.addColorStop(0, mix(C.blue, C.water, .35)); sky.addColorStop(1, shade(C.water, .35));
  c.fillStyle = sky; c.fillRect(0, 0, w, gy + 2);
  // sun: higher for short shadows
  const t01 = clamp01((th - Math.atan(1 / 3)) / (Math.atan(1) - Math.atan(1 / 3))), sunX = w * .08, sunY = lerp(gy * .78, gy * .2, t01);
  const sg = c.createRadialGradient(sunX, sunY, 4, sunX, sunY, 60); sg.addColorStop(0, rgba(C.glow, .95)); sg.addColorStop(.35, rgba(C.glow, .35)); sg.addColorStop(1, rgba(C.glow, 0));
  c.fillStyle = sg; c.fillRect(sunX - 60, sunY - 60, 120, 120);
  c.fillStyle = C.glow; c.beginPath(); c.arc(sunX, sunY, 17, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,.85)';
  for (const [cx, cy, r] of [[w * .62, gy * .22, 14], [w * .8, gy * .38, 11]]) {
    c.beginPath(); c.arc(cx, cy, r, 0, 7); c.arc(cx + r, cy + 3, r * .8, 0, 7); c.arc(cx - r, cy + 4, r * .7, 0, 7); c.fill();
  }
  c.fillStyle = shade(C.green, -.38); c.beginPath(); c.ellipse(w * .7, gy + 4, w * .5, parkH * .1, 0, Math.PI, 0); c.fill();
  const gg = c.createLinearGradient(0, gy, 0, parkH); gg.addColorStop(0, shade(C.green, -.12)); gg.addColorStop(1, shade(C.green, -.5));
  c.fillStyle = gg; c.fillRect(0, gy, w, parkH - gy + 2);
  const bx = w * .24, u = clamp(Math.min(parkH * .12, (w * .95 - bx) / 15), 8, 40), gd = parkH - gy;
  const treeY = gy + gd * .28, stickX = bx - u * .1, stickY = gy + gd * .78, Ht = 5 * u, Hs = u;
  // shadows
  c.fillStyle = 'rgba(8,14,30,.4)';
  const Lt = f * Ht, Ls = f * Hs, tw0 = Math.max(4, u * .35);
  c.beginPath(); c.roundRect(bx, treeY - tw0 / 2, Lt * .62, tw0, tw0 / 2); c.fill();
  c.beginPath(); c.ellipse(bx + Lt * .82, treeY, Math.max(2, Lt * .2), Math.max(2, Ht * .07), 0, 0, 7); c.fill();
  c.beginPath(); c.roundRect(stickX, stickY - 2, Ls, 4, 2); c.fill();
  // sunlight along the tops to the shadow tips
  c.save(); c.setLineDash([5, 4]); c.lineWidth = 1.6; c.strokeStyle = rgba(C.glow, .85);
  const back = 34;
  for (const [x, y, H, L] of [[bx, treeY, Ht, Lt], [stickX, stickY, Hs, Ls]]) {
    const dx = L, dy = H, len = Math.hypot(dx, dy);
    c.beginPath(); c.moveTo(x - dx / len * back, y - H - dy / len * back); c.lineTo(x + L, y); c.stroke();
  }
  c.restore();
  // tree
  c.lineJoin = 'round';
  c.fillStyle = shade(C.counter, -.35); c.beginPath(); c.roundRect(bx - u * .22, treeY - Ht * .55, u * .44, Ht * .55, 3); c.fill();
  for (const [dx, dy, r, k] of [[-.2, .66, .26, -.1], [.2, .66, .26, -.18], [0, .74, .26, .02], [0, .86, .22, .1]]) {
    const fg = c.createRadialGradient(bx + dx * Ht - r * Ht * .3, treeY - dy * Ht - r * Ht * .3, 2, bx + dx * Ht, treeY - dy * Ht, r * Ht);
    fg.addColorStop(0, shade(C.green, k + .15)); fg.addColorStop(1, shade(C.green, k - .35));
    c.beginPath(); c.arc(bx + dx * Ht, treeY - dy * Ht, r * Ht, 0, 7); c.fillStyle = fg; c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(14,40,28,.55)'; c.stroke();
  }
  // stick
  const sw = Math.max(3, u * .2);
  c.fillStyle = C.counter; c.beginPath(); c.roundRect(stickX - sw / 2, stickY - Hs, sw, Hs, sw / 2); c.fill(); c.lineWidth = 1.5; c.strokeStyle = C.line; c.stroke();
  c.restore();
  // labels
  const kk = time < S.ft + .4 ? 0 : Math.min(5, Math.floor((time - S.ft - .4) / .5) + 1);
  pill(c, `1 ${m}`, stickX - 28, stickY - Hs * .5, { size: 12 });
  pill(c, kk >= 5 ? `5 ${m}` : '?', Math.max(30, bx - Ht * .42), treeY - Ht * .55, { size: 13, border: kk >= 5 ? C.green : C.glow, color: kk >= 5 ? C.green : C.glow });
  pill(c, `${f} ${m}`, stickX + Ls, stickY + 16, { size: 12 }); pill(c, `${5 * f} ${m}`, bx + Lt, treeY + 16, { size: 12 });
  // bars of the recipe [1 | f]
  const pb = { x: 8, y: parkH + 4, w: w - 16, h: PH - 2 };
  drawBoard(c, pb);
  const x0 = 24, y0 = pb.y + 8;
  barPair(c, x0, y0, bs, { j: 1, w: f, cj: C.yellow, cw: C.blue, names: [t.sec.stick, t.sec.shadow], rec: [1, f], gp: 1, pill: false }, time);
  const born = [0, 1, 2, 3, 4].map((k) => S.ft + .4 + k * .5);
  barPair(c, x0, y0 + pairH(bs, true) + 10, bs, { j: kk, w: 5 * f, cj: C.yellow, cw: C.blue, bj: born, names: [t.sec.tree, t.sec.shadow], rec: [1, f], gp: 1, qj: kk < 5 }, time);
}

// --- secret: paint pots ----------------------------------------------------------------------------------------
function drawPaint(c, w, h, time) {
  const t = T[lang];
  backdrop(c, w, h, h * .12);
  const cw = (w - 24) / 2, ch = (h - 24) / 2;
  const pots = [[1, 2, true], [2, 4, true], [1, 1, false], [S.pt[0], S.pt[1], true]];
  pots.forEach(([y, b, rec], i) => {
    const cx0 = 12 + (i % 2) * cw, cy0 = 12 + Math.floor(i / 2) * ch, mx = cx0 + cw / 2;
    c.save(); c.fillStyle = 'rgba(27,34,56,.78)'; c.beginPath(); c.roundRect(cx0 + 3, cy0 + 3, cw - 6, ch - 6, 16); c.fill();
    c.lineWidth = 1.2; c.strokeStyle = 'rgba(255,255,255,.12)'; c.stroke(); c.restore();
    const pw = Math.min(cw * .5, 110), ph = pw * .8, bs = clamp((cw - 28) / 7, 12, 26);
    const base = cy0 + 30 + ph + 10;
    pill(c, i === 3 && !y && !b ? '…' : `${y} : ${b}`, mx, cy0 + 22, { size: 13 });
    drawCan(c, mx, base, pw, ph, greenColor(y, b));
    const n = Math.max(y, b, 1);
    barPair(c, mx - n * bs / 2 - (rec && y && b ? bs * .3 : 0), base + 14, bs, { j: y, w: b, cj: C.yellow, cw: C.blue, rec: rec && y && b ? [1, 2] : null, gp: 1, pill: false }, time);
  });
  pill(c, '=', 12 + cw, 12 + ch / 2, { size: 18, border: C.glow, color: C.glow });
}

// --- the loop ----------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; G = { cups: [], rows: [] };
  const v = lab.view;
  c.globalAlpha = 1;
  if (v === 'mix') {
    if (S.sec === 'tree') drawTree(c, w, h, time);
    else if (S.sec === 'paint') drawPaint(c, w, h, time);
    else if (M.phase === 'q2' || M.phase === 'q2r') drawQ2(c, w, h, time);
    else drawMix(c, w, h, time, dt);
  } else if (v === 'bars') drawBarsView(c, w, h, time);
  else drawTaste(c, w, h, time);
});

// --- actions ------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function emptyJug() { S.j = 0; S.w = 0; S.bj = []; S.bw = []; S.mood = null; }
function pour(kind) {
  const now = tnow();
  if (kind === 'j') { if (S.j >= 12) return false; S.j++; S.bj.push(now + .45); S.pourJ = now; }
  else { if (S.w >= 12) return false; S.w++; S.bw.push(now + .45); S.pourW = now; }
  S.wobT = now + .45; S.mood = null; sfx.push(); render();
  return true;
}
function startIntro() {
  clearTimers(); Object.assign(M, { phase: 'intro', busy: true, a1: null, a2: null }); S.q2t = -1; S.groups = false; S.sec = null;
  emptyJug();
  ['j', 'j', 'w', 'w', 'w'].forEach((k, i) => later(500 + i * 480, () => pour(k)));
  later(500 + 5 * 480 + 600, () => { S.mood = moodOf(S.j, S.w); M.busy = false; sfx.good(); render(); });
  render();
}
function startQ1() {
  clearTimers(); Object.assign(M, { phase: 'q1', busy: true, a1: null, a2: null }); S.groups = false;
  emptyJug();
  for (let k = 0; k < 4; k++) later(500 + k * 520, () => pour('j'));
  later(500 + 4 * 520 + 400, () => { M.busy = false; render(); });
  render();
}
function answerQ1(i) {
  if (M.busy || M.a1 !== null) return;
  M.a1 = i; M.busy = true; showStage(); render();
  const need = +T.en.m.o1[i]; // cups of water poured first
  let t = 350;
  for (let k = 0; k < need; k++, t += 520) later(t, () => pour('w'));
  if (need !== 6) {
    t += 450; later(t, () => { S.mood = moodOf(S.j, S.w); sfx.bad(); render(); });
    t += 1700;
    for (let k = need; k < 6; k++, t += 520) later(t, () => pour('w'));
  }
  later(t + 400, () => { S.groups = true; S.mood = moodOf(S.j, S.w); sfx.good(); render(); });
  later(t + 1500, () => { M.phase = 'q1r'; M.busy = false; render(); });
}
function answerQ2(i) {
  if (M.busy || M.a2 !== null) return;
  M.a2 = i; M.busy = true; S.q2t = tnow(); (i === Q2R ? sfx.good : sfx.bad)(); showStage(); render();
  later(2500, () => { M.phase = 'q2r'; M.busy = false; M.fin = true; render(); });
}
function mixNext() {
  if (M.busy) return;
  if (M.phase === 'intro') startQ1();
  else if (M.phase === 'q1r') { M.phase = 'q2'; M.a2 = null; S.q2t = -1; }
  else if (M.phase === 'q2r') { M.phase = 'free'; S.mood = null; S.groups = true; }
}
function answerBars(i) {
  if (B.pick !== null) return;
  B.pick = i; B.t = tnow(); (i === BR[B.i].right ? sfx.good : sfx.bad)(); showStage();
  setTimeout(() => { B.shown = true; if (B.i === 2) B.fin = true; render(); }, 3000);
}
function answerTaste(i) {
  if (K.pick !== null) return;
  K.pick = i; K.t = tnow(); (i === TSR[K.i] ? sfx.good : sfx.bad)(); showStage();
  setTimeout(() => { K.shown = true; if (K.i === 2) K.fin = true; render(); }, 2800);
}
function roundNext(R, n) {
  if (!R.shown) return;
  R.i = R.i < n - 1 ? R.i + 1 : 0;
  R.pick = null; R.t = -1; R.shown = false;
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'opt') {
    const i = +b.dataset.i;
    if (v === 'mix') (M.phase === 'q1' ? answerQ1 : answerQ2)(i);
    else if (v === 'bars') answerBars(i);
    else answerTaste(i);
    return render();
  }
  if (act === 'next') { if (v === 'mix') mixNext(); else if (v === 'bars') roundNext(B, 3); else roundNext(K, 3); sfx.click(); }
  else if (act === 'pj') pour('j');
  else if (act === 'pw') pour('w');
  else if (act === 'taste') { S.mood = moodOf(S.j, S.w); if (S.mood) (S.mood === 'ok' ? sfx.good : sfx.bad)(); }
  else if (act === 'empty') { emptyJug(); sfx.click(); }
  else if (act === 'again') { startIntro(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k;
    if (S.sec === 'tree') S.ft = tnow();
    sfx.click();
  } else if (act === 'py') { if (S.pt[0] < 6) { S.pt[0]++; sfx.click(); } }
  else if (act === 'pb') { if (S.pt[1] < 6) { S.pt[1]++; sfx.click(); } }
  else if (act === 'pclear') { S.pt = [0, 0]; sfx.click(); }
  render();
});
$('rbSun').addEventListener('input', (ev) => { S.f = +ev.target.value; S.ft = tnow(); sfx.tick(); render(); });
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'mix' || S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (M.phase === 'free' && !M.busy) {
    const cup = G.cups.find((q) => Math.hypot(x - q.x, y - q.y) < q.r);
    if (cup) { pour(cup.kind); render(); }
  } else if (M.phase === 'q2' && M.a2 === null && !M.busy) {
    const i = G.rows.findIndex((q) => y >= q.y && y < q.y + q.h);
    if (i >= 0) { answerQ2(i); render(); }
  }
});

// --- one render per change: controls, readout and state card --------------------------------------------------
function setQ(o) {
  const t = T[lang];
  const opts = (o.opts || []).map((s, i) => {
    const cls = o.revealed ? (i === o.right ? ' good' : i === o.pick ? ' bad' : ' dim') : (i === o.pick ? ' sel' : '');
    return `<button class="rb-opt${cls}" data-act="opt" data-i="${i}"${o.locked ? ' disabled' : ''}>${esc(s)}</button>`;
  }).join('');
  $('rbQBox').innerHTML = (o.note ? `<p class="rb-note">${esc(o.note)}</p>` : '') + (o.q ? `<p class="rb-q">${esc(o.q)}</p>` : '')
    + `<div class="rb-opts">${opts}</div>`
    + (o.fb ? `<p class="rb-fb"><b class="${o.pick === o.right ? 'ok' : 'no'}">${esc(o.pick === o.right ? t.right : t.wrong)}</b> ${esc(o.fb)}</p>` : '')
    + (o.next ? `<div class="row2" style="margin-top:0"><button class="btn" data-act="next"${o.nextOff ? ' disabled' : ''}>${esc(o.next)}</button></div>` : '');
}
const card = (k, full) => { const [emo, title, lead, body] = CARDS[lang][k][full ? 1 : 0]; lab.setState({ emo, title, lead, body, extra: '' }); };
const moodColor = { ok: C.green, sweet: C.juice, watery: C.blue };
const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v === 'mix' ? (S.sec ? `mix-${S.sec}` : M.phase === 'q2' || M.phase === 'q2r' ? 'mix-q2' : 'mix') : v;
  show('rbQBox', false); show('rbFree', false); show('rbTree', false); show('rbPaint', false); show('rbChipsRow', false);
  if (v === 'mix') renderMix(t); else if (v === 'bars') renderBars(t); else renderTaste(t);
}

function renderMix(t) {
  const P = M.phase, free = P === 'free';
  lab.setGlow('rgba(224, 68, 106, .26)');
  show('rbChipsRow', free);
  if (free) {
    const open = secret.unlocked();
    const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    $('secChips').innerHTML = chip('tree', '🌳') + chip('paint', '🎨');
    $('rbAgain').textContent = t.again;
  }
  if (S.sec === 'tree') {
    show('rbTree', true); $('rbSun').value = S.f; $('rbSun').setAttribute('aria-label', t.sec.sun);
    lab.setReadout(`1 : ${S.f}`, `${t.sec.stick} 1 ${t.sec.metre} · ${t.sec.shadow} ${S.f} ${t.sec.metre}`, '', C.glow); lab.setGlow('rgba(255, 209, 102, .26)');
    lab.setState({ emo: '🌳', title: t.secrets.tree[0], lead: S.f === 2 ? t.sec.treeText : t.sec.treeNow(S.f), body: '', extra: '' });
    return;
  }
  if (S.sec === 'paint') {
    show('rbPaint', true);
    document.querySelector('[data-act=py]').textContent = t.sec.addYellow; document.querySelector('[data-act=pb]').textContent = t.sec.addBlue;
    document.querySelector('[data-act=pclear]').textContent = t.m.empty;
    document.querySelector('[data-act=py]').disabled = S.pt[0] >= 6; document.querySelector('[data-act=pb]').disabled = S.pt[1] >= 6;
    lab.setReadout(S.pt[0] || S.pt[1] ? `${S.pt[0]} : ${S.pt[1]}` : '–', '', '', C.green); lab.setGlow('rgba(61, 220, 151, .22)');
    lab.setState({ emo: '🎨', title: t.secrets.paint[0], lead: t.sec.paintText, body: '', extra: '' });
    return;
  }
  const busy = M.busy;
  if (P === 'intro') setQ({ next: t.next, nextOff: busy });
  else if (P === 'q1') setQ({ q: t.m.q1, opts: t.m.o1, pick: M.a1, right: 1, locked: busy || M.a1 !== null, revealed: false, fb: '', next: '' });
  else if (P === 'q1r') setQ({ q: t.m.q1, opts: t.m.o1, pick: M.a1, right: 1, locked: true, revealed: true, fb: t.m.r1, next: t.next });
  else if (P === 'q2') setQ({ q: t.m.q2, opts: t.m.o2, pick: M.a2, right: Q2R, locked: busy || M.a2 !== null, revealed: false });
  else if (P === 'q2r') setQ({ q: t.m.q2, opts: t.m.o2, pick: M.a2, right: Q2R, locked: true, revealed: true, fb: t.m.r2, next: t.next });
  show('rbQBox', !free);
  show('rbFree', free);
  if (free) {
    const b = (a) => document.querySelector(`[data-act=${a}]`);
    b('pj').textContent = t.m.addJuice; b('pw').textContent = t.m.addWater; b('taste').textContent = t.m.taste; b('empty').textContent = t.m.empty;
    b('pj').disabled = S.j >= 12; b('pw').disabled = S.w >= 12; b('taste').disabled = S.j + S.w === 0; b('empty').disabled = S.j + S.w === 0;
  }
  // readout: only what is already poured while a question is open
  let val, sub = '';
  if (P === 'q1' && M.a1 === null) val = `${S.j} : ?`;
  else if (P === 'q2' || P === 'q2r') { val = '2 : 3'; sub = t.cupsLine(2, 3); }
  else { val = `${S.j} : ${S.w}`; sub = t.cupsLine(S.j, S.w); }
  const mood = S.mood && P !== 'q2' && P !== 'q2r' ? S.mood : null;
  lab.setReadout(val, sub, mood ? t.face[mood] : '', mood ? moodColor[mood] : C.juice);
  card('mix', M.fin);
}

function renderBars(t) {
  const i = B.i, R = BR[i], rev = B.pick !== null;
  lab.setGlow('rgba(76, 125, 255, .26)');
  show('rbQBox', true);
  setQ({ q: t.b.q[i], opts: t.b.o[i], pick: B.pick, right: R.right, locked: rev, revealed: rev,
    fb: rev && B.shown ? t.b.why[i] : '', next: rev && B.shown ? (i < 2 ? t.next : t.again) : '' });
  const dots = [0, 1, 2].map((k) => (k < i || (k === i && B.shown) ? '●' : k === i ? '◉' : '○')).join(' ');
  lab.setReadout(B.shown ? String(R.ans) : '?', dots, '', i === 2 ? C.yellow : C.juice);
  card('bars', B.fin);
}

function renderTaste(t) {
  const i = K.i, [tj, tw] = TS[i], rev = K.pick !== null;
  lab.setGlow('rgba(61, 220, 151, .22)');
  show('rbQBox', true);
  setQ({ note: t.s.jug[i], q: t.s.q, opts: t.s.o, pick: K.pick, right: TSR[i], locked: rev, revealed: rev,
    fb: rev && K.shown ? t.s.why[i] : '', next: rev && K.shown ? (i < 2 ? t.next : t.again) : '' });
  const dots = [0, 1, 2].map((k) => (k < i || (k === i && K.shown) ? '●' : k === i ? '◉' : '○')).join(' ');
  lab.setReadout(rev ? t.s.share(tj, tj + tw) : '?', dots, '', C.green);
  card('taste', K.fin);
}

startIntro();
</script>
