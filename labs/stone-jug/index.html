function addSplash(J, x, y, n = 9) {

    J.sp.push({ x: x + (Math.random() - 0.5) * 12, y, vx: Math.cos(a) * s * 0.6, vy: Math.sin(a) * s, life: 0, max: 0.7 + Math.random() * 0.25, r: 1.8 + Math.random() * 1.6 });

}
function drawSplash(c, J) {
  for (const p of J.sp) {

    c.fillStyle = '#fff'; c.beginPath(); c.arc(p.x - 0.5, p.y - 0.5, Math.max(0, p.r * 0.4), 0, 7); c.fill(); c.restore();
  }

  c.beginPath(); c.ellipse(0, 0, 22, 14, 0, 0, 7); c.fillStyle = bg; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#0b0c12'; c.stroke();
  c.strokeStyle = 'rgba(120,160,230,.55)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-10, -6); c.quadraticCurveTo(0, -10, 10, -4); c.stroke(); c.restore();
  c.beginPath(); c.moveTo(bx - 14, by - 6); c.quadraticCurveTo(g.cx + 14, g.top - 46, hx + 3, hy - 4);
  c.lineWidth = 13; c.strokeStyle = '#1b1e29'; c.stroke(); c.lineWidth = 11; c.strokeStyle = '#2a2e3f'; c.stroke();
  const hg = c.createRadialGradient(hx - 3, hy - 3, 1, hx, hy, 11); hg.addColorStop(0, '#4a5068'); hg.addColorStop(1, '#11131b');
  c.beginPath(); c.arc(hx, hy, 9, 0, 7); c.fillStyle = hg; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#0b0c12'; c.stroke();
  c.beginPath(); c.moveTo(hx - 5, hy - 2); c.lineTo(hx - 11, hy + 13); c.lineTo(hx + 1, hy + 5); c.closePath(); c.fillStyle = '#3a3d4c'; c.fill(); c.stroke();
  c.beginPath(); c.arc(hx + 1.5, hy - 3, 3, 0, 7); c.fillStyle = '#fff'; c.fill(); c.beginPath(); c.arc(hx + 2, hy - 2.6, 1.5, 0, 7); c.fillStyle = '#0b0c12'; c.fill();
  c.restore();
}

// --- secret: Archimedes' crown ------------------------------------------------------------------------------------------------------------------
function sceneCrown(c, dt, t) {
  const tt = T[lang], jw = Math.min(100, W * 0.27), jh = H * 0.54, jbase = H * 0.82;
  wall(c, jbase - H * 0.2);
  const cols = [W * 0.3, W * 0.7];
  S.rJ.forEach((J, i) => {
    const g = jugGeom(cols[i], jbase, jw, jh, 200, 20, 40);
    if (J.obj && J.obj.st === 'hold') { J.obj.x = cols[i]; J.obj.y = g.top - 64; }
    stepJug(J, g, dt);
    drawJug(c, g, J, t, { baseLine: true });
    drawSplash(c, J);
    if (J.obj && J.obj.st === 'hold') pill(c, `1000 ${tt.g}`, cols[i], g.top - 100);
    drawBracketDuel(c, g, J);
  });
  if (S.rDropped && !S.rDone && S.rJ.every((J) => J.obj && J.obj.st === 'rest' && Math.abs(J.tgt - J.lvl) < 0.3)) { S.rDone = true; render(); }
}

// --- the canvas loop ------------------------------------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, t) => {
  W = w; H = h;
  if (S.sec === 'crow') return sceneCrow(c, dt, t);
  if (S.sec === 'crown') return sceneCrown(c, dt, t);
  const v = lab.view;
  if (v === 'glasses') sceneGlasses(c, dt, t);
  else if (v === 'jug') { if (S.jMode === 'predict') balance(c, t); else if (S.jMode === 'duel') duel(c, dt, t); else play(c, dt, t); }
  else sceneGuess(c, dt, t);
});

// --- dragging things into the jug ---------------------------------------------------------------------------------------------------------------------------
const cv = $('cv');
const pt = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'jug' || S.jMode !== 'play') return;
  const [x, y] = pt(ev), it = S.tray.find((q) => Math.abs(q.x - x) < 36 && y > q.y - 30);
  if (!it) return;
  S.drag = { kind: it.k, x, y, sx: x, sy: y, moved: false };
  try { cv.setPointerCapture(ev.pointerId); } catch { /* ok */ }
});
cv.addEventListener('pointermove', (ev) => {
  if (!S.drag) return;
  const [x, y] = pt(ev); S.drag.x = x; S.drag.y = y;
  if (Math.hypot(x - S.drag.sx, y - S.drag.sy) > 8) S.drag.moved = true;
});
const endDrag = (ev, cancel) => {
  const d = S.drag; if (!d) return; S.drag = null;
  if (cancel) return;
  const g = S.pg || playGeom();
  if (!d.moved || (d.x > g.x0 - 36 && d.x < g.x1 + 36 && d.y < g.base)) dropObj(d.kind, d.moved ? d.x : g.cx);
};
cv.addEventListener('pointerup', (ev) => endDrag(ev, false));
cv.addEventListener('pointercancel', (ev) => endDrag(ev, true));

// --- controls ------------------------------------------------------------------------------------------------------------------------------------------------
const chip = (act, label, data = '', on = false) => `<button class="chip${on ? ' on' : ''}" data-act="${act}" ${data}>${esc(label)}</button>`;
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, d = b.dataset;
  if (act === 'gpick') { S.gGuess = d.v; S.gStart = clock(); S.gDone = false; sfx.click(); showStage(); }
  else if (act === 'gpair') { S.gp = +d.i; S.gGuess = null; S.gStart = null; S.gDone = false; sfx.click(); }
  else if (act === 'greplay') { S.gStart = clock(); S.gDone = false; sfx.click(); }
  else if (act === 'jpick') { S.jGuess = d.v; S.jMode = 'duel'; S.dJ = [mkJug(500), mkJug(500)]; S.dStart = clock(); S.dDone = false; sfx.click(); showStage(); }
  else if (act === 'jtry') { S.jMode = 'play'; S.pJ = mkJug(500); S.pKind = null; sfx.click(); }
  else if (act === 'jagain') { S.jMode = 'predict'; S.jGuess = null; S.jT0 = clock(); sfx.click(); }
  else if (act === 'take') takeOut();
  else if (act === 'tg') { S.gt = +d.i; S.guStart = null; S.guDone = false; S.guLv = 0; sfx.click(); }
  else if (act === 'pour') { S.guStart = clock(); S.guDone = false; S.guLv = 0; sfx.click(); showStage(); }
  else if (act === 'guagain') { S.guStart = null; S.guDone = false; S.guLv = 0; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === d.k ? null : d.k;
    if (S.sec === 'crow') resetCrow(); else if (S.sec === 'crown') { S.rDone = false; resetCrown(); }
    sfx.click();
  }
  else if (act === 'pebble') { if (S.cDone) return; const g = jugGeom(W * 0.42, H * 0.84, Math.min(74, W * 0.22), H * 0.62, 600, 50, 100);
    const x = g.cx + (Math.random() - 0.5) * 16; S.cP.push({ x, rx: x, y: g.top - 50, vy: 0, st: 'fall', i: 0 }); sfx.click(); }
  else if (act === 'creset') { resetCrow(); sfx.click(); }
  else if (act === 'cmode') { S.rMode = d.m; S.rDone = false; resetCrown(); sfx.click(); }
  else if (act === 'drop2') { if (S.rDropped) return; S.rDropped = true; S.rJ.forEach((J) => { if (J.obj) J.obj.go = true; }); sfx.click(); }
  else if (act === 'rreset') { S.rDone = false; resetCrown(); sfx.click(); }
  render();
});
$('gs').addEventListener('input', () => { S.gu[S.gt] = +$('gs').value; sfx.tick(); render(); });

// --- one render per change: controls, readout, state card and facts ----------------------------------------------------------------------------------------------
function secChips(t) {
  const u = secret.unlocked();
  return [['crow', '🐦‍⬛', t.secrets.a[0]], ['crown', '👑', t.secrets.b[0]]].map(([k, e, name]) =>
    `<button class="chip secret${u ? ' open' : ''}${S.sec === k ? ' on' : ''}" data-act="sec" data-k="${k}">${u ? e : '🔒'} ${esc(name)}</button>`).join('');
}
function render() {
  const t = T[lang], v = lab.view, ml = ` ${t.ml}`;
  let val = '', sub = '', st = null, prompt = '', dyn = '', facts = t.facts[v] || [];
  const showGu = !S.sec && v === 'guess';
  if (S.sec === 'crow') {
    const lvl = 200 + 40 * S.cCount;
    val = `${t.pebbles}: ${S.cCount}`; sub = `${t.water} ${lvl}${ml}`;
    st = S.cDone ? { emo: '🐦‍⬛', title: t.crowDone, lead: t.crowLead(S.cCount), body: t.crowBody }
      : { emo: '🐦‍⬛', title: t.secrets.a[0], lead: t.secrets.a[1], body: t.crowWait };
    dyn = `<div class="sj-row">${`<button class="btn" data-act="pebble"${S.cDone ? ' disabled' : ''}>${esc(t.drop)}</button>`}${chip('creset', t.reset)}</div>`;
  } else if (S.sec === 'crown') {
    const mix = S.rMode === 'mix', c2 = mix ? 65 : 52;
    val = S.rDropped ? `${t.barName} +52${ml} · ${t.crownName} +${c2}${ml}` : `1000 ${t.g} · 1000 ${t.g}`; sub = '';
    st = S.rDone ? { emo: '👑', title: mix ? t.crownMixT : t.crownPureT, lead: mix ? t.crownMixR : t.crownPureR, body: '' }
      : { emo: '👑', title: t.secrets.b[0], lead: t.secrets.b[1], body: t.crownWait };
    dyn = `<div class="sj-row">${chip('cmode', t.crownPure, 'data-m="pure"', !mix)}${chip('cmode', t.crownMix, 'data-m="mix"', mix)}</div>
      <div class="sj-row"><button class="btn" data-act="drop2"${S.rDropped ? ' disabled' : ''}>${esc(t.dropBoth)}</button>${chip('rreset', t.reset)}</div>`;
  } else if (v === 'glasses') {
    const P = PAIRS[S.gp], A = t.vs[P.a], B = t.vs[P.b], op = P.ml[0] === P.ml[1] ? '=' : P.ml[0] < P.ml[1] ? '<' : '>';
    if (S.gGuess == null) {
      val = '? · ?';
      st = { emo: '🥤', title: t.gPre[0], lead: t.gPre[1], body: t.gPre[2] };
      prompt = `<p class="sj-q">${esc(t.gAsk)}</p><div class="sj-opts">${chip('gpick', A, 'data-v="a"')}${chip('gpick', B, 'data-v="b"')}${chip('gpick', t.same, 'data-v="same"')}</div>`;
    } else if (!S.gDone) {
      val = '? · ?'; st = { emo: '🥤', title: t.gPouring[0], lead: t.gPouring[1], body: '' };
      prompt = `<p class="sj-q">${esc(t.gAsk)}</p>`;
    } else {
      const ok = S.gGuess === P.ok;
      val = `${P.ml[0]}${ml} ${op} ${P.ml[1]}${ml}`;
      st = { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notQuite, lead: t.gRes[S.gp], body: t.gBody };
      dyn = `<div class="sj-row">${chip('greplay', t.replay)}</div><div class="sj-row"><span class="sj-lbl">${esc(t.otherPair)}</span>${t.pairs.map((n, i) => chip('gpair', n, `data-i="${i}"`, i === S.gp)).join('')}</div>`;
    }
  } else if (v === 'jug') {
    if (S.jMode === 'predict') {
      val = `200 ${t.g} · 200 ${t.g}`;
      st = { emo: '⚖️', title: t.jPre[0], lead: t.jPre[1], body: t.jPre[2] };
      prompt = `<p class="sj-q">${esc(t.jAsk)}</p><div class="sj-opts">${chip('jpick', t.jOpts.ball, 'data-v="ball"')}${chip('jpick', t.jOpts.big, 'data-v="big"')}${chip('jpick', t.same, 'data-v="same"')}</div>`;
    } else if (S.jMode === 'duel') {
      val = '500' + ml; sub = '';
      if (!S.dDone) { st = { emo: '💦', title: t.jDuel[0], lead: t.jDuel[1], body: '' }; prompt = `<p class="sj-q">${esc(t.jAsk)}</p>`; }
      else {
        const ok = S.jGuess === 'big'; val = `+25${ml} · +75${ml}`;
        st = { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notQuite, lead: t.jRes, body: t.jBody };
        dyn = `<div class="sj-row"><button class="btn" data-act="jtry">${esc(t.jTry)}</button>${chip('jagain', t.jAgain)}</div>`;
      }
    } else {
      const J = S.pJ, o = J.obj, k = S.pKind;
      if (k && o) {
        val = t.jRead(t.names[k], J.base + OBJ[k].vol, OBJ[k].vol); sub = '';
        st = { emo: '🫙', title: cap(t.names[k]), lead: t.jItem(OBJ[k].g, OBJ[k].vol), body: t.jMore };
      } else { val = t.jIdle[0]; sub = t.jIdle[1]; st = { emo: '🫙', title: t.jPlay[0], lead: t.jPlay[1], body: t.jPlay[2] }; }
      dyn = `<div class="sj-row"><button class="btn" data-act="take"${k && o ? '' : ' disabled'}>${esc(t.take)}</button>${chip('jagain', t.jAgain)}</div>`;
    }
  } else {
    const k = S.gt, n = GU[k].n, g = S.gu[k];
    if (!S.guDone) { val = String(g); sub = t.yourGuess; st = S.guStart == null ? { emo: '🥛', title: t.guPre[0], lead: t.guQ[k], body: t.guPre[1] } : { emo: '🥛', title: t.guPouring[0], lead: t.guPouring[1], body: '' }; }
    else {
      const diff = Math.abs(g - n) / n, ok = g === n;
      val = t.guRead(g, n); sub = t.guSub;
      st = { emo: ok ? '✅' : diff <= 0.25 ? '👍' : '🤔', title: ok ? t.right : diff <= 0.25 ? t.close : t.notQuite, lead: t.guRes[k], body: '' };
    }
    prompt = `<p class="sj-q">${esc(t.guQ[k])}</p><div class="sj-opts" style="margin-bottom:12px">${t.guNames.map((nm, i) => chip('tg', nm, `data-i="${i}"`, i === k)).join('')}</div>`;
    dyn = S.guDone ? `<div class="sj-row">${chip('guagain', t.again)}</div>`
      : `<div class="sj-row"><button class="btn" data-act="pour"${S.guStart != null ? ' disabled' : ''}>${esc(t.pour)}</button></div>`;
    facts = S.guSeen ? facts : [];
    $('gsLbl').textContent = t.yourGuess; $('gsVal').textContent = String(g);
    const sl = $('gs'); sl.max = GU[k].max; sl.value = g; sl.disabled = S.guStart != null;
  }
  $('guBox').hidden = !showGu;
  $('sjPrompt').innerHTML = S.sec ? '' : prompt;
  $('dyn').innerHTML = dyn;
  $('secRow').innerHTML = secChips(t);
  lab.setReadout(val, sub, '');
  lab.setState(st);
  lab.setFacts(facts);
}
render();
</script>
</body>
</html>
