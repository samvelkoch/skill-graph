    <div class="bk-opts">${S.opts.map((o) => `<button class="bk-opt ${rev ? (o.k === 'ok' ? 'ok' : o.k === pick ? 'no' : '') : ''}" data-act="pick" data-k="${o.k}"${rev ? ' disabled' : ''}>${esc(o.s)}</button>`).join('')}</div>
    ${rev ? `<div class="bk-fb">${verdict(pick === 'ok', t)}${esc(t.exCut(a, b))}</div><div class="bk-act"><button class="btn" data-act="recut">${esc(t.cutBtn)}</button></div>` : ''}`;
  lab.setReadout(rev ? lin(a, a * b) : '?', t.area, t.xLabel(S.x), BLUE);
  const [ti, le] = t.state[S.cutOk >= 3 ? 'cut3' : 'cut0'];
  lab.setState({ emo: S.cutOk >= 3 ? '💡' : '🔪', title: ti, lead: le, body: '', extra: '' });
}

function renderCheck(t) {
  const rows = S.rival === null ? [] : (S.log[S.rival] ?? []);
  lab.setGlow('rgba(240, 166, 64, .24)');
  $('rivRow').innerHTML = RIV.map((r, i) => `<button class="bk-opt ${S.rival === i ? 'sel' : ''}" data-act="riv" data-i="${i}">${esc(lin(r.k, r.c))}</button>`).join('');
  setSlider('xSl1', 'xLab1', S.cx, 1, 10, t);
  const running = !!S.run && !S.run.logged;
  const diffs = rows.map((r) => r.L - r.R), constD = rows.length >= 2 && diffs.every((d) => d === diffs[0]) && diffs[0] !== 0 ? diffs[0] : null;
  const exShow = S.rival === 0 && rows.length >= 3 && constD !== null;
  let html = '';
  if (S.rival === null) html += `<p class="bk-hint">${esc(t.pickRival)}</p>`;
  if (S.asking) html += `<div class="bk-q">${esc(t.cmpQ)}</div><div class="bk-opts"><button class="bk-opt" data-act="ans" data-v="yes">${esc(t.yes)}</button><button class="bk-opt" data-act="ans" data-v="no">${esc(t.no)}</button></div>`;
  else html += `<div class="bk-act"><button class="btn" data-act="run"${S.rival === null || running ? ' disabled' : ''}>${esc(t.run)}</button></div>`;
  if (S.fb) html += `<div class="bk-fb">${verdict(S.fb.ok, t)}</div>`;
  if (exShow) html += `<div class="bk-fb">${esc(t.exCheck)}</div>`;
  if (rows.length) html += `<div class="bk-tbl"><div class="cap">${esc(t.table)}</div><div class="rows"><div class="r h">${t.cols.map((x) => `<span>${esc(x)}</span>`).join('')}</div>
    ${rows.map((r) => `<div class="r"><span>${r.x}</span><span>${r.L}</span><span>${r.R}</span><span class="${r.ok ? 'y' : 'n'}">${r.ok ? '✓' : '✗'}</span></div>`).join('')}</div></div>`;
  $('chkBox').innerHTML = html;
  lab.setReadout(esc(t.tries(rows.length)), t.table, constD !== null ? t.diff(constD) : '', '#f0a640');
  const done = Object.values(S.log).some((rs) => rs.some((r) => !r.ok));
  const [ti, le] = t.state[done ? 'checkDone' : 'check0'];
  lab.setState({ emo: done ? '💡' : '🔢', title: ti, lead: le, body: '', extra: '' });
}

function renderMinus(t) {
  const inn = S.mmode === 'in', q = S.mq[S.mmode], rev = q.pick !== null;
  lab.setGlow('rgba(229, 72, 77, .22)');
  $('mmRow').innerHTML = ['in', 'out'].map((m) => `<button class="bk-opt sm ${S.mmode === m ? 'sel' : ''}" data-act="mmode" data-m="${m}">${esc(t.minusModes[m])}</button>`).join('');
  $('mxRow').hidden = !inn;
  setSlider('xSl2', 'xLab2', S.mx, 2, 10, t);
  $('minBox').innerHTML = `<div class="bk-q">${esc(inn ? t.minusInQ : t.minusOutQ)}</div>
    <div class="bk-opts">${q.opts.map((o) => `<button class="bk-opt ${rev ? (o.k === 'ok' ? 'ok' : o.k === q.pick ? 'no' : '') : ''}" data-act="mpick" data-k="${o.k}"${rev ? ' disabled' : ''}>${esc(o.s)}</button>`).join('')}</div>
    ${rev ? `<div class="bk-fb">${verdict(q.pick === 'ok', t)}${esc(inn ? t.exMinusIn : t.exMinus)}</div><div class="bk-act"><button class="btn" data-act="mre">${esc(t.cutBtn)}</button></div>` : ''}`;
  lab.setReadout(rev ? (inn ? '4x − 4' : '−2x + 8') : '?', t.expanded, rev ? t.signRule[inn ? 'pm' : 'mm'] : '', '#e5484d');
  const done = S.mq.out.pick !== null;
  const [ti, le] = t.state[done ? 'minusDone' : 'minus0'];
  lab.setState({ emo: done ? '💡' : '➖', title: ti, lead: le, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
}

function renderTrick(t) {
  const T_ = S.tr, i = T_.i, it = TR[i], done = T_.done[i];
  lab.setGlow('rgba(61, 220, 151, .22)');
  const names = [`${TR[0].a} × ${TR[0].base + TR[0].d}`, ...t.trickQs];
  let html = `<div class="bk-opts">${names.map((n, j) => `<button class="bk-opt sm ${j === i ? 'sel' : ''}" data-act="tq" data-i="${j}">${esc(n)}</button>`).join('')}</div>`;
  if (i === 0) html += `<div class="bk-act"><button class="btn" data-act="tcut">${esc(t.cutBtn)}</button></div>`;
  else {
    html += `<div class="bk-q">${esc(names[i])} = ?</div><div class="bk-opts">${T_.opts[i].map((v) => {
      const bad = T_.bad[i].includes(v), good = done && v === it.a * (it.base + it.d);
      return `<button class="bk-opt ${good ? 'ok' : bad ? 'no' : ''}" data-act="tans" data-v="${v}"${bad || done ? ' disabled' : ''}>${v}</button>`;
    }).join('')}</div>`;
    if (done) html += `<div class="bk-fb">${verdict(true, t)}</div>`;
  }
  $('vTrick').innerHTML = html;
  lab.setReadout(done ? String(it.a * (it.base + it.d)) : '?', `${it.a} × ${it.base + it.d}`, '', '#3ddc97');
  const any = T_.done[0];
  lab.setState({ emo: '🧠', title: t.secrets.trick[0], lead: any ? t.secretA : t.secrets.trick[1], body: '', extra: '' });
}

function renderBack(t) {
  const B = S.bk, ok = B.bh === 3 && B.shown;
  lab.setGlow('rgba(240, 166, 64, .24)');
  $('vBack').innerHTML = `<div class="bk-q">${esc(t.pickHeight)}</div><div class="bk-opts">${[2, 3, 6].map((h) => `<button class="bk-opt ${B.bh === h ? 'sel' : ''}" data-act="bh" data-h="${h}">${h}</button>`).join('')}</div>
    ${B.bh !== null && B.shown ? `<div class="bk-fb">${verdict(B.bh === 3, t)}</div>` : ''}`;
  lab.setReadout(ok ? '3(2x + 3)' : '6x + 9', '', '', '#f0a640');
  lab.setState({ emo: '↩️', title: t.secrets.back[0], lead: ok ? t.secretB : t.secrets.back[1], body: '', extra: '' });
}
render();
</script>
</body>
</html>
