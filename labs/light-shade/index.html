    lamps = [mkLamp(lvec(S.a), 1, WARM)];
    if (S.two && !ask) { const a2 = secondA(S.a); lamps.push(mkLamp(lvec(a2), 0.38, COOL)); shadows = [1, 0.5]; }
  } else {
    lamps = [mkLamp(lvec(S.flatA), 1, WARM)];
    fl = { light: S.lvl >= 1, dark: S.lvl >= 2, core: S.lvl >= 3, refl: S.lvl >= 4 }; shadows = S.lvl >= 5 ? [1] : null;
  }
  const lampPos = (l, i) => (face ? arcAt(S.faceA) : i === 0 ? arcAt(view === 'find' ? S.f.t : view === 'move' ? S.a : S.flatA) : arcAt(secondA(S.a)));
  backdrop(c, w, hh, hy, glowA > 0.01 ? lamps.map((l, i) => ({ p: lampPos(l, i), col: l.col, I: l.I, a: glowA })) : [], !face);

  if (!face) {                                      // the track the lamp rides on
    c.save(); c.setLineDash([3, 8]); c.lineCap = 'round'; c.strokeStyle = 'rgba(255,236,190,.28)'; c.lineWidth = 1.6;
    c.beginPath(); c.arc(cx, ay, Math.max(0, Ra), Math.PI, 2 * Math.PI); c.stroke(); c.restore();
  }

  const res = face
    ? drawObj(c, { kind: 'face', cx, oy: ay, R, lamps, fl, shadows: null, outline: true })
    : drawObj(c, { kind: S.kind, cx, TY, R, lamps, fl, shadows, pencil: view === 'flat' && S.pencil, outline: view !== 'flat' });
  if (view === 'move' && S.labels && !ask && !face) drawLabels(c, { cx, oy: TY + OBJ[S.kind].base * R, R }, res);

  // lamps on top
  if (face) lampIcon(c, ...arcAt(S.faceA), 1, false, false, time);
  else if (view === 'find') {
    const f = S.f;
    if (f.done) {
      const a0 = Math.min(f.g, f.t), a1 = Math.max(f.g, f.t), col = f.ok ? '#3ddc97' : '#f5c84c';
      c.save(); c.globalAlpha = f.rev; c.lineCap = 'round'; c.strokeStyle = col; c.lineWidth = 5;
      c.beginPath(); c.arc(cx, ay, Math.max(0, Ra), Math.PI + a0 * D2R, Math.PI + a1 * D2R); c.stroke(); c.restore();
      const mid = arcAt((a0 + a1) / 2, Ra + 30);
      c.save(); c.globalAlpha = f.rev; pill(c, T[lang].find.off(f.err), mid[0], mid[1], { stroke: col }); c.restore();
      lampIcon(c, ...arcAt(f.t), f.rev, false, false, time);
      lampIcon(c, ...arcAt(f.g), 0.55, false, false, time);
    } else lampIcon(c, ...arcAt(f.g ?? 90), 0.78, false, true, time);
  } else {
    const a = view === 'move' ? S.a : S.flatA, drag = view === 'move' ? S.mv[S.kind] === 2 : S.fl === 2;
    lampIcon(c, ...arcAt(a), 1, false, drag && !S.slide && (view === 'move' ? !S.touched : !S.touchedF), time);
    if (view === 'move' && S.two && !ask) lampIcon(c, ...arcAt(secondA(S.a)), 0.85, true, false, time);
  }
  c.restore();
  c.save(); c.beginPath(); c.roundRect(0.5, 0.5, w - 1, hh - 1, 18); c.strokeStyle = 'rgba(130,145,190,.25)'; c.lineWidth = 1; c.stroke(); c.restore();
});

// --- dragging the lamp ---------------------------------------------------------------------------------------
const cv = $('cv');
let drag = false;
const canDrag = () => {
  if (S.face) return false;
  const v = lab.view;
  return v === 'find' ? !S.f.done : v === 'move' ? S.mv[S.kind] === 2 : S.fl === 2;
};
function angleAt(ev) {
  const r = cv.getBoundingClientRect(), dx = ev.clientX - r.left - G.cx, dy = G.ay - (ev.clientY - r.top);
  let a = Math.atan2(dy, -dx) / D2R; if (a < 0) a = dx < 0 ? 0 : 180;
  return clamp(a, 5, 175);
}
function moveTo(ev) {
  const a = angleAt(ev), v = lab.view;
  if (v === 'find') { const first = S.f.g === null; S.f.g = a; if (first) render(); }
  else if (v === 'move') { S.a = S.aT = a; S.slide = false; S.touched = true; }
  else { S.flatA = a; S.touchedF = true; }
}
cv.addEventListener('pointerdown', (ev) => { if (!canDrag()) return; drag = true; cv.setPointerCapture(ev.pointerId); moveTo(ev); });
cv.addEventListener('pointermove', (ev) => { if (drag) moveTo(ev); });
const endDrag = () => { drag = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function mainBtn() {
  const f = S.f;
  if (!f.done) {
    if (f.g === null) return;
    f.done = true; f.rev = 0; f.err = Math.round(Math.abs(f.g - f.t)); f.ok = f.err <= 25;
    S.hist = [...S.hist, f.ok].slice(-5); (f.ok ? sfx.good : sfx.bad)(); showStage();
  } else { S.f = newRound(f.t); sfx.click(); }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = b.dataset.k;
  if (act === 'obj') {
    S.kind = k; S.face = false; sfx.click();
    if (lab.view === 'move' && S.mv[k] === 0) { S.a = S.aT = 90; S.slide = false; }
  } else if (act === 'main') mainBtn();
  else if (act === 'labels') { S.labels = !S.labels; sfx.click(); }
  else if (act === 'pencil') { S.pencil = !S.pencil; sfx.click(); }
  else if (act === 'step') { const n = +k; S.lvl = S.lvl === n ? n - 1 : n; sfx.click(); }
  else if (act === 'flip') { S.faceT = S.faceT > 0 ? -90 : 90; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (lab.view !== 'move') { lab.view = 'move'; lab.renderChrome(); }
    S.mv[S.kind] = 2; S.slide = false;
    if (k === 'a') { S.two = !S.two; if (S.two) S.face = false; }
    else if (S.face) S.face = false;
    else { S.face = true; S.two = false; S.faceA = 90; S.faceT = 90; setTimeout(() => { if (S.face) S.faceT = -90; }, 600); }
    sfx.click();
  }
  render();
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const v = lab.view;
  if (b.dataset.a !== undefined) {
    const ok = +b.dataset.a === 0;
    if (v === 'move') { S.mv[S.kind] = 1; S.mvOk = ok; S.aT = 40; S.slide = true; } else { S.fl = 1; S.flOk = ok; }
    (ok ? sfx.good : sfx.bad)(); showStage();
  } else { if (v === 'move') S.mv[S.kind] = 2; else { S.fl = 2; S.lvl = 0; } sfx.click(); }
  render();
});

// --- readout, state card, controls: one render per change --------------------------------------------------
const histStr = () => (S.hist.length ? `${T[lang].last}: ${S.hist.map((x) => (x ? '✓' : '✗')).join(' ')}` : '');
function readout() {
  const t = T[lang], v = lab.view; let val, sub = '', pill = '';
  if (v === 'find') {
    const f = S.f; sub = histStr();
    if (!f.done) val = '?'; else { val = t.find.off(f.err); pill = f.ok ? '✓' : ''; }
  } else if (v === 'move') {
    if (S.face) { val = S.faceT < 0 ? '🎃' : '🙂'; sub = (S.faceT < 0 ? t.face.b : t.face.a)[0]; }
    else if (S.mv[S.kind] === 0) val = '?';
    else if (S.two) val = `${Math.round(S.a)}° · ${Math.round(secondA(S.a))}°`;
    else { val = `${Math.round(S.a)}°`; sub = t.angle; pill = t.move.sh[shadowDir()]; }
  } else if (S.fl < 2) val = '?';
  else { val = `${S.lvl}/5`; sub = S.lvl ? t.flat.steps[S.lvl - 1] : ''; }
  const key = [val, sub, pill].join('|');
  if (key !== lastRO) { lastRO = key; lab.setReadout(val, sub, pill, '#f2b45a'); }
}

function render() {
  const t = T[lang], v = lab.view, ask = asking(), open = secret.unlocked();
  document.body.dataset.v = ask ? 'ask' : v;
  lab.setGlow('rgba(255, 190, 110, .26)');
  $('lsFind').style.display = v === 'find' ? '' : 'none';
  $('lsMove').style.display = v === 'move' && !ask && !S.face ? '' : 'none';
  $('lsFlat').style.display = v === 'flat' && !ask ? '' : 'none';
  $('lsQ').textContent = t.find.q;
  $('lsMain').textContent = S.f.done ? t.again : t.check; $('lsMain').disabled = !S.f.done && S.f.g === null;
  $('lsScore').textContent = histStr();
  $('lsLab').textContent = `🏷️ ${t.labels}`; $('lsLab').classList.toggle('on', S.labels);
  $('lsPen').textContent = `✏️ ${t.pencil}`; $('lsPen').classList.toggle('on', S.pencil);
  $('lsSteps').innerHTML = t.flat.steps.map((s, i) => `<button class="chip ls-c ${S.lvl > i ? 'on' : ''}" data-act="step" data-k="${i + 1}">${i + 1} · ${esc(s)}</button>`).join('');
  $('lsObj').innerHTML = OBJS.map(([k, e], i) => `<button class="chip ls-c ${S.kind === k && !S.face ? 'on' : ''}" data-act="obj" data-k="${k}">${e} ${esc(t.obj[i])}</button>`).join('');
  const sc = (k, emo, name, on) => `<button class="chip ls-c secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(name)}` : '🔒 ???'}</button>`;
  $('lsSec').innerHTML = sc('a', '💡💡', t.secrets.a[0], S.two) + sc('b', '🎃', t.secrets.b[0], S.face)
    + (S.face ? `<button class="chip ls-c" data-act="flip">${S.faceT < 0 ? '☝️ ' + esc(t.face.a[0]) : '👇 ' + esc(t.face.b[0])}</button>` : '');

  // the question card (move / flat) and its verdict
  askEl.style.display = ask ? '' : 'none';
  let st;
  if (v === 'find') {
    const f = S.f;
    st = !f.done ? { emo: '🔦', title: t.find.s0[0], lead: t.find.s0[1], body: '' }
      : { emo: f.ok ? '✅' : '🤔', title: f.ok ? t.find.ok : t.find.no, lead: t.find.s1, body: t.find.off(f.err) };
  } else if (v === 'move') {
    const ph = S.mv[S.kind], m = t.move;
    if (S.face) { const fb = S.faceT < 0 ? t.face.b : t.face.a; st = { emo: S.faceT < 0 ? '🎃' : '🙂', title: fb[0], lead: fb[1], body: '' }; }
    else if (ph === 0) st = { emo: '🤔', title: m.q, lead: '', body: '' };
    else if (ph === 1) { const r = S.mvOk ? m.ok : m.no; st = { emo: S.mvOk ? '✅' : '🤔', title: r[0], lead: r[1], body: '' }; }
    else if (S.two) st = { emo: '💡💡', title: t.secrets.a[0], lead: t.secrets.a[1], body: '' };
    else if (S.labels) st = { emo: '🏷️', title: m.lab, lead: t.parts.join(' · '), body: '' };
    else st = { emo: '💡', title: m.s[0], lead: m.s[1], body: m.s[2] };
    if (ph === 0 && !S.face) askEl.innerHTML = `<div class="q">${esc(m.q)}</div><div class="opts">${[1, 0, 2].map((j) => `<button data-a="${j}">${esc(m.opts[j])}</button>`).join('')}</div>`;
    else if (ph === 1 && !S.face) { const r = S.mvOk ? m.ok : m.no; askEl.innerHTML = `<div class="v" style="color:${S.mvOk ? 'var(--ok)' : 'var(--wip)'}">${esc(r[0])}</div><p>${esc(r[1])}</p><div class="opts"><button data-go="1">${esc(t.go)} →</button></div>`; }
  } else {
    const f = t.flat;
    if (S.fl === 0) { st = { emo: '🤔', title: f.q, lead: '', body: '' }; askEl.innerHTML = `<div class="q">${esc(f.q)}</div><div class="opts">${[1, 0, 2].map((j) => `<button data-a="${j}">${esc(f.opts[j])}</button>`).join('')}</div>`; }
    else if (S.fl === 1) {
      const r = S.flOk ? f.ok : f.no; st = { emo: S.flOk ? '✅' : '🤔', title: r[0], lead: r[1], body: '' };
      askEl.innerHTML = `<div class="v" style="color:${S.flOk ? 'var(--ok)' : 'var(--wip)'}">${esc(r[0])}</div><p>${esc(r[1])}</p><div class="opts"><button data-go="1">${esc(f.build)} →</button></div>`;
    } else st = S.lvl ? { emo: '🎨', title: `${S.lvl} · ${f.steps[S.lvl - 1]}`, lead: f.tx[S.lvl - 1], body: '' } : { emo: '⬜', title: f.s0[0], lead: f.s0[1], body: '' };
  }
  lab.setState({ ...st, extra: '' });
  lab.setFacts(t.facts[v]);
  readout();
}
render();
</script>
</body>
