}

}

canvasLoop($('cv'), (c, w, h, dt, time) => {

$('cv').addEventListener('pointerdown', (ev) => {

  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.s, y = (ev.clientY - r.top - G.oy) / G.s;
  const list = lab.view === 'sort' ? F : lab.view === 'live' && S.guess === null ? SP : [];
  let best = null, bd = 1e9;
  for (const f of list) { const d = Math.hypot(f.x - x, f.y - y); if (d <= f.r && d < bd) { bd = d; best = f; } }
  if (!best) return;

function pickSpot(id) {

$('ctrlBody').addEventListener('click', (ev) => {

  const q = t.live, g = S.guess, y = S.yr, h = housesAt(y), st = stageAt(y);
  $('obSpots').style.display = g === null ? 'flex' : 'none';
  $('obTime').style.display = g === null ? 'none' : 'block';
  if (g === null) {
    $('obSpots').innerHTML = Object.entries(q.spots).map(([k, l]) => `<button class="chip ob-c" type="button" data-spot="${k}">${esc(l)}</button>`).join('');
    lab.setReadout('?', '', '', '#e0b050');
    lab.setState({ emo: '🤔', title: q.q, lead: q.lead, body: '', extra: '' });
    return;
  }
  $('obTLbl').textContent = q.tm; $('obTVal').textContent = q.yr(y);
  $('obE0').textContent = q.e0; $('obE1').textContent = q.e1;
  if (+$('obYr').value !== y) $('obYr').value = y;
  $('obYr').setAttribute('aria-label', q.tm);
  $('obPlay').textContent = S.play ? q.pause : q.play;
  lab.setReadout(String(y), q.unit, h ? q.houses(h) : '', '#e0b050');
  const [emo, title, lead] = q.st[st], first = y < 200 ? `${g === 'b' ? q.ok : q.no} ${q.why[g]}` : '';
  lab.setState({ emo, title, lead: first ? `${first} ${q.first}` : lead, body: y < 200 ? lead : '', extra: '' });
}
function renderChange(t) {
  lab.setGlow('rgba(78,168,255,.24)');
  const c = t.chg, k = S.pend, last = S.last;
  $('obQ').style.display = k ? '' : 'none';
  if (k) {
    $('obQ').textContent = c.q[k];
    $('obTog').innerHTML = c.opts[k].map((o, i) => `<button class="chip ob-c" type="button" data-pick="${i}">${esc(o)}</button>`).join('') + `<button class="chip ob-c" type="button" data-act="cancel">${esc(c.cancel)}</button>`;
  } else {
    $('obTog').innerHTML = ['dam', 'cut', 'city'].map((x) => `<button class="chip ob-c ${S[x] ? 'on' : ''}" type="button" data-tog="${x}">${esc(c.tog[x][S[x] ? 1 : 0])}</button>`).join('');
  }
  lab.setReadout(`🌲 ${forestPct()}%`, `${c.flow} ${flowPct()}% · ${c.town} ${townSize()}`, '', '#4ea8ff');
  if (k) lab.setState({ emo: '🤔', title: c.q[k], lead: c.guess, body: '', extra: '' });
  else if (last && last.off) lab.setState({ emo: '↩️', title: c.off[last.k][0], lead: c.off[last.k][1], body: '', extra: '' });
  else if (last) lab.setState({ emo: last.ok ? '✅' : '🤔', title: last.ok ? c.right : c.notq, lead: `${c.out[last.k]} ${c.why[last.k]}`, body: '', extra: '' });
  else if (S.dam || S.cut || S.city) lab.setState({ emo: '🏞️', title: c.someT, lead: c.someL, body: '', extra: '' });
  else lab.setState({ emo: '🏞️', title: c.noneT, lead: c.noneL, body: '', extra: '' });
}
render();
</script>
