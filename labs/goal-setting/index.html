      gg.addColorStop(0, lt(col, .55)); gg.addColorStop(1, col);
      c.save(); if (info.glow[i]) { c.shadowColor = col; c.shadowBlur = 16; }
      ci(c, x, y, r); c.fillStyle = gg; c.fill(); c.restore(); c.lineWidth = 1.6; c.strokeStyle = 'rgba(20,22,40,.7)'; ci(c, x, y, r); c.stroke();
      c.fillStyle = '#1b1c2e'; c.font = `900 ${Math.max(12, cell * .3)}px Nunito, sans-serif`; c.fillText(i + 1, x, y + 1);
    } else {
      ci(c, x, y, r); c.fillStyle = info.gap[i] ? 'rgba(241,194,74,.12)' : 'rgba(130,145,190,.09)'; c.fill();
      c.lineWidth = 1.4; c.strokeStyle = info.gap[i] ? 'rgba(241,194,74,.6)' : 'rgba(130,145,190,.35)'; c.setLineDash(info.gap[i] ? [3, 3] : []); c.stroke(); c.setLineDash([]);
      c.fillStyle = info.gap[i] ? '#f1c24a' : '#646c84'; c.font = `800 ${Math.max(12, cell * .28)}px Nunito, sans-serif`; c.fillText(info.gap[i] ? '↺' : i + 1, x, y + 1);
    }
  }
  if (info.hasGap) pillPx(c, T[lang].tr.back, w / 2, gy + cell * 4 + 22);
}
function renderTracker() {
  const t = T[lang], info = trInfo();
  lab.setReadout(`${info.n}/28`, t.tr.sub, t.tr.pill(info.longest), '#f1c24a');
  lab.setState({ emo: '🔗', title: t.tr.title(info.n), lead: info.hasGap ? t.tr.lGap : info.hasBrk ? t.tr.lBrk : t.tr.l0, body: '', extra: '' });
}

// --- the overlay card ---------------------------------------------------------------------------------------------
function askMode() {
  if (S.sec) return null;
  const v = lab.view;
  if (v === 'focus') return S.predGo[S.w] ? null : 'f';
  if (v === 'steps') {
    if (!S.p2go) return 'p2';
    if (S.wk === 3 && S.plan === null) return 'sb';
    if (S.plan === 'give') return 'gv';
    return null;
  }
  return 'j';
}
function renderAsk(mode, t) {
  askEl.style.display = mode ? '' : 'none';
  if (!mode) return;
  if (mode === 'f') {
    const wish = t.wishes[S.w], pr = S.pred[S.w], side = SHARP_SIDE[S.w], txt = { A: wish.pair[side === 'A' ? 1 : 0], B: wish.pair[side === 'B' ? 1 : 0] };
    if (pr === null) askEl.innerHTML = `<div class="q">${esc(t.f.q)}</div><div class="opts col">${['A', 'B'].map((k) => `<button class="long" data-x="pf:${k}"><b>${k}</b> · ${esc(txt[k])}</button>`).join('')}</div>`;
    else askEl.innerHTML = `<div class="verdict" style="color:${pr === side ? 'var(--ok)' : 'var(--wip)'}">${esc(pr === side ? t.f.ok : t.f.no)}</div><p>${esc(pr === side ? t.f.okT : t.f.noT)}</p><div class="opts"><button data-x="gof">${esc(t.f.go)}</button></div>`;
  } else if (mode === 'p2') {
    const pr = S.p2;
    if (pr === null) askEl.innerHTML = `<div class="q">${esc(t.s.q)}</div><div class="opts"><button data-x="p2:yes">${esc(t.s.yes)}</button><button data-x="p2:no">${esc(t.s.no)}</button></div>`;
    else askEl.innerHTML = `<div class="verdict" style="color:${pr === 'no' ? 'var(--ok)' : 'var(--wip)'}">${esc(pr === 'no' ? t.s.ok : t.s.nok)}</div><p>${esc(t.s.okT)}</p><div class="opts"><button data-x="go2">${esc(t.s.go)}</button></div>`;
  } else if (mode === 'sb') {
    askEl.innerHTML = `<div class="q">${esc(t.s.sbTitle(4, t.s.causes[S.cause]))}</div><p>${esc(t.s.sbLead)}</p><div class="opts col"><button class="long" data-x="sb:give">${esc(t.s.give)}</button><button class="long" data-x="sb:keep">${esc(t.s.keep)}</button><button class="long" data-x="sb:adjust">${esc(t.s.adj)}</button></div>`;
  } else if (mode === 'gv') {
    askEl.innerHTML = `<div class="verdict" style="color:var(--wip)">${esc(t.s.giveT(fm(cur())))}</div><p>${esc(t.s.giveL)}</p><div class="opts"><button data-x="retry">${esc(t.s.retry)}</button></div>`;
  } else if (mode === 'j') {
    if (S.ci >= 9) { const k = S.rights.filter(Boolean).length; askEl.innerHTML = `<div class="verdict" style="color:var(--ok)">${esc(t.j.end(k))}</div><p>${esc(t.j.endL)}</p>`; return; }
    askEl.innerHTML = `<div class="cnum">${esc(t.j.n(S.ci + 1))}</div><div class="cardtxt">${esc(t.j.cards[CARD_ORDER[S.ci]])}</div>${S.picked === null ? `<div class="fine">${esc(t.j.t)}</div>` : ''}`;
  }
}

// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const [k, a] = String(b.dataset.x).split(':');
  if (k === 'pf') { S.pred[S.w] = a; (a === SHARP_SIDE[S.w] ? sfx.good : sfx.bad)(); }
  else if (k === 'gof') { S.predGo[S.w] = true; sfx.click(); showStage(); }
  else if (k === 'p2') { S.p2 = a; (a === 'no' ? sfx.good : sfx.bad)(); }
  else if (k === 'go2') { S.p2go = true; sfx.click(); showStage(); }
  else if (k === 'sb') { S.plan = a; S.days = a === 'give' ? 0 : 2; sfx.click(); showStage(); }
  else if (k === 'retry') { S.plan = null; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-x]'); if (!b) return;
  const act = b.dataset.act, x = b.dataset.x;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) { S.sec = null; S.kplay = false; }
    else { S.sec = k; if (k === 'kz') { S.kd = 0; S.kplay = false; } }
    sfx.click(); render(); return;
  }
  if (x) {
    const [k, a] = x.split(':');
    if (k === 'wish') { S.w = +a; S.shotAt = -1; S.shotDone = false; sfx.click(); }
    else if (k === 'lv') { const [r, l] = a.split('.').map(Number); S.lv[S.w][r] = l; S.shotAt = -1; S.shotDone = false; sfx.tick(); }
    else if (k === 'day') { const n = +a; if (n <= capOf(S.wk + 1)) { S.days = n; sfx.tick(); } }
    else if (k === 'bk') pickBucket(+a);
    render(); return;
  }
  if (act === 'shoot') { if (S.lv[S.w].every((q) => q === 2)) { S.shotAt = nowS(); S.shotDone = true; sfx.push(); setTimeout(() => { sfx.good(); }, 900); showStage(); } }
  else if (act === 'fin') finishWeek();
  else if (act === 'nextc') { if (S.ci >= 9) { S.ci = 0; S.rights = []; S.stuck = [0, 0, 0]; } else if (S.picked !== null) S.ci++; S.picked = null; sfx.click(); }
  else if (act === 'kplay') { if (S.kd >= 100) S.kd = 0; S.kplay = !S.kplay; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'kzR') return;
  S.kplay = false; S.kd = +ev.target.value; render();
});
function finishWeek() {
  if (S.wk >= WEEKS) { resetSteps(); sfx.click(); return; }
  const k = S.wk + 1;
  S.vals.push(cur() + Math.min(S.days, capOf(k)) / 2); S.wk = k;
  const nx = k + 1;
  S.days = nx <= WEEKS ? Math.min(defDays(nx), capOf(nx)) : 0;
  sfx.good(); showStage();
}
function pickBucket(i) {
  if (S.picked !== null || S.ci >= 9) return;
  const ok = CARD_BUCKET[CARD_ORDER[S.ci]] === i;
  S.picked = i; S.rights[S.ci] = ok; S.arrowAt = nowS(); S.arrowTo = i; S.arrowOk = ok;
  if (ok) { S.stuck[i] = Math.min(4, S.stuck[i] + 1); sfx.good(); } else sfx.bad();
  showStage();
}
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  if (S.sec === 'tr' && geo?.gx !== undefined) {
    const gx = Math.floor((px - geo.gx) / geo.cell), gy = Math.floor((py - geo.gy) / geo.cell);
    if (gx < 0 || gx > 6 || gy < 0 || gy > 3) return;
    const i = gy * 7 + gx; S.tr[i] = !S.tr[i]; (S.tr[i] ? sfx.click : sfx.tick)(); render();
  } else if (!S.sec && lab.view === 'just' && geo?.targets && S.picked === null && S.ci < 9) {
    const i = geo.targets.findIndex((q) => Math.hypot(px - q.x, py - q.y) < q.r);
    if (i >= 0) { pickBucket(i); render(); }
  }
});

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, mode = askMode(), sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : mode === 'f' || mode === 'p2' ? 'ask' : v === 'just' ? 'ask' : v;
  const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
  show('secFocus', !sec && v === 'focus' && !mode); show('secSteps', !sec && v === 'steps' && !mode); show('secJust', !sec && v === 'just');
  show('secKz', sec === 'kz'); show('secTr', sec === 'tr');
  renderAsk(mode, t);
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('kz', '🌱') + sc('tr', '🔗');
  if (sec === 'kz') { lab.setGlow('rgba(95, 200, 160, .26)'); lab.setFacts([]); renderKaizen(); return; }
  if (sec === 'tr') { lab.setGlow('rgba(241, 194, 74, .24)'); lab.setFacts([]); $('trFine').textContent = t.tr.l0; renderTracker(); return; }
  lab.setFacts(t.facts[v]);
  if (v === 'focus') renderFocus(t, mode); else if (v === 'steps') renderSteps(t, mode); else renderJust(t);
}

function sentence(t) {
  const wish = t.wishes[S.w];
  return wish.rows.map((r, i) => r[S.lv[S.w][i]]).filter((x) => x !== '—').join(' · ');
}
function renderFocus(t, mode) {
  lab.setGlow('rgba(240, 160, 120, .26)');
  const lv = S.lv[S.w], n = lv.filter((x) => x === 2).length, wish = t.wishes[S.w];
  $('wishChips').innerHTML = t.wishes.map((q, i) => `<button class="chip ${i === S.w ? 'on' : ''}" data-x="wish:${i}">${q.emo} ${esc(q.name)}</button>`).join('');
  $('rows').innerHTML = wish.rows.map((opts, r) => `<div class="gs-row"><div class="gs-lbl">${esc(t.rowLbl[r])}</div><div class="chips">${opts.map((o, l) => `<button class="chip ${lv[r] === l ? 'on' : ''}" data-x="lv:${r}.${l}">${esc(o)}</button>`).join('')}</div></div>`).join('');
  $('shootB').textContent = t.f.shoot; $('shootB').disabled = n < 4; $('shootHint').textContent = n < 4 ? t.f.shootHint : '';
  if (mode) { lab.setReadout('?', '', '', '#f0a078'); lab.setState({ emo: '🌫️', title: t.f.q, lead: '', body: '', extra: '' }); return; }
  lab.setReadout(`${n}/4`, t.f.sub, t.f.pill[n === 0 ? 0 : n === 4 ? 2 : 1], '#f0a078');
  const body = `${t.f.goalLbl}: ${sentence(t)}`;
  if (S.shotDone && n === 4) lab.setState({ emo: '🎯', title: t.f.tH, lead: t.f.lH, body, extra: '' });
  else if (n === 4) lab.setState({ emo: '✨', title: t.f.t4, lead: t.f.l4, body, extra: '' });
  else lab.setState({ emo: '🌫️', title: t.f.t0(n), lead: t.f.l0, body, extra: '' });
}
function renderSteps(t, mode) {
  lab.setGlow('rgba(111, 168, 255, .26)');
  const k = S.wk + 1, over = S.wk >= WEEKS, cap = capOf(k), locked = S.plan === 'keep' && k >= 5;
  $('daysLbl').textContent = t.s.days;
  $('daysRow').innerHTML = Array.from({ length: 8 }, (_, n) => `<button class="gs-d ${n === S.days ? 'on' : ''}" data-x="day:${n}"${n > cap || locked ? ' disabled' : ''}>${n}</button>`).join('');
  $('finB').textContent = over ? t.s.again : t.s.fin;
  $('daysRow').style.display = over ? 'none' : ''; $('daysLbl').style.display = over ? 'none' : '';
  const g = gapNow(), ag = Math.abs(g);
  if (mode) {
    lab.setReadout('?', '', '', '#6fa8ff');
    lab.setState({ emo: mode === 'p2' ? '🤔' : mode === 'sb' ? '🌧️' : '🏳️', title: mode === 'p2' ? t.s.q : mode === 'sb' ? t.s.sbTitle(4, t.s.causes[S.cause]) : t.s.giveT(fm(cur())), lead: mode === 'sb' ? t.s.sbLead : '', body: '', extra: '' });
    return;
  }
  lab.setReadout(fm(cur()), t.s.of(Math.min(S.wk + (over ? 0 : 1), WEEKS)), g > .01 ? t.s.pillAhead(fm(ag)) : g < -.01 ? t.s.pillBehind(fm(ag)) : t.s.pillOn, '#6fa8ff');
  if (over) {
    const win = cur() >= GOAL - 0.001;
    lab.setState(win ? { emo: '🏆', title: t.s.win, lead: t.s.winL, body: '', extra: '' } : { emo: '🤏', title: t.s.short(fm(cur())), lead: t.s.shortL, body: '', extra: '' });
  } else if (S.plan === 'keep') lab.setState({ emo: '📌', title: t.s.tw(k), lead: t.s.lKeep(fm(Math.max(0, -g))), body: t.s.bw, extra: '' });
  else if (S.plan === 'adjust') lab.setState({ emo: '🔧', title: t.s.tw(k), lead: t.s.lAdj, body: t.s.bw, extra: '' });
  else lab.setState({ emo: '🪜', title: t.s.tw(k), lead: t.s.lw, body: t.s.bw, extra: '' });
}
function renderJust(t) {
  lab.setGlow('rgba(61, 220, 151, .22)');
  const done = S.ci >= 9, k = S.rights.filter(Boolean).length, picked = S.picked;
  const cardIx = CARD_ORDER[Math.min(S.ci, 8)], right = CARD_BUCKET[cardIx];
  $('bkRow').innerHTML = t.j.bk.map((b, i) => `<button data-x="bk:${i}"${picked !== null || done ? ' disabled' : ''} style="${picked !== null && i === right ? 'border-color:var(--ok);background:rgba(61,220,151,.18);opacity:1' : ''}">${esc(b)}</button>`).join('');
  $('nextB').textContent = done ? t.j.again : t.j.next; $('nextB').style.display = done || picked !== null ? '' : 'none';
  lab.setReadout(`${k}/9`, t.j.sub, '', '#3ddc97');
  if (done) lab.setState({ emo: '🏆', title: t.j.end(k), lead: t.j.endL, body: '', extra: '' });
  else if (picked === null) lab.setState({ emo: '🎯', title: t.j.t, lead: t.j.n(S.ci + 1), body: '', extra: '' });
  else lab.setState({ emo: picked === right ? '✅' : '🤔', title: picked === right ? t.j.ok : t.j.no, lead: `${t.j.bk[right]}: ${t.j.why[right]}`, body: '', extra: '' });
}
render();
</script>
