    pred.innerHTML = predBlock(q.q, [['long', q.o.long], ['same', q.o.same], ['short', q.o.short]], S.g2, realOf('two'));
    if (S.g2 !== null) {
      const open = secret.unlocked(), sc = (k, emo, id) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec2 === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(q.sec[k][0])}` : '🔒 ???'}</button>`;
      row.innerHTML = chip('again', t.again, false) + sc('twin', '👯') + sc('fade', '💨');
      row2.innerHTML = speedChips();
    }
  } else {
    const q = t.v3, m = sims.three;
    pred.innerHTML = predBlock(q.q, [['home', q.o.home], ['walk', q.o.walk], ['lost', q.o.lost]], S.g3, realOf('three'));
    if (S.g3 !== null) {
      row.innerHTML = chip('move', m && m.sites[1].has ? q.back : q.move, false) + chip('reset', q.reset, false);
      row2.innerHTML = speedChips();
      $('anFadeL').textContent = q.fade; $('anSlow').textContent = q.slow; $('anQuick').textContent = q.quick;
      if (+$('anFadeI').value !== S.fade) $('anFadeI').value = S.fade;
      $('anHint').textContent = q.hint;
    }
  }
  S.fk = null; S.sk = null; refresh();
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'guess') {
    const g = b.dataset.g;
    if (v === 'one') { sim('one'); S.g1 = g; } else if (v === 'two') { S.g2 = g; sims.two = newSim2(S.sec2, S.seed); } else S.g3 = g;
    sfx.click(); render(); showStage(); return;
  }
  if (act === 'goto') { $('views').querySelector(`[data-view="${b.dataset.to}"]`)?.click(); return; }
  if (act === 'speed') S.speed = +b.dataset.sp;
  else if (act === 'scent') S.show = !S.show;
  else if (act === 'again') {
    S.seed++; refresh.p1 = false; refresh.p2 = false;
    if (v === 'one') { sims.one = newSim1(S.seed); S.show = true; } else sims.two = newSim2(S.sec2, S.seed);
  } else if (act === 'reset') { S.seed++; sims.three = newSim3(S.seed + 100, EVAP3[S.fade]); S.wiped = false; refresh.p3 = false; }
  else if (act === 'move') { if (sims.three) moveSugar(sims.three); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec2 = S.sec2 === k ? null : k; S.seed++; refresh.p2 = false; sims.two = newSim2(S.sec2, S.seed);
  }
  sfx.click(); render();
});
$('anFadeI').addEventListener('input', (ev) => {
  S.fade = +ev.target.value; if (sims.three) sims.three.evap = EVAP3[S.fade]; sfx.tick();
});
// part 3: rub the trail out with a finger
const cv = $('cv');
const wipeEv = (ev) => {
  const r = cv.getBoundingClientRect(), p = { x: (ev.clientX - r.left - LAY.ox) / LAY.sc, y: (ev.clientY - r.top - LAY.oy) / LAY.sc };
  S.finger = p;
  const n = wipe(sims.three, p.x, p.y);
  if (n) { sfx.tick(); S.wiped = true; }
};
const canWipe = () => lab.view === 'three' && S.g3 !== null && !!sims.three;
cv.addEventListener('pointerdown', (ev) => { if (!canWipe()) return; try { cv.setPointerCapture(ev.pointerId); } catch { /* ignore */ } S.down = true; wipeEv(ev); });
cv.addEventListener('pointermove', (ev) => { if (S.down && canWipe()) wipeEv(ev); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach((e) => cv.addEventListener(e, () => { S.down = false; S.finger = null; }));

// --- readout, state card and facts --------------------------------------------------------------------------------
const fineHtml = (t) => `<div class="fine">${esc(t.fine)}</div>`;
const put = (st) => { const k = JSON.stringify(st); if (k !== S.sk) { S.sk = k; lab.setState(st); } }; // the card is rebuilt only when it changes (links in it stay clickable)
function refresh() {
  const t = T[lang], v = lab.view, lk = lockedBy(v);
  lab.setGlow(GLOW[v]);
  const setFacts = (key, list) => { if (S.fk !== key) { S.fk = key; lab.setFacts(list); } };
  if (lk) {
    lab.setReadout('🔒', '', t.lock.pill(lk), ACC[v]);
    put({ emo: '🔒', title: t.lock.title(lk), lead: t.lock.lead(lk), body: '', extra: '' });
    setFacts('lock', []); return;
  }
  if (v === 'one') {
    const q = t.v1, m = sims.one;
    if (S.g1 === null) {
      lab.setReadout('?', '', '', ACC.one);
      put({ emo: '🤔', title: q.q, lead: q.pre, body: '', extra: fineHtml(t) }); setFacts('one-pre', []); return;
    }
    lab.setReadout(`🍬 ${m.crumbs}`, q.crumbs(m.crumbs), q.ph[m.phase], ACC.one);
    let st;
    if (m.phase === 'search') st = { emo: '🔎', title: q.s1[0], lead: q.s1[1], body: q.s1[2] };
    else if (m.phase === 'home') st = { emo: '🍬', title: q.s2[0], lead: q.s2[1], body: q.s2[2] };
    else st = { emo: S.g1 === 'scent' ? '✅' : '🤔', title: S.g1 === 'scent' ? q.right : q.wrong, lead: q.s3, body: `${q.b[S.g1]}${S.show ? '' : ' ' + q.hid}` };
    put({ ...st, extra: fineHtml(t) }); setFacts('one-' + (m.phase === 'follow'), m.phase === 'follow' ? t.facts.one : []);
    if (m.phase === 'follow' && !refresh.p1) { refresh.p1 = true; render(); }
    return;
  }
  if (v === 'two') {
    const q = t.v2, m = sims.two, info = v2info();
    if (S.g2 === null) {
      lab.setReadout('?', '', '', ACC.two);
      put({ emo: '🤔', title: q.q, lead: q.pre, body: '', extra: fineHtml(t) }); setFacts('two-pre', []); return;
    }
    const pct = Math.round(info.share * 100), ratio = (m.paths[1].len / m.paths[0].len).toFixed(1).replace('.', lang === 'en' ? '.' : ',');
    lab.setReadout(info.k >= 6 ? `${pct}%` : '…', S.sec2 === 'twin' ? q.twin[3] : q.sub, '', ACC.two);
    let st;
    if (!info.ready) st = { emo: S.sec2 === 'twin' ? '👯' : S.sec2 === 'fade' ? '💨' : '🐜', title: S.sec2 === 'twin' ? q.twin[0] : S.sec2 === 'fade' ? q.fade[0] : q.run[0], lead: S.sec2 ? q.wait : q.run[1], body: S.sec2 ? '' : q.run[2] };
    else if (S.sec2 === 'twin') st = { emo: '👯', title: q.twin[0], lead: q.twin[1](pct), body: q.twin[2] };
    else if (S.sec2 === 'fade') st = { emo: '💨', title: q.fade[0], lead: q.fade[1](pct), body: q.fade[2] };
    else st = { emo: S.g2 === info.real ? '✅' : '🤔', title: S.g2 === info.real ? q.right : q.wrong, lead: q.lead(pct), body: q.body(ratio) };
    put({ ...st, extra: fineHtml(t) });
    const done = info.real !== null;
    setFacts('two-' + done, done || S.sec2 ? t.facts.two : []);
    if (done && !refresh.p2) { refresh.p2 = true; render(); }
    return;
  }
  const q = t.v3, m = sims.three;
  const cards = `<div class="an-cards"><h4>${esc(q.cards)}</h4>${[['🐝', q.bee, `../waggle/?lang=${lang}`], ['✨', q.fire, '']].map(([e, c, href]) =>
    `<div class="an-card"><span class="e">${e}</span><div><b>${esc(c[0])}</b><p>${esc(c[1])}</p>${href ? `<a href="${href}">${esc(c[2])}</a>` : ''}<small>${esc(c[3])}</small></div></div>`).join('')}</div>${fineHtml(t)}`;
  if (S.g3 === null) {
    lab.setReadout('?', '', '', ACC.three);
    put({ emo: '🤔', title: q.q, lead: q.pre, body: '', extra: cards }); setFacts('three-pre', []); return;
  }
  let lostN = 0, oldMean = 0;
  for (const a of m.ants) if (a.m === 'wander') lostN++;
  { const ph = m.ph[m.sites[0].has ? 1 : 0]; let s = 0; for (let k = 0; k < ph.length; k++) s += ph[k]; oldMean = s / ph.length; }
  lab.setReadout(`🧭 ${lostN}`, q.lost(lostN), '', ACC.three);
  let st;
  if (m.moved && m.found) st = { emo: '🌱', title: q.found[0], lead: q.found[1], body: q.found[2] };
  else if (m.moved && oldMean < 0.4) st = { emo: '💨', title: q.faded[0], lead: q.faded[1], body: q.faded[2] };
  else if (m.moved) st = { emo: '🍬', title: q.moved[0], lead: q.moved[1], body: q.moved[2] };
  else if (verdict3()) st = { emo: S.g3 === 'lost' ? '✅' : '🤔', title: S.g3 === 'lost' ? q.right : q.wrong, lead: q.wiped, body: q.wipedB };
  else st = { emo: '🖐️', title: q.ready[0], lead: q.ready[1], body: '' };
  put({ ...st, extra: cards });
  setFacts('three', t.facts.three);
  if (verdict3() && !refresh.p3) { refresh.p3 = true; render(); }
}
refresh.p1 = false; refresh.p2 = false; refresh.p3 = false;

canvasLoop($('cv'), draw);
render();
</script>
