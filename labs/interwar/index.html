  c.strokeStyle = 'rgba(190,205,255,.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(L, Tp + ph); c.lineTo(w - Rr, Tp + ph); c.stroke();

    const dg = Math.max(0.05, (Math.log10(p) + 1) / 12.4) * ph * eOut((now() - S.secT - k * 0.04) / 0.6), x = L + k * bw + bw * 0.14, ww = bw * 0.72, sel = k === i;
    const g = c.createLinearGradient(0, Tp + ph - dg, 0, Tp + ph); g.addColorStop(0, sel ? '#ffd78a' : '#8f7fd0'); g.addColorStop(1, sel ? '#d9825f' : '#4b3f8a');
    c.fillStyle = g; rr(c, x, Tp + ph - dg, ww, dg, 4); c.fill();
    if (sel) { c.strokeStyle = '#fff'; c.lineWidth = 2; rr(c, x, Tp + ph - dg, ww, dg, 4); c.stroke(); }
  });
  c.fillStyle = '#98A0B8'; c.font = '700 12px Nunito, sans-serif'; c.textBaseline = 'top';
  c.textAlign = 'left'; c.fillText(monthYearShort(BREAD[0][0], BREAD[0][1]), L, Tp + ph + 8);
  c.textAlign = 'right'; c.fillText(monthYearShort(BREAD[n - 1][0], BREAD[n - 1][1]), w - Rr, Tp + ph + 8);
  const dl = monthYearShort(yy, mm); c.font = '800 12px Nunito, sans-serif';
  const dw = c.measureText(dl).width + 16, bx = clamp(L + i * bw + bw / 2 - dw / 2, 10, w - 10 - dw);
  drawPill(c, dl, bx, Tp - 28, 12, '#ffd78a');
}

// --- the loop ----------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (S.sec === 'a') { drawBread(c, w, h, dt, time); return; }
  if (S.sec === 'b') { syncDots(dt, S.by); drawMap(c, w, h, dt, time, 'b'); return; }
  if (v === 'map') {
    if (S.playing) { S.year = Math.min(Y1, S.year + dt * 2); if (S.year >= Y1) S.playing = false; S.shown = Math.min(Y1, Math.floor(S.year + 1e-6)); }
    syncDots(dt, S.shown); drawMap(c, w, h, dt, time, 'a'); syncMap();
  } else if (v === 'crisis') drawCrisis(c, w, h, dt, time);
  else drawSigns(c, w, h, dt, time);
});

// --- the map's texts: readout, state card, legend, slider ----------------------------------------------------------
function syncMap() { if (S.lastShown !== S.shown) { S.lastShown = S.shown; mapTexts(); } }
function mapTexts() {
  const t = T[lang], y = S.shown, ty = tally(y), ans = S.pick !== null;
  const parts = [t.cnt.d(ty.d), t.cnt.t(ty.t)]; if (ty.w) parts.push(t.cnt.w(ty.w)); if (ty.x) parts.push(t.cnt.x(ty.x));
  lab.setReadout(String(y), parts.join(' · '), t.pillMap(ty.N), '#2fb3a3');
  for (const k of ['d', 't', 'w', 'x']) {
    const el = $('iwLeg').querySelector(`[data-k="${k}"]`); el.style.display = ty[k] > 0 || k === 'd' || k === 't' ? 'inline-flex' : 'none';
    el.querySelector('.n').textContent = t.legend[k]; el.querySelector('b').textContent = ty[k];
  }
  if (!ans) { lab.setState({ emo: '🤔', title: t.mapAsk(TALLY0.d, TALLY0.N), lead: '', body: '', extra: '' }); return; }
  if (!S.playing && Number($('iwSlider').value) !== y) $('iwSlider').value = y;
  if (S.playing) $('iwSlider').value = y;
  const e = t.ev[y] || t.quiet;
  lab.setState({ emo: t.ev[y] ? '🗺️' : '🕰️', title: e[0], lead: e[1], body: e[2], extra: '' });
}
// --- the crisis texts -----------------------------------------------------------------------------------------------
const qIdx = () => Math.min(S.c.st, 2);
function crisisTexts() {
  const t = T[lang].cr, q = S.c, vis = visible(), cy = q.cy, done = cDone();
  const u = UN[cy], uv = vis.has('U' + String(cy).slice(2)) && u !== undefined;
  const els = VOTE.filter((p) => Math.floor(p.t) === cy);
  const vtxt = !els.length ? t.noElect : `${t.pctV}: ${els.map((p) => (vis.has(p.id) ? pc(p.v) : t.unk)).join(' · ')}`;
  lab.setReadout(String(cy), cy === 1928 ? `${t.pctU}: –` : `${t.pctU}: ${uv ? pc(u) : t.unk}`, vtxt, '#6fb7ff');
  $('iwLegU').textContent = t.legU; $('iwLegV').textContent = t.legV;
  // the numbers shown so far: only revealed points are in the page
  const uList = [1929, 1930, 1931, 1932, 1933].filter((y) => vis.has('U' + String(y).slice(2))).map((y) => `${y} <b>${pc(UN[y])}</b>`).join(' · ');
  const vList = VOTE.filter((p) => vis.has(p.id)).map((p) => `${t.elect[VOTE.indexOf(p)]} <b>${pc(p.v)}</b>`).join(' · ');
  $('iwTab').innerHTML = `<div>${esc(t.tabU)}: ${uList}</div><div>${esc(t.tabV)}: ${vList}</div>`;
  $('iwCFine').textContent = t.fine;
}

// --- prediction blocks ---------------------------------------------------------------------------------------------------
function chipsHTML(opts, pick, right, act, extra = '') {
  const done = pick !== null;
  return `<div class="iw-opts">${opts.map((o, i) => `<button class="iw-opt${done ? (i === right ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="${act}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>${extra}`;
}
function predMap() {
  const t = T[lang], pick = S.pick, done = pick !== null;
  const verdict = done ? `<div class="iw-verdict ${pick === OKIDX ? 'good' : 'bad'}">${esc((pick === OKIDX ? t.mapRight : t.mapWrong)(TALLY1.d, TALLY1.N))}</div>` : '';
  return `<div class="iw-q">${esc(t.mapAsk(TALLY0.d, TALLY0.N))}</div>${chipsHTML(t.mapOpts, pick, OKIDX, 'opt', verdict)}`;
}
function predCrisis() {
  const t = T[lang].cr, q = S.c, i = qIdx(), pick = q.pick[i], done = pick !== null, ok = t.ok[i];
  const arg = i === 0 ? pc(VBY.V28.v) : i === 1 ? pc(VBY.V32a.v) : pc(VBY.V32b.v);
  let verdict = '';
  if (done) {
    const a = i === 0 ? pc(VBY.V28.v) : i === 1 ? pc(VBY.V32a.v) : pc(VBY.V32b.v), b = i === 0 ? pc(VBY.V30.v) : i === 1 ? pc(VBY.V32b.v) : pc(VBY.V33.v);
    verdict = `<div class="iw-verdict ${pick === ok ? 'good' : 'bad'}">${esc(`${pick === ok ? t.right[i] : t.wrong[i]} ${t.after[i](a, b)}`)}</div>`;
  }
  return `<div class="iw-q">${esc(t.q[i](arg))}</div>${chipsHTML(t.opts[i], pick, ok, 'copt', verdict)}`;
}

// --- events ---------------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answerMap(i) {
  if (S.pick !== null) return;
  S.pick = i; S.year = Y0; S.shown = Y0; S.playing = true; S.lastShown = -1;
  (i === OKIDX ? sfx.good : sfx.bad)(); render(); showStage();
}
function answerCrisis(i) {
  const q = S.c, k = qIdx(); if (q.pick[k] !== null) return;
  q.pick[k] = i; syncReveal();
  (i === T[lang].cr.ok[k] ? sfx.good : sfx.bad)();
  q.cy = k === 0 ? 1930 : k === 1 ? 1932 : 1933;
  render(); showStage();
}
function chooseSign(side) {
  const G = S.g; if (G.rev || G.cur >= SIGNS.length) return;
  G.ch[G.cur] = side; S.card[G.cur].x = 180; S.card[G.cur].y = 83; G.cur++; G.enterT = now(); sfx.snap(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, q = S.c, G = S.g;
  if (a === 'opt') return answerMap(+b.dataset.i);
  if (a === 'replay') { if (S.pick === null) return; S.year = Y0; S.shown = Y0; S.playing = true; S.lastShown = -1; sfx.click(); render(); return; }
  if (a === 'copt') return answerCrisis(+b.dataset.i);
  if (a === 'cnext') { q.st++; syncReveal(); sfx.click(); }
  else if (a === 'cagain') { S.c = { st: 0, pick: [null, null, null], rt: {}, cy: 1928 }; syncReveal(); sfx.click(); }
  else if (a === 'sg') return chooseSign(b.dataset.s);
  else if (a === 'sundo') { if (G.rev || G.cur === 0) return; G.cur--; G.ch[G.cur] = null; G.enterT = now(); sfx.tick(); }
  else if (a === 'scheck') { if (G.cur < SIGNS.length || G.rev) return; G.rev = true; const k = SIGNS.filter((sg, i) => G.ch[i] === (sg.tot ? 'T' : 'D')).length; (k >= 5 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'sagain') { S.g = { ch: [null, null, null, null, null, null], rev: false, enterT: now(), cur: 0 }; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.secT = now(); sfx.click(); showStage();
  }
  render();
});
$('iwSlider').addEventListener('input', (ev) => {
  if (S.pick === null) return;
  S.playing = false; S.year = S.shown = +ev.target.value; mapTexts(); S.lastShown = S.shown;
});
$('iwCSlider').addEventListener('input', (ev) => {
  const mx = Math.max(...[...visible()].map((id) => (id[0] === 'U' ? 1900 + +id.slice(1) : Math.floor(VBY[id].t))));
  S.c.cy = Math.min(+ev.target.value, mx); sfx.tick(); crisisTexts(); crisisCard();
});
$('iwBSlider').addEventListener('input', (ev) => { S.br = +ev.target.value; S.secT = Math.max(S.secT, now() - 5); sfx.tick(); render(); });
$('iwZSlider').addEventListener('input', (ev) => { S.by = +ev.target.value; sfx.tick(); render(); });
$('cv').addEventListener('click', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'map' && !S.sec && S.pick !== null) {
    let best = null, bd = 1e9; for (const d of S.hit) { const dd = Math.hypot(d.x - x, d.y - y); if (dd < bd) { bd = dd; best = d; } }
    const lim = Math.max(22, (S.geo?.r ?? 10) * 1.8);
    S.selKey = best && bd <= lim ? best.k : null;
    if (S.selKey) sfx.tick();
  } else if (lab.view === 'signs' && !S.sec) {
    const g = S.signGeo; if (!g) return;
    const ly = (y - g.oy) / g.s, lx = (x - g.ox) / g.s;
    if (ly >= BY && ly <= BY + BH) chooseSign(lx < 180 ? 'D' : 'T');
  }
});

// --- crisis state card ----------------------------------------------------------------------------------------------------
function crisisCard() {
  const t = T[lang], q = S.c, i = qIdx(), pick = q.pick[i], cr = t.cr;
  if (cDone()) { const f = cr.final; lab.setState({ emo: f[0], title: f[1], lead: f[2], body: f[3], extra: '' }); lab.setFacts([...t.cFacts, t.cFacts2]); return; }
  if (pick === null) { lab.setState({ emo: '🤔', title: cr.q[i](i === 0 ? pc(VBY.V28.v) : i === 1 ? pc(VBY.V32a.v) : pc(VBY.V32b.v)), lead: '', body: '', extra: '' }); lab.setFacts(t.cFacts); return; }
  const s = cr.st[i]; lab.setState({ emo: s[0], title: s[1], lead: s[2], body: '', extra: '' }); lab.setFacts(t.cFacts);
}

// --- one render per change ---------------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' + sec : v;
  const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  show('iwMap', !sec && v === 'map'); show('iwCrisis', !sec && v === 'crisis'); show('iwSigns', !sec && v === 'signs'); show('iwSecA', sec === 'a'); show('iwSecB', sec === 'b');
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('iwSecs').innerHTML = sc('a', '🍞') + sc('b', '🛡️');
  if (sec === 'a') return renderBread(t);
  if (sec === 'b') return renderCz(t);
  if (v === 'map') renderMap(t); else if (v === 'crisis') renderCrisis(t); else renderSigns(t);
}
function renderMap(t) {
  const ans = S.pick !== null;
  $('iwPredMap').innerHTML = predMap();
  $('iwSlider').disabled = !ans; $('iwReplay').disabled = !ans; $('iwReplay').textContent = t.replay;
  $('iwReplay').style.visibility = ans ? 'visible' : 'hidden';
  $('iwFine').textContent = t.fine;
  $('iwSlider').value = S.shown;
  lab.setGlow('rgba(47, 179, 163, .24)');
  S.lastShown = -1; mapTexts();
  lab.setFacts(ans ? t.mapFacts : []);
}
function renderCrisis(t) {
  const q = S.c; syncReveal();
  $('iwPredCrisis').innerHTML = predCrisis();
  const i = qIdx(), answered = q.pick[i] !== null;
  const mx = Math.max(...[...visible()].map((id) => (id[0] === 'U' ? 1900 + +id.slice(1) : Math.floor(VBY[id].t))));
  const sl = $('iwCSlider'); sl.max = String(mx); q.cy = Math.min(q.cy, mx); sl.value = String(q.cy);
  $('iwCBtn').innerHTML = cDone() ? `<button class="btn" data-act="cagain">${esc(t.cr.again)}</button>` : answered ? `<button class="btn" data-act="cnext">${esc(t.cr.next)}</button>` : '';
  lab.setGlow('rgba(111, 183, 255, .24)');
  crisisTexts(); crisisCard();
}
function renderSigns(t) {
  const G = S.g, n = G.ch.filter(Boolean).length, all = G.cur >= SIGNS.length, k = SIGNS.filter((sg, i) => G.ch[i] === (sg.tot ? 'T' : 'D')).length;
  $('iwSD').textContent = t.sg.dem; $('iwST').textContent = t.sg.tot; $('iwSD').disabled = $('iwST').disabled = all || G.rev;
  $('iwUndo').textContent = t.sg.undo; $('iwUndo').disabled = G.rev || G.cur === 0;
  const cb = $('iwCheck'); cb.textContent = G.rev ? t.sg.again : t.sg.check; cb.dataset.act = G.rev ? 'sagain' : 'scheck'; cb.disabled = !G.rev && !all;
  lab.setGlow('rgba(232, 134, 58, .24)');
  if (G.rev) {
    lab.setReadout(t.sg.ofN(k), t.sg.right, '', '#e8863a');
    const st = t.sg.stDone(k); lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
    lab.setFacts([...t.sFacts, t.sFacts2]);
  } else {
    lab.setReadout(`${n}/6`, t.sg.sorted(n), '', '#e8863a');
    if (all) { const st = t.sg.stReady; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' }); }
    else { const st = t.sg.stQ(t.sg.cards[G.cur]); lab.setState({ emo: st[0], title: t.sg.q, lead: st[2], body: '', extra: '' }); }
    lab.setFacts(t.sFacts);
  }
}
function renderBread(t) {
  const [yy, mm, p] = BREAD[S.br], base = BREAD[0], ratio = Math.round(p / base[2]);
  $('iwBSlider').value = S.br;
  $('iwBa').textContent = monthYear(BREAD[0][0], BREAD[0][1]); $('iwBb').textContent = monthYear(BREAD[BREAD.length - 1][0], BREAD[BREAD.length - 1][1]);
  $('iwBFine').textContent = t.br.fine;
  lab.setGlow('rgba(217, 130, 95, .26)');
  lab.setReadout(`${big(p)}`, t.br.marks(p), monthYear(yy, mm), '#d9825f');
  const body = S.br === 0 ? '' : t.br.body(big(ratio), monthYear(base[0], base[1]));
  lab.setState({ emo: '🍞', title: `${t.br.price}: ${big(p)} ${t.br.marks(p)}`, lead: monthYear(yy, mm), body, extra: '' });
  lab.setFacts(t.br.fact);
}
function renderCz(t) {
  const y = S.by, tn = NEIGH.filter((k) => stat(k, y) === 't').length, xn = NEIGH.filter((k) => stat(k, y) === 'x').length;
  $('iwZSlider').value = y;
  $('iwZFine').textContent = t.fine;
  lab.setGlow('rgba(47, 179, 163, .24)');
  const cs = stat('cs', y), lead = y >= 1938 && xn ? t.cz.lead(tn, NEIGH.length, y) : tn === 0 ? t.cz.lead0(NEIGH.length) : tn === 1 ? t.cz.lead1(tn, NEIGH.length) : t.cz.lead(tn, NEIGH.length, y);
  lab.setReadout(String(y), `${t.names.cs}: ${t.stT[cs]}`, `${tn}/${NEIGH.length} ${t.cz.ng}`, STY[cs].c);
  lab.setState({ emo: '🛡️', title: t.cz.title(y), lead, body: t.cz.body(t.stT[cs]), extra: '' });
  lab.setFacts(t.cz.fact);
}
render();
</script>
