    c.save(); c.globalAlpha = cbA; c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2; c.setLineDash([5, 5]); c.lineDashOffset = -t * 8;
    c.beginPath(); c.moveTo(fcP[0] - 9, fcP[1] - 6); c.quadraticCurveTo((fcP[0] + cbP[0]) / 2 - 14, (fcP[1] + cbP[1]) / 2 - 22, cbP[0] + 9, cbP[1] + 5); c.stroke(); c.restore();
  }
  for (const s of SITES) {
    const a = A.site[s.id] || 0; if (a <= .02) continue;
    const [x, y] = P(s.lon, s.lat); A.geo.push({ id: s.id, x, y });
    const r = (s.arrive ? 8 : 12) * Math.max(.8, K), sc = back(clamp01(a));
    for (let k = 0; k < 2; k++) { const ph = (t * .6 + k * .5) % 1; c.strokeStyle = `rgba(${s.arrive ? '255,255,255' : '255,210,94'},${(1 - ph) * .6 * a})`; c.lineWidth = 2; c.beginPath(); c.arc(x, y, Math.max(0, r * sc + ph * 16), 0, 7); c.stroke(); }
    c.save(); c.translate(x, y); c.scale(sc, sc);
    if (s.arrive) {
      c.rotate(Math.PI / 4); c.fillStyle = '#fff'; c.strokeStyle = '#4ea8ff'; c.lineWidth = 2; rr(c, -r * .8, -r * .8, r * 1.6, r * 1.6, 3); c.fill(); c.stroke();
    } else {
      const dg = c.createRadialGradient(-r * .3, -r * .3, 1, 0, 0, r); dg.addColorStop(0, '#ffe58a'); dg.addColorStop(1, '#e08a1e');
      c.fillStyle = s.start === null ? '#3a3320' : dg; c.strokeStyle = '#fff3c4'; c.lineWidth = 1.8; if (s.start === null) c.setLineDash([3.5, 3]);
      c.beginPath(); c.arc(0, 0, Math.max(0, r), 0, 7); c.fill(); c.stroke(); c.setLineDash([]);
      c.fillStyle = '#fff'; c.font = `${Math.round(r * 1.15)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s.emo, 0, 1);
    }
    c.restore();
    if (S.sel === s.id) { c.strokeStyle = '#fff'; c.lineWidth = 2.2; c.beginPath(); c.arc(x, y, r + 6, 0, 7); c.stroke(); }
  }
  c.restore();
  if (asked) pill(c, T[lang].m.pill(nf(Math.round(yearsAgo() / 100) * 100)), w / 2, 10, { align: 'center', size: 14 });
  const sel = A.geo.find((q) => q.id === S.sel);
  if (sel) pill(c, T[lang].sites[sel.id].name, sel.x, sel.y - 40, { align: 'center' });
}

// --- loop: simulation and drawing ---------------------------------------------------------------------------------
let lastLive = -1;
canvasLoop($('cv'), (c, w, h, dt, t) => {
  CW = w; CH = h;
  step(dt, t);
  if (t - lastLive > .1) { lastLive = t; live(); }
  const v = lab.view;
  if (S.sec === 'g') drawGobekli(c, w, h, t);
  else if (S.sec === 'o') drawOtzi(c, w, h, t);
  else if (v === 'map') drawMap(c, w, h, t);
  else drawValley(c, w, h, t);
});
function step(dt, t) {
  const k = (r) => Math.min(1, dt * r);
  const p = hp();
  if (p > 50 && S.ans.hunt !== null) { if (t > A.campNext) { A.campT = A.campT < .45 ? .6 : .3; A.campNext = t + 7; } } else A.campT = .42;
  A.camp += (A.campT - A.camp) * k(1.6);
  const farm = lab.view === 'farm';
  const dT = farm ? (S.planted ? 0 : 4) : (S.ans.hunt === null || p <= 30 ? 4 : p <= 45 ? 3 : p <= 60 ? 2 : 1);
  for (let i = 0; i < 4; i++) A.deer[i] += ((i < dT ? 1 : 0) - A.deer[i]) * k(2);
  if (S.planted) {
    const sh = fsh(), target = sh === 0 ? 30 : Math.round(fcap(sh) * .95);
    S.pop += (target - S.pop) * k(.35);
    if (S.drought > 0) { S.drought = Math.max(0, S.drought - dt); S.g = Math.max(0, S.g - dt * .5 / 6); }
    else if (sh >= .2) S.g = Math.min(1, S.g + dt * .07 * clamp(sh / .6, 0, 1));
    else S.g = Math.max(0, S.g - dt * .02);
    if (sh < .2) S.jobs = 0; else { const n = GT.filter((x) => S.g >= x).length; if (n > S.jobs) S.jobs = n; }
    S.plantT = Math.min(1, S.plantT + dt / 3);
  } else {
    S.pop += (30 - S.pop) * k(.8); S.g = 0; S.jobs = 0; S.drought = 0; S.plantT = Math.max(0, S.plantT - dt / 1.5);
  }
  const sh = fsh(), nP = Math.round(sh * 12);
  for (let i = 0; i < 12; i++) {
    const rank = ORDER.indexOf(i), on = S.planted && rank < nP && S.plantT * 1.4 > rank / 12;
    A.plot[i] += ((on ? 1 : 0) - A.plot[i]) * k(3);
  }
  const nH = Math.min(12, 1 + Math.round(S.pop / 50));
  for (let i = 0; i < 12; i++) A.house[i] += (((i < nH && S.plantT > .3) ? 1 : 0) - A.house[i]) * k(2.5);
  A.gran += ((S.plantT > .5 ? 1 : 0) - A.gran) * k(2.5);
  A.tent += ((S.plantT > .15 ? 0 : 1) - A.tent) * k(2.5);
  A.dry += ((S.drought > 0 ? 1 : 0) - A.dry) * k(1.2);
  if (S.play) { S.yr += dt * 600; if (S.yr >= 7000) { S.yr = 7000; S.play = false; } }
  const ya = yearsAgo(), asked = S.ans.map !== null;
  for (const s of SITES) {
    const vis = asked && (s.start === null || ya <= s.start);
    A.site[s.id] = (A.site[s.id] || 0) + ((vis ? 1 : 0) - (A.site[s.id] || 0)) * k(4);
  }
}

// --- readouts, state card, controls ------------------------------------------------------------------------------
let liveKey = '';
const cell = (label, value, extra = '') => `<div class="ff-stat"><span>${esc(label)}</span><b>${value}</b>${extra}</div>`;
function live() {
  const t = T[lang], v = lab.view;
  let ro, st, stats = '', two = false, glow, fine = '';
  if (S.sec === 'g' || S.sec === 'o') {
    const y = S.sec === 'g' ? 11500 : 5300, d = S.sec === 'g' ? t.sg : t.so;
    ro = [`≈ ${nf(y)}`, t.yago, '', '#d9984a']; glow = 'rgba(217, 152, 74, .3)';
    st = { emo: S.sec === 'g' ? '🏛️' : '🧊', title: t.secrets[S.sec][0], lead: d.lead, body: d.body, extra: '' };
  } else if (v === 'hunt') {
    glow = 'rgba(224, 164, 88, .26)';
    if (S.ans.hunt === null) { ro = ['?', '', '', '#d9984a']; st = { emo: '🤔', title: t.h.q, lead: t.h.lead0, body: '', extra: '' }; }
    else {
      const p = S.band, n = hn(p), km = nf(n.km, { maximumFractionDigits: 1 });
      ro = [nf(p), t.people, t.h.pills[n.st], ['#6fcf8f', '#f0a93b', '#ef5b4b'][n.st]];
      stats = cell(`👥 ${t.h.stPeople}`, nf(p)) + cell(`🍖 ${t.h.stFood}`, `${nf(n.gather)} / ${nf(p)}`) + cell(`🚶 ${t.h.stWalk}`, `${km} ${t.km}`);
      const tt = n.st === 0 ? [t.h.okT, t.h.okL, t.h.okB] : n.st === 1 ? [t.h.shortT, t.h.shortL(n.hungry, km), t.h.shortB] : [t.h.moveT, t.h.moveL, t.h.moveB];
      st = { emo: ['🏹', '😟', '🥾'][n.st], title: tt[0], lead: tt[1], body: tt[2], extra: '' };
      fine = t.h.fine;
    }
  } else if (v === 'farm') {
    glow = 'rgba(143, 191, 74, .26)';
    const sh = fsh(), pop = Math.round(S.pop), cap = Math.round(fcap(sh)), dr = S.drought > 0;
    if (S.ans.farm === null) { ro = [nf(30), t.people, '', '#8fbf4a']; st = { emo: '🤔', title: t.f.q, lead: t.f.lead0, body: '', extra: '' }; }
    else if (!S.planted) { ro = [nf(30), t.people, '', '#8fbf4a']; st = { emo: '🌱', title: t.f.preT, lead: t.f.preL, body: '', extra: '' }; }
    else {
      ro = [nf(pop), t.people, dr ? t.f.pillDrought : '', '#8fbf4a']; two = true;
      const hours = Math.round((5 + 4 * sh) * 2) / 2;
      stats = cell(`👥 ${t.f.stPeople}`, nf(pop)) + cell(`🌾 ${t.f.stHarvest}`, `${nf(dr ? Math.round(cap * .25) : cap)} ${t.people}`)
        + cell(`🏺 ${t.f.stGranary}`, `${Math.round(S.g * 100)} %`, `<div class="ff-bar"><i style="width:${Math.round(S.g * 100)}%"></i></div>`)
        + cell(`⏱️ ${t.f.stWork}`, `${nf(hours)} ${t.hrs}`, `<div class="ff-bar hrs"><i style="width:${Math.round((hours - 4) / 6 * 100)}%"></i><u style="left:${Math.round((5 - 4) / 6 * 100)}%" title="${esc(t.f.hunters)}"></u></div>`);
      if (dr && S.g > .001) st = { emo: '🏺', title: t.f.saveT, lead: t.f.saveL, body: '', extra: '' };
      else if (dr) st = { emo: '😟', title: t.f.emptyT, lead: t.f.emptyL, body: '', extra: '' };
      else if (sh === 0) st = { emo: '🌱', title: t.f.nofT, lead: t.f.nofL, body: '', extra: '' };
      else st = { emo: '🏘️', title: t.f.villT, lead: t.f.villL(nf(pop)), body: t.f.villB, extra: '' };
      fine = !dr && S.g < .3 && sh >= .2 ? `${t.f.fill} ${t.f.fine}` : t.f.fine;
    }
  } else {
    glow = 'rgba(78, 168, 255, .28)';
    if (S.ans.map === null) { ro = ['?', '', '', '#4ea8ff']; st = { emo: '🤔', title: t.m.q, lead: t.m.lead0, body: '', extra: '' }; }
    else {
      const ya = yearsAgo(), n = SITES.filter((s) => s.start !== null && !s.arrive && ya <= s.start).length;
      ro = [nf(ya), t.yago, n ? `🌱 ${n}` : '', '#4ea8ff'];
      const sel = S.sel && SITES.find((s) => s.id === S.sel), vis = sel && (sel.start === null || ya <= sel.start);
      if (sel && vis) { const d = t.sites[sel.id]; st = { emo: sel.emo || '🔷', title: d.name, lead: `${d.crops} · ${d.when}`, body: sel.arrive ? t.m.arrive : t.m.own, extra: '' }; }
      else if (n === 0) st = { emo: '🌍', title: t.m.zeroT, lead: t.m.zeroL, body: '', extra: '' };
      else st = { emo: '🌍', title: t.m.cntT(n), lead: t.m.cntL, body: t.m.cntB, extra: '' };
      fine = t.m.fine;
    }
  }
  if (S.sec) fine = '';
  else if (v !== 'map') fine = fine ? `${fine} ${t.fineModel}` : t.fineModel;
  st.extra = fine ? `<div class="ff-fine">${esc(fine)}</div>` : '';
  const key = JSON.stringify([ro, st, stats, two, glow, lang, v]);
  if (key === liveKey) return;
  liveKey = key;
  $('ffStats').className = `ff-stats${two ? ' two' : ''}`;
  $('ffStats').innerHTML = stats;
  lab.setGlow(glow);
  lab.setReadout(ro[0], ro[1], ro[2], ro[3]);
  lab.setState(st);
}

const askKey = { hunt: 'h', farm: 'f', map: 'm' };
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  // prediction card
  const a = t[askKey[v]], ans = S.ans[v], ok = OK[v];
  $('ffAsk').innerHTML = `<div class="ff-q">${esc(a.q)}</div><div class="ff-opts">${a.opts.map((o, i) =>
    `<button class="chip ff-opt ${ans !== null ? (i === ok ? 'good' : i === ans ? 'bad' : '') : ''}" data-ans="${i}"${ans !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>${ans !== null
    ? `<div class="ff-verdict" style="color:${ans === ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ans === ok ? t.right : t.notq)} <span style="font-weight:700;color:var(--soft)">${esc(ans === ok ? a.rightL : a.wrongL)}</span></div>` : ''}`;
  $('ffHunt').hidden = !(v === 'hunt' && ans !== null);
  $('ffFarm').hidden = !(v === 'farm' && ans !== null);
  $('ffMap').hidden = !(v === 'map' && ans !== null);
  $('ffPlantRow').hidden = S.planted;
  $('ffFields').hidden = !S.planted;
  $('ffBandL').textContent = t.h.slider;
  $('ffPlant').textContent = t.f.plant;
  $('ffShareL').textContent = `${t.f.slider}: ${S.share} %`;
  $('ffBad').textContent = t.f.bad; $('ffBad').disabled = S.drought > 0; $('ffReset').textContent = t.f.reset;
  $('ffYearL').textContent = `${t.m.slider}: ${nf(yearsAgo())}`;
  $('ffYearEnds').innerHTML = `<span>${nf(12000)}</span><span>${nf(5000)}</span>`;
  $('ffYear').value = S.yr;
  $('ffPlay').textContent = S.play ? t.m.pause : t.m.play;
  $('ffSites').innerHTML = SITES.map((s) => `<button class="chip ff-site ${S.sel === s.id ? 'on' : ''}" data-site="${s.id}">${s.emo || '◇'} ${esc(t.sites[s.id].name)}</button>`).join('');
  const open = secret.unlocked();
  $('ffSec').innerHTML = [['g', '🏛️'], ['o', '🧊']].map(([k, emo]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  // jobs on the farm picture
  jobsEl.hidden = !(v === 'farm' && S.planted && !S.sec);
  const jk = `${lang}${S.jobs}`;
  if (jobsEl.dataset.k !== jk) { jobsEl.dataset.k = jk; jobsEl.innerHTML = t.f.jobs.slice(0, S.jobs).map((j, i) => `<span class="ff-job"><em>${['🏺', '🔨', '🧵', '🤝'][i]}</em>${esc(j)}</span>`).join(''); }
  // facts
  const f = t.facts[v], show = v !== 'map' || S.ans.map !== null;
  lab.setFacts(show ? [{ emo: v === 'hunt' ? '🏛️' : v === 'farm' ? '🧊' : '🗺️', text: f.text, src: f.src }] : []);
  liveKey = ''; live();
}
function tickRender() { // keep slider-driven labels fresh without rebuilding the whole panel
  const t = T[lang];
  $('ffShareL').textContent = `${t.f.slider}: ${S.share} %`;
  $('ffYearL').textContent = `${t.m.slider}: ${nf(yearsAgo())}`;
}

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function selectSite(id) {
  const s = SITES.find((q) => q.id === id); if (!s) return;
  S.sel = S.sel === id ? null : id;
  if (S.sel && s.start !== null && yearsAgo() > s.start) { S.yr = 12000 - s.start; S.play = false; }
  sfx.click(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const v = lab.view;
  if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; sfx.click(); render(); if (S.sec) showStage(); return;
  }
  if (S.sec) S.sec = null;
  if (b.dataset.ans !== undefined) {
    if (S.ans[v] !== null) return;
    S.ans[v] = +b.dataset.ans; (S.ans[v] === OK[v] ? sfx.good : sfx.bad)();
    if (v === 'map') { S.yr = 0; S.play = true; }
    render(); showStage(); return;
  }
  if (b.id === 'ffPlant') { S.planted = true; S.pop = 30; S.g = 0; S.jobs = 0; S.plantT = 0; sfx.snap(); showStage(); }
  else if (b.id === 'ffBad') { if (S.planted && S.drought <= 0) { S.drought = 6; sfx.push(); } }
  else if (b.id === 'ffReset') { S.planted = false; S.drought = 0; S.share = 100; $('ffShare').value = 100; sfx.click(); }
  else if (b.id === 'ffPlay') { if (S.play) S.play = false; else { if (S.yr >= 7000) S.yr = 0; S.play = true; } sfx.click(); }
  else if (b.dataset.site) { selectSite(b.dataset.site); return; }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id; if (S.sec) { S.sec = null; render(); }
  if (id === 'ffBand') S.band = +ev.target.value;
  else if (id === 'ffShare') S.share = +ev.target.value;
  else if (id === 'ffYear') { S.yr = +ev.target.value; S.play = false; $('ffPlay').textContent = T[lang].m.play; }
  else return;
  tickRender(); live();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'map' || S.sec || S.ans.map === null) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  let best = null, bd = 28;
  for (const q of A.geo) { const d = Math.hypot(q.x - x, q.y - y); if (d < bd) { bd = d; best = q; } }
  if (best) selectSite(best.id);
});
render();
</script>
</body>
</html>
