const ease = (t) => t * t * (3 - 2 * t);
const backOut = (t) => { const k = 1.70158, u = t - 1; return 1 + (k + 1) * u * u * u + k * u * u; };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, r)); };
const TL = { k0: 0.45, k1: 1.25, q0: 1.3, q1: 1.55, u0: 1.65, u1: 2.25, eq: 2.4, done: 2.7 };
const prog = (t) => ({
  kf: clamp((t - TL.k0) / (TL.k1 - TL.k0), 0, 1), qa: ease(clamp((t - TL.q0) / (TL.q1 - TL.q0), 0, 1)),

});

let CW = 0; // logical width of the canvas being drawn (keeps pills inside)

// a text pill: dark or cream background, rounded, kept inside the canvas
function pill(c, text, cx, cy, fs, bg, fg, border) {
  c.save(); c.font = FONT(900, fs); c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + fs * 1.2, th = fs * 1.55, x = clamp(cx - tw / 2, 4, Math.max(4, CW - tw - 4));
  c.shadowColor = 'rgba(0,0,0,.3)'; c.shadowBlur = 6; c.shadowOffsetY = 2;
  c.fillStyle = bg; rr(c, x, cy - th / 2, tw, th, th / 2); c.fill();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
  if (border) { c.lineWidth = 1.5; c.strokeStyle = border; c.stroke(); }
  c.fillStyle = fg; c.fillText(text, x + tw / 2, cy + fs * 0.05);
  c.restore();
}

  if (pr && sc.m.kind === 'cmp') L.segs.filter((q) => !q.diff).forEach((q, i) => { if (sc.who[i]) face(c, sc.who[i], gx0 - 21, q.y + q.h / 2, 14); });
  if (plan.big) {
    c.save(); const sz = 26, cx0 = w / 2 + 14, rows = [5, 4, 3, 2, 1];
    rows.forEach((n, ri) => { for (let i = 0; i < n; i++) item(c, '🍎', 0, cx0 + (i - (n - 1) / 2) * sz * 0.82, y0 + zoneH - 28 - ri * sz * 0.7, sz, 1, 1, 0); });
    c.restore();
    pill(c, '500', cx0 + 4 * sz * 0.82 + 22, y0 + zoneH / 2, 15, GLOW, INK);
  }
  if (t < 0) for (const p of plan.pills) pill(c, p.text, p.x, p.y, 16, 'rgba(20,24,50,.82)', GLOW, GLOW);
  // the bars
  if (pr) {
    drawModel(c, L, pr, time);
    const q = L.segs.find((s) => s.q);
    if (q) burst(c, q.x + q.w / 2, q.y + q.h / 2, (t - TL.u1) / 0.9);
    if (sc.eq && t > TL.eq) { c.save(); c.globalAlpha = ease(clamp((t - TL.eq) / 0.3, 0, 1)); pill(c, sc.eq, w / 2, zy + zh - 28, clamp(w * 0.065, 22, 30), 'rgba(20,24,50,.88)', CREAM, GLOW); c.restore(); }
  }
  // items: resting, then flying into their bars along a curve
  for (const [i, it] of plan.items.entries()) {
    if (t < 0) { item(c, it.k, it.n, it.x0, it.y0, it.sz); continue; }
    const d = Math.min(0.05 * i, 0.55), p = clamp((t - d) / 0.8, 0, 1), e = ease(p);
    if (p >= 1 && t - d - 0.8 > 0.3) continue;
    const cx = (it.x0 + it.tx) / 2, cy = Math.min(it.y0, it.ty) - 46, u = 1 - e;
    const x = u * u * it.x0 + 2 * u * e * cx + e * e * it.tx, y = u * u * it.y0 + 2 * u * e * cy + e * e * it.ty;
    item(c, it.k, it.n, x, y, it.sz, 1 - 0.32 * e, p < 1 ? 1 : Math.max(0, 1 - (t - d - 0.8) / 0.3), 1 - e);
  }
}

// --- split view -----------------------------------------------------------------------------------------------
function drawSplit(c, w, h, dt, time) {
  const N = S.total, k = S.cut;
  S.cutV += (k - S.cutV) * Math.min(1, dt * 14);
  const bwid = Math.min(w - 40, 620), bx = (w - bwid) / 2, u = bwid / N, bh = clamp(h * 0.14, 46, 62), by = Math.round(h * 0.37 - bh / 2), xc = bx + S.cutV * u;
  const sz = clamp(u * 0.9, 13, 30);
  // the whole's items in a row above the bar
  for (let i = 0; i < N; i++) item(c, '🍎', 0, bx + (i + 0.5) * u, by - sz * 0.62 - 8, sz, 1, 1, 0.8);
  const A = { c: 'A', x: bx, y: by, w: S.cutV * u - 1.5, h: bh, v: k }, B = { c: 'B', x: xc + 1.5, y: by, w: (N - S.cutV) * u - 1.5, h: bh, v: N - k };
  const L = { u, ticks: false };
  drawSeg(c, A, 1, STATIC, time, L); drawSeg(c, B, 1, STATIC, time, L);
  c.save(); c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 1; c.beginPath();
  for (let i = 1; i < N; i++) { const x = bx + i * u; if (Math.abs(x - xc) > 5) { c.moveTo(x, by + bh * 0.25); c.lineTo(x, by + bh * 0.75); } }
  c.stroke(); c.restore();
  const fs = Math.round(bh * 0.58);
  drawLabel(c, A, 1, STATIC, time, fs); drawLabel(c, B, 1, STATIC, time, fs);
  // the whole: a brace underneath with its number
  drawBrace(c, { xs: bx, xe: bx + bwid, y: by + bh + 14, top: by + bh + 6, label: null }, 1, 15);
  pill(c, String(N), w / 2, by + bh + 14 + 7 + 18, 17, COL.W.g[1], '#fff', COL.W.o);
  // the divider with its knob
  c.save(); c.strokeStyle = '#fff'; c.lineWidth = 3; c.lineCap = 'round'; c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 6;
  c.beginPath(); c.moveTo(xc, by - 12); c.lineTo(xc, by + bh + 12); c.stroke();
  const ky = by + bh / 2;
  if (!S.dragged) { c.globalAlpha = 0.5 * (0.5 + 0.5 * Math.sin(time * 3)); c.lineWidth = 2; c.beginPath(); c.arc(xc, ky, 20 + 5 * Math.sin(time * 3), 0, 7); c.stroke(); c.globalAlpha = 1; }
  c.fillStyle = '#fff'; c.beginPath(); c.arc(xc, ky, 17, 0, 7); c.fill();
  c.shadowColor = 'transparent'; c.fillStyle = '#4A3A6A';
  c.beginPath(); c.moveTo(xc - 5, ky - 6); c.lineTo(xc - 10, ky); c.lineTo(xc - 5, ky + 6); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(xc + 5, ky - 6); c.lineTo(xc + 10, ky); c.lineTo(xc + 5, ky + 6); c.closePath(); c.fill();
  c.restore();
  if (time - S.qAt < 1) burst(c, xc, ky, (time - S.qAt) / 1);
  S.sg = { bx, u, y1: by - sz - 24, y2: by + bh + 60, N };
}

// small diagrams inside the three buttons of the "which bar fits" view
function drawPicks(time) {
  const round = PK[S.pi], r = R.pick;
  $('picks').querySelectorAll('canvas').forEach((el, i) => {
    const cw = el.clientWidth, ch = el.clientHeight; if (!cw || !ch) return;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    if (el.width !== Math.round(cw * d) || el.height !== Math.round(ch * d)) { el.width = Math.round(cw * d); el.height = Math.round(ch * d); }
    const c = el.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, cw, ch); CW = cw;
    const m = round.opts[i], g = { x: 40, y: 0, w: cw - 56, rowH: 22, gap: 6, fs: 12, tag: '2' };
    const rel = layout(m, g).bottom, L = layout(m, { ...g, y: Math.max(4, (ch - rel) / 2) });
    drawModel(c, L, r.rev && i === round.ok ? prog(time - r.t0) : STATIC, time);
  });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w;
  // the stage card
  const bg = c.createLinearGradient(0, 0, w * 0.4, h); bg.addColorStop(0, '#1E2547'); bg.addColorStop(1, '#2C356A');
  rr(c, 0.5, 0.5, w - 1, h - 1, 22); c.fillStyle = bg; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(255,255,255,.1)'; c.stroke();
  const rg = c.createRadialGradient(w * 0.2, 0, 0, w * 0.2, 0, w * 0.8); rg.addColorStop(0, 'rgba(255,255,255,.07)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = rg; rr(c, 0.5, 0.5, w - 1, h - 1, 22); c.fill();
  const v = lab.view;
  if (v === 'split') drawSplit(c, w, h, dt, time);
  else {
    drawStage(c, w, h, time);
    const r = R[v];
    if (r.rev && !r.vs && !(v === 'story' && S.sec) && time - r.t0 >= TL.done) { r.vs = true; render(); }
    if (v === 'pick') drawPicks(time);
  }
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function setCut(k) {
  k = clamp(k, 1, S.total - 1);
  if (k === S.cut) return;
  S.cut = k; sfx.tick(); checkQuest(); render();
}
function checkQuest() {
  const ok = SPLIT_DONE(S.total, S.cut);
  if (ok && !S.qOk) { S.qAt = now(); sfx.good(); }
  S.qOk = ok;
}
function cutFromEvent(ev) {
  const g = S.sg; if (!g) return;
  const rc = $('cv').getBoundingClientRect(), x = ev.clientX - rc.left, y = ev.clientY - rc.top;
  if (!S.drag && (y < g.y1 || y > g.y2)) return null;
  return Math.round((x - g.bx) / g.u);
}
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'split') return;
  const k = cutFromEvent(ev); if (k == null) return;
  S.drag = true; S.dragged = true; $('cv').setPointerCapture(ev.pointerId); setCut(k);
});
$('cv').addEventListener('pointermove', (ev) => { if (!S.drag) return; const k = cutFromEvent(ev); if (k != null) setCut(k); });
const endDrag = () => { S.drag = false; };
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag);

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'nb') {
    const r = R.story; if (r.rev) return;
    S.guess = i; r.rev = true; r.t0 = now(); r.vs = false; S.seen.story = true;
    (i === T[lang].st.stories[S.si].ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next') { S.si = (S.si + 1) % SD.length; S.guess = null; Object.assign(R.story, { rev: false, vs: false }); sfx.click(); }
  else if (act === 'pk') {
    const r = R.pick; if (r.rev) return;
    S.pick = i; r.rev = true; r.t0 = now(); r.vs = false; S.seen.pick = true;
    (i === PK[S.pi].ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'nextp') { S.pi = (S.pi + 1) % PK.length; S.pick = null; Object.assign(R.pick, { rev: false, vs: false }); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.sec0 = now(); S.kids = 3; sfx.click(); showStage();
  } else if (act === 'more') { S.kids = 4; S.sec0 = now(); sfx.snap(); }
  else if (act === 'tot') { const n = clamp(S.total + +b.dataset.d, 5, 20); if (n === S.total) return; S.total = n; S.cut = clamp(S.cut, 1, n - 1); S.cutV = S.cut; sfx.tick(); checkQuest(); }
  else if (act === 'nudge') { setCut(S.cut + +b.dataset.d); return; }
  else if (act === 'quest') { if (S.total !== 10) { S.total = 10; S.cut = clamp(S.cut, 1, 9); S.cutV = S.cut; sfx.click(); checkQuest(); } else return; }
  render();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v !== 'story') $('vd').innerHTML = '';
  if (v !== 'pick') $('pvd').innerHTML = '';
  $('secStory').style.display = v === 'story' ? '' : 'none';
  $('secPick').style.display = v === 'pick' ? '' : 'none';
  $('secSplit').style.display = v === 'split' ? '' : 'none';
  $('bub').style.display = v === 'split' ? 'none' : '';
  $('hint').style.display = v === 'split' ? '' : 'none';
  $('facts').style.display = v === 'split' ? '' : 'none';
  $('cv').style.touchAction = v === 'split' ? 'pan-y' : 'auto';
  const card = (k) => { const a = t.cards[k][S.seen[k] ? 'f' : 'n'] ?? t.cards[k].n; lab.setState({ emo: a[0], title: a[1], lead: a[2], body: a[3], extra: `<div class="fine">${esc(t.fine)}</div>` }); };
  if (v === 'story') renderStory(t, card); else if (v === 'pick') renderPick(t, card); else renderSplit(t);
}
function verdictHTML(t, ok, st, wrongText, next) {
  return `<div class="vv" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : wrongText)}</div><p>${esc(st.why)}</p><button class="btn" data-act="${next}">${esc(t.next)}</button>`;
}
function renderStory(t, card) {
  lab.setGlow('rgba(180, 140, 242, .26)');
  const open = secret.unlocked(), r = R.story, st = t.st.stories[S.si];
  const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = chip('share', '🍬') + chip('big', '🏔️');
  $('moreB').style.display = S.sec === 'share' && S.kids === 3 ? '' : 'none';
  $('moreB').textContent = `➕ ${t.sec.more}`;
  if (S.sec) {
    $('nbs').style.display = 'none'; $('vd').innerHTML = '';
    $('bub').textContent = S.sec === 'share' ? t.sec.shareText : t.sec.bigText;
    lab.setReadout(S.sec === 'share' ? `12 ÷ ${S.kids} = ${12 / S.kids}` : '800 − 500 = 300', '', '', '#B48CF2');
    card('story');
    return;
  }
  $('bub').textContent = st.text;
  $('nbs').style.display = '';
  $('nbs').innerHTML = st.o.map((o, i) => {
    const cls = !r.rev ? '' : i === st.ok ? 'good' : i === S.guess ? 'bad' : 'dim';
    return `<button class="nb ${cls}" data-act="nb" data-i="${i}"${r.rev ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  $('vd').innerHTML = r.vs ? verdictHTML(t, S.guess === st.ok, st, t.wrong, 'next') : '';
  if (r.vs) lab.setReadout(st.o[st.ok], st.eq, '', '#B48CF2'); else lab.setReadout('?', '', '', '#B48CF2');
  card('story');
}
function renderPick(t, card) {
  lab.setGlow('rgba(126, 200, 255, .24)');
  const r = R.pick, round = PK[S.pi], st = t.st.stories[round.story];
  $('bub').textContent = st.text;
  $('pq').textContent = t.p.q;
  $('picks').innerHTML = round.opts.map((_, i) => {
    const cls = !r.rev ? '' : i === round.ok ? 'good' : i === S.pick ? 'bad' : 'dim';
    return `<button class="pk ${cls}" data-act="pk" data-i="${i}" aria-label="${'ABC'[i]}"${r.rev ? ' disabled' : ''}><i>${'ABC'[i]}</i><canvas></canvas></button>`;
  }).join('');
  $('pvd').innerHTML = r.vs ? verdictHTML(t, S.pick === round.ok, st, t.p.wrong, 'nextp') : '';
  if (r.vs) lab.setReadout(st.o[st.ok], st.eq, '', '#7EC8FF'); else lab.setReadout('?', '', '', '#7EC8FF');
  card('pick');
}
function renderSplit(t) {
  lab.setGlow('rgba(255, 158, 122, .24)');
  const N = S.total, a = S.cut, b = N - a, ok = S.qOk;
  $('totL').textContent = t.s.total; $('totV').textContent = N;
  document.querySelectorAll('[data-act=tot]').forEach((x) => { x.disabled = (+x.dataset.d < 0 && N <= 5) || (+x.dataset.d > 0 && N >= 20); });
  document.querySelectorAll('[data-act=nudge]').forEach((x) => { x.disabled = (+x.dataset.d < 0 && a <= 1) || (+x.dataset.d > 0 && a >= N - 1); });
  $('questB').className = `chip quest${ok ? ' done' : ''}`;
  $('questB').textContent = `${ok ? '✅' : '🎯'} ${t.s.quest}`;
  const h = $('hint'); h.className = `hintp${ok ? ' ok' : ''}`; h.textContent = ok ? `✅ ${t.s.done}` : t.s.hint;
  const f = (x, op, y, z, r) => `<div class="fact"><span class="c${r[0]}">${x}</span> ${op} <span class="c${r[1]}">${y}</span> = <span class="c${r[2]}">${z}</span></div>`;
  $('facts').innerHTML = f(a, '+', b, N, 'ABW') + f(b, '+', a, N, 'BAW') + f(N, '−', a, b, 'WAB') + f(N, '−', b, a, 'WBA');
  lab.setReadout(`${a} + ${b} = ${N}`, '', '', '#FF9E7A');
  const c = t.cards.split.n;
  lab.setState({ emo: c[0], title: c[1], lead: c[2], body: c[3], extra: `<div class="fine">${esc(t.fine)}</div>` });
}
render();
</script>
