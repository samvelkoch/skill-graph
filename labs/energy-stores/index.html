  rows.forEach(([col, tx], i) => pill(c, tx, lx, gy0 + 12 + i * 24, { dot: col }));
  pill(c, t.m.sq, lx, gy0 + 10 * cs - 10, { color: '#c6cde0' });
  c.restore();
}

// --- the loop ----------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view; CW = w;
  if (v === 'machines') { sceneMachines(c, w, h, dt, time); readout(); return; }
  if (S.wait > 0) { S.wait -= dt; if (S.wait <= 0) { sim.run = true; S.wait = -1; } }
  if (sim.run) simStep(dt);
  const secOn = S.sec !== null;
  const curT = v === 'ramp' && (S.rAns !== null || secOn) ? 1 : 0;
  S.cur = clamp(S.cur + (curT ? 1 : -1) * dt / 0.9, 0, 1);
  S.tot = clamp(S.tot + (answered() ? 1 : -1) * dt / 0.5, 0, 1);
  S.axis += (Math.max(2000, sim.E * 1.04) - S.axis) * Math.min(1, dt * 6);
  sceneRamp(c, w, h, time);
  readout();
});

// --- controls ----------------------------------------------------------------------------------------------
$('ctrlBody').innerHTML = `
  <div id="esRamp">
    <div id="rQBox"><p class="es-q" id="rQ"></p><div class="es-opts" id="rOpts"></div></div>
    <div class="es-sl"><label id="rHL" for="rH"></label><input type="range" class="big" id="rH" min="1" max="5" step="0.5" style="--track:linear-gradient(90deg,#2d6fe0,#7cc4ff)"><b id="rHV"></b></div>
    <div class="row2"><button class="chip" data-act="restart" id="rRe"></button><button class="chip es-push" data-act="push" id="esPush"></button></div>
  </div>
  <div id="esFric">
    <div id="fQBox"><p class="es-q" id="fQ"></p><div class="es-ths" id="fOpts"></div></div>
    <div class="es-sl"><label id="fHL" for="fH"></label><input type="range" class="big" id="fH" min="1" max="5" step="0.5" style="--track:linear-gradient(90deg,#2d6fe0,#7cc4ff)"><b id="fHV"></b></div>
    <div class="es-sl"><label id="fFL" for="fF"></label><div><input type="range" class="big" id="fF" min="0" max="2" step="1" style="--track:linear-gradient(90deg,#4ea8ff,#ffb347,#ff5a4d)"><div class="es-ticks" id="fTicks"></div></div><b id="fFV"></b></div>
    <div class="row2"><button class="chip" data-act="restart" id="fRe"></button></div>
  </div>
  <div id="esMach">
    <div class="chips" id="mDevs"></div>
    <p class="es-q" id="mQ" style="margin-top:12px"></p>
    <div class="es-sl"><label id="mGL" for="mG"></label><input type="range" class="big" id="mG" min="0" max="100" step="1" style="--track:linear-gradient(90deg,#ff5a4d,#ffd84a)"><b id="mGV"></b></div>
    <div class="row2"><button class="btn es-main" data-act="mshow" id="mMain"></button></div>
  </div>
  <div class="es-sec"><div class="chips" id="esSecs"></div></div>`;

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function onView() {
  if (S.sec && lab.view !== 'ramp') S.sec = null;
  simReset();
  if (lab.view !== 'machines' && answered()) startRun(0.5);
  render();
}
function restart() { simReset(); if (answered()) startRun(0.35); }
function toggleSecret(k) {
  if (!secret.unlocked()) return secret.open();
  if (S.sec === k) { S.sec = null; simReset(); startRun(0.35); sfx.click(); render(); return; }
  S.sec = k;
  if (lab.view !== 'ramp') { lab.view = 'ramp'; lab.renderChrome(); }
  if (S.rAns === null) S.rAns = 'skip';
  if (k === 'push') S.h0 = 3;
  simReset(); startRun(0.4); sfx.click(); render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-dev], [data-sec]'); if (!b || b.disabled) return;
  if (b.dataset.dev) { S.mdev = b.dataset.dev; sfx.click(); render(); return; }
  if (b.dataset.sec) { toggleSecret(b.dataset.sec); return; }
  const act = b.dataset.act, k = b.dataset.k;
  if (act === 'rpick' && S.rAns === null) { S.rAns = k; (k === 'same' ? sfx.good : sfx.bad)(); startRun(0.7); showStage(); }
  else if (act === 'fpick' && S.fAns === null) { S.fAns = k; (k === 'flat' ? sfx.good : sfx.bad)(); startRun(0.5); showStage(); }
  else if (act === 'restart') { restart(); sfx.click(); }
  else if (act === 'push') {
    const j = M * sim.g;
    if (sim.E / j + 1 > 6.01 || sim.rest) return;
    sim.E += j; sim.legs += j; if (Math.abs(sim.u) < 1e-9) sim.u = sim.dir * 0.001; sfx.push();
  } else if (act === 'mshow') {
    const md = S.m[S.mdev];
    if (md.done) { md.done = false; md.p = 0; sfx.click(); }
    else { md.done = true; (Math.abs(md.g - MACH[S.mdev]) <= 10 ? sfx.good : sfx.bad)(); showStage(); }
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, val = +ev.target.value;
  if (id === 'rH' || id === 'fH') { S.h0 = val; restart(); }
  else if (id === 'fF') { S.fric = val; restart(); }
  else if (id === 'mG') { const md = S.m[S.mdev]; if (!md.done) md.g = val; }
  else return;
  sfx.tick(); render();
});

// --- the readout, called from the loop and from render() -----------------------------------------------------
let roKey = '';
function readout() {
  const t = T[lang], v = lab.view, A = t.ab, uJ = t.uJ;
  let val, sub = '', pill = '', color;
  if (v === 'machines') {
    const id = S.mdev, md = S.m[id];
    color = '#ffd84a';
    if (!md.done) { val = `<span class="es-ro">${t.m.roq}</span>`; sub = t.m.inn[id]; pill = `${t.m.guess}: ${md.g} ${uJ}`; }
    else { const u = MACH[id]; val = `<span class="es-ro">${esc(t.m.ro(u, 100 - u))}</span>`; sub = ''; pill = `${t.m.about} ${u} %`; }
  } else {
    const V = vals(), tot = Math.round(V.E), r0 = Math.round(V.Ep), r2 = Math.round(V.Eth), r1 = tot - r0 - r2;
    if (v === 'ramp') {
      color = '#4ea8ff';
      val = `<span class="es-ro">${A[0]} ${r0} ${uJ} + ${A[1]} ${r1} ${uJ} = ${tot} ${uJ}</span>`;
      pill = answered() ? `v = ${fmt(Math.abs(sim.u))} ${t.uV}` : '';
    } else {
      color = '#ff5a4d';
      if (S.fAns === null) val = `<span class="es-ro">${A[0]} ${r0} ${uJ}</span>`;
      else { val = `<span class="es-ro">${A[2]} ${r2} ${uJ}</span>`; sub = t.f.ro; pill = `${t.cTotal} ${tot} ${uJ}`; }
    }
    if (S.sec === 'push' || S.sec === 'moon') { pill = `v = ${fmt(Math.abs(sim.u))} ${t.uV}`; }
  }
  const key = [val, sub, pill, lang].join('|');
  if (key === roKey) return;
  roKey = key; lab.setReadout(val, sub, pill, color);
}

// --- one render per change: controls, state card, facts ----------------------------------------------------
const THUMB = { down: 'M12 24 L90 44', flat: 'M12 24 L90 24', up: 'M12 24 L90 4' };
const thumb = (k) => `<svg viewBox="0 0 102 52" aria-hidden="true"><rect x=".5" y=".5" width="101" height="51" rx="9" fill="#0c0f1e" stroke="rgba(130,145,190,.35)"/>
  <path d="M10 6V46H96" fill="none" stroke="#646C84" stroke-width="1.5"/><path d="${THUMB[k]}" transform="translate(0 1)" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg>`;
const legend = (n) => `<div>${T[lang].leg.slice(0, n).map((x, i) => `<span class="es-lg"><i style="background:${COL[i]}"></i>${esc(x)}</span>`).join('')}</div>`;
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('esRamp').hidden = v !== 'ramp'; $('esFric').hidden = v !== 'friction'; $('esMach').hidden = v !== 'machines';
  // secrets row (always visible; locked until the quiz is passed)
  const open = secret.unlocked();
  $('esSecs').innerHTML = [['push', '🚀'], ['moon', '🌙']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const setRange = (id, val) => { const el = $(id); if (el && el.value !== String(val)) el.value = val; };
  if (v === 'ramp') {
    lab.setGlow(S.sec === 'moon' ? 'rgba(150,160,200,.22)' : 'rgba(78,168,255,.28)');
    const skip = S.rAns === 'skip';
    $('rQBox').hidden = skip;
    $('rQ').textContent = t.r.q;
    $('rOpts').innerHTML = ['lower', 'same', 'higher'].map((k, i) => `<button class="es-opt ${S.rAns !== null ? (k === 'same' ? 'good' : k === S.rAns ? 'bad' : 'dim') : ''}" data-act="rpick" data-k="${k}"${S.rAns !== null ? ' disabled' : ''}>${esc(t.r.o[i])}</button>`).join('');
    $('rHL').textContent = t.hL; $('rHV').textContent = `${fmtH(S.h0)} ${t.uM}`; setRange('rH', S.h0);
    $('rRe').textContent = t.re;
    const pushOn = S.sec === 'push', j = Math.round(M * sim.g);
    $('esPush').hidden = !pushOn;
    $('esPush').textContent = sim.E / (M * sim.g) + 1 > 6.01 ? t.sp.tired : t.sp.push(j);
    $('esPush').disabled = sim.E / (M * sim.g) + 1 > 6.01;
    let st;
    const g = sim.g, vb = Math.sqrt(2 * g * S.h0);
    if (S.sec === 'push') {
      st = sim.legs > 0 ? { emo: '🚀', title: t.sp.t1(0)[0], lead: t.sp.t1(Math.round(sim.legs))[1], body: t.sp.b1(Math.round(sim.E), Math.round(sim.E0), Math.round(sim.legs)) }
        : { emo: '🚀', title: t.sp.t0[0], lead: t.sp.t0[1], body: '' };
      st.extra = legend(2);
    } else if (S.sec === 'moon') st = { emo: '🌙', title: t.mo.t, lead: t.mo.l, body: t.mo.b(Math.round(sim.E0)), extra: legend(2) };
    else if (S.rAns === null) st = { emo: '🤔', title: t.r.q, lead: t.r.hold[1], body: '', extra: '' };
    else st = { emo: S.rAns === 'same' ? '✅' : '🛹', title: S.rAns === 'same' ? t.r.ok : t.r.no, lead: t.r.lead, body: `${t.r.body} ${t.r.v(fmt(vb))}`, extra: legend(2) };
    lab.setState(st);
    lab.setFacts(S.sec ? [] : [{ emo: '💡', ...t.facts.apple }]);
  } else if (v === 'friction') {
    lab.setGlow('rgba(255,110,70,.26)');
    $('fQ').textContent = t.f.q;
    $('fOpts').innerHTML = ['down', 'flat', 'up'].map((k, i) => `<button class="es-th ${S.fAns !== null ? (k === 'flat' ? 'good' : k === S.fAns ? 'bad' : 'dim') : ''}" data-act="fpick" data-k="${k}"${S.fAns !== null ? ' disabled' : ''}>${thumb(k)}<span>${esc(t.f.o[i])}</span></button>`).join('');
    $('fHL').textContent = t.hL; $('fHV').textContent = `${fmtH(S.h0)} ${t.uM}`; setRange('fH', S.h0);
    $('fFL').textContent = t.fL; $('fFV').textContent = t.fo[S.fric]; setRange('fF', S.fric);
    $('fTicks').innerHTML = t.fo.map((x) => `<span>${esc(x)}</span>`).join('');
    $('fRe').textContent = t.re;
    let st;
    if (S.fAns === null) st = { emo: '🤔', title: t.f.q, lead: t.f.hold[1], body: '', extra: '' };
    else {
      const th = Math.round(vals().Eth), e = Math.round(sim.E0), c0 = S.fric === 0;
      st = { emo: S.fAns === 'flat' ? '✅' : '🔥', title: S.fAns === 'flat' ? t.f.ok : t.f.no, lead: t.f.lead,
        body: c0 ? t.f.t0[1] : sim.rest ? t.f.stop(th, e) : t.f.t1[1], extra: legend(3) };
    }
    lab.setState(st);
    lab.setFacts((S.fAns === null ? [t.facts.brake] : [t.facts.joule, t.facts.brake]).map((f) => ({ emo: '💡', ...f })));
  } else {
    lab.setGlow('rgba(255,216,74,.22)');
    const id = S.mdev, md = S.m[id], nm = t.m.dev[id][0];
    $('mDevs').innerHTML = Object.keys(MACH).map((k) => `<button class="chip es-dev ${k === id ? 'on' : ''}" data-dev="${k}">${t.m.dev[k][1]} ${esc(t.m.dev[k][0])}</button>`).join('');
    $('mQ').textContent = t.m.q[id];
    $('mGL').textContent = t.m.guessL; $('mGV').textContent = `${md.g} %`; setRange('mG', md.g); $('mG').disabled = md.done;
    $('mMain').textContent = md.done ? t.again : t.show;
    let st;
    if (!md.done) { const h = t.m.hold(t.m.use[id]); st = { emo: '🤔', title: h[0], lead: h[1], body: '', extra: '' }; }
    else {
      const u = MACH[id], d = Math.abs(md.g - u), verdict = d <= 10 ? t.m.ok : t.m.no;
      st = { emo: d <= 10 ? '✅' : '🤔', title: `${verdict} ${t.m.st(nm, u)}`, lead: t.m.lead(u), body: t.m.body(t.m.note[id]), extra: '' };
    }
    lab.setState(st);
    const fl = [t.facts.brake]; if (S.m.petrol.done) fl.unshift(t.facts.petrol);
    lab.setFacts(fl.map((f) => ({ emo: '💡', ...f })));
  }
  roKey = ''; readout();
}
simReset();
render();
</script>
</body>
