  const m = mode(), rg = { x0: 14, y0: 52, x1: w - 14, y1: h - 14 }, rw = rg.x1 - rg.x0, rh = rg.y1 - rg.y0, done = phase(m) === 'done';

// --- the scene -----------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CVW = w;
  const m = mode();
  if (m === 'socks') { drawSocks(c, w, h, time); return; }
  const t = T[lang], L = layout(w, h), done = phase(m) === 'done';
  drawBg(c, w, h, L.bg);

  for (const id of [...A.keys()]) if (!ids.has(id)) A.delete(id);
  for (const q of L.t) {
    let a = A.get(q.id);
    if (!a) { a = { id: q.id, x: q.x + (hs(q.id, 9) - 0.5) * 60, y: h + 50 + hs(q.id, 8) * 40, mv: 0, ph: hs(q.id) * 6, wait: hs(q.id, 7) * 0.5, lone: 0 }; A.set(q.id, a); }

  }

const RANGE = { n: [1, 20], ja: [1, 9], jb: [1, 9], R: [1, 6], C: [1, 6], zn: [0, 6] };

  S.guess[m] = v; S.ph[m] = 'done'; startWave();
  if (m === 'join') { const k = `${S.ja % 2 ? 'o' : 'e'}${S.jb % 2 ? 'o' : 'e'}`; S.met[k] = true; S.lastMet = k; }

$('ctrlBody').addEventListener('click', (ev) => {

    else if (view === 'join') { S.ja = rnd(1, 9); S.jb = rnd(1, 9); }
    else { S.R = rnd(1, 6); S.C = rnd(1, 6); }

  } else if (act === 'sec') {

  } else if (act === 'pull') pullSock();
  else if (act === 'sredo') { socksReset(S.socksK); sfx.click(); }

  else if (view === 'join' && !socks) steps = stepper(t.ui.ga, 'ja', S.ja) + stepper(t.ui.gb, 'jb', S.jb) + `<button class="chip" data-act="rand">${esc(t.ui.rand)}</button>`;
  else if (view === 'rows' && !socks) steps = stepper(t.ui.rowsL, 'R', S.R) + stepper(t.ui.perL, 'C', S.C) + `<button class="chip" data-act="rand">${esc(t.ui.rand)}</button>`;

  $('pvQ').innerHTML = qh;
  $('pvBtns').innerHTML = asking && done ? `<button class="pr-b main" data-act="again">${esc(t.ui.again)}</button>` : '';
  $('pvBtns').style.display = asking && done ? '' : 'none';
  // socks controls
  const sk = S.sock;
  $('pvSock').style.display = socks ? '' : 'none';
  $('pvSock').innerHTML = socks && sk ? `<button class="chip ${sk.k === 2 ? 'on' : ''}" data-act="scol" data-k="2">${esc(t.sock.c2)}</button><button class="chip ${sk.k === 3 ? 'on' : ''}" data-act="scol" data-k="3">${esc(t.sock.c3)}</button>
    <button class="pr-b main" data-act="pull"${sk.pair ? ' disabled' : ''}>${esc(t.sock.pull)}</button><button class="pr-b" data-act="sredo">${esc(t.sock.redo)}</button>` : '';
  const sc = (k, emo) => `<button class="chip secret ${un ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${un ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('pvSec').innerHTML = sc('zero', '0️⃣') + sc('socks', '🧦');

  // facts
  const f = t.facts[view]; lab.setFacts(f ? [f] : []);

  // readout + state
  if (socks) return renderSocks(t);
  if (m === 'pairs' || zero) return renderPairs(t, zero);
  if (m === 'join') return renderJoin(t);
  return renderRows(t);
}

function renderSocks(t) {
  const sk = S.sock, n = sk.pulled.length;
  lab.setReadout(String(n), t.sock.sub, sk.pair ? t.sock.pair : '', '#f5c518');
  const w = S.worst[sk.k];
  if (sk.pair) lab.setState({ emo: '🧦', title: t.sock.found(n), lead: t.sock.lead(sk.k), body: t.sock.best(w), extra: '' });
  else lab.setState({ emo: '🌙', title: t.sock.st[0], lead: t.sock.st[1], body: w ? t.sock.best(w) : '', extra: '' });
}
function parityBlock(t, n) {
  const k = n >> 1, pw = t.pairsW(k);
  if (n === 1) return t.pr.one;
  return n % 2 ? t.pr.odd(n, k, pw) : t.pr.even(n, k, pw);
}
function renderPairs(t, zero) {
  const n = zero ? S.zn : S.n, done = phase(zero ? 'zero' : 'pairs') === 'done', k = n >> 1;
  if (!done) {
    lab.setReadout(String(n), t.kidsW(n).replace(/^\d+\s*/, ''), '', '#f5a524');
    lab.setState({ emo: '👫', title: t.pr.st[0], lead: t.pr.st[1], body: '', extra: '' });
    return;
  }
  const last = String(n).slice(-1), head = String(n).slice(0, -1);
  const val = `${head}<span style="color:#ffd84d">${last}</span>`;
  const eq = n === 0 ? '0 = 2 × 0' : n % 2 ? (k ? `${n} = 2 × ${k} + 1` : `${n} = 2 × 0 + 1`) : `${n} = 2 × ${k}`;
  lab.setReadout(val, eq, n % 2 ? t.ui.odd : t.ui.even, '#f5a524');
  if (zero) {
    lab.setState({ emo: '0️⃣', title: t.zero.title, lead: n === 0 ? t.zero.lead0 : parityBlock(t, n), body: n === 0 ? t.zero.hint : t.pr.rule, extra: '' });
    return;
  }
  const ok = S.guess.pairs === truthOf('pairs');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ui.right : t.ui.notq, lead: parityBlock(t, n), body: t.pr.rule, extra: '' });
}
function rulesTable(t) {
  const rows = ['ee', 'oo', 'eo', 'oe'].map((key) => {
    const a = key[0], b = key[1], res = a === b ? 'e' : 'o', met = S.met[key];
    return `<div class="pr-rule ${met ? 'met' : ''} ${S.lastMet === key && phase('join') === 'done' ? 'new' : ''}">${met ? `${esc(wordsOf(t, a))} + ${esc(wordsOf(t, b))} = ${esc(wordsOf(t, res))}` : '? + ? = ?'}</div>`;
  }).join('');
  return `<div class="pr-rules"><div class="pr-rh">${esc(t.jn.rules)}</div>${rows}</div>`;
}
function renderJoin(t) {
  const a = S.ja, b = S.jb, done = S.ph.join === 'done', pa = a % 2 ? 'o' : 'e', pb = b % 2 ? 'o' : 'e', res = pa === pb ? 'e' : 'o';
  if (!done) {
    lab.setReadout(`${a} + ${b}`, t.kidsW(2).replace(/^\d+\s*/, ''), '', '#22a5c8');
    lab.setState({ emo: '🤝', title: t.jn.st[0], lead: t.jn.st[1], body: '', extra: rulesTable(t) });
    return;
  }
  const rule = `${wordsOf(t, pa)} + ${wordsOf(t, pb)} = ${wordsOf(t, res)}`, ok = S.guess.join === truthOf('join');
  lab.setReadout(`${a} + ${b} = ${a + b}`, rule, '', '#22a5c8');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ui.right : t.ui.notq, lead: pa === 'o' && pb === 'o' ? t.jn.oo : pa === 'e' && pb === 'e' ? t.jn.ee : t.jn.eo, body: rule, extra: rulesTable(t) });
}
function renderRows(t) {
  const R = S.R, C = S.C, tot = R * C, done = S.ph.rows === 'done';
  if (!done) {
    lab.setReadout(`${R} × ${C}`, '', '', '#e17fb0');
    lab.setState({ emo: '💃', title: t.rw.st[0], lead: t.rw.st[1], body: '', extra: '' });
    return;
  }
  const ok = S.guess.rows === truthOf('rows'), anyEven = R % 2 === 0 || C % 2 === 0;
  lab.setReadout(`${R} × ${C} = ${tot}`, tot % 2 ? t.ui.odd : t.ui.even, anyEven ? t.rw.r1 : t.rw.r2, '#e17fb0');
  const lead = C % 2 === 0 ? t.rw.ce(C) : R % 2 === 0 ? t.rw.re(R) : t.rw.oo;
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ui.right : t.ui.notq, lead, body: `${R} × ${C} = ${tot}`, extra: '' });
}
render();
</script>
