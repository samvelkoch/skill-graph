function wrap(c, text, maxW) {
  const lines = []; let cur = '';
  for (const w of text.split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

const showStage = () => {

function readout(time) {
  const t = T[lang], v = lab.view;
  if (v === 'day') {
    if (S.sec === 'word') return ['δημοκρατία', '', '', ACC.day];
    if (S.sec === 'aristides') return ['Ἀριστείδης', '', '', ACC.day];
    const D = S.day, done = D.i + (D.pick !== null ? 1 : 0), dots = [0, 1, 2, 3].map((i) => (i < done ? '●' : '○')).join(' ');
    return [`${done}/4`, dots, D.i >= 4 ? t.d.both : '', ACC.day];
  }
  if (v === 'vote') {

    if (V.stage === 'q1' || V.stage === 'q2') return ['?', '', '', ACC.vote];
    if (V.stage === 'q1r') { const tt = time - V.t1; return tt > 2.6 ? [`${n}/${m}`, '', t.v.count(n, m), ACC.vote] : ['?', '', '', ACC.vote]; }

  }

  lastRO = ''; syncReadout(now());
}

function pick(k) {
  const v = lab.view;
  if (v === 'day') {
    const D = S.day; if (D.i >= 4 || D.pick !== null) return;
    S.sec = null; D.pick = k; D.t0[D.i] = now(); (k === T[lang].d.ok[D.i] ? sfx.good : sfx.bad)();
  } else if (v === 'vote') {
    const V = S.vote;
    if (V.stage === 'q1') { V.p1 = k; V.stage = 'q1r'; V.t1 = now(); (k === 2 ? sfx.good : sfx.bad)(); }
    else if (V.stage === 'q2') { V.p2 = k; V.stage = 'q2r'; V.t2 = now(); (k === 0 ? sfx.good : sfx.bad)(); }
    else return;
  } else {
    const Pt = S.pots;
    if (Pt.stage === 'q1') { Pt.p1 = k; Pt.stage = 'q1r'; Pt.t1 = now(); Pt.landed = 0; (k === 1 ? sfx.good : sfx.bad)(); }
    else if (Pt.stage === 'q2') { Pt.p2 = k; Pt.stage = 'q2r'; Pt.t2 = now(); Pt.clinks = 0; (k === 1 ? sfx.good : sfx.bad)(); }
    else return;
  }
  showStage(); render();
}
function next() {
  const v = lab.view;
  if (v === 'day') { const D = S.day; if (D.pick === null) return; D.i++; D.pick = null; }
  else if (v === 'vote' && S.vote.stage === 'q1r') S.vote.stage = 'q2';
  else if (v === 'pots' && S.pots.stage === 'q1r') S.pots.stage = 'q2';
  sfx.click(); render();
}
function again() {
  const v = lab.view;
  if (v === 'day') S.day = { i: 0, pick: null, t0: [null, null, null, null] };
  else if (v === 'vote') S.vote = freshVote(); else S.pots = freshPots();
  sfx.click(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'pick') pick(+b.dataset.k);
  else if (a === 'next') next();
  else if (a === 'again') again();
  else if (a === 'decide') { S.vote.banner = true; sfx.good(); }
  else if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.secT0 = now(); sfx.click(); render();
  }
});
// free play: tap a seated citizen to raise or lower the hand; a tap on a secret replays it
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'day' && S.sec) { S.secT0 = now(); return; }
  const V = S.vote;
  if (lab.view !== 'vote' || V.stage !== 'q2r' || !V.wd) return;
  let best = null, bd = 1e9;
  for (const g of voteGeo) { const d = Math.hypot(g.x - x, g.y - y); if (d < g.r && d < bd) { best = g; bd = d; } }
  if (!best) return;
  V.up[best.rank] = !V.up[best.rank]; V.banner = false; sfx.tick();
});
render();
</script>
