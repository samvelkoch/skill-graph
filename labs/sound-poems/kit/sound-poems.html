* { box-sizing: border-box; }

  background: radial-gradient(55% 55% at 62% 42%, var(--glow), transparent 70%), radial-gradient(110% 85% at 50% 115%, rgba(45, 60, 120, .2), transparent 55%); }

.card { background: var(--panel); border: 1px solid var(--stroke); border-radius: 20px;

/* top bar */
.bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 18px 26px 10px 30px;

.seg { display: flex; padding: 3px; border-radius: 999px; }

/* layout: hero + state card on the left, the scene and its controls on the right, a gauge on the far right */
.lab { display: grid; gap: 18px 22px; padding: 6px 26px 22px 30px; min-height: calc(100vh - 72px);
  grid-template-columns: minmax(300px, 400px) minmax(0, 1fr) 64px;
  grid-template-rows: auto 1fr auto;
  grid-template-areas: 'hero stage gauge' 'state stage gauge' 'state ctrl gauge'; }
#hero { grid-area: hero; padding-top: 18px; }

// a line as HTML: letters of the target sound(s) marked; in check mode, sounds above the target in red, unsettled spots in yellow
function lineHTML(line, keys, nextFirst = '', check = false) {
  const ws = words(line);
  let out = '', at = 0;
  ws.forEach((w, n) => {
    out += esc(line.slice(at, w.start));
    const next = ws[n + 1]?.w ?? nextFirst;
    const marks = new Map();
    keys.forEach((k, i) => { for (const h of highlight(w.w, k, next).hits) marks.set(h, i ? 'b' : 'a'); });
    if (check) {
      const top = Math.max(...keys.map((k) => RANK[k]));
      for (const k of ORDER) if (RANK[k] > top) for (const h of highlight(w.w, k, next).hits) marks.set(h, 'x');
      const info = highlight(w.w, keys[0], next).a;
      if (info.ambiguous || info.sounds.some((s) => s.amb && (keys.includes(s.k) || keys.includes(s.amb) || RANK[s.amb] > top))) {
        for (const k of ['s', 'z']) for (const h of highlight(w.w, k, next).hits) if (marks.get(h) !== 'x') marks.set(h, 'q');
        if (info.ambiguous) [...w.w].forEach((_, i) => marks.set(i, marks.get(i) ?? 'q'));
      }
    }
    out += `<span class="w" data-i="${n}">${[...w.w].map((c, i) => (marks.has(i) ? `<mark class="${marks.get(i)}">${esc(c)}</mark>` : esc(c))).join('')}</span>`;
    at = w.end;
  });
  return out + esc(line.slice(at));
}
const poemHTML = (p, keys) => p.lines.map((l, i) => `<p>${lineHTML(l, keys, words(p.lines[i + 1] ?? '')[0]?.w ?? '')}</p>`).join('');

const pad = { idx: -1, strokes: [], color: '#2b2b2b', cur: null };

const padCv = $('padCv'), pctx = padCv.getContext('2d');
function padDraw() {
  pctx.clearRect(0, 0, 600, 600);
  pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  for (const s of pad.strokes) {
    pctx.strokeStyle = s.c; pctx.lineWidth = 14; pctx.beginPath();
    s.p.forEach(([x, y], i) => (i ? pctx.lineTo(x, y) : pctx.moveTo(x, y)));
    if (s.p.length === 1) pctx.lineTo(s.p[0][0] + 0.1, s.p[0][1]);
    pctx.stroke();
  }
}
const padPt = (ev) => { const r = padCv.getBoundingClientRect(); return [(ev.clientX - r.left) / r.width * 600, (ev.clientY - r.top) / r.height * 600]; };
padCv.addEventListener('pointerdown', (ev) => { padCv.setPointerCapture(ev.pointerId); pad.cur = { c: pad.color, p: [padPt(ev)] }; pad.strokes.push(pad.cur); padDraw(); });
padCv.addEventListener('pointermove', (ev) => { if (!pad.cur) return; pad.cur.p.push(padPt(ev)); padDraw(); });

// save the whole sheet as one PNG (share on phones, download elsewhere)
async function saveSheet(p) {
  try {
    const d = getDraw(p), W = 1080, PAD = 40, S = 180, G = 16, per = Math.floor((W - 2 * PAD + G) / (S + G)), ROW = S + 26 + 20 + 22;
    const loadImg = (src) => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
    const svgImg = (svg) => loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(/xmlns=/.test(svg) ? svg : svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"')));
    let n = 0;
    const rows = []; // { x, y, w, v }
    const titleH = 44 + 28;
    let y = PAD + titleH;
    p.lines.forEach((l, li) => {
      const ws = words(l); const rs = Math.max(1, Math.ceil(ws.length / per));
      ws.forEach((w, wi) => { rows.push({ x: PAD + (wi % per) * (S + G), y: y + Math.floor(wi / per) * ROW, w: w.w, i: n++ }); });
      y += rs * ROW + (li < p.lines.length - 1 ? 18 : 0);
    });
    const H = y + 28 + PAD;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#222'; c.textBaseline = 'top'; c.textAlign = 'left'; c.font = '700 44px "EB Garamond", Georgia, serif';
    c.fillText(p.title, PAD, PAD);
    // dashed separators between poem lines
    c.strokeStyle = '#bbb'; c.lineWidth = 1.5; c.setLineDash([8, 8]);
    let sy = PAD + titleH;
    p.lines.forEach((l, li) => { const rs = Math.max(1, Math.ceil(words(l).length / per)); sy += rs * ROW; if (li < p.lines.length - 1) { c.beginPath(); c.moveTo(PAD, sy + 4); c.lineTo(W - PAD, sy + 4); c.stroke(); sy += 18; } });
    c.setLineDash([]);
    for (const r of rows) {
      c.beginPath(); c.roundRect(r.x, r.y, S, S, 18); c.fillStyle = '#fbf7ee'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#d9d2c3'; c.stroke();
      const v = d[r.i], small = SMALL[r.w.toLowerCase()];
      const cd = v && v.startsWith('card:') ? cardById.get(v.slice(5)) : null;
      if (v && !v.startsWith('card:')) c.drawImage(await loadImg(v), r.x, r.y, S, S);
      else if (cd && cd.e) { c.fillStyle = '#222'; c.font = '120px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'center'; c.fillText(cd.e, r.x + S / 2, r.y + S / 2 + 6); }
      else { const g = cd ? glyph(cd.g) : !v && hints && small ? glyph(small) : ''; if (g) c.drawImage(await svgImg(g), r.x + 10, r.y + 10, S - 20, S - 20); }
      c.fillStyle = '#222'; c.font = '700 26px Nunito, system-ui, sans-serif'; c.textBaseline = 'top'; c.textAlign = 'center';
      c.fillText(r.w, r.x + S / 2, r.y + S + 10, S + G - 2);
    }
    c.fillStyle = '#999'; c.font = '600 18px Nunito, system-ui, sans-serif'; c.textAlign = 'right'; c.textBaseline = 'bottom';
    c.fillText('Стихи на звук · Skill Graph', W - PAD, H - PAD + 6);
    const blob = await new Promise((ok) => cv.toBlob(ok, 'image/png'));
    const file = new File([blob], `${R.saveName}-${p.title}.png`, { type: 'image/png' });
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file], title: p.title }); } catch (e) { if (e.name !== 'AbortError') throw e; }
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    sfx.snap();
  } catch (e) { console.warn(e); }
}

  const cards = dealt.map((p) => {
    const f = cardFace(p), up = deal.open.has(p.id);
    return `<button class="sp-fl${up ? ' flip' : ''}" type="button" ${up ? `data-poem="${p.id}"` : `data-card="${p.id}"`} aria-label="${esc(up ? p.title : R.closed)}"><span class="in"><span class="bk" aria-hidden="true">?</span><span class="fc" style="background:${f.bg}">${f.html}</span></span></button>`;
  }).join('');
  const surprise = list.length >= 2 ? `<button class="sp-fl" type="button" data-surprise="1" aria-label="${esc(R.surprise)}"><span class="in"><span class="bk" aria-hidden="true">✨</span><span class="fc"></span></span></button>` : '';
  return `<div class="sp-card"><div class="sp-top"><span class="big">📖</span><div class="t"><div class="sp-h" style="margin:0">${esc(R.listH(tlabel(target)))}</div>
      <div class="sp-sub" style="margin:2px 0 0">${esc(R.count(pool().length))}</div></div></div>
    <div class="sp-row">${[...SEASONS, 'all'].map((s) => `<button class="sp-btn${season === s ? ' on' : ''}" type="button" data-season="${s}">${SEASON_NAME[s]}</button>`).join('')}</div>
    ${list.length ? `<p class="sp-cardsh">${esc(R.cardsH)}</p><div class="sp-deck">${cards}${surprise}</div>
    ${list.length > 3 ? `<div class="sp-more"><button class="sp-btn sp-chip" type="button" data-shuffle="1">${esc(R.shuffle)}</button></div>` : ''}` : `<p class="sp-msg">${esc(R.noPoems)}</p>`}</div>`;
}
function poemCard(p) {
  const keys = p.target.split('+');
  const h = HEROES.find((x) => x.k === p.hero);
  return `<div class="sp-card"><div class="sp-top"><span class="big">${p.emoji ?? h?.e ?? '📖'}</span><div class="t"><div class="sp-h" style="margin:0">${esc(p.title)}</div>
      <div class="sp-sub" style="margin:2px 0 0">${esc(tlabel(p.target))} · ${SEASON_NAME[p.season] ?? esc(R.anyTag)}</div></div></div>
    <div class="sp-poem">${poemHTML(p, keys)}</div>
    <div class="sp-legend">${esc(keys.length > 1 ? R.legendPair(LABEL[keys[0]], LABEL[keys[1]]) : R.legend(LABEL[keys[0]]))}</div>
    <div class="sp-row"><button class="sp-btn main" type="button" data-act="draw">${esc(R.toDraw)}</button>
      <button class="sp-btn" type="button" data-act="other">${esc(R.other)}</button><button class="sp-btn" type="button" data-act="list">${esc(R.back)}</button></div></div>`;
}
function drawView() {
  const p = poem();
  if (!p) return `<div class="sp-card"><p class="sp-msg">${esc(R.pickFirst)}</p><button class="sp-btn main" type="button" data-act="topoem">${esc(R.pickBtn)}</button></div>`;
  const d = getDraw(p), keys = p.target.split('+');
  const fw = flatWords(p);
  let n = 0;
  const lines = p.lines.map((l, li) => `<div class="sp-line">${words(l).map((w, wi) => {
    const i = n++;
    const next = words(l)[wi + 1]?.w ?? words(p.lines[li + 1] ?? '')[0]?.w ?? '';
    const marks = new Map(); keys.forEach((k, ki) => { for (const hh of highlight(w.w, k, next).hits) marks.set(hh, ki ? 'b' : 'a'); });
    const word = [...w.w].map((c, ci) => (marks.has(ci) ? `<mark class="${marks.get(ci)}">${esc(c)}</mark>` : esc(c))).join('');
    const small = SMALL[w.w.toLowerCase()];
    const pic = d[i] ? cellPic(d[i]) : hints && small ? glyph(small) : mode === 'draw' ? '<span class="plus">+</span>' : '';
    const cls = ['sp-cell', mode === 'show' && i === step ? 'now' : '', mode === 'tell' ? 'hide' : ''].join(' ');
    return `<button class="${cls}" type="button" data-cell="${i}"><span class="pic">${pic}</span><span class="word"><span class="wt">${word}</span></span></button>`;
  }).join('')}</div>`).join('');
  const total = fw.length;
  return `<div class="sp-card sp-print"><div class="sp-h">${esc(p.title)}</div>
    <div class="sp-modes">${Object.entries(R.modes).map(([k, v]) => `<button class="sp-btn${mode === k ? ' on' : ''}" type="button" data-mode="${k}">${v}</button>`).join('')}</div>
    <p class="sp-sub" style="margin:0 0 12px">${esc(mode === 'draw' && fill === 'cards' ? R.fillTip : R.modeTip[mode])}</p>
    ${mode === 'draw' ? `<div class="sp-modes">${Object.entries(R.fill).map(([k, v]) => `<button class="sp-btn${fill === k ? ' on' : ''}" type="button" data-fill="${k}">${v}</button>`).join('')}</div>` : ''}
    <div class="sp-lines">${lines}</div>
    ${mode === 'show' ? `<div class="sp-step"><button class="sp-btn" type="button" data-act="prev"${step ? '' : ' disabled'}>${esc(R.prev)}</button>
      <button class="sp-btn main" type="button" data-act="${step < total - 1 ? 'next' : 'again'}">${esc(step < total - 1 ? R.next : R.again)}</button></div>` : ''}
    ${mode === 'draw' ? `<label class="sp-switch" style="margin-top:12px"><input type="checkbox" id="hintsBox"${hints ? ' checked' : ''}> ${esc(R.hints)}</label>
      <div class="sp-row"><button class="sp-btn" type="button" data-act="print">${esc(R.print)}</button>
      <button class="sp-btn" type="button" data-act="saveimg">${esc(R.saveImg)}</button></div>` : ''}</div>`;
}
function soundsList(A, keys, top) {
  const present = ORDER.filter((k) => A.count[k] || A.maybe[k]);
  const others = present.filter((k) => !keys.includes(k));
  if (!others.length) return `<p class="sp-msg">${esc(R.adult.none)}</p>`;
  return `<div class="sp-sounds">${others.map((k) => `<span class="${RANK[k] > top ? 'x' : ''}">${LABEL[k]} × ${(A.count[k] ?? 0) + (A.maybe[k] ?? 0)}</span>`).join('')}</div>`;
}
function adultView() {
  const p = poem(), keys = keysOf(), top = Math.max(...keys.map((k) => RANK[k]));
  let ana = `<p class="sp-msg">${esc(R.adult.noPoem)}</p>`;
  if (p) {
    const pk = p.target.split('+'), r = checkPoem(p.text, p.target), A = r.analysis, ptop = Math.max(...pk.map((k) => RANK[k]));
    const pos = pk.map((k) => A.pos[k] ?? { start: 0, mid: 0, end: 0, cluster: 0 });
    const sum = (f) => pos.reduce((s, x) => s + x[f], 0);
    ana = `<div class="sp-poem" style="font-size:20px">${poemHTML(p, pk)}</div>
      <div class="sp-kv"><div><b>${pk.map((k) => r.n[k]).join(' + ')}</b><span>${esc(tlabel(p.target))} ${esc(R.adult.target)}</span></div>
      <div><b>${sum('start')}</b><span>${esc(R.adult.start)}</span></div><div><b>${sum('mid')}</b><span>${esc(R.adult.mid)}</span></div>
      <div><b>${sum('end')}</b><span>${esc(R.adult.end)}</span></div><div><b>${sum('cluster')}</b><span>${esc(R.adult.cluster)}</span></div></div>
      <div class="sp-lbl">${esc(R.adult.sounds)}</div>${soundsList(A, pk, ptop)}
      ${r.near.length ? `<p class="sp-msg">${esc(R.adult.near([...new Set(r.near.map((b) => `«${b.w}»`))].join(', ')))}</p>` : ''}
      <p class="sp-msg ${r.strict ? 'good' : ''}">${esc(r.strict ? R.adult.strictYes : R.adult.strictNo([...new Set(r.strictBad.map((b) => `«${b.w}» (${LABEL[b.k]})`))].join(', ')))}</p>`;
  }
  return `<div class="sp-ana">
    <div class="sp-card"><div class="sp-h">${esc(R.adult.poemH)}</div>${ana}</div>
    <div class="sp-card"><div class="sp-h">${esc(R.adult.checkH)}</div><div class="sp-sub">${esc(R.adult.checkSub)} ${esc(tlabel(target))}.</div>
      <textarea class="sp-ta" id="checkTa" placeholder="${esc(R.adult.checkPh)}">${esc(checkText)}</textarea>
      <div class="sp-row" style="margin-top:8px"><button class="sp-btn main" type="button" data-act="check">${esc(R.adult.checkBtn)}</button></div>
      <div id="checkOut">${checkResult()}</div></div>
    <div class="sp-card"><div class="sp-h">${esc(R.adult.howH)}</div><ol class="sp-steps">${R.adult.how.map((s) => `<li>${esc(s)}</li>`).join('')}</ol></div></div>`;
}
function checkResult() {
  const text = checkText.trim(); if (!text) return '';
  const keys = keysOf(), r = checkPoem(text, target), A = r.analysis;
  const ls = text.split('\n');
  const html = ls.map((l, i) => lineHTML(l, keys, words(ls[i + 1] ?? '')[0]?.w ?? '', true)).join('\n');
  const uniq = (arr) => [...new Set(arr)].join(', ');
  const resp = A.words.filter((w) => w.info.respelled).map((w) => R.adult.respell(w.w, w.info.respelled));
  return `<div class="sp-out">${html}</div><div class="sp-legend" style="margin-top:6px">${esc(R.adult.legend)}</div>
    ${keys.map((k) => `<p class="sp-msg">${esc(R.adult.found(LABEL[k], r.n[k]))}</p>`).join('')}
    <p class="sp-msg ${r.ok ? 'good' : 'bad'}">${esc(r.ok ? R.adult.good : R.adult.bad(uniq(r.bad.map((b) => `«${b.w}» (${LABEL[b.k]})`))))}</p>
    ${r.near.length ? `<p class="sp-msg">${esc(R.adult.near(uniq(r.near.map((b) => `«${b.w}»`))))}</p>` : ''}
    ${r.ambiguous.length ? `<p class="sp-msg">${esc(R.adult.amb(uniq(r.ambiguous.map((a) => `«${a.w}»`))))}</p>` : ''}
    ${r.ok && r.strictBad.length ? `<p class="sp-msg">${esc(R.adult.strictBad(uniq(r.strictBad.map((b) => `«${b.w}» (${LABEL[b.k]})`))))}</p>` : ''}
    ${resp.length ? `<p class="sp-msg">${esc(uniq(resp))}</p>` : ''}`;
}
function trapsView() {
  return `<div class="sp-card"><div class="sp-h">${esc(R.trapsH)}</div><div class="sp-sub">${esc(R.trapsSub)}</div>
    <div class="sp-trap">${TRAPS.map(([w, s, why], i) => `<button type="button" data-trap="${i}"><b>${esc(w)}</b><span class="tr">${esc('?')}</span></button>`).join('')}</div>
    <div class="sp-row" style="margin-top:12px"><button class="sp-btn" type="button" data-act="close">${esc(R.back)}</button></div></div>`;
}
function classicsView() {
  return `<div class="sp-card"><div class="sp-h">${esc(R.classicsH)}</div><div class="sp-sub">${esc(R.classicsSub)}</div>
    ${CLASSICS.map((c) => { const A = analysePoem(c.t); return `<div class="sp-classic">${c.t.split('\n').map((l) => `<div>${lineHTML(l, ['r', 'r1'])}</div>`).join('')}</div>
      <div class="sp-sounds">${ORDER.filter((k) => A.count[k]).map((k) => `<span class="${k[0] === 'r' ? 't' : ''}">${LABEL[k]} × ${A.count[k]}</span>`).join('')}</div>
      <div class="sp-src">${esc(c.a)}</div>`; }).join('')}
    <div class="sp-row"><button class="sp-btn" type="button" data-act="close">${esc(R.back)}</button></div></div>`;
}

function controls() {
  const top = Math.max(...keysOf().map((k) => RANK[k]));
  const lad = ORDER.filter((k) => k !== 'shch').map((k) => {
    const cls = keysOf().includes(k) ? 'on' : RANK[k] < top ? 'ok' : 'no';
    const has = HAS.has(k);
    return `<button class="sp-snd ${cls}" type="button" data-target="${k}"${has ? '' : ' disabled'}>${LABEL[k]}<small>${has ? R.lad[cls] : R.lad.soon}</small></button>`;
  }).join('');
  return `<div class="sp-lbl">${esc(R.ctrlSound)}</div><div class="sp-lad">${lad}</div>
    ${PAIRS.some((t) => HAS.has(t)) ? `<div class="sp-lbl">${esc(R.ctrlPairs)}</div>` : ''}<div class="sp-pairs">${PAIRS.filter((t) => HAS.has(t)).map((t) => `<button class="sp-snd${t === target ? ' on' : ''}" type="button" data-target="${t}">${tlabel(t)}</button>`).join('')}</div>
    <label class="sp-switch"><input type="checkbox" id="strictBox"${strict ? ' checked' : ''}> ${esc(R.strict)}</label>
    <div class="sp-secrets">${['a', 'b'].map((s) => `<button class="sp-btn" type="button" data-secret="${s}">${secret.unlocked() ? R.secrets[s][0] : '🔒'} ${esc(R.secrets[s][1])}</button>`).join('')}</div>`;
}

function render() {
  const v = lab.view, p = poem();
  let html;
  if (secretPage === 'a') html = trapsView();
  else if (secretPage === 'b') html = classicsView();
  else if (v === 'poem') html = p && p.target === target ? poemCard(p) : poemList();
  else if (v === 'draw') html = drawView();
  else html = adultView();
  $('overlay').innerHTML = html;
  $('ctrlBody').innerHTML = controls();
  const n = pool().length;
  lab.setReadout(`Звук ${tlabel(target)}`, R.readSub(R.count(n), SEASON_NOW[nowSeason()]), strict ? R.strictTag : '', '#f59f1b');
  lab.setState(R.state[v]);
  lab.setFacts(R.facts[v]);
}

// --- events -------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.top > innerHeight * 0.6) $('stage').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
const setPoem = (id) => { poemId = id; store.set('poem', id); step = 0; };
$('overlay').addEventListener('click', (ev) => {
  const t = ev.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.card) { // face-down card: flip it in place (no re-render, so the animation plays), then a second tap opens the poem via data-poem
    const p = ALL.find((x) => x.id === d.card); if (!p) return;
    deal.open.add(p.id); t.classList.add('flip'); t.dataset.poem = p.id; delete t.dataset.card; t.setAttribute('aria-label', p.title); sfx.snap(); return;
  }
  if (d.surprise) { // "?" card: flip to a random poem of the current list, then open it
    const list = pool().filter(inSeasonOf); if (!list.length) return;
    const p = list[Math.floor(Math.random() * list.length)], f = cardFace(p), fc = t.querySelector('.fc');
    fc.style.background = f.bg; fc.innerHTML = f.html;
    t.classList.add('flip'); t.dataset.poem = p.id; delete t.dataset.surprise; t.setAttribute('aria-label', p.title); sfx.snap();
    setTimeout(() => { if (poemId === null && target === p.target) { setPoem(p.id); sfx.click(); render(); showStage(); } }, 900);
    return;
  }
  if (d.shuffle) { redeal(pool().filter(inSeasonOf)); sfx.tick(); render(); return; }
  if (d.season) { season = d.season; sfx.tick(); render(); return; }
  if (d.poem) { setPoem(d.poem); sfx.click(); render(); showStage(); return; }
  if (d.fill) { fill = d.fill; store.set('fill', fill); sfx.click(); render(); return; }
  if (d.mode) { mode = d.mode; step = 0; sfx.click(); render(); return; }
  if (d.cell !== undefined) {
    const i = +d.cell;
    if (mode === 'draw') (fill === 'cards' ? openPicker(i) : openPad(i));
    else if (mode === 'show') { step = i; sfx.tick(); render(); }
    else { t.classList.toggle('peek'); sfx.tick(); }
    return;
  }
  if (d.trap !== undefined) {
    const [, s, why] = TRAPS[+d.trap];
    t.classList.add('open'); t.querySelector('.tr').textContent = `${s}: ${why}`; sfx.good(); return;
  }
  const a = d.act;
  if (a === 'list') { setPoem(null); sfx.click(); render(); }
  else if (a === 'other') {
    const cur = poem(), others = pool().filter((x) => x.id !== poemId);
    const sameSeason = cur ? others.filter((x) => x.season === cur.season) : others;
    const list = sameSeason.length ? sameSeason : others;
    if (list.length) setPoem(list[Math.floor(Math.random() * list.length)].id);
    sfx.click(); render();
  } else if (a === 'draw') { lab.view = 'draw'; lab.renderChrome(); mode = 'draw'; render(); showStage(); }
  else if (a === 'topoem') { lab.view = 'poem'; lab.renderChrome(); render(); }
  else if (a === 'next' || a === 'prev' || a === 'again') { step = a === 'again' ? 0 : step + (a === 'next' ? 1 : -1); sfx.tick(); render(); }
  else if (a === 'print') window.print();
  else if (a === 'saveimg') { const p = poem(); if (p) saveSheet(p); }
  else if (a === 'check') { checkText = $('checkTa').value; sfx.click(); $('checkOut').innerHTML = checkResult(); }
  else if (a === 'close') { secretPage = null; sfx.click(); render(); }
});
$('overlay').addEventListener('change', (ev) => { if (ev.target.id === 'hintsBox') { hints = ev.target.checked; store.set('hints', hints); render(); } });
$('overlay').addEventListener('input', (ev) => { if (ev.target.id === 'checkTa') checkText = ev.target.value; });
$('ctrlBody').addEventListener('click', (ev) => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.target) {
    target = t.dataset.target; store.set('target', target); sfx.snap();
    const p = poem(); if (p && p.target !== target) setPoem(null);
    render(); return;
  }
  if (t.dataset.secret) {
    if (!secret.unlocked()) { secret.open(); return; }
    secretPage = t.dataset.secret; sfx.click(); render(); showStage();
  }
});
$('ctrlBody').addEventListener('change', (ev) => {
  if (ev.target.id !== 'strictBox') return;
  strict = ev.target.checked; store.set('strict', strict); sfx.tick();
  const p = poem(); if (p && strict && !strictOf.get(p.id)) setPoem(null);
  render();
});
render();
</script>
</body>
</html>
