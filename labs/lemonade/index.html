// --- the money model: one glass costs 2 coins, sold = 24 − 3 × price, profit = (price − 2) × sold -------------
const COST = 2, SIGN_COST = 6, MADE = 20;
const soldAt = (p, sign) => Math.max(0, (sign ? 30 : 24) - 3 * p);
const profitAt = (p) => (p - COST) * soldAt(p, false);

const FONT = 'Nunito, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return `#${A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('')}`; };
const shade = (h, k) => mix(h, '#000000', k);
const tint = (h, k) => mix(h, '#ffffff', k);
const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const backOut = (t) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const fmt = (n) => (n < 0 ? `−${-n}` : String(n));
function rng(seed) {
  return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); };
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); };
const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, Math.PI * 2); };

// drawing state shared by the scene functions (set every frame)

let CW = 0, CHH = 0, TNOW = 0;  // canvas size and time
const LB = [];                  // labels collected in scene units, drawn in screen pixels afterwards
const sx = (x) => VX + x * VS, sy = (y) => VY + y * VS;

// text with a fixed pixel size inside a scaled transform
function txt(c, s, x, y, px, col, wt = 800, al = 'center') {
  c.save(); c.scale(1 / SCL, 1 / SCL); c.font = `${wt} ${px}px ${FONT}`; c.textAlign = al; c.textBaseline = 'middle'; c.fillStyle = col;
  c.fillText(s, x * SCL, y * SCL); c.restore();
}
function emo(c, ch, x, y, px, a = 1) {
  c.save(); c.scale(1 / SCL, 1 / SCL); c.globalAlpha = a; c.fillStyle = '#000'; c.font = `${px}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(ch, x * SCL, y * SCL); c.restore();
}
// a dark rounded pill with (wrapped) text, in screen pixels, kept inside the canvas
function pillText(c, text, cx, cy, o = {}) {
  const px = o.px || 13, max = o.max || CW - 16;
  c.save(); c.font = `${o.wt || 800} ${px}px ${FONT}`;
  const lines = []; let cur = '';
  for (const wd of String(text).split(' ')) {
    const tst = cur ? `${cur} ${wd}` : wd;
    if (c.measureText(tst).width > max - 22 && cur) { lines.push(cur); cur = wd; } else cur = tst;
  }
  lines.push(cur);
  const tw = Math.max(...lines.map((l) => c.measureText(l).width)), pw = tw + 22, ph = lines.length * (px + 4) + 10;
  const x = clamp(cx - pw / 2, 6, Math.max(6, CW - pw - 6)), y = clamp(cy - ph / 2, 6, Math.max(6, CHH - ph - 6));
  rr(c, x, y, pw, ph, Math.min(14, ph / 2)); c.fillStyle = o.bg || 'rgba(20,30,52,.82)'; c.fill();
  if (o.stroke) { c.lineWidth = 1.5; c.strokeStyle = o.stroke; c.stroke(); }
  c.fillStyle = o.color || '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  lines.forEach((l, i) => c.fillText(l, x + pw / 2, y + 5 + (px + 4) * (i + .5)));
  c.restore();
  return { x, y, w: pw, h: ph };
}

const ORDER = (() => {
  const w = []; for (let k = 0; k < 8; k++) for (let j = 0; j < 3; j++) w.push(k);   // three people who would pay up to each of 0..7 coins
  const r = rng(7); for (let i = w.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [w[i], w[j]] = [w[j], w[i]]; }

function makeDay(o) {
  const quick = !!o.quick, sc = quick ? .18 : 1, gap = quick ? .026 : .22, speed = quick ? 520 : 95;
  const seq = []; ORDER.forEach((w, i) => { seq.push(w); if (o.sign && i % 4 === 3) seq.push(8); });   // the big sign brings 6 more
  const custs = seq.map((w, i) => {
    const dir = i % 2 ? -1 : 1, buy = w >= o.price, spotX = dir > 0 ? [150, 126, 102][i % 3] : [210, 234, 258][i % 3], startX = dir > 0 ? -28 : 388;
    const q = { i, buy, dir, startX, spotX, speed, birth: i * gap, tw: Math.abs(spotX - startX) / speed, y: 246 + (i % 3) * 10, col: SKIN[(i * 5 + 2) % 6], hat: i % 3, taken: false, costed: false, paid: false };
    if (buy) { q.cup0 = q.tw + .2 * sc; q.cup1 = q.cup0 + .35 * sc; q.coin0 = q.cup1 + .03 * sc; q.coin1 = q.coin0 + .4 * sc; q.leave = q.coin1 + .2 * sc; }
    else { q.hm0 = q.tw + .1 * sc; q.hm1 = q.tw + .95 * sc; q.leave = q.tw + 1.05 * sc; }
    q.end = q.leave + (dir > 0 ? 392 - spotX : spotX + 32) / speed;
    return q;
  });

  return { price: o.price, quick, sc, mode: o.mode, sign: !!o.sign, made, stock: made, custs, T: 0, in: 0, sold: 0, done: false,
    out: made ? made * COST : o.sign ? SIGN_COST : 0, perSale: made ? 0 : COST, end: Math.max(...custs.map((q) => q.birth + q.end)) };
}
function beginDay(o) {
  SD.D = makeDay(o); POT.in = 0; POT.out = 0; TILL.bump = 0; FX.length = 0;
  if (!o.quick) sfx.click();
}
function updateStand(dt) {
  TILL.bump = Math.max(0, TILL.bump - dt * 4);
  const D = SD.D, ti = D ? D.in : 0, to = D ? D.out : 0;
  POT.in += (ti - POT.in) * Math.min(1, dt * 9); POT.out += (to - POT.out) * Math.min(1, dt * 9);
  if (!D || D.done) return;
  D.T += dt;
  for (const q of D.custs) {
    const lt = D.T - q.birth; if (lt < 0 || !q.buy) continue;
    if (!q.taken && lt >= q.cup0) { q.taken = true; if (D.made) D.stock--; }
    if (!q.costed && lt >= q.cup0 + .4 * D.sc) { q.costed = true; D.out += D.perSale; }
    if (!q.paid && lt >= q.coin1) {
      q.paid = true; D.in += D.price; D.sold++; TILL.bump = 1;
      if (!D.quick) { FX.push({ t0: TNOW, text: `+${D.price}` }); sfx.snap(); }
    }

  if (D.T >= D.end) finishDay();

  const D = SD.D; D.done = true;
  if (D.mode === 'sweep') {

  $('sMain').textContent = free ? t.s.open : t.next; $('sMain').dataset.act = 'sMain';
  $('sMain').disabled = free && dayRunning();
  $('sChips').innerHTML = [['sign', '🪧'], ['leftover', '🥤']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${SD.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  setCard('stand', st === 'r2' || free);
  readoutStand();
}

// --- the loop --------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CHH = h; TNOW = time; LB.length = 0; SCL = 1;
  const v = lab.view;
  if (v === 'idea') drawIdea(c, w, h, time);
  else if (v === 'plan') drawPlan(c, w, h, time);
  else drawStand(c, w, h, dt, time);
});
buildBoard();
render();
</script>
</body>
