];
const PRICE = { '🪵': 4, '🥛': 3, '🍞': 2, '👟': 8, '🧵': 1, '🥚': 1, '🐟': 8 };
const DENOMS = [1, 2, 5, 10];
const ERA_EMO = ['🔄', '🐚', '🪙', '📜', '💳'];
const MODE_COL = { barter: ['#ff8a3d', 'rgba(255,138,61,.22)'], coins: ['#f5c84c', 'rgba(245,200,76,.2)'], history: ['#4ea8ff', 'rgba(78,168,255,.22)'], change: ['#3ddc97', 'rgba(61,220,151,.2)'], print: ['#ff6fa8', 'rgba(255,111,168,.2)'] };
const EF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const font = (px, wt = 800) => `${wt} ${Math.round(px)}px Nunito, ui-rounded, system-ui, sans-serif`;
const now = () => performance.now() / 1000;
const ease = (p) => p * p * (3 - 2 * p);
const rr = (c, x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
const emo = (c, e, x, y, s, a = 1) => { c.globalAlpha = a; c.fillStyle = '#fff'; c.font = `${Math.round(s)}px ${EF}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(e, x, y); c.globalAlpha = 1; };
const waysToMake = (amount) => { const d = Array(amount + 1).fill(0); d[0] = 1; for (const k of DENOMS) for (let a = k; a <= amount; a++) d[a] += d[a - k]; return d[amount]; };
const sum = (a) => a.reduce((s, v) => s + v, 0);

function coinDot(c, x, y, r, label, fill = '#f5c84c') {
  c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = fill; c.fill();
  c.strokeStyle = 'rgba(120,80,0,.55)'; c.lineWidth = Math.max(1, r * 0.1); c.stroke();
  if (label !== undefined && r >= 9) { c.fillStyle = '#2a1c00'; c.font = font(r * 0.95, 900); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(label), x, y + r * 0.04); }
}

const freshC = () => ({ hold: '🐟', coins: 0, steps: 0, done: false, msg: null, holdHide: 0, stalls: VILL.map(() => ({ gone: false, hideT: 0, refuseT: -9 })) });
const freshP = () => ({ on: false, t: 0, after: false, fresh: true });

// flying things: items, coins. a / b are anchors: 'you', 'purse' or a stall index
function fly(e, a, b, o = {}) { S.fx.push({ e, a, b, t0: now() + (o.delay || 0), dur: o.dur || 0.55, bend: o.bend ?? 1, size: o.size || 34, coin: !!o.coin }); }
function confetti(p) {
  const list = ['🎉', '✨', '⭐', '👟', '🪙'];
  for (let i = 0; i < 16; i++) S.conf.push({ e: list[i % list.length], x: p.x, y: p.y, vx: (Math.random() - .5) * 320, vy: -140 - Math.random() * 220, t0: now() });
}

// barter
function barterTap(i) {
  const B = S.b; if (B.done || !S.answered) return;
  const st = B.stalls[i], v = VILL[i];
  if (st.want !== null && st.want === B.hold) {
    const gave = B.hold, got = st.has;
    st.has = gave; st.want = null; B.hold = got; B.swaps++;
    fly(gave, 'you', i, { bend: 1 }); fly(got, i, 'you', { bend: -1 });
    st.hideT = B.holdHide = now() + 0.55;
    B.msg = { k: 'swapped', gave, got, i };
    if (got === '👟') { B.done = true; S.barterSwaps = B.swaps; sfx.good(); confetti(S.L.you.hold); B.msg = { k: 'win' }; }
    else if (!B.stalls.some((s) => s.want === B.hold)) { B.msg = { k: 'stuck', item: B.hold }; sfx.bad(); }
    else sfx.snap();
  } else {
    st.refuseT = now(); sfx.bad();
    if (st.want === null) B.msg = { k: 'traded' };
    else { B.refusals++; B.msg = { k: 'no', i, want: st.want }; }
  }
  render();
}
// coins
function coinTap(i) {
  const C = S.c; if (C.done) return;
  const v = VILL[i], st = C.stalls[i];
  if (C.hold === '🐟' && v.want === '🐟') {
    C.hold = null; C.coins += 8; C.steps++;
    fly('🐟', 'you', i); for (let k = 0; k < 8; k++) fly('', i, 'purse', { coin: true, size: 14, delay: 0.25 + k * 0.06, dur: 0.5, bend: (k % 2 ? 1 : -1) * 0.6 });
    C.msg = { k: 'sold' }; sfx.good();
  } else if (st.gone) { st.refuseT = now(); sfx.bad(); }
  else {
    const p = PRICE[v.has];
    if (C.coins < p) { st.refuseT = now(); C.msg = { k: 'poor', item: v.has, p }; sfx.bad(); }
    else {
      C.coins -= p; C.hold = v.has; C.steps++; st.gone = true;
      for (let k = 0; k < p; k++) fly('', 'purse', i, { coin: true, size: 14, delay: k * 0.05, dur: 0.45, bend: (k % 2 ? 1 : -1) * 0.6 });
      fly(v.has, i, 'you', { delay: 0.3 }); C.holdHide = now() + 0.85;
      C.msg = { k: 'bought', item: v.has, p, left: C.coins };
      if (v.has === '👟') { C.done = true; C.msg = { k: 'win', steps: C.steps }; sfx.good(); setTimeout(() => S.L && confetti(S.L.you.hold), 800); } else sfx.snap();
    }
  }
  render();
}
// change
function changeTap(d) {
  const ch = S.ch, need = 20 - ch.price, tot = sum(ch.given);
  if (tot >= need && tot !== 0 && tot > need) return;
  if (tot === need) return;
  ch.given.push({ d, t0: now() }); sfx.click();
  const nt = sum(ch.given);
  if (nt === need) sfx.good(); else if (nt > need) sfx.bad();
  render();
}
function newPrice() { let p; do { p = 1 + Math.floor(Math.random() * 19); } while (p === S.ch.price); S.ch = { price: p, given: [] }; }
// print
function doDouble() {
  const P = S.pr; if (P.on) return;
  P.on = true; P.t = 0; P.after = false; sfx.push();
  const L = printLayout(S.L ? S.L.w : 360, S.L ? S.L.h : 300);
  for (let i = 0; i < 6; i++) for (let k = 0; k < 8; k++) S.pops.push({ x: L.vx[i], y: L.vy + 24, vx: (Math.random() - .5) * 90, vy: -90 - Math.random() * 120, t0: now() + k * 0.03 });
}

  const m = mode();

  else if (k === 'newPrice') newPrice();
  else if (k === 'clear') { if (m === 'change') S.ch.given = []; else { S.pr = freshP(); S.pops = []; } }
  else if (k === 'double') doDouble();

});

// ---- render: all text + controls ----
function render() {
  const t = T[lang], m = mode(), open = secret.unlocked();
  const [col, glow] = MODE_COL[m]; lab.setGlow(glow);
  const B = S.b, C = S.c;
  const nameNom = (i) => `${i} ${t.itemsNom[i]}`;
  const nameAcc = (i) => `${i} ${lang === 'hu' ? t.itemsNom[i] : t.items[i]}`;
  const who = (i) => (lang === 'en' ? t.people[VILL[i].k].toLowerCase() : t.people[VILL[i].k]);
  const bStuck = B.msg?.k === 'stuck';
  const cDead = !C.done && C.hold !== '👟' && C.hold !== '🐟' && C.coins < 8;

  const sc = (k) => `<button class="chip secret ${open ? 'open' : ''} ${S.secret === k ? 'on' : ''}" data-k="${k}">${open ? esc(t.secrets[k][0]) : '🔒 ???'}</button>`;
  const ch = (k, label, on, gl) => `<button class="chip ${on ? 'on' : ''} ${gl ? 'glow' : ''}" data-k="${k}">${esc(label)}</button>`;
  let mid = '';
  if (m === 'barter') mid = ch('restart', t.restart, false, bStuck);
  else if (m === 'coins') mid = ch('restart', t.restart, false, cDead);
  else if (m === 'change') mid = ch('newPrice', t.newPrice, false) + ch('clear', t.clear, false);
  else if (m === 'print') mid = ch('double', t.double, S.pr.on) + ch('clear', t.clear, false);
  $('chips').innerHTML = sc('change') + mid + sc('print');

  const key = (m === 'history' ? 'h' : '') + lang;
  if (slKey !== key) {
    slKey = key;
    $('sl').innerHTML = m === 'history'
      ? `<div class="sl"><span>${esc(t.slEra)}</span><div class="slw"><input type="range" class="big" data-s="era" min="0" max="4" step="1" value="${S.era}"><div class="tk">${t.eras.map((e, i) => `<button data-era="${i}" style="left:calc(13px + (100% - 26px) * ${i / 4})">${esc(e)}</button>`).join('')}</div></div></div>`
      : '';
  }
  const inp = $('sl').querySelector('input'); if (inp) inp.value = S.era;
  $('sl').querySelectorAll('.tk button').forEach((b) => b.classList.toggle('on', +b.dataset.era === S.era));

  let st, extra = '', fine = t.fineCoins;
  if (m === 'barter') {
    fine = t.fineBarter;
    lab.setReadout(F(B.swaps), t.swapsSub(B.swaps), B.done ? t.got : t.goal, col);
    const g = B.msg;
    if (!S.answered) st = { emo: '🤔', ...t.think, body: '' };
    else if (!g) st = { emo: '🏘️', ...t.start };
    else if (g.k === 'swapped') st = { emo: '🔄', ...t.swapped(nameNom(g.gave), nameNom(g.got), g.i === undefined ? '' : who(g.i)) };
    else if (g.k === 'no') st = { emo: '✋', ...t.no(who(g.i), nameAcc(g.want)) };
    else if (g.k === 'traded') st = { emo: '✅', ...t.traded };
    else if (g.k === 'stuck') st = { emo: '🧱', ...t.stuck(nameAcc(g.item)) };
    else st = { emo: '🎉', ...t.barterWin(B.swaps, B.refusals) };
  } else if (m === 'coins') {
    lab.setReadout(F(C.coins), t.purse, '', col);
    const g = C.msg;
    if (!g) st = { emo: '🪙', ...t.coinStart };
    else if (g.k === 'sold') st = { emo: '🤝', ...t.sold(8) };
    else if (g.k === 'bought') st = { emo: '🛒', ...t.bought(nameNom(g.item), g.p, g.left) };
    else if (g.k === 'poor') st = { emo: '😕', ...t.poor(cap(t.itemsNom[g.item]), g.p) };
    else st = { emo: '🎉', ...(g.steps === 2 ? t.coinWin(2) : t.coinWinN(g.steps)) };
    if (g?.k === 'win' && g.steps === 2) extra += `<p class="cline">${esc(t.compare(S.barterSwaps ?? 4))}</p>`;
    extra += `<p class="wline">${esc(t.worth)}</p>`;
  } else if (m === 'history') {
    fine = t.fineHistory;
    lab.setReadout('', '', '', col); $('val').textContent = ERA_EMO[S.era]; $('valSub').textContent = t.era[S.era].title;
    st = { emo: ERA_EMO[S.era], ...t.era[S.era] };
  } else if (m === 'change') {
    const need = 20 - S.ch.price, tot = sum(S.ch.given);
    lab.setReadout(F(tot), t.changeSub, `20 − ${S.ch.price}`, col);
    st = tot === need ? { emo: '✅', ...t.changeOk(S.ch.price, waysToMake(need)) } : tot > need ? { emo: '🙈', ...t.changeOver } : { emo: '🧾', ...t.changeAsk(S.ch.price) };
  } else {
    const total = 6 * (S.pr.t >= 0.4 && S.pr.on ? 20 : 10);
    lab.setReadout(F(total), t.villageCoins, `🍞 ${S.pr.after ? 4 : 2}`, col);
    st = S.pr.after ? { emo: '📈', ...t.printAfter } : { emo: '🏘️', ...t.printBefore };
  }
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body, extra: extra + `<div class="fine">${esc(fine)}</div>` });

  const showAsk = m === 'barter' && !S.answered;
  ask.style.display = showAsk ? '' : 'none';
  if (showAsk) ask.innerHTML = S.answer === null
    ? `<div class="q">${esc(t.ask)}</div><div class="opts">${t.opts.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="q" style="color:${S.answer === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(S.answer === 1 ? t.right : S.answer === 0 ? t.wrong0 : t.wrong2)}</div><div class="opts"><button>${esc(t.go)} →</button></div>`;
}

// village layout: phones get 2 x 3 stall cards above you; wide stages get a ring around you
function layout(w, h) {
  const wide = w >= 560 && h >= 300, stalls = [], you = {};
  if (!wide) {
    const pad = 6, gap = 6, youH = clamp(h * 0.22, 58, 84), cw = (w - 2 * pad - gap) / 2, chh = (h - youH - pad - 2 * gap - 4) / 3;
    for (let i = 0; i < 6; i++) stalls.push({ x: pad + (i % 2) * (cw + gap), y: pad + Math.floor(i / 2) * (chh + gap), w: cw, h: chh });
    const y = h - youH / 2 - 2;

      const p = ease(clamp((P.t - 0.8 - i * 0.1) / 1.2, 0, 1)), qx = L.loafX - 24 - (5 - i) * (w * 0.075) - 8, sx = L.vx[i], sy = L.vy + fs * 1.15 + sz * 0.6;
      const bob = p > 0 && p < 1 ? Math.sin(time * 14 + i) * 2 : 0;
      stick(c, lerp(sx, qx, p), lerp(sy, L.qy, p) + bob, sz, `hsl(${i * 55} 80% 68%)`);
    }
  }
}

const cvLoop = canvasLoop($('cv'), (c, w, h, dt, time) => {
  const m = mode(), tm = now();
  if (m === 'barter') drawVillage(c, w, h, dt, tm, false);
  else if (m === 'coins') drawVillage(c, w, h, dt, tm, true);
  else if (m === 'history') drawHistory(c, w, h, dt, tm);
  else if (m === 'change') drawChange(c, w, h, dt, tm);
  else drawPrint(c, w, h, dt, tm);
});

$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, m = mode(), L = S.L;
  if (!L) return;
  if (m === 'barter' || m === 'coins') {
    const i = L.stalls.findIndex((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
    if (i >= 0) (m === 'barter' ? barterTap : coinTap)(i);
  } else if (m === 'change' && L.trayCoins) {
    const q = L.trayCoins.find((q) => Math.hypot(x - q.x, y - q.y) <= q.r + 8);
    if (q) changeTap(q.d);
  }
});
render();
</script>
</body>
</html>
