function pick(i, silent) {
  S.va = i; S.vat = now(); S.angry = i === 1 ? now() + 1.3 : 0; S.ins = 0; S.insT = -9; S.sec = null;
  if (!silent) S.auto = null;
  (i === 2 ? sfx.good : i === 1 ? sfx.push : sfx.bad)();
  render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'pred') {
    if (S.pred[v] !== null) return;
    const k = +b.dataset.k;
    S.pred[v] = k; (k === RIGHT[v] ? sfx.good : sfx.bad)();
    if (v === 'istatement') { S.sl = [0, 0, 0, 0]; S.sentT = now(); } else { S.va = null; S.auto = { i: 0, at: now() + 0.3 }; }
    render(); showStage(); return;
  }
  if (act === 'pick') { S.auto = null; pick(+b.dataset.v); return; }
  if (act === 'next') {
    if (v === 'voices') S.vi = (S.vi + 1) % 3; else { S.ni = (S.ni + 1) % 2; S.adult = false; }
    S.va = null; S.auto = null; S.ins = 0; S.insT = -9; S.sec = null; sfx.click();
  } else if (act === 'insist') { S.ins++; S.insT = now(); S.auto = null; sfx.click(); }
  else if (act === 'adult') { S.adult = !S.adult; S.sec = null; (S.adult ? sfx.good : sfx.tick)(); }
  else if (act === 'slot') {
    const k = +b.dataset.s, j = +b.dataset.j;
    S.sl[k] = S.sl[k] === j ? null : j; S.sentT = now(); sfx.tick();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.secT = now(); S.auto = null; sfx.click();
    if (S.sec === 'a') { S.va = null; S.insT = -9; }
  }
  render();
});

// --- one render per change ------------------------------------------------------------------------------------------------
function predHTML(key, ask, opts, okText, badText) {
  const a = S.pred[key], right = RIGHT[key];
  const chips = opts.map((o, i) => {
    const cls = a === null ? '' : i === right ? ' good' : i === a ? ' bad' : ' dim';
    return `<button class="md-opt${cls}" data-act="pred" data-k="${i}"${a === null ? '' : ' disabled'}>${esc(o)}</button>`;
  }).join('');
  const verdict = a === null ? '' : `<div class="md-verdict${a === right ? ' ok' : ''}">${esc(a === right ? okText : badText)}</div>`;
  return `<div class="md-q">${esc(ask)}</div><div class="md-opts">${chips}</div>${verdict}`;
}
function cardsHTML(sit, adult) {
  const t = T[lang], names = [t.voices.mouse, t.voices.dragon, t.voices.me];
  let out = [0, 1, 2].map((i) => `<button class="md-card${S.va === i ? ' on' : ''}" data-act="pick" data-v="${i}">${mas(MAS[i])}<span class="md-ct"><b>${esc(names[i])}</b><span>${esc(t.answers[sit][i])}</span></span></button>`).join('');
  if (adult) out += `<button class="md-card adult${S.va === 2 ? ' lit' : ''}${S.adult ? ' on' : ''}" data-act="adult">${mas('Adult')}<span class="md-ct"><b>${esc(t.adult)}</b></span></button>`;
  return out;
}
function render() {
  const t = T[lang], v = lab.view, pr = predicting();
  $('mdV').style.display = v === 'voices' ? 'block' : 'none';
  $('mdN').style.display = v === 'no' ? 'block' : 'none';
  $('mdI').style.display = v === 'istatement' ? 'block' : 'none';
  if (v === 'voices') renderVoices(t, pr); else if (v === 'no') renderNo(t, pr); else renderI(t, pr);
  // the two secret experiments, always visible; locked until the quiz is passed
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret${open ? ' open' : ''}${S.sec === k ? ' on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('mdSec').innerHTML = sc('a', '🔁') + sc('b', '🦁');
  // secret B: three panels over the stage
  const want = S.sec === 'b' ? lang : '';
  if (want !== S.braveOn) { S.braveOn = want; braveEl.style.display = want ? 'flex' : 'none'; braveEl.innerHTML = want ? braveHTML(t) : ''; }
  if (S.sec) {
    const k = S.sec, st = t.secrets[k];
    lab.setReadout(k === 'a' ? '🔁' : '🦁', st[0], '', '#2fa39a');
    lab.setState({ emo: k === 'a' ? '🔁' : '🦁', title: st[0], lead: k === 'a' ? st[1] : t.braveText, body: '', extra: '' });
    lab.setFacts(pr ? [] : t.facts[v]);
  }
}
function braveHTML(t) {
  const sv = (inner, vb) => `<svg viewBox="${vb}" aria-hidden="true">${inner}</svg>`;
  const roar = '<g class="md-roarg" fill="none" stroke="#e5484d" stroke-width="2" stroke-linecap="round"><path d="M4 12 l5 3 M2 24 l6 0 M4 36 l5 -3 M60 12 l-5 3 M62 24 l-6 0 M60 36 l-5 -3"/></g>';
  const p1 = sv(`<g class="md-roarg"><use href="#mdSymDragon" x="8" y="4" width="48" height="48"/></g>${roar}`, '0 0 64 54');
  const p2 = sv('<g class="md-peek"><use href="#mdSymMouse" x="8" y="0" width="48" height="48"/></g><rect x="5" y="30" width="54" height="22" rx="4" fill="#c79a5c" stroke="#8f6a36" stroke-width="1.6"/><path d="M5 38 h54" stroke="#8f6a36" stroke-width="1.2"/>', '0 0 64 54');
  const p3 = sv('<use href="#mdSymMe" x="2" y="6" width="48" height="48"/><use href="#mdSymAdult" x="62" y="4" width="48" height="48"/><g fill="#fff" stroke="#3a3550" stroke-width="1.3"><ellipse cx="56" cy="12" rx="10" ry="6.5"/></g><g fill="#3a3550"><circle cx="51.5" cy="12" r="1.2"/><circle cx="56" cy="12" r="1.2"/><circle cx="60.5" cy="12" r="1.2"/></g><circle cx="98" cy="10" r="6" fill="#3ddc97" stroke="#1f8a5c" stroke-width="1.2"/><path d="M95 10 l2.2 2.4 l3.8 -4.6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>', '0 0 112 54');
  return `<div class="md-bps"><div class="md-bp md-roar">${p1}<i>${esc(t.voices.dragon)}</i></div><div class="md-bp md-hide">${p2}<i>${esc(t.voices.mouse)}</i></div><div class="md-bp">${p3}<i>${esc(t.voices.me)}</i></div></div><div class="md-bt">${esc(t.braveText)}</div>`;
}
function renderVoices(t, pr) {
  lab.setGlow('rgba(47, 163, 154, .26)');
  $('mdPredV').style.display = S.vi === 0 ? 'block' : 'none';
  $('mdPredV').innerHTML = S.vi === 0 ? predHTML('voices', t.voicesAsk, t.voicesOpts, t.voicesRight, t.voicesWrong) : '';
  $('mdCardsV').style.display = pr ? 'none' : 'grid'; $('mdCardsV').innerHTML = pr ? '' : cardsHTML(S.vi, false);
  $('mdRowV').style.display = pr ? 'none' : 'flex';
  $('mdRowV').innerHTML = `<button class="chip" data-act="next">${esc(t.next)} →</button>`;
  if (S.sec) return;
  const named = [t.voices.mouse, t.voices.dragon, t.voices.me];
  lab.setReadout(S.va === null ? '?' : esc(named[S.va]), S.va === 2 ? t.fair : '', t.sit(S.vi + 1, 3), '#2fa39a');
  if (pr) { lab.setState({ emo: '🤔', title: t.voicesAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); }
  else { const [e, a, b, c2] = t.st.voices; lab.setState({ emo: e, title: a, lead: b, body: c2, extra: '' }); lab.setFacts(t.facts.voices); }
}
function renderNo(t, pr) {
  lab.setGlow('rgba(240, 138, 60, .26)');
  $('mdPredN').style.display = S.ni === 0 ? 'block' : 'none';
  $('mdPredN').innerHTML = S.ni === 0 ? predHTML('no', t.noAsk, t.noOpts, t.noRight, t.noWrong) : '';
  $('mdCardsN').style.display = pr ? 'none' : 'grid'; $('mdCardsN').innerHTML = pr ? '' : cardsHTML(3 + S.ni, S.ni === 1);
  $('mdRowN').style.display = pr ? 'none' : 'flex';
  $('mdRowN').innerHTML = (S.ni === 0 && S.va === 2 ? `<button class="chip" data-act="insist">✋ ${esc(t.insist)}</button>` : '') + `<button class="chip" data-act="next">${esc(t.next)} →</button>`;
  if (S.sec) return;
  const named = [t.voices.mouse, t.voices.dragon, t.voices.me];
  lab.setReadout(S.va === null ? '?' : S.va === 2 ? esc(t.clearNo) : esc(named[S.va]), '', t.sit(S.ni + 4, 5), '#f08a3c');
  if (pr) { lab.setState({ emo: '🤔', title: t.noAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); }
  else { const [e, a, b, c2] = t.st.no; lab.setState({ emo: e, title: a, lead: b, body: c2, extra: '' }); lab.setFacts(t.facts.no); }
}
function renderI(t, pr) {
  lab.setGlow('rgba(122, 99, 201, .24)');
  $('mdPredI').innerHTML = predHTML('istatement', t.iAsk, t.iOpts, t.iRight, t.iWrong);
  $('mdSlots').style.display = pr ? 'none' : 'block';
  $('mdSlots').innerHTML = pr ? '' : [0, 1, 2, 3].map((k) => `<div class="md-slot"><div class="md-sl">${esc(t.slots[k])}</div><div class="md-sc">${
    ORDER[k].map((j) => `<button class="md-chip${S.sl[k] === j ? ' on' : ''}" data-act="slot" data-s="${k}" data-j="${j}">${esc(t.chips[k][j])}</button>`).join('')}</div></div>`).join('');
  if (S.sec) return;
  lab.setReadout(`<span style="font-size:19px">${esc(t.filled(filledN()))}</span>`, '', t.iPill, '#7a63c9');
  if (pr) { lab.setState({ emo: '🤔', title: t.iAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); }
  else { const [e, a, b, c2] = t.st.istatement; lab.setState({ emo: e, title: a, lead: b, body: c2, extra: '' }); lab.setFacts(t.facts.istatement); }
}
render();
</script>
