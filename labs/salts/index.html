  c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1; c.beginPath(); c.moveTo(-.4 * d, -.9 * d); c.lineTo(.1 * d, 0); c.lineTo(.4 * d, .9 * d); c.moveTo(.1 * d, 0); c.lineTo(-1 * d, .1 * d); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.3)'; c.beginPath(); c.moveTo(-.4 * d, -.9 * d); c.lineTo(.5 * d, -.8 * d); c.lineTo(.1 * d, 0); c.closePath(); c.fill(); c.restore();
}

  const hg = c.createLinearGradient(0, by, 0, by + bh); hg.addColorStop(0, 'rgba(255,255,255,.5)'); hg.addColorStop(1, 'rgba(255,255,255,0)'); rr(c, bx + 9, by + 14, 5, bh * .6, 2.5); c.fillStyle = hg; c.fill();

function drawLadder(c, w, h, dt, t) {

function renderReal(t) {
  lab.setGlow('rgba(143, 127, 208, .26)');
  $('zMode').innerHTML = [['salts', t.z.salts], ['acids', t.z.acids]].map(([k, l]) => `<button data-act="mode" data-k="${k}" class="${S.mode === k ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('zSalts').hidden = S.mode !== 'salts'; $('zAcids').hidden = S.mode !== 'acids';
  if (S.mode === 'salts') {
    const known = S.seen.size > 0, J = JARS[S.jar], jt = t.z.jars[S.jar], ans = S.jarAns[S.jar], n = S.jarAns.filter((a, i) => a === JARS[i].acid).length;
    $('zJ').innerHTML = JARS.map((_, i) => chip('jar', `data-i="${i}"`, S.jar === i, t.z.jars[i].common)).join('');
    $('zQ').textContent = t.z.qs;
    $('zO').innerHTML = ALLA.map((k) => optBtn('za', `data-k="${k}"`, t.acid[k], ans === null ? '' : k === J.acid ? 'good' : k === ans ? 'bad' : 'dim')).join('');
    lab.setReadout(`${n}/4`, t.z.salts, '', '#8f7fd0');
    if (ans === null) {
      lab.setState({ emo: '🔍', title: jt.common, lead: known ? `${t.z.chem(jt.chem)} ${J.f}` : J.f, body: '', extra: '' }); // the name gives the view-2 answer away: show it only once view 2 was tried
      lab.setFacts([fact(t, 'salt8000')]);
    } else {
      const ok = ans === J.acid;
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.z.right : t.z.wrong, lead: known ? t.z.made(t.acid[J.acid], t.anion[J.acid], jt.chem) : `${t.acid[J.acid]} → ${J.f}`, body: jt.use + (n === 4 ? ` ${t.z.done}` : ''), extra: '' });
      lab.setFacts([[fact(t, 'salt8000')], [fact(t, 'cuhyd'), fact(t, 'bord')], [fact(t, 'kfert'), fact(t, 'chinese')], [fact(t, 'caco')]][S.jar]);
    }
    return;
  }
  const known = S.seen.size > 0, ak = S.acid, A = ACIDS[ak], so = S.sorted[ak], qo = so ? so.qo : S.qo, qh = so ? so.qh : S.qh, n = Object.keys(S.sorted).length;
  $('sA').innerHTML = ALLA.map((k) => chip('ac', `data-k="${k}"`, S.acid === k, ACIDS[k].f)).join('');
  $('sQ1').textContent = t.s.qo; $('sQ2').textContent = t.s.qh;
  const st = (picked, val, correct) => (!so ? (picked === val ? 'on' : '') : val === correct ? 'good' : picked === val ? 'bad' : 'dim');
  $('sO1').innerHTML = [[1, t.s.yes], [0, t.s.no]].map(([val, l]) => optBtn('qo', `data-v="${val}"`, l, so ? st(qo, val, A.O ? 1 : 0) : qo === val ? 'sel' : '')).join('');
  $('sO2').innerHTML = [[1, '1'], [2, '2']].map(([val, l]) => optBtn('qh', `data-v="${val}"`, l, so ? st(qh, val, A.H) : qh === val ? 'sel' : '')).join('');
  lab.setReadout(`${n}/4`, t.s.cnt, '', '#8f7fd0');
  if (!so) {
    lab.setState({ emo: '🔬', title: t.s.q, lead: `${t.acid[ak]} · ${A.f}`, body: t.s.pend, extra: '' });
    lab.setFacts([fact(t, 'chinese')]);
  } else {
    const ok = so.okO && so.okH;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.s.right : t.s.wrong, lead: `${t.acid[ak]}: ${A.O ? t.s.oxy : t.s.noOxy}, ${A.H === 1 ? t.s.h1 : t.s.h2}.`,
      body: `${A.O ? t.s.ruleO : t.s.ruleN}${known ? ` ${t.acid[ak]} → ${t.anion[ak]}.` : ''}${n === 4 ? ` ${t.s.all}` : ''}`, extra: '' });
    lab.setFacts(!known ? [fact(t, 'chinese')] : A.O ? [fact(t, 'nameRule')] : [fact(t, 'hydro'), fact(t, 'nameRule')]);
  }
}
render();
</script>
</body>
</html>
