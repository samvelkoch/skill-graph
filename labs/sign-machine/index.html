const WARM = [[255, 226, 140], [226, 84, 52]], COOL = [[140, 224, 228], [64, 88, 204]];
const mixC = (A, B, k) => A.map((v, i) => Math.round(v + (B[i] - v) * k));
const rgb = (a, al = 1) => `rgba(${a[0]},${a[1]},${a[2]},${al})`;
const lite = (a, k) => mixC(a, [255, 255, 255], k), dark = (a, k) => mixC(a, [0, 0, 0], k);
const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, r)); };
function cellCol(p) {
  if (p === 0) return { base: [74, 81, 122], text: '#e6e9f5' };
  const k = Math.sqrt(Math.min(1, Math.abs(p) / 16)), pr = p > 0 ? WARM : COOL;
  return { base: mixC(pr[0], pr[1], k), text: k > 0.5 ? '#ffffff' : '#1b1733' };
}
const signCol = (p) => (p > 0 ? [240, 178, 90] : p < 0 ? [110, 150, 235] : [160, 168, 200]);
let CW = 0, CH = 0;   // canvas size of the current frame, for clamping labels
function pill(c, text, x, y, o = {}) {
  const size = o.size || 12, padX = 9, dot = o.dot ? 14 : 0;
  c.save();
  c.globalAlpha = o.a ?? 1;
  c.font = `800 ${size}px Nunito, sans-serif`; c.textAlign = 'left'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + padX * 2 + dot, th = size + 10;
  const px = clamp(x - tw / 2, 4, Math.max(4, CW - tw - 4)), py = y - th / 2;
  rr(c, px, py, tw, th, th / 2); c.fillStyle = 'rgba(10,12,24,.84)'; c.fill();
  c.lineWidth = 1; c.strokeStyle = o.stroke || 'rgba(130,145,190,.38)'; c.stroke();
  if (o.dot) { c.fillStyle = o.dot; c.beginPath(); c.arc(px + padX + 4, y, 4.5, 0, 7); c.fill(); }
  c.fillStyle = o.color || '#e8ecf8'; c.fillText(text, px + padX + dot, y + 0.5);
  c.restore();
  return { x: px, y: py, w: tw, h: th };
}
function backdrop(c, x, y, w, h, r = 16) {
  const g = c.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#1a2040'); g.addColorStop(1, '#0e1124');

}

const fmtT = (t) => (Math.abs(t - Math.round(t)) < 0.05 ? fmt(Math.round(t)) : (t < 0 ? '−' : '') + Math.abs(t).toFixed(1));

  pill(c, `${Math.abs(v)} ${tf.mps}`, ax, ay - 16, { color: '#ffe9a8' });
  // position under the track
  pill(c, `${fmt(Math.round(xNow * 10) / 10)} ${tf.unit}`, X(xNow), trackY + 56, { stroke: xNow >= 0.05 ? rgb(WARM[1], 0.8) : xNow <= -0.05 ? rgb(COOL[1], 0.9) : 'rgba(130,145,190,.5)' });
  pill(c, `⏱ ${fmtT(tNow)} s`, 52, 22);
  // the film strip
  const fx0 = 14, fx1 = w - 14, gp = 3, fw = (fx1 - fx0 - gp * 6) / 7, top = sceneH + 10, stripH = Math.max(40, Math.min(86, h - top - 52));
  GEO.film = { fx0, top: top + 8, fw, gp, h: stripH };
  g = c.createLinearGradient(0, top, 0, top + stripH + 16); g.addColorStop(0, '#0a0c18'); g.addColorStop(1, '#05060d');
  rr(c, fx0 - 8, top, fx1 - fx0 + 16, stripH + 16, 8); c.fillStyle = g; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(130,145,190,.3)'; c.stroke();
  c.fillStyle = '#242a4a';
  for (let sx = fx0 - 2; sx < fx1; sx += 12) { rr(c, sx, top + 2, 6, 4, 1.5); c.fill(); rr(c, sx, top + stripH + 10, 6, 4, 1.5); c.fill(); }
  for (let k = 0; k < 7; k++) {
    const tk = k - 3, X0 = fx0 + k * (fw + gp), y0 = top + 8, hidden = gated ? tk !== 0 : pred && tk < 0;
    g = c.createLinearGradient(0, y0, 0, y0 + stripH); g.addColorStop(0, hidden ? '#0f1226' : '#1f2750'); g.addColorStop(1, hidden ? '#0a0c1a' : '#131838');
    rr(c, X0, y0, fw, stripH, 6); c.fillStyle = g; c.fill();
    c.textAlign = 'center'; c.textBaseline = 'middle';
    if (hidden) { c.fillStyle = 'rgba(170,180,220,.4)'; c.font = '900 16px Nunito, sans-serif'; c.fillText('?', X0 + fw / 2, y0 + stripH / 2); }
    else {
      const ly = y0 + stripH * 0.72, mx = (m) => X0 + 5 + (m + 10) / 20 * (fw - 10);
      c.strokeStyle = 'rgba(160,175,230,.5)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(X0 + 4, ly); c.lineTo(X0 + fw - 4, ly); c.stroke();
      c.beginPath(); c.moveTo(mx(0), ly - 3); c.lineTo(mx(0), ly + 3); c.stroke();
      miniBot(c, mx(v * tk), ly - 1, Math.min(8, fw * 0.2), dir);
    }
    c.fillStyle = tk === 0 ? '#ffffff' : '#98A0B8'; c.font = '800 12px Nunito, sans-serif'; c.fillText(`${fmt(tk)} s`, X0 + fw / 2, top + stripH + 32);
  }
  // playhead
  const phx = fx0 + (clamp(tNow, -3, 3) + 3) * (fw + gp);
  c.save(); c.shadowColor = 'rgba(255,211,106,.8)'; c.shadowBlur = 8; c.lineWidth = 2.5; c.strokeStyle = '#ffd36a';
  rr(c, phx - 1.5, top + 6, fw + 3, stripH + 4, 7); c.stroke(); c.restore();
}

// --- drawing: divide ---------------------------------------------------------------------------------------
function divLayout(w, h) {
  const P = PROBS[S.d.i], n = -P.N, d = P.d, q = P.N / P.d, M = d < 0;
  const top = 18, rh = h - 18 - 54;
  const per = M ? Math.abs(d) : Math.abs(q), nCl = M ? Math.abs(q) : d, cols = M ? Math.abs(d) : Math.min(per, 3), rowsIn = Math.ceil(per / cols);
  let p = clamp(w / 15.5, 16, 28), L;
  for (;;) {
    const bw = cols * p + 16, bh = rowsIn * p + 16 + 24, gap = 10;
    const perRow = Math.max(1, Math.floor((w - 16 + gap) / (bw + gap))), rows = Math.ceil(nCl / perRow), H = rows * bh + (rows - 1) * gap;
    if (H <= rh || p <= 12) { L = { p, bw, bh, gap, perRow, rows, H }; break; }
    p -= 2;
  }
  const pc = n <= 8 ? 4 : 6, pr = Math.ceil(n / pc), px0 = (w - pc * L.p) / 2, py0 = top + (rh - pr * L.p) / 2;
  const pile = (i) => ({ x: px0 + (i % pc) * L.p, y: py0 + ((i / pc) | 0) * L.p });
  const boxes = [];
  for (let k = 0; k < nCl; k++) {
    const r = (k / L.perRow) | 0, col = k % L.perRow, inRow = Math.min(L.perRow, nCl - r * L.perRow), rowW = inRow * L.bw + (inRow - 1) * L.gap;
    boxes.push({ x: (w - rowW) / 2 + col * (L.bw + L.gap), y: top + (rh - L.H) / 2 + r * (L.bh + L.gap), w: L.bw, h: L.bh });
  }
  const slot = (i) => {
    const cl = M ? Math.floor(i / per) : i % nCl, si = M ? i % per : Math.floor(i / nCl), b = boxes[cl];
    return { x: b.x + 8 + (si % cols) * L.p, y: b.y + 8 + Math.floor(si / cols) * L.p };
  };
  return { P, n, d, q, M, L, pile, slot, boxes, per };
}
function drawDivide(c, w, h, dt, time) {
  const dd = S.d, td = T[lang].d;
  const G = divLayout(w, h), { L, n } = G, answered = dd.guess !== null || dd.rule;
  if (!dd.tiles || dd.tiles.length !== n) { dd.tiles = Array.from({ length: n }, (_, i) => ({ ...G.pile(i) })); dd.t0 = time; }
  backdrop(c, 6, 6, w - 12, h - 12, 16);
  // group boxes appear once the tiles are on their way
  if (answered) {
    const al = clamp((time - (dd.revAt < 0 ? time - 9 : dd.revAt) - 0.45) / 0.4, 0, 1);
    G.boxes.forEach((b, k) => {
      c.save(); c.globalAlpha = al;
      rr(c, b.x, b.y, b.w, b.h - 22, 12); c.fillStyle = 'rgba(255,255,255,.055)'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,.3)'; c.stroke();
      c.restore();
      if (al > 0.2) {
        if (G.M) pill(c, String(k + 1), b.x + b.w / 2, b.y - 1, { size: 12, a: al, stroke: 'rgba(255,214,110,.7)', color: '#ffe9a8' });
        pill(c, fmt(G.M ? G.d : G.q), b.x + b.w / 2, b.y + b.h - 11, { a: al, color: '#ffb3ba', stroke: 'rgba(255,120,130,.55)' });
      }
    });
  }
  // tiles
  const s = L.p - 3, k = 1 - Math.exp(-dt * 8), rev = dd.revAt >= 0;
  dd.tiles.forEach((tl, i) => {
    const tgt = rev && time >= dd.revAt + i * 0.035 ? G.slot(i) : G.pile(i);
    tl.x += (tgt.x - tl.x) * k; tl.y += (tgt.y - tl.y) * k;
    const pr = clamp((time - dd.t0 - i * 0.03) / 0.3, 0, 1);
    if (pr <= 0) return;
    const z = s * Math.max(0, easeOutBack(pr)), cx = tl.x + L.p / 2, cy = tl.y + L.p / 2;
    c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 4; c.shadowOffsetY = 2;
    const g = c.createLinearGradient(0, cy - z / 2, 0, cy + z / 2); g.addColorStop(0, '#ff8a92'); g.addColorStop(1, '#c4333f');
    rr(c, cx - z / 2, cy - z / 2, z, z, z * 0.24); c.fillStyle = g; c.fill(); c.restore();
    c.lineWidth = 1.2; c.strokeStyle = '#6e1b26'; rr(c, cx - z / 2, cy - z / 2, z, z, z * 0.24); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.28)'; rr(c, cx - z / 2 + 2, cy - z / 2 + 2, z - 4, z * 0.22, z * 0.1); c.fill();
    c.fillStyle = 'rgba(255,245,245,.92)'; rr(c, cx - z * 0.26, cy - z * 0.07, z * 0.52, Math.max(2, z * 0.14), 1.5); c.fill();
  });
  // the total, and later the division
  const P = G.P;
  pill(c, answered ? `${par(P.N)} ÷ ${par(P.d)} = ${fmt(G.q)}` : td.total(P.N), w / 2, h - 30, { size: 13, stroke: 'rgba(255,120,130,.55)' });
}

// --- the picture -------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  stepFilm(dt);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'table') { if (S.sec && S.p1) drawChain(c, w, h, time); else drawTable(c, w, h, time); }
  else if (v === 'film') drawFilm(c, w, h, time);
  else drawDivide(c, w, h, dt, time);
});

// --- input -------------------------------------------------------------------------------------------------
const cv = $('cv');
cv.addEventListener('click', (ev) => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, v = lab.view;
  if (v === 'table') {
    if (S.sec && S.p1) {
      if (S.sec === 'par' && GEO.chain) {
        const k = GEO.chain.findIndex((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
        if (k >= 0) { S.pf[k] = -S.pf[k]; sfx.click(); render(); }
      }
      return;
    }
    const g = GEO.table; if (!g) return;
    const ci = Math.floor((x - g.gx) / g.cell), ri = Math.floor((y - g.gy) / g.cell);
    if (ci < 0 || ci > 8 || ri < 0 || ri > 8) return;
    const i = ri * 9 + ci, a = ci - 4, b = 4 - ri, t1 = S.t1;
    if (S.known[i]) { t1.sel = { a, b }; sfx.tick(); render(); }
    else if (t1.named) { fillCell(i); t1.sel = { a, b }; sfx.click(); render(); }
  } else if (v === 'film' && S.p1 && GEO.film) {
    const g = GEO.film;
    if (y < g.top || y > g.top + g.h) return;
    const k = Math.floor((x - g.fx0) / (g.fw + g.gp));
    if (k < 0 || k > 6) return;
    const tk = k - 3; if (tk < minT()) return;
    touchFilm(); S.play = false; S.tt = tk; sfx.tick(); render();
  }
});
$('tSl').addEventListener('input', (ev) => {
  if (S.f.guess === null && !S.p1) return;
  touchFilm(); S.play = false; S.tt = clamp(Math.round(+ev.target.value), minT(), 3); sfx.tick(); render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (b.dataset.pick !== undefined) { const i = +b.dataset.pick; if (v === 'table') pickT1(i); else if (v === 'film') pickF(i); else pickD(i); }
  else if (act === 'next') { if (v === 'table') nextT1(); else nextD(); }
  else if (act === 'showrule') { if (!S.t1.named) nameRule(); }
  else if (act === 'fillrest') { let k = 0; for (let i = 0; i < 81; i++) if (!S.known[i]) fillCell(i, 0.08 + (k++) * 0.035); S.t1.sel = null; sfx.snap(); }
  else if (act === 'again') { initTable(); S.sec = null; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (!S.p1) return;
    S.sec = S.sec === k ? null : k; sfx.click();
  } else if (act === 'ndec') { S.n10 = clamp(S.n10 - 1, 1, 10); sfx.tick(); }
  else if (act === 'ninc') { S.n10 = clamp(S.n10 + 1, 1, 10); sfx.tick(); }
  else if (act === 'vdec' || act === 'vinc') { touchFilm(); S.v = clamp(S.v + (act === 'vinc' ? 1 : -1), -3, 3); sfx.tick(); }
  else if (act === 'rew') { touchFilm(); playDir(-1); sfx.click(); }
  else if (act === 'play') { touchFilm(); playDir(1); sfx.click(); }
  else if (act === 'nextflag') { S.f.mi++; S.f.hit = false; S.f.all = S.f.mi >= 3; sfx.click(); }
  else if (act === 'gototable') { $('views').querySelector('[data-view="table"]')?.click(); return; }
  render();
});

render();
</script>
