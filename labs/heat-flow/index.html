  const sel = S.sel, a = sel && S.ans[sel], n = Object.keys(S.ans).length, right = Object.values(S.ans).filter((x) => x.ok).length;
  lab.setGlow('rgba(255, 150, 80, .26)');
  lab.setReadout(`${n}/7`, t.rd1, n ? t.pill1(right) : '', HEAT);
  if (!sel) lab.setState({ emo: t.pick1[0], title: t.pick1[1], lead: t.pick1[2], body: '', extra: '' });
  else if (!a) lab.setState({ emo: '🤔', title: t.q1(t.it[sel][0]), lead: t.think1, body: '', extra: '' });
  else lab.setState({ emo: a.ok ? '✅' : '🔎', title: a.ok ? t.ok : t.notq, lead: t.it[sel][1], body: n === 7 ? t.all1 : '', extra: '' });
}

function buildMeet(t) {
  const pre = S.g2 === null, m = S.mode2, open = secret.unlocked();
  question($('pq2'), t.q2, t.o2, 'g2', !pre);
  $('lk2').textContent = t.lock2; $('lk2').hidden = !pre;
  $('play2').hidden = pre;
  $('md2').innerHTML = ['table', 'spoon'].map((k) => `<button class="chip ${m === k ? 'on' : ''}" data-act="m2" data-k="${k}">${esc(t.modes[k])}</button>`).join('');
  $('l2').textContent = t.sl2; $('e2a').textContent = '0'; $('e2b').textContent = `${maxOf(m)} ${t.min}`;
  $('pl2').textContent = S.play2 ? t.pause : t.play;
  const sc = (k, emo, on) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sx" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('sx2').innerHTML = sc('hot', '📈', S.hot) + sc('twin', '⚖️', m === 'twin');
  $('sg2').textContent = t.sgate; $('sg2').hidden = !S.gate || open;
}
function liveMeet(t) {
  const pre = S.g2 === null, m = S.mode2, tm = S.t2, max = maxOf(m), tmS = m === 'spoon' ? N1(tm) : N(tm);
  $('r2').value = Math.round(tm / max * 1000);
  $('pl2').textContent = S.play2 ? t.pause : t.play;
  lab.setGlow('rgba(255, 150, 80, .24)');
  if (pre) {
    lab.setReadout('70 °C', t.rdPre2, t.pillRoom, AMBER);
    lab.setState({ emo: t.pre2[0], title: t.pre2[1], lead: t.q2, body: t.pre2[2], extra: '' });
    return;
  }
  let st, rd, pill;
  if (m === 'table') {
    const cur = table(tm), c = N(cur.cocoa), j = N(cur.juice), same = Math.abs(cur.cocoa - ROOM) < 1 && Math.abs(cur.juice - ROOM) < 1;
    rd = [`${c} °C`, t.rd2(t.nm.cocoa.toLowerCase(), tmS)]; pill = t.pillRoom;
    const at60 = table(60), s2 = t.s2;
    if (S.last2 === 'reveal') st = [S.g2 === t.ok2 ? '✅' : '🔎', verdict(S.g2, t.ok2, t.wrong2), t.leadR(N(at60.cocoa), N(at60.juice)), ''];
    else if (S.lastSec === 'hot' && S.hot) st = [...s2.hot.slice(0, 2), s2.hot[2](N(90 - (ROOM + 70 * Math.exp(-10 / TAU))), N(70 - (ROOM + 50 * Math.exp(-10 / TAU)))), ''];
    else if (tm < 0.5) st = [...s2.t0, ''];
    else if (same) st = [...s2.same, ''];
    else st = [s2.mid[0], s2.mid[1], s2.mid[2], s2.midB(c, j)];
  } else {
    const p = PAIRS[m], cur = pair(p, tm), s2 = t.s2, a = N(cur.a), b = N(cur.b), same = Math.abs(cur.a - cur.b) < 0.5;
    rd = [`${a} °C`, t.rd2((m === 'spoon' ? t.nm.spoon : t.nm.hw).toLowerCase(), tmS)]; pill = m === 'spoon' ? t.pillJ(b) : t.pillHw(b);
    if (tm < 0.02 * max) st = [...(m === 'spoon' ? s2.spoon0 : s2.twin0).slice(0, 2), (m === 'spoon' ? s2.spoon0 : s2.twin0)[2](N(p.a), N(p.b)), ''];
    else if (same) st = [...s2.sameP, ''];
    else { const x = m === 'spoon' ? s2.spoonM : s2.twinM; st = [x[0], x[1], x[2](N(cur.tf)), '']; }
  }
  lab.setReadout(rd[0], rd[1], pill, AMBER);
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: `<div class="fine">${esc(t.fine2)}</div>` });
}

function buildHands(t) {
  const rubLocked = !S.ans.hands;
  if (rubLocked && S.sub3 === 'rub') S.sub3 = 'mit';
  $('sb3').innerHTML = ['rub', 'mit'].map((k) => `<button class="chip ${S.sub3 === k ? 'on' : ''}" data-act="sub3" data-k="${k}"${k === 'rub' && rubLocked ? ' disabled' : ''}>${k === 'rub' && rubLocked ? '🔒 ' : ''}${esc(t.sub[k])}</button>`).join('');
  $('lkRub').hidden = !rubLocked;
  $('lkRub').innerHTML = rubLocked ? `${esc(t.lockRub)} <button class="chip" data-act="goSrc">${esc(t.goSrc)}</button>` : '';
  $('rub').hidden = S.sub3 !== 'rub'; $('mit').hidden = S.sub3 !== 'mit';
  $('tkRub').textContent = t.task; $('rubB').textContent = t.rubB;
  const pre = S.g3 === null;
  question($('pq3'), t.q3, t.o3, 'g3', !pre);
  $('lk3').textContent = t.lock3; $('lk3').hidden = !pre;
  $('play3').hidden = pre;
  $('ob3').innerHTML = [0, 1].map((k) => `<button class="chip ${(k === 0) === (S.obj3 === 'hand') ? 'on' : ''}" data-act="ob3" data-k="${k === 0 ? 'hand' : 'stone'}">${esc(t.objs[k])}</button>`).join('');
  $('l3').textContent = t.sl2; $('e3a').textContent = '0'; $('e3b').textContent = `${MI.max} ${t.min}`;
}
function liveHands(t) {
  if (S.sub3 === 'rub') {
    const r = S.rub, st = S.rubDone ? t.rub2 : r >= 22.5 ? t.rub1 : t.rub0;
    lab.setGlow('rgba(255, 130, 80, .28)');
    lab.setReadout(`${N(r)} °C`, t.rdRub, S.rubDone ? t.goalOk : t.goal, HEAT);
    lab.setState({ emo: st[0], title: st[1], lead: typeof st[2] === 'function' ? st[2](N(r)) : st[2], body: '', extra: `<div class="fine">${esc(t.fineRub)}</div>` });
    return;
  }
  const pre = S.g3 === null, o = S.obj3 === 'hand' ? 0 : 1, tm = S.t3;
  $('pl3').textContent = S.play3 ? t.pause : t.play;
  $('r3').value = Math.round(tm / MI.max * 1000);
  lab.setGlow('rgba(110, 165, 255, .28)');
  if (pre) {
    const rd = t.rd3pre(o); lab.setReadout(rd[0], rd[1], t.pillAir, '#8fd0ff');
    lab.setState({ emo: t.pre3[0], title: t.pre3[1], lead: t.q3, body: t.pre3[2], extra: '' });
    return;
  }
  const cur = mit(S.obj3, tm), a = N(cur.bare), b = N(cur.mit);
  lab.setReadout(`${b} °C`, t.rd3sub, t.pill3(a), '#ff9d5c');
  let st;
  if (S.last3 === 'reveal') st = [S.g3 === t.ok3 ? '✅' : '🔎', verdict(S.g3, t.ok3, t.wrong3), t.lead3r, ''];
  else if (tm < 0.5) st = [...t.s3.t0, ''];
  else { const x = t.s3[S.obj3]; st = [x[0], x[1], x[2](a, b, N(tm)), '']; }
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: `<div class="fine">${esc(t.fine3)}</div>` });
}

// --- the loop: time and rubbing drive the picture; the DOM is refreshed only when a number changes ---------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'meet') stepTime('2', maxOf(S.mode2), dt);
  else if (v === 'hands' && S.sub3 === 'mit') stepTime('3', MI.max, dt);
  else if (v === 'hands') { S.rubV = Math.max(0, S.rubV - dt * 1.6); S.rubPh += dt * (4 + 16 * S.rubV); S.rub = Math.max(20, S.rub - dt * 0.35); if (S.rub <= 21) S.rubDone = false; }
  if (liveKey() !== S.live) renderLive();
  if (v === 'src') drawRoom(c, w, h, time);
  else if (v === 'meet') drawMeet(c, w, h, time);
  else if (S.sub3 === 'rub') drawRub(c, w, h, time);
  else drawMitten(c, w, h, time);
});
render();
</script>
</body>
