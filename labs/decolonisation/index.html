      rr(c, sx, cy - sh / 2, sw, sh, 12); c.stroke(); c.setLineDash([]);
      c.fillStyle = 'rgba(255,255,255,.4)'; c.font = '900 18px Nunito, sans-serif'; c.textAlign = 'center'; c.fillText('?', sx + sw / 2, cy + 1);
    } else {
      const col = EV_COL[V.slot[j]];
      c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
      const eg = c.createLinearGradient(sx, cy - sh / 2, sx + sw, cy + sh / 2); eg.addColorStop(0, mix(col, '#ffffff', 0.2)); eg.addColorStop(1, mix(col, '#000000', 0.25));
      c.fillStyle = eg; rr(c, sx, cy - sh / 2, sw, sh, 12); c.fill(); c.restore();
      c.strokeStyle = mix(col, '#000000', 0.45); c.lineWidth = 1.4; rr(c, sx, cy - sh / 2, sw, sh, 12); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.22)'; rr(c, sx + 4, cy - sh / 2 + 2.5, sw - 8, 3, 1.5); c.fill();
      c.font = '20px sans-serif'; c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(ev.emo, sx + 9, cy + 1);
      let fs = 13, lines; const maxW = sw - 42 - (V.checked ? 26 : 0);
      for (;;) { c.font = `800 ${fs}px Nunito, sans-serif`; lines = wrapText(c, ev.n, maxW); if ((lines.length <= 2 && sh >= 32 || lines.length <= 1) || fs <= 12) break; fs = 12; }
      c.fillStyle = '#fff'; const lh = fs * 1.15, y0 = cy - ((lines.length - 1) * lh) / 2 + 1;
      lines.slice(0, 2).forEach((l, k) => c.fillText(l, sx + 36, y0 + k * lh));
      if (V.checked) { c.fillStyle = 'rgba(10,12,20,.55)'; c.beginPath(); c.arc(sx + sw - 17, cy, 13, 0, 7); c.fill(); drawTick(c, sx + sw - 17, cy, !V.wrong.includes(j), 1); }
    }
    HIT.push({ x: 0, y: cy - rowH / 2, w, h: rowH, a: 'slot', i: j });
  }
  c.restore();
}

// --- secrets -------------------------------------------------------------------------------------------------------
function drawEmpires(c, w, h, dt) { // secret A: how many places each power still rules, year by year
  const t = T[lang], Y = S.secYr, st = stat(Math.floor(Y + 1e-6)), t0 = stat(Y0);
  const bg = c.createLinearGradient(0, 0, w, h); bg.addColorStop(0, '#26304d'); bg.addColorStop(1, '#141a2b');
  c.fillStyle = bg; rr(c, 0, 0, w, h, 14); c.fill(); c.save(); rr(c, 0, 0, w, h, 14); c.clip();
  c.fillStyle = '#fff'; c.font = '900 40px Nunito, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(Math.floor(Y + 1e-6), 16, 52);
  const maxN = Math.max(...RK.map((k) => t0.by[k])), top = 74, rowH = Math.min(46, (h - top - 14) / 6), bx = 14, labW = Math.min(118, w * 0.34), barW = w - bx * 2 - labW - 34;
  RK.forEach((k, i) => {
    const y = top + i * rowH, tg = st.by[k]; S.secBar[k] += (tg - S.secBar[k]) * Math.min(1, dt * 8);
    c.fillStyle = '#e8ecf6'; c.font = '800 13px Nunito, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(t.rn[k], bx, y + rowH / 2 - 2);
    c.fillStyle = 'rgba(255,255,255,.07)'; rr(c, bx + labW, y + rowH / 2 - 10, barW, 20, 10); c.fill();
    const bw = Math.max(0, barW * (S.secBar[k] / maxN));
    if (bw > 2) { const g = c.createLinearGradient(bx + labW, 0, bx + labW + barW, 0); g.addColorStop(0, mix(RC[k], '#ffffff', 0.25)); g.addColorStop(1, RC[k]); c.fillStyle = g; rr(c, bx + labW, y + rowH / 2 - 10, bw, 20, 10); c.fill(); }
    c.fillStyle = '#fff'; c.font = '900 14px Nunito, sans-serif'; c.textAlign = 'right'; c.fillText(tg, w - bx, y + rowH / 2 - 2);
  });
  c.restore();
}
function drawNames(c, w, h, dt) { // secret B: six flip cards, old name on the front, today's name on the back
  const t = T[lang], cw = (w - 30) / 2, ch = (h - 40) / 3;
  const bg = c.createLinearGradient(0, 0, w, h); bg.addColorStop(0, '#2d3550'); bg.addColorStop(1, '#171c2e');
  c.fillStyle = bg; rr(c, 0, 0, w, h, 14); c.fill(); c.save(); rr(c, 0, 0, w, h, 14); c.clip();
  t.names.forEach(([oldN, newN, yr, ruler], i) => {
    const col = i % 2, row = Math.floor(i / 2), x = 10 + col * (cw + 10), y = 10 + row * (ch + 10);
    S.flipV[i] += (S.flip[i] - S.flipV[i]) * Math.min(1, dt * 7);
    const v = S.flipV[i], sx = Math.max(0.02, Math.abs(Math.cos(Math.PI * v))), back = v > 0.5, cx = x + cw / 2, cy = y + ch / 2;
    c.save(); c.translate(cx, cy); c.scale(sx, 1); c.translate(-cx, -cy);
    c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 10; c.shadowOffsetY = 4;
    const base = back ? '#2fa36b' : RC[ruler], g = c.createLinearGradient(x, y, x + cw, y + ch); g.addColorStop(0, mix(base, '#ffffff', 0.25)); g.addColorStop(1, mix(base, '#000000', 0.3));
    c.fillStyle = g; rr(c, x, y, cw, ch, 14); c.fill(); c.shadowColor = 'transparent';
    c.strokeStyle = mix(base, '#000000', 0.5); c.lineWidth = 1.6; rr(c, x, y, cw, ch, 14); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.22)'; rr(c, x + 6, y + 4, cw - 12, 3, 1.5); c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    const txt = back ? newN : oldN; let fs = 17, lines;
    for (;;) { c.font = `900 ${fs}px Nunito, sans-serif`; lines = wrapText(c, txt, cw - 20); if ((lines.length <= 2 && lines.every((l) => c.measureText(l).width <= cw - 16)) || fs <= 12) break; fs--; }
    const lh = fs * 1.15, y0 = cy - ((lines.length - 1) * lh) / 2 - (back ? 8 : 0);
    lines.forEach((l, k) => c.fillText(l, cx, y0 + k * lh));
    if (back) { c.font = '800 12px Nunito, sans-serif'; c.fillStyle = 'rgba(255,255,255,.9)'; c.fillText(`${t.secBInd}: ${yr}`, cx, cy + ch / 2 - 16); }
    c.restore();
    HIT.push({ x, y, w: cw, h: ch, a: 'flip', i });
  });
  c.restore();
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  HIT.length = 0;
  for (const d of DOTS) { const tg = S.yr >= d.yr ? 1 : 0; d.t = tg > d.t ? Math.min(tg, d.t + dt * 4) : Math.max(tg, d.t - dt * 4); }
  if (S.sec === 'a') {
    if (S.secPlay) { S.secYr = Math.min(Y1, S.secYr + dt * 2.2); $('dcSecSlider').value = Math.floor(S.secYr); if (S.secYr >= Y1) S.secPlay = false; }
    const Y = Math.floor(S.secYr + 1e-6); if (Y !== S.lastSecY) { S.lastSecY = Y; lab.setReadout(String(Y), T[lang].indepOf(stat(Y).ind, stat(Y).tot), T[lang].pillSchem, '#9b6fd1'); }
    drawEmpires(c, w, h, dt); return;
  }
  if (S.sec === 'b') { drawNames(c, w, h, dt); return; }
  const v = lab.view;
  if (v === 'years') {
    if (S.playing) { S.yr = Math.min(Y1, S.yr + dt * 2); if (S.yr >= Y1) { S.playing = false; setPlayLabel(); } }
    const Y = curY(); if (Y !== S.lastY) syncYears();
    drawMap(c, w, h);
  } else if (v === 'how') drawHow(c, w, h, dt, time);
  else drawVoices(c, w, h, dt, time);
});

// --- the map's controls ------------------------------------------------------------------------------------------
function predHTML() {
  const t = T[lang], pick = S.pick, done = pick !== null;
  const chips = t.opts1.map((o, i) => `<button class="dc-opt${done ? (i === RIGHT1 ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="opt" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = done ? `<div class="dc-verdict ${pick === RIGHT1 ? 'good' : 'bad'}">${esc(pick === RIGHT1 ? t.right1(N60) : t.wrong1(N60))}</div>` : '';
  return `<div class="dc-q">${esc(t.ask1)}</div><div class="dc-opts">${chips}</div>${verdict}`;
}
function setPlayLabel() {
  const t = T[lang], b = $('dcPlay');
  b.textContent = S.playing ? t.pause : curY() >= Y1 ? t.again : t.play;
}
function chartSVG(Y) {
  const W = 300, Hh = 76, x = (yy) => 8 + ((yy - Y0) / (Y1 - Y0)) * (W - 16), y = (f) => Hh - 8 - f * (Hh - 16);
  const line = (arr, col) => {
    let d = `M${x(Y0).toFixed(1)},${y(arr[0]).toFixed(1)}`;
    for (let i = 1; i <= Y - Y0; i++) d += ` L${x(Y0 + i).toFixed(1)},${y(arr[i - 1]).toFixed(1)} L${x(Y0 + i).toFixed(1)},${y(arr[i]).toFixed(1)}`;
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  };
  const cx = x(Y), a = SHARE.africa[Y - Y0], b = SHARE.asia[Y - Y0];
  return `<svg class="dc-chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-hidden="true">
    <line x1="8" x2="${W - 8}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(255,255,255,.2)"/><line x1="8" x2="${W - 8}" y1="${y(1)}" y2="${y(1)}" stroke="rgba(255,255,255,.12)" stroke-dasharray="3 4"/>
    ${line(SHARE.asia, '#5ec8c0')}${line(SHARE.africa, '#f4b942')}
    <line x1="${cx}" x2="${cx}" y1="4" y2="${Hh - 4}" stroke="#fff" stroke-opacity=".55"/>
    <circle cx="${cx}" cy="${y(a)}" r="4" fill="#f4b942" stroke="#fff" stroke-width="1.2"/><circle cx="${cx}" cy="${y(b)}" r="4" fill="#5ec8c0" stroke="#fff" stroke-width="1.2"/></svg>`;
}
function syncYears() {
  const t = T[lang], Y = curY(), s = stat(Y, S.reg), tot = stat(Y), ans = S.pick !== null;
  S.lastY = Y;
  if (!S.drag) $('dcSlider').value = Y;
  setPlayLabel();
  $('dcLeg').innerHTML = [...RK, 'I'].filter((k) => k === 'I' || s.by[k] > 0 || stat(Y0, S.reg).by[k] > 0).map((k) =>
    `<div>${k === 'I' ? '<i class="ind"></i>' : `<i style="background:${RC[k]}"></i>`}${esc(t.rn[k])} <b>${s.by[k]}</b></div>`).join('');
  lab.setReadout(String(Y), t.indepOf(tot.ind, tot.tot), t.pillSchem, '#e8dcc0');
  if (!ans) {
    lab.setState({ emo: '🤔', title: t.ask1, lead: '', body: '', extra: '' }); lab.setFacts([]);
    $('dcChartBox').innerHTML = ''; $('dcInfo').textContent = '';
    return;
  }
  $('dcChartBox').innerHTML = `<div class="dc-cap">${esc(t.chartCap)}<span><i style="background:#f4b942"></i>${esc(t.regs.africa)}</span><span><i style="background:#5ec8c0"></i>${esc(t.regs.asia)}</span></div>${chartSVG(Y)}`;
  $('dcInfo').textContent = S.sel ? t.info(nameOf(S.sel), rulerOf(DOT[S.sel]), DOT[S.sel].yr) : t.tapHint;
  lab.setState({ emo: '🗺️', title: t.st1.title, lead: t.st1.lead(Y, tot.af, tot.as), body: t.st1.body(AS0, AS1, PEAK), extra: '' });
  lab.setFacts(t.facts.years);
}

// --- the other views' controls -------------------------------------------------------------------------------------
function howClue() {
  const t = T[lang], H = S.how, i = H.sel >= 0 ? H.sel : H.last;
  $('dcClue').innerHTML = i >= 0 ? `<b>${esc(t.cards[i].n)} · ${t.cards[i].y}</b>${esc(t.cards[i].clue)}` : esc(t.howNone);
}
function renderHow() {
  const t = T[lang], H = S.how, placed = H.bin.filter((b) => b >= 0).length, ok = H.checked ? H.was.filter((b, i) => b === HOW_BIN[i]).length : 0;
  howClue();
  const go = $('dcHowGo'); go.textContent = t.howCheck;
  go.disabled = H.checked || placed < 4; go.hidden = H.checked;
  lab.setReadout(H.checked ? `${ok}/4` : `${placed}/4`, H.checked ? '' : t.howLeft(4 - placed), '', '#e8802b');
  if (!H.checked) { lab.setState({ emo: '🧭', title: t.howAsk, lead: t.howLead, body: '', extra: '' }); lab.setFacts([]); return; }
  const extra = `<ul class="dc-list">${t.cards.map((c, i) => `<li><b>${esc(c.n)} · ${c.y}</b> — ${esc(t.howBins[HOW_BIN[i]])}. ${esc(c.rev)}</li>`).join('')}</ul>`;
  lab.setState({ emo: ok === 4 ? '🏁' : '🧭', title: t.howDone.title, lead: t.howDone.lead(ok), body: t.howDone.body, extra });
  lab.setFacts(t.facts.how);
}
function renderVoices() {
  const t = T[lang], V = S.vo, placed = V.slot.filter((e) => e >= 0).length, ok = V.checked ? 6 - V.wrong.length : 0;
  $('dcPool').innerHTML = POOL_ORDER.filter((e) => !V.slot.includes(e)).map((e) => `<button class="dc-ev${V.sel === e ? ' on' : ''}" data-act="ev" data-e="${e}">${t.events[e].emo} ${esc(t.events[e].n)}</button>`).join('');
  $('dcPool').hidden = V.checked;
  const go = $('dcVoGo'); go.textContent = t.voCheck; go.disabled = V.checked || placed < 6; go.hidden = V.checked;
  lab.setReadout(V.checked ? `${ok}/6` : `${placed}/6`, '', '', '#4ea8ff');
  if (!V.checked) { lab.setState({ emo: '⏳', title: t.voAsk, lead: t.voLead, body: '', extra: '' }); lab.setFacts([]); return; }
  const extra = `<ul class="dc-list">${t.events.map((e, i) => `<li><b>${YEAR_SLOTS[i]} · ${esc(e.n)}</b> — ${esc(e.d)}</li>`).join('')}</ul>`;
  lab.setState({ emo: ok === 6 ? '🏁' : '📣', title: t.voDone.title, lead: t.voDone.lead(ok), body: t.voDone.body, extra });
  lab.setFacts(t.facts.voices);
}
function render() {
  const t = T[lang], v = lab.view, ans = S.pick !== null;
  document.body.dataset.v = S.sec ? 'sec' : v; document.body.dataset.r = S.reg;
  $('dcYears').style.display = !S.sec && v === 'years' ? 'block' : 'none';
  $('dcHow').style.display = !S.sec && v === 'how' ? 'block' : 'none';
  $('dcVoices').style.display = !S.sec && v === 'voices' ? 'block' : 'none';
  $('dcSecA').style.display = S.sec === 'a' ? 'block' : 'none';
  // years
  $('dcPred1').innerHTML = predHTML();
  $('dcRegs').innerHTML = ['africa', 'asia'].map((r) => `<button class="chip${S.reg === r ? ' on' : ''}" data-act="reg" data-r="${r}">${esc(t.regs[r])}</button>`).join('');
  $('dcSlider').disabled = !ans; $('dcPlay').disabled = !ans;
  $('dcSlider').setAttribute('aria-label', t.yearAria);
  $('dcFine').textContent = ans ? `${t.fine}${S.reg === 'asia' ? ' ' + t.fineAs : ''} ${t.lateNote(LATE.map((d) => `${nameOf(d.k)} ${d.yr}`).join(', '))}` : `${t.fine}${S.reg === 'asia' ? ' ' + t.fineAs : ''}`;
  // secrets row
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('dcSecs').innerHTML = sc('a', '🏛️') + sc('b', '🏷️');
  setPlayLabel();
  if (S.sec) {
    lab.setGlow(S.sec === 'a' ? 'rgba(155, 111, 209, .26)' : 'rgba(47, 163, 107, .26)');
    lab.setState({ emo: S.sec === 'a' ? '🏛️' : '🏷️', title: t.secrets[S.sec][0], lead: S.sec === 'a' ? t.secAText : t.secBText, body: '', extra: '' });
    lab.setFacts([]);
    S.lastSecY = -1;
    if (S.sec === 'b') lab.setReadout('6', '', '', '#2fa36b');
    return;
  }
  if (v === 'years') { lab.setGlow('rgba(232, 220, 192, .22)'); S.lastY = -1; syncYears(); }
  else if (v === 'how') { lab.setGlow('rgba(232, 128, 43, .24)'); renderHow(); }
  else { lab.setGlow('rgba(78, 168, 255, .24)'); renderVoices(); }
}

// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], #dcPlay, #dcHowGo, #dcVoGo'); if (!b || b.disabled) return;
  const a = b.dataset.act || b.id;
  if (a === 'opt') {
    if (S.pick !== null) return;
    S.pick = +b.dataset.i; (S.pick === RIGHT1 ? sfx.good : sfx.bad)();
    S.yr = Y0; S.playing = true; // the reveal: the years play, after a wrong guess too
    render(); showStage(); return;
  }
  if (a === 'reg') { S.reg = b.dataset.r; S.sel = null; sfx.click(); render(); return; }
  if (a === 'dcPlay') {
    if (S.playing) S.playing = false; else { if (curY() >= Y1) S.yr = Y0; S.playing = true; }
    sfx.click(); setPlayLabel(); return;
  }
  if (a === 'dcHowGo') {
    const H = S.how; if (H.checked) return;
    H.was = H.bin.slice(); H.checked = true; H.bin = HOW_BIN.slice(); H.sel = -1;
    (H.was.every((x, i) => x === HOW_BIN[i]) ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (a === 'dcVoGo') {
    const V = S.vo; if (V.checked) return;
    V.wrong = V.slot.map((e, j) => (e === j ? -1 : j)).filter((j) => j >= 0); V.checked = true; V.slot = [0, 1, 2, 3, 4, 5]; V.sel = -1;
    (V.wrong.length ? sfx.bad : sfx.good)(); render(); showStage(); return;
  }
  if (a === 'ev') { S.vo.sel = S.vo.sel === +b.dataset.e ? -1 : +b.dataset.e; sfx.tick(); render(); return; }
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.secT = now(); S.playing = false; sfx.click();
    if (S.sec === 'a') { S.secYr = Y0; S.secPlay = true; S.secBar = { B: 0, F: 0, P: 0, E: 0, D: 0, O: 0 }; $('dcSecSlider').value = Y0; }
    if (S.sec === 'b') { S.flip = [0, 0, 0, 0, 0, 0]; S.flipV = [0, 0, 0, 0, 0, 0]; }
    render(); showStage();
  }
});
$('dcSlider').addEventListener('input', (ev) => {
  if (S.pick === null) return;
  S.drag = true; S.playing = false; S.yr = +ev.target.value; syncYears();
});
const endDrag = () => { S.drag = false; };
$('dcSlider').addEventListener('change', endDrag); addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);
$('dcSecSlider').addEventListener('input', (ev) => { S.secPlay = false; S.secYr = +ev.target.value; });

// taps on the picture
$('cv').addEventListener('click', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const hit = (a) => HIT.filter((q) => (!a || q.a === a) && x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
  if (S.sec === 'b') { const q = hit('flip')[0]; if (q) { S.flip[q.i] = S.flip[q.i] ? 0 : 1; sfx.tick(); } return; }
  if (S.sec) return;
  const v = lab.view;
  if (v === 'years') {
    if (S.pick === null || !S.fit) return; // the year of a dot would give the answer away
    const { s, ox, oy } = S.fit, R = REG[S.reg]; let best = null, bd = 28;
    for (const d of regDots(S.reg)) { const dd = Math.hypot(ox + d.x * s - x, oy + d.y * s - y); if (dd < bd) { bd = dd; best = d; } }
    S.sel = best && S.sel !== best.k ? best.k : null; sfx.tick(); syncYears();
  } else if (v === 'how') {
    const H = S.how; if (H.checked) return;
    const card = hit('card')[0], bin = hit('bin')[0];
    if (card && !(bin && H.sel >= 0 && card.i !== H.sel)) { H.sel = H.sel === card.i ? -1 : card.i; H.last = card.i; sfx.tick(); }
    else if (bin && H.sel >= 0) { const i = H.sel; H.bin[i] = bin.i; H.ord = H.ord.filter((k) => k !== i); H.ord.push(i); H.sel = -1; sfx.snap(); }
    else if (H.sel >= 0 && hit('pool')[0]) { const i = H.sel; H.bin[i] = -1; H.ord = H.ord.filter((k) => k !== i); H.sel = -1; sfx.tick(); }
    else H.sel = -1;
    renderHow();
  } else {
    const V = S.vo; if (V.checked) return;
    const q = hit('slot')[0]; if (!q) return;
    if (V.slot[q.i] >= 0) { V.sel = V.slot[q.i]; V.slot[q.i] = -1; sfx.tick(); }
    else if (V.sel >= 0) { V.slot[q.i] = V.sel; V.sel = -1; sfx.snap(); }
    renderVoices();
  }
});
render();
