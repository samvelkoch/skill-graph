  strokePts(c, [A, [bt, B[1]]], X, Y, vert ? '#ff6b6b' : '#4fc3f7', 3.6);
  c.fillStyle = '#4fc3f7'; c.beginPath(); c.arc(X(A[0]), Y(A[1]), 4, 0, TAU); c.fill();
  const pulse = 1 + Math.sin(performance.now() / 260) * 0.12;
  c.strokeStyle = vert ? '#ff6b6b' : '#ffd166'; c.lineWidth = 2.5; c.setLineDash([4, 3]); c.beginPath(); c.arc(X(bt), Y(B[1]), Math.max(0, 11 * pulse), 0, TAU); c.stroke(); c.setLineDash([]);
  c.fillStyle = vert ? '#ff6b6b' : '#ffd166'; c.beginPath(); c.arc(X(bt), Y(B[1]), 4, 0, TAU); c.fill();
  const ph = J.ph, d = ph < A[0] ? A[1] * ph / A[0] : vert ? (lastFlick ? B[1] : A[1]) : A[1] + (B[1] - A[1]) * Math.min(1, (ph - A[0]) / (B[0] - A[0]));
  glowDot(c, X(Math.min(ph, bt)), Y(d), 8);
}
function jumpLabels(c, X, Y) {
  const J = S.jump, vert = J.B[0] - J.A[0] < 3;
  if (vert) pill(c, `⚡ ${T[lang].jump.msg}`, X(J.A[0]) + 18, (Y(J.A[1]) + Y(J.B[1])) / 2, { align: 'left', border: '#ff6b6b', color: '#ffd7d2' });
}

function drawRace(c, a, time) {
  const { st, gp, pl } = G, R = S.race, t = T[lang], m = raceMath(), u = t.u;
  const tt = R.started ? R.t : 0;
  const dK = Math.min(100, R.head + KID * tt), dB = Math.min(100, BOLT * tt);
  drawTrack(c, st, time, a, { dB, dK, runB: R.started && dB < 100 ? 1 : 0, runK: R.started && dK < 100 ? 1 : 0 });
  const { X, Y } = drawGraphBase(c, gp, pl, a, t.axD);
  c.save(); rpath(c, pl.l - 2, pl.t - 10, pl.r - pl.l + 14, pl.b - pl.t + 12, 4); c.clip();
  const kEnd = m.tK, bEnd = BOLT_T;
  if (R.started) {
    strokePts(c, [[0, R.head], [Math.min(tt, kEnd), Math.min(100, R.head + KID * Math.min(tt, kEnd))]], X, Y, '#5aa9ff', 3.6);
    strokePts(c, [[0, 0], [Math.min(tt, bEnd), BOLT * Math.min(tt, bEnd)]], X, Y, '#ffc233', 3.6);
    // slope triangles: the same 3 s of running for both
    const tri = (t0, d0, v, col) => { if (tt < t0 + 3) return; c.save(); c.setLineDash([4, 3]); c.strokeStyle = col; c.lineWidth = 1.8; c.beginPath(); c.moveTo(X(t0), Y(d0)); c.lineTo(X(t0 + 3), Y(d0)); c.lineTo(X(t0 + 3), Y(d0 + v * 3)); c.stroke(); c.restore(); };
    tri(1, R.head + KID, KID, '#9cc8ff'); if (BOLT_T >= 8) tri(5, BOLT * 5, BOLT, '#ffe08a');
    if (dK < 100) glowDot(c, X(tt), Y(dK), 8, '90,169,255'); if (dB < 100) glowDot(c, X(tt), Y(dB), 8, '255,194,51');
  }
  c.fillStyle = '#5aa9ff'; c.beginPath(); c.arc(X(0), Y(R.head), 4.5, 0, TAU); c.fill();
  c.fillStyle = '#ffc233'; c.beginPath(); c.arc(X(0), Y(0), 4.5, 0, TAU); c.fill();
  c.restore();
  const g = R.guess, revealed = R.started && (m.cross ? tt >= m.cross.t : R.done);
  if (g && g !== 'none') {
    const gx = X(g.t), gy = Y(g.d);
    c.save(); c.setLineDash([4, 3]); c.strokeStyle = revealed ? (raceRight() ? '#3ddc97' : '#ff7a70') : '#ffd166'; c.lineWidth = 2.2; c.beginPath(); c.arc(gx, gy, 10, 0, TAU); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#fff'; c.font = '900 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', gx, gy + 0.5); c.restore();
  }
  if (revealed && m.cross) {
    const cx = X(m.cross.t), cy = Y(m.cross.d), pr = 1 + Math.sin(time * 5) * 0.1;
    c.save(); c.strokeStyle = '#3ddc97'; c.lineWidth = 3; c.beginPath(); c.arc(cx, cy, Math.max(0, 13 * pr), 0, TAU); c.stroke(); c.restore();
    pill(c, `${t.race.cross}: ${fm(m.cross.t)} ${u.s} · ${fm(m.cross.d, 0)} ${u.m}`, cx + (cx < (pl.l + pl.r) / 2 ? 16 : -16), cy + (cy < (pl.t + pl.b) / 2 ? 24 : -24), { align: cx < (pl.l + pl.r) / 2 ? 'left' : 'right', border: '#3ddc97', color: '#c8ffe5' });
  }
  if (!R.started && !g) pill(c, t.race.tap, (pl.l + pl.r) / 2, (pl.t + pl.b) / 2 - 10, { align: 'center', border: '#ffd166' });
  if (g === 'none' && !R.started) pill(c, t.race.guessNone, (pl.l + pl.r) / 2, (pl.t + pl.b) / 2 - 10, { align: 'center', border: '#ffd166' });
  pill(c, `${t.race.you}: ${t.race.meter(fm(KID), fm(KID * 3.6))}`, pl.r - 4, pl.b - 36, { align: 'right', border: '#5aa9ff' });
  pill(c, `${t.race.bolt}: ${t.race.meter(fm(BOLT), fm(BOLT * 3.6))}`, pl.r - 4, pl.b - 12, { align: 'right', border: '#ffc233' });
}
canvasLoop($('cv'), draw);

// --- pointer input on the canvas ------------------------------------------------------------------------------
const cvPos = (ev) => { const r = $('cv').getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
let dragging = false;
function jumpSet(x, y) {
  const g = G, a = axes(); if (!g) return;
  let t = (x - g.pl.l) / (g.pl.r - g.pl.l) * a.Tm, d = (g.pl.b - y) / (g.pl.b - g.pl.t) * a.Dm;
  t = clamp(t, S.jump.A[0], 100); d = clamp(d, 0, 600); if (t - S.jump.A[0] < 3) t = S.jump.A[0];
  S.jump.B = [t, d]; S.jump.ph = Math.min(S.jump.ph, t + 6); render();
}
$('cv').addEventListener('pointerdown', (ev) => {
  const [x, y] = cvPos(ev), a = axes(); if (!G) return;
  if (lab.view === 'drive' && S.sec === 'jump') { dragging = true; $('cv').setPointerCapture?.(ev.pointerId); jumpSet(x, y); return; }
  if (!inPlot(x, y, G)) { if (lab.view === 'trip') { const run = S.sec === 'home' ? S.home : S.trip; run.seg = null; render(); } return; }
  const t = clamp((x - G.pl.l) / (G.pl.r - G.pl.l) * a.Tm, 0, a.Tm), d = clamp((G.pl.b - y) / (G.pl.b - G.pl.t) * a.Dm, 0, a.Dm);
  if (lab.view === 'trip') {
    const home = S.sec === 'home', run = home ? S.home : S.trip, pts = home ? HOME : TRIP;
    if (run.t >= pts[pts.length - 1][0] && (home || run.started)) { run.seg = segAt(pts, t); sfx.tick(); render(); }
  } else if (lab.view === 'race' && !S.race.started) { S.race.guess = { t, d }; sfx.click(); render(); }
});
$('cv').addEventListener('pointermove', (ev) => { if (dragging) { const [x, y] = cvPos(ev); jumpSet(x, y); } });
['pointerup', 'pointercancel'].forEach((e) => $('cv').addEventListener(e, () => { dragging = false; }));

// --- controls ---------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const resetHome = () => { S.home = { t: 0, playing: true, seg: null }; };
const resetDrive = () => { Object.assign(S.drive, { running: false, done: false, t: 0, d: 0, trail: [[0, 0]], ok: 0, score: 0, lastPush: 0 }); };
const resetRace = () => { S.race = { guess: null, head: S.race.head, started: false, done: false, t: 0 }; };
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('.dt-th'); if (!b || S.trip.pick) return;
  S.trip.pick = b.dataset.k; (S.trip.pick === 'ok' ? sfx.good : sfx.bad)(); render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-seg], [data-lv]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (b.dataset.seg !== undefined) { const run = S.sec === 'home' ? S.home : S.trip; run.seg = +b.dataset.seg; sfx.tick(); }
  else if (b.dataset.lv !== undefined) { S.drive.lv = +b.dataset.lv; resetDrive(); sfx.click(); }
  else if (act === 'tplay') {
    const home = S.sec === 'home', run = home ? S.home : S.trip, Te = (home ? HOME : TRIP).slice(-1)[0][0];
    if (!home && !S.trip.started) { S.trip.started = true; run.t = 0; run.playing = true; }
    else if (run.t >= Te) { run.t = 0; run.playing = true; run.seg = null; }
    else run.playing = !run.playing;
    sfx.click(); showStage();
  } else if (act === 'dplay') { resetDrive(); S.drive.running = true; sfx.click(); showStage(); }
  else if (act === 'jreset') { S.jump.B = [80, 300]; S.jump.ph = 0; sfx.click(); }
  else if (act === 'rgo') { if (!S.race.guess) return; if (S.race.started && S.race.done) { resetRace(); } else if (!S.race.started) { S.race.started = true; S.race.t = 0; showStage(); } sfx.click(); }
  else if (act === 'rnone') { if (!S.race.started) { S.race.guess = 'none'; sfx.click(); } }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (k === 'home') { lab.view = 'trip'; S.sec = S.sec === 'home' ? null : 'home'; if (S.sec) resetHome(); }
    else { lab.view = 'drive'; S.sec = S.sec === 'jump' ? null : 'jump'; if (S.sec) { S.jump.B = [80, 300]; S.jump.ph = 0; } }
    lab.renderChrome(); sfx.click(); showStage();
  }
  render();
});
$('dSpd').addEventListener('input', (ev) => { S.v = +ev.target.value; render(); });
$('rHead').addEventListener('input', (ev) => { if (S.race.started && !S.race.done) return; resetRace(); S.race.head = +ev.target.value; render(); });

// --- readout, state card and controls ---------------------------------------------------------------------------
let roKey = '';
function readout() {
  const t = T[lang], v = lab.view, u = t.u; let val = '', sub = '', pill_ = '', col = '#4fc3f7';
  if (v === 'trip') {
    const home = S.sec === 'home', run = home ? S.home : S.trip;
    if (!home && !run.started) { val = '?'; sub = ''; }
    else {
      const pts = home ? HOME : TRIP, d = pointAt(pts, run.t), sp = run.playing ? Math.abs(slopeOf(pts, segAt(pts, run.t))) : 0;
      val = `${fm(sp)} ${u.ms}`; sub = `${fm(d, 0)} ${u.m} · ${fm(run.t, 0)} ${u.s}`;
    }
    if (!home && S.trip.pick) pill_ = t.trip.pick('ABC'[S.trip.order.indexOf(S.trip.pick)]) + (S.trip.pick === 'ok' ? ' ✓' : ' ✗');
    if (home) col = '#ffb25c';
  } else if (v === 'drive' && S.sec !== 'jump') {
    const D = S.drive; val = `${fm(S.v).replace('-', '−')} ${u.ms}`; sub = `${fm(D.d, 0)} ${u.m} · ${fm(D.t, 0)} ${u.s}`; col = '#ff9f5a';
    if (D.done) pill_ = t.drive.match(D.score);
  } else if (v === 'drive') {
    const J = S.jump, A = J.A, B = J.B, vert = B[0] - A[0] < 3;
    val = vert ? '∞' : `${fm(Math.abs((B[1] - A[1]) / (B[0] - A[0])))} ${u.ms}`; sub = t.jump.sub; col = '#ff6b6b';
  } else {
    val = `${t.race.you}: ${fm(KID)} ${u.ms}`; sub = `= ${fm(KID * 3.6)} ${u.kmh}`; col = '#5aa9ff';
    pill_ = `${t.race.bolt}: ${fm(BOLT)} ${u.ms} = ${fm(BOLT * 3.6)} ${u.kmh}`;
  }
  const k = [val, sub, pill_, col, lang].join('|');
  if (k !== roKey) { roKey = k; lab.setReadout(val, sub, pill_, col); }
}
const thumb = (k) => {
  const X = (t) => (14 + t / 200 * 98).toFixed(1), Y = (d) => (74 - d / 600 * 64).toFixed(1);
  return `<svg viewBox="0 0 120 84" aria-hidden="true"><path d="M14 6V74H114" fill="none" stroke="#646C84" stroke-width="1.6" stroke-linecap="round"/><polyline points="${THUMB[k].map((p) => `${X(p[0])},${Y(p[1])}`).join(' ')}" fill="none" stroke="#4fc3f7" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
};
function render() {
  const t = T[lang], v = lab.view, home = v === 'trip' && S.sec === 'home', jump = v === 'drive' && S.sec === 'jump', u = t.u;
  document.body.dataset.v = v;
  $('secTrip').style.display = v === 'trip' ? '' : 'none';
  $('secDrive').style.display = v === 'drive' && !jump ? '' : 'none';
  $('secJump').style.display = jump ? '' : 'none';
  $('secRace').style.display = v === 'race' ? '' : 'none';
  const sec = (k, emo, txt) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(txt)}` : '🔒 ???'}</button>`;
  $('dtSec').innerHTML = sec('home', '🏠', t.secrets.home[0]) + sec('jump', '⚡', t.secrets.jump[0]);
  askEl.style.display = 'none';
  let st = { emo: '', title: '', lead: '', body: '', extra: '' }, facts = [];
  const F = (k) => ({ emo: k === 'rail' ? '🚂' : k === 'snail' ? '🐌' : '⚡', text: t.facts[k][0], src: t.facts[k][1] });
  if (v === 'trip') {
    const run = home ? S.home : S.trip, pts = home ? HOME : TRIP, Te = pts[pts.length - 1][0], tp = t.trip, info = home ? t.home : tp;
    const names = home ? t.home.chips : tp.chips, done = run.t >= Te && (home || run.started);
    $('tSegs').innerHTML = names.map((n, i) => `<button class="chip dt-seg ${run.seg === i ? 'on' : ''}" data-seg="${i}"${done ? '' : ' disabled'}>${esc(n)}</button>`).join('');
    const pb = $('tPlay');
    pb.textContent = !home && !S.trip.started ? tp.play : run.t >= Te ? tp.again : run.playing ? tp.pause : run.t > 0 ? tp.cont : tp.play;
    pb.disabled = !home && !S.trip.started && !S.trip.pick;
    if (!home && !S.trip.started) {
      lab.setGlow('rgba(79, 195, 247, .24)'); const pk = S.trip.pick;
      askEl.style.display = '';
      askEl.innerHTML = `<div class="dt-story">${esc(tp.story)}</div><div class="dt-q">${esc(tp.q)}</div>
        <div class="dt-ths">${S.trip.order.map((k, i) => {
    const cls = !pk ? '' : k === 'ok' ? 'good' : k === pk ? 'bad' : 'dim', mark = !pk ? '' : k === 'ok' ? '✓' : k === pk ? '✗' : '';
    return `<button class="dt-th ${cls}" data-k="${k}"${pk ? ' disabled' : ''} aria-label="${'ABC'[i]}"><span class="dt-tl">${'ABC'[i]}</span><span class="dt-mark">${mark}</span>${thumb(k)}</button>`;
  }).join('')}</div>
        ${pk ? `<div class="dt-verdict"><b style="color:${pk === 'ok' ? 'var(--ok)' : 'var(--wip)'}">${esc(pk === 'ok' ? tp.rightV : tp.wrongV)}</b>${esc(pk === 'ok' ? tp.rightT : tp.wrongT)}</div>` : ''}`;
      placeAsk();
      st = pk ? { emo: pk === 'ok' ? '✅' : '🤔', title: pk === 'ok' ? tp.rightV : tp.wrongV, lead: pk === 'ok' ? tp.rightT : tp.wrongT, body: '', extra: '' }
        : { emo: '🤔', title: tp.q, lead: tp.story, body: '', extra: '' };
    } else {
      lab.setGlow(home ? 'rgba(255, 178, 92, .22)' : 'rgba(79, 195, 247, .24)');
      const i = segAt(pts, run.t);
      if (done && run.seg !== null) {
        const p0 = pts[run.seg], p1 = pts[run.seg + 1], dd = Math.abs(p1[1] - p0[1]), tt = p1[0] - p0[0];
        st = { emo: '🧮', title: tp.formula(fm(dd, 0), fm(tt, 0), fm(dd / tt)), lead: `${info.seg[run.seg][0]}. ${info.seg[run.seg][1]}`, body: '', extra: '' };
      } else if (done) st = { emo: home ? '🏠' : '👆', title: info.done[0], lead: info.done[1], body: '', extra: '' };
      else st = { emo: (home ? ['🛴', '🥐', '🏠'] : ['🛴', '🥐', '💨', '🚶'])[i], title: info.seg[i][0], lead: info.seg[i][1], body: '', extra: '' };
    }
    facts = [F('rail')];
  } else if (v === 'drive' && !jump) {
    const D = S.drive, dv = t.drive;
    lab.setGlow('rgba(255, 159, 90, .22)');
    $('dLv').innerHTML = dv.levels.map((n, i) => `<button class="chip dt-seg ${D.lv === i ? 'on' : ''}" data-lv="${i}">${esc(n)}</button>`).join('');
    $('dSpLbl').textContent = dv.spd; $('dSpd').value = S.v; $('dSpd').setAttribute('aria-label', dv.spd);
    $('dPlay').textContent = D.running ? dv.restart : D.done ? dv.again : dv.play;
    $('dFine').textContent = dv.fine;
    if (D.done) { const e = D.score >= 80 ? dv.end[0] : D.score >= 50 ? dv.end[1] : dv.end[2]; st = { emo: D.score >= 80 ? '🏆' : '🎯', title: `${e[0]} ${dv.match(D.score)}`, lead: e[1], body: '', extra: '' }; }
    else st = { emo: '🎮', title: dv.title, lead: dv.hint[D.lv], body: dv.sub, extra: '' };
    facts = [F('snail')];
  } else if (jump) {
    const J = S.jump, vert = J.B[0] - J.A[0] < 3, jv = t.jump;
    lab.setGlow('rgba(255, 107, 107, .22)'); $('jReset').textContent = jv.reset;
    st = vert ? { emo: '⚡', title: jv.vTitle, lead: jv.vLead(fm(J.A[1], 0), fm(J.B[1], 0)), body: '', extra: '' } : { emo: '⚡', title: jv.title, lead: jv.lead, body: '', extra: '' };
    facts = [F('rail')];
  } else {
    const R = S.race, rc = t.race, m = raceMath();
    lab.setGlow('rgba(90, 169, 255, .22)');
    $('rHeadLbl').textContent = `${rc.head}: ${R.head} ${u.m}`; $('rHead').value = R.head; $('rHead').disabled = R.started && !R.done;
    $('rGo').textContent = R.started && R.done ? rc.again : rc.go; $('rGo').disabled = !R.guess || (R.started && !R.done);
    $('rNone').textContent = rc.none; $('rNone').disabled = R.started; $('rNone').classList.toggle('on', R.guess === 'none');
    const revealed = R.started && (m.cross ? R.t >= m.cross.t : R.done);
    if (!revealed) st = { emo: R.started ? '🏃' : '🤔', title: R.started ? rc.wait : rc.q, lead: rc.lead(R.head), body: '', extra: '' };
    else {
      const ok = raceRight(), line = m.cross ? rc.crossT(fm(m.cross.t), fm(m.cross.d, 0)) : (R.head < 1 ? rc.none0 : rc.noneH);
      st = { emo: ok ? '✅' : '🤔', title: ok ? rc.right : rc.wrong, lead: line, body: R.done ? rc.slope : '', extra: '' };
    }
    facts = [{ emo: '⚡', text: t.facts.bolt[0], src: t.facts.bolt[1] }];
  }
  lab.setState(st); lab.setFacts(facts); readout();
}
render();
</script>
