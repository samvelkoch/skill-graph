const rnd = (n) => Math.floor(Math.random() * n);

// --- geometry: the map frame (lon -110..140, lat -15..62, Mercator) and the coastlines from labs/poles/geo.js --------
const LON0 = -110, LON1 = 140, LAT0 = -15, LAT1 = 62;
const mer = (la) => Math.log(Math.tan(Math.PI / 4 + clamp(la, -80, 85) * Math.PI / 360)) * 180 / Math.PI;

  const a = decode(s, 10);
  let keep = false;
  for (let i = 0; i < a.length; i += 2) if (a[i] > LON0 - 8 && a[i] < LON1 + 8 && a[i + 1] > LAT0 - 6 && a[i + 1] < LAT1 + 10) { keep = true; break; }

function keyAt(x, y) { // a key under the point (design units), or null
  const { K, x0, ky, kh, kw, kbw } = LY;
  if (!K || y < ky || y > ky + kh || x < x0 || x > x0 + kbw) return null;
  const whiteOn = lab.view !== 'black' || S.white;
  if (!whiteOn) { // white keys are greyed: the black keys take the whole upper part of the keyboard, nearest key wins
    if (y > ky + kh * 0.8) return null;
    let best = null, bd = 1e9;
    for (const b of K.blacks) { const d = Math.abs(x - b.cx); if (d < bd) { bd = d; best = b; } }
    return bd <= Math.max(13, kw * 0.52) ? best : null;
  }
  for (const b of K.blacks) if (y <= b.y + b.h + (kh - b.h) * 0.12 && Math.abs(x - b.cx) <= b.w / 2 + 3) return b;
  return K.whites[clamp(Math.floor((x - x0) / kw), 0, K.whites.length - 1)];
}

  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left) / LY.s, y = (ev.clientY - r.top) / LY.s, v = lab.view;

  } else {
    $('fnPredW').innerHTML = predHTML('w', t.worldAsk, t.worldOpts, S.wAns, t.worldRight, t.worldWrong);
    $('fnCardsW').innerHTML = S.cards.map((k) => `<div class="fn-card"><div class="fn-card-h"><b>${esc(t.world[k][0])}</b><button class="fn-play" data-play="${k}" aria-label="▶ ${esc(t.world[k][0])}">▶</button></div><p>${esc(t.world[k][1])}</p>${k === 'jv' ? `<div class="fn-made">${esc(t.slendro)}</div>` : ''}<div class="fn-made">♪ ${esc(t.made)}</div></div>`).join('');
  }
  renderInfo();
}
function renderInfo() {
  const t = T[lang], v = lab.view, val = (x) => `<span class="fn-val">${esc(x)}</span>`;
  if (v === 'black') {
    lab.setGlow('rgba(127, 209, 199, .26)');
    if (S.bAns === null) { lab.setReadout('?', '', '', '#2f9c91'); lab.setState({ emo: '🤔', title: t.blackAsk, lead: '', body: '' }); lab.setFacts([]); return; }
    lab.setReadout(val(t.fiveNotes), t.names, t.clashes(S.cl), S.cl > 0 ? '#c9503a' : '#2f9c91');
    if (S.sec) lab.setState({ emo: S.sec === 'a' ? '🎹' : '🔔', title: t.secrets[S.sec][0], lead: S.sec === 'a' ? t.canonText : t.debussyText, body: '' });
    else { const [emo, title, lead, body] = t.st.black; lab.setState({ emo, title, lead, body }); }
    lab.setFacts(t.facts.black);
  } else if (v === 'tunes') {
    lab.setGlow('rgba(244, 201, 93, .24)');
    if (S.tAns === null) { lab.setReadout('?', '', '', '#b9892a'); lab.setState({ emo: '🤔', title: t.tunesAsk, lead: '', body: '' }); lab.setFacts([]); return; }
    lab.setReadout(val(S.tSel === 'grace' ? t.graceVal : t.odeVal), '', t[S.tSel ?? 'ode'], '#b9892a');
    const [emo, title, lead, body] = t.st.tunes; lab.setState({ emo, title, lead, body });
    lab.setFacts(t.facts.tunes);
  } else {
    lab.setGlow('rgba(95, 160, 200, .26)');
    if (S.wAns === null) { lab.setReadout('?', '', '', '#3b86a8'); lab.setState({ emo: '🤔', title: t.worldAsk, lead: '', body: '' }); lab.setFacts([]); return; }
    lab.setReadout(val(t.world[S.wSel ?? 'jv'][0]), '', t.five, '#3b86a8');
    const [emo, title, lead, body] = t.st.world; lab.setState({ emo, title, lead, body });
    lab.setFacts(t.facts.world);
  }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const s = Math.min(w / 340, h / 280); DS = s; DW = w / s; DH = h / s;
  const t = now(), v = lab.view;
  c.save(); c.scale(s, s);
  // the events that are due
  if (S.ev) {
    const E = S.ev;
    while (E.i < E.list.length && E.list[E.i].at <= t) fire(E.list[E.i++]);
    if (t >= E.end && S.ev === E) { S.ev = null; E.then?.(); }
  }
  S.meter = Math.max(0, S.meter - dt / 1.6);
  // the stage panel
  const bg = c.createLinearGradient(0, 0, DW * 0.4, DH); bg.addColorStop(0, '#182038'); bg.addColorStop(1, '#0c1020');
  c.fillStyle = bg; rr(c, 0, 0, DW, DH, 18); c.fill(); c.strokeStyle = 'rgba(130,145,190,.22)'; c.lineWidth = 1; c.stroke();
  if (v === 'world') drawWorld(c, t, time); else drawKeys(c, t, time, v);
  c.restore();
});

render();
</script>
