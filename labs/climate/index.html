// 2. The made-up town: seasons + random daily zig-zag + a slow trend (a toy generator, not data) -------------
const N = 90 * 365, LONG = 30 * 365, COLD = 14;
const ZL = { w: 7, y: 365, t: LONG };
const base = new Float32Array(N), data = new Float32Array(N), P = new Float64Array(N + 1);
(() => {
  let s = 20260;
  const rnd = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const gau = () => Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(2 * Math.PI * rnd());
  const yr = Array.from({ length: 92 }, () => gau() * 0.5);
  let ar = 0;
  for (let i = 0; i < N; i++) {
    ar = 0.65 * ar + gau() * 2.5;
    const doy = (i + 271) % 365, y = i / 365, k = Math.floor(y), f = y - k;
    base[i] = 10 + 10.5 * Math.sin(2 * Math.PI * (doy - 105) / 365) + ar + lerp(yr[k], yr[k + 1], f * f * (3 - 2 * f));
  }
})();

const S = { zoom: 'w', trend: 40, cold: false, volcano: false, level: 28, zone: 'tropic', zt: 0, secret: null,
  scrubP: 0, scrubUntil: 0, answered: store.get('climate:asked', false), answer: null };
const IV = N - 15 * 365; // the eruption of the "Volcano winter" secret
function rebuild() {
  const tr = S.trend * 0.001; // toy degrees per year
  for (let i = 0; i < N; i++) {
    let v = base[i] + tr * (i / 365);
    if (S.volcano && i >= IV) { const d = i - IV; v -= 2.6 * Math.min(1, d / 40) * Math.exp(-d / 420); }
    data[i] = v;
  }
  if (S.cold) data[N - 1] -= COLD;
  for (let i = 0; i < N; i++) P[i + 1] = P[i] + data[i];
}
const avgAt = (i) => (P[i + 1] - P[i + 1 - LONG]) / LONG;
rebuild();

const FONT = 'Nunito, ui-sans-serif, system-ui, sans-serif';
const setFont = (c, px, wt = 700) => { c.font = `${wt} ${px}px ${FONT}`; };
function label(c, txt, x, y, col = '#cfd6ea', px = 12, align = 'left', maxW = 0) {
  if (maxW) { setFont(c, px); while (px > 8 && c.measureText(txt).width > maxW) { px -= 0.5; setFont(c, px); } }
  setFont(c, px); c.textAlign = align; c.textBaseline = 'middle';
  c.lineWidth = 3; c.lineJoin = 'round'; c.strokeStyle = 'rgba(10,12,20,.78)'; c.strokeText(txt, x, y);
  c.fillStyle = col; c.fillText(txt, x, y);
}
function emoji(c, e, x, y, px) { c.font = `${px}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(e, x, y); }

// 6. Scene 1: weather vs climate -------------------------------------------------------------------------------
let Lcur = 7;
const DOM = { lo: 0, hi: 20, init: false };
function drawWeather(c, w, h, dt, time) {
  const t = T[lang], tc = t.c;
  Lcur = Math.exp(lerp(Math.log(Lcur), Math.log(ZL[S.zoom]), 1 - Math.exp(-dt * 5)));
  const px0 = Math.max(36, w * 0.075), px1 = w - 14, py0 = 58, py1 = h - 44;
  PLOT = { px0, px1 };
  const start = N - Lcur, i0 = Math.max(0, Math.ceil(start));
  const X = (i) => px0 + (i - start) / (Lcur - 1) * (px1 - px0);
  // vertical range follows the window
  let lo = 1e9, hi = -1e9;
  const sd = Math.max(1, Math.floor(Lcur / 300));
  for (let i = i0; i < N; i += sd) { const v = data[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
  const av0 = avgAt(N - 1); lo = Math.min(lo, av0); hi = Math.max(hi, av0);
  const pad = Math.max(1.5, (hi - lo) * 0.1); lo -= pad; hi += pad;
  if (!DOM.init) { DOM.lo = lo; DOM.hi = hi; DOM.init = true; }
  const k = 1 - Math.exp(-dt * 6); DOM.lo = lerp(DOM.lo, lo, k); DOM.hi = lerp(DOM.hi, hi, k);
  const Y = (v) => py1 - (v - DOM.lo) / (DOM.hi - DOM.lo) * (py1 - py0);

  // sky-ish panel + grid
  const bg = c.createLinearGradient(0, py0, 0, py1); bg.addColorStop(0, 'rgba(60,90,150,.16)'); bg.addColorStop(1, 'rgba(60,90,150,.04)');
  c.fillStyle = bg; c.fillRect(px0, py0, px1 - px0, py1 - py0);
  const range = DOM.hi - DOM.lo, step = [1, 2, 5, 10, 20].find((s) => range / s <= 7) ?? 20;
  c.lineWidth = 1;
  for (let v = Math.ceil(DOM.lo / step) * step; v <= DOM.hi; v += step) {
    const y = Y(v); if (y < py0 || y > py1) continue;
    c.strokeStyle = 'rgba(130,145,190,.16)'; c.beginPath(); c.moveTo(px0, y); c.lineTo(px1, y); c.stroke();
    label(c, `${v}°`, px0 - 5, y, '#7f88a2', 10, 'right');
  }
  c.save(); c.beginPath(); c.rect(px0 - 2, py0 - 20, px1 - px0 + 24, py1 - py0 + 40); c.clip();

  // cursor (the dog's position): loops by itself, or follows a finger/mouse for a few seconds
  const cyc = 10, p = time < S.scrubUntil ? S.scrubP : (time % cyc) / cyc;
  const idx = clamp(N - Lcur + p * (Lcur - 1), 0, N - 1), ic = Math.floor(idx), fr = idx - ic, ic2 = Math.min(ic + 1, N - 1);
  const xc = X(idx);
  const st = Math.max(1, Math.floor(Lcur / (w * 1.5)));
  const path = (fn, upto, lw, col) => {
    c.beginPath(); let first = true;
    for (let i = i0; i <= upto; i += st) { const x = X(i), y = fn(i); first ? c.moveTo(x, y) : c.lineTo(x, y); first = false; }
    c.lineWidth = lw; c.strokeStyle = col; c.lineJoin = 'round'; c.stroke();
  };
  // owner (the 30-year average): steady
  const yAvg = (i) => Y(avgAt(i)), yDay = (i) => Y(data[i]);
  const wk = Lcur < 40;
  path(yDay, N - 1, wk ? 2 : 1.2, 'rgba(78,168,255,.30)');
  path(yAvg, N - 1, 3, 'rgba(255,180,84,.35)');
  path(yDay, ic, wk ? 2.8 : 1.6, '#4ea8ff');
  path(yAvg, ic, 3.6, '#ffb454');
  if (wk) for (let i = i0; i < N; i++) { c.fillStyle = i <= ic ? '#4ea8ff' : 'rgba(78,168,255,.45)'; c.beginPath(); c.arc(X(i), yDay(i), 3.4, 0, 7); c.fill(); }

  // markers: the cold day (today) and the eruption
  if (S.cold) {
    const xn = X(N - 1), yn = yDay(N - 1);
    c.setLineDash([3, 4]); c.strokeStyle = 'rgba(159,216,255,.6)'; c.lineWidth = 1; c.beginPath(); c.moveTo(xn, py0); c.lineTo(xn, py1); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#9fd8ff'; c.beginPath(); c.arc(xn, yn, 4.5, 0, 7); c.fill();
    emoji(c, '❄️', xn - 12, Math.min(py1 - 10, yn + 18), clamp(h * 0.05, 14, 22));
    label(c, t.coldLbl, xn - 10, py0 + 10, '#9fd8ff', clamp(w / 40, 10, 13), 'right');
  }
  if (S.volcano && IV >= start) {
    const xv = X(IV);
    c.setLineDash([3, 4]); c.strokeStyle = 'rgba(255,140,90,.6)'; c.lineWidth = 1; c.beginPath(); c.moveTo(xv, py0); c.lineTo(xv, py1); c.stroke(); c.setLineDash([]);
    emoji(c, '🌋', xv, py0 + 14, clamp(h * 0.06, 16, 26));
    label(c, t.eruption, xv + 6, py0 + 34, '#ff9a6a', clamp(w / 40, 10, 13), 'left');
  }
  // dog + leash + owner
  const yD = Y(lerp(data[ic], data[ic2], fr)), yO = Y(lerp(avgAt(ic), avgAt(ic2), fr)), fs = clamp(Math.min(w, h) * 0.075, 18, 32);
  c.strokeStyle = 'rgba(245,230,208,.85)'; c.lineWidth = 1.6; c.beginPath();
  c.moveTo(xc, yO - fs * 0.2); c.quadraticCurveTo(xc + (yD > yO ? 9 : -9), (yD + yO) / 2, xc, yD); c.stroke();
  emoji(c, '🚶', xc, yO - fs * 0.62, fs);
  emoji(c, '🐕', xc, yD - fs * 0.15, fs);
  c.restore();

  // legend, axis caption, honest label
  const lp = clamp(w / 34, 10.5, 13);
  c.lineWidth = 3; c.strokeStyle = '#4ea8ff'; c.beginPath(); c.moveTo(px0, 16); c.lineTo(px0 + 18, 16); c.stroke();
  label(c, `🐕 ${tc.dog}`, px0 + 24, 16, '#bcd9ff', lp, 'left', w - px0 - 40);
  c.strokeStyle = '#ffb454'; c.beginPath(); c.moveTo(px0, 36); c.lineTo(px0 + 18, 36); c.stroke();
  label(c, `🚶 ${tc.owner}`, px0 + 24, 36, '#ffd9a0', lp, 'left', w - px0 - 40);
  label(c, `↔ ${t.zoom[S.zoom]}`, (px0 + px1) / 2, py1 + 17, '#cfd6ea', clamp(w / 32, 11, 14), 'center');
  label(c, tc.madeUp, w / 2, h - 10, '#7f88a2', clamp(w / 52, 9, 11.5), 'center', w - 16);
}

// 7. Scene 2: the blanket ----------------------------------------------------------------------------------------
const SIM = { ir: [], mol: [], sun: [], tSun: 0, tIr: 0, temp: 0.4, glow: 0, id: 0 };
const molTarget = () => Math.round(2 + S.level / 100 * 24);
function drawBlanket(c, w, h, dt, time) {
  const t = T[lang], tc = t.c, s = clamp(w / 700, 0.75, 1.25), hs = clamp(h / 380, 0.7, 1.4);
  const gv = 0.8, gy = h * gv, no = S.secret === 's1';
  const sx = w * 0.86, sy = h * 0.11, sr = clamp(h * 0.055, 12, 24), R = 15 * s, spd = 92 * hs;
  // --- simulate
  const target = no ? 0 : molTarget();
  const alive = SIM.mol.filter((m) => !m.dying).length;
  if (alive < target) SIM.mol.push({ id: ++SIM.id, u: 0.14 + Math.random() * 0.84, v: 0.2 + Math.random() * 0.38, vx: (Math.random() - 0.5) * 18, ph: Math.random() * 6.3, rot: Math.random() * 3.14, glow: 0, alpha: 0, q: [], dying: false });
  else if (alive > target) { const m = SIM.mol.find((q) => !q.dying); if (m) m.dying = true; }
  for (const m of SIM.mol) {
    m.u += m.vx * dt / w; if (m.u > 1.02) m.u = 0.13; if (m.u < 0.12) m.u = 1.0;
    m.alpha = clamp(m.alpha + (m.dying ? -dt * 1.5 : dt * 1.5), 0, 1); m.glow = Math.max(0, m.glow - dt * 2.2);
    for (let i = m.q.length - 1; i >= 0; i--) {
      m.q[i] -= dt;
      if (m.q[i] <= 0) { m.q.splice(i, 1); const a = Math.random() * 6.283; if (SIM.ir.length < 150) SIM.ir.push({ u: m.u, v: m.v, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, imm: m.id, immT: 0.7 }); }
    }
  }
  SIM.mol = SIM.mol.filter((m) => !(m.dying && m.alpha <= 0));
  SIM.tSun -= dt; if (SIM.tSun <= 0) {
    SIM.tSun = 0.3; const tx = (0.1 + Math.random() * 0.85) * w, dx = tx - sx, dy = gy - sy, d = Math.hypot(dx, dy), v = 200 * hs;
    SIM.sun.push({ u: sx / w, v: sy / h, vx: dx / d * v, vy: dy / d * v, x0: sx });
  }
  for (const r of SIM.sun) { r.u += r.vx * dt / w; r.v += r.vy * dt / h; }
  SIM.sun = SIM.sun.filter((r) => { if (r.v >= gv) { SIM.glow = Math.min(1, SIM.glow + 0.12); return false; } return true; });
  SIM.tIr -= dt; if (SIM.tIr <= 0) {
    SIM.tIr = 0.17; const a = -Math.PI / 2 + (Math.random() - 0.5) * 0.7;
    if (SIM.ir.length < 150) SIM.ir.push({ u: 0.1 + Math.random() * 0.88, v: gv, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, imm: 0, immT: 0 });
  }
  SIM.ir = SIM.ir.filter((q) => {
    q.u += q.vx * dt / w; q.v += q.vy * dt / h; q.immT -= dt;
    if (q.v < 0 || q.u < -0.03 || q.u > 1.03) return false;
    if (q.v >= gv && q.vy > 0) { SIM.glow = Math.min(1, SIM.glow + 0.1); return false; }
    for (const m of SIM.mol) {
      if (m.alpha < 0.6 || m.dying || (m.id === q.imm && q.immT > 0)) continue;
      const dx = (q.u - m.u) * w, dy = (q.v - m.v) * h;
      if (dx * dx + dy * dy < R * R) { m.glow = 1; m.q.push(0.22); return false; }
    }
    return true;
  });
  SIM.glow *= Math.exp(-dt * 1.2);
  const tt = no ? 0.08 : 0.3 + 0.5 * clamp(S.level / 100, 0, 1);
  SIM.temp = lerp(SIM.temp, tt, 1 - Math.exp(-dt * 1.6));
  const warm = clamp((SIM.temp - 0.08) / 0.7, 0, 1), tcol = `hsl(${lerp(205, 8, warm)}, 85%, ${lerp(68, 52, warm)}%)`;

  // --- draw
  const sky = c.createLinearGradient(0, 0, 0, gy); sky.addColorStop(0, '#09112b'); sky.addColorStop(1, '#1b3a66'); c.fillStyle = sky; c.fillRect(0, 0, w, gy);
  c.fillStyle = 'rgba(120,170,255,.07)'; c.fillRect(0, h * 0.16, w, h * 0.46);
  c.setLineDash([4, 5]); c.strokeStyle = 'rgba(150,190,255,.25)'; c.lineWidth = 1;
  for (const yy of [h * 0.16, h * 0.62]) { c.beginPath(); c.moveTo(0, yy); c.lineTo(w, yy); c.stroke(); }
  c.setLineDash([]);
  const gl = c.createRadialGradient(sx, sy, sr * 0.6, sx, sy, sr * 3.4); gl.addColorStop(0, 'rgba(255,214,102,.5)'); gl.addColorStop(1, 'rgba(255,214,102,0)');
  c.fillStyle = gl; c.beginPath(); c.arc(sx, sy, sr * 3.4, 0, 7); c.fill();
  c.fillStyle = '#ffd166'; c.beginPath(); c.arc(sx, sy, sr, 0, 7); c.fill();
  // sunlight
  for (const r of SIM.sun) {
    const x = r.u * w, y = r.v * h, d = Math.hypot(r.vx, r.vy), ux = r.vx / d, uy = r.vy / d, L = 26 * s;
    c.globalAlpha = clamp(Math.hypot(x - sx, y - sy) / (sr * 2.2), 0, 1);
    c.strokeStyle = '#ffd166'; c.lineWidth = 2.4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x - ux * L, y - uy * L); c.lineTo(x, y); c.stroke();
    c.beginPath(); c.moveTo(x - ux * 7 - uy * 4, y - uy * 7 + ux * 4); c.lineTo(x, y); c.lineTo(x - ux * 7 + uy * 4, y - uy * 7 - ux * 4); c.stroke();
    c.globalAlpha = 1;
  }
  // ground
  c.fillStyle = `hsl(${lerp(205, 24, warm)}, ${lerp(35, 45, warm)}%, ${lerp(72, 30, warm)}%)`; c.fillRect(0, gy, w, h - gy);
  const gg = c.createLinearGradient(0, gy - 26, 0, gy + 6); gg.addColorStop(0, 'rgba(255,120,60,0)'); gg.addColorStop(1, `rgba(255,120,60,${(0.12 + SIM.glow * 0.55) * (0.4 + warm * 0.6)})`);
  c.fillStyle = gg; c.fillRect(0, gy - 26, w, 32);
  // greenhouse gas molecules: O=C=O
  for (const m of SIM.mol) {
    const x = m.u * w, y = m.v * h + Math.sin(time * 1.2 + m.ph) * 3;
    c.save(); c.translate(x, y); c.rotate(m.rot + Math.sin(time * 0.6 + m.ph) * 0.25); c.globalAlpha = m.alpha;
    if (m.glow > 0.02) { const g2 = c.createRadialGradient(0, 0, 2, 0, 0, 30 * s); g2.addColorStop(0, `rgba(255,120,80,${m.glow * 0.7})`); g2.addColorStop(1, 'rgba(255,120,80,0)'); c.fillStyle = g2; c.beginPath(); c.arc(0, 0, 30 * s, 0, 7); c.fill(); }
    c.strokeStyle = '#c9d2ea'; c.lineWidth = 2; c.beginPath(); c.moveTo(-9 * s, 0); c.lineTo(9 * s, 0); c.stroke();
    c.fillStyle = '#ff6b5e'; for (const sgn of [-1, 1]) { c.beginPath(); c.arc(sgn * 9 * s, 0, 5 * s, 0, 7); c.fill(); }
    c.fillStyle = '#9aa7c2'; c.beginPath(); c.arc(0, 0, 5.4 * s, 0, 7); c.fill();
    c.restore();
  }
  // heat (infrared): wavy red arrows
  c.lineCap = 'round';
  for (const q of SIM.ir) {
    const x = q.u * w, y = q.v * h, d = Math.hypot(q.vx, q.vy), ux = q.vx / d, uy = q.vy / d, nx = -uy, ny = ux, L = 30 * s;
    c.beginPath();
    for (let j = 0; j <= 10; j++) {
      const f = j / 10, off = Math.sin(f * 18 - time * 9) * 3.2 * s * f, px = x - ux * L * (1 - f) + nx * off, py = y - uy * L * (1 - f) + ny * off;
      j ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.strokeStyle = 'rgba(255,96,76,.95)'; c.lineWidth = 2; c.stroke();
    c.beginPath(); c.moveTo(x - ux * 8 - nx * 4.5, y - uy * 8 - ny * 4.5); c.lineTo(x, y); c.lineTo(x - ux * 8 + nx * 4.5, y - uy * 8 + ny * 4.5); c.stroke();
  }
  // thermometer (toy scale, no numbers; the textbook numbers appear only in the secret)
  const tx = clamp(w * 0.05, 18, 30), ty0 = h * 0.24, ty1 = gy - 18, th = ty1 - ty0, ty = (f) => ty1 - f * th;
  c.fillStyle = 'rgba(255,255,255,.13)'; c.beginPath(); c.roundRect(tx - 6, ty0, 12, th + 6, 6); c.fill();
  c.fillStyle = tcol; c.beginPath(); c.roundRect(tx - 4, ty(SIM.temp), 8, ty1 + 6 - ty(SIM.temp), 4); c.fill();
  c.beginPath(); c.arc(tx, ty1 + 10, 9, 0, 7); c.fill();
  if (no) {
    c.setLineDash([3, 3]); c.strokeStyle = 'rgba(255,170,90,.9)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(tx - 10, ty(0.58)); c.lineTo(tx + 12, ty(0.58)); c.stroke(); c.setLineDash([]);
    label(c, `${tc.withBl} ≈ +15 °C`, tx + 18, ty(0.58), '#ffb070', clamp(w / 40, 10.5, 13), 'left', w - tx - 30);
    label(c, `${tc.noBl} ≈ −18 °C`, tx + 18, ty(SIM.temp) - 2, '#8fd0ff', clamp(w / 36, 11, 14), 'left', w - tx - 30);
  } else {
    label(c, tc.warmer, tx + 14, ty0 + 4, '#ffb59a', clamp(w / 48, 9.5, 12), 'left');
    label(c, tc.colder, tx + 14, ty1 - 2, '#9fd0ff', clamp(w / 48, 9.5, 12), 'left');
  }
  const lp = clamp(w / 48, 9.5, 12.5);
  label(c, tc.sun, sx - sr * 1.8, sy + sr * 0.2, '#ffd166', lp + 1, 'right');
  label(c, tc.heat, w * 0.2, gy - 13, '#ff8f80', lp + 0.5, 'left', w * 0.4);
  label(c, tc.gas, w - 10, h * 0.16 + 12, '#a8c4ff', lp, 'right', w * 0.55);
  label(c, `↑ ${tc.space}`, w * 0.5, 12, '#7f88a2', lp, 'center');
  label(c, tc.ground, w - 10, gy + 16, 'rgba(255,255,255,.75)', lp, 'right');
  label(c, tc.madeUp.split(' · ')[1] ?? '', w / 2, h - 8, '#7f88a2', clamp(w / 52, 9, 11.5), 'center', w - 16);
}

// 8. Scene 3: climate zones ---------------------------------------------------------------------------------------
const ZE = { tropic: '🌴', temperate: '🌳', polar: '🧊', desert: '🏜️' };
const ZC = { tropic: '#35c27a', temperate: '#9bcf53', polar: '#cfe8ff', desert: '#e3b45c' };
const sn = (m) => Math.sin(2 * Math.PI * (m - 3) / 12);
const ZP = {
  tropic: { tmp: (m) => 0.86 + 0.03 * sn(m), rain: (m) => 0.8 + 0.1 * Math.cos(2 * Math.PI * m / 12) },
  temperate: { tmp: (m) => 0.5 + 0.3 * sn(m), rain: (m) => 0.45 + 0.05 * Math.sin(2 * Math.PI * m / 12) },
  polar: { tmp: (m) => 0.12 + 0.1 * sn(m), rain: () => 0.08 },
  desert: { tmp: (m) => 0.74 + 0.2 * sn(m), rain: () => 0.03 },
};
const DESERT = [{ u0: 0.07, u1: 0.42, f0: 0.3, f1: 0.375 }, { u0: 0.58, u1: 0.93, f0: 0.3, f1: 0.375 }, { u0: 0.07, u1: 0.42, f0: 0.625, f1: 0.7 }, { u0: 0.58, u1: 0.93, f0: 0.625, f1: 0.7 }];
function drawZones(c, w, h, dt, time) {
  const t = T[lang], tc = t.c, z = S.zone;
  S.zt = Math.min(1, S.zt + dt / 1.3);
  const mx = 12, my = 30, mw = clamp(w * 0.3, 92, 190), mh = h - my - 28;
  MAP = { x: mx, y: my, w: mw, h: mh };
  const bands = [[0, 0.13, 'polar'], [0.13, 0.37, 'temperate'], [0.37, 0.63, 'tropic'], [0.63, 0.87, 'temperate'], [0.87, 1, 'polar']];
  c.save(); c.beginPath(); c.roundRect(mx, my, mw, mh, 12); c.clip();
  for (const [a, b, name] of bands) {
    c.globalAlpha = z === name ? 1 : 0.42; c.fillStyle = ZC[name]; c.fillRect(mx, my + a * mh, mw, (b - a) * mh + 1);
  }
  for (const d of DESERT) {
    c.globalAlpha = z === 'desert' ? 1 : 0.5; c.fillStyle = ZC.desert; c.beginPath(); c.roundRect(mx + d.u0 * mw, my + d.f0 * mh, (d.u1 - d.u0) * mw, (d.f1 - d.f0) * mh, 8); c.fill();
    c.fillStyle = 'rgba(120,80,20,.45)'; for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(mx + (d.u0 + (d.u1 - d.u0) * ((i * 0.37 + 0.1) % 1)) * mw, my + (d.f0 + (d.f1 - d.f0) * ((i * 0.53 + 0.2) % 1)) * mh, 1.4, 0, 7); c.fill(); }
  }
  c.globalAlpha = 1; c.restore();
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1; c.beginPath(); c.roundRect(mx, my, mw, mh, 12); c.stroke();
  const ye = my + mh / 2;
  c.setLineDash([5, 4]); c.strokeStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.moveTo(mx, ye); c.lineTo(mx + mw, ye); c.stroke(); c.setLineDash([]);
  const lp = clamp(w / 52, 9.5, 12);
  label(c, tc.eq, mx + mw / 2, ye - 9, '#fff', lp, 'center', mw - 8);
  label(c, tc.np, mx + mw / 2, my + 10, '#fff', lp - 0.5, 'center', mw - 8);
  label(c, tc.sp, mx + mw / 2, my + mh - 10, '#fff', lp - 0.5, 'center', mw - 8);
  // distance arrow: from the equator to the chosen zone
  const zy = { tropic: ye, temperate: my + 0.25 * mh, polar: my + 0.065 * mh, desert: my + 0.3375 * mh }[z], ax = mx + mw + 12;
  if (Math.abs(zy - ye) > 40) {
    c.strokeStyle = '#ffd166'; c.fillStyle = '#ffd166'; c.lineWidth = 2; c.beginPath(); c.moveTo(ax, ye); c.lineTo(ax, zy); c.stroke();
    const dir = zy < ye ? 1 : -1; c.beginPath(); c.moveTo(ax - 5, zy + dir * 8); c.lineTo(ax, zy); c.lineTo(ax + 5, zy + dir * 8); c.fill();
    c.save(); c.translate(ax + 11, (ye + zy) / 2); c.rotate(-Math.PI / 2); label(c, tc.dist, 0, 0, '#ffd166', lp - 0.5, 'center', Math.abs(zy - ye) - 10); c.restore();
  }
  // chart
  const cx = mx + mw + clamp(w * 0.1, 34, 64), cw = w - cx - 14, cy = 78, ch = h - cy - 56;
  const nm = t.zones[z];
  label(c, `${ZE[z]} ${nm[0]}`, cx, 38, ZC[z], clamp(w / 28, 13, 19), 'left', cw);
  label(c, nm[1], cx, 58, '#dbe2f3', clamp(w / 40, 11, 14), 'left', cw);
  c.fillStyle = 'rgba(130,145,190,.08)'; c.fillRect(cx, cy, cw, ch);
  c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.beginPath(); c.moveTo(cx, cy + ch); c.lineTo(cx + cw, cy + ch); c.stroke();
  const mX = (m) => cx + (m + 0.5) / 12 * cw, tY = (v) => cy + ch - v * ch * 0.96;
  const mMax = 11 * S.zt;
  // other zones as faint ghosts: same scale, so the child can compare
  for (const o of ['tropic', 'temperate', 'polar', 'desert']) {
    if (o === z) continue;
    c.beginPath(); for (let m = 0; m <= 11.001; m += 0.25) { const x = mX(m), y = tY(ZP[o].tmp(m)); m ? c.lineTo(x, y) : c.moveTo(x, y); }
    c.strokeStyle = ZC[o]; c.globalAlpha = 0.3; c.lineWidth = 1.4; c.setLineDash([3, 3]); c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
  }
  // rain bars
  for (let m = 0; m < 12; m++) {
    const f = clamp((mMax + 0.5 - m) / 1, 0, 1), bh = Math.max(1.5, ZP[z].rain(m) * ch * 0.72) * f, bw = cw / 12 * 0.56;
    c.fillStyle = 'rgba(86,160,255,.7)'; c.beginPath(); c.roundRect(mX(m) - bw / 2, cy + ch - bh, bw, bh, 2); c.fill();
  }
  // temperature line
  c.beginPath(); for (let m = 0; m <= mMax + 0.001; m += 0.25) { const x = mX(m), y = tY(ZP[z].tmp(m)); m ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.strokeStyle = '#ff9a4d'; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke();
  if (S.zt >= 1) { const m = (time * 1.1) % 11, x = mX(m), y = tY(ZP[z].tmp(m)); c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, 5, 0, 7); c.fill(); c.strokeStyle = '#ff9a4d'; c.lineWidth = 2; c.stroke(); }
  // month letters
  const mp = clamp(cw / 17, 8, 11.5);
  for (let m = 0; m < 12; m++) label(c, new Date(2024, m, 1).toLocaleDateString(lang, { month: 'narrow' }), mX(m), cy + ch + 11, '#98a0b8', mp, 'center');
  // legend
  const ly = cy + ch + 30, lg = clamp(w / 46, 9, 12);
  c.strokeStyle = '#ff9a4d'; c.lineWidth = 3; c.beginPath(); c.moveTo(cx, ly); c.lineTo(cx + 14, ly); c.stroke();
  label(c, tc.temp, cx + 19, ly, '#ffc89a', lg, 'left');
  setFont(c, lg); const w1 = c.measureText(tc.temp).width, x2 = cx + 19 + w1 + 14;
  c.fillStyle = 'rgba(86,160,255,.85)'; c.fillRect(x2, ly - 5, 11, 10);
  label(c, tc.rain, x2 + 16, ly, '#a9cdff', lg, 'left');
  const w2 = c.measureText(tc.rain).width, x3 = x2 + 16 + w2 + 14;
  if (x3 + 40 < w) {
    c.setLineDash([3, 3]); c.strokeStyle = 'rgba(200,210,235,.6)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(x3, ly); c.lineTo(x3 + 14, ly); c.stroke(); c.setLineDash([]);
    label(c, tc.others, x3 + 19, ly, '#b6bed4', lg, 'left', w - x3 - 24);
  }
}

// 9. Loop --------------------------------------------------------------------------------------------------------
canvasLoop(cv, (c, w, h, dt, time) => {
  if (lab.view === 'weather') drawWeather(c, w, h, dt, time);
  else if (lab.view === 'blanket') drawBlanket(c, w, h, dt, time);
  else drawZones(c, w, h, dt, time);
});
buildCtrl();
render();
</script>
