  c.fillStyle = col; for (let k = 0; k < 5; k++) { const a = k * 1.2566; c.beginPath(); c.arc(x + Math.cos(a) * r * .8, y + Math.sin(a) * r * .8, R(r * .6), 0, 7); c.fill(); }
  c.fillStyle = '#f3c63a'; c.beginPath(); c.arc(x, y, R(r * .5), 0, 7); c.fill();
}

function drawGarden(c, w, h, dt, t) {
  const sc = Math.min(w / 120, h / 90), ox = (w - 120 * sc) / 2, oy = (h - 90 * sc) / 2, split = S.sec3;
  const lampOn = S.g3 === null || !S.on.nolight, nightT = split ? 0 : (S.g3 === null || S.night) ? 1 : 0;
  NT += (nightT - NT) * Math.min(1, dt * 3);
  const hy = oy + 50 * sc;
  let g = c.createLinearGradient(0, 0, 0, hy); g.addColorStop(0, '#78b6e2'); g.addColorStop(1, '#d6edf0'); c.fillStyle = g; c.fillRect(0, 0, w, hy + 1);
  c.globalAlpha = NT; g = c.createLinearGradient(0, 0, 0, hy); g.addColorStop(0, '#0a0f2c'); g.addColorStop(1, '#2f3c76'); c.fillStyle = g; c.fillRect(0, 0, w, hy + 1); c.globalAlpha = 1;
  g = c.createLinearGradient(0, hy, 0, h); g.addColorStop(0, '#79b45a'); g.addColorStop(1, '#3f7d3a'); c.fillStyle = g; c.fillRect(0, hy, w, h - hy);
  c.save(); c.translate(ox, oy); c.scale(sc, sc); c.lineCap = 'round'; c.lineJoin = 'round';
  // sun or moon, stars
  c.globalAlpha = 1 - NT; ball(c, 20, 14, 6, '#fff3b0', '#ffc83a'); c.globalAlpha = NT; ball(c, 100, 12, 5, '#fffbe8', '#d9dcef');
  STARS.forEach((s) => { c.globalAlpha = NT * (.5 + .5 * Math.sin(t * 2 + s.ph)); c.fillStyle = '#fff'; c.beginPath(); c.arc(s.x, s.y, s.s, 0, 7); c.fill(); }); c.globalAlpha = 1;
  // mown stripes
  for (let i = 0; i < 4; i++) { c.fillStyle = 'rgba(255,255,255,.05)'; c.fillRect(0, 52 + i * 9, 120, 4.5); }
  // fence
  for (let x = 0; x < 82; x += 5.4) { const fg = c.createLinearGradient(x, 0, x + 4.4, 0); fg.addColorStop(0, '#d9b98a'); fg.addColorStop(1, '#b08a5c'); c.fillStyle = fg; c.beginPath(); c.moveTo(x, 52); c.lineTo(x, 41); c.lineTo(x + 2.2, 38.5); c.lineTo(x + 4.4, 41); c.lineTo(x + 4.4, 52); c.closePath(); c.fill(); }
  c.fillStyle = 'rgba(0,0,0,.15)'; c.fillRect(0, 44, 82, 1.3); c.fillRect(0, 49, 82, 1.3);
  if (!split) { // house with the porch lamp
    g = c.createLinearGradient(0, 16, 0, 54); g.addColorStop(0, '#d9a07a'); g.addColorStop(1, '#b57c5a'); c.fillStyle = g; c.fillRect(82, 16, 38, 38);
    c.fillStyle = '#6b4a58'; c.beginPath(); c.moveTo(78, 17); c.lineTo(101, 3); c.lineTo(124, 17); c.closePath(); c.fill();
    c.fillStyle = '#ecd9b8'; c.fillRect(95, 26, 15, 12); c.fillStyle = '#7ac0e8'; c.fillRect(96.4, 27.4, 5.2, 9.2); c.fillRect(103.4, 27.4, 5.2, 9.2);
    c.globalAlpha = NT * .95; c.fillStyle = '#ffd98a'; c.fillRect(96.4, 27.4, 5.2, 9.2); c.fillRect(103.4, 27.4, 5.2, 9.2); c.globalAlpha = 1;
    c.strokeStyle = '#3b2a22'; c.lineWidth = .8; c.beginPath(); c.moveTo(82, 29); c.lineTo(LAMP[0] - 1.4, 29); c.stroke();
  }
  // grass patches
  if (split) {
    c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(0, 52, 60, 38); c.fillStyle = 'rgba(30,70,30,.12)'; c.fillRect(60, 52, 60, 38);
    MEAD.forEach((b) => grassBlade(c, b.x, b.y, b.h, Math.sin(t * 1.2 + b.ph) * 1.2, b.col, false));
    MFLOW.forEach((f) => { c.strokeStyle = '#5a9a3c'; c.lineWidth = .5; c.beginPath(); c.moveTo(f.x, f.y + 5); c.lineTo(f.x + Math.sin(t + f.ph) * .6, f.y); c.stroke(); flower(c, f.x + Math.sin(t + f.ph) * .6, f.y, f.col, 1.7); });
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = .5; c.setLineDash([2, 2]); c.beginPath(); c.moveTo(60, 38); c.lineTo(60, 90); c.stroke(); c.setLineDash([]);
  } else {
    if (S.on.wild) WILD.forEach((b) => grassBlade(c, b.x, b.y, b.h, Math.sin(t * 1.1 + b.ph) * 1.4, b.col, b.seed));
    if (S.on.wild) [[8, 68], [18, 71], [27, 67]].forEach(([x, y], i) => { flower(c, x + Math.sin(t + i) * .5, y, i === 1 ? '#ffd24a' : '#ffffff', 1.5); });
    if (S.on.flowers) {
      c.fillStyle = '#5a3d28'; c.beginPath(); c.ellipse(60, 74, 17, 3.2, 0, 0, 7); c.fill();
      BED.forEach((f) => { const sw = Math.sin(t * 1.2 + f.ph) * .7; c.strokeStyle = '#4f9a3c'; c.lineWidth = .7; c.beginPath(); c.moveTo(f.x, 74); c.quadraticCurveTo(f.x + sw * .4, 74 - f.h * .5, f.x + sw, 74 - f.h); c.stroke(); flower(c, f.x + sw, 74 - f.h, f.col, 2); });
    }
    if (S.on.logs) { // a log pile
      [[40, 83, 6], [52, 83, 6], [46, 78, 6]].forEach(([x, y, r]) => {
        const lg = c.createLinearGradient(0, y - r, 0, y + r); lg.addColorStop(0, '#8a6a46'); lg.addColorStop(1, '#4e3822'); c.fillStyle = lg; c.fillRect(x - 11, y - r * .7, 22, r * 1.4);
        c.fillStyle = '#c9a272'; c.beginPath(); c.ellipse(x + 11, y, 2, r * .7, 0, 0, 7); c.fill(); c.strokeStyle = '#8a6a46'; c.lineWidth = .35; c.beginPath(); c.ellipse(x + 11, y, 1, r * .35, 0, 0, 7); c.stroke();
      });
    }
    if (!S.on.nospray) { // a spray bottle and its cloud
      c.fillStyle = '#e8eef5'; c.beginPath(); c.roundRect(100, 68, 6, 11, 1.4); c.fill(); c.fillStyle = '#4a6a8a'; c.fillRect(101, 65, 4, 3.4); c.fillRect(98, 65, 4, 1.2);
      for (let k = 0; k < 5; k++) { const ph = ((t * .5 + k * .2) % 1); c.globalAlpha = (1 - ph) * .35; c.fillStyle = '#c4d6b8'; c.beginPath(); c.arc(97 - ph * 20, 65 + Math.sin(k) * 2 - ph * 3, R(1.5 + ph * 4), 0, 7); c.fill(); }
      c.globalAlpha = 1;
    }
  }
  // night shade over the scene, then lights and the insects
  c.globalAlpha = NT * .5; c.fillStyle = '#0a1040'; c.fillRect(-ox / sc, -oy / sc, w / sc, h / sc); c.globalAlpha = 1;
  if (!split && lampOn) { const gl = NT * (.85 + .1 * Math.sin(t * 9)); const rg = c.createRadialGradient(LAMP[0], LAMP[1], 1, LAMP[0], LAMP[1], 26); rg.addColorStop(0, `rgba(255,236,160,${.95 * gl})`); rg.addColorStop(1, 'rgba(255,230,140,0)'); c.fillStyle = rg; c.fillRect(LAMP[0] - 26, LAMP[1] - 26, 52, 52); }
  if (!split) { c.fillStyle = lampOn ? '#fff4c0' : '#9a9aa0'; c.beginPath(); c.arc(LAMP[0], LAMP[1], 1.9, 0, 7); c.fill(); c.strokeStyle = '#3b2a22'; c.lineWidth = .5; c.stroke(); }
  // which visitors are present now (eased in and out)
  const day = 1 - NT, tg = split
    ? { bee: 0, bfly: 0, lady: 0, beetle: 0, log: 0, mothL: 0, mothF: 0, mothW: 0, fly: 0 }
    : { bee: S.on.flowers ? day : 0, bfly: S.on.flowers ? day : 0, lady: S.on.nospray ? day : 0, beetle: S.on.wild ? 1 : 0, log: S.on.logs ? 1 : 0,
        mothL: lampOn ? NT : 0, mothF: 0, mothW: !lampOn ? NT : 0, fly: day * (S.g3 === null ? 0 : 1) };
  for (const k in A) A[k] += (tg[k] - A[k]) * Math.min(1, dt * 2.2);
  const wob = (a, b, s, ph) => [Math.sin(t * s + ph) * a, Math.sin(t * s * 1.37 + ph * 2) * b];
  if (A.fly > .02) { c.globalAlpha = A.fly; const [a, b] = wob(14, 5, .5, 1); fly(c, 40 + a, 30 + b, t * 40); c.globalAlpha = 1; }
  if (A.bee > .02) { c.globalAlpha = A.bee; for (let i = 0; i < 3; i++) { const [a, b] = wob(12, 4, .7 + i * .13, i * 2); bee(c, 54 + i * 8 + a, 60 + b, t * 50 + i, Math.cos(t * .7 + i * 2) >= 0 ? 1 : -1); } c.globalAlpha = 1; }
  if (A.bfly > .02) { c.globalAlpha = A.bfly; for (let i = 0; i < 2; i++) { const [a, b] = wob(18, 6, .45 + i * .1, i * 3); butterfly(c, 50 + i * 16 + a, 50 + b, t * 7 + i, i ? ['#ffd24a', '#e07a1a'] : ['#ff9a5a', '#d94a2a']); } c.globalAlpha = 1; }
  if (A.lady > .02) { c.globalAlpha = A.lady; [[52, 68], [64, 66], [76, 69]].forEach(([x, y], i) => ladybird(c, x, y + Math.sin(t + i) * .3)); c.globalAlpha = 1; }
  if (A.beetle > .02) { c.globalAlpha = A.beetle; for (let i = 0; i < 2; i++) { const p = (t * .06 + i * .5) % 1, x = 6 + (p < .5 ? p * 2 : 2 - p * 2) * 24, dir = p < .5 ? 1 : -1; c.save(); c.translate(x, 80 + i * 2); c.scale(dir, 1); c.rotate(Math.PI / 2); icon(c, 'bt', 2.8, '#1c2538'); c.restore(); } c.globalAlpha = 1; }
  if (A.log > .02) { c.globalAlpha = A.log; c.save(); c.translate(46, 73.5); c.rotate(.5); icon(c, 'bt', 3.2, '#2a1c10'); c.restore(); c.save(); c.translate(36, 80); icon(c, 'grub', 2.2, '#f3e3c6'); c.restore(); c.globalAlpha = 1; }
  if (A.mothL > .02) { c.globalAlpha = A.mothL; for (let i = 0; i < 5; i++) { const a = t * (1.5 + i * .25) + i * 1.3, r = 6 + 5 * (.5 + .5 * Math.sin(t * .8 + i * 2)) + i * 1.5; moth(c, LAMP[0] + Math.cos(a) * r, LAMP[1] + Math.sin(a) * r * .8, t * 16 + i); } c.globalAlpha = 1; }
  if (A.mothF > .02) { c.globalAlpha = A.mothF; for (let i = 0; i < 3; i++) { const [a, b] = wob(10, 4, .8 + i * .1, i * 2); moth(c, 54 + i * 8 + a, 62 + b, t * 16 + i); } c.globalAlpha = 1; }
  if (A.mothW > .02) { c.globalAlpha = A.mothW; const [a, b] = wob(30, 8, .35, 2); moth(c, 55 + a, 26 + b, t * 16); c.globalAlpha = 1; }
  if (split) { // lawn side: a lone fly; meadow side: bees, butterflies, hoverflies
    const [a, b] = wob(10, 4, .5, 1); fly(c, 30 + a, 66 + b, t * 40);
    for (let i = 0; i < 3; i++) { const [p, q] = wob(10, 4, .7 + i * .15, i * 2); bee(c, 76 + i * 12 + p, 70 + q, t * 50 + i, Math.cos(t * .7 + i * 2) >= 0 ? 1 : -1); }
    for (let i = 0; i < 3; i++) { const [p, q] = wob(14, 5, .45 + i * .1, i * 3); butterfly(c, 72 + i * 14 + p, 58 + q, t * 7 + i, i % 2 ? ['#ffd24a', '#e07a1a'] : ['#ff9a5a', '#d94a2a']); }
    for (let i = 0; i < 3; i++) { const [p, q] = wob(12, 4, .9 + i * .1, i); fly(c, 70 + i * 14 + p, 76 + q, t * 40 + i); }
  }
  c.restore();
  if (split) { // labels as pills
    const t0 = T[lang].h; c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    [[t0.lawn, ox + 30 * sc], [t0.meadow, ox + 90 * sc]].forEach(([s, x]) => {
      const pw = c.measureText(s).width + 20, px = clamp(x, pw / 2 + 6, w - pw / 2 - 6), py = oy + 46 * sc + 12;
      c.fillStyle = 'rgba(14,17,28,.82)'; c.beginPath(); c.roundRect(px - pw / 2, py - 12, pw, 24, 12); c.fill(); c.fillStyle = '#fff'; c.fillText(s, px, py + 1);
    });
  }
}

canvasLoop($('cv'), (c, w, h, dt, t) => { const v = lab.view; (v === 'count' ? drawCount : v === 'oak' ? drawOak : drawGarden)(c, w, h, dt, t); });

// --- interaction -----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('rg').addEventListener('input', () => { S.g1 = +$('rg').value; sfx.tick(); render(); });
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'count' && S.r1) {
    const col = Math.floor((x - G1.x0) / G1.cs), row = Math.floor((y - G1.y0) / G1.cs);
    if (col < 0 || col > 9 || row < 0 || row > 9) return;
    const i = row * 10 + col; S.sec1 = false; S.sel = S.sel === TILE_G[i] ? null : TILE_G[i]; sfx.tick(); render();
  } else if (lab.view === 'oak' && S.g2 !== null) {
    let best = null, bd = 1e9;
    HS.forEach((p) => { const d = Math.hypot(p.x - x, p.y - y); if (d < p.r && d < bd) { bd = d; best = p.k; } });
    if (best) pickPart(best);
  }
});
function pickPart(k) {
  S.cur = k; if (!S.found.includes(k)) S.found.push(k); sfx.click(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a === 'flip') { S.r1 = true; S.t1 = performance.now() / 1000; S.sel = null; S.sec1 = false; sfx.snap(); showStage(); }
  else if (a === 'again1') { S.r1 = false; S.sel = null; S.sec1 = false; sfx.click(); }
  else if (a === 'grp') { S.sec1 = false; S.sel = S.sel === k ? null : k; sfx.tick(); }
  else if (a === 'sec1') { if (!secret.unlocked()) return secret.open(); S.sec1 = !S.sec1; S.sel = S.sec1 ? 'bt' : null; sfx.click(); }
  else if (a === 'o') { S.g2 = +k; (+k === OAKOK ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'part') pickPart(k);
  else if (a === 'h') { S.g3 = +k; (+k === LAMPOK ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'tog') { S.on[k] = !S.on[k]; S.last = S.on[k] ? k : { off: k }; S.sec3 = false; sfx.click(); }
  else if (a === 'day') { S.night = k === 'night'; S.sec3 = false; sfx.click(); }
  else if (a === 'sec3') { if (!secret.unlocked()) return secret.open(); S.sec3 = !S.sec3; sfx.click(); }
  render();
});

// --- one render per change ---------------------------------------------------------------------------------------
const secChip = (act, emo, name, on) => { const open = secret.unlocked(); return `<button class="chip ic-ch secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="${act}">${open ? `${emo} ${esc(name)}` : '🔒 ???'}</button>`; };
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secCount').hidden = v !== 'count'; $('secOak').hidden = v !== 'oak'; $('secHelp').hidden = v !== 'help';
  if (v === 'count') renderCount(t); else if (v === 'oak') renderOak(t); else renderHelp(t);
}

function renderCount(t) {
  const c = t.c, rev = S.r1;
  lab.setGlow('rgba(240, 164, 58, .26)');
  $('cQ').hidden = rev; $('cLeg').hidden = !rev;
  $('cQt').textContent = c.q; $('rg').value = S.g1; $('rg').setAttribute('aria-label', c.q); $('cGo').textContent = c.go;
  if (!rev) {
    lab.setReadout(S.g1, c.guessSub, '', '#f0a43a');
    lab.setState({ emo: '🤔', title: c.q, lead: c.lead, body: '', extra: `<div class="fine">${esc(c.fine)}</div>` });
    lab.setFacts([]); return;
  }
  $('cAgain').textContent = c.again; $('cHint').textContent = c.hint;
  $('cChips').innerHTML = [...GROUPS, 'ma'].map((k) => `<button class="chip ic-ch ${S.sel === k && !S.sec1 ? 'on' : ''}" data-act="grp" data-k="${k}"><i class="ic-sw" style="background:${COL[k][0]}"></i>${esc(c.g[k])}</button>`).join('')
    + secChip('sec1', '🪲', t.secrets.a[0], S.sec1);
  lab.setReadout(INS, c.sub, c.pill, '#f0a43a');
  const near = Math.abs(S.g1 - INS) <= 5, f = (Math.round(MAM_FRAC * 10) / 10).toString().replace('.', lang === 'en' ? '.' : ',');
  let st;
  if (S.sec1) st = { emo: '🪲', title: c.hal, lead: c.halLead, body: c.halBody(TILES.bt) };
  else if (S.sel === 'ma') st = { emo: EMO.ma, title: c.g.ma, lead: c.ma(fmtN(D.mammals), f), body: c.d.ma };
  else if (S.sel) st = { emo: EMO[S.sel], title: c.g[S.sel], lead: `${c.tiles(TILES[S.sel])} · ${c.kinds(fmtN(N[S.sel]))}`, body: c.d[S.sel] };
  else st = { emo: near ? '✅' : '🦋', title: `${near ? c.right + ' ' : ''}${c.title(INS)}`, lead: c.yourGuess(S.g1), body: c.per(fmtN(D.total / 100)) };
  lab.setState({ ...st, extra: `<div class="fine">${esc(c.fine)}</div>` });
  lab.setFacts(t.facts.c);
}

function renderOak(t) {
  const o = t.o, g = S.g2;
  lab.setGlow('rgba(111, 168, 74, .26)');
  $('oQ').hidden = g !== null; $('oFind').hidden = g === null;
  $('oQt').textContent = o.q;
  $('oOpts').innerHTML = o.opts.map((x, i) => `<button data-act="o" data-k="${i}">${esc(x)}</button>`).join('');
  if (g === null) {
    lab.setReadout('?', '', '', '#6fa84a');
    lab.setState({ emo: '🌳', title: o.q, lead: o.lead, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  $('oTask').textContent = o.task;
  $('oChips').innerHTML = OAKP.map((p) => `<button class="chip ic-ch ${S.found.includes(p.k) ? 'done' : ''} ${S.cur === p.k ? 'on' : ''}" data-act="part" data-k="${p.k}">${S.found.includes(p.k) ? '✓ ' : ''}${esc(o.p[p.k].name)}</button>`).join('');
  lab.setReadout(OAK.total, o.sub2, `${S.found.length}/6 ${o.sub}`, '#6fa84a');
  const all = S.found.length === OAKP.length, cur = S.cur && o.p[S.cur], pe = OAKP.find((p) => p.k === S.cur);
  const head = g === OAKOK ? o.right : o.yourGuess(o.opts[g]);
  const extra = `<div class="fine">${esc(o.title(OAK.total))} ${esc(o.fine)}${all ? ` ${esc(o.all)}` : ''}</div>`;
  if (cur) lab.setState({ emo: pe.e, title: cur.ins, lead: cur.name, body: cur.txt, extra });
  else lab.setState({ emo: '🌳', title: `${g === OAKOK ? o.right + ' ' : ''}${o.title(OAK.total)}`, lead: o.split(OAK.macro + OAK.micro, OAK.beetles, OAK.gall), body: g === OAKOK ? '' : head, extra: `<div class="fine">${esc(o.fine)}</div>` });
  lab.setFacts(t.facts.o);
}

function renderHelp(t) {
  const h = t.h, g = S.g3, n = CHOICES.filter((k) => S.on[k]).length;
  lab.setGlow('rgba(255, 214, 120, .22)');
  $('hQ').hidden = g !== null; $('hAct').hidden = g === null;
  $('hQt').textContent = h.q;
  $('hOpts').innerHTML = h.opts.map((x, i) => `<button data-act="h" data-k="${i}">${esc(x)}</button>`).join('');
  if (g === null) {
    lab.setReadout('?', '', '', '#ffd678');
    lab.setState({ emo: '🌙', title: h.q, lead: h.lead, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  $('hChips').innerHTML = CHOICES.map((k) => `<button class="chip ic-ch ${S.on[k] ? 'on' : ''}" data-act="tog" data-k="${k}">${esc(h.ch[k].n)}</button>`).join('');
  $('hDay').innerHTML = [['day', h.day, !S.night && !S.sec3], ['night', h.night, S.night && !S.sec3]].map(([k, l, on]) => `<button data-act="day" data-k="${k}" class="${on ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('hSec').innerHTML = secChip('sec3', '🌾', t.secrets.b[0], S.sec3);
  $('hHint').textContent = h.hint;
  lab.setReadout(`${n}/5`, h.sub, '', '#ffd678');
  const verdict = g === LAMPOK ? `${h.right} ${h.title}` : h.title;
  let st;
  if (S.sec3) st = { emo: '🌾', title: h.ml.title, lead: h.ml.lead, body: h.ml.body, extra: '' };
  else if (S.last && typeof S.last === 'string') {
    const ch = h.ch[S.last];
    st = { emo: CHE[S.last], title: ch.n.replace(/^\S+\s/, ''), lead: ch.t, body: S.last === 'nolight' && !S.night ? ch.day : '', extra: `<div class="fine">${esc(verdict)}</div>` };
  } else if (S.last) st = { emo: '↩️', title: h.ch[S.last.off].n.replace(/^\S+\s/, ''), lead: h.off, body: '', extra: `<div class="fine">${esc(verdict)}</div>` };
  else st = { emo: '🌙', title: verdict, lead: g === LAMPOK ? h.why : `${h.yourGuess(h.opts[g])} ${h.why}`, body: h.next, extra: '' };
  lab.setState(st);
  lab.setFacts(t.facts.h);
}
render();
</script>
