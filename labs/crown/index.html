    c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 12; c.shadowOffsetY = 4;
    rr(c, cx, cy, cw, chh, 16); c.fillStyle = lg(c, cx, cy, cx + cw, cy + chh, back ? [[0, '#2a4a40'], [1, '#18282c']] : [[0, '#3a4272'], [1, '#1c2040']]); c.fill(); c.shadowColor = 'transparent';
    c.strokeStyle = mine ? '#ffd75a' : 'rgba(180,195,240,.4)'; c.lineWidth = mine ? 3 : 1.5; c.stroke();
    c.save(); rr(c, cx, cy, cw, chh, 16); c.clip();
    const ix = mid, iy = cy + 56;

    c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
    if (!back) wrapText(c, rn.ch[k], mid, cy + 112, cw - 14, 15);
    else {
      const tg = rn.tag[k]; let yy = cy + 112;

      c.font = '800 12px Nunito, sans-serif'; c.fillStyle = '#fff';
      wrapText(c, k === 'army' ? rn.armyNote : tg[1], mid, yy + (tg[0] ? 2 : 0), cw - 14, 15);
      if (k !== 'army') { const by = cy + chh - 14; rr(c, mid - 34, by - 8, 68, 16, 8); c.fillStyle = 'rgba(255,255,255,.14)'; c.fill();
        c.fillStyle = '#c8202c'; c.fillRect(mid - 28, by - 4, 8, 8); c.fillStyle = '#f4f4f4'; c.fillRect(mid - 20, by - 4, 8, 8); c.fillStyle = '#2f9a5a'; c.fillRect(mid - 12, by - 4, 8, 8);
        c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'left'; c.fillStyle = '#fff'; c.fillText(rn.hu, mid - 1, by + 0.5); }
    }
    if (mine && !back) { rr(c, cx + 6, cy + 6, cw - 12, 16, 8); }
    c.restore();
    if (mine && back && sx > 0.9) label(c, rn.mine, mid, cy - 8, w);
    S.hit.push({ id: k, rect: [cx, cy, cw, chh] });
  });
  // timeline
  const ty = cy + chh + 46, tx0 = x0 + tw * 0.14, tx1 = x0 + tw * 0.86, xs = [tx0, (tx0 + tx1) / 2, tx1];
  c.strokeStyle = 'rgba(244,214,140,.5)'; c.lineWidth = 3; c.beginPath(); c.moveTo(tx0, ty); c.lineTo(tx1, ty); c.stroke();
  const shown = RN.pick ? [0, 1, 2] : [0];
  const yrs = ['1301', '1308', '1458'];
  shown.forEach((n) => { const vis = n === 0 ? 1 : eout((rev - 0.9 - n * 0.3) / 0.4); if (vis <= 0) return;
    c.save(); c.globalAlpha = vis; circ(c, xs[n], ty, 8); c.fillStyle = n === 0 ? '#e0343f' : '#ffd75a'; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke(); c.restore();
    c.save(); c.globalAlpha = vis; label(c, yrs[n], xs[n], ty - 20, w); label(c, rn.tl[n], xs[n], ty + 22, w); c.restore(); });
  if (RN.pick) { const hop = c01((rev - 1) / 2.4) * 2, a = Math.min(1, Math.floor(hop)), k = hop >= 2 ? 1 : hop - a, from = Math.min(1, a), to = Math.min(2, a + 1);
    const done = hop >= 2, x = done ? xs[2] : mix(xs[from], xs[to], eio(k)), y = ty - 18 - (done ? 0 : Math.sin(Math.PI * eio(k)) * 30) - 30;
    if (rev > 1) drawCrown(c, x, y + 14, 34, { kind: S.holy ? 'holy' : 'gold', shadow: 0 }); }
}
function wrapText(c, text, x, y, maxW, lh) {
  const words = String(text).split(' '), lines = []; let cur = '';
  for (const wd of words) { const tt = cur ? `${cur} ${wd}` : wd; if (c.measureText(tt).width > maxW && cur) { lines.push(cur); cur = wd; } else cur = tt; }

function drawCardArt(c, k, x, y, cw, time) {

    c.fillStyle = '#5a9a5a'; c.beginPath(); c.moveTo(x - cw / 2, y + 22); c.quadraticCurveTo(x, y + 4, x + cw / 2, y + 26); c.lineTo(x + cw / 2, y + 60); c.lineTo(x - cw / 2, y + 60); c.closePath(); c.fill();
    const castle = (cx, cy2, s) => { c.fillStyle = '#c8c0d8'; c.fillRect(cx - 9 * s, cy2 - 14 * s, 18 * s, 14 * s); c.fillRect(cx - 12 * s, cy2 - 20 * s, 6 * s, 20 * s); c.fillRect(cx + 6 * s, cy2 - 20 * s, 6 * s, 20 * s);
      c.fillStyle = '#b0202c'; c.beginPath(); c.moveTo(cx - 13 * s, cy2 - 20 * s); c.lineTo(cx - 9 * s, cy2 - 27 * s); c.lineTo(cx - 5 * s, cy2 - 20 * s); c.fill(); c.beginPath(); c.moveTo(cx + 5 * s, cy2 - 20 * s); c.lineTo(cx + 9 * s, cy2 - 27 * s); c.lineTo(cx + 13 * s, cy2 - 20 * s); c.fill(); };
    castle(x - cw * 0.3, y + 16, 0.7); castle(x + cw * 0.28, y + 22, 1);
    c.strokeStyle = '#fff'; c.lineWidth = 2; c.setLineDash([4, 5]); c.beginPath(); c.moveTo(x - cw * 0.22, y + 22); c.quadraticCurveTo(x, y + 36, x + cw * 0.18, y + 26); c.stroke(); c.setLineDash([]);
    const tx2 = x - cw * 0.04 + Math.sin(time * 1.5) * 3; ell(c, tx2, y + 16, 6, 9); c.fillStyle = '#7a3a8a'; c.fill(); circ(c, tx2, y + 4, 5); c.fillStyle = SKIN[0]; c.fill(); c.strokeStyle = '#3a1a4a'; c.lineWidth = 1; c.stroke();
  } else if (k === 'vote') {
    c.fillStyle = lg(c, 0, y - 46, 0, y + 54, [[0, '#4a4a78'], [1, '#2a2a50']]); c.fillRect(x - cw / 2, y - 46, cw, 100);
    [-1, 0, 1].forEach((n) => { drawFace(c, x + n * cw * 0.28, y - 18, 9, { hair: ['#5a3a22', '#c8c8d0', '#d9a640'][n + 1], hs: n === 0 ? 'beard' : 'short', skin: 0 }, { mood: 0.6 }); });
    rr(c, x - 22, y + 4, 44, 34, 5); c.fillStyle = lg(c, x - 22, y, x + 22, y + 34, [[0, '#c0813f'], [1, '#6e3f1a']]); c.fill(); c.strokeStyle = '#2a140a'; c.lineWidth = 1.3; c.stroke();
    c.fillStyle = '#1a0c06'; c.fillRect(x - 12, y + 10, 24, 4);

    [[-1, '#b0202c'], [1, '#2f5fa8']].forEach(([s, col]) => { c.fillStyle = col; c.beginPath(); c.moveTo(x + s * cw * 0.3 - 13, y + 4); c.lineTo(x + s * cw * 0.3 + 13, y + 4); c.lineTo(x + s * cw * 0.3 + 13, y + 24); c.quadraticCurveTo(x + s * cw * 0.3, y + 42, x + s * cw * 0.3 - 13, y + 24); c.closePath(); c.fill(); c.strokeStyle = '#1a1c2c'; c.lineWidth = 1.5; c.stroke(); });
    drawSym(c, 'sword', x - 3, y - 12, 26); c.scale(-1, 1); c.translate(-2 * x, 0); drawSym(c, 'sword', x - 3, y - 12, 26);

  c.restore();
}

// --- input -------------------------------------------------------------------------------------------------
$('cv').addEventListener('pointerdown', (ev) => {
  const rc = $('cv').getBoundingClientRect(), px = ev.clientX - rc.left, py = ev.clientY - rc.top, v = lab.view;
  for (const q of S.hit) {
    if (q.rect) { const [x, y, ww, hh] = q.rect; if (px >= x && px <= x + ww && py >= y && py <= y + hh) { ranPick(q.id); return; } }
    else if (Math.hypot(px - q.x, py - q.y) <= q.r) {
      if (v === 'tree') trPick(q.id);
      else if (v === 'day') { S.sym = S.sym === q.id ? null : q.id; sfx.tick(); render(); }
      return;
    }
  }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'trMain') trMain();
  else if (act === 'dayMain') dayMain();
  else if (act === 'ranMain') { RN.pick = null; RN.rev = 0; sfx.click(); render(); }
  else if (act === 'dayPick') dayPick(+b.dataset.k);
  else if (act === 'ranPick') ranPick(b.dataset.k);
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'holy') { S.holy = !S.holy; sfx.click(); }
    else {
      if (lab.view !== 'tree') document.querySelector('#views [data-view=tree]')?.click();
      S.rule = S.rule === 'mod' ? 'med' : 'mod'; setRule(S.rule); sfx.click(); showStage();
    }
    render();
  }
});

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secTree').style.display = v === 'tree' ? '' : 'none';
  $('secDay').style.display = v === 'day' ? '' : 'none';
  $('secRan').style.display = v === 'ran' ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo, on) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('holy', '👑', S.holy) + sc('rule', '🔄', S.rule === 'mod');
  lab.setFacts([{ emo: v === 'tree' ? '👑' : v === 'day' ? '🏰' : '🗳️', text: t.facts[v].text, src: t.facts[v].src }]);
  if (v === 'tree') renderTree(t); else if (v === 'day') renderDay(t); else renderRan(t);
}
function stateOrHoly(st) {
  if (S.holy) { const t = T[lang]; lab.setState({ emo: '👑', title: t.holyT[0], lead: t.holyT[1], body: '', extra: '' }); return; }
  lab.setState(st);
}
function renderTree(t) {
  const tt = t.tree, nm = t.nm, ph = TR.phase, rd = ROUNDS[TR.rule][TR.round];
  lab.setGlow('rgba(224, 176, 80, .24)');
  const main = $('trMain');
  main.style.display = ph === 'idle' || ph === 'reveal' || ph === 'done' ? '' : 'none';
  main.textContent = ph === 'idle' ? tt.grow : ph === 'done' ? tt.again : tt.next;
  const n = ROUNDS[TR.rule].length, scored = TR.res.filter((x) => x !== null && x !== undefined), k = scored.filter(Boolean).length;
  lab.setReadout(nm[TR.holder], tt.rnd(Math.min(TR.round + 1, n), n), k ? `✓ ${k}` : '', '#e0b050');
  let st;
  if (ph === 'idle') { const [a, b] = tt.intro(nm[TR.holder]); st = { emo: '👑', title: a, lead: b }; }
  else if (ph === 'choose') { const [a, b] = rd.none ? tt.chooseNo : tt.choose; st = { emo: '🤔', title: a, lead: b }; }
  else if (ph === 'fly') { st = { emo: '👑', title: tt.fly[0], lead: tt.fly[1] }; }
  else if (ph === 'reveal') {
    if (TR.demo) { const [a, b] = tt.demo(nm[TR.win]); st = { emo: '🔄', title: a, lead: b }; }
    else st = { emo: TR.picked === TR.win ? '✅' : '🤔', title: TR.picked === TR.win ? tt.right : tt.wrong, lead: tt.why[rd.kind](nm[TR.win]) };
  } else st = { emo: '🏆', title: tt.end(k, scored.length), lead: tt.endLead };

}
function renderDay(t) {
  const dd = t.day, i = DY.i, ph = DY.phase, k = DY.res.filter(Boolean).length;
  lab.setGlow('rgba(200, 80, 90, .24)');
  const vis = dd.vis[Math.min(i, 3)];
  $('dayQ').textContent = ph === 'end' ? '' : dd.q; $('dayQ').style.display = ph === 'end' ? 'none' : '';

  }).join('');
