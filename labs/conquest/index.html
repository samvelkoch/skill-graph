  lab.setGlow('rgba(95,168,160,.24)');
  lab.setReadout(Rm.checked ? `${k}/5` : `${n}/5`, Rm.checked ? '' : q.placed, '', '#5fa8a0');
  let st = { emo: '⏳', title: q.st0[0], lead: q.st0[1], body: '' }, facts = 'a';
  if (Rm.checked) {
    st = { emo: k === 5 ? '✅' : '🤔', title: k === 5 ? q.all : q.some(k), lead: q.leadA, body: q.bodyA }; facts = 'b';
    if (Rm.ans !== null) { st = { emo: '🏰', title: q.revT, lead: q.revL, body: q.revB }; facts = 'c'; }
  }
  lab.setState({ ...st, extra: '' }); lab.setFacts(F(facts));
  let h = '';
  if (!Rm.checked) {
    h += `<div class="cd-q" style="margin-top:0">${esc(q.q)}</div><div class="cd-opts stack">${ORDER_SHOW.map((e) => {
      const at = Rm.placed.indexOf(e);
      return `<button class="cd-opt cd-ev${at >= 0 ? ' on' : ''}" data-act="rpl" data-e="${e}"${at >= 0 ? ' disabled' : ''}><span class="n">${at >= 0 ? at + 1 : ''}</span><span>${EV_EMO[e]} ${esc(q.ev[e])}</span></button>`;
    }).join('')}</div>
    <div class="cd-row cd-go"><button class="cd-btn" data-act="rundo"${n ? '' : ' disabled'}>${esc(t.undo)}</button><button class="cd-btn go" data-act="rcheck2"${n === 5 ? '' : ' disabled'}>${esc(q.checkA)}</button></div>`;
  } else {
    h += `<div class="cd-q" style="margin-top:0">${esc(q.qB)}</div>`;
    h += optsHtml(q.optsB, Rm.ans, 1, Rm.ans !== null, 'bpick', true);
    if (Rm.ans !== null) h += `<div class="cd-verdict ${Rm.ans === 1 ? 'good' : 'bad'}">${esc(Rm.ans === 1 ? q.rightB : q.wrongB)}</div>`;
    h += `<button class="cd-btn cd-go" data-act="rreset">${esc(t.again)}</button>`;
  }
  $('ctrlBody').innerHTML = h + secRow(t);
}
function renderCrown(t) {
  const C = S.crown, q = t.crown, done = C.pick !== null;
  lab.setGlow('rgba(240,194,79,.24)');
  lab.setReadout(done ? '1070s' : '?', '', '', '#f0c24f');
  lab.setState(done ? { emo: '👑', title: q.revT, lead: q.revL, body: q.revB, extra: '' } : { emo: '👑', title: q.t0, lead: q.l0, body: q.b0, extra: '' });
  lab.setFacts(F(done ? 'k1' : 'k0').concat(done ? F('k0') : []));
  let h = `<div class="cd-q" style="margin-top:0">${esc(q.q)}</div>` + optsHtml(q.opts, C.pick, 1, done, 'cpick');
  if (done) h += `<div class="cd-verdict ${C.pick === 1 ? 'good' : 'bad'}">${esc(C.pick === 1 ? q.right : q.wrong)}</div><button class="cd-btn cd-go" data-act="cagain">${esc(t.again)}</button>`;
  $('ctrlBody').innerHTML = h + secRow(t);
}
function renderTribes(t) {
  const Tr = S.tribes, q = t.tribes, done = Tr.pick !== null;
  lab.setGlow('rgba(208,138,98,.26)');
  lab.setReadout(done ? '7 + 3' : '7', '', '', '#d08a62');
  lab.setState(done ? { emo: '🏕️', title: q.revT, lead: q.revL, body: q.revB, extra: '' } : { emo: '🏕️', title: q.t0, lead: q.l0, body: q.b0, extra: '' });
  lab.setFacts(F(done ? 's1' : 's0'));
  let h = `<div class="cd-q" style="margin-top:0">${esc(q.q)}</div>` + optsHtml(q.opts, Tr.pick, 0, done, 'tpick');
  if (done) h += `<div class="cd-verdict ${Tr.pick === 0 ? 'good' : 'bad'}">${esc(Tr.pick === 0 ? q.right : q.wrong)}</div><button class="cd-btn cd-go" data-act="tagain">${esc(t.again)}</button>`;
  $('ctrlBody').innerHTML = h + secRow(t);
}
function render() {
  const t = T[lang], mode = S.sec ?? lab.view;
  document.body.dataset.v = mode;
  if (mode === 'road') renderRoad(t); else if (mode === 'legend') renderLegend(t); else if (mode === 'realm') renderRealm(t);
  else if (mode === 'crown') renderCrown(t); else renderTribes(t);
  lab.checkStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i, r = S.road, L = S.leg, Rm = S.realm;
  if (a === 'sec') { if (!secret.unlocked()) { secret.open(); return; } S.sec = S.sec === b.dataset.k ? null : b.dataset.k; if (S.sec === 'crown') S.crown = { pick: null, rev: 0 }; if (S.sec === 'tribes') S.tribes = { pick: null, rev: 0 }; sfx.click(); }
  else if (a === 'rback') { r.stage = Math.max(0, r.stage - 1); sfx.tick(); }
  else if (a === 'rnext') { r.stage = Math.min(3, r.stage + 1); sfx.snap(); }
  else if (a === 'rpick') { r.picks[i] = !r.picks[i]; sfx.tick(); }
  else if (a === 'rcheck') { r.checked = true; r.rev = 0; (r.picks.every((p, j) => p === TRUTH[j]) ? sfx.good : sfx.bad)(); }
  else if (a === 'lset') { const c = +b.dataset.c, v = +b.dataset.v; L.assign[c] = L.assign[c] === v ? null : v; sfx.tick(); }
  else if (a === 'lcheck') { L.checked = true; const ok = CARDS.every((c, j) => L.assign[j] === (c.legend ? 0 : 1)); (ok ? sfx.good : sfx.bad)(); }
  else if (a === 'lreset') { L.assign = [null, null, null, null, null]; L.checked = false; sfx.click(); }
  else if (a === 'rpl') { const e = +b.dataset.e; if (!Rm.placed.includes(e)) { Rm.placed.push(e); sfx.snap(); } }
  else if (a === 'rundo') { Rm.placed.pop(); sfx.tick(); }
  else if (a === 'rcheck2') { Rm.checked = true; Rm.rev = 0; (Rm.placed.every((e, j) => e === j) ? sfx.good : sfx.bad)(); }
  else if (a === 'bpick') { Rm.ans = i; Rm.atk = 0; (i === 1 ? sfx.good : sfx.bad)(); }
  else if (a === 'rreset') { S.realm = { placed: [], checked: false, ans: null, m: [null, null, null, null, null], rev: 0, ph: S.realm.ph, atk: 0 }; sfx.click(); }
  else if (a === 'cpick') { S.crown.pick = i; S.crown.rev = 0; (i === 1 ? sfx.good : sfx.bad)(); }
  else if (a === 'cagain') { S.crown = { pick: null, rev: 0 }; sfx.click(); }
  else if (a === 'tpick') { S.tribes.pick = i; S.tribes.rev = 0; (i === 0 ? sfx.good : sfx.bad)(); }
  else if (a === 'tagain') { S.tribes = { pick: null, rev: 0 }; sfx.click(); }
  render();
});

canvasLoop($('cv'), (c, w, h, dt, t) => {
  VP.w = w; VP.h = h;
  const mode = S.sec ?? lab.view;
  if (mode === 'road') drawRoad(c, w, h, dt, t); else if (mode === 'legend') drawLegend(c, w, h, dt, t); else if (mode === 'realm') drawRealm(c, w, h, dt, t);
  else if (mode === 'crown') drawCrown(c, w, h, dt, t); else drawTribes(c, w, h, dt, t);
});
render();
</script>
