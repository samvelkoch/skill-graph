function linreg(pts) {
  const n = pts.length, mx = pts.reduce((s, p) => s + p[0], 0) / n, my = pts.reduce((s, p) => s + p[1], 0) / n;
  let sxx = 0, sxy = 0, syy = 0;
  for (const [x, y] of pts) { sxx += (x - mx) ** 2; sxy += (x - mx) * (y - my); syy += (y - my) ** 2; }
  const m = sxy / sxx;
  return { m, b: my - m * mx, r: sxy / Math.sqrt(sxx * syy) };
}

const WITH_1800 = CS.filter((c) => DATA[c.id][0]);

const GAINS = WITH_1800.map((c) => ({ id: c.id, g: DATA[c.id][5][1] - DATA[c.id][0][1] })).sort((a, b) => a.g - b.g);
// the biggest fall between two neighbouring years with data, finished by the year `y`
function biggestDrop(y) {
  let best = null;
  for (const c of CS) {
    const ks = [0, 1, 2, 3, 4, 5].filter((k) => DATA[c.id][k]);
    for (let n = 0; n + 1 < ks.length; n++) {
      const a = DATA[c.id][ks[n]], b = DATA[c.id][ks[n + 1]];
      if (YEARS[ks[n + 1]] <= y && b[1] < a[1] && (!best || a[1] - b[1] > best.d)) best = { id: c.id, y1: YEARS[ks[n]], y2: YEARS[ks[n + 1]], a: a[1], b: b[1], d: a[1] - b[1] };
    }
  }
  return best;
}

const lifeGap = (a, b) => Math.abs(L19(a)[1] - L19(b)[1]);
const PAIRS = [];

const idxInc = (v) => clamp(Math.log(v / 100) / Math.log(750), 0, 1), idxLife = (v) => clamp((v - 20) / 65, 0, 1), idxEdu = (v) => clamp(v / 18, 0, 1);

const goView = (v) => $('views').querySelector(`[data-view="${v}"]`)?.click();
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, v = lab.view;
  if (v === 'index') {
    const row = S.rows.find((q) => y >= q.y0 && y < q.y1); if (!row) return;
    const st = S.t3;
    st.focus = row.id; sfx.tick();
    if (st.task === 1 && !st.solved) { st.pick = st.pick.includes(row.id) ? st.pick.filter((q) => q !== row.id) : [...st.pick.slice(-1), row.id]; st.msg = null; st.shown = false; }
    render(); return;
  }
  if (S.sec === 'b' && v === 'time') return;
  let best = null;
  for (const q of S.hits) { const d = Math.hypot(x - q.x, y - q.y); if (d <= q.r + 8 && (!best || q.r < best.r)) best = q; }
  S.sel = best ? (S.sel === best.id ? null : best.id) : null;
  if (best) sfx.click();
  render();
});
$('le2go').addEventListener('click', () => goView('bubbles'));
$('leYear').addEventListener('input', (ev) => { S.year = +ev.target.value; S.playing = false; render(); });
$('lePlay').addEventListener('click', () => {
  if (S.playing) S.playing = false; else { if (S.year >= 2019) S.year = 1800; S.playing = true; }
  sfx.click(); render();
});
$('leRestart').addEventListener('click', () => { S.year = 1800; S.playing = false; sfx.click(); render(); });
$('le1').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-g1], [data-act]'); if (!b) return;
  if (b.dataset.g1 !== undefined) { S.g1 = +b.dataset.g1; (S.g1 === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (b.dataset.act === 'lin') { S.lin = b.dataset.v === '1'; sfx.click(); }
  else if (b.dataset.act === 'trend') { S.trend = !S.trend; sfx.click(); }
  render();
});
$('le2').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-g2]'); if (!b) return;
  S.g2 = +b.dataset.g2; (S.g2 === 0 ? sfx.good : sfx.bad)(); showStage();
  render();
});
// the two secret experiments: always visible; once unlocked they run in Time, after both guesses are made (the gates stay)
$('leSecRow').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.sec;
  if (S.g1 === null) return goView('bubbles');
  if (lab.view !== 'time') goView('time');
  if (S.g2 === null) { render(); return; }
  if (S.sec === k) { S.sec = null; S.playing = false; }
  else if (k === 'a') { S.sec = 'a'; S.year = 1800; S.playing = true; }
  else { S.sec = 'b'; S.playing = false; }
  sfx.click(); showStage(); render();
});
$('le3').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-x]'); if (!b) return;
  const st = S.t3, a = b.dataset.x;
  if (a === 'sort') { st.sort = b.dataset.k; sfx.tick(); }
  else if (a === 'check1') {
    const [p1, p2] = st.pick;
    if (PAIRS.some(([u, v]) => (u === p1 && v === p2) || (u === p2 && v === p1))) { st.solved = true; st.msg = null; sfx.good(); }
    else {
      st.tries++; sfx.bad();
      st.msg = incRatio(p1, p2) > SIM ? { k: 'sim', v: incRatio(p1, p2) * 100 } : { k: 'diff', v: lifeGap(p1, p2) };
      if (st.tries >= 2) { st.shown = true; st.pick = [...PAIRS[0]]; }
    }
    showStage();
  } else if (a === 'next') { st.task = 2; st.focus = null; st.pick = []; sfx.click(); }
  else if (a === 'ord') {
    const row = st.ord[b.dataset.k], id = b.dataset.c;
    if (st.checked) return;
    if (row.includes(id)) row.splice(row.indexOf(id), 1); else if (row.length < 3) row.push(id);
    st.focus = id; sfx.tick();
  } else if (a === 'clear2') { st.ord = { inc: [], life: [], edu: [] }; st.checked = false; sfx.click(); }
  else if (a === 'check2') { st.checked = true; const k = ['inc', 'life', 'edu'].filter((q) => st.ord[q].join() === TRIO_RANKS[q].join()).length; (k === 3 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'done') { st.task = 3; sfx.click(); }
  else if (a === 'again') { Object.assign(st, { task: 1, pick: [], tries: 0, solved: false, shown: false, msg: null, ord: { inc: [], life: [], edu: [] }, checked: false, focus: null }); sfx.click(); }
  render();
});

// --- render --------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('le1').hidden = v !== 'bubbles'; $('le2').hidden = v !== 'time'; $('le3').hidden = v !== 'index';
  $('leLeg').hidden = v === 'index';
  $('leLeg').innerHTML = Object.keys(REG).map((k) => `<span><i style="background:${REG[k]}"></i>${esc(t.reg[k])}</span>`).join('') + `<span>◯ ${esc(t.legSize)}</span>`;
  const open2 = secret.unlocked();
  $('leSecs').innerHTML = [['a', '🎞️'], ['b', '🧒']].map(([k, emo]) => `<button class="chip secret le-chip ${open2 ? 'open' : ''} ${S.sec === k && v === 'time' ? 'on' : ''}" data-sec="${k}">${open2 ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (v === 'bubbles') renderBubbles(t); else if (v === 'time') renderTime(t); else renderIndex(t);
}
const askHTML = (q, opts, attr) => `<div class="le-q">${esc(q)}</div><div class="le-opts">${opts.map((o, i) => `<button type="button" ${attr}="${i}">${esc(o)}</button>`).join('')}</div>`;

function renderBubbles(t) {
  const b = t.b, open = S.g1 !== null;
  lab.setGlow('rgba(95, 143, 208, .28)');
  $('le1q').hidden = open; $('le1c').hidden = !open;
  if (!open) {
    $('le1q').innerHTML = askHTML(b.q, b.opts, 'data-g1');
    lab.setReadout('?', '', '', '#5f8fd0'); lab.setGauge(0);
    lab.setState({ emo: '🤔', title: b.q, lead: b.lead0, body: '', extra: '' });
    lab.setFacts([fact('f1', '🧑‍⚕️')]);
    return;
  }
  $('le1chips').innerHTML = [[0, b.steps[0], !S.lin], [1, b.steps[1], S.lin]].map(([val, l, on]) => `<button class="chip le-chip ${on ? 'on' : ''}" data-act="lin" data-v="${val}">${esc(l)}</button>`).join('')
    + `<button class="chip le-chip ${S.trend ? 'on' : ''}" data-act="trend">${esc(b.trend)}</button>`;
  $('le1note').textContent = S.lin ? b.linNote : b.logNote;
  const sel = S.sel, us = L19('usa'), jp = L19('jpn');
  if (sel) {
    const d = L19(sel);
    lab.setReadout(nf(d[1], 1), b.sub(nm(sel), usd(d[0])), '', REG[BY[sel].r]);
    lab.setState({ emo: '🫧', title: nm(sel), lead: b.info(nf(d[1], 1), usd(d[0]), nf(d[2], 1)), body: '', extra: `<div class="le-fine">${esc(b.fine)}</div>` });
  } else {
    lab.setReadout('2019', b.tap, '', '#5f8fd0');
    lab.setState({ emo: S.g1 === 0 ? '✅' : '🤔', title: S.g1 === 0 ? b.right : b.wrong, lead: b.corr(nf(REG19.r, 2)), body: b.exc(nf(us[0] / jp[0], 1), nf(jp[1], 1), nf(us[1], 1)), extra: `<div class="le-fine">${esc(b.fine)}</div>` });
  }
  lab.setFacts([fact('f1', '🧑‍⚕️'), fact('f2', '🌍')]);
}

function renderTime(t, live = false) {
  const tt = t.t, gate = S.g1 === null, asked = !gate && S.g2 === null, open = !gate && S.g2 !== null;
  lab.setGlow('rgba(111, 179, 111, .24)');
  $('le2gate').hidden = !gate; $('le2q').hidden = !asked; $('le2c').hidden = !open;
  if (gate) {
    $('le2gt').textContent = tt.gateL; $('le2go').textContent = tt.gateBtn;
    lab.setReadout('—', '', '', '#6fb36f'); lab.setGauge(0);
    lab.setState({ emo: '🔒', title: tt.gateT, lead: tt.gateL, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  if (asked) {
    $('le2q').innerHTML = askHTML(tt.q, tt.opts, 'data-g2');
    lab.setReadout('?', '', '', '#6fb36f');
    lab.setState({ emo: '🤔', title: tt.q, lead: tt.lead0, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const yr = Math.round(S.year), n0 = WITH_1800.length;
  const sl = $('leYear'); if (+sl.value !== yr) sl.value = yr;
  if (!live) { // while playing only the slider, readout and state text change: rebuilding buttons would swallow taps
    $('le2c').querySelector('.le-slider').hidden = S.sec === 'b';
    $('leTicks').hidden = S.sec === 'b';
    $('leTicks').innerHTML = [1800, 1900, 1950, 1980, 2019].map((y) => `<span style="left:${(y - 1800) / 219 * 100}%${y === 2019 ? ';transform:translateX(-100%)' : ''}">${y}</span>`).join('');
    $('lePlay').hidden = S.sec === 'b'; $('leRestart').hidden = S.sec === 'b';
    $('lePlay').textContent = S.playing ? tt.pause : tt.play; $('leRestart').textContent = tt.restart;
  }
  const shown = CS.map((q) => at(q.id, S.year)).filter(Boolean), med = median(shown.map((s) => s.life)), m0 = median(LIFE1800);
  if (S.sel) {
    const s = at(S.sel, S.year);
    lab.setReadout(String(yr), s ? tt.tapSub(nm(S.sel), nf(s.life, 1), usd(Math.round(s.inc))) : nm(S.sel), '', '#6fb36f');
  } else lab.setReadout(String(yr), tt.sub(nf(med, 1)), '', '#6fb36f');
  if (S.sec === 'b') {
    lab.setReadout(t.sb.fr, '1816 · 2019', '', '#d9825f');
    lab.setState({ emo: '🧒', title: t.sb.title, lead: t.sb.lead(nf(FR.y1816[0], 1), nf(FR.y1816[1], 1)), body: t.sb.body, extra: `<div class="le-fine">${esc(t.sb.fine)}</div>` });
    if (!live) lab.setFacts([fact('f4', '👶'), fact('f5', '🕰️')]);
    return;
  }
  if (S.sec === 'a') {
    lab.setState({ emo: '🎞️', title: t.sa.title, lead: t.sa.lead, body: t.sa.body, extra: `<div class="le-fine">${esc(tt.fine)}</div>` });
    if (!live) lab.setFacts([fact('f8', '🎞️'), fact('f3', '📉')]);
    return;
  }
  let st;
  if (yr === 1800 && !S.playing) {
    const lo = Math.min(...LIFE1800), hi = Math.max(...LIFE1800);
    st = { emo: S.g2 === 0 ? '✅' : '🤔', title: S.g2 === 0 ? tt.right : tt.wrong, lead: tt.rev(n0, nf(lo, 1), nf(hi, 1), nf(m0, 1), LIFE1800.filter((q) => q >= 30 && q <= 40).length, LIFE1800.filter((q) => q < 30).length), body: tt.body0 };
  } else {
    const dr = biggestDrop(S.year), end = yr >= 2019;
    const extra = end ? `<div>${esc(tt.gain(nf(GAINS[0].g, 1), nm(GAINS[0].id), nf(GAINS[GAINS.length - 1].g, 1), nm(GAINS[GAINS.length - 1].id)))}</div>` : '';
    st = { emo: '⏳', title: tt.title, lead: tt.lead(shown.length, nf(med, 1), nf(m0, 1)),
      body: dr ? tt.drop(nm(dr.id), dr.y1, dr.y2, nf(dr.a, 1), nf(dr.b, 1)) : tt.body0, extra };
  }
  lab.setState({ ...st, extra: `${st.extra ?? ''}<div class="le-fine" style="margin-top:6px">${esc(tt.fine)}</div>` });
  if (!live) lab.setFacts([fact('f3', '📉'), fact('f4', '👶'), fact('f5', '🕰️')]);
}

function renderIndex(t) {
  const x = t.x, st = S.t3, gate = S.g1 === null, box = $('le3');
  lab.setGlow('rgba(201, 160, 255, .24)');
  if (gate) {
    box.innerHTML = `<div class="le-gate"><p>${esc(t.t.gateL)}</p><button class="btn" data-x="go" type="button">${esc(t.t.gateBtn)}</button></div>`;
    box.querySelector('[data-x=go]').onclick = () => goView('bubbles');
    lab.setReadout('—', '', '', '#c9a0ff'); lab.setGauge(0);
    lab.setState({ emo: '🔒', title: t.t.gateT, lead: t.t.gateL, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const sorts = ['inc', 'life', 'edu', 'hdi'];
  let html = `<div class="le-row" style="margin-top:0"><span class="lbl">${esc(x.sortLbl)}</span><div class="chips">${sorts.map((k) => `<button class="chip le-chip ${st.sort === k ? 'on' : ''}" data-x="sort" data-k="${k}">${esc(x.sorts[k])}</button>`).join('')}</div></div>`;
  let state;
  const nameOf = (id) => nm(id);
  if (st.task === 1) {
    const two = st.pick.length === 2;
    html += `<div class="le-row"><button class="btn le-btn" data-x="check1" ${two && !st.solved ? '' : 'disabled'}>${esc(x.check)}</button>`
      + (st.solved ? `<button class="btn le-btn" data-x="next">${esc(x.next)}</button>` : `<span class="le-note" style="margin:0">${esc(x.picked(st.pick.length))}</span>`) + '</div>';
    if (st.solved) {
      const [a, b] = st.pick;
      state = { emo: '✅', title: x.all, lead: x.ok1(nameOf(a), nameOf(b), nf(lifeGap(a, b), 1)), body: x.ok1b(usd(L19(a)[0]), usd(L19(b)[0]), nf(L19(a)[1], 1), nf(L19(b)[1], 1)) };
    } else if (st.shown) state = { emo: '👀', title: x.show, lead: x.ok1(nameOf(PAIRS[0][0]), nameOf(PAIRS[0][1]), nf(lifeGap(...PAIRS[0]), 1)), body: x.ok1b(usd(L19(PAIRS[0][0])[0]), usd(L19(PAIRS[0][1])[0]), nf(L19(PAIRS[0][0])[1], 1), nf(L19(PAIRS[0][1])[1], 1)) };
    else {
      const m = st.msg ? (st.msg.k === 'sim' ? x.notSim(nf(st.msg.v)) : x.notDiff(nf(st.msg.v, 1))) : null;
      state = { emo: m ? '🤔' : '🔎', title: m ?? x.q1T, lead: m ? x.q1T : x.q1L(Math.round(SIM * 100), GAP), body: x.q1B };
    }
  } else if (st.task === 2) {
    const full = ['inc', 'life', 'edu'].every((k) => st.ord[k].length === 3);
    html += '<div class="le-rank">' + ['inc', 'life', 'edu'].map((k) => `<div class="r"><div class="rl">${esc(x.rows[k])}</div><div class="rc">${TRIO.map((id) => {
      const pos = st.ord[k].indexOf(id), cls = st.checked ? (pos >= 0 && TRIO_RANKS[k][pos] === id ? 'ok' : 'bad') : pos >= 0 ? 'on' : '';
      return `<button type="button" class="${cls}" data-x="ord" data-k="${k}" data-c="${id}">${pos >= 0 ? `<span class="n">${pos + 1}</span>` : ''}${esc(sn(id))}</button>`;
    }).join('')}</div></div>`).join('') + '</div>';
    html += `<div class="le-row">${st.checked ? `<button class="btn le-btn" data-x="done">${esc(x.fin)}</button>` : `<button class="btn le-btn" data-x="check2" ${full ? '' : 'disabled'}>${esc(x.check)}</button>`}<button class="chip le-chip" data-x="clear2">${esc(x.clear)}</button></div>`;
    if (!st.checked) state = { emo: '🔢', title: x.q2T, lead: x.q2L, body: '' };
    else {
      const k = ['inc', 'life', 'edu'].filter((q) => st.ord[q].join() === TRIO_RANKS[q].join()).length;
      const fmtv = { inc: (id) => usd(L19(id)[0]), life: (id) => `${nf(L19(id)[1], 1)}`, edu: (id) => `${nf(EYS[id], 1)}` };
      const lines = ['inc', 'life', 'edu'].map((q) => `<div>${st.ord[q].join() === TRIO_RANKS[q].join() ? '✓' : '✗'} <b>${esc(x.rows[q])}:</b> ${TRIO_RANKS[q].map((id) => `${esc(nameOf(id))} ${esc(fmtv[q](id))}`).join(' › ')}</div>`).join('');
      const hd = rankBy('hdi', TRIO).map((id) => `${nameOf(id)} ${nf(HDI[id], 3)}`).join(' › ');
      state = { emo: k === 3 ? '✅' : '🤔', title: k === 3 ? x.all : x.some(k), lead: TRIO_DISTINCT ? x.lead2 : x.lead2b, body: x.hdiLine(hd), extra: `<div class="le-res">${lines}</div>` };
    }
  } else {
    html += `<div class="le-row"><button class="chip le-chip" data-x="again">${esc(x.again)}</button></div>`;
    state = { emo: '🏁', title: x.endT, lead: x.endL, body: x.endB };
  }
  box.innerHTML = html;
  const f = st.focus;
  if (f) lab.setReadout(nf(HDI[f], 3), x.num(nm(f), usd(L19(f)[0]), nf(L19(f)[1], 1), nf(EYS[f], 1)), x.pillRank(rankBy('hdi', CS.map((q) => q.id)).indexOf(f) + 1), '#c9a0ff');
  else lab.setReadout('12', x.idle, '', '#c9a0ff');
  lab.setState({ ...state, extra: `${state.extra ?? ''}<div class="le-fine" style="margin-top:6px">${esc(x.fine)}</div>` });
  lab.setFacts([fact('f6', '📐'), fact('f7', '🔟')]);
}
render();
</script>
</body>
</html>
