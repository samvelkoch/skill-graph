    } else {

      lab.setState({ emo: '🥞', title: t.pan.exT, lead: t.pan.ex, body: '' });
    }
    return;
  }
  const n = S.pn;
  $('qtN').textContent = t.pan.friends(n);
  $('qtMinus').disabled = n <= 1; $('qtPlus').disabled = n >= 8;
  $('qtMinus').setAttribute('aria-label', t.pan.less); $('qtPlus').setAttribute('aria-label', t.pan.more);
  lab.setReadout(esc(t.pan.of(n)), t.pan.friends(n), t.pan.pill[n] ?? '', '#dca25a');
  lab.setState({ emo: '🥞', title: t.pan.t[n - 1], lead: t.pan.lead(n), body: t.pan.body(n) });
}
function infoCrackers(t) {
  const k = S.cn, stage = S.cShared ? 3 : S.cBrk ? 2 : S.cDeal ? 1 : 0, pieces = S.K.filter((o) => o.kind !== 'w').length;
  lab.setGlow('rgba(217, 179, 108, .24)');
  $('qtCrChips').innerHTML = [5, 6].map((n) => `<button class="chip qt-chip ${n === k ? 'on' : ''}" data-act="cn" data-n="${n}">${esc(t.cr.n(n))}</button>`).join('');
  const b = (act, label, on) => `<button class="qt-btn" data-act="${act}"${on ? '' : ' disabled'}>${esc(label)}</button>`;
  $('qtCrBtns').innerHTML = b('cdeal', t.cr.deal, stage === 0) + b('chalf', t.cr.half, stage === 1 || stage === 2) + b('cquarter', t.cr.quarter, stage === 1 || stage === 2)
    + b('cshare', t.cr.share, stage === 2 && pieces % 4 === 0) + b('cagain', t.cr.again, stage > 0);
  if (stage === 3) {
    const m = pieces / 4, kind = S.K.find((o) => o.kind !== 'w').kind, rq = (kind === 'h' ? 2 : 1) * m, r = rq === 1 ? t.cr.r1 : t.cr.r2;
    lab.setReadout(kind === 'h' ? '1 + ½' : `1${' + ¼'.repeat(m)}`, r, '', '#d9b36c');
    lab.setState({ emo: '🎉', title: t.cr.tDone, lead: t.cr.lDone(r), body: kind === 'q' && m === 2 ? t.cr.two : '' });
    return;
  }
  lab.setReadout('?', t.cr.plates, '', '#d9b36c');
  if (stage === 0) lab.setState({ emo: '🍪', title: t.cr.t0(k), lead: t.cr.l0, body: '' });
  else if (stage === 1) lab.setState({ emo: '🍽️', title: t.cr.t1(k), lead: t.cr.l1, body: '' });
  else if (pieces % 4 !== 0 || pieces < 4) lab.setState({ emo: '🤔', title: t.cr.tFew(pieces), lead: t.cr.lFew, body: '' });
  else lab.setState({ emo: '✂️', title: t.cr.tBrk, lead: t.cr.lBrk, body: '' });
}
function infoHalf(t) {
  const n = S.hp.filter((o) => o.slot >= 0).length;
  lab.setGlow('rgba(255, 211, 107, .22)');
  lab.setReadout(['?', '¼', '¼ + ¼ = ½', '¼ + ¼ + ¼ = ¾', '4 × ¼ = 1'][n], t.hf.sub(n), t.hf.p[n], '#e8b23c');
  lab.setState({ emo: '🧩', title: t.hf.t[n], lead: t.hf.l[n], body: '' });
}
function infoArea(t) {
  const done = S.ar >= 1;
  lab.setGlow('rgba(95, 143, 224, .26)');
  lab.setReadout(done ? '¼ = ¼' : '?', t.ar.sub, done ? t.ar.fit : '', '#5f8fe0');
  lab.setState({ emo: '🔷', title: done ? t.ar.tDone : t.ar.t0, lead: done ? t.ar.lDone : t.ar.l0, body: '' });
}
render();
</script>
