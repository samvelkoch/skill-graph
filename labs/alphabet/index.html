  if (v === 'c') { const cs = S.c; if (cs.pick !== null) return; cs.pick = i; cs.revT = NOW(); (i === 1 ? sfx.good : sfx.bad)(); }
  else if (v === 's') { const sh = S.sh; if (sh.pick !== null) return; sh.pick = i; sh.t = 0; sh.play = true; (i === 2 ? sfx.good : sfx.bad)(); }
  else { const st = S.tn[S.li]; if (st.pick !== null) return; st.pick = i; st.tv = 0; st.play = true; (i === RT[S.li] ? sfx.good : sfx.bad)(); }
  render(); showStage();
}
function addLetter(i) {
  const cs = S.c;
  if (cs.pick === null || cs.word.length >= 8) return;
  cs.word.push(i); sfx.click(); cs.flash = { i, t: NOW() };
  if (cs.task !== null) { const tg = CWORDS[cs.task]; if (cs.word.length === tg.length && tg.every((x, k) => x === cs.word[k])) { cs.done[cs.task] = true; sfx.good(); } }
  render();
}
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const q = HIT.find((o) => x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h);
  if (q) {
    if (q.a === 'tile') addLetter(q.i);
    else if (q.a === 'stage') { const st = S.tn[S.li]; st.tv = q.i; st.play = false; sfx.tick(); render(); }
    else if (q.a === 'al') { S.sh.t = [0.4, T_GREEK + 0.05, T_LATIN + 0.05, 6][q.i]; S.sh.play = false; S.cam.manual = false; sfx.tick(); render(); }
    else if (q.a === 'secA') { if (!S.a.tapped[q.i]) { S.a.tapped[q.i] = true; (S.a.at ??= [])[q.i] = performance.now() / 1000; sfx.good(); render(); } }
    return;
  }
  const mp = S.map;
  if (!S.sec && lab.view === 'ships' && mp && y >= mp.y && y <= mp.y + mp.h) { S.drag = { x, ox: S.cam.ox ?? 0 }; try { $('cv').setPointerCapture(ev.pointerId); } catch { /* fine */ } }
});
$('cv').addEventListener('pointermove', (ev) => {
  if (!S.drag) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left;
  S.cam.ox = S.drag.ox - (x - S.drag.x); if (Math.abs(x - S.drag.x) > 3) S.cam.manual = true;
});
const endDrag = () => { S.drag = null; };
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag);
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, cs = S.c;
  if (a === 'opt') return answer(b.dataset.v, +b.dataset.i);
  if (a === 'task') { const k = b.dataset.k === 'free' ? null : +b.dataset.k; cs.task = k; cs.word = []; sfx.click(); }
  else if (a === 'back') { cs.word.pop(); sfx.tick(); }
  else if (a === 'clear') { cs.word = []; sfx.tick(); }
  else if (a === 'let') { S.li = +b.dataset.i; sfx.click(); }
  else if (a === 'replay') { const st = S.tn[S.li]; if (st.pick !== null) { st.tv = 0; st.play = true; sfx.click(); } }
  else if (a === 'play') { const sh = S.sh; if (sh.pick === null) return; if (sh.t >= 6) sh.t = 0; sh.play = !sh.play; S.cam.manual = false; sfx.click(); }
  else if (a === 'resetA') { S.a = { tapped: [], j: 0 }; sfx.click(); }
  else if (a === 'mode') { S.b.mode = +b.dataset.m; S.b.p = 0; S.b.play = true; sfx.click(); }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === b.dataset.k ? null : b.dataset.k; if (S.sec === 'a') S.a = { tapped: [], j: 0 }; if (S.sec === 'b') { S.b.p = 0; S.b.play = true; } sfx.click(); showStage(); }
  render();
});
$('alTv').addEventListener('input', (ev) => { const st = S.tn[S.li]; if (st.pick === null) return; st.tv = +ev.target.value; st.play = false; render(); });
$('alSv').addEventListener('input', (ev) => { const sh = S.sh; if (sh.pick === null) return; sh.t = +ev.target.value; sh.play = false; S.cam.manual = false; render(); });

// --- one render per change: controls, readout, state card, facts ---------------------------------------------
function predHTML(v, q, opts, pick, right, ok, no, big) {
  const t = T[lang], done = pick !== null;
  const chips = opts.map((o, i) => `<button type="button" class="al-opt${big ? ' big' : ''}${done ? (i === right ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="opt" data-v="${v}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = done ? `<div class="al-verdict ${pick === right ? 'good' : 'bad'}">${esc(pick === right ? `${t.ok} ${ok}` : no)}</div>` : '';
  return `<div class="al-q">${esc(q)}</div><div class="al-opts">${chips}</div>${verdict}`;
}
const yearOf = (t, tt) => (tt <= 5 ? t.sYear(Math.round((1000 - tt * 100) / 10) * 10) : tt < T_CYR ? '…' : t.sLate);
function render() {
  const t = T[lang], sec = S.sec, v = sec ? 'sec' : lab.view;
  document.body.dataset.v = v;
  $('alCount').hidden = sec || v !== 'count'; $('alTurn').hidden = sec || v !== 'turn'; $('alShips').hidden = sec || v !== 'ships';
  $('alSecA').hidden = sec !== 'a'; $('alSecB').hidden = sec !== 'b';
  $('alFine').textContent = !sec && v !== 'ships' ? t.fine : '';
  // secrets row
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" type="button" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  setHTML($('alSecs'), sc('a', '🪙') + sc('b', '↔️'));
  if (sec === 'a') return renderA(t);
  if (sec === 'b') return renderB(t);
  if (v === 'count') renderCount(t); else if (v === 'turn') renderTurn(t); else renderShips(t);
}
function renderCount(t) {
  const cs = S.c, ans = cs.pick !== null;
  lab.setGlow('rgba(201, 164, 92, .26)');
  setHTML($('alPredC'), predHTML('c', t.cAsk, t.cOpts, cs.pick, 1, t.cOk, t.cNo, false));
  $('alWordBox').hidden = !ans;
  if (ans) {
    $('alWrite').textContent = t.cWrite;
    setHTML($('alTasks'), [0, 1].map((k) => `<button type="button" class="chip${cs.task === k ? ' on' : ''}" data-act="task" data-k="${k}">${cs.done[k] ? '✓ ' : ''}${esc(t.cTasks[k])}</button>`).join('') + `<button type="button" class="chip${cs.task === null ? ' on' : ''}" data-act="task" data-k="free">${esc(t.cFree)}</button>`);
    $('alDir').textContent = t.cDir;
    setHTML($('alStrip'), cs.word.length ? cs.word.map((i) => `<span class="al-g">${svgG(PH[i])}<b>${PH[i].t}</b></span>`).join('') : `<span class="al-empty">${esc(cs.task !== null ? t.cTap(CWORDS[cs.task].map((i) => PH[i].t)) : t.cEmpty)}</span>`);
    $('alBack').textContent = t.cBack; $('alClear').textContent = t.cClear;
    $('alBack').disabled = $('alClear').disabled = !cs.word.length;
  }
  if (!ans) { lab.setReadout('?', '', '', '#c9a45c'); lab.setState({ emo: '🤔', title: t.cAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  lab.setReadout(t.cVal, t.cSub, t.cPill, '#c9a45c');
  const w = cs.word.map((i) => PH[i].t).join('');
  const hit = cs.task !== null && cs.done[cs.task] && cs.word.length === CWORDS[cs.task].length && CWORDS[cs.task].every((x, k) => x === cs.word[k]);
  if (hit) lab.setState({ emo: '🏠', title: t.cD(w, t.cMeans[cs.task]), lead: t.cDl, body: '', extra: '' });
  else if (cs.word.length) lab.setState({ emo: '✍️', title: t.cW(w), lead: t.cWl, body: '', extra: '' });
  else lab.setState({ emo: '✍️', title: t.cT0, lead: t.cL0, body: '', extra: '' });
  lab.setFacts([{ emo: '📜', text: t.facts.c, src: SRC.c }]);
}
function renderTurn(t) {
  const li = S.li, st = S.tn[li], ans = st.pick !== null, near = Math.round(st.tv);
  lab.setGlow('rgba(176, 90, 208, .24)');
  setHTML($('alLets'), LET.map((L, i) => `<button type="button" class="chip al-lc${i === li ? ' on' : ''}" data-act="let" data-i="${i}" aria-label="${i + 1}">${L.emo}${S.tn[i].pick !== null ? ' <small>✓</small>' : ''}</button>`).join(''));
  setHTML($('alPredT'), predHTML('t', t.tAsk, TOP[li], st.pick, RT[li], t.tRev[li], `${t.tNo} ${t.tRev[li]}`, true));
  const tv = $('alTv'); tv.disabled = !ans; tv.setAttribute('aria-label', t.tStages.join(' → '));
  if (+tv.value !== st.tv) tv.value = st.tv;
  setHTML($('alTicksT'), t.tStages.map((s) => `<span>${esc(s)}</span>`).join(''));
  $('alReplay').textContent = t.tPlay; $('alReplay').disabled = !ans;
  if (!ans) {
    lab.setReadout('?', t.tPics[li], '', '#b05ad0');
    lab.setState({ emo: '🤔', title: t.tAsk, lead: t.tPics[li], body: '', extra: '' }); lab.setFacts([]); return;
  }
  lab.setReadout(LET[li].lat, `${t.tNames[li]} · ${t.tMeans[li]}`, t.tStages[near], '#b05ad0');
  lab.setState({ emo: LET[li].emo, title: `${t.tNames[li]} → ${LET[li].lat}`, lead: t.tStL[near], body: t.tRev[li], extra: '' });
  lab.setFacts(li === 5 ? [{ emo: '👁️', text: t.facts.t, src: SRC.t }] : []);
}
const EVENTS = [['cyprus', 1.0], ['crete', 1.5], ['carthage', 1.85], ['greece', 2.1], ['greek', T_GREEK], ['spain', 2.8], ['latin', T_LATIN], ['cyr', T_CYR]];
function renderShips(t) {
  const sh = S.sh, ans = sh.pick !== null, tt = ans ? sh.t : 0;
  lab.setGlow('rgba(90, 162, 245, .24)');
  setHTML($('alPredS'), predHTML('s', t.sAsk, t.sOpts, sh.pick, 2, t.sOk, t.sNo, false));
  const sv = $('alSv'); sv.disabled = !ans; sv.setAttribute('aria-label', `${t.sTicks[0]} – ${t.sTicks[2]}`);
  if (+sv.value !== sh.t) sv.value = sh.t;
  setHTML($('alTicksS'), `<span style="left:0">${esc(t.sTicks[0])}</span><span style="left:83.3%;transform:translateX(-50%)">${esc(t.sTicks[1])}</span><span style="right:0">${esc(t.sTicks[2])}</span>`);
  $('alPlay').textContent = sh.play ? t.sPause : t.sPlay; $('alPlay').disabled = !ans;
  const arrived = ROUTES.filter((r) => tt >= r.t1).length, n = 3 + arrived + (tt >= T_LATIN ? 1 : 0) + (tt >= T_CYR ? 1 : 0);
  lab.setReadout(yearOf(t, tt), t.sN(n), t.sAl[alphaAt(tt, ans)], COL[['ph', 'gr', 'la', 'cy'][alphaAt(tt, ans)]]);
  if (!ans) { lab.setState({ emo: '🤔', title: t.sAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  const ev = EVENTS.filter((e) => tt >= e[1]).pop();
  let st;
  if (!ev) st = { emo: '⚓', title: t.sSt0[0], lead: t.sSt0[1] };
  else if (ev[0] === 'greek') st = { emo: '🔵', title: t.sGreek[0], lead: t.sGreek[1] };
  else if (ev[0] === 'latin') st = { emo: '🏛️', title: t.sLatin[0], lead: t.sLatin[1] };
  else if (ev[0] === 'cyr') st = { emo: '🟢', title: t.sCyr[0], lead: t.sCyr[1] };
  else st = { emo: '⛵', title: t.sReach(t.sTo[ev[0]]), lead: t.sPh[ev[0]] };
  lab.setState({ ...st, body: '', extra: '' });
  lab.setFacts([{ emo: '🏙️', text: t.facts.s1, src: SRC.s1 }, { emo: '🔤', text: t.facts.s2, src: SRC.s2 }]);
}
function renderA(t) {
  const sa = t.secA, A = S.a, all = sa.tiles.every((_, i) => A.tapped[i]);
  lab.setGlow('rgba(224, 169, 44, .26)');
  $('alResetA').textContent = sa.again;
  lab.setReadout(all ? sa.parts.join('') : '?', '', '🪙', '#e0a92c');
  lab.setState({ emo: '🪙', title: t.secrets.a[0], lead: all ? sa.l1 : sa.l0, body: '', extra: '' });
  lab.setFacts([]);
}
function renderB(t) {
  const B = S.b;
  lab.setGlow('rgba(176, 90, 208, .24)');
  setHTML($('alModes'), t.secB.modes.map((m, i) => `<button type="button" class="chip${B.mode === i ? ' on' : ''}" data-act="mode" data-m="${i}">${esc(m)}</button>`).join(''));
  lab.setReadout(['←', '→', '↩'][B.mode], '', '↔️', '#b05ad0');
  lab.setState({ emo: '↔️', title: t.secrets.b[0], lead: t.secB.l[B.mode], body: '', extra: '' });
  lab.setFacts([]);
}
const texKey = () => {
  if (S.sec === 'a') return `a${S.a.tapped.join()}${S.a.j > 0.99}`;
  if (S.sec) return '';
  if (lab.view === 'turn') { const st = S.tn[S.li]; return `t${S.li}|${Math.round(st.tv)}|${st.pick !== null}`; }
  if (lab.view === 'ships') { const sh = S.sh; return `s${Math.round(sh.t * 10)}|${sh.play}|${sh.pick !== null}`; }
  return '';
};
canvasLoop($('cv'), (c, w, h, dt, time) => {
  HIT.length = 0;
  if (S.sec === 'a') drawSecA(c, w, h, dt, time);
  else if (S.sec === 'b') drawSecB(c, w, h, dt, time);
  else if (lab.view === 'count') drawCount(c, w, h, dt, time);
  else if (lab.view === 'turn') drawTurn(c, w, h, dt, time);
  else drawShips(c, w, h, dt, time);
  const k = texKey();
  if (k !== S.key) { S.key = k; render(); }
  if (!S.sec && lab.view === 'ships' && S.sh.play) { const sv = $('alSv'); if (+sv.value !== S.sh.t) sv.value = S.sh.t; }
  if (!S.sec && lab.view === 'turn' && S.tn[S.li].play) { const tv = $('alTv'); tv.value = S.tn[S.li].tv; }
});
render();
</script>
