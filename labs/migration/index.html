  $('mgRun').disabled = R.on;
  // verdict line
  const vd = verdict[v], vt = vd === null || asking ? '' : (v === 'tern' ? (vd ? t.ternRight : t.ternWrong) : v === 'three' ? (vd ? t.threeRight : t.threeWrong) : (vd ? t.stayRight : t.stayWrong));
  let vtxt = vt, vcls = vd === false ? 'no' : 'ok';
  if (v === 'stay' && !asking) {
    const res = R.dead ? t.tooHungry : R.done ? t.madeIt : '';
    vtxt = [vt, res].filter(Boolean).join('\n'); vcls = R.dead || vd === false ? 'no' : 'ok';
  }
  $('mgVerdict').textContent = vtxt; $('mgVerdict').className = `mg-verdict ${vcls}`; $('mgVerdict').style.display = vtxt ? 'block' : 'none';
  // state card and facts
  const sk = v === 'tern' ? 'tern' : v === 'three' ? 'three' : 'stay';
  if (asking) {
    lab.setState({ emo: '🤔', title: askText, lead: '', body: '' }); lab.setFacts([]);
  } else if (S.sec) {
    const s = S.sec;
    lab.setState({ emo: s === 'a' ? '🛫' : '🐋', title: t.secrets[s][0], lead: t.secrets[s][1], body: t[SEC[s].key] }); lab.setFacts([]);
  } else if (v === 'three' && S.sel) {
    const id = S.sel, k = REASON[id];
    lab.setState({ emo: ANIMAL_EMO[id], title: cap(t.animals[id]), lead: id === 'whale' && !asked.three ? '' : t.cards[id], body: id === 'whale' && !asked.three ? '' : `${REASON_EMO[k]} ${cap(t.reasons[k])}` });
    lab.setFacts(t.facts.three);
  } else {
    const [emo, title, lead, body] = t.st[sk];
    lab.setState({ emo, title, lead, body }); lab.setFacts(t.facts[sk]);
  }
  lab.setGlow(v === 'tern' ? 'rgba(126, 240, 200, .24)' : v === 'three' ? 'rgba(246, 166, 35, .26)' : 'rgba(110, 160, 255, .24)');
  updateReadout(); syncSlider();
  lab.checkStage();
}
runReset();
render();
</script>
