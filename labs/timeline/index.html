  .vd { font-size: 13px; color: var(--body); line-height: 1.5; }

const PADR = 24;

// tinted BC / AD halves, the axis, adaptive ticks and the bold "year 1" mark; returns the tick step in "years ago" mode
function drawAxis(c, sc) {
  const { w, h, K, R, ay, X } = sc, t = T[lang], span = w / K, ago = span > 40000, xm = X(0.5);
  if (!ago) {
    c.fillStyle = 'rgba(95,143,208,.08)'; c.fillRect(0, 0, clamp(xm, 0, w), h);
    if (xm < w) { c.fillStyle = 'rgba(224,176,80,.05)'; c.fillRect(Math.max(0, xm), 0, w - Math.max(0, xm), h); }
  }
  c.strokeStyle = '#aab3d0'; c.lineWidth = 3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, ay); c.lineTo(w, ay); c.stroke();
  c.font = txt(700, 12); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#98A0B8'; c.strokeStyle = '#6b7396'; c.lineWidth = 1.5;
  const minSp = (ago ? 40 : c.measureText(yr(-2500)).width) + 20;
  const step = NICE.find((s) => s * K >= minSp) ?? NICE[NICE.length - 1];
  const aLo = R - (w - PADR) / K, aHi = R + PADR / K;
  const tick = (x, label) => { c.beginPath(); c.moveTo(x, ay); c.lineTo(x, ay + 7); c.stroke(); c.fillText(label, x, ay + 21); };
  if (ago) {
    for (let n = Math.max(0, Math.ceil((NOW - aHi) / step)), i = 0; n <= Math.floor((NOW - aLo) / step) && i < 120; n++, i++) {
      tick(X(NOW - n * step), step >= 1e6 ? String((n * step) / 1e6) : fmt(n * step));
    }
  } else {
    for (let m = Math.max(1, Math.ceil((1 - aHi) / step)), i = 0; m <= Math.floor((1 - aLo) / step) && i < 120; m++, i++) {
      const x = X(1 - m * step); if (Math.abs(x - xm) > 30) tick(x, yr(-m * step));
    }
    for (let m = Math.max(1, Math.ceil(aLo / step)), i = 0; m <= Math.floor(aHi / step) && i < 120; m++, i++) {
      const x = X(m * step); if (Math.abs(x - xm) > 30) tick(x, yr(m * step));
    }
    if (xm > -60 && xm < w + 60) {
      c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.moveTo(xm, ay - 15); c.lineTo(xm, ay + 15); c.stroke();
      c.font = txt(800, 12); c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText('1', xm, ay + 29);

      const bcT = `${t.bc} ←`, adT = `→ ${t.ad}`, bcW = c.measureText(bcT).width, adW = c.measureText(adT).width;
      if (xm > 4) {
        c.fillStyle = '#9db4e8';

        else { c.textAlign = 'left'; c.fillText(bcT, 4, ay - 38); }
      }
      if (xm < w - 4) {
        c.fillStyle = '#e8c27a';
        if (xm + 8 + adW <= w - 4) { c.textAlign = 'left'; c.fillText(adT, Math.max(xm + 8, 4), ay - 22); }
        else { c.textAlign = 'right'; c.fillText(adT, w - 4, ay - 38); }

    }
  }
  return ago ? step : 0;
}

// cards on stems: left to right, each card takes the level (above or below the line) where it needs the least sideways shift
function placeCards(c, sc, evs, upOnly) {
  const { w, ay, X } = sc, maxT = w < 640 ? 100 : 140, LH = 66, UP0 = 46, DN0 = 36, gap = 8;
  c.font = txt(800, 12);
  const items = [];
  for (const ev of evs) {
    const ex = X(ast(ev.y));
    if (ex < -12 || ex > w + 12) continue;
    const lines = []; let cur = '';
    for (const wd of evName(ev).split(' ')) {
      const tst = cur ? `${cur} ${wd}` : wd;
      if (!cur || c.measureText(tst).width <= maxT) cur = tst; else { lines.push(cur); cur = wd; }
    }
    lines.push(cur);
    const yline = ev.noYear ? null : yr(ev.y);
    const tw = Math.max(...lines.map((s) => c.measureText(s).width), yline ? c.measureText(yline).width : 0);
    items.push({ ev, ex, lines, yline, cw: Math.ceil(tw) + 46, ch: (lines.length + (yline ? 1 : 0)) * 15 + 14 });
  }
  items.sort((a, b) => a.ex - b.ex);
  const order = upOnly ? [1, 2, 3, 4, 5, 6] : [1, -1, 2, -2, 3, -3, 4, -4];
  const occ = new Map(order.map((l) => [l, []]));
  for (const it of items) {
    const lo = 6 + it.cw / 2, hi = w - 6 - it.cw / 2, des = clamp(it.ex, lo, hi);
    let best = null;
    order.forEach((lvl, idx) => {
      const list = occ.get(lvl), cands = [des];
      for (const q of list) cands.push(q.l - gap - it.cw / 2, q.r + gap + it.cw / 2);
      for (const x of cands) {
        if (x < lo - 0.5 || x > hi + 0.5) continue;
        if (list.some((q) => x - it.cw / 2 < q.r + gap - 0.5 && x + it.cw / 2 > q.l - gap + 0.5)) continue;
        const cost = Math.abs(x - des) + 55 * idx;
        if (!best || cost < best.cost) best = { x, lvl, cost };
      }
    });
    if (!best) best = { x: des, lvl: order[order.length - 1], cost: 0 };
    const n = Math.abs(best.lvl);
    it.cx = best.x; it.up = best.lvl > 0;
    it.y = it.up ? ay - UP0 - (n - 1) * LH - it.ch : ay + DN0 + (n - 1) * LH;
    occ.get(best.lvl).push({ l: best.x - it.cw / 2, r: best.x + it.cw / 2 });
  }
  return items;
}
// o: { f: 0..1 flight progress, from: {key: {x, y}} card centres to start from, alpha, ok: {key: bool} outline colours }
function drawCards(c, sc, placed, o = {}) {
  const f = o.f ?? 1, al = o.alpha ?? 1;

    c.globalAlpha = al; c.fillStyle = p.ev.c; c.strokeStyle = '#0c0e1a'; c.lineWidth = 2;
    c.beginPath(); c.arc(p.ex, sc.ay, 5, 0, Math.PI * 2); c.fill(); c.stroke();

    c.save(); c.globalAlpha = al * (0.4 + 0.6 * f);

    c.lineWidth = 2; c.strokeStyle = o.ok ? (o.ok[p.ev.k] ? '#3ddc97' : '#f5c84c') : p.ev.c; c.stroke();
    c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle';

    p.lines.forEach((s, i) => c.fillText(s, x + 38, y0 + i * 15));

}

// --- the line scene (order, scale, secrets) --------------------------------------------------------------------
function sceneKind(v) {

}
canvasLoop($('cv'), (c, w, h, dt, time) => {

    const e = time - SC.at, s = e < 0.9 ? -1 : Math.min(3, Math.floor((e - 0.9) / 2.3));
    if (s !== SC.step) { SC.step = s; if (s >= 0) { V.free = false; V.tgt = fitRange(SSTEPS[s].lo, NOW); V.rate = 2.2; } }
  }

// --- Egypt: two bars on one scale, then the long bar splits into kingdoms --------------------------------------
function drawEgypt(c, w, h, time) {

  const t = T[lang], el = time - EG.at, g = ease(el / 1.1), sa = EG.sel ? 1 : ease((el - 1.3) / 0.7);
  const pad = 16, W = w - 2 * pad, bh = 46, top = Math.max(16, (h - 210) / 2);
  const rows = [{ nm: t.e.egypt, n: EGYPT_Y, col: '#e0b050' }, { nm: t.e.since, n: SINCE_Y, col: '#5f8fd0' }];
  c.save(); c.textBaseline = 'middle'; c.lineJoin = 'round';
  rows.forEach((r, i) => {
    const ly = top + i * (bh + 46), by = ly + 20, bw = W * r.n / EGYPT_Y * g;
    c.globalAlpha = g; c.fillStyle = '#fff'; c.font = txt(800, 13); c.textAlign = 'left';
    c.fillText(`${r.nm} · ${t.e.years(fmt(r.n))}`, pad, ly + 4);
    c.globalAlpha = 1;
    c.beginPath(); c.roundRect(pad, by, Math.max(bw, 2), bh, 10);
    c.fillStyle = r.col; c.globalAlpha = i === 0 ? lerp(0.95, 0.36, sa) : 0.9; c.fill();

  });

      c.save(); c.globalAlpha = sa;

      c.lineWidth = on ? 3 : 1.5; c.strokeStyle = on ? '#fff' : '#8a6a24'; c.stroke();
      c.fillStyle = '#15182a'; c.font = emoFont(20); c.textAlign = 'center'; c.fillText(p.e, x + ww / 2, by + bh / 2 + 1);
      if (on) { c.fillStyle = '#fff'; c.font = txt(800, 12); c.fillText(t.e.names[p.k], clamp(x + ww / 2, 50, w - 50), by + bh + 14); }

  for (let i = 0; i <= 3; i++) { const x = pad + W * i * 1000 / EGYPT_Y; c.moveTo(x, ay); c.lineTo(x, ay + 6); }
  c.stroke();
  for (let i = 0; i <= 3; i++) c.fillText(i ? fmt(i * 1000) : '0', pad + W * i * 1000 / EGYPT_Y, ay + 18);
  c.restore();
}

// --- scale view: running label (how long this strip would be at 1 cm = 10 years) -------------------------------
const fmtLen = (years) => {
  const t = T[lang], cm = years / 10;
  if (cm < 99.5) return `${Math.round(cm)} ${t.cm}`;
  const m = Math.round(cm / 50) / 2;
  return `${String(m).replace('.', lang === 'en' ? '.' : ',')} ${t.m}`;
};
function scaleReadout(w, K, dt) {
  const t = T[lang], free = V.free;
  const tgt = free ? (w - 48) / K : SC.step < 0 ? 10 : SSTEPS[SC.step].len;
  SC.lenY = free ? tgt : SC.lenY + (tgt - SC.lenY) * (1 - Math.exp(-dt * 2.4));
  const label = fmtLen(SC.lenY), cap = free ? '' : SC.step < 0 ? t.s.life : SSTEPS[SC.step].cap();
  if (label !== SC.shown || cap !== SC.cap) { SC.shown = label; SC.cap = cap; setScaleReadout(); }
}
const setScaleReadout = () => lab.setReadout(esc(T[lang].s.len(SC.shown)), SC.cap, SC.right ? T[lang].right : T[lang].wrong, '#d9825f');

// --- zoom slider: log scale between the narrowest and widest view ------------------------------------------------
const spanRange = () => (lab.view === 'scale' ? [12, 4000] : [20, 6000]);
const sliderOf = (span) => { const [a, b] = spanRange(); return clamp((Math.log(b) - Math.log(span)) / (Math.log(b) - Math.log(a)), 0, 1); };
const spanOf = (f) => { const [a, b] = spanRange(); return Math.exp(lerp(Math.log(b), Math.log(a), f)); };
const goFree = () => { V.free = true; SC.cancel = true; S.famZ = true; };
$('zoom').addEventListener('input', () => {
  const w = stageW, K0 = Math.exp(V.lk), K = (w - 48) / spanOf(+$('zoom').value / 1000);
  if (lab.view === 'order') { const mid = V.R - (w / 2 - PADR) / K0; V.R = mid + (w / 2 - PADR) / K; } // order: zoom around the middle; scale: keep "today" at the right
  V.lk = Math.log(K); goFree();
});
$('zoom').addEventListener('pointerdown', () => { zoomActive = true; });
addEventListener('pointerup', () => { zoomActive = false; });

// --- drag to pan, tap a kingdom ---------------------------------------------------------------------------------
const cv = $('cv');
let drag = null;
const canPan = () => {
  const v = lab.view;
  if (v === 'scale') return SC.ans !== null;
  return v === 'order' && S.sec !== 'dino' && (O.done || S.sec === 'family');
};
cv.addEventListener('pointerdown', (ev) => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'egypt') {
    const hit = segHit.find((s) => x >= s.x - 6 && x <= s.x + s.w + 6 && y >= s.y - 6 && y <= s.y + s.h + 6);
    if (hit) { EG.sel = EG.sel === hit.k ? null : hit.k; sfx.click(); render(); }
    return;
  }
  if (!canPan()) return;
  drag = { x: ev.clientX, R: V.R, K: Math.exp(V.lk) };
  cv.setPointerCapture(ev.pointerId);
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  V.R = clamp(drag.R - (ev.clientX - drag.x) / drag.K, -3400, 2300); goFree();
});
const endDrag = () => { drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- actions ----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function check() { // rounds 1 and 2: reveal the true order
  const keys = RSET[O.r];
  if (O.slots.length !== keys.length) return;
  const truth = byYear(keys), sr = $('stage').getBoundingClientRect();
  O.from = {};
  O.slots.forEach((k, i) => { const b = $('sl' + i)?.getBoundingClientRect(); if (b) O.from[k] = { x: b.left + b.width / 2 - sr.left, y: b.top + b.height / 2 - sr.top }; });
  O.ok = Object.fromEntries(O.slots.map((k, i) => [k, k === truth[i]]));
  O.score = O.slots.filter((k, i) => k === truth[i]).length;
  O.right = O.score === keys.length;
  const num = byNumber(keys);
  O.trap = O.r === 0 && !O.right && O.slots.every((k, i) => k === num[i]);
  O.done = true; O.flyAt = now(); V.free = false; V.tgt = roundFit(O.r); V.rate = 3;
  (O.right ? sfx.good : sfx.bad)(); render(); showStage();
}
function answer(a) { // one-tap questions: round 3, the scale view, Egypt
  const v = lab.view;
  if (v === 'order') {
    Object.assign(O, { ans: a, right: a === 'cleo', done: true, flyAt: now(), from: {} });
    V.free = false; V.tgt = roundFit(2); V.rate = 3;
  } else if (v === 'scale') {
    Object.assign(SC, { ans: a, right: a === '2m', at: now(), step: -1, lenY: 10, cancel: false, shown: '', cap: '' });
    V.free = false; V.tgt = fixedK(3.8); V.rate = 2.2;
  } else Object.assign(EG, { ans: a, right: a === 'egypt', at: now(), sel: null });
  const ok = v === 'order' ? O.right : v === 'scale' ? SC.right : EG.right;
  (ok ? sfx.good : sfx.bad)(); render(); showStage();
}
pnl.addEventListener('click', (ev) => {
  const tc = ev.target.closest('.tc'), sl = ev.target.closest('button.sl');
  if (tc && !O.slots.includes(tc.dataset.k)) { O.slots.push(tc.dataset.k); sfx.click(); }
  else if (sl) { O.slots.splice(+sl.dataset.i, 1); sfx.tick(); }
  else return;
  render();
});
askEl.addEventListener('click', (ev) => { const b = ev.target.closest('button[data-a]'); if (b) answer(b.dataset.a); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'oMain') {
    if (!O.done) check();
    else { startRound(O.r < 2 ? O.r + 1 : 0); sfx.click(); render(); }
    return;
  }
  if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) { S.sec = null; V.free = false; V.tgt = roundFit(O.done ? O.r : 0); V.rate = 3; }
    else if (k === 'dino') { S.sec = k; V.free = false; V.tgt = fitRange(NOW - 66e6, NOW); V.rate = 1.3; }
    else { S.sec = k; S.famAt = now(); S.famZ = false; V.free = false; V.tgt = fitRange(S.born - 72, NOW + 4); V.rate = 3; }
    sfx.click();
  } else if (act === 'born') {
    const n = clamp(S.born + +b.dataset.s, 2010, 2022);
    if (n === S.born) return;
    S.born = n; S.famAt = now(); S.famZ = false; V.free = false; V.tgt = fitRange(S.born - 72, NOW + 4); V.rate = 3; sfx.tick();
  } else if (act === 'per') { EG.sel = EG.sel === b.dataset.k ? null : b.dataset.k; sfx.click(); }
  render();
});

// --- one render per change: panels, controls, readout and the state card ------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  const predicting = v === 'order' ? !S.sec && !O.done : v === 'scale' ? SC.ans === null : EG.ans === null;
  document.body.dataset.v = v;
  $('secOrder').style.display = v === 'order' ? '' : 'none';
  $('secScale').style.display = v === 'scale' ? '' : 'none';
  $('secEgypt').style.display = v === 'egypt' ? '' : 'none';
  zoomShown = (v === 'order' && S.sec !== 'dino' && (O.done || S.sec === 'family')) || (v === 'scale' && SC.ans !== null);
  $('zoomRow').style.display = zoomShown ? '' : 'none';
  $('zLbl').textContent = t.s.zoom; $('zoom').setAttribute('aria-label', t.s.zoom);
  pnl.style.display = 'none'; pnl.innerHTML = ''; askEl.style.display = 'none'; askEl.innerHTML = '';
  if (v === 'order') renderOrder(t, predicting); else if (v === 'scale') renderScale(t, predicting); else renderEgypt(t, predicting);
}
const fine = (t) => `<div class="fine">${esc(t.fine)}</div>`;
const ask = (q, opts, mid) => {
  askEl.className = `ask card${mid ? ' mid' : ''}`; askEl.style.display = '';
  askEl.innerHTML = `<div class="q">${esc(q)}</div><div class="abs">${opts.map(([a, l]) => `<button data-a="${a}">${esc(l)}</button>`).join('')}</div>`;
};
const verdictPill = (ok, t) => (ok ? t.right : t.wrong);

function renderOrder(t, predicting) {
  lab.setGlow('rgba(95, 143, 208, .26)');
  const open = secret.unlocked(), sec = S.sec, keys = RSET[O.r], N = keys.length;
  const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('oChips').innerHTML = chip('dino', '🦕') + chip('family', '👪');
  $('oQ').textContent = !sec && O.done ? [t.o.q1, t.o.q2, t.o.q3][O.r] : '';
  $('oV').textContent = !sec && O.done ? (O.r === 2 ? t.o.r3 : O.r === 1 ? t.o.score(O.score) : O.trap ? t.o.bcTrap : '') : '';
  const main = $('oMain');
  main.style.display = !sec && (O.done || O.r < 2) ? '' : 'none';
  main.textContent = O.done ? (O.r < 2 ? t.next : t.again) : t.check;
  main.disabled = !O.done && O.slots.length < N;
  const fam = $('famBox');
  fam.style.display = sec === 'family' ? '' : 'none';
  fam.innerHTML = sec === 'family' ? `<span class="lbl">${esc(t.sec.born)}</span><button class="sb" data-act="born" data-s="-1" aria-label="−"${S.born <= 2010 ? ' disabled' : ''}>−</button><b class="by">${S.born}</b><button class="sb" data-act="born" data-s="1" aria-label="+"${S.born >= 2022 ? ' disabled' : ''}>+</button>` : '';
  if (sec === 'dino') {
    lab.setReadout('66', t.sec.myr, '', '#e0b050');
    lab.setState({ emo: '🦕', title: t.secrets.dino[0], lead: t.sec.dinoText, body: '', extra: fine(t) });
    return;
  }
  if (sec === 'family') {
    lab.setReadout(String(S.born), t.sec.you, '', '#5fa8a0');
    lab.setState({ emo: '👪', title: t.secrets.family[0], lead: t.sec.familyText, body: '', extra: fine(t) });
    return;
  }
  lab.setReadout(`${O.r + 1}/3`, '', O.done ? verdictPill(O.right, t) : '', '#5f8fd0');
  const [emo, title, lead, body] = t.st.order;
  lab.setState({ emo, title, lead, body, extra: fine(t) });
  if (!predicting) return;
  if (O.r === 2) { ask(t.o.q3, O.opts.map((k) => [k, t.o[k]]), true); return; }
  const used = new Set(O.slots);
  const slots = Array.from({ length: N }, (_, i) => {
    const k = O.slots[i];
    return k ? `<button class="sl" id="sl${i}" data-i="${i}" aria-label="${esc(t.ev[k])}">${byK[k].e}</button>` : `<div class="sl" id="sl${i}">${i + 1}</div>`;
  }).join('');
  const tray = O.tray.map((k) => `<button class="tc${used.has(k) ? ' gone' : ''}" data-k="${k}"><span class="e">${byK[k].e}</span><span class="n">${esc(t.ev[k])}</span><span class="y">${esc(yr(byK[k].y))}</span></button>`).join('');
  pnl.style.display = '';
  pnl.innerHTML = `<div class="q">${esc([t.o.q1, t.o.q2][O.r])}</div><div class="dir"><span>${esc(t.o.oldest)}</span><i>→</i><span>${esc(t.o.newest)}</span></div><div class="slots">${slots}</div><div class="tray">${tray}</div>`;
}

function renderScale(t, predicting) {
  lab.setGlow('rgba(217, 130, 95, .24)');
  const [emo, title, lead, body] = t.st.scale;
  lab.setState({ emo, title, lead, body, extra: fine(t) });
  $('sQ').textContent = predicting ? '' : t.s.q;
  $('sV').textContent = predicting ? '' : t.s.r;
  if (predicting) {
    lab.setReadout(`1 ${esc(t.cm)}`, `= ${t.yrs(10)}`, '', '#d9825f');
    ask(t.s.q, [['20cm', `20 ${t.cm}`], ['2m', `2 ${t.m}`], ['20m', `20 ${t.m}`]], false);
  } else { SC.shown = fmtLen(SC.lenY); SC.cap = SC.cancel ? '' : SC.step < 0 ? t.s.life : SSTEPS[SC.step].cap(); setScaleReadout(); }
}

function renderEgypt(t, predicting) {
  lab.setGlow('rgba(224, 176, 80, .24)');
  const [emo, title, lead, body] = t.st.egypt;
  lab.setState(predicting ? { emo, title, lead: t.e.q, body: '', extra: fine(t) } : { emo, title, lead, body, extra: fine(t) });
  $('eQ').textContent = predicting ? '' : t.e.q;
  $('eV').textContent = predicting ? '' : t.e.r;
  $('ePer').innerHTML = predicting ? '' : PERIODS.map((p) => `<button class="chip ${EG.sel === p.k ? 'on' : ''}" data-act="per" data-k="${p.k}">${p.e} ${esc(t.e.names[p.k])}</button>`).join('');
  $('eNote').textContent = !predicting && EG.sel ? t.e.periods[EG.sel] : '';
  if (predicting) {
    lab.setReadout('?', '', '', '#e0b050');
    ask(t.e.q, EG.opts.map((k) => [k, t.e[k]]), true);
  } else lab.setReadout(`${fmt(EGYPT_Y)} : ${fmt(SINCE_Y)}`, '', verdictPill(EG.right, t), '#e0b050');
}
enterView();
render();
</script>
</body>
