const roundsDone = () => S.rpick.filter((x) => x != null).length;

function render() {
  const t = T[lang], v = S.sec || lab.view, un = secret.unlocked();
  document.body.dataset.v = v === 'faces' ? (S.fp ? 'faces-b' : 'faces-a') : v === 'travel' ? 'travel' : v === 'doubt' ? 'doubt' : v;
  let ctrl = '', st, stage, facts = [];
  const chip = (act, k, on, label, cls = '') => `<button type="button" class="chip ${cls} ${on ? 'on' : ''}" data-act="${act}" data-k="${k}">${label}</button>`;
  if (v === 'travel') {
    stage = stTravel(t); facts = t.facts.travel;
    const key = `${S.g}:${S.pin}`, seen = S.pin && S.seen[key], isSame = S.pin && GEST[S.g].same.includes(S.pin);
    ctrl += `<div class="chips">${Object.keys(GEST).map((k) => chip('g', k, S.g === k, `${GEST[k].e} ${esc(t.g[k][0])}`)).join('')}</div><p class="gs-p" style="margin-top:10px">${esc(t.trav(t.g[S.g][1]))}</p>`;
    if (!S.pin) ctrl += `<p class="gs-p"><b>${esc(t.tapPin)}</b></p>`;
    else if (!seen) ctrl += `<p class="gs-p"><b>${esc(t.pl[S.pin])}</b>: ${esc(t.askSame)}</p><div class="chips">${chip('guess', 'same', 0, t.same, 'gs-big')}${chip('guess', 'diff', 0, t.diff, 'gs-big')}</div>`;
    else ctrl += `<p class="gs-p">${esc(t.tapPin)}</p>`;
    if (!S.pin) st = { emo: '🌍', title: t.st0[0], lead: t.st0[1] };
    else if (!seen) st = { emo: '📍', title: t.pl[S.pin], lead: t.askSame };
    else { const ok = (seen === 'same') === isSame, all = GEST[S.g].pins.every((c) => S.seen[`${S.g}:${c}`]);
      st = { emo: ok ? '✅' : '😲', title: ok ? t.right : t.surprise, lead: t.say[S.g][S.pin][2], body: (isSame ? t.noStamp : t.newStamp) + (all ? ' ' + t.tryOther : '') }; }
    lab.setReadout(`🛂 ${stampsOf()}`, t.stampsSub, t.g[S.g][0], '#2f8fb0');
  } else if (v === 'faces') {
    facts = t.facts.faces; stage = stFaces(t);
    ctrl += `<div class="chips">${chip('fp', 0, S.fp === 0, t.f.stepA)}${chip('fp', 1, S.fp === 1, t.f.stepB)}</div><div style="height:10px"></div>`;
    if (S.fp === 0) {
      const used = Object.values(S.asg), cnt = used.length, hits = FO.filter((f) => S.asg[f] === f).length;
      ctrl += `<p class="gs-p">${esc(t.f.tap)}</p><div class="chips">${WO.map((w) => chip('w', w, S.selw === w, esc(t.fc[w]) + (used.includes(w) ? ' ✓' : ''), `${used.includes(w) ? 'used' : ''}`).replace('<button', S.fchk ? '<button disabled' : '<button')).join('')}</div>`;
      ctrl += `<div class="row2">${S.fchk ? `<button class="btn" data-act="fagain">${t.f.again}</button><button class="btn ghost" data-act="fp" data-k="1">${t.f.next}</button>` : `<button class="btn" data-act="fcheck" ${cnt < 6 ? 'disabled style="opacity:.4"' : ''}>${t.f.check}</button>`}</div>`;
      st = S.fchk ? { emo: hits === 6 ? '✅' : '🙂', title: hits === 6 ? t.right : t.f.hit(hits), lead: hits === 6 ? t.f.all : t.f.hitLead, body: t.f.culture } : { emo: '😊', title: t.f.t0[0], lead: t.f.t0[1] };
      lab.setReadout(S.fchk ? `${hits}/6` : `${cnt}/6`, '', t.views.faces.replace(/^\S+\s/, ''), '#e0a22c');
    } else {
      const act = S.rs[0] == null ? 0 : S.rs[1] == null ? 1 : 2;
      ctrl += `<p class="gs-p">${esc(t.f.intro)}</p>`;
      if (act < 2) ctrl += `<p class="gs-p"><b>${esc(act ? t.f.q1 : t.f.q0)}</b></p>` + ['scared', 'calm', 'angry'].map((e) => `<button class="gs-opt" data-act="rule" data-k="${e}">${miniFace(e)}${esc(t.fc[e])}</button>`).join('');
      else ctrl += `<div class="row2"><button class="btn" data-act="ragain">${t.d.again}</button></div>`;
      const last = act === 2 ? 1 : act - 1;
      if (act === 0) st = { emo: '🎬', title: t.f.r0[0], lead: t.f.r0[1] };
      else { const ok = S.rs[last] === (last ? 'calm' : 'scared');
        st = act === 2 ? { emo: '🎭', title: t.f.rEnd[0], lead: t.f.rB, body: t.f.rEnd[1] } : { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.surprise, lead: t.f.rA }; }
      lab.setReadout(`${act === 2 ? 2 : act}/2`, '', t.f.stepB.replace(/^\S+\s/, ''), '#8a62d6');
    }
  } else if (v === 'doubt') {
    facts = t.facts.doubt; stage = stDoubt(t);
    if (S.r >= 3) { ctrl += `<div class="row2" style="margin-top:0"><button class="btn" data-act="dagain">${t.d.again}</button></div>`; st = { emo: '🤝', title: t.d.end[0], lead: t.d.end[1] }; }
    else {
      const rd = t.d.rounds[S.r], pk = S.rpick[S.r];
      ctrl += `<p class="gs-p"><b>${esc(t.d.round(S.r + 1))}.</b> ${esc(rd.q)}</p>` + rd.o.map(([ty, tx], i) => `<button class="gs-opt ${pk != null ? (ty === 'ask' ? 'ok' : i === pk ? 'bad' : '') : ''}" data-act="pick" data-k="${i}" ${pk != null ? 'disabled' : ''}>${esc(tx)}</button>`).join('');
      if (pk != null) ctrl += `<div class="row2"><button class="btn" data-act="dnext">${t.d.next}</button></div>`;
      if (pk == null) st = { emo: '🤔', title: t.d.round(S.r + 1), lead: rd.q };
      else { const ok = rd.o[pk][0] === 'ask'; st = { emo: ok ? '😊' : '😕', title: ok ? t.d.right : t.d.notbest, lead: rd.fb[rd.o[pk][0]], body: ok ? '' : rd.fb.ask }; }
    }
    lab.setReadout(`${roundsDone()}/3`, '', t.views.doubt.replace(/^\S+\s/, ''), '#e0574a');
  } else if (v === 'fingers') {
    stage = stFingers(t);
    ctrl += `<div class="chips">${[1, 2, 3].map((n) => chip('n', n, S.n === n, String(n), 'gs-big')).join('')}</div>`;
    const a = [0, 1, 2].slice(0, S.n).map((i) => t.fx.names[i]).join(', '), b = [1, 2, 3].slice(0, S.n).map((i) => t.fx.names[i]).join(', ');
    st = { emo: '🖐️', title: t.fx.title(S.n), lead: t.fx.lead(a, b), body: t.fx.body }; lab.setReadout(String(S.n), t.fx.sub, t.fx.pill, '#e0a22c');
  } else {
    stage = stHello(t);
    ctrl += `<div class="chips">${['bow', 'hand', 'cheek'].map((k) => chip('hl', k, S.greet === k, t.hl[k][0], 'gs-big')).join('')}</div>`;
    st = { emo: '👋', title: t.hl[S.greet][2], lead: t.hl[S.greet][3] }; lab.setReadout(t.hl[S.greet][1], '', '', '#3ddc97');
  }
  const sc = (k, emo) => `<button type="button" class="chip secret ${un ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${un ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  ctrl += `<div class="row2">${sc('fingers', '🖐️')}${sc('hello', '👋')}</div>`;
  $('overlay').innerHTML = stage; $('ctrlBody').innerHTML = ctrl;
  lab.setState({ body: '', extra: '', ...st }); lab.setFacts(S.sec ? [] : facts);
}

$('overlay').addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  if (el.dataset.a === 'pin') { S.pin = el.dataset.k; sfx.click(); render(); }
  else if (el.dataset.a === 'face' && S.fp === 0 && !S.fchk) {
    const f = el.dataset.k;
    if (S.selw) { for (const k of Object.keys(S.asg)) if (S.asg[k] === S.selw) delete S.asg[k]; S.asg[f] = S.selw; S.selw = null; sfx.snap(); }
    else if (S.asg[f]) { delete S.asg[f]; sfx.tick(); }
    render();
  }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === k ? null : k; sfx.click(); }
  else if (a === 'g') { S.g = k; S.pin = null; sfx.click(); }
  else if (a === 'guess') {
    const key = `${S.g}:${S.pin}`; S.seen[key] = k; const ok = (k === 'same') === GEST[S.g].same.includes(S.pin); (ok ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  else if (a === 'fp') { S.fp = +k; sfx.click(); }
  else if (a === 'w') { S.selw = S.selw === k ? null : k; const f = Object.keys(S.asg).find((x) => S.asg[x] === k); if (f && !S.selw) delete S.asg[f]; sfx.tick(); }
  else if (a === 'fcheck') { S.fchk = true; FO.every((f) => S.asg[f] === f) ? sfx.good() : sfx.bad(); render(); showStage(); return; }
  else if (a === 'fagain') { S.asg = {}; S.selw = null; S.fchk = false; sfx.click(); }
  else if (a === 'rule') { const i = S.rs[0] == null ? 0 : 1; S.rs[i] = k; (k === (i ? 'calm' : 'scared') ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  else if (a === 'ragain') { S.rs = [null, null]; sfx.click(); }
  else if (a === 'pick') { S.rpick[S.r] = +k; (T[lang].d.rounds[S.r].o[+k][0] === 'ask' ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  else if (a === 'dnext') { S.r++; sfx.click(); }
  else if (a === 'dagain') { S.r = 0; S.rpick = [null, null, null]; sfx.click(); }
  else if (a === 'n') { S.n = +k; sfx.tick(); }
  else if (a === 'hl') { S.greet = k; sfx.click(); }
  render();
});
render();
</script>
</body>
</html>
