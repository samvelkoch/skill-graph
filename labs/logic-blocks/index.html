const QS = [{ k: 'c', v: 0 }, { k: 'c', v: 1 }, { k: 'c', v: 2 }, { k: 'c', v: 3 }, { k: 's', v: 0 }, { k: 's', v: 1 }, { k: 's', v: 2 }, { k: 'z', v: 0 }, { k: 'z', v: 1 }, { k: 'h', v: 1 }, { k: 'h', v: 0 }];

function hdAsk(qi) {

}

  $('shChips').innerHTML = ['paint', 'size', 'hole', 'turn', 'cut', 'bend'].map((k) => `<button class="lb-chip" data-act="ch" data-k="${k}"${asking ? ' disabled' : ''}>${esc(chLabel(t, k))}</button>`).join('');
  const [sd, cn] = SIDES[SH.shape][SH.mod];
  if (asking) lab.setReadout('?', t.sh.sub, '', '#f5c518'); else lab.setReadout(`${sd} / ${cn}`, t.sh.sub, '', '#f5c518');
  if (asking) lab.setState({ emo: '🧺', title: t.sh.q(n), lead: t.sh.asking(chLabel(t, SH.pending).toLowerCase()), body: '' });
  else if (SH.res) lab.setState({ emo: SH.res.ok ? '✅' : '🤔', title: SH.res.ok ? t.right : t.notq, lead: shLabel(t), body: t.sh.expl[SH.shape][SH.mod] });
  else lab.setState({ emo: '🔺', title: t.sh.titles[SH.shape], lead: t.sh.idleL(n), body: '' });
}
function renderHide(t) {
  const ph = HD.phase, n = cur(), pred = ph === 'pred', last = HD.last;
  lab.setGlow('rgba(34, 165, 91, .22)');
  $('hdQ').innerHTML = pred ? `<div class="lb-q">${esc(t.hd.askT(t.hd.qs[HD.q]))} ${esc(t.hd.predL)}</div><div class="lb-opts">${HD.opts.map((o) => `<button class="lb-opt" data-act="num" data-n="${o}">${o}</button>`).join('')}</div>` : '';
  $('hdChips').innerHTML = S.all ? '' : QS.map((q, i) => {
    const dis = ph !== 'ask' || yesCount(i) === 0 || yesCount(i) === n;
    return `<button class="lb-chip" data-act="q" data-i="${i}"${dis ? ' disabled' : ''}>${q.k === 'c' ? `<span class="lb-dot" style="background:${PAL[q.v].base}"></span>` : ''}${esc(t.hd.qs[i])}</button>`;
  }).join('');
  $('hdBtns').innerHTML = S.all ? '' : `<button class="lb-b${ph === 'found' ? ' main' : ''}" data-act="hnew">${esc(t.hd.newGame)}</button>`;
  if (S.all) {
    lab.setReadout('4 × 3 × 2 × 2 = 48', '', '', '#22a55b');
    lab.setState({ emo: '🧮', title: t.secrets.a[0], lead: t.secrets.a[1], body: '' });
    return;
  }
  const chain = HD.chain.length > 5 ? `… → ${HD.chain.slice(-4).join(' → ')}` : HD.chain.join(' → ');
  lab.setReadout(chain, `${t.hd.poss} · ${t.hd.qn}: ${HD.qn}`, '', '#22a55b');
  if (pred) lab.setState({ emo: '🕵️', title: t.hd.askT(t.hd.qs[HD.q]), lead: t.hd.predL, body: '' });
  else if (ph === 'found') lab.setState({ emo: '🎉', title: t.hd.foundT(HD.qn), lead: t.hd.foundL, body: t.hd.foundB });
  else if (last) lab.setState({ emo: last.ok ? '✅' : '🤔', title: last.ok ? t.right : t.notq, lead: t.hd.resL(last.yes, last.res), body: t.hd.resB(last.cy, last.cn) });
  else lab.setState({ emo: '🕵️', title: t.hd.title, lead: t.hd.lead, body: t.hd.body });
}

newTrain(); newHide();
render();
</script>
