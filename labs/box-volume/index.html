  c.strokeStyle = 'rgba(40,70,110,.7)'; c.lineWidth = 1.6; poly(c, lf); c.stroke(); poly(c, rf); c.stroke(); poly(c, tp); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 3; c.beginPath(); const hl = P(0.8, n, n - 0.6), hl2 = P(0.8, n, n - 3); c.moveTo(hl[0], hl[1]); c.lineTo(hl2[0], hl2[1]); c.stroke();
  // edge labels
  const m1 = P(n / 2, n, 0), m2 = P(n, n / 2, 0), m3 = P(n, n, n / 2);
  pill(c, t.cm(10), m1[0] - 26, m1[1] + 14); pill(c, t.cm(10), m2[0] + 26, m2[1] + 14); pill(c, t.cm(10), m3[0] + 34, m3[1]);
  // the jug
  const tilt = -0.95 * sm(0.2, 0.9, T0) * (1 - sm(4.6, 5.3, T0)), jk = clamp(Math.min(W, H) / 330, 0.8, 1.3);
  const px = W * 0.8, py = H * 0.2, ca = Math.cos(tilt), sa = Math.sin(tilt);
  const spout = [px + (-40 * ca + 44 * sa) * jk, py + (-40 * sa - 44 * ca) * jk];
  const tgt = P(n / 2, n / 2, Math.max(zw, 0.01));
  const pouring = T0 > 0.9 && T0 < 4.5;
  if (pouring) {
    c.lineCap = 'round';
    const a = sm(0.9, 1.1, T0) * (1 - sm(4.3, 4.5, T0));
    c.globalAlpha = a; c.strokeStyle = 'rgba(100,175,245,.95)'; c.lineWidth = 6 * jk;
    c.beginPath(); c.moveTo(spout[0], spout[1]); c.bezierCurveTo(spout[0] - 22 * jk, spout[1] + 4, tgt[0] + 6, spout[1] + 26, tgt[0], tgt[1]); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.6 * jk; c.stroke(); c.globalAlpha = 1;
  }
  c.save(); c.translate(px, py); c.rotate(tilt); c.scale(jk, jk);
  const body = () => { c.beginPath(); c.roundRect(-28, -37, 56, 74, 12); };
  c.fillStyle = 'rgba(80,52,18,.1)'; c.beginPath(); c.ellipse(4, 44, 34, 6, 0, 0, PI * 2); c.fill();
  c.strokeStyle = 'rgba(60,90,130,.9)'; c.lineWidth = 6; c.beginPath(); c.arc(30, -2, 17, -1.35, 1.35); c.stroke();
  const jg = c.createLinearGradient(-28, -37, 28, 37); jg.addColorStop(0, 'rgba(255,255,255,.85)'); jg.addColorStop(1, 'rgba(205,225,245,.8)');
  c.fillStyle = jg; body(); c.fill();
  c.beginPath(); c.moveTo(-28, -37); c.lineTo(-40, -44); c.lineTo(-28, -26); c.closePath(); c.fillStyle = 'rgba(235,245,255,.95)'; c.fill();
  c.save(); body(); c.clip(); c.rotate(-tilt);
  const rem = 1 - lvl, wy = 36 - 70 * rem; c.fillStyle = 'rgba(70,150,235,.85)'; c.fillRect(-90, wy, 180, 160);
  c.fillStyle = 'rgba(190,225,255,.9)'; c.fillRect(-90, wy, 180, 3); c.restore();
  c.strokeStyle = 'rgba(50,80,120,.9)'; c.lineWidth = 2; body(); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; c.beginPath(); c.moveTo(-20, -28); c.lineTo(-20, 8); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.95)'; c.beginPath(); c.roundRect(-20, -8, 40, 22, 8); c.fill(); c.strokeStyle = 'rgba(50,80,120,.7)'; c.lineWidth = 1; c.stroke();
  c.fillStyle = '#1d3a63'; c.font = '900 14px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t.lt.jug, 0, 4);
  c.restore();
  pill(c, lvl >= 0.999 ? `${Math.round(lvl * 1000)} ${t.cm3} = 1 ${t.litre}` : `${Math.round(lvl * 1000)} ${t.cm3}`, W * 0.42, 22, { f: '800 14px Nunito, sans-serif', h: 26 });
}

// 8 blocks of 2 x 2 x 2 fill a 4 x 4 x 4 box
const DBL = (() => {
  const cubes = [];
  for (let b = 0; b < 8; b++) {
    const bx = b & 1, by = (b >> 1) & 1, bz = b >> 2;
    for (let k = 0; k < 2; k++) for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++)
      cubes.push({ x: bx * 2 + i, y: by * 2 + j, z: bz * 2 + k, b, at: 1.0 + b * 0.75 + (i + j + k) * 0.03 });
  }
  cubes.sort((p, q) => (p.x + p.y) - (q.x + q.y) || p.z - q.z);
  return { cubes, end: 1.0 + 7 * 0.75 + 0.9 };
})();
const dblLanded = (T0) => { let m = 0; for (let b = 0; b < 8; b++) if (1.0 + b * 0.75 + 0.6 <= T0) m++; return m; };
function sceneDouble(c, W, H, dt, time) {
  const T0 = time - S.secT0, t = T[lang], wu = unitW(2, 2), wb = unitW(4, 4);
  const s = smooth('d', Math.min(W * 0.94 / (wu + wb), H * 0.86 / unitH(4, 4, 4), 40), dt), left = (W - s * (wu + wb)) / 2;
  const cur = Math.min(7, Math.max(0, Math.floor((T0 - 0.4) / 0.75)));
  drawBox(c, { l: 2, w: 2, h: 2, cx: left + wu * s / 2, cy: H * 0.27, s, e: 1, labels: false,
    cubes: (cc, P) => { for (let k = 0; k < 2; k++) for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) cube(cc, P, i, j, k, CUBE[cur]); } });
  pill(c, t.db.ref, left + wu * s / 2, H * 0.27 + unitH(2, 2, 2) * s / 2 + 18);
  drawBox(c, { l: 4, w: 4, h: 4, cx: left + wu * s + wb * s / 2, cy: H * 0.56, s, e: 1, labels: false,
    cubes: (cc, P) => {
      for (const q of DBL.cubes) {
        const p = (T0 - q.at) / 0.5; if (p <= 0) continue;
        const pp = Math.min(1, p); cube(cc, P, q.x, q.y, q.z + dropOff(pp, 4), CUBE[q.b], Math.min(1, pp * 5));
      }
    } });
  const m = dblLanded(T0);
  pill(c, T0 > DBL.end ? '8 → 64' : `${m} × 8 = ${8 * m}`, left + wu * s + wb * s / 2, 22, { f: '800 14px Nunito, sans-serif', h: 26 });
}

canvasLoop($('cv'), (c, W, H, dt, time) => {
  CW = W; CH = H;
  table(c, W, H);
  const v = S.sec || lab.view;
  if (v === 'litre') sceneLitre(c, W, H, dt, time);
  else if (v === 'dbl') sceneDouble(c, W, H, dt, time);
  else if (v === 'pack') scenePack(c, W, H, dt, time);
  else if (v === 'layers') sceneLayers(c, W, H, dt, time);
  else sceneSame(c, W, H, dt, time);
  // refresh the readout and the state card when something moves on
  let key;
  if (v === 'litre') key = `l${Math.round(c01((time - S.secT0 - 0.9) / 3.6) * 40)}`;
  else if (v === 'dbl') key = `d${dblLanded(time - S.secT0)}${time - S.secT0 > DBL.end}`;
  else if (v === 'pack') { const i = p1Info(); key = `p${i.phase}${i.e}${i.line}`; }
  else if (v === 'same') { const i = p3Info(); key = `s${i.phase}${i.ea}${i.eb}`; }
  else key = 'y';
  if (key !== S.dyn) { S.dyn = key; render(); }
});

// --- controls ------------------------------------------------------------------------------------------------
const nowS = () => performance.now() / 1000;
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const resetPack = () => { S.phase = 'guess'; S.pack = null; S.guess = null; S.edge = false; };
const setK = (k) => {
  const n = clamp(k, 1, H2);
  if (n === S.k) return;
  S.delta = (n - S.k) * S.l2 * S.w2; S.k = n; S.slabAt = nowS(); sfx.tick();
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-d]'); if (!b) return;
  const act = b.dataset.act;
  if (b.dataset.d) {
    const key = b.dataset.d, max = key === 'l2' || key === 'w2' ? 4 : 6, n = clamp(S[key] + +b.dataset.s, 1, max);
    if (n === S[key]) return;
    S[key] = n; sfx.tick();
    if (key === 'l2' || key === 'w2') { S.delta = 0; S.slabAt = -9; } else resetPack();
  } else if (act === 'gdec') S.guess = clamp((S.guess ?? 0) - 1, 0, 999);
  else if (act === 'ginc') S.guess = clamp((S.guess ?? 0) + 1, 0, 999);
  else if (act === 'open') {
    if (S.guess === null) return;
    const n = S.l * S.w * S.h;
    S.edge = S.guess === S.l + S.w + S.h && S.guess !== n;
    S.pack = buildPack(S.l, S.w, S.h, 'rows', S.edge ? 3.0 : 0.9); S.phase = 'run'; S.t0 = nowS(); sfx.click(); showStage();
  } else if (act === 'new') {
    let a, b2, c2;
    do { a = 2 + Math.floor(Math.random() * 4); b2 = 2 + Math.floor(Math.random() * 4); c2 = 1 + Math.floor(Math.random() * 4); } while (a === S.l && b2 === S.w && c2 === S.h);
    S.l = a; S.w = b2; S.h = c2; resetPack(); sfx.click();
  } else if (act === 'kdec') setK(S.k - 1);
  else if (act === 'kinc') setK(S.k + 1);
  else if (act === 'pick') {
    if (S.p3) return;
    const [A, B] = PAIRS[S.pi], pk = (d, delay) => buildPack(d[0], d[1], d[2], 'slabs', delay);
    const a = pk(A, 0.9), bb = pk(B, 0.9);
    S.pg = +b.dataset.i; S.p3 = { A: a, B: bb, t0: nowS(), end: Math.max(a.end, bb.end) };
    const na = A[0] * A[1] * A[2], nb = B[0] * B[1] * B[2];
    (S.pg === (na === nb ? 2 : na > nb ? 0 : 1) ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next') { S.pi = (S.pi + 1) % PAIRS.length; S.p3 = null; S.pg = null; S.e3 = 0; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.secT0 = nowS(); sfx.click();
  } else if (act === 'replay') { S.secT0 = nowS(); sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'gi') { S.guess = ev.target.value === '' ? null : clamp(Math.round(+ev.target.value), 0, 999); render(); }
  else if (ev.target.id === 'kr') { setK(+ev.target.value); render(); }
});
$('ctrlBody').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.id === 'gi') { ev.preventDefault(); $('pOpen').click(); } });

// --- render: controls, readout, state card and facts ---------------------------------------------------------
const ACC = '#d6a05a';
function steppers(keys, labels, max) {
  return keys.map((k, i) => `<div class="bv-stp"><span class="bv-lbl">${esc(labels[i])}</span><div class="bv-row">
    <button class="bv-sb" data-d="${k}" data-s="-1" aria-label="−"${S[k] <= 1 ? ' disabled' : ''}>−</button><b>${S[k]}</b>
    <button class="bv-sb" data-d="${k}" data-s="1" aria-label="+"${S[k] >= max ? ' disabled' : ''}>+</button></div></div>`).join('');
}
function render() {
  const t = T[lang], view = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : view;
  $('sP').style.display = !sec && view === 'pack' ? '' : 'none';
  $('sL').style.display = !sec && view === 'layers' ? '' : 'none';
  $('sS').style.display = !sec && view === 'same' ? '' : 'none';
  const open = secret.unlocked(), sc = (k, emo) => `<button class="bv-c secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('litre', '🥛') + sc('dbl', '⏫') + (sec ? `<button class="bv-c" data-act="replay">${esc(sec === 'litre' ? t.lt.replay : t.db.replay)}</button>` : '');
  if (sec) roSec(t); else if (view === 'pack') renderPack(t); else if (view === 'layers') renderLayers(t); else renderSame(t);
  lab.setFacts([{ emo: sec ? (sec === 'litre' ? '🥛' : '⏫') : { pack: '🥛', layers: '🔤', same: '🚢' }[view], text: t.facts[sec ? { litre: 'pack', dbl: 'same' }[sec] : view][0], src: t.facts[sec ? { litre: 'pack', dbl: 'same' }[sec] : view][1] }]);
}
function renderPack(t) {
  const { l, w, h } = S, n = l * w * h, L = l * w, p = t.pk, info = p1Info(), g = S.guess;
  $('pSteps').innerHTML = steppers(['l', 'w', 'h'], t.dims, 6);
  const guessing = info.phase === 'guess';
  $('pGuess').style.display = guessing ? '' : 'none';
  $('pAgain').style.display = guessing ? 'none' : '';
  const gi = $('gi'), gv = g === null ? '' : String(g);
  if (gi.value !== gv) gi.value = gv;
  gi.setAttribute('aria-label', p.aria); gi.placeholder = '?';
  $('pOpen').textContent = p.open; $('pOpen').disabled = g === null; $('pNew').textContent = p.again;
  lab.setGlow('rgba(214, 160, 90, .26)');
  if (guessing) {
    lab.setReadout('?', `${l} × ${w} × ${h} cm`, '', ACC);
    lab.setState({ emo: '📦', title: p.q, lead: p.lead, body: '', extra: '' });
  } else if (info.phase === 'run') {
    if (info.line) {
      lab.setReadout(`${l} + ${w} + ${h} = ${l + w + h}`, '', '', ACC);
      lab.setState({ emo: '🤔', title: p.edgeT, lead: p.edgeL(l, w, h, l + w + h), body: '', extra: '' });
    } else {
      lab.setReadout(info.ev ? String(info.ev.n) : '0', t.cm3, '', ACC);
      lab.setState({ emo: '📦', title: p.filling, lead: info.ev ? evLabel(t, info.ev) : '', body: '', extra: '' });
    }
  } else {
    lab.setReadout(`${l} × ${w} × ${h} = ${n}`, t.cm3, '', ACC);
    const line = p.line(l, w, h, L, n);
    if (g === n) lab.setState({ emo: '✅', title: p.right, lead: line, body: '', extra: '' });
    else if (g === l + w + h) lab.setState({ emo: '🤔', title: p.edgeT, lead: line, body: '', extra: '' });
    else lab.setState({ emo: '🤔', title: p.wrong(g, n), lead: line, body: '', extra: '' });
  }
}
function renderLayers(t) {
  const { l2: l, w2: w, k } = S, L = l * w, y = t.ly;
  $('lSteps').innerHTML = steppers(['l2', 'w2'], t.dims, 4);
  const kr = $('kr'); if (kr.value !== String(k)) kr.value = k;
  kr.setAttribute('aria-label', y.layers); $('kv').textContent = k;
  $('sP').style.display = 'none';
  document.querySelector('#sL [data-act=kdec]').disabled = k <= 1; document.querySelector('#sL [data-act=kinc]').disabled = k >= H2;
  lab.setGlow('rgba(232, 176, 74, .24)');
  lab.setReadout(`${L} × ${k} = ${L * k}`, y.per, '', '#e8b04a');
  if (S.delta === 0) lab.setState({ emo: '🧱', title: y.q, lead: y.lead, body: '', extra: '' });
  else lab.setState({ emo: '🧱', title: y.delta(S.delta), lead: y.dl(l, w, L), body: '', extra: '' });
}
function renderSame(t) {
  const s = t.sm, [A, B] = PAIRS[S.pi], na = A[0] * A[1] * A[2], nb = B[0] * B[1] * B[2], win = na === nb ? 2 : na > nb ? 0 : 1, info = p3Info();
  const rev = !!S.p3;
  $('sChoice').innerHTML = [s.A, s.B, s.same].map((o, i) => `<button class="bv-ch ${S.pg === i ? 'pick' : ''} ${rev ? (i === win ? 'good' : i === S.pg ? 'bad' : '') : ''}" data-act="pick" data-i="${i}"${rev ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  $('sNextRow').style.display = rev ? '' : 'none'; $('sNext').textContent = s.next;
  lab.setGlow('rgba(110, 140, 215, .26)');
  if (!rev) {
    lab.setReadout('?', 'A · B', '', '#7b8fd8');
    lab.setState({ emo: '⚖️', title: s.q, lead: s.lead, body: '', extra: '' });
  } else if (info.phase === 'run') {
    const ta = info.ea >= 0 ? S.p3.A.ev[info.ea].n : 0, tb = info.eb >= 0 ? S.p3.B.ev[info.eb].n : 0;
    lab.setReadout(`${ta} · ${tb}`, `A · B (${t.cm3})`, '', '#7b8fd8');
    lab.setState({ emo: '⚖️', title: s.run, lead: '', body: '', extra: '' });
  } else {
    lab.setReadout(`${na} · ${nb}`, `A · B (${t.cm3})`, '', '#7b8fd8');
    const ok = S.pg === win, eq = (d) => `${d[0]} × ${d[1]} × ${d[2]}`;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? s.right : s.wrong, lead: na === nb ? s.eq(na) : s.more(na > nb ? 'A' : 'B', na, nb), body: `A: ${eq(A)} = ${na} · B: ${eq(B)} = ${nb}`, extra: '' });
  }
}
function roSec(t) {
  const T0 = nowS() - S.secT0;
  if (S.sec === 'litre') {
    const lvl = ease(c01((T0 - 0.9) / 3.6)), ml = Math.round(lvl * 1000);
    lab.setGlow('rgba(80, 150, 230, .3)');
    lab.setReadout(lvl >= 0.999 ? `1000 ${t.cm3} = 1 ${t.litre}` : `${ml} ${t.cm3}`, '', '', '#4f9be0');
    lab.setState(lvl >= 0.999 ? { emo: '🥛', title: t.lt.title, lead: t.lt.lead, body: '', extra: '' } : { emo: '🥛', title: t.lt.run, lead: t.lt.runL, body: '', extra: '' });
  } else {
    const m = dblLanded(T0), done = T0 > DBL.end;
    lab.setGlow('rgba(180, 138, 224, .3)');
    lab.setReadout(done ? '8 → 64' : `${8 * m}`, done ? '' : `${m} × 8`, '', '#b48ae0');
    lab.setState(done ? { emo: '⏫', title: t.db.title, lead: t.db.endL, body: '', extra: '' } : { emo: '⏫', title: t.db.run, lead: m ? t.db.lead(m) : '', body: '', extra: '' });
  }
}
render();
</script>
