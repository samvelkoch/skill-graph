}

// --- one step of the model and the particles (strands, cubes, acids, vitamins, the visitor) ------------------
function step(dt, G, time) {
  const v = lab.view, gated = v !== 'fibre' && S.p1 === null;
  S.light += clamp((S.p1 !== null ? 1 : 0) - S.light, -dt / 0.9, dt / 0.9);
  if (v === 'diet' && S.playing2 && S.p2 !== null) {
    const dw = Math.min(dt * 1.5, S.until - S.wk);
    if (dw > 0) {
      S.wk += dw; S.fEff += (fNow() - S.fEff) * (1 - Math.exp(-0.43 * dw));
      while (S.hist.length * 0.2 <= S.wk) S.hist.push(varietyOf(S.fEff));
      S.minV = Math.min(S.minV, varietyOf(S.fEff));
    }
    if (S.wk >= S.until - 1e-6) { S.playing2 = false; render(); }
  }
  if (v === 'pills' && S.playing3 && S.p3 !== null) {
    S.day = Math.min(DAYS, S.day + dt * 7); S.dayMax = Math.max(S.dayMax, S.day);
    $('r3').value = S.day;
    if (S.day >= DAYS) { S.playing3 = false; render(); }
  }
  if (S.sec === 'free' && v === 'fibre' && S.hGrow >= 1) S.hGrow = Math.min(N, S.hGrow + dt * 5);
  // plots fade between kinds
  const want = wantCounts(), tt = targets(want);
  live.fill(0);
  for (let k = 0; k < N; k++) {
    const sl = slots[k];
    if (sl.type !== tt[k]) { sl.s -= dt / 0.35; if (sl.s <= 0) { sl.s = 0; sl.type = tt[k]; } }
    else if (sl.s < 1) sl.s = Math.min(1, sl.s + dt / 0.45);
    if (sl.type >= 0) live[sl.type] += sl.s;
  }
  // food arrives from the left
  const fn = fNow();
  let rf = 0.9, rs = 0.28;
  if (v === 'fibre') rf = lerp(0, 1.4, S.fib / 100);
  else if (v === 'diet') { rf = 0.1 + 1.5 * fn; rs = 0.08 + 1.3 * (1 - fn); }
  if (S.sec === 'free' && v === 'fibre') rs = 0;
  S.t += dt;
  const coreTop = G.yt + 40, coreBot = G.yb - 40;
  const spawn = (kind, rate) => {
    if (rate <= 0 || (kind === 'sug' && S.light < 0.5)) return;
    S['a' + kind] = (S['a' + kind] || 0) + rate * dt;
    while (S['a' + kind] >= 1) {
      S['a' + kind] -= 1;
      parts.push({ k: kind, x: -34, y: lerp(coreTop, Math.max(coreTop + 4, coreBot), lcg()), vx: 34 + lcg() * 10, len: 28 + lcg() * 18, ph: lcg() * 6.28, eat: 0, acc: 0, ang: lcg() * 6.28 });
    }
  };
  if (!gated || v === 'fibre') { spawn('fib', rf); spawn('sug', rs); }
  const eatF = 0.2 * clamp(live[0] / 20, 0, 1.6) * S.light, eatS = 0.3 * clamp(live[2] / 10, 0, 1.6) * S.light;
  // vitamins drift out of the vitamin makers
  if (S.light > 0.5 && live[1] > 1) {
    S.avit = (S.avit || 0) + dt * 0.7 * live[1] / 14;
    while (S.avit >= 1) {
      S.avit -= 1;
      const cand = []; for (let k = 0; k < N; k++) if (slots[k].type === 1 && slots[k].s > 0.8) cand.push(k);
      if (cand.length) { const k = cand[Math.floor(lcg() * cand.length)], p = G.pos[k]; parts.push({ k: 'vit', x: p.x, y: p.y, side: p.y < G.cy ? -1 : 1, ph: lcg() * 6.28 }); }
    }
  }
  for (const p of parts) {
    if (p.k === 'fib' || p.k === 'sug') {
      p.x += p.vx * dt; p.y += Math.sin(time * 0.8 + p.ph) * 6 * dt;
      const de = (p.k === 'fib' ? eatF : eatS) * dt;
      p.eat += de;
      if (p.k === 'fib' && S.light > 0.5) {
        p.acc += de;
        while (p.acc > 0.2) { p.acc -= 0.2; parts.push({ k: 'acid', x: p.x + p.len * 0.5 * (1 - p.eat), y: p.y, side: p.y < G.cy ? -1 : 1, ph: lcg() * 6.28 }); }
      }
      if (p.eat >= 1 || p.x > G.w + 50) p.dead = true;
    } else if (p.k === 'acid' || p.k === 'vit') {
      p.y += p.side * (p.k === 'acid' ? 26 : 18) * dt; p.x += Math.sin(time * 2 + p.ph) * 8 * dt;
      const edge = p.side < 0 ? G.top(p.x) : G.bot(p.x);
      if ((p.side < 0 && p.y <= edge + 3) || (p.side > 0 && p.y >= edge - 3)) {
        p.dead = true; if (p.k === 'acid') S.acid++; else S.vit++;
        S.glows.push({ x: p.x, y: edge, side: p.side, t: 0, vit: p.k === 'vit' });
      }
    }
  }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].dead) parts.splice(i, 1);
  for (let i = S.glows.length - 1; i >= 0; i--) { S.glows[i].t += dt; if (S.glows[i].t > 0.7) S.glows.splice(i, 1); }
  // the visitor (secret): a harmful germ looks for a free plot
  const vs = S.vis;
  if (vs) {
    if (vs.ph === 'in') { vs.x += 90 * dt; if (vs.x > G.w * 0.4) { vs.ph = 'look'; vs.t = 0; } }
    else if (vs.ph === 'look') {
      vs.t += dt; vs.y = G.cy + Math.sin(vs.t * 3.2) * 34;
      if (vs.t > 1.7) {
        if (N - sum(want) >= 12) { S.hGrow = Math.max(S.hGrow, 1); S.vis = null; S.vmsg = 'settled'; S.sig = ''; }
        else { vs.ph = 'out'; S.vmsg = 'out'; S.sig = ''; }
      }
    } else if (vs.ph === 'out') { vs.x += 70 * dt; vs.a -= dt * 0.45; if (vs.a <= 0) S.vis = null; }
  }
}

// --- scene: the cut-away of the large intestine ----------------------------------------------------------------
function drawScene(c, G, time) {
  const { w, sh, yt, yb, amp, top, bot, r } = G, L = S.light;
  c.save(); c.beginPath(); c.rect(0, 0, w, sh); c.clip();

  g.addColorStop(0, '#3a1228'); g.addColorStop(0.28, '#8a3a58'); g.addColorStop(0.5, '#a8506d'); g.addColorStop(0.72, '#8a3a58'); g.addColorStop(1, '#3a1228');

    c.beginPath();
    for (let x = 0; x <= w; x += 3) { const y = top(x); if (x === 0) c.moveTo(x, y); else c.lineTo(x, y); }
    for (let x = w; x >= 0; x -= 3) c.lineTo(x, bot(x));

  };
  lumen(); c.lineJoin = 'round'; c.strokeStyle = 'rgba(240,150,178,.45)'; c.lineWidth = 9; c.stroke();
  c.fillStyle = '#0c0a12'; c.fill();
  if (L > 0.01) {
    g = c.createLinearGradient(0, yt - amp, 0, yb + amp);
    g.addColorStop(0, '#4a2b26'); g.addColorStop(0.5, '#6a4632'); g.addColorStop(1, '#4a2b26');
    c.globalAlpha = L; c.fillStyle = g; c.fill();
    g = c.createRadialGradient(w / 2, G.cy, 10, w / 2, G.cy, w * 0.55); g.addColorStop(0, 'rgba(255,214,140,.28)'); g.addColorStop(1, 'rgba(255,214,140,0)');
    c.fillStyle = g; c.fill(); c.globalAlpha = 1;
  }
  c.save(); lumen(); c.clip();
  // plots: free ones show as faint dotted rings
  if (L > 0.02) {
    c.setLineDash([2, 3]); c.lineWidth = 1.2;
    for (let k = 0; k < N; k++) {
      const sl = slots[k]; if (sl.type !== -1) continue;
      c.strokeStyle = `rgba(255,236,210,${0.34 * L * sl.s})`; c.beginPath(); c.arc(G.pos[k].x, G.pos[k].y, Math.max(0, r * 0.8), 0, 6.283); c.stroke();
    }
    c.setLineDash([]);
    for (let k = 0; k < N; k++) { const sl = slots[k]; if (sl.type >= 0) { c.globalAlpha = L; microbe(c, sl.type, G.pos[k].x, G.pos[k].y, r, sl.s * L, sl.rot, time, k); } }
    c.globalAlpha = 1;
  }

  for (const p of parts) {
    c.save();
    if (p.k === 'fib') {
      const len = p.len * (1 - p.eat), n = 9;
      if (len > 2) {
        const pts = Array.from({ length: n }, (_, i) => { const t = i / (n - 1); return [p.x + t * len, p.y + Math.sin(p.ph + time * 1.5 + t * 6) * 3]; });
        c.lineCap = 'round'; c.beginPath(); smoothPath(c, pts); c.strokeStyle = '#25521f'; c.lineWidth = 6.5; c.stroke();
        c.beginPath(); smoothPath(c, pts); const gg = c.createLinearGradient(p.x, 0, p.x + len, 0); gg.addColorStop(0, '#6cc04a'); gg.addColorStop(1, '#b6ef6c');
        c.strokeStyle = gg; c.lineWidth = 4; c.stroke();
      }
    } else if (p.k === 'sug') {
      const s = 1 - p.eat; c.translate(p.x, p.y); c.rotate(p.ang + time * 0.3); c.scale(s, s);
      c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(1.5, 6, 6, 2, 0, 0, 6.283); c.fill();
      g = c.createLinearGradient(-5, -5, 5, 5); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#c9d2ea');
      c.fillStyle = g; c.strokeStyle = '#8b96b8'; c.lineWidth = 1; c.beginPath(); c.roundRect(-5.5, -5.5, 11, 11, 2.5); c.fill(); c.stroke();
    } else if (p.k === 'acid') {

}

      const pts = []; for (let d = 0; d <= last; d += 1) pts.push([X(d), Y(tlAt(d)[i])]);
      if (last % 1) pts.push([X(last), Y(tlAt(last)[i])]);
      if (pts.length > 1) { c.beginPath(); smoothPath(c, pts); c.strokeStyle = TCOL[i][0]; c.lineWidth = 2.6; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); }
    }
    if (S.p3 !== null) { c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(X(S.day), gy); c.lineTo(X(S.day), gy + gh); c.stroke(); }
    for (let i = 0; i < 4; i++) { c.fillStyle = '#fff'; c.beginPath(); c.arc(X(S.p3 === null ? 0 : S.day), Y(tlAt(S.p3 === null ? 0 : S.day)[i]), 3.4, 0, 6.283); c.fill(); }
  }
}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function sendVisitor() { S.vis = { x: -20, y: slotsGeoCy(), ph: 'in', t: 0, a: 1 }; S.vmsg = 'in'; S.sig = ''; }
const slotsGeoCy = () => { const r = $('cv').getBoundingClientRect(); return geom(r.width, r.height).cy; };
function onPick(k) {
  if (k === 'p1') S.sec = null;
  if (k === 'p2') { S.wk = 0; S.fEff = F0; S.hist = [varietyOf(F0)]; S.until = 6; S.playing2 = true; S.minV = varietyOf(F0); }
  if (k === 'p3') { S.day = 0; S.dayMax = 0; S.playing3 = true; }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'pick') {
    const k = b.dataset.p; if (S[k] !== null) return;
    S[k] = +b.dataset.i; (S[k] === T[lang][k].ok ? sfx.good : sfx.bad)(); onPick(k); S.rkey = ''; render(); showStage(); return;
  }
  if (act === 'go1') { $('views').querySelector('[data-view=fibre]')?.click(); return; }
  if (act === 'tile') { const d = +b.dataset.d; S.meals[d] = !S.meals[d]; sfx.tick(); }
  else if (act === 'run2') { if (S.wk < WEEKS) { S.until = Math.min(WEEKS, S.wk + 4); S.playing2 = true; sfx.click(); } }
  else if (act === 'pause2') { S.playing2 = false; sfx.click(); }
  else if (act === 'reset2') { S.wk = 0; S.fEff = F0; S.hist = [varietyOf(F0)]; S.playing2 = false; S.until = 0; S.minV = varietyOf(F0); sfx.click(); }
  else if (act === 'ill') { S.ill = b.dataset.k; S.day = 0; S.dayMax = 0; S.playing3 = true; sfx.click(); }
  else if (act === 'play3') { if (S.playing3) S.playing3 = false; else { if (S.day >= DAYS) { S.day = 0; S.dayMax = 0; } S.playing3 = true; } sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (k === 'free') { S.sec = S.sec === 'free' ? null : 'free'; S.hGrow = 0; S.vis = null; S.vmsg = null; }
    else { if (S.sec === 'free') { S.hGrow = 0; } sendVisitor(); }
    sfx.click();
  }
  S.rkey = ''; render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'r1') { S.fib = +ev.target.value; S.vmsg = null; S.rkey = ''; renderInfo(); }
  else if (ev.target.id === 'r3') { S.day = +ev.target.value; S.dayMax = Math.max(S.dayMax, S.day); S.playing3 = false; S.rkey = ''; renderInfo(); }
});

// --- one render per change: controls, state card, readout, facts -------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, gated = v !== 'fibre' && S.p1 === null, key = v === 'fibre' ? 'p1' : v === 'diet' ? 'p2' : 'p3', done = S[key] !== null;
  $('gbAsk').hidden = gated; $('gbGate').hidden = !gated;
  $('gbGo').textContent = t.goFibre + ' →';
  $('gbV1').hidden = !(v === 'fibre' && S.p1 !== null);
  $('gbV2').hidden = !(v === 'diet' && !gated);
  $('gbV3').hidden = !(v === 'pills' && !gated && S.p3 !== null);
  if (!gated) {
    const q = t[key];
    $('gbQt').textContent = q.q;
    $('gbOpts').innerHTML = q.opts.map((o, i) => `<button type="button" class="gb-opt ${done ? (i === q.ok ? 'right' : i === S[key] ? 'wrong' : '') : ''}" data-act="pick" data-p="${key}" data-i="${i}"${done ? ' disabled' : ''}>${key === 'p2' ? GL[i] : ''}<span>${esc(o)}</span></button>`).join('');
    $('gbVerdict').hidden = !done;
    if (done) $('gbVerdict').innerHTML = `<b style="color:${S[key] === q.ok ? 'var(--ok)' : 'var(--wip)'}">${esc(S[key] === q.ok ? t.ok : t.no)}</b> ${esc(q.rev[S[key]])}`;
  }
  $('gbLegend').hidden = gated || S.p1 === null;
  $('gbLegend').innerHTML = (gated || S.p1 === null) ? '' : t.types.map((n, i) => `<span><i style="background:radial-gradient(circle at 35% 30%, ${TCOL[i][0]}, ${TCOL[i][1]})"></i>${esc(n)}</span>`).join('');
  if (v === 'fibre' && S.p1 !== null) {
    $('l1a').textContent = t.u1.fibre; $('l1v').textContent = t.u1.lvl[S.fib < 8 ? 0 : S.fib < 40 ? 1 : S.fib < 75 ? 2 : 3];
    const open = secret.unlocked();
    $('secChips').innerHTML = [['free', '🫧'], ['vis', '🦠']].map(([k, e]) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  }
  if (v === 'diet' && !gated) {
    $('l2a').textContent = t.u2.meals;
    $('tiles').innerHTML = S.meals.map((m, d) => `<button type="button" class="gb-tile ${m ? 'fib' : 'swt'}" data-act="tile" data-d="${d}" aria-label="${esc(m ? t.u2.fibre : t.u2.sweet)}"${S.p2 === null ? ' disabled' : ''}>${m ? FIBS[d] : SWTS[d]}</button>`).join('');
    $('chips2').hidden = S.p2 === null;
    $('chips2').innerHTML = `<button type="button" class="chip" data-act="${S.playing2 ? 'pause2' : 'run2'}"${!S.playing2 && S.wk >= WEEKS ? ' disabled' : ''}>${esc(S.playing2 ? t.u2.pause : t.u2.run)}</button><button type="button" class="chip" data-act="reset2">${esc(t.u2.reset)}</button>`;
  }
  if (v === 'pills' && !gated && S.p3 !== null) {
    $('chips3').innerHTML = ['ear', 'cold'].map((k) => `<button type="button" class="chip ${S.ill === k ? 'on' : ''}" data-act="ill" data-k="${k}">${esc(t.u3[k])}</button>`).join('') + `<button type="button" class="chip" data-act="play3">${esc(S.playing3 ? t.u3.pause : t.u3.play)}</button>`;
    $('l3a').textContent = t.u3.dayLab; $('r3').value = S.day;
  }
  S.rkey = ''; renderInfo();
}
const phase3 = () => {
  const d = S.day;
  if (S.ill === 'cold') return d < COURSE ? 'cold1' : 'cold2';
  if (d < COURSE) return 'course';
  if (d >= DAYS - 0.01) return 'end';
  return countsOf(tlAt(d))[3] > BASE[3] + 1 ? 'empty' : 'recover';
};
function band2() { const q = varietyOf(S.fEff); return S.minV < 50 && q >= 70 ? 'back' : q >= 70 ? 'rich' : q >= 45 ? 'mid' : 'low'; }
function readout() {
  const t = T[lang], v = lab.view, gated = v !== 'fibre' && S.p1 === null;
  let val, sub = '', pill = '', col;
  if (gated || (v === 'fibre' && S.p1 === null)) { val = '?'; col = '#3fc1b0'; }
  else if (v === 'fibre') { val = S.acid; sub = t.u1.useful; pill = S.sec === 'free' ? '' : t.u1.vit(S.vit); col = '#3fc1b0'; }
  else if (v === 'diet') { val = varietyOf(S.fEff); sub = t.u2.sub; pill = t.u2.wk(Math.floor(S.wk)); col = '#e0b050'; }
  else if (S.p3 === null) { val = '?'; col = '#e5484d'; }
  else { val = helpersPct(S.day) + '%'; sub = t.u3.sub; pill = t.u3.pill(Math.round(live[3])); col = '#e5484d'; }
  const key = [val, sub, pill, lang, v].join('|');
  if (key !== S.rkey) { S.rkey = key; lab.setReadout(val, sub, pill, col); }
}
function renderInfo() {
  const t = T[lang], v = lab.view, gated = v !== 'fibre' && S.p1 === null;
  readout();
  const fine = (s) => `<div class="gb-fine">${esc(s)}</div>`;
  if (gated) { lab.setGlow('rgba(60, 60, 90, .3)'); lab.setState({ emo: '🌑', title: t.gate[0], lead: t.gate[1], body: '', extra: '' }); lab.setFacts([]); return; }
  if (v === 'fibre') {
    lab.setGlow('rgba(63, 193, 176, .26)');
    const p = t.p1;
    if (S.p1 === null) lab.setState({ emo: '🌑', title: p.q, lead: p.lead, body: p.body, extra: '' });
    else if (S.sec === 'free' && S.vmsg === 'settled') lab.setState({ emo: '🦠', title: t.vset[0], lead: t.vset[1], body: t.free[1], extra: fine(t.fine1) });
    else if (S.vmsg === 'in') lab.setState({ emo: '🦠', title: t.vin[0], lead: t.vin[1], body: '', extra: fine(t.fine1) });
    else if (S.vmsg === 'out') lab.setState({ emo: '🛡️', title: t.vout[0], lead: t.vout[1], body: '', extra: fine(t.fine1) });
    else if (S.sec === 'free') lab.setState({ emo: '🫧', title: t.free[0], lead: t.free[1], body: '', extra: fine(t.fine1) });
    else if (S.fib < 8) lab.setState({ emo: '🍽️', title: t.nofib[0], lead: t.nofib[1], body: '', extra: fine(t.fine1) });
    else lab.setState({ emo: '🌿', title: t.town[0], lead: t.town[1], body: t.town2, extra: fine(t.fine1) });
    lab.setFacts(S.p1 === null ? [] : t.facts.fibre);
  } else if (v === 'diet') {
    lab.setGlow('rgba(224, 176, 80, .24)');
    const p = t.p2;
    if (S.p2 === null) lab.setState({ emo: '🥗', title: p.q, lead: p.lead, body: p.body, extra: '' });
    else { const b = band2(); lab.setState({ emo: { rich: '🌈', mid: '📉', low: '🍬', back: '🌱' }[b], title: t.c2[b][0], lead: t.c2[b][1], body: '', extra: fine(t.fine2) }); }
    lab.setFacts(S.p2 === null ? [] : t.facts.diet);
  } else {
    lab.setGlow('rgba(229, 72, 77, .22)');
    const p = t.p3;
    if (S.p3 === null) lab.setState({ emo: '💊', title: p.q, lead: p.lead, body: p.body, extra: '' });
    else { const c3 = t.c3[phase3()]; lab.setState({ emo: { course: '💊', empty: '🦠', recover: '🌱', end: '🏙️', cold1: '🤧', cold2: '🚫' }[phase3()], title: c3[0], lead: c3[1], body: '', extra: `<div class="gb-rx">${esc(t.rx)}</div>${fine(t.fine3)}` }); }
    lab.setFacts(S.p3 === null ? t.facts.pills0 : t.facts.pills1);
  }
}
const sigNow = () => {
  const v = lab.view;
  if (v === 'fibre') return [v, S.p1, S.sec, S.vmsg, S.fib < 8, S.fib < 40, S.fib < 75].join('|');
  if (v === 'diet') return [v, S.p1, S.p2, S.playing2, band2(), Math.floor(S.wk)].join('|');
  return [v, S.p1, S.p3, S.ill, S.playing3, S.p3 === null ? '' : phase3()].join('|');
};

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const G = geom(w, h);
  step(dt, G, time);
  drawScene(c, G, time);
  drawPanel(c, G);
  readout();
  const s = sigNow(); if (s !== S.sig) { S.sig = s; renderInfo(); }
});
render();
</script>
</body>
