    h += `<div class="or-chips">${RULES.map((r) => `<button class="or-ch ${S.rule === r ? 'on' : ''}" data-act="rule" data-k="${r}">${RICON[r]} ${esc(t.rulesL[r])}</button>`).join('')}</div>`;
    h += motifRow(t, false);
    h += `<div class="or-step"><button class="or-sb" data-act="dn" aria-label="−"${S.n <= 1 ? ' disabled' : ''}>−</button><b>${S.n}</b><button class="or-sb" data-act="up" aria-label="+"${S.n >= 8 ? ' disabled' : ''}>+</button></div>`;
  }
  $('orStrip').innerHTML = h;
}
function plateCtrls(t) {
  const asking = !S.pAsked;
  let h = '';
  if (asking || S.pAns !== null) h += askHTML('plate', t);
  if (!asking) {
    const odd = S.pn % 2 === 1;
    h += `<div class="or-row"><span class="or-lbl">${esc(t.count)}</span>${[3, 4, 6, 8].map((k) => `<button class="or-ch ${S.pn === k ? 'on' : ''}" data-act="pn" data-k="${k}">${k}</button>`).join('')}</div>`;
    h += `<div class="or-row"><button class="or-ch ${S.pflip && !odd ? 'on' : ''}" data-act="pflip"${odd ? ' disabled' : ''}>⇆ ${esc(t.flipEvery)}</button></div>`;
    h += motifRow(t, true);
  }
  $('orPlate').innerHTML = h;
}
function rulesCtrls(t) {
  const ri = S.ri, ok = BRULE[BORD[ri]], picks = S.picks[ri], answered = S.shown[ri] === true, cur = S.att?.rule;
  let h = `<div class="or-q2">${esc(t.rulesAsk)}</div><div class="or-chips">`;
  h += RULES.map((r) => {
    const cls = answered ? (r === ok ? 'good' : picks.includes(r) ? 'bad' : '') : '';
    return `<button class="or-ch ${cls} ${cur === r ? 'cur' : ''}" data-act="pick" data-k="${r}">${RICON[r]} ${esc(t.rulesL[r])}</button>`;
  }).join('');
  h += '</div>';
  if (answered) {
    const lastOk = picks[picks.length - 1] === ok;
    h += `<div class="or-verdict ${lastOk ? 'good' : 'bad'}" style="margin-top:10px">${esc(lastOk ? t.rulesRight : t.rulesWrong)}</div>`;
    h += `<button class="btn or-next" data-act="next">${esc(ri === 2 ? t.again : t.next)}</button>`;
  }
  $('orRules').innerHTML = h;
}
function ctrls() {
  const t = T[lang], v = lab.view;
  $('orStrip').style.display = v === 'strip' ? '' : 'none';
  $('orPlate').style.display = v === 'plate' ? '' : 'none';
  $('orRules').style.display = v === 'rules' ? '' : 'none';
  if (v === 'strip') stripCtrls(t); else if (v === 'plate') plateCtrls(t); else rulesCtrls(t);
  const open = secret.unlocked();
  const sc = (k, emo, sec) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === sec ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('orSec').innerHTML = sc('a', '🧵', 'seven') + sc('b', '🌹', 'rose');
}

// --- readout, state card and facts ----------------------------------------------------------------------------
function info() {
  const t = T[lang], v = lab.view;
  if (v === 'strip') {
    lab.setGlow('rgba(192, 57, 43, .24)');
    lab.setFacts(t.facts.strip);
    if (S.sec === 'seven') {
      lab.setReadout(`${S.seven + 1}/7`, '', '', '#e3b23c');
      lab.setState({ emo: '🧵', title: t.secrets.a[0], lead: t.secrets.a[1], body: '', extra: '' });
    } else if (!S.sAsked) {
      lab.setFacts([]);
      lab.setReadout('?', '', '', '#e3b23c');
      lab.setState({ emo: '🤔', title: t.stripAsk, lead: '', body: '', extra: '' });
    } else {
      lab.setReadout(t.tiles(S.n), '', t.rulesL[S.rule], '#e3b23c');
      const [emo, title, lead, body] = t.st.strip; lab.setState({ emo, title, lead, body, extra: '' });
    }
  } else if (v === 'plate') {
    lab.setGlow('rgba(60, 100, 160, .24)');
    lab.setFacts(t.facts.plate);
    if (!S.pAsked) {
      lab.setFacts([]);
      lab.setReadout('?', '', '', '#e8614f');
      lab.setState({ emo: '🤔', title: t.plateAsk, lead: '', body: '', extra: '' });
    } else {
      lab.setReadout(t.motifsN(S.pn), '', t.every(360 / S.pn), '#e8614f');
      const [emo, title, lead, body] = t.st.plate; lab.setState({ emo, title, lead, body, extra: '' });
    }
  } else {
    lab.setGlow('rgba(212, 160, 23, .22)');
    lab.setFacts(t.facts.rules);
    if (S.sec === 'rose') {
      lab.setReadout('🌹', '', '', '#7fc08a');
      lab.setState({ emo: '🌹', title: t.secrets.b[0], lead: t.secrets.b[1], body: '', extra: '' });
    } else {
      const k = BORD.filter((b, i) => S.shown[i] && S.first[i] === BRULE[b]).length, dots = [0, 1, 2].map((i) => (S.first[i] !== undefined ? '●' : i === S.ri ? '◉' : '○')).join(' ');
      const last = S.att?.rule;
      lab.setReadout(t.score(k), dots, last ? t.rulesL[last] : '', '#7fc08a');
      const [emo, title, lead, body] = t.st.rules; lab.setState({ emo, title, lead, body, extra: '' });
    }
  }
}
function render() {
  document.body.dataset.v = lab.view;
  ctrls(); info();
}

// --- events ------------------------------------------------------------------------------------------------------
function secClick(k) {
  if (!secret.unlocked()) return secret.open();
  if (k === 'a') {
    if (S.sec === 'seven') S.seven = (S.seven + 1) % 7; else { lab.view = 'strip'; S.sec = 'seven'; S.seven = 0; }
    S.sevenAt = now(); S.sAsked = true;
  } else { lab.view = 'rules'; S.sec = 'rose'; S.roseAt = now(); S.nd = null; }
  sfx.click(); lab.renderChrome(); render(); lab.checkStage?.();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = b.dataset.k;
  if (act === 'sec') return secClick(k);
  if (S.sec) { S.sec = null; if (lab.view === 'strip') replay(); }
  if (act === 'ans') {
    const i = +b.dataset.i;
    if (k === 'strip') {
      S.sAns = i; S.sAsked = true; store.set('ornament:sAsked', true); S.revealAt = now(); S.n = 5; S.born[4] = now() + .35;
      (i === 0 ? sfx.good : sfx.bad)(); showStage();
    } else { S.pAns = i; S.pAsked = true; store.set('ornament:pAsked', true); (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  } else if (act === 'motif') { S.motif = k; sfx.click(); if (lab.view === 'strip') replay(); }
  else if (act === 'rule') { S.rule = k; sfx.click(); replay(); }
  else if (act === 'dn') { S.n = clamp(S.n - 1, 1, 8); sfx.tick(); }
  else if (act === 'up') { S.n = clamp(S.n + 1, 1, 8); S.born[S.n - 1] = now(); sfx.tick(); }
  else if (act === 'pn') { S.pn = +k; sfx.snap(); }
  else if (act === 'pflip') { S.pflip = !S.pflip; sfx.click(); }
  else if (act === 'pick') {
    const ri = S.ri, ok = k === BRULE[BORD[ri]];
    const first = S.first[ri] === undefined;
    if (first) S.first[ri] = k; else sfx.click();
    S.picks[ri].push(k); S.att = { rule: k, at: now() }; showStage();
    // the verdict waits until the tiles have moved into place
    if (!S.shown[ri]) setTimeout(() => { S.shown[ri] = true; if (first) (ok ? sfx.good : sfx.bad)(); render(); }, 1800);
  } else if (act === 'next') {
    if (S.ri < 2) S.ri++; else { S.ri = 0; S.first = []; S.picks = [[], [], []]; S.shown = []; }
    S.att = null; S.rBorn = now(); sfx.click();
  }
  render();
});

replay(); S.rBorn = now();
render();
canvasLoop($('cv'), (c, w, h, dt, time) => {
  S.W = w;
  const v = lab.view;
  if (v === 'strip') { if (S.sec === 'seven') drawSeven(c, w, h, dt, time); else drawStrip(c, w, h, dt, time); }
  else if (v === 'plate') drawPlate(c, w, h, dt, time);
  else if (S.sec === 'rose') drawRose(c, w, h, dt, time);
  else drawRules(c, w, h, dt, time);
});
</script>
</body>
</html>
