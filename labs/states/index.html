// one particle: always the same size, the same blue with a light rim

  c.lineWidth = Math.max(1.2, r * 0.2); c.strokeStyle = 'rgba(215, 232, 255, .95)'; c.stroke();

// the magnifier: a handle, a round glass with a rim, and whatever `paint` draws inside

// --- the particle model ------------------------------------------------------------------------------------------
// 36 particles of one size in a lens of radius 1. Solid: a 6 x 6 lattice that jiggles; liquid: a pile at the bottom;
// gas: straight lines bouncing off the glass. Particles never change, only how they move.
const NP = 36, PR = 0.09, DL = 0.2, LC = 0.11;
class Sim {
  constructor(mode = 'solid') {
    const key = Array.from({ length: NP }, (_, i) => (i / 6 | 0) / 6 * 0.7 + Math.random() * 0.3); // the top rows melt first
    const order = [...key.keys()].sort((a, b) => key[a] - key[b]);
    this.p = Array.from({ length: NP }, (_, i) => {
      const hx = (i % 6 - 2.5) * DL, hy = LC + ((i / 6 | 0) - 2.5) * DL;
      return { hx, hy, x: hx, y: hy, vx: 0, vy: 0, s: 1, sol: true, gas: false, a: rnd(0, TAU), b: rnd(0, TAU), f: rnd(11, 17), rk: (order.indexOf(i) + 0.5) / NP };
    });
    if (mode === 'gas') for (const q of this.p) {
      const a = rnd(0, TAU), r = Math.sqrt(Math.random()) * 0.85, b = rnd(0, TAU);
      Object.assign(q, { gas: true, s: 0, sol: false, x: Math.cos(a) * r, y: Math.sin(a) * r, vx: Math.cos(b), vy: Math.sin(b) });
    }
  }
  // T in degrees, ice = share of the water that is still solid, w = share of the water that has not boiled away
  update(dt, T, ice, w) {
    const P = this.p, m = 1 - ice, tl = clamp(T, 0, 100) / 100;
    const gasSpeed = 0.6 + 1.4 * clamp((T + 20) / 140, 0, 1); // lens radii per second
    // boiling: the topmost liquid particle leaves the surface, one at a time
    if (P.filter((q) => !q.gas).length > Math.round(NP * w)) {
      let top = null;
      for (const q of P) if (!q.gas && q.s < 0.5 && (!top || q.y < top.y)) top = q;
      if (top) { const a = -Math.PI / 2 + rnd(-0.8, 0.8); top.gas = true; top.vx = Math.cos(a) * gasSpeed; top.vy = Math.sin(a) * gasSpeed; }
    }
    for (const q of P) {
      if (q.gas) continue;
      if (ice > 0 && q.rk >= m) { // part of the lattice
        q.s = Math.min(1, q.s + dt * 3); q.sol = true;
        const k = Math.min(1, dt * 9); q.x += (q.hx - q.x) * k; q.y += (q.hy - q.y) * k; q.vx = q.vy = 0;
      } else { // loose: slides, falls, jostles
        if (q.sol) { q.sol = false; q.vx = rnd(-0.25, 0.25); q.vy = rnd(-0.1, 0.2); }
        q.s = Math.max(0, q.s - dt * 6);
        q.vy += 3 * dt;
        const n = (6 + 14 * tl) * dt;
        q.vx += rnd(-1, 1) * n; q.vy += rnd(-1, 1) * n;
        const d = Math.exp(-3 * dt); q.vx *= d; q.vy *= d;
        const sp = Math.hypot(q.vx, q.vy); if (sp > 1.6) { q.vx *= 1.6 / sp; q.vy *= 1.6 / sp; }
        q.x += q.vx * dt; q.y += q.vy * dt;
      }
    }
    // particles do not overlap; the lattice does not give way
    for (let it = 0; it < 2; it++) for (let i = 0; i < NP; i++) {
      const a = P[i]; if (a.gas) continue;
      for (let j = i + 1; j < NP; j++) {
        const b = P[j]; if (b.gas) continue;
        const as = a.s > 0.5, bs = b.s > 0.5; if (as && bs) continue;
        let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d >= 2 * PR) continue;
        if (d < 1e-6) { dx = 1e-3; dy = -1e-3; d = Math.hypot(dx, dy); }
        const o = (2 * PR - d) / d;
        if (as) { b.x += dx * o; b.y += dy * o; } else if (bs) { a.x -= dx * o; a.y -= dy * o; }
        else { a.x -= dx * o / 2; a.y -= dy * o / 2; b.x += dx * o / 2; b.y += dy * o / 2; }
      }
    }
    const lim = 1 - PR;
    for (const q of P) {
      if (q.gas) continue;
      const r = Math.hypot(q.x, q.y);
      if (r > lim) {
        const nx = q.x / r, ny = q.y / r, vn = q.vx * nx + q.vy * ny;
        q.x = nx * lim; q.y = ny * lim;
        if (vn > 0) { q.vx -= 1.3 * vn * nx; q.vy -= 1.3 * vn * ny; }
      }
    }
    // gas: constant straight flight, elastic bounces off the glass and off what is still in the pot
    for (const q of P) {
      if (!q.gas) continue;
      const sp = Math.hypot(q.vx, q.vy) || 1, ns = sp + (gasSpeed - sp) * Math.min(1, dt * 3);
      q.vx *= ns / sp; q.vy *= ns / sp; q.x += q.vx * dt; q.y += q.vy * dt;
      const r = Math.hypot(q.x, q.y);
      if (r > lim) {
        const nx = q.x / r, ny = q.y / r, vn = q.vx * nx + q.vy * ny;
        q.x = nx * lim; q.y = ny * lim;
        if (vn > 0) { q.vx -= 2 * vn * nx; q.vy -= 2 * vn * ny; }
      }
      for (const o of P) {
        if (o.gas) continue;
        const dx = q.x - o.x, dy = q.y - o.y, d = Math.hypot(dx, dy);
        if (d >= 2 * PR || d < 1e-6) continue;
        const nx = dx / d, ny = dy / d, vn = q.vx * nx + q.vy * ny;
        q.x = o.x + nx * 2 * PR; q.y = o.y + ny * 2 * PR;
        if (vn < 0) { q.vx -= 2 * vn * nx; q.vy -= 2 * vn * ny; }
      }
    }
  }
  draw(c, cx, cy, R, t, T) {
    const amp = PR * (0.04 + 0.16 * clamp((T + 20) / 20, 0, 1));
    for (const q of this.p) {
      const jx = Math.sin(t * q.f + q.a) * amp * q.s, jy = Math.cos(t * q.f * 0.9 + q.b) * amp * q.s;
      dot(c, cx + (q.x + jx) * R, cy + (q.y + jy) * R, PR * R);
    }
  }
}

// a few gas particles flying at constant speed in a round lens (optionally around round obstacles)
class Free {
  constructor(n, pr) {
    this.pr = pr;
    this.p = Array.from({ length: n }, () => {
      const a = rnd(0, TAU), r = Math.sqrt(Math.random()) * 0.8, b = rnd(0, TAU);
      return { x: Math.cos(a) * r, y: Math.sin(a) * r, vx: Math.cos(b), vy: Math.sin(b) };
    });
  }
  update(dt, speed, obs = []) {
    const lim = 1 - this.pr;
    for (const q of this.p) {
      const s = Math.hypot(q.vx, q.vy) || 1; q.vx *= speed / s; q.vy *= speed / s;
      q.x += q.vx * dt; q.y += q.vy * dt;
      const r = Math.hypot(q.x, q.y);
      if (r > lim) { const nx = q.x / r, ny = q.y / r, vn = q.vx * nx + q.vy * ny; q.x = nx * lim; q.y = ny * lim; if (vn > 0) { q.vx -= 2 * vn * nx; q.vy -= 2 * vn * ny; } }
      for (const o of obs) {
        const dx = q.x - o.x, dy = q.y - o.y, d = Math.hypot(dx, dy) || 1e-6, mn = o.r + this.pr;
        if (d < mn) { const nx = dx / d, ny = dy / d, vn = q.vx * nx + q.vy * ny; q.x = o.x + nx * mn; q.y = o.y + ny * mn; if (vn < 0) { q.vx -= 2 * vn * nx; q.vy -= 2 * vn * ny; } }
      }
    }
  }
  draw(c, cx, cy, R) { for (const q of this.p) dot(c, cx + q.x * R, cy + q.y * R, this.pr * R); }
}

// the white cloud: four tiny drops (7 particles stuck together each) and a few free vapour particles between them
class Cloud {
  constructor() {
    this.pr = 0.11;
    this.cl = [[-0.4, -0.38], [0.4, -0.38], [-0.4, 0.38], [0.4, 0.38]].map(([x, y]) => ({ x, y, vx: rnd(-0.07, 0.07), vy: rnd(-0.07, 0.07), a: rnd(0, TAU), w: rnd(0.2, 0.45) * (Math.random() < 0.5 ? -1 : 1) }));
    this.gas = new Free(8, this.pr);
    this.gas.p.forEach((q) => { q.x = rnd(-0.1, 0.1); q.y = rnd(-0.1, 0.1); }); // start in the gaps
  }
  update(dt) {
    const C = this.cl;
    for (const c of C) {
      c.x += c.vx * dt; c.y += c.vy * dt; c.a += c.w * dt;
      const r = Math.hypot(c.x, c.y);
      if (r > 0.6) { const nx = c.x / r, ny = c.y / r, vn = c.vx * nx + c.vy * ny; c.x = nx * 0.6; c.y = ny * 0.6; if (vn > 0) { c.vx -= 2 * vn * nx; c.vy -= 2 * vn * ny; } }
    }
    for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) {
      const dx = C[j].x - C[i].x, dy = C[j].y - C[i].y, d = Math.hypot(dx, dy) || 1e-6;
      if (d < 0.72) { const o = (0.72 - d) / d / 2; C[i].x -= dx * o; C[i].y -= dy * o; C[j].x += dx * o; C[j].y += dy * o; C[i].vx -= dx / d * 0.02; C[i].vy -= dy / d * 0.02; C[j].vx += dx / d * 0.02; C[j].vy += dy / d * 0.02; }
    }
    this.gas.update(dt, 1.5, C.map((c) => ({ x: c.x, y: c.y, r: 0.35 })));
  }
  draw(c, cx, cy, R, t) {
    for (const k of this.cl) {
      c.beginPath(); c.arc(cx + k.x * R, cy + k.y * R, 0.35 * R, 0, TAU);
      c.fillStyle = 'rgba(110, 170, 255, .14)'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(170, 205, 255, .5)'; c.stroke();
      dot(c, cx + k.x * R, cy + k.y * R, this.pr * R);
      for (let i = 0; i < 6; i++) {
        const a = k.a + i * Math.PI / 3, d = 2 * this.pr + Math.sin(t * 3 + i + k.a) * 0.006;
        dot(c, cx + (k.x + Math.cos(a) * d) * R, cy + (k.y + Math.sin(a) * d) * R, this.pr * R);
      }
    }
    this.gas.draw(c, cx, cy, R);
  }
}

// the cold glass seen from close up: vapour from the air slows down near the glass and sticks as drops
const HEX = [[0, 0], [2, 0], [1, 1.8], [-1, 1.8], [-2, 0], [-1, -1.8], [1, -1.8]];
class Dew {
  constructor() { this.pr = 0.11; this.wx = 0.5; this.cy = [-0.5, 0, 0.5]; this.cnt = [0, 0, 0]; this.hold = [0, 0, 0]; this.p = Array.from({ length: 14 }, () => this.fresh(true)); }
  fresh(init) { const a = rnd(0, TAU); return { x: init ? rnd(-0.8, 0.3) : rnd(-0.9, -0.7), y: rnd(-0.7, 0.7), vx: Math.cos(a), vy: Math.sin(a), k: -1, s: 0 }; }
  update(dt) {
    const pr = this.pr, wx = this.wx;
    for (const q of this.p) {
      if (q.k >= 0) { // stuck: settle into its place in the drop
        const [ox, oy] = HEX[q.s], tx = wx - 3 * pr + ox * pr, ty = this.cy[q.k] + oy * pr, e = Math.min(1, dt * 8);
        q.x += (tx - q.x) * e; q.y += (ty - q.y) * e; continue;
      }
      const sp = 1.3 * clamp((wx - q.x) / 0.7, 0.18, 1), cur = Math.hypot(q.vx, q.vy) || 1; // slower the closer to the cold glass
      q.vx *= sp / cur; q.vy *= sp / cur; q.x += q.vx * dt; q.y += q.vy * dt;
      const r = Math.hypot(q.x, q.y), lim = 1 - pr;
      if (r > lim) { const nx = q.x / r, ny = q.y / r, vn = q.vx * nx + q.vy * ny; q.x = nx * lim; q.y = ny * lim; if (vn > 0) { q.vx -= 2 * vn * nx; q.vy -= 2 * vn * ny; } }
      if (q.x > wx - pr) {
        let k = 0; for (let i = 1; i < 3; i++) if (Math.abs(this.cy[i] - q.y) < Math.abs(this.cy[k] - q.y)) k = i;
        if (this.cnt[k] < 7 && Math.random() < 0.6) { q.k = k; q.s = this.cnt[k]++; }
        else { q.x = wx - pr; q.vx = -Math.abs(q.vx); }
      }
    }
    for (let k = 0; k < 3; k++) if (this.cnt[k] >= 7) { // a full drop rolls away after a while, the vapour goes on
      this.hold[k] += dt;
      if (this.hold[k] > 2.4) { this.p.forEach((q, i) => { if (q.k === k) this.p[i] = this.fresh(false); }); this.cnt[k] = 0; this.hold[k] = 0; }
    }
  }
  draw(c, cx, cy, R) {
    const wx = this.wx, pr = this.pr;
    const g = c.createLinearGradient(cx + (wx - 0.55) * R, 0, cx + wx * R, 0);
    g.addColorStop(0, 'rgba(120,180,255,0)'); g.addColorStop(1, 'rgba(120,180,255,.22)');
    c.fillStyle = g; c.fillRect(cx + (wx - 0.55) * R, cy - R, 0.55 * R, 2 * R);
    c.fillStyle = 'rgba(160, 205, 235, .4)'; c.fillRect(cx + wx * R, cy - R, (1.2 - wx) * R, 2 * R);
    c.strokeStyle = 'rgba(230,245,255,.8)'; c.lineWidth = 2; c.beginPath(); c.moveTo(cx + wx * R, cy - R); c.lineTo(cx + wx * R, cy + R); c.stroke();
    for (let k = 0; k < 3; k++) if (this.cnt[k] >= 4) {
      c.beginPath(); c.arc(cx + (wx - 3 * pr) * R, cy + this.cy[k] * R, 3.2 * pr * R, 0, TAU);
      c.fillStyle = 'rgba(110,170,255,.14)'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(170,205,255,.5)'; c.stroke();
    }
    for (const q of this.p) dot(c, cx + q.x * R, cy + q.y * R, pr * R);
  }
}

// one grain of sand: a hard lump with its own shape, its particles in a lattice
const GRAIN = [[-0.62, -0.34], [-0.3, -0.7], [0.3, -0.66], [0.7, -0.12], [0.55, 0.5], [-0.05, 0.72], [-0.58, 0.36]];
const GRAIN_DOTS = [];
const inPoly = (x, y, poly) => {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
};
for (let r = 0; r < 6; r++) for (let q = 0; q < 6; q++) {
  const x = (q - 2.5) * 0.19, y = (r - 2.5) * 0.19 + 0.02;
  if (inPoly(x, y, GRAIN) && inPoly(x - 0.07, y, GRAIN) && inPoly(x + 0.07, y, GRAIN) && inPoly(x, y - 0.07, GRAIN) && inPoly(x, y + 0.07, GRAIN)) GRAIN_DOTS.push([x, y, rnd(0, TAU), rnd(0, TAU), rnd(11, 17)]);
}
function paintGrain(c, cx, cy, R, t) {
  c.beginPath(); GRAIN.forEach(([x, y], i) => (i ? c.lineTo(cx + x * R, cy + y * R) : c.moveTo(cx + x * R, cy + y * R))); c.closePath();
  c.fillStyle = '#c9ad78'; c.fill(); c.lineJoin = 'round'; c.lineWidth = 3; c.strokeStyle = '#7a6238'; c.stroke();
  for (const [x, y, a, b, f] of GRAIN_DOTS) dot(c, cx + (x + Math.sin(t * f + a) * 0.008) * R, cy + (y + Math.cos(t * f + b) * 0.008) * R, PR * R);
}

// --- state --------------------------------------------------------------------------------------------------------
const S = { sec: null, alt: 'sea', pumped: false, wg: 410, pk: 0 };
// H: the pot. T temperature; ice share still solid; w share not yet boiled away; flow = where the guided run is
const H = { T: -20, ice: 1, w: 1, mode: 'off', dir: 0, last: 1, flow: 'ask1', guess: 50, g1: 50, g2: 50, pause: 0, markers: null, log: [], bp: 100 };
let SIM = new Sim();
const K = { step: 1, ans: null };
const CARDS = [['sand', '🏖️', 'solid'], ['salt', '🧂', 'solid'], ['flour', '🌾', 'solid'], ['milk', '🥛', 'liquid'], ['oil', '🌻', 'liquid'],
  ['honey', '🍯', 'liquid'], ['balloon', '🎈', 'gas'], ['bubbles', '🫧', 'gas'], ['vapour', '♨️', 'gas']];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const Z = { order: shuffle(CARDS.map((c) => c[0])), place: {}, sel: null, checked: false, res: {}, fixed: {}, k: 0 };

function resetHeat(flow) {
  S.alt = S.sec === 'everest' ? S.alt : 'sea';
  Object.assign(H, { T: -20, ice: 1, w: 1, mode: 'off', dir: 0, flow, guess: 50, pause: 0, markers: null, log: [], bp: S.sec === 'everest' && S.alt === 'top' ? 70 : 100 });
  SIM = new Sim();
  render();
}
const stateKey = () => {
  if (H.w <= 0) return 'gas';
  if (H.T >= H.bp) return 'boiling';
  if (H.T > 0) return 'liquid';
  if (H.T < 0 || H.ice >= 1) return 'solid';
  if (H.ice <= 0) return 'liquid';
  return H.last < 0 ? 'freezing' : 'melting';
};

// the heating model: 12 degrees a second; the temperature stands still at 0 while ice melts (4 s) and at the boiling point while water boils away (6 s)
function pauseAt(n, real, guess) {
  const ok = Math.abs(guess - real) <= 10;
  H.flow = `pause${n}`; H.pause = 1.5; H.markers = { real, guess }; H.dir = 0;
  H.log.push(n === 1 ? (ok ? 'meltRight' : 'meltWrong') : (ok ? 'boilRight' : 'boilWrong'));
  (ok ? sfx.good : sfx.bad)(); render(); showStage();
}
function stepFlow(dt) {
  const f = H.flow;
  if (f === 'pause1' || f === 'pause2') {
    H.dir = 0; H.pause -= dt;
    if (H.pause <= 0) { H.markers = null; H.flow = f === 'pause1' ? 'ask2' : 'ask3'; H.guess = 50; render(); }

    if (k === 'grain') lensFrame(c, cx, cy, R, (cc) => paintGrain(cc, cx, cy, R, t));
    else if (k === 'honey') lensFrame(c, cx, cy, R, (cc) => { sim.update(dt * 0.3, 20, 0, 1); sim.draw(cc, cx, cy, R, t, 20); }, '#5a3a0e');
    else lensFrame(c, cx, cy, R, (cc) => { sim.update(dt, 20, 0, 0); sim.draw(cc, cx, cy, R, t, 20); }, '#3a1a30');
  });
});

// --- readout ------------------------------------------------------------------------------------------------------
let rkey = '';
function updateReadout() {
  const t = T[lang], v = lab.view;
  let val, sub, col;
  if (v === 'heat') {
    if (S.sec === 'weigh') { val = `${Math.round(S.wg)} ${t.sec.g}`; sub = S.pumped ? t.sec.pumped : t.sec.flat; col = '#3ddc97'; }
    else {
      val = H.flow === 'ask1' || H.flow === 'ask2' ? '? °C' : fmtT(H.T); sub = t.h.states[stateKey()];
      col = H.T < 0 ? '#7fb4ff' : H.T >= H.bp ? '#ff6a4d' : '#ffb04d';
    }
  } else if (v === 'kettle') { val = `${K.step}/3`; sub = ''; col = '#7fb4ff'; }
  else {
    const n = Object.keys(Z.place).length;
    val = `${Z.checked ? Z.k : n}/9`; sub = Z.checked ? t.s.score(Z.k) : ''; col = '#3ddc97';
  }
  const key = `${val}|${sub}|${col}|${lang}`; if (key === rkey) return;
  rkey = key; lab.setReadout(val, sub, '', col);
}

// --- render: controls and the state card, once per change ---------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('sortWrap').style.display = v === 'sort' ? '' : 'none';
  $('secRow').style.display = v === 'heat' ? '' : 'none';
  const card = t.cards[v];
  const fine = `<div class="fine">${esc(t.fine)}</div>`;
  if (v === 'heat') {
    const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    $('secRow').innerHTML = `<div class="chips">${sc('everest', '🏔️')}${sc('weigh', '⚖️')}</div>`;
    renderHeat(t);
    if (S.sec === 'everest') lab.setState({ emo: '🏔️', title: t.secrets.everest[0], lead: t.sec.everestText, body: '', extra: fine });
    else if (S.sec === 'weigh') lab.setState({ emo: '⚖️', title: t.secrets.weigh[0], lead: t.sec.weighText, body: '', extra: fine });
    else lab.setState({ emo: card[0], title: card[1], lead: card[2], body: card[3], extra: fine });
    lab.setGlow('rgba(255, 130, 70, .24)');
  } else if (v === 'kettle') {
    renderKettle(t); lab.setState({ emo: card[0], title: card[1], lead: card[2], body: card[3], extra: fine }); lab.setGlow('rgba(110, 160, 255, .26)');
  } else {
    renderSort(t); lab.setState({ emo: card[0], title: card[1], lead: card[2], body: card[3], extra: fine }); lab.setGlow('rgba(61, 220, 151, .2)');
  }
  rkey = ''; updateReadout();
}
const vd = (key, t, dim) => {
  const ok = key.endsWith('Right') ? true : key.endsWith('Wrong') ? false : null;
  return `<div class="vd ${ok === true ? 'ok' : ok === false ? 'no' : ''} ${dim ? 'dim' : ''}">${ok === true ? '✅' : ok === false ? '🤔' : '💨'} ${esc(t.h[key])}</div>`;
};
const seg = (items, cur, act) => `<div class="card seg small">${items.map(([k, label]) => `<button data-act="${act}" data-v="${k}" class="${String(cur) === String(k) ? 'on' : ''}">${esc(label)}</button>`).join('')}</div>`;

function renderHeat(t) {
  const h = t.h, f = H.flow, asking = f === 'ask1' || f === 'ask2' || f === 'ask3', log = H.log.slice(asking ? -1 : -2).map((k) => vd(k, t, asking)).join('');
  let p = '';
  if (S.sec === 'weigh') p = `<div class="row2" style="margin-top:0">${seg([[0, t.sec.flat], [1, t.sec.pumped]], S.pumped ? 1 : 0, 'pump')}</div>`;
  else if (f === 'ask1' || f === 'ask2') {
    p = `${log}<div class="q">${esc(f === 'ask1' ? h.qMelt : h.qBoil)}</div>
      <div class="stepper"><button class="sb" data-act="gd" data-d="-10" aria-label="−10">−</button>
      <div class="gv"><small>${esc(h.guess)}</small><b>${fmtT(H.guess)}</b></div><button class="sb" data-act="gd" data-d="10" aria-label="+10">+</button></div>
      <div class="ctr"><button class="btn" data-act="start">${esc(h.start)}</button></div>`;
  } else if (f === 'ask3') {
    p = `${log}<div class="q">${esc(h.qFlat)}</div><div class="optlist"><button class="optb" data-act="flat" data-v="up">${esc(h.up)}</button><button class="optb" data-act="flat" data-v="same">${esc(h.same)}</button></div>`;
  } else if (f !== 'free') p = `${log}<div class="row2" style="margin-top:0"><button class="chip" data-act="reset">${esc(h.reset)}</button></div>`;
  else {
    const dead = H.w <= 0;
    p = `${log}${S.sec === 'everest' ? `<div class="row2" style="margin-top:0">${seg([['sea', t.sec.sea], ['top', t.sec.top]], S.alt, 'alt')}</div>` : ''}
      <div class="row2" style="margin-top:${S.sec === 'everest' ? 12 : 0}px">
      <button class="chip ${H.mode === 'heat' ? 'on' : ''}" data-act="heat" ${dead ? 'disabled' : ''}>${esc(h.heat)}</button>
      <button class="chip ${H.mode === 'cool' ? 'on' : ''}" data-act="cool" ${dead ? 'disabled' : ''}>${esc(h.cool)}</button>
      <button class="chip" data-act="reset">${esc(h.reset)}</button>
      ${dead ? `<button class="btn" data-act="refill">${esc(h.refill)}</button>` : ''}</div>`;
  }
  $('panel').innerHTML = p;
}

function renderKettle(t) {
  const k = t.k, st = K.step, ans = K.ans, Q = [[k.q, k.opts, 1], [k.q2, k.opts2, 0], [k.q3, k.opts3, 1]][st - 1];
  let p = `<div class="q">${esc(Q[0])}</div><div class="optlist">${Q[1].map((o, i) => `<button class="optb ${ans === null ? '' : i === Q[2] ? 'good' : i === ans ? 'bad' : ''}" data-act="ko" data-i="${i}" ${ans === null ? '' : 'disabled'}>${esc(o)}</button>`).join('')}</div>`;
  if (ans !== null) {
    const ok = ans === Q[2];
    p += `<div class="vd ${ok ? 'ok' : 'no'}">${ok ? '✅' : '🤔'} ${esc(ok ? t.right : t.wrong)}</div>`;
    p += st < 3 ? `<p class="ex">${esc(k.gap)}</p><p class="ex">${esc(k.cloud)}</p>` : `<p class="ex">${esc(k.r3)}</p>`;
    p += `<div class="ctr"><button class="btn" data-act="knext">${esc(st < 3 ? t.next : t.again)}</button></div>`;
  }
  $('panel').innerHTML = p;
}

// --- sort ---------------------------------------------------------------------------------------------------------
const cardOf = (id) => CARDS.find((c) => c[0] === id);
function renderSort(t) {
  const s = t.s, chip = (id, bin) => {
    const [, emo] = cardOf(id);
    const cls = Z.checked ? (Z.fixed[id] ? 'fx' : Z.res[id] ? 'ok' : 'no') : Z.sel === id ? 'sel' : '';
    return `<button class="c9 ${cls}" data-id="${id}" ${Z.checked ? 'disabled' : ''}><span class="e">${emo}</span><span>${esc(s.cards[id])}</span></button>`;
  };
  const pool = Z.order.filter((id) => !Z.place[id]);
  $('sortUI').innerHTML = `<div class="sq">${esc(s.q)}</div>${pool.length ? `<div class="pool">${pool.map((id) => chip(id)).join('')}</div>` : ''}
    <div class="bins">${['solid', 'liquid', 'gas'].map((b) => `<div class="bin ${Z.sel && !Z.checked ? 'hot' : ''}" data-bin="${b}"><h4>${esc(s.bins[b])}</h4>
      <div class="in">${Z.order.filter((id) => Z.place[id] === b).map((id) => chip(id, b)).join('')}</div></div>`).join('')}</div>`;
  $('lensStrip').hidden = !Z.checked;
  for (const k of ['grain', 'honey', 'air']) $(`cap-${k}`).textContent = s[k];
  const n = Object.keys(Z.place).length;
  $('panel').innerHTML = Z.checked
    ? `<div class="ctr"><button class="btn" data-act="sagain">${esc(t.again)}</button></div>`
    : `<div class="ctr"><button class="btn" data-act="scheck" ${n < 9 ? 'disabled' : ''}>${esc(t.check)}</button></div>`;
}
// slide the cards to their new places
function flip(change) {
  const els = () => [...document.querySelectorAll('#sortUI [data-id]')];
  const before = new Map(els().map((e) => [e.dataset.id, e.getBoundingClientRect()]));
  change();
  els().forEach((e) => {
    const b = before.get(e.dataset.id); if (!b) return;
    const a = e.getBoundingClientRect(), dx = b.left - a.left, dy = b.top - a.top;
    if (dx || dy) e.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 650, easing: 'ease-in-out' });
  });
}
function sortClick(ev) {
  if (Z.checked) return;
  const card = ev.target.closest('.c9'), bin = ev.target.closest('.bin');
  if (card && !(bin && Z.sel && Z.sel !== card.dataset.id)) { // pick a card up (a card in a bin can be moved again)
    Z.sel = Z.sel === card.dataset.id ? null : card.dataset.id; sfx.tick(); render(); return;
  }
  if (bin && Z.sel) {
    const id = Z.sel; Z.sel = null; sfx.click();
    flip(() => { Z.place[id] = bin.dataset.bin; render(); });
  }
}
$('sortUI').addEventListener('click', sortClick);

// --- controls -----------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'gd') { H.guess = clamp(H.guess + +b.dataset.d, -20, 120); sfx.tick(); }
  else if (act === 'start') {
    if (H.flow === 'ask1') { H.g1 = H.guess; H.flow = 'run1'; } else { H.g2 = H.guess; H.flow = 'run2'; }
    sfx.click();
  } else if (act === 'flat') {
    const ok = v === 'same'; H.log.push(ok ? 'flatRight' : 'flatWrong'); (ok ? sfx.good : sfx.bad)(); H.flow = 'run3'; showStage();
  } else if (act === 'heat' || act === 'cool') { H.mode = H.mode === act ? 'off' : act; sfx.click(); }
  else if (act === 'reset') { sfx.click(); return resetHeat(S.sec ? 'free' : 'ask1'); }
  else if (act === 'refill') { sfx.click(); return resetHeat('free'); }
  else if (act === 'alt') { S.alt = v; sfx.click(); return resetHeat('free'); }
  else if (act === 'pump') { S.pumped = v === '1'; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.alt = 'sea'; sfx.click();
    return resetHeat(S.sec ? 'free' : 'ask1');
  } else if (act === 'ko') {
    K.ans = +b.dataset.i; const Q = [1, 0, 1][K.step - 1]; (K.ans === Q ? sfx.good : sfx.bad)(); render(); return showStage();
  } else if (act === 'knext') { K.step = K.step % 3 + 1; K.ans = null; sfx.click(); }
  else if (act === 'scheck') {
    if (Object.keys(Z.place).length < 9) return;
    Z.res = {}; Z.k = 0;
    for (const [id, , bin] of CARDS) { Z.res[id] = Z.place[id] === bin; if (Z.res[id]) Z.k++; }
    Z.checked = true; Z.sel = null; (Z.k === 9 ? sfx.good : sfx.bad)(); render(); showStage();
    setTimeout(() => {
      if (!Z.checked) return;
      flip(() => { for (const [id, , bin] of CARDS) if (!Z.res[id]) { Z.place[id] = bin; Z.fixed[id] = true; } render(); });
    }, 1100);
    return;
  } else if (act === 'sagain') {
    Object.assign(Z, { order: shuffle(CARDS.map((c) => c[0])), place: {}, sel: null, checked: false, res: {}, fixed: {}, k: 0 }); sfx.click();
  }
  render();
});

resetHeat('ask1');
</script>
</body>
</html>
