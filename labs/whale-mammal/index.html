function water(c, w, h, top, time) {
  const g = c.createLinearGradient(0, top, 0, h); g.addColorStop(0, '#2f9bc4'); g.addColorStop(0.45, '#17679a'); g.addColorStop(1, '#0a2347');

function body(c, x0, y0, L, T, off, th, fill, stroke) {
  const N = 30, P = [], top = [], bot = [];

  for (let i = 0; i <= N; i++) {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(N, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;

  if (asking) { lab.setReadout('?', '', '', '#6fd0ff'); lab.setState({ emo: '🤔', title: t.p1.q, lead: '', body: '', extra: '' }); return; }
  lab.setReadout(`${Math.round(S.air * 100)}%`, t.breaths(S.breaths), t.brPill, '#6fd0ff');
  const k = S.phase === 'spout' ? 'spout' : S.phase === 'up' ? 'up' : S.air < 0.25 ? 'low' : 'down', [emo, title, lead] = t.br[k];
  lab.setState({ emo, title, lead, body: '', extra: '' });
}
function renderTail(t, asking) {
  lab.setGlow('rgba(95,168,160,.26)');
  $('modeSeg').innerHTML = ['side', 'top'].map((m) => `<button data-act="mode" data-m="${m}" class="${S.mode === m ? 'on' : ''}">${esc(t[m])}</button>`).join('');
  if (asking) { lab.setReadout('?', '', '', '#5fa8a0'); lab.setState({ emo: '🤔', title: t.p2.q, lead: '', body: '', extra: '' }); return; }
  lab.setReadout('↕', t.dol, `↔ ${t.fis}`, '#5fa8a0');
  const [emo, title, lead] = t.tl[S.mode]; lab.setState({ emo, title, lead, body: '', extra: '' });
}
function renderSort(t) {
  lab.setGlow('rgba(224,176,80,.24)');
  const done = S.si >= 6, k = S.placed.filter((p) => p.ok).length;
  $('fishB').textContent = t.fishB; $('mamB').textContent = t.mamB; $('againB').textContent = t.again;
  $('fishB').hidden = $('mamB').hidden = done; $('againB').hidden = !done;
  lab.setReadout(`${S.si}/6`, t.sorted, done ? `✓ ${k}` : '', '#e0b050');
  if (done) { lab.setState({ emo: '🏆', title: t.so.end(k), lead: t.so.endLead, body: '', extra: '' }); return; }
  if (!S.placed.length) { const [emo, title, lead] = t.so.go; lab.setState({ emo, title, lead, body: '', extra: '' }); return; }
  const p = S.placed[S.placed.length - 1], kind = ANI[p.i][1], nm = t.names[p.i];
  lab.setState({ emo: p.ok ? '✅' : '🤔', title: p.ok ? t.so.right : t.so.wrong, lead: kind === 'fish' ? t.isFish(nm) : t.isMam(nm), body: '', extra: '' });
}
render();
</script>
