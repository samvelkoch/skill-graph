    if (n < 4) {
      html += `<div class="th-note">${esc(u.cardsNote)}</div><div class="chips">${cards.map((cd, i) => (i in placed ? '' :
        `<button class="chip th-c ${S.sel === i ? 'on' : ''} ${S.last?.type === 'bad' && S.last.ci === i ? 'bad' : ''}" data-act="card" data-k="${i}">${esc(cd)}</button>`)).join('')}</div>
        <div class="row2"><button class="btn" data-act="to" data-k="0">${esc(u.topic)}</button><button class="btn" data-act="to" data-k="1">${esc(u.theme)}</button></div>`;
    } else if (si < 2) html += `<div class="row2"><button class="btn" data-act="nextStory">${esc(u.nextStory)}</button></div>`;
    const L = S.last, ttl = t.sort.titles[si];
    if (n === 4) {
      const all = [0, 1, 2].every(storyDone);
      st = { emo: all ? t.sort.all[0] : t.sort.done[0], title: all ? t.sort.all[1] : t.sort.done[1], lead: all ? t.sort.all[2] : t.sort.done[2] };
    } else if (L?.type === 'topic') st = { emo: '📦', title: u.right, lead: t.sort.topicOk(cards[L.ci]) };
    else if (L?.type === 'theme') st = { emo: '💡', title: u.right, lead: t.sort.themeOk(cards[L.ci]) };
    else if (L?.type === 'bad') st = { emo: '🤔', title: u.notq, lead: t.sort.bad };
    else if (L?.type === 'pick') st = { emo: '👆', title: u.pickFirst, lead: t.sort.bad };
    else st = { emo: t.sort.start[0], title: t.sort.start[1], lead: t.sort.start[2] };
    val = `${n}/4`; sub = u.placed; pillTxt = ttl;
  } else if (v === 'pred') {
    const r = t.pred.rounds[S.round], pick = S.rp[S.round], rev = pick !== null;
    html = `<div class="th-cards">${r.sums.map((s, i) => `<div class="th-card"><span class="e">${SCENES[S.round][i]}</span><span>${esc(s)}</span></div>`).join('')}</div>
      <div class="th-note th-spacer">${esc(t.pred.q)}</div><div class="th-opts">${r.opts.map((o, i) =>
      `<button class="th-opt ${rev ? (i === PRED_OK[S.round] ? 'ok' : i === pick ? 'no' : '') : ''}" data-act="pick" data-k="${i}" ${rev ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
    if (rev) html += `<div class="row2"><button class="btn" data-act="nextRound">${esc(S.round === 2 ? u.again : u.nextRound)}</button></div>`;
    const m = r.opts[PRED_OK[S.round]];
    if (!rev) st = { emo: t.pred.start[0], title: t.pred.start[1], lead: t.pred.start[2] };
    else st = { emo: pick === PRED_OK[S.round] ? '✅' : '🔦', title: pick === PRED_OK[S.round] ? u.right : u.notq, lead: pick === PRED_OK[S.round] ? t.pred.right(m) : t.pred.wrong(m), body: S.round === 2 && S.rp.every((x) => x !== null) ? t.pred.end[2] : '' };
    val = `${S.round + 1}/3`; sub = u.round; pillTxt = '';
  } else {
    const r = t.read, rd = S.rd, rev = rd !== null;
    html = `<div class="th-note">${esc(r.q)}</div><div class="th-opts">${r.opts.map((o, i) =>
      `<button class="th-opt ${rev ? (i === READ_OK ? 'ok' : i === rd ? 'no' : '') : ''}" data-act="rd" data-k="${i}" ${rev ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
    if (rev) html += `<div class="th-note th-spacer">${esc(u.readerQ)}</div><div class="th-opts">${r.lines.map((l, i) =>
      `<button class="th-opt ${S.clue === i ? 'on' : ''}" data-act="clue" data-k="${i}">${esc(l)}</button>`).join('')}</div>`;
    if (!rev) st = { emo: r.start[0], title: r.start[1], lead: r.start[2] };
    else if (S.clue !== null) st = { emo: '🔎', title: rd === READ_OK ? u.right : u.notq, lead: r.res[S.clue] };
    else st = { emo: rd === READ_OK ? '✅' : '💭', title: rd === READ_OK ? u.right : u.notq, lead: rd === READ_OK ? r.right[0] : r.wrong[0] };
    val = '2'; sub = u.readers; pillTxt = '';
  }
  html += secretChips(t);
  $('ctrlBody').innerHTML = html;
  lab.setReadout(val, sub, pillTxt);
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body || '', extra: '' });
}
render();
</script>
</body>
</html>
