  }
  GEO.rows = []; GEO.leaves = []; GEO.rowH = rowH; GEO.sx = sx;
  P.rows.forEach((row, i) => {
    const y = y0 + i * rowH;
    GEO.rows.push({ i, y, stem: row.stem });
    if (P.flash === i && time - P.flashAt < 0.5) { c.fillStyle = `rgba(255, 90, 90, ${0.2 * (1 - (time - P.flashAt) / 0.5)})`; c.fillRect(6, y - rowH / 2 + 1, w - 12, rowH - 2); }
    c.strokeStyle = 'rgba(120, 210, 140, .22)'; c.lineWidth = 2; c.lineCap = 'round'; c.beginPath();
    c.moveTo(sx + r, y); c.lineTo(P.two ? w - 8 : w - 8, y); if (P.two) { c.moveTo(sx - r, y); c.lineTo(8, y); } c.stroke();
    for (const side of [1, -1]) {
      const list = side > 0 ? row.R : row.L; if (!list) continue;
      list.forEach((lf, k) => {
        lf.tx = sx + side * (18 + cw / 2 + k * (cw + gap)); lf.ty = y;
        if (!lf.init) { lf.x = lf.tx; lf.y = lf.ty; lf.init = true; }
        else { const e = 1 - Math.exp(-dt * 12); lf.x += (lf.tx - lf.x) * e; lf.y += (lf.ty - lf.y) * e; }
        lf.side = side; GEO.leaves.push(lf);
      });
    }
    if (P.showEmpty && !row.R.length && !(row.L && row.L.length)) {
      c.fillStyle = 'rgba(200, 235, 205, .55)'; c.font = 'italic 600 12px Nunito, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(t.b.noLeaves, sx + r + 12, y + 1);
    }
  });
  P.rows.forEach((row, i) => {
    const y = y0 + i * rowH, lbl = String(row.stem);
    drawNode(c, sx, y, r, lbl);
    if (P.split) {
      c.fillStyle = 'rgba(200, 235, 205, .75)'; c.font = '700 12px Nunito, sans-serif'; c.textAlign = 'right'; c.textBaseline = 'middle';
      c.fillText(row.half ? '5–9' : '0–4', sx - r - 4, y + 1);
    }
  });
  for (const lf of GEO.leaves) drawLeaf(c, lf, cw, hh, (lf.side > 0 ? P.palR : P.palL)[Math.max(0, P.rows.findIndex((rw) => rw.stem === lf.stem && (!P.split || (rw.half === 1) === (+lf.txt >= 5)))) % 6], lf.side, time);
  for (const tg of P.tags) {
    const up = tg.l.y > top + sprout + 28;
    pill(c, tg.text, tg.l.x, tg.l.y + (up ? -hh - 6 : hh + 6), w, { color: tg.color, stroke: tg.color });
  }
  pill(c, P.key, w / 2, h - 17, w, { font: '700 13px Nunito, sans-serif' });
});

// --- input ---------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const nearest = (x, y) => {
  let best = null, bd = 22;
  for (const l of GEO.leaves) { const d = Math.hypot(l.x - x, l.y - y); if (d < bd) { bd = d; best = l; } }
  return best;
};
const placeLeaf = (b, quick) => {
  const lf = b.leaves[b.next], ch = GEO.chips[b.next] || { x: GEO.sx, y: 20 };
  lf.placed = true; lf.seq = b.k++; lf.x = ch.x; lf.y = ch.y; lf.init = true; b.next++; b.miss = 0;
  if (!quick) sfx.snap();
  if (b.next >= b.leaves.length) { b.ph = EMPTY_B.length ? 'empty' : 'sort'; sfx.good(); showStage(); }
};
$('cv').addEventListener('pointerdown', (ev) => {
  const rc = $('cv').getBoundingClientRect(), x = ev.clientX - rc.left, y = ev.clientY - rc.top, v = lab.view;
  if (v === 'build') {
    const b = S.b; if (b.ph !== 'place') return;
    const row = GEO.rows.find((q) => Math.abs(q.y - y) <= GEO.rowH / 2); if (!row) return;
    if (row.stem === b.leaves[b.next].stem) placeLeaf(b, false);
    else { b.miss++; b.flash = row.i; b.flashAt = performance.now() / 1000; sfx.bad(); }
    render(); return;
  }
  const lf = nearest(x, y); if (!lf) return;
  if (v === 'read') {
    const r = S.r;
    if (r.sec === 'time') {
      r.tSel = lf;
      if (r.tAns !== 'ok') r.tAns = lf === TARGET_T ? 'ok' : 'no';
      (lf === TARGET_T ? sfx.good : sfx.tick)();
    } else if (r.ph === 'guess') { r.guess = lf; r.pick = null; sfx.tick(); }
    else if (r.ph === 'count') { if (lf === READ[r.cnt] && r.cnt < READ.length) { r.msg = null; r.cnt++; r.pick = null; sfx.tick(); } else sfx.bad(); }
    else return;
  } else { S.t.sel = { l: lf, side: lf.side > 0 ? 1 : 0 }; sfx.tick(); }
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, b = S.b, r = S.r, t = S.t;
  if (a === 'bg') { b.guess = +el.dataset.s; b.ph = 'place'; sfx.click(); }
  else if (a === 'brest') { while (b.next < b.leaves.length) placeLeaf(b, true); sfx.snap(); }
  else if (a === 'be') { b.eAns = el.dataset.v; b.ph = 'sort'; (b.eAns === 'keep' ? sfx.good : sfx.bad)(); }
  else if (a === 'bsort') { b.sorted = true; b.ph = 'done'; sfx.good(); showStage(); }
  else if (a === 'bagain') { Object.assign(b, { ph: 'predict', guess: null, leaves: mk(BUILD_ORDER), next: 0, k: 0, miss: 0, flash: -1, sorted: false, eAns: null }); sfx.click(); }
  else if (a === 'rcount') { r.ph = 'count'; r.cnt = 0; r.pick = null; sfx.click(); }
  else if (a === 'rnext') { r.msg = null; if (r.cnt < READ.length) { r.cnt++; r.pick = null; sfx.tick(); } }
  else if (a === 'rback') { r.msg = null; if (r.cnt > 0) { r.cnt--; sfx.tick(); } }
  else if (a === 'rstop') {
    r.msg = null; r.pick = null;
    if (r.cnt - 1 === READ.length - r.cnt) { r.ph = 'found'; r.pick = null; sfx.good(); showStage(); } else { r.msg = [r.cnt - 1, READ.length - r.cnt]; sfx.bad(); }
  }
  else if (a === 'ragain') { Object.assign(r, { ph: 'guess', guess: null, cnt: 0, pick: null, msg: null }); sfx.click(); }
  else if (a === 'rpick') { r.pick = r.pick === el.dataset.k ? null : el.dataset.k; sfx.tick(); }
  else if (a === 'rsec') {
    if (!secret.unlocked()) { secret.open(); return; }
    const k = el.dataset.k; r.sec = r.sec === k ? null : k; r.pick = null; r.tSel = null; r.tAns = null; sfx.click();
  }
  else if (a === 'tg') { t.guess = el.dataset.g; sfx.click(); }
  else if (a === 'tfind') { t.shown = true; sfx.good(); showStage(); }
  else if (a === 'tagain') { Object.assign(t, { guess: null, shown: false, sel: null }); sfx.click(); }
  render();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
const verdictB = (t) => (S.b.guess === LONG_B ? t.b.vRight(rowName(LONG_B), K_B) : t.b.vWrong(rowName(S.b.guess), rowName(LONG_B), K_B));
function render() {
  const t = T[lang], v = lab.view;
  if (v === 'build') renderBuild(t); else if (v === 'read') renderRead(t); else renderTwo(t);
  lab.setFacts(t.facts[v === 'build' ? 'b' : v === 'read' ? 'r' : 't']);
}
function renderBuild(t) {
  const b = S.b, n = b.leaves.length, placedN = b.next, extra = `<div class="fine">${esc(t.made)}</div>`, G = '#6fcf8f';
  lab.setGlow('rgba(111, 207, 143, .26)');
  let ctl = '', st;
  const yg = b.guess === null ? '' : `<p class="sl-note">${esc(t.yg)}: ${rowName(b.guess)}</p>`;
  if (b.ph === 'predict') {
    ctl = `<div class="sl-q">${esc(t.b.q)}</div><div class="sl-opts">${STEMS_B.map((s) => `<button class="sl-opt" data-act="bg" data-s="${s}">${rowName(s)}</button>`).join('')}</div>`;
    lab.setReadout(n, t.b.subList, '', G);
    st = { emo: '🤔', title: t.b.q, lead: t.b.qLead };
  } else if (b.ph === 'place') {
    const cur = b.leaves[b.next], o = cur.v % 10;
    ctl = yg + (placedN >= 6 ? `<div class="sl-row"><button class="chip" data-act="brest">${esc(t.b.rest)}</button></div>` : '');
    lab.setReadout(`${placedN}/${n}`, t.b.subPlaced, '', G);
    st = { emo: '🌱', title: t.b.placeT(cur.v), lead: b.miss === 0 ? t.b.placeL : b.miss === 1 ? t.b.hint1(cur.v) : t.b.hint2(cur.v, cur.stem, o) };
  } else if (b.ph === 'empty') {
    const s = EMPTY_B[0];
    ctl = `<div class="sl-q">${esc(t.b.eQ(rowName(s), s))}</div><div class="sl-opts two"><button class="sl-opt" data-act="be" data-v="keep">${esc(t.b.eKeep)}</button><button class="sl-opt" data-act="be" data-v="drop">${esc(t.b.eDrop)}</button></div>`;
    lab.setReadout(n, t.b.subPlaced, '', G);
    st = { emo: '🌿', title: verdictB(t), lead: t.b.eQ(rowName(s), s) };
  } else {
    const s = EMPTY_B[0], done = b.ph === 'done', mn = BS[0], mx = BS[BS.length - 1];
    const ev = s === undefined ? null : { title: b.eAns === 'keep' ? t.b.eRight : t.b.eWrong, lead: t.b.eWhy(rowName(s - 1), rowName(s + 1)) };
    if (!done) ctl = `<p class="sl-note">${esc(t.b.sortL)}</p><div class="sl-row"><button class="btn" data-act="bsort">${esc(t.b.sortBtn)}</button></div>`;
    else ctl = `<div class="sl-row"><button class="btn" data-act="bagain">${esc(t.b.again)}</button></div>`;
    lab.setReadout(done ? n : `${n}/${n}`, done ? t.b.subDone : t.b.subPlaced, done ? `${mn} … ${mx}` : '', G);
    st = done ? { emo: '🍃', title: t.b.doneT, lead: t.b.doneL(mn, mx, MED_B, (BS.length - 1) >> 1), body: verdictB(t) }
      : { emo: b.eAns === 'keep' || !ev ? '✅' : '🤔', title: ev ? ev.title : verdictB(t), lead: ev ? ev.lead : t.b.sortL, body: verdictB(t) };
  }
  $('ctl').innerHTML = ctl;
  lab.setState({ ...st, body: st.body ?? '', extra });
}
function renderRead(t) {
  const r = S.r, n = READ.length, G = '#6fcf8f', u = t.unit;
  lab.setGlow('rgba(95, 200, 160, .24)');
  const lock = (k, emo) => { const open = secret.unlocked(); return `<button class="chip secret ${open ? 'open' : ''} ${r.sec === k ? 'on' : ''}" data-act="rsec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`; };
  const pk = (k) => `<button class="chip ${r.pick === k ? 'on' : ''}" data-act="rpick" data-k="${k}">${esc(t.r[k])}</button>`;
  const chips = `<div class="sl-row">${r.sec === 'time' ? '' : pk('min') + pk('max') + pk('row')}${lock('split', '✂️')}${lock('time', '🚆')}</div>`;
  let ctl = '', st, extra = `<div class="fine">${esc(t.made)}</div>`;
  if (r.sec === 'time') {
    lab.setReadout(TIME.length, t.r.subBus, '', G);
    if (r.tAns === 'ok') st = { emo: '✅', title: t.r.tRight(TARGET_T.h, TARGET_T.txt), lead: t.r.timeL };
    else if (r.tAns === 'no') st = { emo: '🤔', title: t.r.tWrong(fmtT(r.tSel)), lead: t.r.tWrongL };
    else st = { emo: '🚆', title: t.r.task, lead: t.r.timeL };
    extra = '';
    $('ctl').innerHTML = chips;
    lab.setState({ ...st, body: '', extra });
    return;
  }
  if (r.ph === 'guess') {
    ctl = `<div class="sl-row"><button class="btn" data-act="rcount"${r.guess ? '' : ' disabled'}>${esc(t.r.cBtn)}</button></div>`;
    lab.setReadout('?', t.r.subQ, '', G);
    st = r.guess ? { emo: '🤔', title: t.r.gSet(r.guess.v), lead: t.r.gSetL } : { emo: '🤔', title: t.r.gT, lead: t.r.gL };
  } else if (r.ph === 'count') {
    ctl = `<div class="sl-row"><button class="sl-opt" style="flex:0 0 52px" data-act="rback"${r.cnt ? '' : ' disabled'}>${esc(t.r.back)}</button><button class="btn grow" data-act="rnext"${r.cnt >= n ? ' disabled' : ''}>${esc(t.r.next)}</button></div>
      <div class="sl-row"><button class="btn grow" data-act="rstop"${r.cnt ? '' : ' disabled'}>${esc(t.r.stop)}</button></div>`;
    lab.setReadout(r.cnt, t.r.subCnt, '', G);
    st = r.msg ? { emo: '⚖️', title: t.r.unbal(r.msg[0], r.msg[1]), lead: r.msg[1] > r.msg[0] ? t.r.more : t.r.less } : { emo: '🔢', title: t.r.cT(r.cnt), lead: t.r.cL };
  } else {
    ctl = `<div class="sl-row"><button class="btn" data-act="ragain">${esc(t.b.again)}</button></div>`;
    const b = MID_R, right = r.guess && r.guess.v === MED_R.v;
    lab.setReadout(MED_R.v, t.r.subMed, t.r.pillF(b), G);
    st = { emo: right ? '✅' : '🎯', title: right ? t.r.foundR(MED_R.v) : t.r.foundW(MED_R.v, r.guess ? r.guess.v : '–'), lead: t.r.foundL(b), body: MED_R.stem !== LONG_R ? t.r.foundB(rowName(LONG_R), rowName(MED_R.stem)) : '' };
  }
  if (r.pick === 'min') st = { emo: '🔻', title: t.r.minT(READ[0].v), lead: t.r.minL };
  else if (r.pick === 'max') st = { emo: '🔺', title: t.r.maxT(READ[n - 1].v), lead: t.r.maxL(READ[n - 1].v - READ[0].v) };
  else if (r.pick === 'row') st = { emo: '🌿', title: t.r.rowT(rowName(LONG_R)), lead: t.r.rowL(K_R, n) };
  else if (r.sec === 'split') {
    const s = 4, ls = READ.filter((l) => l.stem === s), lo = ls.filter((l) => +l.txt < 5).length;
    st = { ...st, body: [st.body, `✂️ ${t.r.splitT}. ${t.r.splitL(s, lo, ls.length - lo, STEMS_R.length * 2)}`].filter(Boolean).join(' ') };
  }
  $('ctl').innerHTML = ctl + chips;
  lab.setState({ ...st, body: st.body ?? '', extra });
}
function renderTwo(t) {
  const s = S.t, nm = t.t.names, G = '#6fcf8f', extra = `<div class="fine">${esc(t.made)}</div>`;
  lab.setGlow('rgba(233, 200, 90, .22)');
  const opts = [[nm[0], 'A'], [nm[1], 'B'], [t.t.same, 'S']];
  const nameOf = (g) => (g === 'A' ? nm[0] : g === 'B' ? nm[1] : t.t.same);
  const win = MED_A.v > MED_B2.v ? 'A' : MED_A.v < MED_B2.v ? 'B' : 'S';
  let ctl, st;
  if (s.guess === null) {
    ctl = `<div class="sl-q">${esc(t.t.q)}</div><div class="sl-opts">${opts.map(([l, k]) => `<button class="sl-opt" data-act="tg" data-g="${k}">${esc(l)}</button>`).join('')}</div>`;
    lab.setReadout(`${TWO_A.length} | ${TWO_B.length}`, t.t.sub, '', G);
    st = { emo: '🤔', title: t.t.q, lead: t.t.qL };
  } else if (!s.shown) {
    ctl = `<p class="sl-note">${esc(t.yg)}: ${esc(nameOf(s.guess))}</p><div class="sl-row"><button class="btn" data-act="tfind">${esc(t.t.find)}</button></div>`;
    lab.setReadout(`${TWO_A.length} | ${TWO_B.length}`, t.t.sub, '', G);
    st = { emo: '🤔', title: t.yg + ': ' + nameOf(s.guess), lead: t.t.gSetL };
    if (s.sel) st = { emo: '👆', title: t.t.read(nm[s.sel.side], s.sel.l.stem, s.sel.l.txt, s.sel.l.v, t.unit), lead: t.t.gSetL };
  } else {
    ctl = `<div class="sl-row"><button class="btn" data-act="tagain">${esc(t.t.again)}</button></div>`;
    lab.setReadout(`${MED_A.v} | ${MED_B2.v}`, t.t.sub, t.t.pill(MED_A.v, MED_B2.v), G);
    const right = s.guess === win, mx = MAX_A > MAX_B ? 0 : 1;
    st = { emo: right ? '✅' : '🎯', title: right ? t.t.vR(nameOf(win)) : t.t.vW(nameOf(win)), lead: t.t.vL(nm[0], `${MED_A.v} ${t.unit}`, nm[1], `${MED_B2.v} ${t.unit}`), body: win !== (mx ? 'B' : 'A') ? t.t.vB(nm[mx], `${Math.max(MAX_A, MAX_B)} ${t.unit}`) : '' };
  }
  $('ctl').innerHTML = ctl;
  lab.setState({ ...st, body: st.body ?? '', extra });
}
render();
</script>
</body>
