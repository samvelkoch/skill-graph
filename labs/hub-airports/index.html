    if (S.a && S.b) { const r = detour(S.a, S.b); return lab.setReadout(t.extra(pf(r.p)), t.dists(nf(r.d), nf(r.v)), t.pair(S.a, S.b), GOLD); }
    return lab.setReadout('—', t.tapTwo, S.a ?? '', GOLD);
  }
  if (ph === 'ask') return lab.setReadout('?', '', '', RED);
  const kR = ph === 'done' ? 28 : S.kR ?? 0, kL = ph === 'done' ? 7 : S.kL ?? 0;
  return lab.setReadout(t.hubHit(kR, 28), '', t.directHit(kL, 28), RED);
}
function renderAsk(v, ph, t) {
  const q = { routes: t.routesAsk, detour: t.detourAsk, storm: t.stormAsk }[v], opts = { routes: t.routesOpts, detour: t.detourOpts, storm: t.stormOpts }[v];
  const right = { routes: t.routesRight, detour: t.detourRight, storm: t.stormRight }[v], wrong = { routes: t.routesWrong, detour: t.detourWrong, storm: t.stormWrong }[v];
  const pick = S.pk[v], row = opts.every((o) => o.length <= 4);
  $('haAsk').innerHTML = `<div class="ha-q">${esc(q)}</div><div class="ha-opts${row ? ' ha-row' : ''}">${opts.map((o, i) => {
    const cls = pick === undefined ? '' : i === RIGHT[v] ? ' ha-good' : i === pick ? ' ha-bad' : ' ha-dim';
    return `<button type="button" class="ha-opt${cls}" data-act="pick" data-i="${i}"${pick === undefined ? '' : ' disabled'}>${esc(o)}</button>`;
  }).join('')}</div>${pick === undefined ? '' : `<div class="ha-vd ${pick === RIGHT[v] ? 'ha-ok' : 'ha-no'}">${esc(pick === RIGHT[v] ? right : wrong)}</div>`}`;
}
function render() {
  const t = T[lang], v = lab.view, ph = phase(v), done = ph === 'done';
  document.body.dataset.v = v;
  renderAsk(v, ph, t);
  show($('haC1'), v === 'routes' && done); show($('haC2'), v === 'detour' && done); show($('haC3'), v === 'storm' && done);
  show($('haSecW'), done);
  // routes controls
  const r = net(S.n);
  $('haMode').innerHTML = [[0, t.direct], [1, t.viaHub]].map(([m, l]) => `<button type="button" data-act="mode" data-m="${m}" class="${S.mode === m ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('haN').textContent = t.nCities(S.n); $('haR').setAttribute('aria-label', t.cities); if (+$('haR').value !== S.n) $('haR').value = S.n;
  $('haBt1').textContent = t.nRoutes(S.mode ? r.hubR : r.dirR); $('haBt2').textContent = t.seats(S.mode ? r.hubFill : r.dirFill);
  $('haBf1').style.width = `${100 * (S.mode ? r.hubR : r.dirR) / net(12).dirR}%`; $('haBf2').style.width = `${S.mode ? r.hubFill : r.dirFill}%`;
  $('haBf1').classList.toggle('ha-hubc', !!S.mode); $('haBf2').classList.toggle('ha-hubc', !!S.mode);
  $('haHint').textContent = t.tapTwo;
  // the two secret experiments
  const open = secret.unlocked();
  $('haSecChips').innerHTML = [['a', '📦'], ['b', '🌐']].map(([k, e]) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setGlow({ routes: 'rgba(76, 201, 240, .26)', detour: 'rgba(244, 162, 97, .26)', storm: 'rgba(230, 57, 70, .26)' }[v]);
  readout();
  if (S.sec) {
    lab.setState({ emo: S.sec === 'a' ? '📦' : '🌐', title: t.secrets[S.sec][0], lead: S.sec === 'a' ? t.fedexText : t.turkText, body: '', extra: '' });
    lab.setFacts(done ? t.facts[v] : []); return;
  }
  if (ph === 'ask') {
    lab.setState({ emo: '🤔', title: { routes: t.routesAsk, detour: t.detourAsk, storm: t.stormAsk }[v], lead: '', body: '', extra: '' }); lab.setFacts([]); return;
  }
  const [emo, title, lead, body] = t.st[v];
  lab.setState({ emo, title, lead, body, extra: '' }); lab.setFacts(t.facts[v]);
}
canvasStart();
render();
