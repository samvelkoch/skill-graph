<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People — shared module</title>
<style>
  :root { --bg: #f6f3ec; --ink: #2a2633; --mute: #6b6577; --line: #e4ded2; }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 40px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  h2 { font-size: 16px; margin: 26px 0 6px; }
  p.note { color: var(--mute); margin: 2px 0 10px; font-size: 13px; }
  .strip { overflow-x: auto; max-width: 100%; border-radius: 12px; margin: 6px 0; -webkit-overflow-scrolling: touch; }
  .strip canvas { display: block; }
  .lbl { font-size: 12px; color: var(--mute); margin: 10px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px 8px; margin-top: 6px; }
  .cell { text-align: center; font-size: 12px; color: var(--mute); }
  .cell .strip { margin: 0 auto 2px; width: 100px; }
  .err { color: #b3261e; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; margin: 6px 0; }
  footer { margin-top: 26px; color: var(--mute); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>People — the shared module</h1>
  <p class="note">Module <code>labs/people.js</code>. Wide strips scroll sideways.</p>

  <h2>1. Line-up at 300, 120 and 60 px</h2>
  <div id="lineup"></div>

  <h2>2. Moods</h2>
  <div id="moods"></div>

  <h2>3. Ages, outfits, shoes</h2>
  <div id="variety"></div>

  <h2>4. Hair and arms</h2>
  <div id="more"></div>

  <footer id="perf"></footer>
</main>
<script type="module">
import { drawPerson, ARMS, MOODS, HAIR_STYLES, HEIGHTS } from './people.js';

const SKY = ['#d3eaf7', '#c2e1f2'], GROUND = '#ead9ac', NIGHT = ['#1a2140', '#232c52'], NGROUND = '#2b2f45';

const CREW = [
  { age: 'adult', skin: '#e3ad80', hair: '#2a1b14', hairStyle: 'side', outfit: 'jacket', top: '#3f6fb0', inner: '#f3efe6', bottom: '#3d4a5e', shoe: { kind: 'loafer', col: '#6a3f24' }, mood: 'smile', w: 0.5 },
  { age: 'child', skin: '#f2c6a0', hair: '#6a4328', hairStyle: 'pigtails', outfit: 'dress', top: '#ee9db0', shoe: { kind: 'flat', col: '#d6455f' }, mood: 'laugh', lashes: true, arms: { l: ARMS.open, r: ARMS.open }, w: 0.6 },
  { age: 'teen', skin: '#c68a5c', hair: '#1e1410', hairStyle: 'spiky', outfit: 'hoodie', top: '#5fae7a', bottom: '#2f3d66', shoe: { kind: 'hightop', col: '#e9564f' }, mood: 'thinking', glasses: 'square', arms: { l: ARMS.down, r: ARMS.chin }, w: 0.46 },
  { age: 'older', skin: '#f0cfb3', hair: '#cfcac4', hairStyle: 'bun', outfit: 'cardigan', top: '#8d6aa8', inner: '#f6e7d3', lower: 'skirt', bottom: '#5b5568', tights: '#8a7f8e', shoe: { kind: 'flat', col: '#4a3a46' }, mood: 'calm', glasses: 'round', w: 0.5 },
  { age: 'toddler', skin: '#8d5a3b', hair: '#1e1410', hairStyle: 'curly', outfit: 'tee', top: '#ffd34d', lower: 'shorts', bottom: '#3f6fc0', shoe: { kind: 'sandal', col: '#e7a33a' }, mood: 'surprised', arms: { l: ARMS.up, r: ARMS.up }, w: 0.62 },
  { age: 'child', skin: '#f6d3b3', hair: '#e4c56e', hairStyle: 'short', outfit: 'uniform', top: '#2c3e70', bottom: '#4a4f5e', tie: '#c0392b', shoe: { kind: 'loafer', col: '#2a2630' }, mood: 'worried', freckles: true, w: 0.46 },
  { age: 'adult', skin: '#f6d3b3', hair: '#c98a35', hairStyle: 'long', outfit: 'tee', top: '#d86a7a', bottom: '#4a6ea8', shoe: { kind: 'sneaker', col: '#f2f0ea' }, mood: 'open', lashes: true, arms: { l: ARMS.down, r: ARMS.wave }, w: 0.56 },
  { age: 'child', skin: '#6b432c', hair: '#151010', hairStyle: 'braids', outfit: 'sweater', top: '#3fa7a0', lower: 'skirt', bottom: '#3a3f6a', tights: '#f0a83c', shoe: { kind: 'rain', col: '#e9564f' }, mood: 'sad', lashes: true, w: 0.5 },
  { age: 'older', skin: '#c99a76', hair: '#d9d6d0', hairStyle: 'bald', outfit: 'sweater', top: '#9a5a3c', bottom: '#4b4f5c', shoe: { kind: 'boot', col: '#5c3a24' }, mood: 'angry', arms: { l: ARMS.hips, r: ARMS.hips }, w: 0.58 },
  { age: 'teen', skin: '#e3ad80', hair: '#a8372a', hairStyle: 'pony', outfit: 'jacket', top: '#e0794f', inner: '#2b2f4a', bottom: '#2b2f4a', build: 'slim', shoe: { kind: 'sneaker', col: '#2f6fd6' }, mood: 'smile', lashes: true, w: 0.5 },
];

function canvasFor(host, cssW, cssH) {
  const cv = document.createElement('canvas'), dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  const wrap = document.createElement('div'); wrap.className = 'strip'; wrap.appendChild(cv); host.appendChild(wrap);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); return c;
}
function scene(c, w, hgt, dark, groundY) {
  const g = c.createLinearGradient(0, 0, 0, hgt), col = dark ? NIGHT : SKY; g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
  c.fillStyle = g; c.fillRect(0, 0, w, hgt); c.fillStyle = dark ? NGROUND : GROUND; c.fillRect(0, groundY, w, hgt - groundY);
}
// people standing in a row; h is the height of an adult
function row(host, people, h, dark, minW) {
  const gap = h * 0.08, pad = h * 0.2, widths = people.map((p) => h * (p.w || 0.5) * (HEIGHTS[p.age] || 1));
  const need = pad * 2 + widths.reduce((s, w) => s + w + gap, 0), W = Math.max(minW || 0, Math.ceil(need));
  const Hc = Math.ceil(h * 1.34), gy = Math.round(h * 1.24); // room for raised hands and tall hair
  const c = canvasFor(host, W, Hc);
  scene(c, W, Hc, dark, gy - h * 0.03);
  let x = pad + (W - need) / 2;
  people.forEach((p, i) => {
    drawPerson(c, x + widths[i] / 2, gy, h * (HEIGHTS[p.age] || 1), { ...p, rim: dark ? true : undefined });
    x += widths[i] + gap;
  });
}
function label(host, t) { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = t; host.appendChild(d); }
const vw = () => Math.min(document.querySelector('main').clientWidth - 32, 1068);

function drawLineup(host) {
  for (const h of [300, 120, 60]) for (const dark of [false, true]) {
    label(host, `${h} px · ${dark ? 'dark background, with rim' : 'light background'}`);
    row(host, CREW, h, dark, vw());
  }
}
function drawMoods(host) {
  const base = { age: 'child', skin: '#e9b48c', hair: '#4a2e1e', hairStyle: 'bob', outfit: 'tee', top: '#7a8ee0', bottom: '#34406b', pose: 'straight', w: 0.5 };
  label(host, 'Close-up: head and shoulders');
  const grid = document.createElement('div'); grid.className = 'grid'; host.appendChild(grid);
  MOODS.forEach((m, i) => {
    const cell = document.createElement('div'); cell.className = 'cell'; grid.appendChild(cell);
    const c = canvasFor(cell, 100, 112), H = 280;
    scene(c, 100, 112, false, 999);
    const kid = i % 2 ? { ...base, hairStyle: 'short', skin: '#c68a5c', hair: '#1e1410', top: '#e0794f' } : base;
    drawPerson(c, 50, 14 + H, H, { ...kid, mood: m, noShadow: true, lashes: i % 2 === 0 });
    cell.appendChild(document.createTextNode(m));
  });
  const list = MOODS.map((m) => ({ ...base, mood: m, arms: m === 'thinking' ? { l: ARMS.down, r: ARMS.chin } : m === 'angry' ? { l: ARMS.hips, r: ARMS.hips } : m === 'laugh' ? { l: ARMS.open, r: ARMS.open } : undefined }));
  label(host, 'The same child at 80 px and at 46 px (a child in a 60 px line-up)');
  row(host, list, 105, false, vw());
  row(host, list, 60, false, vw());
  row(host, list, 60, true, vw());
}
function drawVariety(host) {
  const ages = ['toddler', 'child', 'teen', 'adult', 'older'].map((a, i) => ({ age: a, skin: '#d9a27a', hair: a === 'older' ? '#cfcac4' : '#3a2a20', hairStyle: ['curly', 'short', 'wavy', 'side', 'buzz'][i], outfit: 'tee', top: '#4f8fd0', bottom: '#34406b', w: 0.5 }));
  label(host, 'Ages: toddler, child, teen, adult, older');
  row(host, ages, 200, false, vw());
  const builds = ['slim', 'average'].flatMap((b) => [
    { age: 'adult', build: b, skin: '#f0c8a6', hair: '#2a1b14', hairStyle: 'short', outfit: 'tee', top: '#e0794f', bottom: '#34406b', w: 0.5 },
    { age: 'child', build: b, skin: '#8d5a3b', hair: '#151010', hairStyle: 'afro', outfit: 'tee', top: '#5fae7a', lower: 'shorts', bottom: '#3d4a7a', w: 0.6 },
  ]);
  label(host, 'Build: slim, average');
  row(host, builds, 200, false, vw());
  const skins = ['#f2c6a0', '#c68a5c', '#f6d3b3', '#8d5a3b', '#e3ad80', '#f0cfb3', '#6b432c'], hairs = ['#6a4328', '#1e1410', '#e4c56e', '#151010', '#a8372a', '#3a2a20', '#151010'];
  const tops = ['#e9564f', '#5fae7a', '#e7a33a', '#3f6fb0', '#8d6aa8', '#2c3e70', '#f2b34d'], hs = ['short', 'spiky', 'bob', 'curly', 'pony', 'side', 'braids'];
  const outfits = ['tee', 'hoodie', 'sweater', 'jacket', 'cardigan', 'uniform', 'dress'].map((f, i) => ({ age: 'child', outfit: f, skin: skins[i], hair: hairs[i], hairStyle: hs[i], top: tops[i], bottom: '#34406b', lower: i === 2 ? 'skirt' : i === 1 ? 'shorts' : 'trousers', tights: i === 2 ? '#4a4660' : undefined, w: 0.54 }));
  label(host, 'Outfits: tee, hoodie, sweater, jacket, cardigan, uniform, dress');
  row(host, outfits, 220, false, vw());
  row(host, outfits, 150, true, vw());
  const sc = ['#e9564f', '#2f6fd6', '#7a4a2c', '#f2c230', '#3a2c28', '#c0466f', '#4c9a6a'];
  const shoes = ['sneaker', 'hightop', 'boot', 'rain', 'loafer', 'flat', 'sandal'].map((k, i) => ({ age: 'child', skin: '#e9b48c', hair: '#4a2e1e', hairStyle: 'short', outfit: 'tee', top: '#9ab0c8', lower: i > 4 ? 'skirt' : 'shorts', bottom: '#4a5576', shoe: { kind: k, col: sc[i] }, w: 0.54 }));
  label(host, 'Shoes with bare legs: sneaker, high-top, boot, rain boot, loafer, flat, sandal');
  row(host, shoes, 260, false, vw());
  row(host, shoes, 150, true, vw());
  label(host, 'The same shoes with trousers');
  row(host, shoes.map((p) => ({ ...p, lower: 'trousers' })), 260, false, vw());
  row(host, shoes.map((p) => ({ ...p, lower: 'trousers' })), 150, true, vw());
}
function drawMore(host) {
  const hc = ['#4a2e1e', '#1e1410', '#e4c56e', '#a8372a', '#151010', '#6a4328', '#c98a35'];
  const styles = HAIR_STYLES.map((s, i) => ({ age: i % 3 === 2 ? 'adult' : 'child', hairStyle: s, hair: hc[i % hc.length], skin: ['#f2c6a0', '#c68a5c', '#8d5a3b'][i % 3], outfit: i % 2 ? 'tee' : 'sweater', top: ['#7a8ee0', '#e0794f', '#5fae7a'][i % 3], bottom: '#34406b', w: 0.6 }));
  label(host, 'Hair: ' + HAIR_STYLES.join(', '));
  row(host, styles, 230, false, vw());
  row(host, styles, 110, true, vw());
  const names = Object.keys(ARMS);
  const poses = names.map((n, i) => ({ age: i % 2 ? 'adult' : 'child', skin: '#e9b48c', hair: '#4a2e1e', hairStyle: 'short', outfit: i % 3 === 0 ? 'sweater' : 'tee', top: '#4f8fd0', bottom: '#34406b', arms: { l: ARMS[n], r: ARMS[n] }, w: 0.9 }));
  label(host, 'Arms, both sides: ' + names.join(', '));
  row(host, poses, 200, false, vw());
  row(host, poses, 110, true, vw());
}
function perf() {
  // in the page and sized in CSS px, so the figure is measured at the detail level a lab would use
  const cv = document.createElement('canvas'); cv.width = 800; cv.height = 600; cv.style.cssText = 'position:fixed;left:-9999px;top:0;width:400px;height:300px';
  document.body.appendChild(cv); const c = cv.getContext('2d'); c.setTransform(2, 0, 0, 2, 0, 0);
  const pass = (rim) => {
    for (let k = 0; k < 3; k++) for (const p of CREW) drawPerson(c, 200, 290, 120, p);
    c.getImageData(0, 0, 1, 1);
    const t0 = performance.now(); let n = 0;
    for (let k = 0; k < 20; k++) for (const p of CREW) { drawPerson(c, 200, 290, 120 * (HEIGHTS[p.age] || 1), rim ? { ...p, rim: true } : p); n++; }
    c.getImageData(0, 0, 1, 1);
    return (performance.now() - t0) / n;
  };
  const plain = pass(false), rimmed = pass(true); cv.remove();
  document.getElementById('perf').textContent = `Speed on this device, a 120 px line-up figure at 2× pixel density: ${plain.toFixed(2)} ms plain, ${rimmed.toFixed(2)} ms with rim.`;
}
function section(id, fn) {
  const host = document.getElementById(id); host.textContent = '';
  try { fn(host); } catch (e) {
    const d = document.createElement('div'); d.className = 'err'; d.textContent = id + ': ' + (e && e.stack ? e.stack : e); host.appendChild(d);
  }
}
function all() {
  section('lineup', drawLineup); section('moods', drawMoods); section('variety', drawVariety); section('more', drawMore);
  try { perf(); } catch (e) { document.getElementById('perf').textContent = 'perf: ' + e; }
}
all();
let rt, lastW = innerWidth;
addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(all, 200); });
</script>
</body>
</html>
