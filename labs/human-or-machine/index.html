  else { const [emo, ti_, lead, body] = t.st.chat; lab.setState({ emo, title: ti_, lead, body, extra: '' }); lab.setFacts(t.facts.chat); }
}
function renderTeam(t) {
  const m = S.tm, pick = m.pick;
  $('hmTeam').innerHTML = askBlock(t.teamAsk, t.teamOpts, TEAM_RIGHT, pick, pick === TEAM_RIGHT ? t.teamRight : t.teamWrong)
    + (m.done ? `<div class="row2"><button class="btn" data-act="teamAgain">↺ ${esc(t.again)}</button></div>` : '');
  if (S.sec) return;
  lab.setReadout(pick === null ? '?' : esc(t.teamVal), '', t.illus, '#13a398');
  if (pick === null) { lab.setState(predState(t.teamAsk)); lab.setFacts([]); }
  else { const [emo, ti_, lead, body] = t.st.team; lab.setState({ emo, title: ti_, lead, body, extra: '' }); lab.setFacts(t.facts.team); }
}
render();
</script>
