// --- the compass inset -------------------------------------------------------------------------------------
function compassBig(c, cx, cy, R, o) {
  const L = T[lang].dl;
  c.save();
  c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = R * 0.35; c.shadowOffsetX = R * 0.08; c.shadowOffsetY = R * 0.14;
  disc(c, cx, cy, R, '#b8862a'); c.restore();
  disc(c, cx, cy, R, grad(c.createLinearGradient(cx - R, cy - R, cx + R, cy + R), [[0, '#fbe9a8'], [0.45, '#d9a93c'], [1, '#8c6218']]), '#5a3f0f', 2);
  // rim: ticks and the "you face" marker turn with the child
  c.save(); c.translate(cx, cy); c.rotate(rad(o.head));
  c.strokeStyle = '#5a3f0f';
  for (let a = 0; a < 360; a += 15) {
    const big = a % 90 === 0, r1 = R * (big ? 0.88 : 0.93), r2 = R * 0.985;
    c.lineWidth = big ? 2 : 1; c.beginPath(); c.moveTo(Math.sin(rad(a)) * r1, -Math.cos(rad(a)) * r1); c.lineTo(Math.sin(rad(a)) * r2, -Math.cos(rad(a)) * r2); c.stroke();
  }
  c.fillStyle = '#e5484d'; c.strokeStyle = '#5a1a1a'; c.lineWidth = 1.4;
  c.beginPath(); c.moveTo(0, -R * 1.2); c.lineTo(R * 0.14, -R * 0.97); c.lineTo(-R * 0.14, -R * 0.97); c.closePath(); c.fill(); c.stroke();
  c.restore();
  // the floating card: letters stay with north and swing with the needle
  c.save(); c.translate(cx, cy); c.rotate(rad(o.wob));
  const cr = R * 0.84;
  disc(c, 0, 0, cr, grad(c.createRadialGradient(-cr * 0.25, -cr * 0.3, cr * 0.05, 0, 0, cr), [[0, '#fffdf2'], [1, '#e9ddbb']]), '#7a5a1c', 1.5);
  c.strokeStyle = 'rgba(122,90,28,.5)'; c.lineWidth = 1;
  for (let a = 45; a < 360; a += 90) { c.beginPath(); c.moveTo(Math.sin(rad(a)) * cr * 0.5, -Math.cos(rad(a)) * cr * 0.5); c.lineTo(Math.sin(rad(a)) * cr * 0.78, -Math.cos(rad(a)) * cr * 0.78); c.stroke(); }
  const fs = Math.max(12, Math.round(R * 0.27));
  c.font = `900 ${fs}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const lw = (i) => c.measureText(L[i]).width;
  c.fillStyle = '#d03a2e'; c.fillText(L[0], 0, -(cr - 3 - fs / 2));
  c.fillStyle = '#2b3350'; c.fillText(L[4], 0, cr - 3 - fs / 2);
  c.fillText(L[2], cr - 4 - lw(2) / 2, 0); c.fillText(L[6], -(cr - 4 - lw(6) / 2), 0);
  const nl = R * 0.5;
  c.beginPath(); c.moveTo(0, -nl); c.lineTo(R * 0.1, 0); c.lineTo(-R * 0.1, 0); c.closePath();
  c.fillStyle = grad(c.createLinearGradient(-R * 0.1, 0, R * 0.1, 0), [[0, '#ff6a60'], [1, '#c4262d']]); c.fill(); c.strokeStyle = '#4a1515'; c.lineWidth = 1.2; c.stroke();
  c.beginPath(); c.moveTo(0, nl); c.lineTo(R * 0.1, 0); c.lineTo(-R * 0.1, 0); c.closePath();
  c.fillStyle = '#f4efe0'; c.fill(); c.strokeStyle = '#2b3350'; c.stroke();
  disc(c, 0, 0, R * 0.08, '#d9a93c', '#5a3f0f', 1); disc(c, -R * 0.02, -R * 0.02, R * 0.025, 'rgba(255,255,255,.8)');
  c.restore();

  c.save(); c.beginPath(); c.arc(cx, cy, R * 0.84, 0, TAU); c.clip();
  c.fillStyle = grad(c.createLinearGradient(cx - R * 0.8, cy - R * 0.8, cx + R * 0.2, cy + R * 0.2), [[0, 'rgba(255,255,255,.4)'], [0.5, 'rgba(255,255,255,.08)'], [1, 'rgba(255,255,255,0)']]);
  c.fillRect(cx - R, cy - R, R * 2, R * 2); c.restore();

  const p = o.lid;
  if (p > 0.001) {
    const s = 1 + (1 - p) * 0.32, a = p >= 0.999 ? 1 : c01(p * 1.5);
    c.save(); c.globalAlpha = a; c.translate(cx - (1 - p) * R * 0.3, cy - (1 - p) * R * 0.4); c.scale(s, s);
    c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = R * 0.3 * (1.2 - p); c.shadowOffsetY = R * (0.06 + (1 - p) * 0.3);
    disc(c, 0, 0, R * 0.97, '#a8761f'); c.shadowColor = 'transparent';
    disc(c, 0, 0, R * 0.97, grad(c.createLinearGradient(-R, -R, R, R), [[0, '#f6dc8a'], [0.5, '#cf9f35'], [1, '#8c6218']]), '#5a3f0f', 2);
    disc(c, 0, 0, R * 0.8, null, 'rgba(90,63,15,.6)', 1.5); disc(c, 0, 0, R * 0.66, null, 'rgba(255,240,180,.5)', 1);
    c.font = `900 ${Math.round(R * 0.7)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = 'rgba(90,63,15,.55)'; c.fillText('?', 1, 2); c.fillStyle = 'rgba(255,240,180,.75)'; c.fillText('?', 0, 0);
    c.restore();
  }
}

// --- drawing the three views ----------------------------------------------------------------------------------
function drawNeedle(c, g, dt, time) {
  // timeline of a turn: spin 0-0.9 s, lid lifts 0.95-1.45 s, the needle gets its kick at 1.1 s, done at 1.9 s
  if (N.phase === 'ask' || N.phase === 'turn') N.lid += clamp(1 - N.lid, -dt / 0.3, dt / 0.3);
  let squash = 0;
  if (N.phase === 'turn' || N.phase === 'lift') {
    const e = now() - N.t0;
    const pr = tl(e, 0, 0.9);
    N.ang = lerp(N.from, N.to, inOut(pr)); squash = Math.sin(Math.PI * pr) * 0.6;
    N.phase = e > 0.95 ? 'lift' : 'turn';
    N.lid = e < 0.95 ? 1 : 1 - eOut(tl(e, 0.95, 1.45));
    if (e > 1.1 && !N.wobbled) { N.wobbled = true; N.wobV = (N.delta >= 0 ? -1 : 1) * 170; }
    if (e > 1.9) { N.phase = 'done'; N.lid = 0; N.ang = N.to; render(); (N.ok ? sfx.good : sfx.bad)(); }
  }
  const sub = Math.max(1, Math.ceil(dt / 0.008));
  for (let i = 0; i < sub; i++) { const h = dt / sub; N.wobV += (-120 * N.wob - 5 * N.wobV) * h; N.wob += N.wobV * h; }
  drawPark(c, g, { time }); northPill(c, g);
  const [px, py] = [g.ox + 3.5 * g.cs, g.oy + 2.5 * g.cs];
  if (N.cafe && (N.phase === 'idle' || N.phase === 'done')) {
    const [cx2, cy2] = [g.ox + 5.5 * g.cs, g.oy + 2.5 * g.cs], t = T[lang];
    c.setLineDash([3, 6]); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(px + g.cs * 0.5, py); c.lineTo(cx2 - g.cs * 0.45, cy2); c.stroke(); c.setLineDash([]);
    const rel = t.rel[mod((90 - N.hd) / 90, 4)], mx = (px + cx2) / 2;
    pill(c, rel, mx, py - g.cs * 0.28, { bg: '#fff', fg: '#1b2236', line: '#1b2236' });
    pill(c, `${t.dl[2]} · ${t.dn[2]}`, mx, py + g.cs * 0.3, { bg: '#f2c94c', fg: '#1b2236', line: '#8a6a10' });
  }
  child(c, px, py, g.cs * 0.44, N.ang, { compass: true, wob: N.wob, squash });
  const R = clamp(g.cs * 0.9, 38, 84), ccx = g.ox + g.mw - R * 1.18 - 4, ccy = g.oy + R * 1.18 + 4;
  compassBig(c, ccx, ccy, R, { head: N.ang, wob: N.wob, lid: N.lid });
}

function drawWalk(c, g, dt, time) {
  const { cs, ox, oy } = g, L = LV[W.lvl], P = (x, y) => [ox + (x + 0.5) * cs, oy + (y + 0.5) * cs];
  let hop = 0, squash = 0;
  if (W.run) {
    const R = W.run, e = time - R.t0, dur = 0.46, i = Math.floor(e / dur);
    if (i >= R.steps.length) {
      W.run = null; W.cx = R.end[0]; W.cy = R.end[1];
      const tg = targetOf(W.lvl), at = R.end;
      const found = at[0] === tg[0] && at[1] === tg[1], decoy = !found && L.bush.some(([bx, by]) => bx === at[0] && by === at[1]);
      W.res = { kind: found ? 'found' : decoy ? 'decoy' : 'none', bumped: R.bumped, t0: time };
      (found ? sfx.good : sfx.bad)(); render(); showStage();
    } else {
      const st = R.steps[i], p = (e - i * dur) / dur, hd = DH[st.d];
      W.head += (((hd - W.head + 540) % 360) - 180) * Math.min(1, dt * 16);
      if (st.k === 'move') {
        const q = inOut(p); W.cx = lerp(st.x, st.nx, q); W.cy = lerp(st.y, st.ny, q);
        hop = Math.sin(Math.PI * p) * 0.18 * cs; squash = p > 0.82 ? Math.sin((p - 0.82) / 0.18 * Math.PI) * 0.6 : 0;
        if (p > 0.97 && !st.done) { st.done = true; W.trail.push([st.nx, st.ny]); sfx.tick(); }
      } else {
        const q = Math.sin(Math.PI * Math.min(1, p * 1.3)) * 0.26; W.cx = st.x + DX[st.d] * q; W.cy = st.y + DY[st.d] * q;
        if (p > 0.4 && !st.done) { st.done = true; sfx.bad(); }
      }
    }
  }
  drawPark(c, g, { time, grid: true }); northPill(c, g);
  // start marker
  const [sx, sy] = P(L.s[0], L.s[1]);
  c.setLineDash([4, 4]); c.strokeStyle = '#ffd54a'; c.lineWidth = 2; rr(c, sx - cs * 0.46, sy - cs * 0.46, cs * 0.92, cs * 0.92, 8); c.stroke(); c.setLineDash([]);
  c.strokeStyle = '#6a4a1a'; c.lineWidth = 2; c.beginPath(); c.moveTo(sx - cs * 0.3, sy + cs * 0.3); c.lineTo(sx - cs * 0.3, sy - cs * 0.12); c.stroke();
  c.fillStyle = '#e5484d'; c.strokeStyle = '#7a1a20'; c.lineWidth = 1; c.beginPath(); c.moveTo(sx - cs * 0.3, sy - cs * 0.12); c.lineTo(sx - cs * 0.06, sy - cs * 0.02); c.lineTo(sx - cs * 0.3, sy + cs * 0.08); c.closePath(); c.fill(); c.stroke();
  // bushes; the treasure sits under the first one, but all look the same until the child arrives
  const tg = targetOf(W.lvl), res = W.res, re = res ? time - res.t0 : 0;
  for (const [bx, by] of L.bush) {
    const [X, Y] = P(bx, by), r = cs * 0.27;
    const here = res && res.kind !== 'none' && Math.abs(W.cx - bx) < 0.1 && Math.abs(W.cy - by) < 0.1;
    if (here && res.kind === 'found') {
      const rv = eOut(tl(re, 0, 0.6));
      chest(c, X, Y + cs * 0.04, cs * 0.24, outBack(tl(re, 0.15, 0.7)));
      bush(c, X, Y, r, { dx: -rv * r * 1.3, dy: -rv * r * 1.1, alpha: 1 - rv * 0.7 });

  const r = $('cv').getBoundingClientRect(), gx = Math.floor((ev.clientX - r.left - GEO.ox) / GEO.cs), gy = Math.floor((ev.clientY - r.top - GEO.oy) / GEO.cs);
  if (gx < 0 || gx >= NC || gy < 0 || gy >= NR) return;
  G.probe = [gx, gy]; G.t0 = now(); sfx.tick(); render();
});

// --- one render per change ----------------------------------------------------------------------------------------
const arrowSvg = (a) => `<svg viewBox="-26 -26 52 52" width="46" height="46" aria-hidden="true"><circle r="22" fill="rgba(130,145,190,.16)" stroke="rgba(130,145,190,.55)"/><path d="M-3.5 -17L0 -22L3.5 -17Z" fill="#e5484d"/><g transform="rotate(${a})"><path d="M0 -15L10 -2H4V14H-4V-2H-10Z" fill="#fff" stroke="#1b2236" stroke-width="1"/></g></svg>`;
const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  show('secNeedle', v === 'needle' && !sec); show('secWalk', v === 'walk'); show('secGrid', v === 'grid');
  show('secSun', v === 'needle' && sec === 'sun'); show('secMg', v === 'needle' && sec === 'magnet'); show('secRow', v === 'needle');
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('sun', '☀️') + sc('magnet', '🧲');
  if (v === 'needle') { if (sec === 'sun') renderSun(t); else if (sec === 'magnet') renderMagnet(t); else renderNeedle(t); }
  else if (v === 'walk') renderWalk(t); else renderGrid(t);
}

function renderNeedle(t) {
  const d = t.nd, busy = N.phase === 'turn' || N.phase === 'lift', asking = N.phase === 'ask';
  lab.setGlow('rgba(217, 169, 60, .26)');
  $('nTurns').style.display = asking || busy ? 'none' : '';
  $('nTurns').innerHTML = ['left', 'right', 'around'].map((k) => `<button class="chip" data-act="turn" data-t="${k}">${esc(t.turn[k])}</button>`).join('')
    + `<button class="chip ${N.cafe ? 'on' : ''}" data-act="cafe">☕ ${esc(d.cafe)}</button>`;
  if (asking || busy || N.phase === 'done') {
    const fin = N.phase === 'done';
    $('nAsk').innerHTML = `<p class="cp-q">${esc(d.q)}</p><div class="cp-opts">${N.opts.map((o, i) => {
      const cls = fin ? (o.k === 'same' ? 'good' : i === N.guess ? 'bad' : '') : i === N.guess ? 'on' : '';
      return `<button class="cp-opt ${cls}" data-act="pick" data-i="${i}"${asking ? '' : ' disabled'}>${arrowSvg(o.a)}<span>${esc(d.o[o.k])}</span></button>`;
    }).join('')}</div>`;
  } else $('nAsk').innerHTML = '';
  $('nVerdict').innerHTML = N.phase === 'done' ? `<span style="color:${N.ok ? 'var(--ok)' : 'var(--wip)'}">${esc(N.ok ? t.ok : t.no)}</span> <span style="font-weight:700;color:var(--soft)">${esc(d.turned[N.kind])}</span>` : '';
  const showRes = N.phase === 'idle' ? false : N.phase === 'done';
  if (asking || busy) lab.setReadout('?', '', '', '#d9a93c');
  else lab.setReadout(t.dl[0], d.sub, d.face(t.dn[N.hd / 45]), '#d9a93c');
  const rel = t.rel[mod((90 - N.hd) / 90, 4)];
  if (asking) lab.setState({ emo: '🤔', title: d.ask[0], lead: d.ask[1], body: '', extra: '' });
  else if (busy) lab.setState({ emo: '🌀', title: d.ask[0], lead: d.ask[1], body: '', extra: '' });
  else if (N.cafe) lab.setState({ emo: '☕', title: d.cafeT, lead: d.cafeL(rel), body: N.turns ? d.cafeB1 : d.cafeB0, extra: '' });
  else if (showRes) lab.setState({ emo: '🧭', title: d.res[0], lead: d.res[1], body: d.now(t.dn[N.hd / 45]), extra: '' });
  else lab.setState({ emo: '🧭', title: d.idle[0], lead: d.idle[1], body: '', extra: '' });
  lab.setFacts(t.facts.needle);
}

function renderWalk(t) {
  const w = t.wk, L = LV[W.lvl], busy = !!W.run, res = W.res, won = res && res.kind === 'found', runs = runsOf(W.prog);
  lab.setGlow('rgba(95, 184, 90, .24)');
  const diag = W.lvl >= 3, slot = [7, 0, 1, 6, -1, 2, 5, 4, 3];
  $('wPad').innerHTML = slot.map((d) => d < 0 ? '<div class="cp-mid">🧭</div>' : `<button class="cp-key ${d % 2 && !diag ? 'cp-off' : ''}" data-act="wd" data-d="${d}"${busy || won ? ' disabled' : ''} aria-label="${esc(t.dn[d])}">${['↑', '↗', '→', '↘', '↓', '↙', '←', '↖'][d]} ${esc(t.dl[d])}</button>`).join('');
  $('wProg').innerHTML = runs.length ? runs.map(([d, n]) => `<span class="cp-run">${n} ${esc(t.dl[d])}</span>`).join('') : `<span class="cp-hint">${esc(w.empty)}</span>`;
  const btn = [];
  if (won) btn.push(`<button class="btn cp-push" data-act="wnext">${esc(W.lvl >= 4 ? w.restart : w.next)}</button>`);
  else if (res) btn.push(`<button class="chip" data-act="wundo">${esc(w.undo)}</button><button class="chip" data-act="wclear">${esc(w.clear)}</button><button class="btn cp-push" data-act="wagain">${esc(w.again)}</button>`);
  else btn.push(`<button class="chip" data-act="wundo"${busy || !W.prog.length ? ' disabled' : ''}>${esc(w.undo)}</button><button class="chip" data-act="wclear"${busy || !W.prog.length ? ' disabled' : ''}>${esc(w.clear)}</button><button class="btn cp-push" data-act="wgo"${busy || !W.prog.length ? ' disabled' : ''}>👣 ${esc(w.go)}</button>`);
  $('wBtns').innerHTML = btn.join('');
  lab.setReadout(W.prog.length, `${w.steps(W.prog.length)}${runs.length ? ` · ${runText(runs)}` : ''}`, w.lvl(W.lvl + 1), '#5fb85a');
  const note = w.note(runText(runsOf(levelLegs(W.lvl).flatMap(([d, n]) => Array(n).fill(d)))));
  if (busy) lab.setState({ emo: '👣', title: w.walking[0], lead: w.walking[1], body: '', extra: '' });
  else if (res) {
    const k = res.kind, tx = w[k === 'found' ? 'found' : k === 'decoy' ? 'decoy' : 'none'];
    const body = [res.bumped ? w.bump : '', W.lvl === 4 ? w.fin5 : ''].filter(Boolean).join(' ');
    if (won && W.lvl === 4) lab.setState({ emo: '🏆', title: w.done[0], lead: w.done[1], body: w.fin5, extra: '' });
    else lab.setState({ emo: k === 'found' ? '🏆' : '🤔', title: tx[0], lead: tx[1], body, extra: '' });
  } else lab.setState({ emo: '🗺️', title: w.noteT, lead: note, body: `${W.lvl === 4 ? w.start5 : W.lvl === 3 ? `${w.start} ${w.new4}` : w.start} ${w.hide}`, extra: '' });
  void L;
  lab.setFacts(t.facts.walk);
}

function renderGrid(t) {
  const d = t.gd, q = G.q, end = G.i >= 6, answered = G.pick !== null;
  lab.setGlow('rgba(78, 168, 255, .24)');
  $('gQ').style.display = end ? 'none' : '';
  $('gOpts').style.display = end ? 'none' : '';
  if (!end) {
    $('gQ').textContent = q.kind === 'where' ? d.where(d.nm[q.id]) : d.what(sqn(q.c, q.r));
    $('gOpts').innerHTML = q.opts.map((o, i) => {
      const cls = answered ? (o.ok ? 'good' : i === G.pick ? 'bad' : '') : '';
      const inner = q.kind === 'where' ? `<span class="cp-big">${esc(o.label)}</span>` : `<span class="cp-emo">${IT[o.id][2]}</span><span>${esc(d.nm[o.id])}</span>`;
      return `<button class="cp-opt ${cls}" data-act="gpick" data-i="${i}"${answered ? ' disabled' : ''}>${inner}</button>`;
    }).join('');
  }
  $('gBtns').innerHTML = end ? `<button class="btn cp-push" data-act="gagain">${esc(t.wk.restart)}</button>` : answered ? `<button class="btn cp-push" data-act="gnext">${esc(d.next)}</button>` : '';
  const sq = G.probe ? sqn(G.probe[0], G.probe[1]) : null;
  if (end) lab.setReadout(sq ?? '–', sq ? `${d.sq}` : d.tap, d.prog(6), '#4ea8ff');
  else lab.setReadout(answered ? sqn(q.c, q.r) : '?', answered ? d.nm[q.id] : '', d.prog(G.i + 1), '#4ea8ff');
  if (end) {
    if (G.probe) { const [pc, pr] = G.probe, hit = Object.keys(IT).find((k) => IT[k][0] === pc && IT[k][1] === pr); lab.setState({ emo: hit ? IT[hit][2] : '🔍', title: sqn(pc, pr), lead: d.okL(sqn(pc, pr), COLS[pc], pr + 1), body: hit ? d.nm[hit] : '', extra: '' }); }
    else lab.setState({ emo: '🏅', title: d.doneT, lead: d.explore[1], body: '', extra: '' });
  } else if (!answered) lab.setState({ emo: '🔲', title: d.rule.split('.')[0] + '.', lead: d.rule.split('. ')[1] ?? '', body: '', extra: '' });
  else {
    const ok = q.opts[G.pick].ok;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.ok : t.no, lead: d.okL(sqn(q.c, q.r), COLS[q.c], q.r + 1), body: !ok && q.kind === 'where' && q.opts[G.pick].label === `${q.r + 1}${COLS[q.c]}` ? d.tip : '', extra: '' });
  }
  lab.setFacts(t.facts.grid);
}

function renderSun(t) {
  const s = t.sn, near = Math.abs(U.t - 12) < 0.4;
  lab.setGlow('rgba(255, 213, 74, .26)');
  $('sunL').textContent = s.slider; $('sunR').value = U.t;
  $('sunB').innerHTML = `<button class="chip" data-act="sreplay">${esc(s.replay)}</button>`;
  lab.setReadout(clock(U.t), '', near ? s.midP : '', '#f2c94c');
  const k = near ? s.mid : U.t < 12 ? s.morn : s.aft;
  lab.setState({ emo: near ? '☀️' : U.t < 12 ? '🌅' : '🌇', title: k[0], lead: k[1], body: s.note, extra: '' });
  lab.setFacts(t.facts.needle);
}
function renderMagnet(t) {
  const m = t.mg, floated = M.floatT >= 0;
  lab.setGlow('rgba(95, 168, 90, .24)');
  $('mgB').innerHTML = `<button class="btn" data-act="mstroke"${M.str || floated || M.strokes >= 5 ? ' disabled' : ''}>🧲 ${esc(m.stroke(M.strokes))}</button>`
    + `<button class="btn" data-act="mfloat"${M.str || floated ? ' disabled' : ''}>🍃 ${esc(m.float)}</button>`
    + `<button class="chip cp-push" data-act="mreset">${esc(m.again)}</button>`;
  lab.setReadout(`${M.strokes}/5`, '', m.pill(M.strokes), '#5fb85a');
  const k = M.fin ? m.fin : floated ? (M.mag ? m.wait : m.none) : M.strokes >= 5 ? m.s5 : m.s0;
  lab.setState({ emo: M.fin ? '🧭' : '🧲', title: k[0], lead: k[1], body: '', extra: '' });
  lab.setFacts(t.facts.needle);
}
render();
</script>
