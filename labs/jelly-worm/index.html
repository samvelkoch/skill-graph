// worm model: 14 segments; each has a ring-muscle activation c and a length-muscle activation m (0..1)
const NSEG = 14, LAM = 7, RING_AHEAD = 0.2, FIXED = 0.02;
const pulse = (x) => { const d = (((x % 1) + 1.5) % 1) - 0.5; return Math.pow(0.5 + 0.5 * Math.cos(TAU * d), 3); };
const WM = {
  P: 0, o: 0, cam: -7, acc: 0, vel: 0, trail: [],
  ell: new Array(NSEG).fill(1), m: new Array(NSEG).fill(0), c: new Array(NSEG).fill(0),
  LM: new Array(NSEG).fill(0), LC: new Array(NSEG).fill(0),
};
// one fixed step of the worm: lengths from the two muscle waves; segments squeezed by length muscles grip the soil (bristles) and keep their place,
// so the head's ground position o moves to keep them there
const gnd = new Array(NSEG).fill(0); // ground position of each segment centre (x grows towards the head)
{ let u = 0; for (let i = 0; i < NSEG; i++) { gnd[i] = -(u + 0.5); u += 1; } }
function advanceWorm(dt) {
  WM.acc += dt;
  while (WM.acc >= FIXED) {
    WM.acc -= FIXED;
    const ell = WM.ell, m = WM.m, c = WM.c;
    WM.P += S.dir * S.spd * FIXED;
    for (let i = 0; i < NSEG; i++) {
      const ph = i - WM.P;
      let mm = S.len ? pulse(ph / LAM) : 0, cc = S.ring ? pulse((ph + RING_AHEAD * LAM) / LAM) : 0;
      if (S.len && !S.ring) { WM.LM[i] = Math.max(WM.LM[i], mm); mm = WM.LM[i]; } else WM.LM[i] = 0;
      if (S.ring && !S.len) { WM.LC[i] = Math.max(WM.LC[i], cc); cc = WM.LC[i]; } else WM.LC[i] = 0;
      m[i] = mm; c[i] = cc; ell[i] = 1 + 0.5 * cc - 0.45 * mm;
    }
    let u = 0, sw = 0, sx = 0; const uc = new Array(NSEG);
    for (let i = 0; i < NSEG; i++) { uc[i] = u + ell[i] / 2; u += ell[i]; const w = m[i] * m[i]; sw += w; sx += w * (gnd[i] + uc[i]); }
    if (sw > 1e-3) WM.o += (sx / sw - WM.o) * Math.min(1, sw / 2);
    for (let i = 0; i < NSEG; i++) gnd[i] = WM.o - uc[i];
  }
  WM.cam += (WM.o - 7 - WM.cam) * Math.min(1, dt * 3);
}

const HX = 200, HFOOT = 372, HTOP = 168;
const HK = [[0, 26], [0.05, 26], [0.1, 17], [0.3, 20.5], [0.62, 24], [0.8, 20.5], [0.9, 17], [0.96, 14.5], [1, 11.5]]; // [position along the body, half width]
const hY = (u) => HFOOT - u * (HFOOT - HTOP);
const hCX = (u, time) => HX + Math.sin(time * 0.9 + u * 2.2) * 6 * u * u;
function hHW(u, foot = 1) {
  let r = HK[HK.length - 1][1];
  for (let i = 1; i < HK.length; i++) if (u <= HK[i][0]) { const [u0, a] = HK[i - 1], [u1, b] = HK[i]; r = a + (b - a) * ((u - u0) / (u1 - u0)); break; }
  return u < 0.1 ? 17 + (r - 17) * foot : r;
}
function bodyPath(c, time, k, foot = 1) {

  else if (act === 'ring') { S.ring = !S.ring; sfx.click(); }
  else if (act === 'len') { S.len = !S.len; sfx.click(); }
  else if (act === 'dir') { S.dir = +b.dataset.d; sfx.click(); }
  else if (act === 'rain') { S.rain = now(); S.rainAt = -1; TR = []; sfx.click(); }
  else if (act === 'crowd') { if (!secret.unlocked()) return secret.open(); S.crowd = !S.crowd; sfx.click(); }
  render();
});
$('spd').addEventListener('input', (ev) => { S.spd = +ev.target.value; render(); });
$('days').addEventListener('input', (ev) => { S.days = +ev.target.value; render(); });

// --- one render per change: controls, readout, state card and facts ----------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  const k = v === 'hydra' ? 'h' : v === 'worm' ? 'w' : 's', rev = S.g[k] !== null;
  $('toolsH').hidden = !(v === 'hydra' && rev); $('toolsW').hidden = !(v === 'worm' && rev); $('toolsS').hidden = !(v === 'soil' && rev);
  const X = t[k], opts = k === 'h' ? ['1', '2'] : X.opts, okI = k === 'h' ? 0 : k === 'w' ? 1 : 2;
  $('ask').innerHTML = !rev
    ? `<div class="q">${esc(X.q)}</div><div class="opts">${opts.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="verdict" style="color:${S.g[k] === okI ? 'var(--ok)' : 'var(--wip)'}">${esc(S.g[k] === okI ? t.ok : t.no)}</div><p>${esc(S.g[k] === okI ? X.okT : X.noT)}</p>`;
  if (v === 'hydra') renderH(t, rev); else if (v === 'worm') renderW(t, rev); else renderS(t, rev);
}
function renderH(t, rev) {
  const h = t.h, un = secret.unlocked();
  lab.setGlow('rgba(58, 168, 122, .28)');
  if (!rev) { const [e, ti, le, bo] = h.pre; lab.setState({ emo: e, title: ti, lead: le, body: bo }); lab.setReadout('?', '', '', '#3aa87a'); lab.setFacts(t.facts.h); return; }
  const ft = S.feed >= 0 ? now() - S.feed : -1, ph = hydraPhase(ft);
  const [e, ti, le, bo] = S.jelly ? h.pj : S.cut >= 0 ? h.pc : h.ph[ph];
  lab.setState({ emo: e, title: ti, lead: le, body: bo });
  lab.setReadout(String(S.meals), h.meals(S.meals), '', '#3aa87a');
  lab.setFacts(S.jelly ? [t.facts.h[2], t.facts.h[0], t.facts.h[1]] : S.cut >= 0 ? [t.facts.cut, ...t.facts.h] : t.facts.h);
  $('hSeg').innerHTML = [['hydra', h.hydra], ['jelly', h.jelly]].map(([m, l]) => `<button data-act="mode" data-m="${m}" class="${(m === 'jelly') === S.jelly ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('feedB').textContent = h.feed; $('feedB').hidden = S.jelly; $('feedB').disabled = S.feed >= 0 || S.cut >= 0;
  $('cutB').hidden = S.jelly; $('cutB').className = `chip secret ${un ? 'open' : ''} ${S.cut >= 0 ? 'on' : ''}`; $('cutB').textContent = !un ? '🔒 ???' : S.cut >= 0 ? h.again : h.cut;
}
function renderW(t, rev) {
  const w = t.w;
  lab.setGlow('rgba(217, 120, 111, .28)');
  if (!rev) { const [e, ti, le, bo] = w.pre; lab.setState({ emo: e, title: ti, lead: le, body: bo }); lab.setReadout('?', '', '', '#d9786f'); lab.setFacts(t.facts.w); return; }
  const [e, ti, le] = w.st[wornState()];
  lab.setState({ emo: e, title: ti, lead: le, body: '' });
  lab.setFacts(t.facts.w);
  $('ringB').textContent = w.ring; $('ringB').className = `chip ${S.ring ? 'on' : ''}`;
  $('lenB').textContent = w.len; $('lenB').className = `chip ${S.len ? 'on' : ''}`;
  $('dirL').textContent = w.dirL; $('spdL').textContent = w.spd;
  $('dirSeg').innerHTML = [1, -1].map((d, i) => `<button data-act="dir" data-d="${d}" class="${S.dir === d ? 'on' : ''}">${esc(w.dir[i])}</button>`).join('');
  if (+$('spd').value !== S.spd) $('spd').value = S.spd;
  readW();
}
function renderS(t, rev) {
  const s = t.s, un = secret.unlocked();
  lab.setGlow('rgba(111, 179, 111, .26)');
  if (!rev) { const [e, ti, le, bo] = s.pre; lab.setState({ emo: e, title: ti, lead: le, body: bo }); readS(); lab.setFacts(t.facts.s0); return; }
  const raining = S.rain >= 0 && now() - S.rain < 20;
  const [e, ti, le, bo] = raining ? (S.days === 0 ? s.rain0 : s.rain) : S.days === 0 ? s.d0 : s.dry(S.days);
  lab.setState({ emo: e, title: ti, lead: le, body: bo || '', extra: '' });
  lab.setFacts([...t.facts.s0, ...t.facts.s1]);
  readS();
  $('dayL').textContent = s.days; if (+$('days').value !== S.days) $('days').value = S.days;
  $('rainB').textContent = s.rainB;
  $('crowdB').className = `chip secret ${un ? 'open' : ''} ${S.crowd ? 'on' : ''}`; $('crowdB').textContent = un ? `🪱 ${t.secrets.crowd[0]}` : '🔒 ???';
  $('noteS').textContent = s.noteS; $('noteT').textContent = s.noteT;
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  SC = Math.min(w / DW, h / DH); OX = (w - DW * SC) / 2; OY = (h - DH * SC) / 2;
  const v = lab.view;
  if (v === 'hydra') frameH(c, w, h, dt, time); else if (v === 'worm') frameW(c, w, h, dt, time); else frameS(c, w, h, dt, time);
});
render();
</script>
