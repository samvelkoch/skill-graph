    c.globalAlpha = 1;
  } else {
    const k = S.res.filter(Boolean).length;
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.font = '900 60px Nunito, sans-serif'; c.fillText(`${k}/6`, BWD / 2, 70);
    c.font = '800 16px Nunito, sans-serif'; c.fillStyle = '#c9d6f2'; wrapText(c, t.h.endL, 270).forEach((ln, i) => c.fillText(ln, BWD / 2, 124 + i * 22));
  }
  // legend
  c.fillStyle = '#3fd3b0'; c.beginPath(); c.moveTo(26, 232); c.lineTo(32, 238); c.lineTo(26, 244); c.lineTo(20, 238); c.closePath(); c.fill();
  c.fillStyle = '#ff6a58'; c.beginPath(); c.roundRect(130, 233, 18, 10, 5); c.fill();
  c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'left'; c.fillStyle = '#c9d6f2'; c.fillText(t.h.leg[0], 40, 238); c.fillText(t.h.leg[1], 154, 238);
  // timeline
  const AX = 372; c.strokeStyle = 'rgba(190,205,255,.5)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(20, AX); c.lineTo(322, AX); c.stroke();
  c.textAlign = 'center'; c.fillStyle = '#98A0B8'; c.font = '800 12px Nunito, sans-serif';
  for (let y = 1989; y <= 1995; y++) { const x = tlx(Date.UTC(y, 0, 1)); c.strokeStyle = 'rgba(190,205,255,.35)'; c.beginPath(); c.moveTo(x, AX - 4); c.lineTo(x, AX + 4); c.stroke(); c.fillText(String(y), x, AX + 18); }
  CARDS.forEach((q, i) => {
    const g = S.gs[i], known = g !== undefined, x = tlx(q.pin), cur = i === S.ci && !done;
    if (known && q.fight) {
      const xa = tlx(q.war[0]), xb = Math.max(tlx(q.war[1]), xa + 7), grow = eOut((now() - (i === S.ci ? S.ansT : -9)) / 0.7);
      c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 1; c.setLineDash([2, 3]); c.beginPath(); c.moveTo(x, AX - 7); c.lineTo(x, q.lane + 5); c.stroke(); c.setLineDash([]);
      const bg2 = c.createLinearGradient(xa, 0, xb, 0); bg2.addColorStop(0, '#ff8a5c'); bg2.addColorStop(1, '#e5402f');
      c.fillStyle = bg2; c.beginPath(); c.roundRect(xa, q.lane - 5, Math.max(7, (xb - xa) * grow), 10, 5); c.fill(); c.strokeStyle = 'rgba(40,10,10,.6)'; c.lineWidth = 1; c.stroke();
      const D = t.h.dur(daysOf(q)), lbl = q.id === 'slo' ? D : `${t.h.about}${D}`;
      c.font = '800 12px Nunito, sans-serif'; pill(c, BWD, BHT, lbl, xa - 6, q.lane, 'r', 12, '#ffd1c4');
    }
    if (known) {
      if (q.fight) { c.fillStyle = '#ff6a58'; c.beginPath(); c.arc(x, AX, 6, 0, 7); c.fill(); c.strokeStyle = '#2b0f0c'; c.lineWidth = 1.2; c.stroke(); }
      else { c.fillStyle = '#3fd3b0'; c.beginPath(); c.moveTo(x, AX - 9); c.lineTo(x + 8, AX); c.lineTo(x, AX + 9); c.lineTo(x - 8, AX); c.closePath(); c.fill(); c.strokeStyle = '#0b3a30'; c.lineWidth = 1.2; c.stroke(); }
    } else {
      c.fillStyle = '#4a5578'; c.beginPath(); c.arc(x, AX, 8, 0, 7); c.fill(); c.strokeStyle = '#8f9bc4'; c.lineWidth = 1.2; c.stroke();
      c.fillStyle = '#e8ecf6'; c.font = '900 12px Nunito, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'center'; c.fillText('?', x, AX + 0.5);
    }
    if (cur) { const pr = 12 + 4 * Math.sin(time * 4); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2; c.beginPath(); c.arc(x, AX, pr, 0, 7); c.stroke(); }
  });
  c.restore();
}

// --- the loop ---------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'wall') {
    const goal = S.sec === 'island' ? 1 : 0;
    S.zoom += clamp(goal - S.zoom, -dt / 0.9, dt / 0.9);
    if (S.zoom < 0.5) { drawWall(c, w, h, dt, time); if (S.zoom > 0) { c.fillStyle = `rgba(12,16,26,${clamp01(S.zoom * 2)})`; c.fillRect(0, 0, w, h); } }
    else { drawIsland(c, w, h, time); if (S.zoom < 1) { c.fillStyle = `rgba(12,16,26,${clamp01(2 - S.zoom * 2)})`; c.fillRect(0, 0, w, h); } }
  } else if (v === 'map') drawMap(c, w, h, dt, time);
  else drawHow(c, w, h, dt, time);
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'map' || !S.shown.length) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  let best = null, bd = 1e9;
  for (const d of S.shown) { const dd = Math.hypot(d.x - x, d.y - y) - d.r; if (dd < bd) { bd = dd; best = d; } }
  if (best && bd < 20) { S.tap = { name: T[lang].m.nm[best.key], x: best.x, y: best.y - best.r, t: now() }; sfx.tick(); }
});

// --- controls ---------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const goView = (v) => { if (lab.view !== v) $('views').querySelector(`[data-view="${v}"]`)?.click(); };
function predHTML(v) {
  const t = T[lang], q = t[v === 'wall' ? 'w' : 'm'].ask, opts = t[v === 'wall' ? 'w' : 'm'].opts, pick = v === 'wall' ? S.pickWall : S.pickMap, done = pick !== null, right = RIGHT[v];
  const chips = opts.map((o, i) => `<button class="bw-opt${done ? (i === right ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="opt" data-v="${v}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  return `<div class="bw-q">${esc(q)}</div><div class="bw-opts">${chips}</div>${done ? `<div class="bw-verdict ${pick === right ? 'good' : 'bad'}">${esc(pick === right ? t.ok : t.no)}</div>` : ''}`;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-y]'); if (!b || b.disabled) return;
  if (b.dataset.y !== undefined && !b.dataset.act) { const y = +b.dataset.y; if (y > maxY()) { nudge(); return; } S.yt = y; S.play = false; sfx.tick(); render(); return; }
  const a = b.dataset.act;
  if (a === 'route') { S.walk = { k: +b.dataset.k, t0: now(), open: S.pickWall !== null, marked: false, p: START }; sfx.click(); render(); return; }
  if (a === 'opt') {
    const v = b.dataset.v, i = +b.dataset.i;
    if (v === 'wall') { if (S.pickWall !== null) return; S.pickWall = i; S.revWall = now(); S.walk = null; }
    else { if (S.pickMap !== null) return; S.pickMap = i; S.yt = 3; S.play = false; }
    (i === RIGHT[v] ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (a === 'ans') {
    if (S.gs[S.ci] !== undefined || S.ci >= 6) return;
    const i = +b.dataset.i, q = CARDS[S.ci]; S.gs[S.ci] = i; S.res[S.ci] = i === (q.fight ? 1 : 0); S.ansT = now();
    (S.res[S.ci] ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (a === 'next') { S.ci++; S.cardT = now(); sfx.click(); render(); return; }
  if (a === 'again') { S.ci = 0; S.gs = []; S.res = []; S.cardT = now(); sfx.click(); render(); return; }
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (k === 'island') { const on = !(S.sec === 'island' && lab.view === 'wall'); goView('wall'); S.sec = on ? 'island' : null; S.secT = now(); }
    else { goView('map'); if (S.play) S.play = false; else { S.yt = 0; S.yf = 0; S.pt = -0.4; S.play = true; S.sec = 'lapse'; } }
    sfx.click(); render(); showStage();
  }
});
function nudge() { const el = $('bwPredMap'); el.classList.remove('bw-nudge'); void el.offsetWidth; el.classList.add('bw-nudge'); sfx.bad(); }
$('bwSlider').addEventListener('input', (ev) => {
  const v = +ev.target.value;
  if (v > maxY()) { ev.target.value = maxY(); nudge(); return; }
  S.yt = v; S.play = false; render();
});

// --- one render per change: controls, readout, state card and facts --------------------------------------------------------
function chartHTML() {
  const t = T[lang], lim = maxY(), CX = (i) => 24 + i * 50.4, CY = (n) => 98 - (n - 8) / 21 * 80;
  let d = '';
  for (let i = 0; i <= lim; i++) d += i === 0 ? `M${CX(0)} ${CY(COUNTS[0])}` : ` H${CX(i)} V${CY(COUNTS[i])}`;
  const grid = [10, 20].map((n) => `<line x1="14" x2="290" y1="${CY(n)}" y2="${CY(n)}" stroke="rgba(190,205,255,.14)"/><text x="2" y="${CY(n) + 4}" fill="#646C84" font-size="11" font-weight="700">${n}</text>`).join('');
  const pts = Y_ALL.map((y, i) => {
    const on = i === S.yt, ok = i <= lim, x = CX(i), n = COUNTS[i];
    return `<g data-y="${i}"><circle cx="${x}" cy="${ok ? CY(n) : 62}" r="15" fill="transparent"/>${ok
      ? `<circle cx="${x}" cy="${CY(n)}" r="${on ? 6.5 : 4}" fill="${on ? '#fff' : '#8fb4ff'}" stroke="#0A0C14" stroke-width="1.5"/>${on ? `<text x="${x}" y="${CY(n) - 11}" text-anchor="middle" fill="#fff" font-size="14" font-weight="900">${n}</text>` : ''}`
      : `<circle cx="${x}" cy="62" r="4" fill="none" stroke="#646C84" stroke-dasharray="2 2"/><text x="${x}" y="48" text-anchor="middle" fill="#646C84" font-size="13" font-weight="800">?</text>`}
      <text x="${x}" y="116" text-anchor="middle" fill="${on ? '#fff' : '#98A0B8'}" font-size="12" font-weight="800">${y}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 300 122" role="img" aria-label="${esc(t.m.gtitle)}">${grid}<path d="${d}" fill="none" stroke="#8fb4ff" stroke-width="2.5" stroke-linejoin="round"/>${pts}</svg>`;
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('bwWall').style.display = v === 'wall' ? 'block' : 'none';
  $('bwMap').style.display = v === 'map' ? 'block' : 'none';
  $('bwHow').style.display = v === 'how' ? 'block' : 'none';
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${(k === 'island' && S.sec === 'island' && v === 'wall') || (k === 'lapse' && S.play && v === 'map') ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('bwSecs').innerHTML = sc('island', '🔭') + sc('lapse', '⏱️');
  if (v === 'wall') renderWall(t); else if (v === 'map') renderMap(t); else renderHow(t);
}
function renderWall(t) {
  const w = t.w, openW = S.pickWall !== null, n = S.tried.filter(Boolean).length, all = n === 3;
  $('bwRoutes').innerHTML = ['🚪', '🛶', '🛂'].map((e, k) => `<button class="bw-route" data-act="route" data-k="${k}">${e} ${esc(w.routes[k])}${!openW && S.tried[k] ? '<b>✕</b>' : ''}</button>`).join('');
  $('bwWallNote').innerHTML = !all && !openW ? `<p class="bw-note">${esc(w.instr)} · ${esc(w.tried(n))}</p>` : '';
  $('bwPredWall').style.display = all || openW ? '' : 'none';
  $('bwPredWall').innerHTML = all || openW ? predHTML('wall') : '';
  lab.setGlow('rgba(184, 146, 63, .26)');
  lab.setReadout(openW ? '3/3' : `${n}/3`, openW ? w.subB : w.subA, openW ? w.dateB : w.dateA, '#d9a441');
  if (S.sec === 'island') { lab.setState({ emo: '🔭', title: w.isl[0], lead: w.isl[1], body: '', extra: '' }); lab.setFacts([]); return; }
  let st;
  if (S.walk && S.walk.open && S.walk.marked) st = [w.sArrive[0], w.sArrive[1], '🤗'];
  else if (openW) st = [w.sOpen[0], `${S.pickWall === RIGHT.wall ? t.ok : t.no} ${w.sOpen[1]}`, '🌙'];
  else if (S.walk && S.walk.marked) st = [w.sStop, w.stop[S.walk.k], '✋'];
  else if (all) st = [w.ask, '', '🤔'];
  else if (n === 0) st = [w.s0[0], w.s0[1], '🧱'];
  else st = [w.sStop, S.walk ? w.stop[S.walk.k] : w.sAll[1], '✋'];
  lab.setState({ emo: st[2], title: st[0], lead: st[1], body: '', extra: '' });
  lab.setFacts(openW ? t.facts.wallB : t.facts.wallA);
}
function renderMap(t) {
  const m = t.m, i = S.yt, lim = maxY(), locked = S.pickMap === null;
  $('bwPredMap').innerHTML = predHTML('map') + (locked ? `<div class="bw-fine">${esc(m.lock)}</div>` : '');
  const sl = $('bwSlider'); sl.value = i;
  sl.style.setProperty('--track', locked ? 'linear-gradient(90deg, #5b8def 0 40%, #3a4258 40% 100%)' : 'linear-gradient(90deg, #5b8def, #e9c75a)');
  $('bwGT').textContent = m.gtitle; $('bwChart').innerHTML = chartHTML();
  const c = ledger(i);
  $('bwLed').innerHTML = ['de', 'ussr', 'yu', 'cs'].map((k, j) => `<span>${esc(m.led[j])}: ${c[k][0] === c[k][1] ? c[k][1] : `${c[k][0]} → ${c[k][1]}`}</span>`).join('');
  $('bwFine').textContent = `${m.tap} ${m.note}`;
  const n = COUNTS[i];
  lab.setGlow('rgba(143, 180, 255, .24)');
  lab.setReadout(n, m.sub(Y_ALL[i]), m.ev[i], '#8fb4ff');
  const st = m.st(i, n, c);
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' });
  lab.setFacts(locked ? t.facts.mapA : t.facts.mapB);
}
function renderHow(t) {
  const h = t.h, done = S.ci >= 6, q = CARDS[Math.min(S.ci, 5)], g = S.gs[S.ci];
  const k = S.res.filter(Boolean).length, seen = S.res.filter((x) => x !== undefined).length;
  let html = '';
  if (done) html = `<button class="bw-go" data-act="again">${esc(h.again)}</button>`;
  else if (g === undefined) html = `<div class="bw-head">${esc(h.head(S.ci + 1))}</div><div class="bw-q">${esc(h.q)}</div><div class="bw-ans"><button data-act="ans" data-i="0">☮️ ${esc(h.pick[0])}</button><button data-act="ans" data-i="1">💥 ${esc(h.pick[1])}</button></div>`;
  else html = `<div class="bw-head">${esc(h.head(S.ci + 1))}</div><button class="bw-go" data-act="next">${esc(h.next)}</button>`;
  $('bwHow').innerHTML = html + `<div class="bw-fine">${esc(h.note)}</div>`;
  lab.setGlow('rgba(63, 211, 176, .22)');
  lab.setReadout(`${k}/${seen}`, h.sub, '', '#3fd3b0');
  if (done) { lab.setState({ emo: '🏆', title: h.endT(k), lead: h.endL, body: '', extra: '' }); lab.setFacts(t.facts.howB); return; }
  if (g === undefined) { lab.setState({ emo: '🤔', title: S.ci === 0 ? h.first[0] : h.q, lead: S.ci === 0 ? h.first[1] : t.h.cards[q.id][1], body: '', extra: '' }); lab.setFacts(t.facts.howA); return; }
  const verdict = q.fight ? h.vd[q.id](q.id === 'slo' ? h.dur(daysOf(q)) : `${h.about}${h.dur(daysOf(q))}`) : h.vd[q.id];
  lab.setState({ emo: S.res[S.ci] ? '✅' : '🤔', title: S.res[S.ci] ? t.ok : t.no, lead: verdict, body: '', extra: '' });
  lab.setFacts(t.facts.howA);
}
render();
</script>
</body>
</html>
