const TREE = (() => {

  const walk = (g, x, y, ang, len) => {

    const cx = (x + xe) / 2 + Math.cos(ang) * off, cy = (y + ye) / 2 - Math.sin(ang) * off;
    out.push({ g, x, y, xe, ye, cx, cy });
    x0 = Math.min(x0, xe, cx); x1 = Math.max(x1, xe, cx); y0 = Math.min(y0, y); y1 = Math.max(y1, ye);

    const ex = bx + len, ey = by + len * tilt * 2, cxp = bx + len * 0.5, cyp = by + len * tilt * 0.6 - 6;
    c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo(cxp, cyp, ex, ey); c.lineWidth = 9; c.strokeStyle = '#4a1426'; c.stroke();
    const fg = c.createLinearGradient(bx, 0, ex, 0); fg.addColorStop(0, '#e78a9c'); fg.addColorStop(1, '#c4455e');
    c.lineWidth = 6.5; c.strokeStyle = fg; c.stroke();
    c.lineWidth = 1.4; c.strokeStyle = 'rgba(255,225,230,.75)';
    for (let m = 1; m < len / 8; m++) {
      const q = m * 8 / len, [px, py] = qpt([bx, by], [cxp, cyp], [ex, ey], q);
      c.beginPath(); c.moveTo(px, py - 6); c.lineTo(px, py - 11 * (1 - q * 0.4)); c.moveTo(px, py + 6); c.lineTo(px, py + 11 * (1 - q * 0.4)); c.stroke();
    }
    // blood runs base to tip, against the water
    for (let m = 0; m < 3; m++) {
      const q = ((time * 0.22 + m / 3 + slot * 0.13) % 1), [px, py] = qpt([bx, by], [cxp, cyp], [ex, ey], q * g);
      c.beginPath(); c.arc(px, py, 2.6, 0, 7); c.fillStyle = '#ff5a5f'; c.fill();
    }
  }
  // the bar itself, drawn over the filament bases
  c.beginPath(); c.moveTo(ax, y0); c.quadraticCurveTo(ax - w * 0.26, (y0 + y1) / 2, ax, y1);
  c.lineWidth = 22; c.strokeStyle = '#4a1426'; c.stroke();
  const bg = c.createLinearGradient(ax - w * 0.13, 0, ax + 12, 0); bg.addColorStop(0, '#caa0aa'); bg.addColorStop(1, '#e78a9c');
  c.lineWidth = 17; c.strokeStyle = bg; c.stroke();
  c.lineWidth = 6; c.strokeStyle = '#7d1f35'; c.stroke();
  for (let m = 0; m < 4; m++) { const q = ((time * 0.22 + m / 4) % 1), [px, py] = arch(q); c.beginPath(); c.arc(px, py, 2.6, 0, 7); c.fillStyle = '#ff5a5f'; c.fill(); }
  c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.moveTo(ax - w * 0.1, h * 0.32); c.quadraticCurveTo(ax - w * 0.14, h * 0.5, ax - w * 0.1, h * 0.68); c.stroke();
  pill(c, t.water, w - 10, y0 + 6, { align: 'right', dot: '#5fb4ff' }); pill(c, t.gblood, w - 10, y0 + 30, { align: 'right', dot: '#ff5a5f' });
  pill(c, t.gbar, 8, y1 + 6);

function drawLung(c, w, h, dt, time) {
  const G = lungGeo(w, h), { gx, gy, gw, gh, cell } = G;
  for (const wl of LUNG.walls) wl.br += clamp((wl.on ? 1 : 0) - wl.br, -dt * 4, dt * 4);
  c.lineCap = 'round'; c.lineJoin = 'round';
  const ag = c.createRadialGradient(w / 2, gy + gh * 0.4, 5, w / 2, gy + gh / 2, gw * 0.65); ag.addColorStop(0, 'rgba(170,220,255,.30)'); ag.addColorStop(1, 'rgba(110,170,240,.16)');
  c.beginPath(); c.roundRect(gx, gy, gw, gh, cell * 0.5); c.fillStyle = ag; c.fill();
  for (const wl of LUNG.walls) {
    const [a, m, b] = wallPts(wl, G), frac = 1 - 0.78 * ease(wl.br);
    for (const [t0, t1] of [[0, frac / 2], [1 - frac / 2, 1]]) {
      const [p0, pc, p1] = qsub(a, m, b, t0, t1);
      c.beginPath(); c.moveTo(...p0); c.quadraticCurveTo(...pc, ...p1);
      c.lineWidth = 7; c.strokeStyle = '#4a1426'; c.stroke(); c.lineWidth = 4.2; c.strokeStyle = '#e78a9c'; c.stroke();
    }
    if (wl.br < 0.5) for (let k = 0; k < 3; k++) {
      const q = ((time * 0.06 + k / 3 + wl.th) % 1), [px, py] = qpt(a, m, b, q);
      c.globalAlpha = 1 - wl.br * 2; c.beginPath(); c.arc(px, py, 1.7, 0, 7); c.fillStyle = '#ff5a5f'; c.fill(); c.globalAlpha = 1;
    }
  }
  c.beginPath(); c.roundRect(gx, gy, gw, gh, cell * 0.5); c.lineWidth = 7; c.strokeStyle = '#4a1426'; c.stroke(); c.lineWidth = 4.2; c.strokeStyle = '#f2a3ae'; c.stroke();
  c.beginPath(); c.roundRect(gx + 3, gy + 3, gw - 6, gh - 6, cell * 0.45); c.lineWidth = 1.2; c.strokeStyle = 'rgba(255,255,255,.3)'; c.stroke();
}
function drawBird(c, w, h, dt, time) {
  const t = T[lang];
  S.bT += dt; if (S.bauto && S.bT > 3.4) { S.bT = 0; S.bphase = 1 - S.bphase; render(); }
  S.binf += clamp((S.bphase === 0 ? 1 : 0) - S.binf, -dt * 0.9, dt * 0.9);
  const sc = Math.min(w / 310, h / 190) * 0.96, ox = (w - 300 * sc) / 2, oy = (h - 170 * sc) / 2;
  const X = (x) => ox + x * sc, Y = (y) => oy + y * sc, inf = ease(S.binf), kk = 0.82 + 0.3 * inf;
  c.lineCap = 'round'; c.lineJoin = 'round';
  // body
  c.beginPath(); c.moveTo(X(26), Y(78)); c.bezierCurveTo(X(60), Y(26), X(200), Y(24), X(262), Y(68)); c.bezierCurveTo(X(288), Y(92), X(270), Y(132), X(230), Y(140));
  c.bezierCurveTo(X(160), Y(152), X(70), Y(144), X(36), Y(100)); c.closePath();
  const bgd = c.createLinearGradient(0, Y(24), 0, Y(150)); bgd.addColorStop(0, 'rgba(150,165,215,.26)'); bgd.addColorStop(1, 'rgba(90,100,150,.16)');
  c.fillStyle = bgd; c.fill(); c.lineWidth = 2; c.strokeStyle = 'rgba(190,205,255,.45)'; c.stroke();
  c.beginPath(); c.moveTo(X(262), Y(68)); c.lineTo(X(298), Y(54)); c.lineTo(X(274), Y(104)); c.closePath(); c.fillStyle = 'rgba(150,165,215,.22)'; c.fill(); c.stroke();
  c.beginPath(); c.moveTo(X(27), Y(76)); c.lineTo(X(6), Y(84)); c.lineTo(X(30), Y(92)); c.closePath(); c.fillStyle = '#f5c84c'; c.fill(); c.lineWidth = 1.2; c.strokeStyle = '#4a1426'; c.stroke();
  c.beginPath(); c.arc(X(50), Y(70), 3.4 * sc, 0, 7); c.fillStyle = '#fff'; c.fill(); c.beginPath(); c.arc(X(50.8), Y(70), 1.7 * sc, 0, 7); c.fillStyle = '#0a0c14'; c.fill();
  // air tubes
  const FP = [[26, 86], [66, 62], [160, 44], [222, 60], [232, 90]], LA = [[132, 94], [112, 98], [92, 102]], PL = [[214, 98], [200, 94], [186, 92]], OUT = [[92, 100], [66, 66], [28, 86]];
  const poly = (pts, wd, col) => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y)))); c.lineWidth = wd; c.strokeStyle = col; c.stroke(); };
  poly(FP, 8 * sc, '#4a1426'); poly(FP, 5 * sc, 'rgba(231,138,156,.9)');
  // sacs: back (fresh air), front (used air)
  const sac = (x, y, rx, ry, col, col2) => { const g = c.createRadialGradient(X(x - rx * 0.3), Y(y - ry * 0.3), 2, X(x), Y(y), rx * sc); g.addColorStop(0, col); g.addColorStop(1, col2); c.beginPath(); c.ellipse(X(x), Y(y), rx * sc * kk, ry * sc * kk, 0, 0, 7); c.fillStyle = g; c.fill(); c.lineWidth = 2; c.strokeStyle = '#e78a9c'; c.stroke(); };
  sac(232, 108, 30, 24, 'rgba(150,225,255,.7)', 'rgba(60,150,220,.45)');
  sac(88, 108, 24, 20, 'rgba(255,225,140,.7)', 'rgba(210,150,40,.45)');
  // the lung: rigid, with parallel parabronchi
  c.beginPath(); c.roundRect(X(128), Y(64), 64 * sc, 56 * sc, 16 * sc); const lg = c.createLinearGradient(0, Y(64), 0, Y(120)); lg.addColorStop(0, '#f2a3ae'); lg.addColorStop(1, '#c4455e'); c.fillStyle = lg; c.fill(); c.lineWidth = 2; c.strokeStyle = '#4a1426'; c.stroke();
  c.strokeStyle = 'rgba(74,20,38,.5)'; c.lineWidth = 1.2;
  for (let k = 0; k < 6; k++) { const yy = 72 + k * 8; c.beginPath(); c.moveTo(X(136), Y(yy)); c.lineTo(X(184), Y(yy)); c.stroke(); }
  // moving air
  const dots = (pts, col, n, sp) => {
    const lens = []; let tot = 0; for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); lens.push(l); tot += l; }
    for (let m = 0; m < n; m++) {
      let d = ((time * sp + m / n) % 1) * tot, i = 0; while (i < lens.length - 1 && d > lens[i]) { d -= lens[i]; i++; }
      const u = d / lens[i], x = lerp(pts[i][0], pts[i + 1][0], u), y = lerp(pts[i][1], pts[i + 1][1], u);
      c.beginPath(); c.arc(X(x), Y(y), 3.6 * sc + 0.6, 0, 7); c.fillStyle = typeof col === 'function' ? col(u) : col; c.fill(); c.lineWidth = 1; c.strokeStyle = '#0a0c14'; c.stroke();

  const FRESH = '#5fd0ff', USED = '#f5c84c', mixc = (u) => `rgb(${Math.round(lerp(95, 245, u))},${Math.round(lerp(208, 200, u))},${Math.round(lerp(255, 76, u))})`;
  for (const yy of [74, 82, 90, 98, 106]) dots([[190, yy], [132, yy]], mixc, 3, 0.3);
  if (S.bphase === 0) { dots(FP, FRESH, 5, 0.3); dots(LA, USED, 3, 0.3); } else { dots(PL, FRESH, 3, 0.3); dots(OUT, USED, 4, 0.3); }
  pill(c, t.bSacsB, X(232), Y(146) + 8, { align: 'center' }); pill(c, t.bSacsF, X(88), Y(138) + 8, { align: 'center' });
  pill(c, t.bLung, X(160), Y(58) - 2, { align: 'center' }); pill(c, t.bTrach, X(10), Y(112), {});
  pill(c, S.bphase === 0 ? t.breathIn : t.breathOut, w / 2, 16, { align: 'center', size: 13 });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  S.nA += clamp(S.n - S.nA, -dt * 7, dt * 7);
  S.revT += clamp((S.rev1 ? 1 : 0) - S.revT, -dt * 1.6, dt * 1.6);
  S.thA += (S.th - S.thA) * Math.min(1, dt * 5); S.arA += (S.ar - S.arA) * Math.min(1, dt * 5);
  S.sqT += clamp((S.sq ? 1 : 0) - S.sqT, -dt * 2.5, dt * 2.5);
  S.filA += clamp(S.fil - S.filA, -dt * 5, dt * 5);
  const v = lab.view;
  if (v === 'tree') drawView1(c, w, h);
  else if (v === 'sac') drawView2(c, w, h, dt, time);
  else if (S.mode === 'lung') drawLung(c, w, h, dt, time);
  else if (S.mode === 'bird') drawBird(c, w, h, dt, time);
  else drawGill(c, w, h, time);
});

// tap a wall of the lung to break it
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'gills' || S.mode !== 'lung') return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, G = lungGeo(r.width, r.height);
  let best = null, bd = 18;
  for (const wl of LUNG.walls) {
    if (wl.on) continue;
    const [a, , b] = wallPts(wl, G), dx = b[0] - a[0], dy = b[1] - a[1], u = clamp(((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy), 0, 1);
    const d = Math.hypot(x - (a[0] + dx * u), y - (a[1] + dy * u));
    if (d < bd) { bd = d; best = wl; }
  }
  if (best) { best.on = true; sfx.snap(); render(); }
});

// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(p, i) {
  S['a' + p] = i;
  const P = T[lang]['p' + p];
  (i === P.ok ? sfx.good : sfx.bad)();
  if (p === 1) { S.rev1 = true; S.n = 23; S.moved = false; }
  if (p === 2) { S.th = 1.5; }
  if (p === 3) { S.fil = 6; }
  render(); setTimeout(showStage, 60);
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.p) return answer(+b.dataset.p, +b.dataset.i);
  if (b.id === 'sqB') { if (!secret.unlocked()) return secret.open(); S.sq = !S.sq; sfx.click(); return render(); }
  if (b.dataset.mode) {
    if (b.dataset.mode === 'bird') { if (!secret.unlocked()) return secret.open(); S.mode = 'bird'; S.bT = 0; } else S.mode = b.dataset.mode;
    sfx.click(); return render();
  }
  if (b.dataset.lung) {
    for (const wl of LUNG.walls) wl.on = b.dataset.lung === 'emph' ? wl.th < 0.55 : false;
    sfx.click(); return render();
  }
  if (b.dataset.breath) {
    if (b.dataset.breath === 'auto') S.bauto = true; else { S.bauto = false; S.bphase = b.dataset.breath === 'in' ? 0 : 1; }
    S.bT = 0; sfx.click(); return render();
  }
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'r1') { S.n = v; S.moved = true; sfx.tick(); } else if (id === 'r2t') { S.th = v / 10; sfx.tick(); } else if (id === 'r2a') { S.ar = v; sfx.tick(); } else if (id === 'r3') { S.fil = v; sfx.tick(); } else return;
  render();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------------
const predHTML = (p, P, ans) => (ans === null
  ? `<div class="al-q">${esc(P.q)}</div><div class="al-opts">${P.opts.map((o, i) => `<button class="al-opt" type="button" data-p="${p}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
  : `<div class="al-q small">${esc(P.q)}</div><div class="al-verdict" style="color:${ans === P.ok ? 'var(--ok)' : 'var(--wip)'}">${esc(P.v[ans])}</div><p class="al-t">${esc(P.t[ans])}</p>`);
const fx = (...ks) => ks.map((k) => { const f = T[lang].f[k]; return { emo: f[0], text: f[1], src: f[2] }; });
const setVal = (id, v) => { const el = $(id); if (String(el.value) !== String(v)) el.value = v; };

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.st = v === 'tree' ? (S.rev1 ? 'tree1' : 'tree0') : v === 'sac' ? (S.a2 === null ? 'sac0' : 'sac') : S.mode === 'lung' ? 'lung' : S.mode === 'bird' ? 'bird' : 'gill';
  $('v1').hidden = v !== 'tree'; $('v2').hidden = v !== 'sac'; $('v3').hidden = v !== 'gills';
  if (v === 'tree') render1(t); else if (v === 'sac') render2(t); else render3(t);
  lab.checkStage();
}
function render1(t) {
  const n = S.n, s = surfOf(n);
  lab.setGlow('rgba(224, 96, 123, .26)');
  $('q1').innerHTML = predHTML(1, t.p1, S.a1); $('q1').style.marginBottom = '12px';
  $('l1').textContent = t.lvl; $('d1').textContent = n; setVal('r1', n);
  lab.setReadout(fmt(2 ** n), t.sub1(n), S.rev1 ? t.pill1(fm2(s)) : '', '#e0607b');
  const extra = `<div class="fine">${esc(t.fine1)}</div>`;
  if (S.rev1 && !S.moved) lab.setState({ emo: '📐', title: t.rv1.title, lead: t.rv1.lead, body: t.rv1.body, extra });
  else lab.setState({ emo: '🌳', title: t.st1.title(n), lead: t.st1.lead(n), body: t.st1.body(n), extra });
  lab.setFacts(S.rev1 ? fx('area', 'km', 'gens', 'nomuscle') : fx('gens', 'nomuscle'));
}
function render2(t) {
  const ans = S.a2 !== null, th = S.th, flow = Math.round(flowOf(th, S.ar));
  lab.setGlow('rgba(95, 208, 255, .22)');
  $('q2').innerHTML = predHTML(2, t.p2, S.a2); $('q2').style.marginBottom = '12px';
  $('l2t').textContent = t.wall; $('d2t').textContent = `${num(th.toFixed(1))} µm`; setVal('r2t', Math.round(th * 10));
  $('l2a').textContent = t.surf; $('d2a').textContent = `${S.ar} ${lang === 'ru' ? 'м²' : 'm²'}`; setVal('r2a', S.ar);
  $('r2t').disabled = !ans; $('r2a').disabled = !ans;
  const open = secret.unlocked();
  $('sqB').textContent = open ? t.sq.chip : t.locked; $('sqB').classList.toggle('open', open); $('sqB').classList.toggle('on', S.sq);
  const extra = `<div class="fine">${esc(t.fine2)}</div>`;
  if (!ans) {
    lab.setReadout('?', '', '', '#5fd0ff');
    lab.setState({ emo: '🫧', title: t.st2a.title, lead: t.st2a.lead, body: t.st2a.body, extra: '' });
    lab.setFacts(fx('size'));
    return;
  }
  lab.setReadout(String(flow), t.sub2, t.pill2(num(th.toFixed(1))), '#5fd0ff');
  if (S.sq) { lab.setState({ emo: '🩸', title: t.sq.title, lead: t.sq.lead, body: t.sq.body, extra }); lab.setFacts(fx('rbc', 'cap')); }
  else { const b = t.st2b(flow); lab.setState({ emo: '🫧', title: b.title, lead: b.lead, body: b.body, extra }); lab.setFacts(fx('thin', 'mesh', 'size')); }
}
function render3(t) {
  const m = S.mode, ans = S.a3 !== null, open = secret.unlocked();
  $('modeSeg').innerHTML = ['gill', 'lung', 'bird'].map((k) => `<button data-mode="${k}" class="${m === k ? 'on' : ''}">${k === 'bird' && !open ? t.locked : esc(t.modes[k])}</button>`).join('');
  $('g3').hidden = m !== 'gill'; $('lu3').hidden = m !== 'lung'; $('bi3').hidden = m !== 'bird';
  const extra = `<div class="fine">${esc(t.fine3)}</div>`;
  if (m === 'gill') {
    const n = S.fil;
    lab.setGlow('rgba(231, 138, 156, .24)');
    $('q3').innerHTML = predHTML(3, t.p3, S.a3); $('q3').style.marginBottom = '12px';
    $('l3').textContent = t.fil; $('d3').textContent = n; setVal('r3', n); $('r3').disabled = !ans;
    if (!ans) { lab.setReadout('?', '', '', '#e78a9c'); lab.setState({ emo: '🐟', title: t.st3a.title, lead: t.st3a.lead, body: t.st3a.body, extra: '' }); lab.setFacts(fx('counter')); return; }
    lab.setReadout(`×${1 + 12 * n}`, t.sub3, '', '#e78a9c');
    lab.setState({ emo: '🐟', title: t.st3b.title(n), lead: t.st3b.lead, body: t.st3b.body, extra }); lab.setFacts(fx('comb', 'counter'));
  } else if (m === 'lung') {
    const st = lungStats();
    lab.setGlow('rgba(224, 96, 123, .24)');
    $('lungChips').innerHTML = [['healthy', t.healthy], ['emph', t.emph]].map(([k, l]) => `<button class="chip ${(k === 'healthy') === (st.broken === 0) ? 'on' : ''}" data-lung="${k}" type="button">${esc(l)}</button>`).join('');
    $('lungHint').textContent = t.lungHint;
    lab.setReadout(`${st.pct} %`, t.lungSub, t.lungPill(st.sacs), '#e0607b');
    if (st.broken === 0) lab.setState({ emo: '🫁', title: t.st3c.title, lead: t.st3c.lead, body: t.st3c.body, extra });
    else lab.setState({ emo: '🚬', title: t.st3d.title(st.broken), lead: t.st3d.lead, body: t.st3d.body(st.pct), extra });
    lab.setFacts(fx('emph'));
  } else {
    lab.setGlow('rgba(95, 208, 255, .22)');
    $('birdChips').innerHTML = [['in', t.breathIn, !S.bauto && S.bphase === 0], ['out', t.breathOut, !S.bauto && S.bphase === 1], ['auto', t.auto, S.bauto]].map(([k, l, on]) => `<button class="chip ${on ? 'on' : ''}" data-breath="${k}" type="button">${esc(l)}</button>`).join('');
    const b = S.bphase === 0 ? t.stBin : t.stBout;
    lab.setReadout(S.bphase === 0 ? '→' : '←', b.title, '', '#5fd0ff');
    lab.setState({ emo: '🐦', title: b.title, lead: b.lead, body: b.body, extra }); lab.setFacts(fx('bird'));
  }
}
render();
