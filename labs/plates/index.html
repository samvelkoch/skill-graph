// 2. Constants, formatting helpers, state
// ---------------------------------------------------------------------------------------------------------------
const R_E = 6371, CRUST = 35, MANTLE_BASE = 2890, OUTER_BASE = 5150; // km: radius, drawn crust, mantle/outer-core bottoms (standard Earth model)
const RATE = 4;       // cm per year: a typical plate speed (a few cm/yr)
const NAIL = 3.5;     // cm per year: approximate fingernail growth
const MAX_YEARS = 15e6, NAIL_YEARS = 20, PANG_MYR = 200;

const nf = (n, d = 0) => new Intl.NumberFormat(lang, { maximumFractionDigits: d }).format(n);
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
function yrs(y) {
  const n = (v) => nf(v, v < 10 ? 1 : 0);
  if (y < 1000) { const k = Math.round(y); return lang === 'ru' ? `${nf(k)} ${ruPlural(k, 'год', 'года', 'лет')}` : lang === 'hu' ? `${nf(k)} év` : `${nf(k)} ${k === 1 ? 'year' : 'years'}`; }
  if (y < 1e6) { const k = y / 1000; return lang === 'ru' ? `${n(k)} тыс. лет` : lang === 'hu' ? `${n(k)} ezer év` : `${n(k)} thousand years`; }
  const m = y / 1e6; return lang === 'ru' ? `${n(m)} млн лет` : lang === 'hu' ? `${n(m)} millió év` : `${n(m)} million years`;
}
function dist(cm) {
  const u = T[lang].u;
  if (cm < 100) return `${nf(cm, cm < 10 ? 1 : 0)} ${u.cm}`;
  const m = cm / 100; if (m < 1000) return `${nf(m, m < 10 ? 1 : 0)} ${u.m}`;
  const km = m / 1000; return `${nf(km, km < 10 ? 1 : 0)} ${u.km}`;
}
const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const yearsOf = (x) => MAX_YEARS * x * x * x;
const mixc = (a, b, t) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };

const scene = () => S.secret === 's1' ? 'nails' : S.secret === 's2' ? 'pang' : lab.view;

function buildCtrl() {
  const sc = scene(), c = SL[sc];
  $('ctrlBody').innerHTML = `<input type="range" class="big" id="slider" min="0" max="${c.max}" step="1" value="${Math.round(c.get())}"><div class="chips" id="chips2"></div><div class="chips" id="chips"></div>`;
  $('slider').style.setProperty('--track', c.track);
}
function syncSlider() { const s = $('slider'); if (s) s.value = String(Math.round(SL[scene()].get())); }
function renderChips() {
  const t = T[lang], sc = scene(), open = secret.unlocked();
  const sec = (k) => `<button class="chip secret ${open ? 'open' : ''} ${S.secret === k ? 'on' : ''}" data-k="${k}">${open ? esc(t.secrets[k][0]) : '🔒 ???'}</button>`;
  const c = (k, label, on) => `<button class="chip ${on ? 'on' : ''}" data-k="${k}">${esc(label)}</button>`;
  let row = [], row2 = [];
  if (sc === 'inside') {
    row = [sec('s1'), c('dig:0', t.dig.surf), c('dig:1500', t.dig.mantle), c('dig:4000', t.dig.outer), c(`dig:${R_E}`, t.dig.centre), c('big', t.big, S.big), sec('s2')];
  } else if (sc === 'edges') {
    row = [sec('s1'), ...Object.keys(t.modes).map((m) => c(`mode:${m}`, t.modes[m].chip, S.mode === m)), sec('s2')];
    const y = yearsOf(S.ex);
    row2 = [1, 1000, 1e6, 1e7].map((v) => c(`yr:${v}`, yrs(v), Math.abs(y - v) / v < 0.02)); row2.push(c('play', S.play ? t.pause : t.play, S.play));
  } else if (sc === 'quake') {
    row = [sec('s1'), c('slip', t.qk.slipNow), c('play', S.play ? t.qk.pause : t.qk.squeeze, S.play), sec('s2')];
  } else if (sc === 'nails') {
    row = [sec('s1'), ...[2, 4, 8].map((r) => c(`rate:${r}`, fill(t.nails.rate, { r }), S.rate === r)), c('play', S.play ? t.pause : t.play, S.play), sec('s2')];
  } else {
    row = [sec('s1'), c('play', S.play ? t.pause : t.play, S.play), sec('s2')];
  }
  $('chips').innerHTML = row.join(''); $('chips2').innerHTML = row2.join(''); $('chips2').hidden = !row2.length;
}
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'slider') return;
  const v = +ev.target.value, sc = scene(), wasPlaying = S.play; S.play = false;
  if (sc === 'inside') S.depth = v; else if (sc === 'edges') S.ex = v / 1000; else if (sc === 'quake') pull(v / 1000);
  else if (sc === 'nails') S.nx = v / 1000; else S.px = v / 1000;
  sfx.tick(); if (wasPlaying) renderChips();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('.chip'); if (!b) return;
  const [a, v] = b.dataset.k.split(':'), sc = scene();

    if (!secret.unlocked()) return secret.open();
    S.secret = S.secret === a ? null : a; S.play = false;
  } else if (a === 'dig') S.depth = +v;
  else if (a === 'big') S.big = !S.big;
  else if (a === 'mode') S.mode = v;
  else if (a === 'yr') { S.ex = Math.cbrt(+v / MAX_YEARS); S.play = false; }
  else if (a === 'rate') S.rate = +v;
  else if (a === 'slip') { if (S.strain < 0.04) S.strain = 0.3; slip(); }
  else if (a === 'play') {
    S.play = !S.play;
    if (S.play) {
      if (sc === 'edges' && S.ex >= 1) S.ex = 0;
      if (sc === 'nails' && S.nx >= 1) S.nx = 0;
      if (sc === 'pang' && S.px >= 1) S.px = 0;
    }
  }
  sfx.click(); render();
});

// ---------------------------------------------------------------------------------------------------------------
// 4. Physics of the toys
// ---------------------------------------------------------------------------------------------------------------
function pull(s) {
  if (S.off && S.off.t > 0.3) S.off = null;
  S.strain = clamp(s, 0, 1);
  if (S.strain >= 0.999) slip();
}
function slip() {
  const m = S.strain; if (m < 0.04) return;
  S.off = { mag: m, t: 0 }; S.wave = { mag: m, t: 0 }; S.strain = 0; S.drag = null;
  sfx.snap(); syncSlider();
}
function tick(dt) {
  const sc = scene();
  if (S.off) S.off.t += dt;
  if (S.wave) { S.wave.t += dt; if (S.wave.t > 5.5) S.wave = null; }
  S.vis += (S.strain - S.vis) * (1 - Math.exp(-dt * (S.strain < S.vis ? 30 : 14)));
  if (!S.play) return;
  const stop = () => { S.play = false; renderChips(); };
  if (sc === 'edges') { S.ex = Math.min(1, S.ex + dt * 0.13); if (S.ex >= 1) stop(); }
  else if (sc === 'nails') { S.nx = Math.min(1, S.nx + dt * 0.12); if (S.nx >= 1) stop(); }
  else if (sc === 'pang') { S.px = Math.min(1, S.px + dt * 0.1); if (S.px >= 1) stop(); }
  else if (sc === 'quake') {
    if (S.wait > 0) S.wait -= dt;
    else { if (S.off) S.off = null; S.strain = Math.min(1, S.strain + dt * 0.22); if (S.strain >= 1) { slip(); S.wait = 2.8; } }
  } else S.play = false;
  syncSlider();
}

const layerAt = (d) => d < CRUST ? 'crust' : d < MANTLE_BASE ? 'mantle' : d < OUTER_BASE ? 'outer' : 'inner';
const LCOL = { crust: '#c58b5a', mantle: '#e0662a', outer: '#ffb43c', inner: '#ffe9a0' };
const LGLOW = { crust: 'rgba(197,139,90,.25)', mantle: 'rgba(224,102,42,.28)', outer: 'rgba(255,180,60,.28)', inner: 'rgba(255,233,160,.3)' };
const pnOf = () => clamp(yearsOf(S.ex) * RATE * 1e-5 / 600, 0, 1); // km moved / 600 km of canvas
function info() {
  const t = T[lang], sc = scene();
  if (sc === 'inside') {
    const L = layerAt(S.depth), x = t.layer[L];
    return { val: `${nf(S.depth)} ${t.u.km}`, sub: fill(t.depthSub, { r: nf(R_E) }), pill: x.pill, color: LCOL[L], glow: LGLOW[L],
      st: { emo: '🌍', title: x.title, lead: x.lead, body: fill(x.body, { r: nf(R_E) }), extra: `<div class="fine">${L === 'crust' ? esc(t.kola) + '<br>' : ''}${esc(t.fineIn)}</div>` } };
  }
  if (sc === 'edges') {
    const y = yearsOf(S.ex), D = RATE * y, M = t.modes[S.mode], pn = pnOf(), ph = pn < 0.03 ? 0 : pn < 0.5 ? 1 : 2;
    const emo = { dive: '🌋', mount: '🏔️', apart: '🌊', slide: '↔️' }[S.mode];
    return { val: dist(D), sub: `${fill(t.formula, { r: dist(RATE), y: yrs(y), d: dist(D) })}`, pill: M.chip, color: '#ff8a3d', glow: 'rgba(255,138,61,.22)',
      st: { emo, title: M.title, lead: M.lead, body: M.body, extra: `<div class="now">${esc(M.ph[ph])}</div><div class="fine">${esc(t.fineEd)}</div>` } };
  }
  if (sc === 'quake') {
    const q = t.qk, w = S.wave;
    let x = S.strain > 0.04 ? q.build : q.idle, pill = S.strain > 0.04 ? q.pills.build : q.pills.stuck, col = S.strain > 0.5 ? '#ff5a3c' : '#f5c84c';
    if (w) { x = { ...q.slip, ...(w.mag < 0.35 ? q.small : {}) }; pill = q.pills.sizes[w.mag < 0.35 ? 0 : w.mag < 0.7 ? 1 : 2]; col = '#ff5a3c'; }
    return { val: `${Math.round(S.strain * 100)}%`, sub: q.strainSub, pill, color: col, glow: 'rgba(255,90,60,.22)',
      st: { emo: w ? '💥' : '🪨', title: x.title, lead: x.lead, body: x.body, extra: `<div class="legend">⭐ ${q.legend}</div><div class="fine">${esc(q.fine)}</div>` } };
  }
  if (sc === 'nails') {
    const n = t.nails, y = NAIL_YEARS * S.nx, nail = NAIL * y, plate = S.rate * y;
    const verdict = y < 0.3 ? n.zero : S.rate < NAIL ? n.winN : n.winP;
    return { val: yrs(y), sub: fill(n.result, { n: dist(nail), p: dist(plate) }), pill: fill(n.rate, { r: S.rate }), color: '#f6b8c8', glow: 'rgba(246,184,200,.2)',
      st: { emo: '💅', title: n.title, lead: n.lead, body: n.body, extra: `<div class="now">${esc(verdict)}</div><div class="fine">${esc(n.fine)}</div>` } };
  }
  const p = t.pang, myr = PANG_MYR * (1 - S.px);
  return { val: myr < 0.5 ? p.today : `${nf(Math.round(myr))} ${p.ago}`, sub: fill(p.sub, { d: dist(RATE * myr * 1e6) }), pill: myr >= 190 ? p.name : '', color: '#3ddc97', glow: 'rgba(61,220,151,.2)',

  c.save(); c.strokeStyle = '#ff5a3c'; c.lineWidth = 3; c.shadowColor = '#ff5a3c'; c.shadowBlur = 8; c.beginPath(); c.moveTo(xf, 0);
  for (let y = 0; y <= h; y += h / 14) c.lineTo(xf + ((Math.round(y / (h / 14)) % 2) ? 3 : -3), y); c.stroke(); c.restore();
  if (pn > 0.001) quakeDots(c, [0.2, 0.45, 0.7, 0.9].map((f) => [xf, h * f]), time);

// ---------------------------------------------------------------------------------------------------------------
// 9. Scene: earthquake
// ---------------------------------------------------------------------------------------------------------------
function drawQuake(c, w, h, time) {

  sky(c, w, ys + 4, '#0b1024', '#1a2547');

    if (S.off) return S.off.mag * A * (1 - ease((S.off.t - 0.7) / 1.6));
    return S.vis * A;
  };
  const F = far(), r = S.off ? ease(S.off.t / 0.22) : 0;

  const cy = (k, x) => k === 4 ? yb[4] : yb[k] + disp(x) + shake(x, yb[k]) * (1 - 0.15 * k);
  const block = (xa, xb) => {
    for (let k = 0; k < 4; k++) {
      c.fillStyle = cols[k]; c.beginPath();

  c.strokeStyle = '#140d18'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(xf, ys - 4); c.lineTo(xf, h); c.stroke();
  // seismic waves (rings) through the ground

    c.save(); c.beginPath(); c.rect(0, ys - 2, w, h); c.clip();

    }

  const gl = 0.35 + 0.65 * S.vis + (S.wave ? 0.6 * Math.exp(-S.wave.t * 2) : 0), sr = 7 + 3 * pulse(time, 0, 5) * S.vis;
  c.save(); c.shadowColor = '#ffcf55'; c.shadowBlur = 8 + 18 * gl; c.fillStyle = '#ffe08a'; c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? sr * 0.45 : sr; c.lineTo(fx + Math.cos(a) * rr, fy + Math.sin(a) * rr); } c.closePath(); c.fill(); c.restore();
  txt(c, q.focus, fx + 14, fy + 4, { size: fs, color: '#ffe08a', maxW: w * 0.4, shadow: true });
  const ye = ys + shake(xf, ys);
  c.fillStyle = '#ff5a3c'; c.beginPath(); c.moveTo(xf, ye + 1); c.lineTo(xf - 6, ye - 11); c.lineTo(xf + 6, ye - 11); c.closePath(); c.fill();
  txt(c, q.epi, xf, ye - 16, { size: fs, align: 'center', color: '#ff8a70', maxW: w * 0.26, shadow: true });
  // crack at the surface after a big one

    for (let i = 1; i <= 6; i++) c.lineTo(xf + (i % 2 ? 1 : -1) * w * 0.012 * i * S.wave.mag + (i * 2.7 % 3), ye + 3 + i * 1.6); c.stroke(); c.globalAlpha = 1;
  }

    const x = w * fxr, yy = ys + disp(x) + shake(x, ys), sh = shake(x, ys) * 0.7;

  c.fillStyle = '#cfe3ff'; c.fillRect(x0 - 6, sy - amp * 1.2, 6, amp * 2.4); c.fillRect(x1, sy - amp * 1.2, 6, amp * 2.4);

  txt(c, q.spring, w / 2, sy + amp + fs + 3, { size: fs - 1, align: 'center', color: 'rgba(237,239,247,.65)', weight: 700, maxW: w * 0.5 });

// ---------------------------------------------------------------------------------------------------------------
// 10. Secret scenes
// ---------------------------------------------------------------------------------------------------------------
function drawNails(c, w, h, time) {
  const t = T[lang], n = t.nails, fs = clamp(w / 34, 11, 14);
  sky(c, w, h);
  const x0 = w * 0.12, x1 = w * 0.92, maxCm = 180, sc = (x1 - x0) / maxCm, y = NAIL_YEARS * S.nx, nail = NAIL * y, plate = S.rate * y;
  const yb = h * 0.84; c.strokeStyle = 'rgba(237,239,247,.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x0, yb); c.lineTo(x1, yb); c.stroke();
  for (let cm = 0; cm <= maxCm; cm += 20) { const x = x0 + cm * sc; c.beginPath(); c.moveTo(x, yb); c.lineTo(x, yb + (cm % 60 === 0 ? 8 : 4)); c.stroke(); if (cm % 60 === 0) txt(c, `${cm}`, x, yb + 22, { size: fs - 1, align: 'center', color: '#98A0B8', weight: 700 }); }
  txt(c, t.u.cm, x1 + 2, yb + 22, { size: fs - 1, color: '#98A0B8', weight: 700 });
  c.setLineDash([4, 5]); c.strokeStyle = 'rgba(255,255,255,.3)'; c.beginPath(); c.moveTo(x0, h * 0.12); c.lineTo(x0, yb); c.stroke(); c.setLineDash([]);
  const y1 = h * 0.33, y2 = h * 0.62, lh = h * 0.11;
  // fingernail lane
  c.fillStyle = '#d99a86'; c.beginPath(); c.roundRect(x0 - w * 0.07, y1 - lh * 0.6, w * 0.07 + 2, lh * 1.2, 8); c.fill();
  const tipx = x0 + nail * sc, ng = c.createLinearGradient(x0, 0, x0 + Math.max(10, nail * sc), 0); ng.addColorStop(0, '#f1a9ba'); ng.addColorStop(1, '#fff3f6');
  c.fillStyle = ng; c.beginPath(); c.roundRect(x0, y1 - lh / 2, Math.max(8, nail * sc), lh, 6); c.fill();
  txt(c, n.nail, x0, y1 - lh * 0.8, { size: fs, maxW: w * 0.4 });
  txt(c, dist(nail), clamp(x0 + Math.max(8, nail * sc), x0 + 30, w - 4), y1 + lh * 1.15 + 4, { size: fs, align: 'right', color: '#f6b8c8' });
  // plate lane
  const px = x0 + plate * sc, pw = clamp(w * 0.1, 30, 70), ph = lh * 1.2;
  c.setLineDash([3, 6]); c.strokeStyle = 'rgba(217,138,74,.6)'; c.lineWidth = 2; c.beginPath(); c.moveTo(x0, y2); c.lineTo(px, y2); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#d98a4a'; c.strokeStyle = '#ffd7b0'; c.lineWidth = 1.5; c.beginPath();
  const bump = [[-0.5, 0.1], [-0.35, -0.45], [-0.05, -0.5], [0.25, -0.4], [0.5, -0.05], [0.4, 0.4], [0.05, 0.5], [-0.3, 0.42]];
  bump.forEach(([bx, by], i) => { const X = px + bx * pw, Y = y2 + by * ph; i ? c.lineTo(X, Y) : c.moveTo(X, Y); }); c.closePath(); c.fill(); c.stroke();
  txt(c, n.plate, x0, y2 - ph * 0.85, { size: fs, maxW: w * 0.4 });
  txt(c, dist(plate), clamp(px + pw * 0.5, x0 + 30, w - 4), y2 + ph * 0.5 + fs + 6, { size: fs, align: 'right', color: '#ffb87a' });
  if (y > 0.3) txt(c, '🏆', S.rate < NAIL ? clamp(tipx, 20, w - 20) : clamp(px, 20, w - 20), (S.rate < NAIL ? y1 - lh * 0.8 : y2 - ph * 0.85) - 4, { size: fs + 5, align: 'center' });
}
const CONT = {
  na: { c: '#d29a5f', p: [[8, 16], [22, 10], [38, 9], [52, 14], [66, 16], [70, 22], [60, 30], [54, 38], [48, 42], [42, 46], [37, 40], [30, 36], [22, 32], [14, 28], [8, 22]], to: { dx: 24, dy: 12, rot: 10, sc: 0.8 } },
  sa: { c: '#b8864f', p: [[58, 46], [66, 45], [74, 50], [80, 56], [76, 64], [68, 72], [63, 80], [60, 76], [61, 66], [58, 58], [55, 52]], to: { dx: 6, dy: 2, rot: -5, sc: 0.9 } },
  eu: { c: '#c9a15b', p: [[94, 18], [104, 12], [120, 8], [140, 8], [165, 10], [190, 14], [196, 22], [188, 30], [178, 38], [168, 40], [158, 36], [150, 42], [142, 40], [136, 36], [126, 34], [116, 34], [108, 36], [100, 32], [96, 26]], to: { dx: -24, dy: 8, rot: 0, sc: 0.75 } },
  af: { c: '#d08b5b', p: [[92, 38], [104, 37], [116, 38], [124, 42], [128, 48], [122, 54], [118, 62], [112, 70], [106, 70], [102, 60], [98, 52], [92, 46], [90, 42]], to: { dx: -8, dy: 6, rot: 0, sc: 0.95 } },
  in: { c: '#b9945a', p: [[130, 40], [142, 38], [146, 42], [139, 56], [136, 56]], to: { dx: -11, dy: 20, rot: -30, sc: 0.9 } },
  au: { c: '#cf9d6d', p: [[160, 60], [168, 57], [176, 60], [180, 66], [176, 72], [168, 74], [161, 70]], to: { dx: -46, dy: 6, rot: -10, sc: 0.9 } },
  an: { c: '#dfe8f2', p: [[30, 92], [60, 88], [100, 87], [140, 88], [170, 90], [190, 93], [190, 100], [30, 100]], to: { dx: 0, dy: -3, rot: 0, sc: 0.5 } },
};
Object.values(CONT).forEach((o) => { o.cen = [o.p.reduce((a, q) => a + q[0], 0) / o.p.length, o.p.reduce((a, q) => a + q[1], 0) / o.p.length]; });
function drawPang(c, w, h, time) {
  const t = T[lang], fs = clamp(w / 34, 11, 15), m = 1 - S.px;
  sky(c, w, h);
  const sc = Math.min(w * 0.96 / 200, h * 0.86 / 100), ox = (w - 200 * sc) / 2, oy = (h - 100 * sc) / 2;
  c.fillStyle = '#10305a'; c.beginPath(); c.roundRect(ox, oy, 200 * sc, 100 * sc, 10); c.fill();
  c.strokeStyle = 'rgba(160,200,255,.12)'; c.lineWidth = 1;
  for (let i = 1; i < 8; i++) { c.beginPath(); c.moveTo(ox + i * 25 * sc, oy); c.lineTo(ox + i * 25 * sc, oy + 100 * sc); c.stroke(); }
  for (let j = 1; j < 4; j++) { c.beginPath(); c.moveTo(ox, oy + j * 25 * sc); c.lineTo(ox + 200 * sc, oy + j * 25 * sc); c.stroke(); }
  Object.values(CONT).forEach((o) => {
    const [cx, cy] = o.cen, tr = o.to, a = m * tr.rot * Math.PI / 180, s = 1 + (tr.sc - 1) * m, ca = Math.cos(a), sa = Math.sin(a);
    c.beginPath();
    o.p.forEach(([x, y], i) => { const X = (x - cx) * s, Y = (y - cy) * s, px = cx + m * tr.dx + X * ca - Y * sa, py = cy + m * tr.dy + X * sa + Y * ca; i ? c.lineTo(ox + px * sc, oy + py * sc) : c.moveTo(ox + px * sc, oy + py * sc); });
    c.closePath(); c.fillStyle = o.c; c.fill(); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.2; c.stroke();
  });
  if (m > 0.9) txt(c, t.pang.name, ox + 100 * sc, oy + 6 * sc, { size: fs + 3, align: 'center', color: '#fff', shadow: true });
}

// ---------------------------------------------------------------------------------------------------------------
// 11. Loop and pointer input
// ---------------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  tick(dt); update();
  const sc = scene();
  if (sc === 'inside') { sky(c, w, h); drawInside(c, w, h, time); }
  else if (sc === 'edges') drawEdges(c, w, h, time);
  else if (sc === 'quake') drawQuake(c, w, h, time);
  else if (sc === 'nails') drawNails(c, w, h, time);
  else drawPang(c, w, h, time);
});
const cvEl = $('cv'), pos = (ev) => { const r = cvEl.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
cvEl.addEventListener('pointerdown', (ev) => {

  cvEl.setPointerCapture(ev.pointerId); S.play = false;
  if (sc === 'quake') S.drag = { x: ev.clientX, s: S.strain }; else S.drag = { dig: true };
  cvMove(ev);
});
function cvMove(ev) {
  if (!S.drag) return;
  if (S.drag.dig) { const g = S.geo; if (!g) return; S.depth = Math.round(clamp((pos(ev).y - (g.cy - g.R)) / g.k, 0, R_E)); }
  else { pull(S.drag.s + (ev.clientX - S.drag.x) / (cvEl.clientWidth * 0.5)); }

}

['pointerup', 'pointercancel'].forEach((e) => cvEl.addEventListener(e, () => { S.drag = null; renderChips(); }));
render();
