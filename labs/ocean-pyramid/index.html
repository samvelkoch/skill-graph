  pill(c, T0.ox.mid, mid, h * .1, { f: 14, bg: '#fff', fg: '#0a0c14', pad: 18 });
  pill(c, T0.ox.land, mid * .5, h * .93, { f: 12 }); pill(c, T0.ox.sea, mid * 1.5, h * .93 - 18, { f: 12 });
}

// --- input --------------------------------------------------------------------------------------------------
const cv = $('cv');
const hit = (arr, x, y) => { let best = null, bd = 1e9; for (const p of arr) { const d = Math.hypot(p.x - x, p.y - y); if (d < p.r && d < bd) { bd = d; best = p; } } return best; };
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'chain') {
    const p = hit(CP.map((q, i) => ({ ...q, i })), x, y);
    if (!p) return;
    S.sel = p.i; S.top = Math.max(S.top, p.i); S.ch = { i: p.i, t0: tn() }; sfx.click(); render();
  } else if (lab.view === 'web') {
    const p = hit(WP, x, y); if (!p) return;
    if (S.ev && !S.wg) {
      if (p.k === EVT[S.ev].o) { sfx.bad(); return; }
      S.wg = p.k; S.wT0 = tn(); S.wDone = false; sfx.click(); render();
    } else if (!S.ev) { S.wsel = p.k; sfx.click(); render(); }
  }
});
$('depth').addEventListener('input', (ev) => { S.depth = +ev.target.value; render(); });
$('pct').addEventListener('input', (ev) => { S.pct = +ev.target.value; render(); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); if (S.sec) showStage();
  } else if (act === 'ev') {
    S.ev = b.dataset.k; S.wg = null; S.wDone = false; S.wsel = null; S.snap = false; sfx.click();
  } else if (act === 'reset') { S.ev = null; S.wg = null; S.wDone = false; sfx.click(); }
  render();
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.g) {
    S.guess = b.dataset.g; S.revT0 = tn(); S.shown = false; (S.guess === '10000' ? sfx.good : sfx.bad)(); showStage();
  } else if (b.dataset.go) { S.go = true; sfx.click(); S.snap = false; }
  render();
});

// --- one render per change: controls, readout, state card, facts ------------------------------------------------
function setAsk(html) { askEl.style.display = html ? '' : 'none'; if (html) askEl.innerHTML = html; }
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secChain').style.display = v === 'chain' ? '' : 'none';
  $('secPyr').style.display = v === 'pyramid' ? '' : 'none';
  $('secWeb').style.display = v === 'web' ? '' : 'none';
  setAsk('');
  if (v === 'chain') renderChain(t); else if (v === 'pyramid') renderPyr(t); else renderWeb(t);
}
function renderChain(t) {
  const c = t.c, d = S.depth, li = lightPct(d), alive = d < 200, open = secret.unlocked();
  $('dLbl').textContent = c.depthLbl; $('dE0').textContent = c.ends[0]; $('dE1').textContent = c.ends[1]; $('depth').value = d; $('depth').setAttribute('aria-label', c.depthLbl);
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('chainSec').innerHTML = sc('whale', '🐋') + sc('oxygen', '🫧');
  if (S.sec === 'whale') {
    lab.setReadout(t.wh.val, t.wh.sub, t.wh.pill, '#4b6a8c');
    lab.setState({ emo: '🐋', title: t.secrets.whale[0], lead: t.wh.lead, body: t.wh.body, extra: '' }); lab.setFacts(t.facts.whale); lab.setGlow('rgba(75, 106, 140, .4)'); return;
  }
  if (S.sec === 'oxygen') {
    lab.setReadout(t.ox.val, t.ox.sub, t.ox.pill, '#58c46a');
    lab.setState({ emo: '🫧', title: t.secrets.oxygen[0], lead: t.ox.lead, body: t.ox.body, extra: '' }); lab.setFacts(t.facts.web); lab.setGlow('rgba(88, 196, 106, .3)'); return;
  }
  lab.setGlow('rgba(60, 150, 210, .32)');
  lab.setReadout(`${d} ${lang === 'ru' ? 'м' : 'm'}`, `${li < 1 ? '<1' : Math.round(li)} % ${c.light}`, alive ? c.zones[0] : c.zones[1], alive ? '#e0a82e' : '#26354f');
  let st;
  if (S.sel > 0) {
    const k = CHAIN[S.sel], pk = CHAIN[S.sel - 1];
    st = { emo: CEMO[S.sel], title: nm(t, k), lead: t.nodes[k][1], body: c.eats + sn(t, pk) + '.' };
  } else if (!alive) st = { emo: '🌑', title: c.darkT, lead: c.darkL, body: '' };
  else if (S.sel === 0) st = { emo: CEMO[0], title: nm(t, 'ph'), lead: t.nodes.ph[1], body: '' };
  else st = { emo: '🔗', title: c.introT, lead: c.introL, body: '' };
  lab.setState({ ...st, extra: `<div class="op-fine">${esc(c.fine)}</div>` });
  lab.setFacts(t.facts.chain);
}
function renderPyr(t) {
  const p = t.p, pc = S.pct, m0 = pmass(0);
  lab.setGlow('rgba(70, 140, 200, .3)');
  $('pSlide').style.display = S.go ? '' : 'none';
  $('pLbl').textContent = p.slide; $('pE0').textContent = p.pctEnds[0]; $('pE1').textContent = p.pctEnds[1]; $('pct').value = pc; $('pct').setAttribute('aria-label', p.slide); $('pFine').textContent = p.fine;
  if (S.go) { // free play with the percentage
    setAsk('');
    lab.setReadout(`${fmtN(m0)} ${p.unit}`, p.need, p.passed(pc), '#58c46a');
    lab.setState({ emo: '🔺', title: p.stT(pc), lead: p.stL(pc, fmtN(m0)), body: p.stB(pc), extra: `<div class="op-fine">${esc(p.fine)}</div>` });
  } else if (S.guess === null) {
    setAsk(`<div class="op-q">${esc(p.q)}</div><div class="op-opts">${['1', '100', '10000'].map((g, i) => `<button data-g="${g}">${esc(p.opts[i])}</button>`).join('')}</div>`);
    lab.setReadout('1 ' + p.unit, p.grow, '', '#46536d');
    lab.setState({ emo: '🧊', title: p.q, lead: p.lead0, body: '', extra: '' });
  } else if (!S.shown) {
    const gi = ['1', '100', '10000'].indexOf(S.guess);
    setAsk(`<div class="op-q">${esc(p.q)}</div><div class="op-p" style="margin:0">${esc(p.yours(p.opts[gi]))}</div>`);
    lab.setReadout('1 ' + p.unit, p.grow, '', '#46536d');
    lab.setState({ emo: '🧊', title: p.watch, lead: p.yours(p.opts[gi]), body: '', extra: '' });
  } else {
    const right = S.guess === '10000';
    setAsk(`<div class="op-v" style="color:${right ? 'var(--ok)' : 'var(--wip)'}">${esc(right ? p.ok : p.no)}</div><div class="op-p">${esc(p.why)}</div>
      <div class="op-opts" style="margin-bottom:8px">${['1', '100', '10000'].map((g, i) => `<span class="op-o ${g === '10000' ? 'ok' : g === S.guess ? 'me' : ''}">${esc(p.opts[i])}</span>`).join('')}</div>
      <div class="op-opts"><button class="op-go" data-go="1">${esc(p.go)}</button></div>`);
    lab.setReadout(`${fmtN(m0)} ${p.unit}`, p.need, p.passed(pc), '#58c46a');
    lab.setState({ emo: right ? '✅' : '🤔', title: right ? p.ok : p.no, lead: p.why, body: '', extra: '' });
  }
  lab.setFacts(t.facts.pyramid);
}
function renderWeb(t) {
  const w = t.w, e = S.ev ? EVT[S.ev] : null, ev = S.ev ? w.ev[S.ev] : null;
  lab.setGlow('rgba(60, 170, 190, .3)');
  $('evChips').innerHTML = Object.keys(EVT).map((k) => `<button class="chip ${S.ev === k ? 'on' : ''}" data-act="ev" data-k="${k}">${esc(w.chips[k])}</button>`).join('')
    + (S.ev ? `<button class="chip" data-act="reset">${esc(w.reset)}</button>` : '');
  $('wBars').textContent = w.bars;
  if (!e) {
    setAsk(`<div class="op-p" style="margin:0">${esc(w.introL)}</div>`);
    lab.setReadout('🕸️', w.introT, '', '#3caabe');
    if (S.wsel) lab.setState({ emo: '🔎', title: nm(t, S.wsel), lead: t.nodes[S.wsel][1], body: '', extra: '' });
    else lab.setState({ emo: '🕸️', title: w.introT, lead: w.introL, body: '', extra: '' });
  } else if (!S.wg) {
    setAsk(`<div class="op-q" style="margin:0;font-size:17px">${esc(ev.q)}</div>`);
    lab.setReadout(e.emo, w.chips[S.ev].replace(/^\S+\s/, ''), '', '#3caabe');
    lab.setState({ emo: e.emo, title: ev.q, lead: '', body: '', extra: '' });
  } else if (!S.wDone) {
    setAsk(`<div class="op-p" style="margin:0">${esc(w.watch)}</div>`);
    lab.setReadout(e.emo, w.chips[S.ev].replace(/^\S+\s/, ''), '', '#3caabe');
    lab.setState({ emo: e.emo, title: w.watch, lead: '', body: '', extra: '' });
  } else {
    const right = S.wg === e.most;
    let up = 0, dn = 0; for (const k of Object.keys(BASE)) { const dv = (e.to[k] ?? BASE[k]) - BASE[k]; if (dv > 1.5) up++; else if (dv < -1.5) dn++; }
    setAsk(`<div class="op-v" style="color:${right ? 'var(--ok)' : 'var(--wip)'};margin:0">${esc(right ? w.right : w.no)}</div><div class="op-p" style="margin:3px 0 0">${esc(ev.res)}</div>`);
    lab.setReadout(e.emo, w.chips[S.ev].replace(/^\S+\s/, ''), w.pill(up, dn), '#3caabe');
    lab.setState({ emo: right ? '✅' : '🤔', title: right ? w.right : w.no, lead: ev.res, body: w.again, extra: '' });
  }
  lab.setFacts(t.facts.web);
}

canvasLoop(cv, (c, w, h, dt, t) => {
  W = w; Hh = h;
  if (lab.view === 'chain') { if (S.sec === 'whale') drawWhaleSec(c, w, h, t); else if (S.sec === 'oxygen') drawOxy(c, w, h, t); else drawChain(c, w, h, dt, t); }
  else if (lab.view === 'pyramid') drawPyr(c, w, h, dt, t);
  else drawWeb(c, w, h, dt, t);
});
render();
</script>
</body>
