function initStripes() {

  for (let side = 0; side < 2; side++) for (let k = 0; k < 9; k++) ST.flies.push({ side, k, mode: 'orbit', a: rnd(0, TAU), sp: rnd(1.3, 2.6), tm: rnd(0.5, 3), x: 0, y: 0, tx: 0, ty: 0, vx: 0, vy: 0, bt: 0, veer: false, ready: false });

// --- secret 2: cheetah sprint ------------------------------------------------------------------------------
function startChase() {
  Object.assign(CH, { ph: 'run', t: 0, gap: 0.34, vc: 0, sp: 1, Tt: rnd(3.2, 6), nextZig: rnd(1.8, 2.3), slow: 0, lane: 0, laneT: 0, cl: 0, gx: 0.64, peak: 0, result: null, vg: rnd(0.54, 0.64), vgNow: 0, zigDir: 1 });

function stepChase(dt) {

    CH.t += dt; const t = CH.t;

    else if ((t > 1.6 + CH.Tt * 0.7 && CH.gap > 0.06) || t > 14) { CH.ph = 'done'; CH.result = 'lose'; sfx.bad(); render(); }

    CH.vc = Math.max(0, CH.vc - dt * 0.9);
    if (CH.result === 'lose') { CH.gx += dt * 0.55; CH.vgNow = CH.vg; CH.scroll += CH.vgNow * dt * 0.5 * Math.max(0, 1 - (CH.gx - 0.64) * 3); }

  } else {
    lab.setFacts([fact(t, 'bison', '🦬')]);
    const n = SF.pick.filter((x) => x >= 0).length, right = SF.pick.filter((x, i) => x === ANS[i]).length;
    if (SF.checked) { lab.setReadout(`${right} / 4`, '', t.sRes(right), '#5bb0d0'); lab.setState({ emo: right === 4 ? '✅' : '🤔', title: t.sResT, lead: t.sRes(right), body: t.sResB }); }
    else { lab.setReadout(t.matched(n), '', '', '#5bb0d0'); lab.setState({ emo: '🦓', title: t.sAskT, lead: t.sAskL, body: t.sAskB }); }
  }
}
function render() {
  const t = T[lang], v = S.secret || lab.view, open = secret.unlocked();
  document.body.dataset.v = v; document.body.dataset.ph = v === 'eyes' ? E.ph : '';
  let ov = '', ct = '';
  if (v === 'eyes') {
    if (E.ph === 'ask') ov = `<div class="card sv-ask"><div class="q">${esc(t.eQ)}</div><div class="o">${t.eO.map((o, i) => `<button class="sv-btn" data-act="eg" data-g="${i}">${esc(o)}</button>`).join('')}</div></div>`;
    else if (E.ph === 'cmp') {
      const run = E.A.state !== 'idle' && !E.cmpDone;
      ct = `<div class="sv-row"><button class="sv-btn go" data-act="cmpgo"${run ? ' disabled' : ''}>${esc(run ? t.running : E.cmpDone ? t.again : t.go)}</button>${E.cmpDone ? `<button class="sv-btn" data-act="own">${esc(t.own)}</button>` : ''}</div>`;
    } else {
      const P = E.F, run = P.state !== 'idle' && P.state !== 'done';
      ct = `<div class="sv-lbl">${esc(t.herdSize)}</div>
        <input type="range" class="big sv-range" id="svN" min="1" max="30" step="1" value="${E.n}" style="--track:linear-gradient(90deg,#e9b44c,#c0612b)"${run ? ' disabled' : ''} aria-label="${esc(t.herdSize)}">
        <div class="ends"><span>1</span><b id="svNv">${esc(t.zeb(E.n))}</b><span>30</span></div>
        <div class="sv-row"><button class="sv-btn go" data-act="freego"${run ? ' disabled' : ''}>${esc(run ? t.running : P.state === 'done' ? t.again : t.go)}</button></div>`;
      if (E.order.length) ct += `<div class="sv-tally"><div><span class="sv-lbl" style="background:none;padding:0">${esc(t.tallyT)}</span></div>${E.order.map((n) => `<div><b>${esc(t.zeb(n))}</b>${E.tally[n].map((d) => `<span>${d} m</span>`).join('')}</div>`).join('')}</div>`;
    }
  } else if (v === 'rain') {
    if (R.ph === 'ask') ov = `<div class="card sv-rask"><div class="q">${esc(t.rQ)}</div>${['south', 'middle', 'north'].map((z, i) => `<button class="sv-btn" data-act="rg" data-z="${z}">${esc(t.rO[i])}</button>`).join('')}</div>`;
    else ct = `<div class="sv-row"><button class="sv-btn" data-act="prev" aria-label="−">${t.prev}</button><button class="sv-btn" data-act="next" aria-label="+">${t.next}</button><button class="sv-btn go" data-act="play">${esc(R.play ? t.stop : t.play)}</button></div>`;
  } else if (v === 'safe') {
    const done = SF.checked, n = SF.pick.filter((x) => x >= 0).length;
    ct = `<div class="sv-pairs">${t.animals.map((a, i) => {
      const ok = SF.pick[i] === ANS[i], small = done ? (ok ? `✓ ${t.ways[ANS[i]]}` : `✗ → ${t.ways[ANS[i]]}`) : (SF.pick[i] >= 0 ? t.ways[SF.pick[i]] : '—');
      return `<button class="sv-pair${!done && SF.sel === i ? ' sel' : ''}${done ? (ok ? ' good' : ' bad') : ''}" data-act="a" data-a="${i}"><i style="background:${ACOL[i]}"></i>${esc(a)}<small>${esc(small)}</small></button>`;
    }).join('')}</div>`;
    if (!done) ct += `<div class="sv-ways">${t.ways.map((w, j) => `<button class="sv-way" data-act="w" data-w="${j}"${SF.sel < 0 ? ' disabled' : ''}>${SF.pick.map((p, i) => (p === j ? `<i style="background:${ACOL[i]}"></i>` : '')).join('')}${esc(w)}</button>`).join('')}</div>`;
    ct += `<div class="sv-row">${done ? `<button class="sv-btn go" data-act="retry">${esc(t.retry)}</button>` : `<button class="sv-btn go" data-act="check"${n < 4 ? ' disabled' : ''}>${esc(t.check)}</button>`}</div>`;
  } else if (v === 'stripes') ct = `<div class="sv-row"><button class="sv-btn" data-act="streset">${esc(t.reset)}</button></div>`;
  else if (v === 'cheetah') ct = `<div class="sv-row"><button class="sv-btn go" data-act="chase"${CH.ph === 'run' ? ' disabled' : ''}>${esc(CH.ph === 'done' ? t.chaseAgain : t.chase)}</button></div>`;
  const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.secret === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  ct += `<div class="row2"><span class="lbl">${esc(t.unlocked)}</span>${chip('stripes', '🦓')}${chip('cheetah', '🐆')}</div>`;
  $('overlay').innerHTML = ov; $('ctrlBody').innerHTML = ct;
  paint();
}

// --- events ------------------------------------------------------------------------------------------------
function rainGuess(z) {
  if (R.ph !== 'ask') return;
  R.guess = z; R.ph = 'free'; R.month = 6; R.verdict = z === 'north'; R.moved = false; (R.verdict ? sfx.good : sfx.bad)(); render(); showStage();
}
function onAct(ev) {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'eg') { E.guess = +b.dataset.g; E.ph = 'cmp'; E.A = newPane(1); E.B = newPane(30); E.cmpDone = false; sfx.click(); render(); }
  else if (a === 'cmpgo') { E.cmpDone = false; startCmp(); }
  else if (a === 'own') { E.ph = 'free'; E.F = newPane(E.n); sfx.click(); render(); }
  else if (a === 'freego') startFree();
  else if (a === 'rg') rainGuess(b.dataset.z);
  else if (a === 'prev' || a === 'next') { R.month = (R.month + (a === 'next' ? 1 : 11)) % 12; R.moved = true; R.play = false; sfx.tick(); render(); }
  else if (a === 'play') { R.play = !R.play; R.pt = 0; sfx.click(); render(); }
  else if (a === 'a') { if (!SF.checked) { SF.sel = +b.dataset.a; sfx.tick(); render(); } }
  else if (a === 'w') {
    if (SF.checked || SF.sel < 0) return;
    const w = +b.dataset.w; SF.pick.forEach((p, i) => { if (p === w) SF.pick[i] = -1; }); SF.pick[SF.sel] = w; sfx.snap();
    let nx = SF.sel; for (let k = 1; k <= 4; k++) { const j = (SF.sel + k) % 4; if (SF.pick[j] < 0) { nx = j; break; } } SF.sel = nx; render();
  } else if (a === 'check') { if (SF.pick.every((p) => p >= 0)) { SF.checked = true; SF.t0 = performance.now(); (SF.pick.every((p, i) => p === ANS[i]) ? sfx.good : sfx.bad)(); render(); showStage(); } }
  else if (a === 'retry') { SF.pick = [-1, -1, -1, -1]; SF.sel = 0; SF.checked = false; sfx.click(); render(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.secret = S.secret === k ? null : k; R.play = false; sfx.click();
    if (S.secret === 'stripes') initStripes(); if (S.secret === 'cheetah') Object.assign(CH, { ph: 'idle', gap: 0.32, vc: 0, sp: 1, lane: 0, laneT: 0, cl: 0, gx: 0.64, scroll: 0, result: null, peak: 0 });
    render(); if (S.secret) showStage();
  } else if (a === 'streset') { initStripes(); sfx.click(); }
  else if (a === 'chase') startChase();
}
$('ctrlBody').addEventListener('click', onAct); $('overlay').addEventListener('click', onAct);
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'svN') return;
  E.n = +ev.target.value; E.F = newPane(E.n); $('svNv').textContent = T[lang].zeb(E.n); paint();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.secret) return;
  const r = $('cv').getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  if (lab.view === 'rain' && R.lay) {
    const L = R.lay;
    if (R.ph === 'ask') { if (px >= L.mx && px <= L.mx + L.mw && py >= L.my && py <= L.my + L.mh) { const f = (py - L.my) / L.mh; rainGuess(f < 0.34 ? 'north' : f < 0.67 ? 'middle' : 'south'); } }
    else {
      const dx = px - L.dx, dy = py - L.dcy, d = Math.hypot(dx, dy);
      if (d >= L.dr * 0.7 && d <= L.dr * 1.3) { R.month = Math.floor((((Math.atan2(dx, -dy) + TAU) % TAU) / TAU) * 12) % 12; R.moved = true; R.play = false; sfx.tick(); render(); }
    }
  } else if (lab.view === 'safe' && !SF.checked) {
    const k = SF.lay.findIndex((p) => px >= p.x && px <= p.x + p.w && py >= p.y && py <= p.y + p.h);
    if (k >= 0) { SF.sel = k; sfx.tick(); render(); }
  }
});

// --- the picture -------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, t) => {
  c.save();
  if (S.secret === 'stripes') drawStripes(c, w, h, dt, t);
  else if (S.secret === 'cheetah') { drawCheetah(c, w, h, dt, t); chRead(); }
  else if (lab.view === 'eyes') drawEyes(c, w, h, dt, t);
  else if (lab.view === 'rain') drawRain(c, w, h, dt, t);
  else drawSafe(c, w, h, dt, t);
  c.restore();
});
E.F = newPane(E.n); initStripes();
render();
</script>
</body>
</html>
