  else { c.strokeStyle = 'rgba(190,230,255,.8)'; c.lineWidth = 2; c.beginPath(); c.arc(fxEye, fyEye, 21, -2.2, -0.9); c.stroke(); }
  const T_ = T[lang].g; pill(c, E, `${T_.ground[gk]}: ${T_.pct[gk]}`, fx, 372);
}

// --- views: canvas ----------------------------------------------------------------------------------------------------------------------------------
function outdoors(c, E, k, t, w, mood, ramp, x = 180) {
  const hy = 250;
  drawWeather(c, E, k, t, 'back', hy);
  drawChild(c, { x, y: 340, s: w.umb ? 1.04 : 1.18, w, mood: ramp > 0.04 ? mood : 'neutral', wet: mood === 'wet' ? ramp : 0, t, bob: true, ramp });
  drawWeather(c, E, k, t, 'front', hy);
}
function drawOut(c, E, dt, time) {
  if (S.sec === 'glare') { drawGlare(c, E, time); return; }
  const r = ROUNDS[Math.min(S.round, 3)];
  if (S.phase !== 'dress') { S.anim += dt; if (S.phase === 'go' && S.anim > 2.9) { S.phase = 'result'; render(); } }
  const a = S.phase === 'dress' ? 0 : S.anim, fo = ease((a - 1.0) / 0.5), walk = ease(a / 1.2);
  if (fo < 1) {
    drawHall(c, E, time, r.k, S.w);
    drawChild(c, { x: lerp(172, 292, walk), y: 342, s: lerp(1.05, 0.88, walk), w: S.w, mood: S.round >= 4 ? 'happy' : 'neutral', t: time, bob: a > 0 && a < 1.25 });
  }
  if (fo > 0) { c.globalAlpha = fo; outdoors(c, E, r.k, time, S.w, moodOf(S.code || 'ok'), clamp((a - 1.4) / 1.2, 0, 1)); c.globalAlpha = 1; }
}
function drawLayers(c, E, dt, time) {
  const hy = 262, L = S.on;
  if (S.step === 3) {
    drawShop(c, E, time); const ls = layersOn(L), sum = ls.reduce((n, k) => n + rOf(k, false), 0), hotNow = sum > 3;
    drawChild(c, { x: 180, y: 338, s: 1.12, w: { tee: L.tee, jump: L.jump, thin: L.thin, coat: L.coat }, mood: hotNow ? 'hot' : 'happy', t: time, ramp: 1 });
    return;
  }
  if (S.step === 0) {
    drawWeather(c, E, 'frost', time, 'back', hy);
    drawChild(c, { x: 98, y: 338, s: 0.95, w: { tee: 1, thin: 1 }, t: time });
    drawChild(c, { x: 262, y: 338, s: 0.95, w: { tee: 1, jump: 1, coat: 1 }, t: time });
    for (const [x, l] of [[98, 'A'], [262, 'B']]) pill(c, E, l, x, 372, { size: 16 });
    return;
  }
  heatBg(c, E);
  c.font = fnt(800, 12); c.textAlign = 'center';
  if (S.step === 1) {
    for (const [x, ls, l] of [[98, ['tee', 'thin'], 'A'], [262, ['tee', 'jump', 'coat'], 'B']]) {
      heatFigure(c, x, 338, 0.95, ls, false, time);
      pill(c, E, `${l} · ${Math.round(keptOf(ls, false) * 100)}%`, x, 372, { size: 14, bg: l === 'B' ? 'rgba(46,160,90,.9)' : 'rgba(14,18,34,.84)' });
    }
  } else {
    const ls = layersOn(L); heatFigure(c, 180, 338, 1.2, ls, S.wet, time);
    pill(c, E, `${Math.round(keptOf(ls, S.wet) * 100)}%`, 180, 372, { size: 14 });
  }
  // legend: cold to warm
  const lw = 150, lx = 180 - lw / 2, g = c.createLinearGradient(lx, 0, lx + lw, 0); HS.forEach(([p, col]) => g.addColorStop(p, col));
  c.fillStyle = g; c.beginPath(); c.roundRect(lx, 30, lw, 9, 4.5); c.fill();
  pill(c, E, T[lang].l.cold, lx - 20, 34, { size: 12 }); pill(c, E, T[lang].l.warm, lx + lw + 24, 34, { size: 12 });
  pill(c, E, T[lang].l.ill, 180, 14, { size: 12, bg: 'rgba(0,0,0,.4)', col: '#d6dcf5' });
}
function ribbon(c, E, active, rv) {
  const t = T[lang].d, ico = ['🌫️', '🌞', '🌧️'];
  for (let i = 0; i < 3; i++) {
    const x = 6 + i * 116, y = 8, w = 112, h = 46, on = i === active;
    c.fillStyle = 'rgba(14,18,34,.86)'; c.beginPath(); c.roundRect(x, y, w, h, 12); c.fill();
    if (on) { c.strokeStyle = '#ffe08a'; c.lineWidth = 2; c.stroke(); }
    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.font = fnt(900, 12); c.fillStyle = '#fff'; c.fillText(t.names[i], x + 8, y + 14);
    c.save(); c.globalAlpha = 1; c.fillStyle = '#fff'; c.font = `${Math.max(16, 12.5 / SC * 1.2)}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`; c.fillText(ico[i], x + 8, y + 32); c.restore();
    c.font = fnt(700, 12); c.fillStyle = '#c9d0ee'; c.fillText(tmp(SEGT[i]), x + 8 + Math.max(16, 12.5 / SC * 1.2) * 1.3, y + 32);
    if (i < rv) {
      const ok = S.dj.res[i] === 'ok', cx = x + w - 14, cy = y + 32; c.fillStyle = ok ? '#2ea05a' : '#e0644b'; c.beginPath(); c.arc(cx, cy, 8, 0, 6.3); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = 2; c.lineCap = 'round'; c.beginPath();
      if (ok) { c.moveTo(cx - 4, cy); c.lineTo(cx - 1, cy + 3); c.lineTo(cx + 4, cy - 3); } else { c.moveTo(cx - 3.5, cy - 3.5); c.lineTo(cx + 3.5, cy + 3.5); c.moveTo(cx + 3.5, cy - 3.5); c.lineTo(cx - 3.5, cy + 3.5); }
      c.stroke();
    }
  }
}
function drawDay(c, E, dt, time) {
  const t = time;
  if (S.dphase === 'plan') {
    drawHall(c, E, t, 'fog', {});
    drawChild(c, { x: 172, y: 342, s: 1.05, w: dayOutfit(0, S.dw, S.pack, []), t, pack: true });
    const slots = ITEMS.concat([]).filter((k) => S.pack[k]);
    for (let i = 0; i < 3; i++) {
      const x = 126 + i * 40, y = 354;
      c.fillStyle = 'rgba(14,18,34,.55)'; c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(x, y, 34, 34, 9); c.fill(); c.stroke();
      if (slots[i]) { c.save(); c.globalAlpha = 1; c.fillStyle = '#fff'; c.font = `${20}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(EMO[slots[i]], x + 17, y + 18); c.restore(); }
    }
    ribbon(c, E, -1, 0);
    return;
  }
  if (S.dphase === 'play') {
    S.danim += dt;
    const rv = Math.min(3, Math.floor((S.danim - 2.3) / SEG) + 1);
    if (rv !== S.drev) { S.drev = Math.max(0, rv); render(); }
    if (S.danim >= 3 * SEG) { S.dphase = 'done'; S.drev = 3; render(); }
  }
  const seg = S.dphase === 'done' ? 2 : Math.min(2, Math.floor(S.danim / SEG)), lt = S.dphase === 'done' ? 99 : S.danim - seg * SEG;
  const mood = S.dphase === 'done' || lt > 1 ? moodOf(S.dj.res[seg] === 'ok' ? 'ok' : S.dj.res[seg] === 'cold' ? 'cold' : S.dj.res[seg] === 'hot' ? 'hot' : S.dj.res[seg] === 'sun' ? 'burn' : 'wet') : 'neutral';
  outdoorsDay(c, E, DAYW[seg], t, dayOutfit(seg, S.dw, S.pack, S.dj.removed), mood, clamp((lt - 1.0) / 1.2, 0, 1));
  if (lt < 0.5) { c.fillStyle = `rgba(10,14,30,${(1 - ease(lt / 0.5)) * 0.85})`; c.fillRect(E.x0, E.y0, E.x1 - E.x0, E.y1 - E.y0); }
  ribbon(c, E, seg, S.drev);
}
function outdoorsDay(c, E, k, t, w, mood, ramp) {
  drawWeather(c, E, k, t, 'back', 262);
  drawChild(c, { x: 180, y: 346, s: w.umb ? 0.98 : 1.1, w, mood: ramp > 0.04 ? mood : 'neutral', wet: mood === 'wet' ? ramp : 0, t, bob: true, ramp, pack: true });
  drawWeather(c, E, k, t, 'front', 262);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  SC = Math.min(w / 360, h / 400);
  const ox = (w - 360 * SC) / 2, oy = (h - 400 * SC) / 2, E = { x0: -ox / SC, y0: -oy / SC, x1: (w - ox) / SC, y1: (h - oy) / SC };
  c.save(); c.translate(ox, oy); c.scale(SC, SC);
  c.textBaseline = 'middle';
  const v = lab.view;
  if (v === 'out') drawOut(c, E, dt, time); else if (v === 'layers') drawLayers(c, E, dt, time); else drawDay(c, E, dt, time);
  c.restore();
});

// --- controls -----------------------------------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const chip = (act, k, label, on, dis, extra = '') => `<button type="button" class="chip dw-chip${on ? ' on' : ''}${extra}" data-act="${act}" data-k="${k}"${dis ? ' disabled' : ''}>${label}</button>`;
const itemChip = (k, on, dis) => chip('item', k, `${EMO[k]} ${esc(T[lang].it[k])}`, on, dis);
function resetOut() { S.w = {}; S.phase = 'dress'; S.anim = 0; S.code = null; }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = b.dataset.k;
  if (act === 'item') { S.w[k] = !S.w[k]; sfx.tick(); }
  else if (act === 'clear') { S.w = {}; sfx.click(); }
  else if (act === 'go') {
    S.code = judge(S.round, S.w); S.right[S.round] = S.code === 'ok'; S.phase = 'go'; S.anim = 0; sfx.click(); showStage();
    setTimeout(() => { if (lab.view === 'out' && S.phase !== 'dress') (S.code === 'ok' ? sfx.good : sfx.bad)(); }, 2400);
  }
  else if (act === 'next') { S.round++; resetOut(); sfx.click(); }
  else if (act === 'again') { S.round = 0; S.right = []; resetOut(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === 'glare' ? null : 'glare'; S.gnd = 'snow'; S.gl = false; sfx.click();
  }
  else if (act === 'gnd') { S.gnd = k; sfx.tick(); }
  else if (act === 'gl') { S.gl = !S.gl; sfx.click(); }
  else if (act === 'pick') { S.guess = k; S.step = 1; (k === 'B' ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'try') { S.step = 2; sfx.click(); }
  else if (act === 'lay') { S.on[k] = !S.on[k]; sfx.tick(); }
  else if (act === 'wetsec') { if (!secret.unlocked()) return secret.open(); S.wet = !S.wet; sfx.click(); }
  else if (act === 'shop') { S.step = 3; S.on = { tee: true, thin: false, jump: true, coat: true }; S.wet = false; sfx.click(); showStage(); }
  else if (act === 'back') { S.step = 2; S.on = { tee: true, thin: false, jump: false, coat: false }; sfx.click(); }
  else if (act === 'again2') { S.step = 0; S.guess = null; S.wet = false; S.on = { tee: true, thin: false, jump: false, coat: false }; sfx.click(); }
  else if (act === 'dw') { S.dw[k] = !S.dw[k]; sfx.tick(); }
  else if (act === 'pk') {
    if (S.pack[k]) S.pack[k] = false;
    else if (Object.values(S.pack).filter(Boolean).length >= 3) { sfx.bad(); return; }
    else S.pack[k] = true;
    sfx.tick();
  }
  else if (act === 'play') { S.dj = dayJudge(S.dw, S.pack); S.dphase = 'play'; S.danim = 0; S.drev = 0; sfx.click(); showStage(); }
  else if (act === 'again3') { S.dphase = 'plan'; S.danim = 0; S.drev = 0; sfx.click(); }
  render();
});

// --- one render per change ----------------------------------------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('secOut').hidden = v !== 'out'; $('secLayers').hidden = v !== 'layers'; $('secDay').hidden = v !== 'day';
  $('gauge').style.visibility = 'hidden';
  const sc = (k, emo, on, act) => `<button type="button" class="chip dw-chip secret ${secret.unlocked() ? 'open' : ''} ${on ? 'on' : ''}" data-act="${act}">${secret.unlocked() ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  if (v === 'out') renderOut(t, sc); else if (v === 'layers') renderLayers(t, sc); else renderDay(t);
}
function renderOut(t, sc) {
  const o = t.o, box = $('secOut');
  if (S.sec === 'glare') {
    const g = t.g, gk = S.gnd, frac = { sand: 15, foam: 25, snow: 80 }[gk];
    lab.setGlow('rgba(255, 210, 90, .26)');
    box.innerHTML = `<div class="dw-grid">${['snow', 'sand', 'foam'].map((k) => chip('gnd', k, esc(g.ground[k]), gk === k, false)).join('')}${chip('gl', 'x', g.glasses, S.gl, false)}</div>
      <div class="dw-act">${chip('sec', 'x', esc(g.back), false, false)}</div>`;
    lab.setReadout(`${gk === 'snow' ? '≤ ' : '≈ '}${frac}%`, g.val, '', '#ffd25a');
    lab.setState({ emo: '🕶️', title: g.title, lead: g.lead(g.ground[gk], g.pct[gk]), body: S.gl ? g.on : g.off, extra: '' });
    lab.setFacts(facts('snow')); return;
  }
  const end = S.round >= 4, r = ROUNDS[Math.min(S.round, 3)], ph = S.phase, k = S.right.filter(Boolean).length;
  lab.setGlow('rgba(230, 150, 90, .25)');
  const dis = ph !== 'dress' || end;
  const main = end ? `<button type="button" class="btn push" data-act="again">${esc(o.again)}</button>`
    : ph === 'dress' ? `<button type="button" class="btn push" data-act="go">${esc(o.go)}</button>`
    : `<button type="button" class="btn push" data-act="next"${ph === 'go' ? ' disabled' : ''}>${esc(S.round === 3 ? o.finish : o.next)}</button>`;
  box.innerHTML = `<div class="dw-grid">${ITEMS.map((x) => itemChip(x, !!S.w[x], dis)).join('')}</div>
    <div class="dw-act">${chip('clear', 'x', esc(o.clear), false, dis)}${sc('a', '🕶️', false, 'sec')}${main}</div>`;
  if (end) { lab.setReadout(`${k}/4`, '', '', '#e6965a'); lab.setState({ emo: '🏆', title: o.end(k), lead: o.endLead, body: '', extra: '' }); lab.setFacts(facts('snow')); return; }
  const name = t.rd[S.round];
  if (ph === 'dress') { lab.setReadout(tmp(r.temp), o.round(S.round + 1), '', '#e6965a'); lab.setState({ emo: r.emo, title: `${name} · ${tmp(r.temp)}`, lead: o.lead(S.round + 1), body: '', extra: '' }); lab.setFacts([]); return; }
  if (ph === 'go') { lab.setReadout(tmp(r.temp), o.round(S.round + 1), '', '#e6965a'); lab.setState({ emo: '🚶', title: o.walking, lead: o.walkLead, body: '', extra: '' }); lab.setFacts([]); return; }
  const ok = S.code === 'ok';
  lab.setReadout(tmp(r.temp), o.round(S.round + 1), ok ? '✅ ' + o.right : '🤔', ok ? '#2ea05a' : '#e0644b');
  lab.setState(ok ? { emo: '😊', title: o.right, lead: o.ok[S.round], body: '', extra: '' }
    : { emo: { wet: '🌧️', cold: '🥶', hot: '🥵', burn: '☀️', glare: '😎' }[badKey(S.code)], title: o.rt[badKey(S.code)], lead: o.res[S.code], body: '', extra: '' });
  lab.setFacts(S.round === 3 ? facts('snow') : []);
}
function renderLayers(t, sc) {
  const l = t.l, box = $('secLayers'); lab.setGlow('rgba(255, 150, 60, .25)');
  const gauge = (f, show) => { $('gauge').style.visibility = show ? 'visible' : 'hidden'; lab.setGauge(f, [{ f: 0, label: '0%' }, { f: 0.5, label: '50%' }, { f: 1, label: '100%' }], l.keptCap); };
  if (S.step === 0) {
    box.innerHTML = `<div class="dw-opts"><button type="button" class="dw-opt" data-act="pick" data-k="A"><b>A</b>${esc(l.optA)}</button><button type="button" class="dw-opt" data-act="pick" data-k="B"><b>B</b>${esc(l.optB)}</button></div>`;
    lab.setReadout('?', '', '', '#ff9a3c'); gauge(0, false);
    lab.setState({ emo: '🤔', title: l.ask, lead: l.ask2, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const ls = layersOn(S.on), kept = keptOf(ls, S.wet);
  if (S.step === 1) {
    box.innerHTML = `<div class="dw-act" style="margin-top:0"><button type="button" class="btn push" data-act="try">${esc(l.try)}</button></div>`;
    lab.setReadout(`A ${Math.round(keptOf(['tee', 'thin'], false) * 100)}% · B ${Math.round(keptOf(['tee', 'jump', 'coat'], false) * 100)}%`, l.kept, S.guess === 'B' ? '✅' : '🤔', '#ff9a3c'); gauge(0.75, true);
    lab.setState({ emo: S.guess === 'B' ? '😊' : '🤔', title: S.guess === 'B' ? l.yes : l.no, lead: l.yesLead, body: '', extra: '' });
    lab.setFacts(facts('air')); return;
  }
  if (S.step === 2) {
    box.innerHTML = `<div class="dw-grid">${LAYR.map(([k]) => chip('lay', k, `${EMO[k]} ${esc(t.it[k])}`, !!S.on[k], false)).join('')}${sc('b', '💧', S.wet, 'wetsec')}</div>
      <div class="dw-act"><button type="button" class="btn push" data-act="shop">${esc(l.shop)}</button></div>`;
    lab.setReadout(`${Math.round(kept * 100)}%`, l.kept, '', '#ff9a3c'); gauge(kept, true);
    lab.setState(S.wet ? { emo: '💧', title: l.wetTitle, lead: l.wetLead, body: '', extra: '' }
      : { emo: '🧅', title: l.exTitle(ls.length), lead: ls.length ? l.exLead : l.exNone, body: '', extra: '' });
    lab.setFacts(S.wet ? facts('wet', 'air', 'three') : facts('air', 'three')); return;
  }
  const sum = ls.reduce((n, k) => n + rOf(k, false), 0), hot = sum > 3;
  box.innerHTML = `<div class="dw-grid">${LAYR.map(([k]) => chip('lay', k, `${EMO[k]} ${esc(t.it[k])}`, !!S.on[k], false)).join('')}</div>
    <div class="dw-act">${chip('back', 'x', esc(l.back), false, false)}<button type="button" class="btn push" data-act="again2">${esc(l.again)}</button></div>`;
  lab.setReadout(String(ls.length), l.shopVal(ls.length), hot ? '🥵' : '😊', hot ? '#e0644b' : '#2ea05a'); gauge(0, false);
  lab.setState(hot ? { emo: '🥵', title: l.shopHot, lead: l.shopHotLead, body: '', extra: '' } : { emo: '😊', title: l.shopOk, lead: l.shopOkLead, body: '', extra: '' });
  lab.setFacts(facts('air', 'three'));
}
function renderDay(t) {
  const d = t.d, box = $('secDay'), used = Object.values(S.pack).filter(Boolean).length, plan = S.dphase === 'plan';
  lab.setGlow('rgba(120, 180, 240, .25)');
  const packItems = ['umb', 'rainc', 'sun', 'hat', 'cream', 'sand', 'shorts'];
  box.innerHTML = `<div class="dw-lbl">${esc(d.wear)}</div><div class="dw-grid">${['tee', 'jump', 'coat'].map((k) => chip('dw', k, `${EMO[k]} ${esc(t.it[k])}`, !!S.dw[k], !plan)).join('')}</div>
    <div class="dw-lbl">${esc(d.pack)} · ${esc(d.count(used))}</div><div class="dw-grid">${packItems.map((k) => chip('pk', k, `${EMO[k]} ${esc(t.it[k])}`, !!S.pack[k], !plan)).join('')}</div>
    <div class="dw-act">${plan ? `<button type="button" class="btn push" data-act="play">${esc(d.play)}</button>` : `<button type="button" class="btn push" data-act="again3"${S.dphase === 'done' ? '' : ' disabled'}>${esc(d.again)}</button>`}</div>`;
  if (plan) { lab.setReadout(`${used}/3`, d.val, '', '#78b4f0'); lab.setState({ emo: '🎒', title: d.plan, lead: d.planLead, body: d.planBody, extra: `<div class="dw-note">${[0, 1, 2].map((i) => `${esc(d.names[i])}: ${esc(d.fc[i])}, ${tmp(SEGT[i])}`).join(' · ')}</div>` }); lab.setFacts([]); return; }
  const rv = S.drev, seg = rv === 0 ? 0 : Math.min(2, rv - 1), done = S.dphase === 'done', j = S.dj;
  const good = j.res.filter((x) => x === 'ok').length;
  if (done) {
    lab.setReadout(`${good}/3`, '', good === 3 ? '✅' : '🤔', good === 3 ? '#2ea05a' : '#e0644b');
    lab.setState({ emo: good === 3 ? '🏆' : '🤔', title: d.end(good), lead: good === 3 ? d.endOk : d.endTry, body: [0, 1, 2].map((i) => `${d.names[i]}: ${d.rt[j.res[i]]}`).join(' · '), extra: '' });
    lab.setFacts(facts('clouds', 'shed')); return;
  }
  lab.setReadout(`${rv}/3`, d.playing, '', '#78b4f0');
  if (rv === 0) { lab.setState({ emo: '🚶', title: d.playing, lead: d.playLead, body: '', extra: '' }); lab.setFacts([]); return; }
  const code = j.res[seg], line = seg === 1 && code === 'ok' && j.removed.length ? d.res[1].okTook(j.removed[0]) : d.res[seg][code];
  lab.setState({ emo: code === 'ok' ? '😊' : '🤔', title: `${d.names[seg]}: ${d.rt[code]}`, lead: line, body: '', extra: '' }); lab.setFacts([]);
}
render();
</script>
