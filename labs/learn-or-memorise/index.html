// --- the world: alien fruits (made up) -------------------------------------------------------------------
// a fruit: spots 0-5, colour 0 pink / 1 yellow / 2 blue, shape 0 round / 1 long. True rule: sweet if spots >= 3.
const mk = ([sp, co, sh]) => ({ sp, co, sh });
const isSweet = (fr) => fr.sp >= 3;
const tk = (fr) => `${fr.sp}${fr.co}${fr.sh}`;
const DECK_A = [[3, 1, 0], [0, 0, 0], [4, 2, 1], [2, 2, 0], [5, 0, 0], [1, 1, 1], [3, 2, 1], [2, 0, 1]].map(mk); // 8 practice cards
const DECK_B = [[3, 0, 1], [0, 1, 1], [4, 1, 0], [1, 2, 0], [5, 2, 1], [2, 1, 0], [4, 0, 1], [1, 0, 1], [3, 2, 0], [2, 1, 1], [5, 1, 1], [0, 2, 0]].map(mk); // 12 new cards, no exact repeat of A
const ALL = []; for (let sp = 0; sp < 6; sp++) for (let co = 0; co < 3; co++) for (let sh = 0; sh < 2; sh++) ALL.push({ sp, co, sh });

// Rulo: tries every simple rule and keeps the one with the most right answers on the practice cards.
// Order = preference on ties: "spots >= k" (small k first), then "spots = v", then colour, then shape.
const KEY = { spots: 'sp', colour: 'co', shape: 'sh' };
const VALS = { colour: ['pink', 'yellow', 'blue'], shape: ['round', 'long'] };
const RULES = [];
for (let k = 1; k <= 5; k++) RULES.push({ f: 'spots', ge: k });
for (let v = 0; v <= 5; v++) RULES.push({ f: 'spots', eq: v });
for (let v = 0; v < 3; v++) RULES.push({ f: 'colour', eq: v });
for (let v = 0; v < 2; v++) RULES.push({ f: 'shape', eq: v });
const holds = (r, fr) => (r.ge !== undefined ? fr.sp >= r.ge : fr[KEY[r.f]] === r.eq);
const learn = (deck) => {
  let best = RULES[0], bs = -1;
  for (const r of RULES) { const s = deck.reduce((n, fr) => n + (holds(r, fr) === isSweet(fr) ? 1 : 0), 0); if (s > bs) { bs = s; best = r; } }
  return best;
};
const isTrueRule = (r) => r.f === 'spots' && r.ge === 3;

  rr(c, 306, 54, 52, 34, 17); c.fill(); c.stroke();
  txt(c, knows ? '5' : '?', 332, 72, { size: 22, color: '#241a4a', weight: 900 });
  // the tap counter, and whether it is right
  const done = hits >= target, col = !done ? PAL.violet : knows ? PAL.ok : PAL.no;
  rr(c, 56, 62, 78, 40, 20); c.fillStyle = 'rgba(8,12,30,.82)'; c.fill(); c.lineWidth = 2.4; c.strokeStyle = col; c.stroke();
  txt(c, String(hits), 84, 83, { size: 22, color: '#fff', weight: 900 });
  if (done) mark(c, knows, 114, 82, 11, easeBack((tt - (0.9 + target * 0.6)) / 0.3));
  if (tapping && f >= 0.8) { c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 2; const hx0 = 169; for (const d of [-1, 1]) { c.beginPath(); c.moveTo(hx0 + d * 12, 296); c.lineTo(hx0 + d * 20, 290); c.stroke(); } }
  return k;
}
// secret B: a wiggly line through every old dot, a smooth line, and the new dots
const OLD_N = [0.7, -0.8, 0.6, -0.75, 0.8, -0.6, 0.7, -0.8], NEW_X = [1.5, 2.5, 4.5, 5.5], NEW_N = [0.15, -0.2, 0.1, -0.15];
const trueLine = (x) => 2.6 + 0.5 * x, OLD_Y = OLD_N.map((n, i) => trueLine(i) + n);
const LS = (() => { const n = 8, sx = 28, sy = OLD_Y.reduce((a, b) => a + b, 0), sxx = 140, sxy = OLD_Y.reduce((a, y, i) => a + i * y, 0), m = (n * sxy - sx * sy) / (n * sxx - sx * sx); return { m, b: (sy - m * sx) / n }; })();
const smoothY = (x) => LS.b + LS.m * x;
const smoothstep = (u) => u * u * (3 - 2 * u);
function wiggleY(x) {
  const i = Math.min(6, Math.max(0, Math.floor(x))), u = x - i;
  return OLD_Y[i] + (OLD_Y[i + 1] - OLD_Y[i]) * smoothstep(u) + (i % 2 ? -1 : 1) * 1.7 * Math.sin(Math.PI * u);
}
function sceneWiggle(c, time) {
  const t = T[lang], tt = time - S.sT, PX0 = 30, PX1 = 386, PY0 = 22, PY1 = 330;
  const X = (x) => PX0 + (x + 0.6) / 8.2 * (PX1 - PX0), Y = (y) => PY1 - (y + 0.2) / 9 * (PY1 - PY0);
  c.fillStyle = 'rgba(255,255,255,.04)'; rr(c, 6, 8, W - 12, 340, 16); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(PX0, PY0); c.lineTo(PX0, PY1); c.lineTo(PX1, PY1); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 1; for (let g = 1; g < 5; g++) { c.beginPath(); c.moveTo(PX0, PY1 - g * (PY1 - PY0) / 5); c.lineTo(PX1, PY1 - g * (PY1 - PY0) / 5); c.stroke(); }
  // legend
  for (const [i, k, s] of [[0, PAL.violet, t.rulo], [1, PAL.teal, t.memo]]) { const y = 44 + i * 24; c.strokeStyle = k; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(44, y); c.lineTo(66, y); c.stroke(); txt(c, s, 74, y, { align: 'left', size: 13, pill: true, color: '#fff' }); }
  const curve = (fn, x0, x1, col, p) => {
    c.beginPath(); const steps = 120, last = Math.floor(steps * clamp01(p));
    for (let i = 0; i <= last; i++) { const x = lerp(x0, x1, i / steps); c[i ? 'lineTo' : 'moveTo'](X(x), Y(fn(x))); }
    c.strokeStyle = col; c.lineWidth = 3.4; c.lineJoin = 'round'; c.shadowColor = col; c.shadowBlur = 8; c.stroke(); c.shadowBlur = 0;
  };
  curve(wiggleY, 0, 7, PAL.teal, (tt - 1.9) / 1.4);
  curve(smoothY, -0.4, 7.4, PAL.violet, (tt - 3.5) / 1.1);
  OLD_Y.forEach((y, i) => {
    const p = easeBack((tt - i * 0.18) / 0.3); if (p <= 0) return;
    c.save(); c.translate(X(i), Y(y)); c.scale(p, p); c.fillStyle = '#f2f4ff'; c.beginPath(); c.arc(0, 0, 6, 0, Math.PI * 2); c.fill(); c.lineWidth = 2; c.strokeStyle = '#10183a'; c.stroke(); c.restore();
  });
  NEW_X.forEach((x, j) => {
    const t0 = 5.0 + j * 0.55, p = easeBack((tt - t0) / 0.35); if (p <= 0) return;
    const y = trueLine(x) + NEW_N[j], bp = clamp01((tt - t0 - 0.35) / 0.4);
    if (bp > 0) {
      c.lineWidth = 2.4; c.setLineDash([3, 3]);
      c.strokeStyle = PAL.no; c.beginPath(); c.moveTo(X(x), Y(y)); c.lineTo(X(x), lerp(Y(y), Y(wiggleY(x)), bp)); c.stroke();
      c.strokeStyle = PAL.ok; c.lineWidth = 3; c.beginPath(); c.moveTo(X(x) + 3, Y(y)); c.lineTo(X(x) + 3, lerp(Y(y), Y(smoothY(x)), bp)); c.stroke(); c.setLineDash([]);
    }
    c.save(); c.translate(X(x), Y(y)); c.scale(p, p);
    c.fillStyle = PAL.gold; c.beginPath(); c.arc(0, 0, 7.5, 0, Math.PI * 2); c.fill(); c.lineWidth = 2.4; c.strokeStyle = '#10183a'; c.stroke();
    c.fillStyle = '#10183a'; c.beginPath(); c.arc(0, 0, 2.2, 0, Math.PI * 2); c.fill(); c.restore();
  });
}

// --- the picture --------------------------------------------------------------------------------------------
function tick(time) {
  if (!S.pracDone && time - S.p0 >= END_A) { S.pracDone = true; render(); }
  if (S.g.test !== null && !S.newDone && time - S.n0 >= END_B) { S.newDone = true; S.signShown = true; S.signAt = time; render(); }
  if (S.sweeping) {
    const u = clamp01((time - S.sw0) / SWEEP), n = 2 + 28 * easeInOut(u), ni = Math.round(n);
    S.nf = n;
    if (ni !== S.n) { S.n = ni; if (lab.view === 'more' && !S.sec) syncMore(); }
    if (u >= 1) { S.sweeping = false; S.n = 30; S.nf = 30; render(); }
  }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  SC = Math.min(w / W, h / H);
  c.fillStyle = lin(c, 0, 0, 0, h, [[0, '#1c2541'], [1, '#0b132b']]); c.fillRect(0, 0, w, h);
  c.fillStyle = lin(c, 0, h * 0.55, 0, h, [[0, 'rgba(46,196,182,0)'], [1, 'rgba(46,196,182,.07)']]); c.fillRect(0, h * 0.55, w, h * 0.45);
  tick(time);
  c.save(); c.translate((w - W * SC) / 2, (h - H * SC) / 2); c.scale(SC, SC); c.lineJoin = 'round'; c.lineCap = 'round';
  if (S.sec === 'hans') sceneHans(c, time);
  else if (S.sec === 'wiggle') sceneWiggle(c, time);
  else if (lab.view === 'test') scene1(c, time);
  else if (lab.view === 'more') scene2(c, time);
  else scene3(c, time);
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'pick') {
    if (S.g[v] !== null) return;
    const i = +b.dataset.i; S.g[v] = i; (i === PRED[v].ok ? sfx.good : sfx.bad)();
    if (v === 'test') { S.n0 = nowS(); S.newDone = false; }
    else if (v === 'more') { S.sw0 = nowS(); S.sweeping = true; S.n = 2; S.nf = 2; }
    else { S.cheatNew = true; S.c0 = nowS(); }
    render(); showStage();
  } else if (act === 'replay') { S.n0 = nowS(); S.newDone = false; sfx.click(); render(); showStage(); }
  else if (act === 'tog') { S.cheatNew = !S.cheatNew; S.c0 = nowS(); sfx.click(); render(); }
  else if (act === 'hp') { S.hp = b.dataset.p; S.sT = nowS(); sfx.click(); render(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.sT = nowS(); sfx.click(); render(); if (S.sec) showStage();
  }
});
$('lmSl').addEventListener('input', () => { if (S.g.more === null || S.sweeping) return; S.n = +$('lmSl').value; S.nf = S.n; sfx.tick(); syncMore(); });

// --- one render per change: controls, readout and the state card ---------------------------------------------
const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
function predHTML(t, v, wait) {
  const p = PRED[v], g = S.g[v], opts = t[p.opts];
  return `<div class="lm-q">${esc(t[p.ask])}</div><div class="lm-opts">${opts.map((o, i) =>
    `<button class="lm-opt ${g === null ? (wait ? 'lm-wait' : '') : i === p.ok ? 'lm-ok' : i === g ? 'lm-bad' : 'lm-dim'}" data-act="pick" data-i="${i}"${g !== null || wait ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>${g === null ? ''
    : `<div class="lm-verdict ${g === p.ok ? 'ok' : 'no'}">${esc(g === p.ok ? t[p.right] : t[p.wrong])}</div>`}`;
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  document.body.dataset.v = sec ? 'sec' : v;
  show('lmPred', !sec); show('lmTestCtl', !sec && v === 'test' && S.newDone); show('lmMoreCtl', !sec && v === 'more'); show('lmCheatCtl', !sec && v === 'cheat'); show('lmHans', sec === 'hans');
  const sc = (k, emo, key) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('lmSecChips').innerHTML = sc('hans', '🐴', 'a') + sc('wiggle', '〰️', 'b');
  if (sec) { renderSecret(t, sec); return; }
  if (v === 'test') renderTest(t); else if (v === 'more') renderMore(t); else renderCheat(t);
}
function renderSecret(t, sec) {
  const hans = sec === 'hans';
  $('lmHansChips').innerHTML = [['knows', '🙋', t.hansKnows], ['not', '🤷', t.hansNot]].map(([k, e, s]) => `<button class="chip ${S.hp === k ? 'on' : ''}" data-act="hp" data-p="${k}">${e} ${esc(s)}</button>`).join('');
  lab.setGlow(hans ? 'rgba(255, 214, 112, .2)' : 'rgba(155, 93, 229, .26)');
  lab.setReadout(esc(t.secrets[hans ? 'a' : 'b'][0]), '', '', hans ? '#ffd670' : '#9b5de5');
  lab.setState({ emo: hans ? '🐴' : '〰️', title: t.secrets[hans ? 'a' : 'b'][0], lead: hans ? t.hansText : t.wiggleText, body: '', extra: '' });

function renderTest(t) {
  const g = S.g.test, done = S.newDone;

  $('lmPred').innerHTML = predHTML(t, 'test', !S.pracDone);
  $('lmReplay').textContent = `↻ ${t.testNew}`;
  lab.setReadout(done ? esc(t.newScores(B_MEMO, B_RULO, 12)) : g === null ? '?' : '…', '', S.pracDone ? t.both8 : '', '#2ec4b6');
  if (done) lab.setState({ emo: t.st.test[0], title: t.st.test[1], lead: t.st.test[2], body: t.st.test[3], extra: '' });
  else if (S.pracDone) lab.setState({ emo: '🤖', title: t.testAsk, lead: '', body: '', extra: '' });
  else lab.setState({ emo: '🤖', title: t.cards, lead: t.madeUp, body: '', extra: '' });
  lab.setFacts(done ? t.facts.test : []);
}
function pct(x) { return Math.round(x * 100); }
function syncMore() {
  const t = T[lang], n = S.n, s = sim(n), ans = S.g.more !== null;
  $('lmSl').value = n; $('lmSl').disabled = !ans || S.sweeping;
  $('lmSlLbl').textContent = t.cards; $('lmSlVal').textContent = String(n);
  lab.setReadout(ans ? esc(t.findsRule(n, pct(s.rulo))) : '?', '', ans ? t.memoNew(pct(s.memo)) : '', '#9b5de5');
}
function renderMore(t) {
  const ans = S.g.more !== null;
  lab.setGlow('rgba(155, 93, 229, .26)');
  $('lmPred').innerHTML = predHTML(t, 'more', false);
  syncMore();
  if (ans) lab.setState({ emo: t.st.more[0], title: t.st.more[1], lead: t.st.more[2], body: t.st.more[3], extra: '' });
  else lab.setState({ emo: '📈', title: t.moreAsk, lead: '', body: '', extra: '' });
  lab.setFacts(ans ? t.facts.more : []);
}
function renderCheat(t) {
  const g = S.g.cheat, ans = g !== null;
  lab.setGlow('rgba(6, 214, 160, .22)');
  $('lmPred').innerHTML = predHTML(t, 'cheat', false);
  $('lmTog').textContent = `${S.cheatNew ? '✓' : '○'} ${t.newCards}`; $('lmTog').disabled = !ans; $('lmTog').classList.toggle('on', S.cheatNew);
  lab.setReadout(esc(t.cheatVal(8, ans ? B_MEMO : '?', 12)), '', ans && S.cheatNew ? t.testOnNew : '', '#06d6a0');
  if (ans) lab.setState({ emo: t.st.cheat[0], title: t.st.cheat[1], lead: t.st.cheat[2], body: t.st.cheat[3], extra: '' });
  else lab.setState({ emo: '🕵️', title: t.cheatAsk, lead: '', body: '', extra: '' });

render();
