      if (ph === 'answer') h += `<p class="fi-q">${esc(c.ask)}</p><div class="fi-row">${c.chips[m].map((s, i) => opt('ans', i, s)).join('')}</div>`;
      else {
        const j = P.j, nm = (k) => c.objs[k];
        h += `<div class="fi-row">${c.chips[m].map((s, i) => opt('x', i, s, S.ans[m] === i ? 'on' : '', true)).join('')}</div>`;
        h += j.ok ? `<div class="fi-res ok">✅ ${esc(c.fits)}</div><div class="fi-row"><button class="btn" data-a="${m < 2 ? 'next' : 'all'}">${esc(m < 2 ? c.next : c.all)}</button></div>`
          : `<div class="fi-res no">${esc(j.miss ? c.miss(nm(j.miss)) : c.show(nm(j.show)))}</div><div class="fi-row"><button class="btn" data-a="retry">${esc(c.retry)}</button></div>`;
      }
      h += '</div></div>';
    }
  } else {
    const fin = S.rv >= 1;
    h += `<div class="fi-res ok">🌳 ${esc(c.whole)}</div>`;
    if (fin) h += `<div class="fi-cmp">${[0, 1, 2].map((i) => `<div><b>${esc(c.caps[i])}</b><br>${esc(c.you)}: ${esc(c.chips[i][S.ans[i] ?? 2])}<br><b>${esc(c.real)}:</b> ${esc(c.truth[i])}</div>`).join('')}</div>
      <div class="fi-row"><button class="btn" data-a="again1">${esc(t.s.again)}</button></div>`;
  }
  main.innerHTML = h;
  const nd = S.good.filter(Boolean).length;
  lab.setReadout(done ? '🌳' : `${m + 1}/3`, done ? c.whole : c.mission(m + 1), nd ? `📸 ${nd}/3` : '', '#4ea8e0');
  lab.setState(done && S.rv >= 1 ? { emo: t.st1r[0], title: t.st1r[1], lead: t.st1r[2], body: c.done, extra: '' } : { emo: t.st1[0], title: t.st1[1], lead: t.st1[2], body: '', extra: '' });
}
function renderFacts(t, main) {
  const f = t.f, pg = S.page, both = pg[0].length === 3 && pg[1].length === 3, ed = S.edit;
  const page = (i) => `<div class="fi-page ${i ? 'glo' : 'sun'}"><div class="mh">${esc(f.page[i])}</div><div class="hl">${esc(f.hl[i])}</div>${pg[i].length ? `<ul>${pg[i].map((n) => `<li>${esc(f.list[n][1])}</li>`).join('')}</ul>` : `<div class="empty">${esc(f.empty)}</div>`}</div>`;
  let h = `<p class="fi-sub fi-lead">${esc(f.lead)}</p><div class="fi-tabs">${f.tab.map((s, i) => opt('edit', i, `${s} ${pg[i].length}/3`, ed === i ? 'on' : '')).join('')}
    <p class="fi-sub">${esc(f.pick(pg[ed].length))}</p></div><div class="fi-pick${both ? ' full' : ''}"><div class="fi-facts">${f.list.map(([tag, s], n) => `<button class="fi-fact ${pg[ed].includes(n) ? (ed ? 'g' : 's') : ''}" data-a="fact" data-v="${n}"${!pg[ed].includes(n) && pg[ed].length >= 3 ? ' disabled' : ''}>${esc(s)}</button>`).join('')}</div>
    <div class="fi-pages">${page(0)}${page(1)}</div></div>`;
  if (both) {
    h += `<p class="fi-q${S.guess !== null ? ' asked' : ''}">${esc(f.ask)}</p><div class="fi-row">${f.opts.map((s, i) => opt('guess', i, s, S.guess === i ? (i === 2 ? 'good' : 'on') : '', S.guess !== null)).join('')}</div>`;
    if (S.guess !== null) h += `<div class="fi-res ok">${esc(S.guess === 2 ? t.c.fits.slice(0, 0) + (lang === 'ru' ? 'Верно!' : lang === 'hu' ? 'Így van!' : 'Right!') : '')}${S.guess === 2 ? ' ' : ''}${esc(f.ans)}</div><div class="fi-row"><span class="fi-sub">☀️ ${esc(f.left(10 - pg[0].length))} · 🌧️ ${esc(f.left(10 - pg[1].length))}</span><button class="btn ghost" data-a="reset">${esc(f.reset)}</button></div>`;
  }
  if ((pg[0].length || pg[1].length) && !(both && S.guess !== null)) h += `<div class="fi-row"><button class="btn ghost" data-a="reset">${esc(f.reset)}</button></div>`;
  main.innerHTML = h;
  lab.setReadout(`${pg[0].length + pg[1].length}/6`, `☀️ ${pg[0].length}/3 · 🌧️ ${pg[1].length}/3`, '', '#f0b850');
  lab.setState(S.guess !== null ? { emo: t.st2r[0], title: t.st2r[1], lead: t.st2r[2], body: '', extra: '' } : { emo: t.st2[0], title: t.st2[1], lead: t.st2[2], body: '', extra: '' });
}
function renderShot(t, main) {
  const s = t.s, n = S.n, ph = S.sph, pk = S.picks;
  let h = '';
  if (ph === 'idle') h = `<p class="fi-sub">${esc(s.cover)}</p><div class="fi-row"><button class="btn" data-a="play">${esc(s.face)}</button></div>`;
  else if (ph === 'face') h = `<p class="fi-sub">${esc(s.look)}</p>`;
  else if (ph === 'cut') {
    h = pk[n] === undefined ? `<p class="fi-q">${esc(s.ask)}</p><div class="fi-row">${s.feel.map((x, i) => opt('feel', i, x)).join('')}</div>`
      : `<div class="fi-row">${s.feel.map((x, i) => opt('x', i, x, pk[n] === i ? 'on' : '', true)).join('')}</div><div class="fi-row">${n < 2 ? `<button class="btn" data-a="nextpair">${esc(s.more)} →</button>` : `<button class="btn" data-a="overlay">${esc(s.last)}</button>`}</div>`;
  } else {
    h = `<div class="fi-cmp">${[0, 1, 2].map((i) => `<div><b>${esc(s.shots[S.order[i]])}</b> → ${esc(s.feel[pk[i]] ?? '')}</div>`).join('')}</div>${S.ov >= 1 ? `<div class="fi-res ok">${esc(s.same)}</div><div class="fi-row"><button class="btn" data-a="again3">${esc(s.again)}</button></div>` : ''}`;
  }
  main.innerHTML = h;
  const done = ph === 'done';
  lab.setReadout(done ? '👥' : `${Math.min(n + 1, 3)}/3`, done ? '' : s.pair(Math.min(n + 1, 3)), '', '#8a7ae0');
  lab.setState(done && S.ov >= 1 ? { emo: t.st3r[0], title: t.st3r[1], lead: t.st3r[2], body: '', extra: '' } : { emo: t.st3[0], title: t.st3[1], lead: t.st3[2], body: '', extra: '' });
}
function renderSound(t, main) {
  const d = t.snd, sd = S.snd, i = sd.i, fin = i >= 2;
  let h = `<p class="fi-sub">${esc(d.lead)}</p>`;
  if (!fin) {
    h += sd.picks[i] === undefined && !sd.playing && sd.start === 0 ? '' : '';
    const played = sd.start > 0 && !sd.playing && sd.lastI === i;
    if (!played && !sd.playing) { h += `<div class="fi-row"><button class="btn" data-a="splay">${esc(d.play(i + 1))}</button></div>`; sd.lastI = null; }
    else if (sd.playing) { h += `<div class="fi-row"><span class="fi-cap">${esc(d.playing)}</span></div>`; sd.lastI = i; }
    else h += `<p class="fi-q">${esc(d.ask)}</p><div class="fi-row">${d.moods.map((x, j) => opt('smood', j, x)).join('')}</div>`;
    if (sd.noAudio) h += `<p class="fi-sub">${esc(d.nosound)}</p>`;
  } else {
    h += `<div class="fi-res ok">${esc(d.res)}</div><div class="fi-cmp">${[0, 1].map((k) => `<div>${esc(d.pick(k + 1, d.mus[sd.order[k] === 'happy' ? 0 : 1], d.moods[sd.picks[k]]))}</div>`).join('')}</div><div class="fi-row"><button class="btn" data-a="sagain">${esc(d.again)}</button></div>`;
  }
  main.innerHTML = h;
  lab.setReadout('🎵', `${Math.min(i + 1, 2)}/2`, '', '#b07ae0');
  lab.setState({ emo: '🎵', title: d.title, lead: fin ? d.res : d.lead, body: '', extra: '' }); lab.setFacts([]);
}
function renderFind(t, main) {
  const d = t.fnd, f = S.fnd; const url = snap(FAIR[0], FAIR[1], (c) => fair(c, 0));
  let h = `<div class="fi-clip"><img src="${url}" alt=""><div><div class="hd">${esc(d.gazette)}</div><div class="ti">${esc(d.title)}</div></div></div><p class="fi-sub">${esc(d.lead)}</p>`;
  if (f.found) h += `<div class="fi-res ok">✅ ${esc(d.ok)} ${f.rv >= 1 ? esc(d.whole) : ''}</div>` + (f.rv >= 1 ? `<div class="fi-row"><button class="btn" data-a="fagain">${esc(d.again)}</button></div>` : '');
  else h += `<div class="fi-res no">${esc(d.off)}</div>`;
  main.innerHTML = h;
  lab.setReadout('🔎', d.title, '', '#58b868');
  lab.setState({ emo: '🔎', title: f.found ? d.ok : d.title, lead: f.found && f.rv >= 1 ? d.whole : d.lead, body: '', extra: '' }); lab.setFacts([]);
}
render();
</script>
