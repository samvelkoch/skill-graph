  c.beginPath(); c.moveTo(48, 318); c.lineTo(48, 280); c.quadraticCurveTo(48, 262, 70, 258); c.lineTo(118, 252); c.lineTo(148, 204); c.quadraticCurveTo(156, 190, 176, 190);
  c.lineTo(262, 190); c.quadraticCurveTo(282, 190, 296, 206); c.lineTo(326, 250); c.lineTo(360, 256); c.quadraticCurveTo(388, 262, 388, 284); c.lineTo(388, 318); c.closePath();
}
function drawCar(c, t) {
  const st = carState(t);
  c.fillStyle = lg(c, 0, 0, 0, 470, [[0, '#0B2A4A'], [1, '#06162B']]); c.fillRect(0, 0, 420, 470);
  c.strokeStyle = 'rgba(94,200,255,.1)'; c.lineWidth = 1; c.beginPath(); for (let g = 0; g <= 420; g += 20) { c.moveTo(g, 0); c.lineTo(g, 470); } for (let g = 0; g <= 470; g += 20) { c.moveTo(0, g); c.lineTo(420, g); } c.stroke();
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  carPath(c); c.fillStyle = 'rgba(94,200,255,.1)'; c.fill(); c.shadowColor = C.xray; c.shadowBlur = 12; c.lineWidth = 2.6; c.strokeStyle = C.xray; c.stroke(); c.shadowBlur = 0;
  c.lineWidth = 1.8;
  for (const pts of [[[164, 202], [140, 246], [222, 246], [222, 202]], [[232, 202], [232, 246], [312, 246], [288, 206], [276, 202]]]) { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); c.fillStyle = 'rgba(94,200,255,.08)'; c.fill(); c.stroke(); }
  c.beginPath(); c.moveTo(227, 202); c.lineTo(227, 316); c.moveTo(122, 258); c.lineTo(104, 316); c.stroke();
  for (const wx of [118, 322]) { circ(c, wx, 318, 42); c.fillStyle = '#06162B'; c.fill(); c.stroke(); circ(c, wx, 318, 33); c.fillStyle = 'rgba(94,200,255,.12)'; c.fill(); c.stroke(); circ(c, wx, 318, 19); c.stroke(); for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(wx, 318); c.lineTo(wx + Math.cos(i * 1.2566 + t * 2) * 19, 318 + Math.sin(i * 1.2566 + t * 2) * 19); c.stroke(); } }
  c.restore();
  // little chips sprinkle all over
  const nt = Math.floor(st.extra * TINY.length);
  for (let i = 0; i < nt; i++) { const [x, y] = TINY[i], age = st.a - (0.3 + 8 * 0.55) - (i / TINY.length) * 1.8, k = backOut(age * 5); if (k < 0.05) continue; chip(c, x, y, 3.4 * k, 0.5 * clamp01(1 - age * 0.8), t); }
  // the eight big ones, one after another
  CAR_CHIPS.forEach(([x, y, em], i) => {
    const age = st.a - (0.3 + i * 0.55);
    if (age < 0) { c.save(); c.globalAlpha = 0.35; rr(c, x - 9, y - 9, 18, 18, 4); c.strokeStyle = C.xray; c.setLineDash([3, 3]); c.lineWidth = 1.2; c.stroke(); c.restore(); return; }
    const k = backOut(age * 3);
    if (k < 0.05) return;
    if (age < 0.8) { c.save(); c.globalAlpha = 1 - age / 0.8; circ(c, x, y, 12 + age * 46); c.strokeStyle = C.chipL; c.lineWidth = 2.4; c.stroke(); c.restore(); }
    chip(c, x, y, 10.5 * k, 0.8, t);
    emoji(c, em, x, y - 27 * Math.min(1, k), 21 * Math.min(1, k));
  });
}
function carCountText() { const st = carState(now()); return st.done ? '50+' : String(st.count); }

// --- controls ------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, d = b.dataset;
  if (act === 'hg') answerHouse(+d.g);
  else if (act === 'hagain') { S.h = newHouse(); sfx.click(); render(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === d.k ? null : d.k;
    if (S.sec === 'car') startCar(); else if (S.sec === 'card') { S.card.o = 0; S.card.target = 0; S.card.played = false; }
    sfx.click(); render();
  } else if (act === 'card') { if (S.card.target === 1) replayCard(); else toggleCard(); }
  else if (act === 'car') { startCar(); render(); }
  else if (act === 'ig') answerInout(d.k, +d.j);
  else if (act === 'inext') { if (S.i.r >= 2) S.i = newInout(); else S.i = { ...newInout(), r: S.i.r + 1 }; sfx.click(); render(); }
  else if (act === 'ng') answerNight(+d.j);
  else if (act === 'nnext') nextNight();
  else if (act === 'nr') tapNight(d.v);
  else if (act === 'nagain') { S.n = newNight(); sfx.click(); render(); }
});
function answerInout(kind, j) {
  const I = S.i, r = I.r, tx = T[lang].i;
  if (kind === 'in' && I.st === 'in') {
    I.gIn = j; I.tIn = now(); I.st = 'out'; (j === tx.okIn[r] ? sfx.good : sfx.bad)();
  } else if (kind === 'out' && I.st === 'out') {
    I.gOut = j; I.tOut = now(); I.st = 'done'; I.tDone = now() + 1.2; (j === tx.okOut[r] ? sfx.good : sfx.bad)();
    [r === 0 ? 450 : r === 1 ? 600 : 500].forEach((ms) => setTimeout(r === 0 ? beep : sfx.snap, ms));
  } else return;
  showStage(); render();
}
function answerNight(j) {
  const N = S.n; if (N.ph !== 'ask' || N.guess !== null) return;
  N.guess = j; N.lit = true; N.cgT = now(); (j === 1 ? sfx.good : sfx.bad)(); showStage(); render();
}
function nextNight() {
  const N = S.n;
  if (N.ph === 'ask') { N.ph = 'rounds'; N.r = 0; N.tap = null; N.sens = false; }
  else if (N.r >= 3) { N.ph = 'end'; }
  else { N.r++; N.tap = null; }
  sfx.click(); render();
}
const NANS = ['off', 'on', 'off', 'on'];
function tapNight(v) {
  const N = S.n; if (N.ph !== 'rounds' || N.tap) return;
  const r = N.r, ans = NANS[r], tok = ++N.tok;
  N.tap = v; N.cgT = now();
  if (v === ans) { N.ok[r] = true; N.lit = v === 'on'; sfx.good(); }
  else {
    N.ok[r] = false; N.lit = v === 'on'; sfx.bad();
    setTimeout(() => { if (S.n === N && N.tok === tok) { N.flash = now(); N.lit = ans === 'on'; N.cgT = now(); render(); } }, 1100);
  }
  showStage(); render();
}

// --- one render per change: controls, readout and the state card ------------------------------------------------------
const verdict = (t, ok) => `<div class="hc-verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.wrong)}</div>`;
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v === 'house') renderHouse(t); else if (v === 'inout') renderInout(t); else renderNight(t);
}
function stateCard(t, k, full) { const [emo, title, lead, body] = t.st[k][full ? 'f' : 'n']; lab.setState({ emo, title, lead, body, extra: '' }); }

function renderHouse(t) {
  const H = S.h, k = H.found.size, done = k >= 4, open = secret.unlocked();
  lab.setGlow('rgba(94,200,255,.22)');
  const sc = (key, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-act="sec" data-k="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  const secRow = `<div class="row2"><div class="chips">${sc('card', '🎂')}${sc('car', '🚗')}</div></div>`;
  let html = '';
  if (S.sec) {
    html = S.sec === 'card'
      ? `<p class="hc-text">${esc(t.sec.cardText)}</p><button class="btn" data-act="card">${esc(S.card.target === 1 ? t.again : t.secrets.card[1])}</button>`
      : `<p class="hc-text">${esc(t.sec.carText)}</p><button class="btn" data-act="car">${esc(t.again)}</button>`;
    html += secRow;
    if (S.sec === 'card') lab.setReadout('🎂', '', '', '#E3B341');
    else lab.setReadout(esc(carCountText()), '', carState(now()).done ? t.sec.dozens : '', '#1F9A62');
  } else if (H.ph === 'ask') {
    html = `<div class="hc-q">${esc(t.h.q)}</div><div class="hc-opts two">${t.h.o.map((o, j) => `<button class="hc-btn" data-act="hg" data-g="${j}"><span class="e">${j ? '✅' : '🚫'}</span><span>${esc(o)}</span></button>`).join('')}</div>` + secRow;
    lab.setReadout('?', '', '', '#5EC8FF');
  } else {
    let info = '';
    if (H.info === 'r') info = verdict(t, H.guess === 1) + `<p class="hc-text">${esc(t.h.r)}</p>`;
    else if (H.info) info = `<div class="hc-info"><span class="hc-ic">${OBJ[H.info].emo}</span><div><b>${esc(t.h.names[H.info])}</b><span class="hc-w">${esc(t.h.what[H.info])}</span></div></div>`;
    const showInfo = H.ph === 'reveal' || H.info;
    html = (showInfo ? info : '') + (H.ph === 'free' && !done ? `<p class="hc-hint">${esc(t.h.hint)}</p>` : '') + (done ? `<div class="hc-go"><button class="btn" data-act="hagain">${esc(t.again)}</button></div>` : '') + secRow;
    const sel = H.ph === 'free' && H.info && H.info !== 'r' ? OBJ[H.info] : null;
    const pill = done ? t.h.all : sel ? (sel.chip ? t.h.chip : t.h.none) : '';
    lab.setReadout(`${k}/4 ${Array.from({ length: k }, () => chipSvg(16)).join('')}`, '', pill, done ? '#C99A2E' : sel && !sel.chip ? '#6B7390' : '#1F9A62');
  }
  $('hcBody').innerHTML = html;
  stateCard(t, 'house', done);
}

function renderInout(t) {
  const I = S.i, r = I.r, tx = t.i, full = r === 2 && I.st === 'done';
  lab.setGlow('rgba(227,179,65,.2)');
  const optHtml = (kind) => {
    const opts = kind === 'in' ? tx.oIn[r] : tx.oOut[r];
    return `<div class="hc-q">${esc(kind === 'in' ? tx.qIn[r] : tx.qOut[r])}</div><div class="hc-opts">${opts.map((o, j) => `<button class="hc-btn" data-act="ig" data-k="${kind}" data-j="${j}"><span class="e">${esc(emoOf(o))}</span><span>${esc(textOf(o))}</span></button>`).join('')}</div>`;
  };
  let html;
  if (I.st === 'in') html = optHtml('in');
  else if (I.st === 'out') html = verdict(t, I.gIn === tx.okIn[r]) + optHtml('out');
  else html = verdict(t, I.gOut === tx.okOut[r]) + `<p class="hc-text">${esc(tx.why[r])}</p><button class="btn" data-act="inext">${esc(r >= 2 ? t.again : t.next)}</button>`;
  $('hcBody').innerHTML = html;
  lab.setReadout(`${r + 1}/3`, '', '', '#E3B341');
  stateCard(t, 'inout', full);
}

function renderNight(t) {
  const N = S.n, tx = t.n, k = N.ok.filter(Boolean).length, r = N.r;
  lab.setGlow('rgba(255,196,100,.2)');
  let html;
  if (N.ph === 'ask') {
    if (N.guess === null) html = `<div class="hc-q">${esc(tx.q)}</div><div class="hc-opts">${tx.o.map((o, j) => `<button class="hc-btn" data-act="ng" data-j="${j}"><span class="e">${['🌑', '💡', '🔔'][j]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    else html = verdict(t, N.guess === 1) + `<p class="hc-text">${esc(tx.r)}</p><button class="btn" data-act="nnext">${esc(t.next)}</button>`;
  } else if (N.ph === 'rounds') {
    const ans = NANS[r];
    if (!N.tap) html = `<div class="hc-q">${esc(tx.skies[r])}</div><div class="hc-opts two"><button class="hc-btn" data-act="nr" data-v="on"><span class="e">${esc(emoOf(tx.on))}</span><span>${esc(textOf(tx.on))}</span></button><button class="hc-btn" data-act="nr" data-v="off"><span class="e">${esc(emoOf(tx.off))}</span><span>${esc(textOf(tx.off))}</span></button></div>`;
    else html = verdict(t, N.tap === ans) + (N.tap === ans ? '' : `<p class="hc-text">${esc(tx.rule)}</p>`) + `<button class="btn" data-act="nnext">${esc(t.next)}</button>`;
  } else html = `<div class="hc-text">${esc(tx.rule)}</div><button class="btn" data-act="nagain">${esc(t.again)}</button>`;
  $('hcBody').innerHTML = html;
  if (N.ph === 'ask') lab.setReadout('?', '', '', '#E3B341');
  else lab.setReadout(`${k}/4`, '', '', '#E3B341');
  stateCard(t, 'chip', N.ph === 'end');
}
render();
setInterval(() => { if (lab.view === 'house' && S.sec === 'car') { const st = carState(now()); lab.setReadout(esc(st.done ? '50+' : String(st.count)), '', st.done ? T[lang].sec.dozens : '', '#1F9A62'); } }, 120);
</script>
