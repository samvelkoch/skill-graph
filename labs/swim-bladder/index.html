  }
  const wf = (i) => i === 0 ? 3.4 : lerp(8.6, 1.2, Math.pow(Math.max(0, i - 1) / 26, 1.2));
  ribbon(c, pts, wf); c.fillStyle = lg(c, hx - 80, hy - 60, hx + 20, hy + 60, [[0, '#a29252'], [1, '#6e6034']]); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#3f3519'; c.stroke();
  ribbon(c, pts, (i) => wf(i) * .45); c.save(); c.translate(0, 1.5); c.fillStyle = 'rgba(224, 210, 150, .55)'; c.fill(); c.restore();
  c.fillStyle = 'rgba(60, 48, 22, .5)';
  for (let i = 3; i < 26; i += 3) { c.beginPath(); c.arc(pts[i].x + (i % 2 ? -dy : dy) * 2.5, pts[i].y + (i % 2 ? dx : -dx) * 2.5, 1.6, 0, Math.PI * 2); c.fill(); }
  // thin lobed fins
  c.strokeStyle = '#4a3f20'; c.lineWidth = 2; c.beginPath();
  for (const i of [6, 14]) { const p = pts[i]; c.moveTo(p.x, p.y); c.quadraticCurveTo(p.x + 6 + Math.sin(time * 3 + i) * 2, p.y + 10, p.x + 12, p.y + 16); }
  c.stroke();
  // the lung, glowing pink inside the body
  if (lung > .02) { c.save(); c.globalAlpha = lung; c.lineCap = 'round'; c.lineWidth = 8; c.strokeStyle = 'rgba(244, 143, 160, .85)'; c.beginPath();
    for (let i = 3; i <= 14; i++) { if (i === 3) c.moveTo(pts[i].x - dy * -2.4, pts[i].y + dx * -2.4); else c.lineTo(pts[i].x - dy * -2.4, pts[i].y + dx * -2.4); }
    c.stroke(); c.lineWidth = 3; c.strokeStyle = 'rgba(255, 220, 226, .8)'; c.stroke(); c.restore(); }
  // eye and mouth
  const h = pts[1]; c.beginPath(); c.arc(h.x + dx * 1 + dy * 3, h.y + dy * 1 - dx * 3, 2.6, 0, Math.PI * 2); c.fillStyle = '#10180a'; c.fill();
  c.beginPath(); c.arc(h.x + dy * 2.6 + dx, h.y - dx * 3.2 + dy, .9, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();
  if (gulp) { c.strokeStyle = '#3a1818'; c.lineWidth = 3; c.beginPath(); c.arc(pts[0].x + dx * 2, pts[0].y + dy * 2, 3.2, 0, Math.PI * 2); c.stroke(); }
  // water tint over the part under the surface, a surface line
  c.fillStyle = 'rgba(120, 118, 60, .22)'; c.fillRect(X0, SURFP, X1 - X0, Y1 - SURFP);
  c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.7)'; wave(c, SURFP, time, X0, X1, 1.2); c.stroke();
  // the air bubble that is gulped
  if (air >= 0) { const bx = lerp(272, pts[0].x + dx * 3, ease(air)), by = lerp(60, pts[0].y + dy * 3 - 2, ease(air)), r = lerp(7, 3.5, air);
    c.beginPath(); c.arc(bx, by, Math.max(0, r), 0, Math.PI * 2); c.fillStyle = 'rgba(235, 248, 255, .95)'; c.fill(); c.lineWidth = 1; c.strokeStyle = '#2a7aa8'; c.stroke(); }
  // step indicator
  [1, 2].forEach((k, i) => {
    const on = step === k, done = step === 0 || step > k;
    c.beginPath(); c.arc(24 + i * 30, 24 + 0, 12, 0, Math.PI * 2); c.fillStyle = on ? '#fff' : done ? 'rgba(255,255,255,.55)' : 'rgba(6,16,28,.7)'; c.fill();
    c.lineWidth = 1.5; c.strokeStyle = 'rgba(6,16,28,.8)'; c.stroke();
    c.fillStyle = on || done ? '#0a1c2c' : '#cfe3ee'; c.font = `900 ${F(13)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(k), 24 + i * 30, 25);
  });
}

// --- secret B: a lancelet wriggling above the sand ---------------------------------------------------------------
function drawLance(c, time) {
  const X0 = EXT.x0 - 4, X1 = EXT.x1 + 4, Y0 = EXT.y0 - 4, Y1 = EXT.y1 + 4;
  c.fillStyle = lg(c, 0, Y0, 0, H, [[0, '#2f8fb0'], [.5, '#0f3d5e'], [1, '#071f33']]); c.fillRect(X0, Y0, X1 - X0, Y1 - Y0);
  for (let i = 0; i < 4; i++) { const bx = 20 + i * 95 + Math.sin(time * .3 + i) * 10; c.fillStyle = lg(c, 0, Y0, 0, 240, [[0, 'rgba(255,255,255,.12)'], [1, 'rgba(255,255,255,0)']]); c.beginPath(); c.moveTo(bx, Y0); c.lineTo(bx + 28, Y0); c.lineTo(bx + 90, 240); c.lineTo(bx + 36, 240); c.closePath(); c.fill(); }
  sand(c, 224);
  // sand grains kicked up
  for (let i = 0; i < 14; i++) { const gxp = 70 + (i * 41) % 230, gy = 218 - ((time * (10 + i % 4 * 4) + i * 17) % 40); c.beginPath(); c.arc(gxp, gy, 1.2, 0, Math.PI * 2); c.fillStyle = `rgba(214, 190, 130, ${.5 - (218 - gy) / 100})`; c.fill(); }
  const N = 60, L = 220, x0 = 70, yb = 168, sp = [], hh = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N, y = yb + Math.sin(u * 7 - time * 5) * 9 * (.45 + .55 * (1 - u)) + Math.sin(time * 1.3) * 3;
    sp.push([x0 + u * L, y]); hh.push(13 * Math.pow(Math.sin(Math.PI * clamp(u * .98 + .01, 0, 1)), .6) * (1 - .3 * u));
  }
  const off = (i, f) => { const a = sp[Math.max(0, i - 1)], b = sp[Math.min(N, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [sp[i][0] + dy / l * hh[i] * f, sp[i][1] - dx / l * hh[i] * f]; };
  const line = (f, i0 = 0, i1 = N) => { for (let i = i0; i <= i1; i++) { const [x, y] = off(i, f); if (i === i0) c.moveTo(x, y); else c.lineTo(x, y); } };
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 12; c.shadowOffsetY = 6;
  c.beginPath(); line(-1); for (let i = N; i >= 0; i--) { const [x, y] = off(i, 1); c.lineTo(x, y); } c.closePath();
  c.fillStyle = lg(c, 0, yb - 30, 0, yb + 30, [[0, 'rgba(236, 248, 255, .5)'], [1, 'rgba(180, 215, 235, .28)']]); c.fill(); c.restore();
  c.lineWidth = 1.6; c.strokeStyle = 'rgba(240, 250, 255, .9)'; c.beginPath(); line(-1); c.stroke(); c.beginPath(); line(1); c.stroke();
  // muscle blocks (chevrons)
  c.lineWidth = 1; c.strokeStyle = 'rgba(220, 240, 255, .5)'; c.beginPath();
  for (let i = 5; i < N - 3; i += 2) { const a = off(i + 1, .85), m = off(i, 0), b = off(i + 1, -.85); c.moveTo(a[0], a[1]); c.lineTo(m[0], m[1]); c.lineTo(b[0], b[1]); }
  c.stroke();
  // gut
  c.lineWidth = 5; c.strokeStyle = 'rgba(110, 150, 180, .55)'; c.beginPath(); line(-.35, 6, 46); c.stroke();
  // nerve cord, then the notochord: the stiff rod along the back
  c.lineWidth = 1.6; c.strokeStyle = 'rgba(255, 255, 255, .7)'; c.beginPath(); line(.78, 2, N - 2); c.stroke();
  c.lineWidth = 7; c.strokeStyle = 'rgba(120, 78, 0, .55)'; c.beginPath(); line(.34, 1, N - 1); c.stroke();
  c.lineWidth = 4.6; c.strokeStyle = '#ffe08a'; c.stroke();
  c.lineWidth = 1.4; c.strokeStyle = 'rgba(255, 255, 255, .8)'; c.beginPath(); line(.4, 1, N - 1); c.stroke();
  c.lineWidth = 1; c.strokeStyle = 'rgba(150, 100, 10, .6)'; c.beginPath();
  for (let i = 3; i < N - 1; i += 2) { const a = off(i, .34 + .2), b = off(i, .34 - .2); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); }
  c.stroke();
  // the head end: little tentacles around the mouth
  c.lineWidth = 1.4; c.strokeStyle = 'rgba(240, 250, 255, .8)'; c.beginPath();
  for (let k = -3; k <= 3; k++) { const p = sp[0]; c.moveTo(p[0] + 1, p[1] + k * 1.5); c.lineTo(p[0] - 12 - Math.abs(k) * -1, p[1] + k * 4.4 + Math.sin(time * 4 + k) * 1.5); }
  c.stroke();
}

// --- controls --------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(v, j) {
  S.p[v] = j; (j === PRED[v].right ? sfx.good : sfx.bad)();
  if (v === 'bladder') S.ease = { from: S.n, to: S.n + 2, t: 0, dur: 1.8 };
  else if (v === 'gills') S.out = true;
  else S.swim = false;
  render(); showStage();
}
$('sbPred').addEventListener('click', (ev) => { const b = ev.target.closest('[data-opt]'); if (!b || b.disabled) return; answer(lab.view, +b.dataset.opt); });
$('sbGas').addEventListener('input', () => { if ($('sbGas').disabled) return; S.n = +$('sbGas').value; sfx.tick(); syncBladderUI(true); });
$('sbOut').addEventListener('click', () => { if (S.p.gills === null) return; S.out = !S.out; sfx.click(); render(); });
$('sbStop').addEventListener('click', () => { if (S.p.shark === null) return; S.swim = !S.swim; sfx.click(); render(); });
$('sbSec').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-k]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.secT = 0; sfx.click(); render(); if (S.sec) showStage();
});

let uiKey = '';
function syncBladderUI(force) {
  const inp = $('sbGas'), locked = S.p.bladder === null || !!S.ease, nh = nHold(S.d), show = S.p.bladder !== null && nh <= N_MAX;
  const key = `${S.n.toFixed(2)}|${nh.toFixed(2)}|${locked}|${lang}`;
  if (key === uiKey && !force) return;
  uiKey = key;
  inp.disabled = locked;
  if (Math.abs(+inp.value - S.n) > .05) inp.value = String(S.n);
  $('sbGasVal').textContent = fmt(S.n);
  const mk = $('sbMk'); mk.style.display = show ? 'block' : 'none'; mk.style.setProperty('--f', (nh / N_MAX).toFixed(4));
  $('sbHoldRow').style.display = show ? 'flex' : 'none';
}

let roKey = '';
function refreshRO(force) {
  const t = T[lang], v = lab.view; let val, sub = '', pill_ = '', col;
  if (v === 'bladder') {
    const st = S.vd < -.3 ? 'rising' : S.vd > .3 ? 'sinking' : 'steady';
    val = t.depth(Math.round(S.d)); sub = t.share(fmt(volOf(S.n, S.d) * 100)); pill_ = t[st]; col = { rising: '#2f9fc6', sinking: '#a35f3a', steady: '#5f8a2a' }[st];
  } else if (v === 'gills') {
    const e = ease(S.outT); val = t.oxygenIn(Math.round(lerp(100, 15, e))); sub = t.illus; pill_ = e > .5 ? t.outWater : t.inWater; col = e > .5 ? '#a8423a' : '#2f9fc6';
  } else {
    val = S.swim ? t.sharkSwimming : t.sharkSinking; pill_ = S.p.shark === null ? '' : t.liver; col = '#6f808e';
  }
  const key = `${lang}|${v}|${val}|${sub}|${pill_}`;
  if (key === roKey && !force) return;
  roKey = key; lab.setReadout(val, sub, pill_, col);
}

function render() {
  const t = T[lang], v = lab.view, pr = PRED[v], ans = S.p[v];
  for (const k of ['bladder', 'gills', 'shark']) $('sbC-' + k).style.display = k === v ? 'block' : 'none';
  const opts = t[pr.opts];
  $('sbPred').innerHTML = `<p class="sb-q">${esc(t[pr.ask])}</p><div class="sb-opts">${opts.map((x, j) => {
    const cls = ans === null ? '' : j === pr.right ? ' good' : j === ans ? ' bad' : ' dim';
    return `<button type="button" class="sb-opt${cls}" data-opt="${j}"${ans === null ? '' : ' disabled'}>${esc(x)}</button>`;
  }).join('')}</div>${ans === null ? '' : `<p class="sb-verdict" style="color:${ans === pr.right ? 'var(--ok)' : 'var(--wip)'}">${esc(ans === pr.right ? t[pr.rt] : t[pr.wt])}</p>`}`;
  $('sbGasLbl').textContent = t.gas; $('sbHold').textContent = t.hold;
  $('sbOutTxt').textContent = t.outOfWater; $('sbOut').disabled = ans === null && v === 'gills'; $('sbOut').setAttribute('aria-checked', String(S.out));
  $('sbStop').textContent = S.swim ? t.stop : t.swim; $('sbStop').disabled = ans === null && v === 'shark';
  const sc = (k, emo) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(t.secrets[k === 'lung' ? 'a' : 'b'][0])}` : '🔒 ???'}</button>`;
  $('sbSec').innerHTML = sc('lung', '🫁') + sc('lance', '🐟');
  lab.setGlow(v === 'shark' ? 'rgba(138, 154, 168, .28)' : v === 'gills' ? 'rgba(214, 59, 59, .22)' : 'rgba(80, 170, 220, .3)');
  if (S.sec) {
    const a = S.sec === 'lung';
    lab.setState({ emo: a ? '🫁' : '🐟', title: t.secrets[a ? 'a' : 'b'][0], lead: a ? t.lungText : t.lanceText, body: '', extra: '' }); lab.setFacts([]);
  } else if (ans === null) {
    lab.setState({ emo: '🤔', title: t[pr.ask], lead: '', body: '', extra: '' }); lab.setFacts([]);
  } else {
    const s = t.st[v]; lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' }); lab.setFacts(t.facts[v]);
  }
  refreshRO(true); syncBladderUI(true);
}

// --- the loop ----------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view, s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  SC = s; EXT.x0 = -ox / s; EXT.y0 = -oy / s; EXT.x1 = (w - ox) / s; EXT.y1 = (h - oy) / s;
  if (S.sec) S.secT += dt;
  if (v === 'bladder') stepBladder(dt); else if (v === 'gills') stepGills(dt); else stepShark(dt);
  c.save();
  if (v !== 'bladder' || S.sec) { c.beginPath(); c.roundRect(0, 0, w, h, 18); c.clip(); }
  c.translate(ox, oy); c.scale(s, s);
  if (S.sec === 'lung') drawLung(c, time);
  else if (S.sec === 'lance') drawLance(c, time);
  else if (v === 'bladder') drawBladder(c, time);
  else if (v === 'gills') drawGills(c, time, dt);
  else drawShark(c, time);
  c.restore();
  refreshRO(false); if (v === 'bladder') syncBladderUI(false);
});
render();
</script>
