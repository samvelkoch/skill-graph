// --- the goal scene (a pitch seen from above) ------------------------------------------------------------------

  c.moveTo(U(13.9), V(0)); c.lineTo(U(13.9), V(16.5)); c.lineTo(U(54.1), V(16.5)); c.lineTo(U(54.1), V(0));

  c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(U(34), V(11), Math.max(1.5, 0.3 * s), 0, 7); c.fill();

// --- the statue scene (secret): a side view -----------------------------------------------------------------

// --- pointer: drag P in Walk / Outside, drag along the line in Goal ---------------------------------------------
const cv = $('cv');
let dragging = false;
const pt = (ev) => { const r = cv.getBoundingClientRect(); return { px: ev.clientX - r.left, py: ev.clientY - r.top, w: r.width, h: r.height }; };
const toWorld = (p) => { const { s, cx, cy } = circleFrame(p.w, p.h); return [(p.px - cx) / s, -(p.py - cy) / s]; };
const pLocked = () => (lab.view === 'walk' ? S.w.guess === null && !S.w.skip : S.o.guess === null && !S.o.skip);
function goalFromPointer(p) {
  const sec = S.sec === 'statue';
  if (sec) { const s = Math.min((p.w - 70) / 9.4, (p.h - 40) / 6.6); S.st.x = clamp((p.w - 44 - p.px) / s, 0.3, 8.5); S.st.tw = null; }
  else { const s = Math.min(p.w / 78, p.h / 66) * 0.97, oy = (p.h - 66 * s) / 2 + 9 * s; S.g.y = clamp((p.py - oy) / s, 1, 52); S.g.tw = null; S.g.moved = true; }
}
cv.addEventListener('pointerdown', (ev) => {
  const v = lab.view, p = pt(ev);
  if (v === 'goal') { if (S.g.guess === null && S.sec !== 'statue') return; dragging = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ } goalFromPointer(p); render(); return; }
  if (pLocked()) return;
  const st = v === 'walk' ? S.w : S.o, { s, cx, cy } = circleFrame(p.w, p.h);
  if (Math.hypot(p.px - (cx + st.P[0] * s), p.py - (cy - st.P[1] * s)) > 34) return;
  dragging = true; st.tw = null; S.hint = false; try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
});
cv.addEventListener('pointermove', (ev) => {
  if (!dragging) return;
  const v = lab.view, p = pt(ev);
  if (v === 'goal') { goalFromPointer(p); render(); return; }
  const st = v === 'walk' ? S.w : S.o;
  st.P = (v === 'walk' ? conW : conO)(toWorld(p)); st.moved = true; render();
});
const endDrag = () => { dragging = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const goView = (v) => { if (lab.view !== v) $('views').querySelector(`[data-view="${v}"]`)?.click(); };
function newRound(kind) {
  if (kind === 'walk') { const st = S.w; st.r = (st.r + 1) % W_ROUNDS.length; Object.assign(st, { guess: null, skip: false, moved: false, tw: null, P: [...W_ROUNDS[st.r].cfg.P0], seen: {} }); if (S.sec === 'arc') S.sec = null; }
  else { const st = S.o; st.r = (st.r + 1) % O_ROUNDS.length; st.cur = O_ROUNDS[st.r]; Object.assign(st, { guess: null, skip: false, moved: false, tw: null, P: [...O_ROUNDS[st.r].cfg.P0] }); }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-pick], [data-jump], [data-act], [data-off]'); if (!b) return;
  const v = lab.view;
  if (b.dataset.pick !== undefined) {
    const i = +b.dataset.pick;
    if (v === 'walk' || v === 'outside') {
      const st = v === 'walk' ? S.w : S.o, R = (v === 'walk' ? W_ROUNDS : O_ROUNDS)[st.r];
      if (st.guess !== null) return;
      st.guess = i; const ck = v + st.r; if (!S.counted.has(ck)) { S.counted.add(ck); S.nGuess++; if (i === R.ok) S.nRight++; } // each round counts once
      (i === R.ok ? sfx.good : sfx.bad)(); showStage();
    } else {
      if (S.g.guess !== null) return;
      const [a, bb] = gAB(0), best = Math.sqrt(a * bb);
      S.g.guess = i; (i === 2 ? sfx.good : sfx.bad)(); tweenN(S.g, 'y', best, 1.1); showStage();
    }
  } else if (b.dataset.jump) {
    const st = v === 'walk' ? S.w : S.o; S.hint = false; sfx.click();
    if (v === 'walk') tweenP(st, b.dataset.jump === 'in' ? W_ROUNDS[st.r].cfg.P0 : b.dataset.jump === 'on' ? [0, -1] : [0, -1.35]);
  } else if (b.dataset.off !== undefined) {
    S.g.off = +b.dataset.off; const [a, bb] = gAB(S.g.off); tweenN(S.g, 'y', Math.sqrt(a * bb), 0.8); sfx.click();
  } else {
    const act = b.dataset.act;

    else if (act === 'mode') {
      const st = S.o, F = O_FREE[b.dataset.m]; st.cur = F; st.P = [...F.cfg.P0]; st.tw = null; st.moved = true; sfx.click();
    } else if (act === 'best') {

      else { const [a, bb] = gAB(S.g.off); tweenN(S.g, 'y', Math.sqrt(a * bb), 0.8); }
      sfx.click();
    } else if (act === 'sec') {

      const k = b.dataset.k;

        S.sec = S.sec === 'arc' ? null : 'arc';

$('ctrlBody').addEventListener('input', (ev) => {

  return `<button class="chip sa-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;

  lab.setGlow('rgba(63, 208, 184, .22)'); hideGauge();

  setHtml($('secWalk'), `${lang}|${pred ? 'p' + st.r : 'f' + st.r + '_' + st.guess}`, () => pred
    ? predBlock(w.q(R.a, R.c), R.opts.map((o) => `${o}°`), st, R.ok)
    : `<div id="wLeg"></div><div id="wMove"><div class="sa-sl"><span>${esc(t.walk)}</span><input type="range" class="big" id="wSl" min="-85" max="140" step="1" style="--track:linear-gradient(90deg,#3d5aa8 82%,#8a63d2 82%)"></div>
      <div class="row2">${['in', 'on', 'out'].map((k) => `<button class="chip sa-chip" data-jump="${k}">${esc(t.jump[k])}</button>`).join('')}</div></div>
      <div class="row2"><button class="btn sa-act" data-act="again">${esc(t.again)}</button></div>
      <div class="row2" id="wSec"></div>${st.guess === null ? '' : `<div style="margin-top:14px">${predBlock(w.q(R.a, R.c), R.opts.map((o) => `${o}°`), st, R.ok)}</div>`}`);
  if (!pred) {
    setHtml($('wLeg'), `${lang}|${arc ? 'on' : G.kind}`, () => legend(t, arc ? 'on' : G.kind));
    $('wMove').style.display = arc ? 'none' : '';
    setHtml($('wSec'), `${lang}|${S.sec}|${secret.unlocked()}`, () => secChips(t));
    document.querySelectorAll('#secWalk [data-jump]').forEach((b) => b.classList.toggle('seen', !!st.seen[b.dataset.jump]));
    const sl = $('wSl'); if (sl && document.activeElement !== sl) sl.value = clamp(Math.round(-st.P[1] * 100), -85, 140);
  }
  const facts = [{ emo: '📜', text: t.facts.euclid, src: SRC.euclid }];
  lab.setFacts(facts);
  if (pred) {
    lab.setReadout('?', '', t.zone.in, TEAL);
    lab.setState({ emo: '🤔', title: w.q(R.a, R.c), lead: w.lead, body: '', extra: ruleHtml(t) });
    return;
  }
  const k = G.kind, A = G.bigD, B = G.smallD, g = fmt(G.ang);
  const num = k === 'in' ? [A, B, g] : k === 'on' ? [A, g] : [A, B, g];
  const sub = named ? w.sx[k](...num.slice(0, -1)) : w.sub[k](...num.slice(0, -1));
  lab.setReadout(`${g}°`, sub, t.zone[k], TEAL);
  let stt;
  if (arc) stt = { emo: '⭕', title: w.arcT, lead: w.arcL(g), body: w.arcB(fmt(180 - G.ang)) };
  else if (!st.moved && st.guess !== null) {
    const ok = st.guess === R.ok;
    stt = { emo: ok ? '✅' : '🤔', title: ok ? t.ok : w.no(R.opts[st.guess]), lead: ok ? w.txt.in(A, B, g) : w.noLead(g), body: w.body };
    if (named) stt.body = w.fx.in(A, B, g) + ' ' + w.body;
  } else {
    stt = { emo: k === 'in' ? '⭕' : k === 'on' ? '📍' : '↗️', title: w.title[k], lead: w.txt[k](...num), body: named ? w.fx[k](...num) : '' };
  }
  lab.setState({ ...stt, extra: ruleHtml(t) });
}

function renderOut() {
  const t = T[lang], o = t.o, w = t.w, st = S.o, R = O_ROUNDS[st.r], cur = st.cur, pred = st.guess === null && !st.skip;
  lab.setGlow('rgba(242, 176, 74, .2)'); hideGauge();
  const G = geom(st.P, cur.cfg, cur.mode), named = ruleNamed();
  const q = R.mode === 'sec' ? o.qSec(R.a, R.c) : o.qTan(R.a, R.c);
  setHtml($('secOut'), `${lang}|${pred ? 'p' + st.r : 'f' + st.r + '_' + st.guess}`, () => pred
    ? predBlock(q, R.opts.map((x) => `${x}°`), st, R.ok)
    : `${legend(t, 'out')}<div class="sa-sl"><span>${esc(t.away)}</span><input type="range" class="big" id="oSl" min="106" max="190" step="1" style="--track:linear-gradient(90deg,#8a63d2,#3d5aa8)"></div>
      <div class="row2"><button class="chip sa-chip" data-act="mode" data-m="sec" id="oMsec">${esc(o.chips.sec)}</button><button class="chip sa-chip" data-act="mode" data-m="tan" id="oMtan">${esc(o.chips.tan)}</button></div>
      <div class="row2"><button class="btn sa-act" data-act="again">${esc(t.again)}</button></div>${st.guess === null ? '' : `<div style="margin-top:14px">${predBlock(q, R.opts.map((x) => `${x}°`), st, R.ok)}</div>`}`);
  if (!pred) {
    $('oMsec').classList.toggle('on', cur.mode === 'sec'); $('oMtan').classList.toggle('on', cur.mode === 'tan');
    const sl = $('oSl'); if (sl && document.activeElement !== sl) sl.value = clamp(Math.round(len(st.P) * 100), 106, 190);
  }
  lab.setFacts([{ emo: '🧭', text: t.facts.name, src: SRC.reg }, { emo: '☀️', text: t.facts.sundial, src: SRC.reg }]);
  if (pred) {
    lab.setReadout('?', '', t.zone.out, AMBER);
    lab.setState({ emo: '🤔', title: q, lead: R.mode === 'sec' ? o.leadSec : o.leadTan, body: '', extra: ruleHtml(t) });
    return;
  }
  const f = G.bigD, n = G.smallD, g = fmt(G.ang);
  lab.setReadout(`${g}°`, named ? w.sx.out(f, n) : w.sub.out(f, n), t.zone.out, AMBER);
  let stt;
  if (!st.moved && st.guess !== null) {
    const ok = st.guess === R.ok;
    stt = { emo: ok ? '✅' : '🤔', title: ok ? t.ok : w.no(R.opts[st.guess]), lead: ok ? w.txt.out(f, n, g) : w.noLead(g), body: (named ? w.fx.out(f, n, g) + ' ' : '') + o.body };
  } else stt = { emo: '↗️', title: w.title.out, lead: w.txt.out(f, n, g), body: named ? w.fx.out(f, n, g) : '' };
  lab.setState({ ...stt, extra: ruleHtml(t) });
}

function plotSvg(a, b, y, best, angBest) {
  const x0 = 10, x1 = 290, X = (m) => x0 + (m - 1) / 51 * (x1 - x0), Y = (an) => 74 - (an / angBest) * 58;
  let d = '';
  for (let m = 1; m <= 52.01; m += 1) d += `${m === 1 ? 'M' : 'L'}${X(m).toFixed(1)} ${Y(gAngle(m, a, b)).toFixed(1)}`;
  return `<svg viewBox="0 0 300 84" role="img" aria-hidden="true"><line x1="${x0}" y1="74" x2="${x1}" y2="74" stroke="rgba(130,145,190,.4)"/>
    <line x1="${X(best).toFixed(1)}" y1="8" x2="${X(best).toFixed(1)}" y2="74" stroke="${GOLD}" stroke-dasharray="3 4" opacity=".7"/>
    <path d="${d}" fill="none" stroke="${TEAL}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${X(y).toFixed(1)}" cy="${Y(gAngle(y, a, b)).toFixed(1)}" r="5.5" fill="${ROSE}" stroke="#fff" stroke-width="1.5"/></svg>`;
}
function renderGoal() {
  const t = T[lang], gt = t.g, g = S.g, stat = S.sec === 'statue';
  lab.setGlow(stat ? 'rgba(160, 130, 255, .2)' : 'rgba(61, 220, 151, .2)');
  const [a, b] = stat ? [ST_A, ST_B] : gAB(g.off), best = Math.sqrt(a * b), angBest = gAngle(best, a, b);
  const y = stat ? S.st.x : g.y, ang = gAngle(y, a, b), pred = g.guess === null && !stat;
  setHtml($('secGoal'), `${lang}|${stat ? 's' + g.guess : pred ? 'p' : 'f' + g.guess}`, () => pred
    ? predBlock(gt.q, gt.opts, g, 2, true)
    : `<div class="sa-sl"><span>${esc(stat ? gt.stSlider : gt.slider)}</span><input type="range" class="big" id="${stat ? 'tSl' : 'gSl'}" min="${stat ? 3 : 10}" max="${stat ? 85 : 520}" step="1"></div>
      <div class="sa-plot" id="gPlot"></div>
      <div class="row2">${stat ? '' : `<span class="lbl">${esc(gt.lineLbl)}</span>${[0, 10, 20].map((o, i) => `<button class="chip sa-chip" data-off="${o}">${esc(gt.lines[i])}</button>`).join('')}`}<button class="chip sa-chip" data-act="best">${esc(gt.bestBtn)}</button></div>
      <div class="row2" id="gSec"></div>${g.guess === null ? '' : `<div style="margin-top:14px">${predBlock(gt.q, gt.opts, g, 2, true)}</div>`}`);
  if (!pred) {
    const sl = $(stat ? 'tSl' : 'gSl'); if (sl && document.activeElement !== sl) sl.value = Math.round(y * 10);
    $('gPlot').innerHTML = stat ? '' : plotSvg(a, b, y, best, angBest);
    setHtml($('gSec'), `${lang}|${S.sec}|${secret.unlocked()}`, () => secChips(t));
    document.querySelectorAll('#secGoal [data-off]').forEach((e) => e.classList.toggle('on', +e.dataset.off === g.off));
  }
  const gaugeOn = !pred;
  $('gauge').style.visibility = gaugeOn ? 'visible' : 'hidden';
  lab.setGauge(gaugeOn ? ang / angBest : 0, gaugeOn ? [{ f: 0, label: '0°' }, { f: 1, label: `${fmt(angBest)}°` }] : [], gaugeOn ? gt.cap : '');
  if (pred) {
    lab.setFacts([{ emo: '🥅', text: t.facts.goal, src: SRC.pitch }, { emo: '🖼️', text: t.facts.puzzle, src: SRC.puzzle }]);
    lab.setReadout('?', '', gt.pillIll, GOLD);
    lab.setState({ emo: '🤔', title: gt.q, lead: gt.lead(fmt(a), fmt(b)), body: '', extra: '' });
    return;
  }
  lab.setFacts([{ emo: '🏉', text: t.facts.rugby, src: SRC.puzzle }, { emo: '📐', text: t.facts.geo, src: SRC.puzzle }, { emo: '🥅', text: t.facts.goal, src: SRC.pitch }]);
  lab.setReadout(`${fmt(ang)}°`, gt.fx(fmt(a), fmt(b), fmt(best)), gt.pillIll, GOLD);
  const atBest = Math.abs(y - best) < 0.25;
  let stt;
  if (stat) stt = atBest ? { emo: '🗿', title: gt.stBest, lead: gt.stBestL, body: gt.fx(fmt(a), fmt(b), fmt(best)) } : { emo: '🗿', title: gt.stTitle(fmt(y)), lead: gt.stFree(fmt(ang), fmt(angBest), fmt(best)), body: gt.stL(fmt(a), fmt(b)) };
  else if (!g.moved && g.off === 0) {
    const ok = g.guess === 2, pick = g.guess === 0 ? FAR_Y : g.guess === 1 ? CLOSE_Y : best;
    stt = { emo: ok ? '✅' : '🤔', title: ok ? t.ok : gt.no, lead: gt.reveal(fmt(best), fmt(angBest)), body: ok ? gt.bodyOk : gt.bodyNo(fmt(pick), fmt(gAngle(pick, a, b)), fmt(best), fmt(angBest)) };
  } else stt = atBest ? { emo: '🥅', title: gt.best, lead: gt.bestL, body: gt.fx(fmt(a), fmt(b), fmt(best)) } : { emo: '🥅', title: gt.title(fmt(y)), lead: gt.free(fmt(ang), fmt(angBest), fmt(best)), body: '' };
  lab.setState({ ...stt, extra: '' });
}

// --- the picture ---------------------------------------------------------------------------------------------
canvasLoop(cv, (c, w, h, dt, time) => {
  if (stepTweens(dt)) render();
  const v = lab.view;
  if (v === 'walk') { const R = W_ROUNDS[S.w.r]; drawCircle(c, w, h, time, S.w, R.cfg, 'sec', S.w.guess !== null || S.w.skip, S.w.guess === null && !S.w.skip); }
  else if (v === 'outside') { const R = S.o.cur; drawCircle(c, w, h, time, S.o, R.cfg, R.mode, S.o.guess !== null || S.o.skip, S.o.guess === null && !S.o.skip); }
  else if (S.sec === 'statue') drawStatue(c, w, h);
  else drawGoal(c, w, h, time);
});
render();
</script>
</body>
</html>
