// --- scene: the playground swing (secret) ------------------------------------------------------------------

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();

};
function onView() { S.sec = null; render(); }
function logTry() {
  const top = S.log[0], cur = { L: S.L, m: S.mass, a: S.ang };
  if (top.L === cur.L && top.m === cur.m && top.a === cur.a) return;
  let ch = '';
  if (top.L !== cur.L) { ch += 'L'; S.tried.L = true; }
  if (top.m !== cur.m) { ch += 'm'; S.tried.m = true; }
  if (top.a !== cur.a) { ch += 'a'; S.tried.a = true; }
  S.log.unshift({ ...cur, ch }); if (S.log.length > 4) S.log.pop();
}
$('rLen').addEventListener('input', (ev) => { S.L = +ev.target.value; pullTo(S.run); render(); });

$('cLen').addEventListener('input', (ev) => { setClockL(+ev.target.value); });
function setClockL(v) { S.c.L = clamp(Math.round(v * 100) / 100, 0.3, 1.6); S.c.tt = 0; S.c.n = 0; S.c.tickAt = -9; render(); }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, P = S.p;

  else if (act === 'ang') { S.ang = +b.dataset.v; logTry(); pullTo(S.run); sfx.click(); }
  else if (act === 'pred') { S.pred = +b.dataset.i; (S.pred === T[lang].rule.ok ? sfx.good : sfx.bad)(); }
  else if (act === 'pdec') { P.g = clamp(P.g - 1, 0, 40); sfx.tick(); }
  else if (act === 'pinc') { P.g = clamp(P.g + 1, 0, 40); sfx.tick(); }
  else if (act === 'pmain') {
    if (P.ph === 'guess') { P.ph = 'pre'; P.ref.loop = false; startRun(P.tgt, rad(PANG), 0.9); startRun(P.ref, rad(PANG), 0.9); sfx.click(); showStage(); }
    else if (P.ph === 'done') {
      if (P.i < 2) { P.i++; P.g = 9; P.ph = 'guess'; P.cp = 0; P.ref.loop = true; pullTo(P.ref); P.tgt = mkRun({ loop: false }); sfx.click(); }
      else { P.ph = 'end'; sfx.click(); }
    } else if (P.ph === 'end') { P.i = 0; P.g = 9; P.ph = 'guess'; P.cp = 0; P.res = []; P.ref.loop = true; pullTo(P.ref); P.tgt = mkRun({ loop: false }); sfx.click(); }

// --- one render per change: controls, readout and the state card ------------------------------------------

  $('secRow').innerHTML = sc('gal', '💡', t.secrets.a[0]) + sc('swing', '🎠', t.secrets.b[0]);

  $('rMass').innerHTML = [50, 500].map((m) => `<button class="chip ${S.mass === m ? 'on' : ''}" data-act="mass" data-v="${m}">${esc(r.m(m))}</button>`).join('');
  $('rAng').innerHTML = [5, 15, 30].map((a) => `<button class="chip ${S.ang === a ? 'on' : ''}" data-act="ang" data-v="${a}">${a}°</button>`).join('');
  // the prediction appears once all three things were tried; the answer is not in the page before that
  $('rQ').hidden = !all;
  if (all) {
    $('rQ').innerHTML = !ans
      ? `<div class="pd-qt">${esc(r.qT)}</div><div class="pd-opts">${r.opts.map((o, i) => `<button class="pd-o" data-act="pred" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
      : `<div class="pd-v ${S.pred === r.ok ? 'good' : 'bad'}">${esc(S.pred === r.ok ? r.good : r.bad)}</div><div class="pd-r"><b>${esc(r.ruleT)}.</b> ${esc(r.ruleBody)}</div>`;
  }
  $('rLog').innerHTML = `<div class="h">${esc(r.logT)}</div>` + S.log.map((e) => {
    const [a, b, c2, d] = r.logRow(e.L, e.m, e.a, swingsIn10(e.L));
    return `<div class="pd-row"><i class="${e.ch.includes('L') ? 'c' : ''}">${esc(a)}</i><i class="${e.ch.includes('m') ? 'c' : ''}">${esc(b)}</i><i class="${e.ch.includes('a') ? 'c' : ''}">${esc(c2)}</i><i>→</i><i class="n">${esc(d)}</i></div>`;
  }).join('');
  lab.setReadout(String(n), r.sub, r.pill(hf), '#e0b050');
  const fine = `<div class="note">${esc(r.hint)}</div>`;
  if (ans) lab.setState({ emo: S.pred === r.ok ? '✅' : '🤔', title: S.pred === r.ok ? r.good : r.bad, lead: r.ruleBody, body: S.pred === r.ok ? '' : r.try, extra: '' });
  else if (all) lab.setState({ emo: '🤔', title: r.qT, lead: r.qLead, body: '', extra: fine });
  else lab.setState({ emo: '🔬', title: r.t0, lead: r.lead(L, S.mass, S.ang, n), body: r.tried(S.tried.L, S.tried.m, S.tried.a), extra: fine });
  lab.setFacts([t.facts.huygens, t.facts.secs, t.facts.galileo]);
}

function rPredict(t) {
  const p = t.pr, P = S.p, L = ROUNDS[P.i], ph = P.ph, refN = swingsIn10(REF);
  lab.setGlow('rgba(200, 70, 90, .26)');
  const guessing = ph === 'guess';
  $('pL').textContent = p.guess; $('pV').textContent = String(P.g);
  document.querySelectorAll('[data-act=pdec],[data-act=pinc]').forEach((b) => { b.disabled = !guessing; });
  $('pMain').textContent = guessing ? p.go : ph === 'done' ? (P.i < 2 ? p.next : p.fin) : ph === 'end' ? p.again : p.wait;
  $('pMain').disabled = ph === 'pre' || ph === 'run';
  $('pNote').textContent = p.refT(refN);
  if (guessing) {
    lab.setReadout('?', p.round(P.i + 1), '', '#e8556a');
    lab.setState({ emo: '🎭', title: p.q, lead: p.hidden(L), body: '', extra: '' });
  } else if (ph === 'pre' || ph === 'run') {
    lab.setReadout(String(P.tgt.n), p.live, '', '#e8556a');
    lab.setState({ emo: '⏱️', title: p.watch, lead: p.guessed(P.g), body: '', extra: '' });
  } else if (ph === 'done') {
    const e = P.res[P.res.length - 1], d = Math.abs(e.g - e.n), vi = d === 0 ? 0 : d === 1 ? 1 : 2;
    lab.setReadout(String(e.n), p.fin10, p.v[vi], '#e8556a');
    lab.setState({ emo: vi === 0 ? '✅' : vi === 1 ? '👍' : '🤔', title: p.v[vi], lead: p.res(e.g, e.n), body: L < REF ? p.shorter(L) : p.longer(L), extra: '' });
  } else {
    const k = P.res.filter((e) => Math.abs(e.g - e.n) <= 1).length;
    lab.setReadout(`${k}/3`, p.endSub, '', '#e8556a');
    lab.setState({ emo: '🏆', title: p.end(k), lead: p.endLead, body: '', extra: '' });
  }
  lab.setFacts([t.facts.huygens, t.facts.galileo]);
}
function rClock(t) {
  const k = t.ck, C = S.c, hf = half(C.L), on = Math.abs(hf - 1) < 0.015, fast = hf < 1;
  lab.setGlow(on ? 'rgba(61, 220, 151, .28)' : 'rgba(224, 176, 80, .26)');
  $('cLenL').innerHTML = `<span>${esc(k.len)}</span><b>${num(C.L)} ${t.rule.u.m}</b>`;
  $('cLen').value = String(C.L);
  const gain = Math.max(1, Math.round(Math.abs(60 / hf - 60)));
  lab.setReadout(`${num(hf)} ${t.rule.u.s}`, k.sub, on ? k.pill[2] : k.pill[fast ? 0 : 1], on ? '#3ddc97' : '#e0b050');
  const st = on ? k.ok(C.L) : fast ? k.fast(hf, gain) : k.slow(hf, gain);
  lab.setState({ emo: on ? '✅' : fast ? '⏩' : '⏪', title: st.title, lead: st.lead, body: st.body, extra: '' });
  lab.setFacts([t.facts.huygens, t.facts.galileo]);
}

function rGal(t) {
  const g = t.gal, b = num(half(GAL_L) * BEAT, 1);
  lab.setGlow('rgba(255, 190, 90, .28)');
  $('gChips').innerHTML = [8, 28].map((d, i) => `<button class="chip ${S.gal.deg === d ? 'on' : ''}" data-act="gdeg" data-v="${d}">${esc(i ? g.big : g.small)}</button>`).join('');
  $('gAgain').textContent = g.again;
  lab.setReadout(b, g.sub, g.pill[S.gal.deg === 8 ? 0 : 1], '#ffbe5a');
  lab.setState({ emo: '💡', title: g.title, lead: g.lead(b), body: g.body, extra: '' });
  lab.setFacts([t.facts.galileo]);
}

function rSwing(t) {
  const s = t.swg, f = S.sw.fb;
  lab.setGlow('rgba(240, 138, 93, .28)');
  $('wPush').textContent = s.push; $('wRest').textContent = s.rest;
  lab.setReadout(`${Math.round(swAmp())}°`, s.sub, f === 'good' ? s.pill[0] : f === 'bad' ? s.pill[1] : '', '#f08a5d');
  if (f === 'good') lab.setState({ emo: '🎠', title: s.good, lead: s.goodL, body: '', extra: '' });
  else if (f === 'bad') lab.setState({ emo: '🛑', title: s.bad, lead: s.badL, body: '', extra: '' });
  else if (f === 'big') lab.setState({ emo: '😮', title: s.big, lead: s.bigL, body: '', extra: '' });
  else lab.setState({ emo: '🎠', title: s.t0, lead: s.l0, body: '', extra: '' });
  lab.setFacts([]);
}
render();
</script>
