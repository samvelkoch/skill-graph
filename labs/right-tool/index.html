    <div class="rt-q">${esc(t.sQ)}</div>
    <div class="chips">${chipsHtml(part.opts.map((d, i) => ['popt', i, t.dang[d], rev ? (i === part.ok ? 'rt-ok' : i === picked ? 'rt-no' : '') : '', rev ? ' disabled' : '']))}${def.parts.length > 1 ? `<button class="chip rt-c" data-act="npart">${esc(t.next)}</button>` : ''}</div>`;
  const total = (open ? 6 : 4), count = Object.keys(st.pick).filter((k2) => k2.split(':')[0] !== 'power' || open).length;
  const note = tool === 'power' ? `<div class="rt-note">${esc(t.powerNote)}</div>` : '';
  if (!rev) {
    lab.setReadout('?', '', `${count}/${total}`, '#5fa8a0'); lab.setFacts([]);
    lab.setState({ emo: '🤔', title: t.sAsk, lead: t.sAskLead, body: t.tools[tool], extra: note });
  } else {
    const ok = picked === part.ok;
    lab.setReadout(t.parts[part.id], t.dang[part.opts[part.ok]], `${count}/${total}`, '#5fa8a0');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: `${t.parts[part.id]}: ${t.partInfo[part.id]}`, body: `${t.protects} ${t.dang[part.opts[part.ok]]}.`, extra: note });
    const F = part.id === 'saw' ? [] : [{ emo: '💡', text: t.sf[part.id], src: SRCS[{ scissors: 'sci', drill: 'drill', clamp: 'clamp', guard: 'table', riving: 'table' }[part.id]] }];
    if (part.id === 'riving') F.push({ emo: '⚠️', text: t.sf.kick, src: SRCS.table });
    lab.setFacts(F);
  }
}
render();
</script>
