// --- exact decimals: {n, d} means n / 10^d, so 4.8 x 3.1 never meets floating-point noise -----------------------
const P10 = (k) => 10 ** k;
const dec = (s) => { const [i, f = ''] = String(s).split('.'); return { n: parseInt(i + f, 10), d: f.length }; };
const norm = ({ n, d }) => { while (d > 0 && n % 10 === 0) { n /= 10; d--; } return { n, d }; };
const same = (x, y) => { const a = norm(x), b = norm(y); return a.n === b.n && a.d === b.d; };
const mul = (x, y) => ({ n: x.n * y.n, d: x.d + y.d });
const div = (x, y) => {
  const num = x.n * P10(y.d), den = y.n * P10(x.d);
  for (let k = 0; k < 7; k++) { const q = num * P10(k); if (q % den === 0) return { n: q / den, d: k }; }
  return { n: Math.round(num / den), d: 0 };
};
const raw = ({ n, d }) => { const s = String(n).padStart(d + 1, '0'); return d ? `${s.slice(0, -d)}.${s.slice(-d)}` : s; };
const clean = (x) => raw(norm(x));
const val = (x) => x.n / P10(x.d);
const lt1 = (x) => x.n < P10(x.d);
const bigger = (x, y) => x.n * P10(y.d) > y.n * P10(x.d);
// round to one significant digit, halves go up: 4.8 -> 5, 3.1 -> 3, 25 -> 30, 0.52 -> 0.5
const est1 = (x) => { const u = P10(String(x.n).length - 1); return { n: u > 1 ? Math.floor((x.n + u / 2) / u) * u : x.n, d: x.d }; };
const cents = (x) => (x.d <= 2 ? x.n * P10(2 - x.d) : x.n / P10(x.d - 2));
const moneyRaw = (c) => `${Math.floor(c / 100)}.${String(c % 100).padStart(2, '0')}`;
const CIRC = '⓪①②③④⑤⑥⑦⑧⑨';
const stev = (s) => { const [i, f = ''] = String(s).split('.'); return i + CIRC[0] + [...f].map((ch, k) => ch + CIRC[k + 1]).join(''); };

// --- the rounds (all numbers computed from the factors) ----------------------------------------------------------
// Place: the calculator shows only the digits of the product; pt = how many digits stand before the point
const R1 = [['4.8', '3.1'], ['0.6', '0.4'], ['25', '0.2'], ['1.9', '5.2'], ['0.37', '6'], ['3.9', '0.52']].map(([a, b]) => {
  const A = dec(a), B = dec(b), pr = mul(A, B), dg = String(pr.n), ea = est1(A), eb = est1(B), e = mul(ea, eb);
  return { a, b, A, B, pr, dg, len: dg.length, pt: dg.length - pr.d, ea, eb, e, easy: same(e, pr) };
});
// Divide: the digits shown (a trailing zero is kept on purpose), the estimate uses friendlier numbers ed and eb
const R2 = [['7.2', '0.3', '240', '6', '0.3'], ['4.8', '0.6', '80', '5', '0.5'], ['0.84', '4', '21', '0.8', '4'], ['4.5', '5', '9', '5', '5'], ['3.6', '0.04', '90', '4', '0.04']].map(([a, b, dg, ed, eb]) => {
  const A = dec(a), B = dec(b), q = div(A, B), len = dg.length, N = parseInt(dg, 10), E = div(dec(ed), dec(eb));
  let pt = 0; const opts = [];
  for (let p = 0; p <= len; p++) { const x = { n: N, d: len - p }; opts.push({ p, s: clean(x) }); if (same(x, q)) pt = p; }
  return { a, b, A, B, q, dg, len, pt, opts, ed, eb, E, ev: dec(ed), ebd: dec(eb) };
});

const RC = [
  { wrong: 2, kind: -1, lines: [['apple', '2.4', '1.2'], ['carrot', '0.8', '0.5'], ['potato', '1.2', '3'], ['cheese', '8.2', '0.4'], ['banana', '1.9', '2.1'], ['tomato', '3.1', '0.9']] },
  { wrong: 3, kind: 1, lines: [['pear', '2.2', '1.8'], ['grape', '4.9', '0.6'], ['lemon', '3.5', '2'], ['cucumber', '1.4', '2.5'], ['peach', '3.8', '1.2'], ['cheese', '8.2', '4.5']] },
  { wrong: 1, kind: -1, lines: [['lemon', '3.2', '0.7'], ['grape', '5.5', '0.8'], ['apple', '2.1', '2.2'], ['carrot', '0.8', '0.6'], ['cheese', '9.4', '0.3'], ['banana', '1.2', '1.5']] },
].map((r) => {
  const lines = r.lines.map(([k, p, q], i) => {
    const P = dec(p), Q = dec(q), tr = mul(P, Q), pr = i === r.wrong ? { n: tr.n, d: tr.d - r.kind } : tr;
    const ep = est1(P), eq = est1(Q);
    return { k, p, q, ep, eq, e: mul(ep, eq), tc: cents(tr), pc: cents(pr) };
  });
  return { wrong: r.wrong, lines, tt: lines.reduce((s, l) => s + l.tc, 0), pt: lines.reduce((s, l) => s + l.pc, 0) };
});

    c.beginPath(); c.arc(x, 352, Math.max(0, 8 * rr), 0, Math.PI * 2); c.fillStyle = g; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#0c0e1a'; c.stroke();
  };
  const gcol = !s.checked ? ORANGE : good ? GREEN : RED;
  const gtxt = M(clean({ n: N, d: r.len - Math.round(an.pf) }));
  if (!bad) { stem(xg, gcol, 1); pill(c, gtxt, xg, 330, 'rgba(14,17,28,.88)', '#fff'); return; }
  const xt = lx(Math.log10(val(r.pr))), near = Math.abs(xg - xt) < 62;
  stem(xg, gcol, 1); stem(xt, GREEN, rev);
  const gl = near ? (xg < xt ? xg - 34 : xg + 34) : xg, tl = near ? (xg < xt ? xt + 34 : xt - 34) : xt;
  pill(c, gtxt, gl, 330, 'rgba(229,72,77,.92)', '#fff');
  c.globalAlpha = rev; pill(c, M(clean(r.pr)), tl, 330, 'rgba(22,154,98,.95)', '#fff'); c.globalAlpha = 1;
  drawEst(c, r.e);
}
function drawEst(c, e) {
  const xe = lx(Math.log10(val(e))), a = ease(S.an.rev);
  c.save(); c.globalAlpha = a; c.translate(xe, LY); c.rotate(Math.PI / 4);
  c.fillStyle = '#ffcf5a'; c.strokeStyle = '#0c0e1a'; c.lineWidth = 1.5; c.beginPath(); c.rect(-6, -6, 12, 12); c.fill(); c.stroke(); c.restore();
  c.globalAlpha = a; pill(c, `≈ ${M(clean(e))}`, xe, 416, 'rgba(255,207,90,.95)', '#2a1d05'); c.globalAlpha = 1;
}
// Place: the guess is drawn from the start; the estimate and the true place only after Check (drawEst is called from drawLine)
function drawLineAll(c, r) {
  drawLine(c, r);
  if (S.v1.checked && S.v1.p === r.pt) drawEst(c, r.e);
}
// Divide: the dividend as a bar; the pieces appear only after the answer
function drawBar(c, r) {
  const s = S.v2, BX = 30, BW = 280, BY = 356, BH = 34, rev = ease(S.an.rev), A = val(r.A), B = val(r.B), pieces = B < 1, qv = val(r.q);
  const N = pieces ? Math.round(qv) : Math.round(B);
  const g = c.createLinearGradient(0, BY, 0, BY + BH); g.addColorStop(0, '#72d6c6'); g.addColorStop(1, '#2d8c83');
  c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 10; c.shadowOffsetY = 4; c.beginPath(); c.roundRect(BX, BY, BW, BH, 10); c.fillStyle = g; c.fill(); c.restore();
  c.save(); c.beginPath(); c.roundRect(BX, BY, BW, BH, 10); c.clip();
  if (s.checked) {
    const upto = rev * N;
    for (let i = 0; i < N; i++) {
      if (i + 1 > upto + 0.001) break;
      const x = BX + (BW / N) * i;
      if (N <= 40 && i % 2 === 1) { c.fillStyle = 'rgba(255,255,255,.16)'; c.fillRect(x, BY, BW / N, BH); }
      if (i > 0) { c.strokeStyle = N > 40 ? 'rgba(10,40,36,.45)' : 'rgba(10,40,36,.7)'; c.lineWidth = N > 40 ? 0.8 : 1.5; c.beginPath(); c.moveTo(x, BY); c.lineTo(x, BY + BH); c.stroke(); }
    }
  }
  c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(BX, BY, BW, 8);
  c.restore();
  c.lineWidth = 1.5; c.strokeStyle = '#0c0e1a'; c.beginPath(); c.roundRect(BX, BY, BW, BH, 10); c.stroke();
  pill(c, M(r.a), BX + BW / 2, 334, 'rgba(14,17,28,.88)', '#fff');
  if (pieces) {
    const pw = (BW * B) / A;
    c.strokeStyle = '#ffd58a'; c.lineWidth = 2; c.lineJoin = 'round'; c.beginPath();
    c.moveTo(BX, BY + BH + 5); c.lineTo(BX, BY + BH + 12); c.lineTo(BX + pw, BY + BH + 12); c.lineTo(BX + pw, BY + BH + 5); c.stroke();
    pill(c, M(r.b), BX, 424, 'rgba(255,213,138,.96)', '#241a08', 'left');
    if (s.checked) { c.globalAlpha = rev; pill(c, `= ${M(clean(r.q))}`, BX + BW, 424, 'rgba(22,154,98,.95)', '#fff', 'right'); c.globalAlpha = 1; }
  } else if (s.checked) {
    c.globalAlpha = rev; c.font = `900 ${fs(15)}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#d4f5ee';
    for (let i = 0; i < N; i++) c.fillText(M(clean(r.q)), BX + (BW / N) * (i + 0.5), BY + BH + 24);
    c.globalAlpha = 1;
  }
}

canvasLoop($('cv'), (c, w, h, dt) => {
  const v = lab.view, an = S.an, s1 = S.v1;
  an.pf += (s1.p - an.pf) * Math.min(1, dt * 14);
  if (isChecked(v)) an.rev = Math.min(1, an.rev + dt / 0.7); else an.rev = 0;
  bg(c, w, h, v === 'shop');
  if (v === 'shop') return;
  const k = Math.min(w / DW, h / DH);
  G.k = k; G.ox = (w - DW * k) / 2; G.oy = (h - DH * k) / 2;
  c.save(); c.translate(G.ox, G.oy); c.scale(k, k); c.lineJoin = 'round';
  if (v === 'place') { const r = cur1(); drawCalc(c, v, r); drawLineAll(c, r); }
  else { const r = cur2(); drawCalc(c, v, r); drawBar(c, r); }
  c.restore();
});

// --- dragging the point on the screen -------------------------------------------------------------------------------
const cv = $('cv');
let drag = false;
const toDesign = (ev) => { const b = cv.getBoundingClientRect(); return [(ev.clientX - b.left - G.ox) / G.k, (ev.clientY - b.top - G.oy) / G.k]; };
function setSlot(p) {
  const s = S.v1; p = clamp(p, 0, cur1().len);
  if (p === s.p && s.moved) return;
  if (p !== s.p) { s.p = p; sfx.tick(); }
  s.moved = true; S.secShow = false; render();
}
const slotAt = (x, y, mode) => { // mode 'screen': read the slot off the digits; 'line': off the number line (a power of ten per mark)
  const r = cur1();
  if (mode === 'screen') return Math.round((x - (SX - r.len * CW)) / CW);
  return Math.round(r.len + (LOG0 + ((x - LX0) / LW) * LDEC) - Math.log10(parseInt(r.dg, 10)));
};
let dragMode = null;
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'place' || S.v1.checked || S.v1.i >= R1.length) return;
  const [x, y] = toDesign(ev);
  dragMode = y >= 10 && y <= 150 ? 'screen' : y >= 316 && y <= 386 ? 'line' : null;
  if (!dragMode) return;
  drag = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* pointer already gone */ }
  setSlot(slotAt(x, y, dragMode));
});
cv.addEventListener('pointermove', (ev) => { if (drag) { const [x, y] = toDesign(ev); setSlot(slotAt(x, y, dragMode)); } });
['pointerup', 'pointercancel'].forEach((n) => cv.addEventListener(n, () => { drag = false; }));

// --- actions -------------------------------------------------------------------------------------------------------
const showStage = () => { // on a phone the controls sit below the picture: bring the reveal into view
  const b = $('stage').getBoundingClientRect();
  if (b.top < 0 || b.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function startRound1() { const s = S.v1; if (s.i < R1.length) { s.p = R1[s.i].len; s.moved = false; s.checked = false; S.an.pf = s.p; } }
function mainP() {
  const s = S.v1, r = cur1();
  if (s.i >= R1.length) { S.v1 = { i: 0, p: R1[0].len, moved: false, checked: false, ok: [] }; S.an.pf = R1[0].len; sfx.click(); return; }
  if (!s.checked) { if (!s.moved) return; const ok = s.p === r.pt; s.ok[s.i] = ok; s.checked = true; (ok ? sfx.good : sfx.bad)(); showStage(); }
  else { s.i++; startRound1(); sfx.click(); }
}
function mainD() {
  const s = S.v2;
  if (s.i >= R2.length) { S.v2 = { i: 0, pick: null, checked: false, ok: [] }; sfx.click(); return; }
  if (s.checked) { s.i++; s.pick = null; s.checked = false; sfx.click(); }
}
function pickD(p) {
  const s = S.v2, r = cur2();
  if (s.checked || s.i >= R2.length) return;
  s.pick = p; s.checked = true; s.ok[s.i] = p === r.pt; (p === r.pt ? sfx.good : sfx.bad)(); showStage();
}
function mainS() {
  const s = S.v3;
  if (s.i >= RC.length) { S.v3 = { i: 0, sel: null, flag: null, checked: false, ok: [] }; sfx.click(); return; }
  if (s.checked) { s.i++; s.sel = null; s.flag = null; s.checked = false; sfx.click(); }
}
function flagS() {
  const s = S.v3, rc = cur3();
  if (s.checked || s.sel === null || s.i >= RC.length) return;
  s.flag = s.sel; s.checked = true; s.ok[s.i] = s.flag === rc.wrong; (s.ok[s.i] ? sfx.good : sfx.bad)(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a !== 'sec') S.secShow = false;
  if (a === 'left') setSlot(S.v1.p - 1);
  else if (a === 'right') setSlot(S.v1.p + 1);
  else if (a === 'mainP') mainP();
  else if (a === 'opt') pickD(+b.dataset.p);
  else if (a === 'mainD') mainD();
  else if (a === 'flag') flagS();
  else if (a === 'mainS') mainS();
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.secShow = !!S.sec; S.flip = S.sec === 'comma'; sfx.click();
  }
  render();
});
$('shop').addEventListener('click', (ev) => {
  const b = ev.target.closest('.de-row'); if (!b || b.disabled || S.v3.checked || S.v3.i >= RC.length) return;
  S.v3.sel = +b.dataset.i; S.secShow = false; sfx.tick(); render();
});

// --- rendering -----------------------------------------------------------------------------------------------------
function secCard(t, now, fin) { // the two secret experiments; `now` is the number to write Stevin's way (or null)
  if (S.sec === 'comma') return { emo: '🔤', title: comma() ? t.sc.cT : t.sc.pT, lead: t.sc.cLead, body: t.sc.cBody, extra: `<div class="fine">${esc(t.sc.cSrc)}</div>` };
  return { emo: '📖', title: t.sc.sT, lead: t.sc.sLead, body: now ? t.sc.sNow(stev(now), fin) : '', extra: `<div class="fine">${esc(t.sc.sSrc)}</div>` };
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('sP').hidden = v !== 'place'; $('sD').hidden = v !== 'divide'; $('sS').hidden = v !== 'shop';
  const open = secret.unlocked();
  $('secRow').innerHTML = [['comma', '🔤'], ['stevin', '📖']].map(([k, e]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('aL').setAttribute('aria-label', t.arrL); $('aR').setAttribute('aria-label', t.arrR);
  if (v === 'place') renderPlace(t); else if (v === 'divide') renderDivide(t); else renderShop(t);
}
const dots = (i, n, ok) => Array.from({ length: n }, (_, k) => (k < i ? (ok[k] ? '●' : '○') : k === i ? '◉' : '·')).join(' ');

function renderPlace(t) {
  const s = S.v1, end = s.i >= R1.length, r = cur1(), k = s.ok.filter(Boolean).length, p = t.pl;
  lab.setGlow('rgba(240, 138, 36, .24)');
  $('qP').textContent = end ? '' : p.q(M(r.a), M(r.b));
  $('qP').hidden = end; $('aL').hidden = end || s.checked; $('aR').hidden = end || s.checked;
  $('aL').disabled = s.p <= 0; $('aR').disabled = s.p >= r.len;
  $('bP').textContent = end ? t.again : s.checked ? t.nxt : t.chk; $('bP').disabled = !end && !s.checked && !s.moved;
  const g = { n: parseInt(r.dg, 10), d: r.len - s.p };
  let st;
  if (end) {
    lab.setReadout(`${k}/${R1.length}`, dots(s.i, R1.length, s.ok), '', '#f08a24');
    st = { emo: '🏁', title: p.endT(k, R1.length), lead: p.endLead, body: '', extra: '' };
  } else if (!s.checked) {
    lab.setReadout(s.moved ? M(clean(g)) : '?', `${M(r.a)} × ${M(r.b)}`, `${s.i + 1}/${R1.length}`, '#f08a24');
    st = { emo: '🔧', title: p.st, lead: p.lead(r.dg), body: p.how, extra: '' };
  } else {
    const ok = s.p === r.pt, tr = M(clean(r.pr)), a = M(r.a), b = M(r.b);
    lab.setReadout(tr, `${a} × ${b}`, `${s.i + 1}/${R1.length}`, ok ? '#3ddc97' : '#e5484d');
    const small = [r.A, r.B].filter((x) => bigger(x, r.pr)).map((x) => M(clean(x)));
    const shrink = (lt1(r.A) || lt1(r.B)) && small.length ? (small.length === 2 ? p.sh2(tr, small[0], small[1]) : p.sh1(tr, small[0])) : '';
    const lead = r.easy ? p.easy(a, b, tr) : p.est(a, b, M(clean(r.ea)), M(clean(r.eb)), M(clean(r.e)));
    const body = (r.easy ? '' : p.near(M(clean(r.e)), tr)) + (shrink ? ` ${shrink}` : '');
    st = { emo: ok ? '✅' : '🤔', title: ok ? t.ok : p.no(M(clean(g))), lead, body: body.trim(), extra: '' };
  }
  if (S.sec && S.secShow) st = secCard(t, end || (!s.moved && !s.checked) ? null : clean(s.checked ? r.pr : g), s.checked);
  lab.setState(st); lab.setFacts(t.facts.place);
}

function renderDivide(t) {
  const s = S.v2, end = s.i >= R2.length, r = cur2(), k = s.ok.filter(Boolean).length, d = t.dvd;
  lab.setGlow('rgba(79, 179, 166, .24)');
  $('qD').textContent = end ? '' : d.q(M(r.a), M(r.b), r.dg); $('qD').hidden = end;
  $('optsD').innerHTML = end ? '' : r.opts.map((o) => `<button class="de-opt ${s.checked ? (o.p === r.pt ? 'good' : o.p === s.pick ? 'bad' : '') : ''}" data-act="opt" data-p="${o.p}"${s.checked ? ' disabled' : ''}>${esc(M(o.s))}</button>`).join('');
  $('bD').hidden = !end && !s.checked; $('bD').textContent = end ? t.again : t.nxt;
  let st;
  if (end) {
    lab.setReadout(`${k}/${R2.length}`, dots(s.i, R2.length, s.ok), '', '#4fb3a6');
    st = { emo: '🏁', title: t.pl.endT(k, R2.length), lead: d.endLead, body: '', extra: '' };
  } else if (!s.checked) {
    lab.setReadout('?', `${M(r.a)} ${t.dv} ${M(r.b)}`, `${s.i + 1}/${R2.length}`, '#4fb3a6');
    st = { emo: '🔧', title: t.pl.st, lead: d.lead, body: '', extra: '' };
  } else {
    const ok = s.pick === r.pt, qs = M(clean(r.q)), a = M(r.a), b = M(r.b), up = lt1(r.B), parts = Math.round(val(r.B));
    lab.setReadout(qs, `${a} ${t.dv} ${b}`, `${s.i + 1}/${R2.length}`, ok ? '#3ddc97' : '#e5484d');
    const pickS = M(r.opts.find((o) => o.p === s.pick).s);
    st = { emo: ok ? '✅' : '🤔', title: ok ? t.ok : t.pl.no(pickS), lead: d.est(a, b, M(r.ed), M(r.eb), M(clean(r.E))),
      body: `${up ? d.up(qs, a) : d.down(qs, a)} ${up ? d.fit(b, a, qs) : d.share(a, parts, qs)}`, extra: '' };
  }
  if (S.sec && S.secShow) st = secCard(t, s.checked && !end ? clean(r.q) : null, true);
  lab.setState(st); lab.setFacts(t.facts.divide);
}

function renderShop(t) {
  const s = S.v3, end = s.i >= RC.length, rc = cur3(), chk = s.checked || end, k = s.ok.filter(Boolean).length, sh = t.shop;
  lab.setGlow('rgba(224, 176, 80, .24)');
  $('qS').textContent = end ? '' : sh.q; $('qS').hidden = end;
  $('bF').hidden = chk; $('bF').textContent = sh.flag; $('bF').disabled = s.sel === null;
  $('bS').hidden = !chk; $('bS').textContent = end ? t.again : t.nxt;
  const name = (l) => t.items[l.k], estS = (l) => sh.est(M(l.p), M(l.q), M(clean(l.ep)), M(clean(l.eq)), M(clean(l.e)));
  const rows = rc.lines.map((l, i) => {
    const culprit = chk && i === rc.wrong, flagged = chk && !end && i === s.flag && i !== rc.wrong, sel = !chk && s.sel === i;
    const cls = culprit ? 'cul' : flagged ? 'fine-ok' : sel ? 'sel' : '';
    return `<button class="de-row ${cls}" data-i="${i}"${chk ? ' disabled' : ''}><span class="nm">${EMO[l.k]} ${esc(name(l))}</span><span>${esc(M(l.p))} × ${esc(M(l.q))}</span><span class="am">${esc(money(l.pc))}</span></button>`
      + (sel ? `<div class="de-est">${esc(estS(l))}</div>` : '')
      + (culprit ? `<div class="de-fix">${esc(sh.fix(money(l.tc)))}</div>` : '')
      + (flagged ? `<div class="de-fix ok">${esc(sh.fixOk(money(l.tc)))}</div>` : '');
  }).join('');
  $('shop').innerHTML = `<div class="rcw"><div class="rc"><div class="rc-h"><b>${esc(sh.head)}</b><span>${esc(sh.cols)}</span></div>${rows}
    <div class="rc-t"><span>${esc(sh.tot)}</span><b>${esc(money(chk ? rc.tt : rc.pt))}</b></div></div></div>`;
  let st;
  if (end) {
    lab.setReadout(`${k}/${RC.length}`, dots(s.i, RC.length, s.ok), '', '#e0b050');
    st = { emo: '🏁', title: t.pl.endT(k, RC.length), lead: sh.endLead, body: '', extra: '' };
  } else if (!s.checked) {
    lab.setReadout(money(rc.pt), sh.subA, `${s.i + 1}/${RC.length}`, '#e0b050');
    const l = s.sel === null ? null : rc.lines[s.sel];
    st = l ? { emo: '🔎', title: name(l), lead: estS(l), body: sh.cmp(money(l.pc)), extra: '' } : { emo: '🧾', title: sh.q, lead: sh.lead, body: '', extra: '' };
  } else {
    const ok = s.flag === rc.wrong, w = rc.lines[rc.wrong], f = rc.lines[s.flag];
    lab.setReadout(money(rc.tt), sh.subB, `${s.i + 1}/${RC.length}`, ok ? '#3ddc97' : '#e5484d');
    st = ok ? { emo: '✅', title: sh.okT, lead: sh.okLead(name(w), estS(w), money(w.pc)), body: sh.okBody(money(w.tc), money(rc.tt), money(rc.pt)), extra: '' }
      : { emo: '🤔', title: sh.noT, lead: sh.noLead(name(f), estS(f), money(f.pc)), body: sh.noBody(name(w), estS(w), money(w.pc), money(w.tc)), extra: '' };
  }
  if (S.sec && S.secShow) st = secCard(t, null, false);
  lab.setState(st); lab.setFacts(t.facts.shop);
}
render();
