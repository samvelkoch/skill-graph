  <div id="secSame"><div id="askSame" class="ob-ask"></div><div class="row2" style="margin-top:0"><span class="lbl" id="noteLbl"></span><div class="chips" id="noteChips"></div></div>
    <div class="chips" id="insChips" style="margin-top:10px"></div></div>
  <div id="secA"><div class="ob-hint" id="aHint"></div><input type="range" class="big" id="fpR" min="0" max="750" value="0" style="--track:linear-gradient(90deg,#b5652b,#f2c14e)">
    <div class="ends"><span id="aL"></span><span id="aR"></span></div></div>
  <div id="secB"><div class="ob-hint" id="bHint"></div><div class="chips" id="bChips"></div></div>
  <div class="row2" id="secChips"></div></div>`;
$('obSnd').onclick = () => $('sound').click();
$('sound').addEventListener('click', () => render());
$('fpR').addEventListener('input', (ev) => { S.fp = clamp(+ev.target.value / 1000, 0, 0.75); glide(pitchA()); renderTop(); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, v = b.dataset.v;
  if (a === 'fam') { S.fam = v; S.sel = null; S.picked = true; sfx.click(); }
  else if (a === 'szfam') { S.famSz = v; S.sizeSel = null; clearTm(); S.play = null; sfx.click(); }
  else if (a === 'szask') {
    warm(); S.sizeAns = v; (v === 'bass' ? sfx.good : sfx.bad)(); S.famSz = 'str'; S.sizeSel = null; showStage();
    S.tm.push(setTimeout(() => playSeq(SZ.str, (id) => { if (lab.view === 'size' && S.famSz === 'str' && !S.sec) tapSize(id); }), 700));
  } else if (a === 'szall') { warm(); const fam = S.famSz; playSeq(SZ[fam], (id) => { if (lab.view === 'size' && S.famSz === fam && !S.sec) tapSize(id); }); }
  else if (a === 'sameask') {
    warm(); S.sameAns = +v; (v === '1' ? sfx.good : sfx.bad)(); showStage();
    S.sameSel = 'violin'; startPlay('violin', 'strings', [S.note], 1.2, 1.0);
    S.tm.push(setTimeout(() => { if (lab.view === 'same' && !S.sec) { S.sameSel = 'flute'; startPlay('flute', 'flute', [S.note], 1.2, 1.0); render(); } }, 1500));
  } else if (a === 'note') { S.note = +v; sfx.tick(); if (S.sameSel && S.sameSel !== 'voice') tapSame(S.sameSel); }
  else if (a === 'sameins') { tapSame(v); return; }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    stopGlide(); clearTm(); S.play = null; S.secPlay = null; S.secSel = null; S.drag = false;
    S.sec = S.sec === v ? null : v; if (S.sec === 'A') { S.fp = 0; $('fpR').value = 0; } sfx.click();
  } else if (a === 'bsec') { tapSec(v); return; }
  render();
});

// --- render: controls, readout and the state card -------------------------------------------------------------
const chip = (a, v, label, on, extra = '') => `<button class="chip ob-c ${on ? 'on' : ''}" type="button" data-a="${a}" data-v="${v}"${extra}>${label}</button>`;
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' + sec : v;
  $('obSnd').textContent = t.snd; $('obSnd').hidden = soundOn();
  $('secStage').hidden = !!sec || v !== 'stage'; $('secSize').hidden = !!sec || v !== 'size'; $('secSame').hidden = !!sec || v !== 'same';
  $('secA').hidden = sec !== 'A'; $('secB').hidden = sec !== 'B';
  const open = secret.unlocked();
  $('secChips').innerHTML = [['A', '🎻'], ['B', '🥁']].map(([k, e]) => `<button class="chip secret ob-c ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" type="button" data-a="sec" data-v="${k}">${open ? `${e} ${esc(t.secrets[k.toLowerCase()][0])}` : '🔒 ???'}</button>`).join('');
  lab.setFacts(t.facts[v]);
  if (sec === 'A') { $('aHint').textContent = t.sa.hint; $('aL').textContent = t.sa.ends[0]; $('aR').textContent = t.sa.ends[1]; $('fpR').setAttribute('aria-label', t.sa.string); lab.setGlow('rgba(242, 193, 78, .26)'); renderTop(); return; }
  if (sec === 'B') {
    $('bHint').textContent = t.sb.hint;
    $('bChips').innerHTML = SECS.map((s) => `<button class="chip ob-c ${S.secSel === s.id ? 'on' : ''}" type="button" data-a="bsec" data-v="${s.id}"><span style="color:${FCOL[s.fam]}">●</span> ${esc(secName(s))}</button>`).join('');
    lab.setGlow('rgba(255, 143, 107, .24)'); renderTop(); return;
  }
  if (v === 'stage') renderStage(t); else if (v === 'size') renderSize(t); else renderSame(t);
}
function renderTop() { // readout and state card of the secrets, light enough to call while dragging
  const t = T[lang], sec = S.sec;
  if (sec === 'A') {
    const f = pitchA(), oct = Math.abs(S.fp - 0.5) < 0.02;
    lab.setReadout(`${Math.round(f)} Hz`, noteName(f), `×${(1 / (1 - S.fp)).toFixed(2)}`, '#f2c14e');
    lab.setState({ emo: '🎻', title: t.secrets.a[0], lead: S.fp < 0.02 ? t.sa.s0 : oct ? t.sa.s1 : t.sa.s2, body: '', extra: '' });
  } else if (sec === 'B') {
    const s = SECS.find((x) => x.id === S.secSel);
    lab.setReadout('🥁', s ? secName(s) : t.secrets.b[0], '', '#ff8f6b');
    lab.setState({ emo: '🥁', title: t.secrets.b[0], lead: t.sb.bal, body: '', extra: '' });
  }
}
function renderStage(t) {
  const fam = S.fam;
  lab.setGlow('rgba(190, 50, 60, .3)');
  $('famChips').innerHTML = FAMS.map((f) => chip('fam', f, `${FEMO[f]} ${esc(t.fam[f])}`, f === fam)).join('');
  const h = t.how2[fam];
  $('howT').textContent = h[0]; $('howP').textContent = h[1];
  if (S.sel) lab.setReadout(esc(t.ins[S.sel]), `${t.fam[INS[S.sel].fam]}`, '', FCOL[fam]); else lab.setReadout('♪', t.tap, '', FCOL[fam]);
  lab.setState({ emo: FEMO[fam], title: h[0], lead: h[1], body: h[2], extra: '' });
}
function renderSize(t) {
  const fam = S.famSz, pred = fam === 'str' && S.sizeAns === null, ans = S.sizeAns, z = t.size;
  lab.setGlow('rgba(242, 193, 78, .26)');
  $('szChips').innerHTML = [['str', 'str'], ['brass', 'brass'], ['wood', 'wood']].map(([k, f]) => chip('szfam', k, `${FEMO[f]} ${esc(t.fam[f])}`, k === fam)).join('');
  $('szAll').textContent = z.all; $('szAll').dataset.a = 'szall'; $('szAll').parentElement.hidden = pred;
  const ask = $('askSize');
  if (pred) {
    ask.hidden = false;
    ask.innerHTML = `<div class="ob-q">${esc(z.q)}</div><div class="ob-opts">${ASK_SIZE_ORDER.map((id) => `<button class="ob-opt" type="button" data-a="szask" data-v="${id}">${esc(t.ins[id])}</button>`).join('')}</div>`;
  } else if (fam === 'str') {
    ask.hidden = false;
    ask.innerHTML = `<div class="ob-verdict" style="color:${ans === 'bass' ? 'var(--ok)' : 'var(--wip)'}">${esc(ans === 'bass' ? z.right : z.wrong)}</div><p class="ob-lead">${esc(z.lead)}</p>`;
  } else { ask.hidden = true; ask.innerHTML = ''; }
  if (pred) {
    lab.setReadout('?', '', '', '#f2c14e');
    lab.setState({ emo: '🤔', title: z.q, lead: z.look, body: '', extra: '' });
  } else {
    const s = S.sizeSel;
    if (s) lab.setReadout(`${INS[s].hz} Hz`, `${z.lowest} · ${INS[s].note}`, t.ins[s], INS[s].col); else lab.setReadout('♪', z.tapSz, '', '#f2c14e');
    lab.setState({ emo: '📏', title: z.t[fam], lead: z.l[fam], body: '', extra: '' });
  }
}
function renderSame(t) {
  const z = t.same, ans = S.sameAns, f = S.note, nm = NOTES.find((n) => n[1] === f)[0];
  lab.setGlow('rgba(255, 143, 107, .24)');
  $('noteLbl').textContent = z.note;
  $('noteChips').innerHTML = NOTES.map(([n, hz]) => chip('note', hz, n, hz === f)).join('');
  $('insChips').innerHTML = SAME_IDS.map((id) => chip('sameins', id, esc(t.ins[id]), S.sameSel === id && ans !== null, ans === null ? ' disabled' : '')).join('');
  const ask = $('askSame');
  if (ans === null) {
    ask.innerHTML = `<div class="ob-q">${esc(z.q)}</div><div class="ob-opts">${z.opts.map((o, i) => `<button class="ob-opt" type="button" data-a="sameask" data-v="${i}">${esc(o)}</button>`).join('')}</div>`;
    lab.setReadout(nm, `${f} ${z.hz}`, '', '#ff8f6b');
    lab.setState({ emo: '🤔', title: z.q, lead: z.lead0, body: '', extra: '' });
  } else {
    const ok = ans === 1;
    ask.innerHTML = `<div class="ob-verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? z.right : z.wrong)}</div><p class="ob-lead">${esc(z.t)}</p><div class="ob-opts">${z.opts.map((o, i) => `<button class="ob-opt ${i === 1 ? 'good' : i === ans ? 'bad' : ''}" type="button" disabled>${esc(o)}</button>`).join('')}</div>`;
    const s = S.sameSel;
    lab.setReadout(nm, `${f} ${z.hz}`, s ? t.ins[s] : '', s && INS[s] ? INS[s].col : '#ff8f6b');
    lab.setState({ emo: '🎨', title: z.t, lead: s ? z.per[s] : z.l, body: s ? z.l : '', extra: '' });
  }
}

// --- the small icon "how the sound is made" ----------------------------------------------------------------
canvasLoop($('ico'), (c, w, h, dt, time) => {
  try {
    const fam = S.fam, col = FCOL[fam], p = S.play, on = p && INS[p.id] && INS[p.id].fam === fam && time - p.t0 < p.freqs.length * p.step + 0.4;
    const A = on ? 1 : 0.5, mid = h / 2;
    c.lineCap = 'round'; c.lineJoin = 'round';
    if (fam === 'str') {
      c.strokeStyle = col; c.lineWidth = 3; c.beginPath();
      for (let i = 0; i <= 40; i++) { const u = i / 40, x = 12 + u * (w - 24), y = mid + 11 * A * Math.sin(Math.PI * u) * Math.sin(time * 9); if (i) c.lineTo(x, y); else c.moveTo(x, y); }
      c.stroke(); c.fillStyle = '#d8c9a8'; circ(c, 12, mid, 4); c.fill(); circ(c, w - 12, mid, 4); c.fill();
      const bx = w * 0.5 + Math.sin(time * 1.6) * w * 0.18; c.strokeStyle = '#8a5a30'; c.lineWidth = 4; c.beginPath(); c.moveTo(bx - 10, mid - 24); c.lineTo(bx + 10, mid + 24); c.stroke();
      c.strokeStyle = '#f4efe2'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(bx - 8, mid - 22); c.lineTo(bx + 12, mid + 22); c.stroke();
    } else if (fam === 'wood') {
      c.strokeStyle = '#c9d3e2'; c.lineWidth = 2.5; c.fillStyle = 'rgba(159,216,255,.1)'; c.beginPath(); c.roundRect(8, mid - 17, w - 16, 34, 17); c.fill(); c.stroke();
      c.fillStyle = col; for (let i = 0; i < 14; i++) { const u = (i / 14 + time * 0.12) % 1, x = 18 + u * (w - 36) + Math.sin(time * 8 + i) * 3 * A, y = mid + Math.sin(i * 2.3 + time * 2) * 9; circ(c, x, y, 2.6); c.fill(); }
    } else if (fam === 'brass') {
      const gap = 3 + (0.5 + 0.5 * Math.sin(time * 14)) * 5 * A;
      c.fillStyle = '#dca93c'; c.strokeStyle = '#6b4710'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(w - 14, mid - 22); c.lineTo(w - 44, mid - 8); c.lineTo(w - 44, mid + 8); c.lineTo(w - 14, mid + 22); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#e9768a'; c.strokeStyle = '#8a2f44'; c.beginPath(); c.roundRect(14, mid - gap - 8, 24, 10, 5); c.fill(); c.stroke(); c.beginPath(); c.roundRect(14, mid + gap - 2, 24, 10, 5); c.fill(); c.stroke();
      c.strokeStyle = col; c.lineWidth = 2; for (let k = 0; k < 3; k++) { const ph = (time * 1.1 + k / 3) % 1; c.globalAlpha = (1 - ph) * A; c.beginPath(); c.arc(w - 44, mid, 8 + ph * 26, -0.9, 0.9); c.stroke(); } c.globalAlpha = 1;
    } else {
      c.fillStyle = '#e8d8b0'; c.strokeStyle = '#b8743c'; c.lineWidth = 3; c.beginPath(); c.ellipse(w / 2, mid + 8, 40, 15, 0, 0, TAU); c.fill(); c.stroke();
      c.strokeStyle = col; c.lineWidth = 1.6; for (let k = 0; k < 3; k++) { const ph = (time * 1.2 + k / 3) % 1; c.globalAlpha = (1 - ph) * A; c.beginPath(); c.ellipse(w / 2, mid + 8, 40 * ph, 15 * ph, 0, 0, TAU); c.stroke(); } c.globalAlpha = 1;
      const my = mid - 22 + Math.abs(Math.sin(time * 2.4)) * 24 * (on ? 1 : 0.6); c.strokeStyle = '#8a5a30'; c.lineWidth = 3; c.beginPath(); c.moveTo(w / 2 + 14, my - 14); c.lineTo(w / 2 + 2, my); c.stroke();
      c.fillStyle = '#f2efe6'; circ(c, w / 2, my + 1, 4); c.fill();
    }
  } catch (e) { console.error(e); }
});

// --- the main picture ------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  try {
    HITS.length = 0;
    const act = activePlay(time);
    if (S.sec === 'A') drawA(c, w, h, time);
    else if (S.sec === 'B') drawB(c, w, h, time);
    else if (lab.view === 'stage') drawStage(c, w, h, time, act);
    else if (lab.view === 'size') drawSize(c, w, h, time, act);
    else drawSame(c, w, h, time, act);
  } catch (e) { console.error(e); c.restore?.(); }
});
render();
</script>
</body>
</html>
