// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const guessAt = (ev) => {
  const n = S.n; if (lab.view !== 'net' || n.locked || n.gauge) return;
  const r = $('cv').getBoundingClientRect(), y = ev.clientY - r.top;
  let mw = r.width - 20; if (WH * mw / WW > r.height * 0.42) mw = r.height * 0.42 * WW / WH;
  const gy0 = 10 + WH * mw / WW + 30, gy1 = r.height - 28; if (gy1 - gy0 < 50 || y < gy0 - 12 || y > gy1 + 12) return;
  n.guess = clamp(Math.round((gy1 - y) / (gy1 - gy0) * 80), 0, 80) * 1000; $('rrGuess').value = n.guess; sfx.tick(); render();
};
$('cv').addEventListener('pointerdown', (ev) => { if (lab.view !== 'net' || S.n.locked || S.n.gauge) return; S.n.drag = true; $('cv').setPointerCapture(ev.pointerId); guessAt(ev); });
$('cv').addEventListener('pointermove', (ev) => { if (S.n.drag) guessAt(ev); });
['pointerup', 'pointercancel'].forEach((e) => $('cv').addEventListener(e, () => { S.n.drag = false; }));
$('rrGuess').addEventListener('input', (ev) => { S.n.guess = +ev.target.value; render(); });
$('rrYear').addEventListener('input', (ev) => { S.n.yTarget = +ev.target.value; sfx.tick(); render(); });
const secChip = (k, emo, on) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(T[lang].secrets[k][0])}` : '🔒 ???'}</button>`;
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, n = S.n, st = S.t, wv = S.w;
  if (a === 'lock') { if (n.guess === null) return; n.locked = true; n.yTarget = 1900; n.rev = 0; const ok = Math.abs(n.guess - 51000) <= 10000; (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'yr') { n.yTarget = +b.dataset.y; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'gauge') { n.gauge = !n.gauge; n.fall = 1; } else { st.ferry = !st.ferry; }
    sfx.click();
  } else if (a === 'wheel') { n.wheel = +b.dataset.w; n.fall = 1; sfx.click(); }
  else if (a === 'fm') { st.fmode = b.dataset.m; sfx.click(); }
  else if (a === 'tpick') { st.pick = +b.dataset.i; st.sim = 0; (st.pick === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'again') { st.sim = 0; sfx.click(); }
  else if (a === 'wpick') { wv.pick = +b.dataset.i; wv.stop = 2; (wv.pick === 2 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'stop') { wv.stop = +b.dataset.i; sfx.click(); }

// --- one render per change: controls, readout and the state card -------------------------------------------------------
function optHTML(opts, pick, right, act) { // prediction buttons; after a pick the right one is green and a wrong pick red
  return opts.map((o, i) => `<button class="rr-opt ${pick === null ? '' : i === right ? 'good' : i === pick ? 'bad' : ''}" data-act="${act}" data-i="${i}"${pick === null ? '' : ' disabled'}>${esc(o)}</button>`).join('');
}
function render() {
  const t = T[lang], v = lab.view;
  $('rrN').hidden = v !== 'net'; $('rrT').hidden = v !== 'trip'; $('rrW').hidden = v !== 'town';
  if (v === 'net') renderNet(t); else if (v === 'trip') renderTrip(t); else renderTown(t);
  $('cv').style.touchAction = v === 'net' && !S.n.locked && !S.n.gauge ? 'none' : '';
}
function renderNet(t) {
  const n = S.n, f = t.net, year = n.yTarget;
  lab.setGlow('rgba(242, 193, 78, .22)');
  $('rrNPred').hidden = n.locked || n.gauge; $('rrNFree').hidden = !n.locked || n.gauge; $('rrNGauge').hidden = !n.gauge;
  $('rrNSec').innerHTML = secChip('gauge', '📏', n.gauge); $('rrNNote').textContent = n.gauge ? '' : f.note;
  $('rrNq').textContent = f.ask; $('rrLock').textContent = f.lock; $('rrLock').disabled = n.guess === null;
  $('rrGuessLbl').textContent = n.guess === null ? '' : `${num(n.guess)} km`; $('rrGuessMax').textContent = num(80000);
  $('rrYear').value = year; $('rrYear').setAttribute('aria-label', f.year);
  $('rrYrChips').innerHTML = [1851, 1880, 1900, 1913].map((y) => `<button class="chip ${year === y ? 'on' : ''}" data-act="yr" data-y="${y}">${y}</button>`).join('');
  if (n.gauge) {
    const g = t.ga, dif = GAUGE_R - GAUGE_S, bad = n.wheel !== GAUGE_R;
    $('rrGaugeChips').innerHTML = [GAUGE_S, GAUGE_R].map((w) => `<button class="chip ${n.wheel === w ? 'on' : ''}" data-act="wheel" data-w="${w}">${esc(w === GAUGE_S ? g.w1435 : g.w1524)}</button>`).join('');
    lab.setReadout(`${dif} mm`, `${num(GAUGE_R)} − ${num(GAUGE_S)}`, g.gauge, '#ffd27a');
    lab.setState(bad ? { emo: '📏', title: g.stBad(dif), lead: g.lBad(GAUGE_R, n.wheel, dif), body: g.b, extra: '' } : { emo: '📏', title: g.stOk, lead: g.lOk(GAUGE_R), body: g.b, extra: '' });
    lab.setFacts(t.facts.gauge); return;
  }
  if (!n.locked) {

    lab.setFacts(t.facts.net); return;
  }
  let known = KNOWN[0]; for (const k of KNOWN) if (year >= k[0]) known = k;
  const exact = known[0] === year, km = known[1], newest = LINES.filter((l) => l.y <= year && l.id !== 'ferry').sort((a, b) => b.y - a.y)[0];
  const same = [...new Set(LINES.filter((l) => l.y === newest.y && l.id !== 'ferry').map((l) => t.ln[l.id]))].join('; ');
  const ratio = Math.round(km / FIRST_KM);

  if (pred) { lab.setState({ emo: '🤔', title: f.ask, lead: f.hdr, body: f.noteSch, extra: '' }); return; }
  const ok = wv.pick === 2;
  lab.setState(i === 2 ? { emo: ok ? '✅' : '🤔', title: `${ok ? f.right : f.wrong} ${s.t}`, lead: `${ok ? f.resRight : f.resWrong} ${s.l}`, body: s.b, extra: '' } : { emo: '🏘️', title: s.t, lead: s.l, body: s.b, extra: '' });
}
render();
</script>
