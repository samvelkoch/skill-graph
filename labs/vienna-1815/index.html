  for (const d of BKD) { const [key, ring] = bkRes(d.k, st); setT(d, BKC[key], key === 'ng' ? 0.45 : 0.95, ring); }
  stepDots(BKD, dt);
  c.save(); c.translate(ox, oy); c.scale(s, s);
  drawSea(c, BKF, BKCOAST);
  c.save(); rr(c, 0, 0, W, H, 14); c.clip(); drawDots(c, BKD, 2.3); c.restore();
  c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1; rr(c, 0, 0, W, H, 14); c.stroke();
  const placed = [];
  for (const [key, lo, la, from] of BK_LABELS) { if (st >= from) pill(c, t.e.names[key], BKF.px(lo), BKF.py(la), fs, W, '#fff', 'rgba(10,12,20,.8)', placed); }
  if (E.checked) pill(c, String(YEARS[st]), W - 46, 28, fs * 1.15, W, '#f6e1a0');
  c.restore();
}
canvasLoop(cv, (c, w, h, dt) => { const v = lab.view; if (v === 'balance') drawBal(c, w, h, dt); else if (v === 'map') drawMap(c, w, h, dt); else drawEast(c, w, h, dt); });

// --- pointer: drag a land between the pans, tap a land on the map -----------------------------------------------------
const toDesign = (ev) => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left - TX.ox) / TX.s, y: (ev.clientY - r.top - TX.oy) / TX.s }; };
const cycleZone = (i) => { const z = S.b.z; z[i] = z[i] === 'L' ? 'S' : z[i] === 'S' ? 'R' : 'L'; sfx.snap(); };
cv.addEventListener('pointerdown', (ev) => {
  const p = toDesign(ev), v = lab.view;
  if (v === 'balance') {
    if (S.sec || S.b.phase !== 'play') return;
    let best = null, bd = 26 * 26;
    for (const q of toks) { const d2 = (q.x - p.x) ** 2 + (q.y - p.y) ** 2; if (d2 < bd) { bd = d2; best = q; } }
    if (best) { S.b.drag = { i: best.i, x: p.x, y: p.y, x0: p.x, y0: p.y, moved: false }; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ } }
  } else if (v === 'map') {
    let best = null, bd = 18 * 18;
    for (const d of EUD) { const d2 = (d.x - p.x) ** 2 + (d.y - p.y) ** 2; if (d2 < bd) { bd = d2; best = d; } }
    S.m.sel = best && best.k >= 0 && S.m.sel !== best.k ? best.k : null; S.m.msg = false; sfx.tick(); render();
  }
});
cv.addEventListener('pointermove', (ev) => {
  const dr = S.b.drag; if (!dr) return; const p = toDesign(ev);
  dr.x = p.x; dr.y = p.y; if (Math.hypot(p.x - dr.x0, p.y - dr.y0) > 7) dr.moved = true;
});
const endDrag = (ev) => {
  const dr = S.b.drag; if (!dr) return; S.b.drag = null;
  if (!dr.moved) cycleZone(dr.i);
  else {
    const g = geo(S.b.ang), p = toDesign(ev);
    const cands = [['L', g.L.x, g.L.y - 40], ['R', g.R.x, g.R.y - 40], ['S', 180, SHELF_Y]];
    cands.sort((a, b) => Math.hypot(a[1] - p.x, a[2] - p.y) - Math.hypot(b[1] - p.x, b[2] - p.y));
    S.b.z[dr.i] = cands[0][0]; sfx.snap();
  }
  render();
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { S.b.drag = null; });

// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const HIST = { 1: 'L', 2: 'L', 3: 'S', 4: 'L', 5: 'S' };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, B = S.b, M = S.m, E = S.e;
  if (a === 'accept' || a === 'oppose') { B.guess = a; B.phase = 'play'; for (let i = 1; i <= 5; i++) B.z[i] = 'L'; (a === 'oppose' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'land') cycleZone(+b.dataset.i);
  else if (a === 'deal') { Object.assign(B.z, HIST); sfx.snap(); }
  else if (a === 'again') { B.phase = 'ask'; B.guess = null; B.lv = false; for (let i = 1; i <= 5; i++) B.z[i] = 'S'; sfx.click(); }
  else if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.hd = 0; S.cc = 0; sfx.click();
  } else if (a === 'sprev') { if (S.sec === 'hd') S.hd = Math.max(0, S.hd - 1); else S.cc = Math.max(0, S.cc - 1); sfx.tick(); }
  else if (a === 'snext') { if (S.sec === 'hd') S.hd = Math.min(6, S.hd + 1); else S.cc = Math.min(4, S.cc + 1); sfx.tick(); }
  else if (a === 'mq') { M.guess = +b.dataset.j; M.asked = true; M.year = 15; M.sel = REG.findIndex((r) => r.id === 'be'); M.msg = true; (M.guess === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'year') { M.year = +b.dataset.y; if (M.year === 12) M.conf = false; sfx.click(); }
  else if (a === 'conf') { M.conf = !M.conf; M.msg = false; sfx.click(); }
  else if (a === 'ev') {
    const i = +b.dataset.i; if (E.checked) return;
    const at = E.order.indexOf(i);
    if (at >= 0) E.order.splice(at, 1); else if (E.order.length < 5) E.order.push(i);
    sfx.tick();
  } else if (a === 'clear') { E.order = []; sfx.click(); }
  else if (a === 'check') { E.checked = true; E.t = 0; E.clock = 0; const ok = E.order.every((v, p) => v === p); (ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'redo') { E.order = []; E.checked = false; E.t = 0; E.play = false; sfx.click(); }
  else if (a === 'stage') { E.t = +b.dataset.t; E.play = false; sfx.click(); }
  else if (a === 'play') { E.play = !E.play; E.clock = 0; if (E.play && E.t >= 4) E.t = 0; sfx.click(); }
  render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------------
const sw = (hex) => `<span class="vi-sw" style="background:${hex}"></span>`;
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('vi1').hidden = v !== 'balance'; $('vi2').hidden = v !== 'map'; $('vi3').hidden = v !== 'east';
  if (v === 'balance') renderB(t); else if (v === 'map') renderM(t); else renderE(t);
}
function secRow(t) {
  const open = secret.unlocked(), chip = (k, emo) => `<button class="vi-chip vi-sec ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-a="sec" data-k="${k}">${open ? `${emo} ${esc(t.secs[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="row2">${chip('hd', '🗓️')}${chip('cc', '🤝')}</div>`;
}
function renderB(t) {
  const B = S.b, b = t.b, st = balState(), sec = S.sec;
  if (sec) {
    const n = sec === 'hd' ? S.hd : S.cc, last = sec === 'hd' ? 6 : 4, row = sec === 'hd' ? t.hd[n] : t.cc[n];
    $('vi1').innerHTML = `<div class="row2" style="margin-top:0"><button class="vi-chip" data-a="sprev" ${n === 0 ? 'disabled' : ''} aria-label="◀">${t.prev}</button><span class="vi-date">${esc(row[0])}</span><button class="vi-chip" data-a="snext" ${n === last ? 'disabled' : ''} aria-label="▶">${t.next}</button></div>${secRow(t)}`;
    lab.setState({ emo: sec === 'hd' ? '🗓️' : '🤝', title: row[0], lead: sec === 'hd' ? row[1] : row[2], body: '', extra: '' });
    lab.setReadout(esc(row[0]), '', sec === 'hd' ? t.secs.hd[0] : t.secs.cc[0]);
    lab.setFacts(t.secFacts[sec]);
    return;
  }
  if (B.phase === 'ask') {
    $('vi1').innerHTML = `<div class="vi-q">${esc(b.qBody)}</div><div class="vi-opts"><button class="vi-opt" data-a="accept">${esc(b.accept)}</button><button class="vi-opt" data-a="oppose">${esc(b.oppose)}</button></div>${secRow(t)}`;
    lab.setState({ emo: '🤔', title: b.qTitle, lead: b.qLead, body: '', extra: `<div class="vi-fine">${esc(b.pans)}</div><div class="vi-fine">${esc(b.table)}</div>` });
    lab.setFacts(b.factsAsk);
  } else {
    const hist = isHist(), left = nOnLeft();
    if (st === 'lv' && !B.lv) { B.lv = true; sfx.good(); } else if (st !== 'lv') B.lv = false;
    $('vi1').innerHTML = `<div class="vi-lands">${[1, 2, 3, 4, 5].map((i) => `<button class="vi-chip" data-a="land" data-i="${i}"><span class="vi-n" style="background:${pieceCol(i)}">${i}</span>${esc(b.lands[i - 1])} · ${esc(b.zone[B.z[i]])}</button>`).join('')}</div>
      <div class="row2"><button class="vi-chip" data-a="deal">${esc(b.dealBtn)}</button><button class="vi-chip" data-a="again">${esc(b.again)}</button></div>${secRow(t)}`;
    const head = B.guess === 'oppose' ? b.ok : b.bad;
    if (st === 'lv') lab.setState({ emo: '⚖️', title: hist ? b.lvHist : b.lvAlt, lead: b.deal, body: '', extra: `<div class="vi-fine">${esc(b.pans)}</div>` });
    else lab.setState({ emo: '⚠️', title: b.tilt[st], lead: st === 'L' ? b.stL : b.stR, body: b.playBody, extra: `<div class="vi-fine">${esc(head)} ${esc(b.oppLead)}</div>` });
    lab.setFacts(b.factsPlay);
    lab.setReadout(esc(b.tilt[st]), b.note, b.onLeft(left));
    return;
  }
  lab.setReadout(esc(b.tilt[st]), b.note, '');
}
function legendM(t, y15) {
  const keys = y15 ? ['gb', 'fr', 'nl', 'pr', 'au', 'de', 'pl', 'ru', 'fc'] : ['fs', 'gb', 'pr', 'au', 'ru'];
  return `<div class="vi-leg">${keys.map((k) => `<span>${sw(COL[k])}${esc(t.own[k])}</span>`).join('')}<span>${sw(COL.ng)}${esc(t.own.ng)}</span></div>`;
}
function renderM(t) {
  const M = S.m, m = t.m, y15 = M.year === 15;
  if (!M.asked) {
    $('vi2').innerHTML = `<div class="vi-q">${esc(m.qBody)}</div><div class="vi-opts col">${m.opts.map((o, j) => `<button class="vi-opt" data-a="mq" data-j="${j}">${esc(o)}</button>`).join('')}</div>${legendM(t, false)}`;
  } else {
    $('vi2').innerHTML = `<div class="row2" style="margin-top:0"><button class="vi-chip ${M.year === 12 ? 'on' : ''}" data-a="year" data-y="12">1812</button><button class="vi-chip ${M.year === 15 ? 'on' : ''}" data-a="year" data-y="15">1815</button>${y15 ? `<button class="vi-chip ${M.conf ? 'on' : ''}" data-a="conf">🔗 ${esc(m.conf)}</button>` : ''}</div>${legendM(t, y15)}<div class="vi-fine">${esc(m.tap)}</div>`;
  }
  const sel = M.sel !== null ? REG[M.sel] : null, rn = sel ? t.reg[sel.id] : null;
  let st;
  if (sel) {
    const a = t.own[sel.o12], bb = t.own[sel.o15];
    st = M.asked ? { emo: '📍', title: rn[0], lead: sel.o12 === sel.o15 ? m.same(a) : m.move(a, bb), body: M.msg ? m.okLead : rn[2], extra: '' }
      : { emo: '📍', title: rn[0], lead: a, body: '', extra: '' };
    if (M.msg) st.title = `${M.guess === 1 ? m.ok : m.bad}`;
  } else if (M.asked && y15 && M.conf) st = { emo: '🔗', title: m.conf, lead: m.confLead, body: '', extra: '' };
  else if (!M.asked) st = { emo: '🤔', title: m.qTitle, lead: m.qLead, body: m.qBody, extra: '' };
  else st = { emo: '🗺️', title: y15 ? m.ttl15 : m.ttl12, lead: m.tap, body: '', extra: '' };
  lab.setState(st);
  lab.setFacts(M.asked ? m.facts : m.factsAsk);
  lab.setReadout(esc(y15 ? '1815' : '1812'), m.sub, y15 && M.conf ? m.confPill : '');
}
function renderE(t) {
  const E = S.e, e = t.e, ok = E.order.length === 5;
  const legend = `<div class="vi-leg">${['ot', 'gr', 'sr', 'mn', 'ro', 'bg', 'oc'].map((k) => `<span>${sw(BKC[k])}${esc(e.names[k])}</span>`).join('')}</div><div class="vi-fine">${esc(e.ring)} · ${esc(e.dot)}</div>`;
  if (!E.checked) {
    $('vi3').innerHTML = `<div class="vi-evs">${ORDER.map((i) => { const at = E.order.indexOf(i); return `<button class="vi-ev ${at >= 0 ? 'on' : ''}" data-a="ev" data-i="${i}"><span class="vi-n">${at >= 0 ? at + 1 : ''}</span><span>${esc(e.events[i])}</span></button>`; }).join('')}</div>
      <div class="row2"><button class="vi-chip" data-a="check" ${ok ? '' : 'disabled'}>✓ ${esc(e.check)}</button><button class="vi-chip" data-a="clear">${esc(e.clear)}</button></div>${legend}`;
    lab.setState({ emo: '🧩', title: e.qTitle, lead: e.qLead, body: e.placed(E.order.length), extra: '' });
    lab.setFacts([]);
    lab.setReadout(esc(e.placed(E.order.length)), e.sub, '');
    return;
  }
  const right = E.order.filter((v, p) => v === p).length, st = e.st[E.t];
  $('vi3').innerHTML = `<div class="vi-q">${esc(right === 5 ? e.allOk : e.some(right))}</div>
    <div class="vi-evs">${[0, 1, 2, 3, 4].map((i) => { const at = E.order.indexOf(i); return `<div class="vi-ev done"><span class="vi-n ${at === i ? 'ok' : 'no'}">${at === i ? '✓' : '✗'}</span><span><b>${YEARS[i]}</b> ${esc(e.events[i])}</span></div>`; }).join('')}</div>
    <div class="row2">${YEARS.map((y, i) => `<button class="vi-chip ${E.t === i ? 'on' : ''}" data-a="stage" data-t="${i}">${y}</button>`).join('')}<button class="vi-chip" data-a="play">${E.play ? '⏸ ' + esc(e.stop) : '▶ ' + esc(e.play)}</button><button class="vi-chip" data-a="redo">↺</button></div>${legend}`;
  lab.setState({ emo: '🌍', title: st[0], lead: st[1], body: st[2], extra: right === 5 ? '' : `<div class="vi-fine">${esc(e.someLead)}</div>` });
  lab.setFacts(e.facts);
  lab.setReadout(esc(st[0]), e.sub, '');
}
render();
</script>
