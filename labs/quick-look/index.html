}
function speech(c, text) {
  const x = 160, y = 190, w = 186, h = 82;
  c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 10; c.shadowOffsetY = 4;
  c.fillStyle = '#fffdf3'; rr(c, x, y, w, h, 16); c.fill();
  c.beginPath(); c.moveTo(x + 1, y + 44); c.lineTo(x - 14, y + 58); c.lineTo(x + 1, y + 62); c.closePath(); c.fill(); c.restore();
  c.strokeStyle = '#cbb98f'; c.lineWidth = 1.5; rr(c, x, y, w, h, 16); c.stroke();
  c.fillStyle = '#fffdf3'; c.beginPath(); c.moveTo(x + 1.5, y + 45); c.lineTo(x + 1.5, y + 61); c.lineTo(x - 11, y + 57); c.closePath(); c.fill();
  c.font = `800 ${F(15)}px Nunito, system-ui, sans-serif`; c.fillStyle = '#2d2418'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const words = text.split(' '), lines = []; let cur = '';
  words.forEach((wd) => { const tr = cur ? cur + ' ' + wd : wd; if (c.measureText(tr).width > w - 24 && cur) { lines.push(cur); cur = wd; } else cur = tr; });
  lines.push(cur);
  const lh = F(15) * 1.25;
  lines.forEach((ln, i) => c.fillText(ln, x + w / 2, y + h / 2 + (i - (lines.length - 1) / 2) * lh));
}

// --- the flashing game: rounds, phases, layouts ---------------------------------------------------------------
function scatter(n) {
  const pts = []; let md = 48, tries = 0;
  while (pts.length < n) {
    const x = R(46, 314), y = R(46, 214);
    if (pts.every((p) => Math.hypot(p.x - x, p.y - y) >= md)) pts.push({ x, y, part: 0, rot: R(-0.7, 0.7) });
    else if (++tries > 250) { tries = 0; md = Math.max(38, md - 3); }
  }
  return pts;
}
function newRound() {
  const e = engine(); let n, kind = 'scatter', items, parts = null, dur = 1;
  if (e === 'flash') {
    do { n = RI(1, 5); } while (n === S.lastN); dur = [1.5, 0.8, 0.35][S.speed]; items = scatter(n);
  } else if (e === 'groups') {
    do { n = RI(6, 10); } while (n === S.lastN);
    if (S.mode === 'groups') {
      const ks = ['frame', 'domino', 'dice'].filter((k) => k !== S.lastKind); kind = ks[RI(0, ks.length - 1)];
      if (kind === 'frame') { items = []; for (let i = 0; i < n; i++) items.push({ x: 68 + (i % 5) * 56, y: 102 + (i < 5 ? 0 : 56), part: i < 5 ? 0 : 1, rot: R(-0.6, 0.6) }); parts = [5, n - 5]; }
      else if (kind === 'domino') { const a = RI(Math.max(2, n - 5), Math.min(5, n - 2)); items = [...pipsAt(a, 105, 130, 0), ...pipsAt(n - a, 255, 130, 1)]; parts = [a, n - a]; }
      else { const a = RI(Math.max(2, n - 6), Math.min(6, n - 2)); items = [...pipsAt(a, 98, 130, 0), ...pipsAt(n - a, 262, 130, 1)]; parts = [a, n - a]; }
      S.lastKind = kind;
    } else items = scatter(n);
  } else if (e === 'sb') {
    dur = 0.2;
    if (S.sbStep === 0) { n = 3; items = scatter(3); }
    else if (S.sbStep === 1) { n = 8; items = scatter(8); }
    else { n = 8; kind = 'rows44'; items = []; for (let i = 0; i < 8; i++) items.push({ x: 180 + ((i % 4) - 1.5) * 62, y: 96 + (i >> 2) * 68, part: i >> 2, rot: R(-0.6, 0.6) }); parts = [4, 4]; }
  } else {
    dur = 0.9; let a, b; do { a = RI(1, 6); b = RI(1, 6); } while (a + b < 5 || a + b > 10 || a + b === S.lastN);
    n = a + b; kind = 'dice2'; items = [...pipsAt(a, 98, 130, 0), ...pipsAt(b, 262, 130, 1)]; parts = [a, b];
  }
  S.lastN = n;
  items.sort((p, q) => p.x - q.x || p.y - q.y);
  G = { ph: 'opening', pt: 0, items, n, kind, parts, guess: null, ok: null, dur };
  sfx.click(); render();
}
function guess(k) {
  if (G.ph !== 'ask') return;
  G.guess = k; G.ok = k === G.n;
  const e = engine();
  if (e === 'flash') S.streak = G.ok ? S.streak + 1 : 0;
  else if (e === 'groups') { const a = S.sc[S.mode]; a.push(G.ok); if (a.length > 5) a.shift(); }
  (G.ok ? sfx.good : sfx.bad)();
  G.ph = 'revOpen'; G.pt = 0; render();
}
function stepPlay(dt) {
  G.pt += dt; const ph = G.ph;
  if (ph === 'opening' && G.pt >= 0.4) { G.ph = 'show'; G.pt = 0; }
  else if (ph === 'show' && G.pt >= G.dur) { G.ph = 'closing'; G.pt = 0; sfx.push(); }
  else if (ph === 'closing' && G.pt >= 0.45) { G.ph = 'ask'; G.pt = 0; render(); }
  else if (ph === 'revOpen' && G.pt >= 0.5) { G.ph = 'reveal'; G.pt = 0; render(); }
  else if (ph === 'recover' && G.pt >= 0.4) newRound();
}
function lidPlay() {
  switch (G.ph) {
    case 'opening': return 1 - eio(clamp01(G.pt / 0.4));
    case 'closing': return eob(clamp01(G.pt / 0.45));
    case 'revOpen': return 1 - eio(clamp01(G.pt / 0.5));
    case 'recover': return eob(clamp01(G.pt / 0.4));
    case 'show': case 'reveal': return 0;
    default: return 1;
  }
}
function drawPlay(c, g) {
  const ph = G.ph, seen = ph === 'show' || ph === 'revOpen' || ph === 'reveal' || ph === 'recover';
  const rt = ph === 'reveal' ? G.pt : ph === 'recover' ? 99 : -1;
  if (seen) {
    drawDeco(c, G.kind);
    const dots = G.kind === 'dice2';
    G.items.forEach((it, i) => {
      let col = dots ? 'black' : 'red', sc = 1, bub = 0;
      if (rt >= 0) {
        if (!G.parts) { const tt = rt - i * 0.3; if (tt >= 0) { bub = i + 1; sc = 1 + 0.28 * Math.sin(Math.PI * clamp01(tt / 0.4)); } }
        else { const tt = rt - (it.part === 0 ? 0.3 : 0.9); if (tt >= 0) { col = it.part === 0 ? (dots ? 'orange' : 'yellow') : 'blue'; sc = 1 + 0.22 * Math.sin(Math.PI * clamp01(tt / 0.4)); } }
      }
      if (dots) pip(c, it.x, it.y, 14.5, col, sc); else bug(c, it.x, it.y, 17, col, it.rot, sc);
      if (bub) bubble(c, it.x + 14, it.y - 19, bub, eob(clamp01((rt - (bub - 1) * 0.3) / 0.25)));
    });
    if (G.parts && rt >= 1.4) pill(c, T[lang].make(G.parts[0], G.parts[1], G.n), g.W / 2, 224, 15, clamp01((rt - 1.4) / 0.3));
  }
  drawLid(c, g, lidPlay());
}

// --- build view -----------------------------------------------------------------------------------------------
const CELL = (i) => ({ x: 68 + (i % 5) * 56, y: 62 + (i < 5 ? 0 : 58) });
function owlSay(t) {
  const cl = S.build.cells, top = cl.slice(0, 5).reduce((a, b) => a + b, 0), bot = cl.slice(5).reduce((a, b) => a + b, 0), n = top + bot;
  if (n === 0) return ['empty', t.owl.empty];
  if (top === 5 || bot === 5) { const o = top === 5 ? bot : top; return o === 0 ? ['grp', t.owl.row5] : ['grp', t.owl.grp(5, o, n)]; }
  if (n <= 5) return ['easy', t.owl.easy(n)];
  return ['mess', t.owl.hmm(n)];
}
function stepBuild(dt) {
  const B = S.build; B.pt += dt; B.pop.forEach((v, i) => { B.pop[i] = v + dt; });
  if (B.ph === 'blink' && B.pt >= 0.6) { B.ph = 'owlClose'; B.pt = 0; sfx.push(); }
  else if (B.ph === 'owlClose' && B.pt >= 0.45) { B.ph = 'owl'; B.pt = 0; render(); }
  else if (B.ph === 'owl' && B.pt >= 3.6) { B.ph = 'owlOpen'; B.pt = 0; }
  else if (B.ph === 'owlOpen' && B.pt >= 0.5) { B.ph = 'edit'; B.pt = 0; render(); }
}
function lidBuild() {
  const B = S.build;
  if (B.ph === 'owlClose') return eob(clamp01(B.pt / 0.45));
  if (B.ph === 'owl') return 1;
  if (B.ph === 'owlOpen') return 1 - eio(clamp01(B.pt / 0.5));
  return 0;
}
function drawBuild(c, g, t, tm) {
  const B = S.build, n = B.cells.reduce((a, b) => a + b, 0);
  c.fillStyle = 'rgba(0,0,0,.14)'; rr(c, 38, 32, 284, 120, 10); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 2.5; rr(c, 38, 32, 284, 120, 10); c.stroke();
  for (let i = 0; i < 10; i++) {
    const p = CELL(i);
    c.fillStyle = 'rgba(0,0,0,.16)'; rr(c, p.x - 26, p.y - 26, 52, 52, 8); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1.5; c.stroke();
    if (B.cells[i]) bug(c, p.x, p.y, 17, 'red', ((i * 37) % 11) / 11 * 1.2 - 0.6, Math.max(0.01, eob(clamp01(B.pop[i] / 0.3))));
  }
  if (B.ph === 'blink' && B.pt < 0.22) { c.fillStyle = `rgba(255,255,255,${0.55 * (1 - B.pt / 0.22)})`; rr(c, g.fx, g.fy, g.fw, g.fh, 10); c.fill(); }
  drawLid(c, g, lidBuild());
  const mood = B.ph === 'blink' ? 'wide' : B.ph === 'owlClose' || B.ph === 'owl' || B.ph === 'owlOpen' ? 'think' : 'calm';
  owl(c, 88, 246, mood, tm);
  let msg;
  if (B.ph === 'owl' || B.ph === 'owlOpen') msg = B.msg;
  else if (B.ph === 'blink' || B.ph === 'owlClose') msg = t.owl.wait;
  else msg = n === B.target ? t.owl.ready(B.target) : n > B.target ? t.owl.over(B.target) : t.owl.ask(B.target);
  speech(c, msg);
}

// --- canvas loop ----------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, tm) => {
  const g = geo(), s = Math.min(w / g.W, h / g.H);
  VIEW = { s, ox: (w - g.W * s) / 2, oy: (h - g.H * s) / 2 };
  if (lab.view === 'build') stepBuild(dt); else stepPlay(dt);
  c.save(); c.translate(VIEW.ox, VIEW.oy); c.scale(s, s);
  drawBoard(c, g);
  if (lab.view === 'build') drawBuild(c, g, T[lang], tm); else drawPlay(c, g);
  c.restore();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'build') return;
  const B = S.build, r = $('cv').getBoundingClientRect();
  const px = (ev.clientX - r.left - VIEW.ox) / VIEW.s, py = (ev.clientY - r.top - VIEW.oy) / VIEW.s;
  if (B.ph === 'owl') { B.ph = 'owlOpen'; B.pt = 0; return; }
  if (B.ph !== 'edit') return;
  for (let i = 0; i < 10; i++) {
    const p = CELL(i);
    if (Math.abs(px - p.x) <= 28 && Math.abs(py - p.y) <= 28) {
      B.cells[i] = B.cells[i] ? 0 : 1; if (B.cells[i]) B.pop[i] = 0;
      (B.cells[i] ? sfx.snap : sfx.tick)(); render(); return;
    }
  }
});

// --- controls -------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, B = S.build;
  if (act === 'num') guess(+b.dataset.k);
  else if (act === 'tgt') { B.target = +b.dataset.k; sfx.click(); }
  else if (act === 'look') { newRound(); showStage(); return; }
  else if (act === 'next') {
    if (S.sec === 'sb') S.sbStep = (S.sbStep + 1) % 3;
    G.ph = 'recover'; G.pt = 0; sfx.click();
  } else if (act === 'speed') { S.speed = +b.dataset.i; sfx.tick(); }
  else if (act === 'mode') { S.mode = b.dataset.m; resetGame(); sfx.tick(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (lab.view === 'build') $('views').querySelector('[data-view="flash"]').click();
    S.sec = S.sec === k ? null : k; S.sbStep = 0; resetGame(); sfx.click();
  } else if (act === 'leave') { S.sec = null; resetGame(); sfx.click(); }
  else if (act === 'blink') {
    const [kind, msg] = owlSay(T[lang]); B.msg = msg; B.kind = kind; B.ph = 'blink'; B.pt = 0; sfx.click(); showStage();
  } else if (act === 'clear') { B.cells.fill(0); sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('keydown', () => {});

// --- one render per change ------------------------------------------------------------------------------------
function render() {
  const t = T[lang], e = engine(), B = S.build;
  const play = e !== 'build', mx = S.sec ? 10 : e === 'flash' ? 5 : 10;
  const seen = G.ph === 'revOpen' || G.ph === 'reveal' || G.ph === 'recover';
  let q = '', nums = '', row = '', st;
  if (play) {
    if (G.ph === 'ready') q = `<span class="dim">${esc(t.pReady)}</span>`;
    else if (G.ph === 'opening' || G.ph === 'show') q = `<span class="dim">${esc(t.pShow)}</span>`;
    else if (!seen) q = e === 'dice2' ? t.pAskDots : t.pAsk;
    else q = `<span class="${G.ok ? 'ok' : 'no'}">${esc(G.ok ? t.right : t.was(G.n))}</span>`;
    for (let k = 1; k <= mx; k++) {
      const cls = seen ? (k === G.n ? ' glow' : k === G.guess ? ' bad' : '') : '';
      nums += `<button class="ql-num${cls}" data-act="num" data-k="${k}"${G.ph === 'ask' ? '' : ' disabled'}>${k}</button>`;
    }
    const busy = G.ph === 'opening' || G.ph === 'show' || G.ph === 'closing' || G.ph === 'ask' || G.ph === 'revOpen' || G.ph === 'recover';
    const last = S.sec === 'sb' && S.sbStep === 2;
    const main = G.ph === 'ready' ? `<button class="btn ql-go" data-act="look">${esc(t.look)}</button>`
      : G.ph === 'reveal' ? `<button class="btn ql-go" data-act="next">${esc(last ? t.again : t.next)}</button>`
      : `<button class="btn ql-go" disabled>${esc(t.wait)}</button>`;
    row = main;
    if (S.sec) row += `<button class="chip" data-act="leave">${esc(t.back)}</button>`;
    else if (e === 'flash') row += `<div class="chips">${t.speeds.map((s, i) => `<button class="chip${S.speed === i ? ' on' : ''}" data-act="speed" data-i="${i}">${esc(s)}</button>`).join('')}</div>`;
    else row += `<div class="chips">${['mixed', 'groups'].map((m, i) => `<button class="chip${S.mode === m ? ' on' : ''}" data-act="mode" data-m="${m}">${esc(t.modes[i])}</button>`).join('')}</div>`;
    void busy;
  } else {
    const n = B.cells.reduce((a, b) => a + b, 0);
    q = `<span class="dim">${esc(t.tgtL)} ${B.target}</span>`;
    for (let k = 6; k <= 10; k++) nums += `<button class="ql-num${B.target === k ? ' on' : ''}" data-act="tgt" data-k="${k}">${k}</button>`;
    row = `<button class="btn ql-go" data-act="blink"${B.ph === 'edit' ? '' : ' disabled'}>${esc(t.blink)}</button><button class="chip" data-act="clear"${B.ph === 'edit' && n ? '' : ' disabled'}>${esc(t.clear)}</button>`;
  }
  const open = secret.unlocked();
  const sc = (k, emo, nm) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(nm)}` : '🔒 ???'}</button>`;
  $('ctrlBody').innerHTML = `<div class="ql-q">${q}</div><div class="ql-nums">${nums}</div>
    <div class="row2 ql-row">${row}</div><div class="row2 ql-row"><div class="chips">${sc('sb', '⚡', t.secrets.a[0])}${sc('dice', '🎲', t.secrets.b[0])}</div></div>`;

  // readout + state card
  const cap = G.parts ? t.make(G.parts[0], G.parts[1], G.n) : '';
  if (e === 'flash') {
    lab.setReadout(String(S.streak), t.streak, t.speeds[S.speed], '#3ddc97');
    st = G.ph === 'ready' ? t.st.fReady : G.ph === 'opening' || G.ph === 'show' ? t.st.show : !seen ? t.st.ask : G.ok ? t.st.fRight(G.n) : t.st.fWrong(G.n);
  } else if (e === 'groups') {
    const f = (a) => `${a.filter(Boolean).length}`;
    const part = (nm, a) => `${esc(nm)}: ${a.length ? esc(t.of(f(a), a.length)) : '–'}`;
    lab.setReadout(`<span class="ql-sc">${part(t.gr, S.sc.groups)} · ${part(t.mx, S.sc.mixed)}</span>`, '', t.modes[S.mode === 'groups' ? 1 : 0], '#f5c84c');
    st = G.ph === 'ready' ? t.st.gReady : G.ph === 'opening' || G.ph === 'show' ? t.st.show : !seen ? t.st.gAsk : G.parts ? t.st.gGrp(G.ok, G.n, cap) : t.st.gMix(G.ok, G.n);
  } else if (e === 'sb') {
    lab.setReadout(`${S.sbStep + 1}/3`, t.secrets.a[0], '', '#f5c84c');
    st = G.ph === 'ready' ? t.st.sbReady(S.sbStep + 1) : G.ph === 'opening' || G.ph === 'show' ? t.st.show : !seen ? t.st.ask : t.st.sbRes[S.sbStep](G.ok, G.n, cap);
  } else if (e === 'dice2') {
    lab.setReadout('🎲', t.secrets.b[0], '', '#f5c84c');
    st = G.ph === 'ready' ? t.st.dReady : G.ph === 'opening' || G.ph === 'show' ? t.st.show : !seen ? t.st.ask : t.st.dRes(G.ok, G.n, cap);
  } else {
    const n = B.cells.reduce((a, b) => a + b, 0);
    lab.setReadout(String(n), t.free(10 - n), t.tgtP(B.target), '#f5c84c');
    if (B.ph === 'blink' || B.ph === 'owlClose') st = t.st.bWait;
    else if (B.ph === 'owl' || B.ph === 'owlOpen') st = { grp: t.st.bGrp, mess: t.st.bMess, easy: t.st.bEasy, empty: t.st.bEmpty }[B.kind];
    else st = n === B.target ? t.st.bReady(B.target) : t.st.bEdit(B.target);
  }
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] });
  lab.setFacts(FACT_IDX[lab.view].map((i) => t.facts[i]));
}
render();
</script>
