function tag(c, w, h, txt, x, y, o = {}) {

  X = clamp(X, 4, Math.max(4, w - tw - 4)); const Y = clamp(y - th / 2, 4, Math.max(4, h - th - 4));
  rr(c, X, Y, tw, th, th / 2); c.fillStyle = o.bg ?? 'rgba(10,12,22,.82)'; c.fill();
  if (o.line) { c.strokeStyle = o.line; c.lineWidth = 1.5; c.stroke(); }

function smooth(c, P, close) {
  const n = P.length;
  if (close) {
    c.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);

    c.closePath();
  } else {
    c.moveTo(...P[0]);
    for (let i = 1; i < n - 1; i++) { const a = P[i], b = P[i + 1]; c.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }

}

  c.save();

function sky(c, w, h, y1, top, mid, bot, time) {
  const g = c.createLinearGradient(0, 0, 0, y1); g.addColorStop(0, top); g.addColorStop(.62, mid); g.addColorStop(1, bot);
  c.fillStyle = g; c.fillRect(0, 0, w, y1);
  for (let i = 0; i < 22; i++) {
    c.globalAlpha = .35 + .4 * Math.abs(Math.sin(time * 1.2 + i));
    c.fillStyle = '#fff'; c.beginPath(); c.arc(hash(i * 2.3) * w, hash(i * 4.1) * y1 * .62, .9, 0, Math.PI * 2); c.fill();
  }
  c.globalAlpha = 1;
}
function ground(c, w, h, gy, glow) {
  const g = c.createLinearGradient(0, gy, 0, h); g.addColorStop(0, '#2b2432'); g.addColorStop(1, '#120f19');
  c.fillStyle = g; c.fillRect(0, gy, w, h - gy);
  const hz = c.createLinearGradient(0, gy - 8, 0, gy + 10); hz.addColorStop(0, 'rgba(255,170,110,0)'); hz.addColorStop(.5, glow ?? 'rgba(255,170,110,.35)'); hz.addColorStop(1, 'rgba(255,170,110,0)');

function dot(c, x, y, r, a) {

  c.fillStyle = gl; c.beginPath(); c.arc(x, y, R * 3, 0, Math.PI * 2); c.fill();
  const g = c.createRadialGradient(x - R * .3, y - R * .3, 0, x, y, R); g.addColorStop(0, '#fff0b0'); g.addColorStop(.45, '#ff9a3c'); g.addColorStop(1, '#c4391f');

}

    c.beginPath(); c.arc(x + 13, y + 14, 9, 0, Math.PI * 2); c.fillStyle = 'rgba(10,12,22,.85)'; c.fill(); c.fillStyle = '#fff'; c.font = '900 11px Nunito, sans-serif'; c.textAlign = 'center'; c.fillText(i + 1, x + 13, y + 14.5);
    c.font = '800 12px Nunito, sans-serif'; c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(v[lang][1], x + cw / 2, y + chh - 31, cw - 8);
    const chosen = S.ml[i];
    if (S.mChecked) { const ok = chosen === v.k; tag(c, w, h, `${ok ? '✓' : '✗'} ${t.st[v.k]}`, x + cw / 2, y + chh - 13, { bg: ok ? 'rgba(40,150,100,.92)' : 'rgba(190,110,20,.94)', size: 12 }); }
    else if (chosen) tag(c, w, h, t.st[chosen], x + cw / 2, y + chh - 13, { fg: '#14121c', bg: COLORS[chosen] });
  });
}

// --- the loop -----------------------------------------------------------------------------------------------
function tick(dt) {
  if (S.dp < 1) S.dp = Math.min(1, S.dp + dt / 1.1);
  S.dayV += (S.day - S.dayV) * Math.min(1, dt * 7);
  if (S.play && lab.view === 'wake') {
    S.day = Math.min(WDAYS, S.day + dt * 5.5);
    if (S.day >= WDAYS) S.play = false;
    const r = Math.round(S.day);
    if (r !== S.lastDay || !S.play) { S.lastDay = r; $('wDay').value = r; render(); }
  }
}

// --- input ---------------------------------------------------------------------------------------------------
const goView = (v) => document.querySelector(`#views [data-view="${v}"]`)?.click();
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const hit = (list, x, y) => list.find((r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, v = lab.view;
  if (v === 'diary' && !S.sec1) { const k = hit(G.cones, x, y); if (k) openDiary(k.i); }
  else if (v === 'map') {
    const pin = G.pins.find((p) => Math.hypot(p.x - x, p.y - y) < 16), card = hit(G.cards, x, y);
    const i = pin ? pin.i : card ? card.i : -1; if (i >= 0) { S.mi = i; sfx.tick(); render(); }
  }
});
function openDiary(i) { S.open = i; S.dp = 0; sfx.click(); render(); }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = b.dataset.k, set = SETS[S.set];
  if (act === 'dopen') return openDiary(+k);
  if (act === 'dlab') { if (S.open >= 0 && !S.checked) { S.lab[S.open] = k; sfx.tick(); } }
  else if (act === 'dmain') {
    if (!S.checked) { if (S.lab.every(Boolean)) { S.checked = true; const ok = S.lab.filter((l, i) => l === set[i].k).length; (ok === 3 ? sfx.good : sfx.bad)(); store.set('volcano-sleep:rule', true); showStage(); } }
    else { S.set = 1 - S.set; S.lab = [null, null, null]; S.checked = false; S.open = -1; S.dp = 1; sfx.click(); }
  } else if (act === 'wans') { S.wakeA = k; S.day = 0; S.dayV = 0; $('wDay').value = 0; (k === 'yes' ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'play') { if (S.day >= WDAYS) { S.day = 0; S.dayV = 0; } S.play = !S.play; S.lastDay = Math.round(S.day); sfx.click(); }
  else if (act === 'inst') { S.inst = k; sfx.tick(); }
  else if (act === 'mlab') { if (S.mi >= 0 && !S.mChecked) { S.ml[S.mi] = k; sfx.tick(); } }
  else if (act === 'mmain') {
    if (!S.mChecked) { if (S.ml.every(Boolean)) { S.mChecked = true; const ok = S.ml.filter((l, i) => l === VOLS[i].k).length; (ok === 6 ? sfx.good : sfx.bad)(); store.set('volcano-sleep:rule', true); showStage(); } }
    else { S.ml = [null, null, null, null, null, null]; S.mChecked = false; S.mi = -1; sfx.click(); }
  } else if (act === 'mpick') { S.mi = +k; sfx.tick(); }
  else if (act === 'magma') { S.rMagma = k === '1'; sfx.tick(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const need = k === 'rules' ? 'diary' : 'wake', key = k === 'rules' ? 'sec1' : 'sec2';
    if (lab.view !== need) { goView(need); S[key] = true; } else S[key] = !S[key];
    if (key === 'sec2' && S.sec2 && S.wakeA === null) { S.wakeA = 'skip'; S.day = 60; S.dayV = 60; }
    sfx.click();
  }
  render();
});
$('wDay').addEventListener('input', (ev) => { S.day = +ev.target.value; S.play = false; render(); });
$('rY').addEventListener('input', (ev) => { S.rY = +ev.target.value; render(); });

// --- one render per change: controls, readout and the state card -------------------------------------------
const chipRow = (act, ids, label, current, disabled) => ids.map((k) => `<button class="vs-chip ${current === k ? 'on' : ''}" data-act="${act}" data-k="${k}"${disabled ? ' disabled' : ''}>${esc(label(k))}</button>`).join('');
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('vDiary').hidden = !(v === 'diary' && !S.sec1); $('vRules').hidden = !(v === 'diary' && S.sec1);
  $('vWake').hidden = v !== 'wake'; $('vMap').hidden = v !== 'map';
  const open = secret.unlocked();
  $('secRow').innerHTML = [['rules', '📖', 'sec1'], ['watch', '📡', 'sec2']].map(([k, emo, f]) =>
    `<button class="vs-chip secret ${open ? 'open' : ''} ${open && S[f] ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (v === 'diary') { if (S.sec1) renderRules(t); else renderDiary(t); }
  else if (v === 'wake') renderWake(t); else renderMap(t);
  lab.checkStage();
}
const fine = (t) => `<div class="vs-hint">${esc(t.fine)}</div>`;

function renderDiary(t) {
  const set = SETS[S.set], o = S.open, v = o >= 0 ? set[o] : null;
  lab.setGlow('rgba(255, 140, 70, .26)');
  $('dPick').innerHTML = set.map((_, i) => `<button class="vs-chip ${o === i ? 'on' : ''} ${S.lab[i] ? 'set' : ''}" data-act="dopen" data-k="${i}">🌋 ${i + 1}${S.lab[i] ? ' · ✓' : ''}</button>`).join('');
  $('dChips').innerHTML = chipRow('dlab', KEYS, (k) => t.st[k], o >= 0 ? S.lab[o] : null, o < 0 || S.checked);
  const all = S.lab.every(Boolean);
  $('dMain').textContent = S.checked ? t.d.more : t.d.check; $('dMain').disabled = !S.checked && !all;
  $('dHint').textContent = S.checked ? '' : (o < 0 ? t.d.pickFirst : all ? '' : t.d.needAll);
  // readout: the diary of the open volcano
  if (v) {
    const e = lastOf(v);
    if (e === null) lab.setReadout(`${fmt(20000)}+`, t.d.subNone, t.d.cnt(0), '#ff8a4c');
    else lab.setReadout(e === 0 ? '0' : fmt(e), e === 0 ? t.d.subNow : t.d.sub, t.d.cnt(v.e.length), '#ff8a4c');
  } else lab.setReadout('—', t.d.closed, '', '#ff8a4c');
  if (S.checked) {
    const k = S.lab.filter((l, i) => l === set[i].k).length;
    const lines = set.map((x, i) => `<div><b>${esc(t.vol(i + 1))}: ${esc(t.st[x.k])}.</b> ${esc(t.d.lastT(lastOf(x), fmt))}</div>`).join('');
    const rules = KEYS.map((q) => `<div><b>${esc(t.st[q])}:</b> ${esc(t.d.rule[q])}</div>`).join('');
    lab.setState({ emo: k === 3 ? '✅' : '📔', title: t.d.res(k), lead: t.d.resLead, body: '', extra: `<div class="vs-res">${lines}</div><div class="vs-rule">${rules}</div>` });
    lab.setFacts(t.facts.diary);
  } else if (v) {
    lab.setState({ emo: '📔', title: t.vol(o + 1), lead: t.d.oLead, body: `${t.d.under}: ${t.d.ug[v.k]}`, extra: fine(t) });
    lab.setFacts([]);
  } else {
    lab.setState({ emo: '🌋', title: t.d.cTitle, lead: t.d.cLead, body: t.d.cBody, extra: fine(t) });
    lab.setFacts([]);
  }
}
function renderRules(t) {
  const r = t.rb, y = S.rY, cal = y > 11700 ? 'extinct' : 'dormant', mag = S.rMagma ? 'dormant' : 'extinct', same = cal === mag;
  lab.setGlow('rgba(122, 208, 255, .24)');
  $('rQ').textContent = `${r.slider}: ${r.ago(fmt, y)}`;
  $('rChips').innerHTML = `<span class="vs-hint">${esc(r.magma)}:</span>` + [['1', r.yes], ['0', r.no]].map(([k, l]) => `<button class="vs-chip ${(k === '1') === S.rMagma ? 'on' : ''}" data-act="magma" data-k="${k}">${esc(l)}</button>`).join('');
  lab.setReadout(fmt(y), t.d.sub, same ? '=' : '≠', same ? '#8f9bb5' : '#ff6a3d');
  lab.setState({ emo: same ? '🤝' : '⚖️', title: same ? r.agree : r.differ, lead: same ? r.agreeLead : r.differLead, body: '',
    extra: `<div class="vs-rule"><div><b>${esc(r.cal)}:</b> ${esc(r.calRule)}</div><div><b>${esc(r.mag)}:</b> ${esc(r.magRule)}</div></div>` });
  lab.setFacts(t.facts.rules);
}
function renderWake(t) {
  const w = t.wk, ans = S.wakeA !== null, d = Math.round(S.day), st = w.stages[stageOf(d)];
  lab.setGlow('rgba(111, 174, 106, .26)');
  $('wAsk').hidden = ans; $('wCtl').hidden = !ans;
  $('wQ').textContent = w.q;
  $('wOpts').innerHTML = [['yes', w.yes], ['no', w.no]].map(([k, l]) => `<button class="vs-chip" data-act="wans" data-k="${k}">${esc(l)}</button>`).join('');
  $('wE0').textContent = ans ? dayDate(0, { day: 'numeric', month: 'long' }) : ''; $('wE1').textContent = ans ? dayDate(WDAYS, { day: 'numeric', month: 'long' }) : '';
  $('wPlay').textContent = S.play ? w.pause : w.play;
  $('wDay').value = d;
  $('wInst').innerHTML = S.sec2 ? ['q', 'g', 't'].map((k) => `<button class="vs-chip ${S.inst === k ? 'on' : ''}" data-act="inst" data-k="${k}">${esc(t.wt.names[k])}</button>`).join('') : '';
  if (!ans) {
    lab.setReadout('≈ 500', w.qSub, '', '#6fae6a');
    lab.setState({ emo: '🏘️', title: w.q, lead: w.qLead, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  lab.setReadout(dayDate(d, { day: 'numeric', month: 'short', year: 'numeric' }), w.sub, st[1], d >= 83 ? '#ff6a3d' : '#6fae6a');
  if (S.sec2) {
    const k = S.inst;
    lab.setState({ emo: '📡', title: t.wt.title, lead: t.wt.desc[k], body: t.wt.lead, extra: '' });
    lab.setFacts(t.facts.watch);
    return;
  }
  const first = S.wakeA !== 'skip' && d === 0, verdict = S.wakeA === 'yes' ? w.right : w.wrong;
  lab.setState(first ? { emo: S.wakeA === 'yes' ? '✅' : '🌋', title: verdict, lead: w.reveal, body: w.body, extra: '' }
    : { emo: st[0], title: st[2], lead: st[3], body: w.body, extra: '' });
  lab.setFacts(t.facts.wake);
}
function renderMap(t) {
  const m = t.mp, i = S.mi, v = i >= 0 ? VOLS[i] : null;
  lab.setGlow('rgba(122, 160, 230, .26)');
  $('mChips').innerHTML = chipRow('mlab', KEYS, (k) => t.st[k], v ? S.ml[i] : null, !v || S.mChecked);
  const all = S.ml.every(Boolean);
  $('mMain').textContent = S.mChecked ? m.again : m.check; $('mMain').disabled = !S.mChecked && !all;
  $('mHint').textContent = S.mChecked ? '' : (all ? '' : m.needAll);
  if (v) lab.setReadout(v[lang][4][0], v[lang][4][1], '', '#7aa0e6'); else lab.setReadout('—', m.cTitle, '', '#7aa0e6');
  if (S.mChecked) {
    const k = S.ml.filter((l, j) => l === VOLS[j].k).length;
    const lines = VOLS.map((x, j) => `<div><b>${j + 1}. ${esc(x[lang][0])}: ${esc(t.st[x.k])}.</b> ${esc(m.last)}: ${esc(x[lang][3])}.</div>`).join('');
    lab.setState({ emo: k === 6 ? '✅' : '🗺️', title: m.res(k), lead: m.resLead, body: '', extra: `<div class="vs-res">${lines}</div><div class="vs-rule">${KEYS.map((q) => `<div><b>${esc(t.st[q])}:</b> ${esc(t.d.rule[q])}</div>`).join('')}</div>` });
    lab.setFacts(t.facts.map);
  } else if (v) {
    lab.setState({ emo: '🌋', title: v[lang][0], lead: v[lang][2], body: `${m.last}: ${v[lang][3]}.`, extra: fine(t) });
    lab.setFacts([]);
  } else {
    lab.setState({ emo: '🗺️', title: m.cTitle, lead: m.cLead, body: m.cBody, extra: fine(t) });
    lab.setFacts([]);
  }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  tick(dt);
  const v = lab.view;
  if (v === 'diary') (S.sec1 ? drawRules : drawDiary)(c, w, h, time);
  else if (v === 'wake') drawWake(c, w, h, time);
  else drawMap(c, w, h, time);
});
render();
</script>
</body>
</html>
