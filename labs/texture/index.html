const PH = 104, BW = 26, PY0 = 14, PY1 = 198;

    singer(ctx, 22, y0 + LH / 2, 11, v.color, playing && noteAt(v, beat), t, i, false);
  });
  // clashes: red bands over the lanes and ticks in the strip below
  const top = LANE0, bot = laneY(3) + LH, bw = LW / TOT;
  for (const b of cl) {
    const flash = playing && beat >= b && beat < b + 1;
    ctx.fillStyle = flash ? 'rgba(255,70,70,.7)' : 'rgba(255,70,70,.38)'; ctx.fillRect(bx(b), top, bw, bot - top);
  }
  ctx.fillStyle = '#12162c'; rr(ctx, LX0 - 2, bot + 8, LW + 4, 16, 8); ctx.fill();
  for (const b of cl) { ctx.fillStyle = '#ff5a5a'; rr(ctx, bx(b), bot + 10, Math.max(2.5, bw), 12, 3); ctx.fill(); }
  pill(ctx, tt.clashPill(cl.length), W / 2, bot + 42);
  // start knobs for voices 2..4
  S.starts.forEach((s, i) => {
    const cx = bx(s), cy = laneY(i + 1) + LH / 2, col = RCOL[i + 1];
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    const g = ctx.createRadialGradient(cx - 3, cy - 4, 1, cx, cy, 12); g.addColorStop(0, '#fff'); g.addColorStop(1, shade(col, 0.1));
    ctx.fillStyle = g; ctx.strokeStyle = shade(col, -0.5); ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(cx, cy, 11, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.fillStyle = '#2a2f4a'; ctx.beginPath(); ctx.moveTo(cx - 7, cy); ctx.lineTo(cx - 3, cy - 4); ctx.lineTo(cx - 3, cy + 4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 7, cy); ctx.lineTo(cx + 3, cy - 4); ctx.lineTo(cx + 3, cy + 4); ctx.fill();
  });
  if (playing) { ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx(beat), top - 4); ctx.lineTo(bx(beat), bot + 4); ctx.stroke(); }
}

// --- main loop ---------------------------------------------------------------------------------------------
canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  const bgf = ctx.createLinearGradient(0, 0, 0, h); bgf.addColorStop(0, '#12172f'); bgf.addColorStop(1, '#0a0d1c');
  ctx.fillStyle = bgf; ctx.fillRect(0, 0, w, h);
  const s = Math.min(w / W, h / H);
  K.s = s; K.ox = (w - W * s) / 2; K.oy = (h - H * s) / 2;
  ctx.save(); ctx.translate(K.ox, K.oy); ctx.scale(s, s);
  const beat = beatNow(), playing = !!S.play;
  if (S.play && beat > S.play.prog.len + 0.5) { stopPlay(); render(); }
  const v = lab.view;
  if (v === 'build') drawBuild(ctx, beat, t, playing);
  else if (v === 'three') {
    const prog = S.play ? S.play.prog : progFor(S.mode);
    drawRoll(ctx, prog, S.play ? beat : 0, t); drawSingers(ctx, prog, beat, t, playing);
    readout();
  } else {
    const m = S.m, target = m.reveal ? 1 : 0;
    m.cp = clamp(m.cp + (target ? dt / 1.1 : -dt / 0.3), 0, 1);
    if (m.cp > 0 || m.fin) { const prog = S.play ? S.play.prog : mProg(); drawRoll(ctx, prog, S.play ? beat : 0, t); drawSingers(ctx, prog, beat, t, playing); }
    if (!m.fin) drawCurtain(ctx, m.cp, t, playing);
  }
  ctx.restore();
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const setStart = (i, b) => {
  b = clamp(Math.round(b), 1, 24);
  if (S.starts[i] === b) return;
  S.starts[i] = b; if (S.play) stopPlay(); sfx.tick(); render();
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, view = lab.view;
  if (act === 'play') {
    if (S.play) { sfx.click(); stopPlay(); render(); return; }
    sfx.click(); S.seen = true;
    if (view === 'three') startPlay(progFor(S.mode));
    else if (view === 'match') { startPlay(mProg()); S.m.heard = true; }
    else startPlay(progFor('build', { starts: S.starts }));
    render();
  } else if (act === 'mode') { sfx.click(); S.mode = b.dataset.k; S.seen = true; startPlay(progFor(S.mode)); render(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    sfx.click(); S.mode = b.dataset.k; S.seen = true; startPlay(progFor(S.mode)); render();
  } else if (act === 'pick') {
    const m = S.m; if (m.reveal || !m.heard) return;
    m.picked = +b.dataset.k; m.reveal = true;
    const ok = KEYS[m.picked] === keyOf(m.kinds[m.i]);
    if (ok) m.score++;
    (ok ? sfx.good : sfx.bad)(); startPlay(mProg()); render(); showStage();
  } else if (act === 'next') {
    const m = S.m; sfx.click(); stopPlay();
    if (m.fin) { newGame(); render(); return; }
    if (m.i >= 4) { m.fin = true; m.reveal = false; m.cp = 0; }
    else Object.assign(m, { i: m.i + 1, picked: null, heard: false, reveal: false, cp: 0, order: shuffle([0, 1, 2]) });
    render();
  } else if (act === 'st') { setStart(+b.dataset.i, S.starts[+b.dataset.i] + +b.dataset.d); }
  else if (act === 'pre') { S.starts = b.dataset.k.split(',').map(Number); stopPlay(); sfx.snap(); render(); }
});
// dragging the start knobs (or tapping a lane) in view 3
const cvEl = $('cv');
const toDesign = (ev) => { const r = cvEl.getBoundingClientRect(); return { x: (ev.clientX - r.left - K.ox) / K.s, y: (ev.clientY - r.top - K.oy) / K.s }; };
const startAt = (x) => (x - LX0) * TOT / LW;
cvEl.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'build') return;
  const p = toDesign(ev);
  let best = -1, bd = 1e9;
  S.starts.forEach((s, i) => { const d = Math.hypot(p.x - bx(s), p.y - (laneY(i + 1) + LH / 2)); if (d < bd) { bd = d; best = i; } });
  if (bd > 24) { // a tap inside a lane moves that lane's voice there
    best = -1;
    for (let i = 1; i < 4; i++) if (p.y >= laneY(i) && p.y <= laneY(i) + LH && p.x >= LX0 - 4 && p.x <= LX0 + LW + 4) best = i - 1;
    if (best < 0) return;
  }
  S.drag = best; try { cvEl.setPointerCapture(ev.pointerId); } catch { /* no capture */ }
  ev.preventDefault(); setStart(best, startAt(p.x));
});
cvEl.addEventListener('pointermove', (ev) => { if (S.drag >= 0) setStart(S.drag, startAt(toDesign(ev).x)); });
const endDrag = () => { S.drag = -1; };
cvEl.addEventListener('pointerup', endDrag); cvEl.addEventListener('pointercancel', endDrag);

// --- render: texts, controls, readouts ---------------------------------------------------------------------
function readout(force) {
  const t = T[lang];
  let val, sub, pillT = '', color = COL.gold;
  if (lab.view === 'three') {
    const prog = S.play ? S.play.prog : progFor(S.mode), beat = beatNow();
    const n = S.play ? prog.voices.filter((v) => !v.block && !v.mate && noteAt(v, beat)).length : 0;
    val = String(n); sub = t.three.ro; pillT = t.terms[S.mode] + (S.mode === 'homo' ? ' ' + t.three.roChords : '');
  } else if (lab.view === 'match') {
    const m = S.m; color = '#d9825f';
    val = m.fin ? `${m.score}/5` : `${m.i + 1}/5`; sub = m.fin ? '' : `✓ ${m.score}`;
  } else {
    const n = clashBeats(S.starts).length; color = '#ff7a7a';
    val = String(n); sub = t.build.sub;
  }
  const key = [lab.view, val, sub, pillT, lang].join('|');
  if (!force && key === S.rk) return;
  S.rk = key; lab.setReadout(val, sub, pillT, color);
}
const barText = (tb, s) => (s % 4 === 0 ? tb.bar(s / 4 + 1) : tb.barBeat(Math.floor(s / 4) + 1, (s % 4) + 1));
// small ribbon pictures for the answer buttons
function thumb(k) {
  const g = '#f2c14e', b = '#6fa8ff', c = '#ff8a6b', tl = '#4fd1c5';
  const ys = [30, 25, 20, 30, 20, 15, 10, 10]; // contour of the tune
  const rib = (dx, dy, col) => ys.map((yy, j) => `<rect x="${6 + dx + j * 10}" y="${yy + dy}" width="8.5" height="6" rx="3" fill="${col}" stroke="rgba(0,0,0,.35)" stroke-width=".8"/>`).join('');
  const blocks = [0, 2, 4, 6].map((j) => [0, 1, 2].map((r) => `<rect x="${6 + j * 10}" y="${36 + r * 7}" width="18.5" height="6" rx="2.5" fill="${b}" fill-opacity=".75" stroke="rgba(0,0,0,.35)" stroke-width=".8"/>`).join('')).join('');
  const body = k === 'one' ? rib(0, 6, g) : k === 'chords' ? rib(0, -6, g) + blocks : rib(0, -8, g) + rib(24, 2, c) + rib(48, 12, tl);
  return `<svg viewBox="0 0 100 58" aria-hidden="true"><rect x=".5" y=".5" width="99" height="57" rx="9" fill="#171c3a" stroke="#2d3868"/>${body}</svg>`;
}

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secThree').hidden = v !== 'three'; $('secMatch').hidden = v !== 'match'; $('secBuild').hidden = v !== 'build';
  const playing = !!S.play;
  if (v === 'three') {
    lab.setGlow('rgba(242,193,78,.2)');
    const open = secret.unlocked();
    const sc = (k, emo, sk) => `<button class="chip secret ${open ? 'open' : ''} ${S.mode === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.sec[sk][0])}` : '🔒 ???'}</button>`;
    $('txChips').innerHTML = ['mono', 'homo', 'round'].map((k) => `<button class="chip ${S.mode === k ? 'on' : ''}" data-act="mode" data-k="${k}">${esc(t.chips[k])}</button>`).join('')
      + sc('chant', '⛪', 'chant') + sc('mirror', '🪞', 'mirror');
    $('plA').textContent = playing ? t.stop : t.play;
    const st = S.seen ? t.three[S.mode] : t.three.idle;
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
    lab.setFacts(t.facts.three);
  } else if (v === 'match') {
    lab.setGlow('rgba(217,130,95,.2)');
    const m = S.m, kind = m.kinds[m.i], right = keyOf(kind), tm = t.match;
    $('txThumbs').innerHTML = m.fin ? '' : m.order.map((k) => {
      const cls = m.reveal ? (KEYS[k] === right ? 'ok' : k === m.picked ? 'no' : '') : '';
      return `<button class="tx-th ${cls}" data-act="pick" data-k="${k}"${m.heard && !m.reveal ? '' : ' disabled'}>${thumb(KEYS[k])}<span>${esc(tm.lbl[KEYS[k]])}</span></button>`;
    }).join('');
    $('plB').textContent = m.fin ? '' : playing ? t.stop : m.heard ? t.replay : t.play;
    $('plB').hidden = m.fin;
    $('nxB').hidden = !(m.reveal || m.fin);
    $('nxB').textContent = m.fin ? t.again : t.next;
    if (m.fin) {
      lab.setState({ emo: '🏆', title: tm.end(m.score), lead: m.score >= 4 ? tm.endGood : tm.endTry, body: '', extra: '' });
    } else if (!m.reveal) {
      lab.setState({ emo: tm.start[0], title: m.heard ? tm.pick : tm.start[1], lead: m.heard ? '' : tm.start[2], body: m.heard ? '' : tm.first, extra: '' });
    } else {
      const ok = KEYS[m.picked] === right;
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? tm.right : tm.wrong, lead: tm.why[kind], body: '', extra: '' });
    }
    lab.setFacts(t.facts.match);
  } else {
    lab.setGlow('rgba(255,100,100,.18)');
    const tb = t.build, n = clashBeats(S.starts).length;
    $('txSteps').innerHTML = S.starts.map((s, i) => `<div class="tx-sp"><span class="lbl" style="color:${RCOL[i + 1]}">${esc(tb.vname(i + 2))}</span>
      <span class="v">${esc(barText(tb, s))}</span>
      <div class="pm"><button class="tx-sb" data-act="st" data-i="${i}" data-d="-1" aria-label="−"${s <= 1 ? ' disabled' : ''}>−</button><button class="tx-sb" data-act="st" data-i="${i}" data-d="1" aria-label="+"${s >= 24 ? ' disabled' : ''}>+</button></div></div>`).join('');
    $('plC').textContent = playing ? t.stop : t.play;
    const pre = (k, label) => `<button class="chip ${S.starts.join(',') === k ? 'on' : ''}" data-act="pre" data-k="${k}">${esc(label)}</button>`;
    $('txPre').innerHTML = pre('8,16,24', tb.p2) + pre('4,8,12', tb.p1) + pre('3,6,9', tb.p3);
    $('txHint').textContent = tb.hint;
    const st = n === 0 ? tb.ok : tb.bad;
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
    lab.setFacts(t.facts.build);
  }
  readout(true);
  lab.checkStage?.();
}
render();
</script>
</body>
</html>
