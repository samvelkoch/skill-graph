      pill(c, T[lang].sp.clayTag, lx, ly + 20, { align: 'c' });
    }
  }
  if (m === 'oasis') {
    OAS_PALMS.forEach((px, i) => {
      const reach = surf(px) - (OAS_WT - 1.2), tg = clamp01(reach / 1.0);
      S.palm[i] += (tg - S.palm[i]) * (1 - Math.exp(-dt * (tg > S.palm[i] ? 1.6 : 4)));
      drawPalm(c, px, surf(px), S.palm[i], time, i % 2 ? 1 : -1);
    });
  }
  if (m === 'art') drawArt(c, dt, time, surf);

  // labels
  const t = T[lang];
  if (m === 'sponge') {
    const ys = { soil: 0.5, sand: 3.5, gravel: 8, clay: 11, rock: 14.2 };
    Object.entries(ys).forEach(([k, d]) => pill(c, t.lay[k], cw - 6, Y(d), { align: 'r', fill: 'rgba(10,14,28,.62)' }));
    if (rv > 0.6) pill(c, t.wtLbl, cw - 6, Y(WT1 + 1.45), { align: 'r', fill: 'rgba(20,70,140,.85)' });
  } else if (m === 'well') {
    pill(c, t.wtLbl, cw - 6, Y(wtOf(S.wxV) + 1.35), { align: 'r', fill: 'rgba(20,70,140,.85)' });
    const wi = S.wxV < 0.3 ? 0 : S.wxV > 0.7 ? 2 : 1;
    pill(c, `${['☀️', '⛅', '🌧️'][wi]} ${t.wxN[wi]}`, 8, 16);
    if (S.bk.show) pill(c, S.bk.show === 'full' ? t.bFull : t.bEmpty, X(WELL_X) + 24, Y(-3.4), { fill: S.bk.show === 'full' ? 'rgba(30,110,190,.92)' : 'rgba(110,60,30,.92)' });
  } else if (m === 'spring') {
    pill(c, t.wtLbl, X(1.5), Y(wt3(1.5) + 1.25), { fill: 'rgba(20,70,140,.85)' });
    pill(c, t.sp.spring, X(X_SPRING) - 4, Y(sf3(X_SPRING)) - 22, { align: 'c' });
    pill(c, t.sp.lake, X(LAKE_C), Y(wt3(LAKE_C)) - 14, { align: 'c' });
    pill(c, t.sp.wellTag, X(WELL3_X), Y(-5.2), { align: 'c' });
    pill(c, t.sp.spillTag, X(LEAK_X + 0.6), Y(-2.9), { align: 'c', fill: 'rgba(110,30,140,.85)' });
    if (P.on) pill(c, t.sp.year(Math.floor(P.yr)), 8, 16);
  } else if (m === 'oasis') {
    pill(c, t.wtLbl, cw - 6, Y(OAS_WT + 1.4), { align: 'r', fill: 'rgba(20,70,140,.85)' });
    if (!S.oasTouched) pill(c, `⇣ ${t.oas.drag}`, X(16), Y(-2.5), { align: 'c', fill: 'rgba(120,80,10,.9)' });
  }

  // the zoom bubble
  if (m === 'sponge') {
    const R = clamp(Math.min(w * 0.24, h * 0.31), 54, 104), cx = R + 10, cy = R + 10, kind = S.grain;
    const rev = S.rev.sponge;
    S.markV += (GR_MID[kind] - S.markV) * (1 - Math.exp(-dt * 8));
    if (rev > 0.01) { // the highlighted layer, the marker and the line to the bubble
      const [a, b] = GR_BAND[kind], pulse = 0.5 + 0.5 * Math.sin(time * 3);
      c.save(); c.globalAlpha = rev;
      bandPath(c, () => a, () => b); c.fillStyle = `rgba(255,255,255,${0.07 + 0.07 * pulse})`; c.fill();
      c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1.5; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(-4, Y(a)); c.lineTo(cw + 4, Y(a)); c.moveTo(-4, Y(b)); c.lineTo(cw + 4, Y(b)); c.stroke(); c.setLineDash([]);
      const mx = X(22.5), my = Y(S.markV), ang = Math.atan2(my - cy, mx - cx);
      c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.5; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(cx + Math.cos(ang) * (R + 4), cy + Math.sin(ang) * (R + 4)); c.lineTo(mx, my); c.stroke(); c.setLineDash([]);
      c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(mx, my, 8 + pulse * 2, 0, TAU); c.stroke();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(mx, my, 2.5, 0, TAU); c.fill(); c.restore();
    }
    drawLens(c, cx, cy, R, kind, rev, time, dt);
  }

  if (time - lastInfo > 0.12) { lastInfo = time; renderInfo(); }
};

// --- the artesian secret --------------------------------------------------------------------------------------
function drawArt(c, dt, time, surf) {
  const A = S.art, t = T[lang], { ctTop, ctBot, bcTop } = artLines();
  // rain on the hills
  stepRain(dt, 14, 0, 9, -17.5, surf, null, false);
  drawRain(c);
  // water moving through the sand, faster under higher hills
  const v = 1.2 + 0.25 * A.Hv;
  c.save(); c.fillStyle = 'rgba(225,245,255,.85)';
  for (let i = 0; i < 38; i++) {
    const x = ((hs(i) * 40 + time * v) % 38.5) + 0.6, y = (ctBot(x) + bcTop(x)) / 2 + (hs(i + 60) - 0.5) * Math.max(0.5, bcTop(x) - ctBot(x)) * 0.7;
    c.beginPath(); c.arc(X(x), Y(y), 1.8, 0, TAU); c.fill();
  }
  c.restore();
  // the level the water would rise to
  const hy = Y(headY());
  c.save(); c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.5; c.setLineDash([7, 6]); c.beginPath(); c.moveTo(0, hy); c.lineTo(cw, hy); c.stroke(); c.restore();
  // drilling
  const head = -headY(), hf = FR * head;
  if (A.drilling) { A.dr += dt / 1.5; if (A.dr >= 1) { A.drilling = false; A.drilled = true; sfx.good(); } }
  if (A.drilled) A.gush = clamp01(A.gush + dt / 0.9);
  const px = X(ART_X), u = sc;
  if (A.drilling || A.drilled) {
    const bitY = A.drilled ? 4.2 : mix(-1.4, 4.3, easeIO(clamp01(A.dr)));
    c.save(); c.lineCap = 'round';
    c.strokeStyle = A.drilled ? '#9aa3b6' : '#c8cede'; c.lineWidth = Math.max(3, 0.34 * u); c.beginPath(); c.moveTo(px, Y(A.drilled ? -0.5 : -1.4)); c.lineTo(px, Y(bitY)); c.stroke();
    if (!A.drilled) {
      c.fillStyle = '#e8edf8'; c.beginPath(); c.roundRect(px - 0.7 * u, Y(-2.1), 1.4 * u, 0.7 * u, 3); c.fill();
      c.fillStyle = '#f2c84c'; c.beginPath(); c.moveTo(px - 0.34 * u, Y(bitY)); c.lineTo(px + 0.34 * u, Y(bitY)); c.lineTo(px, Y(bitY + 0.6)); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1; for (let k = 0; k < 3; k++) { const yy = Y(-1.2 + k * 1.3 + ((time * 6) % 1.3) * 0); c.beginPath(); c.moveTo(px - 4, yy + ((time * 30) % 10)); c.lineTo(px + 4, yy + ((time * 30) % 10) + 3); c.stroke(); }
    }
    c.restore();
  }
  // the fountain: real ballistics, v = sqrt(2 g h)
  if (A.gush > 0.01) {
    fountAcc += 110 * A.gush * dt;
    while (fountAcc >= 1) { fountAcc -= 1; if (fount.length < 340) { const v0 = Math.sqrt(2 * 9.8 * hf * A.gush * A.gush) * (0.97 + Math.random() * 0.06); fount.push({ x: ART_X, y: -0.55, vx: gauss() * 0.45, vy: -v0 }); } }
  }
  c.save(); c.fillStyle = 'rgba(170,222,255,.95)'; c.strokeStyle = 'rgba(210,240,255,.5)'; c.lineWidth = 1;
  for (let i = fount.length - 1; i >= 0; i--) {
    const f = fount[i]; f.vy += 9.8 * dt; f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.y >= 0) { fount.splice(i, 1); splash.push({ x: f.x, y: 0, vx: (Math.random() - 0.5) * 2, vy: -1.5 - Math.random() * 1.5, t: 0 }); continue; }
    const qx = X(f.x), qy = Y(f.y); c.beginPath(); c.moveTo(qx - f.vx * 0.03 * u, qy - f.vy * 0.03 * u); c.lineTo(qx, qy); c.stroke();
    c.beginPath(); c.arc(qx, qy, Math.max(1.6, 0.15 * u), 0, TAU); c.fill();
  }
  c.restore();
  if (A.drilled) { c.fillStyle = 'rgba(120,200,255,.55)'; c.beginPath(); c.ellipse(px, Y(0) + 1, 1.7 * u * A.gush, 0.22 * u, 0, 0, TAU); c.fill(); }
  // labels
  pill(c, t.art.rain, 6, Y(shArt(0.6)) - 16);
  pill(c, t.art.aq, X(24.2), Y((ctBot(20) + bcTop(20)) / 2 + 0.05), { align: 'r', fill: 'rgba(20,70,140,.85)' });
  pill(c, t.sp.clayTag, X(31.8), Y((ctTop(33) + ctBot(33)) / 2), { align: 'c' });
  pill(c, t.art.head, cw - 6, hy - 14, { align: 'r' });
  void hf;
}

const cv = $('cv'), memo = {};
const once = (k, v, fn) => { const s = JSON.stringify(v); if (memo[k] === s) return; memo[k] = s; fn(v); };
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const PK = { sponge: 'p1', well: 'p2', spring: 'p3' };
const wellWet = () => S.wellD > wtOf(S.wxV) + 0.05;

function renderInfo() {
  const t = T[lang], m = mode(), v = lab.view, st = (o) => once('st', o, (x) => lab.setState(x)), ro = (a) => once('ro', a, (x) => lab.setReadout(...x));
  if (m === 'oasis') {
    const gap = Math.max(0, OAS_WT - S.oasV), yes = gap < 0.05;
    lab.setGlow('rgba(240,176,80,.26)');
    ro([`${fmt(gap)} ${lang === 'ru' ? 'м' : 'm'}`, t.oas.gap, yes ? t.oas.pill : '', '#f0b050']);
    st(yes ? { emo: '🌴', title: t.oas.yes[0], lead: t.oas.yes[1], body: t.oas.yes[2], extra: '' } : { emo: '🏜️', title: t.oas.dry[0], lead: t.oas.dry[1], body: '', extra: '' });
    return;
  }
  if (m === 'art') {
    const A = S.art, hf = FR * -headY(), hh = Math.round(A.Hv * 2) / 2, u = lang === 'ru' ? 'м' : 'm';
    lab.setGlow('rgba(78,168,255,.26)');
    if (A.drilled) {
      ro([`${fmt(hf)} ${u}`, t.art.fH, `${t.art.hills}: ${fmt(hh)} ${u}`, '#4ea8ff']);
      st({ emo: '⛲', title: t.art.after[0], lead: t.art.after[1](fmt(hf)), body: '', extra: `<div class="fine">${esc(t.art.note)}</div>` });
    } else {
      ro([`${fmt(-headY())} ${u}`, `${lang === 'en' ? 'water pressure: height above the ground' : lang === 'ru' ? 'напор: высота над землёй' : 'nyomás: magasság a talaj felett'}`, `${t.art.hills}: ${fmt(hh)} ${u}`, '#4ea8ff']);
      st({ emo: '🌋', title: t.art.before[0], lead: t.art.before[1], body: t.art.before[2], extra: '' });
    }
    return;
  }
  const g = S.g[v], pk = t[PK[v]];
  if (g === null) {
    lab.setGlow('rgba(78,168,255,.26)');
    ro(['?', t.pickFirst, '', '#4ea8ff']);
    st({ emo: '🤔', title: pk.q, lead: t.pickLead, body: '', extra: '' });
    return;
  }
  const u = lang === 'ru' ? 'м' : 'm';
  if (v === 'sponge') {
    const k = S.grain, [a, b] = GR_POR[k];
    lab.setGlow('rgba(78,168,255,.26)');
    ro([`${a}–${b} %`, t.por, `${t.pass}: ${t.perm[k]}`, '#4ea8ff']);
    st({ emo: ['🪨', '🏖️', '🧱'][k], title: t.gr[k][0], lead: t.gr[k][1], body: t.gr[k][2], extra: '' });
  } else if (v === 'well') {
    const wt = wtOf(S.wxV), wet = wellWet();
    lab.setGlow('rgba(224,176,80,.24)');
    ro([`${fmt(wt)} ${u}`, `${t.wtDepth} · ${t.wellWord} ${fmt(S.wellD)} ${u}`, wet ? t.waterYes : t.waterNo, '#f5c84c']);
    st(wet ? { emo: '💧', title: t.wet[0], lead: t.wet[1](fmt(S.wellD - wt)), body: t.wet[2], extra: '' }
      : { emo: '🏜️', title: t.dry[0], lead: t.dry[1](fmt(wt), fmt(S.wellD)), body: t.dry[2], extra: '' });
  } else {
    const ph = P.springYr !== null ? 'spring' : P.wellYr !== null ? 'well' : P.hit ? 'table' : S.clay && P.perched ? 'clay' : 'seep';
    const e = t.sp.ph[ph], lead = typeof e[2] === 'function' ? e[2](fmt(ph === 'seep' ? U_V : U_SAT, ph === 'seep' ? 1 : 0)) : e[2];
    lab.setGlow('rgba(214,92,240,.22)');
    ro([t.sp.year(Math.floor(P.yr)), t.sp.age, `${t.sp.wellWord}: ${P.wellYr !== null ? t.sp.polluted : t.sp.clean}`, '#d55cf0']);
    st({ emo: e[0], title: e[1], lead, body: t.sp.body, extra: `<div class="fine">${esc(t.sp.note(fmt(YR, 0)))}</div>` });
  }
}

function render() {
  const t = T[lang], m = mode(), v = lab.view, sec = S.sec, g = S.g[v], answered = g !== null;
  // prediction block
  const pk = t[PK[v]], askKey = `${v}|${lang}|${g}|${sec}`;
  $('gwAsk').hidden = !!sec;
  if (memo.ask !== askKey) {
    memo.ask = askKey;
    $('gwAsk').innerHTML = g === null
      ? `<p class="gw-q">${esc(pk.q)}</p><div class="gw-opts">${pk.opts.map((o, i) => `<button class="gw-opt" type="button" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
      : `<p class="gw-q small">${esc(pk.q)}</p><p class="gw-res ${g === pk.ok ? 'ok' : 'no'}">${esc(g === pk.ok ? pk.right : pk.wrong)}</p>`;
  }
  $('gwS1').hidden = !(!sec && v === 'sponge' && answered);
  $('gwS2').hidden = !(!sec && v === 'well' && answered);
  $('gwS3').hidden = !(!sec && v === 'spring' && answered);
  $('gwSO').hidden = sec !== 'oasis'; $('gwSA').hidden = sec !== 'art';
  // Sponge
  $('gwGL').textContent = t.grainLbl; $('gwGV').textContent = t.lay[['gravel', 'sand', 'clay'][S.grain]]; $('gwGrain').value = S.grain;
  $('gwStops').innerHTML = ['gravel', 'sand', 'clay'].map((k, i) => `<button type="button" class="gw-stop ${i === S.grain ? 'on' : ''}" data-grain="${i}">${esc(t.lay[k])}</button>`).join('');
  // Well
  const um = lang === 'ru' ? 'м' : 'm';
  $('gwDL').textContent = t.wellLbl; $('gwDV').textContent = `${fmt(S.wellD)} ${um}`; $('gwDepth').value = Math.round(S.wellD * 10);
  $('gwWL').textContent = t.wxLbl; $('gwWV').textContent = ['☀️', '⛅', '🌧️'][S.wx < 0.3 ? 0 : S.wx > 0.7 ? 2 : 1]; $('gwWx').value = Math.round(S.wx * 100);
  $('gwE0').textContent = t.wxEnds[0]; $('gwE1').textContent = t.wxEnds[1]; $('gwDraw').textContent = t.draw;
  // Spring
  $('gwClay').textContent = t.sp.clayTog[S.clay ? 1 : 0]; $('gwClay').classList.toggle('on', S.clay); $('gwAgain').textContent = t.sp.again;
  // Secrets
  $('gwOL').textContent = t.oas.lbl; $('gwOV').textContent = `${fmt(S.oas)} ${um}`; $('gwOas').value = Math.round(S.oas * 10);
  $('gwAL').textContent = t.art.lbl; $('gwAV').textContent = `${fmt(S.art.H, 1)} ${um}`; $('gwHill').value = S.art.H;
  $('gwDrill').textContent = S.art.drilled || S.art.drilling ? t.art.plug : t.art.drill;
  const open = secret.unlocked();
  $('gwSecs').hidden = !sec && !answered;
  $('gwSecs').innerHTML = [['oasis', '🏜️', 'a'], ['art', '🌋', 'b']].map(([k, e, s]) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${e} ${esc(t.secrets[s][0])}` : '🔒 ???'}</button>`).join('');
  cv.style.touchAction = (m === 'well' && answered) || m === 'oasis' ? 'none' : 'pan-y';
  // picture-side text
  renderInfo();
  const fl = !sec && (v !== 'sponge' || answered) ? t.facts[v] : [];
  lab.setFacts(fl);
}

// --- events -------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const t = T[lang], v = lab.view, o = ev.target.closest('.gw-opt');
  if (o) {
    const i = +o.dataset.i, pk = t[PK[v]];
    if (S.g[v] !== null) return;
    S.g[v] = i; (i === pk.ok ? sfx.good : sfx.bad)();
    if (v === 'sponge') { S.lensT = 0; lensInit(S.grain); }
    if (v === 'well') { S.wx = 0; setTimeout(() => { if (lab.view === 'well' && !S.sec) runBucket(); }, 4200); }
    if (v === 'spring') resetSim();
    showStage(); render(); return;
  }
  const gs = ev.target.closest('[data-grain]');
  if (gs) { S.grain = +gs.dataset.grain; S.lensT = 0; lensInit(S.grain); sfx.tick(); render(); return; }
  const sc2 = ev.target.closest('[data-sec]');
  if (sc2) {
    if (!secret.unlocked()) { secret.open(); return; }
    const k = sc2.dataset.sec; S.sec = S.sec === k ? null : k; S.drag = null; sfx.click();
    if (S.sec === 'oasis') { S.oasTouched = false; }
    render(); return;
  }
  const id = ev.target.closest('button')?.id;
  if (id === 'gwDraw') { runBucket(); render(); }
  else if (id === 'gwClay') { S.clay = !S.clay; resetSim(); sfx.click(); render(); }
  else if (id === 'gwAgain') { resetSim(); sfx.click(); render(); }
  else if (id === 'gwDrill') {
    const A = S.art;
    if (A.drilled || A.drilling) { A.drilled = false; A.drilling = false; A.dr = 0; A.gush = 0; fount.length = 0; sfx.click(); }
    else { A.drilling = true; A.dr = 0; sfx.push(); }
    render();
  }
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, val = +ev.target.value;
  if (id === 'gwGrain') { S.grain = val; S.lensT = 0; lensInit(val); sfx.tick(); }
  else if (id === 'gwDepth') { S.wellD = val / 10; S.touched = true; S.bk.full = false; S.bk.show = null; }
  else if (id === 'gwWx') { S.wx = val / 100; S.bk.full = false; S.bk.show = null; }
  else if (id === 'gwOas') { S.oas = val / 10; S.oasTouched = true; }
  else if (id === 'gwHill') { S.art.H = val; }
  else return;
  render();
});
$('ctrlBody').addEventListener('change', (ev) => { if (ev.target.id === 'gwDepth' || ev.target.id === 'gwWx') { runBucket(); } });

// dragging on the picture: the bottom of the well, the ground of the oasis, a layer to look at
cv.addEventListener('pointerdown', (ev) => {
  const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top, m = mode();
  if (m === 'well' && S.g.well !== null) {
    const hy = Y(0) + S.wellD * sc + 15;
    if (Math.abs(px - X(WELL_X)) < 44 && Math.abs(py - hy) < 36) { S.drag = 'well'; S.dOff = py - hy; S.touched = true; cv.setPointerCapture(ev.pointerId); ev.preventDefault(); }
  } else if (m === 'oasis') { S.drag = { k: 'oas', y0: py, v0: S.oas }; S.oasTouched = true; cv.setPointerCapture(ev.pointerId); ev.preventDefault(); }
  else if (m === 'sponge' && S.g.sponge !== null) {
    const d = (py - Y(0)) / sc, k = d >= 1 && d < 6 ? 1 : d >= 6 && d < 10 ? 0 : d >= 10 && d < 12 ? 2 : -1;
    if (k >= 0 && k !== S.grain) { S.grain = k; S.lensT = 0; lensInit(k); sfx.tick(); render(); }
  }
});
cv.addEventListener('pointermove', (ev) => {
  if (!S.drag) return;
  const r = cv.getBoundingClientRect(), py = ev.clientY - r.top;
  if (S.drag === 'well') { S.wellD = clamp((py - S.dOff - 15 - Y(0)) / sc, WD_MIN, WD_MAX); S.bk.full = false; S.bk.show = null; }
  else if (S.drag.k === 'oas') S.oas = clamp(S.drag.v0 + (py - S.drag.y0) / sc, 0, OAS_MAX);
  render();
});
const endDrag = () => { const d = S.drag; S.drag = null; if (d === 'well') runBucket(); };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

lensInit(S.grain);
canvasLoop($('cv'), frame);
render();
</script>
</body>
</html>
