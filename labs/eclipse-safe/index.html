  c.beginPath(); c.moveTo(SUN.x + nx * SUN.r, SUN.y + ny * SUN.r); c.lineTo(SUN.x - nx * SUN.r, SUN.y - ny * SUN.r); c.lineTo(hx, hy); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(hx, hy); c.lineTo(IMG[0] + nx * spread, IMG[1] + ny * spread); c.lineTo(IMG[0] - nx * spread, IMG[1] - ny * spread); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(hx, hy); c.lineTo(IMG[0] + nx * spread, IMG[1] + ny * spread); c.moveTo(hx, hy); c.lineTo(IMG[0] - nx * spread, IMG[1] - ny * spread); c.stroke();
  if (m === 'colander') {
    const pts = [[0, 0]]; for (let i = 0; i < 6; i++) { const a = i * TAU / 6; pts.push([Math.cos(a) * 10, Math.sin(a) * 10], [Math.cos(a + 0.52) * 19, Math.sin(a + 0.52) * 19]); }
    pts.forEach(([dx, dy]) => { const x = IMG[0] - dx * 1.7, y = IMG[1] - dy * 1.7; sunImage(c, x, y, 4.6, ux, uy, d, '#ffcf3f'); });
    c.fillStyle = lin(c, hx - 26, hy - 26, hx + 26, hy + 26, [[0, '#e3e8f0'], [1, '#8b95a8']]); c.beginPath(); c.arc(hx, hy, 26, 0, TAU); c.fill(); c.strokeStyle = '#5d667a'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#1b2233'; pts.forEach(([dx, dy]) => { c.beginPath(); c.arc(hx + dx, hy + dy, 2.2, 0, TAU); c.fill(); });
  } else {
    sunImage(c, IMG[0], IMG[1], imR, ux, uy, d, '#ffcf3f');
    c.fillStyle = '#2d3a5c'; c.beginPath(); c.roundRect(hx - 23, hy - 28, 46, 56, 5); c.fill(); c.strokeStyle = '#1b2440'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = '#fff6c8'; c.beginPath(); c.arc(hx, hy, 2.2, 0, TAU); c.fill();
  }
  child(c, 250, 268, 0.9, { coat: ['#74c576', '#3f8a4a'], hat: 'brim', look: [-1.6, 1.5], hand: [-73, -113 + (m === 'colander' ? -4 : 0)] });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const k = Math.min(w / 360, h / 290), ox = (w - 360 * k) / 2, oy = (h - 290 * k) / 2;
  K = k;
  const B = { X0: -ox / k, X1: (w - ox) / k, Y0: -oy / k, Y1: (h - oy) / k };
  c.save(); c.translate(ox, oy); c.scale(k, k);
  const v = lab.view;
  if (v === 'sun') drawSun(c, B, time); else if (v === 'glasses') drawGlasses(c, B, time); else drawMoon(c, B, time);
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'g1') { S.g1 = i; (i === OK1 ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  if (a === 'g2') { S.g2 = i; (i === OK2 ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  if (a === 'g3') { S.g3 = i; (i === OK3 ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  if (a === 'place') { S.place = b.dataset.k; S.sec1 = false; sfx.click(); }
  else if (a === 'gl') { S.gl = !S.gl; sfx.click(); }
  else if (a === 'pair') { S.pair = b.dataset.k; sfx.click(); }
  else if (a === 'mode') { S.m3 = b.dataset.k; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'later') { S.sec1 = !S.sec1; if (S.sec1) { S.place = 'snow'; S.gl = false; if (S.hours === 0) S.hours = 12; } }
    else S.m3 = S.m3 === 'colander' ? 'card' : 'colander';
    sfx.click();
  }
  render();
});
$('hr').addEventListener('input', (ev) => { S.hours = +ev.target.value; render(); });
$('mo').addEventListener('input', (ev) => { S.d = +ev.target.value / 100; render(); });

// --- render: controls, readout and state card, one per view ------------------------------------------------------------
function ask(t, q, opts, g, okIdx, wrongText) {
  const btns = opts.map((o, i) => `<button type="button" class="es-b ${g === null ? '' : i === okIdx ? 'good' : i === g ? 'bad' : 'dim'}" data-act="${q.act}" data-i="${i}"${g !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = g === null ? '' : `<div class="es-v ${g === okIdx ? 'ok' : 'no'}">${esc(g === okIdx ? t.right : wrongText || t.notYet)}</div>`;
  return `<div class="es-q">${esc(q.text)}</div><div class="es-opts">${btns}</div>${verdict}`;
}
function render() {
  const t = T[lang], v = lab.view;
  $('secSun').hidden = v !== 'sun'; $('secGl').hidden = v !== 'glasses'; $('secMoon').hidden = v !== 'moon';
  if (v === 'sun') renderSun(t); else if (v === 'glasses') renderGlasses(t); else renderMoon(t);
}
function secChip(k, open, on, label) {
  return `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? esc(label) : '🔒 ???'}</button>`;
}
function renderSun(t) {
  const s = t.s, asked = S.g1 !== null, later = S.sec1 && asked, pl = later ? 'snow' : S.place, open = secret.unlocked();
  lab.setGlow('rgba(120, 190, 255, .26)');
  $('placeRow').innerHTML = PLACES.map((k) => `<button class="chip ${k === pl && !later ? 'on' : ''}" data-act="place" data-k="${k}">${PEMO[k]} ${esc(t.place[k])}</button>`).join('');
  $('glRow').hidden = !asked;
  $('glB').textContent = s.glasses; $('glB').classList.toggle('on', S.gl);
  $('secB1').innerHTML = !asked ? '' : secChip('later', open, later, `⏳ ${t.secrets.later[0]}`);
  $('hrRow').hidden = !later; $('hrLbl').textContent = later ? t.later.lbl : ''; $('hr').setAttribute('aria-label', t.later.lbl);
  if (+$('hr').value !== S.hours) $('hr').value = S.hours;
  $('ask1').innerHTML = ask(t, { act: 'g1', text: s.q }, s.opts, S.g1, OK1, null) + (asked ? `<p class="es-vt">${esc(s.vt)}</p>` : '');
  $('note1').textContent = later ? t.later.note : '';
  if (!asked) {
    lab.setReadout('?', s.sub, '', '#78beff');
    lab.setState({ emo: '🤔', title: s.q, lead: s.look, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  if (later) {
    const ph = S.gl ? t.later.pg : t.later[phaseOf(S.hours)];
    lab.setReadout(`${S.hours} h`, S.gl ? t.later.sg : t.later.sub, '', '#ffd85a');
    lab.setState({ emo: S.gl ? '😎' : redOf(S.hours) > 0.4 ? '😣' : '🙂', title: ph[0], lead: ph[1], body: '', extra: '' });
    lab.setFacts(t.facts.later);
    return;
  }
  const p = s[pl];
  lab.setReadout(pl === 'forest' ? '&lt;10%' : `${REFL[pl]}%`, s.sub, pl === 'snow' ? s.pillSnow : '', '#b58cff');
  lab.setState({ emo: PEMO[pl], title: p[0], lead: p[1], body: S.gl ? s.gOn : p[2], extra: '' });
  lab.setFacts(t.facts.sun);
}
function renderGlasses(t) {
  const g = t.g, asked = S.g2 !== null, pr = S.pair;
  lab.setGlow('rgba(214, 170, 80, .24)');
  $('pairRow').innerHTML = PAIRS.map((k) => `<button class="chip ${k === pr ? 'on' : ''}" data-act="pair" data-k="${k}">${k === 'dark' ? '🕶️' : k === 'light' ? '👓' : '🎀'} ${esc(g.pair[k])}</button>`).join('');
  $('ask2').innerHTML = ask(t, { act: 'g2', text: g.q }, g.opts, S.g2, OK2, null) + (asked ? `<p class="es-vt">${esc(g.vt)}</p>` : '');
  $('note2').textContent = asked ? t.illus : '';
  if (!asked) {
    lab.setReadout('?', g.sub, '', '#d6aa56');
    lab.setState({ emo: '🤔', title: g.q, lead: g.pre, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const ok = pr === 'light';
  lab.setReadout(ok ? '99%+' : '?', ok ? g.sub : g.subNo, ok ? g.tag : '', '#d6aa56');
  lab.setState({ emo: ok ? '✅' : '❔', title: g[pr][0], lead: g[pr][1], body: '', extra: '' });
  lab.setFacts(t.facts.glasses);
}
function renderMoon(t) {
  const m = t.m, asked = S.g3 !== null, open = secret.unlocked(), cov = Math.round(coverOf(S.d) * 100);
  lab.setGlow('rgba(255, 214, 100, .22)');
  $('moLbl').textContent = m.slider; $('mo').setAttribute('aria-label', m.slider);
  if (+$('mo').value !== Math.round(S.d * 100)) $('mo').value = Math.round(S.d * 100);
  $('modeRow').hidden = !asked;
  $('modeChips').innerHTML = !asked ? '' : ['card', 'tree'].map((k) => `<button class="chip ${S.m3 === k ? 'on' : ''}" data-act="mode" data-k="${k}">${esc(m.modes[k])}</button>`).join('') + secChip('suns', open, S.m3 === 'colander', `🥣 ${t.secrets.suns[0]}`);
  const wrong = S.g3 === null || S.g3 === OK3 ? null : m.no[S.g3];
  $('ask3').innerHTML = ask(t, { act: 'g3', text: m.q }, m.opts, S.g3, OK3, wrong) + (asked ? `<p class="es-vt">${esc(m.vt)}</p>` : '');
  lab.setReadout(`${cov}%`, m.sub, '', '#ffd66a');
  if (!asked) {
    lab.setState({ emo: '🤔', title: m.q, lead: m.pre, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  const st = m[S.m3];
  lab.setState({ emo: S.m3 === 'tree' ? '🍃' : S.m3 === 'colander' ? '🥣' : '📄', title: st[0], lead: st[1], body: st[2], extra: '' });
  lab.setFacts(S.m3 === 'colander' ? t.facts.suns : t.facts.moon);
}
render();
</script>
