  c.fillStyle = waterGrad(c, WSURF, H1, [[0, '#1f6fa8'], [0.45, '#0b2545'], [1, '#061528']]); c.fillRect(V.L - 5, WSURF, V.R - V.L + 10, V.B - WSURF + 5);
  waveLine(c, WSURF, time);
  const pair = (px, py, qx, qy, off, drawP, drawQ) => {
    const ph = (t + off) % CYC, ang = Math.atan2(qy - py, qx - px), dist = Math.hypot(qx - px, qy - py);
    drawQ(); drawP();
    c.save();
    if (ph < 1.4) { const p = ph / 1.4; waves(c, px + 16 * Math.cos(ang), py + 16 * Math.sin(ang), ang, p * (dist - 30) + 6, dist, '#7ff0ff', 1 - p * 0.3); }
    else if (ph < 2.8) {
      const p = (ph - 1.4) / 1.4, k = 1 - p;
      waves(c, qx - 12 * Math.cos(ang), qy - 12 * Math.sin(ang), ang + PI, p * (dist - 30) + 6, dist, '#ffd166', 1 - p * 0.3);
      if (p < 0.25) { c.globalAlpha = 1 - p * 4; c.strokeStyle = '#ffd166'; c.lineWidth = 2; c.beginPath(); c.arc(qx, qy, 10 + p * 40, 0, 2 * PI); c.stroke(); }
      void k;
    } else if (ph < 3.3) { const p = (ph - 2.8) / 0.5; c.globalAlpha = 1 - p; c.strokeStyle = '#ffd166'; c.lineWidth = 2.4; c.beginPath(); c.arc(px, py, 12 + p * 24, 0, 2 * PI); c.stroke(); }
    c.restore();
  };
  pair(92, 76, 305, 62, 0, () => drawBat(c, 92 + Math.sin(time * 1.3) * 4, 76 + Math.cos(time * 2.1) * 3, time), () => drawMoth(c, 305, 62 + Math.sin(time * 3) * 3, time));
  pair(100, 248, 318, 252, 2.2, () => drawDolphin(c, 100, 248, time), () => drawFish(c, 318, 252, time));
  c.restore();
}

// --- secret B: Marie Tharp's map of the Atlantic, from Natural Earth coastlines (labs/poles/geo.js) --------------------
const RIDGE = [[-17, 67], [-19, 64], [-24, 61], [-29, 57], [-35, 52.5], [-30, 49], [-29, 45], [-31, 40], [-28, 38], [-33, 34], [-42, 28], [-45, 23], [-46, 15], [-42, 11], [-38, 6], [-30, 1], [-18, 0.5], [-14, -3], [-13.5, -10], [-14, -20], [-13, -30], [-13, -38], [-14, -45], [-11, -52], [0, -54.5]];
const LON0 = -92, LON1 = 26, LAT0 = -58, LAT1 = 74, KX = 0.85;
function decode(s, k) {
  const out = []; let i = 0, x = 0, y = 0;
  const one = () => { let r = 0, sh = 0, b; do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32); return r & 1 ? ~(r >> 1) : r >> 1; };
  while (i < s.length) { x += one(); y += one(); out.push(x / k, y / k); }
  return out;
}
let ATL = null;
function atlantic() {
  if (ATL) return ATL;
  const rings = [];
  for (const s of GLOBE) {
    const a = decode(s, 10), n = a.length / 2, xs = new Float32Array(n), ys = new Float32Array(n);
    let off = 0, x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let i = 0; i < n; i++) {
      const x = a[2 * i];
      if (i) { const d = x + off - xs[i - 1]; if (d > 180) off -= 360; else if (d < -180) off += 360; }
      xs[i] = x + off; ys[i] = a[2 * i + 1];
      x0 = Math.min(x0, xs[i]); x1 = Math.max(x1, xs[i]); y0 = Math.min(y0, ys[i]); y1 = Math.max(y1, ys[i]);
    }
    if (y1 < -58 || x1 < -130 || x0 > 60 || y0 > 80 || n < 4) continue;
    rings.push({ xs, ys, n });
  }
  const inside = (lon, lat) => {
    let hit = false;
    for (const r of rings) {
      let ins = false;
      for (let i = 0, j = r.n - 1; i < r.n; j = i++) {
        if ((r.ys[i] > lat) !== (r.ys[j] > lat) && lon < ((r.xs[j] - r.xs[i]) * (lat - r.ys[i])) / (r.ys[j] - r.ys[i]) + r.xs[i]) ins = !ins;
      }
      if (ins) hit = !hit;
    }
    return hit;
  };
  // the ridge, sampled every ~0.5 degrees, with its length so it can be drawn line by line
  const dense = [];
  for (let i = 0; i < RIDGE.length - 1; i++) {
    const [ax, ay] = RIDGE[i], [bx, by] = RIDGE[i + 1], n = Math.max(1, Math.ceil(Math.hypot((bx - ax) * KX, by - ay) / 0.5));
    for (let k = 0; k < n; k++) dense.push([lerp(ax, bx, k / n), lerp(ay, by, k / n)]);
  }
  dense.push(RIDGE[RIDGE.length - 1]);
  // ship tracks: dots on the ocean, lighter (shallower) near the ridge
  const tracks = [];
  const lats = [-52, -44, -36, -28, -20, -12, -4, 4, 12, 20, 28, 36, 44, 52, 60];
  lats.forEach((lat, ti) => {
    const row = [];
    for (let lon = -82 + (ti % 2) * 0.8; lon <= 22; lon += 1.7) {
      const la = lat + Math.sin(lon * 0.37 + ti) * 1.2;
      if (inside(lon, la)) continue;
      let d = 99; for (const [rx, ry] of dense) d = Math.min(d, Math.hypot((lon - rx) * KX, la - ry));
      row.push({ lon, lat: la, f: Math.exp(-Math.pow(d / 3.4, 2)) });
    }
    tracks.push(row);
  });
  ATL = { rings, dense, tracks };
  return ATL;
}
function drawSecB(c, w, h, dt, time) {
  const A = atlantic(), t = time - S.secT;
  const k = Math.min((w * 0.96) / ((LON1 - LON0) * KX), (h * 0.96) / (LAT1 - LAT0));
  const x0 = (w - (LON1 - LON0) * KX * k) / 2, y0 = (h - (LAT1 - LAT0) * k) / 2;
  const P = (lon, lat) => [x0 + (lon - LON0) * KX * k, y0 + (LAT1 - lat) * k];
  const og = c.createLinearGradient(0, 0, 0, h); og.addColorStop(0, '#1f6fa8'); og.addColorStop(0.5, '#0b2545'); og.addColorStop(1, '#0a2d52');
  c.fillStyle = og; c.fillRect(0, 0, w, h);
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  const lg = c.createLinearGradient(0, 0, w * 0.3, h); lg.addColorStop(0, '#b8966f'); lg.addColorStop(1, '#6e553f');
  const landPath = new Path2D();
  for (const r of A.rings) {
    for (let i = 0; i < r.n; i++) { const [px, py] = P(r.xs[i], r.ys[i]); if (i) landPath.lineTo(px, py); else landPath.moveTo(px, py); }
    landPath.closePath();
  }
  c.strokeStyle = 'rgba(127,240,255,.16)'; c.lineWidth = 6; c.stroke(landPath);
  c.fillStyle = lg; c.fill(landPath); c.strokeStyle = '#3d2e22'; c.lineWidth = 1.2; c.stroke(landPath);
  // echo soundings from ships: tracks appear one after another
  const rad = Math.max(1.4, k * 0.5);
  A.tracks.forEach((row, ti) => {
    row.forEach((d, i) => {
      const born = ti * 0.22 + i * 0.012; if (t < born) return;
      const a = easeOut(clamp01((t - born) / 0.3)), [px, py] = P(d.lon, d.lat);
      c.globalAlpha = a; c.fillStyle = d.f > 0.45 ? '#7ff0ff' : d.f > 0.15 ? '#4aa6cf' : '#2a5f93';
      c.beginPath(); c.arc(px, py, Math.max(0, rad * (0.7 + d.f * 0.7)), 0, 2 * PI); c.fill();
    });
  });
  c.globalAlpha = 1;
  // the ridge, drawn from north to south like a seam
  const tr = clamp01((t - 4.4) / 4), n = Math.floor(A.dense.length * easeOut(tr));
  if (n > 1) {
    const path = new Path2D();
    for (let i = 0; i < n; i++) { const [px, py] = P(...A.dense[i]); if (i) path.lineTo(px, py); else path.moveTo(px, py); }
    c.shadowColor = 'rgba(255,209,102,.7)'; c.shadowBlur = 10; c.strokeStyle = '#5b4636'; c.lineWidth = Math.max(5, k * 2.4); c.stroke(path);
    c.shadowBlur = 0; c.strokeStyle = '#d9a066'; c.lineWidth = Math.max(3, k * 1.5); c.stroke(path);
    c.strokeStyle = '#ffd166'; c.lineWidth = 1.4; c.setLineDash([3, 4]); c.stroke(path); c.setLineDash([]);
    // stitches across the seam
    c.strokeStyle = 'rgba(255,240,200,.85)'; c.lineWidth = 1.2; c.beginPath();
    for (let i = 2; i < n - 1; i += 3) {
      const [ax, ay] = P(...A.dense[i - 1]), [bx, by] = P(...A.dense[i + 1]), mx = (ax + bx) / 2, my = (ay + by) / 2, dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1, nx = -dy / L * 5, ny = dx / L * 5;
      c.moveTo(mx - nx, my - ny); c.lineTo(mx + nx, my + ny);
    }
    c.stroke();
  }
  c.restore();
}

// --- controls ---------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-pick]'); if (!b || b.disabled) return;
  const v = lab.view;
  if (b.dataset.pick !== undefined) {
    if (S.pred[v] !== null) return;
    const i = +b.dataset.pick;
    S.pred[v] = i; (i === RIGHT[v] ? sfx.good : sfx.bad)();
    if (v === 'parts') { S.part = 'trench'; S.predT = now(); }
    if (v === 'deep') S.sinking = true;
    render(); showStage(); return;
  }
  const act = b.dataset.act;
  if (act === 'ping') startPing();
  else if (act === 'floor') { S.floorOn = true; sfx.click(); render(); }
  else if (act === 'again') { resetSonar(); sfx.click(); render(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    S.sec = S.sec === k ? null : k; S.secT = now(); sfx.click(); render(); if (S.sec) showStage();
  }
});
// tap a marker (parts) or grab the mountain (deep)
const cvEl = $('cv');
const toWorld = (ev) => { const r = cvEl.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top; return { px, py, wx: (px - V.tx) / V.s, wy: (py - V.ty) / V.s }; };
cvEl.addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const v = lab.view, p = toWorld(ev);
  if (v === 'parts') {
    let best = null, bd = 26;
    for (const m of S.hit) { const d = Math.hypot(m.x - p.px, m.y - p.py); if (d < bd) { bd = d; best = m; } }
    if (best) { S.part = best.k; sfx.click(); render(); }
  } else if (v === 'deep' && S.sinkDone) {
    const by = base3(), top = by - EV_H;
    if (Math.abs(p.wx - CX) < 115 && p.wy > top - 16 && p.wy < by + 16) {
      S.drag = { off: by - p.wy }; S.hinted = true; S.fall = 0; cvEl.setPointerCapture(ev.pointerId); sfx.click(); ev.preventDefault();
    }
  }
});
cvEl.addEventListener('pointermove', (ev) => {
  if (!S.drag) return;
  const p = toWorld(ev), baseM = (p.wy + S.drag.off) / K3;
  S.lift = clamp(DEEP - baseM, 0, DEEP - EV);
});
const drop = () => { if (S.drag) { S.drag = null; S.fall = 0; } };
cvEl.addEventListener('pointerup', drop); cvEl.addEventListener('pointercancel', drop);

// --- one render per change: controls, readout and the state card ------------------------------------------------------
function askHTML(v, t) {
  const opts = t[`${v}Opts`], got = S.pred[v];
  return `<div class="of-q">${esc(t[`${v}Ask`])}</div><div class="of-opts">${opts.map((o, i) => {
    const cls = got === null ? '' : i === RIGHT[v] ? ' of-ok' : i === got ? ' of-bad' : ' of-dim';
    return `<button class="of-opt${cls}" data-pick="${i}"${got === null ? '' : ' disabled'}>${esc(o)}</button>`;
  }).join('')}</div>${got === null ? '' : `<div class="of-v ${got === RIGHT[v] ? 'of-yes' : 'of-no'}">${esc(t[`${v}${got === RIGHT[v] ? 'Right' : 'Wrong'}`])}</div>`}`;
}
function updateReadout() {
  const t = T[lang], v = lab.view;
  if (S.sec) {
    const e = S.sec === 'a' ? '🦇' : '🗺️';
    lab.setReadout(e, t.secrets[S.sec][0], '', '#ffd166'); return;
  }
  if (v === 'sonar') {
    if (S.lastM === null) lab.setReadout('–', '', t.pingN(0), '#7ff0ff');
    else lab.setReadout(esc(t.depth(fmt(S.lastM))), t.echo(dec1(S.lastEcho)), t.pingN(S.k), '#7ff0ff');
  } else if (v === 'parts') {
    const p = PARTS.find((q) => q.k === S.part);
    if (!p) lab.setReadout('?', '', '', '#ffd166');
    else lab.setReadout(esc(cap(t.parts[p.k][0])), '', p.k === 'island' ? t.depth('0') : t.about(fmt(rnd(depthAt(p.u)))), '#ffd166');
  } else {
    if (!S.sinkDone) lab.setReadout('?', '', t.deepName, '#3aa0d8');
    else { S.gapShown = gapM(); lab.setReadout(esc(t.depth(fmt(S.gapShown))), t.gapSub, t.deepName, '#3aa0d8'); }
  }
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  document.body.dataset.drag = v === 'deep' && S.sinkDone && !S.sec ? '1' : '0';
  $('ofAsk').innerHTML = askHTML(v, t);
  // actions
  let acts = '';
  if (v === 'sonar') {
    const locked = S.pred.sonar === null || !!S.png, last = S.k >= 20;
    acts = last ? `<button class="of-btn" data-act="again"${S.png ? ' disabled' : ''}>↺ ${esc(t.again)}</button>`
      : `<button class="of-btn" data-act="ping"${locked ? ' disabled' : ''}>🔊 ${esc(t.ping)}</button>`;
    if (S.k >= 8 && !S.floorOn && !last) acts += `<button class="of-btn of-ghost" data-act="floor">${esc(t.showFloor)}</button>`;
  }
  $('ofActs').innerHTML = acts; $('ofActs').style.display = acts ? '' : 'none';
  const open = secret.unlocked();
  $('ofSec').innerHTML = [['a', '🦇'], ['b', '🗺️']].map(([k, emo]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  updateReadout();
  lab.setGlow(v === 'sonar' ? 'rgba(127, 240, 255, .22)' : v === 'parts' ? 'rgba(255, 209, 102, .2)' : 'rgba(58, 160, 216, .3)');
  if (S.sec) {
    lab.setState({ emo: S.sec === 'a' ? '🦇' : '🗺️', title: t.secrets[S.sec][0], lead: S.sec === 'a' ? t.batText : t.tharpText, body: '' });
    lab.setFacts([]);
    return;
  }
  const [emo, title, lead, body] = t.st[v];
  // the second line of the card hints at the answer while a prediction is open: show it after the tap
  lab.setState({ emo, title, lead, body: v !== 'sonar' && S.pred[v] === null ? '' : body });
  lab.setFacts(t.facts[v]);
}

// everything the draw loop reads is declared above
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec === 'a') drawSecA(c, w, h, dt, time);
  else if (S.sec === 'b') drawSecB(c, w, h, dt, time);
  else if (lab.view === 'sonar') drawSonar(c, w, h, dt, time);
  else if (lab.view === 'parts') drawParts(c, w, h, dt, time);
  else drawDeep(c, w, h, dt, time);
});
render();
</script>
