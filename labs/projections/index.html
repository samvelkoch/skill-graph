      if (pr === 'merc') ratio = A.a.mer / (A.g.tru / Math.cos(latFromNy(S.cut.ny) * D2R) ** 2);
      ro = [`×${nf(ratio, ratio < 10 ? 1 : 0)}`, t.size.sub, t.size.real(14), '#4ea8ff'];
      const q = t.size.st[pr], sel = S.size.sel, ex = [];
      if (S.size.tissot) ex.push(t.size.tis);
      if (sel) ex.push(t.size.realArea(t.size.ctry[sel], nf(CTRY[sel].area, CTRY[sel].d)));
      st = { emo: q[0], title: q[1], lead: q[2], body: '', extra: ex.map((x) => `<div>${esc(x)}</div>`).join('') };
    }
  } else {
    lab.setGlow('rgba(61,220,151,.24)'); const rt = ROUTES[S.route.pair], r = t.route;
    if (ph === 'ask') { ro = ['?', '', '', '#3ddc97']; st = { emo: '🤔', title: t.ask.route.q, lead: r.lead, body: '', extra: '' }; }
    else {
      facts = t.facts.route; const g = Math.round(rt.gcKm / 10) * 10, rh = Math.round(rt.rhKm / 10) * 10;
      ro = [`${nf(g)} ${r.km}`, r.gc, `${r.rh}: ${nf(rh)} ${r.km}`, '#3ddc97']; st = { emo: '✈️', title: r.title, lead: r.lead2, body: r.body(nf(g), nf(rh), nf(rh - g)), extra: '' };
    }
  }
  lab.setReadout(ro[0], ro[1], ro[2], ro[3]); lab.setState(st); lab.setFacts(facts);
}
render();
</script>
