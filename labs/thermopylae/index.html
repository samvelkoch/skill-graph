  <div id="thPred"></div>
  <div class="th-ctl" id="thCtlPass"><div class="th-lbl" id="thSlLbl"></div>
    <input class="big" type="range" id="thSl" min="0" max="1000" step="1" value="952" style="--track:linear-gradient(90deg,#ecd592,#8f5a24)">
    <div class="ends"><span id="thE0"></span><span id="thE1"></span></div><div class="th-fine" id="thFine"></div></div>
  <div class="th-ctl" id="thCtlPath"><div class="th-days" id="thDays"></div></div>
  <div class="th-ctl" id="thCtlRun"><button type="button" class="btn th-run" id="thRun"></button></div>
  <div class="th-ctl" id="thCtlA"><div class="th-lbl" id="thALbl"></div>
    <input class="big" type="range" id="thYr" min="-480" max="2026" step="1" value="-480" style="--track:linear-gradient(90deg,#2d86a8,#c4b27c)">
    <div class="ends"><span id="thAE0"></span><span id="thAE1"></span></div></div>
  <div class="th-ctl" id="thCtlB"><div class="th-row"><button type="button" class="btn" id="thAdd" data-act="addrow"></button><button type="button" class="btn ghost" id="thOne" data-act="onerow"></button></div></div>
  <div class="chips th-secs" id="thSecs"></div>`;

// --- the question of each view: chips stay after the tap, the right one turns green ------------------------------------
function predHTML(v) {
  const t = T[lang], q = t[v].ask, opts = t[v].opts, pick = S.pick[v], done = pick !== null, right = RIGHT[v];
  const chips = opts.map((o, i) => `<button class="th-opt${done ? (i === right ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="opt" data-v="${v}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = done ? `<div class="th-verdict ${pick === right ? 'good' : 'bad'}">${esc(pick === right ? t[v].right : t[v].wrong)}</div>` : '';
  return `<div class="th-q">${esc(q)}</div><div class="th-opts">${chips}</div>${verdict}`;
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(v, i) {
  if (S.pick[v] !== null) return;
  S.pick[v] = i; (i === RIGHT[v] ? sfx.good : sfx.bad)();
  const tn = now();
  if (v === 'pass') { S.glideAt = tn + 1.8; S.fTgt = S.f; } // first a push on the wide plain, then the pass narrows by itself
  else if (v === 'path') { S.day = 3; S.t3 = tn; }
  else S.run.revAt = tn;
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'opt') return answer(b.dataset.v, +b.dataset.i);
  if (a === 'day') { S.day = +b.dataset.d; S.t3 = now(); S.stage = 0; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); showStage();
  } else if (a === 'addrow') { if (S.rows < 5) { S.rowT[S.rows] = now(); S.rows++; sfx.snap(); } }
  else if (a === 'onerow') { S.rows = 1; S.rowT = []; sfx.click(); }
  render();
});
$('thSl').addEventListener('input', (ev) => {
  if (S.pick.pass === null) return;
  S.fTgt = ev.target.value / 1000; S.rate = 14; S.glideAt = 0; S.glide = false;
});
$('thYr').addEventListener('input', (ev) => { S.yr = +ev.target.value; texts(); });
const runBtn = $('thRun');
const hold = (on) => {
  if (S.pick.run === null) return;
  if (on && S.run.p >= 1) { S.run.p = 0; S.run.v = 0; }
  S.run.hold = on; if (on) sfx.tick();
};
runBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); try { runBtn.setPointerCapture(e.pointerId); } catch { /* fine without */ } hold(true); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => runBtn.addEventListener(ev, () => hold(false)));
runBtn.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); hold(true); } });
runBtn.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') hold(false); });
runBtn.addEventListener('blur', () => hold(false));
runBtn.addEventListener('contextmenu', (e) => e.preventDefault());
$('stage').addEventListener('click', (e) => { // secret b: tap a soldier
  if (S.sec !== 'b') return;
  const r = $('cv').getBoundingClientRect(), x = (e.clientX - r.left - VIEW.ox) / VIEW.sc, y = (e.clientY - r.top - VIEW.oy) / VIEW.sc;
  let best = null, bd = 1e9;
  for (let row = 0; row < S.rows; row++) for (let col = 0; col < 6; col++) { const d = Math.hypot(x - (SBX(col) - 11), y - (SBY(row) - 5)); if (d < bd) { bd = d; best = { r: row, c: col }; } }
  if (best && bd < 32) { S.sel = best; sfx.tick(); texts(); }
});

// --- readout, state card (cheap, also called while things move) ---------------------------------------------------------
function texts() {
  const t = T[lang], v = lab.view, KM = lang === 'ru' ? 'км' : 'km';
  if (S.sec === 'a') {
    const p = (S.yr + 480) / 2506, i = p < .02 ? 0 : p > .985 ? 2 : 1;
    lab.setGlow('rgba(95, 168, 160, .26)');
    lab.setReadout(t.secA.year(S.yr), t.secA.sub[i], '', '#5fa8a0');
    lab.setState({ emo: '🏔️', title: t.secA.title[i], lead: t.secA.lead[i], body: '', extra: '' });
  } else if (S.sec === 'b') {
    const b = t.secB, sel = S.sel;
    lab.setGlow('rgba(217, 130, 95, .24)');
    lab.setReadout(String(S.rows * 6), `${b.val} · ${b.sub(S.rows)}`, '', '#d9825f');
    lab.setState({ emo: '🟥', title: b.title, lead: sel && sel.r < S.rows ? (sel.c === 0 ? b.selEnd : b.sel) : b.lead0, body: '', extra: '' });
  } else if (v === 'pass') {
    const ans = S.pick.pass !== null, w = wOf(S.f), n = Math.round(w), rows = ROWS_G / w, thin = rows < ROWS_MIN, P = t.pass;
    lab.setGlow('rgba(224, 176, 80, .26)');
    if (!ans) {
      lab.setReadout('?', '', '', GOLD); lab.setState({ emo: '🤔', title: P.ask, lead: P.preLead, body: '', extra: '' });
    } else {
      lab.setReadout(`${numFmt(n)} ${t.unit}`, P.front(numFmt(n)), P.rows(rowsFmt(rows)), thin ? '#e5604f' : GOLD);
      lab.setState(thin ? { emo: '⚠️', title: P.thinT, lead: P.thinL(numFmt(n), rowsFmt(rows)), body: P.thinB, extra: '' }
        : { emo: '🛡️', title: P.holdT, lead: P.holdL(numFmt(n)), body: P.holdB(rowsFmt(rows)), extra: '' });
    }
  } else if (v === 'path') {
    const ans = S.pick.path !== null, P = t.path, d = ans ? S.day : 2;
    lab.setGlow('rgba(192, 80, 74, .24)');
    if (!ans) {
      lab.setReadout(P.val(2), P.sub[0], P.pill[0], '#c0504a'); lab.setState({ emo: '🤔', title: P.ask, lead: P.preLead, body: '', extra: '' });
    } else {
      const st = d === 1 ? P.d1 : d === 2 ? P.d2 : S.stage < 2 ? P.d3a : P.d3b;
      lab.setReadout(P.val(d), d < 3 ? P.sub[0] : P.sub[S.stage < 2 ? 1 : 2], d < 3 ? P.pill[0] : S.stage < 2 ? '' : P.pill[1], '#c0504a');
      lab.setState({ emo: d === 3 && S.stage < 2 ? '🥾' : '🛡️', title: st[0], lead: st[1], body: st[2] || '', extra: '' });
    }
  } else {
    const ans = S.pick.run !== null, R = S.run, P = t.run;
    lab.setGlow('rgba(95, 168, 211, .26)');
    if (!ans) {
      lab.setReadout('?', '', '', '#5fa8d3'); lab.setState({ emo: '🤔', title: P.ask, lead: P.preLead, body: '', extra: '' });
    } else {
      const st = R.p <= 0 ? P.s0 : R.p >= 1 ? P.s2 : P.s1;
      lab.setReadout(`${decFmt(R.p * 40, 1)} ${KM}`, P.sub, '', '#5fa8d3');
      lab.setState({ emo: R.p >= 1 ? '🏛️' : R.p > 0 ? '🏃' : '🏺', title: st[0], lead: st[1], body: st[2], extra: '' });
    }
  }
}

// --- full render: controls, secrets row, facts, then the texts ------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, ans = S.pick[v] !== null, show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  document.body.dataset.v = sec ? 's' + sec : v;
  show('thPred', !sec); if (!sec) $('thPred').innerHTML = predHTML(v);
  show('thCtlPass', !sec && v === 'pass'); show('thCtlPath', !sec && v === 'path'); show('thCtlRun', !sec && v === 'run');
  show('thCtlA', sec === 'a'); show('thCtlB', sec === 'b');
  $('thSlLbl').textContent = t.pass.slider; $('thSl').disabled = !ans; $('thSl').setAttribute('aria-label', t.pass.slider);
  $('thE0').textContent = t.pass.ends[0]; $('thE1').textContent = t.pass.ends[1]; $('thFine').textContent = t.pass.fine;
  $('thDays').innerHTML = t.path.days.map((l, i) => `<button type="button" class="th-day${S.day === i + 1 && ans ? ' on' : ''}" data-act="day" data-d="${i + 1}"${ans ? '' : ' disabled'}>${esc(l)}</button>`).join('');
  runBtn.textContent = S.run.p >= 1 ? t.run.again : t.run.btn; runBtn.disabled = S.pick.run === null;
  $('thALbl').textContent = t.secA.lbl; $('thAE0').textContent = t.secA.ends[0]; $('thAE1').textContent = t.secA.ends[1]; $('thYr').setAttribute('aria-label', t.secA.lbl);
  $('thAdd').textContent = t.secB.add; $('thAdd').disabled = S.rows >= 5; $('thOne').textContent = t.secB.reset; $('thOne').disabled = S.rows <= 1;
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('thSecs').innerHTML = sc('a', '🏔️') + sc('b', '🟥');
  lab.setFacts(!sec && ans ? t.facts[v] : []);
  texts();
}

// --- motion: runs every frame before the picture is drawn ------------------------------------------------------------------
function step(dt, time) {
  const ease = (rate) => 1 - Math.exp(-dt * rate), view = lab.view;
  // pass
  const ansP = S.pick.pass !== null;
  if (ansP && S.glideAt > 0 && time >= S.glideAt) { S.fTgt = 0; S.rate = 1.5; S.glideAt = 0; S.glide = true; }
  S.f += (S.fTgt - S.f) * ease(S.rate);
  if (S.glide && S.f < .004) { S.f = 0; S.glide = false; }
  if (S.glide) $('thSl').value = Math.round(S.f * 1000);
  const thin = ROWS_G / wOf(S.f) < ROWS_MIN;
  S.gapA += ((ansP && thin ? 1 : 0) - S.gapA) * ease(5); S.hA += ((ansP && !thin ? 1 : 0) - S.hA) * ease(5);
  S.pa += (((view === 'pass' ? ansP : true) ? 1 : 0) - S.pa) * ease(3);
  if (view === 'pass' && !S.sec && Math.abs(S.f - S.fShown) > 4e-4) { S.fShown = S.f; texts(); }
  // path: where the story is on day 3
  const stg = S.day === 3 && S.pick.path !== null ? (time - S.t3 < 2.6 ? 1 : 2) : 0;
  if (stg !== S.stage) { S.stage = stg; if (view === 'path' && !S.sec) texts(); }
  // run: hold the button, the runner speeds up and slows down smoothly
  const R = S.run, ansR = S.pick.run !== null, was = R.p;
  R.v += (((R.hold && ansR && R.p < 1) ? 1 / 7 : 0) - R.v) * ease(R.hold ? 3 : 6);
  R.p = Math.min(1, R.p + R.v * dt); if (R.p >= 1) R.v = 0;
  if (R.p !== was && view === 'run' && !S.sec) { texts(); if ((was < 1) !== (R.p < 1) || (was > 0) !== (R.p > 0)) render(); }
  // secret a: the coast follows the year slider smoothly
  S.yp += ((S.yr + 480) / 2506 - S.yp) * ease(8);
}

// --- one picture for everything -------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const sc = Math.min(w / W, h / H), ox = (w - W * sc) / 2, oy = (h - H * sc) / 2;
  VIEW.sc = sc; VIEW.ox = ox; VIEW.oy = oy;
  step(dt, time);
  c.save(); c.translate(ox, oy); c.scale(sc, sc);
  rr(c, 0, 0, W, H, 14); c.clip();
  if (S.sec === 'a') sceneSecA(c, time); else if (S.sec === 'b') sceneSecB(c, time);
  else if (lab.view === 'pass') scenePass(c, time); else if (lab.view === 'path') scenePath(c, time); else sceneRun(c, time);
  c.restore();
});
render();
</script>
</body>
</html>
