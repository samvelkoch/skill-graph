const hx = (a) => '#' + a.map((v) => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, '0')).join('');

// one nest / lodge / comb piece, drawn at (x, y) turned by ang
function piece(c, p, x, y, ang, k = 1) {
  c.save(); c.translate(x, y); c.rotate(ang); c.scale(k, k); c.lineCap = 'round'; c.lineJoin = 'round';

  else if (p.kind === 'feather') { ell(c, 0, 0, p.len * .5, 3.4); fillStroke(c, '#ffffff', alpha(C.ink, .35), .8); c.beginPath(); c.moveTo(-p.len * .5, 0); c.lineTo(p.len * .5, 0); c.stroke(); }
  else { c.beginPath(); c.moveTo(-p.len / 2, 0); c.lineTo(p.len / 2, 0); c.strokeStyle = dark(p.col, .4); c.lineWidth = p.w + 2; c.stroke(); c.strokeStyle = p.col; c.lineWidth = p.w; c.stroke(); }
  c.restore();
}

const TUFTS = (() => { const r = rnd(4); return Array.from({ length: 56 }, () => ({ x: -40 + r() * 880, y: 354 + r() * 238, s: .7 + r() * .8 })); })();
// the nest: bowl about 80 wide, drawn around (0, 0); pieces fly in one by one in the "build" view
const NEST_P = (() => {
  const r = rnd(11), out = [];
  const cols = [dark(C.bark, .15), C.bark, lite(C.bark, .22), lite(C.bark, .4), mix(C.grass, C.honey, .45), C.leaf, dark(C.leaf, .1)];
  for (let i = 0; i < 18; i++) {
    const th = i / 18 * TAU + r() * .2, x = Math.cos(th) * 40, y = -4 + Math.sin(th) * 13;
    out.push({ kind: 'twig', x, y, ang: th + Math.PI / 2 + (r() - .5) * .5, len: 24 + r() * 14, w: 3.2, front: Math.sin(th) > 0, col: cols[Math.floor(r() * 4)] });
  }
  for (let i = 0; i < 34; i++) {
    const x = (r() * 2 - 1) * 38, depth = 26 * Math.sqrt(Math.max(0, 1 - (x / 42) ** 2)), y = 3 + r() * depth * .9, k = r();
    out.push({ kind: k < .22 ? 'moss' : k < .45 ? 'grass' : 'twig', x, y, ang: (r() - .5) * 1.0, len: 20 + r() * 16, w: 3, front: true, col: cols[Math.floor(r() * cols.length)] });
  }
  shuffle(out.map((_, i) => i), r).forEach((v, i) => { out[v].idx = i; });
  return out;
})();
const NEST_BACK = NEST_P.filter((p) => !p.front);
const NEST_FRONT = NEST_P.filter((p) => p.front).sort((a, b) => a.y - b.y);
// the beaver lodge: a dome of sticks about 150 wide around (610, 530)
const LODGE = { x: 610, base: 530, rx: 76, h: 90, water: 512 };
const LODGE_S = (() => {
  const r = rnd(5), out = [], cols = [dark(C.bark, .1), C.bark, lite(C.bark, .2), lite(C.bark, .38), dark(C.bark, .3)];
  for (let i = 0; i < 64; i++) {
    const u = r() * 2 - 1, vmax = Math.sqrt(Math.max(0, 1 - u * u)), v = r() * vmax * .93;
    out.push({ kind: 'twig', x: LODGE.x + u * (LODGE.rx - 6), y: LODGE.base - 4 - v * LODGE.h, ang: (r() - .5) * .9 + u * .6, len: 32 + r() * 22, w: 4.2, col: cols[Math.floor(r() * cols.length)], j: r() * 22 });
  }
  [...out].sort((a, b) => (b.y + b.j) - (a.y + a.j)).forEach((p, i) => { p.idx = i; });
  return out.sort((a, b) => a.y - b.y);
})();
const LODGE_MUD = (() => { const r = rnd(6); return Array.from({ length: 26 }, () => { const u = r() * 2 - 1, v = r() * Math.sqrt(Math.max(0, 1 - u * u)) * .9; return { x: LODGE.x + u * 70, y: LODGE.base - 6 - v * 84, rx: 9 + r() * 9, ry: 4 + r() * 4 }; }); })();
// the honeycomb: 37 cells in 3 rings
const COMB = (() => {
  const out = [], s = 30;
  for (let q = -3; q <= 3; q++) for (let r = -3; r <= 3; r++) if (Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r)) <= 3) {
    out.push({ q, r, x: 400 + s * Math.sqrt(3) * (q + r / 2), y: 300 + s * 1.5 * r, ring: Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r)) });
  }
  out.sort((a, b) => a.ring - b.ring || Math.atan2(a.y - 300, a.x - 400) - Math.atan2(b.y - 300, b.x - 400));
  out.forEach((p, i) => { p.idx = i; });
  return out;
})();
// straw of the rabbit's nest underground
const STRAW = (() => {

  }
  return out;
})();

  c.save(); c.translate(-6, -12); c.rotate(-flap * 1.2 - .08);

  c.restore();

// front-facing chubby rabbit; origin = the middle of its feet
function drawRabbit(c, x, y, s, o = {}) {
  const { sy = 1, ears = 0, look = 0, sleep = false } = o;
  const fur = mix(C.earth, '#ffffff', .62), furD = mix(C.earth, '#ffffff', .4), line = dark(furD, .45), pink = lite(ROBIN, .55);
  c.save(); c.translate(x, y); c.scale(s, s * sy); c.lineJoin = 'round'; c.lineCap = 'round';
  for (const k of [-1, 1]) {
    c.save(); c.translate(k * 10, -66); c.rotate(k * (.14 + ears * .6) + (sleep ? k * .5 : 0));
    ell(c, 0, -19, 7.6, 23); fillStroke(c, lgr(c, -8, -40, 8, 0, [[0, lite(fur, .2)], [1, furD]]), line, 1.5);
    ell(c, 0, -18, 3.8, 16); c.fillStyle = pink; c.fill();
    c.restore();
  }
  ell(c, 0, -24, 25, 26); fillStroke(c, lgr(c, -20, -50, 22, 0, [[0, lite(fur, .25)], [1, furD]]), line, 1.8);
  ell(c, 0, -19, 14, 18); c.fillStyle = lite(fur, .55); c.fill();
  for (const k of [-1, 1]) { ell(c, k * 14, -3, 12, 6); fillStroke(c, lgr(c, 0, -9, 0, 3, [[0, lite(fur, .2)], [1, furD]]), line, 1.5); }
  circ(c, 0, -52, 20); fillStroke(c, lgr(c, -16, -72, 16, -34, [[0, lite(fur, .3)], [1, furD]]), line, 1.8);
  ell(c, 0, -45, 10, 7); c.fillStyle = lite(fur, .6); c.fill();
  for (const k of [-1, 1]) { ell(c, k * 13, -46, 4.5, 3.4); c.fillStyle = alpha(pink, .55); c.fill(); }
  if (sleep) {
    c.strokeStyle = C.ink; c.lineWidth = 2.1; c.beginPath(); c.arc(-8, -55, 4, .15 * Math.PI, .85 * Math.PI); c.moveTo(12, -55); c.arc(8, -55, 4, .15 * Math.PI, .85 * Math.PI); c.stroke();
  } else { eye(c, -8 + look * 1.6, -55, 3.7); eye(c, 8 + look * 1.6, -55, 3.7); }
  ell(c, 0, -49.5, 3.4, 2.5); c.fillStyle = ROBIN; c.fill();
  c.strokeStyle = line; c.lineWidth = 1.3; c.beginPath(); c.moveTo(0, -47); c.lineTo(0, -44.5); c.moveTo(0, -44.5); c.quadraticCurveTo(-3.5, -41, -6, -43.5); c.moveTo(0, -44.5); c.quadraticCurveTo(3.5, -41, 6, -43.5); c.stroke();
  c.strokeStyle = alpha(line, .5); c.lineWidth = 1; c.beginPath();
  for (const k of [-1, 1]) for (const d of [-3, 2]) { c.moveTo(k * 8, -46 + d * .5); c.lineTo(k * 26, -47 + d * 2); }
  c.stroke();
  for (const k of [-1, 1]) { ell(c, k * 9, -9, 6, 7); fillStroke(c, lgr(c, 0, -16, 0, -2, [[0, lite(fur, .3)], [1, fur]]), line, 1.3); }
  c.restore();
}

function drawSpider(c, x, y, s, time, o = {}) {
  const wig = o.wig ?? 1, col = mix(C.earth, C.ink, .45);
  c.save(); c.translate(x, y); c.scale(s, s); c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = col; c.lineWidth = 2.4;
  for (let side = -1; side <= 1; side += 2) for (let i = 0; i < 4; i++) {
    const w = Math.sin(time * 14 + i * 1.7 + side) * 2.2 * wig, sx = side * 6, sy = -3 + i * 3;
    c.beginPath(); c.moveTo(sx, sy); c.quadraticCurveTo(side * (20 + i * 1.5), sy - 8 + (i - 1.5) * 4 + w, side * (30 + i * 3), sy + 10 + (i - 1.5) * 8 + w * .5); c.stroke();
  }

  c.fillStyle = alpha(C.web, .85); for (const [px, py, pr] of [[0, 2, 2.6], [-4.5, 8, 2], [4.5, 8, 2], [0, 12.5, 1.7]]) { circ(c, px, py, pr); c.fill(); }
  circ(c, 0, -7, 8); fillStroke(c, mix(C.earth, C.ink, .2), dark(col, .4), 1.5);
  eye(c, -3.2, -8.5, 2.8); eye(c, 3.2, -8.5, 2.8);
  c.strokeStyle = alpha(C.web, .9); c.lineWidth = 1.1; c.beginPath(); c.arc(0, -6.5, 3, .25, Math.PI - .25); c.stroke();
  c.restore();
}

// beaver swimming, facing right; origin on the water line
function drawBeaver(c, x, y, s, time, o = {}) {
  const { dir = 1, stick = false, happy = false } = o, fur = mix(C.earth, '#ffffff', .05), furD = dark(fur, .3), line = dark(fur, .6);
  c.save(); c.translate(x, y); c.scale(dir * s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  c.save(); c.translate(-44, -1); c.rotate(-.15); ell(c, 0, 0, 17, 7); fillStroke(c, furD, line, 1.6);
  c.strokeStyle = alpha(line, .45); c.lineWidth = 1; for (let i = -10; i <= 10; i += 5) { c.beginPath(); c.moveTo(i, -5); c.lineTo(i, 5); c.stroke(); }
  c.restore();
  ell(c, -14, -3, 31, 16); fillStroke(c, lgr(c, -30, -22, 10, 14, [[0, lite(fur, .25)], [1, furD]]), line, 1.8);
  circ(c, 19, -12, 15); fillStroke(c, lgr(c, 6, -28, 32, 4, [[0, lite(fur, .25)], [1, fur]]), line, 1.8);
  circ(c, 9, -25, 5); fillStroke(c, furD, line, 1.4);
  ell(c, 27, -8, 9.5, 7); c.fillStyle = lite(fur, .35); c.fill();
  ell(c, 34, -12, 3.8, 3); c.fillStyle = C.ink; c.fill();
  eye(c, 22, -17, 3);
  for (const k of [0, 1]) { c.beginPath(); c.roundRect(26 + k * 4.6, -4, 4.4, 8, 1.5); fillStroke(c, '#ffffff', line, 1.1); }

}

// snail facing right, origin on the ground under the shell; ext 0 = an empty shell
function drawSnail(c, x, y, s, time, o = {}) {
  const { dir = 1, ext = 1 } = o, skin = mix(C.earth, '#ffffff', .55), line = dark(skin, .5), e = eio(clamp01(ext));
  c.save(); c.translate(x, y); c.scale(dir * s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  if (e > .03) {
    const tail = -4 - 38 * e, head = -4 + 48 * e;
    c.beginPath(); c.roundRect(tail, -15, head - tail, 15, 7.5); fillStroke(c, lgr(c, 0, -15, 0, 0, [[0, lite(skin, .3)], [1, skin]]), line, 1.5);
    circ(c, head - 2, -11, 9); fillStroke(c, lgr(c, 0, -20, 0, -2, [[0, lite(skin, .3)], [1, skin]]), line, 1.5);
    for (const k of [0, 1]) {
      const bx = head - 5 + k * 7, tx = bx + 3 + Math.sin(time * 3 + k * 2) * 2.2 * e, ty = -32 - k * 1.5;
      c.strokeStyle = line; c.lineWidth = 3; c.beginPath(); c.moveTo(bx, -17); c.quadraticCurveTo(bx + 1, -25, tx, ty); c.stroke();
      eye(c, tx, ty, 3.3);
    }
    c.strokeStyle = line; c.lineWidth = 1.4; c.beginPath(); c.arc(head, -10, 3.8, .25, Math.PI * .75); c.stroke();
  }
  const sx = -6, sy = -27, r = 25;
  circ(c, sx, sy, r); fillStroke(c, rgr(c, sx - 8, sy - 9, 3, sx, sy, r, [[0, lite(C.honey, .5)], [.55, mix(C.honey, C.earth, .35)], [1, mix(C.earth, C.ink, .15)]]), dark(C.earth, .5), 1.8);
  c.strokeStyle = alpha(dark(C.earth, .45), .85); c.lineWidth = 2.2; c.beginPath();
  for (let t = 0; t <= 4.6 * Math.PI; t += .2) { const rr = 2 + (r - 5) * (t / (4.6 * Math.PI)); (t ? c.lineTo : c.moveTo).call(c, sx + rr * Math.cos(t), sy + rr * Math.sin(t)); }
  c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 2.4; c.beginPath(); c.arc(sx, sy, r - 4, Math.PI * 1.05, Math.PI * 1.45); c.stroke();
  c.restore();
}

// a curious fox, facing right, origin on the ground; head turns by `head` radians (positive = nose down)
function drawFox(c, x, y, s, o = {}) {
  const { dir = 1, head = 0, walk = 0 } = o, line = dark(ROBIN, .5), cream = lite(ROBIN, .8);
  c.save(); c.translate(x, y); c.scale(dir * s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  c.save(); c.translate(-48, -34); c.rotate(-.5); ell(c, 0, 0, 27, 11); fillStroke(c, lgr(c, 0, -11, 0, 11, [[0, lite(ROBIN, .2)], [1, dark(ROBIN, .15)]]), line, 1.6);
  ell(c, -22, -1, 9, 8); fillStroke(c, cream, line, 1.3); c.restore();
  for (let i = 0; i < 4; i++) {
    const hxp = [-28, -16, 18, 30][i], sw = Math.sin(walk + i * 1.6) * .55;
    c.save(); c.translate(hxp, -20); c.rotate(sw); c.beginPath(); c.roundRect(-4.5, 0, 9, 21, 4.5); fillStroke(c, i % 2 ? dark(ROBIN, .1) : ROBIN, line, 1.4);
    c.beginPath(); c.roundRect(-4.5, 14, 9, 7, 3.5); fillStroke(c, dark(ROBIN, .55), line, 1.2); c.restore();
  }
  ell(c, 0, -30, 42, 19); fillStroke(c, lgr(c, 0, -49, 0, -10, [[0, lite(ROBIN, .22)], [1, dark(ROBIN, .1)]]), line, 1.8);
  ell(c, 18, -25, 22, 12); c.fillStyle = cream; c.fill();
  c.save(); c.translate(36, -40); c.rotate(head);
  for (const [ex, tilt] of [[-3, -.15], [9, .2]]) {
    c.save(); c.translate(ex, -10); c.rotate(tilt); c.beginPath(); c.moveTo(-6, 2); c.lineTo(0, -21); c.lineTo(8, 2); c.closePath(); fillStroke(c, ROBIN, line, 1.5);
    c.beginPath(); c.moveTo(-3, 0); c.lineTo(0, -14); c.lineTo(4, 0); c.closePath(); c.fillStyle = dark(ROBIN, .6); c.fill(); c.restore();
  }
  ell(c, 8, 0, 18, 14); fillStroke(c, lgr(c, 0, -14, 0, 14, [[0, lite(ROBIN, .2)], [1, ROBIN]]), line, 1.8);
  ell(c, 8, 6, 14, 8); c.fillStyle = cream; c.fill();
  c.beginPath(); c.moveTo(18, -5); c.quadraticCurveTo(34, -2, 41, 3); c.quadraticCurveTo(30, 12, 16, 10); c.closePath(); fillStroke(c, lgr(c, 0, -5, 0, 11, [[0, ROBIN], [.55, ROBIN], [.56, cream], [1, cream]]), line, 1.5);
  circ(c, 41, 3, 3.3); c.fillStyle = C.ink; c.fill();
  eye(c, 15, -3, 3.8);
  c.strokeStyle = line; c.lineWidth = 1.5; c.beginPath(); c.moveTo(10, -9); c.lineTo(19, -8.2); c.stroke();
  c.restore();
  c.restore();
}

  circ(c, 0, 0, 11.5); fillStroke(c, rgr(c, -3, -5, 1, 0, 0, 13, [[0, lite(down, .5)], [1, dark(down, .1)]]), dark(down, .4), 1.5);
  eye(c, -4.4, -2, 1.9); eye(c, 4.4, -2, 1.9);

}

  for (let i = 0; i < eggsN % 13; i++) { const x = 225 + (eggR() * 2 - 1) * 56, y = 410 + (eggR() * 2 - 1) * 24; ell(c, x, y, 6, 4.4, eggR()); fillStroke(c, '#ffffff', alpha(C.ink, .4), .8); }
  for (let i = 0; i < seedsN % 13; i++) { const x = 585 + (seedR() * 2 - 1) * 56, y = 410 + (seedR() * 2 - 1) * 24; ell(c, x, y, 5.4, 3.6, seedR() * 3); fillStroke(c, lite(C.earth, .2), dark(C.earth, .5), .8); }
  for (let i = 0; i < 4; i++) { const x = 372 + i * 19, y = 496 + (i % 2) * 6; ell(c, x, y, 6, 4.4); fillStroke(c, '#ffffff', alpha(C.ink, .4), .8); }
  drawAnt(c, 440, 505, .2, time, 1, null);
  for (const [x, y, ang, carry, an] of ants) drawAnt(c, x, y, ang, time, an.off, carry);
  // room labels: pills at a steady size on screen
  const t = T_(), fs = 13 / G.s;
  c.font = `800 ${fs}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const [txt, x, y] of [[t.sec.nursery, 225, 454], [t.sec.food, 585, 454]]) {
    const tw = c.measureText(txt).width + 16 / G.s;
    c.beginPath(); c.roundRect(x - tw / 2, y - 11 / G.s, tw, 22 / G.s, 11 / G.s); c.fillStyle = 'rgba(20,24,38,.82)'; c.fill();
    c.fillStyle = '#ffffff'; c.fillText(txt, x, y + .5 / G.s);
  }
  if (carrying !== antLast) { antLast = carrying; lab.setReadout(`🐜 ${carrying}`, '', ''); }
}

// --- state ----------------------------------------------------------------------------------------------------
const T_ = () => T[lang];
const mk = (n) => ({ i: 0, phase: 'ask', t0: 0, picked: null, ready: false, done: new Array(n).fill(false), doneAt: new Array(n).fill(0), tAsk: clock() });
const S = { homes: mk(6), safe: mk(2), build: mk(4), sec: null, secT0: 0, cam: { x: 400, y: 300, z: 1, snap: true } };
const N = { homes: 6, safe: 2, build: 4 };
let G = { s: 1, cx: 400, cy: 300, w: 800, h: 600 };

function camBegin(c, w, h, dt, tx, ty, tz) {
  const cam = S.cam, k = cam.snap ? 1 : 1 - Math.exp(-dt * 4.5);
  cam.snap = false; cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; cam.z += (tz - cam.z) * k;
  const s = Math.min(w / W, h / H) * cam.z, hw = w / s / 2, hh = h / s / 2;
  const cx = hw * 2 < W ? clamp(cam.x, hw, W - hw) : W / 2, cy = hh * 2 < H ? clamp(cam.y, hh, H - hh) : H / 2;
  c.save(); c.translate(w / 2, h / 2); c.scale(s, s); c.translate(-cx, -cy);
  G = { s, cx, cy, w, h };
}

const lab = shell({ key: 'animal-homes', T, topics: TOPICS, views: ['homes', 'safe', 'build'], onLang: () => render(), onView: () => { S.sec = null; S.cam.snap = true; if (S[lab.view].phase === 'ask') S[lab.view].tAsk = clock(); render(); } });
const secret = secretLab('animal-homes', () => ({
  secrets: [{ emo: '🧶', title: T[lang].secrets.weaver[0], desc: T[lang].secrets.weaver[1] }, { emo: '🐜', title: T[lang].secrets.ants[0], desc: T[lang].secrets.ants[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div class="ah-q" id="ahQ"></div>
  <div class="ah-opts" id="ahOpts"></div>
  <div class="ah-fb" id="ahFb"></div>
  <div class="row2"><button class="btn ah-next" id="ahNext" hidden></button></div>
  <div class="row2 ah-sec" id="ahSec"></div>`;

const PICT = /^\p{Extended_Pictographic}/u;
const splitOpt = (s) => { if (!PICT.test(s)) return ['', s]; const i = s.indexOf(' '); return [s.slice(0, i), s.slice(i + 1)]; };
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const finish = (R2, time) => { R2.ready = true; R2.done[R2.i] = true; R2.doneAt[R2.i] = time; render(); };
function tick(time) {
  const v = lab.view, R2 = S[v];
  if (S.sec || R2.phase === 'ask' || R2.ready) return;
  const dt0 = time - R2.t0;
  if (v === 'homes') {
    if (R2.phase === 'puzzle' && dt0 > PUZ) { R2.phase = 'arrive'; R2.t0 = time; }
    else if (R2.phase === 'arrive' && dt0 > ARRD[HOMES[R2.i].id]) finish(R2, time);
  } else if (dt0 > DUR[v][R2.i]) finish(R2, time);
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  tick(time);
  c.lineJoin = 'round';
  if (S.sec === 'weaver') { camBegin(c, w, h, dt, 400, 300, 1); weaverScene(c, w, h, time); c.restore(); }
  else if (S.sec === 'ants') { camBegin(c, w, h, dt, 400, 300, 1); antsScene(c, w, h, time); c.restore(); }
  else if (lab.view === 'homes') sceneHomes(c, w, h, time, dt);
  else if (lab.view === 'safe') sceneSafe(c, w, h, time, dt);
  else sceneBuild(c, w, h, time, dt);
});

function answer(j) {
  const v = lab.view, R2 = S[v];
  if (R2.phase !== 'ask' || S.sec) return;
  const ok = (v === 'homes' ? T_().h.ok[R2.i] : v === 'safe' ? SOK[R2.i] : T_().b.ok[R2.i]) === j;
  R2.picked = j; R2.t0 = clock();
  R2.phase = v === 'homes' ? (ok ? 'arrive' : 'puzzle') : 'reveal';
  (ok ? sfx.good : sfx.bad)();
  render(); showStage();
}
function resetView(v) { S[v] = mk(N[v]); S.cam.snap = true; }
function next() {
  const v = lab.view, R2 = S[v];
  if (!R2.ready) return;
  if (R2.done.every(Boolean)) resetView(v);
  else {
    let i = R2.i + 1;
    if (v === 'homes') { i = (R2.i + 1) % 6; while (R2.done[i]) i = (i + 1) % 6; }
    R2.i = i; R2.phase = 'ask'; R2.picked = null; R2.ready = false; R2.tAsk = clock();
    if (v !== 'homes') S.cam.snap = true;
  }
  sfx.click(); render();
}
$('ahOpts').addEventListener('click', (ev) => { const b = ev.target.closest('.ah-o'); if (b && !b.disabled) answer(+b.dataset.j); });
$('ahNext').onclick = next;
$('ahSec').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.sec;
  S.sec = S.sec === k ? null : k; S.secT0 = clock(); S.cam.snap = true; antLast = -1; sfx.click(); render(); if (S.sec) showStage();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'homes' || S.sec) return;
  const R2 = S.homes; if (R2.phase !== 'ask') return;
  const r = $('cv').getBoundingClientRect(), wx = (ev.clientX - r.left - G.w / 2) / G.s + G.cx, wy = (ev.clientY - r.top - G.h / 2) / G.s + G.cy;
  let best = -1, bd = 1e9;
  HOMES.forEach((hm, i) => { const d = Math.hypot(wx - hm.x, wy - hm.y); if (d < hm.r && d < bd && !R2.done[i]) { best = i; bd = d; } });
  if (best >= 0 && best !== R2.i) { R2.i = best; R2.tAsk = clock(); sfx.tick(); render(); }
});

// --- one render per change: question, options, readout and the state card ----------------------------------------
function render() {
  const t = T_(), v = lab.view, R2 = S[v], secOn = v === 'homes' && S.sec, end = R2.done.every(Boolean) && R2.ready;
  const k = R2.done.filter(Boolean).length, answered = R2.picked !== null;
  let q, opts, okIdx, why, emo;
  if (v === 'homes') { q = t.h.q[R2.i]; opts = t.h.o[R2.i]; okIdx = t.h.ok[R2.i]; why = t.h.why[R2.i]; emo = splitOpt(opts[okIdx])[0]; }
  else if (v === 'safe') { q = t.s['q' + (R2.i + 1)]; opts = t.s['o' + (R2.i + 1)]; okIdx = SOK[R2.i]; why = t.s['r' + (R2.i + 1)]; emo = R2.i ? '🐦' : '🐇'; }
  else { q = t.b.q[R2.i]; opts = t.b.o[R2.i]; okIdx = t.b.ok[R2.i]; why = t.b.why[R2.i]; emo = splitOpt(opts[okIdx])[0]; }
  const colors = { homes: ['#4FA35A', 'rgba(79,163,90,.3)'], safe: ['#5BB3D9', 'rgba(91,179,217,.3)'], build: ['#F4B63D', 'rgba(244,182,61,.28)'] }[v];
  lab.setGlow(colors[1]);
  const hide = secOn || end;
  $('ahQ').textContent = hide ? '' : q; $('ahQ').style.display = hide ? 'none' : '';
  $('ahOpts').className = 'ah-opts' + (v === 'homes' ? ' ah-c3' : '');
  $('ahOpts').style.display = hide ? 'none' : '';
  $('ahOpts').innerHTML = hide ? '' : opts.map((o, j) => {
    const [e, wd] = splitOpt(o), cls = answered ? (j === okIdx ? 'good' : j === R2.picked ? 'bad' : 'dim') : '';
    return `<button class="ah-o ${cls}" data-j="${j}"${answered ? ' disabled' : ''}>${e ? `<span class="e">${e}</span>` : ''}<span class="w">${esc(wd)}</span></button>`;
  }).join('');
  const ok = answered && R2.picked === okIdx;
  $('ahFb').textContent = !hide && answered ? (ok ? t.right : t.wrong) : ''; $('ahFb').className = 'ah-fb' + (!hide && answered ? (ok ? ' good' : ' bad') : '');
  $('ahNext').hidden = hide ? !(end && !secOn) : !(answered && R2.ready);
  $('ahNext').textContent = end ? t.again : t.next;
  $('ahSec').innerHTML = v === 'homes' ? ['weaver', 'ants'].map((s) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === s ? 'on' : ''}" data-sec="${s}">${secret.unlocked() ? `${s === 'weaver' ? '🧶' : '🐜'} ${esc(t.secrets[s][0])}` : '🔒 ???'}</button>`).join('') : '';
  if (secOn) {
    lab.setReadout(S.sec === 'weaver' ? '🧶' : '🐜', '', '', colors[0]);
    lab.setState({ emo: S.sec === 'weaver' ? '🧶' : '🐜', title: t.secrets[S.sec][0], lead: S.sec === 'weaver' ? t.sec.weaverText : t.sec.antsText, body: '' });
    return;
  }
  lab.setReadout(`${k}/${N[v]}`, '', end && v === 'homes' ? t.h.all : '', colors[0]);
  if (end) { const [e, ti, le] = t.st[v].f; lab.setState({ emo: e, title: ti, lead: le, body: why }); }
  else if (answered) lab.setState({ emo: emo || '🏡', title: ok ? t.right : t.wrong, lead: why, body: '' });
  else { const [e, ti, le, bo] = t.st[v].n; lab.setState({ emo: e, title: ti, lead: le, body: bo }); }
}
render();
</script>
</body>
</html>
