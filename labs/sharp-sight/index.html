const N_VIT = 1.336, P0 = 60, L_NORM = 1000 * N_VIT / P0; // relaxed power 60 D, so a normal eye is 22.3 mm long
const AMP = 4, AMP_OLD = 0.5;      // how much the eye's lens can add (illustrative); about 0.5 D at age 50
const FAR_D = 0.05, NEAR_D = 1 / 0.35; // vergence of the tree (20 m) and of the book (35 cm), in dioptres
const EYES = { short: 1000 * N_VIT / 58, long: 1000 * N_VIT / 63, normal: L_NORM }; // about -2 D, +3 D, 0 D

const BLUR_PER_D = 4.6, SCENE_K = 1.5; // blur radius per dioptre of error, in design units
const optics = (L, Pg, obj, pf, amp) => {
  const invD = obj === 'far' ? FAR_D : NEAR_D;
  const e0 = N_VIT / (L / 1000) - P0;          // error of the relaxed eye for a very far object
  const need = e0 + invD - Pg;                 // how much extra power the eye must add to focus this object
  const a = clamp(need, 0, amp);
  const deficit = need - a;                    // < 0: focus in front of the retina, > 0: behind
  const blur = BLUR_PER_D * SCENE_K * Math.max(0, Math.abs(deficit) - 0.25) * pf;
  return { a, deficit, blur, ok: Math.abs(deficit) <= 0.5, invD };
};

// draws src (a sheet) into a circle of radius R, blurred by averaging copies shifted over a disc of radius r (a blur disc, like a real out-of-focus eye)
function blurCircle(c, src, cx, cy, R, r) {
  const k = src.width / (2 * SH);
  r = clamp(r, 0, 28);
  c.save(); c.beginPath(); c.arc(cx, cy, R, 0, 6.2832); c.clip();
  const pts = r < 0.6 ? [[0, 0]] : RING;
  pts.forEach(([ux, uy], i) => {
    c.globalAlpha = 1 / (i + 1);
    c.drawImage(src, (SH - R + ux * r) * k, (SH - R + uy * r) * k, 2 * R * k, 2 * R * k, cx - R, cy - R, 2 * R, 2 * R);
  });
  c.restore();
}

  if (act === 'ans') answer(+k);
  else if (act === 'eye') { S.eye = k; sfx.click(); }
  else if (act === 'lens') { S.Pg = +k; sfx.tick(); }
  else if (act === 'obj') { S.obj = k; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    S[k] = !S[k]; sfx.click();
    if (S[k]) { S.Pg = 0; if (k === 'sq') S.eye = 'short'; else { S.eye = 'normal'; S.obj = 'near'; } } // each secret sets up its own eye
  }
  else if (act === 'mode') { S.mode = k; sfx.click(); }
  else if (act === 'gaze') { S.gaze = k; sfx.click(); }
  else if (act === 'start') { S.gaze = 'far'; S.breaking = true; S.breakDone = false; S.breakT = 0; S.lastSec = -1; sfx.click(); }
  render();
});
$('sl1').addEventListener('input', (ev) => { S.L = L_NORM + +ev.target.value; S.fresh1 = false; render(); });
$('sl3').addEventListener('input', (ev) => { S.D = +ev.target.value; render(); });

// --- one render per change: controls, readout and the state card -------------------------------------------
const pqHtml = (t, g, d, okIdx) => (g === null
  ? `<div class="q">${esc(d.q)}</div><div class="chips">${d.opts.map((o, i) => `<button class="chip" data-act="ans" data-k="${i}">${esc(o)}</button>`).join('')}</div>`
  : `<div class="ss-verdict ${g === okIdx ? 'ok' : 'no'}">${esc(g === okIdx ? t.right : d.wrong)}</div>`);
const fineHtml = (t) => `<div class="fine">${esc(t.fine)}</div>`;

function render() {
  const t = T[lang], v = lab.view;
  $('v1').hidden = v !== 'focus' || S.g1 === null;
  $('v2').hidden = v !== 'lens' || S.g2 === null || S.g1 === null;
  $('v3').hidden = v !== 'chart';
  $('v3t').hidden = v !== 'chart' || S.mode !== 'test' || S.g3 === null;
  $('v3h').hidden = v !== 'chart' || S.mode !== 'hab';
  $('pq').hidden = false;
  if (v === 'focus') renderFocus(t);
  else if (v === 'lens') renderLens(t);
  else renderChart(t);
}

function renderFocus(t) {
  const d = t.f1, o = optics(S.L, 0, 'far', 1, 0), out = outcomeOf(o.deficit);
  lab.setGlow('rgba(255, 200, 90, .24)');
  $('pq').innerHTML = pqHtml(t, S.g1, d, 1);
  $('l1').textContent = d.sl; $('lg1a').textContent = d.shorter; $('lg1b').textContent = d.norm; $('lg1c').textContent = d.longer;
  $('sl1').setAttribute('aria-label', d.sl);
  if (S.g1 === null) {
    lab.setReadout('?', '', '', '#ffc85a');
    lab.setState({ emo: '🤔', title: d.stT, lead: d.stL, body: '', extra: fineHtml(t) });
  } else {
    const off = S.L - L_NORM;
    lab.setReadout(Math.abs(off) < 0.05 ? '0 mm' : `${off > 0 ? '+' : '−'}${fmt(Math.abs(off))} mm`, d.sub, d.pill[out], '#ffc85a');
    const [ti, le] = d.out[out];
    lab.setState(S.fresh1
      ? { emo: S.g1 === 1 ? '✅' : '🤔', title: S.g1 === 1 ? t.right : d.wrong, lead: le, body: d.go, extra: fineHtml(t) }
      : { emo: '👁️', title: ti, lead: le, body: '', extra: fineHtml(t) });
  }
  lab.setFacts(t.facts.focus);
}

function renderLens(t) {
  const d = t.f2, L = EYES[S.eye], pf = S.sq ? 0.3 : 1, amp = S.old ? AMP_OLD : AMP, open = secret.unlocked();
  lab.setGlow('rgba(110, 190, 255, .26)');
  $('pq').innerHTML = S.g1 === null ? `<div class="ss-verdict no">${esc(d.lock)}</div>` : pqHtml(t, S.g2, d, 1);
  $('eyes').innerHTML = ['short', 'normal', 'long'].map((k) => `<button class="chip ${S.eye === k ? 'on' : ''}" data-act="eye" data-k="${k}">${esc(d.eyes[k])}</button>`).join('');
  $('lensLbl').textContent = d.lensL;
  $('rack').innerHTML = RACK.map((p) => `<button class="chip ${S.Pg === p ? 'on' : ''}" data-act="lens" data-k="${p}" aria-label="${sgn(p)} ${t.D}">${p === 0 ? esc(d.none) : `${sgn(p)} ${esc(t.D)}`}</button>`).join('');
  $('objs').innerHTML = ['far', 'near'].map((k) => `<button class="chip ${S.obj === k ? 'on' : ''}" data-act="obj" data-k="${k}">${esc(d.objs[k])}</button>`).join('');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S[k] ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secs').innerHTML = sc('sq', '🕳️') + sc('old', '🧓');
  if (S.g2 === null || S.g1 === null) {
    lab.setReadout('?', '', '', '#6ebeff');
    lab.setState({ emo: '🤔', title: d.stT, lead: S.g1 === null ? d.lock : d.stL, body: '', extra: fineHtml(t) });
    lab.setFacts(t.facts.lens);
    return;
  }
  const fo = optics(L, S.Pg, 'far', pf, amp), no = optics(L, S.Pg, 'near', pf, amp);
  let st;
  if (fo.ok && no.ok) st = Math.abs(S.Pg) < 0.01 ? d.sharp0 : S.eye === 'normal' ? d.hardN : S.eye === 'short' ? d.fixS : d.fixL;
  else if (!fo.ok && !no.ok) st = d.bothBlur;
  else if (!fo.ok) st = fo.deficit < 0 ? d.farFront : d.farBehind;
  else st = S.old ? d.nearBlurOld : d.nearBlur;
  const pillK = fo.ok && no.ok ? 'ok' : !fo.ok && !no.ok ? 'both' : !fo.ok ? 'far' : 'near';
  lab.setReadout(`${sgn(S.Pg)} ${t.D}`, d.eyes[S.eye], d.pill[pillK], '#6ebeff');
  const extra = [S.sq ? `<b>${esc(d.sq[0])}.</b> ${esc(d.sq[1])}` : '', S.old ? esc(d.old) : ''].filter(Boolean).join('<br>');
  lab.setState({ emo: fo.ok && no.ok ? '✅' : '👓', title: st[0], lead: st[1], body: '', extra: (extra ? `<p style="margin:0 0 8px">${extra}</p>` : '') + fineHtml(t) });
  lab.setFacts(t.facts.lens);
}

function renderChart(t) {
  const d = t.f3, rows = rowsFor();
  $('modes').innerHTML = ['test', 'hab'].map((k) => `<button class="chip ${S.mode === k ? 'on' : ''}" data-act="mode" data-k="${k}">${esc(d.modes[k])}</button>`).join('');
  $('l3').textContent = `${d.sl} · ${d.slU}`; $('sl3').setAttribute('aria-label', d.sl);
  $('startB').textContent = d.start;
  $('gaze').innerHTML = ['near', 'far'].map((k) => `<button class="chip ${S.gaze === k ? 'on' : ''}" data-act="gaze" data-k="${k}">${esc(d.gaze[k])}</button>`).join('');
  if (S.mode === 'test') {
    lab.setGlow('rgba(95, 200, 160, .24)');
    $('pq').hidden = false; $('pq').innerHTML = pqHtml(t, S.g3, d, 2);
    const n = rows.filter((row) => row.h >= 4.5 * BLUR_PER_D * S.D).length;
    if (S.g3 === null) {
      lab.setReadout('?', '', '', '#5fc8a0');
      lab.setState({ emo: '🤔', title: d.stT, lead: d.stL, body: '', extra: fineHtml(t) });
    } else {
      if (n === 3) S.t3 = true;
      $('task').className = `ss-task ${S.t3 ? 'done' : ''}`; $('task').textContent = S.t3 ? `✓ ${d.taskDone}` : d.task;
      lab.setReadout(rows[Math.max(0, n - 1)].label, d.sub, d.pill(n), '#5fc8a0');
      lab.setState({ emo: n === 3 && S.t3 ? '🎯' : '🔠', title: d.resT(n), lead: d.resL, body: '', extra: fineHtml(t) });
    }
    lab.setFacts(t.facts.test);
  } else {
    lab.setGlow('rgba(120, 210, 130, .24)');
    $('pq').hidden = true;
    const a = S.gaze === 'far' ? FAR_D : NEAR_D, sec = Math.ceil(20 - S.breakT);
    let st = S.gaze === 'far' ? d.stFar : d.stNear;
    if (S.breakDone) st = d.stDone; else if (S.breaking) st = S.gaze === 'far' ? d.stBreak(Math.max(1, sec)) : d.stPaused;
    lab.setReadout(`${fmt(a)} ${t.D}`, d.effort, S.breakDone ? `✓ 20 ${d.sec}` : S.breaking ? `${Math.max(1, sec)} ${d.sec}` : '', '#78d282');
    lab.setState({ emo: S.breakDone ? '🎉' : S.gaze === 'far' ? '🌳' : '💻', title: st[0], lead: st[1], body: '', extra: fineHtml(t) });
    lab.setFacts(t.facts.hab);
  }
}

canvasLoop($('cv'), frame);
render();
</script>
