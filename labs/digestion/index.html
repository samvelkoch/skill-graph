function pill(c, text, x, y, size = 12, border = '#fff', align = 'center', w = 0) {

function catmull(pts, n = 6) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map((d) => 0.5 * (2 * p1[d] + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3)));
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}

    for (let i = 0; i <= 9; i++) c.fillText(i === 9 ? `9 ${t.m}` : String(i), pad + i * ppm - (i === 9 ? 10 : 0), ty + 15);
    // labels: names only, leaders for the short parts
    const rows = [gy + 50, gy + 68, gy + 86], cx = (j) => pad + (M0[j] + M_SEG[j] / 2) * ppm, rim = '#8E86A8';
    const lead = (x, y1) => { c.strokeStyle = 'rgba(80,60,60,.4)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, gy + 33); c.lineTo(x, y1 - 10); c.stroke(); };
    lead(cx(0), rows[2]);
    labelFit(c, t.seg[0], cx(0) + 60, rows[2], rim, w);
    lead(cx(1), rows[1]); labelFit(c, t.seg[1], cx(1) + 32, rows[1], rim, w);
    labelFit(c, t.seg[2], cx(2), rows[0], glowSI ? GOLD : rim, w);
    labelFit(c, t.seg[3], cx(3), rows[0], rim, w);
    const ox = pad + 8.55 * ppm; lead(ox, rows[1]); labelFit(c, t.other, ox - 38, rows[1], rim, w);
    // a grown-up 1.7 m and a car 4.5 m, to the same scale
    adult(c, pad + .35 * ppm, base, 1.7 * ppm);
    pill(c, `${num(1.7)} ${t.m}`, pad + .35 * ppm, base - 1.7 * ppm - 14, 12, rim, 'center', w);
    const cx0 = pad + 1.5 * ppm, k = (x, y) => [cx0 + x * ppm, base + y * ppm];
    car(c, k, ppm);
    pill(c, `${num(4.5)} ${t.m}`, ...k(2.25, -1.4 - 18 / ppm), 12, rim, 'center', w);
  }
  c.restore();
  // two cross-sections, to scale with each other
  if (St.pick[1] !== null) {
    const e = ease(clamp((time - St.t1) / .5, 0, 1)), cm = clamp(w / 330 * 8.8, 8.8, 15), r1 = 1.25 * cm * e, r2 = 3.25 * cm * e, cy = 10 + 3.25 * cm;
    for (const [x, r, k, wcm] of [[w * .52, r1, 2, 2.5], [w * .8, r2, 3, 6.5]]) {
      cross(c, x, cy, r, k === 2 ? 'si' : 'li');
      if (e > .9) { labelFit(c, t.seg[k], x, cy + 3.25 * cm + 16, '#8E86A8', w); labelFit(c, `≈ ${num(wcm)} ${t.cm}`, x, cy + 3.25 * cm + 36, '#8E86A8', w); }
    }
  }
  const txt = stretchVal(time);
  if ($('val').textContent !== txt) $('val').textContent = txt;
}

// ====================================================================================================================
canvasLoop($('cv'), (c, w, h, dt, time) => {
  panel(c, w, h); // opens a rounded clip that keeps the whole scene inside the page
  try { scene(c, w, h, dt, time); } finally { c.restore(); }
});
function scene(c, w, h, dt, time) {
  const v = lab.view;
  if (v === 'stretch') return stretchScene(c, w, h, time);
  if (v === 'journey' && S.sec === 'villi') return villiScene(c, w, h, time, dt);
  let P;
  if (v === 'journey') {
    if (S.sec === 'upside') P = upsidePose(time);
    else { tickJourney(dt); P = journeyPose(time); }
  } else P = jobsPose(time);
  tickFX(dt, P, time);
  drawBody(c, w, h, time, P);
}
// tapping a part (jobs, once the five rounds are done)
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'jobs' || !B.done || !VIEW.on) return;
  const r = $('cv').getBoundingClientRect();
  const x = (ev.clientX - r.left - VIEW.ox) / VIEW.K, y = (ev.clientY - r.top - VIEW.oy) / VIEW.K;
  let best = -1, bd = 28 / VIEW.K; // a generous 28 px around the tube
  PIECES.forEach((arr, k) => {
    let m = 1e9; for (const p of arr) m = Math.min(m, Math.hypot(p[0] - x, p[1] - y));
    if (m - W[k] / 2 < bd) { bd = m - W[k] / 2; best = k; }
  });
  if (best < 0) return;
  B.tap = best; B.t0 = now(); sfx.click(); render();
});

// --- controls ------------------------------------------------------------------------------------------------
// on a phone the buttons sit below the scene: bring the stage into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null;
    else { S.sec = k; U.t0 = -9; V.flat = 0; V.target = 0; } // a secret sets itself up when pressed
    sfx.click(); render(); return;
  }
  if (act === 'swallow') { U.t0 = now(); sfx.push(); return; }
  if (act === 'flat') { V.target = V.target ? 0 : 1; sfx.click(); render(); return; }
  if (act === 'j1') {
    if (J.pick1 !== null) return;
    J.pick1 = i; J.phase = 'run'; J.stop = 0; J.st = 'travel'; J.t = 0; sfx.click(); showStage(); render(); return;
  }
  if (act === 'j2') {
    if (J.pick2 !== null) return;
    J.pick2 = i; J.phase = 'rev2'; J.q2t = now(); spawnDrink(J.q2t); (i === 0 ? sfx.good : sfx.bad)(); showStage(); render(); return;
  }
  if (act === 'jn') {
    sfx.click();
    if (J.phase === 'hold') { J.phase = 'run'; J.stop = 4; J.st = 'travel'; J.t = 0; }
    else { J = newJ(); FX.length = 0; }
    render(); return;
  }
  if (act === 'ban') {
    if (B.rev) return;
    B.pick = i; B.rev = true; B.t0 = now(); B.res[B.round] = i === B.round; (i === B.round ? sfx.good : sfx.bad)(); showStage(); render(); return;
  }
  if (act === 'bn') {
    sfx.click();
    if (B.round >= 4) { B.done = true; B.tap = -1; B.rev = false; } else { B.round++; B.opts = bOpts(B.round); B.pick = null; B.rev = false; }
    render(); return;
  }
  if (act === 'ba') { sfx.click(); B = newB(); FX.length = 0; render(); return; }
  if (act === 'san') {
    const q = St.q - 1; if (St.rev[q]) return;
    St.pick[q] = i; St.rev[q] = true; if (q === 0) St.t0 = now(); else St.t1 = now();
    (i === (q === 0 ? 2 : 1) ? sfx.good : sfx.bad)(); showStage(); render(); return;
  }
  if (act === 'sn') { sfx.click(); if (St.q === 1) St.q = 2; else St = newSt(); render(); }
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
const dots = (res, cur, n) => Array.from({ length: n }, (_, i) => (res[i] !== undefined ? (res[i] ? '✔' : '✘') : i === cur ? '◉' : '○')).join(' ');
const verdictHtml = (ok, t, why) => `<div class="verdict ${ok ? 'ok' : 'no'}">${ok ? '✅' : '🤔'} ${esc(ok ? t.right : t.wrong)}</div><p class="why">${esc(why)}</p>`;
const nextBtn = (t) => `<div class="row2"><button class="btn" data-act="NEXT">${esc(t.next)}</button></div>`;
const fineHtml = (t) => `<div class="fine">${esc(t.fine)}</div>`;
const cardOf = (c) => { const [emo, title, lead, body] = c; return { emo, title, lead, body }; };
// a question with its answer buttons; `pick` is what was chosen (null: still open), `rev` shows the verdict colours
const qBlock = (q, opts, right, pick, rev, act, order) => `<div class="qline">${esc(q)}</div><div class="ansrow list">${(order ?? opts.map((_, i) => i)).map((i) => {
  const cls = rev ? (i === right ? 'ok' : i === pick ? 'no' : 'dim') : (i === pick ? 'sel' : '');
  return `<button class="ans ${cls}" data-act="${act}" data-i="${i}"${pick !== null ? ' disabled' : ''}>${esc(opts[i])}</button>`;
}).join('')}</div>`;
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v === 'journey') renderJourney(t); else if (v === 'jobs') renderJobs(t); else renderStretch(t);
}

function renderJourney(t) {
  const open = secret.unlocked(), j = t.j;
  const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  const chips = `<div class="row2 secrow">${chip('upside', '🙃')}${chip('villi', '🔬')}</div>`;
  if (S.sec === 'upside') {
    lab.setGlow('rgba(200,150,230,.24)');
    lab.setReadout('🙃', t.secrets.upside[0], '', '#c89be6');
    $('ctrlBody').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn" data-act="swallow">${esc(t.sec.swallow)}</button></div>${chips}`;
    lab.setState({ emo: '🙃', title: t.secrets.upside[0], lead: t.sec.upsideText, body: '', extra: '' });
    return;
  }
  if (S.sec === 'villi') {
    lab.setGlow('rgba(240,150,170,.24)');
    lab.setReadout(villiVal(), t.secrets.villi[0], '', '#f09aa8');
    $('ctrlBody').innerHTML = `<div class="row2" style="margin-top:0"><button class="chip ${V.target ? 'on' : ''}" data-act="flat" aria-pressed="${V.target ? 'true' : 'false'}">${esc(t.sec.flatten)}</button></div>${chips}`;
    lab.setState({ emo: '🔬', title: t.secrets.villi[0], lead: t.sec.villiText, body: '', extra: fineHtml(t) });
    return;
  }
  lab.setGlow('rgba(240,140,160,.22)');
  let html;
  if (J.phase === 'q2' || J.phase === 'rev2') {
    const rev = J.phase === 'rev2';
    html = qBlock(j.q2, j.o2, 0, J.pick2, rev, 'j2') + (rev ? verdictHtml(J.pick2 === 0, t, j.r2) + nextBtn(t).replace('NEXT', 'jn') : '');
  } else {
    html = qBlock(j.q1, j.o1, 1, J.pick1, J.v1, 'j1') + (J.v1 ? verdictHtml(J.pick1 === 1, t, j.r1) : '') + (J.phase === 'hold' ? nextBtn(t).replace('NEXT', 'jn') : '');
  }
  $('ctrlBody').innerHTML = html + chips;
  if (J.phase === 'ask1') lab.setReadout('?', '', '', '#f09aa8');
  else if (J.phase === 'q2' || J.phase === 'rev2') lab.setReadout('🥤', '', '', '#5db4ff');
  else lab.setReadout(esc(j.stops[J.stop]), j.time[J.stop], '', '#f09aa8');
  lab.setState(cardOf(J.v1 || J.phase === 'q2' || J.phase === 'rev2' ? t.cards.j1 : t.cards.j0));
}

function renderJobs(t) {
  const b = t.b;
  lab.setGlow('rgba(150,170,230,.2)');
  if (B.done) {
    $('ctrlBody').innerHTML = `<div class="qline">${esc(b.done)}</div><div class="row2"><button class="btn ghost" data-act="ba">${esc(t.again)}</button></div>`;
    lab.setReadout(B.tap >= 0 ? esc(t.j.stops[B.tap]) : '?', B.tap >= 0 ? b.jobs[B.tap] : '', '', '#9db4ff');
  } else {
    const right = B.round;
    $('ctrlBody').innerHTML = qBlock(b.q, b.jobs, right, B.pick, B.rev, 'ban', B.opts)
      + (B.rev ? verdictHtml(B.res[B.round], t, b.why[B.round]) + nextBtn(t).replace('NEXT', 'bn') : '');
    lab.setReadout(esc(t.j.stops[B.round]), dots(B.res, B.round, 5), '', '#9db4ff');
  }
  lab.setState(cardOf(t.cards.jobs));
}

function renderStretch(t) {
  const s = t.s, q = St.q - 1, rev = St.rev[q];
  lab.setGlow('rgba(120,170,230,.2)');
  const [o, right] = q === 0 ? [s.o1, 2] : [s.o2, 1];
  $('ctrlBody').innerHTML = qBlock(q === 0 ? s.q1 : s.q2, o, right, St.pick[q], rev, 'san')
    + (rev ? verdictHtml(St.pick[q] === right, t, q === 0 ? s.r1 : s.r2) + nextBtn(t).replace('NEXT', 'sn') : '');
  lab.setReadout(stretchVal(now()), '', '', '#5db4ff');
  // the lengths in the card would answer the longest-part question, so they wait for that answer
  if (!St.rev[0]) lab.setState(cardOf(t.cards.s0));
  else if (!St.rev[1]) lab.setState({ emo: t.cards.s1[0], title: t.cards.s1[1], lead: '', body: '', extra: '' });
  else lab.setState({ ...cardOf(t.cards.s1), extra: fineHtml(t) });
}
render();
</script>
