function catmull(pts, n = 6) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map((d) => 0.5 * (2 * p1[d] + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3)));
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function rounded(pts, r, n = 8) { // polyline with rounded corners
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], b = pts[i], d = pts[i + 1];
    const la = Math.hypot(b[0] - a[0], b[1] - a[1]), ld = Math.hypot(d[0] - b[0], d[1] - b[1]);
    const d1 = Math.min(r, la / 2), d2 = Math.min(r, ld / 2);
    const p = [b[0] + (a[0] - b[0]) * d1 / la, b[1] + (a[1] - b[1]) * d1 / la], q = [b[0] + (d[0] - b[0]) * d2 / ld, b[1] + (d[1] - b[1]) * d2 / ld];
    for (let k = 0; k <= n; k++) { const t = k / n, u = 1 - t; out.push([u * u * p[0] + 2 * u * t * b[0] + t * t * q[0], u * u * p[1] + 2 * u * t * b[1] + t * t * q[1]]); }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function resample(pts, step) { // evenly spaced points along a polyline
  const out = [pts[0]]; let need = step;
  for (let i = 1; i < pts.length; i++) {
    let [x0, y0] = pts[i - 1]; const [x1, y1] = pts[i];
    let seg = Math.hypot(x1 - x0, y1 - y0);
    while (seg >= need) {
      const f = need / seg; x0 += (x1 - x0) * f; y0 += (y1 - y0) * f; out.push([x0, y0]); seg -= need; need = step;
    }
    need -= seg;
  }
  const last = pts[pts.length - 1], e = out[out.length - 1];
  if (Math.hypot(last[0] - e[0], last[1] - e[1]) > 0.3) out.push(last);
  return out;
}

const PX0 = [-30, 22];
function journeyPose(time) {

  if (J.phase === 'q2') return P;
  if (J.phase === 'rev2') { P.glass = (time - J.q2t) / .6; P.kid = (time - J.q2t - 3.4) / 1.2; return P; }
  const i = J.stop, dwell = J.st === 'dwell', fr = dwell ? clamp(J.t / DWELL[i], 0, 1) : 0, tr = dwell ? 1 : clamp(J.t / TRAVEL[i], 0, 1);
  const f = (k) => (i > k ? 1 : i === k && dwell ? fr : 0); // how far stop k is done
  if (i === 0) {
    if (!dwell) { const e = ease(tr); P.apple = { x: lerp(PX0[0], 0, e), y: lerp(PX0[1], 30, e), size: 16 - 4 * e }; }
    else { P.chew = Math.abs(Math.sin(fr * Math.PI * 3)); if (fr < .45) P.apple = { x: 0, y: 30, size: 12 }; else P.pieces = { x: 0, y: 32, spread: 2.2, mix: 0 }; }
    return P;
  }
  if (i === 5) { P.poop = { x: 0, y: 227 + 9 * ease(fr) }; return P; }
  const s = dwell ? lerp(SA[i], SB[i], ease(fr)) : lerp(SB[i - 1], SA[i], ease(tr));
  if (s < PART_S[2]) P.lump = { s, bulge: s >= PART_S[1] };
  else if (s < PART_S[3]) {
    const [x, y] = at(s), ch = i === 2 && dwell ? 1 : 0;
    P.churn = ch; P.blob = { x: x + 3 * Math.cos(time * 7) * ch, y: y + 3 * Math.sin(time * 9) * ch, mix: ease(f(2)) };
  } else if (s < PART_S[4]) {
    P.plug = { lo: PART_S[3], s, len: lerp(90, 30, f(3)), w: lerp(3.4, 1.3, f(3)), color: MUSH };
    if (i === 3 && dwell && J.phase === 'run') P.spawn = { kind: 'dot', lo: Math.max(PART_S[3] + 25, s - 40), s };
  } else {
    P.plug = { lo: PART_S[4], s, len: 26, w: lerp(1.4, 5.2, ease(clamp(f(4) * 4, 0, 1))), color: mixHex(MUSH, DARK, f(4)) };
    if (i === 4 && dwell && J.phase === 'run') P.spawn = { kind: 'drop', lo: PART_S[4] + 8, s: Math.max(PART_S[4] + 12, s) };
  }
  return P;
}
function tickJourney(dt) {
  if (J.phase !== 'run') return;
  J.t += dt;
  if (J.t < (J.st === 'travel' ? TRAVEL[J.stop] : DWELL[J.stop])) return;
  J.t = 0;
  if (J.st === 'travel') {
    J.st = 'dwell';
    if (J.stop === 3) { J.v1 = true; (J.pick1 === 1 ? sfx.good : sfx.bad)(); }
    sfx.tick(); render();
  } else if (J.stop === 3) { J.phase = 'hold'; J.t = DWELL[3]; render(); }
  else if (J.stop === 5) { J.phase = 'q2'; render(); }
  else { J.stop++; J.st = 'travel'; render(); }
}

  }
  $('ctrlBody').innerHTML = html + chips;
  if (J.phase === 'ask1') lab.setReadout('?', '', '', '#f09aa8');
  else if (J.phase === 'q2' || J.phase === 'rev2') lab.setReadout('🥤', '', '', '#5db4ff');
  else lab.setReadout(esc(j.stops[J.stop]), j.time[J.stop], '', '#f09aa8');
  lab.setState(cardOf(J.v1 || J.phase === 'q2' || J.phase === 'rev2' ? t.cards.j1 : t.cards.j0));
}

function renderJobs(t) {
  const b = t.b;
  lab.setGlow('rgba(150,170,230,.2)');
  if (B.done) {
    $('ctrlBody').innerHTML = `<div class="qline">${esc(b.done)}</div><div class="row2"><button class="btn ghost" data-act="ba">${esc(t.again)}</button></div>`;
    lab.setReadout(B.tap >= 0 ? esc(t.j.stops[B.tap]) : '?', B.tap >= 0 ? b.jobs[B.tap] : '', '', '#9db4ff');
  } else {
    const right = B.round;
    $('ctrlBody').innerHTML = qBlock(b.q, b.jobs, right, B.pick, B.rev, 'ban', B.opts)
      + (B.rev ? verdictHtml(B.res[B.round], t, b.why[B.round]) + nextBtn(t).replace('NEXT', 'bn') : '');
    lab.setReadout(esc(t.j.stops[B.round]), dots(B.res, B.round, 5), '', '#9db4ff');
  }
  lab.setState(cardOf(t.cards.jobs));
}

function renderStretch(t) {
  const s = t.s, q = St.q - 1, rev = St.rev[q];
  lab.setGlow('rgba(120,170,230,.2)');
  const [o, right] = q === 0 ? [s.o1, 2] : [s.o2, 1];
  $('ctrlBody').innerHTML = qBlock(q === 0 ? s.q1 : s.q2, o, right, St.pick[q], rev, 'san')
    + (rev ? verdictHtml(St.pick[q] === right, t, q === 0 ? s.r1 : s.r2) + nextBtn(t).replace('NEXT', 'sn') : '');
  lab.setReadout(stretchVal(now()), '', '', '#5db4ff');
  // the lengths in the card would answer the longest-part question, so they wait for that answer
  if (!St.rev[0]) lab.setState(cardOf(t.cards.s0));
  else if (!St.rev[1]) lab.setState({ emo: t.cards.s1[0], title: t.cards.s1[1], lead: '', body: '', extra: '' });
  else lab.setState({ ...cardOf(t.cards.s1), extra: fineHtml(t) });
}
render();
</script>
</body>
