function secRow(t) {
  const open = secret.unlocked(), emo = { bees: '🐝', count: '🔍' };
  return `<div class="bd-secrets">${['bees', 'count'].map((k) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo[k]} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('')}</div>`;
}
function ctrlHTML(m, t) {
  const ask = (pre, q, opts) => `<div class="bd-ask">${pre ? `<p class="bd-pre">${esc(pre)}</p>` : ''}<div class="bd-q">${esc(q)}</div><div class="bd-opts">${opts.map((o, i) => `<button type="button" class="bd-opt" data-act="guess" data-i="${i}">${esc(o)}</button>`).join('')}</div></div>`;
  const verdict = (ok, rev) => `<div class="bd-v ${ok ? 'ok' : 'no'}"><b>${esc(ok ? t.right : t.notq)}</b> ${esc(rev)}</div>`;
  let body = '';
  if (m === 'kelp') {
    const k = S.kelp, c = t.kelp;
    body = !k.done ? ask(null, c.q, c.opts)
      : verdict(k.guess === c.ok, c.rev) + `<div class="bd-chips">${chip('otter', '🦦 ' + esc(k.o ? c.on : c.off), k.o)}${chip('play', k.play ? '⏸ ' + esc(c.pause) : '▶ ' + esc(c.play), k.play)}${chip('restart', '↺ ' + esc(c.restart), false)}</div>`
        + `<div class="bd-sl"><span id="bdYrL">${esc(c.year(Math.round(k.yr)))}</span><input type="range" class="big" id="bdYr" min="0" max="20" step="0.1" value="${k.yr}" aria-label="${esc(c.year(Math.round(k.yr)))}" style="--track:linear-gradient(90deg,#2fa7b8,#d9b44a)"></div>`;
  } else if (m === 'wolves') {
    const v = S.wolves, c = t.wolves;
    body = !v.done ? ask(null, c.q, c.opts)
      : verdict(v.guess === c.ok, c.rev) + `<div class="bd-chips">${chip('wt', '📅 ' + esc(c.before), v.target === 0, 'data-i="0"')}${chip('wt', '🐺 ' + esc(c.after), v.target === 1, 'data-i="1"')}</div>`;
  } else if (m === 'mix') {
    const v = S.mix, c = t.mix, hitK = new Set(v.hits.map((h) => h.kind));
    body = !v.done ? ask(c.pre, c.q, c.opts)
      : verdict(v.guess === c.ok, c.rev) + `<div class="bd-sw"><span class="bd-lbl">${esc(c.pick)}</span>${KIND_COL.map((col, k) => `<button type="button" class="bd-dot ${v.pick === k ? 'on' : ''}" data-act="pick" data-k="${k}" ${hitK.has(k) ? 'disabled' : ''} aria-label="${k + 1}" style="background:${col}"></button>`).join('')}</div>`
        + `<div class="bd-chips">${chip('hit', '🦠 ' + esc(c.btn), false)}${chip('newseason', '↺ ' + esc(c.reset), false)}</div>`;
  } else if (m === 'bees') {
    const c = t.bees;
    body = `<div class="bd-chips">${chip('beeon', '🐝 ' + esc(BEE.on ? c.on : c.off), BEE.on)}${chip('spring', '🌸 ' + esc(c.spring), false)}</div>`;
  } else {
    body = `<div class="bd-chips">${chip('cntreset', '↺ ' + esc(t.count.restart), false)}</div>`;
  }
  return body + secRow(t);
}
function factsFor(m, t) {
  const f = t.facts, mk = (key, emo) => ({ emo, text: f[key][0], src: f[key][1] });
  if (m === 'kelp') return S.kelp.done ? [mk('otters', '🦦'), mk('estes', '📜')] : [];
  if (m === 'wolves') return S.wolves.done ? [mk('wolf', '🐺')] : [];
  if (m === 'mix') return S.mix.done ? [mk('bees', '🐝')] : [];
  if (m === 'bees') return [mk('bees', '🐝')];
  return [];
}
let lastRO = '', lastST = '';
function readout() {
  const t = T[lang], m = mode(); let args;
  if (m === 'kelp') { const a = kAt(S.kelp.yr); args = [`${Math.round(a.K * 100)}%`, t.kelp.cover, t.kinds(kSpecies(a)), '#2fa7b8']; }
  else if (m === 'wolves') { const v = S.wolves, c = t.wolves; args = [String(v.near ?? 4), c.elkSub, `${c.wl}: ${(v.g ?? 0) < 0.3 ? c.short : (v.g ?? 0) < 0.8 ? c.growing : c.tall}`, '#6fa04a']; }
  else if (m === 'mix') { const s = mixStats(nowS()); args = [`🌾 ${s.c}% · 🌼 ${s.m}%`, `${t.mix.alive}: 🌾 ${s.ck} · 🌼 ${s.mk}`, '', '#e0a43a']; }
  else if (m === 'bees') { const n = BEE.bl.filter((b) => b.st === 'apple').length; args = [`🍎 ${n} / ${BEE.bl.length}`, t.bees.sub, BEE.hand ? t.bees.hand(BEE.hand) : '', '#e8b92f']; }
  else { const u = cntUnion().size, n = CNT.frames.length; args = [String(u), `${t.count.found} · ${t.count.frames(n)}`, '', '#4ea8ff']; }
  const key = JSON.stringify(args); if (key === lastRO) return; lastRO = key; lab.setReadout(...args);
}
function stateCard() {
  const t = T[lang], m = mode(); let st;
  if (m === 'kelp') {
    const k = S.kelp, c = t.kelp, a = kAt(k.yr);
    const pick = !k.done ? [c.ask, '🌊'] : a.K < 0.2 ? [c.barren, '🟣'] : a.K > 0.7 && a.o ? [c.healthy, '🦦'] : [c.change, '⏳'];
    st = { emo: pick[1], title: pick[0][0], lead: pick[0][1], body: pick[0][2], extra: k.done ? `<span>${esc(c.note)}</span>` : '' };
  } else if (m === 'wolves') {
    const v = S.wolves, c = t.wolves, pick = !v.done ? [c.ask, '🏞️'] : v.target ? [c.af, '🐺'] : [c.b4, '🦌'];
    st = { emo: pick[1], title: pick[0][0], lead: pick[0][1], body: pick[0][2], extra: v.done && v.target ? `<span>${esc(c.debate)}</span>` : '' };
  } else if (m === 'mix') {
    const v = S.mix, c = t.mix;
    if (!v.done || !v.hits.length) st = { emo: '🌾', title: c.ask[0], lead: c.ask[1], body: c.ask[2], extra: '' };
    else { const s = mixStats(nowS()); st = { emo: '🦠', title: c.hit, lead: c.lead(s.c, s.m), body: v.hits.length >= 8 ? c.bodyAll : c.body(v.hits.length), extra: '' }; }
  } else if (m === 'bees') {
    const c = t.bees[BEE.on ? 'yes' : 'no']; st = { emo: BEE.on ? '🍎' : '🌸', title: c[0], lead: c[1], body: c[2], extra: '' };
  } else {
    const c = t.count[CNT.frames.length >= 5 ? 'done' : 'start']; st = { emo: '🔍', title: c[0], lead: c[1], body: c[2], extra: '' };
  }
  const key = JSON.stringify(st); if (key === lastST) return; lastST = key; lab.setState(st);
}
function render() {
  const t = T[lang], m = mode();
  document.body.dataset.v = m;
  $('ctrlBody').innerHTML = ctrlHTML(m, t);
  lab.setFacts(factsFor(m, t));
  lastRO = ''; lastST = '';
  readout(); stateCard();
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function hitKind(k) {
  if (S.mix.hits.some((h) => h.kind === k)) return;
  S.mix.hits.push({ kind: k, t0: nowS(), ox: 0.2 + Math.random() * 0.6, oy: 0.2 + Math.random() * 0.6 });
  const free = [0, 1, 2, 3, 4, 5, 6, 7].find((x) => !S.mix.hits.some((h) => h.kind === x));
  if (free !== undefined && S.mix.pick === k) S.mix.pick = free;
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, m = mode();
  if (a === 'guess') {
    const i = +b.dataset.i;
    if (m === 'kelp') { const k = S.kelp; k.guess = i; k.done = true; kReset(); k.o = false; k.hist = [{ ...START, o: false }]; k.oShow = 1; k.play = true; }
    else if (m === 'wolves') { S.wolves.guess = i; S.wolves.done = true; S.wolves.target = 1; }
    else if (m === 'mix') { S.mix.guess = i; S.mix.done = true; hitKind(S.mix.pick); }
    (i === T[lang][m].ok ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (a === 'otter') { kToggle(); sfx.click(); }
  else if (a === 'play') { const k = S.kelp; if (!k.play && k.yr >= 20 - 1e-6) k.yr = 0; k.play = !k.play; sfx.click(); }
  else if (a === 'restart') { kReset(); S.kelp.oShow = 1; sfx.click(); }
  else if (a === 'wt') { S.wolves.target = +b.dataset.i; sfx.click(); }
  else if (a === 'pick') { S.mix.pick = +b.dataset.k; sfx.tick(); }
  else if (a === 'hit') { hitKind(S.mix.pick); sfx.push(); }
  else if (a === 'newseason') { S.mix.hits = []; S.mix.growT = nowS(); S.mix.pick = 1; sfx.click(); }
  else if (a === 'beeon') { BEE.on = !BEE.on; BEE.bl.forEach((b) => { b.taken = false; });
    if (BEE.on) BEE.bees.forEach((bee, i) => { bee.x = -20 - i * 40; bee.y = CH * 0.3 + i * 30; bee.tgt = -1; }); sfx.click(); }
  else if (a === 'spring') { beeReset(); sfx.click(); }
  else if (a === 'cntreset') { cntReset(); sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    const k = b.dataset.k; S.sec = S.sec === k ? null : k;
    if (S.sec === 'bees') { BEE.on = true; beeReset(); } else if (S.sec === 'count') cntReset();
    sfx.click(); render(); showStage(); return;
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'bdYr') return;
  const k = S.kelp; k.yr = clamp(+ev.target.value, 0, 20); k.play = false;
  $('bdYrL').textContent = T[lang].kelp.year(Math.round(k.yr));
  const pb = document.querySelector('#ctrlBody [data-act=play]'); if (pb) { pb.textContent = '▶ ' + T[lang].kelp.play; pb.classList.remove('on'); }
  readout(); stateCard();
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, m = mode();
  if (m === 'bees' && !BEE.on) {
    let best = null, bd = 28 * (CW / 375);
    BEE.bl.forEach((b) => { if (b.st !== 'bloom') return; const p = blXY(b, CW, CH), d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = { b, p }; } });
    if (best) { best.b.st = 'apple'; best.b.g = 0; BEE.hand++; BEE.rip.push({ x: best.p.x, y: best.p.y, r: 4, a: 0.8 }); sfx.snap(); }
  } else if (m === 'count' && CNT.frames.length < 5) {
    const mr = meadowRect(CW, CH);
    if (x < mr.x || x > mr.x + mr.w || y < mr.y || y > mr.y + mr.h) return;
    const side = 0.34 * Math.min(mr.w, mr.h), fx = clamp(x, mr.x + side / 2, mr.x + mr.w - side / 2), fy = clamp(y, mr.y + side / 2, mr.y + mr.h - side / 2);
    const inside = CNT.plants.filter((p) => Math.abs(mr.x + p.fx * mr.w - fx) <= side / 2 && Math.abs(mr.y + p.fy * mr.h - fy) <= side / 2);
    CNT.frames.push({ x: fx, y: fy, t0: nowS(), inside, kinds: new Set(inside.map((p) => p.kind)) });
    sfx.push(); render();
  }
});

// --- the loop ----------------------------------------------------------------------------------------------
canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  CW = w; CH = h; const m = mode();
  if (m === 'kelp') {
    const k = S.kelp;
    if (k.play) {
      k.yr = Math.min(20, k.yr + dt * 2);
      if (k.yr >= 20) { k.play = false; render(); }
      const sl = $('bdYr'); if (sl) { sl.value = k.yr; const l = $('bdYrL'); if (l) l.textContent = T[lang].kelp.year(Math.round(k.yr)); }
    }
    drawKelp(ctx, w, h, dt, t);
  } else if (m === 'wolves') drawWolves(ctx, w, h, dt, t);
  else if (m === 'mix') drawMix(ctx, w, h, dt, t);
  else if (m === 'bees') drawBees(ctx, w, h, dt, t);
  else drawCount(ctx, w, h, dt, t);
  readout(); stateCard();
});

beeReset(); cntReset();
render();
</script>
</body>
</html>
