<script type="module">
import { shell, canvasLoop, secretLab, sfx, $, esc, clamp, lerp, ruPlural, lang } from '../lab.js';

// --- texts -------------------------------------------------------------------------------------------------
// place names, indexed by the power of ten: 0 ones, 1 tens, 2 hundreds, 3 thousands
const EN = { sg: ['one', 'ten', 'hundred', 'thousand'], pl: ['ones', 'tens', 'hundreds', 'thousands'] };
const enCnt = (n, e) => `${n} ${n === 1 ? EN.sg[e] : EN.pl[e]}`;

      none: (a, e, p, lead) => ({ title: 'Ничего не достаётся', lead: a ? `${ruCnt(a, e)} на ${p} ${ruAcc(p)}: мало.` : 'Здесь нечего делить.',

// the whole division as a list of steps: one per written digit, then the actions (deal, crack) that carry them out
function makeJob(n, p) {
  const D = String(n).split('').map(Number), m = D.length, steps = [];
  let carry = 0;
  for (let k = 0; k < m; k++) {
    const avail = carry * 10 + D[k], q = Math.floor(avail / p), r = avail % p;
    steps.push({ avail, q, r, e: m - 1 - k, crack: k < m - 1 && r > 0 });
    carry = r;
  }
  const acts = [], dealIx = [], crackIx = [];
  steps.forEach((s, k) => {
    dealIx[k] = acts.length; acts.push({ t: 'deal', k });
    if (s.crack) { crackIx[k] = acts.length; acts.push({ t: 'crack', k }); } else crackIx[k] = dealIx[k];
  });
  const k0 = steps.findIndex((s) => s.q > 0);
  return { n, p, D, m, steps, acts, dealIx, crackIx, k0, q: Math.floor(n / p), r: n % p, zeroMid: steps.some((s, k) => k > k0 && s.q === 0) };
}

// --- the written record: one layout per language, cells appear when their action is done -------------------
function recPlan(j, lg) {
  const { p, m, D, steps, dealIx, crackIx, k0 } = j, cells = [], last = steps[m - 1], lastIx = dealIx[m - 1];
  let rows = 0, cols = 0;
  const put = (r, cEnd, text, cls, ix) => { const s = String(text); for (let i = 0; i < s.length; i++) cells.push({ r, c: cEnd - s.length + 1 + i, t: s[i], cls, ix }); };
  if (lg === 'en') { // the bus stop, short division: answer on top, small carries before the next digit
    cols = m + 3; rows = 2;
    cells.push({ r: 1, c: 0, t: p, cls: '', ix: -1 });
    D.forEach((d, k) => cells.push({ r: 1, c: 1 + k, t: d, cls: 'bt' + (k === 0 ? ' bl' : ''), ix: -1 }));
    steps.forEach((s, k) => {
      if (k >= k0) cells.push({ r: 0, c: 1 + k, t: s.q, cls: 'ans', ix: dealIx[k] });
      if (s.crack) cells.push({ r: 1, c: 2 + k, t: s.r, cls: 'sup', ix: crackIx[k] });
    });
    if (last.r > 0) cells.push({ r: 0, c: m + 1, t: 'r', cls: 'ans', ix: lastIx }, { r: 0, c: m + 2, t: last.r, cls: 'ans rem', ix: lastIx });
  } else if (lg === 'hu') { // 468 : 3 = 156 with the partial remainders under the digits
    const qs = steps.slice(k0);
    cols = m + 4 + qs.length; rows = 1;
    D.forEach((d, k) => cells.push({ r: 0, c: k, t: d, cls: '', ix: -1 }));
    cells.push({ r: 0, c: m, t: ':', cls: '', ix: -1 }, { r: 0, c: m + 1, t: p, cls: '', ix: -1 }, { r: 0, c: m + 2, t: '=', cls: '', ix: -1 });
    qs.forEach((s, i) => cells.push({ r: 0, c: m + 3 + i, t: s.q, cls: 'ans', ix: dealIx[k0 + i] }));
    let row = 1;
    steps.forEach((s, k) => { if (s.crack) { put(row, k + 1, steps[k + 1].avail, 'sub', crackIx[k]); row++; } });
    put(row, m - 1, last.r, 'rem', lastIx);
    if (last.r > 0) cells.push({ r: row, c: m, t: '← ' + T.hu.rWord, cls: 'note', w: 4, ix: lastIx });
    rows = row + 1;
  } else { // the Russian corner: subtraction rows on the left, divisor and answer on the right
    const qs = steps.slice(k0), qn = Math.max(1, qs.length);
    cols = m + qn;
    D.forEach((d, k) => cells.push({ r: 0, c: k, t: d, cls: '', ix: -1 }));
    cells.push({ r: 0, c: m - 1, t: '', cls: 'vbar', h: 2, ix: -1 });
    cells.push({ r: 0, c: m, t: p, cls: 'bb', w: qn, ix: -1 });
    qs.forEach((s, i) => cells.push({ r: 1, c: m + i, t: s.q, cls: 'ans', ix: dealIx[k0 + i] }));
    let row = 1;
    for (let k = k0; k < m; k++) {
      const s = steps[k];
      if (k > k0 && s.q > 0) { put(row, k, s.avail, 'sub', crackIx[k - 1]); row++; }
      if (s.q > 0) { put(row, k, s.q * p, 'bb', dealIx[k]); row++; }

}

  gridEl.innerHTML = plan.cells.map((c) => `<i class="sd-c ${c.cls} off" style="left:${c.c * cw}px;top:${c.r * rh}px;width:${(c.w || 1) * cw}px;height:${(c.h || 1) * rh}px">${esc(c.t)}</i>`).join('');

const COL = [['#ffe6a3', '#f2b13c', '#a86c12'], ['#a6f3d2', '#3fb58b', '#1b7455'], ['#b4d8fb', '#4f8fd6', '#2a5a96'], ['#d9cbf8', '#8a6fd0', '#54409a']];

  if (v === 'left' && S.mode === 'end') extra = `${esc(t.st.found(j.p))} <b>${[...S.found[j.p]].sort((a, b) => a - b).join(' · ')}</b>`;
  lab.setState({ ...sc, extra });
  lab.setFacts(t.facts[v]);
  // controls
  if (v === 'share') {
    $('sdNext').textContent = t.next; $('sdNext').disabled = !(S.mode === 'wait' || S.mode === 'end');
    $('sdTask').textContent = S.thou ? '' : t.task(S.tsk + 1, SHARE.length);
    const open = secret.unlocked(), sc2 = (k, emo, on) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    $('sdChips').innerHTML = sc2('thousand', '🧊', S.thou) + sc2('check', '✅', S.check);
  } else if (v === 'zero') {
    $('sdDealZ').textContent = S.mode === 'end' ? t.next : t.deal; $('sdDealZ').disabled = S.mode === 'ask' || S.mode === 'anim';
    $('sdTaskZ').textContent = t.task(S.zt + 1, ZERO.length);
  } else {
    $('sdLblP').textContent = t.plates; $('sdLblN').textContent = t.number;
    $('sdPv').textContent = S.p; $('sdNv').textContent = S.n; $('sdRng').value = S.n;
    document.querySelector('[data-act=pm]').disabled = S.p <= 2; document.querySelector('[data-act=pp]').disabled = S.p >= 5;
    $('sdDealL').textContent = t.deal; $('sdDealL').disabled = S.mode === 'anim';
  }
}
startView();
render();
</script>
