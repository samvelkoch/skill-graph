const P0 = 1013, SCALE_H = 8;                                   // hPa at sea level; pressure falls by e every 8 km
const pAt = (h) => P0 * Math.exp(-h / SCALE_H);
const tAt = (h) => h < 11 ? 15 - 6.5 * h : h < 20 ? -56.5 : h < 32 ? -56.5 + (h - 20) : h < 47 ? -44.5 + 2.8 * (h - 32)
  : h < 51 ? -2.5 : h < 71 ? -2.5 - 2.8 * (h - 51) : h < 85 ? -58.5 - 2 * (h - 71) : -86.5 + 0.5 * (h - 85);
const W0 = 2, WBURST = 8;                                       // balloon width at the start and when it bursts, metres
const widthAt = (h) => W0 * Math.cbrt(P0 / pAt(h));            // volume ~ 1 / pressure, so width ~ (P0 / p)^(1/3)
const H_BURST = 3 * SCALE_H * Math.log(WBURST / W0);            // where widthAt(h) reaches WBURST (about 33 km)
const massT = (h) => pAt(h) * 100 / 9.81 / 1000;                // tonnes of air above 1 m²: p [Pa] / g
const T_RISE = 12, T_FALL = 9;

const layerAt = (km) => LAYERS.find((l) => km < l.b) || LAYERS[3];
const ASK = { balloon: ['balloonAsk', 'balloonOpts', 'balloonRight', 'balloonWrong', 2, 'b'], layers: ['layersAsk', 'layersOpts', 'layersRight', 'layersWrong', 1, 'l'], weight: ['weightAsk', 'weightOpts', 'weightRight', 'weightWrong', 0, 'w'] };

const nfs = (x) => (Math.abs(x - Math.round(x)) < 0.05 ? String(Math.round(x)) : nf(x, 1)); // 0 or 5.5, never 0.0
const tf = (x) => { const r = Math.round(x); return (r < 0 ? '−' : '') + Math.abs(r); };
const pf = (p) => (p >= 10 ? String(Math.round(p)) : p >= 1 ? nf(p, 1) : '<1');

    const pulse = 0.7 + 0.3 * Math.sin(time * 8), aa = ease((tt - 6) / 0.4);
    c.strokeStyle = `rgba(150,215,255,${0.9 * aa})`; c.fillStyle = `rgba(150,215,255,${0.9 * aa})`; c.lineWidth = 2.4; c.lineCap = 'round';
    const acy = cy - 4, inx = (dx) => cx + dx * (R + 14 - crush * 12 + 3 * pulse), outx = (dx) => cx + dx * (R + 44 - crush * 6 + 3 * pulse);
    for (const dy of [-30, 0, 30]) for (const dx of [-1, 1]) {
      const y = acy + dy, x1 = inx(dx);
      c.beginPath(); c.moveTo(outx(dx), y); c.lineTo(x1, y); c.stroke();
      c.beginPath(); c.moveTo(x1, y); c.lineTo(x1 + dx * 8, y - 5); c.lineTo(x1 + dx * 8, y + 5); c.closePath(); c.fill();
    }
    const y0 = cy - 92 + 4 * pulse; c.beginPath(); c.moveTo(cx, y0); c.lineTo(cx, y0 + 30); c.stroke();
    c.beginPath(); c.moveTo(cx, y0 + 40); c.lineTo(cx - 6, y0 + 30); c.lineTo(cx + 6, y0 + 30); c.closePath(); c.fill();
  }
  c.restore();
  // the three steps
  const stp = canStep(tt);
  for (let i = 1; i <= 3; i++) {
    const x = w / 2 + (i - 2) * 38, on = i === stp, done = i < stp;
    circ(c, x, 20, 12); c.fillStyle = on ? '#f5c84c' : done ? 'rgba(245,200,76,.35)' : 'rgba(8,12,28,.8)'; c.fill(); c.strokeStyle = on ? '#fff' : 'rgba(255,255,255,.35)'; c.lineWidth = 1.2; c.stroke();
    c.font = FONT; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = on ? '#15182a' : '#fff'; c.fillText(String(i), x, 20.5);
  }
  c.textAlign = 'left';
}

// --- main loop -------------------------------------------------------------------------------------------------
let lastRead = '';
function readout() {
  const t = T[lang], v = lab.view; let val = '', sub = '', pill_ = '', col = '#4ea8ff';
  if (S.sec === 'a') { val = t.km(nf(jumpH(S.secT), 1)); pill_ = t.things.felix; col = '#f5c84c'; }
  else if (S.sec === 'b') { val = `${canStep(S.secT)}/3`; col = '#d9825f'; }
  else if (v === 'balloon') {
    const B = S.b;
    if (B.ans === null) val = '?';
    else { val = t.km(nf(B.h, 1)); sub = t.sub(pf(pAt(B.h)), tf(tAt(B.h))); pill_ = isBurst() ? t.burst : t.wide(nf(widthAt(B.h), 1)); }
  } else if (v === 'layers') {
    col = '#9b8cff';
    if (S.l.ans === null || !S.l.layer) val = '?';
    else {
      const l = LAYERS.find((q) => q.k === S.l.layer); val = t.layers[l.k];
      sub = t.sub(pf(pAt(S.l.km)), tf(tAt(S.l.km))); pill_ = t.km(l.b === Infinity ? `${l.a}+` : `${l.a}–${l.b}`);
    }
  } else {
    col = '#f5c84c';
    if (S.w.ans === null) val = '?'; else { val = t.tonnes(nf(massT(S.w.h), 1)); sub = t.above; pill_ = t.at(nfs(S.w.h)); }
  }
  const key = [val, sub, pill_, col, lang].join('|');
  if (key === lastRead) return; lastRead = key;
  lab.setReadout(val, sub, pill_, col);
}
function syncCtl() {
  const B = S.b, t = T[lang];
  $('atLaunch').disabled = B.ans === null || B.phase === 'rise' || B.phase === 'pop' || B.phase === 'fall';
  if (lab.view === 'balloon') {
    const sl = $('atH'); if (B.phase !== 'scrub' && document.activeElement !== sl) sl.value = B.h;
    $('atHv').textContent = t.km(nf(B.h, 1));
  }
  $('atWeigh').disabled = S.w.ans === null || (S.w.t >= 0 && S.w.t < 4.6);
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h; TAGS = [];
  stepBalloon(dt); stepWeight(dt);
  if (S.l.ans !== null) S.l.rev = Math.min(1, S.l.rev + dt / 1.6);
  if (S.sec) S.secT += dt;
  if (S.sec === 'a') drawJump(c, w, h, dt, time);
  else if (S.sec === 'b') drawCan(c, w, h, dt, time);
  else if (lab.view === 'balloon') drawBalloon(c, w, h, dt, time);
  else if (lab.view === 'layers') drawLayers(c, w, h, dt, time);
  else drawWeight(c, w, h, dt, time);
  readout(); syncCtl();
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-i], #atLaunch, #atWeigh, [data-sec]'); if (!b) return;
  if (b.dataset.i !== undefined) {
    const v = lab.view, [, , , , right, key] = ASK[v], A = S[key], i = +b.dataset.i;
    if (A.ans !== null) return;
    A.ans = i; (i === right ? sfx.good : sfx.bad)();
    if (v === 'balloon') A.autoIn = 0.8;
    else if (v === 'layers') { A.layer = 'tropo'; A.km = 5.5; }
    else A.t = 0;
    render(); showStage(); return;
  }
  if (b.id === 'atLaunch') { launch(); showStage(); return; }
  if (b.id === 'atWeigh') { S.w.t = 0; sfx.push(); render(); return; }
  if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; S.secT = 0; S.trail = []; sfx.click(); render();
  }
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'atH') {
    const B = S.b; B.phase = 'scrub'; B.h = +ev.target.value;
    if (B.h >= H_BURST && !B.burst) { B.burst = true; spawnShreds(); }
    readout();
  } else if (ev.target.id === 'atW') { S.w.h = +ev.target.value; render(); }
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec) { S.secT = 0; S.trail = []; return; }
  if (lab.view !== 'layers' || S.l.ans === null || !G.l) return;
  const r = $('cv').getBoundingClientRect(), km = clamp((G.l.yG - (ev.clientY - r.top)) / G.l.k, 0, 100);
  S.l.km = km; S.l.layer = layerAt(km).k; sfx.tick(); render();
});

// --- one render per change: the controls, the question, the readout and the state card ------------------------------
function drawAsk(v) {
  const t = T[lang], [q, o, r, wr, right, key] = ASK[v], ans = S[key].ans;
  $('atAsk_' + v).innerHTML = `<div class="at-q">${esc(t[q])}</div><div class="at-opts">${t[o].map((txt, i) => {
    const cls = ans === null ? '' : i === right ? ' ok lock' : i === ans ? ' no lock' : ' dim lock';
    return `<button type="button" class="at-opt${cls}" data-i="${i}">${esc(txt)}</button>`;
  }).join('')}</div>${ans === null ? '' : `<p class="at-verdict ${ans === right ? 'ok' : 'no'}">${esc(ans === right ? t[r] : t[wr])}</p>`}`;
}
function render() {
  const t = T[lang], v = lab.view, [, , , , , key] = ASK[v], ans = S[key].ans;
  document.body.dataset.v = v;
  for (const k of VIEWS) $('atV_' + k).style.display = k === v ? 'block' : 'none';
  $('atSlideB').style.display = S.b.launched ? 'block' : 'none';
  for (const k of VIEWS) drawAsk(k);
  $('atLaunch').textContent = `🎈 ${t.launch}`; $('atWeigh').textContent = `⚖️ ${t.weigh}`;
  $('atHL').textContent = t.height; $('atWL').textContent = t.height; $('atWv').textContent = t.km(nfs(S.w.h));
  $('atSec').innerHTML = [['a', '🪂'], ['b', '🥫']].map(([k, emo]) => { const open = secret.unlocked();
    return `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`; }).join('');
  lastRead = ''; readout(); syncCtl();
  lab.setGlow(S.sec === 'b' ? 'rgba(217, 130, 95, .24)' : v === 'balloon' ? 'rgba(78, 168, 255, .3)' : v === 'layers' ? 'rgba(155, 140, 255, .28)' : 'rgba(245, 200, 76, .22)');
  if (S.sec) {
    lab.setState({ emo: S.sec === 'a' ? '🪂' : '🥫', title: t.secrets[S.sec][0], lead: S.sec === 'a' ? t.felixText : t.canText, body: '', extra: '' });
    lab.setFacts(S.sec === 'a' ? t.facts.balloon : []);
  } else if (ans === null) {
    lab.setState({ emo: '🤔', title: t[ASK[v][0]], lead: '', body: '', extra: '' }); lab.setFacts([]);
  } else if (v === 'layers' && S.l.layer) {
    const [emo, , , body] = t.st.layers;
    lab.setState({ emo, title: t.layers[S.l.layer], lead: t.layerInfo[S.l.layer], body, extra: '' }); lab.setFacts(t.facts.layers);
  } else {
    const [emo, title, lead, body] = t.st[v];
    lab.setState({ emo, title, lead, body, extra: '' }); lab.setFacts(t.facts[v]);
  }
}
render();
</script>
