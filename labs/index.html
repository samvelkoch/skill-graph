<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Labs · Skill Graph</title>
<meta name="description" content="Interactive explainers for topics of the Skill Graph: magnets, seasons, fractions and more. English, Russian and Hungarian.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Nunito:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="lab.css">
<style>
  main { max-width: 1100px; margin: 0 auto; padding: 20px 30px 40px; }
  h1 { font: 500 clamp(44px, 6vw, 80px)/1.02 var(--serif); margin: 10px 0 14px; color: #fff; }
  h1 i { font-style: normal; color: var(--red); }
  .lead { color: var(--mut); max-width: 56ch; font-size: 15px; margin: 0 0 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .g { display: flex; flex-direction: column; padding: 22px; text-decoration: none; color: var(--ink); transition: transform .15s, border-color .15s; }
  .g:hover { transform: translateY(-3px); border-color: var(--stroke2); }
  .g .e { font-size: 44px; line-height: 1; margin-bottom: 14px; }
  .g h2 { font: 500 28px/1.1 var(--serif); margin: 0 0 8px; color: #fff; }
  .g p { color: var(--mut); margin: 0 0 14px; font-size: 13.5px; line-height: 1.55; flex: 1; }
  .g .m { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 800; }
  h3.sj { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); font-weight: 800; margin: 26px 0 12px; }
  .g.soon { border-style: dashed; justify-content: center; align-items: center; text-align: center; color: var(--faint); min-height: 220px; }
  @media (max-width: 760px) { main { padding: 10px 16px 30px; } .grid { gap: 10px; } .g { padding: 16px; } .g .e { font-size: 30px; margin-bottom: 8px; }
    .g h2 { font-size: 23px; } .g p { margin-bottom: 8px; } .g.soon { min-height: 90px; } }
</style>
</head>
<body>
<nav class="bar"><a id="brand" href="../"></a><div id="langs" class="card seg"></div></nav>
<main id="main"></main>
<script type="module">
import { LANGS, esc } from './lab.js';
const UI = {
  en: { brand: 'Labs', back: 'Back to the map', title: 'Learn it by playing with it', lead: 'Each lab explains one idea from the skill graph: drag, tap, guess and see why. They work on phones, in English, Russian and Hungarian.', topics: (n) => `${n} ${n === 1 ? 'topic' : 'topics'} in the graph`, soon: 'More labs are on the way', subj: { Science: 'Science', Mathematics: 'Mathematics', Computing: 'Computing' } },
  ru: { brand: 'Лаборатории', back: 'Назад к карте', title: 'Понять, играя', lead: 'Каждая лаборатория объясняет одну идею из графа навыков: тяни, нажимай, угадывай и смотри, почему так. Работают на телефоне, на английском, русском и венгерском.', topics: (n) => `${n} ${n % 10 === 1 && n % 100 !== 11 ? 'тема' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'темы' : 'тем'} в графе`, soon: 'Скоро будут новые', subj: { Science: 'Естествознание', Mathematics: 'Математика', Computing: 'Информатика' } },
  hu: { brand: 'Laborok', back: 'Vissza a térképhez', title: 'Értsd meg játszva', lead: 'Minden labor egy gondolatot magyaráz el a készségtérképből: húzd, koppints, tippelj, és lásd, miért. Telefonon is működnek, angolul, oroszul és magyarul.', topics: (n) => `${n} téma a térképen`, soon: 'Hamarosan jönnek az újak', subj: { Science: 'Természettudomány', Mathematics: 'Matematika', Computing: 'Informatika' } },
};
const p = new URLSearchParams(location.search);
let lang = LANGS[p.get('lang')] ? p.get('lang') : 'en';
const reg = await fetch('registry.json').then((r) => r.json()).catch(() => ({ labs: [] }));
function render() {
  const u = UI[lang], q = `?lang=${lang}`;
  document.documentElement.lang = lang;
  document.title = `${u.brand} · Skill Graph`;
  document.getElementById('brand').innerHTML = `Skill Graph<i>.</i><small>${esc(u.brand)}</small>`;
  document.getElementById('brand').href = `../${q}`;
  document.getElementById('langs').innerHTML = Object.entries(LANGS).map(([k, v]) => `<button data-lang="${k}" class="${k === lang ? 'on' : ''}">${v}</button>`).join('');
  document.getElementById('main').innerHTML = `<h1>${esc(u.title)}<i>.</i></h1><p class="lead">${esc(u.lead)}</p>
    ${['Science', 'Mathematics', 'Computing'].filter((sj) => reg.labs.some((l) => l.subject === sj)).map((sj) => `<h3 class="sj">${esc(u.subj[sj] ?? sj)}</h3>
    <div class="grid">${reg.labs.filter((l) => l.subject === sj).map((l) => `<a class="card g" href="${l.path.replace(/^labs\//, '')}${q}"><span class="e">${l.emoji}</span><h2>${esc(l.title[lang] ?? l.title.en)}</h2>
      <p>${esc(l.blurb[lang] ?? l.blurb.en)}</p><span class="m">${esc(u.topics(l.topics.length))}</span></a>`).join('')}</div>`).join('')}
    <div class="grid" style="margin-top:16px"><div class="card g soon">✨ ${esc(u.soon)}</div></div>`;
}
document.getElementById('langs').addEventListener('click', (ev) => {
  const k = ev.target.closest('button')?.dataset.lang; if (!k) return;
  lang = k; const s = new URLSearchParams(location.search); s.set('lang', k); history.replaceState(null, '', `?${s}`); render();
});
render();
</script>
</body>
</html>
