<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Labs · Skill Graph</title>
<meta name="description" content="Interactive explainers for topics of the Skill Graph: magnets, seasons, fractions and more. English, Russian and Hungarian.">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0A0C14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skill Graph">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Nunito:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="lab.css">
<style>
  main { max-width: 1100px; margin: 0 auto; padding: 20px 30px 40px; }
  h1 { font: 500 clamp(44px, 6vw, 80px)/1.02 var(--serif); margin: 10px 0 14px; color: #fff; }
  h1 i { font-style: normal; color: var(--red); }
  .lead { color: var(--mut); max-width: 56ch; font-size: 15px; margin: 0 0 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .g { display: flex; flex-direction: column; padding: 22px; text-decoration: none; color: var(--ink); transition: transform .15s, border-color .15s; }
  .g:hover { transform: translateY(-3px); border-color: var(--stroke2); }
  .g .e { font-size: 44px; line-height: 1; margin-bottom: 14px; }
  .g h2 { font: 500 28px/1.1 var(--serif); margin: 0 0 8px; color: #fff; }
  .g p { color: var(--mut); margin: 0 0 14px; font-size: 13.5px; line-height: 1.55; flex: 1; }
  .g .m { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 800; }
  .g h2 .done { font: 800 11px var(--sans); letter-spacing: .04em; color: var(--ok); opacity: .85; vertical-align: middle; }
  .sj { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); font-weight: 800; margin: 26px 0 12px; }
  details.local > summary { list-style: none; cursor: pointer; user-select: none; }
  details.local > summary::-webkit-details-marker { display: none; }
  details.local > summary::before { content: '▸'; display: inline-block; margin-right: 8px; transition: transform .15s; }
  details.local[open] > summary::before { transform: rotate(90deg); }
  details.local .lnote { color: var(--mut); font-size: 13px; margin: 0 0 12px; max-width: 60ch; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; }
  #q { flex: 1 1 260px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--stroke2); background: var(--panel); outline: none; font-size: 15px; }
  #q:focus { border-color: var(--red); }
  #age { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--stroke2); background: var(--panel); }
  #age option { background: #10131d; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { background: transparent; border: 1px solid var(--stroke); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--soft); }
  .chips button:hover { background: var(--hover); }
  .chips button.on { border-color: var(--red); color: #fff; background: rgba(255, 59, 48, .14); }
  .cnt { color: var(--faint); font-size: 12.5px; font-weight: 700; margin: 12px 2px 0; }
  .g.soon .build { display: block; margin-top: 8px; color: var(--soft); font-weight: 800; font-size: 13px; }
  .g.soon:hover .build { color: #fff; }
  .g.soon { border-style: dashed; justify-content: center; align-items: center; text-align: center; color: var(--faint); min-height: 220px; }
  @media (max-width: 760px) { main { padding: 10px 16px 30px; } .grid { gap: 10px; } .g { padding: 16px; } .g .e { font-size: 30px; margin-bottom: 8px; }
    .g h2 { font-size: 23px; } .g p { margin-bottom: 8px; } .g.soon { min-height: 90px; } }
</style>
</head>
<body>
<nav class="bar"><a id="brand" href="../"></a><div id="views" class="card seg"></div><div id="langs" class="card seg"></div></nav>
<main id="main"></main>
<script type="module">
import { LANGS, esc } from './lab.js';
const CONTRIB_LABS = 'https://github.com/samvelkoch/skill-graph/blob/main/CONTRIBUTING.md#add-or-improve-a-lab';
const UI = {
  en: { done: 'Done ✓', brand: 'Labs', back: 'Back to the graph', graph: 'Graph', list: 'Topic list', cur: 'Curricula', title: 'Learn it by playing with it', lead: 'Each lab explains one idea from the skill graph: drag, tap, guess and see why. They work on phones, in English, Russian and Hungarian.', topics: (n) => `${n} ${n === 1 ? 'topic' : 'topics'} in the graph`, soon: 'More labs are on the way', build: 'Want to build one? Here’s how →', subj: { Science: 'Science', Mathematics: 'Mathematics', Computing: 'Computing', Geography: 'Geography', History: 'History', Music: 'Music', 'Visual Arts': 'Art', English: 'Reading', Hungarian: 'Hungarian language', 'Life Skills': 'Life skills', Other: 'Other' }, localTitle: { hu: (n) => `🇭🇺 For Hungarian schools · ${n}` }, localNote: { hu: 'Labs about the Hungarian language for children in Hungarian schools. Explanations are in your language.' }, find: 'Find a lab…', allSubj: 'All', age: 'Age', anyAge: 'Any age', ageOpt: (a) => `${a} years`, none: 'No labs match. Try another word or clear the filters.', count: (n, t) => (n === t ? `${t} labs` : `${n} of ${t} labs`) },
  ru: { done: 'Пройдена ✓', brand: 'Лаборатории', back: 'Назад к графу', graph: 'Граф', list: 'Список тем', cur: 'Программы', title: 'Понять, играя', lead: 'Каждая лаборатория объясняет одну идею из графа навыков: тяни, нажимай, угадывай и смотри, почему так. Работают на телефоне, на английском, русском и венгерском.', topics: (n) => `${n} ${n % 10 === 1 && n % 100 !== 11 ? 'тема' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'темы' : 'тем'} в графе`, soon: 'Скоро будут новые', build: 'Хочешь сделать свою? Вот как →', subj: { Science: 'Естествознание', Mathematics: 'Математика', Computing: 'Информатика', Geography: 'География', History: 'История', Music: 'Музыка', 'Visual Arts': 'Изобразительное искусство', English: 'Чтение', Hungarian: 'Венгерский язык', 'Life Skills': 'Жизненные навыки', Other: 'Другое' }, localTitle: { hu: (n) => `🇭🇺 Для венгерской школы · ${n}` }, localNote: { hu: 'Лаборатории о венгерском языке для детей, которые учатся в венгерской школе. Объяснения — на вашем языке.' }, find: 'Найти лабораторию…', allSubj: 'Все', age: 'Возраст', anyAge: 'Любой возраст', ageOpt: (a) => `${a} ${a % 10 === 1 && a % 100 !== 11 ? 'год' : a % 10 >= 2 && a % 10 <= 4 && (a % 100 < 12 || a % 100 > 14) ? 'года' : 'лет'}`, none: 'Ничего не нашлось. Попробуй другое слово или сбрось фильтры.', count: (n, t) => (n === t ? `Всего лабораторий: ${t}` : `Найдено ${n} из ${t}`) },
  hu: { done: 'Kész ✓', brand: 'Laborok', back: 'Vissza a gráfhoz', graph: 'Gráf', list: 'Témalista', cur: 'Tantervek', title: 'Értsd meg játszva', lead: 'Minden labor egy gondolatot magyaráz el a készségtérképből: húzd, koppints, tippelj, és lásd, miért. Telefonon is működnek, angolul, oroszul és magyarul.', topics: (n) => `${n} téma a gráfon`, soon: 'Hamarosan jönnek az újak', build: 'Építenél egyet? Így megy →', subj: { Science: 'Természettudomány', Mathematics: 'Matematika', Computing: 'Informatika', Geography: 'Földrajz', History: 'Történelem', Music: 'Ének-zene', 'Visual Arts': 'Vizuális kultúra', English: 'Olvasás', Hungarian: 'Magyar nyelv', 'Life Skills': 'Életvitel', Other: 'Egyéb' }, localTitle: {}, localNote: {}, find: 'Labor keresése…', allSubj: 'Mind', age: 'Életkor', anyAge: 'Bármely életkor', ageOpt: (a) => `${a} év`, none: 'Nincs találat. Próbálj másik szót, vagy töröld a szűrőket.', count: (n, t) => (n === t ? `${t} labor` : `${n} / ${t} labor`) },
};
const p = new URLSearchParams(location.search);
let lang = LANGS[p.get('lang')] ? p.get('lang') : 'en';
// filters, kept in the URL so a filtered view can be linked: ?q=, ?subject=, ?age=
const st = { q: p.get('q') ?? '', subject: p.get('subject') ?? '', age: +p.get('age') || 0 };
const [reg, cat] = await Promise.all([
  fetch('registry.json').then((r) => r.json()).catch(() => ({ labs: [] })),
  fetch('catalog.json').then((r) => (r.ok ? r.json() : null)).catch(() => null),
]);
const SUBJ = ['Science', 'Mathematics', 'Computing', 'Geography', 'History', 'Music', 'Visual Arts', 'English', 'Hungarian', 'Life Skills', 'Other'];
// a lab made for speakers of one language (registry "lang") is "local" in every other UI language: it gets its own collapsed section
const FLAG = { hu: '🇭🇺' };
const isLocal = (l) => !!l.lang && l.lang !== lang;
const localOpen = new Set(); // language codes of the local sections the reader opened
const subjOf = (l) => (SUBJ.includes(l.subject) ? l.subject : 'Other');
const labDone = (l) => { try { return localStorage.getItem('sg-lab:unlocked:' + l.id) === 'true'; } catch { return false; } };
const ageOf = (l) => cat?.labs?.[l.id]?.age;
const fold = (x) => String(x ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const tx = (o) => o?.[lang] ?? o?.en ?? '';
const AGES = [...new Set(reg.labs.flatMap((l) => { const a = ageOf(l); return a ? Array.from({ length: a[1] - a[0] + 1 }, (_, i) => a[0] + i) : []; }))].sort((a, b) => a - b);

function setUrl() {
  const s = new URLSearchParams();
  s.set('lang', lang);
  if (st.q) s.set('q', st.q);
  if (st.subject) s.set('subject', st.subject);
  if (st.age) s.set('age', st.age);
  history.replaceState(null, '', `?${s}`);
}
function renderGrid() {
  const u = UI[lang], q = `?lang=${lang}`, s = fold(st.q.trim());
  const hit = (l) => (!st.subject || subjOf(l) === st.subject) && (!st.age || (ageOf(l) && ageOf(l)[0] <= st.age && ageOf(l)[1] >= st.age))
    && (!s || fold([...Object.values(l.title), tx(l.blurb)].join(' ')).includes(s));
  const shown = reg.labs.filter(hit);
  document.querySelectorAll('#subj button').forEach((b) => b.classList.toggle('on', b.dataset.s === st.subject));
  document.getElementById('count').textContent = u.count(shown.length, reg.labs.length);
  const card = (l) => `<a class="card g" href="${l.path.replace(/^labs\//, '')}${q}"><span class="e">${l.emoji}</span><h2>${esc(tx(l.title))}${labDone(l) ? ` <span class="done">✓ ${esc(u.done.replace(/ ✓$/, ''))}</span>` : ''}</h2>
      <p>${esc(tx(l.blurb))}</p><span class="m">${ageOf(l) ? `${esc(u.age)} ${ageOf(l)[0]}–${ageOf(l)[1]} · ` : ''}${esc(u.topics(l.topics.length))}</span></a>`;
  const normal = shown.filter((l) => !isLocal(l)), loc = shown.filter(isLocal), searching = !!st.q.trim();
  const local = [...new Set(loc.map((l) => l.lang))].map((code) => {
    const ls = loc.filter((l) => l.lang === code);
    return `<details class="local" data-lang="${esc(code)}"${localOpen.has(code) || searching ? ' open' : ''}><summary class="sj">${esc(u.localTitle[code]?.(ls.length) ?? `${FLAG[code] ?? '🌐'} ${code.toUpperCase()} · ${ls.length}`)}</summary>${
      u.localNote[code] ? `<p class="lnote">${esc(u.localNote[code])}</p>` : ''}<div class="grid">${ls.map(card).join('')}</div></details>`;
  }).join('');
  document.getElementById('grid').innerHTML = shown.length ? SUBJ.filter((sj) => normal.some((l) => subjOf(l) === sj)).map((sj) => `<h3 class="sj">${esc(u.subj[sj] ?? sj)}</h3>
    <div class="grid">${normal.filter((l) => subjOf(l) === sj).map(card).join('')}</div>`).join('') + local
    : `<p class="lead">${esc(u.none)}</p>`;
  setUrl();
}
function render() {
  const u = UI[lang], q = `?lang=${lang}`;
  document.documentElement.lang = lang;
  document.title = `${u.brand} · Skill Graph`;
  document.getElementById('brand').innerHTML = `Skill Graph<i>.</i><small>${esc(u.brand)}</small>`;
  document.getElementById('brand').href = `../${q}`;
  document.getElementById('views').innerHTML = `<a href="../${q}">${esc(u.graph)}</a><a href="../${q}&view=list">${esc(u.list)}</a><a class="on" aria-current="page" href="./${q}">🧪 ${esc(u.brand)}</a><a href="../curricula/${q}">📚 ${esc(u.cur)}</a>`;
  document.getElementById('langs').innerHTML = Object.entries(LANGS).map(([k, v]) => `<button data-lang="${k}" class="${k === lang ? 'on' : ''}">${v}</button>`).join('');
  const n = (sj) => reg.labs.filter((l) => !isLocal(l) && (!sj || subjOf(l) === sj)).length; // chips count the labs of the normal lists only
  document.getElementById('main').innerHTML = `<h1>${esc(u.title)}<i>.</i></h1><p class="lead">${esc(u.lead)}</p>
    <div class="tools"><input id="q" type="search" autocomplete="off" placeholder="${esc(u.find)}" value="${esc(st.q)}">
      <select id="age" aria-label="${esc(u.age)}"><option value="0">${esc(u.anyAge)}</option>${AGES.map((a) => `<option value="${a}"${a === st.age ? ' selected' : ''}>${esc(u.ageOpt(a))}</option>`).join('')}</select></div>
    <div class="chips" id="subj"><button data-s="">${esc(u.allSubj)} · ${n('')}</button>${SUBJ.filter((sj) => n(sj)).map((sj) => `<button data-s="${sj}">${esc(u.subj[sj] ?? sj)} · ${n(sj)}</button>`).join('')}</div>
    <p class="cnt" id="count"></p><div id="grid"></div>
    <div class="grid" style="margin-top:16px"><a class="card g soon" href="${CONTRIB_LABS}" target="_blank" rel="noopener">✨ ${esc(u.soon)}<span class="build">${esc(u.build)}</span></a></div>`;
  renderGrid();
}
document.getElementById('langs').addEventListener('click', (ev) => {
  const k = ev.target.closest('button')?.dataset.lang; if (!k) return;
  lang = k; render();
});
document.getElementById('main').addEventListener('input', (ev) => { if (ev.target.id === 'q') { st.q = ev.target.value; renderGrid(); } });
document.getElementById('main').addEventListener('change', (ev) => { if (ev.target.id === 'age') { st.age = +ev.target.value; renderGrid(); } });
// remember which local sections the reader opened (a search opens them on its own: that is not remembered)
document.getElementById('main').addEventListener('toggle', (ev) => {
  const d = ev.target, c = d.dataset?.lang;
  if (!c || !d.classList.contains('local') || st.q.trim()) return;
  if (d.open) localOpen.add(c); else localOpen.delete(c);
}, true);
document.getElementById('main').addEventListener('click', (ev) => {
  const b = ev.target.closest('#subj button'); if (!b) return;
  st.subject = b.dataset.s === st.subject ? '' : b.dataset.s; renderGrid();
});
render();
</script>
</body>
</html>
