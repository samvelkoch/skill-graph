  const len = L.w * 1.3, ex = org.x + Math.cos(th) * len, ey = org.y + Math.sin(th) * len, nx = -Math.sin(th), ny = Math.cos(th);

// --- drawing: a chain of beacon fires (secret) ----------------------------------------------------------------------
const bcXs = (w, n) => Array.from({ length: n }, (_, i) => w * (0.1 + 0.8 * i / (n - 1)));
const bcChain = () => {
  const { n, sleep } = S.bc, ch = [0];
  for (let i = 1; i < n; i++) ch.push(ch[i - 1] < Infinity && !sleep.has(i) ? ch[i - 1] + STEP : Infinity);
  return ch;
};
function drawBeacon(c, w, h, time) {
  const n = S.bc.n, e = { night: 1, fog: 0, cloud: 0 }, xs = bcXs(w, n), tops = [0.5, 0.44, 0.52, 0.42, 0.49, 0.45];
  drawSky(c, w, h, time, e); drawRidge(c, w, h, e);
  const sg = w * (0.62 / n), yb = 0.93 * h;
  const prof = (x) => { let y = yb; for (let i = 0; i < n; i++) y -= (yb - tops[i] * h) * Math.exp(-(((x - xs[i]) / sg) ** 2)) * 0.9; return Math.max(0.3 * h, y); };
  const L = { w, h }; drawHills(c, L, e, prof);
  const ch = bcChain(), run = S.bc.run, t = run ? time - run.t0 : -1, kh = clamp(h * 0.1, 24, 36);
  for (let i = 0; i < n; i++) {
    const x = xs[i], y = prof(x), lit = t >= ch[i] && run, fl = lit ? easeOut(c01((t - ch[i]) / 0.5)) : 0;
    if (run && t >= ch[i] && i < n - 1) {
      const p = c01((t - ch[i]) / STEP), nx = xs[i + 1], ny = prof(nx) - kh * 0.4;
      c.strokeStyle = rgba('#ffd98a', 0.5); c.lineWidth = 1.5; c.setLineDash([4, 6]);
      c.beginPath(); c.moveTo(x, y - kh * 0.4); c.lineTo(lerp(x, nx, p), lerp(y - kh * 0.4, ny, p)); c.stroke(); c.setLineDash([]);
    }
    drawFire(c, x, y + 1, kh * 1.3, fl, time, 1);
    if (fl > 0.02) { c.save(); c.globalCompositeOperation = 'lighter'; glow(c, x, y - kh * 0.4, kh * 2.4 * fl, '#ff9d2e', 0.5 * fl); c.restore(); }
    if (i > 0) {
      const sl = S.bc.sleep.has(i);
      const wx = i === n - 1 ? x - kh * 0.9 : x + kh * 0.9;
      kid(c, wx, prof(wx) + 1, kh, { ...KB, dir: i === n - 1 ? 1 : -1, dark: 0.45, sleep: sl, look: i === n - 1 ? 1 : -1 });
      if (sl) { c.font = '800 14px Nunito, sans-serif'; c.fillStyle = rgba('#cfd8ff', 0.7 + 0.3 * Math.sin(time * 3 + i)); c.textAlign = 'center'; c.fillText('z Z', wx, prof(wx) - kh * 1.15 - 3 * Math.sin(time * 2 + i)); }
    } else kid(c, x + kh * 0.9, prof(x + kh * 0.9) + 1, kh, { ...KA, dir: -1, dark: 0.45, look: -1 });
  }
}
