function restore() {
  const h = S.h, from = h.sel;
  if (h.restored || from === h.vers.length - 1) return;
  h.vers.push({ who: 3, doc: cl(h.vers[from].doc), t0: now() }); h.from = from; h.sel = h.vers.length - 1; h.restored = true; h.viewed = true; sfx.good(); showStage();
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const d = b.dataset;
  switch (d.act) {
    case 'mode': S.sec = null; S.mode = d.m; resetShare(true); sfx.click(); break;
    case 'g1': S.guess = +d.v; sfx.click(); break;
    case 'e1': doEdit(+d.p); break;
    case 'again1': resetShare(false); sfx.click(); break;
    case 'o': doOff(d.o); break;
    case 'lvl': S.a.lv[+d.p] = +d.l; S.a.res = null; sfx.tick(); break;
    case 'who': S.a.who = +d.p; S.a.res = null; sfx.tick(); break;
    case 'tact': S.a.act = +d.a; S.a.res = null; sfx.tick(); break;
    case 'g2': runTest(d.v === 'ok'); break;
    case 'next2': S.a.res = null; sfx.click(); break;
    case 'reset2': S.a.doc = blank(); S.a.res = null; S.flags = []; sfx.click(); break;
    case 'lk': S.lk.named = d.k === 'named'; S.lk.res = null; sfx.tick(); break;
    case 'lklvl': S.lk.lvl = +d.l; S.lk.res = null; sfx.tick(); break;
    case 'lksend': S.lk.res = { named: S.lk.named, lvl: S.lk.lvl, t0: now() }; (S.lk.named ? sfx.bad : sfx.snap)(); showStage(); break;
    case 'del3': delParagraph(); break;
    case 'g3': S.h.guess = d.v; S.h.open = true; S.h.viewed = false; (d.v === 'back' ? sfx.good : sfx.bad)(); showStage(); break;
    case 'ver': S.h.sel = +d.i; S.h.viewed = true; sfx.tick(); break;
    case 'rest': restore(); break;
    case 'again3': S.h = newHist(); sfx.click(); break;
    case 'sec': {
      if (!secret.unlocked()) return secret.open();
      const k = d.k, home = k === 'offline' ? 'share' : 'access', on = S.sec === k && lab.view === home;
      S.sec = on ? null : k;
      if (!on) { if (k === 'offline') resetOff(); else resetLink(); }
      if (lab.view !== home) $('views').querySelector(`[data-view="${home}"]`).click();
      break;
    }
    default: return;
  }
  render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------
const chipP = (act, p, label, extra = '') => `<button class="chip cd-c" data-act="${act}" data-p="${p}" style="border-color:${COL[p]}"${extra}><i class="cd-dot" style="background:${COL[p]}"></i>${esc(label)}</button>`;
const chip = (attrs, label, cls = '', extra = '') => `<button class="chip cd-c ${cls}" ${attrs}${extra}>${esc(label)}</button>`;
const seg = (items, on) => `<div class="card seg small">${items.map(([attrs, label, key]) => `<button ${attrs} class="${key === on ? 'on' : ''}">${esc(label)}</button>`).join('')}</div>`;

function render() {
  const t = T[lang], v = lab.view;
  const body = v === 'share' ? renderShare(t) : v === 'access' ? renderAccess(t) : renderHistory(t);
  const open = secret.unlocked(), mk = (k, emo) => `<button class="chip cd-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('ctrlBody').innerHTML = body + `<div class="row2">${mk('offline', '✈️')}${mk('link', '🔗')}</div>`;
}

function renderShare(t) {
  const s1 = t.s1;
  lab.setGlow('rgba(90,169,255,.26)');
  const modeOn = S.sec === 'offline' ? 'cloud' : S.mode;
  const modeSeg = `<div class="row2" style="margin-top:0">${seg(['copy', 'cloud'].map((m, i) => [`data-act="mode" data-m="${m}"`, s1.mode[i], m]), modeOn)}</div>`;
  if (S.sec === 'offline') return modeSeg + renderOffline(t);
  const k = S.edited.filter(Boolean).length, n = distinct(storedDocs()).length;
  let html = modeSeg, st;
  lab.setFacts(t.facts.share);
  if (S.mode === 'copy' && S.guess === null) {
    lab.setReadout('?', s1.sub(2), '', '#5aa9ff');
    html += `<p class="cd-q" style="margin-top:12px">${esc(s1.q)}</p><div class="cd-opts">${['1', '3', '4'].map((x) => `<button class="cd-ans" data-act="g1" data-v="${x}">${x}</button>`).join('')}</div>`;
    st = { emo: '✉️', title: s1.cStart[0], lead: s1.cStart[1] };
  } else {
    html += `<div class="row2"><div class="chips">${[0, 1, 2].map((p) => chipP('e1', p, s1.editBtn(t.ppl[p]), S.edited[p] ? ' disabled' : '')).join('')}</div></div>`;
    if (k > 0) html += `<div class="row2">${chip('data-act="again1"', s1.again, '')}</div>`;
    lab.setReadout(String(n), s1.sub(n), '', '#5aa9ff');
    if (S.mode === 'copy') {
      if (k === 0) st = { emo: '✉️', title: s1.cGo[0], lead: s1.cGo[1] };
      else if (k < 3) { const [a, b] = s1.cEd(t.ppl[S.last], k); st = { emo: '✏️', title: a, lead: b }; }
      else if (S.guess === n) { const [a, b] = s1.right(n); st = { emo: '✅', title: a, lead: b }; }
      else { const [a, b] = s1.no(S.guess, n); st = { emo: '🤔', title: a, lead: b }; }
    } else if (k === 0) st = { emo: '☁️', title: s1.wStart[0], lead: s1.wStart[1] };
    else if (k < 3) { const [a, b] = s1.wEd(t.ppl[S.last]); st = { emo: '☁️', title: a, lead: b }; }
    else st = { emo: '☁️', title: s1.wAll[0], lead: s1.wAll[1] };
  }
  lab.setState({ ...st, body: '', extra: '' });
  return html;
}

function renderOffline(t) {
  const o = t.off, cf = O.conflict, busy = (line) => O.benDoc[line].s !== 0 || (O.ben && O.pend !== null);
  lab.setFacts(t.facts.off);
  let html = `<div class="row2"><div class="chips">${chip('data-act="o" data-o="go"', O.ben ? o.go[1] : o.go[0], '', cf ? ' disabled' : '')}</div></div><div class="row2"><div class="chips">`;
  if (cf) html += chipP('o', 0, o.keepM).replace('data-act="o"', 'data-act="o" data-o="keepM"') + chipP('o', 1, o.keepB).replace('data-act="o"', 'data-act="o" data-o="keepB"');
  else html += chipP('o', 0, o.mia, O.cloud[1].s !== 0 ? ' disabled' : '').replace('data-act="o"', 'data-act="o" data-o="mia"')
    + chipP('o', 1, o.benT, busy(1) ? ' disabled' : '').replace('data-act="o"', 'data-act="o" data-o="benT"')
    + chipP('o', 1, o.benC, busy(3) ? ' disabled' : '').replace('data-act="o"', 'data-act="o" data-o="benC"');
  html += `</div></div><div class="row2">${chip('data-act="o" data-o="again"', o.again)}</div>`;
  const pn = O.pend === null ? 0 : 1;
  lab.setReadout(String(pn), o.sub(pn), cf ? '⚠' : '', '#5aa9ff');
  const [a, b] = o.st[O.msg];
  lab.setState({ emo: cf ? '⚠️' : O.ben ? '✈️' : '☁️', title: a, lead: b, body: '', extra: '' });
  return html;
}

function renderAccess(t) {
  const s2 = t.s2, A = S.a;
  lab.setGlow('rgba(255,184,77,.22)');
  if (S.sec === 'link') return renderLink(t);
  let html = `<div class="cd-h">${esc(s2.setH)}</div>` + [0, 1, 2].map((p) => `<div class="cd-who"><b><i class="cd-dot" style="background:${COL[p]}"></i>${esc(t.ppl[p])}</b>${seg([0, 1, 2].map((l) => [`data-act="lvl" data-p="${p}" data-l="${l}"`, s2.lvl[l], l]), A.lv[p])}</div>`).join('');
  html += `<div class="cd-h">${esc(s2.testH)}</div><div class="row2" style="margin-top:6px"><div class="chips">${[0, 1, 2].map((p) => `<button class="chip cd-c ${A.who === p ? 'on' : ''}" data-act="who" data-p="${p}"><i class="cd-dot" style="background:${COL[p]}"></i>${esc(t.ppl[p])}</button>`).join('')}</div>`
    + `<div class="chips">${[0, 1].map((a) => chip(`data-act="tact" data-a="${a}"`, s2.act[a], A.act === a ? 'on' : '')).join('')}</div></div>`;
  const tally = A.total ? `${A.right}/${A.total}` : '?', res = A.res;
  if (!res) {
    html += `<p class="cd-q" style="margin-top:12px">${esc(s2.q(t.ppl[A.who], s2.lvlName[A.lv[A.who]], s2.actTxt[A.act]))}</p><div class="cd-opts">${['ok', 'no'].map((x, i) => `<button class="cd-ans" data-act="g2" data-v="${x}">${esc(s2.opts[i])}</button>`).join('')}</div>`;
    lab.setReadout(tally, s2.tally, '', '#ffb84d'); lab.setFacts([]);
    lab.setState({ emo: '🔑', title: s2.start[0], lead: s2.start[1], body: '', extra: '' });
  } else {
    html += `<div class="row2">${chip('data-act="next2"', s2.again)}${chip('data-act="reset2"', s2.reset)}</div>`;
    lab.setReadout(tally, s2.tally, res.ok ? s2.pillOk : s2.pillNo, '#ffb84d'); lab.setFacts(res.act === 0 && res.level === 1 ? t.facts.access : [t.facts.access[1]]);
    lab.setState({ emo: res.ok ? '✅' : '🔒', title: res.guessOk === res.ok ? s2.right : s2.wrong, lead: s2.why[res.act][res.level], body: '', extra: '' });
  }
  return html;
}

function renderLink(t) {
  const s2 = t.s2, l = t.lnk, L = S.lk;
  let html = `<div class="row2" style="margin-top:0">${seg([[`data-act="lk" data-k="named"`, l.who[0], 'named'], [`data-act="lk" data-k="link"`, l.who[1], 'link']], L.named ? 'named' : 'link')}</div>`;
  if (!L.named) html += `<div class="row2">${seg([0, 1, 2].map((i) => [`data-act="lklvl" data-l="${i}"`, s2.lvl[i], i]), L.lvl)}</div>`;
  html += `<div class="row2">${`<button class="btn" data-act="lksend">${esc(l.send)}</button>`}</div>`;
  lab.setReadout(L.named ? '3' : '∞', l.val[L.named ? 0 : 1], '', '#ffb84d'); lab.setFacts([]);
  const res = L.res, [a, b] = !res ? l.start : res.named ? l.deny : l.ok[res.lvl];
  lab.setState({ emo: !res ? '🔗' : res.named ? '🚫' : '🕵️', title: a, lead: b, body: '', extra: '' });
  return html;
}

function renderHistory(t) {
  const s3 = t.s3, h = S.h, last = h.vers.length - 1, cur = h.vers[h.sel], k = cur.doc.filter((L) => L.s !== -1).length;
  lab.setGlow('rgba(63,217,168,.22)');
  let html;
  if (!h.del) html = `<div class="row2" style="margin-top:0"><button class="btn" data-act="del3">${esc(s3.del)}</button></div>`;
  else if (h.guess === null) html = `<p class="cd-q">${esc(s3.q)}</p><div class="cd-opts">${['gone', 'back'].map((x, i) => `<button class="cd-ans" data-act="g3" data-v="${x}">${esc(s3.opts[i])}</button>`).join('')}</div>`;
  else {
    html = `<div class="row2" style="margin-top:0"><div class="chips">${h.vers.map((_, i) => chip(`data-act="ver" data-i="${i}"`, `v${i + 1}`, h.sel === i ? 'on' : '')).join('')}</div></div>`
      + `<div class="row2"><button class="btn" data-act="rest"${h.restored || h.sel === last ? ' disabled' : ''}>${esc(h.restored ? s3.restDone : s3.rest)}</button>${chip('data-act="again3"', s3.again)}</div>`;
  }
  lab.setReadout(`${k}/4`, s3.sub, h.guess !== null && h.sel !== last ? s3.pill : '', '#3fd9a8');
  const actOf = (i) => (i === 4 ? s3.restAct(h.from + 1) : s3.acts[i]);
  let st;
  if (!h.del) st = { emo: '📋', title: s3.start[0], lead: s3.start[1], body: '' };
  else if (h.guess === null) st = { emo: '🗑️', title: s3.gone[0], lead: s3.gone[1], body: '' };
  else if (h.restored && h.sel === last) { const [a, b] = s3.restored(h.from + 1, last + 1); st = { emo: '↩️', title: a, lead: b, body: '' }; }
  else if (h.sel !== last) st = { emo: '🕘', title: s3.view(h.sel + 1), lead: `${actOf(h.sel)}.`, body: s3.older };
  else if (!h.viewed) st = { emo: h.guess === 'back' ? '✅' : '🤔', title: h.guess === 'back' ? s3.right : s3.wrong, lead: s3.open, body: '' };
  else st = { emo: '🕘', title: s3.view(last + 1), lead: `${actOf(last)}.`, body: s3.cur };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(h.guess !== null ? t.facts.history : []);
  return html;
}
render();
</script>
</body>
</html>
