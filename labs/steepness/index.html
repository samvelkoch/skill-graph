// --- controls ---------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const setHTML = (el, html) => { if (el._h !== html) { el._h = html; el.innerHTML = html; } };
const setVal = (id, v) => { const el = $(id); if (+el.value !== v) el.value = v; };
function qBlock(t, act, q, opts, ordKey, ans, why) {
  if (ans === null) return `<div class="st-qb"><div class="st-q">${esc(q)}</div><div class="st-opts">${S.ord[ordKey].map((i) => `<button class="chip" type="button" data-act="${act}" data-i="${i}">${esc(opts[i])}</button>`).join('')}</div></div>`;
  const ok = ans === 0;
  return `<div class="st-qb"><div class="st-q2">${esc(q)}</div><div class="st-v ${ok ? 'ok' : ''}"><b>${esc(ok ? t.right : t.notQuite)}</b> ${esc(why)}</div></div>`;
}
function record() {
  if (S.rStage < 1) return;
  const th = Math.round(S.theta * 10) / 10;
  let g = S.groups.find((x) => x.th === th);
  if (!g) { g = { th, runs: [] }; S.groups.push(g); if (S.groups.length > 3) S.groups.shift(); }

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'rq') {
    if (S.rGuess !== null) return;
    S.rGuess = i; S.rStage = 1; S.theta = 20; S.run = 4; S.groups = []; record(); S.run = 8; (i === 0 ? sfx.good : sfx.bad)();
    setTimeout(() => { record(); render(); }, 1100); showStage();
  } else if (act === 'lq1') {
    if (S.l1 !== null) return;
    S.l1 = i; S.lTheta = 60; S.lLen = 5; (i === 0 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'lq2') {
    if (S.l2 !== null) return;
    S.l2 = i; S.look = 1; (i === 0 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'turn') {
    S.lRot = (S.lRot + 1) % 4; if (S.lRot === 0) B.rot.x -= 360; sfx.click();
  } else if (act === 'other') { S.look = S.look ? 0 : 1; sfx.click(); }
  else if (act === 'sq') {
    if (S.shAns !== null) return;
    S.shAns = i; (i === 0 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'mode') { S.sMode = b.dataset.m; sfx.click(); }
  else if (act === 'steps') { S.steps = !S.steps; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (lab.view !== 'ramp') { lab.view = 'ramp'; lab.renderChrome(); }
    if (S.rStage === 0) { S.rStage = 1; S.rGuess = -1; S.theta = 20; S.run = 4; S.groups = []; } // the quiz is done: skip the prediction
    if (S.sec === k) { S.sec = null; if (S.prev) { S.theta = S.prev.theta; S.run = S.prev.run; } S.prev = null; }
    else {
      if (!S.sec) S.prev = { theta: S.theta, run: S.run };
      S.sec = k;
      if (k === 'a') { S.theta = 19.3; S.run = 8; } else S.theta = 45;
    }
    sfx.snap(); showStage();
  }

});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value; sfx.tick();

  else if (id === 'sA') S.alpha = v;

  if (!pre) q += `<div class="st-tan">${esc(t.tanName)}</div>`;
  setHTML($('rQ'), q);
  $('rAL').textContent = t.angle; $('rAV').textContent = `${f(S.theta, 1)}°`; $('rRL').textContent = t.run; $('rRV').textContent = `${f(S.run)} ${t.m}`;
  setVal('rA', S.theta); setVal('rR', S.run); $('rA').disabled = pre; $('rR').disabled = pre;
  let tab = '';
  if (!pre && S.groups.length) {
    tab = `<table class="st-tb"><thead><tr>${t.tableHead.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`;
    for (const g of S.groups) {
      tab += `<tr class="cap"><td colspan="3">${esc(t.angle)}: ${f(g.th, 1)}°</td></tr>`;
      for (const r of g.runs) tab += `<tr class="${r === S.run && g.th === Math.round(S.theta * 10) / 10 ? 'now' : ''}"><td>${f(r)}</td><td>${f(r * Math.tan(g.th * RAD))}</td><td>${f(Math.tan(g.th * RAD), 3)}</td></tr>`;
    }
    tab += '</tbody></table>';
  }
  setHTML($('rTab'), tab);
  if (pre) lab.setState({ emo: t.state.ramp.emo, title: t.qRamp, lead: '', body: '', extra: '' });
  else lab.setState({ ...t.state.ramp, extra: S.sec ? `<b>${esc(t.secrets[S.sec][0])}.</b> ${esc(t.secrets[S.sec][1])}` : '' });
  lab.setFacts(pre ? [] : t.facts.ramp);
}
function renderLadder(t) {
  const L = S.lLen, th = S.lTheta * RAD, h = L * Math.sin(th), d = L * Math.cos(th), a1 = S.l1, a2 = S.l2;
  lab.setGlow('rgba(255, 122, 89, .24)');
  lab.setReadout(a1 === null ? '?' : `${f(h)} ${t.m}`, a1 === null ? '' : t.heightOnWall, '', '#ff7a59');
  let q = qBlock(t, 'lq1', t.qLadder, t.optsLadder, 'l1', a1, t.ladderWhy);
  if (a1 !== null) q += `<div style="margin-top:10px">${qBlock(t, 'lq2', t.qTop, t.optsTop, 'l2', a2, t.topWhy)}</div>`;
  setHTML($('lQ'), q);
  $('lTL').textContent = t.angle; $('lTV').textContent = a1 === null ? '' : `${f(S.lTheta, 0)}°`; $('lLL').textContent = t.ladderLen; $('lLV').textContent = `${f(L, 1)} ${t.m}`;
  setVal('lT', S.lTheta); setVal('lL', S.lLen); $('lT').disabled = a1 === null; $('lL').disabled = a1 === null;
  setHTML($('lLines'), a1 === null ? '' : `<div class="st-ln"><span>${esc(t.sinLine)}</span><b>${f(h)} ÷ ${f(L, 1)} = ${f(Math.sin(th), 3)}</b></div><div class="st-ln"><span>${esc(t.cosLine)}</span><b>${f(d)} ÷ ${f(L, 1)} = ${f(Math.cos(th), 3)}</b></div>`);
  setHTML($('lBtns'), a1 === null ? '' : `<button class="chip" type="button" data-act="turn">${esc(t.turn)}</button>${a2 === null ? '' : `<button class="chip ${S.look ? 'on' : ''}" type="button" data-act="other">${esc(t.otherAngle)}</button>`}`);
  $('lBtns').style.display = a1 === null ? 'none' : 'flex';
  if (a1 === null) lab.setState({ emo: t.state.ladder.emo, title: t.qLadder, lead: '', body: '', extra: '' });
  else if (a2 === null) lab.setState({ emo: t.state.ladder.emo, title: t.qTop, lead: '', body: '', extra: '' });
  else lab.setState({ ...t.state.ladder, extra: '' });
  lab.setFacts(a1 === null ? [] : t.facts.ladder);
}
function renderShadow(t) {
  const hm = S.sMode === 'height', pre = !hm && S.shAns === null;
  lab.setGlow('rgba(94, 200, 242, .24)');
  if (hm) lab.setReadout(`${f(S.s * Math.tan(S.alpha * RAD), 1)} ${t.m}`, t.treeHeight, '', '#5ec8f2');
  else lab.setReadout(pre ? '?' : `${Math.round(Math.atan(S.ht / S.sh) / RAD)}°`, pre ? '' : t.angleOfSun, '', '#5ec8f2');
  setHTML($('sMode'), `<button class="chip ${hm ? 'on' : ''}" type="button" data-act="mode" data-m="height">${esc(t.modeHeight)}</button><button class="chip ${hm ? '' : 'on'}" type="button" data-act="mode" data-m="angle">${esc(t.modeAngle)}</button>`);
  setHTML($('sQ'), hm ? '' : qBlock(t, 'sq', t.qShadow, t.optsShadow, 'sh', S.shAns, t.shadowWhy));
  $('sQ').style.display = hm ? 'none' : 'block';
  const show = (id, on) => { $(id).parentElement.style.display = on ? 'block' : 'none'; };
  show('sA', hm); show('sS', hm); show('sH', !hm); show('sW', !hm);
  $('sAL').textContent = t.sunAngle; $('sAV').textContent = `${S.alpha}°`; $('sSL').textContent = t.shadowLen; $('sSV').textContent = `${S.s} ${t.m}`;
  $('sHL').textContent = t.treeHeight; $('sHV').textContent = `${S.ht} ${t.m}`; $('sWL').textContent = t.shadowLen; $('sWV').textContent = `${S.sh} ${t.m}`;
  setVal('sA', S.alpha); setVal('sS', S.s); setVal('sH', S.ht); setVal('sW', S.sh);
  $('sH').disabled = pre; $('sW').disabled = pre;
  let steps = '';
  if (!hm && !pre) {
    const r = S.ht / S.sh, a = Math.round(Math.atan(r) / RAD);
    steps = `<div class="row2 st-row"><button class="chip ${S.steps ? 'on' : ''}" type="button" data-act="steps">${esc(t.showSteps)}</button></div>`
      + (S.steps ? `<div class="st-steps">${esc(t.steps(f(S.ht, 0), f(S.sh, 0), f(r, 2), a))}</div>` : '');
  }
  setHTML($('sSteps'), steps);
  if (hm) lab.setState({ emo: t.state.shadow.emo, title: t.modeHeight, lead: t.heightLead, body: '', extra: '' });
  else if (pre) lab.setState({ emo: t.state.shadow.emo, title: t.qShadow, lead: '', body: '', extra: '' });
  else lab.setState({ ...t.state.shadow, extra: '' });
  lab.setFacts(pre ? [] : t.facts.shadow);
}

canvasLoop($('cv'), draw);
render();
</script>
