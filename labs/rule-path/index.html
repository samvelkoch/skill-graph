const hex2 = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex2(a), B = hex2(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

}

}

  col = D(col); c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath();

}

function wrap(c, text, maxW) {
  const words = String(text).split(' '), lines = []; let cur = '';

function drawIdea(c, dt, time) {
  const t = T[lang];
  S.tp += (S.tpT - S.tp) * (1 - Math.exp(-dt * 4.5)); if (Math.abs(S.tpT - S.tp) < .002) S.tp = S.tpT;
  const reach = S.st + (S.res && S.res.pass ? 1 : 0);
  viewTitle(c, t.vt.idea); pill(c, `💡 ${t.sch.idea}`, W / 2, 50, { px: 13, maxW: 330, stroke: 'rgba(240,194,90,.7)' });
  trail(c, P1, S.tp);
  P1.forEach(([x, y], i) => {
    const on = i <= reach, pop = on ? outBack((time - S.litAt[i]) / .5) : 1;
    if (i === reach && S.st < 4) glowRing(c, x, y, time);
    building(c, IDEA_B[i], x, y, .82, on ? 0 : .6, S.litAt[i] > time - .5 ? pop : 1);
    badge(c, x, y + 17, i < reach ? '✓' : String(i + 1), i < reach ? '#3d9a6c' : i === reach ? '#c9962c' : '#4a5a82');
  });
  if (S.res) {
    const [x, y] = P1[S.st]; const ok = S.res.pass;
    disc(c, x, y - 60, 11, ok ? '#3d9a6c' : '#d1604f'); c.fillStyle = '#fff'; c.font = `900 ${fs(14)}px Nunito, system-ui, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ok ? '✓' : '✗', x, y - 59.5);
  }
  const [px, py] = posAt(P1, S.tp), age = time - S.shakeAt, dx = age < .5 ? Math.sin(age * 40) * 4 * (1 - age / .5) : 0;
  scroll(c, px + dx, py + 6 - hopOf(Math.abs(S.tpT - S.tp), time) + Math.sin(time * 3) * 1.2, 1, time, age < .9 && age >= 0);
  const idx = Math.min(reach, 4);
  pill(c, t.sch.st[idx][0], W / 2, 82, { px: 13, maxW: 300 });
}

  S.lp += (S.li - S.lp) * (1 - Math.exp(-dt * 4.5)); if (Math.abs(S.li - S.lp) < .002) S.lp = S.li;

  P2.forEach(([x, y], i) => {
    if (i >= n) return;
    const on = i <= S.li, age = time - S.lAt[i];

    if (on) building(c, BTYPE[keys[i]], x, y, .8, 0, age < .5 ? outBack(age / .5) : 1); else plot(c, x, y, time);

    if (p >= 1) { S.fall = null; if (fl.ok) { S.placed[k]++; S.ci++; if (S.ci >= 8) S.enfAt = time; } render(); }
  }
  if (S.ci < 8 || S.fall) {
    const cardI = S.fall ? S.fall.ci : S.ci, text = t.sort.cards[cardI];
    let x = 180, y = 52, sc = 1, a = 1, flash = 0;
    if (S.fall) {
      const f = S.fall, p = clamp((time - f.t0) / .95, 0, 1), cx = CHX[f.k];
      if (f.ok) {
        if (p < .45) { const e = ease(p / .45); x = lerp(180, cx, e); y = lerp(52, 112, e); sc = lerp(1, .42, e); }
        else { const e = ease((p - .45) / .55); x = cx; y = lerp(112, 200, e); sc = lerp(.42, .3, e); a = 1 - e; }
      } else {
        if (p < .4) { const e = ease(p / .4); x = lerp(180, cx, e); y = lerp(52, 112, e); sc = lerp(1, .5, e); }
        else { const e = ease((p - .4) / .6); x = lerp(cx, 180, e); y = lerp(112, 52, e); sc = lerp(.5, 1, e); flash = 1 - e; x += Math.sin(p * 50) * 3 * (1 - e); }
      }
    }
    c.save(); c.translate(x, y); c.scale(sc, sc); c.globalAlpha = a;
    const f = fs(15); c.font = `800 ${f}px Nunito, system-ui, sans-serif`; const lines = wrap(c, text, 220), lh = f * 1.25, ch = lines.length * lh + 18;
    shadow(c, 0, ch / 2 + 4, 110);
    rr(c, -125, -ch / 2, 250, ch, 12); c.fillStyle = lg(c, -125, -ch / 2, 125, ch / 2, '#fbf3dc', '#e8d9b0'); c.fill(); c.lineWidth = 1.5; c.strokeStyle = flash ? '#d1604f' : '#a98f54'; c.stroke();
    c.fillStyle = '#3a3350'; c.textAlign = 'center'; c.textBaseline = 'middle'; lines.forEach((l, i) => c.fillText(l, 0, -ch / 2 + 9 + lh * (i + .5)));
    c.restore();
  } else {
    const age = time - S.enfAt, spec = { fam: [{ x: -10, o: { hair: '#6b4a2f', body: '#d9695c' }, r: 13 }, { x: 14, o: { hair: '#2a2a35', body: '#e0b050' }, r: 9 }],
      sch: [{ x: 0, o: { hair: '#8a5a3a', body: '#4f7bd0', glasses: true }, r: 14 }],
      law: [{ x: -12, o: { cap: true, body: '#2d3f6e', skin: '#e6b88e' }, r: 12 }, { x: 12, o: { hair: '#e8e8ee', body: '#2a2a35' }, r: 12 }] };
    ek.forEach((k, i) => {
      const pop = outBack((age - i * .18) / .5); if (pop <= 0) return;
      c.save(); c.translate(CHX[k], 70); c.scale(pop, pop); c.translate(-CHX[k], -70);
      spec[k].forEach((q) => kid(c, CHX[k] + q.x, 28 + (q.r < 12 ? 6 : 0), q.r, q.o)); c.restore();
      if (age - i * .18 > .3) pill(c, t.sort.who[k], CHX[k], 78, { px: 12.5, maxW: 112 });
    });
  }
}

function drawPet(c, dt, time) {
  const t = T[lang];
  S.petShow += (S.pet - S.petShow) * (1 - Math.exp(-dt * 6));
  const done = S.pet >= 100000, filled = Math.round(S.petShow / 10000), fw = 300 * clamp(S.petShow / 100000, 0, 1);
  viewTitle(c, T[lang].secrets.pet[0]);
  const age = time - S.flew, fly = done ? ease(age / 1.4) : 0;
  building(c, 'parl', 292, 140, 1.25, fly >= 1 ? 0 : .6 * (1 - fly));
  for (let i = 0; i < 10; i++) {
    const x = 34 + i * 30, y = 176 + (i % 2) * 8, on = i < filled;
    kid(c, x, y, 10, { hair: ['#6b4a2f', '#2a2a35', '#b5792f', '#8a5a3a', '#d9a96b'][i % 5], body: ['#d9695c', '#5b86d6', '#e0b050', '#4fae94', '#8c6fd6'][(i * 2) % 5], skin: ['#f2c7a0', '#e0a97e', '#f5d3b3'][i % 3] });
    if (on) { box(c, x - 6, y - 32 - Math.sin(time * 3 + i) * 1.5, 12, 15, '#f6ecd2', 2); c.strokeStyle = '#3d9a6c'; c.lineWidth = 1.8; c.beginPath(); c.moveTo(x - 3, y - 24); c.lineTo(x - .5, y - 21); c.lineTo(x + 3.5, y - 28); c.stroke(); }
  }
  box(c, 30, 252, 300, 18, '#1a2340', 9);
  if (fw > 2) { rr(c, 30, 252, fw, 18, 9); c.fillStyle = lg(c, 30, 0, 330, 0, '#f0c25a', '#3ddc97'); c.fill(); }
  c.strokeStyle = '#a58d58'; c.lineWidth = 2; c.beginPath(); c.moveTo(330, 242); c.lineTo(330, 278); c.stroke(); poly(c, [[330, 242], [345, 247], [330, 252]], '#d1604f');
  pill(c, fmt(100000), 296, 236, { px: 12.5, maxW: 120, stroke: 'rgba(240,194,90,.7)' });
  pill(c, `${fmt(Math.round(S.petShow / 100) * 100)}`, clamp(30 + fw, 70, 290), 288, { px: 13, maxW: 120 });
  const sx = done ? lerp(180, 292, fly) : 180, sy = (done ? lerp(124, 126, fly) : 124) - (done ? Math.sin(fly * Math.PI) * 38 : 0) + Math.sin(time * 3) * 1.5;
  scroll(c, sx, sy, 1.15, time, false);
  if (done && fly >= 1) { pill(c, t.pet.bubble, 270, 62, { px: 12.5, maxW: 190, stroke: 'rgba(61,220,151,.8)' }); for (let i = 0; i < 4; i++) { const a = time * 1.6 + i * 1.57; spark(c, 292 + Math.cos(a) * 42, 108 + Math.sin(a) * 26, 4, a, '#ffe08a'); } }
}

function drawOld(c, dt, time) {
  const t = T[lang], cards = t.old.cards;
  viewTitle(c, t.secrets.old[0]);
  rr(c, 22, 44, 306, 258, 22); c.fillStyle = lg(c, 22, 44, 328, 302, '#4b6290', '#2a3a5e'); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#1a2340'; c.stroke();
  for (let i = 0; i < 3; i++) disc(c, 140 + i * 40, 62, 7, S.old === i ? '#f0c25a' : '#55648a');
  rr(c, 40, 80, 270, 190, 14); c.fillStyle = lg(c, 40, 80, 310, 270, '#fbf3dc', '#e8d9b0'); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#a98f54'; c.stroke();
  c.save(); rr(c, 40, 80, 270, 190, 14); c.clip();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  if (S.old < 0) { c.fillStyle = '#a98f54'; c.font = `900 ${fs(64)}px Nunito, system-ui, sans-serif`; c.fillText('?', 175, 150); c.font = `800 ${fs(15)}px Nunito, system-ui, sans-serif`; c.fillStyle = '#5a4a38'; c.fillText(t.old.idle, 175, 215); }
  else {
    const age = time - S.oldAt, e = ease(age / .5), card = cards[S.old], e2 = ease((age - .7) / .5);
    c.save(); c.translate(0, (1 - e) * -40); c.globalAlpha = e;
    let f = fs(15); c.font = `800 ${f}px Nunito, system-ui, sans-serif`; c.fillStyle = '#3a3350'; let y = 96;
    wrap(c, card[0], 240).forEach((l) => { c.fillText(l, 175, y + f * .6); y += f * 1.25; });
    c.restore(); y += 6;
    c.globalAlpha = e2; c.strokeStyle = '#a98f54'; c.lineWidth = 1.2; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(60, y); c.lineTo(290, y); c.stroke(); c.setLineDash([]); y += 12;
    f = fs(12.5); c.font = `800 ${f}px Nunito, system-ui, sans-serif`; c.fillStyle = '#8a5a2a'; c.fillText(t.old.then, 175, y); y += f * 1.35;
    c.font = `700 ${f}px Nunito, system-ui, sans-serif`; c.fillStyle = '#4a3f5a';
    wrap(c, card[1], 240).forEach((l) => { c.fillText(l, 175, y); y += f * 1.25; });
    c.globalAlpha = 1;
  }
  c.restore();
  c.save(); c.translate(70, 286); c.rotate(time * .6); c.fillStyle = '#7f8db3'; for (let i = 0; i < 6; i++) { c.rotate(TAU / 6); c.fillRect(-2, -9, 4, 6); } disc(c, 0, 0, 6, '#7f8db3'); c.restore();
  c.save(); c.translate(98, 288); c.rotate(-time * .6 + .3); c.fillStyle = '#7f8db3'; for (let i = 0; i < 6; i++) { c.rotate(TAU / 6); c.fillRect(-2, -7, 4, 5); } disc(c, 0, 0, 4.5, '#7f8db3'); c.restore();
  const la = time - S.lever, lt = la < .25 ? ease(la / .25) : la < .65 ? 1 - ease((la - .25) / .4) : 0, ang = lerp(-1.0, .6, lt), px = 328, py = 150, L = 28;
  c.strokeStyle = '#1a2340'; c.lineWidth = 7; c.lineCap = 'round'; c.beginPath(); c.moveTo(px, py); c.lineTo(px + Math.cos(ang) * L, py + Math.sin(ang) * L); c.stroke();
  c.strokeStyle = '#b8c2dc'; c.lineWidth = 4; c.stroke(); c.lineCap = 'butt'; disc(c, px + Math.cos(ang) * L, py + Math.sin(ang) * L, 8, '#d1604f'); disc(c, px, py, 6, '#7f8db3');
}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function resetIdea() { S.st = 0; S.picked = S.pred = S.res = null; S.tried = [[], [], [], []]; S.tp = S.tpT = 0; S.litAt = [-9, -9, -9, -9, -9]; }
function resetLaw() { S.li = 0; S.lp = 0; S.lpick = null; S.lres = null; S.lAt = [0, -9, -9, -9, -9, -9, -9]; }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, d = b.dataset;
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === d.k ? null : d.k; sfx.click();
    if (S.sec === 'pet') { S.pet = 0; S.petShow = 0; S.flew = -9; }
    if (S.sec === 'old') { S.old = -1; }
  } else if (S.sec === 'pet') {
    if (a === 'collect' && S.pet < 100000) { S.pet += 20000; sfx.snap(); if (S.pet >= 100000) { S.flew = now(); sfx.good(); } }
    else if (a === 'reset') { S.pet = 0; S.petShow = 0; S.flew = -9; sfx.click(); }
  } else if (S.sec === 'old') {
    if (a === 'lever') { S.old = (S.old + 1) % 3; S.oldAt = now() + .25; S.lever = now(); sfx.push(); }
  } else if (lab.view === 'idea') {
    if (a === 'pick' && !S.res) { S.picked = +d.i; sfx.click(); }
    else if (a === 'pred' && S.picked !== null && !S.res) {
      S.pred = d.v === '1'; const pass = S.picked === SCH_OK[S.st]; S.res = { pass, right: S.pred === pass };
      if (pass) { S.tpT = S.st + 1; S.litAt[S.st + 1] = now(); } else { S.shakeAt = now(); S.tried[S.st].push(S.picked); }
      (S.res.right ? sfx.good : sfx.bad)(); showStage();
    } else if (a === 'go') { S.st++; S.picked = S.pred = S.res = null; sfx.click(); }
    else if (a === 'other') { S.picked = S.pred = S.res = null; sfx.click(); }
    else if (a === 'again') { resetIdea(); sfx.click(); }
  } else if (lab.view === 'law') {
    if (a === 'country') { S.country = d.k; resetLaw(); sfx.click(); }
    else if (a === 'lopt' && !S.lres) {
      const keys = LAW[S.country], ok = d.k === keys[S.li + 1]; S.lpick = d.k; S.lres = { ok }; S.li++; S.lAt[S.li] = now(); (ok ? sfx.good : sfx.bad)(); showStage();
    } else if (a === 'lgo') { S.lpick = null; S.lres = null; sfx.click(); }
    else if (a === 'lagain') { resetLaw(); sfx.click(); }
  } else {
    if (a === 'chute' && !S.fall && S.ci < 8) {
      const k = d.k, ok = CARDS[S.ci] === k; if (!ok) S.crossed[S.ci].push(k);
      S.fall = { k, ok, ci: S.ci, t0: now() }; (ok ? sfx.good : sfx.bad)();
    } else if (a === 'sagain') { S.ci = 0; S.crossed = [[], [], [], [], [], [], [], []]; S.placed = { fam: 0, sch: 0, law: 0 }; S.fall = null; sfx.click(); }
  }
  render();
});

// --- one render per change -----------------------------------------------------------------------------------
function render() {
  const t = T[lang], open = secret.unlocked(), v = S.sec || lab.view;
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('rpSec').innerHTML = sc('pet', '✍️') + sc('old', '📜');
  lab.setGlow('rgba(224, 176, 80, .24)');
  if (v === 'pet') renderPet(t); else if (v === 'old') renderOld(t); else if (v === 'idea') renderIdea(t); else if (v === 'law') renderLaw(t); else renderSort(t);
}

function renderIdea(t) {
  const q = t.sch, st = S.st, main = $('rpMain'), reach = st + (S.res && S.res.pass ? 1 : 0);
  lab.setReadout(`${Math.min(reach, 4)}/4`, q.unit, '', '#e0b050');
  lab.setFacts([{ emo: '🏫', text: t.f.sch, src: SRC.sch }]);
  if (st >= 4) {
    main.innerHTML = `<button class="btn rp-go" data-act="again">${esc(t.again)}</button>`;
    lab.setState({ emo: '📜', title: q.endT, lead: q.endL, body: q.endB, extra: '' }); return;
  }
  const acts = q.acts[st];
  if (!S.res) {
    if (S.picked === null) {
      main.innerHTML = `<p class="rp-q">${esc(q.pickQ)}</p><div class="rp-opts">${acts.map((a, i) => `<button class="rp-opt" data-act="pick" data-i="${i}"${S.tried[st].includes(i) ? ' disabled' : ''}>${esc(a[0])}</button>`).join('')}</div>`;
      lab.setState({ emo: '🏫', title: q.st[st][0], lead: q.st[st][1], body: q.pickBody, extra: '' });
    } else {
      main.innerHTML = `<p class="rp-chose">${esc(q.chose)} ${esc(acts[S.picked][0])}</p><p class="rp-q">${esc(q.willQ)}</p>
        <div class="rp-yn"><button class="rp-opt" data-act="pred" data-v="1">${esc(t.yes)}</button><button class="rp-opt" data-act="pred" data-v="0">${esc(t.no)}</button></div>`;
      lab.setState({ emo: '🤔', title: q.st[st][0], lead: q.st[st][1], body: `${q.chose} ${acts[S.picked][0]}`, extra: '' });
    }
    return;
  }
  const r = S.res, why = acts[S.picked][1];
  main.innerHTML = `<p class="rp-vd ${r.right ? 'ok' : 'no'}">${esc(r.right ? t.right : t.notq)} ${esc(r.pass ? q.passT : q.failT)}</p>
    <button class="btn rp-go" data-act="${r.pass ? 'go' : 'other'}">${esc(r.pass ? t.go : q.other)}</button>`;
  lab.setState({ emo: r.pass ? '✅' : '↩️', title: r.pass ? q.passT : q.failT, lead: `${r.right ? t.right : t.notq} ${why}`, body: '', extra: '' });
}

function renderLaw(t) {
  const q = t.law, keys = LAW[S.country], n = keys.length, main = $('rpMain');
  lab.setReadout(`${S.li + 1}/${n}`, q.unit, '', '#e0b050');
  lab.setFacts([{ emo: '👑', text: t.f.law1, src: SRC.law1 }, { emo: '🏛️', text: t.f.law2, src: SRC.law2 }]);
  const chips = `<div class="chips" style="margin-bottom:10px">${['hu', 'ru', 'uk'].map((k) => `<button class="chip ${S.country === k ? 'on' : ''}" data-act="country" data-k="${k}">${esc(q.country[k])}</button>`).join('')}</div>`;
  const cur = keys[S.li];
  if (S.lres) {
    const ok = S.lres.ok;
    main.innerHTML = `${chips}<p class="rp-vd ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.notq)} ${esc(q.st[cur][0])}</p><button class="btn rp-go" data-act="${S.li === n - 1 ? 'lagain' : 'lgo'}">${esc(S.li === n - 1 ? t.again : t.go)}</button>`;
    lab.setState({ emo: ok ? '✅' : '💡', title: q.st[cur][0], lead: `${ok ? t.right : t.notq} ${q.st[cur][1]}`, body: S.li === n - 1 ? `${q.endL[S.country]} ${q.endB}` : '', extra: '' });
    return;
  }
  if (S.li >= n - 1) {
    main.innerHTML = `${chips}<button class="btn rp-go" data-act="lagain">${esc(t.again)}</button>`;
    lab.setState({ emo: '🏁', title: q.endT, lead: q.endL[S.country], body: q.endB, extra: '' }); return;
  }
  const bad = LAWBAD[S.country][S.li + 1], nxt = keys[S.li + 1], arr = [bad[0], bad[1]]; arr.splice((S.li + CI[S.country]) % 3, 0, nxt);
  main.innerHTML = `${chips}<p class="rp-q">${esc(q.ask)}</p><div class="rp-opts">${arr.map((k) => `<button class="rp-opt" data-act="lopt" data-k="${k}">${esc(q.st[k][0])}</button>`).join('')}</div>`;
  lab.setState({ emo: '🏛️', title: q.st[cur][0], lead: q.st[cur][1], body: q.askBody, extra: '' });
}

function renderSort(t) {
  const q = t.sort, main = $('rpMain'), all = S.ci >= 8;
  lab.setReadout(`${Math.min(S.ci, 8)}/8`, q.unit, '', '#e0b050');
  lab.setFacts([{ emo: '⚖️', text: t.f.sort, src: SRC.sort }]);
  if (all && !S.fall) {
    main.innerHTML = `<button class="btn rp-go" data-act="sagain">${esc(t.again)}</button>`;
    lab.setState({ emo: '🗂️', title: q.endT, lead: q.endL, body: q.endB, extra: '' }); return;
  }
  const ci = Math.min(S.ci, 7);
  main.innerHTML = `<p class="rp-q">${esc(q.q)}</p><div class="rp-chutes">${['fam', 'sch', 'law'].map((k) => `<button class="rp-opt" data-act="chute" data-k="${k}"${S.crossed[ci].includes(k) || S.fall ? ' disabled' : ''}><b>${CHE[k]}</b>${esc(q.chutes[k])}</button>`).join('')}</div>`;
  const lastOk = S.ci > 0 && S.crossed[S.ci - 1] && CARDS[S.ci - 1];
  if (S.crossed[ci].length) lab.setState({ emo: '🤔', title: q.cards[ci], lead: q.wrong, body: '', extra: '' });
  else if (S.ci > 0) lab.setState({ emo: '✅', title: q.cards[S.ci - 1], lead: q.expl[lastOk], body: '', extra: '' });
  else lab.setState({ emo: '🗂️', title: q.q, lead: t.vt.sort, body: '', extra: '' });
}

function renderPet(t) {
  const q = t.pet, done = S.pet >= 100000;
  lab.setReadout(fmt(S.pet), q.unit, '', '#e0b050'); lab.setFacts([{ emo: '✍️', text: t.f.pet, src: SRC.pet }]);
  $('rpMain').innerHTML = `<div class="rp-row" style="margin-top:0"><button class="btn" data-act="collect"${done ? ' disabled' : ''}>${esc(q.collect)}</button><button class="chip" data-act="reset">${esc(q.reset)}</button></div>`;
  if (done) lab.setState({ emo: '🏛️', title: q.t1, lead: q.l1, body: q.b1, extra: '' });
  else lab.setState({ emo: '✍️', title: q.t0, lead: S.pet ? q.l(fmt(S.pet)) : q.l0, body: q.b0, extra: '' });
}

function renderOld(t) {
  const q = t.old; lab.setReadout(S.old < 0 ? '?' : `${S.old + 1}/3`, '', '', '#e0b050'); lab.setFacts([]);
  $('rpMain').innerHTML = `<div class="rp-row" style="margin-top:0"><button class="btn" data-act="lever">${esc(q.lever)}</button></div>`;
  if (S.old < 0) lab.setState({ emo: '📜', title: q.t0, lead: q.l0, body: q.b0, extra: '' });
  else lab.setState({ emo: '📜', title: q.t1, lead: q.l1, body: q.b1, extra: `<div style="font-size:11px;color:var(--faint)">${esc(q.cards[S.old][2])}</div>` });
}
render();
</script>
</body>
</html>
