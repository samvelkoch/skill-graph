const RAD = Math.PI / 180, TAU = Math.PI * 2, ISO = 35.264, W = 5, D = 4, WH = 2.3;

const eIO = (t) => { t = cl01(t); return t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t); };
const nowS = () => performance.now() / 1000;
const HC = {};
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
const colOf = (h) => (typeof h === 'string' ? (HC[h] ||= hexRgb(h)) : h);

const spring = (p, v, t, dt, k = 120, d = 15) => { const a = (t - p) * k - v * d; v += a * dt; return [p + v * dt, v]; };

// --- the views: derived from the unrotated building H[y * 3 + x] (x to the right seen from the front, y away from the front) -------
const IX = (x, y) => y * 3 + x;
const frontH = (H) => [0, 1, 2].map((x) => Math.max(H[IX(x, 0)], H[IX(x, 1)], H[IX(x, 2)]));
const sideH = (H) => [0, 1, 2].map((y) => Math.max(H[IX(0, y)], H[IX(1, y)], H[IX(2, y)]));
const hGrid = (hs) => { const g = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) g.push(2 - r < hs[c] ? 1 : 0); return g; };
const topGrid = (H) => { const g = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) g.push(H[IX(c, 2 - r)] > 0 ? 1 : 0); return g; };
const viewGrid = (H, k) => (k === 'front' ? hGrid(frontH(H)) : k === 'side' ? hGrid(sideH(H)) : topGrid(H));
const sameGrid = (a, b) => a.every((v, i) => v === b[i]);
function maxCount(H) { const f = frontH(H), s = sideH(H); let n = 0; for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) if (H[IX(x, y)] > 0) n += Math.min(f[x], s[y]); return n; }
const sum = (a) => a.reduce((p, q) => p + q, 0);

}
