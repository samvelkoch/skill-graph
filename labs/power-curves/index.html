// --- drawing helpers -----------------------------------------------------------------------------------------
const ease = (t) => { const k = clamp(t, 0, 1); return k * k * (3 - 2 * k); };

function tag(c, text, x, y, col = '#EDEFF7', align = 'center', used = null) {

function mkFrame(box, xr, yr, equal) {

  const px = box.x + m.l, py = box.y + m.t, pw_ = Math.max(10, box.w - m.l - m.r), ph = Math.max(10, box.h - m.t - m.b);

// --- view 2: roots (mirror in y = x) and negative x -------------------------------------------------------------
function drawRoots(c, w, h, time) {
  if (S.st2 >= 4 && S.mode === 'neg') { drawNeg(c, w, h, time); return; }
  const R = S.Rv, n = S.n2, cc = S.c, r = Math.pow(cc, 1 / n), e = ease(S.flip), th = Math.PI * e, k = Math.cos(th);
  const G = mkFrame({ x: 6, y: 4, w: w - 12, h: h - 8 }, [-0.07 * R, R], [-0.07 * R, R], true);
  const asking = S.st2 === 0 || S.st2 === 2;
  paper(c, G, 'x', 'y');
  const tr = (x, y) => { const mx = (x + y) / 2, d = (x - y) / 2; return [mx + d * k, mx - d * k]; };
  const xe = Math.pow(R * 1.04, 1 / n);
  const orig = [], flipd = [];
  for (let i = 0; i <= 240; i++) { const x = xe * i / 240, y = Math.pow(x, n); orig.push([x, y]); flipd.push(tr(x, y)); }
  clipTo(c, G);
  const m = mirrorLine(c, G);
  ptsPath(c, G, orig); strokeGlow(c, TEAL, e > 0.02 ? 2.2 : 3.4, e > 0.02 ? 0.55 : 1);
  if (e > 0.001) { ptsPath(c, G, flipd); strokeGlow(c, CORAL, 3.6); }
  const done = e > 0.985;
  if (!asking && done) {
    dashed(c, G, r, cc, cc, r, GOLD, 1.2, 0.8); // the reflection segment, perpendicular to the mirror
    dashed(c, G, cc, 0, cc, r, CORAL, 1.3, 0.8); dashed(c, G, 0, r, cc, r, CORAL, 1.3, 0.8);
  }
  c.restore();
  // the number c on the x-axis
  const X0 = G.X(cc), Yb = G.py + G.ph;
  c.save(); c.fillStyle = GOLD; c.beginPath(); c.moveTo(X0, Yb - 1); c.lineTo(X0 - 6, Yb - 11); c.lineTo(X0 + 6, Yb - 11); c.closePath(); c.fill(); c.restore();
  tag(c, num(cc), X0, Yb - 24, GOLD);
  const ml = Math.min(G.xmax, G.ymax) * 0.55;
  tag(c, 'y = x', G.X(ml) + 30, G.Y(ml) + 18, GOLD);
  if (asking) return;
  const [qx, qy] = tr(r, cc);
  if (e < 0.9) dot(c, G.X(r), G.Y(cc), 4, TEAL);
  dot(c, G.X(qx), G.Y(qy), 6.5, e > 0.5 ? CORAL : TEAL, '#fff');
  if (done) {
    tag(c, num(r, 3), G.px + 8, G.Y(r) - 14, CORAL, 'left');
    tag(c, pt(num(cc), num(r, 3)), G.X(cc) + 10, G.Y(r) - 16, CORAL, 'left');
    if (G.X(r) > G.px + 30) tag(c, pt(num(r, 3), num(cc)), G.X(r) + 10, G.Y(cc) + 2, TEAL, 'left');
  }
}
function drawNeg(c, w, h) {
  const n = S.n2, G = mkFrame({ x: 6, y: 4, w: w - 12, h: h - 8 }, [-2.3, 2.3], [-4.3, 4.3], false);

  funcPath(c, G, (x) => Math.pow(x, n), -2.3, 2.3, 300); strokeGlow(c, TEAL, 3.6);
  if (ax > 0.04) {

  }
  c.restore();

  if (ax > 0.04) {

    tag(c, pt(num(px_), num(py_, 2)), G.X(px_) + 10, G.Y(py_) + (even ? -14 : -14), TEAL, 'left');

// --- view 3: the solar system above the graph T = a^n ------------------------------------------------------------
const ds3 = () => (S.moons && S.p3 !== null ? MOONS : PLANETS);
function fitInfo() {
  const ds = ds3(), asking = S.p3 === null;
  const list = ds.filter((p) => !(asking && p.k === 'Mars'));
  const hits = list.filter((p) => Math.abs(Math.pow(p.a, S.n3) / p.T - 1) < TOL).length;
  return { ds, list, hits, N: list.length, solved: !asking && hits === ds.length };
}
function drawSystem(c, B, asking) {
  const ds = ds3(), moons = ds === MOONS, cx = B.x + B.w / 2, cy = B.y + B.h / 2;
  const bg = c.createRadialGradient(cx, cy, 4, cx, cy, Math.max(B.w, B.h) * 0.7); bg.addColorStop(0, '#1a1f3f'); bg.addColorStop(1, '#090c1c');

  c.save(); rrect(c, B.x, B.y, B.w, B.h, 18); c.clip();
  c.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 26; i++) { const sx = B.x + ((i * 97) % 101) / 101 * B.w, sy = B.y + ((i * 53) % 89) / 89 * B.h; c.globalAlpha = 0.25 + ((i * 7) % 5) * 0.1; c.fillRect(sx, sy, 1.5, 1.5); }
  c.globalAlpha = 1;

  const radius = (p) => rx * (moons ? 0.2 + 0.8 * (p.a - 1) / (MOONS[3].a - 1) : 0.2 + 0.8 * (Math.log(p.a) - LMIN) / (LMAX - LMIN));

    const frozen = asking && p.k === 'Mars';
    const a = p.ph + (frozen ? 0 : (S.clock * 2 * Math.PI) / (secPer * p.T));
    return { p, x: cx + Math.cos(a) * radius(p), y: cy + Math.sin(a) * radius(p) * TILT };
  });

    c.save(); c.globalAlpha = 0.3; c.fillStyle = '#000'; c.beginPath(); c.ellipse(x + 1.5, y + p.s * 0.9, p.s * 0.9, p.s * 0.35, 0, 0, 6.3); c.fill(); c.restore();
    if (p.k === 'Saturn') { c.save(); c.strokeStyle = 'rgba(230,209,154,.8)'; c.lineWidth = 1.6; c.beginPath(); c.ellipse(x, y, p.s * 1.9, p.s * 0.6, -0.25, 0, 6.3); c.stroke(); c.restore(); }
    dot(c, x, y, p.s, p.col);
    if (asking && p.k === 'Mars') {
      c.save(); c.strokeStyle = '#fff'; c.lineWidth = 1.6; c.setLineDash([3, 3]); c.beginPath(); c.arc(x, y, p.s + 5 + Math.sin(S.clock * 4) * 1.2, 0, 6.3); c.stroke(); c.restore();
      tag(c, (T[lang].y.names.Mars) + ' ?', x, y - 16, '#fff');
    }
  };
  pos.filter((q) => q.y < cy).forEach(drawP);

  c.save(); const glow = c.createRadialGradient(cx, cy, 1, cx, cy, cr * 3.2); glow.addColorStop(0, moons ? 'rgba(217,160,102,.4)' : 'rgba(255,200,90,.55)'); glow.addColorStop(1, 'rgba(255,200,90,0)');
  c.fillStyle = glow; c.beginPath(); c.arc(cx, cy, cr * 3.2, 0, 6.3); c.fill(); c.restore();
  dot(c, cx, cy, cr, cc_);

  c.save(); c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.textAlign = 'left'; c.textBaseline = 'alphabetic';

  c.restore();
}
function drawYears(c, w, h) {

  const sys = wide ? { x: 6, y: 4, w: Math.round(w * 0.4) - 6, h: h - 8 } : { x: 6, y: 4, w: w - 12, h: clamp(h * 0.38, 104, 180) };
  const gb = wide ? { x: sys.x + sys.w + 8, y: 4, w: w - sys.w - 20, h: h - 8 } : { x: 6, y: sys.y + sys.h + 6, w: w - 12, h: h - sys.h - 16 };

  const G = mkFrame(gb, xr, yr, false), y = T[lang].y, ax = moons ? y.axM : y.ax;

  } else {

// --- one draw loop for all three views -----------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h; S.clock += dt;
  S.flip += clamp(S.flipT - S.flip, -dt / 1.3, dt / 1.3);
  S.Rv += (S.Rt - S.Rv) * Math.min(1, dt * 6);
  const v = lab.view;
  if (v === 'family') drawFamily(c, w, h, time); else if (v === 'roots') drawRoots(c, w, h, time); else drawYears(c, w, h);
  const f2 = $('f2'); if (v === 'roots' && Math.abs(+f2.value - S.flip) > 0.004) f2.value = S.flip;

// --- controls ------------------------------------------------------------------------------------------------

// --- render: controls, readout, state card and facts -------------------------------------------------------------

const verdictHTML = (ok, text, btn) => { const t = T[lang]; return `<div class="pc-v ${ok ? 'ok' : 'no'}"><b>${esc(ok ? t.right : t.wrong)}</b>${esc(text)}${btn ? `<div><button class="btn" data-act="${btn[0]}">${esc(btn[1])}</button></div>` : ''}</div>`; };
const secChip = (k, label, open) => `<button class="chip secret ${open ? 'open' : ''} ${(k === 'dbl' && S.dbl) || (k === 'moons' && S.moons && lab.view === 'years') ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? esc(label) : '🔒 ???'}</button>`;

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('s1').hidden = v !== 'family'; $('s2').hidden = v !== 'roots'; $('s3').hidden = v !== 'years';
  if (v === 'family') renderFamily(t); else if (v === 'roots') renderRoots(t); else renderYears(t);

function renderFamily(t) {

  }

  const pill = Math.abs(val - x) < 0.0005 ? f.pills[1] : val < x ? f.pills[0] : f.pills[2];
  lab.setReadout(num(val, 3), `${num(x)}${pw(n) || '^1'}`, pill, TEAL);
  const sh = n < 0.995 ? f.shLo : n < 1.005 ? f.shOne : f.shHi;
  if (S.dbl) {
    const fac = Math.pow(2, n);
    lab.setState({ emo: '✖️', title: f.dblT(num(fac, 2)), lead: f.dblL(n, num(fac, 2)), body: Math.abs(n - 2) < 0.006 ? f.dblSq : f.dblNo });
  } else {
    const ttl = Math.abs(x - 1) < 0.02 ? f.one : x < 1 ? f.low : f.high;
    lab.setState({ emo: '📈', title: ttl, lead: `${num(x)}${pw(n) || '^1'} = ${num(val, 3)}`, body: `${sh} ${f.common()}` });
  }
}

function renderRoots(t) {
  const r_ = t.r, st = S.st2, asking = st === 0 || st === 2, rev = st === 1 || st === 3, free = st === 4;
  lab.setGlow('rgba(255, 123, 156, .2)');
  $('a2').hidden = !asking; $('v2').hidden = !rev; $('c2').hidden = !free;
  lab.setFacts(t.facts.roots);
  const n = S.n2, c = S.c, root = Math.pow(c, 1 / n);
  if (asking) {
    const q = st === 0 ? r_.q1 : r_.q2;
    $('a2').innerHTML = askHTML(q, st === 0 ? r_.o1 : r_.o2);
    lab.setReadout('?', q, '', CORAL);
    lab.setState({ emo: '🤔', title: q, lead: r_.askL, body: '' });
    return;
  }
  const rs = num(root, 3), cs = num(c);
  if (rev) {
    const ok = st === 1 ? S.a2 === 1 : S.a2b === 2;
    $('v2').innerHTML = verdictHTML(ok, r_.reveal(n, cs, rs) + (ok ? '' : ' ' + r_.wrongNote), st === 1 ? ['next2', t.next] : ['go2', t.go]);
    lab.setReadout(rs, `${cs}${rootExp(n)}`, r_.pillB(n), CORAL);
    lab.setState({ emo: '🪞', title: r_.cardT(n, cs, rs), lead: r_.cardL(n, cs, rs), body: r_.cardB(n) });
    return;
  }
  // free exploring
  $('modeSeg').innerHTML = [['mirror', r_.modes[0]], ['neg', r_.modes[1]]].map(([m, l]) => `<button data-act="mode" data-m="${m}" class="${S.mode === m ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('l2n').textContent = r_.lN;
  $('n2chips').innerHTML = [2, 3, 4, 5].map((k) => `<button class="chip ${S.n2 === k ? 'on' : ''}" data-act="n2" data-v="${k}">${k}</button>`).join('');
  const neg = S.mode === 'neg';
  $('m2').hidden = neg; $('g2').hidden = !neg;
  if (!neg) {
    $('l2c').textContent = `${r_.lC}: ${cs}`; $('l2f').textContent = r_.lF;
    sync($('c2s'), c);
    const e = S.flip;
    lab.setReadout(rs, `${cs}${rootExp(n)}`, e < 0.02 ? r_.pillA(n) : e > 0.98 ? r_.pillB(n) : r_.pillM, CORAL);
    lab.setState({ emo: '🪞', title: r_.cardT(n, cs, rs), lead: r_.cardL(n, cs, rs), body: r_.cardB(n) });
  } else {
    const mx = Math.floor(Math.min(2, Math.pow(4.1, 1 / n)) * 20) / 20;
    $('s2s').min = -mx; $('s2s').max = mx;
    S.sx = clamp(S.sx, -mx, mx); sync($('s2s'), S.sx);
    $('l2s').textContent = `${r_.lS}: ${num(S.sx)}`;
    const ax = Math.abs(S.sx), even = n % 2 === 0, v = Math.pow(ax, n), axs = num(ax);
    lab.setReadout(num(even ? v : -v, 2), `(−${axs})${pw(n)}`, even ? r_.pillA(n) : r_.pillA(n), CORAL);
    if (ax < 0.05) lab.setState({ emo: '↔', title: even ? r_.evenT : r_.oddT, lead: r_.zero, body: '' });
    else lab.setState({ emo: '↔', title: even ? r_.evenT : r_.oddT, lead: even ? r_.evenL(n, axs, num(v, 2)) : r_.oddL(n, axs, num(v, 2)), body: '' });
  }
}

function renderYears(t) {
  const y = t.y, asking = S.p3 === null, open = secret.unlocked();
  lab.setGlow('rgba(224, 176, 80, .2)');
  $('a3').hidden = !asking; $('v3').hidden = asking; $('c3').hidden = asking;
  const { ds, hits, N, solved } = fitInfo(), moons = ds === MOONS;
  const facts = [...t.facts.years];
  if (solved && !moons) facts.push(t.facts.yearsDone);
  lab.setFacts(moons ? t.facts.moons : facts);
  if (asking) {
    $('a3').innerHTML = askHTML(y.q, y.opts);
    lab.setReadout('?', '', '', GOLD);
    lab.setState({ emo: '🤔', title: y.q, lead: y.askL, body: '', extra: table3(t, true) });
    return;
  }
  const mars = PLANETS[3], n = S.n3;
  $('v3').innerHTML = verdictHTML(S.p3 === 1, y.reveal(sig3(mars.T), num(mars.d, 0)) + (y.wrongs[S.p3] ? ' ' + y.wrongs[S.p3] : ''));
  $('l3n').textContent = `${y.lN}: ${num(n)}`; sync($('n3s'), n);
  $('sec3').innerHTML = (moons ? '' : `<button class="chip ${S.zoom ? 'on' : ''}" data-act="zoom">${esc(S.zoom ? y.all : y.zoom)}</button>`) + secChip('moons', `🪐 ${t.secrets.moons[0]}`, open);
  lab.setReadout(num(n), `T = a${pw(n) || '^1'}`, y.pill(hits, N), solved ? GREEN : GOLD);
  const far = ds[ds.length - 1], low = Math.pow(far.a, n) < far.T;
  if (solved) lab.setState({ emo: '✅', title: moons ? y.mSolvedT : y.solvedT, lead: moons ? y.mSolvedL : y.solvedL, body: moons ? y.mNote : y.solvedB, extra: table3(t, false) });
  else lab.setState({ emo: moons ? '🌙' : '🪐', title: moons ? y.mFitT : y.fitT, lead: y.fitL(n, hits, N), body: `${low ? y.below : y.above}${moons ? ' ' + y.mNote : ''}`, extra: table3(t, false) });
}
function table3(t, asking) {
  const y = t.y, ds = ds3(), moons = ds === MOONS, th = moons ? y.thM : y.th, n = S.n3;
  const rows = ds.map((p) => {
    const hide = asking && p.k === 'Mars';
    return `<tr><td><span class="pc-dot" style="background:${p.col}"></span>${esc(y.names[p.k])}</td><td class="n">${sig3(p.a)}</td><td class="n">${hide ? '?' : sig3(p.T)}</td>${asking ? '' : `<td class="n">${sig3(Math.pow(p.a, n))}</td>`}</tr>`;
  }).join('');
  return `<table class="pc-tab"><tr><th>${esc(th[0])}</th><th>${esc(th[1])}</th><th>${esc(th[2])}</th>${asking ? '' : `<th>a${esc(pw(n) || '^1')}</th>`}</tr>${rows}</table>`;
}
render();
</script>
</body>
</html>
