  // axis
  c.strokeStyle = '#6b5a3c'; c.lineWidth = 2; c.beginPath(); c.moveTo(HX(300), AY); c.lineTo(HX(1500), AY); c.stroke();
  for (let y = 300; y <= 1500; y += 100) { c.beginPath(); c.moveTo(HX(y), AY - (y % 300 === 0 ? 6 : 3)); c.lineTo(HX(y), AY + (y % 300 === 0 ? 6 : 3)); c.stroke(); }
  for (const y of [300, 600, 900, 1200, 1500]) pill(c, String(y), clamp(HX(y), 22, 338), AY + 22, 'c', { bg: 'rgba(60,44,24,.82)' });
  // East bar (grows after the prediction); a dashed "?" while it is open
  if (hs.mode === 'ask') {
    c.strokeStyle = rgba(COL.east, 0.45); c.lineWidth = 3; c.setLineDash([5, 6]); c.lineDashOffset = -time * 10; c.beginPath(); c.moveTo(HX(476) + 8, EY); c.lineTo(HX(1500), EY); c.stroke(); c.setLineDash([]);
    pill(c, '?', HX(476) + 38, EY, 'c', { fg: '#fff', bg: rgba(COL.east, 0.9), fs: FS() * 1.15 });
  }
  drawBar(c, HX(east), EY, COL.east, false);
  drawBar(c, HX(476), WY, COL.west, true);
  // the broken end of the West bar: cracks and falling stones
  c.strokeStyle = 'rgba(40,10,8,.7)'; c.lineWidth = 1.3; c.beginPath(); c.moveTo(HX(476) - 14, WY - 11); c.lineTo(HX(476) - 9, WY - 3); c.lineTo(HX(476) - 15, WY + 4); c.lineTo(HX(476) - 10, WY + 11); c.stroke();
  for (const [dx, dy, k] of [[5, 8, 0], [10, 18, 1], [2, 25, 2]]) { const fy = (time * 22 + k * 11) % 30; c.fillStyle = rgba(COL.west, 1 - fy / 30); c.beginPath(); c.rect(HX(476) + dx, WY + 10 + (dy % 6) + fy * 0.8, 4, 4); c.fill(); }
  pill(c, t.west, HX(476) + 16, WY, 'l', { bg: rgba(COL.west, 0.92), stroke: 'rgba(255,255,255,.35)' });
  pill(c, t.east, HX(560), EY - 25, 'l', { bg: rgba(COL.east, 0.92), stroke: 'rgba(255,255,255,.35)' });
  // dome and the city at the east end
  const da = eBack(clamp01((east - 1380) / 73));
  if (da > 0.01) {
    drawDome(c, HX(1453) - 12, EY - 11, da);
    pill(c, t.cities.con, 352, EY + 25, 'r', { a: clamp01(da) });
  }
  // marker and cards
  const mxp = HX(mk);
  let key = 0; if (Math.abs(mk - 476) <= 14) key = 476; else if (Math.abs(mk - 1453) <= 14 && east >= 1450) key = 1453;
  if (key !== hs.cardKey) { hs.cardKey = key; hs.cardT = time; }
  c.strokeStyle = 'rgba(40,28,14,.75)'; c.lineWidth = 1.6; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(mxp, key ? 58 : 60); c.lineTo(mxp, AY); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#fff'; c.strokeStyle = '#2a1a12'; c.lineWidth = 2; c.beginPath(); c.arc(mxp, AY, 7.5, 0, 7); c.fill(); c.stroke();
  if (key) {
    const u = eBack((time - hs.cardT) / 0.4), line2 = key === 476 ? t.events[476] : t.cities.con, fs = FS();
    c.font = `800 ${fs * 1.3}px Nunito, sans-serif`; const w1 = c.measureText(String(key)).width;
    c.font = `700 ${fs}px Nunito, sans-serif`; const w2 = c.measureText(line2).width;
    const cw = Math.max(w1, w2) + 22, ch = fs * 3.1, cx = clamp(mxp, cw / 2 + 6, 354 - cw / 2), cy = 24 + ch / 2;
    c.save(); c.translate(cx, cy); c.scale(u, u); c.translate(-cx, -cy);
    rr(c, cx - cw / 2, cy - ch / 2, cw, ch, 12); c.fillStyle = 'rgba(10,12,20,.88)'; c.fill(); c.strokeStyle = key === 476 ? COL.west : '#9b59b6'; c.lineWidth = 1.6; c.stroke();
    c.fillStyle = key === 476 ? '#ff8a7c' : '#d7a8ec'; c.font = `800 ${fs * 1.3}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(key), cx, cy - fs * 0.62);
    c.fillStyle = '#fff'; c.font = `700 ${fs}px Nunito, sans-serif`; c.fillText(line2, cx, cy + fs * 0.78);
    c.restore();
  }
  c.restore();
}

// --- loop ----------------------------------------------------------------------------------------------------
function stepMap(time) {
  const m = S.map;
  if (m.mode !== 'play') return;
  const LEAD = 0.6, MOVE = 0.75, PAUSE = 0.8, tt = time - m.t0 - LEAD;
  if (tt < 0) { m.pos = 1; m.idx = 1; }
  else {
    const k = Math.floor(tt / (MOVE + PAUSE));
    if (k >= 5) { m.pos = 6; m.idx = 6; m.mode = 'done'; render(); }
    else { const u = tt - k * (MOVE + PAUSE); m.pos = 1 + k + (u < MOVE ? eIO(u / MOVE) : 1); m.idx = u >= MOVE ? 2 + k : 1 + k; }
  }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'map') {
    stepMap(time);
    const m = S.map;
    if (m.idx !== m.last) { m.last = m.idx; m.bt = time; if (m.mode === 'play') sfx.snap(); render(); }
    const el = $('rfYear'); if (+el.value !== m.pos) el.value = m.pos;
    drawMap(c, w, h, dt, time);
  } else if (v === 'pillar') drawPillar(c, w, h, dt, time);
  else {
    const hs = S.hal;
    if (hs.mode === 'play') {
      const u = (now() - hs.t0 - 0.4) / 3.8;
      hs.east = lerp(476, 1453, eIO(u)); hs.marker = hs.east;
      if (u >= 1) { hs.mode = 'done'; hs.east = 1453; hs.marker = 1453; render(); }
    }
    const el = $('rfMark'); if (+el.value !== hs.marker) el.value = hs.marker;
    drawHalves(c, w, h, dt, time);
  }
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(k, i) {
  const st = S[k]; if (st.ans !== null) return;
  st.ans = i; st.mode = 'play'; (i === RIGHT[k] ? sfx.good : sfx.bad)();
  if (k === 'map') S.map.t0 = now();
  else if (k === 'hal') S.hal.t0 = now();
  else {
    [700, 1900, 3100, 4300].forEach((ms, j) => setTimeout(() => { S.pil.on[j] = true; if (lab.view === 'pillar') sfx.click(); render(); }, ms));
    setTimeout(() => { S.pil.mode = 'done'; render(); }, 6200);
  }
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const o = ev.target.closest('.rf-opt');
  if (o && !o.disabled) return answer(o.dataset.k, +o.dataset.i);
  const tg = ev.target.closest('.rf-tg');
  if (tg && !tg.disabled) { const i = +tg.dataset.i; S.pil.on[i] = !S.pil.on[i]; sfx.click(); render(); return; }
  const sc = ev.target.closest('[data-act=sec]');
  if (sc) {
    if (!secret.unlocked()) return secret.open();
    const goMap = lab.view !== 'map';
    if (goMap) $('views').querySelector('[data-view=map]')?.click(); // the tab's own click; it clears S.sec, so set it after
    if (S.map.mode !== 'done') return;
    S.sec = S.sec === sc.dataset.k && !goMap ? null : sc.dataset.k; S.secT = now(); sfx.click();
    if (S.sec === 'a' && S.map.idx < 6) { S.map.idx = 6; S.map.pos = 6; }
    render();
  }
});
$('rfYear').addEventListener('input', (ev) => {
  const m = S.map; if (m.mode !== 'done') return;
  m.idx = clamp(Math.round(+ev.target.value), 0, 7); m.pos = m.idx; ev.target.value = m.idx; sfx.tick(); render();
});
$('rfMark').addEventListener('input', (ev) => {
  const hs = S.hal; if (hs.mode !== 'done') return;
  let v = +ev.target.value;
  for (const p of [476, 1453]) if (Math.abs(v - p) <= 16) { v = p; if (hs.marker !== p) sfx.snap(); }
  hs.marker = v; render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------------
function askHtml(k, q, opts, right, okTxt, badTxt) {
  const st = S[k], ans = st.ans;
  const chips = opts.map((o, i) => {
    const cls = ans === null ? '' : i === RIGHT[k] ? ' rf-good' : i === ans ? ' rf-bad' : '';
    return `<button type="button" class="rf-opt${cls}" data-k="${k}" data-i="${i}"${ans !== null ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  const verdict = ans === null ? '' : `<p class="rf-verdict ${ans === RIGHT[k] ? 'rf-good' : 'rf-bad'}">${esc(ans === RIGHT[k] ? okTxt : badTxt)}</p>`;
  return `<div class="rf-q">${esc(q)}</div><div class="rf-opts">${chips}</div>${verdict}`;
}
function render() {
  const t = T[lang], v = lab.view, st = S[VK[v]], asking = st.mode === 'ask';
  $('rfMap').style.display = v === 'map' ? '' : 'none';
  $('rfPillar').style.display = v === 'pillar' ? '' : 'none';
  $('rfHalves').style.display = v === 'halves' ? '' : 'none';
  if (v === 'map') renderMap(t); else if (v === 'pillar') renderPillar(t); else renderHalves(t);
  // the facts and the explaining card wait until the prediction is answered
  lab.setFacts(asking ? [] : t.facts[v]);
  const secs = $('rfSec'), open = secret.unlocked();
  secs.style.display = st.mode === 'done' ? '' : 'none';
  secs.innerHTML = st.mode === 'done' ? [['a', '👦'], ['b', '🧱']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k && v === 'map' ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('') : '';
  lab.checkStage();
}
function setCard(t, v, asking) {
  if (asking) lab.setState({ emo: '🤔', title: t[{ map: 'mapAsk', pillar: 'pillarAsk', halves: 'halvesAsk' }[v]], lead: '', body: '', extra: '' });
  else { const s = t.st[v]; lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' }); }
}
function renderMap(t) {
  const m = S.map, yr = STOPS[m.idx], asking = m.mode === 'ask';
  lab.setGlow('rgba(43, 108, 158, .3)');
  $('rfAskMap').innerHTML = askHtml('map', t.mapAsk, t.mapOpts, 1, t.mapRight, t.mapWrong);
  const sl = $('rfYear'); sl.disabled = m.mode !== 'done'; sl.setAttribute('aria-label', t.year);
  $('rfTicks').innerHTML = STOPS.map((y, i) => `<span class="${i === m.idx ? 'on' : ''}">${y}</span>`).join('');
  const w = ENT.filter((e) => e.own(yr) === 'west').length, e = ENT.filter((x) => x.own(yr) === 'east').length;
  const ev = evOf(yr);
  lab.setReadout(String(yr), yr < 395 ? t.owners.rome : t.counts(w, e), t.events[ev], '#2b6c9e');
  const seen = [...new Set(ENT.map((x) => x.own(yr)).filter(Boolean))];
  $('rfLeg').innerHTML = seen.map((o) => `<span><i style="background:${o === 'contested' ? `repeating-linear-gradient(135deg, ${COL.west} 0 3px, ${COL.visi} 3px 6px)` : COL[o]}"></i>${esc(t.owners[o])}</span>`).join('');
  if (S.sec === 'a') lab.setState({ emo: '👦', title: t.secrets.a[0], lead: t.boyText, body: '', extra: '' });
  else if (S.sec === 'b') lab.setState({ emo: '🧱', title: t.secrets.b[0], lead: t.wallText, body: '', extra: '' });
  else setCard(t, 'map', asking);
}
function renderPillar(t) {
  const p = S.pil, n = p.on.filter(Boolean).length, asking = p.mode === 'ask';
  lab.setGlow('rgba(192, 57, 43, .22)');
  $('rfAskPil').innerHTML = askHtml('pil', t.pillarAsk, t.pillarOpts, 0, t.pillarRight, t.pillarWrong);
  const emo = ['🏹', '👑', '🪙', '🗺️'], keys = ['borders', 'rulers', 'money', 'size'];
  $('rfTgs').innerHTML = keys.map((k, i) => `<button type="button" class="rf-tg ${p.on[i] ? 'on' : ''}" data-i="${i}"${p.mode !== 'done' ? ' disabled' : ''} aria-pressed="${p.on[i]}"><span class="e">${emo[i]}</span><span>${esc(t.problems[k])}</span></button>`).join('');
  lab.setReadout(esc(t.nProb(n)), '', n === 4 ? t.fallen : n === 0 ? t.standing : t.cracking, '#b23a2e');
  setCard(t, 'pillar', asking);
}
function renderHalves(t) {
  const hs = S.hal, asking = hs.mode === 'ask';
  lab.setGlow('rgba(108, 52, 131, .3)');
  $('rfAskHal').innerHTML = askHtml('hal', t.halvesAsk, t.halvesOpts, 2, t.halvesRight, t.halvesWrong);
  const sl = $('rfMark'); sl.disabled = hs.mode !== 'done'; sl.setAttribute('aria-label', t.year);
  if (asking) lab.setReadout('?', '', '', '#6c3483');
  else lab.setReadout(esc(t.eastSpan), '', t.years(1453 - 395), '#6c3483');
  setCard(t, 'halves', asking);
}
render();
</script>
