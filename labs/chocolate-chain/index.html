    if (J.st < NS - 1) { J.from = J.tok; J.st++; J.to = J.st; J.t0 = now(); sfx.click(); } else { J.phase = 'ask'; sfx.click(); }
  } else if (d.pred !== undefined) {
    J.pred = +d.pred; J.phase = 'play'; J.w.fill(true); J.w[3] = false; J.manual = false; (J.pred === 0 ? sfx.good : sfx.bad)(); startRun(); showStage();
  } else if (d.sw !== undefined) {
    if (J.run) return;
    const i = +d.sw; J.w[i] = !J.w[i]; J.manual = true; J.stock.fill(INIT); J.out.fill(0); J.wk = 0; sfx.snap();
  } else if (id === 'bRun') { if (J.run) return; sfx.push(); startRun(); showStage(); return; }
  else if (id === 'bReset') { resetJourney(); sfx.click(); }
  else if (id === 'bCut') { P.cut = !P.cut; sfx.snap(); if (P.cut) showStage(); }
  else if (d.fp !== undefined) { F.pred = +d.fp; F.mode = 'flat'; F.play = false; F.anim = { from: F.price, to: 1500, t0: now(), dur: 1.4 }; (F.pred === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (id === 'bPlay') { F.pred === null || (F.mode = 'series', F.head = 0, F.play = true, F.anim = null, sfx.click(), showStage()); }
  else if (d.sec !== undefined) {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === d.sec ? null : d.sec; S.secT0 = now(); sfx.click(); if (S.sec) showStage();
  } else if (id === 'bAgain') { S.secT0 = now(); sfx.click(); }
  render();
});
$('gSlider').addEventListener('input', (ev) => { P.guess = +ev.target.value; sfx.tick(); render(); });
$('pSlider').addEventListener('input', (ev) => { setPrice(+ev.target.value, true); updateFairReadout(); });
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'journey' || J.phase !== 'play' || J.run) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const i = J.hit.findIndex((p) => Math.hypot(p.x - x, p.y - y) <= p.r + 6);
  if (i < 0) return;
  J.w[i] = !J.w[i]; J.manual = true; J.stock.fill(INIT); J.out.fill(0); J.wk = 0; sfx.snap(); render();
});

// --- one render per change ---------------------------------------------------------------------------------------
function updateFairReadout() {
  const t = T[lang];
  lab.setReadout(F.pred === null ? '?' : `${fmt(ftOf(F.price))} $`, t.perTonne, t.worldLine(fmt(F.price)), '#e2b552');
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  show($('cc1'), v === 'journey' && !sec); show($('cc2'), v === 'price' && !sec); show($('cc3'), v === 'fair' && !sec);
  const open = secret.unlocked();
  $('secChips').innerHTML = ['a', 'b'].map((k) => `<button class="chip secret cc-c ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${k === 'a' ? '🫘' : '🌍'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  show($('bAgain'), sec === 'a', 'inline-flex'); $('bAgain').textContent = `↻ ${t.again}`;
  if (sec) {
    lab.setGlow(sec === 'a' ? 'rgba(190,120,60,.3)' : 'rgba(60,130,190,.3)');
    lab.setReadout(esc(t.sc[sec].val), t.sc[sec].sub, '', '#e2b552');
    lab.setState({ emo: sec === 'a' ? '🫘' : '🌍', title: t.secrets[sec][0], lead: t.secrets[sec][1], body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  if (v === 'journey') renderJourney(t); else if (v === 'price') renderPrice(t); else renderFair(t);
}
function renderJourney(t) {
  const ph = J.phase, ask = $('c1ask');
  lab.setGlow('rgba(214,150,80,.26)');
  lab.setReadout(`${J.w.filter(Boolean).length} / ${NS}`, t.linksWorking, '', '#e2b552');
  lab.setFacts(t.facts.journey);
  if (ph === 'ask') ask.innerHTML = `<div class="cc-q">${esc(t.qShip)}</div><div class="chips">${J.order.map((k) => `<button class="chip cc-c" data-pred="${k}">${esc(t.optsShip[k])}</button>`).join('')}</div>`;
  else if (ph === 'play' && J.pred !== null) ask.innerHTML = `<div class="cc-v ${J.pred === 0 ? 'ok' : 'no'}"><b>${esc(J.pred === 0 ? t.right : t.notQuite)}</b>${esc(t.shipWhy)}</div>`;
  else ask.innerHTML = '';
  show(ask, ask.innerHTML !== '');
  show($('c1sw'), ph === 'play', 'grid');
  $('c1sw').innerHTML = ph === 'play' ? t.stations.map((n, i) => `<button class="cc-swb ${J.w[i] ? '' : 'off'}" data-sw="${i}"${J.run ? ' disabled' : ''} style="opacity:${J.run ? 0.55 : 1}">${EMO[i]} ${esc(n)}<em>${esc(J.w[i] ? t.linkOk : t.linkBroken)}</em></button>`).join('') : '';
  show($('bNext'), ph === 'walk', 'inline-flex'); $('bNext').textContent = `${t.next} →`;
  show($('bRun'), ph === 'play', 'inline-flex'); $('bRun').textContent = t.run4; $('bRun').disabled = J.run; $('bRun').style.opacity = J.run ? 0.4 : 1;
  show($('bReset'), ph !== 'walk' || J.st > 0, 'inline-flex'); $('bReset').textContent = t.reset;
  if (ph === 'walk') lab.setState({ emo: EMO[J.st], title: `${J.st + 1}. ${t.stations[J.st]}`, lead: t.captions[J.st], body: '', extra: '' });
  else if (ph === 'ask') lab.setState({ emo: '❓', title: t.qShip, lead: '', body: '', extra: '' });
  else lab.setState({ emo: t.state.journey.emo, title: t.state.journey.title, lead: t.state.journey.lead, body: t.state.journey.body, extra: '' });
}
function renderPrice(t) {
  lab.setGlow('rgba(170,105,60,.28)');
  const st = t.state.price;
  $('c2lbl').textContent = t.guessFarmer; $('gSlider').value = P.guess; show($('c2slide'), !P.cut);
  $('bCut').textContent = P.cut ? t.reset : t.cut; $('bCut').className = `btn cc-b${P.cut ? ' ghost' : ''}`;
  if (!P.cut) {
    lab.setReadout(esc(t.of100(P.guess)), t.yourGuess, '', '#e2b552');
    lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: t.guessFirst, extra: '' }); lab.setFacts([]);
  } else {
    lab.setReadout(esc(t.of100(GRP.farmer.n)), t.squaresFarmer, '', '#e2b552');
    lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body, extra: esc(t.guessLine(P.guess, GRP.farmer.n)) }); lab.setFacts(t.facts.price);
  }
}
function renderFair(t) {
  lab.setGlow('rgba(150,110,210,.26)');
  const st = t.state.fair, ask = $('c3ask'), pre = F.pred === null;
  if (pre) ask.innerHTML = `<div class="cc-q">${esc(t.qFair)}</div><div class="chips">${F.order.map((k) => `<button class="chip cc-c" data-fp="${k}">${esc(t.optsFair[k])}</button>`).join('')}</div>`;
  else ask.innerHTML = `<div class="cc-v ${F.pred === 0 ? 'ok' : 'no'}"><b>${esc(F.pred === 0 ? t.right : t.notQuite)}</b>${esc(t.fairWhy)}</div>`;
  show(ask, true);
  $('c3lbl').textContent = t.worldPrice; $('pLo').textContent = `${fmt(1000)} $`; $('pHi').textContent = `${fmt(4000)} $`;
  if (+$('pSlider').value !== F.price) $('pSlider').value = F.price;
  show($('bPlay').parentElement, !pre, 'flex'); $('bPlay').textContent = t.play10; $('bPlay').disabled = F.play; $('bPlay').style.opacity = F.play ? 0.4 : 1;
  updateFairReadout();
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: pre ? t.predictFirst : st.body, extra: '' });
  lab.setFacts(pre ? [] : t.facts.fair);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  step(dt);
  if (S.sec === 'a') drawBeans(c, w, h, now());
  else if (S.sec === 'b') drawMap(c, w, h, time);
  else if (lab.view === 'journey') drawJourney(c, w, h, time);
  else if (lab.view === 'price') drawPrice(c, w, h, time);
  else drawFair(c, w, h, time);
});
render();
</script>
</body>
</html>
