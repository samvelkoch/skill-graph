  const P0 = { x: Math.min(P1.x - dir.x * L, w - rr_ - 12), y: 0 }; P0.y = P1.y + (P0.x - P1.x) * (dir.y / dir.x);
  if (open01 < 0.98) {
    c.save(); c.globalAlpha = 1 - open01;
    rr(c, P0.x - 3, P0.y + 4, 7, BASE - P0.y - 2, 3); c.fillStyle = '#a97545'; c.fill(); c.lineWidth = 1.2; c.strokeStyle = '#6e4725'; c.stroke();
    c.lineCap = 'round'; c.lineWidth = 11; c.strokeStyle = '#6e4725'; c.beginPath(); c.moveTo(P0.x + 6, P0.y); c.lineTo(P1.x, P1.y); c.stroke();
    c.lineWidth = 8; c.strokeStyle = '#c99259'; c.beginPath(); c.moveTo(P0.x + 6, P0.y); c.lineTo(P1.x, P1.y); c.stroke();
    c.restore();
  }
  // floor shadow and body
  c.save(); c.translate(bx + bw / 2, BASE + 5); c.scale(1, 0.12);
  let g = c.createRadialGradient(0, 0, 0, 0, 0, bw * 0.7); g.addColorStop(0, 'rgba(70,35,10,.5)'); g.addColorStop(1, 'rgba(70,35,10,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, bw * 0.7, 0, Math.PI * 2); c.fill(); c.restore();
  g = c.createLinearGradient(bx, T0, bx + bw, BASE); g.addColorStop(0, '#f0736a'); g.addColorStop(1, '#bd3a47');
  rr(c, bx, T0, bw, bh, 9); c.fillStyle = g; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#7d2230'; c.stroke();
  rr(c, bx + bw * 0.06, T0 + 6, bw * 0.08, bh - 18, bw * 0.04); c.fillStyle = 'rgba(255,255,255,.16)'; c.fill();
  g = c.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, '#fbd25c'); g.addColorStop(1, '#d9a021');
  c.fillStyle = g; c.fillRect(bx + bw / 2 - bw * 0.08, T0, bw * 0.16, bh); c.lineWidth = 1; c.strokeStyle = '#a87613'; c.strokeRect(bx + bw / 2 - bw * 0.08, T0, bw * 0.16, bh);
  if (open01 > 0.02) { // the dark opening
    const og = c.createLinearGradient(0, T0 - bh * 0.1, 0, T0 + bh * 0.1); og.addColorStop(0, '#3f1420'); og.addColorStop(1, '#6a2230');
    ov(c, bx + bw / 2, T0, bw * 0.47, bh * 0.1 * open01, 0, og, '#7d2230', 1.5);
  }
  // the lid: a quad that swings up and back
  const cl = [[lx, T0], [lx + lw, T0], [lx + lw, T0 - lh], [lx, T0 - lh]];
  const op = [[lx + lw * 0.03, T0 - lh * 0.55], [lx + lw * 0.97, T0 - lh * 0.55], [lx + lw * 0.9, T0 - lh * 2.7], [lx + lw * 0.1, T0 - lh * 2.7]];
  const q = cl.map((p, i) => [lerp(p[0], op[i][0], clamp(o, 0, 1.08)), lerp(p[1], op[i][1], clamp(o, 0, 1.08))]);
  const fa = 1 - c01(open01 * 3);
  if (fa > 0.01) { // top face with the slot
    c.save(); c.globalAlpha = fa; c.beginPath(); c.moveTo(q[3][0] + lt, q[3][1] - lt); c.lineTo(q[2][0] - lt, q[2][1] - lt); c.lineTo(q[2][0], q[2][1]); c.lineTo(q[3][0], q[3][1]); c.closePath();
    c.fillStyle = '#f9a094'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#7d2230'; c.stroke(); c.restore();
  }
  c.save(); c.beginPath(); q.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.closePath();
  const under = sm((open01 - 0.35) / 0.3);
  g = c.createLinearGradient(0, q[3][1], 0, q[0][1]); g.addColorStop(0, mix('#f58a7e', '#fbc2b8', under)); g.addColorStop(1, mix('#d94c55', '#f19a8d', under));
  c.fillStyle = g; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#7d2230'; c.stroke(); c.clip();
  c.fillStyle = '#e8b030'; c.fillRect(lx + lw / 2 - bw * 0.08, T0 - 3 * lh, bw * 0.16, 4 * lh); c.restore();
  if (fa > 0.01) {
    c.save(); c.globalAlpha = fa;
    ov(c, sx, sy, lw * 0.075, lt * 0.3, 0, '#2a0f18', '#7d2230', 1);
    const bxm = lx + lw / 2, byy = T0 - lh - lt * 0.7;
    ov(c, bxm - bw * 0.07, byy - 3, bw * 0.075, bw * 0.045, -0.5, '#f7c948', '#a87613'); ov(c, bxm + bw * 0.07, byy - 3, bw * 0.075, bw * 0.045, 0.5, '#f7c948', '#a87613');
    ov(c, bxm, byy, bw * 0.03, bw * 0.03, 0, '#e8b030', '#a87613'); c.restore();
  }
  // the ball on the chute, rolling, then falling into the slot
  if (ph === 'ready' || ph === 'roll') {
    const e = ph === 'roll' ? now_ - B.rollT : 0;
    const s = ph === 'roll' ? Math.pow(c01(e / 0.85), 1.6) : 0, wob = ph === 'ready' ? Math.sin(now_ * 3) * 0.04 : 0;
    let bxp = lerp(P0.x + 6, P1.x, s) + nrm.x * rr_, byp = lerp(P0.y, P1.y, s) + nrm.y * rr_;
    c.save();
    if (e > 0.85) { bxp = sx; byp = P1.y + nrm.y * rr_ + Math.pow(c01((e - 0.85) / 0.3), 2) * rr_ * 3.6; c.beginPath(); c.rect(0, 0, w, sy); c.clip(); }
    if (e < 1.2) ball(c, bxp, byp, rr_, BALL_COL, null, -(L * s) / rr_ + wob);
    c.restore();
  }
  // balls line up above the box
  if (ph === 'revealed' || ph === 'closing') {
    const N = B.n + 1, rb = Math.min(17, w * 0.92 / N / 2), step = Math.min(2 * rb + 6, (w * 0.94 - 2 * rb) / Math.max(1, N - 1));
    const x0 = w / 2 - step * (N - 1) / 2, rowY = Math.max(rb + 42, T0 - lh * 2.7 - rb - 16);
    const fade = ph === 'closing' ? 1 - c01((now_ - B.closeT) / 0.3) : 1;
    const tb = (i) => B.openT + 0.3 + i * 0.07;
    const sh = c01((now_ - tb(N - 1)) / 0.6) * fade;
    if (sh > 0.01) {
      c.save(); c.globalAlpha = sh; rr(c, x0 - rb - 8, rowY + rb + 4, step * (N - 1) + 2 * rb + 16, 8, 4);
      c.fillStyle = '#b98650'; c.fill(); c.lineWidth = 1.2; c.strokeStyle = '#6e4725'; c.stroke(); c.restore();
    }
    for (let i = 0; i < N; i++) {
      const p = (now_ - tb(i)) / 0.6; if (p < 0) continue;
      const k = easeOut(p), nw = i === N - 1, px = lerp(bx + bw / 2, x0 + i * step, k), py = lerp(T0 - 2, rowY, k) - Math.sin(Math.PI * c01(p)) * 38;
      const r = rb * (0.5 + 0.5 * easeBack(p));
      if (nw) {
        const since = now_ - (tb(i) + 0.6);
        if (since > -0.1 && since < 3.2) {
          const s2 = (1 - Math.max(0, since) / 3.2) * (0.65 + 0.35 * Math.sin(Math.max(0, since) * 9)), gg = c.createRadialGradient(px, py, 1, px, py, rb * 2.2);
          gg.addColorStop(0, `rgba(255,243,150,${0.9 * s2 * fade})`); gg.addColorStop(1, 'rgba(255,243,150,0)'); c.fillStyle = gg; c.fillRect(px - rb * 2.3, py - rb * 2.3, rb * 4.6, rb * 4.6);
        }
      }
      ball(c, px, py, r, nw ? GOLD : BALL_COL, String(i + 1), 0, fade);
      if (nw) {
        const u = (now_ - (tb(i) + 0.6)) / 1.5;
        if (u >= 0 && u <= 1 && fade > 0.5) tag(c, '+1', px, py - rb - 18 - easeOut(u) * 10, 15, '#3b2a00', 'rgba(255,214,90,.97)', u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3, easeBack(u * 4));
      }
    }
  }
}

// --- controls ------------------------------------------------------------------------------------------------
const lab = shell({ key: 'staircase', T, topics: TOPICS, views: ['up', 'box', 'down'], onLang: render, onView: () => { if (lab.view === 'down' && !D.touched) resetDown(); render(); } });
const secret = secretLab('staircase', () => ({
  secrets: [{ emo: '🏔️', title: T[lang].secrets.giant[0], desc: T[lang].secrets.giant[1] }, { emo: '✌️', title: T[lang].secrets.two[0], desc: T[lang].secrets.two[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <button class="btn sc-big" id="scMain" data-act="main"></button>
  <div class="row2" id="scSec"><div class="chips" id="scChips"></div></div>`;
const askEl = Object.assign(document.createElement('div'), { id: 'sc-ask' });
$('overlay').append(askEl);

resetUp('one'); resetDown();

// --- the canvas loop -------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, t) => {
  VW = w; VH = h; BASE = h - Math.min(140, h * 0.33);
  room(c, w, h);
  const v = lab.view;
  if (v === 'up') {
    const len = U.towers.length, cols = len + (len < U.max ? 1 : 0), top = topH(U) + (len < U.max ? U.d : 0);
    camTo(w, cols, top + 1.9, dt); stairs(c, U, t);
    if (U.phase === 'ask') cloud(c, cam.x0 + (len + 0.5) * cam.cs, BASE - (len * U.d / 2 + 1.1) * cam.cs, Math.max(cam.cs * 2.6, 84), t, (t - U.askT) / 0.45);
  } else if (v === 'down') {
    camTo(w, D.towers.length, D.n + 1.9, dt); stairs(c, D, t);
  } else drawBox(c, w, h, t);
});


const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.dataset.act === 'main') {
    const v = lab.view;
    if (v === 'up') upMain(); else if (v === 'box') boxMain(); else downMain();
  } else if (b.dataset.act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; resetUp(U.mode === k ? 'one' : k); sfx.click();
  }
  render();
});
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('.sc-opt'); if (!b || b.disabled) return;
  const v = +b.dataset.v, w_ = lab.view;
  if (w_ === 'up') upAnswer(v); else if (w_ === 'box') boxAnswer(v); else downAnswer(v);
  render(); showStage();
});

// --- one render per change: controls, panel, readout and the state card -------------------------------------------
function panel(t, q, opts, pick, right, note, ok) {
  if (!q && pick === null) { askEl.style.display = 'none'; askEl.innerHTML = ''; return; }
  const rev = pick !== null;
  const head = rev ? `<div class="sc-q"><b class="${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.wrong)}</b> ${esc(note)}</div>` : `<div class="sc-q">${esc(q)}</div>`;
  const btns = opts.map((v) => `<button class="sc-opt ${rev ? (v === right ? 'good' : v === pick ? 'bad' : 'dim') : ''}" data-v="${v}"${rev ? ' disabled' : ''}>${v}</button>`).join('');
  askEl.innerHTML = `${head}<div class="sc-opts">${btns}</div>`; askEl.style.display = '';
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('scSec').style.display = v === 'up' ? '' : 'none';
  const main = $('scMain');
  let st;
  if (v === 'up') {
    const n = topH(U), full = U.towers.length >= U.max, unl = secret.unlocked();
    lab.setGlow('rgba(242, 181, 46, .22)');
    const sc = (k, emo) => `<button class="chip secret ${unl ? 'open' : ''} ${U.mode === k ? 'on' : ''}" data-act="sec" data-k="${k}">${unl ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    $('scChips').innerHTML = sc('giant', '🏔️') + sc('two', '✌️');
    main.textContent = full && U.phase === 'idle' ? t.again : t.add; main.disabled = U.phase !== 'idle';
    if (U.phase === 'ask') panel(t, t.ask, U.opts, null, U.right, '', false);
    else if (U.last) panel(t, '', U.opts, U.pick, U.right, t.more(U.last.n, U.d), U.last.ok);
    else panel(t, null, [], null);
    if (U.phase === 'ask') st = { emo: '🤔', title: t.ask, lead: t.askLead, body: '' };
    else if (U.last) st = { emo: U.last.ok ? '✅' : '🤔', title: U.last.ok ? t.right : t.wrong, lead: t.more(U.last.n, U.d), body: t.revBody };
    else st = { emo: '🧱', title: t.idle0[0], lead: t.idle0[1], body: '' };
    if (U.phase === 'idle' && full && U.last) st = { emo: '🏆', title: t.doneT, lead: t.doneL(U.d), body: '' };
    if (U.mode === 'giant' && U.phase !== 'ask') st.body = [st.body, t.giantNote].filter(Boolean).join(' ');
    lab.setReadout(n, t.upSub(n, U.d), '', RB[(U.towers.length - 1 + 10) % 10]);
    lab.setFacts(t.facts.up);
  } else if (v === 'box') {
    const ph = B.phase, rev = ph === 'revealed' || ph === 'closing', last = B.r === ROUNDS.length - 1;
    lab.setGlow('rgba(229, 100, 95, .22)');
    main.textContent = rev ? (last ? t.again : t.next) : t.putIn;
    main.disabled = !(ph === 'ready' || ph === 'revealed') || now() < B.busy;
    if (ph === 'ask') panel(t, t.boxAsk, B.opts, null, B.right, '', false);
    else if (rev) panel(t, '', B.opts, B.pick, B.right, t.boxRev(B.n), B.last.ok);
    else panel(t, null, [], null);
    if (ph === 'ask') st = { emo: '🤔', title: t.boxAsk, lead: t.boxText(B.n), body: '' };
    else if (rev) st = { emo: B.last.ok ? '✅' : '🤔', title: B.last.ok ? t.right : t.wrong, lead: t.more(B.n, 1), body: t.boxRev(B.n) };
    else if (ph === 'roll') st = { emo: '🎁', title: t.boxText(B.n), lead: t.rolling, body: '' };
    else st = { emo: '🎁', title: t.boxText(B.n), lead: t.boxLead, body: '' };
    if (rev) lab.setReadout(B.n + 1, t.upSub(B.n + 1, 1), '', GOLD); else lab.setReadout(B.n, t.boxIn(B.n), '', BALL_COL);
    lab.setFacts(t.facts.box);
  } else {
    const n = D.n, end = n <= 1 && D.phase === 'idle';
    lab.setGlow('rgba(61, 149, 224, .22)');
    main.textContent = end ? t.again : t.takeAway; main.disabled = D.phase !== 'idle';
    if (D.phase === 'ask') panel(t, t.leftAsk, D.opts, null, D.right, '', false);
    else if (D.last) panel(t, '', D.opts, D.pick, D.right, t.less(D.last.n), D.last.ok);
    else panel(t, null, [], null);
    if (D.phase === 'ask') st = { emo: '🤔', title: t.leftAsk, lead: t.downTop(n), body: '' };
    else if (D.last) st = { emo: D.last.ok ? '✅' : '🤔', title: D.last.ok ? t.right : t.wrong, lead: t.less(D.last.n), body: t.downRev };
    else st = { emo: '⬇️', title: t.views.down.replace(/^\S+\s/, ''), lead: t.downLead, body: '' };
    if (end) st = { emo: '🏁', title: t.downDone[0], lead: t.downDone[1], body: '' };
    if (D.last) lab.setReadout(n, t.downSub(D.last.n), '', RB[(n - 1 + 10) % 10]); else lab.setReadout(n, t.top, '', RB[9]);
    lab.setFacts(t.facts.down);
  }
  lab.setState({ ...st, extra: '' });
}
render();
