    const g = c.createRadialGradient(x - 10, y - 12, 4, x, y, WG.r); g.addColorStop(0, rgba(col, .35)); g.addColorStop(1, rgba(col, -.15));
    c.fillStyle = g; c.strokeStyle = on ? '#fff' : rgba(col, -.45); c.lineWidth = on ? 4 : 2; c.beginPath(); c.arc(x, y, WG.r, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#10121f'; c.font = `900 ${fs(12.5)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t.wheelF[i], x, y + 1);
  }
  if (S.wsel.length === 2) {
    const [i, j] = S.wsel, d = (j - i + 8) % 8;
    if (d === 1 || d === 7) { const k = d === 1 ? i : j; pill(c, `${t.wheelM[k]}`, WG.cx, WG.cy, 17, 'rgba(255,255,255,.92)', '#10121f'); }
    else pill(c, '✕', WG.cx, WG.cy, 17);
  } else pill(c, '?', WG.cx, WG.cy, 17);
}
function drawRing(c, t) {
  const tt = T[lang].win, cx = 180, cy = 200, R = 120;
  pill(c, tt.sit, 180, 24, 12.5);
  if (S.ph3 === 'predict') {
    c.fillStyle = 'rgba(235,240,255,.92)'; c.strokeStyle = '#a6b0d6'; c.lineWidth = 2;
    [[290, 110, 34], [262, 96, 28], [318, 130, 22], [248, 128, 18]].forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); });
    c.fillStyle = '#3b4470'; c.font = `900 ${fs(34)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 290, 112);
    return;
  }
  const rt = sm(S.ringT);
  OPT.forEach((o, k) => {
    const a = -Math.PI / 2 + k * Math.PI * 2 / 5, x = cx + Math.cos(a) * R * rt, y = cy + Math.sin(a) * R * rt;
    const al = o.th > 100 ? 1 : sm((o.th - S.lvlD) / 10);
    if (rt < .05) return;
    if (al < .98) { // ghost of a hidden choice
      c.save(); c.globalAlpha = .45 * (1 - al) * rt; c.setLineDash([5, 5]); c.strokeStyle = '#aab4da'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 32, 0, 7); c.stroke(); c.restore();
    }
    if (al < .02) return;
    c.save(); c.globalAlpha = al * rt;
    const s = .6 + .4 * al; c.translate(x, y); c.scale(s, s);
    c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(2, 34, 24, 5, 0, 0, 7); c.fill();
    const g = c.createRadialGradient(-10, -12, 4, 0, 0, 34); g.addColorStop(0, '#f4f7ff'); g.addColorStop(1, '#a9b6e6');
    c.fillStyle = g; c.strokeStyle = '#6f7cb8'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, 32, 0, 7); c.fill(); c.stroke();
    c.font = '28px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000'; c.fillText(o.emo, 0, 2);
    c.restore();
    c.save(); c.globalAlpha = al * rt; pill(c, tt.opt[o.id], x, y + 46 * s, 12.5); c.restore();
  });
}
let wheelGeo = false;
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const sc = Math.min(w / 360, h / 380); G.sc = sc; G.ox = (w - 360 * sc) / 2; G.oy = (h - 380 * sc) / 2;
  step(dt);
  const v = lab.view;
  c.save(); c.translate(G.ox, G.oy); c.scale(sc, sc);
  wheelGeo = false;
  if (v === 'mix' && S.sec === 'wheel') { wheelGeo = true; drawWheel(c); }
  else if (v === 'window') {
    if (S.breath) { // breathing halo behind Sam
      const p = clamp((now() - S.breath.t0) / 4, 0, 1), b = p < .5 ? sm(p / .5) : sm(1 - (p - .5) / .5), r = 66 + 44 * b;
      const g = c.createRadialGradient(180, 200, 20, 180, 200, r + 10); g.addColorStop(0, 'rgba(76,195,138,.05)'); g.addColorStop(1, 'rgba(76,195,138,.4)');
      c.fillStyle = g; c.beginPath(); c.arc(180, 200, Math.max(0, r + 10), 0, 7); c.fill();
      c.strokeStyle = 'rgba(140,235,190,.8)'; c.lineWidth = 3; c.beginPath(); c.arc(180, 200, Math.max(0, r), 0, 7); c.stroke();
      pill(c, p < .5 ? T[lang].win.in : T[lang].win.out, 180, 358, 13);
    }
    drawRing(c, time);
    drawSam(c, 180, 200, 54, S.face, false, time);
  } else {
    drawJar(c, time);
    drawSam(c, 268, 170, 58, S.face, true, time);
    if (v === 'which') drawCloth(c, time);
    if (v === 'which' && !S.checked && S.qi < 5) pill(c, T[lang].cloth, 180, 360, 12.5);
  }
  c.restore();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (!wheelGeo) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.sc, y = (ev.clientY - r.top - G.oy) / G.sc;
  for (let i = 0; i < 8; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 4, px = WG.cx + Math.cos(a) * WG.R, py = WG.cy + Math.sin(a) * WG.R;
    if (Math.hypot(x - px, y - py) <= WG.r + 4) {
      S.wsel = S.wsel.includes(i) ? S.wsel.filter((k) => k !== i) : S.wsel.length >= 2 ? [i] : [...S.wsel, i];
      sfx.click(); render(); return;
    }
  }
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function onViewChange() {
  if (lab.view === 'which' && !S.checked) { S.la = S.lb = 0; S.clothT = 1; }
}
function resetNamed() { S.named = [0, 0]; }
function pickFeel(which, f) {
  if (which === 'a') { if (f === S.b) S.b = S.a; S.a = f; } else { if (f === S.a) S.a = S.b; S.b = f; }
  resetNamed(); sfx.tick();
}
function newQ() { S.qi++; S.sel = []; S.checked = false; S.la = S.lb = 0; S.clothT = 1; }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, t = T[lang];
  if (act === 'fa' || act === 'fb') pickFeel(act === 'fa' ? 'a' : 'b', b.dataset.f);
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (lab.view !== 'mix') { document.querySelector('#views button[data-view="mix"]')?.click(); }
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.wsel = []; if (k === 'name') resetNamed(); sfx.click();
  } else if (act === 'wheelOff') { S.sec = null; sfx.click(); }
  else if (act === 'nm') { S.named[+b.dataset.i] = S.named[+b.dataset.i] ? 0 : 1; sfx.good(); }
  else if (act === 'wch') {
    if (S.checked) return;
    const f = b.dataset.f; S.sel = S.sel.includes(f) ? S.sel.filter((x) => x !== f) : S.sel.length >= 2 ? [S.sel[1], f] : [...S.sel, f]; sfx.tick();
  } else if (act === 'wmain') {
    if (S.qi >= 5) { S.qi = -1; S.res = []; newQ(); sfx.click(); }
    else if (!S.checked) {
      if (S.sel.length !== 2) return;
      const pair = SIT[S.qi].pair, ok = S.sel.every((f) => pair.includes(f));
      S.res[S.qi] = ok; S.checked = true;
      S.ca = hex2(F[pair[0]].c); S.cb = hex2(F[pair[1]].c);
      (ok ? sfx.good : sfx.bad)(); showStage();
    } else { newQ(); sfx.click(); }
  } else if (act === 'gdec') { if (S.ph3 === 'predict') { S.g3 = clamp(S.g3 - 1, 1, 5); sfx.tick(); } }
  else if (act === 'ginc') { if (S.ph3 === 'predict') { S.g3 = clamp(S.g3 + 1, 1, 5); sfx.tick(); } }
  else if (act === 'gcheck') {
    S.r3 = S.g3 === 2; S.ph3 = 'play'; S.anger = 100; (S.r3 ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'breath') {
    if (S.breath || S.ph3 !== 'play') return;
    const to = Math.max(0, S.anger - 45); S.breath = { t0: now(), from: S.lvlD, to }; S.anger = to; sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'slA') { S.sa = +ev.target.value; resetNamed(); }
  else if (id === 'slB') { S.sb = +ev.target.value; resetNamed(); }
  else if (id === 'slW' && !S.breath && S.ph3 === 'play') S.anger = +ev.target.value;
  else return;
  render();
});

// --- one render per change -----------------------------------------------------------------------------------
const feelChip = (act, f, on, t) => `<button class="chip mf-chip ${on ? 'on' : ''}" data-act="${act}" data-f="${f}"><i style="background:${F[f].c}"></i>${esc(t.feel[f])}</button>`;
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  $('secMix').style.display = v === 'mix' ? 'block' : 'none';
  $('secWhich').style.display = v === 'which' ? 'block' : 'none';
  $('secWin').style.display = v === 'window' ? 'block' : 'none';
  $('secRow').innerHTML = [['wheel', '🎡'], ['name', '🏷️']].map(([k, emo]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k && open ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setFacts([{ emo: v === 'mix' ? '🎬' : v === 'which' ? '🎡' : '🧠', text: t.facts[v === 'window' ? 'window' : v].text, src: t.facts[v === 'window' ? 'window' : v].src }]);
  if (v === 'mix') renderMix(t); else if (v === 'which') renderWhich(t); else renderWin(t);
}
function renderMix(t) {
  const wheel = S.sec === 'wheel' && secret.unlocked(), naming = S.sec === 'name' && secret.unlocked();
  if (S.sec && !secret.unlocked()) S.sec = null;
  lab.setGlow('rgba(240, 201, 76, .22)');
  $('chA').innerHTML = MIXF.map((f) => feelChip('fa', f, f === S.a, t)).join('');
  $('chB').innerHTML = MIXF.map((f) => feelChip('fb', f, f === S.b, t)).join('');
  $('slA').value = S.sa; $('slB').value = S.sb; $('vA').textContent = `${S.sa}%`; $('vB').textContent = `${S.sb}%`;
  $('slA').style.setProperty('--c', F[S.a].c); $('slB').style.setProperty('--c', F[S.b].c);
  $('slA').setAttribute('aria-label', `${t.fa}: ${t.strength}`); $('slB').setAttribute('aria-label', `${t.fb}: ${t.strength}`);
  $('nmRow').style.display = naming ? 'flex' : 'none';
  $('nmRow').innerHTML = [S.a, S.b].map((f, i) => `<button class="chip ${S.named[i] ? 'on' : ''}" data-act="nm" data-i="${i}" style="min-height:36px">${esc(S.named[i] ? t.nameDone(t.feel[f]) : t.nameTag(t.feel[f]))}</button>`).join('');
  $('wheelBack').style.display = wheel ? 'flex' : 'none';
  $('wheelBack').firstElementChild.textContent = t.backJar;
  lab.setReadout(`${S.sa}% + ${S.sb}%`, t.feelsLine(t.feel[S.a], S.sa, t.feel[S.b], S.sb), t.pill, F[S.a].c);
  let st;
  if (wheel) {
    if (S.wsel.length === 2) {
      const [i, j] = S.wsel, d = (j - i + 8) % 8;
      st = d === 1 || d === 7 ? t.wheelMix(t.wheelF[d === 1 ? i : j], t.wheelF[d === 1 ? j : i], t.wheelM[d === 1 ? i : j]) : t.wheelFar;
    } else st = S.wsel.length === 1 ? t.wheelOne : t.wheelCard0;
    st = { emo: '🎡', ...st };
  } else if (naming) st = { emo: '🏷️', ...t.nameCard(S.named[0] + S.named[1]) };
  else st = { emo: '🫙', ...t.mixCard(t.feel[S.a], t.feel[S.b]) };
  lab.setState({ ...st, extra: `<div class="fine">${esc(t.fine)}</div>` });
}
function renderWhich(t) {
  lab.setGlow('rgba(143, 127, 208, .24)');
  const end = S.qi >= 5, k = S.res.filter(Boolean).length;
  $('sit').style.display = $('pickQ').style.display = $('wch').style.display = end ? 'none' : '';
  const qi = Math.min(S.qi, 4), sit = SIT[qi];
  $('sit').textContent = `${sit.emo} ${t.sits[qi]}`; $('pickQ').textContent = `${qi + 1}/5 · ${t.pick}`;
  $('wch').innerHTML = sit.opts.map((f) => {
    const on = S.sel.includes(f), good = S.checked && sit.pair.includes(f);
    return `<button class="chip mf-chip ${on ? 'on' : ''}" data-act="wch" data-f="${f}" ${S.checked ? 'style="pointer-events:none;' + (good ? 'box-shadow:0 0 0 2px var(--ok)' : on ? 'opacity:.6' : 'opacity:.5') + '"' : ''}><i style="background:${F[f].c}"></i>${esc(t.feel[f])}</button>`;
  }).join('');
  $('wMain').textContent = end ? t.again : !S.checked ? t.check : S.qi >= 4 ? t.result : t.next;
  $('wMain').disabled = !end && !S.checked && S.sel.length !== 2;
  if (end) {
    lab.setReadout(`${k}/5`, t.wEnd(k), '', '#8f7fd0'); lab.setState({ emo: '🏁', title: t.wEnd(k), lead: t.wEndLead, body: '', extra: '' }); return;
  }
  if (!S.checked) {
    lab.setReadout('?', '', '', '#8f7fd0'); lab.setState({ emo: sit.emo, title: t.sits[qi], lead: t.pick, body: '', extra: '' }); return;
  }
  const [a, b] = sit.pair.map((f) => t.feel[f]), ok = S.res[qi];
  lab.setReadout(`${a} + ${b}`, '', ok ? '✓' : '', F[sit.pair[0]].c);
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.wRight : t.wOther, lead: ok ? t.wRightLead(a, b) : t.wOtherLead(a, b), body: '', extra: '' });
}
function renderWin(t) {
  const w = t.win, pred = S.ph3 === 'predict', n = visibleCount(S.anger);
  lab.setGlow('rgba(229, 72, 77, .22)');
  $('winPred').style.display = pred ? '' : 'none'; $('winPlay').style.display = pred ? 'none' : '';
  $('winQ').textContent = w.q; $('g3v').textContent = S.g3; $('gCheck').textContent = w.check;
  document.querySelectorAll('#winPred .sb').forEach((b) => { b.setAttribute('aria-label', b.dataset.act === 'gdec' ? '−' : '+'); });
  $('howL').textContent = w.how; $('slW').value = S.anger; $('slW').disabled = !!S.breath; $('vW').textContent = `${S.anger}%`;
  $('breathB').textContent = w.pause; $('breathB').disabled = !!S.breath || S.anger <= 0;
  if (pred) {
    lab.setReadout('?', w.unit, '', '#e5484d');
    lab.setState({ emo: '🍪', title: w.sit, lead: w.q, body: '', extra: '' }); return;
  }
  lab.setReadout(n, w.unit, w.pill(S.anger), '#e5484d');
  const lead = S.breath ? w.breath : S.anger >= 70 ? w.big : S.anger >= 30 ? w.mid : w.low;
  lab.setState({ emo: S.breath ? '🌬️' : S.anger >= 70 ? '😠' : S.anger >= 30 ? '😐' : '😌', title: w.sees(n), lead, body: S.r3 === null ? '' : S.r3 ? w.right : w.wrong, extra: '' });
}
render();
