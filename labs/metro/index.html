  k.stuck = n < 7 && !KB.some((b, j) => !k.used[j] && (b.a === to || b.b === to));
  if (k.stuck) sfx.bad();
}
function drawKonig(c, w, h, dt, time) {
  const wide = w >= 640, t = T[lang], k = S.kg;
  const mr = wide ? { x: 8, y: 8, w: w * .58 - 12, h: h - 16 } : { x: 8, y: 8, w: w - 16, h: (h - 24) * .62 };
  const gr = wide ? { x: w * .58 + 4, y: 8, w: w * .42 - 12, h: h - 16 } : { x: 8, y: mr.y + mr.h + 8, w: w - 16, h: h - mr.y - mr.h - 16 };
  G.map = mr; G.gr = gr;
  const M = (p) => [mr.x + p[0] * mr.w, mr.y + p[1] * mr.h];
  c.save(); c.beginPath(); c.roundRect(mr.x, mr.y, mr.w, mr.h, 18); c.clip();
  const wg = c.createLinearGradient(0, mr.y, 0, mr.y + mr.h); wg.addColorStop(0, '#2f6fa8'); wg.addColorStop(1, '#1d4a78');
  c.fillStyle = wg; c.fillRect(mr.x, mr.y, mr.w, mr.h);
  c.strokeStyle = 'rgba(170,215,250,.16)'; c.lineWidth = 1.5; c.lineCap = 'round';
  for (let i = 0; i < 9; i++) { const x = mr.x + ((i * 37) % 100) / 100 * mr.w, y = mr.y + (.3 + ((i * 53) % 40) / 100) * mr.h; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 8, y - 4, x + 16, y); c.stroke(); }
  const land = (key) => {
    const [X, Y, W, H] = key === 'N' ? [.03, .03, .94, .21] : key === 'S' ? [.03, .76, .94, .21] : key === 'K' ? [.14, .34, .38, .32] : [.58, .35, .32, .30];
    c.beginPath();
    if (key === 'N' || key === 'S') c.roundRect(mr.x + X * mr.w, mr.y + Y * mr.h, W * mr.w, H * mr.h, 16);
    else c.ellipse(mr.x + (X + W / 2) * mr.w, mr.y + (Y + H / 2) * mr.h, Math.max(0, W / 2 * mr.w), Math.max(0, H / 2 * mr.h), 0, 0, 7);
    return [X, Y, W, H];
  };
  c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 10; c.shadowOffsetY = 4;
  for (const key of ['N', 'S', 'K', 'E']) {
    const [X, Y, W, H] = land(key), g = c.createLinearGradient(mr.x + X * mr.w, mr.y + Y * mr.h, mr.x + (X + W) * mr.w, mr.y + (Y + H) * mr.h);
    g.addColorStop(0, '#7aa764'); g.addColorStop(1, '#3f6b49'); c.fillStyle = g; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 2; c.strokeStyle = '#2a4a33'; c.stroke();
    c.shadowColor = 'rgba(0,0,0,.35)';
  }
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
  for (const key of ['N', 'S', 'K', 'E']) { // a few little houses
    const [cx, cy] = KC[key], span = key === 'N' || key === 'S' ? [-.36, -.2, .2, .36] : [-.07, .05];
    span.forEach((dx, i) => { const [X, Y] = M([cx + dx, cy + (i % 2 ? .03 : -.03) * (key === 'N' || key === 'S' ? 1 : 1.2)]); c.fillStyle = '#e4d6b3'; c.beginPath(); c.roundRect(X - 6, Y - 5, 12, 10, 2); c.fill(); c.fillStyle = '#b86b4b'; c.beginPath(); c.moveTo(X - 7, Y - 5); c.lineTo(X, Y - 11); c.lineTo(X + 7, Y - 5); c.closePath(); c.fill(); });
  }
  KB.forEach((b, i) => {
    const [x0, y0] = M(b.p[0]), [x1, y1] = M(b.p[1]), used = k.used[i];
    c.lineCap = 'round'; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.strokeStyle = '#3b2a1a'; c.lineWidth = 11; c.stroke();
    c.strokeStyle = used ? MINT : '#c9a066'; c.lineWidth = 7; c.stroke();
    c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1.5; c.setLineDash([2, 5]); c.stroke(); c.setLineDash([]);
  });
  // the walker
  const tgt = k.at ? KC[k.at] : null;
  if (tgt) { if (!k.w) k.w = { x: tgt[0], y: tgt[1] }; k.w.x += (tgt[0] - k.w.x) * Math.min(1, dt * 7); k.w.y += (tgt[1] - k.w.y) * Math.min(1, dt * 7); }
  if (k.w) { const [x, y] = M([k.w.x, k.w.y]); c.save(); c.globalAlpha = 1; c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, 15, 0, 7); c.fill(); c.lineWidth = 2; c.strokeStyle = INK; c.stroke(); c.font = '18px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🚶', x, y + 1); c.restore(); }
  c.restore();
  // the same thing as a graph
  c.beginPath(); c.roundRect(gr.x, gr.y, gr.w, gr.h, 18); c.fillStyle = 'rgba(16,21,40,.9)'; c.fill(); c.strokeStyle = 'rgba(130,145,190,.2)'; c.lineWidth = 1; c.stroke();
  const GP = (key) => [gr.x + 28 + KG[key][0] * (gr.w - 56), gr.y + 30 + KG[key][1] * (gr.h - 60)];
  G.gnodes = { N: GP('N'), K: GP('K'), E: GP('E'), S: GP('S') };
  KB.forEach((b, i) => {
    const p = GP(b.a), q = GP(b.b), mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2, dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1;
    c.beginPath(); c.moveTo(p[0], p[1]); c.quadraticCurveTo(mx - dy / L * b.o * 16, my + dx / L * b.o * 16, q[0], q[1]);
    c.strokeStyle = k.used[i] ? MINT : '#c9a066'; c.lineWidth = 4; c.lineCap = 'round'; c.stroke();
  });
  Object.keys(KC).forEach((key) => {
    const [x, y] = GP(key), cur = k.at === key, odd = KDEG[key] % 2 === 1;
    c.beginPath(); c.arc(x, y, 15, 0, 7); c.fillStyle = '#f4f6ff'; c.fill(); c.lineWidth = cur ? 4 : 2; c.strokeStyle = cur ? CYAN : INK; c.stroke();
    c.fillStyle = odd ? '#c43b63' : INK; c.font = '900 14px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(KDEG[key], x, y + 1);
  });
  c.font = FONT; const tw = c.measureText(t.kg.graph).width + 14; pill(c, gr.x + (gr.w - tw) / 2, gr.y + gr.h - 28, tw, 20, 'rgba(10,13,24,.86)'); c.fillStyle = '#EDEFF7'; c.textAlign = 'center'; c.fillText(t.kg.graph, gr.x + gr.w / 2, gr.y + gr.h - 17);
}
function konigTap(x, y) {
  const mr = G.map, gr = G.gr;
  if (x >= mr.x && x <= mr.x + mr.w && y >= mr.y && y <= mr.y + mr.h) kgStep(landAt((x - mr.x) / mr.w, (y - mr.y) / mr.h));
  else if (G.gnodes) {
    let best = null;
    for (const key of Object.keys(G.gnodes)) { const d = Math.hypot(x - G.gnodes[key][0], y - G.gnodes[key][1]); if (d < 26 && (!best || d < best.d)) best = { key, d }; }
    kgStep(best ? best.key : null);
  }
  render();
}
function drawBeck(c, w, h, dt, time) {
  const F = fitWorld(w, h, 14), nr = w < 520 ? 8 : 10, lw = w < 520 ? 7 : 9;
  c.save(); c.beginPath(); c.roundRect(0, 0, w, h, 18); c.clip();
  const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#f3ebd6'); g.addColorStop(1, '#e6dac0'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  const a = wp(F, [-6, RIVER_STRAIGHT]), b = wp(F, [136, RIVER_STRAIGHT]);
  c.lineCap = 'butt'; c.strokeStyle = '#c3d9e9'; c.lineWidth = 9 * F.s; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 2; c.beginPath(); c.moveTo(a[0], a[1] - 4.5 * F.s + 3); c.lineTo(b[0], b[1] - 4.5 * F.s + 3); c.stroke();
  c.restore();
  c.beginPath(); c.roundRect(1, 1, w - 2, h - 2, 18); c.strokeStyle = '#b9a77f'; c.lineWidth = 2; c.stroke();
  const P = {}; IDS.forEach((id) => { P[id] = wp(F, SCH[id]); });
  const BC = { red: '#d4322c', blue: '#1c5cae', green: '#2e8b57', walk: '#6a7188' };
  const stamp = [{ x: 8, y: 8, w: 84, h: 46 }];
  const L = labelsFor(c, `beck|${lang}|${w}|${h}`, P, 1, w, h, nr, stamp);
  drawEdges(c, P, { m: 1, bare: 0, lw, flat: true, color: (e) => BC[e.ln] });
  IDS.forEach((id) => {
    const [x, y] = P[id];
    if (INTER[id]) { c.beginPath(); c.arc(x, y, nr, 0, 7); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 3.5; c.strokeStyle = '#1b1b1b'; c.stroke(); return; }
    const e0 = ADJ[id][0], o = P[e0.to], dx = o[0] - x, dy = o[1] - y, d = Math.hypot(dx, dy) || 1, nx = -dy / d * (lw * .9 + 2), ny = dx / d * (lw * .9 + 2);
    c.beginPath(); c.moveTo(x - nx, y - ny); c.lineTo(x + nx, y + ny); c.strokeStyle = '#1b1b1b'; c.lineWidth = 3.5; c.lineCap = 'round'; c.stroke();
  });
  IDS.forEach((id) => drawLabel(c, L[id], L[id].lines, 1, false, P[id], nr));
  c.save(); c.translate(48, 30); c.rotate(-.07); c.beginPath(); c.roundRect(-34, -17, 68, 34, 6); c.strokeStyle = '#a8321f'; c.lineWidth = 3; c.stroke();
  c.fillStyle = '#a8321f'; c.font = '900 20px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('1931', 0, 1); c.restore();
}

// --- draw loop ---------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec === 'a') return drawKonig(c, w, h, dt, time);
  if (S.sec === 'b') return drawBeck(c, w, h, dt, time);
  const v = lab.view;
  if (v === 'map') drawMap(c, w, h, dt, time); else if (v === 'route') drawRoute(c, w, h, dt, time); else drawTree(c, w, h, dt, time);
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (S.sec === 'a') konigTap(x, y);
  else if (!S.sec && lab.view === 'tree' && G.tb) treeTap(x, y);
  else if (!S.sec && lab.view === 'route' && G.nodes) routeTap(x, y);
});

// --- controls ----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function pick(view, i) {
  if (S.ans[view] !== null) return;
  S.ans[view] = i; (i === 0 ? sfx.good : sfx.bad)();
  if (view === 'map') S.tw = { from: S.m, to: 1, t0: now(), dur: 1.6 };
  else if (view === 'route') startRun(['stops', 'min']);
  else growTree('S');
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const p = ev.target.closest('[data-pick]');
  if (p) { pick(p.closest('.mt-ask').dataset.view, +p.dataset.pick); return; }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'morph') { S.tw = { from: S.m, to: +b.dataset.k, t0: now(), dur: 1.3 }; S.chk = null; sfx.click(); }
  else if (act === 'bare') { S.bareTo = S.bareTo ? 0 : 1; sfx.click(); }
  else if (act === 'mode') { S.mode = b.dataset.k; sfx.click(); }
  else if (act === 'find') { startRun([S.mode]); sfx.click(); showStage(); }
  else if (act === 'untree') { if (S.tr && S.tr.to) { S.tr = { from: S.tr.to, to: null, t0: now() }; S.sel = null; sfx.click(); } }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; if (S.sec === 'a') kgReset(); sfx.click(); showStage();
  } else if (act === 'kgreset') { kgReset(); sfx.click(); }
  render();
});
$('mtSlide').addEventListener('input', (ev) => { S.tw = null; S.m = clamp(+ev.target.value / 1000, 0, 1); S.chk = null; render(); });
$('mtFrom').addEventListener('change', (ev) => { S.from = ev.target.value; S.sr = null; render(); });
$('mtTo').addEventListener('change', (ev) => { S.to = ev.target.value; S.sr = null; render(); });
$('mtRoot').addEventListener('change', (ev) => { if (S.ans.tree !== null) { growTree(ev.target.value); S.sel = null; render(); } });

// --- one render per change: controls, readout and the state card -----------------------------------------------------
function askHTML(t, view, q, opts, why) {
  const a = S.ans[view];
  const chips = S.ord[view].map((i) => `<button class="chip mt-opt ${a === null ? '' : i === 0 ? 'mt-good' : i === a ? 'mt-bad' : ''}" data-pick="${i}"${a === null ? '' : ' disabled'}>${esc(opts[i])}</button>`).join('');
  const verdict = a === null ? '' : `<div class="mt-v ${a === 0 ? 'ok' : 'no'}"><b>${esc(a === 0 ? t.right : t.notQuite)}</b>${esc(why)}</div>`;
  return `<div class="mt-q">${esc(q)}</div><div class="chips">${chips}</div>${verdict}`;
}
function fillSelects(t) {
  const opts = IDS.map((id) => `<option value="${id}">${esc(t.stations[id])}</option>`).join('');
  ['mtFrom', 'mtTo', 'mtRoot'].forEach((id) => { $(id).innerHTML = opts; });
  S.optLang = lang;
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  $('mtMap').classList.toggle('mt-off', !!sec || v !== 'map');
  $('mtRoute').classList.toggle('mt-off', !!sec || v !== 'route');
  $('mtTree').classList.toggle('mt-off', !!sec || v !== 'tree');
  $('mtLegend').classList.toggle('mt-off', !!sec || v === 'tree');
  if (S.optLang !== lang) fillSelects(t);
  $('mtLegend').innerHTML = ['red', 'blue', 'green', 'walk'].map((k) => `<span><i ${k === 'walk' ? 'class="mt-dash"' : `style="background:${COL[k]}"`}></i>${esc(t.lineNames[k])}</span>`).join('');
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('mtSecChips').innerHTML = sc('a', '🌉') + sc('b', '🗺️') + (S.sec === 'a' ? `<button class="chip" data-act="kgreset">${esc(t.reset)}</button>` : '');
  if (sec === 'a') return renderKonig(t);
  if (sec === 'b') { lab.setGlow('rgba(214,170,90,.26)'); lab.setReadout('1931', t.secrets.b[0], '', AMBER); lab.setState({ emo: '🗺️', title: t.secrets.b[0], lead: t.secrets.b[1], body: '', extra: '' }); lab.setFacts([]); return; }

}
function renderMap(t) {
  const a = S.ans.map;
  $('askMap').innerHTML = askHTML(t, 'map', t.qMorph, t.optsMorph, t.morphWhy);
  $('toolsMap').classList.toggle('mt-off', a === null);
  $('mtSeg').innerHTML = [[0, t.realMap], [1, t.schematic]].map(([k, l]) => `<button data-act="morph" data-k="${k}" class="${(k ? S.m > .5 : S.m <= .5) ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('mtBare').textContent = t.justGraph; $('mtBare').classList.toggle('on', S.bareTo === 1);
  $('mtSlide').setAttribute('aria-label', `${t.realMap} – ${t.schematic}`);
  lab.setGlow('rgba(78, 168, 255, .26)');
  lab.setReadout(`${V} · ${NE}`, t.vertsEdges, '', '#4ea8ff');
  if (a === null) { lab.setState({ emo: '🤔', title: t.qMorph, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  lab.setState({ ...t.state.map, extra: S.m > .985 ? `<div class="mt-v ok"><b>✓</b>${esc(t.kept(NE, NE, CHANGED))}</div>` : '' });
  lab.setFacts(t.facts.map);
}
function renderRoute(t) {

  $('askRoute').innerHTML = askHTML(t, 'route', t.qRoute, t.optsRoute, t.routeWhy);
  $('toolsRoute').classList.toggle('mt-off', a === null);
  $('lbFrom').textContent = t.from; $('lbTo').textContent = t.to;
  $('mtFrom').value = S.from; $('mtTo').value = S.to;
  $('mtMode').innerHTML = [['stops', t.fewestStops], ['min', t.fewestMinutes]].map(([k, l]) => `<button data-act="mode" data-k="${k}" class="${S.mode === k ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('mtFind').textContent = t.findRoute;
  lab.setGlow('rgba(88, 208, 232, .24)');
  if (a === null) { lab.setReadout('?', '', '', CYAN); lab.setState({ emo: '🤔', title: t.qRoute, lead: '', body: '', extra: '' }); lab.setFacts([]); return; }
  const f = fastest(S.from, S.to);
  lab.setReadout(t.minStops(f.minutes, f.stops), t.fastest, '', AMBER);
  const res = S.sr && S.sr.fin ? S.sr.runs.map((r) => `<div class="mt-res"><i style="background:${r.color}"></i><span><b>${esc(r.mode === 'stops' ? t.fewestStops : t.fewestMinutes)}:</b> ${esc(t.minStops(r.minutes, r.stops))}</span></div>`).join('') : '';

function renderTree(t) {

}
function renderKonig(t) {
  const k = S.kg, n = k.used.filter(Boolean).length;
  lab.setGlow('rgba(201, 160, 102, .26)');
  lab.setReadout(`${n} / ${KB.length}`, t.kg.sub, '', '#c9a066');
  lab.setState({ emo: '🌉', title: t.secrets.a[0], lead: k.stuck ? t.kg.stuck : k.at ? t.kg.next : t.kg.start, body: t.secrets.a[1], extra: '' });
