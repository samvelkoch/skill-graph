};

canvasLoop($('cv'), (c, w, h, dt, time) => {

  if (m === 'shapes') drawShapes(c, w, h, time); else if (m === 'make') drawMake(c, w, h, time); else if (m === 'cause') drawCause(c, w, h);
  else if (m === 'guess') drawGuess(c, w, h); else drawGalton(c, w, h);

// --- pointers: tap a dot, step with the arrows, draw in "Make" -----------------------------------------------------------------
const pos = (ev) => { const r = cv0().getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
const nearest = (px, py, maxD) => { let best = -1, bd = maxD; for (const p of geo.pts) { const d = Math.hypot(p.px - px, p.py - py); if (d < bd) { bd = d; best = p.i; } } return best; };
function navStep(dir) {
  const m = mode();
  if (m === 'shapes') { const d = S.ds, D = DS[d], at = D.ord.indexOf(S.sel[d]); S.sel[d] = D.ord[(at + dir + D.n) % D.n]; }
  else if (m === 'cause') { const ex = S.ca.ex, n = CV[ex].t.arr.length; S.ca.sel[ex] = (S.ca.sel[ex] + dir + n) % n; }
  sfx.tick(); render();
}
cv0().addEventListener('pointerdown', (ev) => {
  const [px, py] = pos(ev), m = mode();
  if (geo.nav) for (const n of geo.nav) if (Math.hypot(px - n.x, py - n.y) <= 26) { navStep(n.d); return; }
  if (m === 'make') return makeDown(ev, px, py);
  if (m === 'shapes') { if (S.pred[S.ds] === null) return; const i = nearest(px, py, 26); if (i >= 0) { S.sel[S.ds] = i; sfx.tick(); render(); } }
  else if (m === 'cause') { const i = nearest(px, py, 26); if (i >= 0) { S.ca.sel[S.ca.ex] = i; sfx.tick(); render(); } }
  else if (m === 'galton') { const i = nearest(px, py, 22); if (i >= 0) { S.gl.sel = i; S.gl.x = clamp(Math.round(GAL.x[i]), 156, 188); sfx.tick(); render(); } }
});
function makeDown(ev, px, py) {
  const g = geo.plot; if (!g) return;
  const hit = nearest(px, py, 24);
  if (hit >= 0) drag = { i: hit, moved: false, x0: px, y0: py, id: ev.pointerId };
  else if (px >= g.ix && px <= g.ix + g.iw && py >= g.iy && py <= g.iy + g.ih) {
    if (S.pts.length >= MAXP) { sfx.bad(); return; }
    S.pts.push({ x: clamp(g.ux(px), 0.2, 9.8), y: clamp(g.uy(py), 0.2, 9.8) }); S.preset = null; sfx.tick();
    drag = { i: S.pts.length - 1, moved: true, x0: px, y0: py, id: ev.pointerId }; render();
  } else return;
  try { cv0().setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
}
cv0().addEventListener('pointermove', (ev) => {
  if (!drag || mode() !== 'make') return;
  const [px, py] = pos(ev), g = geo.plot; if (!g) return;
  if (!drag.moved && Math.hypot(px - drag.x0, py - drag.y0) > 8) drag.moved = true;
  if (!drag.moved) return;
  const p = S.pts[drag.i]; if (!p) return;
  p.x = clamp(g.ux(px), 0.2, 9.8); p.y = clamp(g.uy(py), 0.2, 9.8);
  if (S.preset === 'outlier') S.moved = true;
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
});
const dragEnd = (ev) => {
  if (!drag) return;
  const d = drag; drag = null;
  if (ev.type === 'pointerup' && !d.moved && S.pts[d.i]) { S.pts.splice(d.i, 1); if (S.preset) S.preset = null; sfx.click(); }
  render();
};
cv0().addEventListener('pointerup', dragEnd); cv0().addEventListener('pointercancel', dragEnd);

// --- controls --------------------------------------------------------------------------------------------------------------------
const showStage = () => {

  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function goalOk(r, n) { return r !== null && n >= 6 && ((S.goal === 'hi' && r > 0.8) || (S.goal === 'lo' && r < -0.8) || (S.goal === 'zero' && Math.abs(r) < 0.1)); }
function loadOutlier() { S.pts = outlierSet(); S.preset = 'outlier'; S.moved = false; S.r0 = pearson(S.pts.map((p) => p.x), S.pts.map((p) => p.y)); }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i;

    S.pred[d] = i; S.tRev[d] = nowS(); S.sel[d] = DS[d].ord[Math.floor(DS[d].n / 2)];

  else if (a === 'outlier') { loadOutlier(); S.goal = null; sfx.click(); showStage(); }
  else if (a === 'mkclear') { S.pts = []; S.preset = null; sfx.click(); }
  else if (a === 'mkline') { S.mkLine = !S.mkLine; sfx.click(); }
  else if (a === 'ex') { S.ca.ex = i; sfx.click(); }
  else if (a === 'cpick') { if (S.ca.ans !== null) return; S.ca.ans = i; S.ca.tint[0] = true; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'pair') { S.ca.pair[S.ca.ex] = i; sfx.click(); }
  else if (a === 'tint') { S.ca.tint[S.ca.ex] = !S.ca.tint[S.ca.ex]; sfx.click(); }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === b.dataset.k ? null : b.dataset.k; if (S.sec === 'guess') S.g.checked = false; sfx.click(); }
  else if (a === 'gmain') guessMain();

});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'gSl') { if (S.g.checked) return; S.g.guess = +ev.target.value / 100; render(); }
  else if (ev.target.id === 'xSl') { S.gl.x = +ev.target.value; S.gl.sel = null; render(); }
});
function guessMain() {
  const G = S.g;
  if (G.k >= 5) { G.run++; G.k = 0; G.guess = 0; G.checked = false; G.scores = []; sfx.click(); return; }
  if (!G.checked) {
    const set = guessSet(G.run, G.k), sc = Math.round(Math.max(0, 1 - Math.abs(G.guess - set.r) / 0.5) * 100);
    G.scores[G.k] = sc; G.checked = true; (sc >= 60 ? sfx.good : sfx.bad)();
  } else { G.k++; G.guess = 0; G.checked = false; sfx.click(); }
}
function onView() { S.sec = null; drag = null; render(); }

// --- one render per change: controls, readout, state card and facts ---------------------------------------------------------
function render() {
  const t = T[lang], m = mode(), show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  show('scShapes', m === 'shapes'); show('scMake', m === 'make'); show('scCause', m === 'cause'); show('scGuess', m === 'guess'); show('scGalton', m === 'galton');
  cv0().style.touchAction = m === 'make' ? 'none' : 'pan-y';
  const open = secret.unlocked();
  $('scSecs').innerHTML = [['guess', '🎯', 'a'], ['galton', '🧬', 'b']].map(([k, emo, tk]) =>
    `<button type="button" class="chip sc-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[tk][0])}` : '🔒 ???'}</button>`).join('');
  $('gauge').style.visibility = 'hidden';
  if (m === 'shapes') renderShapes(t); else if (m === 'make') renderMake(t); else if (m === 'cause') renderCause(t); else if (m === 'guess') renderGuess(t); else renderGalton(t);
}
const fineBox = (t, extra = '') => `<div class="sc-fine">${esc(t.fine)}</div>${extra}`;

function renderShapes(t) {
  const d = S.ds, D = DS[d], pr = S.pred[d], rev = pr !== null, ok = rev && pr === d;
  lab.setGlow('rgba(90, 209, 255, .26)');
  $('shChips').innerHTML = t.sh.chips.map((l, i) => `<button type="button" class="chip sc-c ${i === d ? 'on' : ''}" data-act="ds" data-i="${i}">${S.pred[i] !== null ? '✓ ' : ''}${esc(l)}</button>`).join('');
  const optHTML = t.sh.opts.map((o, i) => {
    const cls = !rev ? '' : i === d ? ' good' : i === pr ? ' bad' : ' dim';
    return `<button type="button" class="sc-opt${cls}" data-act="pick" data-i="${i}"${rev ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  $('shAsk').innerHTML = `<p class="sc-q">${esc(t.sh.q[d])}</p><div class="sc-opts">${optHTML}</div>${rev ? `<p class="sc-verdict ${ok ? 'ok' : 'no'}">${esc(ok ? t.sh.right : t.sh.wrong(t.sh.opts[d]))}</p>` : ''}`;
  $('shRow').style.display = rev ? 'flex' : 'none';
  $('shLine').textContent = `${S.line ? '✓ ' : ''}${t.sh.line}`; $('shLine').classList.toggle('on', S.line);
  if (!rev) {
    lab.setReadout('?', '', '', '#5ad1ff');
    lab.setState({ emo: '🤔', title: t.sh.q[d], lead: '', body: '', extra: '' });
  } else {
    lab.setReadout(`r = ${num(D.r)}`, corrText(D.r), t.pts(D.n), '#5ad1ff');
    const st = t.sh.res[d];
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: `${st[3]} ${corrText(D.r)}.`, extra: fineBox(t, S.line ? `<div class="sc-note" style="margin-top:6px">${esc(t.sh.lineNote)}</div>` : '') });
  }
  lab.setFacts(t.facts.shapes);
}

function renderMake(t) {
  const n = S.pts.length, xs = S.pts.map((p) => p.x), ys = S.pts.map((p) => p.y), r = pearson(xs, ys), np = t.pts(n);
  lab.setGlow('rgba(255, 200, 87, .24)');
  const ok = S.goal && goalOk(r, n);
  if (ok && !S.done[S.goal]) { S.done[S.goal] = true; sfx.good(); }
  const goalsHTML = ['hi', 'lo', 'zero'].map((k) => `<button type="button" class="chip sc-c ${S.goal === k ? 'on' : ''}" data-act="goal" data-k="${k}">${S.done[k] ? '✓ ' : ''}${esc(t.mk.goals[k])}</button>`).join('');
  $('mkChips').innerHTML = goalsHTML + `<button type="button" class="chip sc-c ${S.preset === 'outlier' ? 'on' : ''}" data-act="outlier">${esc(t.mk.outlier)}</button>`;
  $('mkLine').textContent = `${S.mkLine ? '✓ ' : ''}${t.mk.line}`; $('mkLine').classList.toggle('on', S.mkLine);
  $('mkClear').textContent = t.mk.clear;
  const pillT = S.goal ? `🎯 ${t.mk.goalT[S.goal]}${ok ? ' ✓' : ''}` : t.pts(n);
  if (r === null) lab.setReadout('—', n < 3 ? t.pts(n) : '', pillT, '#ffc857');
  else lab.setReadout(`r = ${num(r)}`, corrText(r), pillT, '#ffc857');
  let st;
  if (S.preset === 'outlier') {
    const r0 = num(S.r0), rn = r === null ? null : num(r);
    if (!S.moved || rn === null) st = [t.mk.s0[0], t.mk.s0[1], t.mk.s0[2](r0), t.mk.s0[3]];
    else { const big = Math.abs(r - S.r0) >= 0.3, k = big ? t.mk.big : t.mk.small; st = [k[0], k[1], k[2](r0, rn), k[3]]; }
  } else if (S.goal) {
    if (ok) st = [t.mk.done[0], t.mk.done[1], t.mk.done[2](num(r), np), t.mk.done[3]];
    else st = ['🎯', t.mk.goal(t.mk.goalT[S.goal]), n < 6 ? t.mk.need : t.mk.now(r === null ? '—' : num(r), t.mk.tips[S.goal]), ''];
  } else if (n === 0) st = t.mk.start;
  else if (r === null) st = ['✏️', t.mk.start[1], t.mk.few, ''];
  else st = ['✏️', corrText(r), t.mk.free(num(r), np), t.mk.freeBody];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
  lab.setFacts(S.preset === 'outlier' && S.moved ? t.facts.make : []);
}

function renderCause(t) {
  const ca = S.ca, ex = ca.ex, E = t.ca.ex[ex], { X: Xv, Y: Yv } = causeXY(), r = pearson(Xv.arr, Yv.arr), asking = ex === 0 && ca.ans === null;
  lab.setGlow('rgba(255, 138, 92, .26)');
  $('caChips').innerHTML = t.ca.ex.map((e, i) => `<button type="button" class="chip sc-c ${i === ex ? 'on' : ''}" data-act="ex" data-i="${i}">${esc(e.chip)}</button>`).join('');
  const rev = ex === 0 && ca.ans !== null;
  $('caAsk').style.display = ex === 0 ? 'block' : 'none';
  if (ex === 0) {
    const cls = (i) => (!rev ? '' : i === 1 ? ' good' : i === ca.ans ? ' bad' : ' dim');
    $('caAsk').innerHTML = `<p class="sc-q">${esc(t.ca.q)}</p><div class="sc-opts">${t.ca.opts.map((o, i) => `<button type="button" class="sc-opt${cls(i)}" data-act="cpick" data-i="${i}"${rev ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>${rev ? `<p class="sc-verdict ${ca.ans === 1 ? 'ok' : 'no'}">${esc(ca.ans === 1 ? t.ca.right : t.ca.wrong)}</p>` : ''}`;
  }
  $('caAfter').style.display = asking ? 'none' : 'block';
  $('caPairs').innerHTML = asking ? '' : E.pairs.map((l, i) => `<button type="button" class="chip sc-c ${ca.pair[ex] === i ? 'on' : ''}" data-act="pair" data-i="${i}">${esc(l)}</button>`).join('');
  $('caTint').textContent = asking ? '' : `${ca.tint[ex] ? '✓ ' : ''}${E.tint}`; $('caTint').classList.toggle('on', ca.tint[ex]);
  lab.setReadout(r === null ? '—' : `r = ${num(r)}`, r === null ? '' : corrText(r), t.ca.cnt[ex](Xv.arr.length), '#ff8a5c');
  if (asking) { lab.setState({ emo: t.ca.ask[0], title: t.ca.ask[1], lead: t.ca.ask[2], body: '', extra: '' }); lab.setFacts([]); return; }
  const set = t.ca.st[ex], p = ca.pair[ex], st = p === 0 ? (ca.tint[ex] ? set.p0on : set.p0off) : p === 1 ? set.p1 : set.p2;
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: fineBox(t) });
  lab.setFacts(t.facts.cause);
}

function renderGuess(t) {
  const G = S.g, end = G.k >= 5, set = guessSet(G.run, Math.min(G.k, 4)), total = G.scores.reduce((a, b) => a + b, 0);
  lab.setGlow('rgba(183, 140, 255, .26)');
  $('gL').textContent = t.g.label;
  const sl = $('gSl'), sv = String(Math.round(G.guess * 100)); if (sl.value !== sv) sl.value = sv;
  sl.disabled = G.checked || end; $('gV').textContent = num(G.guess);
  $('scGuess').querySelector('.ends').style.display = end ? 'none' : 'flex';
  $('scGuess').querySelector('.sc-slide').style.display = end ? 'none' : 'grid';
  $('gBtn').textContent = end ? t.g.again : G.checked ? t.g.next : t.g.check;
  $('gProg').textContent = [0, 1, 2, 3, 4].map((i) => (i < G.k || (i === G.k && G.checked) ? '●' : i === G.k ? '◉' : '○')).join(' ');
  if (end) {
    const tier = total >= 400 ? 2 : total >= 250 ? 1 : 0;
    lab.setReadout(`${total}/500`, '', '', '#b78cff');
    lab.setState({ emo: '🏆', title: t.g.end(total), lead: t.g.tiers[tier], body: '', extra: fineBox(t) }); lab.setFacts([]); return;
  }
  if (!G.checked) {
    lab.setReadout('?', t.g.of(G.k + 1), '', '#b78cff');
    lab.setState({ emo: '🎯', title: t.g.title, lead: t.g.lead, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const sc = G.scores[G.k];
  lab.setReadout(`r = ${num(set.r)}`, t.g.you(num(G.guess)), t.g.score(sc), '#b78cff');
  lab.setState({ emo: sc >= 60 ? '✅' : '🤔', title: t.g.real(num(set.r)), lead: `${t.g.you(num(G.guess))} ${t.g.score(sc)}`, body: corrText(set.r), extra: '' }); lab.setFacts([]);
}

function renderGalton(t) {
  const q = S.gl, F = GAL.fit, fy = F.a + F.b * q.x, sl = $('xSl');
  lab.setGlow('rgba(111, 224, 168, .24)');
  $('xL').textContent = t.gl.slider; if (sl.value !== String(q.x)) sl.value = String(q.x); $('xV').textContent = `${q.x} ${t.sh.u.cm}`;
  lab.setReadout(`${esc(t.gl.slope)} = ${num(F.b)}`, t.gl.lessThan1, `r = ${num(GAL.r)}`, '#6fe0a8');
  lab.setState({ emo: '🧬', title: t.gl.title, lead: q.sel != null ? t.gl.fam(Math.round(GAL.x[q.sel]), Math.round(GAL.y[q.sel]), Math.round(fy)) : t.gl.lead(q.x, Math.round(fy)), body: t.gl.body(num(F.b)), extra: `<div class="sc-fine">${esc(t.gl.note)}</div>` });
  lab.setFacts([]);
}
render();
</script>
