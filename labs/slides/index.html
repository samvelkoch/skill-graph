}

function renderPk(t) {
  const P = S.pk, k = t.pk; lab.setGlow('rgba(255, 210, 90, .24)');
  $('xRow').innerHTML = `<button class="btn sl-btn" data-act="pkgo">${esc(P.run ? k.stop : k.start)}</button><button class="btn ghost sl-btn" data-act="pksaid"${P.run && !P.saidThis ? '' : ' disabled'}>${esc(k.said)}</button>`;
  lab.setReadout(`${P.said}<small style="font-size:.55em;opacity:.7"> / 20</small>`, '', '', '#e0b050');
  const st = P.done ? k.done(P.said) : P.run ? k.run(P.slide + 1, P.said) : k.idle;
  lab.setState({ emo: '⏱️', title: st[0], lead: st[1], body: '', extra: '' });
}
function renderTrap(t) {
  const R = S.tr, k = t.tr; lab.setGlow('rgba(229, 72, 77, .2)');
  $('xRow').innerHTML = `<button class="btn sl-btn" data-act="trgo"${R.phase === 'run' ? ' disabled' : ''}>${esc(k.go)}</button>`;
  lab.setReadout(R.phase === 'run' ? '▶' : R.phase === 'done' ? '⚪' : '?', '', '', '#e5484d');
  const st = R.phase === 'run' ? k.run : R.phase === 'done' ? k.done : k.idle;
  lab.setState({ emo: '📖', title: st[0], lead: st[1], body: '', extra: '' });
}
render();
</script>
</body>
</html>
