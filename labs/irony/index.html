function drawStory(c, t, dt, kind) {

function toneIdx() { return S.tone === 0 && S.sit === 0 ? 0 : S.tone === 1 && S.sit === 1 ? 3 : S.tone === 0 ? 1 : 2; }

canvasLoop($('cv'), (c, w, h, dt, time) => {

// --- controls --------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const btn = (act, label, extra = '', cls = '') => `<button class="ir-btn ${cls}" data-act="${act}" ${extra}>${esc(label)}</button>`;
const opts3 = (act, list, picked, ok) => `<div class="ir-opts">${list.map((o, i) => `<button data-act="${act}" data-i="${i}"${picked !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i, t = T[lang];
  if (act === 'mode') { S.mode = b.dataset.m; sfx.click(); }
  else if (act === 'scene') { S.sc = i; S.beat = 0; S.pred = null; S.tb = now(); sfx.click(); }
  else if (act === 'next') { S.beat++; S.tb = now(); sfx.tick(); }
  else if (act === 'pred') { S.pred = i; S.beat = 3; S.tb = now(); (i === t.st.ok[S.sc] ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'replay') { S.beat = 0; S.pred = null; S.tb = now(); sfx.click(); }
  else if (act === 'sort') {
    S.kpick = i;
    if (i === KIND[S.kix]) { S.kst = 'ok'; S.kres[S.kix] = S.kwrong ? 2 : 1; S.kc[i]++; S.kT = now(); sfx.good(); showStage(); } else { S.kst = 'bad'; S.kwrong++; S.kx[i] = true; S.kT = now(); sfx.bad(); }

// --- render ---------------------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked(), cb = $('cb');
  $('secRow').innerHTML = [['tone', '🗣️'], ['fable', '📖']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');

function renderStage(t, cb) {

  h += `<div class="ir-row">${s.scenes.map((n, i) => `<button class="chip ${sc === i ? 'on' : ''}" data-act="scene" data-i="${i}">${esc(n)}</button>`).join('')}</div><div class="ir-row">`;

  else h += btn('replay', s.replay, '', 'ir-go grow');
