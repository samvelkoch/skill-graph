function updHits() {
  const h = hitsInfo(), txt = T[lang].hits(h.k, h.n);

}
function drawConduct(c, p, dt) {
  const rv = ease(S.cRev), asked = S.cAns !== null, m = S.cm, qs = TR.qs || QS;

    c.beginPath(); c.arc(180, 160, 62, 0, TAU); c.stroke(); c.setLineDash([]);
    c.fillStyle = 'rgba(255,255,255,.07)'; c.fill();
    c.fillStyle = 'rgba(255,255,255,.4)'; c.font = '500 72px "EB Garamond", Georgia, serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 180, 164);

    c.globalAlpha = fade; c.fillStyle = isI ? (i === 0 ? COL.strong : COL.mid) : '#aab2cc'; c.strokeStyle = 'rgba(10,12,20,.8)'; c.lineWidth = 1.5;

// --- the picture --------------------------------------------------------------------------------------------
function drawGroup(c, p, dt) {
  const t = T[lang], rv = ease(S.gRev), m = S.gm, qs = TR.qs || QS;
  S.gmT += clamp((m === '222' ? 1 : 0) - S.gmT, -dt / 0.35, dt / 0.35);
  if (rv > 0.02) {

  brackets(c, GROUPS['222'], rv * S.gmT, 180, ry + 20, 54, 22, p);

    c.save(); c.font = '800 15px Nunito, sans-serif'; c.textBaseline = 'middle';
    const ws = BOAT_W.map(([, w]) => w), sp = 6, tw = ws.map((w) => c.measureText(w).width), tot = tw.reduce((a, b) => a + b, 0) + sp * 4 + 26;
    c.fillStyle = 'rgba(8,10,18,.84)'; c.strokeStyle = 'rgba(255,255,255,.1)'; c.lineWidth = 1; c.beginPath(); c.roundRect(180 - tot / 2, 306, tot, 26, 13); c.fill(); c.stroke();
    let x = 180 - tot / 2 + 13; c.textAlign = 'left';
    ws.forEach((w, i) => { c.fillStyle = i === cur ? COL.mid : '#aeb6cf'; c.fillText(w, x, 319.5); x += tw[i] + sp; });

const tuneAge = (slot, p, qs) => { if (p < 0 || !TR.slots || !TR.slots.has(slot % 12)) return 9; const k = Math.floor((p - slot) / 12); return k < 0 || k > 1 ? 9 : (p - slot - 12 * k) * qs; };

  const t = T[lang], cur = S.tn.cur, tu = cur >= 0 ? TUNES[cur] : null, qs = tu ? tu.qs : QS, ans = tu ? S.tn.ans[cur] : null;
  S.tn.rev += clamp((ans !== null ? 1 : 0) - S.tn.rev, -dt / 0.4, dt / 0.4);
  const playing = TR.on && TR.kind === 'tune' && TR.i === cur;

  [134, 262].forEach((ry, row) => {
    drawBeadRow(c, { cx: 180, ry, r: 20, sp: 52, n: 6, lvl: () => 0, age: (i) => (playing ? tuneAge(row * 6 + i, p, qs) : 9), amp: [16, 16, 16], flash: 0.85, tint: COL.teal, num: true });

canvasLoop($('cv'), (c, w, h, dt) => {
  pump();
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2, v = lab.view;
  const pg = c.createLinearGradient(0, 0, 0, h); pg.addColorStop(0, '#1b1e2c'); pg.addColorStop(1, '#14161f');
  c.fillStyle = pg; c.strokeStyle = 'rgba(130,145,190,.16)'; c.lineWidth = 1; c.beginPath(); c.roundRect(0.5, 0.5, w - 1, h - 1, 20); c.fill(); c.stroke();

// --- controls ------------------------------------------------------------------------------------------------

};

// --- one render per change: controls, readout and the state card -----------------------------------------------
function syncTransport() {
  const v = lab.view;
  if (v !== lastView) { lastView = v; resetHits(); S.cmT = 0; if (TR.kind === 'tune') stopT(); }
  if (v === 'tunes') { if (TR.kind !== 'tune') stopT(); return; }
  if (TR.kind === 'tune') stopT();
  const want = v === 'group' && S.sec === 'boat' ? 'boat' : v === 'group' && S.sec === 'skip' ? 'skip' : 'beads';

const chipsRow = (t, kind, m) => `<div class="se-r2">${['33', '222'].map((k) => `<button class="chip se-ch ${m === k ? 'on' : ''}" data-act="${kind}" data-m="${k}">${esc(kind === 'gm' ? t['g' + k] : sigOf(k))}</button>`).join('')}
  <button class="chip se-ch se-icon" data-act="pause" title="${esc(S.paused ? t.play : t.pauseL)}" aria-label="${esc(S.paused ? t.play : t.pauseL)}">${S.paused ? '▶' : '⏸'}</button></div>`;

  if (asked) {
    html += `<div class="se-v" style="color:${S.gAns === '2' ? 'var(--ok)' : 'var(--wip)'}">${esc(S.gAns === '2' ? t.groupRight : t.groupWrong)}</div>`;
    html += chipsRow(t, 'gm', S.gm);
    const sc = (k, emo, key) => `<button class="chip se-ch secret ${open ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;

function render() {
