// --- drawing helpers ---------------------------------------------------------------------------------------
function arrow(c, x, y, dx, dy, col, lw = 5) {
  const len = Math.hypot(dx, dy); if (len < 1) return;
  const ux = dx / len, uy = dy / len, hl = Math.min(len, 10 + lw), hw = hl * 0.55 + lw * 0.3;
  c.save(); c.globalAlpha = 1; c.lineCap = 'butt'; c.strokeStyle = col; c.fillStyle = col; c.lineWidth = lw;
  if (len > hl * 0.8) { c.beginPath(); c.moveTo(x, y); c.lineTo(x + dx - ux * hl * 0.8, y + dy - uy * hl * 0.8); c.stroke(); }
  c.beginPath(); c.moveTo(x + dx, y + dy);
  c.lineTo(x + dx - ux * hl - uy * hw, y + dy - uy * hl + ux * hw);
  c.lineTo(x + dx - ux * hl + uy * hw, y + dy - uy * hl - ux * hw);
  c.closePath(); c.fill(); c.restore();
}
function tag(c, text, x, y, col = '#fff', size = 12, lim) {
  c.save(); c.globalAlpha = 1; c.font = `800 ${size}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + 12, th = size + 7;
  if (lim) x = clamp(x, lim[0] + tw / 2, lim[1] - tw / 2);
  c.fillStyle = 'rgba(10,12,20,.8)'; c.beginPath(); c.roundRect(x - tw / 2, y - th / 2, tw, th, th / 2); c.fill();
  c.fillStyle = col; c.fillText(text, x, y + 1); c.restore();
}
function puck(c, x, y, r, a = 1) {
  c.save(); c.globalAlpha = a;
  c.fillStyle = '#12141f'; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  c.strokeStyle = '#a4acc8'; c.lineWidth = 2; c.stroke();
  c.fillStyle = '#262a3d'; c.beginPath(); c.arc(x, y, r * 0.72, 0, 7); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 2; c.lineCap = 'round'; c.beginPath(); c.arc(x, y, r * 0.72, Math.PI * 1.1, Math.PI * 1.6); c.stroke();
  c.restore();
}
function stone(c, x, y, r) {
  c.save(); c.globalAlpha = 1;
  c.fillStyle = '#c9ced9'; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  c.strokeStyle = '#6c7390'; c.lineWidth = 2.5; c.stroke();
  c.fillStyle = '#e0433a'; c.beginPath(); c.arc(x, y, r * 0.42, 0, 7); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2; c.lineCap = 'round'; c.beginPath(); c.arc(x, y, r * 0.8, Math.PI * 1.1, Math.PI * 1.55); c.stroke();
  c.restore();
}
// a hockey stick seen from above: the blade touches the puck at bx
function stick(c, bx, cy, u = 1) {
  c.save(); c.globalAlpha = 1; c.lineCap = 'round';
  c.strokeStyle = '#2b2118'; c.lineWidth = 9; c.beginPath(); c.moveTo(bx, cy - 14 * u); c.lineTo(bx, cy + 14 * u); c.moveTo(bx - 2, cy + 8 * u); c.lineTo(bx - 50 * u, cy - 34 * u); c.stroke();
  c.strokeStyle = '#ecd9a6'; c.lineWidth = 6; c.beginPath(); c.moveTo(bx, cy - 14 * u); c.lineTo(bx, cy + 14 * u); c.stroke();
  c.strokeStyle = '#c99a50'; c.lineWidth = 4; c.beginPath(); c.moveTo(bx - 2, cy + 8 * u); c.lineTo(bx - 50 * u, cy - 34 * u); c.stroke();
  c.restore();
}
function stickOffset(tau) { // 34 px behind the puck, swings in, touches, retreats
  if (tau < 0.18) return lerp(34, 0, ease(tau / 0.18));
  if (tau < 0.25) return 0;
  return Math.min(34, (tau - 0.25) * 120);
}
function spark(c, x, y, s) {
  c.beginPath(); c.moveTo(x, y - s); c.lineTo(x + s * 0.22, y - s * 0.22); c.lineTo(x + s, y); c.lineTo(x + s * 0.22, y + s * 0.22);
  c.lineTo(x, y + s); c.lineTo(x - s * 0.22, y + s * 0.22); c.lineTo(x - s, y); c.lineTo(x - s * 0.22, y - s * 0.22); c.closePath(); c.fill();
}

// the surface of a lane or road; patterns are anchored to the world, so they scroll with the camera
function texture(c, key, x0, y0, W, H, scroll, ppm) {
  const wrap = (v, p) => ((v % p) + p) % p;
  c.save(); c.globalAlpha = 1; c.beginPath(); c.roundRect(x0, y0, W, H, 10); c.clip();
  if (key === 'ice') {
    const gr = c.createLinearGradient(0, y0, 0, y0 + H); gr.addColorStop(0, '#d5f1fb'); gr.addColorStop(1, '#9fd5ee');
    c.fillStyle = gr; c.fillRect(x0, y0, W, H);
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1.2; c.beginPath();
    for (let i = 0; i < 70; i++) {
      const X = i * 0.97 * ppm - scroll;
      if (X < x0 - 60 || X > x0 + W + 10) continue;
      const Y = y0 + rnd(i) * H, L = (0.5 + rnd(i + 40) * 0.8) * ppm;
      c.moveTo(X, Y); c.lineTo(X + L, Y + (rnd(i + 80) - 0.5) * 6);
    }
    c.stroke();
  } else if (key === 'wood') {
    c.fillStyle = '#c99a60'; c.fillRect(x0, y0, W, H);
    const rh = H / 4, P = 2.2 * ppm;
    c.strokeStyle = '#8c5f33'; c.lineWidth = 1.5; c.beginPath();
    for (let k = 0; k < 4; k++) {
      if (k) { c.moveTo(x0, y0 + k * rh); c.lineTo(x0 + W, y0 + k * rh); }
      for (let X = x0 - P + wrap(k * 0.83 * ppm - scroll, P); X < x0 + W; X += P) { c.moveTo(X, y0 + k * rh); c.lineTo(X, y0 + (k + 1) * rh); }
    }
    c.stroke();
    c.fillStyle = 'rgba(80,45,15,.12)'; for (let k = 0; k < 4; k += 2) c.fillRect(x0, y0 + k * rh, W, rh);
  } else if (key === 'carpet') {
    c.fillStyle = '#9d3a4a'; c.fillRect(x0, y0, W, H);
    c.fillStyle = 'rgba(255,170,185,.38)';
    const sx = wrap(-scroll, 6);
    for (let j = 0; y0 + 3 + j * 6 < y0 + H; j++) for (let X = x0 + wrap(sx + (j % 2) * 3, 6); X < x0 + W; X += 6) c.fillRect(X, y0 + 3 + j * 6, 2, 2);
  } else { // dry and wet road
    const wet = key === 'wet';
    c.fillStyle = wet ? '#34506c' : '#4a4f5c'; c.fillRect(x0, y0, W, H);
    c.fillStyle = wet ? 'rgba(200,225,255,.22)' : 'rgba(255,255,255,.14)';
    const sx = wrap(-scroll, 9);
    for (let j = 0; j * 9 + 3 < H; j++) for (let X = x0 + wrap(sx + (j % 2) * 4, 9); X < x0 + W; X += 9) c.fillRect(X + rnd(j * 31 + Math.floor(X)) * 3, y0 + 3 + j * 9, 1.6, 1.6);
    if (wet) {
      c.fillStyle = 'rgba(190,225,255,.26)';
      for (let i = 0; i < 6; i++) { const X = (1.3 + i * 2.1) * ppm - scroll; c.beginPath(); c.ellipse(X, y0 + H * (0.3 + rnd(i) * 0.4), 0.7 * ppm, H * 0.16, 0, 0, 7); c.fill(); }
    }
  }
  c.restore();
}

// --- lane geometry shared by the push view and the curling secret ---------------------------------------------
const G1 = { w: 0, h: 0, u: 1, mx: 24, ppm: 30, ly: 100, lh: 84, r: 16, win: 10 };
function layout1(w, h, win = 10, ringM = 0) {
  const u = clamp(w / 360, 1, 1.5), ppm = (w - 48) / win;
  const lh = Math.max(84 * u, ringM ? 2 * ringM * ppm + 12 : 0);
  const ly = Math.max(100, (h - (lh + 44 + 60)) / 2 + 20);
  Object.assign(G1, { w, h, u, ppm, lh, ly, r: 16 * u, win });
  return G1;
}
function drawLane(c, g, key, cam, t) {
  texture(c, key, 6, g.ly, g.w - 12, g.lh, cam * g.ppm, g.ppm);
  c.save(); c.globalAlpha = 1; c.strokeStyle = 'rgba(190,205,255,.35)'; c.lineWidth = 1; c.beginPath(); c.roundRect(6, g.ly, g.w - 12, g.lh, 10); c.stroke();
  // metre marks under the lane, a label every 2 m
  const y0 = g.ly + g.lh + 6;
  c.strokeStyle = '#646C84'; c.fillStyle = '#98A0B8'; c.lineWidth = 1.5; c.font = '700 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'top';
  for (let m = Math.max(0, Math.floor(cam) - 1); m <= cam + g.win + 1.5; m++) {
    const X = g.mx + (m - cam) * g.ppm; if (X < 8 || X > g.w - 8) continue;
    const big = m % 2 === 0;
    c.beginPath(); c.moveTo(X, y0); c.lineTo(X, y0 + (big ? 9 : 5)); c.stroke();
    if (big) c.fillText(`${m} ${t.m}`, X, y0 + 11);
  }
  // the start line
  const X0 = g.mx + (0 - cam) * g.ppm;
  if (X0 > 6) { c.strokeStyle = 'rgba(255,255,255,.55)'; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(X0, g.ly); c.lineTo(X0, g.ly + g.lh); c.stroke(); }
  c.restore();
}
function flagAt(c, X, g, text, lim) {
  c.save(); c.globalAlpha = 1; c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(X, g.ly - 26); c.lineTo(X, g.ly + g.lh); c.stroke();
  c.fillStyle = '#ff3b30'; c.beginPath(); c.moveTo(X, g.ly - 26); c.lineTo(X + 20, g.ly - 19); c.lineTo(X, g.ly - 12); c.closePath(); c.fill(); c.restore();
  if (text) tag(c, text, X, g.ly - 40, '#fff', 12, lim);
}

// --- view 1: push ----------------------------------------------------------------------------------------------
function startRun() {
  const v0 = PUSH[S.push], a = SURF[S.surf].mu * G, Tm = v0 / a;
  S.run = { surf: S.surf, push: S.push, flag: S.flag, v0, a, T: Tm, D: clamp(Tm, 1.2, 4), d: v0 * v0 / (2 * a), tau: 0, x: 0, v: 0, cam: 0, done: false, verdict: null };
  sfx.push(); render();
}
function stepRun(r, dt) {
  r.tau += dt;
  if (r.tau < 0.25) return; // the hit: the puck is still at 0
  const s = Math.min((r.tau - 0.25) * r.T / r.D, r.T); // play time-scaled: a run lasts 1.2 to 4 s on screen
  r.x = r.v0 * s - r.a * s * s / 2; r.v = r.v0 - r.a * s;
  r.cam = Math.max(0, r.x - 6.5);
  if (s >= r.T) {
    r.x = r.d; r.v = 0; r.cam = Math.max(0, r.x - 6.5); r.done = true;
    r.verdict = r.flag === 'off' ? (r.surf === 'ice' ? 'great' : 'far') : (Math.abs(r.d - r.flag) <= 0.5 ? 'great' : Math.abs(r.d - r.flag) <= 1.5 ? 'close' : 'far');
    S.hist = [{ surf: r.surf, push: r.push, d: r.d }, ...S.hist].slice(0, 3);
    (r.verdict === 'far' ? sfx.bad : sfx.good)(); render(); showStage();
  }
}
function drawPush(c, w, h, dt, t) {
  const g = layout1(w, h), r = S.run;
  if (r && !r.done) stepRun(r, dt);
  const cam = r ? r.cam : 0, cy = g.ly + g.lh / 2, px = g.mx + ((r ? r.x : 0) - cam) * g.ppm, u = g.u;
  drawLane(c, g, S.surf, cam, t);
  // the flag of the guess
  if (S.flag !== null || (r && r.flag !== null)) {
    const f = r ? r.flag : S.flag, X = g.mx + ((f === 'off' ? 10 : f) - cam) * g.ppm;
    if (X > -30 && X < w + 10) flagAt(c, X, g, f === 'off' ? t.p.offTrack : dist(f), [4, w - 4]);
  }
  // the stop marker
  if (r && r.done) {
    const X = g.mx + (r.d - cam) * g.ppm;
    c.save(); c.globalAlpha = 1; c.strokeStyle = '#fff'; c.lineWidth = 2; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(X, g.ly); c.lineTo(X, g.ly + g.lh); c.stroke(); c.restore();
    tag(c, dist(r.d), X, g.ly - 14, '#fff', 12, [4, w - 4]);
  }
  // the stick, then the puck
  const bx = g.mx + (0 - cam) * g.ppm - g.r - 3 - (r ? stickOffset(r.tau) : 34);
  if (bx > -60) stick(c, bx, cy, u);
  puck(c, px, cy, g.r);
  if (r && r.tau < 0.25) { // the push exists only during the hit
    const len = r.v0 * 30 * u; arrow(c, px, cy, len, 0, FORCE.pull, 6);
    tag(c, t.p.push, px + len / 2, cy - g.r - 14, FORCE.pull, 12, [4, w - 4]);
  } else if (r && !r.done) { // friction: back, from the puck's rear edge, longer for rougher surfaces
    const len = Math.max(7, SURF[r.surf].mu * 160 * u); arrow(c, px - g.r, cy, -len, 0, FORCE.friction, 5);
    tag(c, t.p.friction, px - g.r - len / 2, cy - g.r - 14, FORCE.friction, 12, [4, w - 4]);
    tag(c, dist(r.x), px, g.ly - 14, '#fff', 12, [4, w - 4]);
  }
  // the last three runs, as dots on the same scale
  c.save(); c.globalAlpha = 1; c.font = '700 12px Nunito, sans-serif'; c.textBaseline = 'middle';
  S.hist.forEach((e, i) => {
    const y = g.ly + g.lh + 44 + i * 20, X = g.mx + Math.min(e.d, 10) * g.ppm, txt = `${t.surf[e.surf]} · ${t.pushes[e.push]} · ${dist(e.d)}`, tw = c.measureText(txt).width;
    c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(g.mx, y); c.lineTo(g.mx + 10 * g.ppm, y); c.stroke();
    c.fillStyle = SURF[e.surf].col; c.strokeStyle = '#0a0c14'; c.lineWidth = 1.5; c.beginPath(); c.arc(X, y, 6, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#D3D9E8';
    const right = X + 12 + tw < w - 6; c.textAlign = right ? 'left' : 'right';
    c.fillText(txt, right ? X + 12 : X - 12, y + 1);
    if (e.d >= 10) { c.textAlign = 'left'; c.fillStyle = SURF[e.surf].col; c.fillText('»', X + 8, y); }
  });
  c.restore();
}

// drag the flag along the lane
let dragging = false;
function dzSet(ev) {
  const rc = dz.getBoundingClientRect();
  S.flag = clamp(Math.round((ev.clientX - rc.left - G1.mx) / G1.ppm * 10) / 10, 0.1, 10); render();
}
dz.addEventListener('pointerdown', (ev) => { dragging = true; dz.setPointerCapture(ev.pointerId); dzSet(ev); sfx.tick(); });
dz.addEventListener('pointermove', (ev) => { if (dragging) dzSet(ev); });
dz.addEventListener('pointerup', () => { dragging = false; });
dz.addEventListener('pointercancel', () => { dragging = false; });

// --- secret 1: curling -----------------------------------------------------------------------------------------
function startCurl() {
  S.cu.run = { tau: 0, x: 0, v: S.cu.v, done: false, gone: false, segs: [], open: false, dd: 0, verdict: null };
  sfx.push(); render();
}
function stepCurl(r, dt) {
  r.tau += dt;
  if (r.tau < 0.25) return;
  const a = (S.cu.sweep ? 0.012 : 0.02) * G, ds = dt * 2.5, ts = Math.min(ds, r.v / a); // time runs 2.5 times faster
  r.x += r.v * ts - a * ts * ts / 2; r.v -= a * ts;
  if (S.cu.sweep) { if (!r.open) { r.segs.push([r.x, r.x]); r.open = true; } r.segs[r.segs.length - 1][1] = r.x + 1; } else r.open = false;
  if (r.v <= 1e-6 || r.x > 13) {
    r.done = true; r.gone = r.v > 1e-6; r.v = 0; r.dd = Math.abs(r.x - TARGET);
    r.verdict = r.gone ? 'far' : r.dd <= 0.4 ? 'great' : r.dd <= 1.2 ? 'close' : 'far';
    (r.verdict === 'far' ? sfx.bad : sfx.good)(); render(); showStage();
  }
}
function drawCurling(c, w, h, dt, t) {
  const g = layout1(w, h, 12, 1.2), r = S.cu.run;
  if (r && !r.done) stepCurl(r, dt);
  const cy = g.ly + g.lh / 2, u = g.u, x = r ? r.x : 0, px = g.mx + x * g.ppm;
  drawLane(c, g, 'ice', 0, t);
  // polished ice
  c.save(); c.globalAlpha = 1; c.fillStyle = 'rgba(255,255,255,.55)';
  for (const [a, b] of (r ? r.segs : [])) { const X0 = g.mx + a * g.ppm, X1 = g.mx + Math.min(b, 13) * g.ppm; c.fillRect(X0, g.ly + 2, X1 - X0, g.lh - 4); }
  // the target
  const tx = g.mx + TARGET * g.ppm;
  [[1.2, 'rgba(59,130,246,.75)'], [0.8, 'rgba(255,255,255,.9)'], [0.4, 'rgba(239,68,68,.9)']].forEach(([rm, col]) => { c.fillStyle = col; c.beginPath(); c.arc(tx, cy, rm * g.ppm, 0, 7); c.fill(); });
  c.fillStyle = '#fff'; c.beginPath(); c.arc(tx, cy, 3, 0, 7); c.fill(); c.restore();
  if (r && r.done && !r.gone) {
    c.save(); c.globalAlpha = 1; c.strokeStyle = '#fff'; c.lineWidth = 2; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(px, g.ly); c.lineTo(px, g.ly + g.lh); c.stroke(); c.restore();
    tag(c, `${fmt(r.dd)} ${t.m}`, px, g.ly - 14, '#fff', 12, [4, w - 4]);
  }
  const bx = g.mx - g.r - 3 - (r ? stickOffset(r.tau) : 34);
  stick(c, bx, cy, u);
  if (!(r && r.gone)) stone(c, px, cy, g.r);
  if (r && r.tau < 0.25) {
    const len = r.v * 30 * u; arrow(c, px, cy, len, 0, FORCE.pull, 6); tag(c, t.p.push, px + len / 2, cy - g.r - 14, FORCE.pull, 12, [4, w - 4]);

    val = `${S.ar.i + 1} / ${SCENES.length}`; col = '#ffd166';
  }
  const key = [val, sub, pill, col, lang, v, S.sec].join('|');
  if (key !== lastRO) { lastRO = key; lab.setReadout(val, sub, pill, col); }
});

// --- controls ------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, running = S.run && !S.run.done;
  if (act === 'surf' || act === 'push') {
    if (running) return;
    if (act === 'surf') S.surf = b.dataset.k; else S.push = b.dataset.k;
    S.run = null; S.flag = null; sfx.click();
  } else if (act === 'off') { S.flag = S.flag === 'off' ? null : 'off'; sfx.click(); }
  else if (act === 'go') { if (S.run) { S.run = null; S.flag = null; sfx.click(); } else { if (S.flag !== null) startRun(); return; } }
  else if (act === 'sweep') { S.cu.sweep = !S.cu.sweep; sfx.tick(); }
  else if (act === 'cgo') { if (S.cu.run) { S.cu.run = null; sfx.click(); } else { startCurl(); return; } }
  else if (act === 'bgo') { if (S.br.run) { S.br.run = null; sfx.click(); } else { startBrakes(); return; } }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k;
    if (S.sec === 'curling') S.cu = { v: 2, sweep: false, run: null };
    else if (S.sec === 'brakes') S.br = { run: null };
    else { S.run = null; S.flag = null; }
    sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'spd') return;
  if (S.cu.run && !S.cu.run.done) { ev.target.value = S.cu.v; return; }
  S.cu.v = +ev.target.value; S.cu.run = null; render();
});
askS.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.o !== undefined) { S.sp.ans = +b.dataset.o; S.sp.run = { tau: 0, x: 0 }; (S.sp.ans === 1 ? sfx.good : sfx.bad)(); render(); showStage(); }
  else nextSpace();
});
function nextSpace() { S.sp = { round: (S.sp.round + 1) % 3, ans: null, run: null, res: null }; sfx.click(); render(); }
$('nextS').addEventListener('click', nextSpace);
$('dpad').addEventListener('click', (ev) => { const b = ev.target.closest('[data-dir]'); if (b) tapDir(b.dataset.dir); });
thumbs.addEventListener('click', (ev) => {
  const b = ev.target.closest('.th'); if (!b || b.disabled) return;
  const j = +b.dataset.j; S.ar.pick = j; S.ar.t = 0; (SCENES[S.ar.i].opts[j] === 'right' ? sfx.good : sfx.bad)(); render(); showStage();
});
askA.addEventListener('click', (ev) => {
  if (!ev.target.closest('button')) return;
  S.ar = { i: (S.ar.i + 1) % SCENES.length, pick: null, t: 0 }; sfx.click(); render();
});

// --- one render per change: controls, overlays and the state card ----------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v === 'push' ? (S.sec || 'push') : v;
  if (v !== 'arrows') $('stage').style.height = '';
  $('secPush').hidden = v !== 'push';
  $('hint').hidden = v !== 'push'; dz.hidden = !(v === 'push' && !S.sec && !S.run); lastDz = '';
  askS.hidden = v !== 'space'; $('dpad').hidden = !(v === 'space' && S.sp.round > 0); $('nextS').hidden = !(v === 'space' && S.sp.round > 0 && S.sp.res);
  askA.hidden = v !== 'arrows'; thumbs.hidden = v !== 'arrows';
  const fine = `<div class="fine">${esc(t.fine)}</div>`;
  if (v === 'push') renderPush(t, fine); else if (v === 'space') renderSpace(t, fine); else renderArrows(t, fine);
}
function renderPush(t, fine) {
  const sec = S.sec, run = S.run, running = run && !run.done, done = run && run.done, open = secret.unlocked();
  lab.setGlow(sec === 'brakes' ? 'rgba(224, 164, 92, .24)' : 'rgba(80, 160, 220, .28)');
  $('mainCtl').hidden = !!sec; $('curlCtl').hidden = sec !== 'curling'; $('brakeCtl').hidden = sec !== 'brakes';
  $('secChips').innerHTML = [['curling', '🥌'], ['brakes', '🚲']].map(([k, e]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const hint = $('hint'); let htxt = '', hcol = '';
  if (!sec) {
    $('surfChips').innerHTML = Object.keys(SURF).map((k) => `<button class="chip ${S.surf === k ? 'on' : ''}" data-act="surf" data-k="${k}"${running ? ' disabled' : ''}><i class="sw sw-${k}"></i>${esc(t.surf[k])}</button>`).join('');
    $('pushChips').innerHTML = Object.keys(PUSH).map((k) => `<button class="chip ${S.push === k ? 'on' : ''}" data-act="push" data-k="${k}"${running ? ' disabled' : ''}>${esc(t.pushes[k])}</button>`).join('');
    const off = $('offB'); off.hidden = S.surf !== 'ice' || !!run; off.textContent = t.p.offTrack; off.classList.toggle('on', S.flag === 'off');
    const go = $('goB'); go.textContent = done ? t.next : t.p.go; go.disabled = !!running || (!run && S.flag === null);
    dz.setAttribute('aria-label', t.p.flag);
    if (!run) htxt = t.p.flag; else if (running && run.surf === 'ice') htxt = t.p.still; else if (done) { htxt = t.p[run.verdict]; hcol = VERDICT[run.verdict]; }
    const c = t.card.push;
    lab.setState(done ? { emo: run.verdict === 'far' ? '🤔' : '✅', title: t.p[run.verdict], lead: t.p.why[run.surf], body: c[3], extra: fine }
      : { emo: c[0], title: c[1], lead: c[2], body: c[3], extra: fine });
  } else if (sec === 'curling') {
    const cu = S.cu, r = cu.run, run2 = r && !r.done;
    $('spdTxt').textContent = `${t.sec.speed}: ${fmt(cu.v)} ${t.ms}`;
    const sl = $('spd'); if (+sl.value !== cu.v) sl.value = cu.v; sl.disabled = !!run2;
    const sw = $('swB'); sw.textContent = t.sec.sweep; sw.classList.toggle('on', cu.sweep);
    const go = $('cGo'); go.textContent = r && r.done ? t.next : t.p.go; go.disabled = !!run2;
    if (r && r.done) { htxt = t.p[r.verdict]; hcol = VERDICT[r.verdict]; }
    lab.setState({ emo: '🥌', title: t.secrets.curling[0], lead: t.secrets.curling[1], body: t.sec.curlText, extra: fine });
  } else {
    const br = S.br.run, go = $('bGo'); go.textContent = br && br.done ? t.next : t.sec.brake; go.disabled = !!(br && !br.done);
    lab.setState({ emo: '🚲', title: t.secrets.brakes[0], lead: t.secrets.brakes[1], body: t.sec.brakeText, extra: fine });
  }
  hint.textContent = htxt; hint.style.color = hcol || 'var(--soft)'; hint.hidden = !htxt;
}
function renderSpace(t, fine) {
  const sp = S.sp, rd = sp.round, res = sp.res;
  lab.setGlow('rgba(140, 90, 230, .3)');
  if (rd === 0) {
    if (sp.ans === null) askS.innerHTML = `<div class="q">${esc(t.s.q1)}</div><div class="opts">${t.s.o1.map((o, i) => `<button class="o" data-o="${i}">${esc(o)}</button>`).join('')}</div>`;
    else {
      const ok = sp.ans === 1;
      askS.innerHTML = `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.wrong)}</div><div class="correct">✓ ${esc(t.s.o1[1])}</div><p>${esc(t.s.r1)}</p><button class="btn">${esc(t.next)}</button>`;
    }
  } else {
    const R = ROUNDS[rd], msg = !res ? '' : rd === 1 ? (res.ok ? t.s.turnRight : t.s.turnWrong[res.dir]) : (res.ok ? t.s.stopRight : t.s.stopWrong);
    askS.innerHTML = `<div class="q">${esc(rd === 1 ? t.s.q2 : t.s.q3)}</div><div class="res">${res ? `<div class="msg" style="color:${res.ok ? 'var(--ok)' : 'var(--wip)'}">${esc(msg)}</div>` : ''}</div>`;
    $('dpad').innerHTML = ['up', 'left', 'down', 'right'].map((d) =>
      `<button data-dir="${d}" aria-label="${GLYPH[d]}" class="${res && d === R.ok ? 'good' : res && !res.ok && d === res.dir ? 'bad' : ''}">${GLYPH[d]}</button>`).join('');
    $('nextS').textContent = t.next;
  }
  const c = t.card.space; lab.setState({ emo: c[0], title: c[1], lead: c[2], body: c[3], extra: fine });
}
function renderArrows(t, fine) {
  const sc = SCENES[S.ar.i], pick = S.ar.pick, okIdx = sc.opts.indexOf('right'), ok = pick === okIdx;
  lab.setGlow('rgba(255, 209, 102, .2)');
  askA.innerHTML = `<div class="scn">${esc(t.a.scene[sc.key])}</div>` + (pick === null ? `<div class="q">${esc(t.a.q)}</div>`
    : `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.wrong)}</div><p>${esc(t.a.why[sc.key])}</p><button class="btn">${esc(t.next)}</button>`);
  thumbs.innerHTML = sc.opts.map((o, j) => {
    const cls = pick === null ? '' : j === okIdx ? 'good' : j === pick ? 'bad' : 'dim';
    return `<button class="th ${cls}" data-j="${j}" aria-label="${j + 1}"${pick !== null ? ' disabled' : ''}><canvas></canvas><span class="cap">${o === 'none' ? esc(t.a.none) : ''}</span></button>`;
  }).join('');
  requestAnimationFrame(paintThumbs);
  const c = t.card.arrows; lab.setState({ emo: c[0], title: c[1], lead: c[2], body: c[3], extra: fine });
}
render();
</script>
</body>
