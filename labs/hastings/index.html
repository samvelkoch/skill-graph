  c.quadraticCurveTo(x - k * .72, y + k * .7, x - k * .72, y); c.closePath();
  const g2 = c.createLinearGradient(x - k, y - k, x + k, y + k); g2.addColorStop(0, '#fff6'); g2.addColorStop(0.35, col); g2.addColorStop(1, col);

function drawWho(c, w, h, t) {
  const s = Math.min(w / MAP_W, h / MAP_H), ox = (w - MAP_W * s) / 2, oy = (h - MAP_H * s) / 2, fs = 12.5 / s, P = T[lang].who;

  }
  c.save(); c.font = `italic 500 ${fs * 1.08}px "EB Garamond", Georgia, serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  for (const [k, x, y] of [['harold', 178, 130], ['harald', 318, 28], ['william', 262, 296]]) {

    c.lineWidth = fs * 0.28; c.strokeStyle = 'rgba(15,25,20,.6)'; c.strokeText(txt, x, y); c.fillStyle = 'rgba(255,255,255,.86)'; c.fillText(txt, x, y);
  }

  // compass
  c.save(); c.translate(26, 36); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(0, 12); c.lineTo(0, -10); c.moveTo(-5, -4); c.lineTo(0, -10); c.lineTo(5, -4); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.7)'; c.font = `800 ${Math.max(11, fs * 0.9)}px Nunito, sans-serif`; c.textAlign = 'center'; c.fillText('N', 0, -17); c.restore();

  const placed = (i) => S.ord.includes(i);
  // routes of the two invasions grow when their events are placed
  for (const [k, ei] of [['harald', 1], ['william', 2]]) {
    if (!placed(ei)) continue;
    const u = ease((t - S.evT[ei]) / 1.6), r = ROUTE[k];
    c.beginPath();
    for (let j = 0; j <= 24; j++) { const [x, y] = qb(r, (j / 24) * u); if (j === 0) c.moveTo(x, y); else c.lineTo(x, y); }
    c.lineCap = 'round'; c.setLineDash([]); c.lineWidth = 6; c.strokeStyle = 'rgba(0,0,0,.4)'; c.stroke();
    c.setLineDash([7, 6]); c.lineDashOffset = -t * 14; c.lineWidth = 3.4; c.strokeStyle = k === 'harald' ? '#8fb8ff' : '#ff8f84'; c.stroke(); c.setLineDash([]); c.lineDashOffset = 0;

    c.save(); c.globalAlpha = a; const g = c.createRadialGradient(x, y, 2, x, y, 22); g.addColorStop(0, 'rgba(255,230,160,.7)'); g.addColorStop(1, 'rgba(255,230,160,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, 22, 0, TAU); c.fill(); c.restore();
    c.save(); c.globalAlpha = a; emoji(c, '🕯️', x, y, 22); c.restore();

  if (placed(1)) { const [x, y] = POI.stamford, u = ease((t - S.evT[1] - 1.2) / 0.5); if (u > 0) { emoji(c, '⚔️', x, y, 22 * u); pill(c, P.places.stamford, x - 16 - 44, y, fs, { max: MAP_W }); } }
  if (placed(3)) { const [x, y] = POI.hastings, u = ease((t - S.evT[3]) / 0.5); emoji(c, '⚔️', x, y, 22 * u); pill(c, P.places.hastings, x + 18 + 34, y, fs, { max: MAP_W }); }
  // the three claimants
  for (const k of KEYS) {
    const [x, y] = CL[k].pos, sel = S.msg && S.msg.t === 'sel' && S.msg.k === k;
    const win = S.guess !== null && k === 'william';
    if (sel) { c.save(); c.setLineDash([5, 5]); c.lineDashOffset = -t * 10; c.lineWidth = 2.2; c.strokeStyle = '#fff'; c.beginPath(); c.arc(x, y + 2, 28, 0, TAU); c.stroke(); c.restore(); }
    shield(c, x, y, 17, CL[k].col, CL[k].emo, t, win);

  }
  if (S.guess !== null) {
    const [x, y] = CL.william.pos, u = ease((t - S.guessT) / 0.7), bob = Math.sin(t * 2.4) * 2;
    emoji(c, '👑', x, y - 34 - bob + (1 - u) * -16, 26 * Math.max(0.01, u));
  }
  c.restore();
}

  const ox = w / 2 - S.cx * s;
  geo = { s, ox };
  const x0 = Math.max(0, S.cx - w / 2 / s - 4), x1 = Math.min(TOTAL, S.cx + w / 2 / s + 4);
  c.save(); c.translate(ox, oy); c.scale(s, s);
  c.save(); c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 22; c.shadowOffsetY = 6; c.fillStyle = '#d8c79c'; c.fillRect(x0, 0, x1 - x0, DH); c.restore();
  c.save(); c.beginPath(); c.rect(x0, 0, x1 - x0, DH); c.clip();
  stripBase(c, x0, x1);
  for (let i = 0; i < NS; i++) if ((i + 1) * SW > x0 && i * SW < x1) drawScene(c, i, t, fs);
  if (x0 <= 0) { c.fillStyle = 'rgba(70,45,25,.35)'; c.fillRect(0, 0, 3, DH); }
  if (x1 >= TOTAL) { c.fillStyle = 'rgba(70,45,25,.35)'; c.fillRect(TOTAL - 3, 0, 3, DH); }
  c.restore();
  if (S.scene >= 0) {
    c.beginPath(); c.roundRect(S.scene * SW + 4, 30, SW - 8, 150, 9); c.setLineDash([8, 5]); c.lineDashOffset = -t * 8; c.lineWidth = 2.4; c.strokeStyle = 'rgba(255,196,70,.95)'; c.stroke(); c.setLineDash([]); c.lineDashOffset = 0;
  }
  if (S.sec === 'comet') {
    const cx = 2 * SW + 208, cy = 84, r = 26 + Math.sin(t * 3) * 2;
    c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.setLineDash([6, 4]); c.lineWidth = 2.4; c.strokeStyle = '#7a2a1c'; c.stroke(); c.setLineDash([]);
    pill(c, P.cometTag, cx, cy + r + fs * 1.2, fs);
  } else if (S.sec === 'arrow') {
    for (const [cx, cy, r] of [[5 * SW + 66, 114, 17], [5 * SW + 188, 150, 26]]) {
      c.beginPath(); c.arc(cx, cy, r + Math.sin(t * 3) * 1.5, 0, TAU); c.setLineDash([6, 4]); c.lineWidth = 2.4; c.strokeStyle = '#7a2a1c'; c.stroke(); c.setLineDash([]);
      pill(c, '?', cx, cy - r - fs * 1.1, fs);
    }
  }
  c.restore();
}

function drawSource(c, w, h, t) {
  const W = 360, H = 290, s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2, fs = 12.5 / s, P = T[lang].src;
  geo = { s, ox, oy };
  c.save(); c.translate(ox, oy); c.scale(s, s);
  c.beginPath(); c.roundRect(0, 0, W, H, 16); c.clip();
  const wall = c.createLinearGradient(0, 0, 0, H); wall.addColorStop(0, '#33251d'); wall.addColorStop(1, '#1c1511');
  c.fillStyle = wall; c.fillRect(0, 0, W, H);
  const vg = c.createRadialGradient(180, 100, 40, 180, 110, 260); vg.addColorStop(0, 'rgba(255,200,120,.16)'); vg.addColorStop(1, 'rgba(0,0,0,.35)');
  c.fillStyle = vg; c.fillRect(0, 0, W, H);
  // frame
  c.save(); c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 18; c.shadowOffsetY = 6;
  const fg = c.createLinearGradient(0, 14, 0, 196); fg.addColorStop(0, '#8a6038'); fg.addColorStop(1, '#4f3421');
  c.beginPath(); c.roundRect(22, 16, 316, 180, 7); c.fillStyle = fg; c.fill(); c.restore();
  c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,225,170,.35)'; c.beginPath(); c.roundRect(24, 18, 312, 176, 6); c.stroke();
  c.lineWidth = 2; c.strokeStyle = '#2a1b10'; c.beginPath(); c.roundRect(33, 27, 294, 154, 3); c.stroke();
  // the cloth inside, knights charging
  const k = 290 / SW, wx = 35, wy = 29;
  c.save(); c.beginPath(); c.rect(wx, wy, 290, 150); c.clip();
  c.translate(wx, wy); c.scale(k, k); c.translate(-4 * SW, -30); paintCloth(c, 4, t, fs / k); c.restore();
  // a magnifying glass drifting over it
  const lx = 180 + Math.sin(t * 0.5) * 70, ly = 104 + Math.sin(t * 0.37) * 22, lr = 32, M = 1.9;
  c.save(); c.beginPath(); c.arc(lx, ly, lr, 0, TAU); c.clip();
  c.translate(lx, ly); c.scale(M, M); c.translate(-lx, -ly);
  c.translate(wx, wy); c.scale(k, k); c.translate(-4 * SW, -30); paintCloth(c, 4, t, fs / (k * M)); c.restore();
  const hx = lx + lr * 0.7, hy = ly + lr * 0.7;
  limb(c, hx, hy, hx + 26, hy + 26, 7, COL.brown);
  c.beginPath(); c.arc(lx, ly, lr, 0, TAU); c.lineWidth = 5; c.strokeStyle = '#c9a23b'; c.stroke(); c.lineWidth = 1.2; c.strokeStyle = 'rgba(0,0,0,.5)'; c.stroke();
  c.beginPath(); c.arc(lx, ly, lr - 6, Math.PI * 1.1, Math.PI * 1.45); c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.55)'; c.stroke();
  // ribbon
  const rg = c.createLinearGradient(0, 214, 0, 272); rg.addColorStop(0, '#f0e4c4'); rg.addColorStop(1, '#dcc99b');
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 10; c.shadowOffsetY = 3;
  c.beginPath(); c.moveTo(16, 212); c.lineTo(344, 212); c.lineTo(332, 242); c.lineTo(344, 272); c.lineTo(16, 272); c.lineTo(28, 242); c.closePath(); c.fillStyle = rg; c.fill(); c.restore();
  c.lineWidth = 1.4; c.strokeStyle = OUT; c.stroke();
  c.setLineDash([5, 4]); c.lineWidth = 1; c.strokeStyle = COL.rust; c.beginPath(); c.moveTo(34, 217); c.lineTo(326, 217); c.moveTo(34, 267); c.lineTo(326, 267); c.stroke(); c.setLineDash([]);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  if (S.sGuess === null) {
    c.font = `500 ${Math.max(20, fs * 1.4)}px "EB Garamond", Georgia, serif`; c.fillStyle = '#4a2a1c'; c.fillText(P.tagQ, W / 2, 242);
  } else {
    const u = ease((t - S.sGuessT) / 0.6);
    shield(c, 56, 240, 13, CL.william.col, CL.william.emo, t, false);
    emoji(c, '👑', 56, 214 - (1 - u) * 14 - Math.sin(t * 2.4) * 1.5, 20 * Math.max(0.01, u));
    c.globalAlpha = u;
    c.font = `500 ${Math.max(18, fs * 1.3)}px "EB Garamond", Georgia, serif`; c.fillStyle = '#4a2a1c'; c.fillText(P.tagA[0], 204, 235);
    c.font = `800 ${fs}px Nunito, sans-serif`; c.fillStyle = COL.rust; c.fillText(P.tagA[1], 204, 255);
    c.globalAlpha = 1;
  }
  c.restore();
}

// --- pointer: drag the cloth, tap a scene or a shield -----------------------------------------------------------------
const cv = $('cv');
const nearest = () => clamp(Math.round((S.cx - LO) / SW), 0, NS - 1);
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view === 'tapestry') drag = { x: ev.clientX, cx: S.cx, moved: false };
  else if (lab.view === 'who') drag = { x: ev.clientX, moved: false };
  else return;
  try { cv.setPointerCapture(ev.pointerId); } catch { /* ignore */ }
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const dx = ev.clientX - drag.x;
  if (Math.abs(dx) > 6) drag.moved = true;
  if (drag.moved && lab.view === 'tapestry' && geo) { S.cx = clamp(drag.cx - dx / geo.s, LO, HI); S.cxT = S.cx; cv.style.cursor = 'grabbing'; }
});
cv.addEventListener('pointercancel', () => { drag = null; cv.style.cursor = ''; });
cv.addEventListener('pointerup', (ev) => {
  const d = drag; drag = null; cv.style.cursor = '';
  if (!d || !geo) return;
  const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  if (lab.view === 'tapestry') {
    if (d.moved) selectScene(nearest(), true);
    else { const wx = (px - geo.ox) / geo.s; if (wx >= 0 && wx < TOTAL) selectScene(Math.floor(wx / SW), true); }
  } else if (lab.view === 'who' && !d.moved) {
    const mx = (px - geo.ox) / geo.s, my = (py - geo.oy) / geo.s;
    for (const k of KEYS) {
      const [x, y] = CL[k].pos;
      if (Math.hypot(mx - x, my - y) < 26) { S.msg = { t: 'sel', k }; sfx.tick(); render(); return; }
    }
  }
});

function selectScene(i, tick) {
  S.scene = i; S.cxT = clamp(i * SW + SW / 2, LO, HI); S.sec = null; S.tMsg = null;
  if (!S.read.includes(i)) S.read.push(i);
  if (tick) sfx.tick();
  render();
}

// --- controls ---------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k, i = +b.dataset.i;
  let shake = null;
  if (a === 'sel') { S.msg = S.msg && S.msg.t === 'sel' && S.msg.k === k ? null : { t: 'sel', k }; sfx.tick(); }
  else if (a === 'guess') { S.guess = k; S.guessT = now(); S.msg = null; (k === 'william' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'ev') {
    if (S.ord.includes(i)) return;
    if (i === S.ord.length) { S.ord.push(i); S.evT[i] = now(); S.msg = S.ord.length === 4 ? { t: 'done' } : { t: 'ev', i }; sfx.good(); showStage(); }
    else { S.msg = { t: 'hint', k: S.ord.length }; sfx.bad(); shake = `[data-act=ev][data-i="${i}"]`; }
  }
  else if (a === 'again') { S.ord = []; S.evT = []; S.msg = null; S.shuf++; sfx.click(); }
  else if (a === 'scene') { selectScene(i, true); return; }
  else if (a === 'prev') { selectScene(clamp((S.scene < 0 ? 1 : S.scene) - 1, 0, NS - 1), true); return; }
  else if (a === 'next') { selectScene(clamp(S.scene + 1, 0, NS - 1), true); return; }
  else if (a === 'tord') {
    if (S.tOrd.includes(i)) return;
    if (i === ORD[S.tOrd.length]) {
      S.tOrd.push(i); sfx.good();
      S.scene = i; S.cxT = clamp(i * SW + SW / 2, LO, HI); S.sec = null; if (!S.read.includes(i)) S.read.push(i);
      S.tMsg = S.tOrd.length === 4 ? { t: 'done' } : { t: 'ok', i }; showStage();
    } else { S.tMsg = { t: 'bad' }; sfx.bad(); shake = `[data-act=tord][data-i="${i}"]`; }
  }
  else if (a === 'tagain') { S.tOrd = []; S.tMsg = null; S.tShuf++; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    S.sec = S.sec === k ? null : k;
    if (S.sec) { const sc = k === 'comet' ? 2 : 5; S.scene = sc; S.cxT = clamp(sc * SW + SW / 2, LO, HI); S.tMsg = null; if (!S.read.includes(sc)) S.read.push(sc); }
    sfx.click();
  }
  else if (a === 'sguess') { S.sGuess = k; S.sGuessT = now(); (k === 'not' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'flag') { if (S.checked) return; S.flags[i] = !S.flags[i]; sfx.tick(); }
  else if (a === 'scheck') { S.checked = true; (S.flags.every((f, j) => f === CHECK[j]) ? sfx.good : sfx.snap)(); }
  else if (a === 'sagain') { S.flags = [false, false, false, false]; S.checked = false; sfx.click(); }
  render();
  if (shake) $('ctrlBody').querySelector(shake)?.classList.add('shk');
});

// --- one render per change ----------------------------------------------------------------------------------------------
function render() {
  const v = lab.view, t = T[lang];
  document.body.dataset.v = v;
  $('secWho').hidden = v !== 'who'; $('secTap').hidden = v !== 'tapestry'; $('secSrc').hidden = v !== 'source';
  if (v === 'who') renderWho(t); else if (v === 'tapestry') renderTap(t); else renderSrc(t);
}

function renderWho(t) {
  const w = t.who, asking = S.guess === null, m = S.msg, right = S.guess === 'william';
  lab.setGlow('rgba(201, 162, 59, .24)');
  const cards = KEYS.map((k) => `<button class="hs-card ${m && m.t === 'sel' && m.k === k ? 'on' : ''}" data-act="sel" data-k="${k}"><span class="e">${CL[k].emo}</span><b>${esc(w.names[k])}</b><small>${esc(w.lands[k])}</small></button>`).join('');
  let top;
  if (asking) {
    top = `<div class="hs-q first">${esc(w.q)}</div><div class="hs-opts">${KEYS.map((k) => `<button class="chip" data-act="guess" data-k="${k}">${esc(w.names[k])}</button>`).join('')}</div>`;
  } else {
    const done = S.ord.length === 4;
    const order = SH[S.shuf % 2];
    top = `<div class="hs-q sm first">${esc(w.ordQ)}</div><div class="hs-evs">${order.map((i) => {
      const at = S.ord.indexOf(i);
      return `<button class="hs-ev ${at >= 0 ? 'done' : ''}" data-act="ev" data-i="${i}">${at >= 0 ? `<span class="n">${at + 1}</span>` : ''}<span>${esc(w.ev[i].n)}${at >= 0 ? `<small>${esc(w.ev[i].d)}</small>` : ''}</span></button>`;
    }).join('')}</div>${done ? `<div class="hs-row"><button class="chip" data-act="again">${esc(w.again)}</button></div>` : ''}`;
  }
  $('secWho').innerHTML = `${top}<div class="hs-lbl">${esc(w.meet)}</div><div class="hs-cards">${cards}</div>`;
  let st;
  if (m && m.t === 'sel') st = { emo: CL[m.k].emo, title: `${w.names[m.k]} · ${w.lands[m.k]}`, lead: w.bios[m.k], body: '' };
  else if (m && m.t === 'ev') st = { emo: '📜', title: w.ev[m.i].t, lead: w.ev[m.i].l, body: '' };
  else if (m && m.t === 'hint') st = { emo: '🤔', title: w.notYet, lead: w.hints[m.k], body: '' };
  else if (m && m.t === 'done') st = { emo: '🏁', title: w.done[0], lead: w.ev[3].l, body: w.done[1] };
  else if (asking) st = { emo: '🤔', title: w.q, lead: w.qLead, body: '' };
  else st = { emo: right ? '✅' : '🤔', title: right ? w.right : w.wrong, lead: w.win, body: w.ordQ };
  lab.setState(st);
  if (asking) lab.setReadout('?', w.rsub, '', '#c9a23b'); else lab.setReadout(`${S.ord.length}/4`, w.rsub2, '1066', '#c9a23b');
  lab.setFacts([{ emo: '📅', text: t.facts.date, src: SRC.date }]);
}

function renderTap(t) {
  const p = t.tap, open = secret.unlocked(), m = S.tMsg;
  lab.setGlow('rgba(181, 85, 58, .26)');
  const chips = SC_EMO.map((e, i) => `<button class="chip ${S.scene === i ? 'on' : ''} ${S.read.includes(i) ? 'rd' : ''}" data-act="scene" data-i="${i}" aria-label="${esc(p.scenes[i].n)}" title="${esc(p.scenes[i].n)}">${e}</button>`).join('');
  const order = SHS[S.tShuf % 2], done = S.tOrd.length === 4;
  const cards = order.map((i) => {
    const at = S.tOrd.indexOf(i);
    return `<button class="hs-ev ${at >= 0 ? 'done' : ''}" data-act="tord" data-i="${i}">${at >= 0 ? `<span class="n">${at + 1}</span>` : `<span class="e">${SC_EMO[i]}</span>`}<span>${esc(p.scenes[i].n)}</span></button>`;
  }).join('');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secTap').innerHTML = `<div class="hs-scs">${chips}</div>
    <div class="hs-nav"><button class="chip" data-act="prev" aria-label="${esc(p.prev)}">◀</button><span class="hs-cnt">${esc(p.readN(S.read.length))}</span><button class="chip" data-act="next" aria-label="${esc(p.next)}">▶</button></div>
    <div class="hs-q sm">${esc(p.ordQ)}</div><div class="hs-evs">${cards}</div>
    ${done ? `<div class="hs-row"><button class="chip" data-act="tagain">${esc(p.again)}</button></div>` : ''}
    <div class="hs-row">${sc('comet', '☄️')}${sc('arrow', '🏹')}</div>`;
  let st;
  if (m && m.t === 'bad') st = { emo: '🤔', title: p.bad[0], lead: p.bad[1], body: '' };
  else if (m && m.t === 'done') st = { emo: '🏁', title: p.done[0], lead: p.done[1], body: '' };
  else if (m && m.t === 'ok') st = { emo: SC_EMO[m.i], title: p.okT, lead: `${p.scenes[m.i].t}. ${p.scenes[m.i].l}`, body: '' };
  else if (S.sec) { const x = p.sec[S.sec]; st = { emo: S.sec === 'comet' ? '☄️' : '🏹', title: x[0], lead: x[1], body: x[2] }; }
  else if (S.scene >= 0) st = { emo: SC_EMO[S.scene], title: p.scenes[S.scene].t, lead: p.scenes[S.scene].l, body: '' };
  else st = { emo: '🧵', title: p.intro[0], lead: p.intro[1], body: p.intro[2] };
  lab.setState(st);
  lab.setReadout(`${S.read.length}/6`, p.rsub, S.tOrd.length ? `${S.tOrd.length}/4 ✓` : '', '#b5553a');
  lab.setFacts([{ emo: '📏', text: t.facts.len, src: SRC.len }, { emo: '☄️', text: t.facts.comet, src: SRC.comet }]);
}

function renderSrc(t) {
  const s = t.src, asking = S.sGuess === null, nFlag = S.flags.filter(Boolean).length;
  lab.setGlow('rgba(63, 106, 122, .3)');
  if (asking) {
    $('secSrc').innerHTML = `<div class="hs-q first">${esc(s.q)}</div><div class="hs-opts"><button class="chip" data-act="sguess" data-k="yes">${esc(s.opts[0])}</button><button class="chip" data-act="sguess" data-k="not">${esc(s.opts[1])}</button></div>`;
  } else {
    const rows = s.st.map((x, i) => {
      const cls = S.checked ? (S.flags[i] === CHECK[i] ? 'good' : 'bad') : '';
      const mark = S.checked ? (CHECK[i] ? '🔍 ' : '✓ ') : '';
      return `<button class="hs-ev ${cls} ${S.flags[i] ? 'flag' : ''}" data-act="flag" data-i="${i}"${S.checked ? ' disabled' : ''} aria-pressed="${S.flags[i]}"><span class="e">${S.flags[i] ? '🔍' : '◻️'}</span><span>${esc(x.x)}${S.checked ? `<span class="why">${mark}${esc(x.why)}</span>` : ''}</span></button>`;
    }).join('');
    $('secSrc').innerHTML = `<div class="hs-q sm first">${esc(s.sQ)}</div><div class="hs-sts">${rows}</div>
      <div class="hs-row">${S.checked ? `<button class="btn ghost" data-act="sagain">${esc(s.again)}</button>` : `<button class="btn" data-act="scheck">${esc(s.check)}</button>`}</div>`;
  }
  let st;
  if (asking) st = { emo: '🤔', title: s.q, lead: s.qLead, body: '' };
  else if (S.checked) {
    const k = S.flags.filter((f, j) => f === CHECK[j]).length;
    st = { emo: k === 4 ? '✅' : '🤔', title: s.res(k), lead: s.resLead, body: '' };
  } else { const r = S.sGuess === 'not' ? s.right : s.wrong; st = { emo: S.sGuess === 'not' ? '✅' : '🤔', title: r[0], lead: r[1], body: '' }; }
  lab.setState(st);
  if (asking) lab.setReadout('?', s.rsub, '', '#3f6a7a');
  else lab.setReadout(`🔍 ${nFlag}`, s.rsub2, S.checked ? `${S.flags.filter((f, j) => f === CHECK[j]).length}/4 ✓` : '', '#3f6a7a');
  lab.setFacts([{ emo: '📏', text: t.facts.len, src: SRC.len }]);
}

render();
</script>
</body>
</html>
