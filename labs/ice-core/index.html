  if (S.sec || busy()) return;
  const v = lab.view, [x, y] = pt(ev); if (S.pd[v] === null) return;
  if (v === 'drill' && G.drill && x < G.drill.cardR) { S.drag = { k: 'depth' }; setDepthY(y); }
  else if (v === 'bubbles' && G.bub && y >= G.bub.y0 && x >= G.bub.L - 8 && x <= G.bub.Rr + 8) { S.drag = { k: 'age' }; setAgeX(x); }
  else if (v === 'volcano' && S.vmode === 'count') S.drag = { k: 'scroll', y0: y, n0: S.n, moved: false };
  else if (v === 'volcano' && G.match && x >= G.match.Bx - 14 && x <= G.match.Bx + G.match.sw + 14) S.drag = { k: 'off', y0: y, o0: S.off };
  if (S.drag) cv.setPointerCapture?.(ev.pointerId);
});
cv.addEventListener('pointermove', (ev) => {
  const d = S.drag; if (!d) return; const [x, y] = pt(ev);
  if (d.k === 'depth') setDepthY(y); else if (d.k === 'age') setAgeX(x);
  else if (d.k === 'scroll') { if (Math.abs(y - d.y0) > 3) d.moved = true; S.n = clamp(d.n0 + (d.y0 - y) / LH, 0, LMAX); readout(); }
  else if (d.k === 'off' && G.match) setOff(d.o0 + (y - d.y0) / G.match.lh);
});
const endDrag = (ev) => {
  const d = S.drag; S.drag = null; if (!d) return;
  if (d.k === 'scroll' && !d.moved && G.vol) { // tap on a dark layer: go to it and read its year
    const [, y] = pt(ev), hit = DK.find((i) => Math.abs(G.vol.rY + (i - S.n) * LH - y) < Math.max(LH, 10));
    if (hit !== undefined) { sfx.tick(); tween(S, 'n', hit, 0.6, eio, render); render(); }
  }
};
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', () => { S.drag = null; });

$('dSl').addEventListener('input', (e) => { if (busy()) return; S.depth = +e.target.value; readout(); });
$('aSl').addEventListener('input', (e) => { if (busy()) return; S.age = 800000 - +e.target.value * 1000; readout(); });
$('vSl').addEventListener('input', (e) => { if (busy()) return; if (S.vmode === 'count') { S.n = +e.target.value; readout(); } else setOff(+e.target.value); });
$('crushB').addEventListener('click', () => { if (busy()) return; S.crushed = true; S.crushAt = nowS(); sfx.push(); });
$('vModes').addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (!b || busy()) return; S.vmode = b.dataset.m; sfx.click(); render(); });
$('icSecs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.secT = 0; if (S.sec) tween(S, 'secT', 1, 0.4, eo); sfx.click(); render();
});
$('icPred').addEventListener('click', (e) => {
  const b = e.target.closest('[data-i]'); if (!b || b.disabled) return;
  answer(lab.view, +b.dataset.i);
});
function answer(v, i) {
  if (S.pd[v] !== null) return;
  S.pd[v] = i; (i === 0 ? sfx.good : sfx.bad)();
  if (v === 'drill') tween(S, 'depth', 2500, 4.5, eio, render);
  else if (v === 'bubbles') {
    S.crushed = true; S.crushAt = -99; S.age = 800000; S.needle = 150; S.nv = 0;
    tween(S, 'chartA', 1, 0.7, eo, () => tween(S, 'age', 20000, 6.5, eio, render));
  } else tween(S, 'n', 210, 4.5, eio, render);
  render(); showStage();
}

// --- one render per change: controls, readout and the state card -------------------------------------------------------------
function renderPred() {
  const t = T[lang], v = lab.view, p = S.pd[v];
  const K = { drill: ['qLayers', 'optsLayers'], bubbles: ['qIceAge', 'optsIceAge'], volcano: ['qTambora', 'optsTambora'] }[v], opts = t[K[1]];
  $('icPred').innerHTML = `<div class="ic-q">${esc(t[K[0]])}</div><div class="chips">${S.ord[v].map((i) =>
    `<button class="chip ic-opt ${p === null ? '' : i === 0 ? 'ic-good' : i === p ? 'ic-bad' : ''}" data-i="${i}"${p === null ? '' : ' disabled'}>${esc(opts[i])}</button>`).join('')}</div>${
    p === null ? '' : `<div class="ic-verdict" style="color:${p === 0 ? 'var(--ok)' : 'var(--wip)'}">${esc(p === 0 ? t.right : t.notQuite)}</div>`}`;
}
function readout() {
  const t = T[lang], v = lab.view, p = S.pd[v], ok = p === 0 ? t.right : '', dis = busy();
  if (v === 'drill') {
    lab.setReadout(p === null ? '?' : `≈ ${fmt(roundAge(ageAt(S.depth)))} ${t.years}`, p === null ? '' : t.ageAt(fmt(S.depth)), ok, '#a9d2f0');
    $('dLab').textContent = t.depth; $('dVal').textContent = `${fmt(S.depth)} ${t.mUnit}`; $('dSl').value = S.depth; $('dSl').disabled = dis;
    $('dNote').textContent = t.approxModel; $('dE1').textContent = `0 ${t.mUnit}`; $('dE2').textContent = `${fmt(3200)} ${t.mUnit}`;
  } else if (v === 'bubbles') {
    const age = Math.round(S.age / 1000) * 1000;
    lab.setReadout(p === null ? '?' : `${ppm5(age)} ${t.ppm}`, p === null ? '' : t.co2At(fmt(age)), ok, '#ffd166');
    $('aLab').textContent = t.sampleAge; $('aVal').textContent = age === 0 ? t.today : `${fmt(age)} ${t.years}`; $('aSl').value = 800 - age / 1000; $('aSl').disabled = dis;
    $('aE1').textContent = `${fmt(800000)} ${t.years}`; $('aE2').textContent = t.today;
  } else {
    lab.setReadout(p === null ? '?' : '210', p === null ? '' : t.layersTo1815, ok, '#c9ccd6');
    const sl = $('vSl'), cnt = S.vmode === 'count', rn = Math.round(S.n);
    sl.min = cnt ? 0 : -40; sl.max = cnt ? LMAX : 40; sl.value = cnt ? S.n : S.off; sl.disabled = dis;
    $('vLab').textContent = cnt ? t.counted(rn, 2025 - rn) : S.matched ? t.matched : t.matchCores;
    $('vE1').textContent = cnt ? '2025' : ''; $('vE2').textContent = cnt ? String(2025 - LMAX) : '';
  }
}
function render() {
  const t = T[lang], v = lab.view, p = S.pd[v], st = t.state[v], asked = p !== null;
  document.body.dataset.v = v;
  $('icDrill').style.display = v === 'drill' && asked ? 'block' : 'none';
  $('icBub').style.display = v === 'bubbles' ? 'block' : 'none';
  $('bCtl').style.display = asked ? 'block' : 'none';
  $('icVol').style.display = v === 'volcano' && asked ? 'block' : 'none';
  $('bDir').innerHTML = `<i style="background:#ffd166"></i>${esc(t.direct)}`; $('bInd').innerHTML = `<i style="background:#ff7a59"></i>${esc(t.indirect)}`;
  $('crushB').textContent = t.crush;
  $('vModes').innerHTML = [['count', t.modeCount], ['match', t.modeMatch]].map(([m, l]) => `<button class="chip ic-opt ${S.vmode === m ? 'on' : ''}" data-m="${m}">${esc(l)}</button>`).join('');
  $('icSecs').innerHTML = [['a', '🌳'], ['b', '❄️']].map(([k, e]) => {
    const open = secret.unlocked();
    return `<button class="chip ic-opt secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  }).join('');
  renderPred(); readout();
  lab.setGlow(v === 'drill' ? 'rgba(120, 180, 240, .28)' : v === 'bubbles' ? 'rgba(255, 209, 102, .2)' : 'rgba(150, 150, 170, .24)');
  if (S.sec) { lab.setState({ emo: S.sec === 'a' ? '🌳' : '❄️', title: t.secrets[S.sec][0], lead: t.secrets[S.sec][1], body: '', extra: '' }); lab.setFacts([]); return; }
  const why = { drill: t.layersWhy, bubbles: t.iceAgeWhy, volcano: t.tamboraWhy }[v];
  if (!asked) lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: '', extra: '' });
  else if (v === 'volcano' && S.vmode === 'match') lab.setState({ emo: st.emo, title: st.title, lead: S.matched ? t.matched : t.matchCores, body: `${st.lead} ${st.body}`, extra: '' });
  else lab.setState({ emo: st.emo, title: st.title, lead: why, body: `${st.lead} ${st.body}`, extra: '' });
  lab.setFacts(t.facts[v]);
}
render();
canvasLoop($('cv'), draw);
</script>
