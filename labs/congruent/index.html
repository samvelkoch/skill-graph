const ssa = (L) => { // angle 35 at B, BC = 6, AC = L: the stick AC meets the ray from B
  const m = 6 * Math.cos(rad(35)), d = L * L - 36 * Math.sin(rad(35)) ** 2;
  if (d < -1e-9) return [];
  const r = Math.sqrt(Math.max(0, d));
  return (r < 1e-6 ? [m] : [m - r, m + r]).filter((t) => t > 0.05).map((t) => [[0, 0], [6, 0], [t * Math.cos(rad(35)), t * Math.sin(rad(35))]]);
};

  $('tsec').innerHTML = ['ssa', 'eu'].map((k) => `<button class="chip secret ${u ? 'open' : ''} ${sec === k ? 'on' : ''}" data-k="${k}">${u ? (k === 'ssa' ? '🪤 ' : '🏛️ ') + esc(t.sec[k][0]) : '🔒 ???'}</button>`).join('');
  $('tsl').hidden = sec !== 'ssa'; $('slider').value = S.L; $('tlen').textContent = `${t.ssa.len} = ${S.L.toFixed(1)}`;
  const main = !sec && !S.tend;
  $('tq').hidden = !main || ans; $('tq').textContent = x.q;
  $('to').hidden = !main || ans; $('to').innerHTML = x.opts.map((o, i) => `<button class="chip" data-g="${i}">${esc(o)}</button>`).join('');
  $('tn').hidden = sec !== null || !(ans || S.tend); $('tn').textContent = S.tend ? x.again : x.next;
  if (sec === 'ssa') {
    const n = ssa(S.L).length;
    lab.setReadout(String(n), '', '', '#f5c84c');
    lab.setState({ emo: '🪤', title: n === 2 ? t.ssa.t2 : n === 1 ? t.ssa.t1 : t.ssa.t0, lead: n === 2 ? t.ssa.l2 : n === 1 ? (S.L >= 6 ? t.ssa.l1b : t.ssa.l1) : t.ssa.l0, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  if (sec === 'eu') {
    lab.setReadout('SAS', '', '', '#e0b050'); lab.setState({ emo: '🏛️', title: t.eu.t, lead: t.eu.l, body: '', extra: '' }); lab.setFacts([fact('eu')]); return;
  }
  if (S.tend) {
    const k = S.tr.filter(Boolean).length;
    lab.setReadout(`${k}/5`, '', '', '#8f7fd0'); lab.setState({ emo: '🏆', title: x.endT(k), lead: x.endL, body: '', extra: '' }); lab.setFacts([fact('ei')]); return;
  }
  if (!ans) {
    lab.setReadout(cs.k, x.sub(S.ti + 1), '', '#8f7fd0');
    lab.setState({ emo: '🧪', title: cs.k + ': ' + x.sets[cs.k], lead: x.q, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const n = cs.sols().length, ok = S.tr[S.ti];
  lab.setReadout(cs.k, x.sub(S.ti + 1), cs.k === 'AAA' ? x.three : n === 2 ? x.two : x.one, cs.one ? '#3ddc97' : '#f5c84c');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? x.rightT : x.wrongT, lead: cs.k === 'SSA' ? x.n2 : cs.k === 'AAA' ? x.n3 : x.n1, body: S.tr.map((r) => (r ? '●' : '○')).join(''), extra: '' });
  lab.setFacts([fact('eu'), fact('ei')]);
}
function renderR(t) {
  const r = t.r, br = S.rs === 'bridge'; lab.setGlow('rgba(217, 130, 95, .24)'); S.ro = '';

  lab.setFacts([fact('ei'), fact('eu')]);
}
