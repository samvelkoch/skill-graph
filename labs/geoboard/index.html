const inside = (a, b, p) => cross(a, b, p) === 0 && dotv(a, b, p) > 0 && dotv(b, a, p) > 0; // p strictly between a and b
const same = (p, q) => p[0] === q[0] && p[1] === q[1];
// corners of a band: a peg the band only passes straight over is not a corner (a 180° angle)
function cornerIdx(pts, closed) {
  const n = pts.length, out = [];
  for (let k = 0; k < n; k++) {
    if (!closed && (k === 0 || k === n - 1)) { out.push(k); continue; }
    const p = pts[(k - 1 + n) % n], q = pts[k], r = pts[(k + 1) % n];
    if (cross(p, q, r) !== 0) out.push(k);
  }
  return out;
}
// name of a closed shape from its corner pegs: 3, 4, 'sq', 'rect', 5, 6, n

  const n = cs.length;

  const sq = cs.map((p, k) => [cs[(k + 1) % 4], p, cs[(k + 3) % 4]]);

  const d = cs.map((p, k) => { const q = cs[(k + 1) % 4]; return (q[0] - p[0]) ** 2 + (q[1] - p[1]) ** 2; });
  return d.every((x) => x === d[0]) ? 'sq' : 'rect';
}

    S.bee = 'c'; S.beeAt = nowS(); const run = S.beeRun; // sets itself up: circles, then squares, then hexagons
    [[2600, 'sq'], [5200, 'hex']].forEach(([ms, kind]) => setTimeout(() => { if (S.sec === 'bees' && S.beeRun === run) { S.bee = kind; S.beeAt = nowS(); render(); } }, ms));
  } else { S.push = 0; S.pushT = 0; S.drag = null; S.demo = true; S.demoAt = nowS() + .3; }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, B = S.b;
  if (act === 'undo') { if (B.closed) B.closed = false; else if (B.pts.length) { B.pts.pop(); B.born.pop(); } sfx.tick(); }
  else if (act === 'clear') { B.pts = []; B.born = []; B.closed = false; sfx.click(); }
  else if (act === 'sw') { B.color = b.dataset.c; sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) { S.sec = null; S.beeRun++; } else startSec(k);
    sfx.click();
  } else if (act === 'bee') { S.beeRun++; S.bee = b.dataset.k; S.beeAt = nowS(); sfx.click(); }
  else if (act === 'again') { startSec('strong'); sfx.click(); }
  render();
});

// the question card on the stage ------------------------------------------------------------------------------
function roundOf() { // the current question of the current view
  const t = T[lang], v = lab.view;
  if (v === 'board') return { ans: S.b.ans, done: S.b.phase !== 'ask' && S.b.phase !== 'rev', q: t.b.q, opts: t.b.o, ok: 0, why: t.b.r, last: false, kicker: '' };
  if (v === 'same') { const R = S.s; return { ans: R.ans, done: R.done, q: t.s.q[R.i], opts: [t.yes, t.no], ok: SAME[R.i].ok, why: t.s.why[R.i], last: R.i === 4, kicker: t.s.chg[R.i] }; }
  const R = S.h, p = PARTS[R.i];
  return { ans: R.ans, done: R.done, q: t.h.q, opts: p.opts.map(String), ok: p.ok, why: t.h.why[R.i], last: R.i === 4, kicker: `🔍 ${t.h.parts[R.i]}` };
}
function cardHTML(R, t) {
  const k = R.kicker ? `<div class="gb-k">${esc(R.kicker)}</div>` : '';
  if (R.ans === null) return `${k}<div class="gb-q">${esc(R.q)}</div><div class="gb-opts">${R.opts.map((o, j) => `<button class="gb-btn" data-a="${j}">${esc(o)}</button>`).join('')}</div>`;
  if (!R.done) return `${k}<div class="gb-q">${esc(R.q)}</div><div class="gb-opts">${R.opts.map((o, j) => `<button class="gb-btn ${j === R.ok ? 'good' : j === R.ans ? 'bad' : ''}" disabled>${esc(o)}</button>`).join('')}</div>`;
  const good = R.ans === R.ok;
  return `${k}<div class="gb-q sm">${esc(R.q)}</div><div class="gb-verdict" style="color:${good ? 'var(--ok)' : 'var(--wip)'}">${esc(good ? t.right : t.wrong)}</div><p>${esc(R.why)}</p>
    <div class="gb-opts"><button class="gb-btn go" data-next="1">${esc(R.last ? t.again : t.next)}</button></div>`;
}
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const v = lab.view;
  if (b.dataset.next) {
    if (v === 'board') { const B = S.b; B.phase = 'free'; B.pts = []; B.born = []; B.closed = false; sfx.click(); }
    else { const R = v === 'same' ? S.s : S.h; if (R.i === 4) { R.i = 0; R.right = []; } else R.i++; R.ans = null; R.done = false; R.revAt = -9; sfx.click(); }
    return render();
  }
  if (b.dataset.a === undefined) return;
  const j = +b.dataset.a, good = j === roundOf().ok;
  (good ? sfx.good : sfx.bad)();
  if (v === 'board') {
    const B = S.b; B.ans = j; B.phase = 'rev'; B.pts = []; B.born = []; B.closed = false;
    TRI.forEach((p, k) => setTimeout(() => { B.pts.push(p); B.born.push(nowS()); sfx.tick(); render(); }, 450 + k * 650));
    setTimeout(() => { B.closed = true; B.closeAt = nowS(); sfx.snap(); render(); }, 450 + 3 * 650);
    setTimeout(() => { B.phase = 'done'; render(); showStage(); }, 450 + 3 * 650 + 1500);
  } else {
    const R = v === 'same' ? S.s : S.h, dur = v === 'same' ? SAME[R.i].dur : huntDur(PARTS[R.i]);
    R.ans = j; R.revAt = nowS(); R.right[R.i] = good; const i = R.i;
    setTimeout(() => { if (R.i === i && R.ans !== null) { R.done = true; render(); showStage(); } }, (dur + .8) * 1000);
  }
  render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------------
const roundDots = (R) => [0, 1, 2, 3, 4].map((i) => (i < R.i || (i === R.i && R.done) ? '●' : i === R.i ? '◉' : '○')).join(' ');
const bigName = (txt) => `<span style="font-size:${txt.length > 11 ? 22 : 34}px">${esc(txt)}</span>`;
function render() {
  const t = T[lang], v = lab.view, B = S.b, secOn = v === 'board' && S.sec, on = cardOn();
  document.body.dataset.v = secOn ? 'sec' : v === 'board' ? (on ? 'bask' : 'board') : v;
  $('secBoard').style.display = v === 'board' ? '' : 'none';
  $('bFree').style.display = v === 'board' && !secOn && B.phase === 'free' ? '' : 'none';
  $('bBees').style.display = secOn && S.sec === 'bees' ? '' : 'none';
  $('bStrong').style.display = secOn && S.sec === 'strong' ? '' : 'none';
  askEl.style.display = on ? '' : 'none';
  if (on) askEl.innerHTML = cardHTML(roundOf(), t);
  // board controls
  $('bUndo').textContent = t.b.undo; $('bClear').textContent = t.b.clear;
  $('bStrong').innerHTML = secOn && S.sec === 'strong' ? `<button class="chip gb-tall" data-act="again">${esc(t.again)}</button>` : '';
  $('bUndo').disabled = !B.pts.length; $('bClear').disabled = !B.pts.length;
  $('bUndo').style.opacity = $('bClear').style.opacity = B.pts.length ? '' : '.4';
  $('bSw').innerHTML = COLORS.map((col, k) => `<button class="gb-sw ${col === B.color ? 'on' : ''}" data-act="sw" data-c="${col}" style="background:${col}" aria-label="${esc(t.colors[k])}"></button>`).join('');
  $('beeSeg').innerHTML = [['c', '⚪', t.shapes.circle], ['sq', '⬜', t.shapes.sq], ['hex', '⬡', t.shapes[6]]].map(([k, e, l]) => `<button data-act="bee" data-k="${k}" class="${S.bee === k ? 'on' : ''}">${e} ${esc(l)}</button>`).join('');
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip gb-tall secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('bees', '🐝') + sc('strong', '🔺');
  lab.setGlow('rgba(255, 138, 61, .22)');
  if (secOn) {
    if (S.sec === 'bees') {
      lab.setReadout(bigName(S.bee === 'c' ? t.shapes.circle : S.bee === 'sq' ? t.shapes.sq : t.shapes[6]), '', '', C.band);
      lab.setState({ emo: '🐝', title: t.secrets.bees[0], lead: t.bee[S.bee], body: t.sec.beesText });
    } else {
      lab.setReadout('▢ △', '', '', C.band);
      lab.setState({ emo: '🔺', title: t.secrets.strong[0], lead: t.sec.strongText, body: '' });
    }
    return;
  }
  const card = (k, full) => { const [emo, title, lead, body] = CARDS[lang][k][full ? 1 : 0]; lab.setState({ emo, title, lead, body }); };
  if (v === 'board') {
    const closed = B.closed, key = closed ? nameKey(cornerIdx(B.pts, true).map((k) => B.pts[k])) : null, cs = closed ? cornerIdx(B.pts, true).length : 0;
    if (B.phase === 'ask') lab.setReadout('?', '', '', B.color);
    else if (closed) lab.setReadout(bigName(nameText(key)), t.b.count(cs, cs), '', B.color);
    else if (B.phase === 'rev' || B.pts.length) lab.setReadout(bigName(B.phase === 'rev' ? '…' : t.shapes.open), B.phase === 'rev' ? '' : (nowS() - B.msgAt < 2.5 && B.msg ? t.b[B.msg] : t.b.tap), '', B.color);
    else lab.setReadout('📌', nowS() - B.msgAt < 2.5 && B.msg ? t.b[B.msg] : t.b.tap, '', B.color);
    card('board', B.phase === 'done' || B.phase === 'free');
    return;
  }
  const R = v === 'same' ? S.s : S.h, fin = R.i === 4 && R.done, k = R.right.filter(Boolean).length;
  const endKey = v === 'same' ? SAME[R.i].end : PARTS[R.i].name;
  lab.setReadout(fin ? `${k}/5` : `${R.i + 1}/5`, roundDots(R), R.done && endKey ? nameText(endKey) : '', C.band);
  card(v, fin);
}
render();
</script>
</body>
</html>
