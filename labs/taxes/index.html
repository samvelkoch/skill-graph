// --- the loop ----------------------------------------------------------------------------------------------------
function tick(time, dt) {
  const L = S.light, B = S.budget, Sh = S.share, t = now();
  if (L.run && !L.run.done && t - L.run.t0 >= L.run.end) { L.run.done = true; if (L.run.mode === 'vol') L.revealed = true; (L.run.mode === 'tax' ? sfx.good : sfx.bad)(); render(); }
  if (L.run) { const n = lightNow().coins; if (n !== L.coinsSeen) { L.coinsSeen = n; sfx.tick(); } }
  if (Sh.revealed && !Sh.done && t - Sh.t0 >= 2.2) { Sh.done = true; Sh.seen = true; render(); }
  if (B.tween) {
    const tw = B.tween, k = c01((t - tw.t0) / tw.dur); B.tax = Math.round(lerp(tw.from, tw.to, eIO(k)));
    if (k >= 1) { B.tween = null; B.run = { t0: t + 0.4, k: 0 }; }
  }
  if (B.run && t >= B.run.t0) {
    const k = Math.min(5, Math.floor((t - B.run.t0) / 0.9) + 1);
    while (B.run.k < k) { B.run.k++; const bal = budgetCalc().bal; B.debt = Math.max(0, B.debt - bal); if (bal < 0) { B.pops.push({ t: time, text: sgn(-bal) }); sfx.tick(); } }
    if (t - B.run.t0 > 5 * 0.9 + 0.6) { B.run = null; if (B.phase === 'anim') { B.phase = 'free'; sfx.bad(); render(); } else render(); }
  }
  B.pops = B.pops.filter((p) => time - p.t < 1.3);
  const ke = 1 - Math.exp(-dt * 6);
  KEYS.forEach((k) => { B.rs[k] += (Math.min(2, B.sp[k] / NEED[k]) - B.rs[k]) * ke; });
  const { inc, spend } = budgetCalc();
  B.mx += (Math.max(10000, inc, spend) - B.mx) * ke;
  B.debtShow += (B.debt - B.debtShow) * (1 - Math.exp(-dt * 7)); if (Math.abs(B.debt - B.debtShow) < 0.5) B.debtShow = B.debt;
}

  $('bAsk').innerHTML = askHTML(t.qBudget, t.optsBudget, B.order, B.guess, locked, done);
  if (done) verdictHTML($('bVerdict'), B.guess === 0, t.budgetWhy, t); else setBox('bVerdict', false);
  setBox('bCutRow', B.phase === 'ask', 'flex'); $('bCut').textContent = t.cutTo; $('bCut').disabled = B.guess === null;
  setBox('bFree', done);
  $('rTaxL').textContent = t.taxRate; $('rTax').value = B.tax; $('rTaxV').textContent = `${B.tax} %`;
  KEYS.forEach((k) => { $('rl_' + k).textContent = t.items[k]; $('rs_' + k).value = B.sp[k]; $('rv_' + k).textContent = fmt(B.sp[k]); });
  $('bRun').textContent = t.run5; $('bRun').disabled = !!B.run;
  $('euBox').innerHTML = `<div class="tx-eut">${esc(t.euTitle)}</div>
    <div class="tx-eubar">${EU.map(([k, p, col]) => `<div style="flex:${p};background:${col}">${p} %</div>`).join('')}</div>
    <div class="tx-legend">${EU.map(([k, p, col]) => `<span><i style="background:${col}"></i>${esc(t.about)} ${p} % ${esc(t.euParts[k])}</span>`).join('')}</div>
    <div class="tx-src">${esc(t.euCaption)}</div>`;
  const s = t.state.budget;
  return { emo: s.emo, title: s.title, lead: s.lead, body: done ? s.body : '' };
}
function renderShare(t) {
  const Sh = S.share, locked = Sh.revealed, done = Sh.seen;
  lab.setGlow('rgba(196, 161, 255, .22)');
  $('sAsk').innerHTML = askHTML(t.qShare, t.optsShare, Sh.order, Sh.guess, locked, done);
  if (done) verdictHTML($('sVerdict'), Sh.guess === 0, t.shareWhy, t); else setBox('sVerdict', false);
  $('sModes').innerHTML = [['flat', t.flat], ['prog', t.progressive]].map(([k, l]) => `<button class="chip ${Sh.mode === k ? 'on' : ''}" data-mode="${k}">${esc(l)}</button>`).join('');
  setBox('sModes', Sh.revealed, 'flex');
  setBox('sGo', !Sh.revealed, 'inline-flex'); $('sGo').textContent = t.collect; $('sGo').disabled = Sh.guess === null;
  return t.state.share;
}
// the readout: also called from the loop; it only touches the page when its text changed
function readout() {
  const t = T[lang], v = lab.view; let val, sub, pill = '', color;
  if (v === 'light') {
    const L = S.light, n = lightNow().coins;
    val = `${n} / 50`; sub = t.collected; color = GOLD;
    if (L.run && L.run.done) pill = L.run.mode === 'tax' ? t.built : t.dark;
  } else if (v === 'budget') {
    const B = S.budget, { bal } = budgetCalc();
    val = `${sgn(bal)} 🪙`; sub = t.balance; color = bal < 0 ? '#ff6b6b' : '#3ddc97';
    if (B.debtShow > 0.5) pill = `${t.debt} ${fmt(B.debtShow)}`;
  } else {
    const Sh = S.share;
    if (!Sh.revealed) { val = '?'; sub = t.paidRichest; }
    else { const p = shareNow().pays; val = `${fmt(p[2])} 🪙`; sub = t.paidRichest; pill = t.total(fmt(p[0] + p[1] + p[2])); }
    color = '#c4a1ff';
  }
  const key = [lang, v, val, sub, pill, color].join('|');
  if (key === S.rk) return;
  S.rk = key; lab.setReadout(val, sub, pill, color);
}
render();
</script>
