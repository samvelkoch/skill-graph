$('cv').addEventListener('click', (ev) => {
  if (lab.view !== 'who' || S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - MAP.ox) / MAP.s, y = (ev.clientY - r.top - MAP.oy) / MAP.s;
  let best = -1, bd = 30;
  WIT.forEach((w, i) => { const d = Math.hypot(x - w.fx, y - (w.fy - 20)); if (d < bd) { bd = d; best = i; } });
  if (best >= 0) pickWit(best);
});
$('ewLight').addEventListener('input', (ev) => { S.light = +ev.target.value; render(); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, w = S.wit;
  if (act === 'wit') return pickWit(+b.dataset.i);
  if (act === 'ans') { if (w === null || S.rev[w]) return; S.ans[w][+b.dataset.d] = b.dataset.v === '1'; sfx.tick(); }
  else if (act === 'reveal') { if (S.ans[w].some((a) => a === null)) return; S.rev[w] = true; S.t = 0; S.play = 'cone'; sfx.click(); showStage(); }
  else if (act === 'replay') { S.t = 0; S.play = 'all'; sfx.click(); showStage(); }
  else if (act === 'fd') {
    const f = ORDER[S.fi]; if (S.fa[f]) return;
    const ok = SIDE[f] === b.dataset.v; S.fa[f] = { ok, pick: b.dataset.v }; S.last = f; (ok ? sfx.good : sfx.bad)();
  } else if (act === 'fnext') { S.fi++; S.last = null; sfx.click(); }
  else if (act === 'fagain') { S.fi = 0; S.fa = {}; S.last = null; sfx.click(); }
  else if (act === 'hk') { if (S.h.k !== null) return; S.h.k = +b.dataset.v; const ok = S.h.k === T.en.hist.cards[S.h.i].kind; S.h.kd[S.h.i] = ok; (ok ? sfx.good : sfx.bad)(); }
  else if (act === 'hstep') { S.h.step = 1; sfx.click(); }
  else if (act === 'ha') { if (S.h.a !== null) return; S.h.a = +b.dataset.v; const ok = S.h.a === T.en.hist.cards[S.h.i].ok; S.h.ad[S.h.i] = ok; (ok ? sfx.good : sfx.bad)(); }
  else if (act === 'hnext') { S.h.i++; S.h = { ...S.h, step: 0, k: null, a: null }; sfx.click(); }
  else if (act === 'hagain') { S.h = { i: 0, step: 0, k: null, a: null, kd: [], ad: [] }; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k, want = k === 'a' ? 'disagree' : 'report';
    if (S.sec === want) { S.sec = null; restT(); }
    else { goView(k === 'a' ? 'who' : 'diary'); S.sec = want; S.play = null; if (k === 'a') { S.light = 70; S.seller = false; $('ewLight').value = 70; } else S.ints = [false, false, false]; }
    sfx.click();
  } else if (act === 'ask') { S.seller = true; sfx.good(); }
  else if (act === 'int') { S.ints[+b.dataset.i] = true; sfx.snap(); }
  render();
});
$('ewAsk').dataset.act = 'ask';

// --- render ------------------------------------------------------------------------------------------------
const fmt = (s) => esc(s).replace(/\[(\d)\|([^\]]*)\]/g, (m, n, tx) => {
  const st = S.fa[+n] ? ' hl' : '', cur = S.last === +n ? ' cur' : '';
  return `<span class="ew-f ${SIDE[+n]}${st}${cur}">${tx}</span>`;
});
function render() {
  const t = T[lang], v = lab.view;
  $('ewV1').style.display = v === 'who' && S.sec !== 'disagree' ? '' : 'none';
  $('ewSA').style.display = v === 'who' && S.sec === 'disagree' ? '' : 'none';
  $('ewV2').style.display = v === 'diary' ? '' : 'none';
  $('ewV3').style.display = v === 'hist' ? '' : 'none';
  const open = secret.unlocked();
  $('ewSec').innerHTML = [['a', '🔦', 'disagree'], ['b', '🎤', 'report']].map(([k, emo, id]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === id ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (v === 'who') rWho(t); else if (v === 'diary') rDiary(t); else rHist(t);
}
function rWho(t) {
  const q = t.who, w = S.wit;
  lab.setFacts([{ emo: '🌋', ...t.facts[0] }]);
  if (S.sec === 'disagree') {
    lab.setGlow('rgba(80,130,255,.26)');
    $('ewLightL').textContent = t.sa.light; $('ewLo').textContent = t.sa.lo; $('ewHi').textContent = t.sa.hi;
    $('ewAsk').textContent = t.sa.ask; $('ewAsk').disabled = S.seller;
    const st = S.seller ? t.sa.st1 : t.sa.st0;
    lab.setReadout('🔦', t.secrets.a[0], '', '#6c8cff');
    lab.setState({ emo: S.seller ? '🎈' : '🔦', title: st[0], lead: st[1], body: st[2], extra: '' });
    return;
  }
  lab.setGlow('rgba(255,200,90,.22)');
  const done = w === null ? 0 : S.ans[w].filter((a) => a !== null).length, rev = w !== null && S.rev[w];
  let html = `<div class="ew-wits">${WIT.map((x, i) => `<button class="chip ${i === w ? 'on' : ''}" data-act="wit" data-i="${i}">${x.emo} ${esc(t.names[i])}<small>${esc(t.where[i])}</small></button>`).join('')}</div>`;
  if (w !== null) {
    html += `<div class="ew-q">${esc(q.q(t.names[w]))}<i>${esc(q.legend)}</i></div>`;
    html += q.det.map((tx, d) => {
      const a = S.ans[w][d], kn = known(w, d), why = KEY[d] === null ? q.rsnd : kn ? q.rin : q.rout;
      const cls = rev ? (a === kn ? 'ok' : 'bad') : '';
      return `<div class="ew-row ${cls}"><b class="ew-n">${d + 1}</b><span class="ew-t">${esc(tx)}${rev ? `<small>${a === kn ? '✓' : '✗'} ${esc(why)}</small>` : ''}</span>
        <span class="ew-yn"><button data-act="ans" data-d="${d}" data-v="1" class="${a === true ? 'on' : ''}" ${rev ? 'disabled' : ''} aria-label="${esc(q.legend.split(' · ')[0])}">👁️</button><button data-act="ans" data-d="${d}" data-v="0" class="${a === false ? 'on' : ''}" ${rev ? 'disabled' : ''} aria-label="${esc(q.legend.split(' · ')[1])}">🚫</button></span></div>`;
    }).join('');
    html += `<div class="ew-act">${rev ? '' : `<button class="btn" data-act="reveal" ${done < 6 ? 'disabled' : ''}>${esc(q.reveal)}</button>`}<button class="chip" data-act="replay">${esc(q.replay)}</button></div>`;
  } else html += `<div class="ew-act"><button class="chip" data-act="replay">${esc(q.replay)}</button></div>`;
  $('ewV1').innerHTML = html;
  let st;
  if (w === null) { st = q.st0; lab.setReadout('👁️', '', '', '#ffc85a'); }
  else if (!rev) { st = q.st1(t.names[w], t.where[w]); lab.setReadout(`${done}/6`, t.names[w], '', '#ffc85a'); }
  else {
    const k = S.ans[w].filter((a, d) => a === known(w, d)).length;
    st = S.rev.every(Boolean) ? q.st3 : q.st2(k); lab.setReadout(`${k}/6`, t.names[w], '', '#ffc85a');
  }
  lab.setState({ emo: '👁️', title: st[0], lead: st[1], body: st[2], extra: '' });
}
function rDiary(t) {
  const d = t.diary;
  lab.setFacts([{ emo: '✉️', ...t.facts[1] }]);
  lab.setGlow('rgba(255,210,110,.24)');
  const secB = S.sec === 'report';
  if (secB) {
    const b = t.sb, n = S.ints.filter(Boolean).length, sum = S.ints.reduce((a, x, i) => a + (x ? b.num[i] : 0), 0);
    const all = n === 3;
    let html = `<div class="ew-wits">${[0, 1, 2].map((i) => `<button class="chip ${S.ints[i] ? 'on' : ''}" data-act="int" data-i="${i}" ${S.ints[i] ? 'disabled' : ''}>${S.ints[i] ? '✓ ' + esc(t.names[i]) : esc(b.ask(t.names[i]))}</button>`).join('')}</div>`;
    html += `<div class="ew-report"><h5>${esc(b.head)}</h5><p>${esc(b.l1)}</p>`;
    html += [0, 1, 2].map((i) => `<p>${S.ints[i] ? `${esc(b.quotes[i])} ${esc(b.by[i])}.` : `<span class="ph">${b.ph}</span>`}</p>`).join('');
    html += `<p>${n === 0 ? `<span class="ph">${b.ph}</span>` : all ? `<span class="tot">${esc(b.tot3(sum, b.num.join(' + ')))}</span>` : esc(b.tot(sum))}</p></div>`;
    $('ewV2').innerHTML = html + `<div class="ew-act"></div>`;
    const st = all ? b.st1 : b.st0;
    lab.setReadout('📰', `${n}/3`, '', '#ffd34d');
    lab.setState({ emo: all ? '📰' : '🎤', title: st[0], lead: st[1], body: st[2], extra: '' });
    return;
  }
  const f = ORDER[S.fi], fin = S.fi >= 8, ans = S.fa[f], k = Object.values(S.fa).filter((x) => x.ok).length, nd = Object.keys(S.fa).length;
  let html = `<div class="ew-papers"><div class="ew-paper d"><h4>${esc(d.dHead)}</h4>${d.d.map((p) => `<p>${fmt(p)}</p>`).join('')}</div>
    <div class="ew-paper n"><h4>${esc(d.nHead)}</h4><h5>${esc(d.nT)}</h5>${d.n.map((p) => `<p>${fmt(p)}</p>`).join('')}</div></div>`;
  if (!fin) {
    html += `<div class="ew-feat"><small>${esc(d.q)}</small>${esc(d.feat[f])}</div>
      <div class="ew-two"><button data-act="fd" data-v="d" class="${ans ? (SIDE[f] === 'd' ? 'ok' : ans.pick === 'd' ? 'bad' : '') : ''}" ${ans ? 'disabled' : ''}>${esc(d.bd)}</button><button data-act="fd" data-v="n" class="${ans ? (SIDE[f] === 'n' ? 'ok' : ans.pick === 'n' ? 'bad' : '') : ''}" ${ans ? 'disabled' : ''}>${esc(d.bn)}</button></div>`;
    if (ans) html += `<div class="ew-verdict"><b>${esc(ans.ok ? d.right : d.wrong[SIDE[f] === 'd' ? 0 : 1])}</b>${esc(d.exp[SIDE[f] === 'd' ? 0 : 1])}</div><div class="ew-act"><button class="btn" data-act="fnext">${esc(d.next)}</button></div>`;
  } else html += `<div class="ew-act"><button class="btn" data-act="fagain">${esc(d.again)}</button></div>`;
  $('ewV2').innerHTML = html;
  let st, emo = '📓';
  if (fin) { st = [d.end(k), d.endLead, '']; emo = '🏆'; }
  else if (ans) { st = [ans.ok ? d.right : d.wrong[SIDE[f] === 'd' ? 0 : 1], d.exp[SIDE[f] === 'd' ? 0 : 1], '']; emo = ans.ok ? '✅' : '🤔'; }
  else st = nd ? d.st1 : d.st0;
  lab.setReadout(fin ? `${k}/8` : `${nd}/8`, '', '', '#ffd34d');
  lab.setState({ emo, title: st[0], lead: st[1], body: st[2], extra: '' });
}
function rHist(t) {
  const H = t.hist, h = S.h, fin = h.i >= 3, k = h.kd.filter(Boolean).length + h.ad.filter(Boolean).length;
  lab.setFacts([{ emo: '📔', ...t.facts[2] }]);
  lab.setGlow('rgba(255,214,102,.22)');
  let html = '', st, emo = '🏛️';
  if (fin) {
    html = `<div class="ew-act"><button class="btn" data-act="hagain">${esc(H.again)}</button></div>`;
    st = [`${k} / 6 ✓`, H.endLead, '']; emo = '🏆';
    lab.setReadout(`${k}/6`, '', '', '#ffd34d');
  } else {
    const cd = H.cards[h.i];
    html = `<div class="ew-card"><h4>${esc(cd.title)}</h4><div class="s">${esc(cd.src)}</div><p>“${esc(cd.text)}”</p></div>`;
    if (h.step === 0) {
      const kd = h.k !== null;
      html += `<div class="ew-q">${esc(H.who)}</div><div class="ew-two"><button data-act="hk" data-v="0" class="${kd ? (cd.kind === 0 ? 'ok' : h.k === 0 ? 'bad' : '') : ''}" ${kd ? 'disabled' : ''}>${esc(H.f)}</button><button data-act="hk" data-v="1" class="${kd ? (cd.kind === 1 ? 'ok' : h.k === 1 ? 'bad' : '') : ''}" ${kd ? 'disabled' : ''}>${esc(H.s)}</button></div>`;
      if (kd) html += `<div class="ew-verdict"><b>${esc(h.k === cd.kind ? H.right : H.wrong)}</b>${esc(cd.why)}</div><div class="ew-act"><button class="btn" data-act="hstep">${esc(H.next)}</button></div>`;
      st = kd ? [h.k === cd.kind ? H.right : H.wrong, cd.why, ''] : H.st0; emo = kd ? (h.k === cd.kind ? '✅' : '🤔') : '🏛️';
    } else {
      const ad = h.a !== null;
      html += `<div class="ew-q">${esc(cd.q)}</div><div class="ew-opts">${cd.opts.map((o, j) => `<button data-act="ha" data-v="${j}" class="${ad ? (j === cd.ok ? 'ok' : h.a === j ? 'bad' : '') : ''}" ${ad ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
      if (ad) html += `<div class="ew-verdict"><b>${esc(h.a === cd.ok ? H.right : H.wrong)}</b>${esc(cd.addWhy)}</div><div class="ew-act"><button class="btn" data-act="hnext">${esc(H.nextCard)}</button></div>`;
      st = ad ? [h.a === cd.ok ? H.right : H.wrong, cd.addWhy, ''] : [H.step2, cd.q, '']; emo = ad ? (h.a === cd.ok ? '✅' : '🤔') : '❓';
    }
    lab.setReadout(`${h.i + 1}/3`, '', '', '#ffd34d');
  }
  $('ewV3').innerHTML = html;
  lab.setState({ emo, title: st[0], lead: st[1], body: st[2], extra: '' });
}
render();
</script>
</body>
</html>
