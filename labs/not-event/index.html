function parseNum(str) {
  let s = String(str).trim().replace(/,/g, '.'), pct = false;
  if (/%$/.test(s)) { pct = true; s = s.replace(/%$/, '').trim(); }

}

// --- drawing helpers -----------------------------------------------------------------------------------------------
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); };
const ang = (f, th) => -Math.PI / 2 + th + f * TAU;
// text on a dark rounded pill, kept inside the canvas
function pill(c, txt, x, y, o = {}) {
  const sz = o.size || 12; c.save(); c.font = `800 ${sz}px Nunito, sans-serif`;
  const w = c.measureText(txt).width + (o.pad ?? 16), h = sz + 10;
  const px = clamp(x - w / 2, 4, Math.max(4, CW - w - 4)), py = clamp(y - h / 2, 2, Math.max(2, CH - h - 2));
  c.globalAlpha = o.alpha ?? 1; rr(c, px, py, w, h, h / 2); c.fillStyle = o.bg || 'rgba(10,12,22,.82)'; c.fill();
  if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = 1.5; c.stroke(); }
  c.fillStyle = o.fg || '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, px + w / 2, py + h / 2 + 1);
  c.restore();
}
function outText(c, txt, x, y, alpha = 1, size = 12) { // white text with a dark edge: readable on every colour
  c.save(); c.globalAlpha = alpha; c.font = `800 ${size}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = 3.5; c.lineJoin = 'round'; c.strokeStyle = 'rgba(10,12,28,.75)'; c.strokeText(txt, x, y); c.fillStyle = '#fff'; c.fillText(txt, x, y); c.restore();
}
// the spinner: sectors [{a, b, col, label, glow}] in turns clockwise from the top, turned by th
function wheel(c, cx, cy, r, secs, th, pointer = true) {

    if (lit < 1) { c.globalAlpha = 1 - lit; rr(c, m, m, cell - 2 * m, cell - 2 * m, cell * .2); c.fillStyle = 'rgba(130,145,190,.13)'; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(130,145,190,.3)'; c.stroke(); }
    c.restore();
  }
  const ly = gy + gw + 28;
  if (L.shown[key]) {
    const items = [{ t: `${x.ev[sc]} ${e}`, col: col.ev, a: clamp(L.rv * 4, 0, 1) }, { t: `${x.ne[sc]} ${100 - e}`, col: col.ne, a: clamp((L.rv - .5) * 4, 0, 1) }];
    noteLegend(c, items, ly);
  } else pill(c, sc === 2 ? x.sq(LIFE[2].vars[L.v[2]][1] / 100) : x.grid, w / 2, ly);
  void time;
}

// --- pointer: drag the white handle(s) round the rim; red snaps to tenths, eighths, sixths and thirds ---------------
$('cv').addEventListener('pointerdown', (ev) => {
  if (!geo || (geo.kind === 'two' && S.two.anim)) return;
  const r = $('cv').getBoundingClientRect(), px = ev.clientX - r.left - geo.cx, py = ev.clientY - r.top - geo.cy;
  if (Math.hypot(px, py) > geo.R + 46) return;
  drag = { kind: geo.kind, idx: 0 };
  if (geo.kind === 'exact') { // the nearest of the three edges
    const f = mod((Math.atan2(py, px) + Math.PI / 2) / TAU, 1);
    drag.idx = [0, 1, 2].reduce((b, i) => (Math.abs(S.ex[i] / 20 - f) < Math.abs(S.ex[b] / 20 - f) ? i : b), 0);
  }
  $('cv').setPointerCapture(ev.pointerId); dragTo(ev);
});
$('cv').addEventListener('pointermove', (ev) => { if (drag) dragTo(ev); });
['pointerup', 'pointercancel'].forEach((n) => $('cv').addEventListener(n, () => { drag = null; }));
function dragTo(ev) {
  if (!geo) return;
  const r = $('cv').getBoundingClientRect(), px = ev.clientX - r.left - geo.cx, py = ev.clientY - r.top - geo.cy;
  const th = drag.kind === 'two' ? S.two.th : 0, f = mod((Math.atan2(py, px) + Math.PI / 2 - th) / TAU, 1);
  if (drag.kind === 'two') {
    const nearest = SNAP.reduce((b, s) => (Math.abs(qv(s) - f) < Math.abs(qv(b) - f) ? s : b), SNAP[0]);
    setP(nearest); if (!S.two.touched) { S.two.touched = true; store.set('not-event:dragged', true); }
  } else {
    const i = drag.idx, lo = (i ? S.ex[i - 1] : 0) + 1, hi = (i < 2 ? S.ex[i + 1] : 20) - 1, v = clamp(Math.round(f * 20), lo, hi);
    if (v !== S.ex[i]) { S.ex[i] = v; sfx.tick(); render(); }
  }
}
function setP(q) {
  const T2 = S.two;
  if (qeq(q, T2.p)) return;
  Object.assign(T2, { p: q, guess: '', shown: false, ok: null, bad: false, rv: 0, n: 0, nShow: 0 });
  sfx.tick(); render();
}

// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function syncInput(el, v, mode) { if (el.value !== v) el.value = v; if (el.inputMode !== mode) el.inputMode = mode; }
function spin(k) {
  const T2 = S.two, p = qv(T2.p);
  if (T2.anim || !T2.shown) return;
  const now = performance.now() / 1000;
  if (k === 1) {
    if (T2.n >= CAP) return;
    const u = Math.random(), notRed = u >= p, i = T2.n + 1, th0 = mod(T2.th, TAU), A = TAU * (1 - u);
    T2.cnt[i] = T2.cnt[i - 1] + (notRed ? 1 : 0); T2.n = i;
    T2.anim = { k: 'one', t0: now, dur: 1.5, th0, th1: th0 + TAU * 3 + mod(A - th0, TAU) };
    sfx.push();
  } else {
    if (T2.n + 1000 > CAP) return;
    const from = T2.n;
    for (let i = from + 1; i <= from + 1000; i++) T2.cnt[i] = T2.cnt[i - 1] + (Math.random() >= p ? 1 : 0);
    T2.n = from + 1000; T2.anim = { k: 'many', t0: now, dur: 3.4, from };
    sfx.push();
  }
  render();
}
function checkTwo(skip) {
  const T2 = S.two, g = parseNum(T2.guess), q = qc(T2.p);
  if (!skip) { if (g === null) { T2.bad = true; sfx.bad(); render(); return; } T2.ok = isRight(g, q); T2.gtxt = T2.guess.trim(); (T2.ok ? sfx.good : sfx.bad)(); }
  else { T2.ok = null; sfx.click(); }
  T2.shown = true; T2.bad = false; render(); showStage();
}
function checkMany(skip) {
  const M = S.many, P = M.pz[M.i], ans = Q(P.a[P.h], P.d), g = parseNum(M.guess);
  if (!skip) { if (g === null) { M.bad = true; sfx.bad(); render(); return; } M.ok = isRight(g, ans); M.gtxt = M.guess.trim(); (M.ok ? sfx.good : sfx.bad)(); }
  else { M.ok = false; M.gtxt = ''; sfx.click(); }
  M.right[M.i] = M.ok; M.shown = true; M.bad = false; render(); showStage();
}
function checkLife(skip) {
  const L = S.life, sc = L.sc, key = `${sc}-${L.v[sc]}`, e = lifeE(sc, L.v[sc]), ans = Q(100 - e, 100);
  if (!skip) {
    let g = parseNum(L.guess); if (g !== null && g > 1 && !/[%/]/.test(L.guess)) g /= 100;
    if (g === null) { L.bad = true; sfx.bad(); render(); return; }
    L.ok[key] = isRight(g, ans); L.info[key] = { gtxt: L.guess.trim(), g }; (L.ok[key] ? sfx.good : sfx.bad)();
  } else { L.ok[key] = null; sfx.click(); }
  L.shown[key] = true; L.bad = false; render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, T2 = S.two, M = S.many, L = S.life;
  if (a === 'pm') { const i = SNAP.findIndex((s) => qeq(s, T2.p)); setP(SNAP[clamp(i + +b.dataset.s, 0, SNAP.length - 1)]); return; }
  if (a === 'check') checkTwo(false);
  else if (a === 'show') checkTwo(true);
  else if (a === 'spin1') spin(1);
  else if (a === 'spin1000') spin(1000);
  else if (a === 'clear') { Object.assign(T2, { n: 0, nShow: 0, th: 0 }); sfx.click(); render(); }
  else if (a === 'mcheck') checkMany(false);
  else if (a === 'mshow') checkMany(true);
  else if (a === 'trap') {
    M.pick = +b.dataset.j; M.ok = M.pick === TRAP_OK; M.right[2] = M.ok; M.shown = true; (M.ok ? sfx.good : sfx.bad)(); render(); showStage();
  } else if (a === 'mnext') {
    if (M.i >= 3) Object.assign(M, { i: 0, pz: pickPuzzles(), right: [] }); else M.i++;
    Object.assign(M, { guess: '', shown: false, ok: null, bad: false, pick: null, rv: 0 }); sfx.click(); render();
  } else if (a === 'msec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); render();
  } else if (a === 'dpm') { S.dice = clamp(S.dice + +b.dataset.s, 1, 8); sfx.tick(); render(); }
  else if (a === 'exmiss') { S.miss = !S.miss; sfx.click(); render(); }
  else if (a === 'lsc') { L.sc = +b.dataset.i; L.guess = ''; L.bad = false; L.rv = L.shown[`${L.sc}-${L.v[L.sc]}`] ? 1 : 0; sfx.click(); render(); }
  else if (a === 'lnext') { L.v[L.sc] = (L.v[L.sc] + 1) % 3; L.guess = ''; L.bad = false; L.rv = L.shown[`${L.sc}-${L.v[L.sc]}`] ? 1 : 0; sfx.click(); render(); }
  else if (a === 'lcheck') checkLife(false);
  else if (a === 'lshow') checkLife(true);
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = ev.target.value;
  if (id === 'twoIn') { S.two.guess = v; S.two.bad = false; } else if (id === 'manyIn') { S.many.guess = v; S.many.bad = false; } else if (id === 'lifeIn') { S.life.guess = v; S.life.bad = false; } else return;
  render();
});
$('ctrlBody').addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter') return; ev.preventDefault();
  const id = ev.target.id;
  if (id === 'twoIn' && S.two.guess.trim()) checkTwo(false); else if (id === 'manyIn' && S.many.guess.trim()) checkMany(false); else if (id === 'lifeIn' && S.life.guess.trim()) checkLife(false);
});

// --- one render per change: controls, readout, state card and facts ---------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v; document.body.dataset.x = v === 'many' && S.sec === 'exact' ? 'exact' : '';
  $('secTwo').hidden = v !== 'two'; $('secMany').hidden = v !== 'many'; $('secLife').hidden = v !== 'life';
  // only the visible view carries the button labels (no hidden duplicates in the DOM)
  const lbl = (id, txt, on) => { $(id).textContent = on ? txt : ''; };
  lbl('twoCheck', t.ui.check, v === 'two'); lbl('twoShow', t.ui.show, v === 'two'); lbl('manyCheck', t.ui.check, v === 'many'); lbl('manyShow', t.ui.show, v === 'many');
  lbl('lifeCheck', t.ui.check, v === 'life'); lbl('lifeShow', t.ui.show, v === 'life'); lbl('lifeNext', t.ui.another, v === 'life');
  if (v === 'two') rTwo(t); else if (v === 'many') rMany(t); else rLife(t);
}
function rTwo(t) {
  const T2 = S.two, x = t.two, P = T2.p, q = qc(P), busy = !!T2.anim;
  $('twoLbl').textContent = x.redLbl; $('twoP').textContent = fq(P); $('twoInLbl').textContent = x.inLbl;
  $('twoAsk').hidden = T2.shown; $('twoRun').hidden = !T2.shown;
  syncInput($('twoIn'), T2.guess, 'text'); $('twoIn').classList.toggle('bad', T2.bad); $('twoCheck').disabled = T2.guess.trim() === '';
  $('spin1').textContent = x.spin1; $('spin1000').textContent = x.spin1000; $('twoClear').textContent = x.clear;
  $('spin1').disabled = busy || T2.n >= CAP; $('spin1000').disabled = busy || T2.n + 1000 > CAP; $('twoClear').disabled = busy || T2.n === 0;
  document.querySelectorAll('#secTwo [data-act=pm]').forEach((b) => { b.disabled = busy; });
  lab.setGlow('rgba(229, 72, 77, .24)');
  lab.setReadout(fq(P), x.chance, T2.shown ? `${t.notRed}: ${fq(q)}` : '', '#e5484d');
  let st;
  if (!T2.shown) st = T2.bad ? { emo: '🤔', title: x.q, lead: t.ui.bad, body: '' } : { emo: '🎡', title: x.q, lead: x.lead, body: x.body };
  else if (T2.nShow === 0) {
    const eq = x.eq(fq(P), fq(q));
    if (T2.ok === null) st = { emo: '👀', title: x.skipT(fq(q)), lead: eq, body: `${x.term} ${x.spinNow}` };
    else if (T2.ok) st = { emo: '✅', title: t.ui.right, lead: eq, body: `${x.term} ${x.spinNow}` };
    else {
      const g = parseNum(T2.gtxt), why = g !== null && Math.abs(g - qv(P)) < 0.006 ? x.same(fq(P)) : g > 1 ? t.ui.over : '';
      st = { emo: '🤔', title: x.wrongT(T2.gtxt), lead: `${why} ${eq}`.trim(), body: `${x.term} ${x.spinNow}` };
    }
  } else {
    const n = T2.nShow, k = T2.cnt[n], sh = dec(k / n, 3);
    st = n < 30 ? { emo: '📈', title: x.fewT, lead: x.few(k, n, fq(q)), body: x.settle } : { emo: '📈', title: x.manyT, lead: x.leadN(k, n, sh, fq(q)), body: x.settle };
  }
  lab.setState({ ...st, extra: `<div class="fine">${esc(t.fine)}</div>` });
  lab.setFacts([{ emo: '🪙', text: t.facts.two.text, src: t.facts.two.src }]);
}
function rMany(t) {
  const M = S.many, x = t.many, sec = S.sec, trap = !sec && M.i === 2, puz = !sec && M.i < 2, end = !sec && M.i === 3;
  $('manyAsk').hidden = !(puz && !M.shown); $('trapRow').hidden = !(trap && !M.shown);
  $('manyNextRow').hidden = !(!sec && ((puz && M.shown) || (trap && M.shown) || end));
  $('diceRow').hidden = sec !== 'dice'; $('exRow').hidden = sec !== 'exact';
  $('manyNext').textContent = end ? t.ui.again : t.ui.next;
  $('manySec').innerHTML = ['dice', 'exact'].map((k) => `<button class="chip ne-c secret ${secret.unlocked() ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="msec" data-k="${k}">${secret.unlocked() ? `${k === 'dice' ? '✉️' : '⭕'} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`).join('');
  const half = fq(pEven, 'frac');
  $('trapOpts').innerHTML = x.opts(half).map((o, j) => `<button class="ne-opt" data-act="trap" data-j="${j}">${esc(o)}</button>`).join('');
  let st, facts = [{ emo: '✉️', text: t.facts.many.text, src: t.facts.many.src }];
  if (sec === 'dice') {
    const n = S.dice, none = (5 / 6) ** n, any = 1 - none;
    $('diceLbl').textContent = x.dl; $('diceN').textContent = n;
    lab.setGlow('rgba(240, 185, 58, .24)'); lab.setReadout(pc(any, 1), x.diceSub, '', '#f0b93a');
    st = { emo: '✉️', title: x.diceT(n, pc(any, 1)), lead: x.diceL(n, pc(none, 1), pc(any, 1)), body: x.diceB };
    facts = [{ emo: '🎲', text: t.facts.dice.text, src: t.facts.dice.src }];
  } else if (sec === 'exact') {
    const cum = [0, ...S.ex, 20], parts = [0, 1, 2, 3].map((k) => dec((cum[k + 1] - cum[k]) / 20, 2)), sum = dec(S.ex[2] / 20, 2);
    $('exMiss').textContent = S.miss ? x.exAll : x.exMiss;
    lab.setGlow('rgba(78, 143, 216, .24)'); lab.setReadout(S.miss ? sum : '1', x.exSub, '', '#4e8fd8');
    st = S.miss ? { emo: '⭕', title: x.exMissT, lead: x.exMissL(parts.slice(0, 3), sum, dec(1 - S.ex[2] / 20, 2)), body: '' } : { emo: '⭕', title: x.exT, lead: x.exL(parts), body: '' };
  } else if (puz) {
    const P = M.pz[M.i], ans = Q(P.a[P.h], P.d), parts = P.a.map((n) => fq(Q(n, P.d), P.mode));
    $('manyInLbl').textContent = x.chanceHid; syncInput($('manyIn'), M.guess, 'text');
    $('manyIn').classList.toggle('bad', M.bad); $('manyCheck').disabled = M.guess.trim() === '';
    lab.setGlow('rgba(240, 185, 58, .24)'); lab.setReadout(M.shown ? fq(ans, P.mode) : '?', x.chanceHid, '', '#f0b93a');
    if (!M.shown) st = M.bad ? { emo: '🤔', title: x.puzT, lead: t.ui.bad, body: '' } : { emo: '🎨', title: x.puzT, lead: x.puzL(M.i + 1), body: x.puzB };
    else if (M.ok) st = { emo: '✅', title: t.ui.right, lead: x.eq(parts), body: x.why };
    else { const g = parseNum(M.gtxt); st = { emo: '🤔', title: M.gtxt ? x.wrongT(M.gtxt, fq(ans, P.mode)) : x.skipT(fq(ans, P.mode)), lead: `${g > 1 ? t.ui.over + ' ' : ''}${x.eq(parts)}`, body: x.why }; }
  } else if (trap) {
    lab.setGlow('rgba(78, 143, 216, .24)'); lab.setReadout(M.shown ? fq(pUnion) : '?', x.chanceOr, '', '#4e8fd8');
    const rev = x.rev(DICE.union, DICE.both, fq(pUnion), half);
    st = !M.shown ? { emo: '🎲', title: x.trapT, lead: x.trapL(half), body: '' }
      : { emo: M.ok ? '✅' : '🤔', title: M.ok ? t.ui.right : x.trapWrong, lead: `${rev[0]} ${rev[1]}`, body: x.trapBody(fq(pNone)) };
  } else {
    const k = M.right.filter(Boolean).length;
    lab.setGlow('rgba(240, 185, 58, .24)'); lab.setReadout(`${k}/3`, '', '', '#f0b93a');
    st = { emo: '🏆', title: x.endT(k), lead: x.endLead, body: '' };
  }
  lab.setState({ ...st, extra: `<div class="fine">${esc(t.fine)}</div>` });
  lab.setFacts(facts);
}
function rLife(t) {
  const L = S.life, x = t.life, sc = L.sc, v = L.v[sc], key = `${sc}-${v}`, e = lifeE(sc, v), shown = !!L.shown[key], vars = LIFE[sc].vars[v];
  $('lifeSc').innerHTML = x.sc.map((s, i) => `<button class="chip ne-c ${i === sc ? 'on' : ''}" data-act="lsc" data-i="${i}">${esc(s)}</button>`).join('');
  $('lifeAsk').hidden = shown;
  $('lifeInLbl').textContent = `${cap(x.ne[sc])} =`;
  syncInput($('lifeIn'), L.guess, 'text'); $('lifeIn').classList.toggle('bad', L.bad); $('lifeCheck').disabled = L.guess.trim() === '';
  const evPct = pc(e / 100, 0), nePct = pc((100 - e) / 100, 0), q = vars.length === 1 ? x.q[sc](evPct) : x.q[sc](vars[0], vars[1]);
  lab.setGlow('rgba(78, 155, 232, .24)');
  lab.setReadout(evPct, x.sub[sc], shown ? `${x.ne[sc]}: ${nePct}` : '', LIFE[sc].ev);
  let st;
  if (!shown) st = L.bad ? { emo: ['🌦️', '🧤', '🎟️'][sc], title: x.title[sc], lead: t.ui.bad, body: '' } : { emo: ['🌦️', '🧤', '🎟️'][sc], title: x.title[sc], lead: q, body: sc === 2 ? `${x.body} ${x.sq(vars[1] / 100)}.` : x.body };
  else {
    const eq = x.eq(cap(x.ev[sc]), evPct, x.ne[sc], nePct), extra = sc === 2 ? ` ${x.tix(vars[0], vars[1])}` : '', ok = L.ok[key];
    if (ok === null) st = { emo: '👀', title: `${x.ne[sc]}: ${nePct}`, lead: eq + extra, body: x.why };
    else if (ok) st = { emo: '✅', title: t.ui.right, lead: eq + extra, body: x.why };
    else { const inf = L.info[key] ?? { gtxt: '', g: 0 }, why = Math.abs(inf.g - e / 100) < 0.006 ? `${x.same(inf.gtxt, x.ev[sc])} ` : ''; st = { emo: '🤔', title: x.wrongT(inf.gtxt, nePct), lead: `${why}${eq}${extra}`, body: x.why }; }
  }
  lab.setState({ ...st, extra: `<div class="fine">${esc(t.fine)}</div>` });
  lab.setFacts(t.facts.life.map((f) => ({ emo: '🌦️', text: f.text, src: f.src })));
}

// --- go ------------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h; geo = null;
  const v = lab.view;
  if (v === 'two') drawTwo(c, w, h, dt, time); else if (v === 'many') drawMany(c, w, h, dt, time); else drawLife(c, w, h, dt, time);
});
render();
</script>
