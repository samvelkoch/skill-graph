// an eye with a white highlight; o: rx, ry, pr (pupil), wide, lx/ly (look, -1..1), closed, sulk (lid), lid colour
function eye(x, y, o) {
  const wide = o.wide || 0, rx = o.rx * (1 + .3 * wide), ry = o.ry * (1 + .35 * wide);
  if (o.closed) return `<path d="M${x - rx},${y + 1} Q${x},${y - ry * 1.2} ${x + rx},${y + 1}" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/>`;
  const pr = Math.max(.8, o.pr - wide * .9), px = x + (o.lx || 0) * Math.max(0, rx - pr - .3), py = y + (o.ly || 0) * Math.max(0, ry - pr - .3);
  let s = `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" stroke="${INK}" stroke-width="1.4"/>`;
  s += `<circle cx="${px}" cy="${py}" r="${pr}" fill="${INK}"/><circle cx="${px + pr * .35}" cy="${py - pr * .4}" r="${Math.max(.5, pr * .38)}" fill="#fff"/>`;
  if (o.sulk > 0) {
    const lh = ry * (.35 + .75 * o.sulk * .6);
    s += `<rect x="${x - rx - .6}" y="${y - ry - .8}" width="${2 * rx + 1.2}" height="${lh + .8}" fill="${o.lid || '#f0a050'}"/><path d="M${x - rx - .6},${y - ry + lh} H${x + rx + .6}" stroke="${INK}" stroke-width="1.4"/>`;
  }
  return s;
}

// Pip the cat; origin = feet, y up is negative. mouth: 0 smile, 1 open, 2 frown, 3 lick
function cat(o = {}) {
  const { x = 0, y = 0, s = 1, hx = 0, hy = 0, lx = 0, ly = 0, wide = 0, sulk = 0, wet = 0, reach = 0, tail = 0, mouth = 0 } = o;
  const tcp = `M14,-9 C${lerp(32, 36, tail)},${lerp(-9, -8, tail)} ${lerp(38, 40, tail)},${lerp(-30, -1, tail)} ${lerp(34, 36, tail)},${lerp(-40, 6, tail)}`;
  let g = `<g transform="translate(${x},${y}) scale(${s})">`;
  g += `<ellipse cx="0" cy="0" rx="23" ry="4" fill="rgba(40,20,5,.2)"/>`;
  g += `<path d="${tcp}" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/><path d="${tcp}" fill="none" stroke="#f0933f" stroke-width="5.6" stroke-linecap="round"/>`;
  g += `<ellipse cx="0" cy="-14" rx="19" ry="15" fill="url(#gCat)" stroke="${INK}" stroke-width="2"/><ellipse cx="0" cy="-10" rx="10" ry="9" fill="#ffe3b8" opacity=".8"/>`;
  g += `<ellipse cx="-9" cy="-1.5" rx="6.6" ry="4" fill="url(#gCat)" stroke="${INK}" stroke-width="1.6"/><ellipse cx="9" cy="-1.5" rx="6.6" ry="4" fill="url(#gCat)" stroke="${INK}" stroke-width="1.6"/>`;
  if (reach > .02) {
    const ex = 8 + 10 + 26 * reach, ey = -20 - 3 * reach;
    g += `<path d="M8,-19 L${ex},${ey}" stroke="${INK}" stroke-width="8.4" stroke-linecap="round"/><path d="M8,-19 L${ex},${ey}" stroke="#f5a053" stroke-width="5.2" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="4.4" fill="#ffc98e" stroke="${INK}" stroke-width="1.6"/>`;
  }
  if (wet > 0) g += `<ellipse cx="0" cy="-14" rx="19" ry="15" fill="rgba(60,120,190,${wet * .3})"/>`;
  const d = sulk * 4;
  g += `<g transform="translate(${hx},${-36 + hy})">`;
  g += `<path d="M-13,${-5 + d} L${-11 - sulk * 5},${-21 + d * 2.4} L-2,-11 Z" fill="#f0933f" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path d="M-10.5,${-9 + d} L${-9.5 - sulk * 4},${-17 + d * 2.2} L-5,-11.5 Z" fill="#f4a6b8"/>`;
  g += `<path d="M13,${-5 + d} L${11 + sulk * 5},${-21 + d * 2.4} L2,-11 Z" fill="#f0933f" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path d="M10.5,${-9 + d} L${9.5 + sulk * 4},${-17 + d * 2.2} L5,-11.5 Z" fill="#f4a6b8"/>`;
  g += `<ellipse cx="0" cy="0" rx="15" ry="13.5" fill="url(#gCat)" stroke="${INK}" stroke-width="2"/>`;
  g += `<path d="M-3,-12 L-2,-7 M0,-13 L0,-8 M3,-12 L2,-7" stroke="#c5622a" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="0" cy="5.5" rx="8" ry="5.5" fill="#ffe6c4"/>`;
  const ec = { rx: 4.2, ry: 4.8, pr: 2.4, wide, lx, ly, sulk };
  g += eye(-6, -1, ec) + eye(6, -1, ec);
  g += `<path d="M-1.9,3.6 L1.9,3.6 L0,5.8 Z" fill="#e8798f" stroke="${INK}" stroke-width="1" stroke-linejoin="round"/>`;
  if (mouth === 1) g += `<ellipse cx="0" cy="9.6" rx="2.6" ry="3.2" fill="#7a2f3a" stroke="${INK}" stroke-width="1.1"/>`;
  else if (mouth === 2) g += `<path d="M-4.2,10.6 Q0,6.6 4.2,10.6" fill="none" stroke="${INK}" stroke-width="1.5" stroke-linecap="round"/>`;
  else {
    g += `<path d="M-4.4,7.6 Q-2.2,10.4 0,6.4 Q2.2,10.4 4.4,7.6" fill="none" stroke="${INK}" stroke-width="1.4" stroke-linecap="round"/>`;
    if (mouth === 3) g += `<ellipse cx="2.4" cy="10.6" rx="2" ry="2.4" fill="#f27b94" stroke="${INK}" stroke-width="1"/>`;
  }
  g += `<path d="M-9,4.5 L-20,2.5 M-9,7 L-20,8 M9,4.5 L20,2.5 M9,7 L20,8" stroke="${INK}" stroke-width=".9" stroke-linecap="round" opacity=".7"/>`;
  if (wet > 0) g += `<ellipse cx="0" cy="0" rx="15" ry="13.5" fill="rgba(60,120,190,${wet * .3})"/><path d="M-8,-12 Q-6,-8 -9,-5 M6,-13 Q9,-9 6,-5" fill="none" stroke="rgba(40,70,120,${wet * .5})" stroke-width="1.4" stroke-linecap="round"/>`;
  g += `</g>`;
  if (wet > 0) {
    const dr = (cx, cy, r) => `<path d="M${cx},${cy - r * 1.6} Q${cx + r},${cy} ${cx},${cy + r} Q${cx - r},${cy} ${cx},${cy - r * 1.6} Z" fill="#8fd0f2" stroke="#4f9bc4" stroke-width=".8" opacity="${wet}"/>`;
    g += dr(-16, -4, 2.3) + dr(17, -10, 2) + dr(-3, 4, 1.8) + dr(-19, -26, 1.8 + sulk * .01);

// a mouse's head at its origin; scared: wide eyes and a drop of sweat
function mouseHead(o = {}) {
  const { wide = 0, lx = 0, ly = 0, laugh = 0 } = o;
  let g = `<circle cx="-7" cy="-6.5" r="5.4" fill="url(#gMouse)" stroke="${INK}" stroke-width="1.8"/><circle cx="-7" cy="-6.5" r="3" fill="#f4a6b8"/>`;
  g += `<circle cx="7" cy="-6.5" r="5.4" fill="url(#gMouse)" stroke="${INK}" stroke-width="1.8"/><circle cx="7" cy="-6.5" r="3" fill="#f4a6b8"/>`;
  g += `<ellipse cx="0" cy="0" rx="8.6" ry="8" fill="url(#gMouse)" stroke="${INK}" stroke-width="1.9"/>`;
  const ec = { rx: 2.9, ry: 3.3, pr: 1.7, wide, lx, ly, closed: laugh > .5 };
  g += eye(-3.7, -1, ec) + eye(3.7, -1, ec);

  else if (wide > .4) g += `<ellipse cx="0" cy="5.6" rx="1.2" ry="1.5" fill="#7a2f3a"/>`;
  g += `<path d="M-4,3.6 L-11,2.6 M-4,5 L-11,6.2 M4,3.6 L11,2.6 M4,5 L11,6.2" stroke="${INK}" stroke-width=".8" stroke-linecap="round" opacity=".7"/>`;
  if (wide > .4) g += `<path d="M11,-6 Q13,-2 11,-1.2 Q9,-2 11,-6 Z" fill="#8fd0f2" stroke="#4f9bc4" stroke-width=".7"/>`;
  return g;
}

// a goldfish, facing right (dir = 1) or left (dir = -1)
function fish(o = {}) {
  const { x = 0, y = 0, s = 1, rot = 0, joy = 0, dir = 1 } = o;
  let g = `<g transform="translate(${x},${y}) rotate(${rot}) scale(${dir * s},${s})">`;
  g += `<path d="M-8,0 C-13,-7 -18,-9 -17,-1 C-16.5,0 -16.5,1 -17,2 C-18,9 -13,7 -8,0 Z" fill="#ff7a14" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/>`;
  g += `<path d="M-3,-5.6 Q1,-12 6,-5.2 Z" fill="#ff8a1f" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>`;
  g += `<ellipse cx="0" cy="0" rx="10" ry="6.5" fill="url(#gFish)" stroke="${INK}" stroke-width="1.5"/><ellipse cx="1" cy="-2.6" rx="5" ry="1.7" fill="#fff" opacity=".35"/>`;
  g += `<path d="M-1,1.5 Q-5,7 1,7 Z" fill="#ff8a1f" stroke="${INK}" stroke-width="1.1" stroke-linejoin="round"/><path d="M2.4,-4 Q0.4,0 2.4,4" fill="none" stroke="rgba(130,50,0,.5)" stroke-width="1"/>`;
  g += `<circle cx="5.6" cy="-1.4" r="2.4" fill="#fff" stroke="${INK}" stroke-width="1"/><circle cx="6.1" cy="-1.3" r="1.2" fill="${INK}"/><circle cx="6.5" cy="-1.8" r=".5" fill="#fff"/>`;
  g += joy > .5 ? `<path d="M7.6,2 Q9,5 5.4,4.2 Z" fill="#a63a3a" stroke="${INK}" stroke-width=".9"/>` : `<path d="M8.6,1.8 Q7,3.6 5.4,2.6" fill="none" stroke="${INK}" stroke-width="1" stroke-linecap="round"/>`;
  return g + `</g>`;
}

// the round bowl: water behind the fish, glass in front. A bowl is a sphere, so tilting it does not change its outline.
function bowlBack(cx, cy, r, water) {
  const d = r * (1 - 2 * water);
  if (water <= .02) return '';
  const w = Math.sqrt(Math.max(0, r * r - d * d));
  return `<path d="M${cx - w},${cy + d} A${r},${r} 0 ${d < 0 ? 1 : 0} 0 ${cx + w},${cy + d} Z" fill="url(#gWater)" opacity=".85"/><ellipse cx="${cx}" cy="${cy + d}" rx="${w}" ry="${Math.min(2.4, w / 4)}" fill="#cdeefc" opacity=".85"/>`;
}
function bowlFront(cx, cy, r, th) {
  const px = cx + r * .9 * Math.sin(th), py = cy - r * .9 * Math.cos(th);
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#gGlass)" stroke="#4f86a8" stroke-width="1.8"/>
    <path d="M${cx - r * .66},${cy - r * .2} A${r * .68},${r * .68} 0 0 1 ${cx - r * .2},${cy - r * .66}" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>
    <ellipse cx="${px}" cy="${py}" rx="${r * .42}" ry="${r * .13}" transform="rotate(${th * 180 / Math.PI} ${px} ${py})" fill="rgba(255,255,255,.35)" stroke="#4f86a8" stroke-width="1.3"/>`;
}
const windowSVG = (x, y, w, h) => `<rect x="${x - 3}" y="${y - 3}" width="${w + 6}" height="${h + 6}" rx="3" fill="#a8703f" stroke="${INK}" stroke-width="2"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#gSky)"/>
  <circle cx="${x + w * .72}" cy="${y + h * .3}" r="${h * .17}" fill="#fff6c2" opacity=".9"/><ellipse cx="${x + w * .3}" cy="${y + h * .62}" rx="${w * .2}" ry="${h * .09}" fill="#fff" opacity=".9"/>
  <path d="M${x + w / 2},${y} V${y + h} M${x},${y + h / 2} H${x + w}" stroke="#a8703f" stroke-width="2.2"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${INK}" stroke-width="1.2"/>`;
function clockSVG(cx, cy, r, min) {
  const ha = (min / 720) * 2 * Math.PI, ma = ((min % 60) / 60) * 2 * Math.PI, hp = (a, l) => `${cx + Math.sin(a) * l},${cy - Math.cos(a) * l}`;
  let g = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fffdf5" stroke="${INK}" stroke-width="2.2"/>`;
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; g += `<path d="M${hp(a, r * .8)} L${hp(a, r * .92)}" stroke="${INK}" stroke-width="1.2"/>`; }
  g += `<path d="M${cx},${cy} L${hp(ha, r * .5)}" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/><path d="M${cx},${cy} L${hp(ma, r * .76)}" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="1.5" fill="#e5484d"/>`;
  return g;
}

// --- the story: four poses of one kitchen scene, in panel coordinates 170 x 150 ----------------------------------
const P0 = { cx: 30, cy: 120, hx: 0, hy: 0, lx: 0, ly: 0, wide: 0, sulk: 0, wet: 0, reach: 0, tail: 0, mouth: 0,
  bowlA: 1, bx: 135, rot: 0, water: .85, splash: 0, fx: 135, fy: 66, fr: 0, joy: 0, mouseA: 0, laugh: 0, bucketA: 0, puddle: 0 };
const A = { ...P0, hx: 2, hy: -1, lx: .8, ly: -.9 };
const B = { ...A, cx: 80, cy: 78, hx: 5, hy: 0, lx: 1, ly: -.2, reach: 1, mouth: 3 };
const C = { ...B, hx: 7, hy: -1, wide: 1, lx: .2, ly: .4, reach: .6, mouth: 1, bx: 150, rot: 42, water: .3, splash: 1, fx: 154, fy: 32, fr: -35 };
const D = { ...P0, cy: 120, sulk: 1, wet: 1, tail: 1, mouth: 2, hy: 3, ly: .6, bowlA: 0, bx: 150, rot: 42, water: .3, fx: 128, fy: 98, fr: -15, joy: 1, mouseA: 1, laugh: 1, bucketA: 1, puddle: 1 };
const POSES = [A, B, C, D];
function mix(a, b, t, seg) {
  const e = ease(t), o = {};
  for (const k in P0) o[k] = lerp(a[k], b[k], e);
  o.mouth = t < .5 ? a.mouth : b.mouth;
  if (seg === 0) o.cy -= 24 * Math.sin(Math.PI * e);
  return o;
}

function scene(p, o = {}) {
  const r = 17, th = p.rot * Math.PI / 180, bcx = p.bx + r * Math.sin(th), bcy = 78 - r * Math.cos(th);
  let s = `<rect width="170" height="150" fill="url(#gWall)"/>`;
  for (let x = 6; x < 170; x += 22) s += `<rect x="${x}" y="0" width="9" height="112" fill="#fff" opacity=".16"/>`;
  s += `<rect y="114" width="170" height="36" fill="url(#gFloor)"/><path d="M0,130 H170 M0,142 H170" stroke="rgba(80,40,10,.14)"/><rect y="111" width="170" height="5" fill="#fff5de" stroke="${INK}" stroke-width="1"/>`;
  s += windowSVG(10, 10, 42, 34) + `<polygon points="14,46 50,46 122,114 72,114" fill="#fffbe0" opacity=".14"/>`;
  if (o.clock !== undefined) s += clockSVG(96, 28, 13, o.clock);
  s += `<ellipse cx="115" cy="121" rx="64" ry="4" fill="rgba(60,30,10,.18)"/>`;
  s += `<rect x="58" y="86" width="7" height="32" fill="#9a6439" stroke="${INK}" stroke-width="1.6"/><rect x="158" y="86" width="7" height="32" fill="#9a6439" stroke="${INK}" stroke-width="1.6"/>`;
  s += `<rect x="50" y="78" width="130" height="9" rx="3" fill="url(#gTable)" stroke="${INK}" stroke-width="2"/><path d="M55,80.2 H175" stroke="#fff" stroke-width="1.4" opacity=".35"/>`;
  if (p.puddle > .01) s += `<ellipse cx="${p.cx}" cy="119" rx="${34 * p.puddle}" ry="${6 * p.puddle}" fill="rgba(110,180,225,.65)" stroke="rgba(60,120,170,.7)" stroke-width="1"/>`;
  if (p.bucketA > .01) s += `<ellipse cx="128" cy="96" rx="14" ry="3.6" fill="#4d7aa6" stroke="${INK}" stroke-width="1.6" opacity="${p.bucketA}"/>`;
  if (p.bowlA > .01) s += `<g opacity="${p.bowlA}">${bowlBack(bcx, bcy, r, p.water)}</g>`;
  s += fish({ x: p.fx, y: p.fy, rot: p.fr, joy: p.joy });
  if (p.bowlA > .01) s += `<g opacity="${p.bowlA}">${bowlFront(bcx, bcy, r, th)}</g>`;
  if (p.bucketA > .01) s += `<g opacity="${p.bucketA}"><path d="M114,96 L117,120 H139 L142,96 Z" fill="url(#gBucket)" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path d="M118,100 L120,116" stroke="#fff" stroke-width="2" opacity=".5" stroke-linecap="round"/><path d="M114,96 Q128,106 142,96" fill="none" stroke="${INK}" stroke-width="1.6"/></g>`;
  if (p.mouseA > .01) s += `<g opacity="${p.mouseA}">${mouse({ x: 84, y: 120, laugh: p.laugh })}</g>`;

  s += `<rect y="166" width="340" height="66" fill="url(#gFloor)"/><path d="M0,190 H340 M0,212 H340" stroke="rgba(80,40,10,.14)"/><rect y="162" width="340" height="6" fill="#fff5de" stroke="${INK}" stroke-width="1"/>`;
  s += windowSVG(262, 22, 56, 44);
  s += `<ellipse cx="184" cy="170" rx="74" ry="5" fill="rgba(60,30,10,.18)"/><rect x="128" y="168" width="8" height="46" fill="#9a6439" stroke="${INK}" stroke-width="1.6"/><rect x="232" y="168" width="8" height="46" fill="#9a6439" stroke="${INK}" stroke-width="1.6"/>`;
  s += `<rect x="118" y="158" width="132" height="11" rx="3" fill="url(#gTable)" stroke="${INK}" stroke-width="2"/>`;
  s += bowlBack(184, 138, 20, .85) + fish({ x: 184, y: 142, s: 1.15, joy: 1, dir: -1, rot: -8 }) + bowlFront(184, 138, 20, 0);
  s += cat({ x: 70, y: 206, s: 1.45, hx: 3, lx: 1, ly: -.25, wide: .25, mouth: 3 });
  s += mouse({ x: 292, y: 212, s: 1.5, wide: 1, lx: -1, ly: -.2 });

};
function tailPath(b, k) {

  const th = Math.atan2(dy / ry, dx / rx), pt = (a, m) => `${b.x + rx * m * Math.cos(a)},${b.y + ry * m * Math.sin(a)}`;
  if (k === 'thought') {
    const e = { x: b.x + rx * Math.cos(th), y: b.y + ry * Math.sin(th) }, L = Math.hypot(b.tx - e.x, b.ty - e.y);
    return { back: [[.22, 6.5], [.55, 4.8], [.9, 3.2]].map(([f, r]) => `<circle cx="${e.x + (b.tx - e.x) * f}" cy="${e.y + (b.ty - e.y) * f}" r="${Math.min(r, L / 4)}" fill="#fff" stroke="${INK}" stroke-width="2"/>`).join(''), front: '' };
  }
  const w = k === 'shout' ? .2 : .3;
  return {
    back: `<path d="M${pt(th - w, 1)} L${b.tx},${b.ty} L${pt(th + w, 1)} Z" fill="${k === 'shout' ? '#fff3a8' : '#fff'}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>`,
    front: `<path d="M${pt(th - w + .03, .9)} L${b.x + (b.tx - b.x) * .97},${b.y + (b.ty - b.y) * .97} L${pt(th + w - .03, .9)} Z" fill="${k === 'shout' ? '#fff3a8' : '#fff'}"/>`,
  };
}
function balloonSVG(i, t) {
  const b = S.bal[i], k = BK[i], { rx, ry } = BD[k], lines = t.b.txt[k], tl = tailPath(b, k);
  let body;
  if (k === 'speech') body = `<ellipse cx="${b.x}" cy="${b.y}" rx="${rx}" ry="${ry}" fill="#fff" stroke="${INK}" stroke-width="2.2"/>`;
  else if (k === 'thought') {
    const bumps = Array.from({ length: 10 }, (_, j) => { const a = j * Math.PI / 5; return [b.x + (rx - 6) * Math.cos(a), b.y + (ry - 5) * Math.sin(a)]; });
    body = bumps.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9.5" fill="#fff" stroke="${INK}" stroke-width="2.2"/>`).join('') + `<ellipse cx="${b.x}" cy="${b.y}" rx="${rx - 6}" ry="${ry - 5}" fill="#fff" stroke="${INK}" stroke-width="2.2"/>`
      + bumps.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="8.2" fill="#fff"/>`).join('') + `<ellipse cx="${b.x}" cy="${b.y}" rx="${rx - 7}" ry="${ry - 6}" fill="#fff"/>`;
  } else {

  const txt = `<text text-anchor="middle" font-size="${fs}" font-weight="${k === 'shout' ? 900 : 800}" ${k === 'thought' ? 'font-style="italic"' : ''} fill="${INK}" font-family="Nunito, sans-serif">${lines.map((l, j) => `<tspan x="${b.x}" y="${y0 + j * 14}">${esc(l)}</tspan>`).join('')}</text>`;
  let tip = '';
  if (!S.balChecked) tip = `<circle cx="${b.tx}" cy="${b.ty}" r="8" fill="#f5c84c" stroke="${INK}" stroke-width="2.2"/><circle cx="${b.tx}" cy="${b.ty}" r="19" fill="rgba(0,0,0,.001)" class="cm-tip" data-b="${i}" data-part="tip" style="cursor:grab"/>`;
  else if (b.wrong) tip = `<circle cx="${b.tx}" cy="${b.ty}" r="9" fill="#ff7a6b" stroke="${INK}" stroke-width="2"/>`;
  else tip = `<circle cx="${b.tx}" cy="${b.ty}" r="9" fill="#3ddc97" stroke="${INK}" stroke-width="2"/>`;

function drawBalloons() {
  const t = T[lang];
  $('gBal').innerHTML = S.z.map((i) => balloonSVG(i, t)).join('');
  if (S.balChecked) {
    $('gMarks').innerHTML = BK.map((_, i) => { const z = ZONE[BWHO[i]]; return `<ellipse cx="${z.x}" cy="${z.y}" rx="${z.rx}" ry="${z.ry}" fill="none" stroke="#3ddc97" stroke-width="3" stroke-dasharray="6 4" opacity="${S.bal[i].wrong ? 1 : .5}"/>`; }).join('');
  } else $('gMarks').innerHTML = '';
}
function buildBalStatic() {
  $('svBal').innerHTML = `<rect x="0" y="0" width="360" height="336" rx="14" fill="#f8f4ea"/>
    <g id="gScene"><rect x="13" y="12" width="340" height="232" rx="6" fill="#000" opacity=".16"/><g transform="translate(10,8)"><g clip-path="url(#cpBig)">${balScene()}</g><rect width="340" height="232" rx="6" fill="none" stroke="${INK}" stroke-width="3"/></g>
      <rect x="10" y="250" width="340" height="78" rx="12" fill="#ece5d2" stroke="#b8ad92" stroke-width="2" stroke-dasharray="6 4"/><g id="gMarks"></g><g id="gBal"></g></g>
    <g id="gRead" style="display:none"></g>`;
}
buildBalStatic();
function readSVG() {
  // panels in reading order: slot s holds the story panel that comes s-th (mirrored for manga)
  const col = (s) => (S.manga ? 1 - (s % 2) : s % 2), row = (s) => s >> 1;
  let s = '';
  for (let n = 0; n < 4; n++) s += `<g transform="translate(${10 + col(n) * 180},${12 + row(n) * 162})">${panelSVG(POSES[n])}</g>`;
  const c = (n) => [10 + col(n) * 180 + 85, 12 + row(n) * 162 + 75];
  const arrow = (a, b, bend) => `<path d="M${a[0]},${a[1]} Q${bend[0]},${bend[1]} ${b[0]},${b[1]}" fill="none" stroke="#e5484d" stroke-width="4.5" stroke-linecap="round" marker-end="url(#mkR)" opacity=".95"/>`;
  const sh = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  const c0 = c(0), c1 = c(1), c2 = c(2), c3 = c(3), mid = [180, 168];
  s += arrow(sh(c0, c1, .28), sh(c0, c1, .75), [(c0[0] + c1[0]) / 2, c0[1] - 6]);
  s += arrow(sh(c1, c2, .2), sh(c1, c2, .8), [mid[0] + (c1[0] < c2[0] ? 36 : -36), mid[1] - 30]);
  s += arrow(sh(c2, c3, .28), sh(c2, c3, .75), [(c2[0] + c3[0]) / 2, c2[1] - 6]);
  for (let n = 0; n < 4; n++) { const [x, y] = [10 + col(n) * 180, 12 + row(n) * 162]; s += badge(x + 16, y + 16, n + 1, '#f5c84c', 13); }
  return s;
}
function svgPt(ev) {
  const svg = $('svBal'), m = svg.getScreenCTM(); if (!m) return { x: 0, y: 0 };
  const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse()); return { x: p.x, y: p.y };
}
const svBal = $('svBal');
svBal.addEventListener('pointerdown', (ev) => {
  if (S.balChecked || S.read) return;
  const el = ev.target.closest('[data-b]'); if (!el) return;
  const i = +el.dataset.b, part = el.dataset.part, p = svgPt(ev), b = S.bal[i];
  S.drag = { i, part, ox: (part === 'tip' ? b.tx : b.x) - p.x, oy: (part === 'tip' ? b.ty : b.y) - p.y };
  S.z = S.z.filter((j) => j !== i).concat(i);
  try { svBal.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
  ev.preventDefault(); sfx.tick(); drawBalloons();
});
svBal.addEventListener('pointermove', (ev) => {
  const d = S.drag; if (!d) return;
  const p = svgPt(ev), b = S.bal[d.i], { rx, ry } = BD[BK[d.i]];
  if (d.part === 'tip') { b.tx = clamp(p.x + d.ox, 6, 354); b.ty = clamp(p.y + d.oy, 6, 330); }
  else {
    const nx = clamp(p.x + d.ox, rx + 4, 356 - rx), ny = clamp(p.y + d.oy, ry + 4, 332 - ry), dx = nx - b.x, dy = ny - b.y;
    b.x = nx; b.y = ny; b.tx = clamp(b.tx + dx, 6, 354); b.ty = clamp(b.ty + dy, 6, 330);

const endDrag = () => {
  if (!S.drag) return; S.drag = null; sfx.click(); render();
};
svBal.addEventListener('pointerup', endDrag);
svBal.addEventListener('pointercancel', endDrag);
const placed = () => S.bal.filter((b) => b.y < 232).length;
const inZone = (b, z) => ((b.tx - z.x) / (z.rx + 6)) ** 2 + ((b.ty - z.y) / (z.ry + 6)) ** 2 <= 1;
function checkBalloons() {
  S.balChecked = true;
  S.bal.forEach((b, i) => { b.wrong = !inZone(b, ZONE[BWHO[i]]); });
  S.score = S.bal.filter((b) => !b.wrong).length;
  (S.score === 3 ? sfx.good : sfx.bad)();
  const from = S.bal.map((b) => [b.tx, b.ty]);
  anim(750, (t) => {
    const e = ease(t);
    S.bal.forEach((b, i) => { if (b.wrong) { const z = ZONE[BWHO[i]]; b.tx = lerp(from[i][0], z.tx, e); b.ty = lerp(from[i][1], z.ty, e); } });

  lab.setReadout(`${placed()}/3`, b.sub, '', '#d9825f');
  let st;
  if (S.read) st = { emo: '📖', title: (S.manga ? b.rdM : b.rdW)[0], lead: (S.manga ? b.rdM : b.rdW)[1] };
  else if (!S.balChecked) st = placed() < 3 ? { emo: '💬', title: b.pick[0], lead: b.pick[1] } : { emo: '🤔', title: b.ready[0], lead: b.ready[1] };
  else if (S.score === 3) st = { emo: '✅', title: b.ok[0], lead: b.ok[1] };
  else { const r = b.bad(S.score); st = { emo: '💭', title: r[0], lead: r[1] }; }

  let h = '';
  if (S.read) h = `<div class="cm-row"><button class="chip ${S.manga ? '' : 'on'}" data-act="west">${esc(b.west)}</button><button class="chip ${S.manga ? 'on' : ''}" data-act="manga">${esc(b.manga)}</button></div><div class="cm-row"><button class="btn ghost" data-act="rback">${esc(b.back)}</button></div>`;
  else if (!S.balChecked) h = `<div class="cm-row"><button class="btn" data-act="bcheck"${placed() < 3 ? ' disabled' : ''}>${esc(b.check)}</button><button class="btn ghost" data-act="breset">${esc(b.reset)}</button></div>`;
  else h = `<div class="cm-row"><button class="btn" data-act="read">${esc(b.read)}</button><button class="btn ghost" data-act="breset">${esc(b.reset)}</button></div>`;

// --- events --------------------------------------------------------------------------------------------------------
$('svOrder').addEventListener('click', (ev) => {
  const g = ev.target.closest('.cm-p'); if (!g || S.sec || S.mode !== 'grid' || S.checked) return;
  const p = +g.dataset.p, n = S.picks.indexOf(p);
  if (n >= 0) S.picks.splice(n, 1); else S.picks.push(p);
  sfx.tick(); render();
});
$('svShots').addEventListener('click', (ev) => {
  const g = ev.target.closest('.cm-shot'); if (!g || S.qi >= 3 || S.shotPick !== null) return;
  S.shotPick = g.dataset.shot; const ok = S.shotPick === SHOTQ[S.qi];
  S.right[S.qi] = ok; (ok ? sfx.good : sfx.bad)(); render(); showStage();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'check') {
    S.checked = true; S.ok = S.picks.join() === '0,1,2,3'; (S.ok ? sfx.good : sfx.snap)(); render(); showStage();
  } else if (a === 'shuffle') { stopAnim(); S.perm = shuffle(); S.picks = []; S.checked = false; S.ok = false; S.mode = 'grid'; S.gapPick = null; sfx.click(); render(); }
  else if (a === 'play') startPlay();
  else if (a === 'stop') { stopAnim(); S.mode = 'grid'; render(); }
  else if (a === 'gap') { S.mode = 'gap'; S.gapPick = null; buildGap(T[lang]); sfx.click(); render(); showStage(); }
  else if (a === 'gapopt') { S.gapPick = +b.dataset.i; (S.gapPick === T[lang].o.gapOk ? sfx.good : sfx.bad)(); openGap(); render(); showStage(); }
  else if (a === 'back') { S.mode = 'grid'; sfx.click(); render(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    stopAnim(); S.filmPlaying = false; S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); render();
  } else if (a === 'playfilm') startFilm();
  else if (a === 'stopfilm') { stopAnim(); S.filmPlaying = false; render(); }
  else if (a === 'time') { S.timeIdx = +b.dataset.i; sfx.tick(); render(); }
  else if (a === 'snext') { S.qi++; S.shotPick = null; sfx.click(); render(); }
  else if (a === 'sagain') { S.qi = 0; S.shotPick = null; S.right = []; sfx.click(); render(); }
  else if (a === 'bcheck') checkBalloons();
  else if (a === 'breset') { stopAnim(); S.bal = newBal(); S.z = [0, 1, 2]; S.balChecked = false; S.read = false; sfx.click(); render(); }
  else if (a === 'read') { S.read = true; S.manga = false; sfx.click(); render(); }
  else if (a === 'rback') { S.read = false; sfx.click(); render(); }
  else if (a === 'west' || a === 'manga') { S.manga = a === 'manga'; sfx.click(); render(); }
});

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('svOrder').toggleAttribute('hidden', v !== 'order'); $('svShots').toggleAttribute('hidden', v !== 'shots'); $('svBal').toggleAttribute('hidden', v !== 'balloons');
  if (v === 'order') {
    if (S.mode === 'gap' && (S.gapPick === null || !$('oGap').firstChild)) buildGap(t);
    renderOrder(t);
  } else if (v === 'shots') renderShots(t);
  else renderBalloons(t);
}
render();
