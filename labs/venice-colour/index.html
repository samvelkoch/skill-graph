// model: a see-through layer lets through T = mix(white, C, 0.5), counted once (half on the way down, half on the way up);
// result = base × Π T, shown with a gentle lift c^0.8 (disp)
const transm = (name) => mixc(WHITE, PAINT[name], 0.5);
const half = (name) => transm(name).map(Math.sqrt);
const disp = (c) => c.map((v) => Math.pow(clamp(v, 0, 1), 0.8));
// the beam's journey: colour after each layer on the way down, at the bounce, after each layer on the way up
function trace(layers) {
  let k = -1;
  for (let i = layers.length - 1; i >= 0; i--) if (layers[i].thick) { k = i; break; }
  const down = [], up = [];
  let c = WHITE;
  for (let i = layers.length - 1; i > k; i--) { c = mul(c, half(layers[i].c)); down[i] = disp(c); }
  c = mul(c, k >= 0 ? PAINT[layers[k].c] : WHITE);
  const bounce = disp(c);
  for (let i = k + 1; i < layers.length; i++) { c = mul(c, half(layers[i].c)); up[i] = disp(c); }
  return { k, down, up, bounce, out: disp(c) };
}

    S.sAns = i; S.sp = 'rev'; store.set('vc:sp', 'free'); S.coinAt = now() + 0.2; (i === 0 ? sfx.good : sfx.bad)();
  } else {
    S.gAns = i; S.gp = 'rev'; store.set('vc:gp', 'free'); (i === 0 ? sfx.good : sfx.bad)();
    S.blown = false; S.pinch = []; addPinch('cobalt'); S.autoBlow = now() + 0.95;
  }
  showStage(); render();
}

// --- one render per change: controls, readout and the state card ------------------------------------------------
const chip = (act, arg, label, on, extra = '') => `<button class="chip vc-c ${on ? 'on' : ''}" data-act="${act}" data-arg="${arg}">${extra}${esc(label)}</button>`;
const opts = (list) => `<div class="vc-opts">${list.map((o, i) => `<button class="vc-o" data-act="ans" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
const verdict = (ok, okText, badText, mine) => `<div class="vc-verdict" style="color:${ok ? OK : BAD}">${esc(ok ? okText : badText)}</div>${mine ? `<div class="vc-mine">${esc(mine)}</div>` : ''}`;
function show(id, on) { $(id).style.display = on ? 'block' : 'none'; }
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  show('vcLay', v === 'layers' && (S.lp === 'rev2' || S.lp === 'free'));
  show('vcShop', v === 'shop' && S.sp !== 'ask');
  show('vcGlass', v === 'glass' && S.gp !== 'ask');
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip vc-c secret ${open ? 'open' : ''} ${(k === 'a' && S.sec === 'titian') || (k === 'b' && S.sec === 'island') ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('vcSecs').innerHTML = sc('a', '🖼️') + sc('b', '🔥');
  if (v === 'layers') renderLayers(t); else if (v === 'shop') renderShop(t); else renderGlass(t);
}
function renderLayers(t) {
  lab.setGlow('rgba(216, 167, 62, .26)');
  const ask = $('vcAsk'), st = t.st.layers, n = S.layers.length, tr = trace(S.layers);
  let hideBody = false;
  if (S.lp === 'ask1' || S.lp === 'ask2') {
    const q = S.lp === 'ask1' ? t.ask1 : t.ask2;
    ask.style.display = 'block';
    ask.innerHTML = `<div class="vc-q">${esc(q)}</div>${opts(S.lp === 'ask1' ? t.opts1 : t.opts2)}`;
    lab.setReadout(n, t.layersSub(n), '', '#d8a73e');
    hideBody = true;
  } else if (S.lp === 'rev1') {
    ask.style.display = 'block';
    ask.innerHTML = `<div class="vc-q">${esc(t.ask1)}</div>${verdict(S.a1 === 0, t.right, t.wrong1, S.a1 === 0 ? '' : '')}<div class="vc-say">${esc(t.opts1[0])}</div><div class="vc-nextrow"><button class="vc-next" data-act="next" aria-label="→">→</button></div>`;
    lab.setReadout(n, t.layersSub(n), '', '#d8a73e'); // the pill would hint at the next question
    hideBody = true; // the body answers the next question
  } else if (S.lp === 'rev2') {
    ask.style.display = 'block';
    ask.innerHTML = `<div class="vc-q">${esc(t.ask2)}</div>${verdict(S.a2 === 1, t.right, t.wrong2, '')}<div class="vc-say">${esc(t.opts2[1])}</div>`;
    lab.setReadout(n, t.layersSub(n), tr.k >= 0 ? t.lightStops : t.lightGround, '#d8a73e');
  } else {
    ask.style.display = 'none';
    lab.setReadout(n, t.layersSub(n), tr.k >= 0 ? t.lightStops : t.lightGround, '#d8a73e');
  }
  $('vcMode').innerHTML = chip('mode', 'thin', t.modeThin, S.mode === 'thin', '<span class="vc-dot vc-thin" style="background:linear-gradient(135deg,#fff,#9fb4d8)"></span>')
    + chip('mode', 'thick', t.modeThick, S.mode === 'thick', '<span class="vc-dot" style="background:#6b7a8f"></span>');
  $('vcCols').innerHTML = PAINT_KEYS.map((k) => chip('col', k, t.colors[k], S.col === k, `<span class="vc-dot ${S.mode === 'thin' ? 'vc-thin' : ''}" style="background:${rgb(PAINT[k])}"></span>`)).join('');
  $('vcAdd').textContent = t.addLayer; $('vcAdd').disabled = n >= 6; $('vcAdd').style.opacity = n >= 6 ? '.4' : '1';
  $('vcScrape').textContent = t.scrape; $('vcClean').textContent = t.clean;
  if (S.sec === 'titian') lab.setState({ emo: '🖼️', title: t.secrets.a[0], lead: t.titianCaption, body: st[3] });
  else lab.setState({ emo: st[0], title: st[1], lead: st[2], body: hideBody ? '' : st[3] });
  // the first fact names ultramarine as the most precious blue: keep it back until the shop question is answered
  lab.setFacts(S.sp === 'ask' ? t.facts.layers.slice(1) : t.facts.layers);
}
function renderShop(t) {
  lab.setGlow('rgba(42, 63, 158, .3)');
  const ask = $('vcAsk'), st = t.st.shop;
  if (S.sp === 'ask') {
    ask.style.display = 'block';
    ask.innerHTML = `<div class="vc-q">${esc(t.shopAsk)}</div>${opts(t.shopOpts)}`;
    lab.setReadout('?', t.spentSub(0), '', '#2a3f9e');
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '' });
  } else {
    if (S.sp === 'rev' && !S.sky) {
      ask.style.display = 'block';
      ask.innerHTML = `<div class="vc-q">${esc(t.shopAsk)}</div>${verdict(S.sAns === 0, t.shopRight, t.shopWrong, '')}`;
    } else ask.style.display = 'none';
    const spent = S.sky ? JARS[S.sky].coins : 0, pk = S.sky ?? S.card;
    lab.setReadout(spent, t.spentSub(spent), pk ? t.from(t.places[JARS[pk].place]) : '', '#2a3f9e');
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] });
  }
  $('vcSkyLbl').textContent = t.skyTask;
  $('vcSky').innerHTML = ['ultramarine', 'azurite'].map((k) => chip('sky', k, t.jars[k][0], S.sky === k, `<span class="vc-dot" style="background:${JARS[k].col}"></span>`)).join('');
  renderCard(t);
  lab.setFacts(t.facts.shop);
}
function renderCard(t) {
  const box = $('vcCard');
  if (!S.card || S.sp === 'ask') { box.innerHTML = ''; return; }
  const J = JARS[S.card], [nm, desc] = t.jars[S.card];
  box.innerHTML = `<div class="vc-card"><div class="vc-head"><span class="vc-dot" style="background:${J.col};width:18px;height:18px"></span><b>${esc(nm)}</b>
    <span class="vc-coins" aria-label="${J.coins}">${'<i class="vc-coin"></i>'.repeat(J.coins)}</span></div>
    <p>${esc(desc)}</p><canvas class="vc-map" id="vcMap"></canvas><div class="vc-from">${esc(t.from(t.places[J.place]))}</div></div>`;
  requestAnimationFrame(() => drawMap($('vcMap'), J.place));
}
// the mini-map: the Mediterranean to Afghanistan, an arrow from Venice to where the colour came from
const SEAS = [
  [[-5.5, 36], [-2, 35.2], [3, 36.8], [10, 37.3], [11, 33.5], [20, 30.5], [25, 31.5], [32, 31.2], [35.5, 33], [36, 36.5], [30, 36.3], [27, 37], [26.5, 40.5], [23, 40.6], [22, 37], [21, 38.5], [19.5, 40.5], [19, 42], [15.5, 44], [13.6, 45.7], [12.3, 45.3], [12.5, 44], [14.2, 42.5], [16, 41.4], [18.5, 40.2], [17, 39], [16.5, 38], [15.6, 38.2], [15.6, 40], [12, 41.8], [10.2, 43.8], [8.7, 44.4], [6, 43.1], [3, 43.3], [3.2, 41.9], [0.5, 40.5], [-0.5, 38.5], [-2, 36.8]],
  [[28, 41.2], [29, 41.2], [33, 42], [36, 41.6], [41.5, 41.5], [41.5, 42.5], [39, 44.5], [37.5, 45.3], [35, 45], [33.5, 44.5], [33, 45.9], [30.5, 46.5], [29.6, 45.3], [28.5, 43.5]],
  [[47, 45], [49, 46.5], [53, 47], [53.5, 45], [51, 43.5], [53, 41], [53.8, 38], [49, 37.5], [49.5, 40.5], [47.5, 42.5]],
  [[-14, 20], [-14, 58], [-5, 58], [-4.5, 48], [-1.5, 43.6], [-9, 43], [-9.5, 37], [-7, 33], [-10, 28], [-16, 20]],
  [[48, 30], [50, 29], [51.5, 27], [56, 26.5], [56.4, 24.5], [54, 24], [51.5, 24.3], [50, 26], [48.5, 28]],
  [[32.5, 30], [35, 28], [39, 22], [42, 22], [38, 25], [34.5, 29.5]],
  [[55, 20], [56, 22], [58.8, 23.6], [61.6, 25.2], [66.5, 25.4], [68.5, 23.5], [70.5, 22], [80, 21], [80, 20]],
];
const PLACE_LL = { afghanistan: [70.8, 36.7], med: [24, 36.5], europe: [10, 50.5], venice: [12.3, 45.4] };
function drawMap(cv, place) {
  if (!cv) return;
  const d = Math.min(devicePixelRatio || 1, 2), W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0);
  const L0 = -10, L1 = 78, B0 = 24, B1 = 54;
  const sc = Math.max(W / (L1 - L0), H / (B1 - B0));
  const cx = (L0 + L1) / 2, cy = (B0 + B1) / 2;
  const pr = ([lo, la]) => [W / 2 + (lo - cx) * sc, H / 2 - (la - cy) * sc * 1.15];
  let g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, rgb(lift(P.stone, 0.2))); g.addColorStop(1, rgb(P.stoneSh));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = rgb(P.lagoon, 0.85); c.strokeStyle = rgb(P.deep, 0.6); c.lineWidth = 0.8;
  for (const poly of SEAS) { c.beginPath(); poly.forEach((p, i) => { const [x, y] = pr(p); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.closePath(); c.fill(); c.stroke(); }
  // mountains of Badakhshan
  c.fillStyle = rgb(dark(P.stoneSh, 0.3));
  for (const [lo, la] of [[69, 37.5], [71.5, 37], [73, 36]]) { const [x, y] = pr([lo, la]); c.beginPath(); c.moveTo(x - 5, y + 3); c.lineTo(x, y - 4); c.lineTo(x + 5, y + 3); c.fill(); }
  const V = pr(PLACE_LL.venice);
  const dot = (x, y, col, r = 4) => { c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.strokeStyle = '#0b1e2a'; c.lineWidth = 1.2; c.stroke(); };
  if (place === 'anywhere') {
    for (const ll of [[-4, 40], [3, 47], [12, 42], [20, 47], [30, 39], [40, 37], [52, 33], [62, 32], [14, 34]]) { const [x, y] = pr(ll); dot(x, y, '#c38a3c', 3); }
  } else if (place === 'venice') {
    c.strokeStyle = rgb(P.gold); c.lineWidth = 2; c.beginPath(); c.arc(V[0], V[1], 9, 0, 7); c.stroke();
  } else {
    const D = pr(PLACE_LL[place]), mx = (V[0] + D[0]) / 2, my = Math.min(V[1], D[1]) - 22;
    c.strokeStyle = '#0b1e2a'; c.lineWidth = 2.4; c.setLineDash([5, 4]);
    c.beginPath(); c.moveTo(V[0], V[1]); c.quadraticCurveTo(mx, my, D[0], D[1]); c.stroke(); c.setLineDash([]);
    const ang = Math.atan2(D[1] - my, D[0] - mx);
    c.fillStyle = '#0b1e2a'; c.beginPath(); c.moveTo(D[0], D[1]); c.lineTo(D[0] - 9 * Math.cos(ang - 0.45), D[1] - 9 * Math.sin(ang - 0.45)); c.lineTo(D[0] - 9 * Math.cos(ang + 0.45), D[1] - 9 * Math.sin(ang + 0.45)); c.closePath(); c.fill();
    dot(D[0], D[1], '#e06a5a');
  }
  dot(V[0], V[1], rgb(P.gold), 4.5);
  c.font = '800 12px Nunito, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left';
  const lbl = T[lang].places.venice, tw = c.measureText(lbl).width;
  c.fillStyle = 'rgba(11,30,42,.82)'; rr(c, V[0] - tw / 2 - 8, V[1] + 8, tw + 16, 20, 8); c.fill();
  c.fillStyle = '#fff'; c.fillText(lbl, V[0] - tw / 2, V[1] + 18.5);
}
function renderGlass(t) {
  lab.setGlow('rgba(255, 150, 60, .28)');
  const ask = $('vcAsk'), st = t.st.glass;
  const metalsLabel = S.pinch.length ? S.pinch.map((m) => t.metals[m]).join(' + ') : t.metals.none;
  if (S.gp === 'ask') {
    ask.style.display = 'block';
    ask.innerHTML = `<div class="vc-q">${esc(t.glassAsk)}</div>${opts(t.glassOpts)}`;
    lab.setReadout('?', '', '', '#e58f45');
    lab.setState({ emo: st[0], title: st[1], lead: t.glassAsk, body: '' });
  } else {
    if (S.gp === 'rev') {
      ask.style.display = 'block';
      ask.innerHTML = `<div class="vc-q">${esc(t.glassAsk)}</div>${verdict(S.gAns === 0, t.glassRight, t.glassWrong, '')}`;
    } else ask.style.display = 'none';
    lab.setReadout(S.blown ? esc(t.glassNames[glassNameKey()]) : '…', '', metalsLabel, '#e58f45');
    if (S.sec === 'island') lab.setState({ emo: '🔥', title: t.secrets.b[0], lead: t.islandCaption, body: st[3] });
    else lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] });
  }
  $('vcMetals').innerHTML = METALS.map((m) => chip('metal', m, t.metals[m], S.pinch.includes(m), `<span class="vc-dot" style="background:${POWDER[m]}"></span>`)).join('');
  $('vcBlow').textContent = t.blow; $('vcNew').textContent = t.newGlass;
  lab.setFacts(t.facts.glass);
}
addEventListener('resize', () => { if (lab.view === 'shop' && S.card) requestAnimationFrame(() => drawMap($('vcMap'), JARS[S.card].place)); });
render();
