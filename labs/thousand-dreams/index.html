    c.fillStyle = '#fff'; c.beginPath(); c.arc(d * r * 0.42 - r * 0.06, -r * 0.18, r * 0.07, 0, 6.3); c.fill();
  });
  c.fillStyle = '#f0a030'; c.strokeStyle = '#8a5a10'; c.beginPath(); c.moveTo(-r * 0.12, r * 0.08); c.lineTo(r * 0.12, r * 0.08); c.lineTo(0, r * (mouth ? 0.4 : 0.3)); c.closePath(); c.fill(); c.stroke();
  c.restore();
}
function drawTeacher(c, t) {
  const d = landNow(), n = clamp(Math.floor(S.rb * 5), 0, 20), full = n >= 20, fin = full && S.rb > 20 / 5 + 0.6;
  c.fillStyle = 'rgba(8,10,34,.9)'; c.fillRect(-200, 96, W + 400, H);
  const cx = (i) => 22 + i * 17.2, cy = (v) => 270 - (v - 1) * 12.5;
  c.strokeStyle = 'rgba(150,165,215,.14)'; c.lineWidth = 1; for (let v = 1; v <= 10; v += 3) { c.beginPath(); c.moveTo(14, cy(v)); c.lineTo(346, cy(v)); c.stroke(); }
  c.strokeStyle = 'rgba(255,211,90,.25)'; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(14, cy(7.5)); c.lineTo(346, cy(7.5)); c.stroke();
  c.strokeStyle = 'rgba(111,224,208,.25)'; c.beginPath(); c.moveTo(14, cy(3.5)); c.lineTo(346, cy(3.5)); c.stroke(); c.setLineDash([]);
  const st = (i) => (d.xs[i] >= 8 ? 'p' : d.xs[i] <= 3 ? 's' : '');

    c.strokeStyle = k === 'p' ? '#ffd35a' : k === 's' ? '#6fe0d0' : 'rgba(170,185,235,.4)'; c.lineWidth = k ? 2.6 : 1.4; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();

  const saying = fin ? T[lang].sb.concl : k === 'p' ? T[lang].sb.well : k === 's' ? T[lang].sb.worse : '';
  owl(c, 44, 52, 26, t, !!saying);
  if (saying) pill(c, saying, 82, 46, { align: 'l', size: 13, h: 26, bg: 'rgba(255,248,226,.96)', color: '#2a2230', border: 'rgba(255,211,90,.9)' });
  pill(c, '● ' + T[lang].sb.praised, 12, 110, { align: 'l', ...GOLD, size: 12 });
  pill(c, '● ' + T[lang].sb.scolded, 12, 134, { align: 'l', ...TEAL, size: 12 });

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function askHTML(q, opts, ans, ok, verdict) {
  const chips = opts.map((o, i) => `<button type="button" class="chip td-opt${ans !== null ? (i === ok ? ' good' : i === ans ? ' bad' : '') : ''}" data-act="ans" data-k="${i}"${ans !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  return `<div class="td-q">${esc(q)}</div><div class="chips td-chips">${chips}</div>${ans !== null ? `<div class="td-verdict ${ans === ok ? 'ok' : 'no'}">${esc(verdict)}</div>` : ''}`;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'ans') {
    const k = +b.dataset.k;
    if (S.sec === 'a') { if (S.pa !== null) return; S.pa = k; S.ra = 0; (k === 1 ? sfx.good : sfx.bad)(); }
    else if (lab.view === 'stage') { if (S.a1 !== null) return; S.a1 = k; S.r1 = 0; (k === 2 ? sfx.good : sfx.bad)(); }
    else { if (S.a2 !== null) return; S.a2 = k; S.r2 = 0; (k === 2 ? sfx.good : sfx.bad)(); }
    showStage();
  } else if (act === 'only') { S.only = !S.only; sfx.click(); }
  else if (act === 'grp') { S.grp = b.dataset.g; sfx.click(); }
  else if (act === 'again2') { S.run++; S.r2 = 0; sfx.click(); }
  else if (act === 'runb') { S.runb++; S.rb = 0; sfx.click(); showStage(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'a') { S.pa = null; S.ra = 0; } else { S.runb++; S.rb = 0; } }
    sfx.click(); showStage();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'tdLuck') { S.L = +ev.target.value; sfx.tick(); render(); }
  else if (ev.target.id === 'tdPrac') { S.prac = +ev.target.value; render(); }
});

// --- one render per change: controls, readout and the state card -------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  const show = (id, on) => { $(id).hidden = !on; };
  show('tdV1', !sec && v === 'stage' && S.a1 !== null); show('tdV2', !sec && v === 'next' && S.a2 !== null); show('tdV3', !sec && v === 'path');
  show('tdSecB', sec === 'b'); $('tdAsk').hidden = sec === 'b' || v === 'path' && !sec;
  $('tdSecRow').innerHTML = [['a', '🛡️'], ['b', '👏']].map(([k, e]) => { const open = secret.unlocked();
    return `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`; }).join('');
  if (sec === 'a') renderSecA(t); else if (sec === 'b') renderSecB(t); else if (v === 'stage') render1(t); else if (v === 'next') render2(t); else render3(t);
}
function render1(t) {
  lab.setGlow('rgba(255, 190, 90, .22)');

  lab.setFacts(t.facts.stage);

  lab.setReadout('10', t.ro1(333, 10, NLOT), '', '#ffd35a');
  lab.setState({ emo: '🌠', title: t.st1p[0], lead: S.only ? t.onlyLine : t.st1p[1], body: S.only ? t.st1o : t.st1p[2], extra: '' });
}

  $('tdGrp').innerHTML = [['top', t.top], ['bottom', t.bot]].map(([g, l]) => `<button type="button" class="chip td-btn ${S.grp === g ? 'on' : ''}" data-act="grp" data-g="${g}">${esc(l)}</button>`).join('');
  $('tdLuckL').textContent = t.luck; $('tdLuckV').textContent = S.L + '%'; $('tdLuckE0').textContent = t.none; $('tdLuckE1').textContent = t.lots;

  lab.setReadout(sg(a2 - a1, 1), t.ro2(top, dec(a1, 1), dec(a2, 1)), '', top ? '#ffd35a' : '#6fe0d0');
