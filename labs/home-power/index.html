  const X0 = 14, XW = 332;
  rr(c, X0, 6, XW, 34, 10); c.fillStyle = lg(c, X0, 0, X0 + XW, 0, [[0, '#10143a'], [0.2, '#1c2250'], [0.3, '#e39a62'], [0.4, '#6fb4e6'], [0.6, '#6fb4e6'], [0.74, '#e07a5a'], [0.84, '#2a2a60'], [1, '#10143a']]); c.fill();
  emoji(c, '🌙', X0 + XW * 0.07, 23, 17); emoji(c, '☀️', X0 + XW * 0.52, 23, 19); emoji(c, '🌙', X0 + XW * 0.94, 23, 17);
  c.fillStyle = '#98A0B8'; c.font = '800 13px Nunito, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'center';
  T[lang].d.hrs.forEach((s, i) => c.fillText(s, X0 + XW * i / 4 + (i === 0 ? 4 : i === 4 ? -6 : 0), 50));
  rr(c, X0, 58, XW, 48, 8); c.fillStyle = 'rgba(130,145,190,.1)'; c.fill();
  DAY.forEach((r, i) => {
    const len = S.d[r.k] / 60, y = 62 + i * 9;
    const seg = (a, b) => { if (b - a <= 0) return; rr(c, X0 + XW * a / 24, y, Math.max(3.5, XW * (b - a) / 24), 6, 3); c.fillStyle = DC[r.k]; c.fill(); };
    if (len <= 0) return; seg(r.start, Math.min(24, r.start + len)); if (r.start + len > 24) seg(0, r.start + len - 24);
  });
  // energy bars
  const BX = 46, BW = 300, MAXWH = 1500, top = 112, rowH = 30;
  c.strokeStyle = 'rgba(190,205,255,.14)'; c.lineWidth = 1;
  for (const v of [0, 500, 1000, 1500]) { const x = BX + BW * v / MAXWH; c.beginPath(); c.moveTo(x, top - 4); c.lineTo(x, top + rowH * 5); c.stroke(); }
  c.fillStyle = '#98A0B8'; c.font = '800 13px Nunito, sans-serif'; c.textAlign = 'center';
  [0, 500, 1000, 1500].forEach((v) => c.fillText(String(v), Math.min(BX + BW * v / MAXWH, 340), top + rowH * 5 + 10));
  c.textAlign = 'left'; c.fillText(T[lang].d.axis, BX + 4, top + rowH * 5 + 26);
  DAY.forEach((r, i) => {
    const y = top + i * rowH;
    emoji(c, EMO[r.k], 22, y + 13, 20);
    rr(c, BX, y + 4, BW, 18, 9); c.fillStyle = 'rgba(130,145,190,.1)'; c.fill();
    const tgt = S.dg !== null ? Wh(r.k, S.d[r.k]) : 0; S.bw[r.k] += (tgt - S.bw[r.k]) * Math.min(1, dt * 8);
    if (S.dg === null) { c.setLineDash([4, 5]); c.strokeStyle = 'rgba(190,205,255,.35)'; c.lineWidth = 1.2; rr(c, BX, y + 4, BW, 18, 9); c.stroke(); c.setLineDash([]); c.fillStyle = '#98A0B8'; c.font = '900 15px Nunito, sans-serif'; c.textAlign = 'center'; c.fillText('?', BX + BW / 2, y + 14); return; }
    const bw = Math.max(0, BW * S.bw[r.k] / MAXWH);
    if (bw > 0.5) { rr(c, BX, y + 4, Math.max(bw, 6), 18, 9); c.fillStyle = lg(c, 0, y + 4, 0, y + 22, [[0, mx(DC[r.k], '#ffffff', 0.25)], [1, DC[r.k]]]); c.fill(); c.lineWidth = 1.2; c.strokeStyle = 'rgba(10,12,20,.5)'; c.stroke(); }
    const txt = `${fmt(S.bw[r.k])} ${T[lang].u.wh}`; c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'left';
    const tw = c.measureText(txt).width;
    if (BX + bw + 8 + tw < BX + BW) { c.fillStyle = '#EDEFF7'; c.fillText(txt, BX + bw + 7, y + 14); } else { c.fillStyle = '#15182a'; c.textAlign = 'right'; c.fillText(txt, BX + bw - 8, y + 14); }
  });
  c.restore();
}

canvasLoop($('cv'), (c, w, h, dt, t) => {
  const v = lab.view;
  if (v === 'meter') sceneMeter(c, w, h, dt, t); else if (v === 'sort') sceneSort(c, w, h, dt, t); else sceneDay(c, w, h, dt, t);
});

// --- input ------------------------------------------------------------------------------------------------
const toDesign = (ev) => { const r = $('cv').getBoundingClientRect(), g = S.geo; return { x: (ev.clientX - r.left - g.ox) / g.s, y: (ev.clientY - r.top - g.oy) / g.s }; };
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('cv').addEventListener('pointerdown', (ev) => {
  const p = toDesign(ev), v = lab.view;
  if (v === 'meter' && S.mode === 'free') {
    for (const k of APPS) { const [x, y, sc] = SLOT[k]; if (Math.abs(p.x - x) < Math.max(22, APW[k] * sc * 0.6) && p.y < y + 6 && p.y > y - 70 * sc) { toggleApp(k); return; } }
  } else if (v === 'sort' && S.sg === null && S.si < CARDS.length) {
    if (Math.abs(p.x - S.cx) < 76 && Math.abs(p.y - S.cy) < 68) { S.drag = { x: p.x, y: p.y, id: ev.pointerId }; $('cv').setPointerCapture(ev.pointerId); }
    else if (p.y > 180) sortTo(p.x < 180 ? 0 : 1);
  }
});
$('cv').addEventListener('pointermove', (ev) => { if (S.drag) { const p = toDesign(ev); S.drag.x = p.x; S.drag.y = p.y; } });
const endDrag = (ev) => {
  if (!S.drag) return;
  const p = toDesign(ev); S.drag = null;
  if (p.y > 170) sortTo(p.x < 180 ? 0 : 1);
};
$('cv').addEventListener('pointerup', endDrag);
$('cv').addEventListener('pointercancel', () => { S.drag = null; });

function sortTo(side) { // side 0 = uses electricity, 1 = no electricity
  if (S.sg !== null || S.si >= CARDS.length) return;
  const card = CARDS[S.si], ok = (side === 0) === card.e;
  S.sg = side === 0; S.right[S.si] = ok; (ok ? sfx.good : sfx.bad)(); showStage(); render();
}
function sortNext() {
  if (S.si >= CARDS.length) { S.si = 0; S.sg = null; S.right = []; S.placed = [[], []]; S.cy = -120; sfx.click(); render(); return; }
  if (S.sg === null) return;
  const i = S.si, to = CARDS[i].e ? 0 : 1;
  S.fly = { i, to, x: S.cx, y: S.cy, t0: now() }; S.placed[to].push(i); S.bump[to] = now() + 0.3;
  S.si++; S.sg = null; S.cy = -120; S.cx = 180; sfx.snap(); render();
}
function toggleApp(k) {
  if (S.sec === 'stby') S.sec = null;
  S.on[k] = !S.on[k]; (S.on[k] ? sfx.click : sfx.tick)(); render();
}
function answerRound(i) { if (S.rg !== null) return; S.rg = i; const [a, b] = ROUNDS[S.ri]; ((i === 0 ? a : b) === (WATT[a] > WATT[b] ? a : b) ? sfx.good : sfx.bad)(); showStage(); render(); }
function nextRound() {
  S.race = 0; S.disc[1].w = 0; S.disc[2].w = 0;
  if (S.ri >= ROUNDS.length - 1) { S.mode = 'free'; S.rg = null; S.ri = 0; APPS.forEach((k) => { S.on[k] = false; }); S.sec = null; sfx.click(); }
  else { S.ri++; S.rg = null; sfx.click(); }
  render();
}
$('mAns').addEventListener('click', (ev) => { const b = ev.target.closest('[data-i]'); if (b) answerRound(+b.dataset.i); });
$('mNext').onclick = nextRound;
$('mSkip').onclick = () => { S.mode = 'free'; S.rg = null; sfx.click(); render(); };
$('mAgain').onclick = () => { S.mode = 'round'; S.ri = 0; S.rg = null; S.sec = null; APPS.forEach((k) => { S.on[k] = false; }); sfx.click(); render(); };
$('mChips').addEventListener('click', (ev) => { const b = ev.target.closest('[data-k]'); if (b) toggleApp(b.dataset.k); });
$('mSec').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-s]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.s;
  if (S.sec === k) S.sec = null;
  else { S.sec = k; APPS.forEach((a) => { S.on[a] = false; }); if (k === 'disc') { S.revs = 0; S.on.kettle = true; } }
  sfx.click(); render();
});
$('sBk').addEventListener('click', (ev) => { const b = ev.target.closest('[data-b]'); if (b) sortTo(+b.dataset.b); });
$('sNext').onclick = sortNext;
$('dAns').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b || S.dg !== null) return;
  S.dg = b.dataset.a; (S.dg === 'kettle' ? sfx.good : sfx.bad)(); showStage(); render();
});
$('dRows').addEventListener('input', (ev) => {
  const k = ev.target.dataset.k; if (!k) return;
  S.d[k] = +ev.target.value; S.touched = true; render();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
function render() {
  const v = lab.view;
  document.body.dataset.v = v;
  $('secMeter').hidden = v !== 'meter'; $('secSort').hidden = v !== 'sort'; $('secDay').hidden = v !== 'day';
  if (v === 'meter') renderMeter(); else if (v === 'sort') renderSort(); else renderDay();
}

function renderMeter() {
  const t = T[lang], m = t.m, round = S.mode === 'round';
  lab.setGlow('rgba(240, 190, 90, .24)');
  $('mRound').hidden = !round; $('mFree').hidden = round;
  if (round) {
    const [a, b] = ROUNDS[S.ri], rev = S.rg !== null, win = WATT[a] > WATT[b] ? 0 : 1, q = m.q(t.apps[a], t.apps[b]);
    $('mQ').textContent = q;
    $('mAns').innerHTML = [a, b].map((k, i) => `<button class="hp-ans${rev ? (i === win ? ' win' : S.rg === i ? ' pick' : '') : ''}" data-i="${i}"${rev ? ' disabled' : ''}>${EMO[k]} ${esc(cap(t.apps[k]))}</button>`).join('');
    $('mNext').hidden = !rev; $('mNext').textContent = S.ri >= ROUNDS.length - 1 ? m.play : m.next;
    $('mSkip').hidden = rev; $('mSkip').textContent = m.skip;
    if (!rev) {
      lab.setReadout('?', m.qn(S.ri + 1), '', '#f0be5a');
      lab.setState({ emo: '🤔', title: q, lead: m.qLead, body: '' });
      lab.setFacts(t.facts.meter);
    } else {
      const w = win === 0 ? a : b, l = win === 0 ? b : a, ok = S.rg === win;
      lab.setReadout(`${fmt(WATT[a])} · ${fmt(WATT[b])} ${t.u.w}`, m.vs, `${EMO[w]} ${m.fast(t.apps[w])}`, '#f0be5a');
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? m.right : m.wrong, lead: m.race(cap(t.apps[w]), fmt(WATT[w]), cap(t.apps[l]), fmt(WATT[l])), body: t.why[w] });
      lab.setFacts(t.facts.meter);
    }
    return;
  }
  const open = secret.unlocked(), on = APPS.filter((k) => S.on[k]), tot = on.reduce((n, k) => n + WATT[k], 0);
  $('mChips').innerHTML = APPS.map((k) => `<button class="chip hp-chip${S.on[k] ? ' on' : ''}" data-k="${k}" aria-pressed="${S.on[k]}"><span class="e">${EMO[k]}</span>${esc(cap(t.apps[k]))}</button>`).join('');
  const sc = (k, emo) => `<button class="chip hp-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-s="${k}">${open ? `${emo} ${esc(m.sec[k][0])}` : '🔒 ???'}</button>`;
  $('mSec').innerHTML = sc('disc', '🌀') + sc('stby', '💤');
  $('mAgain').textContent = m.again; $('mFine').textContent = m.fine;
  const facts = [...t.facts.meter, t.facts.meterFree];
  if (S.sec === 'disc') {
    discState();
  } else if (S.sec === 'stby') {
    const kwh = STBY_W * 8760 / 1000, h = kwh * 1000 / WATT.kettle;
    lab.setReadout(`${STBY_W} ${t.u.w}`, m.vs, '💤', '#f0be5a');
    lab.setState({ emo: '💤', title: m.stbyT, lead: m.stbyL(fmt(kwh), fmt(h)), body: m.stbyB });
  } else if (!on.length) {
    lab.setReadout(`0 ${t.u.w}`, m.subOff, '', '#f0be5a');
    lab.setState({ emo: '🔌', title: m.offT, lead: m.offL, body: '' });
  } else {
    const top = on.reduce((p, k) => (WATT[k] > WATT[p] ? k : p)), n = Math.round(tot / WATT.lamp);
    lab.setReadout(`${fmt(tot)} ${t.u.w}`, m.sub, m.on(on.length), '#f0be5a');
    lab.setState({ emo: EMO[top], title: on.length === 1 ? m.one(cap(t.apps[top])) : m.many(cap(t.apps[top])), lead: t.why[top], body: m.all(fmt(tot), n) });
  }
  lab.setFacts(facts);
}

// the turn counter of the secret: refreshed from the loop when the count changes (only the readout and the card, never the controls)
function discState() {
  const t = T[lang], m = t.m, on = APPS.filter((k) => S.on[k]), tot = on.reduce((n, k) => n + WATT[k], 0), turns = Math.floor(S.revs * 10) / 10;
  S.lastTurn = turns;
  lab.setReadout(`${fmt(tot)} ${t.u.w}`, m.sub, m.on(on.length), '#f0be5a');
  lab.setState({ emo: '🌀', title: m.discT, lead: m.discL(dec1(turns), dec1(Math.floor(S.revs * 10) / 10 * KH)), body: m.discB });
}
function renderSort() {
  const t = T[lang], s = t.s, end = S.si >= CARDS.length, rev = S.sg !== null, k = S.right.filter(Boolean).length;
  lab.setGlow('rgba(200, 150, 80, .24)');
  $('sBk').innerHTML = [0, 1].map((b) => `<button class="hp-ans" data-b="${b}"${rev || end ? ' disabled' : ''}>${b === 0 ? '⚡' : '🚫'} ${esc(s.bk[b])}</button>`).join('');
  $('sNext').hidden = !(rev || end); $('sNext').textContent = end ? s.again : s.next;
  const done = S.si + (rev ? 1 : 0);
  lab.setReadout(`${done}/10`, s.sub, done ? s.ok(k) : '', '#d1a468');
  lab.setFacts(t.facts.sort);
  if (end) { lab.setState({ emo: '🏆', title: s.end(k), lead: s.endL, body: '' }); return; }
  const card = CARDS[S.si];
  if (!rev) lab.setState({ emo: '🧺', title: s.q, lead: s.qLead, body: s.of(S.si + 1) });
  else { const ok = S.right[S.si]; lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? s.right : s.wrong, lead: s.cards[card.k][1], body: '' }); }
}

function renderDay() {
  const t = T[lang], d = t.d, ans = S.dg !== null;
  lab.setGlow('rgba(95, 143, 208, .26)');
  $('dAsk').hidden = ans;
  $('dQ').textContent = d.q(DEF.charger / 60, DEF.kettle);
  $('dAns').innerHTML = [['charger', d.ansC], ['kettle', d.ansK]].map(([k, l]) => `<button class="hp-ans" data-a="${k}">${esc(l)}</button>`).join('');
  let total = 0, top = null;
  DAY.forEach((r) => {
    const wh = Wh(r.k, S.d[r.k]); total += wh; if (top === null || wh > Wh(top, S.d[top])) top = r.k;
    document.querySelector(`[data-n=${r.k}]`).textContent = cap(t.apps[r.k]);
    document.querySelector(`[data-c=${r.k}]`).textContent = ans ? `${fmt(WATT[r.k])} ${t.u.w} × ${fmtDur(S.d[r.k])}` : fmtDur(S.d[r.k]);
    const inp = document.querySelector(`input[data-k=${r.k}]`); inp.disabled = !ans; inp.setAttribute('aria-label', cap(t.apps[r.k]));
  });
  lab.setFacts(t.facts.day);
  if (!ans) {
    lab.setReadout('?', '', '', '#5f8fd0');
    lab.setState({ emo: '🤔', title: d.qt, lead: d.qLead, body: '' });
    return;
  }
  lab.setReadout(`${fmt(total)} ${t.u.wh}`, total >= 1000 ? d.kwh(dec1(total / 1000)) : d.sub, `${EMO[top]} ${d.most}`, '#5f8fd0');
  if (!S.touched) {
    const k = Wh('kettle', DEF.kettle), c = Wh('charger', DEF.charger), ok = S.dg === 'kettle';
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? d.right : d.wrong, lead: d.lead(fmt(k), DEF.kettle, fmt(c)), body: d.body(Math.round(k / c)) });
  } else {
    lab.setState({ emo: EMO[top], title: d.top(cap(t.apps[top])), lead: d.f(fmt(WATT[top]), fmtDur(S.d[top]), fmt(Wh(top, S.d[top]))), body: d.b2 });
  }
}
render();
</script>
