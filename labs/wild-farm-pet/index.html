// --- pointer: drag the card to a place, or tap a place -------------------------------------------------------
const cv = $('cv');
const posOf = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
const zoneAt = (x) => clamp(Math.floor(x / ((S.L?.w || 1) / 3)), 0, 2);
function tryPlace(z) {
  const id = ORDER[S.pi]; if (!id || S.feed) return;
  const right = INFO[id].z;
  if (z === right) startFeed(id, right);
  else { S.miss++; S.msg = 'wrong'; S.card.shake = clock(); sfx.bad(); if (S.miss >= 3) startFeed(id, right); else render(); }
}
function startFeed(id, z) { S.feed = { id, z, t0: clock() }; S.msg = null; S.hover = -1; sfx.good(); render(); }
cv.addEventListener('pointerdown', (e) => {
  if (lab.view !== 'places' || S.sec || !S.L) return;
  const { x, y } = posOf(e), L = S.L, K = S.card, id = ORDER[S.pi];
  if (S.feed) { S.feed.t0 -= 6; return; }
  if (!id) return;
  if (Math.abs(x - K.x) < L.cw / 2 && Math.abs(y - K.y) < L.ch / 2 && y > L.Hs - 30) {
    K.drag = true; K.dx = x - K.x; K.dy = y - K.y; S.msg = null; try { cv.setPointerCapture(e.pointerId); } catch { /* fine */ } sfx.tick(); render();
  } else if (y < L.Hs) tryPlace(zoneAt(x));
});
cv.addEventListener('pointermove', (e) => {
  const K = S.card; if (!K.drag) return;
  const { x, y } = posOf(e); K.x = x - K.dx; K.y = y - K.dy; S.hover = y < S.L.Hs + 20 ? zoneAt(x) : -1;
});
const endDrag = (e) => {
  const K = S.card; if (!K.drag) return; K.drag = false;
  const { x, y } = posOf(e), z = S.hover; S.hover = -1;
  if (z >= 0 && y < S.L.Hs + 20) tryPlace(z);
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { S.card.drag = false; S.hover = -1; });

  lab.setGlow('rgba(150, 180, 230, .26)');
  lab.setReadout(q.n(step < 3 ? 1 : 2), q.sub, '', '#8fb0e8');
  const st = [{ emo: '🐮', title: q.q1, lead: q.tap }, { emo: '🦌', title: q.r1[0], lead: q.r1[1] }, { emo: '🚜', title: q.r2[0], lead: q.r2[1] }, { emo: '🦊', title: q.q2, lead: q.tap }, { emo: '🦊', title: q.r3[0], lead: q.r3[1] }][step];
  lab.setState({ ...st, body: '', extra: '' });
  lab.setFacts(step === 0 ? [t.facts.hedgehog] : step < 4 ? [t.facts.hedgehog, t.facts.deer] : [t.facts.hedgehog, t.facts.deer, t.facts.fox]);
}
function renderAgo(t) {
  const G = S.g, a = t.ag, asked = G.ans !== null, pr = a.pairs[G.pair], u = G.u;
  askEl.style.display = asked ? 'none' : '';
  if (!asked) askEl.innerHTML = `<div class="q">${esc(a.q)}</div><div class="opts">${a.o.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`;
  $('slWrap').hidden = !asked || S.sec === 'giant'; $('eL').textContent = a.from; $('eR').textContent = a.to;
  lab.setGlow('rgba(200, 160, 100, .24)');
  if (S.sec === 'giant') {
    const g = t.gt, k = ['aur', 'cow', 'man'][S.gs];
    $('agRow').innerHTML = secChip('giant', '🦬') + g.chips.map((l, i) => chipBtn('gs', i, l, S.gs === i)).join('');
    lab.setReadout('🦬', g[k][0], '', '#d9a05f');
    lab.setState({ emo: '🦬', title: g.title, lead: `${g[k][0]}: ${g[k][1]}`, body: g.body, extra: '' }); lab.setFacts([t.facts.aur]); return;
  }
  $('agRow').innerHTML = asked ? PAIRS.map((p, i) => chipBtn('pair', i, `${p.emo[0]}→${p.emo[1]}`, G.pair === i)).join('') + secChip('giant', '🦬') : '';
  if (!asked) {
    lab.setReadout('🐺', '', '', '#d9a05f'); lab.setState({ emo: '🐺', title: a.q, lead: a.tap, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const idx = u < 0.5 ? 0 : 1;
  lab.setReadout(`${PAIRS[G.pair].emo[idx]} ${pr.n[idx]}`, a.sub[idx], '', '#d9a05f');
  if (G.seenR) lab.setState({ emo: '🐶', title: `${G.ans === 1 ? a.ok : a.no} ${a.r[0]}`, lead: a.r[1], body: '', extra: '' });
  else lab.setState({ emo: PAIRS[G.pair].emo[idx], title: pr.n[idx], lead: pr.l[idx], body: '', extra: '' });
  lab.setFacts([t.facts[FACT_OF_PAIR[G.pair]]]);
}


canvasLoop(cv, (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'places') (S.sec === 'rabbit' ? drawRabbits : drawPlaces)(c, w, h, dt, time);
  else if (v === 'winter') drawWinter(c, w, h, dt, time);
  else if (S.sec === 'giant') drawGiant(c, w, h, dt, time);
  else { drawAgo(c, w, h, dt, time); if (S.g.seenR) pill(c, S.g.ans === 1 ? T[lang].ag.ok : T[lang].ag.no, w / 2, 44, { W: w, size: 15, col: S.g.ans === 1 ? '#3ddc97' : '#f5c84c' }); }
});
render();
</script>
