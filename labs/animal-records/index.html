const hit = (ev) => { const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top; return { x, y, card: [...G.cards].reverse().find((q) => x >= q.x && x <= q.x + G.L.cw && y >= q.y && y <= q.y + G.L.ch) }; };

$('ctrlBody').addEventListener('click', (ev) => {

  else if (act === 'sel') { S.sel = +v; S.slide = 0; S.calf = false; sfx.click(); }
  else if (act === 'calf') { if (!secret.unlocked()) return secret.open(); S.calf = !S.calf; sfx.click(); showStage(); }
  else if (act === 'pick') { F.pick[F.dist] = v; sfx.tick(); }
  else if (act === 'run') { F.t = 0; F.running = true; F.reveal = false; F.done[key()] = false; F.lastRo = ''; sfx.click(); showStage(); }
  else if (act === 'long') { resetRace(1000, false); sfx.click(); }

  else if (act === 'fal') { if (!secret.unlocked()) return secret.open(); if (!F.seen && !F.falcon) return; if (F.falcon) resetRace(100, false); else resetRace(100, true); sfx.click(); }

  else if (act === 'who') { if (v !== Z.who) { Z.who = v; Z.swapT = 0; sfx.click(); } }

  }
  if (dist === 100) {
    lab.setState({ emo: '🐆', title: pick === 'cheetah' ? t.right : t.notq, lead: list, body: t.fast.speeds(KMH.cheetah, KMH.car, KMH.horse, KMH.child) });
    lab.setFacts([factOf('cheetah', 0), factOf('cheetah', 1), factOf('horse', 0)]);
  } else {
    lab.setState({ emo: '🚗', title: pick === 'car' ? t.right : t.notq, lead: `${t.fast.carWins(nt(finishT('car')))} ${t.fast.stopped(SPRINT)}`, body: t.fast.tired });
    lab.setFacts([factOf('chase', 0), factOf('cheetah', 1), factOf('horse', 0)]);
  }
}
function renderTiny(t) {
  lab.setGlow('rgba(217, 130, 95, .24)');
  const o = t.tiny.opts, who = Z.who;
  let html;
  if (!Z.rev) html = `<p class="ar-q">${esc(t.tiny.q)}</p><div class="ar-row">${['apple', 'coin', 'rice'].map((k) => `<button class="ar-opt ${Z.pick === k ? 'on' : ''}" data-act="tpick" data-v="${k}">${esc(({ apple: '🍎', coin: '🪙', rice: '🍚' })[k] + ' ' + o[k])}</button>`).join('')}</div>
    <div class="ar-row"><button class="btn" data-act="weigh" ${Z.pick ? '' : 'disabled'}>${esc(t.tiny.weigh)}</button></div>`;
  else html = `<div class="ar-row">${['male', 'female', 'shrew'].map((k) => `<button class="chip ar-chip ${who === k ? 'on' : ''}" data-act="who" data-v="${k}">${k === 'shrew' ? '🐭' : '🐦'} ${esc(t.tiny.who[k])}</button>`).join('')}</div>
    <div class="ar-row">${['apple', 'coin', 'rice'].map((k) => `<span class="ar-opt ${k === 'coin' ? 'good' : Z.pick === k ? 'bad' : ''}" style="display:${k === 'coin' || Z.pick === k ? 'inline-flex' : 'none'};align-items:center;cursor:default">${esc(({ apple: '🍎', coin: '🪙', rice: '🍚' })[k] + ' ' + o[k])}</span>`).join('')}</div>`;
  $('ctrlBody').innerHTML = html;
  if (!Z.rev) {
    lab.setReadout('?', t.g, '', '#d9825f');
    lab.setState({ emo: '⚖️', title: t.tiny.title, lead: t.tiny.lead, body: '' });
    lab.setFacts([]); return;
  }
  const m = MASS[who], rel = m < COIN ? t.tiny.lt : t.tiny.gt;
  lab.setReadout(nf(m, 2), t.g, `${t.tiny.coin}: ${nf(COIN, 2)} ${t.g}`, '#d9825f');
  lab.setState({ emo: who === 'shrew' ? '🐭' : '🐦', title: who === 'male' ? (Z.pick === 'coin' ? t.right : t.notq) : t.tiny.name[who], lead: t.tiny.lead2(t.tiny.name[who], nf(m, 2), rel, nf(COIN, 2)), body: `${t.tiny.smallest[who]} ${t.tiny.len[who]}` });
  lab.setFacts([factOf(who === 'shrew' ? 'shrew' : 'hummer', 0), factOf(who === 'shrew' ? 'shrew' : 'hummer', 1)]);
}
render();
</script>
