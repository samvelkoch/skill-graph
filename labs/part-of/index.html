// bags view: a heap is dealt round-robin into bags, then the first `take` bags open and their sweets slide onto a plate
function mkHeap(cnt, heap, rnd) {
  const arr = Array.from({ length: cnt }, (_, i) => {
    const [u, v] = phyl(i, cnt);
    return { heap, u: u + (rnd() - .5) * .08, v: v + (rnd() - .5) * .08, rot: rnd() * Math.PI * 2, col: Math.floor(rnd() * 5), bag: 0, m: 0, t1: Infinity, d1: .55, t2: Infinity, d2: .55, ps: -1 };
  });

}
function buildBags(a, b, n, o = {}) {
  const rnd = rng(o.seed ?? (a * 1000 + b * 100 + n)), k = n / b, fast = !!o.fast, nb = o.extra ? b + 1 : b, take = o.take ?? a;
  const dtDeal = fast ? .035 : Math.min(.06, 2.6 / n), dtOpen = fast ? .1 : .25, dtTake = fast ? .035 : .07;
  const bags = Array.from({ length: nb }, () => ({ app: -Infinity, land: 0, pillT: 0, openT: Infinity }));
  const heaps = [{ n, app: -Infinity, g: o.extra ? [.34, .16, .27, .09] : [.5, .16, .34, .09] }];
  const first = mkHeap(n, 0, rnd), cs = first.slice();
  shuffle(first.map((_, i) => i), rnd).forEach((idx, d) => {
    const c = first[idx]; c.bag = d % b; c.m = Math.floor(d / b); c.t1 = .3 + d * dtDeal;
    bags[c.bag].land = Math.max(bags[c.bag].land, c.t1 + c.d1);
  });
  if (o.extra) { // a second pile appears and fills one more bag
    const tH = Math.max(...bags.map((g) => g.land)) + .9;
    heaps.push({ n: k, app: tH, g: [.8, .16, .12, .07] });
    bags[b].app = tH;
    const second = mkHeap(k, 1, rnd);
    shuffle(second.map((_, i) => i), rnd).forEach((idx, d) => {
      const c = second[idx]; c.bag = b; c.m = d; c.t1 = tH + .7 + d * dtDeal;
      bags[b].land = Math.max(bags[b].land, c.t1 + c.d1);
    });

  }
  bags.forEach((g) => { g.pillT = g.land + .12; });
  const openStart = Math.max(...bags.map((g) => g.pillT)) + .8;
  for (let j = 0; j < take; j++) bags[j].openT = openStart + j * dtOpen;

// back view: a bags show k sweets each, the others are closed with a "?"; reveal opens them, then every bag tips into one heap
function buildBack(a, b, g, seed) {
  const k = g / a, Tn = k * b, rnd = rng(seed * 977 + a * 31 + b * 7 + g);

  if (v === 'bags') frameBags(c, w, h); else if (v === 'back') frameBack(c, w, h); else frameStrip(c, w, h);

// --- controls --------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const stp = (label, val, act, k, dis0, dis1) => `<div class="po-stp"><span class="po-lbl">${esc(label)}</span><div class="po-sr">
  <button class="po-sb" data-act="${act}" data-k="${k}" data-s="-1" aria-label="−"${dis0 ? ' disabled' : ''}>−</button><b>${val}</b>
  <button class="po-sb" data-act="${act}" data-k="${k}" data-s="1" aria-label="+"${dis1 ? ' disabled' : ''}>+</button></div></div>`;
function chipsHtml(t, B, right, done) {
  return `<div class="po-row"><span class="po-lbl">${esc(t.pick)}</span><div class="chips">${B.chips.map((v) => {
    const cls = B.guess === null ? '' : done ? (v === right ? ' po-good' : v === B.guess ? ' po-bad' : '') : v === B.guess ? ' po-pick' : '';
    return `<button class="chip po-ans${cls}" data-act="pick" data-v="${v}"${B.guess !== null ? ' disabled' : ''}>${v}</button>`;
  }).join('')}</div></div>`;
}
function ownStep(k, s) {
  const B = S.bags; let { a, b, n } = B;
  if (k === 'a') a = clamp(a + s, 1, b);
  else if (k === 'b') { b = clamp(b + s, 2, 10); a = Math.min(a, b); n = clamp(Math.round(n / b) * b, b, Math.floor(40 / b) * b); }
  else n = clamp(n + s * b, b, Math.floor(40 / b) * b);
  setBags(a, b, n, true);
}
function stripStep(k, s) {
  const st = S.strip, bots = STRIP[st.whole].bots;
  if (k === 'a') setStrip(st.whole, st.a + s, st.b);
  else { const i = clamp(bots.indexOf(st.b) + s, 0, bots.length - 1); setStrip(st.whole, st.a, bots[i]); }
}
function startSecret(k) {
  lab.view = 'bags'; lab.renderChrome();
  S.sec = k === 'a'
    ? { k, i: 0, t0: now(), sc: buildBags(5, 4, 20, { extra: true, take: 5, seed: 97 }) }
    : { k, i: 0, t0: now(), sc: mkSeq(0) };
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'pick') {
    const B = S[v]; if (B.guess !== null) return;
    B.guess = +b.dataset.v; B.rev = now(); B.sc.done = false; B.sc.snd = 0; sfx.click(); showStage();
  } else if (act === 'next') {
    if (v === 'bags') { const p = nextPuz(S.bags, BAG_PUZ); setBags(...p, false); }
    else if (v === 'back') { const p = nextPuz(S.back, BACK_PUZ); setBack(...p); }
    else {
      const st = S.strip, bots = STRIP[st.whole].bots; let a, bb, tries = 0;
      do { bb = bots[Math.floor(Math.random() * bots.length)]; a = 1 + Math.floor(Math.random() * (bb - 1)); tries++; } while (a / bb === st.a / st.b && tries < 20);
      setStrip(st.whole, a, bb);
    }
    sfx.click();
  } else if (act === 'bstep') { ownStep(b.dataset.k, +b.dataset.s); sfx.tick(); }
  else if (act === 'sstep') { stripStep(b.dataset.k, +b.dataset.s); sfx.tick(); }
  else if (act === 'whole') { setStrip(b.dataset.w, S.strip.a, S.strip.b); sfx.click(); }
  else if (act === 'check') {
    const st = S.strip; if (!st.moved || st.rev !== null) return;
    st.right = Math.abs(st.pin - stripAns(st)) <= stripTol(st); st.rev = now(); st.done = false; sfx.click(); showStage();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    startSecret(b.dataset.k); sfx.click();
  }
  render();
});

// --- one render per change: controls, readout, state card, facts -----------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  hit.style.display = v === 'strip' ? 'block' : 'none';
  $('poMain').innerHTML = v === 'bags' ? renderBags(t) : v === 'back' ? renderBack(t) : renderStrip(t);
  const open = secret.unlocked();
  $('poSec').innerHTML = [['a', '🫙'], ['b', '🔁']].map(([k, emo]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${S.sec?.k === k && v === 'bags' ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setFacts(t.facts[v]);
}
function renderBags(t) {
  const B = S.bags, sec = S.sec;
  lab.setGlow('rgba(255, 107, 139, .24)');
  if (sec) {
    const sc = sec.sc, sub = formulaBags(sc.take, sc.b, sc.n);
    if (sec.k === 'a') {
      lab.setReadout(sc.done ? 25 : '?', sc.done ? sub : t.q(5, 4, 20), '', ACC.bags);
      lab.setState({ emo: '🫙', title: t.secrets.a[0], lead: t.secrets.a[1], body: '', extra: '' });
    } else {
      lab.setReadout(sec.i > 0 || sc.done ? 12 : '?', sc.done ? sub : t.q(sc.a, sc.b, 24), '', ACC.bags);
      lab.setState({ emo: '🔁', title: t.secrets.b[0], lead: t.secrets.b[1], body: '', extra: '' });
    }
    return `<div class="row2" style="margin-top:0"><button class="btn" data-act="next">${esc(t.next)}</button></div>`;
  }
  const { a, b, n } = B, k = n / b, right = k * a, done = B.rev !== null && B.sc.done;
  lab.setState({ ...t.state.bags, extra: '' });
  lab.setReadout(done ? right : '?', done ? formulaBags(a, b, n) : t.q(a, b, n), '', ACC.bags);
  let verdict = '';
  if (done) {
    const g = B.guess;
    if (g === right) verdict = `<div class="po-verdict"><b>${esc(t.right)}</b>${esc(t.whyRight(a, b, n, k))}</div>`;
    else {
      const why = g === k ? t.whyOneStep(a, b, n, k) : g === n / a ? t.whyTop(a, b) : g === n * a ? t.whyTimes(n) : t.whyOther;
      verdict = `<div class="po-verdict">${esc(why)} ${esc(t.whyRight(a, b, n, k))}</div>`;
    }
  }
  const lim = Math.floor(40 / b) * b;
  return `<div class="po-q">${esc(t.q(a, b, n))}</div>${chipsHtml(t, B, right, done)}${verdict}
    <div class="row2" style="margin-top:6px"><button class="btn" data-act="next">${esc(t.next)}</button></div>
    <div class="po-own"><span class="po-lbl">${esc(t.own)}</span>
      ${stp(t.top, a, 'bstep', 'a', a <= 1, a >= b)}${stp(t.bottom, b, 'bstep', 'b', b <= 2, b >= 10)}${stp(t.sweets, n, 'bstep', 'n', n <= b, n + b > lim)}</div>`;
}
function renderBack(t) {
  const B = S.back, sc = B.sc, { a, b, g } = B, k = g / a, right = k * b, done = B.rev !== null && sc.done;
  lab.setGlow('rgba(255, 209, 102, .22)');
  lab.setState({ ...t.state.back, extra: '' });
  lab.setReadout(done ? right : '?', done ? `${g} ÷ ${a} = ${k} · ${k} × ${b} = ${right}` : t.qBack(a, b, g), '', ACC.back);
  const verdict = !done ? '' : B.guess === right
    ? `<div class="po-verdict"><b>${esc(t.right)}</b>${esc(t.whyBackRight(a, b, g, k))}</div>`
    : `<div class="po-verdict">${esc(t.whyBackWrong)} ${esc(t.whyBackRight(a, b, g, k))}</div>`;
  return `<div class="po-q">${esc(t.qBack(a, b, g))}</div>${chipsHtml(t, B, right, done)}${verdict}
    <div class="row2" style="margin-top:6px"><button class="btn" data-act="next">${esc(t.next)}</button></div>`;
}
function renderStrip(t) {
  const st = S.strip, W = STRIP[st.whole].W, bots = STRIP[st.whole].bots, ans = stripAns(st), kk = W / st.b, done = st.rev !== null && st.done;
  lab.setGlow('rgba(110, 231, 183, .2)');
  lab.setState({ ...t.state.strip, extra: '' });
  const qs = t.qStrip(st.a, st.b, t.wholes[st.whole]);
  lab.setReadout(done ? unitStr(st.whole, ans) : '?', done ? `${W} ÷ ${st.b} = ${kk}${st.a > 1 ? ` · ${kk} × ${st.a} = ${ans}` : ''}` : qs, '', ACC.strip);
  let verdict = '';
  if (done) {
    const why = t.whyStrip(st.a, st.b, unitStr(st.whole, W), unitStr(st.whole, kk), unitStr(st.whole, ans));
    verdict = st.right ? `<div class="po-verdict"><b>${esc(t.right)}</b>${esc(why)}</div>` : `<div class="po-verdict">${esc(t.pinAt(unitStr(st.whole, st.pin)))} ${esc(why)}</div>`;
  }
  const bi = bots.indexOf(st.b);
  return `<div class="po-q">${esc(qs)}</div>
    <div class="chips">${WHOLES.map((w) => `<button class="chip po-ans${w === st.whole ? ' po-pick' : ''}" data-act="whole" data-w="${w}">${esc(t.wholeChip[w])}</button>`).join('')}</div>
    <div class="po-own" style="margin-top:12px;padding-top:0;border-top:0">${stp(t.top, st.a, 'sstep', 'a', st.a <= 1, st.a >= st.b - 1)}${stp(t.bottom, st.b, 'sstep', 'b', bi <= 0, bi >= bots.length - 1)}</div>
    ${st.rev === null ? `<div class="po-hint">${esc(t.drag)}</div>` : ''}${verdict}
    <div class="row2" style="margin-top:6px">${st.rev === null
      ? `<button class="btn" data-act="check"${st.moved ? '' : ' disabled'}>${esc(t.check)}</button>`
      : `<button class="btn" data-act="next">${esc(t.next)}</button>`}</div>`;
}
render();
</script>
</body>
</html>
