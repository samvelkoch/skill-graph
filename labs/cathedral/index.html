  } else if (sec === 'garg') {
    $('cxSecBody').innerHTML = `<div class="row2" style="margin-top:0"><div class="card seg small">${[t.sec.without, t.sec.with].map((l, i) => `<button data-gm="${i}" class="${S.gmode === i ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>
      <button class="chip ${S.rain ? 'on' : ''}" data-act="rain">${esc(t.sec.rain)}</button></div>`;
    lab.setReadout('🐲', t.secrets.gargoyle[0], '', C.blue);
    lab.setState({ emo: '🐲', title: t.secrets.gargoyle[0], lead: t.sec.gargText, body: '', extra: '' });
  } else if (v === 'wall') {
    lab.setGlow('rgba(143, 183, 232, .3)'); readoutWall();
    setCard(t.st.wall[W.free ? 1 : 0]);
  } else if (v === 'arch') {
    lab.setGlow('rgba(214, 69, 61, .2)');
    lab.setReadout(`${S.a.r + 1}/3`, '', '', C.blue);
    setCard(t.st.arch[S.a.r === 2 && S.a.picked !== null ? 1 : 0]);
  } else {
    lab.setGlow('rgba(242, 193, 78, .24)');
    lab.setReadout(`${S.v.r + 1}/4`, '', '', '#B8872E');
    setCard(t.st.village[S.v.r === 3 && S.v.picked !== null ? 1 : 0]);
  }
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const G = geoOf(w, h); S.G = G; const v = lab.view;
  c.save(); c.translate(G.ox, G.oy); c.scale(G.k, G.k); c.lineJoin = 'round';
  if (v === 'wall') {
    if (S.sec === 'glass') sceneGlass(c, G, dt, time); else if (S.sec === 'garg') sceneGarg(c, G, dt, time);
    else { sceneWall(c, G, dt, time); readoutWall(); }
  } else if (v === 'arch') sceneArch(c, G, dt, time);
  else sceneVillage(c, G, dt, time);
  c.restore();
});
render();
</script>
</body>
</html>
