function smooth(c, pts, closed = true) {
  const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];

    const s = mid(pts[n - 1], pts[0]); c.moveTo(s[0], s[1]);
    for (let i = 0; i < n; i++) { const m = mid(pts[i], pts[(i + 1) % n]); c.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); }
    c.closePath();
  } else {
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n - 1; i++) { const m = mid(pts[i], pts[i + 1]); c.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); }
    c.lineTo(pts[n - 1][0], pts[n - 1][1]);
  }
}

// --- the portolan chart ----------------------------------------------------------------------------------------
function drawMap(c, L, t, view) {

  c.lineWidth = 0.9; c.beginPath(); c.roundRect(L.fx - 6, L.fy - 6, L.fw + 12, L.fh + 12, 3); c.stroke();

  c.save();

  const seaG = c.createLinearGradient(gx0, gy0, gx1, gy1); seaG.addColorStop(0, '#3f8f8f'); seaG.addColorStop(0.55, C.lagoon); seaG.addColorStop(1, '#155a60');

  c.strokeStyle = 'rgba(120, 140, 70, .22)'; c.lineWidth = lw(9); c.beginPath(); smooth(c, NILE, false); c.stroke();

  c.restore();
  c.lineWidth = 1.6; c.strokeStyle = C.coast; c.strokeRect(L.fx, L.fy, L.fw, L.fh);

  $('ptQ').textContent = t.portsAsk;
  $('ptSail').textContent = `⛵ ${t.sail}`;
  $('ptSail').disabled = P.phase === 'sail' || P.route[P.route.length - 1] !== 'alexandria';
  $('ptClear').textContent = `↺ ${t.clear}`;
  $('ptClear').disabled = P.phase === 'sail';
  const vtxt = won ? t.arrived : P.phase === 'fail' ? t.tooFar : '';
  $('ptVerdict').hidden = !vtxt; $('ptVerdict').textContent = vtxt; $('ptVerdict').style.color = won ? C.ok : C.bad;
  lab.setReadout(String(n), t.hops, n ? t.longest(longest) : '', C.glint);
  if (won) { const [emo, title, lead, body] = t.st.ports; lab.setState({ emo, title, lead, body, extra: `<b>🦁 ${esc(t.venetianPorts)}</b>` }); }
  else if (P.phase === 'fail') lab.setState({ emo: '🛢️', title: t.tooFar, lead: t.portsAsk, body: '', extra: '' });
  else lab.setState({ emo: '⚓', title: `${t.places.venice} → ${t.places.alexandria}`, lead: t.portsAsk, body: '', extra: '' });
  lab.setFacts(t.facts.ports);
}
function renderAround(t) {
  const A = S.ar, ask = A.phase === 'ask', done = A.phase === 'done';
  lab.setGlow('rgba(217, 140, 122, .26)');
  $('arQ').textContent = t.aroundAsk;
  $('arOpts').innerHTML = t.aroundOpts.map((o, i) => {
    const cls = done ? (i === 1 ? 'ok' : i === A.guess ? 'no' : '') : i === A.guess ? 'on' : '';
    return `<button class="vt-opt ${cls}" data-ar="${i}"${ask ? '' : ' disabled'}>${esc(o)}</button>`;
  }).join('');
  $('arVerdict').hidden = !done;
  if (done) { const ok = A.guess === 1; $('arVerdict').textContent = ok ? t.aroundRight : t.aroundWrong; $('arVerdict').style.color = ok ? C.ok : C.bad; }
  $('arYear').hidden = !done;
  $('arYearLbl').textContent = t.year; $('arYearVal').textContent = A.year;
  $('arSlider').value = A.year;
  $('barVenL').textContent = t.shipsTo(t.places.venice); $('barLisL').textContent = t.shipsTo(t.places.lisbon);
  $('barVen').style.width = `${Math.round(venShare(A.year) * 100)}%`; $('barLis').style.width = `${Math.round(lisShare(A.year) * 100)}%`;
  if (ask || A.phase === 'run') lab.setReadout('?', '', '', C.pink);
  else lab.setReadout(String(A.year), t.year, `${t.roundAfrica}: ${t.coins(4)}`, C.pink);
  if (done) { const [emo, title, lead, body] = t.st.around; lab.setState({ emo, title, lead, body, extra: '' }); }
  else lab.setState({ emo: '🌍', title: t.aroundAsk, lead: '', body: '', extra: '' });
  lab.setFacts(done ? t.facts.around : []);
}
// --- drawing: the loop -------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (S.sec === 'arsenal') return drawArsenal(c, w, h, time);
  const v = lab.view;
  if (v === 'around') return drawAround(c, w, h, dt, time);
  const tgt = BOX[v];
  if (!S.box) S.box = [...tgt];
  for (let i = 0; i < 4; i++) S.box[i] += (tgt[i] - S.box[i]) * Math.min(1, dt * 4);
  const L = layout(w, h, S.box);
  drawMap(c, L, time, v);
  if (v === 'road') drawRoad(c, L, time);
  else drawPorts(c, L, dt, time);
  cartouche(c, L, T[lang].title);
});

render();
</script>
