// --- the clock: water levels, mills, storm -------------------------------------------------------------------------
function pumpCase() {
  if (S.pPick === null) return 'ask';
  if (!S.pTouched) return 'verdict';
  const flooded = S.L1 > fieldOf() + 0.02;
  if (S.mill) return S.L1 <= ditchOf() + 0.05 ? 'ok' : 'pump';
  return flooded ? 'flood' : S.rain ? 'fill' : 'fillDry';
}
function tick(dt) {
  const v = lab.view;
  S.ang += dt * ((v === 'pump' && S.pPick !== null && S.mill) || v === 'storm' || (v === 'mills' && S.mN > 0) ? 1.6 : 0.2);
  if (v === 'pump' && S.pPick !== null) {
    S.L1 = clamp(S.L1 + (0.04 + (S.rain ? 0.14 : 0) - (S.mill ? 0.2 : 0)) * dt, ditchOf(), -0.8);
    const k = `${S.pPick}|${pumpCase()}`;
    if (k !== S.key) { S.key = k; render(); }
  }
  if (v === 'mills' && S.auto) {
    S.autoT += dt;
    if (S.autoT > 0.75) { S.autoT = 0; const need = needOf(S.mD); if (S.mN < need) { S.mN++; sfx.tick(); } if (S.mN >= need) { S.auto = false; sfx.good(); } render(); }
  }
  if (v === 'storm') {
    if (S.ph === 'run') { S.k = Math.min(1, S.k + dt / 4); if (S.k >= 1) finishStorm(); }
    else if (S.ph === 'set') S.k = Math.max(0, S.k - dt / 1.2);
    if (!S.afs) {
      let inflow = 0.04 - 0.2;
      if (S.floodT > 0) { S.floodT -= dt; inflow += 0.6; }
      S.L3 = clamp(S.L3 + inflow * dt, -4.5, -1.0);
    }
  }
  if ((S.ro += dt) > 0.12) { S.ro = 0; readout(); }
}
const stormCrest = () => { const hw = 0.5 + 0.2 * S.sg; return { hw, crest100: Math.round((S.sg + hw) * 100) }; };
function finishStorm() {
  const { hw, crest100 } = stormCrest(), dk100 = Math.round((S.afs ? 7.25 : S.dk) * 100), dry = dk100 >= crest100, need = Math.ceil(crest100 / 25) * 25 / 100;
  S.ph = 'done'; S.res = { dry, hw, need, exact: dry && dk100 === Math.round(need * 100) };
  if (!dry) S.floodT = 5;
  (dry ? sfx.good : sfx.bad)(); render();
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  tick(dt);
  if (lab.view === 'mills') drawChain(c, w, h, time); else drawSection(c, w, h, time);
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const goView = (v) => $('views').querySelector(`[data-view="${v}"]`)?.click();

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;

  else if (a === 'preset') { resetPump(); S.pTouched = true; sfx.click(); }
  else if (a === 'mpick') {
    if (S.mPick !== null) return; S.mPick = +b.dataset.i; S.mV = true; S.mN = 0; S.auto = true; S.autoT = 0.3;

  else if (a === 'madd') { S.auto = false; S.mV = false; if (S.mN < needOf(S.mD)) { S.mN++; sfx.snap(); } }
  else if (a === 'mrem') { S.auto = false; S.mV = false; if (S.mN > 0) { S.mN--; sfx.tick(); } }
  else if (a === 'mclr') { S.auto = false; S.mV = false; S.mN = 0; sfx.click(); }

  else if (a === 'again') { S.ph = 'set'; S.res = null; sfx.click(); }

});

  } else if (v === 'mills') {
    const need = needOf(S.mD);
    if (S.mPick === null) lab.setReadout('?', t.m.sub(2), '', '#e0b050');
    else lab.setReadout(S.mN, t.m.sub(S.mN), S.mN >= need ? t.m.okP : t.m.shortP(S.mD - S.mN * LIFT), '#e0b050');
  } else {
    const dk = S.afs ? 7.25 : S.dk, e = ease(S.k);
    lab.setReadout(`+${fm(dk)} m`, t.s.readSub, S.ph === 'set' ? t.s.pillSet(S.sg) : S.ph === 'run' ? t.s.pillRun : S.res?.dry ? t.s.pillDry : t.s.pillWet, e > 0.5 ? '#d9825f' : '#6fb36f');
  }
}
function renderPump(t) {
  const p = t.p, c = pumpCase(), asking = S.pPick === null;
  lab.setGlow('rgba(78, 168, 216, .28)');
  const d = -fieldOf();
  $('pAsk').innerHTML = `<p class="pd-q">${esc(p.q(d))}</p><div class="pd-opts">${p.opts.map((o, i) => `<button class="pd-opt ${!asking && i === PRED_P ? 'good' : !asking && i === S.pPick ? 'bad' : ''}" data-act="ppick" data-i="${i}" ${asking ? '' : 'disabled'}>${esc(o)}</button>`).join('')}</div>`;
  $('pRun').hidden = asking;
  $('pChips').innerHTML = `<button class="chip pd-chip ${S.rain ? 'on' : ''}" data-act="rain">🌧️ ${esc(`${t.rainL}: ${S.rain ? t.on : t.off}`)}</button>
    <button class="chip pd-chip ${S.mill ? 'on' : ''}" data-act="mill">🌬️ ${esc(`${t.millL}: ${S.mill ? t.on : t.off}`)}</button>
    <button class="chip pd-chip" data-act="preset">${esc(p.reset)}</button>`;
  let st, body = '';
  if (c === 'ask') st = { emo: '🤔', title: p.t0, lead: p.lead };
  else if (c === 'verdict') { const r = S.pPick === PRED_P ? p.right : S.pPick === 0 ? p.w0 : p.w1; st = { emo: S.pPick === PRED_P ? '✅' : '🤔', title: r[0], lead: r[1] }; body = p.next; }
  else { const e = { fill: '🌧️', fillDry: '⏳', flood: '🌊', pump: '🌬️', ok: '🌷' }[c]; st = { emo: e, title: p[c][0], lead: p[c][1] }; body = p.body; }
  if (S.low && c !== 'ask') body = `${t.low[1]} ${body}`;
  lab.setState({ ...st, body, extra: '' });
  lab.setFacts(asking ? [] : S.low ? t.facts.low : t.facts.p);
  readout();
}
function renderMills(t) {
  const m = t.m, asking = S.mPick === null, D = S.mD, need = needOf(D), n = S.mN, right = needOf(4.5);
  lab.setGlow('rgba(224, 176, 80, .26)');
  $('mAsk').innerHTML = `<p class="pd-q">${esc(m.q(4.5))}</p><div class="pd-nums">${[1, 2, 3, 4].map((i) => `<button class="pd-opt ${!asking && i === right ? 'good' : !asking && i === S.mPick ? 'bad' : ''}" data-act="mpick" data-i="${i}" ${asking ? '' : 'disabled'}>${i}</button>`).join('')}</div>`;
  $('mRun').hidden = asking;
  $('mDepL').textContent = m.depthL;
  $('mDep').innerHTML = [3, 4.5, 6.7].map((d) => `<button class="chip pd-chip ${d === D ? 'on' : ''}" data-act="dep" data-d="${d}">${esc(fm(d))} m</button>`).join('');
  $('mAdd').textContent = m.add; $('mRem').textContent = m.rem; $('mClr').textContent = m.clear;
  $('mAdd').disabled = n >= need; $('mRem').disabled = n <= 0; $('mClr').disabled = n <= 0;
  let st, body = '';
  if (asking) st = { emo: '🤔', title: m.t0, lead: m.lead };
  else if (S.mV) { const r = S.mPick === right ? m.right(right) : m.wrong(right); st = { emo: S.mPick === right ? '✅' : '🤔', title: r[0], lead: r[1] }; }
  else if (n === 0) st = { emo: '🌬️', title: m.zero[0], lead: m.zero[1] };
  else if (n < need) { const r = m.part(n, D - n * LIFT); st = { emo: '🌬️', title: r[0], lead: r[1] }; }
  else { const r = m.done(n, D); st = { emo: '🎉', title: r[0], lead: r[1] }; if (n * LIFT > D + 1e-9) body = m.over(D - (n - 1) * LIFT); }
  lab.setState({ ...st, body, extra: '' });
  lab.setFacts(asking ? [] : t.facts.m);
  readout();
}
function renderStorm(t) {
  const s = t.s, afs = S.afs, dk = afs ? 7.25 : S.dk;
  lab.setGlow('rgba(217, 130, 95, .26)');
  $('svL').textContent = s.surge; $('svV').textContent = `+${fm(S.sg)} m`; $('dkL').textContent = s.dike; $('dkV').textContent = `+${fm(dk)} m`;
  $('svI').value = S.sg; $('dkI').value = dk; $('dkI').disabled = afs;
  $('sGo').textContent = S.ph === 'done' ? s.again : s.go; $('sGo').dataset.act = S.ph === 'done' ? 'again' : 'storm'; $('sGo').disabled = S.ph === 'run';
  let st, body = '';
  if (S.ph === 'set') st = afs ? { emo: '🛣️', title: s.afs[0], lead: s.afs[1] } : { emo: '🏗️', title: s.set[0], lead: s.set[1] };
  else if (S.ph === 'run') st = { emo: '🌊', title: s.run[0], lead: s.run[1] };
  else if (!S.res.dry) st = { emo: '🌊', title: s.flood[0], lead: s.flood[1] };
  else if (afs) st = { emo: '🛣️', title: s.afsDry[0], lead: s.afsDry[1] };
  else { const r = S.res.exact ? s.lowest(S.sg, S.res.hw) : s.dryHigh; st = { emo: S.res.exact ? '🏆' : '✅', title: r[0], lead: r[1] }; }
  if (afs && S.ph === 'set') body = s.afs[2];
  lab.setState({ ...st, body, extra: '' });
  lab.setFacts(afs ? t.facts.afs : t.facts.s);
  readout();
}
render();
</script>
