  else if (act === 'oagain') { S.ri = 0; S.pick = null; S.res = []; sfx.click(); }
  else if (act === 'cut') { S.cut[i] = !S.cut[i]; sfx.tick(); }
  else if (act === 'treset') { S.cut = []; sfx.click(); }
  else if (act === 'chunk') {
    const at = S.one.indexOf(i);
    if (at >= 0) S.one.splice(at, 1); else if (S.one.length < 4) S.one.push(i); else return;
    sfx.tick();
  } else if (act === 'oreset') { S.one = []; sfx.click(); }
  render();
});

// --- render --------------------------------------------------------------------------------------------------------
function secChips(t) {
  const open = secret.unlocked(), c = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : `🔒 ${esc(t.secrets[k][0])}`}</button>`;
  return `<div class="row2 sq-sep">${c('tele', '📨')}${c('one', '📝')}</div>`;
}
function render() {
  const t = T[lang], v = lab.view; let html = '';
  if (S.sec === 'tele') html = renderTele(t);
  else if (S.sec === 'one') html = renderOne(t);
  else if (v === 'press') html = renderPress(t);
  else if (v === 'sums') html = renderSums(t);
  else html = renderOwn(t);
  $('ctrlBody').innerHTML = html + secChips(t);
  const f = t.facts[S.sec === 'tele' ? 'sums' : S.sec === 'one' ? 'press' : v];
  lab.setFacts([{ emo: v === 'press' ? '✉️' : v === 'sums' ? '📨' : '🧠', text: f.text, src: f.src }]);
}
function renderPress(t) {
  const g = pressState(), p = t.p, sh = S.pressed;
  const rows = t.bees.map((s, i) => {
    const ln = LAMPS.findIndex((L) => L.c === i), icon = S.knew && ln >= 0 ? LAMPS[ln].icon : '';
    return `<button class="sq-s ${S.mark[i] ? 'on' : ''} ${sh && S.mark[i] ? 'gone' : ''} ${icon ? 'carry' : ''}" data-act="mark" data-i="${i}" ${sh ? 'disabled' : ''}><b>${i + 1}</b><span>${esc(s)}</span>${icon ? `<em>${icon}</em>` : ''}</button>`;
  }).join('');
  lab.setReadout(String(g.keptWords), t.words, p.pill(g.p.limit), '#ffd75e');
  const k = g.lit.filter((x) => !x).length;
  if (!sh) lab.setState({ emo: '🍋', title: p.qT, lead: p.qL, body: '', extra: `<div class="fine" style="font-size:11px;color:var(--faint)">${esc(t.fine)}</div>` });
  else if (k > 0) lab.setState({ emo: '💡', title: p.outT(k), lead: p.outL, body: '', extra: '' });
  else if (!g.win) lab.setState({ emo: '📏', title: p.longT, lead: p.longL(g.keptWords, g.p.limit), body: '', extra: '' });
  else lab.setState({ emo: '🏅', title: p.stamp, lead: p.winL(g.keptWords), body: '', extra: '' });
  return `<div class="sq-top"><button class="btn" data-act="press">${esc(sh ? p.change : p.press)}</button><span class="sq-hint">${esc(p.hint)}</span></div><div class="sq-list">${rows}</div>`;
}
function renderSums(t) {
  const s = t.s, sel = S.sel;
  const cards = s.texts.map((x, i) => {
    const kind = SUM_KINDS[i], cls = S.shown ? (kind === 'best' ? 'good' : sel === i ? 'bad' : '') : sel === i ? 'pick' : '';
    return `<button class="sq-c ${cls}" data-act="sel" data-i="${i}" ${S.shown ? 'disabled' : ''}><b>${'ABC'[i]}</b><span>${esc(x)}${S.shown ? `<small>${esc(s.wordsN(wc(x)))} · ${esc(s.kinds[kind])}</small>` : ''}</span></button>`;
  }).join('');
  lab.setReadout(sel === null ? '–' : String(wc(s.texts[sel])), sel === null ? '' : t.words, null, '#ffd75e');
  if (!S.shown) lab.setState({ emo: '⚖️', title: s.qT, lead: s.qL, body: '', extra: '' });
  else {
    const kd = SUM_KINDS[sel];
    if (kd === 'best') lab.setState({ emo: '✅', title: s.rightT, lead: s.rightL, body: '', extra: '' });
    else if (kd === 'lost') lab.setState({ emo: '💡', title: s.lostT, lead: s.lostL(t.lampL[SUM_LIT.lost.indexOf(0)]), body: '', extra: '' });
    else lab.setState({ emo: '📋', title: s.copyT, lead: s.copyL, body: '', extra: '' });
  }
  const btn = S.shown ? `<button class="btn ghost" data-act="sagain">${esc(s.again)}</button>` : `<button class="btn" data-act="show" ${sel === null ? 'disabled' : ''}>${esc(s.go)}</button>`;
  return `<div class="sq-top">${btn}<span class="sq-hint">${esc(S.shown ? '' : s.pick)}</span></div><div class="sq-cards">${cards}</div>`;
}
function renderOwn(t) {
  const o = t.o, r = S.ri, done = r >= 3, k = S.res.filter(Boolean).length;
  if (done) {
    lab.setReadout('3 / 3', '', o.pill(k, 3), '#ffd75e'); lab.setState({ emo: '🏆', title: o.endT(k), lead: o.endL, body: '', extra: '' });
    return `<div class="sq-top"><button class="btn" data-act="oagain">${esc(o.again)}</button></div>`;
  }
  const rd = o.rounds[r], kinds = R_KINDS[r], pk = S.pick;
  const opts = rd.opts.map((x, i) => {
    const cls = pk === null ? '' : kinds[i] === 'ok' ? 'good' : i === pk ? 'bad' : '';
    return `<button class="sq-c ${cls}" data-act="pick" data-i="${i}" ${pk !== null ? 'disabled' : ''}><b>${'ABC'[i]}</b><span>${esc(x)}${pk !== null ? `<small>${esc(o.kinds[kinds[i]])}</small>` : ''}</span></button>`;
  }).join('');
  lab.setReadout(`${r + 1} / 3`, '', S.res.length ? o.pill(k, S.res.length) : '', '#ffd75e');
  if (pk === null) lab.setState({ emo: '💬', title: o.q, lead: o.qL(r + 1), body: '', extra: '' });
  else { const kd = kinds[pk]; lab.setState({ emo: kd === 'ok' ? '✅' : kd === 'cpy' ? '📋' : '⚖️', title: o[kd + 'T'], lead: o[kd + 'L'], body: '', extra: '' }); }
  return `<div class="sq-top">${pk !== null ? `<button class="btn" data-act="next">${esc(o.next)}</button>` : ''}</div><div class="sq-cards">${opts}</div>`;
}
function renderTele(t) {
  const g = teleState(), tg = t.tg, miss = g.lit.map((l, j) => (l ? null : tg.lampL[j])).filter(Boolean).join(', ');
  const toks = tg.toks.map((w, i) => `<button class="sq-tok ${S.cut[i] ? 'cut' : ''}" data-act="cut" data-i="${i}">${esc(w)}</button>`).join('');
  lab.setReadout(String(g.cost), '🪙', null, '#ffd75e');
  if (!g.allLit) lab.setState({ emo: '📨', title: tg.outT, lead: tg.outL(miss), body: '', extra: '' });
  else if (g.cost > g.best) lab.setState({ emo: '📨', title: tg.okT(g.cost), lead: tg.okL, body: '', extra: '' });
  else lab.setState({ emo: '🏆', title: tg.bestT(g.cost), lead: tg.bestL, body: '', extra: '' });
  return `<div class="sq-top"><button class="btn ghost" data-act="treset">${esc(tg.reset)}</button><span class="sq-hint">${esc(tg.hint)}</span></div><p class="sq-hint" style="margin:10px 0 0;flex:none">${esc(tg.lead)}</p><div class="sq-toks">${toks}</div>`;
}
function renderOne(t) {
  const g = oneState(), on = t.on, miss = g.lit.map((l, j) => (l ? null : t.lampL[j])).filter(Boolean).join(', ');
  const built = sentence(S.one, t);
  const ch = on.chunks.map(([x], i) => { const at = S.one.indexOf(i); return `<button class="sq-s ${at >= 0 ? 'carry' : ''}" data-act="chunk" data-i="${i}"><b>${at >= 0 ? at + 1 : '+'}</b><span>${esc(x)}</span></button>`; }).join('');
  lab.setReadout(String(g.words), t.words, on.pill(S.one.length), '#ffd75e');
  if (!g.full) lab.setState({ emo: '📝', title: on.pickT(S.one.length), lead: on.pickL, body: '', extra: '' });
  else if (g.allLit) lab.setState({ emo: '🏅', title: on.okT, lead: on.okL(g.words, g.total), body: '', extra: '' });
  else lab.setState({ emo: '💡', title: on.outT, lead: on.outL(miss), body: '', extra: '' });
  return `<div class="sq-top"><button class="btn ghost" data-act="oreset">${esc(on.reset)}</button><span class="sq-hint">${esc(on.hint)}</span></div><div class="sq-built">${built ? esc(built) : `<i>${esc(on.empty)}</i>`}</div><div class="sq-list">${ch}</div>`;
}

render();
</script>
</body>
</html>
