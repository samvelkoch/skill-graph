    }
  } else if (lab.view === 'faces' && geo2) {
    const q = geo2.cells.find((k) => x >= k.x && x <= k.x + k.w && y >= k.y && y <= k.y + k.h);
    if (!q || S.g2 === null || S.chk2) { if (q) sfx.tick(); return; }
    if (S.pick) { for (const k of Object.keys(S.m2)) if (S.m2[k] === S.pick) delete S.m2[k]; S.m2[q.key] = S.pick; S.pick = null; sfx.snap(); }
    else if (S.m2[q.key]) { delete S.m2[q.key]; sfx.tick(); } else sfx.tick();
    render();
  }
});
cv.addEventListener('pointermove', (ev) => { if (!S.drag || !geo) return; const [x] = pos(ev); setLens(Y0 + ((x - geo.X0) / geo.W) * (Y1 - Y0)); });
const endDrag = () => { S.drag = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
$('erLens').addEventListener('input', (ev) => { S.t0 = +ev.target.value; if (S.sec === 'pharos') S.sec = null; render(); });

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, t = T[lang];
  if (a === 'g1') { S.g1 = +b.dataset.i; S.sel = null; S.sec = null; (S.g1 === t.rb.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (k === 'kush') { if (S.sec === 'kush') { S.sec = null; } else { S.sec = 'kush'; S.sel = null; S.t0 = -950; $('erLens').value = S.t0; } }
    else S.sec = S.sec === 'pharos' ? null : 'pharos';
    sfx.click();
  } else if (a === 'g2') { S.g2 = +b.dataset.i; (S.g2 === t.fc.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'pick') { S.pick = S.pick === b.dataset.k ? null : b.dataset.k; sfx.tick(); }
  else if (a === 'chk2') { S.chk2 = true; const k = SLOTS.filter((s) => S.m2[s] === s).length; (k === 4 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'clr2') { S.m2 = {}; S.pick = null; S.chk2 = false; sfx.click(); }
  else if (a === 'mv') {
    const i = S.ord.indexOf(b.dataset.k), j = i + (b.dataset.d === 'up' ? -1 : 1);
    if (j >= 0 && j < 4 && !S.chk3) { [S.ord[i], S.ord[j]] = [S.ord[j], S.ord[i]]; sfx.tick(); }
  } else if (a === 'chk3') {
    const ok = S.ord.every((k, i) => k === CARDS[i]); S.right3 = S.ord.map((k, i) => k === CARDS[i]); S.allOk3 = ok;
    S.ord0 = [...S.ord]; S.ord = [...CARDS]; S.chk3 = true; (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'again3') { S.ord = ['demo', 'rome', 'closed', 'hiero']; S.chk3 = false; S.endT = 0; sfx.click(); }
  render();
});

// --- one render per change: controls, readout and state card ------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('erV1').hidden = v !== 'ribbon'; $('erV2').hidden = v !== 'faces'; $('erV3').hidden = v !== 'end';
  if (v === 'ribbon') renderRibbon(t); else if (v === 'faces') renderFaces(t); else renderEnd(t);
}
const fine = () => `<div class="er-fine">${esc(T[lang].fine)}</div>`;
const optBtns = (opts, g, ok, act) => opts.map((o, i) => {
  const cls = g === null ? '' : i === ok ? ' good' : i === g ? ' bad' : ' dim';
  return `<button class="er-opt${cls}" data-act="${act}" data-i="${i}"${g === null ? '' : ' disabled'}>${esc(o)}</button>`;
}).join('');

function renderRibbon(t) {
  const r = t.rb, g = S.g1;
  $('erLensL').textContent = r.lens; $('erLens').disabled = S.sec === 'pharos';
  if (+$('erLens').value !== S.t0) $('erLens').value = S.t0;
  $('erQ1').innerHTML = `<div class="er-q">${esc(r.q)}</div><div class="er-opts">${optBtns(r.opts, g, r.ok, 'g1')}</div>`
    + (g === null ? '' : `<div class="er-verdict ${g === r.ok ? 'good' : 'bad'}">${esc(g === r.ok ? t.right : t.notq)} ${esc(r.rvOk)}</div>`);
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('erSecs').innerHTML = sc('kush', '🔺') + sc('pharos', '🗼');
  let st, sel = null;
  if (S.sec === 'pharos') st = { emo: '🗼', title: t.ph.t, lead: t.ph.l, body: t.ph.b };
  else if (S.sec === 'kush') { st = { emo: '🔺', title: t.ks.t, lead: t.ks.l, body: t.ks.b }; sel = segById('kush'); }
  else if (S.sel === 'ass') st = { emo: '◆', title: t.ass[0], lead: t.ass[1], body: '' };
  else if (S.sel) { sel = segById(S.sel); const s = r_seg(S.sel); st = { emo: '📜', title: s.n, lead: segDates(sel), body: s.b }; }
  else if (g === null) st = { emo: '📜', title: r.intro[0], lead: r.intro[1], body: r.intro[2] };
  else st = { emo: '👑', title: r.rvT, lead: r.rvL(PTOL_YEARS), body: r.rvB };
  lab.setState({ ...st, extra: fine() });
  if (sel) lab.setReadout(`${t.c} ${segDur(sel)}${sel.id === 'rome' ? '+' : ''}`, r.dur, t.rb.lg[sel.o === 'home' ? 'home' : sel.o], COL[sel.o]);
  else lab.setReadout(t.n3500, r.durLong, '', '#d9a441');
  lab.setGlow('rgba(217, 164, 65, .26)');
  const f = t.facts;
  lab.setFacts(g === null ? [f.hyk, f.pyr] : [f.lang, f.hyk, f.pyr]);
}

function renderFaces(t) {
  const f = t.fc, g = S.g2;
  $('erQ2').innerHTML = `<div class="er-q">${esc(f.q)}</div><div class="er-opts">${optBtns(f.opts, g, f.ok, 'g2')}</div>`
    + (g === null ? '' : `<div class="er-verdict ${g === f.ok ? 'good' : 'bad'}">${esc(g === f.ok ? t.right : t.notq)} ${esc(f.okMsg)}</div>`);
  $('erM2').hidden = g === null;
  $('erTask').textContent = f.task;
  const used = new Set(Object.values(S.m2));
  $('erNames').innerHTML = SLOTS.map((k) => `<button class="chip${S.pick === k ? ' on' : ''}${used.has(k) ? ' placed' : ''}" data-act="pick" data-k="${k}"${S.chk2 ? ' disabled' : ''}>${used.has(k) ? '✓ ' : ''}${esc(f.chip[k])}</button>`).join('');
  const placed = Object.keys(S.m2).length, k = SLOTS.filter((s) => S.m2[s] === s).length;
  $('erChk2').textContent = f.check; $('erChk2').disabled = placed < 4 || S.chk2; $('erClr2').textContent = f.clear;
  lab.setGlow('rgba(196, 150, 90, .26)');
  let st;
  if (g === null) st = { emo: '🏛️', title: f.t0, lead: f.l0, body: '' };
  else if (S.chk2) st = k === 4 ? { emo: '✅', title: f.allT, lead: f.allL, body: '' } : { emo: '🤔', title: f.someT(k), lead: f.someL, body: '' };
  else st = { emo: '🔎', title: f.tPick, lead: f.lPick, body: '' };
  lab.setState({ ...st, extra: fine() });
  if (g === null) lab.setReadout('?', '', '', '#c4965a');
  else if (S.chk2) lab.setReadout(`${k}/4`, f.readoutOk, '', '#c4965a');
  else lab.setReadout(`${placed}/4`, f.readout, '', '#c4965a');
  const fa = t.facts;
  lab.setFacts(g === null ? [fa.canal] : [fa.hibis, fa.traj, fa.alex]);
}

function renderEnd(t) {
  const e = t.ed, order = S.ord;
  $('erList').innerHTML = order.map((k, i) => {
    const card = e.cards[k], right = S.chk3 ? S.right3[S.ord0.indexOf(k)] : null;
    if (!S.chk3) return `<li class="er-card" data-k="${k}"><span class="n">${i + 1}</span><div class="txt"><b>${esc(card[0])}</b><small>${esc(card[1])}</small></div>
      <span class="mv"><button data-act="mv" data-k="${k}" data-d="up" aria-label="↑"${i === 0 ? ' disabled' : ''}>▲</button><button data-act="mv" data-k="${k}" data-d="dn" aria-label="↓"${i === 3 ? ' disabled' : ''}>▼</button></span></li>`;
    return `<li class="er-card ${right ? 'good' : 'bad'}"><span class="n">${i + 1}</span><div class="txt"><b>${esc(card[0])}</b><small class="date">${esc(e.when[k])}</small></div><span class="mk">${right ? '✓' : '↕'}</span></li>`;
  }).join('');
  $('erChk3').dataset.act = S.chk3 ? 'again3' : 'chk3';
  $('erChk3').textContent = S.chk3 ? e.again : e.check;
  lab.setGlow('rgba(224, 154, 94, .26)');
  let st;
  const k = S.chk3 ? S.right3.filter(Boolean).length : 0;
  if (!S.chk3) st = { emo: '🕰️', title: e.t0, lead: e.l0, body: '', extra: '' };
  else {
    const years = Math.round(span(30, 394) / 10) * 10; // 30 BC to AD 394
    st = { emo: S.allOk3 ? '✅' : '🤔', title: S.allOk3 ? e.okT : e.noT, lead: e.okL(years), body: e.b,
      extra: `<a class="er-link" href="../rosetta/${lang === 'en' ? '' : `?lang=${lang}`}">🪨 ${esc(e.link)} ${esc(ROSETTA[lang])} →</a>` };
  }
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body, extra: `${st.extra}${fine()}` });
  if (S.chk3) lab.setReadout(`${k}/4`, e.readout, '', '#e09a5e'); else lab.setReadout('4', e.readout0, '', '#e09a5e');
  const fa = t.facts;
  lab.setFacts(S.chk3 ? [fa.esmet, fa.demo] : [fa.reloc]);
}
render();
</script>
</body>
</html>
