    shadow(c, 56, 85, 13, 3, .3); god(c, 'isis', 56, 85, .46, false, time);
  } else if (id === 3) { // king of the dead
    c.fillStyle = lgrad(c, 0, 0, 0, 88, [[0, '#1c1f4a'], [1, '#3a2d6a']]); c.fillRect(0, 0, 170, 88);
    for (let i = 0; i < 12; i++) star4(c, 8 + rnd(i + 3) * 154, 6 + rnd(i + 20) * 50, 2 + rnd(i) * 1.6, '#ffe28a');
    c.fillStyle = lgrad(c, 0, 70, 0, 88, [[0, '#e8b53a'], [1, '#a8721a']]); c.fillRect(0, 70, 170, 18);
    const g = c.createRadialGradient(85, 48, 4, 85, 48, 52); g.addColorStop(0, 'rgba(110,230,150,.5)'); g.addColorStop(1, 'rgba(110,230,150,0)'); c.fillStyle = g; c.fillRect(0, 0, 170, 88);
    ankh(c, 24, 54); ankh(c, 146, 54);
    shadow(c, 85, 86, 15, 3, .35); god(c, 'osiris', 85, 86, .55, false, time);
  } else if (id === 4) { // Horus and Set face to face
    c.fillStyle = lgrad(c, 0, 0, 0, 68, [[0, '#f3b46a'], [1, '#f7e1a8']]); c.fillRect(0, 0, 170, 88);
    sunDisk(c, 85, 60, 18, time, .6, false);
    c.fillStyle = lgrad(c, 0, 66, 0, 88, [[0, '#e0b878'], [1, '#c18f50']]); c.fillRect(0, 66, 170, 22);
    shadow(c, 42, 82, 13, 3, .3); god(c, 'horus', 42, 82, .42, false, time);
    shadow(c, 128, 82, 13, 3, .3); god(c, 'set', 128, 82, .42, true, time);
    const pu = 1 + Math.sin(time * 6) * .1; c.save(); c.translate(85, 38); c.rotate(time * .4); c.beginPath(); for (let i = 0; i < 16; i++) { const a = i * TAU / 16, r = (i % 2 ? 8 : 17) * pu; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); fillOut(c, '#fff0a0', 1.6); c.restore();
    c.fillStyle = 'rgba(230,200,150,.8)'; for (const [x, y, r] of [[70, 82, 4], [100, 84, 3.4], [58, 85, 3]]) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
  } else { // Horus rules
    c.fillStyle = lgrad(c, 0, 0, 0, 68, [[0, '#9bd8f8'], [1, '#fff3c4']]); c.fillRect(0, 0, 170, 88);
    sunDisk(c, 26, 22, 10, time, .6, false);
    c.fillStyle = lgrad(c, 0, 68, 0, 88, [[0, '#e8c068'], [1, '#b88a30']]); c.fillRect(0, 68, 170, 20);
    for (let i = 0; i < 14; i++) { const fy = ((time * 14 + rnd(i) * 90) % 90), fx = 6 + rnd(i + 7) * 158; c.fillStyle = i % 3 ? '#e8b53a' : '#c0392b'; c.fillRect(fx, fy - 4, 3.2, 3.2); }
    for (const [x, sh, sk] of [[22, '#fff', '#c98a5a'], [50, '#2fb5a8', '#b97a4a'], [120, '#c0392b', '#c98a5a'], [148, '#fff', '#b97a4a']]) person(c, x, 86, .66, sh, sk, 1 + Math.sin(time * 5 + x));
    shadow(c, 85, 85, 15, 3, .3); god(c, 'horus', 85, 85, .52, false, time);
  }
}
function drawPanels(c, time, dt) {
  const story = S.phase === 'story', cur = story ? S.stI : -1;
  if (story) { S.stT += dt; const i = Math.floor(S.stT / 2.8); if (i >= 6) { S.phase = 'done'; S.stI = 6; render(); } else if (i !== S.stI) { S.stI = i; render(); } }
  c.fillStyle = lgrad(c, 0, 0, 0, DH, [[0, '#2a2038'], [1, '#1a1426']]); c.fillRect(0, 0, DW, DH);
  const pieces = [0, 1, 2, 3, 4, 5].sort((a, b) => (S.order.indexOf(a) === S.sel ? 1 : 0) - (S.order.indexOf(b) === S.sel ? 1 : 0));
  for (const i of pieces) {
    const slot = S.order.indexOf(i), tx = PX(slot), ty = PY(slot), pp = S.pp[i] || (S.pp[i] = { x: tx, y: ty });
    pp.x += (tx - pp.x) * Math.min(1, dt * 14); pp.y += (ty - pp.y) * Math.min(1, dt * 14);
    const sel = S.sel === slot, wrong = S.res && !S.res[slot], right = S.res && S.res[slot], lit = story && cur === slot;
    const shake = wrong && now() - S.resAt < .6 ? Math.sin((now() - S.resAt) * 40) * 3 * (1 - (now() - S.resAt) / .6) : 0;
    c.save(); c.translate(pp.x + shake + (sel ? -2 : 0), pp.y + (sel ? -2 : 0)); if (sel || lit) { c.translate(85, 44); c.scale(1.03, 1.03); c.translate(-85, -44); }
    c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.roundRect(2, 4, 170, 88, 12); c.fill();
    c.save(); c.beginPath(); c.roundRect(0, 0, 170, 88, 12); c.clip(); panelScene(c, i, time);
    if (story && !lit) { c.fillStyle = 'rgba(20,12,30,.6)'; c.fillRect(0, 0, 170, 88); }
    c.restore();
    c.beginPath(); c.roundRect(0, 0, 170, 88, 12); c.lineWidth = sel || lit ? 4 : 2.4; c.strokeStyle = sel || lit ? '#ffd24a' : right ? '#6fd68a' : wrong ? '#e0523a' : INK; c.stroke();
    if (!sel && !lit && !right && !wrong) { c.beginPath(); c.roundRect(3, 3, 164, 82, 9); c.lineWidth = 1; c.strokeStyle = 'rgba(232,181,58,.7)'; c.stroke(); }
    c.beginPath(); c.arc(14, 14, 10, 0, TAU); fillOut(c, gold(c, 4, 4, 24, 24), 1.4); c.fillStyle = INK; c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(slot + 1, 14, 14.5);
    c.restore();
    P(T[lang].os.capt[i], pp.x + 85, pp.y + 73, { edge: lit ? '#ffd24a' : 'rgba(232,181,58,.6)' });
  }
}
function drawOs(c, time, dt) { if (S.phase === 'wall') drawWall(c, time); else drawPanels(c, time, dt); }

// --- portraits for the god cards -----------------------------------------------------------------------------
function drawBust(cv, id) {
  const d = 2, w = 58, h = 66; cv.width = w * d; cv.height = h * d;
  const c = cv.getContext('2d'); c.scale(d, d);
  c.beginPath(); c.roundRect(0, 0, w, h, 10); c.clip();
  c.fillStyle = lgrad(c, 0, 0, 0, h, [[0, '#fbf0cc'], [1, '#e4c885']]); c.fillRect(0, 0, w, h);
  c.fillStyle = '#2f6fc4'; c.fillRect(0, 0, w, 6); c.fillStyle = '#e8b53a'; c.fillRect(0, 6, w, 1.6);
  const s = id === 'horus' || id === 'ra' ? .86 : .92;
  god(c, id, 21 - s, 40 + 102 * s, s, false, 0);
}
function cardsHTML(ids, okId, badId, done) {
  const t = T[lang];
  return `<div class="eg-cards">${ids.map((id) => `<button class="eg-card ${done && id === okId ? 'ok' : ''} ${done && id === badId ? 'bad' : ''}" data-pick="${id}" ${done ? 'disabled' : ''}><canvas data-god="${id}"></canvas><span>${esc(t.gn[id])}</span></button>`).join('')}</div>`;
}
const paintBusts = (el) => el.querySelectorAll('canvas[data-god]').forEach((cv) => drawBust(cv, cv.dataset.god));

// --- the loop ------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view; pills.length = 0;
  if (S.sec === 'aten') { const t = atenT(), p = t < 2 ? 'p1' : t < 8 ? 'p2' : 'p3'; if (p !== S.secPh) { S.secPh = p; render(); } }
  c.save(); fit(c, w, h);
  c.beginPath(); c.roundRect(0, 0, DW, DH, 16); c.clip();
  if (v === 'who') { if (S.sec === 'cats') drawCats(c, time); else drawWho(c, time, dt); } else if (v === 'sun') drawSun(c, time, dt); else drawOs(c, time, dt);
  c.restore();
  c.save(); fit(c, w, h); c.beginPath(); c.roundRect(1.5, 1.5, DW - 3, DH - 3, 15); c.lineWidth = 3; c.strokeStyle = INK; c.stroke(); c.beginPath(); c.roundRect(5, 5, DW - 10, DH - 10, 12); c.lineWidth = 1.2; c.strokeStyle = 'rgba(232,181,58,.8)'; c.stroke(); c.restore();
  flush(c);
});

// --- input ---------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.k, y = (ev.clientY - r.top - G.oy) / G.k, v = lab.view;
  if (v === 'who' && !S.sec) {
    let best = null, bd = 28 * 28;
    for (const h of HOT) { const d = (h.x - x) ** 2 + (h.y - y) ** 2; if (d < bd) { bd = d; best = h; } }
    if (best) { S.hot = best.id; S.msg = 'god'; sfx.tick(); render(); }
  } else if (v === 'osiris' && S.phase === 'order') {
    for (let s = 0; s < 6; s++) if (x >= PX(s) && x <= PX(s) + 170 && y >= PY(s) && y <= PY(s) + 88) {
      if (S.sel === null) S.sel = s; else if (S.sel === s) S.sel = null; else { [S.order[S.sel], S.order[s]] = [S.order[s], S.order[S.sel]]; S.sel = null; S.res = null; S.res = null; }
      sfx.snap(); render(); return;
    }
  } else if (v === 'osiris' && S.phase === 'wall' && !S.lk.asked) {
    if (x > 60 && x < 170 && y > 110 && y < 262) { S.lk.asked = true; S.lk.opts = shuffle(['osiris', 'horus', 'set']); sfx.click(); render(); }
  }
});
$('sunR').addEventListener('input', (ev) => { S.u = +ev.target.value / 1000; S.playing = false; S.touched = true; S.sph = phaseOf(S.u); render(); });
function runSecret(k) {
  if (!secret.unlocked()) return secret.open();
  if (lab.view !== 'who') document.querySelector('#views [data-view="who"]')?.click();
  if (k === 'aten') { S.sec = 'aten'; S.secAt = now(); S.secPh = 'p1'; } else S.sec = S.sec === 'cats' ? null : 'cats';
  sfx.click(); render(); showStage();
}
const newOrder = () => { let o; do o = shuffle([0, 1, 2, 3, 4, 5]); while (o.every((p, i) => p === i)); S.order = o; S.sel = null; S.res = null; };
newOrder();
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.season !== undefined) { S.season = +d.season; S.msg = 'season'; S.seasonMsg = S.season; sfx.tick(); render(); }
  else if (d.pick) {
    if (lab.view === 'who') {
      const h = HOT.find((x) => x.id === S.hot); if (!h || S.solved[h.id]) return;
      const ok = d.pick === h.god; S.solved[h.id] = { at: now(), ok, pick: d.pick }; (ok ? sfx.good : sfx.bad)();
      S.msg = Object.keys(S.solved).length === 7 ? 'end' : 'god'; render(); showStage();
    } else if (S.lk.pick === null) { S.lk.pick = d.pick; (d.pick === 'horus' ? sfx.good : sfx.bad)(); render(); showStage(); }
  }
  else if (d.sp !== undefined) { if (S.sp !== null) return; S.sp = +d.sp; S.spAt = now(); (S.sp === 1 ? sfx.good : sfx.bad)(); S.sph = phaseOf(S.u); render(); showStage(); }
  else if (d.act === 'play') { S.playing = !S.playing; S.touched = true; sfx.click(); render(); }
  else if (d.act === 'sec') runSecret(d.k);
  else if (d.act === 'check') {
    const res = S.order.map((p, s) => p === s);
    if (res.every(Boolean)) { S.phase = 'story'; S.stT = 0; S.stI = 0; S.sel = null; S.res = null; sfx.good(); }
    else { S.res = res; S.resAt = now(); S.tries++; sfx.bad(); }
    render(); showStage();
  }
  else if (d.act === 'mix') { newOrder(); S.tries = 0; sfx.click(); render(); }
  else if (d.act === 'show') { S.order = [0, 1, 2, 3, 4, 5]; S.res = null; sfx.snap(); render(); }
  else if (d.act === 'replay') { S.phase = 'story'; S.stT = 0; S.stI = 0; sfx.click(); render(); }
  else if (d.act === 'next') { S.phase = 'wall'; sfx.click(); render(); showStage(); }
  else if (d.act === 'die') { S.lk.died = true; S.lk.dieAt = now(); sfx.push(); render(); }
  else if (d.act === 'green') { S.lk.spr = true; S.lk.sprAt = now(); sfx.click(); render(); }
  else if (d.act === 'again') { S.lk = { asked: false, pick: null, opts: null, died: false, dieAt: 0, spr: false, sprAt: 0 }; S.phase = 'order'; newOrder(); S.tries = 0; sfx.click(); render(); }
});

// --- render: controls, readout and the state card for the current view -----------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('egWho').style.display = v === 'who' ? '' : 'none'; $('egSun').style.display = v === 'sun' ? '' : 'none'; $('egOs').style.display = v === 'osiris' ? '' : 'none';
  lab.setFacts(t.facts[v]);
  if (v === 'who') renderWho(t); else if (v === 'sun') renderSun(t); else renderOs(t);
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('egSec').innerHTML = sc('aten', '🔆') + sc('cats', '🐱');
}
const verdict = (ok, t) => `<div class="eg-v" style="color:${ok ? '#6fd68a' : '#ff9a80'}">${esc(ok ? t.right : t.no)}</div>`;
function renderWho(t) {
  const n = Object.keys(S.solved).length, h = HOT.find((x) => x.id === S.hot), w = t.who;
  $('whoSeasons').innerHTML = `<span class="eg-fine" style="margin:0 2px 0 0">${esc(w.season)}</span>` + SEASONS.map((k, i) => `<button class="chip ${S.season === i ? 'on' : ''}" data-season="${i}">${['🌊', '🌱', '🌾'][i]} ${esc(w.seasons[k][0])}</button>`).join('');
  lab.setReadout(`${n}/7`, t.found, '', '#e8b53a');
  let q;
  if (h) {
    const sol = S.solved[h.id];
    if (!S.opts[h.id]) S.opts[h.id] = shuffle([h.god, ...shuffle(GODIDS.filter((g) => g !== h.god)).slice(0, 2)]);
    q = (sol ? verdict(sol.ok, t) : '') + `<div class="eg-q">${esc(w.q(t.what[h.id]))}</div>` + cardsHTML(S.opts[h.id], h.god, sol && !sol.ok ? sol.pick : null, !!sol);
    if (sol && n < 7) q += `<div class="eg-fine">${esc(w.tapNext)} ${esc(w.rest(n))}</div>`;
  } else q = `<div class="eg-fine">${esc(n ? w.tapNext : w.tap)}</div>`;
  $('whoQ').innerHTML = q; paintBusts($('whoQ'));
  const k = Object.values(S.solved).filter((x) => x.ok).length;
  if (S.sec === 'aten') { const p = t.aten[S.secPh || 'p1']; lab.setState({ emo: '🔆', title: p[0], lead: p[1], body: '', extra: `<div class="eg-fine">${esc(t.aten.replay)}</div>` }); }
  else if (S.sec === 'cats') lab.setState({ emo: '🐱', title: t.cats.t, lead: t.cats.l, body: '', extra: '' });
  else if (S.msg === 'season') { const s = w.seasons[SEASONS[S.seasonMsg]]; lab.setState({ emo: ['🌊', '🌱', '🌾'][S.seasonMsg], title: `${s[0]}: ${s[1]}`, lead: s[2], body: w.seasonBody, extra: '' }); }
  else if (S.msg === 'end' && n === 7) lab.setState({ emo: '🏆', title: w.endT, lead: w.endL(k), body: '', extra: '' });
  else if (h && S.solved[h.id]) lab.setState({ emo: EMO[h.god], title: t.gn[h.god], lead: t.role[h.god], body: n < 7 ? w.rest(n) : '', extra: '' });
  else lab.setState({ emo: h ? '🤔' : '🔎', title: w.t, lead: w.lead, body: '', extra: '' });
}
function renderSun(t) {
  const s = t.sun, picked = S.sp !== null;
  $('sunC').style.display = picked ? '' : 'none';
  if (!picked) {
    $('sunQ').innerHTML = `<div class="eg-q">${esc(s.q)}</div>` + s.opts.map((o, i) => `<button class="eg-btn" style="display:block;width:100%;text-align:left;margin-bottom:8px;border-radius:14px" data-sp="${i}">${esc(o)}</button>`).join('');
    lab.setReadout('?', '', '', '#e8b53a'); lab.setState({ emo: '🤔', title: s.t, lead: s.lead, body: '', extra: '' });
    return;
  }
  const ok = S.sp === 1, ph = phaseOf(S.u);
  $('sunQ').innerHTML = verdict(ok, t) + `<div class="eg-q">${esc(s.q)}</div><div class="eg-fine" style="margin:0 0 4px">${esc(s.opts[S.sp])}</div>`;
  $('sunPlay').textContent = S.playing ? s.pause : s.play; $('sunL0').textContent = s.dawn; $('sunL1').textContent = s.night;
  lab.setReadout(esc(s.phn[ph]), '', '', '#e8b53a');
  const extra = `<div class="eg-fine">${esc(s.more)}</div>`;
  if (!S.touched) lab.setState({ emo: ok ? '🌙' : '🤔', title: ok ? s.okT : s.noT, lead: ok ? s.okL : s.noL, body: '', extra });
  else lab.setState({ emo: { dawn: '🌅', day: '☀️', eve: '🌇', night: '🌙' }[ph], title: s.ph[ph][0], lead: s.ph[ph][1], body: '', extra });
}
function renderOs(t) {
  const o = t.os, L = S.lk, btn = (act, label, main) => `<button class="eg-btn ${main ? 'main' : ''}" data-act="${act}">${esc(label)}</button>`;
  let q = '', b = '';
  if (S.phase === 'order') {
    lab.setReadout('6', o.pics, '', '#e8b53a');
    b = btn('check', o.check, true) + btn('mix', o.again) + (S.tries >= 2 ? btn('show', o.show) : '');
    const right = S.res ? S.res.filter(Boolean).length : 0;
    if (S.res) lab.setState({ emo: '🧩', title: o.wrongT, lead: o.wrongL(right), body: '', extra: '' });
    else lab.setState({ emo: '📖', title: o.t, lead: o.lead, body: '', extra: '' });
  } else if (S.phase === 'story') {
    const i = clamp(S.stI, 0, 5); lab.setReadout(`${i + 1}/6`, o.pics, '', '#e8b53a');
    lab.setState({ emo: '📖', title: `${i + 1}. ${o.capt[i]}`, lead: o.story[i], body: '', extra: '' });
  } else if (S.phase === 'done') {
    lab.setReadout('6/6', o.pics, '', '#e8b53a'); b = btn('replay', o.replay) + btn('next', o.next, true);
    lab.setState({ emo: '✅', title: o.goodT, lead: o.story[5], body: '', extra: '' });
  } else {
    lab.setReadout(L.pick ? esc(t.gn[L.pick]) : '?', '', '', '#e8b53a');
    if (!L.asked) { q = `<div class="eg-q">${esc(o.wallL)}</div>`; lab.setState({ emo: '🏛️', title: o.wallT, lead: o.wallL, body: '', extra: '' }); }
    else {
      const ok = L.pick === 'horus';
      q = (L.pick ? verdict(ok, t) : '') + `<div class="eg-q">${esc(o.q)}</div>` + cardsHTML(L.opts, 'horus', L.pick && !ok ? L.pick : null, L.pick !== null);
      if (L.pick) {
        b = (L.died ? '' : btn('die', o.die, true)) + (L.died && !L.spr ? btn('green', o.green, true) : '') + btn('again', o.again);
        if (L.spr) lab.setState({ emo: '🌱', title: o.greenT, lead: o.greenL, body: '', extra: '' });
        else if (L.died) lab.setState({ emo: '⚰️', title: o.dieT, lead: o.dieL, body: '', extra: '' });
        else lab.setState({ emo: '👑', title: ok ? o.okT : o.noT, lead: ok ? o.okL : o.noL, body: '', extra: '' });
      } else lab.setState({ emo: '🤔', title: o.wallT, lead: o.q, body: '', extra: '' });
    }
  }
  $('osQ').innerHTML = q; $('osBtns').innerHTML = b; paintBusts($('osQ'));
}
render();
</script>
