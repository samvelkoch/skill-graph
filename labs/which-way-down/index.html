    c.fillStyle = '#1f5f9c'; c.fill(cp);
    c.save(); c.clip(cp); c.strokeStyle = 'rgba(160,215,255,.55)'; c.lineWidth = 5; c.stroke(cp); c.restore();
    c.strokeStyle = 'rgba(40,70,50,.7)'; c.lineWidth = 0.8; c.stroke(cp);
  }
  // the river: a soft glow, then flowing dashes in the direction of the flow
  c.lineJoin = 'round'; c.lineCap = 'round';
  const path = new Path2D(); m.line.forEach((q, i) => (i ? path.lineTo(fx(q[0]), fy(q[1])) : path.moveTo(fx(q[0]), fy(q[1]))));
  c.strokeStyle = 'rgba(120,200,255,.35)'; c.lineWidth = 6; c.stroke(path);
  c.strokeStyle = '#8fd8ff'; c.lineWidth = 2.6; c.stroke(path);
  c.save(); c.strokeStyle = '#fff'; c.lineWidth = 1.6; c.setLineDash([2, 12]); c.lineDashOffset = -time * 16; c.stroke(path); c.restore();
  // the boat
  const at = riverAt(m, S.t), bxp = fx(at.lon), byp = fy(at.lat), ang = Math.atan2(-at.dy, at.dx);
  c.save(); c.translate(bxp, byp); c.rotate(ang); c.scale(1, 1);
  c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(0, 2, 10, 4, 0, 0, TAU); c.fill();
  g = c.createLinearGradient(0, -5, 0, 5); g.addColorStop(0, '#ffd24a'); g.addColorStop(1, '#e0793a');
  c.fillStyle = g; c.strokeStyle = '#7a3a18'; c.lineWidth = 1; c.beginPath(); c.moveTo(-9, -3); c.quadraticCurveTo(0, 6, 11, 0); c.quadraticCurveTo(0, -4, -9, -3); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-1, -2); c.lineTo(-1, -9); c.lineTo(6, -2); c.closePath(); c.fill();
  c.restore();
  c.restore();
  c.strokeStyle = 'rgba(190,210,255,.4)'; c.lineWidth = 1; rr(c, mx0, my0, mw, mh, 12); c.stroke();
  // north arrow
  const nx = mx0 + mw - 28;
  c.save(); c.fillStyle = 'rgba(10,12,20,.8)'; rr(c, nx, my0 + 6, 22, 34, 11); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(nx + 11, my0 + 10); c.lineTo(nx + 6, my0 + 22); c.lineTo(nx + 16, my0 + 22); c.closePath(); c.fill();
  c.font = FONT; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('N', nx + 11, my0 + 31); c.restore();
  // profile panel
  const px0 = bx + mapW + 12, px1 = w - M, pw = px1 - px0;
  if (pw < 60) return;
  if (!asked) { // nothing of the profile is drawn before the guess
    c.save(); c.strokeStyle = 'rgba(190,210,255,.3)'; c.setLineDash([5, 6]); c.lineWidth = 1.2; rr(c, px0, by, pw, bh, 14); c.stroke(); c.setLineDash([]);
    c.fillStyle = 'rgba(190,210,255,.5)'; c.font = '800 54px Nunito, system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', px0 + pw / 2, by + bh / 2); c.restore();
    return;
  }
  const r2 = T[lang].r, top = by + 34, bot = by + bh - 44, X0 = px0 + 4, XW = (pw - 8) * 0.88, Xs = px1 - 4;
  const Y = (v) => bot - (v - m.ymin) / (m.ymax - m.ymin) * (bot - top), XT = (t) => X0 + t * XW;
  // sea strip at the right end, sea-level line
  g = c.createLinearGradient(0, Y(m.h1), 0, bot); g.addColorStop(0, 'rgba(70,150,220,.85)'); g.addColorStop(1, 'rgba(20,70,130,.9)');
  c.fillStyle = g; c.fillRect(X0 + XW, Y(m.h1), Xs - X0 - XW, bot - Y(m.h1));
  const N = 60, hs = []; for (let i = 0; i <= N; i++) hs.push(m.height(i / N));
  const prof = new Path2D(); hs.forEach((v, i) => (i ? prof.lineTo(XT(i / N), Y(v)) : prof.moveTo(XT(0), Y(v))));
  const fillP = new Path2D(); hs.forEach((v, i) => (i ? fillP.lineTo(XT(i / N), Y(v)) : fillP.moveTo(XT(0), Y(v)))); fillP.lineTo(XT(1), bot); fillP.lineTo(XT(0), bot); fillP.closePath();
  g = c.createLinearGradient(0, top, 0, bot); g.addColorStop(0, '#b59a62'); g.addColorStop(1, '#6a5638');
  c.fillStyle = g; c.fill(fillP);
  c.save(); c.setLineDash([4, 5]); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1; c.beginPath(); c.moveTo(X0, Y(0)); c.lineTo(Xs, Y(0)); c.stroke(); c.restore();
  c.strokeStyle = '#8fd8ff'; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke(prof);
  c.save(); c.strokeStyle = '#fff'; c.lineWidth = 1.6; c.setLineDash([2, 12]); c.lineDashOffset = -time * 16; c.stroke(prof); c.restore();
  const hv = m.height(S.t), dx = XT(S.t), dy = Y(hv);
  c.save(); c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(dx, dy); c.lineTo(dx, bot); c.stroke(); c.restore();
  c.fillStyle = '#ffd24a'; c.strokeStyle = '#7a3a18'; c.lineWidth = 1.5; c.beginPath(); c.arc(dx, dy, 6, 0, TAU); c.fill(); c.stroke();
  const U = T[lang].u, hn = (v) => `≈ ${nf(Math.round(v / 10) * 10)} ${U.m}`;
  pill(c, `${r2.start[S.riv]} · ${nf(m.h0)} ${U.m}`, X0, top - 12, { align: 'left' });
  pill(c, `${r2.end[S.riv]} · ${nf(m.h1)} ${U.m}`, Xs, bot + 14, { align: 'right' });
  if (S.riv === 'nile') { const kt = m.tm, kv = m.hm; c.fillStyle = '#fff'; c.beginPath(); c.arc(XT(kt), Y(kv), 3.5, 0, TAU); c.fill(); if (Math.abs(S.t - kt) > 0.12) pill(c, `${r2.kh} ≈ ${nf(kv)} ${U.m}`, XT(kt) + 8, Y(kv) - 16, { align: 'left', alpha: 0.9 }); }
  pill(c, hn(hv), dx, dy + (dy < (top + bot) / 2 ? 20 : -20), { col: '#ffd24a' });
  c.save(); c.fillStyle = 'rgba(190,210,255,.8)'; c.font = '700 12px Nunito, system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(r2.axis, px0 + pw / 2, by + bh - 8);
  c.fillStyle = 'rgba(255,255,255,.7)'; c.textAlign = 'left'; c.fillText(r2.sea, X0 + 2, Y(0) - 8); c.restore();
}

// --- drawing: Scales -----------------------------------------------------------------------------------------
function scaleAt(c, H, label) { // a flat bathroom scale under the child, origin on the ground
  c.save(); c.scale(H, H);
  const g = c.createLinearGradient(-0.3, 0, 0.3, 0); g.addColorStop(0, '#f2f4fa'); g.addColorStop(1, '#aeb6cc');
  c.fillStyle = g; c.strokeStyle = '#6f7894'; c.lineWidth = 0.012; rr(c, -0.3, -0.07, 0.6, 0.07, 0.03); c.fill(); c.stroke();
  c.fillStyle = '#2a3150'; rr(c, -0.12, -0.055, 0.24, 0.035, 0.012); c.fill();
  c.restore();
}
const CHILD = { shirt: '#4fb0a5', pants: '#35405e', skin: '#f0c7a0', hair: '#5a3a24', ball: '#ffd24a' };
function drawScales(c, w, h, dt, time) {
  const asked = S.g3 !== null;
  S.k3 += ((asked ? 1 : 0) - S.k3) * Math.min(1, dt * 4);
  const R = Math.max(30, Math.min((h - 32) / 2.6, (w / 2 - 70) * 0.95)), Hc = 0.56 * R, cx = w / 2, cy = 1.6 * R + 16, k = lerp(1, 0.93, ease(S.k3));
  // the Earth, seen from the side with the axis upright (the bulge is exaggerated once the numbers are shown)
  c.save(); c.translate(cx, cy); c.scale(1, k); drawGlobe(c, 0, 0, R, 35, 0); c.restore();
  const ry = R * k;
  // the spin: the surface moves eastward, to the right as seen here
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  const sy0 = cy + 0.5 * ry, sx0 = cx - 0.5 * R, sx1 = cx + 0.5 * R;
  for (const [col, lw] of [['rgba(8,20,50,.55)', 5], ['rgba(255,255,255,.9)', 2.4]]) {
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = lw;
    c.beginPath(); c.moveTo(sx0, sy0); c.quadraticCurveTo(cx, sy0 + 0.16 * R, sx1, sy0); c.stroke();
    c.beginPath(); c.moveTo(sx1 + 3, sy0 + 1); c.lineTo(sx1 - 8, sy0 - 6); c.lineTo(sx1 - 7, sy0 + 7); c.closePath(); c.fill();
  }
  c.restore();
  // the probe on the outline (latitude slider)
  const lat = S.lat * D2R, qx = cx + R * Math.cos(lat), qy = cy - ry * Math.sin(lat);
  if (asked) { c.save(); c.globalAlpha = c01(S.k3 * 1.4); c.strokeStyle = 'rgba(255,224,138,.7)'; c.setLineDash([3, 5]); c.lineWidth = 1.4; c.beginPath(); c.moveTo(cx, cy); c.lineTo(qx, qy); c.stroke(); c.setLineDash([]); c.fillStyle = '#ffd24a'; c.strokeStyle = '#7a3a18'; c.lineWidth = 1.5; c.beginPath(); c.arc(qx, qy, 6, 0, TAU); c.fill(); c.stroke(); c.restore(); }
  // two scales: at the North Pole (top) and on the equator (right)
  const place = (x, y, ang) => { c.save(); c.translate(x, y); c.rotate(ang); scaleAt(c, Hc, ''); c.translate(0, -0.07 * Hc); fig(c, Hc, CHILD, 0, null); c.restore(); };
  place(cx, cy - ry, 0); place(cx + R, cy, Math.PI / 2);
  const t = T[lang].s, U = T[lang].u, shown = asked && S.k3 > 0.5;
  const rP = pill(c, t.np, cx - 16, cy - ry - Hc * 0.95, { align: 'right' });
  pill(c, shown ? `${nf(GR_NP)} ${U.g}` : `? ${U.g}`, cx - 16, rP.y + rP.h + 13, { align: 'right', col: shown && GR_NP > GR_EQ ? '#3ddc97' : '#EDEFF7', stroke: shown ? 'rgba(61,220,151,.6)' : null });
  const eqX = Math.min(cx + R + Hc * 0.5, w - 10), rE = pill(c, t.eq, eqX, cy + Hc * 0.55 + 14, { align: 'center' });
  pill(c, shown ? `${nf(GR_EQ)} ${U.g}` : `? ${U.g}`, eqX, rE.y + rE.h + 13, { align: 'center' });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  const v = lab.view;
  if (v === 'drop') drawDrop(c, w, h, dt, time); else if (v === 'rivers') drawRivers(c, w, h, dt, time); else drawScales(c, w, h, dt, time);
});

// --- turning the globe by hand (sideways drags only turn it round the pole; vertical swipes still scroll the page) --
{
  const cv = $('cv'); let drag = null;
  cv.addEventListener('pointerdown', (e) => { if (lab.view !== 'drop' || S.sec) return; drag = { x: e.clientX, lon: S.lon }; cv.setPointerCapture?.(e.pointerId); });
  cv.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const R = Math.max(30, Math.min((CH / 2 - 8) / 1.42, (CW / 2 - 8) / 1.45));
    S.lon = drag.lon - (e.clientX - drag.x) / R / D2R; S.lonT = S.lon;
  });
  const end = () => { drag = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}

// --- controls ------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'guess') {
    const i = +b.dataset.i, ok = T[lang][v === 'drop' ? 'd' : v === 'rivers' ? 'r' : 's'].ok;
    (i === ok ? sfx.good : sfx.bad)();
    if (v === 'drop') { S.g1 = i; S.dropAt = now() + 0.35; } else if (v === 'rivers') S.g2 = i; else S.g3 = i;
    render(); showStage(); return;
  }
  if (act === 'turn') { S.lonT = S.lon + 60; sfx.click(); return; }
  if (act === 'again') { S.dropAt = now() + 0.5; sfx.click(); return; }
  if (act === 'sec') { if (!secret.unlocked()) { secret.open(); return; } S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); render(); if (S.sec) showStage(); return; }
  if (act === 'ap') { S.ap = b.dataset.k; sfx.tick(); render(); return; }
  if (act === 'riv') { S.riv = b.dataset.k; S.t = 0; $('rs').value = 0; sfx.click(); render(); return; }
  if (act === 'lat') { S.lat = +b.dataset.v; $('ls').value = S.lat; sfx.tick(); renderScales(T[lang]); return; }
});
$('rs').addEventListener('input', (e) => { S.t = +e.target.value / 1000; renderRivers(T[lang]); });
$('ls').addEventListener('input', (e) => { S.lat = +e.target.value; renderScales(T[lang]); });

// --- one render per change: controls, readout, state card and facts -------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('sDrop').hidden = v !== 'drop'; $('sRiv').hidden = v !== 'rivers'; $('sSca').hidden = v !== 'scales';
  if (v === 'drop') renderDrop(t); else if (v === 'rivers') renderRivers(t); else renderScales(t);
}
function renderDrop(t) {
  const d = t.d, asked = S.g1 !== null, sec = S.sec;
  lab.setGlow('rgba(95, 168, 160, .26)');
  $('dAsk').innerHTML = askHTML(d.q, d.opts, S.g1, d.ok); $('dAsk').hidden = !!sec;
  $('dTurn').textContent = t.ui.turn; $('dTurn').hidden = !!sec;
  $('dAgain').textContent = t.ui.again; $('dAgain').hidden = !asked || !!sec;
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('dSecs').innerHTML = sc('anti', '🕳️') + sc('moon', '🌙'); $('dSecs').hidden = !asked;
  $('dPre').innerHTML = ['mad', 'bud', 'mos', 'syd'].map((k) => `<button class="chip ${S.ap === k ? 'on' : ''}" data-act="ap" data-k="${k}">${esc(t.places[k])}</button>`).join(''); $('dPre').hidden = sec !== 'anti';
  if (sec === 'anti') {
    const A = APLACES[S.ap], B = antipode(A), land = isLand(B.lon, B.lat);
    const U = t.u, coord = `${Math.abs(Math.round(B.lat))}° ${B.lat < 0 ? U.S : U.N}, ${Math.abs(Math.round(B.lon))}° ${B.lon < 0 ? U.W : U.E}`;
    lab.setReadout(`${Math.abs(Math.round(B.lat))}°`, coord, land ? t.an.land : t.an.sea, '#e0b050');
    lab.setState({ emo: '🕳️', title: t.an.title, lead: t.an.lead(t.places[S.ap], coord, land ? t.an.land : t.an.sea), body: S.ap === 'mad' ? t.an.spain : t.an.seaNote, extra: '' });
    lab.setFacts([]); return;
  }
  if (sec === 'moon') {
    lab.setReadout('🌙', '', '', '#8fb4ff');
    lab.setState({ emo: '🌙', title: t.mo.title, lead: t.mo.lead, body: t.mo.body, extra: `<a class="chip" href="../newton-cannon/?lang=${lang}">${esc(t.mo.link)}</a>` });
    lab.setFacts([]); return;
  }
  if (!asked) {
    lab.setReadout('?', '', '', '#5fa8a0');
    lab.setState({ emo: '🤔', title: d.pre[0], lead: d.pre[1], body: d.pre[2], extra: '' });
    lab.setFacts([]);
  } else {
    lab.setReadout('5', d.valSub, d.pill, '#5fa8a0');
    lab.setState({ emo: '⬇️', title: d.post[0], lead: d.post[1], body: d.post[2], extra: '' });
    lab.setFacts(t.facts.d(nf));

}
function renderRivers(t) {
  const r = t.r, asked = S.g2 !== null, m = MAPS[S.riv];
  const noteHTML = `<div class="fine">${esc(r.mapNote)}${' ' + esc(r.caspianNote)}</div>`;
  lab.setGlow('rgba(90, 160, 230, .26)');
  $('rAsk').innerHTML = askHTML(r.q, r.opts, S.g2, r.ok);
  $('rChips').innerHTML = ['nile', 'volga'].map((k) => `<button class="chip ${S.riv === k ? 'on' : ''}" data-act="riv" data-k="${k}">${esc(r.chips[k])}</button>`).join(''); $('rChips').hidden = !asked;
  $('rsl').textContent = r.slider; $('rs').setAttribute('aria-label', r.slider);

  const post = S.riv === 'nile' ? r.postN(nf(MAPS.nile.h0)) : r.postV(nf(MAPS.volga.h0), nf(-MAPS.volga.h1));
  lab.setState({ emo: '🏞️', title: post[0], lead: post[1], body: post[2], extra: noteHTML });
  lab.setFacts(S.riv === 'nile' ? t.facts.n(nf) : t.facts.v(nf));
}
function renderScales(t) {

  $('cCtl').hidden = !asked;
  $('lsl').textContent = s.slider; $('ls').setAttribute('aria-label', s.slider);
  $('cChips').innerHTML = [['eq', 0], ['np', 90]].map(([k, v]) => `<button class="chip ${S.lat === v ? 'on' : ''}" data-act="lat" data-v="${v}">${esc(s.chips[k])}</button>`).join('');
  if (+$('ls').value !== S.lat) $('ls').value = S.lat;
  if (!asked) {
    lab.setReadout('?', '', '', '#e0b050');

  lab.setState({ emo: '⚖️', title: post[0], lead: post[1], body: post[2], extra: `<div class="fine">${esc(s.fine)}</div>` });
  lab.setFacts(t.facts.s());
}
