// --- input --------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const pickGo = (k) => { S.go.sel = k; S.go.guess = null; S.go.mt = 0; sfx.click(); render(); };
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'go' || S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.u, y = (ev.clientY - r.top - G.oy) / G.u;
  let best = null, bd = 44 * 44;
  for (const [k, gx, gy] of GRID) { const d = (x - gx) ** 2 + (y - (gy - 16)) ** 2; if (d < bd) { bd = d; best = k; } }
  if (best) pickGo(best);
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k, g = S.go, tr = S.tr, rc = S.rc;
  if (a === 'pick') return pickGo(k);
  if (a === 'guess') {
    if (g.sel === null || g.guess !== null) return;
    g.guess = b.dataset.g; g.mt = 0; g.tries++;
    const ok = MODE[g.sel] === g.guess; if (ok) g.rights++;
    (ok ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (a === 'trpick') {
    if (tr.pick !== null || tr.i >= 5) return;
    tr.pick = k; tr.mt = 0; const ok = k === tr.order[tr.i]; if (ok) tr.right++;
    (ok ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (a === 'trnext') {
    if (tr.i >= 5) S.tr = newTracks(); else { tr.i++; tr.pick = null; tr.mt = 0; }
    sfx.click(); render(); return;
  }
  if (a === 'rpick') {
    const at = rc.picks.indexOf(k);
    if (at >= 0) rc.picks.splice(at, 1); else { rc.picks.push(k); if (rc.picks.length > 2) rc.picks.shift(); }
    Object.assign(rc, { guess: null, run: false, mt: 0, shown: false, done: false }); sfx.click(); render(); return;
  }
  if (a === 'rguess') {
    if (rc.picks.length < 2 || rc.guess !== null) return;
    rc.guess = b.dataset.g; rc.run = true; rc.mt = 0; rc.shown = false; rc.done = false; sfx.click(); render(); showStage(); return;
  }
  if (a === 'ragain') { Object.assign(rc, { guess: null, run: false, mt: 0, shown: false, done: false }); sfx.click(); render(); return; }

    if (!secret.unlocked()) return secret.open();

});

// --- one render per change: controls, readout and the state card ---------------------------------------------

  const open = secret.unlocked();

    + (S.sec ? `<button class="chip" data-act="pause">${esc(S.pause ? t.play : t.pause)}</button>` : '');
  if (S.sec) renderSec(t); else if (v === 'go') renderGo(t); else if (v === 'tracks') renderTracks(t); else renderRace(t);
}
const factOf = (k) => { const f = T[lang].facts[k]; return f ? [{ emo: f.e, text: f.text, src: f.src }] : []; };

function renderSec(t) {

}

function renderGo(t) {
  const g = S.go, k = g.sel, a = k && t.an[k], revealed = k && g.guess !== null, ok = revealed && MODE[k] === g.guess;
  lab.setGlow('rgba(95,160,90,.26)');
  $('goPick').innerHTML = KINDS.map((x) => `<button class="chip cc-chip ${x === k ? 'on' : ''}" data-act="pick" data-k="${x}">${EMO[x]} ${esc(t.an[x].c)}</button>`).join('');
  $('goQ').textContent = k ? t.go.q(a.n) : t.go.t0;
  $('goOpts').innerHTML = k ? MODES.map((m) => `<button class="cc-opt ${!revealed ? '' : m === MODE[k] ? 'good' : m === g.guess ? 'bad' : 'dim'}" data-act="guess" data-g="${m}"${revealed ? ' disabled' : ''}>${MODE_EMO[m]} ${esc(t.modes[m])}</button>`).join('') : '';
  const pill = g.tries ? t.go.pill(g.rights, g.tries) : '';
  if (!k) { lab.setReadout('?', t.go.sub0, pill, '#7fb55a'); lab.setState({ emo: '👆', title: t.go.t0, lead: t.go.l0, body: '', extra: '' }); lab.setFacts([]); return; }
  if (!revealed) { lab.setReadout('?', a.c, pill, '#7fb55a'); lab.setState({ emo: '🤔', title: t.go.q(a.n), lead: t.go.l1, body: '', extra: '' }); lab.setFacts([]); return; }
  lab.setReadout(esc(t.modes[MODE[k]]), a.c, pill, '#7fb55a');
  lab.setState({ emo: ok ? '✅' : '🤔', title: `${ok ? t.right : t.wrong} ${a.res}`, lead: a.how, body: ok ? '' : t.go.you(t.modes[g.guess]), extra: '' });
  lab.setFacts(factOf(k));
}

function renderTracks(t) {
  const tr = S.tr, end = tr.i >= 5, k = end ? null : tr.order[tr.i], picked = !end && tr.pick !== null, ok = picked && tr.pick === k;
  lab.setGlow('rgba(180,140,90,.26)');
  $('trQ').textContent = end ? '' : t.tr.q;
  $('trOpts').innerHTML = end ? '' : tr.opts[tr.i].map((x) => `<button class="cc-opt ${!picked ? '' : x === k ? 'good' : x === tr.pick ? 'bad' : 'dim'}" data-act="trpick" data-k="${x}"${picked ? ' disabled' : ''}>${EMO[x]} ${esc(t.an[x].c)}</button>`).join('');
  $('trNext').hidden = !(end || picked); $('trNext').textContent = end ? t.tr.again : t.tr.next;
  const pill = tr.i > 0 || picked ? t.tr.pill(tr.right) : '';
  if (end) { lab.setReadout(`${tr.right}/5`, '', '', '#d9a05a'); lab.setState({ emo: '🏆', title: t.tr.end(tr.right), lead: t.tr.endL, body: '', extra: '' }); lab.setFacts([]); return; }
  if (!picked) { lab.setReadout('?', t.tr.round(tr.i + 1, 5), pill, '#d9a05a'); lab.setState({ emo: '🔎', title: t.tr.q, lead: t.tr.l, body: '', extra: '' }); lab.setFacts([]); return; }
  lab.setReadout(EMO[k], t.an[k].c, pill, '#d9a05a');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: t.tr.t[k], body: ok ? '' : t.tr.you(t.an[tr.pick].n), extra: '' });
  lab.setFacts(factOf(k));
}

function renderRace(t) {
  const r = S.rc, n = r.picks.length, ready = n === 2, A = r.picks[0], B = r.picks[1];
  lab.setGlow('rgba(224,176,80,.22)');
  $('rcPick').innerHTML = RACERS.map((x) => `<button class="chip cc-chip ${r.picks.includes(x) ? 'on' : ''}" data-act="rpick" data-k="${x}">${EMO[x]} ${esc(t.an[x].c)}</button>`).join('');
  let w = null;
  if (ready) { const ts = r.picks.map((k) => RSPAN / RS[k]); w = Math.abs(ts[0] - ts[1]) < 0.05 ? 'T' : ts[0] < ts[1] ? 'A' : 'B'; }
  $('rcQ').textContent = ready ? t.rc.q : t.rc.pickT;
  const cls = (id) => (r.guess === null ? '' : !r.shown || w === 'T' ? (id === r.guess ? 'sel' : 'dim') : id === w ? 'good' : id === r.guess ? 'bad' : 'dim'); // the ant-beetle pair has invented equal speeds: no right or wrong
  $('rcOpts').innerHTML = ready ? [['A', `${EMO[A]} ${t.an[A].c}`], ['B', `${EMO[B]} ${t.an[B].c}`], ['T', `🤝 ${t.rc.same}`]]
    .map(([id, l]) => `<button class="cc-opt ${cls(id)}" data-act="rguess" data-g="${id}"${r.guess !== null ? ' disabled' : ''}>${esc(l)}</button>`).join('') : '';
  $('rcAgain').hidden = !r.shown; $('rcAgain').textContent = t.rc.again;
  if (!ready) { lab.setReadout('?', t.rc.pillPick(n), '', '#e0b050'); lab.setState({ emo: '🏁', title: t.rc.pickT, lead: t.rc.pickL, body: '', extra: '' }); lab.setFacts([]); return; }
  if (r.guess === null) { lab.setReadout('?', '', '', '#e0b050'); lab.setState({ emo: '🤔', title: t.rc.q, lead: `${EMO[A]} ${t.an[A].c} · ${EMO[B]} ${t.an[B].c}`, body: '', extra: '' }); lab.setFacts([]); return; }
  if (!r.shown) { lab.setReadout('🏁', '', '', '#e0b050'); lab.setState({ emo: '🏁', title: t.rc.runT, lead: t.rc.runL, body: '', extra: '' }); lab.setFacts([]); return; }
  if (w === 'T') { lab.setReadout('🤝', t.rc.same, '', '#e0b050'); lab.setState({ emo: '🤝', title: t.rc.tieT, lead: t.rc.tieL, body: t.rc.note, extra: '' }); lab.setFacts(r.picks.flatMap((k) => (FACT_KINDS.includes(k) ? factOf(k) : []))); return; }
  const wk = w === 'A' ? A : B, ok = r.guess === w;
  lab.setReadout(EMO[wk], t.an[wk].c, '', '#e0b050');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: t.rc.first(t.an[wk].n), body: t.rc.note, extra: '' });
  lab.setFacts(r.picks.flatMap((k) => (FACT_KINDS.includes(k) ? factOf(k) : [])));
}
render();
</script>
