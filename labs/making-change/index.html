function canon(p, m) {
  const out = []; let pos = p; const d = (10 - p % 10) % 10;
  if (d && pos + d <= m) { out.push(...SMALL[d]); pos += d; }
  for (const b of [50, 20, 10, 5, 2, 1]) while (pos + b <= m) { out.push(b); pos += b; }
  return out;
}

};

// --- drawing helpers ---------------------------------------------------------------------------------------
function pill(c, txt, x, y, o = {}) {

  const tw = c.measureText(txt).width + 18, ph = size + 10, px = clamp(x, 4 + tw / 2, W - 4 - tw / 2);
  c.fillStyle = o.bg ?? 'rgba(10, 14, 26, .84)'; c.strokeStyle = o.stroke ?? 'rgba(255, 255, 255, .14)'; c.lineWidth = 1;
  c.beginPath(); c.roundRect(px - tw / 2, y - ph / 2, tw, ph, ph / 2); c.fill(); c.stroke();

}
function numText(c, x, y, s, zeros, fs, col, zcol, emboss) {

  if (emboss) { c.fillStyle = emboss; c.fillText(a, x0 + 0.8, y + 1.5); c.fillText(b, x0 + wa + 0.8, y + 1.5); }
  c.fillStyle = col; c.fillText(a, x0, y + 0.6); c.fillStyle = zcol ?? col; c.fillText(b, x0 + wa, y + 0.6);
}
function drawCoin(c, x, y, r, v, o = {}) {

  if (o.shadow !== false) { c.fillStyle = 'rgba(0, 0, 0, .3)'; c.beginPath(); c.ellipse(x + r * 0.12, y + r * 0.82, r * 0.95, r * 0.32, 0, 0, PI2); c.fill(); }
  const g = c.createRadialGradient(x - r * 0.4, y - r * 0.45, r * 0.1, x, y, r * 1.1);
  g.addColorStop(0, shade(base, -0.5)); g.addColorStop(0.55, base); g.addColorStop(1, shade(base, 0.3));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, PI2); c.fill();
  c.lineWidth = Math.max(1, r * 0.09); c.strokeStyle = shade(base, 0.5); c.stroke();
  c.lineWidth = 1; c.strokeStyle = shade(base, 0.22); c.beginPath(); c.arc(x, y, r * 0.78, 0, PI2); c.stroke();
  c.lineCap = 'round'; c.lineWidth = Math.max(1, r * 0.1); c.strokeStyle = 'rgba(255, 255, 255, .6)';
  c.beginPath(); c.arc(x, y, r * 0.9, Math.PI * 1.08, Math.PI * 1.42); c.stroke();
  if (!o.nonum) numText(c, x, y, String(v), o.zeros ?? 0, o.fs ?? Math.max(r * 0.95, F(12)), shade(base, 0.6), o.zcol ?? null, shade(base, -0.55));

}

// people: head at (x, y), radius r; torso runs down to `by`
function face(c, x, y, r, mood, tnow, brow) {
  const blink = tnow % 4.3 > 4.18 ? 0.15 : 1;
  c.save(); c.lineCap = 'round'; c.globalAlpha = 1;
  c.fillStyle = 'rgba(231, 111, 81, .3)';
  for (const s of [-1, 1]) { c.beginPath(); c.arc(x + s * r * 0.58, y + r * 0.32, r * 0.17, 0, PI2); c.fill(); }
  for (const s of [-1, 1]) {
    const ex = x + s * r * 0.36, ey = y + r * 0.02;
    c.fillStyle = '#1e2233'; c.beginPath(); c.ellipse(ex, ey, r * 0.125, r * 0.15 * blink, 0, 0, PI2); c.fill();
    if (blink > 0.5) { c.fillStyle = '#fff'; c.beginPath(); c.arc(ex - r * 0.04, ey - r * 0.055, r * 0.048, 0, PI2); c.fill(); }
  }
  c.strokeStyle = brow; c.lineWidth = Math.max(1.6, r * 0.09);
  const br = mood === 'puzzled' ? [[-0.55, -0.3, -0.2, -0.46], [0.2, -0.28, 0.55, -0.22]] : mood === 'ooh' ? [[-0.5, -0.38, -0.22, -0.46], [0.22, -0.46, 0.5, -0.38]] : [[-0.52, -0.28, -0.2, -0.34], [0.2, -0.34, 0.52, -0.28]];
  for (const [a, b, d, e] of br) { c.beginPath(); c.moveTo(x + a * r, y + b * r); c.lineTo(x + d * r, y + e * r); c.stroke(); }
  c.strokeStyle = '#6b2f27'; c.lineWidth = Math.max(1.8, r * 0.1);
  if (mood === 'happy') {
    c.fillStyle = '#7a2a25'; c.beginPath(); c.arc(x, y + r * 0.3, r * 0.36, 0, Math.PI); c.closePath(); c.fill();
    c.fillStyle = '#e8837a'; c.beginPath(); c.ellipse(x, y + r * 0.56, r * 0.17, r * 0.08, 0, 0, PI2); c.fill();
  } else if (mood === 'ooh') {
    c.fillStyle = '#7a2a25'; c.beginPath(); c.ellipse(x, y + r * 0.5, r * 0.11, r * 0.15, 0, 0, PI2); c.fill();
  } else if (mood === 'puzzled') {
    c.beginPath(); c.moveTo(x - r * 0.28, y + r * 0.52); c.quadraticCurveTo(x - r * 0.12, y + r * 0.38, x, y + r * 0.52); c.quadraticCurveTo(x + r * 0.12, y + r * 0.66, x + r * 0.28, y + r * 0.5); c.stroke();
  } else { c.beginPath(); c.arc(x, y + r * 0.2, r * 0.34, Math.PI * 0.2, Math.PI * 0.8); c.stroke(); }
  c.restore();
}

  if (o.apron) {
    g = c.createLinearGradient(x - r, ty, x + r, o.by); g.addColorStop(0, '#fbf5e6'); g.addColorStop(1, '#e2d6b8');
    c.fillStyle = g; c.strokeStyle = '#a8956b'; c.lineWidth = 1.2; c.beginPath(); c.roundRect(x - r * 0.78, ty + r * 0.3, r * 1.56, o.by - ty - r * 0.3, [r * 0.3, r * 0.3, 0, 0]); c.fill(); c.stroke();
    c.strokeStyle = '#e76f51'; c.lineWidth = 2; c.beginPath(); c.moveTo(x - r * 0.5, ty + r * 0.3); c.lineTo(x - r * 0.62, ty); c.moveTo(x + r * 0.5, ty + r * 0.3); c.lineTo(x + r * 0.62, ty); c.stroke();
  }
  c.fillStyle = shade(sk, 0.1); c.fillRect(x - r * 0.28, y + r * 0.72, r * 0.56, r * 0.4);
  for (const s of [-1, 1]) { c.fillStyle = shade(sk, 0.04); c.strokeStyle = shade(sk, 0.35); c.lineWidth = 1.2; c.beginPath(); c.arc(x + s * r * 0.98, y + r * 0.1, r * 0.2, 0, PI2); c.fill(); c.stroke(); }
  g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.15); g.addColorStop(0, '#fbdcbc'); g.addColorStop(0.7, sk); g.addColorStop(1, '#dba67a');
  c.fillStyle = g; c.strokeStyle = shade(sk, 0.4); c.lineWidth = 1.6; c.beginPath(); c.arc(x, y, r, 0, PI2); c.fill(); c.stroke();
  if (o.cap) {
    g = c.createLinearGradient(x - r, y - r * 1.2, x + r, y); g.addColorStop(0, shade(o.cap, -0.18)); g.addColorStop(1, shade(o.cap, 0.2));
    c.fillStyle = g; c.strokeStyle = shade(o.cap, 0.4); c.lineWidth = 1.5; c.beginPath(); c.arc(x, y - r * 0.14, r * 1.04, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#f4ecdc'; c.strokeStyle = '#a8956b'; c.beginPath(); c.roundRect(x - r * 1.18, y - r * 0.2, r * 2.36, r * 0.3, r * 0.15); c.fill(); c.stroke();
    c.fillStyle = '#f4ecdc'; c.beginPath(); c.arc(x, y - r * 1.2, r * 0.12, 0, PI2); c.fill();
  }
  if (o.hair) {
    g = c.createLinearGradient(x - r, y - r, x + r, y); g.addColorStop(0, shade(o.hair, -0.15)); g.addColorStop(1, shade(o.hair, 0.2));
    c.fillStyle = g; c.strokeStyle = shade(o.hair, 0.4); c.lineWidth = 1.4;
    c.beginPath(); c.arc(x, y - r * 0.04, r * 1.04, Math.PI * 1.02, Math.PI * 1.98); c.quadraticCurveTo(x + r * 0.55, y - r * 0.5, x + r * 0.05, y - r * 0.42); c.quadraticCurveTo(x - r * 0.55, y - r * 0.6, x - r * 1.0, y - r * 0.1); c.closePath(); c.fill(); c.stroke();
  }
  face(c, x, y, r, o.mood, o.time, o.hair ? shade(o.hair, 0.2) : '#5b3a29');

// the stall: wall, posts, shelf with jars, `behind()` (a seller), awning, counter. y0 = top of the awning, ct = top of the counter
function stall(c, y0, ct, shelf, behind) {
  c.save(); c.globalAlpha = 1; c.lineJoin = 'round';
  const wt = y0 + 34;
  let g = c.createLinearGradient(0, wt, 0, ct); g.addColorStop(0, '#36425f'); g.addColorStop(1, '#212941');
  c.fillStyle = g; c.fillRect(24, wt, 312, ct - wt);
  c.strokeStyle = 'rgba(255, 255, 255, .05)'; c.lineWidth = 1; c.beginPath(); for (let x = 60; x < 336; x += 36) { c.moveTo(x, wt); c.lineTo(x, ct); } c.stroke();
  for (const px of [10, 336]) {
    g = c.createLinearGradient(px, 0, px + 14, 0); g.addColorStop(0, '#c58555'); g.addColorStop(1, '#8a5230');
    c.fillStyle = g; c.strokeStyle = '#5e3720'; c.lineWidth = 1.2; c.fillRect(px, y0 + 8, 14, ct + 40 - y0 - 8); c.strokeRect(px, y0 + 8, 14, ct + 40 - y0 - 8);
  }
  if (shelf) {
    const sy = (wt + ct) / 2 - 10;

    const cols = ['#d9b23a', '#6fae7a', '#e76f51', '#4cc9f0'], n = Math.floor((shelf[1] - shelf[0] - 4) / 24);

  }

  c.fillStyle = g; c.strokeStyle = '#5e3720'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(10, ct + 12, 340, 28, [0, 0, 6, 6]); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(0, 0, 0, .2)'; c.lineWidth = 1; c.beginPath(); for (let x = 66; x < 350; x += 56) { c.moveTo(x, ct + 14); c.lineTo(x, ct + 38); } c.stroke();
  g = c.createLinearGradient(4, ct, 356, ct); g.addColorStop(0, '#d79a68'); g.addColorStop(1, '#a96b3f');
  c.fillStyle = g; c.strokeStyle = '#5e3720'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(4, ct, 352, 14, 5); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(255, 255, 255, .35)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(10, ct + 2.5); c.lineTo(350, ct + 2.5); c.stroke();

// --- the number line with the jumping arcs ------------------------------------------------------------------
// g = { x0, x1, y, p, m, small }: p (price) at x0, m (money paid) at x1; list = the jumps taken
function drawLine(c, g, list, tnow, bounce, reached) {
  const { x0, x1, y, p, m, small } = g, rng = m - p, px = (v) => x0 + (v - p) / rng * (x1 - x0);
  const hOf = (span) => Math.min(small ? 26 : 60, small ? 8 + 16 * Math.pow(span / rng, 0.6) : 12 + 48 * Math.pow(span / rng, 0.7));
  c.save(); c.globalAlpha = 1; c.lineCap = 'round'; c.lineJoin = 'round';
  const bt = bounce ? tnow - bounce.t0 : 9, shk = bt >= 0 && bt < 0.9 ? Math.sin(bt * 50) * 3 * (1 - bt / 0.9) : 0;
  // line and ticks
  c.strokeStyle = '#8393b6'; c.lineWidth = small ? 3 : 4; c.beginPath(); c.moveTo(x0 - 10, y); c.lineTo(x1 + 16, y); c.stroke();
  c.strokeStyle = '#5d6d90'; c.lineWidth = 1.5; c.beginPath();
  for (let v = p; v <= m; v++) { const X = px(v), L = v % 10 === 0 ? (small ? 9 : 13) : v % 5 === 0 ? (small ? 7 : 9) : (small ? 3 : 5); c.moveTo(X, y + 2); c.lineTo(X, y + 2 + L); }
  c.stroke();
  c.font = `800 ${F(13)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#9db0d6';
  for (let v = p + 1; v < m; v++) if (v % 10 === 0) { const X = px(v); if (Math.abs(X - x0) > 30 && Math.abs(X - x1) > 30) c.fillText(v, X, y + (small ? 21 : 25)); }
  // the overshoot zone
  if (bt >= 0 && bt < 0.9) { c.strokeStyle = 'rgba(231, 111, 81, .55)'; c.lineWidth = 3; c.setLineDash([4, 5]); c.beginPath(); c.moveTo(x1 + 4, y); c.lineTo(x1 + 16, y); c.stroke(); c.setLineDash([]); }
  // sparkles at the goal
  if (reached) {
    const gl = c.createRadialGradient(x1, y, 2, x1, y, 30); gl.addColorStop(0, 'rgba(111, 174, 122, .6)'); gl.addColorStop(1, 'rgba(111, 174, 122, 0)');
    c.fillStyle = gl; c.beginPath(); c.arc(x1, y, 30, 0, PI2); c.fill();
  }
  // arcs
  const lbl = [];
  for (const j of list) {
    if (tnow < j.t0) continue;
    const e = ease(c01((tnow - j.t0) / j.dur)), xa = px(j.a), xb = px(j.b), h = hOf(j.b - j.a);
    c.strokeStyle = '#4cc9f0'; c.lineWidth = small ? 2.5 : 3.5; c.shadowColor = 'rgba(76, 201, 240, .55)'; c.shadowBlur = small ? 0 : 8;
    c.beginPath();
    for (let i = 0; i <= 24; i++) { const u = e * i / 24, X = lerp(xa, xb, u), Y = y - 4 * h * u * (1 - u); i ? c.lineTo(X, Y) : c.moveTo(X, Y); }
    c.stroke(); c.shadowBlur = 0;
    if (e >= 1) {
      c.save(); c.translate(xb, y); c.rotate(Math.atan2(4 * h, xb - xa)); c.fillStyle = '#4cc9f0';
      c.beginPath(); c.moveTo(0, 0); c.lineTo(-9, -4.5); c.lineTo(-9, 4.5); c.closePath(); c.fill(); c.restore();
      if (!small && j.b !== m && lbl.every((l) => Math.abs(l - xb) > 26)) { lbl.push(xb); pill(c, String(j.b), xb, y + 56, { fg: '#4cc9f0', size: 14 }); }
    }
    const pe = c01((tnow - j.t0 - j.dur * 0.45) / 0.3);
    if (pe > 0) {
      const rc = small ? 6.5 : clamp((xb - xa) * 0.42, 8, 12), sc = Math.max(0.01, back(pe));
      c.save(); c.translate((xa + xb) / 2, y - h); c.scale(sc, sc); drawCoin(c, 0, 0, rc, j.coin, { shadow: false, nonum: small }); c.restore();
    }
  }
  // endpoints
  const dot = (X, col) => {
    const gd = c.createRadialGradient(X - 2, y - 3, 1, X, y, 9); gd.addColorStop(0, shade(col, -0.5)); gd.addColorStop(1, col);
    c.fillStyle = gd; c.strokeStyle = shade(col, 0.5); c.lineWidth = 1.6; c.beginPath(); c.arc(X, y, small ? 6.5 : 8, 0, PI2); c.fill(); c.stroke();
  };
  dot(x0, '#f4ecdc'); dot(x1 + shk, '#6fae7a');
  pill(c, String(p), x0, y + (small ? 24 : 32), { size: 15, bg: 'rgba(244, 236, 220, .94)', fg: '#3b2a1c', stroke: '#a8956b' });
  pill(c, String(m), x1 + shk, y + (small ? 24 : 32), { size: 15, bg: '#4b8758', fg: '#fff', stroke: '#2f5d3a' });
  // the hopper
  let tv = p, th = 0, land = 9;
  for (const j of list) {
    if (tnow < j.t0) break;
    const e = c01((tnow - j.t0) / j.dur), ez = ease(e);
    tv = lerp(j.a, j.b, ez); th = 4 * hOf(j.b - j.a) * ez * (1 - ez);
    if (e < 1) { land = -1; break; }
    land = tnow - (j.t0 + j.dur);
  }
  const tx = px(tv), sq = land >= 0 && land < 0.18 ? 1 - 0.28 * Math.sin(land / 0.18 * Math.PI) : 1, tr = small ? 6.5 : 8.5;
  c.fillStyle = 'rgba(0, 0, 0, .35)'; c.beginPath(); c.ellipse(tx, y + 1, tr * (1 - th / 90), 2.4, 0, 0, PI2); c.fill();
  c.save(); c.translate(tx, y - tr - th); c.scale(1 / Math.sqrt(sq), sq);
  const hg = c.createRadialGradient(-tr * 0.35, -tr * 0.4, 1, 0, 0, tr * 1.2); hg.addColorStop(0, '#fffdf6'); hg.addColorStop(1, '#e3d6b6');
  c.fillStyle = hg; c.strokeStyle = '#a8956b'; c.lineWidth = 1.4; c.beginPath(); c.arc(0, 0, tr, 0, PI2); c.fill(); c.stroke();
  c.fillStyle = '#1e2233'; for (const s of [-1, 1]) { c.beginPath(); c.arc(s * tr * 0.38, -tr * 0.12, tr * 0.14, 0, PI2); c.fill(); }
  c.strokeStyle = '#6b2f27'; c.lineWidth = 1.2; c.beginPath(); c.arc(0, tr * 0.12, tr * 0.34, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
  c.restore();
  // too far: a red arc that bounces back
  if (bt >= 0 && bt < 0.9) {
    const xa = px(bounce.from), xb = Math.min(px(bounce.from + bounce.coin), x1 + 44), h = hOf(Math.min(bounce.coin, rng)) * 0.9;
    const u = bt < 0.3 ? ease(bt / 0.3) : bt < 0.45 ? 1 : 1 - ease((bt - 0.45) / 0.4);
    c.strokeStyle = '#e76f51'; c.lineWidth = small ? 2.5 : 3.5; c.beginPath();
    for (let i = 0; i <= 24; i++) { const uu = u * i / 24, X = lerp(xa, xb, uu), Y = y - 4 * h * uu * (1 - uu); i ? c.lineTo(X, Y) : c.moveTo(X, Y); }
    c.stroke();
    const ex = lerp(xa, xb, u), ey = y - 4 * h * u * (1 - u);
    c.lineWidth = 3; c.beginPath(); c.moveTo(ex - 5, ey - 5); c.lineTo(ex + 5, ey + 5); c.moveTo(ex + 5, ey - 5); c.lineTo(ex - 5, ey + 5); c.stroke();
  }
  if (reached) for (let i = 0; i < 6; i++) { const a = tnow * 1.6 + i * PI2 / 6, rr = 22 + 4 * Math.sin(tnow * 3 + i); spark(c, x1 + Math.cos(a) * rr, y - 6 + Math.sin(a) * rr * 0.7, 4 + (i % 2) * 2, 0.6 + 0.4 * Math.sin(tnow * 4 + i)); }
  c.restore();
}

// coins that landed on the counter (or in a hand)
function dropCoins(c, list, tnow, xa, xb, y, r0) {
  const n = list.length, sp = n > 1 ? Math.min(16, (xb - xa) / (n - 1)) : 0;
  list.forEach((j, i) => {
    const q = (tnow - (j.t0 + j.dur * 0.55)) / 0.3;
    if (q < 0) return;
    drawCoin(c, xa + i * sp, y - (1 - easeOut(c01(q))) * 26, r0 * RAD[j.coin], j.coin);
  });
}

// --- scenes ------------------------------------------------------------------------------------------------
function sceneJumps(c, tnow) {

    c.save(); c.fillStyle = 'rgba(244, 236, 220, .88)'; c.font = `900 ${F(64)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 180, 250); c.restore();
  } else {

  let g = c.createLinearGradient(0, 14, 0, 60); g.addColorStop(0, '#cf9060'); g.addColorStop(0.5, '#a96b3f'); g.addColorStop(1, '#7d4a28');
  c.fillStyle = 'rgba(0, 0, 0, .3)'; c.beginPath(); c.roundRect(82, 18, 200, 46, 10); c.fill();
  c.fillStyle = g; c.strokeStyle = '#5e3720'; c.lineWidth = 1.6; c.beginPath(); c.roundRect(80, 14, 200, 46, 10); c.fill(); c.stroke();

  c.save(); c.translate(shake, 0); c.globalAlpha = 1;
  g = c.createLinearGradient(0, 70, 0, 174); g.addColorStop(0, '#9a6640'); g.addColorStop(1, '#68421f');
  c.fillStyle = 'rgba(0, 0, 0, .3)'; c.beginPath(); c.roundRect(16, 76, 332, 104, 20); c.fill();
  c.fillStyle = g; c.strokeStyle = '#47280f'; c.lineWidth = 1.8; c.beginPath(); c.roundRect(14, 70, 332, 104, 20); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(244, 236, 220, .4)'; c.lineWidth = 1.2; c.setLineDash([5, 4]); c.beginPath(); c.roundRect(20, 76, 320, 92, 15); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#3b2412'; c.strokeStyle = 'rgba(0, 0, 0, .5)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(28, 84, 304, 76, 12); c.fill(); c.stroke();
  // coins, biggest first, in rows

  for (const q of sorted) { const w = 2 * r0 * RAD[q.v] + 3; if (rw[rw.length - 1] + w > 296 && rows[rows.length - 1].length) { rows.push([]); rw.push(0); } rows[rows.length - 1].push(q); rw[rw.length - 1] += w; }

// secret A: no 1 and 2 coins, so the price is rounded to the nearest 5
function sceneRound(c, tnow) {

  const lo = Math.floor(p / 5) * 5 - 5, px = (v) => 30 + (v - lo) / 15 * 300, y = 282;

  // the withdrawn coins
  for (const [v, x] of [[1, 44], [2, 84]]) {
    drawCoin(c, x, 206, 12, v, { shadow: false }); c.save(); c.globalAlpha = 0.55; c.fillStyle = '#17203a'; c.beginPath(); c.arc(x, 206, 12, 0, PI2); c.fill(); c.restore();
    c.strokeStyle = '#ff6b5e'; c.lineWidth = 3; c.beginPath(); c.moveTo(x - 9, 197); c.lineTo(x + 9, 215); c.moveTo(x + 9, 197); c.lineTo(x - 9, 215); c.stroke();
  }
  // the Hungarian flag
  for (let i = 0; i < 3; i++) { c.fillStyle = ['#cd2a3e', '#f4ecdc', '#436f4d'][i]; c.fillRect(306, 195 + i * 7, 36, 7); }
  c.strokeStyle = 'rgba(255, 255, 255, .35)'; c.lineWidth = 1; c.strokeRect(306, 195, 36, 21);
  c.strokeStyle = '#8393b6'; c.lineWidth = 4; c.beginPath(); c.moveTo(20, y); c.lineTo(340, y); c.stroke();
  for (let v = lo; v <= lo + 15; v++) {
    const X = px(v), five = v % 5 === 0;
    c.strokeStyle = five ? '#d9b23a' : '#5d6d90'; c.lineWidth = five ? 3 : 1.5; c.beginPath(); c.moveTo(X, y + 2); c.lineTo(X, y + (five ? 16 : 6)); c.stroke();
    if (five) { c.font = `800 ${F(14)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#f2d77a'; c.fillText(v, X, y + 30); }
  }
  const move = u < 0.2 ? 0 : u > 0.7 ? 1 : ease((u - 0.2) / 0.5), tv = lerp(p, r, move), h = 34 * 4 * move * (1 - move);
  c.fillStyle = 'rgba(0, 0, 0, .35)'; c.beginPath(); c.ellipse(px(tv), y + 1, 8, 2.4, 0, 0, PI2); c.fill();
  c.save(); c.translate(px(tv), y - 9 - h); const hg = c.createRadialGradient(-3, -4, 1, 0, 0, 11); hg.addColorStop(0, '#fffdf6'); hg.addColorStop(1, '#e3d6b6');
  c.fillStyle = hg; c.strokeStyle = '#a8956b'; c.lineWidth = 1.4; c.beginPath(); c.arc(0, 0, 8.5, 0, PI2); c.fill(); c.stroke();
  c.fillStyle = '#1e2233'; for (const s of [-1, 1]) { c.beginPath(); c.arc(s * 3.2, -1, 1.3, 0, PI2); c.fill(); } c.restore();
  if (u >= 0.7) for (let i = 0; i < 4; i++) spark(c, px(r) + Math.cos(tnow * 2 + i * 1.57) * 20, y - 14 + Math.sin(tnow * 2 + i * 1.57) * 12, 4, 0.6 + 0.4 * Math.sin(tnow * 4 + i));
  c.restore();
  if (u >= 0.2) pill(c, t.roundText(p, r), 190, 206, { size: 16, bg: 'rgba(217, 178, 58, .95)', fg: '#3b2a05', stroke: 'rgba(255, 255, 255, .3)' });
}

// secret B: 1 2 5 / 10 20 50 / 100 200 500
function scenePattern(c, tnow) {
  const t = tnow - S.secAt;
  panel(c, 10, 8, 340, 340);
  const xs = [82, 180, 278], ys = [66, 170, 274], vals = [[1, 2, 5], [10, 20, 50], [100, 200, 500]];
  vals.forEach((row, ri) => row.forEach((v, ci) => {
    const e = c01((t - (ri * 3 + ci) * 0.22) / 0.3);
    if (e <= 0) return;
    c.save(); c.translate(xs[ci], ys[ri]); const sc = Math.max(0.01, back(e)); c.scale(sc, sc); c.globalAlpha = 1;
    const z = ri;
    if (ri < 2) drawCoin(c, 0, 0, 30 * RAD[v], v, { zeros: z, zcol: '#b8341c', fs: ri ? 24 : 28 });
    else drawNote(c, 0, 0, 80, 42, v, 0, { zeros: z, zcol: '#b8341c', fs: 26 });
    c.restore();
  }));
  for (let ri = 1; ri < 3; ri++) if (t > (ri * 3) * 0.22 + 0.1) {
    c.save(); c.strokeStyle = 'rgba(244, 236, 220, .5)'; c.lineWidth = 2.5; c.lineCap = 'round'; c.setLineDash([2, 6]);
    c.beginPath(); c.moveTo(320, ys[ri - 1] + 18); c.quadraticCurveTo(342, (ys[ri] + ys[ri - 1]) / 2, 320, ys[ri] - 18); c.stroke(); c.restore();
    pill(c, '×10', 333, (ys[ri] + ys[ri - 1]) / 2, { size: 15, fg: '#f2d77a' });
  }
}

// --- the canvas ----------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h) => {
  SC = Math.min(w / W, h / H);
  const ox = (w - W * SC) / 2, oy = (h - H * SC) / 2, tnow = now(), v = lab.view;
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#192039'); bg.addColorStop(1, '#10152a');
  c.fillStyle = bg; c.strokeStyle = 'rgba(130, 145, 190, .22)'; c.lineWidth = 1; c.beginPath(); c.roundRect(0.5, 0.5, w - 1, h - 1, 22); c.fill(); c.stroke();
  c.save(); c.translate(ox, oy); c.scale(SC, SC);
  if (S.sec === 'round' && v === 'shop') sceneRound(c, tnow);
  else if (S.sec === 'pattern' && v === 'coins') scenePattern(c, tnow);
  else if (v === 'jumps') sceneJumps(c, tnow);
  else if (v === 'coins') sceneCoins(c, tnow);
  else sceneShop(c, tnow);
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------
const sumOf = (a) => a.reduce((x, y) => x + y.v, 0);
const sortedVals = (purse) => purse.map((q) => q.v).sort((a, b) => b - a);
// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
// one jump: refused (and bounced back) when it would pass the money paid
function addJump(list, p, m, coin, st) {
  const pos = posOf(list, p);
  if (pos + coin > m) { st.bounce = { from: pos, coin, t0: now() }; sfx.bad(); return false; }
  const prev = list[list.length - 1], t0 = Math.max(now(), prev ? prev.t0 + prev.dur : 0);
  list.push({ a: pos, b: pos + coin, coin, t0, dur: 0.5 }); sfx.click();
  if (pos + coin === m) setTimeout(() => sfx.good(), (t0 - now() + 0.5) * 1000);
  return true;
}
const shopTotal = (cu) => cu.it.reduce((a, k) => a + PRICE[k], 0);

function pickOpt(o) {
  if (lab.view === 'jumps') {
    if (S.jans !== null) return;
    const it = ITEMS[S.ji]; S.jans = +o; (S.jans === it.m - it.p ? sfx.good : sfx.bad)(); showStage();
  } else {
    if (S.cp.ans !== null) return;
    S.cp.ans = o; (o === '3' ? sfx.good : sfx.bad)(); showStage();
  }
}
function tapCoin(v) {
  const view = lab.view;
  if (view === 'jumps') {
    const it = ITEMS[S.ji]; if (S.jans === null || posOf(S.jumps, it.p) >= it.m) return;
    S.bounce = null; S.far = !addJump(S.jumps, it.p, it.m, v, S);
  } else if (view === 'coins') {
    const cp = S.cp, tg = TARGETS[cp.ti];
    if (cp.ans === null) return;
    if (sumOf(cp.purse) + v > tg) { cp.msg = 'far'; cp.shake = now(); sfx.bad(); }
    else if (cp.purse.length >= 16) { cp.msg = 'full'; cp.shake = now(); sfx.bad(); }
    else { cp.msg = ''; cp.purse.push({ v, t0: now() }); sfx.click(); if (sumOf(cp.purse) === tg) setTimeout(() => sfx.good(), 200); }
  } else {
    const sh = S.sh, cu = CUST[sh.ci]; if (sh.res !== null) return;
    sh.bounce = null; sh.far = !addJump(sh.jumps, shopTotal(cu), cu.m, v, sh);
  }
}
function give() {
  const sh = S.sh, cu = CUST[sh.ci], total = shopTotal(cu);
  if (sh.res === null) {
    if (!sh.jumps.length) return;
    sh.far = false; sh.bounce = null;
    if (posOf(sh.jumps, total) === cu.m) { sh.res = 'ok'; sh.right++; sfx.good(); }
    else {
      sh.res = 'bad'; sfx.bad(); sh.jumps = []; let p = total, t0 = now() + 0.3;
      for (const coin of canon(total, cu.m)) { sh.jumps.push({ a: p, b: p + coin, coin, t0, dur: 0.5 }); p += coin; t0 += 0.5; }
    }
  } else if (sh.ci === 4) { sh.ci = 0; sh.right = 0; sh.res = null; sh.jumps = []; sfx.click(); }
  else { sh.ci++; sh.res = null; sh.jumps = []; sfx.click(); }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, view = lab.view, cp = S.cp;
  if (act === 'opt') pickOpt(b.dataset.o);
  else if (act === 'coin') tapCoin(+b.dataset.v);
  else if (act === 'undo') {
    if (view === 'jumps') { S.jumps.pop(); S.far = false; S.bounce = null; }
    else if (view === 'coins') { cp.purse.pop(); cp.msg = ''; }
    else if (S.sh.res === null) { S.sh.jumps.pop(); S.sh.far = false; S.sh.bounce = null; }
    sfx.tick();
  } else if (act === 'next') { S.ji = (S.ji + 1) % ITEMS.length; S.jans = null; S.jumps = []; S.far = false; S.bounce = null; sfx.click(); }
  else if (act === 'save') {
    const vals = sortedVals(cp.purse);
    if (sumOf(cp.purse) === TARGETS[cp.ti] && !cp.ways[cp.ti].some((w) => w.coins.join() === vals.join())) { cp.ways[cp.ti].push({ coins: vals, t0: now() }); cp.purse = []; cp.msg = ''; sfx.good(); }
  } else if (act === 'empty') { cp.purse = []; cp.msg = ''; sfx.click(); }
  else if (act === 'nextA') { cp.ti = (cp.ti + 1) % TARGETS.length; cp.purse = []; cp.msg = ''; sfx.click(); }
  else if (act === 'give') give();
  else if (act === 'x') { S.sec = null; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'a') { lab.view = 'shop'; S.rd = S.sec === 'round' ? (S.rd + 1) % RD.length : 0; S.sec = 'round'; }
    else { lab.view = 'coins'; S.sec = 'pattern'; }
    S.secAt = now(); sfx.click(); lab.renderChrome();
  }
  render();
});

// --- one render per change: controls, readout and the state card ---------------------------------------------
const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
const askHTML = (q, opts, ans, ok, verdict) => `<div class="mc-q">${esc(q)}</div><div class="mc-opts">${opts.map((o) => {
  const s = String(o), cls = ans === null ? '' : s === String(ok) ? ' ok' : s === String(ans) ? ' bad' : ' dim';
  return `<button type="button" class="mc-opt${cls}" data-act="opt" data-o="${esc(s)}"${ans === null ? '' : ' disabled'}>${esc(s)}</button>`;
}).join('')}</div>${ans === null ? '' : `<div class="mc-verdict ${String(ans) === String(ok) ? 'ok' : 'bad'}">${esc(verdict)}</div>`}`;
const setMsg = (id, text, warn) => { const el = $(id); el.textContent = text; el.classList.toggle('warn', !!warn); };

function render() {
  const t = T[lang], v = lab.view, sc = S.sec;
  show('secJ', v === 'jumps'); show('secC', v === 'coins' && !sc); show('secS', v === 'shop' && !sc); show('secX', !!sc);
  document.querySelectorAll('[data-act=undo]').forEach((b) => { b.textContent = t.undo; });
  const un = secret.unlocked();
  $('secRow').innerHTML = [['a', '🇭🇺'], ['b', '🪙']].map(([k, emo]) => `<button type="button" class="chip mc-b secret ${un ? 'open' : ''} ${(k === 'a' && sc === 'round') || (k === 'b' && sc === 'pattern') ? 'on' : ''}" data-act="sec" data-k="${k}">${un ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sc) renderSecret(t); else if (v === 'jumps') renderJumps(t); else if (v === 'coins') renderCoins(t); else renderShop(t);
}
function renderJumps(t) {
  const it = ITEMS[S.ji], asking = S.jans === null, ch = it.m - it.p, item = t.items[it.k], q = t.jumpsAsk(item, it.p, it.m), st = t.st.jumps;
  const pos = posOf(S.jumps, it.p), tot = pos - it.p, reached = pos === it.m, path = pathText(stopsOf(it.p, it.m));
  lab.setGlow(GLOW.jumps);
  show('blkJ', !asking);
  $('askJ').style.marginTop = asking ? '0' : '';
  $('askJ').innerHTML = askHTML(q, optsOf(S.ji), S.jans, ch, S.jans === ch ? t.jumpsRight(path) : t.jumpsWrong);
  if (asking) { lab.setReadout('?', '', '', ACC.jumps); lab.setState({ emo: st[0], title: q, lead: '', body: '' }); lab.setFacts([]); return; }
  document.querySelectorAll('#secJ .mc-coin').forEach((b) => { b.disabled = reached; });
  $('nextJ').textContent = t.next; show('nextJ', reached);
  document.querySelector('#secJ [data-act=undo]').disabled = !S.jumps.length;
  setMsg('msgJ', S.far ? t.tooFar : `${t.costs(item, it.p)} ${t.pays(it.m)}`, S.far);
  lab.setReadout(String(tot), t.change, S.jumps.length ? pathText([it.p, ...S.jumps.map((j) => j.b)]) : '', ACC.jumps);
  lab.setState(reached ? { emo: '🎉', title: t.reached(tot), lead: st[3], body: '' } : { emo: st[0], title: st[1], lead: st[2], body: st[3] });
  lab.setFacts(t.facts.jumps);
}
function renderCoins(t) {
  const cp = S.cp, asking = cp.ans === null, tg = TARGETS[cp.ti], ways = cp.ways[cp.ti], sum = sumOf(cp.purse), st = t.st.coins;
  lab.setGlow(GLOW.coins);
  show('blkC', !asking); show('askC', cp.ti === 0);
  $('askC').style.marginTop = asking ? '0' : '';
  $('askC').innerHTML = askHTML(t.coinsAsk, t.coinsOpts, cp.ans, '3', cp.ans === '3' ? t.coinsRight : t.coinsWrong);
  if (asking) { lab.setReadout('?', '', '', ACC.coins); lab.setState({ emo: st[0], title: t.coinsAsk, lead: '', body: '' }); lab.setFacts([]); return; }
  const dup = sum === tg && ways.some((w) => w.coins.join() === sortedVals(cp.purse).join());
  $('saveC').textContent = t.newWay; $('saveC').disabled = sum !== tg || dup;
  $('emptyC').textContent = t.emptyPurse; $('emptyC').disabled = !cp.purse.length;
  $('nextA').textContent = t.nextA;
  document.querySelector('#secC [data-act=undo]').disabled = !cp.purse.length;
  const msg = cp.msg === 'far' ? t.tooFar : cp.msg === 'full' ? t.full : dup ? t.dup : '';
  setMsg('msgC', msg, !!msg);
  lab.setReadout(t.ways(ways.length), '', ways.length ? t.fewest(Math.min(...ways.map((w) => w.coins.length))) : '', ACC.coins);
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] });
  lab.setFacts(t.facts.coins);
}
function renderShop(t) {
  const sh = S.sh, cu = CUST[sh.ci], st = t.st.shop, last = sh.ci === 4 && sh.res !== null;
  lab.setGlow(GLOW.shop);
  document.querySelectorAll('#secS .mc-coin').forEach((b) => { b.disabled = sh.res !== null; });
  document.querySelector('#secS [data-act=undo]').disabled = sh.res !== null || !sh.jumps.length;
  $('giveS').textContent = sh.res === null ? t.give : last ? t.again : t.nextC; $('giveS').disabled = sh.res === null && !sh.jumps.length;
  setMsg('msgS', sh.far ? t.tooFar : sh.res === 'ok' ? t.thanks : sh.res === 'bad' ? t.hmm : t.custPays(cu.m), sh.far || sh.res === 'bad');
  lab.setReadout(`<span class="mc-val">${esc(t.customer(sh.ci + 1))}</span>`, '', t.rightN(sh.right), ACC.shop);
  lab.setState(last ? { emo: '🏆', title: t.endShop(sh.right), lead: st[3], body: '' }
    : sh.res === 'ok' ? { emo: '😊', title: t.thanks, lead: st[3], body: '' }
    : sh.res === 'bad' ? { emo: '🤔', title: t.hmm, lead: '', body: '' }
    : { emo: st[0], title: st[1], lead: st[2], body: st[3] });
  lab.setFacts(t.facts.shop);
}
function renderSecret(t) {
  if (S.sec === 'round') {
    const p = RD[S.rd], r = Math.round(p / 5) * 5;
    lab.setGlow(GLOW.shop); lab.setReadout(t.roundText(p, r), '', '', ACC.shop);
    lab.setState({ emo: '🇭🇺', title: t.secrets.a[0], lead: t.secrets.a[1], body: '' }); lab.setFacts(t.facts.shop);
  } else {
    lab.setGlow(GLOW.coins); lab.setReadout('1 · 2 · 5', '', '', ACC.coins);
    lab.setState({ emo: '🪙', title: t.secrets.b[0], lead: t.secrets.b[1], body: '' }); lab.setFacts(t.facts.coins);
  }
}
render();
</script>
