  c.lineCap = 'round'; c.strokeStyle = darken(sand, .42); c.lineWidth = 28; c.beginPath(); c.moveTo(218, 160); c.quadraticCurveTo(250, 150, 262, 100); c.stroke();
  c.strokeStyle = sand; c.lineWidth = 24; c.stroke();
  blob(c, 283, 90, 23, 14, sand, 0, .25); blob(c, 301, 97, 10, 8.5, '#e2bd8b', 0, .2, 1.2); blob(c, 270, 77, 5, 8, sand, 0, -.3);
  eye(c, 281, 85, 2.8, 3.2); blob(c, 306, 94, 2.4, 1.8, '#2a2020', 0, 0, 0);
  if (Hp.ans === null) { // an opaque cover over the hump
    c.fillStyle = '#2a2f55'; c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.beginPath(); c.arc(150, 130, 19, 0, 6.3); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.font = '900 24px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 150, 131);
  } else {
    const k = smooth(Hp.rt), rr = 23 * k;
    const fg = c.createRadialGradient(145, 124, 2, 150, 130, 26); fg.addColorStop(0, '#fff6d0'); fg.addColorStop(1, '#efd085');
    c.fillStyle = fg; c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.ellipse(150, 130, Math.max(.1, rr), Math.max(.1, rr * .95), 0, 0, 6.3); c.fill(); c.stroke();
    c.fillStyle = 'rgba(205,150,50,.35)'; for (let i = 0; i < 9; i++) { c.beginPath(); c.arc(150 + Math.cos(i * 2.4) * rr * .55, 130 + Math.sin(i * 2.4) * rr * .5, 3.2 * k, 0, 6.3); c.fill(); }
    if (k > .6) pill(c, T[lang].hp.fat, 150, 86, { f: 14, bg: 'rgba(120,90,30,.92)' });
  }
  c.restore();
}

// --- secret: desert day and night --------------------------------------------------------------------------
const dayTemp = (h) => 21 + 19 * Math.sin((h - 9) / 24 * 2 * Math.PI);
const fmtH = (h) => `${String(Math.floor(h)).padStart(2, '0')}:${h % 1 ? '30' : '00'}`;
function drawDay(c, dt) {
  const D_ = S.day, h = D_.h, tmp = dayTemp(h), d = Math.max(0, Math.sin(Math.PI * (h - 6) / 12)), nk = 1 - Math.sqrt(d);
  D_.out += (clamp((30 - tmp) / 8, 0, 1) - D_.out) * Math.min(1, dt * 4);
  const o = D_.out, tw = Math.max(0, 1 - Math.abs(d - .15) / .15) * .7;
  c.save(); c.beginPath(); c.roundRect(0, 0, W, H, 16); c.clip();
  const top = mixHex('#070c26', '#4aa0e6', Math.pow(d, .6)), bot = mixHex(mixHex('#161c44', '#f9e2b0', Math.pow(d, .6)), '#f39a5a', tw);
  const sg = c.createLinearGradient(0, 0, 0, 220); sg.addColorStop(0, top); sg.addColorStop(1, bot); c.fillStyle = sg; c.fillRect(0, 0, W, H);
  if (nk > .4) { c.fillStyle = `rgba(255,255,255,${(nk - .4) * 1.4})`; for (let i = 0; i < 20; i++) { c.beginPath(); c.arc((i * 83) % W, 12 + (i * 37) % 110, 1.2 + (i % 3) * .4, 0, 6.3); c.fill(); } }
  const dh = ((h - 6 + 24) % 24), isDay = dh < 12, ph = (isDay ? dh : dh - 12) / 12, bx = 36 + ph * 268, by = 190 - Math.sin(Math.PI * ph) * 130;
  if (isDay) {
    const sn = c.createRadialGradient(bx, by, 3, bx, by, 44); sn.addColorStop(0, 'rgba(255,250,210,1)'); sn.addColorStop(.3, 'rgba(255,215,100,.95)'); sn.addColorStop(1, 'rgba(255,215,100,0)');
    c.fillStyle = sn; c.beginPath(); c.arc(bx, by, 44, 0, 6.3); c.fill();
  } else {
    c.fillStyle = '#eef0f8'; c.beginPath(); c.arc(bx, by, 14, 0, 6.3); c.fill(); c.fillStyle = top; c.beginPath(); c.arc(bx + 6, by - 3, 12, 0, 6.3); c.fill();
  }
  const dim = (hx) => mixHex(hx, '#0b1030', nk * .62);
  c.fillStyle = dim('#d9a867'); c.beginPath(); c.moveTo(0, 190); c.bezierCurveTo(70, 150, 150, 200, 230, 172); c.bezierCurveTo(280, 156, 310, 176, W, 162); c.lineTo(W, 260); c.lineTo(0, 260); c.fill();
  const mg = c.createLinearGradient(0, 200, 0, H); mg.addColorStop(0, dim('#e8bd76')); mg.addColorStop(1, dim('#c58d4b')); c.fillStyle = mg;
  c.beginPath(); c.moveTo(0, 226); c.bezierCurveTo(70, 196, 150, 214, 220, 222); c.bezierCurveTo(270, 228, 310, 212, W, 206); c.lineTo(W, H); c.lineTo(0, H); c.fill();
  c.fillStyle = '#2a1f2a'; c.beginPath(); c.ellipse(92, 236, 17, 9, 0, 0, 6.3); c.fill();
  c.fillStyle = dim('#8a7a78'); c.strokeStyle = dim('#5a4a4c'); c.lineWidth = 1.6; c.beginPath(); c.ellipse(255, 236, 28, 19, 0, 0, 6.3); c.fill(); c.stroke();
  c.fillStyle = `rgba(30,18,40,${.1 + .3 * d})`; c.beginPath(); c.ellipse(282, 252, 38, 8, 0, 0, 6.3); c.fill();
  // lizard: in the shade by day, in the open at night
  const lx = lerp(280, 205, o), ly = lerp(250, 268, o);
  blob(c, lx, ly - 5, 13, 5.5, '#7da05a', 0); blob(c, lx + 14, ly - 6.5, 5.5, 4.2, '#8ab464', 0); eye(c, lx + 16, ly - 8, 1.3, 1.5);
  c.strokeStyle = '#6a8c4c'; c.lineWidth = 3; c.beginPath(); c.moveTo(lx - 12, ly - 5); c.quadraticCurveTo(lx - 26, ly - 2, lx - 30, ly - 9); c.stroke();
  c.lineWidth = 2; c.beginPath(); for (const a of [-6, 6]) { c.moveTo(lx + a, ly - 2); c.lineTo(lx + a - 2, ly + 2); } c.stroke();
  // fennec fox: asleep in its burrow by day
  const fs = .62 * smooth(o * 2.5);
  if (fs > .02) { const fx2 = lerp(92, 150, o), fy2 = lerp(236, 268, o); shadow(c, fx2, fy2 + 1, 24 * fs / .62, .3); drawFox(c, 2, fx2, fy2, fs); }
  if (o < .6) pill(c, 'Zzz', 92, 214, { f: 14 });
  if (nk > .1) { c.fillStyle = `rgba(10,18,60,${.3 * nk})`; c.fillRect(0, 150, W, 150); }
  pill(c, fmtT(Math.round(tmp)), 48, 24, { f: 16 });
  c.restore();
}

// --- main loop and pointer ---------------------------------------------------------------------------------
const V = { s: 1, ox: 0, oy: 0 };
const camOn = () => !S.sec && S.cam && ((lab.view === 'foxes' && S.fx.checked) || (lab.view === 'huddle' && S.hd.ans !== null));
canvasLoop($('cv'), (c, w, h, dt, time) => {
  NOW = time;
  const s = Math.min(w / W, h / H); V.s = s; V.ox = (w - W * s) / 2; V.oy = (h - H * s) / 2;
  HK += ((camOn() ? 1 : 0) - HK) * Math.min(1, dt * 5);
  c.save(); c.translate(V.ox, V.oy); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (S.sec === 'hump') drawHump(c, dt);
  else if (S.sec === 'day') drawDay(c, dt);
  else if (v === 'foxes') {
    const bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#1a2140'); bg.addColorStop(1, '#262f58'); c.fillStyle = bg; c.beginPath(); c.roundRect(0, 0, W, H, 16); c.fill();
    drawFoxes(c, dt);
  } else if (v === 'ice') drawIce(c, dt, time);
  else drawHuddle(c, dt);
  c.restore();
  if (v === 'ice' && !S.sec && S.gl.run && Math.floor(S.gl.t) !== S.gl.shown) render();
  if (v === 'huddle' && !S.sec) { const pct = Math.round(S.hd.avg * 100); if (pct !== S.hd.shown) { S.hd.shown = pct; hdReadout(); } }
});

const cv = $('cv');
const pt = (ev) => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left - V.ox) / V.s, y: (ev.clientY - r.top - V.oy) / V.s }; };
function place(i, pa) {
  const F = S.fx, o = F.pl.indexOf(pa); if (o >= 0 && o !== i) F.pl[o] = -1;
  F.pl[i] = pa; F.sel = -1; sfx.snap();
}
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'foxes' || S.sec || S.fx.checked) return;
  const F = S.fx, p = pt(ev); let hit = -1;
  for (let i = 2; i >= 0; i--) { const q = F.pos[i]; if (Math.abs(p.x - q.x) < 34 * q.s && p.y < q.y + 8 && p.y > q.y - 112 * q.s) { hit = i; break; } }
  F.down = { x: p.x, y: p.y, px: p.x, py: p.y, moved: false };
  if (hit >= 0) { F.drag = { i: hit, dx: F.pos[hit].x - p.x, dy: F.pos[hit].y - p.y }; try { cv.setPointerCapture(ev.pointerId); } catch { /* no capture */ } }
});
cv.addEventListener('pointermove', (ev) => {
  const F = S.fx; if (!F.down) return;
  const p = pt(ev); F.down.px = p.x; F.down.py = p.y;
  if (Math.hypot(p.x - F.down.x, p.y - F.down.y) > 8) F.down.moved = true;
  if (F.drag && F.down.moved) { const q = F.pos[F.drag.i]; q.x = p.x + F.drag.dx; q.y = p.y + F.drag.dy; q.s = 1; q.up = 0; }
});
function pointerEnd(ev, cancel) {
  const F = S.fx; if (!F.down) return;
  const p = pt(ev), d = F.drag, moved = F.down.moved;
  F.drag = null; F.down = null;
  if (cancel) { render(); return; }
  if (d) {
    if (moved) { const pa = panelAt(p.x, p.y); if (pa >= 0) place(d.i, pa); else { F.pl[d.i] = -1; sfx.tick(); } }
    else if (F.sel >= 0 && F.sel !== d.i && F.pl[d.i] >= 0) place(F.sel, F.pl[d.i]);
    else { F.sel = F.sel === d.i ? -1 : d.i; sfx.click(); }
  } else if (F.sel >= 0) { const pa = panelAt(p.x, p.y); if (pa >= 0) place(F.sel, pa); else F.sel = -1; }
  render();
}
cv.addEventListener('pointerup', (ev) => pointerEnd(ev, false));
cv.addEventListener('pointercancel', (ev) => pointerEnd(ev, true));

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, F = S.fx;
  if (act === 'pick') {
    const w = b.dataset.w, i = +b.dataset.i, ok = i === 1;
    if (w === 'gl') { if (S.gl.ans !== null) return; S.gl.ans = i; S.gl.t = 0; S.gl.run = true; S.gl.shown = -1; }
    else if (w === 'hd') { if (S.hd.ans !== null) return; S.hd.ans = i; setHuddle(); S.cam = true; }
    else { if (S.hp.ans !== null) return; S.hp.ans = i; S.hp.rt = 0; }
    (ok ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (act === 'cam') { S.cam = !S.cam; sfx.click(); }
  else if (act === 'fxcheck') {
    if (F.pl.some((p) => p < 0)) return;
    F.right = F.pl.filter((p, i) => p === HOME[i]).length; F.pl = HOME.slice(); F.checked = true; F.sel = -1; S.cam = true; F.cur = 2;
    (F.right === 3 ? sfx.good : sfx.bad)(); render(); showStage(); return;
  } else if (act === 'fxagain') { F.pl = [-1, -1, -1]; F.checked = false; F.sel = -1; F.gl = 0; sfx.click(); }
  else if (act === 'fxsel') { F.cur = +b.dataset.k; sfx.tick(); }
  else if (act === 'card') { S.gl.card = +b.dataset.k; sfx.click(); }
  else if (act === 'hd') { if (b.dataset.m === 'huddle') setHuddle(); else setSpread(); sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'hump') { S.hp.ans = null; S.hp.rt = 0; } else { S.day.h = 12; S.day.out = 0; } }
    sfx.click(); showStage();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'fxT') S.fx.temp = v;
  else if (id === 'glT') { S.gl.t = v; S.gl.run = false; }
  else if (id === 'dyT') S.day.h = v;
  else return;
  render();
});

// --- one render per change: controls, readout and the state card -------------------------------------------
const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, unlocked = secret.unlocked();
  document.body.dataset.v = sec || v;
  show('hcFoxes', !sec && v === 'foxes'); show('hcIce', !sec && v === 'ice'); show('hcHud', !sec && v === 'huddle');
  show('hcHump', sec === 'hump'); show('hcDay', sec === 'day');
  cv.style.touchAction = !sec && v === 'foxes' && !S.fx.checked ? 'none' : 'pan-y';
  $('secRow').innerHTML = [['hump', '🐫'], ['day', '🌗']].map(([k, e]) => `<button type="button" class="chip secret ${unlocked ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${unlocked ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec === 'hump') renderHump(t); else if (sec === 'day') renderDay(t);
  else if (v === 'foxes') renderFoxes(t); else if (v === 'ice') renderIce(t); else renderHuddle(t);
}
function askHtml(q, opts, ans, yes, no, w) {
  const done = ans !== null;
  return `<div class="hc-q">${esc(q)}</div><div class="chips">${opts.map((o, i) => `<button type="button" class="chip hc-opt${done && i === 1 ? ' good' : done && i === ans ? ' bad' : ''}" data-act="pick" data-w="${w}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>${done ? `<div class="hc-verdict ${ans === 1 ? 'ok' : 'no'}">${esc(ans === 1 ? yes : no)}</div>` : ''}`;
}
function camChip(id, label, locked) {
  const b = $(id); b.disabled = locked; b.className = `chip${!locked && S.cam ? ' on' : ''}`;
  b.textContent = locked ? `🔒 📷 ${label}` : `📷 ${label}`;
}

function renderFoxes(t) {
  const F = S.fx, X = t.fx, placed = F.pl.filter((p) => p >= 0).length;
  lab.setGlow('rgba(240,138,58,.26)');
  $('fxAsk').innerHTML = F.checked
    ? `<div class="hc-verdict ${F.right === 3 ? 'ok' : 'no'}" style="margin-top:0">${esc(F.right === 3 ? t.right : X.part(F.right))}</div><div class="hc-mini">${esc(F.right === 3 ? X.okLead : X.partLead)}</div>`
    : `<div class="hc-q">${esc(X.ask)}</div><div class="hc-mini">${esc(X.placed(placed))}</div>`;
  $('fxCheck').textContent = X.check; $('fxCheck').disabled = placed < 3; show('fxCheck', !F.checked);
  $('fxAgain').textContent = `↻ ${X.again}`; show('fxAgain', F.checked);
  camChip('camF', X.cam, !F.checked);
  show('fxPlay', F.checked);
  $('fxChips').innerHTML = X.names.map((n, i) => `<button type="button" class="chip${F.cur === i ? ' on' : ''}" data-act="fxsel" data-k="${i}">${esc(n)}</button>`).join('');
  $('fxLbl').innerHTML = `${esc(X.tempLbl)}: <b>${esc(fmtT(F.temp))}</b>`;
  if (+$('fxT').value !== F.temp) $('fxT').value = F.temp;
  if (!F.checked) {
    lab.setReadout(`${placed}/3`, '', '', '#f08a3a');
    lab.setState({ emo: '🦊', title: X.s0[0], lead: X.s0[1], body: '', extra: '' });
  } else {
    const stt = foxStatus(F.cur, F.temp), [lo, hi] = foxRange(F.cur);
    lab.setReadout(esc(fmtT(F.temp)), X.names[F.cur], '', '#f08a3a');
    lab.setState({ emo: ['🥶', '😊', '🥵'][stt], title: `${X.names[F.cur]}: ${X.status[stt]}`, lead: X.lead, body: X.range(fmtT(lo).replace(' °C', ''), fmtT(hi).replace(' °C', '')), extra: '' });
  }
  lab.setFacts(t.facts.fox);
}

function renderIce(t) {
  const G = S.gl, X = t.gl, ans = G.ans !== null;
  lab.setGlow('rgba(94,200,240,.26)');
  $('glAsk').innerHTML = askHtml(X.ask, X.opts, G.ans, t.right, X.no, 'gl'); show('glAsk', !ans || true);
  show('glRun', ans);
  $('glCards').innerHTML = [['🖐️', 0], ['🐻‍❄️', 1], ['🦭', 2]].map(([e, k]) => `<button type="button" class="chip${G.card === k ? ' on' : ''}" data-act="card" data-k="${k}">${e} ${esc(X.cards[k])}</button>`).join('');
  const ti = Math.round(G.t); G.shown = Math.floor(G.t);
  $('glLbl').innerHTML = `${esc(X.time)}: <b>${ti} ${esc(X.unit)}</b>`;
  show('glT', !G.card);  if (+$('glT').value !== ti) $('glT').value = ti; $('glLbl').style.display = G.card ? 'none' : '';
  const tb = skinT(ti, false), tg = skinT(ti, true);
  if (!ans) {
    lab.setReadout('?', '', '', '#5ec8f0'); lab.setState({ emo: '🧊', title: X.s0[0], lead: X.s0[1], body: '', extra: '' }); lab.setFacts([]);
  } else if (G.card) {
    lab.setReadout(`${ti} ${esc(X.unit)}`, X.sub(tb, tg), '', '#5ec8f0'); lab.setState({ emo: G.card === 1 ? '🐻‍❄️' : '🦭', title: X.animals[G.card][0], lead: X.animals[G.card][1], body: '', extra: '' }); lab.setFacts(t.facts.ice);
  } else {
    const [title, lead] = ti === 0 ? X.run0 : X.run(ti, tb, tg);
    lab.setReadout(`${ti} ${esc(X.unit)}`, X.sub(tb, tg), '', '#5ec8f0'); lab.setState({ emo: '🧤', title, lead, body: '', extra: '' }); lab.setFacts(t.facts.ice);
  }
}

function hdReadout() {
  const t = T[lang], pct = Math.round(S.hd.avg * 100);
  $('hcFill').style.width = `${pct}%`;
  if (!S.sec && lab.view === 'huddle') lab.setReadout(`${pct}%`, t.hd.warm, '', '#ff9a3c');
}
function renderHuddle(t) {
  const Hd = S.hd, X = t.hd, ans = Hd.ans !== null;
  lab.setGlow('rgba(255,154,60,.24)');
  $('hdAsk').innerHTML = askHtml(X.ask, X.opts, Hd.ans, t.right, X.no, 'hd');
  show('hdRun', ans);
  const sp = Hd.mode === 'spread'; $('hdS').textContent = X.spread; $('hdH').textContent = X.huddle;
  $('hdS').className = `chip${sp ? ' on' : ''}`; $('hdH').className = `chip${sp ? '' : ' on'}`;
  camChip('camH', X.cam, !ans);
  hdReadout();
  const st = !ans ? X.s0 : sp ? X.sSp : X.sHu;
  lab.setState({ emo: !ans ? '🌨️' : sp ? '🥶' : '🐧', title: st[0], lead: st[1], body: '', extra: '' });
  lab.setFacts(ans ? t.facts.huddle : []);
}

function renderHump(t) {
  const Hp = S.hp, X = t.hp, ans = Hp.ans !== null;
  lab.setGlow('rgba(224,176,80,.26)');
  $('hpAsk').innerHTML = askHtml(X.ask, X.opts, Hp.ans, t.right, X.no, 'hp');
  lab.setReadout(ans ? esc(X.fat) : '?', '', '', '#e0b050');
  const st = ans ? X.s1 : X.s0; lab.setState({ emo: '🐫', title: st[0], lead: st[1], body: '', extra: '' });
  lab.setFacts(ans ? t.facts.camel : []);
}
function renderDay(t) {
  const X = t.dy, h = S.day.h, tmp = dayTemp(h), o = S.day.out;
  lab.setGlow('rgba(122,160,255,.26)');
  $('dyLbl').innerHTML = `${esc(X.time)}: <b>${fmtH(h)}</b>`;
  if (+$('dyT').value !== h) $('dyT').value = h;
  lab.setReadout(fmtH(h), '', fmtT(Math.round(tmp)), '#7aa0ff');
  const st = tmp >= 30 ? X.hot : tmp <= 24 ? X.cold : X.mid;
  lab.setState({ emo: tmp >= 30 ? '☀️' : tmp <= 24 ? '🌙' : '🌅', title: st[0], lead: st[1], body: '', extra: '' });
  lab.setFacts([]);
  void o;
}
render();
</script>
</body>
