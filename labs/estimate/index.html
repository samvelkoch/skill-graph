// a dark rounded label that stays inside the canvas
function pill(c, text, x, y, w, o = {}) {
  const { font = '800 13px Nunito, sans-serif', bg = 'rgba(10, 12, 20, .8)', fg = '#fff', px = 9, h = 22, border = null, alpha = 1, scale = 1 } = o;
  c.save(); c.globalAlpha = alpha; c.font = font;
  const bw = c.measureText(text).width + px * 2, L = clamp(x - bw / 2, 4, Math.max(4, w - 4 - bw)), mx = L + bw / 2;
  if (scale !== 1) { c.translate(mx, y); c.scale(scale, scale); c.translate(-mx, -y); }
  c.fillStyle = bg; c.beginPath(); c.roundRect(L, y - h / 2, bw, h, h / 2); c.fill();
  if (border) { c.strokeStyle = border; c.lineWidth = 1.5; c.stroke(); }
  c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, mx, y + 1);
  c.restore();
  return { x: L, w: bw };
}

  $(id + 'O').innerHTML = opts.map((o) => `<button class="ab ${o.cls || ''}" data-act="pick" data-k="${o.k}"${o.dis ? ' disabled' : ''}>${esc(o.label)}</button>`).join('');
  $(id + 'V').innerHTML = verdict || '';
  $(id + 'N').style.display = nextLabel ? '' : 'none';
  if (nextLabel) $(id + 'N').textContent = nextLabel;
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

// --- view 1: hills and the ball -----------------------------------------------------------------------------
function hillView() {
  if (S.ri >= 5) return { lo: S.flo, hi: S.flo + 4 * S.fu, u: S.fu };
  const R = ROUNDS[S.ri];
  return { lo: R.lo, hi: R.hi, u: R.u };
}
function hillGeo(w, h, vw) {
  const pad = Math.max(32, w * 0.085), U = (w - 2 * pad) / ((vw.hi - vw.lo) / vw.u);
  return { pad, U, k: U / vw.u, V: h * 0.78, amp: clamp(U * 0.5, 22, h * 0.2) };
}
const BR = 14;
function ballXY(G, vw, x) {
  const m = -G.amp * Math.PI * Math.sin(TAU * x / vw.u) / G.U, n = Math.hypot(1, m);
  return { px: G.pad + (x - vw.lo) * G.k, py: G.V - G.amp * (1 - Math.cos(TAU * x / vw.u)) / 2, m, cx: G.pad + (x - vw.lo) * G.k + BR * m / n, cy: G.V - G.amp * (1 - Math.cos(TAU * x / vw.u)) / 2 - BR / n };
}
function placeBall(x, u, drop) {
  Object.assign(B, { x, u, v: 0, vy: 0, ang: 0, t: 0, sq: 0, wob: 0, yo: drop ? 74 : 0, st: drop ? 'hover' : (isPeakAt(x, u) ? 'balance' : 'roll') });
}
const isPeakAt = (x, u) => Math.abs(x / u - Math.floor(x / u) - 0.5) < 1e-9;
function dropBall() { B.st = 'drop'; B.vy = 0; }

// a ball on a cosine hill: gravity along the slope plus a little friction, so it overshoots and settles
function stepBall(dt, G) {
  if (B.st === 'hover' || B.st === 'rest') return;
  if (B.st === 'drop') {
    B.vy += 2600 * dt; B.yo -= B.vy * dt;
    if (B.yo <= 0) { B.yo = 0; B.vy = 0; B.sq = 0.2; sfx.tick(); B.t = 0; B.st = isPeak() ? 'balance' : 'roll'; }
    return;
  }
  B.sq = Math.max(0, B.sq - dt * 1.6);
  if (B.st === 'balance') {
    B.t += dt;
    if (B.t > 1.9) { B.st = 'roll'; B.t = 0; B.v = 22 / (G.U / B.u); sfx.push(); }
    return;
  }
  const k = G.U / B.u, om = 11, g = om * om * G.U * G.U / (G.amp * 2 * Math.PI * Math.PI), c = 2 * 0.22 * om, n = 6, hh = dt / n;
  let vp = B.v * k;
  for (let i = 0; i < n; i++) {
    const m = -G.amp * Math.PI * Math.sin(TAU * B.x / B.u) / G.U;
    vp += (g * m / (1 + m * m) - c * vp) * hh;
    B.x += vp * hh / k; B.ang += vp * hh / BR;
  }
  B.v = vp / k; B.t += dt;
  const xv = Math.round(B.x / B.u) * B.u;
  if ((Math.abs(B.x - xv) * k < 0.8 && Math.abs(vp) < 12) || B.t > 7) { B.x = xv; B.v = 0; B.st = 'rest'; landed(); }
}
function landed() {
  if (S.ri < 5 && S.rrun && !S.rd) {
    S.rd = true; (S.rg === ROUNDS[S.ri].ok ? sfx.good : sfx.bad)(); render(); showStage();
  }
}

function drawSign(c, X, Y, text, glow, time, idx) {
  c.save(); c.globalAlpha = 1;
  c.fillStyle = 'rgba(0, 0, 0, .25)'; c.beginPath(); c.ellipse(X, Y + 3, 9, 3, 0, 0, TAU); c.fill();
  const pg = c.createLinearGradient(X - 3, 0, X + 3, 0); pg.addColorStop(0, '#A06A35'); pg.addColorStop(0.5, '#8A5A2B'); pg.addColorStop(1, '#6B4320');
  c.fillStyle = pg; c.beginPath(); c.roundRect(X - 3, Y - 70, 6, 74, 2); c.fill();
  c.strokeStyle = 'rgba(60, 35, 12, .7)'; c.lineWidth = 1; c.stroke();
  c.font = `800 ${text.length > 3 ? 14 : 15}px Nunito, sans-serif`;
  const bw = c.measureText(text).width + 18, bh = 26;
  c.translate(X, Y - 78); c.rotate(((idx * 7) % 5 - 2) * 0.014);
  if (glow) { c.shadowColor = glow; c.shadowBlur = 14 + 6 * Math.sin(time * 5); }
  const bg = c.createLinearGradient(0, -bh / 2, 0, bh / 2); bg.addColorStop(0, '#F3D4A0'); bg.addColorStop(1, '#E7B675');
  c.fillStyle = bg; c.beginPath(); c.roundRect(-bw / 2, -bh / 2, bw, bh, 6); c.fill();
  c.shadowBlur = 0; c.strokeStyle = glow || '#8A5A2B'; c.lineWidth = glow ? 2.5 : 1.5; c.stroke();
  c.fillStyle = '#4A2E12'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, 0, 1);
  c.restore();
}

function drawHills(c, w, h, dt, time) {
  if (S.ri >= 5) S.flo += (S.floT - S.flo) * Math.min(1, dt * 8);
  const vw = hillView(), G = hillGeo(w, h, vw), { pad, k, V, amp } = G, { lo, u } = vw;
  const X = (x) => pad + (x - lo) * k, Yc = (x) => V - amp * (1 - Math.cos(TAU * x / u)) / 2, xAt = (px) => lo + (px - pad) / k;
  stepBall(dt, G);
  sky(c, w, h, time, true);

  // far hills for depth
  c.beginPath(); c.moveTo(0, h);
  for (let px = 0; px <= w + 8; px += 8) c.lineTo(px, V - amp - 26 + 16 * Math.sin(px / 58 + 1.1) + 9 * Math.sin(px / 23 + 0.4));
  c.lineTo(w, h); c.closePath();
  const fg = c.createLinearGradient(0, V - amp - 50, 0, h); fg.addColorStop(0, 'rgba(123, 196, 127, .24)'); fg.addColorStop(1, 'rgba(62, 142, 90, .24)');
  c.fillStyle = fg; c.fill();

  // the near hill: grass gradient, outline, a sheen along the top
  const curve = (dy) => { c.beginPath(); for (let px = -4; px <= w + 4; px += 3) { const y = Yc(xAt(px)) + dy; if (px === -4) c.moveTo(px, y); else c.lineTo(px, y); } };
  curve(0); c.lineTo(w + 4, h); c.lineTo(-4, h); c.closePath();
  const gg = c.createLinearGradient(0, V - amp, 0, h); gg.addColorStop(0, GRASS); gg.addColorStop(1, '#3E8E5A');
  c.fillStyle = gg; c.fill();
  c.lineJoin = 'round'; c.lineCap = 'round';
  curve(3.5); c.strokeStyle = 'rgba(255, 255, 255, .22)'; c.lineWidth = 1.5; c.stroke();
  curve(0); c.strokeStyle = '#2F6E46'; c.lineWidth = 2.5; c.stroke();

  // tufts of grass
  const ts = u * 0.27;
  c.strokeStyle = '#2F6E46'; c.lineWidth = 1.6;
  for (let j = Math.floor(xAt(-10) / ts); j <= Math.ceil(xAt(w + 10) / ts); j++) {
    const x = j * ts + ((j * 37) % 11 + 11) % 11 / 11 * u * 0.08, f = x / u - Math.round(x / u);
    if (Math.abs(f) < 0.09) continue;
    const px = X(x), py = Yc(x);
    c.beginPath(); c.moveTo(px - 3, py + 1); c.lineTo(px - 4.5, py - 6); c.moveTo(px, py + 1); c.lineTo(px, py - 8); c.moveTo(px + 3, py + 1); c.lineTo(px + 4.5, py - 6); c.stroke();
  }

  // tick marks on the curve, labels in the grass below
  const steps = [1, 5, 10, 50, 100, 500, 1000], tick = steps.find((s) => s * k >= 6) || 1000;
  const digits = String(Math.round(vw.hi)).length, need = digits * 8 + 16, peakOk = G.U >= digits * 8 + 10;
  const lbl = [1, 5, 10, 20, 50, 100, 200, 500, 1000].find((s) => s % tick === 0 && s * k >= need) || 1000;
  c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let x = Math.ceil(xAt(pad - 2) / tick) * tick; X(x) <= w - pad + 2; x += tick) {
    const px = X(x), py = Yc(x), major = x % (tick * 5) === 0;
    c.strokeStyle = 'rgba(31, 77, 51, .8)'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(px, py - 3); c.lineTo(px, py + (major ? 8 : 5)); c.stroke();
    if ((x % lbl === 0 && x % u !== 0) || (peakOk && x % u === u / 2)) { c.fillStyle = '#1B4A2F'; c.fillText(String(Math.round(x)), px, py + 20); }
  }

  // wooden signposts in the valleys
  const okV = S.ri < 5 && S.rd ? ROUNDS[S.ri].ok : null;
  for (let m = Math.ceil(xAt(-30) / u); m <= Math.floor(xAt(w + 30) / u); m++) {
    const x = m * u, px = X(x);
    drawSign(c, px, Yc(x), fmt(x), okV === x ? GOOD : null, time, m);
  }

  // the ball
  const xd = B.x + (B.st === 'balance' ? Math.sin(B.t * 7.5) * 3.5 * Math.min(B.t / 0.6, 1) / k : 0);
  const P = ballXY(G, vw, xd);
  let yo = B.yo;
  if (B.st === 'hover') yo = 74 + 4 * Math.sin(time * 2.4);
  const ang = B.st === 'balance' ? Math.sin(B.t * 10) * 0.5 * (0.4 + Math.min(B.t, 1)) : B.ang;
  const cx = P.cx, cy = P.cy - yo;

  if (B.st === 'hover') { // a dotted guide down to the hill
    c.save(); c.strokeStyle = 'rgba(255, 255, 255, .35)'; c.lineWidth = 1.2; c.setLineDash([2, 5]);

  const bg = c.createRadialGradient(-BR * 0.35, -BR * 0.4, 1, 0, 0, BR * 1.05); bg.addColorStop(0, '#FF8A8A'); bg.addColorStop(1, '#E03B3B');

  c.save(); c.beginPath(); c.arc(0, 0, BR - 0.5, 0, TAU); c.clip(); c.rotate(ang); // the stripe turns with the ball
  c.fillStyle = 'rgba(255, 255, 255, .88)'; c.fillRect(-BR, -2.6, BR * 2, 5.2);
  c.fillStyle = 'rgba(255, 255, 255, .5)'; c.beginPath(); c.arc(0, -BR * 0.9, 3, 0, TAU); c.fill();

    c.save(); c.globalAlpha = a; c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = '#4A2E12'; c.lineWidth = 8; c.beginPath(); c.moveTo(ax, ay); c.lineTo(ax + 38, ay); c.moveTo(ax + 28, ay - 9); c.lineTo(ax + 40, ay); c.lineTo(ax + 28, ay + 9); c.stroke();
    c.strokeStyle = EST; c.lineWidth = 4.5; c.stroke();

    pill(c, T[lang].r.rule, ax + 20, ay + 24, w, { alpha: a, fg: EST, font: '800 12px Nunito, sans-serif' });
  }

  // live readout while it rolls
  if (S.ri < 5 && S.rrun && !S.rd) {
    const ii = Math.round(B.x);
    if (ii !== S.lastInt) { S.lastInt = ii; roundReadout(); }
  }
}

function launchFree(n) {
  S.fn = n;
  S.floT = clamp(Math.floor(n / S.fu) * S.fu - 2 * S.fu, 0, 6 * S.fu);
  placeBall(n, S.fu, false);
  roundReadout();
}
function startRound(i) {
  S.ri = i; S.rg = null; S.rrun = false; S.rd = false;
  if (i < 5) placeBall(ROUNDS[i].n, ROUNDS[i].u, true);
  else { S.flo = S.floT = clamp(Math.floor(S.fn / S.fu) * S.fu - 2 * S.fu, 0, 6 * S.fu); launchFree(S.fn); }
}

// --- view 2: the robot ----------------------------------------------------------------------------------------
function drawCheck(c, w, h, dt, time) {
  const t = T[lang], R = CHK[S.ci], sc = clamp(Math.min(w / 375, h / 390), 0.7, 1.3), cx = w / 2;
  sky(c, w, h, time, false);
  c.strokeStyle = 'rgba(190, 205, 255, .06)'; c.lineWidth = 1; c.beginPath();
  for (let x = 14; x < w; x += 28) { c.moveTo(x, 0); c.lineTo(x, h); }
  for (let y = 14; y < h; y += 28) { c.moveTo(0, y); c.lineTo(w, y); }
  c.stroke();

  const rev = S.cg !== null, rt = rev ? time - S.cT0 : -1;
  const off = R.shown < R.er * 0.75 || R.shown > R.er * 1.25;
  S.cl += clamp((rev ? 0 : 1) - S.cl, -dt * 2.4, dt * 2.4);
  const lift = ease(S.cl) * h * 0.12;
  const mood = rt >= 2.4 ? (off ? 'sad' : 'happy') : 'idle';
  const shake = mood === 'sad' ? Math.sin((rt - 2.4) * 42) * 6 * Math.exp(-(rt - 2.4) * 3.5) : 0;

  // sizes
  const bodyW = Math.min(w - 32, 250 * sc), bodyH = 88 * sc, headW = bodyW * 0.62, headH = 58 * sc;
  const Y0 = 14 * sc + lift, headY = Y0 + 16 * sc, bodyY = headY + headH + 6 * sc, bodyBot = bodyY + bodyH;

  // ground shadow
  c.fillStyle = 'rgba(8, 10, 24, .35)'; c.beginPath(); c.ellipse(cx, bodyBot + 7 * sc, bodyW * 0.42, 7 * sc, 0, 0, TAU); c.fill();

  c.save(); c.translate(shake, 0); c.lineJoin = 'round'; c.lineCap = 'round';
  const metal = (x, y, ww, hh, r) => {
    const g = c.createLinearGradient(x, y, x + ww * 0.4, y + hh); g.addColorStop(0, '#8E9CF5'); g.addColorStop(0.4, ROBOT); g.addColorStop(1, '#5563C9');
    c.fillStyle = g; c.beginPath(); c.roundRect(x, y, ww, hh, r); c.fill();
    c.strokeStyle = '#3A47A8'; c.lineWidth = 2; c.stroke();
    const gl = c.createLinearGradient(0, y, 0, y + hh * 0.55); gl.addColorStop(0, 'rgba(255, 255, 255, .3)'); gl.addColorStop(1, 'rgba(255, 255, 255, 0)');
    c.fillStyle = gl; c.beginPath(); c.roundRect(x + 3, y + 3, ww - 6, hh * 0.5, r * 0.8); c.fill();
  };
  // antenna with a blinking light
  c.strokeStyle = '#3A47A8'; c.lineWidth = 3.5 * sc; c.beginPath(); c.moveTo(cx, headY + 2); c.lineTo(cx, Y0 + 6 * sc); c.stroke();
  const bl = 0.55 + 0.45 * Math.sin(time * 4.2), ar = 6.5 * sc;
  const ag = c.createRadialGradient(cx - 2, Y0 + 4 * sc, 1, cx, Y0 + 6 * sc, ar * 2.4); ag.addColorStop(0, `rgba(255, 201, 74, ${0.55 * bl})`); ag.addColorStop(1, 'rgba(255, 201, 74, 0)');
  c.fillStyle = ag; c.beginPath(); c.arc(cx, Y0 + 6 * sc, ar * 2.4, 0, TAU); c.fill();
  const ab = c.createRadialGradient(cx - 2, Y0 + 3 * sc, 1, cx, Y0 + 6 * sc, ar); ab.addColorStop(0, '#FFF1B8'); ab.addColorStop(1, EST);
  c.fillStyle = ab; c.beginPath(); c.arc(cx, Y0 + 6 * sc, ar, 0, TAU); c.fill(); c.strokeStyle = '#B88A1C'; c.lineWidth = 1.5; c.stroke();
  // ears
  for (const sd of [-1, 1]) { c.fillStyle = '#5563C9'; c.strokeStyle = '#3A47A8'; c.lineWidth = 2; c.beginPath(); c.roundRect(cx + sd * headW / 2 - (sd < 0 ? 7 * sc : 0), headY + headH * 0.3, 7 * sc, headH * 0.4, 3); c.fill(); c.stroke(); }
  // head, face panel, eyes, mouth
  metal(cx - headW / 2, headY, headW, headH, 20 * sc);
  const fx = cx - headW / 2 + 9 * sc, fy = headY + 8 * sc, fw = headW - 18 * sc, fh = headH - 16 * sc;
  c.fillStyle = '#1E2A5A'; c.beginPath(); c.roundRect(fx, fy, fw, fh, 12 * sc); c.fill(); c.strokeStyle = 'rgba(0, 0, 0, .35)'; c.lineWidth = 1.5; c.stroke();
  const ey = fy + fh * 0.42, ex = fw * 0.25, er = 8.5 * sc, blink = time % 3.7 > 3.58 ? 0.12 : 1;
  for (const sd of [-1, 1]) {
    const x = cx + sd * ex;
    if (mood === 'sad') { c.strokeStyle = BAD; c.lineWidth = 3.4 * sc; c.beginPath(); c.moveTo(x - 6 * sc, ey - 6 * sc); c.lineTo(x + 6 * sc, ey + 6 * sc); c.moveTo(x + 6 * sc, ey - 6 * sc); c.lineTo(x - 6 * sc, ey + 6 * sc); c.stroke(); }
    else if (mood === 'happy') { c.strokeStyle = GOOD; c.lineWidth = 3.4 * sc; c.beginPath(); c.arc(x, ey + 3 * sc, 7.5 * sc, Math.PI * 1.12, Math.PI * 1.88); c.stroke(); }
    else {
      c.save(); c.translate(x, ey); c.scale(1, blink);
      const eg = c.createRadialGradient(-2, -2, 1, 0, 0, er); eg.addColorStop(0, '#FFFFFF'); eg.addColorStop(1, '#C9D2FF');
      c.fillStyle = eg; c.beginPath(); c.arc(0, 0, er, 0, TAU); c.fill();
      c.fillStyle = '#1E2A5A'; c.beginPath(); c.arc(0, 2.4 * sc, er * 0.5, 0, TAU); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(-1.5 * sc, 0.6 * sc, er * 0.17, 0, TAU); c.fill();
      c.restore();
    }
  }
  const my = fy + fh * 0.84;
  c.lineWidth = 3 * sc;
  if (mood === 'happy') { c.strokeStyle = GOOD; c.beginPath(); c.arc(cx, my - 5 * sc, 8 * sc, Math.PI * 0.15, Math.PI * 0.85); c.stroke(); }
  else if (mood === 'sad') { c.strokeStyle = BAD; c.beginPath(); c.arc(cx, my + 3 * sc, 7 * sc, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
  else { c.strokeStyle = ROBOT; c.beginPath(); c.moveTo(cx - 6 * sc, my); c.lineTo(cx + 6 * sc, my); c.stroke(); }
  // neck, body
  c.fillStyle = '#3A47A8'; c.fillRect(cx - 12 * sc, headY + headH - 1, 24 * sc, 8 * sc);
  metal(cx - bodyW / 2, bodyY, bodyW, bodyH, 22 * sc);
  // the screen
  const sx = cx - bodyW / 2 + 14 * sc, sy = bodyY + 11 * sc, sw = bodyW - 28 * sc, sh = 50 * sc;
  c.fillStyle = '#B9E3C8'; c.beginPath(); c.roundRect(sx - 3, sy - 3, sw + 6, sh + 6, 12 * sc); c.fill();
  const scg = c.createLinearGradient(0, sy, 0, sy + sh); scg.addColorStop(0, '#E9FBEF'); scg.addColorStop(1, '#CDEFD9');
  c.fillStyle = scg; c.beginPath(); c.roundRect(sx, sy, sw, sh, 10 * sc); c.fill();
  c.strokeStyle = 'rgba(31, 81, 53, .45)'; c.lineWidth = 1.5; c.stroke();
  const full = `${R.a} ${R.op} ${R.b} = ${R.shown}`, typed = rev ? full.length : Math.min(full.length, Math.floor(Math.max(0, time - S.cT) / 0.09));
  let fs = 28 * sc; c.font = `800 ${fs}px Nunito, sans-serif`;
  const fw0 = c.measureText(full).width, lim = sw - 22 * sc;
  if (fw0 > lim) { fs *= lim / fw0; c.font = `800 ${fs}px Nunito, sans-serif`; }
  const tw = c.measureText(full).width;
  c.fillStyle = '#1F5135'; c.textAlign = 'left'; c.textBaseline = 'middle';
  const cursor = typed < full.length && Math.floor(time * 5) % 2 === 0 ? '▌' : '';
  c.fillText(full.slice(0, typed) + cursor, cx - tw / 2, sy + sh / 2 + 1);
  // three little lamps
  [[EST, 0], [GOOD, 1], [BAD, 2]].forEach(([col, i]) => { c.fillStyle = col; c.globalAlpha = 0.9; c.beginPath(); c.arc(cx + (i - 1) * 18 * sc, bodyBot - 11 * sc, 4.2 * sc, 0, TAU); c.fill(); c.globalAlpha = 1; c.strokeStyle = 'rgba(0, 0, 0, .3)'; c.lineWidth = 1; c.stroke(); });
  c.restore();

  if (!rev) { lab_pinger('c', false); return; }

  // 1) the rounding, written in yellow under the sum
  const est = `${R.est[0]} ${R.op} ${R.est[1]} ≈ ${R.er}`, ne = Math.min(est.length, Math.floor(rt / 0.05));
  if (ne > 0) pill(c, est.slice(0, ne), cx, bodyBot + 26 * sc, w, { fg: EST, font: `800 ${Math.round(20 * sc)}px Nunito, sans-serif`, h: 32 * sc, px: 14, border: 'rgba(255, 201, 74, .45)' });

  // 2) the number line: estimate flag, "about here" band, the robot's pin
  const la = easeOut(sat((rt - 0.9) / 0.5));
  if (la > 0) {
    const x0 = 34 * sc, x1 = w - 34 * sc, trackY = h - 84 * sc + (1 - la) * 14, VX = (v) => x0 + clamp(v / R.max, 0, 1) * (x1 - x0), trh = 12 * sc;

    if (rt < st.at) return; phase = i + 1;
    const k = easeOut(sat((rt - st.at) / 0.3));
    pill(c, st.text, w / 2, h * st.y, w, { h: 34 * sc, px: 16, font: `800 ${Math.round(19 * sc)}px Nunito, sans-serif`, fg: st.fg, bg: st.bg || 'rgba(10, 12, 20, .8)', border: st.bg ? null : 'rgba(255, 201, 74, .4)', scale: lerp(0.6, 1, k) + 0.08 * Math.sin(k * Math.PI), alpha: sat(k * 3) });
    if (i < 2 && rt > steps[i + 1].at - 0.4) { c.save(); c.fillStyle = 'rgba(255, 255, 255, .55)'; c.font = `800 ${Math.round(16 * sc)}px Nunito, sans-serif`; c.textAlign = 'center'; c.fillText('▼', w / 2, h * st.y + 28 * sc); c.restore(); }
  });
  if (phase !== S.hph) { S.hph = phase; render(); }
}

// --- the one drawing loop ------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'round') { if (S.sec === 'beans') drawBeans(c, w, h, dt, time); else if (S.sec === 'heart') drawHeart(c, w, h, dt, time); else drawHills(c, w, h, dt, time); }
  else if (v === 'check') drawCheck(c, w, h, dt, time);
  else drawShop(c, w, h, dt, time);
});

// --- controls --------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'pick') {
    const k = b.dataset.k;
    if (v === 'round') {
      if (S.rrun || S.ri >= 5) return;
      S.rg = +k; S.rrun = true; S.rAns = true; dropBall(); sfx.click(); showStage();
    } else if (v === 'check') {
      if (S.cg !== null) return;
      S.cg = k; S.cT0 = nowS(); S.cAns = true; sfx.click(); showStage();
    } else {
      if (S.sg !== null) return;
      S.sg = +k; S.sT0 = nowS(); S.sAns = true; sfx.click(); showStage();
    }
  } else if (act === 'next') {
    sfx.click();
    if (v === 'round') startRound(S.ri + 1);
    else if (v === 'check') { S.ci = (S.ci + 1) % CHK.length; S.cg = null; S.cdone = false; S.cT = nowS(); }
    else { S.si = (S.si + 1) % SHOP.length; S.sg = null; S.sdone = false; }
  } else if (act === 'unit') {
    const u = +b.dataset.u; if (u === S.fu) return;
    S.fn = u === 100 ? S.fn * 10 : Math.round(S.fn / 10); S.fu = u; sfx.click(); startRound(5);
  } else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else {
      S.sec = k; sfx.click();
      if (k === 'beans') { S.bn = null; S.bph = -1; }
      else { S.hT0 = nowS(); S.hph = -1; }
    }
  } else if (act === 'strip') {
    const strip = STRIPS[S.bi++ % STRIPS.length];
    S.bn = { strip, list: beanStrip(strip), t0: nowS() }; S.bph = -1; sfx.click();
  }
  render();
});
$('rSlider').addEventListener('input', (ev) => {
  const n = +ev.target.value, was = roundHalfUp(S.fn, S.fu);
  launchFree(n);
  if (roundHalfUp(n, S.fu) !== was) sfx.tick();
});

// --- render: controls, readout and the state card --------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('vRound').style.display = v === 'round' ? '' : 'none';
  $('vCheck').style.display = v === 'check' ? '' : 'none';
  $('vShop').style.display = v === 'shop' ? '' : 'none';
  for (const id of ['r', 'c', 's']) if (id !== { round: 'r', check: 'c', shop: 's' }[v]) { $(id + 'O').innerHTML = ''; $(id + 'N').textContent = ''; } // no hidden twin buttons
  if (v === 'round') renderRound(t); else if (v === 'check') renderCheck(t); else renderShop(t);
}
const setCard = (c) => lab.setState({ emo: c[0], title: c[1], lead: c[2], body: c[3], extra: '' });

function digitsHTML(s, hl) { return [...String(s)].map((d, i) => `<i class="${i === 0 && hl ? 'hl' : ''}">${d}</i>`).join(''); }
function roundReadout() {
  if (lab.view !== 'round' || S.sec) return;
  const t = T[lang];
  lab.setGlow('rgba(123, 196, 127, .26)');
  if (S.ri >= 5) { lab.setReadout(`${fmt(S.fn)} → ${fmt(roundHalfUp(S.fn, S.fu))}`, t.r.unit(t.un[S.fu]), '', GRASS); return; }
  const R = ROUNDS[S.ri], sub = t.r.unit(t.un[R.u]);
  if (S.rd) lab.setReadout(S.ri === 4 ? `${digitsHTML(R.n, true)}<span class="ar">→</span>${digitsHTML(R.ok, true)}` : `${fmt(R.n)} → ${fmt(R.ok)}`, sub, '', GRASS);
  else lab.setReadout(fmt(S.rrun ? Math.round(B.x) : R.n), sub, '', GRASS);
}
function renderRound(t) {
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('beans', '🫘') + sc('heart', '💓');
  $('secRound').style.display = S.sec ? 'none' : '';
  $('secBeans').style.display = S.sec === 'beans' ? '' : 'none';
  if (S.sec) { renderSecret(t); return; }
  const free = S.ri >= 5, R = free ? null : ROUNDS[S.ri];
  $('rFree').style.display = free ? '' : 'none';
  if (free) {
    const max = S.fu * 10, sl = $('rSlider');
    sl.max = max; if (+sl.value !== S.fn) sl.value = S.fn; sl.setAttribute('aria-label', t.r.free);
    $('rUnits').innerHTML = [10, 100].map((u) => `<button class="chip ${u === S.fu ? 'on' : ''}" data-act="unit" data-u="${u}">${u}</button>`).join('');
    setQA('r', t.r.free, [], '', null);
  } else {
    const opts = R.opts.map((o) => ({ k: o, label: fmt(o), dis: S.rrun, cls: S.rd ? (o === R.ok ? 'good' : o === S.rg ? 'bad' : '') : o === S.rg ? 'sel' : '' }));
    const vd = S.rd ? `<b style="color:${S.rg === R.ok ? GOOD : BAD}">${esc(S.rg === R.ok ? t.right : t.wrong)}</b> ${esc(t.r.why[S.ri])}` : '';
    setQA('r', t.r.q(fmt(R.n), t.un[R.u]), opts, vd, S.rd ? t.next : null);
  }
  roundReadout();
  setCard(t.st.round[S.rAns || free ? 1 : 0]);
}
function renderSecret(t) {
  if (S.sec === 'beans') {
    lab.setGlow('rgba(176, 122, 62, .28)');
    $('bStrip').textContent = t.sec.strip;
    const n = S.bn ? S.bn.list.length : 0;
    if (!S.bn) lab.setReadout('?', '', '', EST);
    else if (S.bph === 0) lab.setReadout(String(n), '× 10', '', EST);
    else if (S.bph === 1) lab.setReadout(`≈ ${n * 10}`, '', '', EST);
    else lab.setReadout(String(BEANS.length), '', '', GOOD);
    lab.setState({ emo: '🫘', title: t.secrets.beans[0], lead: t.secrets.beans[1], body: t.sec.beansText, extra: '' });
  } else {
    lab.setGlow('rgba(224, 59, 59, .26)');
    const p = S.hph;
    if (p <= 0) lab.setReadout('?', '', '', '#E03B3B');
    else if (p === 1) lab.setReadout('≈ 5000', t.sec.hour, '', '#E03B3B');
    else if (p === 2) lab.setReadout(`≈ ${fmt(100000)}`, '', '', '#E03B3B');
    else lab.setReadout(fmt(115200), '', '', GOOD);
    lab.setState({ emo: '💓', title: t.secrets.heart[0], lead: t.secrets.heart[1], body: t.sec.heartText, extra: `<div class="fine">${esc(t.fine)}</div>` });
  }
}
function renderCheck(t) {
  const R = CHK[S.ci], off = cOff(), truth = off ? 'off' : 'ok';
  lab.setGlow('rgba(124, 139, 240, .28)');
  const opts = [['ok', t.c.ok], ['off', t.c.off]].map(([k, label]) => ({ k, label, dis: S.cg !== null, cls: S.cdone ? (k === truth ? 'good' : k === S.cg ? 'bad' : '') : k === S.cg ? 'sel' : '' }));
  const vd = S.cdone ? `<b style="color:${S.cg === truth ? GOOD : BAD}">${esc(S.cg === truth ? t.right : t.no)}</b> ${esc(t.c.why[S.ci])}<div class="note">${esc(t.c.real(fmt(R.real)))}</div>` : '';
  setQA('c', t.c.q, opts, vd, S.cdone ? t.next : null);
  if (S.cg === null) lab.setReadout(`${R.a} ${R.op} ${R.b}`, '', '', ROBOT);
  else lab.setReadout(`≈ ${fmt(R.er)}`, `${R.est[0]} ${R.op} ${R.est[1]}`, '', ROBOT);
  setCard(t.st.check[S.cAns ? 1 : 0]);
}
function renderShop(t) {
  const Sh = SHOP[S.si];
  lab.setGlow('rgba(255, 201, 74, .26)');
  const opts = t.s.o.map((label, k) => ({ k, label, dis: S.sg !== null, cls: S.sdone ? (k === Sh.ans ? 'good' : k === S.sg ? 'bad' : '') : k === S.sg ? 'sel' : '' }));
  const vd = S.sdone ? `<b style="color:${S.sg === Sh.ans ? GOOD : BAD}">${esc(S.sg === Sh.ans ? t.right : t.no)}</b> ${esc(t.s.r[S.si])}` : '';
  setQA('s', t.s.q, opts, vd, S.sdone ? t.next : null);
  if (S.sg === null) lab.setReadout(`🪙 ${BUDGET}`, t.s.budget.replace(/:$/, ''), '', EST);
  else lab.setReadout(`≈ ${Sh.p.reduce((a, p) => a + roundHalfUp(p, 10), 0)}`, `🪙 ${BUDGET}`, '', EST);
  setCard(t.st.shop[S.sAns ? 1 : 0]);
}

startRound(0);
render();
</script>
