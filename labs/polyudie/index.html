  if (act === 'sail') { if (S.sail && !S.sail.done) return; S.sail = { t: 0 }; sfx.push(); render(); return; }
  void v;
});
$('ctrlBody').addEventListener('input', (ev) => {
  const e = ev.target;
  if (e.classList.contains('pl-sl')) { S.lvl[+e.dataset.i] = +e.value; sfx.tick(); renderSoft(); }
  else if (e.id === 'slF') { S.urok = +e.value; S.t2 = Math.max(S.t2, 12); sfx.tick(); renderSoft(); }
  else if (e.id === 'plTrip') { S.trip = +e.value; renderSoft(); }
});

// --- render ------------------------------------------------------------------------------------------------------
function renderSoft() { render(); }
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  $('cR').hidden = !!sec || v !== 'rounds'; $('cF').hidden = !!sec || v !== 'reform'; $('cL').hidden = !!sec || v !== 'law'; $('cS').hidden = !sec;
  $('fineTxt').textContent = t.fineTxt;
  const open = secret.unlocked();
  $('secRow').innerHTML = [['trade', '🛶'], ['olga', '👑']].map(([k, e]) => `<button class="chip pl-chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec) renderSec(t); else if (v === 'rounds') renderRounds(t); else if (v === 'reform') renderReform(t); else renderLaw(t);
}
function joinNames(t, idx, capFirst) {
  const n = idx.map((i) => (lang === 'en' ? t.lands[i] : t.lands[i].toLowerCase())).join(t.join);
  return capFirst ? n.charAt(0).toUpperCase() + n.slice(1) : n;
}
function renderRounds(t) {
  const r = t.r, asked = S.p1 !== null;
  lab.setGlow('rgba(100, 150, 220, .26)');
  $('r1sb').hidden = !S.sb; $('r1ask').hidden = S.sb;
  if (!S.sb) {
    $('r1ask').innerHTML = askHTML(r.q, r.opts, S.p1, r.ok, asked ? (S.p1 === r.ok ? t.ok : t.no) : '') + (asked ? `<button class="btn pl-go" data-act="go1">${esc(r.go)}</button>` : '');
    lab.setReadout(asked ? '945' : '?', '', '', '#6fa8dc');
    lab.setState({ emo: asked ? '⚔️' : '🤔', title: asked ? r.title : r.q, lead: asked ? r.rlead : r.lead, body: asked ? r.goBody : '', extra: '' });
    lab.setFacts(asked ? t.facts.r : []);
    return;
  }
  $('r1cap').textContent = r.cap; $('sendB').textContent = `🛷 ${r.send}`; $('resetB').textContent = r.again; $('r1hint').textContent = r.hint;
  $('sendB').disabled = !!S.run; $('resetB').disabled = !!S.run;
  LANDS.forEach((l, i) => { $(`nm${i}`).textContent = t.lands[i]; $(`lv${i}`).textContent = S.lvl[i]; if (+$(`sl${i}`).value !== S.lvl[i]) $(`sl${i}`).value = S.lvl[i]; $(`sl${i}`).disabled = !!S.run; $(`sl${i}`).setAttribute('aria-label', t.lands[i]); });
  const inc = S.last, un = t.sacks(inc ?? 0);
  lab.setReadout(S.run ? `${S.winIncome}` : inc === null ? '—' : `${inc}`, S.run ? `${t.winter(S.year + 1)}` : inc === null ? r.sub0 : `${un} · ${t.winter(S.year)}`, S.revT ? t.revolts(S.revT) : '', '#6fa8dc');
  let st;
  const lowIdx = LANDS.map((_, i) => i).filter((i) => S.pat[i] < 40 && S.pat[i] > 0);
  if (S.run) st = { emo: '🛷', title: r.run[0], lead: r.run[1], body: '' };
  else if (inc === null) st = { emo: '🛷', title: r.idle[0], lead: r.idle[1], body: '' };
  else if (S.revNow.length) { const [a, b] = r.riot(joinNames(t, S.revNow), inc); st = { emo: '✊', title: a, lead: b, body: lowIdx.length ? r.low(joinNames(t, lowIdx, true)) : '' }; }
  else { const [a, b] = r.calm(inc); st = { emo: '❄️', title: a, lead: b, body: lowIdx.length ? r.low(joinNames(t, lowIdx, true)) : '' }; }
  lab.setState({ ...st, extra: '' });
  lab.setFacts(t.facts.r);
}
function renderReform(t) {
  const f = t.f, asked = S.p2 !== null, fx = FIXED_BY[S.urok];
  lab.setGlow('rgba(76, 199, 184, .24)');
  $('r2ask').hidden = false; $('r2sb').hidden = !asked || S.t2 < 12;
  $('r2ask').innerHTML = askHTML(f.q, f.opts, S.p2, F_OK, asked ? (S.p2 === F_OK ? t.ok : t.no) : '');
  if (!asked) {
    lab.setReadout('?', f.sub, '', '#4cc7b8');
    lab.setState({ emo: '🤔', title: f.q, lead: f.lead, body: '', extra: '' }); lab.setFacts([]); return;
  }
  $('r2cap').textContent = f.cap; $('r2hint').textContent = f.hint; $('lvF').textContent = S.urok; if (+$('slF').value !== S.urok) $('slF').value = S.urok; $('slF').setAttribute('aria-label', f.cap);
  const done = S.t2 >= 12;
  lab.setReadout(done ? `${fx.tot}` : '…', f.sub, fx.revTot && done ? t.revolts(fx.revTot) : '', '#4cc7b8');
  let st;
  if (!done) st = { emo: '⏳', title: f.q, lead: '', body: '' };
  else if (fx.revTot === 0) st = { emo: '✅', title: f.calmTitle(fx.tot), lead: f.calm(POLY.tot, POLY.revTot), body: S.urok >= SAFE ? f.calmMax : f.calmMore };
  else st = { emo: '✊', title: f.riot(fx.revTot), lead: f.riotLead, body: f.rounds(POLY.tot, POLY.revTot) };
  lab.setState({ ...st, extra: '' }); lab.setFacts(done ? t.facts.f : []);
}
function renderLaw(t) {
  const l = t.l, asked = S.p3 !== null;
  lab.setGlow('rgba(224, 176, 80, .24)');
  $('r3sb').hidden = !asked;
  $('r3ask').innerHTML = askHTML(l.q, l.opts, S.p3, l.ok, asked ? (S.p3 === l.ok ? t.ok : t.no) : '');
  if (!asked) {
    lab.setReadout('?', '', '', '#e0b050');
    lab.setState({ emo: '🤔', title: l.q, lead: l.lead, body: '', extra: '' }); lab.setFacts([]); return;
  }
  $('r3cap').textContent = l.who;
  $('r3st').innerHTML = l.st.map((n, i) => `<button class="chip pl-chip ${S.vic === i ? 'on' : ''}" data-act="vic" data-k="${i}">${esc(n)}</button>`).join('');
  $('revB').textContent = l.revenge; $('fineB').textContent = l.fine; $('again3').textContent = l.again; $('revB').disabled = S.settled || S.rev >= 6;
  $('fineB').disabled = S.settled;
  const dead = 1 + S.rev;
  lab.setReadout(S.settled ? `${FINE[S.vic]}` : `${dead}`, S.settled ? l.unit : l.deadUnit, S.settled ? '⚖️' : S.rev ? '⚔️' : '', '#e0b050');
  let st;
  if (S.settled) { const [a, b] = l.paid(FINE[S.vic]); st = { emo: '🤝', title: a, lead: b, body: S.rev ? l.dead(dead) : '' }; }
  else if (S.rev) { const [a, b] = l.rev(S.rev); st = { emo: '⚔️', title: a, lead: b, body: l.dead(dead) }; }
  else { st = { emo: '⚖️', title: l.title(FINE[1], FINE[0]), lead: l.rlead, body: l.start[1] }; }
  lab.setState({ ...st, extra: '' }); lab.setFacts(t.facts.l);
}
function renderSec(t) {
  const u = t.sec, k = S.sec, olga = k === 'olga';
  $('sTrade').hidden = olga; $('sOlga').hidden = !olga; $('exitB').textContent = u.back;
  lab.setGlow('rgba(190, 140, 210, .24)');
  if (!olga) {
    $('stCap').textContent = u.boats; $('bn').textContent = S.boats; $('sailB').textContent = u.sail;
    const a = S.sail, running = a && !a.done; $('sailB').disabled = !!running;
    let st = { emo: '🛶', title: u.idle[0], lead: u.idle[1] }, ph = '';
    if (a?.done) { const d = u.done(S.boats); st = { emo: '🏠', title: d[0], lead: d[1] }; ph = u.phase[3]; }
    else if (a) { const p = a.t; if (p < 6) { st = { emo: '🦊', title: u.out[0], lead: u.out[1] }; ph = u.phase[0]; } else if (p < 6.8) { st = { emo: '🏛️', title: u.there[0], lead: u.there[1] }; ph = u.phase[1]; } else { st = { emo: '🍷', title: u.home[0], lead: u.home[1] }; ph = u.phase[2]; } }
    lab.setReadout(`${S.boats}`, u.boats, ph, '#c08ad0');
    lab.setState({ ...st, body: '', extra: '' }); lab.setFacts(t.facts.trade);
  } else {
    $('soCap').textContent = u.road; $('e0').textContent = u.places[0]; $('e1').textContent = u.places[3]; if (+$('plTrip').value !== S.trip) $('plTrip').value = S.trip;
    $('plTrip').setAttribute('aria-label', u.road);
    const p = S.trip, o = p < 8 ? u.o0 : p < 80 ? u.o1 : p < 97 ? u.o2 : u.o3, place = p < 8 ? u.places[0] : p < 80 ? u.places[1] : p < 97 ? u.places[2] : u.places[3];
    lab.setReadout(esc(place), '', '', '#c08ad0');
    lab.setState({ emo: p >= 97 ? '⛪' : p < 8 ? '👑' : '🛶', title: o[0], lead: o[1], body: p >= 97 ? u.o3b : '', extra: '' });
    lab.setFacts(p >= 97 ? t.facts.olga : []);
  }
}
