  }

}

    emoji(c, '⚡', bx0 + 12, y, 15);
    pill(c, t.a.o2[r === 0 ? 0 : 1], bx0 + bl / 2, y - 26, 1);
  });
  if (ans !== null && tr > 2.1) { const k = backOut(clamp01((tr - 2.1) / .4)); pill(c, t.a.save, clamp(bx0 + bl * .05 + 70, 10, w), rows[1] + 30, clamp01(k), { bg: C.out, fg: C.ink, font: '900 13px Nunito, sans-serif' }); }
  if (ans !== null && tr > 1.9) { const k = clamp01((tr - 1.9) / .5); emoji(c, '✨', w * .4 + 16, rows[1] - 14, 16 * k, k); }
}

// --- one canvas, one draw per frame ---------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, tm) => {
  W = w; H = h; c.save();
  c.beginPath(); c.roundRect(0, 0, w, h, 18); c.clip();
  c.fillStyle = grad(c, 0, 0, 0, h, [[0, '#22364A'], [1, C.bg]]); c.fillRect(0, 0, w, h);
  const v = lab.view;
  if (v === 'unpack') { if (S.sec === 'lead') drawLead(c, w, h, tm); else if (S.sec === 'paper') drawPaper(c, w, h, tm); else drawUnpack(c, w, h, tm); }
  else if (v === 'back') drawBack(c, w, h, tm);
  else drawAgain(c, w, h, tm);
  c.restore();
  c.strokeStyle = 'rgba(130,145,190,.25)'; c.lineWidth = 1; c.beginPath(); c.roundRect(.5, .5, w - 1, h - 1, 18); c.stroke();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'back' || S.b.ans !== null || !S.geo) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (y < S.geo.rimY) return;
  const j = S.geo.bx.findIndex((bx) => Math.abs(x - bx) <= S.geo.bw / 2 + 4);
  if (j >= 0) answer(j);
});

// --- controls ---------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const stateOf = (name, full) => { const [emo, title, lead, body] = T[lang].st[name][full ? 'full' : 'neutral']; lab.setState({ emo, title, lead, body, extra: '' }); };
function answer(j) {
  const v = lab.view, o = v === 'unpack' ? S.u : v === 'back' ? S.b : S.a;
  if (o.ans !== null) return;
  const ok = v === 'unpack' ? T[lang].u.ok[o.i] : v === 'back' ? BK_OK[o.i] : (o.i === 0 ? 2 : 1);
  o.ans = j; o.t0 = now();
  if (v === 'back') S.b.right[o.i] = j === ok;
  if (o.i === (v === 'unpack' ? 2 : v === 'back' ? 6 : 1)) o.done = true;
  (j === ok ? sfx.good : sfx.bad)(); showStage(); render();
}
function next() {
  const v = lab.view;
  if (v === 'unpack') { if (S.u.done) S.u = fresh(); else { S.u.i++; S.u.ans = null; } }
  else if (v === 'back') { if (S.b.done) S.b = { ...fresh(), right: [] }; else { S.b.i++; S.b.ans = null; } }
  else if (S.a.done) S.a = fresh(); else { S.a.i++; S.a.ans = null; }
  sfx.click(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'opt') answer(+b.dataset.j);
  else if (act === 'next') next();
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'lead') { S.lead = .5; S.leadShown = 4; } else S.paper = { n: 0, f0: 1, t0: -9 }; }
    sfx.click(); render();
  } else if (act === 'recycle') {
    const P = S.paper, tm = now();
    if (P.n >= 7) S.paper = { n: 0, f0: 1, t0: tm };
    else S.paper = { n: P.n + 1, f0: Math.pow(.8, P.n), t0: tm };
    sfx.snap(); render();
  }
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'rsLead') return;
  S.lead = +ev.target.value / 100; leadReadout();
});
function leadReadout() {
  const t = T[lang], gi = S.lead < .34 ? 0 : S.lead > .66 ? 2 : 1;
  lab.setReadout(esc(t.sec.grades[gi]), '', '', '#C8CEDA');
}

// --- render: controls, readout and state card, once per change -----------------------------------------------------
function qBlock(t, q, opts, ok, ans, why, last, cls = '') {
  const fb = ans === null ? '' : `<div class="rs-fb"><b class="${ans === ok ? 'good' : 'bad'}">${esc(ans === ok ? t.right : t.wrong)}</b>${esc(why)}</div>
    <button class="btn rs-next" data-act="next">${esc(last ? t.again : t.next)}</button>`;
  return `<div class="rs-q">${esc(q)}</div><div class="rs-opts">${opts.map((o, j) =>
    `<button class="rs-o ${cls} ${ans === null ? '' : j === ok ? 'good' : j === ans ? 'bad' : 'dim'}" data-act="opt" data-j="${j}"${ans === null ? '' : ' disabled'}${cls ? ` style="--c:${BK_COL[j]}"` : ''}>${esc(o)}</button>`).join('')}</div>${fb}`;
}
function chipsHtml(t) {
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="row2"><div class="chips">${sc('lead', '✏️')}${sc('paper', '📄')}</div></div>`;
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v === 'unpack') renderUnpack(t); else if (v === 'back') renderBack(t); else renderAgain(t);
}
function renderUnpack(t) {
  const u = S.u, i = u.i;
  lab.setGlow('rgba(79,163,199,.26)');
  if (S.sec === 'lead') {
    $('ctrlBody').innerHTML = `<div class="rs-sec"><input type="range" class="big" id="rsLead" min="0" max="100" value="${Math.round(S.lead * 100)}" style="--track:linear-gradient(90deg,#D9DCE4,#2B303C)" aria-label="${esc(t.sec.leadSlider)}">
      <div class="rs-cap">${esc(t.sec.leadSlider)}</div></div>${chipsHtml(t)}`;
    leadReadout();
    lab.setState({ emo: '✏️', title: t.secrets.lead[0], lead: t.secrets.lead[1], body: t.sec.leadText, extra: '' });
  } else if (S.sec === 'paper') {
    $('ctrlBody').innerHTML = `<div class="rs-sec"><button class="btn" data-act="recycle">${S.paper.n >= 7 ? esc(t.again) : `♻️ ${esc(t.sec.recycle)}`}</button></div>${chipsHtml(t)}`;
    lab.setReadout(String(S.paper.n), t.sec.loop(S.paper.n), '', C.never);
    lab.setState({ emo: '📄', title: t.secrets.paper[0], lead: t.secrets.paper[1], body: t.sec.paperText, extra: '' });
  } else {
    $('ctrlBody').innerHTML = qBlock(t, t.u.q[i], t.u.o[i], t.u.ok[i], u.ans, t.u.why[i], u.done) + chipsHtml(t);
    lab.setReadout(`${i + 1}/3`, OBJS[i].emo, '', C.water);
    stateOf('unpack', u.done);
  }
}
function renderBack(t) {
  const b = S.b, i = b.i, k = b.right.filter(Boolean).length;
  lab.setGlow('rgba(61,220,151,.22)');
  const q = i === 0 ? t.b.q : t.b.ask(t.b.cards[i]);
  $('ctrlBody').innerHTML = qBlock(t, q, t.b.baskets.map((n, j) => `${BK_EMO[j]} ${n}`), BK_OK[i], b.ans, t.b.why[i], b.done, 'rs-bk');
  lab.setReadout(`${k}/7`, '', '', C.grow);
  stateOf('back', b.done);
}
function renderAgain(t) {
  const a = S.a, i = a.i;
  lab.setGlow('rgba(255,181,71,.22)');
  const q = i === 0 ? t.a.q1 : t.a.q2, o = i === 0 ? t.a.o1 : t.a.o2, why = i === 0 ? t.a.r1 : t.a.r2;
  $('ctrlBody').innerHTML = qBlock(t, q, o, i === 0 ? 2 : 1, a.ans, why, a.done);
  lab.setReadout(`${i + 1}/2`, '', i === 1 && a.ans !== null ? t.a.save : '', C.out);
  stateOf('again', a.done);
}
render();
</script>
</body>
