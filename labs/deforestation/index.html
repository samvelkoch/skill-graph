function tapWatch(x, y) {

  for (const it of W.items) {
    if (!it.flag || it.sent || it.stopped) continue;
    if (Math.hypot(x - wx(it.x), y - wy(it.y)) < 30) { it.sent = true; W.rangers.push({ it, t: 0 }); sfx.click(); return; }
  }
}

// --- canvas loop and pointer ---------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  if (S.sec === 'plant') return drawPlant(c, w, h, dt, time);
  if (S.sec === 'watch') return drawWatch(c, w, h, dt, time);
  const v = lab.view;
  if (v === 'above') {
    drawAbove(c, w, h, dt, time);
    const yr = $('yr'); if (+yr.value !== Math.round(S.year)) yr.value = Math.round(S.year);
  } else if (v === 'why') drawWhy(c, w, h, dt, time);
  else drawMuch(c, w, h, dt, time);
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (S.sec === 'watch') return tapWatch(x, y);
  if (S.sec) return;
  if (lab.view === 'above' && S.g1 === null) {
    let best = -1, bd = 40;
    SPOTS.forEach((sp, i) => { const d = Math.hypot(x - sp.px, y - sp.py); if (d < bd) { bd = d; best = i; } });
    if (best >= 0) pick1(best);
  } else if (lab.view === 'why' && S.g2 !== null) {
    let best = null, bd = 28;
    BADGES.forEach((i) => { const p = PLOTS[i]; if (p.bx === undefined) return; const d = Math.hypot(x - p.bx, y - p.by); if (d < bd) { bd = d; best = i; } });
    if (best === null) { for (let k = HIT.length - 1; k >= 0; k--) { const q = HIT[k]; if (x >= q.x - 3 && x <= q.x + q.w + 3 && y >= q.y - 3 && y <= q.y + q.h + 3) { best = q.i; break; } } }
    if (best !== null) { S.pick = best; sfx.click(); render(); }
  }
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function pick1(i) { S.g1 = i; S.year = 1985; S.play = true; S.done1 = false; sfx.click(); render(); }
function pick2(i) { S.g2 = i; S.rev2 = 0; S.pick = null; (i === RIGHT ? sfx.good : sfx.bad)(); render(); showStage(); }
function pick3(i) { S.g3 = i; S.t3 = 0; S.n3 = 0; S.fin3 = false; S.m3 = 'min'; sfx.click(); render(); }
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-a]'); if (!b) return;
  if (lab.view === 'why') pick2(+b.dataset.a); else if (lab.view === 'much') pick3(+b.dataset.a);
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'again1') { S.g1 = null; S.year = 1985; S.play = false; S.done1 = false; sfx.click(); }
  else if (a === 'again2') { S.g2 = null; S.rev2 = 0; S.pick = null; sfx.click(); }
  else if (a === 'again3') { S.g3 = null; S.t3 = 0; S.n3 = 0; S.fin3 = false; S.m3 = 'min'; S.fast = false; S.cl = null; sfx.click(); }
  else if (a === 'm3') { if (S.g3 === null) return; S.m3 = b.dataset.m; if (S.m3 === 'year') S.ice = 0; sfx.click(); if (S.m3 === 'year') showStage(); }
  else if (a === 'fast') { S.fast = !S.fast; sfx.click(); }
  else if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click();
    if (S.sec === 'plant') { S.py = 0; S.pyA = 0; $('py').value = 0; }
    if (S.sec === 'watch') resetWatch();
    S.y0 = 8; if (S.sec) showStage();
  }
  render();
});
$('yr').addEventListener('input', (ev) => { if (!S.done1) { ev.target.value = Math.round(S.year); return; } S.year = +ev.target.value; roReadout(); });
$('py').addEventListener('input', (ev) => { S.py = +ev.target.value; roReadout(); });

// --- readouts, state card, facts -----------------------------------------------------------------------------
function roReadout() {
  const t = T[lang], v = lab.view; let a;
  if (S.sec === 'plant') a = [esc(t.pl.yrs(Math.round(S.pyA))), t.model, t.pl.back(S.back || 0), '#6fb36f'];
  else if (S.sec === 'watch') a = [S.w.items.filter((q) => q.flag && !q.stopped).length, t.wa.val, t.wa.sent(S.w.handled), '#ff3b30'];
  else if (v === 'above') { const cl = Math.round(clearedAt(S.year)); a = [`${100 - cl} %`, t.v1.forest, t.v1.cleared(cl), '#6fb36f']; }
  else if (v === 'why') {
    if (S.g2 === null) a = ['?', '', '', '#d9825f'];
    else a = ['41 %', t.v2.share, S.pick !== null ? t.v2.names[PLOTS[S.pick].kind] : '', '#d9825f'];
  } else if (S.g3 === null) a = ['?', '', '', '#e0b050'];
  else if (S.m3 === 'year') a = [t.v3.big, t.v3.bigSub, t.v3.ice, '#d9825f'];
  else a = [S.n3, t.v3.unit(S.n3), `0:${String(Math.floor(S.t3)).padStart(2, '0')} / 1:00`, '#e0b050'];
  const k = a.join('|'); if (k === lastRO) return; lastRO = k;
  lab.setReadout(a[0], a[1], a[2], a[3]);
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  lastRO = '';
  document.body.dataset.v = sec || v;
  $('s1').style.display = !sec && v === 'above' ? '' : 'none';
  $('s2').style.display = !sec && v === 'why' ? '' : 'none';
  $('s3').style.display = !sec && v === 'much' ? '' : 'none';
  $('sP').style.display = sec === 'plant' ? '' : 'none';
  $('sW').style.display = sec === 'watch' ? '' : 'none';
  const open = secret.unlocked();
  $('secRow').innerHTML = [['plant', '🌱'], ['watch', '🛰️']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  // per-view labels and states
  $('yrL').textContent = t.yr; $('yr').disabled = !S.done1; $('ag1').textContent = t.again; $('ag1').hidden = !S.done1;
  $('pyL').textContent = t.pl.lab;
  $('ag2').textContent = t.again; $('ag2').hidden = S.g2 === null; $('h2').textContent = '';
  $('m3a').textContent = t.v3.min; $('m3b').textContent = t.v3.year; $('fastB').textContent = t.v3.fast; $('ag3').textContent = t.again;
  $('m3a').classList.toggle('on', S.m3 === 'min'); $('m3b').classList.toggle('on', S.m3 === 'year'); $('fastB').classList.toggle('on', S.fast);
  $('m3a').disabled = $('m3b').disabled = S.g3 === null; $('fastB').hidden = S.g3 === null || S.fin3 || S.m3 !== 'min'; $('ag3').hidden = S.g3 === null;
  $('hW').textContent = t.wa.hint;
  const F = (k) => ({ emo: '💡', text: t.facts[k], src: SRC[k] });
  let st, facts = [], ask = '';
  if (sec === 'plant') {
    const p = S.py, i = p < 2 ? 0 : p < 8 ? 1 : p < 20 ? 2 : p < 40 ? 3 : 4;
    st = { emo: '🌱', title: t.pl.st[i], lead: t.pl.lead, body: t.pl.body };
  } else if (sec === 'watch') {
    st = S.w.msg ? { emo: '🚙', title: t.wa.okT, lead: t.wa.okL, body: t.wa.body } : { emo: '🛰️', title: t.wa.t, lead: t.wa.lead, body: t.wa.body };
    facts = [F('a2')];
  } else if (v === 'above') {
    if (S.g1 === null) { st = { emo: '🤔', title: t.v1.q, lead: t.v1.hint, body: '' }; ask = `<div class="q">${esc(t.v1.q)}</div><p>${esc(t.v1.hint)}</p>`; }
    else if (!S.done1) st = { emo: '🛰️', title: t.v1.playT, lead: t.v1.playL, body: '' };
    else { st = { emo: S.g1 === RIGHT ? '✅' : '🤔', title: t.v1.doneT, lead: `${S.g1 === RIGHT ? t.ok : t.no} ${S.g1 === RIGHT ? t.v1.okLead : t.v1.noLead}`, body: t.v1.doneB }; facts = [F('a2'), F('a1')]; }
  } else if (v === 'why') {
    const o = t.v2;
    if (S.g2 === null) {
      st = { emo: '🤔', title: o.q, lead: o.hint, body: '' };
      ask = `<div class="q">${esc(o.q)}</div><div class="df-opts">${o.opts.map((x, i) => `<button data-a="${i}">${esc(x)}</button>`).join('')}</div>`;
    } else {
      const okA = S.g2 === RIGHT;
      ask = `<div class="v" style="color:${okA ? 'var(--ok)' : 'var(--wip)'}">${esc(okA ? t.ok : t.no)}</div><div class="df-bars">
        <div class="df-row"><span>${esc(o.beef)}</span><div class="tr"><i class="a" style="width:82%"></i></div><b>${esc(o.beefV)}</b></div>
        <div class="df-row"><span>${esc(o.oth)}</span><div class="tr"><i class="b" style="width:56%"></i></div><b>${esc(o.othV)}</b></div></div>`;
      if (S.pick === null) st = { emo: '🪓', title: o.tapT, lead: o.tapL, body: o.shared };
      else { const k = o.kinds[PLOTS[S.pick].kind]; st = { emo: ICONS[PLOTS[S.pick].kind], title: k[0], lead: k[1], body: o.shared }; }
      facts = [F('a3')];
    }
  } else {
    const o = t.v3;
    if (S.g3 === null) { st = { emo: '🤔', title: o.q, lead: o.hint, body: '' }; ask = `<div class="q">${esc(o.q)}</div><div class="df-opts">${o.opts.map((x, i) => `<button data-a="${i}">${esc(x)}</button>`).join('')}</div>`; }
    else if (S.m3 === 'year') { st = { emo: '🇮🇸', title: o.yearT, lead: o.yearL, body: o.yearB }; facts = [F('f4'), F('a1')]; }
    else if (!S.fin3) st = { emo: '⏱️', title: o.runT, lead: o.runL, body: '' };
    else { st = { emo: S.g3 === RIGHT ? '✅' : '🏟️', title: o.doneT, lead: o.doneL, body: o.doneB }; facts = [F('a1'), F('f4')]; }
  }
  if (!sec && v === 'above') facts = [F('a1'), F('a2')];
  if (!sec && v === 'why') facts = [F('a3'), F('a1')];
  if (!sec && v === 'much') facts = [F('f4')];
  lab.setState({ ...st, extra: '' });
  lab.setFacts(facts);
  askEl.style.display = ask ? '' : 'none'; askEl.innerHTML = ask;
  if (!ask) askEl.style.display = 'none';
  // the card stays visible after a view-2 answer so the bars can be read
  lab.setGlow(sec === 'watch' ? 'rgba(255,59,48,.2)' : sec === 'plant' ? 'rgba(111,179,111,.26)' : v === 'why' ? 'rgba(217,130,95,.24)' : v === 'much' ? 'rgba(224,176,80,.24)' : 'rgba(95,168,120,.26)');
  roReadout();
}
render();
</script>
</body>
</html>
