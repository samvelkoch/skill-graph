// ---- 2. Model: a mountain is the sum of its layers -----------------------------------------------------
// A layer is a bump centred on the vent: amp = height (share of canvas height), ww = half-width (share of canvas width),
// g = how much of it has been laid down so far (0..1, animated while an eruption builds it).
const bump = (u) => { u = Math.abs(u); if (u >= 1) return 0; const q = 1 - u * u; return q * q; };
const ease = (g) => g * g * (3 - 2 * g);
const mkLayer = (type, amp, ww, g = 1) => ({ type, amp, ww, g });
const rnd = (a, b) => a + Math.random() * (b - a);
const hash = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const font = (px, wt = 800) => `${wt} ${Math.round(px)}px Nunito, ui-rounded, system-ui, sans-serif`;
const mix = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
const rgb = (a) => `rgb(${a[0]},${a[1]},${a[2]})`;

// height of the mountain (px) at distance dx from the vent; the crater is a small bowl cut into the top
function prof(L, dx, w, h) {
  let s = 0, pk = 0;
  for (const l of L) { const a = l.amp * l.g * h; s += a * bump(dx / (l.ww * w)); pk += a; }
  return s - Math.min(pk * 0.1, h * 0.03) * bump(dx / Math.max(8, w * 0.04));
}
const peakPx = (L, h) => L.reduce((s, l) => s + l.amp * l.g * h, 0);

const SC = {

  build: { layers: [], n: 0, sts: [], alt: 0 },
  island: { layers: [], n: 0, sts: [], alt: 0 },
};
// where things sit in the cut-away, for each scene
function geo(key, w, h) {
  if (key === 'inside') return { gy: h * .40, chY: h * .84, rx: Math.min(w * .17, 110), ry: h * .075, sea: null };
  if (key === 'build') return { gy: h * .55, chY: h * .87, rx: Math.min(w * .15, 100), ry: h * .06, sea: null };
  return { gy: h * .72, chY: h * .90, rx: Math.min(w * .15, 100), ry: h * .05, sea: h * .35 };
}

function startErupt(key, quick) {

  S.er = { phase: 'rise', key, kind, t: 0, ts: quick ? 3 : 1, hold: 0, rate: { runny: .9, mid: 1.1, sticky: 1.6, island: 1.1 }[kind] };

function beginGo(e) {

  e.phase = 'go'; e.t = 0; e.flip = true; e.acc = 0; e.sacc = 0; e.aacc = 0; e.grow = []; e.lava = null; e.ash = null; e.fountain = null; e.feed = 1.4; e.D = 0; e.col = 1;

  } else if (e.kind === 'island') {

// ---- particles and the clock of the scene ----
function craterPos(key, w, h) { const G = geo(key, w, h); return { x: w / 2, y: G.gy - prof(SC[key].layers, 0, w, h) }; }
function spawnSpark(w, h) {
  const key = sceneKey(), c = craterPos(key, w, h), a = -Math.PI / 2 + rnd(-.55, .55), sp = rnd(.45, .8) * h;
  S.pt.push({ k: 'spark', x: c.x + rnd(-3, 3), y: c.y - 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: 0, life: 2 });
}
function spawnAsh(h, burst) {
  const w = S.dims.w, c = craterPos(sceneKey(), w, h), a = -Math.PI / 2 + rnd(-.45, .45), sp = rnd(.3, burst ? .5 : .38) * h;
  S.pt.push({ k: 'ash', x: c.x + rnd(-4, 4), y: c.y - 4, vx: Math.cos(a) * sp * .5 + 14, vy: Math.sin(a) * sp, age: 0, life: rnd(3.4, 5), r0: rnd(3, 5), r1: rnd(12, burst ? 24 : 18), g: rnd(95, 150) });
}
function spawnSteam(x, y) { S.pt.push({ k: 'steam', x: x + rnd(-6, 6), y, vx: rnd(-6, 12), vy: -rnd(22, 45), age: 0, life: 2.2, r0: 4, r1: 16 }); }

function update(dt, w, h) {
  S.dims = { w, h };
  const key = sceneKey(); if (!key) return;
  if (key === 'inside' && !S.answered) return;
  const sc = SC[key], G = geo(key, w, h), cx = w / 2, g = G.gy;
  if (!S.er && S.queue > 0 && key === 'build') { S.queue--; startErupt('build', true); }
  const e = S.er;
  if (!e) {
    if (key === 'inside') { if (!S.sleep) { S.p = Math.min(1, S.p + dt / 12); if (S.p >= 1) { S.er = { phase: 'rise', key: 'inside', kind: 'inside', t: 0, ts: 1, hold: 0, rate: 1 }; beginGo(S.er); } } }
    else S.p = Math.max(0, S.p - dt * 2);
  } else if (e.phase === 'rise') {
    S.p = Math.min(1, S.p + dt * e.rate);
    if (S.p >= 1) { e.hold += dt; if (e.hold >= (e.kind === 'sticky' ? .5 : 0)) beginGo(e); }
  } else {
    e.t += dt;
    e.grow.forEach((q) => { q.l.g = ease(clamp((e.t - q.g0) / q.gd, 0, 1)); });
    const c = craterPos(key, w, h), above = G.sea === null || c.y < G.sea;
    if (e.fountain && e.t < e.fountain.dur && above) { e.acc += e.fountain.rate * dt; while (e.acc >= 1) { e.acc--; spawnSpark(w, h); } }
    if (e.ash && e.t >= (e.ash.start || 0) && e.t < (e.ash.start || 0) + e.ash.emit && above) { e.aacc += e.ash.rate * dt; while (e.aacc >= 1) { e.aacc--; spawnAsh(h, false); } }
    if (key === 'island') { // steam where hot lava meets the sea
      const lavaOn = e.t < (e.lava.start + e.D / (e.lava.speed * w) + .5);
      if (lavaOn) {
        e.sacc += 16 * dt;
        while (e.sacc >= 1) {
          e.sacc--;
          if (above) {
            const side = Math.random() < .5 ? -1 : 1; let x = 0;
            while (x < w * .4 && g - prof(sc.layers, side * x, w, h) < G.sea) x += 4;
            if (x < w * .4) spawnSteam(cx + side * x, G.sea);
          } else spawnSteam(cx, G.sea);
        }
      }
      if (!S.islandUp && peakPx(sc.layers, h) >= g - G.sea) { S.islandUp = true; sfx.good(); render(); }
    }
    S.p = Math.max(0, 1 - e.t / 2.5); e.col = 1 - clamp((e.t - e.feed) / 1.5, 0, 1);
    if (e.t >= e.end) finish(e);
  }
  // bubbles: more pressure, more bubbles
  const go = S.er?.phase === 'go';
  if (!go) { S.bacc += (1.5 + 14 * S.p) * dt; while (S.bacc >= 1 && S.bub.length < 70) { S.bacc--; S.bub.push({ x: cx + rnd(-.7, .7) * G.rx, y: G.chY + rnd(-.3, .6) * G.ry, r: rnd(1.5, 3.8), v: rnd(18, 38) * (h / 300) * (1 + S.p * 2) }); } S.bacc = Math.min(S.bacc, 1); }
  const yTop = g - prof(sc.layers, 0, w, h), chTop = G.chY - G.ry * .85, col = go ? S.er.col : S.p, colY = chTop + (yTop - chTop) * col;
  S.bub = S.bub.filter((b) => { b.y -= b.v * dt; if (b.y < chTop) b.x += (cx - b.x) * Math.min(1, dt * 6); return b.y > colY + 2 && b.y > yTop; });
  // particles
  S.pt = S.pt.filter((q) => {
    q.age += dt;
    if (q.k === 'spark') { q.vy += h * 1.4 * dt; q.x += q.vx * dt; q.y += q.vy * dt; return q.age < q.life && q.y < g - prof(sc.layers, q.x - cx, w, h) - 1; }
    if (q.k === 'ash') { q.vy = Math.min(q.vy + h * .3 * dt, h * .07); q.vx += (14 - q.vx) * dt; q.x += q.vx * dt; q.y += q.vy * dt; return q.age < q.life && q.y < g - prof(sc.layers, q.x - cx, w, h) - 1; }
    q.x += q.vx * dt; q.y += q.vy * dt; return q.age < q.life;
  });
  const ash = S.pt.filter((q) => q.k === 'ash' && q.age > .3);
  S.ashC = ash.length > 6 ? { x: ash.reduce((a, q) => a + q.x, 0) / ash.length, y: ash.reduce((a, q) => a + q.y, 0) / ash.length } : null;
  S.flash = Math.max(0, S.flash - dt * 2.5); S.boom = Math.max(0, S.boom - dt * 14);
}

// light comes from the upper left; the scene is at dusk, so rims are warm and shadows are violet
const LAVA_HOT = [255, 138, 61], LAVA_CORE = [255, 236, 150], LAVA_COLD = [58, 52, 64];
const ridgeY = (x, seed) => .55 + .25 * Math.sin(x * .011 + seed) + .14 * Math.sin(x * .027 + seed * 2.3) + .06 * Math.sin(x * .071 + seed * 4.1);
const wob = (x, k) => Math.sin(x * .021 + k * 1.7) * 3 + Math.sin(x * .057 + k * 3.1) * 1.6;
let ashPat = null;
function ashPattern(c) {

  const hit = [...S.hits].reverse().find((q) => x >= q.x - 4 && x <= q.x + q.w + 4 && y >= q.y - 4 && y <= q.y + q.h + 4);
  if (hit) key = hit.key;
  else if (Math.abs(x - g.cx) < g.cw * 1.3 && Math.abs(y - g.yTop) < 16) key = 'crater';
  else if (Math.abs(x - g.cx) < g.pw + 8 && y > g.yTop && y < g.chTop) key = 'vent';
  else if (((x - g.cx) / g.rx) ** 2 + ((y - g.chY) / g.ry) ** 2 < 1.2) key = 'chamber';
  else if (S.lavaPts.some((p) => Math.hypot(p[0] - x, p[1] - y) < 24)) key = 'lava';
  else if (S.ashC && Math.hypot(S.ashC.x - x, S.ashC.y - y) < 44) key = 'ash';
  else if (y < g.gy && y > g.gy - prof(SC.inside.layers, x - g.cx, w, h) - 4 && y <= g.gy) key = 'layers';
  S.sel = key === S.sel ? null : key; sfx.click(); render();
});
