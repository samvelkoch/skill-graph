// ---- 2. Model: a mountain is the sum of its layers -----------------------------------------------------
// A layer is a bump centred on the vent: amp = height (share of canvas height), ww = half-width (share of canvas width),
// g = how much of it has been laid down so far (0..1, animated while an eruption builds it).
const bump = (u) => { u = Math.abs(u); if (u >= 1) return 0; const q = 1 - u * u; return q * q; };
const ease = (g) => g * g * (3 - 2 * g);
const mkLayer = (type, amp, ww, g = 1) => ({ type, amp, ww, g });
const rnd = (a, b) => a + Math.random() * (b - a);
const hash = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const font = (px, wt = 800) => `${wt} ${Math.round(px)}px Nunito, ui-rounded, system-ui, sans-serif`;
const mix = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
const rgb = (a) => `rgb(${a[0]},${a[1]},${a[2]})`;

// height of the mountain (px) at distance dx from the vent; the crater is a small bowl cut into the top
function prof(L, dx, w, h) {
  let s = 0, pk = 0;
  for (const l of L) { const a = l.amp * l.g * h; s += a * bump(dx / (l.ww * w)); pk += a; }
  return s - Math.min(pk * 0.1, h * 0.03) * bump(dx / Math.max(8, w * 0.04));
}
const peakPx = (L, h) => L.reduce((s, l) => s + l.amp * l.g * h, 0);

  build: { layers: [], n: 0, sts: [], alt: 0 },
  island: { layers: [], n: 0, sts: [], alt: 0 },

// where things sit in the cut-away, for each scene
function geo(key, w, h) {
  if (key === 'inside') return { gy: h * .40, chY: h * .84, rx: Math.min(w * .17, 110), ry: h * .075, sea: null };
  if (key === 'build') return { gy: h * .55, chY: h * .87, rx: Math.min(w * .15, 100), ry: h * .06, sea: null };

}

// ---- particles and the clock of the scene ----
function craterPos(key, w, h) { const G = geo(key, w, h); return { x: w / 2, y: G.gy - prof(SC[key].layers, 0, w, h) }; }

  const key = sceneKey(), c = craterPos(key, w, h), a = -Math.PI / 2 + rnd(-.55, .55), sp = rnd(.45, .8) * h;
  S.pt.push({ k: 'spark', x: c.x + rnd(-3, 3), y: c.y - 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: 0, life: 2 });
}
function spawnAsh(h, burst) {
  const w = S.dims.w, c = craterPos(sceneKey(), w, h), a = -Math.PI / 2 + rnd(-.45, .45), sp = rnd(.3, burst ? .5 : .38) * h;
  S.pt.push({ k: 'ash', x: c.x + rnd(-4, 4), y: c.y - 4, vx: Math.cos(a) * sp * .5 + 14, vy: Math.sin(a) * sp, age: 0, life: rnd(3.4, 5), r0: rnd(3, 5), r1: rnd(12, burst ? 24 : 18), g: rnd(95, 150) });
}

function update(dt, w, h) {

    if (key === 'island') { // steam where hot lava meets the sea

      if (lavaOn) {

            if (x < w * .4) spawnSteam(cx + side * x, G.sea);

    }

    q.age += dt;
    if (q.k === 'spark') { q.vy += h * 1.4 * dt; q.x += q.vx * dt; q.y += q.vy * dt; return q.age < q.life && q.y < g - prof(sc.layers, q.x - cx, w, h) - 1; }
    if (q.k === 'ash') { q.vy = Math.min(q.vy + h * .3 * dt, h * .07); q.vx += (14 - q.vx) * dt; q.x += q.vx * dt; q.y += q.vy * dt; return q.age < q.life && q.y < g - prof(sc.layers, q.x - cx, w, h) - 1; }
    q.x += q.vx * dt; q.y += q.vy * dt; return q.age < q.life;
  });

}

}
function pathRR(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

function drawSky(c, w, bottom, glow, cx, cy, h) {
  const sk = c.createLinearGradient(0, 0, 0, bottom);
  sk.addColorStop(0, '#1b1f45'); sk.addColorStop(.6, '#46386d'); sk.addColorStop(1, '#c97b5a');
  c.fillStyle = sk; c.fillRect(0, 0, w, bottom);
  if (glow > 0.01) { const r = c.createRadialGradient(cx, cy, 0, cx, cy, h * .7); r.addColorStop(0, `rgba(255,150,70,${.38 * glow})`); r.addColorStop(1, 'rgba(255,150,70,0)'); c.fillStyle = r; c.fillRect(0, 0, w, bottom); }
}
function drawGround(c, w, h, G, island) {
  const g = c.createLinearGradient(0, G.gy, 0, h); g.addColorStop(0, '#34293a'); g.addColorStop(1, '#16121b');
  c.fillStyle = g; c.fillRect(0, G.gy, w, h - G.gy);
  c.strokeStyle = 'rgba(255,255,255,.05)'; c.lineWidth = 2;
  for (let k = 0; k < 5; k++) {
    const y0 = G.gy + (h - G.gy) * (k + .6) / 5.4; c.beginPath();
    for (let x = 0; x <= w; x += 12) c.lineTo(x, y0 + Math.sin(x * .02 + k * 2) * 3 + hash(k) * 4);
    c.stroke();
  }
  c.fillStyle = island ? '#8a7656' : '#4c6044'; c.fillRect(0, G.gy, w, 3);
}
function drawMountain(c, L, cx, gy, w, h) {
  const act = L.filter((l) => l.g > 0.002); if (!act.length) return;
  const W = Math.max(...act.map((l) => l.ww * w)), N = 100, cw = Math.max(8, w * .04);
  const run = new Float32Array(N + 1), rows = []; let pk = 0;
  for (const l of act) {
    const a = l.amp * l.g * h, ww = l.ww * w; pk += a; const cd = Math.min(pk * .1, h * .03), ys = new Float32Array(N + 1);
    for (let j = 0; j <= N; j++) { const dx = -W + 2 * W * j / N; run[j] += a * bump(dx / ww); ys[j] = gy - (run[j] - cd * bump(dx / cw)); }
    rows.push({ l, ys });
  }
  for (let i = rows.length - 1; i >= 0; i--) {
    const { l, ys } = rows[i];
    c.beginPath(); c.moveTo(cx - W, gy);
    for (let j = 0; j <= N; j++) c.lineTo(cx - W + 2 * W * j / N, ys[j]);
    c.lineTo(cx + W, gy); c.closePath();
    c.fillStyle = l.type === 'ash' ? ashPattern(c) : (i % 2 ? '#4b4753' : '#3c3944'); c.fill();
    c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 1; c.beginPath();
    for (let j = 0; j <= N; j++) c[j ? 'lineTo' : 'moveTo'](cx - W + 2 * W * j / N, ys[j]);
    c.stroke();
  }
}

// labels: a pill of text, a thin leader line and a dot on the part. Registers a tap area.
function tag(c, w, key, text, px, py, ax, ay, align, opt = {}) {
  c.font = font(12.5);
  let lines = [text];
  if (c.measureText(text).width > w * .34 && text.includes(' ')) {
    const mid = text.length / 2; let best = -1;
    for (let i = 0; i < text.length; i++) if (text[i] === ' ' && (best < 0 || Math.abs(i - mid) < Math.abs(best - mid))) best = i;
    lines = [text.slice(0, best), text.slice(best + 1)];
  }
  const tw = Math.max(...lines.map((s) => c.measureText(s).width)) + 14, th = lines.length * 15 + 7;
  let x = align === 'r' ? px - tw : align === 'c' ? px - tw / 2 : px; x = clamp(x, 4, w - tw - 4);
  const y = py - th / 2, sel = S.sel === key && mode() === 'inside';
  c.globalAlpha = opt.alpha ?? 1;
  if (ax !== undefined) {
    const sx = clamp(ax, x, x + tw), sy = clamp(ay, y, y + th);
    c.strokeStyle = 'rgba(237,239,247,.7)'; c.lineWidth = 1; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ax, ay); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ax, ay, 2.6, 0, 7); c.fill();
  }
  pathRR(c, x, y, tw, th, 9); c.fillStyle = 'rgba(14,16,32,.8)'; c.fill();
  c.strokeStyle = opt.edge || (sel ? '#fff' : 'rgba(255,255,255,.28)'); c.lineWidth = sel || opt.edge ? 2 : 1; c.stroke();
  c.fillStyle = '#EDEFF7'; c.textAlign = 'center'; c.textBaseline = 'middle';
  lines.forEach((s, i) => c.fillText(s, x + tw / 2, y + 3.5 + 7.5 + i * 15));
  c.globalAlpha = 1;
  if (!opt.noHit) S.hits.push({ key, x, y, w: tw, h: th });
}

function drawLava(c, e, sc, cx, gy, w, h) {
  S.lavaPts = []; if (!e.lava) return;
  const tt = e.t - e.lava.start; if (tt <= 0) return;
  const sp = e.lava.speed * w, Dc = Math.min(e.D, sp * tt), step = 5; c.lineCap = 'round';
  for (const side of [-1, 1]) {
    let prev = null;
    for (let x = 0; ; x += step) {
      const xx = Math.min(x, Dc), reach = e.lava.start + xx / sp, age = e.t - Math.max(reach, e.feed), temp = clamp(1 - age / 3, 0, 1);
      const px = cx + side * xx, py = gy - prof(sc.layers, side * xx, w, h) - 2;
      if (prev) {
        c.strokeStyle = rgb(mix(LAVA_COLD, LAVA_HOT, prev[2])); c.lineWidth = e.lava.thick; c.beginPath(); c.moveTo(prev[0], prev[1]); c.lineTo(px, py); c.stroke();
        c.strokeStyle = rgb(mix(LAVA_COLD, LAVA_CORE, temp * temp)); c.lineWidth = e.lava.thick * .4; c.stroke();
      }
      prev = [px, py, temp]; if (xx >= Dc) break;
    }
    S.lavaPts.push([cx + side * Dc * .5, gy - prof(sc.layers, side * Dc * .5, w, h) - 2]);
  }
}

function drawScene(c, w, h, dt, time, key) {
  const sc = SC[key], G = geo(key, w, h), cx = w / 2, gy = G.gy, e = S.er, go = e?.phase === 'go';
  const pw = Math.max(4, w * .012), chTop = G.chY - G.ry * .85, cw = Math.max(8, w * .04);
  const yTop = gy - prof(sc.layers, 0, w, h), col = go ? e.col : S.p, colY = chTop + (yTop - chTop) * col;
  S.geom = { cx, gy, chTop, chY: G.chY, rx: G.rx, ry: G.ry, pw, yTop, cw, colY };
  const heat = go ? clamp(1 - (e.t - e.feed) / 3.5, 0, 1) : 0;
  let sh = (e && e.phase === 'rise' && e.kind === 'sticky' ? .4 + 2.2 * S.p ** 3 : 0) + S.boom * .5;
  c.save(); if (sh > 0) c.translate(rnd(-sh, sh), rnd(-sh, sh));
  const sea = G.sea;
  drawSky(c, w, sea ?? gy, heat, cx, yTop, h);
  if (sea !== null) { const wg = c.createLinearGradient(0, sea, 0, gy); wg.addColorStop(0, '#2a74b8'); wg.addColorStop(1, '#123a6b'); c.fillStyle = wg; c.fillRect(0, sea, w, gy - sea); }
  drawGround(c, w, h, G, sea !== null);
  drawMountain(c, sc.layers, cx, gy, w, h);

  // the pipe, the magma column in it, and the chamber
  c.fillStyle = '#120e16'; pathRR(c, cx - pw, yTop, pw * 2, chTop - yTop + 6, 2); c.fill();
  const pulse = .5 + .5 * Math.sin(time * 2.2);
  if (col > 0.01) {
    const mg = c.createLinearGradient(0, colY, 0, chTop); mg.addColorStop(0, '#ffb347'); mg.addColorStop(1, '#e8431f');
    c.fillStyle = mg; c.fillRect(cx - pw + 1, colY, pw * 2 - 2, chTop - colY + 6);
  }
  const gl = c.createRadialGradient(cx, G.chY, 0, cx, G.chY, G.rx * 1.8); gl.addColorStop(0, `rgba(255,120,40,${.28 + .15 * pulse + .2 * S.p})`); gl.addColorStop(1, 'rgba(255,120,40,0)');
  c.fillStyle = gl; c.fillRect(cx - G.rx * 1.8, G.chY - G.rx * 1.8, G.rx * 3.6, G.rx * 3.6);
  c.fillStyle = '#1a1118'; c.beginPath(); c.ellipse(cx, G.chY, G.rx + 4, G.ry + 4, 0, 0, 7); c.fill();
  const cg = c.createRadialGradient(cx, G.chY - G.ry * .2, 0, cx, G.chY, G.rx); cg.addColorStop(0, '#ffc15a'); cg.addColorStop(.55, '#f0561f'); cg.addColorStop(1, '#a3200f');
  c.save(); c.translate(cx, G.chY); c.scale(1 + .02 * pulse, 1 + .03 * pulse); c.translate(-cx, -G.chY); c.fillStyle = cg; c.beginPath(); c.ellipse(cx, G.chY, G.rx, G.ry, 0, 0, 7); c.fill(); c.restore();
  for (const b of S.bub) { c.strokeStyle = 'rgba(255,236,170,.85)'; c.lineWidth = 1; c.beginPath(); c.arc(b.x, b.y, b.r, 0, 7); c.stroke(); }
  if (go) { const lg = c.createRadialGradient(cx, yTop, 0, cx, yTop, 28); lg.addColorStop(0, `rgba(255,190,90,${.7 * (1 - clamp((e.t - e.feed) / 1.5, 0, 1))})`); lg.addColorStop(1, 'rgba(255,150,60,0)'); c.fillStyle = lg; c.fillRect(cx - 30, yTop - 30, 60, 60); }
  if (S.sel && key === 'inside') { // highlight the chosen part
    c.strokeStyle = '#fff'; c.lineWidth = 2;
    if (S.sel === 'chamber') { c.beginPath(); c.ellipse(cx, G.chY, G.rx + 5, G.ry + 5, 0, 0, 7); c.stroke(); }
    else if (S.sel === 'vent') { pathRR(c, cx - pw - 2, yTop, pw * 2 + 4, chTop - yTop + 6, 3); c.stroke(); }
    else if (S.sel === 'crater') { c.beginPath(); c.arc(cx, yTop - 2, cw * 1.1, Math.PI * 1.05, Math.PI * 1.95); c.stroke(); }
  }
  if (go) drawLava(c, e, sc, cx, gy, w, h); else S.lavaPts = [];
  for (const q of S.pt) {
    if (q.k === 'spark') { c.fillStyle = q.age < .5 ? '#ffd45e' : '#ff8a3d'; c.beginPath(); c.arc(q.x, q.y, 2.4, 0, 7); c.fill(); }
    else if (q.k === 'ash') {
      const f = q.age / q.life, r = lerp(q.r0, q.r1, Math.min(1, f * 1.5)); c.globalAlpha = .55 * Math.min(1, (1 - f) / .3);
      c.fillStyle = `rgb(${q.g},${q.g - 4},${q.g + 6})`; c.beginPath(); c.arc(q.x, q.y, r, 0, 7); c.fill(); c.globalAlpha = 1;
    }
  }
  if (S.flash > 0) { const fr = h * .22 * (1.3 - S.flash * .3), fg = c.createRadialGradient(cx, yTop, 0, cx, yTop, fr); fg.addColorStop(0, `rgba(255,240,200,${S.flash})`); fg.addColorStop(.4, `rgba(255,160,70,${S.flash * .6})`); fg.addColorStop(1, 'rgba(255,120,40,0)'); c.fillStyle = fg; c.beginPath(); c.arc(cx, yTop, fr, 0, 7); c.fill(); }

  if (sea !== null) { // the sea in front of the volcano
    const ov = c.createLinearGradient(0, sea, 0, gy); ov.addColorStop(0, 'rgba(60,150,220,.5)'); ov.addColorStop(1, 'rgba(20,70,140,.68)');
    c.fillStyle = ov; c.fillRect(0, sea, w, gy - sea);
    c.strokeStyle = 'rgba(200,230,255,.85)'; c.lineWidth = 2; c.beginPath();
    for (let x = 0; x <= w; x += 8) c[x ? 'lineTo' : 'moveTo'](x, sea + Math.sin(x * .05 + time * 1.5) * 2);
    c.stroke();
  }
  for (const q of S.pt) if (q.k === 'steam') { const f = q.age / q.life; c.globalAlpha = .42 * (1 - f); c.fillStyle = '#f2f6ff'; c.beginPath(); c.arc(q.x, q.y, lerp(q.r0, q.r1, f), 0, 7); c.fill(); c.globalAlpha = 1; }

  // labels
  S.hits = [];
  const t = T[lang].lbl;
  if (key === 'inside') {
    const flank = (f) => { let x = 0; const hh = prof(sc.layers, 0, w, h) * f; while (x < w / 2 && prof(sc.layers, x, w, h) > hh) x += 3; return { x: cx + x, y: gy - prof(sc.layers, x, w, h) }; };
    tag(c, w, 'chamber', t.chamber, 6, G.chY, cx - G.rx * .7, G.chY, 'l');
    tag(c, w, 'vent', t.vent, w - 6, chTop - (chTop - gy) * .45, cx + pw, chTop - (chTop - gy) * .45, 'r');
    tag(c, w, 'crater', t.crater, 6, Math.max(16, yTop - 28), cx - cw * .5, yTop, 'l');
    const f = flank(.35); tag(c, w, 'layers', t.layers, w - 6, gy + 16, f.x, f.y + 2, 'r');
    if (go && e.lava && S.lavaPts[1] && e.t > .9) tag(c, w, 'lava', t.lava, S.lavaPts[1][0] + 12, S.lavaPts[1][1] - 26, S.lavaPts[1][0], S.lavaPts[1][1], 'c');
    if (S.ashC) tag(c, w, 'ash', t.ash, S.ashC.x, S.ashC.y, undefined, undefined, 'c', { alpha: .95 });
    if (!go && col > .1) tag(c, w, 'magma', t.magma, cx + pw + 12, colY, cx + pw, colY, 'l');
    else if (go && e.t < .9) { // the key moment: the word "magma" reaches the crater and becomes "lava"
      const fl = clamp(e.t / .5, 0, 1), px = cx + pw + 12;
      tag(c, w, 'magma', t.magma, px, yTop - fl * 8, cx + pw, yTop, 'l', { alpha: 1 - fl, edge: '#ffb347', noHit: true });
      tag(c, w, 'lava', t.lava, px, yTop - 8 + (1 - fl) * 8, cx + pw, yTop, 'l', { alpha: fl, edge: '#ffb347' });
    }
  } else if (key === 'island') {
    tag(c, w, 'sea', t.sea, 6, (sea + gy) / 2 - 10, 40, (sea + gy) / 2 - 10, 'l', { noHit: true });
  }
  c.restore();
}

function drawBalaton(c, w, h, dt, time) {
  const t = T[lang], cx = w / 2;
  S.btv += (S.bt / 100 - S.btv) * (1 - Math.exp(-dt * 8));
  const E = ease(clamp(S.btv, 0, 1)), gy0 = h * .5, D = h * .16, Hc = h * .2, ww = w * .38, capW = w * .1, tc = h * .035;
  const Ht = Hc * bump(capW / ww), pwE = capW * (1.15 - .2 * E), edge = w * .035, yW = gy0 + D * .62;
  const ty = (dx) => { const hs = Math.min(Hc * bump(dx / ww), Ht), m = clamp((pwE + edge - Math.abs(dx)) / edge, 0, 1); return gy0 - hs + D * E * (1 - m); };
  drawSky(c, w, h, 0, cx, 0, h);
  const N = 120, xs = []; for (let j = 0; j <= N; j++) xs.push(-w / 2 + w * j / N);
  const outline = () => { c.beginPath(); c.moveTo(0, h); xs.forEach((dx) => c.lineTo(cx + dx, ty(dx))); c.lineTo(w, h); c.closePath(); };
  // soft sand, in layers that follow the old surface
  c.save(); outline(); c.clip();
  const cols = ['#dccb9c', '#cdb985', '#d6c9a8', '#c4ae7e'];
  for (let k = 0; k < 16; k++) {
    const o0 = k * h * .03 - h * .02, o1 = (k + 1) * h * .03 - h * .02, top = (dx) => gy0 - Math.min(Hc * bump(dx / ww), Ht);
    c.beginPath(); xs.forEach((dx, j) => c[j ? 'lineTo' : 'moveTo'](cx + dx, top(dx) + o0));
    for (let j = N; j >= 0; j--) c.lineTo(cx + xs[j], top(xs[j]) + o1);
    c.closePath(); c.fillStyle = cols[k % 4]; c.fill();
  }
  c.restore();
  // the lake sits where the ground has sunk below its level
  if (yW < gy0 + D * E + 1) {
    c.beginPath(); xs.forEach((dx, j) => c[j ? 'lineTo' : 'moveTo'](cx + dx, yW));
    for (let j = N; j >= 0; j--) c.lineTo(cx + xs[j], Math.max(yW, ty(xs[j])));
    c.closePath(); const lg = c.createLinearGradient(0, yW, 0, h); lg.addColorStop(0, '#4a9be0'); lg.addColorStop(1, '#1d5a96'); c.fillStyle = lg; c.fill();
    c.strokeStyle = 'rgba(220,240,255,.7)'; c.lineWidth = 1.5; c.beginPath();
    let pen = false;
    for (let x = 0; x <= w; x += 8) { if (ty(x - cx) > yW) { c[pen ? 'lineTo' : 'moveTo'](x, yW + Math.sin(x * .05 + time) * 1.5); pen = true; } else pen = false; }
    c.stroke();
  }
  // vineyards on the slopes that are left
  const va = clamp((E - .7) / .3, 0, 1);
  if (va > 0) for (const side of [-1, 1]) for (let dx = pwE + edge + 4; dx < ww * .85; dx += 6) {
    const y0 = ty(side * dx); if (y0 > yW - 3) continue;
    for (let r = 0; r < 3; r++) { c.globalAlpha = va; c.fillStyle = (Math.floor(dx / 6) + r) % 3 ? '#6aa84f' : '#8e44ad'; c.fillRect(cx + side * dx + r, y0 + 4 + r * 5, 2.5, 2.5); }
    c.globalAlpha = 1;
  }
  // the hard basalt cap
  const capTop = gy0 - Ht - tc, capX = cx - capW * 1.05;
  pathRR(c, capX, capTop, capW * 2.1, tc + 2, 4); c.fillStyle = '#2d2f3a'; c.fill();
  c.strokeStyle = '#4a4d5e'; c.lineWidth = 1.2;
  for (let k = 1; k < 6; k++) { const x = capX + capW * 2.1 * k / 6; c.beginPath(); c.moveTo(x, capTop + 3); c.lineTo(x, capTop + tc); c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,.15)'; c.fillRect(capX + 3, capTop, capW * 2.1 - 6, 2);
  // rain while the slider moves
  if (Math.abs(S.bt / 100 - S.btv) > .004) { c.strokeStyle = 'rgba(190,215,255,.45)'; c.lineWidth = 1; for (let i = 0; i < 28; i++) { const x = hash(i) * w, y = ((hash(i + 40) * h + time * 320) % (h * .5)); c.beginPath(); c.moveTo(x, y); c.lineTo(x - 3, y + 10); c.stroke(); } }
  S.hits = [];
  const tl = t.lbl;
  tag(c, w, 'basalt', tl.basalt, w - 6, capTop - 16, cx + capW * .6, capTop + tc * .5, 'r', { noHit: true });
  tag(c, w, 'sand', tl.sand, 6, gy0 + h * .12, cx - capW * .6, gy0 - Ht + h * .05, 'l', { noHit: true });
  if (yW < gy0 + D * E - 4) tag(c, w, 'lake', tl.lake, w - 6, yW + h * .1, cx + w * .38, yW + 8, 'r', { noHit: true });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const m = mode();
  if (m === 'balaton') { drawBalaton(c, w, h, dt, time); return; }
  dt *= S.er?.ts ?? 1;
  update(dt, w, h);
  drawScene(c, w, h, dt, time, sceneKey());
  if (Math.abs(S.p - S.gv) > .004) { lab.setGauge(S.p); S.gv = S.p; }
  const ok = m !== 'inside' || (S.p >= .4 && !S.er);
  if (ok !== S.lastOk) { S.lastOk = ok; const b = $('chips').querySelector('[data-k="erupt"]'); if (b) b.style.opacity = ok ? '' : '.45'; }
});

// tapping a label (or the part itself) in the inside view shows what it is
$('cv').addEventListener('pointerdown', (ev) => {
  if (mode() !== 'inside' || !S.answered || !S.geom) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, g = S.geom, { w, h } = S.dims;
  let key = null;
  const hit = [...S.hits].reverse().find((q) => x >= q.x - 4 && x <= q.x + q.w + 4 && y >= q.y - 4 && y <= q.y + q.h + 4);
  if (hit) key = hit.key;
  else if (Math.abs(x - g.cx) < g.cw * 1.3 && Math.abs(y - g.yTop) < 16) key = 'crater';
  else if (Math.abs(x - g.cx) < g.pw + 8 && y > g.yTop && y < g.chTop) key = 'vent';
  else if (((x - g.cx) / g.rx) ** 2 + ((y - g.chY) / g.ry) ** 2 < 1.2) key = 'chamber';
  else if (S.lavaPts.some((p) => Math.hypot(p[0] - x, p[1] - y) < 24)) key = 'lava';
  else if (S.ashC && Math.hypot(S.ashC.x - x, S.ashC.y - y) < 44) key = 'ash';
  else if (y < g.gy && y > g.gy - prof(SC.inside.layers, x - g.cx, w, h) - 4 && y <= g.gy) key = 'layers';
  S.sel = key === S.sel ? null : key; sfx.click(); render();
});
render();
</script>
</body>
