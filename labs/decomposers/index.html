      for (let i = 0; i < 26; i++) { const a = hash(i, 98) * 6.28, d = Math.sqrt(hash(i, 99)) * 0.85; c.fillStyle = '#d98a3a'; c.beginPath(); c.arc(cx + Math.cos(a) * 2.0 * PX * d, cy + Math.sin(a) * 1.45 * PX * d, 2.2, 0, 6.283); c.fill(); }
      c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(24, 262); c.lineTo(24 + PX, 262); c.moveTo(24, 257); c.lineTo(24, 267); c.moveTo(24 + PX, 257); c.lineTo(24 + PX, 267); c.stroke();
      c.globalAlpha = q; pill(c, t.saKm, 24 + PX / 2, 244);
      c.restore();
    }
    pill(c, t.saPill[Math.round(clamp(z, 0, 2))], BW / 2, 18);
  });
}
function drawSB(c, time) {
  const t = T[lang], v = S.vB, G = 214;
  frame(c, () => {
    const sk = c.createLinearGradient(0, 0, 0, G); sk.addColorStop(0, '#27425c'); sk.addColorStop(1, '#86b7a2'); c.fillStyle = sk; c.fillRect(0, 0, BW, G + 2);
    c.fillStyle = '#2c5446'; c.beginPath(); c.moveTo(0, G - 44); c.bezierCurveTo(70, G - 80, 130, G - 30, 200, G - 60); c.bezierCurveTo(260, G - 84, 300, G - 44, BW, G - 62); c.lineTo(BW, G); c.lineTo(0, G); c.closePath(); c.fill();
    const gg = c.createLinearGradient(0, G, 0, BH); gg.addColorStop(0, '#3b2a1c'); gg.addColorStop(1, '#22160e'); c.fillStyle = gg; c.fillRect(0, G, BW, BH - G);
    const dec = sm(1, 2.6, v), shrink = 1 - 0.42 * sm(1.2, 3, v), H = 70 * shrink, top = G - H, x0 = 56, x1 = 292;
    const bark = mixc('#5a3b27', '#3d2d20', dec), g = c.createLinearGradient(0, top, 0, G); g.addColorStop(0, mixc(bark, '#ffffff', 0.18)); g.addColorStop(0.45, bark); g.addColorStop(1, mixc(bark, '#000000', 0.4));
    c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 10; c.shadowOffsetY = 4; c.fillStyle = g; rr(c, x0, top, x1 - x0, H, H / 2.3); c.fill(); c.restore();
    c.save(); rr(c, x0, top, x1 - x0, H, H / 2.3); c.clip(); c.strokeStyle = `rgba(0,0,0,${0.28 * (1 - 0.5 * dec)})`; c.lineWidth = 1.4;
    for (let i = 0; i < 12; i++) { const x = x0 + 14 + i * 20 + hash(i, 5) * 8; c.beginPath(); c.moveTo(x, top); c.quadraticCurveTo(x + 6, top + H * 0.5, x - 2, G); c.stroke(); }
    c.restore();
    const endA = 1 - sm(0.8, 2, v);
    if (endA > 0.01) { c.save(); c.globalAlpha = endA; c.fillStyle = '#e0c08a'; c.beginPath(); c.ellipse(x0 + 4, top + H / 2, H * 0.25, H / 2, 0, 0, 6.283); c.fill(); c.strokeStyle = '#9a7040'; c.lineWidth = 1; for (const k of [0.3, 0.55, 0.8]) { c.beginPath(); c.ellipse(x0 + 4, top + H / 2, H * 0.25 * k, H / 2 * k, 0, 0, 6.283); c.stroke(); } c.restore(); }
    const moss = sm(0.4, 1.4, v);
    for (let i = 0; i < 60; i++) { if (i / 60 > moss) break; const x = x0 + 12 + hash(i, 7) * (x1 - x0 - 24), y = top + 3 + hash(i, 8) * H * 0.42, r = 3 + hash(i, 9) * 4, mg = c.createRadialGradient(x - 1, y - 1, 1, x, y, r); mg.addColorStop(0, '#9bd36a'); mg.addColorStop(1, '#3f7a2e'); c.fillStyle = mg; c.beginPath(); c.ellipse(x, y, r, r * 0.7, 0, 0, 6.283); c.fill(); }
    const br = sm(0.7, 1.5, v) * (1 - 0.85 * sm(2.2, 3, v));
    if (br > 0.02) [[112, 0.3, 14], [196, 0.5, 11], [256, 0.25, 12], [150, 0.7, 10]].forEach(([x, ky, s]) => { const y = top + H * ky; c.save(); c.globalAlpha = br; c.translate(x, y); c.scale(br, br); for (let k = 0; k < 3; k++) { c.fillStyle = ['#e6c9a0', '#d49a58', '#b97a3a'][k]; c.beginPath(); c.ellipse(0, k * 3.2, s - k * 2, 3.4, 0, 0, Math.PI); c.fill(); } c.restore(); });
    const hm = sm(1.5, 3, v); if (hm > 0.01) { for (let i = 0; i < 40; i++) { c.fillStyle = i % 2 ? '#4a3524' : '#33241a'; c.beginPath(); c.arc(x0 - 8 + hash(i, 11) * (x1 - x0 + 16), G - 1 + hash(i, 12) * 5, 2 + hash(i, 13) * 3, 0, Math.PI, true); c.globalAlpha = hm; c.fill(); } c.globalAlpha = 1; }
    const sd = sm(2.2, 3, v);
    if (sd > 0.01) [100, 175, 245].forEach((x, i) => { const hgt = (6 + 22 * sd) * (0.8 + 0.2 * i % 2), y0 = top + 4; c.strokeStyle = '#58a24a'; c.lineWidth = 2.2; c.lineCap = 'round'; c.beginPath(); c.moveTo(x, y0 + 3); c.quadraticCurveTo(x + 2, y0 - hgt * 0.5, x, y0 - hgt); c.stroke(); for (const sdx of [-1, 1]) { c.fillStyle = '#7fcf68'; c.beginPath(); c.ellipse(x + sdx * 5 * sd, y0 - hgt, 5 * sd + 0.5, 2.6 * sd + 0.4, sdx * -0.4, 0, 6.283); c.fill(); } });
    pill(c, t.sbChips[Math.round(clamp(v, 0, 3))], BW / 2, 18);
  });
}

// --- per-frame stepping and the draw loop ------------------------------------------------------------------------------
const canvas = $('cv');
let lastKey = '';
function step(dt) {
  const ek = (k) => 1 - Math.exp(-k * dt);
  S.dl += ((S.onD ? 1 : 0) - S.dl) * ek(3);
  const go = (cur, tgt, rate) => { const d = tgt - cur, m = rate * dt; return Math.abs(d) <= m ? tgt : cur + Math.sign(d) * m; };
  S.yr = go(S.yr, S.yrT, S.rate);
  if (S.runY && S.yr >= 10) { S.runY = false; render(); }
  S.dep += (depthAt(S.onD, S.yr) - S.dep) * ek(8); S.nut += (nutAt(S.onD, S.yr) - S.nut) * ek(8); S.tre += (treeAt(S.onD, S.yr) - S.tre) * ek(8);
  S.ti = go(S.ti, S.tiT, S.rateH);
  if (S.runH && S.ti >= 9) { S.runH = false; render(); }
  S.zA += (S.zT - S.zA) * ek(3); S.vB += (S.vT - S.vB) * ek(3);
  if (S.cyc >= 0) {
    S.cp = go(S.cp, S.cyc, 2.2);
    if (S.cyc === 5 && S.cp >= 4.999) { S.cyc = 0; S.cp = 0; render(); }
  }
  if (S.runY && lab.view === 'years' && !S.sec) $('yrR').value = S.yr;
  if (S.runH && lab.view === 'heap' && !S.sec) $('hpR').value = S.ti;
  liveReadout();
}
function liveReadout() {
  const t = T[lang], v = lab.view;
  let key = '';
  if (S.sec === 'a') key = `a${Math.round(clamp(S.zA, 0, 2))}${lang}`;
  else if (S.sec === 'b') key = `b${Math.round(clamp(S.vB, 0, 3))}${lang}`;
  else if (v === 'years') key = S.ansY === null ? `y?${lang}` : `y${fmt(S.dep)}|${Math.floor(S.yr + 0.9999)}|${lang}`;
  else if (v === 'heap') key = S.ran ? `h${fmtTime(timeAt(S.ti))}|${lang}` : `h?${lang}`;
  else return;
  if (key === lastKey) return; lastKey = key;
  if (S.sec === 'a') { const i = Math.round(clamp(S.zA, 0, 2)); lab.setReadout(i === 2 ? '≈ 9 km²' : i === 1 ? '🕸️' : '🍄', i === 2 ? t.saPill[2].split('·')[0].trim() : t.saA[i], '', '#d98a3a'); }
  else if (S.sec === 'b') { const i = Math.round(clamp(S.vB, 0, 3)); lab.setReadout(['🪵', '🍄', '🟤', '🌱'][i], t.sbChips[i], '', '#8a5a2b'); }
  else if (v === 'years') { if (S.ansY === null) lab.setReadout('?', t.litter, '', '#7a8bd1'); else lab.setReadout(`${fmt(S.dep)} ${esc(t.cm)}`, `${t.litter} · ${t.yearL} ${Math.floor(S.yr + 0.9999)}`, t.model, S.onD ? '#5fd68a' : '#d9a24a'); }
  else if (v === 'heap') { if (!S.ran) lab.setReadout('?', t.timeL, '', '#7a8bd1'); else lab.setReadout(fmtTime(timeAt(S.ti)), t.inHeap, t.model, '#d9a24a'); $('hpV').textContent = S.ran ? fmtTime(timeAt(S.ti)) : ''; }
  if (v === 'years') $('yrV').textContent = Math.round(S.yr);
}
function fmtTime(y) { const t = T[lang]; if (y < 0.04) return t.start; if (y < 0.97) return t.mo(Math.max(1, Math.round(y * 12))); return t.yr(Math.round(y)); }

canvasLoop(canvas, (c, w, h, dt, time) => {
  const { sc, ox, oy } = fitBox(w, h); LAY = { sc, ox, oy };
  step(dt);
  c.save(); c.translate(ox, oy); c.scale(sc, sc);
  if (S.sec === 'a') drawSA(c, time); else if (S.sec === 'b') drawSB(c, time);
  else if (lab.view === 'years') frame(c, () => drawYears(c, time));
  else if (lab.view === 'who') drawWho(c, time);
  else drawHeap(c, time);
  c.restore();
});

// --- controls ----------------------------------------------------------------------------------------------------------
const skSvg = (dep, k) => {
  const gy = 60, px = 2, top = gy - dep * px, n = Math.round(dep * 6); let chips = '';
  for (let i = 0; i < n; i++) { const x = 4 + hash(i, k) * 92, y = gy - hash(i, k + 5) * dep * px; chips += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="3.2" ry="1.5" fill="${CHIP[i % CHIP.length]}" transform="rotate(${(hash(i, k + 9) * 180).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`; }
  return `<svg viewBox="0 0 100 80" aria-hidden="true"><defs><linearGradient id="dcsk${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27425c"/><stop offset="1" stop-color="#86b7a2"/></linearGradient></defs><rect width="100" height="60" fill="url(#dcsk${k})"/><rect y="60" width="100" height="20" fill="#4a3020"/><rect x="47" y="24" width="6" height="36" fill="#6b4a33"/><circle cx="50" cy="16" r="14" fill="#3f9a4f"/><circle cx="42" cy="22" r="9" fill="#4aa85a"/><circle cx="58" cy="22" r="9" fill="#379046"/><rect x="0" y="${top.toFixed(1)}" width="100" height="${(gy - top + 1).toFixed(1)}" fill="#8a5428"/>${chips}</svg>`;
};
const JOB_ORDER = ['louse', 'worm', 'bact', 'fungus'];
const toDesign = (ev) => { const r = canvas.getBoundingClientRect(); return { x: (ev.clientX - r.left - LAY.ox) / LAY.sc, y: (ev.clientY - r.top - LAY.oy) / LAY.sc }; };
const allMatched = () => Object.keys(S.done).length === 4;
const cheer = () => { sfx.good(); };

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'skp') { if (S.ansY !== null) return; S.ansY = +b.dataset.k; (S.ansY === SK_OK ? sfx.good : sfx.bad)(); S.onD = false; S.yrT = 10; S.rate = 1; S.runY = true; S.yr = 0; showStage(); }
  else if (act === 'dec') { S.onD = b.dataset.on === '1'; sfx.click(); }
  else if (act === 'runY') {
    if (S.runY) { S.runY = false; S.yrT = S.yr; }
    else { if (S.yr >= 10) { S.yr = 0; S.dep = depthAt(S.onD, 0); S.nut = nutAt(S.onD, 0); S.tre = treeAt(S.onD, 0); } S.yrT = 10; S.rate = 1; S.runY = true; }
    sfx.click(); showStage();
  }
  else if (act === 'job') {
    const k = b.dataset.k;
    if (!S.sel) { S.whoMsg = T[lang].tapFirst; S.whoMsgKind = 'hint'; }
    else if (S.sel === k) { S.done[k] = true; S.sel = null; cheer(); if (allMatched()) { S.cyc = 0; S.cp = 0; S.whoMsg = T[lang].allDone; S.whoMsgKind = 'ok'; showStage(); } else { S.whoMsg = T[lang].whoRight; S.whoMsgKind = 'ok'; } }
    else { sfx.bad(); S.flash = { k: S.sel, t: performance.now() }; S.whoMsg = T[lang].whoWrong; S.whoMsgKind = 'no'; b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 400); }
    render();
  }
  else if (act === 'next') { sfx.click(); if (S.cyc < 4) S.cyc++; else S.cyc = 5; render(); }
  else if (act === 'pick') { if (S.ran) return; S.pick[b.dataset.i] = +b.dataset.o; sfx.tick(); render(); }
  else if (act === 'go') {
    if (!ITEMS.every((k) => S.pick[k] !== undefined)) { $('hpMsg').textContent = T[lang].goHint; $('hpMsg').className = 'dc-verdict hint'; return; }
    S.ran = true; S.ti = 0; S.tiT = 9; S.rateH = 1.1; S.runH = true; sfx.click(); render(); showStage();
  }
  else if (act === 'za') { S.zT = +b.dataset.z; sfx.click(); render(); }
  else if (act === 'vb') { S.vT = +b.dataset.v; sfx.click(); render(); }
  else if (act === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); lastKey = ''; showStage(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id === 'yrR') { S.yrT = +ev.target.value; S.rate = 5; S.runY = false; render(); }
  else if (ev.target.id === 'hpR') { S.tiT = +ev.target.value; S.rateH = 6; S.runH = false; }
});
canvas.addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'who' || allMatched()) return;
  const p = toDesign(ev);
  for (const [k, x, y] of CELLS) if (p.x >= x && p.x <= x + CW && p.y >= y && p.y <= y + CHH) { if (S.done[k]) return; S.sel = k; sfx.tick(); S.whoMsg = ''; render(); return; }
});

// --- one render per change -----------------------------------------------------------------------------------------------
function onLang() { lastKey = ''; render(); }
function onView() { S.sec = null; lastKey = ''; render(); }
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  show('dcYears', !sec && v === 'years'); show('dcWho', !sec && v === 'who'); show('dcHeap', !sec && v === 'heap'); show('dcSA', sec === 'a'); show('dcSB', sec === 'b');
  const open = secret.unlocked();
  $('dcSecs').innerHTML = [['a', '🍄'], ['b', '🪵']].map(([k, emo]) => `<button type="button" class="chip dc-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('gauge').style.visibility = 'hidden';
  lab.setGlow(sec === 'a' ? 'rgba(217, 138, 58, .26)' : sec === 'b' ? 'rgba(138, 90, 43, .28)' : v === 'years' ? 'rgba(95, 214, 138, .22)' : v === 'who' ? 'rgba(120, 190, 230, .24)' : 'rgba(217, 162, 74, .24)');
  if (sec === 'a') return renderSA(t);

}
function renderYears(t) {

  $('yrAsk').innerHTML = `<p class="dc-q">${esc(t.yAsk)}</p>${asked ? '' : `<p class="dc-pick">${esc(t.pick)}</p>`}
    <div class="dc-sks">${SKV.map((d, k) => `<button type="button" class="dc-sk ${asked ? (k === SK_OK ? 'good' : S.ansY === k ? 'bad' : '') : ''}" data-act="skp" data-k="${k}" ${asked ? 'disabled' : ''}>${skSvg(d, k)}<span>${esc(t.sk[k])}</span></button>`).join('')}</div>
    ${asked ? `<p class="dc-verdict ${S.ansY === SK_OK ? 'ok' : 'no'}">${esc(S.ansY === SK_OK ? t.yRight : t.yWrong)}</p>` : ''}`;
  $('yrCtl').hidden = !asked;
  $('yrTog').innerHTML = [[1, t.decOn], [0, t.decOff]].map(([on, l]) => `<button type="button" data-act="dec" data-on="${on}" class="${(S.onD ? 1 : 0) === on ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('yrL').textContent = t.yearL; $('yrR').value = S.yrT; $('yrV').textContent = Math.round(S.yr);
  $('yrRun').textContent = S.runY ? t.pause : t.run;
  if (!asked) { lab.setState({ emo: t.yAskSt[0], title: t.yAskSt[1], lead: t.yAskSt[2], body: '' }); lab.setFacts([]); return; }
  const st = S.onD ? t.yOn : t.yOff; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] }); lab.setFacts(t.facts.y);
}
function renderWho(t) {
  const all = allMatched();
  $('whJobs').style.display = all ? 'none' : 'grid';
  $('whJobs').innerHTML = JOB_ORDER.map((k) => `<button type="button" class="dc-job ${S.done[k] ? 'done' : ''}" data-act="job" data-k="${k}" ${S.done[k] ? 'disabled' : ''}>${S.done[k] ? `<b>✓ ${esc(t.names[k])}</b>` : ''}${esc(t.jobs[k])}</button>`).join('');
  $('whNextRow').hidden = !all || S.cyc < 0;
  $('whNext').textContent = S.cyc >= 4 ? t.again : t.next;
  $('whV').textContent = S.whoMsg; $('whV').className = 'dc-verdict ' + (S.whoMsgKind || '');
  if (!all) {
    const k = Object.keys(S.done).length;
    lab.setReadout(`${k} / 4`, t.matched, '', '#78bee6'); lastKey = '';
    lab.setState({ emo: t.whoSt[0], title: t.whoSt[1], lead: t.whoSt[2], body: '' }); lab.setFacts(t.facts.w0);
    return;
  }
  const i = Math.min(Math.max(S.cyc, 0), 4);
  lab.setReadout(`${i + 1} / 5`, t.stepL, '', '#58d68d'); lastKey = '';
  lab.setState({ emo: ['🌳', '🍂', '🍄', '🟤', '🌱'][i], title: t.cycT[i], lead: t.cycL[i], body: i === 4 ? t.cycEnd : '' }); lab.setFacts(t.facts.w1);
}
function renderHeap(t) {
  $('hpQ').textContent = t.hAsk;
  const ran = S.ran, ok = ITEMS.filter((k) => S.pick[k] === TRUTH[k]).length;
  $('hpRows').innerHTML = ITEMS.map((k) => `<div class="dc-hrow"><span class="dc-hn">${t.emo[k]} ${esc(t.items[k])}</span><div class="dc-opts">${t.opts.map((o, j) => {
    const cls = ran ? (j === TRUTH[k] ? 'good' : S.pick[k] === j ? 'bad' : '') : S.pick[k] === j ? 'on' : '';
    return `<button type="button" class="dc-o ${cls}" data-act="pick" data-i="${k}" data-o="${j}" ${ran ? 'disabled' : ''}>${esc(o)}</button>`;
  }).join('')}</div></div>`).join('');
  $('hpGoRow').hidden = ran; $('hpGo').textContent = t.go; $('hpRun').hidden = !ran; $('hpL').textContent = t.timeL;
  if (!ran) { $('hpMsg').textContent = ''; $('hpMsg').className = 'dc-verdict'; lab.setState({ emo: t.hAskSt[0], title: t.hAskSt[1], lead: t.hAskSt[2], body: '' }); lab.setFacts([]); return; }
  $('hpMsg').textContent = `${ok === 5 ? t.scoreAll : `${t.score(ok)} ${t.scoreRest}`}`; $('hpMsg').className = 'dc-verdict ' + (ok === 5 ? 'ok' : 'no');
  lab.setState({ emo: t.hSt[0], title: t.hSt[1], lead: t.hSt[2], body: t.hSt[3] }); lab.setFacts(t.facts.h);
}
function renderSA(t) {
  $('saTog').innerHTML = t.saChips.map((l, i) => `<button type="button" data-act="za" data-z="${i}" class="${S.zT === i ? 'on' : ''}">${esc(l)}</button>`).join('');
  const st = t.saSt[S.zT]; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] }); lab.setFacts(t.facts.sa); liveReadout();
}
function renderSB(t) {
  $('sbTog').innerHTML = t.sbChips.map((l, i) => `<button type="button" data-act="vb" data-v="${i}" class="${S.vT === i ? 'on' : ''}">${esc(l)}</button>`).join('');
  const st = t.sbSt[S.vT]; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] }); lab.setFacts(t.facts.sb); liveReadout();
}
render();
