const TAU = Math.PI * 2;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const sm = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const damp = (cur, tgt, k, dt) => cur + (tgt - cur) * (1 - Math.exp(-k * dt));
const lin = (cur, tgt, rate, dt) => cur + clamp(tgt - cur, -rate * dt, rate * dt);
const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t, al = 1) => { const A = rgb(a), B = rgb(b); return `rgba(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')},${al})`; };
const disc = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); };
const COOL = [110, 170, 255], WARM = [255, 150, 80];
const tmix = (t) => COOL.map((v, i) => Math.round(v + (WARM[i] - v) * clamp01(t))).join(',');
const tc = (h, al = 1) => mixc(h, '#0B1230', .55 * S.nt, al); // a colour seen at night

// a label with a dark pill behind it, kept inside the scene
function pill(c, text, x, y, W, H, size = 12) {
  c.save(); c.font = `800 ${size}px Nunito, sans-serif`;
  const tw = c.measureText(text).width + 16, th = size + 10;
  const px = clamp(x - tw / 2, 4, Math.max(4, W - tw - 4)), py = clamp(y - th / 2, 4, Math.max(4, H - th - 4));
  c.fillStyle = 'rgba(12,16,32,.82)'; c.beginPath(); c.roundRect(px, py, tw, th, th / 2); c.fill();
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, px + tw / 2, py + th / 2 + 1);
  c.restore();
}

// a glass thermometer: bulb centre (x, yb), tube height h, mercury level frac 0..1
function thermo(c, x, yb, h, f) {
  const w = 4.6, r = 6.4;
  c.save(); c.lineJoin = 'round';
  const g = c.createLinearGradient(x - w, 0, x + w, 0);
  g.addColorStop(0, 'rgba(255,255,255,.92)'); g.addColorStop(1, 'rgba(196,212,236,.82)');
  c.fillStyle = g; c.strokeStyle = 'rgba(28,38,70,.75)'; c.lineWidth = 1.2;
  c.beginPath(); c.roundRect(x - w, yb - h, w * 2, h, w); c.fill(); c.stroke();
  disc(c, x, yb, r); c.fill(); c.stroke();
  c.fillStyle = '#E5484D'; disc(c, x, yb, r - 1.8); c.fill();
  const mh = (h - 8) * clamp01(f);
  c.beginPath(); c.roundRect(x - 1.7, yb - mh, 3.4, mh + 2, 1.7); c.fill();
  c.strokeStyle = 'rgba(28,38,70,.5)'; c.lineWidth = 1; c.beginPath();
  for (let i = 1; i <= 4; i++) { const y = yb - r - (h - r - 10) * i / 5; c.moveTo(x + w, y); c.lineTo(x + w + 3, y); }
  c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x - w + 1.4, yb - h + 6); c.lineTo(x - w + 1.4, yb - r - 3); c.stroke();
  c.restore();
}

// a polyline that puffs of air can travel along
function mkPath(pts, closed) {
  const seg = []; let L = 0; const n = pts.length;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const a = pts[i], b = pts[(i + 1) % n], d = Math.hypot(b[0] - a[0], b[1] - a[1]) || .001;
    seg.push({ a, b, d, s: L, k: i }); L += d;
  }
  return {
    L, closed,
    at(s) {
      s = closed ? ((s % L) + L) % L : clamp(s, 0, L);
      let q = seg[seg.length - 1];
      for (const e of seg) if (s <= e.s + e.d) { q = e; break; }
      const u = clamp01((s - q.s) / q.d);

function beach(c, W, H, dt, t) {

  S.flow = damp(S.flow, (st === 1 && rt > 1.8) || (st === 3 && rt > .6) ? 1 : 0, 1.6, dt);
  S.thermo = damp(S.thermo, st === 0 ? 0 : st === 1 ? (rt > .9 ? 1 : 0) : 1, 3, dt);
  const dir = nightT > .5 ? -1 : 1;

// --- scene: trees stand still until the wind reaches them ----------------------------------------------------
function treesScene(c, W, H, dt, t) {
  const rev = S.gs === 5, rt = S.grt, v = W * .28;
  S.front = rev && rt > 1.1 ? (rt - 1.1) * v - 40 : -60;
  S.trW = damp(S.trW, S.front > 0 ? 1 : 0, 2, dt);
  let g = c.createLinearGradient(0, 0, 0, H * .8); g.addColorStop(0, '#7EC8F2'); g.addColorStop(1, '#CDEBFA');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 3; i++) cloud(c, ((i * W * .42 + t * 6 * S.trW + 40) % (W + 160)) - 80, H * (.1 + .07 * ((i * 2) % 3)), H * (.04 + .008 * i), 'rgba(255,255,255,.8)');
  const hill = (x0, y, rx, ry, col) => { c.fillStyle = col; c.beginPath(); c.ellipse(x0, y, rx, ry, 0, Math.PI, TAU); c.closePath(); c.fill(); };
  hill(W * .2, H * .8, W * .5, H * .13, '#A8D888'); hill(W * .85, H * .8, W * .55, H * .1, '#9ACF7A');
  g = c.createLinearGradient(0, H * .78, 0, H); g.addColorStop(0, '#8CCB6A'); g.addColorStop(1, '#5E9F4A');
  c.fillStyle = g; c.fillRect(0, H * .78, W, H * .22);
  const spec = [[.3, 1, 1], [.56, 1.15, 2], [.82, .95, 3]];
  spec.forEach(([fx, sz, seed], i) => {
    const q = S.tr[i], tx = W * fx, gust = .2 * (.85 + .15 * Math.sin(t * 2.3 + i)), tgt = S.front > tx ? gust : 0;
    q.om += ((tgt - q.th) * 38 - q.om * 5.5) * dt; q.th += q.om * dt;
    tree(c, tx, H * .88, H * .3 * sz, Math.min(W * .1, H * .1) * sz, q.th, Math.abs(q.th) * 5, t, seed, false);
  });

  if (S.front > -30) {
    const gap = W * .1, r = clamp(H * .024, 6, 10);
    for (let row = 0; row < 3; row++) {

// --- secret: the whole Earth -----------------------------------------------------------------------------------
function planetScene(c, W, H, dt, t) {
  S.pph += 34 * dt;
  const cx = W * .56, cy = H * .5, R = Math.min(W * .27, H * .33);
  for (const [x, y, r, p] of STARS) { c.fillStyle = `rgba(255,252,235,${(.3 + .3 * Math.sin(t * 1.4 + p)).toFixed(3)})`; disc(c, x * W, y * 2 * H * .97, r * .8); c.fill(); }

  glow(c, sx, cy, sr * 2.6, '255,212,92', .55);
  const sg = c.createRadialGradient(sx, cy, sr * .2, sx, cy, sr); sg.addColorStop(0, '#FFF3B0'); sg.addColorStop(1, '#FFD45C');
  disc(c, sx, cy, sr); c.fillStyle = sg; c.fill();
  c.lineWidth = 2; c.lineCap = 'round'; c.setLineDash([9, 7]); c.lineDashOffset = -t * 24;
  const x0 = sx + sr * 1.05, rays = [];
  for (let j = 0; j < 9; j++) { const dy = (j - 4) * R * .225, xh = cx - Math.sqrt(Math.max(0, R * R - dy * dy)); rays.push([dy, xh]); c.strokeStyle = 'rgba(255,212,92,.75)'; c.beginPath(); c.moveTo(x0, cy + dy); c.lineTo(xh - 6, cy + dy); c.stroke(); }
  c.setLineDash([]);
  c.fillStyle = '#FFD45C';
  for (const [dy, xh] of rays) { c.beginPath(); c.moveTo(xh - 1, cy + dy); c.lineTo(xh - 9, cy + dy - 4); c.lineTo(xh - 9, cy + dy + 4); c.closePath(); c.fill(); }
  // the globe: oceans, land, a heat map by latitude, and a shaded night side
  c.save(); disc(c, cx, cy, R); c.clip();
  let g = c.createRadialGradient(cx - R * .45, cy - R * .3, R * .1, cx, cy, R * 1.1);
  g.addColorStop(0, '#5FA8E8'); g.addColorStop(.6, '#2A6AB0'); g.addColorStop(1, '#173E70');
  c.fillStyle = g; c.fillRect(cx - R, cy - R, R * 2, R * 2);
  c.fillStyle = 'rgba(111,179,111,.8)';
  for (const [dx, dy, rx, ry, rot] of [[-.25, -.4, .3, .17, .4], [.15, .05, .24, .32, .2], [-.5, .3, .14, .2, -.3], [.4, -.25, .17, .21, .6], [-.05, .62, .3, .1, 0]]) { c.beginPath(); c.ellipse(cx + dx * R, cy + dy * R, rx * R, ry * R, rot, 0, TAU); c.fill(); }
  const bands = 13, bh = 2 * R / bands;
  for (let i = 0; i < bands; i++) {

    c.fillStyle = `rgba(${tmix(hot)},${(.14 + .4 * hot).toFixed(3)})`; c.fillRect(cx - R, cy - R + bh * i, R * 2, bh + .5);
  }

  c.restore();
  c.lineWidth = 1.5; c.strokeStyle = 'rgba(190,220,255,.5)'; disc(c, cx, cy, R); c.stroke();

  const r1 = R + 15, r2 = R + 42, pr = (th, r) => [cx + Math.cos(th) * r, cy + Math.sin(th) * r], rad = Math.PI / 180;

    const pts = [];

    r: clamp(R * .08, 6, 10), alpha: 1, time: t, dir: 1,
    temp: (x, y) => { const w = Math.abs(Math.cos(Math.atan2(y - cy, x - cx))); return clamp01(.1 + .85 * Math.pow(w, 1.2) + (Math.hypot(x - cx, y - cy) > R + 28 ? .08 : 0)); },
  });
}

// --- secret: the room with a window ----------------------------------------------------------------------------
function winScene(c, W, H, dt, t) {
  S.winT = damp(S.winT, S.win ? 1 : 0, 2.2, dt);
  S.pph += 46 * dt;
  const o = S.winT, xr = W * .74, wt = W * .06, yw0 = H * .2, yw1 = H * .58, floorY = H * .88, ceilY = H * .07;
  // winter outside
  let g = c.createLinearGradient(0, 0, 0, H * .8); g.addColorStop(0, '#B9D2E8'); g.addColorStop(1, '#E6F0F8');
  c.fillStyle = g; c.fillRect(xr, 0, W - xr, H);
  c.fillStyle = '#F4F8FC'; c.beginPath(); c.moveTo(xr, H * .78); c.quadraticCurveTo(W * .88, H * .72, W, H * .76); c.lineTo(W, H); c.lineTo(xr, H); c.closePath(); c.fill();

  c.fillStyle = '#fff';
  for (let i = 0; i < 16; i++) { const fx = xr + ((hash(i, 8) * (W - xr) + Math.sin(t + i) * 6 + (W - xr)) % (W - xr)), fy = ((hash(i, 9) * H + t * (14 + hash(i, 3) * 12)) % (H * .8)); disc(c, fx, fy, 1.4 + hash(i, 2)); c.fill(); }
  roomBase(c, W, H, xr);
  // the wall with the window opening
  g = c.createLinearGradient(xr, 0, xr + wt, 0); g.addColorStop(0, '#CDBB9C'); g.addColorStop(1, '#E4D4BB');
  c.fillStyle = g; c.fillRect(xr, 0, wt, yw0); c.fillRect(xr, yw1, wt, H - yw1);
  c.fillStyle = '#D6C4A6'; c.fillRect(xr, yw1, wt, 5); c.strokeStyle = '#A8956F'; c.lineWidth = 1; c.strokeRect(xr + .5, yw0, wt, yw1 - yw0);

  const gl = o * (yw1 - yw0);
  c.fillStyle = 'rgba(190,225,250,.3)'; c.fillRect(xr, yw0 - gl, wt, yw1 - yw0);
  c.fillStyle = 'rgba(255,255,255,.9)'; c.fillRect(xr + wt * .35, yw0 - gl, wt * .3, yw1 - yw0); c.restore();
  // curtain
  const ctop = yw0 - H * .03, cbot = yw1 + H * .05, cxr = xr - W * .006;
  c.fillStyle = '#6E5A44'; c.fillRect(xr - W * .08, ctop - 4, W * .085, 4);
  const L = [], Rr = [];
  for (let i = 0; i <= 14; i++) {
    const v = i / 14, off = o * (-.055 * W * sm(.3, 1, v) * (.75 + .25 * Math.sin(t * 2.6 + v * 5)) + .02 * W * (1 - sm(0, .4, v)) * (.6 + .4 * Math.sin(t * 3))) + Math.sin(t * 1.3 + v * 3) * 1.2;

const SCENES = { beach, bag: bagScene, room: roomScene, trees: treesScene, scale: scaleScene, planet: planetScene, win: winScene };
const sceneKey = () => (lab.view === 'beach' ? (S.sec || 'beach') : lab.view === 'bag' ? ['bag', 'room', 'trees'][S.gs >> 1] : 'scale');
const askShown = () => lab.view !== 'scale' && !(lab.view === 'beach' && S.sec);

canvasLoop($('cv'), (c, w, h, dt) => {
  const key = sceneKey();
  if (key !== S.key) { S.key = key; S.fade = 0; }
  S.fade = Math.min(1, S.fade + dt / .35); S.rt += dt; S.grt += dt;
  S.ga = S.fade * S.fade * (3 - 2 * S.fade);
  S.top = damp(S.top, askShown() ? askEl.offsetHeight + 10 : 0, 9, dt);
  const y0 = Math.min(S.top, h * .55), H = h - y0, time = performance.now() / 1000;
  c.save(); c.translate(0, y0); c.globalAlpha = S.ga;

  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const resetBag = () => { S.T = 20; S.lift = 0; S.parts = null; S.escAcc = 0; S.rm = 0; S.rph = 0; S.front = -60; S.trW = 0; S.tr.forEach((q) => { q.th = 0; q.om = 0; }); };
const OK_B = [1, 0], OK_G = [0, 0, 1];
function answer(i) {
  if (lab.view === 'beach') {
    const q = S.bs >> 1; if (S.bs % 2) return;
    if (q === 0) S.b1 = i; else S.b2 = i;
    (i === OK_B[q] ? sfx.good : sfx.bad)(); S.bs++; S.rt = 0;
  } else {
    const q = S.gs >> 1; if (S.gs % 2) return;
    S.g[q] = i; (i === OK_G[q] ? sfx.good : sfx.bad)(); S.gs++; S.grt = 0;
  }
  showStage();
}
function next() {
  sfx.click();
  if (lab.view === 'beach') { if (S.bs === 1) { S.bs = 2; S.night = 1; S.rt = 0; } }
  else if (S.gs % 2 && S.gs < 5) { S.gs++; S.grt = 0; S.rm = 0; S.front = -60; S.trW = 0; }
}
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.i !== undefined) answer(+b.dataset.i); else if (b.dataset.next) next();
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'dn') { S.night = +b.dataset.m; S.rt = Math.max(S.rt, 1); sfx.click(); }
  else if (act === 'again') {
    if (lab.view === 'beach') { S.bs = 0; S.night = 0; S.rt = 0; S.b1 = S.b2 = null; }
    else { S.gs = 0; S.g = [null, null, null]; S.grt = 0; resetBag(); }
    sfx.click();
  } else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; if (k === 'room') { S.win = false; S.winT = 0; } sfx.click();
  } else if (act === 'window') { S.win = !S.win; sfx.click(); }
  render();
});
$('beauf').addEventListener('input', (ev) => {
  const n = +ev.target.value; if (n !== S.n) { S.n = n; sfx.tick(); }
  if (n === 2 || n === 3) S.quest = true;
  render();
});

// --- one render per change: controls, readout, the question card and the state card ----------------------------
function cardHTML(t, { q, opts, picked, ok, r, next: nx, step, total }) {
  const dots = `<div class="dots">${Array.from({ length: total }, (_, i) => (i <= step ? '●' : '○')).join(' ')}</div>`;
  return picked === null
    ? `<div class="q">${esc(q)}</div><div class="opts">${opts.map((o, i) => `<button class="ab" data-i="${i}">${esc(o)}</button>`).join('')}</div>${dots}`
    : `<div class="verdict" style="color:${picked === ok ? 'var(--ok)' : 'var(--wip)'}">${esc(picked === ok ? t.right : t.wrong)}</div><p>${esc(r)}</p>${nx ? `<div class="opts"><button class="ab" data-next="1">${esc(t.next)}</button></div>` : ''}${dots}`;
}
function render() {
  const t = T[lang], v = lab.view, sec = v === 'beach' ? S.sec : null, fine = `<div class="fine">${esc(t.fine)}</div>`;
  document.body.dataset.v = v === 'scale' ? 'scale' : sec ? 'sec' : 'ask';
  askEl.style.display = askShown() ? '' : 'none';
  $('rowAct').hidden = !((v === 'beach' && !sec && S.bs === 3) || (v === 'bag' && S.gs === 5));
  $('dnSeg').hidden = v !== 'beach';
  $('againB').textContent = t.again;
  $('secRow').hidden = !(v === 'beach' && S.bs >= 1);
  $('winB').hidden = sec !== 'room'; $('winB').textContent = t.sec.window;
  $('winB').classList.toggle('on', S.win);
  $('scaleBox').hidden = v !== 'scale';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('planet', '🌍') + sc('room', '🏠');
  if (v === 'beach') renderBeach(t, sec, fine); else if (v === 'bag') renderBag(t, fine); else renderScale(t, fine);
}
function renderBeach(t, sec, fine) {
  if (sec === 'planet') { lab.setGlow('rgba(255, 150, 80, .22)'); lab.setReadout('🌍', t.secrets.planet[1], '', '#FF9650'); lab.setState({ emo: '🌍', title: t.secrets.planet[0], lead: t.sec.planetText, body: '', extra: fine }); return; }
  if (sec === 'room') {
    lab.setGlow('rgba(110, 170, 255, .22)'); lab.setReadout('🏠', t.secrets.room[1], '', '#6EAAFF');
    lab.setState({ emo: '🏠', title: t.secrets.room[0], lead: S.win ? t.sec.roomText : t.secrets.room[1], body: '', extra: fine }); return;
  }
  const bs = S.bs, nightNow = bs >= 2 && S.night === 1, sandT = nightNow ? 15 : 35, waterT = nightNow ? 20 : 22;
  $('dnSeg').innerHTML = [[0, t.b.day], [1, t.b.night]].map(([m, l]) => `<button data-act="dn" data-m="${m}" class="${m === S.night ? 'on' : ''}">${esc(l)}</button>`).join('');
  lab.setGlow(nightNow ? 'rgba(80, 100, 200, .3)' : 'rgba(255, 150, 80, .24)');
  if (bs === 0) lab.setReadout('?', '', '', '#FF9650'); else lab.setReadout(`${sandT}° / ${waterT}°`, `${t.b.sand} / ${t.b.water}`, nightNow ? t.b.night : t.b.day, nightNow ? '#6EAAFF' : '#FF9650');
  const [e, ti, le, bo] = bs === 0 ? t.st.beachN : bs < 3 ? t.st.beachM : t.st.beachF;
  lab.setState({ emo: e, title: ti, lead: le, body: bo, extra: fine });
  const q = bs >> 1, b = t.b;
  askEl.innerHTML = cardHTML(t, { q: q ? b.q2 : b.q1, opts: q ? b.o2 : b.o1, picked: bs % 2 ? (q ? S.b2 : S.b1) : null, ok: OK_B[q], r: q ? b.r2 : b.r1, next: bs === 1, step: q, total: 2 });
}
function renderBag(t, fine) {
  const gs = S.gs, q = gs >> 1, g = t.g;
  lab.setGlow('rgba(217, 130, 95, .24)');
  const rd = gs % 2 === 0 ? '?' : ['↑', '24° / 19°', '💨 → 🌳'][q];
  lab.setReadout(rd, '', '', '#D9825F');
  const [e, ti, le, bo] = gs < 3 ? t.st.bagN : t.st.bagF;
  lab.setState({ emo: e, title: ti, lead: le, body: bo, extra: fine });
  askEl.innerHTML = cardHTML(t, { q: g[`q${q + 1}`], opts: g[`o${q + 1}`], picked: gs % 2 ? S.g[q] : null, ok: OK_G[q], r: g[`r${q + 1}`], next: gs % 2 === 1 && gs < 5, step: q, total: 3 });
}
function renderScale(t, fine) {
  const n = S.n, s = t.s;
  lab.setGlow('rgba(110, 170, 255, .24)');
  lab.setReadout(`${n}<span style="font-size:.5em;font-weight:800;margin-left:8px;color:var(--soft)">${esc(s.names[n])}</span>`, s.effects[n], '', '#6EAAFF');
  const [e, ti, le, bo] = t.st.scale;
  lab.setState({ emo: e, title: ti, lead: le, body: bo, extra: fine });
  $('beauf').value = n; $('beauf').setAttribute('aria-label', t.views.scale);
  $('endLo').textContent = `0 · ${s.names[0]}`; $('endHi').textContent = `12 · ${s.names[12]}`;
  const qe = $('quest'); qe.classList.toggle('ok', S.quest);
  qe.textContent = S.quest ? `✓ ${s.done}` : `🎯 ${s.quest}`;
}
render();
</script>
