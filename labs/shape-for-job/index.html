const slider = (id, track) => `<div class="sj-lbl" id="${id}L"></div><input type="range" class="big" id="${id}" min="0" max="100" value="0" step="1" style="--track:${track}"><div class="ends"><span id="${id}A"></span><span id="${id}B"></span></div>`;
$('ctrlBody').innerHTML = `
  <div id="v1"><div id="v1q" class="sj-q"></div><div id="v1c">${slider('v1r', 'linear-gradient(90deg,#8d97a8,#4aa3df)')}
    <div class="row2"><div class="chips" id="v1t"></div><button class="btn sj-go" id="v1g" data-a="dip"></button></div></div></div>
  <div id="v2"><div id="v2q" class="sj-q"></div><div id="v2c">${slider('v2r', 'linear-gradient(90deg,#aab6c5,#e0b050)')}
    <div class="row2"><button class="btn sj-go" id="v2g" data-a="load"></button></div></div></div>
  <div id="v3"><div id="v3q" class="sj-q"></div><div id="v3c"><div class="row2" style="margin-top:0"><div class="chips" id="v3p"></div><button class="btn sj-go" id="v3g" data-a="pour"></button></div></div></div>
  <div id="vS">${slider('shr', 'linear-gradient(90deg,#68748a,#7fb6ff)')}</div>
  <div id="vB">${slider('bmr', 'linear-gradient(90deg,#d9ccaa,#e0b050)')}<div class="row2"><button class="btn sj-go" id="bmg" data-a="car"></button></div></div>
  <div class="row2" id="sjSec"></div>`;

const qHtml = (a, q, opts) => `<div class="sj-qt">${esc(q)}</div><div class="sj-opts">${opts.map((o, i) => `<button class="sj-opt" data-a="${a}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const fact = (emo, text, src) => ({ emo, text, src });
const fineEx = () => `<div class="fine">${esc(T[lang].fine)}</div>`;

function startDip(first) {
  const sp = S.sp; sp.anim = 0; sp.dd = sp.d; sp.dt = sp.tool; sp.first = first; sp.last = null; sp.parts = []; sp.splash = []; sp.spawned = 0; sfx.push();
}
function resetLoad() { const L = S.ld; L.side = [mkSide(), mkSide()]; L.run = false; L.endAt = -1; L.done = false; L.first = false; }
function startLoad(first) { const L = S.ld; resetLoad(); L.first = first; L.run = true; L.timer = .5; L.cap = [0, capOf(L.p)]; }
function startPour() {
  const P = S.pl, pr = { ...P.parts };
  const key = !pr.spout ? 'nospout' : !pr.handle && !pr.base ? 'nohb' : !pr.handle ? 'nohandle' : !pr.base ? 'nobase' : 'ok';
  const motion = key === 'ok' ? 'ok' : key === 'nospout' ? 'spill' : 'shaky';
  P.snap = { parts: pr, key, motion, hit: hitPattern(motion) };
  P.right = P.guess === (key === 'ok' ? 0 : 1);
  P.anim = 0; P.done = false; P.lastUnits = -1; P.liveIn = 0; sfx.push();
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const a = b.dataset.a, sp = S.sp, L = S.ld, P = S.pl;
  if (a === 'q1') { if (sp.guess !== null) return; sp.guess = +b.dataset.i; sp.right = sp.guess === 1; sp.d = 0; startDip(true); showStage(); }
  else if (a === 'tool') { if (sp.anim >= 0) return; sp.tool = b.dataset.k; sp.last = null; sfx.click(); }
  else if (a === 'dip') { if (sp.anim >= 0) return; startDip(false); showStage(); }
  else if (a === 'q2') { if (L.guess !== null) return; L.guess = +b.dataset.i; L.right = L.guess === 1; startLoad(true); showStage(); }
  else if (a === 'load') { if (L.run || L.endAt > 0) return; startLoad(false); showStage(); }
  else if (a === 'part') { if (P.anim >= 0) return; const k = b.dataset.k; P.parts[k] = !P.parts[k]; P.touched = k; P.done = false; sfx.snap(); }
  else if (a === 'pour') { if (P.anim >= 0) return; P.asking = true; sfx.click(); }
  else if (a === 'back') { P.asking = false; sfx.click(); }
  else if (a === 'q3') { P.guess = +b.dataset.i; P.asking = false; startPour(); showStage(); }
  else if (a === 'sec') { const k = b.dataset.k; if (!secret.unlocked()) return secret.open(); S.sec = S.sec === k ? null : k; if (S.sec === 'beam') { S.bm.t0 = -1; S.bm.res = null; } sfx.click(); }
  else if (a === 'car') { const B = S.bm, sag = beamSag(B.p); B.res = sag <= BEAM_FAIL ? 'hold' : 'fail'; B.t0 = performance.now() / 1000; sfx.push(); showStage(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'v1r') { if (S.sp.guess === null || S.sp.anim >= 0) return; S.sp.d = v / 100; S.sp.last = null; }
  else if (id === 'v2r') { if (S.ld.guess === null || S.ld.run || S.ld.endAt > 0) return; S.ld.p = v; resetLoad(); }
  else if (id === 'shr') S.shipP = v;
  else if (id === 'bmr') { S.bm.p = v; S.bm.t0 = -1; S.bm.res = null; }
  else return;
  render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------------------
function setSlider(id, label, a, b, val, off) {
  $(`${id}L`).textContent = label; $(`${id}A`).textContent = a; $(`${id}B`).textContent = b; $(id).setAttribute('aria-label', label);
  if (+$(id).value !== val) $(id).value = val;
  $(id).disabled = !!off;
}
function renderSec(t) {
  const open = secret.unlocked();
  $('sjSec').innerHTML = [['ship', '🚢'], ['beam', '🏗️']].map(([k, e]) =>
    `<button class="chip secret sj-t ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-a="sec" data-k="${k}">${open ? `${e} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`).join('');
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  $('v1').hidden = !(!sec && v === 'spoon'); $('v2').hidden = !(!sec && v === 'load'); $('v3').hidden = !(!sec && v === 'plan');
  $('vS').hidden = sec !== 'ship'; $('vB').hidden = sec !== 'beam';
  renderSec(t);
  if (sec === 'ship') renderShip(t); else if (sec === 'beam') renderBeam(t);
  else if (v === 'spoon') r1(t); else if (v === 'load') r2(t); else r3(t);
}

function r1(t) {
  const sp = S.sp, c = t.sp, col = '#4aa3df', asking = sp.guess === null;
  lab.setGlow('rgba(74,163,223,.26)');
  lab.setFacts([fact('🦌', t.facts.spoon[0], SRC.spoon), fact('🥄', t.facts.spoon[1], SRC.spoon)]);
  $('v1q').hidden = !asking; $('v1c').hidden = asking;
  if (asking) {
    $('v1q').innerHTML = qHtml('q1', c.q, c.opts);
    lab.setReadout('?', '', '', col);
    lab.setState({ emo: '🥄', title: c.q, lead: c.lead0, body: '', extra: fineEx() }); return;
  }
  const busy = sp.anim >= 0;
  setSlider('v1r', c.slider, c.e0, c.e1, Math.round(sp.d * 100), busy);
  $('v1t').innerHTML = ['spoon', 'shovel'].map((k) => `<button class="chip sj-t ${sp.tool === k ? 'on' : ''}" data-a="tool" data-k="${k}"${busy ? ' disabled' : ''}>${esc(c.tools[k])}</button>`).join('');
  $('v1g').textContent = c.go; $('v1g').disabled = busy;
  let st;
  if (busy) { lab.setReadout('…', '', '', col); st = { emo: '💧', title: c.watchT, lead: c.watch(c.on[sp.dt]), body: '' }; }
  else if (sp.last) {
    const h = sp.last.held, k = h <= 2 ? 0 : h <= 14 ? 1 : 2;
    lab.setReadout(h, c.sub(sp.last.tool, h), '', col);
    st = sp.last.first ? { emo: sp.right ? '✅' : '🤔', title: sp.right ? t.right : t.notQuite, lead: c.first, body: c.firstBody }
      : { emo: '🥄', title: c.tier[k], lead: c.same, body: c.tierBody[k] };
  } else { lab.setReadout('–', c.dash, '', col); st = { emo: '🥄', title: c.readyT, lead: c.same, body: '' }; }
  lab.setState({ ...st, extra: fineEx() });
}

function r2(t) {
  const L = S.ld, c = t.ld, col = '#e0b050', asking = L.guess === null;
  lab.setGlow('rgba(224,176,80,.26)');
  lab.setFacts([fact('🎩', t.facts.load[0], SRC.corr), fact('📦', t.facts.load[1], SRC.corr)]);
  $('v2q').hidden = !asking; $('v2c').hidden = asking;
  if (asking) {
    $('v2q').innerHTML = qHtml('q2', c.q, c.opts);
    lab.setReadout('?', '', '', col);
    lab.setState({ emo: '📦', title: c.q, lead: c.lead0, body: '', extra: fineEx() }); return;
  }
  const busy = L.run || L.endAt > 0, held = (sd) => (sd.sunkAt >= 0 ? sd.n - 1 : sd.n);
  const hl = held(L.side[0]), hr = held(L.side[1]), cap = capOf(L.p);
  setSlider('v2r', c.slider, c.e0, c.e1, L.p, busy);
  $('v2g').textContent = c.go; $('v2g').disabled = busy;
  let st;
  if (busy) { lab.setReadout(hr, c.sub(hr), c.pill(hl), col); st = { emo: '🪙', title: c.runT, lead: c.runL, body: '' }; }
  else if (L.done) {
    lab.setReadout(hr, c.sub(hr), c.pill(hl), col);
    const hint = cap === 0 ? '' : cap === maxCap ? c.best : L.p < bestP ? c.up : c.down;
    st = L.first ? { emo: L.right ? '✅' : '🤔', title: L.right ? t.right : t.notQuite, lead: c.lead(c.coins(hl), c.coins(hr)), body: `${c.firstBody} ${hint}`.trim() }
      : { emo: '📦', title: c.later(c.coins(hr), cap), lead: c.lead(c.coins(hl), c.coins(hr)), body: hint };
  } else { lab.setReadout('–', c.sub(2), '', col); st = { emo: '📦', title: c.readyT, lead: c.readyL, body: '' }; }
  lab.setState({ ...st, extra: fineEx() });
}

function r3(t) {
  const P = S.pl, c = t.pl, col = '#7fb6ff', busy = P.anim >= 0;
  lab.setGlow('rgba(127,182,255,.26)');
  const f = [fact('🥄', t.facts.plan[0], SRC.spoon)];
  if (S.ld.guess !== null) f.push(fact('🚢', t.facts.ship, SRC.buoy), fact('⚓', t.facts.arch, SRC.buoy)); // the boat answer is not given away before the guess
  lab.setFacts(f);
  $('v3q').hidden = !P.asking; $('v3c').hidden = P.asking;
  if (P.asking) {
    $('v3q').innerHTML = qHtml('q3', c.q, c.opts) + `<div class="row2"><button class="chip sj-t" data-a="back">${esc(c.back)}</button></div>`;
    lab.setReadout('?', '', '', col);
    lab.setState({ emo: '💧', title: c.q, lead: c.lead0, body: '', extra: fineEx() }); return;
  }
  $('v3p').innerHTML = ['spout', 'handle', 'base'].map((k) => `<button class="chip sj-t ${P.parts[k] ? 'on' : ''}" data-a="part" data-k="${k}"${busy ? ' disabled' : ''}>${esc(c.parts[k].name)}</button>`).join('');
  $('v3g').textContent = c.pour; $('v3g').disabled = busy;
  let st;
  if (busy) { lab.setReadout(P.liveIn, c.sub(P.liveIn), '', col); st = { emo: '💧', title: c.runT, lead: c.runL, body: '' }; }
  else if (P.done) {
    lab.setReadout(P.inCup, c.sub(P.inCup), '', col);
    st = { emo: P.right ? '✅' : '🤔', title: P.right ? t.right : t.notQuite, lead: c.cup(P.inCup), body: c.body[P.snap.key] };
  } else {
    lab.setReadout('–', c.dash, '', col);
    st = P.touched ? { emo: '📐', title: `${c.parts[P.touched].name}: ${c.parts[P.touched].job}.`, lead: P.parts[P.touched] ? c.added : c.removed, body: c.startB }
      : { emo: '📐', title: c.startT, lead: c.startL, body: c.startB };
  }
  lab.setState({ ...st, extra: fineEx() });
}

function renderShip(t) {
  const c = t.sh, g = shipGeo(S.shipP / 100), col = '#7fb6ff';
  lab.setGlow('rgba(127,182,255,.26)');
  lab.setFacts([fact('🚢', t.facts.ship, SRC.buoy), fact('⚓', t.facts.arch, SRC.buoy)]);
  setSlider('shr', c.slider, c.e0, c.e1, S.shipP, false);
  lab.setReadout(`${Math.round(g.air * 100)}%`, c.sub, g.floats ? c.floats : c.sinks, col);
  lab.setState({ emo: g.floats ? '🚢' : '🧱', title: g.floats ? c.floatT : c.sinkT, lead: g.floats ? c.floatL : c.sinkL, body: '', extra: fineEx() });
}
function renderBeam(t) {
  const c = t.bm, B = S.bm, col = '#e0b050';
  lab.setGlow('rgba(224,176,80,.26)');
  lab.setFacts([fact('🎩', t.facts.load[0], SRC.corr), fact('📦', t.facts.load[1], SRC.corr)]);
  setSlider('bmr', c.slider, c.e0, c.e1, B.p, false);
  $('bmg').textContent = c.go;
  lab.setReadout(`${B.p}%`, c.sub, B.res ? (B.res === 'hold' ? c.holds : c.fails) : '', col);
  lab.setState(B.res === 'hold' ? { emo: '✅', title: c.holdT, lead: c.holdL, body: '', extra: fineEx() }
    : B.res === 'fail' ? { emo: '🤔', title: c.failT, lead: c.failL, body: '', extra: fineEx() }
      : { emo: '📄', title: c.preT, lead: c.preL, body: '', extra: fineEx() });
}

// --- the picture ---------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const s = Math.min(w / W, h / H); SC = s; const ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  c.save(); c.translate(ox, oy); c.scale(s, s);
  const v = lab.view;
  if (S.sec === 'ship') drawShip(c, dt, time); else if (S.sec === 'beam') drawBeam(c, dt, time);
  else if (v === 'spoon') drawSpoon(c, dt, time); else if (v === 'load') drawLoad(c, dt, time); else drawPlan(c, dt, time);
  c.restore();
});
render();
</script>
</body>
</html>
