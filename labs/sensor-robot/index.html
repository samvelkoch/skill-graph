function stepSim(dt) {
  sim.acc += dt * SIMSPEED; let n = 0;
  while (sim.acc >= STEP && n < 20) {
    sim.acc -= STEP; n++; simStep(STEP);
    if (sim.mode === 'rules') {
      if (sim.lost) { sim.over = 'lost'; endRun(); break; }
      if (sim.prog >= LTOT * 0.97) { sim.over = 'ok'; endRun(); break; }
    }
  }
  if (sim.acc > STEP * 20) sim.acc = 0;
}
function endRun() {
  S.res = sim.over === 'ok' ? 'ok' : S.rl === 'l' && S.rr === 'r' ? 'slip' : S.rl === 'r' && S.rr === 'l' ? 'back' : 'half';
  (S.res === 'ok' ? sfx.good : sfx.bad)(); render();
}
function advance(dt) {

  else if (v === 'loop' && S.a1 !== null && S.a2 !== null) {

}

}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset, t = T[lang];
  if (d.q1 !== undefined) { if (S.v1stage !== 0) return; S.a1 = +d.q1; S.v1stage = 1; (S.a1 === t.p1.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (d.act === 'go1') { S.v1stage = 2; sfx.click(); }
  else if (d.rule) { const k = d.rule === 'l' ? 'rl' : 'rr'; S[k] = { l: 's', s: 'r', r: 'l' }[S[k]]; sfx.tick(); }
  else if (d.act === 'turnL' || d.act === 'turnR') { S.rob.th += (d.act === 'turnL' ? -1 : 1) * Math.PI / 12; sfx.tick(); }
  else if (d.act === 'run') {
    if (!S.run || sim.over) { simReset('rules', 0); sim.rl = S.rl; sim.rr = S.rr; S.run = true; S.res = null; sfx.click(); showStage(); }
    else { S.run = false; sfx.click(); }
  }
  else if (d.act === 'gate') { $('views').querySelector('[data-view="sense"]')?.click(); return; }
  else if (d.q2 !== undefined) {
    if (S.a2 !== null) return;
    S.a2 = +d.q2; S.p = 100; S.fb = true; S.look = 'norm'; simReset('fb', 6); S.reg = { key: 'start', cand: 'start', since: NOW }; S.fc = null;
    (S.a2 === t.p2.ok ? sfx.good : sfx.bad)(); showStage();
  }
  else if (d.act === 'nfb') { S.fb = !S.fb; simReset('fb', 6); S.reg = { key: 'start', cand: 'start', since: NOW }; sfx.click(); }
  else if (d.sec) {
    if (!secret.unlocked()) return secret.open();
    S.look = S.look === d.sec ? 'norm' : d.sec; simReset('fb', 6); S.reg = { key: 'start', cand: 'start', since: NOW }; sfx.click();
  }
  else if (d.h3) { S.h3 = d.h3; if (d.h3 === 'build') bReset(); sfx.click(); }
  else if (d.di !== undefined) { S.di = +d.di; sfx.tick(); }
  else if (d.pick !== undefined) {
    const dv = t.hm.devs[S.di], st = S.dev[S.di], i = +d.pick;
    if (st.s === null) { st.s = i; st.vs = i === dv.sOk; (st.vs ? sfx.good : sfx.bad)(); }
    else if (st.a === null) { st.a = i; st.va = i === dv.aOk; (st.va ? sfx.good : sfx.bad)(); }
  }
  else if (d.bs !== undefined) { S.sens = +d.bs; bReset(); sfx.click(); }
  else if (d.br !== undefined) { S.rule = +d.br; bReset(); sfx.click(); }
  else if (d.act === 'cold') { S.cold = !S.cold; sfx.click(); }
  else if (d.act === 'restart') { bReset(); sfx.click(); }
  else return;
  render();
});
$('kc').addEventListener('input', (ev) => { S.p = +ev.target.value; sim.Kc = kcOf(S.p); });

// dragging the robot over the floor (free play in view 1)
const cv = $('cv');
const moveRob = (ev) => {
  if (!S.drag) return;
  const r = cv.getBoundingClientRect();
  S.rob.x = clamp((ev.clientX - r.left - S.drag[0] - lay.ox) / lay.k, 8, WW - 8);
  S.rob.y = clamp((ev.clientY - r.top - S.drag[1] - lay.oy) / lay.k, 8, WH - 8);
};
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'sense' || S.v1stage !== 2 || S.run) return;
  const r = cv.getBoundingClientRect(), [rx, ry] = W2S(S.rob.x, S.rob.y), px = ev.clientX - r.left, py = ev.clientY - r.top;
  S.drag = Math.hypot(px - rx, py - ry) < 48 ? [px - rx, py - ry] : [0, 0];
  try { cv.setPointerCapture(ev.pointerId); } catch { /* not supported: dragging still works while the pointer stays on the canvas */ }
  moveRob(ev);
});
cv.addEventListener('pointermove', moveRob);
['pointerup', 'pointercancel'].forEach((e) => cv.addEventListener(e, () => { S.drag = null; }));

render();
</script>
</body>
