function pizza(c, x, y, R, shadow = true) {
  if (shadow) {
    c.save(); c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 16; c.shadowOffsetY = 7; c.fillStyle = '#8a5a2a';

}
function cuts(c, x, y, R, n) {

// the comb: n sectors, every other one upside down, edges touching; g (0..1) pulls them apart vertically
function comb(c, n, R, cx, y0, g) {
  const a = TAU / n, h = a / 2, s = R * Math.sin(h), ch = R * Math.cos(h), xl = cx - (n + 1) * s / 2 + s;

    c.save(); c.translate(ax, ay); if (odd) c.rotate(PI); c.rotate(-(k + .5) * a);

    c.drawImage(PIZ, -R, -R, 2 * R, 2 * R);

    c.lineWidth = 2; c.strokeStyle = 'rgba(60,30,8,.5)'; c.stroke();
    c.restore();
  }
}

      const bs = S.sq ? t.real.bS(fmt(side * side)) : '';
      if (eq) lab.setState({ emo: '🟰', title: t.real.eqT, lead: t.real.eqL, body: `${t.real.bL(fmt(C), fmt(Ar))}${bs}`, extra: '' });
      else lab.setState({ emo: '🌸', title: t.real.bT, lead: t.real.bL(fmt(C), fmt(Ar)), body: `${t.real.bB}${bs}`, extra: '' });
      lab.setFacts(t.facts.bed);
    }
  } else if (sc === 'arch') {
    const n = NA[S.an], lo = n * Math.sin(PI / n), hi = n * Math.tan(PI / n);
    lab.setGlow('rgba(180,155,255,.26)'); lab.setReadout(`${fmt(lo, 4)} < π < ${fmt(hi, 4)}`, '', t.arch.ti(n), VIO);
    $('anL').textContent = t.arch.sides; $('anRow').innerHTML = NA.map((k, i) => `<button type="button" class="chip c36 ${i === S.an ? 'on' : ''}" data-act="an" data-i="${i}">${k}</button>`).join('');
    lab.setState({ emo: '🏛️', title: t.arch.ti(n), lead: t.arch.le(fmt(lo, 4), fmt(hi, 4)), body: t.arch.body, extra: '' }); lab.setFacts(t.facts.arch);
  } else { // ring
    const R = S.RR, r = S.rr, a = PI * R * R, b = PI * r * r, A2 = a - b, wrong = PI * (R - r) * (R - r);
    lab.setGlow('rgba(180,155,255,.26)'); lab.setReadout(`${fmt(A2)} ${u.cm2}`, 'π(R² − r²)', '', VIO);
    $('srrL').textContent = t.ring.r; $('sRRL').textContent = t.ring.R; $('sRRV').textContent = fmt(R); $('srrV').textContent = fmt(r);
    $('sRR').value = R; $('srr').max = R - 0.5; $('srr').value = r;
    lab.setState({ emo: '⭕', title: t.ring.ti, lead: t.ring.le(fmt(R, 1), fmt(r, 1), fmt(a), fmt(b), fmt(A2)), body: t.ring.body(fmt(wrong)), extra: '' }); lab.setFacts(t.facts.ring);
  }
}

// --- canvas loop: the picture scales to fit both width and height of the stage ------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const k = Math.min(w / W, h / H), e = 1 - Math.exp(-dt * 14);
  A.rs += (S.r - A.rs) * e; A.rb += (S.rb - A.rb) * e; A.D1 += (S.D1 - A.D1) * e; A.D2 += (S.D2 - A.D2) * e; A.RR += (S.RR - A.RR) * e; A.rr += (S.rr - A.rr) * e;
  A.g += ((S.apart ? 1 : 0) - A.g) * (1 - Math.exp(-dt * 4)); A.cur = Math.min(1, A.cur + dt * 1.1);
  const t = T[lang], sc = scene();
  c.save(); c.translate((w - W * k) / 2, (h - H * k) / 2); c.scale(k, k);
  if (sc === 'cut0') drawCut0(c); else if (sc === 'cut') drawCut(c, t);
  else if (sc === 'rad0') drawRad0(c, t); else if (sc === 'rad') drawRad(c, t);
  else if (sc === 'pizza0') drawPizza0(c, t); else if (sc === 'pizza') drawPizzas(c, t); else if (sc === 'bed') drawBed(c, t, time);
  else if (sc === 'arch') drawArch(c, t); else if (sc === 'ring') drawRing(c, t);
  c.restore();
});
render();
</script>
</body>
</html>
