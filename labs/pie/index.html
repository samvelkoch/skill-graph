  ctx.shadowColor = 'transparent'; ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(10,12,20,.7)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fillStyle = 'rgba(10,12,20,.55)'; ctx.fill();
  ctx.restore();
}
function drawAngles(ctx, w, h, dt) {
  const t = TT(), day = S.sec === 'day', open = S.ang.ans !== null || day, hrs = S.hours, sel = S.sel.ang, cx = w / 2, pad = 50;
  S.ang.protr = clamp(S.ang.protr + (open ? dt * 1.6 : -dt * 3), 0, 1);
  let R, cy, sHs, sY;
  if (!day) { R = Math.max(40, Math.min(w / 2 - pad - 6, (h - 190) / 2 - pad)); cy = 6 + pad + R; sHs = 26; sY = cy + R + pad + 16 + 13; }
  else { sHs = 44; sY = 34; R = Math.max(40, Math.min(w / 2 - pad - 6, (h - 78) / 2 - pad)); cy = 70 + pad + R; }
  const sL = Math.min(w * 0.86, 560), tot = hrs.reduce((a, b) => a + b, 0);
  const pc = (i) => `${Math.round(hrs[i] * 100 / tot)} %`;
  const F = figure(ctx, {
    hours: hrs, t: 1, f: 1, cx, cyPie: cy, L: 100, hs: 40, Rp: R, sel, explode: true, colors: COL, inks: INK,
    labels: (i) => [[t.seg[i], pc(i)], [pc(i)]],
  });
  const SF = figure(ctx, {
    hours: hrs, t: 0, f: 0, cx, yFlat: sY, cyPie: 0, L: sL, hs: sHs, Rp: 0, sel, explode: false, colors: COL, inks: INK,
    labels: (i) => (day ? [[t.seg[i], `${hrs[i]} ${t.unit}`], [`${hrs[i]}`]] : [[`${hrs[i]} ${t.unit}`], [`${hrs[i]}`]]),
  });
  if (S.ang.protr > 0) { // protractor ring: ticks every 10 degrees, labels every 90
    ctx.save(); ctx.globalAlpha = S.ang.protr;
    const hasSel = sel !== null && sel !== undefined && sel >= 0 && sel < hrs.length;
    const A0 = hasSel ? F.cum[sel] * 360 : -1, A1 = hasSel ? F.cum[sel + 1] * 360 : -1;
    ctx.lineCap = 'round';
    for (let d = 0; d < 360; d += 10) {
      const a = (d - 90) * Math.PI / 180, big = d % 90 === 0, inSel = hasSel && d >= A0 - 0.01 && d <= A1 + 0.01, len = (big ? 11 : 6) + (inSel ? 2 : 0), r0 = R + 18;
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len));
      ctx.lineWidth = inSel ? 2.6 : 1.4; ctx.strokeStyle = inSel ? '#ffffff' : 'rgba(210,217,232,.55)'; ctx.stroke();
    }
    if (hasSel) {
      ctx.beginPath(); ctx.arc(cx, cy, R + 13, A0 * Math.PI / 180 - Math.PI / 2, A1 * Math.PI / 180 - Math.PI / 2);
      ctx.lineWidth = 4; ctx.strokeStyle = COL[sel]; ctx.shadowColor = COL[sel]; ctx.shadowBlur = 8; ctx.stroke();
    }
    for (const d of [0, 90, 180, 270]) {
      const a = (d - 90) * Math.PI / 180;
      pill(ctx, w, `${d}°`, cx + Math.cos(a) * (R + 44), cy + Math.sin(a) * (R + 44), { fs: 12 });
    }
    ctx.restore();
  }
  const knobs = [];
  if (open) {
    for (let i = 1; i < hrs.length; i++) {
      const a = F.cum[i] * TAU, x = cx + Math.sin(a) * R, y = cy - Math.cos(a) * R;
      knobs.push({ i, x, y, via: 'pie' });
      if (day) knobs.push({ i, x: cx - sL / 2 + F.cum[i] * sL, y: sY + sHs / 2, via: 'strip' });
    }
    for (const k of knobs) knob(ctx, k.x, k.y, S.drag && S.drag.i === k.i);
  }
  S.lay = { kind: 'angles', cx, cy, R, bigL: sL, pie: F.paths, strip: SF.paths, knobs };
}

// --- drawing: two pies -----------------------------------------------------------------------------------------
function kid(ctx, x, yb, s, col, glow, sc = 1) {
  ctx.save(); ctx.translate(x, yb); ctx.scale(sc, sc);
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 12; }
  const g = ctx.createLinearGradient(-s * 0.3, -s * 0.95, s * 0.3, 0);
  g.addColorStop(0, lite(col, 0.4)); g.addColorStop(1, dark(col, 0.22));
  ctx.fillStyle = g;
  ctx.beginPath(); rr(ctx, -s * 0.24, -s * 0.5, s * 0.48, s * 0.46, s * 0.18); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -s * 0.74, s * 0.2, 0, TAU); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); rr(ctx, -s * 0.24, -s * 0.5, s * 0.48, s * 0.46, s * 0.18); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -s * 0.74, s * 0.2, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(-s * 0.07, -s * 0.8, s * 0.05, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fill();
  ctx.restore();
}
function drawTwo(ctx, w, h, dt) {
  const t = TT(), tw = S.two, done = tw.ans !== null, W = t.two, colW = w / 2;
  if (done) tw.t += dt;
  const R = Math.max(36, Math.min(colW / 2 - 12, 110, (h - 32 - 12 - 150) / 2)), cy = 36 + R, cardTop = cy + R + 14, cardH = Math.min(h - 8 - cardTop, 150);
  const pies = [], fans = [TWO_N[0] / 2, TWO_N[1] / 2];
  for (let k = 0; k < 2; k++) {
    const cxk = colW * (k + 0.5);
    const F = figure(ctx, {
      hours: TWO_H, t: 1, f: 1, cx: cxk, cyPie: cy, L: 100, hs: 40, Rp: R, sel: S.sel.two, explode: true, colors: SC, inks: SI,
      labels: (i) => [[W.sport[i], TWO_PCT[i]], [TWO_PCT[i]]],
    });
    pies.push(F.paths);
    const p = done ? clamp01((tw.t - k * 0.18) / 0.7) : 0;
    pill(ctx, w, p >= 0.5 ? `${W.cls[k]} · ${TWO_N[k]}` : W.cls[k], cxk, 16, { fs: 12 });
    // the crowd card: an opaque cover until the guess, then it flips
    const cw = colW - 16, cx0 = k * colW + 8, ccx = cx0 + cw / 2, ccy = cardTop + cardH / 2;
    ctx.save();
    ctx.translate(ccx, ccy); ctx.scale(Math.max(0.001, Math.abs(Math.cos(p * Math.PI))), 1); ctx.translate(-ccx, -ccy);
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
    const cg = ctx.createLinearGradient(0, cardTop, 0, cardTop + cardH);
    cg.addColorStop(0, '#222b4a'); cg.addColorStop(1, '#141a30');
    ctx.beginPath(); rr(ctx, cx0, cardTop, cw, cardH, 16); ctx.fillStyle = cg; ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(130,145,190,.4)'; ctx.stroke();
    if (p < 0.5) {
      ctx.fillStyle = '#4a5580'; ctx.font = `900 44px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', ccx, ccy + 2);
    } else {
      const cell = Math.max(10, Math.min((cw - 16) / 8, 28, (cardH - 40) / 4)), gx = ccx - cell * 4, gy = cardTop + 32;
      const tl = tw.t - (0.7 + k * 0.18), lit = Math.min(fans[k], Math.floor(Math.max(0, tl) / 0.09));
      for (let i = 0; i < TWO_N[k]; i++) {
        const fan = i < fans[k] && i < lit, age = tl - i * 0.09;
        const sc = fan ? 1 + 0.3 * clamp01(1 - age / 0.25) : 1;
        kid(ctx, gx + (i % 8 + 0.5) * cell, gy + (Math.floor(i / 8) + 1) * cell, cell, fan ? '#7ee0a1' : '#76869f', fan ? 'rgba(126,224,161,.95)' : null, sc);
      }
      pill(ctx, w, `⚽ ${W.of(lit, TWO_N[k])}`, ccx, cardTop + 17, { fs: 12 });
    }
    ctx.restore();
  }
  S.lay = { kind: 'two', pies };
}

// --- drawing: Nightingale's rose -------------------------------------------------------------------------------
function drawRose(ctx, w, h, dt) {
  const t = TT();
  S.roseT += dt; S.lay = null;
  const cx = w / 2, cy = h * 0.46, R = Math.max(60, Math.min(w * 0.4, h * 0.36, 190));
  ctx.save();
  for (const k of [0.25, 0.5, 0.75, 1]) { ctx.beginPath(); ctx.arc(cx, cy, R * k, 0, TAU); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(130,145,190,.2)'; ctx.stroke(); }
  ctx.restore();
  for (let m = 0; m < 12; m++) {
    const a0 = -Math.PI / 2 + m * Math.PI / 6 + 0.012, a1 = -Math.PI / 2 + (m + 1) * Math.PI / 6 - 0.012;
    const g = ease(clamp01((S.roseT - m * 0.07) / 0.9));
    const layers = [{ v: ROSE.d[m], c: ROSE.col[0] }, { v: ROSE.w[m], c: ROSE.col[1] }, { v: ROSE.o[m], c: ROSE.col[2] }].sort((p, q) => q.v - p.v);
    for (const L of layers) {
      const rad = R * Math.sqrt(L.v / 100) * g; if (rad < 0.5) continue;
      const gr = ctx.createRadialGradient(cx - rad * 0.3, cy - rad * 0.3, 1, cx, cy, rad);
      gr.addColorStop(0, lite(L.c, 0.3)); gr.addColorStop(1, dark(L.c, 0.18));
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, rad, a0, a1); ctx.closePath(); ctx.fillStyle = gr; ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(8,10,18,.5)'; ctx.stroke();
      ctx.restore();
    }
    const am = (a0 + a1) / 2;
    pill(ctx, w, String(m + 1), cx + Math.cos(am) * (R + 18), cy + Math.sin(am) * (R + 18), { fs: 12, weight: 700 });
  }
  pill(ctx, w, t.rose.cap, cx, Math.min(h - 16, cy + R + 44), { fs: 12 });
}

// --- loop ------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (ctx, w, h, dt) => {
  try {
    if (S.tw) {
      const k = (performance.now() - S.tw.t0) / (S.tw.dur * 1000);
      if (k >= 1) { S.v = S.tw.to; S.tw = null; } else S.v = lerp(S.tw.from, S.tw.to, ease(k));
      syncSlider();
    }
    if (S.sec === 'rose') drawRose(ctx, w, h, dt);
    else if (lab.view === 'bend') drawBend(ctx, w, h);
    else if (lab.view === 'angles') drawAngles(ctx, w, h, dt);
    else drawTwo(ctx, w, h, dt);
  } catch (err) { console.error(err); }
});
render();
</script>
</body>
