// secret b: brine drips out of new sea ice

// --- view 3: pushing an iceberg into the sea -----------------------------------------------------------------------------
function splash(x, v) {

  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6; parts.push({ x: x + (Math.random() - 0.5) * 60, y: WL3, vx: Math.cos(a) * sp * 0.35 * Math.random(), vy: Math.sin(a) * sp * (0.4 + Math.random() * 0.5), life: 0 }); }
  ripples.push({ x, t0: now() });
}
function drawBerg(c, time, dt) {
  const B = S.v3, sh = SH[B.shape], ans = B.guess !== null, rest = WL3 - sh.yw;
  if (ans && !B.drag) { // buoyancy as a damped spring
    for (let i = 0; i < 4; i++) { const h = dt / 4; B.v += (-70 * B.y - 6.5 * B.v) * h; B.y += B.v * h; }
    if (Math.abs(B.y) < 0.05 && Math.abs(B.v) < 0.5) { B.y = 0; B.v = 0; }
  } else if (!ans) { B.y = sh.off0; B.v = 0; }

  seaFill(c, 8, WL3, 384, 392); rays(c, WL3, time, 392);

  if (ra > 0.01) { c.save(); c.globalAlpha = ra; c.strokeStyle = '#2b2f3d'; c.lineWidth = 2; const ty = oy + sh.minY + 4; c.beginPath(); c.moveTo(BX - 18, ty + 6); c.lineTo(BX, 10); c.lineTo(BX + 18, ty + 6); c.stroke(); c.fillStyle = '#2b2f3d'; c.beginPath(); c.arc(BX, 10, 5, 0, Math.PI * 2); c.fill(); c.restore(); }

    if (a > 0.02) {

      c.beginPath(); c.moveTo(bx - 5, WL3 + 3); c.lineTo(bx, WL3 + 3); c.lineTo(bx, botY); c.lineTo(bx - 5, botY); c.stroke();
      c.restore();

}

// --- the frame ---------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  GEO.s = s; GEO.ox = ox; GEO.oy = oy;
  c.save(); c.translate(ox, oy); c.scale(s, s); c.lineJoin = 'round';
  const v = lab.view;
  if (v === 'where') drawWhere(c, time);
  else if (v === 'freeze') { if (S.sec === 'road') drawRoad(c, time); else if (S.sec === 'brine') drawBrine(c, time, dt); else drawFreeze(c, time); }
  else drawBerg(c, time, dt);

});

// --- input ----------------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const designPt = (ev) => { const r = $('cv').getBoundingClientRect(); return [(ev.clientX - r.left - GEO.ox) / GEO.s, (ev.clientY - r.top - GEO.oy) / GEO.s]; };
$('cv').addEventListener('click', (ev) => {
  if (lab.view !== 'where') return;
  const [x, y] = designPt(ev), near = (k) => Math.hypot(x - MARK[k][0], y - MARK[k][1]) * GEO.s < 30;
  let hit = null;

  if (!hit) return;

});
$('cv').addEventListener('pointerdown', (ev) => {

  B.drag = true; B.y0 = ev.clientY; B.base = B.y; B.v = 0; $('cv').setPointerCapture?.(ev.pointerId); ev.preventDefault();
});

const endDrag = () => { const B = S.v3; if (!B.drag) return; B.drag = false; B.v = 0; if (B.y > 10) { B.pushed = true; B.shaped = false; sfx.push(); render(); } };
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag);

$('ctrlBody').addEventListener('click', (ev) => {

  } else if (a === 'g2') { if (S.v2.guess === null) { S.v2.guess = k; sfx.click(); render(); } }
  else if (a === 'g3') {

// --- one render per change: controls, readout, state card, facts ----------------------------------------------------------

  lab.setGlow('rgba(80, 160, 210, .28)');
  $('q3').textContent = b.q;
  $('o3').innerHTML = optsHtml('g3', b.o, (k) => (!ans ? 'idle' : +k === PCT ? 'ok' : +k === B.guess ? 'bad' : 'off'));
  $('shp').innerHTML = b.shapes.map((l, i) => `<button type="button" class="chip si-c ${B.shape === i ? 'on' : ''}" data-act="shape" data-k="${i}">${esc(l)}</button>`).join('');
  $('shp').hidden = !ans; $('h3').hidden = !ans; $('h3').textContent = b.hint;
  if (!ans) {
    lab.setReadout('?', b.subIdle, '', '#7fc4d8');
    lab.setState({ emo: '🧊', title: b.q, lead: b.preL, body: '', extra: '' });
    lab.setFacts(t.facts.berg0);
    return;
  }
  const verdict = B.guess === PCT ? t.ok : t.no;
  lab.setReadout(`${PCT}%`, b.sub, b.pill(100 - PCT), '#7fc4d8');
  if (B.pushed) lab.setState({ emo: '🫧', title: b.push, lead: b.pushL(PCT), body: b.pushB, extra: '' });
  else if (B.shaped) lab.setState({ emo: '🧊', title: b.shape(PCT), lead: b.shapeL, body: b.pushB, extra: '' });
  else lab.setState({ emo: B.guess === PCT ? '✅' : '🧊', title: `${verdict} ${b.res(PCT)}`, lead: b.resL(PCT), body: b.resB, extra: `<div class="fine">${esc(t.fine)}</div>` });
  lab.setFacts(t.facts.berg1);
}
render();
</script>
</body>
</html>
