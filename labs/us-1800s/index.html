  text(c, t.tlTitle, X(8), Y(252), { col: '#cfd6ee' });
  [1830, 1835, 1840, 1845].forEach((yr) => text(c, String(yr), X(tlx(yr)), Y(324), { al: 'center', col: yr === 1830 ? '#f4d03f' : '#9aa4c4' }));
  if (S.sel3 !== null) { const n = NAT[S.sel3], y = lanesY(S.sel3); pill(c, w, h, `${t.nat[n.k][0]} ${n.y[0]}–${String(n.y[1]).slice(2)}`, X(tlx(n.y[1] + 1)) + 6, Y(y) - 11, 'l', 12, '#fff'); }
}

// --- the two secrets -----------------------------------------------------------------------------------------------
function drawSecA(c, w, h, dt, time) {
  const t = T[lang], k = t.secA, e = eOut((now() - S.secT) / 1.3);
  const bg = c.createLinearGradient(0, 0, w, h); bg.addColorStop(0, '#ecd8a4'); bg.addColorStop(1, '#cfae76');
  c.save(); rr(c, 0, 0, w, h, 14); c.clip(); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const A1 = 2140000, A2 = 1518800, side = Math.min((w - 48) / 2, h * 0.5) / Math.sqrt(A1);
  const sq = (cx, base, a, col, n, y, pr) => {
    const sd = Math.sqrt(a) * side * e;
    c.save(); c.shadowColor = 'rgba(60,40,10,.4)'; c.shadowBlur = 10; c.shadowOffsetY = 4;
    const g = c.createLinearGradient(cx - sd / 2, base - sd, cx + sd / 2, base); g.addColorStop(0, mix(col, '#ffffff', 0.3)); g.addColorStop(1, mix(col, '#000000', 0.2));
    c.fillStyle = g; rr(c, cx - sd / 2, base - sd, sd, sd, 8); c.fill(); c.restore();
    c.strokeStyle = mix(col, '#000000', 0.45); c.lineWidth = 1.5; rr(c, cx - sd / 2, base - sd, sd, sd, 8); c.stroke();
    text(c, n, cx, base - sd / 2 - 8, { al: 'center', col: '#fff', fs: 15, wt: 900 }); text(c, pr, cx, base - sd / 2 + 12, { al: 'center', col: '#fff', fs: 13 });
    text(c, k.a(fmtN(a)), cx, base + 16, { al: 'center', col: '#3a2a12', fs: 13 });
  };
  const base = h * 0.12 + Math.sqrt(A1) * side;
  sq(w * 0.27, base, A1, '#c4673a', k.n1, k.y1, k.p1); sq(w * 0.73, base, A2, '#3d7fa6', k.n2, k.y2, k.p2);
  text(c, k.y1, w * 0.27, base + 36, { al: 'center', col: '#5a3d1c', fs: 12 }); text(c, k.y2, w * 0.73, base + 36, { al: 'center', col: '#5a3d1c', fs: 12 });
  c.restore();
}
function drawSecB(c, w, h, dt, time) {
  const t = T[lang], k = t.secB, e = eOut((now() - S.secT) / 2.2), hrs = 83, days = hrs / 24, dd = Math.floor(days), hh = hrs - dd * 24;
  const bg = c.createLinearGradient(0, 0, w, h); bg.addColorStop(0, '#1d2540'); bg.addColorStop(1, '#10152a');
  c.save(); rr(c, 0, 0, w, h, 14); c.clip(); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const bw = (w - 40) / 7, y0 = h * 0.34, bh = Math.min(70, h * 0.22);
  for (let i = 0; i < 7; i++) {
    const x = 20 + i * bw, fill = clamp01(days * e - i);
    c.fillStyle = 'rgba(255,255,255,.07)'; rr(c, x + 2, y0, bw - 4, bh, 8); c.fill();
    if (fill > 0) { const g = c.createLinearGradient(0, y0, 0, y0 + bh); g.addColorStop(0, '#f0b45a'); g.addColorStop(1, '#c4673a'); c.fillStyle = g; rr(c, x + 2, y0 + bh * (1 - fill), bw - 4, bh * fill, 8); c.fill(); }
    c.strokeStyle = 'rgba(200,210,240,.4)'; c.lineWidth = 1.2; rr(c, x + 2, y0, bw - 4, bh, 8); c.stroke();
    text(c, String(i + 1), x + bw / 2, y0 + bh + 16, { al: 'center', col: '#9aa4c4', fs: 12 });
  }
  text(c, k.lbl(dd, hh), w / 2, y0 - 26, { al: 'center', col: '#fff', fs: 20, wt: 900 });
  text(c, `${hrs} h`, w / 2, y0 - 6, { al: 'center', col: '#f0b45a', fs: 14 });
  text(c, `1876 · ${k.day} 1 – 7`, w / 2, y0 + bh + 40, { al: 'center', col: '#cfd6ee', fs: 12 });
  c.restore();
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  fitBox(w, h);
  S.pos1 += (S.tgt1 - S.pos1) * Math.min(1, dt * 5); if (Math.abs(S.tgt1 - S.pos1) < 0.002) S.pos1 = S.tgt1;
  S.pos2 += (S.tgt2 - S.pos2) * Math.min(1, dt * 2.6); if (Math.abs(S.tgt2 - S.pos2) < 0.002) S.pos2 = S.tgt2;
  if (S.sec === 'a') return drawSecA(c, w, h, dt, time);
  if (S.sec === 'b') return drawSecB(c, w, h, dt, time);
  if (lab.view === 'west') drawWest(c, w, h, dt, time);
  else if (lab.view === 'split') drawSplit(c, w, h, dt, time);
  else drawTrail(c, w, h, dt, time);
});

// --- controls ---------------------------------------------------------------------------------------------------
function predHTML(n) {
  const t = T[lang], pick = S.pick[n], done = pick !== null, right = RIGHT[n], opts = t['opts' + n];
  const chips = opts.map((o, i) => `<button class="us-opt${done ? (i === right ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="opt" data-n="${n}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const msg = n === 3 ? (pick === right ? t.right3(QUARTER) : t.wrong3(QUARTER)) : (pick === right ? t['right' + n] : t['wrong' + n]);
  const verdict = done ? `<div class="us-verdict ${pick === right ? 'good' : 'bad'}">${esc(msg)}</div>` : '';
  return `<div class="us-q">${esc(t['ask' + n])}</div><div class="us-opts">${chips}</div>${verdict}`;
}
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function answer(n, i) {
  if (S.pick[n] !== null) return;
  S.pick[n] = i; S.rev[n] = now();
  (n === 3 ? sfx.tick : i === RIGHT[n] ? sfx.good : sfx.bad)();
  if (n === 1) S.tgt1 = 7;
  if (n === 2) S.tgt2 = 2;
  if (n === 3) { S.sel3 = CHER; S.vis3.add(CHER); }
  render(); showStage();
}
function selNat(i) { S.sel3 = S.sel3 === i ? null : i; if (S.sel3 !== null) S.vis3.add(i); sfx.tick(); render(); }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'opt') return answer(+b.dataset.n, +b.dataset.i);
  if (a === 'nat') return selNat(+b.dataset.i);
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.secT = now(); sfx.click(); render(); showStage();
  }
});
$('usS1').addEventListener('input', (ev) => {
  let v = +ev.target.value;
  if (S.pick[1] === null && v > 6) { v = 6; ev.target.value = 6; }
  if (v !== S.tgt1) { S.tgt1 = v; sfx.tick(); render(); }
});
$('usS2').addEventListener('input', (ev) => {
  let v = +ev.target.value;
  if (S.pick[2] === null && v > 1) { v = 1; ev.target.value = 1; }
  if (v !== S.tgt2) { S.tgt2 = v; sfx.tick(); render(); }
});
// taps on the picture: a state dot (Split) or a homeland / a bar (Trail)
const cvEl = $('cv'); let downAt = null;
cvEl.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
cvEl.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 8 || S.sec) { downAt = null; return; }
  downAt = null;
  const r = cvEl.getBoundingClientRect(), x = (e.clientX - r.left - LAST.ox) / LAST.s, y = (e.clientY - r.top - LAST.oy) / LAST.s;
  if (lab.view === 'split') {
    let best = null, bd = 20 / LAST.s;
    ST.forEach((d) => { const dd = Math.hypot(d.x - x, d.y - y); if (dd < bd) { bd = dd; best = d.i; } });
    S.sel2 = best === S.sel2 ? null : best; if (best !== null) sfx.tick(); render();
  } else if (lab.view === 'trail') {
    let best = null, bd = 22;
    NAT.forEach((n, i) => { const dd = Math.hypot(n.x - x, n.y0 - y); if (dd < bd) { bd = dd; best = i; } });
    if (best === null && y > 252) NAT.forEach((n, i) => { if (Math.abs(y - (266 + i * 12)) < 6.5) best = i; });
    if (best !== null) selNat(best);
  }
});

// --- one render per change: controls, readout, state card, facts ------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('usW').style.display = v === 'west' ? 'block' : 'none';
  $('usS').style.display = v === 'split' ? 'block' : 'none';
  $('usT').style.display = v === 'trail' ? 'block' : 'none';
  $('usP1').innerHTML = predHTML(1); $('usP2').innerHTML = predHTML(2); $('usP3').innerHTML = predHTML(3);
  const a1 = S.pick[1] !== null, a2 = S.pick[2] !== null, a3 = S.pick[3] !== null;
  // view 1 controls
  $('usS1').value = S.tgt1; $('usS1').setAttribute('aria-label', t.yrAria);
  $('usT1').innerHTML = [...STOPS, a1 ? 1869 : '🔒'].map((y, i) => `<span class="${i === S.tgt1 ? 'on' : ''}">${y}</span>`).join('');
  $('usF1').textContent = a1 ? `${t.tint} ${t.fine1}` : t.tint;
  // view 2 controls
  $('usS2').value = S.tgt2; $('usS2').setAttribute('aria-label', t.yrAria);
  $('usT2').innerHTML = [t.stops2[0], t.stops2[1], a2 ? t.stops2[2] : '🔒'].map((y, i) => `<span class="${i === S.tgt2 ? 'on' : ''}">${y}</span>`).join('');
  const lg = S.tgt2 >= 2 ? [[TEAL, t.lg.ended, ''], [AMBER, t.lg.ring, 'ring']] : S.tgt2 === 1 ? [[BLUE, t.lg.free, ''], [YEL, t.lg.stayed, ''], [RED, t.lg.left, '']] : [[BLUE, t.lg.free, ''], [AMBER, t.lg.slave, '']];
  $('usL2').innerHTML = lg.map(([col, txt, cls]) => `<div><i class="${cls}" style="background:${cls ? 'transparent' : col}"></i>${esc(txt)}</div>`).join('');
  $('usF2').textContent = t.fine2;
  // view 3 controls
  $('usF3').textContent = t.routeNote;
  $('usN3').innerHTML = NAT.map((n, i) => `<button class="us-nat${S.vis3.has(i) ? ' seen' : ''}${S.sel3 === i ? ' on' : ''}" style="--c:${n.col}" data-act="nat" data-i="${i}">${esc(t.nat[n.k][0])}</button>`).join('');
  $('usC3').innerHTML = `<div class="us-cmp"><h4>${esc(t.cmpTitle)}</h4><div class="us-cols">
    <div><b>${esc(t.cmpRu[0])}</b><p>${esc(t.cmpRu[1])}</p></div>
    <div><b>${esc(t.cmpUs[0])}</b><p${a2 ? '' : ' class="wait"'}>${esc(a2 ? t.cmpUs[1] : t.cmpWait)}</p></div></div>
    ${a2 ? `<p class="tail">${esc(t.cmpTail)}</p>` : ''}
    <a href="../emancipation/${lang === 'en' ? '' : `?lang=${lang}`}">${esc(t.cmpLink)}</a></div>`;
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('usSecs').innerHTML = sc('a', '🗺️') + sc('b', '⏱️');
  // readout, state card, facts
  let st, facts = [], read, glow;
  if (S.sec) {
    const k = t['sec' + S.sec.toUpperCase()];
    st = { emo: S.sec === 'a' ? '🗺️' : '⏱️', title: t.secrets[S.sec][0], lead: k.lead, body: k.body };
    read = [S.sec === 'a' ? '1803 · 1867' : '83 h', '', '', '#e6c25a']; glow = 'rgba(230, 194, 90, .25)';
  } else if (v === 'west') {
    const i = S.tgt1, card = t.st1[i];
    st = { emo: card[0], title: card[1], lead: card[2], body: card[3] };
    read = i < 7 ? [String(STOPS[i]), t.regions[i], t.approx, REGCOL[i]] : ['1869', t.places.ny + ' → ' + t.places.sf, '', '#f4d03f'];
    if (a1) facts = t.facts1;
    glow = 'rgba(242, 205, 107, .24)';
  } else if (v === 'split') {
    const i = S.tgt2, card = t.st2[i];
    st = { emo: card[0], title: card[1], lead: card[2] ?? t.lead2a(N_ST, N_SLAVE, N_FREE, fmtN(ENS), ONE_IN), body: card[3] };
    const sel = S.sel2 !== null ? ST[S.sel2] : null;
    if (sel) read = [STATE_NAMES[lang][sel.i], statusWord(sel, i, t), '', dotColor(sel.s, i)];
    else read = i === 0 ? [`${N_FREE} : ${N_SLAVE}`, `${t.cw.free} : ${t.cw.slave}`, '1860', BLUE] : i === 1 ? [`${N_FREE} : ${N_BORDER} : ${N_LEFT}`, `${t.cw.free} : ${t.cw.stayed} : ${t.cw.left}`, '1861', RED] : ['1865', t.lg.ended, '', TEAL];
    if (a2) facts = t.facts2;
    glow = 'rgba(200, 120, 90, .24)';
  } else {
    const sel = S.sel3 !== null ? NAT[S.sel3] : null;
    if (sel) {
      const nt = t.nat[sel.k];
      st = { emo: '🥾', title: nt[0], lead: nt[1], body: a3 && sel.k === 'cherokee' ? t.cherokeeAfter(fmtN(CH_DEAD), fmtN(CH_TOT), fmtN(CH_KM)) : t.natBody };
    } else st = { emo: t.st3[0], title: t.st3[1], lead: t.st3[2], body: t.st3[3] };
    read = [`${S.vis3.size} / ${NAT.length}`, t.explored, '1830–1847', '#5aa9e6'];
    if (a3) facts = t.facts3;
    glow = 'rgba(90, 169, 230, .24)';
  }
  lab.setState({ emo: st.emo, title: st.title, lead: st.lead, body: st.body, extra: '' });
  lab.setReadout(read[0], read[1], read[2], read[3]);
  lab.setGlow(glow);
  lab.setFacts(S.sec ? [] : facts);
}
render();
</script>
