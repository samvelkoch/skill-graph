  else if (act === 'card') { tram.choice = k; tram.t0 = clock; tram.first = false; tram.arr = -9; (k === 'B' || k === 'D' ? sfx.good : sfx.click)(); }
  else if (act === 'nav' || act === 'go') {
    st.i = act === 'go' ? +b.dataset.i : clamp(st.i + +b.dataset.d, 0, 4); st.t0 = clock; st.ripple = false; sfx.tick();
  } else if (act === 'opt') {
    const i = st.i, o = +k; st.res[i] = o; st.t0 = clock;
    if (o === 0) { st.lit[i] = true; sfx.good(); if (st.lit.every(Boolean)) { st.ripple = true; st.t0 = clock; } } else sfx.bad();
  } else if (act === 'backMap') { st.ripple = false; st.i = 0; st.t0 = clock; sfx.tick(); }
  else if (act === 'apPred') { ap.guess = +k; ap.mode = 'rev'; ap.t0 = clock; (+k === 2 ? sfx.good : sfx.bad)(); }
  else if (act === 'apAgain') { ap.mode = 'pred'; ap.guess = null; sfx.tick(); }
  else if (act === 'apLadder') { ap.mode = 'ladder'; sfx.click(); }
  else if (act === 'step') {
    const L = ap.lad, j = +b.dataset.j, a = ACTS[L.ord[L.k]];
    L.from = L.pos; L.pos = j; L.t0 = clock;
    if (j === a.step - 1) { L.done = true; sfx.good(); } else { L.wrong.push(j); sfx.bad(); }
  } else if (act === 'ladNext') {
    const L = ap.lad; if (L.k === ACTS.length - 1) { L.end = true; L.done = false; L.from = L.pos; L.pos = 3; L.t0 = clock; sfx.good(); }
    else { L.k++; L.done = false; L.wrong = []; L.from = L.pos; L.pos = -1; L.t0 = clock; sfx.click(); }
  } else if (act === 'ladAgain') { ap.lad = newLad(ap.lad.seed + 1); sfx.tick(); }
  else if (act === 'chainGo') { S.chain.t0 = clock; S.chain.shown = -1; sfx.click(); }
  else if (act === 'tone') { playTone(k); if (S.tone.pick === null) S.tone.pick = k; else return; }
  else if (act === 'toneAgain') { S.tone.pick = null; S.tone.seed++; sfx.tick(); }
  render();
  if (['pred', 'card', 'opt', 'apPred', 'step', 'chainGo', 'tone', 'ladNext'].includes(act)) showStage();
});

enter();
render();
</script>
