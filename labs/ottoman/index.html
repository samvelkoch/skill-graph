    let best = null;
    for (const [x, y] of cands) {

    placed.push([best[0], best[1], tw, ph]);
    pillBox(c, it.text, best[0], best[1], { fs: it.fs ?? 12, line: it.col ?? 'rgba(255,255,255,.28)' });

  c.beginPath(); c.moveTo(cx - 44 * u, cy - 14 * u); c.bezierCurveTo(cx - 44 * u, cy + 24 * u, cx - 22 * u, cy + 34 * u, cx, cy + 34 * u); c.bezierCurveTo(cx + 22 * u, cy + 34 * u, cx + 44 * u, cy + 24 * u, cx + 44 * u, cy - 14 * u); c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = '#2f5d9a'; c.lineWidth = 3 * u; c.beginPath(); c.moveTo(cx - 41 * u, cy - 2 * u); c.quadraticCurveTo(cx, cy + 10 * u, cx + 41 * u, cy - 2 * u); c.stroke();
  c.strokeStyle = '#d9a53a'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(cx - 36 * u, cy + 8 * u); c.quadraticCurveTo(cx, cy + 20 * u, cx + 36 * u, cy + 8 * u); c.stroke();
  c.fillStyle = '#f2e9d3'; c.strokeStyle = '#7a6a48'; c.lineWidth = 1.5; c.beginPath(); c.ellipse(cx, cy - 14 * u, 44 * u, 9 * u, 0, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = lg(c, cx - 38 * u, cy - 18 * u, cx + 38 * u, cy - 10 * u, [[0, '#3a2214'], [1, '#5a3820']]); c.beginPath(); c.ellipse(cx, cy - 13 * u, 38 * u, 6.5 * u, 0, 0, TAU); c.fill();
  c.fillStyle = 'rgba(255,230,190,.35)'; c.beginPath(); c.ellipse(cx - 12 * u, cy - 15 * u, 12 * u, 2.2 * u, -0.1, 0, TAU); c.fill();
  // cezve: a copper pot with a long handle
  const px = cx - 118 * u, py = cy + 20 * u;
  c.fillStyle = lg(c, px - 24 * u, py - 40 * u, px + 24 * u, py + 20 * u, [[0, '#e3a05a'], [1, '#9a5a2a']]); c.strokeStyle = '#4e2c12'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(px - 16 * u, py - 40 * u); c.lineTo(px + 16 * u, py - 40 * u); c.lineTo(px + 26 * u, py + 18 * u); c.lineTo(px - 26 * u, py + 18 * u); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(px + 16 * u, py - 40 * u); c.lineTo(px + 22 * u, py - 46 * u); c.lineTo(px + 10 * u, py - 40 * u); c.fill(); c.stroke();
  c.lineWidth = 5 * u; c.strokeStyle = '#4e2c12'; c.lineCap = 'round'; c.beginPath(); c.moveTo(px - 24 * u, py - 20 * u); c.lineTo(px - 66 * u, py - 40 * u); c.stroke();
  // steam: soft puffs that rise and fade
  for (const x0 of [cx - 22 * u, cx, cx + 22 * u, px]) for (let i = 0; i < 6; i++) {
    const ph = ((time * 0.28 + i / 6 + x0 * 0.013) % 1), sy = x0 === px ? py - 46 * u : cy - 18 * u;
    c.fillStyle = `rgba(255,255,255,${(1 - ph) * 0.16 * a})`; c.beginPath(); c.arc(x0 + Math.sin(ph * 7 + i * 2 + x0) * 9 * u, sy - ph * 120 * u, Math.max(0, (5 + 16 * ph) * u), 0, TAU); c.fill();
  }
  c.restore();
  pillBox(c, `☕ ${T[lang].secrets.a[0]}`, clamp(w / 2 - 110, 6, w), 12, { fs: 14 });
}
const TUL = Array.from({ length: 36 }, (_, i) => ({ x: ((i * 0.6180339) % 1), row: i % 4, col: ['#d6303b', '#f2b632', '#e873a2', '#f6efe0', '#9a3fb5'][i % 5], d: (i * 0.37) % 1 }));
function tulip(c, x, y, sz, col, b, sway) {
  c.save(); c.translate(x, y); c.rotate(sway * 0.06);
  const stem = 46 * sz * b;
  c.strokeStyle = '#3f8a4a'; c.lineWidth = Math.max(1.5, 2.6 * sz); c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(3 * sz, -stem * 0.5, 0, -stem); c.stroke();
  c.fillStyle = '#4fa15a'; c.beginPath(); c.moveTo(0, -4 * sz); c.quadraticCurveTo(-20 * sz * b, -22 * sz * b, -12 * sz * b, -40 * sz * b); c.quadraticCurveTo(-5 * sz * b, -20 * sz * b, 0, -4 * sz); c.fill();
  const fy = -stem, o = 1 - 0.55 * b + 0.15, pw = 11 * sz * b, ph = 20 * sz * b;
  c.lineWidth = 1; c.strokeStyle = shade(col, 0.45);
  for (const dir of [-1, 1]) { c.fillStyle = shade(col, 0.15); c.beginPath(); c.moveTo(0, fy); c.quadraticCurveTo(dir * pw * (1.2 + o * 0.4), fy - ph * 0.3, dir * pw * 0.4, fy - ph); c.quadraticCurveTo(dir * pw * 0.1, fy - ph * 0.5, 0, fy); c.fill(); c.stroke(); }
  c.fillStyle = col; c.beginPath(); c.moveTo(-pw * 0.7, fy - ph * 0.15); c.quadraticCurveTo(-pw * 0.9, fy - ph * 0.8, 0, fy - ph * 1.1); c.quadraticCurveTo(pw * 0.9, fy - ph * 0.8, pw * 0.7, fy - ph * 0.15); c.quadraticCurveTo(0, fy + ph * 0.1, -pw * 0.7, fy - ph * 0.15); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.28)'; c.beginPath(); c.ellipse(-pw * 0.2, fy - ph * 0.6, pw * 0.14, ph * 0.28, 0.15, 0, TAU); c.fill();
  c.restore();
}
function drawTulips(c, w, h, time, a) {
  c.save(); c.globalAlpha = a * 0.38; c.fillStyle = '#10200f'; c.fillRect(0, 0, w, h); c.globalAlpha = 1;
  const t0 = S.secT0;
  for (const row of [0, 1, 2, 3]) for (const q of TUL) {
    if (q.row !== row) continue;
    const dt = time - t0 - q.d * 1.4 - row * 0.15, b = easeBloom(clamp01(dt / 1.1));
    const x = q.x * (w - 20) + 10, y = h * (0.7 + row * 0.1), sz = 0.8 + row * 0.22;
    tulip(c, x, y, sz * Math.min(1, w / 380) * 1.1, q.col, b * a, Math.sin(time * 1.6 + q.x * 12));
  }
  c.restore();
  pillBox(c, `🌷 ${T[lang].secrets.b[0]}`, clamp(w / 2 - 60, 6, w), 12, { fs: 14 });
}
const easeBloom = (t) => backOut(t);
function drawSecret(c, w, h, dt, time) {
  S.secA += ((S.sec ? 1 : 0) - S.secA) * Math.min(1, dt * 6);
  if (S.secA < 0.01) return;
  if (S.secKey === 'a') drawCoffee(c, w, h, time, S.secA); else drawTulips(c, w, h, time, S.secA);
}

// --- controls and reading ------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function askBlock(key, q, opts, why, busy) {
  const t = T[lang], ans = S.pred[key];
  let html = `<div class="ot-q">${esc(q)}</div><div class="ot-opts">${S.perm[key].map((oi) => {
    const cls = ans !== null ? (oi === 0 ? ' ot-good' : oi === ans ? ' ot-bad' : '') : '';
    return `<button type="button" class="chip ot-opt${cls}" data-act="pick" data-k="${key}" data-i="${oi}"${ans !== null ? ' disabled' : ''}>${esc(opts[oi])}</button>`;
  }).join('')}</div>`;
  if (ans !== null && !busy) html += `<div class="ot-v"><b style="color:${ans === 0 ? 'var(--ok)' : 'var(--wip)'}">${esc(ans === 0 ? t.right : t.notQuite)}</b> ${esc(why)}</div>`;
  return html;
}
const latestEv = (y) => { let l = null; for (const ev of EV) if (y >= ev.y) l = ev; return l; };
function updGrow() {
  const t = T[lang], yr = Math.round(S.year), ev = latestEv(yr);
  S.lastYr = yr;
  const sub = ev ? (ev.taken ? t.taken(t.events[ev.k]) : t.events[ev.k]) : '';
  lab.setReadout(String(yr), sub, '', '#b3261e');
  const el = $('otYr'); if (+el.value !== yr) el.value = yr;
  const p = (S.cap - 1300) / 400 * 100;
  el.style.setProperty('--track', `linear-gradient(90deg, #d4a72c, #b3261e ${p}%, rgba(130,145,190,.25) ${p}%)`);
  $('otPlay').textContent = `${S.playing ? '⏸' : '▶'} ${S.playing ? t.pause : t.play}`;
  $('otPlay').disabled = S.rev > 0 || (!S.playing && S.year >= S.cap - 0.01 && S.cap < 1700);
  el.disabled = S.rev > 0;
}
function hunParts(y) { return y < 1541 ? T[lang].onePart : y < 1699 ? T[lang].threeParts : T[lang].twoParts; }
function updHun() {
  const t = T[lang], yr = Math.round(S.hy), answered = S.pred.split !== null && !S.hyRev;
  S.lastHy = yr;
  if (S.pred.split === null) lab.setReadout('?', t.partsIn(1540), '', '#d4a72c');
  else lab.setReadout(hunParts(yr), t.partsIn(yr), '', '#d4a72c');
  const el = $('otYh'); if (+el.value !== yr) el.value = yr;
  const p = (S.hyCap - 1526) / 174 * 100;
  el.style.setProperty('--track', `linear-gradient(90deg, #d4a72c, #b3261e ${p}%, rgba(130,145,190,.25) ${p}%)`);
  el.disabled = S.hyRev;
  void answered;
}
function renderGrow(t) {
  $('otAskG').innerHTML = askBlock('next', t.qNext, t.optsNext, t.nextWhy, S.rev > 0);
  $('otYrL').textContent = t.year;
  lab.setGlow('rgba(179, 38, 30, .26)');
  lab.setState({ ...t.state.grow, extra: '' });
  lab.setFacts(t.facts.grow);
  updGrow();
}
function renderHun(t) {
  const ans = S.pred.split, busy = S.hyRev;
  $('otAskH').innerHTML = askBlock('split', t.qSplit, t.optsSplit, t.splitWhy, busy);
  $('otYhL').textContent = t.year;
  $('otJump').innerHTML = ans !== null && !busy ? [1541, 1552, 1686, 1699].map((y) => `<button type="button" class="chip ot-jchip" data-act="jump" data-y="${y}">${y}</button>`).join('') : '';
  lab.setGlow('rgba(212, 167, 44, .26)');
  const leg = `<div class="ot-leg">${['royal', 'ottoman', 'transylvania'].map((k, i) => `<div><i style="background:${HCOL[i]}"></i>${esc(t.parts[k])}</div>`).join('')}</div>`;
  if (ans === null) lab.setState({ emo: '🏰', title: t.qSplit, lead: '', body: '', extra: '' });
  else lab.setState({ ...t.state.hungary, extra: busy ? '' : leg });
  lab.setFacts(t.facts.hungary);
  updHun();
}
function renderPeo(t) {
  const ans = S.pred.rule, busy = S.peoRev;
  $('otAskP').innerHTML = askBlock('rule', t.qRule, t.optsRule, t.ruleWhy, busy);
  $('otCards').innerHTML = COMM.map((k, i) => {
    const open = ans !== null && i < S.cardsOpen, non = k !== 'muslim';
    return `<button type="button" class="ot-card${S.card === k ? ' ot-sel' : ''}" data-act="card" data-c="${k}"${ans === null || busy ? ' disabled' : ''}><b><i style="background:${CCOL[k]}"></i>${esc(t.communities[k])}</b><span>${open ? `🙏 ⚖️ 🏫${non ? ' 💰' : ''}` : ''}</span></button>`;
  }).join('');
  $('otCap').classList.toggle('ot-off', !S.tl);
  $('otCap').textContent = S.tl ? t.timelineCaps[S.tl] : '';
  lab.setGlow('rgba(63, 154, 79, .24)');
  lab.setReadout(ans === null ? '?' : t.fourComm, t.inStreet, '', '#3f9a4f');
  if (ans === null) lab.setState({ emo: '🕌', title: t.qRule, lead: '', body: '', extra: '' });
  else lab.setState({ ...t.state.peoples, extra: busy ? '' : `<div class="ot-mil">${esc(t.millet)}</div>` });
  lab.setFacts(t.facts.peoples);
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('otGrow').classList.toggle('ot-off', v !== 'grow');
  $('otHun').classList.toggle('ot-off', v !== 'hungary');
  $('otPeo').classList.toggle('ot-off', v !== 'peoples');
  const open = secret.unlocked();
  $('otSecRow').innerHTML = ['a', 'b'].map((k) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'a' ? '☕' : '🌷'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (v === 'grow') renderGrow(t); else if (v === 'hungary') renderHun(t); else renderPeo(t);
  if (S.sec) { const k = S.sec, s = t.secrets[k]; lab.setState({ emo: k === 'a' ? '☕' : '🌷', title: s[0], lead: s[1], body: '', extra: '' }); }
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'pick') {
    const k = b.dataset.k, i = +b.dataset.i;
    if (S.pred[k] !== null) return;
    S.pred[k] = i; (i === 0 ? sfx.good : sfx.bad)();
    if (k === 'next') { S.cap = 1700; S.playing = false; S.year = 1526; S.rev = 1; }
    else if (k === 'split') { S.hyCap = 1700; S.hyT = 1560; S.hyRev = true; }
    else { S.peoRev = true; S.peoT0 = nowS(); S.cardsOpen = 0; S.card = null; }
    showStage();
  } else if (act === 'play') { /* handled by the button below */ }
  else if (act === 'jump') { S.hyT = +b.dataset.y; sfx.click(); }
  else if (act === 'card') { S.card = b.dataset.c; sfx.tick(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null; else { S.sec = k; S.secKey = k; S.secT0 = nowS(); }
    sfx.click();
  }
  render();
});
$('otPlay').addEventListener('click', () => {
  if (S.rev > 0) return;
  if (S.playing) { S.playing = false; sfx.click(); }
  else { if (S.year >= S.cap - 0.01) { if (S.cap >= 1700) S.year = 1300; else return; } S.playing = true; sfx.click(); }
  updGrow();
});
$('otYr').addEventListener('input', (ev) => {
  const v = Math.min(+ev.target.value, S.cap); S.year = v; S.playing = false; if (+ev.target.value !== v) ev.target.value = v; updGrow();
});
$('otYh').addEventListener('input', (ev) => {
  const v = Math.min(+ev.target.value, S.hyCap); S.hyT = v; if (+ev.target.value !== v) ev.target.value = v; updHun();
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  for (const h of S.hit) if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) { h.fn(); break; }
});

// --- time: play, reveal and easing; runs inside the draw loop --------------------------------------------------
function step(dt) {
  S.yd += (S.year - S.yd) * Math.min(1, dt * 7);
  S.hy += (S.hyT - S.hy) * Math.min(1, dt * 5);
  if (S.playing && lab.view === 'grow') {
    S.year = Math.min(S.cap, S.year + dt * 30);
    if (S.year >= S.cap) { S.playing = false; updGrow(); }
  }
  if (S.rev === 1 && Math.abs(S.yd - 1526) < 0.8) S.rev = 2;
  if (S.rev === 2) {
    S.year = Math.min(1541, S.year + dt * 10);
    if (S.year >= 1541) { S.rev = 0; render(); }
  }
  if (S.hyRev && S.hy > 1559) { S.hyRev = false; render(); }
  if (S.peoRev) {
    const el = nowS() - S.peoT0, n = Math.min(4, Math.floor(el / 0.75) + 1);
    if (n !== S.cardsOpen) { S.cardsOpen = n; S.card = COMM[n - 1]; sfx.tick(); render(); }
    if (el > 4 * 0.75 + 0.4) { S.peoRev = false; render(); }
  }
  if (lab.view === 'grow' && Math.round(S.year) !== S.lastYr) updGrow();
  if (lab.view === 'hungary' && Math.round(S.hy) !== S.lastHy) updHun();
}

render();
canvasLoop($('cv'), (c, w, h, dt, time) => {
  step(dt); S.hit = [];
  const v = lab.view;
  if (v === 'grow') drawGrow(c, w, h, dt, time); else if (v === 'hungary') drawHungary(c, w, h, dt, time); else drawPeoples(c, w, h, dt, time);
  drawSecret(c, w, h, dt, time);
});
</script>
