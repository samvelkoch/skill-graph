const NS = [1, 2, 5, 10, 20];
function sim(n) { // two 20-minute jobs, a 1-minute reload before every block except the first
  const segs = [], rem = [20, 20]; let t = 0, k = 0;
  while (rem[0] > 0 || rem[1] > 0) {
    if (rem[k] <= 0) { k = 1 - k; continue; }
    const len = Math.min(n, rem[k]);
    if (segs.length) { segs.push({ k: 'r', s: t, l: 1 }); t += 1; }
    segs.push({ k: k ? 'b' : 'a', s: t, l: len }); t += len; rem[k] -= len; k = 1 - k;
  }
  const sw = segs.filter((s) => s.k === 'r').length;
  return { segs, total: t, work: 40, sw };
}
function simBuzz() { // 40 minutes of homework, a buzz every 5 minutes: 1 min to look + 1 min to get back
  const segs = []; let t = 0, w = 0;
  while (w < 40) { segs.push({ k: 'a', s: t, l: 5 }); t += 5; w += 5; if (w < 40) { segs.push({ k: 'r', s: t, l: 2 }); t += 2; } }
  return { segs, total: t };
}

  const lanes = [{ y: 100, h: 64, x: 12, w: 316, col: GREEN, name: t.ez.auto }, { y: 182, h: 50, x: 100, w: 140, col: YEL, name: t.ez.think }];
  lanes.forEach((l) => {
    const g = c.createLinearGradient(0, l.y, 0, l.y + l.h); g.addColorStop(0, shade(l.col, 0.55)); g.addColorStop(1, shade(l.col, 0.7));
    c.fillStyle = g; rr(c, l.x, l.y, l.w, l.h, 12); c.fill(); c.strokeStyle = shade(l.col, 0.2); c.lineWidth = 2; c.stroke();
    txt(c, l.name, l.x + 8, l.y - 8, { fg: '#C6CDE0' });
  });
  S.ez.t += dt;
  const slotA = [24, 128, 232];
  let ia = 0, it = 0;
  sel.forEach((k) => {
    const auto = !!EZ_AUTO[k]; let tx, ty;
    if (auto) { tx = 12 + 10 + ia * 104; ty = 108; ia++; } else { tx = 112 + (both && it === 1 ? 6 : 0); ty = 188 + (both && it === 1 ? 8 : 0); it++; }
    const ps = S.ez.pos[k] || (S.ez.pos[k] = { x: 170 - 48, y: 84 });
    ps.x = lerp(ps.x, tx, Math.min(1, dt * 8)); ps.y = lerp(ps.y, ty, Math.min(1, dt * 8));
  });
  const fr0 = Math.floor(S.ez.t / 0.7) % 2, order = sel.filter((k) => EZ_AUTO[k]).concat(both ? [th[1 - fr0], th[fr0]] : th);
  order.forEach((k) => {
    const ps = S.ez.pos[k]; if (!ps) return;
    c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 6; c.shadowOffsetY = 3;
    const col = EZ_COL[k], g = c.createLinearGradient(ps.x, ps.y, ps.x + 20, ps.y + 40); g.addColorStop(0, shade(col, -0.3)); g.addColorStop(1, shade(col, 0.15));
    c.fillStyle = g; rr(c, ps.x, ps.y, 96, 40, 12); c.fill(); c.shadowColor = 'transparent'; c.strokeStyle = shade(col, 0.45); c.lineWidth = 2; c.stroke();
    c.fillStyle = INK; c.font = '18px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(EZ_EMO[k], ps.x + 7, ps.y + 21);
    c.font = '900 12px Nunito, sans-serif'; c.fillText(t.ez.short[k], ps.x + 31, ps.y + 21); c.restore();
  });
  if (sel.length < 2) { pill(c, t.ez.pick, 170, 300, { max: 340 }); return; }
  // the result: parallel rows, or one row where the two take turns with grey slivers
  const x0 = 20, w = 300, grow = ease(((S.ez.t % 4) / 3));
  txt(c, both ? t.ez.turns : t.ez.par, x0, 258, { fg: '#C6CDE0' });
  if (both) {
    const segs = []; let m = 0; for (let i = 0; i < 12; i++) { if (i) { segs.push({ k: 'r', s: m, l: 1 }); m += 1; } segs.push({ k: i % 2 ? 'b' : 'a', s: m, l: 4 }); m += 4; }
    bar(c, x0, 270, w, 30, w / m, segs, m * grow, { a: EZ_COL[th[0]], b: EZ_COL[th[1]], r: GREY });
  } else {
    sel.forEach((k, i) => bar(c, x0, 270 + i * 20, w, 16, w / 60, [{ k: 'a', s: 0, l: 60 }], 60 * grow, { a: EZ_COL[k] }));
  }
}

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
};
function finishRun1() {
  const d = S.simd; S.tried[S.n] = d.total;
  const ok = Math.abs(S.flag - d.total) <= 3; (ok ? sfx.good : sfx.bad)(); showStage(); render();
}
function finishRun2() {
  (S.rank.join() === PH_TRUE.join() ? sfx.good : sfx.bad)(); showStage(); render();
}
$('flag').addEventListener('input', (ev) => { S.flag = +ev.target.value; renderFlag(); });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'n') { if (S.phase === 'run') return; S.n = NS[+b.dataset.i]; S.simd = sim(S.n); S.phase = 'set'; S.t = 0; sfx.tick(); }
  else if (a === 'run1') {
    if (S.phase === 'set') { S.phase = 'run'; S.t = 0; sfx.click(); showStage(); }
    else if (S.phase === 'done') { S.phase = 'set'; S.t = 0; sfx.click(); }
  }
  else if (a === 'rank') { if (S.phase2 !== 'pick' || S.rank.includes(b.dataset.k) || S.rank.length >= 3) return; S.rank.push(b.dataset.k); sfx.tick(); }
  else if (a === 'clr2') { if (S.phase2 === 'run') return; S.rank = []; S.phase2 = 'pick'; S.p2 = 0; sfx.click(); }
  else if (a === 'go2') {
    if (S.phase2 === 'done') { S.rank = []; S.phase2 = 'pick'; S.p2 = 0; sfx.click(); }
    else if (S.phase2 === 'pick' && S.rank.length === 3) { S.phase2 = 'run'; S.p2 = 0; sfx.click(); showStage(); }
  }
  else if (a === 'clr3') { S.sched = []; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = b.dataset.k; sfx.click();
    if (S.sec === 'pomo') S.pm = { run: false, mode: 'w', left: 1500, n: 0 };
    else S.ez = { sel: ['walk', 'chat'], pos: {}, t: 0 };
  }
  else if (a === 'back') { S.sec = null; sfx.click(); }
  else if (a === 'pmgo') { S.pm.run = !S.pm.run; sfx.click(); }
  else if (a === 'pmrs') { S.pm = { run: false, mode: 'w', left: 1500, n: 0 }; sfx.click(); }
  else if (a === 'ez') {
    const k = b.dataset.k, s = S.ez.sel;
    if (s.includes(k)) s.splice(s.indexOf(k), 1); else { s.push(k); if (s.length > 2) delete S.ez.pos[s.shift()]; }
    sfx.tick();
  }
  render();
});

// --- one render per change ---------------------------------------------------------------------------------
function renderFlag() {
  const t = T[lang]; $('fLbl').textContent = t.sw.q + '  ' + t.sw.flag(S.flag);
  if (S.phase === 'set') lab.setReadout('?', t.sw.flag(S.flag), t.sw.pill(S.flag), '#e0b050');
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec || v;
  $('vSwitch').style.display = !sec && v === 'switch' ? '' : 'none';
  $('vPhone').style.display = !sec && v === 'phone' ? '' : 'none';
  $('vPlan').style.display = !sec && v === 'plan' ? '' : 'none';
  $('vPm').style.display = sec === 'pomo' ? '' : 'none';
  $('vEz').style.display = sec === 'easy' ? '' : 'none';
  const open = secret.unlocked();
  $('secRow').innerHTML = [['pomo', '🍅'], ['easy', '🚶']].map(([k, e]) => `<button class="chip fc-t secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec === 'pomo') return renderPomo(t);
  if (sec === 'easy') return renderEasy(t);
  if (v === 'switch') renderSwitch(t); else if (v === 'phone') renderPhone(t); else renderPlan(t);
}
function renderSwitch(t) {
  const s = t.sw, run = S.phase === 'run', done = S.phase === 'done', d = S.simd;
  lab.setGlow('rgba(95, 143, 208, .26)');
  $('nLbl').textContent = s.every;
  $('nChips').innerHTML = NS.map((n, i) => `<button class="chip fc-t ${n === S.n ? 'on' : ''} ${run && n !== S.n ? 'dim' : ''}" data-act="n" data-i="${i}">${n >= 20 ? `20 · ${esc(s.never)}` : `${n} ${esc(t.min)}`}</button>`).join('');
  $('flag').disabled = S.phase !== 'set'; $('flag').value = S.flag;
  $('runB').textContent = run ? s.running : done ? s.again : s.run; $('runB').disabled = run;
  $('tried').innerHTML = Object.keys(S.tried).length ? `<span style="border:0;padding-left:0;color:var(--faint)">${esc(s.tried)}:</span>` + NS.filter((n) => S.tried[n]).map((n) => `<span>${n} ${esc(t.min)} → ${S.tried[n]}</span>`).join('') : '';
  if (done) {
    const ok = Math.abs(S.flag - d.total) <= 3;
    $('fLbl').textContent = s.flag(S.flag);
    lab.setReadout(d.total, t.min, ok ? s.right : '', '#6fb36f');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? s.right : s.off(S.flag, d.total), lead: s.sum(d.work, d.sw, d.total), body: s.at(clockAt(16, d.total)), extra: '' });
  } else if (run) {
    $('fLbl').textContent = s.flag(S.flag);
    lab.setReadout('…', s.title(S.n), '', '#e0b050');
    lab.setState({ emo: '⏱️', title: s.running, lead: s.model, body: '', extra: '' });
  } else {
    renderFlag();
    lab.setState({ emo: '⏱️', title: s.title(S.n), lead: s.setLead, body: s.model, extra: '' });
  }
  lab.setFacts([{ emo: '🧠', text: t.facts.switch, src: FACT_SRC.switch }]);
}
function renderPhone(t) {
  const p = t.ph, ph2 = S.phase2, done = ph2 === 'done';
  lab.setGlow('rgba(143, 127, 208, .26)');
  $('pq').textContent = p.q;
  $('pCards').innerHTML = PH_KEYS.map((k) => {
    const ri = S.rank.indexOf(k), cls = done ? (S.rank[PH_TRUE.indexOf(k)] === k ? 'ok' : 'no') : '';
    return `<button class="fc-card ${cls}" data-act="rank" data-k="${k}" ${ph2 !== 'pick' ? 'disabled' : ''}><span class="e">${k === 'buzz' ? '📳' : k === 'down' ? '📱' : '🚪'}</span>${esc(p.setups[k])}<span class="r">${ri >= 0 ? ri + 1 : ''}</span></button>`;
  }).join('');
  $('pClr').textContent = p.clear; $('pClr').disabled = ph2 === 'run'; $('pClr').style.display = done ? 'none' : '';
  $('pGo').textContent = done ? p.again : ph2 === 'run' ? p.running : p.reveal; $('pGo').disabled = ph2 === 'run' || (ph2 === 'pick' && S.rank.length < 3);
  $('pNote').textContent = ph2 === 'pick' ? '' : p.note;
  if (done) {
    const ok = S.rank.join() === PH_TRUE.join();
    lab.setReadout(`${PH.buzz.sim.total}`, `${t.min} · ${p.setups.buzz}`, ok ? p.right : '', '#6fb36f');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? p.right : p.wrong, lead: ok ? p.leadRight : p.leadWrong, body: '', extra: '' });
  } else {
    lab.setReadout('?', ph2 === 'run' ? '' : p.pick(S.rank.length), '', '#8f7fd0');
    lab.setState({ emo: '📱', title: p.title, lead: p.model, body: '', extra: '' });
  }
  lab.setFacts([{ emo: '📵', text: t.facts.phone, src: FACT_SRC.phone }]);
}
function renderPlan(t) {
  const p = t.pl, lay = layout(S.sched), n = S.sched.length, lvl = lay.maxRun > 45 ? 2 : lay.maxRun > 25 ? 1 : 0;
  lab.setGlow('rgba(111, 179, 111, .26)');
  $('plHint').textContent = p.hint; $('plClr').textContent = p.clear; $('plClr').disabled = !n;
  const thinkAll = S.sched.filter((k) => PLAN[k].think).length;
  if (!n) {
    lab.setReadout('—', p.t0, '', '#6fb36f');
    lab.setState({ emo: '🗓️', title: p.empty, lead: p.emptyLead, body: '', extra: '' });
  } else {
    const endM = lay.total, over = endM > 180;
    lab.setReadout(clockAt(15, endM), `${p.doneAt} · ${p.stats(lay.sw, lay.br)}`, p.lv[lvl], ['#6fb36f', '#e0b050', '#e5484d'][lvl]);
    const lines = [];
    if (lay.sw) lines.push(p.swS(lay.sw));
    if (lay.maxRun > 25) lines.push(p.runS(lay.maxRun));
    if (over) lines.push(p.overS);
    const all = TRAY.filter((k) => !PLAN[k].many).every((k) => S.sched.includes(k));
    const good = !lines.length && thinkAll > 0;
    lab.setState({ emo: good ? '🌿' : '🗓️', title: good ? p.okT : p.moreT, lead: good ? (all ? p.good : p.partial) : lines.join(' '), body: '', extra: '' });
  }
  lab.setFacts([{ emo: '🍅', text: t.facts.plan, src: FACT_SRC.plan }]);
}
function renderPomo(t) {
  const p = S.pm;
  lab.setGlow('rgba(229, 72, 77, .24)');
  $('pmGo').textContent = p.run ? t.pm.pause : t.pm.start; $('pmRs').textContent = t.pm.reset; $('pmBk').textContent = t.pm.back; $('pmNote').textContent = t.pm.fast;
  const s = Math.max(0, Math.ceil(p.left));
  lab.setReadout(`${pad(Math.floor(s / 60))}:${pad(s % 60)}`, p.mode === 'w' ? t.pm.work : t.pm.brk, t.pm.n(p.n), p.mode === 'w' ? '#6fb36f' : '#5f8fd0');
  lab.setState({ emo: '🍅', title: t.pm.title, lead: t.pm.lead, body: '', extra: '' });
  lab.setFacts([{ emo: '🍅', text: t.facts.plan, src: FACT_SRC.plan }]);
}
function renderEasy(t) {
  const e = t.ez, sel = S.ez.sel, th = sel.filter((k) => !EZ_AUTO[k]).length;
  lab.setGlow('rgba(224, 176, 80, .24)');
  $('ezQ').textContent = e.pick; $('ezBk').textContent = e.back; $('ezFine').textContent = e.fine;
  $('ezChips').innerHTML = Object.keys(EZ_EMO).map((k) => `<button class="chip fc-t ${sel.includes(k) ? 'on' : ''}" data-act="ez" data-k="${k}">${EZ_EMO[k]} ${esc(e.tasks[k])}</button>`).join('');
  lab.setReadout(sel.length === 2 ? (th === 2 ? '🔀' : '✅') : '?', sel.length === 2 ? (th === 2 ? e.turns : e.par) : '', '', th === 2 ? '#e0b050' : '#6fb36f');
  if (sel.length < 2) lab.setState({ emo: '🚶', title: e.pick, lead: '', body: '', extra: '' });
  else lab.setState({ emo: th === 2 ? '🔀' : '✅', title: th === 2 ? e.t2 : th === 1 ? e.t1 : e.t0, lead: th === 2 ? e.l2 : th === 1 ? e.l1 : e.l0, body: '', extra: '' });
  lab.setFacts([{ emo: '🧠', text: t.facts.switch, src: FACT_SRC.switch }]);
}
render();
</script>
