  for (const L of labels) tag(c, `${L.r.m} ${u().kg}${L.r.moon ? ' 🌙' : ''}`, px(L.tEnd) - 6, L.y - 14, { size: 12, align: 'right', min: gx0 + 2, line: mcol(L.r) });
}

// --- view 2: the toy car with its two arrows -------------------------------------------------------------------
const comboKey = () => `${P2.motor ? 1 : 0}${P2.fric ? 1 : 0}`;
// forces on the toy car; at rest friction can only match the push, never exceed it
const forces = () => {
  const fm = P2.motor ? FM : 0, ff = P2.fric ? FF : 0, ffe = P2.v > 0 ? ff : Math.min(ff, fm);
  return { fm, ffe, net: fm - ffe };
};
function drawSteady(c, w, h, dt, time) {
  if (P2.guess !== null) { P2.v = Math.max(0, P2.v + forces().net / TOY_M * dt); }
  P2.x += P2.v * dt;
  const DW = 380, sc = Math.min(w / DW, (h - 20) / 190), hidden = P2.guess === null;
  const fy = room(c, 4, 4, w - 8, h - 8, false, 0.62, P2.x * PXM * sc, 2 * PXM * sc);
  const gyS = fy + (h - 8) * 0.38 * 0.45, ox = (w - DW * sc) / 2, oy = gyS - 140 * sc;
  c.save(); c.translate(ox, oy); c.scale(sc, sc);
  const cx = 190, gy = 140, k = 1.25, fs = 12.5 / sc, rear = cx - 62 * k - 4, front = cx + 62 * k + 4, t = T[lang];
  // speed streaks behind the car
  for (let i = 0; i < 5; i++) {
    const len = Math.min(80, P2.v * 7) * (0.65 + 0.35 * Math.sin(time * 17 + i * 2.3));
    if (len < 2) continue;
    c.strokeStyle = `rgba(220,230,255,${0.1 + 0.05 * (i % 3)})`; c.lineWidth = 2.4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(rear - 6, gy - 14 - i * 11); c.lineTo(rear - 6 - len, gy - 14 - i * 11); c.stroke();
  }
  toyCar(c, cx, gy, k, P2.x * PXM / 12, '#f5a524');
  const my = gy - 30, fyA = gy - 5;
  if (hidden) { // the answer stays out of the picture: two question marks instead of arrows
    for (const [x, y, col, lbl] of [[front + 22, my, '#5ce08a', t.s.tags.motor], [rear - 22, fyA, '#ff6b6b', t.s.tags.fric]]) {
      c.save(); c.setLineDash([4, 4]); c.strokeStyle = col; c.lineWidth = 2.2; c.fillStyle = 'rgba(10,12,22,.7)';
      c.beginPath(); c.arc(x, y, 16, 0, TAU); c.fill(); c.stroke(); c.restore();
      c.fillStyle = '#fff'; c.font = `900 ${18}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', x, y + 1);
      tag(c, lbl, x, y - 28, { size: fs, line: col });
    }
  } else {
    const { fm, ffe, net } = forces();
    if (fm > 0) arrow(c, front, my, front + fm * 14, '#5ce08a', 5);
    if (ffe > 0) arrow(c, rear, fyA, rear - ffe * 14, '#ff6b6b', 5);
    tag(c, `${t.s.tags.motor}: ${fm} ${u().N}`, front + Math.max(fm, 2) * 7, my - 24, { size: fs, line: 'rgba(92,224,138,.7)', max: DW - 4 });
    tag(c, `${t.s.tags.fric}: ${ffe} ${u().N}`, rear - Math.max(ffe, 2) * 7, fyA + 22, { size: fs, line: 'rgba(255,107,107,.7)', min: 4 });
    tag(c, `${t.s.tags.net}: ${fmt(net)} ${u().N}`, cx, 36, { size: fs });
  }
  c.restore();
}

// --- view 3: the race ---------------------------------------------------------------------------------------------
const tOf = (m, F) => V100 * m / F;
function startRace() {
  const Fc = P3.F, Fv = P3.own ? P3.Fv : P3.F, ac = Fc / CAR_M, av = Fv / VAN_M, tc = V100 / ac, tv = V100 / av;
  P3.race = { t: 0, ac, av, tc, tv, Fc, Fv, end: Math.max(tc, tv) + 0.6, done: false };
  P3.fresh = false; sfx.push(); render();
}
function finishRace() {
  const r = P3.race;
  if (typeof P3.guess === 'number') { P3.verdict = P3.guess === (r.tc < r.tv - 0.05 ? 0 : r.tv < r.tc - 0.05 ? 1 : 2); P3.fresh = true; (P3.verdict ? sfx.good : sfx.bad)(); P3.guess = 'shown'; }
  render();
}
function drawCars(c, w, h, dt, time) {
  const r = P3.race;
  if (r && !r.done) { r.t += dt * KSPD; if (r.t >= r.end) { r.t = r.end; r.done = true; finishRace(); } }
  const t = T[lang], s = clamp(w * 0.0016, 0.45, 0.8), x0 = 20 + 66 * s, x1 = w - 20 - 70 * s, ry0 = 8, ry1 = h - 8, lh = (ry1 - ry0) / 2;
  // road
  c.save(); rr(c, 4, ry0, w - 8, ry1 - ry0, 16); c.clip();
  let g = c.createLinearGradient(0, ry0, 0, ry1); g.addColorStop(0, '#2a2f4a'); g.addColorStop(1, '#1b1f36'); c.fillStyle = g; c.fillRect(4, ry0, w - 8, ry1 - ry0);
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.setLineDash([14, 12]); c.beginPath(); c.moveTo(4, ry0 + lh); c.lineTo(w - 4, ry0 + lh); c.stroke(); c.setLineDash([]);
  c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 3; c.beginPath(); c.moveTo(x0 - 74 * s, ry0 + 4); c.lineTo(x0 - 74 * s, ry1 - 4); c.stroke(); // the start line
  c.restore();
  const dmax = r ? Math.max(0.5 * r.ac * r.tc * r.tc, 0.5 * r.av * r.tv * r.tv) : 1;
  const list = [{ name: t.c.car, m: CAR_M, a: r ? r.ac : 0, t100: r ? r.tc : 0, col: '#ef6b5b', draw: toyCar, y: ry0 + lh * 0.55 }, { name: t.c.van, m: VAN_M, a: r ? r.av : 0, t100: r ? r.tv : 0, col: '#4aa3df', draw: vanShape, y: ry0 + lh * 1.55 }];
  for (const L of list) {
    const tt = r ? Math.min(r.t, L.t100) : 0, d = 0.5 * L.a * tt * tt, X = x0 + (r ? d / dmax : 0) * (x1 - x0), v = L.a * tt;
    L.draw(c, X, L.y + 26 * s, s, d * 0.2, L.col);
    tag(c, `${L.name} · ${L.m} ${u().kg}`, 14, L.y + lh * 0.38, { align: 'left', size: 12 });
    if (r) {
      const fin = r.t >= L.t100 - 1e-9;
      tag(c, fin ? `✓ ${fmt(L.t100, 1)} ${u().s}` : `${Math.round(v * 3.6)} ${t.c.unit}`, X, L.y - 52 * s - 6, { size: 12.5, min: 6, max: w - 6, line: fin ? 'rgba(92,224,138,.8)' : 'rgba(255,255,255,.25)', fg: fin ? '#5ce08a' : '#fff' });
    }
  }
  if (r && !r.done) tag(c, t.c.fast, w - 12, ry0 + 14, { align: 'right', size: 12, min: 8 });
}

// --- controls: clicks and sliders -------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function pressSecret(k) {
  if (!secret.unlocked()) return secret.open();
  if (P1.phase !== 'free') { P1.phase = 'free'; P1.guess = P1.guess ?? -1; P1.fresh = false; if (P1.F < 1) P1.F = 6; }
  P1.moon = k === 'moon' ? !P1.moon : false; P1.mom = k === 'mom' ? !P1.mom : false; sfx.click();
  if (P1.moon) { // the same trolley first on Earth (a ghost line), then on the Moon
    if (!P1.runs.some((r) => !r.moon && r.F === P1.F && r.m === P1.m)) { P1.runs.push({ F: P1.F, m: P1.m, a: P1.F / P1.m, moon: false }); while (P1.runs.length > 4) P1.runs.shift(); }
    P1.cur = null; startRun();
  }
  if (P1.mom && P1.runs.length < 2) { if (P1.F < 1) P1.F = 6; P1.runs = [1, 2, 4].map((m) => ({ F: P1.F, m, a: P1.F / m, moon: false })); P1.trail = { a: P1.F / 4, t: RUN_T }; P1.xNow = 0.5 * (P1.F / 4) * RUN_T * RUN_T; }
  showStage(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'g1') { P1.guess = i; P1.phase = 'second'; sfx.click(); showStage(); }
  else if (act === 'push') startRun();
  else if (act === 'clear') { P1.runs = []; P1.trail = null; P1.xNow = 0; P1.cur = null; P1.fresh = false; sfx.click(); }
  else if (act === 'sec') return pressSecret(b.dataset.k);
  else if (act === 'g2') { P2.guess = i; P2.fresh = true; P2.tried['11'] = true; sfx.click(); (i === 2 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'motor') { P2.motor = !P2.motor; P2.fresh = false; P2.tried[comboKey()] = true; sfx.click(); }
  else if (act === 'fric') { P2.fric = !P2.fric; P2.fresh = false; P2.tried[comboKey()] = true; sfx.click(); }
  else if (act === 'rst2') { P2.v = V0; P2.motor = true; P2.fric = true; P2.fresh = false; sfx.click(); }
  else if (act === 'g3') { P3.guess = i; sfx.click(); startRace(); showStage(); return; }
  else if (act === 'race') { startRace(); return; }
  else if (act === 'own') { P3.own = !P3.own; P3.Fv = P3.F; P3.race = null; P3.fresh = false; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'p1f') { P1.F = +ev.target.value; P1.fresh = false; }
  else if (id === 'p1m') { P1.m = +ev.target.value; P1.fresh = false; }
  else if (id === 'p3f') { P3.F = +ev.target.value; if (!P3.own) P3.Fv = P3.F; P3.race = null; P3.fresh = false; }
  else if (id === 'p3v') { P3.Fv = +ev.target.value; P3.race = null; P3.fresh = false; }
  else return;
  render();
});

// --- render: one function per view for controls, readout, state card and facts ----------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('s1').hidden = v !== 'push'; $('s2').hidden = v !== 'steady'; $('s3').hidden = v !== 'cars';
  if (v === 'push') renderPush(t); else if (v === 'steady') renderSteady(t); else renderCars(t);
  lab.checkStage?.();
}
const fact = (emo, key, src) => ({ emo, text: T[lang].f[key], src });

function renderPush(t) {
  const p = t.p, ph = P1.phase, F = P1.F, m = P1.m, a = F / m, free = ph === 'free', busy = !!P1.cur, open = secret.unlocked();
  lab.setGlow('rgba(78,168,255,.26)');
  $('p1ask').hidden = ph !== 'ask'; $('p1ctl').hidden = ph === 'ask';
  if (ph === 'ask') $('p1ask').innerHTML = askHtml(p.ask.q, p.ask.opts, 'g1', ICONS);
  $('p1fl').textContent = p.force; $('p1fv').textContent = `${fmt(F)} ${u().N}`;
  $('p1ml').textContent = p.load; $('p1mv').textContent = p.bricks(m);
  const fr = $('p1f'); fr.min = free ? 0 : 1; if (+fr.value !== F) fr.value = F; fr.disabled = !(ph === 'first' || free) || busy;
  const mr = $('p1m'); if (+mr.value !== m) mr.value = m; mr.disabled = !free || busy;
  $('p1go').textContent = ph === 'first' && !P1.runs.length ? p.go : p.again; $('p1go').disabled = busy || (!free && F < 1);
  $('p1clr').textContent = p.clear; $('p1clr').hidden = !(free && P1.runs.length);
  const sc = (k, emo, on) => { const el = $(k === 'moon' ? 'p1sa' : 'p1sb'); el.textContent = open ? `${emo} ${t.secrets[k][0]}` : '🔒 ???'; el.className = `chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}`; };
  sc('moon', '🌙', P1.moon); sc('mom', '📖', P1.mom);
  // readout
  const hideA = ph === 'ask' || ph === 'second';
  if (hideA) lab.setReadout('?', p.rd.ask, '', '#4ea8ff');
  else if (ph === 'first') { // before the formula is earned: only the pull, then the speed gained each second
    if (busy || P1.trail) lab.setReadout(`${fmt(a)} ${u().ms}²`, p.rd.gain, '', '#4ea8ff');
    else lab.setReadout(`${fmt(F)} ${u().N}`, p.rd.pull, '', '#4ea8ff');
  }
  else if (P1.mom && free) lab.setReadout(`${fmt(F)}`, p.rd.mom, '', '#4ea8ff');
  else lab.setReadout(`${fmt(F)} ÷ ${m} = ${fmt(a)}`, p.rd.sub, P1.moon && free ? p.rd.moon : '', '#4ea8ff');
  // state card
  let st;
  if (P1.mom && free) st = p.st.mom(fmt(F));
  else if (P1.moon && free) st = p.st.moon(m, fmt(F), fmt(a), fmt(m * G_EARTH, 1), fmt(m * G_MOON, 1));
  else if (ph === 'first') st = p.st.idle;
  else if (ph === 'ask') { const r = P1.runs[0] || { F, a: F }; st = [...p.st.ask.slice(0, 2), p.st.ran1(fmt(r.F), fmt(r.a))]; }
  else if (ph === 'second') st = p.st.picked(p.ask.opts[P1.guess]);
  else if (P1.fresh) { const r1 = P1.runs[P1.runs.length - 2] || { a: F }; st = (P1.guess === 1 ? p.st.ok : p.st.no)(fmt(F), fmt(r1.a), fmt(F / 2)); }
  else st = F === 0 ? p.st.zero : p.st.free(fmt(F), m, fmt(a));
  lab.setState({ emo: P1.mom && free ? '📖' : P1.moon && free ? '🌙' : ph === 'ask' || ph === 'second' ? '🤔' : P1.fresh ? (P1.guess === 1 ? '✅' : '🤔') : '🛒', title: st[0], lead: st[1], body: st[2] || '', extra: '' });
  const facts = [];
  if (P1.mom && free) facts.push(fact('📖', 'mom', U_LAW));
  else if (P1.moon && free) facts.push(fact('🌙', 'moon', U_MOON));
  if (free) facts.push(fact('📐', 'law', U_LAW));
  facts.push(fact('📖', 'pri1', U_PRI), fact('📚', 'pri2', U_PRI));
  lab.setFacts(facts.slice(0, 3));
}

function renderSteady(t) {
  const s = t.s, hidden = P2.guess === null, key = comboKey(), net = forces().net, rest = !hidden && P2.v <= 0 && net <= 0;
  lab.setGlow('rgba(245,165,36,.22)');
  $('p2ask').hidden = !hidden; $('p2ctl').hidden = hidden;
  if (hidden) $('p2ask').innerHTML = askHtml(s.ask.q, s.ask.opts, 'g2');
  $('p2hint').textContent = s.hint;
  $('p2m').textContent = s.motor(P2.motor); $('p2m').className = `chip pt-tog ${P2.motor ? 'on' : ''}`;
  $('p2f').textContent = s.fric(P2.fric); $('p2f').className = `chip pt-tog ${P2.fric ? 'on' : ''}`;
  $('p2r').textContent = s.reset;
  const out = (k) => { const n = (k[0] === '1' ? FM : 0) - (k[1] === '1' ? FF : 0); return n > 0 ? 'up' : n < 0 ? 'down' : 'same'; };
  $('p2g').innerHTML = `<span></span><span class="h">${esc(s.grid.cols[0])}</span><span class="h">${esc(s.grid.cols[1])}</span>` +
    ['1', '0'].map((mo, ri) => `<span class="r">${esc(s.grid.rows[ri])}</span>` + ['1', '0'].map((fr) => {
      const k = mo + fr, seen = P2.tried[k];
      return `<span class="cell ${seen ? 'on' : ''} ${k === key ? 'cur' : ''}">${seen ? esc(s.grid[out(k)]) : '?'}</span>`;
    }).join('')).join('');
  const kind = rest ? 'rest' : net > 0 ? 'up' : net < 0 ? 'down' : 'same';
  lab.setReadout(`${fmt(P2.v, 1)} ${u().ms}`, hidden ? s.rdSub : `${s.tags.net}: ${fmt(net)} ${u().N}`, hidden ? '' : s.pill[kind], '#f5a524');
  let st;
  if (hidden) st = s.st.ask;
  else if (P2.fresh) st = P2.guess === 2 ? s.st.ok : s.st.no;
  else if (rest) st = s.st.rest;
  else st = key === '11' ? s.st.s11 : key === '01' ? s.st.s01(fmt(FF / TOY_M)) : key === '10' ? s.st.s10(fmt(FM / TOY_M)) : s.st.s00;
  lab.setState({ emo: hidden ? '🤔' : P2.fresh ? (P2.guess === 2 ? '✅' : '🤔') : kind === 'up' ? '↗️' : kind === 'down' ? '↘️' : kind === 'rest' ? '⏹️' : '➡️', title: st[0], lead: st[1], body: st[2] || '', extra: '' });
  const facts = [];
  if (!hidden) { facts.push(fact('🛰️', 'voy', U_VOY)); if (['11', '01', '10', '00'].every((k) => P2.tried[k])) facts.push(fact('📜', 'first', U_LAW)); }
  lab.setFacts(facts);
}

function renderCars(t) {
  const c = t.c, r = P3.race, asked = P3.guess === null, own = P3.own, Fc = P3.F, Fv = own ? P3.Fv : P3.F;
  lab.setGlow('rgba(239,107,91,.24)');
  $('p3ask').hidden = !asked; $('p3ctl').hidden = asked;
  if (asked) $('p3ask').innerHTML = askHtml(c.ask.q, c.ask.opts, 'g3');
  $('p3fl').textContent = own ? `${c.force}: ${c.car}` : c.force; $('p3fv').textContent = `${Fc} ${u().N}`;
  $('p3vrow').hidden = !own; $('p3vl').textContent = c.vanForce; $('p3vv').textContent = `${Fv} ${u().N}`;
  if (+$('p3f').value !== Fc) $('p3f').value = Fc;
  if (+$('p3v').value !== Fv) $('p3v').value = Fv;
  $('p3go').textContent = r ? c.again : c.race; $('p3go').disabled = !!(r && !r.done);
  $('p3own').textContent = own ? c.same : c.own; $('p3own').hidden = P3.guess !== 'shown';
  const done = !!(r && r.done), ac = Fc / CAR_M, av = Fv / VAN_M, tc = V100 / ac, tv = V100 / av, tie = Math.abs(tv - tc) / tc <= 0.03;
  if (done) lab.setReadout(`${fmt(tc, 1)} | ${fmt(tv, 1)}`, c.rdSub, '', '#ef6b5b'); else lab.setReadout('?', `${Fc} ${u().N}`, '', '#ef6b5b');
  const res = [Fc, fmt(tc, 1), fmt(tv, 1), fmt(ac), fmt(av)];
  let st, emo = '🏁';
  if (asked) { st = c.st.ask; emo = '🤔'; }
  else if (r && !r.done) st = c.st.racing;
  else if (done && P3.fresh) { st = (P3.verdict ? c.st.ok : c.st.no)(...res); emo = P3.verdict ? '✅' : '🤔'; }
  else if (done && own) { st = tie ? c.st.tie(fmt(tc, 1), fmt(Fc / CAR_M), fmt(Fv / VAN_M)) : c.st.own(Fv, fmt(av), fmt(ac), c.st.lead[tv < tc ? 1 : 0]); emo = tie ? '🤝' : '🔧'; }
  else if (done) { st = c.st.res(...res); emo = '📊'; }
  else st = own ? c.st.ownReady : c.st.ready;
  lab.setState({ emo, title: st[0], lead: st[1], body: st[2] || '', extra: '' });
  const facts = [fact('🚗', 'car', U_CAR)];
  if (!asked) facts.push(fact('🚐', 'lcv', U_LCV));
  lab.setFacts(facts);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (lab.view === 'push') drawPush(c, w, h, dt, time);
  else if (lab.view === 'steady') drawSteady(c, w, h, dt, time);
  else drawCars(c, w, h, dt, time);
});
render();
</script>
