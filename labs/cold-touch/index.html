    if (sec === 'ice') {
      lab.setGlow('rgba(140, 200, 255, .24)');
      if (S.q.ice === null) { lab.setReadout('?', '', '', acc); set({ emo: '🤔', title: t.q.ice.q }); lab.setFacts([]); return; }
      const tp = S.tp.ice, m = clamp(tp * 1.12, 0, 1), p = clamp(tp * 0.2, 0, 1);
      lab.setReadout(`${num(m * 100, 0)} %`, t.ice.sub, t.ice.pill(num(p * 100, 0)), acc);
      if (S.fresh.ice && tp < 0.3) set(verdict('ice', t)); else set({ emo: t.st.iceGo[0], title: t.st.iceGo[1], lead: t.st.iceGo[2] });
      lab.setFacts(t.facts.ice);
    } else {
      lab.setGlow('rgba(255, 176, 74, .24)');
      if (S.q.tea === null) { lab.setReadout('?', '', '', '#ffb04a'); set({ emo: '🤔', title: t.q.tea.q }); lab.setFacts([]); return; }
      const tp = S.tp.tea, f = (k) => Tat(k, tp, GRIP);
      lab.setReadout(`${num(f('steel'), 0)} °C`, t.tea.sub, `${t.tea.names.wood} ${num(f('wood'), 0)} · ${t.tea.names.plastic} ${num(f('plastic'), 0)}`, '#ffb04a');
      if (S.fresh.tea && tp < 0.3) set(verdict('tea', t)); else if (tp < 0.06) set({ emo: t.st.teaStart[0], title: t.st.teaStart[1], lead: t.st.teaStart[2] }); else set({ emo: t.st.teaGo[0], title: t.st.teaGo[1], lead: t.st.teaGo[2] });
      lab.setFacts(t.facts.tea);
    }
    const pb = $('pBtn'), k = sec === 'ice' ? 'ice' : 'tea';
    if (pb) pb.textContent = S.play[k] ? t.tea.pause : S.tp[k] >= 1 ? t.tea.again : t.tea.play;
    const sl = $('tSl'); if (sl && document.activeElement !== sl) sl.value = Math.round(S.tp[k] * 100);
  } else {
    lab.setGlow('rgba(155, 211, 111, .22)');
    if (S.q.props === null) { lab.setReadout('?', '', '', '#9bd36f'); set({ emo: '🤔', title: t.q.props.q }); lab.setFacts([]); return; }
    const done = TESTS.filter((k) => S.tests[k]).length;
    lab.setReadout(`${done}/4`, t.props.sub, S.test ? t.props.key[S.test] : '', '#9bd36f');
    if (S.fresh.props && S.test === 'magnet') set(verdict('props', t));
    else {
      const k = S.test, names = PROP[k].map((y, i) => (y ? t.props.names[i] : null)).filter(Boolean).join(', ');
      set({ emo: TEST_EMO[k], title: `${t.props.yes[k]}: ${names}`, lead: t.props.lead[k], body: (k === 'magnet' || k === 'current') && S.tests.magnet && S.tests.current ? t.props.both : '' });
    }
    lab.setFacts(t.facts.props);
  }
}
render();
</script>
