    S.ans = b.dataset.k; S.right[S.pi] = S.ans === p.kind; (S.right[S.pi] ? sfx.good : sfx.bad)(); S.bt = { x: p.A[0], y: p.A[1] }; showStage();
  } else if (act === 's1') { const p = PAIRS[Math.min(S.pi, 4)]; S.bd = { x: p.B[0], y: p.B[1] }; S.bt = { x: p.A[0], y: p.A[1] }; S.moved = false; sfx.click(); }
  else if (act === 'n1') { if (S.pi >= 5) { S.pi = 0; S.right = []; resetPair(); } else { S.pi++; if (S.pi < 5) resetPair(); } sfx.click(); }
  else if (act === 'c2') {
    if (!S.g2) return; const i = S.ti2, e = { x: TASKS2[i].S[0] + L2[i].R.x, y: TASKS2[i].S[1] + L2[i].R.y };
    S.chk2 = true; S.rt = 0; S.ok2[i] = S.g2.x === e.x && S.g2.y === e.y; (S.ok2[i] ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'r2') { S.rt = 0; sfx.click(); }
  else if (act === 'n2') { if (S.ti2 >= 5) { S.ti2 = 0; S.ok2 = []; } else S.ti2++; if (S.ti2 < 5) { S.g2 = null; S.chk2 = false; S.rt = 0; } sfx.click(); }
  else if (act === 'c3') {
    if (!S.g3) return; const t = TASKS3[S.ti3]; S.chk3 = true; S.kd = 1; S.touched3 = false;
    S.ok3[S.ti3] = S.g3.x === t.k * t.a[0] && S.g3.y === t.k * t.a[1]; (S.ok3[S.ti3] ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'n3') { S.ti3 = (S.ti3 + 1) % 3; if (S.ti3 === 0) S.ok3 = []; resetTask3(); sfx.click(); }
  render();
});
$('kr').addEventListener('input', () => { if (!S.chk3) return; S.k3 = K[+$('kr').value]; S.a3 = clampA(S.a3.x, S.a3.y, S.k3); S.touched3 = true; sfx.tick(); render(); });
$('ar').addEventListener('input', () => { S.ang = +$('ar').value; sfx.tick(); render(); });

// --- one render per change ------------------------------------------------------------------------------------
const chip = (act, k, label, cls = '', dis = false) => `<button class="chip ${cls}" data-act="${act}"${k ? ` data-k="${k}"` : ''}${dis ? ' disabled' : ''}>${esc(label)}</button>`;
const btn = (act, label, dis = false) => `<button class="btn" data-act="${act}"${dis ? ' disabled' : ''}>${esc(label)}</button>`;
const prow = (col, name, v, len, cls = '') => `<div class="pr ${cls}"><i style="background:${col}"></i><b>${esc(name)}</b><span>${esc(v)}</span><em>${esc(len)}</em></div>`;
function render() {
  const v = lab.view, sec = S.sec;
  $('c1').hidden = sec || v !== 'same'; $('c2').hidden = sec || v !== 'add'; $('c3').hidden = sec || v !== 'num';
  $('cr').hidden = sec !== 'river'; $('cs').hidden = sec !== 'slope';
  cv.style.touchAction = sec === 'river' || (v === 'same' && S.ans !== null && !sec) || (v === 'num' && S.chk3 && !sec) ? 'none' : 'pan-y';
  const t = T[lang], open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('river', '🏊') + sc('slope', '⛰️');
  if (sec === 'river') renderRiver(t); else if (sec === 'slope') renderSlope(t);
  else if (v === 'same') render1(t); else if (v === 'add') render2(t); else render3(t);
}
function render1(t) {
  const q = t.v1, end = S.pi >= 5, i = Math.min(S.pi, 4), p = PAIRS[i], A = p.A, B = p.B, ans = S.ans, shown = ans !== null || end;
  lab.setGlow('rgba(242, 184, 75, .22)');
  $('vq1').textContent = end ? '' : q.q;
  $('o1').innerHTML = end ? '' : Object.keys(q.opts).map((k) => chip('a1', k, q.opts[k], shown ? (k === p.kind ? 'ok' : k === ans ? 'bad' : '') : '', shown)).join('');
  $('a1').innerHTML = end ? btn('n1', q.again) : shown ? btn('s1', q.slide) + btn('n1', S.pi >= 4 ? q.fin : q.next) : '';
  const k = S.right.filter(Boolean).length, dts = dots(S.pi, 5);
  if (end) {
    $('p1').innerHTML = '';
    lab.setReadout(`${k}/5`, dts, '', COL.a);
    lab.setState({ emo: '🏆', title: q.end(k), lead: q.endLead, body: '', extra: '' });
    lab.setFacts(t.facts.same); return;
  }
  if (!shown) {
    $('p1').innerHTML = '';
    lab.setReadout('?', dts, '', COL.a);
    lab.setState({ emo: '🧭', title: q.q, lead: q.lead(i + 1), body: q.key, extra: '' });
    lab.setFacts(t.facts.same); return;
  }
  const a = { x: A[2], y: A[3] }, b = { x: B[2], y: B[3] }, rel = p.kind === 'eq' ? 'a = b' : p.kind === 'op' ? 'b = −a' : p.kind === 'dir' ? `b = ${kStr(2)}a` : 'a ≠ b';
  $('p1').innerHTML = prow(COL.a, 'a', vs(a.x, a.y), lenS('a', a.x, a.y)) + prow(COL.b, 'b', vs(b.x, b.y), lenS('b', b.x, b.y));
  lab.setReadout(rel, `a ${vs(a.x, a.y)} · b ${vs(b.x, b.y)}`, q.opts[p.kind], COL.a);
  const r = q.res[p.kind], lead = typeof r[1] === 'function' ? r[1](kStr(2)) : r[1];
  lab.setState({ emo: ans === p.kind ? '✅' : '🤔', title: `${ans === p.kind ? q.right : q.miss} ${r[0]}`, lead, body: S.moved ? q.moved(vs(b.x, b.y)) : q.drag, extra: '' });
  lab.setFacts(t.facts.same);
}
function render2(t) {
  const q = t.v2, end = S.ti2 >= 5, i = Math.min(S.ti2, 4), task = TASKS2[i], L = L2[i], diff = task.type === 'diff', done = S.chk2;
  lab.setGlow('rgba(79, 195, 176, .22)');
  const ok = S.ok2.filter(Boolean).length, dts = dots(S.ti2, 5);
  if (end) {
    $('a2').innerHTML = btn('n2', q.again); $('q2').textContent = ''; $('p2').innerHTML = '';
    lab.setReadout(`${ok}/5`, dts, '', COL.b);
    lab.setState({ emo: '🏆', title: q.end(ok), lead: q.endLead, body: '', extra: '' });
    lab.setFacts(t.facts.add); return;
  }
  const rows = L.legs.map((g) => prow(g.col, g.name, vs(g.v.x, g.v.y), lenS(g.name, g.v.x, g.v.y))).join('');
  $('vq2').textContent = end ? '' : diff ? q.qDiff : q.qSum;
  $('a2').innerHTML = !done ? btn('c2', q.check, !S.g2) : btn('r2', q.replay) + btn('n2', S.ti2 >= 4 ? q.fin : q.next);
  $('q2').textContent = done ? '' : q.tap;
  if (!done) {
    $('p2').innerHTML = rows;
    lab.setReadout('?', dts, '', COL.b);
    lab.setState({ emo: '🚶', title: diff ? q.qDiff : q.qSum, lead: q.lead(i + 1), body: '', extra: '' });
    lab.setFacts(t.facts.add); return;
  }
  const R = L.R, wk = L.legs.reduce((s, g) => s + Math.hypot(g.v.x, g.v.y), 0), rl = Math.hypot(R.x, R.y), nm = diff ? 'a − b' : 'a + b + c';
  $('p2').innerHTML = rows + prow(COL.r, nm, vs(R.x, R.y), lenS(nm, R.x, R.y), 'sum') + (diff ? '' : `<div class="pf">|a| + |b| + |c| ≈ ${fmt(wk)} &nbsp;≠&nbsp; |a + b + c| ${exact(rl) ? '=' : '≈'} ${fmt(rl)}</div>`);
  lab.setReadout(vs(R.x, R.y), diff ? `a − b = a + (−b)` : `|a|+|b|+|c| ≈ ${fmt(wk)}`, `|${nm}| ${exact(rl) ? '=' : '≈'} ${fmt(rl)}`, COL.b);
  const g = { x: S.g2.x - task.S[0], y: S.g2.y - task.S[1] }, good = S.ok2[i];
  lab.setState({
    emo: good ? '✅' : '🤔', title: good ? q.right : q.miss,
    lead: good ? (diff ? q.okDiff(vs(R.x, R.y)) : q.okSum(vs(R.x, R.y))) : q.missL(vs(g.x, g.y), vs(R.x, R.y)),
    body: diff ? q.bodyDiff(fmt(rl)) : q.bodySum(fmt(wk), fmt(rl)), extra: '',
  });
  lab.setFacts(t.facts.add);
}
function render3(t) {
  const q = t.v3, task = TASKS3[S.ti3], pred = !S.chk3, a = S.a3, k = S.k3, kn = kName(k);
  lab.setGlow('rgba(165, 139, 255, .22)');
  $('kr').disabled = pred; $('kr').value = K.indexOf(k); $('kl').textContent = `k = ${kStr(k)}`;
  $('vq3').textContent = q.q(vs(a.x, a.y), kn);
  $('a3').innerHTML = pred ? btn('c3', q.check, !S.g3) : btn('n3', S.ti3 >= 2 ? q.again : q.next);
  const ka = { x: a.x * k, y: a.y * k };
  const sqx = (n) => (n < 0 ? `(${fmt(n)})²` : `${fmt(n)}²`), qsum = a.x * a.x + a.y * a.y, rr = Math.sqrt(qsum);
  const formula = `√(${sqx(a.x)} + ${sqx(a.y)}) = √${qsum} ${exact(rr) ? `= ${fmt(rr)}` : `≈ ${fmt(rr)}`}`;
  if (pred) {
    $('q3').textContent = q.tap;
    $('p3').innerHTML = prow(COL.a, 'a', vs(a.x, a.y), lenS('a', a.x, a.y)) + `<div class="pf">${esc(formula)}</div>`;
    lab.setReadout(`a = ${vs(a.x, a.y)}`, lenS('a', a.x, a.y), `k = ${kStr(k)}`, COL.k);
    lab.setState({ emo: '📐', title: q.q(vs(a.x, a.y), kn), lead: q.lead(S.ti3 + 1), body: '', extra: '' });
    lab.setFacts(t.facts.num); return;
  }
  $('q3').textContent = q.free;
  $('p3').innerHTML = prow(COL.a, 'a', vs(a.x, a.y), lenS('a', a.x, a.y)) + `<div class="pf">${esc(formula)}</div>`
    + prow(COL.k, kn, vs(ka.x, ka.y), lenS(kn, ka.x, ka.y), 'sum');
  lab.setReadout(`${kn} = ${vs(ka.x, ka.y)}`, lenS(kn, ka.x, ka.y), `k = ${kStr(k)}`, COL.k);
  const kk = q.k, kl = k === 1 ? kk.k1 : k === -1 ? kk.kn1 : k < 0 ? kk.kneglong : k < 1 ? kk.kshort : kk.klong;
  if (!S.touched3) {
    const good = S.ok3[S.ti3], t3 = { x: task.a[0] * task.k, y: task.a[1] * task.k }, g = S.g3;
    lab.setState({
      emo: good ? '✅' : '🤔', title: good ? q.right : q.miss,
      lead: good ? q.ok(kn, vs(t3.x, t3.y)) : q.missL(vs(g.x, g.y), kn, vs(t3.x, t3.y)), body: kl, extra: '',
    });
  } else lab.setState({ emo: '📐', title: `${kn} = ${vs(ka.x, ka.y)}`, lead: kl, body: '', extra: '' });
  lab.setFacts(t.facts.num);
}
function renderRiver(t) {
  const q = t.rv, g = riverGeom(), s = g.s, sum = g.sum;
  lab.setGlow('rgba(78, 168, 255, .24)');
  $('qr').textContent = q.hint;
  $('pr').innerHTML = prow(COL.swim, q.swim, vs(s.x, s.y), lenS('s', s.x, s.y)) + prow(COL.cur, q.cur, vs(g.c.x, g.c.y), lenS('c', g.c.x, g.c.y))
    + prow(COL.sum, '+', vs(sum.x, sum.y), lenS('s+c', sum.x, sum.y), 'sum');
  lab.setReadout(vs(sum.x, sum.y), `${vs(s.x, s.y)} + ${vs(g.c.x, g.c.y)}`, Math.abs(g.dy) < 0.05 ? '🚩' : '', COL.swim);
  const dd = Math.round(Math.abs(g.dy) * 10) / 10, d = `${fmt(dd)} ${t.sq(dd)}`;
  const st = Math.abs(g.dy) < 0.05 ? q.ok : !g.inside && g.dy < 0 ? q.far : g.dy < 0 ? q.down(d) : q.up(d);
  lab.setState({ emo: '🏊', title: st[0], lead: st[1], body: q.lead, extra: `<a href="../relative-motion/" style="color:#fff">${esc(q.link)}</a>` });
  lab.setFacts([]);
}
function renderSlope(t) {
  const q = t.sl, g = slopeGeom();
  lab.setGlow('rgba(239, 125, 107, .22)');
  $('ar').value = S.ang; $('al').textContent = `${S.ang}°`;
  $('ps').innerHTML = prow(COL.a, q.weight, '10', '') + prow(COL.b, q.along, fmt(g.al), '') + prow(COL.k, q.into, fmt(g.ip), '', '');
  lab.setReadout(`${fmt(g.al)} + ${fmt(g.ip)}`, `${q.along} + ${q.into}`, `${S.ang}°`, COL.c);
  lab.setState({ emo: '⛰️', title: q.title, lead: S.ang === 0 ? q.flat : q.lead(S.ang, fmt(g.al), fmt(g.ip)), body: q.body, extra: S.ang >= 30 ? esc(q.steep) : '' });
  lab.setFacts([]);
}
render();
