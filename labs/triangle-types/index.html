const deg = (r) => r * 180 / Math.PI;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const easeBack = (t) => { const s = 1.70158, u = t - 1; return 1 + (s + 1) * u ** 3 + s * u ** 2; };
const fmtL = (v) => { const r = Math.round(v * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };
const near = (x, y) => Math.abs(x - y) <= 0.02 * Math.max(x, y);   // "equal sides": within 2 %

function measure(P) { // s[i] = side opposite corner i, a[i] = angle at corner i (degrees)
  const s = [0, 1, 2].map((i) => Math.hypot(P[(i + 1) % 3].x - P[(i + 2) % 3].x, P[(i + 1) % 3].y - P[(i + 2) % 3].y));
  const a = [0, 1, 2].map((i) => { const j = (i + 1) % 3, k = (i + 2) % 3; return deg(Math.acos(clamp((s[j] * s[j] + s[k] * s[k] - s[i] * s[i]) / (2 * s[j] * s[k]), -1, 1))); });
  return { s, a };
}
function lrRound(vals) { // integers that still add up to 180
  const fl = vals.map(Math.floor);
  let rest = 180 - fl.reduce((x, y) => x + y, 0);
  vals.map((v, i) => [v - fl[i], i]).sort((p, q) => q[0] - p[0]).forEach(([, i]) => { if (rest > 0) { fl[i]++; rest--; } });
  return fl;
}
// rows: 0 equilateral, 1 isosceles, 2 scalene (sides within 2 %); cols: 0 acute, 1 right (within 1 degree of 90), 2 obtuse
function classify(P) {
  const { s, a } = measure(P);

  else if (v === 'table') {
    lab.setReadout(esc(t.cellVal(t.rows[cl.type], t.cols[cl.kind])), '', t.anglesPill(...cl.da), C.teal);
    const a = t.st.table; st = { emo: a[0], title: a[1], lead: a[2], body: a[3] };
  } else if (v === 'find') {
    lab.setReadout(esc(t.found(S.foundN)), '', S.last === null ? '' : t.foundCell(t.rows[Math.floor(S.last / 3)], t.cols[S.last % 3]), C.sun);
    const a = t.st.find; st = { emo: S.foundN === 7 ? '🎉' : a[0], title: S.foundN === 7 ? t.allFound : a[1], lead: a[2], body: a[3] };
  } else {
    const al = 60 - 2 * S.why.s, be = (180 - al) / 2;
    if (ans === null) { lab.setReadout('?', '', '', C.coral); st = { emo: '🤔', title: t.whyAsk, lead: '', body: '' }; }
    else { lab.setReadout(esc(t.sum(be, al, be)), '', S.why.s === 0 ? t.rows[0] : t.rows[1], C.coral); const a = t.st.why; st = { emo: a[0], title: a[1], lead: a[2], body: a[3] }; }
  }
  lab.setState({ ...st, extra: '' });
  lab.setFacts(t.facts[v]);
}

// --- the loop --------------------------------------------------------------------------------------------------
canvasLoop(cv, (c, w, h, dt, time) => {
  const k = 1 - Math.exp(-dt * 26);
  S.d.forEach((p, i) => { p.x += (S.v[i].x - p.x) * k; p.y += (S.v[i].y - p.y) * k; });
  S.why.sd += (S.why.s - S.why.sd) * (1 - Math.exp(-dt * 14));
  G = layout(w, h);
  c.save(); c.translate(G.ox, G.oy); c.scale(G.sc, G.sc); c.lineJoin = 'round'; c.lineCap = 'round';
  if (G.m === 'bridge') drawBridge(c, dt, time);
  else if (G.m === 'why') drawWhy(c, time);
  else drawTriScene(c, time);
  c.restore();
  if (lab.view === 'find' && !S.sec && S.drag && S.moved && nowS() - S.cellSince > 0.5) stamp(); // holding a cell counts too
  drawConfetti(c, w, h, dt);
});

update();
render();
</script>
