    const sc = SC[Math.min(S.sp.i, 4)], items = drawList(c, P, S.spObjs, S.ce, !!tg.overlap, time, false);
    if (S.sp.pick !== null) {
      const age = time - (S.sp.t0 || 0), a = easeOut(clamp(age / .4, 0, 1));
      items.forEach(({ o }) => {
        const ans = o.id === sc.ans, pk = o.id === S.sp.pick; if (!ans && !pk) return;
        const [x0, y0, x1, y1] = o._b, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
        c.save(); c.lineWidth = 3; c.strokeStyle = ans ? '#3ddc97' : '#ff5a4f'; c.globalAlpha = a; if (!ans) c.setLineDash([5, 4]);
        ell(c, cx, cy, Math.max((x1 - x0) / 2 + 8, 24) * (1.3 - .3 * a), Math.max((y1 - y0) / 2 + 8, 24) * (1.3 - .3 * a)); c.stroke(); c.restore();
        if (ans) pill(c, t.tagFar2, cx, Math.min(y0, cy - 24) - 8, '#3ddc97');
      });
    }
  } else {
    const list = v === 'tricks' ? S.trees : S.stamps, items = drawList(c, P, list, S.ce, !!tg.overlap, time, false);
    if (v === 'tricks') {
      const top = items.reduce((m, it) => (!m || it.o.v < m.o.v ? it : m), null);
      if (top && S.pending) { const [x0, y0, x1, y1] = top.o._b, pu = .5 + .5 * Math.sin(time * 5);
        c.save(); c.strokeStyle = '#f5c84c'; c.lineWidth = 2.5; c.setLineDash([6, 4]); c.globalAlpha = .6 + .4 * pu; ell(c, (x0 + x1) / 2, (y0 + y1) / 2, Math.max((x1 - x0) / 2 + 8, 26), Math.max((y1 - y0) / 2 + 8, 26)); c.stroke(); c.restore(); }
      if (top && S.tag) { const age = time - S.tag.t, al = clamp((3.4 - age) / .8, 0, 1); if (al > 0) { c.save(); c.globalAlpha = al; pill(c, '↑ ' + t.tagFar, (top.o._b[0] + top.o._b[2]) / 2, top.o._b[1] - 6, '#3ddc97'); c.restore(); } }
    }
  }
  readout();
});
snapCe();
render();
