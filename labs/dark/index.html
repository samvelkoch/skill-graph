const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const hex2 = (a) => '#' + a.map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return hex2(A.map((v, i) => v + (B[i] - v) * t)); };
const rgba = (h, a) => { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; };
const lin = (c, x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); for (const [o, col] of stops) g.addColorStop(o, col); return g; };
const rad = (c, x, y, r, stops, hx = x, hy = y) => { const g = c.createRadialGradient(hx, hy, 0, x, y, Math.max(0.01, r)); for (const [o, col] of stops) g.addColorStop(o, col); return g; };
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, 6.2832); };

const path = (c, pts) => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); };

// a glowing arrow from (ax,ay) to (bx,by), drawn up to the fraction p, with dots that travel along it
function ray(c, ax, ay, bx, by, p, time, o = {}) {
  const { w = 3, col = C.light, a = 1, dots = true, dash = null, head = true } = o;
  p = clamp01(p);
  if (p < 0.01 || a <= 0) return;
  const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len, tx = ax + dx * p, ty = ay + dy * p;
  c.save(); c.globalAlpha = a; c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = rgba(col, 0.25); c.lineWidth = w * 3.2; c.beginPath(); c.moveTo(ax, ay); c.lineTo(tx, ty); c.stroke();
  c.shadowColor = col; c.shadowBlur = 10; c.strokeStyle = col; c.lineWidth = w;
  if (dash) c.setLineDash(dash);
  c.beginPath(); c.moveTo(ax, ay); c.lineTo(tx, ty); c.stroke(); c.setLineDash([]);
  if (head) {
    const hs = w * 3.4 + 5;
    c.fillStyle = col; c.beginPath();
    c.moveTo(tx + ux * hs * 0.3, ty + uy * hs * 0.3);
    c.lineTo(tx - ux * hs * 0.75 + uy * hs * 0.55, ty - uy * hs * 0.75 - ux * hs * 0.55);
    c.lineTo(tx - ux * hs * 0.75 - uy * hs * 0.55, ty - uy * hs * 0.75 + ux * hs * 0.55);
    c.closePath(); c.fill();
  }
  if (dots) {
    const n = Math.max(1, Math.round((len * p) / 38));
    c.fillStyle = '#fffbe8';
    for (let i = 0; i < n; i++) { const u = ((time * 0.5 + i / n) % 1) * len * p; circ(c, ax + ux * u, ay + uy * u, w * 0.85); c.fill(); }
  }
  c.restore();
}

// a pill with text, in canvas pixels (not scene units), kept inside the canvas
function pill(c, text, cx, cy, w, h, o = {}) {
  const { fg = '#fff', a = 1 } = o;
  c.save(); c.globalAlpha = a; c.font = '800 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + 26, x = clamp(cx, tw / 2 + 6, w - tw / 2 - 6), y = clamp(cy, 20, h - 20);
  rrect(c, x - tw / 2, y - 14, tw, 28, 14); c.fillStyle = 'rgba(8,10,24,.82)'; c.fill();
  c.lineWidth = 1; c.strokeStyle = 'rgba(160,175,230,.35)'; c.stroke();
  c.fillStyle = fg; c.fillText(text, x, y + 1);
  c.restore();
}

// --- darkness: a near-black layer with holes where light falls ---------------------------------------------------
const mk = document.createElement('canvas'), mc = mk.getContext('2d');
function darkLayer(c, a, holes) {
  const { d, w, h, s, ox, oy } = G, W = Math.round(w * d), H = Math.round(h * d);
  if (mk.width !== W || mk.height !== H) { mk.width = W; mk.height = H; }
  mc.setTransform(1, 0, 0, 1, 0, 0); mc.globalCompositeOperation = 'source-over'; mc.clearRect(0, 0, W, H);
  mc.setTransform(d * s, 0, 0, d * s, d * ox, d * oy);
  mc.fillStyle = `rgba(5,8,20,${a})`; mc.fillRect(-4, -4, VW + 8, VH + 8);
  mc.globalCompositeOperation = 'destination-out';
  if (holes) holes(mc);
  mc.globalCompositeOperation = 'source-over';
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(mk, 0, 0); c.restore();
}
const hole = (m, x, y, r, a) => {
  if (a <= 0.003) return;
  m.fillStyle = rad(m, x, y, r, [[0, `rgba(0,0,0,${a})`], [0.55, `rgba(0,0,0,${a * 0.75})`], [1, 'rgba(0,0,0,0)']]);
  m.fillRect(x - r, y - r, 2 * r, 2 * r);
};

// an eye: white, blue iris, pupil (glows yellow when light reaches it), a white highlight
function drawEye(c, x, y, rx, ry, glow = 0, look = [0.12, 0]) {
  c.save();
  ell(c, x, y, rx, ry); c.fillStyle = lin(c, x, y - ry, x, y + ry, [[0, '#ffffff'], [1, '#d9e1f3']]); c.fill();
  c.save(); ell(c, x, y, rx, ry); c.clip();
  const ix = x + look[0] * rx, iy = y + look[1] * ry, ir = ry * 0.84;
  circ(c, ix, iy, ir); c.fillStyle = rad(c, ix, iy, ir, [[0, mix(C.iris, '#ffffff', 0.38)], [0.6, C.iris], [1, mix(C.iris, '#000000', 0.5)]], ix - ir * 0.2, iy - ir * 0.25); c.fill();
  circ(c, ix, iy, ir * 0.47); c.fillStyle = mix('#0b1020', C.light, clamp01(glow)); c.fill();
  circ(c, ix - ir * 0.3, iy - ir * 0.34, ir * 0.2); c.fillStyle = '#ffffff'; c.fill();
  c.restore();
  ell(c, x, y, rx, ry); c.lineWidth = Math.max(1, ry * 0.14); c.strokeStyle = '#2a1c1c'; c.stroke();
  c.beginPath(); c.ellipse(x, y, rx, ry, 0, Math.PI * 1.06, Math.PI * 1.94); c.lineWidth = Math.max(1.4, ry * 0.26); c.stroke();
  c.restore();
}

    c.fillStyle = rad(c, x, y, Math.max(rx, ry) * 1.15, [[0, mix(col, '#ffffff', 0.28)], [0.55, col], [1, mix(col, '#000000', 0.22)]], x - rx * 0.35, y - ry * 0.4);
    c.fill(); c.lineWidth = 1.6; c.strokeStyle = dk; c.stroke();
  };
  ell(c, 0, 52, 40, 7); c.fillStyle = 'rgba(0,0,0,.3)'; c.fill();
  part(-19, 46, 14, 9); part(19, 46, 14, 9);
  part(0, 16, 27, 31);
  part(0, 21, 16, 20, 0, lt);
  part(-28, 11, 10, 17, 0.4); part(28, 11, 10, 17, -0.4);
  ell(c, -19, 47, 7, 5); c.fillStyle = lt; c.fill(); ell(c, 19, 47, 7, 5); c.fill();
  part(-19, -44, 10, 10); part(19, -44, 10, 10);
  circ(c, -19, -44, 5.5); c.fillStyle = lt; c.fill(); circ(c, 19, -44, 5.5); c.fill();
  part(0, -25, 26, 23);
  part(0, -17, 12.5, 9.5, 0, lt);

  c.strokeStyle = '#2a1812'; c.lineWidth = 1.4; c.lineCap = 'round';

  circ(c, 0, -2, 3.2); c.fillStyle = mix(bow, '#ffffff', 0.25); c.fill(); c.stroke();
  c.restore();
}

}

function drawChild(c, th, on) {

  c.lineWidth = 1.6; c.strokeStyle = mix(shirt, '#000000', 0.55); c.stroke();
  rrect(c, 50, 194, 28, 28, 8); c.fillStyle = mix(skin, '#000000', 0.12); c.fill();
  // arm: sleeve, then forearm to the hand
  c.strokeStyle = mix(shirt, '#000000', 0.5); c.lineWidth = 22; c.beginPath(); c.moveTo(50, 238); c.lineTo(88, 254); c.stroke();
  c.strokeStyle = shirt; c.lineWidth = 19; c.beginPath(); c.moveTo(50, 238); c.lineTo(88, 254); c.stroke();
  c.strokeStyle = line; c.lineWidth = 16; c.beginPath(); c.moveTo(88, 254); c.lineTo(H0[0] - 4, H0[1] + 4); c.stroke();
  c.strokeStyle = skin; c.lineWidth = 13; c.beginPath(); c.moveTo(88, 254); c.lineTo(H0[0] - 4, H0[1] + 4); c.stroke();
  // head: nose first (it sticks out), then the head, ear, hair
  ell(c, 106, 178, 8, 7); c.fillStyle = skin; c.fill(); c.lineWidth = 1.4; c.strokeStyle = line; c.stroke();
  circ(c, 64, 166, 40); c.fillStyle = rad(c, 64, 166, 46, [[0, mix(skin, '#ffffff', 0.3)], [0.7, skin], [1, mix(skin, '#000000', 0.2)]], 52, 150); c.fill();
  c.lineWidth = 1.6; c.strokeStyle = line; c.stroke();

  c.beginPath(); c.moveTo(14, 200); c.lineTo(14, 120); c.lineTo(110, 118); c.quadraticCurveTo(100, 144, 76, 142); c.quadraticCurveTo(58, 150, 52, 178); c.quadraticCurveTo(44, 190, 36, 204); c.closePath(); c.fill();

  // eyebrow, cheek, mouth

  drawEye(c, E0[0], E0[1], 13, 10, 0);

  circ(c, H0[0], H0[1], 9.5); c.fillStyle = rad(c, H0[0], H0[1], 11, [[0, mix(skin, '#ffffff', 0.2)], [1, skin]], H0[0] - 3, H0[1] - 3); c.fill();
  c.lineWidth = 1.4; c.strokeStyle = line; c.stroke();
  c.restore();

    c.lineWidth = 1.2; c.strokeStyle = mix(col, '#000000', 0.55); c.stroke(); c.fillStyle = rgba('#ffffff', 0.5); c.fillRect(x + w - 6, y + 1.5, 3, 6);

// where the torch beam goes: to the teddy if it is aimed at it, otherwise to the first wall or the floor
function beamOf(th) {
  const dx = Math.cos(th), dy = Math.sin(th), L0 = [H0[0] + dx * 38, H0[1] + dy * 38];
  const tx = TD[0] - H0[0], ty = TD[1] - H0[1], along = tx * dx + ty * dy, d = Math.abs(tx * dy - ty * dx);
  if (along > 60 && d < TR) {
    const dist = along - Math.sqrt(Math.max(0, 30 * 30 - d * d));
    return { hit: true, L0, end: [H0[0] + dx * dist, H0[1] + dy * dist], dx, dy };
  }
  const lim = (p0, v, lo, hi) => (v > 1e-6 ? (hi - p0) / v : v < -1e-6 ? (lo - p0) / v : 1e9);
  const t = Math.min(lim(H0[0], dx, 4, 396), lim(H0[1], dy, 8, 272));
  return { hit: false, L0, end: [H0[0] + dx * t, H0[1] + dy * t], dx, dy };
}
function eyeEdge(from) { // where a ray ends on the rim of the child's eye
  const dx = from[0] - E0[0], dy = from[1] - E0[1], l = Math.hypot(dx, dy) || 1;
  return [E0[0] + (dx / l) * 17, E0[1] + (dy / l) * 17];
}

function roomPhase(time) {
  const r = S.r, e = time - r.t0;
  if (r.st === 'q1rev') return e < 1.3 ? 'dark' : e < 3.6 ? 'run' : e < 4.4 ? 'see' : 'done';
  if (r.st === 'q2rev') return e < 2.2 ? 'run' : 'done';
  if (r.st === 'free') return `free:${beamOf(r.th).hit ? 1 : 0}:${r.aimed ? 1 : 0}`;
  return r.st;
}
// what is lit and which rays are drawn right now
function roomVis(time, dt) {
  const r = S.r, e = time - r.t0, th = r.st === 'free' ? r.th : autoTheta();
  const v = { th, torch: 0, p1: 0, lit: 0, p2: 0, eye: 0, arrows: false, wrong: 0 };
  if (r.st === 'q1') return v;
  if (r.st === 'q1rev') {
    if (e >= 1.3 && !r.clicked) { r.clicked = true; sfx.click(); }
    return Object.assign(v, { torch: ease((e - 1.3) / 0.4), p1: ease((e - 1.5) / 1.0), lit: ease((e - 2.5) / 0.5), p2: ease((e - 2.6) / 1.0), eye: ease((e - 3.6) / 0.5), arrows: true });
  }
  if (r.st === 'q2') return Object.assign(v, { torch: 1, p1: 1, lit: 1 });
  if (r.st === 'q2rev') return Object.assign(v, { torch: 1, p1: ease(e / 0.7), lit: 1, p2: ease((e - 0.7) / 0.9), eye: ease((e - 1.5) / 0.4), arrows: true, wrong: ease((e - 0.2) / 0.4) });
  // free play: everything follows the aim smoothly
  const hit = beamOf(th).hit, a = r.v, step = (cur, tgt, rate) => cur + clamp(tgt - cur, -dt * rate, dt * rate);
  a.lit = step(a.lit, hit ? 1 : 0, 6); a.p2 = step(a.p2, hit ? 1 : 0, 2.5); a.eye = step(a.eye, hit ? 1 : 0, 4);
  return Object.assign(v, { torch: 1, p1: 1, lit: a.lit, p2: a.p2, eye: a.eye, arrows: true });
}

function drawRoomView(c, time, dt) {
  const v = roomVis(time, dt), bm = beamOf(v.th), spot = clamp01((v.p1 - 0.85) / 0.15), len = Math.hypot(bm.end[0] - bm.L0[0], bm.end[1] - bm.L0[1]);
  drawRoomBase(c, v.th, v.torch > 0.5);
  const px = -bm.dy, py = bm.dx, spread = 0.2;
  darkLayer(c, S.r.st === 'q1' ? 1 : S.r.st === 'q1rev' ? 1 - 0.04 * v.torch : 0.96, (m) => {
    if (v.torch > 0) {
      hole(m, bm.L0[0], bm.L0[1], 38, 0.9 * v.torch);
      const e = [bm.L0[0] + (bm.end[0] - bm.L0[0]) * v.p1, bm.L0[1] + (bm.end[1] - bm.L0[1]) * v.p1], w = len * v.p1 * spread;
      m.fillStyle = lin(m, bm.L0[0], bm.L0[1], e[0], e[1], [[0, `rgba(0,0,0,${0.7 * v.torch})`], [1, `rgba(0,0,0,${0.3 * v.torch})`]]);
      path(m, [bm.L0, [e[0] + px * w, e[1] + py * w], [e[0] - px * w, e[1] - py * w]]); m.fill();
      hole(m, bm.end[0], bm.end[1], 54, 0.97 * v.torch * spot);
    }
    hole(m, TD[0], TD[1] + 8, 64, 0.97 * v.lit);
    hole(m, E0[0], E0[1], 46, 0.92 * v.eye);
  });
  // the visible beam, the rays and the glowing eye, above the darkness
  if (v.torch > 0) {
    add(c, () => {
      const e = [bm.L0[0] + (bm.end[0] - bm.L0[0]) * v.p1, bm.L0[1] + (bm.end[1] - bm.L0[1]) * v.p1], w = len * v.p1 * spread;
      c.fillStyle = lin(c, bm.L0[0], bm.L0[1], e[0], e[1], [[0, rgba(C.light, 0.34 * v.torch)], [1, rgba(C.light, 0.08 * v.torch)]]);
      path(c, [bm.L0, [e[0] + px * w, e[1] + py * w], [e[0] - px * w, e[1] - py * w]]); c.fill();
      c.fillStyle = rad(c, bm.L0[0], bm.L0[1], 30, [[0, rgba(C.light, 0.8 * v.torch)], [1, rgba(C.light, 0)]]); c.fillRect(bm.L0[0] - 30, bm.L0[1] - 30, 60, 60);
    });
  }
  if (v.arrows) {
    ray(c, bm.L0[0], bm.L0[1], bm.end[0], bm.end[1], v.p1, time, { w: 3 });
    const ee = eyeEdge(bm.end);
    if (bm.hit) ray(c, bm.end[0], bm.end[1], ee[0], ee[1], v.p2, time, { w: 3.4 });
    if (v.wrong > 0.01) { // the wrong way, crossed out: an arrow from the eye to the teddy, drawn a little above the right one
      const ax = E0[0] + 16, ay = E0[1] - 18, bx = TD[0] - 38, by = TD[1] - 14;
      ray(c, ax, ay, bx, by, 1, time, { w: 2.6, col: '#FF6B5E', a: 0.85 * v.wrong, dots: false, dash: [7, 6] });
      const mx = (ax + bx) / 2, my = (ay + by) / 2;
      c.save(); c.globalAlpha = v.wrong; circ(c, mx, my, 12); c.fillStyle = '#FF3B30'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#fff'; c.stroke();
      c.lineCap = 'round'; c.beginPath(); c.moveTo(mx - 5, my - 5); c.lineTo(mx + 5, my + 5); c.moveTo(mx + 5, my - 5); c.lineTo(mx - 5, my + 5); c.stroke(); c.restore();
    }
  }
  if (v.eye > 0.01) {
    add(c, () => {
      c.fillStyle = rad(c, E0[0], E0[1], 34, [[0, rgba(C.light, 0.85 * v.eye)], [0.5, rgba(C.light, 0.28 * v.eye)], [1, rgba(C.light, 0)]]); c.fillRect(E0[0] - 34, E0[1] - 34, 68, 68);
    });
    c.save(); c.globalAlpha = clamp01(v.eye * 1.3); drawEye(c, E0[0], E0[1], 13, 10, v.eye); c.restore();
  }
  // a faint outline of the eye is all that shows in the dark
  c.save(); c.strokeStyle = rgba('#8FB3EA', 0.2 * (1 - v.eye)); c.lineWidth = 1.6; ell(c, E0[0], E0[1], 13, 10); c.stroke(); circ(c, E0[0] + 1.5, E0[1], 7.5); c.stroke(); c.restore();
  // aim handle in free play
  if (S.r.st === 'free' && !S.r.aimed) {
    c.save(); const k = 0.5 + 0.5 * Math.sin(time * 4); circ(c, bm.L0[0] + bm.dx * 6, bm.L0[1] + bm.dy * 6, 16 + 4 * k); c.lineWidth = 2; c.strokeStyle = rgba(C.light, 0.5 + 0.4 * k); c.setLineDash([5, 5]); c.stroke(); c.restore();
  }
}

// --- view 2: a glossy card on a dark table -----------------------------------------------------------------------
const CARD = [200, 148, 60]; // x, y, radius
function sunIcon(c, x, y, r, a, time) {
  c.save(); c.globalAlpha = a;
  add(c, () => { c.fillStyle = rad(c, x, y, r * 3, [[0, rgba(C.light, 0.55)], [1, rgba(C.light, 0)]]); c.fillRect(x - r * 3, y - r * 3, r * 6, r * 6); });
  c.strokeStyle = C.light; c.lineWidth = 2.4; c.lineCap = 'round'; c.beginPath();
  for (let i = 0; i < 10; i++) { const an = i * 0.6283 + time * 0.3; c.moveTo(x + Math.cos(an) * r * 1.35, y + Math.sin(an) * r * 1.35); c.lineTo(x + Math.cos(an) * r * 1.85, y + Math.sin(an) * r * 1.85); }
  c.stroke();
  circ(c, x, y, r); c.fillStyle = rad(c, x, y, r, [[0, '#fffbe0'], [0.6, C.light], [1, mix(C.light, '#ff9a30', 0.55)]], x - r * 0.3, y - r * 0.3); c.fill();

  const kx = 322, ky = EA[1] - Math.sqrt(EA[2] * EA[2] - (kx - EA[0]) ** 2) + 2, k = 0.82;
  drawKid(c, kx, ky, k, -1, 0.9);
  const eye = [kx - 7 * k, ky - 59 * k];
  add(c, () => { c.fillStyle = rad(c, eye[0], eye[1], 22, [[0, rgba(C.light, 0.6)], [1, rgba(C.light, 0)]]); c.fillRect(eye[0] - 22, eye[1] - 22, 44, 44); });
  // rays: sun -> moon, moon -> eye
  ray(c, SUN[0] - ux * (SUN[2] + 6), SUN[1] - uy * (SUN[2] + 6), MN[0] + ux * (MN[2] + 6), MN[1] + uy * (MN[2] + 6), 1, time, { w: 3 });
  const ex = eye[0] - MN[0], ey = eye[1] - MN[1], el = Math.hypot(ex, ey);
  ray(c, MN[0] + (ex / el) * (MN[2] + 4), MN[1] + (ey / el) * (MN[2] + 4), eye[0] - (ex / el) * 12, eye[1] - (ey / el) * 12, 1, time, { w: 3 });
}
function drawReflSecret(c, time) {
  c.fillStyle = lin(c, 0, 0, 0, 230, [[0, '#04061a'], [1, '#101840']]); c.fillRect(0, 0, VW, 230);
  c.fillStyle = '#e6ecff'; for (const [x, y, r, ph] of SKY) { if (y > 150) continue; c.globalAlpha = 0.4 + 0.35 * Math.sin(time * 1.4 + ph); circ(c, x, y, r * 0.9); c.fill(); } c.globalAlpha = 1;
  c.fillStyle = '#0b1030'; c.beginPath(); c.moveTo(0, 190); c.bezierCurveTo(70, 160, 130, 200, 200, 176); c.bezierCurveTo(280, 150, 340, 196, 400, 170); c.lineTo(400, 232); c.lineTo(0, 232); c.closePath(); c.fill();
  c.fillStyle = lin(c, 0, 226, 0, VH, [[0, '#161c3a'], [1, '#0a0d22']]); c.fillRect(0, 226, VW, VH - 226);
  c.fillStyle = 'rgba(170,190,255,.14)'; c.fillRect(0, 226, VW, 1.5);
  c.strokeStyle = 'rgba(230,236,255,.25)'; c.lineWidth = 3; c.setLineDash([22, 18]); c.lineDashOffset = 0; c.beginPath(); c.moveTo(0, 276); c.lineTo(VW, 276); c.stroke(); c.setLineDash([]);
  // headlight beam
  add(c, () => {
    c.fillStyle = lin(c, 120, 0, 350, 0, [[0, rgba(C.light, 0.34)], [1, rgba(C.light, 0.04)]]);
    path(c, [[122, 216], [350, 168], [350, 266], [122, 224]]); c.fill();
  });
  // two cyclists: A has a reflector and is lit up, B wears dark clothes and has none
  const bike = (x, y, a, reflector) => {
    c.save(); c.globalAlpha = 1; c.lineCap = 'round'; c.lineJoin = 'round';
    const col = rgba('#8FA3D8', a), body = mix('#0a0e22', '#2a3560', a * 1.4);
    c.strokeStyle = col; c.lineWidth = 2.6; circ(c, x - 18, y, 14); c.stroke(); circ(c, x + 18, y, 14); c.stroke();
    c.strokeStyle = body; c.lineWidth = 3; c.beginPath(); c.moveTo(x - 18, y); c.lineTo(x - 4, y - 20); c.lineTo(x + 12, y - 20); c.lineTo(x + 18, y); c.moveTo(x - 4, y - 20); c.lineTo(x + 2, y); c.lineTo(x - 18, y); c.moveTo(x + 12, y - 20); c.lineTo(x + 10, y - 28); c.stroke();
    c.lineWidth = 7; c.beginPath(); c.moveTo(x - 4, y - 24); c.lineTo(x + 8, y - 44); c.stroke();            // rider's back
    c.lineWidth = 5; c.beginPath(); c.moveTo(x + 8, y - 42); c.lineTo(x + 15, y - 32); c.moveTo(x - 2, y - 22); c.lineTo(x + 4, y - 4); c.stroke(); // arm, leg
    circ(c, x + 11, y - 52, 6.5); c.fillStyle = body; c.fill();
    c.restore();
    if (reflector) { rrect(c, x - 27, y - 22, 6, 11, 1.5); c.fillStyle = '#FF3B30'; c.fill(); c.lineWidth = 1; c.strokeStyle = '#fff'; c.stroke(); }
  };
  bike(236, 252, 0.7, true);
  bike(330, 252, 0.07, false);
  // the car, facing right, with a driver
  c.save(); c.globalAlpha = 1; c.lineJoin = 'round';
  const body = mix(C.iris, '#000000', 0.38);
  ell(c, 66, 258, 62, 6); c.fillStyle = 'rgba(0,0,0,.4)'; c.fill();
  path(c, [[34, 214], [50, 188], [96, 188], [112, 214]]); c.fillStyle = lin(c, 0, 188, 0, 214, [[0, mix(body, '#ffffff', 0.2)], [1, body]]); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#05081A'; c.stroke();
  path(c, [[44, 212], [56, 193], [92, 193], [102, 212]]); c.fillStyle = lin(c, 0, 193, 0, 212, [[0, '#9fb5e8'], [1, '#3a4a80']]); c.fill();
  rrect(c, 12, 208, 108, 32, 11); c.fillStyle = lin(c, 0, 208, 0, 240, [[0, mix(body, '#ffffff', 0.18)], [1, mix(body, '#000000', 0.25)]]); c.fill(); c.stroke();
  circ(c, 76, 199, 6.5); c.fillStyle = mix(C.warm, C.teddy, 0.3); c.fill();
  drawEye(c, 80, 198, 4.6, 3.8, 1);
  for (const wx of [36, 96]) { circ(c, wx, 242, 12.5); c.fillStyle = '#0a0d1c'; c.fill(); circ(c, wx, 242, 6); c.fillStyle = lin(c, wx - 6, 236, wx + 6, 248, [[0, '#c8d2ea'], [1, '#4b5575']]); c.fill(); }
  ell(c, 118, 220, 4, 6); c.fillStyle = '#fffbe0'; c.fill();
  c.restore();
  add(c, () => { c.fillStyle = rad(c, 120, 220, 30, [[0, rgba(C.light, 0.8)], [1, rgba(C.light, 0)]]); c.fillRect(90, 190, 60, 60); });
  // reflector glow, ray to it, ray bounced straight back to the driver
  add(c, () => { c.fillStyle = rad(c, 212, 236, 26, [[0, 'rgba(255,90,70,.85)'], [1, 'rgba(255,90,70,0)']]); c.fillRect(184, 208, 56, 56); });
  ray(c, 124, 220, 205, 234, 1, time, { w: 3 });
  ray(c, 208, 230, 92, 200, 1, time, { w: 2.6, col: '#FFB0A0' });
}

// --- the frame ------------------------------------------------------------------------------------------------------
function phaseKey(time) {
  const v = lab.view;
  if (v === 'room') return S.sec ? `sec:${S.sec}` : `room:${roomPhase(time)}`;
  if (v === 'sources') { const s = S.s; return s.pick === null ? 'q' : time - s.t0 < (CARDS[ORDER[s.i]].src ? 1.3 : 2.4) ? 'run' : 'done'; }
  const k = S.c;
  if (k.st === 'rev') { const e = time - k.t0; if (e >= 3.4) { k.st = 'free'; k.L = 0.55; } else return e < 1.4 ? 'dark' : 'rise'; }
  return k.st === 'free' ? `free:${k.L > 0 ? 1 : 0}` : 'q';
}
canvasLoop(cv, (c, w, h, dt, time) => {
  const d = c.getTransform().a, v = lab.view;
  const want = askEl.style.display === 'none' ? 0 : askEl.offsetHeight + 12;
  S.y0 += (want - S.y0) * Math.min(1, dt * 10);
  const rh = Math.max(60, h - S.y0), s = Math.min(w / VW, rh / VH) * 0.98, ox = (w - VW * s) / 2, oy = S.y0 + (rh - VH * s) / 2;
  G = { s, ox, oy, w, h, d };
  c.fillStyle = C.dark; c.fillRect(0, 0, w, h);
  c.save(); c.translate(ox, oy); c.scale(s, s);
  rrect(c, 0, 0, VW, VH, 16); c.clip();
  try {
  if (v === 'room' && S.sec === 'moon') drawMoonSecret(c, time);
  else if (v === 'room' && S.sec === 'reflector') drawReflSecret(c, time);
  else if (v === 'room') drawRoomView(c, time, dt);
  else if (v === 'sources') drawSources(c, time);
  else drawCatView(c, time);
  } catch (err) { console.error(err); }
  c.restore();
  rrect(c, ox, oy, VW * s, VH * s, 16 * s); c.lineWidth = 1; c.strokeStyle = 'rgba(160,175,230,.14)'; c.stroke();
  // pills (in canvas pixels)
  const t = T[lang], px = (x) => ox + x * s, py = (y) => oy + y * s;
  if (v === 'room' && !S.sec) {
    const r = S.r, e = time - r.t0;
    if (r.st === 'q1rev' && e > 0.1 && e < 1.5) pill(c, t.r.nothing, px(200), py(150), w, h, { a: ease(Math.min((e - 0.1) / 0.3, (1.5 - e) / 0.3)) });
    else if ((r.st === 'q1rev' && e > 3.6) || (r.st === 'q2rev' && e > 1.9)) pill(c, t.r.see, px(200), py(282), w, h, { fg: C.light });
    else if (r.st === 'free') pill(c, !r.aimed ? t.r.aim : beamOf(r.th).hit ? t.r.see : t.r.cant, px(200), py(282), w, h, { fg: r.aimed && beamOf(r.th).hit ? C.light : '#fff' });
  } else if (v === 'cat' && S.c.st !== 'q' && catL(time) <= 0.001) pill(c, t.c.none, px(200), py(160), w, h);
  if (v === 'cat' && S.c.st === 'rev') { const L = catL(time); $('dkMoon').value = Math.round(L * 100); }
  const key = `${v}|${phaseKey(time)}`;
  if (key !== S.pk) { S.pk = key; render(); }
});

// --- input ---------------------------------------------------------------------------------------------------------
const freeRoom = () => lab.view === 'room' && !S.sec && S.r.st === 'free';
const aimAt = (ev) => {
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left - G.ox) / G.s, y = (ev.clientY - r.top - G.oy) / G.s;
  S.r.th = clamp(Math.atan2(y - H0[1], x - H0[0]), -1.25, 0.95); S.r.aimed = true;
};
cv.addEventListener('pointerdown', (ev) => { if (!freeRoom()) return; S.r.drag = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ } aimAt(ev); });
cv.addEventListener('pointermove', (ev) => { if (S.r.drag && freeRoom()) aimAt(ev); });
const endDrag = () => { S.r.drag = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const v = lab.view;
  if (b.dataset.o !== undefined) { // an answer
    const i = +b.dataset.o, t0 = now();
    if (v === 'room') {
      const r = S.r;
      if (r.st === 'q1') { r.pick = i; r.st = 'q1rev'; r.t0 = t0; r.clicked = false; }
      else if (r.st === 'q2') { r.pick = i; r.st = 'q2rev'; r.t0 = t0; }
    } else if (v === 'sources') {
      const s = S.s, ok = CARDS[ORDER[s.i]].src ? 0 : 1;
      if (s.pick === null) { s.pick = i; s.t0 = t0; if (i === ok) s.score++; }
    } else if (S.c.st === 'q') { S.c.pick = i; S.c.st = 'rev'; S.c.t0 = t0; }
    sfx.click(); render(); showStage();
  } else if (b.dataset.go !== undefined) { // next / again
    if (v === 'room') {
      const r = S.r;
      if (r.st === 'q1rev') { S.r = Object.assign(freshRoom(), { st: 'q2' }); }
      else if (r.st === 'q2rev') { r.st = 'free'; r.v = { p1: 1, lit: 1, p2: 1, eye: 1 }; r.th = autoTheta(); r.aimed = false; }
    } else if (v === 'sources') {
      const s = S.s;
      if (s.i >= ORDER.length - 1) S.s = { i: 0, pick: null, t0: 0, score: 0 }; else { s.i++; s.pick = null; }
    } else { S.c = { st: 'q', pick: null, t0: 0, L: 0 }; $('dkMoon').value = 0; }
    sfx.click(); render();
  }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; sfx.click(); render();
  } else if (b.dataset.act === 'again') { S.r = freshRoom(); sfx.click(); render(); }
});
$('dkMoon').addEventListener('input', (ev) => { if (S.c.st === 'free') { S.c.L = +ev.target.value / 100; render(); } });

// --- one render per change: question card, controls, readout and the state card ---------------------------------------
function setAsk(a) {
  if (!a) { askEl.style.display = 'none'; return; }
  askEl.style.display = '';
  const done = !!a.res, pick = a.pick;
  const cls = (i) => (done && i === a.ok ? 'good' : done && i === pick ? 'bad' : pick === i ? 'dk-pick' : '');
  const opts = a.opts ? `<div class="dk-opts">${a.opts.map((o, i) => `<button class="dk-o ${cls(i)}" data-o="${i}"${pick !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>` : '';
  const res = a.res ? `<div class="dk-res">${a.res.v ? `<div class="dk-verdict" style="color:${a.res.good ? 'var(--ok)' : 'var(--wip)'}">${esc(a.res.v)}</div>` : ''}<p>${esc(a.res.text)}</p>${a.res.btn ? `<button class="btn" data-go>${esc(a.res.btn)}</button>` : ''}</div>` : '';
  const html = `${a.sub ? `<div class="dk-name">${esc(a.sub)}</div>` : ''}<div class="dk-q">${esc(a.q)}</div>${opts}${res}`;
  if (askEl._h !== html) { askEl._h = html; askEl.innerHTML = html; }
}
const vt = (txt) => `<span class="dk-vt">${esc(txt)}</span>`;

function render() {
  const t = T[lang], v = lab.view, time = now(), st = ST[lang];
  $('dkRoom').style.display = v === 'room' ? '' : 'none';
  $('dkCat').style.display = v === 'cat' ? '' : 'none';
  cv.style.touchAction = freeRoom() ? 'none' : 'pan-y';
  let ask = null, body = 'play';
  if (v === 'room') {
    const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    $('dkChips').innerHTML = sc('moon', '🌙') + sc('reflector', '🚲');
    $('dkAgain').hidden = S.r.st !== 'free'; $('dkAgain').textContent = t.again;
    lab.setGlow('rgba(255, 230, 128, .16)');
    if (S.sec) {
      const k = S.sec;
      ask = { q: t.secrets[k][0], res: { v: '', text: k === 'moon' ? t.sec.moonText : t.sec.reflText } }; body = 'info';
      lab.setReadout(k === 'moon' ? '🌙' : '🚲', t.secrets[k][1], '', C.iris);
    } else ask = renderRoom(t);
    const full = S.r.st === 'free' || (S.r.st === 'q2rev' && roomPhase(time) === 'done');
    lab.setState(full ? mk4(st.room.f) : mk4(st.room.n));
  } else if (v === 'sources') {
    ask = renderSources(t);
    const s = S.s, full = s.i === ORDER.length - 1 && !!ask.res;
    lab.setState(full ? mk4(st.sources.f) : mk4(st.sources.n));
  } else {
    ask = renderCat(t);
    lab.setState(S.c.st === 'free' ? mk4(st.cat.f) : mk4(st.cat.n));
  }
  setAsk(ask);
  document.body.dataset.v = ask ? (body === 'info' ? 'info' : 'ask') : 'play';
}
const mk4 = ([emo, title, lead, bodyTxt]) => ({ emo, title, lead, body: bodyTxt });
const verdict = (t, ok) => ({ v: ok ? t.right : t.wrong, good: ok });

function renderRoom(t) {
  const r = S.r, ph = roomPhase(now()), T_ = t.r;
  if (r.st === 'q1') { lab.setReadout('?', '', '', C.iris); return { q: T_.q1, opts: T_.o1, pick: null, ok: 1 }; }
  if (r.st === 'q2') { lab.setReadout('?', '', '', C.iris); return { q: T_.q2, opts: T_.o2, pick: null, ok: 1 }; }
  if (r.st === 'q1rev') {
    lab.setReadout(ph === 'dark' ? '🌑' : '🔦', '', ph === 'dark' ? T_.nothing : ph === 'run' ? '' : T_.see, C.iris);
    return { q: T_.q1, opts: T_.o1, pick: r.pick, ok: 1, res: ph === 'done' ? { ...verdict(t, r.pick === 1), text: T_.r1, btn: t.next } : null };
  }
  if (r.st === 'q2rev') {
    lab.setReadout('🔦', '', ph === 'done' ? T_.see : '', C.iris);
    return { q: T_.q2, opts: T_.o2, pick: r.pick, ok: 1, res: ph === 'done' ? { ...verdict(t, r.pick === 1), text: T_.r2, btn: t.next } : null };
  }
  const hit = beamOf(r.th).hit;
  lab.setReadout(vt(r.aimed ? (hit ? T_.see : T_.cant) : T_.aim), '', '', C.iris);
  return null;
}
function renderSources(t) {
  const s = S.s, k = ORDER[s.i], card = CARDS[k], ok = card.src ? 0 : 1, ph = phaseKey(now());
  lab.setGlow('rgba(255, 230, 128, .18)');
  const dots = ORDER.map((_, i) => (i < s.i ? '●' : i === s.i ? '◉' : '○')).join(' ');
  lab.setReadout(`${s.score}/${ORDER.length}`, dots, s.pick !== null && ph === 'done' ? t.s.o[ok] : '', C.iris);
  return { sub: cap(t.s.names[k]), q: t.s.q, opts: t.s.o, pick: s.pick, ok, res: s.pick !== null && ph === 'done' ? { ...verdict(t, s.pick === ok), text: t.s.why[k], btn: s.i === ORDER.length - 1 ? t.again : t.next } : null };
}
function renderCat(t) {
  const k = S.c, ph = phaseKey(now());
  lab.setGlow('rgba(76, 141, 219, .22)');
  $('dkE0').textContent = t.c.none; $('dkE1').textContent = t.c.moon;
  $('dkMoon').setAttribute('aria-label', t.c.moon); $('dkMoon').disabled = k.st !== 'free';
  if (k.st === 'free') $('dkMoon').value = Math.round(k.L * 100);
  else if (k.st === 'q') $('dkMoon').value = 0;
  const L = k.st === 'free' ? k.L : 0;
  if (k.st === 'q') lab.setReadout('?', '', '', C.iris);
  else lab.setReadout(vt(L > 0 || ph === 'rise' ? '🌙' : '🌑'), L > 0 || ph === 'rise' ? t.c.moon : t.c.none, '', C.iris);
  return { q: t.c.q, opts: t.c.o, pick: k.pick, ok: 1, res: k.st === 'free' ? { ...verdict(t, k.pick === 1), text: t.c.r, btn: t.again } : null };
}
render();
</script>
