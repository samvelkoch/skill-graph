function drawSort(c, t) {
  const v = lab.view, tt = T[lang], res = v === 'names' ? S.nres : S.res;
  const hov = S.drag && S.drag.moved ? G.tanks.findIndex((R) => S.drag.x >= R.x - 6 && S.drag.x <= R.x + R.w + 6 && S.drag.y >= R.y - 10 && S.drag.y <= R.y + R.h + 6) : -1;
  G.tanks.forEach((R, i) => {
    const tk = S.tk[i];
    drawTank(c, R, tk, i, t, () => { for (const r of res[i]) drawRes(c, r, R, i, t); });
    if ((S.sel && headKey() && !S.anim) || hov === i) {
      c.save(); c.strokeStyle = hov === i ? 'rgba(255,255,255,.95)' : `rgba(255,233,168,${.35 + .25 * Math.sin(t * 5)})`; c.lineWidth = hov === i ? 3.5 : 2.5; c.setLineDash(hov === i ? [] : [7, 6]);
      c.beginPath(); c.roundRect(R.x - 3, R.y - 3, R.w + 6, R.h + 6, 14); c.stroke(); c.restore();
    }
  });
  G.plaq.forEach((P, i) => {
    let txt, p;
    if (v === 'names') { txt = tt.grp['ABC'[i]]; p = 1; }
    else if (i < 3) { p = c01(S.rk * 1.5 - i * .25); txt = tt.plq['ABC'[i]]; }
    else { p = S.tu ? (S.tu.fl || 0) : 0; txt = tt.plq.R; }
    drawPlaque(c, P, txt, p);
  });
  if (S.sec === 'blue' && S.blue && v === 'rule' && G.tanks[1]) { /* the whale is a resident of tank B */ }
  drawCart(c, t);
  if (S.drag && S.drag.moved && G.head) {
    const hd = G.head, dx = S.drag.x, dy = S.drag.y;
    c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 12;
    if (hd.card) drawCard(c, hd.k, dx, dy, 1, t); else drawAnimal(c, hd.k, dx, dy, hd.L, 1, t * 1.6);
    c.restore();
  }
  drawAnim(c, t);
}
function drawInside(c, t) {
  const R = G.tanks[0], tk = S.tk[4], I = S.ins, k = INSIDE[I.i], ans = I.ans[I.i], res = S.insR, a = AN[k], tt = T[lang], u = unit(R), dt = S.dt;
  const lungs = a.g === 'B', xr = I.x && ans !== null;
  drawTank(c, R, tk, I.i, t, () => {
    const L = u * a.f, x = R.x + res.nx * R.w, y = R.y + res.ny * R.h + Math.sin(t * 1.6 + res.ph) * R.h * .006;
    if (xr) {
      c.fillStyle = 'rgba(3,12,32,.58)'; c.fillRect(R.x, R.y, R.w, R.h);
      drawAnimal(c, k, x, y, L, res.dir, t, { a: .4, ph: res.ph, xr: true });
      if (lungs) {
        I.emit -= dt;
        if (I.emit <= 0) { I.emit = .85; I.bub.push({ x: x + res.dir * L * a.xs.blow[0], y: y + L * a.xs.blow[1], r: Math.max(4, L * .03), ph: rnd(0, 6) }); }
      }
    } else drawAnimal(c, k, x, y, L, res.dir, t, { ph: res.ph });
    const wl = R.y + R.h * .13;
    I.bub = I.bub.filter((b) => { b.y -= dt * R.h * .22; b.x += Math.sin(t * 5 + b.ph) * .25; if (b.y < wl + 2) { tk.fx.push({ k: 'ring', x: clamp((b.x - R.x) / R.w, .05, .95), life: 1 }); return false; } return true; });
    for (const b of I.bub) { c.strokeStyle = 'rgba(235,250,255,.9)'; c.lineWidth = 1.6; c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.arc(b.x, b.y, b.r, 0, TAU); c.fill(); c.stroke(); c.fillStyle = 'rgba(255,255,255,.8)'; c.beginPath(); c.arc(b.x - b.r * .3, b.y - b.r * .3, Math.max(.5, b.r * .25), 0, TAU); c.fill(); }
  });
  pill(c, tt.an[k], R.x + R.w / 2, R.y + R.h - 22, '#e9eefc', 13);
  if (ans !== null) {
    const col = { A: '#7fd0f5', B: '#ffa6c4', C: '#f0c078' }[a.g], tags = [[tt.grp[a.g], col]];
    if (lungs) tags.push([tt.ins.lungs, '#ffd6e2']); else if (k !== 'starfish') tags.push([tt.ins.gills, '#bdeaff']);
    tags.push([a.xs.spine ? tt.ins.spine : tt.ins.nospine, '#e4faff']);
    tags.forEach(([s, cl], j) => pill(c, s, R.x + 10, R.y + R.h * .13 + 20 + j * 28, cl, 12, 'left'));
  }
}
function drawVerdict(c, w) {
  const d = S.vd; if (!d) return;
  const tt = T[lang], txt = d.ok ? tt.right : tt.surprise, al = d.t < 1.4 ? 1 : c01((1.9 - d.t) / .5);
  c.save(); c.globalAlpha = al; c.font = '900 17px Nunito, sans-serif';
  const hw = c.measureText(txt).width / 2 + 16, x = clamp(d.x, hw + 6, w - hw - 6), y = d.y - ease(d.t / .4) * 16;
  c.restore();
  c.save(); c.globalAlpha = al; pill(c, txt, x, y, d.ok ? '#3ddc97' : '#f5c84c', 17); c.restore();
}
canvasLoop($('cv'), (c, w, h, dt, t) => {
  step(dt);
  c.font = '800 12px Nunito, sans-serif';
  G = layout(c, w, h);
  drawHall(c, w, h);
  if (lab.view === 'inside') drawInside(c, t); else drawSort(c, t);
  drawVerdict(c, w);
});

// --- pointer: drag the animal into a tank, or tap it and then tap a tank -----------------------------------
const cv = $('cv');
const pt = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
const tankAt = (p) => G.tanks.findIndex((R) => p.x >= R.x - 6 && p.x <= R.x + R.w + 6 && p.y >= R.y - 10 && p.y <= R.y + R.h + 6);
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view === 'inside' || S.anim || !G.head) return;
  const p = pt(ev), ti = tankAt(p), hd = G.head;
  if (S.sel && ti >= 0) { place(ti, { x: hd.x, y: hd.y }); return; }
  if (Math.hypot((p.x - hd.x) / hd.rx, (p.y - hd.y) / hd.ry) <= 1) { S.drag = { x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false }; try { cv.setPointerCapture(ev.pointerId); } catch { /* ok */ } sfx.tick(); }
  else S.sel = false;
});
cv.addEventListener('pointermove', (ev) => {
  const d = S.drag; if (!d) return;
  const p = pt(ev); d.x = p.x; d.y = p.y;
  if (!d.moved && Math.hypot(p.x - d.sx, p.y - d.sy) > 8) d.moved = true;
});
const endDrag = (ev, cancel) => {
  const d = S.drag; if (!d) return;
  S.drag = null;
  if (cancel) return;
  if (d.moved) { const ti = tankAt(d); if (ti >= 0) place(ti, { x: d.x, y: d.y }); }
  else { S.sel = !S.sel; sfx.click(); }
};
cv.addEventListener('pointerup', (ev) => endDrag(ev, false));
cv.addEventListener('pointercancel', (ev) => endDrag(ev, true));

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'show') { S.ruleKnown = true; sfx.good(); showStage(); }
  else if (act === 'again') { resetRule(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    finishAnim();
    if (S.sec === k) { exitSec(); }
    else { exitSec(); S.sec = k; if (k === 'turtle') S.tu = { phase: 'ask', fl: 0 }; else startBlue(); showStage(); }
    sfx.click();
  } else if (act === 'prev' || act === 'next') {
    const n = INSIDE.length; S.ins.i = (S.ins.i + (act === 'next' ? 1 : n - 1)) % n; S.insR = mkR(INSIDE[S.ins.i]); S.ins.bub = []; S.ins.x = S.ins.ans[S.ins.i] !== null; sfx.tick();
  } else if (act === 'nnext') {
    if (S.nam.phase === 'end') { resetNames(); sfx.click(); }
    else { S.nam.i++; S.nam.phase = S.nam.i >= NAMES.length ? 'end' : 'pick'; S.nam.last = null; sfx.click(); }
  }
  render();
});
function exitSec() {
  if (S.sec === 'turtle') S.res[3] = [];
  if (S.sec === 'blue') S.res[1] = S.res[1].filter((r) => r.k !== 'bluewhale');
  S.sec = null; S.tu = null; S.blue = null;
}
function startBlue() {
  S.blue = { spouted: false };
  const r = mkR('bluewhale', .5, .5); r.hold = 0; r.ty = .2; r.ty = .2; r.surf = true; r.puff = 2.2; S.res[1].push(r);
}
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const I = S.ins;
  if (b.dataset.a === 'x') { I.x = !I.x; sfx.click(); }
  else if (b.dataset.a && I.ans[I.i] === null) {
    I.ans[I.i] = b.dataset.a; I.x = true; I.emit = 0;
    const ok = (b.dataset.a === 'yes') === (AN[INSIDE[I.i]].g === 'B');
    (ok ? sfx.good : sfx.bad)(); showStage();
  }
  render();
});

// --- one render per change ------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v === 'rule' && S.sec === 'turtle' ? 'turtle' : v;
  $('aqRule').style.display = v === 'rule' ? '' : 'none';
  $('aqIns').style.display = v === 'inside' ? '' : 'none';
  $('aqNam').style.display = v === 'names' ? '' : 'none';
  askEl.style.display = v === 'inside' ? '' : 'none';
  $('bShow').textContent = t.showRule;
  if (v === 'rule') renderRule(t); else if (v === 'inside') renderIns(t); else renderNam(t);
}
function renderRule(t) {
  const open = secret.unlocked(), turtle = S.sec === 'turtle';
  lab.setGlow('rgba(58, 164, 207, .3)');
  $('bShow').style.display = S.ruleKnown ? 'none' : '';
  $('bShow').disabled = S.tries < 4 || !!S.anim || turtle;
  $('bAgain').textContent = t.again; $('bAgain').style.display = S.done || (S.tries > 0 && S.ruleKnown) ? '' : 'none';
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('turtle', '🐢') + sc('blue', '🐋');
  lab.setReadout('🐠', t.placed(S.placed), S.tries ? `✓ ${S.right} / ${S.tries}` : '', '#3aa4cf');
  lab.setFacts(t.facts.rule);
  let st;
  if (turtle) {
    const d = S.tu && S.tu.phase === 'done';
    st = d ? { emo: '🐢', title: t.secrets.turtle[0], lead: t.turtleDone } : { emo: '🐢', title: t.secrets.turtle[0], lead: t.secrets.turtle[1] };
  } else if (S.sec === 'blue') {
    st = { emo: '🐋', title: t.secrets.blue[0], lead: S.blue && S.blue.spouted ? t.blueDone : t.secrets.blue[1] };
  } else if (S.ruleKnown) st = { emo: '💡', title: t.ruleTitle, lead: t.ruleText };
  else if (S.last) st = { emo: S.last.ok ? '✅' : '😮', title: S.last.ok ? t.right : t.surprise, lead: S.last.ok ? t.okLead : t.badLead };
  else st = { emo: '🐠', title: t.st.rule[0], lead: t.st.rule[1] };
  lab.setState({ ...st, body: '', extra: '' });
}
function renderIns(t) {
  const I = S.ins, k = INSIDE[I.i], ans = I.ans[I.i], a = AN[k], lungs = a.g === 'B';
  lab.setGlow('rgba(100, 200, 230, .28)');
  $('insDots').textContent = INSIDE.map((_, j) => (j === I.i ? '●' : I.ans[j] !== null ? '◉' : '○')).join(' ');
  $('bShow').textContent = t.showRule;
  document.querySelector('[data-act=prev]').setAttribute('aria-label', t.prev); document.querySelector('[data-act=next]').setAttribute('aria-label', t.nxt);
  if (ans === null) {
    askEl.innerHTML = `<div class="q">${esc(t.ins.q)}</div><div class="opts"><button data-a="yes">${esc(t.ins.yes)}</button><button data-a="no">${esc(t.ins.no)}</button></div>`;
    lab.setReadout(`${I.i + 1}/${INSIDE.length}`, t.an[k], '', '#64c8e6');
    lab.setState({ emo: '🔍', title: t.st.ins[0], lead: '', body: '', extra: '' });
  } else {
    const ok = (ans === 'yes') === lungs, tags = [lungs ? t.ins.lungs : k === 'starfish' ? '' : t.ins.gills, a.xs.spine ? t.ins.spine : t.ins.nospine].filter(Boolean).join(' · ');
    askEl.innerHTML = `<div class="opts"><span class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.surprise)}</span><button data-a="x" class="${I.x ? 'on' : ''}">${esc(t.xray)}</button></div><p>${esc(`${t.grp[a.g]}: ${tags}`)}</p>`;
    lab.setReadout(`${I.i + 1}/${INSIDE.length}`, t.an[k], t.grp[a.g], '#64c8e6');
    lab.setState({ emo: ok ? '✅' : '😮', title: ok ? t.right : t.surprise, lead: `${t.grp[a.g]}: ${tags}`, body: t.st.ins[1], extra: '' });
  }
  lab.setFacts(t.facts.ins);
}
function renderNam(t) {
  const N = S.nam, n = NAMES.length;
  lab.setGlow('rgba(240, 190, 110, .26)');
  $('bNext').textContent = N.phase === 'end' ? t.again : t.next;
  $('bNext').disabled = N.phase === 'pick';
  $('bNext').style.display = '';
  lab.setReadout(`${Math.min(N.i + (N.phase === 'pick' ? 0 : 1), n)}/${n}`, N.phase === 'end' ? `✓ ${N.right}` : '', '', '#f0be6e');
  lab.setFacts(t.facts.nam);
  if (N.phase === 'note' && N.last) lab.setState({ emo: N.last.ok ? '✅' : '😮', title: N.last.ok ? t.right : t.surprise, lead: t.traps[N.last.k], body: '', extra: '' });
  else if (N.phase === 'end') lab.setState({ emo: '🏷️', title: t.st.nam[0], lead: '', body: '', extra: `<ul style="margin:0;padding-left:18px;line-height:1.5">${NAMES.map((k) => `<li><b>${esc(t.an[k])}</b>: ${esc(t.traps[k])}</li>`).join('')}</ul>` });
  else lab.setState({ emo: '🏷️', title: t.st.nam[0], lead: t.st.nam[1], body: '', extra: '' });
}
render();
</script>
