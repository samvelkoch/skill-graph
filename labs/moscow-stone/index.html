};
const GK = { roof: 'g1', plan: 'g2', walls: 'g3' };
const askHtml = (q, opts, g, ok) => `<div class="ms-q">${esc(q)}</div><div class="ms-opts">${opts.map((o, i) => `<button class="ms-opt${g !== null ? (i === ok ? ' good' : i === g ? ' mine' : '') : ''}" data-act="guess" data-i="${i}"${g !== null ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
const chipSecret = (act, on, label) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${on ? 'on' : ''}" data-act="${act}">${secret.unlocked() ? esc(label) : '🔒 ???'}</button>`;
const resetRoof = () => { S.pa[3] = 0; S.pa[4] = 0; };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'guess') {
    const k = GK[v]; if (S[k] !== null) return;
    S[k] = +b.dataset.i;
    const ok = S[k] === T[lang][v].ok; (ok ? sfx.good : sfx.bad)();
    if (v === 'roof') { S.parts = 5; S.auto = true; S.autoT0 = performance.now() / 1000; S.note = 'verdict'; }
    showStage();
  } else if (act === 'next') { if (S.parts < 5) { S.parts++; S.auto = false; S.note = null; sfx.snap(); } }
  else if (act === 'reset') { S.parts = 0; S.auto = false; S.note = null; sfx.click(); }
  else if (act === 'roof') {
    const k = b.dataset.k;
    if (S.ban && k === 'tent') return;
    if (k !== S.roof) { S.roof = k; resetRoof(); } S.note = 'roof'; S.auto = false; S.parts = Math.max(S.parts, 4); sfx.click();
  } else if (act === 'ban') {
    if (!secret.unlocked()) return secret.open();
    S.ban = !S.ban; S.auto = false; S.note = null;
    if (S.ban) { S.parts = 5; if (S.roof === 'tent') { S.roof = 'dome'; resetRoof(); } }
    sfx.click();
  } else if (act === 'again') { S.counted = []; S.pnote = false; sfx.click(); }
  else if (act === 'leg') {
    if (!secret.unlocked()) return secret.open();
    S.legend = S.legend ? 0 : 1; sfx.click();
  } else if (act === 'lans') { S.legend = 2; S.lg = +b.dataset.i; (S.lg === 1 ? sfx.good : sfx.bad)(); }
  else if (act === 'map') { S.map = !S.map; sfx.click(); }
  render();
});
$('zoom').addEventListener('input', (ev) => { S.zoom = +ev.target.value / 100; render(); });
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'plan' || S.g2 === null || S.cov < 0.9) return;
  const r = $('cv').getBoundingClientRect(), gx = (ev.clientX - r.left - G.ox) / G.s - PC.x, gy = (ev.clientY - r.top - G.oy) / G.s - PC.y;
  let best = -1, bd = 1e9;
  CHS.forEach((ch, i) => { const d = Math.hypot(gx - ch.x, gy - ch.y); if (d < Math.max(ch.r + 8, 26) && d < bd) { bd = d; best = i; } });
  if (best < 0 || S.counted.includes(best)) return;
  S.counted.push(best); S.pnote = false;
  (S.counted.length === CHS.length ? sfx.good : sfx.tick)(); render();
});

// --- one render per change ----------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('sRoof').hidden = v !== 'roof'; $('sPlan').hidden = v !== 'plan'; $('sWalls').hidden = v !== 'walls';
  if (v === 'roof') renderRoof(t); else if (v === 'plan') renderPlan(t); else renderWalls(t);
}
function renderRoof(t) {
  const r = t.roof, g = S.g1, post = g !== null;
  lab.setGlow('rgba(230, 184, 74, .24)');
  $('rQ').innerHTML = askHtml(r.q, r.opts, g, r.ok);
  if (!post) {
    $('rB').innerHTML = '';
    lab.setReadout('?', '', '', '#e6b84a');
    lab.setState({ emo: '🤔', title: r.preT, lead: r.preL, body: '' });
    lab.setFacts(t.facts.roofPre);
    return;
  }
  const n = S.parts;
  $('rB').innerHTML = `<div class="ms-row"><button class="ms-btn gold" data-act="next"${n >= 5 ? ' disabled' : ''}>${esc(r.next)}</button><button class="ms-btn" data-act="reset">${esc(r.reset)}</button></div>
    <div class="ms-row"><div class="chips">${['dome', 'onion', 'tent'].map((k) => `<button class="chip ${S.roof === k && n >= 4 ? 'on' : ''}" data-act="roof" data-k="${k}"${S.ban && k === 'tent' ? ' disabled' : ''}>${esc(r.roofs[k])}</button>`).join('')}</div></div>
    <div class="ms-row">${chipSecret('ban', S.ban, r.ban.chip)}</div>`;
  lab.setReadout(`${n}/5`, r.sub(n), n >= 4 ? r.roofs[S.roof] : '', '#e6b84a');
  let st;
  if (S.ban) st = { emo: '⛔', title: r.ban.title, lead: r.ban.lead, body: r.ban.body };
  else if (S.note === 'verdict') st = { emo: g === r.ok ? '✅' : '🤔', title: g === r.ok ? t.right : t.wrong, lead: r.truth, body: '' };
  else if (S.note === 'roof') st = { emo: '🏛️', title: r.note[S.roof][0], lead: r.note[S.roof][1], body: '' };
  else if (n === 0) st = { emo: '🏗️', title: r.emptyT, lead: r.emptyL, body: '' };
  else if (n < 5) st = { emo: '🧱', title: `${n}/5: ${r.parts[n - 1]}`, lead: r.steps[n - 1], body: '' };
  else st = { emo: '⛪', title: r.done[0], lead: r.done[1], body: '' };
  lab.setState(st);
  lab.setFacts(t.facts.roofPost);
}
function renderPlan(t) {
  const p = t.plan, g = S.g2, post = g !== null, N = CHS.length;
  lab.setGlow('rgba(194, 73, 58, .24)');
  $('pQ').innerHTML = askHtml(p.q, p.opts, g, p.ok);
  if (!post) {
    $('pB').innerHTML = '';
    lab.setReadout('?', '', '', '#c2493a');
    lab.setState({ emo: '🤔', title: p.preT, lead: p.preL, body: '' });
    lab.setFacts(t.facts.planPre);
    return;
  }
  const k = S.counted.length, all = k >= N;
  let legend = '';
  if (S.legend === 1) legend = `<div class="ms-q" style="margin-top:14px">${esc(p.lq)}</div><div class="ms-opts">${p.lopts.map((o, i) => `<button class="ms-opt" data-act="lans" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  $('pB').innerHTML = `<div class="ms-row">${all ? `<button class="ms-btn gold" data-act="again">${esc(p.again)}</button>` : ''}${k && !all ? `<button class="ms-btn" data-act="again">${esc(p.again)}</button>` : ''}</div>
    <div class="ms-row">${chipSecret('leg', S.legend > 0, p.chip)}</div>${legend}`;
  lab.setReadout(`${k}/${N}`, p.sub, '', '#c2493a');
  let st;
  if (S.legend === 2) st = { emo: S.lg === 1 ? '✅' : '🤔', title: `${S.lg === 1 ? t.right : t.wrong} ${p.lt}`, lead: p.ll, body: p.lb };
  else if (S.legend === 1) st = { emo: '📜', title: p.lq, lead: '', body: '' };
  else if (S.pnote) st = { emo: g === p.ok ? '✅' : '🤔', title: g === p.ok ? t.right : t.wrong, lead: p.truth(N), body: p.built };
  else if (all) st = { emo: '🏆', title: p.done(N), lead: p.truth(N), body: p.built };
  else st = { emo: '👆', title: p.cnt(k, N), lead: p.tap, body: p.built };
  lab.setState(st);
  lab.setFacts(t.facts.planPost);
}
function renderWalls(t) {
  const w = t.walls, g = S.g3, post = g !== null;
  lab.setGlow('rgba(196, 87, 59, .26)');
  $('wQ').innerHTML = askHtml(w.q, w.opts, g, w.ok);
  $('zLbl').textContent = w.zoom; $('zoom').setAttribute('aria-label', w.zoom);
  $('wZ').hidden = S.map;
  if ($('zoom').value !== String(Math.round(S.zoom * 100))) $('zoom').value = String(Math.round(S.zoom * 100));
  $('zVal').textContent = S.zoom < 0.5 ? '' : w.mh;
  $('wB').innerHTML = post ? `<div class="ms-row"><button class="ms-btn${S.map ? '' : ' gold'}" data-act="map">${esc(S.map ? w.mapOff : w.mapOn)}</button></div>` : '';
  if (S.map) lab.setReadout(`${w.city[0]} → ${w.city[1]}`, '', '', '#c4573b');
  else if (S.zoom < 0.5) lab.setReadout(numFmt(MERLONS), w.mer, w.pillS, '#c4573b');
  else lab.setReadout(w.mh, w.mhSub, w.pillS, '#c4573b');
  if (!post) {
    lab.setState({ emo: '🤔', title: w.preT, lead: w.preL, body: '' });
    lab.setFacts(t.facts.wallsPre);
    return;
  }
  lab.setState(S.map ? { emo: '🗺️', title: w.mapT, lead: w.mapL, body: '' }
    : { emo: g === w.ok ? '✅' : '🤔', title: g === w.ok ? t.right : t.wrong, lead: w.truth, body: w.body });
  lab.setFacts(t.facts.wallsPost);
}
render();
</script>
