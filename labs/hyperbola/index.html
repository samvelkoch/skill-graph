  let gr = c.createLinearGradient(0, 36, 0, 84); gr.addColorStop(0, '#3a4058'); gr.addColorStop(1, '#232739');
  c.fillStyle = gr; c.beginPath(); c.roundRect(14, 36, 312, 48, 12); c.fill();
  c.setLineDash([12, 10]); c.lineWidth = 2.4; c.strokeStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.moveTo(24, 60); c.lineTo(316, 60); c.stroke(); c.setLineDash([]);
  const per = tt, ph = time % (per + 0.6), f = clamp(ph / per, 0, 1), cxp = 44 + f * 252;

  c.fillStyle = gr; c.beginPath(); c.moveTo(-22, 12); c.lineTo(-22, 2); c.quadraticCurveTo(-21, -2, -14, -3); c.lineTo(-8, -12); c.quadraticCurveTo(-6, -14, -2, -14); c.lineTo(8, -14); c.quadraticCurveTo(12, -14, 14, -10); c.lineTo(17, -3); c.quadraticCurveTo(23, -2, 23, 4); c.lineTo(23, 12); c.closePath(); c.fill();
  c.lineWidth = 1.5; c.strokeStyle = '#8f2b14'; c.stroke();
  c.fillStyle = 'rgba(215,240,255,.9)'; c.beginPath(); c.moveTo(-6, -4); c.lineTo(-2, -11); c.lineTo(7, -11); c.lineTo(11, -4); c.closePath(); c.fill();
  for (const wx of [-12, 13]) { c.fillStyle = '#12141f'; c.beginPath(); c.arc(wx, 13, 5.5, 0, 6.283); c.fill(); c.fillStyle = '#c7cde0'; c.beginPath(); c.arc(wx, 13, 2.2, 0, 6.283); c.fill(); }
  c.restore();
  pill(c, '0 km', 34, 100, 'c', '#d6def8', fs); pill(c, t.trip.km, 306, 100, 'c', '#d6def8', fs); pill(c, t.trip.lapse, 170, 126, 'c', '#9fa8c8', fs);
  // graph: time against speed
  const gx0 = 50, gx1 = 322, gy0 = 380, gy1 = 168, GXp = (q) => gx0 + (q / 130) * (gx1 - gx0), GYp = (q) => gy0 - (q / 7) * (gy0 - gy1);
  gr0(c, 4, 140, 332, 266);
  c.strokeStyle = 'rgba(150,165,215,.12)'; c.lineWidth = 1; c.beginPath();
  for (let q = 20; q <= 120; q += 20) { c.moveTo(GXp(q), gy1); c.lineTo(GXp(q), gy0); }
  for (let q = 1; q <= 6; q++) { c.moveTo(gx0, GYp(q)); c.lineTo(gx1, GYp(q)); }

  c.textAlign = 'center'; c.textBaseline = 'top'; for (let q = 20; q <= 120; q += 20) c.fillText(String(q), GXp(q), gy0 + 4);

  c.textAlign = 'right'; c.fillText(t.trip.unit, gx1, gy0 - 12);
  const DX = GXp(v), DY = GYp(tt);
  c.save(); c.beginPath(); c.rect(gx0, gy1 - 6, gx1 - gx0 + 4, gy0 - gy1 + 8); c.clip();
  const rg = c.createLinearGradient(gx0, DY, DX, gy0); rg.addColorStop(0, GOLD[0]); rg.addColorStop(1, GOLD[1]);

  c.beginPath(); for (let q = 18; q <= 130.01; q += 1) { const X = GXp(q), Y = GYp(120 / q); if (q === 18) c.moveTo(X, Y); else c.lineTo(X, Y); }

canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  if (S.sec === 'cone') return drawCone(c, w, h, dt, time);
  if (S.sec === 'trip') return drawTrip(c, w, h, dt, time);
  const v = lab.view;
  if (v === 'area') drawArea(c, w, h, dt, time); else if (v === 'shift') drawShift(c, w, h, dt, time); else drawGas(c, w, h, dt, time);
});

// --- pointer: drag the point along the curve ---------------------------------------------------------------------
const cv = $('cv');
function dragTo(ev) {
  if (!GEO) return;
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left - GEO.cx) / GEO.s;
  if (lab.view === 'area') {
    let nx = Math.round(x * 10) / 10; nx = clamp(nx, -11.5, 11.5); if (Math.abs(nx) < 1) nx = nx < 0 ? -1 : 1;
    if (nx === S.xt) return;
    S.xt = nx; S.anim = false; S.ghost = false; S.verd = null; S.dragged = true;
  } else {
    let d = x - S.sh.a; if (Math.abs(d) < 0.5) d = d < 0 ? -0.5 : 0.5;
    d = Math.round(d * 10) / 10; if (d === S.d) return;
    S.d = d;
  }
  render();
}
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const v = lab.view;
  if ((v === 'area' && S.st1 >= 1) || (v === 'shift' && S.gb !== null)) { S.drag = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* no capture */ } dragTo(ev); }
});
cv.addEventListener('pointermove', (ev) => { if (S.drag) dragTo(ev); });
['pointerup', 'pointercancel'].forEach((e) => cv.addEventListener(e, () => { S.drag = false; }));

// --- controls --------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('hyPred').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-pick]'); if (!b) return;
  const i = +b.dataset.pick, v = lab.view;
  if (v === 'area') {
    if (S.st1 === 0) { S.g1 = i; S.st1 = 1; S.xt = 6; S.anim = true; S.ghost = true; S.verd = { n: 1, ok: i === 0 }; (i === 0 ? sfx.good : sfx.bad)(); }
    else if (S.st1 === 2) { S.g2 = i; S.st1 = 3; S.xt = 100; S.far = 3; S.anim = true; S.ghost = false; S.verd = { n: 2, ok: i === 2 }; (i === 2 ? sfx.good : sfx.bad)(); }
  } else if (v === 'shift') { S.gb = i; S.verdB = { ok: i === 1 }; (i === 1 ? sfx.good : sfx.bad)(); }
  else if (v === 'gas') { S.gc = i; S.V = 20; S.verdC = { ok: i === 2 }; (i === 2 ? sfx.good : sfx.bad)(); $('vS').value = 20; }
  render(); showStage();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'xdec' || act === 'xinc') {
    const dir = act === 'xinc' ? 1 : -1; S.xt = clamp(Math.round(S.xt) + dir, -11, 11); S.anim = false; S.ghost = false; S.verd = null; sfx.tick();
  } else if (act === 'x0') { S.xt = 0; S.anim = false; S.ghost = false; S.verd = null; S.dragged = true; sfx.click(); }
  else if (act === 'next1') { S.st1 = 2; sfx.click(); }
  else if (act === 'task') { if (S.task >= TASKS.length) { S.task = 0; S.sh = { k: 6, a: 2, b: 1 }; } else if (taskOk()) S.task++; S.verdB = null; sfx.good(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, val = +ev.target.value;
  if (id === 'farS') { S.far = val; S.xt = S.x = FAR[val]; S.anim = false; S.verd = null; S.dragged = true; }
  else if (id === 'kS') { S.sh.k = val === 0 ? (S.sh.k > 0 ? -1 : 1) : val; S.verdB = null; }
  else if (id === 'aS') { S.sh.a = val; S.verdB = null; }
  else if (id === 'bS') { S.sh.b = val; S.verdB = null; }
  else if (id === 'vS') { S.V = val; S.verdC = null; }
  else if (id === 'coneS') S.cone = val;
  else if (id === 'tripS') S.trip = val;
  else return;
  render();
});

// --- render: controls, readout, state card, facts ------------------------------------------------------------------
function pred(q, opts) {
  $('hyPred').hidden = false;
  $('hyPred').innerHTML = `<div class="hy-q">${esc(q)}</div><div class="hy-opts">${opts.map((o, i) => `<button class="hy-opt" type="button" data-pick="${i}">${esc(o)}</button>`).join('')}</div>`;
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  $('hyPred').hidden = true;
  $('vA').hidden = !(v === 'area' && !sec); $('vB').hidden = !(v === 'shift' && !sec); $('vC').hidden = !(v === 'gas' && !sec); $('vS_').hidden = !sec;
  renderSec(t);
  if (sec) return renderSecret(t);
  if (v === 'area') renderArea(t); else if (v === 'shift') renderShift(t); else renderGas(t);
}
function renderSec(t) {
  const row = $('secRow'), ready = secretsReady();
  row.hidden = !ready;
  if (!ready) return;
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  row.innerHTML = sc('cone', '🍦') + sc('trip', '🚗');
}

function renderArea(t) {
  const A = t.a, st = S.st1, x = S.xt, zero = x === 0, y = zero ? 0 : 12 / x;
  lab.setGlow('rgba(95, 224, 210, .24)');
  const predicting = st === 0 || st === 2;
  if (st === 0) pred(A.q1, A.o1); else if (st === 2) pred(A.q2, A.o2);
  $('x0B').hidden = st < 1;
  $('xLbl').textContent = A.xl; $('xVal').textContent = zero ? '0' : num(x, 4);
  $('farRow').hidden = st < 3; $('farLbl').textContent = A.far; $('farS').value = S.far; $('farVal').textContent = num(FAR[S.far]);
  $('dragHint').textContent = st >= 1 && st !== 2 ? A.drag : ''; $('dragHint').hidden = !(st === 1 || st === 3);
  $('next1').hidden = st !== 1; $('next1').textContent = A.next;
  $('xRow').hidden = st === 0 || st === 2 ? true : false;
  if (st === 0 || st === 2) lab.setFacts(t.facts1.slice(0, 2)); else lab.setFacts(t.facts1);
  const ys = zero ? '' : num(y);
  if (st === 0) {
    lab.setReadout(`y = ${num(4)}`, 'x = 3', '', '#5fe0d2');
    lab.setState({ emo: '🤔', title: A.q1, lead: t.pickHint, body: '', extra: '' });
    return;
  }
  if (zero) lab.setReadout('?', A.nov, 'x = 0', '#5fe0d2');
  else lab.setReadout('12', A.sub, A.coords(num(x, 4), ys, !exactly(y)), '#5fe0d2');
  if (st === 2) { lab.setState({ emo: '🤔', title: A.q2, lead: t.pickHint, body: '', extra: '' }); return; }
  const vd = S.verd;
  if (vd) {
    lab.setState({ emo: vd.ok ? '✅' : '🤔', title: vd.ok ? t.rightV : t.wrongV, lead: vd.n === 1 ? (vd.ok ? A.r1 : A.w1) : (vd.ok ? A.r2 : A.w2), body: vd.n === 2 ? A.farB : '', extra: '' });
  } else if (zero) lab.setState({ emo: '🚫', title: A.zero, lead: A.zeroL, body: '', extra: '' });
  else if (st >= 3 && Math.abs(x) >= 10) lab.setState({ emo: '🔍', title: A.farT(num(x), ys), lead: A.farL, body: A.farB, extra: '' });
  else if (x < 0) lab.setState({ emo: '🟦', title: A.neg, lead: A.negL, body: '', extra: '' });
  else lab.setState({ emo: '🟦', title: A.same, lead: A.sameL, body: st >= 3 ? A.farB : '', extra: '' });
}

function renderShift(t) {
  const B = t.b, { k, a, b } = S.sh, rev = S.gb !== null;
  lab.setGlow('rgba(255, 154, 118, .24)');
  if (!rev) pred(B.q, B.o);
  $('sliders').hidden = !rev; $('taskBox').hidden = !rev;
  $('kL').textContent = B.kl; $('aL').textContent = B.al; $('bL').textContent = B.bl;
  $('kS').value = k; $('aS').value = a; $('bS').value = b; $('kV').textContent = mn(k); $('aV').textContent = mn(a); $('bV').textContent = mn(b);
  lab.setFacts(t.facts2);
  const ok = rev && taskOk(), done = S.task >= TASKS.length;
  $('taskT').textContent = done ? '' : B.task(S.task + 1, TASKS.length);
  $('taskD').textContent = done ? B.end : B.tasks[S.task]; $('taskD').className = 'hy-td' + (ok || done ? ' hy-ok' : '');
  $('taskB').hidden = !(ok || done); $('taskB').textContent = done ? B.again : B.nextT;
  if (!rev) {
    lab.setReadout(formula(6, 2, 1), '', '', '#ff9a76');
    lab.setState({ emo: '🤔', title: B.q, lead: B.lead, body: '', extra: '' });
    return;
  }
  lab.setReadout(formula(k, a, b), B.sub(k, a, b), B.pill(a, b), '#ff9a76');
  if (!S.verdB && S.task >= TASKS.length) lab.setState({ emo: '🏁', title: B.end, lead: B.endL, body: '', extra: '' });
  else if (S.verdB) lab.setState({ emo: S.verdB.ok ? '✅' : '🤔', title: S.verdB.ok ? t.rightV : t.wrongV, lead: B.r, body: '', extra: '' });
  else if (ok) lab.setState({ emo: '🎯', title: B.ok, lead: B.as(a, b), body: k > 0 ? B.pos : B.neg, extra: '' });
  else lab.setState({ emo: '↔️', title: formula(k, a, b), lead: B.as(a, b), body: k > 0 ? B.pos : B.neg, extra: '' });
}

function renderGas(t) {
  const C = t.c, V = S.V, p = PV / V, pre = S.gc === null;
  lab.setGlow('rgba(255, 138, 76, .24)');
  if (pre) pred(C.q, C.o);
  $('vS').disabled = pre; $('vS').value = V; $('vLbl').textContent = C.vol; $('vVal').textContent = `${V} ${C.mL}`;
  $('gasFine').textContent = C.fine;
  lab.setFacts(t.facts3);
  if (pre) {
    lab.setReadout(`100 ${C.kPa}`, C.sub(40), '', '#ff8a4c');
    lab.setState({ emo: '🤔', title: C.q, lead: C.lead, body: '', extra: '' });
    return;
  }
  lab.setReadout(`${num(p)} ${C.kPa}`, C.sub(V), C.pill, '#ff8a4c');
  if (S.verdC) lab.setState({ emo: S.verdC.ok ? '✅' : '🤔', title: S.verdC.ok ? t.rightV : t.wrongV, lead: C.r, body: '', extra: '' });
  else lab.setState({ emo: '💨', title: C.title(V, num(p)), lead: C.lead2, body: C.body, extra: '' });
}

function renderSecret(t) {
  const k = S.sec;
  $('coneRow').hidden = k !== 'cone'; $('tripRow').hidden = k !== 'trip';
  if (k === 'cone') {
    const C = t.cone, be = S.cone, e = be === 90 ? 0 : Math.cos(be * Math.PI / 180) / Math.cos(ALPHA * Math.PI / 180);
    $('coneL').textContent = C.lbl; $('coneS').value = be; $('coneV').textContent = `${be}°`;
    lab.setGlow('rgba(154, 140, 255, .26)'); lab.setFacts(t.factsCone);
    const kind = be < ALPHA ? 'hyp' : be === ALPHA ? 'par' : be < 90 ? 'ell' : 'cir';
    lab.setReadout(`e = ${num(e, 3)}`, C.cut, C.pill(be), '#9a8cff');
    lab.setState({ emo: '🍦', title: C[kind], lead: C[`${kind}L`], body: '', extra: '' });
  } else {
    const C = t.trip, v = TRIP[S.trip], tt = 120 / v, hrs = Math.floor(tt + 1e-9), mins = Math.round((tt - hrs) * 60);
    const ts = hrs && mins ? `${hrs} ${C.h} ${mins} ${C.min}` : hrs ? `${hrs} ${C.h}` : `${mins} ${C.min}`;
    $('tripL').textContent = C.lbl; $('tripS').value = S.trip; $('tripV').textContent = `${v} ${C.unit}`;
    lab.setGlow('rgba(242, 193, 78, .24)'); lab.setFacts([]);
    lab.setReadout('120 km', C.sub, C.pill(v), '#f2c14e');
    lab.setState({ emo: '🚗', title: C.title(v, ts), lead: C.lead, body: C.body, extra: '' });
  }
}
