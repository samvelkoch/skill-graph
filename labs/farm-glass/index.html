function renderGlass(t, ans, sec) {
  const g = t.g; lab.setGlow('rgba(224, 176, 80, .24)');
  $('gE0').textContent = t.months[0]; $('gE1').textContent = t.months[11]; $('gT').value = Math.round(S.t * 100);
  $('gPlay').textContent = S.playing ? g.pause : g.play;
  if (ans === null) {
    lab.setReadout('?', '', '', '#e0b050'); lab.setState({ emo: '🤔', title: g.q, lead: g.lead0, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const mi = Math.floor(S.t), tn = BEDS.map((b) => bedNight(b, S.t));
  if (sec === 'nl') {
    const kg = Math.round(NL_PER_M2 * S.nlA);
    $('nlLbl').textContent = g.nlA(S.nlA);
    lab.setReadout(kg, 'kg', '', '#e5413a');
    lab.setState({ emo: '🍅', title: g.nlT(kg), lead: g.nlL(S.nlA), body: g.nlB, extra: '' }); lab.setFacts(t.facts.nl); return;
  }
  const ripe = BEDS.filter((b) => { const s = simAt(b, S.t); return s.planted && !s.dead && s.p >= RIPE; }).map((b) => t.beds[BEDS.indexOf(b)]);
  lab.setReadout(t.months[mi], g.where, t.illus, '#e0b050');
  lab.setState({
    emo: '🍅', title: ripe.length ? g.ripeNow(ripe.join(', ')) : g.none, lead: g.nights(fmt1(tn[0]), fmt1(tn[1]), fmt1(tn[2])), body: g.rule,
    extra: `${S.maxT >= doneT ? `<div class="fine"><b>${esc(g.order(order().map((b) => t.beds[BEDS.indexOf(b)]).join(' → ')))}</b></div>` : ''}<div class="fine">${esc(g.fine)}</div>`,
  });
  lab.setFacts(t.facts.glass);
}

function renderWater(t, ans, sec) {
  const w = t.w; lab.setGlow('rgba(78, 168, 255, .26)');
  $('wE0').textContent = `20 ${t.L}`; $('wE1').textContent = `100 ${t.L}`;
  $('wLbl').textContent = w.pump(S.pump); $('wTask').textContent = w.task; $('wGo').textContent = S.wPh === 'idle' ? w.go : w.again; $('wGo').disabled = S.wPh === 'run';
  $('pLbl').textContent = w.fish(S.fish); $('pAir').textContent = S.air ? w.aOn : w.aOff;
  if (ans === null) {
    lab.setReadout('?', '', '', '#4ea8ff'); lab.setState({ emo: '🤔', title: w.q, lead: w.lead0, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (sec === 'pond') {
    const ox = Math.round(oxygen()), bad = ox < 40;
    lab.setReadout(S.fish, '🐟', `${w.ox} ${ox} %`, bad ? '#ff6a4a' : '#3ddc97');
    lab.setState({ emo: bad ? '😮' : '🐟', title: bad ? w.badT : w.okT, lead: bad ? w.badL : w.okL, body: w.pondB, extra: '' }); lab.setFacts(t.facts.pond); return;
  }
  lab.setReadout(`${S.pump} ${t.L}`, w.pump(S.pump).split(':')[0], '', '#4ea8ff');
  if (S.wPh === 'idle') lab.setState({ emo: '💧', title: w.idle, lead: w.idleLead, body: '', extra: `<div class="fine">${esc(w.fine)}</div>` });
  else if (S.wPh === 'run') lab.setState({ emo: '💧', title: w.running, lead: w.lead(S.pump, '…', '…', '…'), body: '', extra: '' });
  else {
    const R = [0, 1, 2].map(rootsL), st = R.map((L) => moodOf(L)), nm = (k) => w.beds.filter((_, i) => st[i] === k).join(', ');
    const dry = nm('thirsty'), wet = nm('wet');
    const title = dry ? w.thirsty(dry) : wet ? w.wet(wet) : w.allFed;
    lab.setState({ emo: dry ? '🥀' : wet ? '🌊' : '🌱', title, lead: w.lead(S.pump, R[0], R[1], R[2]), body: (dry && wet ? `${w.wet(wet)} ` : '') + w.body, extra: `<div class="fine">${esc(w.fine)}</div>` });
  }
  lab.setFacts(t.facts.water);
}

function renderHills(t, ans) {
  const h = t.h; lab.setGlow('rgba(217, 130, 95, .24)');
  $('hE0').textContent = h.ends[0]; $('hE1').textContent = h.ends[1]; $('hLbl').textContent = h.rainL(h.levels[S.level - 1]);
  $('hGo').textContent = h.go; $('hGo').disabled = S.hPh === 'run'; $('hReset').textContent = h.reset;
  if (ans === null) {
    lab.setReadout('?', '', '', '#d9825f'); lab.setState({ emo: '🤔', title: h.q, lead: h.lead0, body: '', extra: '' }); lab.setFacts([]); return;
  }
  const b = Math.round(soilLeft(S.hB) * 100), tr = Math.round(soilLeft(S.hTr) * 100);
  lab.setReadout(`${b} % · ${tr} %`, `${h.panel[0]} · ${h.panel[1]}`, h.levels[S.level - 1], '#d9825f');
  if (S.hPh === 'idle' && S.hT === 0 && b === 100 && tr === 100) lab.setState({ emo: '⛰️', title: h.press, lead: h.pressLead, body: '', extra: '' });
  else if (S.hPh === 'run') lab.setState({ emo: '🌧️', title: h.raining, lead: h.title(b, tr), body: '', extra: '' });
  else lab.setState({ emo: '⛰️', title: h.title(b, tr), lead: h.lead, body: (S.level >= 4 ? h.spill : '') + h.body, extra: '' });
  lab.setFacts(t.facts.hills);
}
render();
