    if (RBB.peelDir) newPaper(RBB, 'beast', '#2e6b4f'); else { RBB.peelDir = 1; RBB.down = false; sfx.good(); showStage(); }
    render(); return;
  }
  if (d.shape !== undefined) { S.mSel = +d.shape; if (S.mBrush[S.mSel] !== null) S.mT0 = now() - 6; sfx.click(); render(); return; }
  if (d.brush !== undefined) {
    const i = S.mSel, j = +d.brush;
    if (S.mBrush[i] === null) S.mRight[i] = BR[j] === SHAPES[SHAPE_IDS[i]].best;
    S.mBrush[i] = j; S.mT0 = now(); (BR[j] === SHAPES[SHAPE_IDS[i]].best ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (d.sort) return chooseSort(d.sort);
  if (b.id === 'sortNext') {
    if (S.swOver) { S.swOrder = shuffle(SW_IDS); S.swI = 0; S.swPick = null; S.swOk = []; S.swPile = { pattern: [], texture: [] }; S.swOver = false; }
    else {
      const id = S.swOrder[S.swI];
      S.swPile[SW_PATTERN[id] ? 'pattern' : 'texture'].push({ id, t0: now() });
      S.swPick = null;
      if (S.swI >= 7) S.swOver = true; else S.swI++;
    }
    sfx.click(); render(); return;
  }
});
$('dz').addEventListener('input', (ev) => { S.z = +ev.target.value / 100; renderDots(T[lang]); });

// --- the picture --------------------------------------------------------------------------------------------------
function drawMarks(c, e, t) {
  nightBG(c, e);
  const k = T[lang].marks, id = SHAPE_IDS[S.mSel], b = S.mBrush[S.mSel], best = SHAPES[id].best, dtt = now() - S.mT0;
  const f = b === null ? 0 : eout(dtt / .9);
  c.save(); c.translate(150, 148); c.scale(.88, .88); drawShape(c, id, b === null ? null : BR[b], f); c.restore();
  const wing = b === null ? 0 : (dtt < .9 ? 0 : eio((dtt - .9) / .55));
  drawOwl(c, 298, 296, wing, (t % 4.2) > 4.05);
  const ok = b !== null && BR[b] === best;
  let line = k.hold, a = 1;
  if (b !== null) { a = clamp((dtt - 1.3) / .4, 0, 1); line = ok ? k.feel[BR[b]] : k.wrongLine(Array.isArray(k.adj[BR[b]]) ? k.adj[BR[b]][SHAPES[id].gen] : k.adj[BR[b]], k.shapes[id].toLowerCase()); }
  if (b === null || a > 0) {
    c.save(); c.globalAlpha = b === null ? 1 : a; c.font = FONT(14);
    const lines = wrapText(c, line, 168), bh = lines.length * 18 + 16, by = 360 - bh;
    c.fillStyle = 'rgba(12,14,24,.86)'; rr(c, 12, by, 196, bh, 14); c.fill();
    c.beginPath(); c.moveTo(208, by + bh - 28); c.lineTo(236, by + bh - 20); c.lineTo(208, by + bh - 10); c.closePath(); c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle'; lines.forEach((ln, i) => c.fillText(ln, 22, by + 17 + i * 18)); c.restore();
  }
  if (b !== null && !ok && dtt > 1.2) {
    const a2 = clamp((dtt - 1.2) / .5, 0, 1);
    c.save(); c.globalAlpha = a2; c.fillStyle = 'rgba(12,14,24,.72)'; rr(c, 252, 6, 102, 128, 14); c.fill();
    c.strokeStyle = '#3ddc97'; c.lineWidth = 2; rr(c, 252, 6, 102, 128, 14); c.stroke();
    c.save(); c.translate(303, 62); c.scale(.4, .4); drawShape(c, id, best, 1); c.restore();
    c.restore();
    c.save(); c.globalAlpha = a2; pill(c, `★ ${k.brushes[best]}`, 303, 120, 13, .9); c.restore();
  }
}
function drawSort(c, e, t) {
  deskBG(c, e);
  const k = T[lang].sort, id = S.swOrder[Math.min(S.swI, 7)], over = S.swOver, SZ = 160, X0 = 100, Y0 = 24;
  // baskets
  const basket = (bx, label, icon, pile) => {
    c.save();
    c.fillStyle = 'rgba(30,16,4,.28)'; c.beginPath(); c.ellipse(bx + 75, 352, 76, 9, 0, 0, Math.PI * 2); c.fill();
    const g = c.createLinearGradient(bx, 276, bx + 150, 346); g.addColorStop(0, '#d9a868'); g.addColorStop(1, '#9a6a34');
    c.fillStyle = g; c.beginPath(); c.moveTo(bx, 272); c.lineTo(bx + 150, 272); c.lineTo(bx + 132, 346); c.lineTo(bx + 18, 346); c.closePath(); c.fill();
    c.save(); c.clip(); c.strokeStyle = 'rgba(80,45,15,.35)'; c.lineWidth = 2;
    for (let i = -8; i < 20; i++) { c.beginPath(); c.moveTo(bx + i * 12, 268); c.lineTo(bx + i * 12 + 40, 350); c.stroke(); c.beginPath(); c.moveTo(bx + i * 12 + 40, 268); c.lineTo(bx + i * 12, 350); c.stroke(); }
    c.restore();
    c.strokeStyle = '#6b431c'; c.lineWidth = 2; c.beginPath(); c.moveTo(bx, 272); c.lineTo(bx + 18, 346); c.lineTo(bx + 132, 346); c.lineTo(bx + 150, 272); c.stroke();
    c.fillStyle = '#c28a4a'; rr(c, bx - 4, 264, 158, 14, 7); c.fill(); c.strokeStyle = '#6b431c'; c.stroke();
    c.restore();
    pile.forEach((p, i) => {
      const slot = i % 4, rowI = Math.floor(i / 4), tx = bx + 24 + slot * 34, ty = 252 - rowI * 14, a = eout((now() - p.t0) / .6);
      const sx = lerp(180, tx, a), sy = lerp(104, ty, a), sz = lerp(SZ, 32, a);
      c.save(); c.translate(sx, sy); c.rotate((i % 3 - 1) * .08 * a);
      c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 5; c.shadowOffsetY = 2; c.fillStyle = '#fff'; c.fillRect(-sz / 2, -sz / 2, sz, sz); c.shadowColor = 'transparent';
      c.drawImage(swatchCanvas(p.id), -sz / 2, -sz / 2, sz, sz); c.restore();
    });
    pill(c, `${icon} ${label}`, bx + 75, 324, 13, .86);
  };
  basket(20, k.pat, '🔁', S.swPile.pattern);
  basket(190, k.tex, '🌫️', S.swPile.texture);
  if (over) { pill(c, `${S.swOk.filter(Boolean).length} / 8`, 180, 120, 26, .8); return; }
  // the swatch
  const sw = swatchCanvas(id), picked = S.swPick;
  c.save(); c.shadowColor = 'rgba(30,16,4,.5)'; c.shadowBlur = 16; c.shadowOffsetX = 4; c.shadowOffsetY = 7; c.fillStyle = '#fff'; rr(c, X0 - 5, Y0 - 5, SZ + 10, SZ + 10, 12); c.fill(); c.restore();
  c.save(); rr(c, X0, Y0, SZ, SZ, 8); c.clip(); c.drawImage(sw, X0, Y0, SZ, SZ); c.restore();
  c.strokeStyle = 'rgba(30,16,4,.45)'; c.lineWidth = 1.5; rr(c, X0, Y0, SZ, SZ, 8); c.stroke();
  pill(c, k.names[id], 180, 206, 14);
  if (!picked) return;
  // tile slide
  const [tx, ty, tw, th, ds] = SW_TILE[id], pat = SW_PATTERN[id], u = (now() - S.swT) % 3.4;
  let s = 0; if (u > .5 && u < 1.4) s = eio((u - .5) / .9); else if (u >= 1.4 && u < 2.5) s = 1; else if (u >= 2.5) s = 1 - eio((u - 2.5) / .8);
  const at = u >= 1.4 && u < 2.5, shake = !pat && at ? Math.sin((u - 1.4) * 40) * 2.5 : 0;
  const rx = X0 + tx * SZ, ry = Y0 + ty * SZ, rw = tw * SZ, rh = th * SZ, off = s * ds * SZ + shake;
  if (s > .001) {
    c.save(); c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 12; c.shadowOffsetX = 2; c.shadowOffsetY = 5; c.fillStyle = '#fff'; c.fillRect(rx + off, ry, rw, rh); c.restore();
    c.drawImage(sw, tx * 320, ty * 320, tw * 320, th * 320, rx + off, ry, rw, rh);
  }
  c.save(); c.lineWidth = 3; c.strokeStyle = '#ffd23f'; c.setLineDash([6, 4]); c.strokeRect(rx, ry, rw, rh); c.setLineDash([]);
  if (s > .001) { c.strokeStyle = at ? (pat ? '#3ddc97' : '#ff5c6c') : '#ffd23f'; c.lineWidth = 3.4; c.strokeRect(rx + off, ry, rw, rh); }
  c.restore();
  if (at) pill(c, pat ? `✓ ${k.fits}` : `✗ ${k.nofit}`, 180, Y0 + SZ - 16, 14, .9);
}
function drawDotsScene(c, e) {
  const g = c.createLinearGradient(0, e.y0, 0, e.y1); g.addColorStop(0, '#3b3446'); g.addColorStop(1, '#1f1b29');
  c.fillStyle = g; c.fillRect(e.x0, e.y0, e.x1 - e.x0, e.y1 - e.y0);
  const lg = c.createRadialGradient(180, 140, 20, 180, 140, 280); lg.addColorStop(0, 'rgba(255,230,170,.2)'); lg.addColorStop(1, 'rgba(255,230,170,0)');
  c.fillStyle = lg; c.fillRect(e.x0, e.y0, e.x1 - e.x0, e.y1 - e.y0);
  drawDots(c, S.z);
  const k = T[lang].dots;
  pill(c, S.z < .3 ? k.pn : S.z > .8 ? k.pf : k.pm, 180, 336, 15);
}

canvasLoop(cv, (c, w, h, dt, t) => {
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  VP = { s, ox, oy };
  const e = { x0: -ox / s, y0: -oy / s, x1: (w - ox) / s, y1: (h - oy) / s };
  c.save(); c.translate(ox, oy); c.scale(s, s);
  const m = S.sec || lab.view;
  if (m === 'rub') drawRub(c, RB, e, dt, false);
  else if (m === 'beast') drawRub(c, RBB, e, dt, true);
  else if (m === 'marks') drawMarks(c, e, t);
  else if (m === 'sort') drawSort(c, e, t);
  else drawDotsScene(c, e);
  c.restore();
});
render();
</script>
