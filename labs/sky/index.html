const clamp01 = (x) => Math.max(0, Math.min(1, x));
const ease = (t) => { t = clamp01(t); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };

const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); t = clamp01(t); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const rgba = (hex, a) => { const [r, g, b] = hexRgb(hex); return `rgba(${r},${g},${b},${clamp01(a)})`; };

// --- cloud sprites: baked once with soft puffs, a bright top and a grey underside ----------------------------
const D2 = 2;
function bake(w, h, fn) {
  const cv = document.createElement('canvas'); cv.width = w * D2; cv.height = h * D2;
  const x = cv.getContext('2d'); x.scale(D2, D2); fn(x, w, h); return cv;
}
const PAL = {
  light: { hi: '#FFFFFF', mid: C.white, lo: C.shade, under: mix(C.shade, C.storm, .2) },
  grey: { hi: mix(C.white, C.shade, .3), mid: mix(C.shade, C.white, .1), lo: mix(C.shade, C.storm, .45), under: mix(C.shade, C.storm, .6) },
  dark: { hi: mix(C.shade, C.storm, .45), mid: mix(C.shade, C.storm, .72), lo: C.storm, under: mix(C.storm, C.bg, .5) },
};
function puff(x, px, py, r, p) {
  const g = x.createRadialGradient(px - r * .32, py - r * .48, r * .08, px, py, r * 1.04);
  g.addColorStop(0, p.hi); g.addColorStop(.5, p.mid); g.addColorStop(1, p.lo);
  x.fillStyle = g; x.beginPath(); x.arc(px, py, Math.max(0, r), 0, Math.PI * 2); x.fill();
}
function underside(x, y0, y1, color, a) { // darken the lower part of whatever is already drawn
  x.save(); x.globalCompositeOperation = 'source-atop';
  const g = x.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, rgba(color, 0)); g.addColorStop(1, rgba(color, a));
  x.fillStyle = g; x.fillRect(0, 0, 4000, 4000); x.restore();
}

const cumulusSprite = (p) => bake(320, 170, (x) => { // flat base at y = 152
  x.save(); x.beginPath(); x.rect(0, 0, 320, 152); x.clip();
  for (const [px, py, r] of CUM) puff(x, px, py, r, p);
  x.restore(); underside(x, 100, 152, p.under, .55);
});
const stratusSprite = () => bake(900, 120, (x) => {

    const cx = 20 + i * 50 + (i % 3) * 8, cy = 60 + Math.sin(i * 1.9) * 12, rx = 95, ry = 24 + (i * 7 % 5) * 3;
    const g = x.createLinearGradient(0, cy - ry, 0, cy + ry); g.addColorStop(0, p.hi); g.addColorStop(.55, p.mid); g.addColorStop(1, p.lo);
    x.fillStyle = g; x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); x.fill();
  }
  x.strokeStyle = rgba(p.under, .25); x.lineWidth = 1.5;
  for (let i = 0; i < 9; i++) { const y = 40 + i * 8; x.beginPath(); x.moveTo(40 + (i * 53) % 200, y); x.lineTo(500 + (i * 97) % 350, y + Math.sin(i) * 3); x.stroke(); }
});
function wisp(x, x0, y0, len, rise, curl, wid, a) { // a thin brushed streak with a little hook at its end
  const N = 40, top = [], bot = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, px = x0 + len * t, py = y0 - rise * t + curl * t * t * t;
    const dx = len / N, dy = (-rise + 3 * curl * t * t) / N, n = Math.hypot(dx, dy) || 1;
    const wv = wid * Math.pow(Math.sin(Math.PI * Math.min(1, t * .92 + .04)), .8) * (1 - .35 * t) / 2;
    top.push([px - dy / n * wv, py + dx / n * wv]); bot.push([px + dy / n * wv, py - dx / n * wv]);
  }
  x.beginPath(); top.forEach(([X, Y], i) => (i ? x.lineTo(X, Y) : x.moveTo(X, Y))); bot.reverse().forEach(([X, Y]) => x.lineTo(X, Y)); x.closePath();
  x.save(); x.fillStyle = rgba('#FFFFFF', a); x.shadowColor = 'rgba(255,255,255,.9)'; x.shadowBlur = 5; x.fill(); x.restore();
}
const cirrusSprite = () => bake(440, 170, (x) => {

const WX = {

  cumulus: { cum: 1, str: 0, cir: 0, grey: 0, dark: 0, sun: 1, drz: 0, rain: 0, wind: .2, amb: .6 },

const cbTarget = (g) => ({ cum: 0, str: 0, cir: 0, grey: 0, dark: smooth(.04, .9, g), sun: 1 - smooth(.05, .55, g), drz: 0,

  const tg = isCb ? cbTarget(S.cbG) : WX[S.wx], r = isCb ? 4 : .8;

    for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5; c.beginPath(); c.moveTo(sx + Math.cos(a) * 25, sy + Math.sin(a) * 25); c.lineTo(sx + Math.cos(a) * 35, sy + Math.sin(a) * 35); c.stroke(); }
    g = c.createRadialGradient(sx - 5, sy - 5, 2, sx, sy, 20); g.addColorStop(0, '#FFFFFF'); g.addColorStop(.4, '#FFF2A8'); g.addColorStop(1, C.sun); c.fillStyle = g; c.beginPath(); c.arc(sx, sy, 20, 0, 7); c.fill();
  } else if (kind === 'cloudy') {
    hillShape(c, W, H, 96, 5, 2, mix(G.grass, C.storm, .45), mix(G.grassD, C.storm, .5));
    c.drawImage(SP.cum, 6, 26, 100, 59); c.drawImage(SP.cum, 58, 38, 96, 57);
  } else if (kind === 'rainy') {
    hillShape(c, W, H, 98, 4, 3, mix(G.grass, C.storm, .5), mix(G.grassD, C.storm, .55));
    c.drawImage(SP.cumGrey, 28, 2, 104, 62);
    c.strokeStyle = mix(C.sky, C.white, .35); c.lineWidth = 2.2;
    for (let i = 0; i < 10; i++) { const x = 38 + i * 9.4, y = 62 + (i % 3) * 8; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 4, y + 14); c.stroke(); }
    c.fillStyle = 'rgba(255,255,255,.3)'; c.beginPath(); c.ellipse(82, 104, 28, 4, 0, 0, 7); c.fill();
  } else if (kind === 'snowy') {
    hillShape(c, W, H, 92, 5, 1, '#FFFFFF', mix(C.white, C.sky, .35));
    c.drawImage(SP.cumGrey, 28, 2, 104, 62); pine(c, 26, 100, 1, true); pine(c, 134, 104, .8, true);
    c.strokeStyle = '#fff'; c.lineWidth = 1.6;
    for (const [x, y] of [[40, 70], [64, 82], [88, 68], [110, 80], [128, 66], [52, 94], [100, 96], [76, 100], [30, 82], [118, 94]]) {
      c.beginPath(); for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; c.moveTo(x - Math.cos(a) * 3.6, y - Math.sin(a) * 3.6); c.lineTo(x + Math.cos(a) * 3.6, y + Math.sin(a) * 3.6); } c.stroke();
    }
  } else if (kind === 'windy') {
    hillShape(c, W, H, 94, 4, 2, G.grass, G.grassD);
    c.strokeStyle = G.wood; c.lineWidth = 4; c.beginPath(); c.moveTo(126, 100); c.quadraticCurveTo(128, 82, 142, 70); c.stroke();
    const pp = { hi: '#A5DB8E', mid: '#6FB562', lo: '#3F8050' };
    for (const [px, py, r] of [[134, 66, 11], [148, 68, 10], [142, 58, 10]]) puff(c, px, py, r, pp);
    c.strokeStyle = '#fff'; c.lineWidth = 3.6; windLine(c, 12, 34, 70, 6); windLine(c, 34, 54, 80, 7); windLine(c, 8, 74, 56, 5);
    c.fillStyle = '#6FB562'; for (const [lx, ly, a] of [[100, 40, .6], [118, 58, -.5]]) { c.save(); c.translate(lx, ly); c.rotate(a); c.beginPath(); c.ellipse(0, 0, 6, 3, 0, 0, 7); c.fill(); c.restore(); }
  } else if (kind === 'foggy') {
    hillShape(c, W, H, 56, 6, 0, mix(C.shade, C.white, .4), mix(C.shade, C.white, .6));
    for (const [x, s] of [[34, .7], [122, .8], [92, .6]]) pine(c, x, 70, s, false);
    g = c.createLinearGradient(0, 44, 0, 78); g.addColorStop(0, 'rgba(247,249,252,0)'); g.addColorStop(.5, 'rgba(247,249,252,.8)'); g.addColorStop(1, 'rgba(247,249,252,0)'); c.fillStyle = g; c.fillRect(0, 44, W, 34);
    hillShape(c, W, H, 84, 5, 2, mix(G.grass, C.white, .55), mix(G.grassD, C.white, .5));
    pine(c, 60, 98, 1.2, false);
    g = c.createLinearGradient(0, 70, 0, 108); g.addColorStop(0, 'rgba(247,249,252,.15)'); g.addColorStop(.5, 'rgba(247,249,252,.75)'); g.addColorStop(1, 'rgba(247,249,252,.35)'); c.fillStyle = g; c.fillRect(0, 70, W, 42);
  } else {
    hillShape(c, W, H, 100, 4, 3, mix(G.grass, C.bg, .6), mix(G.grassD, C.bg, .7));
    c.drawImage(SP.cumDark, 24, 0, 112, 66);
    c.save(); c.shadowColor = C.sun; c.shadowBlur = 12; c.fillStyle = C.sun; c.strokeStyle = '#fff'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(86, 54); c.lineTo(70, 82); c.lineTo(81, 82); c.lineTo(72, 108); c.lineTo(100, 72); c.lineTo(88, 72); c.lineTo(96, 54); c.closePath(); c.fill(); c.stroke(); c.restore();
    c.strokeStyle = 'rgba(210,225,245,.6)'; c.lineWidth = 2; for (const x of [34, 50, 118, 132]) { c.beginPath(); c.moveTo(x, 64); c.lineTo(x - 4, 78); c.stroke(); }
  }
  c.restore();
}

// --- the loop and the input ---------------------------------------------------------------------------------
const cv = $('cv');
const loop = canvasLoop(cv, (c, w, h, dt, time) => {
  c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'town') (S.sec === 'count' ? drawCount : S.sec === 'ice' ? drawIce : drawTown)(c, w, h, dt, time);
  else if (v === 'clouds') drawColumn(c, w, h, dt, time);
  else if (S.wPhase === 'q') drawFog(c, w, h, dt, time);
  else drawAmbient(c, w, h, dt, time);
});
const pt = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
const hitToken = (p) => { const { w, h } = loop.size(); return tokenRects(w, h).find((r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h); };
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'town' || !S.free || S.sec) return;
  const p = pt(ev), r = hitToken(p); if (!r) return;
  S.drag = { key: r.key, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false };
  try { cv.setPointerCapture(ev.pointerId); } catch { /* the drag still works without capture */ }
  sfx.tick();
});
cv.addEventListener('pointermove', (ev) => {
  const p = pt(ev);
  if (S.drag) { S.drag.x = p.x; S.drag.y = p.y; if (Math.hypot(p.x - S.drag.sx, p.y - S.drag.sy) > 8) S.drag.moved = true; }
  else if (lab.view === 'town' && S.sec === 'ice') { const { w, h } = loop.size(); S.ptr = { x: clamp(p.x / w, 0, 1), y: clamp(p.y / h, 0, 1) }; }
  else cv.style.cursor = lab.view === 'town' && S.free && !S.sec && hitToken(p) ? 'grab' : '';
});
cv.addEventListener('pointerup', () => {
  const d = S.drag; if (!d) return; S.drag = null;
  const { w, h } = loop.size();
  placeCloud(d.key, d.moved && d.y < h - SHELF_H ? clamp(d.x / w, .22, .78) : null); // a tap sends the cloud up where it likes
});
cv.addEventListener('pointercancel', () => { S.drag = null; });

// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function placeCloud(key, xf) {
  S.wx = WK[key];
  if (xf !== null && (key === 'cumulus' || key === 'cumulonimbus')) S.xs[key] = xf;
  if (key === 'cumulonimbus') S.nextFlash = now() + 3.4;
  sfx.snap(); render();
}
function answerTown(i) {
  if (S.tAns !== null) return;
  S.tAns = i; S.wx = 'cb'; S.nextFlash = now() + 3.3;
  (i === 1 ? sfx.good : sfx.bad)();
  setTimeout(() => { S.free = true; render(); }, 4300); // the tower needs about four seconds to grow
  render(); showStage();
}
function toggleSec(k) {
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === k ? null : k;
  if (S.sec === 'count') S.cn = { t0: null, boomAt: -1, boomed: false, bolt: null };
  if (S.sec === 'ice') S.iceT = 0;
  sfx.click(); render(); if (S.sec) showStage();
}
function pickCloud(j) {
  if (S.cPick !== null || S.ci >= 4) return;
  const ok = ROPTS[S.ci][j] === ROUNDS[S.ci];
  S.cPick = j; S.cRight[S.ci] = ok; (ok ? sfx.good : sfx.bad)(); render(); showStage();
}
function pickFog(j) { if (S.wAns !== null) return; S.wAns = j; (j === 1 ? sfx.good : sfx.bad)(); render(); showStage(); }
function pickWeather(i) {
  if (S.wPhase !== 'match' || S.mPick !== null) return;
  const ok = i === SCENE_ANS[S.mi]; S.mPick = i; S.wRight[S.mi] = ok; (ok ? sfx.good : sfx.bad)(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'tq') answerTown(i);
  else if (a === 'sec') toggleSec(b.dataset.k);
  else if (a === 'flash') fireFlash();
  else if (a === 'cq') pickCloud(i);
  else if (a === 'cnext') { sfx.click(); S.ci++; S.cPick = null; S.cT = 0; S.cRev = 0; render(); }
  else if (a === 'cagain') { sfx.click(); S.ci = 0; S.cPick = null; S.cT = 0; S.cRev = 0; S.cRight = []; render(); }
  else if (a === 'wq') pickFog(i);
  else if (a === 'wnext') {
    sfx.click();
    if (S.wPhase === 'q') { S.wPhase = 'match'; S.mi = 0; S.mPick = null; }
    else if (S.mi < 5) { S.mi++; S.mPick = null; } else S.wPhase = 'end';
    render();
  } else if (a === 'wagain') { sfx.click(); Object.assign(S, { wPhase: 'q', wAns: null, fogT: 0, mi: 0, mPick: null, wRight: [] }); render(); }
});
$('ctrlBody').addEventListener('input', (ev) => { // the slider keeps its place: only the readout is redrawn
  if (ev.target.id !== 'delay') return;
  S.delay = +ev.target.value; S.cn = { t0: null, boomAt: -1, boomed: false, bolt: null }; info();
});
boardEl.addEventListener('click', (ev) => { const b = ev.target.closest('[data-wi]'); if (b && !b.disabled) pickWeather(+b.dataset.wi); });

// --- one render per change: controls, the picture cards, the readout and the state card ------------------------
const qBlock = (q, opts, act, pick, right) => `<p class="sk-q">${esc(q)}</p><div class="sk-opts">${opts.map((o, i) => {
  const cls = pick === null ? '' : i === right ? ' good' : i === pick ? ' bad' : ' dim';
  return `<button class="sk-b${cls}" data-act="${act}" data-i="${i}"${pick === null ? '' : ' disabled'}>${esc(o)}</button>`;
}).join('')}</div>`;
const verdict = (ok, text, t) => `<div class="sk-vd"><div class="sk-vt ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.wrong)}</div><p>${esc(text)}</p></div>`;
const btn = (act, label) => `<div class="row2"><button class="btn" data-act="${act}">${esc(label)}</button></div>`;
const stCard = (a, i) => ({ emo: a[i][0], title: a[i][1], lead: a[i][2], body: '' });

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v === 'town') bodyTown(t); else if (v === 'clouds') bodyClouds(t); else bodyWeather(t);
  renderBoard(t); info();
}
function bodyTown(t) {
  let html;
  if (S.tAns === null) html = qBlock(t.t.q, t.t.o, 'tq', null, 1);
  else {
    html = verdict(S.tAns === 1, t.t.r, t);
    if (S.free) {
      const un = secret.unlocked();
      const chip = (k, emo) => `<button class="chip secret ${un ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${un ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
      if (!S.sec) html += `<p class="sk-hint">${esc(t.t.drag)}</p>`;
      if (S.sec === 'count') html += `<div class="row2"><input type="range" class="big" id="delay" min="3" max="15" step="1" value="${S.delay}" aria-label="${esc(t.secLbl)}"></div>
        <div class="ends"><span>${esc(t.sec.sec(3))}</span><span>${esc(t.sec.sec(15))}</span></div>
        <div class="row2" style="margin-top:0"><button class="btn" data-act="flash">${esc(t.flash)}</button></div>`;
      html += `<div class="row2"><div class="chips">${chip('count', '⚡')}${chip('ice', '❄️')}</div></div>`;
    }
  }
  $('ctrlBody').innerHTML = html;
}
function bodyClouds(t) {
  const end = S.ci >= 4;
  if (end) { $('ctrlBody').innerHTML = btn('cagain', t.again); return; }
  const key = ROUNDS[S.ci], opts = ROPTS[S.ci], right = opts.indexOf(key);
  let html = qBlock(t.c.q, opts.map((k) => t.cloud[k]), 'cq', S.cPick, right);
  if (S.cPick !== null) html += `<div style="margin-top:12px">${verdict(S.cPick === right, t.c.why[S.ci], t)}</div>${btn('cnext', t.next)}`;
  $('ctrlBody').innerHTML = html;
}
function bodyWeather(t) {
  let html = '';
  if (S.wPhase === 'q') {
    html = qBlock(t.w.q, t.w.o, 'wq', S.wAns, 1);
    if (S.wAns !== null) html += `<div style="margin-top:12px">${verdict(S.wAns === 1, t.w.r, t)}</div>${btn('wnext', t.next)}`;
  } else if (S.wPhase === 'match') {
    if (S.mPick !== null) html = verdict(S.mPick === SCENE_ANS[S.mi], t.w.why[S.mi], t) + btn('wnext', t.next);
  } else html = btn('wagain', t.again);
  $('ctrlBody').innerHTML = html;
}
function renderBoard(t) {
  const show = lab.view === 'weather' && S.wPhase !== 'q';
  boardEl.style.display = show ? '' : 'none';
  if (!show) return;
  const key = `${lang}:${S.wPhase === 'end' ? 'end' : 'match'}`;
  if (boardEl.dataset.key !== key) {
    boardEl.dataset.key = key;
    boardEl.innerHTML = `${S.wPhase === 'end' ? '' : '<div class="sk-desc card" id="skDesc"></div>'}<div class="sk-grid">${t.w.kinds.map((k, i) =>
      `<button class="sk-card" data-wi="${i}"><canvas width="160" height="112"></canvas><span>${esc(k)}</span></button>`).join('')}</div>`;
    boardEl.querySelectorAll('canvas').forEach((q, i) => wxIcon(q.getContext('2d'), WKINDS[i], 160, 112));
  }
  const desc = $('skDesc'); if (desc) desc.textContent = t.w.scenes[S.mi];
  const right = SCENE_ANS[S.mi];
  boardEl.querySelectorAll('.sk-card').forEach((b, i) => {
    const pick = S.wPhase === 'match' ? S.mPick : null;
    b.className = 'sk-card' + (pick === null ? '' : i === right ? ' good' : i === pick ? ' bad' : ' dim');
    b.disabled = S.wPhase === 'end' || pick !== null;
  });
}
function info() {
  const t = T[lang], v = lab.view;
  if (v === 'town') {
    lab.setGlow('rgba(110, 170, 235, .28)');
    if (S.tAns === null) { lab.setReadout('?', '', '', '#6FB0E8'); lab.setState(stCard(t.st.town, 0)); return; }
    if (S.free && S.sec === 'count') {
      lab.setReadout(esc(t.sec.km(fmtNum(Math.round(S.delay / 3 * 10) / 10))), `${t.sec.sec(S.delay)} ÷ 3`, '', '#FFD84A');
      lab.setState({ emo: '⚡', title: t.secrets.count[0], lead: t.secrets.count[1], body: t.sec.countText }); return;
    }
    if (S.free && S.sec === 'ice') {
      lab.setReadout(`${minus(-40)} °C`, `9 ${t.kmU}`, '', '#8CC8F5');
      lab.setState({ emo: '❄️', title: t.secrets.ice[0], lead: t.secrets.ice[1], body: t.sec.iceText }); return;
    }
    const key = { cb: 'cumulonimbus', cumulus: 'cumulus', stratus: 'stratus', cirrus: 'cirrus' }[S.wx] ?? 'cumulonimbus';
    lab.setReadout(esc(shortName(key)), t.brings[key], '', '#6FB0E8'); lab.setState(stCard(t.st.town, 1));
  } else if (v === 'clouds') {
    lab.setGlow('rgba(140, 150, 220, .26)');
    const done = S.ci >= 4 || (S.ci === 3 && S.cPick !== null);
    if (S.ci >= 4) lab.setReadout(`${S.cRight.filter(Boolean).length}/4`, '', '', '#8E9DD8');
    else if (S.cPick === null) lab.setReadout('?', `${S.ci + 1}/4`, '', '#8E9DD8');
    else { const key = ROUNDS[S.ci], [lo, hi] = RANGE[key]; lab.setReadout(esc(shortName(key)), `${lo}–${hi} ${t.kmU}`, '', '#8E9DD8'); }
    lab.setState(stCard(t.st.clouds, done ? 1 : 0));
  } else {
    lab.setGlow('rgba(232, 184, 74, .22)');
    const done = S.wPhase === 'end' || (S.wPhase === 'match' && S.mi === 5 && S.mPick !== null);
    if (S.wPhase === 'q') lab.setReadout(S.wAns === null ? '?' : esc(t.w.kinds[5]), '', '', '#E8B84A');
    else if (S.wPhase === 'match') lab.setReadout(S.mPick === null ? '?' : esc(t.w.kinds[SCENE_ANS[S.mi]]), `${S.mi + 1} / 6`, '', '#E8B84A');
    else lab.setReadout(`${S.wRight.filter(Boolean).length}/6`, '', '', '#E8B84A');
    lab.setState(stCard(t.st.weather, done ? 1 : 0));
  }
}
render();
</script>
</body>
</html>
