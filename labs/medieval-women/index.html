function tag(c, text, x, y, W, size = 12, fg = '#fff', bg = 'rgba(12,14,26,.84)') {
  let s = size, tw;
  do { c.font = `800 ${s}px Nunito, sans-serif`; tw = c.measureText(text).width + 14; s--; } while (tw > W - 12 && s > 10);
  const hh = s + 12, X = clamp(x - tw / 2, 6, Math.max(6, W - tw - 6));
  c.fillStyle = bg; c.beginPath(); c.roundRect(X, y - hh / 2, tw, hh, hh / 2); c.fill();
  c.fillStyle = fg; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(text, X + 7, y + 1);
}
function wrap(c, text, maxW) {
  const words = String(text).split(' '), out = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (c.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur);
  return out;
}

function pickHouse(job, i) {
  if (S.j === null || S.jm[job]) return;
  if (S.jsel < 0) { S.jmsg = 'noCard'; S.jshake[i] = now(); sfx.tick(); }
  else if (S.jsel === job) { S.jm[job] = true; S.jlast = job; S.jsel = -1; S.jmsg = ''; sfx.good(); }
  else { S.jmsg = 'wrong:' + S.jsel; S.jshake[i] = now(); sfx.bad(); }
}
function tryName() {
  if (S.nsel < 0 || S.ndeed < 0) return;
  if (S.nsel === S.ndeed) { S.nm[S.nsel] = true; S.nlast = [S.nsel, ...S.nlast]; S.npop[S.nsel] = now(); S.nmsg = false; sfx.good(); }
  else { S.nshake[S.nsel] = now(); S.nwrong++; S.nmsg = true; sfx.bad(); }
  S.nsel = -1; S.ndeed = -1;
}
function onHit(q) {
  if (q.k === 'wom') { if (S.d === null) return; pickWoman(q.i); }
  else if (q.k === 'bld') pickHouse(q.job, q.i);
  else if (q.k === 'per') { if (S.nm[q.i] || S.sec) return; S.nsel = S.nsel === q.i ? -1 : q.i; S.nmsg = false; sfx.click(); tryName(); }
  else if (q.k === 'scene') {
    if (S.sec === 'chant') { S.chantAt = now(); S.soundMsg = !sing(); sfx.tick(); }
    else if (S.sec === 'desk') { S.deskN = S.deskN >= DESK_LINES ? 1 : S.deskN + 1; S.deskAt = now(); sfx.snap(); }
  }
  render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'dpick') { S.d = i; S.sel = 2; S.seen[2] = true; S.fresh = true; (i === T[lang].day.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'wom') pickWoman(i);
  else if (act === 'jpick') { S.j = i; (i === T[lang].jobs.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'card') { S.jsel = S.jsel === i ? -1 : i; S.jmsg = ''; sfx.click(); }
  else if (act === 'deed') { if (S.nm[i]) return; S.ndeed = S.ndeed === i ? -1 : i; S.nmsg = false; sfx.click(); tryName(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
    if (S.sec === 'chant') { S.chantAt = now(); S.soundMsg = !sing(); }
    if (S.sec === 'desk' && !S.deskN) { S.deskN = 1; S.deskAt = now(); }
    showStage();
  }
  render();
});

// --- one render per change: controls, readout, state card, facts -----------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v === 'day') renderDay(t); else if (v === 'jobs') renderJobs(t); else renderNames(t);
  lab.checkStage?.();
}
const question = (q, opts, act) => `<p class="mw-q">${esc(q)}</p><div class="mw-opts">${opts.map((o, i) => `<button class="mw-b" data-act="${act}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;

function renderDay(t) {
  const d = t.day; lab.setGlow('rgba(240, 170, 110, .26)');
  if (S.d === null) {
    $('ctrlBody').innerHTML = question(d.q, d.opts, 'dpick');
    lab.setReadout('?', d.preSub, '', '#e0b050');
    lab.setState({ emo: '🏰', title: d.preTitle, lead: d.preLead, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    lab.setFacts([]); return;
  }
  const n = S.seen.filter(Boolean).length, sel = S.sel, w = d.women[sel];
  $('ctrlBody').innerHTML = `<p class="mw-note">${esc(d.hint)}</p><div class="mw-row">${d.roles.map((r, i) => `<button class="mw-b chipb${sel === i ? ' sel' : ''}${S.seen[i] ? ' done' : ''}" data-act="wom" data-i="${i}">${S.seen[i] ? '✓ ' : ''}${esc(r)}</button>`).join('')}</div>`;
  lab.setReadout(`${n}/4`, d.met, d.roles[sel], '#e0b050');
  const ok = S.d === d.ok;
  if (S.fresh) lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? d.right : d.wrong, lead: d.afterLead, body: d.women[2].body, extra: `<div class="fine">${esc(d.hours)}</div>` });
  else lab.setState({ emo: w.emo, title: w.title, lead: w.lead, body: w.body, extra: `<div class="fine">${esc(d.hours)} ${esc(t.fine)}</div>` });
  lab.setFacts(d.facts);
}

function renderJobs(t) {
  const j = t.jobs; lab.setGlow('rgba(142, 195, 234, .26)');
  if (S.j === null) {
    $('ctrlBody').innerHTML = question(j.q, j.opts, 'jpick');
    lab.setReadout('?', j.preSub, '', '#8ec3ea');
    lab.setState({ emo: '🚪', title: j.preTitle, lead: j.preLead, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
    lab.setFacts([]); return;
  }
  const n = S.jm.filter(Boolean).length, all = n === 5, ok = S.j === j.ok;
  $('ctrlBody').innerHTML = `<p class="mw-note">${esc(j.hint)}</p><div class="mw-row">${j.jobs.map((x, i) => `<button class="mw-b chipb${S.jsel === i ? ' sel' : ''}${S.jm[i] ? ' done' : ''}" data-act="card" data-i="${i}"${S.jm[i] ? ' disabled' : ''}>${esc(x.name)}</button>`).join('')}</div>`;
  lab.setReadout(`${n}/5`, j.found, '', '#8ec3ea');
  const jl = S.jlast;
  if (S.jmsg === 'noCard') lab.setState({ emo: '👆', title: j.noCard, lead: j.hint, body: '', extra: '' });
  else if (S.jmsg.startsWith('wrong:')) lab.setState({ emo: '🤔', title: j.wrong, lead: j.wrongTap(j.jobs[+S.jmsg.slice(6)].name.toLowerCase()), body: '', extra: '' });
  else if (all) lab.setState({ emo: '🏆', title: j.doneTitle, lead: j.doneLead, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  else if (jl >= 0) lab.setState({ emo: j.jobs[jl].emo, title: j.jobs[jl].name, lead: j.jobs[jl].lead, body: j.jobs[jl].body, extra: '' });
  else lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? j.right : j.wrong, lead: j.reveal, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  lab.setFacts(jl < 0 && !S.jmsg ? j.facts : [{ emo: '📜', text: j.reveal, src: SRC.guild }, ...j.facts]);
}

function renderNames(t) {
  const nm = t.names, s = t.sec, n = S.nm.filter(Boolean).length, all = n === 6; lab.setGlow('rgba(160, 120, 220, .26)');
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}" style="min-height:38px">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('ctrlBody').innerHTML = `<p class="mw-note">${esc(nm.hint)}</p><div class="mw-opts">${DEED_ORDER.map((i) => `<button class="mw-b${S.ndeed === i ? ' sel' : ''}${S.nm[i] ? ' done' : ''}" data-act="deed" data-i="${i}"${S.nm[i] ? ' disabled' : ''}>${S.nm[i] ? '✓ ' : ''}${esc(nm.people[i].deed)}</button>`).join('')}</div>
    <div class="mw-row mw-sec">${sc('chant', '🎶')}${sc('desk', '✒️')}</div>`;
  lab.setReadout(`${n}/6`, nm.met, '', '#a078dc');
  const last = S.nlast[0];
  if (S.sec === 'chant') lab.setState({ emo: '🎶', title: s.chantTitle, lead: s.chantLead, body: s.chantBody, extra: `<div class="fine">${S.soundMsg ? esc(s.soundOff) : esc(t.fine)}</div>` });
  else if (S.sec === 'desk') lab.setState({ emo: '✒️', title: s.deskTitle, lead: s.deskLead, body: s.deskBody, extra: `<div class="fine">${esc(t.fine)}</div>` });
  else if (S.nmsg) lab.setState({ emo: '🤔', title: nm.wrong, lead: nm.wrongLead, body: '', extra: '' });
  else if (all) lab.setState({ emo: '🏆', title: nm.doneTitle, lead: nm.doneLead, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  else if (last !== undefined) lab.setState({ emo: '✅', title: nm.right, lead: `${nm.people[last].name}: ${nm.people[last].deed}.`, body: '', extra: '' });
  else lab.setState({ emo: '📜', title: nm.startTitle, lead: nm.startLead, body: '', extra: `<div class="fine">${esc(t.fine)}</div>` });
  const srcs = ['hild', 'elea', 'chri', 'joan', 'eliz', 'anne'];
  if (S.sec) lab.setFacts([{ emo: S.sec === 'chant' ? '🎶' : '✒️', text: S.sec === 'chant' ? s.chantLead : s.deskLead, src: S.sec === 'chant' ? s.srcChant : s.srcDesk }]);
  else lab.setFacts(S.nlast.map((i) => ({ emo: '📜', text: nm.people[i].line, src: SRC[srcs[i]] })));
}
render();
</script>
