  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k, v = lab.view, o = v === 'make' ? S.mk : S.sh;

  else if (a === 'main') {

  } else if (a === 'sec') {

  else {
    const s = sd.signs[i], rule = `${t.names[s.n]}: ${t.rule[s.f]}`, m = fd.msg;
    if (stArr[i] === 1 && s.bad) o = { emo: '🎨', title: t.fd.foundT, lead: t.fd.foundL(t.cols[FAM[s.f].col].toLowerCase()), body: rule };
    else if (stArr[i] === 1) o = { emo: '✅', title: t.fd.right, lead: rule };
    else if (stArr[i] === 2) o = { emo: '💡', title: t.fd.shown, lead: s.bad ? t.fd.foundL(t.cols[FAM[s.f].col].toLowerCase()) : rule, body: s.bad ? rule : '' };
    else if (m === 'miss' || m === 'missBad' || m === 'missGood') o = { emo: '🤔', title: t.fd.miss, lead: t.fd.hint[m] };
    else o = { emo: '🤔', title: t.fd.askSel, lead: t.fd.lead };
    if (all) o = { ...o, extra: done };
  }
  st(o);
}
function renderMake(t) {
  const mk = S.mk, end = mk.ti >= 3, task = MAKE[Math.min(mk.ti, 2)], fm = FAM[task.f];
  const btn = end ? t.again : mk.checked ? t.next : t.check;
  $('secMake').innerHTML = `${end ? '' : pickers(t, mk, mk.checked)}
    <div class="ss-row"><button type="button" class="btn" data-act="main"${!end && !mk.checked && !(mk.shape && mk.col) ? ' disabled' : ''}>${esc(btn)}</button></div>`;
  lab.setGlow('rgba(240, 190, 110, .24)'); lab.setFacts(t.facts.make);
  const k = mk.right.filter(Boolean).length;
  if (end) {
    lab.setReadout(`${k}/3`, t.mk.sub, '', '#f0be6e');
    st({ emo: '🏫', title: t.mk.end(k), lead: t.mk.endLead, body: t.mk.endBody, extra: ruleCard(t) }); return;
  }
  lab.setReadout(`${mk.ti + (mk.checked ? 1 : 0)}/3`, t.mk.sub, mk.checked ? t.fam[task.f] : '', '#f0be6e');
  if (!mk.checked) st({ emo: '✏️', title: t.mk.head(t.tasks[task.n]), lead: t.mk.lead, extra: ruleCard(t) });
  else if (mk.right[mk.ti]) st({ emo: '✅', title: t.sh.right, lead: `${t.tasks[task.n]}: ${t.rule[task.f]}`, body: t.mk.hang, extra: ruleCard(t) });
  else st({ emo: '🤔', title: t.sh.miss, lead: checkMsg(t, mk, fm), body: `${t.tasks[task.n]}: ${t.rule[task.f]}`, extra: ruleCard(t) });
}
render();
</script>
