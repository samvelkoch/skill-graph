  if (lab.view !== 'dry') return;
  const [x, y, w, h] = pt(e);
  if (dryInput(x, y, w, h)) { try { cv.setPointerCapture(e.pointerId); } catch { /* no capture */ } sfx.tick(); }
});
cv.addEventListener('pointermove', (e) => { if (drag) { const [x, , w, h] = pt(e); dryMove(x, w, h); } });
const endDrag = () => { if (drag) { drag = null; render(); } };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

function render() {
  const t = T[lang], v = lab.view;
  $('flDry').hidden = v !== 'dry'; $('flEggs').hidden = v !== 'eggs'; $('flPlaces').hidden = v !== 'places';
  const open = secret.unlocked();
  const sc = (k, emo, on) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  setHTML($('flSec'), `${lang}|${open}|${S.d.skin}|${S.e.axo}`, sc('skin', '🫁', S.d.skin) + sc('axo', '🦎', S.e.axo));
  if (v === 'dry') renderDry(t); else if (v === 'eggs') renderEggs(t); else renderPlaces(t);
}
function renderDry(t) {
  const d = S.d, td = t.d;
  lab.setGlow('rgba(95, 168, 110, .24)');
  setHTML($('dPick'), `${lang}|${d.revealed}|${d.pick}`, d.revealed
    ? `<div class="fl-verdict" style="color:${d.pick === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(d.pick === 1 ? td.ok : td.no)}</div><p class="fl-vt">${esc(td.why)}</p>`
    : `<p class="fl-q">${esc(td.q)}</p><div class="fl-opts">${[0, 1, 2].map((k) => `<button class="fl-opt" data-act="dpick" data-k="${k}">${miniSvg(k)}<span>${esc(td.shapes[k])}</span></button>`).join('')}</div><div class="fl-fine">${esc(td.drag)}</div>`);
  $('dHl').textContent = td.hum; $('dTl').textContent = td.tmp; $('dHv').textContent = `${d.H}%`; $('dTv').textContent = `${d.Tc}°C`;
  if (+$('dH').value !== d.H) $('dH').value = d.H; if (+$('dT').value !== d.Tc) $('dT').value = d.Tc;
  $('dBtns').hidden = !d.revealed;
  $('dRun').textContent = d.run ? td.pause : d.done ? td.again : td.run;
  $('dAgain').textContent = td.again; $('dAgain').hidden = !(d.t > 0 && !d.done);
  const f = Math.round(d.wf), l = Math.round(d.wl);
  let st, facts = [];
  if (!d.revealed) {
    lab.setReadout('0 ' + t.e.hunit, t.modelNote, '', '#7fd36a');
    st = d.skin ? { emo: '🫁', title: td.skin[0], lead: td.skin[1], body: '' } : { emo: '🤔', title: td.pre[0], lead: td.pre[1], body: t.terms };
  } else {
    const back = d.turns.length > 0;
    lab.setReadout(`${nf(d.t, 1)} ${t.e.hunit}`, `🐸 ${f}% · 🦎 ${l}%`, d.mode === 'home' ? '↩ ' + td.back : d.mode === 'rest' ? '💧' : '', '#7fd36a');
    if (d.skin) st = { emo: '🫁', title: td.skin[0], lead: td.skin[1], body: td.skin[2] };
    else if (back) st = { emo: '🐸', title: td.back_[0], lead: td.back_[1](nf(d.turns[0], 1)), body: td.back_[2](Math.round(100 - d.wl)) };
    else if (d.done) st = { emo: '🌡️', title: td.end[0], lead: td.end[1](f, l), body: td.end[2] };
    else st = { emo: '🌡️', title: td.run_[0], lead: td.run_[1](f, l), body: td.run_[2] };
    if (!d.run) facts = d.skin ? [{ emo: '🫁', text: t.facts.skin, src: SRC.frog }, { emo: '🐸', text: t.facts.bornean, src: SRC.frog }] : [{ emo: '💧', text: t.facts.mucus, src: SRC.frog }];
  }
  lab.setState({ ...st, extra: '' }); lab.setFacts(facts);
}
function renderEggs(t) {
  const e = S.e, te = t.e;
  lab.setGlow('rgba(224, 176, 80, .22)');
  setHTML($('eSub'), lang, te.sub.map((s, i) => `<button data-act="esub" data-k="${i ? 'life' : 'egg'}" data-i="${i}">${esc(s)}</button>`).join(''));
  $('eSub').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.k === e.sub));
  $('eEgg').hidden = e.sub !== 'egg'; $('eLife').hidden = e.sub !== 'life';
  let st, facts = [];
  if (e.sub === 'egg') {
    setHTML($('ePick'), `${lang}|${e.rev}|${e.pick}`, e.rev
      ? `<div class="fl-verdict" style="color:${e.pick === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(e.pick === 1 ? te.ok : te.no)}</div><p class="fl-vt">${esc(te.why)}</p>`
      : `<p class="fl-q">${esc(te.q)}</p><div class="fl-opts four">${te.opts.map((o, k) => `<button class="fl-opt" data-act="epick" data-k="${k}">${esc(o)}</button>`).join('')}</div>`);
    $('eHl').textContent = te.time; $('eHv').textContent = `${nf(e.h, 0)} ${te.hunit}`;
    $('eHrs').closest('.fl-sl').hidden = !e.rev; $('eHrs').disabled = e.anim; if (+$('eHrs').value !== e.h) $('eHrs').value = e.h;
    if (!e.rev) { lab.setReadout(`0 ${te.hunit}`, te.onSand, '', '#e0b050'); st = { emo: '🤔', title: te.pre[0], lead: te.pre[1], body: te.pre[2] }; }
    else {
      const ws = Math.round(waterSpawn(e.h)), we = Math.round(waterEgg(e.h));
      lab.setReadout(`${nf(e.h, 0)} ${te.hunit}`, `${te.names[0]} ${ws}% · ${te.names[1]} ${we}%`, e.h >= 24 ? '✔' : '', '#e0b050');
      st = e.h >= 24 ? { emo: '🥚', title: te.end[0], lead: te.end[1], body: te.end[2] } : { emo: '☀️', title: te.mid[0], lead: te.mid[1](ws, we), body: te.mid[2] };
      if (!e.anim) facts = [{ emo: '🥚', text: t.facts.amnion, src: SRC.egg }, { emo: '🗑️', text: t.facts.allantois, src: SRC.egg }, { emo: '💧', text: t.facts.moist, src: SRC.egg }];
    }
  } else {
    $('eAl').textContent = te.age; const a = e.age, si = a < 0.12 ? 0 : a < 0.45 ? 1 : a < 0.8 ? 2 : 3;
    $('eAv').textContent = e.axo ? '' : te.stages[si]; if (+$('eAge').value !== Math.round(a * 100)) $('eAge').value = Math.round(a * 100);
    const g = e.axo ? 100 : Math.round(100 - clamp((a - 0.3) / 0.4, 0, 1) * 100), lu = Math.round(clamp((a - 0.25) / 0.45, 0, 1) * 100);
    if (e.axo) { lab.setReadout(te.axo[0], `${te.gills} 100%`, '', '#e86a7a'); st = { emo: '🦎', title: te.axo[0], lead: te.axo[1], body: te.axo[2] }; facts = [{ emo: '🦎', text: t.facts.axolotl, src: SRC.axolotl }]; }
    else {
      lab.setReadout(te.stages[si], `${te.gills} ${g}% · ${te.lungs} ${lu}%`, t.modelWord, '#79c8ff');
      st = { emo: ['🥚', '🐟', '🦵', '🐸'][si], title: te.st[si][0], lead: te.st[si][1], body: te.st[si][2] };
      facts = [{ emo: '🫧', text: t.facts.tadpole, src: SRC.frog }];
    }
  }
  lab.setState({ ...st, extra: '' }); lab.setFacts(facts);
}
function renderPlaces(t) {
  const p = S.p, tp = t.p, i = p.sel, got = p.picks[i];
  lab.setGlow('rgba(240, 150, 80, .22)');
  setHTML($('pTiles'), `${lang}|${i}|${p.picks.join(',')}`, tp.names.map((n, k) => `<button class="fl-tile ${k === i ? 'on' : ''}" data-act="ptile" data-k="${k}"><span>${tp.tab[k]}</span><span>${esc(n)}</span><span class="ck">${p.picks[k] === null ? '' : p.picks[k] === PLACE_ANS[k] ? '✓' : '·'}</span></button>`).join(''));
  setHTML($('pPick'), `${lang}|${i}|${got}`, got === null
    ? `<p class="fl-q">${esc(tp.q[i])}</p><div class="fl-opts">${tp.opts.map((o, k) => `<button class="fl-opt" data-act="ppick" data-k="${k}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="fl-verdict" style="color:${got === PLACE_ANS[i] ? 'var(--ok)' : 'var(--wip)'}">${esc(got === PLACE_ANS[i] ? tp.ok : tp.no)}</div><p class="fl-vt">${esc(tp.line[i])}</p>`);
  const done = p.picks.filter((x) => x !== null).length, right = p.picks.filter((x, k) => x === PLACE_ANS[k]).length;
  lab.setReadout(`${done}/4`, tp.sub, right ? `✓ ${right}` : '', '#f09650');
  let facts = [];
  if (got !== null) facts = [[], [{ emo: '🐸', text: t.facts.mucus, src: SRC.frog }], [{ emo: '🦎', text: t.facts.gecko1, src: SRC.gecko }, { emo: '🌙', text: t.facts.gecko2, src: SRC.gecko }, { emo: '🌫️', text: t.facts.rain, src: SRC.rain }], [{ emo: '🏜️', text: t.facts.whf1, src: SRC.whf }, { emo: '💧', text: t.facts.whf2, src: SRC.whf }]][i];
  lab.setState(got === null ? { emo: '🗺️', title: tp.names[i], lead: tp.q[i], body: tp.pre, extra: '' } : { emo: tp.tab[i], title: tp.names[i], lead: tp.line[i], body: '', extra: '' });
  lab.setFacts(facts);
}

canvasLoop($('cv'), (c, w, h, dt, tm) => {
  CW = w; stepDry(dt); stepEggs(dt);
  const v = lab.view;
  if (v === 'dry') drawDry(c, w, h, dt, tm); else if (v === 'eggs') drawEggs(c, w, h, dt, tm); else drawPlaces(c, w, h, dt, tm);
  const s = v === 'dry' ? `d|${S.d.run}|${S.d.t.toFixed(1)}|${S.d.mode}|${Math.round(S.d.wf)}` : v === 'eggs' ? `e|${S.e.anim}|${Math.round(S.e.h * 2)}` : 'p';
  if (s !== sig) { sig = s; render(); }
});
render();
</script>
