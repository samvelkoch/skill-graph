      c.strokeStyle = '#0a0c14'; c.lineWidth = 2; c.lineCap = 'round'; c.beginPath();
      if (ok) { c.moveTo(bx - 3, by); c.lineTo(bx - 1, by + 2.5); c.lineTo(bx + 3, by - 2.5); } else { c.moveTo(bx - 2.5, by - 2.5); c.lineTo(bx + 2.5, by + 2.5); c.moveTo(bx + 2.5, by - 2.5); c.lineTo(bx - 2.5, by + 2.5); }
      c.stroke();
    }
    const nx = g.col[1], ny = g.yT(TEMP.mercury.lo);
    drawPlanet(c, 'mercury', nx, ny, rr * .7); c.fillStyle = '#d3d9e8'; c.font = FONT(800, 12.5); c.fillText(`${t.night} ${fmtT(TEMP.mercury.lo)}`, g.labX, ny - 3);
    c.restore();
    pill(c, t.clouds, w / 2, h - 16, 6, w - 6);
  }
}

// view 3: clues
function drawClues(c, w, h, time) {
  const L = T[lang].clues, g = drawRow(c, w, time, { ringsOn: !!S.cres.rings, spot: S.spot,
    marks: (() => { const r = S.clue && S.cres[S.clue]; if (!r) return {}; const m = {}; for (const id of CLUES[S.clue]) m[id] = 'show'; if (!r.ok) m[r.pick] = 'bad'; return m; })() });
  const [X, Y, W, H] = windowRect(w, h, g), res = S.clue && S.cres[S.clue];
  spaceBg(c, X, Y, W, H, time);
  c.save(); c.beginPath(); c.roundRect(X, Y, W, H, 16); c.clip();
  const cx = X + W / 2, pn = T[lang].pn;
  if (!S.clue) pill(c, L.cvPick, cx, Y + H / 2, X + 6, X + W - 6);
  else if (!res) {
    const [em, txt] = L.list[S.clue]; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = FONT(500, 54); c.fillStyle = '#fff'; c.fillText(em, cx, Y + H * .34);
    c.font = FONT(800, 18); c.fillStyle = '#fff'; const lines = wrapText(c, txt, W - 40);
    lines.forEach((ln, i) => c.fillText(ln, cx, Y + H * .56 + i * 24)); c.font = FONT(700, 13); c.fillStyle = '#98A0B8'; c.fillText(L.askL, cx, Y + H * .56 + lines.length * 24 + 14);
  } else if (S.clue === 'rings') {
    ['jupiter', 'saturn', 'uranus', 'neptune'].forEach((id, i) => {
      const x = X + W * (i % 2 ? .75 : .25), y = Y + H * (i < 2 ? .3 : .68), r = Math.min(W * .11, H * .125);
      drawPlanet(c, id, x, y, r, { ringsOn: true, spot: S.spot, spotW: .234 });
      pill(c, pn[PM[id].i], x, i < 2 ? y - r * 1.2 - 12 : y + (id === 'uranus' ? r * 1.75 : r * 1.2) + 12, X + 4, X + W - 4);
    });
  } else if (S.clue === 'rust') {
    const r = Math.min(W * .2, H * .28), mx = X + W * .3, my = Y + H * .46, rr = Math.min(W * .17, H * .24), lx = X + W * .73, ly = Y + H * .46;
    drawPlanet(c, 'mars', mx, my, r); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(mx + r * .6, my - r * .5); c.lineTo(lx - rr * .8, ly - rr * .6); c.moveTo(mx + r * .6, my + r * .5); c.lineTo(lx - rr * .8, ly + rr * .6); c.stroke();
    drawGrains(c, lx, ly, rr); pill(c, L.c3.rust, lx, ly + rr + 18, X + 4, X + W - 4); pill(c, pn[3], mx, my + r + 18, X + 4, X + W - 4);
  } else if (S.clue === 'storm') {
    const r = Math.min(W * .34, H * .34), jx = X + W * .42, jy = Y + H * .47;
    drawPlanet(c, 'jupiter', jx, jy, r, { spot: true, spotW: .234 });
    const sx = jx + r * .2, sy = jy + r * .3; // Earth's radius 6,371 km against Jupiter's mean radius 69,886 km
    const ex = X + W * .86, ey = Y + H * .3; drawPlanet(c, 'earth', ex, ey, Math.max(2, r * 6371 / 69886));
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(sx + r * .08, sy + r * .06); c.lineTo(X + W * .8, Y + H * .86); c.stroke();
    pill(c, L.c3.spot, X + W * .66, Y + H * .86, X + 4, X + W - 4); pill(c, L.c3.earth, ex - 10, ey + 24, X + 4, X + W - 4);
  } else if (S.clue === 'side') {
    const r = Math.min(W * .2, H * .27), ux = X + W * .5, uy = Y + H * .46, ang = 97.77 * Math.PI / 180, dx = Math.sin(ang), dy = -Math.cos(ang);
    c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = 1.5; c.setLineDash([4, 5]); c.beginPath(); c.moveTo(ux, uy - r * 1.7); c.lineTo(ux, uy + r * 1.7); c.stroke();
    drawPlanet(c, 'uranus', ux, uy, r, { ringsOn: true });
    c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.setLineDash([]); c.beginPath(); c.moveTo(ux - dx * r * 1.6, uy - dy * r * 1.6); c.lineTo(ux + dx * r * 1.6, uy + dy * r * 1.6); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ux + dx * r * 1.6, uy + dy * r * 1.6, 4, 0, TAU); c.fill();
    c.strokeStyle = '#ffd25a'; c.lineWidth = 2; c.beginPath(); c.arc(ux, uy, r * 1.3, -Math.PI / 2, -Math.PI / 2 + ang); c.stroke();
    const ma = -Math.PI / 2 + ang / 2; pill(c, L.c3.tilt, ux + Math.cos(ma) * r * 1.75, uy + Math.sin(ma) * r * 1.75 + 4, X + 4, X + W - 4, '#ffd25a');
    pill(c, pn[6], ux, uy + r * 1.7 + 14, X + 4, X + W - 4);
  } else if (S.clue === 'small') {
    const er = Math.min(W * .26, H * .3), mr = er * 4878.8 / 12742, ey = Y + H * .46;
    drawPlanet(c, 'earth', X + W * .66, ey, er); drawPlanet(c, 'mercury', X + W * .22, ey, mr);
    pill(c, pn[2], X + W * .66, ey + er + 18, X + 4, X + W - 4); pill(c, pn[0], X + W * .22, ey + er + 18, X + 4, X + W - 4);
  } else {
    const sx = X + W * .1, ex = X + W * .88, ly = Y + H * .46, sr = Math.min(W, H) * .07;
    c.strokeStyle = 'rgba(200,210,235,.5)'; c.lineWidth = 2; c.setLineDash([3, 6]); c.beginPath(); c.moveTo(sx, ly); c.lineTo(ex, ly); c.stroke(); c.setLineDash([]);
    const sg = c.createRadialGradient(sx, ly, 0, sx, ly, sr * 2.4); sg.addColorStop(0, '#fffbe0'); sg.addColorStop(.4, '#ffd25a'); sg.addColorStop(1, 'rgba(255,170,40,0)'); c.fillStyle = sg; c.beginPath(); c.arc(sx, ly, sr * 2.4, 0, TAU); c.fill();
    const ex1 = sx + (ex - sx) / 30.1; drawPlanet(c, 'earth', ex1 + sr * 1.6, ly, Math.min(W, H) * .035); drawPlanet(c, 'neptune', ex, ly, Math.min(W, H) * .07);
    pill(c, `${pn[2]} · 1`, ex1 + sr * 1.6 + 20, ly - 36, X + 4, X + W - 4); pill(c, `${pn[7]} · 30`, ex - 10, ly + 44, X + 4, X + W - 4);
    pill(c, L.c3.dist, cx, Y + H - 20, X + 4, X + W - 4);
  }
  c.restore();
  c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(X, Y, W, H, 16); c.stroke();
}

// --- loop -------------------------------------------------------------------------------------------------------
const loop = canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'land') {
    if (S.phase === 'fall') { S.t += dt / DUR; if (S.t >= 1) { S.t = 1; S.phase = 'done'; S.drift = 0; if (!S.seen.includes(S.cur)) S.seen.push(S.cur); render(); } }
    else if (S.phase === 'done' && SC[S.cur]?.giant) S.drift += dt * .03;
    if (S.sec === 'venus' && S.race.running) {
      S.race.d += dt * (S.race.d < 200 ? 30 : 8);
      lab.setReadout(String(Math.round(S.race.d)), T[lang].venus.days, '', '#ffb347');
      if (S.race.d >= 260) { S.race.d = 260; S.race.running = false; S.race.done = true; render(); }
    }
    if (S.sec === 'jump') S.jt += dt;
    drawLand(c, w, h, time);
  } else if (v === 'temp') {
    if (S.checked && S.tt < 1) S.tt = Math.min(1, S.tt + dt / 1.3);
    drawTemp(c, w, h, time);
  } else drawClues(c, w, h, time);
});

// --- interaction ------------------------------------------------------------------------------------------------
const cv = $('cv');
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const planetAtRow = (ev) => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, g = rowGeom(loop.size().w);
  if (y > g.bottom + 2 || x < 0) return null;
  const i = Math.floor(x / g.cell); return i >= 0 && i < 8 ? PL[i].id : null;
};
cv.addEventListener('click', (ev) => {
  const v = lab.view; if (v === 'temp') return;
  const id = planetAtRow(ev); if (!id) return;
  if (v === 'land') {
    if (S.sec === 'jump' && PM[id].rocky) { S.jump = id; S.jt = 0; sfx.click(); render(); return; }
    S.sec = null; S.cur = id; S.t = 0; S.drift = 0; S.phase = S.res[id] ? 'fall' : 'ask'; sfx.click(); render(); showStage();
  } else {
    if (!S.clue) { S.nudge++; sfx.bad(); render(); return; }
    if (S.cres[S.clue]) return;
    const ok = CLUES[S.clue].includes(id); S.cres[S.clue] = { pick: id, ok };
    if (S.clue === 'storm') S.spot = true;
    (ok ? sfx.good : sfx.bad)(); render(); showStage();
  }
});
const cpos = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
const hitPlanet = (x, y, g) => { let best = null, bd = 1e9; for (const id of Object.keys(TEMP)) { const b = basePos(id, g), d = Math.hypot(b[0] - x, b[1] - y); if (d < g.r + 12 && d < bd) { bd = d; best = id; } } return best; };
const slotAt = (x, y, g) => { for (let k = 0; k < 5; k++) { const yy = g.slotY(k); if (x >= g.sockX - 6 && x <= g.sockX + g.sockW + 6 && Math.abs(y - yy) <= g.slotH / 2) return k; } return -1; };
function place(id, k) {
  const from = S.slots.indexOf(id), other = S.slots[k];
  if (from === k) { S.armed = null; return; }
  S.slots[k] = id; if (from >= 0) S.slots[from] = other === id ? null : other;
  S.armed = null; sfx.snap();
}
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'temp' || S.checked) return;
  const g = tempGeo(loop.size().w, loop.size().h), [x, y] = cpos(ev), id = hitPlanet(x, y, g);
  if (id) { S.drag = { id, x, y, sx: x, sy: y, moved: false }; try { cv.setPointerCapture(ev.pointerId); } catch { /* ok */ } }
  else if (S.armed) { const k = slotAt(x, y, g); if (k >= 0) { place(S.armed, k); render(); } }
});
cv.addEventListener('pointermove', (ev) => {
  const d = S.drag; if (!d) return;
  const [x, y] = cpos(ev); d.x = x; d.y = y; if (Math.hypot(x - d.sx, y - d.sy) > 6) d.moved = true;
});
const endDrag = (ev, cancel) => {
  const d = S.drag; if (!d) return; S.drag = null;
  const g = tempGeo(loop.size().w, loop.size().h), [x, y] = cpos(ev);
  if (cancel) { render(); return; }
  if (d.moved) { const k = slotAt(x, y, g); if (k >= 0) place(d.id, k); else { const f = S.slots.indexOf(d.id); if (f >= 0) { S.slots[f] = null; sfx.tick(); } S.armed = null; } }
  else {
    if (S.armed && S.armed !== d.id && S.slots.indexOf(d.id) >= 0) place(S.armed, S.slots.indexOf(d.id));
    else { S.armed = S.armed === d.id ? null : d.id; sfx.tick(); }
  }
  render();
};
cv.addEventListener('pointerup', (ev) => endDrag(ev, false));
cv.addEventListener('pointercancel', (ev) => endDrag(ev, true));

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'guess' && S.phase === 'ask') {
    const g = b.dataset.g === '1'; S.res[S.cur] = { g, ok: g === PM[S.cur].rocky }; S.phase = 'fall'; S.t = 0; S.drift = 0; sfx.click(); render(); showStage();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; sfx.click();
    if (S.sec === 'venus') S.race = { guess: null, d: 0, running: false, done: false };
    if (S.sec === 'jump') { S.jt = 0; if (!PM[S.jump].rocky) S.jump = 'mars'; }
    render();
  } else if (act === 'vguess') {
    S.race = { guess: b.dataset.g, d: 0, running: true, done: false }; sfx.click(); render(); showStage();
  } else if (act === 'vagain') { S.race = { guess: null, d: 0, running: false, done: false }; sfx.click(); render(); }
  else if (act === 'jpl') { S.jump = b.dataset.id; S.jt = 0; sfx.click(); render(); }
  else if (act === 'check' && v === 'temp') { if (S.slots.every(Boolean) && !S.checked) { S.checked = true; S.tt = 0; sfx.good(); render(); showStage(); } }
  else if (act === 'reset') { S.slots = [null, null, null, null, null]; S.armed = null; S.checked = false; S.tt = 0; sfx.click(); render(); }
  else if (act === 'clue') { S.clue = b.dataset.k; sfx.tick(); render(); showStage(); }
});

// --- one render per change ----------------------------------------------------------------------------------------
const factList = (keys) => keys.map((k) => ({ emo: '💡', text: T[lang].facts[k][0], src: T.en.facts[k][1] }));
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('plLand').hidden = v !== 'land'; $('plTemp').hidden = v !== 'temp'; $('plClue').hidden = v !== 'clues';
  if (v === 'land') renderLand(t); else if (v === 'temp') renderTemp(t); else renderClues(t);
}
function renderLand(t) {
  const L = t.land, open = secret.unlocked(), nS = S.seen.length, found = S.seen.filter((k) => PM[k].rocky).length;
  $('plSecChips').innerHTML = [['venus', '🕰️', 'a'], ['jump', '🦘', 'b']].map(([k, emo, ix]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[ix][0])}` : '🔒 ???'}</button>`).join('');
  $('plAsk').hidden = true; $('plHint').hidden = true; $('plVenus').hidden = S.sec !== 'venus'; $('plJump').hidden = S.sec !== 'jump';
  if (S.sec === 'venus') return renderVenus(t);
  if (S.sec === 'jump') return renderJump(t);
  lab.setGlow('rgba(255, 150, 90, .22)');
  const right = S.seen.filter((k) => S.res[k]?.ok).length;
  lab.setReadout(`🪨 ${found} · ☁️ ${nS - found}`, L.sub(nS), nS ? L.pill(right, S.seen.filter((k) => S.res[k]).length) : '', '#ff9a5a');
  const seenFacts = [...S.seen].reverse().filter((k) => T.en.facts[k]).slice(0, 3);
  lab.setFacts(factList(seenFacts));
  const id = S.cur, nm = id ? t.pn[PM[id].i] : '';
  if (!id) {
    $('plHint').hidden = false; $('plHint').textContent = L.hintPick;
    lab.setState({ emo: '🚀', title: L.pickT, lead: L.pickL, body: L.pickB, extra: '' });
  } else if (S.phase === 'ask') {
    $('plAsk').hidden = false; $('plQ').textContent = L.q; $('plYes').textContent = L.yes; $('plNo').textContent = L.no;
    lab.setState({ emo: '🤔', title: L.askT(nm), lead: L.askL, body: '', extra: '' });
  } else if (S.phase === 'fall') {
    $('plHint').hidden = false; $('plHint').textContent = nm;
    lab.setState({ emo: '🛰️', title: L.fallT, lead: L.fallL(nm), body: '', extra: '' });
  } else {
    $('plHint').hidden = false; $('plHint').textContent = L.hintDone;
    const rocky = PM[id].rocky, r = S.res[id], verdict = r ? (r.ok ? `${L.right} ` : `${L.wrong} `) : '';
    lab.setState({ emo: rocky ? '✅' : '☁️', title: rocky ? L.foundT : L.noneT, lead: verdict + L.out[id], body: nS >= 8 ? L.allL : '', extra: '' });
  }
}
function renderVenus(t) {
  const V = t.venus, R = S.race;
  lab.setGlow('rgba(255, 190, 90, .22)');
  $('plVenus').innerHTML = R.guess === null ? `<p class="pl-q">${esc(V.q)}</p><div class="pl-ans"><button class="pl-a" data-act="vguess" data-g="spin">${esc(V.spin)}</button><button class="pl-a" data-act="vguess" data-g="year">${esc(V.year)}</button></div>`
    : R.done ? `<div class="row2" style="margin-top:0"><button class="chip" data-act="vagain">${esc(V.again)}</button></div>` : '';
  lab.setReadout(String(Math.round(R.d)), V.days, '', '#ffb347');
  if (R.guess === null) { lab.setFacts([]); lab.setState({ emo: '🕰️', title: V.stT, lead: V.stL, body: '', extra: '' }); }
  else if (!R.done) { lab.setFacts([]); lab.setState({ emo: '⏱️', title: V.runT, lead: V.runL, body: '', extra: '' }); }
  else { lab.setFacts(factList(['venusSpin'])); lab.setState({ emo: R.guess === 'spin' ? '✅' : '🤔', title: R.guess === 'spin' ? V.okT : V.badT, lead: V.doneL, body: V.doneB, extra: '' }); }
}
function renderJump(t) {
  const J = t.jump, id = S.jump, ratio = jumpRatio(id);
  lab.setGlow('rgba(255, 215, 90, .2)');
  $('plJump').innerHTML = `<p class="pl-hint">${esc(J.pick)}</p><div class="pl-rock">${['mercury', 'venus', 'earth', 'mars'].map((k) => `<button class="chip ${k === id ? 'on' : ''}" data-act="jpl" data-id="${k}">${esc(t.pn[PM[k].i])}</button>`).join('')}</div>`;
  lab.setReadout(id === 'earth' ? '× 1' : `× ${fmt(ratio)}`, J.sub, '', '#ffd25a');
  lab.setFacts(id === 'mars' ? factList(['mars']) : []);
  lab.setState({ emo: '🦘', title: id === 'earth' ? J.stE : J.stT(fmt(ratio)), lead: J.stL, body: J.stB(fmt(GRAV[id], id === 'earth' ? 1 : 2)), extra: '' });
}
function renderTemp(t) {
  const P = t.temp, placed = S.slots.filter(Boolean).length, all = placed === 5;
  lab.setGlow('rgba(255, 110, 70, .24)');
  $('plCheck').hidden = S.checked; $('plCheck').textContent = P.check; $('plCheck').disabled = !all;
  $('plReset').hidden = !(placed > 0 || S.checked); $('plReset').textContent = P.reset;
  $('plTHint').textContent = S.checked ? '' : S.armed ? P.hintArmed : all ? P.hintFull : P.hint0; $('plTHint').hidden = S.checked;
  if (!S.checked) {
    lab.setReadout(`${placed}/5`, P.placed, '', '#ff7a4a'); lab.setFacts([]);
    lab.setState({ emo: '🌡️', title: P.stT, lead: P.stL, body: P.stB, extra: '' });
  } else {
    const hits = S.slots.filter((id, k) => RANK[id] === k).length;
    lab.setReadout(`${hits}/5`, P.hits, '', '#ff7a4a'); lab.setFacts(factList(['t1', 't2', 't3']));
    lab.setState({ emo: hits === 5 ? '✅' : '🤔', title: hits === 5 ? P.okT : P.badT, lead: P.lead, body: P.body, extra: '' });
  }
}
function renderClues(t) {
  const C = t.clues, done = CLUE_KEYS.filter((k) => S.cres[k]), solved = done.filter((k) => S.cres[k].ok).length;
  lab.setGlow('rgba(120, 170, 255, .24)');
  $('plClues').innerHTML = CLUE_KEYS.map((k) => { const r = S.cres[k]; return `<button class="pl-clue ${S.clue === k ? 'on' : ''} ${r ? (r.ok ? 'ok' : 'bad') : ''}" data-act="clue" data-k="${k}"><span class="e">${C.list[k][0]}</span><span>${esc(C.list[k][1])}</span>${r ? `<span class="m">${r.ok ? '✓' : '·'}</span>` : ''}</button>`; }).join('');
  $('plCHint').textContent = S.clue && S.cres[S.clue] ? C.hintNext : C.hint;
  lab.setReadout(`${solved}/6`, C.sub, '', '#78aaff');
  lab.setFacts(factList(S.clue && S.cres[S.clue] ? [S.clue] : done.slice(-1)));
  if (!S.clue) lab.setState({ emo: '🔎', title: C.pickT, lead: C.pickL, body: '', extra: '' });
  else if (!S.cres[S.clue]) lab.setState({ emo: C.list[S.clue][0], title: C.list[S.clue][1], lead: C.askL, body: '', extra: '' });
  else {
    const r = S.cres[S.clue], key = S.clue === 'storm' && S.res.jupiter ? 'stormG' : S.clue;
    lab.setState({ emo: r.ok ? '✅' : '🤔', title: r.ok ? C.right : C.wrong, lead: C.res[key], body: '', extra: '' });
  }
}
render();
</script>
