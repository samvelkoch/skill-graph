    if (r.checked) return; const i = +b.dataset.i, k = b.dataset.k; r.ans[i] = r.ans[i] === k ? null : k; sfx.tick();
  } else if (act === 'r-main') {
    if (r.phase === 0 && !r.checked) { if (r.ans.includes(null)) return; r.checked = true; r.checkAt = now(); (r.ans.every((x, i) => x === KIND[i]) ? sfx.good : sfx.click)(); showStage(); }
    else if (r.phase === 0) {
      r.phase = 1; r.pick = null; r.mixR = 3 + Math.floor(Math.random() * 5);
      r.bOrder = shuffle([...Array(r.mixR).fill('r'), ...Array(10 - r.mixR).fill('b')]); sfx.click();
    } else if (r.pick) { Object.assign(S.r, { ans: [null, null, null, null, null, null], checked: false, phase: 0, pick: null, tok: {} }); sfx.click(); }
  } else if (act === 'r-jar') { if (r.pick) return; r.pick = b.dataset.j; r.pickAt = now(); sfx.good(); showStage(); }
  else if (act === 'g-bet') { g.bet = b.dataset.b; g.res = Math.random() < 0.5 ? 'H' : 'T'; g.flipAt = now(); sfx.click(); }
  else if (act === 'g-sim') { let h = 0; for (let i = 0; i < 1000; i++) if (Math.random() < 0.5) h++; g.sim = { h }; g.simAt = now(); sfx.good(); }
  else if (act === 'g-again') { S.g = { bet: null, res: null, flipAt: 0, sim: null, simAt: 0 }; sfx.click(); }
  render();
});
$('aRange').addEventListener('input', (ev) => { S.a.guess = +ev.target.value; render(); });
$('dRange').addEventListener('input', (ev) => { S.d.n = +ev.target.value; sfx.tick(); render(); });

// --- one render per change ---------------------------------------------------------------------------------
const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  show('cNews', !sec && v === 'news'); show('cAnchor', !sec && v === 'anchor'); show('cRisk', !sec && v === 'risk'); show('cGam', sec === 'gam'); show('cDrv', sec === 'drv');
  const sc = (k, e) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('gam', '🪙') + sc('drv', '🚗');
  if (sec === 'gam') renderGam(t); else if (sec === 'drv') renderDrv(t);
  else if (v === 'news') renderNews(t); else if (v === 'anchor') renderAnchor(t); else renderRisk(t);
}
function renderNews(t) {
  const n = S.n, tt = t.news, k = nRight();
  lab.setGlow('rgba(217, 160, 95, .24)'); lab.setFacts([{ emo: '📰', ...t.facts.news }]);
  $('nQ').textContent = tt.q;
  $('nTray').innerHTML = tt.items ? REAL.length && n.tray.map((id) => `<button class="chip" data-act="n-pick" data-id="${id}"${n.placed.includes(id) || n.rev ? ' disabled' : ''}>${CARD[id].e} ${esc(tt.items[id])}</button>`).join('') : '';
  $('nTray').style.display = n.rev ? 'none' : '';
  $('nUndo').textContent = tt.undo; $('nUndo').style.display = n.rev ? 'none' : ''; $('nUndo').disabled = !n.placed.length;
  $('nGo').textContent = n.rev ? tt.again : tt.go; $('nGo').disabled = !n.rev && n.placed.length < 5;
  if (!n.rev) {
    lab.setReadout(`${n.placed.length}/5`, '', '', '#d9a05f');
    lab.setState({ emo: '📰', title: tt.pickT, lead: tt.sub, body: '', extra: '' });
  } else {
    lab.setReadout(`${k}/5`, '', '', '#d9a05f');
    lab.setState({ emo: k === 5 ? '✅' : '🤔', title: tt.res(k), lead: tt.lead, body: tt.body, extra: '' });
  }
}
function renderAnchor(t) {
  const a = S.a, ta = t.anchor, step = !a.landed ? 0 : !a.locked ? 1 : !a.rev ? 2 : 3;
  lab.setGlow('rgba(95, 176, 200, .24)'); lab.setFacts([{ emo: '🎡', ...t.facts.anchor }]);
  show('aSpinBox', step === 0); show('aGuessBox', step === 1); show('aPredBox', step === 2); show('aAgainBox', step === 3); show('aQ', step < 3);
  $('aSpin').textContent = a.spinning ? ta.spinning : ta.spin; $('aSpin').disabled = a.spinning;
  $('aQ').textContent = step === 0 ? ta.qSpin : step === 1 ? `${ta.stopped(a.anchor)} ${ta.q}` : ta.predQ;
  if (+$('aRange').value !== a.guess) $('aRange').value = a.guess;
  $('aLock').textContent = ta.lock(a.guess);
  $('aPred').innerHTML = [['up', 0], ['same', 1], ['down', 2]].map(([k, i]) => `<button class="chip" data-act="a-pred" data-p="${k}">${esc(ta.pred[i])}</button>`).join('');
  $('aAgain').textContent = ta.again;
  lab.setReadout(step >= 1 ? a.guess : '?', step >= 1 ? ta.sub : '', step >= 1 ? `🎡 ${a.anchor}` : '', '#5fb0c8');
  if (step === 0) lab.setState({ emo: '🎡', title: ta.qSpin, lead: ta.spinLead, body: '', extra: '' });
  else if (step === 1) lab.setState({ emo: '🦜', title: ta.q, lead: `${ta.stopped(a.anchor)} ${ta.slide}`, body: '', extra: '' });
  else if (step === 2) lab.setState({ emo: '🤔', title: ta.predT, lead: ta.predQ, body: '', extra: '' });
  else {
    const first = a.round === 0, good = a.pred === 'up';
    lab.setState({ emo: '⚓', title: first ? (good ? ta.right : ta.wrong) : ta.title2, lead: ta.lead(MED[10], MED[65]), body: ta.body, extra: '' });
  }
}
function renderRisk(t) {
  const r = S.r, tr = t.risk, done = r.ans.filter(Boolean).length, k = r.ans.filter((x, i) => x === KIND[i]).length;
  lab.setGlow('rgba(143, 127, 208, .26)'); lab.setFacts([{ emo: '✈️', ...t.facts.risk }]);
  const rows = r.phase === 0;
  show('rRows', rows); show('rJars', !rows && !r.pick);
  $('rQ').textContent = rows ? tr.q : tr.jarQ;
  $('rRows').innerHTML = tr.rows.map(([e, txt], i) => `<div class="bz-row"><span class="e">${e}</span><span class="tx">${esc(txt)}</span><div class="tg">${['r', 'u'].map((kk) =>
    `<button data-act="r-set" data-i="${i}" data-k="${kk}" class="${r.ans[i] === kk ? 'on' : ''} ${r.checked && KIND[i] === kk ? 'good' : ''}"${r.checked ? ' disabled' : ''}>${esc(kk === 'r' ? tr.risk : tr.unk)}</button>`).join('')}</div></div>`).join('');
  $('rJars').innerHTML = `<button class="chip" data-act="r-jar" data-j="A">🫙 ${esc(tr.pickA)}</button><button class="chip" data-act="r-jar" data-j="B">🎁 ${esc(tr.pickB)}</button>`;
  const main = $('rMain'); main.style.display = '';
  if (rows) { main.textContent = r.checked ? tr.next : tr.check; main.disabled = !r.checked && done < 6; }
  else { main.style.display = r.pick ? '' : 'none'; main.textContent = tr.again; main.disabled = false; }
  if (rows && !r.checked) { lab.setReadout(`${done}/6`, '', '', '#8f7fd0'); lab.setState({ emo: '🎯', title: tr.q, lead: tr.def, body: '', extra: '' }); }
  else if (rows) { lab.setReadout(`${k}/6`, '', '', '#8f7fd0'); lab.setState({ emo: k === 6 ? '✅' : '🤔', title: tr.res(k), lead: tr.lead, body: '', extra: '' }); }
  else if (!r.pick) { lab.setReadout('🫙', '', '', '#8f7fd0'); lab.setState({ emo: '🫙', title: tr.jarT, lead: tr.jarJ, body: '', extra: '' }); }
  else { lab.setReadout(r.pick, '', '', '#8f7fd0'); lab.setState({ emo: '👥', title: tr.jarRes, lead: tr.jarLead(r.mixR), body: '', extra: '' }); }
}
function renderGam(t) {
  const g = S.g, tg = t.gam;
  lab.setGlow('rgba(224, 176, 80, .26)'); lab.setFacts([]);
  $('gQ').textContent = tg.q;
  $('gBtns').innerHTML = !g.res
    ? `<button class="chip" data-act="g-bet" data-b="H">🪙 ${esc(tg.betH)}</button><button class="chip" data-act="g-bet" data-b="T">🪙 ${esc(tg.betT)}</button>`
    : (g.sim ? '' : `<button class="chip" data-act="g-sim">${esc(tg.thousand)}</button>`) + `<button class="chip" data-act="g-again">${esc(tg.again)}</button>`;
  lab.setReadout('5 × ' + tg.H, '', '', '#e0b050');
  if (g.sim) lab.setState({ emo: '🪙', title: tg.t2, lead: tg.lead2(g.sim.h, 1000 - g.sim.h), body: tg.body2, extra: '' });
  else if (g.res) lab.setState({ emo: g.bet === g.res ? '✅' : '🤔', title: tg.land(g.res === 'H' ? tg.faceH : tg.faceT), lead: g.bet === g.res ? tg.win : tg.lose, body: '', extra: '' });
  else lab.setState({ emo: '🪙', title: tg.t, lead: tg.lead, body: '', extra: '' });
}
function renderDrv(t) {
  const d = S.d, td = t.drv, tot = 20 - d.n + d.n * 10;
  lab.setGlow('rgba(229, 72, 77, .22)'); lab.setFacts([{ emo: '✈️', ...t.facts.risk }]);
  $('dQ').textContent = td.lbl(d.n); if (+$('dRange').value !== d.n) $('dRange').value = d.n;
  lab.setReadout(tot, td.risk, '', '#e5484d');
  lab.setState({ emo: '🚗', title: td.t(d.n), lead: td.lead(tot), body: td.body, extra: '' });
}
render();
</script>
