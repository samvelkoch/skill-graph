  if (S.sec === 'shy') {
    lab.setReadout(`${n}/10`, p.came, '', '#6fb36f');
    lab.setState(S.invited ? { emo: '💌', title: p.shyDT, lead: p.shyDL, body: '', extra: stayedHtml(t) } : { emo: '🙈', title: p.shyT, lead: p.shyL, body: '', extra: stayedHtml(t) });
    return;
  }
  lab.setReadout(`${n}/10`, p.came, right ? p.right : '', '#6fb36f');
  lab.setState({ emo: right ? '✅' : '👀', title: right ? p.right : p.off(S.res.guess), lead: p.res(n), body: p.stayL, extra: stayedHtml(t) });
}
function renderWhy(t) {
  ensureRes();
  const w = t.why, res = S.res, ql = lang === 'en' ? ['“', '”'] : lang === 'ru' ? ['«', '»'] : ['„', '”'];
  lab.setGlow('rgba(143, 127, 208, .26)');
  lab.setFacts(t.facts.why);
  let html = '';
  if (!res.came.length) html = `<div class="ji-note">${esc(w.none)}</div>`;
  else {
    html = `<div class="ji-lab">${esc(w.who)}</div><div class="chips">${res.came.map((id) => {
      const st = S.R[id], dn = st && st.k >= 3;
      return `<button class="chip ${S.sel === id ? 'on' : ''}" data-act="who" data-id="${id}">${dn ? '✓ ' : ''}${esc(t.nm[id])}</button>`;
    }).join('')}</div>`;
    if (S.sel && res.came.includes(S.sel)) {
      const st = stOf(S.sel), k = st.k;
      if (k >= 3) html += `<div class="ji-v">${esc(w.all(t.nm[S.sel]))}</div>`;
      else {
        const q = quoteFor(S.sel, k), ans = st.ans;
        html += `<div class="ji-lab">${esc(w.qn(k + 1))} · ${esc(w.q)}</div><div class="ji-quote">${ql[0]}${esc(q.text)}${ql[1]}</div><div class="ji-rs">${RK.map((r) => {
          const cls = ans ? (r === q.reason ? 'good' : r === ans ? 'bad' : '') : '';
          return `<button class="ji-r ${cls}" data-act="ans" data-r="${r}"${ans ? ' disabled' : ''}>${REAS[r]} ${esc(t.rs[r])}</button>`;
        }).join('')}</div>`;
        if (ans) html += `<div class="ji-v" style="color:${ans === q.reason ? 'var(--ok)' : 'var(--wip)'}">${esc(ans === q.reason ? w.right : w.wrong(t.rs[q.reason]))}</div><button class="btn" data-act="nextq">${esc(k === 2 ? w.done : w.next)}</button>`;
      }
    }
  }
  $('ctrlBody').innerHTML = html + secRow(t);
  const tot = Object.values(S.R).reduce((a, x) => a + x.ok, 0), asked = Object.values(S.R).reduce((a, x) => a + x.k + (x.ans && x.k < 3 ? 1 : 0), 0);
  lab.setReadout(`${tot}/${asked}`, w.sub, '', '#8f7fd0');
  lab.setState({ emo: '💬', title: t.views.why.slice(3), lead: res.came.length ? w.tap : w.none, body: res.demo ? w.demo : '', extra: '' });
}
function renderMe(t) {
  const m = t.me, cur = KIDS.find((id) => !S.placed.some((p) => p.id === id));
  lab.setGlow('rgba(224, 176, 80, .26)');
  lab.setFacts([]);
  let html = '';
  if (cur) {
    const [ti, de] = m.cards[cur];
    html = `<div class="ji-lab">${esc(m.q)} · ${S.placed.length + 1}/${KIDS.length}</div><div class="ji-card"><span class="e">${KEMO[cur]}</span><div><b>${esc(ti)}</b><span>${esc(de)}</span></div></div>
      <div class="chips">${ZONES.map((z) => `<button class="chip" data-act="zone" data-z="${z}">${ZEMO[z]} ${esc(m[z])}</button>`).join('')}</div>`;
  } else html = `<div class="row2" style="margin-top:0"><button class="chip" data-act="resort">${esc(m.again)}</button></div>`;
  html += `<div class="ji-note">🛡️ ${esc(m.safe)}</div>`;
  $('ctrlBody').innerHTML = html + secRow(t);
  lab.setReadout(`${S.placed.length}/${KIDS.length}`, m.sub, '', '#e0b050');
  if (cur) lab.setState({ emo: m.s0[0], title: m.s0[1], lead: m.s0[2], body: m.safe, extra: '' });
  else {
    const sum = ZONES.map((z) => { const items = S.placed.filter((p) => p.zone === z); return items.length ? `<div>${ZEMO[z]} <b>${esc(m[z])}</b>: ${items.map((p) => `${KEMO[p.id]} ${esc(m.cards[p.id][0])}`).join(' · ')}</div>` : ''; }).join('');
    lab.setState({ emo: '🙋', title: m.sT, lead: m.sL, body: m.safe, extra: `<div class="ji-sum">${sum}</div>` });
  }
}
render();
</script>
