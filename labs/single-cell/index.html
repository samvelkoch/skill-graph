  AX.ek += ((j === 0 ? .9 : j === 2 ? .45 : 0) - AX.ek) * Math.min(1, dt * 3); AX.extra = AX.ek > .01 ? [{ a: AX.ea, k: AX.ek, w: .3 }] : [];
  wander(AX, dt, .06, .02); keepIn(AX); stepCV(AX, dt, 12);
  if (j === 1) { S.acc3 = (S.acc3 || 0) + dt * 10; while (S.acc3 > 1) { S.acc3 -= 1; const a = rnd(0, TAU), d = AX.R * 1.8, sp = .14; spawn({ k: 'o2', x: AX.x + Math.cos(a) * d, y: AX.y + Math.sin(a) * d, vx: -Math.cos(a) * sp, vy: -Math.sin(a) * sp, l: (d - AX.R * .85) / sp, m: (d - AX.R * .85) / sp }); } }
  drawField(c, 'pond', t, 0);
  const u = AX.R * F.r, [X, Y] = P(AX.x, AX.y);
  if (j === 2) { // something tasty floats nearby: wave arcs from a glowing spot
    const sx = X + Math.cos(AX.ea) * u * 2.15, sy = Y + Math.sin(AX.ea) * u * 2.15;
    c.save(); const g = c.createRadialGradient(sx, sy, 0, sx, sy, u * .35); g.addColorStop(0, 'rgba(255,245,170,.95)'); g.addColorStop(1, 'rgba(255,245,170,0)');
    c.fillStyle = g; c.beginPath(); c.arc(sx, sy, u * .35, 0, TAU); c.fill();
    for (let i = 0; i < 3; i++) { const k = ((t * .7 + i / 3) % 1); c.strokeStyle = `rgba(255,245,170,${.6 * (1 - k)})`; c.lineWidth = 1.6; c.beginPath(); c.arc(sx, sy, u * (.15 + .8 * k), AX.ea + Math.PI - .9, AX.ea + Math.PI + .9); c.stroke(); }
    c.restore();
  }
  if (j === 6) { const k = (t * .8) % 1; c.save(); c.setLineDash([6, 5]); c.strokeStyle = `rgba(255,214,107,${.8 * (1 - k)})`; c.lineWidth = 2; c.beginPath(); c.arc(X, Y, u * (1.15 + .35 * k), 0, TAU); c.stroke(); c.restore(); }
  drawAmoeba(c, AX, t); drawParts(c);
  if (j === 0 || j === 2) ring(c, X + Math.cos(AX.ea) * u * (1 + AX.ek), Y + Math.sin(AX.ea) * u * (1 + AX.ek), u * .24, t);
  else if (j === 1) { c.save(); c.setLineDash([5, 5]); c.strokeStyle = 'rgba(255,214,107,.8)'; c.lineWidth = 2; c.beginPath(); c.arc(X, Y, u * 1.12, 0, TAU); c.stroke(); c.restore(); }
  else if (j === 3) ring(c, X + VACX[0].lx * u, Y + VACX[0].ly * u, u * .38, t);
  else if (j === 4) { const [lx, ly] = cvLocal(AX); ring(c, X + lx * u, Y + ly * u, u * .26, t); }
  else if (j === 5) ring(c, X + .06 * u, Y + .05 * u, u * .32, t);
  drawLens(c);
  if (j >= 0) { const J = T[lang].c.jobs[j]; pill(c, `${J.e} ${J.n}`, F.cx, F.cy - F.r * .88, '#ffd66b'); }
}

// --- secret: a bacterium next to an amoeba --------------------------------------------------------------------
function sceneBact(c, dt, t) {
  S.lookV += ((S.look ? 1 : 0) - S.lookV) * Math.min(1, dt * 3); BACT_T += dt;
  AS.R = .3; AS.vac = []; AS.nuc = true; AS.stain = S.lookV; AS.noCV = false; AS.extra = [];
  AS.x = -.36 + Math.sin(t * .4) * .03; AS.y = -.04 + Math.cos(t * .5) * .03; AS.ang = Math.sin(t * .3) * .8; stepCV(AS, dt, 12);
  drawField(c, 'pond', t, 0);
  drawAmoeba(c, AS, t);
  const [bx, by] = P(.5 + Math.sin(t * .6) * .02, .08 + Math.cos(t * .7) * .02), L = F.r * .3, W = F.r * .075, an = -.35 + Math.sin(t * .8) * .06;
  c.save(); c.translate(bx, by); c.rotate(an); c.lineCap = 'round';
  c.strokeStyle = 'rgba(225,205,150,.7)'; c.lineWidth = 1.6; c.beginPath(); // a flagellum
  for (let i = 0; i <= 24; i++) { const k = i / 24, x = -L - k * L * .8, y = Math.sin(k * 9 - t * 8) * W * .5 * k; i ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke();
  c.lineWidth = 1; for (let i = 0; i < 9; i++) { const x = -L + i * L / 4, s = i % 2 ? -1 : 1; c.beginPath(); c.moveTo(x, s * W); c.lineTo(x + 2, s * (W + 5)); c.stroke(); }
  c.shadowColor = 'rgba(0,20,30,.5)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
  const g = c.createLinearGradient(0, -W, 0, W); g.addColorStop(0, 'rgba(250,232,185,.85)'); g.addColorStop(1, 'rgba(205,170,105,.75)');
  c.fillStyle = g; c.beginPath(); c.roundRect(-L, -W, L * 2, W * 2, W); c.fill(); c.shadowColor = 'transparent';
  c.lineWidth = 2; c.strokeStyle = 'rgba(120,85,40,.85)'; c.stroke();
  if (S.lookV > .01) { // the stained DNA loop, lying loose
    c.globalAlpha = S.lookV; c.shadowColor = 'rgba(120,150,255,.9)'; c.shadowBlur = 8; c.strokeStyle = '#7f9bff'; c.lineWidth = 2.2; c.beginPath();
    for (let i = 0; i <= 80; i++) { const a = i / 80 * TAU, x = L * .72 * Math.cos(a) + L * .12 * Math.cos(5 * a + t * .3), y = W * .55 * Math.sin(a) + W * .22 * Math.sin(4 * a); i ? c.lineTo(x, y) : c.moveTo(x, y); }
    c.stroke();
  }
  c.restore();
  drawLens(c);
  const tg = T[lang].tag;
  pill(c, tg.amoeba, F.cx + AS.x * F.r, F.cy + (AS.y + .42) * F.r); pill(c, tg.bact, bx, by + F.r * .26);
  if (S.lookV > .5) { pill(c, tg.nucleus, F.cx + AS.x * F.r, F.cy + (AS.y - .42) * F.r, '#b9b0f0'); pill(c, tg.dna, bx, by - F.r * .22, '#9fb4ff'); }
  pill(c, tg.scale, F.cx, F.cy + F.r * .86, '#c8d0e8');
}

// --- secret: yeast in dough ---------------------------------------------------------------------------------
function sceneYeast(c, dt, t) {
  if (S.sugar) {
    YS.bt += dt;
    if (YS.bt > 1.3 && YS.cells.length + YS.buds.length < 16) { const free = YS.cells.filter((q) => !YS.buds.some((b) => b.c === q)); if (free.length) { YS.buds.push({ c: free[Math.floor(Math.random() * free.length)], p: 0, a: rnd(0, TAU) }); YS.bt = 0; } }
    YS.acc += dt * YS.cells.length * .45;
    while (YS.acc > 1) { YS.acc -= 1; const q = YS.cells[Math.floor(Math.random() * YS.cells.length)]; YS.bubbles.push({ x: q.x, y: q.y, r: rnd(.015, .03), l: rnd(2.2, 3.4), m: 3, ph: rnd(0, 6) }); }
  }
  for (let i = YS.buds.length - 1; i >= 0; i--) {
    const b = YS.buds[i]; b.p += dt / 2.6;
    if (b.p >= 1) { const q = b.c, nx = q.x + Math.cos(b.a) * q.r * 1.75, ny = q.y + Math.sin(b.a) * q.r * 1.75; YS.buds.splice(i, 1); const d = Math.hypot(nx, ny); YS.cells.push({ x: d > .8 ? nx * .8 / d : nx, y: d > .8 ? ny * .8 / d : ny, r: .1, rot: rnd(0, 3), ph: rnd(0, 6) }); render(); }
  }
  for (let i = YS.bubbles.length - 1; i >= 0; i--) { const b = YS.bubbles[i]; b.l -= dt; b.y -= dt * .1; b.x += Math.sin(t * 2 + b.ph) * dt * .03; if (b.l <= 0 || b.y < -.88) YS.bubbles.splice(i, 1); }
  drawField(c, 'dough', t, 0);
  c.save(); c.beginPath(); c.arc(F.cx, F.cy, F.r, 0, TAU); c.clip();
  c.strokeStyle = 'rgba(255,248,225,.22)'; c.lineWidth = 2; // dough streaks
  for (let i = 0; i < 6; i++) { c.beginPath(); c.moveTo(F.cx - F.r, F.cy + (i - 2.5) * F.r * .38); c.bezierCurveTo(F.cx - F.r * .3, F.cy + (i - 3.2) * F.r * .38, F.cx + F.r * .3, F.cy + (i - 1.8) * F.r * .38, F.cx + F.r, F.cy + (i - 2.5) * F.r * .38); c.stroke(); }
  c.restore();
  const cell = (q, r, a) => {
    const [x, y] = P(q.x, q.y), R = r * F.r;
    c.save(); c.translate(x, y); c.rotate(q.rot); c.shadowColor = 'rgba(80,50,10,.35)'; c.shadowBlur = 6; c.shadowOffsetY = 3;
    const g = c.createRadialGradient(-R * .3, -R * .35, R * .1, 0, 0, R * 1.1); g.addColorStop(0, '#fbf1d2'); g.addColorStop(.7, '#e0c48a'); g.addColorStop(1, '#bf9650');
    c.globalAlpha = a; c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, R * 1.05, R * .88, 0, 0, TAU); c.fill(); c.shadowColor = 'transparent';
    c.lineWidth = 1.6; c.strokeStyle = 'rgba(120,85,35,.85)'; c.stroke();
    c.fillStyle = 'rgba(150,115,60,.55)'; c.beginPath(); c.arc(R * .25, R * .1, R * .28, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.arc(-R * .4, -R * .38, R * .15, 0, TAU); c.fill();
    c.restore();
  };
  for (const b of YS.buds) { const q = b.c, k = ease(b.p), br = q.r * .8 * k, off = q.r * (.95 + .8 * k); cell({ x: q.x + Math.cos(b.a) * off, y: q.y + Math.sin(b.a) * off, rot: q.rot }, Math.max(.001, br), 1); }
  for (const q of YS.cells) cell(q, q.r, 1);
  for (const b of YS.bubbles) {
    const [x, y] = P(b.x, b.y), r = b.r * F.r, a = clamp(Math.min(b.l, b.m - b.l) * 3, 0, 1);
    c.save(); c.globalAlpha = a; c.fillStyle = 'rgba(255,255,255,.28)'; c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.3;
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.stroke(); c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath(); c.arc(x - r * .35, y - r * .35, r * .22, 0, TAU); c.fill(); c.restore();
  }
  drawLens(c);
}

// --- the loop --------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  F.w = w; F.h = h; F.r = Math.min(w, h) * .46; F.cx = w / 2; F.cy = h / 2;
  stepParts(dt);
  const v = lab.view;
  if (v === 'amoeba') { if (S.sec === 'bact') sceneBact(c, dt, time); else if (S.sec === 'yeast') sceneYeast(c, dt, time); else scene1(c, dt, time); }
  else if (v === 'pump') scene2(c, dt, time);
  else scene3(c, dt, time);
});

// --- controls ------------------------------------------------------------------------------------------------
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'amoeba' || S.sec || S.rv !== 'feed') return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - F.cx) / F.r, y = (ev.clientY - r.top - F.cy) / F.r;
  if (Math.hypot(x, y) > 1) return;
  dropAlga(x, y); render();
});
$('sal').addEventListener('input', () => { S.sal = +$('sal').value / 100; renderPump(T[lang]); });
function resetAmoeba() { AM = [makeAmoeba(0, 0, .4)]; AL.length = 0; PT.length = 0; S.mass = 0; S.massV = 0; S.eaten = 0; S.divT = 0; S.rv = 'feed'; }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id, i = +b.dataset.i;
  if (act === 'p1') { S.pred1 = id; sfx.click(); S.rv = 'drop'; dropNear(); showStage(); }
  else if (act === 'drop') { dropNear(); }
  else if (act === 'p2') { S.pred2 = id; sfx.click(); S.divT = 0; AM[0].div = .001; S.rv = 'div'; showStage(); }
  else if (act === 'split') { sfx.click(); S.divT = 0; AM[0].div = .001; S.rv = 'div'; }
  else if (act === 'again') { sfx.click(); resetAmoeba(); }
  else if (act === 'p3') { S.pred3 = id; S.sal = 0; sfx.click(); showStage(); }
  else if (act === 'gc') { S.guess[i] = (S.guess[i] + 1) % 3; sfx.tick(); }
  else if (act === 'jb') { S.job = S.job === i ? -1 : i; S.seen[i] = true; sfx.click(); }
  else if (act === 'chk') { S.checked = true; S.job = -1; const k = S.guess.filter((g) => g === 2).length; (k >= 5 ? sfx.good : sfx.click)(); }
  else if (act === 'retry') { S.guess.fill(0); S.checked = false; S.seen.fill(false); S.job = -1; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === id ? null : id; S.look = false; S.lookV = 0; S.sugar = false; sfx.click();
  }
  else if (act === 'look') { S.look = !S.look; sfx.click(); }
  else if (act === 'sugar') { S.sugar = !S.sugar; sfx.click(); }
  render();
});

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
// --- one render per change: controls, readout and the state card ---------------------------------------------
const chip = (act, label, attrs = '') => `<button class="chip" data-act="${act}" ${attrs}>${esc(label)}</button>`;
function render() {
  const t = T[lang], v = lab.view, sec = v === 'amoeba' ? S.sec : null;
  $('c1').hidden = !(v === 'amoeba' && !sec); $('c2').hidden = v !== 'pump'; $('c3').hidden = v !== 'jobs'; $('cs').hidden = !sec; $('secRow').hidden = v !== 'amoeba';
  if (v === 'amoeba') {
    const open = secret.unlocked(), mk = (id, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === id ? 'on' : ''}" data-act="sec" data-id="${id}">${open ? `${emo} ${esc(t.secrets[id][0])}` : '🔒 ???'}</button>`;
    $('secRow').innerHTML = mk('bact', '🧫') + mk('yeast', '🍞');
  }
  if (sec === 'bact') renderBact(t); else if (sec === 'yeast') renderYeast(t);
  else if (v === 'amoeba') renderAmoeba(t); else if (v === 'pump') renderPump(t, true); else renderJobs(t);
}
function renderAmoeba(t) {
  const a = t.a, f = t.f, rv = S.rv, verdict = S.pred1 === 'surround' ? a.right : a.wrong, verdict2 = S.pred2 === 'split' ? a.right : a.wrong;
  lab.setGlow('rgba(80, 170, 160, .28)');
  let h = '', st;
  if (rv === 'ask1') { h = `<div class="sc-q">${esc(a.q1)}</div><div class="sc-row">${a.ids1.map((id) => chip('p1', a.o1[id], `data-id="${id}"`)).join('')}</div>`; st = { emo: '🤔', title: a.q1, lead: a.pick }; }
  else if (['drop', 'reach', 'wrap', 'inside'].includes(rv)) st = { emo: '🔬', title: verdict, lead: a.ph[rv] };
  else if (rv === 'feed') { h = `<div class="sc-row">${chip('drop', a.drop, canDrop() ? '' : 'disabled')}<span class="sc-hint">${esc(a.tap)}</span></div>`; st = { emo: '🟢', title: a.feedT, lead: a.feedL(S.mass) }; }
  else if (rv === 'ask2') { h = `<div class="sc-q">${esc(a.q2)}</div><div class="sc-row">${a.ids2.map((id) => chip('p2', a.o2[id], `data-id="${id}"`)).join('')}</div>`; st = { emo: '🤔', title: a.q2, lead: a.pick2 }; }
  else if (rv === 'big') { h = `<div class="sc-row">${chip('split', a.splitB)}</div>`; st = { emo: '✂️', title: a.bigT, lead: a.bigL }; }
  else if (rv === 'div') st = { emo: '✂️', title: S.pred2 ? verdict2 : a.bigT, lead: a.div1 };
  else { h = `<div class="sc-row">${chip('again', a.again)}</div>`; st = { emo: '🦠', title: S.pred2 ? verdict2 : a.bigT, lead: a.div2 }; }
  $('c1').innerHTML = h;
  const pill = rv === 'after' ? a.sizes[3] : S.mass >= BIG ? a.sizes[2] : S.mass > 0 ? a.sizes[1] : a.sizes[0];
  lab.setReadout(S.eaten, a.sub, pill, '#5fb7a8');
  lab.setState({ ...st, body: '' });
  const list = [f.size];
  if (['inside', 'feed', 'ask2', 'big', 'div', 'after'].includes(rv)) list.push(f.eat);
  if (rv === 'div' || rv === 'after') list.push(f.fission);
  lab.setFacts(list);
}
function renderPump(t, rebuild = false) {
  const b = t.b, asked = S.pred3 !== null, s = S.sal, rate = rateOf(s);
  lab.setGlow('rgba(70, 140, 220, .3)');
  if (rebuild) {
    $('c2ask').hidden = asked; $('c2sl').hidden = !asked;
    $('c2ask').innerHTML = asked ? '' : `<div class="sc-q" style="flex-basis:100%">${esc(b.q)}</div>` + b.ids.map((id) => chip('p3', b.o[id], `data-id="${id}"`)).join('');
    $('endF').textContent = b.fresh; $('endS').textContent = b.salty; $('sal').setAttribute('aria-label', b.water);
    if (+$('sal').value !== Math.round(s * 100)) $('sal').value = Math.round(s * 100);
  }
  if (!asked) {
    lab.setReadout('?', b.sub, '', '#4ea8ff');
    lab.setState({ emo: '💧', title: b.t0, lead: b.l0, body: '' });
    lab.setFacts([t.f.para]);
    return;
  }
  const verdict = S.pred3 === 'fresh' ? b.right : b.wrong, idx = s < .34 ? 0 : s < .67 ? 1 : 2;
  lab.setReadout(rate >= 9.95 ? Math.round(rate) : rate.toFixed(1), b.sub, b.pills[idx], '#4ea8ff');
  lab.setState({ emo: '💧', title: verdict, lead: b.lead, body: b.body[idx] });
  lab.setFacts([t.f.cv1, t.f.cv2, t.f.cv3]);
}
function renderJobs(t) {
  const c = t.c, J = c.jobs, j = S.job, g = S.guess.filter(Boolean).length, seen = S.checked ? 7 : S.seen.filter(Boolean).length;
  lab.setGlow('rgba(224, 176, 80, .24)');
  let h = `<div class="sc-jt"><span></span><span class="hd">${esc(c.hdA)}</span><span class="hd">${esc(c.hdS)}</span>`;
  J.forEach((x, i) => {
    const am = S.checked || S.seen[i] ? '✅' : '?', gs = S.guess[i];
    const cls = S.checked ? (gs === 2 ? 'hit' : 'miss') : '', sk = S.checked ? '❌' : gs === 0 ? '?' : gs === 1 ? '✅' : '❌';
    h += `<button class="jb ${j === i ? 'on' : ''}" data-act="jb" data-i="${i}"><span class="e">${x.e}</span>${esc(x.n)}</button>
      <span class="cell ${S.checked || S.seen[i] ? 'seen' : ''}">${am}</span>
      ${S.checked ? `<span class="cell ${cls}" aria-label="${esc(c.guessLbl[2])}">${sk}</span>` : `<button class="cell" data-act="gc" data-i="${i}" aria-label="${esc(c.hdS)}: ${esc(c.guessLbl[gs])}">${sk}</button>`}`;
  });
  h += `</div><div class="sc-act">${S.checked ? `<button class="btn ghost" data-act="retry">${esc(c.retry)}</button>` : `<button class="btn" data-act="chk" ${g < 7 ? 'disabled' : ''}>${esc(c.check)}</button>`}</div>`;
  $('c3').innerHTML = h;
  lab.setReadout(seen, c.sub, c.pill(g), '#e0b050');
  const k = S.guess.filter((x) => x === 2).length;
  if (j >= 0) lab.setState({ emo: J[j].e, title: J[j].n, lead: J[j].a, body: S.checked ? `${c.skin}: ${J[j].s}` : '' });
  else if (S.checked) lab.setState({ emo: '🦠', title: c.score(k), lead: c.sumL, body: c.sumB });
  else lab.setState({ emo: '✅', title: c.t0, lead: c.l0, body: '' });
  lab.setFacts([t.f.mic1, t.f.mic2, t.f.para2]);
}
function renderBact(t) {
  const k = t.bk;
  lab.setGlow('rgba(143, 127, 208, .28)');
  $('cs').innerHTML = chip('look', S.look ? k.wash : k.stain);
  lab.setReadout(k.val, k.sub, k.pill, '#8f7fd0');
  lab.setState(S.look ? { emo: '🧬', title: k.t1, lead: k.l1, body: k.b1 } : { emo: '🧫', title: k.t0, lead: k.l0, body: '' });
  lab.setFacts([t.f.bact1, t.f.bact2]);
}
function renderYeast(t) {
  const k = t.yk;
  lab.setGlow('rgba(224, 176, 80, .3)');
  $('cs').innerHTML = chip('sugar', S.sugar ? k.stop : k.sugar);
  lab.setReadout(YS.cells.length, k.sub, k.pills[S.sugar ? 1 : 0], '#d9a85f');
  lab.setState(S.sugar ? { emo: '🫧', title: k.t1, lead: k.l1, body: '' } : { emo: '🍞', title: k.t0, lead: k.l0, body: '' });
  lab.setFacts([t.f.y1, t.f.y2, t.f.y3]);
}
render();
</script>
