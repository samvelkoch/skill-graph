<meta charset="utf-8">

<title>Robot Lab · Skill Graph</title>
<meta name="description" content="Program a robot with arrows, loops and a sensor, find bugs and take a robot quiz. An interactive explorer for the skill graph, in Russian, Hungarian and English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
  :root {
    --bg: #0A0E18; --panel: rgba(16, 21, 34, .82); --panel2: rgba(26, 32, 50, .9);
    --stroke: rgba(130, 145, 190, .16); --stroke2: rgba(130, 145, 190, .35);
    --ink: #EDEFF7; --body: #C6CDE0; --mut: #98A0B8; --faint: #646C84;
    --red: #FF3B30; --ok: #3ddc97; --wip: #f5c84c; --blue: #4cc3f5; --violet: #a98bff;
    --c-move: #3b82f6; --c-turn: #14b8a6; --c-loop: #f59e0b; --c-sense: #a855f7;
    --serif: 'EB Garamond', Georgia, serif; --sans: 'Nunito', ui-rounded, ui-sans-serif, system-ui, sans-serif;
    --z: 1; --k: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% 30%, rgba(40, 110, 140, .22), transparent 70%), var(--bg);
    color: var(--body); font: 600 16px/1.45 var(--sans); min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }

  header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }
  #brand { font: 900 24px/1 var(--sans); letter-spacing: -.035em; text-transform: uppercase; color: #fff; text-decoration: none; }
  #brand i { font-style: normal; color: var(--red); }
  #brand small { display: block; font: 700 10.5px/1.2 var(--sans); letter-spacing: .14em; color: var(--mut); margin-top: 4px; }
  .tag { display: none; font: 500 24px/1.1 var(--serif); color: var(--ink); margin-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tag i { color: var(--red); font-style: normal; }
  .foot { padding: 4px 24px 30px; max-width: 1400px; margin: 0 auto; color: var(--faint); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .foot b { color: var(--mut); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: 10.5px; }
  .foot a { color: var(--body); text-decoration: none; border-bottom: 1px solid var(--stroke2); }
  .foot .lic { flex-basis: 100%; font-size: 11px; }
  .grow { flex: 1; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--stroke); border-radius: 999px; padding: 4px; gap: 2px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 14px; color: var(--mut); white-space: nowrap; }
  .seg button.on { background: var(--red); color: #fff; }
  .iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--stroke); background: var(--panel); font-size: 17px; }

  .hero { padding: 8px 24px 0; max-width: 1400px; margin: 0 auto; }
  h1 { font: 500 clamp(36px, 5.4vw, 76px)/1.02 var(--serif); color: var(--ink); margin: 0 0 10px; letter-spacing: -.01em; }
  h1 i { color: var(--red); font-style: normal; }
  .lead { color: var(--mut); margin: 0; max-width: 640px; }
  .lead b { color: var(--ink); }

  main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; gap: 16px; padding: 14px 24px 28px; max-width: 1400px; margin: 0 auto; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--stroke); border-radius: 22px; padding: 16px; backdrop-filter: blur(10px); }
  .kick { font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .card h2 { font: 500 28px/1.1 var(--serif); color: var(--ink); margin: 4px 0 12px; }
  .card p { margin: 0 0 10px; }
  .concept { border-left: 3px solid var(--red); padding: 2px 0 2px 12px; color: var(--ink); font-size: 15px; margin-top: 4px !important; }
  .fact { margin-top: 12px; background: var(--panel2); border-radius: 14px; padding: 10px 12px; font-size: 14px; line-height: 1.4; }
  .fact .kick { color: var(--blue); }
  .stars { font-size: 17px; letter-spacing: 1px; white-space: nowrap; }
  .stars .off { opacity: .2; }

  /* mission checklist */
  .mission { list-style: none; margin: 6px 0 8px; padding: 0; display: grid; gap: 6px; }
  .mission li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--panel2); border: 1px solid transparent; color: var(--ink); font-weight: 800; font-size: 15px; line-height: 1.25; transition: border-color .2s, background .2s; }
  .mission .cb { flex: none; width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--stroke2); display: grid; place-items: center; font-size: 15px; font-weight: 900; color: #05210f; }
  .mission li.ok { border-color: rgba(61, 220, 151, .55); background: rgba(61, 220, 151, .12); }
  .mission li.ok .cb { background: var(--ok); border-color: var(--ok); }
  .mission li.no { border-color: rgba(255, 59, 48, .55); }
  .mission b { color: var(--wip); white-space: nowrap; }
  .parline { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--mut); font-size: 13px; margin: 0 2px 12px; }

  /* scene */
  .scene { position: relative; min-width: 0; }
  .goal { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 10px 16px; border-radius: 16px; background: linear-gradient(90deg, rgba(61, 220, 151, .16), rgba(61, 220, 151, .04)); border: 1px solid rgba(61, 220, 151, .4); color: var(--ink); font-weight: 800; font-size: 18px; line-height: 1.25; }
  .goal .em { font-size: 24px; }
  .boardwrap { background: rgba(8, 12, 22, .65); border: 1px solid var(--stroke); border-radius: 26px; padding: 14px; }
  svg.board { display: block; width: 100%; height: auto; max-height: 62vh; touch-action: manipulation; }
  .cell { fill: #1b2440; stroke: #0A0E18; stroke-width: 4; }
  .cell.alt { fill: #212c4d; }
  .wall { fill: #46537d; }
  .wall-top { fill: #6676a8; }
  .pit { fill: #05070d; }
  .pit-rim { fill: none; stroke: #33406a; stroke-width: 5; }
  .fog { fill: #070a12; transition: opacity .35s; }
  .fog.gone { opacity: 0; }
  .goal-ring { fill: none; stroke: var(--ok); stroke-width: 4; stroke-dasharray: 10 8; animation: spin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .item { transition: transform .3s, opacity .3s; transform-box: fill-box; transform-origin: center; }
  .item.got { transform: scale(1.8) translateY(-14px); opacity: 0; }
  .bot { transition: transform calc(.32s * var(--k)) cubic-bezier(.4, .1, .3, 1); }
  .bot-rot { transition: transform calc(.28s * var(--k)) ease-in-out; }
  .bot.bump .bot-body { animation: bump .35s; }
  @keyframes bump { 30% { transform: translateY(-14px); } 60% { transform: translateY(4px); } }
  .bot.fall .bot-rot { transform: scale(.1) rotate(540deg) !important; opacity: 0; transition: transform .6s ease-in, opacity .6s; }
  .bot.win .bot-body { animation: hop .5s 3; }
  @keyframes hop { 50% { transform: translateY(-16px); } }
  .beam { fill: #ffe27a; opacity: .3; }
  .ray { stroke: var(--violet); stroke-width: 6; stroke-linecap: round; opacity: 0; transition: opacity .2s; }
  .ray.on { opacity: .9; }
  .ray.hit { stroke: var(--red); }
  .trail { fill: var(--blue); opacity: .28; }
  .qlab circle { fill: var(--wip); stroke: #0A0E18; stroke-width: 4; transition: fill .3s; }
  .qlab text { font: 900 36px var(--sans); fill: #0A0E18; }
  .qlab.right circle { fill: var(--ok); }
  .qlab.dim { opacity: .35; }

  .msg { min-height: 52px; margin-top: 10px; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--stroke); color: var(--ink); line-height: 1.3; }
  .msg.good { border-color: rgba(61, 220, 151, .6); background: rgba(61, 220, 151, .1); }
  .msg.bad { border-color: rgba(255, 59, 48, .55); }
  .msg .em { font-size: 24px; }
  .msg .tx { flex: 1; }
  .nextbtn { flex: none; border: 0; background: var(--ok); color: #05210f; border-radius: 999px; padding: 9px 18px; font-weight: 900; white-space: nowrap; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(61, 220, 151, .22); } }

  /* brain inset */
  .brain { margin-top: 10px; background: rgba(10, 14, 24, .9); border: 1px solid var(--stroke2); border-radius: 18px; padding: 8px 12px 10px; font-size: 13px; z-index: 2; }
  .brain .live { font-size: 10px; font-weight: 900; letter-spacing: .14em; color: var(--mut); }
  .brain .live::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-right: 6px; vertical-align: 1px; }
  .flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 6px; margin-top: 6px; }
  .scene.inside .flow { grid-template-columns: 1fr; }
  .node { display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-radius: 12px; background: var(--panel2); border: 1px solid transparent; transition: border-color .15s, box-shadow .15s; min-width: 0; }
  .node .ic { font-size: 20px; }
  .node .lb { font-size: 11px; color: var(--faint); font-weight: 900; text-transform: uppercase; letter-spacing: .08em; }
  .node .vl { color: var(--ink); font-weight: 800; line-height: 1.2; }
  .node.lit { border-color: var(--violet); box-shadow: 0 0 18px rgba(169, 139, 255, .45); }
  .node.lit.n-act { border-color: var(--blue); box-shadow: 0 0 18px rgba(76, 195, 245, .45); }
  .node.lit.n-think { border-color: var(--wip); box-shadow: 0 0 18px rgba(245, 200, 76, .4); }
  .arrow { text-align: center; color: var(--faint); line-height: .6; font-size: 12px; transform: rotate(-90deg); }
  .scene.inside .arrow { transform: none; }
  .brain .why { display: none; color: var(--mut); margin: 8px 0 0; }
  .scene.inside .brain { position: absolute; top: 50%; left: 50%; margin: 0; width: min(440px, 92%); transform: translate(-50%, -60%); padding: 18px 20px; font-size: 15px; }
  .scene.inside .brain .why { display: block; }
  .scene.inside .node { padding: 12px 14px; }
  .scene.inside .node .ic { font-size: 30px; }
  .scene.inside svg.board { opacity: .35; filter: blur(2px); }

  /* program */
  .palette { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0 12px; }
  .pb { position: relative; border: 0; border-radius: 12px; padding: 8px 11px; font-weight: 800; font-size: 15px; color: #fff; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
  .pb:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
  .pb .new { position: absolute; top: -8px; right: -6px; background: var(--red); font-size: 9px; padding: 2px 5px; border-radius: 6px; letter-spacing: .06em; }
  .k-fwd { background: var(--c-move); } .k-left, .k-right { background: var(--c-turn); }
  .k-rep, .k-forever { background: var(--c-loop); } .k-ifwall { background: var(--c-sense); }
  .prog { min-height: 120px; background: rgba(5, 8, 15, .55); border: 1px dashed var(--stroke2); border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 5px; max-height: 46vh; overflow: auto; margin-top: 6px; }
  .prog .empty { color: var(--faint); font-size: 13px; margin: 2px 4px 6px; line-height: 1.4; }
  .blk { border-radius: 11px; color: #fff; font-weight: 800; font-size: 14.5px; flex: none; }
  .blk > .hd { display: flex; align-items: center; gap: 6px; padding: 5px 7px 5px 11px; min-height: 34px; cursor: pointer; }
  .blk .x { margin-left: auto; border: 0; background: rgba(0, 0, 0, .25); width: 24px; height: 24px; border-radius: 50%; font-size: 14px; line-height: 1; flex: none; }
  .blk .num { border: 0; background: rgba(255, 255, 255, .92); color: #7a4a00; border-radius: 8px; min-width: 28px; padding: 2px 6px; font-weight: 900; text-align: center; }
  .blk .iter { background: rgba(0, 0, 0, .3); border-radius: 8px; padding: 1px 7px; font-size: 12.5px; }
  .blk .iter:empty { display: none; }
  .blk .body { margin: 0 0 6px 14px; padding: 5px; background: rgba(5, 8, 15, .55); border-radius: 10px; display: flex; flex-direction: column; gap: 5px; }
  .blk.run { outline: 3px solid #fff; outline-offset: 1px; }
  .blk.err { outline: 3px solid var(--red); outline-offset: 1px; box-shadow: 0 0 16px rgba(255, 59, 48, .6); }
  .ro .hd { cursor: default; }
  .cursor { flex: none; height: 4px; border-radius: 2px; background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, .7); margin: 1px 2px; }
  .slot { border: 2px dashed var(--stroke2); border-radius: 10px; padding: 4px 10px; color: var(--faint); font-size: 13px; background: none; text-align: left; flex: none; }
  .slot.target { border-color: #fff; color: var(--ink); background: rgba(255, 255, 255, .06); }
  .count { display: flex; justify-content: space-between; color: var(--mut); font-size: 13px; margin-top: 6px; }
  .count .over { color: var(--red); }
  .controls { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 8px; margin-top: 8px; }
  .ctl { border: 1px solid var(--stroke2); background: var(--panel2); border-radius: 14px; padding: 9px 6px; font-weight: 900; color: var(--ink); }
  .ctl.go { background: var(--ok); color: #05210f; border-color: transparent; font-size: 17px; }
  .ctl:disabled { opacity: .4; cursor: default; }
  .tools { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .tools .kick { margin-right: -2px; }
  .tools .seg { padding: 3px; }
  .tools .seg button { padding: 5px 11px; font-size: 13px; }
  .tools .seg button.on { background: #fff; color: #0A0E18; }
  .tools .ctl { margin-left: auto; padding: 6px 12px; font-size: 13px; border-radius: 999px; }
  .running .prog, .running .palette { pointer-events: none; }
  .running .palette { opacity: .5; }
  .hint { margin-top: 8px; color: var(--faint); font-size: 12px; line-height: 1.35; }

  /* level chips */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 24px 0; max-width: 1400px; margin: 0 auto; }
  .chip { border: 1px solid var(--stroke); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px; color: var(--body); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .chip .n { color: var(--faint); font-weight: 900; }
  .chip.on { background: #fff; color: #0A0E18; }
  .chip.on .n { color: #646C84; }
  .chip .s { color: var(--wip); font-size: 12px; letter-spacing: -1px; }
  .chip.on .s { color: #c98a00; }
  .chip.locked { color: var(--faint); }

  /* class quiz */
  .quiz { display: none; margin: 14px 24px 28px; max-width: 1352px; padding: 22px 26px; }
  .quizmode .quiz { display: flex; flex-direction: column; }
  .quizmode main, .quizmode .chips, .quizmode .hero { display: none; }
  .qz-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .qz-head .kick { font-size: 13px; color: var(--mut); }
  .qz-dots { display: flex; gap: 6px; margin-left: auto; }
  .qz-dots span { width: 14px; height: 14px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--stroke2); }
  .qz-dots .r { background: var(--ok); border-color: var(--ok); }
  .qz-dots .w { background: var(--red); border-color: var(--red); }
  .qz-dots .cur { border-color: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .2); }
  .qz-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; align-items: center; margin-top: 14px; }
  .qz-body.pic { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
  .qz-pic { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(170px, 1fr); gap: 14px; align-items: center; min-height: 0; }
  .qz-pic .boardwrap { display: block; flex: none; }
  .qz-pic svg.board { height: auto; max-height: calc(52vh / var(--z)); }
  .qz-pic .prog { max-height: none; min-height: 0; }
  .qz-pic .blk { font-size: 16px; }
  .qz-main { max-width: 900px; width: 100%; margin: 0 auto; }
  .quiz h2 { font: 500 clamp(26px, 2.9vw, 40px)/1.12 var(--serif); margin: 0 0 18px; }
  .qz-ans { display: grid; gap: 10px; }
  .qz-ans button { display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--stroke2); background: var(--panel2); border-radius: 16px; padding: 12px 16px; font-weight: 800; font-size: 19px; line-height: 1.25; color: var(--ink); }
  .qz-ans button .l { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--wip); color: #0A0E18; display: grid; place-items: center; font-weight: 900; }
  .qz-ans button:disabled { cursor: default; opacity: .55; }
  .qz-ans button.right { background: rgba(61, 220, 151, .25); border-color: var(--ok); opacity: 1; }
  .qz-ans button.right .l { background: var(--ok); }
  .qz-ans button.wrong { background: rgba(255, 59, 48, .2); border-color: var(--red); opacity: 1; text-decoration: line-through; }
  .qz-why { margin-top: 14px; padding: 12px 16px; border-radius: 16px; background: rgba(76, 195, 245, .1); border: 1px solid rgba(76, 195, 245, .4); color: var(--ink); font-size: 17px; line-height: 1.35; }
  .qz-foot { display: flex; align-items: center; gap: 14px; margin-top: 14px; min-height: 46px; color: var(--mut); font-size: 15px; }
  .qz-foot .big { margin-left: auto; }
  .big { border: 0; background: #fff; color: #0A0E18; border-radius: 999px; padding: 11px 24px; font-weight: 900; white-space: nowrap; }
  .big.alt { background: var(--panel2); color: var(--ink); border: 1px solid var(--stroke2); }
  .qz-end { margin: auto; text-align: center; }
  .qz-end .cup { font-size: 80px; line-height: 1; }
  .qz-end h2 { margin: 10px 0 8px; }
  .qz-end p { font-size: 19px; color: var(--body); margin: 0 0 20px; }
  .qz-end .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .qz-n { display: grid; gap: 2px; min-width: 120px; padding: 14px 20px; border-radius: 20px; }
  .qz-n b { font: 500 44px/1 var(--serif); }
  .qz-n small { font-size: 13px; font-weight: 800; }
  .qz-dots { flex-wrap: wrap; justify-content: flex-end; }

  /* modal */
  .modal { position: fixed; inset: 0; background: rgba(4, 6, 12, .7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal.open { display: flex; }
  .dlg { zoom: var(--z); background: #111727; border: 1px solid var(--stroke2); border-radius: 24px; padding: 26px; width: min(560px, 100%); text-align: center; }
  .dlg h3 { font: 500 30px/1.15 var(--serif); color: var(--ink); margin: 8px 0 18px; }
  .dlg .ans { display: grid; gap: 8px; }
  .dlg .ans button { border: 1px solid var(--stroke2); background: var(--panel2); border-radius: 14px; padding: 13px; font-weight: 800; color: var(--ink); }
  .dlg .ans button.right { background: rgba(61, 220, 151, .25); border-color: var(--ok); }
  .dlg .ans button.wrong { background: rgba(255, 59, 48, .2); border-color: var(--red); }
  .dlg .big { margin-top: 18px; }
  .dlg .prize { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dlg .prize div { background: var(--panel2); border-radius: 16px; padding: 14px; border: 1px solid var(--stroke2); }
  .dlg .prize b { display: block; font-size: 30px; }
  .dots { margin-top: 14px; letter-spacing: 4px; color: var(--faint); }
  .dots .on { color: var(--red); }

  /* big screen: the whole lab on one screen, no page scroll */
  @media (min-width: 1000px) and (min-height: 600px) {
    html, body { height: 100%; overflow: hidden; }
    .app { zoom: var(--z); height: calc(100vh / var(--z)); display: flex; flex-direction: column; }
    header { padding: 10px 20px 8px; flex-wrap: nowrap; }
    .hero { display: none; }
    .tag { display: block; flex: 0 1 auto; }
    .chips { flex-wrap: nowrap; padding: 0 20px 10px; max-width: none; margin: 0; width: 100%; }
    .chip:not(.on) .nm { display: none; }
    main { flex: 1; min-height: 0; width: 100%; max-width: none; margin: 0; padding: 0 20px 8px; align-items: stretch;
      grid-template-columns: clamp(240px, 21vw, 300px) minmax(0, 1fr) clamp(310px, 26vw, 370px); }
    #info, #code { min-height: 0; overflow: auto; }
    #code { display: flex; flex-direction: column; }
    .prog { flex: 1 1 0; min-height: 90px; max-height: none; }
    .scene { display: flex; flex-direction: column; min-height: 0; }
    .boardwrap { flex: 1; min-height: 0; display: flex; }
    svg.board { flex: 1; min-width: 0; min-height: 0; height: 100%; max-height: none; }

// ENGINE START (pure: no DOM; tested by scripts/test-robot-lab.mjs)
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // up, right, down, left
const TICK_LIMIT = 600;

function parseMap(rows) {
  const L = { w: rows[0].length, h: rows.length, walls: new Set(), pits: new Set(), items: [], goal: null, start: null };
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    const k = x + ',' + y;
    if (ch === '#') L.walls.add(k);
    else if (ch === 'o') L.pits.add(k);
    else if (ch === '*') L.items.push(k);
    else if (ch === 'G') L.goal = k;
    else if ('^>v<'.includes(ch)) L.start = { x, y, d: '^>v<'.indexOf(ch) };
  }));
  return L;
}

function newState(L) {
  return { x: L.start.x, y: L.start.y, d: L.start.d, got: new Set(), ticks: 0, end: false, win: false, fail: null };
}

function blocked(L, x, y) {
  return x < 0 || y < 0 || x >= L.w || y >= L.h || L.walls.has(x + ',' + y);
}

function wallAhead(L, S) {
  const [dx, dy] = DIRS[S.d];
  return blocked(L, S.x + dx, S.y + dy);
}

function forward(L, S) {
  const [dx, dy] = DIRS[S.d], nx = S.x + dx, ny = S.y + dy;
  if (blocked(L, nx, ny)) { S.fail = 'bump'; S.end = true; return; }
  S.x = nx; S.y = ny;
  const k = nx + ',' + ny;
  if (L.pits.has(k)) { S.fail = 'fall'; S.end = true; return; }
  if (L.items.includes(k)) S.got.add(k);
  if (k === L.goal && S.got.size === L.items.length) { S.win = true; S.end = true; }
}

function* tick(S, ev) {
  if (++S.ticks > TICK_LIMIT) { S.fail = 'long'; S.end = true; }
  yield ev;
}

// Runs a program (array of blocks) on the level, yielding one event per visible step.
function* execute(L, S, body) {
  for (const n of body) {
    if (S.end) return;
    if (n.t === 'fwd') { forward(L, S); yield* tick(S, { n, ev: 'move' }); }
    else if (n.t === 'left') { S.d = (S.d + 3) % 4; yield* tick(S, { n, ev: 'turn', turn: -1 }); }
    else if (n.t === 'right') { S.d = (S.d + 1) % 4; yield* tick(S, { n, ev: 'turn', turn: 1 }); }
    else if (n.t === 'rep') {
      for (let i = 0; i < n.n && !S.end; i++) { yield* tick(S, { n, ev: 'loop', i }); yield* execute(L, S, n.body); }
    } else if (n.t === 'forever') {
      while (!S.end) { yield* tick(S, { n, ev: 'loop' }); yield* execute(L, S, n.body); }
    } else if (n.t === 'ifwall') {
      const w = wallAhead(L, S);
      yield* tick(S, { n, ev: 'sense', wall: w });
      if (w) yield* execute(L, S, n.body);
    }
  }
}

function countBlocks(body) {
  return body.reduce((s, n) => s + 1 + (n.body ? countBlocks(n.body) : 0), 0);
}

function runAll(L, body) {
  const S = newState(L);
  for (const _ of execute(L, S, body)) { /* drain */ }
  return S;
}

function starsFor(level, blocks) {
  return blocks <= level.par ? 3 : blocks <= level.par + 2 ? 2 : 1;
}

// Shorthand for programs in level solutions: 'F' fwd, 'L' left, 'R' right, [n, ...] repeat, ['loop', ...] forever, ['wall', ...] if wall.
function prog(spec) {
  return spec.map((s) => {
    if (s === 'F') return { t: 'fwd' };
    if (s === 'L') return { t: 'left' };
    if (s === 'R') return { t: 'right' };
    if (Array.isArray(s) && typeof s[0] === 'number') return { t: 'rep', n: s[0], body: prog(s.slice(1)) };
    if (Array.isArray(s) && s[0] === 'loop') return { t: 'forever', body: prog(s.slice(1)) };
    if (Array.isArray(s) && s[0] === 'wall') return { t: 'ifwall', body: prog(s.slice(1)) };
    throw new Error('bad spec ' + s);
  });
}

const botSvg = (id) => `<g class="bot" id="${id}"><g class="bot-rot" id="${id}Rot"><g class="bot-body">
      <path class="beam" d="M-12 -34 L-27 -76 Q0 -86 27 -76 L12 -34 Z"/>
      <rect x="-36" y="-26" width="14" height="52" rx="6" fill="#20283f"/><rect x="22" y="-26" width="14" height="52" rx="6" fill="#20283f"/>
      <rect x="-27" y="-30" width="54" height="58" rx="16" fill="#e9edf7"/>
      <rect x="-20" y="-22" width="40" height="24" rx="10" fill="#0e1424"/>
      <circle cx="-9" cy="-10" r="5" fill="#4cc3f5"/><circle cx="9" cy="-10" r="5" fill="#4cc3f5"/>
      <path d="M-8 12 Q0 18 8 12" stroke="#98a0b8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="0" y2="-42" stroke="#e9edf7" stroke-width="4"/><circle cx="0" cy="-44" r="6" fill="#FF3B30"/>
    </g></g></g>`;
function cellsSvg(M, lv) {

    const k = x + ',' + y, X = x * C, Y = y * C;
    if (M.walls.has(k)) h += `<rect class="wall" x="${X + 6}" y="${Y + 10}" width="${C - 12}" height="${C - 14}" rx="14"/><rect class="wall-top" x="${X + 6}" y="${Y + 4}" width="${C - 12}" height="${C - 22}" rx="14"/>`;
    else {
      h += `<rect class="cell${(x + y) % 2 ? ' alt' : ''}" x="${X}" y="${Y}" width="${C}" height="${C}" rx="16"/>`;
      if (M.pits.has(k)) h += `<circle class="pit" cx="${X + 50}" cy="${Y + 50}" r="34"/><circle class="pit-rim" cx="${X + 50}" cy="${Y + 50}" r="36"/>`;
      if (k === M.goal) h += `<circle class="goal-ring" cx="${X + 50}" cy="${Y + 50}" r="40"/><text x="${X + 50}" y="${Y + 66}" font-size="46" text-anchor="middle">${lv.goal}</text>`;
      if (M.items.includes(k)) h += `<text class="item" id="it-${x}-${y}" x="${X + 50}" y="${Y + 66}" font-size="44" text-anchor="middle">${lv.item}</text>`;

}

  if (lv.dark) for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) h += `<rect class="fog" id="fog-${x}-${y}" x="${x * C - 1}" y="${y * C - 1}" width="${C + 2}" height="${C + 2}"/>`;
  svg.innerHTML = h;

}
function placeBot(instant) {

  b.style.transform = `translate(${S.x * C + 50}px, ${S.y * C + 50}px)`;

}
function reveal() {
  if (!level().dark) return;

}
function addTrail(x, y) {

}
function showRay(wall) {
  const ray = $('ray'), [dx, dy] = DIRS[S.d], x = S.x * C + 50, y = S.y * C + 50;
  ray.setAttribute('x1', x + dx * 30); ray.setAttribute('y1', y + dy * 30);
  ray.setAttribute('x2', x + dx * 85); ray.setAttribute('y2', y + dy * 85);

  const fx = S.x + dx, fy = S.y + dy;
  if (fx >= 0 && fy >= 0 && fx < L.w && fy < L.h) { seen.add(fx + ',' + fy); reveal(); }
}

// ---- brain inset ----
function brain(ev) {
  const lit = (k) => (ev.ev === 'sense' && k === 'sense') || (ev.ev && k === 'think') || ((ev.ev === 'move' || ev.ev === 'turn') && k === 'act') ? ' lit' : '';
  const sense = ev.ev === 'sense' ? (ev.wall ? u.wallY : u.wallN) : u.idle;
  let think = u.idle;
  if (ev.n) {
    think = BLOCKS[ev.n.t].ic + ' ' + u.blk[ev.n.t] + (ev.n.t === 'rep' ? ` ${ev.n.n}` : '');
    if (ev.ev === 'loop') think += ' · ' + (ev.n.t === 'rep' ? u.loopI(ev.i, ev.n.n) : u.loopF);
  }
  const act = ev.ev === 'move' ? u.mv.move : ev.ev === 'turn' ? u.mv[ev.turn] : u.mv.stop;
  $('brain').innerHTML = `<div class="live">${u.live}</div><div class="flow">
    <div class="node n-sense${lit('sense')}"><span class="ic">📡</span><div><div class="lb">${u.sensor}</div><div class="vl">${esc(sense)}</div></div></div>
    <div class="arrow">▼</div>

// ---- program editor ----
function findBody(id, body = program) {
  if (id === 'root') return program;
  for (const n of body) {
    if (n.id === id) return n.body;
    if (n.body) { const r = findBody(id, n.body); if (r) return r; }
  }
  return null;
}
// where a block lives: its body, its index there and the id of that body's owner
function locate(id, body = program, pid = 'root') {
  for (let i = 0; i < body.length; i++) {
    if (body[i].id === id) return { body, i, pid };
    if (body[i].body) { const r = locate(id, body[i].body, body[i].id); if (r) return r; }
  }
  return null;
}
function addBlock(t) {
  const lv = level(), n = { t, id: 'b' + (++uid) };
  if (BLOCKS[t].box) n.body = [];
  if (t === 'rep') n.n = 3;
  let into = findBody(target.id);
  if (!into) { into = program; target = { id: 'root', idx: null }; }
  into.splice(target.idx ?? into.length, 0, n);
  if (n.body) target = { id: n.id, idx: null };
  else if (target.idx != null) target.idx++;
  beep(660, 0.05);
  resetRobot(); renderProgram();
  $('prog').querySelector(`.blk[data-id="${n.id}"]`)?.scrollIntoView({ block: 'nearest' });
  if (lv.max && countBlocks(program) > lv.max) say(u.msg.over(lv.max), 'bad');
}
function deleteBlock(id) {
  const loc = locate(id);
  if (!loc) return;
  loc.body.splice(loc.i, 1);
  target = { id: loc.pid, idx: loc.i < loc.body.length ? loc.i : null }; // the next block lands where this one was
  resetRobot(); renderProgram();
}
function clearProgram() {
  stop();
  program.length = 0;
  if (level().preset) program.push(...tag(prog(level().preset)));
  target = { id: 'root', idx: null };
  resetRobot(); renderProgram(); say(readyMsg());
}
function blockHtml(n, ro) {
  const b = BLOCKS[n.t], label = u.blk[n.t];
  let hd = `${b.ic} ${esc(label)}`;
  if (n.t === 'rep') hd += ` ${ro ? `<span class="num">${n.n}</span>` : `<button class="num" data-num="${n.id}">${n.n}</button>`} ${esc(u.blk.times)}`;
  if (n.body && !ro) hd += ` <span class="iter" id="iter-${n.id}"></span>`;
  const x = ro ? '' : `<button class="x" data-del="${n.id}" aria-label="×">×</button>`;
  const open = `<div class="blk k-${n.t}"${ro ? '' : ` data-id="${n.id}"`}><div class="hd">${hd}${x}</div>`;
  if (!n.body) return open + '</div>';
  if (ro) return `${open}<div class="body">${n.body.map((c) => blockHtml(c, true)).join('')}</div></div>`;
  return `${open}<div class="body">${listHtml(n.body, n.id)}
    <button class="slot${target.id === n.id && target.idx == null ? ' target' : ''}" data-target="${n.id}">${esc(u.slot)}</button></div></div>`;
}
function listHtml(body, id) {
  return body.map((n, i) => (target.id === id && target.idx === i ? '<div class="cursor"></div>' : '') + blockHtml(n)).join('');
}
function renderProgram() {

}
function renderPalette() {

  $('palette').innerHTML = lv.blocks.map((t) =>
    `<button class="pb k-${t}" data-add="${t}">${BLOCKS[t].ic} ${esc(u.blk[t])}${!lv.secret && !prev.has(t) && lvlIdx > 0 ? `<span class="new">${u.newB}</span>` : ''}</button>`).join('');

  document.querySelectorAll('.blk.run').forEach((e) => e.classList.remove('run'));

// ---- run ----
function say(text, kind = '', extra = '') {
  const em = kind === 'good' ? '🎉' : kind === 'bad' ? '🤖' : '💡';
  $('msg').className = 'msg ' + kind;
  $('msg').innerHTML = `<span class="em">${em}</span><span class="tx">${text}</span>${extra}`;
}
function begin() {
  if (!program.length) { say(u.msg.empty, 'bad'); return false; }
  const lv = level();
  if (lv.max && countBlocks(program) > lv.max) { say(u.msg.over(lv.max), 'bad'); return false; }
  if (!runner || S.end) { resetRobot(); runner = execute(L, S, program); }
  return true;
}
function stepOnce() {
  const r = runner.next();
  if (r.done) { finish(); return false; }
  const ev = r.value;
  if (ev.ev !== 'loop') lastNode = ev.n;
  flashBlock(ev.n); brain(ev);
  if (ev.ev === 'loop') { const it = $('iter-' + ev.n.id); if (it) it.textContent = ev.n.t === 'rep' ? `${ev.i + 1} / ${ev.n.n}` : '↻'; }
  if (ev.ev === 'move') {
    if (S.fail === 'bump') {
      $('bot').classList.add('bump'); beep(110, 0.25, 'sawtooth', 0.06);
    } else {
      addTrail(S.x - DIRS[S.d][0], S.y - DIRS[S.d][1]);
      visited.add(S.x + ',' + S.y); reveal();
      placeBot(); beep(420, 0.05);
      const it = $(`it-${S.x}-${S.y}`);
      if (it && !it.classList.contains('got')) { it.classList.add('got'); tune([880, 1320]); }
      if (S.fail === 'fall') setTimeout(() => { $('bot').classList.add('fall'); beep(200, 0.5, 'sine', 0.06); }, 300);
    }
  } else if (ev.ev === 'turn') { rot += ev.turn * 90; placeBot(); beep(520, 0.04); }
  else if (ev.ev === 'sense') { showRay(ev.wall); beep(ev.wall ? 300 : 900, 0.04, 'sine'); }
  renderMission();
  if (S.end) { setTimeout(finish, 350); return false; }
  return ev;
}
function delay(ev) { return (ev === 'loop' ? 120 : ev === 'sense' ? 260 : 380) / speed; }
function play() {
  if (timer) { stop(); return; }
  if (!begin()) return;
  document.body.classList.add('running');
  $('run').textContent = u.stop;
  const loop = () => {
    const ev = stepOnce();
    if (!ev) { stop(); return; }
    timer = setTimeout(loop, delay(ev.ev) * ($('scene').classList.contains('inside') ? 1.8 : 1));
  };
  loop();
}
function stop() {
  clearTimeout(timer); timer = null;
  document.body.classList.remove('running');
  if ($('run')) $('run').textContent = u.run;
}
function nextIdx() {
  for (let i = lvlIdx + 1; i < LEVELS.length; i++) if (!LEVELS[i].secret || unlocked) return i;
  return -1;
}
function finish() {
  stop(); flashBlock(null); brain({});
  const lv = level();
  if (S.win) {
    const n = countBlocks(program), s = starsFor(lv, n), nx = nextIdx();
    if (s > (stars[lv.id] ?? 0)) { stars[lv.id] = s; store.set('stars', stars); }
    $('bot').classList.add('win'); tune([523, 659, 784, 1046]);
    say(`${u.msg.win(s)} ${s === 3 ? u.msg.win3 : u.msg.winMore(lv.par)}`, 'good',
      nx >= 0 ? `<button class="nextbtn" data-lvl="${nx}">${esc(u.next)} →</button>` : `<button class="nextbtn" data-v="quiz">${esc(u.quizTab)} →</button>`);
    renderChips(); renderInfo();
  } else if (S.fail) {
    if (lastNode && S.fail !== 'long') document.querySelector(`.blk[data-id="${lastNode.id}"]`)?.classList.add('err');
    say(u.msg[S.fail] + (lastNode && S.fail !== 'long' ? ' ' + u.msg.errBlock : ''), 'bad');
  } else say(S.x + ',' + S.y === L.goal ? u.msg.missing : u.msg.stopped, 'bad');
  renderMission(true);
  runner = null;
}

  let h = '';
  if (all) h += row(got === all, ended && !S.win && got < all, lv.item, `${esc(u.mCollect)} <b>${got} / ${all}</b>`);
  h += row(S.win, ended && !S.win && !here, lv.goal, esc(u.mGoal));

// ---- class quiz (its own tab): the whole group votes, one tap shows the answer and why ----
let qz = { set: null, i: 0, marks: [], picked: null }, qTimer = null; // set: the questions of this round (indexes into CQ), null = choosing the length

      return `<g class="qlab${done ? (n - 1 === c.ok ? ' right' : ' dim') : ''}"><circle cx="${x * C + 50}" cy="${y * C + 50}" r="30"/><text x="${x * C + 50}" y="${y * C + 63}" text-anchor="middle">${n}</text></g>`; }).join('');
    pic = `<div class="qz-pic"><div class="boardwrap"><svg class="board" viewBox="0 0 ${M.w * C} ${M.h * C}">${cellsSvg(M, {})}${labs}${botSvg('qbot')}</svg></div>
      <div class="prog ro">${prog(c.pic.prog).map((n) => blockHtml(n, true)).join('')}</div></div>`;

      <div class="qz-ans">${ans.map((a, i) => `<button data-cqa="${i}"${cls(i)}${done ? ' disabled' : ''}><span class="l">${i + 1}</span><span>${esc(a)}</span></button>`).join('')}</div>
      ${done ? `<div class="qz-why">${qz.picked === c.ok ? '✅ ' + esc(u.right) : '💡'} ${esc(why)}</div>` : ''}
      <div class="qz-foot">${done ? `<button class="big" data-cq="next">${esc(qz.i + 1 < N ? u.next : u.cqFinish)} →</button>` : `<span>🙋 ${esc(u.cqVote)}</span>`}</div>
    </div></div>`;

// the quiz picture: the robot stands at the start; after the answer it runs the program so everyone sees where it ends
function miniRun(pic, go) {
  const M = parseMap(pic.map), Q = newState(M), it = execute(M, Q, prog(pic.prog));
  let r = Q.d * 90;
  const place = () => { $('qbot').style.transform = `translate(${Q.x * C + 50}px, ${Q.y * C + 50}px)`; $('qbotRot').style.transform = `rotate(${r}deg)`; };
  place();
  if (!go) return;
  qTimer = setInterval(() => {
    const s = it.next();
    if (s.done || !$('qbot')) { clearInterval(qTimer); return; }
    if (s.value.ev === 'turn') r += s.value.turn * 90;
    if (s.value.ev !== 'loop') beep(s.value.ev === 'move' ? 420 : 520, 0.05);
    place();
  }, 520);
}
function quizAnswer(i) {
  if (!qz.set || qz.picked != null || qz.i >= qz.set.length) return;
  qz.picked = i; qz.marks[qz.i] = i === CQ[qz.set[qz.i]].ok;
  if (qz.marks[qz.i]) tune([659, 880]); else beep(160, 0.2, 'sawtooth', 0.05);
  renderQuiz();
}
function quizNext() {
  if (!qz.set || qz.picked == null) return;
  qz.i++; qz.picked = null;
  if (qz.i >= qz.set.length) tune([523, 659, 784, 1046, 1318]);
  renderQuiz();
}

// ---- secret quiz ----
// the unlock also marks the lab's topics as "learning" on the map, like the labs built on lab.js
function markLearning() {
  try {
    const p = JSON.parse(localStorage.getItem('skillgraph.progress') || '{}') || {};
    let n = 0;
    for (const t of TOPICS) if (!p[t.id]) { p[t.id] = 'learning'; n++; }
    if (n) localStorage.setItem('skillgraph.progress', JSON.stringify(p));
  } catch { /* private mode */ }
}
let qi = 0;
function openQuiz() {
  qi = -1;
  $('dlg').innerHTML = `<div class="kick">🔬 ${u.secretT}</div><h3>${u.secretH}</h3>
    <div class="prize"><div><b>🌑</b>${esc(u.L.dark[0])}</div><div><b>🔁</b>${esc(u.L.square[0])}</div></div>
    <p style="margin-top:16px">${u.secretP}</p><button class="big" data-q="next">${u.startQ}</button>`;
  $('modal').classList.add('open');
}
function nextQ() {
  qi++;
  if (qi >= u.quiz.length) {
    unlocked = true; store.set('unlocked', true); markLearning(); renderChips(); renderInfo(); tune([523, 659, 784, 1046, 1318]);
    $('dlg').innerHTML = `<div class="kick">🔬 ${u.secretT}</div><h3>🎉 ${u.unlocked}</h3><button class="big" data-q="close">${u.close}</button>`;
    return;
  }
  const q = u.quiz[qi];
  $('dlg').innerHTML = `<div class="kick">🔬 ${u.secretT} · ${u.qOf(qi + 1)}</div><h3>${esc(q.q)}</h3>
    <div class="ans">${q.a.map((a, i) => `<button data-a="${i}">${esc(a)}</button>`).join('')}</div>
    <div class="dots">${u.quiz.map((_, i) => `<span class="${i <= qi ? 'on' : ''}">●</span>`).join('')}</div>`;
}
function answer(i, btn) {
  const q = u.quiz[qi];
  document.querySelectorAll('.ans button').forEach((b) => (b.disabled = true));
  if (i === q.ok) { btn.classList.add('right'); beep(880, 0.1, 'triangle', 0.06); setTimeout(nextQ, 700); }
  else {
    btn.classList.add('wrong'); document.querySelector(`.ans button[data-a="${q.ok}"]`).classList.add('right'); beep(160, 0.2, 'sawtooth', 0.05);
    setTimeout(() => { qi = -1; $('dlg').insertAdjacentHTML('beforeend', `<button class="big" data-q="next">${u.again}</button>`); }, 600);
  }
}

// ---- events ----
document.addEventListener('click', (e) => {
  const el = e.target.closest('button');
  if (!el) {
    if (e.target === $('modal')) $('modal').classList.remove('open');
    const hd = e.target.closest('#prog .blk > .hd'); // tap a block: the next one goes right after it
    if (hd && !timer) {
      const loc = locate(hd.parentElement.dataset.id);
      if (loc) { target = { id: loc.pid, idx: loc.i + 1 < loc.body.length ? loc.i + 1 : null }; renderProgram(); }
    }
    return;
  }
  const d = el.dataset;
  el.blur(); // keep Enter and the arrow keys for the program, not for the last pressed button
  if (d.add) addBlock(d.add);
  else if (d.del) deleteBlock(d.del);
  else if (d.num) { const loc = locate(d.num), n = loc.body[loc.i]; n.n = n.n >= 9 ? 2 : n.n + 1; resetRobot(); renderProgram(); }
  else if (d.target) { target = { id: d.target, idx: null }; renderProgram(); }
  else if (d.lvl) loadLevel(+d.lvl);
  else if (d.lock) openQuiz();
  else if (d.q === 'next') nextQ();
  else if (d.q === 'close') $('modal').classList.remove('open');
  else if (d.a) answer(+d.a, el);
  else if (d.cqa) quizAnswer(+d.cqa);
  else if (d.cq === 'next') quizNext();
  else if (d.cq === 'again') setMode('quiz');
  else if (d.cqn) quizStart(+d.cqn);
  else if (d.speed) { speed = +d.speed; store.set('speed', speed); renderSpeed(); }
  else if (d.lang) { lang = d.lang; u = T[lang]; const p = new URLSearchParams(location.search); p.set('lang', lang); history.replaceState(null, '', '?' + p); renderAll(); say(readyMsg()); }
  else if (d.v) setMode(d.v);
});
$('run').onclick = play;
$('step').onclick = () => { if (timer) return; if (begin()) stepOnce(); };
$('reset').onclick = () => { resetRobot(); say(readyMsg()); };
$('clear').onclick = clearProgram;
$('snd').onclick = () => { sound = !sound; store.set('sound', sound); if (sound) unmuteIOS(); $('snd').textContent = sound ? '🔊' : '🔇'; };
// keyboard, for a teacher at the laptop: arrows add blocks, Enter runs, Backspace removes the block before the cursor
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { $('modal').classList.remove('open'); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || $('modal').classList.contains('open')) return;
  const onBtn = e.target.tagName === 'BUTTON' || e.target.tagName === 'A';
  if (mode === 'quiz') {
    if ('123'.includes(e.key)) quizAnswer(+e.key - 1);
    else if ((e.key === 'Enter' && !onBtn) || e.key === 'ArrowRight') quizNext();
    return;
  }
  const add = { ArrowUp: 'fwd', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];
  if (add) { e.preventDefault(); if (!timer && level().blocks.includes(add)) addBlock(add); }
  else if ((e.key === 'Enter' || e.key === ' ') && !onBtn) { e.preventDefault(); play(); }
  else if (e.key === 'Backspace' && !timer) {
    const body = findBody(target.id) ?? program, pos = target.idx ?? body.length;
    if (pos > 0) { e.preventDefault(); deleteBlock(body[pos - 1].id); }
  }
});

if (level().secret && !unlocked) lvlIdx = 0;
loadLevel(lvlIdx);
if (params.get('view') === 'quiz') { setMode('quiz'); quizStart(+params.get('n')); }
</script>
