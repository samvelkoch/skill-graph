<style>
  :root {
    --bg: #0A0E18; --panel: rgba(16, 21, 34, .82); --panel2: rgba(26, 32, 50, .9);
    --stroke: rgba(130, 145, 190, .16); --stroke2: rgba(130, 145, 190, .35);
    --ink: #EDEFF7; --body: #C6CDE0; --mut: #98A0B8; --faint: #646C84;
    --red: #FF3B30; --ok: #3ddc97; --wip: #f5c84c; --blue: #4cc3f5; --violet: #a98bff;
    --c-move: #3b82f6; --c-turn: #14b8a6; --c-loop: #f59e0b; --c-sense: #a855f7;
    --serif: 'EB Garamond', Georgia, serif; --sans: 'Nunito', ui-rounded, ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% 30%, rgba(40, 110, 140, .22), transparent 70%), var(--bg);
    color: var(--body); font: 600 16px/1.45 var(--sans); min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }

  header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }
  #brand { font: 900 24px/1 var(--sans); letter-spacing: -.035em; text-transform: uppercase; color: #fff; text-decoration: none; }
  #brand i { font-style: normal; color: var(--red); }
  #brand small { display: block; font: 700 10.5px/1.2 var(--sans); letter-spacing: .14em; color: var(--mut); margin-top: 4px; }
  .foot { padding: 4px 24px 30px; max-width: 1400px; margin: 0 auto; color: var(--faint); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .foot b { color: var(--mut); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: 10.5px; }
  .foot a { color: var(--body); text-decoration: none; border-bottom: 1px solid var(--stroke2); }
  .foot .lic { flex-basis: 100%; font-size: 11px; }
  .grow { flex: 1; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--stroke); border-radius: 999px; padding: 4px; gap: 2px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 14px; color: var(--mut); }
  .seg button.on { background: var(--red); color: #fff; }
  .iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--stroke); background: var(--panel); font-size: 17px; }

  .hero { padding: 8px 24px 0; max-width: 1400px; margin: 0 auto; }
  h1 { font: 500 clamp(36px, 5.4vw, 76px)/1.02 var(--serif); color: var(--ink); margin: 0 0 10px; letter-spacing: -.01em; }
  h1 i { color: var(--red); font-style: normal; }
  .lead { color: var(--mut); margin: 0; max-width: 640px; }

  main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; gap: 18px; padding: 20px 24px 28px; max-width: 1400px; margin: 0 auto; align-items: start; }

  /* scene */

  .fog { fill: #070a12; transition: opacity .35s; }

  .item.got { transform: scale(1.8) translateY(-14px); opacity: 0; }
  .bot { transition: transform .32s cubic-bezier(.4, .1, .3, 1); }

  .bot.bump .bot-body { animation: bump .35s; }

  .ray.on { opacity: .9; }
  .ray.hit { stroke: var(--red); }
  .trail { fill: var(--blue); opacity: .18; }

  .msg { min-height: 52px; margin-top: 12px; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--stroke); color: var(--ink); }
  .msg.good { border-color: rgba(61, 220, 151, .5); }
  .msg.bad { border-color: rgba(255, 59, 48, .5); }

  /* brain inset */
  .brain { margin-top: 12px; background: rgba(10, 14, 24, .9); border: 1px solid var(--stroke2); border-radius: 18px; padding: 10px 12px; font-size: 13px; z-index: 2; }
  .brain .live { font-size: 10px; font-weight: 900; letter-spacing: .14em; color: var(--mut); }
  .brain .live::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-right: 6px; vertical-align: 1px; }
  .flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 6px; margin-top: 8px; }

  .node { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 12px; background: var(--panel2); border: 1px solid transparent; transition: border-color .15s, box-shadow .15s; }
  .node .ic { font-size: 20px; }
  .node .lb { font-size: 11px; color: var(--faint); font-weight: 900; text-transform: uppercase; letter-spacing: .08em; }
  .node .vl { color: var(--ink); font-weight: 800; }
  .node.lit { border-color: var(--violet); box-shadow: 0 0 18px rgba(169, 139, 255, .45); }
  .node.lit.n-act { border-color: var(--blue); box-shadow: 0 0 18px rgba(76, 195, 245, .45); }
  .node.lit.n-think { border-color: var(--wip); box-shadow: 0 0 18px rgba(245, 200, 76, .4); }
  .arrow { text-align: center; color: var(--faint); line-height: .6; font-size: 12px; transform: rotate(-90deg); }
  .scene.inside .arrow { transform: none; }
  .brain .why { display: none; color: var(--mut); margin: 8px 0 0; }

  .scene.inside .brain .why { display: block; }
  .scene.inside .node { padding: 12px 14px; }
  .scene.inside .node .ic { font-size: 30px; }
  .scene.inside svg.board { opacity: .35; filter: blur(2px); }

  /* program */
  .palette { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
  .pb { position: relative; border: 0; border-radius: 12px; padding: 9px 12px; font-weight: 800; color: #fff; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
  .pb:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
  .pb .new { position: absolute; top: -8px; right: -6px; background: var(--red); font-size: 9px; padding: 2px 5px; border-radius: 6px; letter-spacing: .06em; }
  .k-fwd { background: var(--c-move); } .k-left, .k-right { background: var(--c-turn); }
  .k-rep, .k-forever { background: var(--c-loop); } .k-ifwall { background: var(--c-sense); }
  .prog { min-height: 120px; background: rgba(5, 8, 15, .55); border: 1px dashed var(--stroke2); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow: auto; }
  .blk { border-radius: 11px; color: #fff; font-weight: 800; font-size: 14.5px; }
  .blk > .hd { display: flex; align-items: center; gap: 6px; padding: 7px 8px 7px 11px; }
  .blk .x { margin-left: auto; border: 0; background: rgba(0, 0, 0, .25); width: 24px; height: 24px; border-radius: 50%; font-size: 14px; line-height: 1; }
  .blk .num { border: 0; background: rgba(255, 255, 255, .92); color: #7a4a00; border-radius: 8px; min-width: 28px; padding: 2px 6px; font-weight: 900; }
  .blk .body { margin: 0 0 6px 14px; padding: 6px; background: rgba(5, 8, 15, .55); border-radius: 10px; display: flex; flex-direction: column; gap: 5px; }
  .blk.run { outline: 3px solid #fff; outline-offset: 1px; }
  .slot { border: 2px dashed var(--stroke2); border-radius: 10px; padding: 5px 10px; color: var(--faint); font-size: 13px; background: none; text-align: left; }
  .slot.target { border-color: #fff; color: var(--ink); background: rgba(255, 255, 255, .06); }
  .count { display: flex; justify-content: space-between; color: var(--mut); font-size: 13px; margin-top: 8px; }
  .count .over { color: var(--red); }
  .controls { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .ctl { border: 1px solid var(--stroke2); background: var(--panel2); border-radius: 14px; padding: 11px 8px; font-weight: 900; color: var(--ink); }
  .ctl.go { background: var(--ok); color: #05210f; border-color: transparent; font-size: 17px; }
  .ctl:disabled { opacity: .4; cursor: default; }
  .running .prog, .running .palette { pointer-events: none; }
  .running .palette { opacity: .5; }
  .hint { margin-top: 10px; color: var(--faint); font-size: 13px; }

  /* level chips */
  .chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--stroke); background: var(--panel); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 14px; color: var(--body); display: inline-flex; gap: 6px; align-items: center; }
  .chip.on { background: #fff; color: #0A0E18; }
  .chip .s { color: var(--wip); font-size: 12px; letter-spacing: -1px; }
  .chip.locked { color: var(--faint); }

  /* modal */
  .modal { position: fixed; inset: 0; background: rgba(4, 6, 12, .7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal.open { display: flex; }
  .dlg { background: #111727; border: 1px solid var(--stroke2); border-radius: 24px; padding: 26px; width: min(560px, 100%); text-align: center; }
  .dlg h3 { font: 500 30px/1.15 var(--serif); color: var(--ink); margin: 8px 0 18px; }
  .dlg .ans { display: grid; gap: 8px; }
  .dlg .ans button { border: 1px solid var(--stroke2); background: var(--panel2); border-radius: 14px; padding: 13px; font-weight: 800; color: var(--ink); }
  .dlg .ans button.right { background: rgba(61, 220, 151, .25); border-color: var(--ok); }
  .dlg .ans button.wrong { background: rgba(255, 59, 48, .2); border-color: var(--red); }
  .dlg .big { border: 0; background: #fff; color: #0A0E18; border-radius: 999px; padding: 12px 24px; font-weight: 900; margin-top: 18px; }
  .dlg .prize { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dlg .prize div { background: var(--panel2); border-radius: 16px; padding: 14px; border: 1px solid var(--stroke2); }
  .dlg .prize b { display: block; font-size: 30px; }
  .dots { margin-top: 14px; letter-spacing: 4px; color: var(--faint); }
  .dots .on { color: var(--red); }

  @media (max-width: 1150px) {
    main { grid-template-columns: minmax(0, 1fr) 340px; }
    #info { grid-column: 1 / -1; order: 3; }
  }
  @media (max-width: 760px) {
    header, .hero { padding-left: 16px; padding-right: 16px; }
    main { grid-template-columns: minmax(0, 1fr); padding: 16px; }
    #info { order: 0; }
    .flow { grid-template-columns: 1fr; }
    .arrow { transform: none; }
    .scene.inside .brain { position: static; transform: none; width: auto; margin-top: 12px; }
    .scene.inside svg.board { display: none; }
    .boardwrap { padding: 10px; border-radius: 20px; }
  }
</style>

<script>
// ENGINE START (pure: no DOM; tested by scripts/test-robot-lab.mjs)
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // up, right, down, left
const TICK_LIMIT = 600;

function parseMap(rows) {
  const L = { w: rows[0].length, h: rows.length, walls: new Set(), pits: new Set(), items: [], goal: null, start: null };
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    const k = x + ',' + y;
    if (ch === '#') L.walls.add(k);
    else if (ch === 'o') L.pits.add(k);
    else if (ch === '*') L.items.push(k);
    else if (ch === 'G') L.goal = k;
    else if ('^>v<'.includes(ch)) L.start = { x, y, d: '^>v<'.indexOf(ch) };
  }));
  return L;
}

function newState(L) {
  return { x: L.start.x, y: L.start.y, d: L.start.d, got: new Set(), ticks: 0, end: false, win: false, fail: null };
}

function blocked(L, x, y) {
  return x < 0 || y < 0 || x >= L.w || y >= L.h || L.walls.has(x + ',' + y);
}

function wallAhead(L, S) {
  const [dx, dy] = DIRS[S.d];
  return blocked(L, S.x + dx, S.y + dy);
}

function forward(L, S) {
  const [dx, dy] = DIRS[S.d], nx = S.x + dx, ny = S.y + dy;
  if (blocked(L, nx, ny)) { S.fail = 'bump'; S.end = true; return; }
  S.x = nx; S.y = ny;
  const k = nx + ',' + ny;
  if (L.pits.has(k)) { S.fail = 'fall'; S.end = true; return; }
  if (L.items.includes(k)) S.got.add(k);
  if (k === L.goal && S.got.size === L.items.length) { S.win = true; S.end = true; }
}

function* tick(S, ev) {
  if (++S.ticks > TICK_LIMIT) { S.fail = 'long'; S.end = true; }
  yield ev;
}

// Runs a program (array of blocks) on the level, yielding one event per visible step.
function* execute(L, S, body) {
  for (const n of body) {
    if (S.end) return;
    if (n.t === 'fwd') { forward(L, S); yield* tick(S, { n, ev: 'move' }); }
    else if (n.t === 'left') { S.d = (S.d + 3) % 4; yield* tick(S, { n, ev: 'turn', turn: -1 }); }
    else if (n.t === 'right') { S.d = (S.d + 1) % 4; yield* tick(S, { n, ev: 'turn', turn: 1 }); }
    else if (n.t === 'rep') {
      for (let i = 0; i < n.n && !S.end; i++) { yield* tick(S, { n, ev: 'loop', i }); yield* execute(L, S, n.body); }
    } else if (n.t === 'forever') {
      while (!S.end) { yield* tick(S, { n, ev: 'loop' }); yield* execute(L, S, n.body); }
    } else if (n.t === 'ifwall') {
      const w = wallAhead(L, S);
      yield* tick(S, { n, ev: 'sense', wall: w });
      if (w) yield* execute(L, S, n.body);
    }
  }
}

function countBlocks(body) {
  return body.reduce((s, n) => s + 1 + (n.body ? countBlocks(n.body) : 0), 0);
}

function runAll(L, body) {
  const S = newState(L);
  for (const _ of execute(L, S, body)) { /* drain */ }
  return S;
}

function starsFor(level, blocks) {
  return blocks <= level.par ? 3 : blocks <= level.par + 2 ? 2 : 1;
}

// Shorthand for programs in level solutions: 'F' fwd, 'L' left, 'R' right, [n, ...] repeat, ['loop', ...] forever, ['wall', ...] if wall.
function prog(spec) {
  return spec.map((s) => {
    if (s === 'F') return { t: 'fwd' };
    if (s === 'L') return { t: 'left' };
    if (s === 'R') return { t: 'right' };
    if (Array.isArray(s) && typeof s[0] === 'number') return { t: 'rep', n: s[0], body: prog(s.slice(1)) };
    if (Array.isArray(s) && s[0] === 'loop') return { t: 'forever', body: prog(s.slice(1)) };
    if (Array.isArray(s) && s[0] === 'wall') return { t: 'ifwall', body: prog(s.slice(1)) };
    throw new Error('bad spec ' + s);
  });
}

// '^>v<' robot, '#' wall, 'o' pit, '*' item, 'G' goal. Outside the map counts as a wall.
const LEVELS = [
  { id: 'first', icon: '🔌', item: '🔋', goal: '🔌', blocks: ['fwd'], par: 4,
    map: ['.....', '>...G', '.....'], solution: ['F', 'F', 'F', 'F'] },
  { id: 'turn', icon: '↪️', item: '🔋', goal: '🔌', blocks: ['fwd', 'left', 'right'], par: 7,
    map: ['...G', '.##.', '.##.', '>...'], solution: ['F', 'F', 'F', 'L', 'F', 'F', 'F'] },
  { id: 'warehouse', icon: '📦', item: '📦', goal: '🚚', blocks: ['fwd', 'left', 'right'], par: 8,
    map: ['..*.*G', '.#####', '^.....'], solution: ['F', 'F', 'R', 'F', 'F', 'F', 'F', 'F'] },
  { id: 'arm', icon: '🦾', item: '🔩', goal: '🔌', blocks: ['fwd', 'left', 'right', 'rep'], par: 2, max: 4,
    map: ['>..*..*..G'], solution: [[9, 'F']] },
  { id: 'stairs', icon: '🪜', item: '⭐', goal: '🏁', blocks: ['fwd', 'left', 'right', 'rep'], par: 5, max: 6,
    map: ['####G', '###..', '##*.#', '#..##', '>.###'], solution: [[4, 'F', 'L', 'F', 'R']] },
  { id: 'rover', icon: '🚀', item: '🪨', goal: '🚀', blocks: ['fwd', 'left', 'right', 'rep'], par: 17,
    map: ['*..o.G', '.o....', '....*.', '.o...o', '^..o..'],
    solution: [[4, 'F'], 'R', 'F', 'F', 'R', 'F', 'L', 'F', 'F', 'R', 'F', 'L', 'F', 'L', 'F', 'F'] },
  { id: 'vacuum', icon: '🧹', item: '🧦', goal: '🔌', blocks: ['fwd', 'left', 'right', 'rep', 'forever', 'ifwall'], par: 4,
    map: ['...*..', '*.##..', '..##.*', '^G.*..'], solution: [['loop', ['wall', 'R'], 'F']] },
  { id: 'courier', icon: '🛵', item: '🍕', goal: '🏠', blocks: ['fwd', 'left', 'right', 'rep', 'forever', 'ifwall'], par: 4,
    map: ['>......', '######.', '.....#.', '.###.#.', '.#G..#.', '.#####.', '...*...'],
    solution: [['loop', ['wall', 'R'], 'F']] },
  { id: 'dark', icon: '🌑', item: '🧦', goal: '🔌', secret: true, dark: true, blocks: ['fwd', 'left', 'right', 'rep', 'forever', 'ifwall'], par: 4,

// ---- sound ----
// iPhone: Web Audio is silenced by the ring/silent switch unless the page asks for the "playback" audio session
// (Safari 17+), or, on older iOS, a media element is playing. iOS also leaves the context "interrupted" after a call
// or a trip to the background, so we resume on every tap that is not "running".
let actx = null, keepAlive = null;
function silentWav() { // 0.5 s of silence, 8 kHz mono 8-bit
  const n = 4000, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, t) => [...t].forEach((c, i) => { b[o + i] = c.charCodeAt(0); });
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
  b.fill(128, 44);
  return 'data:audio/wav;base64,' + btoa(String.fromCharCode(...b));
}
function unmuteIOS() {
  try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch { /* fall through */ }
  if (!/iP(hone|ad|od)|Macintosh/.test(navigator.userAgent) || !('ontouchend' in document)) return;
  if (!keepAlive) { keepAlive = new Audio(silentWav()); keepAlive.loop = true; keepAlive.setAttribute('playsinline', ''); }
  if (keepAlive.paused && !document.hidden) keepAlive.play().catch(() => {});
}
function beep(f, dur = 0.08, type = 'square', vol = 0.04) {
  if (!sound) return;
  try {
    actx ??= new (window.AudioContext || window.webkitAudioContext)();
    unmuteIOS(); if (actx.state !== 'running') actx.resume().catch(() => {});
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch { /* no audio */ }
}
const tune = (notes) => notes.forEach((f, i) => setTimeout(() => beep(f, 0.12, 'triangle', 0.06), i * 110));

      <rect x="-36" y="-26" width="14" height="52" rx="6" fill="#20283f"/><rect x="22" y="-26" width="14" height="52" rx="6" fill="#20283f"/>
      <rect x="-27" y="-30" width="54" height="58" rx="16" fill="#e9edf7"/>
      <rect x="-20" y="-22" width="40" height="24" rx="10" fill="#0e1424"/>
      <circle cx="-9" cy="-10" r="5" fill="#4cc3f5"/><circle cx="9" cy="-10" r="5" fill="#4cc3f5"/>
      <path d="M-8 12 Q0 18 8 12" stroke="#98a0b8" stroke-width="3" fill="none" stroke-linecap="round"/>

  if (lv.dark) for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) h += `<rect class="fog" id="fog-${x}-${y}" x="${x * C - 1}" y="${y * C - 1}" width="${C + 2}" height="${C + 2}"/>`;

function placeBot(instant) {

}
function reveal() {

// ---- program editor ----
function findBody(id, body = program) {
  if (id === 'root') return program;
  for (const n of body) {
    if (n.id === id) return n.body;
    if (n.body) { const r = findBody(id, n.body); if (r) return r; }
  }
  return null;
}
function removeNode(id, body = program) {
  const i = body.findIndex((n) => n.id === id);
  if (i >= 0) { const [n] = body.splice(i, 1); return n; }
  for (const n of body) if (n.body && removeNode(id, n.body)) return true;
  return null;
}
function addBlock(t) {
  const lv = level(), n = { t, id: 'b' + (++uid) };
  if (BLOCKS[t].box) n.body = [];
  if (t === 'rep') n.n = 3;
  const into = findBody(target) ?? program;
  into.push(n);
  if (n.body) target = n.id;
  beep(660, 0.05);
  renderProgram();
  if (lv.max && countBlocks(program) > lv.max) say(u.msg.over(lv.max), 'bad');
}
function blockHtml(n) {
  const b = BLOCKS[n.t], label = u.blk[n.t];
  let hd = `${b.ic} ${esc(label)}`;
  if (n.t === 'rep') hd = `${b.ic} ${esc(label)} <button class="num" data-num="${n.id}">${n.n}</button> ${esc(u.blk.times)}`;
  const x = `<button class="x" data-del="${n.id}" aria-label="×">×</button>`;

  return `<div class="blk k-${n.t}" data-id="${n.id}"><div class="hd">${hd}${x}</div><div class="body">${n.body.map(blockHtml).join('')}
    <button class="slot${target === n.id ? ' target' : ''}" data-target="${n.id}">${esc(u.slot)}</button></div></div>`;
}

// ---- run ----
function say(text, kind = '') {
  const em = kind === 'good' ? '🎉' : kind === 'bad' ? '🤖' : '💡';
  $('msg').className = 'msg ' + kind;
  $('msg').innerHTML = `<span class="em">${em}</span><span>${text}</span>`;
}
function begin() {
  if (!program.length) { say(u.msg.empty, 'bad'); return false; }
  const lv = level();
  if (lv.max && countBlocks(program) > lv.max) { say(u.msg.over(lv.max), 'bad'); return false; }
  if (!runner || S.end) { resetRobot(); runner = execute(L, S, program); }
  return true;
}
function stepOnce() {
  const r = runner.next();
  if (r.done) { finish(); return false; }
  const ev = r.value;
  flashBlock(ev.n); brain(ev);
  if (ev.ev === 'move') {
    if (S.fail === 'bump') {
      $('bot').classList.add('bump'); beep(110, 0.25, 'sawtooth', 0.06);
    } else {
      addTrail(S.x - DIRS[S.d][0], S.y - DIRS[S.d][1]);
      visited.add(S.x + ',' + S.y); reveal();
      placeBot(); beep(420, 0.05);
      const it = $(`it-${S.x}-${S.y}`);
      if (it && !it.classList.contains('got')) { it.classList.add('got'); tune([880, 1320]); }
      if (S.fail === 'fall') setTimeout(() => { $('bot').classList.add('fall'); beep(200, 0.5, 'sine', 0.06); }, 300);
    }
  } else if (ev.ev === 'turn') { rot += ev.turn * 90; placeBot(); beep(520, 0.04); }
  else if (ev.ev === 'sense') { showRay(ev.wall); beep(ev.wall ? 300 : 900, 0.04, 'sine'); }
  if (S.end) { setTimeout(finish, 350); return false; }
  return ev;
}
function delay(ev) { return ev === 'loop' ? 120 : ev === 'sense' ? 260 : 380; }
function play() {
  if (timer) { stop(); return; }
  if (!begin()) return;
  document.body.classList.add('running');
  $('run').textContent = u.stop;
  const loop = () => {
    const ev = stepOnce();
    if (!ev) { stop(); return; }
    timer = setTimeout(loop, delay(ev.ev) * ($('scene').classList.contains('inside') ? 1.8 : 1));
  };
  loop();
}
function stop() {
  clearTimeout(timer); timer = null;
  document.body.classList.remove('running');
  if ($('run')) $('run').textContent = u.run;
}
function finish() {
  stop(); flashBlock(null); brain({});
  const lv = level();
  if (S.win) {
    const n = countBlocks(program), s = starsFor(lv, n);
    if (s > (stars[lv.id] ?? 0)) { stars[lv.id] = s; store.set('stars', stars); }
    $('bot').classList.add('win'); tune([523, 659, 784, 1046]);
    say(`${u.msg.win(s)} ${s === 3 ? u.msg.win3 : u.msg.winMore(lv.par)}`, 'good');
    renderChips(); renderInfo();
  } else if (S.fail) say(u.msg[S.fail], 'bad');
  else say(S.x + ',' + S.y === L.goal ? u.msg.missing : u.msg.stopped, 'bad');
  runner = null;
}

// ---- events ----
document.addEventListener('click', (e) => {
  const el = e.target.closest('button');
  if (!el) { if (e.target === $('modal')) $('modal').classList.remove('open'); return; }
  const d = el.dataset;
  if (d.add) addBlock(d.add);
  else if (d.del) { removeNode(d.del); if (!findBody(target)) target = 'root'; resetRobot(); renderProgram(); }
  else if (d.num) { const n = findNode(d.num); n.n = n.n >= 9 ? 2 : n.n + 1; renderProgram(); }
  else if (d.target) { target = d.target; renderProgram(); }
  else if (d.lvl) loadLevel(+d.lvl);
  else if (d.lock) openQuiz();
  else if (d.q === 'next') nextQ();
  else if (d.q === 'close') $('modal').classList.remove('open');
  else if (d.a) answer(+d.a, el);
  else if (d.lang) { lang = d.lang; u = T[lang]; const p = new URLSearchParams(location.search); p.set('lang', lang); history.replaceState(null, '', '?' + p); renderAll(); say(u.msg.ready); }
  else if (d.v) { document.querySelectorAll('#view button').forEach((b) => b.classList.toggle('on', b === el)); $('scene').classList.toggle('inside', d.v === 'inside'); }
});
function findNode(id, body = program) {
  for (const n of body) { if (n.id === id) return n; if (n.body) { const r = findNode(id, n.body); if (r) return r; } }
  return null;
}
$('run').onclick = play;
$('step').onclick = () => { if (timer) return; if (begin()) stepOnce(); };
$('reset').onclick = () => { resetRobot(); say(u.msg.ready); };
$('snd').onclick = () => { sound = !sound; store.set('sound', sound); if (sound) unmuteIOS(); $('snd').textContent = sound ? '🔊' : '🔇'; };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('modal').classList.remove('open'); });

if (level().secret && !unlocked) lvlIdx = 0;
loadLevel(lvlIdx);
</script>
<script type="module" src="../switcher.js"></script>
</body>
