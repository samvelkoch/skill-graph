const PEOPLE = (() => {

  }

  const pcx = w / 2, pry = Math.min(h * .27, w * .3), pcy = 12 + pry + 4, prx = w / 2 - 14;
  // bank, water, ripples, lily pads
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(pcx + 2, pcy + 5, prx + 8, pry + 8, 0, 0, 7); ctx.fill();
  let gr = ctx.createLinearGradient(0, pcy - pry, 0, pcy + pry); gr.addColorStop(0, '#46603c'); gr.addColorStop(1, '#2c4430'); ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(pcx, pcy, prx + 8, pry + 8, 0, 0, 7); ctx.fill();
  gr = ctx.createRadialGradient(pcx - prx * .3, pcy - pry * .4, 4, pcx, pcy, prx); gr.addColorStop(0, '#3aa0c8'); gr.addColorStop(.6, '#2a7ba8'); gr.addColorStop(1, '#1a4d78'); ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(pcx, pcy, prx, pry, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#1d3f5c'; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.ellipse(pcx, pcy, prx, pry, 0, 0, 7); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 1.2; for (let i = 0; i < 4; i++) { const q = (t * .12 + i / 4) % 1; ctx.beginPath(); ctx.ellipse(pcx - prx * .35, pcy - pry * .25, prx * .1 + q * prx * .55, pry * .1 + q * pry * .5, 0, 0, 7); ctx.stroke(); }
  ctx.restore(); ctx.restore();
  const L = Math.max(4, prx / 38);
  // fish swim
  for (let i = 0; i < FISH.length; i++) {
    const f = FISH[i]; if (f.held) continue;
    f.a += (Math.random() - .5) * dt * 5; const d = f.x * f.x + f.y * f.y;
    if (d > .8) { let da = Math.atan2(-f.y, -f.x) - f.a; da = Math.atan2(Math.sin(da), Math.cos(da)); f.a += da * dt * 3; }
    f.x += Math.cos(f.a) * f.v * dt * 2.2; f.y += Math.sin(f.a) * f.v * dt * 2.2 * (prx / pry);
    drawFish(ctx, f, pcx + f.x * prx, pcy + f.y * pry, L, t, i, f.show > 0 ? c01((t - f.show) / .6) : 1);
  }
  ctx.save(); ctx.fillStyle = '#3f8a4c'; for (const [a, b] of [[-.55, .35], [.5, -.4], [.15, .55]]) { ctx.beginPath(); ctx.arc(pcx + a * prx, pcy + b * pry, L * 2.2, .3, 6.0); ctx.lineTo(pcx + a * prx, pcy + b * pry); ctx.fill(); }
  ctx.restore();
  // the net sweeps across the pond
  if (an && u < .34) {
    const k2 = ease(u / .34), nx = pcx + lerp(-.75, .75, k2) * prx, ny = pcy + Math.sin(k2 * Math.PI) * -pry * .2, nr = prx * .17;
    ctx.save(); ctx.strokeStyle = '#a9743f'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(nx + nr * .7, ny - nr * .7); ctx.lineTo(nx + nr * 2.4, ny - nr * 2.2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(nx, ny, nr, 0, 7); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(nx, ny, nr, 0, 7); ctx.clip(); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.beginPath(); for (let q = -nr; q <= nr; q += nr / 3) { ctx.moveTo(nx + q, ny - nr); ctx.lineTo(nx + q, ny + nr); ctx.moveTo(nx - nr, ny + q); ctx.lineTo(nx + nr, ny + q); } ctx.stroke(); ctx.restore();
    ctx.strokeStyle = '#d2a068'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(nx, ny, nr, 0, 7); ctx.stroke(); ctx.restore();
  }
  if (fs.step === 2 && !an) pill(ctx, w, k.real, pcx, pcy - pry * .55, 'center', { stroke: 'rgba(255,209,102,.6)', color: '#ffd166' });
  // the tray: your catch
  const ty = pcy + pry + 20, th = h - ty - 8, tray = an ? (an.held && !an.rel ? an.picks : []) : fs.tray;
  ctx.save(); rrp(ctx, 8, ty, w - 16, th, 16); ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fill(); ctx.strokeStyle = 'rgba(130,145,190,.35)'; ctx.stroke(); ctx.restore();
  pill(ctx, w, k.tray, 18, ty + 14, 'left');
  const cols = 10, cell = Math.min((w - 40) / cols, (th - 38) / 5), fl = cell * .3, ox = w / 2 - cols * cell / 2, oy = ty + 30 + ((th - 34) - 5 * cell) / 2;
  tray.forEach((i, j) => {
    const pop = an ? outBack(c01((t - an.t0 - an.dur * .3 - j * .02) / .35)) : 1;
    const f = FISH[i], g2 = { a: 0, tag: f.tag && !(an && an.kind === 'mark' && !an.tagged), col: f.col };
    ctx.save(); ctx.translate(ox + (j % cols + .5) * cell, oy + (Math.floor(j / cols) + .5) * cell); ctx.scale(pop, pop); drawFish(ctx, g2, 0, 0, fl, t, j, 1); ctx.restore();
  });
}
const outBack = (x) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

// --- secret B: the poll that got it wrong ----------------------------------------------------------------------------------------
function drawPollView(ctx, w, h, t) {
  const k = T[lang].poll, p = S.poll.t0 > 0 ? c01((t - S.poll.t0) / 4.5) : 0, pa = ease(c01(p / .6)), bp = ease(c01((p - .6) / .4));
  if (p >= 1 && !S.poll.done) S.poll.done = true;
  const ph = Math.min(h * .25, 130), pw = w - 16, LAND = '#ff9f43', ROOS = '#4fa3ff';
  const panel = (y, title, pts, hot, n) => {
    ctx.save(); rrp(ctx, 8, y, pw, ph, 14); let gr = ctx.createLinearGradient(0, y, 0, y + ph); gr.addColorStop(0, '#22374a'); gr.addColorStop(1, '#1a2a3f'); ctx.fillStyle = gr; ctx.fill(); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1; ctx.beginPath(); for (let x = 8; x < 8 + pw; x += 24) { ctx.moveTo(x, y); ctx.lineTo(x, y + ph); } for (let q = y; q < y + ph; q += 24) { ctx.moveTo(8, q); ctx.lineTo(8 + pw, q); } ctx.stroke();
    if (hot) { const hx = 16 + .6 * (pw - 16) - 6, hy = y + 24, hh = 30 + .46 * (ph - 38) + 6 - 24; ctx.fillStyle = 'rgba(255,209,102,.13)'; ctx.fillRect(hx, hy, 8 + pw - hx, hh); ctx.strokeStyle = 'rgba(255,209,102,.5)'; ctx.setLineDash([5, 5]); ctx.strokeRect(hx, hy, 8 + pw - hx - 1, hh); ctx.setLineDash([]); }
    const rad = Math.max(1.8, Math.min(3.4, pw / Math.sqrt(n) / 11));
    pts.forEach((q, i) => {
      const a = c01(pa * 1.4 - (i / pts.length) * .4 * 1.4); if (a <= 0) return;
      const x = 8 + 8 + q.x * (pw - 16), yy = y + 30 + q.y * (ph - 38);
      ctx.globalAlpha = a; ctx.fillStyle = q.land ? LAND : ROOS; ctx.beginPath(); ctx.arc(x, yy, Math.max(0, rad * (.6 + .4 * a)), 0, 7); ctx.fill();
    });
    ctx.restore();
    ctx.save(); rrp(ctx, 8, y, pw, ph, 14); ctx.strokeStyle = 'rgba(130,145,190,.35)'; ctx.stroke(); ctx.restore();
    pill(ctx, w, title, 16, y + 16, 'left');
    if (hot) pill(ctx, w, '🚗 📞 ' + k.owners, 8 + pw - 8, y + ph - 14, 'right', { stroke: 'rgba(255,209,102,.5)', color: '#ffd166' });
  };
  panel(8, k.mag, CROWD.M, true, 360);
  panel(8 + ph + 8, k.fair, CROWD.F, false, 120);
  // legend
  const ly = 8 + 2 * ph + 24; ctx.save(); ctx.fillStyle = LAND; ctx.beginPath(); ctx.arc(20, ly, 5, 0, 7); ctx.fill(); label(ctx, k.land, 30, ly, 'left', '#d3d9e8');
  ctx.fillStyle = ROOS; ctx.beginPath(); ctx.arc(w / 2 - 4, ly, 5, 0, 7); ctx.fill(); label(ctx, k.roos, w / 2 + 6, ly, 'left', '#d3d9e8'); ctx.restore();
  // bars
  const bars = [[k.barM, 57, LAND], [k.barF, 56, ROOS], [k.barR, 61, ROOS]], by0 = ly + 22, bh = Math.min(52, (h - by0 - 6) / 3);
  bars.forEach(([text, val, col], i) => {
    const y = by0 + i * bh + bh * .62, bx = 14, bw = w - 28; ctx.save(); ctx.globalAlpha = c01(bp * 3 - i * .5 + .01);
    rrp(ctx, bx, y - 9, bw, 18, 9); ctx.fillStyle = 'rgba(130,145,190,.18)'; ctx.fill();
    ctx.save(); rrp(ctx, bx, y - 9, bw, 18, 9); ctx.clip(); const gr = ctx.createLinearGradient(0, y - 9, 0, y + 9); gr.addColorStop(0, col); gr.addColorStop(1, mixHex(col, '#000000', .3)); ctx.fillStyle = gr; ctx.fillRect(bx, y - 9, bw * val / 100 * bp, 18); ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(bx + bw / 2, y - 12); ctx.lineTo(bx + bw / 2, y + 12); ctx.stroke();
    pill(ctx, w, text, bx + 4, y - bh * .45, 'left', { h: 20 }); ctx.restore();
  });
}

// --- main loop ----------------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  if (S.sec === 'fish') drawFishView(ctx, w, h, t, dt);
  else if (S.sec === 'poll') drawPollView(ctx, w, h, t);
  else if (lab.view === 'scoop') drawScoopView(ctx, w, h, t);
  else if (lab.view === 'size') drawSizeView(ctx, w, h, t);
  else drawSurveyView(ctx, w, h, t);
});
render();
</script>
</body>
