// run a program into a flat list of timed ops
function simulate(prog, mode) {
  const ops = [], stack = [];
  let x = 0, y = 0, h = 0, size = 0, ink = 0, inkN = 1, over = false;
  const push = (o) => { ops.push({ ...o, ink, inkN, ctx: stack.slice() }); if (ops.length > 3500) over = true; };
  const at = (k, id, extra) => push({ k, id, x0: x, y0: y, x1: x, y1: y, h0: h, h1: h, ...extra });
  const run = (list) => {
    for (const nd of list) {
      if (over) return;
      if (nd.t === 'rep') {
        for (let i = 0; i < nd.n && !over; i++) { if (!stack.length) { ink = i; inkN = nd.n; } stack.push([nd.id, i + 1, nd.n]); run(nd.body); stack.pop(); }
      } else if (nd.t === 'move') {
        const d = nd.d === 'size' ? size : nd.d, nx = x + Math.sin(h * D2R) * d, ny = y - Math.cos(h * D2R) * d;
        push({ k: 'move', id: nd.id, x0: x, y0: y, x1: nx, y1: ny, h0: h, h1: h }); x = nx; y = ny;
      } else if (nd.t === 'turn') { at('turn', nd.id, { h1: h + nd.a }); h += nd.a; }
      else if (nd.t === 'set') { size = nd.v; at('set', nd.id); }
      else if (nd.t === 'chg') { size += nd.by; at('set', nd.id); }
      else if (nd.t === 'tile') at('tile', nd.id);
      else if (nd.t === 'step') { push({ k: 'step', id: nd.id, x0: x, y0: y, x1: x + 1, y1: y, h0: 0, h1: 0 }); x += 1; }
      else if (nd.t === 'row') { push({ k: 'row', id: nd.id, x0: x, y0: y, x1: 0, y1: y + 1, h0: 0, h1: 0 }); x = 0; y += 1; }
    }
  };
  run(prog);
  const sum = ops.reduce((s, o) => s + BASE[o.k], 0), sc = Math.min(1, 5 / Math.max(sum, 0.01)), count = mode === 'w' ? 'tile' : 'move';
  let t = 0, c = 0, minx = 0, maxx = 0, miny = 0, maxy = 0;
  const cum = [];
  for (const o of ops) {
    o.dur = BASE[o.k] * sc; o.start = t; t += o.dur;
    if (o.k === count) c++;
    cum.push(c);
    if (o.k === 'move') { minx = Math.min(minx, o.x0, o.x1); maxx = Math.max(maxx, o.x0, o.x1); miny = Math.min(miny, o.y0, o.y1); maxy = Math.max(maxy, o.y0, o.y1); }
  }
  return { ops, total: t, cum, count, bbox: [minx, maxx, miny, maxy] };
}
const sigOf = (sim) => sim.ops.filter((o) => o.k === 'move').map((o) => {

}).sort().join(';');

function drawTurtle(c, X, Y, hd, r, t, moving) {
  c.save(); c.translate(X, Y); c.rotate(hd * D2R);
  const sw = moving ? Math.sin(t * 16) * 0.28 : 0;
  c.fillStyle = 'rgba(50,40,20,.22)'; c.beginPath(); c.ellipse(2.5, 3.5, r * 0.98, r * 1.2, 0, 0, 7); c.fill();
  c.lineWidth = 1.2; c.strokeStyle = '#2f6f3e';
  const leg = (sx, sy, a) => {
    c.save(); c.translate(sx * r, sy * r); c.rotate(a);
    const g = c.createLinearGradient(0, -r * 0.4, 0, r * 0.4); g.addColorStop(0, '#8bd081'); g.addColorStop(1, '#4aa55a');
    c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, r * 0.3, r * 0.46, 0, 0, 7); c.fill(); c.stroke(); c.restore();
  };
  leg(-0.82, -0.5, -0.96 + sw); leg(0.82, -0.5, 0.96 - sw); leg(-0.82, 0.58, 0.9 - sw); leg(0.82, 0.58, -0.9 + sw);
  c.fillStyle = '#4aa55a'; c.beginPath(); c.moveTo(-r * 0.17, r * 0.9); c.quadraticCurveTo(0, r * 1.6, r * 0.17, r * 0.9); c.closePath(); c.fill(); c.stroke();
  const hg = c.createRadialGradient(-r * 0.12, -r * 1.22, 1, 0, -r * 1.12, r * 0.48); hg.addColorStop(0, '#a2e69a'); hg.addColorStop(1, '#46a057');
  c.beginPath(); c.arc(0, -r * 1.1, r * 0.43, 0, 7); c.fillStyle = hg; c.fill(); c.stroke();
  for (const sx of [-1, 1]) {
    c.beginPath(); c.arc(sx * r * 0.18, -r * 1.2, r * 0.13, 0, 7); c.fillStyle = '#fff'; c.fill();
    c.beginPath(); c.arc(sx * r * 0.18, -r * 1.24, r * 0.07, 0, 7); c.fillStyle = '#1b2a1f'; c.fill();
  }
  const sg = c.createRadialGradient(-r * 0.32, -r * 0.4, 2, 0, 0, r * 1.15); sg.addColorStop(0, '#b4ee8c'); sg.addColorStop(0.55, '#52ad63'); sg.addColorStop(1, '#2b7a48');
  c.beginPath(); c.ellipse(0, 0, r * 0.94, r * 1.05, 0, 0, 7); c.fillStyle = sg; c.fill(); c.lineWidth = 1.7; c.strokeStyle = '#1f5f3a'; c.stroke();
  c.strokeStyle = 'rgba(25,80,45,.55)'; c.lineWidth = 1.2; c.beginPath();
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3, px = Math.sin(a) * r * 0.4, py = -Math.cos(a) * r * 0.4; if (i) c.lineTo(px, py); else c.moveTo(px, py); }

  c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.6; c.beginPath(); c.ellipse(0, 0, r * 0.78, r * 0.88, 0, Math.PI * 1.1, Math.PI * 1.45); c.stroke();

// --- drawing: the sketch paper -----------------------------------------------------------------------------------
function paperBg(c, x, y, w, h, rad) {
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 18; c.shadowOffsetY = 6;
  const g = c.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, '#f8f2e0'); g.addColorStop(1, '#e5dabb');
  c.fillStyle = g; c.beginPath(); c.roundRect(x, y, w, h, rad); c.fill(); c.restore();
}
function drawPaper(c, w, h, dt, time) {
  const px = 6, py = 6, pw = w - 12, ph = h - 16;
  paperBg(c, px, py, pw, ph, 18);
  c.save(); c.beginPath(); c.roundRect(px, py, pw, ph, 18); c.clip();
  c.strokeStyle = 'rgba(80,120,185,.17)'; c.lineWidth = 1; c.beginPath();
  for (let x = (w / 2) % 24; x < w; x += 24) { c.moveTo(x, py); c.lineTo(x, py + ph); }
  for (let y = (h / 2) % 24; y < h; y += 24) { c.moveTo(px, y); c.lineTo(px + pw, y); }
  c.stroke();
  const vg = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75); vg.addColorStop(0, 'rgba(255,255,255,0)'); vg.addColorStop(1, 'rgba(120,95,50,.22)');
  c.fillStyle = vg; c.fillRect(px, py, pw, ph);
  // camera: fit the finished picture (and the goal) with room for the turtle
  const gh = lab.view === 'bugs' ? GH[S.b.k] : null, bb = R.sim ? R.sim.bbox.slice() : [0, 0, 0, 0];
  if (gh) { bb[0] = Math.min(bb[0], gh.bbox[0]); bb[1] = Math.max(bb[1], gh.bbox[1]); bb[2] = Math.min(bb[2], gh.bbox[2]); bb[3] = Math.max(bb[3], gh.bbox[3]); }
  const m = 36, bw = Math.max(50, bb[1] - bb[0]), bh = Math.max(50, bb[3] - bb[2]);
  const ts = Math.min((w - 2 * m) / bw, (ph - 2 * m) / bh, 2.6), tx = (bb[0] + bb[1]) / 2, ty = (bb[2] + bb[3]) / 2;
  if (!cam.ok) { cam.s = ts; cam.mx = tx; cam.my = ty; cam.ok = true; }
  else { const k = 1 - Math.exp(-dt * 9); cam.s += (ts - cam.s) * k; cam.mx += (tx - cam.mx) * k; cam.my += (ty - cam.my) * k; }
  const X = (x) => w / 2 + (x - cam.mx) * cam.s, Y = (y) => py + ph / 2 + (y - cam.my) * cam.s;
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (gh) {
    c.setLineDash([6, 6]); c.lineWidth = 2.6; c.strokeStyle = 'rgba(70,92,150,.85)'; c.beginPath();
    for (const o of gh.ops) if (o.k === 'move') { c.moveTo(X(o.x0), Y(o.y0)); c.lineTo(X(o.x1), Y(o.y1)); }
    c.stroke(); c.setLineDash([]);
  }
  c.strokeStyle = '#8a7e5e'; c.lineWidth = 1.5; c.beginPath(); c.arc(X(0), Y(0), 4.5, 0, 7); c.stroke();
  // the trail so far
  const idx = R.idx; let tx2 = 0, ty2 = 0, th = 0, moving = false;
  c.lineWidth = 3.6;
  for (let i = 0; i <= idx && i < R.ops.length; i++) {
    const o = R.ops[i];
    let e = 1;
    if (i === idx && R.state === 'run') e = ease(clamp((R.t - o.start) / o.dur, 0, 1));
    if (o.k === 'move') {
      c.strokeStyle = hue(o.ink, o.inkN); c.beginPath(); c.moveTo(X(o.x0), Y(o.y0)); c.lineTo(X(lerp(o.x0, o.x1, e)), Y(lerp(o.y0, o.y1, e))); c.stroke();
    }
    if (i === idx) { tx2 = lerp(o.x0, o.x1, e); ty2 = lerp(o.y0, o.y1, e); th = lerp(o.h0, o.h1, e); moving = R.state === 'run' && o.k === 'move'; }
  }
  drawTurtle(c, X(tx2), Y(ty2), th, w < 500 ? 12 : 15, time, moving);
  c.restore();
}

// --- drawing: the tiled wall -------------------------------------------------------------------------------------
function drawWall(c, w, h, dt, time) {
  const MC = 6, MR = 4, W = S.w;
  const th0 = (h - 100) / MR, tw0 = (w - 56) / MC, tw = Math.max(20, Math.min(tw0, th0 / 0.74, 62)), thh = tw * 0.74;
  const gw = MC * tw, gh = MR * thh, gx = (w - gw) / 2, gy = 40 + Math.max(14, (h - 40 - gh - 14) / 2);
  const bg = c.createLinearGradient(0, gy - 12, 0, gy + gh + 12); bg.addColorStop(0, '#1d2342'); bg.addColorStop(1, '#12162b');
  c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 16; c.shadowOffsetY = 5; c.fillStyle = bg; c.beginPath(); c.roundRect(gx - 12, gy - 12, gw + 24, gh + 24, 16); c.fill(); c.restore();
  c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1.2; c.beginPath(); c.roundRect(gx - 12, gy - 12, gw + 24, gh + 24, 16); c.stroke();
  c.fillStyle = 'rgba(130,145,190,.16)';
  for (let r = 0; r <= MR; r++) for (let q = 0; q <= MC; q++) { c.beginPath(); c.arc(gx + q * tw, gy + r * thh, 1.6, 0, 7); c.fill(); }
  const text = (s, x, y, col) => {
    c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    const tw2 = c.measureText(s).width + 20, bx = clamp(x - tw2 / 2, 8, w - tw2 - 8);
    c.fillStyle = 'rgba(10,12,20,.82)'; c.beginPath(); c.roundRect(bx, y - 12, tw2, 24, 12); c.fill();
    c.fillStyle = col; c.fillText(s, bx + tw2 / 2, y + 1);
  };
  const [tc, tr] = TARGETS[W.ti];
  if (W.stage === 'task') {
    c.setLineDash([7, 6]); c.lineWidth = 2.4; c.strokeStyle = '#f5c84c'; c.beginPath(); c.roundRect(gx - 3, gy - 3, tc * tw + 6, tr * thh + 6, 8); c.stroke(); c.setLineDash([]);
    text(T[lang].w.goal(tc, tr), w / 2, 20, '#f5c84c');
  }
  // tiles so far
  let tx = 0, ty = 0, hd = 90, moving = false;
  for (let i = 0; i <= R.idx && i < R.ops.length; i++) {
    const o = R.ops[i], cur = i === R.idx && R.state === 'run', u = cur ? clamp((R.t - o.start) / o.dur, 0, 1) : 1;
    if (o.k === 'tile') {
      const sc = cur ? 0.55 + 0.45 * backOut(u) : 1, cx = gx + (o.x0 + 0.5) * tw, cy = gy + (o.y0 + 0.5) * thh, ww = (tw - 5) * sc, hh = (thh - 5) * sc;
      const base = ROWC[o.y0 % 4], g = c.createLinearGradient(cx - ww / 2, cy - hh / 2, cx + ww / 2, cy + hh / 2);
      g.addColorStop(0, mix(base, '#ffffff', 0.3)); g.addColorStop(1, mix(base, '#000000', 0.22));
      c.fillStyle = g; c.strokeStyle = mix(base, '#000000', 0.45); c.lineWidth = 1.4;
      c.beginPath(); c.roundRect(cx - ww / 2, cy - hh / 2, ww, hh, 7); c.fill(); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(cx - ww / 2 + 6, cy - hh / 2 + 4); c.lineTo(cx + ww / 2 - 8, cy - hh / 2 + 4); c.stroke();
    }
    if (i === R.idx) { const e = cur ? ease(u) : 1; tx = lerp(o.x0, o.x1, e); ty = lerp(o.y0, o.y1, e); hd = o.k === 'row' ? 180 : 90; moving = cur && (o.k === 'step' || o.k === 'row'); }
  }
  if (W.flash >= 0 && time < W.flashUntil && R.idx >= 0) {
    c.setLineDash([]); c.lineWidth = 3; c.strokeStyle = '#f5c84c'; c.beginPath(); c.roundRect(gx - 2, gy + W.flash * thh - 2, S.P2.i * tw + 4, thh + 4, 8); c.stroke();
    text(T[lang].w.plus, gx + S.P2.i * tw + 40 < w - 8 ? gx + S.P2.i * tw + 34 : w - 44, gy + (W.flash + 0.5) * thh, '#f5c84c');
  }
  drawTurtle(c, gx + (tx + 0.5) * tw, gy + (ty + 0.5) * thh, hd, Math.min(thh * 0.36, 13), time, moving);
}

function drawThumb(cv, sim) {
  const d = 2, sz = Math.round(cv.getBoundingClientRect().width) || 96;
  cv.width = cv.height = sz * d; const c = cv.getContext('2d'); c.scale(d, d);
  const g = c.createLinearGradient(0, 0, sz, sz); g.addColorStop(0, '#f8f2e0'); g.addColorStop(1, '#e5dabb'); c.fillStyle = g; c.fillRect(0, 0, sz, sz);
  c.strokeStyle = 'rgba(80,120,185,.17)'; c.lineWidth = 1; c.beginPath(); for (let p = 12; p < sz; p += 12) { c.moveTo(p, 0); c.lineTo(p, sz); c.moveTo(0, p); c.lineTo(sz, p); } c.stroke();
  const [a, b, e, f] = sim.bbox, bw = Math.max(50, b - a), bh = Math.max(50, f - e), s = Math.min((sz - 20) / bw, (sz - 20) / bh), mx = (a + b) / 2, my = (e + f) / 2;
  c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 2;
  for (const o of sim.ops) if (o.k === 'move') { c.strokeStyle = hue(o.ink, o.inkN); c.beginPath(); c.moveTo(sz / 2 + (o.x0 - mx) * s, sz / 2 + (o.y0 - my) * s); c.lineTo(sz / 2 + (o.x1 - mx) * s, sz / 2 + (o.y1 - my) * s); c.stroke(); }
}

// --- the live part: counter, glowing block, round labels ----------------------------------------------------------
function pillText() {

// --- the code panel ------------------------------------------------------------------------------------------------
const pill = (k, v, lim, locked) => `<span class="pl"><button class="pm" type="button" data-k="${k}" data-d="-1" data-lim="${lim}" aria-label="−"${locked ? ' disabled' : ''}>−</button><b>${fmt(v)}</b><button class="pm" type="button" data-k="${k}" data-d="1" data-lim="${lim}" aria-label="+"${locked ? ' disabled' : ''}>+</button></span>`;
function nodeHTML(nd, b, locked) {
  const id = `data-id="${nd.id}"`, num = (v, ek, lim) => (ek ? pill(ek, v, lim, locked) : `<b class="nm">${fmt(v)}</b>`);
  switch (nd.t) {
    case 'rep': return `<div class="bk rep l${nd.lv}" ${id}><div class="hd"><span class="w">${esc(b.rep)}</span>${num(nd.n, nd.ek, nd.lim)}<span class="w">${esc(b.times)}</span><span class="meta"><i>${esc(b[nd.tag])}</i><i class="it"></i></span></div><div class="bd">${nd.body.map((n) => nodeHTML(n, b, locked)).join('')}</div></div>`;
    case 'move': return `<div class="bk mv" ${id}><span class="w">${esc(b.move)}</span><b class="nm">${nd.d === 'size' ? esc(b.sizeW) : nd.d}</b></div>`;
    case 'turn': return `<div class="bk tn${nd.mv ? ' mvbl' : ''}" ${id}${nd.mv && !locked ? ' data-mv="1" role="button" tabindex="0"' : ''}><span class="w">${esc(b.turn)}</span>${num(nd.a, nd.ek, nd.lim)}<span class="w">°</span>${nd.mv ? `<span class="ar" aria-hidden="true">${nd.inner ? '⤴' : '⤵'}</span>` : ''}</div>`;
    case 'set': return `<div class="bk va" ${id}><span class="w">${esc(b.setW)}</span><b class="nm">${nd.v}</b></div>`;
    case 'chg': return `<div class="bk va" ${id}><span class="w">${esc(b.chgW)}</span>${num(nd.by, nd.ek, nd.lim)}</div>`;

}
const optBtns = (list, picked, rightKey) => list.map(([k, label]) => {

}).join('');
const chip = (act, label, extra = '') => `<button type="button" class="chip" data-act="${act}"${extra}>${esc(label)}</button>`;
const runBtn = (t, locked) => `<button type="button" class="btn" data-act="run"${locked ? ' disabled' : ''}>${esc(R.state === 'run' ? t.ui.skip : R.state === 'idle' ? t.ui.run : t.ui.again)}</button>`;

// --- render -------------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, c = ctx();
  document.body.dataset.v = v;
  lab.setGlow(GLOW[v]);
  $('code').innerHTML = c.prog.map((n) => nodeHTML(n, t.b, c.locked)).join('');

}

function renderRing(t, c) {
  const { o, i, a } = S.P1, p = S.p1, g = p.guess, show = !S.sec && (!p.done || (g !== null && !p.edited));
  const sc = (k, emo) => `<button type="button" class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('pr').innerHTML = show ? `<div class="nl-q">${esc(t.p1.q)}</div><div class="nl-po">${optBtns([['sum', o + i], ['prod', o * i], ['outer', o]], g, 'prod')}</div>` : '';
  const closable = !S.sec && p.done && Math.abs(o * a - 360) >= 0.5;
  $('acts').innerHTML = runBtn(t, c.locked) + (closable ? chip('close', t.ui.close) : '') + sc('rings', '🌸') + sc('spiral', '🐌');
  let st;
  const P = c.P, n = R.count;
  if (!p.done) st = { emo: '🤔', title: t.pred, lead: t.p1.lead0, body: '' };
  else if (g !== null && !p.edited && !S.sec) st = { emo: g === 'prod' ? '✅' : '🤔', title: g === 'prod' ? t.p1.ok : t.p1.no, lead: t.p1.why[g](o, i), body: t.p1.try };
  else if (R.state === 'run') st = { emo: '🐢', title: t.p1.run, lead: t.p1.runLead, body: '' };
  else if (S.sec === 'rings') st = { emo: '🌸', title: t.rings.title(P.o, P.m, P.i, P.o * P.m * P.i), lead: t.rings.lead, body: '' };
  else if (S.sec === 'spiral') st = { emo: '🐌', title: t.spiral.title, lead: t.spiral.lead(P.o, P.i, P.o * P.i), body: '' };

    const first = i !== 4 ? t.p1.badShape(i) : o !== 8 ? t.p1.same : '';
    st = { emo: '🌀', title: t.p1.done(o * i), lead: t.p1.doneLead(o, i), body: [first, Math.abs(o * a - 360) < 0.5 ? t.p1.shut(o, fmt(a)) : t.p1.open(o, fmt(a))].filter(Boolean).join(' ') };
  }
  lab.setState({ ...st, extra: '' });
  lab.setFacts([t.facts.logo, t.facts.robot]);
}

function renderWall(t, c) {
  const W = S.w, P = S.P2, [tc, tr] = TARGETS[W.ti], mult = S.p1.done;

  if (pm) {
    if (pm.disabled) return;
    const [mn, mx, st] = pm.dataset.lim.split(',').map(Number), k = pm.dataset.k, nv = Math.round(clamp(c.P[k] + st * +pm.dataset.d, mn, mx) * 10) / 10;
    if (nv !== c.P[k]) { c.P[k] = nv; edited(); }
    return;
  }
  const mvb = ev.target.closest('[data-mv]');
  if (mvb && !c.locked) { c.P.tin = !c.P.tin; sfx.snap(); edited(); return; }
  const gb = ev.target.closest('[data-g]');
  if (gb && !gb.disabled) {
    const g = gb.dataset.g;
    if (v === 'ring') { S.p1.guess = g; S.p1.done = true; (g === 'prod' ? sfx.good : sfx.bad)(); start(); }
    else if (v === 'wall') {
      const W = S.w; W.guess = g; W.stage = 'demo1'; W.verdictOn = true; S.P2.o = 2; S.P2.i = 3; W.flash = -1; (g === 'outer' ? sfx.good : sfx.bad)(); start();
    } else { const k = S.b.k, rightIdx = BUGS[k].order.indexOf('start'); S.b.guess[k] = +g; (+g === rightIdx ? sfx.good : sfx.bad)(); start(); }
    render(); showStage(); return;
  }
  const a = ev.target.closest('[data-act]'); if (!a || a.disabled) return;
  const act = a.dataset.act;
  if (act === 'run') { sfx.click(); if (R.state === 'run') finish(); else { start(); render(); showStage(); } return; }
  if (act === 'close') { S.P1.a = Math.round(360 / S.P1.o * 10) / 10; edited(); return; }
  if (act === 'swap') { const P = c.P, o = P.o; P.o = Math.min(12, P.i); P.i = Math.min(8, o); edited(); return; }
  if (act === 'restart') { S.b.st[S.b.k] = { ...BUGS[S.b.k].start }; S.b.ed[S.b.k] = true; sfx.click(); start(); render(); return; }
  if (act === 'nextBug') {
    sfx.click();
    if (S.b.k < 2) S.b.k++;
    else { S.b.k = 0; S.b.st = BUGS.map((b) => ({ ...b.start })); S.b.guess = [null, null, null]; S.b.ed = [false, false, false]; }
    enter(); return;
  }
  if (act === 'nextWall') { sfx.click(); S.w.ti = (S.w.ti + 1) % 3; S.w.verdictOn = false; S.w.flash = -1; idle(); render(); return; }
  if (act === 'sec') {
    const k = a.dataset.k;
    if (!secret.unlocked()) { secret.open(); return; }
    S.sec = S.sec === k ? null : k; S.p1.done = true; S.p1.edited = true; sfx.click(); start(); render(); return;
  }
});
$('ctrlBody').addEventListener('keydown', (ev) => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[data-mv]')) { ev.preventDefault(); ev.target.click(); }
});

// --- the loop ----------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (R.state === 'run') {
    R.t += dt;
    if (R.t >= R.total) finish();
    else { while (R.idx + 1 < R.ops.length && R.ops[R.idx + 1].start <= R.t) R.idx++; }
  }
  if (R.idx !== R.shown) live();
  if (lab.view === 'wall') drawWall(c, w, h, dt, time); else drawPaper(c, w, h, dt, time);
});
enter();
</script>
