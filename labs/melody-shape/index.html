function play(ps, done) {

  const n = ps.length, step = 0.54; BIRD.fx = fOf(0, n); BIRD.p = ps[0]; BIRD.dir = 1;
  ps.forEach((p, i) => {

}

let FOG_T = null;
canvasLoop($('cv'), (c, w, h, dt, tt) => {

$('ctrlBody').innerHTML = `
  <button class="chip ms-snd" data-act="snd" id="msSnd"></button>
  <div class="ms-q" id="msQ"></div>
  <div id="msListen"><div class="ms-cards" id="msCards"></div><div class="ms-row" id="msLRow"></div></div>
  <div id="msSteps"><div class="ms-ans" id="msAns"></div><div class="ms-row" id="msSRow"></div></div>
  <div id="msDraw"><div class="chips" id="msGoals"></div><div class="ms-row" id="msDRow"></div></div>
  <div class="ms-sec"><div class="chips" id="msSecs"></div></div>`;
$('sound').addEventListener('click', () => render());

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const cardSvg = (p) => {
  const pts = p.map((q, i) => [8 + i * 80 / 7, 46 - q * 40 / 7]);
  return `<svg viewBox="0 0 96 52" aria-hidden="true"><path d="M${pts.map((q) => q.map((x) => x.toFixed(1)).join(',')).join(' L')}" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 5"/>${pts.map(([x, y], i) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${RC[p[i]]}" stroke="#1a1030" stroke-opacity=".55"/>`).join('')}</svg>`;
};

function playListen() {
  wantSound(); S.sec = null;
  if (L.phase !== 'reveal') L.phase = 'playing';
  play(TUNES[L.i], () => { if (L.phase === 'playing') L.phase = 'guess'; L.heard = true; });
  render();
}
function act(a, b) {
  if (a === 'snd') { $('sound').click(); return; }
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    wantSound(); stopAll(); S.sec = b; render();
    if (b === 'a') play([0, 0, 4, 4]);
    else { const o = D.p || TUNES[1]; play(o, () => later(300, () => play(o.map((x) => 7 - x)))); }
    showStage(); return;
  }
  S.sec = null;
  if (a === 'go' || a === 'replay') return playListen();
  if (a === 'pick') {
    L.guess = +b; L.phase = 'reveal'; stopAll(); render(); showStage();
    later(1100, () => { wantSound(); play(TUNES[L.i]); }); return;
  }
  if (a === 'lnext') { loadRound((L.i + 1) % TUNES.length); }
  else if (a === 'splay') { wantSound(); play(STEPT[S.i]); }
  else if (a === 'ans') {
    if (S.checked) return;
    S.ans[S.m] = b; sfx.tick();
    const nx = S.ans.findIndex((x, i) => i > S.m && x === null), any = S.ans.findIndex((x) => x === null);
    S.m = nx >= 0 ? nx : any >= 0 ? any : S.m;
  } else if (a === 'check') {
    S.checked = true; wantSound(); sfx.click(); play(STEPT[S.i]); showStage();
  } else if (a === 'snext') loadSteps((S.i + 1) % STEPT.length);
  else if (a === 'goal') D.goal = D.goal === b ? null : b;
  else if (a === 'dplay') { if (D.p) { wantSound(); play(D.p); } }
  else if (a === 'clear') { stopAll(); D.p = null; D.raw = []; D.from = []; D.short = false; D.rid++; }
  render();
}
$('ctrlBody').addEventListener('click', (ev) => { const b = ev.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b.dataset.k); });
$('overlay').addEventListener('click', (ev) => { const b = ev.target.closest('[data-act]'); if (b) act(b.dataset.act, b.dataset.k); });

// the hillside takes the finger: tap an arrow (steps) or draw a line (draw)
const cv = $('cv');
cv.addEventListener('pointerdown', (ev) => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, v = lab.view;
  if (v === 'steps') {
    if (S.checked) return;
    let best = -1, bd = 34;
    ARR.forEach((a) => { const d = Math.hypot(a.x - x, a.y - y); if (d < bd) { bd = d; best = a.i; } });
    if (best >= 0) { S.m = best; sfx.tick(); render(); }
    return;
  }
  if (v !== 'draw') return;
  S.sec = null; stopAll(); wantSound();
  D.raw = [{ x, y }]; D.drawing = true; D.p = null; D.from = []; D.short = false; D.rid++;
  try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
  render();
});
cv.addEventListener('pointermove', (ev) => {
  if (!D.drawing) return;
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, l = D.raw[D.raw.length - 1];
  if (Math.hypot(x - l.x, y - l.y) > 2) D.raw.push({ x, y });
});
const endDraw = () => {
  if (!D.drawing) return;
  D.drawing = false;
  const pts = D.raw, cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const len = cum[cum.length - 1];
  if (len < 60) { D.raw = []; D.short = true; render(); return; }
  const p = [], from = []; let j = 0;
  for (let k = 0; k < 8; k++) {
    const tg = len * k / 7; while (j < cum.length - 2 && cum[j + 1] < tg) j++;
    const sl = cum[j + 1] - cum[j] || 1, f = clamp01((tg - cum[j]) / sl), x = pts[j].x + (pts[j + 1].x - pts[j].x) * f, y = pts[j].y + (pts[j + 1].y - pts[j].y) * f;
    from.push({ x, y }); p.push(clamp(Math.round((G.h - G.mb - y) / G.rh - 0.5), 0, 7));
  }
  D.p = p; D.from = from; D.snapT = nowS(); D.rid++;
  render(); later(900, () => play(p)); showStage();
};
cv.addEventListener('pointerup', endDraw); cv.addEventListener('pointercancel', endDraw);

// --- one render per change -----------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], u = t.u, v = lab.view, key = [S.sec, v, L.rid, S.rid, D.rid].join('|');
  if (key !== lastKey) { lastKey = key; placeBird(); }
  document.body.dataset.v = v;
  $('msListen').hidden = v !== 'listen'; $('msSteps').hidden = v !== 'steps'; $('msDraw').hidden = v !== 'draw';
  $('msSnd').hidden = store.get('sound', false); $('msSnd').textContent = u.snd;
  $('msQ').textContent = t.q[v];
  $('msSecs').innerHTML = [['a', '🦢'], ['b', '🪞']].map(([k, emo]) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? emo : '🔒'} ${esc(t.secrets[k][0])}</button>`).join('');
  lab.setFacts([{ emo: FACTS[v].emo, src: FACTS[v].src, text: FACTS[v][lang] }]);
  $('overlay').innerHTML = v === 'listen' && L.phase === 'ready' && !S.sec ? `<button class="ms-go" data-act="go">${esc(u.go)}</button>` : '';
  if (v === 'listen') renderListen(t, u); else if (v === 'steps') renderSteps(t, u); else renderDraw(t, u);
  if (S.sec) {
    lab.setReadout(S.sec === 'a' ? '🦢' : '🪞', t.secrets[S.sec][0], '', '#ffd23f');
    lab.setState({ emo: S.sec === 'a' ? '🦢' : '🪞', title: t.secrets[S.sec][0], lead: t.secrets[S.sec][1], body: '', extra: '' });
  }
}
function renderListen(t, u) {
  const rev = L.phase === 'reveal', off = !L.heard || L.phase === 'playing' || rev;
  $('msCards').innerHTML = L.order.map((ci, pos) => `<button class="ms-card ${rev && ci === 0 ? 'good' : ''} ${rev && L.guess === pos && ci !== 0 ? 'bad' : ''}" data-act="pick" data-k="${pos}" ${off ? 'disabled' : ''} aria-label="${pos + 1}">${cardSvg(L.contours[ci])}</button>`).join('');
  $('msLRow').innerHTML = (L.phase === 'guess' ? `<button class="ms-b" data-act="replay">${esc(u.replay)}</button>` : '')
    + (rev ? `<button class="ms-b" data-act="replay">${esc(u.replay)}</button><button class="ms-b main" data-act="lnext">${esc(u.next)}</button>` : '');
  if (!rev) {
    lab.setReadout('?', u.tuneNo(L.i + 1, TUNES.length), '', '#7ad35b');
    lab.setState({ emo: '🌫️', title: u.fogT, lead: L.heard ? u.pick : u.fogL, body: '', extra: '' });
  } else {
    const ok = L.order[L.guess] === 0, name = t.tunes[L.i];
    lab.setReadout(esc(name), u.tuneNo(L.i + 1, TUNES.length), '', ok ? '#3ddc97' : '#ff9a3c');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? u.ok : u.no, lead: u.tuneIs(name), body: ok ? '' : u.seeGlow, extra: '' });
  }
}
function renderSteps(t, u) {
  const p = STEPT[S.i], m = S.ans.length, done = S.ans.filter((x) => x !== null).length;
  $('msAns').innerHTML = ['step', 'leap', 'same'].map((k) => `<button class="ms-b ${S.ans[S.m] === k ? 'on' : ''}" data-act="ans" data-k="${k}" ${S.checked ? 'disabled' : ''}>${esc(t.lab[k])}</button>`).join('');
  $('msSRow').innerHTML = `<button class="ms-b" data-act="splay">${esc(u.replay)}</button>`
    + (S.checked ? `<button class="ms-b main" data-act="snext">${esc(u.next)}</button>` : `<button class="ms-b main" data-act="check" ${done < m ? 'disabled' : ''}>${esc(u.check)}</button>`);
  if (!S.checked) {
    lab.setReadout(`${done}/${m}`, u.labelled, '', '#2fc4b2');
    lab.setState({ emo: '🪜', title: u.stepsT, lead: `${t.stunes[S.i]} · ${u.moveL(S.m + 1, m)}`, body: u.stepsB, extra: '' });
  } else {
    const k = S.ans.filter((a, i) => a === kindOfMove(p[i], p[i + 1])).length, all = k === m;
    lab.setReadout(`${k}/${m}`, u.rightW, '', all ? '#3ddc97' : '#ff9a3c');
    lab.setState({ emo: all ? '✅' : '🤔', title: all ? u.ok : u.score(k, m), lead: all ? u.allOk : u.fixed, body: '', extra: '' });
  }
}
function renderDraw(t, u) {
  $('msGoals').innerHTML = [['smooth', u.gSmooth], ['jumpy', u.gJumpy]].map(([k, l]) => `<button class="chip ${D.goal === k ? 'on' : ''}" data-act="goal" data-k="${k}">${esc(l)}</button>`).join('');
  $('msDRow').innerHTML = `<button class="ms-b" data-act="dplay" ${D.p ? '' : 'disabled'}>${esc(u.replay)}</button><button class="ms-b" data-act="clear" ${D.p ? '' : 'disabled'}>${esc(u.clear)}</button>`;
  if (!D.p) {
    lab.setReadout('–', u.units, '', '#4ea8ff');
    lab.setState({ emo: '✏️', title: u.drawT, lead: D.short ? u.short : u.drawL, body: '', extra: '' });
  } else {
    const k = counts(D.p), kind = kindOfTune(k), tag = D.goal ? (D.goal === kind ? u.goalYes : u.goalNo) : u.again;
    lab.setReadout(`${k.st} · ${k.lp} · ${k.sm}`, u.units, u.kinds[kind], kind === 'jumpy' ? '#ff9a3c' : kind === 'smooth' ? '#2fc4b2' : '#4ea8ff');
    lab.setState({ emo: '🎶', title: u.kindT[kind], lead: tag, body: '', extra: '' });
  }
}
render();
</script>
</body>
</html>
