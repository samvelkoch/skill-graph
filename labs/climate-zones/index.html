const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const outBack = (x) => { x = clamp01(x); const k = 1.70158; return 1 + (k + 1) * (x - 1) ** 3 + k * (x - 1) ** 2; };
const kk = (dt, rate) => 1 - Math.exp(-dt * rate);
const shuf = (n) => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgba = (h, a) => { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; };
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return '#' + A.map((x, i) => Math.round(x + (B[i] - x) * t).toString(16).padStart(2, '0')).join(''); };
const num = (x) => { const s = String(Math.round(x * 10) / 10).replace('-', '−'); return lang === 'en' ? s : s.replace('.', ','); };
const fmtT = (x) => { const r = Math.round(x * 10) / 10; return `${lang === 'ru' && r > 0 ? '+' : ''}${num(r)} °C`; };
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const BAND = ['#FF8A5B', '#7FC97F', '#A9D6F5']; // tropical, temperate, polar
const bandOfLat = (lat) => { const a = Math.abs(lat); return a < 23.5 ? 0 : a < 66.5 ? 1 : 2; };
let CW = 0, CH = 0;

function rr(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
// dark rounded label, clamped inside the canvas; o.left: x is the left edge, o.dot: a colour dot before the text
function pill(c, text, x, y, o = {}) {
  const size = o.size ?? 12, padX = 9, hh = size + 10;
  c.save(); c.font = `800 ${size}px Nunito, sans-serif`; c.textBaseline = 'middle'; c.textAlign = 'left';
  const tw = c.measureText(text).width + (o.dot ? 14 : 0), w = tw + padX * 2;
  let px = o.left ? x : x - w / 2; px = Math.max(4, Math.min(CW - w - 4, px));
  const py = Math.max(2, Math.min(CH - hh - 2, y - hh / 2));
  c.globalAlpha = o.alpha ?? 1;
  c.fillStyle = o.bg ?? 'rgba(10,14,30,.8)'; rr(c, px, py, w, hh, hh / 2); c.fill();
  if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = 1; c.stroke(); }
  let tx = px + padX;
  if (o.dot) { c.fillStyle = o.dot; c.beginPath(); c.arc(tx + 4, py + hh / 2, 4, 0, TAU); c.fill(); tx += 14; }
  c.fillStyle = o.fg ?? '#fff'; c.fillText(text, tx, py + hh / 2 + 0.5);
  c.restore();
}
function emoji(c, ch, x, y, size, alpha = 1) {
  c.save(); c.globalAlpha = alpha; c.font = `${size}px ${EMO}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#ffffff';
  c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 6; c.fillText(ch, x, y); c.restore();
}

const LAND_KIND = LAND.map((_, i) => (i === 1 || i === LAND.length - 1 ? 'ice' : 'land'));
const dens = (poly, step = 6) => {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], k = Math.max(1, Math.ceil(Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])) / step));
    for (let j = 0; j < k; j++) out.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]);
  }
  return out;
};
const LAND_D = LAND.map((p) => dens(p));
const DESERT = '#C9A66B', FOREST = '#4E8F4A';
// soft patches painted on the land: deserts and rainforests [lon, lat, radius lon, radius lat, colour]
const BLOBS = [[10, 24, 24, 7, DESERT], [45, 23, 10, 6, DESERT], [100, 43, 16, 5, DESERT], [134, -25, 12, 7, DESERT], [22, -23, 8, 5, DESERT], [-110, 36, 8, 5, DESERT],

function landPath(c, proj, kind) {
  c.beginPath();
  for (let i = 0; i < LAND_D.length; i++) {
    if (LAND_KIND[i] !== kind) continue;
    const pts = LAND_D[i].map(([lo, la]) => proj(lo, la));
    let zmax = -1; for (const p of pts) if (p[2] > zmax) zmax = p[2];
    if (zmax <= 0.02) continue; // a continent on the far side
    pts.forEach((p, j) => (j ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])));
    c.closePath();
  }
}
function drawLandLayers(c, proj, sx, sy, box, globe, noForest) {
  const g = c.createLinearGradient(box[0], box[1], box[2], box[3]);
  g.addColorStop(0, '#93c47c'); g.addColorStop(1, '#6a9a58');
  c.save(); landPath(c, proj, 'land'); c.fillStyle = g; c.fill(); c.clip();
  for (const b of BLOBS) {
    if (noForest && b[4] === FOREST) continue;
    const [x, y, z] = proj(b[0], b[1]); if (z < 0.05) continue;
    const rx = b[2] * sx * (globe ? Math.cos(b[1] * D2R) * Math.max(0.3, z) : 1), ry = b[3] * sy; if (rx < 1) continue;
    const rg = c.createRadialGradient(0, 0, 0, 0, 0, rx); rg.addColorStop(0, rgba(b[4], 0.85)); rg.addColorStop(1, rgba(b[4], 0));
    c.save(); c.translate(x, y); c.scale(1, ry / rx); c.fillStyle = rg; c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill(); c.restore();
  }

}
function landStroke(c, proj) {
  c.save(); c.lineJoin = 'round'; c.lineWidth = 1;

  landPath(c, proj, 'ice'); c.strokeStyle = 'rgba(110,140,185,.7)'; c.stroke();

// orthographic projection of the globe seen from the side (equator horizontal); far-side points are pushed to the rim
function gProj(lon, lat, gx, gy, R, lon0) {
  const la = lat * D2R, dl = (lon - lon0) * D2R;
  let x = Math.cos(la) * Math.sin(dl), y = Math.sin(la); const z = Math.cos(la) * Math.cos(dl);
  if (z < 0) { const L = Math.hypot(x, y) || 1; x /= L; y /= L; }
  return [gx + R * x, gy - R * y, z];
}

// the globe: ocean, land, latitude lines, optional climate belts, night side. o: { lon0, dark, belt }
function drawGlobe(c, gx, gy, R, o) {
  const belt = o.belt ?? 0, dark = o.dark ?? 0.3;
  c.save(); c.translate(gx, gy + R * 1.12); c.scale(1, 0.13);
  let g = c.createRadialGradient(0, 0, 0, 0, 0, R * 0.9); g.addColorStop(0, 'rgba(0,0,0,.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, R * 0.9, 0, TAU); c.fill(); c.restore();
  g = c.createRadialGradient(gx, gy, R * 0.96, gx, gy, R * 1.17);
  g.addColorStop(0, 'rgba(130,200,255,.4)'); g.addColorStop(1, 'rgba(130,200,255,0)');
  c.fillStyle = g; c.beginPath(); c.arc(gx, gy, R * 1.17, 0, TAU); c.fill();
  c.save(); c.beginPath(); c.arc(gx, gy, R, 0, TAU); c.clip();
  g = c.createRadialGradient(gx - R * 0.4, gy - R * 0.42, R * 0.08, gx, gy, R * 1.15);
  g.addColorStop(0, '#5aa2e2'); g.addColorStop(0.45, '#2F6FB0'); g.addColorStop(1, '#17386a');
  c.fillStyle = g; c.fillRect(gx - R, gy - R, R * 2, R * 2);
  // meridians and latitude lines
  c.strokeStyle = 'rgba(255,255,255,.10)'; c.lineWidth = 1;
  for (const a of [-60, -30, 30, 60]) { c.beginPath(); c.ellipse(gx, gy, Math.max(0, Math.abs(R * Math.sin(a * D2R))), R, 0, 0, TAU); c.stroke(); }
  c.beginPath(); c.moveTo(gx, gy - R); c.lineTo(gx, gy + R); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.14)';
  for (const d of [-60, -30, 30, 60]) { const y = gy - R * Math.sin(d * D2R), xw = R * Math.cos(d * D2R); c.beginPath(); c.moveTo(gx - xw, y); c.lineTo(gx + xw, y); c.stroke(); }
  const proj = (lo, la) => gProj(lo, la, gx, gy, R, o.lon0 ?? 12);
  drawLandLayers(c, proj, R * D2R, R * D2R, [gx - R, gy - R, gx + R, gy + R], true);
  // climate belts
  if (belt > 0.01) {
    const yy = (d) => gy - R * Math.sin(d * D2R), ed = [90, 66.5, 23.5, -23.5, -66.5, -90], cols = [2, 1, 0, 1, 2];
    for (let i = 0; i < 5; i++) { c.fillStyle = rgba(BAND[cols[i]], 0.4 * belt); c.fillRect(gx - R, yy(ed[i]), R * 2, yy(ed[i + 1]) - yy(ed[i])); }
    c.setLineDash([6, 4]); c.lineWidth = 1.2; c.strokeStyle = `rgba(255,255,255,${0.7 * belt})`;
    for (const d of [66.5, 23.5, -23.5, -66.5]) { c.beginPath(); c.moveTo(gx - R, yy(d)); c.lineTo(gx + R, yy(d)); c.stroke(); }
    c.setLineDash([]);
  }
  landStroke(c, proj);
  // the equator
  c.setLineDash([7, 5]); c.lineWidth = 1.6; c.strokeStyle = 'rgba(255,255,255,.7)';
  c.beginPath(); c.moveTo(gx - R, gy); c.lineTo(gx + R, gy); c.stroke(); c.setLineDash([]);
  // night side and shade
  c.fillStyle = `rgba(5,10,30,${dark})`; c.fillRect(gx - R, gy - R, R * 2, R * 2);
  g = c.createLinearGradient(gx - R, 0, gx + R, 0);
  g.addColorStop(0, 'rgba(5,10,30,0)'); g.addColorStop(0.5, 'rgba(5,10,30,.08)'); g.addColorStop(1, 'rgba(5,10,30,.5)');
  c.fillStyle = g; c.fillRect(gx - R, gy - R, R * 2, R * 2);
  g = c.createRadialGradient(gx - R * 0.42, gy - R * 0.46, 0, gx - R * 0.42, gy - R * 0.46, R * 0.6);
  g.addColorStop(0, 'rgba(255,255,255,.26)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(gx - R, gy - R, R * 2, R * 2);
  c.restore();
  c.lineWidth = 1.5; c.strokeStyle = 'rgba(8,16,40,.85)'; c.beginPath(); c.arc(gx, gy, R, 0, TAU); c.stroke();
}

const thermoY = (yTop, yBot, level, br = 10) => (yBot - br) - level * (yBot - br - yTop - 6);
function drawThermo(c, x, yTop, yBot, level, color, tw = 12) {
  const br = tw * 0.85, tubeBot = yBot - br;
  c.save(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(220,235,255,.6)'; c.fillStyle = 'rgba(220,235,255,.12)';
  rr(c, x - tw / 2, yTop, tw, tubeBot - yTop + 4, tw / 2); c.fill(); c.stroke();
  c.beginPath(); c.arc(x, yBot - br + 2, br, 0, TAU); c.fill(); c.stroke();
  const ly = thermoY(yTop, yBot, clamp01(level), br), lw = tw - 6;
  const g = c.createLinearGradient(x - lw / 2, 0, x + lw / 2, 0); g.addColorStop(0, mix(color, '#ffffff', 0.35)); g.addColorStop(0.5, color); g.addColorStop(1, mix(color, '#000000', 0.25));
  c.fillStyle = g; rr(c, x - lw / 2, ly, lw, tubeBot - ly + 4, lw / 2); c.fill();
  c.beginPath(); c.arc(x, yBot - br + 2, Math.max(0, br - 3), 0, TAU); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1;
  for (let i = 1; i <= 4; i++) { const y = lerp(tubeBot, yTop + 6, i / 5); c.beginPath(); c.moveTo(x + tw / 2 + 2, y); c.lineTo(x + tw / 2 + (i % 2 ? 6 : 9), y); c.stroke(); }
  c.restore();
}

function drawFlashlight(c, lx, ty, u, on, hint, time) {
  c.save(); c.translate(lx, ty);
  if (on > 0.02) { const g = c.createRadialGradient(0, 0, 0, 0, 0, u * 3.4); g.addColorStop(0, `rgba(255,236,150,${0.55 * on})`); g.addColorStop(1, 'rgba(255,236,150,0)'); c.fillStyle = g; c.beginPath(); c.arc(0, 0, u * 3.4, 0, TAU); c.fill(); }
  c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 10; c.shadowOffsetY = 4;
  const hl = u * 3.4, hh = u * 0.8, hx = -u * 1.9 - hl + u * 0.3;
  let g = c.createLinearGradient(0, -hh, 0, hh); g.addColorStop(0, '#7280ae'); g.addColorStop(0.5, '#3b4670'); g.addColorStop(1, '#222949');
  c.fillStyle = g; rr(c, hx, -hh, hl, hh * 2, hh * 0.7); c.fill();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
  c.strokeStyle = 'rgba(10,14,30,.55)'; c.lineWidth = 1.5; rr(c, hx, -hh, hl, hh * 2, hh * 0.7); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 1.5;
  for (let i = 1; i <= 5; i++) { const x = hx + hl * (0.2 + i * 0.1); c.beginPath(); c.moveTo(x, -hh * 0.6); c.lineTo(x, hh * 0.6); c.stroke(); }
  c.fillStyle = on > 0.5 ? '#ffd24d' : '#c8cfe6'; c.beginPath(); c.arc(hx + hl * 0.2, -hh - u * 0.1, u * 0.28, 0, TAU); c.fill(); // switch
  g = c.createLinearGradient(0, -u * 1.4, 0, u * 1.4); g.addColorStop(0, '#8d9bc6'); g.addColorStop(0.5, '#4a5683'); g.addColorStop(1, '#2a3157');
  c.fillStyle = g; c.beginPath(); c.moveTo(-u * 1.9, -hh * 1.05); c.lineTo(0, -u * 1.45); c.lineTo(0, u * 1.45); c.lineTo(-u * 1.9, hh * 1.05); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(10,14,30,.6)'; c.lineWidth = 1.5; c.stroke();
  g = c.createRadialGradient(0, 0, 0, 0, 0, u * 1.2);
  if (on > 0.05) { g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#fff0a8'); g.addColorStop(1, '#ffd24d'); } else { g.addColorStop(0, '#dfe5f5'); g.addColorStop(1, '#8c96b8'); }
  c.save(); c.scale(0.32, 1); c.fillStyle = g; c.beginPath(); c.arc(0, 0, u * 1.25, 0, TAU); c.fill(); c.restore();
  if (hint) { // up and down chevrons say: drag me
    const a = 0.55 + 0.35 * Math.sin(time * 4); c.fillStyle = `rgba(255,255,255,${a})`;
    for (const s of [-1, 1]) { const y = s * (u * 2.2 + 2), x = -u * 2.6; c.beginPath(); c.moveTo(x - 6, y); c.lineTo(x + 6, y); c.lineTo(x, y + s * 7); c.closePath(); c.fill(); }
  }
  c.restore();
}

const MAXLAT = 70;

  } else {
    const s = S.local; s.pick = k;
    if (s.step === 'q1') { s.step = 'r1'; s.hT = 3000; s.done = false; (k === 0 ? sfx.good : sfx.bad)(); }
    else if (s.step === 'q2') { s.step = 'r2'; (k === 1 ? sfx.good : sfx.bad)(); }
    else return;
  }
  showStage(); render();
}
function go(what) {
  const v = lab.view; sfx.click();
  if (v === 'torch') {
    const s = S.torch;
    if (what === 'again') { S.torch = newTorch(false); S.torch.dragged = s.dragged; }
    else if (s.step === 'r1') { s.step = 'q2'; s.order = shuf(3); s.pick = null; }
    else if (s.step === 'r2') { s.step = 'free'; store.set('climate-zones:asked', true); }
  } else if (v === 'zones') {
    const s = S.zones;
    if (what === 'again') S.zones = newZones();
    else if (s.step === 'rq') { s.step = 'sort'; s.i = 0; }
    else if (s.step === 'rs') { if (s.i < 5) { s.i++; s.step = 'sort'; } else s.step = 'end'; }
  } else {
    const s = S.local;
    if (what === 'again') S.local = newLocal();
    else if (s.step === 'r1') { s.step = 'q2'; s.order = shuf(2); s.pick = null; }
  }
  render();
}
cardEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.a !== undefined) answer(+b.dataset.a); else if (b.dataset.go) go(b.dataset.go);
});
$('cv').addEventListener('click', (ev) => { // tap a band of the zone map
  const s = S.zones, m = S.mapRect;
  if (lab.view !== 'zones' || !(s.step === 'q' || s.step === 'sort') || !m) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (x < m.x || x > m.x + m.w || y < m.y || y > m.y + m.h) return;
  answer(bandOfLat(90 - (y - m.y) / m.h * 180));
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const s = S.torch;
  if (b.dataset.act === 'again') return go('again');
  if (b.dataset.act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; s.sec = s.sec === k ? null : k;
    if (s.sec === 'kili') { S.kili.h = 900; S.kili.hT = 5895; S.kili.vel = 0; }
    if (s.sec === 'records') S.rec.t = 0;
    sfx.click(); render(true);
  }
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'hs') return;
  if (lab.view === 'torch') S.kili.hT = +ev.target.value; else S.local.hT = +ev.target.value;
});
render(true);
</script>
</body>
