  const pk = S.pk, p = t.pack, done = pk.r >= 3;
  lab.setGlow('rgba(90,170,160,.26)');
  $('wmBag').innerHTML = ITEMS.map(([k, e]) => `<button class="chip wm-c ${pk.bag.includes(k) ? 'on' : ''}" data-act="bag" data-k="${k}"${pk.went || done ? ' disabled' : ''}>${e} ${esc(p.items[k])}</button>`).join('');
  $('wmBag').style.display = done ? 'none' : '';
  const go = $('wmGo');
  go.textContent = done ? p.again : pk.went ? (pk.r === 2 ? p.result : p.next) : p.go;
  go.disabled = !done && !pk.went && pk.bag.length === 0;
  if (done) {
    const k = pk.res.filter((r) => r.missing === 0).length;
    $('wmRes').innerHTML = `<div class="wm-v">${esc(p.end(k))}</div><p class="wm-t">${esc(p.endL)}</p>`;
    lab.setReadout(`${k}/3`, '', '', '#3ddc97'); lab.setState({ emo: '🏆', title: p.end(k), lead: p.endL, body: '', extra: '' }); lab.setFacts(fact('pack'));
    return;
  }
  const town = ROUNDS[pk.r], tn = TOWN[town].n;
  if (!pk.went) {
    $('wmRes').innerHTML = '';
    lab.setReadout(String(pk.bag.length), p.bag(pk.bag.length), `${pk.r + 1}/3`, '#5fb7a8');
    lab.setState({ emo: '🎒', title: p.round(pk.r + 1, 3, tn), lead: p.lead, body: '', extra: '' }); lab.setFacts([]);
  } else {
    const need = NEED[town], all = ITEMS.map((i) => i[0]).filter((k) => pk.bag.includes(k) || need.includes(k));
    const em = Object.fromEntries(ITEMS);
    $('wmRes').innerHTML = `<div class="wm-res">${all.map((k) => {
      const cls = pk.bag.includes(k) && need.includes(k) ? 'ok' : need.includes(k) ? 'miss' : 'extra', mark = cls === 'ok' ? '✓' : cls === 'miss' ? '✗' : '–';
      return `<span class="wm-tag ${cls}">${mark} ${em[k]} ${esc(p.items[k])} <small>${esc(p[cls])}</small></span>`;
    }).join('')}</div>`;
    const r = pk.res[pk.r], miss = need.filter((k) => !pk.bag.includes(k)).map((k) => p.items[k].toLowerCase()).join(', ');
    const verdict = r.missing ? p.missing(miss) : r.extra ? p.heavy : p.perfect;
    lab.setReadout(r.missing ? '✗' : '✓', tn, `${pk.r + 1}/3`, r.missing ? '#f5c84c' : '#3ddc97');
    lab.setState({ emo: r.missing ? '🤔' : '✅', title: verdict, lead: p.why[town](PK[town]), body: '', extra: '' }); lab.setFacts(fact('pack'));
  }
}
function renderTm(t) {
  const m = t.tm, tt = S.tm, h = hourOf(tt.t), guessed = tt.guess !== null, wet = bandD(tt.t, TOWN.riverton) < BW;
  lab.setGlow('rgba(90,150,255,.26)');
  $('wmE0').textContent = m.ends[0]; $('wmE1').textContent = m.ends[1];
  const R = $('wmR'); R.disabled = !guessed || tt.anim; if (+R.value !== Math.round(tt.t * 100)) R.value = Math.round(tt.t * 100);
  const q = $('wmTq');
  if (!guessed) {
    if (!q.querySelector('[data-act=tm]')) q.innerHTML = `<p class="wm-q">${esc(m.q)}</p><div class="wm-row" style="margin:0 0 10px"><button class="wm-ans" data-act="tm" data-k="yes">${esc(m.yes)}</button><button class="wm-ans" data-act="tm" data-k="no">${esc(m.no)}</button></div>`;
    else q.querySelector('.wm-q').textContent = m.q, q.querySelectorAll('.wm-ans')[0].textContent = m.yes, q.querySelectorAll('.wm-ans')[1].textContent = m.no;
    lab.setReadout(hh(h), h < 24 ? m.today : m.tomorrow, '', '#5aa9ff');
    lab.setState({ emo: '🌧️', title: m.t0, lead: m.l0, body: m.q, extra: '' }); lab.setFacts([]);
    return;
  }
  const ok = tt.guess === 'yes', when = m.when(hh(hourOf(rivRainFrom)));
  q.innerHTML = `<div class="wm-v" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? m.right : m.wrong)}</div><p class="wm-t">${esc(m.ex(when))}</p>${tt.anim ? '' : `<p class="wm-t">${esc(m.slide)}</p>`}`;
  lab.setReadout(hh(h), h < 24 ? m.today : m.tomorrow, wet ? m.wet : m.dry, wet ? '#5aa9ff' : '#ffcf4a');
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? m.right : m.wrong, lead: m.ex(when), body: m.wind, extra: `<div class="wm-fine">${esc(wet ? m.lWet : m.lDry)}</div>` }); lab.setFacts(fact('tm'));
}

// --- the loop ---------------------------------------------------------------------------------------------------
canvasLoop(cv, (c, w, h, dt, time) => {
  V.sc = Math.min(w / W, h / H) * 0.99; V.ox = (w - W * V.sc) / 2; V.oy = (h - H * V.sc) / 2;
  const dpr = c.getTransform().a, key = `${w}|${h}|${dpr}`;
  if (!base || baseKey !== key) {
    baseKey = key; base = document.createElement('canvas'); base.width = Math.round(w * dpr); base.height = Math.round(h * dpr);
    const bc = base.getContext('2d'); bc.setTransform(dpr, 0, 0, dpr, 0, 0); paintBase(bc, w, h);
  }
  c.drawImage(base, 0, 0, w, h);
  if (S.tm.anim) {
    S.tm.at += dt; const u = Math.min(1, S.tm.at / 3.2); S.tm.t = easeIO(u);
    if (u >= 1) S.tm.anim = false;
    if (lab.view === 'tomorrow' && !S.sec) renderTm(T[lang]);
  }
  c.save(); c.translate(V.ox, V.oy); c.scale(V.sc, V.sc); drawScene(c, time); c.restore();
});
render();
