  const m = t.mod, sub = S.sub, md = S.md;
  lab.setGlow('rgba(240,190,100,.26)');
  put('swMs', ['mars', 'ven'].map((k) => `<button class="chip${sub === k ? ' on' : ''}" data-act="sub" data-k="${k}">${esc(m.subs[k])}</button>`).join(''));
  put('swMd', ['earth', 'sun'].map((k) => `<button class="chip${md === k ? ' on' : ''}" data-act="md" data-k="${k}">${esc(m.mds[k])}</button>`).join(''));
  const lipFacts = [t.facts.lip, t.facts.gal];
  if (sub === 'mars') {
    const cap = capT('mars'), locked = S.g2 === null;
    put('swAns2', ''); $('swQ2').textContent = ''; $('swQ2').hidden = true;
    setRange('swR2', PLAN.mars.tMin, cap, 0.1, S.t3);
    $('swV2').textContent = t.week(Math.round(S.t3 - PLAN.mars.tMin) + 1);
    const atEnd = S.t3 >= cap - 1e-6;
    $('swPlay2').textContent = S.p3 ? t.up.pause : atEnd && !locked ? t.up.again : t.up.play; $('swPlay2').disabled = locked && atEnd;
    $('swNote').textContent = locked ? m.lock : ''; $('swNote').hidden = !locked;
    lab.setReadout(t.week(Math.round(S.t3 - PLAN.mars.tMin) + 1), md === 'earth' ? m.mds.earth : m.mds.sun, '', '#f0b86a');
    if (locked) { lab.setState({ emo: '⚖️', title: m.lockT, lead: m.lockL, body: '', extra: '' }); lab.setFacts(lipFacts); return; }
    const d = md === 'earth' ? m.earth : m.sun;
    lab.setState({ emo: md === 'earth' ? '🌍' : '☀️', title: d[0], lead: d[1], body: d[2], extra: `<div class="sw-verdict" style="color:var(--soft)">${esc(m.circ(md === 'earth' ? 3 : 2, md === 'earth' ? 11 : 6))}</div>` });
    lab.setFacts(lipFacts); return;
  }
  // Venus phases
  const g = S.g3, t3 = S.tv3 - 20, v = md === 'earth' ? venE(t3) : venS(t3);
  put('swAns2', g === null ? m.vopts.map((o, i) => `<button class="chip sw-opt" data-act="ans3" data-i="${i}">${esc(o)}</button>`).join('') : '');
  $('swQ2').textContent = g === null ? m.vq : ''; $('swQ2').hidden = g !== null;
  setRange('swR2', 0, 84, 1, S.tv3);
  $('swV2').textContent = t.month(Math.min(20, Math.floor(S.tv3 / 4.35) + 1));
  $('swPlay2').textContent = S.p3 ? t.up.pause : S.tv3 >= 84 ? t.up.again : t.up.play; $('swPlay2').disabled = false;
  $('swNote').hidden = true;
  const pct = Math.round(v.k * 100), ph = m.phase[phaseName(v.k)];
  if (g === null) { lab.setReadout(t.month(Math.min(20, Math.floor(S.tv3 / 4.35) + 1)), md === 'earth' ? m.mds.earth : m.mds.sun, '', '#f0b86a'); lab.setState({ emo: '🤔', title: m.vask[0], lead: m.vask[1], body: '', extra: '' }); lab.setFacts(lipFacts); return; }
  lab.setReadout(`${pct}%`, md === 'earth' ? m.mds.earth : m.mds.sun, ph, '#f0b86a');
  const ok = g === 1;
  lab.setState({ emo: '🌗', title: `${ph[0].toUpperCase()}${ph.slice(1)}: ${m.lit(pct)}`, lead: md === 'sun' ? m.vSun : m.vEarth, body: '', extra: `<div class="sw-verdict"><b style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? m.vok : m.vno)}</b>${esc(m.vres[0])} ${esc(m.vres[1])}</div>` });
  lab.setFacts([...lipFacts, t.facts.phases]);
}
render();
</script>
