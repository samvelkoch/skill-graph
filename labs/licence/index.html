  pill(c, `${fmt(dev)}${st ? '+' : ''} ${t.people}`, st === 2 ? 110 : 180, 312, { maxW: 200, bg: 'rgba(8,10,20,.9)', stroke: 'rgba(255,255,255,.2)' });
  if (st === 2) pill(c, `${fmt(firm)}+ ${t.firms}`, 268, 312, { maxW: 160, bg: 'rgba(8,10,20,.9)', stroke: 'rgba(255,255,255,.2)' });
  pill(c, t.caps[st], 180, 22, { maxW: 200 });
}

// --- the loop ----------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt0) => {
  const dt = Math.min(dt0 || 0.016, 0.05); S.t += dt;
  const sc = Math.min(w / W, h / H); G = { sc, ox: (w - W * sc) / 2, oy: (h - H * sc) / 2 };
  c.save(); c.translate(G.ox, G.oy); c.scale(sc, sc); c.lineJoin = 'round'; c.lineCap = 'round';
  try {
    if (S.sec === 'a') drawSecA(c, dt); else if (S.sec === 'b') drawSecB(c, dt);
    else if (lab.view === 'doors') drawDoors(c, dt); else if (lab.view === 'free') drawFree(c, dt); else drawKind(c, dt);
  } catch (err) { console.error(err); }
  c.restore();
});

// --- input on the picture ----------------------------------------------------------------------------------
const cv = $('cv');
const pt = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - G.ox) / G.sc, (ev.clientY - r.top - G.oy) / G.sc]; };
const count = (z, but) => S.kd.filter((it) => it !== but && it.zone === z).length;
function placeItem(it, z) {
  if (!z) { it.zone = null; return; }
  if (z !== it.zone && count(z, it) >= 3) { sfx.bad(); S.msg = T[lang].k.full; return; }
  it.zone = z; it.seq = ++S.seq; S.msg = ''; sfx.snap();
}
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const [x, y] = pt(ev), v = lab.view;
  if (v === 'doors') {
    for (let i = 0; i < 5; i++) if (x >= 9 + i * 70 && x <= 71 + i * 70 && y >= 6 && y <= 96) { if (S.box !== i) { S.box = i; S.guess = [0, 0, 0, 0, 0, 0]; S.rev = false; S.day = 10; S.d = [0, 0, 0, 0, 0, 0]; S.dv = [0, 0, 0, 0, 0, 0]; sfx.snap(); render(); } return; }
    if (!S.rev) for (let j = 0; j < 6; j++) if (Math.abs(x - doorCx(j)) <= 54 && y >= doorTop(j) - 6 && y <= doorTop(j) + 100) { S.guess[j] = S.guess[j] ? 0 : 1; sfx.tick(); render(); return; }
    return;
  }
  if (v !== 'kind' || S.chk) return;
  for (let i = S.kd.length - 1; i >= 0; i--) {
    const it = S.kd[i];
    if (x >= it.x && x <= it.x + (it.w || CH.w) && y >= it.y && y <= it.y + CH.h) {
      S.drag = { it, dx: x - it.x, dy: y - it.y, sx: x, sy: y, moved: false, from: it.zone }; cv.setPointerCapture?.(ev.pointerId); return;
    }
  }
  if (S.sel) { const z = zoneUnder(x, y); if (z) { placeItem(S.sel, z); S.sel = null; render(); } }
});
cv.addEventListener('pointermove', (ev) => {
  const d = S.drag; if (!d) return;
  const [x, y] = pt(ev);
  if (!d.moved && Math.hypot(x - d.sx, y - d.sy) > 6) d.moved = true;
  if (d.moved) { d.it.x = x - d.dx; d.it.y = y - d.dy; S.zhov = zoneUnder(x, y); }
});
const endDrag = (ev) => {
  const d = S.drag; if (!d) return; S.drag = null; S.zhov = null;
  const [x, y] = pt(ev);
  if (d.moved) { const z = zoneUnder(x, y); if (z) placeItem(d.it, z); else { d.it.zone = null; sfx.tick(); } S.sel = null; }
  else if (S.sel && S.sel !== d.it) { const z = d.it.zone || zoneUnder(x, y); if (z && z !== 'tray' && d.it.zone) { placeItem(S.sel, d.it.zone); S.sel = null; } else S.sel = d.it; }
  else S.sel = S.sel === d.it ? null : d.it;
  sfx.tick(); render();
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', (ev) => { if (S.drag) { S.drag = null; S.zhov = null; render(); } });

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const secRow = (t) => {
  const open = secret.unlocked(), sc = (k, e) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="lc-row lc-sep">${sc('a', '©️')}${sc('b', '🐧')}</div>`;
};
function renderCtrl() {
  const t = T[lang], v = lab.view; let h = '';
  if (S.sec) {
    const sx = t[S.sec === 'a' ? 'sa' : 'sb'], last = S.step >= 2;
    h = `<div class="lc-row"><span class="lc-dots">${[0, 1, 2].map((i) => (i < S.step ? '●' : i === S.step ? '◉' : '○')).join(' ')}</span>
      <button class="btn push" data-act="${last ? 'srestart' : 'snext'}" style="margin-left:auto">${esc(last ? sx.restart : sx.next)}</button></div>
      <div class="lc-row"><button class="chip" data-act="back">← ${esc(sx.back)}</button></div>`;
  } else if (v === 'doors') {
    h = `<div class="lc-row">${t.chips.map((s, i) => `<button class="chip lc-ch ${i === S.box ? 'on' : ''}" data-act="box" data-i="${i}">${TAGE[i]} ${esc(s)}</button>`).join('')}</div>`;
    h += `<div class="lc-row">${!S.rev ? `<button class="btn" data-act="reveal">${esc(t.d.reveal)}</button>`
      : S.box === 1 ? `<div class="lc-day"><span class="lc-note">${esc(t.d.dayLab)}</span><input id="dayr" class="big" type="range" min="1" max="40" value="${S.day}" aria-label="${esc(t.d.dayLab)}"><b id="dayb">${esc(t.d.day(S.day))}</b></div>` : ''}</div>`;
  } else if (v === 'free') {
    const f = t.f;
    h = S.fi >= 6 ? `<div class="lc-row"><button class="btn" data-act="fagain">${esc(f.again)}</button></div>`
      : S.fch === null ? `<div class="lc-row">${f.opts.map((s, i) => `<button class="chip lc-ch" data-act="fpick" data-i="${i}">${esc(s)}</button>`).join('')}</div>`
        : `<div class="lc-row"><button class="btn" data-act="fnext">${esc(f.next)}</button></div>`;
    h += `<div class="lc-row"><span class="lc-dots">${[0, 1, 2, 3, 4, 5].map((i) => (i < S.fi || (i === S.fi && S.fch !== null) ? '●' : i === S.fi ? '◉' : '○')).join(' ')}</span></div>`;
  } else {
    const all = S.kd.every((it) => it.zone);
    h = `<div class="lc-row">${S.chk ? `<button class="btn" data-act="kagain">${esc(t.k.again)}</button>` : `<button class="btn" data-act="kcheck" ${all ? '' : 'disabled'}>${esc(t.k.check)}</button>`}<span class="lc-note" id="kmsg">${esc(S.msg)}</span></div>`;
  }
  $('ctrlBody').innerHTML = `<div class="lc-ctrl">${h}${secRow(t)}</div>`;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.step = 0; S.st0 = S.t; sfx.click(); }
  else if (a === 'back') { S.sec = null; sfx.click(); }
  else if (a === 'snext') { S.step++; S.st0 = S.t; sfx.click(); showStage(); }
  else if (a === 'srestart') { S.step = 0; S.st0 = S.t; sfx.click(); }
  else if (a === 'box') { if (S.box !== i) { S.box = i; S.guess = [0, 0, 0, 0, 0, 0]; S.rev = false; S.day = 10; S.d = [0, 0, 0, 0, 0, 0]; S.dv = [0, 0, 0, 0, 0, 0]; sfx.snap(); } }
  else if (a === 'reveal') { S.rev = true; S.day = 10; (score() === 6 ? sfx.good : sfx.click)(); showStage(); }
  else if (a === 'fpick') {
    S.fch = i; S.ft = 0; S.fres[S.fi] = i; S.fok[S.fi] = i === ANS[S.fi]; (S.fok[S.fi] ? sfx.good : sfx.bad)(); showStage();
  }
  else if (a === 'fnext') { S.fi++; S.fch = null; sfx.click(); }
  else if (a === 'fagain') { S.fi = 0; S.fch = null; S.fres = []; S.fok = []; sfx.click(); }
  else if (a === 'kcheck') { S.chk = true; S.sel = null; S.msg = ''; (S.kd.every((it) => it.zone === KZ[it.k]) ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'kagain') { S.kd.forEach((it) => { it.zone = null; }); S.chk = false; S.sel = null; S.msg = ''; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'dayr') return;
  S.day = +ev.target.value; $('dayb').textContent = T[lang].d.day(S.day); renderState();
});

// --- state card, readout, facts ----------------------------------------------------------------------------
function renderState() {
  const t = T[lang], v = lab.view;
  lab.setFacts(v === 'doors' ? [{ emo: '📜', text: t.facts.doors, src: FSRC.doors }]
    : v === 'free' ? [{ emo: '🐧', text: t.facts.free1, src: FSRC.free1 }, { emo: '🍺', text: t.facts.free2, src: FSRC.free2 }]
      : [{ emo: '📱', text: t.facts.kind, src: FSRC.kind }]);
  if (S.sec) {
    const sx = t[S.sec === 'a' ? 'sa' : 'sb'], [ti, le] = sx.steps[S.step];
    lab.setGlow(S.sec === 'a' ? 'rgba(224, 176, 80, .24)' : 'rgba(95, 200, 190, .26)');
    if (S.sec === 'a') lab.setReadout('©', '', '', '#e0b050'); else lab.setReadout(S.step === 0 ? '1' : '15 000+'.replace(/ /, lang === 'en' ? ',' : ' '), t.sb.people, '', '#5fc8be');
    lab.setState({ emo: S.sec === 'a' ? '©️' : '🐧', title: ti, lead: le, body: '', extra: '' });
    return;
  }
  if (v === 'doors') {
    const b = S.box; lab.setGlow('rgba(95, 143, 208, .26)');
    if (!S.rev) { lab.setReadout(t.d.pend, t.d.open, '', BOXC[b]); lab.setState({ emo: TAGE[b], title: t.d.askT, lead: t.d.askL, body: `${t.progs[b]} · ${t.tags[b]}`, extra: '' }); return; }
    const k = score(); let n = 0; for (let j = 0; j < 6; j++) if (doorTruth(b, j)) n++;
    lab.setReadout(`${n} / 6`, t.d.open, k === 6 ? t.d.right : `${k} / 6`, k === 6 ? '#2fb67c' : BOXC[b]);
    lab.setState({ emo: TAGE[b], title: t.tags[b], lead: t.d.res[b], body: `${t.d.score(k)}${b === 1 ? ` ${S.day <= 30 ? t.d.dayOn : t.d.dayOff}` : ''}`, extra: '' });
  } else if (v === 'free') {
    const f = t.f, ok = S.fok.filter(Boolean).length; lab.setGlow('rgba(95, 143, 208, .26)');
    if (S.fi >= 6) { lab.setReadout(`${ok} / 6`, f.sub, '', '#e0b050'); lab.setState({ emo: '🏆', title: f.end(ok), lead: f.endL, body: '', extra: '' }); return; }
    const card = f.cards[S.fi];
    if (S.fch === null) { lab.setReadout(`${ok} / ${S.fi}`.replace(/ \/ 0$/, ' / –'), f.sub, '', '#5f8fd0'); lab.setState({ emo: card.e, title: f.askT, lead: f.askL, body: '', extra: '' }); }
    else { const g = S.fok[S.fi]; lab.setReadout(`${ok} / ${S.fi + 1}`, f.sub, g ? f.right : f.wrong, g ? '#2fb67c' : '#e0624f'); lab.setState({ emo: g ? '✅' : '🤔', title: g ? f.right : f.wrong, lead: card.w, body: '', extra: '' }); }
  } else {
    const k = t.k, placed = S.kd.filter((it) => it.zone).length; lab.setGlow('rgba(143, 127, 208, .26)');
    if (!S.chk) { lab.setReadout(`${placed} / 8`, k.placed, '', '#8f7fd0'); lab.setState({ emo: '🧱', title: k.askT, lead: k.askL, body: '', extra: '' }); return; }
    const n = S.kd.filter((it) => it.zone === KZ[it.k]).length;
    lab.setReadout(`${n} / 8`, k.fit, n === 8 ? k.right : '', n === 8 ? '#2fb67c' : '#e0b050');
    lab.setState({ emo: n === 8 ? '✅' : '🤔', title: k.end(n), lead: k.endL, body: '', extra: '' });
  }
}
function render() {
  document.body.dataset.v = S.sec ? 'sec' : lab.view;
  renderCtrl(); renderState();
}
render();
</script>
</body>
</html>
