// --- geometry: two hoops, tray, Carroll table, three hoops ----------------------------------------------------------
// Everything in the hoop scene is computed for a frame that starts at y = 0; the question panel pushes the scene down by dy.
function sortGeo(w, h) {
  const tr = clamp(w / 17, 20, 27), cols = w >= 560 ? 8 : 4, rows = 8 / cols;
  const trayH = rows * (2 * tr + 12) + 16, trayY = h - 10 - trayH;
  const tagH = 58, outBand = 2 * tr + 22, areaH = trayY - 6, usable = areaH - 90; // 90 px kept free for the panel
  const R = Math.max(40, Math.min((w - 72) / 4, (usable - tagH - outBand) / 2, 125));

    dA: 2 * R + clamp(w - 72 - 4 * R, 16, 70), dO: R, key: `${Math.round(w)}x${Math.round(h)}` };
}
const hoopsAt = (g, ov) => { const d = lerp(g.dA, g.dO, ov); return [{ x: g.cx - d / 2, y: g.cy, r: g.R }, { x: g.cx + d / 2, y: g.cy, r: g.R }]; };

// where every sorting token wants to be this frame
function assignSort(g, dy, t) {
  const s = S.s, lists = { red: [], both: [], blue: [], out: [] }, tray = [];

    const cg = carGeo(g), cnt = [0, 0, 0, 0];

      const cx = cg.x0 + cg.hw + col * cg.cw + cg.cw / 2, cy = cg.y0 + cg.hh + row * cg.ch + cg.ch / 2;
      setTarget(TK[it.id], cx + (k ? 1 : -1) * (g.tr + 6), cy + dy + 6, 1, `car:${ci}:${k}`, t);

  for (const z in lists) {

    arr.forEach((i, k) => setTarget(TK[ITEMS[i].id], sl.pts[k][0], sl.pts[k][1] + dy, sl.sc, `${z}:${k}:${arr.length}`, t, k % 2 ? 1 : -1));

      const q = kf - impact; sq = q > 0 && q < 0.4 ? 0.16 * Math.exp(-8 * q) * Math.cos(26 * q) : 0;
    }
    token(c, p[0], p[1], G.tr * eoBack((kf + 0.25) / 0.3), rd.test, { sx: 1 + sq, sy: 1 - sq, ring, lift: kf > 0 && kf < 1.2 && rd.testIn ? Math.sin(Math.PI * kf / 1.2) * 0.6 : 0 });
  }
}

// --- main draw -------------------------------------------------------------------------------------------------------------------------------
const loop = canvasLoop($('cv'), (c, w, h, dt, t) => {
  const askH = askEl.style.display === 'none' ? 0 : askEl.offsetHeight, tgt = askH ? askH + 16 : 0;
  S.top += (tgt - S.top) * Math.min(1, dt * 10); if (Math.abs(tgt - S.top) < 0.3) S.top = tgt;
  rug(c, w, h);
  if (lab.view === 'sort') drawSort(c, w, h, dt, t); else if (lab.view === 'count') drawCount(c, w, h, dt, t); else drawRule(c, w, h, dt, t);
  drawFX(c, dt);
});

// --- input: tap a toy, then a place -----------------------------------------------------------------------------------------------------------
const stageXY = (ev) => { const r = $('cv').getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
$('cv').addEventListener('click', (ev) => {
  if (lab.view !== 'sort') return;
  const s = S.s, g = S.g; if (!g || s.ans === null || !s.go || s.mode) return;
  const [x, y] = stageXY(ev), t = clock();
  let hit = null, best = 1e9;
  for (const it of ITEMS) { const st = tkState(TK[it.id], t), d = Math.hypot(x - st.x, y - st.y); if (d <= Math.max(20, g.tr * st.s + 4) && d < best) { hit = it.id; best = d; } }
  if (hit) {
    const z = s.pos[hit] || 'tray';
    if (s.sel === hit) { s.sel = null; sfx.tick(); }
    else if (s.sel && z !== 'tray') dropItem(s.sel, z);
    else { s.sel = hit; sfx.click(); }
    return;
  }
  if (s.sel) { const z = zoneAt(g, x, y); if (z === 'tray' || s.ov >= 0.99) dropItem(s.sel, z); }
});
$('cv').addEventListener('pointermove', (ev) => {
  const s = S.s; if (lab.view !== 'sort' || !s.sel || !S.g) return;
  const [x, y] = stageXY(ev); s.hov = zoneAt(S.g, x, y);
});
$('cv').addEventListener('pointerleave', () => { S.s.hov = null; });

// --- actions -------------------------------------------------------------------------------------------------------------------------------------
const showStage = () => { // on a phone the stage can be out of view: bring the reveal into it
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function onView() { S.s.sel = null; S.s.hov = null; render(); }
function moveItem(id, zone) {
  const s = S.s;
  if (zone === 'tray') delete s.pos[id]; else s.pos[id] = zone;
  s.seq[id] = ++s.seqN; delete s.ok[id]; delete s.bad[id];
}
function dropItem(id, zone) {
  const s = S.s; s.sel = null; s.hintZone = '';
  if ((s.pos[id] || 'tray') !== zone) { moveItem(id, zone); sfx.snap(); }
  render();
}
const allOk = () => ITEMS.every((it) => S.s.ok[it.id]);
function checkSort() {
  const s = S.s, t = clock(); let firstBad = '';
  for (const it of ITEMS) {
    const z = s.pos[it.id]; if (!z || s.ok[it.id]) continue;
    if (z === ZONE_OF[maskOf(it)]) s.ok[it.id] = true;
    else { s.bad[it.id] = true; TK[it.id].shakeAt = t; firstBad ||= z; setTimeout(() => { if (S.s === s && s.bad[it.id]) { moveItem(it.id, 'tray'); render(); } }, 650); }
  }
  s.sel = null; s.hintZone = firstBad === 'blue' ? 'wheels' : firstBad;
  if (firstBad) sfx.bad(); else sfx.good();
  if (allOk()) { sfx.good(); if (S.g) spawnConfetti(S.g.w, S.g.h); }
  render();
}
function enterCarroll() {
  const s = S.s;
  if (s.ans === null) { s.ans = -1; s.ovT = 1; s.go = true; } // skipped the question: set the hoops up ourselves
  ITEMS.forEach((it) => { const z = ZONE_OF[maskOf(it)]; if (s.pos[it.id] !== z) { s.pos[it.id] = z; s.seq[it.id] = ++s.seqN; } s.ok[it.id] = true; delete s.bad[it.id]; });
  s.sel = null; s.mode = 'zones'; s.hintZone = '';
  const wait = s.ov < 0.95 ? 1900 : 900;
  setTimeout(() => { if (S.s === s && s.mode === 'zones') { s.mode = 'carroll'; render(); } }, wait);
}
function chipAct(k) {
  if (!secret.unlocked()) return secret.open();
  const s = S.s; s.sel = null; sfx.click();
  if (k === 'carroll') { if (s.mode === 'carroll' || s.mode === 'zones') s.mode = null; else enterCarroll(); }
  else if (s.mode === 'three') s.mode = null;
  else { s.mode = 'three'; s.three = { n: 0 }; TK3.forEach((tk) => { tk.key = undefined; tk.tw = null; }); if (s.ans === null) { s.ans = -1; s.ovT = 1; s.go = true; } }
  render();
}
function answer(a) {
  const v = lab.view, t = clock();
  if (v === 'sort') {
    const s = S.s; if (s.ans !== null) return;
    s.ans = a; s.ovT = 1; (a === 2 ? sfx.good : sfx.bad)(); sfx.push();
    setTimeout(() => { if (S.s === s) { moveItem('fire', 'both'); s.ok.fire = true; render(); } }, 1300);
  } else if (v === 'count') {
    const c = S.c, q = c.step; if (c.ans[q] !== null) return;
    c.ans[q] = a; c.at[q] = t; (a === 1 ? sfx.good : sfx.bad)();
  } else {
    const r = S.r; if (r.ans !== null) return;
    r.ans = a; r.at = t; (a === 0 ? sfx.good : sfx.bad)();
  }
  showStage(); render();
}
function act(name) {
  const v = lab.view;
  if (name === 'go') S.s.go = true;
  else if (name === 'check') return checkSort();
  else if (name === 'drop') { const th = S.s.three; if (th.n < THREE.length) { th.n++; sfx.snap(); } }
  else if (name === 'again') {
    if (v === 'sort') { S.s = newSort(); ITEMS.forEach((it) => { TK[it.id] = mkTk(); }); }
    else if (v === 'count') S.c = newCount(); else S.r = newRule();
  } else if (name === 'next') {
    if (v === 'count') { S.c.step = 1; S.c.tb = clock(); } else { S.r.round++; S.r.ans = null; S.r.pop = clock(); }
  }
  sfx.click(); render();
}
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.a !== undefined) answer(+b.dataset.a); else act(b.dataset.act);
});
$('ctrlBody').addEventListener('click', (ev) => { const b = ev.target.closest('[data-chip]'); if (b) chipAct(b.dataset.chip); });

// --- render: the question panel, readout, state card and secret chips -----------------------------------------------------------------------------
const verdict = (ok, t) => `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.wrong)}</div>`;
const askBtns = (labels, order) => `<div class="opts">${order.map((i) => `<button data-a="${i}">${esc(labels[i])}</button>`).join('')}</div>`;
const goBtn = (name, label) => `<div class="opts"><button class="go" data-act="${name}">${esc(label)}</button></div>`;
const fine = (t) => `<div class="fine">${esc(t.fine)}</div>`;
function setCard(t, v, full) { const [emo, title, lead, body] = t.st[v][full ? 1 : 0]; lab.setState({ emo, title, lead, body, extra: fine(t) }); }

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  askEl.style.display = '';
  if (v === 'sort') renderSort(t); else if (v === 'count') renderCount(t); else renderRule(t);
}
function renderSort(t) {
  const s = S.s, asked = s.ans !== null, placed = ITEMS.filter((it) => (s.pos[it.id] || 'tray') !== 'tray').length;
  lab.setGlow('rgba(224, 72, 72, .26)');
  lab.setReadout(`${placed} / 8`, '', asked && s.ans >= 0 ? (s.ans === 2 ? t.right : t.wrong) : '', '#E04848');
  setCard(t, 'sort', asked);
  const done = allOk();
  if (s.mode === 'three') askEl.innerHTML = `<p>${esc(t.sec.threeText)}</p>${s.three.n < THREE.length ? goBtn('drop', t.sec.drop) : ''}`;
  else if (s.mode) askEl.innerHTML = `<p style="margin:0">${esc(t.sec.carrollText)}</p>`;
  else if (!asked) askEl.innerHTML = `<div class="q">${esc(t.s.q1)}</div>${askBtns(t.s.o1, [0, 1, 2])}`;
  else if (!s.go) askEl.innerHTML = `${verdict(s.ans === 2, t)}<p>${esc(t.s.r1)}</p>${goBtn('go', t.next)}`;
  else {
    const canCheck = ITEMS.some((it) => s.pos[it.id] && !s.ok[it.id]);
    askEl.innerHTML = done
      ? `<div class="verdict" style="color:var(--ok)">${esc(t.s.done)}</div><div class="opts"><button data-act="again">${esc(t.again)}</button></div>`
      : `<p>${esc(s.hintZone ? t.s.hint[s.hintZone] : t.s.tap)}</p><div class="opts"><button class="go" data-act="check"${canCheck ? '' : ' disabled'}>${esc(t.s.check)}</button></div>`;
  }
  const open = secret.unlocked();
  const chip = (k, emo, on) => `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-chip="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('ctrlBody').innerHTML = `<div class="chips">${chip('carroll', '📋', s.mode === 'carroll' || s.mode === 'zones')}${chip('three', '🔺', s.mode === 'three')}</div>`;
  $('ctrlBody').style.display = '';
}
function renderCount(t) {
  const c = S.c, q = c.step, a = c.ans[q];
  lab.setGlow('rgba(76, 127, 224, .26)');
  lab.setReadout(a === null ? '?' : q === 0 ? '3 &lt; 5' : '4', q === 0 ? '● ○' : '○ ●', a === null ? '' : a === 1 ? t.right : t.wrong, '#4C7FE0');
  setCard(t, 'count', c.ans[0] !== null);
  const [qt, ot, rt] = q === 0 ? [t.c.q1, t.c.o1, t.c.r1] : [t.c.q2, t.c.o2, t.c.r2];
  if (a === null) askEl.innerHTML = `<div class="q">${esc(qt)}</div>${askBtns(ot, [0, 1, 2])}`;
  else askEl.innerHTML = `${verdict(a === 1, t)}<p>${esc(rt)}</p>${goBtn(q === 0 ? 'next' : 'again', q === 0 ? t.next : t.again)}`;
  $('ctrlBody').innerHTML = ''; $('ctrlBody').style.display = 'none';
}
function renderRule(t) {
  const r = S.r, a = r.ans, rd = r.round, last = rd === ROUNDS.length - 1;
  lab.setGlow('rgba(160, 110, 230, .26)');
  lab.setReadout(`${rd + 1} / 3`, [0, 1, 2].map((i) => (i < rd ? '●' : i === rd ? '◉' : '○')).join(' '), a === null ? '' : a === 0 ? t.right : t.wrong, '#A06EE6');
  setCard(t, 'rule', rd > 0 || a !== null);
  if (a === null) askEl.innerHTML = `<div class="q">${esc(t.r.q)}</div>${askBtns(t.r.opts[rd], r.order[rd])}`;
  else askEl.innerHTML = `${verdict(a === 0, t)}<p>${esc(t.r.why[rd])}</p>${goBtn(last ? 'again' : 'next', last ? t.again : t.next)}`;
  $('ctrlBody').innerHTML = ''; $('ctrlBody').style.display = 'none';
}
render();
</script>
</body>
</html>
