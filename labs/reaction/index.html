// --- small helpers -----------------------------------------------------------------------------------------
const now = () => performance.now() / 1000;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };
const backOut = (t) => { t = clamp01(t); const k = 1.9; return 1 + (k + 1) * (t - 1) ** 3 + k * (t - 1) ** 2; };
const num = (x, d = 2) => (lang === 'en' ? x.toFixed(d) : x.toFixed(d).replace('.', ','));
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const rot = (d, a) => [d[0] * Math.cos(a) - d[1] * Math.sin(a), d[0] * Math.sin(a) + d[1] * Math.cos(a)];
const COL = { nerve: '#FFE08A', sense: '#5FE3FF', cmd: '#FFB347', reflex: '#7CF0A0', brain: '#FF9EC4' };
let CW = 0; // current canvas width, for clamping pills

// a dark rounded label that stays inside the canvas; returns its box
function pill(c, text, x, y, o = {}) {
  const { font = '800 13px Nunito, sans-serif', fg = '#fff', bg = 'rgba(10,12,28,.82)', align = 'center', padX = 10, hgt = 24, border = null } = o;
  c.save(); c.font = font; c.textBaseline = 'middle'; c.globalAlpha = 1;
  const wd = c.measureText(text).width + padX * 2;
  let x0 = align === 'left' ? x : align === 'right' ? x - wd : x - wd / 2;
  x0 = Math.max(4, Math.min(CW - 4 - wd, x0));
  c.fillStyle = bg; c.beginPath(); c.roundRect(x0, y - hgt / 2, wd, hgt, hgt / 2); c.fill();
  if (border) { c.strokeStyle = border; c.lineWidth = 1.2; c.stroke(); }
  c.fillStyle = fg; c.textAlign = 'left'; c.fillText(text, x0 + padX, y + 0.5);
  c.restore();
  return { x: x0, w: wd };
}
function panel(c, w, h) {
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#1a1f4a'); g.addColorStop(1, '#12163a');
  c.fillStyle = g; c.beginPath(); c.roundRect(0.5, 0.5, w - 1, h - 1, 22); c.fill();
  c.strokeStyle = 'rgba(130, 145, 190, .28)'; c.lineWidth = 1; c.stroke();
}

// --- nerve paths: smoothed polylines that pulses can travel along --------------------------------------------
function mkPath(raw) {
  let p = raw;
  for (let k = 0; k < 3; k++) { // Chaikin corner cutting
    const q = [p[0]];
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i], b = p[i + 1];
      q.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
    }
    q.push(p[p.length - 1]); p = q;
  }
  const cum = [0];
  for (let i = 1; i < p.length; i++) cum.push(cum[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
  return { p, cum, len: cum[cum.length - 1] };
}
function at(path, d) {
  const { p, cum } = path; d = Math.min(path.len, Math.max(0, d));
  let i = 1; while (i < cum.length - 1 && cum[i] < d) i++;
  const f = (d - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1);
  return [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * f, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * f];
}
function strokeRaw(c, raw) {
  const { p } = mkPath(raw);
  c.beginPath(); p.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.stroke();
}
// a glowing comet: head at distance d along the path, tail fading behind it
function drawPulse(c, path, d, color, size) {
  const N = 14, step = 3.2 * size;
  c.save();
  for (let k = N; k >= 0; k--) {
    const dd = d - k * step; if (dd < 0 || dd > path.len) continue;
    const f = 1 - k / N, [x, y] = at(path, dd);
    c.globalAlpha = f * f; c.fillStyle = color; c.shadowColor = color; c.shadowBlur = 10 * f;
    c.beginPath(); c.arc(x, y, Math.max(0, (1 + 3.3 * f) * size), 0, 7); c.fill();
  }
  if (d <= path.len) {
    const [x, y] = at(path, d);
    c.globalAlpha = 1; c.shadowBlur = 14; c.fillStyle = '#fff';
    c.beginPath(); c.arc(x, y, Math.max(0, 2.3 * size), 0, 7); c.fill();
  }
  c.restore();
}

// two-bone arm: the elbow bends away from the body
function arm(S, H, pref) {
  const dx = H[0] - S[0], dy = H[1] - S[1], d = Math.hypot(dx, dy) || 1, dm = Math.min(d, 91.5);

  return { e, hand, dir: [ex / el, ey / el] };
}

  line([SR, L.r.e, L.r.hand], 22); line([SL, L.l.e, L.l.hand], 22);

// --- scenes: a scene says what pulses, flashes and poses happen at time t (seconds since the reveal) --------------
const fv = (f, t) => { const u = (t - f.t0) / f.d; if (u < 0 || u > 1) return 0; return u < 0.2 ? u / 0.2 : 1 - (u - 0.2) / 0.8; };
const flashOf = (A, t, k) => A.flashes.reduce((m, f) => (f.k === k ? Math.max(m, fv(f, t)) : m), 0);
let XF = { sc: 1, tx: 0, ty: 0, right: DW }; // the current figure transform; `right` is the stage's right edge in design units

function drawFigure(c, A, t, o = {}) {
  const P = A.pose(t), L = limbsOf(P);
  c.save(); c.fillStyle = 'rgba(0,0,0,.35)';
  for (const x of [L.foot[0], FOOT_R[0]]) { c.beginPath(); c.ellipse(x, 342, 24, 5, 0, 0, 7); c.fill(); }
  c.restore();
  A.under?.(c, t, L);
  const key = `${(P.rh[0] * 2) | 0},${(P.rh[1] * 2) | 0},${((P.foot || 0) * 30) | 0}`;
  c.globalAlpha = 0.7; c.drawImage(silhouette(L, key), 0, 0, DW, DH); c.globalAlpha = 1;
  drawNerves(c, L, o.fine); drawCord(c);
  drawBrain(c, flashOf(A, t, 'brain'));
  drawFace(c, P, flashOf(A, t, 'eyes'));
  A.mid?.(c, t, L);
  const lh = [L.l.hand[0] + L.l.dir[0] * 24, L.l.hand[1] + L.l.dir[1] * 24];
  drawHand(c, L.l.hand, L.l.dir, 0.45, lh);
  drawHand(c, L.r.hand, L.r.dir, P.rc || 0, A.ballC || [L.r.hand[0] + L.r.dir[0] * 24, L.r.hand[1] + L.r.dir[1] * 24]);
  for (const f of A.flashes) {
    const v = fv(f, t); if (!v) continue;
    c.save();
    if (f.k === 'muscle') {
      const q = f.pos ? f.pos(L) : f;
      c.translate(q.x, q.y); c.rotate(q.ang || 0); c.scale(1 + 0.25 * v, (q.ry / q.rx) * (1 + 0.25 * v));
      const g = c.createRadialGradient(0, 0, 2, 0, 0, q.rx * 1.5); g.addColorStop(0, `rgba(255,179,71,${0.95 * v})`); g.addColorStop(1, 'rgba(255,179,71,0)');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, q.rx * 1.5, 0, 7); c.fill();
    } else if (f.k === 'spot') {
      const r = f.r * (0.7 + 0.5 * v), g = c.createRadialGradient(f.x, f.y, 1, f.x, f.y, r);
      g.addColorStop(0, f.col.replace('1)', `${0.9 * v})`)); g.addColorStop(1, f.col.replace('1)', '0)'));
      c.fillStyle = g; c.beginPath(); c.arc(f.x, f.y, r, 0, 7); c.fill();
    } else if (f.k === 'ring') {
      const u = (t - f.t0) / f.d; c.strokeStyle = f.col; c.globalAlpha = v; c.lineWidth = 2.5;
      c.beginPath(); c.arc(f.x, f.y, Math.max(0, f.r * (0.5 + u)), 0, 7); c.stroke();
    }
    c.restore();
  }
  for (const p of A.pulses) {
    const d = (t - p.t0) * p.speed; if (d < 0) continue;
    const path = mkPath(p.raw(t)); if (d > path.len + 50) continue;
    drawPulse(c, path, d, p.color, (p.size || 1.25) * (o.k || 1));
  }
  A.extra?.(c, t);
}

const spot = (x, y, r, t0, d, col) => ({ k: 'spot', x, y, r, t0, d, col });
const tipOf = (L) => [L.r.hand[0] + L.r.dir[0] * 14, L.r.hand[1] + L.r.dir[1] * 14];

// Q1: a ball flies in; eyes -> brain -> arm -> hand
function buildQ1() {
  const TS = 0.9, L0 = limbsOf({ rh: CATCH }), dir = L0.r.dir;
  const F = [L0.r.hand[0] + dir[0] * 28, L0.r.hand[1] + dir[1] * 28];
  const eyeSp = 95, tA = TS + mkPath(EYE_L).len / eyeSp;
  const cmdRaw = () => { const L = limbsOf({ rh: CATCH }); return [[XC, 54], [XC, 120], SR, L.r.e, L.r.hand]; };
  const cmdSp = 125, tC = tA + 0.1, tClose = tC + mkPath(cmdRaw()).len / cmdSp, TB = tClose + 0.1;
  const timer = (t) => (t < TS ? null : 0.2 * clamp01((t - TS) / (tClose - TS)));
  return {
    dur: TB + 1.3, ballC: F, timer,
    pulses: [EYE_L, EYE_R].map((r) => ({ raw: () => r, t0: TS, speed: eyeSp, color: COL.sense })).concat([{ raw: cmdRaw, t0: tC, speed: cmdSp, color: COL.cmd, size: 1.4 }]),
    flashes: [{ k: 'eyes', t0: TS - 0.1, d: 0.6 }, { k: 'brain', t0: tA, d: 0.7 }],
    pose: (t) => ({ rh: CATCH, rc: ease((t - tClose) / 0.3), foot: 0, look: [1, -0.12], mood: t > tClose + 0.25 ? 'glad' : 'ok' }),
    mid(c, t) {
      if (t < 0) return; // the ball only appears once the answer is revealed
      const S0 = [XF.right - 22, F[1]], u = clamp01(t / TB), x = S0[0] + (F[0] - S0[0]) * u;
      if (t > 0 && t < TB) {
        c.save(); c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.6; c.lineCap = 'round';
        for (let k = 0; k < 3; k++) { const y = F[1] - 7 + k * 7; c.beginPath(); c.moveTo(x + 18 + k * 3, y); c.lineTo(x + 34 + k * 5, y); c.stroke(); }
        c.restore();
      }
      c.save(); c.globalAlpha = 1; c.translate(x, F[1]); c.rotate(u * 16);
      const sq = t > TB ? 1 + 0.12 * Math.exp(-(t - TB) * 9) * Math.cos((t - TB) * 28) : 1;
      c.scale(sq, 2 - sq); c.font = '26px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText('⚽', 0, 1);
      c.restore();
    },
  };
}

// Q2: a hot pan; fingertip -> spinal cord -> straight back (reflex), a slower message goes on to the brain
function buildQ2() {

// --- the ruler -----------------------------------------------------------------------------------------------------

function drawChart(c, w, h, chartW, avg) {
  const t = T[lang], u = t.u, x = w - chartW - 8, y = 64, bw = chartW, bh = h - 64 - 72, n = R.tries.length;
  c.save();
  c.fillStyle = 'rgba(10,12,30,.55)'; c.strokeStyle = 'rgba(130,145,190,.28)'; c.lineWidth = 1; c.beginPath(); c.roundRect(x, y, bw, bh, 14); c.fill(); c.stroke();

  $('rQ').innerHTML = `<div class="qtext">${esc(r.q)}</div>${picks(r.o, 'rp', R.answer, 1, R.demoDone)}`
    + (R.demoDone ? `${verdictHtml(t, R.answer, 1)}<p class="note">${esc(r.r)}</p>` : '');
  $('rPlay').style.display = R.demoDone ? '' : 'none';
  const live = R.phase === 'armed' || R.phase === 'fall';
  $('rMain').textContent = live ? r.catch : r.ready;
  $('rMain').classList.toggle('hot', live);
  $('rMsg').textContent = R.phase === 'early' ? r.early : R.phase === 'missed' ? r.miss : '';
  lab.setReadout(n ? `${num(tries[n - 1])} ${t.u.s}` : R.answer === null ? '?' : '–', n >= 2 ? `${r.avg} ${num(avg)} ${t.u.s}` : '', R.demoDone && n < 5 ? r.tryN(n + 1) : '', '#D9B57A');
  setCard(t, 'ruler', R.demoDone, fineHtml(t));
}

function renderSenses(t) {
  lab.setGlow('rgba(95, 227, 255, .2)');
  const s = t.s, i = Y.i, ok = SENSE_OK[i];
  $('sDots').innerHTML = [0, 1, 2, 3, 4].map((k) => `<i class="${k < i || (k === i && Y.done) ? 'dn' : k === i ? 'cur' : ''}"></i>`).join('');
  sitEl.innerHTML = `<div class="e">${['🔥', '🗣️', '🚦', '🪨', '🥛'][i]}</div><div class="tx">${esc(s.cards[i])}</div>`;
  const nav = Y.done ? `<button class="btn" data-act="snext">${esc(i === 4 ? t.again : t.next)}</button>` : '';
  $('sQ').innerHTML = `<div class="qtext">${esc(s.q)}</div>${picks(s.senses, 'sp', Y.picked, ok, Y.done, 'row')}`
    + (Y.done ? `${verdictHtml(t, Y.picked, ok)}<p class="note">${esc(s.resp[i])}</p>` : '') + `<div class="navrow">${nav}</div>`;
  lab.setReadout(`${i + 1} / 5`, '', '', '#5FE3FF');
  setCard(t, 'senses', Y.full, fineHtml(t));
}
render();
</script>
