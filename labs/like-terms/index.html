  if (asking) {
    const ord = ordFor('ck', 2);
    askEl.innerHTML = `<div class="lt-q">${esc(t.qAlways)}</div><div class="lt-opts">${ord.map((j) => `<button data-j="${j}">${esc(j === 0 ? t.no : t.yes)}</button>`).join('')}</div>`;
  }
  const open = !asking;
  show($('ltProbRow'), open && !k.area, 'flex'); show($('ltCandRow'), open && !k.area, 'flex');
  show($('ltXRow'), open, 'flex'); show($('ltYRow'), open && pr.y && !k.area, 'flex'); show($('ltTryRow'), open && !k.area, 'flex');
  $('ltPick').textContent = t.pickCandidate;
  $('ltProbSeg').innerHTML = PROBS.map((p, i) => `<button class="lt-pr ${i === k.p ? 'on' : ''}" data-p="${i}">${mspan(p.orig)}</button>`).join('');
  const ord = ordFor(`cands${k.p}`, pr.cands.length);
  $('ltCands').innerHTML = ord.map((i) => `<button class="chip lt-c ${i === k.c ? 'on' : ''}" data-c="${i}">${mspan(pr.cands[i].s)}</button>`).join('');
  const xs = $('ltX'), ys = $('ltY');
  xs.min = k.area ? 0 : -5; if (k.area && k.x < 0) k.x = 0;
  if (+xs.value !== k.x) xs.value = k.x;
  if (+ys.value !== k.y) ys.value = k.y;
  xs.disabled = ys.disabled = !!k.sw;
  $('ltXv').textContent = num(k.x); $('ltYv').textContent = num(k.y);
  $('ltTry').textContent = t.tryAll; $('ltTry').disabled = !!k.sw;
  if (!asking && !k.area) { const e = (k.seen[`${k.p}-${k.c}`] ??= { m: false, f: false }); if (eqAt(k.x, k.y)) e.m = true; else e.f = true; }
  const seen = k.seen[`${k.p}-${k.c}`], luck = !asking && !k.area && !cand.always && seen && seen.m && seen.f;
  if (k.area && !asking) {
    const N = (k.x + 1) * (k.x + 2);
    lab.setReadout(String(N), t.areaSub, t.equalLamp, '#5ea8ff');
    lab.setState({ emo: '📐', title: t.secrets.b[0], lead: t.secrets.b[1], body: '', extra: '' });
    return;
  }
  const verdict = k.verdict && k.ans !== null ? (k.ans === 0 ? t.right : k.sw ? t.seeDots : '') : '';
  lab.setReadout(asking ? '?' : `${eqCount(k.y)} / 11`, t.checked, verdict, '#5ea8ff');
  lab.setState(asking ? { emo: '🤔', title: t.qAlways, lead: '', body: '', extra: '' }
    : { emo: st.emo, title: st.title, lead: luck ? t.luck : st.lead, body: st.body, extra: '' });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  G.w = w; G.h = h;
  const v = lab.view;
  if (v === 'check') drawCheck(c, w, h, dt, time); else drawSort(c, w, h, dt, time, v);
});
render();
</script>
</body>
</html>
