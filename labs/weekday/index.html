    const guessOk = S.ys === 'mine' ? S.mg === dd.w1 : S.yg === 1, line = t.y.line(dd.span, dd.shift, w0, w1);
    if (S.ys === 'wheel' && S.yleap) lab.setState({ emo: '🗓️', title: t.y.leapT, lead: line, body: '', extra: '' });
    else if (S.ys === 'mine' && dd.shift === 2) lab.setState({ emo: guessOk ? '✅' : '🤔', title: guessOk ? `${t.right} ${w1}.` : t.y.wrong(w1), lead: line, body: t.y.leapT, extra: '' });
    else lab.setState({ emo: guessOk ? '✅' : '🤔', title: guessOk ? `${t.right} ${w1}.` : t.y.wrong(w1), lead: line, body: '', extra: '' });
  }
  lab.setFacts((rev ? [t.f.year, t.f.jew] : [t.f.jew]).map(([emo, text, src]) => ({ emo, text, src })));
}

function renderSecret(t) {
  if (S.sec === 'reuse') {
    const y2 = MATCH[S.ri % Math.max(1, MATCH.length)] ?? Y, gap = Math.abs(Y - y2);
    lab.setGlow('rgba(242, 193, 78, .22)');
    $('cc').innerHTML = `<div class="row2" style="margin-top:0"><button class="chip" data-act="rnext">${esc(t.re.next)}</button></div>`;
    lab.setReadout(`${Y} = ${y2}`, t.yearsApart(gap), '', '#f2c14e');
    lab.setState({ emo: '🗓️', title: t.re.title(Y, y2), lead: t.re.lead(gap), body: '', extra: '' });
    lab.setFacts([]);
  } else {
    const q = LUNATION / 4, n = t.wy.names[S.moon];
    lab.setGlow('rgba(120, 140, 220, .26)');
    $('cc').innerHTML = `<div class="row2" style="margin-top:0">${['🌑', '🌓', '🌕', '🌗'].map((e, i) => `<button class="chip ${S.moon === i ? 'on' : ''}" data-act="moon" data-i="${i}" aria-label="${esc(t.wy.names[i])}">${e} ${esc(t.wy.names[i])}</button>`).join('')}</div>`;
    lab.setReadout(`≈ ${dec(q)}`, t.wy.week, '', '#8ea2ee');
    lab.setState({ emo: ['🌑', '🌓', '🌕', '🌗'][S.moon], title: t.wy.title(n, dec(S.moon * q)), lead: t.wy.lead(dec(q)), body: t.wy.body(dec(LUNATION)), extra: '' });
    lab.setFacts([t.f.moonq, t.f.lunar].map(([emo, text, src]) => ({ emo, text, src })));
  }
}

canvasLoop($('cv'), (c, w, h, dt) => {
  if (S.sec) drawSecret(c, w, h, dt);
  else if (lab.view === 'week') drawWeek(c, w, h, dt);
  else if (lab.view === 'count') drawCount(c, w, h, dt);
  else drawYear(c, w, h, dt);
});
render();
</script>
</body>
</html>
