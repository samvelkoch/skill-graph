function roundPoly(c, pts, r) {
  const n = pts.length; c.beginPath();
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i + n - 1) % n], p1 = pts[i], p2 = pts[(i + 1) % n];

  c.closePath();
}

// ---- secret B: lock and key -------------------------------------------------------------------------------------
function drawLock(c, dt, time) {
  const t = T[lang], p = time % 10, ES = 1.7, EY = 222, top = EY - EB.b * ES;
  const a = seg(p, 1, 2.2, ease.back) - seg(p, 4.5, 5.5);                        // the right key goes in and out
  const kx = lerp(92, 180, a), ky = lerp(72, top + DOCK_DY.amylase * ES, a) + (a < 0.05 ? Math.sin(time * 2.4) * 3 : 0);
  const b = seg(p, 5.5, 6.6, ease.out) - seg(p, 6.9, 7.8);                       // the wrong key tries and bounces
  const wx = lerp(270, 180, b), wy = lerp(72, top - 9 * ES - 1, b) + (b < 0.05 ? Math.sin(time * 2.4 + 1) * 3 : 0);
  const clicked = p > 2.2 && p < 4.5, snap = seg(p, 2.1, 2.5, ease.out) * (1 - seg(p, 3.2, 3.8));
  drawEnzyme(c, 'amylase', 180, EY, { s: ES, sq: snap * 0.8, glow: clicked ? 0.8 : 0, ph: time });
  drawBead(c, 'starch', kx, ky, ES);
  drawBead(c, 'fat', wx, wy + (b > 0.9 ? Math.sin(time * 40) * 1.5 : 0), ES);
  if (clicked) {
    const k = c01((p - 2.2) / 0.6); c.save(); c.globalAlpha = 1 - k; c.strokeStyle = '#3ddc97'; c.lineWidth = 3; c.beginPath(); c.arc(180, top + 6, 20 + 26 * ease.out(k), 0, TAU); c.stroke(); c.restore();
    pill(c, '✓', 180, 136, { color: '#3ddc97', stroke: '#3ddc97', fs: 16 });
  }
  if (p > 6.4 && p < 7.9) {
    const k = c01((p - 6.4) / 0.5); c.save(); c.globalAlpha = Math.min(1, 2 - 2 * c01((p - 7.4) / 0.5)) * Math.min(1, k * 3); c.strokeStyle = '#ff6b5e'; c.lineWidth = 3.5; c.beginPath();
    c.moveTo(212, 146); c.lineTo(236, 170); c.moveTo(236, 146); c.lineTo(212, 170); c.stroke(); c.restore();
  }
  pill(c, '🔑 1894', 350, 20, { align: 'r' });
}

// --- the canvas loop ---------------------------------------------------------------------------------------
function tickAnim(dt) {
  const a = S.anim; if (!a) return;
  a.t += dt; const k = c01(a.t / a.dur); S[a.key] = lerp(a.from, a.to, ease.inOut(k));
  $('enT').value = Math.round(S.T); $('enC').value = Math.round(S.chews); updateReadout();
  if (k >= 1) { S.anim = null; render(); }
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  G.s = Math.min(w / W, h / H); G.ox = (w - W * G.s) / 2; G.oy = (h - H * G.s) / 2;
  tickAnim(dt);
  const bg = c.createRadialGradient(w * 0.3, h * 0.15, 10, w * 0.5, h * 0.5, Math.max(w, h) * 0.8); bg.addColorStop(0, '#26304a'); bg.addColorStop(1, '#10141f');
  c.fillStyle = bg; c.beginPath(); c.roundRect(0, 0, w, h, 18); c.fill();
  c.save(); c.translate(G.ox, G.oy); c.scale(G.s, G.s); c.lineJoin = 'round'; c.lineCap = 'round';
  if (S.sec === 'wash') drawWash(c, dt, time);
  else if (S.sec === 'lock') drawLock(c, dt, time);
  else if (lab.view === 'fit') drawFit(c, dt, time);
  else if (lab.view === 'temp') drawTemp(c, dt, time);
  else drawMouth(c, dt, time);
  c.restore();
});

// --- dragging the enzymes ----------------------------------------------------------------------------------
const toDesign = (ev) => { const r = $('cv').getBoundingClientRect(); return { x: (ev.clientX - r.left - G.ox) / G.s, y: (ev.clientY - r.top - G.oy) / G.s }; };
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'fit' || !answered('fit')) return;
  const p = toDesign(ev); let best = null, bd = 1e9;
  for (const e of EZ) { const dx = p.x - e.x, dy = p.y - e.y, dd = dx * dx + dy * dy; if (Math.abs(dx) < 42 && Math.abs(dy) < 38 && dd < bd) { best = e; bd = dd; } }
  if (!best) return;
  try { $('cv').setPointerCapture(ev.pointerId); } catch { /* fine without capture */ }
  const touch = ev.pointerType === 'touch', oy = touch ? -36 : best.y - p.y;
  S.drag = { e: best, id: ev.pointerId, ox: touch ? 0 : best.x - p.x, oy, x: best.x, y: best.y };
  best.mode = 'drag'; best.tw = null; best.w = null; best.sq = 0; sfx.tick();
});
$('cv').addEventListener('pointermove', (ev) => {
  if (!S.drag || ev.pointerId !== S.drag.id) return;
  const p = toDesign(ev); S.drag.x = clamp(p.x + S.drag.ox, 20, W - 20); S.drag.y = clamp(p.y + S.drag.oy, 30, H - 20);
});
const endDrag = (ev) => {
  if (!S.drag || ev.pointerId !== S.drag.id) return;
  const e = S.drag.e; S.drag = null;
  const near = e.y < CY + 92 && Math.abs(e.x - CX) < 3 * SP + 70;
  if (near && S.chain && S.chain.alive.length) fitDrop(e); else goHome(e);
};
$('cv').addEventListener('pointerup', endDrag);
$('cv').addEventListener('pointercancel', endDrag);

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function setFood(f) {
  S.food = f; S.count = 0; S.pair = null; S.products = []; S.slot = 0; S.flashes = []; S.nf = null; S.chain = newChain(); S.drag = null;
  for (const e of EZ) { e.mode = 'home'; e.tw = null; e.w = null; e.x = e.hx; e.y = e.hy; e.rot = 0; e.sq = 0; }
  sfx.click();
}
function answer(v, i) {
  if (answered(v)) return;
  S.pred[v] = i; S.at[v] = now();
  (i === RIGHT[v] ? sfx.good : sfx.bad)();
  if (v === 'temp') S.anim = { key: 'T', from: S.T, to: 37, t: 0, dur: 1.4 };
  if (v === 'mouth') S.anim = { key: 'chews', from: S.chews, to: 10, t: 0, dur: 1.6 };
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-p], [data-food], [data-sec]'); if (!b) return;
  if (b.dataset.p !== undefined) answer(lab.view, +b.dataset.p);
  else if (b.dataset.food) { if (b.dataset.food !== S.food) { setFood(b.dataset.food); render(); } }
  else {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; sfx.click(); render();
  }
});
$('enT').addEventListener('input', () => { S.T = +$('enT').value; updateReadout(); });
$('enC').addEventListener('input', () => { S.chews = +$('enC').value; sfx.tick(); updateReadout(); });

// --- one render per change: controls, readout, state card and facts ---------------------------------------
function renderPred(v) {
  const t = T[lang], pk = S.pred[v], ok = RIGHT[v];
  const opts = t[v + 'Opts'];
  $('pred-' + v).innerHTML = `<div class="en-q">${esc(t[v + 'Ask'])}</div>
    <div class="en-opts">${opts.map((o, i) => `<button class="en-opt${pk === null ? '' : i === ok ? ' ok' : i === pk ? ' bad' : ' dim'}" data-p="${i}"${pk === null ? '' : ' disabled'}>${esc(o)}</button>`).join('')}</div>
    ${pk === null ? '' : `<div class="en-verdict ${pk === ok ? 'ok' : 'bad'}">${esc(pk === ok ? t[v + 'Right'] : t[v + 'Wrong'])}</div>`}`;
}
function updateReadout() {
  const t = T[lang], v = lab.view;
  if (S.sec) { lab.setReadout(S.sec === 'wash' ? '🧺' : '🔑', t.secrets[S.sec === 'wash' ? 'a' : 'b'][0], '', '#7b5ea7'); return; }
  if (!answered(v)) { lab.setReadout('?', '', '', '#2a9d8f'); return; }
  if (v === 'fit') lab.setReadout(esc(t.piecesN(t.pieces[S.food], S.count)), '', S.pair ? t.pair(t.enz[S.pair], t.foods[S.food]) : '', ENZ[S.pair ?? 'amylase'].col);
  else if (v === 'temp') {
    const T0 = Math.round(S.T), r = rateOf(T0), st = r >= 6 ? 'fast' : T0 > 37 && r < 0.3 ? 'stopped' : 'slow';
    lab.setReadout(esc(t.tempVal(T0)), t.temperature, t[st], st === 'fast' ? '#2f9e6e' : st === 'slow' ? '#b9831a' : '#d1495b');
  } else {
    const n = crumbsOf(S.chews), x = Number(surfOf(n).toFixed(1));
    lab.setReadout(esc(t.crumbs(n)), '', t.surface(x), '#c8902a');
  }
}
function render() {
  const t = T[lang], v = lab.view, ans = answered(v);
  document.body.dataset.v = v; document.body.dataset.drag = v === 'fit' && ans && !S.sec ? '1' : '';
  for (const k of VIEWS) $('en-' + k).style.display = k === v ? 'block' : 'none';
  renderPred(v);
  $('enFoods').style.display = ans ? 'flex' : 'none';
  $('enFoods').innerHTML = FOODS.map((f) => `<button class="en-food${f === S.food ? ' on' : ''}" data-food="${f}"><i style="background:${FOOD[f].bead}"></i>${esc(t.foods[f])}</button>`).join('');
  $('enTL').textContent = t.temperature; $('enCL').textContent = t.chews;
  $('enT').disabled = !ans || !!S.anim; $('enC').disabled = !ans || !!S.anim;
  $('enT').value = Math.round(S.T); $('enC').value = Math.round(S.chews);
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k === 'wash' ? 'a' : 'b'][0])}` : '🔒 ???'}</button>`;
  $('enSecs').style.display = ans ? 'flex' : 'none';
  $('enSecs').innerHTML = sc('wash', '🧺') + sc('lock', '🔑');
  let st, facts = [];
  if (S.sec) st = { emo: S.sec === 'wash' ? '🧺' : '🔑', title: t.secrets[S.sec === 'wash' ? 'a' : 'b'][0], lead: S.sec === 'wash' ? t.washText : t.lockText };
  else if (!ans) st = { emo: '🤔', title: t[v + 'Ask'], lead: '' };
  else { const [emo, title, lead, body] = t.st[v]; st = { emo, title, lead, body }; facts = t.facts[v]; }
  lab.setGlow(S.sec ? 'rgba(123, 94, 167, .28)' : v === 'fit' ? 'rgba(42, 157, 143, .28)' : v === 'temp' ? 'rgba(239, 138, 116, .26)' : 'rgba(242, 193, 78, .26)');
  lab.setState({ body: '', ...st });
  lab.setFacts(facts);
  updateReadout();
}
render();
</script>
