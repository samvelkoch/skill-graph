  if (a === 'gen') { if (S.gen < 4) { S.gen++; sfx.click(); } }
  else if (a === 'replay') { S.shipT0 = now() + 0.3; sfx.click(); showStage(); }
  else if (a === 'resetship') { S.ship = { x: px(18), y: py(34.2), mode: 'idle', fx: 0, fy: 0, tx: 0, ty: 0, t0: 0, drag: false }; S.mine = []; S.last = null; S.mode = 'time'; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.sel = null;
    if (S.sec === 'a' && S.year > 600) S.year = 400;
    if (S.sec === 'b') S.roadT0 = now();
    $('yr').value = YMAX - S.year; sfx.click(); showStage();
  } else if (a === 'tclear') { if (!tr.ok[tr.r]) { GK.forEach((k) => { tr.n[k] = 0; }); sfx.click(); } }
  else if (a === 'tmain') {
    if (tr.treasure) { tr.treasure = false; sfx.click(); }
    else if (tr.ok[tr.r] && tr.r < 2) { tr.r++; GK.forEach((k) => { tr.n[k] = 0; }); sfx.click(); }
    else if (tr.ok[2] && tr.r === 2) { tr.treasure = true; sfx.good(); showStage(); }
  }
  render();
});
$('yr').addEventListener('input', (ev) => { if (!mapOpen() && !S.sec) return; S.year = YMAX - +ev.target.value; S.mode = 'time'; S.sel = null; S.sec = S.sec === 'a' ? 'a' : null; render(); });

// --- one render per change: controls, readout, state card, facts --------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, gate = !gateOpen(v);
  document.body.dataset.v = v;
  $('cv').style.touchAction = v === 'map' && mapOpen() ? 'none' : 'pan-y';
  $('vPolis').hidden = v !== 'polis'; $('vMap').hidden = v !== 'map'; $('vTrade').hidden = v !== 'trade';
  if (v === 'polis') renderPolis(t);
  else if (v === 'map') renderMap(t, gate);
  else renderTrade(t, gate);
}
const gateVerdict = () => (S.gateV ? `<div class="gc-verdict ${S.gateV.ok ? 'good' : 'bad'}" style="margin:0 0 12px">${esc(S.gateV.txt)}</div>` : '');
function gateState(t) { lab.setState({ emo: '🤔', title: t.gate[0], lead: t.gate[1], body: '', extra: '' }); lab.setFacts([]); }

function renderPolis(t) {
  const p = t.polis, ans = S.pick.polis !== null, tl = S.shipT0 === null ? -1 : now() - S.shipT0;
  $('pPolis').innerHTML = predHTML('polis');
  $('genB').textContent = S.gen >= 4 ? p.genEnd : p.gen; $('genB').disabled = S.gen >= 4;
  $('replayB').textContent = p.replay; $('replayB').hidden = !ans;
  $('polisNote').textContent = '';
  const left = ans && S.shipT0 !== null && tl > 1.2, fam = FAM[S.gen] - (left ? LEAVE : 0);
  lab.setReadout(fam, `${p.fam(fam)} · ${p.fields(FIELDS)}`, left ? p.newcity(LEAVE) : p.ratio(fmt1(fam / FIELDS)), '#e0b050');
  lab.setGlow('rgba(224, 176, 80, .26)');
  const st = ans ? p.s1 : p.s0(fam);
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
  lab.setFacts(ans ? p.facts : []);
}

function renderMap(t, gate) {
  const m = t.map, ready = !gate && S.pick.map !== null;
  $('pMap').innerHTML = (gate ? '' : gateVerdict()) + predHTML(gate ? 'polis' : 'map');
  $('mapAfter').hidden = !ready;
  lab.setGlow('rgba(80, 150, 200, .3)');
  if (gate) { lab.setReadout('?', '', '', '#6fb6d4'); gateState(t); return; }
  if (!ready) { lab.setReadout('?', '', '', '#6fb6d4'); lab.setState({ emo: m.s0[0], title: m.s0[1], lead: m.s0[2], body: '', extra: '' }); lab.setFacts([]); return; }
  $('mapHint').textContent = m.hint; $('yrA').textContent = t.bc(YMAX); $('yrB').textContent = t.bc(YMIN);
  $('yr').value = YMAX - S.year; $('yr').setAttribute('aria-label', m.time);
  $('colChips').innerHTML = COL.slice().sort((a, b) => b.y - a.y).map((k) => `<button class="chip${S.sel === k.k ? ' on' : ''}" data-col="${k.k}"${S.year <= k.y ? '' : ' disabled'}>${esc(m.cl[k.k].n)} · ${esc(m.cl[k.k].ds)}</button>`).join('');
  $('resetB').textContent = m.reset;
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(m.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('mapSecs').innerHTML = sc('a', '🔤') + sc('b', '🛣️');
  $('mapNote').textContent = m.approx;
  const n = COL.filter((k) => S.year <= k.y).length;
  lab.setReadout(`${n}<small style="font-size:.55em;opacity:.7"> / ${COL.length}</small>`, m.sub(t.bc(S.year)), t.bc(S.year), '#6fb6d4');
  if (S.sec === 'a') { lab.setState({ emo: m.sa[0], title: m.sa[1], lead: m.sa[2], body: '', extra: '' }); lab.setFacts(m.factsA); return; }
  if (S.sec === 'b') { lab.setState({ emo: m.sb[0], title: m.sb[1], lead: m.sb[2], body: m.sb[3], extra: '' }); lab.setFacts(m.factsB); return; }
  lab.setFacts(m.facts);
  if (S.mode === 'test' && S.last) {
    const e = S.last;
    if (e.kind === 'sea') lab.setState({ emo: m.sea[0], title: m.sea[1], lead: m.sea[2], body: '', extra: '' });
    else if (e.kind === 'coast') lab.setState({ emo: m.coast[0], title: m.coast[1], lead: m.coast[2], body: m.indep, extra: '' });
    else lab.setState({ emo: m.inland[0], title: m.inland[1], lead: m.inland[2](e.km), body: m.inland[3], extra: '' });
    return;
  }
  const vis = COL.filter((k) => S.year <= k.y), cur = S.sel ? COL.find((k) => k.k === S.sel) : vis.sort((a, b) => a.y - b.y)[0];
  if (!cur) { lab.setState({ emo: m.pre[0], title: m.pre[1], lead: m.pre[2], body: '', extra: '' }); return; }
  const cl = m.cl[cur.k];
  lab.setState({ emo: cur.k === 'nau' ? '🏺' : '🏛️', title: cl.n, lead: `${cl.d.replace(/\.$/, '')}. ${cur.mo ? `${m.settlers} ${cl.from}.` : cl.from.charAt(0).toUpperCase() + cl.from.slice(1) + '.'}`, body: `${cl.note}${cur.k === 'nau' ? '' : ' ' + m.indep}`, extra: '' });
}

function renderTrade(t, gate) {
  const tt = t.trade, tr = S.tr, ready = !gate;
  $('pTrade').innerHTML = gate ? predHTML('polis') : gateVerdict();
  $('tradeAfter').hidden = !ready;
  lab.setGlow('rgba(230, 160, 100, .28)');
  if (gate) { lab.setReadout('?', '', '', '#e6a064'); gateState(t); return; }
  const R = loadVal(tr.r), L = GK.reduce((a, k) => a + GV[k] * tr.n[k], 0), ok = tr.ok[tr.r], done = tr.ok[2] && tr.r === 2;
  $('loadTxt').textContent = tt.load(tr.r + 1, R);
  $('gSteps').innerHTML = GK.map((k, i) => `<div class="gc-stp"><span class="l">${['🍷', '🏺', '🧵'][i]} ${esc(tt.goods[k])} (${GV[k]})</span><div class="r">
    <button class="gc-sb" data-g="${k}" data-s="-1" aria-label="−"${ok || tr.n[k] <= 0 ? ' disabled' : ''}>−</button><b>${tr.n[k]}</b>
    <button class="gc-sb" data-g="${k}" data-s="1" aria-label="+"${ok || tr.n[k] >= 3 ? ' disabled' : ''}>+</button></div></div>`).join('');
  $('tMain').textContent = tr.treasure ? tt.back : !ok ? tt.wait : done ? tt.treasure : tt.next;
  $('tMain').disabled = !ok && !tr.treasure;
  $('tClear').textContent = tt.clear; $('tClear').disabled = ok;
  $('tNote').textContent = `${tt.note} ${Object.entries(NV).map(([k, v]) => `${tt.goods[k]} ${v}`).join(' · ')}`;
  lab.setReadout(`${L} : ${R}`, tt.sub, ok ? tt.balanced : '', '#e6a064');
  if (tr.treasure) { lab.setState({ emo: tt.tr[0], title: tt.tr[1], lead: tt.tr[2], body: tt.tr[3], extra: '' }); lab.setFacts(tt.factsT); return; }
  lab.setFacts(tt.facts);
  const st = done ? tt.end : ok ? tt.ok : L === 0 ? tt.empty : L < R ? tt.low : tt.high;
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] ?? '', extra: '' });
}
render();
</script>
