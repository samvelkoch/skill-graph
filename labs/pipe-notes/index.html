// --- the physics: an open pipe sounds f = v / 2L; a pipe closed at one end sounds f = v / 4L ----------------------
const V = 343, TAU = Math.PI * 2, NOTE_N = 8;
const FREQ = [72, 74, 76, 77, 79, 81, 83, 84].map((m) => 440 * 2 ** ((m - 69) / 12)); // C5 … C6, equal temperament
const LEN = FREQ.map((f) => V / (2 * f)); // effective air-column length of an open pipe for each note, metres
const REC = { holes: [7, 6, 5, 4, 3, 2, 1].map((i) => LEN[i]), end: LEN[0], n: 7 }; // hole 1 ends the column for C6 … hole 7 for D5
const BONE = { holes: [0.10, 0.14, 0.18, 0.22, 0.26], end: 0.30, n: 5 }; // illustrative
const AIR = 0.25, PIPE_L = FREQ.map((f) => V / (4 * f)); // bottle height of air (m), closed pan-pipe tubes

const TUNE = [[6, 5, 4, 6, 5, 4], [4, 4, 4, 4, 5, 5, 5, 5, 6, 5, 4]]; // Hot Cross Buns: B A G B A G | G G G G A A A A B A G (note indexes in the C scale)
const firstOpen = (inst, cov) => { const i = cov.findIndex((x) => !x); return i; };
const colOf = (inst, cov) => { const i = firstOpen(inst, cov); return i < 0 ? inst.end : inst.holes[i]; };
const noteOf = (cov) => { const i = firstOpen(REC, cov); return i < 0 ? 0 : 7 - i; }; // recorder: index into the C scale
const covFor = (idx) => Array.from({ length: 7 }, (_, k) => k < 7 - idx);
const sameCov = (a, b) => a.every((x, i) => x === b[i]);

const cmOf = (L) => nf(L * 100, 1);
const cmU = () => (lang === 'ru' ? 'см' : 'cm');

const covOf = () => (inst() === BONE ? S.boneCov : S.cov);

// --- sound: own pitched voice (the shell only has blips); it follows the shell's sound switch ---------------------
let AC = null, master = null, voice = null;
const soundOn = () => store.get('sound', false);
function actx() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); master = AC.createGain(); master.gain.value = 0.9;
      master.connect(comp); comp.connect(AC.destination);
    }
    if (AC.state !== 'running') AC.resume().catch(() => {});
    return AC;
  } catch { return null; }
}
['pointerdown', 'pointerup', 'touchend', 'keydown', 'click'].forEach((e) => addEventListener(e, () => { if (soundOn()) { unmuteIOS(); actx(); } }, { passive: true }));
const ensureSound = () => { if (!soundOn()) $('sound').click(); return soundOn(); }; // an explicit blow / tap press turns the sound on
const HARM = { rec: [[1, 1], [2, 0.16], [3, 0.05]], pipe: [[1, 1], [3, 0.3], [5, 0.1]], bottle: [[1, 1], [2, 0.07]] };
function startVoice(f, kind = 'rec') {
  if (!soundOn()) return;
  unmuteIOS(); const x = actx(); if (!x) return;
  stopVoice(true);
  const t = x.currentTime, g = x.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.2 * S.breath + 0.04, t + 0.05);
  const oscs = HARM[kind].map(([m, a]) => {
    const o = x.createOscillator(), ga = x.createGain(); o.type = 'sine'; o.frequency.value = f * m; ga.gain.value = a;
    o.connect(ga).connect(g); o.start(t); return { o, m };
  });
  g.connect(master); voice = { g, oscs, x };
}
const voiceFreq = (f) => { if (voice) { const t = voice.x.currentTime; voice.oscs.forEach(({ o, m }) => o.frequency.setTargetAtTime(f * m, t, 0.025)); } };
const voiceVol = () => { if (voice) voice.g.gain.setTargetAtTime(0.2 * S.breath + 0.04, voice.x.currentTime, 0.03); };
function stopVoice(fast) {
  if (!voice) return;
  const { g, oscs, x } = voice; voice = null; const t = x.currentTime;
  try {
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), t); g.gain.exponentialRampToValueAtTime(0.0001, t + (fast ? 0.03 : 0.14));
    oscs.forEach(({ o }) => o.stop(t + 0.2));
  } catch { /* already stopped */ }
}
function playTone(f, ms, kind) { startVoice(f, kind); later(() => stopVoice(), ms); }
function tapSound(f) { // a glass tap: quick decaying partials
  if (!soundOn()) return;
  unmuteIOS(); const x = actx(); if (!x) return;
  const t = x.currentTime + 0.005;
  [[1, 1, 0.9], [2.32, 0.35, 0.5], [4.1, 0.18, 0.3]].forEach(([m, a, d]) => {
    const o = x.createOscillator(), g = x.createGain(); o.type = 'sine'; o.frequency.value = f * m;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.22 * a, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(master); o.start(t); o.stop(t + d + 0.05);
  });
}

const pill = (c, txt, x, y, w, col = '#EDEFF7', size = 12) => {

// the recorder (or bone flute) drawn along +y from its labium at (0, 0); o: { s px/m, bw, inst, cov, Lcol, glow 0..1, amp, time, over, hint }
function drawRecorder(c, o) {
  const { s, bw, inst: I, cov, time } = o, bone = I === BONE, hw = bw / 2, yEnd = I.end * s, beak = bone ? 0 : 0.075 * s, flare = 0.03 * s;
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 14; c.shadowOffsetX = 5; c.shadowOffsetY = 4;
  const g = c.createLinearGradient(-hw, 0, hw, 0);
  (bone ? [[0, '#9c8660'], [0.25, '#e9dcba'], [0.5, '#fbf4de'], [0.75, '#d6c398'], [1, '#85704c']] : [[0, '#552a12'], [0.22, '#b5702f'], [0.45, '#e5a862'], [0.75, '#bf7a3a'], [1, '#4a2210']])
    .forEach(([p, col]) => g.addColorStop(p, col));
  c.fillStyle = g; c.beginPath();
  if (bone) {
    c.moveTo(-hw * 0.8, 0); c.lineTo(hw * 0.8, 0); c.quadraticCurveTo(hw * 1.02, yEnd * 0.5, hw * 0.9, yEnd); c.lineTo(-hw * 0.9, yEnd); c.quadraticCurveTo(-hw * 1.02, yEnd * 0.5, -hw * 0.8, 0);
  } else {
    c.moveTo(-hw * 0.5, -beak); c.lineTo(hw * 0.5, -beak); c.quadraticCurveTo(hw * 0.56, -beak * 0.35, hw, 0); c.lineTo(hw, yEnd - flare);
    c.quadraticCurveTo(hw, yEnd - flare * 0.3, hw * 1.22, yEnd); c.lineTo(-hw * 1.22, yEnd); c.quadraticCurveTo(-hw, yEnd - flare * 0.3, -hw, yEnd - flare);
    c.lineTo(-hw, 0); c.quadraticCurveTo(-hw * 0.56, -beak * 0.35, -hw * 0.5, -beak);
  }
  c.closePath(); c.fill(); c.shadowColor = 'transparent';
  c.lineWidth = 1.5; c.strokeStyle = bone ? '#5b4a30' : '#2a1408'; c.stroke();
  if (!bone) { // window and the sharp edge (labium)
    c.fillStyle = '#1b0e07'; c.beginPath(); c.roundRect(-hw * 0.42, -0.026 * s, hw * 0.84, 0.026 * s, 3); c.fill();
    c.strokeStyle = 'rgba(255, 232, 196, .85)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(-hw * 0.42, 0); c.lineTo(hw * 0.42, 0); c.stroke();
    // wooden joints
    for (const y of [0.1 * s, yEnd - 0.022 * s]) {
      const r = c.createLinearGradient(-hw, 0, hw, 0); r.addColorStop(0, '#8a6a3a'); r.addColorStop(0.4, '#f1dca8'); r.addColorStop(1, '#7d5f33');
      c.fillStyle = r; c.beginPath(); c.roundRect(-hw * 1.04, y, hw * 2.08, 0.012 * s, 2); c.fill(); c.strokeStyle = 'rgba(40, 20, 8, .6)'; c.lineWidth = 1; c.stroke();
    }
  } else { // blowing end
    c.fillStyle = '#4a3a22'; c.beginPath(); c.ellipse(0, 3, hw * 0.55, 3.2, 0, 0, TAU); c.fill();
  }
  // the bore: a dark channel (cut open so you can see the air)
  const bg = c.createLinearGradient(-hw * 0.3, 0, hw * 0.3, 0); bg.addColorStop(0, '#0b0603'); bg.addColorStop(1, '#2a160a');
  c.fillStyle = bg; c.beginPath(); c.roundRect(-hw * 0.3, 2, hw * 0.6, yEnd - 5, hw * 0.3); c.fill();
  // the glowing air column
  if (o.glow > 0) {
    const Lp = o.Lcol * s, ph = Math.cos(TAU * 1.5 * time), m = o.over ? 2 : 1, a = o.amp * o.glow;
    c.save(); c.shadowColor = `rgba(255, 190, 90, ${0.8 * a})`; c.shadowBlur = 14;
    const lg = c.createLinearGradient(0, 0, 0, Lp); lg.addColorStop(0, `rgba(255, 240, 180, ${Math.min(1, 0.55 + 0.45 * a)})`); lg.addColorStop(1, `rgba(255, 176, 70, ${0.4 + 0.5 * a})`);

// --- the tune: a mini staff above a horizontal recorder --------------------------------------------------------
const CLEF_G = new Path2D('M -0.6 2.15 C -0.7 2.9 0.3 3.2 0.32 2.3 C 0.3 0.5 0.4 -1.5 0.4 -3.0 C 0.4 -4.2 1.2 -4.6 1.15 -3.4 C 1.2 -2.6 0.2 -1.7 -0.6 -0.9 C -1.3 -0.2 -1.1 1.0 -0.1 1.0 C 0.9 1.0 1.25 0.2 0.9 -0.5 C 0.6 -1.1 -0.3 -1.1 -0.55 -0.5 C -0.75 0.0 -0.4 0.45 0.0 0.3');

// --- controls ----------------------------------------------------------------------------------------------------

  else if (a === 'tryit') { S.rev = false; stopAll(); }
  else if (a === 'hole') { const cv = covOf(), k = +b.dataset.k; cv[k] = !cv[k]; if (S.blow) voiceFreq(freqNow()); }
  else if (a === 'note') { S.cov = covFor(+b.dataset.i); if (S.blow) voiceFreq(freqNow()); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; stopAll();
  } else if (a === 'snd') $('sound').click();
  else if (a === 'go') $('views').querySelector('[data-view="holes"]')?.click();
  else if (a === 'w1') { S.w1 = b.dataset.v; sweep(); }
  else if (a === 'w2') S.w2 = b.dataset.v;
  else if (a === 'mode') { S.mode = b.dataset.m; clearTimers(); stopVoice(); }
  else if (a === 'hit') hitBottle(+b.dataset.i);
  else if (a === 'hint') S.hint = !S.hint;
  else if (a === 'listen') listen();
  else if (a === 'again') { S.step = 0; S.lit = []; S.miss = null; S.demo = -1; clearTimers(); stopVoice(); }
  else if (a === 'next') { S.tp = 1; S.step = 0; S.lit = []; S.miss = null; S.demo = -1; }
  else if (a === 'tune1') { S.tp = 0; S.step = 0; S.lit = []; S.miss = null; }
  render();
});
function hear() { // the reveal in Holes: both recorders, one after the other
  stopAll();
  const a = noteOf(ALL), b = noteOf(TOP3), first = S.swap ? b : a, second = S.swap ? a : b;
  ensureSound(); playTone(FREQ[first], 900, 'rec'); later(() => playTone(FREQ[second], 900, 'rec'), 1100);
}
function listen() {
  stopAll(); const notes = TUNE[S.tp]; ensureSound();
  notes.forEach((idx, i) => later(() => { S.demo = i; playTone(FREQ[idx], 380, 'rec'); render(); }, i * 480));
  later(() => { S.demo = -1; render(); }, notes.length * 480 + 200);
}

// --- one render per change ---------------------------------------------------------------------------------------
const GAUGE_TICKS = (max) => [{ f: 0, label: '0' }, { f: 0.5, label: String(Math.round(max * 50)) }, { f: 1, label: String(Math.round(max * 100)) }];
const air = () => ({ en: 'Air', ru: 'Воздух', hu: 'Levegő' })[lang];
const hz = () => (lang === 'ru' ? 'Гц' : 'Hz');

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  const gate = v !== 'holes' && S.g1 === null;
  show('secAsk', false); show('secBar', false); show('secHoles', false); show('secWater', false); show('secTune', false);
  $('gauge').style.visibility = 'hidden';
  if (gate) return renderGate(t, v);
  if (v === 'holes') renderHoles(t); else if (v === 'water') renderWater(t); else renderTune(t);
}
function renderGate(t, v) {
  const g = v === 'water' ? t.w : t.u;
  show('secAsk', true);
  $('secAsk').innerHTML = `<button class="pn-opt" data-act="go">${esc(g.go)}</button>`;
  lab.setGlow('rgba(224, 163, 94, .2)'); lab.setReadout('?', '', '', '#e0a766');
  lab.setState({ emo: '🔒', title: g.gateT, lead: g.gateL, body: '', extra: '' }); lab.setFacts([]);
}
const holeButtons = (t, I, cov, hint) => {
  $('lblHoles').textContent = t.h.holes;
  $('holeRow').innerHTML = I.holes.map((_, k) => `<button class="pn-hole${cov[k] ? ' on' : ''}${hint && hint[k] ? ' hint' : ''}" data-act="hole" data-k="${k}" aria-pressed="${cov[k]}" aria-label="${esc(t.h.holes)} ${k + 1}">${k + 1}</button>`).join('');
  $('pnBlow').textContent = t.h.blow; $('pnBlow').classList.toggle('on', S.blow);
};

function renderHoles(t) {
  const h = t.h;
  lab.setGlow('rgba(224, 163, 94, .26)');
  if (S.g1 === null) { // the question
    show('secAsk', true);
    const opts = [['all', h.optAll], ['top', h.optTop]]; if (S.swapBtn) opts.reverse();
    $('secAsk').innerHTML = opts.map(([k, l]) => `<button class="pn-opt" data-act="g1" data-v="${k}">${esc(l)}</button>`).join('');
    lab.setReadout('?', '', '', '#e0a766');
    lab.setState({ emo: '🤔', title: h.q, lead: h.askLead, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  const nA = noteOf(ALL), nB = noteOf(TOP3), LA = colOf(REC, ALL), LB = colOf(REC, TOP3);
  if (S.rev) { // the reveal of the question
    show('secAsk', true);
    $('secAsk').innerHTML = `<div class="pn-row"><button class="pn-opt" data-act="hear">${esc(h.hear)}</button><button class="pn-opt" data-act="tryit">${esc(h.tryit)}</button></div>`;
    const ok = S.g1 === 'all';
    lab.setReadout(`${t.names[nA]} · ${t.names[nB]}`, `${Math.round(FREQ[nA])} ${hz()} · ${Math.round(FREQ[nB])} ${hz()}`, t.illu, '#e0a766');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: h.reveal(t.names[nA], cmOf(LA), t.names[nB], cmOf(LB)), body: h.why, extra: `<div class="pn-fine">${esc(h.fine)}</div>` });
    lab.setFacts(t.facts.h);
    return;
  }
  const I = inst(), cov = covOf(), L = colOf(I, cov), f = freqNow(), bone = I === BONE;
  show('secBar', true); show('secHoles', true);
  holeButtons(t, I, cov, null);
  $('lblBreath').textContent = h.breath; $('breathBox').hidden = false;
  const unl = secret.unlocked();
  const idx = noteOf(S.cov);
  $('secHoles').innerHTML = `<div class="pn-line">${bone ? '' : `<span class="pn-lbl">${esc(h.notes)}</span><span class="chips">${t.names.map((n, i) => `<button class="chip pn-c${!overOn() && sameCov(S.cov, covFor(i)) ? ' on' : ''}" data-act="note" data-i="${i}">${esc(n)}</button>`).join('')}</span>`}</div>
    <div class="pn-line"><span class="chips">${['bone', 'over'].map((k, i) => `<button class="chip pn-c secret ${unl ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${unl ? `${i ? '⏫' : '🦴'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('')}</span></div>
    ${soundOn() ? '' : `<div class="pn-snd"><button class="chip pn-c" data-act="snd">${esc(t.snd)}</button></div>`}`;
  lab.setReadout(bone ? `${Math.round(f)}` : t.names[idx], bone ? hz() : h.sub(Math.round(f), cmOf(L)), t.illu, '#e0a766');
  lab.setGauge(L / LEN[0], GAUGE_TICKS(LEN[0]), air()); $('gauge').style.visibility = 'visible';
  let st;
  if (S.sec === 'bone') st = { emo: '🦴', title: h.boneT, lead: h.boneL, body: h.boneB };
  else if (overOn()) st = { emo: '⏫', title: h.overT, lead: h.overL, body: h.overB };
  else st = { emo: '🎶', title: h.col(cmOf(L), t.names[idx]), lead: h.lead, body: h.body };
  lab.setState({ ...st, extra: `<div class="pn-fine">${esc(h.formula(nf(L, 3), Math.round(V / (2 * L))))}<br>${esc(h.fine)}</div>` });
  lab.setFacts(S.sec === 'bone' ? t.facts.u.slice(0, 2) : t.facts.h);
}

function renderWater(t) {
  const w = t.w, open = S.w1 !== null;
  lab.setGlow('rgba(88, 182, 232, .24)');
  $('lvBox').querySelectorAll('input').forEach((el, i) => { const val = Math.round(S.lv[i] * 100); if (+el.value !== val) el.value = val; el.setAttribute('aria-label', w.bottle(i + 1)); });
  $('lvBox').querySelectorAll('.lv-t').forEach((el, i) => { el.textContent = w.bottle(i + 1); });
  if (!open) { // prediction 1
    show('secAsk', true);
    $('secAsk').innerHTML = `<div class="pn-row"><button class="pn-opt" data-act="w1" data-v="up">${esc(w.hi)}</button><button class="pn-opt" data-act="w1" data-v="down">${esc(w.lo)}</button></div>`;
    lab.setReadout('?', '', '', '#58b6e8'); lab.setState({ emo: '🤔', title: w.q1, lead: w.askLead1, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  show('secWater', true);
  $('modeRow').innerHTML = ['blow', 'tap', 'pipes'].map((m) => `<button class="chip pn-c${S.mode === m ? ' on' : ''}" data-act="mode" data-m="${m}">${esc(w.modes[m])}</button>`).join('');
  const needQ2 = S.mode === 'tap' && S.w2 === null, pipes = S.mode === 'pipes';
  show('lvBox', !pipes); show('playRow', !pipes && !needQ2);
  $('playRow').innerHTML = [0, 1, 2].map((i) => `<button class="chip pn-c" data-act="hit" data-i="${i}">${S.mode === 'tap' ? '🥄' : '🌬️'} ${i + 1}</button>`).join('');
  if (needQ2) {
    show('secAsk', true);
    $('secAsk').innerHTML = `<div class="pn-row"><button class="pn-opt" data-act="w2" data-v="up">${esc(w.hi)}</button><button class="pn-opt" data-act="w2" data-v="down">${esc(w.lo)}</button></div>`;
    lab.setReadout('?', '', '', '#58b6e8'); lab.setState({ emo: '🤔', title: w.q2, lead: w.askLead2, body: '', extra: '' });
    lab.setFacts(t.facts.w1); return;
  }
  const facts = S.w2 !== null ? [...t.facts.w1, ...t.facts.w2] : t.facts.w1;
  if (pipes) {
    const i = S.selP;
    lab.setGauge(i === null ? 0 : PIPE_L[i] / PIPE_L[0], GAUGE_TICKS(PIPE_L[0]), air()); $('gauge').style.visibility = i === null ? 'hidden' : 'visible';
    lab.setReadout(i === null ? '—' : t.names[i], i === null ? '' : `${Math.round(FREQ[i])} ${hz()} · ${w.air(cmOf(PIPE_L[i]))}`, t.illu, '#d8b45e');
    lab.setState(i === null ? { emo: '🎋', title: w.pipesT, lead: w.pipesL, body: '', extra: `<div class="pn-fine">${esc(w.pipeFine)}</div>` }
      : { emo: '🎋', title: w.pipeT(t.names[i], cmOf(PIPE_L[i])), lead: w.pipeL, body: '', extra: `<div class="pn-fine">${esc(w.pipeFine)}</div>` });
    lab.setFacts(facts); return;
  }
  if (S.mode === 'blow') {
    const i = S.sel, f = i === null ? 0 : bottleFreq(i, false), Lr = i === null ? 0 : AIR * (1 - S.lv[i]);
    lab.setGauge(i === null ? 0 : Lr / AIR, GAUGE_TICKS(AIR), air()); $('gauge').style.visibility = i === null ? 'hidden' : 'visible';
    lab.setReadout(i === null ? '—' : `${Math.round(f)} ${hz()}`, i === null ? '' : w.air(cmOf(Lr)), t.illu, '#58b6e8');
    const ok = S.w1 === 'up';
    lab.setState(i === null ? { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: w.r1, body: w.blowL, extra: `<div class="pn-fine">${esc(w.fine)}</div>` }
      : { emo: '🍾', title: w.blowT(i + 1, cmOf(Lr)), lead: w.r1, body: w.blowL, extra: `<div class="pn-fine">${esc(w.fine)}</div>` });
  } else {
    const i = S.selT, f = i === null ? 0 : bottleFreq(i, true), ok = S.w2 === 'down';
    lab.setReadout(i === null ? '—' : `${Math.round(f)} ${hz()}`, i === null ? '' : w.bottle(i + 1), t.illu, '#58b6e8');
    lab.setState(i === null ? { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notq, lead: w.r2, body: w.tapL, extra: `<div class="pn-fine">${esc(w.tapFine)}</div>` }
      : { emo: '🥄', title: w.tapT(i + 1), lead: w.r2, body: w.tapL, extra: `<div class="pn-fine">${esc(w.tapFine)}</div>` });
  }
  lab.setFacts(facts);
}

function renderTune(t) {
  const u = t.u, notes = TUNE[S.tp], n = notes.length, done = S.step >= n;
  lab.setGlow('rgba(224, 163, 94, .24)');
  show('secBar', true); show('secTune', true);
  $('lblBreath').textContent = t.h.breath; $('breathBox').hidden = true;
  const hint = S.hint && !done ? covFor(notes[S.step]) : null;
  holeButtons(t, REC, S.cov, hint);
  $('secTune').innerHTML = `<div class="pn-line"><button class="chip pn-c${S.hint ? ' on' : ''}" data-act="hint">${esc(S.hint ? u.hide : u.hint)}</button>
    <button class="chip pn-c" data-act="listen">${esc(u.listen)}</button><button class="chip pn-c" data-act="again">${esc(u.again)}</button>
    ${done && S.tp === 0 ? `<button class="btn" data-act="next">${esc(u.next)}</button>` : ''}${done && S.tp === 1 ? `<button class="chip pn-c" data-act="tune1">${esc(u.again)} 1</button>` : ''}</div>`;
  const idx = noteOf(S.cov), L = colOf(REC, S.cov);
  lab.setReadout(`${S.step}/${n}`, u.sub(t.names[idx]), '', '#e0a766');
  lab.setGauge(L / LEN[0], GAUGE_TICKS(LEN[0]), air()); $('gauge').style.visibility = 'visible';
  let st;
  if (done) st = { emo: '✅', title: u.doneT, lead: S.tp === 0 ? u.doneL : u.done2L, body: '' };
  else if (S.miss) st = { emo: '🤔', title: u.taskT, lead: u.miss(t.names[S.miss.p], t.names[S.miss.w]), body: '' };
  else st = S.tp === 0 ? { emo: '🎶', title: u.taskT, lead: u.taskL, body: u.tuneName } : { emo: '🎶', title: u.task2T, lead: u.task2L, body: u.tuneName };
  lab.setState({ ...st, extra: `<div class="pn-fine">${esc(u.rhythm)} ${esc(t.h.fine)}</div>` });
  lab.setFacts(t.facts.u);
}
render();
</script>
