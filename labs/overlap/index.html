    c.save(); c.globalAlpha = S.bandA;
    c.fillStyle = lg(c, 0, y0, 0, y1, [[0, 'rgba(79,209,197,.22)'], [1, 'rgba(79,209,197,.12)']]); c.fillRect(x0, y0, x1 - x0, y1 - y0);
    c.strokeStyle = 'rgba(79,209,197,.85)'; c.lineWidth = 1.5; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0, y1); c.moveTo(x1, y0); c.lineTo(x1, y1); c.stroke(); c.setLineDash([]);
    pill(c, t2.band, (x0 + x1) / 2, P.yards[0].top + P.yh + 4, { w, size: 12, fg: '#7ff0e4', stroke: 'rgba(79,209,197,.8)' });
    c.restore();
  }
  // flags
  const showFl = lab.view === 'average' || (lab.view === 'overlap' && (S.ov.avg || S.shuffled) && rev);
  S.flA += clamp((showFl ? 1 : 0) - S.flA, -dt * 4, dt * 4);
  for (const g of [0, 1]) {
    const tx = rev ? P.X(meanOf(g, t)) : w - 96, y = P.yards[g];
    S.fl[g] = S.fl[g] ? S.fl[g] + (tx - S.fl[g]) * Math.min(1, dt * 5) : tx;
    if (S.flA > 0.01) flag(c, S.fl[g], y.floor, y.top + 34, g, `${t2.avgShort} ${num(meanOf(g, t), S.shuffled ? 1 : dec)}`, time, S.flA);
  }
  // kids: move, then draw back to front
  const ord = KIDS.slice().sort((a, b) => a.y - b.y);
  for (const k of KIDS) {
    const q = P.pos[k.id], tx = rev ? q.lx : q.jx, ty = rev ? q.ly : q.jy;
    if (!k.ready) { k.x = tx; k.y = ty; k.tx = tx; k.ty = ty; k.ready = true; }
    if (Math.abs(k.tx - tx) > 0.5 || Math.abs(k.ty - ty) > 0.5) { k.tx = tx; k.ty = ty; k.wait = k.delay; }
    if (k.wait > 0) k.wait -= dt; else { const f = 1 - Math.exp(-dt * 5); k.x += (k.tx - k.x) * f; k.y += (k.ty - k.y) * f; }
  }
  const pr = S.pair, age = pr ? now() - pr.t : 9;
  for (const k of ord) {
    const mv = Math.hypot(k.tx - k.x, k.ty - k.y) > 2 || k.wait > 0, isP = pr && (k.id === pr.o || k.id === pr.f);
    let by = mv ? -Math.abs(Math.sin(time * 14 + k.bob)) * 3 : 0;
    if (isP) by -= Math.abs(Math.sin(Math.min(age, 1.2) * 7)) * 7 * Math.max(0, 1 - age / 1.2);
    c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(k.x, k.y + R * 0.98, R * 0.8, R * 0.16, 0, 0, Math.PI * 2); c.fill();
    drawKid(c, k.x, k.y + by, R, k, { ring: S.sel === k.id ? '#fff' : isP ? (pr.col[k.id]) : null });
  }
  // pair and tapped-kid bubbles
  if (pr && rev) {
    const a = KIDS[pr.o], b = KIDS[pr.f];
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.5; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); c.setLineDash([]);
    for (const k of [a, b]) pill(c, num(k.vals[0], 0), k.x, k.y - R * 1.5, { w, size: 14, padX: 9, H: 24, stroke: pr.col[k.id], fg: '#fff' });
  }
  const sk = S.sel !== null ? KIDS[S.sel] : null;
  if (sk && rev) pill(c, num(sk.vals[t], dec) + t2.units[t], sk.x, sk.y - R * 1.5, { w, size: 14, padX: 9, H: 24, stroke: '#fff' });
  // group name pills
  P.yards.forEach((y, g) => pill(c, `${GE[g]} ${t2.grp[g]} · ${inGroup(g).length}`, 16, y.top + 15, { w, align: 'left', size: 13, bg: 'rgba(12,14,26,.78)', stroke: GC[g] }));
}

function drawMeet(c, w, h, dt, time) {
  const me = S.me, t2 = T[lang];
  c.lineJoin = 'round';
  if (me.i >= 5) { // the gallery of the five
    const R = Math.min(34, (w - 30) / 6.4), pos = [[0, 0], [1, 0], [2, 0], [0.5, 1], [1.5, 1]];
    pos.forEach(([cx, ry], i) => {
      const x = w / 2 + (cx - 1) * R * 2.9, y = h / 2 - R * 1.2 + ry * R * 3.2, k = CARDK[i];
      drawKid(c, x, y, R, k, { ring: GC[k.g] });
      pill(c, t2.me.cards[i].n, x, y + R * 1.55, { w, size: 13, stroke: GC[k.g] });
    });
    return;
  }
  const flipT = me.guess !== null ? 1 : 0;
  me.flip += clamp(flipT - me.flip, -dt / 0.55, dt / 0.55);
  const f = ease(clamp(me.flip, 0, 1)), sx = Math.max(0.02, Math.abs(Math.cos(f * Math.PI))), back = f > 0.5, k = CARDK[me.i], g = k.g;
  const pop = 1 + 0.06 * Math.max(0, 1 - (time - me.at) * 4), cw = Math.min(w - 28, 320), ch = Math.min(h - 24, cw * 1.28);
  c.save(); c.translate(w / 2, h / 2); c.scale(sx * pop, pop);
  c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 18; c.shadowOffsetY = 8;
  c.beginPath(); c.roundRect(-cw / 2, -ch / 2, cw, ch, 22);
  c.fillStyle = lg(c, -cw / 2, -ch / 2, cw / 2, ch / 2, [[0, lite(GBG[g][0], 0.12)], [1, GBG[g][1]]]); c.fill();
  c.shadowColor = 'transparent'; c.strokeStyle = GC[g]; c.lineWidth = 2.5; c.stroke();
  c.beginPath(); c.roundRect(-cw / 2 + 8, -ch / 2 + 8, cw - 16, ch - 16, 16); c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1.5; c.stroke();
  c.beginPath(); c.arc(-cw / 2 + 36, -ch / 2 + 36, 22, 0, Math.PI * 2); c.fillStyle = rg(c, -cw / 2 + 30, -ch / 2 + 28, 0, -cw / 2 + 36, -ch / 2 + 36, 26, [[0, lite(GC[g], 0.35)], [1, GC[g]]]); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
  emoji(c, GE[g], -cw / 2 + 36, -ch / 2 + 37, 24);
  const R = Math.min(cw * 0.26, ch * 0.2), cy = -ch * 0.02;
  if (!back) {
    drawKid(c, 0, cy, R, k, { sil: true, g });
    c.fillStyle = '#9aa2c4'; c.font = `900 ${Math.round(R * 0.8)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 0, cy - R * 0.02);
    pill(c, t2.gsg[g], 0, ch / 2 - 40, { size: 15, padX: 14, H: 28, stroke: GC[g] });
  } else {
    drawKid(c, 0, cy, R, k, { g });
    pill(c, t2.me.cards[me.i].n, 0, cy + R * 1.6, { size: 17, padX: 16, H: 30, stroke: GC[g] });
    CARDE[me.i].forEach((e, j) => emoji(c, e, (j - 0.5) * 56, ch / 2 - 40, 30));
  }
  c.restore();
}

function drawStereo(c, w, h, dt, time) {
  const st = S.st, n = st.tap.filter(Boolean).length, t2 = T[lang];
  c.lineJoin = 'round';
  st.brk += clamp((n >= 10 ? 1 : 0) - st.brk, -dt / 0.9, dt / 0.9);
  const bw = Math.min(w - 24, 400), bh = 58, bx = (w - bw) / 2, by = 10, e = ease(st.brk);
  for (const side of [-1, 1]) {
    c.save(); c.globalAlpha = 1 - 0.35 * e;
    c.translate(w / 2, by + bh / 2); c.rotate(side * 0.14 * e); c.translate(side * 20 * e, 26 * e);
    c.beginPath(); if (side < 0) c.rect(-bw / 2 - 4, -bh, bw / 2 + 4, bh * 3); else c.rect(0, -bh, bw / 2 + 4, bh * 3); c.clip();
    c.translate(-w / 2, -(by + bh / 2));
    c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 10; c.shadowOffsetY = 4;
    c.beginPath(); c.roundRect(bx, by, bw, bh, 14); c.fillStyle = lg(c, 0, by, 0, by + bh, [[0, '#f26a6e'], [1, '#b3262b']]); c.fill(); c.shadowColor = 'transparent';
    c.strokeStyle = '#6b1417'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#fff'; c.font = '900 16px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    const words = t2.st.label.split(' '), lines = ['', '']; let li = 0;
    for (const wd of words) { const tryL = (lines[li] + ' ' + wd).trim(); if (c.measureText(tryL).width > bw - 28 && li === 0) { li = 1; lines[1] = wd; } else lines[li] = tryL; }
    if (!lines[1]) c.fillText(lines[0], w / 2, by + bh / 2 + 1); else { c.fillText(lines[0], w / 2, by + bh / 2 - 10); c.fillText(lines[1], w / 2, by + bh / 2 + 10); }
    if (e < 0.05) for (let i = 0; i < Math.min(n, 9); i++) { // cracks grow with every kid who does not fit
      const cx = bx + bw * (0.1 + 0.8 * ((i * 0.381 + 0.17) % 1)), len = 0.25 + 0.75 * Math.min(1, n / 9);
      c.strokeStyle = '#2a0a0c'; c.lineWidth = 2; c.beginPath(); c.moveTo(cx, by);
      for (let j = 1; j <= 4; j++) c.lineTo(cx + (j % 2 ? 7 : -7) * (1 + (i % 3) * 0.3), by + (bh * len * j) / 4);
      c.stroke();
    }
    c.restore();
  }
  const top = by + bh + 16, rows = 5, cols = 6, cellW = (w - 24) / cols, cellH = (h - top - 12) / rows, R = Math.min(cellW / 2.05, cellH / 1.75);
  S.stGeo = { top, cellW, cellH, R };
  KIDS.forEach((k, i) => {
    const x = 12 + cellW * ((i % cols) + 0.5), y = top + cellH * (Math.floor(i / cols) + 0.5) - R * 0.1;
    drawKid(c, x, y, R, k, { badge: false });
    const tapped = st.tap[i], age = time - st.at[i], sz = R * 0.95 * (tapped ? 1 + 0.5 * Math.max(0, 1 - age * 3) : 1);
    c.save(); c.globalAlpha = 1; c.beginPath(); c.arc(x + R * 0.62, y + R * 0.7, R * 0.52, 0, Math.PI * 2); c.fillStyle = tapped ? '#fff' : '#2b304a'; c.fill(); c.strokeStyle = tapped ? '#3ddc97' : '#0c0e1a'; c.lineWidth = 1.5; c.stroke(); c.restore();
    emoji(c, tapped ? HOBBY[i] : '📱', x + R * 0.62, y + R * 0.72, sz * 0.78);
  });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec === 'stereo') drawStereo(c, w, h, dt, time); else if (lab.view === 'meet') drawMeet(c, w, h, dt, time); else drawYards(c, w, h, dt, time);
});

// --- input ---------------------------------------------------------------------------------------------------
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  if (S.sec === 'stereo' && S.stGeo) {
    const g = S.stGeo, col = Math.floor((px - 12) / g.cellW), row = Math.floor((py - g.top) / g.cellH);
    if (col < 0 || col > 5 || row < 0 || row > 4) return;
    const i = row * 6 + col; if (S.st.tap[i]) return;
    S.st.tap[i] = true; S.st.at[i] = now(); sfx.click(); render(); return;
  }
  if (lab.view === 'meet' || !revealed()) return;
  let best = null, bd = (S.R || 12) * 1.2;
  for (const k of KIDS) { const d = Math.hypot(px - k.x, py - (k.y + S.R * 0.2)); if (d <= bd) { bd = d; best = k.id; } }
  S.sel = best === S.sel ? null : best; if (best !== null) sfx.tick();
});

const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const dealPair = (o, f) => {
  const a = KIDS[o].vals[0], b = KIDS[f].vals[0], P = S.pairs;
  if (P.all) Object.assign(P, { n: 0, f: 0, o: 0, ti: 0, all: false });
  P.n++; if (b > a) P.f++; else if (b < a) P.o++; else P.ti++;
  const col = b > a ? ['#f5c84c', '#3ddc97'] : b < a ? ['#3ddc97', '#f5c84c'] : ['#f5c84c', '#f5c84c'];
  S.pair = { o, f, t: now(), col: { [o]: col[0], [f]: col[1] } };
};
const randKid = (g) => KIDS.filter((k) => k.g0 === g)[Math.floor(Math.random() * 15)].id;
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i, v = lab.view;
  if (act === 'g') {
    if (S.sec) return;
    if (v === 'average') { S.av.guess = i; S.av.rev = true; (i === 2 ? sfx.good : sfx.bad)(); showStage(); }
    else if (v === 'overlap') { S.ov.guess[S.ov.t] = i; S.ov.rev[S.ov.t] = true; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
    else { S.me.guess = i; S.me.res[S.me.i] = i === 2; S.me.at = now(); (i === 2 ? sfx.good : sfx.bad)(); showStage(); }
  } else if (act === 'rand') { dealPair(randKid(0), randKid(1)); sfx.click(); }
  else if (act === 'ten') { for (let j = 0; j < 10; j++) dealPair(randKid(0), randKid(1)); sfx.click(); }
  else if (act === 'all') {
    const O = KIDS.filter((k) => k.g0 === 0), F = KIDS.filter((k) => k.g0 === 1); let fm = 0, om = 0, ti = 0;
    for (const o of O) for (const f of F) { if (f.vals[0] > o.vals[0]) fm++; else if (f.vals[0] < o.vals[0]) om++; else ti++; }
    S.pairs = { n: 225, f: fm, o: om, ti, all: true }; S.pair = null; sfx.good();
  } else if (act === 'trait') { S.ov.t = i; S.sel = null; sfx.click(); }
  else if (act === 'avg') { S.ov.avg = !S.ov.avg; sfx.click(); }
  else if (act === 'next') { S.me.i++; S.me.guess = null; S.me.flip = 0; S.me.at = now(); sfx.click(); }
  else if (act === 'again') { S.me.i = 0; S.me.guess = null; S.me.flip = 0; S.me.res = []; S.me.at = now(); sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (k === 'a') {
      const ids = KIDS.map((q) => q.id).sort(() => Math.random() - 0.5);
      ids.forEach((id, j) => { KIDS[id].g = j < 15 ? 0 : 1; });
      S.sec = 'shuffle'; S.shuffled = true; S.ov.t = 0; S.ov.rev[0] = true; S.sel = null; S.pair = null;
      if (lab.view !== 'overlap') { lab.view = 'overlap'; lab.renderChrome(); }
    } else { if (S.shuffled) leaveSecret(); S.sec = 'stereo'; S.sel = null; }
    sfx.click();
  } else if (act === 'back') { leaveSecret(); sfx.click(); }
  render();
});

// --- readouts and state card ---------------------------------------------------------------------------------
const askBlock = (q, opts) => `<div class="ov-q">${esc(q)}</div><div class="ov-opts">${opts.map((o, i) => `<button class="ov-opt" data-act="g" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
const resBlock = (ok, verdict, text) => `<div class="ov-res ${ok ? 'ok' : 'no'}"><b>${esc(verdict)}</b>${esc(text)}</div>`;
const chip = (act, label, extra = '') => `<button class="chip ov-c ${extra}" data-act="${act}">${esc(label)}</button>`;

function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  let main = '', acts = '', st, ro;
  lab.setGlow('rgba(143, 111, 224, .26)');
  if (S.sec === 'stereo') {
    const n = S.st.tap.filter(Boolean).length, done = n >= 10;
    main = `<div class="ov-q">${esc(t.st.tap)}</div>`;
    acts = chip('back', t.st.back);
    ro = [`${n}/30`, t.st.sub, '', '#e5484d'];
    st = done ? { emo: '🪞', title: t.st.broke, lead: t.st.brokeLead, body: '' } : { emo: '🪞', title: n ? t.st.t(n) : t.secrets.b[0], lead: t.st.lead, body: '' };
    lab.setFacts([]);
  } else if (v === 'average') {
    const a = T[lang].av, ma = Math.round(meanOf(0, 0)), mf = Math.round(meanOf(1, 0)), P = S.pairs, g = S.av.guess;
    if (!S.av.rev) {
      main = askBlock(a.q, a.opts);
      ro = ['?', a.rdPre, '', '#8f6fe0'];
      st = { emo: '🦉', title: a.q, lead: a.line(ma, mf), body: t.invented };
    } else {
      main = resBlock(g === 2, g === 2 ? t.right : t.wrongV, g === 2 ? a.yes : a.no);
      acts = chip('rand', a.rand) + chip('ten', a.ten) + chip('all', a.all);
      ro = [P.n ? `${P.f}/${P.n}` : '—', a.rdSub, '', '#f08a3c'];
      st = P.all ? { emo: '∑', title: a.allT(P.f, P.o, P.ti), lead: a.cnt(P.f, P.n), body: '', extra: `<div class="ov-bar"><i style="flex:${P.f};background:${FC}"></i><i style="flex:${P.ti};background:#98A0B8"></i><i style="flex:${P.o};background:${OC}"></i></div><div class="ov-key">🦊 ${P.f} · = ${P.ti} · 🦉 ${P.o}</div>` }
        : P.n && S.pair ? { emo: '🤝', title: a.cnt(P.f, P.n), lead: a.pair(KIDS[S.pair.o].vals[0], KIDS[S.pair.f].vals[0]), body: '' }
        : { emo: '🤝', title: a.line(ma, mf), lead: a.hint, body: '' };
    }
    lab.setFacts([t.facts.average]);
  } else if (v === 'overlap') {
    const o = t.ov, tt = S.ov.t, g = S.ov.guess[tt], rev = revealed();
    const chips = t.traits.map((n, i) => `<button class="chip ov-c ${i === tt ? 'on' : ''}" data-act="trait" data-i="${i}">${S.ov.rev[i] ? '✓ ' : ''}${esc(n)}</button>`).join('');
    acts = chips;
    if (!rev) { main = askBlock(o.q, o.opts); ro = ['?', o.sub, '', '#4fd1c5']; st = { emo: '👥', title: o.q, lead: o.lead, body: t.invented }; }
    else {
      const [lo, hi] = bandOf(tt), inn = KIDS.filter((k) => k.vals[tt] >= lo && k.vals[tt] <= hi).length, dec = RANGE[tt][3];
      if (S.shuffled) {
        const dd = Math.max(1, dec), a1 = num(meanOf(0, tt), dd), b1 = num(meanOf(1, tt), dd);
        const base = (g_) => KIDS.filter((k) => k.g0 === g_).reduce((s, k) => s + k.vals[tt], 0) / 15;
        main = `<div class="ov-q">${esc(t.sh.t)}</div>`;
        ro = [`${a1} / ${b1}`, t.sh.sub, '', '#4fd1c5'];
        st = { emo: '🎲', title: t.sh.lead(a1, b1), lead: t.sh.body(num(base(0), dd), num(base(1), dd)), body: '' };
        acts = `<button class="chip ov-c secret open" data-act="sec" data-k="a">${esc(t.sh.again)}</button>` + chip('back', t.sh.back) + chips;
      } else {
        if (g !== null) main = resBlock(g === 1, g === 1 ? t.right : t.wrongV, g === 1 ? o.yes : o.no);
        acts = chips + chip('avg', S.ov.avg ? o.hideAvg : o.showAvg, S.ov.avg ? 'on' : '');
        ro = [`${inn}/30`, o.sub, '', '#4fd1c5'];
        st = { emo: '🟩', title: o.res(inn), lead: o.zone(num(lo, dec), num(hi, dec)), body: o.tap };
      }
    }
    lab.setFacts([t.facts.overlap]);
  } else {
    const m = t.me, i = S.me.i, g = S.me.guess;
    if (i >= 5) {
      const k = S.me.res.filter(Boolean).length; void k;
      main = `<div class="ov-q">${esc(m.final)}</div>`; acts = chip('again', m.again);
      ro = ['5/5', m.sub, '', '#e0b050']; st = { emo: '🧬', title: m.final, lead: m.finalLead, body: '' };
    } else if (g === null) {
      main = askBlock(m.cards[i].q, m.opts); ro = [`${i + 1}/5`, m.sub, '', '#e0b050'];
      st = { emo: '🎴', title: m.cards[i].q, lead: m.lead(i + 1), body: '' };
    } else {
      main = resBlock(g === 2, g === 2 ? t.right : t.guessV, m.cards[i].t); acts = chip('next', m.next, 'on');
      ro = [`${i + 1}/5`, m.sub, '', '#e0b050']; st = { emo: '🎴', title: m.cards[i].n, lead: m.cards[i].t, body: '' };
    }
    lab.setFacts([t.facts.meet]);
  }
  const sc = (k, emo) => `<button class="chip ov-c secret ${open ? 'open' : ''} ${(S.sec === 'shuffle' && k === 'a') || (S.sec === 'stereo' && k === 'b') ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒'}</button>`;
  $('ctrlBody').innerHTML = `<div class="ov-main">${main}</div><div class="ov-acts">${acts}</div><div class="ov-sec">${sc('a', '🎲')}${sc('b', '🪞')}</div>`;
  lab.setReadout(ro[0], ro[1], ro[2], ro[3]);
  lab.setState({ ...st, extra: st.extra ?? '' });
}
render();
</script>
</body>
