  const t = T[lang], end = SB.fixed ? 20 : 15, cov = MISS.slice(0, end), avg = cov.reduce((s, x) => s + x, 0) / end;
  const row = (k) => `<div class="ss-mrow ${k < end ? 'in' : SB.fixed ? 'in' : 'out'}"><i>${k + 2}</i><span>${esc(t.country)} ${k + 1}</span><b>${fmt(MISS[k])}</b></div>`;
  $('ssSB').innerHTML = `<div class="ss-miss"><div class="ss-mcols"><div>${Array.from({ length: 10 }, (_, k) => row(k)).join('')}</div><div>${Array.from({ length: 10 }, (_, k) => row(k + 10)).join('')}</div></div>
    <div class="ss-mavg"><span class="ss-f">=AVERAGE(B2:B${end + 1})</span><span>${esc(t.avg)}: <strong>${fmt(avg)}</strong></span></div></div>
    <div class="ss-cap">${esc(t.exNums)}</div>
    <div class="ss-acts"><button class="chip" data-act="fixr">${esc(SB.fixed ? t.undo : t.fixRange)}</button></div><p class="ss-note">${esc(t.secBText)}</p>`;
}

// --- events ------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < -10 || r.top > innerHeight * 0.55) $('stage').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
};
function stepSel(M, dir) {
  const a = M.sel, e = M.edit[a], c = M.cells[a]; if (!e || !c || c.f) return;
  setValue(M, a, c.v + dir * e[2]); sfx.tick();
}
document.addEventListener('pointerdown', (ev) => {
  const h = ev.target.closest('.ss-fh'); if (!h) return;
  ev.preventDefault(); copyDown();
});
$('ssRoot').addEventListener('click', (ev) => {
  if (ev.target.closest('.ss-fh')) return;
  const b = ev.target.closest('[data-act]');
  if (b && !b.disabled) {
    const act = b.dataset.act;
    if (act === 'reveal') revealTrip();
    else if (act === 'dec' || act === 'inc') stepSel(lab.view === 'trip' ? TR : CP, act === 'inc' ? 1 : -1);
    else if (act === 'over') {
      sfx.snap();
      if (TR.cells.D8.over) changeFormula(TR, 'D8', () => { TR.cells.D8 = TR.saved; TR.saved = null; });
      else changeFormula(TR, 'D8', () => { TR.saved = TR.cells.D8; TR.cells.D8 = { v: 150, over: true }; });
      TR.sel = 'D8'; TR.paint();
    } else if (act === 'again') { sfx.click(); resetTrip(); }
    else if (act === 'pick') pickCopy(+b.dataset.i);
    else if (act === 'mode') useFormula(b.dataset.m);
    else if (act === 'copy') copyDown();
    else if (act === 'fshow') { CP.fshow = !CP.fshow; sfx.click(); paintCopy(); }
    else if (act === 'set') { CH.sel = +b.dataset.i; sfx.tick(); cancelAnimationFrame(CH.raf); paintChart(); }
    else if (act === 'type') pickChartType(b.dataset.k);
    else if (act === 'qty') { const i = +b.dataset.i; VC.qty[i] = VC.qty[i] % 9 + 1; VC.flash = i; sfx.tick(); paintSecA(); }
    else if (act === 'fixr') { SB.fixed = !SB.fixed; sfx.snap(); paintSecB(); }
    return;
  }
  const cellEl = ev.target.closest('.ss-c[data-a]');
  if (cellEl) {
    const a = cellEl.dataset.a, v = lab.view;
    if (v === 'trip') {
      TR.sel = a; sfx.tick();
      if (TR.phase === 'predict' && TR.cells[a]) { if (TR.marks.has(a)) TR.marks.delete(a); else TR.marks.add(a); }
      TR.paint();
    } else if (v === 'copy') { CP.sel = a; sfx.tick(); CP.paint(); }
  }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; sfx.click(); render();
});
addEventListener('resize', () => { if (lab.view === 'copy' && !S.sec) redrawCopyArrows(); });

// --- one render per change -----------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = v;
  show($('ssV1'), v === 'trip' && !S.sec); show($('ssV2'), v === 'copy' && !S.sec); show($('ssV3'), v === 'chart' && !S.sec);
  show($('ssSA'), S.sec === 'a'); show($('ssSB'), S.sec === 'b');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('ssSecRow').innerHTML = sc('a', '🧮') + sc('b', '⚠️');
  // readouts first: they must follow the view even when the picture is hidden
  if (v === 'trip') paintTrip(); else if (v === 'copy') paintCopy(); else paintChart();
  if (S.sec === 'a') paintSecA(); else if (S.sec === 'b') paintSecB();
  if (S.sec) lab.setState({ emo: S.sec === 'a' ? '🧮' : '⚠️', title: t.secrets[S.sec][0], lead: t.secrets[S.sec][1], body: '' });
  else lab.setState({ ...t.state[v], extra: '' });
  lab.setFacts(t.facts[v]);
}
render();
</script>
</body>
