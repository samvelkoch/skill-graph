  [[44, 100, S.dEng[0] / 25, sh0 / 25, '#e0b050', `${Math.round(S.dEng[0])}%`, t.eg.share], [196, 100, S.dEng[1] / 400, f0 / 400, '#6fb36f', fmt(S.dEng[1]), t.eg.coins]].forEach(([x, w, v, v0, col, lbl, cap]) => {
    c.save(); c.globalAlpha = 1; rr(c, x, top, w, H, 14); c.fillStyle = 'rgba(8,10,18,.55)'; c.fill(); c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 1.2; c.stroke();
    const bh = clamp(v, 0, 1) * (H - 6); c.save(); rr(c, x, top, w, H, 14); c.clip();
    c.fillStyle = lg(c, x, 0, x + w, 0, [[0, shade(col, .3)], [.5, col], [1, shade(col, -.3)]]); c.fillRect(x, base - 3 - bh, w, bh + 3);
    c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(x + 8, base - 3 - bh, 6, bh); c.restore();
    c.setLineDash([5, 4]); c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.4; const y0 = base - 3 - clamp(v0, 0, 1) * (H - 6); c.beginPath(); c.moveTo(x - 6, y0); c.lineTo(x + w + 6, y0); c.stroke(); c.setLineDash([]); c.restore();
    txt(c, t.eg.at600, x + w / 2, y0 - 12, { size: 12, weight: 700, color: '#cfd6ea', pill: true });
    txt(c, lbl, x + w / 2, clamp(base - 3 - bh - 14, top + 16, base - 20), { pill: true, size: 14, weight: 900 });
    txt(c, cap, x + w / 2, base + 22, { size: 12, color: '#d3d9e8' });
  });
  txt(c, '🍞', 94, 52, { size: 22, weight: 500 }); txt(c, '🛒', 246, 52, { size: 22, weight: 500 });
}

// --- frame -------------------------------------------------------------------------------------------------
function step(dt) {
  S.clock += dt;
  const run = S.phase === 'run1' ? 'p1' : S.phase === 'run2' ? 'p2' : null;
  if (!run || S.sec) return;
  const prev = S[run]; S[run] = Math.min(12, S[run] + dt / .5);
  if (run === 'p1') EVENTS.forEach((e, i) => { if (prev < e.m && S.p1 >= e.m) { S.flipT[i] = S.clock; (e.amt < 0 ? sfx.bad : sfx.good)(); } });
  if (S[run] >= 12) { S.phase = run === 'p1' ? 'done1' : 'done2'; render(); } else yearReadout();
}
canvasLoop(cv, (c, w, h, dt, time) => {
  const v = S.sec || lab.view, B = BOX[v], sc = Math.min(w / B.W, h / B.H);
  G = { W: B.W, H: B.H, sc, ox: (w - B.W * sc) / 2, oy: (h - B.H * sc) / 2, time };
  c.save(); c.translate(G.ox, G.oy); c.scale(sc, sc);
  step(dt); panel(c);
  ({ split: drawSplit, year: drawYear, sort: drawSort, cush: drawCush, engel: drawEngel })[v](c, dt, time);
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'rFood') S.food = v; else if (id === 'rWants') S.wants = v;
  else if (id === 'rGuess') S.guess = v; else if (id === 'rSave') S.secSave = v; else if (id === 'rInc') S.income = v;
  else return;
  if (id === 'rFood' || id === 'rWants') sfx.tick();
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], #yMain, #sMain'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'pf') { S.pf = !S.pf; S.fillT = 0; sfx.click(); }
  else if (act === 'payday') { S.fillT = 0; S.disp = [0, 0, 0]; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  } else if (b.id === 'yMain') {
    if (S.phase === 'predict' && S.guess !== null) { S.phase = 'run1'; S.p1 = 0; S.flipT = [-1, -1, -1]; sfx.click(); }
    else if (S.phase === 'done1') { S.phase = 'run2'; S.p2 = 0; sfx.click(); }
    else if (S.phase === 'done2') { S.phase = 'predict'; S.guess = null; S.p1 = S.p2 = 0; S.flipT = [-1, -1, -1]; sfx.click(); }
  } else if (b.id === 'sMain') {
    if (!S.checked) checkSort();
    else if (Object.values(S.res).every(Boolean)) { S.place = {}; S.seq = []; S.checked = false; S.res = {}; S.focus = null; S.sel = null; sfx.click(); }
    else { CARDS.forEach((_, i) => { if (!S.res[i]) unplace(i); }); S.checked = false; S.res = {}; S.focus = null; sfx.click(); }
  }
  render();
});
function showStage() {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
$('ctrlBody').addEventListener('click', (ev) => { if (ev.target.closest('#yMain')) showStage(); });

// --- one render per change: controls, readout and the state card ----------------------------------------------------
function setRange(id, v, min, max) { const e = $(id); if (min !== undefined) { e.min = min; e.max = max; } if (+e.value !== v) e.value = v; }
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, m = model(), vw = sec || v;
  document.body.dataset.v = vw; cv.style.touchAction = vw === 'sort' ? 'none' : '';
  const show = { secSplit: vw === 'split', secYear: vw === 'year', secSort: vw === 'sort', secCush: vw === 'cush', secEngel: vw === 'engel' };
  Object.entries(show).forEach(([k, on]) => { $(k).style.display = on ? '' : 'none'; });
  lab.setFacts(t.facts[v]);
  const open = secret.unlocked(), chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = chip('cush', '🛟') + chip('engel', '📉');
  const pct = (x) => Math.round(x / INCOME * 100);
  if (sec === 'cush') {
    lab.setGlow('rgba(111, 179, 111, .24)');
    const t3 = 3 * m.needs, mo = Math.ceil(t3 / S.secSave), mo6 = Math.ceil(6 * m.needs / S.secSave);
    $('lSave').textContent = t.cu.lbl; $('vSave').textContent = t.u(S.secSave); setRange('rSave', S.secSave);
    lab.setReadout(mo, t.cu.pillSub, '', '#6fb36f');
    lab.setState({ emo: '🛟', title: t.cu.t(t.mo(mo)), lead: t.cu.l(fmt(t3), fmt(m.needs), fmt(S.secSave)), body: t.cu.b(t.mo(mo6)), extra: '' });
    return;
  }
  if (sec === 'engel') {
    lab.setGlow('rgba(224, 176, 80, .24)');
    const f = engelFood(S.income), sh = Math.round(f / S.income * 100);
    $('lInc').textContent = t.eg.lbl; $('vInc').textContent = fmt(S.income); setRange('rInc', S.income);
    lab.setReadout(fmt(f), t.eg.sub, `${sh}%`, '#e0b050');
    lab.setState({ emo: '📉', title: t.eg.t(sh), lead: t.eg.l(t.u(f), t.u(S.income)), body: t.eg.b, extra: '' });
    return;
  }
  if (v === 'split') {
    lab.setGlow('rgba(95, 143, 208, .26)');
    $('lFood').textContent = t.sp.food; $('vFood').textContent = t.u(m.food); $('eCook').textContent = t.sp.cook; $('eOut').textContent = t.sp.out;
    $('lWants').textContent = t.sp.wants; $('vWants').textContent = t.u(m.w); setRange('rFood', S.food); setRange('rWants', m.w, 0, m.free);
    $('bPf').textContent = `${S.pf ? '✓ ' : ''}🐷 ${t.sp.pf}`; $('bPf').classList.toggle('on', S.pf); $('bPf').setAttribute('aria-pressed', S.pf); $('bPay').textContent = t.sp.payday;
    lab.setReadout(fmt(m.sav), t.sp.sub, `${pct(m.needs)} / ${pct(m.w + m.leak)} / ${pct(m.sav)} %`, '#6fb36f');
    const st = m.sav === 0 ? [t.sp.zeroT, S.pf ? t.sp.zeroOn : t.sp.zeroOff, '🫙'] : S.pf ? [t.sp.onT, t.sp.onL, '🐷'] : [t.sp.offT, t.sp.offL(m.leak, fmt(m.sav)), '🫙'];
    lab.setState({ emo: st[2], title: st[0], lead: st[1], body: t.sp.body(pct(m.needs), pct(m.w + m.leak), pct(m.sav)), extra: '' });
  } else if (v === 'year') {
    lab.setGlow('rgba(111, 208, 140, .22)');
    const { ymin, ymax } = yearRange(), ph = S.phase, s = m.sav, b1 = series(s), b0 = series(0), y = t.yr;
    if (S.guess !== null) S.guess = clamp(S.guess, ymin, ymax);
    setRange('rGuess', S.guess ?? 0, ymin, ymax);
    $('yPlan').textContent = y.plan(t.u(s)); $('lGuess').textContent = y.guessLbl; $('vGuess').textContent = S.guess === null ? '?' : t.u(S.guess); $('yHint').textContent = y.hint;
    $('yGuess').style.display = ph === 'predict' ? '' : 'none';
    const btn = $('yMain'); btn.textContent = ph === 'predict' ? y.run : ph === 'done1' ? y.zero : ph === 'done2' ? y.again : y.wait; btn.disabled = ph === 'run1' || ph === 'run2' || (ph === 'predict' && S.guess === null);
    yearReadout();
    if (ph === 'predict') lab.setState({ emo: '🤔', title: S.guess === null ? y.q0[0] : y.guess(t.u(S.guess)), lead: S.guess === null ? y.q0[1] : y.run.replace('▶ ', ''), body: y.bodyPlan, extra: '' });
    else if (ph === 'run1' || ph === 'run2') lab.setState({ emo: '⏳', title: y.running[0], lead: y.running[1], body: '', extra: '' });
    else if (ph === 'done1') {
      const end = b1[12], g = S.guess ?? 0, same = (end >= 0) === (g >= 0), verdict = same && Math.abs(end - g) <= 500 ? 0 : same ? 1 : 2, low = Math.min(...b1);
      lab.setState({ emo: verdict === 2 ? '🤔' : '✅', title: y.v[verdict], lead: y.done1(t.u(end), t.u(g)), body: low >= 0 ? y.ok : y.low(t.u(low)), extra: '' });
    } else lab.setState({ emo: '🧊', title: y.t2, lead: y.l2(t.u(-b0[3]), t.u(-b0[12])), body: y.b2(t.u(b1[12]), t.u(b0[12])), extra: '' });
  } else {
    lab.setGlow('rgba(224, 176, 80, .22)');
    const placed = Object.keys(S.place).length, k = Object.values(S.res).filter(Boolean).length, so = t.so;
    const btn = $('sMain'); btn.textContent = !S.checked ? so.check : k === 10 ? so.again : so.retry; btn.disabled = !S.checked && placed < 10;
    lab.setReadout(`${S.checked ? k : placed}/10`, S.checked ? '' : so.readSub, '', '#e0b050');
    if (!S.checked) lab.setState({ emo: '🧾', title: so.fixed + ' · ' + so.variable, lead: so.help, body: '', extra: '' });
    else if (S.focus !== null) lab.setState({ emo: CARDS[S.focus].emo, title: so.cards[S.focus], lead: so.why[S.focus], body: S.res[S.focus] ? '✓' : '✗', extra: '' });
    else lab.setState(k === 10 ? { emo: '✅', title: so.right, lead: so.rightL, body: so.tapWhy, extra: '' } : { emo: '🤔', title: so.some(k), lead: so.someL, body: '', extra: '' });
  }
}
render();
