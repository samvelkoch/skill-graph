}

function sceneLock(c, w, h, dt, time) {
  const t = T[lang], lw = Math.min(w - 40, 320), lh = lw * .46, lx = (w - lw) / 2, ly = 64, cx = w / 2, r = lw * .22;
  c.lineCap = 'round'; c.lineJoin = 'round';
  // shackle
  c.beginPath(); c.moveTo(cx - r, ly + 8); c.lineTo(cx - r, ly - r * .7); c.arc(cx, ly - r * .7, r, Math.PI, TAU); c.lineTo(cx + r, ly + 8);
  c.strokeStyle = '#2a3150'; c.lineWidth = 16; c.stroke();
  const sg = c.createLinearGradient(cx - r, 0, cx + r, 0); sg.addColorStop(0, '#f2f5ff'); sg.addColorStop(.5, '#b6bfd8'); sg.addColorStop(1, '#7e89aa');
  c.strokeStyle = sg; c.lineWidth = 10; c.stroke();
  // body
  c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, lx + 4, ly + 8, lw, lh, 22); c.fill();
  const bg = c.createLinearGradient(lx, ly, lx + lw * .3, ly + lh); bg.addColorStop(0, '#e4e9f7'); bg.addColorStop(.5, '#a9b3d0'); bg.addColorStop(1, '#6f7a9b');
  c.fillStyle = bg; rr(c, lx, ly, lw, lh, 22); c.fill(); c.lineWidth = 2; c.strokeStyle = '#2a3150'; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1.5; rr(c, lx + 3, ly + 3, lw - 6, lh - 6, 19); c.stroke();
  const ww = lw * .22, wh = lh * .66, gap = (lw * .84 - 3 * ww) / 2, wy = ly + (lh - wh) / 2;
  LK.hit = [];
  for (let i = 0; i < 3; i++) {
    const wx = lx + lw * .08 + i * (ww + gap), p = lkPos(i, time), fl = Math.floor(p), fr = p - fl, rowH = wh * .6;
    LK.hit.push({ x: wx, y: wy, w: ww, h: wh });
    c.fillStyle = '#12162a'; rr(c, wx - 4, wy - 4, ww + 8, wh + 8, 12); c.fill();
    c.save(); rr(c, wx, wy, ww, wh, 9); c.clip();
    const dg = c.createLinearGradient(0, wy, 0, wy + wh); dg.addColorStop(0, '#d9ceb4'); dg.addColorStop(.5, '#fffaf0'); dg.addColorStop(1, '#d9ceb4');
    c.fillStyle = dg; c.fillRect(wx, wy, ww, wh);
    c.fillStyle = '#2a2233'; c.font = `900 ${Math.round(wh * .5)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    for (let q = -2; q <= 2; q++) c.fillText(String(mod(fl + q, 10)), wx + ww / 2, wy + wh / 2 + (q - fr) * rowH + 2);
    const sh = c.createLinearGradient(0, wy, 0, wy + wh); sh.addColorStop(0, 'rgba(20,15,30,.55)'); sh.addColorStop(.3, 'rgba(20,15,30,0)'); sh.addColorStop(.7, 'rgba(20,15,30,0)'); sh.addColorStop(1, 'rgba(20,15,30,.55)');
    c.fillStyle = sh; c.fillRect(wx, wy, ww, wh);
    c.restore();
    c.lineWidth = 2; c.strokeStyle = '#3b4363'; rr(c, wx, wy, ww, wh, 9); c.stroke();
    c.fillStyle = '#ffd35a'; c.beginPath(); c.moveTo(wx + ww / 2 - 5, wy - 10); c.lineTo(wx + ww / 2 + 5, wy - 10); c.lineTo(wx + ww / 2, wy - 3); c.closePath(); c.fill();
  }
  const digs = LK.w.map((q) => mod(Math.round(q.to), 10));
  pill(c, `${t.sc.code}: ${digs.join(' ')}`, cx, ly + lh + 26, { size: 14 });
  // the tree is far too big to draw: a fan of ten branches, then multiplication
  const ry = ly + lh + 62, cy = ry + 56;
  c.lineWidth = 2.5;
  for (let i = 0; i < 10; i++) {
    const x = w * .1 + (w * .8) * (i / 9);
    c.strokeStyle = 'rgba(200,170,120,.8)'; c.beginPath(); c.moveTo(cx, ry); c.lineTo(x, cy); c.stroke();
    c.fillStyle = '#c9965a'; c.beginPath(); c.arc(x, cy, 4, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,.55)';
    for (let q = 1; q <= 3; q++) { c.beginPath(); c.arc(x, cy + q * 6 + 3, 1.6, 0, TAU); c.fill(); }
  }
  c.fillStyle = '#c9965a'; c.beginPath(); c.arc(cx, ry, 7, 0, TAU); c.fill(); c.strokeStyle = '#4a2f14'; c.lineWidth = 1.5; c.stroke();
  pill(c, '10', cx, ry + 24, { size: 13 });
  pill(c, '× 10 × 10', cx, cy + 36, { size: 13 });
  pill(c, '10 × 10 × 10 = 1000', cx, h - 22, { size: 14, bg: 'rgba(120,80,0,.9)' });
}

$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (S.sec === 'lock') { const i = (LK.hit || []).findIndex((q) => x >= q.x - 6 && x <= q.x + q.w + 6 && y >= q.y - 6 && y <= q.y + q.h + 6); if (i >= 0) lkTap(i); return; }
  if (S.sec) return;
  if (lab.view === 'towers' && TWH) {
    const { x: bx, y: by, s, f } = TWH;
    if (x < bx - s / 2 - 8 || x > bx + s * 1.3 + 8 || y > by + 2 || y < by - f * s - 6) return;
    const i = clamp(Math.floor((by - y) / s), 0, f - 1);
    TW.cur[i] = 1 - TW.cur[i]; TW.flip[i] = nowS(); sfx.click(); render();
  } else if (lab.view === 'outfits' && !OF.revealed) {
    const hit = OFH.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
    if (!hit) return;
    if (hit.k === 's') OF.selS = hit.i; else OF.selP = hit.i;
    OF.bounceAt = nowS(); sfx.tick();
  }
});

// --- controls ------------------------------------------------------------------------------------------------
const stepper = (lbl, val, act, lo, hi) => `<div class="al-st"><span class="lbl">${esc(lbl)}</span><button class="al-sb" data-act="${act}" data-s="-1" aria-label="−"${val <= lo ? ' disabled' : ''}>−</button><b>${val}</b><button class="al-sb" data-act="${act}" data-s="1" aria-label="+"${val >= hi ? ' disabled' : ''}>+</button></div>`;
const btn = (label, act, o = {}) => `<button class="al-b ${o.main ? 'main' : ''}" data-act="${act}"${o.dis ? ' disabled' : ''}>${esc(label)}</button>`;
function optsHtml(list, pick, rightIdx, act) {
  return `<div class="al-opts">${list.map((o, i) => `<button class="al-opt ${pick !== null ? (i === rightIdx ? 'ok' : i === pick ? 'bad' : '') : ''}" data-act="${act}" data-i="${i}"${pick !== null ? ' disabled' : ''}>${o.html ?? o}</button>`).join('')}</div>`;
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i, s = +b.dataset.s;
  if (a === 'fl') { TW.f = clamp(TW.f + s, 2, 4); TW.guess = clamp(TW.guess, 1, 20); twReset(); sfx.tick(); }
  else if (a === 'gs') { TW.guess = clamp(TW.guess + s, 1, 20); sfx.tick(); }
  else if (a === 'lock') { TW.locked = true; TW.cur = Array(TW.f).fill(0); sfx.click(); showStage(); }
  else if (a === 'add') {
    const code = TW.cur.join('');
    if (TW.shelf.some((q) => q.code === code)) { TW.dupAt = nowS(); sfx.bad(); }
    else {
      const idx = TW.shelf.length, from = TWH ? { x: TWH.x, y: TWH.y, s: TWH.s } : undefined;
      TW.shelf.push({ code, col: idx % 8, row: Math.floor(idx / 8), born: nowS(), from }); sfx.snap();
      if (TW.shelf.length >= twTotal()) { TW.done = true; TW.sortAt = nowS() + .5; sfx.good(); showStage(); }
    }
  }
  else if (a === 'all') { TW.done = true; TW.sortAt = nowS(); sfx.good(); showStage(); }
  else if (a === 'again') { twReset(); sfx.click(); }
  else if (a === 'om' || a === 'on') { const k = a === 'om' ? 'm' : 'n'; OF[k] = clamp(OF[k] + s, 2, 4); OF.selS = Math.min(OF.selS, OF.m - 1); OF.selP = Math.min(OF.selP, OF.n - 1); ofReset(); sfx.tick(); }
  else if (a === 'oopt') { if (OF.guess !== null) return; OF.guess = OF.opts[i]; OF.revealed = true; OF.t0 = nowS(); (OF.guess === OF.m * OF.n ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'tadd') { TR.asking = true; TR.pick = null; TR.opts = growOpts(); TR.verdict = null; sfx.click(); }
  else if (a === 'topt') {
    const L = 2 ** TR.d, g = TR.opts[i], ok = g === L * 2;
    TR.verdict = { ok, g, old: L, nw: L * 2 }; TR.pick = i; TR.prevD = TR.d; TR.d++; TR.growAt = nowS(); TR.asking = false; (ok ? sfx.good : sfx.bad)(); showStage();
  }
  else if (a === 'tcancel') { TR.asking = false; TR.cPick = null; TR.chance = false; sfx.click(); }
  else if (a === 'treset') { treeReset(); sfx.click(); }
  else if (a === 'tchance') { TR.chance = !TR.chance; TR.cPick = null; TR.asking = false; if (TR.chance) TR.cOpts = chanceOpts(); sfx.click(); }
  else if (a === 'copt') { TR.cPick = i; (TR.cOpts[i].d === 2 ** TR.d ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'spin') lkSpin();
  else if (a === 'replay') { startThree(); sfx.click(); }
  else if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k;
    if (S.sec === 'three') startThree();
    if (S.sec === 'lock') lkSpin();
    sfx.click(); if (S.sec) showStage();
  }
  render();
});

// --- one render per change ------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = S.sec ? 'sec-' + S.sec : v;
  let html = '', st, ro;
  if (S.sec === 'three') {
    html = `<div class="row2" style="margin-top:0">${btn(t.sc.replay, 'replay')}</div>`;
    lab.setGlow('rgba(34,165,91,.24)'); ro = ['3 × 3 × 3 = 27', t.sc.towers, '', '#22a55b'];
    st = { emo: '🎨', title: t.sc.threeT, lead: t.sc.threeL, body: t.sc.threeB };
  } else if (S.sec === 'lock') {
    html = `<div class="row2" style="margin-top:0">${btn(t.sc.spin, 'spin', { main: true })}</div>`;
    lab.setGlow('rgba(160,175,220,.26)'); ro = ['10 × 10 × 10 = 1000', t.sc.codes, '', '#a9b3d0'];
    st = { emo: '🔐', title: t.sc.lockT, lead: t.sc.lockL, body: t.sc.lockB };
  } else if (v === 'towers') [html, st, ro] = renderTowers(t);
  else if (v === 'outfits') [html, st, ro] = renderOutfits(t);
  else [html, st, ro] = renderTree(t);
  $('vc').innerHTML = html;
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('three', '🎨') + sc('lock', '🔐');
  lab.setReadout(ro[0], ro[1], ro[2], ro[3]);
  lab.setState({ ...st, extra: '' });
  lab.setFacts(t.facts[v] || []);
}

function renderTowers(t) {
  const w = t.tw, N = twTotal(), k = TW.shelf.length;
  lab.setGlow('rgba(229,72,77,.22)');
  const floors = `<div class="row2" style="margin-top:0">${stepper(t.floors, TW.f, 'fl', 2, 4)}</div>`;
  let html = floors, st, ro;
  if (!TW.locked) {
    html += `<div class="al-q">${esc(w.askQ(TW.f))}</div><div class="row2" style="margin-top:0">${stepper(w.guess, TW.guess, 'gs', 1, 20)}${btn(w.lock, 'lock', { main: true })}</div>`;
    st = { emo: '🤔', title: w.askT, lead: w.askL, body: '' }; ro = ['?', '', '', '#e5484d'];
  } else if (!TW.done) {
    html += `<div class="row2">${btn(w.add, 'add', { main: true })}${btn(w.all, 'all', { dis: !k })}${btn(w.again, 'again')}</div>`;
    st = { emo: '🧱', title: w.buildT, lead: w.buildL, body: w.buildB(k) }; ro = [String(k), w.shelf, '', '#e5484d'];
  } else {
    html += `<div class="row2">${btn(w.again, 'again', { main: true })}</div>`;
    const ok = TW.guess === N;
    st = { emo: ok ? '✅' : '🤔', title: ok ? w.ok : w.no(TW.guess, N), lead: w.found(k, N), body: `${w.mult(2, TW.f, N)} ${w.order}` };
    ro = [String(k), w.shelf, `${prodStr(2, TW.f)} = ${N}`, '#e5484d'];
  }
  return [html, st, ro];
}

function renderOutfits(t) {
  const o = t.of, { m, n } = OF, p = m * n;
  lab.setGlow('rgba(160,110,210,.26)');
  let html = `<div class="row2" style="margin-top:0">${stepper(o.shirts, m, 'om', 2, 4)}${stepper(o.shorts, n, 'on', 2, 4)}</div>`;
  html += `<div class="al-q">${esc(o.askQ(m, n))}</div>${optsHtml(OF.opts, OF.guess === null ? null : OF.opts.indexOf(OF.guess), OF.opts.indexOf(p), 'oopt')}`;
  let st, ro;
  if (!OF.revealed) { st = { emo: '🤔', title: o.askT, lead: o.askL, body: '' }; ro = ['?', o.sub(m, n), '', '#a06ed2']; }
  else {
    const g = OF.guess, ok = g === p;
    st = { emo: ok ? '✅' : '🤔', title: ok ? o.ok : o.no(g), lead: ok ? o.okL(m, n, p) : g === m + n ? o.sumL(m, n) : o.othL(m, n), body: ok ? o.body : `${m} × ${n} = ${p}. ${o.body}` };
    ro = [`${m} × ${n} = ${p}`, o.unit, '', '#a06ed2'];
  }
  return [html, st, ro];
}

function renderTree(t) {
  const r = t.tr, d = TR.d, L = 2 ** d;
  lab.setGlow('rgba(34,165,91,.22)');
  const maxed = d >= 4;
  let html = '', st;
  const chip = `<button class="chip ${TR.chance ? 'on' : ''}" data-act="tchance"${d < 2 ? ' disabled style="opacity:.4"' : ''}>🪙 ${esc(r.chance)}</button>`;
  if (TR.asking) {
    html = `<div class="al-q">${esc(r.askQ)}</div>${optsHtml(TR.opts, null, -1, 'topt')}<div class="row2">${btn(r.cancel, 'tcancel')}</div>`;
    st = { emo: '🤔', title: r.askT, lead: r.askQ, body: '' };
  } else if (TR.chance) {
    const right = TR.cOpts.findIndex((q) => q.d === L);
    html = `<div class="al-q">${esc(r.cQ)}</div>${optsHtml(TR.cOpts.map((q) => ({ html: frac(q.n, q.d) })), TR.cPick, right, 'copt')}<div class="row2">${chip}${btn(r.reset, 'treset')}</div>`;
    st = TR.cPick === null ? { emo: '🪙', title: r.cT, lead: r.cQ, body: '' }
      : TR.cOpts[TR.cPick].d === L ? { emo: '✅', title: r.ok, lead: r.cOk(L), body: '' } : { emo: '🤔', title: r.cNo(`1/${TR.cOpts[TR.cPick].d}`, L), lead: r.cOk(L), body: '' };
  } else {
    html = `<div class="row2" style="margin-top:0">${btn(r.add, 'tadd', { main: true, dis: maxed })}${chip}${btn(r.reset, 'treset')}</div>`;
    if (TR.verdict) { const v = TR.verdict; st = v.ok ? { emo: '✅', title: r.ok, lead: r.okL(prodStr(2, d), L), body: maxed ? r.max : '' } : { emo: '🤔', title: r.no(v.g, v.old, v.nw), lead: r.okL(prodStr(2, d), L), body: maxed ? r.max : '' }; }
    else st = { emo: '🌳', title: r.addT, lead: r.startL, body: '' };
  }
  const ro = TR.chance && TR.cPick !== null ? [`1 / ${L}`, r.cSub, '', '#22a55b'] : [d === 1 ? '2' : `${prodStr(2, d)} = ${L}`, r.leaves, '', '#22a55b'];
  return [html, st, ro];
}
render();
</script>
</body>
</html>
