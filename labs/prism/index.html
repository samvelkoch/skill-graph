  const d = D[k];
  if (k === 'rect') return [[0, 0], [d.w, 0], [d.w, d.h], [0, d.h]];

  if (k === 'trap') return [[0, 0], [d.a, 0], [(d.a + d.b) / 2, d.h], [(d.a - d.b) / 2, d.h]];
  if (k === 'L') return [[0, 0], [d.W, 0], [d.W, d.bh], [d.aw, d.bh], [d.aw, d.H], [0, d.H]];
  return [0, 1, 2, 3, 4, 5].map((i) => [d.s * Math.cos(i * Math.PI / 3), d.s * Math.sin(i * Math.PI / 3)]);

  const a = area2(P); let cx = 0, cy = 0;
  P.forEach(([x, y], i) => { const [x2, y2] = P[(i + 1) % P.length], f = x * y2 - x2 * y; cx += (x + x2) * f; cy += (y + y2) * f; });
  return [cx / (3 * a), cy / (3 * a)];

// n slabs of thickness `th` (in cm) behind each other, the front face in the plane of the picture. polys are in cm (y up).
// g = gap between slabs (fanned out), lean = sideways slide of every slab in cm. Returns the pixel geometry for labels.
function drawStack(c, reg, polys, n, g, lean, st, dt, o = {}) {
  const [kx, ky] = o.k ?? [EX, EY], th = o.thick ?? 1, col = o.color ?? GOLD;
  const bb = bbox(polys), pw = bb.x1 - bb.x0, ph = bb.y1 - bb.y0, ext = (n - 1) * (1 + g) + 1;
  const wcm = pw + kx * th * ext + lean * (n - 1), hcm = ph + ky * th * ext;
  const tgt = Math.min(reg.w * 0.78 / wcm, reg.h * 0.74 / hcm, o.max ?? 44);
  st.s = st.s ? st.s + (tgt - st.s) * Math.min(1, dt * 9) : tgt;
  const s = st.s, ox = reg.x + (reg.w - wcm * s) / 2 - bb.x0 * s, oy = reg.y + (reg.h + hcm * s) / 2 + bb.y0 * s;
  const px = polys.map((p) => p.map(([x, y]) => [ox + x * s, oy - y * s]));
  const ex = kx * th * s, ey = -ky * th * s;
  // a soft pool of light behind the object
  const gcx = reg.x + reg.w / 2, gcy = reg.y + reg.h / 2, gr0 = c.createRadialGradient(gcx, gcy, 4, gcx, gcy, Math.max(30, Math.max(wcm, hcm) * s * 0.75));
  gr0.addColorStop(0, 'rgba(255,214,120,.14)'); gr0.addColorStop(1, 'rgba(255,214,120,0)');
  c.fillStyle = gr0; c.fillRect(reg.x, reg.y, reg.w, reg.h);
  c.lineJoin = 'round';
  for (let k = n - 1; k >= 0; k--) {
    const dx = k * ((1 + g) * ex + lean * s), dy = k * (1 + g) * ey, tone = n > 1 ? (k % 2 ? 0.95 : 1.02) : 1;
    for (const P of px) { // the faces on the sides that look at us: top and right
      const sa = area2(P);
      for (let i = 0; i < P.length; i++) {
        const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % P.length], ddx = x2 - x1, ddy = y2 - y1;
        const nX = sa > 0 ? ddy : -ddy, nY = sa > 0 ? -ddx : ddx, nl = Math.hypot(nX, nY);
        if (nl < 1e-6 || nX * ex + nY * ey <= 0) continue;
        const lt = (-0.5 * nX - 0.87 * nY) / nl; // light from the top left
        const a = [x1 + dx, y1 + dy], b = [x2 + dx, y2 + dy];
        c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.lineTo(b[0] + ex, b[1] + ey); c.lineTo(a[0] + ex, a[1] + ey); c.closePath();
        c.fillStyle = shade(col, (0.7 + 0.26 * lt) * tone); c.fill();
        c.lineWidth = 1; c.strokeStyle = 'rgba(30,18,4,.5)'; c.stroke();
      }
    }
    for (const P of px) { // the front face of the slab
      const xs = P.map((p) => p[0] + dx), ys = P.map((p) => p[1] + dy);
      const gr = c.createLinearGradient(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys));
      gr.addColorStop(0, shade(col, 1.2 * tone)); gr.addColorStop(1, shade(col, 0.9 * tone));
      c.beginPath(); P.forEach(([X, Y], i) => (i ? c.lineTo(X + dx, Y + dy) : c.moveTo(X + dx, Y + dy))); c.closePath();
      c.fillStyle = gr; c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(30,18,4,.65)'; c.stroke();
      c.beginPath(); P.forEach(([X, Y], i) => (i ? c.lineTo(X + dx, Y + dy) : c.moveTo(X + dx, Y + dy))); c.closePath();
      c.lineWidth = 1; c.strokeStyle = 'rgba(255,255,255,.16)'; c.stroke();
    }
  }
  const back = [(n - 1) * ((1 + g) * ex + lean * s) + ex, (n - 1) * (1 + g) * ey + ey];
  return { px, s, ox, oy, bb, back, ex, ey, bx: ox + bb.x1 * s, by: oy - bb.y0 * s };
}

  lab.setReadout(`V ${eq(V)} ${nx(V)} ${t.u.cm3}`, `${honey ? form : nx(A)} ${t.u.cm2} × ${num(S.L)} ${t.u.cm}`, s.slices(S.L), '#f0c24a');
  let st;
  if (S.sec === 'lean') st = { emo: '🪙', title: s.leanT, lead: s.leanLead(S.L, AREA[S.sh], V), body: s.leanBody };
  else if (honey) st = { emo: '🐝', title: s.honeyT, lead: s.honeyLead(AREA.hex, S.L, V), body: s.honeyBody };
  else st = { emo: '🔪', title: s.title(t.shapes[S.sh]), lead: s.lead(S.L, A, V), body: s.body };
  lab.setState({ ...st, extra: formula(S.sh) && !S.sec ? `<div class="fine">${esc(t.sym)} = ${esc(formula(S.sh))} ${eq(A)} ${nx(A)} ${esc(t.u.cm2)}</div>` : '' });
}
function rBase(t) {
  const ba = t.ba;
  lab.setGlow('rgba(79, 209, 193, .2)');
  $('bPred').hidden = S.p2d; $('bFree').hidden = !S.p2d;
  if (!S.p2d) {
    $('bQ').textContent = ba.q; $('bOpts').innerHTML = opts(ba.opts, 'p2', S.p2);
    $('bCheck').textContent = t.check; $('bCheck').disabled = S.p2 === null; lab.setFacts([]);
  } else {
    $('bKinds').innerHTML = ['tri', 'trap', 'para'].map((k) => `<button class="chip${S.bs.kind === k ? ' on' : ''}" data-act="kind" data-k="${k}">${esc(t.shapes[k])}</button>`).join('') + `<button class="chip" data-act="reset">${esc(ba.reset)}</button>`;
    $('bHint').textContent = ba.hint; lab.setFacts([t.facts.cav]);
  }
  baseInfo(t);
}
function rReal(t) {
  const re = t.re, pool = S.obj === 'pool';
  lab.setGlow('rgba(61, 158, 224, .22)');
  $('rObjs').innerHTML = ['pool', 'tent', 'bar'].map((k) => `<button class="chip${S.obj === k ? ' on' : ''}" data-act="obj" data-k="${k}">${esc(re[k])}</button>`).join('');
  const askPool = pool && !S.p3d;
  $('rPred').hidden = !askPool;
  if (askPool) { $('rQ').textContent = re.q(POOL.flow); $('rOpts').innerHTML = opts(PRED_H.map((n) => `${num(n)} ${re.hours}`), 'p3', S.p3); $('rCheck').textContent = t.check; $('rCheck').disabled = S.p3 === null; }
  $('rDeepRow').hidden = !(pool && S.p3d); $('rTentRow').hidden = S.obj !== 'tent'; $('rBarRow').hidden = S.obj !== 'bar';
  $('rDeepL').textContent = re.deep; $('rDeepO').textContent = `${num(S.deep, 1)} ${t.u.m}`; $('rDeep').value = S.deep;
  $('rTentL').textContent = re.tH; $('rTentO').textContent = `${num(S.tentH, 1)} ${t.u.m}`; $('rTent').value = S.tentH;
  $('rBarL').textContent = re.bL; $('rBarO').textContent = `${num(S.barL)} ${t.u.cm}`; $('rBar').value = S.barL;
  if (pool) {
    const r = poolOf(S.deep);
    lab.setFacts([t.facts.oly(50 * 25 * 2)]);
    lab.setReadout(`${nx(r.V)} ${t.u.m3}`, `${nx(r.A)} ${t.u.m2} × ${POOL.wid} ${t.u.m}`, S.p3d ? `🚿 ${nx(r.hrs)} ${t.u.h}` : `${num(r.lit)} ${t.u.l}`, '#3d9ee0');
    if (askPool) lab.setState({ emo: '🚿', title: re.pTitle, lead: re.pLead(POOL, S.deep), body: '', extra: '' });
    else if (S.rverdict) lab.setState({ emo: S.p3 === 1 ? '✅' : '🤔', title: S.p3 === 1 ? t.right : t.wrong, lead: re.rev(r, POOL.flow), body: re.poolLead(POOL, S.deep, r), extra: '' });
    else lab.setState({ emo: '🏊', title: re.poolT, lead: re.poolLead(POOL, S.deep, r), body: re.poolBody(r, POOL.flow), extra: '' });
  } else if (S.obj === 'tent') {
    const hh = S.tentH, A = TENT.w * hh / 2, V = A * TENT.len, sl = Math.hypot(TENT.w / 2, hh);
    lab.setFacts([t.facts.oly(50 * 25 * 2)]);
    lab.setReadout(`${nx(V)} ${t.u.m3}`, `${nx(A)} ${t.u.m2} × ${TENT.len} ${t.u.m}`, `${num(V * 1000)} ${t.u.l} ${re.air}`, '#4f9d6b');
    lab.setState({ emo: '⛺', title: re.tentT, lead: re.tentLead(TENT.w, hh, A, TENT.len, V), body: re.tentBody(sl, TENT.len, 2 * sl * TENT.len), extra: '' });
  } else {
    const A = BAR.b * BAR.h / 2, V = A * S.barL;
    lab.setFacts([t.facts.oly(50 * 25 * 2)]);
    lab.setReadout(`${nx(V)} ${t.u.cm3}`, `${nx(A)} ${t.u.cm2} × ${num(S.barL)} ${t.u.cm}`, '', '#8a5a3a');
    lab.setState({ emo: '🍫', title: re.barT, lead: re.barLead(BAR.b, BAR.h, A, S.barL, V), body: re.barBody, extra: '' });
  }
}
render();
