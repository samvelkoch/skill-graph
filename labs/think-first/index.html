    c.stroke(); c.setLineDash([]);
  };
  b.disp += (b.w - b.disp) * Math.min(1, K.dt * 3); if (Math.abs(b.w - b.disp) < .01) b.disp = b.w;
  if (b.prev) line(b.prev, 'rgba(200,205,225,.5)', true, 10);
  line(b.sk, '#7fd4ff', false, b.disp);
  const shown = Math.min(b.sk.length - 1, b.disp);
  const hx = X(shown), hv = lerp(b.sk[Math.floor(shown)], b.sk[Math.min(b.sk.length - 1, Math.ceil(shown))], shown % 1);
  c.fillStyle = '#fff'; c.strokeStyle = '#2b6a8f'; c.lineWidth = 2.5; c.beginPath(); c.arc(hx, Y(hv), 6, 0, 7); c.fill(); c.stroke();
  pill(c, t.skill, 120, 26, 12, '#bfeaf7');
  if (b.prev) pill(c, `┈ ${t.prev}`, 395, 26, 12, '#cdd3e6');
  if (b.w >= 10 && b.disp >= 9.9) pill(c, `${t.test}: ${Math.round(b.sk[10])} %`, X(10) - 62, Y(b.sk[10]) + (b.sk[10] > 50 ? 26 : -26), 12, '#7fd4ff');
  // the slider as a picture between the child and Bolt
  const v = b.slide / 100; c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(222, 352); c.lineTo(302, 352); c.stroke();
  c.font = F(15); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🧠', 214, 330); c.fillText('🤖', 310, 330);
  c.fillStyle = '#fff'; c.strokeStyle = '#8a4a17'; c.lineWidth = 2; c.beginPath(); c.arc(222 + 80 * v, 352, 9, 0, 7); c.fill(); c.stroke();
  void time;
}

// --- controls ------------------------------------------------------------------------------------------------
$('sl').addEventListener('input', () => { S.b.slide = +$('sl').value; if (S.b.w < 10) sfx.tick(); renderBrainCtl(T[lang]); });
$('ctrlBody').addEventListener('click', (ev) => {
  const bt = ev.target.closest('[data-act]'); if (!bt) return;
  const a = bt.dataset.act, i = +bt.dataset.i, r = S.r;
  if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = bt.dataset.k; S.sec = S.sec === k ? null : k; sfx.click();
    if (S.sec === 'sn') S.sn = { qi: 0, pick: null }; if (S.sec === 'ck') S.ck = { p: 0, k: null };
  } else if (a === 'pred') { r.pred = i; r.ph = 'play'; r.rd = 0; r.i = 0; r.st = 'intro'; sfx.click(); }
  else if (a === 'go') { r.st = 'ask'; r.mine = null; r.fin = null; sfx.click(); }
  else if (a === 'fin') { // round A: any option is the final answer
    r.mine = i; r.fin = i; finish(); }
  else if (a === 'mine') { r.mine = i; sfx.click(); if (i === PZ[r.i].b) { r.fin = i; finish(); } else r.st = 'choose'; }
  else if (a === 'pick') { r.fin = i; finish(); }
  else if (a === 'nextp') {
    if (r.i === (r.rd ? 11 : 5)) { if (r.rd === 0) { r.rd = 1; r.i = 6; r.st = 'intro'; } else r.ph = 'result'; } else { r.i++; r.st = 'ask'; r.mine = null; r.fin = null; }
    sfx.click(); if (r.ph === 'result') showStage();
  } else if (a === 'again1') { S.r = fresh1(); sfx.click(); }
  else if (a === 'v2') { const v = S.v, truth = BOLT_RIGHT[v.i]; v.g = i === 1; v.res.push({ g: v.g, truth }); v.rev = true; (v.g === truth ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'next2') { S.v.i++; S.v.g = null; S.v.rev = false; sfx.click(); }
  else if (a === 'again2') { S.v = fresh2(); sfx.click(); }
  else if (a === 'week') { weekStep(); }
  else if (a === 'fill') { while (S.b.w < 10) weekStep(i, true); sfx.click(); showStage(); }
  else if (a === 'new3') { const pv = S.b.sk.length > 1 ? S.b.sk.slice() : null; S.b = fresh3(); S.b.prev = pv; sfx.click(); }
  else if (a === 'sn') { S.sn.pick = i; (T[lang].sn.qs[S.sn.qi].ok === i ? sfx.good : sfx.bad)(); }
  else if (a === 'sn2') { S.sn.qi++; S.sn.pick = null; sfx.click(); }
  else if (a === 'ckp') { S.ck = { p: i, k: null }; sfx.click(); }
  else if (a === 'ckk') { S.ck.k = i; (i === 1 ? sfx.good : sfx.bad)(); }
  render();
});
function finish() {
  const r = S.r, p = PZ[r.i], slipped = p.b !== p.r && r.fin === p.b;
  r.st = 'rev';
  if (slipped) { r.slip[r.rd]++; r.drop = now(); r.dropRd = r.rd; sfx.bad(); } else sfx.good();
  showStage();
}
function weekStep(val, quiet) {
  const b = S.b; if (b.w >= 10) return;
  const ai = val ?? b.slide; if (val !== undefined) b.slide = val;
  b.sk.push(dsk(b.sk[b.sk.length - 1] + delta(ai))); b.ai.push(ai); b.w++; if (!quiet) { sfx.click(); if (b.w >= 10) showStage(); }
}

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.querySelectorAll('#c1,#c2,#c3').forEach((e) => { e.style.display = 'none'; });
  const secChips = ['sn', 'ck'].map((k, n) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${n ? '🔁' : '🎭'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('secChips').innerHTML = secChips;
  lab.setGlow(['rgba(95,168,220,.28)', 'rgba(241,183,60,.22)', 'rgba(111,208,140,.22)'][['rounds', 'voice', 'brain'].indexOf(v)]);
  if (S.sec) renderSecret(t, v);
  else if (v === 'rounds') renderRounds(t);
  else if (v === 'voice') renderVoice(t);
  else renderBrain(t);
}
const opt = (cls, act, i, label, dis) => `<button class="tf-b ${cls || ''}" data-act="${act}" data-i="${i}"${dis ? ' disabled' : ''}>${esc(label)}</button>`;

function renderRounds(t) {
  const x = t.r1, r = S.r, c1 = $('c1'); c1.style.display = '';
  lab.setFacts(t.facts.r);
  if (r.ph === 'predict') {
    lab.setReadout('?', '', '', '#5fa8dc');
    c1.innerHTML = `<div class="tf-q">${esc(x.predQ)}</div><div class="tf-opts">${x.pred.map((o, i) => opt('', 'pred', i, o)).join('')}</div>`;
    lab.setState({ emo: '🤖', title: x.predT, lead: x.predL, body: '', extra: '' }); return;
  }
  if (r.ph === 'result') {
    const [a, b] = r.slip, kind = a > b ? 0 : a < b ? 1 : 2, [ti, le] = x.res(a, b, x.times);
    lab.setReadout(`A ${a} · B ${b}`, x.jarLbl, '', '#e5484d');
    c1.innerHTML = `<p class="tf-fb"><b>${esc(x.pillA)}:</b> ${a} &nbsp; <b>${esc(x.pillB)}:</b> ${b}<br>${esc(x.guess(x.pred[r.pred], r.pred === kind))}</p><div class="tf-row"><button class="btn" data-act="again1">${esc(t.again)}</button></div>`;
    lab.setState({ emo: '🫙', title: ti, lead: le, body: '', extra: '' }); return;
  }
  const i = r.i, p = PZ[i], tp = t.pz[i], o = optsOf(i), rd = r.rd, q = `<div class="tf-q">${esc(tp.q)}</div>`;
  lab.setReadout(`${rd ? 'B' : 'A'} · ${(i % 6) + 1}/6`, x.sub(rd), `🔴 ${r.slip[rd]}`, '#e5484d');
  if (r.st === 'intro') {
    const [ti, le] = rd ? x.introB : x.introA;
    c1.innerHTML = `<div class="tf-row" style="margin-top:0"><button class="btn" data-act="go">${esc(x.start)}</button></div>`;
    lab.setState({ emo: rd ? '✍️' : '🤖', title: ti, lead: le, body: '', extra: '' }); return;
  }
  const chips = (act, mark) => o.map((s, k) => opt(mark ? (k === p.r ? 'good' : k === r.fin ? 'bad' : '') : '', act, k, s, mark)).join('');
  const head = `<div class="tf-sub" style="margin-top:0">${esc(x.puz((i % 6) + 1))}</div>${q}`;
  if (r.st === 'ask') {
    c1.innerHTML = rd === 0
      ? `${head}<button class="btn tf-b full" data-act="fin" data-i="${p.b}">${esc(x.accept)}</button><div class="tf-sub">${esc(x.own)}</div><div class="tf-opts">${chips('fin')}</div>`
      : `${head}<div class="tf-opts">${chips('mine')}</div>`;
    lab.setState({ emo: rd ? '✍️' : '🤖', title: rd ? x.rb : x.ra, lead: rd ? x.pickFirst : x.boltSaid(o[p.b]), body: '', extra: '' }); return;
  }
  if (r.st === 'choose') {
    c1.innerHTML = `${head}<p class="tf-fb">${esc(x.boltSaid(o[p.b]))}</p><div class="tf-opts">${opt('', 'pick', r.mine, x.keep(o[r.mine]))}${opt('', 'pick', p.b, x.swap(o[p.b]))}</div>`;
    lab.setState({ emo: '🤔', title: x.rb, lead: x.boltSaid(o[p.b]), body: '', extra: '' }); return;
  }
  // reveal
  const ok = r.fin === p.r, wrongB = p.b !== p.r, slip = wrongB && r.fin === p.b;
  const msg = [ok ? `<span class="ok">${esc(x.isRight)}</span>` : `<span class="no">${esc(x.isNot(o[p.r]))}</span>`,
    wrongB ? (slip ? x.slip : x.caught) : x.boltOk].join('<br>');
  c1.innerHTML = `${head}<div class="tf-opts">${chips('x', true)}</div><p class="tf-fb" style="margin-top:10px">${msg}</p>
    <div class="tf-row"><button class="btn" data-act="nextp">${esc(r.i === 11 ? x.jars : r.i === 5 ? t.next : t.next)}</button></div>`;
  lab.setState({ emo: ok ? '✅' : '❌', title: ok ? t.right : x.isNot(o[p.r]).split('.')[0] + '.', lead: wrongB ? (slip ? x.slip : x.caught) : x.boltOk, body: wrongB ? (tp.w || '') : '', extra: '' });
}

function renderVoice(t) {
  const x = t.v2, v = S.v, c2 = $('c2'); c2.style.display = '';
  lab.setFacts(t.facts.v);
  const known = v.res.length, rightN = v.res.filter((q) => q.truth).length;
  lab.setReadout(`${Math.min(v.i + (v.rev ? 1 : 0), 8)}/8`, x.q, `🔊 100 %`, '#f1b73c');
  if (v.i >= 8) {
    const spot = v.res.filter((q) => q.g === q.truth).length;
    c2.innerHTML = `<div class="tf-row" style="margin-top:0"><button class="btn" data-act="again2">${esc(t.again)}</button></div>`;
    lab.setState({ emo: '🔊', title: x.endT(spot), lead: x.endL(rightN), body: x.endB, extra: '' }); return;
  }
  const it = x.items[v.i], truth = BOLT_RIGHT[v.i], head = `<div class="tf-sub" style="margin-top:0">${esc(x.n(v.i + 1))}</div><div class="tf-q">${esc(x.q)}</div>`;
  if (!v.rev) {
    c2.innerHTML = `${head}<div class="tf-opts">${opt('', 'v2', 1, x.yes)}${opt('', 'v2', 0, x.no)}</div>`;
    lab.setState({ emo: '🔊', title: x.q, lead: it[0], body: '', extra: '' }); return;
  }
  const ok = v.g === truth;
  c2.innerHTML = `${head}<div class="tf-opts">${opt(truth ? 'good' : '', 'x', 1, x.yes, true)}${opt(!truth ? 'good' : '', 'x', 0, x.no, true)}</div>
    <p class="tf-fb" style="margin-top:10px"><b>${esc(truth ? x.vRight : x.vWrong)}</b> ${esc(it[1])}<br>${esc(x.same)}</p>
    <div class="tf-row"><button class="btn" data-act="next2">${esc(t.next)}</button></div>`;
  lab.setState({ emo: truth ? '✅' : '❌', title: ok ? t.right : (truth ? x.vRight : x.vWrong), lead: it[1], body: `${ok ? x.guessOk : x.guessNo} ${x.same}`, extra: '' });
}

function renderBrainCtl(t) {
  const x = t.v3, b = S.b, done = b.w >= 10;
  $('sl').value = b.slide; $('sl').disabled = done; $('sl').style.display = done ? 'none' : ''; $('zones').style.display = done ? 'none' : '';
  $('sl').setAttribute('aria-label', x.q);
  $('zones').innerHTML = x.ends.map((e) => `<span>${esc(e)}</span>`).join('');
}
function renderBrain(t) {
  const x = t.v3, b = S.b, c3 = $('c3'); c3.style.display = '';
  lab.setFacts(t.facts.b); renderBrainCtl(t);
  const done = b.w >= 10, sk = Math.round(b.sk[b.sk.length - 1]);
  lab.setReadout(done ? `${sk} %` : x.wk(b.w + 1), done ? x.test : x.skill, done ? '' : `${sk} %`, '#6fd08c');
  $('c3a').innerHTML = done ? '' : `<div class="tf-q">${esc(x.q)}</div>`;
  $('c3b').innerHTML = done
    ? `<div class="tf-row" style="margin-top:0"><button class="btn" data-act="new3">${esc(x.newRun)}</button></div>`
    : `<div class="tf-row" style="margin-top:0"><button class="btn" data-act="week">${esc(x.go)}</button></div>
       <div class="tf-sub">${esc(x.fill)}</div><div class="tf-opts">${[0, 30, 100].map((val, k) => opt('', 'fill', val, x.presets[k])).join('')}</div>`;
  const note = `<div class="tf-note">${esc(x.pic)}</div>`;
  if (b.w === 0) lab.setState({ emo: '🧠', title: x.t0[0], lead: x.t0[1], body: x.body, extra: note });
  else if (done) lab.setState({ emo: '💪', title: x.endT(sk), lead: x.endL(sk), body: x.body, extra: note });
  else { const la = b.ai[b.w - 1], m = la <= 10 ? 0 : la <= 50 ? 1 : 2; lab.setState({ emo: ['💪', '🔍', '🤖'][m], title: x.modes[m][0], lead: x.modes[m][1], body: x.weekLead(b.w, sk), extra: note }); }
}

function renderSecret(t, v) {
  const el = $('c1'); el.style.display = '';
  lab.setFacts([]);
  if (S.sec === 'sn') {
    const x = t.sn, n = S.sn, q = x.qs[n.qi];
    lab.setReadout(`${Math.min(n.qi + 1, 2)}/2`, t.secrets.sn[0], '', '#f1b73c');
    if (!q) { el.innerHTML = ''; lab.setState({ emo: '🎭', title: t.secrets.sn[0], lead: x.end, body: '', extra: '' }); return; }
    const got = n.pick !== null, last = n.qi >= x.qs.length - 1;
    el.innerHTML = `<div class="tf-q">${esc(q.q)}</div><div class="tf-opts">${q.o.map((s, k) => opt(got ? (k === q.ok ? 'good' : k === n.pick ? 'bad' : '') : '', 'sn', k, s, got)).join('')}</div>
      ${got ? `<p class="tf-fb" style="margin-top:10px"><b>${esc(n.pick === q.ok ? x.good : x.miss)}</b> ${esc(q.w)}</p><div class="tf-row"><button class="btn" data-act="sn2">${esc(last ? t.next : x.go)}</button></div>` : ''}`;
    lab.setState({ emo: '🎭', title: got ? (n.pick === q.ok ? t.right : x.miss) : t.secrets.sn[0], lead: got ? q.w : x.pick, body: got && last ? x.end : '', extra: '' });
    return;
  }
  const x = t.ck, k = S.ck, L = x.L[k.p], bi = k.p ? 6 : 0, o = optsOf(bi), cand = [PZ[bi].b, PZ[bi].r];
  lab.setReadout(x.puz[k.p], t.secrets.ck[0], '', '#6fd08c');
  const lines = k.k === null ? '' : `<div class="tf-lines">${L[k.k].map((s) => `<div>${esc(s)}</div>`).join('')}<div class="${k.k === 1 ? 'end-ok' : 'end-no'}">${esc(k.k === 1 ? x.fit : x.nofit)}</div></div>`;
  el.innerHTML = `<div class="tf-q">${esc(t.pz[bi].q)}</div>
    <div class="tf-sub" style="margin-top:0">${esc(x.pick)}</div><div class="tf-opts">${x.puz.map((s, i) => opt(i === k.p ? 'on' : '', 'ckp', i, s)).join('')}</div>
    <div class="tf-sub">${esc(x.try)}</div><div class="tf-opts">${cand.map((c, i) => opt(k.k === i ? 'on' : '', 'ckk', i, o[c])).join('')}</div>${lines}`;
  lab.setState({ emo: '🔁', title: t.secrets.ck[0], lead: x.lead, body: k.k === null ? '' : (k.k === 1 ? x.fit : x.nofit), extra: '' });
}
render();
</script>
