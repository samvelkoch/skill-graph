  }
  const lbl = { state: t.oS, town: t.oT, none: t.oN };
  $('hxDay').innerHTML = `<div class="hx-q">${esc(t.dq)}</div><div class="hx-opts">${['state', 'town', 'none'].map((g) =>
    optBtn('dg', `data-g="${g}"`, lbl[g], S.drev ? (g === sp.to ? 'good' : g === S.dg ? 'bad' : '') : '').replace('<button', S.drev ? '<button disabled' : '<button')).join('')}</div>
    ${S.drev ? `<div class="hx-v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.no)}</div><button class="btn" data-act="dnext">${esc(t.next)}</button>` : ''}`;
}
function rPrice(t) {
  const { r, net, tax } = pricing(), m = M(TOTAL);
  $('hxPq').style.display = S.prev ? 'none' : ''; $('hxPs').hidden = !S.prev;
  if (!S.prev) {
    lab.setReadout('?', t.tax, '', C.tax);
    lab.setState({ emo: '🏷️', title: t.pTitle(m), lead: t.pTip, body: '' });
    $('hxPq').innerHTML = `<div class="hx-q">${esc(t.pAsk(27, m))}</div><div class="hx-opts">${PRICE_OPTS.map((n) => optBtn('pg', `data-v="${n}"`, M(n))).join('')}</div>`;
  } else {
    const ok = S.pg === 270;
    lab.setReadout(M(tax), `${t.rateLbl} ${r}%`, S.rate === 27 ? (ok ? '✓' : '✗') : '', S.rate === 27 ? (ok ? C.ok : '#d9534f') : C.tax);
    lab.setState({ emo: S.rate === 27 ? (ok ? '✅' : '🔎') : '🏷️', title: S.rate === 27 ? (ok ? t.right : t.no) : t.pTitle(m), lead: t.pLead(M(tax), M(net)), body: '' });
    $('hxRl').textContent = t.rateLbl; $('hxRv').textContent = `${r}%`;
    $('hxChips').innerHTML = RATES.map(([k, n]) => `<button class="hx-c ${n === r ? 'on' : ''}" data-act="prate" data-r="${n}">${k} ${n}%</button>`).join('');
    $('hxPn').textContent = t.pBody(M(net), r, m);
    $('hxPa').textContent = t.again;
  }
}
function rWhere(t) {
  const sel = S.wsel, n = Object.keys(S.wa).length;
  if (sel === null) {
    lab.setReadout(`${n}/6`, '', '', C.state);
    lab.setState({ emo: '🏛️', title: t.wTapT, lead: t.wTap, body: '' });
    $('hxWhere').innerHTML = `<div class="hx-q">${esc(t.wTapT)}</div>`;
    return;
  }
  const b = t.blds[sel], ans = S.wa[sel], rev = ans !== undefined, ok = rev && ans === b.w;
  lab.setReadout(`${n}/6`, rev ? t.who[b.w] : b.n, rev ? (ok ? '✓' : '✗') : '', rev ? (ok ? C.ok : '#d9534f') : C.state);
  if (!rev) lab.setState({ emo: BEMO[sel], title: b.n, lead: t.wQ, body: t.wTap });
  else lab.setState({ emo: ok ? '✅' : '🔎', title: ok ? t.right : t.no, lead: `${b.n}: ${t.who[b.w]}`, body: b.why });
  const lbl = { S: t.oS, T: t.oT, B: t.oB };
  $('hxWhere').innerHTML = `<div class="hx-q">${esc(b.n)}: ${esc(t.wQ)}</div><div class="hx-opts">${['S', 'T', 'B'].map((g) =>
    optBtn('wg', `data-g="${g}"`, lbl[g], rev ? (g === b.w ? 'good' : g === ans ? 'bad' : '') : '').replace('<button', rev ? '<button disabled' : '<button')).join('')}</div>
    ${rev ? `<div class="hx-v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.no)}</div>` : ''}`;
}
function rSA(t) {
  const rate = SALES[S.sr], tx = 10 * rate / 100;
  lab.setReadout(usd(10 + tx), t.sa.pay, '', C.tax);
  lab.setState({ emo: '🇺🇸', title: t.secrets.a[0], lead: t.secrets.a[1], body: t.sa.body(usd(10), usd(10 + tx)) });
  $('hxSa').innerHTML = `<div class="hx-row" style="margin-top:0">${SALES.map((r, i) => `<button class="hx-c ${i === S.sr ? 'on' : ''}" data-act="sachip" data-i="${i}">${esc(t.sa.chip(r))}</button>`).join('')}</div>`;
}
function rSB(t) {
  const st = t.sb.stops[S.bs];
  lab.setReadout(`${S.bs + 1}/5`, st.n, '', C.tax);
  lab.setState({ emo: STOPEMO[S.bs], title: st.n, lead: st.t, body: '' });
  $('hxSb').innerHTML = `<div class="hx-row" style="margin-top:0"><button class="btn" data-act="sbnext">${esc(S.bs >= 4 ? t.sb.again : t.sb.next)}</button></div>`;
}
render();
</script>
