  if (r === 2) return `<div class="tk"><div class="tk-h">${esc(k.h)}</div><div class="tk-p">${esc(k.p)}</div><div class="tk-phone">📱 482</div>
    <div class="tk-chips">${k.opts.map((o, i) => `<button class="tk-c" data-tv="${i}">${esc(o)}</button>`).join('')}</div>${S.badCode ? `<div class="tk-bad">${esc(k.wrong)}</div>` : ''}</div>`;
  return `<div class="tk"><div class="tk-h">${esc(k.h)}</div><div class="tk-p">${esc(k.p)}</div>
    <div class="tk-chips">${k.opts.map((o, i) => `<button class="tk-c ${S.tv === i ? 'on' : ''}" data-tv="${i}">${esc(o)}</button>`).join('')}</div>
    <button class="tk-go" data-go="1" ${S.tv === null ? 'disabled' : ''}>${esc(k.btn)}</button></div>`;
}
function render3(t) {
  lab.setGlow('rgba(143, 127, 208, .26)');
  const r = S.r, got = S.ok.filter(Boolean).length, sum = r >= 3, o = t.on;
  lab.setReadout(`${got}/3`, o.sub, o.pill, '#8f7fd0');
  const base = [t.facts.egov], end = [t.facts.phish, t.facts.pwd, t.facts.mfa];
  if (sum) {
    ov.innerHTML = `<div class="po"><div class="po-sum"><div class="habits">${o.hab.map((h) => { const [e, x] = h.split('|'); return `<div><span>${e}</span><span>${esc(x)}</span></div>`; }).join('')}</div></div></div>`;
    $('c3').innerHTML = `<button class="btn" data-act="again3">${esc(o.again)}</button>`;
    lab.setState({ emo: '🛡️', title: o.sTitle, lead: o.sLead, body: '', extra: '' }); lab.setFacts(end); return;
  }
  const R = ROUNDS[r];
  if (S.step === 'spot') {
    const picked = S.rp !== null, A = R.real === 'A' ? OFFICIAL : R.fake, B = R.real === 'B' ? OFFICIAL : R.fake;
    const cls = (id) => (!picked ? '' : id === R.real ? 'real' : 'fake'), badge = (id) => (!picked ? '' : id === R.real ? o.real : o.fake);
    ov.innerHTML = `<div class="po"><div class="po-note">📨 <span>${esc(o.letter)}</span> <code>my.sunvale.example</code></div>
      <div class="po-two">${browser(A, { pick: picked ? '' : 'A', cls: cls('A'), badge: badge('A'), mark: picked && R.real === 'B' })}${browser(B, { pick: picked ? '' : 'B', cls: cls('B'), badge: badge('B'), mark: picked && R.real === 'A' })}</div></div>`;
    $('c3').innerHTML = picked ? `<button class="btn" data-act="open3">${esc(o.open)}</button>` : `<div class="pq">${esc(o.q)}</div><div class="fine">${esc(o.note)}</div>`;
    const ok = S.ok[r], s = !picked ? { emo: '🔎', title: o.q, lead: o.note, body: '' } : { emo: ok ? '✅' : '🤔', title: ok ? t.p1.right : t.p1.wrong, lead: o.why[r], body: ok ? o.good : '' };
    lab.setState({ ...s, extra: '' }); lab.setFacts(base); return;
  }
  ov.innerHTML = `<div class="po"><div class="po-two" style="grid-template-columns:1fr">${browser(OFFICIAL, { cls: 'real', badge: o.real, page: taskPage(t) })}</div></div>`;
  $('c3').innerHTML = S.tdone ? `<button class="btn" data-act="next3">${esc(r === 2 ? o.habits : o.next)}</button>` : `<div class="fine">${esc(o.tLead)}</div>`;
  lab.setState({ emo: S.tdone ? '✅' : '🏛️', title: o.tTitle[r], lead: S.tdone ? o.t[r].ok : o.tLead, body: '', extra: '' }); lab.setFacts(base);
}

render();
</script>
