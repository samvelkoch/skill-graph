function pill(c, text, x, y, o = {}) {
  const size = o.size || 13;
  c.save(); c.globalAlpha = o.alpha ?? 1;
  c.font = `800 ${size}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + 18, th = size + 12;

  c.fillStyle = o.bg || 'rgba(10,12,24,.82)'; c.beginPath(); c.roundRect(px, py, tw, th, th / 2); c.fill();
  if (o.border) { c.strokeStyle = o.border; c.lineWidth = 1.5; c.stroke(); }
  c.fillStyle = o.fg || '#fff'; c.fillText(text, px + tw / 2, y + 1);
  c.restore();
  return { x: px, y: py, w: tw, h: th };
}
function emoji(c, e, x, y, size, alpha = 1) {

  else if (b.dataset.again) { resetGame(); renderAll(); sfx.click(); }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.again) { resetGame(); renderAll(); sfx.click(); return; }
  const k = b.dataset.sec; if (!k) return;
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === k ? null : k; S.secT = 0; sfx.click(); renderAll(); showStage();
});

// digging: tap or drag over the rock
const cv = $('cv');
const local = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
const digging = () => lab.view === 'dig' && S.dig.ph === 'game' && !S.sec && G.doneAt === null;
cv.addEventListener('pointerdown', (ev) => {
  if (!digging()) return; G.down = true; G.last = null; const [x, y] = local(ev); G.ptr = [x, y]; digAt(x, y);
  try { cv.setPointerCapture(ev.pointerId); } catch { /* not supported */ }
});
cv.addEventListener('pointermove', (ev) => {
  if (!digging()) { G.ptr = null; return; }
  const [x, y] = local(ev); G.ptr = [x, y]; if (G.down) digAt(x, y);
});
const lift = (ev) => { G.down = false; G.last = null; if (ev.pointerType !== 'mouse') setTimeout(() => { if (!G.down) G.ptr = null; }, 350); };
cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift);
cv.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse' && !G.down) G.ptr = null; });

// --- the loop ----------------------------------------------------------------------------------------------
canvasLoop(cv, (c, w, h, dt, time) => {
  CW = w; CH = h;
  const v = lab.view;
  if (S.sec && v === 'day') { c.save(); drawSecret(c, w, h, dt); c.restore(); return; }
  // timers of the reveals
  const D = S.day, W = S.who, Q = S.dig;
  if (v === 'day' && D.ans !== null && !D.fin) {
    D.t += dt;
    if (D.t >= DUR[D.qi]) { D.t = DUR[D.qi]; D.fin = true; if (D.qi === 2) D.done3 = true; renderAll(); }
    else if (D.qi === 0) renderReadout();
  } else if (v === 'dig' && Q.ph === 'story' && !Q.fin) {
    Q.t += dt; if (Q.t >= STORY_DUR) { Q.t = STORY_DUR; Q.fin = true; renderAll(); }
  } else if (v === 'who' && W.ans !== null) {
    W.t += dt; if (!W.fin && W.t >= .9) { W.fin = true; renderAll(); }
  }
  // the question card sits on top of the picture: the picture uses the space below it
  const want = askEl.style.display === 'none' ? 0 : askEl.offsetHeight + 16;
  S.pad += (want - S.pad) * Math.min(1, dt * 10);
  if (Math.abs(want - S.pad) < .5) S.pad = want;
  c.save();
  if (v === 'day') drawDay(c, w, h, S.pad, time);
  else if (v === 'dig') drawDig(c, w, h, Q.ph === 'game' ? want : S.pad, dt, time); // the rock window is laid out once, not while the card slides
  else drawWho(c, w, h, S.pad, time);
  c.restore();
});

renderAll();
</script>
