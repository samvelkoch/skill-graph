const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const hash = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const rr = (c, x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };

// fraction of full sunlight at height h (metres)
function light(h) {
  if (h >= 45) return 1;
  if (h >= 30) return 0.05 + 0.95 * smooth((h - 30) / 15);
  if (h >= 3) return lerp(0.02, 0.05, (h - 3) / 27);
  return 0.02;
}

const holeLight = (h) => 0.6 + 0.4 * Math.pow(clamp(h / 45, 0, 1), 1.2);
const lightGap = (h, o) => lerp(light(h), Math.max(light(h), holeLight(h)), o);
const SEEDS = [36, 24, 13]; // metres reached after 30 years: three seedlings, different speeds

// ---- 4. Drawing --------------------------------------------------------------------------------------
// geometry: the cut-away is 60 m tall; ppm = pixels per metre; the tray (who view) sits under the soil
function geom(w, h, m) {
  const L = 46, R = w - 6, top = 8, narrow = w < 520;
  const trayH = m === 'who' ? (narrow ? 108 : 70) : 0;
  const bottom = h - 6 - (trayH ? trayH + 8 : 0);
  const soilH = clamp(h * 0.05, 16, 28), groundY = bottom - soilH, ppm = (groundY - top) / 60;
  return { w, h, L, R, sw: R - L, top, bottom, soilH, groundY, ppm, trayH, narrow, yOf: (mm) => groundY - mm * ppm };
}
const gapGeom = (G) => { const gw = clamp(G.sw * 0.15, 46, 96), gx = G.L + G.sw * 0.4; return { gw, gx, ex: gx - 0.8 * gw, o: gapO() }; };
const exX = (G, m) => (m === 'gap' ? gapGeom(G).ex : G.L + G.sw * 0.3);

function trunksOf(G) {
  const n = Math.max(4, Math.round(G.sw / 52)), r = [];
  for (let i = 0; i < n; i++) r.push({ x: G.L + G.sw * (i + 0.5 + (hash(i * 7 + 1) - 0.5) * 0.5) / n, m: 33 + hash(i * 11 + 2) * 6, w: 4 + hash(i * 13 + 3) * 3 });
  return r;
}
const EM = [0.14, 0.4, 0.8];
const emergents = (G) => EM.map((f, i) => ({ x: G.L + G.sw * f, m: 51 + hash(i * 17 + 5) * 4, i }));

// translucent dark layer: the darker, the less light reaches that height
function shade(c, G, x0, x1, fn) {
  const g = c.createLinearGradient(0, G.top, 0, G.groundY);
  for (let mm = 60; mm >= 0; mm -= 2.5) g.addColorStop(clamp((G.yOf(mm) - G.top) / (G.groundY - G.top), 0, 1), `rgba(2,8,4,${((1 - fn(mm)) * 0.62).toFixed(3)})`);
  c.fillStyle = g; c.fillRect(x0, G.top, x1 - x0, G.bottom - G.top);
}

function drawEmergent(c, G, e, ang, sy) {
  const hp = e.m * G.ppm, rx = clamp(G.sw * 0.1, 28, 70), ry = G.ppm * 3.9, bw = 4 + G.sw * 0.012;
  c.save(); c.translate(e.x, G.groundY - 3); c.rotate(ang); c.scale(1, sy);
  c.fillStyle = '#4a3523';
  c.beginPath(); c.moveTo(-bw * 1.8, 4); c.quadraticCurveTo(-bw * 0.6, -hp * 0.1, -bw * 0.5, -hp); c.lineTo(bw * 0.5, -hp);
  c.quadraticCurveTo(bw * 0.6, -hp * 0.1, bw * 1.8, 4); c.closePath(); c.fill();
  const cy = -hp + ry * 0.2;
  [[-0.9, 0.25, 0.8], [0.85, 0.3, 0.75], [0, -0.15, 1], [-0.35, -0.4, 0.7], [0.4, -0.35, 0.65]].forEach(([dx, dy, k], j) => {
    c.beginPath(); c.ellipse(dx * rx * 0.8, cy + dy * ry, rx * k, ry * (k * 0.9 + 0.1), 0, 0, 7);
    c.fillStyle = `hsl(${112 + j * 5} 50% ${28 + j * 2.5}%)`; c.fill();
  });
  c.restore();
}

function drawScene(c, G, m, time) {
  const { L, R, sw, top, bottom, groundY, ppm, yOf } = G;
  const gp = m === 'gap' ? gapGeom(G) : null;
  c.save(); rr(c, L, top, sw, bottom - top, 14); c.clip();

  // sky above the roof, deep green behind it, the sun in the corner
  const sky = c.createLinearGradient(0, top, 0, yOf(45));
  sky.addColorStop(0, '#2f7fc4'); sky.addColorStop(1, '#8ccdf0');
  c.fillStyle = sky; c.fillRect(L, top, sw, yOf(45) - top);
  const bg = c.createLinearGradient(0, yOf(45), 0, groundY);
  bg.addColorStop(0, '#1c4a30'); bg.addColorStop(0.4, '#0f2c1b'); bg.addColorStop(1, '#0a1c11');
  c.fillStyle = bg; c.fillRect(L, yOf(45), sw, groundY - yOf(45));
  const sx = R - 30, sy = top + 30, glow = c.createRadialGradient(sx, sy, 6, sx, sy, 80);
  glow.addColorStop(0, 'rgba(255,244,190,.95)'); glow.addColorStop(0.25, 'rgba(255,236,160,.45)'); glow.addColorStop(1, 'rgba(255,236,160,0)');
  c.fillStyle = glow; c.fillRect(sx - 90, sy - 90, 180, 180);
  c.beginPath(); c.arc(sx, sy, 15, 0, 7); c.fillStyle = '#fff5b8'; c.fill();

  // soil + roots
  const soil = c.createLinearGradient(0, groundY, 0, bottom);
  soil.addColorStop(0, '#3a2412'); soil.addColorStop(1, '#1d1208');
  c.fillStyle = soil; c.fillRect(L, groundY, sw, bottom - groundY);
  const trunks = trunksOf(G);
  c.strokeStyle = '#5a3d24'; c.lineWidth = 2; c.lineCap = 'round';
  trunks.forEach((tr, i) => {
    for (const s of [-1, 0, 1]) { c.beginPath(); c.moveTo(tr.x + s * 2, groundY); c.quadraticCurveTo(tr.x + s * 12, groundY + G.soilH * 0.5, tr.x + s * (16 + hash(i * 3 + s) * 12), bottom - 3); c.stroke(); }
  });
  for (let i = 0; i < 9; i++) { c.beginPath(); c.ellipse(L + hash(i * 5) * sw, groundY + G.soilH * (0.35 + hash(i * 9) * 0.5), 3 + hash(i) * 3, 2, 0, 0, 7); c.fillStyle = '#4b3520'; c.fill(); }

  // canopy trunks, then the roof of crowns (a hole opens where the giant fell)
  trunks.forEach((tr) => {
    c.fillStyle = '#3a2a1c'; c.fillRect(tr.x - tr.w / 2, yOf(tr.m), tr.w, groundY - yOf(tr.m));
    c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(tr.x - tr.w / 2, yOf(tr.m), 1.5, groundY - yOf(tr.m));
  });
  const rx = clamp(sw * 0.085, 22, 48), ry = ppm * 4.4, step = rx * 1.15;
  let ci = 0;
  [34.5, 38.5, 41].forEach((m0, r) => {
    for (let x = L - rx * 0.3 + r * 0.5 * step; x < R + rx; x += step) {
      ci++;
      const cx = x + (hash(ci * 3) - 0.5) * rx * 0.5, cm = m0 + (hash(ci * 5) - 0.5) * 3;
      let sc = 1;
      if (gp) { const k = clamp(1 - Math.abs(cx - gp.gx) / (gp.gw * 1.3), 0, 1); sc = 1 - gp.o * Math.min(1, k * 1.6); }
      if (sc < 0.04) continue;
      const hue = 105 + hash(ci * 7) * 40, lt = 15 + r * 7 + hash(ci * 11) * 6;
      c.beginPath(); c.ellipse(cx, yOf(cm), rx * sc, ry * sc, 0, 0, 7); c.fillStyle = `hsl(${hue} 42% ${lt}%)`; c.fill();
      c.beginPath(); c.ellipse(cx - rx * 0.15 * sc, yOf(cm) - ry * 0.3 * sc, rx * 0.6 * sc, ry * 0.45 * sc, 0, 0, 7); c.fillStyle = `hsl(${hue + 6} 48% ${lt + 7}%)`; c.fill();
    }
  });

  // understory: young trees with big dark leaves
  const nU = Math.max(4, Math.round(sw / 48)), len = clamp(ppm * 4.5, 14, 34);
  for (let i = 0; i < nU; i++) {
    const x = L + sw * (i + 0.2 + hash(i * 19 + 4) * 0.6) / nU, mh = 7 + hash(i * 23 + 6) * 16, ty = yOf(mh), bend = (hash(i * 3 + 8) - 0.5) * 10;
    c.strokeStyle = '#2c2016'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x, groundY); c.quadraticCurveTo(x + bend * 0.2, (groundY + ty) / 2, x + bend, ty); c.stroke();
    for (let j = 0; j < 6; j++) {
      const a = (j - 2.5) * 0.55, lx = x + bend + Math.sin(a) * len * 0.45, ly = ty - Math.cos(a) * len * 0.4;
      c.beginPath(); c.ellipse(lx, ly, len * 0.2, len * 0.5, a, 0, 7); c.fillStyle = `hsl(${128 + j * 3} 38% ${13 + (j % 3) * 3}%)`; c.fill();
    }
    for (const s of [-1, 1]) { const my = yOf(mh * (0.45 + hash(i + s) * 0.2)); c.beginPath(); c.ellipse(x + s * len * 0.4, my, len * 0.45, len * 0.16, s * 0.4, 0, 7); c.fillStyle = 'hsl(132 38% 14%)'; c.fill(); }
  }

  // leaf litter and ferns
  const lit = c.createLinearGradient(0, groundY - ppm * 1.4, 0, groundY + 4);
  lit.addColorStop(0, '#6a4524'); lit.addColorStop(1, '#3e2814');
  c.fillStyle = lit; c.beginPath(); c.moveTo(L, groundY + 4);
  for (let x = L; x <= R + 6; x += 6) c.lineTo(x, groundY - 2 - hash(x * 0.37) * ppm * 1.1);
  c.lineTo(R + 6, groundY + 4); c.closePath(); c.fill();
  const fs = clamp(ppm * 2.4, 9, 20);
  c.strokeStyle = 'hsl(122 45% 26%)'; c.lineWidth = 1.6;
  for (let i = 0; i < Math.round(sw / 24); i++) {
    const fx = L + sw * (i + 0.5 + (hash(i * 31 + 2) - 0.5) * 0.7) / Math.round(sw / 24), fy = groundY - 1;
    for (const a of [-1.05, -0.62, -0.2, 0.2, 0.62, 1.05]) { c.beginPath(); c.moveTo(fx, fy); c.quadraticCurveTo(fx + Math.sin(a) * fs * 0.35, fy - fs * 0.95, fx + Math.sin(a) * fs, fy - Math.cos(a) * fs); c.stroke(); }
  }

  // emergent giants (in the gap secret the middle one is the one that falls)
  const fall = gp && S.fallT !== null ? S.fallT : 0;
  emergents(G).forEach((e) => {
    if (gp && e.i === 1) {
      const ang = (84 * Math.PI / 180) * Math.pow(fall, 2.2), shrink = 1 - 0.45 * smooth((fall - 0.6) / 0.4);
      drawEmergent(c, G, { ...e, x: gp.gx }, ang, shrink);
    } else drawEmergent(c, G, e, 0, 1);
  });

  // seedlings racing up in the gap
  if (gp && S.fallT !== null && S.fallT >= 1) {
    SEEDS.forEach((_, i) => {
      const sxp = gp.gx + [-0.3, 0.15, 0.6][i] * gp.gw, hh = seedH(i, S.years) * ppm;
      c.strokeStyle = '#5a3f26'; c.lineWidth = 2 + Math.min(3, hh * 0.015); c.beginPath(); c.moveTo(sxp, groundY); c.lineTo(sxp, groundY - hh); c.stroke();
      const cr = 4 + hh * 0.11;
      c.beginPath(); c.ellipse(sxp, groundY - hh, cr * 1.3, cr, 0, 0, 7); c.fillStyle = `hsl(${92 + i * 12} 62% 42%)`; c.fill();
    });
  }

  // shade: darker where less light arrives (three bands so the gap can stay bright)
  if (gp) {
    const a = clamp(gp.gx - gp.gw, L, R), b = clamp(gp.gx + gp.gw, L, R);
    shade(c, G, L, a, light); shade(c, G, a, b, (mm) => lightGap(mm, gp.o)); shade(c, G, b, R, light);
  } else shade(c, G, L, R, light);

  // sunbeams: alpha follows the light model, so they fade as they go down
  const SB = [[0.12, 0.05], [0.3, 0.07], [0.52, 0.045], [0.7, 0.08], [0.88, 0.05]], slant = -ppm * 60 * 0.2;
  SB.forEach(([f, wf], i) => {
    const x0 = L + sw * f, wd = sw * wf, pulse = 0.85 + 0.15 * Math.sin(time * 0.6 + i * 1.7);
    const g = c.createLinearGradient(0, top, 0, groundY);
    for (let mm = 60; mm >= 0; mm -= 3) g.addColorStop(clamp((yOf(mm) - top) / (groundY - top), 0, 1), `rgba(255,240,170,${(0.34 * light(mm) * pulse).toFixed(3)})`);
    c.fillStyle = g; c.beginPath(); c.moveTo(x0 - wd / 2, top); c.lineTo(x0 + wd / 2, top); c.lineTo(x0 + wd / 2 + slant, groundY); c.lineTo(x0 - wd / 2 + slant, groundY); c.closePath(); c.fill();
  });
  if (gp && gp.o > 0.01) {
    const g = c.createLinearGradient(0, yOf(48), 0, groundY);
    g.addColorStop(0, `rgba(255,244,180,${0.5 * gp.o})`); g.addColorStop(1, `rgba(255,244,180,${0.42 * gp.o})`);
    c.fillStyle = g; c.beginPath(); c.moveTo(gp.gx + gp.gw * 0.15, yOf(48)); c.lineTo(gp.gx + gp.gw * 0.95, yOf(48));
    c.lineTo(gp.gx + gp.gw * 0.05, groundY); c.lineTo(gp.gx - gp.gw * 0.85, groundY); c.closePath(); c.fill();
  }

  if (m === 'rain') drawRain(c, G, trunks);
  c.restore();
}

// ---- rain secret: rain falls, roots drink, leaves breathe out vapour, a cloud forms, it rains further on ----
function drawRain(c, G, trunks) {
  const R_ = S.rain, { L, sw, groundY, bottom, ppm, yOf } = G;
  // roots drink: blue dots climb the trunks
  const all = [...trunks.map((tr) => ({ x: tr.x, y: yOf(tr.m) })), ...emergents(G).map((e) => ({ x: e.x, y: yOf(e.m - 3) }))];
  all.forEach((tr, i) => {
    for (let k = 0; k < 4; k++) {
      const u = (R_.t * 0.2 + k / 4 + hash(i * 5)) % 1, yy = lerp(bottom - 4, tr.y, u);
      c.beginPath(); c.arc(tr.x, yy, 2.4, 0, 7); c.fillStyle = '#58b4ff'; c.fill();
    }
  });
  // vapour from the leaves, drifting toward the cloud that is forming
  R_.wisps.forEach((w) => {
    const a = Math.sin(Math.PI * w.life) * 0.32, rad = 6 + w.life * 14;
    c.beginPath(); c.arc(w.x, w.y, rad, 0, 7); c.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`; c.fill();
  });
  // clouds and the rain under them
  R_.clouds.forEach((q, ci) => {
    const grow = smooth(q.age / 5), fade = 1 - smooth((q.age - 12) / 3), size = (0.25 + 0.75 * grow) * clamp(sw * 0.07, 18, 40);
    const rain = smooth((q.age - 5) / 1.5) * (1 - smooth((q.age - 10.5) / 1.2));
    const cx = L + sw * q.x, cy = G.top + 40, g = Math.round(lerp(245, 150, rain));
    [[-1.1, 0.2, 0.7], [-0.45, -0.25, 0.9], [0.35, -0.2, 0.95], [1.05, 0.15, 0.7], [0, 0.3, 1]].forEach(([dx, dy, r]) => {
      c.beginPath(); c.arc(cx + dx * size, cy + dy * size, r * size * 0.6, 0, 7); c.fillStyle = `rgba(${g},${g + 6},${g + 16},${(0.95 * fade).toFixed(3)})`; c.fill();
    });
    if (rain > 0.02) {
      const H = groundY - (cy + size * 0.5), n = 16;
      c.strokeStyle = `rgba(170,210,255,${(0.75 * rain).toFixed(3)})`; c.lineWidth = 1.6; c.lineCap = 'round';
      for (let j = 0; j < n; j++) {
        const yy = (R_.t * ppm * 26 + hash(j * 3 + ci * 7) * H) % H, x = cx + (j / n - 0.5) * size * 2.2 + yy * 0.06;
        c.beginPath(); c.moveTo(x, cy + size * 0.5 + yy); c.lineTo(x + 1.5, cy + size * 0.5 + yy + 9); c.stroke();
      }
    }
  });
}
function updateRain(dt, G) {
  const R_ = S.rain; if (!R_.playing) return;
  R_.t += dt;
  R_.clouds.forEach((q) => { q.age += dt; q.x += dt * 0.008; });
  R_.clouds = R_.clouds.filter((q) => q.age < 15);
  R_.next -= dt;
  if (R_.next <= 0) { R_.next = 7; R_.n++; R_.clouds.push({ x: 0.12 + ((R_.n * 0.37) % 0.7), age: 0 }); }
  R_.acc += dt * 5;
  while (R_.acc > 1) { R_.acc -= 1; R_.wisps.push({ x: G.L + Math.random() * G.sw, y: G.yOf(36 + Math.random() * 6), life: 0 }); }
  const young = R_.clouds.find((q) => q.age < 5), tx = young ? G.L + G.sw * young.x : null;
  R_.wisps.forEach((w) => { w.life += dt / 7; w.y -= G.ppm * 5 * dt; if (tx !== null) w.x += (tx - w.x) * 0.12 * dt; });
  R_.wisps = R_.wisps.filter((w) => w.life < 1);
}

// ---- explorer (climb + gap) ----
function drawExplorer(c, G, m, L) {
  const x = exX(G, m), y = G.yOf(S.hv);
  c.strokeStyle = 'rgba(230,205,150,.8)'; c.lineWidth = 1.6; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(x, G.top + 6); c.lineTo(x, y - 17); c.stroke(); c.setLineDash([]);
  c.beginPath(); c.arc(x, G.top + 6, 3.5, 0, 7); c.fillStyle = '#e6cd96'; c.fill();
  c.beginPath(); c.arc(x, y, 17, 0, 7); c.fillStyle = 'rgba(14,12,8,.85)'; c.fill(); c.strokeStyle = '#f5c84c'; c.lineWidth = 2; c.stroke();
  c.font = emoji(20); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🧗', x, y + 1);
  const txt = pct(Math.round(L * 100)); c.font = font(13); const tw = c.measureText(txt).width + 14;
  rr(c, x + 22, y - 11, tw, 22, 11); c.fillStyle = 'rgba(14,12,8,.8)'; c.fill();
  c.fillStyle = '#ffe9a0'; c.textAlign = 'left'; c.fillText(txt, x + 29, y + 1);
}

// ---- who view: tray, tokens, zones ----
function zoneAt(y, G) {
  if (y >= G.groundY) return 'floor';
  const mm = (G.groundY - y) / G.ppm;
  return mm < 6 ? 'floor' : mm < 30 ? 'under' : mm < 45 ? 'canopy' : 'emergent';
}
function zoneRects(G) {
  const y6 = G.yOf(6), y30 = G.yOf(30), y45 = G.yOf(45);
  return { emergent: [G.top, y45], canopy: [y45, y30], under: [y30, y6], floor: [y6, G.bottom] };
}
function homeOf(G, i) {
  const top = G.bottom + 8;
  if (G.narrow) { const cw = (G.w - 12) / 5, row = i < 5 ? 0 : 1, col = row ? i - 5 + 0.5 : i; return { x: 6 + cw * (col + 0.5), y: top + (G.trayH / 2) * (row + 0.5) }; }
  const cw = (G.w - 12) / 9; return { x: 6 + cw * (i + 0.5), y: top + G.trayH / 2 };
}
function slotOf(G, k, layer) {
  const idx = S.order.filter((q) => S.placed[q] === layer).indexOf(k);
  const x = G.L + G.sw * (0.1 + 0.145 * Math.max(0, idx));
  const y = k === 'ants' ? G.groundY + G.soilH * 0.5 : { floor: G.groundY - 14, under: G.yOf(16), canopy: G.yOf(37.5), emergent: G.yOf(52.5) }[layer];
  return { x, y };
}
function drawWho(c, G, dt, time) {
  const t = T[lang], dragK = S.drag?.k;
  if (S.drag) {
    const zr = zoneRects(G), tk = S.tok[dragK], hot = tk.y < G.bottom && tk.x > G.L && tk.x < G.R ? zoneAt(tk.y, G) : null;
    c.save(); rr(c, G.L, G.top, G.sw, G.bottom - G.top, 14); c.clip();
    for (const z of LAYERS) { c.fillStyle = z === hot ? 'rgba(255,255,255,.2)' : 'rgba(255,255,255,.05)'; c.fillRect(G.L, zr[z][0], G.sw, zr[z][1] - zr[z][0]); }
    c.restore();
  }
  // tray
  rr(c, 4, G.bottom + 6, G.w - 8, G.trayH + 4, 14); c.fillStyle = 'rgba(8,14,10,.55)'; c.fill(); c.strokeStyle = 'rgba(130,145,190,.25)'; c.lineWidth = 1; c.stroke();
  ANIMALS.forEach((a, i) => {
    const hm = homeOf(G, i); c.beginPath(); c.arc(hm.x, hm.y, 21, 0, 7); c.strokeStyle = 'rgba(130,145,190,.3)'; c.setLineDash([3, 4]); c.stroke(); c.setLineDash([]);
  });
  const order = [...ANIMALS].sort((a, b) => (a.k === dragK) - (b.k === dragK));
  order.forEach((a) => {
    const i = ANIMALS.indexOf(a), hm = homeOf(G, i), tk = S.tok[a.k] ??= { x: hm.x, y: hm.y, r: 21 };
    const placed = S.placed[a.k], tgt = placed ? slotOf(G, a.k, placed) : hm, r = placed ? 17 : 21;
    if (dragK !== a.k) { const k = 1 - Math.exp(-dt * 12); tk.x += (tgt.x - tk.x) * k; tk.y += (tgt.y - tk.y) * k; tk.r = lerp(tk.r, r, k); }
    else tk.r = lerp(tk.r, 25, 1 - Math.exp(-dt * 14));
    c.beginPath(); c.arc(tk.x, tk.y, tk.r, 0, 7); c.fillStyle = 'rgba(10,16,12,.8)'; c.fill();
    c.strokeStyle = placed ? '#3ddc97' : dragK === a.k ? '#fff' : 'rgba(230,205,150,.7)'; c.lineWidth = 2; c.stroke();
    c.font = emoji(tk.r * 1.1); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(a.emo, tk.x, tk.y + 1);
  });
  const sel = dragK || S.sel;
  if (sel) {
    const tk = S.tok[sel], name = cap(t.animalName[sel]); c.font = font(13); const tw = c.measureText(name).width + 18;
    const px = clamp(tk.x - tw / 2, 4, G.w - tw - 4), py = tk.y - tk.r - 26;
    rr(c, px, py, tw, 22, 11); c.fillStyle = 'rgba(255,255,255,.95)'; c.fill();
    c.fillStyle = '#10131e'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(name, px + tw / 2, py + 12);
  }
}

// scale on the left, layer names on the right
function drawFrame(c, G, m) {
  const t = T[lang];
  c.textBaseline = 'middle';
  for (let mm = 0; mm <= 50; mm += 10) {
    const y = G.yOf(mm);
    c.strokeStyle = 'rgba(198,205,224,.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(G.L - 5, y); c.lineTo(G.L, y); c.stroke();
    c.font = font(12, 700); c.fillStyle = '#c6cde0'; c.textAlign = 'right'; c.fillText(mm ? `${mm} ${t.m}` : '0', G.L - 8, y);
  }
  c.setLineDash([4, 5]); c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1;
  for (const mm of [3, 30, 45]) { c.beginPath(); c.moveTo(G.L, G.yOf(mm)); c.lineTo(G.R, G.yOf(mm)); c.stroke(); }
  c.setLineDash([]);
  const cur = m === 'climb' ? layerOf(S.h) : m === 'gap' ? 'floor' : null;
  const ys = { floor: G.groundY - 9, under: G.yOf(16.5), canopy: G.yOf(37.5), emergent: G.yOf(52.5) };
  c.font = font(12);
  LAYERS.forEach((z) => {
    const name = t.layerName[z], tw = c.measureText(name).width + 14, x = G.R - 6 - tw;
    rr(c, x, ys[z] - 10, tw, 20, 10); c.fillStyle = cur === z ? 'rgba(255,255,255,.92)' : 'rgba(8,14,10,.6)'; c.fill();
    c.fillStyle = cur === z ? '#10131e' : '#eaf3e6'; c.textAlign = 'center'; c.fillText(name, x + tw / 2, ys[z] + 1);
  });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const m = mode(), G = S.G = geom(w, h, m);
  if (m === 'climb' && S.auto) { S.autoT += dt; const u = clamp(S.autoT / 4, 0, 1); S.h = lerp(1, 52, smooth(u)); if (u >= 1) S.auto = false; }
  if (m === 'gap' && S.fallT !== null && S.fallT < 1) { S.fallT = Math.min(1, S.fallT + dt / 2.2); if (S.fallT >= 1) { sfx.snap(); render(); } }
  if (m === 'rain') updateRain(dt, G);
  S.hv = m === 'gap' ? 1 : lerp(S.hv, S.h, 1 - Math.exp(-dt * 12));
  drawScene(c, G, m, time);
  if (m === 'climb' && S.answered) drawExplorer(c, G, m, light(S.h));
  else if (m === 'gap') drawExplorer(c, G, m, lightGap(1, gapO()));
  else if (m === 'who') drawWho(c, G, dt, time);
  drawFrame(c, G, m);
  // keep the text in step with the picture
  const L = m === 'climb' ? light(S.h) : m === 'gap' ? lightGap(1, gapO()) : 0;
  const sig = [m, lang, Math.round(L * 200), Math.round(S.h), S.years].join('|');
  if (sig !== S.sig) { S.sig = sig; render(); }
});

// ---- pointer: climb drags the explorer, who drags the animals ----
const pos = (ev) => { const r = $('cv').getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
const setH = (y) => {
  const G = S.G; S.h = clamp((G.groundY - y) / G.ppm, 0, 60); S.auto = false;
  const l = layerOf(S.h); if (l !== S.lastLayer) { S.lastLayer = l; sfx.tick(); }
};
$('cv').addEventListener('pointerdown', (ev) => {
  const m = mode(), G = S.G; if (!G) return;
  const { x, y } = pos(ev);
  if (m === 'climb' && S.answered) { S.dragH = true; $('cv').setPointerCapture(ev.pointerId); setH(y); }
  else if (m === 'who') {
    let best = null, bd = 1e9;
    for (const a of ANIMALS) { const tk = S.tok[a.k]; if (!tk) continue; const d = Math.hypot(tk.x - x, tk.y - y); if (d < tk.r + 8 && d < bd) { best = a.k; bd = d; } }
    if (!best) return;
    $('cv').setPointerCapture(ev.pointerId);
    if (S.placed[best]) { delete S.placed[best]; S.order = S.order.filter((q) => q !== best); }
    S.drag = { k: best, lift: ev.pointerType === 'touch' ? -30 : 0 }; S.sel = best;
    const tk = S.tok[best]; tk.x = x; tk.y = y + S.drag.lift; sfx.click(); render();
  }
});
$('cv').addEventListener('pointermove', (ev) => {
  const { x, y } = pos(ev);
  if (S.dragH) setH(y);
  else if (S.drag) { const tk = S.tok[S.drag.k]; tk.x = x; tk.y = y + S.drag.lift; }
});
const release = () => {
  S.dragH = false;
  if (!S.drag) return;
  const k = S.drag.k, tk = S.tok[k], G = S.G; S.drag = null;
  const a = ANIMALS.find((q) => q.k === k);
  if (tk.y >= G.bottom || tk.x <= G.L || tk.x >= G.R) { S.msg = null; sfx.click(); return render(); } // dropped back in the tray
  const zone = zoneAt(tk.y, G);
  if (a.ok.includes(zone)) { S.placed[k] = zone; S.order.push(k); S.msg = { k, ok: true }; sfx.good(); }
  else { S.msg = { k, ok: false, zone }; sfx.bad(); }
  render();
};
$('cv').addEventListener('pointerup', release);
$('cv').addEventListener('pointercancel', release);
render();
</script>
