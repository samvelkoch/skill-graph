      for (let k = 1; k < 7; k++) if (v !== 'walk' || (S.fa[k - 1] > 0.5 && S.fa[k] > 0.5)) { c.moveTo(px(LON0 - 6), py(BND[k])); c.lineTo(px(LON0 + 6), py(BND[k])); }

      c.strokeStyle = 'rgba(255,214,90,.3)'; c.lineWidth = 1 / s; c.setLineDash([3 / s, 5 / s]);

  }
  if (v === 'riv' && !gated) {
    if (S.layer === 'p') {

      for (const [lo, la, r, k] of GLOW) { const g = c.createRadialGradient(px(lo), py(la), 0, px(lo), py(la), r * 10); g.addColorStop(0, `rgba(255,150,40,${0.7 * k})`); g.addColorStop(1, 'rgba(255,150,40,0)'); c.fillStyle = g; c.beginPath(); c.arc(px(lo), py(la), r * 10, 0, 7); c.fill(); }
      c.strokeStyle = 'rgba(255,150,40,.4)'; c.lineWidth = 16; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); RIV.nile.filter((p) => p[1] < py(22)).forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.stroke();
      c.restore();
    }
    const drawR = (pts, sel, key) => {
      c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])));
      c.lineCap = 'round'; c.lineJoin = 'round';
      c.strokeStyle = 'rgba(8,30,50,.7)'; c.lineWidth = (sel ? 5.2 : 3.6) / s; c.stroke();
      c.strokeStyle = sel ? '#bfe6ff' : '#69b6e6'; c.lineWidth = (sel ? 3 : 2) / s; c.stroke();
      if (sel) { c.setLineDash([10 / s, 14 / s]); c.lineDashOffset = -time * 40 / s; c.strokeStyle = '#ffffff'; c.lineWidth = 1.4 / s; c.stroke(); c.setLineDash([]); c.lineDashOffset = 0; }
    };
    for (const k of RIVERS) { drawR(RIV[k], S.riv === k, k); if (k === 'nile') drawR(RIV.blue, S.riv === 'nile', 'blue'); }
    // after the Nile guess: rain rings over the highlands that feed it
    if (S.p3 !== null) {
      const k = clamp01((time - S.p3T) / 0.8);
      for (const [lo, la] of [TANA, VICT]) { const ph = (time * 0.8) % 1; c.strokeStyle = `rgba(110,190,255,${0.9 * (1 - ph) * k})`; c.lineWidth = 2.4 / s; c.beginPath(); c.arc(px(lo), py(la), (10 + 22 * ph) * k / s * 1.1, 0, 7); c.stroke(); c.fillStyle = `rgba(110,190,255,${0.5 * k})`; c.beginPath(); c.arc(px(lo), py(la), 6 / s, 0, 7); c.fill(); }
    }
  }

  c.font = '800 12px Nunito, sans-serif';

      }

    }
  }

    const kx = X(KILI[0]), ky = Y(KILI[1]), fx = X(FALLS[0]), fy = Y(FALLS[1]);
    for (const [key, x, y, sel] of [['kili', kx, ky, S.riv === 'kili'], ['falls', fx, fy, S.riv === 'falls']]) {
      c.save(); c.fillStyle = sel ? '#ffd65a' : '#ffffff'; c.strokeStyle = '#1a2233'; c.lineWidth = 1.5;
      if (key === 'kili') { c.beginPath(); c.moveTo(x - 8, y + 5); c.lineTo(x - 1, y - 8); c.lineTo(x + 3, y - 3); c.lineTo(x + 5, y - 6); c.lineTo(x + 10, y + 5); c.closePath(); c.fill(); c.stroke(); }
      else { c.beginPath(); c.moveTo(x, y - 8); c.bezierCurveTo(x + 8, y + 1, x + 6, y + 8, x, y + 8); c.bezierCurveTo(x - 6, y + 8, x - 8, y + 1, x, y - 8); c.fill(); c.stroke(); }
      c.restore();
      pill(c, box, t.r[key + 'N'], x + (key === 'kili' ? -10 : 10), y - 11, key === 'kili' ? 'r' : 'l', sel ? '#ffd65a' : '#fff', boxes);
    }
    if (S.p3 !== null && S.p3T > 0) pill(c, box, t.r.hi, X(TANA[0]) - 10, Y(TANA[1]) - 28, 'r', '#9fd4ff', boxes);
    pill(c, box, S.layer === 'p' ? t.r.ppl : t.r.approx, m.x + 8, m.y + m.h - 30, 'l', '#98A0B8', boxes);
  } else if (v !== 'riv') {
    pill(c, box, t.schem, m.x + 8, m.y + m.h - 30, 'l', '#98A0B8', boxes);

}

// --- drawing: the rain chart (7 bars for the year, or 12 bars for one station) -------------------------------------

  c.font = '800 12px Nunito, sans-serif'; c.textBaseline = 'middle';

    c.strokeStyle = 'rgba(255,255,255,.28)'; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(x0 + cw * 3.5, top - 4); c.lineTo(x0 + cw * 3.5, base); c.stroke(); c.setLineDash([]);
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.moveTo(x0, base + 0.5); c.lineTo(x1, base + 0.5); c.stroke();
    for (let i = 0; i < 7; i++) {

      S.ba[i] += ((found ? 1 : 0) - S.ba[i]) * Math.min(1, dt * 5);
      if (S.mirror && i < 3 && lab.view === 'walk' && S.found[i]) { // a ghost of the north bar over its partner in the south

    }

    const cw = (x1 - x0) / 12, bw = cw * 0.7;
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.moveTo(x0, base + 0.5); c.lineTo(x1, base + 0.5); c.stroke();

      const tgt = st.m[k] / Math.max(mx, 1) * ph; S.mb[k] += (tgt - S.mb[k]) * Math.min(1, dt * 8);

}

// --- the draw loop -------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view, L = layout(w, h, v), gated = v !== 'walk' && S.p1 === null;
  // easing of the traveller, the month and the belts' tint
  const old = S.latShow;
  S.latShow += (S.lat - S.latShow) * (1 - Math.exp(-dt * 2.6));
  if (Math.abs(S.lat - S.latShow) < 0.02) S.latShow = S.lat;
  S.moving = Math.abs(S.lat - S.latShow);
  const lo = Math.min(old, S.latShow), hi = Math.max(old, S.latShow);
  if (S.p1 !== null) for (let i = 0; i < 7; i++) if (BND[i] >= lo && BND[i + 1] <= hi) S.found[i] = true;
  S.found[zoneAt(S.latShow)] = S.p1 !== null ? true : S.found[zoneAt(S.latShow)];
  for (let i = 0; i < 7; i++) S.fa[i] += ((S.found[i] ? 1 : 0) - S.fa[i]) * Math.min(1, dt * 3);
  const tTarget = S.m + 0.5;
  S.tShow += (tTarget - S.tShow) * (1 - Math.exp(-dt * 3));
  if (Math.abs(tTarget - S.tShow) < 0.005) S.tShow = tTarget;
  const zk = zoneAt(S.latShow);
  if (v === 'walk') { if (S.zk.cur !== zk) { S.zk = { cur: zk, prev: S.zk.cur, t: 0 }; } S.zk.t = Math.min(1, S.zk.t + dt * 2.5); }
  drawMap(c, L.map, time, dt);
  GEO.wide = L.wide; GEO.scene = L.scene;
  if (v === 'riv') {
    const key = gated ? 'for' : S.riv === 'kili' || S.riv === 'falls' ? S.riv : S.riv === 'zam' ? 'falls' : S.riv === 'nile' ? 'riv-des' : S.riv === 'congo' ? 'riv-for' : 'riv-sav';
    if (gated) scene(c, 3, L.scene, time); else scene(c, key, L.scene, time);
    GEO.chart = null;
  } else if (v === 'walk') {
    const R = L.scene;
    if (S.zk.t < 1 && S.zk.prev !== S.zk.cur) { scene(c, S.zk.prev, R, time, { walker: true, moving: S.moving > 0.02 }); c.globalAlpha = eIO(S.zk.t); scene(c, S.zk.cur, R, time, { walker: true, moving: S.moving > 0.02 }); c.globalAlpha = 1; }
    else scene(c, S.zk.cur, R, time, { walker: true, moving: S.moving > 0.02 });
    drawChart(c, L.chart, 'year', dt);
  } else {
    scene(c, gated ? 3 : S.sel, L.scene, time);
    if (gated) { c.fillStyle = 'rgba(10,12,20,.8)'; rr(c, L.chart.x, L.chart.y, L.chart.w, L.chart.h, 14); c.fill(); }
    else drawChart(c, L.chart, S.p2 === null ? 'year' : 'month', dt);
  }
  if (!gated && v !== 'riv') {
    const R = L.scene, i = v === 'walk' ? S.zk.cur : S.sel;
    pill(c, R, T[lang].zm[i], R.x + 8, R.y + 8, 'l', '#fff');
  } else if (v === 'riv' && !gated) {
    const R = L.scene, c3 = T[lang].c[S.riv === 'zam' ? 'zam' : S.riv];
    if (c3) pill(c, R, c3.t, R.x + 8, R.y + 8, 'l', '#fff');
  }
});

// --- taps on the picture ---------------------------------------------------------------------------------------------
const latOfY = (y) => { const m = GEO.map; return 38 - (y - m.y - m.oy) / (m.s * 10); };
$('cv').addEventListener('click', (ev) => {
  const rc = $('cv').getBoundingClientRect(), x = ev.clientX - rc.left, y = ev.clientY - rc.top, m = GEO.map, v = lab.view;
  if (!m) return;
  if (v !== 'walk' && S.p1 === null) return;
  const inMap = x >= m.x && x <= m.x + m.w && y >= m.y && y <= m.y + m.h, cx = m.x + m.ox + px(LON0) * m.s;
  if (v === 'walk' && S.p1 !== null) {
    if (inMap && Math.abs(x - cx) < 34) { S.lat = clamp(latOfY(y), LAT_S, LAT_N); sfx.tick(); render(); return; }
    const ch = GEO.chart;
    if (ch && x >= ch.x && x <= ch.x + ch.w && y >= ch.y && y <= ch.y + ch.h) {
      const i = clamp(Math.floor((x - ch.x0) / ((ch.x1 - ch.x0) / 7)), 0, 6);
      if (S.found[i]) { S.lat = zoneMid(i); sfx.tick(); render(); }
    }
  } else if (v === 'rain') {
    if (inMap) {
      let best = -1, bd = 40;
      ST.forEach((st, i) => { const d = Math.hypot(x - (m.x + m.ox + px(st.lon) * m.s), y - (m.y + m.oy + py(st.lat) * m.s)); if (d < bd) { bd = d; best = i; } });
      if (best < 0 && Math.abs(x - cx) < 34) best = zoneAt(latOfY(y));
      if (best >= 0) { S.sel = best; sfx.tick(); render(); }
    }
    const ch = GEO.chart;
    if (S.p2 !== null && ch && ch.mode === 'month' && x >= ch.x && x <= ch.x + ch.w && y >= ch.y && y <= ch.y + ch.h) { S.m = clamp(Math.floor((x - ch.x0) / ((ch.x1 - ch.x0) / 12)), 0, 11); sfx.tick(); render(); }
  } else if (v === 'riv' && inMap) {
    const px2 = (x - m.x - m.ox) / m.s, py2 = (y - m.y - m.oy) / m.s;
    const cand = [['kili', px(KILI[0]), py(KILI[1])], ['falls', px(FALLS[0]), py(FALLS[1])]];
    let best = null, bd = 26 / m.s;
    for (const [k, a, b] of cand) { const d = Math.hypot(px2 - a, py2 - b); if (d < bd) { bd = d; best = k; } }
    if (!best) for (const k of RIVERS) for (const p of RIV[k]) { const d = Math.hypot(px2 - p[0], py2 - p[1]); if (d < Math.min(bd, 16 / m.s)) { bd = d; best = k; } }
    if (best) { S.riv = best; S.layer = 'r'; sfx.tick(); render(); }
  }
});

// --- controls ---------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function predHTML(key, P, p) {
  const opts = P.opts.map((o, i) => {
    let cls = 'ab-opt';
    if (p !== null) cls += i === P.ok ? ' good' : i === p ? ' bad' : ' dim';
    return `<button class="${cls}" data-pred="${key}" data-i="${i}"${p !== null ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  const verdict = p === null ? '' : `<div class="ab-v ${p === P.ok ? 'good' : 'bad'}">${esc(p === P.ok ? P.right : P.wrong)}</div>`;
  return `<div class="ab-q">${esc(P.q)}</div><div class="ab-opts">${opts}</div>${verdict}`;
}
$('ctrlBody').addEventListener('click', (ev) => {
  const pb = ev.target.closest('[data-pred]');
  if (pb) {
    const k = pb.dataset.pred, i = +pb.dataset.i, P = T[lang][k], ok = i === P.ok;
    (ok ? sfx.good : sfx.bad)();
    if (k === 'p1') { S.p1 = i; S.p1T = now(); S.lat = -9; S.found[3] = true; }
    else if (k === 'p2') { S.p2 = i; S.p2T = now(); S.m = 6; }
    else { S.p3 = i; S.p3T = now(); }
    showStage(); render(); return;
  }
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'north' || act === 'south') {
    const z = zoneAt(S.lat), nz = clamp(z + (act === 'south' ? 1 : -1), 0, 6);
    if (nz !== z) S.lat = zoneMid(nz); else S.lat = act === 'south' ? LAT_S : LAT_N;
    sfx.click();
  } else if (act === 'mirror') { S.mirror = !S.mirror; sfx.click(); }
  else if (act === 'zone') { S.sel = +b.dataset.i; sfx.tick(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (S.p2 === null) return;
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; if (S.sec === 'tilt') S.tilt = 23.44; sfx.click();
  } else if (act === 'riv') { S.riv = b.dataset.k; S.layer = 'r'; sfx.click(); }
  else if (act === 'layer') { S.layer = b.dataset.k; sfx.click(); }
  else if (act === 'gate') { document.querySelector('#views [data-view="walk"]')?.click(); return; }
  render();
});
$('abLat').addEventListener('input', () => { S.lat = LAT_N - (+$('abLat').value / 1000) * (LAT_N - LAT_S); render(); });
$('abMon').addEventListener('input', () => { S.m = +$('abMon').value; render(); });
$('abTilt').addEventListener('input', () => { S.tilt = +$('abTilt').value; render(); });

// --- one render per change: controls, readout and the state card ------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, gated = v !== 'walk' && S.p1 === null;
  $('abWalk').hidden = v !== 'walk'; $('abRain').hidden = v !== 'rain' || gated; $('abRiv').hidden = v !== 'riv' || gated; $('abGate').hidden = !gated;
  if (gated) {
    $('abGate').innerHTML = `<b>${esc(t.gate.t)}</b><p>${esc(t.gate.l)}</p><button class="btn" data-act="gate">${esc(t.gate.b)}</button>`;
    lab.setReadout('?', '', '', '#3fb0a5'); lab.setFacts([]);
    lab.setState({ emo: '🧭', title: t.gate.t, lead: t.gate.l, body: '', extra: '' });
    return;
  }
  if (v === 'walk') renderWalk(t); else if (v === 'rain') renderRain(t); else renderRiv(t);
}
function renderWalk(t) {
  lab.setGlow('rgba(63, 176, 165, .26)');
  $('abP1').innerHTML = predHTML('p1', t.p1, S.p1);
  $('abWalkCtl').hidden = S.p1 === null;
  const found = S.found.filter(Boolean).length, z = zoneAt(S.lat), kind = KIND[z];
  if (S.p1 === null) {
    lab.setReadout('0°', t.eq, '', '#2a8c4e');
    lab.setState({ emo: '🌳', title: t.zn[3], lead: t.w.preT + '. ' + t.w.preL, body: '', extra: '' });
    lab.setFacts([t.facts.w[1]]);
    return;
  }
  $('abEndN').textContent = t.w.endN; $('abEndS').textContent = t.w.endS;
  $('abLat').setAttribute('aria-label', t.w.aria);
  $('abLat').value = String(Math.round((LAT_N - S.lat) / (LAT_N - LAT_S) * 1000));
  const trk = [], tot = LAT_N - LAT_S;
  for (let i = 0; i < 7; i++) { const a = (LAT_N - BND[i]) / tot * 100, b = (LAT_N - BND[i + 1]) / tot * 100, col = S.found[i] ? COL[KIND[i]] : '#4a5068'; trk.push(`${col} ${a}% ${b}%`); }
  $('abLat').style.setProperty('--track', `linear-gradient(90deg, ${trk.join(', ')})`);
  $('abBN').textContent = t.w.n; $('abBS').textContent = t.w.s; $('abMir').textContent = t.w.mir; $('abMir').classList.toggle('on', S.mirror);
  lab.setReadout(latStr(S.lat), t.zn[z], t.yr(fmt(YEAR[z])), COL[kind]);
  const extra = (S.mirror ? `<div class="ab-mir"><b>${esc(t.w.mirT)}</b>${esc(t.w.mirL)}<br>${esc(t.w.mirB)}</div>` : '') + `<div class="ab-fine">${esc(t.w.found(found))}</div>`;
  lab.setState({ emo: EMO[kind], title: t.zn[z], lead: t.zd[z][0], body: (z === 2 || z === 4) && S.p2 === null ? t.zdw[z === 2 ? 0 : 1] : t.zd[z][1], extra });
  const facts = [...t.facts.w]; if (S.found[5]) facts.push(t.facts.wNamib);
  lab.setFacts(facts);
}
function renderRain(t) {
  lab.setGlow('rgba(79, 166, 232, .26)');
  $('abP2').innerHTML = predHTML('p2', t.p2, S.p2);
  $('abZ').innerHTML = t.zs.map((n, i) => `<button class="chip ${S.sel === i ? 'on' : ''}" data-act="zone" data-i="${i}">${esc(n)}</button>`).join('');
  const done = S.p2 !== null, i = S.sel, mm = ST[i].m[S.m];
  $('abRainCtl').hidden = !done;
  if (done) {
    $('abMon').value = String(S.m); $('abM0').textContent = t.mo[0]; $('abM1').textContent = t.mo[11]; $('abMonL').textContent = `${t.rn.monthL}: ${t.moFull[S.m]}`;
    $('abTiltBox').hidden = S.sec !== 'tilt'; $('abTilt').value = String(S.tilt); $('abTiltL').textContent = `${t.tiltT(S.tilt.toFixed(1))}`;
  }
  {
    const open = secret.unlocked() && done;
    $('abSecs').innerHTML = [['sun', '☀️'], ['tilt', '🌍']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`).join('');
  }
  lab.setReadout(done ? `${t.moFull[S.m]}` : `≈ ${fmt(YEAR[i])} ${t.mm}`, done ? `${t.st[i]} · ${t.zm[i]}` : `${t.zm[i]} · ${t.st[i]}`, done ? `${mm < 10 ? mm.toFixed(1) : fmt(mm)} ${t.mm}` : '', COL[KIND[i]]);
  if (!done) {
    lab.setState({ emo: EMO[KIND[i]], title: t.zn[i], lead: t.rn.preL(fmt(YEAR[i]), t.st[i]), body: '', extra: '' });
    lab.setFacts(t.facts.rPre);
    return;
  }
  const tilt = S.sec === 'tilt' ? S.tilt : 23.44, bl = beltAt(S.m + 0.5, tilt), k = bl > 3 ? 'n' : bl < -3 ? 's' : 'e';
  if (S.sec === 'sun') lab.setState({ emo: '☀️', title: t.sunT(latStr(sunLat(S.m + 0.5, 23.44))), lead: t.sunL, body: t.sunB, extra: '' });
  else if (S.sec === 'tilt') lab.setState({ emo: '🌍', title: t.tiltT(S.tilt.toFixed(1)), lead: S.tilt < 0.5 ? t.tiltL0 : t.tiltL, body: t.tiltB, extra: '' });
  else lab.setState({ emo: '🌧️', title: t.rn.t(t.moFull[S.m], k), lead: t.rn.l(t.st[i], mm < 10 ? mm.toFixed(1) : fmt(mm), fmt(YEAR[i])), body: t.zd[i][1], extra: `<div class="ab-fine">${esc(t.schemRain)}</div>` });
  lab.setFacts(t.facts.rPost);
}
function renderRiv(t) {
  lab.setGlow('rgba(100, 170, 230, .26)');
  $('abP3').innerHTML = predHTML('p3', t.p3, S.p3);
  const keys = [...RIVERS, 'falls', 'kili'];
  $('abR').innerHTML = `<button class="chip ${S.layer === 'r' ? 'on' : ''}" data-act="layer" data-k="r">${esc(t.r.layerR)}</button><button class="chip ${S.layer === 'p' ? 'on' : ''}" data-act="layer" data-k="p">${esc(t.r.layerP)}</button>`
    + keys.map((k) => `<button class="chip ${S.riv === k ? 'on' : ''}" data-act="riv" data-k="${k}">${esc(t.r[k])}</button>`).join('');
  const k = S.riv, c3 = t.c[k], done = S.p3 !== null;
  const isNile = k === 'nile';
  if (S.layer === 'p') {
    const p = t.c.ppl;
    lab.setReadout(p.v, p.s, '', '#ff9a3c'); lab.setState({ emo: p.e, title: p.t, lead: p.l, body: p.b, extra: '' });
  } else {
    lab.setReadout(c3.v, c3.s, '', '#69b6e6');
    lab.setState({ emo: c3.e, title: c3.t, lead: isNile ? (done ? c3.l1 : c3.l0) : c3.l, body: isNile ? (done ? c3.b1 : c3.b0) : c3.b, extra: '' });
  }
  lab.setFacts(done ? [...t.facts.vPost, t.facts.vPre[0]] : t.facts.vPre);
}
render();
</script>
</body>
