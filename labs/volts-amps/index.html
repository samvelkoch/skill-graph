  if (p.id && p.moved) { const z = zoneAt(q); S.m.drag = null; S.m[p.id] = z; (z ? sfx.snap : sfx.click)(); render(); }
  else if (p.id) { S.m.on = false; S.m.sel = S.m.sel === p.id ? null : p.id; sfx.tick(); render(); }
  else if (S.m.sel) { const z = zoneAt(q); if (z) { S.m[S.m.sel] = z; S.m.on = false; sfx.snap(); } S.m.sel = null; render(); }
  else if (GEO && Math.abs(q.x - GEO.lx) < 26 * GEO.k && Math.abs(q.y - GEO.sy) < 34 * GEO.k && bothPlaced() && !S.m.on) { S.m.on = true; sfx.click(); showStage(); render(); }
});
cvEl.addEventListener('pointercancel', () => { if (ptr?.moved) { S.m.drag = null; render(); } ptr = null; });

// --- controls ----------------------------------------------------------------------------------------------------
$('ctrlBody').innerHTML = `
  <div id="va-m">
    <div class="va-q" id="va-mq"></div><div class="va-note" id="va-mnote"></div>
    <div class="va-row"><button class="btn va-b" id="va-on" data-act="on"></button><button class="btn ghost va-b" id="va-show" data-act="show"></button><button class="btn ghost va-b" id="va-reset" data-act="reset"></button></div>
  </div>
  <div id="va-c">
    <div class="va-row"><span class="va-lbl" id="va-cl"></span><div class="va-step"><button data-act="cm" id="va-cm">−</button><b id="va-cn"></b><button data-act="cp" id="va-cp">+</button></div>
      <span class="va-lbl" id="va-rl"></span><div class="chips"><button class="chip" data-r="3">3 Ω</button><button class="chip" data-r="6">6 Ω</button></div></div>
    <div class="va-ask" id="va-ask-c"></div>
    <canvas id="va-g"></canvas>
  </div>
  <div id="va-l"><div class="va-ask" id="va-ask-l"></div><div class="va-row"><button class="btn va-b" id="va-again" data-act="again"></button></div></div>
  <div id="va-s"><div class="chips" id="va-chips"></div><div class="va-row"><button class="btn va-b" id="va-swsec" data-act="swsec"></button></div></div>`;
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-o], [data-r], [data-sec]'); if (!b || b.disabled) return;
  const v = lab.view, c = S.c;
  if (b.dataset.sec) {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.sec; S.sec = S.sec === k ? null : k; S.slow.on = false; S.snail = 20; sfx.click();
  } else if (b.dataset.o !== undefined) {
    const i = +b.dataset.o;
    if (v === 'cells' && c.pend) { c.ans = i; c.pend = false; c.answered = true; c.askOpen = true; (i === T[lang].ask.c.ok ? sfx.good : sfx.bad)(); showStage(); }
    else if (v === 'loop' && S.l.ans === null) { S.l.ans = i; (i === T[lang].ask.l.ok ? sfx.good : sfx.bad)(); showStage(); }
  } else if (b.dataset.r) { c.R = +b.dataset.r; c.askOpen = false; sfx.tick(); }
  else {
    const a = b.dataset.act;
    if (a === 'on' && bothPlaced()) { S.m.on = true; sfx.click(); showStage(); }
    else if (a === 'show') { S.m.A = 'loop'; S.m.V = 'across'; S.m.on = true; S.sw = 0; S.cur = 0; S.curR = 0; sfx.good(); }
    else if (a === 'reset') { S.m = { A: null, V: null, on: false, sel: null, drag: null }; sfx.click(); }
    else if (a === 'cp' && c.n < 4) { c.n++; c.popAt = now(); c.askOpen = false; if (c.n === 2 && !c.answered) { c.pend = true; c.ans = null; c.askOpen = true; } sfx.tick(); }
    else if (a === 'cm' && c.n > 1) { c.n--; c.askOpen = false; sfx.tick(); }
    else if (a === 'again') { S.l.ans = null; sfx.click(); }
    else if (a === 'swsec') { S.slow.on = !S.slow.on; sfx.click(); }
  }
  render();
});

// --- one render per change: controls, readout, state card, facts ---------------------------------------------
const setS = (a) => lab.setState({ emo: a[0], title: a[1], lead: a[2], body: a[3], extra: a[4] || '' });
const show = (id, on_) => { $(id).style.display = on_ ? '' : 'none'; };
function askHTML(t, key, ans) {
  const q = t.ask[key];
  const opts = q.opts.map((o, i) => `<button class="va-opt ${ans === null ? '' : i === q.ok ? 'good' : i === ans ? 'bad' : ''}" data-o="${i}" ${ans === null ? '' : 'disabled'}>${esc(o)}</button>`).join('');
  const verd = ans === null ? '' : `<div class="va-v" style="color:${ans === q.ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ans === q.ok ? t.right : t.wrong)}</div>`;
  return `<div class="va-q">${esc(q.q)}</div><div class="va-opts">${opts}</div>${verd}`;
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  document.body.dataset.v = v;
  show('va-m', v === 'meters' && !sec); show('va-c', v === 'cells' && !sec); show('va-l', v === 'loop' && !sec);
  $('va-chips').innerHTML = ['a', 'b'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${sec === (k === 'a' ? 'slow' : 'par') ? 'on' : ''}" data-sec="${k === 'a' ? 'slow' : 'par'}">${open ? `${k === 'a' ? '🐌' : '⚡'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('va-swsec').textContent = S.slow.on ? t.swOff : t.sw; show('va-swsec', sec === 'slow');
  if (sec) renderSec(t, sec); else if (v === 'meters') renderM(t); else if (v === 'cells') renderC(t); else renderL(t);
  lab.setFacts(t.facts[v]);
}
function renderSec(t, sec) {
  const k = sec === 'slow' ? 'a' : 'b';
  setS([sec === 'slow' ? '🐌' : '⚡', t.secrets[k][0], t.secrets[k][1], t.secBody[k]]);
  if (sec === 'slow') lab.setReadout(S.slow.on ? '💡' : '—', '', '', '#ffd54a');
  else lab.setReadout(`${num(1, 2)} ${t.uA}`, `${num(0.5, 2)} ${t.uA} + ${num(0.5, 2)} ${t.uA}`, `${num(1.5, 1)} ${t.uV}`, '#4ea8ff');
}
function renderM(t) {
  const o = m1(), both = bothPlaced(), done = S.m.on && o.kind !== 'idle';
  $('va-mq').textContent = t.q1; $('va-mnote').textContent = done ? '' : (both ? t.note1 : t.note0);
  $('va-on').textContent = t.on; $('va-on').disabled = !both; $('va-on').hidden = done;
  $('va-show').textContent = t.show; $('va-show').hidden = !(done && o.kind !== 'ok');
  $('va-reset').textContent = t.again; $('va-reset').hidden = !(done || S.m.A || S.m.V);
  const u = `${t.uA}`, V0 = num(1.5, 1);
  if (!done) { setS(t.m.start); lab.setReadout('?', '', '', '#4ea8ff'); return; }
  if (o.kind === 'ok') { setS(t.m.ok(num(0.5, 2), V0)); lab.setReadout(`${num(0.5, 2)} ${u} · ${V0} ${t.uV}`, '', '', '#4ea8ff'); }
  else if (o.kind === 'short') { setS(t.m.short()); lab.setReadout(`${t.max} · ${num(0, 1)} ${t.uV}`, '', t.shortC, '#e5484d'); }
  else { setS(t.m[o.key](V0)); lab.setReadout(`${num(0, 2)} ${u} · ${V0} ${t.uV}`, '', '', '#4ea8ff'); }
}
function renderC(t) {
  const c = S.c, V = 1.5 * c.n, I = V / c.R;
  $('va-cl').textContent = t.cellsL; $('va-rl').textContent = t.resL; $('va-cn').textContent = c.n;
  $('va-cm').disabled = c.n <= 1 || c.pend; $('va-cp').disabled = c.n >= 4 || c.pend;
  document.querySelectorAll('#va-c [data-r]').forEach((b) => { b.classList.toggle('on', +b.dataset.r === c.R); b.disabled = c.pend; });
  const askOn = c.pend || (c.askOpen && c.ans !== null);
  show('va-ask-c', askOn); if (askOn) $('va-ask-c').innerHTML = askHTML(t, 'c', c.ans);
  if (!c.pend) c.pts.add(`${c.n}|${c.R}`);
  if (c.pend) { setS(t.c.pend); lab.setReadout('?', '', '', '#ffb04a'); }
  else {
    setS(!c.answered && c.n === 1 ? t.c.idle : t.c.free(c.n, c.R, num(V, 1), num(I, 2)));
    lab.setReadout(`${num(I, 2)} ${t.uA}`, `${num(V, 1)} ${t.uV} ${t.div} ${c.R} Ω`, '', '#ffb04a');
  }
  drawGraph();
}
function renderL(t) {
  const l = S.l, ok = l.ans === t.ask.l.ok;
  $('va-ask-l').innerHTML = askHTML(t, 'l', l.ans);
  $('va-again').textContent = t.again; $('va-again').hidden = l.ans === null;
  if (l.ans === null) { setS(t.l.pre); lab.setReadout('?', '', '', '#3ddc97'); }
  else { setS(t.l.post(ok, num(0.5, 2), num(1.5, 1), num(3, 1))); lab.setReadout(`${num(0.5, 2)} ${t.uA}`, `${num(1.5, 1)} ${t.uV} + ${num(1.5, 1)} ${t.uV}`, '', '#3ddc97'); }
}

// --- graph: voltage against current, one point per setting that has been seen ----------------------------------
function drawGraph() {
  const cvg = $('va-g'); if (!cvg || lab.view !== 'cells' || S.sec) return;
  const r = cvg.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2), w = r.width, h = r.height; if (!w || !h) return;
  if (cvg.width !== Math.round(w * d) || cvg.height !== Math.round(h * d)) { cvg.width = Math.round(w * d); cvg.height = Math.round(h * d); }
  const c = cvg.getContext('2d'), t = T[lang], cs = S.c;
  c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, w, h);
  const L = 40, Rr = 14, Tp = 12, B = 28, pw = w - L - Rr, ph = h - Tp - B, X = (x) => L + (x / 6) * pw, Y = (a) => Tp + ph - (a / 2.5) * ph;
  rr(c, L, Tp, pw, ph, 6); c.fillStyle = 'rgba(8,12,22,.6)'; c.fill();
  c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.strokeStyle = 'rgba(130,145,190,.2)'; c.lineWidth = 1;
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (const x of [0, 1.5, 3, 4.5, 6]) { c.beginPath(); c.moveTo(X(x), Tp); c.lineTo(X(x), Tp + ph); c.stroke(); c.fillText(num(x, 1), X(x), Tp + ph + 5); }
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (const a of [0, 0.5, 1, 1.5, 2, 2.5]) { c.beginPath(); c.moveTo(L, Y(a)); c.lineTo(L + pw, Y(a)); c.stroke(); c.fillText(num(a, 1), L - 6, Y(a)); }
  c.textAlign = 'left'; c.textBaseline = 'top'; c.fillStyle = '#EDEFF7'; c.fillText(t.uA, 6, 0); c.textAlign = 'right'; c.fillText(t.uV, w - 2, h - 15);
  const col = { 3: '#ffb04a', 6: '#5fb7ff' };
  for (const R of [3, 6]) {
    const ps = [...cs.pts].map((s) => s.split('|').map(Number)).filter((p) => p[1] === R).map(([n]) => n).sort((a, b) => a - b);
    if (ps.length >= 2) {
      const mx = 1.5 * ps[ps.length - 1];
      c.save(); c.setLineDash([4, 5]); c.lineWidth = 1.6; c.strokeStyle = col[R]; c.globalAlpha = 0.45; c.beginPath(); c.moveTo(X(mx), Y(mx / R)); c.lineTo(X(6), Y(6 / R)); c.stroke(); c.restore();
      c.lineWidth = 2.6; c.strokeStyle = col[R]; c.beginPath(); c.moveTo(X(0), Y(0)); c.lineTo(X(mx), Y(mx / R)); c.stroke();
    }
    for (const n of ps) { c.beginPath(); c.arc(X(1.5 * n), Y(1.5 * n / R), 5, 0, TAU); c.fillStyle = col[R]; c.fill(); c.lineWidth = 1.4; c.strokeStyle = '#0b0e18'; c.stroke(); }
  }
  if (!cs.pend) { c.beginPath(); c.arc(X(1.5 * cs.n), Y(1.5 * cs.n / cs.R), 9, 0, TAU); c.lineWidth = 2; c.strokeStyle = '#ffffff'; c.stroke(); }
  let lx = L + 10; c.textAlign = 'left'; c.textBaseline = 'middle';
  for (const R of [3, 6]) { c.beginPath(); c.arc(lx, Tp + 14, 5, 0, TAU); c.fillStyle = col[R]; c.fill(); c.fillStyle = '#EDEFF7'; c.fillText(`${R} Ω`, lx + 9, Tp + 14.5); lx += 56; }
}
new ResizeObserver(() => drawGraph()).observe($('va-g'));

render();
</script>
</body>
