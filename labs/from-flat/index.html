  if (sec === 'curl') {
    const K = F.curl, k = q.curl;
    $('fSec').innerHTML = `<div class="chips fl-chips">${['thin', 'thick'].map((p) => `<button class="chip ${K.pen === p ? 'on' : ''}" data-a="pen" data-v="${p}">${esc(k[p])}</button>`).join('')}</div>
      <div class="row2"><button class="btn" data-a="cmain">${esc(K.relT ? k.again : K.windT ? k.slide : k.wind)}</button></div>`;
    st = K.relT ? { emo: '🌀', title: k.t2, lead: k.l2 } : K.windT ? { emo: '✏️', title: k.t1, lead: k.l1 } : { emo: '✏️', title: k.t0, lead: k.l0 };
    val = k[K.pen]; sub = '';
  } else if (sec === 'bridge') {
    const B = F.br, k = q.bridge;
    $('fSec').innerHTML = `<div class="chips fl-chips">${['flat', 'zig', 'tube'].map((p) => `<button class="chip ${B.kind === p ? 'on' : ''}" data-a="bk" data-v="${p}">${esc(k[p])}</button>`).join('')}</div>
      <div class="row2"><button class="btn" data-a="bblk"${B.colOn ? ' disabled' : ''}>${esc(k.add)}</button><button class="btn ghost" data-a="bagain">${esc(k.again)}</button></div>`;
    st = B.colOn ? { emo: '💥', title: k.fall, lead: k.fallL[B.kind] } : B.n > 0 ? { emo: '🌉', title: k.holds, lead: k.holdsL } : { emo: '🌉', title: k.t0, lead: k.l0 };
    val = k[B.kind]; sub = ''; pill = B.n > 0 ? '▮'.repeat(Math.min(B.n, 8)) : '';
  } else {
    val = q.folds[F.fold];
    const outc = F.fold === 'none' ? 'fall' : CAP[F.fold] <= 2 ? 'few' : 'many', right = F.guess === outc;
    if (F.guess === null) st = { emo: '📜', title: q.t0, lead: q.l0 };
    else if (!F.said) st = { emo: '📜', title: q.watch, lead: '' };
    else if (F.colOn) st = { emo: '💥', title: q.buckle, lead: q.buckleL };
    else if (F.blocks > 0) st = { emo: '🧱', title: q.hold, lead: q.holdL };
    else {
      const v = right ? q.right : q.wrong;
      st = F.fold === 'none' ? { emo: right ? '✅' : '🤔', title: `${v} ${q.rNone}`, lead: q.rNoneL }
        : CAP[F.fold] <= 2 ? { emo: right ? '✅' : '🤔', title: `${v} ${q.rZig}`, lead: q.rZigL } : { emo: right ? '✅' : '🤔', title: `${v} ${q.rClosed}`, lead: q.rClosedL };
    }
    if (F.said && F.fold !== 'none' && F.blocks > 0) pill = '▮'.repeat(Math.min(F.blocks, 8));
    const hist = Object.entries(F.hist).sort((a, b) => b[1] - a[1]);
    st.extra = (hist.length > 1 ? `<div class="fl-rank"><b>${esc(q.rank)}:</b> ${hist.map(([k, v], i) => `${i ? (v === hist[i - 1][1] ? ' = ' : ' › ') : ''}${esc(q.folds[k])}`).join('')}</div>` : '') + `<div class="fl-fine">${esc(q.fine)}</div>`;
  }
  lab.setReadout(esc(val), sub, pill, '#5fa8a0');
  lab.setState({ body: '', extra: '', ...st });
  lab.setFacts(t.facts.fold);
}

// =============================================================================================================
// VIEW 3: two tree-shaped cards, each with one slot. Slots opening from opposite edges let the cards slide through each other.
// =============================================================================================================
const H3 = 4, SLOT = .07, LIFT = H3 * 1.05;
const PROFILE = [[.28, 0], [.28, .7], [1.55, .7], [.72, 1.8], [1.2, 1.8], [.55, 2.9], [.92, 2.9], [.22, 4]];
const MAT = { top: [[0, H3 / 2]], bottom: [[H3 / 2, H3]], middle: [[0, .3 * H3], [.7 * H3, H3]] }; // where each card has paper along the shared axis
function halfPoly(slot) {
  const s = SLOT, H = H3;
  let start = [0, 0], center;
  if (slot === 'top') center = [[s, H], [s, H / 2], [0, H / 2], [0, 0]];
  else if (slot === 'bottom') { start = [s, 0]; center = [[0, H], [0, H / 2], [s, H / 2]]; }
  else center = [[0, H], [0, .7 * H], [s, .7 * H], [s, .3 * H], [0, .3 * H]];
  return [start, ...PROFILE, ...center];
}
const HP = { top: halfPoly('top'), bottom: halfPoly('bottom'), middle: halfPoly('middle') };
function overlapAt(sl, so, dz) {
  for (const a of MAT[sl]) for (const b of MAT[so]) { const lo = Math.max(a[0] + dz, b[0]), hi = Math.min(a[1] + dz, b[1]); if (hi - lo > 1e-4) return lo; }
  return -1;
}
// lower one card from above onto the other; the first one that gets all the way down wins, otherwise the first jams where it first touches
function plan3(s1, s2) {
  const res = [];
  for (const L of [0, 1]) {
    const sl = L ? s2 : s1, so = L ? s1 : s2;
    let stop = LIFT, hit = -1;
    for (let dz = LIFT; ; dz -= .02) {
      const d = Math.max(0, dz), o = overlapAt(sl, so, d);
      if (o >= 0) { hit = o; break; }
      stop = d; if (d === 0) break;
    }
    res.push({ L, stop, ok: hit < 0, hit });
  }
  return res.find((r) => r.ok) || res[0];
}
const TREE = [[['#9a6a45', .17], ['#2f8f62', .18]], [['#9a6a45', .17], ['#2a8579', .18]]];
function draw3(c, w, h, dt, time) {
  const Q = S.s;
  Q.t = clamp(Q.t + (Q.want ? dt / 2.9 : -dt / .9), 0, 1);
  const D = Q.t > 0 && Q.snap ? Q.snap : { s1: Q.s1, s2: Q.s2, plan: plan3(Q.s1, Q.s2) };
  const pl = easeIO(c01(Q.t / .25)), pm = easeIO(c01((Q.t - .2) / .3)), p2 = easeIO(c01((Q.t - .5) / .5));
  if (Q.want && !Q.said && Q.t >= 1) { Q.said = true; (D.plan.ok ? sfx.good : sfx.bad)(); render(); }
  const sway = Q.t >= 1 && D.plan.ok ? .12 * Math.sin(time * .9) : 0;
  setCam(.72 * pm + sway, .3);
  const L = D.plan.L, dzOf = (i) => (i === L ? lerp(LIFT * pl, D.plan.stop, p2) : 0);
  const cards = [{ px: -2.3 * (1 - pm), th: 0, pz: dzOf(0), slot: D.s1 }, { px: 2.3 * (1 - pm), th: pm * Math.PI / 2, pz: dzOf(1), slot: D.s2 }];
  const W3 = (cd, u, v) => [cd.px + u * Math.cos(cd.th), u * Math.sin(cd.th), cd.pz + v];
  const pts = []; for (const cd of cards) for (const u of [-1.6, 1.6]) for (const v of [0, H3]) pts.push(W3(cd, u, v));
  fitCam(pts, w, h, dt);
  drawStage(c, w, h);
  const polys = [];
  cards.forEach((cd, i) => {
    for (const side of [1, -1]) {
      const P = HP[cd.slot].map(([u, v]) => W3(cd, u * side, v));
      polys.push(P);
      const st = TREE[i];
      add(P, '#2f8f62', { vg: { a: W3(cd, 0, 0), b: W3(cd, 0, H3), stops: [[0, st[0][0]], [st[0][1], st[0][0]], [st[1][1], st[1][0]], [1, i ? '#7fd6c6' : '#7fdc9c']] }, stroke: 'rgba(8,34,22,.8)', lw: 1.2 });
    }
  });
  castShadows(c, polys, .26);
  flush(c);
  if (Q.t < .02) cards.forEach((cd, i) => { const q = pr(cd.px, 0, 0); pillText(c, String(i + 1), q[0], q[1] + 20, w, h); });
  if (Q.t >= 1 && !D.plan.ok) { // where the cards jam
    const q = pr(0, 0, D.plan.hit), r = 14 + 3 * Math.sin(time * 6);
    c.beginPath(); c.arc(q[0], q[1], r, 0, TAU); c.lineWidth = 3; c.strokeStyle = 'rgba(255,90,77,.95)'; c.stroke();
    c.beginPath(); c.arc(q[0], q[1], r * .45, 0, TAU); c.fillStyle = 'rgba(255,90,77,.45)'; c.fill();
  }
}
function renderSlot(t) {
  const Q = S.s, q = t.slot;
  lab.setGlow('rgba(95, 190, 140, .26)');
  const chips = (k) => ['top', 'middle', 'bottom'].map((p) => `<button class="chip ${Q['s' + k] === p ? 'on' : ''}" data-a="sl" data-c="${k}" data-v="${p}">${esc(q.pos[p])}</button>`).join('');
  $('s1L').textContent = q.c1; $('s2L').textContent = q.c2; $('s1C').innerHTML = chips(1); $('s2C').innerHTML = chips(2);
  $('sGuess').hidden = Q.guess !== null;
  if (Q.guess === null) $('sGuess').innerHTML = `<div class="fl-q">${esc(q.ask)}</div><div class="fl-opts">${['yes', 'no'].map((k) => `<button class="fl-opt" data-a="g3" data-v="${k}"><span>${esc(q.opt[k])}</span></button>`).join('')}</div>`;
  $('sAct').hidden = Q.guess === null;
  if (Q.guess !== null) $('sAct').innerHTML = `<button class="btn ghost" data-a="again3">${esc(q.again)}</button>`;
  const plan = Q.snap?.plan, kind = plan?.ok ? 'ok' : (Q.snap && (Q.snap.s1 === 'middle' || Q.snap.s2 === 'middle')) ? 'mid' : 'same';
  lab.setReadout(`${esc(q.pos[Q.s1])} + ${esc(q.pos[Q.s2])}`, q.sub, Q.said ? (plan.ok ? q.pillOk : q.pillNo) : '', '#5fbe8c');
  let st;
  if (Q.guess === null) st = { emo: '🌲', title: q.t0, lead: q.l0 };
  else if (!Q.said) st = { emo: '🌲', title: q.watch, lead: '' };
  else {
    const right = (Q.guess === 'yes') === plan.ok;
    const base = plan.ok ? { title: q.ok, lead: q.okL } : kind === 'mid' ? { title: q.mid, lead: q.midL } : { title: q.same, lead: q.sameL };
    st = { emo: plan.ok ? '🌲' : '💥', title: `${right ? q.right : q.wrong} ${base.title}`, lead: base.lead };
  }
  lab.setState({ body: '', extra: '', ...st });
  lab.setFacts(t.facts.slot);
}

// --- events -----------------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, v = b.dataset.v, P = S.p, F = S.f, Q = S.s;
  if (a === 'g1') { P.guess = v; P.want = 1; P.said = false; P.tries = 0; P.target = 0; P.won = false; (v === 'step' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'up') {
    if (P.want) P.want = 0;
    else { if (P.won || P.target === 0) P.target = pickT(P.len); P.won = false; P.want = 1; P.said = false; P.tries++; showStage(); }
    sfx.click();
  } else if (a === 'fold') { F.fold = v; F.guess = null; F.rt = 0; F.said = false; F.blocks = 0; F.col = 0; F.colOn = false; sfx.click(); }
  else if (a === 'g2') { F.guess = v; F.rt = 0; F.said = false; F.blocks = 0; F.col = 0; F.colOn = false; sfx.click(); showStage(); }
  else if (a === 'blk') {
    if (!F.said || F.fold === 'none' || F.colOn) return;
    F.blocks++; F.drop = 0;
    if (F.blocks > CAP[F.fold]) { F.colOn = true; F.col = .001; F.hist[F.fold] = CAP[F.fold]; sfx.bad(); } else sfx.click();
  } else if (a === 'again2') { F.guess = null; F.rt = 0; F.said = false; F.blocks = 0; F.col = 0; F.colOn = false; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    F.sec = F.sec === b.dataset.k ? null : b.dataset.k; cam.ready = false; sfx.click();
  } else if (a === 'pen') { Object.assign(F.curl, { pen: v, wind: 0, windT: 0, rel: 0, relT: 0 }); sfx.click(); }
  else if (a === 'cmain') {
    const K = F.curl;
    if (K.relT) Object.assign(K, { windT: 0, relT: 0 }); else if (K.windT) K.relT = 1; else K.windT = 1;
    sfx.click();
  } else if (a === 'bk') { Object.assign(F.br, { kind: v, n: 0, sag: BRB[v], col: 0, colOn: false, drop: 1 }); sfx.click(); }
  else if (a === 'bblk') {
    const B = F.br; if (B.colOn) return;
    B.n++; B.drop = 0;
    if (B.n > BRC[B.kind]) { B.colOn = true; B.col = .001; B.sag0 = B.sag; sfx.bad(); } else sfx.click();
  } else if (a === 'bagain') { Object.assign(F.br, { n: 0, sag: BRB[F.br.kind], col: 0, colOn: false, drop: 1 }); sfx.click(); }
  else if (a === 'sl') { Q['s' + b.dataset.c] = v; Q.guess = null; Q.want = 0; Q.said = false; sfx.tick(); }
  else if (a === 'g3') { Q.guess = v; Q.snap = { s1: Q.s1, s2: Q.s2, plan: plan3(Q.s1, Q.s2) }; Q.want = 1; Q.said = false; sfx.click(); showStage(); }
  else if (a === 'again3') { Q.guess = null; Q.want = 0; Q.said = false; sfx.click(); }
  render();
});

// the bridge's resting sag before any block
S.f.br.sag = BRB.zig;

// --- the canvas loop ------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'pop') draw1(c, w, h, dt, time); else if (v === 'fold') draw2(c, w, h, dt, time); else draw3(c, w, h, dt, time);
});

function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secP').hidden = v !== 'pop'; $('secF').hidden = v !== 'fold'; $('secS').hidden = v !== 'slot';
  $('cv').style.touchAction = v === 'pop' ? 'none' : '';
  if (v === 'pop') renderPop(t); else if (v === 'fold') renderFold(t); else renderSlot(t);
}
render();
</script>
