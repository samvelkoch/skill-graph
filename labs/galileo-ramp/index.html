  for (let k = 0; k <= n; k++) { const x = (tcur * k) / n; pts.push([x, spd3(x, fr)]); }
  plot(c, RL, { x0: 0, x1: 4, y0: 0, y1: 3, xt: [[0, '0'], [1, '1'], [2, '2'], [3, '3'], [4, '4']], yt: [[0, '0'], [1, '1'], [2, '2'], [3, '3']], lines: [{ pts, col: '#8fd0ff' }], dot: [tcur, spd3(tcur, fr), '#d8f0ff'] });
  label(c, t.timeCap, RL.x + RL.w / 2, RL.y + RL.h + 29, 'center', 'rgba(190,203,230,.85)', 12.5);
  if (!g) label(c, '?', RL.x + RL.w * 0.72, RL.y + RL.h * 0.45, 'center', 'rgba(210,222,245,.85)', 26);
  // bars: distance in each tick
  const RB = { x: PR.x + 30, y: PR.y + 34, w: 122, h: 148 }, ymax = 1.2, slot = RB.w / 9;
  c.save(); c.lineWidth = 1; c.strokeStyle = 'rgba(140,165,210,.18)';
  for (const v of [0.5, 1]) { const y = RB.y + RB.h - (v / ymax) * RB.h; c.beginPath(); c.moveTo(RB.x, y); c.lineTo(RB.x + RB.w, y); c.stroke(); label(c, nf(v, 1), RB.x - 5, y, 'right', 'rgba(190,203,230,.85)', 12.5); }
  c.strokeStyle = 'rgba(190,203,230,.55)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(RB.x, RB.y); c.lineTo(RB.x, RB.y + RB.h); c.lineTo(RB.x + RB.w, RB.y + RB.h); c.stroke();
  c.restore();
  tick.forEach((k) => {
    if (k.k > 9 || !(tt >= k.t) || (!g && k.s > L3)) return;
    const bh = (k.g / ymax) * RB.h, x = RB.x + slot * (k.k - 0.5) - 5, y = RB.y + RB.h - bh, flat = k.s > L3;
    c.fillStyle = lg(c, 0, y, 0, RB.y + RB.h, flat ? [[0, '#8fd8ff'], [1, '#2f78b4']] : [[0, '#ffe08a'], [1, '#c28a1e']]); rr(c, x, y, 10, bh, 3); c.fill();
  });
  for (let k = 1; k <= 9; k += 2) label(c, String(k), RB.x + slot * (k - 0.5), RB.y + RB.h + 12, 'center', 'rgba(190,203,230,.85)', 12.5);
  label(c, t.tickWord, RB.x + RB.w / 2, RB.y + RB.h + 29, 'center', 'rgba(190,203,230,.85)', 12.5);
  if (!g) label(c, '?', RB.x + RB.w * 0.7, RB.y + RB.h * 0.5, 'center', 'rgba(210,222,245,.85)', 26);
  void time;
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const s = Math.min(w / W, h / H); SC = s;
  const ox = (w - W * s) / 2, oy = (h - H * s) / 2; GEO = { s, ox, oy };
  c.save(); c.translate(ox, oy); c.scale(s, s);
  const v = lab.view;
  if (v === 'bells') drawV1(c, time, dt); else if (v === 'graphs') drawV2(c, time, dt); else drawV3(c, time, dt);
  c.restore();
});

// --- dragging the bells (view 1, after the guess) -------------------------------------------------------------------
const cv = $('cv');
const toDesign = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - GEO.ox) / GEO.s, (ev.clientY - r.top - GEO.oy) / GEO.s]; };
const pFromX = (x) => clamp(Math.round(((x - X1) / K1) * 2) / 2, 0.5, 35.5);
const restart1 = () => { R1.t = 0; R1.ring = {}; };
function moveBell(id, p) {
  if (S.bells.some((b) => b.id !== id && Math.abs(b.p - p) < 0.5)) return false;
  S.bells.find((b) => b.id === id).p = p; S.last1 = 'drag'; restart1(); return true;
}
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'bells' || S.g1 === null) return;
  const [x, y] = toDesign(ev); let best = null, bd = 99;
  for (const b of S.bells) {
    const [px, py] = surf1(b.p), dx = Math.abs(x - px);
    if (dx < 20 && y > py - 66 && y < py + 18 && dx < bd) { best = b; bd = dx; }
  }
  if (!best) return;
  drag = best.id; S.sel = best.id; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ }
  sfx.tick(); render();
});
cv.addEventListener('pointermove', (ev) => {
  if (drag === null) return;
  const [x] = toDesign(ev), p = pFromX(x), b = S.bells.find((q) => q.id === drag);
  if (b && p !== b.p && moveBell(drag, p)) render();
});
const endDrag = () => { drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls ---------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, t = T[lang];
  if (a === 'g1') { S.g1 = +b.dataset.k; S.last1 = 'reveal'; S.sel = 4; restart1(); (S.g1 === t.ok1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'nl' || a === 'nr') { const bl = S.bells.find((q) => q.id === S.sel); if (bl) moveBell(S.sel, clamp(bl.p + (a === 'nl' ? -0.5 : 0.5), 0.5, 35.5)); sfx.tick(); }
  else if (a === 'roll') { restart1(); sfx.click(); }
  else if (a === 'evenB') { S.bells.slice().sort((p, q) => p.p - q.p).forEach((bl, i) => { bl.p = 5 * (i + 1); }); S.last1 = 'even'; restart1(); sfx.click(); }
  else if (a === 'reset') { S.bells.forEach((bl, i) => { bl.p = DEF1[i]; }); S.last1 = 'reset'; restart1(); sfx.click(); }
  else if (a === 'g2') { S.g2 = +b.dataset.k; S.ang = 18; S.ghostA = null; S.last2 = 'reveal'; R2.t = 0; (S.g2 === t.ok2 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'ball') { S.ghostA = a2(); S.heavy = b.dataset.k === '1'; S.last2 = 'ball'; R2.t = 0; sfx.click(); }
  else if (a === 'sc') {
    const k = b.dataset.k;
    if (!secret.unlocked()) { if (allGuessed()) { secret.open(); return; } S.gate = true; sfx.bad(); }
    else { S.ghostA = a2(); S[k] = !S[k]; S.last2 = S[k] ? k : 'slope'; R2.t = 0; sfx.click(); }
  } else if (a === 'g3') { S.g3 = +b.dataset.k; S.last3 = 'reveal'; R3.t = 0; (S.g3 === t.ok3 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'fr') { S.fr = b.dataset.k === '1'; S.last3 = 'fr'; R3.t = 0; sfx.click(); }
  else if (a === 'goBells') { $('views').querySelector('[data-view="bells"]')?.click(); return; }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'r2') return;
  S.ang = +ev.target.value; S.ghostA = null; S.last2 = 'slope'; R2.t = 0; render();
});

// --- render: controls, readout and state card ---------------------------------------------------------------------
function question(el, q, opts, act, answered) {
  el.hidden = answered;
  if (answered) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="q">${esc(q)}</div><div class="chips">${opts.map((o, i) => `<button class="chip" data-act="${act}" data-k="${i}">${esc(o)}</button>`).join('')}</div>`;
}
const verdict = (i, ok, wrongs) => (i === ok ? T[lang].ok : wrongs[i]);
function render() {
  const t = T[lang], v = lab.view, locked = v !== 'bells' && S.g1 === null;
  $('sec1').hidden = v !== 'bells'; $('sec2').hidden = v !== 'graphs' || locked; $('sec3').hidden = v !== 'flat' || locked; $('secL').hidden = !locked;
  if (locked) {
    $('goB').textContent = t.goBells;
    lab.setReadout('🔒', t.lockShort, '', '#9aa7c0'); lab.setGlow('rgba(110, 165, 255, .24)');
    lab.setState({ emo: '🔔', title: t.lockT, lead: t.lockL, body: '', extra: '' }); lab.setFacts([]);
    return;
  }
  if (v === 'bells') renderBells(t); else if (v === 'graphs') renderGraphs(t); else renderFlat(t);
}
function renderBells(t) {
  const g = S.g1 !== null;
  question($('pq1'), t.q1, t.o1, 'g1', g);
  $('play1').hidden = !g;
  lab.setGlow('rgba(228, 180, 69, .26)');
  if (!g) {
    lab.setReadout('?', '', t.pillPre, '#e4b445');
    lab.setState({ emo: t.pre1[0], title: t.pre1[1], lead: t.q1, body: t.pre1[2], extra: '' });
    lab.setFacts([]);
    return;
  }
  $('selLbl').textContent = t.sel(vis1().findIndex((b) => b.id === S.sel) + 1);
  $('ch1').innerHTML = `<button class="chip" data-act="roll">${esc(t.roll)}</button><button class="chip" data-act="evenB">${esc(t.evenB)}</button><button class="chip" data-act="reset">${esc(t.reset)}</button>`;
  const gp = gaps1(), ob = onBeat(), n = ob.filter(Boolean).length, all = n === ob.length;
  lab.setReadout(gp.map(fmtN).join(' · '), t.rdSub1, t.pill1(n), all ? '#3ddc97' : '#e4b445');
  let st;
  const REV = [1, 4, 9, 16];
  if (S.last1 === 'reveal') {
    const pos = REV.map((p, i) => p - (i ? REV[i - 1] : 0)).join(', ');
    st = { emo: S.g1 === t.ok1 ? '✅' : '🔎', title: verdict(S.g1, t.ok1, t.wrong1), lead: t.lead1(pos, REV.join(', ')), body: t.task1 };
  } else if (all) st = { emo: t.tuned[0], title: t.tuned[1], lead: t.tuned[2](gp.map(fmtN).join(', ')), body: t.tuned[3] };
  else if (S.last1 === 'even') st = { emo: t.even[0], title: t.even[1], lead: t.even[2], body: '' };
  else {
    const B = vis1(), i = ob.findIndex((x) => !x), tr = Math.sqrt(B[i].p);
    st = { emo: '🔔', title: t.off(n), lead: t.offLead(i + 1, nf(tr, 2), tr < i + 1), body: t.offBody };
  }
  lab.setState({ ...st, extra: '' });
  lab.setFacts(t.f1);
}
function renderGraphs(t) {
  const g = S.g2 !== null, a = a2(), run = run2(a), open = secret.unlocked();
  question($('pq2'), t.q2, t.o2, 'g2', g);
  $('lk2').textContent = t.lock2; $('lk2').hidden = g;
  const ctl = g;
  $('r2').disabled = !ctl || S.drop; $('r2').value = S.ang; $('l2').textContent = t.sl2; $('e2a').textContent = t.ends2[0]; $('e2b').textContent = t.ends2[1];
  $('r2').parentElement.hidden = !g; $('e2a').parentElement.hidden = !g;
  $('ch2').hidden = !g; $('sc2').hidden = !g; $('sg2').hidden = !g || !S.gate;
  $('ch2').innerHTML = [0, 1].map((k) => `<button class="chip ${!!k === S.heavy ? 'on' : ''}" data-act="ball" data-k="${k}">${esc(t.balls[k])}</button>`).join('');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S[k] ? 'on' : ''}" data-act="sc" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('sc2').innerHTML = sc('moon', '🌙') + sc('drop', '⬇️');
  $('sg2').textContent = t.sgate;
  lab.setGlow('rgba(255, 150, 80, .24)');
  if (!g) {
    lab.setReadout(`6°`, t.rdPre2, '', '#ffb870');
    lab.setState({ emo: t.pre2[0], title: t.pre2[1], lead: t.q2, body: t.pre2[2], extra: '' });
    lab.setFacts([]);
    return;
  }
  const rd = t.rd2(nf(a, 2));
  lab.setReadout(rd[0], rd[1], t.pill2(nf(run.T, 1)), '#ffb870');
  let st;
  if (S.last2 === 'reveal') st = [S.g2 === t.ok2 ? '✅' : '🔎', verdict(S.g2, t.ok2, t.wrong2), t.lead2, ''];
  else if (S.last2 === 'ball') st = t.s2.ball(nf(run.T, 1));
  else if (S.last2 === 'moon') st = t.s2.moon;
  else if (S.last2 === 'drop') st = t.s2.drop(nf(a, 2));
  else st = t.s2.slope(S.ang, nf(a, 2), nf(run.T, 1), nf(run.v, 1));
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: `<div class="fine">${esc(t.fine2)}</div>` });
  lab.setFacts(t.f2);
}
function renderFlat(t) {
  const g = S.g3 !== null, fr = S.fr;
  question($('pq3'), t.q3, t.o3, 'g3', g);
  $('lk3').textContent = t.lock3; $('lk3').hidden = g;
  $('ch3').hidden = !g;
  $('ch3').innerHTML = [0, 1].map((k) => `<button class="chip ${!!k === fr ? 'on' : ''}" data-act="fr" data-k="${k}">${esc(t.fr[k])}</button>`).join('');
  lab.setGlow('rgba(110, 165, 255, .28)');
  if (!g) {
    const rd = t.rd3(nf(VE3, 2));
    lab.setReadout(rd[0], rd[1], '', '#8fd0ff');
    lab.setState({ emo: t.pre3[0], title: t.pre3[1], lead: t.q3, body: t.pre3[2], extra: '' });
    lab.setFacts([]);
    return;
  }
  const vEnd = spd3(END_T[1], true);
  const rd = fr ? t.rd3b(nf(VE3, 1), nf(vEnd, 1)) : t.rd3a(nf(VE3, 2));
  lab.setReadout(rd[0], rd[1], t.pill3[fr ? 1 : 0], '#8fd0ff');
  let st;
  if (S.last3 === 'reveal') st = [S.g3 === t.ok3 ? '✅' : '🔎', verdict(S.g3, t.ok3, t.wrong3), t.lead3(nf(VE3, 2)), ''];
  else st = fr ? [...t.s3.fric, ''] : [...t.s3.smooth, ''];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: `<div class="fine">${esc(t.fine3)}</div>` });
  lab.setFacts(t.f3);
}
render();
</script>
