const pat = (s, n) => Array.from({ length: WEEKS }, (_, i) => (i < n ? s : 0));
const PA = { s: 1, n: 2 }, PB = { s: 2, n: 6 }; // the two heatwaves of the prediction
const dA = dhwOf(pat(PA.s, PA.n), 0, WEEKS), dB = dhwOf(pat(PB.s, PB.n), 0, WEEKS); // 2 and 12, computed

}
