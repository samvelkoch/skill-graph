function route(from, to, cut, load, jit) {

  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('pkSend').style.display = v === 'send' ? '' : 'none';
  $('pkCut').style.display = v === 'cut' ? '' : 'none';
  $('pkLink').style.display = v === 'link' ? '' : 'none';
  $('pkFine').textContent = v === 'link' ? '' : t.fine;
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('sea', '🌊') + sc('trace', '🧭') + (S.sec === 'trace' && open ? `<button class="chip" data-act="trace">${esc(t.tr.again)}</button>` : '');
  lab.setFacts(t.facts[v]);
  lab.setGlow(v === 'send' ? 'rgba(76, 201, 255, .26)' : v === 'cut' ? 'rgba(255, 90, 106, .22)' : 'rgba(255, 207, 90, .22)');
  if (v === 'send') renderSend(t); else if (v === 'cut') renderCut(t); else renderLink(t);
  if (S.sec) renderSecret(t);
}

function renderSend(t) {
  $('sendB').textContent = A.running ? '…' : A.did ? t.sendAgain : t.send;
  $('sendB').disabled = A.running;
  const got = A.order.length;
  lab.setReadout(`${got}/9`, t.recv, A.pk.length ? t.sentP(A.pk.length) : '', '#4cc9ff');
  let s;
  if (!A.did) s = { emo: t.s.idle[0], title: t.s.idle[1], lead: t.s.idle[2], body: t.s.idle[3] };
  else if (A.running) s = { emo: t.s.run[0], title: t.s.run[1], lead: t.s.run[2], body: '' };
  else {
    let x = 0, y = 0;
    for (let k = 0; k < A.order.length && !x; k++) { const later = A.order.slice(k + 1).filter((q) => q < A.order[k]); if (later.length) { x = A.order[k] + 1; y = Math.min(...later) + 1; } }
    s = { emo: t.s.done[0], title: t.s.done[1], lead: x ? t.s.done[2](x, y) : t.s.done[3], body: t.s.done[4] };
  }
  lab.setState({ ...s, extra: '' });
}

function renderCut(t) {
  const lost = lostIds(), cuts = S.cut.filter(Boolean).length, allOk = B.st.every((s) => s === 'ok');
  $('cutHint').textContent = t.hint;
  const locked = B.running || B.guess !== null || allOk;
  $('cutQ').innerHTML = `<div class="pk-q">${esc(t.q)}</div><div class="pk-opts">${['yes', 'no', 'half'].map((k) => `<button class="chip ${B.guess === k ? 'on' : ''}" data-act="guess" data-g="${k}"${locked ? ' disabled' : ''}>${esc(t[k])}</button>`).join('')}</div>`;
  $('repB').textContent = t.repair; $('repB').disabled = B.running || !cuts;
  $('clrB').textContent = t.clear; $('clrB').style.display = B.running || !B.did ? 'none' : ''; $('clrB').disabled = B.running;
  const ok = B.st.filter((s) => s === 'ok').length;
  lab.setReadout(`${ok}/9`, t.recv, cuts ? t.cutsP(cuts) : '', '#ff5a6a');
  let s, extra = '';
  if (B.running) s = { emo: t.c.run[0], title: t.c.run[1], lead: t.c.run[2], body: '' };
  else if (B.verdict === null) {
    const i = lost.length ? t.c.idleLost(lost.map((n) => n + 1).join(', ')) : t.c.idle;
    s = { emo: i[0], title: i[1], lead: i[2], body: '' };
  } else {
    const head = B.verdict ? t.c.right : t.c.wrong;
    if (B.conn) s = { emo: B.verdict ? '✅' : '🤔', title: head, lead: B.resend ? t.c.okResend : cuts ? t.c.okCut : t.c.okNone, body: t.c.ok[B.guess] };
    else { s = { emo: B.verdict ? '✅' : '🤔', title: head, lead: t.c.lostLead, body: [t.c.ko[B.guess], t.c.lostBody].filter(Boolean).join(' ') }; extra = `<div class="fine">${esc(t.c.lostList(lost.map((n) => n + 1).join(', ')))}</div>`; }
  }
  lab.setState({ ...s, extra });
}

function renderLink(t) {
  const L = t.lk, ti = S.ti, done = ti >= 5, picked = !done && S.pick[ti] != null, right = S.pick.filter((p, i) => p === TASK_OK[i]).length;
  const laneBtn = (k) => {
    const cls = picked ? (k === TASK_OK[ti] ? 'good' : S.pick[ti] === k ? 'bad' : '') : '';
    return `<button class="chip pk-lane ${cls}" data-act="pick" data-k="${k}"${picked || done ? ' disabled' : ''}>${k === 'bt' ? '🔵' : k === 'wifi' ? '🟢' : '🟡'} ${esc(L.lanes[k][0])} · ${esc(L.lanes[k][1])}</button>`;
  };
  const nextB = picked ? `<div class="pk-row"><button class="btn" data-act="next">${esc(ti >= 4 ? L.result : L.next)}</button></div>` : '';
  $('pkLink').innerHTML = done
    ? `<div class="pk-row" style="margin-top:0"><button class="btn" data-act="again">${esc(L.again)}</button></div>`
    : `<div class="pk-q">${esc(L.tasks[ti][0])} ${esc(L.tasks[ti][1])}</div><div class="pk-opts">${['bt', 'wifi', 'cable'].map(laneBtn).join('')}</div>${nextB}`;
  if (done) {
    lab.setReadout(`${right}/5`, '', '', '#ffcf5a');
    lab.setState({ emo: '🏁', title: L.end(right), lead: L.endLead, body: '', extra: '' });
  } else if (!picked) {
    lab.setReadout(fmtD(TASK_AT[ti]), L.sub(ti + 1), '', '#ffcf5a');
    lab.setState({ emo: L.tasks[ti][0], title: L.tasks[ti][1], lead: L.pickLead, body: '', extra: '' });
  } else {
    const ok = S.pick[ti] === TASK_OK[ti];
    lab.setReadout(fmtD(TASK_AT[ti]), L.sub(ti + 1), '', '#ffcf5a');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.c.right : t.c.wrong, lead: L.tasks[ti][2], body: ok ? '' : L.rightIs(L.lanes[TASK_OK[ti]][0]), extra: '' });
  }
}

function renderSecret(t) {
  if (S.sec === 'sea') {
    const r = S.sea >= 0 ? t.sea.routes[S.sea] : null;
    lab.setReadout('🌊', '', '', '#4cc9ff');
    lab.setState({ emo: '🌊', title: r ? r[0] : t.sea.title, lead: r ? r[1] : t.sea.lead, body: r ? t.sea.stylised : '', extra: '' });
  } else {
    if (!S.trace) newTrace();
    const tr = S.trace, last = tr.hops[tr.hops.length - 1];
    const rows = tr.hops.map((hp, k) => `<span>${k + 1}</span><span>${esc(hp.node === 1 ? t.tr.to : t.tr.router(hp.node - 1))}</span><b>${hp.ms} ${esc(t.tr.ms)}</b>`).join('');
    lab.setReadout(`${last.ms} ${esc(t.tr.ms)}`, t.tr.total, '', '#ffc94d');
    lab.setState({ emo: '🧭', title: t.tr.title, lead: t.tr.lead, body: '', extra: `<div class="pk-tr">${rows}</div>` });
  }
}
render();
</script>
</body>
</html>
