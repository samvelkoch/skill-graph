const hx = (r, g, b) => '#' + [r, g, b].map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');

const shade = (h, k) => { const [r, g, b] = rgbOf(h); return hx(r * (1 - k), g * (1 - k), b * (1 - k)); };
const tint = (h, k) => { const [r, g, b] = rgbOf(h); return hx(r + (255 - r) * k, g + (255 - g) * k, b + (255 - b) * k); };
const alpha = (h, a) => { const [r, g, b] = rgbOf(h); return `rgba(${r},${g},${b},${a})`; };
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };

function pill(c, text, x, y, w, o = {}) { // centred on x, vertical centre y, kept inside the canvas
  const fs = o.fs || 13; c.save(); c.font = `800 ${fs}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + 18, th = fs + 12, left = clamp(x - tw / 2, 6, Math.max(6, w - 6 - tw));
  c.globalAlpha = o.a ?? 1; c.fillStyle = o.bg || 'rgba(14,17,28,.85)'; c.beginPath(); c.roundRect(left, y - th / 2, tw, th, th / 2); c.fill();
  if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = 1; c.stroke(); }
  c.fillStyle = o.fg || '#fff'; c.fillText(text, left + tw / 2, y + 1);
  c.restore(); return left + tw / 2;
}
function speech(c, text, x, y, w, o = {}) { // a white speech bubble with a small tail down to (x, y + tail)
  const fs = o.fs || 14; c.save(); c.font = `800 ${fs}px Nunito, sans-serif`;
  const tw = c.measureText(text).width + 22, th = fs + 14, left = clamp(x - tw / 2, 6, Math.max(6, w - 6 - tw));
  c.globalAlpha = o.a ?? 1; c.fillStyle = '#fff'; c.strokeStyle = 'rgba(30,34,60,.5)'; c.lineWidth = 1.2;
  c.beginPath(); c.roundRect(left, y - th / 2, tw, th, th / 2); c.fill(); c.stroke();
  const tx = clamp(x, left + 14, left + tw - 14);
  c.beginPath(); c.moveTo(tx - 6, y + th / 2 - 1); c.quadraticCurveTo(tx, y + th / 2 + 6, tx + 2, y + th / 2 + 10); c.quadraticCurveTo(tx + 3, y + th / 2 + 4, tx + 7, y + th / 2 - 1); c.fill();
  c.fillStyle = '#1c2038'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, left + tw / 2, y + 1);
  c.restore();
}
function drawBubble(c, bx, byy, r, chestX, chestY, inner, t, label, w) { // the "inside" bubble that pops out of the flap
  const k = easeBack((t - .3) / .7);
  if (k <= .01) return;
  c.save();
  for (const [f, rr] of [[.22, .13], [.45, .2], [.68, .3]]) { // little thought-bubble dots from the chest
    const x = lerp(chestX, bx, f), y = lerp(chestY, byy, f);
    c.globalAlpha = clamp01(k); c.fillStyle = alpha(inner.col, .85); c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.2;
    c.beginPath(); c.arc(x, y, Math.max(0, rr * r * k), 0, 7); c.fill(); c.stroke();
  }
  c.globalAlpha = 1; c.translate(bx, byy); c.scale(k, k);
  const g = c.createLinearGradient(-r, -r, r, r); g.addColorStop(0, tint(inner.col, .25)); g.addColorStop(1, inner.col2 || shade(inner.col, .15));
  c.shadowColor = alpha(inner.col, .6); c.shadowBlur = 16;
  c.fillStyle = g; c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.stroke();
  c.shadowBlur = 0;
  c.fillStyle = tint(inner.col, .6); c.beginPath(); c.arc(0, 0, r * .72, 0, 7); c.fill();
  c.save(); c.scale(r * .7, r * .7); c.lineWidth = .06; drawFace(c, inner.P, 1); c.restore();
  c.restore();
  if (label) pill(c, label, bx, byy - r - 16, w, { fs: 13, a: clamp01((t - .6) / .3), bg: 'rgba(14,17,28,.88)', stroke: 'rgba(255,255,255,.35)' });
}

const BG = {

function drawBack(c, w, h, kind, by, time) {
  const P = BG[kind]; let g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, P[0]); g.addColorStop(1, P[1]); c.fillStyle = g; c.fillRect(0, 0, w, h);

  c.fillStyle = gl; c.fillRect(0, 0, w, h);
  const fy = by - h * .07; g = c.createLinearGradient(0, fy, 0, h); g.addColorStop(0, P[2]); g.addColorStop(1, P[3]); c.fillStyle = g; c.fillRect(0, fy, w, h - fy);

    }

    c.fillStyle = '#2a4a44'; c.strokeStyle = '#8a6a44'; c.lineWidth = 3; c.beginPath(); c.roundRect(w * .08, h * .07, w * .5, h * .2, 6); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.beginPath(); c.moveTo(w * .12, h * .13); c.quadraticCurveTo(w * .22, h * .1, w * .3, h * .14); c.moveTo(w * .12, h * .2); c.lineTo(w * .4, h * .2); c.stroke();

  } else if (kind === 'hall') {

  } else if (kind === 'track') {
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, fy + 18); c.lineTo(w, fy + 18); c.moveTo(0, fy + 52); c.lineTo(w, fy + 52); c.stroke();
    c.strokeStyle = '#ddd'; c.lineWidth = 3; c.beginPath(); c.moveTo(w * .95, fy); c.lineTo(w * .95, fy - h * .3); c.stroke();
    for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) { c.fillStyle = (i + j) % 2 ? '#fff' : '#222'; c.fillRect(w * .95 - 30 + i * 10, fy - h * .3 + j * 10, 10, 10); }
  } else {
    const cols = kind === 'partyA' ? ['#f2c14e', '#e8738a', '#5fa8a0', '#8f7fd0'] : ['#8aa4c8', '#9ab8c8', '#7a98b8', '#a0b4d0'];
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, h * .1); c.quadraticCurveTo(w / 2, h * .2, w, h * .1); c.stroke();
    for (let i = 0; i < 9; i++) { const x = w * (i + .5) / 9, y = h * .1 + Math.sin(Math.PI * (i + .5) / 9) * h * .075; c.fillStyle = cols[i % 4]; c.beginPath(); c.moveTo(x - 9, y); c.lineTo(x + 9, y); c.lineTo(x, y + 20); c.fill(); }
    if (kind === 'partyA') for (let i = 0; i < 26; i++) { const x = (i * 97.3 + 31) % w, y = ((i * 53.1 + time * (30 + (i % 5) * 9)) % (h * .85)) + h * .08; c.save(); c.translate(x, y); c.rotate(time * (1 + i % 3) + i); c.fillStyle = cols[i % 4]; c.fillRect(-3, -2, 6, 4); c.restore(); }

function puppy(c, x, y, s, time) { // a friendly puppy, facing left; s = scale, y = ground

function descr() {

function drawScene(c, w, h, dt, time) {

      cc.strokeStyle = '#c0507a'; cc.lineWidth = .18; cc.beginPath(); cc.moveTo(-.5, 1.4); cc.lineTo(0, 2.5); cc.lineTo(.5, 1.4); cc.stroke();
      cc.fillStyle = '#f2c14e'; cc.strokeStyle = '#a07a20'; cc.lineWidth = .06; cc.beginPath(); cc.arc(0, 2.6, .34, 0, 7); cc.fill(); cc.stroke();

      cc.save(); cc.translate(0, .1);

      const bg = cc.createLinearGradient(-.9, 3.4, .9, 4.4); bg.addColorStop(0, '#f08aa8'); bg.addColorStop(1, '#c4587c');
      cc.fillStyle = bg; cc.strokeStyle = '#8a3350'; cc.beginPath(); cc.roundRect(-.9, 3.45, 1.8, .95, .14); cc.fill(); cc.stroke();

// --- controls ----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const goView = (v) => $('views').querySelector(`[data-view="${v}"]`)?.click();
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = b.dataset.k, i = +b.dataset.i;
  if (act === 'scene') { S.scene = i; S.flapT = 0; sfx.tick(); }
  else if (act === 'opt') {
    if (S.guess[S.scene] !== null) return;
    S.guess[S.scene] = i; (i === T.en.scenes[S.scene].ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next') {
    if (S.scene >= 4) { S.guess = [null, null, null, null, null]; S.scene = 0; } else S.scene++;
    S.flapT = 0; sfx.click();
  } else if (act === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    const wasPeek = lab.view === 'peek';
    if (!wasPeek) goView('peek');
    S.sec = wasPeek && S.sec === k ? null : k; sfx.click();
  } else if (act === 'giver') { S.giver = b.dataset.v === '1'; sfx.click(); }
  else if (act === 'place') { S.place = +b.dataset.v; sfx.click(); }
  else if (act === 'gate') { S.scene = 3; S.flapT = 0; goView('peek'); S.sec = null; sfx.click(); }
  else if (act === 'clue') { S.clues[k] = true; S.lastClue = k; S.choice = null; sfx.tick(); }
  else if (act === 'choice') { if (nClues() < 2) return; S.choice = k; S.lastClue = null; (k === 'ask' ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'retry') { S.choice = null; sfx.click(); }
  else if (act === 'stone') { S.stone = k; sfx.tick(); }
  else if (act === 'who') {
    if (k === 'keep') { S.lastWho = 'keep'; sfx.tick(); }
    else {
      const left = stonesLeft(); if (!left.length) return;
      const key = left.includes(S.stone) ? S.stone : left[0];
      S.out[key] = true; S.fly = { key, who: k, t0: now(), from: S.stonePos[key] };
      S.lastWho = k; S.stone = STONES.find((s) => !S.out[s]) || null; sfx.snap();
    }
    showStage();
  } else if (act === 'repack') { for (const s of STONES) S.out[s] = false; S.stone = 'worry'; S.lastWho = null; S.fly = null; sfx.click(); }
  render();
});

// --- one render per change -------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('secPeek').style.display = v === 'peek' ? '' : 'none';
  $('secClues').style.display = v === 'clues' ? '' : 'none';
  $('secShare').style.display = v === 'share' ? '' : 'none';
  const open = secret.unlocked(), sc = (key, emo) => `<button class="chip pk-c secret ${open ? 'open' : ''} ${v === 'peek' && S.sec === key ? 'on' : ''}" data-act="sec" data-k="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('gift', '🎁') + sc('rules', '🌍');
  if (v === 'peek') renderPeek(t); else if (v === 'clues') renderClues(t); else renderShare(t);
}

function renderPeek(t) {
  const p = t.peek, i = S.scene, sc = t.scenes[i], g = S.guess[i], sec = S.sec;
  lab.setGlow('rgba(217, 130, 95, .24)');
  if (sec === 'gift' || sec === 'rules') {
    const toggles = sec === 'gift'
      ? [[1, t.gift.here, S.giver, 'giver'], [0, t.gift.gone, !S.giver, 'giver']] : [[0, t.rules.a, S.place === 0, 'place'], [1, t.rules.b, S.place === 1, 'place']];
    $('secPeek').innerHTML = `<div class="chips">${toggles.map(([val, lbl, on, act]) => `<button class="chip pk-c ${on ? 'on' : ''}" data-act="${act}" data-v="${val}">${esc(lbl)}</button>`).join('')}</div>
      <div class="row2"><button class="chip pk-c" data-act="sec" data-k="${sec}">${esc(t.gift.back)}</button></div>`;
    if (sec === 'gift') {
      lab.setReadout('🎁', t.gift.sub, S.giver ? t.gift.polite : t.gift.true_, '#e8738a');
      lab.setState({ emo: S.giver ? '😊' : '😔', title: S.giver ? t.gift.hereT : t.gift.goneT, lead: S.giver ? t.gift.hereL : t.gift.goneL, body: '', extra: '' });
      lab.setFacts(t.facts.gift);
    } else {
      lab.setReadout('😄', t.rules.sub, S.place === 0 ? t.rules.a : t.rules.b, '#f2c14e');
      lab.setState({ emo: S.place === 0 ? '🎉' : '🙂', title: S.place === 0 ? t.rules.aT : t.rules.bT, lead: S.place === 0 ? t.rules.aL : t.rules.bL, body: t.rules.body, extra: '' });
      lab.setFacts(t.facts.rules);
    }
    return;
  }
  const chips = [0, 1, 2, 3, 4].map((n) => `<button class="chip pk-c ${n === i ? 'on' : ''}" data-act="scene" data-i="${n}">${S.guess[n] !== null ? '✓ ' : ''}${n + 1}</button>`).join('');
  const opts = sc.opts.map((o, n) => {
    const cls = g === null ? '' : n === sc.ok ? ' good' : n === g ? ' bad' : '';
    return `<button class="pk-opt${cls}" data-act="opt" data-i="${n}"${g !== null ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  const nxt = g !== null ? `<div class="row2"><button class="btn push" data-act="next">${esc(i >= 4 ? p.again : p.next)}</button></div>` : '';
  $('secPeek').innerHTML = `<div class="chips">${chips}</div><p class="pk-story" style="margin-top:10px">${esc(sc.story)}</p><div class="pk-q">${esc(p.q)}</div><div class="pk-opts">${opts}</div>${nxt}`;
  const n = nDone(), r = nRight();
  lab.setReadout(`${n}/5`, p.sub, n ? p.pill(r) : '', '#d9825f');
  if (g === null) lab.setState({ emo: '🤔', title: p.startT, lead: p.startL, body: '', extra: '' });
  else {
    const ok = g === sc.ok;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? p.right : p.wrong, lead: sc.why, body: '',
      extra: n === 5 ? `<p><b>${esc(p.endT)}</b> ${esc(p.endL)}</p><p>${esc(p.endB)}</p>` : '' });
  }

}

function renderClues(t) {
  const c = t.clues, gated = S.guess[3] === null, n = nClues();
  lab.setGlow('rgba(143, 127, 208, .26)');

  $('secClues').innerHTML = `<div class="pk-h" style="margin-top:0">${esc(c.head)} · ${esc(c.got(n))}</div><div class="chips">${chips}</div>

    ${can ? '' : `<p class="pk-note">${esc(c.needTwo)}</p>`}${ch ? `<div class="row2"><button class="chip pk-c" data-act="retry">${esc(c.retry)}</button></div>` : ''}`;
  lab.setReadout(`${n}/4`, c.sub, '', '#8f7fd0');
  if (ch) lab.setState({ emo: ch === 'ask' ? '🌱' : ch === 'stop' ? '🚪' : '🍂', title: c.react[ch][0], lead: c.react[ch][1], body: '', extra: '' });
  else if (S.lastClue) lab.setState({ emo: emo[S.lastClue], title: c.list[S.lastClue][0], lead: c.list[S.lastClue][1], body: '', extra: '' });
  else lab.setState({ emo: '🔎', title: c.startT, lead: c.startL, body: '', extra: '' });
  lab.setFacts(t.facts.clues);
}

function renderShare(t) {
  const s = t.share, left = stonesLeft(), n = left.length, sel = left.includes(S.stone) ? S.stone : left[0] || null;
  lab.setGlow('rgba(90, 166, 214, .26)');
  const stones = STONES.map((k) => `<button class="chip pk-c ${sel === k ? 'on' : ''}" data-act="stone" data-k="${k}"${S.out[k] ? ' disabled' : ''}><span class="pk-dot" style="background:${STONE_COL[k]}"></span>${esc(s.stones[k])}</button>`).join('');
  const who = ['parent', 'teacher', 'friend', 'diary', 'keep'].map((k) => `<button class="pk-opt" data-act="who" data-k="${k}"${n === 0 && k !== 'keep' ? ' disabled' : ''}>${s.who[k][0]} ${esc(s.who[k][1])}</button>`).join('');
  $('secShare').innerHTML = n === 0
    ? `<div class="row2" style="margin-top:0"><button class="btn" data-act="repack">${esc(s.again)}</button></div><p class="pk-note">${esc(s.note)}</p>`
    : `<div class="pk-h" style="margin-top:0">${esc(s.stoneHead)}</div><div class="chips">${stones}</div><div class="pk-h">${esc(s.whoHead)}</div><div class="pk-opts">${who}</div>`;
  lab.setReadout(String(n), s.sub(n), '', '#5aa6d6');
  const lw = S.lastWho;
  if (n === 0) lab.setState({ emo: '🌤️', title: s.endT, lead: s.endL, body: '', extra: `<p>${esc(s.note)}</p>` });
  else if (lw) lab.setState({ emo: lw === 'keep' ? '🔒' : '🪨', title: lw === 'keep' ? s.keepT : s.outT, lead: s.react[lw], body: '', extra: `<p>${esc(s.note)}</p>` });
  else lab.setState({ emo: '🎒', title: s.startT, lead: s.startL, body: '', extra: `<p>${esc(s.note)}</p>` });
  lab.setFacts(t.facts.share);
}
render();
</script>
</body>
