  c.save(); c.translate(16, -28); c.rotate(.5); rr(c, -3, -34, 6, 50, 3); c.fillStyle = '#8a5a2b'; c.fill(); rr(c, -4, 14, 8, 14, 3); c.fillStyle = '#c9ced8'; c.fill();

  c.restore();

const GS = [gBoil, gTablet, gPaint, gApple, gCandle, gWarmer];

// --- layout and the three drawing functions ----------------------------------------------------------------
function split(w, h, narrowFrac, wideFrac, left) {
  const pad = 10;
  if (w >= 620) {
    const pw = Math.round((w - 3 * pad) * wideFrac), lw = w - 3 * pad - pw, R = Math.max(40, Math.min(lw / 2 - 4, (h - 2 * pad) / 2 - 8) / 1.1);
    return { wide: true, p: { x: pad, y: pad, w: pw, h: h - 2 * pad }, l: { cx: pad * 2 + pw + lw / 2 - R * .1, cy: left ? h * .36 : h / 2, R } };
  }
  const ph = Math.round((h - 3 * pad) * narrowFrac), rest = h - 3 * pad - ph, R = Math.max(40, Math.min((w - 2 * pad) / 2 - 6, rest / 2 - 4) / 1.02);

  const L = split(w, h, .42, .5), id = S.kc, rec = S.K[id], u = prog(rec, id === 'salt' ? 7.5 : KDUR);

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const mark = (b) => (b ? '✓' : '✗');
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (v === 'kitchen') S.kc = S.kc === 'salt' ? 'melt' : 'salt'; else S.ex = S.ex === 'lav' ? 'sealed' : 'lav';
    sfx.click();
  } else if (act === 'ch') { S.kc = b.dataset.k; sfx.click(); }
  else if (act === 'kg') { const r = S.K[S.kc]; if (r.t0 !== null) return; r.guess = b.dataset.v === '1'; sfx.tick(); }
  else if (act === 'kdo') { const r = S.K[S.kc]; if (S.kc !== 'salt' && r.guess === null) return; r.t0 = nowS(); r.done = true; sfx.snap(); showStage(); }
  else if (act === 'ex') { S.ex = b.dataset.k; sfx.click(); }
  else if (act === 'mg') { const r = S.X[S.ex]; if (r.t0 !== null) return; r.guess = b.dataset.v; sfx.tick(); }
  else if (act === 'xgo') { const r = S.X[S.ex]; if (S.ex !== 'lav' && r.guess === null) return; r.t0 = nowS(); r.done = true; S.anyX = true; sfx.snap(); showStage(); }
  else if (act === 'sg') { S.gi = +b.dataset.i; sfx.click(); }
  else if (act === 'ga') { const r = S.G[S.gi]; if (r.guess !== null) return; r.guess = b.dataset.v === '1'; r.t0 = nowS(); r.done = true; (r.guess === T[lang].signs[S.gi].ok ? sfx.good : sfx.bad)(); showStage(); }

// --- render: the controls, the readout, the state card and the facts ----------------------------------------
const secChip = (t, k, emo, on) => `<button class="chip nk-c secret ${secret.unlocked() ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec">${secret.unlocked() ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
function readScale() { // the display value, also while the animation runs
  if (lab.view !== 'scale') return;
  const id = S.ex, rec = S.X[id], u = prog(rec, XDUR[id]), t = T[lang], right = rec.t0 !== null && id !== 'lav' && rec.guess === MASSANS[id];
  lab.setReadout(`${fmt(massNow(id, u))} ${t.g}`, t.onScale, right ? t.right : '', '#6ee7b7');
}
function render() {
  const t = T[lang], v = lab.view;
  $('secK').style.display = v === 'kitchen' ? 'block' : 'none';
  $('secX').style.display = v === 'scale' ? 'block' : 'none';
  $('secG').style.display = v === 'signs' ? 'block' : 'none';
  lab.setGlow('rgba(226, 181, 82, .24)');
  if (v === 'kitchen') renderK(t); else if (v === 'scale') renderX(t); else renderG(t);
}
function renderK(t) {
  const id = S.kc, rec = S.K[id], salt = id === 'salt', right = rec.guess === NEWSUB[id], doneN = CH.filter((k) => S.K[k].done).length;
  let h = `<div class="chips">${CH.map((k) => `<button class="chip nk-c ${k === id ? 'on' : ''}" data-act="ch" data-k="${k}">${S.K[k].done ? '✓ ' : ''}${esc(t.changes[k])}</button>`).join('')}${secChip(t, 'a', '♻️', salt)}</div>`;
  if (!salt) {
    h += `<div class="nk-ql">${esc(t.qNew)}</div><div class="chips">${ord('k' + id, 2).map((i) => {
      const yes = i === 0, cls = rec.done ? (yes === NEWSUB[id] ? 'nk-ok' : rec.guess === yes ? 'nk-bad' : '') + ' nk-lock' : rec.guess === yes ? 'on' : '';
      return `<button class="chip nk-c ${cls}" data-act="kg" data-v="${yes ? 1 : 0}">${esc(yes ? t.yesNew : t.noSame)}</button>`;
    }).join('')}</div>`;
  }
  h += `<div class="row2"><button class="btn nk-do" data-act="kdo"${!salt && rec.guess === null ? ' disabled' : ''}>${esc(t.doIt)}</button></div>`;
  h += `<table class="nk-tab"><thead><tr><th></th><th>${esc(t.colNew)}</th><th>${esc(t.colUndo)}</th></tr></thead><tbody>${CH.map((k) => {
    const d = S.K[k].done, cell = (b) => (d ? `<td class="m ${b ? 'y' : 'n'}">${mark(b)}</td>` : '<td class="m e">·</td>');
    return `<tr class="${k === 'tear' && d ? 'hl' : ''}"><td>${esc(t.changes[k])}</td>${cell(NEWSUB[k])}${cell(UNDO[k])}</tr>`;
  }).join('')}</tbody></table>${S.K.tear.done ? `<div class="nk-note">${esc(t.tearNote)}</div>` : ''}`;
  $('secK').innerHTML = h;
  lab.setReadout(`${doneN} / 6`, t.sorted, !salt && rec.done && right ? t.right : '', '#e2b552');
  if (salt) lab.setState({ emo: '♻️', title: t.secrets.a[0], lead: t.secrets.a[1], body: '', extra: '' });
  else if (!rec.done) lab.setState({ ...t.state.kitchen, extra: '' });
  else lab.setState({ emo: right ? '✅' : '🤔', title: right ? t.right : t.notQuite, lead: t.whyChange[id], body: t.state.kitchen.lead, extra: '' });

}
function renderX(t) {
  const id = S.ex, rec = S.X[id], lav = id === 'lav';
  let h = `<div class="chips">${EXP.map((k) => `<button class="chip nk-c ${k === id ? 'on' : ''}" data-act="ex" data-k="${k}">${esc(t.experiments[k])}</button>`).join('')}${secChip(t, 'b', '⚖️', lav)}</div>`;
  if (!lav) {
    h += `<div class="nk-ql">${esc(t.qMass)}</div><div class="chips">${ord('x' + id, 3).map((i) => {
      const k = MKEYS[i], cls = rec.t0 !== null ? (k === MASSANS[id] ? 'nk-ok' : rec.guess === k ? 'nk-bad' : '') + ' nk-lock' : rec.guess === k ? 'on' : '';
      return `<button class="chip nk-c ${cls}" data-act="mg" data-v="${k}">${esc(t.optsMass[i])}</button>`;
    }).join('')}</div>`;
  }
  h += `<div class="row2"><button class="btn nk-do" data-act="xgo"${!lav && rec.guess === null ? ' disabled' : ''}>${esc(t.start)}</button></div>`;
  $('secX').innerHTML = h;
  readScale();
  if (lav) lab.setState({ emo: '⚖️', title: t.secrets.b[0], lead: t.secrets.b[1], body: '', extra: '' });
  else if (rec.t0 === null) lab.setState({ emo: '⚖️', title: t.qMass, lead: '', body: '', extra: '' });
  else { const right = rec.guess === MASSANS[id]; lab.setState({ emo: right ? '✅' : '🤔', title: right ? t.right : t.notQuite, lead: t.whyMass[id], body: `${t.state.scale.lead} ${t.state.scale.body}`, extra: '' }); }

function renderG(t) {
  const i = S.gi, rec = S.G[i], sg = t.signs[i], judged = S.G.filter((g) => g.done).length;
  let h = `<div class="nk-sgs">${t.signs.map((s, k) => {
    const g = S.G[k], st = g.done ? (g.guess === s.ok ? 'ok' : 'bad') : '';
    return `<button class="nk-sg ${k === i ? 'on' : ''} ${st}" data-act="sg" data-i="${k}"><span class="e">${SIGNEMO[k]}</span><span class="t">${esc(s.t)}</span><span class="m">${g.done ? mark(g.guess === s.ok) : ''}</span></button>`;
  }).join('')}</div><div class="nk-ql">${esc(sg.t)}</div><div class="chips">${ord('g' + i, 2).map((o) => {
    const chem = o === 0, cls = rec.done ? (chem === sg.ok ? 'nk-ok' : rec.guess === chem ? 'nk-bad' : '') + ' nk-lock' : '';
    return `<button class="chip nk-c ${cls}" data-act="ga" data-v="${chem ? 1 : 0}">${esc(chem ? t.chem : t.notChem)}</button>`;
  }).join('')}</div>`;
  $('secG').innerHTML = h;
  const right = rec.guess === sg.ok;
  lab.setReadout(`${judged} / 6`, t.judged, rec.done && right ? t.right : '', '#a78bfa');
  if (!rec.done) lab.setState({ ...t.state.signs, body: '', extra: '' });
  else lab.setState({ emo: right ? '✅' : '🤔', title: right ? t.right : t.notQuite, lead: sg.why, body: `${t.state.signs.lead} ${t.state.signs.body}`, extra: '' });
  lab.setFacts(t.facts.signs);
}
render();
