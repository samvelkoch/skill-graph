      // equal marks on both halves

      if (S.mirror === 'd') { const mx = -uy, my = ux, s = cs * 0.2; c.beginPath(); c.moveTo(M[0] + ux * s, M[1] + uy * s); c.lineTo(M[0] + ux * s + mx * s, M[1] + uy * s + my * s); c.lineTo(M[0] + mx * s, M[1] + my * s); c.stroke(); }

}

// --- scene 2: lines of symmetry ---
function lineAt(c, cx, cy, deg, len) { const a = (deg * Math.PI) / 180; c.beginPath(); c.moveTo(cx - Math.cos(a) * len, cy - Math.sin(a) * len); c.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len); c.stroke(); }
function stepFold(dt) {

function drawFoldShape(c, key, sz, thDeg, f, matched) {

function drawSym(c, w, h, dt, time) {

  c.setLineDash([]);

// --- scene 3: move it ---
function drawMove(c, w, h, dt, time) {
  if (S.mt < 1) S.mt = Math.min(1, S.mt + dt / 0.95);

  const X = (x) => g.ox + x * cell, Y = (y) => g.oy - y * cell;
  c.save(); rr(c, X(-8), Y(6), 16 * cell, 12 * cell, 12); c.fillStyle = 'rgba(14,17,28,.88)'; c.fill(); c.clip();
  c.strokeStyle = 'rgba(130,145,190,.15)'; c.lineWidth = 1; c.beginPath();
  for (let x = -8; x <= 8; x++) { c.moveTo(X(x), Y(-6)); c.lineTo(X(x), Y(6)); }
  for (let y = -6; y <= 6; y++) { c.moveTo(X(-8), Y(y)); c.lineTo(X(8), Y(y)); }

  text(c, 'x', X(7.6), Y(0) - fs, fs * 1.1, '#EDEFF7'); text(c, 'y', X(0) + fs, Y(5.6), fs * 1.1, '#EDEFF7');

    if (r.kind === 'xaxis' || r.kind === 'hline') { const y = r.kind === 'xaxis' ? 0 : r.k; c.moveTo(X(-8), Y(y)); c.lineTo(X(8), Y(y)); }

  I.pts.forEach((p, i) => {
    const lab0 = VL[i] + (big ? `(${sgn(p[0])}, ${sgn(p[1])})` : ''), lab1 = VL[i] + '′' + (big && te >= 0.99 ? `(${sgn(I.img[i][0])}, ${sgn(I.img[i][1])})` : '');
    const off = (q, cc, s, col, align) => { let dx = q[0] - cc[0], dy = q[1] - cc[1]; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L; c.beginPath(); c.arc(X(q[0]), Y(q[1]), 3.6, 0, 7); c.fillStyle = col; c.fill(); text(c, s, X(q[0]) + dx * fs * 0.9 * (s.length > 3 ? 2.2 : 1) , Y(q[1]) - dy * fs * 1.1, fs, col, 'center'); void align; };

// --- secret: kaleidoscope ---
function drawKal(c, w, h, dt, time) {
  S.kalCur += (S.kalA - S.kalCur) * Math.min(1, dt * 7);
  const a = (S.kalCur * Math.PI) / 180, n = Math.round(360 / S.kalA), R = Math.min(w, h) * 0.46, cx = w / 2, cy = h / 2, B = -Math.PI / 2 - a / 2;
  c.save(); c.translate(cx, cy);

// --- secret: rotational symmetry ---

      }

}
