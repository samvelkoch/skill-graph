  c.beginPath(); c.roundRect(bx, by, bw, bh, 14); c.fill(); c.stroke();
  c.fillStyle = '#fff'; L.forEach((l, i) => c.fillText(l, bx + 13, by + 7 + 9.5 + i * 19));

const stars = Array.from({ length: 16 }, (_, i) => [(i * 83 + 17) % 360, 12 + ((i * 47) % 88), 0.6 + (i % 3) * 0.4]);

canvasLoop($('cv'), (c, w, h, dt, time) => {
  // ease the drawn values toward their targets
  const k = (r) => 1 - Math.exp(-dt * r);
  A.C += (G.C - A.C) * k(3.2); A.lean += (G.lean - A.lean) * k(5); A.dn += (G.dn - A.dn) * k(1.9);
  A.spot += (G.spot - A.spot) * k(3); A.say += ((G.say ? 1 : 0) - A.say) * k(7);
  const ladT = G.dn > 0.01 ? 1 : 0; A.lad += (ladT - A.lad) * k(ladT ? 4 : 2.5);
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  const sky = c.createLinearGradient(0, 0, 0, oy + GY * s); sky.addColorStop(0, '#101a36'); sky.addColorStop(1, '#4a6483');
  c.fillStyle = sky; c.fillRect(0, 0, w, h);
  c.save(); c.translate(ox, oy); c.scale(s, s);
  const X0 = -ox / s - 20, X1 = (w - ox) / s + 20, YB = (h - oy) / s + 20;
  for (const [sx, sy, r] of stars) { c.fillStyle = `rgba(255,255,255,${0.5 + 0.3 * Math.sin(time * 1.5 + sx)})`; c.beginPath(); c.arc(sx, sy, r, 0, Math.PI * 2); c.fill(); }
  // hills and trees
  c.fillStyle = '#233b52'; c.beginPath(); c.moveTo(X0, GY); c.lineTo(X0, 138); c.quadraticCurveTo(80, 100, 170, 140); c.quadraticCurveTo(260, 112, 340, 138); c.lineTo(X1, 130); c.lineTo(X1, GY); c.fill();
  const tree = (tx, th, sc) => {
    c.save(); c.translate(tx, GY); c.scale(sc, sc);
    c.fillStyle = '#4a3326'; c.fillRect(-4, -th * 0.4, 8, th * 0.4);
    const g = c.createRadialGradient(-10, -th * 0.9, 4, 0, -th * 0.7, 40); g.addColorStop(0, '#4d9a63'); g.addColorStop(1, '#1f4a35');
    c.fillStyle = g; c.strokeStyle = '#16372a'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(0, -th * 0.72, 26, 0, Math.PI * 2); c.fill(); c.stroke();
    c.beginPath(); c.arc(-14, -th * 0.52, 18, 0, Math.PI * 2); c.fill(); c.stroke();
    c.beginPath(); c.arc(15, -th * 0.54, 19, 0, Math.PI * 2); c.fill(); c.stroke();
    c.restore();
  };
  tree(14, 92, 0.8); tree(342, 100, 0.9); tree(X1 - 30, 90, 0.8);
  // earth with the cut-away hole
  const eg = c.createLinearGradient(0, GY, 0, YB); eg.addColorStop(0, '#7a5640'); eg.addColorStop(1, '#3b2720');
  c.fillStyle = eg; c.fillRect(X0, GY, X1 - X0, YB - GY);
  c.fillStyle = 'rgba(0,0,0,.14)'; for (const [rx, ry, rr] of [[30, 230, 9], [70, 300, 6], [100, 360, 10], [330, 250, 8], [345, 330, 7], [312, 380, 5]]) { c.beginPath(); c.ellipse(rx, ry, Math.max(0, rr), Math.max(0, rr * 0.7), 0.3, 0, Math.PI * 2); c.fill(); }
  const pg = c.createLinearGradient(0, GY, 0, PB); pg.addColorStop(0, '#2c2240'); pg.addColorStop(1, '#130e1f');
  c.fillStyle = pg; c.beginPath(); c.roundRect(PX0, GY - 2, PX1 - PX0, PB - GY + 2, [0, 0, 12, 12]); c.fill();
  c.strokeStyle = '#2a1b15'; c.lineWidth = 2; c.stroke();
  const warm = clamp((A.C - START) / 55, 0, 1);
  const lg = c.createLinearGradient(PX0, 0, PX0 + 70, 0); lg.addColorStop(0, 'rgba(255,255,255,.07)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = lg; c.beginPath(); c.moveTo(PX0, GY); c.lineTo(PX0 + 60, GY); c.lineTo(PX0 + 130, PB); c.lineTo(PX0 + 36, PB); c.closePath(); c.fill();
  // warm light (or the spotlight in the "too much" secret) around the pair
  const kp0 = kidPos(clamp(A.dn, 0, 1), 56 + 62 * A.lean);
  const gx = lerp(SAM.x, kp0.x, A.spot), gy = lerp(SAM.y - 30, kp0.y - 30, A.spot), gr = 60 + 90 * warm;
  const wg = c.createRadialGradient(gx, gy, 4, gx, gy, gr);
  const wa = A.spot > 0.02 ? 0.5 * Math.max(A.spot, 0.4) : 0.55 * warm;
  wg.addColorStop(0, `rgba(255,205,120,${wa})`); wg.addColorStop(1, 'rgba(255,205,120,0)');
  c.fillStyle = wg; c.save(); c.beginPath(); c.rect(PX0, GY, PX1 - PX0, PB - GY); c.clip(); c.fillRect(PX0, GY, PX1 - PX0, PB - GY); c.restore();
  // ladder, growing down from the edge
  if (A.lad > 0.01) {
    const gmax = A.lad, top = ladPt(0), bot = ladPt(gmax);
    c.save(); c.beginPath(); c.rect(PX0 - 20, GY - 30, PX1 - PX0 + 40, PB - GY + 40); c.clip();
    c.strokeStyle = '#6b4a26'; c.lineWidth = 6; c.lineCap = 'round';
    for (const dx of [-9, 9]) { c.beginPath(); c.moveTo(top.x + dx, top.y); c.lineTo(bot.x + dx, bot.y); c.stroke(); }
    c.strokeStyle = '#c99a5f'; c.lineWidth = 3;
    for (const dx of [-9, 9]) { c.beginPath(); c.moveTo(top.x + dx - 0.6, top.y); c.lineTo(bot.x + dx - 0.6, bot.y); c.stroke(); }
    c.strokeStyle = '#8a6335'; c.lineWidth = 4;
    for (let g = 0.04; g < gmax; g += 0.105) { const q = ladPt(g); c.beginPath(); c.moveTo(q.x - 9, q.y); c.lineTo(q.x + 9, q.y); c.stroke(); }
    c.restore();
  }
  // Sam, the cloud and the rain
  const samMood = A.C < 42 ? 'sad' : A.C < 68 ? 'neutral' : 'smile';
  const blink = (time % 3.6) < 0.12;
  const cloudK = clamp(1.45 - A.C / 66, 0.1, 1.3);
  cloud(c, SAM.x, 292, cloudK, time);
  person(c, SAM.x, SAM.y, { pal: SAMC, sit: 1, mood: samMood, look: clamp(-(SAM.x - kp0.x) / 80, -1, 0), blink });
  if (A.spot > 0.02) { c.fillStyle = `rgba(6,8,20,${0.4 * A.spot})`; c.beginPath(); c.ellipse(SAM.x, SAM.y - 32, 40, 52, 0, 0, Math.PI * 2); c.fill(); }
  // the child's character
  const p = Math.min(clamp(A.dn, 0, 1), 0.22 + 0.6 * A.lad + (A.lad > 0.98 ? 0.2 : 0));
  const kp = kidPos(p, 56 + 62 * A.lean);
  const rot = A.lean * 0.34 * (1 - ease(p / 0.22));
  const kidMood = A.C >= 60 ? 'smile' : A.lean > 0.3 || (G.say && A.say > 0.3) ? 'o' : 'neutral';
  person(c, kp.x, kp.y, { pal: KID, sit: kp.sit, rot, mood: kidMood, blink, look: 1 });
  // rising hearts when the two are close
  if (warm > 0.55) for (let i = 0; i < 3; i++) {
    const ph = (time * 0.35 + i / 3) % 1, hx = (SAM.x + kp.x) / 2 + Math.sin(time * 2 + i * 2) * 12 + (i - 1) * 14;
    c.globalAlpha = Math.sin(ph * Math.PI) * warm; heart(c, hx, SAM.y - 70 - ph * 60, 5, '#ff8a8a', '#c43b4d'); c.globalAlpha = 1;
  }
  // grass lips over the edges of the hole
  const gl = c.createLinearGradient(0, GY - 10, 0, GY + 8); gl.addColorStop(0, '#62b36a'); gl.addColorStop(1, '#2f6f40');
  c.fillStyle = gl; c.strokeStyle = '#22502f'; c.lineWidth = 1.6;
  c.beginPath(); c.roundRect(X0, GY - 10, PX0 - X0 + 3, 18, 6); c.fill(); c.stroke();
  c.beginPath(); c.roundRect(PX1 - 3, GY - 10, X1 - PX1 + 3, 18, 6); c.fill(); c.stroke();
  // connection meter: two hearts
  c.fillStyle = 'rgba(14,17,28,.8)'; c.strokeStyle = 'rgba(130,145,190,.45)'; c.lineWidth = 1;
  c.beginPath(); c.roundRect(150, 114, 150, 36, 18); c.fill(); c.stroke();
  const dist = lerp(78, 20, clamp(A.C / 100, 0, 1)), beat = A.C >= 70 ? 1 + 0.1 * Math.sin(time * 6) : 1;
  heart(c, 225 - dist / 2, 133, 11 * beat, '#ff9a6a', '#b4472a'); heart(c, 225 + dist / 2, 133, 11 * beat, '#a9c2ff', '#4663a8');
  // what the child's character says
  if (A.say > 0.02 && G.text) {
    const tail = kp.y - 62 < 135 ? kp.x : null;
    bubble(c, G.text, kp.x, tail, A.say);
  }
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const BR = { en: 'S', ru: 'С', hu: 'S' };
const samRow = (t, text) => `<div class="em-row"><div class="em-av">${esc(BR[lang])}</div><div class="em-b"><span class="em-n">${esc(t.sam)}</span>${esc(text)}</div></div>`;
const meRow = (text) => `<div class="em-row me"><div class="em-av">🙂</div><div class="em-b">${esc(text)}</div></div>`;

// the scene a view starts from
function enter() {
  clearTimeout(timer);
  let C = START;
  if (lab.view === 'fix') C = S.v3.C;
  if (lab.view === 'feeling' && S.v2.done) C = 80;
  S.C = C; say(''); scene(C);
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, t = T[lang], v1 = S.v1, v2 = S.v2, v3 = S.v3;
  if (act === 'pick1') {
    const k = ORD1[v1.si][+b.dataset.i]; if (v1.played[k]) return;
    v1.picked = k; v1.last = null; sfx.click();
  } else if (act === 'pred1') {
    const k = v1.picked; if (!k) return;
    const ok = (b.dataset.p === 'down') === (k === 'emp');
    v1.total++; if (ok) v1.right++; v1.played[k] = true; v1.last = { k, ok }; v1.picked = null;
    S.C = RES[k].C; (ok ? sfx.good : sfx.bad)();
    const text = t.v1.sits[v1.si][k];
    restart(() => { say(text); scene(RES[k].C, { lean: RES[k].lean }); });
    showStage();
  } else if (act === 'next1') {
    v1.si++; v1.played = {}; v1.picked = null; v1.last = null; S.C = START; sfx.click();
    restart(null); say('');
  } else if (act === 'again1') {
    S.v1 = { si: 0, picked: null, played: {}, last: null, right: 0, total: 0 }; S.C = START; sfx.click(); restart(null); say('');
  } else if (act === 'pick2') {
    const i = +b.dataset.i; if (v2.done || v2.wrong.includes(i)) return;
    const text = t.v2.refl[i];
    if (i === R2[v2.ri]) {
      v2.done = true; if (!v2.wrong.length) v2.first++; v2.react = t.v2.samYes; S.C = 80; sfx.good();
      restart(() => { say(text); scene(80); });
    } else {
      v2.wrong.push(i); v2.react = t.v2.samNo; S.C = 24; sfx.bad();
      restart(() => { say(text); scene(24, { lean: 1 }); });
    }
    showStage();
  } else if (act === 'next2') {
    v2.ri++; v2.wrong = []; v2.done = false; v2.react = ''; S.C = START; sfx.click(); restart(null); say('');
  } else if (act === 'again2') {
    S.v2 = { ri: 0, wrong: [], done: false, react: '', first: 0 }; S.C = START; sfx.click(); restart(null); say('');
  } else if (act === 'pick3') {
    if (v3.log[v3.ti]) return;
    v3.picked = +b.dataset.i; v3.last = null; sfx.click();
  } else if (act === 'pred3') {
    const i = v3.picked; if (i === null) return;
    const d = D3[v3.ti][i], C = clamp(v3.C + d, 5, 96), ok = (d > 0) === (b.dataset.p === 'closer');
    v3.log[v3.ti] = { i, d, ok, asked: !!ASKED[`${v3.ti}:${i}`] }; v3.last = v3.log[v3.ti]; v3.picked = null; v3.C = C; S.C = C;
    (ok ? sfx.good : sfx.bad)();
    const text = t.v3.turns[v3.ti].o[i];
    restart(() => { say(text); scene(C, { lean: d < 0 ? 1 : 0 }); });
    showStage();
  } else if (act === 'cont3') {
    v3.ti++; v3.picked = null; v3.last = null; sfx.click();
  } else if (act === 'again3') {
    S.v3 = { ti: 0, picked: null, log: [], C: 40, last: null, rule: false }; S.C = 40; sfx.click(); restart(null); say('');
  } else if (act === 'rule') {
    v3.rule = !v3.rule; sfx.tick();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) { S.sec = null; enter(); render(); return; }
    S.sec = k; S.sb = 0; S.mb = 0; sfx.click();
    if (k === 'silent') { S.C = 36; restart(() => { scene(36, { dn: 1 }); }); } else { S.C = 62; restart(() => { scene(62, { dn: 1 }); }); }
    say('');
  } else if (act === 'secback') {
    S.sec = null; sfx.click(); enter();
  } else if (act === 'secgo') {
    if (S.sec === 'silent') {
      S.sb = Math.min(3, S.sb + 1); S.C = [36, 44, 54, 62][S.sb]; scene(S.C, { dn: 1 }); sfx.click();
    } else if (S.mb < 3) {
      S.mb++; S.C = [62, 50, 36, 22][S.mb]; say(t.sec.me.lines[S.mb - 1]); scene(S.C, { dn: 1, spot: [0, 0.4, 0.8, 1][S.mb] }); sfx.click();
    }
  } else if (act === 'meask') {
    S.mb = 4; S.C = 74; say(t.sec.me.askLine); scene(74, { dn: 1 }); sfx.good();
  } else if (act === 'mereset') {
    S.mb = 0; S.C = 62; say(''); scene(62, { dn: 1 }); sfx.click();
  }
  render();
});

// --- one render per change -----------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked();
  document.body.dataset.v = v;
  $('p-ladder').hidden = !(v === 'ladder' && !S.sec); $('p-feeling').hidden = !(v === 'feeling' && !S.sec);
  $('p-fix').hidden = !(v === 'fix' && !S.sec); $('p-sec').hidden = !S.sec;
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('silent', '🤝') + sc('me', '🗣️');
  lab.setGlow('rgba(242, 166, 94, .22)');
  lab.setReadout(`${Math.round(S.C)}%`, t.conn, '', '#f2a65e');
  lab.setFacts(t.facts[v]);
  if (S.sec) return renderSec(t);
  if (v === 'ladder') renderV1(t); else if (v === 'feeling') renderV2(t); else renderV3(t);
}

function predRow(t, tt, act, a, b) {
  return `<div class="em-q">${esc(tt.predQ)}</div><div class="em-preds"><button class="em-c" data-act="${act}" data-p="${a[0]}">${esc(a[1])}</button><button class="em-c" data-act="${act}" data-p="${b[0]}">${esc(b[1])}</button></div>`;
}

function renderV1(t) {
  const v = S.v1, tt = t.v1;
  if (v.si >= 3) {
    $('p-ladder').innerHTML = `<p class="em-sum">${esc(tt.summary(v.right, v.total))}</p><button class="btn" data-act="again1">${esc(t.again)}</button>`;
    lab.setState({ emo: '🏁', title: tt.end[0], lead: tt.end[1], body: '', extra: '' });
    return;
  }
  const sit = tt.sits[v.si];
  let h = `<div class="em-tag">${esc(tt.tag(v.si + 1, 3))}</div>${samRow(t, sit.sam)}<div class="em-ans">`;
  ORD1[v.si].forEach((k, i) => {
    const played = v.played[k];
    h += `<button class="em-a ${v.picked === k ? 'sel' : ''}" data-act="pick1" data-i="${i}"${played ? ' disabled' : ''}><span>${esc(sit[k])}</span>${played ? `<span class="mk">${k === 'emp' ? '🪜' : '⬆️'}</span>` : ''}</button>`;
  });
  h += '</div>';
  if (v.picked) h += predRow(t, tt, 'pred1', ['down', tt.down], ['up', tt.up]);
  if (v.played.emp) h += `<div class="em-go"><button class="btn" data-act="next1">${esc(t.next)}</button></div>`;
  $('p-ladder').innerHTML = h;
  if (v.last) lab.setState({ emo: v.last.ok ? '✅' : '🤔', title: v.last.ok ? t.right : t.no, lead: tt.kinds[v.last.k][0], body: tt.kinds[v.last.k][1], extra: '' });
  else if (v.picked) lab.setState({ emo: '🤔', title: tt.predTitle, lead: tt.predLead, body: '', extra: '' });
  else lab.setState({ emo: '🕳️', title: tt.pickTitle, lead: tt.pickLead, body: '', extra: '' });
}

function renderV2(t) {
  const v = S.v2, tt = t.v2;
  if (v.ri >= 5) {
    $('p-feeling').innerHTML = `<p class="em-sum">${esc(tt.end[1])}</p><button class="btn" data-act="again2">${esc(t.again)}</button>`;
    lab.setState({ emo: '🏁', title: tt.end[0], lead: tt.end[1], body: '', extra: '' });
    return;
  }
  const want = R2[v.ri];
  let h = `<div class="em-tag">${esc(tt.tag(v.ri + 1, 5))}</div>${samRow(t, tt.rounds[want])}`;
  if (v.react) h += samRow(t, v.react);
  h += '<div class="em-wheel">';
  tt.feelings.forEach((f, i) => {
    const bad = v.wrong.includes(i), good = v.done && i === want;
    h += `<button class="em-f ${bad ? 'x' : ''} ${good ? 'ok' : ''}" data-act="pick2" data-i="${i}"${bad || v.done ? ' disabled' : ''}><span>${F_EMO[i]}</span>${esc(f)}</button>`;
  });
  h += '</div>';
  if (v.done) h += `<div class="em-go"><button class="btn" data-act="next2">${esc(t.next)}</button></div>`;
  $('p-feeling').innerHTML = h;
  if (v.done) lab.setState({ emo: '✅', title: t.right, lead: tt.rightLead, body: tt.rightBody, extra: '' });
  else if (v.wrong.length) lab.setState({ emo: '🤔', title: t.no, lead: tt.noLead, body: tt.noBody, extra: '' });
  else lab.setState({ emo: '👂', title: tt.pickTitle, lead: tt.pickLead, body: '', extra: '' });
}

function ruleHtml(tt) {
  return `<div class="em-rule-h">${esc(tt.ruleTitle)}</div><ul class="em-rule">${tt.rule.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>`;
}

function renderV3(t) {
  const v = S.v3, tt = t.v3, ended = !!v.log[3];
  let h = `<div class="em-tag">${esc(tt.tag(v.ti + 1, 4))}</div>`;
  for (let j = 0; j <= v.ti; j++) {
    h += samRow(t, tt.turns[j].sam);
    if (v.log[j]) h += meRow(tt.turns[j].o[v.log[j].i]);
  }
  if (!v.log[v.ti]) {
    h += '<div class="em-ans">';
    tt.turns[v.ti].o.forEach((o, i) => { h += `<button class="em-a ${v.picked === i ? 'sel' : ''}" data-act="pick3" data-i="${i}"><span>${esc(o)}</span></button>`; });
    h += '</div>';
    if (v.picked !== null) h += predRow(t, tt, 'pred3', ['closer', tt.closer], ['apart', tt.apart]);
  } else if (!ended) h += `<div class="em-go"><button class="btn" data-act="cont3">${esc(tt.cont)}</button></div>`;
  else h += `<div class="em-go"><button class="btn" data-act="again3">${esc(t.again)}</button></div>`;
  if (!ended) h += `<div class="em-go"><button class="em-ghost" data-act="rule">${esc(v.rule ? tt.ruleHide : tt.ruleBtn)}</button></div>`;
  $('p-fix').innerHTML = h;
  const rule = v.rule || ended ? ruleHtml(tt) : '';
  if (ended) { const e = tt.end(Math.round(v.C)); lab.setState({ emo: '🏁', title: e[0], lead: e[1], body: '', extra: rule }); return; }
  if (v.last) {
    const o = v.last.asked ? tt.asked : v.last.d > 0 ? tt.good : tt.bad;
    lab.setState({ emo: v.last.ok ? '✅' : '🤔', title: v.last.ok ? t.right : t.no, lead: o[0], body: o[1], extra: rule });
  } else if (v.picked !== null) lab.setState({ emo: '🤔', title: tt.predTitle, lead: tt.predLead, body: '', extra: rule });
  else lab.setState({ emo: '💬', title: tt.pickTitle, lead: tt.pickLead, body: '', extra: rule });
}

function renderSec(t) {
  const k = S.sec, sc = t.sec[k];
  let h = '', title = sc.title, lead = sc.lead, body = '';
  if (k === 'silent') {
    h = `<button class="btn" data-act="secgo" ${S.sb >= 3 ? 'disabled' : ''}>${esc(sc.btn)}</button>`;
    if (S.sb > 0) { lead = sc.steps[S.sb - 1]; body = S.sb >= 3 ? sc.end : ''; }
  } else {
    if (S.mb < 3) h = `<button class="btn" data-act="secgo">${esc(sc.btn)}</button>`;
    if (S.mb >= 1 && S.mb < 4) h += ` <button class="em-ghost" data-act="meask">${esc(sc.askBtn)}</button>`;
    if (S.mb === 4) h = `<button class="em-ghost" data-act="mereset">${esc(t.again)}</button>`;
    if (S.mb >= 1 && S.mb < 4) lead = sc.steps[S.mb - 1];
    if (S.mb === 4) lead = sc.askDone;
  }
  $('p-sec').innerHTML = `<div class="em-go" style="margin-top:0">${h}</div><div class="em-go"><button class="em-ghost" data-act="secback">${esc(t.sec.back)}</button></div>`;
  lab.setState({ emo: k === 'silent' ? '🤝' : '🗣️', title, lead, body, extra: '' });
}

enter(); snap(); render();
</script>
</body>
