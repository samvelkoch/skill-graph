// --- numbers (all computed here; sources in the fine print) --------------------------------------------------
const MOUSE_KG = 0.02;            // a house mouse: about 20 g (typical, rounded)
const ELE_KG = 4000, ELE_D = 3, MICE_D = 6;
const STEP_M = 0.5;               // one step on the seesaw = 50 cm (our choice)
const EARTH_KG = 5.9722e24;       // NASA Earth Fact Sheet
const PUSH_KG = 50;               // the push in the Archimedes thought experiment
const LY_M = 9.4607e15;           // 1 light-year in metres (IAU)
const C_MS = 299792458;           // speed of light, exact by definition
const YEAR_S = 365.25 * 86400;    // Julian year
const ANDRO_LY = 2.5e6;           // Andromeda Galaxy, about 2.5 million light-years (NASA)
const STRENGTH = 20;              // your push in the rock view, as the weight of 20 kg
const ARM_M = EARTH_KG * 1 / PUSH_KG;                     // Earth 1 m from the pivot
const ARM_MLY = ARM_M / LY_M / 1e6;                       // ≈ 12.6 million light-years
const ANDRO_X = Math.round(ARM_MLY * 1e6 / ANDRO_LY);     // ≈ 5
const LIFT_YEARS = Math.round(ARM_M * 0.01 / C_MS / YEAR_S / 1000) * 1000; // lift the Earth 1 cm at light speed
const ONE_MOUSE_KM = ELE_KG * ELE_D / MOUSE_KG * STEP_M / 1000;          // one mouse balancing the elephant

const nf = (x, d = 1) => new Intl.NumberFormat(lang, { maximumFractionDigits: d }).format(x);
// Hungarian: "-szor/-szer/-ször" after a numeral (by the last spoken word of 1..9)

// --- the turning effects -------------------------------------------------------------------------------------
// every item: weight (kg) × steps from the pivot; left counts for the left side, right for the right
function parts() {
  const L = [], R = [];
  for (const it of S.items) (it.d < 0 ? L : R).push({ m: KINDS[it.kind].m, d: Math.abs(it.d), kind: it.kind });
  if (S.mode === 'elephant') R.push({ m: MOUSE_KG * S.mice, d: MICE_D, kind: 'mice', n: S.mice });
  const by = (a, b) => a.d - b.d;
  L.sort(by); R.sort(by);
  return { L, R };
}
const sum = (arr) => arr.reduce((s, x) => s + x.m * x.d, 0);
const massOf = (arr) => arr.reduce((s, x) => s + x.m, 0);
const isBal = (a, b) => Math.abs(a - b) <= 1e-9 * Math.max(1, a, b);
function balance() {
  const { L, R } = parts(), tl = sum(L), tr = sum(R);
  const I = 8 + [...L, ...R].reduce((s, x) => s + x.m * x.d * x.d, 0);
  return { L, R, tl, tr, I, n: L.length + R.length, bal: isBal(tl, tr) };
}
const termStr = (arr) => arr.length
  ? `${arr.map((x) => x.kind === 'mice' ? `${nf(x.n)} × ${nf(MOUSE_KG, 2)} × ${x.d}` : `${nf(x.m)} × ${x.d}`).join(' + ')} = ${nf(sum(arr), 2)}`
  : '0';
function solvedNow(b) {
  if (!b.bal || b.n === 0) return false;
  if (S.mode === 'rabbits') return b.R.length > 0 && S.items.filter((it) => !it.fixed).every((it) => it.kind === 'rabbit');
  if (S.mode === 'cats') return S.items.filter((it) => it.kind === 'cat').length === 2 && S.items.filter((it) => !it.fixed).every((it) => it.kind === 'cat');
  if (S.mode === 'elephant') return true;
  return false;
}

    return;

}

// --- seesaw ------------------------------------------------------------------------------------------------------
let geo = { pegs: [], items: [], tray: [] };
let drag = null; // { kind, x, y }
let lastThud = 0;
function physics(dt, thMax, b) {
  if (S.held || S.mode === 'earth' || !S.asked) { S.th = 0; S.om = 0; return; }
  let a;
  if (b.n === 0 || b.bal) a = -16 * S.th - 7 * S.om; // gently level a balanced plank (see the fine print)
  else a = G_EFF * (b.tr - b.tl) / b.I - 0.6 * S.om;
  S.om += a * dt; S.th += S.om * dt;
  if (Math.abs(S.th) > thMax) {
    const sgn = Math.sign(S.th); S.th = sgn * thMax;
    if (S.om * sgn > 0) {
      if (S.om * sgn > 0.6 && performance.now() - lastThud > 250) { sfx.push(); lastThud = performance.now(); }

    }

}
function drawSeesaw(c, w, h, dt, time) {
  const t = T[lang];
  if (S.mode === 'earth') return drawEarth(c, w, h, time);
  const tray = SCENES[S.mode].tray;
  const st = clamp(Math.min((w - 28) / 13.4, h / 9.6), 14, 58), s = clamp(st * 0.95, 18, 46);
  const trayH = tray.length ? s * 1.8 + 8 : 10;
  const groundY = h - trayH - 8, pivH = st * 1.3, Lh = st * 6.5, cx = w / 2, py = groundY - pivH, pt = clamp(st * 0.26, 6, 14);
  const thMax = Math.asin(Math.min(0.95, (pivH - 1) / Lh));
  const b = balance();
  physics(dt, thMax, b);
  const th = S.th, cs = Math.cos(th), sn = Math.sin(th);
  const at = (X, Y) => [cx + X * cs - Y * sn, py + X * sn + Y * cs];

  // ground and the pivot
  c.strokeStyle = 'rgba(200,210,235,.35)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(w * 0.03, groundY); c.lineTo(w * 0.97, groundY); c.stroke();
  c.fillStyle = '#3a4160'; c.strokeStyle = 'rgba(200,210,235,.5)'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(cx, py); c.lineTo(cx + pivH * 0.75, groundY); c.lineTo(cx - pivH * 0.75, groundY); c.closePath(); c.fill(); c.stroke();
  // held level: two blocks under the ends
  if (S.held || !S.asked) {
    c.fillStyle = '#5a6280';
    for (const sg of [-1, 1]) { const x = cx + sg * (Lh - st * 0.5); rr(c, x - st * 0.3, py, st * 0.6, groundY - py, 3); c.fill(); }
  }
  // the plank
  c.save(); c.translate(cx, py); c.rotate(th);
  const g = c.createLinearGradient(0, -pt, 0, 0); g.addColorStop(0, '#c99a5b'); g.addColorStop(1, '#8f6436');
  c.fillStyle = g; rr(c, -Lh, -pt, Lh * 2, pt, 4); c.fill();
  for (let d = -PEGS; d <= PEGS; d++) {
    if (!d) continue;
    const hot = drag && geo.target === d;
    c.fillStyle = hot ? '#fff' : 'rgba(40,24,10,.55)'; c.beginPath(); c.arc(d * st, -pt * 0.5, hot ? 4 : 2.2, 0, 7); c.fill();
  }
  c.restore();
  pivotDot(c, cx, py, clamp(st * 0.13, 4, 7));
  // step numbers under the plank
  c.font = `800 ${clamp(st * 0.36, 10, 15)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  geo.pegs = [];
  for (let d = -PEGS; d <= PEGS; d++) {
    if (!d) continue;
    const [nx, ny] = at(d * st, st * 0.5);
    if (S.asked && !S.held) { c.fillStyle = d < 0 ? 'rgba(78,168,255,.8)' : 'rgba(255,138,61,.85)'; c.fillText(String(Math.abs(d)), nx, ny); }
    else { c.fillStyle = COL.mut; c.fillText(String(Math.abs(d)), nx, ny); }
    const [px, pyy] = at(d * st, -pt);
    geo.pegs.push({ d, x: px, y: pyy });
  }
  // items, stacked on their pegs
  geo.items = [];
  const counts = {};
  S.items.forEach((it, i) => {
    const k = counts[it.d] = (counts[it.d] ?? 0) + 1;
    const peg = geo.pegs.find((p) => p.d === it.d);
    const big = KINDS[it.kind].big ?? 1, size = s * big;
    const x = peg.x, y = peg.y - size * 0.5 - (k - 1) * s * 1.0;
    drawThing(c, it.kind, x, y, s);
    if (KINDS[it.kind].emo) tagNum(c, nf(KINDS[it.kind].m), x - size * 0.34, y + size * 0.3, s);
    if (it.fixed && it.kind !== 'elephant') emoji(c, '📌', x + size * 0.36, y - size * 0.36, s * 0.38);

  // the turning effects, as two bars built from blocks (only after the guess)
  if (S.asked && !S.held) drawTurning(c, w, h, cx, s, b);

  geo.tray = [];

    tray.forEach((kind, j) => {

      c.fillStyle = 'rgba(130,145,190,.10)'; c.strokeStyle = 'rgba(130,145,190,.25)'; c.lineWidth = 1; rr(c, x + 4, ty, sw - 8, trayH, 12); c.fill(); c.stroke();
      drawThing(c, kind, x + sw / 2, ty + trayH * 0.4, s * 0.95);
      c.font = `800 ${clamp(s * 0.3, 10, 13)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = '#D3D9E8'; c.fillText(`${nf(KINDS[kind].m)} ${t.kg}`, x + sw / 2, ty + trayH * 0.84);

  } else geo.target = null;
}

  const rows = [4, 3, 2, 1]; let k = 0;

    for (let j = 0; j < inRow; j++, k++) emoji(c, '🐭', peg.x + (j - (inRow - 1) / 2) * ms * 0.8, peg.y - ms * 0.45 - r * ms * 0.62, ms);

  label(c, txt, Math.min(peg.x, w - c.measureText(txt).width / 2 - 6), peg.y - ms * 0.6 - Math.ceil(shown / 4) * ms * 0.7 - 12, '#fff', fs);

  c.textAlign = 'right'; c.fillStyle = COL.L; c.fillText(lt, cx - 16, y);
  c.textAlign = 'left'; c.fillStyle = COL.R; c.fillText(rt, cx + 16, y);

  c.font = `800 ${clamp(qs * 0.5, 11, 14)}px Nunito, sans-serif`; c.fillStyle = COL.mut;
  c.fillText(t.who, w / 2, 26 + lines.length * qs * 1.2 + 4);

  c.fillRect(x0 - R * 0.5, by - bt, brk - 10 - (x0 - R * 0.5), bt);
  c.fillRect(brk + 10, by - bt, xE - brk - 10, bt);
  c.strokeStyle = '#b8c0d6'; c.lineWidth = 2;
  for (const dx of [-10, 10]) { c.beginPath(); c.moveTo(brk + dx - 4, by + 6); c.lineTo(brk + dx + 4, by - bt - 6); c.stroke(); }
  // the Earth
  const eg = c.createRadialGradient(x0 - R * 0.3, by - bt - R - R * 0.3, R * 0.1, x0, by - bt - R, R);
  eg.addColorStop(0, '#7fd0ff'); eg.addColorStop(0.6, '#2a74c9'); eg.addColorStop(1, '#173d73');
  c.fillStyle = eg; c.beginPath(); c.arc(x0, by - bt - R, R, 0, 7); c.fill();
  c.fillStyle = 'rgba(70,170,90,.85)';
  c.beginPath(); c.ellipse(x0 - R * 0.25, by - bt - R * 1.15, R * 0.35, R * 0.22, 0.5, 0, 7); c.fill();
  c.beginPath(); c.ellipse(x0 + R * 0.35, by - bt - R * 0.7, R * 0.25, R * 0.16, -0.4, 0, 7); c.fill();
  // the pivot
  c.fillStyle = '#3a4160'; c.strokeStyle = 'rgba(200,210,235,.5)'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(xP, by); c.lineTo(xP + R * 0.45, by + R * 0.7); c.lineTo(xP - R * 0.45, by + R * 0.7); c.closePath(); c.fill(); c.stroke();
  pivotDot(c, xP, by - bt / 2, 4);
  // distances
  const ds = clamp(w * 0.024, 11, 14);
  label(c, t.oneM, (x0 + xP) / 2, by + R * 0.95, '#fff', ds);
  label(c, `≈ ${nf(ARM_MLY, 1)} ${t.mly}`, (xP + xE) / 2, by - bt - ds * 1.2, '#fff', ds);
  c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1; c.setLineDash([3, 4]);
  c.beginPath(); c.moveTo(xP + 6, by + 14); c.lineTo(xE, by + 14); c.stroke(); c.setLineDash([]);
  // you, at the far end, pushing down
  const hx = xE, hy = by - bt, sz = clamp(R * 0.9, 18, 34);
  c.strokeStyle = '#EDEFF7'; c.lineWidth = 2.5; c.lineCap = 'round';
  c.beginPath(); c.arc(hx + sz * 0.15, hy - sz * 1.6, sz * 0.2, 0, 7); c.stroke();
  c.beginPath(); c.moveTo(hx + sz * 0.15, hy - sz * 1.4); c.lineTo(hx + sz * 0.3, hy - sz * 0.6); c.lineTo(hx + sz * 0.05, hy + sz * 0.5); c.moveTo(hx + sz * 0.3, hy - sz * 0.6); c.lineTo(hx + sz * 0.6, hy + sz * 0.5);
  c.moveTo(hx + sz * 0.18, hy - sz * 1.15); c.lineTo(hx, hy - 2); c.stroke(); c.lineCap = 'butt';
  arrow(c, hx - sz * 0.35, hy - sz * 1.2, hx - sz * 0.35, hy - sz * 0.25, COL.effort, 3);
  label(c, `${PUSH_KG} ${t.kg}`, hx - sz * 0.35, hy - sz * 1.45, COL.effort, ds);
}

// --- rock and bar ------------------------------------------------------------------------------------------------
const ROCK = Array.from({ length: 14 }, (_, i) => 0.86 + 0.14 * Math.sin(i * 2.7) * Math.cos(i * 1.3));
function drawLift(c, w, h, dt, time) {
  const t = T[lang], { p, N, M } = LS, q = N - p, can = canLift();
  // the push: only moves if you are strong enough
  if (LS.pushing && can) {
    LS.push = Math.min(1, LS.push + dt * 0.7);
    if (LS.push >= 1 && !LS.lifted) { LS.lifted = true; sfx.good(); render(); }
  } else if (!LS.pushing) LS.push = Math.max(0, LS.push - dt * 1.4);
  const st = clamp(Math.min((w - 24) / 28.5, h / 26), 7, 30);
  const gy = h * 0.8, f = st * 0.6, R = st * (M === 100 ? 2.1 : 2.9);
  const rcx = 10 + R, xL = rcx + R * 0.45, xP = xL + p * st;
  const a0 = Math.asin(clamp((f - 1) / (p * st), -1, 1)), a1 = -Math.asin(clamp((f - 1) / (q * st), -1, 1));
  let a = lerp(a0, a1, LS.push);
  if (LS.pushing && !can) a -= 0.006 * (1 + Math.sin(time * 40)); // straining, nothing moves
  const dir = [Math.cos(a), -Math.sin(a)], pv = [xP, gy - f];
  const loadEnd = [pv[0] - dir[0] * p * st, pv[1] - dir[1] * p * st], effEnd = [pv[0] + dir[0] * q * st, pv[1] + dir[1] * q * st];
  const rise = Math.max(0, p * st * (Math.sin(a0) - Math.sin(a)));
  // ground
  c.fillStyle = 'rgba(90,70,50,.25)'; c.fillRect(0, gy, w, h - gy);
  c.strokeStyle = 'rgba(200,210,235,.35)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, gy); c.lineTo(w, gy); c.stroke();
  // the rock
  const ry = gy - R * 0.86 - rise;
  c.fillStyle = '#6f6a66'; c.strokeStyle = '#9a948e'; c.lineWidth = 2; c.beginPath();
  ROCK.forEach((k, i) => { const an = i / ROCK.length * Math.PI * 2; const x = rcx + Math.cos(an) * R * k, y = ry + Math.sin(an) * R * 0.88 * k; i ? c.lineTo(x, y) : c.moveTo(x, y); });
  c.closePath(); c.fill(); c.stroke();
  label(c, `${M} ${t.kg}`, rcx, ry, '#fff', clamp(st * 0.6, 11, 17));
  // the pivot stone
  const fb = Math.max(f, 7);
  c.fillStyle = '#3a4160'; c.strokeStyle = 'rgba(200,210,235,.5)'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(xP, gy - f); c.lineTo(xP + fb * 1.1, gy); c.lineTo(xP - fb * 1.1, gy); c.closePath(); c.fill(); c.stroke();
  // the bar, with a mark at every step
  c.strokeStyle = '#b8c0d6'; c.lineWidth = clamp(st * 0.32, 4, 9); c.lineCap = 'round';
  c.beginPath(); c.moveTo(...loadEnd); c.lineTo(...effEnd); c.stroke(); c.lineCap = 'butt';
  c.fillStyle = 'rgba(40,46,70,.8)';
  for (let k = 1; k < N; k++) { if (k === p) continue; const x = loadEnd[0] + dir[0] * k * st, y = loadEnd[1] + dir[1] * k * st; c.beginPath(); c.arc(x, y, 1.6, 0, 7); c.fill(); }
  pivotDot(c, pv[0], pv[1], clamp(st * 0.2, 4, 7));
  // distances under the ground line
  const ly = gy + clamp(st * 0.9, 12, 22), fs = clamp(st * 0.5, 10, 14);
  c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = 1;
  for (const [x1, x2, n] of [[xL, xP, p], [xP, xL + N * st, q]]) {
    c.beginPath(); c.moveTo(x1 + 2, ly); c.lineTo(x2 - 2, ly); c.moveTo(x1 + 2, ly - 4); c.lineTo(x1 + 2, ly + 4); c.moveTo(x2 - 2, ly - 4); c.lineTo(x2 - 2, ly + 4); c.stroke();
    label(c, `${n} ${t.steps(n)}`, (x1 + x2) / 2, ly + fs * 0.95, n === p ? '#ffcf4a' : COL.effort, fs);
  }
  // your push at the far end
  const ex = effEnd[0], ey = effEnd[1];
  const yP = Math.max(ey - st * 3.9, fs * 2.5), yA = Math.min(Math.max(ey - st * 3.4, yP + fs * 0.9), ey - st * 1.6);
  arrow(c, ex, yA, ex, ey - st * 0.6, COL.effort, clamp(st * 0.22, 3, 6));
  label(c, t.yourPush, Math.min(ex, w - 70), yP, COL.effort, fs, 'center');
  label(c, t.need(nf(need(), 1)), Math.min(ex, w - 70), yP - fs * 1.3, can ? COL.ok : '#ff6b5e', fs, 'center');
  geo.liftTop = yP - fs * 1.9;
  emoji(c, can && LS.push > 0.98 ? '😄' : LS.pushing && !can ? '😣' : '✋', ex, ey - st * 1.1, clamp(st * 1.1, 14, 30));
  geo.lift = { xL, st, N };
}

// --- levers around us ---------------------------------------------------------------------------------------------
function drawDay(c, w, h, time) {
  const t = T[lang], u = Math.min(w / 14, h / 8), cx = w / 2, cy = h * 0.5, fs = clamp(u * 0.5, 11, 17), aw = clamp(u * 0.14, 3, 6);
  const L = t.lbl;
  label(c, t.cls[TOOLS[S.tool].cls], cx, clamp(h * 0.06, 14, 30), COL.mut, fs);
  if (S.tool === 'seesaw') {
    const a = 0.03 * Math.sin(time * 1.4), cs = Math.cos(a), sn = Math.sin(a);
    const at = (X, Y) => [cx + X * cs - Y * sn, cy + X * sn + Y * cs];
    c.fillStyle = '#3a4160'; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + u, cy + 1.5 * u); c.lineTo(cx - u, cy + 1.5 * u); c.closePath(); c.fill();
    c.save(); c.translate(cx, cy); c.rotate(a); c.fillStyle = '#b07f45'; rr(c, -5.8 * u, -0.3 * u, 11.6 * u, 0.3 * u, 4); c.fill(); c.restore();
    const [kx, ky] = at(-5 * u, -0.3 * u), [dx, dy] = at(u, -0.3 * u);
    emoji(c, '🐈', kx, ky - 0.55 * u, 1.1 * u); emoji(c, '🐕', dx, dy - 0.75 * u, 1.5 * u);
    arrow(c, kx, ky + 0.5 * u, kx, ky + 1.6 * u, COL.effort, aw); label(c, `${L.effort} · 4 ${t.kg} × 5`, kx, ky + 2.1 * u, COL.effort, fs * 0.9, 'center');
    arrow(c, dx, dy + 0.5 * u, dx, dy + 1.6 * u, COL.load, aw); label(c, `${L.load} · 20 ${t.kg} × 1`, dx + 0.4 * u, dy + 2.1 * u, COL.load, fs * 0.9, 'left');
    pivotDot(c, cx, cy, 5); label(c, L.pivot, cx, cy + 2.8 * u, COL.pivot, fs);
  } else if (S.tool === 'scissors') {
    const P = [cx + 1.2 * u, cy], a = 0.17 + 0.09 * Math.sin(time * 2.2), cardX = P[0] - 2.6 * u;
    c.fillStyle = '#c89b5a'; rr(c, cardX - 0.18 * u, cy - 1.8 * u, 0.36 * u, 3.6 * u, 3); c.fill();
    for (const sg of [1, -1]) {
      c.save(); c.translate(...P); c.rotate(sg * a);
      c.fillStyle = '#c9d1e6'; c.beginPath(); c.moveTo(0.4 * u, -0.22 * u * sg); c.lineTo(-5.6 * u, 0); c.lineTo(0.4 * u, 0.22 * u * sg); c.closePath(); c.fill();
      c.strokeStyle = sg > 0 ? '#ff5a4f' : '#4ea8ff'; c.lineWidth = 0.32 * u; c.lineCap = 'round';
      c.beginPath(); c.moveTo(0.3 * u, 0); c.lineTo(2.7 * u, 0); c.stroke();
      c.lineWidth = 0.22 * u; c.beginPath(); c.arc(3.35 * u, 0, 0.65 * u, 0, 7); c.stroke(); c.lineCap = 'butt';
      c.restore();
    }
    const gap = (P[0] - cardX) * Math.tan(a);
    arrow(c, cardX, cy - gap - 1.4 * u, cardX, cy - gap - 0.15 * u, COL.load, aw);
    arrow(c, cardX, cy + gap + 1.4 * u, cardX, cy + gap + 0.15 * u, COL.load, aw);
    label(c, L.load, cardX, cy - gap - 1.8 * u, COL.load, fs);
    const rx = P[0] + 3.35 * u * Math.cos(a), ryy = 3.35 * u * Math.sin(a);
    arrow(c, rx, cy - ryy - 1.9 * u, rx, cy - ryy - 0.75 * u, COL.effort, aw);
    arrow(c, rx, cy + ryy + 1.9 * u, rx, cy + ryy + 0.75 * u, COL.effort, aw);
    label(c, L.effort, rx, cy - ryy - 2.3 * u, COL.effort, fs);
    pivotDot(c, P[0], P[1], clamp(u * 0.18, 4, 8)); label(c, L.pivot, P[0], cy + 1.5 * u, COL.pivot, fs);
  } else if (S.tool === 'barrow') {
    const W = [cx - 4 * u, cy + 1.4 * u], r = 0.9 * u, lift = 0.07 * (1 + Math.sin(time * 1.6)) / 2;
    c.strokeStyle = 'rgba(200,210,235,.35)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(w * 0.04, W[1] + r); c.lineTo(w * 0.96, W[1] + r); c.stroke();
    const cs = Math.cos(-lift), sn = Math.sin(-lift), at = (X, Y) => [W[0] + X * cs - Y * sn, W[1] + X * sn + Y * cs];
    c.save(); c.translate(...W); c.rotate(-lift);
    c.strokeStyle = '#8f6436'; c.lineWidth = 0.22 * u; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, 0); c.lineTo(8.4 * u, -1.3 * u); c.moveTo(4.6 * u, -0.75 * u); c.lineTo(4.6 * u, r); c.stroke(); c.lineCap = 'butt';
    c.fillStyle = '#7a1f2b'; c.beginPath(); c.moveTo(0.3 * u, -2.5 * u); c.lineTo(5.3 * u, -2.5 * u); c.lineTo(4.4 * u, -0.6 * u); c.lineTo(1.3 * u, -0.6 * u); c.closePath(); c.fill();
    c.fillStyle = '#6b4a2a'; c.beginPath(); c.ellipse(2.8 * u, -2.5 * u, 2.3 * u, 0.75 * u, 0, Math.PI, 0); c.fill();
    c.restore();
    c.strokeStyle = '#D3D9E8'; c.lineWidth = 0.18 * u; c.beginPath(); c.arc(W[0], W[1], r, 0, 7); c.stroke();
    c.fillStyle = '#D3D9E8'; c.beginPath(); c.arc(W[0], W[1], 0.15 * u, 0, 7); c.fill();
    const [lx, ly] = at(2.8 * u, -3.3 * u), [hx, hy] = at(8.4 * u, -1.3 * u);
    arrow(c, lx, ly - 1.3 * u, lx, ly - 0.05 * u, COL.load, aw); label(c, L.load, lx, ly - 1.7 * u, COL.load, fs);
    arrow(c, hx, hy + 1.4 * u, hx, hy + 0.2 * u, COL.effort, aw); label(c, L.effort, hx, hy + 1.8 * u, COL.effort, fs);
    pivotDot(c, W[0], W[1], clamp(u * 0.18, 4, 8)); label(c, L.pivot, W[0], W[1] + r + 0.6 * u, COL.pivot, fs);
  } else if (S.tool === 'opener') {
    const B = cx - 2.6 * u, capTop = cy - 0.2 * u, P = [B - 0.6 * u, capTop];
    const open = (1 + Math.sin(time * 1.8)) / 2, a0 = -0.06, a = a0 - 0.14 * open;
    const hook = (an) => [P[0] + 1.2 * u * Math.cos(an) - 0.55 * u * Math.sin(an), P[1] + 1.2 * u * Math.sin(an) + 0.55 * u * Math.cos(an)];
    const capUp = Math.min(0, hook(a)[1] - hook(a0)[1]);
    c.fillStyle = 'rgba(61,180,120,.5)'; c.strokeStyle = 'rgba(120,230,170,.7)'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(B - 0.45 * u, capTop + 0.35 * u); c.lineTo(B - 0.45 * u, cy + 1.1 * u); c.quadraticCurveTo(B - 1.1 * u, cy + 1.5 * u, B - 1.1 * u, cy + 2.4 * u);
    c.lineTo(B - 1.1 * u, h + 4); c.lineTo(B + 1.1 * u, h + 4); c.lineTo(B + 1.1 * u, cy + 2.4 * u); c.quadraticCurveTo(B + 1.1 * u, cy + 1.5 * u, B + 0.45 * u, cy + 1.1 * u);
    c.lineTo(B + 0.45 * u, capTop + 0.35 * u); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#ffcf4a'; rr(c, B - 0.6 * u, capTop + capUp, 1.2 * u, 0.4 * u, 3); c.fill();
    c.save(); c.translate(...P); c.rotate(a);
    c.fillStyle = '#b8c0d6'; rr(c, -0.35 * u, -0.42 * u, 7.2 * u, 0.42 * u, 0.2 * u); c.fill();
    c.beginPath(); c.moveTo(1.05 * u, 0); c.lineTo(1.35 * u, 0); c.lineTo(1.35 * u, 0.62 * u); c.lineTo(0.95 * u, 0.62 * u); c.lineTo(0.95 * u, 0.48 * u); c.lineTo(1.12 * u, 0.48 * u); c.closePath(); c.fill();
    c.restore();
    const [hx, hy] = hook(a), ex = P[0] + 6.6 * u * Math.cos(a), ey = P[1] + 6.6 * u * Math.sin(a) - 0.2 * u;
    arrow(c, hx + 0.55 * u, hy + 1.5 * u, hx + 0.55 * u, hy + 0.15 * u, COL.load, aw); label(c, L.load, hx + 0.85 * u, hy + 1.3 * u, COL.load, fs, 'left');
    arrow(c, ex, ey - 0.3 * u, ex, ey - 1.6 * u, COL.effort, aw); label(c, L.effort, ex, ey - 2 * u, COL.effort, fs);
    pivotDot(c, P[0], P[1], clamp(u * 0.16, 4, 7)); label(c, L.pivot, P[0] - 0.3 * u, P[1] - 1.0 * u, COL.pivot, fs, 'right');
  } else {
    const P = [cx - 4.6 * u, cy], tipX = cx + 4.4 * u, close = (1 + Math.sin(time * 2)) / 2, gap = lerp(0.95 * u, 0.36 * u, close);
    const armY = (x, sg) => cy + sg * lerp(0.12 * u, gap, (x - P[0]) / (tipX - P[0]));
    c.strokeStyle = '#c9d1e6'; c.lineWidth = 0.26 * u; c.lineCap = 'round';
    for (const sg of [-1, 1]) { c.beginPath(); c.moveTo(P[0], cy + sg * 0.12 * u); c.lineTo(tipX, armY(tipX, sg)); c.lineTo(tipX + 0.3 * u, cy + sg * 0.32 * u); c.stroke(); }
    c.lineCap = 'butt';
    c.fillStyle = '#4ea8ff'; c.beginPath(); c.arc(tipX + 0.2 * u, cy, 0.3 * u, 0, 7); c.fill();
    const mx = cx - 0.6 * u;
    arrow(c, mx, armY(mx, -1) - 1.6 * u, mx, armY(mx, -1) - 0.25 * u, COL.effort, aw);
    arrow(c, mx, armY(mx, 1) + 1.6 * u, mx, armY(mx, 1) + 0.25 * u, COL.effort, aw);
    label(c, L.effort, mx, armY(mx, -1) - 2 * u, COL.effort, fs);
    arrow(c, tipX + 0.2 * u, cy - 1.3 * u, tipX + 0.2 * u, cy - 0.45 * u, COL.load, Math.max(2, aw * 0.6));
    arrow(c, tipX + 0.2 * u, cy + 1.3 * u, tipX + 0.2 * u, cy + 0.45 * u, COL.load, Math.max(2, aw * 0.6));
    label(c, L.load, tipX + 0.2 * u, cy - 1.7 * u, COL.load, fs);
    pivotDot(c, P[0], P[1], clamp(u * 0.16, 4, 7)); label(c, L.pivot, P[0], cy + 1.0 * u, COL.pivot, fs);
  }
}

// --- loop and pointer ---------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (lab.view === 'seesaw') drawSeesaw(c, w, h, dt, time);
  else if (lab.view === 'lift') drawLift(c, w, h, dt, time);
  else drawDay(c, w, h, time);
});
const cv = $('cv');
const pt = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
let liftDrag = false;
const setPivotX = (x) => {
  const g = geo.lift; if (!g) return;
  const p = clamp(Math.round((x - g.xL) / g.st), 1, g.N - 1);
  if (p !== LS.p) { LS.p = p; resetLift(); sfx.tick(); render(); }
};
cv.addEventListener('pointerdown', (ev) => {
  const [x, y] = pt(ev);
  if (lab.view === 'lift') { liftDrag = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ } setPivotX(x); return; }
  if (lab.view !== 'seesaw' || !S.asked || S.held || S.mode === 'earth' || S.mode === 'elephant') return;
  const slot = geo.tray.find((s) => x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h);
  let kind = slot?.kind;
  if (!kind) {
    // the top-most item under the finger (generous radius for small fingers)
    const hit = [...geo.items].reverse().find((it) => Math.hypot(x - it.x, y - it.y) < it.r);
    if (!hit) return;
    const it = S.items[hit.i];
    if (it.fixed) { sfx.bad(); return; }
    kind = it.kind; S.items.splice(hit.i, 1); render();
  }
  drag = { kind, x, y };
  try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ }
  sfx.click();
});
cv.addEventListener('pointermove', (ev) => {
  const [x, y] = pt(ev);
  if (liftDrag && lab.view === 'lift') return setPivotX(x);
  if (drag) { drag.x = x; drag.y = y; }
});
const endDrag = () => {
  liftDrag = false;
  if (!drag) return;
  const d = pegAt(drag.x, drag.y);
  if (d !== null) { S.items.push({ kind: drag.kind, d, fixed: false }); sfx.snap(); }
  drag = null; render();
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { liftDrag = false; drag = null; render(); });
render();
</script>
</body>
