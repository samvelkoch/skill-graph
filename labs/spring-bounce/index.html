// A damped oscillator, integrated with RK4 in fixed steps of H seconds; the loop feeds it real elapsed time.
// spring: q = displacement down from equilibrium (m); pendulum: q = angle (rad). Damping ratio 0.005.
class Osc {

    this.w0 = this.kind === 'pend' ? Math.sqrt(this.g / this.L) : Math.sqrt(this.k / this.m);
    this.gam = 0.01 * this.w0;
  }
  f(q, v) { return this.kind === 'pend' ? -(this.g / this.L) * Math.sin(q) - this.gam * v : -(this.k / this.m) * q - this.gam * v; }
  s() { return this.kind === 'pend' ? this.L * this.q : this.q; }
  step() {
    const h = H, q = this.q, v = this.v;
    const a1 = this.f(q, v), q2 = q + v * h / 2, v2 = v + a1 * h / 2;
    const a2 = this.f(q2, v2), q3 = q + v2 * h / 2, v3 = v + a2 * h / 2;
    const a3 = this.f(q3, v3), q4 = q + v3 * h, v4 = v + a3 * h;
    const a4 = this.f(q4, v4);
    this.q = q + h * (v + 2 * v2 + 2 * v3 + v4) / 6;
    this.v = v + h * (a1 + 2 * a2 + 2 * a3 + a4) / 6;
    this.t += h;
    if (!this.run) return;
    // one bounce = back at the lowest point: the velocity turns from "down" to "up"
    if (this.cyc < 10 && this.prevV > 0 && this.v <= 0) {
      this.cyc++;
      if (this.cyc === 10) { this.T10 = this.t - h + h * this.prevV / (this.prevV - this.v); this.T = this.T10 / 10; this.done = true; }
    }
    this.prevV = this.v;
    if ((++this.n & 3) === 0) { this.hist.push({ t: this.t, s: this.s() }); if (this.hist.length > 900) this.hist.shift(); }
  }
  advance(dt) { this.acc += dt; while (this.acc >= H) { this.acc -= H; this.step(); } }
  release(amp) {
    this.q = this.kind === 'pend' ? amp / this.L : amp; this.v = 0; this.t = 0; this.acc = 0; this.n = 0; this.run = true;
    this.cyc = 0; this.T10 = null; this.T = null; this.prevV = 0; this.done = false; this.rep = false; this.hist = [{ t: 0, s: this.s() }];
  }
}

let lastRead = '';
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view, sec = v === 'moon' ? S.sec : null, t = T[lang];
  for (const r of rigs) { r.advance(dt); if (r.done && !r.rep) { r.rep = true; dirty = true; onDone(r); } }
  const wide = w >= 640;
  const R = wide ? { x: 0, y: 0, w: Math.round(w * 0.46), h } : { x: 0, y: 0, w, h: Math.round(h * 0.6) };
  const G = wide ? { x: R.w + 6, y: 6, w: w - R.w - 12, h: h - 12 } : { x: 6, y: R.h + 2, w: w - 12, h: h - R.h - 8 };
  const bg = sec === 'space' ? 'space' : (v === 'moon' && S.moon && !sec) ? 'moon' : 'earth';
  sceneBg(c, R, bg);
  const hasWatch = R.w >= 280, rightEdge = hasWatch ? R.x + R.w - 92 : R.x + R.w - 12, leftEdge = R.x + 44;
  const started = rigs.filter((r) => r.run), allDone = started.length > 0 && started.every((r) => r.done);
  const tShow = allDone ? Math.max(...started.map((r) => r.T10)) : started.length ? Math.max(...started.map((r) => r.t)) : 0;
  const tNow = started.length ? Math.max(...started.map((r) => r.t)) : 0;
  const gy = R.y + R.h - 44, y0 = R.y + 26;

  if (sec === 'quartz') {
    const q = S.q, f = 32768 / 2 ** q;
    c.save(); fork(c, R.x + (leftEdge + rightEdge) / 2, R.y + R.h * 0.46, 3.2 * Math.sin(TAU * 2.5 * time)); c.restore();
    pill(c, t.qz.slow, (leftEdge + rightEdge) / 2, R.y + R.h - 22, w, '#B9C2DA');
    if (hasWatch) { // a watch face whose hand ticks f times a second
      const ticks = f * time, blur = f > 30, frac = ticks - Math.floor(ticks);
      const ang = blur ? ticks / 60 * TAU : (Math.floor(ticks) + (frac < 0.25 ? 0.5 - 0.5 * Math.cos(frac / 0.25 * Math.PI) : 1)) / 60 * TAU;
      watch(c, R.x + R.w - 48, R.y + 70, 31, ang, false, w, `${fmtInt(f)}/${t.sU}`, blur);
    }
    // the ladder of halvings
    c.save(); c.fillStyle = 'rgba(8,11,24,.74)'; c.strokeStyle = 'rgba(130,145,190,.28)'; c.beginPath(); c.roundRect(G.x, G.y, G.w, G.h, 14); c.fill(); c.stroke();
    c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(`${t.qz.step}: ${q} / 15`, G.x + 12, G.y + 15);

    for (let i = 0; i < 16; i++) {

      c.fillStyle = on ? '#2a1d04' : i < q ? '#B9C2DA' : '#98A0B8'; c.textAlign = 'center'; c.font = `${on ? 900 : 700} 12px Nunito, sans-serif`; c.fillText(fmtInt(32768 / 2 ** i), x + (cw - 4) / 2, y + (ch - 4) / 2 + 1);

    c.fillStyle = wg; c.strokeStyle = '#0f1327'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(wallX - 12, cyA - 40, 12, 110, 4); c.fill(); c.stroke();

    pill(c, r.done ? `T = ${fmt(r.T)} ${t.sU}` : r.run ? `${r.cyc}/10` : '—', (leftEdge + rightEdge) / 2, R.y + R.h - 11, w, '#EDEFF7');
    if (hasWatch) watch(c, R.x + R.w - 48, R.y + 70, 31, tShow / 10 * TAU, allDone, w, `${fmt(tShow, 2)} ${t.sU}`);

};
function onDone(r) {
  sfx.tick();

}
const releaseAll = () => {
  const v = lab.view;
  if (v === 'mass') rigs.forEach((r) => { r.tag = S.ai; r.release(AMPS[S.ai]); });
  else if (v === 'pairs') rigs.forEach((r) => r.release(AMPS[1]));
  else if (S.sec === 'space') rigs.forEach((r) => r.release(0.06));
  else { S.ran3 = true; rigs.forEach((r) => r.release(0.03)); }

$('ctrlBody').addEventListener('click', (ev) => {

  if (act === 'gB') { S.b1 = i; S.phase = 'free'; sfx.click(); build(); render(); showStage(); return; }
  if (act === 'mass') { S.mi = i; sfx.tick(); build(); render(); return; }
  if (act === 'amp') { S.ai = i; sfx.tick(); render(); return; }
  if (act === 'arr') { S.arr = b.dataset.k; sfx.click(); build(); render(); return; }
  if (act === 'gP') { S.g2[S.arr] = i; (i === (S.arr === 'par' ? 0 : 1) ? sfx.good : sfx.bad)(); build(); render(); showStage(); return; }
  if (act === 'gM') { S.g3 = i; S.moon = true; S.ran3 = true; (i === 1 ? sfx.good : sfx.bad)(); build(); render(); showStage(); return; }
  if (act === 'mass3') { S.mi3 = i; sfx.tick(); build(); render(); return; }
  if (act === 'world') { S.moon = b.dataset.k === 'moon'; sfx.click(); build(); render(); return; }
  if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; if (k === 'quartz') S.q = 0;

  }
  if (act === 'astro') { S.astro = i; sfx.tick(); build(); render(); return; }
  if (act === 'half') { S.q = Math.min(15, S.q + 1); sfx.tick(); render(); return; }
  if (act === 'qreset') { S.q = 0; sfx.click(); render(); return; }
  if (act === 'go') { releaseAll(); render(); showStage(); }
});

// --- the T–√m chart (view 1), drawn in the controls card ----------------------------------------------------------
function drawTM() {
  const cv = $('tmCv'); if (!cv || cv.offsetParent === null) return;
  const d = Math.min(devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight; if (!w) return;
  cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  const c = cv.getContext('2d'), t = T[lang].m; c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, w, h);
  const L = 44, Rr = 14, Tp = 12, B = 30, xmax = 0.7, ymax = 1.5, X = (s) => L + s / xmax * (w - L - Rr), Y = (v) => h - B - v / ymax * (h - B - Tp);
  c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.strokeStyle = 'rgba(190,205,255,.16)'; c.lineWidth = 1;
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (const v of [0, 0.5, 1, 1.5]) { c.beginPath(); c.moveTo(L, Y(v)); c.lineTo(w - Rr, Y(v)); c.stroke(); c.fillText(fmt(v, 1), L - 6, Y(v)); }
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  for (const s of [0, 0.2, 0.4, 0.6]) { c.strokeStyle = 'rgba(190,205,255,.1)'; c.beginPath(); c.moveTo(X(s), Tp); c.lineTo(X(s), h - B); c.stroke(); c.fillText(fmt(s, 1), X(s), h - B + 13); }
  c.fillText(t.plotX, w / 2, h - 3); c.textAlign = 'left'; c.fillText(t.plotY, 6, 12);
  const pts = Object.entries(S.tm).map(([mi, y]) => ({ x: Math.sqrt(MASSES[mi]), y, m: MASSES[mi] }));
  if (pts.length >= 2) {
    const sl = pts.reduce((a, p) => a + p.x * p.y, 0) / pts.reduce((a, p) => a + p.x * p.x, 0);
    c.strokeStyle = 'rgba(95,195,208,.8)'; c.setLineDash([6, 5]); c.lineWidth = 2; c.beginPath(); c.moveTo(X(0), Y(0)); c.lineTo(X(xmax - 0.02), Y(sl * (xmax - 0.02))); c.stroke(); c.setLineDash([]);
    c.fillStyle = TEAL; c.textAlign = 'right'; c.fillText(t.slope(fmt(sl, 2)), w - Rr - 2, Y(sl * (xmax - 0.02)) - 10 > 26 ? Y(sl * (xmax - 0.02)) - 10 : 26);
  }
  for (const p of pts) {
    c.fillStyle = '#f0c060'; c.strokeStyle = '#0f1327'; c.lineWidth = 1.5; c.beginPath(); c.arc(X(p.x), Y(p.y), 5.5, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = '#EDEFF7'; c.textAlign = 'left'; c.fillText(mg(p.m), X(p.x) + 8, Y(p.y) + 16);
  }
}
new ResizeObserver(() => drawTM()).observe($('tmCv'));

// --- readout, state card, facts: one function per view ----------------------------------------------------------------
function readout() {
  const t = T[lang], v = lab.view;
  if (v === 'mass') {
    if (S.phase === 'A' || S.phase === 'B') return ['?', t.m.one, '', '#e0b050'];
    if (S.phase === 'race') return [`${rigs[0].cyc} : ${rigs[1].cyc}`, `${t.m.rate}, ${mg(0.05)} : ${mg(0.1)}`, '', '#e0b050'];
    const r = rigs[0], Tm = S.tm[S.mi];
    return [Tm === undefined ? '—' : `${fmt(Tm)} ${t.sU}`, `${t.m.one}, ${mg(MASSES[S.mi])}`, r && r.run && !r.done ? `${r.cyc}/10` : '', '#e0b050'];
  }
  if (v === 'pairs') {
    const a = S.arr;
    if (S.g2[a] === null) return ['?', `${t.p.lab[a]}`, '', '#5fc3d0'];
    const k = a === 'par' ? 2 * K : K / 2;
    return [`${fmt(periodOf(0.1, k))} ${t.sU}`, t.p.lab[a], `${t.p.one}: ${fmt(periodOf(0.1, K))} ${t.sU}`, '#5fc3d0'];
  }
  if (S.sec === 'space') { const r = rigs[0]; return [r && r.done ? `${fmt(r.T)} ${t.sU}` : '—', r ? r.label() : '', r && r.run && !r.done ? `${r.cyc}/10` : '', '#e0b050']; }
  if (S.sec === 'quartz') return [fmtInt(32768 / 2 ** S.q), t.qz.perS, '', '#e0b050'];
  const [sp, pe] = rigs;
  return [`${sp.done ? fmt(sp.T) : '—'} : ${pe.done ? fmt(pe.T) : '—'} ${t.sU}`, `${t.o.spring} : ${t.o.pend}`, S.moon ? '🌙' : '🌍', '#9fb0d6'];
}
const chip = (act, i, label, on, extra = '') => `<button class="chip ${on ? 'on' : ''}" type="button" data-act="${act}" data-i="${i}"${extra}>${esc(label)}</button>`;
const qHTML = (q, opts, act) => `<p class="sb-q">${esc(q)}</p><div class="sb-opts">${opts.map((o, i) => `<button class="sb-opt" type="button" data-act="${act}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
const row = (a, b, c2, on, h) => `<div class="r${h ? ' h' : ''}${on ? ' on' : ''}"><b>${esc(a)}</b><span>${esc(b)}</span><span>${esc(c2)}</span></div>`;

function render() {
  const v = lab.view;
  $('secMass').hidden = v !== 'mass'; $('secPairs').hidden = v !== 'pairs'; $('secMoon').hidden = v !== 'moon';
  if (v === 'mass') renderMass(T[lang]); else if (v === 'pairs') renderPairs(T[lang]); else renderMoon(T[lang]);
  const rd = readout(); lastRead = rd.join('|'); lab.setReadout(...rd);
}
function renderMass(t) {
  const m = t.m, free = S.phase === 'free';
  lab.setGlow('rgba(224, 176, 80, .26)');
  $('mPred').hidden = free; $('mRun').hidden = !free;
  let st;
  if (S.phase === 'A') { $('mPred').innerHTML = qHTML(m.qA, m.oA, 'gA'); st = ['🤔', m.introT, m.introL, '']; }
  else if (S.phase === 'B') { $('mPred').innerHTML = qHTML(m.qB, m.oB, 'gB'); st = ['🤔', m.stB, m.stBL, '']; }
  else if (S.phase === 'race') {
    $('mPred').innerHTML = `<button class="btn" type="button" data-act="mNext">${esc(m.next)}</button>`;
    st = [S.a1 === 1 ? '✅' : '🤔', ...m.revA(S.a1 === 1)];
  } else {
    $('mL1').textContent = m.massL; $('mL2').textContent = m.pullL;
    $('mMass').innerHTML = MASSES.map((x, i) => chip('mass', i, mg(x), i === S.mi)).join('');
    $('mAmp').innerHTML = AMPS.map((x, i) => chip('amp', i, `${Math.round(x * 100)} ${t.cmU}`, i === S.ai)).join('');
    $('mGo').textContent = rigs[0] && rigs[0].run ? t.again : t.go;
    $('mTab').innerHTML = row(m.tbl[0], m.tbl[1], m.tbl[2], false, true) + MASSES.map((x, i) =>
      row(mg(x), fmt(Math.sqrt(x), 2), S.tm[i] === undefined ? '—' : `${fmt(S.tm[i])} ${t.sU}`, i === S.mi)).join('');
    // findings, in the order the child can reach them
    const R = S.tm[1] !== undefined && S.tm[3] !== undefined ? S.tm[3] / S.tm[1] : S.tm[0] !== undefined && S.tm[2] !== undefined ? S.tm[2] / S.tm[0] : null;
    let title, lead, body = [];
    if (!S.last) [title, lead, body[0]] = m.free;
    else { [title, lead] = m.timed(mg(MASSES[S.last.mi]), fmt(S.tm[S.last.mi]), fmt(S.last.t10)); }
    if (R !== null) { const [vt, vl] = m.verB(S.b1 === 1, fmt(R, 1)); if (S.last) { lead = `${vt} ${vl}`; } }
    else if (S.last) lead += ` ${m.more}`;
    if (Object.keys(S.tm).length >= 3) body.push(m.line);
    const am = Object.keys(S.ta).map((k) => k.split('_').map(Number)).find(([mi, ai]) => Object.keys(S.ta).some((k2) => k2 !== `${mi}_${ai}` && +k2.split('_')[0] === mi));
    if (am) {
      const mi = am[0], two = Object.keys(S.ta).filter((k) => +k.split('_')[0] === mi).map((k) => +k.split('_')[1]);
      body.push(m.amp(mg(MASSES[mi]), Math.round(AMPS[two[0]] * 100), fmt(S.ta[`${mi}_${two[0]}`]), Math.round(AMPS[two[1]] * 100), fmt(S.ta[`${mi}_${two[1]}`])));
    }
    st = [S.last ? '⏱' : '🪀', title, lead, body.filter(Boolean).join(' ')];
    drawTM();
  }
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] });
  lab.setFacts(t.facts.m);
}
function renderPairs(t) {
  const p = t.p, a = S.arr, g = S.g2[a];
  lab.setGlow('rgba(95, 195, 208, .26)');
  $('pArr').innerHTML = ['par', 'ser'].map((k) => `<button class="chip ${k === a ? 'on' : ''}" type="button" data-act="arr" data-k="${k}">${esc(p.arr[k])}</button>`).join('');
  $('pPred').hidden = g !== null; $('pRun').hidden = g === null;
  const T1 = periodOf(0.1, K);
  let st;
  if (g === null) { $('pPred').innerHTML = qHTML(p.q[a], p.o, 'gP'); st = ['🔗', p.introT, p.introL, '']; }
  else {
    $('pGo').textContent = t.again;
    $('pTab').innerHTML = row(p.tbl[0], p.tbl[1], p.tbl[2], false, true) + [['one', K], ...['par', 'ser'].filter((k) => S.g2[k] !== null).map((k) => [k, k === 'par' ? 2 * K : K / 2])]
      .map(([k, kk]) => row(k === 'one' ? p.one : p.lab[k], fmt(kk, 0), fmt(periodOf(0.1, kk)), k === a)).join('');
    const kk = a === 'par' ? 2 * K : K / 2, ok = g === (a === 'par' ? 0 : 1);
    const [title, lead, body] = p.ver[a](ok, fmt(kk, 0), fmt(periodOf(0.1, kk)), fmt(T1));
    const both = S.g2.par !== null && S.g2.ser !== null ? p.both(fmt(periodOf(0.1, 2 * K) / T1), fmt(periodOf(0.1, K / 2) / T1)) : '';
    st = [ok ? '✅' : '🤔', title, lead, [body, both].filter(Boolean).join(' ')];
  }
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] });
  lab.setFacts(t.facts.p);
}
function renderMoon(t) {
  const o = t.o, g = S.g3, sec = S.sec;
  lab.setGlow('rgba(159, 176, 214, .26)');
  $('oMain').hidden = !!sec; $('oSec').hidden = !sec;
  $('oL2').textContent = o.sec;
  const open = secret.unlocked();
  $('oSecChips').innerHTML = [['space', '🧑‍🚀', t.sp.name], ['quartz', '⌚', t.qz.name]].map(([k, e, n]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" type="button" data-act="sec" data-k="${k}">${open ? `${e} ${esc(n)}` : '🔒 ???'}</button>`).join('');
  let st, facts = t.facts.o;
  if (sec === 'space') {
    const r = rigs[0];
    $('oSec').innerHTML = `<div class="row2" style="margin-top:12px"><span class="lbl">${esc(t.sp.astro)}</span><div class="chips">${t.sp.letters.map((l, i) => chip('astro', i, l, i === S.astro)).join('')}</div></div>
      <div class="row2"><button class="btn" type="button" data-act="go">${esc(r && r.run ? t.again : t.go)}</button></div>`;
    st = r && r.done ? ['🧑‍🚀', ...t.sp.post(fmt(r.T), Math.round(K_A * r.T * r.T / (4 * Math.PI * Math.PI)))] : ['🧑‍🚀', ...t.sp.pre];
    facts = t.facts.sp; lab.setGlow('rgba(224, 176, 80, .26)');
  } else if (sec === 'quartz') {
    const q = S.q, f = 32768 / 2 ** q;
    $('oSec').innerHTML = `<div class="row2" style="margin-top:12px"><button class="btn" type="button" data-act="half"${q >= 15 ? ' disabled' : ''}>${esc(t.qz.halve)}</button><button class="chip" type="button" data-act="qreset">${esc(t.qz.reset)}</button></div>`;
    st = q >= 15 ? ['⌚', ...t.qz.fin] : ['⌚', t.qz.title(fmtInt(f)), t.qz.lead];
    facts = t.facts.qz; lab.setGlow('rgba(224, 176, 80, .26)');
  } else {
    const [sp, pe] = rigs;
    $('oPred').hidden = g !== null;
    if (g === null) $('oPred').innerHTML = qHTML(o.q, o.opts, 'gM');
    $('oRow1').hidden = S.phase !== 'free'; $('oL1').textContent = o.massL;
    $('oMass').innerHTML = MASSES3.map((x, i) => chip('mass3', i, mg(x), i === S.mi3)).join('');
    $('oGo').textContent = sp.run ? t.again : t.go;
    $('oWorld').innerHTML = g === null ? '' : [['earth', !S.moon], ['moon', S.moon]].map(([k, on]) => `<button class="chip ${on ? 'on' : ''}" type="button" data-act="world" data-k="${k}">${esc(o[k])}</button>`).join('');
    const m = MASSES3[S.mi3], Ts = periodOf(m, K), Te = pendPeriod(G_E), Tm = pendPeriod(G_M);
    $('oTab').hidden = g === null;
    $('oTab').innerHTML = g === null ? '' : row(o.tbl[0], o.tbl[1], o.tbl[2], false, true) + row(o.pend, `${fmt(Te)} ${t.sU}`, `${fmt(Tm)} ${t.sU}`, false) + row(o.spring, `${fmt(Ts)} ${t.sU}`, `${fmt(Ts)} ${t.sU}`, false);
    if (g === null) {
      const both = sp.done && pe.done ? o.both(fmt(sp.T), fmt(pe.T)) : '';
      st = ['🌍', o.introT, o.introL, [both, o.introB].filter(Boolean).join(' ')];
    } else {
      const [title, lead, body] = o.ver(g === 1, fmt(Te), fmt(Tm), fmt(Math.sqrt(G_E / G_M)), fmt(Ts));
      st = [g === 1 ? '✅' : '🤔', title, lead, body];
    }
  }
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] });
  lab.setFacts(facts);
}
build();
render();
</script>
