// Kim: plain Bayes over the jars, then rounded to whole beans that add up to 100 (every jar keeps at least 1 % so nothing is ever "impossible")
function toBeans(p) {
  const raw = p.map((x) => x * 100), out = raw.map(Math.floor); let rest = 100 - out.reduce((a, b) => a + b, 0);
  raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0) { out[i]++; rest--; } });
  return out;
}
function kimSteps(lik, n) {
  let p = Array(n).fill(1 / n); const out = [toBeans(p)];
  for (const l of lik) {
    p = p.map((x, i) => x * l[i]); let s = p.reduce((a, b) => a + b, 0); p = p.map((x) => Math.max(.01, x / s)); s = p.reduce((a, b) => a + b, 0); p = p.map((x) => x / s);
    out.push(toBeans(p));
  }
  return out;
}

// --- the 100 beans -----------------------------------------------------------------------------------------------------
const B = { beans: [], n: 5 };
const jarCx = (j, n) => (480 / n) * (j + .5);
const slotXY = (j, k, n) => { const row = Math.floor(k / 7), col = k % 7; return [jarCx(j, n) - 27 + col * 9 + (row % 2) * 4 + (hash(j * 131 + k) - .5) * 2.5, 295 - row * 6.3 + (hash(k * 7 + j) - .5) * 1.4]; };
function initBeans(counts, n) {
  B.n = n; B.beans = [];
  counts.forEach((cnt, j) => { for (let k = 0; k < cnt; k++) { const [x, y] = slotXY(j, k, n); B.beans.push({ jar: j, slot: k, x, y, fx: x, fy: y, tx: x, ty: y, t: 1, a: hash(j * 53 + k * 3) * Math.PI, sh: hash(k + j * 9) }); } });
}
function setCounts(counts) {
  const n = B.n, cur = Array(n).fill(0); B.beans.forEach((b) => cur[b.jar]++);
  const pool = [];
  for (let j = 0; j < n; j++) if (cur[j] > counts[j]) for (const b of B.beans) if (b.jar === j && b.slot >= counts[j]) pool.push(b);
  const have = cur.map((x, j) => Math.min(x, counts[j]));
  for (let j = 0; j < n; j++) while (have[j] < counts[j] && pool.length) {
    const b = pool.shift(), [x, y] = slotXY(j, have[j], n);
    b.fx = b.x; b.fy = b.y; b.tx = x; b.ty = y; b.t = 0; b.jar = j; b.slot = have[j]++;
  }
}

  a += `<div class="cm-row"><button class="btn cm-go" data-act="mnext"${ok ? '' : ' disabled'}>${esc(m.stage === 3 ? M.go : t.btn.next)} →</button><button class="chip" data-act="mineback">${esc(M.back)}</button></div>`;
  $('v1a').innerHTML = a; $('v1b').innerHTML = ''; $('cmCap').textContent = '';
  lab.setReadout('🧩', t.secrets.mine[0], '🫘 100', '#e0b050');
  lab.setState({ emo: '🧩', title: t.secrets.mine[0], lead: t.secrets.mine[1], body: '', extra: '' });
}

function renderStrength(t) {
  const st = S.st, s = t.str, id = st.story, lik = LIK[id][st.clue], pa = lik[st.a], pb = lik[st.b], pred = st.pred !== null, X = t.st[id];
  const na = X.jars[st.a], nb = X.jars[st.b], ea = EMO[id][st.a], eb = EMO[id][st.b];
  let h = `<div class="chips">${IDS.map((k) => chip('sstory', `data-id="${k}"`, esc(t.st[k].chip), id === k)).join('')}</div>
    <div class="cm-row"><span class="lbl">${esc(s.pickA)}</span><div class="chips">${EMO[id].map((e, j) => chip('sa', `data-j="${j}"`, e, st.a === j, 'sm')).join('')}</div></div>
    <div class="cm-row"><span class="lbl">${esc(s.pickB)}</span><div class="chips">${EMO[id].map((e, j) => chip('sb', `data-j="${j}"`, e, st.b === j, 'sm')).join('')}</div></div>
    <div class="cm-q" style="margin-bottom:4px">${esc(s.lead)}</div><div class="chips" style="flex-direction:column;align-items:stretch">${X.clues.map((cl, i) => chip('sclue', `data-i="${i}"`, `${i + 1} · ${esc(X.shorts[i])}`, st.clue === i)).join('')}</div>
    <div class="cm-note"><b>${esc(X.clues[st.clue])}</b><br>${esc(s.bars(`${ea} ${na}`))} / ${esc(s.bars(`${eb} ${nb}`))}</div>`;
  const r = Math.max(pa, pb) / Math.min(pa, pb), same = r < 1.5, truth = pa > pb ? 'a' : 'b';
  if (!pred) h += `<div class="cm-q">${esc(s.q)}</div><div class="chips">${chip('spred', 'data-k="a"', `${ea} ${esc(na)}`, false)}${chip('spred', 'data-k="b"', `${eb} ${esc(nb)}`, false)}${chip('spred', 'data-k="same"', esc(s.same), false)}</div>`;
  else {
    const ok = st.pred === (same ? 'same' : truth), rs = dec(r, r >= 10 ? 0 : 1);
    h += `<p class="cm-note"><b>${esc(ok ? s.stAnsR : s.ansNo)}</b> ${esc(same ? s.ratioSame : s.ratio(rs, pa > pb ? `${ea} ${na}` : `${eb} ${nb}`, pa > pb ? `${eb} ${nb}` : `${ea} ${na}`))}</p>`;
  }
  $('v2').innerHTML = h;
  if (!pred) lab.setReadout('?', '', '', '#5fa8a0'); else lab.setReadout(same ? '≈ 1' : s.val(dec(r, r >= 10 ? 0 : 1)), same ? '' : s.subv(pa > pb ? ea : eb, pa > pb ? eb : ea), '', '#5fa8a0');
  const sx = !pred ? s.stAsk : same ? s.stSame : s.stBig;
  lab.setState({ emo: sx[0], title: sx[1], lead: sx[2], body: '', extra: '' });
}
function setPred(k) { S.st.pred = k; S.st.t0 = now(); sfx.click(); }

function renderFore(t) {
  const fc = S.fc, f = t.fo, done = fc.picks.length >= 20;
  let h = '';
  if (fc.phase === 'pick' && !done) h += `<div class="cm-q">${esc(f.day(fc.picks.length + 1, 20))} · ${esc(f.q)}</div><div class="cm-days">${PRC.map((p) => `<button class="chip" data-act="fpick" data-p="${p}">${p}%</button>`).join('')}</div>`;
  else if (fc.phase === 'pick') h += `<div class="cm-row"><button class="btn cm-go" data-act="freveal">${esc(f.reveal)} →</button></div>`;
  else {
    const b = brier(), gi = b < .12 ? 0 : b < .19 ? 1 : b < .25 ? 2 : 3;
    h += `<p class="cm-note"><b>${esc(f.err)}: ${dec(b, 2)}</b> · ${esc(f.grade[gi])}<br>${esc(f.errOf(dec(b, 2)))}</p><div class="cm-row"><button class="btn cm-go" data-act="fagain">↺ ${esc(f.again)}</button></div>`;
  }
  h += `<p class="cm-cap">${esc(f.ofLabel)}</p>`;
  $('v3').innerHTML = h;
  if (fc.phase === 'reveal') lab.setReadout(dec(brier(), 2), f.err, '0 – 1', '#4ea8ff'); else lab.setReadout(`${fc.picks.length} / 20`, f.sub, '', '#4ea8ff');
  const st = fc.phase === 'reveal' ? f.stRes : f.stPick;
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' });
}

// --- events ------------------------------------------------------------------------------------------------------------------------
function mainAct() {
  const r = S.run;
  if (r.kimOnly) {
    if (r.done) { startMine(); return; }
    r.ci++; r.counts = r.kim[r.ci].slice(); setCounts(r.counts); r.hist[r.ci] = r.counts.slice(); if (r.ci === r.lik.length) r.done = true; return;
  }
  if (r.lockJar || (r.done && r.hist.length > 6)) {
    if (r.done) { startLock(); return; }
    if (r.ci < 5) { r.ci++; r.hist[r.ci] = r.counts.slice(); } else { r.counts = r.kim[5].slice(); setCounts(r.counts); r.hist[6] = r.counts.slice(); r.done = true; r.lockJar = false; }
    return;
  }
  if (r.done) { newRun(r.id); return; }
  if (r.locked) { r.ci++; r.locked = false; } else { r.hist[r.ci] = r.counts.slice(); r.locked = true; if (r.ci === 5) r.done = true; }
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, r = S.run;
  if (act === 'story') { S.story = b.dataset.id; S.sec = null; newRun(S.story); sfx.click(); }
  else if (act === 'step') { S.step = +b.dataset.k; sfx.tick(); }
  else if (act === 'jar') {
    const j = +b.dataset.j, d = +b.dataset.d, e = r.n - 1;
    const m = d > 0 ? Math.min(S.step, r.counts[e]) : Math.min(S.step, r.counts[j]);
    if (m > 0) { r.counts[j] += d * m; r.counts[e] -= d * m; setCounts(r.counts); sfx.tick(); }
  } else if (act === 'main') { sfx.click(); mainAct(); showStage(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    sfx.click();
    if (S.sec === b.dataset.k) { S.sec = null; newRun(S.story); }
    else { S.sec = b.dataset.k; if (S.sec === 'lock') startLock(); else { S.mine = { stage: 1, jars: [], clues: [], fit: {} }; } }
    showStage();
  }
  else if (act === 'mineback') { S.mine = { stage: 1, jars: [], clues: [], fit: {} }; newRun(S.story); S.sec = 'mine'; }
  else if (act === 'mjar') { const i = +b.dataset.i, m = S.mine, k = m.jars.indexOf(i); if (k >= 0) m.jars.splice(k, 1); else if (m.jars.length < 3) m.jars.push(i); sfx.tick(); }
  else if (act === 'mclue') { const i = +b.dataset.i, m = S.mine, k = m.clues.indexOf(i); if (k >= 0) m.clues.splice(k, 1); else if (m.clues.length < 3) m.clues.push(i); sfx.tick(); }
  else if (act === 'mfit') { S.mine.fit[b.dataset.k] = +b.dataset.v; sfx.tick(); }
  else if (act === 'mnext') { const m = S.mine; sfx.click(); if (m.stage < 3) m.stage++; else { m.stage = 4; startMine(); } }
  else if (act === 'sstory') { const id = b.dataset.id; S.st = { story: id, clue: 0, a: DEF_AB[id][0], b: DEF_AB[id][1], pred: null, t0: 0 }; sfx.click(); }
  else if (act === 'sa') { S.st.a = +b.dataset.j; if (S.st.b === S.st.a) S.st.b = (S.st.a + 1) % 5; S.st.pred = null; sfx.tick(); }
  else if (act === 'sb') { S.st.b = +b.dataset.j; if (S.st.a === S.st.b) S.st.a = (S.st.b + 1) % 5; S.st.pred = null; sfx.tick(); }
  else if (act === 'sclue') { S.st.clue = +b.dataset.i; S.st.pred = null; sfx.tick(); }
  else if (act === 'spred') { setPred(b.dataset.k); showStage(); }
  else if (act === 'fpick') { S.fc.picks.push(+b.dataset.p); sfx.click(); }
  else if (act === 'freveal') { S.fc.phase = 'reveal'; S.fc.t0 = now(); sfx.good(); showStage(); }
  else if (act === 'fagain') newFc(S.fc.seed + 1);
  render();
});

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (lab.view === 'stories') drawStories(c, w, h, dt, time); else if (lab.view === 'strength') drawStrength(c, w, h, dt, time); else drawFore(c, w, h, dt, time);
});
canvasLoop($('cmChart'), (c, w, h, dt) => drawChart(c, w, h));
render();
</script>
</body>
