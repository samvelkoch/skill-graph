const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

const hyper = (N, K, n) => { let k = 0; for (let i = 0; i < n; i++) if (Math.random() * (N - i) < K - k) k++; return k; }; // tagged among n drawn without replacement

const angLerp = (a, b, t) => a + angDiff(b, a) * t;

const S_ZONE = (Math.acos(-ZU) - (-ZU) * Math.sqrt(1 - ZU * ZU)) / Math.PI;

function sim2(fl) {
  for (let tries = 0; tries < 60; tries++) {
    const Mv = fl.tags ? binom(B.M, 0.5) : B.M;                       // tags still on
    const N1 = B.N0 + (fl.young ? Math.round(0.4 * B.N0) : 0);        // fish in the lake at the second catch
    let C = B.C, R;
    if (fl.mix) { const zone = Mv + binom(N1 - Mv, S_ZONE); C = Math.min(C, zone); R = hyper(zone, Mv, C); }
    else R = hyper(N1, Mv, C);
    if (R > 0) return B.M * C / R;
  }
  return B.N0;
}
function runsData(C) {
  if (X.cache[C]) return X.cache[C];
  const N = 240, M = 40, bins = new Array(30).fill(0), est = [];
  for (let k = 0; k < 400; k++) { const R = hyper(N, M, C); if (!R) continue; const e = M * C / R; est.push(e); bins[Math.min(29, Math.floor(e / 20))]++; }
  est.sort((a, b) => a - b);
  const q = (p) => (est.length ? est[Math.min(est.length - 1, Math.floor(p * est.length))] : 0);
  const within = est.filter((e) => Math.abs(e - N) <= N * 0.2).length;
  return (X.cache[C] = { bins, lo: q(0.1), hi: q(0.9), pct: Math.round(within / 4), N, M });
}

function mainA() {
  if (A.phase !== 'idle') return;
  const s = A.step;
  if (s === 0) { A.Mt = A.M; startCatch(A.M, 'catch1'); }
  else if (s === 1) { A.phase = 'mix'; A.t0 = A.clk; A.fish.filter((f) => f.tag).forEach((f) => { const th = rnd(0, TAU), r = Math.sqrt(Math.random()) * 0.78; f.target = { x: Math.cos(th) * r, y: Math.sin(th) * r }; }); sfx.click(); }

  else if (s === 3 && A.R > 0) {
    if (A.guess === null) return;
    A.rev = true; A.round++; A.hist.push({ est: A.est, tru: A.N, k: '🐟' }); A.step = 4;
    (Math.abs(A.guess - A.est) / A.est <= 0.15 ? sfx.good : sfx.bad)(); render(); showStage(); return;
  } else { // step 4, or no tagged fish: let the catch go and catch again
    A.sel.forEach((f, i) => { f.st = 'back'; f.t0 = A.clk + i * 0.01; f.dur = 0.5; f.du = f.u; f.dv = f.v; }); A.phase = 'ret'; A.guess = null; sfx.click();

}

  render(); showStage();
}

  $('c1s').hidden = !showSl; slider.disabled = busy; if (+slider.value !== mv) slider.value = mv;
  $('c1l').textContent = s === 0 ? l.m(A.M) : l.c(A.C);
  const showG = s === 3 && A.R > 0;
  $('c1g').hidden = !showG; const gv = A.guess === null ? '' : String(A.guess); if ($('tfG').value !== gv) $('tfG').value = gv;
  $('c1m').textContent = s === 0 ? l.tagBtn(A.M) : s === 1 ? l.mixBtn : s === 2 ? l.catchBtn(A.C) : s === 3 && A.R > 0 ? l.check : l.ret;
  $('c1m').disabled = busy || (s === 3 && A.R > 0 && A.guess === null);
  $('c1n').textContent = t.newLake; $('c1n').disabled = busy;
  let st, readout;
  if (ph === 'catch1' || ph === 'tag' || ph === 'release') { const [a, b] = l.busy1(A.Mt); st = { emo: '🥅', title: a, lead: b }; }
  else if (ph === 'mix') { const [a, b] = l.mixing; st = { emo: '🌊', title: a, lead: b }; }
  else if (ph === 'catch2') { const [a, b] = l.busy2(A.sel.length); st = { emo: '🥅', title: a, lead: b }; }
  else if (s === 0) { const [a, b] = l.s0; st = { emo: '🐟', title: a, lead: b }; }
  else if (s === 1) { const [a, b] = l.s1(A.Mt); st = { emo: '🏷️', title: a, lead: b }; }
  else if (s === 2) { const [a, b] = l.s2; st = { emo: '🎣', title: a, lead: b }; }
  else if (s === 3 && A.R === 0) { const [a, b] = l.none(A.sel.length); st = { emo: '🫥', title: a, lead: b }; }
  else if (s === 3) { const [a, b] = l.s3(A.sel.length, A.R, A.Mt); st = { emo: '🤔', title: a, lead: b, body: l.s3b }; }
  else {
    const good = A.guess !== null && Math.abs(A.guess - A.est) / A.est <= 0.15;
    if (A.guess !== null && A.round === 1) st = { emo: good ? '✅' : '🤔', title: good ? t.ok : t.no, lead: l.lead(A.Mt, A.sel.length, A.R, A.est), body: l.body(A.guess, A.N) };
    else st = { emo: '📏', title: l.s4b(A.est), lead: l.lead(A.Mt, A.sel.length, A.R, A.est), body: l.body2(A.N, Math.abs(A.est - A.N)) };
  }
  if (s === 4 && ph === 'idle') readout = [nf(A.est), `${A.Mt} × ${A.sel.length} ÷ ${A.R}`, `${t.trueLab}: ${nf(A.N)}`];
  else if (s >= 3 && ph === 'idle') readout = ['?', l.unk, `🥅 ${A.sel.length} · 🏷️ ${A.R}`];
  else readout = ['?', l.unk, A.Mt && s >= 1 ? `🏷️ ${A.Mt}` : ''];
  lab.setReadout(readout[0], readout[1], readout[2], '#4ea8ff');
  lab.setState({ ...st, body: st.body ?? '', extra: histHTML(A.hist, null, l.hist) });
}

function renderB(t) {
  const b = t.b, fl = B.flags, any = fl.tags || fl.mix || fl.young, ran = B.runs.length > 0;
  lab.setGlow('rgba(255, 160, 70, .22)'); lab.setFacts(t.facts.breaks);
  $('c2h').textContent = b.hdr;
  $('c2f').innerHTML = ['tags', 'mix', 'young'].map((k) => chip('flag', k, b.flags[k], fl[k])).join('');
  $('c2q').textContent = b.q;
  $('c2p').innerHTML = b.preds.map((p, i) => chip('pred', i, p, B.pred === i, ran)).join('');
  $('c2r').textContent = ran ? b.more : b.run; $('c2r').disabled = B.pred === null || B.running || B.runs.length >= 60;
  let st;
  if (B.running) { const [a, c] = b.running; st = { emo: '🎣', title: a, lead: c }; }
  else if (!ran) { const [a, c] = any ? b.sFlag : b.sNone; st = { emo: any ? '⚠️' : '🐟', title: a, lead: c }; }
  else {
    const med = median(B.runs.map((r) => r.v)), ratio = med / B.N0, act = ratio < 0.8 ? 'low' : ratio > 1.2 ? 'high' : 'ok', pi = ['low', 'ok', 'high'][B.pred];
    const why = any ? ['tags', 'mix', 'young'].filter((k) => fl[k]).map((k) => b.why[k]).join(' ') : b.why.none;
    st = { emo: pi === act ? '✅' : '🤔', title: pi === act ? t.ok : t.no, lead: b.lead(b.act[act], med, B.N0), body: why };
  }
  if (ran && B.done) lab.setReadout(nf(median(B.runs.map((r) => r.v))), b.sub(B.runs.length), `${t.trueLab}: ${nf(B.N0)}`, '#ffa046');
  else lab.setReadout('?', b.sub0, '', '#ffa046');
  lab.setState({ ...st, body: st.body ?? '', extra: '' });
}

function renderF(t) {
  const f = t.f, last = F.last, path = F.mode === 1;
  lab.setGlow('rgba(95, 170, 90, .26)'); lab.setFacts(t.facts.forest);
  $('c3m').innerHTML = f.modes.map((m, i) => `<button data-mode="${i}" class="${F.mode === i ? 'on' : ''}"${F.counting ? ' disabled' : ''}>${esc(m)}</button>`).join('');
  const needPred = path && !F.rev;
  $('c3pw').hidden = !needPred; $('c3q').textContent = f.q;
  $('c3p').innerHTML = f.preds.map((p, i) => chip('pred', i, p, F.pred === i, F.counting)).join('');
  $('c3b').textContent = path ? f.path : f.rand; $('c3b').disabled = F.counting || (needPred && F.pred === null);
  $('c3r').textContent = f.reveal; $('c3r').hidden = F.rev; $('c3r').disabled = F.counting;
  $('c3n').textContent = f.fresh; $('c3n').disabled = F.counting;
  let st, ro;
  if (F.counting) { const [a, c] = f.counting; st = { emo: '🔢', title: a, lead: c }; ro = ['?', f.sub0, '']; }
  else if (!last) { const [a, c] = f.s0; st = { emo: '🌲', title: a, lead: c }; ro = ['?', f.sub0, F.rev ? `${t.trueLab}: ${nf(F.total)}` : '']; }
  else {
    ro = [nf(last.est), f.sub(last.sum), F.rev ? `${t.trueLab}: ${nf(F.total)}` : ''];
    if (last.mode === 1) {
      const has = last.pred !== null, pi = ['low', 'ok', 'high'][last.pred];
      st = { emo: !has ? '🧮' : pi === last.act ? '✅' : '🤔', title: !has ? f.est(last.est) : pi === last.act ? t.ok : t.no, lead: f.leadP(f.act[last.act], last.sum, last.est, F.total), body: f.whyP[F.type] };
    }
    else st = { emo: '🧮', title: f.est(last.est), lead: f.lead(last.sum, last.est), body: F.rev ? f.bodyR(F.total, Math.abs(last.est - F.total)) : f.bodyN };
  }
  lab.setReadout(ro[0], ro[1], ro[2], '#6fbf6a');
  lab.setState({ ...st, body: st.body ?? '', extra: histHTML(F.hist, F.rev ? F.total : null, f.hist) });
}

function renderRuns(t) {
  const a = t.sa, d = runsData(X.runsC);
  lab.setGlow('rgba(61, 220, 151, .22)'); lab.setFacts(t.facts.lake);
  $('cAl').textContent = a.label(X.runsC); $('cAa').textContent = a.again; if (+$('tfA').value !== X.runsC) $('tfA').value = X.runsC;
  lab.setReadout(`${d.pct} %`, a.sub, a.pill(X.runsC), '#3ddc97');
  lab.setState({ emo: '🔁', title: a.title(d.pct), lead: a.lead(d.lo, d.hi), body: a.body(d.M, d.N), extra: d.pct >= 80 ? `<div class="tf-ok">✅ ${esc(a.done)}</div>` : '' });
}
function renderBook(t) {
  const s = t.sb, picked = X.bpick.length === 3;
  lab.setGlow('rgba(255, 200, 100, .2)'); lab.setFacts(t.facts.lake);
  $('cBo').textContent = s.open; $('cBa').textContent = s.all; $('cBa').hidden = X.brev || !picked;
  const total = X.book.reduce((x, y) => x + y, 0);
  if (!picked) { const [a, b] = s.s0; lab.setReadout('?', s.sub, '', '#ffc864'); lab.setState({ emo: '📖', title: a, lead: b, body: '', extra: '' }); return; }
  const [a, b, c] = X.bpick.map((i) => X.book[i]), est = Math.round(((a + b + c) / 3) * 96), [ti, le] = s.res(a, b, c, est);
  lab.setReadout(nf(est), s.calc(a, b, c), X.brev ? `${t.trueLab}: ${nf(total)}` : '', '#ffc864');
  lab.setState({ emo: '📖', title: ti, lead: le, body: X.brev ? s.rev(total, Math.abs(est - total)) : '', extra: '' });
}

render();

// --- the loop -----------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (ctx, w, h, dt, t) => {
  const v = lab.view;
  if (v === 'lake') {
    if (S.sec === 'runs') drawRuns(ctx, w, h);
    else if (S.sec === 'book') drawBook(ctx, w, h);
    else { updateA(dt, t); drawA(ctx, w, h, t); }
  } else if (v === 'breaks') { updateB(dt, t); drawB(ctx, w, h, t); }
  else { updateF(dt, t); drawF(ctx, w, h); }
});
</script>
