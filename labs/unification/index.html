function tollSim(e, nb, union) {

    const total = Math.max(2.4, 0.75 * (nb + 1)), u = easeInOut(e / total);
    return { u, stop: -1, p: 0, bolts: 100, days: 10 * u, moving: e > 0 && e < total, done: e >= total, open: nb, gp: 0 };
  }
  let tt = e;
  for (let i = 0; i <= nb; i++) {
    if (tt < L) { const u = lerp(i / (nb + 1), (i + 1) / (nb + 1), easeInOut(tt / L)); return { u, stop: -1, p: 0, bolts: 100 * Math.pow(0.9, i), days: 10 * u + 0.5 * i, moving: e > 0, done: false, open: i, gp: i }; }

    }

  }

}

  if (sim.moving) A.ph += dt * 10;
  if (sim.stop !== A.lastStop) { if (sim.stop >= 0) sfx.push(); A.lastStop = sim.stop; }
  if (sim.done && A.t0 !== null && !A.doneSnd) { A.doneSnd = true; sfx.good(); if (A.guess !== null && !A.revealed) { A.revealed = true; render(); } }
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#c9d49c'); bg.addColorStop(1, '#b3c58b');
  c.fillStyle = bg; c.fillRect(0, 0, w, h);

    c.fillStyle = lg; c.fillRect(8, ya, w - 16, yb - ya);

      const tx = 18 + rnd(i * 13 + j) * (w - 36), ty = ya + 8 + rnd(i * 13 + j, 2) * Math.max(4, yb - ya - 16), r = 4.5 + rnd(i * 13 + j, 3) * 3;

  }

  road(); c.strokeStyle = '#d3c096'; c.lineWidth = 32; c.stroke();
  road(); c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = 1.6; c.setLineDash([8, 8]); c.stroke(); c.setLineDash([]);

}

// --- the secrets -----------------------------------------------------------------------------------------------------
function drawSecB(c, w, h, dt, t) {
  const tt = T[lang];
  drawSea(c, w, h);
  const tr = fit(w, h, AH_BOX, 52, 40, 12), k = tr.k;
  const cyc = (t - S.bT0) % 9.5;
  const split = cyc < 1.4 ? 0 : cyc < 3.2 ? easeBack((cyc - 1.4) / 1.8) : cyc < 7 ? 1 : cyc < 8.6 ? 1 - easeInOut((cyc - 7) / 1.6) : 0;
  const sp = clamp(split, 0, 1.12), amt = 13;
  c.save(); c.translate(tr.ox, tr.oy); c.scale(k, k);
  drawContext(c, k);
  c.lineJoin = 'round';
  const off = {};
  for (const [id] of AH_SEEDS) {
    const cc = AH_COL[id + 'C'], dx = cc[0] - AH_C[0], dy = cc[1] - AH_C[1], d = Math.hypot(dx, dy) || 1;
    off[id] = [(dx / d) * sp * amt / k, (dy / d) * sp * amt / k];
  }
  const sc = c01(split);
  for (const cell of AH_SET.cells) {
    const id = AH_S[cell.si].st, col = mixc(AH_COL.empire, AH_COL[id], sc);
    c.save(); c.translate(off[id][0], off[id][1]);
    c.shadowColor = `rgba(4,14,26,${0.5 * sc})`; c.shadowBlur = 8 * sc; c.shadowOffsetX = 2 * sc; c.shadowOffsetY = 3 * sc;
    c.fillStyle = rgb(col); c.fill(cell.path);
    c.shadowColor = 'transparent';
    c.strokeStyle = rgb(col); c.lineWidth = 1.2 / k; c.stroke(cell.path);
    const lg = c.createLinearGradient(AH_SET.bx0, AH_SET.by0, AH_SET.bx1, AH_SET.by1);
    lg.addColorStop(0, 'rgba(255,255,255,.22)'); lg.addColorStop(0.5, 'rgba(255,255,255,0)'); lg.addColorStop(1, 'rgba(50,30,0,.22)');
    c.fillStyle = lg; c.fill(cell.path);
    c.beginPath();
    const p = cell.pts;
    for (let i = 0; i < p.length; i++) {
      const e = p[i].e, q = p[(i + 1) % p.length];
      if (e === null || AH_S[e].st !== id) { c.moveTo(p[i].x, p[i].y); c.lineTo(q.x, q.y); }
    }
    c.strokeStyle = 'rgba(40,30,15,.7)'; c.lineWidth = 1.3 / k; c.stroke();
    c.restore();

  c.restore();
  if (split < 0.35) pill(c, tt.succ.empire, ...tr.ll(17.6, 47.9), { a: 1 - split / 0.35, max: 160 });

}

function draw(c, w, h, dt, t) {
  CW = w; CH = h;
  const v = lab.view;
  if (v === 'germany') tickG(dt); else if (v === 'italy') tickI(dt);
  if (S.sec === 'b') drawSecB(c, w, h, dt, t);
  else if (S.sec === 'a') drawSea(c, w, h);
  else if (v === 'tolls') drawTolls(c, w, h, dt, t);
  else if (v === 'germany') drawGermany(c, w, h, dt, t);
  else drawItaly(c, w, h, dt, t);

// --- controls ------------------------------------------------------------------------------------------------------
const html = (el, s) => { if (el._h !== s) { el._h = s; el.innerHTML = s; } };
const show = (el, on) => { el.style.display = on ? 'block' : 'none'; };
// on a phone the controls sit below the canvas: bring the picture into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  const A = S.T, G = S.G, I = S.I;
  if (act === 'tguess') { A.guess = i; A.t0 = now(); A.doneSnd = false; (i === 0 ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  if (act === 'union') { A.union = !A.union; A.t0 = null; A.doneSnd = false; sfx.click(); }
  else if (act === 'drive') { A.t0 = now(); A.doneSnd = false; sfx.click(); showStage(); }
  else if (act === 'gguess') { G.guess = i; G.yf = 1865; G.to = 1871; G.dwell = 0; G.play = true; (i === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'gplay') { if (G.play) G.play = false; else { if (G.yf >= 1871) G.yf = 1815; G.to = 1871; G.dwell = 0; G.play = true; showStage(); } sfx.click(); }
  else if (act === 'iguess') { I.guess = i; I.yf = 1860; I.to = 1861; I.dwell = 0; I.play = true; (i === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'iplay') { if (I.play) I.play = false; else { if (I.yf >= 1871) I.yf = 1815; I.to = 1871; I.dwell = 0; I.play = true; showStage(); } sfx.click(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; S.bT0 = now(); sfx.click();
  }
  render();
});
panelEl.addEventListener('click', (ev) => { if (ev.target.closest('.un-x')) { S.sec = null; sfx.click(); render(); } });
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'unTr') { S.T.n = v; S.T.t0 = null; S.T.doneSnd = false; sfx.tick(); }
  else if (id === 'unGr') { S.G.yf = v; S.G.play = false; S.G.dwell = 0; if (S.G.guess !== null && v >= 1871) S.G.revealed = true; }
  else if (id === 'unIr') { S.I.yf = v; S.I.play = false; S.I.dwell = 0; if (S.I.guess !== null && v >= 1861) S.I.revealed = true; }
  else return;
  render();
});

// --- one render per change: controls, readout, the state card, facts --------------------------------------------------
const verdictHTML = (ok, t, why) => `<b style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.notQuite)}</b>${esc(why)}`;
const askHTML = (q, opts, order, act) => `<p class="un-q">${esc(q)}</p><div class="un-opts">${order.map((i) => `<button class="un-opt" data-act="${act}" data-i="${i}">${esc(opts[i])}</button>`).join('')}</div>`;
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v;
  show($('unT'), v === 'tolls'); show($('unG'), v === 'germany'); show($('unI'), v === 'italy');
  const open = secret.unlocked();
  html($('unSecRow'), ['a', 'b'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'a' ? '🇭🇺' : '🧩'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join(''));
  panelEl.style.display = sec === 'a' ? 'block' : 'none';
  if (sec === 'a') {
    const p = t.panelA;
    html(panelEl, `<button class="un-x" aria-label="×">✕</button><h3>🇭🇺 ${esc(t.secrets.a[0])}</h3><div class="sub">${esc(p.sub)}</div>
      <h4>${esc(p.demandsHead)}</h4><ol>${p.demands.map((d) => `<li>${esc(d)}</li>`).join('')}</ol>
      <h4>${esc(p.songHead)}</h4><div class="song">${esc(p.song)}${p.songEn ? `<i>${esc(p.songEn)}</i>` : ''}</div>
      <p>${esc(p.war)}</p><p>${esc(p.idea)}</p><div class="src">${esc(p.src)}</div>`);
  }
  if (v === 'tolls') renderTolls(t); else if (v === 'germany') renderGermany(t); else renderItaly(t);
  if (sec) {
    lab.setGlow(sec === 'a' ? 'rgba(205, 42, 62, .28)' : 'rgba(207, 162, 77, .28)');
    lab.setReadout(sec === 'a' ? '1848' : '1918', t.secrets[sec][0], '', sec === 'a' ? '#cd2a3e' : '#cfa24d');
    lab.setState({ emo: sec === 'a' ? '🇭🇺' : '🧩', title: t.secrets[sec][0], lead: t.secrets[sec][1], body: '', extra: '' });
    lab.setFacts([]);
  }
}
function renderTolls(t) {
  const A = S.T, g = A.guess, eff = A.union ? 0 : A.n, left = Math.round(100 * Math.pow(0.9, eff)), d = Math.round(10 + 0.5 * eff);
  show($('unTlive'), g !== null);
  html($('unTask'), g === null ? askHTML(t.qTolls, t.optsTolls, ORD.tolls, 'tguess') : '');
  $('unTlbl').textContent = `${t.borders}:`; $('unTn').textContent = String(A.n);
  if (+$('unTr').value !== A.n) $('unTr').value = A.n;
  $('unTu').textContent = t.union; $('unTu').classList.toggle('on', A.union);
  $('unTgo').textContent = `▶ ${t.drive}`;
  $('unTnote').textContent = eff > 0 ? t.mustSell(fmt1(1 / Math.pow(0.9, eff))) : '';
  html($('unTv'), A.revealed ? verdictHTML(g === 0, t, t.tollsWhy) : '');
  lab.setGlow('rgba(217, 74, 58, .26)');
  if (!A.revealed) lab.setReadout('?', '', '', '#d94a3a'); else lab.setReadout(`${left} %`, t.valueLeft, t.days(d), '#d94a3a');
  if (!S.sec) { lab.setState({ ...t.state.tolls, extra: '' }); lab.setFacts(t.facts.tolls); }
}
function renderGermany(t) {
  const G = S.G, g = G.guess, y = yi(G.yf);
  show($('unGlive'), g !== null);
  html($('unGask'), g === null ? askHTML(t.qGermany, t.optsGermany, ORD.germany, 'gguess') : '');
  $('unGlbl').textContent = `${t.year}:`; $('unGn').textContent = String(y);
  if (+$('unGr').value !== y) $('unGr').value = y;
  $('unGplay').textContent = G.play ? '⏸' : `▶ ${t.play}`;
  html($('unGv'), G.revealed ? verdictHTML(g === 0, t, t.germanyWhy) : '');
  lab.setGlow('rgba(212, 167, 44, .26)');
  lab.setReadout('39 → 1', t.statesLine, g === null ? '' : String(y), GOLD);
  if (!S.sec) {
    lab.setState({ ...t.state.germany, ...(g === null ? t.pre.germany : {}), extra: '' });
    lab.setFacts(t.facts.germany);
  }
}
function renderItaly(t) {
  const I = S.I, g = I.guess, y = yi(I.yf);
  show($('unIlive'), g !== null);
  html($('unIask'), g === null ? askHTML(t.qItaly, t.optsItaly, ORD.italy, 'iguess') : '');
  $('unIlbl').textContent = `${t.year}:`; $('unIn').textContent = String(y);
  if (+$('unIr').value !== y) $('unIr').value = y;
  $('unIplay').textContent = I.play ? '⏸' : `▶ ${t.play}`;
  html($('unIv'), I.revealed ? verdictHTML(g === 0, t, t.italyWhy) : '');
  lab.setGlow('rgba(63, 154, 79, .28)');
  lab.setReadout('1861', t.kingdomItaly, g === null ? '' : String(y), '#3f9a4f');
  if (!S.sec) {
    lab.setState({ ...t.state.italy, ...(g === null ? t.pre.italy : {}), extra: '' });
    lab.setFacts(g === null ? [] : t.facts.italy);
  }
}

render();
canvasLoop($('cv'), draw);
</script>
