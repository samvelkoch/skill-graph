// blue = 0, red = 1. copy: follow the majority of earlier CHOICES when it leads by 2 or more, otherwise own tip.
// talk: count all spoken tips so far (and your own); the majority wins, a tie goes to your own tip.
function choose(tips, mode, o = {}) {
  const ch = [];
  for (let i = 0; i < 12; i++) {
    let c;
    if (o.force && o.force[i] != null) c = o.force[i];
    else if (mode === 'copy' || (o.talkFrom != null && i < o.talkFrom)) {
      let bl = 0; for (let j = 0; j < i; j++) if (ch[j] === 0) bl++;
      const d = (i - bl) - bl;
      c = d >= 2 ? 1 : d <= -2 ? 0 : tips[i];
    } else {
      let bl = 0, rd = 0;
      for (let j = 0; j <= i; j++) { const v = o.talkFrom != null && j < o.talkFrom ? ch[j] : tips[j]; if (v === 0) bl++; else rd++; }
      c = bl > rd ? 0 : rd > bl ? 1 : tips[i];
    }
    ch.push(c);
  }
  return ch;
}
function sampleTurn(seed, p) { // a street where visitors 1 and 2 had Red tips and you have a Blue tip
  const r = rng(seed * 977 + 5);
  for (let k = 0; k < 800; k++) {
    const better = r() < 0.5 ? 0 : 1, tips = [];
    for (let i = 0; i < 12; i++) tips.push(r() < p ? better : 1 - better);
    if (tips[0] === 1 && tips[1] === 1 && tips[4] === 0) return { better, tips };
  }
  return { better: 0, tips: [1, 1, 1, 0, 0, 0, 1, 0, 0, 1, 0, 0] };
}
function sampleRig(seed, p) {
  const r = rng(seed * 313 + 9), tips = [1, 1, 0];
  for (let i = 3; i < 12; i++) tips.push(r() < p ? 0 : 1);
  return { better: 0, tips };
}
function simStreets(seed, p) {
  const r = rng(seed * 7919 + 1), better = new Uint8Array(100), copy = new Uint8Array(1200), talk = new Uint8Array(1200);
  let rc = 0, rt = 0;
  const score = (ch, b) => { const n = ch.filter((x) => x === b).length; return n > 6 ? 1 : n === 6 ? 0.5 : 0; };
  for (let s = 0; s < 100; s++) {
    const b = r() < 0.5 ? 0 : 1, tips = [];
    for (let i = 0; i < 12; i++) tips.push(r() < p ? b : 1 - b);
    const c1 = choose(tips, 'copy'), c2 = choose(tips, 'talk');
    better[s] = b; c1.forEach((x, i) => { copy[s * 12 + i] = x; }); c2.forEach((x, i) => { talk[s * 12 + i] = x; });
    rc += score(c1, b); rt += score(c2, b);
  }
  return { better, copy, talk, rc: Math.round(rc), rt: Math.round(rt) };
}

}

  let body = '';
  if (EM.step === 0) body = `<div class="cq-q">${esc(e.q1)}</div><div class="cq-doors"><button class="cq-door b" data-act="em" data-v="0">${esc(n[0])}</button><button class="cq-door r" data-act="em" data-v="1">${esc(n[1])}</button></div>`;
  else if (EM.step === 1) body = `<div class="cq-q">${esc(e.rev)}</div>${e.reviews.map((x) => `<div class="cq-rev">📋 ${esc(x)}</div>`).join('')}<div class="cq-doors"><button class="cq-door b" data-act="em" data-v="0">${esc(n[0])}</button><button class="cq-door r" data-act="em" data-v="1">${esc(n[1])}</button></div>`;
  else body = `<div class="cq-rev"><b>${esc(e.changed.length && EM.pick1 !== EM.pick2 ? e.changed : e.kept)}</b> ${esc(n[EM.pick1])} → ${esc(n[EM.pick2])}</div><div class="row2" style="margin-top:0"><button class="btn" data-act="emagain">${esc(e.again)}</button></div>`;
  $('cqSec').innerHTML = body + `<div class="row2"><button class="chip" data-act="back">${esc(e.back)}</button></div>`;
  lab.setReadout(EM.step === 2 ? '✓' : '?', e.val, '', '#f5c84c');
  lab.setState(EM.step === 2 ? { emo: '🏚️', title: EM.pick1 !== EM.pick2 ? e.changed : e.kept, lead: e.lesson, body: '', extra: '' } : { emo: '🏚️', title: e.title, lead: EM.step === 0 ? e.q1 : e.rev, body: '', extra: '' });
}
render();
</script>
</body>
</html>
