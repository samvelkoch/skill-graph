const COS = 0.866;

function drawGraph(c, r, sp) {
  c.save();
  c.beginPath(); c.roundRect(r.x, r.y, r.w, r.h, 16); c.fillStyle = 'rgba(14,17,28,.8)'; c.fill();
  c.lineWidth = 1; c.strokeStyle = 'rgba(130,145,190,.28)'; c.stroke();
  const L = r.x + 42, Rr = r.x + r.w - 16, Tp = r.y + (sp.legend ? 36 : 18), B = r.y + r.h - 26;
  const X = (v) => L + (v / sp.xmax) * (Rr - L), Y = (v) => B - (v / sp.ymax) * (B - Tp);
  c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.beginPath();
  for (const v of sp.xt) { c.moveTo(X(v), Tp); c.lineTo(X(v), B); }
  for (const v of sp.yt) { c.moveTo(L, Y(v)); c.lineTo(Rr, Y(v)); }
  c.lineWidth = 1; c.strokeStyle = 'rgba(130,145,190,.16)'; c.stroke();
  for (const v of sp.xt) c.fillText(String(v), X(v), B + 14);
  c.textAlign = 'right'; for (const v of sp.yt) c.fillText(String(v), L - 6, Y(v));
  c.beginPath(); c.moveTo(L, Tp - 4); c.lineTo(L, B); c.lineTo(Rr + 4, B); c.lineWidth = 1.5; c.strokeStyle = 'rgba(190,200,235,.55)'; c.stroke();
  if (sp.legend) {
    let lx = L; c.textAlign = 'left';
    for (const it of sp.legend) {
      c.fillStyle = it.col; c.beginPath(); c.arc(lx + 5, r.y + 17, 5, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#D3D9E8'; c.font = '800 12.5px Nunito, sans-serif'; c.fillText(it.label, lx + 14, r.y + 17.5);
      lx += 14 + c.measureText(it.label).width + 12;
    }
  }
  for (const cv of sp.curves) {
    const top = Math.max(0, Math.min(cv.upTo ?? sp.xmax, sp.xmax)), step = sp.xmax / 90;
    const yOf = (x) => Math.min(sp.ymax * 1.02, cv.f(x));
    c.beginPath(); c.moveTo(X(0), Y(yOf(0)));
    for (let x = step; x < top; x += step) c.lineTo(X(x), Y(yOf(x)));
    c.lineTo(X(top), Y(yOf(top)));
    if (cv.fill) {
      c.save(); c.lineTo(X(top), B); c.lineTo(X(0), B); c.closePath(); c.fillStyle = cv.fill; c.fill(); c.restore();
      c.beginPath(); c.moveTo(X(0), Y(yOf(0))); for (let x = step; x < top; x += step) c.lineTo(X(x), Y(yOf(x))); c.lineTo(X(top), Y(yOf(top)));

    c.lineWidth = 7; c.globalAlpha = 0.16; c.strokeStyle = cv.col; c.stroke();
    c.globalAlpha = 1; c.lineWidth = 3; c.stroke();
  }
  if (sp.hl) { // whole-number steps on the curve

canvasLoop($('cv'), (c, w, h, dt) => {

const chip = (act, label, extra = '') => `<button class="chip sq-t" data-act="${act}" ${extra}>${esc(label)}</button>`;
const btn = (act, label, dis) => `<button class="btn sq-b" data-act="${act}"${dis ? ' disabled' : ''}>${esc(label)}</button>`;
const GLOW = { square: 'rgba(63,143,224,.3)', stairs: 'rgba(53,201,166,.26)', cube: 'rgba(232,150,58,.26)', root: 'rgba(246,201,69,.2)', fold: 'rgba(246,201,69,.2)' };
const COL = { square: '#3f8fe0', stairs: '#35c9a6', cube: '#e8963a', root: '#d8a23c', fold: '#e8963a' };
const TRACK = { square: 'linear-gradient(90deg,#2d6fb8,#69b4ff)', stairs: 'linear-gradient(90deg,#3f8fe0,#35c9a6)', cube: 'linear-gradient(90deg,#b8661c,#ffae45)', root: 'linear-gradient(90deg,#3f8fe0,#f6c945)' };

function render() {
  const t = T[lang], v = lab.view, mode = modeNow();
  document.body.dataset.v = mode;
  lab.setGlow(GLOW[mode]);
  const q = mode === 'square' ? S.q1 : mode === 'cube' ? S.q2 : mode === 'root' ? S.q3 : 0;
  // slider
  const cfg = mode === 'square' ? { l: t.lblSide, mn: 1, mx: 12, v: S.n1 } : mode === 'cube' ? { l: t.lblSide, mn: 1, mx: 10, v: S.n2 }
    : mode === 'root' ? { l: S.rm === 'sq' ? t.lblTiles : t.lblBlocks, mn: 1, mx: 150, v: S.N } : mode === 'stairs' ? { l: t.lblSteps, mn: 1, mx: 10, v: S.st } : null;
  show('slBox', !!cfg && q === 0);
  if (cfg) {
    const sl = $('sl'); sl.min = cfg.mn; sl.max = cfg.mx; if (+sl.value !== cfg.v) sl.value = cfg.v;
    sl.style.setProperty('--track', TRACK[mode]); sl.setAttribute('aria-label', cfg.l);
    $('slL').textContent = cfg.l; $('slA').textContent = cfg.mn; $('slB').textContent = cfg.mx;
  }
  show('q1Box', mode === 'square' && q === 1); show('optBox', (mode === 'cube' || mode === 'root') && q === 1);
  // prediction widgets
  $('q1Q').textContent = t.sqQ; $('gi').setAttribute('aria-label', t.sqQ);
  const gi = $('gi'), gv = S.q1g === null ? '' : String(S.q1g); if (gi.value !== gv) gi.value = gv;
  if (mode === 'cube') {
    $('optQ').textContent = t.cuQ;
    $('optBtns').innerHTML = [16, 32, 64].map((k) => `<button class="sq-opt" data-act="opt" data-v="${k}">${k}</button>`).join('');
  } else if (mode === 'root') {
    $('optQ').textContent = t.rtQ;
    $('optBtns').innerHTML = [[8, 9], [45, 46], [9, 10]].map(([a, b]) => `<button class="sq-opt" data-act="opt" data-v="${a}">${esc(t.and(a, b))}</button>`).join('');
  }
  // action row
  let acts = '';
  if (mode === 'square') acts = q === 0 ? chip('pred', `🎯 ${t.predict}`) : q === 1 ? btn('check', t.check, S.q1g === null) : btn('done', t.done);
  else if (mode === 'cube') acts = q === 0 ? chip('again', `↻ ${t.again}`) + chip('pred', `🎯 ${t.predict}`) : q === 2 ? btn('done', t.done) : '';
  else if (mode === 'root') {
    acts = q === 0 ? `<div class="card seg small sq-seg">${[['sq', t.rmSq], ['cu', t.rmCu]].map(([k, l]) => `<button data-act="rm" data-m="${k}" class="${S.rm === k ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>` + chip('pred', `🎯 ${t.predict}`)
      : q === 2 ? btn('done', t.done) : '';
  } else if (mode === 'fold') acts = btn('fold', `${t.foldBtn}`, S.folds >= 42) + chip('flat', t.flatBtn);
  $('acts').innerHTML = acts; show('acts', !!acts);
  $('jumps').innerHTML = mode === 'fold' ? [7, 23, 30, 42].map((k) => chip('jump', t.foldsN(k), `data-k="${k}"`)).join('') : ''; show('jumps', mode === 'fold');
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret sq-t ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('fold', '📄') + sc('stairs', '🪜');
  // content
  if (mode === 'square') renderSquare(t); else if (mode === 'cube') renderCube(t); else if (mode === 'root') renderRoot(t);
  else if (mode === 'fold') renderFold(t); else renderStairs(t);
  void v;
}
const facts = (keys) => { const t = T[lang]; lab.setFacts(keys.map((k) => ({ emo: FACT_EMO[k], text: t.facts[k], src: t.src[k] }))); };
const fine = (t) => `<div class="sq-fine">${esc(t.fine)}</div>`;

function renderSquare(t) {
  facts(['names']);
  const col = COL.square;
  if (S.q1 === 1) {
    lab.setReadout('5² = 25', '5 × 5', '', col);
    lab.setState({ emo: '🎯', title: t.sqQ, lead: t.sqAsk, body: '', extra: '' });
  } else if (S.q1 === 2) {
    const ok = S.q1g === 11;
    lab.setReadout('6² = 36', '25 + 11', '', col);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: t.sqWhy, body: ok ? '' : t.guess(S.q1g), extra: '' });
  } else {
    const n = S.n1;
    lab.setReadout(`${n}² = ${n * n}`, `${n} × ${n}`, '', col);
    lab.setState({ emo: '🟦', title: t.sqTitle, lead: t.sqLead(n), body: t.sqBody(n), extra: t.sqDbl(n) ? esc(t.sqDbl(n)) : '' });
  }
}
function renderCube(t) {
  facts(['dbl', 'kib']);
  const col = COL.cube;
  if (S.q2 === 1) {
    lab.setReadout('2³ = 8', '2 × 2 × 2', '', col);
    lab.setState({ emo: '🎯', title: t.cuQ, lead: t.cuAsk, body: '', extra: '' });
  } else if (S.q2 === 2) {
    const ok = S.q2g === 64;
    lab.setReadout('4³ = 64', '4 × 4 × 4', t.cuSub(4), col);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: t.cuWhy, body: ok ? t.cuSteep : `${t.guess(S.q2g)}. ${t.cuSteep}`, extra: '' });
  } else {
    const n = S.n2;
    lab.setReadout(`${n}³ = ${n ** 3}`, `${n} × ${n} × ${n}`, t.cuSub(n), col);
    lab.setState({ emo: '🧊', title: t.cuTitle, lead: t.cuLead(n), body: n === 10 ? t.cuSteepA : `${t.cuBody(n)} ${t.cuSteep}`, extra: esc(t.cuTank(n, fmt(n ** 3 * 1000))) });
  }
}
function renderRoot(t) {
  facts(['bab']);
  const isq = S.rm === 'sq', col = COL.root, sym = isq ? '√' : '∛';
  if (S.q3 === 1) {
    lab.setReadout('√90 = ?', '', '', col);
    lab.setState({ emo: '🎯', title: t.rtQ, lead: t.rtAsk, body: '', extra: '' });
    return;
  }
  const N = S.q3 ? 90 : S.N, k = isq ? isqrt(N) : icbrt(N), perf = (isq ? k * k : k ** 3) === N, root = isq ? Math.sqrt(N) : Math.cbrt(N);
  const a2 = Number(root.toFixed(2)), pw = isq ? a2 * a2 : a2 * a2 * a2;
  const val = perf ? `${sym}${N} = ${k}` : `${k} &lt; ${sym}${N} &lt; ${k + 1}`;
  const sub = perf ? (isq ? `${k} × ${k} = ${N}` : `${k} × ${k} × ${k} = ${N}`) : `${sym}${N} ≈ ${dec(root, 2)}`;
  lab.setReadout(val, sub, perf ? (isq ? t.rtPerfS : t.rtPerfC) : t.rtNot, col);
  const left = N - (isq ? k * k : k ** 3);
  const lead = perf ? (isq ? t.rtLeadPS(k, N) : t.rtLeadPC(k, N)) : (isq ? t.rtLeadS(k, N, left) : t.rtLeadC(k, N, left));
  const body = perf ? '' : t.rtExact(`${sym}${N}`, dec(root, 2), trim4(pw));
  if (S.q3 === 2) {
    const ok = S.q3g === 9;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: t.rtWhy, body: ok ? body : `${t.guess(t.and(S.q3g, S.q3g + 1))}. ${body}`, extra: '' });
  } else lab.setState({ emo: isq ? '🟦' : '🧊', title: isq ? t.rtTitleS : t.rtTitleC, lead, body, extra: '' });
}
function renderStairs(t) {
  facts(['names']);
  const n = S.st;
  const list = n <= 5 ? Array.from({ length: n }, (_, i) => 2 * i + 1).join(' + ') : `1 + 3 + 5 + … + ${2 * n - 1}`;
  lab.setReadout(n === 1 ? '1 = 1' : `${list} = ${n * n}`, `${n}² = ${n} × ${n}`, '', COL.stairs);
  lab.setState({ emo: '🪜', title: t.stTitle, lead: t.stLead(n), body: t.stBody, extra: '' });
}
function renderFold(t) {
  facts(['kib']);
  const k = S.folds, mm = 0.1 * Math.pow(2, k);
  lab.setReadout(thick(mm), `${t.foldsN(k)} · 2${sup(k)} = ${fmt(Math.pow(2, k))}`, '', COL.fold);
  const note = k >= 42 ? t.foldMoon : k >= 30 ? t.foldSpace : '';
  lab.setState({ emo: '📄', title: thick(mm), lead: k === 0 ? t.foldLead0 : t.foldLead(k), body: note, extra: '' });
}
render();
</script>
</body>
