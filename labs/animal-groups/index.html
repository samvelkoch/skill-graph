<style>
  /* no gauge in this lab: give its column back to the stage */
  #gauge { display: none; }
  @media (min-width: 1101px) {
    .lab { grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); grid-template-areas: 'hero stage' 'state stage' 'state ctrl'; }
  }
  @media (min-width: 761px) { #stage { min-height: 580px; } }

  /* everything on top of the canvas lives in one column: banner, (tree) pane, (question) tray */
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; padding: 6px; }
  #overlay > .wrap { pointer-events: none; }
  .wrap > * { pointer-events: auto; }
  .ask { align-self: center; width: min(600px, 100%); padding: 10px 14px; text-align: center; flex: none; display: flex; flex-direction: column; justify-content: center; }
  /* fixed banner heights keep the scene below from jumping between steps */
  body[data-v=key] .ask { min-height: 150px; }
  body[data-v=key][data-s=hunt] .ask { min-height: 104px; }
  body[data-v=insects] .ask { min-height: 128px; }
  body[data-v=make] .ask { min-height: 52px; }
  .ask .who { font: 800 15px/1.2 var(--sans); color: #fff; margin-bottom: 4px; }
  .ask .who .e { font-size: 20px; margin-right: 4px; }
  .ask .q { font: 500 21px/1.2 var(--serif); color: #fff; margin: 0 0 8px; text-wrap: balance; }
  .ask p { margin: 0 0 8px; color: var(--soft); font-size: 13px; line-height: 1.45; }
  .ask p:last-child { margin-bottom: 0; }
  .ask .verdict { font-weight: 900; font-size: 14px; margin-bottom: 3px; }
  .ask .verdict.ok { color: var(--ok); } .ask .verdict.bad { color: var(--wip); }
  .ask .yes { color: var(--ok); font-weight: 900; } .ask .no { color: #ff8a80; font-weight: 900; }
  .ask .opts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .ask button { padding: 8px 18px; min-height: 38px; border-radius: 999px; border: 1px solid var(--stroke2); background: rgba(130, 145, 190, .1); font-weight: 800; cursor: pointer; }
  .ask button:hover:not(:disabled) { background: rgba(130, 145, 190, .25); }
  .ask button.go { background: #fff; color: var(--bg); border-color: #fff; }
  .ask button:disabled { opacity: .35; cursor: default; }
  .fine { font-size: 11px; color: var(--faint); }

  /* make-a-key view */
  #pane { display: none; flex: 1; min-height: 0; position: relative; overflow: auto; }
  #pane.on { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 2px 0 6px; }
  #tray { display: none; flex: none; flex-wrap: wrap; gap: 6px; justify-content: center; }
  #tray.on { display: flex; }
  #tray .chip { min-height: 36px; padding: 6px 12px; }
  #tray .chip:disabled { opacity: .35; cursor: default; }
  #tray .chip.badq { border-style: dashed; }
  .tn { display: flex; flex-direction: column; align-items: center; }
  .bx { display: flex; gap: 2px; align-items: flex-start; justify-content: center; min-width: 48px; min-height: 52px; padding: 4px 4px; margin: 0;
    border-radius: 14px; border: 2px solid var(--stroke2); background: rgba(20, 24, 38, .7); cursor: default; }
  .bx.act { border-color: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .15); cursor: pointer; }
  .bx.split { opacity: .85; }
  .bx.one { border-color: var(--ok); background: rgba(61, 220, 151, .1); }
  .bx.ok { box-shadow: 0 0 18px rgba(61, 220, 151, .55); }
  .bx.multi { cursor: pointer; }
  .it { display: flex; flex-direction: column; align-items: center; width: 62px; }
  .it .em { font-style: normal; font-size: 24px; line-height: 28px; height: 28px; display: flex; align-items: center; }
  .it small { font-size: 11px; font-weight: 700; line-height: 1.1; text-align: center; color: var(--soft); overflow-wrap: anywhere; }
  .bx .empty { color: var(--faint); align-self: center; padding: 0 12px; }
  .moss { display: block; width: 26px; height: 22px; border-radius: 50% 50% 40% 40%; background:
    radial-gradient(circle at 28% 38%, #9be07c 0 20%, transparent 21%), radial-gradient(circle at 66% 30%, #78c46a 0 22%, transparent 23%),
    radial-gradient(circle at 50% 72%, #86d070 0 30%, transparent 31%), #4f8f4f; }
  .qlab { margin-top: 4px; padding: 1px 10px; max-width: 250px; text-align: center; font-size: 12px; font-weight: 800; color: #fff; background: rgba(78, 168, 255, .22);
    border: 1px solid rgba(78, 168, 255, .5); border-radius: 12px; line-height: 1.25; }
  .kids { display: flex; justify-content: center; position: relative; padding-top: 14px; }
  .kids::before { content: ''; position: absolute; top: 0; left: 50%; height: 14px; border-left: 2px solid var(--stroke2); }
  .kd { position: relative; padding: 14px 3px 0; display: flex; flex-direction: column; align-items: center; }
  .kd::before, .kd::after { content: ''; position: absolute; top: 0; right: 50%; width: 50%; height: 14px; border-top: 2px solid var(--stroke2); }
  .kd::after { right: auto; left: 50%; border-left: 2px solid var(--stroke2); }
  .kd:first-child::before, .kd:last-child::after { border: 0 none; }
  .kd:last-child::before { border-right: 2px solid var(--stroke2); border-radius: 0 6px 0 0; }
  .kd:first-child::after { border-radius: 6px 0 0 0; }
  .kd:only-child::before { display: none; }
  .edge { position: absolute; top: 0; left: calc(50% + 5px); font-size: 11.5px; line-height: 14px; font-weight: 900; }
  .edge.y { color: var(--ok); } .edge.n { color: #ff8a80; }
  .pop { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); width: min(320px, 94%); padding: 14px 14px 12px; text-align: center; z-index: 3;
    background: rgba(16, 19, 30, .97); border-color: var(--wip); cursor: pointer; }
  .pop .pq { font: 500 21px/1.2 var(--serif); color: #fff; margin-bottom: 8px; }
  .pop p { margin: 8px 0 0; font-size: 12.5px; color: var(--soft); line-height: 1.4; }
  .kids2 { display: flex; justify-content: center; gap: 22px; }
  .kid { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .kid .av { font-size: 38px; line-height: 1.1; }
  .kid .bub { padding: 3px 12px; border-radius: 12px; font-weight: 900; font-size: 13px; color: #fff; position: relative; animation: pop .35s; }
  .kid .bub.y { background: #2b9e6d; } .kid .bub.n { background: #d6453d; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  @media (max-width: 760px) {
    body[data-v=key] #stage { height: min(158vw, 660px); }

    .ask .q { font-size: 18px; } .ask { padding: 8px 12px; } .ask button { padding: 7px 16px; font-size: 13px; }
  }

  c.fillStyle = 'rgba(110,180,100,.16)';
  for (let i = 0; i < 12; i++) { c.beginPath(); c.ellipse((i * 83 % 100) / 100 * w, y0 + (i * 47 % 100) / 100 * (h - y0), 38, 14, i * .7, 0, 7); c.fill(); }
  const pos = (b) => ({ x: fx0 + b.fx * fw, y: fy0 + b.fy * fh });
  for (const b of H.bugs) { const p = pos(b); if (Math.hypot(p.x - tx, p.y - ty) < R - 6) b.seen = true; }
  const nSeen = H.bugs.filter((b) => b.seen).length; if (nSeen !== H.n) { H.n = nSeen; render(); }
  const dark = c.createRadialGradient(tx, ty, 0, tx, ty, R); dark.addColorStop(0, 'rgba(3,6,12,0)'); dark.addColorStop(.7, 'rgba(3,6,12,0)'); dark.addColorStop(1, 'rgba(3,6,12,.93)');
  c.fillStyle = dark; c.fillRect(0, 0, w, h);
  c.save(); c.beginPath(); c.arc(tx, ty, R * .96, 0, 7); c.clip();
  for (const b of H.bugs) { if (b.sorted) continue; const p = pos(b); drawBug(c, b.k, p.x, p.y, S, {}); }
  c.restore();
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  H.bugs.forEach((b, i) => {
    const p = pos(b), lit = Math.hypot(p.x - tx, p.y - ty) < R - 6;
    if (b.sorted) {
      drawBug(c, b.k, p.x, p.y, S, {});
      c.lineWidth = 3; c.strokeStyle = b.sorted.ok ? '#3ddc97' : '#ff6b60'; rr(c, p.x - S * 1.6, p.y - S * 1.2, S * 3.2, S * 2.4, 12); c.stroke();
      c.font = '800 12px Nunito, sans-serif'; c.fillStyle = '#fff'; c.fillText(HF[b.k].ins ? t.sec.insect : t.sec.notInsect, p.x, p.y + S * 1.2 + 14);
    } else if (lit && H.sel === i) { c.lineWidth = 2.5; c.strokeStyle = '#fff'; c.setLineDash([6, 5]); rr(c, p.x - S * 1.6, p.y - S * 1.2, S * 3.2, S * 2.4, 12); c.stroke(); c.setLineDash([]); }
  });
  c.lineWidth = 2; c.strokeStyle = 'rgba(255,225,150,.55)'; c.beginPath(); c.arc(tx, ty, R * .96, 0, 7); c.stroke();
  if (!H.moved) { c.font = '800 13px Nunito, sans-serif'; c.fillStyle = '#ffe9a8'; c.fillText(t.sec.torch, tx, ty + R + 18); }
}

// =================================================================================================================
// the one canvas loop, and its pointer
// =================================================================================================================
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const y0 = (askEl.offsetHeight || 80) + 14, v = lab.view;
  if (v === 'key') (S.sec === 'hunt' ? drawHunt : drawKey)(c, w, h, dt, time, y0);
  else if (v === 'insects') drawInsects(c, w, h, dt, time, y0);
  else drawMake(c, w, h, dt);
});
const cvPoint = (ev) => { const r = $('cv').getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
$('cv').addEventListener('pointerdown', (ev) => {
  const p = cvPoint(ev), v = lab.view;
  if (v === 'key' && S.sec === 'hunt') {
    if (!HL) return;
    const hit = H.bugs.findIndex((b) => !b.sorted && Math.hypot(HL.fx0 + b.fx * HL.fw - p.x, HL.fy0 + b.fy * HL.fh - p.y) < HL.S * 1.7 && Math.hypot(HL.fx0 + b.fx * HL.fw - HL.tx, HL.fy0 + b.fy * HL.fh - HL.ty) < HL.R - 6);
    if (hit >= 0) { H.sel = hit; sfx.click(); render(); return; }
    H.sel = null; H.drag = true; H.moved = true; $('cv').setPointerCapture?.(ev.pointerId); moveTorch(ev); render();
  } else if (v === 'key') {
    const K = curK();
    if (K.phase === 'fall') { K.fast = true; return; }
    if (K.phase !== 'guess' || !KL) return;
    const j = GROUPS.findIndex((_, i) => p.x >= KL.binX - 4 && p.x <= KL.binX + KL.binW + 4 && Math.abs(p.y - KL.yc(i)) < Math.min(26, KL.rowH / 2 - 1));
    if (j >= 0) startFall(K, GROUPS[j]);
  } else if (v === 'insects') {
    if (S.ip === 'A') {
      if (IA.sq) { IA.sq.t = 1e3; return; }
      if (IA.checked || !IAL.R) return;
      const i = IAL.R.findIndex((r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h);
      if (i >= 0) { const k = MINI[i]; if (IA.sel.has(k)) IA.sel.delete(k); else IA.sel.add(k); sfx.tick(); render(); }
    } else if (!IB.pick) {
      const u = (p.x - IBL.cx) / IBL.S, vy = (p.y - IBL.cy) / IBL.S;
      if (Math.abs(vy) > .6 || u < -1.3 || u > 1.5) return;
      pickB(u < -.62 ? 'head' : u < .05 ? 'thorax' : 'abdomen'); render();
    }
  }
});
function moveTorch(ev) {
  if (!HL) return;
  const p = cvPoint(ev), off = ev.pointerType === 'touch' ? 52 : 0;
  H.tx = clamp((p.x - HL.fx0) / HL.fw, 0, 1); H.ty = clamp((p.y - off - HL.fy0) / HL.fh, 0, 1);
}
$('cv').addEventListener('pointermove', (ev) => { if (H?.drag && S.sec === 'hunt' && lab.view === 'key') moveTorch(ev); });
const endDrag = () => { if (H) H.drag = false; };
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag);

// --- clicks on the banner, the chips and the tree --------------------------------------------------------------------
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const a = b.dataset.act, K = curK();
  if (a === 'next') { K.i++; K.guess = null; K.phase = K.i >= K.deck.length ? 'end' : 'guess'; K.ok = null; sfx.click(); }
  else if (a === 'again') { const keys = S.sec === 'odd' ? Object.keys(ODD) : Object.keys(CARDS); if (S.sec === 'odd') Ko = newDeck(keys); else Kn = newDeck(keys); sfx.click(); }
  else if (a === 'check') checkA();
  else if (a === 'inext') { insNext(); sfx.click(); }
  else if (a === 'pickb') pickB(b.dataset.v);
  else if (a === 'hs') {
    const bug = H.bugs[H.sel]; if (!bug) return;
    const ok = (b.dataset.v === '1') === HF[bug.k].ins; bug.sorted = { ok }; H.sel = null;
    const f = HF[bug.k], t = T[lang], nm = t.sec.bugs[bug.k];
    H.last = { ok, text: `${nm}: ${t.i.legs(f.l)}${f.p ? `, ${t.i.parts(f.p)}` : ''} → ${f.ins ? t.sec.insect : t.sec.notInsect}` };
    (ok ? sfx.good : sfx.bad)();
  } else if (a === 'hreset') { H = newHunt(); sfx.click(); }
  else if (a === 'mnext') { newMake('plants'); sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  const k = b.dataset.sec;
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === k ? null : k; sfx.click();
  if (S.sec === 'odd') Ko = newDeck(Object.keys(ODD));
  if (S.sec === 'hunt') { H = newHunt(); }
  render();
});
trayEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.act === 'mreset') { newMake(M.set); sfx.click(); }
  else if (b.dataset.q) pickQ(b.dataset.kind, +b.dataset.q);
  render();
});
paneEl.addEventListener('click', (ev) => {
  if (ev.target.closest('.pop')) { M.flash = null; render(); return; }
  const b = ev.target.closest('.bx'); if (!b || M.done) return;
  const n = nodeById(M.root, +b.dataset.id);
  if (n && n.q === null && n.items.length > 1) { M.sel = n; sfx.tick(); render(); }
});

// --- render: banner, chips, readout and state card in one go -----------------------------------------------------------
const fineHTML = (t) => `<div class="fine">${esc(t.fine)}</div>`;
function setCard(t, v, over) {
  const [emo, title, lead, body] = t.card[v];
  lab.setState({ emo, title, lead, body, extra: fineHTML(t), ...over });
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v; document.body.dataset.p = v === 'insects' ? S.ip : ''; document.body.dataset.s = S.sec || '';
  paneEl.className = ''; paneEl.innerHTML = ''; trayEl.className = ''; trayEl.innerHTML = '';
  $('ctrlBody').innerHTML = '';
  if (v === 'key') renderKey(t); else if (v === 'insects') renderIns(t); else renderMake(t);
}
const who = (key, inf) => (key ? `<div class="who">${CARDS[key]?.e || ''} <b>${esc(inf.name)}</b></div>` : '');
function renderKey(t) {
  const K = curK(), open = secret.unlocked();
  lab.setGlow('rgba(111, 179, 111, .22)');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('ctrlBody').innerHTML = `<div class="chips">${sc('odd', '🦆')}${sc('hunt', '🔍')}</div>`;
  if (S.sec === 'hunt') return renderHunt(t);
  const key = K.deck[K.i], odd = key && ODD[key];
  const inf = key ? { name: odd ? t.sec.names[key] : t.k.names[key], why: odd ? t.sec.odd[key] : t.k.why[key] } : null;
  lab.setReadout(K.n ? String(K.k) : '?', K.n ? t.k.score(K.k, K.n) : '', '', '#6fb36f');
  if (K.phase === 'end') {
    askEl.innerHTML = `<div class="verdict ok">🏆 ${esc(t.k.score(K.k, K.n))}</div><div class="opts"><button class="go" data-act="again">${esc(t.m.reset)}</button></div>`;
    return setCard(t, 'key', { emo: '🏆', title: t.k.score(K.k, K.n) });
  }
  if (K.phase === 'guess') askEl.innerHTML = `${who(key, inf)}<p>${esc(t.k.guess)}</p>`;
  else if (K.phase === 'fall') {
    const g = K.lastLit;
    askEl.innerHTML = `${who(key, inf)}<p>${g === null ? '…' : `${esc(t.gates[g])} → <span class="${K.ans}">${esc(t[K.ans])}</span>`}</p>`;
  } else {
    askEl.innerHTML = `${who(key, inf)}<div class="verdict ${K.ok ? 'ok' : 'bad'}">${K.ok ? '✅' : '🤔'} ${esc(K.ok ? t.right : t.wrong)}</div><p>${esc(inf.why)}</p>
      <div class="opts"><button class="go" data-act="next">${esc(t.next)}</button></div>`;
  }
  if (K.phase === 'result') setCard(t, 'key', { emo: K.ok ? '✅' : '🤔', title: K.ok ? t.right : t.wrong, lead: inf.why });
  else setCard(t, 'key');
}
function renderHunt(t) {
  const n = H.bugs.filter((b) => b.seen).length, sorted = H.bugs.filter((b) => b.sorted), right = sorted.filter((b) => b.sorted.ok).length, all = sorted.length === HUNT.length;
  lab.setGlow('rgba(60, 90, 160, .26)');
  lab.setReadout(`${n}/${HUNT.length}`, '', '', '#6fb36f');
  const last = H.last ? `<p>${H.last.ok ? '✅' : '🤔'} ${esc(H.last.text)}</p>` : '';
  if (all) askEl.innerHTML = `<div class="verdict ok">🏆 ${esc(t.k.score(right, HUNT.length))}</div>${last}<div class="opts"><button class="go" data-act="hreset">${esc(t.m.reset)}</button></div>`;
  else if (H.sel !== null) {
    const b = H.bugs[H.sel];
    askEl.innerHTML = `<div class="who"><b>${esc(t.sec.bugs[b.k])}</b></div><div class="opts"><button class="go" data-act="hs" data-v="1">${esc(t.sec.insect)}</button><button data-act="hs" data-v="0">${esc(t.sec.notInsect)}</button></div>`;
  } else askEl.innerHTML = `<div class="who">🔦 <b>${esc(t.sec.found(n))}</b></div><p>${esc(t.sec.torch)}</p>${last}`;
  setCard(t, 'key', { emo: '🔍', title: t.secrets.hunt[0], lead: t.secrets.hunt[1] });
}
function renderIns(t) {
  lab.setGlow('rgba(224, 176, 80, .24)');
  const bar = (inner) => { askEl.innerHTML = inner; };
  if (S.ip === 'A') {
    const q = IA.sq;
    if (!IA.checked) {
      lab.setReadout('?', '', '', '#e0b050');
      bar(`<div class="q">${esc(t.i.qA)}</div><div class="opts"><button class="go" data-act="check"${IA.sel.size ? '' : ' disabled'}>${esc(t.check)}</button></div>`);
    } else if (q) {
      const k = MINI[q.i], ins = INS.has(k);
      const facts = [k === 'centi' ? t.i.many : t.i.legs(LEGS[k]), PARTS[k] ? t.i.parts(PARTS[k]) : null].filter(Boolean).join(', ');
      const extra = k === 'louse' ? t.i.louse : k === 'centi' ? t.i.centi : '';
      lab.setReadout('?', '', '', '#e0b050');
      bar(`<div class="who"><b>${esc(t.i.names[k])}</b>: ${esc(facts)} · <span class="${ins ? 'yes' : 'no'}">${esc(ins ? t.sec.insect : t.sec.notInsect)} ${ins ? '✓' : '✗'}</span></div>${extra ? `<p>${esc(extra)}</p>` : ''}<div class="opts"><button data-act="inext">${esc(t.next)}</button></div>`);
    } else {
      const bad = MINI.filter((k) => IA.sel.has(k) !== INS.has(k)), good = MINI.length - bad.length;
      const sent = (k) => (k === 'louse' ? t.i.louse : k === 'centi' ? t.i.centi : k === 'spider' ? t.k.why.spider : `${t.i.names[k]}: ${t.i.legs(LEGS[k])}, ${t.i.parts(PARTS[k])}.`);
      lab.setReadout(`${good}/${MINI.length}`, '', '', '#e0b050');
      bar(`<div class="verdict ${bad.length ? 'bad' : 'ok'}">${bad.length ? '🤔' : '✅'} ${bad.length ? '' : esc(t.right)}</div>${bad.slice(0, 3).map((k) => `<p>${esc(sent(k))}</p>`).join('')}<div class="opts"><button class="go" data-act="inext">${esc(t.next)}</button></div>`);
    }
  } else if (!IB.pick) {
    lab.setReadout('?', '', '', '#e0b050');
    bar(`<div class="q">${esc(t.i.qLegs)}</div><div class="opts">${['head', 'thorax', 'abdomen'].map((p) => `<button data-act="pickb" data-v="${p}">${esc(t.i[p])}</button>`).join('')}</div>`);
  } else {
    const ok = IB.pick === 'thorax';
    lab.setReadout('6', t.i.legs(6), '', '#e0b050');
    bar(`<div class="verdict ${ok ? 'ok' : 'bad'}">${ok ? `✅ ${esc(t.right)}` : '🤔'}</div><p>${esc(t.i.rLegs)}</p><div class="opts"><button class="go" data-act="inext">${esc(t.next)}</button></div>`);
  }
  setCard(t, 'insects', S.ip === 'B' && !IB.pick ? { body: '' } : {});  // Part B: "6 legs, all on the thorax" would answer the question
}
function renderMake(t) {
  if (!M) newMake('animals');
  lab.setGlow('rgba(217, 130, 95, .24)');
  const animals = M.set === 'animals', names = animals ? t.m.animals : t.m.plants, good = animals ? t.m.good : t.m.goodPlants, act = activeNode();
  lab.setReadout(`${M.used.size}/3`, '', '', '#d9825f');
  if (M.done) askEl.innerHTML = `<div class="verdict ok">✅ ${esc(t.m.done)}</div><p>${esc(t.m.many)}</p>${animals ? `<div class="opts"><button class="go" data-act="mnext">${esc(t.m.nextSet)}</button></div>` : ''}`;
  else askEl.innerHTML = `<div class="who">${esc(t.m.q)}</div>`;
  const box = (n) => {
    const items = n.items.map((it) => `<span class="it"><i class="em">${EMO[it] ?? '<b class="moss"></b>'}</i><small>${esc(names[it])}</small></span>`).join('');
    const multi = n.q === null && n.items.length > 1 && !M.done;
    return `<button class="bx ${n === act && !M.done ? 'act' : ''} ${n.items.length === 1 && n.q === null ? 'one' : ''} ${n.q !== null ? 'split' : ''} ${multi ? 'multi' : ''} ${M.done && n.q === null ? 'ok' : ''}" data-id="${n.id}"${multi ? '' : ' tabindex="-1"'}>${items || '<span class="empty">—</span>'}</button>`;
  };
  const tree = (n) => n.q === null ? `<div class="tn">${box(n)}</div>`
    : `<div class="tn">${box(n)}<div class="qlab">${esc(good[n.q])}</div><div class="kids">${['yes', 'no'].map((k) => `<div class="kd"><span class="edge ${k[0]}">${esc(t[k])}</span>${tree(n[k])}</div>`).join('')}</div></div>`;
  paneEl.className = 'on';
  paneEl.innerHTML = tree(M.root) + (M.flash ? flashHTML(t, good) : '');
  // question chips: good and unfair ones mixed
  const bads = t.m.badQ, chips = [];
  for (let i = 0; i < Math.max(good.length, bads.length); i++) {
    if (i < good.length) chips.push({ txt: good[i], kind: 'good', i });
    if (i < bads.length) chips.push({ txt: bads[i], kind: 'bad', i });
  }
  trayEl.className = 'on';
  trayEl.innerHTML = chips.map((q) => `<button class="chip ${q.kind === 'bad' ? 'badq' : ''} ${q.kind === 'good' && M.used.has(q.i) ? 'on' : ''}" data-kind="${q.kind}" data-q="${q.i}"${q.kind === 'good' && (M.used.has(q.i) || M.done) ? ' disabled' : ''}>${esc(q.txt)}</button>`).join('')
    + `<button class="chip" data-act="mreset">⟲ ${esc(t.m.reset)}</button>`;
  setCard(t, 'make');
}
function flashHTML(t, good) {
  const f = M.flash;
  if (f.type === 'same') return `<div class="pop card"><div class="pq">${esc(good[f.idx])}</div><p>${esc(t.m.same)}</p></div>`;
  return `<div class="pop card"><div class="pq">${esc(t.m.badQ[f.idx])}</div><div class="kids2"><div class="kid"><span class="av">🧒</span><span class="bub y">${esc(t.yes)}</span></div>
    <div class="kid"><span class="av">👧</span><span class="bub n">${esc(t.no)}</span></div></div><p>${esc(t.m.bad)}</p></div>`;
}
render();
</script>
</body>
