const TAU = Math.PI * 2;
const C = { night: '#1B2147', night2: '#2B3170', gold: '#FFD166', pink: '#FF8FB1', teal: '#3DD6C6', lilac: '#B9A2FF', green: '#3DDC97', ink: '#F4F1E8',

const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);

  c.lineTo(bx - 36, bot); c.quadraticCurveTo(bx, bot, bx, bot - 36);

class Jar {

    }));

  land(f) { return FLOOR - 5 * (1 - (f.x / 72) ** 2) - f.lay; }
  reset() {

    let rest = 0;

function stepJar(dt, time) {
  const J = S.j, jar = S.jar, B = S.B, t = T[lang], H = S.hold;
  J.t += dt;

  switch (J.phase) {
    case 'q1':

      jar.keep = J.shook; break;
    case 'r1a':
      jar.keep = true;

        if (J.t > 2.6) { S.flip = 0; J.phase = 'r1b'; J.t = 0; jar.keep = false; render(); }

    case 'r1b': jar.keep = false; sink = 1; break;
    case 'q2': jar.keep = true; break;

  c.save(); c.translate(ox, oy); c.scale(k, k);
  const gl = c.createRadialGradient(0, -20, 20, 0, -20, 200); gl.addColorStop(0, rgba(C.lilac, 0.16)); gl.addColorStop(1, rgba(C.lilac, 0));
  c.fillStyle = gl; c.fillRect(-220, -240, 440, 440);
  handPass(c, 0); handPass(c, 1);
  c.strokeStyle = 'rgba(244,241,232,.1)'; c.lineWidth = 2; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-50, -10); c.quadraticCurveTo(-10, 20, 40, 0); c.moveTo(-46, 30); c.quadraticCurveTo(-10, 60, 36, 40); c.stroke();
  HP.forEach((P, f) => {
    const fg = FINGERS[f];
    if (F.lit[f]) {
      const a = fg.a * Math.PI / 180, dx = Math.sin(a), dy = -Math.cos(a), S1 = fg.L - fg.w / 2;
      c.strokeStyle = rgba(C.gold, 0.2); c.lineWidth = fg.w - 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(fg.bx, fg.by); c.lineTo(fg.bx + dx * S1, fg.by + dy * S1); c.stroke();
      c.save(); c.strokeStyle = C.gold; c.lineWidth = 3.4; c.shadowColor = C.gold; c.shadowBlur = 12; strokePoly(c, P.pts); c.restore();
    } else if (F.prog[f] > 0.005) {
      c.save(); c.lineWidth = 3.6; c.lineCap = 'round'; c.lineJoin = 'round';
      c.strokeStyle = C.teal; c.shadowColor = C.teal; c.shadowBlur = 10; strokePoly(c, polyRange(P, 0, Math.min(F.prog[f], P.pTip)));
      if (F.prog[f] > P.pTip) { c.strokeStyle = C.lilac; c.shadowColor = C.lilac; strokePoly(c, polyRange(P, P.pTip, F.prog[f])); }
      c.restore();
    }
  });
  c.restore();
  // the glowing dot, number badges and the word, in screen pixels
  if (F.dotA > 0.02) {
    const f = F.mode === 'guide' ? F.guideF : F.dotF, p = F.mode === 'guide' ? F.prog[f] : F.dotP, P = HP[f], [px, py] = posAt(P, p);
    const X = ox + px * k, Y = oy + py * k, col = p < P.pTip ? C.teal : C.lilac;
    c.save(); c.globalAlpha = F.dotA;
    const dg = c.createRadialGradient(X, Y, 1, X, Y, 20); dg.addColorStop(0, '#ffffff'); dg.addColorStop(0.3, rgba(col, 0.9)); dg.addColorStop(1, rgba(col, 0));
    c.fillStyle = dg; circ(c, X, Y, 20); c.fill(); circ(c, X, Y, 5); c.fillStyle = '#ffffff'; c.fill();
    c.restore();
  }
  HP.forEach((P, f) => {
    if (!F.lit[f]) return;
    const pop = Math.max(0, easeBack((time - F.litAt[f]) / 0.45)), fg = FINGERS[f];
    const X = ox + (P.tip[0] + P.d[0] * (fg.w / 2 + 18)) * k, Y = oy + (P.tip[1] + P.d[1] * (fg.w / 2 + 18)) * k, r = 14 * pop;
    const bg = c.createRadialGradient(X - 3, Y - 4, 1, X, Y, 15); bg.addColorStop(0, '#fff3c4'); bg.addColorStop(1, C.gold);
    c.fillStyle = bg; circ(c, X, Y, r); c.fill(); c.strokeStyle = shade(C.gold, 0.45); c.lineWidth = 1.5; c.stroke();
    if (pop > 0.6) { c.fillStyle = C.night; c.font = '900 16px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(f + 1), X, Y + 1); }
  });
  // the small jar in the corner settles with every breath
  const kj = Math.min(h * 0.27 / 270, w * 0.17 / 180), jx = w - 16 - 90 * kj, jy = h - 18 - 134 * kj;
  c.save(); c.translate(jx, jy + 134 * kj); c.scale(1, 0.14); const sg = c.createRadialGradient(0, 0, 2, 0, 0, 80 * kj); sg.addColorStop(0, 'rgba(0,0,0,.5)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = sg; circ(c, 0, 0, 80 * kj); c.fill(); c.restore();
  S.fm.draw(c, jx, jy, kj, { fs: 1.7 });
  if (F.wordA > 0.02) pill(c, F.word, w / 2, h - 26, { a: F.wordA, W: w, fs: 18, color: F.inh ? C.teal : C.lilac, stroke: rgba(F.inh ? C.teal : C.lilac, 0.7) });
}
// free tracing: drag a finger along the outline of one finger of the hand
const cv = $('cv');
let dragging = false;
function traceAt(ev) {
  const g = S.HG, F = S.f; if (!g) return;
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left - g.ox) / g.k, y = (ev.clientY - r.top - g.oy) / g.k;
  let bf = -1, bi = 0, bd = (34 / g.k) ** 2;
  HP.forEach((P, f) => {
    if (F.lit[f]) return;
    for (let i = 0; i < P.pts.length; i++) { const dx = P.pts[i][0] - x, dy = P.pts[i][1] - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; bf = f; bi = i; } }
  });
  if (bf < 0) return;
  const P = HP[bf], p = P.cum[bi] / P.total, pr = F.prog[bf];
  if (p >= pr - 0.03 && p <= pr + 0.32) {
    F.prog[bf] = Math.max(pr, p); F.active = bf; F.dotF = bf; F.dotP = F.prog[bf];
    if (F.prog[bf] >= 0.95) {
      F.lit[bf] = true; F.prog[bf] = 1; F.litAt[bf] = performance.now() / 1000; F.boost = 1; F.active = -1; sfx.good();
      if (litCount() === 5) { S.fm.settleAll(); render(); }
    }
  }
}
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'hand' || S.f.mode !== 'play') return;
  dragging = true; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ }
  traceAt(ev);
});
cv.addEventListener('pointermove', (ev) => { if (dragging) traceAt(ev); });
const dragEnd = () => { dragging = false; if (S.f) S.f.active = -1; };
cv.addEventListener('pointerup', dragEnd); cv.addEventListener('pointercancel', dragEnd);

// --- the loop ------------------------------------------------------------------------------------------------
let crashed = false;
canvasLoop($('cv'), (c, w, h, dt, time) => {
  c.save();
  try {
    c.beginPath(); c.roundRect(0, 0, w, h, 20); c.clip();
    const v = lab.view;
    if (v === 'jar') {
      if (S.sec) { S.secT += dt; if (S.sec === 'turtle') drawTurtle(c, w, h, time); else drawBelly(c, w, h, time); }
      else { stepJar(dt, time); drawJarScene(c, w, h, time); }
    } else if (v === 'help') { stepHelp(dt, time); drawHelp(c, w, h, time); }
    else { stepHand(dt, time); drawHand(c, w, h, time); }
  } catch (e) { if (!crashed) { crashed = true; console.error(e); } }
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------
function pickOption(k) {
  const v = lab.view;
  if (v === 'jar') {
    const J = S.j;
    if (J.phase === 'q1') {
      J.pick1 = k; J.t = 0;
      if (k === 1) { J.phase = 'r1b'; sfx.good(); } else {
        J.phase = 'r1a'; sfx.bad();
        if (k === 0) shakeJar(1.8, 2.2);
      }
    } else if (J.phase === 'q2') {
      J.pick2 = k; J.t = 0;
      if (k === 0) { J.phase = 'r2b'; sfx.good(); S.jar.keep = false; } else { J.phase = 'r2a'; sfx.bad(); }
    } else return;
    render(); showStage();
  } else if (v === 'help') helpPick(k);
  else {
    const F = S.f; if (F.pick !== null) return;
    F.pick = k; F.mode = 'guide'; F.t = 0; F.prog = [0, 0, 0, 0, 0]; F.lit = [false, false, false, false, false];
    S.fm.keep = false; (k === 2 ? sfx.good : sfx.bad)(); render(); showStage();
  }
}
$('jrOpts').addEventListener('click', (ev) => {
  const b = ev.target.closest('.jr-opt'); if (!b || b.disabled) return;
  pickOption(+b.dataset.k);
});
$('jrNext').addEventListener('click', () => {
  const v = lab.view; sfx.click();
  if (v === 'jar') {
    const J = S.j;
    if (J.phase === 'r1b') { J.phase = 'q2'; J.t = 0; J.k1 = J.k2 = false; S.jar.decay = 0.3; shakeJar(1, 1.6); S.jar.keep = true; }
    else if (J.phase === 'play') jarStart();
  } else if (v === 'help') {
    if (S.h.i < 2) helpStart(S.h.i + 1); else helpStart(0);
  } else handReset();
  render();
});
$('jrAux').addEventListener('click', () => {
  sfx.click();
  if (lab.view === 'jar') { S.sec = null; S.jar.keep = false; shakeJar(1, 1.4); }
  else handGuide();
  render();
});
$('secChips').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-k]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const kk = b.dataset.k;
  S.sec = S.sec === kk ? null : kk; S.secT = 0; sfx.click(); render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------
function card(arr) { lab.setState({ emo: arr[0], title: arr[1], lead: arr[2], body: arr[3] }); }
function showQ(qText, opts, pick, right) {
  $('jrQt').textContent = qText; $('jrQt').hidden = !qText;
  $('jrOpts').hidden = !opts;
  $('jrOpts').innerHTML = opts ? opts.map((o, j) => `<button class="jr-opt ${pick === null ? '' : j === right ? 'ok' : j === pick ? 'bad' : 'dim'}" data-k="${j}"${pick === null ? '' : ' disabled'}>${esc(o)}</button>`).join('') : '';
}
function setVerdict(text, ok, why) {
  const v = $('jrV'); v.textContent = text; v.className = `jr-v ${text ? (ok ? 'ok' : 'no') : ''}`; v.hidden = !text;
  $('jrWhy').textContent = why; $('jrWhy').hidden = !why;
}
function setButtons(next, aux) {
  $('jrNext').hidden = !next; $('jrNext').textContent = next || '';
  $('jrAux').hidden = !aux; $('jrAux').textContent = aux || '';
}
function readoutJar() {
  const t = T[lang], J = S.j;
  if (J.phase === 'play') lab.setReadout(t.j.breaths(J.breaths), '', '', C.teal);
  else lab.setReadout(J.phase === 'q1' || J.phase === 'q2' ? '?' : '🫙', '', '', C.teal);
}
function readoutHand() {
  const F = S.f; if (!F) return;
  lab.setReadout(F.pick === null ? '?' : `${litCount()}/5`, '', '', C.gold);
}
function render() {
  const t = T[lang], v = lab.view;
  $('jrPlay').hidden = true;
  if (v === 'jar') renderJar(t); else if (v === 'help') renderHelp(t); else renderHand(t);
}
function renderJar(t) {
  const J = S.j, ph = J.phase, play = ph === 'play';
  lab.setGlow('rgba(61, 214, 198, .22)');
  let qText = '', opts = null, pick = null, right = -1, why = '';
  if (ph === 'q1' || ph.startsWith('r1')) { qText = t.j.q1; opts = t.j.o1; pick = J.pick1; right = 1; if (ph.startsWith('r1')) why = t.j.r1; }
  else if (ph === 'q2' || ph.startsWith('r2')) { qText = t.j.q2; opts = t.j.o2; pick = J.pick2; right = 0; if (ph.startsWith('r2')) why = t.j.r2; }
  else { why = t.j.r2; }
  showQ(qText, opts, play ? null : pick, right);
  if (play) { $('jrOpts').hidden = true; }
  const shown = ph === 'r1b' || ph === 'r2b' || play; // the picture first, the words after it
  setVerdict(shown && !play && pick !== null ? (pick === right ? t.right : t.wrong) : '', pick === right, shown ? why : '');
  setButtons(ph === 'r1b' ? t.next : play ? t.again : '', play ? t.j.shake : '');
  $('jrPlay').hidden = !play;
  if (play) {
    $('jrHold').textContent = t.j.hold;
    const open = secret.unlocked();
    $('secChips').innerHTML = [['turtle', '🐢'], ['belly', '🎈']].map(([k, emo]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  }
  readoutJar();
  if (S.sec) lab.setState({ emo: S.sec === 'turtle' ? '🐢' : '🎈', title: t.secrets[S.sec][0], lead: t.secrets[S.sec][1], body: S.sec === 'turtle' ? t.sec.turtleText : t.sec.bellyText });
  else card(J.pick2 !== null ? t.cards.jar.f : t.cards.jar.n);
}
function renderHelp(t) {
  const H = S.h, i = H.i;
  lab.setGlow('rgba(255, 143, 177, .2)');
  showQ(t.h.q[i], t.h.o[i], H.pick, HELP[i].right);
  const shown = H.stage === 'right'; // the picture first, the words after it
  setVerdict(shown ? (H.pick === HELP[i].right ? t.right : t.wrong) : '', H.pick === HELP[i].right, shown ? t.h.why[i] : '');
  setButtons(H.pick !== null && H.next ? (i < 2 ? t.next : t.again) : '', '');
  lab.setReadout(`${i + 1}/3`, '', '', C.pink);
  card(i === 2 && H.pick !== null ? t.cards.help.f : t.cards.help.n);
}
function renderHand(t) {
  const F = S.f, done = litCount() === 5;
  lab.setGlow('rgba(255, 209, 102, .2)');
  showQ(t.f.q, t.f.o, F.pick, 2);
  setVerdict(F.pick !== null ? (done && F.mode === 'play' ? t.f.done : F.pick === 2 ? t.right : t.wrong) : '', F.pick === 2, F.pick !== null ? t.f.r : '');
  setButtons(F.pick !== null && F.mode === 'play' ? t.again : '', F.pick !== null && F.mode === 'play' ? t.f.trace : '');
  readoutHand();
  card(F.pick !== null ? t.cards.hand.f : t.cards.hand.n);
}
jarStart(); helpStart(0); handStart();
render();
</script>
