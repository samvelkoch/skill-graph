function sceneBag(c, w, h, dt, time, mode) {

      }
      const ey = base - ph * it.e / 100;
      c.save(); c.setLineDash([5, 3]); c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(x - bw2 / 2 - 4, ey); c.lineTo(x + bw2 / 2 + 4, ey); c.stroke(); c.restore();
      pill(c, String(it.v), x, Math.max(tp - 4, base - bh2 - 12), { size: 12 });
    });
    marble(c, cx - bw2 / 2 - 3, base + 14, 8, COLS[0], { shadow: true }); marble(c, cx + bw2 / 2 + 3, base + 14, 8, COLS[1], { shadow: true });
    pill(c, bg.fr, cx, base + 34, { size: 12 });
  });
}

// --- readout, state card, controls -------------------------------------------------------------------------
function info() {
  const t = T[lang], v = lab.view;
  lab.setFacts(t.facts[v]);
  if (S.sec === 'a') return infoA(t);
  if (S.sec === 'b') return infoB(t);
  if (v === 'chance') infoChance(t); else if (v === 'build') infoBuild(t); else infoFair(t);
}
function infoChance(t) {
  const c = S.cnt, N = sum(c), k = c[S.tgt], r1 = t.r1;
  if (S.opts.length < 3) { lab.setReadout('?', '', '', COLS[S.tgt]); lab.setState({ emo: '🔮', title: r1.needT, lead: r1.need, body: '', extra: '' }); return; }
  if (S.phase === 'ask') { lab.setReadout('?', t.bagN(N), '', COLS[S.tgt]); lab.setState({ emo: '🔮', title: r1.askT, lead: r1.askL, body: '', extra: '' }); return; }
  const o = S.opts[S.pick], g = fstr(o.n, o.d), cn = t.cols[S.tgt];
  const lead = o.kind === 'ok' ? r1.ok(k, N, cn) : o.kind === 'pp' ? r1.pp(g, k, N) : o.kind === 'uni' ? r1.uni(g, k, N) : r1.oth(g, k, N);
  const body = R1.done ? r1.done(R1.tally[S.tgt], fmt(20 * k / N)) : r1.run(Math.min(20, R1.i + 1));
  lab.setReadout(`${k}/${N}`, t.out(k, N), `🎲 ${sum(R1.tally)}/20`, COLS[S.tgt]);
  lab.setState({ emo: o.kind === 'ok' ? '✅' : '🤔', title: o.kind === 'ok' ? t.right : t.notq, lead, body, extra: '' });
}
function infoBuild(t) {
  const tg = TARGETS[S.ti], f = fstr(tg.n, tg.d), cn = t.cols[tg.c], N = sum(S.bcnt), k = S.bcnt[tg.c], b = t.b;
  const intro = tg.n === 0 ? b.i0 : tg.n === tg.d ? b.i1 : '';
  if (!S.chk) {
    lab.setReadout(f, b.goal, '', COLS[tg.c]);
    lab.setState({ emo: '🧵', title: b.title, lead: b.q(cn, f), body: N ? intro : b.empty, extra: '' });
    return;
  }
  const ch = S.chk;
  lab.setReadout(`${ch.k}/${ch.N}`, t.out(ch.k, ch.N), ch.ok ? '✓' : '✗', COLS[tg.c]);
  if (ch.ok) {
    const lead = tg.n === 0 ? b.imp(ch.k, ch.N) : tg.n === tg.d ? b.cert(ch.k, ch.N) : (ch.k !== tg.n || ch.N !== tg.d) ? b.same(ch.k, ch.N, f) : b.exact(ch.k, ch.N);
    lab.setState({ emo: '✅', title: t.right, lead, body: intro, extra: '' });
  } else lab.setState({ emo: '🤔', title: t.notq, lead: b.no(ch.k, ch.N, ch.k * tg.d > tg.n * ch.N), body: intro, extra: '' });
}
function infoFair(t) {
  const f = t.f;
  if (S.fphase === 'ask') { lab.setReadout('?', '', '', COLS[1]); lab.setState({ emo: '🎡', title: f.stT, lead: f.stL, body: '', extra: '' }); return; }
  lab.setReadout('1/2', f.sub, `🎡 ${R3.i}/30`, COLS[1]);
  lab.setState({ emo: !S.fair ? '✅' : '🤔', title: !S.fair ? t.right : t.notq, lead: f.exp, body: R3.done ? f.done(R3.tally[0]) : f.run(Math.min(30, R3.i + 1)), extra: '' });
}
function infoA(t) {
  lab.setReadout('1/4', t.sa.sub, '', COLS[0]);
  lab.setState({ emo: '🛍️', title: t.sa.t, lead: RA.done ? t.sa.done : t.sa.run, body: RA.done ? t.sa.body(blueIn(0, 100), blueIn(1, 100), blueIn(2, 100)) : '', extra: '' });
}
function infoB(t) {
  const n = RB.ids.length, b = RB.ids.filter((x) => x < 100).length, sb = t.sb;
  lab.setReadout(n ? `${b}/${n}` : '–', n ? t.out(b, n) : '', '', COLS[0]);
  if (!RB.out.length) { lab.setState({ emo: '✋', title: sb.t, lead: sb.st, body: '', extra: '' }); return; }
  const last = RB.out[RB.out.length - 1];
  lab.setState({ emo: '✋', title: sb.out(t.cols[last.col]), lead: n ? sb.lead(b, n) : sb.empty, body: '', extra: '' });
}

const dotBg = (ci) => `radial-gradient(circle at 35% 30%, ${tint(COLS[ci], -.6)}, ${COLS[ci]} 45%, ${tint(COLS[ci], .45)})`;
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  const mix = !sec && (v === 'chance' || v === 'build');
  $('mixer').style.display = mix ? '' : 'none';
  $('vChance').style.display = !sec && v === 'chance' ? '' : 'none';
  $('vBuild').style.display = !sec && v === 'build' ? '' : 'none';
  $('vFair').style.display = !sec && v === 'fair' ? '' : 'none';
  $('secCtl').style.display = sec ? '' : 'none';
  if (mix) {
    const cnt = v === 'build' ? S.bcnt : S.cnt;
    $('mixer').innerHTML = COLS.map((_, i) => `<div class="mb-cell"><span class="mb-sw" style="background:${dotBg(i)}"></span>
      <button class="mb-sb" data-act="dec" data-i="${i}" aria-label="− ${esc(t.cols[i])}"${cnt[i] <= 0 ? ' disabled' : ''}>−</button><b>${cnt[i]}</b>
      <button class="mb-sb" data-act="inc" data-i="${i}" aria-label="+ ${esc(t.cols[i])}"${cnt[i] >= 9 ? ' disabled' : ''}>+</button></div>`).join('');
  }
  if (!sec && v === 'chance') {
    $('tgtRow').innerHTML = `<span class="lbl">${esc(t.chanceOf)}</span>` + [0, 1, 2, 3].filter((i) => S.cnt[i] > 0).map((i) =>
      `<button class="chip ${i === S.tgt ? 'on' : ''}" data-act="tgt" data-i="${i}"><span class="mb-dot" style="background:${dotBg(i)}"></span>${esc(cap(t.cols[i]))}</button>`).join('');
    const ask = S.phase === 'ask';
    $('qBox').innerHTML = S.opts.length < 3 ? '' : `<div class="mb-q">${esc(t.r1.q(t.cols[S.tgt]))}</div><div class="mb-opts">${S.opts.map((o, i) =>
      `<button class="mb-opt ${!ask && o.kind === 'ok' ? 'ok' : !ask && i === S.pick ? 'bad' : ''}" data-act="opt" data-i="${i}"${ask ? '' : ' disabled'}><span class="fr"><b>${o.n}</b><b>${o.d}</b></span></button>`).join('')}</div>`;
    $('chBtns').innerHTML = `<button class="mb-b" data-act="newbag">${esc(t.r1.newBag)}</button>` +
      (!ask && !R1.on ? `<button class="mb-b main" data-act="again">${esc(t.r1.again)}</button>` : '');
  } else if (!sec && v === 'build') {
    $('tiRow').innerHTML = `<span class="lbl">${esc(t.b.targets)}</span>` + TARGETS.map((g, i) => `<button class="chip ${i === S.ti ? 'on' : ''}" data-act="ti" data-i="${i}">${esc(fstr(g.n, g.d))}</button>`).join('');
    const done = S.chk && S.chk.ok;
    $('bBtns').innerHTML = done ? `<button class="mb-b main" data-act="next">${esc(t.b.next)}</button>` : `<button class="mb-b main" data-act="check"${sum(S.bcnt) ? '' : ' disabled'}>${esc(t.b.check)}</button>`;
  } else if (!sec) {
    const ask = S.fphase === 'ask';
    $('fBox').innerHTML = `<div class="mb-q">${esc(t.f.q)}</div><div class="mb-opts two">` + [[true, t.f.yes, 'fyes'], [false, t.f.no, 'fno']].map(([val, lbl, act]) =>
      `<button class="mb-opt ${!ask && val === false ? 'ok' : !ask && S.fair === val ? 'bad' : ''}" data-act="${act}"${ask ? '' : ' disabled'}>${esc(lbl)}</button>`).join('') + '</div>';
    $('fBtns').innerHTML = !ask && !R3.on ? `<button class="mb-b main" data-act="fagain">${esc(t.f.again)}</button>` : '';
  }
  const open = secret.unlocked();
  $('secRow').innerHTML = [['a', '🛍️'], ['b', '✋']].map(([k, emo]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec === 'a') $('secCtl').innerHTML = `<button class="mb-b main" data-act="sa">${esc(RA.done ? t.sa.again : t.sa.go)}</button>`;
  if (sec === 'b') $('secCtl').innerHTML = `<button class="mb-b main" data-act="sbdraw"${RB.pick || !RB.ids.length ? ' disabled' : ''}>${esc(t.sb.draw)}</button><button class="mb-b" data-act="sbfill">${esc(t.sb.refill)}</button>`;
  lab.setGlow(sec ? 'rgba(242, 194, 48, .22)' : v === 'fair' ? 'rgba(229, 72, 77, .22)' : v === 'build' ? 'rgba(76, 191, 116, .2)' : 'rgba(79, 143, 232, .26)');
  info();
}
makeOpts();
render();
</script>
