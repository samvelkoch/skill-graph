// --- the sea: numbers -----------------------------------------------------------------------------------------
// world coordinates: x to the right (0 = open sea, 620 = hill), y down; SEA is the sea level, DEEP the floor of the open ocean
const SEA = 170, DEEP = 372, K = 11, D0 = 4000, H0 = 0.5, QX = 70, SX = 150;
const V0 = Math.sqrt(9.8 * D0); // m/s in 4000 m of water (about 198)
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = (t) => { const x = clamp(t, 0, 1); return x * x * (3 - 2 * x); };
const g = (u) => { const c = Math.cosh(clamp(u, -20, 20)); return 1 / (c * c); };
const PTS = [[0, 372], [190, 372], [250, 320], [320, 236], [380, 194], [420, 176], [470, 160], [500, 150], [530, 125], [560, 92], [590, 70], [620, 66]];
const FLR = (() => { // the floor, one sample every 2 px, then smoothed twice
  const a = [];
  for (let x = 0; x <= 620; x += 2) {
    let i = 0; while (i < PTS.length - 2 && x > PTS[i + 1][0]) i++;
    const [x0, y0] = PTS[i], [x1, y1] = PTS[i + 1];
    a.push(lerp(y0, y1, clamp((x - x0) / (x1 - x0), 0, 1)));
  }
  for (let pass = 0; pass < 2; pass++) {
    const b = a.slice();
    for (let i = 0; i < a.length; i++) { let s = 0, n = 0; for (let k = -7; k <= 7; k++) { const j = i + k; if (j >= 0 && j < a.length) { s += b[j]; n++; } } a[i] = s / n; }
  }
  return a;
})();
const floorBase = (x) => { const f = clamp(x / 2, 0, FLR.length - 1), i = Math.floor(f); return lerp(FLR[i], FLR[Math.min(i + 1, FLR.length - 1)], f - i); };
const depthAt = (x) => clamp(D0 * Math.pow(clamp((floorBase(x) - SEA) / (DEEP - SEA), 0, 1), 3), 1, D0); // metres
const cmpKey = (kmh) => (kmh >= 250 ? 'jet' : kmh >= 25 ? 'car' : 'bike');
const CMP_EMO = { jet: '✈️', car: '🚗', bike: '🚲' };
const KM = 17000, VP = 900, SPH = 0.32; // Pacific crossing, jet plane km/h, animation seconds per hour

// --- small helpers ------------------------------------------------------------------------------------------------
function resetWave() { Object.assign(W, { on: false, done: false, script: false, t: 0, x: QX, A: 0, w: 60, H: H0, v: V0 * 3.6, d: D0, delay: 0, trough: 0.8 }); S.lvl = 0; S.bump = 0; S.src = null; S.warned = false; S.warnT = 0; S.shk = 0; parts.length = 0; }
function spawn(n, x, y, o) {
  for (let i = 0; i < n; i++) parts.push({ x: x + (Math.random() - 0.5) * o.sx, y, vx: (Math.random() - 0.5) * o.vx, vy: -o.vy * (0.4 + Math.random() * 0.6), g: o.g, t: 0, max: o.life * (0.6 + Math.random() * 0.6), r: o.r * (0.6 + Math.random() * 0.8), col: o.col });
}

}

// --- physics step -----------------------------------------------------------------------------------------------
function stepWave(dt) {
  if (!W.on) return;
  if (W.script) {
    W.t += dt;
    const tt = W.t / 3.4;
    W.x = 345 + 190 * ease(tt);
    W.w = 22; W.trough = 0;
    W.A = 44 * smooth(0, 0.7, W.t) * (1 - smooth(485, 528, W.x));
    S.lvl = lerp(W.lvl0, 0, smooth(0, 1.6, W.t));
    if (W.t >= 3.4) { W.on = false; W.done = true; W.A = 0; S.lvl = 0; }
    return;
  }
  if (W.delay > 0) { W.delay -= dt; return; }
  W.t += dt;
  const d = depthAt(W.x), v = Math.sqrt(9.8 * d);
  W.d = d; W.v = v * 3.6; W.H = H0 * Math.pow(D0 / d, 0.25);
  const ramp = smooth(0, 0.7, W.t), start = 0.12 + 0.88 * smooth(0, 1.3, W.t);
  W.x += Math.max(34, 120 * Math.pow(v / V0, 0.35)) * start * dt;
  W.w = 16 + 44 * Math.sqrt(v / V0);
  W.A = visA(W.H * K) * ramp * (1 - smooth(485, 525, W.x));
  if (W.x > 527) { W.on = false; W.done = true; W.A = 0; }
}
function eta(x) { // height of the water surface above sea level at x, in px
  let e = S.lvl;
  if (W.on && W.A > 0.01) e += W.A * g((x - W.x) / W.w) - W.A * W.trough * g((x - (W.x + 2.4 * W.w)) / (W.w * 0.9));
  return e;
}
const floorAt = (x) => floorBase(x) - S.bump * Math.exp(-(((x - QX) / 26) ** 2));

function update(dt) {
  stepWave(dt);
  S.shk = Math.max(0, S.shk - dt);
  if (S.src) {
    S.src.t += dt;
    if (S.src.kind === 'quake') { const t = S.src.t; S.bump = t < 0.2 ? 9 * ease(t / 0.2) : 5 + 4 * Math.exp(-(t - 0.2) * 5); }
  }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.t > p.max) parts.splice(i, 1); }
  // secret a: the Moon's tide is slow and has no wave
  if (S.sec === 'a' && S.cause === 'moon') { S.moonT += dt; S.lvl = 7 * Math.sin(S.moonT * 0.8); }
  // secret b: the sensor under the passing wave
  if (S.sec === 'b') {
    const p = clamp(eta(SX) / VIS0, 0, 1.3);
    if (p > 0.35 && !S.warned) { S.warned = true; S.warnT = 0; sfx.good(); }
    if (S.warned) S.warnT += dt;
  }
  if (S.sec === 'b' && W.done && S.warned && S.warnT > 9) S.warned = false;
  updateWarn(dt);
  updateRace(dt);
  // controls that depend on time
  const vs = seaVerdict();
  if (vs !== S.vShown) { S.vShown = vs; render(); }
  if (WS.phase !== S.rp) { S.rp = WS.phase; render(); }
}
const seaVerdict = () => S.pickSea !== null && S.shaken && (W.t > 1.8 || W.done);

function groundY(x) { return floorBase(x); }
function updateWarn(dt) {
  if (WS.phase === 'idle' || lab.view !== 'signs' || S.sec) return;
  const ph = WS.phase;
  WS.t += dt;
  if (ph === 'shake' && WS.t > 1.6) { WS.phase = 'draw'; WS.t = 0; sfx.tick(); }
  else if (ph === 'draw') { S.lvl = WARN_LVL * ease(WS.t / 3); if (WS.t > 3) { WS.phase = 'ask'; WS.t = 0; } }
  else if (ph === 'ask') S.lvl = WARN_LVL + Math.sin(WS.t * 1.2) * 1.2;
  else if (ph === 'run') {
    WS.cd = Math.max(0, WS.cd - dt);
    S.lvl = WARN_LVL + Math.sin(WS.t * 1.2) * 1.2 - 9 * ease((3 - WS.cd) / 3);
    WS.bar += (WS.cd / CD - WS.bar) * Math.min(1, dt * 8);
    if (WS.cd <= 0) { WS.phase = 'wave'; WS.t = 0; Object.assign(W, { on: true, script: true, t: 0, x: 345, A: 0, done: false, lvl0: S.lvl }); sfx.push(); }
  } else if (ph === 'wave') {
    if (W.done) { WS.phase = 'settle'; WS.t = 0; }
  } else if (ph === 'settle') { if (WS.t > 2.2) { WS.phase = 'end'; WS.t = 0; sfx.good(); } }
  for (const p of people) {
    if (p.st === 'run') {
      p.x = Math.min(p.slot[0], p.x + 62 * dt);
      if (p.x >= p.slot[0]) { p.st = 'safe'; p.x = p.slot[0]; }
    }
    if ((WS.phase === 'wave' || WS.phase === 'settle') && W.x > 425 && (p.st === 'beach' || (p.st === 'run' && p.x < 512))) { p.st = 'washed'; p.wt = 0; }
    if (p.st === 'washed') { p.wt += dt; p.x -= 12 * dt; p.rot = Math.sin(p.wt * 3) * 0.25; p.alpha = Math.max(0, 1 - p.wt / 1.4); }
    p.y = groundY(p.x) + (p.row ? -6 : 0);
  }
}
const saved = () => people.filter((p) => p.st === 'safe' || p.st === 'run').length;
const onHill = () => people.filter((p) => p.st === 'safe').length;
function sendUp(p) { if (p.st !== 'beach') return; p.st = 'run'; sfx.click(); }

function updateRace(dt) {

  $('aChips').innerHTML = [['moon', '🌙'], ['quake', '🫨'], ['volcano', '🌋'], ['slide', '⛰️']].map(([k, e]) => `<button class="chip${S.cause === k ? ' on' : ''}" data-act="cause" data-k="${k}">${e} ${esc(t.sa.chips[k])}</button>`).join('');
  $('sendB').textContent = `🛟 ${t.sb.send}`;
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('a', '🌙') + sc('b', '🛟');
}

// --- readout, state card and facts: refreshed every frame, written only when they change ---------------------------
function seaRO(t) {
  if (!S.shaken) return ['—', '', '', '#4ea8ff'];
  const k = cmpKey(W.v);
  return [`${nf(W.H)} <small>${t.u.m}</small>`, `${Math.round(W.v)} ${t.u.kmh}`, `${CMP_EMO[k]} ${t.cmp[k]}`, '#4ea8ff'];
}
function refresh(force) {
  const t = T[lang], v = lab.view, ph = WS.phase;
  let ro, st, facts = [], glow = 'rgba(60, 110, 200, .32)';
  if (S.sec === 'a') {
    const m = S.cause === 'moon';
    ro = m ? ['🌙', t.sa.moonSub, '', '#9fb4ff'] : seaRO(t); st = t.sa.st[S.cause]; glow = 'rgba(120, 140, 230, .28)';
  } else if (S.sec === 'b') {
    const ex = Math.max(0, eta(SX) / VIS0 * H0), b = t.sb;
    ro = [`+${nf(ex)} <small>${t.u.m}</small>`, b.sub, S.warned ? `🚨 ${b.warning}` : b.quiet, S.warned ? '#ff4b3e' : '#4ea8ff']; st = S.warned ? b.warn : b.idle; glow = 'rgba(255, 120, 90, .22)';
  } else if (v === 'sea') {
    const sea = t.sea;
    if (S.pickSea === null) { ro = ['?', '', '', '#4ea8ff']; st = ['🤔', sea.q, '', '']; }
    else {
      ro = seaRO(t);
      if (!S.shaken) st = sea.ready;
      else if (W.x < 200 && !W.done) st = sea.deep(nf(H0), Math.round(V0 * 3.6));
      else if (W.x < 400 && !W.done) st = sea.slope;
      else st = sea.shore(nf(H0 * Math.pow(D0, 0.25)));
      facts = t.facts.sea;
    }
  } else if (v === 'signs') {
    const wr = t.warn; glow = 'rgba(245, 166, 76, .26)';
    if (ph === 'shake' || ph === 'idle') { ro = ['…', wr.watch, '', '#f5a64c']; st = wr.shake; }
    else if (ph === 'draw') { ro = ['…', wr.watch, '', '#f5a64c']; st = wr.draw; }
    else if (ph === 'ask') { ro = ['?', '', '', '#f5a64c']; st = [wr.ask[0], t.warn.q, wr.ask[1], '']; }
    else if (ph === 'run') { ro = [`${Math.ceil(WS.cd)} <small>${wr.sUnit}</small>`, wr.onHill(onHill()), '', '#f5a64c']; st = wr.run; facts = t.facts.signs; }
    else if (ph === 'wave' || ph === 'settle') { ro = [`${saved()} / 6`, wr.onHill(saved()), '', '#f5a64c']; st = wr.wave; facts = t.facts.signs; }
    else { const n = saved(); ro = [`${n} / 6`, wr.onHill(n), '', '#f5a64c']; st = n === 6 ? wr.all : wr.some(n); facts = t.facts.signs; }
  } else {
    const rc = t.race; glow = 'rgba(95, 208, 192, .24)';
    if (R.pick === null) { ro = ['?', '', '', '#5fd0c0']; st = ['🤔', rc.q, '', '']; }
    else {
      const hw = Math.round(hrsW(R.d)), kmh = Math.round(vWave(R.d));
      ro = [`${hw} <small>${t.u.h}</small>`, rc.waveAt(R.d, kmh), R.planeDone ? `✈️ ${Math.round(HP)} ${t.u.h}` : '', '#5fd0c0'];
      if (!R.firstDone) st = rc.ready;
      else if (hrsW(R.d) > HP * 1.35) st = rc.slow(R.d, kmh, hw);
      else st = rc.fast(hw, Math.round(HP));
      if (R.firstDone) facts = t.facts.race;
    }
  }
  const roKey = JSON.stringify(ro) + lang;
  if (force || roKey !== lastRO) { lastRO = roKey; lab.setReadout(ro[0], ro[1], ro[2], ro[3]); }
  const stKey = JSON.stringify([st, facts.length]) + lang + (S.sec || v);
  if (force || stKey !== lastST) { lastST = stKey; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] ?? '', extra: '' }); lab.setFacts(facts); lab.setGlow(glow); }
}
render(); refresh(true);
</script>
