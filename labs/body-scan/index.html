const rr = (c, x, y, w, h, r) => {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
};

};

// text on a dark rounded pill, centred at x,y and kept inside the canvas (W)
function pill(c, text, x, y, o = {}) {
  c.save();
  c.font = `${o.weight || 700} ${o.size || 12}px ${SANS}`;
  const w = c.measureText(text).width + 18, h = 22;
  let px = x - w / 2;
  if (o.W) px = Math.max(4, Math.min(o.W - w - 4, px));
  if (o.left !== undefined) px = o.left;
  rr(c, px, y - h / 2, w, h, 11); c.fillStyle = o.bg || 'rgba(10,12,20,.84)'; c.fill();
  if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = 1; c.stroke(); }
  c.fillStyle = o.color || '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, px + w / 2, y + .5);
  c.restore();
  return w;
}

// --- picture 2b: a sound pulse and its echo -----------------------------------------------------------------------------------
function drawEcho(c, w, h, t) {
  const V = T[lang].v2.e, E = S.ec, task = E.task, d0 = task ? TASKD[E.ti] : E.d, shown = !task || E.pick !== null;

  c.save(); rr(c, x0, colTop, cw, colBot - colTop, 14); c.clip();

      og.addColorStop(0, i ? '#ffd58a' : '#ffb6a8'); og.addColorStop(1, i ? '#c98a3d' : '#cf5f78');

const optHtml = (list, pick, done, ok, cls, act) => list.map((o, i) =>
  `<button class="bs-opt ${done ? (i === ok ? 'good' : i === pick ? 'bad' : 'dim') : pick === i ? 'on' : ''}" data-act="${act}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
const modeChips = (el_, modes, cur_, act) => { $(el_).innerHTML = Object.entries(modes).map(([k, l]) => `<button class="chip bs-chip ${k === cur_ ? 'on' : ''}" data-act="${act}" data-k="${k}">${esc(l)}</button>`).join(''); };
const secChip = (key, name, on) => `<button class="chip bs-chip secret ${secret.unlocked() ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${key}">${secret.unlocked() ? esc(name) : '🔒 ???'}</button>`;

function render() {
  const t = T[lang], v = lab.view;
  $('s1').hidden = v !== 'which'; $('s2').hidden = v !== 'how'; $('s3').hidden = v !== 'safe';
  if (v === 'which') renderWhich(t); else if (v === 'how') renderHow(t); else renderSafe(t);
}

function renderWhich(t) {
  const k = cur(), cs = t.cases[k.ci], V = t.v1, best = BEST[k.ci], unl = secret.unlocked();
  lab.setGlow('rgba(164, 147, 232, .26)');
  $('q1').textContent = S.free ? V.freeHint : cs.q;
  $('fcase').hidden = !S.free;
  $('fcase').innerHTML = t.cases.map((c_, i) => `<button class="chip bs-chip ${i === F.ci ? 'on' : ''}" data-act="fcase" data-i="${i}">${esc(c_.short)}</button>`).join('');
  $('toolChips').innerHTML = TOOLS.map((x) => `<button class="chip bs-chip ${k.tool === x ? 'on' : ''}" data-act="tool" data-t="${x}"><i class="bs-dot" style="background:${COL[x]}"></i>${esc(t.tools[x])}${!S.free && S.revealed && x === best ? ' ★' : ''}</button>`).join('');
  $('scanB').hidden = S.free;
  $('scanB').textContent = !S.revealed ? V.scan : S.ci < 4 ? V.next : V.again;
  $('scanB').disabled = !S.revealed && S.tool === null;
  $('sec1').innerHTML = secChip('free', t.secrets.free[0], S.free);
  const kk = S.results.filter(Boolean).length;
  if (S.free) lab.setReadout(esc(cs.short), k.tool ? t.tools[k.tool] : '', '', '#a493e8');
  else lab.setReadout(`${S.ci + 1}/5`, S.revealed && S.ci === 4 ? V.score(kk, 5) : V.patient, S.revealed ? `★ ${t.tools[best]}` : '', '#a493e8');
  let st;
  const fine = `<div class="bs-fine">${esc(t.fine)}</div>`;
  if (!k.shown) {
    st = { emo: '🩺', title: cs.name, lead: cs.q, body: S.free ? V.freeHint : k.tool ? V.ready2 : V.ready, extra: fine };
  } else {
    const r = RATE[k.ci][TOOLS.indexOf(k.tool)], first = !S.free && k.tool === S.chosen && S.firstView;
    const title = first ? (r === 2 ? V.right : V.notFirst(t.tools[k.tool])) : `${t.tools[k.tool]}: ${t.rate[r]}`;
    const body = r === 2 ? cs.why : `${V.bestIs(t.tools[best])} ${cs.why}`;
    st = { emo: first ? (r === 2 ? '✅' : '🤔') : '🔎', title, lead: t.sees[k.tool], body,
      extra: `<div class="bs-fine" style="color:var(--soft);margin-bottom:6px">${esc(V.compare)}</div>${!S.free && S.ci === 4 ? `<div class="bs-fine" style="color:var(--soft);margin-bottom:6px">${esc(V.score(kk, 5))}</div>` : ''}${fine}` };
  }
  lab.setState(st);
  lab.setFacts(k.shown && !S.free ? t.facts.v1 : []);
  void unl;
}

function renderHow(t) {
  const V = t.v2;
  modeChips('m2chips', V.modes, S.m2, 'm2');
  $('s2x').hidden = S.m2 !== 'x'; $('s2e').hidden = S.m2 !== 'e';
  if (S.m2 === 'x') renderXray(t, V.x); else renderEcho(t, V.e);
}
function renderXray(t, V) {
  const X = S.xr, done = X.on;
  lab.setGlow('rgba(240, 180, 76, .24)');
  $('xq').textContent = V.q;
  $('xopts').innerHTML = optHtml(V.opts, X.pick, done, V.ok, '', 'xo');
  $('xB').textContent = done ? V.again : V.expose;
  $('xB').disabled = !done && (X.pick === null || !S.allSeen);
  $('armL').textContent = V.armL;
  $('xnote').textContent = !S.allSeen ? V.lock : done ? V.moveHint : '';
  const n = xrayCount();
  if (!done) {
    lab.setReadout('?', V.rays, '', '#f0b44c');
    lab.setState({ emo: '☢️', title: V.pre[0], lead: V.pre[1], body: V.pre[2], extra: '' });
    lab.setFacts([]);
  } else {
    const right = X.pick === V.ok;
    lab.setReadout(n.bt ? `${n.b}/${n.bt}` : '–', `${V.boneW} · ${V.softW}: ${n.s}/${n.st}`, V.ill, '#f0b44c');
    lab.setState({ emo: right ? '✅' : '🤔', title: right ? V.right : V.wrong, lead: V.res, body: '', extra: '' });
    lab.setFacts(t.facts.x);
  }
}
function renderEcho(t, V) {
  const E = S.ec, unl = secret.unlocked();
  lab.setGlow('rgba(79, 209, 197, .24)');
  $('ePre').hidden = E.task; $('eTask').hidden = !E.task;
  if (!E.task) {
    $('depthL').textContent = `${V.depthL}: ${E.d} ${V.cm}`;
    $('depthR').value = E.d;
    $('depth2Box').hidden = !E.two;
    $('depth2L').textContent = `${V.depth2L}: ${E.d2} ${V.cm}`;
    $('depth2R').value = E.d2;
    $('eTest').textContent = V.test;
    $('sec2').innerHTML = secChip('two', t.secrets.two[0], E.two);
    const t1 = echoT(E.d), t2 = echoT(E.d2);
    if (E.two) {
      lab.setReadout(`${t1} · ${t2}`, `${V.echoT}, ${V.us}`, V.sound, '#4fd1c5');
      lab.setState({ emo: '〰️', title: V.two(t1, t2), lead: V.twoLead, body: V.expBody, extra: '' });
    } else {
      lab.setReadout(`${t1} ${V.us}`, `${V.echoT} · ${E.d} ${V.cm}`, V.sound, '#4fd1c5');
      lab.setState({ emo: '🔊', title: V.expTitle, lead: V.expLead, body: V.expBody, extra: '' });
    }
    lab.setFacts(t.facts.e);
  } else {
    const d = TASKD[E.ti], tt = echoT(d), { o, ok } = echoOpts(E.ti);
    const done = E.pick !== null;
    $('eq').textContent = V.q(tt);
    $('eopts').innerHTML = optHtml(o.map((x) => `${x} ${V.cm}`), E.pick, done, ok, '', 'eo');
    $('eNext').hidden = !done;
    $('eNext').textContent = E.ti < 2 ? V.next : V.back;
    if (!done) {
      lab.setReadout(`${tt} ${V.us}`, V.echoT, V.sound, '#4fd1c5');
      lab.setState({ emo: '❓', title: V.taskTitle, lead: V.taskLead, body: '', extra: '' });
      lab.setFacts([]);
    } else {
      const right = E.pick === ok, full = Math.round(.154 * tt);
      lab.setReadout(`${d} ${V.cm}`, V.echoT + ` ${tt} ${V.us}`, V.sound, '#4fd1c5');
      lab.setState({ emo: right ? '✅' : '🤔', title: right ? V.right : V.wrong, lead: V.res(tt, full, d), body: '', extra: '' });
      lab.setFacts(t.facts.e);
    }
  }
  void unl;
}

function renderSafe(t) {
  const V = t.v3;
  modeChips('m3chips', V.modes, S.m3, 'm3');
  $('s3d').hidden = S.m3 !== 'd'; $('s3g').hidden = S.m3 !== 'g';
  if (S.m3 === 'd') {
    const D = V.d, Z = S.dz, done = Z.pick !== null;
    lab.setGlow('rgba(239, 125, 95, .24)');
    $('dq').textContent = D.q;
    $('dopts').innerHTML = optHtml(D.opts, Z.pick, done, D.ok, '', 'do');
    if (!done) {
      lab.setReadout('?', D.sub, '', '#ef7d5f');
      lab.setState({ emo: '☢️', title: D.pre[0], lead: D.pre[1], body: D.pre[2], extra: '' });
      lab.setFacts(t.facts.dAlways);
    } else {
      const right = Z.pick === D.ok;
      lab.setReadout(String(DOSE_N), D.sub, '', '#ef7d5f');
      lab.setState({ emo: right ? '✅' : '🤔', title: right ? D.right : D.wrong, lead: D.res(fnum(DOSE.bg), fnum(DOSE.cxr), DOSE_N), body: D.body, extra: '' });
      lab.setFacts([...t.facts.dAfter, ...t.facts.dAlways]);
    }
  } else {
    const G = V.g, M = S.mg;
    lab.setGlow('rgba(164, 147, 232, .26)');
    $('gq').textContent = G.q;
    $('gchips').innerHTML = ITEMS.map((it, i) => {
      const ok = (it.m === 1) === M.sel[i];
      return `<button class="chip bs-chip ${M.sel[i] && !M.run ? 'on' : ''} ${M.run ? (ok ? 'secret open' : 'dis') : ''}" data-act="mt" data-i="${i}"${M.run ? ' disabled' : ''}>${it.e} ${esc(G.items[it.n])}</button>`;
    }).join('');
    $('gB').textContent = M.run ? G.again : G.bring;
    const k = ITEMS.filter((it, i) => (it.m === 1) === M.sel[i]).length;
    if (!M.run) {
      lab.setReadout('?', G.sub, '', '#a493e8');
      lab.setState({ emo: '🧲', title: G.pre[0], lead: G.pre[1], body: G.pre[2], extra: '' });
      lab.setFacts(t.facts.dAlways.slice(1));
    } else {
      lab.setReadout(`${k}/6`, G.sub, '', '#a493e8');
      lab.setState({ emo: k === 6 ? '✅' : '🤔', title: k === 6 ? G.right : G.wrong, lead: G.res, body: G.found(k, 6), extra: '' });
      lab.setFacts([...t.facts.gAfter, ...t.facts.dAlways.slice(1)]);
    }
  }
}

// --- events ----------------------------------------------------------------------------------------------------------------------
S.firstView = true; // the first view of a revealed case is the verdict; tapping other tools afterwards compares
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'tool') {
    const x = b.dataset.t;
    if (S.free) { F.tool = x; F.t0 = nowS(); sfx.click(); }
    else if (!S.revealed) { S.tool = x; sfx.tick(); }
    else { S.tool = x; S.scanT = nowS(); S.firstView = false; sfx.click(); }
  } else if (act === 'scan') {
    if (!S.revealed) {
      if (S.tool === null) return;
      S.chosen = S.tool; S.revealed = true; S.firstView = true; S.scanT = nowS();
      const ok = RATE[S.ci][TOOLS.indexOf(S.tool)] === 2; S.results[S.ci] = ok;
      if (S.ci === 4) S.allSeen = true;
      (ok ? sfx.good : sfx.bad)(); showStage();
      if (!ok) { // after a wrong choice the page itself shows the best tool's picture a moment later
        const ci0 = S.ci;
        setTimeout(() => { if (S.revealed && S.ci === ci0 && S.tool === S.chosen && S.tool !== BEST[ci0]) { S.tool = BEST[ci0]; S.scanT = nowS(); S.firstView = false; render(); } }, 3400);
      }
    } else if (S.ci < 4) { S.ci++; S.tool = null; S.chosen = null; S.revealed = false; S.firstView = true; sfx.click(); }
    else { S.ci = 0; S.tool = null; S.chosen = null; S.revealed = false; S.results = []; S.firstView = true; sfx.click(); }
  } else if (act === 'fcase') { F.ci = i; F.tool = null; sfx.tick(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'free') { S.free = !S.free; F.tool = null; }
    else { S.ec.two = !S.ec.two; S.ec.runT = nowS(); }
    sfx.click();
  } else if (act === 'm2') { S.m2 = b.dataset.k; S.ec.runT = nowS(); sfx.click(); }
  else if (act === 'xo') { S.xr.pick = i; sfx.tick(); }
  else if (act === 'xgo') {
    if (S.xr.on) { S.xr.on = false; S.xr.pick = null; sfx.click(); }
    else if (S.xr.pick !== null && S.allSeen) { S.xr.on = true; S.xr.onT = nowS(); (S.xr.pick === T[lang].v2.x.ok ? sfx.good : sfx.bad)(); showStage(); }
  } else if (act === 'etest') { S.ec.task = true; S.ec.ti = 0; S.ec.pick = null; S.ec.runT = nowS(); sfx.click(); }
  else if (act === 'eo') {
    S.ec.pick = i; S.ec.runT = nowS(); (i === echoOpts(S.ec.ti).ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'enext') {
    if (S.ec.ti < 2) { S.ec.ti++; S.ec.pick = null; } else { S.ec.task = false; S.ec.pick = null; }
    S.ec.runT = nowS(); sfx.click();
  } else if (act === 'm3') { S.m3 = b.dataset.k; sfx.click(); }
  else if (act === 'do') { S.dz.pick = i; S.dz.t0 = nowS(); (i === T[lang].v3.d.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'mt') { S.mg.sel[i] = !S.mg.sel[i]; sfx.tick(); }
  else if (act === 'mgo') {
    if (S.mg.run) { S.mg.run = false; S.mg.sel = S.mg.sel.map(() => false); sfx.click(); }
    else { S.mg.run = true; S.mg.t0 = nowS(); sfx.push(); showStage(); }
  }
  render();
});
$('armR').addEventListener('input', (ev) => { S.xr.ax = +ev.target.value / 100; render(); });
$('depthR').addEventListener('input', (ev) => { S.ec.d = +ev.target.value; S.ec.runT = nowS(); render(); });
$('depth2R').addEventListener('input', (ev) => { S.ec.d2 = +ev.target.value; S.ec.runT = nowS(); render(); });

const cv = $('cv');
LOOP = canvasLoop(cv, (c, w, h, dt, t) => {
  const v = lab.view;
  if (v === 'which') drawWhich(c, w, h, t);
  else if (v === 'how') (S.m2 === 'x' ? drawXray2 : drawEcho)(c, w, h, t);
  else (S.m3 === 'd' ? drawDose : drawMag)(c, w, h, t);
});
S.ec.runT = nowS();
render();
</script>
</body>
</html>
