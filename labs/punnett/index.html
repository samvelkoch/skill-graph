}

  h += bd.a.map((a, c) => `<div class="pn-head col" style="grid-column:${3 + c}">${tileHtml(bd, a)}</div>`).join('');
  h += bd.b.map((a, r) => `<div class="pn-head row" style="grid-row:${3 + r}">${tileHtml(bd, a)}</div>`).join('');
  for (let i = 0; i < 4; i++) {

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'cross') { S.p1 = 1; S.f1T = now(); sfx.good(); }
  else if (a === 'next1') { S.p1 = 2; S.sec = null; sfx.click(); }
  else if (a === 'g1') { S.guess1 = b.dataset.g; S.p1 = 3; S.verdict = b.dataset.g === 'some'; plant100(); (S.verdict ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'again') { S.verdict = null; plant100(); sfx.click(); }
  else if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k;
    if (S.sec === 'mend') rollMend();
    sfx.click(); if (S.sec) showStage();
  } else if (a === 'roll') { if (S.sec === 'mend') rollMend(); else rollEye(); sfx.tick(); }
  else if (a === 'eyen') { S.eye.n = +b.dataset.n; rollEye(); sfx.tick(); }
  else if (a === 'g2') { const bd = cur(); bd.guess = b.dataset.g; S.sel = null; sfx.click(); }
  else if (a === 'next2') { if (S.t2 < 2) { S.t2++; S.sel = null; sfx.click(); } else { newBoards(); sfx.click(); } }
  else if (a === 'again3') { S.b3 = mkBoard('abo', ['A', 'O'], ['B', 'O']); S.sel = null; sfx.click(); }
  else if (a === 'gopeas') { document.querySelector('#views [data-view="peas"]')?.click(); return; }
  render();
});

function peasReadout() {
  const t = T[lang], p = S.p1;
  if (S.sec === 'mend') return;
  if (p < 3) { lab.setReadout(p === 0 ? 'PP × pp' : p === 1 ? 'Pp' : 'Pp × Pp', '', '', '#9a6be0'); return; }
  const sh = S.shown, w = S.kids.slice(0, sh).filter((k) => k.w).length;
  lab.setReadout(String(w), t.peas.sub(sh), sh ? t.peas.pill(Math.round((w / sh) * 100)) : '', '#9a6be0');
}

// --- render: controls, readout, state card and facts for the current view ---------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  if (v !== 'peas' && S.sec === 'mend') S.sec = null;
  if (v !== 'abo' && S.sec === 'eye') S.sec = null;
  if (v === 'peas' && S.sec === 'eye') S.sec = null;
  if (v === 'abo' && S.sec === 'mend') S.sec = null;
  $('pnSq').style.display = (v === 'square' || (v === 'abo' && S.sec !== 'eye')) ? '' : 'none';
  if (v === 'peas') renderPeas(t); else renderBoard(t, v);
}
function renderPeas(t) {
  const p = S.p1, P = t.peas;
  lab.setGlow('rgba(142, 99, 220, .28)');
  let ctrl = '';
  if (p === 0) ctrl = `<button class="btn" data-act="cross">${esc(P.cross)}</button>`;
  else if (p === 1) ctrl = `<button class="btn" data-act="next1">${esc(P.next)}</button>`;
  else if (p === 2) ctrl = `<p class="pn-q">${esc(P.q)}</p><div class="pn-opts">${['all', 'some', 'none'].map((k) => `<button class="pn-opt" data-act="g1" data-g="${k}">${esc(P.opts[k])}</button>`).join('')}</div>`;
  else ctrl = `<div class="pn-opts">${S.sec === 'mend' ? `<button class="btn" data-act="roll">${esc(t.mend.roll)}</button>` : `<button class="btn" data-act="again">${esc(P.again)}</button>`}
    ${secChip('mend', t.mend.chip)}</div>`;
  $('ctrlBody').innerHTML = ctrl;
  let st;
  if (p === 0) st = { emo: '🌸', title: P.s0[0], lead: P.s0[1], body: P.s0[2] };
  else if (p === 1) st = { emo: '🌸', title: P.s1[0], lead: P.s1[1], body: P.s1[2] };
  else if (p === 2) st = { emo: '🤔', title: P.s2[0], lead: P.s2[1], body: P.s2[2] };
  else if (S.sec === 'mend' && S.mend) {
    const m = S.mend, r1 = (MEND.round / MEND.wrinkled).toFixed(2), r7 = (MEND.dom7 / MEND.rec7).toFixed(2);
    st = { emo: '🔢', title: t.mend.title((m.d / m.r).toFixed(2)), lead: t.mend.lead(fmt(MEND.N), fmt(m.d), fmt(m.r)), body: t.mend.body(fmt(MEND.round), fmt(MEND.wrinkled), r1, fmt(MEND.dom7), fmt(MEND.rec7), r7) };
  } else {
    const w = S.kids.filter((k) => k.w).length;
    const lead = S.verdict === null ? P.newer : `${S.verdict ? t.ok : t.no} ${P.same}`;
    const n = (x) => S.kids.filter((k) => geno(k.a, k.b) === x).length;
    st = { emo: '🌼', title: P.res(w, N), lead, body: P.expect(N), extra: `<b>PP ${n('PP')} · Pp ${n('Pp')} · pp ${n('pp')}</b><br>${esc(t.legend)}` };
  }
  if (p === 3 && S.sec === 'mend' && S.mend) lab.setReadout(`${(S.mend.d / S.mend.r).toFixed(2)} : 1`, t.mend.sub, '', '#5fa8a0');
  else peasReadout();
  lab.setState({ ...st, body: st.body ?? '', extra: st.extra ?? (p < 2 ? `<div>${esc(t.legend)}</div>` : '') });
  lab.setFacts(p === 3 ? (S.sec === 'mend' ? t.facts.mend : t.facts.peas) : t.facts.peas.slice(0, 1));
}
function renderBoard(t, v) {
  const bd = cur(), ph = phaseOf(bd), isAbo = v === 'abo', eye = isAbo && S.sec === 'eye';
  lab.setGlow(isAbo ? 'rgba(232, 106, 106, .24)' : 'rgba(224, 176, 80, .24)');
  const gate = gated();
  if (!eye) renderGrid(t, bd, ph !== 'fill');
  let ctrl = '', st;
  const Q = isAbo ? t.abo : t.sq;
  if (eye) {
    const n = S.eye.n, P = eyeP(n), pm = Math.max(...P);
    ctrl = `<div class="pn-opts">${[1, 2, 4, 8, 16].map((k) => `<button class="chip pn-chip ${k === n ? 'on' : ''}" data-act="eyen" data-n="${k}">${esc(t.eye.genes(k))}</button>`).join('')}
      <button class="chip pn-chip" data-act="roll">${esc(t.eye.roll)}</button></div>`;
    st = { emo: '👁️', title: t.eye.title(n), lead: t.eye.lead, body: t.eye.body(Math.round(pm * 100)), extra: `<i>${esc(t.eye.note)}</i>` };
    lab.setReadout(String(2 * n + 1), t.eye.sub, '', '#e8b04c');
  } else if (gate) {
    ctrl = `<p class="pn-q">${esc(t.sq.gate)}</p><button class="btn" data-act="gopeas">${esc(t.sq.gateGo)}</button>`;
    st = { emo: '🔒', title: t.sq.title(3, 'Pp', 'Pp'), lead: t.sq.gate, body: '' };
    lab.setReadout('?', '', t.sq.pill(3), '#e0b050');
  } else if (ph === 'guess') {
    const opts = isAbo ? [['yes', t.abo.yes], ['no', t.abo.no]] : [0, 1, 2, 3, 4].map((k) => [String(k), String(k)]);
    ctrl = `<p class="pn-q">${esc(Q.q)}</p><div class="pn-opts">${opts.map(([k, l]) => `<button class="pn-opt" data-act="g2" data-g="${k}">${esc(l)}</button>`).join('')}</div>`;
    st = isAbo ? { emo: '🩸', title: t.abo.title0, lead: t.abo.lead0, body: '' }
      : { emo: '🔲', title: t.sq.title(S.t2 + 1, geno(...bd.a), geno(...bd.b)), lead: t.sq.lead0, body: '' };
    lab.setReadout('?', '', isAbo ? '' : t.sq.pill(S.t2 + 1), isAbo ? '#e86a6a' : '#e0b050');
  } else if (ph === 'fill') {
    const k = [0, 1, 2, 3].filter((i) => cellOk(bd, i)).length, bad = bd.bad;
    ctrl = `<div class="pn-tray">${[...new Set(isAbo ? ['A', 'B', 'O'] : ['P', 'p'])].map((a) => `<span class="pn-t ${tileCls(bd, a)}${S.sel === a ? ' on' : ''}" data-a="${a}">${esc(disp(a))}</span>`).join('')}</div><p class="pn-note">${esc(t.sq.tray)}</p>`;
    st = bad ? { emo: '🧐', title: t.sq.badT, lead: t.sq.badL, body: t.sq.fillB(k) } : { emo: isAbo ? '🩸' : '🔲', title: t.sq.fillT, lead: t.sq.fillL, body: t.sq.fillB(k) };
    lab.setReadout('?', '', isAbo ? '' : t.sq.pill(S.t2 + 1), isAbo ? '#e86a6a' : '#e0b050');
  } else { // done
    const tl = tally(bd);
    if (isAbo) {
      const yes = bd.guess === 'yes', nO = tl.O || 0;
      ctrl = `<div class="pn-opts"><button class="btn" data-act="again3">${esc(t.abo.again)}</button></div>`;
      st = { emo: '🩸', title: t.abo.doneT(nO), lead: `${yes ? t.ok : t.no} ${t.abo.why}`, body: t.abo.body,
        extra: `<b>${['A', 'B', 'AB', 'O'].map((g) => `${disp(g)} ${tl[g] || 0}`).join(' · ')}</b>` };
      lab.setReadout(`${nO}/4`, t.abo.sub, '', '#e86a6a');
    } else {
      const wh = tl.white || 0, pu = tl.purple || 0, guess = +bd.guess, last = S.t2 === 2;
      ctrl = `<div class="pn-opts"><button class="btn" data-act="next2">${esc(last ? t.sq.again : t.sq.next)}</button></div>`;
      const carrier = wh === 0 && (bd.a.includes('p') || bd.b.includes('p')) ? t.sq.carrier : '';
      const kids = [0, 1, 2, 3].map((i) => geno(...kidOf(bd, i))), cn = (x) => kids.filter((q) => q === x).length;
      st = { emo: '✅', title: t.sq.doneT(wh), lead: `${guess === wh ? t.ok : t.no} ${guess === wh ? '' : t.sq.guessed(guess) + ' '}${t.sq.ratio(pu, wh)}`.replace(/\s+/g, ' ').trim(),
        body: t.sq.chance(wh) + carrier, extra: `<b>PP ${cn('PP')} · Pp ${cn('Pp')} · pp ${cn('pp')}</b>` };
      lab.setReadout(`${pu} : ${wh}`, t.sq.sub, t.sq.pill(S.t2 + 1), '#e0b050');
    }
  }
  if (isAbo) ctrl += `<div class="row2">${secChip('eye', t.eye.chip)}</div>`;
  $('ctrlBody').innerHTML = ctrl;
  lab.setState({ ...st, extra: st.extra ?? '' });
  lab.setFacts(eye ? t.facts.eye : isAbo ? (ph === 'done' ? [...t.facts.abo0, ...t.facts.abo1] : t.facts.abo0) : t.facts.square);
}
render();
</script>
