function evalMatch(items, secret) {
  const per = {}; let sum = 0;
  for (const o of secret) {

    if (d) {
      if (o.k === 'park') v = 1;

    }
    per[o.k] = v; sum += v;
  }
  const junk = items.filter((i) => i.k === 'blob').length;
  return { per, p: Math.round(100 * sum / (secret.length + 0.5 * junk)) };
}

const c01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => { t = c01(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const lg = (c, x0, y0, x1, y1, a, b) => { const g = c.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; };
const rg = (c, x0, y0, r0, x1, y1, r1, a, b) => { const g = c.createRadialGradient(x0, y0, Math.max(0, r0), x1, y1, Math.max(0, r1)); g.addColorStop(0, a); g.addColorStop(1, b); return g; };
const O = (c, w = 1.6, col = 'rgba(40,30,40,.55)') => { c.lineWidth = w; c.strokeStyle = col; c.stroke(); };
const rr = (c, x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, 7); };
const shadow = (c, rx) => { c.fillStyle = 'rgba(20,40,20,.28)'; c.beginPath(); c.ellipse(0, 2, rx, rx * 0.16, 0, 0, 7); c.fill(); };
const FONT = 'Nunito, system-ui, sans-serif';
let CW = 400;
function wrap(c, s, maxW, maxL = 3) {
  const out = []; let cur = '';
  for (const w of s.split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (c.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t;
  }
  if (cur) out.push(cur);
  return out.slice(0, maxL);
}
function pill(c, text, x, y, o = {}) { // screen space, x/y = top-left
  const size = o.size || 12;
  c.font = `800 ${size}px ${FONT}`;
  const w = c.measureText(text).width + 16, h = size + 10;
  const px = clamp(x, 3, Math.max(3, CW - w - 3));
  rr(c, px, y, w, h, h / 2); c.fillStyle = 'rgba(12,16,32,.82)'; c.fill();
  c.fillStyle = o.col || '#fff'; c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillText(text, px + 8, y + h / 2 + 0.5);
}
function bubble(c, text, x, y, w, h, o = {}) { // screen space speech box under a picture
  if (!text) return;
  o = o || {};
  const size = o.size || 12, lh = size + 3;
  c.font = `${o.bold ? 900 : 700} ${size}px ${FONT}`;
  const lines = wrap(c, text, w - 18), bh = Math.max(Math.min(h, 56), lines.length * lh + 12);
  rr(c, x, y, w, bh, 12); c.fillStyle = 'rgba(12,16,32,.82)'; c.fill();
  c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1; c.stroke();
  c.fillStyle = o.col || '#fff'; c.textBaseline = 'middle'; c.textAlign = 'left';
  lines.forEach((l, i) => c.fillText(l, x + 9, y + bh / 2 + (i - (lines.length - 1) / 2) * lh + 0.5));
}
const FW = 420, FH = 392;
function layout(w, h, n, y0 = 0, fw = FW, fh = FH) {
  const cols = w >= 560 ? n : 1, rw = w / cols, rh = (h - y0) / (cols === 1 ? n : 1);
  return Array.from({ length: n }, (_, i) => {
    const cx = (cols === 1 ? 0 : i) * rw, cy = y0 + (cols === 1 ? i : 0) * rh, s = Math.max(0.1, Math.min((rw - 10) / fw, (rh - 6) / fh));
    return { x: cx + (rw - fw * s) / 2, y: cy + (rh - fh * s) / 2, s };

  const p = S.p, tg = FACES[p.tgt], told = Object.keys(GROUPS).filter((g) => p.say[g]), right = told.filter((g) => p.say[g] === tg[g]).length, all = told.length === 4;
  lab.setGlow('rgba(143, 127, 208, .26)');
  $('pGrp').innerHTML = Object.entries(GROUPS).map(([g, vs]) => `<div class="dd-grp">${vs.map((v) => `<button class="chip dd-chip${p.say[g] === v ? ' on' : ''}" data-act="pchip" data-g="${g}" data-v="${v}">${esc(t.pol[g][v])}</button>`).join('')}</div>`).join('');
  $('pRow').innerHTML = `<button class="chip dd-chip" data-act="pnew">${esc(t.pol.newFace)}</button>`;
  lab.setReadout(all ? `${right}/4` : `${told.length}/4`, all ? '✓' : t.pol.told(told.length), '', '#8f7fd0');
  lab.setState(all ? { emo: '🕵️', title: t.pol.rTitle(right), lead: t.pol.rLead, body: '', extra: '' } : { emo: '🕵️', title: t.pol.title, lead: t.pol.lead, body: told.length ? t.pol.fill : '', extra: '' });
}
function rRadio(t) {
  const r = S.r, m = Math.min(r.m, 2), M = MOM[m];
  lab.setGlow('rgba(78, 168, 255, .26)');
  $('rQ').textContent = r.end ? '' : t.rad.n(m + 1);
  $('rOpts').innerHTML = r.end ? '' : t.rad.m[m].map((s, i) => `<button class="dd-opt${r.ok && i === M.ok ? ' good' : ''}" data-act="ropt" data-i="${i}"${r.dis.includes(i) || r.ok ? ' disabled' : ''}>${esc(s)}</button>`).join('');
  $('rRow').innerHTML = r.end ? `<button class="btn dd-btn" data-act="ragain">${esc(t.rad.again)}</button>` : r.ok ? `<button class="btn dd-btn" data-act="rnext">${esc(t.rad.next)}</button>` : '';
  lab.setReadout(`${m + 1}/3`, '', '', '#4ea8ff');
  if (r.end) lab.setState({ emo: '🏆', title: t.rad.end, lead: t.rad.endL, body: '', extra: '' });
  else if (r.ok) lab.setState({ emo: '✅', title: t.rad.ok, lead: t.rad.okL, body: '', extra: '' });
  else if (r.pick !== null) lab.setState({ emo: '🤔', title: t.rad.wrong, lead: '', body: '', extra: '' });
  else lab.setState({ emo: '📻', title: t.rad.title, lead: t.rad.lead, body: '', extra: '' });
}
render();
</script>
