  $('bCtl').hidden = !ans;
  $('slLt').textContent = b.sl.light; $('slDt').textContent = b.sl.damp; $('slYt').textContent = b.sl.years;
  for (const [id, val] of [['sL', B.L], ['sD', B.D], ['sY', B.Y]]) { const el = $(id); if (+el.value !== val) el.value = val; }
  $('sL').disabled = B.twin; $('sD').disabled = B.twin;
  $('bChips').innerHTML = secChip('twin', '👯', 'twin', B.twin);
  $('bTask').textContent = b.task; $('bFine').textContent = b.fine;
  if (!ans) { lab.setReadout('?', '', '', '#f0be5a'); lab.setState({ emo: '🤔', title: b.q, lead: b.wait, body: '', extra: '' }); lab.setFacts(t.facts.care); return; }
  const F = FADE(B.L, B.Y), R = RUST(B.D, B.Y), wi = (x) => (x < 0.08 ? 0 : x < 0.2 ? 1 : x < 0.45 ? 2 : 3);
  let st;
  if (B.twin) st = { emo: '👯', title: b.twin[0], lead: b.twin[1] };
  else if (B.auto && Y < 60) st = { emo: B.picked === b.ok ? '✅' : '🤔', title: B.picked === b.ok ? b.okT : b.noT, lead: b.lead };
  else if (B.L < 15) st = { emo: '🌑', title: b.dark[0], lead: b.dark[1] };
  else if (F > 0.2 && R > 0.2) st = { emo: '⚠️', title: b.both[0], lead: b.both[1] };
  else if (F > 0.2) st = { emo: '🖼️', title: b.fade[0], lead: b.fade[1] };
  else if (R > 0.2) st = { emo: '🪙', title: b.rust[0], lead: b.rust[1] };
  else if (Y >= 90) st = { emo: '🏆', title: b.safe[0], lead: b.safe[1] };
  else st = { emo: '👍', title: b.soFar[0], lead: b.soFar[1] };
  lab.setState({ body: '', extra: '', ...st });
  lab.setReadout(Y, b.yrs(Y), B.twin ? '' : `🖼️ ${b.wf[wi(F)]} · 🪙 ${b.wr[wi(R)]}`, '#f0be5a');
  lab.setFacts(t.facts.care);
}

function renderC(t) {
  const C = S.c, c = t.c, ans = C.picked !== null, k = Object.keys(C.tried).length;
  lab.setGlow('rgba(224, 130, 100, .24)');
  $('cQ').textContent = c.q;
  $('cOpts').innerHTML = c.opts.map((o, i) => `<button class="mu-opt ${ans ? (i === c.ok ? 'ok' : i === C.picked ? 'bad' : '') : ''}" ${ans ? 'disabled' : ''} data-pickc="${i}">${esc(o)}</button>`).join('');
  $('cCtl').hidden = !ans;
  $('cN').innerHTML = `<span class="lbl" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:800">👥 ${esc(c.nLabel)}</span>` + [1, 10, 100, 1000].map((n) => `<button class="mu-b ${C.n === n && !C.auto ? 'on' : ''}" data-n="${n}">${n}</button>`).join('');
  $('cAct').innerHTML = ['touch', 'flash', 'run', 'look'].map((x) => `<button class="mu-b ${C.last === x && C.act ? 'on' : ''}" data-do="${x}" ${x === 'look' && k < 3 ? 'disabled' : ''}>${esc(c.acts[x])}</button>`).join('');
  if (!ans) { lab.setReadout('?', '', '', '#e0826a'); lab.setState({ emo: '🤔', title: c.q, lead: '', body: '', extra: '' }); lab.setFacts(t.facts.visit); return; }
  let st;
  if (C.auto) st = { emo: C.picked === c.ok ? '✅' : '🤔', title: C.picked === c.ok ? c.okT : c.noT, lead: c.lead };
  else if (C.last && C.looked && k >= 3 && C.last === 'look') st = { emo: '🎉', title: c.done[0], lead: c.done[1] };
  else if (C.last) st = { emo: { touch: '🖐️', flash: '📸', run: '🏃', look: '👀' }[C.last], title: c.info[C.last][0], lead: c.info[C.last][1] };
  else st = { emo: '🚶', title: c.start[0], lead: c.start[1] };
  lab.setState({ body: '', extra: '', ...st });
  lab.setReadout(C.n, c.vis(C.n), c.pill(k), '#e0826a');
  lab.setFacts(t.facts.visit);
}
render();
</script>
