    if (found[1]) { c.strokeStyle = '#3a3226'; c.lineWidth = 1.3; c.beginPath(); c.moveTo(97, 127); c.lineTo(80, 158); c.stroke(); }
    c.lineWidth = 2.6; c.strokeStyle = found[0] ? '#ffd45c' : '#d9cba5'; c.beginPath(); c.moveTo(108, 86); c.quadraticCurveTo(116, 112, 124, 88); c.stroke();
  } else { // a pigeon
    bonesChain(c, [[30, 96], [60, 100], [80, 90], [100, 88]], 10, 2.6, 3.2);
    for (let i = 0; i < 5; i++) boneLine(c, [[30, 96], [4 + i * 1, 86 + i * 7]], 1.6);
    bonesChain(c, [[100, 88], [116, 72], [96, 56], [122, 46]], 8, 3, 2.2);
    smooth(c, [[120, 40], [130, 34], [138, 40], [136, 48], [126, 50]]); c.fillStyle = '#f1e6cf'; c.fill(); c.lineWidth = 1; c.strokeStyle = '#8c7c58'; c.stroke();
    c.beginPath(); c.moveTo(136, 41); c.lineTo(156, 45); c.lineTo(136, 48); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#3a3226'; c.beginPath(); c.arc(129, 42, 2.6, 0, 6.283); c.fill();
    for (let i = 0; i < 5; i++) { const x = 66 + i * 6; c.lineWidth = 2; c.strokeStyle = '#f1e6cf'; c.beginPath(); c.moveTo(x, 92); c.quadraticCurveTo(x + 6, 108, x + 2, 118); c.stroke(); }
    smooth(c, [[62, 106], [74, 130], [100, 136], [118, 108], [96, 114], [76, 112]]); c.fillStyle = '#f1e6cf'; c.fill(); c.lineWidth = 1.2; c.strokeStyle = '#8c7c58'; c.stroke();
    boneLine(c, [[96, 92], [72, 84], [42, 102]], 3);
    boneLine(c, [[78, 104], [92, 122]], 4.6); boneLine(c, [[92, 122], [80, 158]], 4); boneLine(c, [[80, 158], [86, 182]], 3.2);
    for (const [ex, ey] of [[112, 186], [110, 192], [104, 198]]) boneLine(c, [[86, 182], [ex, ey]], 2.8);
    boneLine(c, [[86, 182], [68, 190]], 2.4);
    if (found[1]) { c.strokeStyle = '#3a3226'; c.lineWidth = 1.3; c.beginPath(); c.moveTo(91, 122); c.lineTo(80, 156); c.stroke(); }
    c.lineWidth = 2.6; c.strokeStyle = found[0] ? '#ffd45c' : '#d9cba5'; c.beginPath(); c.moveTo(106, 90); c.quadraticCurveTo(114, 114, 122, 92); c.stroke();
  }
  if (found[2]) { c.strokeStyle = 'rgba(255,212,92,.85)'; c.lineWidth = 2.4; c.beginPath(); c.arc(kind ? 100 : 102, kind ? 190 : 191, 22, 0, 6.283); c.stroke(); }
}
function drawBones(c, dt, time) {
  const b = V, t = T[lang].bones, Bn = S.bones;
  let g = c.createLinearGradient(0, b.y0, 0, b.y1); g.addColorStop(0, '#171b2e'); g.addColorStop(1, '#262c46'); c.fillStyle = g; c.fillRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
  for (let p = 0; p < 2; p++) {
    const P = BONE_PANEL[p];
    c.fillStyle = 'rgba(255,255,255,.05)'; c.beginPath(); c.roundRect(P.x - 2, 6, 172, 226, 14); c.fill();
    c.save(); c.translate(P.x, P.y); c.scale(P.s, P.s); skeleton(c, p, Bn.found); c.restore();
    pill(c, t.tags[p], P.x + 84, 20, { size: 13 });
  }
  for (let p = 0; p < 2; p++) for (let i = 0; i < 3; i++) {
    const [x, y] = boneAt(p, i), done = Bn.found[i], pu = 1 + 0.15 * Math.sin(time * 4 + i * 2 + p);
    c.save(); c.translate(x, y); c.scale(done ? 1 : pu, done ? 1 : pu);
    c.strokeStyle = done ? '#3ddc97' : '#ffd45c'; c.lineWidth = 3; c.fillStyle = done ? 'rgba(61,220,151,.22)' : 'rgba(255,212,92,.2)';
    c.beginPath(); c.arc(0, 0, 13, 0, 6.283); c.fill(); c.stroke();
    if (done) { c.fillStyle = '#c4f7e0'; c.font = '900 14px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('✓', 0, 1); }
    c.restore();
  }
}

// --- the loop ---------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const k = viewKey(), H = VH[k], s = Math.min(w / W, h / H);
  V = { s, ox: (w - W * s) / 2, oy: (h - H * s) / 2, w, h, H };
  V.x0 = -V.ox / s; V.x1 = W + V.ox / s; V.y0 = -V.oy / s; V.y1 = H + V.oy / s;
  c.save(); c.translate(V.ox, V.oy); c.scale(s, s);
  if (k === 'hall') drawHall(c, dt, time); else if (k === 'legs') drawLegs(c, dt, time); else if (k === 'film') drawFilm(c, dt, time);
  else if (k === 'rib') drawRib(c, dt, time); else drawBones(c, dt, time);
  c.restore();
});

// --- pointer ----------------------------------------------------------------------------------------------------------
const toD = (ev) => { const r = $('cv').getBoundingClientRect(); return [(ev.clientX - r.left - V.ox) / V.s, (ev.clientY - r.top - V.oy) / V.s]; };
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('cv').addEventListener('pointerdown', (ev) => {
  const k = viewKey(), [x, y] = toD(ev);
  if (k === 'hall') {
    const H = S.hall; if (H.checked) return;
    const i = hitModel(x, y);
    if (i >= 0) {
      const m = H.models[i]; H.sel = i; H.drag = { i, dx: m.x - x, dy: m.y - y, x0: x, y0: y, moved: false };
      try { $('cv').setPointerCapture(ev.pointerId); } catch { /* no capture */ }
      sfx.tick(); render();
    } else if (H.sel >= 0 && y > 280) place(H.sel, x < 180 ? 0 : 1);
  } else if (k === 'legs') {
    if (S.legs.checked) return;
    const i = [62, 180, 298].findIndex((cx) => Math.abs(x - cx) < 54);
    if (i >= 0 && y > 40 && y < 260) legGuess(i);
  } else if (k === 'film') {
    const an = anchors(); let best = -1, bd = 26;
    an.forEach(([ax, ay], i) => { const d = Math.hypot(x - ax, y - ay); if (d < bd) { bd = d; best = i; } });
    if (best >= 0) { film.sel = best; sfx.tick(); render(); }
  } else if (k === 'bones') {
    for (let p = 0; p < 2; p++) for (let i = 0; i < 3; i++) { const [bx, by] = boneAt(p, i); if (Math.hypot(x - bx, y - by) < 24) return foundBone(i); }
  }
});
$('cv').addEventListener('pointermove', (ev) => {
  const H = S.hall, d = H.drag; if (!d || viewKey() !== 'hall') return;
  const [x, y] = toD(ev), m = H.models[d.i];
  if (!d.moved && Math.hypot(x - d.x0, y - d.y0) > 6) { d.moved = true; if (m.pod !== null) { unplace(d.i); render(); } }
  if (d.moved) { m.x = clamp(x + d.dx, 20, 340); m.y = clamp(y + d.dy, 30, 400); }
});
const endDrag = () => {
  const H = S.hall, d = H.drag; if (!d) return;
  H.drag = null;
  const m = H.models[d.i];
  if (d.moved) { if (m.y > 270) place(d.i, m.x < 180 ? 0 : 1); else { unplace(d.i); H.sel = -1; render(); } }
};
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag);

// --- controls ----------------------------------------------------------------------------------------------------
function legGuess(i) { const L = S.legs; L.g[i] = L.g[i] === 1 ? 2 : 1; sfx.click(); render(); }
function foundBone(i) {
  const B = S.bones; B.last = i;
  if (!B.found[i]) { B.found[i] = true; sfx.good(); } else sfx.tick();
  render();
}
function chooseFilm(real) {
  const F = film, i = F.sel; if (i < 0 || F.ans[i] !== null) return;
  F.ans[i] = real ? 'real' : 'fake'; F.last = i;
  ((real === !FAKE[i]) ? sfx.good : sfx.bad)(); render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, H = S.hall, L = S.legs;
  if (a === 'toD' || a === 'toN') { if (H.sel >= 0 && !H.checked) place(H.sel, a === 'toD' ? 0 : 1); return; }
  if (a === 'hcheck') {
    if (H.checked) { S.hall = mkHall(); sfx.click(); } else if (H.order.length === 6) { H.checked = true; H.at = now(); H.sel = -1; sfx.good(); showStage(); }
  } else if (a === 'lg') legGuess(+b.dataset.i);
  else if (a === 'lcheck') {
    if (L.checked) { L.g = [0, 0, 0]; L.checked = false; L.req = 100; L.flashed = false; $('dnDial').value = 100; sfx.click(); }
    else if (L.g.every((x) => x)) { L.checked = true; L.req = 100; $('dnDial').value = 100; sfx.good(); showStage(); }
  } else if (a === 'fsel') { film.sel = +b.dataset.i; sfx.tick(); }
  else if (a === 'freal') return chooseFilm(true);
  else if (a === 'ffake') return chooseFilm(false);
  else if (a === 'fagain') { film.ans = [null, null, null, null, null]; film.sel = -1; film.last = -1; sfx.click(); }
  else if (a === 'bsel') return foundBone(+b.dataset.i);
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; sfx.click();
  }
  render();
});
$('views').addEventListener('click', (ev) => { if (S.sec && ev.target.closest('button')) { S.sec = null; render(); } }); // a tab tap leaves a secret, even the same tab
$('dnDial').addEventListener('input', () => { S.legs.req = +$('dnDial').value; render(); });
$('dnRib').addEventListener('input', () => { S.rib = 300 - +$('dnRib').value; render(); });

// --- one render per change ---------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], k = viewKey();
  document.body.dataset.v = k;
  $('secHall').hidden = k !== 'hall'; $('secLegs').hidden = k !== 'legs'; $('secFilm').hidden = k !== 'film'; $('secRib').hidden = k !== 'rib'; $('secBones').hidden = k !== 'bones';
  const open = secret.unlocked();
  const sc = (key, emo) => `<button class="chip dn-c secret ${open ? 'open' : ''} ${S.sec === key ? 'on' : ''}" data-act="sec" data-k="${key}">${open ? `${emo} ${esc(t.secrets[key][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('rib', '⏳') + sc('bones', '🦴');
  $('bHCheck').textContent = ''; $('bLCheck').textContent = ''; $('bFAgain').textContent = ''; // no hidden duplicates of the visible buttons
  if (k === 'hall') renderHall(t); else if (k === 'legs') renderLegs(t); else if (k === 'film') renderFilm(t); else if (k === 'rib') renderRib(t); else renderBones(t);
  if (S.sec === 'rib' && !S.hall.checked) lab.setState({ emo: '🏛️', title: t.gate[0], lead: t.gate[1], body: '', extra: '' });
}
function renderHall(t) {
  const H = S.hall, n = H.order.length, sel = H.sel, h = t.hall;
  lab.setGlow('rgba(224, 160, 80, .26)');
  $('bToD').textContent = h.toD; $('bToN').textContent = h.toN;
  $('bToD').hidden = $('bToN').hidden = H.checked;
  $('bToD').disabled = $('bToN').disabled = sel < 0;
  $('bHCheck').textContent = H.checked ? t.again : t.check; $('bHCheck').disabled = !H.checked && n < 6;
  const kRight = H.models.filter((m) => m.pod === (m.dino ? 0 : 1)).length;
  lab.setReadout(`${n}/6`, h.sub, H.checked ? h.endT(kRight) : '', '#e0a050');
  if (H.checked) {
    const list = H.models.map((m) => { const right = m.pod === (m.dino ? 0 : 1); return `<div>${right ? '✅' : '❌'} ${esc(h.lines[NAME_AT.indexOf(m.id)])}</div>`; });
    lab.setState({ emo: kRight === 6 ? '🏆' : '🏛️', title: h.endT(kRight), lead: h.endLead, body: '', extra: `<div class="dn-list">${list.join('')}</div>` });
    lab.setFacts(h.facts);
  } else {
    lab.setFacts([]);
    if (sel >= 0) lab.setState({ emo: '👆', title: h.names[NAME_AT.indexOf(H.models[sel].id)], lead: h.pickLead, body: '', extra: '' });
    else lab.setState({ emo: '🏛️', title: h.q, lead: h.lead, body: '', extra: '' });
  }
}
function renderLegs(t) {
  const L = S.legs, g = t.legs;
  lab.setGlow('rgba(127, 176, 105, .24)');
  $('lChips').innerHTML = [0, 1, 2].map((i) => `<button class="chip dn-c ${L.checked ? (L.g[i] === LEG_ANS[i] ? 'good' : 'warn') : L.g[i] ? 'sel' : ''}" data-act="lg" data-i="${i}"${L.checked ? ' disabled' : ''}>${esc(g.names[i])}: ${esc(g.g[L.g[i]])}</button>`).join('');
  $('bLCheck').textContent = L.checked ? t.again : t.check; $('bLCheck').disabled = !L.checked && !L.g.every((x) => x);
  $('lDialBox').hidden = !L.checked; $('lE0').textContent = g.e0; $('lE1').textContent = g.e1;
  if (!L.checked) {
    lab.setReadout('?', g.sub, '', '#7fb069'); lab.setFacts([]);
    lab.setState({ emo: '🦵', title: g.q, lead: g.lead, body: '', extra: '' });
    return;
  }
  const k = [0, 1, 2].filter((i) => L.g[i] === LEG_ANS[i]).length, hallDone = S.hall.checked;
  lab.setReadout(L.req <= 25 ? '↔' : L.req <= 70 ? '↗' : '↓', g.sub, g.endT(k), '#7fb069');
  const list = g.lines.map((l, i) => `<div>${L.g[i] === LEG_ANS[i] ? '✅' : '❌'} ${esc(l)}</div>`).join('');
  lab.setState({ emo: k === 3 ? '🏆' : '🦵', title: g.endT(k), lead: g.after, body: hallDone ? g.sign : '', extra: `<div class="dn-list">${list}</div>` });
  lab.setFacts(hallDone ? g.facts : [g.facts[g.factsCroc]]);
}
function renderFilm(t) {
  const F = film, f = t.film, done = F.ans.filter((x) => x !== null).length;
  lab.setGlow('rgba(244, 162, 89, .26)');
  const ok = (i) => F.ans[i] !== null && (F.ans[i] === 'fake') === FAKE[i];
  $('fChips').innerHTML = f.names.map((n, i) => `<button class="chip dn-c ${F.ans[i] !== null ? (ok(i) ? 'good' : 'warn') : F.sel === i ? 'sel' : ''}" data-act="fsel" data-i="${i}">${i + 1} ${f.emo[i]} ${esc(n)}</button>`).join('');
  const asking = F.sel >= 0 && F.ans[F.sel] === null;
  $('fAskBox').hidden = !asking; $('fQ').textContent = f.ask; $('bFReal').textContent = f.real; $('bFFake').textContent = f.fake;
  $('bFAgain').hidden = done < 5; $('bFAgain').textContent = t.again;
  const k = F.ans.filter((_, i) => ok(i)).length;
  lab.setReadout(`${done}/5`, f.sub, done ? `${k} ✓` : '', '#f4a259');
  lab.setFacts(done === 5 ? f.facts : []);
  if (asking) lab.setState({ emo: f.emo[F.sel], title: f.names[F.sel], lead: f.claims[F.sel], body: f.ask, extra: '' });
  else if (F.sel >= 0 && F.ans[F.sel] !== null) {
    const i = F.sel, good = ok(i);
    lab.setState({ emo: good ? '✅' : '🤔', title: good ? t.ok : t.no, lead: f.truth[i], body: done === 5 ? `${f.endT(k)} ${f.endLead}` : '', extra: '' });
  } else if (done === 5) lab.setState({ emo: '🏆', title: f.endT(k), lead: f.endLead, body: '', extra: '' });
  else lab.setState({ emo: '🎬', title: f.q, lead: f.lead, body: '', extra: '' });
}
function renderRib(t) {
  const r = t.rib, Tm = S.rib;
  lab.setGlow('rgba(255, 214, 120, .22)');
  $('rE0').textContent = r.e0; $('rE1').textContent = r.e1;
  const st = Tm <= 0.3 ? r.st.now : Tm > RIB.dim[0] ? r.st.before : Tm >= RIB.dim[1] ? r.st.dim : Tm > RIB.dino[0] ? r.st.g1 : Tm >= RIB.dino[1] ? r.st.dino : r.st.g2;
  lab.setReadout(Tm <= 0.3 ? r.today : String(Tm), Tm <= 0.3 ? '' : r.sub, '', '#ffd678');
  lab.setState({ emo: '⏳', title: st[0], lead: st[1], body: '', extra: `<div class="dn-list">${esc(r.note)}</div>` });
  lab.setFacts(r.facts);
}
function renderBones(t) {
  const b = t.bones, B = S.bones, n = B.found.filter(Boolean).length;
  lab.setGlow('rgba(241, 230, 207, .2)');
  $('bChips').innerHTML = b.names.map((nm, i) => `<button class="chip dn-c ${B.found[i] ? 'good' : ''}" data-act="bsel" data-i="${i}">${B.found[i] ? '✓ ' : ''}${B.found[i] ? esc(nm) : '🔍 ???'}</button>`).join('');
  lab.setReadout(`${n}/3`, b.sub, '', '#f1e6cf');
  if (n === 3) { lab.setState({ emo: '🏆', title: b.endT, lead: b.endLead, body: '', extra: `<div class="dn-list">${b.lines.map((l) => `<div>✅ ${esc(l)}</div>`).join('')}</div>` }); lab.setFacts(b.facts); }
  else {
    lab.setFacts([]);
    if (B.last >= 0 && B.found[B.last]) lab.setState({ emo: '🦴', title: b.names[B.last], lead: b.lines[B.last], body: '', extra: '' });
    else lab.setState({ emo: '🔍', title: b.q, lead: b.lead, body: '', extra: '' });
  }
}
render();
</script>
