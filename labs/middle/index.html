  else if (info.kind === 'three') { const l = info.tops.map(em).join(', '); rd = mt.three(l); card = mt.cThree(l, info.max); }
  else if (info.kind === 'none') { rd = mt.none; card = mt.cNone(info.max); } else { rd = mt.zero; card = mt.cZero; }
  lab.setReadout(`<span class="md-rd">${esc(rd)}</span>`, '', '', GOLD);
  if (m.verdict) {
    const right = m.pred === 1, v = (right ? mt.vRight : mt.vWrong)(`${FR[1]} ${mt.names[1]}`, 6);
    lab.setState({ emo: right ? '✅' : '🤔', title: v[0], lead: v[1], body: mt.vBody, extra: '' });
    setQ(verdictQ(v, ` ${mt.one(FR[1], 6)}`));
  } else { lab.setState({ emo: '🍎', title: card[0], lead: card[1], body: '', extra: '' }); setQ(esc(mt.hint)); }
}
function renderMedian(t) {
  const m = S.med, mt = t.med, info = medInfo(), cm = t.cm;
  lab.setGlow('rgba(255, 209, 102, .22)');
  $('dGo').style.display = m.revealed ? 'none' : ''; $('dGo').textContent = mt.go; $('dGo').disabled = m.pred === null;
  ['dPlus', 'dMinus', 'dAgain'].forEach((id) => { $(id).style.display = m.revealed ? '' : 'none'; });
  $('dPlus').textContent = m.secB ? mt.add : mt.plus; $('dMinus').textContent = m.secB ? mt.rem : mt.minus; $('dAgain').textContent = t.again;
  $('dPlus').disabled = m.secB ? info.n >= 12 : m.plus; $('dMinus').disabled = m.secB ? info.n <= 3 : !m.plus;
  if (!m.revealed) {
    lab.setReadout(`<span class="md-rd">${esc(mt.rdQ)}</span>`, '', '', GOLD); setQ(esc(mt.q));
    const pk = m.pred === null ? null : m.kids.find((k) => k.id === m.pred);
    const pc = pk ? mt.pickL(pk.h) : null;
    lab.setState({ emo: '📏', title: pc ? pc[0] : mt.crowdT, lead: pc ? pc[1] : mt.crowdL, body: '', extra: '' });
    return;
  }
  const mm = fmt(info.m), rd = info.even ? mt.rdE(info.a, info.b, mm) : mt.rd(mm);
  lab.setReadout(`<span class="md-rd">${esc(rd.replace(/(\d)\.(\d)/g, (s, a, b) => (lang === 'en' ? s : `${a},${b}`)))}</span>`, '', '', GOLD);
  const live = info.even ? mt.cEven(info.n, info.a, info.b, mm) : mt.cOdd(info.n, (info.n - 1) / 2, mm);
  if (m.verdict && !m.secB) {
    const v = m.pred === 4 ? mt.vRight : m.pred === 3 ? mt.vMid : mt.vWrong;
    lab.setState({ emo: m.pred === 4 ? '✅' : '🤔', title: v[0], lead: v[1], body: '', extra: '' }); setQ(verdictQ(v));
  } else {
    lab.setState({ emo: info.even ? '🧦' : '📏', title: live[0], lead: live[1], body: '', extra: m.secB ? `<div class="md-fine">${esc(t.secrets.b[1])}</div>` : '' });
    setQ(esc(rd));
  }
}
function renderGiant(t) {

}
