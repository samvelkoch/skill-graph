function scene() {

      legend = [0, 1].map((s) => ({ s, label: names[s] }));

      text(c, sc.bracket.text, (hx + lx) / 2, yHi - 14, { size: 14, weight: 900, color: '#ffd666', pill: true, alpha: anim.brA });
    }
  }

  // season labels
  const sepL = anim.sepA, oneL = 1 - anim.sepA;
  for (let i = 0; i < 4; i++) {
    const cx = GX(i) + 37.5, hit = sc.mark && (i === sc.mark.best) && anim.valA > 0.3;
    const col = hit ? '#ffd666' : 'rgba(225, 230, 248, .92)';
    if (sepL > 0.03) { text(c, t.seasons[i], cx, 127, { size: 12.5, weight: 700, color: col, alpha: sepL }); text(c, t.seasons[i], cx, 255, { size: 12.5, weight: 700, color: col, alpha: sepL }); }
    if (oneL > 0.03) {
      text(c, SEASON_EMO[i], cx, PB + 17, { size: 16, weight: 500, alpha: oneL });
      text(c, t.seasons[i], cx, PB + 36, { size: 12.5, weight: 700, color: col, alpha: oneL });
    }
  }

  // the key
  const la = anim.legA;
  if (la > 0.03) {
    c.save(); c.globalAlpha = la;
    if (sc.legend) {
      c.font = `800 ${fs(13.5)}px ${FONT}`;
      const items = sc.legend.map((e) => ({ ...e, w: c.measureText(e.label).width + 24 })), tot = items.reduce((n, e) => n + e.w, 0) + (items.length - 1) * 14;
      const ft = time - (sc.flip ?? -9), wob = ft < 0.8 ? Math.sin(ft * 28) * Math.exp(-ft * 5) * 0.12 : 0;
      c.translate(DW / 2, 17); c.rotate(wob);
      let x = -tot / 2;
      for (const e of items) {
        rr(c, x, -7, 14, 14, 4); c.fillStyle = SW[e.s]; c.fill(); c.strokeStyle = 'rgba(255, 255, 255, .35)'; c.lineWidth = 1; c.stroke();
        text(c, e.label, x + 20, 0, { size: 13.5, weight: 800, align: 'left' });
        x += e.w + 14;
      }
    } else if (sc.noKey) {
      c.translate(DW / 2, 17);
      c.font = `800 ${fs(13)}px ${FONT}`; const tw = c.measureText(t.noKey).width + 34;
      rr(c, -tw / 2, -12, tw, 24, 12); c.strokeStyle = 'rgba(200, 210, 240, .5)'; c.lineWidth = 1.2; c.setLineDash([4, 3]); c.stroke(); c.setLineDash([]);
      text(c, `🔑 ${t.noKey}`, 0, 0, { size: 13, weight: 800, color: 'rgba(210, 218, 245, .85)' });
    }
    c.restore();
  }
  c.restore();
});

// tapping a season on the chart is the same as pressing its button
$('cv').addEventListener('pointerup', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - geo.ox) / geo.s, y = (ev.clientY - r.top - geo.oy) / geo.s;
  if (x < 40 || x > 340 || y < 30 || y > DH - 6) return;
  const g = clamp(Math.floor((x - 40) / 75), 0, 3), sc = scene();
  if (!sc.tap || !['sep', 'pair', 'real'].includes(sc.layout)) return;
  act({ act: lab.view === 'real' ? 'rpick' : 'pick', i: String(g) });
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function act(d) {
  const a = d.act, p = S.p, K = S.k, R = S.r;
  if (a === 'mode') { if (p.guess === null) { p.mode = d.m; sfx.click(); } }
  else if (a === 'pick') {
    if (p.guess !== null || p.sec || p.end) return;
    const Rd = ROUNDS[p.r]; p.guess = +d.i; p.at = now(); p.res[p.r] = p.guess === argGap(Rd.A, Rd.B);
    (p.res[p.r] ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'next') {
    if (p.end) { Object.assign(p, { r: 0, guess: null, mode: 'sep', res: [], end: false }); }
    else if (p.r < 2) { p.r++; p.guess = null; p.mode = 'sep'; }
    else p.end = true;
    sfx.click();
  } else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    p.sec = p.sec === d.k ? null : d.k; sfx.click();
  } else if (a === 'other') { p.sr = (p.sr + 1) % ROUNDS.length; sfx.click(); }
  else if (a === 'kans') {
    if (K.ans !== null) return;
    const step = K.step, i = +d.a, ok = step === 0 ? i === 0 : step === 1 ? i === 1 : i === CLUES[step - 2].aCol;
    K.ans = i; K.res[step] = ok; K.at = now(); (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'swap') { K.step = 1; K.swapped = true; K.ans = null; K.flip = now(); K.at = -9; sfx.push(); }
  else if (a === 'knext') { K.step++; K.ans = null; K.at = -9; sfx.click(); }
  else if (a === 'kagain') { Object.assign(K, { step: 0, ans: null, swapped: false, res: [], at: -9, flip: -9 }); sfx.click(); }
  else if (a === 'rpick') {
    const g = +d.i;
    if (R.guess === null) { R.guess = g; R.insp = argGap(MOS, BUD); R.at = now(); (g === R.insp ? sfx.good : sfx.bad)(); showStage(); }
    else { R.insp = g; sfx.tick(); }
  } else if (a === 'ragain') { Object.assign(R, { guess: null, insp: null, at: -9 }); sfx.click(); }
  render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  act({ ...b.dataset });
});

// --- one render per change: controls, readout, state card, facts ---------------------------------------------
function render() {
  const v = lab.view, t = T[lang];
  ['pairs', 'key', 'real'].forEach((k) => { $('sec_' + k).hidden = k !== v; });
  if (v === 'pairs') renderPairs(t); else if (v === 'key') renderKey(t); else renderReal(t);
}
const swatch = (s) => `<span class="mb-sw" style="background:${SW[s]}"></span>`;
const dotsOf = (res, n, at) => Array.from({ length: n }, (_, i) => (res[i] === undefined ? (i === at ? '◉' : '○') : '●')).join(' ');

function renderPairs(t) {
  const p = S.p, P = t.pr, Rd = ROUNDS[p.sec ? p.sr : p.r], done = p.guess !== null, best = argGap(Rd.A, Rd.B);
  const open = secret.unlocked(), acc = '#5b8def';
  lab.setGlow('rgba(91, 141, 239, .26)');
  lab.setFacts(t.facts.pairs);
  const secChip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${p.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`;
  const secRow = `<div class="mb-sec mb-row">${secChip('three', '👨‍👩‍👧')}${secChip('stack', '🧱')}${p.sec ? `<button class="chip" data-act="other">${esc(P.other)}</button>` : ''}</div>`;
  let h = '';
  if (p.sec) {
    if (p.sec === 'three') {
      const top = [Rd.A, Rd.B, Rd.C].map((a) => argMax(a));
      lab.setReadout('3', t.sec.threeUnit, '', acc);
      lab.setState({ emo: '👨‍👩‍👧', title: t.sec.three[0], lead: t.sec.threeLead(t.cls[0], t.seasons[top[0]].toLowerCase(), t.cls[1], t.seasons[top[1]].toLowerCase(), t.cls[2], t.seasons[top[2]].toLowerCase()), body: t.sec.threeBody, extra: '' });
    } else {
      const tot = Rd.A.map((a, i) => a + Rd.B[i]), top = argMax(tot);
      lab.setReadout(tot[top], `${t.sec.stackUnit} · ${t.seasons[top].toLowerCase()}`, '', acc);
      lab.setState({ emo: '🧱', title: t.sec.stack[0], lead: t.sec.stackLead(t.seasons[top], tot[top]), body: t.sec.stackBody, extra: '' });
    }
    $('sec_pairs').innerHTML = secRow;
    return;
  }
  if (p.end) {
    const k = p.res.filter(Boolean).length;
    lab.setReadout(`${k}/3`, dotsOf(p.res, 3, -1), '', acc);
    lab.setState({ emo: '🏆', title: P.end(k), lead: P.endLead, body: '', extra: '' });
    $('sec_pairs').innerHTML = `<div class="mb-row"><button class="btn mb-go" data-act="next">${esc(P.again)}</button></div>${secRow}`;
    return;
  }
  const chips = t.seasons.map((s, i) => {
    const cl = done ? (i === best ? 'ok' : i === p.guess ? 'no' : '') : '';
    return `<button class="chip mb-s ${cl}" data-act="pick" data-i="${i}"${done ? ' disabled' : ''}>${SEASON_EMO[i]} ${esc(s)}</button>`;
  }).join('');
  const seg = !done ? `<div class="card seg small">${[['sep', P.sep], ['pair', P.pair]].map(([m, l]) => `<button data-act="mode" data-m="${m}" class="${p.mode === m ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>` : '';
  const nextB = done ? `<button class="btn mb-go" data-act="next">${esc(p.r < 2 ? P.next : P.result)}</button>` : '';
  h = `<div class="mb-t">${esc(P.rOf(p.r + 1))}</div><p class="mb-q">${esc(P.q)}</p><div class="mb-row" role="group" aria-label="${esc(P.tap)}">${chips}</div>
    <div class="mb-ctl mb-row">${seg}${nextB}</div>${secRow}`;
  $('sec_pairs').innerHTML = h;
  const dots = dotsOf(p.res, 3, p.r);
  if (!done) {
    lab.setReadout('?', dots, '', acc);
    lab.setState({ emo: '🤔', title: P.q, lead: P.askLead, body: p.mode === 'sep' ? P.askSep : P.askPair, extra: '' });
  } else {
    const d = Math.abs(Rd.A[best] - Rd.B[best]), g = p.guess, ok = g === best, dg = Math.abs(Rd.A[g] - Rd.B[g]);
    lab.setReadout(d, P.readSub(d, t.seasons[best]), ok ? P.pillOk : P.pillNo(t.seasons[g]), acc);
    const line = P.gap(t.seasons[best], t.cls[0], Rd.A[best], t.cls[1], Rd.B[best], d);
    lab.setState(ok ? { emo: '✅', title: P.right, lead: line, body: P.why, extra: '' }
      : { emo: '🤔', title: P.wrong(t.seasons[g]), lead: line, body: `${P.gapAlso(dg)} ${P.why}`, extra: '' });
  }
}

function renderKey(t) {
  const K = S.k, Y = t.ky, step = K.step, end = step >= 4, answered = K.ans !== null, acc = '#f4923f';
  lab.setGlow('rgba(244, 146, 63, .24)');
  lab.setFacts(t.facts.key);
  const dots = dotsOf(K.res, 4, step);
  const clue = step >= 2 && !end ? CLUES[step - 2] : null;
  let h = '', ok = null;
  if (!end && answered) ok = K.res[step];
  if (end) {
    const k = K.res.filter(Boolean).length;
    $('sec_key').innerHTML = `<div class="mb-row"><button class="btn mb-go" data-act="kagain">${esc(Y.again)}</button></div>`;
    lab.setReadout(`${k}/4`, dots, '', acc);
    lab.setState({ emo: '🏆', title: Y.end(k), lead: Y.endLead, body: Y.body1, extra: '' });
    return;
  }
  const q = step < 2 ? Y.q0 : Y.qClue;
  let btns;
  if (step < 2) {
    const truth = step === 0 ? 0 : 1;
    btns = [0, 1].map((i) => `<button class="chip mb-s ${answered ? (i === truth ? 'ok' : i === K.ans ? 'no' : '') : ''}" data-act="kans" data-a="${i}"${answered ? ' disabled' : ''}>${esc(t.cls[i])}</button>`).join('');
  } else {
    btns = [0, 1].map((i) => `<button class="chip mb-s ${answered ? (i === clue.aCol ? 'ok' : i === K.ans ? 'no' : '') : ''}" data-act="kans" data-a="${i}"${answered ? ' disabled' : ''}>${swatch(i)} ${esc(t.col[i])}</button>`).join('');
  }
  let go = '';
  if (answered) go = step === 0 ? `<button class="btn mb-go" data-act="swap">${esc(Y.mis)}</button>` : `<button class="btn mb-go" data-act="knext">${esc(step === 3 ? Y.result : Y.next)}</button>`;
  h = `<div class="mb-t">${esc(step < 2 ? Y.tapKey : Y.tapClue)}</div><p class="mb-q">${esc(q)}</p><div class="mb-row">${btns}</div><div class="mb-ctl mb-row">${go}</div>`;
  $('sec_key').innerHTML = h;
  // readout and state card
  if (!answered) {
    lab.setReadout('?', dots, '', acc);
    if (step < 2) lab.setState({ emo: '🔑', title: q, lead: step === 0 ? Y.lead0 : Y.swapped, body: '', extra: '' });
    else lab.setState({ emo: '🕵️', title: q, lead: Y.clue(clue.n, t.seasons[clue.season], ACC_RU[clue.season]), body: Y.clueBody, extra: '' });
    return;
  }
  if (step < 2) {
    const hi = KEY_BLUE[3], lo = KEY_ORANGE[3], winner = K.swapped ? t.cls[1] : t.cls[0];
    lab.setReadout(`<span style="color:#8fb4ff">${hi}</span> : <span style="color:#ffb877">${lo}</span>`, Y.ro0, winner, acc);
    if (step === 0) lab.setState(ok ? { emo: '✅', title: t.pr.right, lead: Y.r0(hi, lo), body: '', extra: '' } : { emo: '🤔', title: Y.wt, lead: Y.w0, body: '', extra: '' });
    else lab.setState(ok ? { emo: '😈', title: t.pr.right, lead: Y.r1(t.cls[1]), body: Y.body1, extra: '' } : { emo: '🤔', title: Y.wt, lead: Y.w1(t.cls[1]), body: Y.body1, extra: '' });
  } else {
    const n = clue.n, line = Y.rc(t.colBars[clue.aCol], n, t.seasons[clue.season], ACC_RU[clue.season]);
    lab.setReadout(n, Y.roClue(t.seasons[clue.season]), t.col[clue.aCol], acc);
    lab.setState(ok ? { emo: '✅', title: Y.rt, lead: line, body: '', extra: '' } : { emo: '🤔', title: Y.wc, lead: line, body: '', extra: '' });
  }
}

function renderReal(t) {
  const R = S.r, L = t.rl, done = R.guess !== null, best = argGap(MOS, BUD), acc = '#3fbf8f';
  lab.setGlow('rgba(63, 191, 143, .24)');
  lab.setFacts(done ? t.facts.real(YEAR_MOS, YEAR_BUD) : []);
  const insp = R.insp ?? best;
  const chips = t.seasons.map((s, i) => {
    const cl = done ? `${i === best ? 'ok' : i === R.guess ? 'no' : ''} ${i === insp ? 'on' : ''}` : '';
    return `<button class="chip mb-s ${cl}" data-act="rpick" data-i="${i}">${SEASON_EMO[i]} ${esc(s)}</button>`;
  }).join('');
  $('sec_real').innerHTML = `<div class="mb-t">${esc(done ? L.inspect : t.pr.tap)}</div><p class="mb-q">${esc(L.q)}</p><div class="mb-row">${chips}</div>
    <div class="mb-ctl mb-row">${done ? `<button class="btn mb-go" data-act="ragain">${esc(L.again)}</button>` : ''}</div>`;
  if (!done) {
    lab.setReadout('?', t.unitMm, '', acc);
    lab.setState({ emo: '🌧️', title: L.q, lead: L.lead, body: `${L.askLead} ${L.askBody}`, extra: '' });
    return;
  }
  const d = MOS[insp] - BUD[insp], [val, sub] = L.ro(d, t.seasons[insp], MOS[insp], BUD[insp]), ok = R.guess === best;
  lab.setReadout(val, sub, ok ? L.pillOk : L.pillNo(t.seasons[R.guess]), acc);
  const line = L.res(t.seasons[insp], MOS[insp], BUD[insp], d), fine = `<div class="fine">${esc(L.fine)}</div>`;
  if (insp !== best) lab.setState({ emo: SEASON_EMO[insp], title: t.seasons[insp], lead: line, body: L.other, extra: fine });
  else lab.setState(ok ? { emo: '✅', title: L.right, lead: line, body: '', extra: fine } : { emo: '🤔', title: L.wrong(t.seasons[R.guess]), lead: line, body: '', extra: fine });
}
render();
</script>
