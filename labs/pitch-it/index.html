// --- view 3: the one-page plan, bars and the profit line ---------------------------------------------------
function drawPlan(c, dt, time) {
  const t = T[lang].pl, rev = S.rPick !== null, n = planNums(), k = Math.min(1, dt * 7);
  S.vi += ((rev ? n.inc : 0) - S.vi) * k; S.vc += ((rev ? n.cost : 0) - S.vc) * k;
  S.cap += (Math.max(100, n.inc, n.cost) * 1.08 - S.cap) * k;
  const pf = (r) => (S.price - PART) * r - TOOLS, lo = Math.min(-40, pf(0), pf(MAXR)), hi = Math.max(40, pf(0), pf(MAXR));
  S.g0 += (lo * 1.1 - S.g0) * k; S.g1 += (hi * 1.1 - S.g1) * k;
  // the plan card
  c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 10; c.shadowOffsetY = 3;
  const pg = c.createLinearGradient(0, 8, 0, 160); pg.addColorStop(0, '#f8f4e8'); pg.addColorStop(1, '#e6dfca'); c.fillStyle = pg; rr(c, 8, 8, W - 16, 152, 10); c.fill(); c.restore();
  c.strokeStyle = 'rgba(80,70,50,.25)'; c.lineWidth = 1; c.beginPath(); c.moveTo(W / 2, 16); c.lineTo(W / 2, 152); c.moveTo(16, 84); c.lineTo(W - 16, 84); c.stroke();
  t.card.forEach(([lb, tx], i) => {
    const x = i % 2 ? W / 2 + 10 : 20, y = i < 2 ? 14 : 90;
    c.textAlign = 'left'; c.textBaseline = 'middle'; c.font = '800 12.5px Nunito, sans-serif'; c.fillStyle = ['#b9770e', '#2a7f78', '#b24a35', '#2f7a3f'][i]; c.fillText(lb.toUpperCase(), x, y + 8);
    c.font = '800 13.5px Nunito, sans-serif'; c.fillStyle = '#2b2030';
    wrapLines(c, tx, W / 2 - 34).slice(0, 3).forEach((ln, j) => c.fillText(ln, x, y + 28 + j * 15));
  });
  // bars: income and costs
  const base = 398, maxH = 190, bx = [44, 104];
  if (!rev) {
    c.font = '900 40px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(190,205,255,.4)'; c.fillText('?', 100, 300); c.fillText('?', 268, 300);
    c.setLineDash([5, 5]); c.strokeStyle = 'rgba(190,205,255,.3)'; c.lineWidth = 1.5; rr(c, 20, 186, 160, 230, 12); c.stroke(); rr(c, 196, 186, 148, 230, 12); c.stroke(); c.setLineDash([]);
    tag(c, `${eur(S.price)} × ${S.reps}`, 100, 200, { size: 13 });
    return;
  }
  [[S.vi, '#6fb36f', t.inc], [S.vc, '#d9825f', t.cost]].forEach(([v, col, lb], i) => {
    const hgt = (v / S.cap) * maxH, x = bx[i], g = c.createLinearGradient(x, 0, x + 44, 0); g.addColorStop(0, shade(col, -0.15)); g.addColorStop(1, shade(col, 0.15));
    c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 6; c.shadowOffsetY = 2; c.fillStyle = g; rr(c, x, base - hgt, 44, Math.max(2, hgt), 6); c.fill(); c.restore();
    c.fillStyle = 'rgba(255,255,255,.2)'; rr(c, x + 3, base - hgt + 2, 8, Math.max(0, hgt - 4), 4); c.fill();
    c.font = '900 14px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(eur(Math.round([n.inc, n.cost][i])), x + 22, base - hgt - 11);
    c.font = '800 13px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.fillText(lb, x + 22, base + 14);
  });
  c.strokeStyle = 'rgba(190,205,255,.3)'; c.lineWidth = 1; c.beginPath(); c.moveTo(24, base); c.lineTo(168, base); c.stroke();
  const pr = n.profit;
  tag(c, pr > 0 ? `${t.profit} +${eur(pr)}` : pr < 0 ? `${t.loss} ${eur(-pr)}` : t.stZ, 96, 196, { size: 14, bg: pr > 0 ? 'rgba(46,160,110,.9)' : pr < 0 ? 'rgba(200,80,70,.9)' : 'rgba(100,108,132,.9)' });
  // the line: profit by repairs
  const gx = 206, gw = 130, gy = 214, gh = 160, X = (r) => gx + (r / MAXR) * gw, Y = (v) => gy + gh - ((v - S.g0) / (S.g1 - S.g0)) * gh, zy = Y(0);
  c.font = '800 13px Nunito, sans-serif'; c.textAlign = 'center'; c.fillStyle = '#C6CDE0'; c.fillText(t.graph, 270, 198, 148);
  c.strokeStyle = 'rgba(190,205,255,.25)'; c.lineWidth = 1; c.beginPath(); c.moveTo(gx, gy); c.lineTo(gx, gy + gh); c.stroke();
  [[0, 'rgba(61,220,151,.22)', true], [1, 'rgba(229,72,77,.22)', false]].forEach(([, col, up]) => {
    c.save(); c.beginPath(); c.rect(gx, up ? gy : zy, gw, up ? Math.max(0, zy - gy) : Math.max(0, gy + gh - zy)); c.clip();
    c.fillStyle = col; c.beginPath(); c.moveTo(X(0), zy); c.lineTo(X(0), Y(pf(0))); c.lineTo(X(MAXR), Y(pf(MAXR))); c.lineTo(X(MAXR), zy); c.closePath(); c.fill(); c.restore();
  });
  c.strokeStyle = 'rgba(237,239,247,.7)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(gx, zy); c.lineTo(gx + gw, zy); c.stroke();
  c.font = '700 13px Nunito, sans-serif'; c.textAlign = 'right'; c.fillStyle = '#98A0B8'; c.fillText('0', gx - 5, zy);
  c.strokeStyle = '#e0b050'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(X(0), Y(pf(0))); c.lineTo(X(MAXR), Y(pf(MAXR))); c.stroke();
  const be = S.price > PART ? TOOLS / (S.price - PART) : Infinity;
  if (be <= MAXR) { c.strokeStyle = 'rgba(255,255,255,.5)'; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(X(be), gy); c.lineTo(X(be), gy + gh); c.stroke(); c.setLineDash([]); }
  const dx = X(S.reps), dy = Y(pr);
  c.save(); c.shadowColor = '#fff'; c.shadowBlur = 8; c.fillStyle = '#fff'; c.beginPath(); c.arc(dx, clamp(dy, gy, gy + gh), 6, 0, 7); c.fill(); c.restore();
  c.fillStyle = pr >= 0 ? '#3ddc97' : '#ff8a80'; c.beginPath(); c.arc(dx, clamp(dy, gy, gy + gh), 3.5, 0, 7); c.fill();
  c.font = '700 13px Nunito, sans-serif'; c.textAlign = 'center'; c.fillStyle = '#98A0B8';
  [0, 20, 40].forEach((r) => c.fillText(String(r), X(r), gy + gh + 16));
  if (be <= MAXR) { c.fillStyle = '#fff'; c.fillText(`${t.be} ${Math.ceil(be)}`, clamp(X(be), gx + 30, gx + gw - 6), gy + gh + 33); }
}

// --- the shell -----------------------------------------------------------------------------------------------
const lab = shell({ key: 'pitch-it', T, topics: TOPICS, views: ['pitch', 'purpose', 'plan'], onLang: render, onView: render });
const secret = secretLab('pitch-it', () => ({
  secrets: [{ emo: '🛗', title: T[lang].sec.elev[0], desc: T[lang].sec.elev[1] }, { emo: '🙋', title: T[lang].sec.ask[0], desc: T[lang].sec.ask[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="secPitch"></div>
  <div id="secPurpose"></div>
  <div id="secPlan">
    <div id="plQ"></div>
    <div id="plPlay">
      <div class="pi-sl"><label for="slP" id="lblP"></label><b id="valP"></b><input type="range" id="slP" min="0" max="10" step="1"></div>
      <div class="pi-sl"><label for="slR" id="lblR"></label><b id="valR"></b><input type="range" id="slR" min="0" max="40" step="1"></div>
      <div class="pi-goal" id="goal"></div>
    </div>
  </div>`;
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const sc = Math.min(w / W, h / H), v = lab.view;
  backdrop(c, w, h, v === 'pitch' ? 'rgba(224,176,80,.22)' : v === 'purpose' ? 'rgba(217,130,95,.2)' : 'rgba(95,168,160,.2)');
  c.save(); c.translate((w - W * sc) / 2, (h - H * sc) / 2); c.scale(sc, sc);
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (v === 'pitch') drawPitch(c, dt, time); else if (v === 'purpose') drawPurpose(c, dt, time); else drawPlan(c, dt, time);
  c.restore();
});

// --- controls --------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const stopRun = () => { S.run = { on: false, t: 0, i: -1 }; S.done = false; };
const ASK_KEYS = ['all', 'vague', 'help', 'room', 'parts'];
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i, id = b.dataset.c;
  if (a === 'ppick') { S.pPick = i; S.phase = 'reveal'; i === RIGHT_ORDER ? sfx.good() : sfx.bad(); showStage(); }
  else if (a === 'pgo') { S.phase = 'build'; S.board = ['l', 'i', 'u', 'p', 'f', 'w', 'a']; stopRun(); sfx.click(); }
  else if (a === 'add') { S.board.push(id); stopRun(); sfx.snap(); }
  else if (a === 'rem') { S.board.splice(i, 1); stopRun(); sfx.tick(); }
  else if (a === 'up') { [S.board[i - 1], S.board[i]] = [S.board[i], S.board[i - 1]]; stopRun(); sfx.tick(); }
  else if (a === 'clear') { S.board = []; stopRun(); sfx.click(); }
  else if (a === 'run') { stopRun(); S.run.on = true; sfx.click(); showStage(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; if (S.sec !== 'ask') S.askV = 'all'; stopRun(); sfx.click();
  } else if (a === 'askv') { S.askV = b.dataset.k; stopRun(); sfx.click(); }
  else if (a === 'upick') { S.uPick = i; i === 2 ? sfx.good() : sfx.bad(); showStage(); }
  else if (a === 'utog') { if (!S.uChecked) { S.uSel[i] = !S.uSel[i]; sfx.tick(); } }
  else if (a === 'ucheck') { S.uChecked = true; (S.uSel.join() === 'false,true,true' ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'uagain') { S.uSel = [false, false, false]; S.uChecked = false; sfx.click(); }
  else if (a === 'rpick') { S.rPick = i; i === 1 ? sfx.good() : sfx.bad(); showStage(); }
  render();
});
$('slP').addEventListener('input', (ev) => { S.rTouched = true; S.price = clamp(+ev.target.value, 0, 10); render(); });
$('slR').addEventListener('input', (ev) => { S.rTouched = true; S.reps = clamp(+ev.target.value, 0, MAXR); render(); });

// --- render ----------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('secPitch').hidden = v !== 'pitch'; $('secPurpose').hidden = v !== 'purpose'; $('secPlan').hidden = v !== 'plan';
  if (v === 'pitch') renderPitch(t); else if (v === 'purpose') renderPurpose(t); else renderPlan(t);
}
const optsHtml = (list, pick, ok, act) => `<div class="pi-opts">${list.map((o, i) => `<button class="pi-opt${pick === null ? '' : i === ok ? ' good' : i === pick ? ' bad' : ''}" data-act="${act}" data-i="${i}"${pick === null ? '' : ' disabled'}>${esc(o)}</button>`).join('')}</div>`;
const orderNames = (o) => o.map((id) => T[lang].cards[id].n).join(' → ');
const fmtS = (s) => Math.round(s);

function renderPitch(t) {
  const p = t.pit, ph = S.phase, lim = limit(), tl = timeline(S.board), el = $('secPitch');
  lab.setGlow('rgba(224, 176, 80, .26)');
  if (ph === 'predict') {
    el.innerHTML = `<div class="pi-q">${esc(p.q)}</div>${optsHtml(p.opts, null, RIGHT_ORDER, 'ppick')}`;
    lab.setReadout('?', '', '', '#e0b050'); lab.setFacts([]);
    lab.setState({ emo: '🤔', title: p.q, lead: p.qLead, body: '', extra: '' });
    return;
  }
  if (ph === 'reveal') {
    const ok = S.pPick === RIGHT_ORDER;
    el.innerHTML = `<div class="pi-q">${esc(p.q)}</div>${optsHtml(p.opts, S.pPick, RIGHT_ORDER, 'ppick')}<div class="row2"><button class="btn" data-act="pgo">${esc(p.go)}</button></div>`;
    lab.setReadout(`${timeline(ORDERS[S.pPick], 'all').got}/5`, '', '', '#e0b050');
    lab.setFacts(t.pf);
    const lines = ORDERS.map((o, i) => `<div>${i + 1} · ${esc(orderNames(o))}: <b>${timeline(o, 'all').got}/5</b></div>`).join('');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? p.right : p.no, lead: p.lead, body: p.model, extra: lines });
    return;
  }
  // build
  const inBoard = new Set(S.board), hand = ['p', 'i', 'w', 'u', 'a', 'l', 'f'].filter((id) => !inBoard.has(id));
  const secChip = (k, emo) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`;
  el.innerHTML = `
    <div class="pi-h">${esc(p.hand)}</div>
    <div class="pi-hand">${hand.length ? hand.map((id) => `<button class="pi-card" style="--c:${COL[id]}" data-act="add" data-c="${id}">${ICON[id]} ${esc(t.cards[id].n)} <small>${fmtS(wordsOf(id) / WPS)} ${esc(t.s)}</small></button>`).join('') : '<span class="pi-empty">—</span>'}</div>
    <div class="pi-h">${esc(p.board)}</div>
    <div class="pi-board">${S.board.length ? S.board.map((id, i) => `<div class="pi-row"><span class="pi-n">${i + 1}</span><span class="pi-nm" style="--c:${COL[id]}">${ICON[id]} ${esc(t.cards[id].n)} <small>${fmtS(wordsOf(id) / WPS)} ${esc(t.s)}</small></span>
      <button class="pi-sb" data-act="up" data-i="${i}" aria-label="↑"${i === 0 ? ' disabled' : ''}>↑</button><button class="pi-sb" data-act="rem" data-i="${i}" aria-label="✕">✕</button></div>`).join('') : `<div class="pi-empty">${esc(p.empty)}</div>`}</div>
    <div class="row2"><button class="btn" data-act="run"${S.board.length ? '' : ' disabled'}>${esc(p.run)}</button><button class="chip pi-tog" data-act="clear">${esc(p.clear)}</button></div>
    <div class="row2">${secChip('elev', '🛗')}${secChip('ask', '🙋')}</div>
    ${S.sec === 'ask' ? `<div class="row2"><div class="chips">${ASK_KEYS.map((k) => `<button class="chip pi-tog ${S.askV === k ? 'on' : ''}" data-act="askv" data-k="${k}">${esc(t.askN[k])}</button>`).join('')}</div></div>` : ''}`;
  const shown = S.run.on || S.done ? Math.min(S.run.t, tl.total) : tl.total;
  lab.setReadout(`${fmtS(shown)} ${esc(t.s)}`, p.sub(tl.words), p.pill(lim), '#e0b050');
  lab.setFacts(t.pf);
  const script = S.board.length ? `<ol class="pi-st">${S.board.map((id) => `<li>${esc(cardText(id))}</li>`).join('')}</ol>` : '';
  const stat = p.stat(S.board.length, tl.words, fmtS(tl.total));
  if (S.run.on) {
    const cur = tl.items[Math.min(S.run.i, tl.items.length - 1)];
    lab.setState({ emo: cur ? ICON[cur.id] : '🎤', title: cur ? `${p.sayT}: ${t.cards[cur.id].n}` : p.sayT, lead: cur ? cardText(cur.id) : '', body: stat, extra: '' });
  } else if (S.done) {
    const lines = [];
    tl.items.forEach((it) => { if (it.st === 'lost') { const need = NEEDS[it.id].filter((n) => !tl.items.slice(0, tl.items.indexOf(it)).some((x) => x.id === n)); lines.push(it.id === 'a' && S.askV === 'vague' ? p.askBad : p.lost(t.cards[it.id].n, need.map((n) => t.cards[n].n).join(' + '))); } });
    REAL.forEach((id) => { if (!S.board.includes(id)) lines.push(p.missing(t.cards[id].n)); });
    const good = tl.got >= 5 && tl.total <= lim;
    lab.setState({ emo: good ? '🎉' : '🤔', title: good ? p.goodT : p.someT, lead: good ? p.good(fmtS(tl.total), lim) : `${p.got(tl.got)} ${tl.total <= lim ? p.inTime(fmtS(tl.total), lim) : p.over(fmtS(tl.total), lim)}`,
      body: '', extra: `${lines.map((x) => `<div>• ${esc(x)}</div>`).join('')}${script}` });
  } else if (S.sec === 'elev') {
    lab.setState({ emo: '🛗', title: t.elev.t, lead: t.elev.l, body: stat, extra: `<div class="fine">${esc(t.elev.src)}</div>${script}` });
  } else if (S.sec === 'ask') {
    lab.setState({ emo: '🙋', title: t.askS.t, lead: t.askS.l, body: stat, extra: script });
  } else {
    lab.setState({ emo: '🎤', title: p.buildT, lead: p.buildL, body: stat, extra: script });
  }
}

function renderPurpose(t) {
  const u = t.pur, el = $('secPurpose');
  lab.setGlow('rgba(217, 130, 95, .26)');
  const desc = `<ul class="pi-st">${u.desc.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>`;
  if (S.uPick === null) {
    el.innerHTML = `<div class="pi-q">${esc(u.q)}</div>${optsHtml(u.opts, null, 2, 'upick')}`;
    lab.setReadout('?', u.sub, '', '#d9825f'); lab.setFacts([]);
    lab.setState({ emo: '🧁', title: u.q, lead: u.qLead, body: '', extra: '' });
    return;
  }
  const ok = S.uPick === 2, good = S.uSel.join() === 'false,true,true';
  el.innerHTML = `<div class="pi-q">${esc(u.q)}</div>${optsHtml(u.opts, S.uPick, 2, 'upick')}
    <div class="pi-task">${esc(u.task)}</div>
    <div class="chips">${u.stalls.map((s, i) => `<button class="chip pi-tog ${S.uSel[i] ? 'on' : ''}" data-act="utog" data-i="${i}"${S.uChecked ? ' disabled' : ''}>${esc(s)}</button>`).join('')}</div>
    <div class="row2">${S.uChecked ? `<button class="btn ghost" data-act="uagain">${esc(u.again)}</button>` : `<button class="btn" data-act="ucheck">${esc(u.check)}</button>`}</div>`;
  lab.setReadout(eur(stallFlow(0).inc), `${CAKES} × ${eur(CAKE_P)}`, u.inc, '#d9825f');
  lab.setFacts(t.uf);
  const model = `<div class="fine">${esc(u.model(CAKES, eur(CAKE_P), eur(ING), eur(WAGE)))}</div>`;
  if (!S.uChecked) lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? u.right : u.no, lead: u.lead, body: u.task, extra: desc + model });
  else lab.setState({ emo: good ? '✅' : '🤔', title: good ? u.doneR : u.doneW, lead: u.doneL, body: u.doneB, extra: desc + model });
}

function renderPlan(t) {
  const l = t.pl, el = $('plQ'), n = planNums(), rev = S.rPick !== null;
  lab.setGlow('rgba(95, 168, 160, .26)');
  $('plPlay').hidden = !rev;
  if (!rev) {
    el.innerHTML = `<div class="pi-q">${esc(l.q)}</div>${optsHtml(l.opts, null, 1, 'rpick')}`;
    lab.setReadout('?', '', '', '#5fa8a0'); lab.setFacts([]);
    lab.setState({ emo: '🤔', title: l.q, lead: l.qLead, body: '', extra: '' });
    return;
  }
  el.innerHTML = '';
  $('lblP').textContent = l.price; $('lblR').textContent = l.reps;
  $('valP').textContent = eur(S.price); $('valR').textContent = String(S.reps);
  if ($('slP').value !== String(S.price)) $('slP').value = S.price;
  if ($('slR').value !== String(S.reps)) $('slR').value = S.reps;
  const reached = n.profit >= GOAL;
  $('goal').className = `pi-goal${reached ? ' ok' : ''}`; $('goal').textContent = reached ? `✓ ${l.goalOk}` : l.goal(eur(GOAL));
  const col = n.profit > 0 ? '#3ddc97' : n.profit < 0 ? '#ff8a80' : '#98A0B8';
  lab.setReadout(eur(n.profit), l.sub(eur(n.inc), eur(n.cost)), l.pill, col);
  lab.setFacts(t.rf);
  const be = S.price > PART ? TOOLS / (S.price - PART) : Infinity;
  const beTxt = be === Infinity ? l.beNo(eur(S.price)) : be > MAXR ? l.beFar(Math.ceil(be)) : l.beOk(Math.ceil(be), eur(S.price));
  const model = `<div class="fine">${esc(l.model)}</div>`;
  if (S.rPick !== null && !S.rTouched && S.price === 3 && S.reps === 20) {
    const ok = S.rPick === 1;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? l.right : l.no, lead: l.leadR(eur(n.inc), eur(n.cost), eur(n.profit)), body: l.leadT, extra: `<div>${esc(beTxt)}</div>${model}` });
    return;
  }
  if (reached) lab.setState({ emo: '🎉', title: l.goalT, lead: l.goalL(eur(n.profit)), body: l.leadR(eur(n.inc), eur(n.cost), eur(n.profit)), extra: `<div>${esc(beTxt)}</div>${model}` });
  else lab.setState({ emo: n.profit > 0 ? '📈' : n.profit < 0 ? '📉' : '⚖️', title: n.profit > 0 ? l.stP(eur(n.profit)) : n.profit < 0 ? l.stL(eur(-n.profit)) : l.stZ,
    lead: l.leadR(eur(n.inc), eur(n.cost), eur(n.profit)), body: beTxt, extra: model });
}
render();
</script>
</body>
