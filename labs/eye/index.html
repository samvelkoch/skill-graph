  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.beginPath(); c.roundRect(14, 70, 226, 310, 16); c.stroke();
  // the box
  const bx = 340, by = 140, bw = 310, bh = 270;
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 22; c.shadowOffsetY = 10;
  const bg = c.createLinearGradient(bx, by, bx + bw, by + bh); bg.addColorStop(0, '#323a66'); bg.addColorStop(1, '#161a33'); c.fillStyle = bg; c.beginPath(); c.roundRect(bx, by, bw, bh, 14); c.fill(); c.restore();
  c.strokeStyle = '#0b0d1b'; c.lineWidth = 2; c.beginPath(); c.roundRect(bx, by, bw, bh, 14); c.stroke();
  const ig = c.createLinearGradient(0, by + 14, 0, by + bh - 14); ig.addColorStop(0, '#0b0e1f'); ig.addColorStop(1, '#05060d'); c.fillStyle = ig; c.fillRect(364, by + 14, 276, bh - 28);
  // the picture on the paper makes the inside glow
  const glow = c.createRadialGradient(PH.cardCx, PH.hy, 10, PH.cardCx, PH.hy, 150); glow.addColorStop(0, `rgba(255,214,140,${0.22 * b})`); glow.addColorStop(1, 'rgba(255,214,140,0)');
  c.fillStyle = glow; c.fillRect(364, by + 14, 276, bh - 28);
  // front wall with the hole
  const wg = c.createLinearGradient(bx, 0, bx + 24, 0); wg.addColorStop(0, '#3c4577'); wg.addColorStop(1, '#232949');
  c.fillStyle = wg; c.fillRect(bx, by, 24, PH.hy - g / 2 - by); c.fillRect(bx, PH.hy + g / 2, 24, by + bh - PH.hy - g / 2);
  c.strokeStyle = '#0b0d1b'; c.lineWidth = 1.5; c.strokeRect(bx, by, 24, PH.hy - g / 2 - by); c.strokeRect(bx, PH.hy + g / 2, 24, by + bh - PH.hy - g / 2);
  c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(bx + 14, by + 1.5); c.lineTo(bx + bw - 14, by + 1.5); c.stroke();
  c.fillStyle = '#07091a'; c.fillRect(bx - 1, PH.hy - g / 2, 26, g);
  // light beams from the roof and from the foot of the house
  c.save(); c.beginPath(); c.rect(0, 0, 640, 440); c.clip();
  for (const O of [[PH.ox, 226], [PH.ox, 330]]) beam(c, O, g, S.lens);
  c.restore();
  // a lens in the hole
  if (S.lens) {
    const th = clamp(g * 0.2, 3, 9), hl = g / 2 + 1;
    c.fillStyle = '#9aa5d6'; c.fillRect(PH.hx - 4, PH.hy - hl - 4, 8, 4); c.fillRect(PH.hx - 4, PH.hy + hl, 8, 4);
    c.beginPath(); c.moveTo(PH.hx, PH.hy - hl); c.quadraticCurveTo(PH.hx - 2 * th, PH.hy, PH.hx, PH.hy + hl); c.quadraticCurveTo(PH.hx + 2 * th, PH.hy, PH.hx, PH.hy - hl); c.closePath();
    const lg = c.createLinearGradient(PH.hx - th, 0, PH.hx + th, 0); lg.addColorStop(0, 'rgba(255,255,255,.75)'); lg.addColorStop(.5, 'rgba(207,233,255,.45)'); lg.addColorStop(1, 'rgba(160,205,245,.6)');
    c.fillStyle = lg; c.fill(); c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 1.8; c.stroke();
  }
  // tracing paper at the back, with the upside-down picture
  const cx0 = PH.cardX, cy0 = PH.cardY, cw = PH.cardW, ch = PH.cardH;
  c.fillStyle = '#1a2034'; c.beginPath(); c.roundRect(cx0, cy0, cw, ch, 8); c.fill();
  c.save(); c.beginPath(); c.roundRect(cx0, cy0, cw, ch, 8); c.clip();
  const N = spread < 0.4 ? 1 : 13, pa = 1 - Math.pow(1 - b, 1 / N), offs = [[0, 0]];
  for (let i = 0; i < 6; i++) offs.push([Math.cos(i / 6 * TAU) * spread * 0.5, Math.sin(i / 6 * TAU) * spread * 0.5], [Math.cos((i + .5) / 6 * TAU) * spread, Math.sin((i + .5) / 6 * TAU) * spread]);
  c.globalAlpha = N === 1 ? b : pa;
  for (let i = 0; i < N; i++) {
    c.save(); c.translate(PH.cardCx + offs[i][0], PH.hy + offs[i][1]); c.rotate(Math.PI); c.scale(PH.m, PH.m); c.translate(-140, -PH.hy);
    c.drawImage(WORLD, -60, 0, 480, 440); c.restore();
  }
  c.globalAlpha = 1;
  const pg = c.createLinearGradient(cx0, cy0, cx0 + cw, cy0 + ch); pg.addColorStop(0, 'rgba(255,255,255,.14)'); pg.addColorStop(1, 'rgba(255,255,255,.04)'); c.fillStyle = pg; c.fillRect(cx0, cy0, cw, ch);
  c.restore();
  c.strokeStyle = 'rgba(225,230,245,.6)'; c.lineWidth = 2; c.beginPath(); c.roundRect(cx0, cy0, cw, ch, 8); c.stroke();
  c.restore();
}

// --- loop ----------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h; c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'inside') drawInside(c, w, h, dt, time); else if (v === 'pupil') drawPupilFront(c, w, h, dt, time); else drawPinhole(c, w, h, dt, time);
  readout();
});

// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function reveal(v, i) {
  S.ans[v] = i; S.t0[v] = nowS();
  (i === RIGHT[v] ? sfx.good : sfx.bad)();
  if (v === 'pupil') S.pAnim = true; else if (v === 'pinhole') S.hAnim = true; else { S.part = null; }
  render(); showStage();
}
function onView() { S.blind = false; render(); }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'ans') { reveal(lab.view, +b.dataset.i); return; }
  if (act === 'part') { S.part = S.part === b.dataset.k ? null : b.dataset.k; sfx.tick(); }
  else if (act === 'lens') { S.lens = !S.lens; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'a') S.blind = !S.blind; else S.cat = !S.cat;
    sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, val = +ev.target.value;
  if (id === 'ey-dist') { S.d = val / 100; S.moved = true; }
  else if (id === 'ey-light') { S.ls = val / 100; S.pAnim = false; }
  else if (id === 'ey-hole') { const old = Math.round(S.hole); S.hole = val / 10; S.hAnim = false; if (Math.round(S.hole) !== old) sfx.tick(); }
  readout();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'inside' || S.ans.inside === null || S.blind || !geo) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - geo.ox) / geo.s, y = (ev.clientY - r.top - geo.oy) / geo.s;
  if (x > 245 || y < 130 || y > 340) return;
  dragging = true; grab = { x, d: S.d }; try { $('cv').setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
});
$('cv').addEventListener('pointermove', (ev) => {
  if (!dragging || !geo) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - geo.ox) / geo.s;
  S.d = clamp(grab.d + (grab.x - x) / 90, 0, 1); S.moved = true; $('ey-dist').value = String(Math.round(S.d * 100)); readout();
});
const endDrag = () => { dragging = false; };
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag);

// --- readout, state card, controls: one render per change -------------------------------------------------------------
function readout() {
  const t = T[lang], v = lab.view, asking = S.ans[v] === null;
  let val = '?', sub = '', pill_ = '', col = '#c0577d';
  if (v === 'inside') {
    if (S.blind) val = t.secrets.a[0];
    else if (!asking) { val = t.upside; sub = t.retinaVal; pill_ = S.d < 0.5 ? t.near : t.far; }
  } else if (v === 'pupil') {
    col = '#3f7a52';
    const li = clamp(Math.round(S.lsV), 0, 3);
    if (!asking) { if (S.cat) { val = '🐱'; sub = t.levels[li]; } else { val = `${Math.round(S.pm)} ${t.mm}`; sub = t.pupilSub; pill_ = t.levels[li]; } }
  } else {
    col = '#d9733f';
    if (!asking) {
      const mm = S.hole, b = S.lens ? 1 : 0.12 + 0.88 * Math.pow(clamp01((mm - 1) / 7), 1.15);
      val = `${Math.round(mm)} ${t.mm}`; sub = t.hole; pill_ = `${b >= 0.5 ? t.bright : t.dim} · ${S.lens || mm <= 3 ? t.sharp : t.blurry}`;
    }
  }
  const key = [val, sub, pill_, col, lang].join('|');
  if (key === S.ro) return;
  S.ro = key; lab.setReadout(esc(val), sub, pill_, col);
}
function render() {
  const t = T[lang], v = lab.view, asking = S.ans[v] === null, pf = PFX[v];
  document.body.dataset.v = v; S.ro = '';
  ['inside', 'pupil', 'pinhole'].forEach((k) => { $('ey-c-' + k).style.display = k === v && !asking ? 'block' : 'none'; });
  if (asking) $('ey-ask').innerHTML = `<div class="ey-q">${esc(t[pf + 'Ask'])}</div><div class="ey-opts">${t[pf + 'Opts'].map((o, i) => `<button class="chip ey-chip" data-act="ans" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  else {
    const ok = S.ans[v] === RIGHT[v];
    $('ey-ask').innerHTML = `<div class="ey-opts ey-done">${t[pf + 'Opts'].map((o, i) => `<button class="chip ey-chip ${i === RIGHT[v] ? 'ey-ok' : i === S.ans[v] ? 'ey-no' : 'ey-off'}" disabled>${esc(o)}</button>`).join('')}</div>
      <div class="ey-verdict ${ok ? 'ok' : 'no'}">${esc(t[pf + (ok ? 'Right' : 'Wrong')])}</div>`;
  }
  $('ey-l-dist').textContent = t.distance; $('ey-l-light').textContent = t.light; $('ey-l-hole').textContent = t.hole;
  $('ey-dist').setAttribute('aria-label', t.distance); $('ey-light').setAttribute('aria-label', t.light); $('ey-hole').setAttribute('aria-label', t.hole);
  $('ey-lensb').textContent = S.lens ? t.lensOut : t.lensIn;
  $('ey-parts').innerHTML = Object.keys(t.parts).map((k) => `<button class="chip ey-chip ${S.part === k ? 'on' : ''}" data-act="part" data-k="${k}">${esc(t.parts[k])}</button>`).join('');
  const open = secret.unlocked();
  $('ey-sec-a').innerHTML = `<button class="chip ey-chip secret ${open ? 'open' : ''} ${S.blind ? 'on' : ''}" data-act="sec" data-k="a">${open ? '🕳️ ' + esc(t.secrets.a[0]) : '🔒 ???'}</button>`;
  $('ey-sec-b').innerHTML = `<button class="chip ey-chip secret ${open ? 'open' : ''} ${S.cat ? 'on' : ''}" data-act="sec" data-k="b">${open ? '🐱 ' + esc(t.secrets.b[0]) : '🔒 ???'}</button>`;
  lab.setGlow(v === 'inside' ? 'rgba(228,138,138,.28)' : v === 'pupil' ? 'rgba(91,140,90,.3)' : 'rgba(255,170,90,.26)');
  if (asking) { lab.setState({ emo: '🤔', title: t[pf + 'Ask'], lead: '', body: '' }); lab.setFacts([]); }
  else if (v === 'inside' && S.blind) { lab.setState({ emo: '🕳️', title: t.secrets.a[0], lead: t.blindText, body: '' }); lab.setFacts([]); }
  else if (v === 'pupil' && S.cat) { lab.setState({ emo: '🐱', title: t.secrets.b[0], lead: t.catText, body: '' }); lab.setFacts([]); }
  else { const st = t.st[v]; lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3] }); lab.setFacts(t.facts[v]); }
  readout();
}
render();
</script>
