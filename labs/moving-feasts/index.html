function sprites(y) {

  render();
});
$('scrub').addEventListener('input', (ev) => { S.scT = +ev.target.value; S.sc = S.scT; });
$('rScrub').addEventListener('input', (ev) => { S.ramT = +ev.target.value; S.play = false; render(); });

// --- one render per change: controls, readout and the state card ---------------------------------------------------------------
const predHtml = (act, opts, chosen, right) => opts.map(([k, l]) => {
  let cls = 'fe-btn'; if (chosen != null) { if (k === right) cls += ' good'; else if (k === chosen) cls += ' bad'; }
  return `<button class="${cls}" data-act="${act}" data-k="${k}"${chosen != null ? ' disabled' : ''}>${esc(l)}</button>`;
}).join('');
function render() {
  const v = lab.view; document.body.dataset.v = v;
  $('sSort').hidden = v !== 'sort'; $('sEaster').hidden = v !== 'easter'; $('sYears').hidden = v !== 'years';
  if (v === 'sort') rSort(); else if (v === 'easter') rEaster(); else rYears();
}

function rSort() {
  const t = T[lang], q = t.v1, n = HOL.length, k = HOL.filter((h) => S.guess[h.id]).length, all = k === n;
  lab.setGlow('rgba(110, 160, 210, .28)');
  $('holChips').innerHTML = HOL.map((h) => {
    let cls = 'fe-hol'; if (S.checked) cls += (S.guess[h.id] === 'move') === h.moves ? ' good' : ' bad'; else if (S.guess[h.id]) cls += ' ' + S.guess[h.id];
    if (S.sel === h.id) cls += ' sel';
    return `<button class="${cls}" data-act="sel" data-id="${h.id}" aria-label="${esc(t.hol[h.id][0])}">${h.emo}${h.j ? '<i class="fe-j">J</i>' : ''}</button>`;
  }).join('');
  $('sortQ').hidden = S.checked || !S.sel; $('sortQ').textContent = q.q;
  $('sortBtns').hidden = S.checked || !S.sel;
  const [bs, bm] = $('sortBtns').children; bs.textContent = q.stay; bm.textContent = q.move;
  const g = S.sel && S.guess[S.sel]; bs.classList.toggle('on', g === 'stay'); bm.classList.toggle('on', g === 'move');
  $('chkB').hidden = S.checked; $('chkB').disabled = !all; $('chkB').textContent = q.check;
  $('y1V').parentElement.hidden = !S.checked; $('y1V').textContent = S.year;
  document.querySelectorAll('[data-act="y1-"]').forEach((b) => { b.disabled = S.year <= 2025; }); document.querySelectorAll('[data-act="y1+"]').forEach((b) => { b.disabled = S.year >= 2035; });
  $('againB').hidden = !S.checked; $('againB').textContent = q.again;
  $('sortNav').hidden = !S.checked && !all;
  if (!S.checked) {
    lab.setReadout(`${k}/${n}`, q.sorted, '', '#6fa0d6'); lab.setFacts([]);
    if (S.sel) lab.setState({ emo: HBY[S.sel].emo, title: t.hol[S.sel][0], lead: t.hol[S.sel][1], body: q.q, extra: '' });
    else lab.setState({ emo: '🗓️', title: q.t0, lead: q.l0, body: q.b0(n), extra: '' });
  } else {
    const ok = HOL.filter((h) => (S.guess[h.id] === 'move') === h.moves).length;
    lab.setReadout(String(S.year), q.yr, q.pill(ok, n), '#6fa0d6');
    lab.setFacts(q.facts.map(([emo, text, src]) => ({ emo, text, src })));
    if (S.sel) {
      const h = HBY[S.sel], dates = h.f(S.year), good = (S.guess[h.id] === 'move') === h.moves;
      const all_ = YEARS.flatMap((yy) => h.f(yy)).map((ms) => { const d = new Date(ms); return [d.getUTCMonth(), d.getUTCDate()]; }).sort((a, b) => a[0] * 100 + a[1] - (b[0] * 100 + b[1]));
      const lo = all_[0], hi = all_[all_.length - 1];
      lab.setState({ emo: h.emo, title: `${t.hol[h.id][0]}: ${dates.map((ms) => fmt(ms)).join(' · ')}`, lead: `${good ? t.right : t.no} ${h.moves ? q.moveTxt(md(...lo), md(...hi), YEARS.length) : q.stayTxt(md(...lo))}`, body: t.hol[h.id][1], extra: h.id === 'eid' ? esc(q.eid) : '' });
    } else lab.setState({ emo: '🔁', title: q.ft, lead: q.fl, body: q.fb(YEARS.length), extra: '' });
  }
}

function eventsSecret(t) { // state card of the two secret experiments
  const rows = YEARS.map((y) => ({ y, w: westEaster(y), o: orthEaster(y) }));
  if (S.sec === 'twins') {
    const tw = rows.filter((r) => r.w === r.o).map((r) => r.y), gaps = [...new Set(rows.map((r) => Math.round((r.o - r.w) / DAY / 7)).filter((g) => g > 0))].sort((a, b) => a - b);
    lab.setReadout(tw.join(', '), '', '', '#e9b64a');
    lab.setState({ emo: '👯', title: t.v2.twinsT, lead: t.v2.twinsL(tw.join(', ')), body: t.v2.twinsB(gaps.join(', ')), extra: '' });
  } else {
    lab.setReadout(`${md(2, 22)} – ${md(3, 25)}`, '', '', '#ffd166');
    lab.setState({ emo: '📏', title: t.v2.edgesT, lead: t.v2.edgesL, body: t.v2.edgesB(fmt(westEaster(EXT.lo.y)).replace(/ \d{4}$/, ''), fmt(westEaster(EXT.hi.y)).replace(/ \d{4}$/, ''), YEARS[0], YEARS[YEARS.length - 1], EXT.nextLo, EXT.nextHi), extra: '' });
  }
}
function rEaster() {
  const t = T[lang], q = t.v2, y = S.y2, u = secret.unlocked();
  lab.setGlow('rgba(110, 190, 130, .26)');
  $('y2V').textContent = y;
  document.querySelectorAll('[data-act="y2-"]').forEach((b) => { b.disabled = y <= 2025; }); document.querySelectorAll('[data-act="y2+"]').forEach((b) => { b.disabled = y >= 2034; });
  const done = S.ph === 'done';
  $('e2Q').hidden = S.ph !== 'guess'; $('e2Q').textContent = q.q(y + 1, y);
  $('e2Pred').hidden = S.ph !== 'guess'; $('e2Pred').innerHTML = predHtml('p2', [['earlier', q.earlier], ['later', q.later], ['same', q.same]], null, null);
  $('e2Next').hidden = !done; $('e2NextB').textContent = q.next;
  $('e2Sec').innerHTML = ['twins', 'edges'].map((k, i) => `<button class="fe-btn sec ${u ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}"${done || !u ? '' : ' disabled'} title="${done || !u ? '' : esc(q.gate)}">${u ? `${['👯', '📏'][i]} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (S.sec && done) { eventsSecret(t); lab.setFacts([]); return; }
  S.sec = null;
  const ex = westEaster(y), nx = westEaster(y + 1);
  if (S.ph === 'guess') {
    lab.setReadout(esc(fmt(ex)), q.sub(y), '', '#9be39b'); lab.setFacts([]);
    lab.setState({ emo: '🐣', title: q.exT(y, fmt(ex, true)), lead: q.rule, body: q.q(y + 1, y), extra: '' });
  } else if (S.ph === 'moon' || S.ph === 'sun') {
    lab.setReadout('?', q.sub(y + 1), '', '#9be39b'); lab.setFacts([]);
    const moon = S.ph === 'moon';
    lab.setState({ emo: moon ? '🌕' : '📅', title: moon ? q.moonT : q.sunT, lead: S.msg || (moon ? q.moonL : q.sunL), body: moon ? q.moonB(q.guessTxt[S.p2]) : q.sunB, extra: '' });
  } else {
    const d = eDelta(y), dir = d < 0 ? 'earlier' : 'later', ok = S.p2 === dir, n = Math.abs(d);
    lab.setReadout(esc(fmt(nx)), q.sub(y + 1), dir === 'earlier' ? q.dirE(n, y) : q.dirL(n, y), '#9be39b');
    lab.setFacts(q.facts.map(([emo, text, src]) => ({ emo, text, src })));
    lab.setState({ emo: '🐣', title: q.doneT(y + 1, fmt(nx, true)), lead: q.doneL(ok, dir === 'earlier' ? q.dirE(n, y) : q.dirL(n, y)), body: q.doneB, extra: '' });
  }
  // the predict buttons are gone after the guess, so show the right answer on the picture only (above)
}
function rYears() {
  const t = T[lang], q = t.v3;
  $('calSeg').innerHTML = ['jul', 'east', 'ram'].map((k) => `<button data-act="cal" data-k="${k}" class="${S.cal === k ? 'on' : ''}">${esc(q.seg[k])}</button>`).join('');
  $('pJul').hidden = S.cal !== 'jul'; $('pEast').hidden = S.cal !== 'east'; $('pRam').hidden = S.cal !== 'ram';
  if (S.cal === 'jul') {
    lab.setGlow('rgba(233, 182, 74, .24)');
    $('jQ').textContent = q.jB0; $('jQ').hidden = !!S.pj;
    $('jPred').innerHTML = predHtml('pj', [['25', fmt(U(2025, 11, 25))], ['1', fmt(U(2026, 0, 1))], ['7', fmt(U(2026, 0, 7))]], S.pj, '7');
    $('jPred').hidden = !!S.pj;
    $('scrub').setAttribute('aria-label', q.scrub);
    if (!S.pj) { lab.setReadout('?', q.jSub, '', '#e9b64a'); lab.setFacts([]); lab.setState({ emo: '📅', title: q.jT0, lead: q.jL0, body: q.jB0, extra: '' }); }
    else { lab.setReadout(esc(q.nDays(13)), q.jSub, '', '#e9b64a'); lab.setFacts(q.factsJ.map(([emo, text, src]) => ({ emo, text, src }))); lab.setState({ emo: '🎄', title: q.jT, lead: q.jL(S.pj === '7'), body: q.jB, extra: '' }); }
  } else if (S.cal === 'east') {
    lab.setGlow('rgba(110, 190, 130, .24)');
    const y = S.ye, g = S.pe[y], same = westEaster(y) === orthEaster(y);
    $('yeV').textContent = y;
    document.querySelectorAll('[data-act="ye-"]').forEach((b) => { b.disabled = y <= 2025; }); document.querySelectorAll('[data-act="ye+"]').forEach((b) => { b.disabled = y >= 2035; });
    $('eQ').textContent = q.eB0; $('eQ').hidden = !!g;
    $('eaPred').innerHTML = predHtml('pe', [['same', q.same], ['diff', q.diff]], g, same ? 'same' : 'diff');
    if (!g) { lab.setReadout(esc(fmt(westEaster(y))), q.eSub(y), '', '#9be39b'); lab.setFacts([]); lab.setState({ emo: '🐣', title: q.eT0(y, fmt(westEaster(y), true)), lead: q.eL0, body: q.eB0, extra: '' }); }
    else {
      const n = Math.round((orthEaster(y) - westEaster(y)) / DAY / 7), ok = (g === 'same') === same;
      const matches = YEARS.filter((yy) => westEaster(yy) === orthEaster(yy)).join(', ');
      lab.setReadout(esc(q.eVal(n)), q.eSub(y), '', same ? '#3ddc97' : '#e9b64a');
      lab.setFacts(q.factsE.map(([emo, text, src]) => ({ emo, text, src })));
      lab.setState({ emo: '🐣', title: same ? q.eTs(fmt(westEaster(y), true)) : q.eTd(y, fmt(orthEaster(y), true)), lead: same ? q.eLs(ok) : q.eLd(ok, n), body: q.eB(matches), extra: '' });
    }
  } else {
    lab.setGlow('rgba(127, 224, 208, .22)');
    const right = SEAS_KEY[seasonOf(RAM[RAM.length - 1])];
    $('rQ').textContent = q.rB0; $('rQ').hidden = !!S.pr;
    $('rPred').innerHTML = predHtml('pr', [['spring', q.sp], ['summer', q.su], ['autumn', q.au]], S.pr, right); $('rPred').hidden = !!S.pr;
    $('rCtl').hidden = !S.pr; $('rScrub').parentElement.hidden = !S.pr; $('rScrub').disabled = !S.pr; $('rScrub').setAttribute('aria-label', q.years);
    $('playB').textContent = S.play ? q.pause : S.ramT >= RAM.length - 1 ? q.replay : q.play;
    $('addEB').textContent = q.addE; $('addEB').classList.toggle('on', S.addE);
    if (!S.pr) {
      lab.setReadout(esc(fmt(RAM[0], true)), q.rSub, `${SEAS_EMO[seasonOf(RAM[0])]} ${t.seas[seasonOf(RAM[0])]}`, '#7fe0d0'); lab.setFacts([]);
      lab.setState({ emo: '🌙', title: q.rT0, lead: q.rL0(fmt(RAM[0])), body: q.rB0, extra: '' });
    } else {
      const ok = S.pr === right, lastS = seasonOf(RAM[RAM.length - 1]);
      ramReadout(); lab.setFacts(q.factsR.map(([emo, text, src]) => ({ emo, text, src })));
      lab.setState({ emo: '🌙', title: q.rT, lead: q.rL(ok, fmt(RAM[RAM.length - 1]), t.seas[lastS]), body: q.rB, extra: '' });
    }
  }
}
render();
</script>
