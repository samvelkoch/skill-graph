let rafId = 0;
const ease = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
function tween(dur, step, done) {
  cancelAnimationFrame(rafId);
  const t0 = performance.now();
  const f = (now) => { const p = clamp((now - t0) / dur, 0, 1); step(ease(p)); if (p < 1) rafId = requestAnimationFrame(f); else if (done) done(); };
  rafId = requestAnimationFrame(f);
}

  return [lerp(0, cx - 54, z), lerp(0, cy - 45, z), lerp(360, 108, z), lerp(300, 90, z)].map((n) => n.toFixed(2)).join(' ');
};
function sceneStone() {
  const r = rng(S.seed), asking = S.tapped === null;
  const inGroup = (x, yc) => [0, 1, 2, 3].some((i) => { const g = gpos(i); return yc > g.y - 4 && yc < g.y + 30 && x + 10 > g.x - 4 && x < g.x + 88; });
  let s = `<rect x="-200" y="-200" width="760" height="700" fill="url(#rsBg)" class="rs-nopt"/><path d="M110 -40H250L350 300H10Z" fill="url(#rsCone)" class="rs-nopt"/>`;
  s += `<g filter="url(#rsSh)" class="rs-nopt"><path d="${STONE}" fill="url(#rsStone)" stroke="#12151a" stroke-width="2"/></g><path d="${STONE}" fill="url(#rsSheen)" class="rs-nopt"/>`;
  s += '<g clip-path="url(#rsClip)">';
  for (const [k, b] of Object.entries(BANDS)) {
    s += `<rect x="56" y="${b.y}" width="252" height="${b.h}" rx="6" fill="url(#rsBand)" stroke="#2a2e34" stroke-width="1.5" data-act="band" data-b="${k}"/>`
      + `<rect x="57" y="${b.y + 1}" width="250" height="${b.h - 2}" rx="5" fill="none" stroke="rgba(255,255,255,.1)" class="rs-nopt"/>`;
  }
  // hieroglyph band: rows of tiny signs, groups, broken edges
  s += '<g class="rs-nopt" style="color:#161a1f;--gd:#6a7078" opacity=".72">';
  for (const yc of [37, 62, 98, 122]) {
    for (let x = 60; x < 304; x += 12.5) {
      if ((yc === 62 || yc === 98) && inGroup(x, yc)) continue;
      s += glyph(SIGN_KEYS[Math.floor(r() * SIGN_KEYS.length)], x, yc - 5, 10);
    }
  }
  s += '</g>';
  for (let i = 0; i < 4; i++) {
    const g = gpos(i), isR = i === S.right, show = !asking && isR;
    const list = isR ? NAMES[0].signs : Array.from({ length: 5 + Math.floor(r() * 3) }, () => SIGN_KEYS[Math.floor(r() * SIGN_KEYS.length)]);
    const bad = !asking && S.tapped === i && !isR;
    if (asking) s += `<rect class="rs-grp rs-nopt" x="${g.x}" y="${g.y}" width="84" height="26" rx="7" fill="rgba(255,205,90,.16)" stroke="#f2c14e" stroke-width="1.4"/>`;
    else if (bad) s += `<rect class="rs-nopt" x="${g.x}" y="${g.y}" width="84" height="26" rx="7" fill="rgba(224,96,90,.18)" stroke="#e0605a" stroke-width="1.4" stroke-dasharray="3 3"/>`;
    if (show) s += `<ellipse class="rs-nopt" cx="${g.x + 42}" cy="${g.y + 13}" rx="64" ry="30" fill="url(#rsGlow)" opacity=".55"/>`;
    s += `<g class="rs-nopt" style="color:${show ? '#f6e2a8' : '#161a1f'};--gd:${show ? '#7a5a18' : '#6a7078'}" opacity="${asking || show || bad ? .85 : .5}">`;
    list.forEach((sg, j) => { s += glyph(sg, g.x + 3 + j * 11, g.y + 7.5, 10.5); });
    s += '</g>';
  }
  // broken edges (exposed rough stone)
  s += '<g class="rs-nopt" fill="#383d44" stroke="#15181d" stroke-width="1.2" stroke-linejoin="round">'
    + '<path d="M56 28L120 28L112 40L100 44L88 60L70 68L56 94Z"/><path d="M308 28L284 28L290 50L282 66L292 90L286 108L296 132L308 132Z"/><path d="M200 132L212 120L228 126L236 132Z"/></g>';
  // demotic band: flowing lines
  s += '<g class="rs-nopt" fill="none" stroke="#161a1f" stroke-width="1.3" stroke-linecap="round" opacity=".68">';
  for (const y of [153, 165, 177, 189]) {
    let d = `M62 ${y}`, x = 62;
    while (x < 296) { const dx = 5 + r() * 9; if (r() < .12) { x += 7; d += ` M${x.toFixed(1)} ${y}`; continue; } d += ` q${(dx / 2).toFixed(1)} ${(-(2 + r() * 4)).toFixed(1)} ${dx.toFixed(1)} 0`; x += dx; }
    s += `<path d="${d}"/>`;
  }
  s += '</g>';
  // greek band: tiny letters
  const LET = ['M0 6V0', 'M0 6L2.5 0L5 6', 'M0 0H5M1 0V6M4 0V6', 'M0 0V6M0 0Q5 0 5 3Q5 6 0 6', 'M0 3H5M0 0V6M5 0V6', 'M0 0L5 6M5 0L0 6', 'M2.5 0a2.5 3 0 1 0 .01 0', 'M0 6V0H5'];
  s += '<g class="rs-nopt" fill="none" stroke="#161a1f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".7">';
  for (const y of [213, 224, 235, 246, 257]) {
    let x = 62;
    while (x < 298) { if (r() < .16) x += 7; const k = LET[Math.floor(r() * LET.length)]; s += `<path transform="translate(${x.toFixed(1)} ${y})" d="${k}"/>`; x += 7.5; }
  }
  s += '</g></g>';
  // labels
  s += `<g id="rsPills" class="rs-nopt" style="opacity:${clamp(1 - S.zt * 3, 0, 1)}">`;
  const t = T[lang];
  const gold = { bg: 'rgba(60,40,6,.88)', border: 'rgba(255,214,102,.6)', color: '#ffeab0', size: 13.5 };
  s += pill(t.pill.hier + (S.opened.hier ? ' ✓' : ''), 302, 124, { anchor: 'r' });
  s += pill(t.pill.demo + (S.opened.demo ? ' ✓' : ''), 302, 190, { anchor: 'r' });
  s += pill(t.pill.greek + (S.opened.greek ? ' ✓' : ''), 302, 263, { anchor: 'r' });
  s += pill('ΠΤΟΛΕΜΑΙΟΣ', 130, 236, gold);
  s += '</g>';
  // hit areas of the four groups (on top)
  if (asking) for (let i = 0; i < 4; i++) { const g = gpos(i); s += `<rect class="rs-hit" x="${g.x - 6}" y="${g.y - 6}" width="96" height="38" data-act="grp" data-g="${i}" role="button" aria-label="${i + 1}"/>`; }
  // the cartouche around Ptolemy's name
  if (!asking) {
    const g = gpos(S.right);
    s += `<g class="rs-nopt"><rect x="${g.x - 6}" y="${g.y - 4}" width="96" height="34" rx="17" fill="none" stroke="#f2c14e" stroke-width="2.4" pathLength="1" class="${S.fresh ? 'rs-draw' : ''}" ${S.fresh ? '' : 'stroke-dasharray="none"'}/>`
      + `<rect x="${g.x + 84}" y="${g.y + 1}" width="2.8" height="24" rx="1.4" fill="#f2c14e"/></g>`;
  }
  return s;
}

// --- view 2: two names ----------------------------------------------------------------------------------------
const SP = 34;
function sceneNames() {
  const t = T[lang], res = S.res, asking = !res && S.step < TASKS.length;
  let s = tablet(276);
  NAMES.forEach((nm, bi) => {
    const by = bi ? 150 : 10, cy = by + 26, n = nm.signs.length;
    s += capPill(`${t.nm[nm.id]} · ${nm.letters.map(lt).join(' ')}`, by + 11);
    s += cart(6, cy, n * SP + 40, 58);
    nm.signs.forEach((sg, i) => {
      const x = 18 + i * SP, lit = !!res && sg === res.task, bad = !!res && !res.ok && res.n === bi && res.i === i;
      s += signG(sg, x + SP / 2, cy + 29, 30, { lit, bad });
      s += slot(x + 2, cy + 64, SP - 4, S.found.has(sg) ? lt(nm.letters[i]) : '');
      if (asking) s += `<rect class="rs-hit" x="${x}" y="${cy}" width="${SP}" height="90" data-act="cell" data-n="${bi}" data-i="${i}" role="button" aria-label="${esc(t.signs[sg])}"/>`;
    });
  });
  return s;
}
function placesOf(task) {
  return NAMES.map((nm) => nm.signs.map((sg, i) => (sg === task ? i + 1 : 0)).filter(Boolean).join(', '));
}

// --- view 3: your name -----------------------------------------------------------------------------------------
function tokens() {
  const out = [];
  for (const ch of S.name) {
    const sg = signsOf(ch) || [];
    if (sg.length === 1) out.push({ sg: sg[0], label: ch });
    else sg.forEach((k) => out.push({ sg: k, label: lt(SND[k]) }));
  }
  return out;
}
function sceneYours() {
  const tk = tokens(), n = tk.length;
  let s = tablet(276);
  s += capPill(S.name.length ? S.name.join('') : '…', 40);
  const sp = n ? Math.min(40, 308 / n) : 40, size = Math.min(38, sp - 4), w = Math.max(120, n * sp + 40), x0 = 180 - w / 2, cy = 90;
  s += cart(x0, cy, w, 66);
  tk.forEach((k, i) => {
    const cx = x0 + 12 + i * sp + sp / 2;
    s += signG(k.sg, cx, cy + 33, size, { pop: S.pop && i === n - 1 });
    s += slot(cx - Math.min(15, sp / 2 - 1), cy + 74, Math.min(30, sp - 2), k.label);
  });
  if (!n) s += `<text class="rs-nopt" x="180" y="${cy + 34}" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="900" fill="#b8924d" opacity=".7">?</text>`;
  return s;
}

// --- secret a: a new name --------------------------------------------------------------------------------------
function sceneAlex() {
  const t = T[lang], solved = S.read.size >= ALEX.signs.length;
  let s = tablet(276);
  s += capPill(solved ? `${t.nm.A} · ${ALEX.letters.map(lt).join(' ')}` : '? ? ? ? ? ? ? ? ?', 22);
  const cy = 44, n = ALEX.signs.length;
  s += cart(6, cy, n * SP + 40, 58);
  ALEX.signs.forEach((sg, i) => {
    const x = 18 + i * SP;
    s += signG(sg, x + SP / 2, cy + 29, 30, { lit: S.read.has(i) && !solved });
    s += slot(x + 2, cy + 64, SP - 4, S.read.has(i) ? lt(ALEX.letters[i]) : '');
    if (!solved) s += `<rect class="rs-hit" x="${x}" y="${cy}" width="${SP}" height="90" data-act="rd" data-i="${i}" role="button" aria-label="${esc(t.signs[sg])}"/>`;
  });
  s += `<rect class="rs-nopt" x="14" y="166" width="332" height="96" rx="16" fill="rgba(90,58,14,.16)" stroke="#9c7a3c" stroke-width="1.2"/>`;
  s += pill(t.sa.key, 180, 180, { bg: 'rgba(54,34,10,.86)', border: 'rgba(255,220,140,.5)', color: '#fff0c8', size: 13.5 });
  [['S', 66], ['N', 180], ['D', 294]].forEach(([k, cx]) => {
    s += signG(k, cx - 26, 224, 42);
    s += `<text class="rs-nopt" x="${cx + 4}" y="224" dominant-baseline="central" font-size="22" font-weight="900" fill="#4a2c0b">= ${esc(lt(k))}</text>`;
  });
  return s;
}

// --- secret b: which way? ---------------------------------------------------------------------------------------
function sceneFlip() {
  const t = T[lang], nm = NAMES[1], n = nm.signs.length, cy = 100;
  let s = tablet(276);
  s += capPill(`${t.nm.C}`, 24);
  s += `<g class="rs-fg">${cart(6, cy, n * SP + 40, 58)}`;
  nm.signs.forEach((sg, i) => { s += signG(sg, 18 + i * SP + SP / 2, cy + 29, 30); });
  s += '</g>';
  const arrow = (x1, x2) => `<g class="rs-nopt"><circle cx="${x1}" cy="76" r="6" fill="#c9861a" stroke="#7a5120" stroke-width="1.4"/><path d="M${x1} 76H${x2}" stroke="#c9861a" stroke-width="3.2" stroke-linecap="round"/><path d="M${x2 + (x2 > x1 ? -9 : 9)} 69L${x2} 76L${x2 + (x2 > x1 ? -9 : 9)} 83" fill="none" stroke="#c9861a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  s += `<g class="rs-a0">${arrow(22, 336)}</g><g class="rs-a1">${arrow(338, 24)}</g>`;
  const row = (flip) => nm.signs.map((sg, i) => { const j = flip ? n - 1 - i : i; return slot(18 + j * SP + 2, cy + 64, SP - 4, lt(nm.letters[i])); }).join('');
  s += `<g class="rs-l0">${row(false)}</g><g class="rs-l1">${row(true)}</g>`;
  return s;
}

// --- render ------------------------------------------------------------------------------------------------------
let sceneKey = '';
function setScene(key, svg, vb = '0 0 360 276') {
  const el = $('overlay');
  const cur = el.firstElementChild;
  if (key === 'flip' && sceneKey === 'flip' && cur) { cur.classList.toggle('rs-flip', S.flip); return; }
  sceneKey = key;
  el.innerHTML = `<svg id="rsSvg" viewBox="${vb}" preserveAspectRatio="xMidYMid meet" class="${key === 'flip' && S.flip ? 'rs-flip' : ''}" role="img" aria-label="${esc(T[lang].name)}">${DEFS}${svg}</svg>`;
}
const showOnly = (...ids) => ['rsAsk', 'rsV1', 'rsV2', 'rsV3', 'rsSB'].forEach((id) => { $(id).hidden = !ids.includes(id); });

function render() {
  const t = T[lang], v = lab.view, sec = S.sec, un = secret.unlocked();
  document.body.dataset.v = sec ? 's' + sec : v;
  $('rsSecRow').innerHTML = [['a', '🆕'], ['b', '↔️']].map(([k, emo]) => `<button type="button" class="chip secret ${un ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${un ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const facts = (k) => t.facts[k].map((f, i) => ({ ...f, src: FACT_SRC[k][i] }));

  if (sec === 'a') {
    showOnly();
    setScene('alex', sceneAlex());
    const solved = S.read.size >= ALEX.signs.length;
    lab.setReadout(`${S.read.size}/${ALEX.signs.length}`, t.sa.signs, '', '#c9861a');
    lab.setState({ emo: solved ? '🎉' : '🆕', title: solved ? t.sa.solved[0] : t.sa.q[0], lead: solved ? t.sa.solved[1] : t.sa.q[1], body: '', extra: '' });
    lab.setFacts([]); return;
  }
  if (sec === 'b') {
    showOnly('rsSB');
    $('rsFlip').textContent = t.sb.flip;
    setScene('flip', sceneFlip());
    const c = S.flip ? t.sb.r : t.sb.l;
    lab.setReadout(S.flip ? '←' : '→', t.sb.dir, '', '#c9861a');
    lab.setState({ emo: '↔️', title: c[0], lead: c[1], body: '', extra: '' });
    lab.setFacts([]); return;
  }

  if (v === 'bands') {
    showOnly('rsAsk', 'rsV1');
    setScene('stone', sceneStone(), vbOf(S.zt) );
    const asking = S.tapped === null, ok = S.tapped === S.right, d = t.v1;
    $('rsAsk').innerHTML = asking ? `<div class="q">${esc(d.q)}</div><div class="h">${esc(d.hint)}</div>`
      : `<div class="q">${esc(d.q)}</div><p style="margin-top:6px"><span class="v ${ok ? 'ok' : 'no'}">${esc((ok ? d.right : d.wrong)[0])}</span>${esc((ok ? d.right : d.wrong)[1])}</p>`;
    $('rsV1').hidden = asking;
    $('rsZoom').textContent = S.zin ? d.zoomOut : d.zoomIn;
    $('rsAgain1').textContent = d.again;
    const n = Object.values(S.opened).filter(Boolean).length;
    lab.setReadout(`${n}/3`, d.found, '', '#d9a93a');
    const c = S.card ? t.cards[S.card] : null;
    lab.setState(c ? { emo: { hier: '𓂀', demo: '✒️', greek: 'Ω' }[S.card], title: c[0], lead: c[1], body: '', extra: '' }
      : asking ? { emo: '🪨', title: d.def[0], lead: d.def[1], body: '', extra: '' }
        : { emo: ok ? '✅' : '💡', title: (ok ? d.right : d.wrong)[0], lead: (ok ? d.right : d.wrong)[1], body: '', extra: '' });
    lab.setFacts(facts('bands'));
  } else if (v === 'names') {
    showOnly('rsAsk', 'rsV2');
    setScene('names', sceneNames());
    const d = t.v2, res = S.res, task = TASKS[S.step], done = S.step >= TASKS.length && !res;
    const sn = res ? t.signs[res.task] : '';
    const [pa, pb] = res ? placesOf(res.task) : ['', ''];
    const line = res ? (res.task === 'I' ? d.reed : d.line(sn, lt(SND[res.task]), pa || d.none, pb || d.none)) : '';
    $('rsAsk').innerHTML = done ? `<div class="q">${esc(d.doneT)}</div><p style="margin-top:6px">${esc(d.doneL)}</p>`
      : `<div class="q">${esc(d.q(lt(res ? res.task : task)))}</div>` + (res
        ? `<p style="margin-top:6px"><span class="v ${res.ok ? 'ok' : 'no'}">${esc(res.ok ? d.right : d.wrong(sn))}</span>${esc(line)}</p>` : `<div class="h">${esc(d.hint)}</div>`);
    $('rsFound').innerHTML = `<span class="lbl">${esc(d.foundLbl)}</span>` + TASKS.filter((k) => S.found.has(k)).map((k) => `<span class="rs-fc"><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#g-${k}"/></svg>${esc(lt(SND[k]))}</span>`).join('');
    $('rsNext').hidden = !res; $('rsNext').textContent = S.step === TASKS.length - 1 ? d.last : d.next;
    $('rsRestart').hidden = !(done || S.found.size); $('rsRestart').textContent = d.restart;
    lab.setReadout(`${S.found.size}/${TASKS.length}`, d.sounds, '', '#c9861a');
    if (done) {
      lab.setState({ emo: '🎉', title: d.doneT, lead: d.doneL, body: d.note,
        extra: `<div class="rs-champ"><span style="flex:1 1 100%;font-weight:600;color:var(--soft)">${esc(d.champ)}</span><span><svg viewBox="0 0 40 40" style="--gd:#f6e8c0"><use href="#g-T"/></svg>${esc(d.loaf)}</span><span><svg viewBox="0 0 40 40" style="--gd:#f6e8c0"><use href="#g-D"/></svg>${esc(d.hand)}</span></div>` });
    } else if (res) lab.setState({ emo: res.ok ? '✅' : '💡', title: res.ok ? d.right : d.wrong(sn), lead: line, body: d.note, extra: '' });
    else lab.setState({ emo: '🤔', title: d.q(lt(task)), lead: d.hint, body: d.note, extra: '' });
    lab.setFacts(facts('names'));
  } else {
    showOnly('rsV3');
    setScene('yours', sceneYours());
    const d = t.v3, tk = tokens();
    $('rsKeys').innerHTML = [...KEYS[lang]].map((c) => `<button type="button" class="rs-key" data-act="key" data-k="${c}">${c}</button>`).join('');
    $('rsDel').textContent = d.del; $('rsClear').textContent = d.clear;
    $('rsNote').textContent = S.note;
    lab.setReadout(tk.length || '·', d.signs, '', '#c9861a');
    lab.setState({ emo: '✍️', title: S.name.length ? S.name.join('') : d.q, lead: S.name.length ? d.lead : d.hint, body: '', extra: '' });
    lab.setFacts(facts('yours'));
  }
}

// --- input -------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function zoomTo(z, dur = 1100) {
  const from = S.zt;
  S.zin = z === 1;
  tween(dur, (p) => {
    S.zt = lerp(from, z, p);
    const svg = $('rsSvg'); if (svg && sceneKey === 'stone') svg.setAttribute('viewBox', vbOf(S.zt));
    const pl = $('rsPills'); if (pl) pl.style.opacity = String(clamp(1 - S.zt * 3, 0, 1));
  });
}
function onAct(ev) {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, t = T[lang];
  if (act === 'band') {
    if (S.zt > .05) return;
    S.opened[b.dataset.b] = true; S.card = b.dataset.b; sfx.click();
  } else if (act === 'grp') {
    if (S.tapped !== null) return;
    S.tapped = +b.dataset.g; S.fresh = true; sfx.tick(); setTimeout(() => { S.fresh = false; (S.tapped === S.right ? sfx.good : sfx.bad)(); }, 700);
    S.card = null; showStage();
    render(); zoomTo(1); return;
  } else if (act === 'zoom') { zoomTo(S.zin ? 0 : 1, 800); sfx.tick(); render(); return; }
  else if (act === 'again1') { newRound(); S.card = null; sfx.click(); }
  else if (act === 'cell') {
    if (S.res || S.step >= TASKS.length) return;
    const task = TASKS[S.step], nm = NAMES[+b.dataset.n], i = +b.dataset.i, ok = nm.signs[i] === task;
    S.res = { task, n: +b.dataset.n, i, ok }; S.found.add(task); (ok ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'next2') { S.step++; S.res = null; sfx.click(); }
  else if (act === 'restart2') { S.step = 0; S.res = null; S.found = new Set(); sfx.click(); }
  else if (act === 'key') {
    const ch = b.dataset.k; S.pop = false; S.note = '';
    const sg = signsOf(ch);
    if (S.name.length >= 10) { S.note = t.v3.full; sfx.bad(); }
    else if (!sg || !sg.length) { S.note = VOWELS.includes(ch) ? t.v3.skipV(ch) : t.v3.skipC(ch); sfx.bad(); }
    else { S.name.push(ch); S.pop = true; sfx.snap(); if (S.name.length >= 10) S.note = t.v3.full; }
  } else if (act === 'del') { S.name.pop(); S.note = ''; S.pop = false; sfx.tick(); }
  else if (act === 'clear3') { S.name = []; S.note = ''; S.pop = false; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null;
    else { S.sec = k; if (k === 'a') S.read = new Set(); else S.flip = false; sceneKey = ''; }
    sfx.click();
  } else if (act === 'rd') {
    const i = +b.dataset.i; if (!S.read.has(i)) { S.read.add(i); (S.read.size >= ALEX.signs.length ? sfx.good : sfx.tick)(); }
  } else if (act === 'flip') { S.flip = !S.flip; sfx.push(); }
  render();
}
$('ctrlBody').addEventListener('click', onAct);
$('overlay').addEventListener('click', onAct);
render();
</script>
