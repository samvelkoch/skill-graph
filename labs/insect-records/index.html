      const ls = 6.2 * Math.sqrt(a.w), lx = ax + antL * 0.3, ly = trailY - antL * 0.62 - ls * 0.3;
      if (a.st === 'drop') { const e = eIn(a.dt / 0.55); c.save(); c.globalAlpha = 1 - e; drawLeaf(c, lx + (gx + gw / 2 - lx) * e * 0.6, ly + (gyy + 10 - ly) * e, ls * (1 - 0.4 * e), -0.35 + e, 1); c.restore(); }
      else { drawLeaf(c, lx, ly, ls, -0.3 + Math.sin(a.ph) * 0.03, 1); pill(c, W, H, `×${a.w}`, lx, ly - ls * 0.6 - 12, 'c', 12, '#9be26b'); }
    }
  }
  // the tray of leaf pieces
  c.fillStyle = 'rgba(10,14,12,.55)'; rr(c, 8, H * 0.72, W - 16, H * 0.27, 18); c.fill(); c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 1; c.stroke();
  pcs.forEach((p, i) => {
    const drag = S.dg && S.dg.i === i;
    c.save(); c.globalAlpha = drag ? 0.35 : 1; drawLeaf(c, p.cx, trayY - 8, p.s, -0.15, i % 2); c.restore();
    pill(c, W, H, `×${p.w}`, p.cx, H * 0.95 - 4, 'c', 12, p.w > LIMIT ? '#ff9b8f' : '#fff');
  });
  if (S.dg) {
    const p = pcs[S.dg.i];
    c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(S.dg.x + 4, S.dg.y + p.s * 0.6, p.s, p.s * 0.2, 0, 0, 7); c.fill();
    drawLeaf(c, S.dg.x, S.dg.y, p.s * 1.08, -0.2, S.dg.i % 2); pill(c, W, H, `×${p.w}`, S.dg.x, S.dg.y - p.s * 0.7 - 12, 'c', 12);
  }
}
function dropPiece(dg) {
  const g = S.gA; if (!g) return;
  const w = PIECES[dg.i]; let a = null;
  if (!dg.moved) a = S.ants.find((x) => x.st === 'idle') ?? null;
  else {
    let best = 1e9;
    for (const x of S.ants) { if (x.st !== 'idle') continue; const d = Math.hypot(x.xf * g.W - dg.x, g.trailY - 22 - dg.y); if (d < best) { best = d; a = x; } }
    if (best > 120) a = null;
  }
  if (!a) { sfx.tick(); return; }
  if (w > LIMIT) { a.wob = 1; S.msg = { k: 'heavy', w }; sfx.bad(); }
  else { a.st = 'go'; a.w = w; S.msg = { k: 'ok', w }; sfx.snap(); }
  syncAnts();
}
function syncAnts() {
  const t = T[lang];
  lab.setReadout(String(S.delivered), t.ants.sub, t.ants.pill, '#8fd06a');
  lab.setState({ emo: '🐜', title: t.ants.title, lead: t.ants.lead, body: S.msg ? (S.msg.k === 'ok' ? t.ants.ok(S.msg.w) : t.ants.heavy(S.msg.w)) : t.ants.body, extra: '' });
  lab.setFacts([]);
  $('icAntMsg').textContent = S.msg ? (S.msg.k === 'ok' ? t.ants.ok(S.msg.w) : t.ants.heavy(S.msg.w)) : t.ants.body;
}

// --- secret b: why small is strong -----------------------------------------------------------------------------------
function drawSize(c, W, H, dt, time) {
  const t = T[lang], s = S.size;
  S.sizeShown += (s - S.sizeShown) * Math.min(1, dt * 8);
  const ss = S.sizeShown, gy = H * 0.4;
  const bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#1b3a4a'); bg.addColorStop(1, '#0f1c26'); c.fillStyle = bg; c.fillRect(0, 0, W, H);
  const sk = c.createLinearGradient(0, 0, 0, gy); sk.addColorStop(0, '#9fd0e0'); sk.addColorStop(1, '#d8efe0'); c.fillStyle = sk; c.fillRect(0, 0, W, gy);
  const gr = c.createLinearGradient(0, gy, 0, gy + 14); gr.addColorStop(0, '#6bb24c'); gr.addColorStop(1, '#3a7a34'); c.fillStyle = gr; c.fillRect(0, gy, W, 14);
  const base = Math.min(14, W * 0.035), big = base * ss;
  c.save(); c.globalAlpha = 0.9; drawBeetle(c, W * 0.12 + base * 0.5, gy, base, 0); c.restore();
  pill(c, W, H, '×1', W * 0.12 + base * 0.5, gy - base * 0.5 - 18, 'c', 12);
  const bx = Math.min(W - 24 - big * 0.7, W * 0.3 + big * 0.5);
  drawBeetle(c, bx, gy, big, time * 0.8);
  pill(c, W, H, `×${s}`, bx, Math.max(16, gy - big * 0.62 - 18), 'c', 13, '#ffd27a');
  // bars: scaled to the current weight so every bar can be read
  const rows = [[t.size.bars[0], ss / (ss ** 3), `×${s}`, '#4ea8ff'], [t.size.bars[1], (ss * ss) / (ss ** 3), `×${s * s}`, '#f5a742'], [t.size.bars[2], 1, `×${s ** 3}`, '#ef5b5b'], [t.size.bars[3], 1 / ss, `${Math.round(100 / s)}%`, '#3ddc97']];
  const y0 = H * 0.5, rh = (H * 0.48) / 4, bx0 = 14, bw = W - 28 - 64;
  rows.forEach(([name, frac, val, col], i) => {
    const y = y0 + i * rh;
    pill(c, W, H, name, bx0 - 4, y + 9, 'l', 12);
    c.fillStyle = 'rgba(255,255,255,.1)'; rr(c, bx0, y + 22, bw, 14, 7); c.fill();
    const g = c.createLinearGradient(bx0, 0, bx0 + bw, 0); g.addColorStop(0, mix(col, '#ffffff', 0.25)); g.addColorStop(1, col);
    c.fillStyle = g; rr(c, bx0, y + 22, Math.max(5, bw * clamp01(frac)), 14, 7); c.fill();
    c.fillStyle = '#fff'; c.font = '900 15px Nunito, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(val, bx0 + bw + 10, y + 29);
  });
}
function syncSize() {
  const t = T[lang], s = S.size, pct = Math.round(100 / s);
  lab.setReadout(`×${s}`, t.size.sub, t.size.pill(pct), '#4ea8ff');
  lab.setState({ emo: '📏', title: t.size.title, lead: t.size.lead, body: s === 1 ? t.size.hint : t.size.body(s, pct), extra: '' });
  lab.setFacts([]);
  $('icSizeLbl').textContent = t.size.slider(s);
}

// --- shell, controls ------------------------------------------------------------------------------------------------
const lab = shell({ key: 'insect-records', T, topics: TOPICS, views: ['jump', 'lift', 'fly'], onLang: () => render(), onView: () => { S.sec = null; render(); } });
const secret = secretLab('insect-records', () => ({
  secrets: [{ emo: '🐜', title: T[lang].secrets.ants[0], desc: T[lang].secrets.ants[1] }, { emo: '📏', title: T[lang].secrets.size[0], desc: T[lang].secrets.size[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="icJump" hidden>
    <div id="icPredJump"></div>
    <div class="ic-ctl" id="icCtlJump">
      <div class="ic-lbl" id="icHr"></div>
      <input type="range" class="big" id="icH" min="1" max="1.6" step="0.05" value="1.3">
      <div class="ends"><span id="icHa"></span><span id="icHb"></span></div>
      <div class="ic-row"><button class="ic-go" data-act="jump" id="icGoJ"></button></div>
    </div>
  </div>
  <div id="icLift" hidden>
    <div id="icPredLift"></div>
    <div class="ic-ctl" id="icCtlLift">
      <div class="ic-lbl" id="icKg"></div>
      <input type="range" class="big" id="icW" min="20" max="40" step="1" value="30">
      <div class="ends"><span id="icWa"></span><span id="icWb"></span></div>
      <div class="ic-row"><span class="ic-bus" id="icBus"></span><button class="ic-go" data-act="lift" id="icGoL"></button></div>
    </div>
  </div>
  <div id="icFly" hidden>
    <div id="icPredFly"></div>
    <div class="ic-ctl" id="icCtlFly"><div class="ic-row"><button class="ic-go" data-act="hunt" id="icGoF"></button></div></div>
  </div>
  <div id="icAnts" hidden><div class="ic-msg" id="icAntMsg"></div></div>
  <div id="icSize" hidden>
    <div class="ic-lbl" id="icSizeLbl"></div>
    <input type="range" class="big" id="icS" min="1" max="10" step="1" value="2">
    <div class="ends"><span>×1</span><span>×10</span></div>
  </div>
  <div class="row2" id="icSecs"></div>`;
$('icH').style.setProperty('--track', 'linear-gradient(90deg, #8fc268, #4ea8ff)');
$('icW').style.setProperty('--track', 'linear-gradient(90deg, #ffd25e, #ef8a3d)');
$('icS').style.setProperty('--track', 'linear-gradient(90deg, #3ddc97, #ef5b5b)');

// on a phone the controls sit below the canvas: bring the reveal into view
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function predHTML(v) {
  const t = T[lang], q = t[v].ask, opts = t[v].opts, pick = S.pick[v], done = pick !== null, right = RIGHT[v];
  const chips = opts.map((o, i) => `<button class="ic-opt${done ? (i === right ? ' good' : i === pick ? ' bad' : ' dim') : ''}" data-act="opt" data-v="${v}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('');
  const verdict = done ? `<div class="ic-verdict ${pick === right ? 'good' : 'bad'}">${esc(pick === right ? t.right : t.wrong)} ${esc(t[v].see)}</div>` : '';
  return `<div class="ic-q">${esc(q)}</div><div class="ic-opts">${chips}</div>${verdict}`;
}
function answer(v, i) {
  if (S.pick[v] !== null) return;
  S.pick[v] = i; (i === RIGHT[v] ? sfx.good : sfx.bad)();
  if (v === 'jump') S.jT = now(); else if (v === 'lift') S.lT = now(); else startHunt();
  render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'opt') return answer(b.dataset.v, +b.dataset.i);
  if (a === 'jump') { S.jT = now(); sfx.click(); showStage(); }
  else if (a === 'lift') { S.lT = now(); sfx.click(); showStage(); }
  else if (a === 'hunt') { startHunt(); sfx.click(); showStage(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); showStage();
    if (S.sec === 'ants') S.msg = null;
  }
  render();
});
$('icH').addEventListener('input', (ev) => { S.ch = +ev.target.value; render(); });
$('icH').addEventListener('change', () => { S.jT = now(); sfx.click(); });
$('icW').addEventListener('input', (ev) => { S.kg = +ev.target.value; render(); });
$('icW').addEventListener('change', () => { S.lT = now(); sfx.click(); });
$('icS').addEventListener('input', (ev) => { S.size = +ev.target.value; sfx.tick(); syncSize(); });

// the ants secret: drag a leaf piece onto an ant (a tap sends it to the next free ant)
const cvEl = $('cv');
cvEl.addEventListener('pointerdown', (ev) => {
  if (S.sec !== 'ants' || !S.gA) return;
  const r = cvEl.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const i = S.gA.pcs.findIndex((p) => Math.hypot(x - p.cx, y - (S.gA.trayY - 8)) < Math.max(26, p.s * 1.1));
  if (i < 0) return;
  S.dg = { i, x, y, sx: x, sy: y, moved: false };
  try { cvEl.setPointerCapture(ev.pointerId); } catch { /* not captured */ }
  ev.preventDefault();
});
cvEl.addEventListener('pointermove', (ev) => {
  if (!S.dg) return;
  const r = cvEl.getBoundingClientRect(); S.dg.x = ev.clientX - r.left; S.dg.y = ev.clientY - r.top;
  if (Math.hypot(S.dg.x - S.dg.sx, S.dg.y - S.dg.sy) > 8) S.dg.moved = true;
});
const endDrag = () => { if (!S.dg) return; const dg = S.dg; S.dg = null; dropPiece(dg); };
cvEl.addEventListener('pointerup', endDrag);
cvEl.addEventListener('pointercancel', () => { S.dg = null; });

// --- one render per change: controls, readout, state card and facts ----------------------------------------------------
function flySync() {
  const t = T[lang], ck = flyClock(), rs = ck.rs, a = S.fr ? S.fr.dr.slice(0, rs).filter(Boolean).length : 0, b = S.fr ? S.fr.li.slice(0, rs).filter(Boolean).length : 0;
  S.rsShown = rs;
  lab.setReadout(`${a} / ${NA}`, t.fly.sub, t.fly.pill(b), '#4fc3d9');
  lab.setState({ emo: '🦋', title: t.fly.title, lead: t.fly.lead, body: ck.done ? t.fly.body(a, b) : t.fly.live(a, b), extra: '' });
  lab.setFacts([{ emo: '🎯', text: t.facts.fly, src: SRC.fly }]);
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = sec ? 'sec' : v;
  cvEl.style.touchAction = sec === 'ants' ? 'none' : '';
  $('icJump').hidden = !!sec || v !== 'jump'; $('icLift').hidden = !!sec || v !== 'lift'; $('icFly').hidden = !!sec || v !== 'fly';
  $('icAnts').hidden = sec !== 'ants'; $('icSize').hidden = sec !== 'size';
  $('icPredJump').innerHTML = predHTML('jump'); $('icPredLift').innerHTML = predHTML('lift'); $('icPredFly').innerHTML = predHTML('fly');
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('icSecs').innerHTML = sc('ants', '🐜') + sc('size', '📏');
  $('icSize').querySelector('input').value = S.size;
  if (sec === 'ants') return syncAnts();
  if (sec === 'size') return syncSize();
  const rev = S.pick[v] !== null;
  if (v === 'jump') {
    const m = fmt(S.ch, 2), hM = HJ * S.ch, n = Math.round(hM / FLOOR_M);
    $('icCtlJump').hidden = !rev; $('icHr').textContent = t.jump.hr(m); $('icGoJ').textContent = t.scaleUp;
    $('icHa').textContent = `${fmt(1, 1)} ${t.um}`; $('icHb').textContent = `${fmt(1.6, 1)} ${t.um}`;
    lab.setGlow('rgba(143, 194, 104, .26)');
    if (!rev) { lab.setReadout('?', '', '', '#8fc268'); lab.setState({ emo: '🤔', title: t.jump.ask, lead: t.pickHint, body: '', extra: '' }); lab.setFacts([]); return; }
    lab.setReadout(`${fmt(hM, 0)} ${t.um}`, t.jump.sub(m), t.jump.pill(n), '#8fc268');
    lab.setState({ emo: '🦗', title: t.jump.title, lead: t.jump.lead, body: t.jump.body(m, fmt(hM, 0), n), extra: '' });
    lab.setFacts([{ emo: '🦘', text: t.facts.jump, src: SRC.jump }]);
  } else if (v === 'lift') {
    const tn = S.kg * BEETLE_X / 1000, b = fmt(tn / BUS_T, 1);
    $('icCtlLift').hidden = !rev; $('icKg').textContent = t.lift.kg(S.kg); $('icGoL').textContent = t.scaleUp; $('icBus').textContent = rev ? t.lift.counter(b) : '';
    $('icWa').textContent = `20 ${t.ukg}`; $('icWb').textContent = `40 ${t.ukg}`;
    lab.setGlow('rgba(239, 138, 61, .26)');
    if (!rev) { lab.setReadout('?', '', '', '#ef8a3d'); lab.setState({ emo: '🤔', title: t.lift.ask, lead: t.pickHint, body: '', extra: '' }); lab.setFacts([]); return; }
    lab.setReadout(`${fmt(tn, 1)} ${t.ut}`, t.lift.sub(S.kg), t.lift.pill(b), '#ef8a3d');
    lab.setState({ emo: '💪', title: t.lift.title, lead: t.lift.lead(S.kg, fmt(tn, 1)), body: t.lift.body(b), extra: '' });
    lab.setFacts([{ emo: '🪲', text: t.facts.lift, src: SRC.lift }]);
  } else {
    $('icCtlFly').hidden = !rev; $('icGoF').textContent = t.again;
    lab.setGlow('rgba(79, 195, 217, .26)');
    if (!rev) { lab.setReadout('?', '', '', '#4fc3d9'); lab.setState({ emo: '🤔', title: t.fly.ask, lead: t.pickHint, body: '', extra: '' }); lab.setFacts([]); return; }
    flySync();
  }
}

// --- the picture ---------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec === 'ants') return drawAnts(c, w, h, dt, time);
  if (S.sec === 'size') return drawSize(c, w, h, dt, time);
  const v = lab.view;
  if (v === 'jump') drawJump(c, w, h, dt, time);
  else if (v === 'lift') drawLift(c, w, h, dt, time);
  else {
    drawFly(c, w, h, dt, time);
    if (S.pick.fly !== null && flyClock().rs !== S.rsShown) flySync();
  }
});
render();
</script>
