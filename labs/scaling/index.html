const TAU = Math.PI * 2;
const hex2 = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

function dial(c, cx, cy, dr, n, d, needle) {

// --- model for the stretch view ----------------------------------------------------------------------------
function pass() {
  if (S.sec === 'chain') {
    const pr = CH[S.cp], k = Math.max(0, S.cs - 1), [n, d] = pr[k];
    return { lin: k === 0 ? 8 : (8 * pr[0][0]) / pr[0][1], n, d, shown: S.cs > 0 };
  }
  if (S.sec === 'shrink') return { lin: S.sk.lin, n: S.sk.n, d: S.sk.d, shown: S.sk.shown };
  const [n, d] = MULTS[S.mi];
  return { lin: 8, n, d, shown: S.rt >= 0 };
}
const whirEnv = (rt) => (rt < 0 ? 0 : rt < 0.25 ? rt / 0.25 : rt < 1.3 ? 1 : rt < 1.8 ? (1.8 - rt) / 0.5 : 0);
const needleOf = (n, d) => (clamp(-120 + (n / d / 2) * 240, -120, 132) * Math.PI) / 180;

function tick(dt) {
  if (S.rt >= 0) S.rt += dt;
  if (S.prt >= 0) S.prt += dt;
  if (S.art >= 0) S.art += dt;
  const v = lab.view;
  const rt = v === 'stretch' ? S.rt : v === 'picture' ? S.prt : -1;
  const env = whirEnv(rt);
  Mc.ang += dt * 10 * env;
  let tgt = 0;
  if (v === 'stretch') { const P = pass(); tgt = needleOf(P.n, P.d); } else if (v === 'picture') { const [n, d] = PM[S.pi]; tgt = needleOf(n, d); }
  Mc.needle = Mc.needle === null ? tgt : Mc.needle + (tgt - Mc.needle) * (1 - Math.exp(-dt * 9));
  return env;
}

  for (let i = 0; i < 8; i += 2) c.fillRect(ox + (s / 8) * i, oy, s / 8, s);
  c.strokeStyle = 'rgba(20,80,30,.35)'; c.lineWidth = 1.2;
  for (let i = 0; i < 46; i++) { const gx = ox + rnd(i) * s, gy = oy + rnd(i + 80) * s; c.beginPath(); c.moveTo(gx - 2, gy + 3); c.lineTo(gx, gy - 2); c.lineTo(gx + 2, gy + 3); c.stroke(); }
  // strip, grid and the shaded part
  const cw = s / da, chh = s / db, stripW = na * cw;
  const e = pred ? 0 : outBack(S.art / 0.9, 1.0);
  c.fillStyle = 'rgba(255,236,150,.4)'; c.fillRect(ox, oy, stripW, s);
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.2; c.setLineDash([5, 4]);
  for (let i = 1; i < da; i++) { c.beginPath(); c.moveTo(ox + i * cw, oy); c.lineTo(ox + i * cw, oy + s); c.stroke(); }
  if (!pred) {
    c.globalAlpha = clamp01(S.art / 0.5);
    for (let j = 1; j < db; j++) { c.beginPath(); c.moveTo(ox, oy + j * chh); c.lineTo(ox + s, oy + j * chh); c.stroke(); }
    c.globalAlpha = 1;
  }
  c.setLineDash([]);
  if (!pred) {
    const hNow = lerp(s, nb * chh, clamp(e, 0, 1.15));
    const rg = c.createLinearGradient(ox, oy, ox + stripW, oy + hNow);
    rg.addColorStop(0, 'rgba(255,214,90,.75)'); rg.addColorStop(1, 'rgba(255,170,40,.65)');
    c.fillStyle = rg; c.fillRect(ox, oy, stripW, hNow);
    c.strokeStyle = '#b87a10'; c.lineWidth = 2.2; c.strokeRect(ox + 1, oy + 1, stripW - 2, Math.max(0, hNow - 2));
    const fa = clamp01((S.art - 0.7) / 0.4);
    if (fa > 0) {
      c.globalAlpha = fa;
      for (let i = 0; i < na; i++) for (let j = 0; j < nb; j++) flower(c, ox + (i + 0.5) * cw, oy + (j + 0.5) * chh, Math.min(cw, chh) * 0.3, (i + j) % 2 ? '#ff6fa3' : '#ff9ad0');
      c.globalAlpha = 1;
    }
  }
  c.restore();
  // labels
  pill(c, `${fr(na, da)} ${t.u.m}`, ox + stripW / 2, oy - 24, w);
  if (!pred) {
    const hNow = nb * chh;
    pill(c, `${fr(nb, db)} ${t.u.m}`, 4, oy + Math.min(hNow, s * 1) / 2, w, { left: true });
    c.strokeStyle = '#ffd36a'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(ox - 14, oy + 1); c.lineTo(ox - 14, oy + hNow - 1); c.stroke();
  }
  pill(c, t.ar.cap, ox + s / 2, oy + s + 26, w);
}

const cv = $('cv');
canvasLoop(cv, (c, w, h, dt) => {
  const env = tick(dt), v = lab.view;
  if (v === 'stretch') drawStretch(c, w, h, env); else if (v === 'picture') drawPicture(c, w, h, env); else drawArea(c, w, h);
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const kindOf = (n, d) => (n < d ? 'lt' : n === d ? 'eq' : 'gt');

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'mul') { S.mi = i; S.guess = null; S.rt = -1; sfx.tick(); }
  else if (act === 'sg') {
    if (S.rt >= 0) return;
    S.guess = b.dataset.k; S.rt = 0; const [n, d] = MULTS[S.mi];
    sfx.push(); setTimeout(() => (S.guess === kindOf(n, d) ? sfx.good : sfx.bad)(), 900); showStage();
  } else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    S.sec = S.sec === k ? null : k; S.guess = null; S.rt = -1; S.cs = 0; S.cp = 0; S.sk = { e: 0, lin: 8, n: 1, d: 10, shown: false }; sfx.click();
  } else if (act === 'cfeed') { S.cs = Math.min(2, S.cs + 1); S.rt = 0; sfx.push(); showStage(); }
  else if (act === 'cagain') { S.cs = 0; S.rt = -1; sfx.click(); }
  else if (act === 'cpair') { S.cp = (S.cp + 1) % CH.length; S.cs = 0; S.rt = -1; sfx.click(); }
  else if (act === 'sdiv') {
    if (S.sk.e >= 5) return;
    S.sk = { e: S.sk.e + 1, lin: 8 * Math.pow(10, -S.sk.e), n: 1, d: 10, shown: true }; S.rt = 0; sfx.push(); showStage();
  } else if (act === 'smul') {
    if (S.sk.e <= 0) return;
    S.sk = { e: S.sk.e - 1, lin: 8 * Math.pow(10, -S.sk.e), n: 10, d: 1, shown: true }; S.rt = 0; sfx.push(); showStage();
  } else if (act === 'srst') { S.sk = { e: 0, lin: 8, n: 1, d: 10, shown: false }; S.rt = -1; sfx.click(); }
  else if (act === 'pmul') { S.pi = i; S.pmoved = false; S.pg = 1; S.pguess = null; S.prt = -1; sfx.tick(); }
  else if (act === 'pchk') {
    if (!S.pmoved || S.prt >= 0) return;
    const [n, d] = PM[S.pi];
    S.pguess = S.pg; S.prt = 0; sfx.push(); setTimeout(() => (Math.abs(S.pguess - n / d) <= 0.125 ? sfx.good : sfx.bad)(), 900); showStage();
  } else if (act === 'awd') { const [na] = S.aw; S.aw = [Math.min(na, i), i]; S.ag = null; S.art = -1; sfx.tick(); }
  else if (act === 'ahd') { const [nb] = S.ah; S.ah = [Math.min(nb, i), i]; S.ag = null; S.art = -1; sfx.tick(); }
  else if (act === 'ag') {
    if (S.art >= 0) return;
    S.ag = b.dataset.k; S.art = 0; const [nb, db] = S.ah;
    sfx.push(); setTimeout(() => (S.ag === (nb < db ? 'less' : 'same') ? sfx.good : sfx.bad)(), 900); showStage();
  }
  render();
});
$('swPSl').addEventListener('input', (ev) => { if (S.prt >= 0) return; S.pg = +ev.target.value; S.pmoved = true; render(); });
$('swWSl').addEventListener('input', (ev) => { S.aw = [+ev.target.value, S.aw[1]]; S.ag = null; S.art = -1; render(); });
$('swHSl').addEventListener('input', (ev) => { S.ah = [+ev.target.value, S.ah[1]]; S.ag = null; S.art = -1; render(); });

// --- render ------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('swS').hidden = v !== 'stretch'; $('swP').hidden = v !== 'picture'; $('swA').hidden = v !== 'area';
  if (v === 'stretch') renderStretch(t); else if (v === 'picture') renderPicture(t); else renderArea(t);
  lab.setFacts(t.facts[v]);
}

function renderStretch(t) {
  const m = sg(), P = pass(), open = secret.unlocked();
  lab.setGlow('rgba(214, 165, 71, .26)');
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('swSec').innerHTML = sc('chain', '🔁') + sc('shrinkray', '🔬');
  $('swDial').hidden = !!S.sec; $('swSAsk').hidden = !!S.sec;
  $('swCh').hidden = S.sec !== 'chain'; $('swSk').hidden = S.sec !== 'shrinkray';
  if (!S.sec) {
    const [n, d] = MULTS[S.mi], f = fr(n, d), kind = kindOf(n, d), shown = S.rt >= 0, L = (8 * n) / d;
    $('swDial').innerHTML = MULTS.map(([a, b], i) => `<button class="chip ${i === S.mi ? 'on' : ''}" data-act="mul" data-i="${i}">${m} ${fr(a, b)}</button>`).join('');
    const right = shown && S.guess === kind;
    $('swSAsk').innerHTML = `<div class="sw-ask"><div class="sw-q">${esc(t.st.q)}</div><div class="sw-opts">${KEYS.map((k, i) => {
      const cls = shown ? (k === kind ? 'good' : k === S.guess ? 'bad' : '') : '';
      return `<button class="${cls}" data-act="sg" data-k="${k}"${shown ? ' disabled' : ''}>${esc(t.st.opts[i])}</button>`;
    }).join('')}</div>${shown ? `<div class="sw-verdict" style="color:${right ? 'var(--ok)' : 'var(--wip)'}">${esc(right ? t.ok : t.no)}</div>
      <p class="sw-p">${esc(t.st.kind[kind])}: 8 ${m} ${f} = ${fmt(L)} ${t.u.cm}</p>` : ''}</div>`;
    if (!shown) {
      lab.setReadout(`8 ${m} ${f} = ?`, '', '', '#d6a547');
      lab.setState({ emo: '🤔', title: t.gt, lead: t.st.pl, body: t.st.pb, extra: '' });
    } else {
      lab.setReadout(`8 ${m} ${f} = ${fmt(L)} ${t.u.cm}`, '', t.st.kind[kind].toLowerCase(), kind === 'lt' ? '#4ea8ff' : kind === 'eq' ? '#8c96ad' : '#e4574b');
      const body = kind === 'lt' ? t.st.lt(f) : kind === 'eq' ? (n === 1 ? t.st.eq1() : t.st.eq(f, n)) : t.st.gt(f, n, d);
      lab.setState({ emo: kind === 'lt' ? '🔽' : kind === 'eq' ? '🟰' : '🔼', title: t.st.kind[kind], lead: `8 ${m} ${f} = ${fmt(L)} ${t.u.cm}`, body, extra: '' });
    }
  } else if (S.sec === 'chain') {
    const pr = CH[S.cp], [a, b] = pr, fa = fr(a[0], a[1]), fb = fr(b[0], b[1]);
    const mid = (8 * a[0]) / a[1];
    $('swCh').innerHTML = S.cs === 0 ? `<button class="chip on" data-act="cfeed">${esc(t.ch.go(fa))}</button>`
      : S.cs === 1 ? `<button class="chip on" data-act="cfeed">${esc(t.ch.go(fb))}</button>`
      : `<button class="chip on" data-act="cagain">${esc(t.ch.again)}</button><button class="chip" data-act="cpair">${esc(t.ch.pair)}</button>`;
    if (S.cs === 0) {
      lab.setReadout(`8 ${t.u.cm}`, '', '', '#d6a547');
      lab.setState({ emo: '🔁', title: t.ch.t0, lead: t.ch.l0(fa, fb), body: '', extra: '' });
    } else if (S.cs === 1) {
      lab.setReadout(`8 ${m} ${fa} = ${fmt(mid)} ${t.u.cm}`, '', '', '#d6a547');
      lab.setState({ emo: '🔁', title: t.ch.t1(fmt(mid)), lead: t.ch.l1(fb), body: '', extra: '' });
    } else {
      lab.setReadout(`8 ${m} ${fa} ${m} ${fb} = 8 ${t.u.cm}`, '', t.ch.pill, '#3ddc97');
      lab.setState({ emo: '🔁', title: t.ch.t2, lead: t.ch.l2(fa, fb, a[0] * b[0], a[1] * b[1]), body: t.ch.b2, extra: '' });
    }
  } else {
    const k = S.sk, e = k.e;
    $('swSk').innerHTML = `<button class="chip on" data-act="sdiv"${e >= 5 ? ' disabled' : ''}>${esc(t.sk.div)}</button><button class="chip" data-act="smul"${e <= 0 ? ' disabled' : ''}>${esc(t.sk.mul)}</button><button class="chip" data-act="srst">${esc(t.sk.rst)}</button>`;
    const lout = (k.lin * k.n) / k.d, mmv = lout * 10, um = mmv * 1000;
    const small = mmv >= 1 ? `${fmt(mmv)} ${t.u.mm}` : um >= 1 ? `${fmt(um)} ${t.u.um}` : `${fmt(um)} ${t.u.um}`;
    const subTxt = mmv >= 1 ? '' : mmv < 0.1 ? `= ${mmv >= 0.001 ? fmt(mmv) + ' ' + t.u.mm : fmt(um) + ' ' + t.u.um}` : `= ${fmt(mmv)} ${t.u.mm}`;
    if (!k.shown || e === 0 && !k.shown) {
      lab.setReadout(`8 ${t.u.cm}`, '', '', '#d6a547');
      lab.setState({ emo: '🔬', title: t.sk.t0, lead: t.sk.l0, body: t.sk.b0, extra: '' });
    } else {
      const pill = e >= 4 ? t.sk.pillT : e === 3 ? t.sk.pillH : '';
      lab.setReadout(`${fmt(k.lin)} ${m} ${fr(k.n, k.d)} = ${fmt(lout)} ${t.u.cm}`, subTxt, pill, e >= 3 ? '#e4574b' : '#d6a547');
      if (k.n === 10 && e < 3) lab.setState({ emo: '🔬', title: t.sk.back, lead: t.sk.lb, body: '', extra: '' });
      else if (e >= 4) lab.setState({ emo: '🔬', title: t.sk.tt, lead: t.sk.lt(small), body: '', extra: '' });
      else if (e === 3) lab.setState({ emo: '🔬', title: t.sk.th, lead: t.sk.lh(small), body: '', extra: '' });
      else lab.setState({ emo: '🔬', title: t.sk.tm(fmt(lout)), lead: t.sk.lm, body: '', extra: '' });
    }
  }
}

function renderPicture(t) {
  const m = sg(), [n, d] = PM[S.pi], f = fr(n, d), s = n / d, shown = S.prt >= 0, kind = s < 1 ? 'lt' : 'gt';
  lab.setGlow('rgba(78, 168, 255, .26)');
  $('swPMul').innerHTML = PM.map(([a, b], i) => `<button class="chip ${i === S.pi ? 'on' : ''}" data-act="pmul" data-i="${i}">${m} ${fr(a, b)}</button>`).join('');
  const sl = $('swPSl');
  if (+sl.value !== S.pg) sl.value = S.pg;
  sl.disabled = shown; sl.setAttribute('aria-label', t.pc.q);
  $('swPv').textContent = S.pmoved || shown ? fmt(S.pg) : '?';
  const chk = $('swPChk'); chk.textContent = t.check; chk.disabled = !S.pmoved; chk.hidden = shown;
  const right = shown && Math.abs(S.pguess - s) <= 0.125;
  $('swPAsk').innerHTML = `<div class="sw-ask"><div class="sw-q">${esc(t.pc.q)}</div>${shown ? `<div class="sw-verdict" style="color:${right ? 'var(--ok)' : 'var(--wip)'}">${esc(right ? t.ok : t.no)}</div>
    <p class="sw-p">${right ? '' : esc(t.pc.guess(fmt(S.pguess))) + ' '}${esc(t.pc.res(fmt(s)))}</p>` : ''}</div>`;
  if (!shown) {
    lab.setReadout(`10 ${t.u.cm} ${m} ${f} = ?`, t.pc.sub, '', '#4ea8ff');
    lab.setState({ emo: '🤔', title: t.gt, lead: t.pc.pl, body: '', extra: '' });
  } else {
    lab.setReadout(`10 ${m} ${f} = ${fmt(10 * s)} ${t.u.cm}`, t.pc.sub, t.pc.kind[kind].toLowerCase(), kind === 'lt' ? '#4ea8ff' : '#e4574b');
    lab.setState({ emo: kind === 'lt' ? '🔽' : '🔼', title: kind === 'lt' ? t.pc.tlt : t.pc.tgt, lead: t.pc.lead(f), body: t.pc.body, extra: '' });
  }
}

function renderArea(t) {
  const m = sg(), [na, da] = S.aw, [nb, db] = S.ah, shown = S.art >= 0;
  const wf = fr(na, da), hf = fr(nb, db), top = na * nb, bot = da * db, g = gcd(top, bot), sf = fr(top / g, bot / g);
  const kind = nb < db ? 'less' : 'same';
  lab.setGlow('rgba(80, 190, 100, .26)');
  $('swWl').textContent = t.ar.wl; $('swHl').textContent = t.ar.hl; $('swWv').textContent = wf; $('swHv').textContent = hf;
  const dens = [2, 3, 4, 5];
  const dchips = (act, cur) => dens.map((q) => `<button class="chip ${q === cur ? 'on' : ''}" data-act="${act}" data-i="${q}" aria-label="1/${q}">${fr(1, q)}</button>`).join('');
  $('swWd').innerHTML = dchips('awd', da); $('swHd').innerHTML = dchips('ahd', db);
  const wsl = $('swWSl'), hsl = $('swHSl');
  if (+wsl.max !== da) wsl.max = da; if (+wsl.value !== na) wsl.value = na;
  if (+hsl.max !== db) hsl.max = db; if (+hsl.value !== nb) hsl.value = nb;
  wsl.setAttribute('aria-label', t.ar.wl); hsl.setAttribute('aria-label', t.ar.hl);
  const right = shown && S.ag === kind;
  $('swAAsk').innerHTML = `<div class="sw-ask"><div class="sw-q">${esc(t.ar.q(wf, hf))}</div><div class="sw-opts">${['more', 'less', 'same'].map((k, i) => {
    const cls = shown ? (k === kind ? 'good' : k === S.ag ? 'bad' : '') : '';
    return `<button class="${cls}" data-act="ag" data-k="${k}"${shown ? ' disabled' : ''}>${esc(t.ar.opts[i])}</button>`;
  }).join('')}</div>${shown ? `<div class="sw-verdict" style="color:${right ? 'var(--ok)' : 'var(--wip)'}">${esc(right ? t.ok : t.no)}</div>
    <p class="sw-p">${esc(kind === 'less' ? t.ar.less(wf, hf) : t.ar.same(wf, hf))}</p>` : ''}</div>`;
  if (!shown) {
    lab.setReadout(`${wf} ${m} ${hf} = ?`, '', '', '#5fbf6a');
    lab.setState({ emo: '🤔', title: t.gt, lead: t.ar.pl, body: '', extra: '' });
  } else {
    lab.setReadout(`${wf} ${m} ${hf} = ${top}/${bot}`, `= ${sf} ${t.u.sq}`, kind === 'less' ? t.ar.pless(wf) : t.ar.psame(wf), '#5fbf6a');
    lab.setState({ emo: '🟩', title: `${wf} ${m} ${hf} = ${top}/${bot}`, lead: t.ar.lead(na, nb, da, db), body: `${kind === 'less' ? t.ar.less(wf, hf) : t.ar.same(wf, hf)} ${t.ar.cells(top, bot, sf)}`, extra: '' });
  }
}
render();
</script>
