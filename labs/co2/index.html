// NOAA GML Mauna Loa annual means (ppm); the annual mean sits at the middle of its year
const ANN = [[1959, 315.98], [1960, 316.91], [1965, 320.04], [1970, 325.68], [1975, 331.11], [1980, 338.76], [1985, 346.12], [1990, 354.39], [1995, 360.82],

const annual = (y) => {
  if (y <= ANN[0][0]) return ANN[0][1];
  if (y >= 2024) return 424.61 + 3.5 * (y - 2024);
  let i = 0; while (ANN[i + 1][0] < y) i++;
  const [a, va] = ANN[i], [b, vb] = ANN[i + 1];
  return lerp(va, vb, (y - a) / (b - a));
};
const dev = (amp, peak, v) => amp * Math.cos(2 * Math.PI * (v + 0.5 - peak) / 12); // v = months since 1 Jan; mid-January is v = 0.5

  let i = 0; while (i < ICE.length - 2 && ICE[i + 1][0] < age) i++;
  const [a, va] = ICE[i], [b, vb] = ICE[i + 1], u = clamp((age - a) / (b - a), 0, 1), s = (1 - Math.cos(Math.PI * u)) / 2;

};

  renderGlobe(Math.round(clamp(2 * R * sc * Math.min(window.devicePixelRatio || 1, 1.5), 120, 300)), S.lon0, 38, S.v);
  c.imageSmoothingEnabled = true; c.drawImage(gcv, gcx - R, gcy - R, 2 * R, 2 * R);
  c.strokeStyle = 'rgba(20,40,80,.55)'; c.lineWidth = 1.2; c.beginPath(); c.arc(gcx, gcy, R, 0, 6.2832); c.stroke();
  // three small charts

    g = c.createLinearGradient(0, ty, 0, ty + th); g.addColorStop(0, '#151b33'); g.addColorStop(1, '#0b0f1f');
    c.fillStyle = g; c.strokeStyle = 'rgba(130,145,190,.3)'; c.lineWidth = 1; c.beginPath(); c.roundRect(x, ty, bw, th, 12); c.fill(); c.stroke();

    c.fillStyle = '#d3d9e8'; c.font = FONT(800); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t.brt.st[i], x + bw / 2, ty + 16);
    c.fillStyle = '#fff'; c.font = FONT(900, 14); c.fillText(`${dv >= 0 ? '+' : '−'}${nf(Math.abs(dv), 1)}`, x + bw / 2, ty + 40);
    c.fillStyle = '#98a0b8'; c.font = FONT(700); [0, 3, 6, 9].forEach((m) => c.fillText(t.mon1[m], px + pw * (m + 0.5) / 12, py + ph + 16));
    c.fillStyle = '#98a0b8'; c.fillText('ppm', x + bw / 2, ty + th - 10);
  }

function seasonBucket() { const m = Math.floor(S.v) % 12; return m === 11 || m < 2 ? 0 : m < 5 ? 1 : m < 8 ? 2 : 3; }
function syncSeason() {
  const t = T[lang];
  $('sMonth').value = String(Math.round(S.v * 100)); $('bMo').textContent = t.mon[Math.floor(S.v) % 12];
  const val = ppmAt(2024 + S.v / 12, 3);

  if (lab.view === 'breath' && S.bmode === 'season' && !S.sec) lab.setReadout(nf(val, 1), t.brt.dialSub, t.mon3[Math.floor(S.v) % 12], '#5ed68c');

function dialSvg(val) {

    <path d="M12 62 A48 48 0 0 1 108 62" fill="none" stroke="rgba(130,145,190,.25)" stroke-width="10" stroke-linecap="round"/>

}

// --- the secret about 800,000 years ---------------------------------------------------------------------------
function drawIce(c, w, h, dt) {
  const t = T[lang];
  S.secT = Math.min(1, S.secT + dt / 5);
  const f = frame(c, w, h, { tA: -800, tB: 0.3, yA: 150, yB: 450, b: 40 }); G.chart = f;
  c.fillStyle = 'rgba(94,214,140,.07)'; c.fillRect(f.x0, f.Y(300), f.x1 - f.x0, f.Y(180) - f.Y(300));
  c.strokeStyle = 'rgba(94,214,140,.4)'; c.setLineDash([4, 4]); [180, 300].forEach((v) => { c.beginPath(); c.moveTo(f.x0, f.Y(v)); c.lineTo(f.x1, f.Y(v)); c.stroke(); }); c.setLineDash([]);
  c.fillStyle = '#98a0b8'; c.font = FONT(700); c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let a = 800; a >= 0; a -= 200) c.fillText(nf(a), clamp(f.X(-a), f.x0 + 8, f.x1 - 10), f.y1 + 16);
  c.fillText(t.sec.ageU, (f.x0 + f.x1) / 2, f.y1 + 31);
  const u = S.secT, endT = lerp(-800, -0.18, ease(c01(u / 0.9)));
  trace(c, f, (x) => iceAt(-x), -800, endT, '#7fd0ff', 'rgba(127,208,255,.22)', { per: 0.45, w: 2.2 });
  if (u > 0.9) {
    const sp = ease(c01((u - 0.9) / 0.1)), top = lerp(280, P2024, sp);
    c.save(); c.strokeStyle = '#ff6b57'; c.shadowColor = '#ff6b57'; c.shadowBlur = 12; c.lineWidth = 3.4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(f.X(-0.18), f.Y(280)); c.lineTo(f.X(-0.18) + 1.5, f.Y(top)); c.stroke(); c.restore();
    c.fillStyle = '#fff'; c.strokeStyle = '#ff6b57'; c.lineWidth = 2.5; c.beginPath(); c.arc(f.X(-0.18) + 1.5, f.Y(top), 5.5, 0, 6.2832); c.fill(); c.stroke();

  }
  pill(c, t.sec.band, f.x0 + 50, f.Y(240), w, h, { color: '#7dffc4', line: 'rgba(61,220,151,.5)' });
}

// --- render -------------------------------------------------------------------------------------------------
const cv = $('cv');
const sections = { air: $('cAir'), curve: $('cCur'), breath: $('cBr') };
function render() {

  $('cSecB').style.display = S.sec === 'breath' ? '' : 'none';

    return `<button class="chip secret ${open ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? esc(t.sec.lbl[i]) : '🔒 ???'}</button>`;
  }).join('');
  S.legDirty = true;
  if (S.sec === 'ice') renderIce(t); else if (S.sec === 'breath') renderSecBreath(t);

}
function renderAir(t) {
  const a = t.air, g = Math.round(2500 * Math.pow(S.gs / 1000, 2));

  $('aQ').textContent = a.q; $('aNote').textContent = a.note; $('aV').textContent = a.yours(g); $('aMax').textContent = nf(2500); $('aGo').textContent = a.go; $('aAgain').textContent = a.again;
  $('aYear').innerHTML = [['now', a.yNow], ['old', a.yOld]].map(([k, l]) => `<button class="chip ${S.yr === k ? 'on' : ''}" data-act="year" data-k="${k}">${esc(l)}</button>`).join('');
  if (!S.arev) {

    return;
  }
  const mk = mixKey(), m = MIXES[mk], tot = m[3], k = S.found.filter((f, i) => f && i < tot).length, gg = S.gAt;
  lab.setReadout(nf(tot), a.dots, mk === 'old' ? a.ppm(280) : a.ppm(420), mk === 'old' ? '#8fa4ff' : '#ff6b57');
  if (k === tot) lab.setState({ emo: '🎉', title: a.tAll, lead: a.lAll, body: a.body, extra: '' });
  else if (mk === 'old') lab.setState({ emo: '🕰️', title: a.tOld, lead: a.lOld, body: a.body, extra: '' });
  else lab.setState({ emo: gg <= 10 && gg > 0 ? '✅' : '🔍', title: `${gg <= 10 && gg > 0 ? a.right : gg === 0 ? a.zero : a.few} ${a.tNow}`, lead: a.lNow(gg), body: a.body, extra: '' });
}
function renderSecBreath(t) {
  const s = t.sec, m = MIXES[mixKey()];
  lab.setGlow('rgba(255, 107, 87, .26)');
  $('sbChips').innerHTML = [['air', s.air], ['breath', s.br]].map(([k, l]) => `<button class="chip ${S.bm === k ? 'on' : ''}" data-act="bm" data-k="${k}">${esc(l)}</button>`).join('');
  lab.setReadout(nf(m[3]), s.dots, S.bm === 'breath' ? s.pill : t.air.ppm(420), '#ff6b57');
  lab.setState({ emo: '🌬️', title: S.bm === 'breath' ? s.brT : t.air.tNow, lead: S.bm === 'breath' ? s.brL : s.airL, body: S.bm === 'breath' ? s.brB : t.air.body, extra: '' });
}
function renderIce(t) {
  lab.setGlow('rgba(127, 208, 255, .24)');
  lab.setReadout('180–300', t.sec.iceSub, t.sec.icePill, '#7fd0ff');
  lab.setState({ emo: '⏳', title: t.sec.iceT, lead: t.sec.iceL, body: t.sec.iceB, extra: '' });
}
function renderCurve(t) {
  const c = t.cur;
  lab.setGlow('rgba(255, 107, 87, .24)');
  $('cPre').style.display = S.crev ? 'none' : ''; $('cPost').style.display = S.crev ? '' : 'none';
  $('cQ').textContent = c.q; $('cNote').textContent = c.note; $('cV').textContent = c.yours(S.cg); $('cGo').textContent = c.go; $('cGo').disabled = !S.cmoved; $('cAgain').textContent = c.again;

  }
  const done = S.cp >= 1; $('sZoom').disabled = !done;

  if (S.mqOn) {

  } else mq.style.display = 'none';

  if (!done) { lab.setState({ emo: '📈', title: c.t0, lead: c.l0, body: '', extra: '' }); return; }

  else if (S.mqAns !== null) lab.setState({ emo: '📅', title: c.mT, lead: c.mL, body: c.read, extra: '' });
  else lab.setState({ emo: Math.abs(g - P2024) <= 8 ? '✅' : '📈', title: `${verdict} ${c.tR(P2024)}`, lead: c.lR(g, P2024), body: c.bR(P2024 - P1960) + ' ' + c.hint, extra: '' });
}
function renderBreath(t) {

    const sb = seasonBucket(); S.sb = sb;

    else lab.setState({ emo: r > 0 ? '📈' : '📉', title: b.tMr(S.f, v), lead: r > 0 ? b.lUp(r) : b.lDn(r), body: b.bM, extra: '' });

function syncSeasonUi(t) {

  lab.setReadout(nf(val, 1), t.brt.dialSub, t.mon3[Math.floor(S.v) % 12], '#5ed68c');

// --- controls -----------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'areveal') { S.gAt = Math.round(2500 * Math.pow(S.gs / 1000, 2)); S.arev = true; S.ap = 0; S.found = [false, false, false, false]; S.lensMoved = false; S.yr = 'now'; sfx.click(); showStage(); }
  else if (act === 'aagain') { S.arev = false; S.ap = 0; sfx.click(); }
  else if (act === 'year') { S.yr = b.dataset.k; S.ap = 0.67; sfx.click(); }
  else if (act === 'creveal') { S.crev = true; S.cp = 0; S.z = 0; $('sZoom').value = '0'; $('sZoom').disabled = true; S.mqOn = false; S.mqAns = null; S.cur = 2024.5; sfx.click(); showStage(); }
  else if (act === 'cagain') { S.crev = false; S.cp = 0; S.z = 0; S.ya = 300; S.yb = 500; S.wv = 0; S.mqOn = false; S.mqAns = null; S.cmoved = false; $('sZoom').value = '0'; sfx.click(); }
  else if (act === 'mq') { S.mqAns = +b.dataset.i; (S.mqAns === 1 ? sfx.good : sfx.bad)(); }
  else if (act === 'bmode') { S.bmode = b.dataset.k; S.play = false; sfx.click(); }
  else if (act === 'play') { S.play = !S.play; sfx.click(); }
  else if (act === 'run') { S.ran = true; S.runP = 0; S.running = true; sfx.click(); showStage(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (k === 'ice') { S.sec = S.sec === 'ice' ? null : 'ice'; S.secT = 0; }
    else if (S.sec === 'breath') S.sec = null;
    else { S.sec = 'breath'; S.bm = 'breath'; S.ap = 0; }
    sfx.click(); if (S.sec) showStage();
  } else if (act === 'bm') { S.bm = b.dataset.k; S.ap = 0; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, val = +ev.target.value;
  if (id === 'sGuess') { S.gs = val; $('aV').textContent = T[lang].air.yours(Math.round(2500 * Math.pow(val / 1000, 2))); lab.setReadout(nf(Math.round(2500 * Math.pow(val / 1000, 2))), T[lang].air.guessSub, '', '#4ea8ff'); }
  else if (id === 'sPpm') { S.cg = val; S.cmoved = true; $('cGo').disabled = false; $('cV').textContent = T[lang].cur.yours(val); lab.setReadout(nf(val), T[lang].cur.sub, '', '#ff6b57'); }
  else if (id === 'sZoom') {
    S.z = val / 1000; S.cur = clamp(S.cur, 2025 - curSpan(), 2024.99);
    if (S.z > 0.03 && !S.mqOn) { S.mqOn = true; render(); return; }
    $('cZl').textContent = `${T[lang].cur.zoom} · ${T[lang].cur.span(Math.max(1, Math.round(curSpan())))}`; readoutCurve();
  } else if (id === 'sMonth') { S.v = val / 100; S.play = false; $('bPlay').textContent = T[lang].brt.play; syncSeason(); }
  else if (id === 'sFuel') { S.f = val; render(); }
});

// dragging on the picture: the magnifier, the guess handle, the reading cursor
let drag = null;
const local = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function moveLens(e) {
  if (!G.jar) return;
  const [x, y] = local(e), { ox, oy, sc } = G.jar, lift = e.pointerType === 'mouse' ? 0 : 40;
  S.lens.x = clamp((x - ox) / sc, FX + 4, FX + FS - 4); S.lens.y = clamp((y - lift - oy) / sc, FY + 4, FY + FS - 4); S.lensMoved = true;
}
cv.addEventListener('pointerdown', (e) => {
  const v = lab.view;
  if (S.sec === 'breath' || (v === 'air' && !S.sec && S.arev)) { drag = 'lens'; moveLens(e); }
  else if (v === 'curve' && !S.sec && !S.crev && G.chart) { drag = 'guess'; dragGuess(e); }
  else if (v === 'curve' && !S.sec && S.crev && S.cp >= 1 && G.chart) { drag = 'cur'; dragCur(e); }
  if (drag) { try { cv.setPointerCapture(e.pointerId); } catch { /* fine */ } }
});
cv.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (drag === 'lens') moveLens(e); else if (drag === 'guess') dragGuess(e); else dragCur(e);
});
const endDrag = () => { if (drag === 'guess') render(); drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
function dragGuess(e) {
  const [, y] = local(e), f = G.chart; S.cg = Math.round(clamp(f.iY(y), 300, 500)); S.cmoved = true;
  $('sPpm').value = String(S.cg); $('cV').textContent = T[lang].cur.yours(S.cg); $('cGo').disabled = false; lab.setReadout(nf(S.cg), T[lang].cur.sub, '', '#ff6b57');
}
function dragCur(e) {
  const [x] = local(e), f = G.chart; S.cur = clamp(f.iX(x), Math.max(2025 - curSpan(), 1960), 2024.99); readoutCurve();
}

canvasLoop(cv, (c, w, h, dt, tm) => {
  const v = lab.view;
  if (S.sec === 'ice') drawIce(c, w, h, dt);
  else if (S.sec === 'breath' || v === 'air') drawJar(c, w, h, dt, tm);
  else if (v === 'curve') drawCurve(c, w, h, dt, tm);
  else if (S.bmode === 'season') drawSeason(c, w, h, dt);
  else drawModel(c, w, h, dt);
});
render();
