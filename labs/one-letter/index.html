  else if (act === 'nextL') { S.sel = (S.sel + 1) % 27; sfx.tick(); }
  else if (act === 'setL') { S.gene[S.sel] = b.dataset.l; S.sickShown = false; sfx.click(); }
  else if (act === 'real') { S.gene = ORIG.slice(); S.gene[SICK_IDX] = 'T'; S.sel = SICK_IDX; S.sickShown = true; sfx.good(); }
  else if (act === 'reset1') { S.gene = ORIG.slice(); S.sickShown = false; sfx.click(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const key = b.dataset.s; S.sec = S.sec === key ? null : key; S.tblAa = null; sfx.click();
  } else if (act === 'g2') {
    if (S.g2 !== null) return; S.g2 = k; (['start', 'end', 'same'][k] === truth2() ? sfx.good : sfx.bad)();
  } else if (act === 'mode') { S.mode = k; sfx.click(); }
  else if (act === 'prev2') { S.sel2 = clamp(S.sel2 - 1, 0, Math.max(0, S.alive.length - 1)); sfx.tick(); }
  else if (act === 'next2') { S.sel2 = clamp(S.sel2 + 1, 0, Math.max(0, S.alive.length - 1)); sfx.tick(); }
  else if (act === 'cut') { cutAt(S.sel2, S.mode); S.lastAct = 'cut'; }
  else if (act === 'demoS') { resetShift(); cutAt(DEMO_S, 1); S.demo.s = intactOf(S.alive); S.lastAct = 'demo'; }
  else if (act === 'demoE') { resetShift(); cutAt(DEMO_E, 1); S.demo.e = intactOf(S.alive); S.lastAct = 'demo'; }
  else if (act === 'again2') { resetShift(); S.demo = { s: null, e: null }; sfx.click(); }
  else if (act === 'g3') { if (S.g3 !== null) return; S.g3 = k; startRun(); sfx.click(); }
  else if (act === 'run') { startRun(); sfx.click(); }
  else if (act === 'toB') { S.mode3 = 'beetles'; sfx.click(); }
  else if (act === 'toC') { S.mode3 = 'chart'; sfx.click(); }
  else if (act === 'gen') nextGen(k);
  else if (act === 'bReset') { B.gens = 0; B.list = Array.from({ length: NB }, () => ({ g: ANC.slice(), fresh: false })); B.sel = 0; B.born = TM; sfx.click(); }
  render();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------------
const btn = (act, k, txt, cls = 'ol-opt', extra = '') => `<button class="${cls}" data-act="${act}" data-k="${k}"${extra}>${esc(txt)}</button>`;
function render() {
  const t = T[lang], v = lab.view;
  if (v === 'swap') renderSwap(t); else if (v === 'shift') renderShift(t); else renderVariety(t);
}
function renderSwap(t) {
  const q = t.v1, ph = S.ph1, secOpen = secret.unlocked();
  lab.setGlow('rgba(90, 169, 230, .24)');
  let html = '', st;
  if (ph === 'pred') {
    const p = pend(), c1 = ((p.idx / 3) | 0) + 1, pos = (p.idx % 3) + 1;
    html = `<div class="ol-q">${esc(q.q)}</div><div class="ol-opts">${q.opts.map((o, i) => btn('g1', i, o)).join('')}</div>`;
    lab.setReadout(`${ORIG[p.idx]} → ${p.to}`, q.where(c1, pos), '', '#5aa9e6');
    st = { emo: '🤔', title: q.predT(S.pi + 1), lead: q.predL(c1, pos, ORIG[p.idx], p.to), body: '', extra: '' };
    lab.setFacts([]);
  } else if (ph === 'rev') {
    const p = pend(), ci = (p.idx / 3) | 0, o = cod(ORIG, ci), n = cod(S.gene, ci), kd = S.kind1, tr = translate(S.gene);
    const ok = ['same', 'diff', 'stop'][S.g1] === kd;
    html = `<div class="ol-row"><button class="btn ol-go" data-act="next1" data-k="0">${esc(S.pi < 2 ? q.next : q.toFree)}</button></div>`;
    lab.setReadout(`${o} → ${n}`, `${NAME[CODE[o]]} → ${NAME[CODE[n]]}`, q.kT[kd], '#5aa9e6');
    const lead = kd === 'same' ? q.kL.same(o, n, NAME[CODE[o]]) : kd === 'diff' ? q.kL.diff(o, n, NAME[CODE[o]], NAME[CODE[n]]) : q.kL.stop(n, chainLen(tr));
    st = { emo: ok ? '✅' : '🤔', title: `${ok ? q.right : q.wrong} ${q.kT[kd]}`, lead, body: '', extra: '' };
    lab.setFacts([t.facts.code]);
  } else {
    const L = S.gene, kd = kindOf(L), changed = L.findIndex((x, i) => x !== ORIG[i]);
    const ci = changed >= 0 && cod(L, (S.sel / 3) | 0) === cod(ORIG, (S.sel / 3) | 0) ? (changed / 3) | 0 : (S.sel / 3) | 0, o = cod(ORIG, ci), n = cod(L, ci), tr = translate(L);
    html = `<div class="ol-row"><button class="ol-step" data-act="prevL" data-k="0" aria-label="←">◀</button><button class="ol-step" data-act="nextL" data-k="0" aria-label="→">▶</button>
      ${['A', 'C', 'G', 'T'].map((x) => `<button class="ol-base" style="background:${BC[x]}" data-act="setL" data-k="0" data-l="${x}">${x}</button>`).join('')}</div>
      <div class="ol-row">${btn('real', 0, q.real, 'chip ol-chip')}${btn('reset1', 0, q.reset, 'chip ol-chip')}
      <span class="chips">${[['mal', '🛡️'], ['tbl', '🔢']].map(([s, e]) => `<button class="chip secret ol-chip ${secOpen ? 'open' : ''} ${S.sec === s ? 'on' : ''}" data-act="sec" data-k="0" data-s="${s}">${secOpen ? `${e} ${esc(t.sec[s][0])}` : '🔒 ???'}</button>`).join('')}</span></div>`;
    lab.setReadout(o === n ? cod(L, ci) : `${o} → ${n}`, `${NAME[CODE[o]]}${o === n ? '' : ` → ${NAME[CODE[n]]}`}`, changed < 0 ? '' : q.kT[kd], '#5aa9e6');
    if (S.sec === 'tbl') {
      const a = S.tblAa, k = a ? Object.values(CODE).filter((x) => x === a).length : 0;
      st = a ? { emo: '🔢', title: t.tbl.one(NAME[a], k), lead: t.tbl.oneL, body: '', extra: '' } : { emo: '🔢', title: t.tbl.t, lead: t.tbl.l(AA_COUNT), body: '', extra: '' };
    } else if (S.sec === 'mal') st = { emo: '🛡️', title: t.mal.cols[S.malCol], lead: t.mal.l[S.malCol], body: t.mal.pick, extra: '' };
    else if (S.sickShown) st = { emo: '🩸', title: q.sick[0], lead: q.sick[1], body: q.sick[2], extra: '' };
    else if (changed < 0) st = { emo: '🧬', title: q.freeT, lead: q.freeL, body: q.same0, extra: '' };
    else {
      const lead = kd === 'same' ? q.kL.same(o, n, NAME[CODE[o]]) : kd === 'diff' ? q.kL.diff(o, n, NAME[CODE[o]], NAME[CODE[n]]) : q.kL.stop(n, chainLen(tr));
      st = { emo: kd === 'same' ? '🟰' : kd === 'diff' ? '🔄' : '🛑', title: q.kT[kd], lead: lead, body: '', extra: '' };
    }
    lab.setFacts([t.facts.code, t.facts.sick]);
  }
  $('olBody').innerHTML = html;
  lab.setState(st);
}
function renderShift(t) {
  const q = t.v2, n = S.alive.length, k = intactOf(S.alive), tr = geneTr2(), pre = S.g2 === null;
  lab.setGlow('rgba(245, 200, 76, .22)');
  let html, st;
  if (pre) {
    html = `<div class="ol-q">${esc(q.q)}</div><div class="ol-opts">${q.opts.map((o, i) => btn('g2', i, o)).join('')}</div>`;
    lab.setReadout(`${k}/5`, q.readSub, q.pill(n), '#f5c84c');
    st = { emo: '🤔', title: q.t0, lead: q.q, body: '', extra: '' };
    lab.setFacts([]);
  } else {
    html = `<div class="ol-row"><span class="card seg small">${q.modes.map((m, i) => `<button data-act="mode" data-k="${i === 0 ? 1 : 3}" class="${S.mode === (i === 0 ? 1 : 3) ? 'on' : ''}">${esc(m)}</button>`).join('')}</span>
      <button class="ol-step" data-act="prev2" data-k="0" aria-label="←">◀</button><button class="ol-step" data-act="next2" data-k="0" aria-label="→">▶</button>
      <button class="btn ol-go" data-act="cut" data-k="0"${n === 0 ? ' disabled' : ''}>${esc(q.cut)}</button></div>
      <div class="ol-row">${btn('demoS', 0, q.demoS(DEMO_S + 1), 'chip ol-chip')}${btn('demoE', 0, q.demoE(DEMO_E + 1), 'chip ol-chip')}${btn('again2', 0, q.again, 'chip ol-chip')}</div>`;
    lab.setReadout(`${k}/5`, q.readSub, q.pill(n), '#f5c84c');
    const both = S.demo.s !== null && S.demo.e !== null, lostN = 15 - n, beads = chainLen(tr), stop = tr.includes('*');
    const ok = ['start', 'end', 'same'][S.g2] === truth2();
    if (both && lostN === 1 && S.lastAct === 'demo') {
      st = { emo: ok ? '✅' : '🤔', title: `${ok ? q.right : q.wrong} ${q.win[truth2()]}`, lead: q.cmp(demoIntact(DEMO_S), demoIntact(DEMO_E), 5), body: q.why, extra: '' };
    } else if (lostN === 0) {
      st = { emo: ok ? '✅' : '🤔', title: ok ? q.right : q.wrong, lead: q.after, body: '', extra: '' };
    } else {
      st = { emo: '✂️', title: q.lost(lostN, k, 5), lead: lostN % 3 === 0 ? q.m3 : q.mx, body: stop ? q.stop(beads) : q.noStop(beads), extra: '' };
    }
    lab.setFacts([t.facts.frame]);
  }
  $('olBody').innerHTML = html;
  lab.setState(st);
}
function renderVariety(t) {
  const q = t.v3, run = S.run, beet = S.mode3 === 'beetles';
  lab.setGlow('rgba(169, 139, 232, .24)');
  let html, st;
  if (S.g3 === null) {
    html = `<div class="ol-q">${esc(q.q)}</div><div class="ol-opts">${q.opts.map((o, i) => btn('g3', i, o)).join('')}</div>`;
    lab.setReadout('?', q.readSub, '', '#a98be8');
    st = { emo: '🤔', title: q.t0, lead: q.q, body: '', extra: '' };
    lab.setFacts([]);
  } else if (!beet) {
    const done = run && run.done;
    const cnt = run ? run.items.filter((i) => i.k === 0).length : 0;
    const want = [0, 0.25, 1].map((v, i) => [Math.abs(ALL.syn / ALL.tot - v), i]).sort((a, b) => a[0] - b[0])[0][1];
    const ok = S.g3 === want;
    html = `<div class="ol-row">${done ? btn('run', 0, q.run, 'chip ol-chip') + btn('toB', 0, q.toB, 'btn ol-go') : ''}</div>`;
    lab.setReadout(done ? String(cnt) : '…', q.readSub, done ? q.pillDone : q.pillRun, '#a98be8');
    st = done ? { emo: ok ? '✅' : '🤔', title: `${ok ? q.right : q.wrong} ${q.resT}`, lead: q.res(cnt, ALL.tot, ALL.syn, ALL.pct, ALL.mis, ALL.non), body: '', extra: '' }
      : { emo: '🧪', title: q.t0, lead: q.running, body: '', extra: '' };
    lab.setFacts(done ? [t.facts.lac1, t.facts.lac2] : []);
  } else {
    const shades = new Set(B.list.map((b) => hueOf(b.g))).size, fresh = B.list.filter((b) => b.fresh).length;
    html = `<div class="ol-row">${btn('gen', 1, q.gen, 'btn ol-go')}${btn('gen', 10, q.gen10, 'chip ol-chip')}${btn('bReset', 0, q.again, 'chip ol-chip')}${btn('toC', 0, q.toC, 'chip ol-chip')}</div>
      <div class="ol-fine">${esc(q.bNote)}</div>`;
    lab.setReadout(String(shades), q.shades, q.gens(B.gens), '#a98be8');
    st = B.gens === 0 ? { emo: '🪲', title: q.bT0, lead: q.bL0, body: '', extra: '' }
      : shades === 1 ? { emo: '🪲', title: q.same1, lead: q.same1L, body: '', extra: '' }
        : { emo: '🌈', title: q.many(shades), lead: q.manyL(fresh), body: '', extra: '' };
    lab.setFacts([t.facts.lac1, t.facts.lac2]);
  }
  $('olBody').innerHTML = html;
  lab.setState(st);
}
render();
</script>
