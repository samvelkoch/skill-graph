// --- the Water view: mountains, four drops, rivers ---------------------------------------------------------------
function drawRidge(c, P, ridge) {
  const pts = ridge.map(([lo, la]) => [P.px(lo), P.py(la)]), sm = smoothSample(pts, 10), s = clamp(P.k * 0.62, 4, 10);
  const peaks = []; let acc = 0, idx = 0;
  for (let i = 1; i < sm.length; i++) {
    acc += Math.hypot(sm[i][0] - sm[i - 1][0], sm[i][1] - sm[i - 1][1]);
    if (acc >= s * 1.25) { acc = 0; const hsh = Math.abs(Math.sin(idx * 12.9898 + ridge[0][0] * 3.1) * 43758.5453) % 1; peaks.push([sm[i][0], sm[i][1], s * (0.8 + 0.5 * hsh)]); idx++; }
  }
  peaks.sort((a, b) => a[1] - b[1]);
  for (const [x, y, r] of peaks) {
    c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(x + r * 0.3, y + 1, r * 1.1, r * 0.28, 0, 0, 7); c.fill();
    c.fillStyle = '#b4a47c'; c.beginPath(); c.moveTo(x - r, y); c.lineTo(x, y - r * 1.25); c.lineTo(x + r * 0.1, y); c.closePath(); c.fill();
    c.fillStyle = '#7f7356'; c.beginPath(); c.moveTo(x + r, y); c.lineTo(x, y - r * 1.25); c.lineTo(x + r * 0.1, y); c.closePath(); c.fill();
    c.fillStyle = '#fbfbff'; c.beginPath(); c.moveTo(x - r * 0.3, y - r * 0.88); c.lineTo(x, y - r * 1.25); c.lineTo(x + r * 0.3, y - r * 0.88); c.lineTo(x + r * 0.1, y - r * 0.7); c.lineTo(x - r * 0.05, y - r * 0.85); c.closePath(); c.fill();
  }
}
function drawDrop(c, x, y, r, col, label, glow) {
  const cy = y - r * 1.5;
  if (glow > 0) { c.fillStyle = `rgba(255,255,255,${0.28 * glow})`; c.beginPath(); c.arc(x, cy, r + 5 + 2 * glow, 0, 7); c.fill(); }
  c.beginPath(); c.moveTo(x, y); c.bezierCurveTo(x - r * 0.2, y - r * 0.5, x - r, y - r * 0.9, x - r, cy); c.arc(x, cy, r, Math.PI, 2 * Math.PI); c.bezierCurveTo(x + r, y - r * 0.9, x + r * 0.2, y - r * 0.5, x, y); c.closePath();
  const g = c.createRadialGradient(x - r * 0.35, cy - r * 0.4, 1, x, cy, r * 1.4); g.addColorStop(0, mix(col, '#ffffff', 0.55)); g.addColorStop(0.5, col); g.addColorStop(1, mix(col, '#000000', 0.3));
  c.fillStyle = g; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#0f2a4a'; c.stroke();
  c.fillStyle = '#fff'; c.font = '900 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, x, cy + 1);
}
function drawWater(c, w, h, time, dt) {
  const t = T[lang], P = proj(WIN.water, 10, 10, w - 20, h - 20);
  c.drawImage(mapLayer('water', P), P.x, P.y, P.w, P.h);
  c.save(); rr(c, P.x, P.y, P.w, P.h, 14); c.clip();
  for (const rg of [PYR, CARP, ALPS]) drawRidge(c, P, rg);
  // rivers followed so far
  const labels = [], occ = [];
  const paths = RIVERS.map((rv) => { const sm = smoothSample(rv.map(([lo, la]) => [P.px(lo), P.py(la)]), 8); const cum = [0]; for (let i = 1; i < sm.length; i++) cum.push(cum[i - 1] + Math.hypot(sm[i][0] - sm[i - 1][0], sm[i][1] - sm[i - 1][1])); return { sm, cum, len: cum[cum.length - 1] }; });
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (let i = 0; i < 4; i++) {
    if (S.wrun[i] && !S.wdone[i]) { S.wp[i] = Math.min(1, S.wp[i] + dt / (2.6 + paths[i].len / 240)); if (S.wp[i] >= 1) { S.wdone[i] = true; S.wrun[i] = false; sfx.good(); setTimeout(render, 0); } }
    if (!S.wrun[i] && !S.wdone[i]) continue;
    const { sm, cum, len } = paths[i], p = eIO(S.wp[i]), target = len * p;
    let n = 1; while (n < sm.length && cum[n] <= target) n++;
    const head = n < sm.length ? [sm[n - 1][0] + (sm[n][0] - sm[n - 1][0]) * ((target - cum[n - 1]) / Math.max(0.001, cum[n] - cum[n - 1])), sm[n - 1][1] + (sm[n][1] - sm[n - 1][1]) * ((target - cum[n - 1]) / Math.max(0.001, cum[n] - cum[n - 1]))] : sm[sm.length - 1];
    const draw = () => { c.beginPath(); c.moveTo(sm[0][0], sm[0][1]); for (let j = 1; j < n; j++) c.lineTo(sm[j][0], sm[j][1]); c.lineTo(head[0], head[1]); c.stroke(); };
    c.strokeStyle = 'rgba(40,140,255,.3)'; c.lineWidth = 6; draw(); c.strokeStyle = '#8fd3ff'; c.lineWidth = 2.6; draw();
    if (S.wp[i] < 1) { c.fillStyle = '#fff'; c.beginPath(); c.arc(head[0], head[1], 4.5, 0, 7); c.fill(); c.strokeStyle = '#2f7fd0'; c.lineWidth = 2; c.stroke(); }
    else {
      const end = sm[sm.length - 1];
      for (let k = 0; k < 2; k++) { const ph = ((time * 0.7 + k * 0.5) % 1); c.strokeStyle = `rgba(255,255,255,${0.7 * (1 - ph)})`; c.lineWidth = 1.6; c.beginPath(); c.ellipse(end[0], end[1], 3 + ph * 12, 1.5 + ph * 6, 0, 0, 7); c.stroke(); }
      const mid = sm[Math.floor(sm.length * (i === 0 ? 0.62 : i === 1 ? 0.5 : i === 2 ? 0.5 : 0.45))];
      labels.push({ text: t.r.rivers[i], x: mid[0], y: mid[1], r: 3, prio: 8, col: '#bfe6ff' });
    }

  // drops
  HIT.drops = [];
  DROPS.forEach((d, i) => {
    const X = P.px(d.lon), Y = P.py(d.lat), sel = S.wsel === i, bob = sel && !S.wdone[i] ? Math.sin(time * 4) * 2 : 0;
    HIT.drops.push({ i, x: X, y: Y - 13 });
    drawDrop(c, X, Y + bob, 8.5, S.wdone[i] ? '#4aa3ff' : '#6cc6ff', String(i + 1), sel ? 0.6 + 0.4 * Math.sin(time * 5) : 0);
    occ.push({ x: X - 10, y: Y - 28, w: 20, h: 30 });
  });
  // mountain and sea names, and the selected drop's name
  MT_AT.forEach(([lo, la], i) => labels.push({ text: t.r.mts[i], x: P.px(lo), y: P.py(la), prio: 6, col: '#f0e2b0', center: true, r: 2 }));
  SEA_AT.forEach(([lo, la], i) => labels.push({ text: t.r.seas[i], x: P.px(lo), y: P.py(la), prio: 4, col: '#9fd4ff', center: true, r: 2 }));
  if (S.wsel !== null) { const d = DROPS[S.wsel]; labels.push({ text: t.r.drops[S.wsel], x: P.px(d.lon), y: P.py(d.lat) - 14, prio: 10, r: 12, must: true }); }
  c.restore();
  labelPass(c, P, labels, occ);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {

// --- controls -------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function goTo(i) {
  if (!predDone()) return;
  i = clamp(i, 0, STOPS.length - 1);
  if (i === S.at) return;
  S.at = i; S.jump = now(); if (!S.seen.has(i)) { S.seen.add(i); S.seenAt[i] = now(); }
  sfx.tick(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'p1') { S.p1 = i; sfx.click(); if (predDone()) showStage(); }
  else if (act === 'p2') { S.p2 = i; sfx.click(); if (predDone()) showStage(); }
  else if (act === 'next') { if (S.at === STOPS.length - 1) goTo(0); else goTo(S.at + 1); return; }
  else if (act === 'back') { goTo(S.at - 1); return; }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click();
  }
  else if (act === 'check') { if (nPlaced() < CTRY.length || S.checked) return; S.checked = true; S.sel = null; (nRight() > 8 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'reset') { S.place = {}; S.sel = null; S.checked = false; sfx.click(); }
  else if (act === 'zone') { zoneTap(+b.dataset.z, ev); return; }
  else if (act === 'chip') { if (ev.detail === 0) chipTap(b.dataset.k); return; } // keyboard; pointer taps are handled below
  else if (act === 'drop') { S.wsel = i; sfx.click(); }
  else if (act === 'sea') { if (S.wsel === null || S.wrun[S.wsel] || S.wdone[S.wsel]) return; S.wguess[S.wsel] = i; S.wrun[S.wsel] = true; S.wp[S.wsel] = 0; sfx.snap(); showStage(); }
  render();
});
$('wSlide').addEventListener('input', (ev) => goTo(+ev.target.value));

// chips of the Parts view: a tap selects, a drop on a part places (pointer events so touch and mouse behave the same)
function chipTap(k) {
  if (S.checked) return;
  lastChip = now();
  if (S.place[k] !== undefined) { delete S.place[k]; S.sel = k; sfx.tick(); }
  else { S.sel = S.sel === k ? null : k; sfx.click(); }
  render();
}
let lastChip = -9;
function zoneTap(z, ev) {
  if (S.checked || ev.target.closest('.eu-c') || now() - lastChip < 0.25) return; // a tap on a chip must not also tap the part under it
  if (S.sel) { S.place[S.sel] = z; S.sel = null; sfx.snap(); render(); }
}
let drag = null, ghost = null;
$('ctrlBody').addEventListener('pointerdown', (ev) => {
  const el = ev.target.closest('.eu-c'); if (!el || S.checked || lab.view !== 'parts') return;
  drag = { k: el.dataset.k, x: ev.clientX, y: ev.clientY, moved: false, id: ev.pointerId };
});
addEventListener('pointermove', (ev) => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) > 8) {
    drag.moved = true; ghost = document.createElement('div'); ghost.className = 'eu-c eu-ghost'; ghost.textContent = CT[drag.k].n[lang]; document.body.append(ghost);
  }
  if (drag.moved) {
    ghost.style.left = `${ev.clientX}px`; ghost.style.top = `${ev.clientY}px`;
    const z = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-z]');
    document.querySelectorAll('.eu-z').forEach((e) => e.classList.toggle('hot', e === z));
  }
});
const endDrag = (ev, cancel) => {
  if (!drag) return;
  const d = drag; drag = null;
  document.querySelectorAll('.eu-z').forEach((e) => e.classList.remove('hot'));
  if (ghost) { ghost.remove(); ghost = null; }
  if (!d.moved) { if (!cancel) chipTap(d.k); return; }
  if (cancel) return;
  const z = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-z]');
  if (z) { lastChip = now(); S.place[d.k] = +z.dataset.z; S.sel = null; sfx.snap(); render(); }
};

// taps on the map: pick a stop, a country or a drop
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, v = lab.view;
  const near = (list, rad) => { let best = null, bd = rad; for (const p of list) { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } } return best; };
  if (v === 'west' && predDone() && HIT.ribbon && y < HIT.ribbon.y + HIT.ribbon.h + 6) {
    let bi = -1, bd = 26; HIT.stops.forEach(([X, Y], i) => { const d = Math.hypot(X - x, Y - y); if (d < bd) { bd = d; bi = i; } }); if (bi >= 0) goTo(bi);
  } else if (v === 'parts' && !S.checked) { const p = near(HIT.dots, 22); if (p) chipTap(p.k); }

    return;
  }
  const k = nRight(), miss = CTRY.filter((c) => S.place[c.k] !== c.z).map((c) => `<div class="eu-miss">${esc(p.miss(c.n[lang], p.zones[S.place[c.k]], p.zones[c.z]))}</div>`).join('');
  lab.setReadout(`${k}/12`, p.subRes, p.pill, '#8f7fd0');
  lab.setState({ emo: k === 12 ? '🏆' : '🧩', title: p.res(k), lead: p.resLead, body: p.resBody, extra: miss });
  lab.setFacts(t.facts.parts);
}

function renderWater(t) {
  const r = t.r, sel = S.wsel, n = S.wdone.filter(Boolean).length;
  lab.setGlow('rgba(80, 160, 255, .26)');
  $('rPick').textContent = r.pick;
  $('rDrops').innerHTML = DROPS.map((_, i) => `<button class="eu-opt ${sel === i ? 'on' : ''} ${S.wdone[i] ? (S.wguess[i] === DROPS[i].sea ? 'good' : 'bad') : ''}" data-act="drop" data-i="${i}">${i + 1} · ${esc(r.drops[i])}</button>`).join('');
  const locked = sel === null || S.wrun[sel] || S.wdone[sel];
  $('rAsk').textContent = sel === null ? '' : r.ask(r.drops[sel]); $('rAsk').hidden = sel === null;
  $('rSeas').hidden = sel === null;
  $('rSeas').innerHTML = r.seas.map((o, i) => optBtn('sea', i, o, sel !== null && S.wdone[sel] ? (i === DROPS[sel].sea ? 'good' : S.wguess[sel] === i ? 'bad' : '') : '', locked)).join('');
  $('rFine').textContent = r.fine;
  const alpsDone = S.wdone[0] && S.wdone[1] && S.wdone[2];
  if (sel !== null && S.wrun[sel]) {
    lab.setReadout(`${n}/4`, r.sub, '', '#4aa3ff');
    lab.setState({ emo: '💧', title: r.run, lead: r.drops[sel], body: '', extra: '' });
    lab.setFacts([]);
  } else if (sel !== null && S.wdone[sel]) {
    const ok = S.wguess[sel] === DROPS[sel].sea;
    lab.setReadout(`${n}/4`, r.sub, r.seas[DROPS[sel].sea], '#4aa3ff');
    lab.setState({ emo: ok ? '✅' : '💧', title: r.res(ok, r.rivers[sel], r.seas[DROPS[sel].sea]), lead: r.lead[sel], body: r.body, extra: alpsDone ? `<div class="eu-miss">${esc(r.three)}</div>` : '' });
    lab.setFacts([t.facts.water[sel], t.facts.alps]);
  } else {
    lab.setReadout(n ? `${n}/4` : '?', r.sub, '', '#4aa3ff');
    lab.setState({ emo: r.pre[0], title: r.pre[1], lead: r.pre[2], body: r.pre[3], extra: '' });
    lab.setFacts([]);
  }
}
render();
</script>
