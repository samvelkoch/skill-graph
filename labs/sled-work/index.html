    c.fillStyle = '#9a4a3b'; c.beginPath(); c.moveTo(...M(0, 0.3)); c.lineTo(...M(4.4, -1.9)); c.lineTo(...M(4.4, -2.45)); c.lineTo(...M(0, -0.25)); c.lineTo(...M(-4.4, -2.45)); c.lineTo(...M(-4.4, -1.9)); c.closePath(); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(...M(0, 0.3)); c.lineTo(...M(4.4, -1.9)); c.lineTo(...M(4.25, -2.0)); c.lineTo(...M(0, 0.12)); c.lineTo(...M(-4.25, -2.0)); c.lineTo(...M(-4.4, -1.9)); c.closePath(); c.fill();
    const O = M(0, 0), a = M(k.u[0], k.u[1]), b = M(k.v[0], k.v[1]);
    arrow(c, O[0], O[1], a[0], a[1], COL_A, 5, 14); arrow(c, O[0], O[1], b[0], b[1], COL_B, 5, 14);
    let lbl = null; if (showArc) lbl = arc(O, [a[0] - O[0], a[1] - O[1]], [b[0] - O[0], b[1] - O[1]], kk * 1.1);
    pill(c, nm[0], a[0] - 10, a[1] - 22, { fg: COL_A, size: 14 }); pill(c, nm[1], b[0] + 10, b[1] - 22, { fg: COL_B, size: 14 });
    if (lbl && steps >= 4) pill(c, `${f1(th)}°`, lbl[0], lbl[1] + 6, { size: 14 });
  } else if (i === 1) { // two paths from a tree, seen from above
    const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#1b4a45'); g.addColorStop(1, '#2f7a5a'); c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.fillStyle = 'rgba(255,255,255,.04)'; for (let y = 0; y < h; y += 36) c.fillRect(0, y, w, 18);
    const kk = Math.min(w * 0.78 / 4.4, h * 0.74 / 4.4), ox = w * 0.14, oy = h * 0.88, M = (x, y) => [ox + x * kk, oy - y * kk];
    const O = M(0, 0), a = M(k.u[0], k.u[1]), b = M(k.v[0], k.v[1]);
    c.lineCap = 'round'; c.strokeStyle = 'rgba(232,215,170,.38)'; c.lineWidth = kk * 0.5; for (const e of [a, b]) { c.beginPath(); c.moveTo(O[0], O[1]); c.lineTo(e[0], e[1]); c.stroke(); }
    arrow(c, O[0], O[1], a[0], a[1], COL_A, 4.5, 14); arrow(c, O[0], O[1], b[0], b[1], COL_B, 4.5, 14);
    // the tree (from above)
    for (const [rr, col] of [[kk * 0.62, '#1f5d3f'], [kk * 0.48, '#2f8456'], [kk * 0.3, '#43a870']]) { c.fillStyle = col; c.beginPath(); c.arc(O[0] - 4, O[1] + 4, rr, 0, 7); c.fill(); }
    // two walkers (from above)
    for (const [e, col] of [[a, '#f2705f'], [b, '#5aa7f0']]) {
      c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(e[0] + 3, e[1] + 5, 13, 8, 0, 0, 7); c.fill();
      c.fillStyle = col; c.beginPath(); c.ellipse(e[0], e[1], 13, 8.5, -0.4, 0, 7); c.fill();
      c.fillStyle = '#f0c8a2'; c.beginPath(); c.arc(e[0], e[1], 7.5, 0, 7); c.fill(); c.fillStyle = '#ff9f45'; c.beginPath(); c.arc(e[0], e[1] - 1, 6, Math.PI, 0); c.fill();
    }
    let lbl = null; if (showArc) lbl = arc(O, [a[0] - O[0], a[1] - O[1]], [b[0] - O[0], b[1] - O[1]], kk * 1.5);
    pill(c, nm[0], a[0] - 14, a[1] - 26, { fg: COL_A, size: 14 }); pill(c, nm[1], b[0] + 14, b[1] - 26, { fg: COL_B, size: 14 });
    if (lbl && steps >= 4) pill(c, `${f1(th)}°`, lbl[0] + 22, lbl[1] - 6, { size: 14 });
  } else { // the bag in a level room
    const fy = h * 0.8;
    const wg = c.createLinearGradient(0, 0, 0, fy); wg.addColorStop(0, '#2c3566'); wg.addColorStop(1, '#4a548f'); c.fillStyle = wg; c.fillRect(0, 0, w, fy);
    c.fillStyle = '#ffe6a8'; c.beginPath(); c.roundRect(w * 0.7, h * 0.14, w * 0.2, h * 0.24, 8); c.fill(); c.strokeStyle = '#6a5a4a'; c.lineWidth = 4; c.stroke();
    c.beginPath(); c.moveTo(w * 0.8, h * 0.14); c.lineTo(w * 0.8, h * 0.38); c.moveTo(w * 0.7, h * 0.26); c.lineTo(w * 0.9, h * 0.26); c.stroke();
    ground(fy, '#9a7350', '#6a4a30');
    const sc = h * 0.0034, px = w * 0.22;
    c.save(); c.translate(px, fy); c.scale(sc, -sc);
    const hx = 12, hy = 34; child(c, 0, hx, hy, { lean: 0, bob: Math.sin(time * 2) * 0.6 });
    c.fillStyle = '#8c5a3a'; c.beginPath(); c.roundRect(hx - 8, hy - 20, 16, 17, 4); c.fill(); c.strokeStyle = '#5a361f'; c.lineWidth = 1.2; c.stroke();
    c.strokeStyle = '#5a361f'; c.lineWidth = 2; c.beginPath(); c.arc(hx, hy - 3, 5, Math.PI, 0); c.stroke();
    c.restore();
    const O = [px + hx * sc, fy - (hy - 11) * sc], eF = [O[0], O[1] - h * 0.3], eD = [O[0] + w * 0.4, O[1]];
    arrow(c, O[0], O[1], eF[0], eF[1], COL_A, 5, 14); arrow(c, O[0], O[1], eD[0], eD[1], COL_B, 5, 14);
    let lbl = arc(O, [0, -1], [1, 0], 28);
    pill(c, `${nm[0]} = (0, 50) ${t.uN}`, eF[0] + 10, eF[1] + 6, { fg: COL_A, align: 'left' }); pill(c, `${nm[1]} = (5, 0) ${t.uM}`, eD[0], eD[1] - 22, { fg: COL_B, align: 'right' });
    if (steps >= 4) pill(c, '90°', lbl[0] + 10, lbl[1] + 4, { size: 14 });
  }
}

// --- the picture -----------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  V.w = w; V.h = h; c.lineJoin = 'round'; c.lineCap = 'round';
  if (gateOf()) {
    backdrop(c, w, h, h * 0.8, time);
    pill(c, `${T[lang].gate.lock} ${T[lang].gate.t}`, w / 2, h / 2, { size: 15 });
  } else if (lab.view === 'angle') drawAngle(c, w, h, dt, time);
  else if (lab.view === 'dot') drawDot(c, w, h, dt, time);
  else drawFind(c, w, h, dt, time);
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-go]'); if (!b || b.disabled) return;
  if (b.dataset.go) { $('views').querySelector(`[data-view="${b.dataset.go}"]`)?.click(); return; }
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'g1') { S.g1 = [45, 80, 0][i]; S.th = S.g1; S.ph = 1; S.show = 'verdict'; (S.g1 === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'next1') { S.ph = 2; S.th = 90; sfx.click(); }
  else if (act === 'g2') { S.g2 = i; S.ph = 3; S.show = 'verdict'; (i === T[lang].a.ok2 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'hill') { if (!secret.unlocked()) return secret.open(); S.hill = !S.hill; sfx.click(); }
  else if (act === 'slope') { S.slope = +b.dataset.s; S.hill = true; sfx.tick(); }
  else if (act === 'dg') { S.dg = i; S.dshow = 'verdict'; (i === T[lang].d.ok ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'dmode') { S.mode = b.dataset.m; S.dshow = 'live'; sfx.click(); }
  else if (act === 'shadow') { if (!secret.unlocked()) return secret.open(); S.shadow = !S.shadow; S.dshow = 'live'; sfx.click(); }
  else if (act === 'ftask') { S.fi = i; sfx.click(); }
  else if (act === 'fg') { S.fe[S.fi] = i; (i === T[lang].f.tasks[S.fi].ok ? sfx.good : sfx.bad)(); }
  else if (act === 'fnext') { if (S.fs[S.fi] < 4) { S.fs[S.fi]++; sfx.tick(); if (S.fs[S.fi] === 4) { sfx.click(); showStage(); } } }
  render();
});
$('aRange').addEventListener('input', () => { S.th = +$('aRange').value; S.show = 'live'; sfx.tick(); render(); });

const optsHTML = (act, labels, chosen, ok, done) => `<div class="sw-opts">${labels.map((l, i) =>
  `<button class="sw-opt${done && i === ok ? ' good' : done && i === chosen ? ' bad' : ''}" data-act="${act}" data-i="${i}"${done ? ' disabled' : ''}>${esc(l)}</button>`).join('')}</div>`;

// --- one render per change: controls, readout, state card and facts ---------------------------------------------
function render() {
  const t = T[lang], v = lab.view, gate = gateOf();
  document.body.dataset.v = v; document.body.dataset.g = gate ? '1' : '0';
  $('cv').style.touchAction = v === 'dot' && !gate ? 'none' : 'pan-y';
  $('secA').style.display = v === 'angle' ? '' : 'none';
  $('secD').style.display = v === 'dot' && !gate ? '' : 'none';
  $('secF').style.display = v === 'find' && !gate ? '' : 'none';
  $('secG').style.display = gate ? '' : 'none';
  if (gate) return renderGate(t, gate);
  if (v === 'angle') renderAngle(t); else if (v === 'dot') renderDot(t); else renderFind(t);
}
function renderGate(t, g) {
  const need = g === 'dot' ? [['angle', t.gate.goA]] : [...(S.ph < 3 ? [['angle', t.gate.goA]] : []), ...(S.dg === null ? [['dot', t.gate.goD]] : [])];
  $('secG').innerHTML = `<p>${esc(g === 'dot' ? t.gate.dot : t.gate.find)}</p><div class="row2" style="margin-top:0">${need.map(([k, l]) => `<button class="btn" data-go="${k}">${esc(l)}</button>`).join('')}</div>`;
  lab.setReadout('🔒', '', '', '#8fb4ff'); $('gauge').style.visibility = 'hidden';
  lab.setState({ emo: '🔒', title: t.gate.t, lead: g === 'dot' ? t.gate.dot : t.gate.find, body: '', extra: '' });
  lab.setFacts([]);
}
function renderAngle(t) {
  const a = t.a, ph = S.ph, th = S.th, W = rnd(wOf(th)), Fx = F_N * Math.cos(rad(th)), Fy = F_N * Math.sin(rad(th));
  lab.setGlow('rgba(95, 180, 220, .26)');
  $('aQ').innerHTML = ph === 0 ? `<div class="sw-q">${esc(a.q1)}</div>${optsHTML('g1', a.opts1.map((x) => x), null, a.ok1, false)}`
    : ph === 2 ? `<div class="sw-q">${esc(a.q2)}</div>${optsHTML('g2', a.opts2, null, a.ok2, false)}` : '';
  const sl = ph === 1 || ph === 3;
  $('aSl').hidden = !sl;
  $('aLbl').textContent = a.lbl; $('aVal').textContent = `${th}°`;
  const rg = $('aRange'); rg.max = ph === 1 ? 80 : 90; if (+rg.value !== th) rg.value = th; rg.setAttribute('aria-label', a.lbl);
  $('aNext').hidden = ph !== 1; $('aNext').textContent = a.next;
  $('aNote').hidden = !(ph === 3 && th >= 90 && !S.hill); $('aNote').textContent = a.beyond;
  const hillOpen = secret.unlocked();
  $('aSec').hidden = ph !== 3;
  $('hillB').className = `chip secret ${hillOpen ? 'open' : ''} ${S.hill ? 'on' : ''}`; $('hillB').textContent = hillOpen ? `⛰️ ${t.secrets.hill[0]}` : '🔒 ???';
  $('aSlopes').hidden = !(S.hill && hillOpen);
  $('aSlopes').innerHTML = [10, 20, 30].map((s) => `<button class="chip ${s === S.slope ? 'on' : ''}" data-act="slope" data-s="${s}">${a.slope} ${s}°</button>`).join('');
  $('gauge').style.visibility = sl ? 'visible' : 'hidden';
  lab.setGauge(sl ? clamp(wOf(th) / 500, 0, 1) : 0, [{ f: 0, label: '0' }, { f: 0.5, label: '250' }, { f: 1, label: '500' }], t.uJ);
  let st;
  if (ph === 0) st = { emo: '🛷', title: a.q1, lead: a.setup, body: '' };
  else if (ph === 2) st = { emo: '🤔', title: a.q2, lead: a.setup2, body: '' };
  else if (S.hill && hillOpen && ph === 3) { const ang = 90 + S.slope, wg = mn(rnd(MG * D_M * Math.cos(rad(ang)))); st = { emo: '⛰️', title: a.hillT(wg), lead: a.hillL(S.slope, wg, ang), body: a.hillB }; }
  else if (S.show === 'verdict' && ph === 1) st = S.g1 === 0 ? { emo: '✅', title: a.okV, lead: a.revL(500), body: '' } : { emo: '🤔', title: a.noV(S.g1, rnd(wOf(S.g1))), lead: a.revL(500), body: '' };
  else if (S.show === 'verdict' && ph === 3) st = { emo: S.g2 === a.ok2 ? '✅' : '🤔', title: S.g2 === a.ok2 ? a.okV : a.noV2(a.opts2[S.g2]), lead: a.r2L, body: '' };
  else st = { emo: '🛷', title: a.liveT(W), lead: a.liveL(f1(Fx), f1(Fy)), body: a.liveB(th, W) };
  lab.setState({ ...st, extra: '' });
  if (ph === 0 || ph === 2) lab.setReadout('?', `${F_N} ${t.uN} · ${D_M} ${t.uM}`, '', '#5fb4dc');
  else lab.setReadout(`${W} ${t.uJ}`, `${F_N} × ${D_M} × cos ${th}°`, `${f1(Fx)} ${t.uN} ${t.c.along}`, '#5fb4dc');
  lab.setFacts(t.facts.angle);
}
function renderDot(t) {
  const d = t.d, pre = S.dg === null;
  lab.setGlow('rgba(255, 180, 84, .24)');
  $('gauge').style.visibility = 'hidden';
  $('dQ').innerHTML = pre ? `<div class="sw-q">${esc(d.q)}</div>${optsHTML('dg', d.opts, null, d.ok, false)}` : '';
  $('dMode').hidden = pre;
  $('dSeg').innerHTML = [['explore', d.modes[0]], ['task', d.modes[1]]].map(([m, l]) => `<button data-act="dmode" data-m="${m}" class="${S.mode === m ? 'on' : ''}">${esc(l)}</button>`).join('');
  const open = secret.unlocked();
  $('shB').className = `chip secret ${open ? 'open' : ''} ${S.shadow ? 'on' : ''}`; $('shB').textContent = open ? `🔦 ${t.secrets.shadow[0]}` : '🔒 ???';
  const { a, b } = vecsNow(), dot = dotOf(a, b), la = lenOf(a), lb = lenOf(b), ang = angOf(a, b);
  const cf = (v) => `(${f1(v)})`;
  if (pre) {
    lab.setReadout('?', '120°', '', '#ffb454');
    lab.setState({ emo: '🤔', title: d.q, lead: d.setup, body: '', extra: '' });
  } else {
    lab.setReadout(`a·b = ${f1(dot)}`, `a = (${f1(a[0])}, ${f1(a[1])})  b = (${f1(b[0])}, ${f1(b[1])})`, ang === null ? '' : `θ = ${f1(ang)}°`, '#ffb454');
    $('dNote').textContent = S.mode === 'task' ? '' : d.hint;
    const extra = `<div class="sw-eq"><span class="sw-k">${esc(d.parts)}</span> a<sub>x</sub>b<sub>x</sub> + a<sub>y</sub>b<sub>y</sub> = ${cf(a[0])}${cf(b[0])} + ${cf(a[1])}${cf(b[1])} = <b>${f1(dot)}</b></div>
      <div class="sw-eq"><span class="sw-k">${esc(d.byAngle)}</span> ${ang === null ? esc(d.noAngle) : `|a||b| cos θ = ${f2(la)} × ${f2(lb)} × cos ${f1(ang)}° = <b>${f1(la * lb * Math.cos(rad(ang)))}</b>`}</div>`;
    let st;
    if (S.dshow === 'verdict' && S.mode === 'explore') {
      st = { emo: S.dg === d.ok ? '✅' : '🤔', title: S.dg === d.ok ? d.okV : d.noV(d.opts[S.dg].toLowerCase()), lead: d.revL(f1(dot)), body: '' };
    } else if (S.mode === 'task') {
      st = S.solved ? { emo: '✅', title: d.tOkT, lead: d.tOkL(`${f1(b[0])}, ${f1(b[1])}`), body: d.tOkB } : { emo: '✏️', title: d.tT, lead: d.tL, body: '' };
    } else if (S.shadow && open && lb > 0) {
      const sh = dot / lb; st = { emo: '🔦', title: d.shT(f1(sh)), lead: d.shL, body: sh < 0 ? d.shLneg : '' };
    } else if (ang === null) st = { emo: '❔', title: d.zeroV[0], lead: d.zeroV[1], body: '' };
    else if (dot > 0) st = { emo: '📐', title: d.pos[0], lead: d.pos[1], body: '' };
    else if (dot === 0) st = { emo: '⊥', title: d.zero[0], lead: d.zero[1], body: '' };
    else st = { emo: '📐', title: d.neg[0], lead: d.neg[1], body: '' };
    lab.setState({ ...st, extra });
  }
  lab.setFacts(t.facts.dot);
}
function renderFind(t) {
  const f = t.f, i = S.fi, { k, dot, cos, th, lines } = ftask(i), steps = S.fs[i], task = f.tasks[i], has = fhasGuess(i);
  lab.setGlow('rgba(88, 183, 242, .24)');
  $('gauge').style.visibility = 'hidden';
  $('fTasks').innerHTML = f.tasks.map((x, j) => `<button class="chip ${j === i ? 'on' : ''}" data-act="ftask" data-i="${j}">${S.fs[j] >= 4 ? '✓ ' : ''}${esc(x.chip)}</button>`).join('');
  $('fQ').innerHTML = (has ? '' : `<div class="sw-q">${esc(task.q)}</div>`) + (i < 2 ? (has ? '' : optsHTML('fg', task.opts, null, task.ok, false)) : '');
  $('fCalc').innerHTML = lines.slice(0, steps).map((l) => `<div>${l}</div>`).join('');
  $('fNext').hidden = !has || steps >= 4; $('fNext').textContent = f.next;
  let st;
  if (!has) st = { emo: '🤔', title: f.estT, lead: task.q, body: '' };
  else if (steps < 4) st = { emo: '🔎', title: i === 2 ? f.bagT : f.checkT, lead: i === 2 && steps === 0 ? task.q : f.checkL, body: '' };
  else if (i === 2) st = { emo: '✅', title: f.bagR, lead: f.resL[2](), body: '' };
  else {
    const right = S.fe[i] === task.ok, resT = f.resL[i](f1(th));
    st = right ? { emo: '✅', title: f.okV, lead: resT, body: '' } : { emo: '🤔', title: f.noV(task.opts[S.fe[i]]), lead: resT, body: '' };
  }
  lab.setState({ ...st, extra: '' });
  const n0 = k.n[0], n1 = k.n[1];
  lab.setReadout(steps >= 4 ? `${f1(th)}°` : steps >= 3 ? `cos θ = ${f2(cos)}` : steps >= 1 ? `${n0}·${n1} = ${mn(dot)}` : '?', `${n0} = (${mn(k.u[0])}, ${mn(k.u[1])})  ${n1} = (${mn(k.v[0])}, ${mn(k.v[1])})`, '', '#58b7f2');
  lab.setFacts(t.facts.find);
}
render();
</script>
