  lab.setGlow('rgba(110,200,160,.28)');
  $('smMode').innerHTML = [['one', d.bOne], ['three', d.bThree]].map(([k, l]) => `<button class="chip sm-b ${D.mode === k ? 'on' : ''}" data-act="mode" data-m="${k}">${esc(l)}</button>`).join('');
  show('smOne', one); show('smThree', !one);
  if (one) {
    $('smSlL').textContent = d.slide; $('smE1').textContent = d.e1; $('smE2').textContent = d.e2; $('smRe').textContent = d.replay;
    if ($('smRange').value !== String(D.km)) $('smRange').value = D.km;
    $('smRange').setAttribute('aria-label', d.slide);
    const lag = lagOf(D.km / KMDEG);
    lab.setReadout(`${d.lagW} ${lagStr(lag)}`, `≈ ${fmtKm(D.km)} km`, t.simp, '#ff9a3c');
    lab.setState({ ...d.st1, extra: '' });
  } else {
    $('smRuler').innerHTML = `<b>${esc(d.ruler)}:</b> ` + [1, 2, 3, 4, 5].map((m) => `${m} ${esc(t.min)} ≈ ${fmtKm(degOfLag(m) * KMDEG)} km`).join(' · ');
    $('smCheck').textContent = th.checked ? d.next : d.check;
    if (!th.checked) { lab.setReadout('?', d.drag, '', '#3ddc97'); lab.setState({ ...d.st3, extra: '' }); }
    else {
      const ok = th.err <= 350;
      lab.setReadout(ok ? t.good : d.off(fmtKm(th.err)), '', t.simp, ok ? '#3ddc97' : '#ffd166');
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.good : d.off(fmtKm(th.err)), lead: ok ? d.right(fmtKm(th.err)) : d.offLead, body: d.expl, extra: '' });
    }
  }
  lab.setFacts(t.facts.distance);
}
render();
</script>
</body>
</html>
