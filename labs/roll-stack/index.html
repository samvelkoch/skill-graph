const TAU = Math.PI * 2, DEG = Math.PI / 180;

function shadowE(c, x, y, rx, ry, a = .38) {

}

function pill(c, text, x, y, o = {}) {

}

// --- the five solids, drawn as shaded bodies; origin = contact point (front-bottom), body goes up (negative y) ---
function drawBall(c, r, spin = 0) {
  c.save(); c.translate(0, -r);
  const g = c.createRadialGradient(-r * .3, -r * .36, r * .05, 0, 0, r * 1.1);
  g.addColorStop(0, COL.ball); g.addColorStop(1, '#C93C3C');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, RR(r), 0, TAU); c.fill();
  c.save(); c.beginPath(); c.arc(0, 0, RR(r), 0, TAU); c.clip(); c.rotate(spin);
  c.fillStyle = 'rgba(110,22,34,.38)'; c.fillRect(-r * 1.2, r * .1, r * 2.4, r * .32);   // darker band: shows the spin
  c.fillStyle = 'rgba(255,225,225,.22)'; c.fillRect(-r * 1.2, -r * .52, r * 2.4, r * .1);
  c.restore();
  const sh = c.createRadialGradient(-r * .3, -r * .35, r * .25, 0, 0, r * 1.05);
  sh.addColorStop(0, 'rgba(60,5,15,0)'); sh.addColorStop(1, 'rgba(60,5,15,.34)');
  c.fillStyle = sh; c.beginPath(); c.arc(0, 0, RR(r), 0, TAU); c.fill();
  c.save(); c.translate(-r * .36, -r * .42); c.rotate(-.6); c.scale(1, .62);
  const hl = c.createRadialGradient(0, 0, 0, 0, 0, r * .34);
  hl.addColorStop(0, 'rgba(255,255,255,.95)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = hl; c.beginPath(); c.arc(0, 0, RR(r * .34), 0, TAU); c.fill(); c.restore();
  c.strokeStyle = 'rgba(120,25,30,.75)'; c.lineWidth = 1.5; c.beginPath(); c.arc(0, 0, RR(r), 0, TAU); c.stroke();
  c.restore();
}

      R.ans = i; R.ok = RIGHT[KIND[R.i]].includes(i); R.phase = 'run'; R.t = 0; sfx.push();
    } else if (v === 'tower') {
      if (TW.phase !== 'ask') return;
      TW.ans = i; TW.ok = i === 2; TW.phase = 'reveal'; TW.rstep = 0; TW.rt = 0; TW.rdone = false; sfx.push();
    } else if (M.phase === 'q1') {
      M.ans1 = i; M.ok1 = i === 2; M.phase = 'r1'; M.done1 = false; M.gt = 0; M.gstage = 0; startSeq('cube', true); sfx.push();
    } else if (M.phase === 'q2') {
      M.ans2 = i; M.ok2 = i === 1; M.phase = 'r2'; M.rev2 = true; (M.ok2 ? sfx.good : sfx.bad)(); showStage();
    }
  } else if (b.dataset.nx) {
    sfx.click();
    if (v === 'ramp') { R.i = (R.i + 1) % 5; rampReset(); }
    else if (v === 'tower') { TW.phase = 'free'; towerReset(true); }
    else if (M.phase === 'r1') { M.phase = 'q2'; M.prints = []; M.seq = null; M.rev2 = false; }
    else if (M.phase === 'r2') { M.phase = 'free'; M.shape = 'cube'; M.prints = []; M.seq = null; M.count = 0; }
  }
  render();
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k;
    if (k === 'slice' && S.sec) { S.angle = 0; S.seenFlat = true; S.seenSlant = false; $('angle').value = 0; }
    sfx.click();
  } else if (act === 'reset') { towerReset(true); sfx.click(); }
  else if (act === 'shape') { startSeq(b.dataset.k, false); sfx.click(); }
  render();
});
$('angle').addEventListener('input', (ev) => {
  S.angle = +ev.target.value; if (S.angle <= 1) S.seenFlat = true; if (S.angle >= 20) S.seenSlant = true; render();
});

// --- one render per change: controls, panel, readout and the state card ----------------------------------------
function render() {
  const t = T[lang], v = lab.view, key = v === 'ramp' ? (S.sec || 'ramp') : v;
  document.body.dataset.v = key;
  $('secRamp').style.display = v === 'ramp' ? '' : 'none';
  $('secTower').style.display = v === 'tower' && TW.phase === 'free' ? '' : 'none';
  $('secStamp').style.display = v === 'stamp' && M.phase === 'free' ? '' : 'none';
  $('slideBox').style.display = v === 'ramp' && S.sec === 'slice' ? '' : 'none';
  if (v === 'ramp') renderRamp(t); else if (v === 'tower') renderTower(t); else renderStamp(t);
  askEl.style.display = S.askOn ? '' : 'none';
}
const card = (t, k, full) => { const [emo, title, lead, body] = t.card[k][full ? 'f' : 'n']; return { emo, title, lead, body }; };

function renderRamp(t) {
  const open = secret.unlocked(), chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = chip('home', '🏠') + chip('slice', '🔪');
  if (S.sec === 'home') {
    S.askOn = false; lab.setGlow('rgba(255, 201, 74, .2)');
    const it = HOME.find((x) => x.id === S.pick), all = S.found.size === HOME.length;
    lab.setReadout(`${S.found.size} / ${HOME.length}`, '', '', '#FFC94A');
    lab.setState({ emo: '🏠', title: t.secrets.home[0], lead: t.secrets.home[1], body: all ? t.sec.homeText : it ? `${t.items[it.id]}: ${t.names[SOLID_NAME[it.solid]]}` : '', extra: '' });
    return;
  }
  if (S.sec === 'slice') {
    S.askOn = false; lab.setGlow('rgba(246, 200, 90, .2)');
    $('angLbl').textContent = t.sec.angle; $('angVal').textContent = `${S.angle}°`; $('angle').setAttribute('aria-label', t.sec.angle);
    lab.setReadout(`${S.angle}°`, t.sec.angle, S.angle <= 1 ? t.sec.circle : t.sec.oval, '#F6C85A');
    lab.setState({ emo: '🔪', title: t.secrets.slice[0], lead: t.secrets.slice[1], body: S.seenFlat && S.seenSlant ? t.sec.sliceText : '', extra: '' });
    return;
  }
  S.askOn = true; lab.setGlow('rgba(217, 168, 108, .24)');
  const kind = KIND[R.i], done = R.phase === 'done', run = R.phase !== 'ask', two = RIGHT[kind].length === 2;
  const verdict = done ? (R.ok ? `${t.right}${two ? ` ${t.r.both}` : ''}` : t.wrong) : run && !R.ok ? t.wrong : '';
  askEl.innerHTML = panelHTML({ q: t.r.q(t.names[NAME_KEY[kind]]), opts: t.r.o, ans: R.ans, right: RIGHT[kind], done, verdict, vcol: R.ok ? 'var(--ok)' : 'var(--wip)', next: done });
  lab.setReadout(`${R.i + 1} / 5`, t.names[NAME_KEY[kind]], done ? (R.ok ? t.right : t.wrong) : '', '#D9A86C');
  const c0 = card(t, 'ramp', R.full);
  lab.setState({ ...c0, body: done ? `${kind === 'coneL' ? `${t.r.cone} ` : ''}${t.r.why[NAME_KEY[kind]]}` : '', extra: `<div class="fine">${esc(t.fine)}</div>` });
}
function renderTower(t) {
  const free = TW.phase === 'free', reveal = TW.phase === 'reveal';
  S.askOn = !free; lab.setGlow('rgba(91, 141, 239, .24)');
  $('resetBtn').textContent = t.t.reset;
  if (!free) {
    askEl.innerHTML = panelHTML({ q: t.t.q, opts: t.t.o, ans: TW.ans, right: [2], done: TW.rdone, verdict: TW.rdone ? (TW.ok ? t.right : t.wrong) : '', vcol: TW.ok ? 'var(--ok)' : 'var(--wip)', next: TW.rdone });
    lab.setReadout('?', '', '', '#5B8DEF');
    lab.setState({ ...card(t, 'tower', TW.rdone), body: TW.rdone ? t.t.r : '', extra: '' });
    return;
  }
  lab.setReadout(esc(t.t.height(TW.stack.length)), t.t.best(TW.best), '', '#5B8DEF');
  lab.setState({ ...card(t, 'tower', true), body: '', extra: '' });
}
function renderStamp(t) {
  const ph = M.phase, free = ph === 'free';
  S.askOn = !free; lab.setGlow('rgba(180, 140, 242, .24)');
  const flatTxt = t.s.flat;
  if (ph === 'q1' || ph === 'r1') {
    const done = ph === 'r1' && M.done1;
    askEl.innerHTML = panelHTML({ q: t.s.q1, opts: ['3', '4', '6'], ans: M.ans1, right: [2], done, verdict: done ? (M.ok1 ? t.right : t.wrong) : (ph === 'r1' && !M.ok1 ? t.wrong : ''), vcol: M.ok1 ? 'var(--ok)' : 'var(--wip)', next: done });
    if (ph === 'q1') lab.setReadout('?', '', '', '#B48CF2'); else lab.setReadout(String(M.count), flatTxt, M.gstage === 2 ? t.s.hidden : '', '#B48CF2');
    lab.setState({ ...card(t, 'stamp', false), body: done ? t.s.r1 : '', extra: '' });
  } else if (ph === 'q2' || ph === 'r2') {
    const done = ph === 'r2';
    askEl.innerHTML = panelHTML({ q: t.s.q2, opts: t.s.o2, ans: M.ans2, right: [1], done, verdict: done ? (M.ok2 ? t.right : t.wrong) : '', vcol: M.ok2 ? 'var(--ok)' : 'var(--wip)', next: done });
    lab.setReadout(done ? '6' : '?', done ? flatTxt : '', '', '#B48CF2');
    lab.setState({ ...card(t, 'stamp', done), body: done ? t.s.r2 : '', extra: '' });
  } else {
    const k = M.shape, nm = t.names[{ cube: 'cube', cyl: 'cylinder', cone: 'cone', pyr: 'pyramid', ball: 'ball' }[k]];
    const f = { cube: 6, cyl: 2, cone: 1, pyr: 5, ball: 0 }[k], cv = k === 'cyl' || k === 'cone' || k === 'ball';
    $('shapeChips').innerHTML = ['cube', 'cyl', 'cone', 'pyr', 'ball'].map((x) => `<button class="chip ${x === k ? 'on' : ''}" data-act="shape" data-k="${x}">${esc(t.names[{ cube: 'cube', cyl: 'cylinder', cone: 'cone', pyr: 'pyramid', ball: 'ball' }[x]])}</button>`).join('');
    lab.setReadout(`<span style="font:800 18px/1.3 var(--sans);letter-spacing:0">${esc(t.s.count(nm, f, cv))}</span>`, '', '', '#B48CF2');
    lab.setState({ ...card(t, 'stamp', true), body: k === 'ball' && M.seq ? t.s.ball : '', extra: '' });
  }
}
render();
</script>
