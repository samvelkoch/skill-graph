  const t = T[lang], ts = t.scales, fy = h * .86, weighed = S.pred !== null, el = weighed ? time - S.weighAt : 0, heavy = isHeavy();

  // spring: the beam swings and settles
  const tgt = weighed && heavy ? .27 : 0, acc = 38 * (tgt - S.ang) - 4.2 * S.vel;
  S.vel += acc * dt; S.ang += S.vel * dt;
  const th = S.ang, L = Math.min(w * .27, 118), px = w / 2, py = h * .36, chain = h * .19, fs = clamp(h * .0021, .7, 1.2);
  // Osiris' doorway, closed until the weighing says so
  const dw = Math.min(100, w * .27), dh = h * .2, dx = w / 2 - dw / 2, dy = h * .095, open = weighed && !heavy ? ease((el - 1.4) / .9) : 0;
  c.save(); c.beginPath(); c.roundRect(dx, dy, dw, dh, [dw / 2, dw / 2, 4, 4]); c.clip();
  c.fillStyle = lgrad(c, 0, dy, 0, dy + dh, [[0, '#bfe9d8'], [1, '#6fbf7e']]); c.fillRect(dx, dy, dw, dh);
  if (open > 0) {
    c.strokeStyle = '#2e7d4a'; c.lineWidth = 2; for (let i = 0; i < 9; i++) { const rx = dx + 6 + i * (dw - 12) / 8; c.beginPath(); c.moveTo(rx, dy + dh); c.quadraticCurveTo(rx + Math.sin(time * 2 + i) * 3, dy + dh * .6, rx - 2, dy + dh * .45); c.stroke(); }
    god(c, 'osiris', w / 2, dy + dh + 2, (dh - 8) / 142, false, time);
  }
  const dwid = dw / 2 * (1 - ease(open));
  for (const sgn of [-1, 1]) { const x0 = sgn < 0 ? dx : dx + dw - dwid; c.fillStyle = lgrad(c, x0, 0, x0 + dwid, 0, [[0, '#2f6fc4'], [1, '#183f80']]); c.fillRect(x0, dy, dwid + .5, dh); }
  c.restore();
  c.beginPath(); c.roundRect(dx, dy, dw, dh, [dw / 2, dw / 2, 4, 4]); c.lineWidth = 2.5; c.strokeStyle = INK; c.stroke();
  if (open < .98) { c.fillStyle = gold(c, w / 2 - 4, dy + dh / 2 - 4, w / 2 + 4, dy + dh / 2 + 4); for (const sgn of [-1, 1]) { c.beginPath(); c.arc(w / 2 + sgn * 6, dy + dh * .6, 3.4 * (1 - open), 0, TAU); c.fill(); } }
  // figures
  shadow(c, 36, fy + 4, 24 * fs, 4 * fs); shadow(c, w - 36, fy + 4, 24 * fs, 4 * fs);
  god(c, 'anubis', 28, fy, fs, false, time); god(c, 'thoth', w - 30, fy, fs, true, time);
  // pillar
  path(c, [[px - 30, fy], [px - 22, fy - 14], [px + 22, fy - 14], [px + 30, fy]]); fillOut(c, lgrad(c, px - 30, 0, px + 30, 0, [[0, '#f6d77a'], [.5, '#e8b53a'], [1, '#a8721a']]), 2);
  c.beginPath(); c.roundRect(px - 9, py, 18, fy - 14 - py, 3); fillOut(c, lgrad(c, px - 9, 0, px + 9, 0, [[0, '#2f6fc4'], [.5, '#4d8fe0'], [1, '#183f80']]), 2);
  c.fillStyle = '#e8b53a'; for (let y = py + 12; y < fy - 22; y += 16) c.fillRect(px - 9, y, 18, 3);

  c.restore();
  const hv = clamp(.6 + .4 * heartNo() + .08 * (5 - heartAns()), .6, 2), hr = cl01((hv - .6) / 1);
  const pans = [[E1, 'heart'], [E2, 'feather']];

    else feather(c, cxx, pyy - 3, r / 40 * .95, Math.sin(time * 1.4) * .03 - th * .3);
    c.beginPath(); c.moveTo(cxx - r, pyy); c.quadraticCurveTo(cxx, pyy + r * .85, cxx + r, pyy); c.closePath(); fillOut(c, lgrad(c, cxx - r, pyy, cxx + r, pyy + r * .8, [[0, '#fff3b0'], [.5, '#e8b53a'], [1, '#a8721a']]), 2);
    c.beginPath(); c.ellipse(cxx, pyy, r, r * .16, 0, 0, TAU); fillOut(c, '#f6d77a', 1.6);
    pill(c, kind === 'heart' ? ts.heart : ts.feather, cxx, pyy + r * .85 + 18, { size: 12.5 });
  });
  c.beginPath(); c.arc(px, py, 8, 0, TAU); fillOut(c, gold(c, px - 6, py - 6, px + 6, py + 6), 2);
  pill(c, ts.anubis, 36, fy + 17, { size: 12 }); pill(c, ts.thoth, w - 40, fy + 17, { size: 12 });
  // Ammit waits at the foot of the pillar when the heart is heavier
  if (weighed && heavy && el > 1.2) {
    const u = easeOut((el - 1.2) / .9), as = clamp(h * .0021, .75, 1.25);
    c.save(); c.globalAlpha = u; ammit(c, px + 70 - (1 - u) * 60, fy - 2 - Math.sin(Math.PI * u) * 8, as, time); c.restore();
  }
  if (weighed && el > 1.2 && !S.shown) { S.shown = true; render(); }
}

// --- secret: Ra's night journey ----------------------------------------------------------------------------------
function drawRa(c, w, h, time) {
  const t = T[lang], P = 18, el = time - S.secAt, ph = (el % P) / P, day = ph < .5, u = day ? ph / .5 : (ph - .5) / .5, hy = h * .56;
  const d = day ? cl01(Math.sin(Math.PI * u) * 2.4) : 0, warm = day ? cl01(1 - Math.sin(Math.PI * u) * 2.2) : 0;
  const top = mixc('#0c1030', '#4aa8e8', d), mid = mixc('#2a2f6a', mixc('#f6d79a', '#f2a65a', warm), d);
  c.fillStyle = lgrad(c, 0, 0, 0, hy, [[0, top], [1, mid]]); c.fillRect(0, 0, w, hy);
  if (d < .9) { c.fillStyle = '#fff'; c.globalAlpha = 1 - d; for (let i = 0; i < 38; i++) { const sx = (i * 97 % 100) / 100 * w, sy = (i * 53 % 100) / 100 * hy * .8, tw = .5 + .5 * Math.sin(time * 2 + i); c.beginPath(); c.arc(sx, sy, .9 + tw * .8, 0, TAU); c.fill(); } c.globalAlpha = 1; }
  // dunes and a pyramid
  c.fillStyle = mixc('#2a2540', '#e0b46c', d); c.beginPath(); c.moveTo(0, hy); c.quadraticCurveTo(w * .25, hy - 26, w * .5, hy - 8); c.quadraticCurveTo(w * .78, hy - 30, w, hy - 6); c.lineTo(w, hy); c.fill();
  path(c, [[w * .08, hy - 4], [w * .2, hy - 52], [w * .32, hy - 4]]); fillOut(c, lgrad(c, w * .08, hy - 52, w * .32, hy, [[0, mixc('#4a4670', '#f3dca2', d)], [1, mixc('#2a2540', '#c99a55', d)]]), 2);
  // underworld below the horizon
  c.fillStyle = lgrad(c, 0, hy, 0, h, [[0, mixc('#1c2a5e', '#243c78', 1 - d)], [1, '#0a1030']]); c.fillRect(0, hy, w, h - hy);
  const ry = hy + (h - hy) * .46;
  c.fillStyle = lgrad(c, 0, ry - 16, 0, ry + 16, [[0, '#1b6f8a'], [1, '#0e3f5e']]); c.fillRect(0, ry - 16, w, 32);
  c.strokeStyle = 'rgba(160,230,230,.45)'; c.lineWidth = 1.4; for (let r = 0; r < 2; r++) { c.beginPath(); for (let x = 0; x <= w; x += 6) { const yy = ry - 5 + r * 11 + Math.sin(x * .08 + time * 1.5 + r) * 2; x ? c.lineTo(x, yy) : c.moveTo(x, yy); } c.stroke(); }
  glyphRow(c, 12, w - 12, hy + 20, 0, .22); glyphRow(c, 12, w - 12, h - 24, 2, .22);
  c.fillStyle = '#e8b53a'; c.fillRect(0, hy, w, 3);

  const sunG = c.createRadialGradient(-3, -30, 2, 0, -26, 15); sunG.addColorStop(0, '#ffe9a0'); sunG.addColorStop(.55, '#f4752f'); sunG.addColorStop(1, '#c7371f');

  c.beginPath(); c.moveTo(-36, -10); c.quadraticCurveTo(-32, 12, 0, 12); c.quadraticCurveTo(32, 12, 36, -10); c.quadraticCurveTo(30, -3, 0, -3); c.quadraticCurveTo(-30, -3, -36, -10); c.closePath();

}

// --- the loop ------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  W = w; H = h;
  c.save(); frame(c, w, h);
  if (S.sec === 'ra') drawRa(c, w, h, time);
  else if (lab.view === 'gods') drawGods(c, w, h, time);
  else if (lab.view === 'tomb') drawTomb(c, w, h, dt, time);
  else drawScales(c, w, h, dt, time);
  c.restore(); frameEdge(c, w, h);
});

// --- input -------------------------------------------------------------------------------------------------------------
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, v = lab.view;
  if (v === 'gods') {
    if (S.pick !== null || S.gi >= GODS.length) return;
    const n = S.geo.find((g) => x >= g.x && x <= g.x + g.w && y >= g.y && y <= g.y + g.h); if (!n) return;
    S.pick = n.id; if (n.id === S.order[S.gi]) { S.first++; sfx.good(); } else sfx.bad();
    render();
  } else if (v === 'tomb') {
    if (S.sealed || !S.tgeo) return;
    let best = null, bd = 1e9;
    S.items.forEach((it) => { const half = (it.slot >= 0 ? S.tgeo.isz : S.tgeo.tile) / 2 + 4, d = Math.hypot(it.x - x, it.y - y); if (Math.abs(it.x - x) <= half && Math.abs(it.y - y) <= half && d < bd) { best = it; bd = d; } });
    if (!best) return;
    if (best.slot >= 0) best.slot = -1; else { const used = S.items.map((q) => q.slot); let k = 0; while (used.includes(k)) k++; best.slot = k; }
    sfx.click(); render();
  }
});
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    if (S.sec === k) S.sec = null;
    else { if (k === 'sh' && v !== 'tomb') { lab.view = 'tomb'; lab.renderChrome(); } S.sec = k; S.secAt = now(); S.raPhase = ''; }
    sfx.click();
  } else if (act === 'gnext') { S.gi++; S.pick = null; sfx.click(); }
  else if (act === 'gagain') { S.order = shuffle(GODS); S.gi = 0; S.pick = null; S.first = 0; sfx.click(); }
  else if (act === 'seal') { S.sealed = true; S.revealed = false; S.sealAt = now(); sfx.push(); }
  else if (act === 'tagain') { S.sealed = false; S.revealed = false; S.items.forEach((it) => { it.slot = -1; it.was = false; }); sfx.click(); }
  else if (act === 'ans') { const i = S.ans.indexOf(null); if (i >= 0) { S.ans[i] = +b.dataset.v; (b.dataset.v === '1' ? sfx.good : sfx.tick)(); } }
  else if (act === 'pred') { S.pred = b.dataset.v; S.weighAt = now(); S.vel = 1.7; S.shown = false; sfx.push(); showStage(); }
  else if (act === 'sagain') { S.ans = [null, null, null, null, null]; S.pred = null; S.ang = 0; S.vel = 0; S.shown = false; sfx.click(); }
  render();
});

// --- one render per change ---------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, u = secret.unlocked();
  document.body.dataset.v = S.sec === 'ra' ? 'ra' : v;
  $('secGods').style.display = v === 'gods' && S.sec !== 'ra' ? '' : 'none';
  $('secTomb').style.display = v === 'tomb' && S.sec !== 'ra' ? '' : 'none';
  $('secScales').style.display = v === 'scales' && S.sec !== 'ra' ? '' : 'none';
  askEl.style.display = v === 'gods' && S.sec !== 'ra' ? '' : 'none';
  const sc = (k, emo) => `<button class="chip secret ${u ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${u ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('ra', '🚣') + sc('sh', '🧍');
  if (S.sec === 'ra') return renderRa(t);
  if (v === 'gods') renderGods(t); else if (v === 'tomb') renderTomb(t); else renderScales(t);
}
function renderRa(t) {
  const day = S.raPhase !== 'n';
  lab.setGlow(day ? 'rgba(240, 180, 80, .28)' : 'rgba(70, 90, 190, .32)');
  lab.setReadout(day ? '☀️' : '🌙', day ? t.ra.day : t.ra.night, '', day ? '#e8b53a' : '#6f8bd8');
  lab.setState({ emo: day ? '☀️' : '🌙', title: day ? t.ra.dT : t.ra.nT, lead: day ? t.ra.dL : t.ra.nL, body: '' });
  lab.setFacts(t.facts.gods);
}
function renderGods(t) {
  const g = t.gods, end = S.gi >= GODS.length, cur = S.order[Math.min(S.gi, 6)], picked = S.pick !== null, done = S.gi + (picked ? 1 : 0);
  lab.setGlow('rgba(232, 181, 58, .26)');
  lab.setReadout(`${done}/7`, g.sub, '', '#e8b53a');
  lab.setFacts(t.facts.gods);
  if (end) {
    askEl.innerHTML = `<div class="k">🏺</div><div class="v" style="color:var(--ok)">${esc(g.endT(S.first))}</div><p>${esc(g.endL)}</p>`;
    lab.setState({ emo: '🏆', title: g.endT(S.first), lead: g.endL, body: '' });
    $('godsBtns').innerHTML = `<button class="btn af-go" data-act="gagain">${esc(g.again)}</button>`; return;
  }
  const [name, job, rev] = g.list[cur];
  if (!picked) {
    askEl.innerHTML = `<div class="k">${esc(g.kick)} · ${S.gi + 1}/7</div><div class="q">“${esc(job)}”</div><p>${esc(g.tap)}</p>`;
    lab.setState({ emo: '🏺', title: g.kick, lead: job, body: '' });
    $('godsBtns').innerHTML = '';
  } else {
    const ok = S.pick === cur;
    askEl.innerHTML = `<div class="v" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? t.right : t.no)} ${esc(name)}</div><p>${esc(rev)}</p>`;
    lab.setState({ emo: ok ? '✅' : '🤔', title: `${ok ? t.right : t.no} ${name}`, lead: rev, body: '' });
    $('godsBtns').innerHTML = `<button class="btn af-go" data-act="gnext">${esc(g.next)}</button>`;
  }
}
function renderTomb(t) {
  const k = t.tomb, packed = S.items.filter((i) => i.slot >= 0), n = packed.length;
  lab.setGlow('rgba(47, 181, 168, .24)'); lab.setFacts(t.facts.tomb);
  if (S.sec === 'sh') {
    lab.setReadout('365', t.sh.unit, '', '#47c9bd');
    lab.setState({ emo: '🧍', title: t.sh.T, lead: t.sh.L, body: '' });
  } else if (S.revealed) {
    const real = packed.filter((i) => i.real).length, j = S.items.filter((i) => i.was).length, m = S.items.filter((i) => i.real && i.slot < 0).length, [ti, le, bo] = k.res(real, j, m);
    lab.setReadout(String(n), k.unit, '', '#e8b53a'); lab.setState({ emo: j ? '🙂' : '✅', title: ti, lead: le, body: bo });
  } else {
    lab.setReadout(String(n), k.unit, '', '#e8b53a');
    lab.setState({ emo: '⚱️', title: k.title, lead: k.lead, body: '' });
  }
  const sealing = S.sealed && !S.revealed;
  $('tombBtns').innerHTML = S.sealed
    ? `<button class="btn af-go" data-act="tagain"${sealing ? ' disabled' : ''}>${esc(k.again)}</button>`
    : `<button class="btn af-go" data-act="seal"${n ? '' : ' disabled'}>${esc(k.seal)}</button>${n ? '' : `<span class="af-note">${esc(k.none)}</span>`}`;
}
function renderScales(t) {
  const s = t.scales, a = heartAns(), weighed = S.pred !== null, heavy = isHeavy();
  lab.setGlow('rgba(232, 181, 58, .24)'); lab.setFacts(t.facts.scales);
  lab.setReadout(`${a}/5`, s.unit, '', '#e8b53a');
  const dots = `<div class="af-dots">${S.ans.map((x) => `<i class="${x === 1 ? 'on' : x === 0 ? 'no' : ''}"></i>`).join('')}</div>`;
  if (a < 5) {
    lab.setState({ emo: '⚖️', title: a ? s.step(a + 1) : s.title, lead: a ? s.qs[a] : s.lead, body: a ? '' : s.qs[0] });
    $('scBody').innerHTML = `${dots}<p class="af-q">${esc(s.qs[a])}</p><div class="af-row"><button class="af-big yes" data-act="ans" data-v="1">👍 ${esc(s.yes)}</button><button class="af-big" data-act="ans" data-v="0">${esc(s.noB)}</button></div>`;
  } else if (!weighed) {
    lab.setState({ emo: '🤔', title: s.predT, lead: s.predL, body: '' });
    $('scBody').innerHTML = `${dots}<p class="af-q">${esc(s.predT)}</p><div class="af-row"><button class="af-big" data-act="pred" data-v="bal">${esc(s.bal)}</button><button class="af-big" data-act="pred" data-v="heavy">${esc(s.heavy)}</button></div>`;
  } else {
    const settled = S.shown, ok = (S.pred === 'heavy') === heavy, line = heavy ? s.okHeavy : s.okBal;
    if (!settled) { lab.setState({ emo: '⚖️', title: s.title, lead: '', body: '' }); $('scBody').innerHTML = dots; return; }
    lab.setState({ emo: heavy ? '🐊' : '🌾', title: `${ok ? t.right : t.no}`, lead: line, body: '' });
    $('scBody').innerHTML = `${dots}<div class="af-row"><button class="btn af-go" data-act="sagain">${esc(s.again)}</button></div>`;
  }
}
render();
</script>
