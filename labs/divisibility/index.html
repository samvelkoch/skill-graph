    c.strokeStyle = '#a2503b'; c.lineWidth = 1.2; c.beginPath(); c.arc(p.x, p.head + 1.5, 4, .2, Math.PI - .2); c.stroke();
    // plate
    c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 8; c.shadowOffsetY = 4;
    const pg = c.createRadialGradient(p.x - R * .35, p.cy - R * .4, 2, p.x, p.cy, R * 1.05); pg.addColorStop(0, '#fbfdff'); pg.addColorStop(1, '#aebbd8');
    c.fillStyle = pg; c.beginPath(); c.arc(p.x, p.cy, R, 0, Math.PI * 2); c.fill(); c.restore();
    c.fillStyle = 'rgba(120,140,185,.35)'; c.beginPath(); c.arc(p.x, p.cy, R * .74, 0, Math.PI * 2); c.fill();
    if (shown) {
      const N = Math.min(each, 16);
      for (let i = 0; i < N; i++) { const a = i * 2.39996, rad = R * .62 * Math.sqrt((i + .5) / 16); candy(c, p.x + Math.cos(a) * rad, p.cy + Math.sin(a) * rad, Math.max(2.4, R * .1), CANDY[(i + j) % 5]); }
      pillText(c, fmt(each), p.x, p.cy + R + 14, '800 13px Nunito, sans-serif', '#fff', 'rgba(8,12,20,.8)', 7, 20);
      if (S.dealT < 1) { // a sweet on its way from the bag
        const ph = (S.dealT * 4 + j / k) % 1, ee = ph * ph * (3 - 2 * ph), fx = 170 + (p.x - 170) * ee, fy = 110 + (p.cy - 110) * ee - Math.sin(Math.PI * ee) * 26;
        candy(c, fx, fy, 4, CANDY[j % 5]);
      }
    }
  });
  c.restore();
}

// --- one loop for the three scenes -------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'hunt') drawHunt(c, w, h, dt, time);
  else if (v === 'why') drawWhy(c, w, h, dt, time);
  else drawShare(c, w, h, dt, time);
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function guess(g) {
  const n = validNum();
  if (n === null || S.d === 11 || revNow()) return;
  const d = S.d, yes = n % d === 0, ok = (g === 'y') === yes, dup = HIST[d].some((x) => x.n === n);
  S.rev = { d, n, yes, ok, dup }; S.justFound = null;
  if (!dup) {
    HIST[d].push({ n, yes });
    STREAK[d] = ok ? STREAK[d] + 1 : 0;
    if (STREAK[d] >= 3 && !FOUND[d]) { FOUND[d] = true; store.set('divisibility:found', FOUND); S.justFound = d; }
  }
  S.popAt = nowS(); (ok ? sfx.good : sfx.bad)(); showStage();
}
$('hNum').addEventListener('input', (ev) => {
  const v = ev.target.value.replace(/\D/g, '').slice(0, 9);
  if (v !== ev.target.value) ev.target.value = v;
  S.numStr = v; S.rev = null; S.justFound = null; render();
});
$('hNum').addEventListener('focus', (ev) => ev.target.select());
$('hNum').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') ev.target.blur(); });
$('secHunt').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.d) { S.d = +b.dataset.d; S.rev = null; S.justFound = null; sfx.tick(); }
  else if (b.dataset.g) { guess(b.dataset.g); }
  else if (b.id === 'hRand') { S.numStr = String(pickNum(S.d === 11 ? 11 : S.d)); S.rev = null; S.justFound = null; sfx.click(); }
  else if (b.id === 'hShow') { FOUND[S.d] = true; store.set('divisibility:found', FOUND); S.justFound = null; sfx.good(); }
  else if (b.dataset.sec === 'eleven') {
    if (!secret.unlocked()) return secret.open();
    S.d = 11; S.numStr = '918082'; S.rev = null; S.justFound = null; sfx.click();
  }
  render();
});
$('secWhy').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'wGo') { document.querySelector('#views [data-view=hunt]')?.click(); return; }
  if (b.dataset.o !== undefined) {
    const g = +b.dataset.o; S.wAns = g; S.wFresh = true; S.wtg = 2; (g === dsum(S.wn) ? sfx.good : sfx.bad)(); showStage();
  } else if (b.dataset.st) { S.wtg = +b.dataset.st; S.wFresh = false; sfx.click(); }
  else if (b.dataset.num) { S.wn = +b.dataset.num; S.wtg = 0; S.wt = 0; S.wFresh = false; sfx.tick(); }
  else if (b.dataset.sec === 'cast') {
    if (!secret.unlocked()) return secret.open();
    S.wsec = S.wsec === 'cast' ? null : 'cast';
    if (S.wsec) { S.castEx = 0; S.cast = { a: '1234', b: '5678', c: '6912' }; }
    sfx.click();
  } else if (b.dataset.ex !== undefined) {
    const i = +b.dataset.ex; S.castEx = i; S.cast = { a: '1234', b: '5678', c: ['6912', '6812', '6192'][i] }; sfx.click();
  }
  render();
});
['cA', 'cB', 'cC'].forEach((id) => $(id).addEventListener('input', (ev) => {
  const v = ev.target.value.replace(/\D/g, '').slice(0, id === 'cC' ? 8 : 7);
  if (v !== ev.target.value) ev.target.value = v;
  S.cast[{ cA: 'a', cB: 'b', cC: 'c' }[id]] = v; S.castEx = -1; render();
}));
$('secShare').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.k) {
    const k = +b.dataset.k;
    if (S.sb >= 3) { S.sk = k; S.dealT = 0; }
    else if (!S.sck) { S.tick[k] = !S.tick[k]; S.sk = k; }
    else { S.sk = k; S.dealT = 0; }
    sfx.tick();
  } else if (b.id === 'sMain') {
    if (S.sb >= 3) { S.sb = 0; S.sc = 0; S.tick = {}; S.sck = false; S.sk = 3; S.dealT = 1; sfx.click(); }
    else if (!S.sck) {
      const n = BAGS[S.sb], perfect = KS.every((k) => !!S.tick[k] === (n % k === 0));
      S.sck = true; S.dealT = 0; if (perfect) S.sc++; (perfect ? sfx.good : sfx.bad)(); showStage();
    } else { S.sb++; if (S.sb < 3) { S.tick = {}; S.sck = false; S.sk = 3; S.dealT = 1; } sfx.click(); }
  }
  render();
});

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secHunt').style.display = v === 'hunt' ? '' : 'none';
  $('secWhy').style.display = v === 'why' ? '' : 'none';
  $('secShare').style.display = v === 'share' ? '' : 'none';
  if (v === 'hunt') renderHunt(t); else if (v === 'why') renderWhy(t); else renderShare(t);
}

function ruleBox(t, d, n, just) {
  if (!FOUND[d]) return '';
  const kind = KIND[d]; let ex = '';
  if (n) {
    if (kind === 'last') ex = t.h.ex.last(fmt(n), n % 10);
    else if (kind === 'last2') ex = t.h.ex.last2(fmt(n), n % 100);
    else if (kind === 'sum') ex = t.h.ex.sum(fmt(n), [...String(n)].join(' + '), dsum(n));
  }
  return `<div class="dv-rule"><b>${esc(just ? t.h.found : t.h.rule)}</b><p>${esc(t.h.rules[d])}</p>${ex ? `<p>${esc(ex)}</p>` : ''}</div>`;
}

function renderHunt(t) {
  const d = S.d, n = validNum(), rv = revNow(), live = d === 11 && n !== null, h = t.h, known = ruleKnown(), un = secret.unlocked();
  lab.setGlow('rgba(224, 176, 80, .26)');
  $('hDivL').textContent = h.divL;
  $('hDial').innerHTML = DIALS.map((k) => `<button class="chip dv-k${k === d ? ' on' : ''}" data-d="${k}" type="button">${k}</button>`).join('');
  const inp = $('hNum'); if (inp.value !== S.numStr) inp.value = S.numStr; inp.placeholder = h.ph; inp.setAttribute('aria-label', h.ph);
  $('hRand').textContent = h.rand;
  const gy = document.querySelector('.dv-gy'), gn = document.querySelector('.dv-gn');
  gy.textContent = h.yes; gn.textContent = h.no;
  $('hGuess').hidden = d === 11; gy.disabled = gn.disabled = n === null || !!rv;
  const hs = HIST[d];
  $('hStreakRow').hidden = d === 11 || !!FOUND[d];
  $('hDots').textContent = [0, 1, 2].map((i) => (i < Math.min(3, STREAK[d]) ? '●' : '○')).join(' ');
  $('hSL').textContent = h.streak(Math.min(3, STREAK[d]));
  $('hDots').hidden = $('hSL').hidden = !!FOUND[d];
  const sb = $('hShow'); sb.textContent = h.show; sb.hidden = !!FOUND[d] || hs.length < 3 || d === 11;
  $('hHist').hidden = d === 11 || !hs.length;
  $('hHist').innerHTML = `<span class="dv-hl">${esc(h.hist)}</span>` + hs.slice(-8).map((x) => {
    let note = '';
    if (FOUND[d]) { const kd = KIND[d]; note = kd === 'sum' ? `${dsum(x.n)}` : kd === 'last' ? `…${x.n % 10}` : `…${String(x.n % 100).padStart(2, '0')}`; }
    return `<span class="dv-h ${x.yes ? 'g' : 'r'}">${esc(fmt(x.n))}${note ? `<i>${esc(note)}</i>` : ''}</span>`;
  }).join('');
  $('hSecRow').hidden = !(known || un);
  $('hSec').innerHTML = `<button class="chip secret ${un ? 'open' : ''} ${d === 11 ? 'on' : ''}" data-sec="eleven" type="button">${un ? `🔔 ${esc(t.secrets.eleven[0])}` : '🔒 ???'}</button>`;

  let st, rd;
  if (live) {
    const a = altOf(n), yes = a.yes;
    rd = [fmt(n), '÷ 11', yes ? h.pill[0] : h.pill[1]];
    st = { emo: '🔔', title: yes ? h.alt.yes : h.alt.no, lead: `${a.expr} = ${a.sum}`, body: yes ? h.alt.leadY : h.alt.leadN, extra: `<div class="dv-rule"><b>${esc(h.rule)}</b><p>${esc(h.rules[11])}</p></div>` };
  } else if (rv) {
    rd = [fmt(rv.n), `÷ ${d}`, rv.yes ? h.pill[0] : h.pill[1]];
    st = { emo: rv.ok ? '✅' : '🤔', title: rv.ok ? h.ok : h.no, lead: h.lamp(fmt(rv.n), d, rv.yes), body: rv.dup ? h.dup : '', extra: ruleBox(t, d, rv.n, S.justFound === d) };
  } else if (n !== null) {
    rd = ['?', `÷ ${d}`, ''];
    st = { emo: '💡', title: h.e1.title, lead: h.e1.lead(d), body: '', extra: ruleBox(t, d, hs.length ? hs[hs.length - 1].n : 0, false) };
  } else {
    rd = ['?', `÷ ${d}`, ''];
    st = { emo: '⌨️', title: h.e0.title, lead: h.e0.lead(d), body: '', extra: ruleBox(t, d, hs.length ? hs[hs.length - 1].n : 0, false) };
  }
  lab.setReadout(rd[0], rd[1], rd[2], '#e0b050');
  lab.setState(st);
  lab.setFacts(live ? t.facts.eleven : t.facts.hunt);
}

function renderWhy(t) {
  const w = t.w, gate = !ruleKnown(), n = S.wn, dg = [Math.floor(n / 100), Math.floor(n / 10) % 10, n % 10], sum = dsum(n), r = sum % 9, f = Math.floor(sum / 9);
  const un = secret.unlocked(), cast = !gate && S.wsec === 'cast', asked = S.wAns !== null;
  lab.setGlow('rgba(95, 168, 160, .26)');
  $('wGate').hidden = !gate;
  $('wGateP').textContent = w.gateP; $('wGo').textContent = w.go(t.views.hunt);
  $('wAsk').hidden = gate || asked || cast;
  $('wRun').hidden = gate || !asked || cast;
  $('wCast').hidden = !cast;
  $('wSecRow').hidden = gate || !asked || !(un || ruleKnown());
  $('wSec').innerHTML = `<button class="chip secret ${un ? 'open' : ''} ${cast ? 'on' : ''}" data-sec="cast" type="button">${un ? `✅ ${esc(t.secrets.cast[0])}` : '🔒 ???'}</button>`;
  $('wQ').textContent = w.q;
  $('wOpts').innerHTML = [2, 10, 12].map((o) => `<button class="dv-opt" data-o="${o}" type="button">${o}</button>`).join('');
  $('wSteps').innerHTML = [1, 2, 3].map((i) => `<button data-st="${i}" class="${Math.round(S.wtg) === i ? 'on' : ''}" type="button">${esc(w.steps[i - 1])}</button>`).join('');
  $('wNumL').textContent = w.numL;
  $('wNums').innerHTML = WNUMS.map((x) => `<button class="chip dv-num${x === S.wn ? ' on' : ''}" data-num="${x}" type="button">${x}</button>`).join('');
  if (cast) return renderCast(t);
  const p = dg.join(' + '), step = Math.round(S.wtg);
  let st, pill = '';
  if (gate) {
    st = { emo: '🔒', title: w.gateT, lead: w.gateL, body: '', extra: '' };
    lab.setFacts([]);
  } else {
    if (!asked || step <= 0) st = { emo: '🧱', title: w.pre.title, lead: w.pre.lead, body: '', extra: '' };
    else if (step === 1) st = { emo: '✂️', title: w.s1.title, lead: w.s1.lead, body: '', extra: '' };
    else if (step === 2) st = { emo: '🧺', title: w.s2.title(sum), lead: w.s2.lead(p, sum), body: '', extra: '' };
    else st = { emo: '🔢', title: w.s3.title(r), lead: w.s3.lead(sum, r, fmt(n)), body: '', extra: '' };
    pill = step === 2 ? w.pill2(sum) : step === 3 ? w.pill3(r) : '';
    if (asked && S.wFresh && step === 2) { // the verdict on the first guess (372), until the child moves on
      const ok = S.wAns === sum;
      st = { emo: ok ? '✅' : '🤔', title: ok ? w.right : w.not(S.wAns), lead: w.leadAns(p, sum), body: '', extra: '' };
    }
    lab.setFacts(t.facts.why);
  }
  lab.setReadout(fmt(n), w.comp(dg[0], dg[1], dg[2]), pill, '#5fa8a0');
  lab.setState(st);
}

function renderCast(t) {
  const c = t.c, info = castInfo();
  ['a', 'b', 'c'].forEach((k, i) => { const el = $('c' + k.toUpperCase()); if (el.value !== S.cast[k]) el.value = S.cast[k]; el.setAttribute('aria-label', c.lbl[i]); });
  $('cEx').innerHTML = c.ex.map((x, i) => `<button class="chip dv-num${i === S.castEx ? ' on' : ''}" data-ex="${i}" type="button">${esc(x)}</button>`).join('');
  lab.setGlow('rgba(224, 176, 80, .26)');
  const ok = S.cast.a !== '' && S.cast.b !== '' && S.cast.c !== '';
  let st;
  if (!ok) st = { emo: '✏️', title: c.bad, lead: '', body: '', extra: '' };
  else if (info.pass && info.right) st = { emo: '✅', title: c.pass.title, lead: c.pass.lead(info.ra, info.rb, info.rs, info.rc), body: '', extra: '' };
  else if (info.pass) st = { emo: '😈', title: c.slip.title, lead: c.slip.lead(fmt(info.real)), body: '', extra: '' };
  else st = { emo: '🚨', title: c.fail.title, lead: c.fail.lead(info.rs, info.rc, fmt(info.real)), body: '', extra: '' };
  lab.setReadout(`${fmt(info.a)} + ${fmt(info.b)}`, `= ${fmt(info.cc)} ?`, info.pass ? '✓' : '✗', '#e0b050');
  lab.setState(st);
  lab.setFacts(t.facts.cast);
}

function renderShare(t) {
  const s = t.s, end = S.sb >= 3, bi = Math.min(S.sb, 2), n = BAGS[bi], k = S.sk, q = Math.floor(n / k), r = n % k, chk = S.sck;
  lab.setGlow('rgba(217, 130, 95, .24)');
  $('sBag').textContent = s.bag(bi + 1); $('sKidsL').textContent = s.kidsL;
  const okN = chk ? KS.filter((x) => !!S.tick[x] === (n % x === 0)).length : 0;
  $('sKids').innerHTML = KS.map((x) => {
    const ev = n % x === 0, good = chk && !!S.tick[x] === ev;
    const cls = ['chip', 'dv-k', chk ? (good ? 'dv-ok' : 'dv-no') : '', chk ? (x === k ? 'dv-sel' : '') : (S.tick[x] ? 'on' : (x === k ? 'dv-sel' : ''))].filter(Boolean).join(' ');
    return `<button class="${cls}" data-k="${x}" type="button" aria-pressed="${!!S.tick[x]}">${x}${chk ? (ev ? ' ✓' : ' ✗') : ''}</button>`;
  }).join('');
  $('sMain').textContent = end ? s.again : chk ? s.next : s.check;
  $('sHint').textContent = chk ? s.hint : s.hintPre;
  const sw = lang === 'ru' ? ruPlural(n, 'конфета', 'конфеты', 'конфет') : s.sweets;
  let st, pill = '';
  const known = ruleKnown();
  lab.setFacts(known ? t.facts.share : t.facts.share.slice(1));
  if (end) {
    st = { emo: '🏆', title: s.endT(S.sc), lead: s.endL, body: '', extra: '' };
    pill = `${okN}/7`;
  } else if (!chk) {
    st = { emo: '🍬', title: s.preT, lead: s.preL(fmt(n), lang === 'ru' ? ruPlural(n, 'конфета', 'конфеты', 'конфет') : ''), body: '', extra: '' };
  } else {
    const rs = r === 0 ? s.even(fmt(n), k, fmt(q)) : s.odd(fmt(n), k, fmt(q), r, lang === 'ru' ? ruPlural(r, 'конфета', 'конфеты', 'конфет') : '');
    const body = k === 6 ? s.six(n % 2 === 0, n % 3 === 0) : '';
    st = { emo: okN === 7 ? '✅' : '🤔', title: okN === 7 ? s.allT : s.someT(okN), lead: rs, body, extra: FOUND[k] ? ruleBox(t, k, 0, false) : '' };
    pill = s.pill(okN);
  }
  lab.setReadout(fmt(n), sw, pill, '#d9825f');
  lab.setState(st);
}
render();
</script>
