  c.beginPath(); c.moveTo(16, 114); c.lineTo(53, 86); c.lineTo(90, 114); c.closePath(); c.fillStyle = '#6b3326'; c.fill(); c.strokeStyle = '#3a1810'; c.lineWidth = 1.5; c.stroke();

function drawBeard(c, w, h, time) {

  let g = c.createLinearGradient(0, 0, CW, CH); g.addColorStop(0, '#24607f'); g.addColorStop(1, '#163a52'); c.fillStyle = g; c.fillRect(0, 0, CW, CH);
  g = c.createRadialGradient(150, 70, 0, 150, 70, 300); g.addColorStop(0, 'rgba(255,255,255,.14)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(0, 0, CW, CH);
  const k = Math.floor(time / 2.6), f = time - k * 2.6, a = (k + eIO(f / 1.0)) * Math.PI, cs = Math.cos(a), sx = Math.abs(cs), hop = Math.sin(clamp01(f / 1.0) * Math.PI) * 34;

  c.save(); c.translate(200, 150 - hop); c.scale(Math.max(0.04, sx), 1);
  const edge = (1 - sx) * 9; // thickness shows while it turns
  c.fillStyle = '#7a4a20'; c.beginPath(); c.arc(edge * (cs > 0 ? 1 : -1) * 0.6, 3, 80, 0, 7); c.fill();
  const tg = c.createRadialGradient(-26, -30, 4, 0, 0, 84); tg.addColorStop(0, '#e6a36a'); tg.addColorStop(0.7, '#b9743c'); tg.addColorStop(1, '#8a5428');
  c.beginPath(); c.arc(0, 0, 80, 0, 7); c.fillStyle = tg; c.fill(); c.lineWidth = 2.4; c.strokeStyle = '#5a3416'; c.stroke();

    c.beginPath(); c.moveTo(-30, -12); c.quadraticCurveTo(-22, 40, 0, 52); c.quadraticCurveTo(22, 40, 30, -12); c.quadraticCurveTo(24, 6, 0, 8); c.quadraticCurveTo(-24, 6, -30, -12); c.closePath();
    const bgd = c.createLinearGradient(-30, 0, 30, 52); bgd.addColorStop(0, '#7a5230'); bgd.addColorStop(1, '#3d2614'); c.fillStyle = bgd; c.fill(); c.strokeStyle = '#2a190b'; c.lineWidth = 1.4; c.stroke();
    c.strokeStyle = 'rgba(30,18,8,.55)'; c.lineWidth = 1.2; c.beginPath(); for (const x of [-16, -6, 4, 14]) { c.moveTo(x, 12); c.quadraticCurveTo(x * 0.8, 30, x * 0.5, 46); } c.stroke();

// --- the frame loop -----------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec === 'a') return drawBoat(c, w, h, time);
  if (S.sec === 'b') return drawBeard(c, w, h, time);
  if (lab.view === 'routes') drawRoutes(c, w, h, dt, time);
  else if (lab.view === 'city') drawCity(c, w, h, dt, time);
  else drawRanks(c, w, h, dt, time);
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ppAsk').addEventListener('click', (ev) => {
  const b = ev.target.closest('.pp-opt'); if (!b) return;
  const v = lab.view; if (S.ans[v] !== null) return;
  const i = +b.dataset.i; S.ans[v] = i; (i === RIGHT[v] ? sfx.good : sfx.bad)();
  if (v === 'routes') { S.rt = { t0: now(), dist: 0, days: 0, arr: -1 }; S.chartOn = false; setTimeout(() => { S.chartOn = true; setChart(T[lang]); }, 2200); }
  else if (v === 'city') { S.yearT = 1712; S.crownT = -1; }
  render(); showStage();
});
$('ppSpeed').addEventListener('input', (ev) => { S.speed = +ev.target.value; sfx.tick(); render(); });
$('ppYear').addEventListener('input', (ev) => { S.yearT = +ev.target.value; sfx.tick(); render(); });
$('ppYrs').addEventListener('input', (ev) => { S.yrs = +ev.target.value; sfx.tick(); render(); });
$('ppSec').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-k]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); render();
});

// --- one render per change: controls, readout, state card and facts ----------------------------------------
function show(id, on) { $(id).style.display = on ? 'block' : 'none'; }
function setChart(t) {
  const sp = S.speed, dA = KM_A / sp, dB = KM_B / sp, on = S.chartOn;
  $('ppSpeedL').textContent = t.speed; $('ppSpeedV').textContent = t.perDay(sp); $('ppSpeed').value = sp;
  $('ppNmA').textContent = t.places.arkh; $('ppNmB').textContent = t.places.spb;
  $('ppBarA').style.width = on ? `${Math.min(100, dA / 40 * 100)}%` : '0%'; $('ppBarB').style.width = on ? `${Math.min(100, dB / 40 * 100)}%` : '0%';
  $('ppDA').textContent = on ? t.days(dec(dA)) : ''; $('ppDB').textContent = on ? t.days(dec(dB)) : '';
  $('ppDiff').textContent = on ? `−${t.days(dec(dA - dB))}` : '';
}
function render() {
  const t = T[lang], v = lab.view, ans = S.ans[v], asking = ans === null;
  document.body.dataset.v = v;
  show('ppRoutesBox', v === 'routes' && !asking); show('ppCityBox', v === 'city'); show('ppRanksBox', v === 'ranks');
  // the question, its chips and the verdict
  const ask = $('ppAsk'); ask.className = `pp-ask${asking ? '' : ' done'}`;
  const opts = t[`${v}Opts`], right = RIGHT[v];
  ask.innerHTML = `<div class="pp-q">${esc(t[`${v}Ask`])}</div><div class="pp-opts">${opts.map((o, i) => `<button class="pp-opt${asking ? '' : ' lock'}${!asking && i === right ? ' ok' : ''}${!asking && ans === i && i !== right ? ' no' : ''}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
    + (asking ? '' : `<div class="pp-verdict" style="color:${ans === right ? 'var(--ok)' : 'var(--wip)'}">${esc(ans === right ? t[`${v}Right`] : t[`${v}Wrong`])}</div>`);
  // secrets
  const open = secret.unlocked();
  $('ppSec').innerHTML = [['a', '⚓'], ['b', '🧔']].map(([k, emo]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  // per-view controls
  $('ppMonths').innerHTML = t.months.map((m, i) => `<i class="${[10, 11, 0, 1, 2, 3, 4].includes(i) ? 'ice' : ''}">${esc(m)}</i>`).join(''); $('ppIceL').textContent = t.ice;
  setChart(t);
  $('ppYearL').textContent = t.year; $('ppYearV').textContent = S.yearT; $('ppYear').value = S.yearT; $('ppYear').disabled = asking;
  $('ppBefore').textContent = t.before; $('ppYrsL').textContent = t.service; $('ppYrsV').textContent = S.yrs; $('ppYrs').value = S.yrs; $('ppYrs').disabled = asking;

  if (S.sec) {
    const k = S.sec, emo = k === 'a' ? '⚓' : '🧔';
    lab.setGlow('rgba(233, 196, 106, .26)'); lab.setReadout(emo, t.secrets[k][0], '', '#b8892b');
    lab.setState({ emo, title: t.secrets[k][0], lead: k === 'a' ? t.boatText : t.beardText, body: '', extra: '' }); lab.setFacts([]);

    lab.setGlow('rgba(42, 157, 143, .26)');

  } else if (v === 'city') {
    lab.setGlow('rgba(233, 196, 106, .24)');
    const keys = Object.keys(t.built).map(Number).filter((n) => n <= S.yearT && (n !== 1712 || !asking === true)), last = keys[keys.length - 1];
    lab.setReadout(S.yearT, t.built[last] ?? '', !asking && S.yearT >= 1712 ? t.capital : '', '#b8892b');
  } else {

render();
