// --- small helpers -------------------------------------------------------------------------------------------
const TAU = Math.PI * 2;
const ease = (x) => x * x * (3 - 2 * x);
const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1, p = x - 1; return 1 + c3 * p * p * p + c1 * p * p; };
const hex2 = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const toHex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hex2(a), B = hex2(b); return toHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); };
const shade = (h, k) => (k >= 0 ? mix(h, '#000000', k) : mix(h, '#ffffff', -k));
const greyed = (h, s) => { const [r, g, b] = hex2(h), l = r * 0.3 + g * 0.59 + b * 0.11, d = 1 - 0.14 * s; return toHex(lerp(r, l, s) * d, lerp(g, l, s) * d, lerp(b, l, s) * d); };
const rgba = (h, a) => { const [r, g, b] = hex2(h); return `rgba(${r},${g},${b},${a})`; };
const fmtN = (n) => Math.round(n).toLocaleString(lang);
const fmtC = (n) => { // short axis numbers: 500, 1K, 2.5M (per language)
  const ab = T[lang].abbr, f = (x) => (+x.toFixed(1)).toLocaleString(lang);

  return n >= 1e6 ? f(n / 1e6) + sp + ab[1] : n >= 1000 ? f(n / 1000) + sp + ab[0] : String(Math.round(n));
};
const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); };
const body = (c, x, y, rx, ry, fill, line, rot = 0, lw = 1) => {
  ell(c, x, y, rx, ry, rot); c.fillStyle = fill; c.fill();
  if (line) { c.lineWidth = lw; c.strokeStyle = line; c.stroke(); }
};
const dot = (c, x, y, r, fill) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); c.fillStyle = fill; c.fill(); };
const lin = (c, x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rad = (c, x, y, r0, r1, stops) => { const g = c.createRadialGradient(x, y, Math.max(0, r0), x, y, Math.max(0.01, r1)); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
// canvas text on a dark rounded pill, clamped inside the canvas; sc pops it
function pill(c, W, text, x, y, anchor = 'l', size = 12.5, sc = 1) {
  c.save(); c.font = `800 ${size}px Nunito, sans-serif`; c.textBaseline = 'middle'; c.textAlign = 'left';
  const tw = c.measureText(text).width + 18, th = size + 11;
  let px = anchor === 'r' ? x - tw : anchor === 'c' ? x - tw / 2 : x;
  px = clamp(px, 4, Math.max(4, W - tw - 4));
  c.translate(px + tw / 2, y + th / 2); c.scale(sc, sc);
  c.beginPath(); c.roundRect(-tw / 2, -th / 2, tw, th, th / 2); c.fillStyle = 'rgba(8,10,18,.84)'; c.fill();
  c.fillStyle = '#ffffff'; c.globalAlpha = 1; c.fillText(text, -tw / 2 + 9, 1);
  c.restore();
}

// --- the model (documented) ------------------------------------------------------------------------------------
// Step dt = 0.05 year. R rabbits, G grass 0..1, B bilbies. Only the SHAPE is meant to be true.
//  at home (enemies): R += dt*R*1.2*(1 - R/80), so the number sits near 80.
//  new land (no enemies): R += dt*R*(1.3*G - 0.4 - starving - virus - foxEat); starving = 4*max(0, 0.45 - G)
//      (hungry rabbits die faster: that is what makes the crash and the wobble).
//  grass: G += dt*(0.2*(1-G) - 1.0*G*R/CAP), CAP = 2,000,000 rabbits (the island's size), clamped 0.02..1.
//  bilbies: start 400, B += dt*B*(0.6*G - 0.35 - foxes), cap 600.
//  every step R is nudged by a small random amount (about ±5 % a year).
// Constants were tuned so that: at home the rabbits stay under ~100 for 30 years; in a new land they pass a million
// after ~13 years, the grass collapses, the rabbits fall back and wobble; the bilbies fade as the grass goes.
// Secrets: virus (2.5 for 2 years, then resistance: down to 0.2 over 6 years; the survivors never drop below 3 % of the
// number at release) and foxes (rabbits -0.25 a year, bilbies -0.25 a year more).
const CAP = 2e6, YEARS = 30, DT = 0.05, YEAR_SEC = 0.6;
const newSim = (mode) => ({ mode, phase: 'none', n: 0, acc: 0, R: 24, G: 1, B: 400, pts: [[0, 24, 1, 400]], maxR: 24, virusT: null, vPeak: 0, foxes: false, guess: null });
function step(s) {
  const nz = (Math.random() * 2 - 1) * 0.011;
  if (s.mode === 'home') s.R += DT * s.R * 1.2 * (1 - s.R / 80);
  else {
    let virus = 0;
    if (s.virusT !== null) { virus = s.virusT < 2 ? 2.5 : Math.max(0.2, 2.5 - 2.3 * (s.virusT - 2) / 6); s.virusT += DT; }
    s.R += DT * s.R * (1.3 * s.G - 0.4 - 4 * Math.max(0, 0.45 - s.G) - virus - (s.foxes ? 0.25 : 0));
    if (s.virusT !== null) s.R = Math.max(s.R, s.vPeak * 0.03);
  }
  s.R = Math.max(1, s.R * (1 + nz));
  s.G = clamp(s.G + DT * (0.2 * (1 - s.G) - 1.0 * s.G * s.R / CAP), 0.02, 1);
  s.B = Math.max(0.5, Math.min(600, s.B + DT * s.B * (0.6 * s.G - 0.35 - (s.foxes ? 0.25 : 0))));
  s.n++;
  s.pts.push([s.n * DT, s.R, s.G, s.B]);
  if (s.R > s.maxR) s.maxR = s.R;
}
const yearOf = (s) => s.n * DT;
// advance a running simulation by real seconds; true when the 30 years are over
function advance(s, dt) {
  s.acc += dt / YEAR_SEC;
  while (s.acc >= DT && s.n * DT < YEARS - 1e-9) { step(s); s.acc -= DT; }
  if (s.n * DT >= YEARS - 1e-9) { s.phase = 'done'; return true; }
  return false;
}

// --- hopping animals: one pool per kind; a pool of sprites stands for many animals ---------------------------------
const UNITS = []; for (let e = 0; e <= 8; e++) for (const m of [1, 2, 5]) UNITS.push(m * 10 ** e);
function herdN(N, max) { // how many sprites, and how many animals each one stands for
  if (N < 0.5) return { n: 0, unit: 1 };
  const unit = UNITS.find((u) => N / u <= max) ?? UNITS[UNITS.length - 1];
  return { n: Math.max(1, Math.round(N / unit)), unit };
}
const mkPool = (n, hopH) => Array.from({ length: n }, (_, i) => ({ i, u: 0, v: 0, fu: 0, fv: 0, tu: 0, tv: 0, p: -1, rest: Math.random() * 1.5, pop: 0, on: false, face: 1, land: 0, hopH, delay: 0, dead: false }));
const RAB = mkPool(60, 8), BIL = mkPool(6, 6), FOX = mkPool(3, 5), TOADS = mkPool(40, 9);
const inDom = (d, u, v) => (d === 'disk' ? u * u + v * v <= 0.49 : Math.abs(u) <= 0.72 && v >= 0.05 && v <= 0.95);
function randIn(d) {
  for (let k = 0; k < 30; k++) {
    const u = d === 'disk' ? Math.random() * 2 - 1 : (Math.random() * 2 - 1) * 0.72, v = d === 'disk' ? Math.random() * 2 - 1 : 0.05 + Math.random() * 0.9;
    if (inDom(d, u, v)) return [u, v];
  }
  return [0, d === 'disk' ? 0 : 0.5];
}
function spawn(a, pool, d, edge) {
  a.delay = 0;
  if (edge) { // arrives from the shore
    if (d === 'disk') { const ang = Math.random() * TAU; a.u = Math.cos(ang) * 0.98; a.v = Math.sin(ang) * 0.98; }
    else { a.u = Math.random() < 0.5 ? -0.98 : 0.98; a.v = 0.2 + Math.random() * 0.6; }
    a.delay = a.i * 0.03;
  } else { // born next to a parent
    const par = pool.filter((q) => q.on && q.pop > 0.5 && !q.dead);
    if (par.length) {
      const q = par[(Math.random() * par.length) | 0];
      a.u = q.u + (Math.random() - 0.5) * 0.14; a.v = q.v + (Math.random() - 0.5) * 0.12;
      if (!inDom(d, a.u, a.v)) { a.u = q.u; a.v = q.v; }
    } else [a.u, a.v] = randIn(d);
  }
  a.fu = a.u; a.fv = a.v; a.p = -1; a.rest = Math.random() * 0.5; a.land = 0;
}
function setOn(a, on, pool, d, edge) {
  if (a.dead) on = false;
  if (on && !a.on) { a.on = true; if (a.pop <= 0.001) spawn(a, pool, d, edge); }
  else if (!on && a.on) a.on = false;
}
function stepAgent(a, d, dt, speed = 1) {
  if (a.delay > 0) { a.delay -= dt; return; }
  a.pop = clamp(a.pop + (a.on ? dt : -dt) * 3.2, 0, 1);
  if (a.pop <= 0) return;
  a.land = Math.max(0, a.land - dt);
  if (a.p < 0) {
    a.rest -= dt;
    if (a.rest > 0) return;

    } else if (s.phase === 'none') release(s);
    else if (s.phase === 'ready') { if (s.guess !== null) startRun(s); }
    else if (s.phase === 'run') s.phase = 'pause';
    else if (s.phase === 'pause') s.phase = 'run';
    else { resetSim(S.mode); sfx.click(); }
  } else if (act === 'reset') { if (S.sec) setupSecret(S.sec); else resetSim(S.mode); sfx.click(); }
  else if (act === 'sec') { if (!secret.unlocked()) return secret.open(); setupSecret(b.dataset.k); sfx.click(); }
  else if (act === 'prev' || act === 'next') { goCase(S.cs.i + (act === 'next' ? 1 : -1)); return; }
  else if (act === 'topt') { if (td.phase === 'none') { td.guess = +b.dataset.i; sfx.click(); } }
  else if (act === 'tmain') {
    if (td.phase === 'none') { if (td.guess !== null) { td.phase = 'run'; showStage(); sfx.click(); } }
    else if (td.phase === 'run') td.phase = 'pause';
    else if (td.phase === 'pause') td.phase = 'run';
    else resetToads();
  } else if (act === 'treset') resetToads();
  render();
});
function resetToads() { S.td = { phase: 'none', t: 0, guess: null, jt: 0 }; TOADS.forEach((a) => { a.on = false; a.pop = 0; a.dead = false; }); resetCreatures(); sfx.click(); }

// cases: one card at a time; the answer flips it
function goCase(i) {
  if (i < 0 || i > 4 || i === S.cs.i) return;
  S.cs.i = i; sfx.tick(); render();
  const el = $('csCard'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}
$('csCard').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const i = S.cs.i;
  if (S.cs.ans[i] !== null) return;
  S.cs.ans[i] = +b.dataset.a; (S.cs.ans[i] === 1 ? sfx.good : sfx.bad)();
  S.cs.lock = true; setTimeout(() => { S.cs.lock = false; }, 560);
  const el = $('csCard'); el.classList.remove('in', 'pop'); el.classList.add('out');
  setTimeout(() => { el.innerHTML = cardHtml(T[lang], i); el.classList.remove('out'); el.classList.add('in'); }, 170);
  render();
});
let swipe = null;
csWrap.addEventListener('pointerdown', (ev) => { swipe = { x: ev.clientX, y: ev.clientY }; });
csWrap.addEventListener('pointerup', (ev) => {
  if (!swipe) return; const dx = ev.clientX - swipe.x, dy = ev.clientY - swipe.y; swipe = null;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 40) goCase(S.cs.i + (dx < 0 ? 1 : -1));
});
function cardHtml(t, i) {
  const c = t.cases[i], a = S.cs.ans[i], col = CASE_COL[i];
  const badge = (sm) => `<div class="cs-badge${sm ? ' sm' : ''}" style="background: radial-gradient(circle at 32% 28%, ${shade(col, -0.35)}, ${col} 55%, ${shade(col, 0.35)})">${c.emo}</div>`;
  if (a === null) return `${badge(false)}<div class="cs-name">${esc(c.name)}</div><div class="cs-where">📍 ${esc(c.where)}</div>
    <div class="cs-q">${esc(t.whyQ)}</div><div class="cs-opts">${t.whyOpts.map((o, j) => `<button class="cs-opt" data-a="${j}">${esc(o)}</button>`).join('')}</div>`;
  const ok = a === 1;
  return `<div class="cs-top">${badge(true)}<div><div class="cs-name">${esc(c.name)}</div><div class="cs-where">📍 ${esc(c.where)}</div></div></div>
    <span class="cs-verdict${ok ? '' : ' no'}">${esc(ok ? t.right : t.notQuite)}</span>
    <div class="cs-ans">✓ ${esc(t.whyOpts[1])}</div>
    <div class="cs-h">${esc(t.broughtBy)}</div><p class="cs-p">${esc(c.story)}</p>
    <div class="cs-h">${esc(t.missing)}</div><p class="cs-p">${esc(c.brake)}</p>`;
}

// --- one render per change: controls, state card, facts ---------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v; ro = '';
  $('ivPane').style.display = v === 'island' ? '' : 'none';
  $('csPane').style.display = v === 'cases' ? '' : 'none';
  $('tdPane').style.display = v === 'toads' ? '' : 'none';
  csWrap.style.display = v === 'cases' ? '' : 'none';
  tdCap.style.display = v === 'toads' ? '' : 'none';
  if (v === 'island') renderIsland(t); else if (v === 'cases') renderCases(t); else renderToads(t);
  lab.setFacts(t.facts[v] ?? []);
}
function renderIsland(t) {
  const s = cur(), ph = s.phase, sec = S.sec, unl = secret.unlocked();
  lab.setGlow('rgba(92, 184, 92, .28)');
  $('ivModes').innerHTML = ['home', 'away'].map((m) => `<button class="iv-mode${!sec && S.mode === m ? ' on' : ''}" data-act="mode" data-m="${m}">${esc(t[m])}</button>`).join('');
  const showPred = !sec && ph !== 'none', right = S.mode === 'home' ? 0 : 2, done = ph === 'done';
  $('ivPredict').style.display = showPred ? '' : 'none';
  if (showPred) {
    $('ivQ').textContent = t.predictQ;
    $('ivShapes').innerHTML = t.shapes.map((lbl, i) => {
      const cls = done ? (i === right ? ' good' : i === s.guess ? ' bad' : '') : i === s.guess ? ' on' : '';
      return `<button class="iv-shape${cls}" data-act="shape" data-i="${i}"${ph === 'ready' ? '' : ' disabled'}>${SHAPES[i]}<span>${esc(lbl)}</span></button>`;
    }).join('');
  }
  const ok = s.guess === right;
  $('ivVerdict').className = `iv-verdict${ok ? '' : ' no'}`;
  $('ivVerdict').innerHTML = !sec && done ? `<b>${esc(ok ? t.right : t.notQuite)}</b>${esc(S.mode === 'home' ? t.exHome : t.exAway)}` : '';
  const label = sec ? (ph === 'hold' ? (sec === 'virus' ? t.virusBtn : t.foxBtn) : ph === 'run' ? t.pause : ph === 'pause' ? t.resume : t.reset)
    : ph === 'none' ? t.release : ph === 'ready' ? t.run : ph === 'run' ? t.pause : ph === 'pause' ? t.resume : t.reset;
  const dis = !sec && ph === 'ready' && s.guess === null;
  $('ivMain').textContent = label; $('ivMain').disabled = dis;
  $('ivHint').textContent = dis ? t.pickFirst : '';
  $('ivReset').textContent = t.reset; $('ivReset').style.display = (sec ? ph !== 'hold' : ph !== 'none') && label !== t.reset ? '' : 'none';
  $('ivSecrets').innerHTML = [['virus', '🦠'], ['foxes', '🦊']].map(([k, e]) => `<button class="chip secret${unl ? ' open' : ''}${sec === k ? ' on' : ''}" data-act="sec" data-k="${k}">${unl ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  let st;
  if (sec) st = { emo: sec === 'virus' ? '🦠' : '🦊', title: t.secrets[sec][0], lead: ph === 'hold' ? t.ready : sec === 'virus' ? t.virusText : t.foxText };
  else if (S.sims.home.phase === 'done' && S.sims.away.phase === 'done') st = { emo: '🧠', title: t.state.islandBoth[0], lead: t.state.islandBoth[1], body: done ? (S.mode === 'home' ? t.exHome : t.exAway) : '' };
  else if (done) st = { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notQuite, lead: S.mode === 'home' ? t.exHome : t.exAway };
  else st = { emo: '🏝️', title: t.state.island0[0], lead: t.state.island0[1] };
  lab.setState({ body: '', ...st, extra: `<div class="fine">${esc(t.fine)}</div>` });
  ivReadout(s);
}
function renderCases(t) {
  const i = S.cs.i, c = t.cases[i], a = S.cs.ans[i];
  lab.setGlow(rgba(CASE_COL[i], 0.3));
  if (!S.cs.lock) $('csCard').innerHTML = cardHtml(t, i);
  $('csDots').innerHTML = S.cs.ans.map((x, j) => `<i class="${j === i ? 'cur ' : ''}${x === null ? '' : x === 1 ? 'ok' : 'no'}"></i>`).join('');
  $('csPrev').disabled = i === 0; $('csNext').disabled = i === 4;
  setRO(`${i + 1} / 5`, c.name, c.where, CASE_COL[i]);
  lab.setState(a === null ? { emo: '🌍', title: t.state.cases0[0], lead: t.state.cases0[1], body: '', extra: '' }
    : { emo: a === 1 ? '✅' : '🤔', title: a === 1 ? t.right : t.notQuite, lead: `${t.missing}: ${c.brake}`, body: '', extra: '' });
}
function renderToads(t) {
  const td = S.td, ph = td.phase, done = ph === 'done', ok = td.guess === 1;
  lab.setGlow('rgba(167, 163, 90, .28)');
  tdCap.textContent = t.toadIntro;
  $('tdQ').textContent = t.toadQ;
  $('tdOpts').innerHTML = t.toadOpts.map((o, i) => {
    const cls = done ? (i === 1 ? ' good' : i === td.guess ? ' bad' : '') : i === td.guess ? ' on' : '';
    return `<button class="iv-mode${cls}" data-act="topt" data-i="${i}"${ph === 'none' ? '' : ' disabled'}>${esc(o)}</button>`;
  }).join('');
  $('tdVerdict').className = `iv-verdict${ok ? '' : ' no'}`;
  $('tdVerdict').innerHTML = done ? `<b>${esc(ok ? t.right : t.notQuite)}</b>${esc(t.exToads)}` : '';
  const label = ph === 'none' ? t.releaseToads : ph === 'run' ? t.pause : ph === 'pause' ? t.resume : t.reset, dis = ph === 'none' && td.guess === null;
  $('tdMain').textContent = label; $('tdMain').disabled = dis; $('tdHint').textContent = dis ? t.pickFirst : '';
  $('tdReset').textContent = t.reset; $('tdReset').style.display = ph !== 'none' && ph !== 'done' ? '' : 'none';
  lab.setState(done ? { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notQuite, lead: t.exToads, body: '', extra: '' }
    : { emo: '🐸', title: t.state.toads0[0], lead: t.state.toads0[1], body: '', extra: '' });
  tdReadout(ph === 'none' ? 0 : 100 * 10 ** (td.t / 2));
}
render();
</script>
