const FONT = "Georgia, 'Times New Roman', serif";
const mctx = document.createElement('canvas').getContext('2d');
const tw = (s, px, wt = 400) => { mctx.font = `${wt} ${px}px ${FONT}`; return mctx.measureText(s).width; };
const spaced = (text, px, wt, inner) => { // "centre it with spaces": as many typed spaces as fit before the text
  const sp = tw(' ', px, wt) || 3;
  return ' '.repeat(Math.max(0, Math.round((inner - tw(text, px, wt)) / 2 / sp))) + text;
};
const sx = (s) => esc(s).replace(/ /g, '<i class="d"> </i>'); // every typed space is a real space; a mark can sit on it

function tweenW(to, ms) {
  const from = S.w, t0 = performance.now(); S.anim = true;
  const step = (now) => {

    S.w = Math.round(lerp(from, to, e)); render();

  requestAnimationFrame(step);
}

  const blk = (i) => `<div class="blk"><span class="hd ${S.done[i] ? 'on' : ''}" data-i="${i}">${esc(t.h.heads[i])}</span><div class="tx" style="width:92%"></div><div class="tx" style="width:${i % 2 ? 70 : 84}%"></div></div>`;
  const pg = (n) => `<div class="col"><div class="paper rp full">${pagesOf[n].map(blk).join('')}<div class="pgn">${n + 1}</div></div></div>`;
  const toc = S.sec === 'toc' ? `<div class="toc"><h4>${esc(t.h.toc)}</h4>${t.h.heads.map((h, i) => `<div class="tr" style="animation-delay:${i * 110}ms"><span>${esc(h)}</span><i></i><b>${i < 3 ? 1 : 2}</b></div>`).join('')}</div>` : '';
  return `<div class="cnts"><span class="cn red off" id="cnA"></span><span class="cn grn off" id="cnB"></span></div><div class="cols">${pg(0)}${pg(1)}</div>${toc}`;
}
function slotsFor(hand, n, t) {
  const seq = [{ k: 'h', t: t.f.ch[0] }];
  for (let i = 0; i < 3 + n; i++) seq.push({ k: 't' });
  if (hand) for (let i = 0; i < 5; i++) seq.push({ k: 'e' }); else seq.push({ k: 'p' });
  seq.push({ k: 'h', t: t.f.ch[1], two: true });
  for (let i = 0; i < 6; i++) seq.push({ k: 't' });
  const p1 = seq.slice(0, 9), rest = seq.slice(9);
  return [p1, rest.slice(0, 9)];
}
function pageSlots(list, hand) {
  return list.map((s, i) => {
    if (s.k === 'h') return `<div class="sl ${hand && s.two && list.indexOf(s) > 0 ? 'slid' : ''}">${esc(s.t)}</div>`;
    if (s.k === 'e') return `<div class="sl"><span class="e">¶</span></div>`;
    if (s.k === 'p') return `<div class="sl"><div class="pb2"><b>${esc(T[lang].f.brkL)}</b></div></div>`;
    return `<div class="sl"><div class="t" style="width:${[92, 78, 86, 64][i % 4]}%"></div></div>`;
  }).join('');
}
function fixBody(t, g) {
  const f = t.f, px = 12 * g.u, inner = g.maxW - 20 * g.u, tab = S.tab, on = S.chg[tab];
  let a, b;
  if (tab === 'nums') {
    const its = on ? [f.items[0], f.items[1], f.items[2], f.items[3]] : [f.items[0], f.items[2], f.items[3]];
    const hn = on ? ['1.', '2.', '2.', '3.'] : ['1.', '2.', '3.'];
    a = `<div class="paper pn full">${its.map((x, i) => `<div class="li ${on && i === 2 ? 'bad' : ''}">${sx(`${hn[i]} ${x}`)}${PM}</div>`).join('')}</div>`;
    b = `<div class="paper pn full"><ol class="al">${its.map((x, i) => `<li class="${on && i === 1 ? 'ni' : ''}">${esc(x)}${PM}</li>`).join('')}</ol></div>`;
  } else if (tab === 'pg') {
    const mk = (hand) => `<div class="pp">${slotsFor(hand, S.n, t).map((p) => `<div class="mp">${pageSlots(p, hand)}</div>`).join('')}</div>`;
    a = mk(true); b = mk(false);
  } else {
    const X = Math.round(inner * 0.6), price = [3.5, 5, 4.2, 3.8];
    const sp = tw(' ', px, 400) || 3;
    a = `<div class="paper pc full"><div class="mh">${esc(f.menu)}</div>${f.dishes.map((d, i) => `<div class="cl">${sx(d + ' '.repeat(Math.max(1, Math.round((X - tw(d, px, 400)) / sp))) + fmtP(price[i]))}${PM}</div>`).join('')}</div>`;
    b = `<div class="paper pc full"><div class="mh">${esc(f.menu)}</div>${f.dishes.map((d, i) => `<div class="cr"><span class="tabw" style="width:${X}px">${esc(d)}<em class="tbm">→</em></span>${fmtP(price[i])}${PM}</div>`).join('')}</div>`;
  }
  const kindB = tab === 'nums' ? f.list : tab === 'pg' ? f.brk : f.tab;
  const cap = (txt) => `<div class="cap"><b>${esc(txt)}</b><small></small></div>`;
  return `<div class="cols"><div class="col">${cap(f.byHand)}${a}</div><div class="col">${cap(kindB)}${b}</div></div>`;
}
function loremBody(t) {
  const L = t.lor;
  return `<div class="lor"><div class="paper"><p>${esc(L.text)}</p></div><div class="arrow">↑ ↓</div>
    <div class="cic">“Neque porro quisquam est qui <s>do</s><mark>lorem ipsum</mark> quia dolor sit amet…”<small>${esc(L.src)} · ${esc(L.mean)}</small></div></div>`;
}

// --- render --------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, g = geom();
  $('secW').style.display = v === 'width' ? '' : 'none';
  $('secH').style.display = v === 'heads' ? '' : 'none';
  $('secF').style.display = v === 'fix' ? '' : 'none';
  const body = S.sec === 'lor' ? loremBody(t) : v === 'width' ? widthBody(t, g) : v === 'heads' ? headsBody(t) : fixBody(t, g);
  $('sty').innerHTML = windowHtml(t, v, body, g.u);
  ctrlW(t); ctrlH(t); ctrlF(t);
  const sc = (k, emo, i) => `<button class="chip sc secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(t.sec[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('toc', '📑') + sc('lor', '🏛️');
  if (v === 'width') stateW(t); else if (v === 'heads') paintH(t); else stateF(t);
  if (S.sec === 'toc' || S.sec === 'lor') {
    const s = t.st[S.sec]; lab.setState({ emo: S.sec === 'toc' ? '📑' : '🏛️', title: s[0], lead: s[1], body: '', extra: '' });
  }
  const fk = S.sec === 'lor' ? 'h' : v === 'width' ? 'w' : v === 'heads' ? 'h' : 'f', fact = t.facts[fk];
  lab.setFacts([{ emo: v === 'width' ? '🖥️' : v === 'heads' ? '🏛️' : '⌨️', text: fact.text, src: fact.src }]);
}
function ctrlW(t) {
  lab.setGlow('rgba(80, 140, 230, .28)');
  $('wQ').textContent = t.w.q;
  $('wOpts').innerHTML = ['A', 'B', 'N'].map((k) => {
    const right = k === 'A', cls = !S.shown ? (S.guess === k ? 'pick' : '') : right ? 'good' : S.guess === k ? 'bad' : '';
    return `<button class="chip sc pk ${cls}" data-act="guess" data-k="${k}"${S.guess ? ' disabled' : ''}>${esc(t.w.opts[k])}</button>`;
  }).join('');
  $('wLbl').textContent = t.w.lbl;
  const s = $('wS'); s.disabled = !S.shown || S.anim; if (+s.value !== S.w) s.value = S.w;
  lab.setReadout(t.pct(S.w), t.w.sub, S.shown && S.w < 92 ? t.w.pillA : '', '#e0a040');
}
function stateW(t) {
  const w = t.w;
  if (!S.shown) return lab.setState({ emo: '🤔', title: w.s0[0], lead: w.s0[1], body: '', extra: '' });
  if (S.marks) return lab.setState({ emo: '🔎', title: w.m0, lead: w.m1, body: '', extra: '' });
  const ok = S.guess === 'A';
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? w.right : w.no(S.guess), lead: w.lead, body: w.body, extra: '' });
}
function ctrlH(t) {
  lab.setGlow('rgba(120, 150, 240, .26)');
  const h = t.h, lock = S.run !== null;
  $('hQ').textContent = h.task;
  $('hL1').textContent = h.byHand; $('hL2').textContent = h.byStyle;
  const opts = (key, list) => list.map((n) => `<button class="chip sc pk ${S[key] === n ? 'pick' : ''}" data-act="${key}" data-v="${n}"${lock ? ' disabled' : ''}>${n}</button>`).join('');
  $('hO1').innerHTML = opts('pA', [2, 5, 10]); $('hO2').innerHTML = opts('pB', [1, 3, 5]);
  const ready = S.pA !== null && S.pB !== null && !S.busy;
  $('hRun').innerHTML = `<button class="btn go" data-act="runA"${ready ? '' : ' disabled'}>${esc(h.runA)}</button><button class="btn go" data-act="runB"${ready ? '' : ' disabled'}>${esc(h.runB)}</button>`
    + (S.ranA && S.ranB ? `<button class="chip sc" data-act="again">${esc(h.again)}</button>` : '');
}
// the heading page changes in place (no rebuild) so the size and colour animate
function paintH(t) {
  const h = t.h;
  document.querySelectorAll('.hd').forEach((el, i) => {
    el.classList.toggle('on', !!S.done[i]);
    el.classList.toggle('miss', S.run === 'A' && !S.busy && !S.done[i] && S.cA >= 4);
    el.classList.toggle('can', S.run === 'A' && !S.busy && !S.done[i]);
  });
  const a = $('cnA'), b = $('cnB');
  if (a) { a.classList.toggle('off', !(S.run === 'A' || S.ranA)); a.textContent = `${h.byHand}: ${h.pageN(S.cA)}`; }
  if (b) { b.classList.toggle('off', !(S.run === 'B' || S.ranB)); b.textContent = `${h.byStyle}: ${h.pageN(S.cB)}`; }
  const ts = $('tbStyle'); if (ts) ts.classList.toggle('hot', S.run === 'B' && S.cB > 0 && !S.ranB);
  const missing = S.run === 'A' && !S.busy && S.cA === 4;
  lab.setReadout(S.ranA && S.ranB ? `${S.cA} : ${S.cB}` : '?', S.ranA && S.ranB ? `${h.byHand} : ${h.byStyle}` : '', '', '#8aa0f0');
  stateH(t, missing);
}
function stateH(t, missing) {
  const h = t.h;
  if (missing === undefined) missing = S.run === 'A' && !S.busy && S.cA === 4;
  if (S.ranA && S.ranB) {
    const ok = S.pA === 5 && S.pB === 1;
    return lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? h.right : `5 : 1`, lead: ok ? h.bothOk : h.both(S.pA, S.pB), body: '', extra: '' });
  }
  if (missing) return lab.setState({ emo: '👆', title: h.miss[0], lead: h.miss[1], body: '', extra: '' });
  if (S.ranA) return lab.setState({ emo: '🖐️', title: h.doneA[0], lead: h.doneA[1], body: '', extra: '' });
  if (S.ranB) return lab.setState({ emo: '✨', title: h.doneB[0], lead: h.doneB[1], body: '', extra: '' });
  lab.setState({ emo: '🎨', title: h.s0[0], lead: h.s0[1], body: '', extra: '' });
}
function ctrlF(t) {
  lab.setGlow('rgba(224, 160, 64, .24)');
  const f = t.f;
  $('fTabs').innerHTML = ['nums', 'pg', 'col'].map((k) => `<button class="chip sc ${S.tab === k ? 'on' : ''}" data-act="tab" data-k="${k}">${esc(f.tabs[k])}</button>`).join('');
  const used = S.tab === 'pg' ? S.n > 0 : S.chg[S.tab];
  $('fAct').innerHTML = `<button class="btn go" data-act="chg"${S.tab === 'pg' && S.n >= 4 ? ' disabled' : ''}>${esc(f.act[S.tab])}</button>` + (used ? `<button class="chip sc" data-act="undo">${esc(f.act.undo)}</button>` : '');
  const val = S.tab === 'nums' ? (S.chg.nums ? 4 : 3) : S.tab === 'pg' ? S.n : 'Aa';
  const sub = S.tab === 'col' ? `${f.sub.col}: ${f.fonts[S.chg.col ? 1 : 0]}` : f.sub[S.tab];
  lab.setReadout(val, sub, '', '#e0a040');
}
function stateF(t) {
  const f = t.f, k = S.tab, used = k === 'pg' ? S.n > 0 : S.chg[k], s = f.s[`${k}${used ? 1 : 0}`];
  lab.setState({ emo: k === 'nums' ? '🔢' : k === 'pg' ? '📄' : '↹', title: s[0], lead: s[1], body: S.marks ? '' : f.s.mk, extra: '' });
}

// --- controls ------------------------------------------------------------------------------------------------
function runHand() {
  const tok = ++S.tok; S.run = 'A'; S.done = [0, 0, 0, 0, 0]; S.cA = 0; S.ranA = false; S.busy = true; S.sec = null;
  render(); [0, 1, 2, 4].forEach((k, j) => setTimeout(() => {
    if (tok !== S.tok) return;
    S.done[k] = 1; S.cA++; sfx.tick(); document.querySelectorAll('.hd')[k]?.classList.add('pop');
    if (j === 3) S.busy = false;
    paintH(T[lang]); if (j === 3) ctrlH(T[lang]);
  }, 500 + j * 480));
}
function runStyle() {
  const tok = ++S.tok; S.run = 'B'; S.done = [0, 0, 0, 0, 0]; S.cB = 0; S.ranB = false; S.busy = true; S.sec = null;
  render(); S.cB = 1; sfx.click(); paintH(T[lang]);
  for (let i = 0; i < 5; i++) setTimeout(() => {
    if (tok !== S.tok) return;
    S.done[i] = 1; document.querySelectorAll('.hd')[i]?.classList.add('pop'); sfx.tick();
    if (i === 4) { S.busy = false; S.ranB = true; sfx.good(); }
    paintH(T[lang]); if (i === 4) ctrlH(T[lang]);
  }, 350 + i * 130);
}
function tapHead(i) {
  if (S.run !== 'A' || S.busy || S.done[i]) return;
  S.done[i] = 1; S.cA++; sfx.good(); document.querySelectorAll('.hd')[i]?.classList.add('pop');
  if (S.done.every(Boolean)) S.ranA = true;
  paintH(T[lang]); ctrlH(T[lang]);
}
function secToc() {
  if (S.sec === 'toc') { S.sec = null; return render(); }
  S.tok++; S.run = 'B'; S.done = [1, 1, 1, 1, 1]; S.cA = 0; S.cB = 1; S.ranA = false; S.ranB = true; S.busy = false; S.sec = 'toc';
  if (lab.view !== 'heads') $('views').querySelector('[data-view="heads"]')?.click();
  S.sec = 'toc'; render();
}
function onClick(ev) {
  const hd = ev.target.closest('.hd[data-i]');
  if (hd) return tapHead(+hd.dataset.i);
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'marks') { S.marks = !S.marks; sfx.click(); }
  else if (a === 'guess') {
    S.guess = b.dataset.k; S.shown = true; (S.guess === 'A' ? sfx.good : sfx.bad)(); render(); showStage(); tweenW(64, 1300); return;
  } else if (a === 'pA' || a === 'pB') { S[a] = +b.dataset.v; sfx.tick(); }
  else if (a === 'runA') return runHand();
  else if (a === 'runB') return runStyle();
  else if (a === 'again') { S.tok++; S.run = null; S.done = [0, 0, 0, 0, 0]; S.cA = 0; S.cB = 0; S.ranA = false; S.ranB = false; S.pA = null; S.pB = null; sfx.click(); }
  else if (a === 'tab') { S.tab = b.dataset.k; sfx.click(); }
  else if (a === 'chg') { if (S.tab === 'pg') S.n = Math.min(4, S.n + 1); else S.chg[S.tab] = true; sfx.push(); }
  else if (a === 'undo') { if (S.tab === 'pg') S.n = 0; else S.chg[S.tab] = false; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'toc') return secToc();
    S.sec = S.sec === 'lor' ? null : 'lor'; sfx.click();
  }
  render();
}
$('ctrlBody').addEventListener('click', onClick);
$('sty').addEventListener('click', onClick);
$('wS').addEventListener('input', (ev) => { if (!S.shown || S.anim) return; S.w = +ev.target.value; render(); });
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(render, 120); });
document.fonts?.ready.then(render);
render();
</script>
</body>
</html>
