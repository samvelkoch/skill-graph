  const chip = ev.target.closest('.chip');
  if (chip) {
    const k = chip.dataset.k;
    if (lab.view === 'make') {
      if (k === 'open' || k === 'mud') { M.fate = k; M.p = 0; M.play = true; $('tl').value = 0; }
      else if (k === 'play') { if (M.p >= 1) M.p = 0; M.play = !M.play; }
    } else if (lab.view === 'dig') {
      if (k === 's1' || k === 's2') { if (!secret.unlocked()) return secret.open(); const m = k === 's1' ? 'tilt' : 'dike'; resetDig(D.mode === m ? null : m); }
      else if (k === 'flat') resetDig(null);
      else if (k === 'reset') resetDig(D.mode);
    } else if (k === 'again') resetSort();
    sfx.click(); render(); return;
  }
  const fnd = ev.target.closest('.find');
  if (fnd && !D.done && !fnd.classList.contains('used')) { D.picks.push(fnd.dataset.id); D.err = null; sfx.tick(); render(); return; }
  const sl = ev.target.closest('.slot.on');
  if (sl && !D.done) { D.picks = D.picks.filter((x) => x !== sl.dataset.id); D.err = null; sfx.tick(); render(); return; }
  if (ev.target.closest('#chk')) checkOrder();
});

function checkOrder() {
  const total = digIds().length;
  if (D.done || D.picks.length !== total) return;
  for (let i = 0; i < D.picks.length - 1; i++) {
    if (depthOf(D.picks[i]) < depthOf(D.picks[i + 1])) { D.err = { a: D.picks[i + 1], b: D.picks[i] }; sfx.bad(); render(); return; }
  }
  D.err = null; D.done = true; store.set('fossils:ordered', true); sfx.good(); render();
}

// the opening prediction
const ask = Object.assign(document.createElement('div'), { className: 'ask card' });
$('overlay').append(ask);
ask.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.a) { S.answer = +b.dataset.a; (S.answer === 1 ? sfx.good : sfx.bad)(); }
  else { S.answered = true; store.set('fossils:asked', true); if (lab.view === 'make' && M.p === 0) M.play = true; }
  render();
});

// ---------------------------------------------------------------------------------------------------------
// 4. Render: everything made of words
// ---------------------------------------------------------------------------------------------------------
function makeState(t) {
  const st = M.stage < 0 ? 0 : M.stage;
  if (st <= 1) return [EMO.a[st], ...t.mk.a[st]];
  if (M.fate === 'open') { const i = st === 2 ? 0 : st < 6 ? 1 : 2; return [EMO.o[i], ...t.mk.o[i]]; }
  return [EMO.m[st - 2], ...t.mk.m[st - 2]];
}
function depthName(id) { return T[lang].nm[id]; }
function render() {
  const t = T[lang], v = lab.view, open = secret.unlocked(), n = nf();
  $('cMake').hidden = v !== 'make'; $('cDig').hidden = v !== 'dig'; $('cSort').hidden = v !== 'sort';
  let state, readout;

  if (v === 'make') {
    const st = M.stage < 0 ? 0 : M.stage;
    const [emo, title, lead, body] = makeState(t);
    state = { emo, title, lead, body };
    let pill = '';
    if (M.fate === 'open' && st >= 3) pill = t.pill.none;
    if (M.fate === 'mud' && st >= 6) pill = t.pill.fossil;
    readout = [esc(t.tm[st]), t.sub.make, pill, M.fate === 'open' ? '#ff6b57' : '#f0b13c'];
    $('chMake').innerHTML = [
      `<button class="chip ${M.fate === 'open' ? 'on' : ''}" data-k="open">${esc(t.chips.open)}</button>`,
      `<button class="chip ${M.fate === 'mud' ? 'on' : ''}" data-k="mud">${esc(t.chips.mud)}</button>`,
      `<button class="chip" data-k="play">${esc(M.play ? t.chips.pause : M.p >= 1 ? t.chips.again : t.chips.play)}</button>`,
    ].join('');
    $('tl').title = t.sub.make;
    if (!M.play) $('tl').value = Math.round(M.p * 1000);
    lab.setGlow(M.fate === 'open' ? 'rgba(255,107,87,.2)' : 'rgba(240,177,60,.22)');
  } else if (v === 'dig') {
    const ids = digIds(), total = ids.length, nF = D.found.length, g = t.dg;
    const note = D.mode === 'tilt' ? g.tiltNote : D.mode === 'dike' ? g.dikeNote : '';
    const sc = (k) => `<button class="chip secret ${open ? 'open' : ''} ${(k === 's1' && D.mode === 'tilt') || (k === 's2' && D.mode === 'dike') ? 'on' : ''}" data-k="${k}">${open ? esc(t.secrets[k][0]) : '🔒 ???'}</button>`;
    $('chDig').innerHTML = [sc('s1'), `<button class="chip ${D.mode ? '' : 'on'}" data-k="flat">${esc(t.chips.flat)}</button>`, `<button class="chip" data-k="reset">${esc(t.chips.reset)}</button>`, sc('s2')].join('');
    if (D.done) {
      const extra = D.mode === 'tilt' ? g.tiltDone : D.mode === 'dike' ? g.dikeDone : '';
      state = { emo: '🧭', title: g.dDone[0], lead: g.dDone[1], body: `${g.dDone[2]}${extra ? ' ' + extra : ''}` };
    } else if (D.err) {
      state = { emo: '🤔', title: g.dWrong[0], lead: g.dWrong[1].replace('{a}', depthName(D.err.a)).replace('{b}', depthName(D.err.b)), body: g.dWrong[2] };
    } else if (nF === 0) {
      state = { emo: '⛏', title: g.d0[0], lead: g.d0[1], body: note || g.d0[2] };
    } else if (nF >= 2) {
      state = { emo: '🧭', title: g.dOrder[0], lead: g.dOrder[1], body: note || g.dOrder[2] };
    } else {
      state = { emo: '🖌️', title: g.dN[0], lead: g.dN[1].replace('{n}', n.format(nF)).replace('{m}', n.format(total)), body: note || g.dN[2] };
    }
    readout = [`${n.format(nF)} / ${n.format(total)}`, t.sub.dig, D.done ? t.pill.done : '', '#d98a62'];
    $('tray').innerHTML = nF ? D.found.map((id) => `<button class="find ${D.picks.includes(id) ? 'used' : ''}" data-id="${id}"><img src="${iconURL(id)}" alt=""><span>${esc(t.nm[id])}</span></button>`).join('')
      : `<span class="empty">${esc(g.empty)}</span>`;
    $('ends').innerHTML = nF ? `<span>◀ ${esc(g.oldest)}</span><span>${esc(g.youngest)} ▶</span>` : '';
    $('picks').innerHTML = nF ? ids.map((_, i) => {
      const id = D.picks[i];
      return id ? `<button class="slot on ${D.done ? 'ok' : ''}" data-id="${id}"><b>${i + 1}</b><img src="${iconURL(id)}" alt="${esc(t.nm[id])}"></button>` : `<div class="slot"></div>`;
    }).join('') : '';
    const chk = $('chk'); chk.textContent = g.chk; chk.disabled = D.done || D.picks.length !== total; chk.style.display = nF ? '' : 'none';
    lab.setGlow('rgba(217,138,98,.2)');
  } else {
    const so = t.so, placed = Q.items.filter((i) => i.placed).length;
    if (Q.done) state = { emo: '🗂', title: so.done[0], lead: so.done[1], body: so.done[2] };
    else if (Q.wrong) { const w = Q.items.find((i) => i.id === Q.wrong); state = { emo: '🤔', title: `${t.nm[w.id]}: ${so.wrong[0]}`, lead: so.wrong[1], body: so.wrong[2] }; }
    else if (Q.last) { const it = Q.items.find((i) => i.id === Q.last); state = { emo: it.kind === 'body' ? '🦴' : '👣', title: t.nm[it.id], lead: it.kind === 'body' ? so.leadBody : so.leadTrace, body: so.cap[it.id] }; }
    else state = { emo: '🗂', title: so.s0[0], lead: so.s0[1], body: so.s0[2] };
    readout = [`${n.format(placed)} / ${n.format(Q.items.length)}`, t.sub.sort, Q.done ? t.pill.done : '', '#4ea8ff'];
    $('chSort').innerHTML = `<button class="chip" data-k="again">${esc(t.chips.sortAgain)}</button>`;
    lab.setGlow('rgba(78,168,255,.2)');
  }
  lab.setReadout(readout[0], readout[1], readout[2], readout[3]);
  lab.setState({ ...state, extra: `<div class="fine">${esc(t.fine)}</div>` });

  ask.style.display = S.answered ? 'none' : '';
  if (!S.answered) ask.innerHTML = S.answer === null
    ? `<div class="q">${esc(t.ask)}</div><div class="opts">${t.opts.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="q" style="color:${S.answer === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(S.answer === 1 ? t.right : t.wrong)}</div><div class="opts"><button>${esc(t.go)} →</button></div>`;
}

// ---------------------------------------------------------------------------------------------------------
// 5. Scene 1: make a fossil (a side-on slice through a riverbed)
// ---------------------------------------------------------------------------------------------------------
const SED = ['#b28b5e', '#8d7a64', '#c9a46c', '#9a8a70', '#b97f56', '#a39478'];
const DUR = 18; // seconds for the whole fast-forward

function drawFish(c, x, y, s, o) {
  c.save(); c.translate(x, y); if (o.rot) c.rotate(o.rot); if (o.sy) c.scale(1, o.sy);
  if (o.flesh > 0.01) {
    c.save(); c.translate(s * 0.17, 0); c.globalAlpha = o.flesh;
    c.fillStyle = '#e8873a'; c.beginPath(); c.ellipse(0, 0, s * 0.95, s * 0.38, 0, 0, TAU); c.fill();
    c.fillStyle = '#f6b36b'; c.beginPath(); c.ellipse(-s * 0.05, s * 0.1, s * 0.8, s * 0.22, 0, 0, Math.PI); c.fill();
    c.fillStyle = '#d4702a';
    c.beginPath(); c.moveTo(-0.85 * s, 0); c.lineTo(-1.3 * s, -0.36 * s); c.lineTo(-1.3 * s, 0.36 * s); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(-0.25 * s, -0.34 * s); c.lineTo(0.05 * s, -0.62 * s); c.lineTo(0.35 * s, -0.33 * s); c.closePath(); c.fill();
    if (o.dead) {
      c.strokeStyle = '#2b1a10'; c.lineWidth = Math.max(1.5, s * 0.05); c.beginPath();
      c.moveTo(0.58 * s, -0.17 * s); c.lineTo(0.72 * s, -0.03 * s); c.moveTo(0.72 * s, -0.17 * s); c.lineTo(0.58 * s, -0.03 * s); c.stroke();
    } else {
      c.fillStyle = '#fff'; c.beginPath(); c.arc(0.65 * s, -0.1 * s, s * 0.09, 0, TAU); c.fill();
      c.fillStyle = '#10131c'; c.beginPath(); c.arc(0.67 * s, -0.1 * s, s * 0.05, 0, TAU); c.fill();
    }
    c.restore();
  }
  if (o.boneA > 0.01) { c.save(); c.globalAlpha = o.boneA * (o.flesh > 0.5 ? 0.25 : 1); FOSS.fish(c, s, o.bone, o.scat || 0); c.restore(); }
  c.restore();
}

function drawScientist(c, x, gy, k, time, wave) {
  c.save(); c.translate(x, gy); c.scale(-k, k);
  c.fillStyle = '#2f3a55'; c.fillRect(-8, -24, 6, 24); c.fillRect(2, -24, 6, 24);
  c.fillStyle = '#e9a23b'; c.fillRect(-11, -50, 22, 28);
  c.fillStyle = '#f1c9a0'; c.beginPath(); c.arc(0, -60, 9, 0, TAU); c.fill();
  c.fillStyle = '#c8a165'; c.beginPath(); c.ellipse(0, -65, 16, 4, 0, 0, TAU); c.fill(); c.beginPath(); c.arc(0, -66, 9, Math.PI, 0); c.fill();
  const sw = wave ? Math.sin(time * 8) * 5 : 0;
  c.lineCap = 'round'; c.strokeStyle = '#f1c9a0'; c.lineWidth = 5; c.beginPath(); c.moveTo(9, -44); c.lineTo(22 + sw, -36 + sw * 0.4); c.stroke();
  c.strokeStyle = '#7a5a3a'; c.lineWidth = 3; c.beginPath(); c.moveTo(22 + sw, -36 + sw * 0.4); c.lineTo(30 + sw, -30 + sw * 0.4); c.stroke();
  c.restore();
}

function drawMake(c, w, h, dt, time) {
  if (M.play) {
    M.p = Math.min(1, M.p + dt / DUR);
    $('tl').value = Math.round(M.p * 1000);
    if (M.p >= 1) { M.play = false; render(); }
  }
  const t6 = M.p * 6, open = M.fate === 'open';
  const st = Math.min(6, Math.floor(t6 + 1e-6));
  if (st !== M.stage) { M.stage = st; render(); }

  const bedY = h * 0.74, waterTop = h * 0.2, s = Math.min(w * 0.115, h * 0.17), fx = w * 0.46, pileMax = h * 0.4;
  const startS = open ? 2.8 : 1.2, span = open ? 2.4 : 3.3;
  const xs = clamp((t6 - startS) / span, 0, 1);
  const er = smooth(5, 6, t6);
  const pile = pileMax * (1 - Math.pow(1 - xs, 2.2)) * (1 - er);
  const wA = 1 - smooth(5.0, 5.7, t6);
  const hard = smooth(3.4, 5.0, t6), mineral = open ? 0 : smooth(3.8, 5.2, t6);
  const ridge = (x) => (er > 0 ? er * h * 0.1 * (0.55 + 0.45 * Math.sin(x * 0.021 + 1.3) * Math.sin(x * 0.007 + 0.4)) * smooth(s * 1.3, s * 2.8, Math.abs(x - fx)) : 0);
  const thick = (x) => pile + ridge(x);
  const surfAt = (x) => bedY - thick(x);

  // sky
  let g = c.createLinearGradient(0, 0, 0, bedY); g.addColorStop(0, '#1a2842'); g.addColorStop(1, '#2a3f60');
  c.fillStyle = g; c.fillRect(0, 0, w, bedY);
  // water
  if (wA > 0.01) {
    g = c.createLinearGradient(0, waterTop, 0, bedY); g.addColorStop(0, `rgba(70,150,205,${0.62 * wA})`); g.addColorStop(1, `rgba(24,80,130,${0.9 * wA})`);
    c.fillStyle = g; c.beginPath(); c.moveTo(0, waterTop);
    for (let x = 0; x <= w + 8; x += 8) c.lineTo(x, waterTop + Math.sin(x * 0.03 + time * 1.6) * 2.5);
    c.lineTo(w, bedY); c.lineTo(0, bedY); c.closePath(); c.fill();
  }
  // bedrock
  c.fillStyle = '#4b3e36'; c.fillRect(0, bedY, w, h - bedY);
  c.strokeStyle = 'rgba(0,0,0,.22)'; c.lineWidth = 1.5;
  for (const f of [0.33, 0.68]) { c.beginPath(); c.moveTo(0, bedY + (h - bedY) * f); c.lineTo(w, bedY + (h - bedY) * f); c.stroke(); }

  // the fish
  const sink = smooth(0.5, 1.0, t6), alive = 1 - smooth(0.45, 0.7, t6);
  const fy = lerp(bedY - h * 0.33 + Math.sin(time * 1.2) * s * 0.12, bedY - s * 0.37, sink);
  const fxx = fx + (1 - smooth(0.4, 0.9, t6)) * Math.sin(time * 1.3) * w * 0.04;
  const flesh = 1 - smooth(open ? 1.4 : 1.6, open ? 2.4 : 2.6, t6);
  const boneA = open ? 1 - smooth(2.4, 3.0, t6) : 1;
  const squash = open ? 1 : 1 - 0.12 * smooth(3.5, 4.8, t6);
  const boneCol = mix(STONE, '#d9a441', mineral);
  const fishOpts = { flesh, boneA, bone: boneCol, scat: open ? smooth(2.0, 3.0, t6) : 0, dead: t6 > 0.6, rot: Math.sin(time * 3) * 0.05 * alive, sy: squash };
  if (!(open && t6 > 3.0)) drawFish(c, fxx, fy, s, fishOpts);
  // bones sparkle once they are minerals
  if (!open && er > 0.5 && er < 1.01 && t6 > 5.8) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 4);
    const gl = c.createRadialGradient(fx, bedY - s * 0.4, 0, fx, bedY - s * 0.4, s * 2.2);
    gl.addColorStop(0, `rgba(255,220,130,${0.35 * pulse})`); gl.addColorStop(1, 'rgba(255,220,130,0)');
    c.fillStyle = gl; c.fillRect(fx - s * 2.4, bedY - s * 2.6, s * 4.8, s * 4.6);
  }

  // the pile of sediment: six bands, each as thick as its share of the local thickness
  if (pile > 0.5 || er > 0) {
    for (let i = 0; i < 6; i++) {
      const col = mix(SED[i], '#6f6a66', hard * 0.55);
      c.fillStyle = col; c.beginPath();
      for (let x = 0; x <= w + 6; x += 6) { const y = bedY - thick(Math.min(x, w)) * (i + 1) / 6; if (x === 0) c.moveTo(x, y); else c.lineTo(x, y); }
      for (let x = w + 6; x >= 0; x -= 6) c.lineTo(x, bedY - thick(Math.min(x, w)) * i / 6);
      c.closePath(); c.fill();
      // sand grains while soft, cracks once hard
      const bandTop = bedY - pile * (i + 1) / 6, bandH = pile / 6;
      if (bandH > 3) {
        c.fillStyle = `rgba(255,240,200,${0.35 * (1 - hard)})`;
        for (let j = 0; j < 26; j++) c.fillRect(hash(i * 40 + j) * w, bandTop + hash(i * 40 + j + 500) * bandH, 2, 2);
        if (hard > 0.2) {
          c.strokeStyle = `rgba(30,24,20,${0.35 * hard})`; c.lineWidth = 1;
          for (let j = 0; j < 4; j++) { const x0 = hash(i * 10 + j + 90) * w; c.beginPath(); c.moveTo(x0, bandTop + bandH * 0.15); c.lineTo(x0 + 10, bandTop + bandH * 0.55); c.lineTo(x0 + 3, bandTop + bandH * 0.9); c.stroke(); }
        }
      }
      c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 1; c.beginPath();
      for (let x = 0; x <= w + 6; x += 6) { const y = bedY - thick(Math.min(x, w)) * (i + 1) / 6; if (x === 0) c.moveTo(x, y); else c.lineTo(x, y); }
      c.stroke();
    }
  }
  // x-ray window onto the buried fish
  if (!open) {
    const la = smooth(s * 0.5, s * 1.4, pile) * (1 - smooth(0, 0.55, er));
    if (la > 0.02) {
      const ly = bedY - s * 0.37, Rl = s * 1.95;
      c.save(); c.globalAlpha = la; c.beginPath(); c.arc(fx, ly, Rl, 0, TAU); c.fillStyle = '#1d1613'; c.fill(); c.clip();
      for (let i = 0; i < 16; i++) {
        const tw = 0.5 + 0.5 * Math.sin(time * 3 + i * 1.7), cx = fx + (hash(i) - 0.5) * Rl * 1.7, cy = ly + (hash(i + 30) - 0.5) * Rl * 1.3;
        c.fillStyle = `rgba(255,214,120,${mineral * tw * 0.9})`; c.beginPath(); c.moveTo(cx, cy - 3); c.lineTo(cx + 2.5, cy); c.lineTo(cx, cy + 3); c.lineTo(cx - 2.5, cy); c.closePath(); c.fill();
      }
      drawFish(c, fx, ly, s, { flesh, boneA: 1, bone: boneCol, scat: 0, dead: true, sy: squash });
      c.restore();
      c.save(); c.globalAlpha = la; c.strokeStyle = '#f0b13c'; c.lineWidth = 2; c.setLineDash([6, 5]); c.beginPath(); c.arc(fx, ly, Rl, 0, TAU); c.stroke(); c.restore();
      // water seeping down to the bones
      const seep = smooth(3.3, 3.9, t6) * (1 - smooth(4.9, 5.4, t6)) * la;
      if (seep > 0.02) {
        c.save(); c.globalAlpha = seep; c.strokeStyle = 'rgba(140,210,255,.85)'; c.lineWidth = 2; c.setLineDash([2, 9]); c.lineDashOffset = -time * 24;
        for (let j = -2; j <= 2; j++) { const x = fx + j * Rl * 0.3; c.beginPath(); c.moveTo(x, Math.min(surfAt(x), ly - Rl)); c.lineTo(x, ly - Math.sqrt(Math.max(0, Rl * Rl - (j * Rl * 0.3) ** 2)) + 2); c.stroke(); }
        c.restore();
      }
    }
  }
  // falling mud grains
  const rain = (open ? smooth(2.6, 3.0, t6) : smooth(1.0, 1.3, t6)) * (1 - smooth(4.7, 5.0, t6)) * wA;
  const surfC = surfAt(fx);
  if (rain > 0.02 && surfC - waterTop > 10) {
    c.fillStyle = `rgba(220,190,140,${0.7 * rain})`;
    for (let i = 0; i < 44; i++) {
      const y = waterTop + ((time * (28 + hash(i + 3) * 30) + hash(i + 7) * 400) % (surfC - waterTop));
      c.fillRect(hash(i) * w, y, 2.2, 2.2);
    }
  }
  // scavengers
  const crabs = open ? smooth(1.1, 1.4, t6) * (1 - smooth(2.5, 2.9, t6)) : 0;
  if (crabs > 0.02) {
    c.save(); c.globalAlpha = crabs; c.font = `${Math.round(s * 0.8)}px serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    for (let i = 0; i < 2; i++) {
      const dir = i ? 1 : -1, x = fx + dir * s * (1.7 - 1.0 * smooth(1.1, 1.8, t6)) + Math.sin(time * 6 + i * 2) * 3;
      c.fillText('🦀', x, bedY - s * 0.28);
    }
    c.restore();
    // rot bubbles
    c.fillStyle = `rgba(150,200,120,${0.5 * crabs})`;
    for (let i = 0; i < 6; i++) { const yy = fy - ((time * 24 + i * 17) % (s * 2)); c.beginPath(); c.arc(fx + (hash(i) - 0.5) * s * 1.6, yy, 2 + hash(i + 4) * 2, 0, TAU); c.fill(); }
  }
  // the palaeontologist
  if (t6 > 5.2) {
    const k = h / 330, sx = lerp(w * 1.08, w * 0.76, smooth(5.3, 5.9, t6)), gy = surfAt(sx);
    drawScientist(c, sx, gy, k, time, t6 > 5.9);
    if (t6 > 5.9) {
      const bx = sx - 6 * k, by = gy - 96 * k, r = 15 * k;
      c.fillStyle = '#fff'; c.beginPath(); c.arc(bx, by, r, 0, TAU); c.fill();
      c.fillStyle = open ? '#d9534a' : '#1f9d63'; c.font = `900 ${Math.round(r * 1.5)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(open ? '?' : '!', bx, by + r * 0.08);
    }
  }
  // timeline across the top
  const ty = Math.max(14, h * 0.045), tx0 = w * 0.07, tx1 = w * 0.93;
  c.lineCap = 'round'; c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.2)'; c.beginPath(); c.moveTo(tx0, ty); c.lineTo(tx1, ty); c.stroke();
  c.strokeStyle = open ? '#ff6b57' : '#f0b13c'; c.beginPath(); c.moveTo(tx0, ty); c.lineTo(lerp(tx0, tx1, M.p), ty); c.stroke();
  for (let i = 0; i <= 6; i++) { c.fillStyle = t6 + 1e-6 >= i ? '#fff' : 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(lerp(tx0, tx1, i / 6), ty, i === st ? 5.5 : 3.5, 0, TAU); c.fill(); }
}

// ---------------------------------------------------------------------------------------------------------
// 6. Scene 2: dig a cliff
// ---------------------------------------------------------------------------------------------------------
function digLayout(w, h) {
  const th = D.mode === 'tilt' ? 0.26 : 0;
  const x0 = w * 0.12, x1 = w * 0.96, y0 = h * 0.2, y1 = h * 0.95, W = x1 - x0, H = y1 - y0;
  const Hb = H / (th ? 7.2 : 6), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, s = Hb * 0.68;
  const cs = Math.cos(th), sn = Math.sin(th);
  const fos = LAY.map((l, k) => {
    const u = (k % 2 === 0 ? 1 : -1) * W * 0.24, v = (k - 2.5) * Hb;
    const [rx, ry] = COVER[l.id];
    return { id: l.id, k, col: l.col, x: cx + u * cs - v * sn, y: cy + u * sn + v * cs, rot: th + (hash(k + 3) - 0.5) * 0.4, rx, ry };
  });
  return { th, x0, x1, y0, y1, W, H, Hb, cx, cy, s, fos, dike: { x: cx, w: W * 0.07, top: y0 + 2 * Hb } };
}

function drawDig(c, w, h, dt, time) {
  const L = digLayout(w, h), { th, x0, x1, y0, y1, W, H, Hb, cx, cy, s } = L;
  const t = T[lang];
  // sky, sun, grass
  let g = c.createLinearGradient(0, 0, 0, y0); g.addColorStop(0, '#1d2c4a'); g.addColorStop(1, '#41588a');
  c.fillStyle = g; c.fillRect(0, 0, w, y0);
  c.fillStyle = '#ffd37a'; c.beginPath(); c.arc(w * 0.82, y0 * 0.5, Math.max(8, w * 0.025), 0, TAU); c.fill();
  // bands (in a frame rotated by the tilt, clipped to the cliff)
  c.save(); c.beginPath(); c.rect(x0, y0, W, H); c.clip();
  c.translate(cx, cy); c.rotate(th);
  const big = w * 2;
  LAY.forEach((l, k) => {
    const top = k === 0 ? -big : (k - 3) * Hb, bot = k === 5 ? big : (k - 2) * Hb;
    c.fillStyle = l.col; c.fillRect(-big, top, big * 2, bot - top);
    const t0 = (k - 3) * Hb;
    c.fillStyle = 'rgba(0,0,0,.10)';
    for (let j = 0; j < 36; j++) c.fillRect((hash(k * 70 + j) - 0.5) * W * 1.3, t0 + hash(k * 70 + j + 400) * Hb, 2.2, 2.2);
    c.fillStyle = 'rgba(255,255,255,.12)';
    for (let j = 0; j < 22; j++) c.fillRect((hash(k * 70 + j + 800) - 0.5) * W * 1.3, t0 + hash(k * 70 + j + 1200) * Hb, 2.4, 1.6);
    if (k > 0) { c.strokeStyle = 'rgba(0,0,0,.28)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-big, t0); c.lineTo(big, t0); c.stroke(); }
  });
  c.restore();
  // lava dike (flat mode only): cuts layers 2..5 and stops under layer 1
  if (D.mode === 'dike') {
    const dk = L.dike, got = D.rev.dike >= 1;
    c.save(); c.beginPath(); c.rect(x0, y0, W, H); c.clip();
    c.fillStyle = '#2e2523'; c.beginPath(); c.moveTo(dk.x - dk.w / 2, y1 + 4);
    for (let y = y1; y >= dk.top + Hb * 0.5; y -= 8) c.lineTo(dk.x - dk.w / 2 + Math.sin(y * 0.07) * 3, y);
    c.lineTo(dk.x, dk.top);
    for (let y = dk.top + Hb * 0.5; y <= y1; y += 8) c.lineTo(dk.x + dk.w / 2 + Math.sin(y * 0.09) * 3, y);
    c.lineTo(dk.x + dk.w / 2, y1 + 4); c.closePath(); c.fill();
    c.strokeStyle = `rgba(255,122,61,${got ? 0.9 : 0.45})`; c.lineWidth = 2; c.lineCap = 'round'; c.beginPath(); c.moveTo(dk.x, y1);
    for (let y = y1; y >= dk.top + Hb * 0.4; y -= 9) c.lineTo(dk.x + Math.sin(y * 0.2) * dk.w * 0.18, y);
    c.stroke();
    if (!got) { c.setLineDash([5, 5]); c.strokeStyle = `rgba(255,255,255,${0.35 + 0.25 * Math.sin(time * 3)})`; c.strokeRect(dk.x - dk.w / 2 - 4, dk.top + Hb * 0.3, dk.w + 8, y1 - dk.top - Hb * 0.3); c.setLineDash([]); }
    c.restore();
  }
  // grass strip and cliff frame
  c.fillStyle = '#58934f'; c.fillRect(x0 - 3, y0 - 7, W + 6, 8);
  c.fillStyle = '#6fae63'; for (let x = x0; x < x1; x += 11) c.fillRect(x, y0 - 10 - hash(x) * 4, 2, 5);
  c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 2; c.strokeRect(x0, y0, W, H);

  // fossils, each under a mound of dirt until brushed away
  for (const f of L.fos) {
    const rev = D.rev[f.id] || 0, foundT = D.foundAt[f.id];
    const pop = foundT ? 1 + 0.28 * Math.max(0, 1 - (time - foundT) * 2.2) * Math.abs(Math.sin((time - foundT) * 9)) : 1;
    c.save(); c.translate(f.x, f.y); c.rotate(f.rot); c.scale(pop, pop);
    FOSS[f.id](c, s);
    if (rev < 1) {
      const a = 1 - smooth(0, 0.9, rev), kx = f.rx * s * (1.05 - 0.25 * rev), ky = f.ry * s * (1.1 - 0.25 * rev);
      c.globalAlpha = a; c.fillStyle = mix(f.col, '#000000', 0.1);
      c.beginPath(); c.ellipse(0, 0, kx, ky, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,255,255,.14)'; c.beginPath(); c.ellipse(-kx * 0.25, -ky * 0.3, kx * 0.45, ky * 0.3, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(0,0,0,.18)';
      for (let j = 0; j < 9; j++) c.fillRect((hash(j + f.k * 11) - 0.5) * kx * 1.6, (hash(j + f.k * 11 + 50) - 0.5) * ky * 1.5, 2.4, 2.4);
      c.setLineDash([4, 5]); c.lineWidth = 1.5; c.strokeStyle = `rgba(255,255,255,${(0.28 + 0.2 * Math.sin(time * 3 + f.k)) * a})`;
      c.beginPath(); c.ellipse(0, 0, kx + 5, ky + 5, 0, 0, TAU); c.stroke(); c.setLineDash([]);
      c.globalAlpha = 1;
    }
    c.restore();
  }
  // age badges once the order is right
  if (D.done) {
    D.picks.forEach((id, i) => {
      const pos = id === 'dike' ? { x: L.dike.x, y: L.dike.top + Hb * 1.1 } : { x: L.fos.find((f) => f.id === id).x, y: L.fos.find((f) => f.id === id).y - s * 0.78 };
      const r = Math.max(9, s * 0.4);
      c.fillStyle = '#fff'; c.beginPath(); c.arc(pos.x, pos.y, r, 0, TAU); c.fill();
      c.fillStyle = '#10131c'; c.font = `900 ${Math.round(r * 1.2)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(i + 1), pos.x, pos.y + 1);
    });
  }
  // dust
  for (const p of D.parts) { p.life -= dt; p.vy += 220 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  D.parts = D.parts.filter((p) => p.life > 0);
  for (const p of D.parts) { c.globalAlpha = clamp(p.life * 2, 0, 1); c.fillStyle = p.col; c.fillRect(p.x, p.y, p.r, p.r); }
  c.globalAlpha = 1;
  // the "older" arrow along the left edge, turning with the layers
  const fs = clamp(w * 0.03, 10, 13), ax = w * 0.075, len = H * 0.62;
  c.save(); c.translate(ax, cy); c.rotate(th);
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.fillStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, -len / 2); c.lineTo(0, len / 2); c.stroke();
  c.beginPath(); c.moveTo(-5, len / 2 - 8); c.lineTo(0, len / 2); c.lineTo(5, len / 2 - 8); c.stroke();
  c.translate(-fs * 0.9, 0); c.rotate(Math.PI / 2); c.font = `800 ${fs}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(`${t.dg.older} ↓`, 0, 0);
  c.restore();
  // the brush
  if (D.ptr.down || time - D.ptr.t < 0.7) {
    c.save(); c.translate(D.ptr.x, D.ptr.y); c.rotate(0.5); c.font = '26px serif'; c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillText('🖌️', 6, 4); c.restore();
  }
}

function brushAt(px, py, dist) {
  const { w, h } = cvLoop.size(), L = digLayout(w, h);
  if (px < L.x0 || px > L.x1 || py < L.y0 || py > L.y1) return;
  const t = nowS();
  for (const f of L.fos) {
    if ((D.rev[f.id] || 0) >= 1) continue;
    if (Math.hypot(px - f.x, py - f.y) < Math.max(f.rx, f.ry) * L.s * 0.95) {
      D.rev[f.id] = Math.min(1, (D.rev[f.id] || 0) + dist / (L.s * 5));
      if (D.rev[f.id] >= 1) { D.found.push(f.id); D.foundAt[f.id] = t; sfx.snap(); render(); }
    }
  }
  if (D.mode === 'dike' && !(D.rev.dike >= 1)) {
    const dk = L.dike;
    if (Math.abs(px - dk.x) < dk.w / 2 + 8 && py > dk.top) {
      D.rev.dike = Math.min(1, (D.rev.dike || 0) + dist / (L.Hb * 2.5));
      if (D.rev.dike >= 1) { D.found.push('dike'); D.foundAt.dike = t; sfx.snap(); render(); }
    }
  }
  if (dist > 1) {
    const v = -(px - L.cx) * Math.sin(L.th) + (py - L.cy) * Math.cos(L.th), k = clamp(Math.floor(v / L.Hb + 3), 0, 5), col = mix(LAY[k].col, '#000000', 0.25);
    for (let i = 0; i < 2; i++) D.parts.push({ x: px + (Math.random() - 0.5) * 10, y: py + (Math.random() - 0.5) * 6, vx: (Math.random() - 0.5) * 60, vy: -30 - Math.random() * 40, life: 0.5 + Math.random() * 0.4, r: 2 + Math.random() * 2, col });
    if (D.parts.length > 90) D.parts.splice(0, D.parts.length - 90);
  }
}

// ---------------------------------------------------------------------------------------------------------
// 7. Scene 3: body or trace (drag, or tap a find and then tap a box)
// ---------------------------------------------------------------------------------------------------------
function sortLayout(w, h) {
  const pad = Math.max(8, w * 0.03), gap = Math.max(6, w * 0.02), binsH = Math.max(96, h * 0.36), bw = (w - pad * 2 - gap) / 2;
  const bins = { body: { x: pad, y: pad, w: bw, h: binsH }, trace: { x: pad + bw + gap, y: pad, w: bw, h: binsH } };
  const areaY = pad * 2 + binsH, areaH = h - areaY - pad;
  const cs = Math.max(30, Math.min((areaH - gap) / 2, (w - pad * 2 - gap * 3) / 4, 92));
  const gx = (w - (cs * 4 + gap * 3)) / 2;
  const fs = clamp(w * 0.04, 12, 17), wide = bw > 230;
  const topPad = wide ? fs * 3.2 : fs * 2.1;
  const ps = Math.max(24, Math.min(cs * 0.78, (binsH - topPad - 8) / 2.05, (bw - 14) / 2.1));
  const home = (i) => ({ x: gx + (i % 4) * (cs + gap) + cs / 2, y: areaY + Math.floor(i / 4) * (cs + gap) + cs / 2 });
  const slot = (bin, sl) => ({ x: bin.x + bin.w / 2 + (sl % 2 ? 1 : -1) * (ps / 2 + 3), y: bin.y + topPad + Math.floor(sl / 2) * (ps + 5) + ps / 2 });
  return { bins, cs, ps, fs, wide, home, slot };
}
const binAt = (L, p) => ['body', 'trace'].find((k) => { const b = L.bins[k]; return p.x > b.x - 6 && p.x < b.x + b.w + 6 && p.y > b.y - 6 && p.y < b.y + b.h + 6; });
function fitText(c, text, maxW, fs0, min = 8) {
  let fs = fs0; c.font = `800 ${fs}px Nunito, sans-serif`;
  while (c.measureText(text).width > maxW && fs > min) { fs -= 0.5; c.font = `800 ${fs}px Nunito, sans-serif`; }
}

function drawSort(c, w, h, dt, time) {
  const L = sortLayout(w, h), t = T[lang];
  // boxes
  for (const k of ['body', 'trace']) {
    const b = L.bins[k], hot = Q.hover === k || (Q.sel && !Q.drag);
    rr(c, b.x, b.y, b.w, b.h, 16);
    c.fillStyle = Q.done ? 'rgba(61,220,151,.10)' : hot ? 'rgba(130,145,190,.2)' : 'rgba(130,145,190,.09)'; c.fill();
    c.setLineDash(hot ? [] : [6, 5]); c.lineWidth = 1.8; c.strokeStyle = hot ? 'rgba(255,255,255,.8)' : 'rgba(130,145,190,.45)'; c.stroke(); c.setLineDash([]);
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    fitText(c, t.so[k], b.w - 14, L.fs, 10); c.fillText(t.so[k], b.x + b.w / 2, b.y + L.fs * 1.1);
    if (L.wide) { fitText(c, t.so[k + 'D'], b.w - 14, L.fs * 0.8, 9); c.fillStyle = '#98A0B8'; c.fillText(t.so[k + 'D'], b.x + b.w / 2, b.y + L.fs * 2.3); }
  }
  // cards
  const counts = { body: 0, trace: 0 };
  Q.items.forEach((it) => { if (it.placed) it.slot = counts[it.placed]++; });
  for (const it of Q.items) {
    const dragging = Q.drag?.it === it;
    const target = dragging ? { x: Q.drag.px + Q.drag.dx, y: Q.drag.py + Q.drag.dy } : it.placed ? L.slot(L.bins[it.placed], it.slot) : L.home(it.i);
    const tsz = it.placed ? L.ps : L.cs;
    if (it.x === -999) { it.x = target.x; it.y = target.y; it.sz = tsz; }
    if (dragging) { it.x = target.x; it.y = target.y; } else { const k = 1 - Math.exp(-dt * 14); it.x += (target.x - it.x) * k; it.y += (target.y - it.y) * k; }
    it.sz += (tsz - it.sz) * (1 - Math.exp(-dt * 14));
    it.shake = Math.max(0, it.shake - dt * 2.2); it.flash = Math.max(0, it.flash - dt * 1.4);
  }
  const order = [...Q.items].sort((a, b) => (Q.drag?.it === a ? 1 : 0) - (Q.drag?.it === b ? 1 : 0));
  for (const it of order) {
    const dragging = Q.drag?.it === it, sz = it.sz * (dragging ? 1.12 : 1), x = it.x + Math.sin(time * 55) * 6 * it.shake, y = it.y;
    c.save();
    if (dragging) { c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 16; c.shadowOffsetY = 6; }
    c.drawImage(iconCanvas(it.id), x - sz / 2, y - sz / 2, sz, sz);
    c.restore();
    rr(c, x - sz / 2, y - sz / 2, sz, sz, sz * 0.16);
    if (it.shake > 0.05) { c.strokeStyle = `rgba(255,90,77,${Math.min(1, it.shake * 1.5)})`; c.lineWidth = 3; }
    else if (it.flash > 0.02) { c.strokeStyle = `rgba(61,220,151,${it.flash})`; c.lineWidth = 3; }
    else if (Q.sel === it) { c.strokeStyle = '#fff'; c.lineWidth = 3; }
    else { c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 1.2; }
    c.stroke();
    if (!it.placed && it.sz >= 56) {
      const lh = Math.max(13, sz * 0.22);
      c.save(); rr(c, x - sz / 2, y - sz / 2, sz, sz, sz * 0.16); c.clip();
      c.fillStyle = 'rgba(10,12,20,.72)'; c.fillRect(x - sz / 2, y + sz / 2 - lh, sz, lh);
      c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; fitText(c, t.nm[it.id], sz - 6, Math.max(9, sz * 0.14), 7);
      c.fillText(t.nm[it.id], x, y + sz / 2 - lh / 2 + 0.5);
      c.restore();
    }
  }
}

// ---------------------------------------------------------------------------------------------------------
// 8. Pointers
// ---------------------------------------------------------------------------------------------------------
const cv = $('cv');
const posOf = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
function evaluate(it, bin) {
  if (it.kind === bin) {
    it.placed = bin; it.flash = 1; Q.last = it.id; Q.wrong = null; Q.sel = null; sfx.good();
    if (Q.items.every((i) => i.placed)) { Q.done = true; store.set('fossils:sorted', true); }
  } else { it.shake = 1; Q.wrong = it.id; Q.sel = null; sfx.bad(); }
  render();
}
cv.addEventListener('pointerdown', (ev) => {
  const p = posOf(ev);
  try { cv.setPointerCapture(ev.pointerId); } catch { /* fine without capture */ }
  if (lab.view === 'dig') {
    Object.assign(D.ptr, { x: p.x, y: p.y, down: true, t: nowS() }); D.lx = p.x; D.ly = p.y;
    if (!D.done) brushAt(p.x, p.y, 10);
  } else if (lab.view === 'sort') {
    const { w, h } = cvLoop.size(), L = sortLayout(w, h);
    const hit = [...Q.items].reverse().find((it) => !it.placed && Math.abs(p.x - it.x) <= it.sz / 2 && Math.abs(p.y - it.y) <= it.sz / 2);
    if (hit) { Q.drag = { it: hit, dx: hit.x - p.x, dy: hit.y - p.y, px: p.x, py: p.y, sx: p.x, sy: p.y, moved: false }; Q.wrong = null; }
    else if (Q.sel) { const b = binAt(L, p); if (b) evaluate(Q.sel, b); }
  }
});
cv.addEventListener('pointermove', (ev) => {
  const p = posOf(ev);
  if (lab.view === 'dig') {
    if (D.ptr.down) {
      const d = Math.hypot(p.x - D.lx, p.y - D.ly); D.lx = p.x; D.ly = p.y;
      Object.assign(D.ptr, { x: p.x, y: p.y, t: nowS() });
      if (!D.done) brushAt(p.x, p.y, d);
    }
  } else if (lab.view === 'sort' && Q.drag) {
    const { w, h } = cvLoop.size();
    Q.drag.px = p.x; Q.drag.py = p.y;
    if (Math.hypot(p.x - Q.drag.sx, p.y - Q.drag.sy) > 8) Q.drag.moved = true;
    Q.hover = binAt(sortLayout(w, h), p) ?? null;
  }
});
const release = (ev) => {
  if (lab.view === 'dig') { D.ptr.down = false; D.ptr.t = nowS(); }
  else if (lab.view === 'sort' && Q.drag) {
    const { w, h } = cvLoop.size(), p = posOf(ev), d = Q.drag; Q.drag = null; Q.hover = null;
    if (d.moved) { const b = binAt(sortLayout(w, h), p); if (b) evaluate(d.it, b); }
    else { Q.sel = Q.sel === d.it ? null : d.it; sfx.click(); }
  }
};
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', (ev) => { if (lab.view === 'sort') { Q.drag = null; Q.hover = null; } else release(ev); });

// ---------------------------------------------------------------------------------------------------------
// 9. Go
// ---------------------------------------------------------------------------------------------------------
const cvLoop = canvasLoop(cv, (c, w, h, dt, time) => {
  if (lab.view === 'make') drawMake(c, w, h, dt, time);
  else if (lab.view === 'dig') drawDig(c, w, h, dt, time);
  else drawSort(c, w, h, dt, time);
});
render();
</script>
</body>
</html>
