    if (tt >= 6.2) sprout(c, g.dx + rr * 0.6, gy, eio((tt - 7.2) / 0.8), g.sH / 280);
    coconut(c, x, y, rr, rot);
    // the near wave overlaps the nut a little
    if (tt >= 1.8 && tt < 6.2) { c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2; c.beginPath(); for (let q = x - 24; q <= x + 24; q += 4) { const yy = wy + 2 + Math.sin(q * 0.06 + time * 1.3) * 2.5; if (q === x - 24) c.moveTo(q, yy); else c.lineTo(q, yy); } c.stroke(); }
  } else if (by === 'burst') {
    const L = fr * 3.2, shake = tt > 0.8 && tt < 1.5 ? Math.sin(tt * 60) * 1.6 : 0, open = eio((tt - 1.5) / 0.4);
    pod(c, ax + shake, g.ay, L, open, clamp01(tt / 1.4));
    const vxs = [60, 95, 130, 165].map((v) => v * w / 343), vy = 160, gr = 600, y0 = g.ay;
    vxs.forEach((vx, i) => {
      const q = tt - (1.6 + i * 0.08); if (q < 0) { if (open < 0.05) return; pea(c, ax - L * 0.25 + i * L * 0.17, g.ay + L * 0.04, fr * 0.36); return; }
      const T_ = (vy + Math.sqrt(vy * vy + 2 * gr * (gy - fr * 0.4 - y0))) / gr, qq = Math.min(q, T_);
      const x = ax + vx * qq, y = y0 - vy * qq + 0.5 * gr * qq * qq;
      pea(c, x, Math.min(y, gy - fr * 0.4), fr * 0.36);
      if (i === 1) sprout(c, x, gy, eio((tt - 1.6 - i * 0.08 - T_ - 0.5) / 1.5), g.sH / 280);
    });
  } else if (by === 'wind') {
    const sx = ax, sy = hangY, ex = g.dx, ey = gy - 6;
    puffball(c, ax, hangY, fr * 1.6, tt > 0.8);
    if (tt > 0.5 && tt < 6) { c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.lineCap = 'round'; for (let i = 0; i < 7; i++) { const yy = g.top + g.sH * (0.15 + 0.5 * hash(i + 2)), xx = ((hash(i) * w + tt * 140) % (w + 80)) - 40; c.beginPath(); c.moveTo(xx, yy); c.quadraticCurveTo(xx + 20, yy - 4, xx + 40, yy); c.stroke(); } }
    if (tt > 0.8) {
      const u = clamp01((tt - 0.8) / 5.4), e = eio(u), x = lerp(sx, ex, e) + Math.sin(u * 14) * 4;
      const y = sy + (ey - sy) * Math.pow(u, 2.2) - Math.sin(u * Math.PI) * g.sH * 0.14 + Math.sin(u * 20) * 2;
      dandelion(c, x, tt >= 6.2 ? ey - fr * 0.2 : y, fr * 1.3, tt >= 6.2 ? 1.35 : Math.sin(u * 12) * 0.2);
      sprout(c, ex + 6, gy, eio((tt - 6.2) / 0.8), g.sH / 280);
    }
  }
  c.restore();
}

function lightScene(c, w, h, dt, time) {
  const g = lightGeo(w, h), pts = lightCalc(S.sp / 100), N = pts.length;
  if (S.lPh === 'grow') { S.lT += dt / 2.6; if (S.lT >= 1) { S.lT = 1; S.lPh = 'done'; render(); } }
  const gr = S.lPh === 'ask' ? -1 : eio(S.lT);
  sky(c, w, 0, h); c.fillStyle = lg(c, 0, 0, 0, h, [[0, '#76b0d8'], [0.32, '#d8ebe2'], [0.34, '#86c46c'], [1, '#4d8c4c']]); c.fillRect(0, 0, w, h);
  hills(c, w, h * 0.34, h * 0.12);
  c.fillStyle = lg(c, 0, h * 0.3, 0, h, [[0, '#82c068'], [1, '#4a8a4a']]); c.fillRect(0, h * 0.33, w, h);
  c.save(); c.translate(g.bx, g.by); c.scale(1, 0.5); c.fillStyle = rg(c, 0, 0, g.Rs * 0.1, 0, 0, g.Rs, [[0, 'rgba(8,24,34,.62)'], [0.72, 'rgba(8,24,34,.5)'], [1, 'rgba(8,24,34,0)']]); c.beginPath(); c.arc(0, 0, g.Rs, 0, Math.PI * 2); c.fill(); c.restore();
  sun(c, w - 34, 30, 12, time);
  tree(c, g.bx, g.by, g.trunkH, g.Rc, time, 1.2);
  // seeds, back to front
  const items = pts.map((p, i) => { S.lcur[i] += (p.r - S.lcur[i]) * Math.min(1, dt * 6); const r = S.lcur[i]; return { p, X: g.bx + r * Math.cos(p.th) * g.Rx, Y: g.by + r * Math.sin(p.th) * g.Ry }; }).sort((a, b) => a.Y - b.Y);
  const maxH = Math.min(34, h * 0.1);
  items.forEach(({ p, X, Y }) => {
    c.fillStyle = 'rgba(10,30,15,.3)'; c.beginPath(); c.ellipse(X, Y + 1, 5, 2.2, 0, 0, Math.PI * 2); c.fill();
    if (gr < 0) {
      c.fillStyle = lg(c, X - 3, Y - 4, X + 3, Y + 2, [[0, '#d9b27a'], [1, '#7a5430']]); c.beginPath(); c.ellipse(X, Y - 2, 3.4, 2.5, 0.5, 0, Math.PI * 2); c.fill();
    } else {
      const sz = 0.12 + 0.88 * p.size, hgt = maxH * sz * gr + 3, col = mix('#9aad7a', '#3fbf55', (p.size - 0.2) / 0.8), lw = 3 + 5 * sz * gr;
      c.strokeStyle = col; c.lineWidth = 2; c.lineCap = 'round'; c.beginPath(); c.moveTo(X, Y); c.lineTo(X, Y - hgt); c.stroke();
      leaf(c, X, Y - hgt * 0.8, X + lw * 1.4, Y - hgt - lw * 0.2, -1, lw * 0.5, col); leaf(c, X, Y - hgt * 0.65, X - lw * 1.4, Y - hgt * 0.9 - lw * 0.1, 1, lw * 0.5, col);
    }
  });
  pill(c, T[lang].l.shade, g.bx + g.Rs * 0.7, g.by + g.Rs * 0.36, w, h);
  if (gr >= 0) pill(c, T[lang].l.illus, 8, h - 14, w, h, 'left');
  else pill(c, `${N} ${T[lang].l.seeds}`, 8, h - 14, w, h, 'left');
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  if (v === 'wind') { if (S.sec === 'air') drawAir(c, w, h, time); else windScene(c, w, h, dt, time); }
  else if (v === 'ride') { S.pv += ((S.press ? 1 : 0) - S.pv) * Math.min(1, dt * 4); if (S.sec === 'burr') drawBurr(c, w, h, time); else rideScene(c, w, h, dt, time); }
  else lightScene(c, w, h, dt, time);
});

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('cv').addEventListener('pointerdown', () => { if (lab.view === 'ride' && S.sec === 'burr') { S.press = !S.press; sfx.snap(); render(); } });
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = b.dataset.k;
  if (act === 'wg') { S.wGuess = k; S.wPhase = 'fly'; S.simT = 0; sfx.click(); render(); showStage(); }
  else if (act === 'wdrop') { S.wPhase = 'fly'; S.simT = 0; sfx.click(); render(); showStage(); }
  else if (act === 'wnew') { S.wGuess = null; S.wPhase = 'ask'; S.simT = 0; S.wind = Math.max(1, S.wind); sfx.click(); render(); }
  else if (act === 'rpick') {
    const R = ROUNDS[S.rI]; S.rPick = k; S.rRes[S.rI] = k === R.by; S.rPh = 'go'; S.rT = 0; sfx.click(); render(); showStage();
  } else if (act === 'rnext') { S.rI++; S.rPh = 'ask'; S.rPick = null; S.rT = 0; sfx.click(); render(); }
  else if (act === 'ragain') { S.rI = 0; S.rPh = 'ask'; S.rPick = null; S.rT = 0; S.rRes = []; S.rDone = []; sfx.click(); render(); }
  else if (act === 'lg') { S.lGuess = +k; S.lPh = 'grow'; S.lT = 0; sfx.click(); render(); showStage(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (S.sec === k) S.sec = null;
    else { S.sec = k; const want = SECV[k]; if (lab.view !== want) document.querySelector(`#views [data-view="${want}"]`)?.click(); }
    sfx.click(); render();
  }
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'wSl') {
    const v = +ev.target.value; S.wind = S.wGuess === null ? Math.max(1, v) : v;
    if (S.wGuess !== null && S.wPhase !== 'fly') { S.wPhase = 'ready'; S.simT = 0; }
    render();
  } else if (id === 'sSl') { S.strip = +ev.target.value; sfx.tick(); render(); }
  else if (id === 'lSl') { S.sp = +ev.target.value; if (S.lPh !== 'ask') { S.lPh = 'grow'; S.lT = 0; } render(); }
});

// --- one render per change: controls, readout and the state card -------------------------------------------------
const fact = (o) => ({ emo: o.emo, text: o.text, src: o.src });
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('sWind').hidden = v !== 'wind' || S.sec === 'air';
  $('sRide').hidden = v !== 'ride' || S.sec === 'burr';
  $('sLight').hidden = v !== 'light';
  const unlocked = secret.unlocked(), show = unlocked || allDone();
  $('secRow').hidden = !show;
  $('secRow').innerHTML = ['air', 'burr'].map((k) => `<button class="chip secret ${unlocked ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${unlocked ? `${k === 'air' ? '🌀' : '🧵'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('note').textContent = '';
  if (v === 'wind') renderWind(t); else if (v === 'ride') renderRide(t); else renderLight(t);
}

function renderWind(t) {
  const W = t.w, ph = S.wPhase, wd = S.wind;
  lab.setGlow('rgba(110, 180, 220, .26)');
  if (S.sec === 'air') {
    lab.setReadout('39 cm/s', t.sx.airSub, '', '#ffd58a');
    lab.setState({ emo: '🌀', title: t.sx.air[0], lead: t.sx.air[1], body: t.sx.air[2], extra: '' });
    lab.setFacts([fact(t.f.air)]); return;
  }
  $('wQ').hidden = ph !== 'ask'; $('wQ').textContent = ph === 'ask' ? W.q : '';
  $('wOpts').hidden = ph !== 'ask';
  $('wOpts').innerHTML = ph === 'ask' ? SEEDS.map((s) => `<button class="sd-opt" data-act="wg" data-k="${s.k}">${esc(t.seed[s.k])}</button>`).join('') : '';
  $('wBtns').hidden = ph === 'ask';
  $('wBtns').innerHTML = ph === 'ask' ? '' : `<button class="btn" data-act="wdrop"${ph === 'fly' ? ' disabled' : ''}>${esc(ph === 'ready' ? W.drop : W.again)}</button><button class="sd-opt" data-act="wnew"${ph === 'fly' ? ' disabled' : ''}>${esc(W.newg)}</button>`;
  $('wLbl').textContent = W.wind; $('wE0').textContent = W.calm; $('wE1').textContent = W.strong;
  const sl = $('wSl'); sl.min = S.wGuess === null ? 1 : 0; sl.value = wd; sl.disabled = ph === 'fly'; sl.setAttribute('aria-label', W.wind);
  const ranks = SEEDS.map((s) => ({ k: s.k, d: wd * fallTime(s.k) })).sort((a, b) => b.d - a.d), best = ranks[0].k;
  const done = ph === 'done';
  lab.setReadout(`${num(wd)} ${t.ms}`, W.wind, done && wd > 0 ? `🏁 ${t.seed[best]} ≈ ${fmtD(ranks[0].d)} ${t.m}` : '', '#6eb4dc');
  if (ph === 'ask') lab.setState({ emo: '🤔', title: W.q, lead: W.ask, body: W.askBody, extra: '' });
  else if (ph === 'fly') lab.setState({ emo: '🍃', title: W.fly, lead: W.flyLead, body: '', extra: '' });
  else if (ph === 'ready') lab.setState({ emo: '🌬️', title: W.readyT, lead: W.ready(num(wd)), body: '', extra: '' });
  else if (wd === 0) lab.setState({ emo: '🌿', title: W.calm0, lead: W.calm0Lead, body: '', extra: '' });
  else {
    const ok = S.wGuess === best;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? W.right : W.miss, lead: W.res(t.seed[best], fmtD(ranks[0].d)),
      body: ranks.map((r) => `${t.seed[r.k]} ≈ ${fmtD(r.d)} ${t.m}`).join(' · '), extra: `<div class="sd-fine">${esc(W.why)}<br>${esc(W.model)}</div>` });
  }
  lab.setFacts(ph === 'ask' ? [fact(t.f.pre)] : [fact(t.f.mapleV), fact(t.f.dandV), fact(t.f.acornF)]);
}

function renderRide(t) {
  const R = t.r, i = S.rI, end = i >= 5, ph = S.rPh;
  lab.setGlow('rgba(224, 176, 80, .24)');
  const k = S.rRes.filter(Boolean).length;
  if (S.sec === 'burr') {
    lab.setReadout('1941', t.sx.burrSub, '', '#d9a05f');
    lab.setState({ emo: '🧵', title: t.sx.burr[0], lead: t.sx.burr[1], body: t.sx.burr[2], extra: '' });
    lab.setFacts([fact(t.f.velcro)]); return;
  }
  const rd = ROUNDS[Math.min(i, 4)], name = R.fruits[rd.f];
  $('sLbl').textContent = R.strip; $('sNote').textContent = R.note[S.strip]; $('sSl').value = S.strip; $('sSl').setAttribute('aria-label', R.strip);
  $('rQ').hidden = end || ph !== 'ask'; $('rQ').textContent = end || ph !== 'ask' ? '' : R.q(name);
  $('rOpts').hidden = end || ph !== 'ask';
  $('rOpts').innerHTML = end || ph !== 'ask' ? '' : ['fur', 'bird', 'sea', 'burst', 'wind'].map((x) => `<button class="sd-opt" data-act="rpick" data-k="${x}">${esc(R.trav[x])}</button>`).join('');
  $('rBtns').hidden = !(end || ph === 'done');
  $('rBtns').innerHTML = end ? `<button class="btn" data-act="ragain">${esc(R.again)}</button>` : ph === 'done' ? `<button class="btn" data-act="rnext">${esc(R.next)}</button>` : '';
  lab.setReadout(end ? `${k}/5` : name, end ? '' : R.round(i + 1, 5), S.rDone.some(Boolean) && !end ? `✔ ${k}` : '', '#e0b050');
  if (end) lab.setState({ emo: '🏆', title: R.end(k), lead: R.endLead, body: '', extra: '' });
  else if (ph === 'ask') lab.setState({ emo: '🤔', title: R.q(name), lead: R.ask, body: '', extra: '' });
  else if (ph === 'go') lab.setState({ emo: '👀', title: R.watch, lead: R.q(name), body: '', extra: '' });
  else { const ok = S.rRes[i]; lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? R.right : R.miss, lead: R.how[rd.f], body: '', extra: '' }); }
  lab.setFacts(end || ph !== 'done' ? [fact(t.f.fruit)] : [fact(t.f[rd.f]), fact(t.f.fruit)]);
}

function renderLight(t) {
  const L = t.l, ph = S.lPh, pts = lightCalc(S.sp / 100), N = pts.length;
  lab.setGlow('rgba(232, 215, 122, .24)');
  $('lQ').hidden = ph !== 'ask'; $('lQ').textContent = ph === 'ask' ? L.q : '';
  $('lOpts').hidden = ph !== 'ask';
  $('lOpts').innerHTML = ph === 'ask' ? L.opts.map((o, j) => `<button class="sd-opt" data-act="lg" data-k="${j}">${esc(o)}</button>`).join('') : '';
  $('lLbl').textContent = L.spread; $('lE0').textContent = L.near; $('lE1').textContent = L.far; $('lSl').value = S.sp; $('lSl').setAttribute('aria-label', L.spread);
  const light = pts.filter((p) => !p.shade), shade = pts.filter((p) => p.shade), a = light.filter((p) => p.ok).length, b = shade.filter((p) => p.ok).length, A = a + b;
  if (ph === 'ask') {
    lab.setReadout(String(N), L.seeds, '', '#e8d77a');
    lab.setState({ emo: '🤔', title: L.q, lead: L.ask, body: L.askBody, extra: '' });
    lab.setFacts([]);
  } else {
    lab.setReadout(`${A}/${N}`, L.ok, `☀️ ${a} · 🌑 ${b}`, '#e8d77a');
    if (ph === 'grow') lab.setState({ emo: '🌱', title: L.grow, lead: L.growLead, body: '', extra: '' });
    else {
      const ok = S.lGuess === 1;
      lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? L.right : L.miss, lead: light.length ? L.res(L.of(a, light.length), L.of(b, shade.length)) : L.none, body: L.why, extra: `<div class="sd-fine">${esc(L.note)}</div>` });
    }
    lab.setFacts(ph === 'done' ? [fact(t.f.far), fact(t.f.bell)] : []);
  }
}
render();
