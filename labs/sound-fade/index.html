  const Wk = S.w, pre = Wk.guess === null, d = Wk.d, seg = walkSeg(d, Wk.sec), tw = t.w;
  card.className = 'sf-card card'; card.hidden = !(pre || !Wk.ack);
  if (pre) card.innerHTML = `<div class="q">${esc(tw.q)}</div>${cardOpts(tw.opts, 'data-g')}`;
  else if (!Wk.ack) {
    const ok = Wk.guess === tw.ok;
    card.innerHTML = `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? tw.right : tw.wrong)}</div><p>${esc(tw.reveal(fmt1(DROP_NEAR), fmt1(DROP_FAR)))}</p><div class="opts"><button data-act="wack">${esc(tw.go)} →</button></div>`;
  }
  const bs = document.querySelectorAll('#secWalk [data-act=back], #secWalk [data-act=fwd]');
  bs[0].textContent = tw.back; bs[1].textContent = tw.fwd;
  bs.forEach((b) => { b.disabled = pre; });
  bs[0].disabled = pre || d <= 0; bs[1].disabled = pre || d >= 100;
  $('wSecRow').hidden = pre;
  const open = secret.unlocked(), sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${Wk.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('wSec').innerHTML = sc('hose', '🌀') + sc('night', '🌙');
  const kra = { emo: '🌋', text: t.facts.kra, src: 'en.wikipedia.org/wiki/1883_eruption_of_Krakatoa' };
  if (pre) {
    lab.setReadout('0', t.from(0), '', acc.walk);
    lab.setState({ emo: '🥁', title: tw.q, lead: tw.lead0, body: '', extra: '' });
    lab.setFacts([]); return;
  }
  lab.setReadout(String(d), t.from(d), `🔊 ${fmt1(seg)} / 10`, acc.walk);
  let st;
  if (Wk.sec) st = { emo: Wk.sec === 'hose' ? '🌀' : '🌙', title: tw[Wk.sec][0], lead: tw[Wk.sec][1], body: tw[Wk.sec][2] };
  else { const k = d <= 15 ? tw.near : d <= 40 ? tw.mid : tw.far; st = { emo: d <= 15 ? '🥁' : d <= 40 ? '🚶' : '🌳', title: k[0], lead: k[1], body: '' }; }
  lab.setState({ ...st, extra: fineHtml(t) });
  lab.setFacts(Wk.sec === 'hose' ? [{ emo: '📞', text: t.facts.pipe, src: 'en.wikipedia.org/wiki/Speaking_tube' }, kra]
    : Wk.sec === 'night' ? [{ emo: '🌙', text: t.facts.invs, src: 'en.wikipedia.org/wiki/Temperature_inversion' }, kra] : [kra]);
}

function renderCone(t) {
  const C = S.c, tc = t.c, pre = C.guess === null;
  card.className = 'sf-card card'; card.hidden = !(pre || !C.ack);
  if (pre) card.innerHTML = `<div class="q">${esc(tc.q)}</div>${cardOpts(tc.opts, 'data-cg')}`;
  else if (!C.ack) {
    const ok = C.guess === tc.ok;
    card.innerHTML = `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? tc.right : tc.wrong)}</div><p>${esc(tc.reveal)}</p><div class="opts"><button data-act="cack">${esc(tc.go)} →</button></div>`;
  }
  $('cOn').textContent = C.on ? tc.onL : tc.offL; $('cOn').classList.toggle('on', C.on);
  $('cTurn').textContent = tc.turn;
  $('cOn').hidden = pre; $('cTurn').hidden = pre;
  const on = !pre && C.on, a = coneSeg(on ? -C.dir * Math.PI / 2 : null), b = coneSeg(on ? Math.PI - C.dir * Math.PI / 2 : null);
  lab.setReadout(`${fmt1(a)} / ${fmt1(b)}`, tc.sub, on ? '📣' : '', acc.cone);
  const ele = { emo: '🐘', text: t.facts.ele, src: 'en.wikipedia.org/wiki/Elephant_communication' };
  if (pre) { lab.setState({ emo: '📣', title: tc.pre[0], lead: tc.lead0, body: '', extra: '' }); lab.setFacts([]); return; }
  const front = C.dir % 4 === 0 || C.dir % 4 === 2, k = !C.on ? tc.off : front ? tc.front : tc.side;
  lab.setState({ emo: !C.on ? '🔈' : front ? '📣' : '↕️', title: k[0], lead: k[1], body: k[2], extra: `<div class="fine">${esc(tc.fine)}</div>` });
  lab.setFacts([ele]);
}

function renderBell(t) {
  const B = S.b, tb = t.b, E = bellEval(), k = B.task;
  card.hidden = true;
  if (E.all) B.solved[k] = true;
  if (E.all && !B.was) sfx.good(); B.was = E.all;
  $('bChips').innerHTML = tb.tasks.map((l, i) => `<button class="chip ${i === k ? 'on' : ''}" data-act="task" data-k="${i}">${esc(l)}</button>`).join('')
    + `<button class="chip" data-act="reset">${esc(tb.reset)}</button>`
    + (k === 0 && B.solved[0] ? `<button class="chip" data-act="task" data-k="1">${esc(tb.next)}</button>` : '');
  lab.setReadout(`${E.heard}/${E.n}`, tb.sub, '', acc.bell);
  let st;
  if (E.all) {
    const d = k === 0 ? tb.done1 : tb.done2;
    st = { emo: '🎉', title: d[0], lead: k === 0 ? d[1](E.far, bestSpot()) : d[1](), body: d[2] };
  } else {
    const p = k === 0 ? tb.t1 : tb.t2;
    st = { emo: '🔔', title: p[0], lead: p[1], body: tb.heard(E.heard, E.n) };
  }
  lab.setState({ ...st, extra: `<div class="fine">${esc(tb.fine)}</div>` });
  lab.setFacts([{ emo: '📐', text: t.facts.inv(Math.round(DB_DOUBLE)), src: 'en.wikipedia.org/wiki/Inverse-square_law' }]);
}
// --- one frame ------------------------------------------------------------------------------------------------
function gated() { return lab.view !== 'walk' && S.w.guess === null; }
canvasLoop($('cv'), (c, w, h, dt, time) => {
  V.w = w; V.h = h;
  if (gated()) { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#223a30'); g.addColorStop(1, '#16241f'); c.fillStyle = g; rr(c, 4, 4, w - 8, h - 8, 18); c.fill(); return; }
  if (lab.view === 'walk') drawWalk(c, w, h, dt, time); else if (lab.view === 'cone') drawCone(c, w, h, dt, time); else drawBell(c, w, h, dt, time);
});

render();
</script>
</body>
</html>
