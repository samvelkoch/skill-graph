  let g = c.createLinearGradient(x, y, x + w, bottom); g.addColorStop(0, '#9c7a5c'); g.addColorStop(1, '#503c2e');
  c.fillStyle = g; c.strokeStyle = '#33271f'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(x + 8, y + 22); c.lineTo(x + w - 8, y + 22); c.quadraticCurveTo(x + w - 20, y + 54, mid + 16, bottom); c.quadraticCurveTo(mid, bottom + 6, mid - 16, bottom); c.quadraticCurveTo(x + 20, y + 54, x + 8, y + 22);
  c.closePath(); c.fill(); c.stroke();
  g = c.createLinearGradient(x, y, x + w * .6, y + 34); g.addColorStop(0, '#8fe0a8'); g.addColorStop(1, '#3e9f6e');
  c.fillStyle = g; c.strokeStyle = '#276a47'; rr(c, x, y, w, 34, 17); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.28)'; rr(c, x + 12, y + 5, w * .4, 5, 2.5); c.fill();
  c.restore();
}
function sentCard(c, x, y, w, h, text, e, bob) {
  c.save(); c.translate(0, bob); c.globalAlpha = 1;
  c.fillStyle = 'rgba(0,0,0,.25)'; rr(c, x + 2, y + 4, w, h, 14); c.fill();
  const g = c.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#eadfc6');
  c.fillStyle = g; c.strokeStyle = '#a58f66'; c.lineWidth = 1.6; rr(c, x, y, w, h, 14); c.fill(); c.stroke();
  let size = 13, lh = 16, lines;
  for (;;) { c.font = `800 ${size}px ${SANS}`; lines = wrap(c, text, w - 16); if (lines.length * lh <= h - 28 || size <= 12) break; size = 12; lh = 14.5; }
  c.fillStyle = '#2c2a35'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const top = y + 26 + (h - 28 - lines.length * lh) / 2;
  lines.forEach((ln, i) => c.fillText(ln, x + w / 2, top + lh * (i + .5)));
  c.fillStyle = '#fff'; c.strokeStyle = '#a58f66'; c.beginPath(); c.arc(x + 20, y + 3, 15, 0, 7); c.fill(); c.stroke();
  emoji(c, e, x + 20, y + 3, 18);
  c.restore();
}
function bridge(c, kind, cx, cy, e, bad, time) {
  const col = bad ? '#8a90a8' : COL[kind];
  c.save(); c.globalAlpha = 1;
  c.fillStyle = `rgba(0,0,0,${.25 * clamp01(e)})`; c.beginPath(); c.ellipse(cx, cy + 20, 32, 5, 0, 0, 7); c.fill();
  c.translate(cx, cy - (1 - e) * 80); if (bad) c.rotate(.12);
  const g = c.createLinearGradient(-34, -14, 34, 14); g.addColorStop(0, tint(col, .3)); g.addColorStop(1, shade(col, .15));
  c.fillStyle = g; c.strokeStyle = shade(col, .5); c.lineWidth = 2; rr(c, -35, -15, 70, 30, 9); c.fill(); c.stroke();
  c.fillStyle = shade(col, .45); for (const sx of [-1, 1]) { c.beginPath(); c.arc(sx * 28, 0, 2.2, 0, 7); c.fill(); }
  c.fillStyle = 'rgba(255,255,255,.3)'; rr(c, -26, -11, 40, 4, 2); c.fill();
  icon(c, kind, .95);
  if (bad) { c.strokeStyle = '#1b1d2c'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(-6, -15); c.lineTo(1, -5); c.lineTo(-3, 2); c.lineTo(5, 15); c.stroke(); }
  c.restore();
}
function slot(c, cx, cy, time) {
  c.save(); c.globalAlpha = .6 + .3 * Math.sin(time * 3); c.strokeStyle = '#fff'; c.lineWidth = 2; c.setLineDash([6, 5]); rr(c, cx - 35, cy - 15, 70, 30, 9); c.stroke(); c.setLineDash([]);
  c.globalAlpha = 1; c.font = `900 18px ${SANS}`; c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', cx, cy + 1); c.restore();
}

// scene with robot, cloud, two islands and the bridge
function drawPair(c, time, o) {
  const age = time - o.at, e = ease(age / .6), pe = ease(age / .5);
  const bobA = Math.sin(time * 1.4) * 2, bobB = Math.sin(time * 1.4 + 1.6) * 2;
  robot(c, 64, 62, 30, o.mood, time);
  cloudScene(c, o.sc, time, o.sc.hide ? 1 : pe);
  island(c, 6, 222, 150, bobA); island(c, 204, 222, 150, bobB);
  sentCard(c, 14, 128, 134, 94, o.a, o.ea, bobA); sentCard(c, 212, 128, 134, 94, o.b, o.eb, bobB);
  if (o.kind) {
    bridge(c, o.kind, 180, 228, e, o.bad, time);
    pillText(c, o.word, 180, 284, 14, o.bad ? 'rgba(80,84,104,.9)' : shade(COL[o.kind], .5));
  } else slot(c, 180, 228, time);
}

// --- map view ----------------------------------------------------------------------------------------------
const BX = [14, 176], BW = 170, BH = 40, BY = (i) => 10 + i * 70;
function mapBox(c, i, dx, label, e) {
  const x = BX[i % 2] + dx, y = BY(i);
  c.save(); c.globalAlpha = 1;
  c.fillStyle = 'rgba(0,0,0,.25)'; rr(c, x + 2, y + 4, BW, BH, 13); c.fill();
  const g = c.createLinearGradient(x, y, x + BW, y + BH); g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#eadfc6');
  c.fillStyle = g; c.strokeStyle = '#a58f66'; c.lineWidth = 1.6; rr(c, x, y, BW, BH, 13); c.fill(); c.stroke();
  emoji(c, e, x + 22, y + BH / 2, 22);
  c.font = `800 13px ${SANS}`; c.fillStyle = '#2c2a35'; c.textAlign = 'left'; c.textBaseline = 'middle';
  const lines = c.measureText(label).width > BW - 50 ? wrap(c, label, BW - 50) : [label];
  lines.slice(0, 2).forEach((ln, k, a) => c.fillText(ln, x + 42, y + BH / 2 + (k - (a.length - 1) / 2) * 15 + 1));
  c.restore();
}
function arrow(c, x1, y1, x2, y2, kind, grey, p, time) {
  const col = grey ? '#8a90a8' : COL[kind], N = 28, pts = [];
  for (let i = 0; i <= N * p; i++) {
    const t = i / N, m = 1 - t, x = m * m * m * x1 + 3 * m * m * t * x1 + 3 * m * t * t * x2 + t * t * t * x2, y = m * m * m * y1 + 3 * m * m * t * (y1 + 14) + 3 * m * t * t * (y2 - 14) + t * t * t * y2;
    pts.push([x + (kind === 'contrast' && !grey && i > 0 && i < N ? (Math.floor(i / 2) % 2 ? 5 : -5) : 0), y]);
  }
  if (pts.length < 2) return;
  c.save(); c.globalAlpha = 1; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 4;
  if (grey) c.setLineDash([4, 6]); else if (kind === 'example') c.setLineDash([7, 7]); else if (kind === 'time') c.setLineDash([.5, 8]);
  c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.stroke(); c.setLineDash([]);
  if (p >= 1) {
    c.beginPath(); c.moveTo(x2 - 7, y2 - 10); c.lineTo(x2 + 7, y2 - 10); c.lineTo(x2, y2 + 1); c.closePath(); c.fill();
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    if (grey) { c.fillStyle = '#4a4f66'; c.strokeStyle = '#8a90a8'; c.lineWidth = 2; c.beginPath(); c.arc(mx, my, 11, 0, 7); c.fill(); c.stroke(); c.strokeStyle = '#fff'; c.lineWidth = 2.2; c.beginPath(); c.moveTo(mx - 4, my - 4); c.lineTo(mx + 4, my + 4); c.moveTo(mx + 4, my - 4); c.lineTo(mx - 4, my + 4); c.stroke(); }
    else badge(c, kind, mx, my, 12);
  }
  c.restore();
}
function drawMap(c, time) {
  const t = T[lang].v3, sec = S.sec;
  if (sec === 'a') { // five pictures that do not connect
    const pos = [[60, 66], [300, 66], [180, 56], [62, 262], [298, 262]], cols = ['#e0a93b', '#e2607f', '#3fb3a6', '#8e7bd8', '#5f8fd0'];
    pos.forEach(([x, y], i) => {
      const bx = x + Math.sin(time * 1.3 + i * 2) * 4, by = y + Math.cos(time * 1.1 + i * 3) * 4;
      c.save(); c.globalAlpha = 1; const g = c.createRadialGradient(bx - 12, by - 14, 4, bx, by, 38); g.addColorStop(0, tint(cols[i], .55)); g.addColorStop(1, shade(cols[i], .25));
      c.fillStyle = g; c.strokeStyle = shade(cols[i], .5); c.lineWidth = 2; c.beginPath(); c.arc(bx, by, 34, 0, 7); c.fill(); c.stroke(); c.restore();
      emoji(c, t.map[i][0], bx, by, 30);
      pillText(c, t.map[i][1], bx, by + 48, 12);
    });
    for (const [x, y] of [[120, 60], [240, 62], [60, 164], [300, 164], [180, 262]]) pillText(c, '?', x, y, 13, 'rgba(100,108,132,.7)', '#d3d9e8');
    robot(c, 180, 156, 32, 'puzzled', time);
    return;
  }
  for (let i = 0; i < 5; i++) {
    let dx = 0;
    if (i === S.shI) { const a = time - S.shAt; if (a < .7) dx = Math.sin(a * 46) * 6 * Math.exp(-a * 4); }
    mapBox(c, i, dx, t.map[i][1], t.map[i][0]);
  }
  for (let i = 0; i < 4; i++) {
    const x1 = BX[i % 2] + BW / 2, y1 = BY(i) + BH, x2 = BX[(i + 1) % 2] + BW / 2, y2 = BY(i + 1);
    if (sec === 'b') { K.forEach((k, j) => arrow(c, x1 + (j - 1.5) * 9 + Math.sin(time * 6 + j) * 2, y1, x2 + (j - 1.5) * 9 + Math.cos(time * 5 + i) * 2, y2, k, false, 1, time)); }
    else if (S.f[i]) arrow(c, x1, y1, x2, y2, S.f[i], false, clamp01((time - S.arAt[i]) / .45), time);
    else if (S.bad[i]) arrow(c, x1, y1, x2, y2, S.bad[i], true, 1, time);
  }
  if (sec === 'b') robot(c, 300, 40, 21, 'dizzy', time);
}

// --- canvas ------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const s = Math.min(w / W, h / H);
  c.save(); c.translate((w - W * s) / 2, (h - H * s) / 2); c.scale(s, s);
  const t = T[lang], v = lab.view;
  if (v === 'pick') {
    if (S.i >= 8) {
      const n = S.res.filter(Boolean).length;
      robot(c, 180, 130, 56, n >= 5 ? 'happy' : 'think', time); pillText(c, `${n} / 8`, 180, 270, 22);
    } else {
      const p = t.pairs[S.i], rk = PAIRS_K[S.i], bad = !!S.pick && !S.fix && S.pick !== rk, k = S.pick ? (S.fix ? rk : S.pick) : null;
      const sc = !S.pick ? { hide: true } : bad ? { bad: true, a: PE[S.i][0], b: PE[S.i][1] } : { a: PE[S.i][0], b: PE[S.i][1], kind: k };
      drawPair(c, time, { at: S.at, mood: !S.pick ? 'think' : bad ? 'puzzled' : 'happy', sc, kind: k, bad, word: k ? t.k[k].w : '', a: p.a, b: p.b, ea: PE[S.i][0], eb: PE[S.i][1] });
    }
  } else if (v === 'small') {
    const id = S.show, L = id ? LK[id] : null, bad = false;
    const sc = L ? { a: '🏃', b: '🏆', kind: L.kind, badge: L.badge, odd: L.odd } : { hide: true };
    drawPair(c, time, { at: S.at2, mood: L ? L.mood : 'think', sc, kind: L ? L.kind : null, bad, word: id ? t.v2.l[id].w : '', a: t.v2.a, b: t.v2.b, ea: '🏃', eb: '🏆' });
  } else drawMap(c, time);
  c.restore();
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const optHTML = (id, k, label, cls = '', dis = false) => `<button type="button" class="gw-opt ${cls}" data-id="${id}" style="--c:${COL[k]}"${dis ? ' disabled' : ''}><span class="ic">${ICO[k]}</span>${esc(label)}</button>`;
const cur3 = () => S.f.findIndex((x) => x === null);

$('o1').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-id]'); if (!b || S.pick || S.i >= 8) return;
  const k = b.dataset.id, rk = PAIRS_K[S.i], ok = k === rk, i = S.i;
  S.pick = k; S.at = now(); S.res[i] = ok; S.fix = ok;
  if (ok) sfx.good(); else {
    sfx.bad(); const tok = ++S.tok;
    setTimeout(() => { if (S.tok === tok && S.pick && S.i === i) { S.fix = true; S.at = now(); sfx.snap(); render(); } }, 1600);
  }
  render(); showStage();
});
$('b1').addEventListener('click', () => {
  S.tok++;
  if (S.i >= 8) { S.i = 0; S.res = []; } else if (S.pick && S.fix) S.i++; else return;
  S.pick = null; S.fix = false; S.at = now(); sfx.click(); render();
});
$('o2').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-id]'); if (!b) return;
  const l = b.dataset.id;
  if (S.p2 === null) {
    S.p2 = l; S.show = l; S.at = now(); S.at2 = now(); S.fix2 = l === 'but';
    if (l === 'but') sfx.good(); else {
      sfx.bad(); const tok = ++S.tok2;
      setTimeout(() => { if (S.tok2 === tok && S.p2 !== null) { S.show = 'but'; S.fix2 = true; S.at2 = now(); sfx.snap(); render(); } }, 1700);
    }
  } else if (S.fix2) { S.show = l; S.at2 = now(); sfx.snap(); }
  else return;
  render(); showStage();
});
$('b2').addEventListener('click', () => { S.tok2++; S.p2 = null; S.show = null; S.fix2 = false; S.at2 = now(); sfx.click(); render(); });
$('o3').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-id]'); if (!b) return;
  S.sec = null; const i = cur3(); if (i < 0) return;
  const k = b.dataset.id; if (S.tried[i].includes(k)) return;
  S.tried[i].push(k);
  if (k === V3K[i]) { S.f[i] = k; S.arAt[i] = now(); if (S.first[i] === undefined) S.first[i] = true; S.msg = { ok: true, k }; sfx.good(); }
  else { S.first[i] = false; S.bad[i] = k; S.shI = i + 1; S.shAt = now(); S.msg = { ok: false, k }; sfx.bad(); }
  render(); showStage();
});
$('b3').addEventListener('click', () => {
  S.f = [null, null, null, null]; S.bad = [null, null, null, null]; S.first = []; S.tried = [[], [], [], []]; S.msg = null; S.sec = null; S.shI = -1; sfx.click(); render();
});
$('secRow').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.sec; S.sec = S.sec === k ? null : k; S.secAt = now(); sfx.click();
  if (lab.view !== 'map') document.querySelector('#views [data-view="map"]')?.click(); else render();
});

// --- render ------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  $('s1').style.display = v === 'pick' ? '' : 'none';
  $('s2').style.display = v === 'small' ? '' : 'none';
  $('s3').style.display = v === 'map' ? '' : 'none';
  const open = secret.unlocked();
  $('secRow').innerHTML = [['a', '🤖'], ['b', '🍯']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${v === 'map' && S.sec === k ? 'on' : ''}" data-sec="${k}" type="button">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setFacts(t.facts[v]);
  if (v === 'pick') renderPick(t); else if (v === 'small') renderSmall(t); else renderMap(t);
}

function renderPick(t) {
  lab.setGlow('rgba(224, 169, 59, .24)');
  const end = S.i >= 8, n = S.res.filter(Boolean).length, rk = PAIRS_K[S.i], v1 = t.v1;
  $('q1').textContent = end ? '' : v1.q; $('q1').style.display = end ? 'none' : '';
  $('o1').style.display = end ? 'none' : '';
  $('o1').innerHTML = K.map((k) => optHTML(k, k, t.k[k].w, S.pick ? (k === rk && S.fix ? 'good' : k === S.pick && !S.fix ? 'bad' : '') : '', !!S.pick)).join('');
  const b = $('b1'); b.hidden = !(end || (S.pick && S.fix)); b.textContent = end ? t.again : t.next;
  lab.setReadout(`${n}/8`, v1.sub, end ? '' : `${S.i + 1} / 8`, '#e0a93b');
  if (end) { const [ti, le] = v1.end(n); lab.setState({ emo: '🏆', title: ti, lead: le, body: '', extra: '' }); return; }
  if (!S.pick) { lab.setState({ emo: '🤖', title: v1.wait[0], lead: v1.wait[1], body: '', extra: '' }); return; }
  const p = t.pairs[S.i];
  if (S.pick === rk) lab.setState({ emo: '✅', title: v1.ok, lead: p.j, body: cap(t.k[rk].m) + '.', extra: '' });
  else lab.setState({ emo: '😵‍💫', title: v1.no(t.k[S.pick].w), lead: v1.noLead(t.k[S.pick].w, t.k[S.pick].m), body: S.fix ? v1.noBody(t.k[rk].w, t.k[rk].m, p.j) : '', extra: '' });
}

function renderSmall(t) {
  lab.setGlow('rgba(226, 96, 127, .24)');
  const v2 = t.v2, id = S.show;
  $('q2').textContent = v2.q;
  $('o2').innerHTML = LINKS.map((l) => optHTML(l, LK[l].kind, v2.l[l].w,
    S.p2 === null ? '' : l === 'but' && S.fix2 ? 'good' + (id === l ? ' on' : '') : S.fix2 ? (id === l ? 'on' : '') : l === S.p2 ? 'bad' : '', S.p2 !== null && !S.fix2)).join('');
  const b = $('b2'); b.hidden = S.p2 === null || !S.fix2; b.textContent = t.again;
  if (id === null) {
    lab.setReadout('?', v2.sub, '', '#e2607f');
    lab.setState({ emo: '🤖', title: v2.wait[0], lead: v2.wait[1], body: '', extra: '' }); return;
  }
  lab.setReadout(esc(v2.l[id].w), v2.sub, '', '#e2607f');
  const L = v2.l[id], first = S.p2 === 'but' && id === 'but';
  lab.setState({ emo: first ? '✅' : '🤖', title: first ? `${v2.ok} ${L.t}` : L.t, lead: L.d, body: !S.fix2 ? v2.noNote : id === 'but' && S.p2 !== 'but' ? v2.fixNote : v2.exploreNote, extra: `<div class="fine">${esc(L.j)}</div>` });
}

function renderMap(t) {
  lab.setGlow('rgba(142, 123, 216, .26)');
  const v3 = t.v3, sec = S.sec, i = cur3(), nf = S.f.filter(Boolean).length, nr = S.first.filter(Boolean).length;
  // the paragraph
  let html = '';
  if (sec === 'a') html = v3.s.map((s, k) => esc(cap(s))).join(' ');
  else if (sec === 'b') html = v3.s.map((s) => `<span class="gw-bl gl">${esc(t.pre)}</span> ${esc(lc(s))}`).join(' ');
  else {
    html = esc(v3.s[0]);
    for (let k = 1; k < 5; k++) {
      const f = S.f[k - 1];
      const bl = f ? `<span class="gw-bl on" style="--c:${COL[f]}">${esc(t.k[f].p)}</span>` : `<span class="gw-bl${i === k - 1 ? ' cur' : ''}">___</span>`;
      html += ` ${bl} ${esc(lc(v3.s[k]))}`;
    }
  }
  $('para').innerHTML = html;
  const showOpts = !sec && i >= 0;
  $('p3').style.display = showOpts ? '' : 'none';
  $('q3').textContent = v3.q;
  $('o3').innerHTML = i >= 0 ? K.map((k) => optHTML(k, k, t.k[k].w, S.tried[i].includes(k) ? 'bad' : '', S.tried[i].includes(k))).join('') : '';
  const b = $('b3'); b.hidden = !(i < 0 && !sec); b.textContent = t.again;
  lab.setReadout(sec ? '' : `${nr}/4`, sec ? t[sec === 'a' ? 'noglue' : 'toomuch'][2] : v3.sub, sec ? '' : `🗺️ ${nf}/4`, '#8e7bd8');
  if (sec) { const q = t[sec === 'a' ? 'noglue' : 'toomuch']; lab.setState({ emo: sec === 'a' ? '🤖' : '😵‍💫', title: q[0], lead: q[1], body: '', extra: '' }); return; }
  if (i < 0) { const [ti, le] = v3.end(nr); lab.setState({ emo: '🗺️', title: ti, lead: le, body: '', extra: '' }); return; }
  if (S.msg && S.msg.ok) { const [ti, le] = v3.ok(t.k[S.msg.k].w, t.k[S.msg.k].m); lab.setState({ emo: '✅', title: ti, lead: le, body: '', extra: '' }); return; }
  if (S.msg && !S.msg.ok) { const [ti, le] = v3.no(t.k[S.msg.k].w); lab.setState({ emo: '🤔', title: ti, lead: le, body: '', extra: '' }); return; }
  lab.setState({ emo: '🗺️', title: v3.start[0], lead: v3.start[1], body: '', extra: '' });
}
render();
</script>
