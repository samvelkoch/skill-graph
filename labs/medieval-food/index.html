    rr(c, -8, -4, 16, 9, 3); c.fill(); c.stroke();
    [-8, -2.4, 3.2].forEach((tx) => { rr(c, tx, -28, 4.8, 26, 2); c.fill(); c.stroke(); });
  }
  c.restore();
}

const FOODS = [
  ['bread', '🍞', 0], ['potato', '🥔', 1], ['cheese', '🧀', 0], ['meat', '🍖', 0], ['corn', '🌽', 1],
  ['apple', '🍎', 0], ['pottage', '🍲', 0], ['choc', '🍫', 1], ['onion', '🧅', 0], ['tomato', '🍅', 1],
];
const PX = 170, PY = 222, PRX = 112, PRY = 50; // trencher
const SLOTS = [[-52, -8], [-8, -16], [38, -8], [-34, 16], [14, 16], [56, 14], [-70, 12], [74, -2], [0, 2]];
const items = FOODS.map(([k, e, am], i) => ({ k, e, am, hx: 34 + 68 * (i % 5), hy: 52 + 56 * Math.floor(i / 5), st: 'home', t0: 0, sx: 0, sy: 0, px: PX, py: PY, slot: -1 }));
const S = {
  askedP: false, ansP: null, askedF: false, ansF: null, askedS: false, ansS: null,
  drag: null, bounced: 0, msgT: -9,
  openT: { lord: -1, peasant: -1 },
  tt: [-1, -1, -1, -1], used: [false, false, false, false], lastTool: -1,
  sec: null, tr: 0, trT: -9, pp: 0, ppT: -9,
};
const placedItems = () => items.filter((it) => it.st === 'placed');
const lab = shell({ key: 'medieval-food', T, topics: TOPICS, views: ['plate', 'feast', 'spoon'], onLang: () => render(), onView: () => { S.sec = null; S.drag = null; render(); } });
const secret = secretLab('medieval-food', () => ({
  secrets: [{ emo: '🍞', title: T[lang].secrets.tr[0], desc: T[lang].secrets.tr[1] }, { emo: '🧂', title: T[lang].secrets.pp[0], desc: T[lang].secrets.pp[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `
  <div id="mfP"><div id="mfAskP"></div><div class="mf-row" id="mfClr"><button type="button" class="chip mf-c" data-act="clear"></button></div></div>
  <div id="mfF"><div id="mfAskF"></div></div>
  <div id="mfS"><div id="mfAskS"></div></div>
  <div id="mfSec"><div class="mf-row" style="margin-top:0"><button type="button" class="chip mf-c" data-act="secgo" id="mfSecGo"></button></div></div>
  <div class="mf-secs" id="mfSecs"></div>`;

// --- pointer: drag or tap foods onto the plate ---------------------------------------------------------------------------
const cv = $('cv');
const pt = (ev) => { const r = cv.getBoundingClientRect(), f = fitBox(r.width, r.height); return { x: (ev.clientX - r.left - f.ox) / f.sc, y: (ev.clientY - r.top - f.oy) / f.sc }; };
const overPlate = (p) => ((p.x - PX) / (PRX + 10)) ** 2 + ((p.y - PY) / (PRY + 14)) ** 2 <= 1;
function curPos(it, now) {
  if (it.st === 'drag') return { x: S.drag.x, y: S.drag.y, s: 1.18 };
  if (it.st === 'fly') { const u = clamp01((now - it.t0) / 0.4), e = ease(u); return { x: lerpN(it.sx, it.px, e), y: lerpN(it.sy, it.py, e) - 26 * Math.sin(Math.PI * u), s: 1 + 0.15 * Math.sin(Math.PI * u) }; }
  if (it.st === 'bounce') { const u = clamp01((now - it.t0) / 0.8), e = ease(u); return { x: lerpN(it.px, it.hx, e), y: lerpN(it.py, it.hy, e) - 80 * Math.sin(Math.PI * u), s: 1 + 0.1 * Math.sin(Math.PI * u), r: u * 6.28 }; }
  if (it.st === 'placed') return { x: it.px, y: it.py, s: 0.92 };
  return { x: it.hx, y: it.hy, s: 1 };
}
function sendToPlate(it, fx, fy) {
  const used = new Set(placedItems().map((o) => o.slot)); let s = 0; while (used.has(s)) s++;
  it.slot = it.am ? -1 : s; const [dx, dy] = it.am ? [0, 4] : SLOTS[s % SLOTS.length];
  it.px = PX + dx; it.py = PY + dy; it.sx = fx; it.sy = fy; it.st = 'fly'; it.t0 = nowS();
}
cv.addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'plate' || !S.askedP) return;
  const p = pt(ev), now = nowS();
  const it = [...items].reverse().find((o) => (o.st === 'home' || o.st === 'placed') && Math.hypot(curPos(o, now).x - p.x, curPos(o, now).y - p.y) < 30);
  if (!it) return;
  cv.setPointerCapture(ev.pointerId);
  S.drag = { it, was: it.st, x: p.x, y: p.y, x0: p.x, y0: p.y, moved: false }; it.st = 'drag'; sfx.tick();
});
cv.addEventListener('pointermove', (ev) => {
  if (!S.drag) return; const p = pt(ev); S.drag.x = p.x; S.drag.y = p.y;
  if (Math.hypot(p.x - S.drag.x0, p.y - S.drag.y0) > 8) S.drag.moved = true;
});
const endPtr = () => {
  const d = S.drag; if (!d) return; S.drag = null; const it = d.it;
  if (!d.moved) { if (d.was === 'placed') { it.st = 'home'; sfx.click(); } else sendToPlate(it, it.hx, it.hy); }
  else if (overPlate(d)) sendToPlate(it, d.x, d.y); else it.st = 'home';
  render();
};
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
// tapping the tables (feast) and the tools (spoon)
cv.addEventListener('click', (ev) => {
  if (S.sec) return; const p = pt(ev), now = nowS();
  if (lab.view === 'feast' && S.askedF && p.x > 8 && p.x < 332) {
    const who = p.y < 152 ? 'lord' : 'peasant'; if (S.openT[who] < 0) { S.openT[who] = now; sfx.good(); render(); }
  } else if (lab.view === 'spoon' && S.askedS && p.y < 112) {
    const i = Math.round((p.x - 47) / 81); if (i >= 0 && i < 4 && Math.abs(p.x - (47 + 81 * i)) < 38) useTool(i);
  }
});
function useTool(i) { S.tt[i] = nowS(); S.used[i] = true; S.lastTool = i; (i === 3 ? sfx.bad : sfx.click)(); render(); }

// --- drawing ---------------------------------------------------------------------------------------------------------
function drawPlate(c, now) {
  trencher(c, PX, PY, PRX, PRY);
  if (!S.askedP) {
    const b = Math.sin(now * 2) * 3;
    shadow(c, 170, 118, 44, 9, 0.3); emo(c, '🍟', 170, 84 + b, 64); emo(c, '❓', 226, 52 + b, 30);
    return;
  }
  c.save(); rr(c, 8, 14, 324, 130, 16); c.fillStyle = 'rgba(25,12,4,.38)'; c.fill(); c.strokeStyle = 'rgba(255,255,255,.1)'; c.stroke(); c.restore();
  items.forEach((it) => { c.save(); c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(it.hx, it.hy + 2, 28, 22, 0, 0, 7); c.fill(); c.restore(); label(c, T[lang].foods[it.k], it.hx, it.hy + 28); });
  const order = items.slice().sort((a, b) => (a.st === 'home' || a.st === 'placed' ? 0 : 1) - (b.st === 'home' || b.st === 'placed' ? 0 : 1));
  order.forEach((it) => {
    if (it.st === 'fly' && now - it.t0 >= 0.4) { if (it.am) { it.st = 'bounce'; it.t0 = now; S.bounced++; S.msgT = now; sfx.bad(); } else { it.st = 'placed'; sfx.good(); } render(); }
    if (it.st === 'bounce' && now - it.t0 >= 0.8) { it.st = 'home'; render(); }
    const q = curPos(it, now), flying = it.st !== 'home' && it.st !== 'placed';
    if (flying) shadow(c, q.x + 4, q.y + 18, 18, 6, 0.25);
    emo(c, it.e, q.x, q.y, 34 * q.s, q.r || 0);
  });
  if (now - S.msgT < 2.4) pill(c, T[lang].bounce, 170, 282);
}
function drawPanel(c, who, y, now) {
  const t = T[lang], lord = who === 'lord', open = S.openT[who];
  const g = c.createLinearGradient(0, y, 0, y + 140); g.addColorStop(0, lord ? '#6a2438' : '#5d4b33'); g.addColorStop(1, lord ? '#32101e' : '#33281a');
  rr(c, 8, y, 324, 140, 18); c.fillStyle = g; c.fill(); c.lineWidth = 2; c.strokeStyle = lord ? '#e8b94a' : '#8a7656'; c.stroke();
  emo(c, lord ? '👑' : '🧑‍🌾', 34, y + 24, 28);
  pill(c, t.who[who], 100, y + 24);
  const tg = c.createLinearGradient(0, y + 52, 0, y + 128); tg.addColorStop(0, lord ? '#f7edd4' : '#b48350'); tg.addColorStop(1, lord ? '#cdbb92' : '#6e4a28');
  rr(c, 22, y + 52, 296, 76, 10); c.fillStyle = tg; c.fill(); c.lineWidth = 1.5; c.strokeStyle = lord ? '#b08a3a' : '#3d2812'; c.stroke();
  if (lord) {
    c.fillStyle = 'rgba(160,40,60,.5)'; c.fillRect(22, y + 119, 296, 5);
    [[290, y + 30], [316, y + 30]].forEach(([fx, fy], i) => {
      const fl = 1 + Math.sin(now * 9 + i * 2) * 0.12; c.fillStyle = '#f4ecd8'; c.fillRect(fx - 3, fy, 6, 14);
      const gl = c.createRadialGradient(fx, fy - 4, 1, fx, fy - 4, 16); gl.addColorStop(0, 'rgba(255,210,110,.9)'); gl.addColorStop(1, 'rgba(255,210,110,0)');
      c.fillStyle = gl; c.beginPath(); c.arc(fx, fy - 4, 16 * fl, 0, 7); c.fill();
    });
  }
  const names = lord ? t.lordItems : t.peasItems, es = lord ? ['🍖', '🦢', '🥧', '🧂'] : ['🍞', '🍲', '🧅', '🧀'];
  for (let i = 0; i < 4; i++) {
    const cx = 55 + 77 * i;
    c.beginPath(); c.ellipse(cx, y + 90, 29, 15, 0, 0, 7); c.fillStyle = lord ? '#fffaf0' : '#80562f'; c.fill(); c.lineWidth = 1; c.strokeStyle = lord ? '#c9a24a' : '#3d2812'; c.stroke();
    if (open >= 0) {
      const u = clamp01((now - open - i * 0.18) / 0.45); if (u <= 0) continue; const k = easeOutBack(u);
      emo(c, es[i], cx, y + 84, 32 * Math.max(0.01, k), 0, Math.min(1, u * 2));
      if (u > 0.6) label(c, names[i], cx, y + 113, lord ? '#3a2a14' : '#f6ecd6', lord ? null : 'rgba(30,16,6,.8)');
    }
  }
  if (S.askedF && open < 0) pill(c, '👆 ' + t.tap, 170, y + 90);
}
function drawSpoon(c, now) {
  const t = T[lang], cxs = [47, 128, 209, 290], fe = ['🍲', '🍞', '🧀', '🥧'];
  rr(c, 8, 10, 324, 106, 16); c.fillStyle = 'rgba(25,12,4,.38)'; c.fill(); c.strokeStyle = 'rgba(255,255,255,.1)'; c.stroke();
  cxs.forEach((cx, i) => {
    const used = S.used[i];
    rr(c, cx - 34, 16, 68, 94, 14); c.fillStyle = 'rgba(246,236,214,.1)'; c.fill(); c.lineWidth = 2; c.strokeStyle = used ? (i === 3 ? '#ff6b5e' : '#3ddc97') : 'rgba(246,236,214,.3)'; c.stroke();
    if (!S.askedS) { emo(c, '❓', cx, 60, 30); }
    else { tool(c, i, cx, 52, 1.15, 0, S.tt[i] >= 0 ? 0.22 : 1); label(c, t.tools[i], cx, 98); }
    shadow(c, cx, 214, 34, 9, 0.35);
    const pg = c.createRadialGradient(cx - 8, 200, 3, cx, 208, 36); pg.addColorStop(0, '#f0e0bb'); pg.addColorStop(1, '#a98150');
    c.beginPath(); c.ellipse(cx, 206, 33, 14, 0, 0, 7); c.fillStyle = pg; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(50,28,8,.6)'; c.stroke();
    const u = S.tt[i] >= 0 ? now - S.tt[i] : -1, pulse = u > 0.5 && u < 1.2 && i !== 3 ? 1 + 0.08 * Math.sin((u - 0.5) * 14) : 1;
    emo(c, fe[i], cx, 192, 38 * pulse);
    label(c, t.toolFood[i], cx, 232);
  });
  cxs.forEach((cx, i) => {
    if (S.tt[i] < 0) return; const u = now - S.tt[i]; let y, r = 0;
    if (i === 3) { const e = u < 0.5 ? ease(u / 0.5) : u < 1.1 ? 1 : 1 - ease(clamp01((u - 1.1) / 0.5)); y = lerpN(52, 130, e); r = u > 0.5 && u < 1.1 ? Math.sin(u * 30) * 0.25 : 0; }
    else { y = lerpN(52, 158, ease(clamp01(u / 0.5))) + (u > 0.5 && u < 1.5 ? Math.sin(u * 12) * 3 : 0); }
    shadow(c, cx + 6, y + 30, 9, 3, 0.2); tool(c, i, cx, y, 1.15, r);
  });
  if (S.lastTool >= 0) pill(c, t.toolMsg[S.lastTool], 170, 264, 316);
}
function drawSecret(c, now) {
  const t = T[lang];
  if (S.sec === 'tr') {
    const st = S.tr, u = ease(clamp01((now - S.trT) / 0.7)), k = st === 2 ? lerpN(1, 0.55, u) : 1;
    emo(c, '🐕', 270, 90, 52); emo(c, '🧓', 70, 90, 52);
    trencher(c, st === 2 ? lerpN(170, 250, u) : 170, st === 2 ? lerpN(190, 150, u) : 190, 100 * k, 44 * k, st >= 1 ? 1 : 0);
    if (st === 0) {
      const g = c.createRadialGradient(165, 182, 3, 170, 188, 70); g.addColorStop(0, '#c9843a'); g.addColorStop(1, '#7a4a1c');
      c.beginPath(); c.ellipse(170, 188, 64, 26, 0, 0, 7); c.fillStyle = g; c.fill();
      emo(c, '🥕', 140, 184, 20); emo(c, '🧅', 176, 190, 20); emo(c, '🥬', 204, 184, 20); emo(c, '♨️', 170, 140 + Math.sin(now * 3) * 3, 26, 0, 0.8);
    }
    pill(c, t.trMsg[st], 170, 272, 316);
  } else {
    const n = S.pp, u = clamp01((now - S.ppT) / 0.35);
    shadow(c, 170, 232, 80, 14, 0.4);
    const g = c.createRadialGradient(150, 160, 5, 170, 190, 90); g.addColorStop(0, '#c9a06a'); g.addColorStop(1, '#6d4a26');
    c.beginPath(); c.moveTo(110, 230); c.quadraticCurveTo(100, 150, 140, 130); c.lineTo(200, 130); c.quadraticCurveTo(240, 150, 230, 230); c.closePath(); c.fillStyle = g; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#3d2812'; c.stroke();
    c.fillStyle = '#4a3016'; rr(c, 134, 122, 72, 14, 7); c.fill();
    for (let i = 0; i < n; i++) {
      const a = i * 2.4, rad = 6 + (i % 4) * 9, px = 170 + Math.cos(a) * rad * 2.2, py = 188 + Math.sin(a) * rad * 0.9;
      c.beginPath(); c.arc(px, py, i === n - 1 ? 5 + 4 * (1 - u) : 5, 0, 7); c.fillStyle = '#1d1a18'; c.fill(); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(px - 2, py - 2, 2, 2);
    }
    if (n >= 8) emo(c, '🏠', 276, 90 + Math.sin(now * 3) * 3, 44);
    emo(c, '🧂', 64, 90, 40);
    pill(c, n >= 8 ? t.ppDone : t.ppMsg(n), 170, 272, 316);
  }
}
const bgFor = (v) => (S.sec ? ['#5a3a20', '#2f1d0e'] : v === 'plate' ? ['#7a4f2a', '#432913'] : v === 'feast' ? ['#2b1a22', '#15090f'] : ['#6b4a28', '#3a2410']);
canvasLoop(cv, (c, w, h) => {
  const now = nowS(), v = lab.view, [c1, c2] = bgFor(v), f = fitBox(w, h);
  wood(c, w, h, c1, c2);
  c.save(); c.translate(f.ox, f.oy); c.scale(f.sc, f.sc);
  if (S.sec) drawSecret(c, now);
  else if (v === 'plate') drawPlate(c, now);
  else if (v === 'feast') { drawPanel(c, 'lord', 8, now); drawPanel(c, 'peasant', 152, now); }
  else drawSpoon(c, now);
  c.restore();
});

// --- controls --------------------------------------------------------------------------------------------------------------
function askHTML(kind, q, opts, ok, ans, okT, noT) {
  const done = ans !== null;
  return `<p class="mf-q">${esc(q)}</p><div class="mf-opts">${opts.map((o, i) => `<button type="button" class="mf-opt${done ? (i === ok ? ' good' : i === ans ? ' bad' : ' dim') : ''}" data-act="ask" data-k="${kind}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`
    + (done ? `<p class="mf-verdict ${ans === ok ? 'ok' : 'no'}">${esc(ans === ok ? okT : noT)}</p>` : '');
}
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function answer(kind, i) {
  if (kind === 'P') {
    if (S.askedP) return; S.askedP = true; S.ansP = i; (i === 1 ? sfx.good : sfx.bad)();
    const po = items.find((o) => o.k === 'potato'); setTimeout(() => { if (po.st === 'home') sendToPlate(po, po.hx, po.hy); }, 500);
  } else if (kind === 'F') { if (S.askedF) return; S.askedF = true; S.ansF = i; (i === 1 ? sfx.good : sfx.bad)(); S.openT.lord = nowS() + 0.4; }
  else { if (S.askedS) return; S.askedS = true; S.ansS = i; (i === 1 ? sfx.good : sfx.bad)(); }
  showStage(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return; const act = b.dataset.act, now = nowS();
  if (act === 'ask') return answer(b.dataset.k, +b.dataset.i);
  if (act === 'clear') { items.forEach((o) => { if (o.st === 'placed' || o.st === 'fly') o.st = 'home'; }); sfx.click(); }
  else if (act === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click(); }
  else if (act === 'secgo') {
    if (S.sec === 'tr') { S.tr = (S.tr + 1) % 3; S.trT = now; sfx.click(); } else { S.pp = (S.pp + 1) % 13; S.ppT = now; sfx.tick(); }
  }
  render();
});

function render() {
  const t = T[lang], v = lab.view, sec = S.sec, show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  show('mfP', !sec && v === 'plate'); show('mfF', !sec && v === 'feast'); show('mfS', !sec && v === 'spoon'); show('mfSec', !!sec);
  $('mfAskP').innerHTML = askHTML('P', t.askP, t.optsP, 1, S.ansP, t.rightP, t.wrongP);
  $('mfAskF').innerHTML = askHTML('F', t.askF, t.optsF, 1, S.ansF, t.rightF, t.wrongF);
  $('mfAskS').innerHTML = askHTML('S', t.askS, t.optsS, 1, S.ansS, t.rightS, t.wrongS);
  $('mfClr').style.display = S.askedP ? 'flex' : 'none'; $('mfClr').firstElementChild.textContent = t.clear;
  cv.style.touchAction = !sec && v === 'plate' && S.askedP ? 'none' : 'pan-y';
  const open = secret.unlocked();
  $('mfSecs').innerHTML = [['tr', '🍞'], ['pp', '🧂']].map(([k, e]) => `<button type="button" class="chip mf-c secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const ask = (q) => { lab.setReadout('?', '', '', '#7a8bd1'); lab.setState({ emo: '🤔', title: q, lead: '', body: '', extra: '' }); lab.setFacts([]); };
  if (sec === 'tr') {
    $('mfSecGo').textContent = t.trAct[S.tr]; lab.setGlow('rgba(200,140,60,.28)'); lab.setReadout(`${S.tr + 1} / 3`, '', '🍞', '#e8a330');
    lab.setState({ emo: '🍞', title: t.secrets.tr[0], lead: t.trLead, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (sec === 'pp') {
    $('mfSecGo').textContent = t.ppAct; lab.setGlow('rgba(200,140,60,.28)'); lab.setReadout(String(S.pp), '', '🧂', '#e8a330');
    lab.setState({ emo: '🧂', title: t.secrets.pp[0], lead: t.ppLead, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (v === 'plate') {
    lab.setGlow('rgba(200,140,60,.26)');
    if (!S.askedP) return ask(t.askP);
    const n = placedItems().length, st = t.st.plate;
    lab.setReadout(String(n), t.onPlate, S.bounced ? t.bounced(S.bounced) : '', S.bounced ? '#ff8a5e' : '#3ddc97');
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' }); lab.setFacts(t.facts.plate);
  } else if (v === 'feast') {
    lab.setGlow('rgba(200,70,90,.24)');
    if (!S.askedF) return ask(t.askF);
    const n = (S.openT.lord >= 0) + (S.openT.peasant >= 0), st = t.st.feast;
    lab.setReadout(`${n} / 2`, t.tables, '', n === 2 ? '#3ddc97' : '#e8b94a');
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' }); lab.setFacts(t.facts.feast);
  } else {
    lab.setGlow('rgba(160,160,190,.22)');
    if (!S.askedS) return ask(t.askS);
    const n = S.used.filter(Boolean).length, st = t.st.spoon;
    lab.setReadout(`${n} / 4`, t.toolsUsed, '', n === 4 ? '#3ddc97' : '#e8b94a');
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' }); lab.setFacts(t.facts.spoon);
  }
}
render();
