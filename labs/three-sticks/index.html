// --- view 3: angle -----------------------------------------------------------------------------------------
const third = (deg) => Math.sqrt(61 - 60 * Math.cos(deg * Math.PI / 180));
function drawAngle(c, w, h) {
  const an = S.ang, ch = { x: 14, y: h - 128, w: w - 28, h: 116 }, hs = ch.y - 10;
  const u = Math.min((w - 44) / 11.2, (hs - 34) / 5.2), ox = (w - 10.92 * u) / 2 + 4.92 * u, oy = hs - 16;
  board(c, w, h, u, ox, oy);
  if (an.ph === 'anim') { const p = clamp((now() - an.t0) / 1.8, 0, 1); an.a = lerp(an.from, 130, ease(p)); if (p >= 1) endAngle(); }

  pin(c, ox, oy); pin(c, Ta.x, Ta.y, 3.5); pin(c, Tb.x, Tb.y, 3.5);
  const t = T[lang], tl = third(a);
  angMark(c, O, Ta, Tb, 26, Math.round(a));
  pill(c, `6 ${t.cm}`, ox + 3 * u, oy + 20); pill(c, `5 ${t.cm}`, ox + 2.5 * u * Math.cos(rad) - 14 * Math.sin(rad), oy - 2.5 * u * Math.sin(rad) - 14 * Math.cos(rad));
  const mx = (Ta.x + Tb.x) / 2, my = (Ta.y + Tb.y) / 2, dx = Ta.x - Tb.x, dy = Ta.y - Tb.y, dl = Math.hypot(dx, dy) || 1;
  pill(c, `${tl.toFixed(1)} ${t.cm}`, mx + dy / dl * 22, my - dx / dl * 22, '#eba92d');
  // the graph: angle (x) against the third side (y)
  c.save(); c.fillStyle = 'rgba(16,19,30,.92)'; rr(c, ch.x, ch.y, ch.w, ch.h, 14); c.fill(); c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1; c.stroke(); c.restore();
  const px0 = ch.x + 34, px1 = ch.x + ch.w - 14, py0 = ch.y + 28, py1 = ch.y + ch.h - 24;

  c.save(); c.font = '700 12px Nunito, sans-serif'; c.fillStyle = '#c6cde0'; c.textBaseline = 'middle';
  c.textAlign = 'left'; c.fillText(t.chart, ch.x + 12, ch.y + 13);
  c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = 1; c.beginPath();
  [0, 6, 12].forEach((v) => { c.moveTo(px0, gy(v) + .5); c.lineTo(px1, gy(v) + .5); }); [0, 90, 180].forEach((d) => { c.moveTo(gx(d) + .5, py0); c.lineTo(gx(d) + .5, py1); }); c.stroke();
  c.textAlign = 'right'; [0, 6, 12].forEach((v) => c.fillText(String(v), px0 - 6, gy(v)));
  c.textAlign = 'center'; [0, 90, 180].forEach((d) => c.fillText(`${d}°`, clamp(gx(d), ch.x + 18, ch.x + ch.w - 18), py1 + 13));

  c.fillStyle = '#fff'; c.beginPath(); c.arc(gx(a), gy(tl), 5.5, 0, 6.3); c.fill(); c.strokeStyle = '#e2573f'; c.lineWidth = 2; c.stroke();

function endAngle() { const an = S.ang; an.a = 130; an.ph = 'play'; an.ok = an.guess === 0; (an.ok ? sfx.good : sfx.bad)(); render(); }

// --- secret b: the rope with 12 knots ----------------------------------------------------------------------
function drawRope(c, w, h) {
  const u = Math.min((w - 80) / 4.2, (h - 70) / 4.3, 62), ox = (w - 4 * u) / 2, oy = h / 2 + 1.5 * u + 8;
  board(c, w, h, u, ox, oy);
  const p = clamp((now() - S.t0) / 1.6, 0, 1), e = ease(p), rho = 12 * u / (2 * Math.PI), cx = ox + 4 / 3 * u, cy = oy - u;
  const pts = [];

    pts.push({ x: lerp(cx + Math.cos(an) * rho, ox + tx * u, e), y: lerp(cy + Math.sin(an) * rho, oy + ty * u, e) });
  }
  const path = () => { c.beginPath(); pts.forEach((q, i) => (i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y))); c.closePath(); };
  c.save(); c.lineJoin = 'round'; c.shadowColor = 'rgba(70,45,10,.4)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
  c.strokeStyle = '#5b3d1c'; c.lineWidth = 10; path(); c.stroke(); c.restore();
  c.save(); c.lineJoin = 'round'; c.strokeStyle = '#c79a5c'; c.lineWidth = 7; path(); c.stroke();
  c.strokeStyle = 'rgba(255,240,205,.5)'; c.lineWidth = 6; c.setLineDash([3, 5]); path(); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 1.5; c.setLineDash([]); c.translate(-1, -2); path(); c.stroke(); c.restore();
  pts.forEach((q, i) => {
    const r = [0, 4, 9].includes(i) ? 8.5 : 7.5;
    c.save(); c.shadowColor = 'rgba(40,25,5,.45)'; c.shadowBlur = 5; c.shadowOffsetY = 2;
    c.fillStyle = rg(c, q.x - 2.5, q.y - 3, 1, q.x, q.y, r + 1, [[0, '#f2d4a0'], [.55, '#b58245'], [1, '#6e4a22']]); c.beginPath(); c.arc(q.x, q.y, r, 0, 6.3); c.fill(); c.restore();

}

// --- scene -------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  G = { w, h };
  if (S.sec === 'b') drawRope(c, w, h);
  else if (lab.view === 'close') drawClose(c, w, h, dt);
  else if (lab.view === 'compass') drawComp(c, w, h, time, dt);
  else drawAngle(c, w, h);
});

// --- input -------------------------------------------------------------------------------------------------
const cv = $('cv');
const ptr = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
cv.addEventListener('pointerdown', (ev) => {
  const k = S.k; if (lab.view !== 'compass' || S.sec || k.ph !== 'play' || !GC) return;
  const p = ptr(ev), X = GC.ox + k.P.x * GC.u, Y = GC.by - k.P.y * GC.u;
  if (Math.hypot(p.x - X, p.y - Y) < 46) { k.drag = { dx: X - p.x, dy: Y - p.y }; try { cv.setPointerCapture(ev.pointerId); } catch { /* fine */ } }
});
cv.addEventListener('pointermove', (ev) => {
  const k = S.k, d = k.drag; if (!d || !GC) return;
  const p = ptr(ev), px = clamp(p.x + d.dx, 16, G.w - 16), py = clamp(p.y + d.dy, 16, G.h - 16);
  let P = { x: (px - GC.ox) / GC.u, y: (GC.by - py) / GC.u }; k.moved = true; k.snap = null;
  for (const [sn, sy] of [['up', 1], ['down', -1]]) if (Math.hypot(px - (GC.ox + GC.x * GC.u), py - (GC.by - sy * GC.y * GC.u)) < 18) { P = { x: GC.x, y: sy * GC.y }; k.snap = sn; break; }

});
const endDrag = () => { S.k.drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function resetClose() { const c = S.c; c.ph = 'pre'; c.guess = null; c.kind = null; c.ok = null; c.noRec = false; S.secA = false; }
function resetComp() { const k = S.k; k.ph = 'pre'; k.guess = null; k.ok = null; k.P = null; k.snap = null; k.drag = null; k.moved = false; }
function dealSticks() {
  const cur = S.len.join();
  for (let n = 0; n < 80; n++) {
    const l = [0, 0, 0].map(() => 1 + Math.floor(Math.random() * 12)), kd = kindOf(l);
    if (kd !== 'flat' && (kd === 'tri') === (Math.random() >= .5) && l.join() !== cur) { S.len = l; return; }
  }

}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = lab.view, i = +b.dataset.i;
  if (act === 'step') {
    const d = +b.dataset.d;
    if (v === 'close') { S.len[i] = clamp(S.len[i] + d, 1, 12); resetClose(); } else { S.m[i] = clamp(S.m[i] + d, 2, 12); resetComp(); }
    sfx.tick(); render(); return;
  }
  if (act === 'deal') { dealSticks(); resetClose(); S.ruleOpen = false; sfx.snap(); render(); return; }
  if (act === 'rule') { if (S.ruleOpen) S.ruleOpen = false; else { S.c.found = true; S.ruleOpen = true; } sfx.click(); render(); return; }
  if (act === 'ans') {
    sfx.click();
    if (v === 'close' && S.c.ph === 'pre') { const c = S.c; c.guess = i; c.kind = kindOf(S.len); c.ph = 'anim'; c.t0 = now(); c.noRec = false; S.ruleOpen = false; }

$('tsSlider').addEventListener('input', (ev) => {

function changeView() { S.sec = null; S.ruleOpen = false; S.k.drag = null; render(); }

// --- html side ---------------------------------------------------------------------------------------------
function tableHTML(t) {
  const rows = S.c.rec.slice(-8); if (!rows.length) return '';
  return `<table class="ts-table"><thead><tr>${t.head.map((x) => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => {
    const s = [...r.len].sort((x, y) => y - x), mid = S.c.found ? `${s[1]} + ${s[2]} = ${s[1] + s[2]} vs ${s[0]}` : '?';
    return `<tr><td>${r.len.join(' · ')}</td><td class="${S.c.found ? '' : 'q'}">${esc(mid)}</td><td class="${r.ok ? 'ok' : 'no'}">${esc(t.cells[r.kind])}</td></tr>`;
  }).join('')}</tbody></table>`;
}
const stepHTML = (i, name, val, col, minV, maxV) => `<div class="ts-st"><span class="ts-n">${esc(name)}</span><span class="ts-v"><i class="ts-d" style="background:${col}"></i>${val} ${esc(T[lang].cm)}</span>
  <span class="ts-bt"><button type="button" data-act="step" data-i="${i}" data-d="-1" aria-label="−" ${val <= minV ? 'disabled' : ''}>−</button><button type="button" data-act="step" data-i="${i}" data-d="1" aria-label="+" ${val >= maxV ? 'disabled' : ''}>+</button></span></div>`;

  const k = S.k, t = T[lang], [b, r1, r2] = S.m;

    const dA = k.snap ? r1 : +Math.hypot(k.P.x, k.P.y).toFixed(1), dB = k.snap ? r2 : +Math.hypot(k.P.x - b, k.P.y).toFixed(1);
    lab.setReadout(`${b} · ${dA} · ${dB}`, t.cm, t.right && k.ok ? t.right : t.wrong, k.ok ? '#2fbf84' : '#e59a1f');
  } else lab.setReadout(`${b} · ${r1} · ${r2}`, t.cm, '', '#4ea8ff');
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, c = S.c, k = S.k, an = S.ang;
  document.body.dataset.v = v;
  $('tsMain').hidden = sec === 'b';
  const [mb, m1, m2] = S.m, valid = isTri(mb, m1, m2);
  const cur = v === 'close' ? c : v === 'compass' ? k : an, busy = cur.ph !== 'pre';
  // question, steppers, answers

  $('tsSteps').style.display = v === 'angle' ? 'none' : '';
  $('tsSteps').innerHTML = v === 'close' ? S.len.map((x, i) => stepHTML(i, t.steps.close[i], x, DOT[i], 1, 12)).join('')
    : v === 'compass' ? S.m.map((x, i) => stepHTML(i, t.steps.comp[i], x, DOT[i], 2, 12)).join('') : '';

  const shown = v === 'close' ? c.ph === 'done' : v === 'compass' ? k.ph === 'play' : an.ph === 'play';
  const rightIdx = v === 'close' ? (c.kind === 'tri' ? 0 : 1) : 0;
  $('tsAns').innerHTML = (v === 'compass' && !valid) || (v === 'close' && S.secA) ? '' : opts.map((o, i) => {
    const cls = shown && !(v === 'close' && c.noRec) ? (i === rightIdx ? 'good' : i === cur.guess ? 'bad' : '') : busy && i === cur.guess ? 'on' : '';
    return `<button type="button" class="ts-ans ${cls}" data-act="ans" data-i="${i}" ${busy ? 'disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  $('tsTools').innerHTML = v === 'close' ? `<button type="button" class="ts-chip ts-new" data-act="deal">🎲 ${esc(t.newSticks)}</button>${c.rec.length >= 5 || c.found
    ? `<button type="button" class="ts-chip ${S.ruleOpen ? 'on' : ''}" data-act="rule">${esc(t.showRule)}</button>` : ''}` : '';
  $('tsSlWrap').hidden = v !== 'angle'; $('tsSlider').value = an.a; $('tsSlider').disabled = an.ph !== 'play'; $('tsSlider').setAttribute('aria-label', t.views.angle);
  const open = secret.unlocked();
  $('tsSec').innerHTML = [['a', '📏'], ['b', '🪢']].map(([kk, emo]) =>
    `<button type="button" class="ts-chip secret ${open ? 'open' : ''} ${(kk === 'a' ? S.secA : sec === 'b') ? 'on' : ''}" data-act="sec" data-k="${kk}">${open ? `${emo} ${esc(t.secrets[kk][0])}` : '🔒 ???'}</button>`).join('');
  $('tsTable').innerHTML = v === 'close' && !sec ? tableHTML(t) : '';
  // rule card
  const showRule = S.ruleOpen && v === 'close' && !sec; ruleEl.style.display = showRule ? '' : 'none';
  if (showRule) ruleEl.innerHTML = `<button class="ts-x" type="button" aria-label="×">×</button><h3>${esc(t.ruleTitle)}</h3><p>${esc(t.ruleText)}</p>
    <div class="ts-bars"><span class="ts-bar" style="width:34px;background:${DOT[1]}"></span>+<span class="ts-bar" style="width:46px;background:${DOT[2]}"></span>&gt;<span class="ts-bar" style="width:76px;background:${DOT[0]}"></span></div><div class="ts-cap">${esc(t.ruleBars)}</div>`;

    if (S.secA) lab.setState({ emo: '📏', title: t.secrets.a[0], lead: t.secrets.a[1], body: c.ph === 'done' ? t.out.flat : '' });
    else lab.setState({ emo: '📏', title: t.views.close, lead: c.ph === 'done' ? t.out[c.kind] : t.st.close[0], body: t.st.close[1] });
  } else if (v === 'compass') {
    readoutComp();
    lab.setState({ emo: '📐', title: t.views.compass, lead: valid ? (k.ph === 'play' ? t.st.compPlay : t.st.comp(mb, m1, m2)) : t.st.compBad(mb, m1, m2), body: k.ph === 'play' ? t.st.compBody : valid ? t.st.compPre : '' });
  } else {
    lab.setReadout(`${third(an.a).toFixed(1)} ${t.cm}`, t.at(Math.round(an.a)), verdict, col);
    const st = an.ph === 'play' ? t.st.angPlay : t.st.ang;
    lab.setState({ emo: '🔧', title: t.views.angle, lead: st[0], body: st[1] });

}
render();
