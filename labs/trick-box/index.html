  if (f && f.on && !S.pend) {
    const lines = [`<b>${esc(t.tr[f.on][0])}.</b> ${esc(t.tr[f.on][1])}`, esc(p.fbE(f.E)), esc(p.fbR)];
    if (f.g1 !== undefined) lines.push(`${esc(p.you(f.g1, f.g1 === true))} · ${esc(p.you(f.g2, f.g2 === false))}`);
    fb = `<p class="tb-fb">${lines.join('<br>')}</p>`;
  } else if (f && f.off && !S.pend) fb = `<p class="tb-fb">${esc(p.off)}</p>`;
  else if (f && f.rs && !S.pend) fb = `<p class="tb-fb">${esc(p.rsFb(4))}</p>`;
  el.innerHTML = `<div class="tb-q" style="margin-bottom:6px">${esc(p.teamQ)}</div>${teamSeg('team', team, t)}
    <div class="tb-sub" style="margin-top:12px">${esc(p.tricks)}</div><div class="tb-opts">${chips}</div>${pend}${fb}
    <div class="tb-sub">${esc(p.rsH)}</div><div class="tb-opts">${t.reasons[team].map((q, i) => btn(`rs ${S.rs[team].has(i) ? 'on' : ''}`, 'rs', i, q)).join('')}</div>
    <div style="margin-top:14px">${meters(t, ex, rg)}</div>${posterCard(t, team)}`;
  if (!S.on.size && !S.rs[team].size && !S.pend && !f) lab.setState({ emo: '🏘️', title: p.intro[0], lead: p.intro[1], body: p.introBody, extra: '' });
  else if (S.pend) lab.setState({ emo: '🤔', title: p.pq(t.tr[S.pend][0]), lead: p.q1, body: p.q2, extra: '' });
  else if (f && f.on) lab.setState({ emo: EMO[f.on], title: t.tr[f.on][0], lead: t.tr[f.on][1], body: `${p.fbE(f.E)} ${p.fbR}`, extra: `<div class="tb-note">${esc(p.mirror)}</div>` });
  else if (f && f.rs) lab.setState({ emo: '📋', title: t.tr.honest[0], lead: t.tr.honest[1], body: p.rsFb(4), extra: '' });
  else lab.setState({ emo: '📣', title: t.posterH, lead: `${t.teamEmo[team]} ${t.head[team]}`, body: '', extra: `<div class="tb-note">${esc(p.mirror)}</div>` });
}

function renderSpot(t) {
  const el = $('c2'); el.style.display = ''; lab.setFacts(t.facts.s);
  const sp = S.sp, x = t.s, done = sp.i >= 12, k = sp.res.filter((q) => q.ok).length;
  lab.setReadout(`${k}`, x.spotted, `${Math.min(sp.i + 1, 12)}/12`, '#8f7fd0');
  if (done) {
    el.innerHTML = `<div class="tb-row" style="margin-top:0"><button class="btn" data-act="again2">${esc(t.again)}</button></div>`;
    lab.setState({ emo: '🕵️', title: x.endT(k), lead: x.endL, body: x.endB, extra: '' }); return;
  }
  const id = MSG_ORDER[sp.i], m = x.msgs[id], got = sp.pick !== null;
  const chips = TAGS.map((tag, i) => {
    const cls = got ? (tag === m[1] ? 'good' : tag === sp.pick ? 'bad' : '') : '';
    return btn(cls, 'tag', i, `${EMO[tag]} ${t.tr[tag][0]}`, got ? ' disabled' : '');
  }).join('');
  let fb = '';
  if (got) {
    const ok = sp.pick === m[1];
    fb = `<div class="tb-paper"><p>${hl(m[2])}</p></div><p class="tb-fb"><span class="${ok ? 'ok' : 'no'}">${esc(ok ? t.right : x.you(t.tr[sp.pick][0]))}</span><br><b>${esc(x.itwas(t.tr[m[1]][0]))}</b> ${esc(t.tr[m[1]][1])}</p>
      <div class="tb-row"><button class="btn" data-act="nextm">${esc(t.next)}</button></div>`;
  }
  el.innerHTML = `<div class="tb-sub" style="margin-top:0">${esc(x.n(sp.i + 1))} · ${esc(x.from[m[0]])}</div><div class="tb-q">${esc(plain(m[2]))}</div><div class="tb-opts">${chips}</div>${fb}`;
  lab.setState(got ? { emo: sp.pick === m[1] ? '✅' : '🤔', title: sp.pick === m[1] ? t.right : x.itwas(t.tr[m[1]][0]), lead: t.tr[m[1]][1], body: '', extra: '' }
    : { emo: '📱', title: x.q, lead: plain(m[2]), body: x.from[m[0]], extra: '' });
}

function renderHonest(t) {
  const el = $('c3'); el.style.display = ''; lab.setFacts(t.facts.h);
  const x = t.h, tm = S.mk[S.hteam], both = S.mk[0].done && S.mk[1].done, team = S.hteam;
  lab.setReadout(`${S.mk.filter((q) => q.done).length}/2`, x.doneMark, '', '#6fb36f');
  const seg = `<div class="tb-opts">${[0, 1].map((k) => btn(`${k ? 'lib' : 'pool'} ${team === k ? 'on' : ''}`, 'hteam', k, `${t.teamEmo[k]} ${t.team[k]}${S.mk[k].done ? ' ✓' : ''}`)).join('')}</div>`;
  const slots = x.slotsOf[team].map((opts, sl) => `<div class="tb-slot"><div class="lbl">${sl + 1}. ${esc(x.slots[sl])}</div><div class="tb-opts">${opts.map((o, k) => btn(`opt ${tm.s[sl] === k ? 'on' : ''}`, 'slot', sl, o, '').replace('data-i="' + sl + '"', `data-k="${sl}:${k}"`)).join('')}</div></div>`).join('');
  const full = tm.s.every((q) => q !== null), badIdx = tm.s.findIndex((q, i) => q === x.decoys[i]);
  let res = '';
  if (full) res = `<div class="tb-paper ${badIdx < 0 ? 'gr' : ''}"><p class="why">${esc(x.before)}</p><p><s>${hl(t.tl.fear[team])}</s></p><p class="why">${esc(x.after)}</p><p>${esc(sentence(team))}</p></div>
    <p class="tb-fb">${badIdx < 0 ? `<span class="ok">${esc(x.okLine)}</span>` : `<span class="no">${esc(x.trickAgain(badIdx + 1, t.tr[x.decoyTrick[badIdx]][0]))}</span>`}</p>`;
  else res = `<p class="tb-fb">${esc(x.pick)}</p>`;
  let end = '';
  if (both) {
    end = `<div class="tb-sub">${esc(x.vote)}</div><div class="tb-opts">${x.votes.map((q, i) => btn(S.vote === i ? 'on' : '', 'vote', i, q)).join('')}</div>`
      + (S.vote !== null ? `<p class="tb-fb">${esc(x.yours(x.votes[S.vote]))}</p>` : '') + `<div class="tb-row"><button class="tb-b" data-act="again3" data-i="0">${esc(t.again)}</button></div>`;
  }
  el.innerHTML = `${seg}${slots}${res}${end}`;
  if (both) lab.setState({ emo: '🗳️', title: x.endT, lead: x.endL, body: '', extra: '' });
  else if (full && badIdx >= 0) lab.setState({ emo: '🤔', title: x.trickAgain(badIdx + 1, t.tr[x.decoyTrick[badIdx]][0]), lead: x.pick, body: '', extra: '' });
  else if (full) lab.setState({ emo: '✅', title: t.right, lead: x.okLine, body: '', extra: '' });
  else lab.setState({ emo: '📋', title: x.t0[0], lead: x.t0[1], body: '', extra: '' });
}

function renderSecret(t, v) {
  const el = $('c1'); el.style.display = ''; lab.setFacts([]);
  if (S.sec === 'stack') {
    const x = t.st;
    lab.setReadout('0 + 0', t.p.rg, '', '#d9825f');
    el.innerHTML = `<div class="tb-row" style="margin-top:0"><button class="btn" data-act="swap">${esc(x.swap)}</button></div>
      <div class="tb-two">${[0, 1].map((tm) => `<div class="tb-paper"><h4>${t.teamEmo[tm]} ${esc(t.head[tm])}</h4>${TR.map((k) => `<p>${hl(t.tl[k][tm])}</p>`).join('')}</div>`).join('')}</div>
      <p class="tb-fb">${esc(x.rg)}</p>`;
    lab.setState({ emo: '🎭', title: t.secrets.stack[0], lead: x.lead, body: x.body, extra: '' }); return;
  }
  const x = t.rp, ex = excite();
  lab.setReadout(`${ex} %`, t.p.ex, `📋 0 %`, '#f1b73c');
  el.innerHTML = `<div class="tb-q" style="margin-bottom:6px">${esc(t.p.teamQ)}</div>${teamSeg('team', S.team, t)}
    <div class="tb-row"><button class="btn" data-act="rep"${S.rep >= 5 ? ' disabled style="opacity:.4"' : ''}>${esc(x.btn)}</button><button class="tb-b" data-act="rep0" data-i="0">${esc(x.reset)}</button></div>
    <div style="margin-top:14px">${meters(t, ex, 0)}</div><p class="tb-fb">${esc(x.n(S.rep))}</p>`;
  lab.setState({ emo: '🔁', title: t.secrets.rep[0], lead: S.rep >= 5 ? x.end : x.lead, body: '', extra: '' });
}
render();
</script>
</body>
