function dotAt(k, t, ec) {

    if (n === undefined) { n = 0; while (n < o.arr.exits.length && o.arr.exits[n] <= t) n++; ec.set(o.arr, n); }

// --- the canvas loop ------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const v = lab.view;
  SC = Math.min(w / DW, h / DH); OX = (w - DW * SC) / 2; OY = (h - DH * SC) / 2;
  VIS = { x0: -OX / SC, y0: -OY / SC, x1: (w - OX) / SC, y1: (h - OY) / SC };
  c.save(); c.translate(OX, OY); c.scale(SC, SC);
  if (v === 'seats') {
    S.sailT += (S.sailTarget - S.sailT) * Math.min(1, dt * 2.2);
    S.pomT += ((S.sec === 'pom' ? 1 : 0) - S.pomT) * Math.min(1, dt * 4);
    const a = 1 - ease(S.pomT), p = ease(S.pomT);
    drawSky(c); drawGround(c);
    if (a > 0.01) { c.save(); c.globalAlpha = a; drawSection(c, time, dt); c.restore(); }
    if (p > 0.01) { c.save(); c.globalAlpha = p; drawPom(c, time); c.restore(); }
    if (a > 0.4) { c.save(); c.globalAlpha = a; drawTokens(c, dt); c.restore(); }
  } else if (v === 'doors') drawDoors(c, time, dt);
  else drawArms(c, time, dt);
  c.restore();
});

const showStage = () => {

};
const allPlaced = () => PERS.every((p) => S.place[p] !== undefined);
function placeTier(i) {
  if (S.revealed || !S.sel) return;
  S.sec = null; S.sailTarget = 1;
  S.place[S.sel] = i; sfx.click();
  S.sel = PERS.find((p) => S.place[p] === undefined) ?? null;
}
function resetSeats() { S.place = {}; S.tok = {}; S.revealed = false; S.sel = PERS[0]; S.sec = null; S.sailTarget = 1; sfx.click(); }

  if (!S.guess || S.running) return;
  S.mode = g; S.run = RUNS[g]; S.simT = 0; S.running = true; S.phase = 'run'; S.ticket = null; S.rdAt = -1; sfx.click(); showStage();
}
const nextFighter = () => { const n = [0, 1, 2].find((f) => S.kit[f] < 0); S.fsel = n ?? S.fsel; };

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'pers') { S.sec = null; S.sailTarget = 1; S.sel = S.sel === b.dataset.p ? null : b.dataset.p; sfx.tick(); }
  else if (a === 'tier') placeTier(+b.dataset.i);
  else if (a === 'seatgo') {
    if (S.revealed) resetSeats();
    else if (allPlaced()) { S.revealed = true; S.sel = null; S.sec = null; S.sailTarget = 1; sfx.good(); showStage(); }
  } else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (b.dataset.k === 'sail') { if (S.sec !== 'sail') { S.sec = 'sail'; S.sailTarget = 0.28; } else S.sailTarget = S.sailTarget > 0.5 ? 0.28 : 1; }
    else { S.sec = S.sec === 'pom' ? null : 'pom'; S.sailTarget = 1; }
    sfx.click();
  } else if (a === 'guess') { S.guess = b.dataset.k; sfx.click(); }
  else if (a === 'run') startRun(+b.dataset.g);
  else if (a === 'dagain') { S.guess = null; S.mode = null; S.phase = 'idle'; S.done = {}; S.ticket = null; S.running = false; S.run = null; sfx.click(); }
  else if (a === 'tk') { S.ticket = +b.dataset.n; S.phase = 'idle'; S.mode = 80; sfx.tick(); showStage(); }
  else if (a === 'fsel') { S.fsel = +b.dataset.f; sfx.tick(); }
  else if (a === 'kit') {
    if (S.checked) return;
    const k = +b.dataset.k;
    for (let g = 0; g < 3; g++) if (S.kit[g] === k) { S.kit[g] = -1; S.kitT[g] = 1; }
    S.kit[S.fsel] = k; S.kitT[S.fsel] = 0; sfx.click(); nextFighter();
  } else if (a === 'armgo') {
    if (S.checked) { S.kit = [-1, -1, -1]; S.checked = false; S.fsel = 0; S.kitT = [1, 1, 1]; sfx.click(); }
    else if (S.kit.every((x) => x >= 0)) {

      for (let f = 0; f < 3; f++) if (S.kit[f] !== f) S.kitT[f] = 0;

});
