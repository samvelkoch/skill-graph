// --- small helpers -----------------------------------------------------------------------------------------
const TAU = Math.PI * 2;
const cl01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => { t = cl01(t); return t * t * (3 - 2 * t); };
const hexRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const hx2 = (n) => Math.round(n).toString(16).padStart(2, '0');
const mix = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return '#' + A.map((v, i) => hx2(clamp(v + (B[i] - v) * t, 0, 255))).join(''); };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); };
const lg = (c, x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rg = (c, x0, y0, r0, x1, y1, r1, stops) => { const g = c.createRadialGradient(x0, y0, Math.max(0, r0), x1, y1, Math.max(0.01, r1)); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const fr = (x) => x - Math.floor(x);
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
// canvas text on a dark pill, clamped inside the canvas
function tag(c, text, x, y, w, align = 'center', size = 12.5) {
  c.save(); c.font = `800 ${size}px Nunito, sans-serif`; c.textBaseline = 'middle'; c.textAlign = 'left'; c.globalAlpha = 1;
  const tw = c.measureText(text).width + 16, th = size + 10;
  let px = align === 'center' ? x - tw / 2 : align === 'left' ? x : x - tw;
  px = clamp(px, 4, Math.max(4, w - tw - 4));
  rr(c, px, y - th / 2, tw, th, th / 2); c.fillStyle = 'rgba(10, 12, 20, .82)'; c.fill();
  c.fillStyle = '#EDEFF7'; c.fillText(text, px + 8, y + 0.5); c.restore();
}
function wrapText(c, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const wd of words) {
    const tst = line ? `${line} ${wd}` : wd;
    if (c.measureText(tst).width > maxW && line) { lines.push(line); line = wd; } else line = tst;
  }
  if (line) lines.push(line);
  return lines;
}

// --- particles: glucose, oxygen, carbon dioxide, water, spark -----------------------------------------------
function drawPart(c, k, x, y, rot, s) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.lineJoin = 'round';
  if (k === 'glu') {
    c.beginPath();
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + Math.PI / 6; c.lineTo(Math.cos(a) * 6.4, Math.sin(a) * 6.4); }
    c.closePath(); c.fillStyle = rg(c, -2, -2.5, 0.5, 0, 0, 7.5, [[0, '#fff0b8'], [0.55, '#f6bd4a'], [1, '#d9861f']]); c.fill();
    c.lineWidth = 1.2; c.strokeStyle = '#8a560f'; c.stroke();
  } else if (k === 'o2') {
    c.strokeStyle = '#2f78b8'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(-4, 0); c.lineTo(4, 0); c.stroke();
    for (const sx of [-4.2, 4.2]) {
      c.beginPath(); c.arc(sx, 0, 4.2, 0, TAU); c.fillStyle = rg(c, sx - 1.3, -1.5, 0.4, sx, 0, 4.6, [[0, '#ffffff'], [0.45, '#a6dcff'], [1, '#3b95e0']]); c.fill();
      c.lineWidth = 0.9; c.strokeStyle = '#1f5f9e'; c.stroke();
    }
  } else if (k === 'co2') {
    c.strokeStyle = '#3d4863'; c.lineWidth = 1.8; c.beginPath(); c.moveTo(-6.6, 0); c.lineTo(6.6, 0); c.stroke();
    for (const [sx, r, col] of [[-6.6, 3.3, '#b4c0da'], [6.6, 3.3, '#b4c0da'], [0, 3.9, '#66749a']]) {
      c.beginPath(); c.arc(sx, 0, r, 0, TAU); c.fillStyle = rg(c, sx - 1, -1.2, 0.3, sx, 0, r + 0.6, [[0, '#ffffff'], [0.4, col], [1, mix(col, '#1f2740', 0.5)]]); c.fill();
      c.lineWidth = 0.8; c.strokeStyle = '#39435e'; c.stroke();
    }
  } else if (k === 'h2o') {
    c.rotate(-rot);
    c.beginPath(); c.moveTo(0, -7.5); c.bezierCurveTo(3, -3.5, 6, 0, 6, 3.4); c.arc(0, 3.4, 6, 0, Math.PI, false); c.bezierCurveTo(-6, 0, -3, -3.5, 0, -7.5);
    c.fillStyle = lg(c, -4, -6, 5, 9, [[0, '#d9f5ff'], [1, '#2f9fe0']]); c.fill(); c.lineWidth = 1; c.strokeStyle = '#1b6aa3'; c.stroke();
    c.beginPath(); c.ellipse(-2, 2.4, 1.3, 2.2, 0.4, 0, TAU); c.fillStyle = 'rgba(255,255,255,.85)'; c.fill();
  } else if (k === 'spark') {
    c.fillStyle = rg(c, 0, 0, 0, 0, 0, 13, [[0, 'rgba(255,236,110,.95)'], [1, 'rgba(255,200,40,0)']]); c.beginPath(); c.arc(0, 0, 13, 0, TAU); c.fill();
    c.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8, r = i % 2 ? 2.6 : 7.4; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    c.closePath(); c.fillStyle = '#fff6b8'; c.fill(); c.lineWidth = 1; c.strokeStyle = '#f0a800'; c.stroke();
  }
  c.restore();
}
const bez = (q, u) => {
  const mx = (q.x0 + q.x1) / 2 + q.bx, my = (q.y0 + q.y1) / 2 + q.by, a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, d = u * u;
  return [a * q.x0 + b * mx + d * q.x1, a * q.y0 + b * my + d * q.y1];
};
const mk = (k, x0, y0, x1, y1, d, delay = 0, m = 0, bend = 18) =>
  ({ k, x0, y0, x1, y1, d, t: delay, m, bx: (Math.random() - 0.5) * 2 * bend, by: (Math.random() - 0.5) * 2 * bend, r: Math.random() * TAU });
function drawFlow(c, list, s, fade = 0.18) {
  for (const q of list) {
    if (q.t < 0) continue;
    const u = ease(q.t / q.d), [x, y] = bez(q, u);
    c.globalAlpha = cl01(q.t / 0.15) * cl01((q.d - q.t) / fade);
    drawPart(c, q.k, x, y, q.r + q.t * 2.2, s);
  }
  c.globalAlpha = 1;
}

// --- the cell (logical size 320 x 300): a muscle cell, three mitochondria, a blood vessel on the left --------
const LW = 320, LH = 300;
const MITO = [{ x: 150, y: 77, r: -0.06 }, { x: 242, y: 139, r: 0.08 }, { x: 166, y: 201, r: 0.04 }];
const FIB = [46, 108, 170, 232];
class CellSim {
  constructor() {
    this.p = []; this.acc = 0; this.t = 0; this.lit = 0; this.pulse = [0, 0, 0]; this.con = 0; this.sparks = 0; this.deco = [];
    for (let i = 0; i < 7; i++) this.deco.push({ k: 'rbc', x: 18 + ((i * 37) % 26), y: (i * 43) % LH, v: 32 + ((i * 7) % 9), r: i });
    for (let i = 0; i < 4; i++) this.deco.push({ k: 'glu', x: 20 + ((i * 53) % 22), y: 30 + i * 70, v: 40, r: i });
    for (let i = 0; i < 4; i++) this.deco.push({ k: 'o2', x: 24 + ((i * 29) % 20), y: 62 + i * 70, v: 40, r: i * 1.3 });
  }
  spawn() {
    const m = Math.floor(Math.random() * 3), M = MITO[m], vy = 40 + Math.random() * 220;
    this.p.push(mk('glu', 58, vy, M.x - 18, M.y, 1.8, 0, m));
    this.p.push(mk('o2', 58, clamp(vy + (Math.random() - 0.5) * 70, 30, 270), M.x + 14, M.y, 1.7, -0.3, m));
  }
  step(dt, rate, on) {
    this.t += dt;
    this.lit += clamp((on ? 1 : 0) - this.lit, -dt * 1.4, dt * 1.4);
    this.con = Math.max(0, this.con - dt * 2.2);
    for (let i = 0; i < 3; i++) this.pulse[i] = Math.max(0, this.pulse[i] - dt * 2.6);
    for (const d of this.deco) { d.y += d.v * dt; if (d.y > LH + 16) d.y = -16; d.r += dt * 0.8; }
    if (on && rate > 0) { this.acc += rate * dt; while (this.acc >= 1) { this.acc -= 1; if (this.p.length < 90) this.spawn(); } } else this.acc = 0;
    const add = [];
    for (const q of this.p) {
      const was = q.t; q.t += dt;
      if (was < q.d && q.t >= q.d) {
        if (q.k === 'glu' || q.k === 'o2') {
          this.pulse[q.m] = 1;
          if (q.k === 'o2') {
            const M = MITO[q.m], f = Math.floor(Math.random() * 4);
            add.push(mk('spark', M.x, M.y, 112 + Math.random() * 170, FIB[f], 0.9, -0.1, q.m, 10));
            add.push(mk('co2', M.x, M.y, 58, 40 + Math.random() * 220, 2.0, -0.15, q.m));
            add.push(mk('h2o', M.x, M.y, 58, 40 + Math.random() * 220, 2.1, -0.4, q.m));
          }
        } else if (q.k === 'spark') { this.con = 1; this.sparks++; }
      }
    }
    this.p = this.p.filter((q) => q.t < q.d).concat(add);
  }
  draw(c, X, Y, s) {
    c.save(); c.translate(X, Y); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
    // blood vessel with its flow
    c.save(); rr(c, 2, -30, 58, LH + 60, 28); c.clip();
    c.fillStyle = lg(c, 2, 0, 60, 0, [[0, '#5a1624'], [0.5, '#8a2236'], [1, '#5a1624']]); c.fillRect(0, -30, 64, LH + 60);
    for (const d of this.deco) {

  // lactic acid bar in the muscle, and the lungs that keep panting
  const ly = cy + ch + 34, lac = DEBT.lac[idx], bx = 16, bw = w - 32;
  rr(c, bx, ly, bw, 22, 11); c.fillStyle = 'rgba(14,17,28,.85)'; c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(130,145,190,.4)'; c.stroke();
  if (lac > 0.01) { rr(c, bx + 2, ly + 2, Math.max(18, (bw - 4) * lac), 18, 9); c.fillStyle = lg(c, bx, 0, bx + bw, 0, [[0, '#ffe36b'], [1, '#f0a800']]); c.fill(); }
  tag(c, `${t.lactic}`, bx + 10, ly - 14, w, 'left', 12);
  const br = 12 + 33 * cl01((DEBT.sup[idx] - 205) / 2045), lungY = ly + 62, lungS = Math.min(30, (h - ly - 40) / 2);
  SD.bp += TAU * (br / 60) * dt;
  if (lungS > 12) drawLungs(c, w / 2, Math.min(h - lungS - 18, lungY), lungS, 0.5 - 0.5 * Math.cos(SD.bp));
}
function drawSeedsView(c, w, h, dt, time) {
  const t = T[lang];
  if (SD.run) { SD.p = Math.min(1, SD.p + dt / 6); if (SD.p >= 1) SD.run = false; }
  const p = ease(SD.p), day = Math.min(3, Math.round(SD.p * 3 + 0.3));
  [['sprouts', 0], ['boiled', 1]].forEach(([kind, col]) => {
    const cw = w / 2, X = col * cw, fw = Math.min(cw * 0.46, 100), fh = Math.min(h * 0.6, fw * 2.3), fx = X + cw * 0.1, fy = Math.max(40, (h - 70 - fh) / 2 + 20);
    // thermos
    c.save(); c.lineJoin = 'round';
    c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(fx + fw / 2, fy + fh + 3, fw * 0.55, 5, 0, 0, TAU); c.fill();
    rr(c, fx, fy, fw, fh, 16); c.fillStyle = lg(c, fx, 0, fx + fw, 0, [[0, '#e6ebf6'], [0.35, '#aeb7cc'], [1, '#6d7690']]); c.fill(); c.lineWidth = 2; c.strokeStyle = '#2f364d'; c.stroke();
    rr(c, fx + fw * 0.14, fy + fh * 0.3, fw * 0.72, fh * 0.6, 10); c.fillStyle = '#1a2036'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#2f364d'; c.stroke();
    c.save(); rr(c, fx + fw * 0.14, fy + fh * 0.3, fw * 0.72, fh * 0.6, 10); c.clip();
    const by = fy + fh * 0.9 - 6; c.fillStyle = '#d6c08f'; c.fillRect(fx, by - 6, fw, 12);
    [0.3, 0.5, 0.7].forEach((fx2, j) => {
      const x = fx + fw * fx2;
      if (kind === 'sprouts') {
        const gl = (6 + 16 * p) * (0.8 + 0.2 * j);
        c.strokeStyle = '#7fd070'; c.lineWidth = 2.2; c.lineCap = 'round'; c.beginPath(); c.moveTo(x, by - 8); c.quadraticCurveTo(x + 4, by - 8 - gl / 2, x + 1, by - 8 - gl); c.stroke();
        c.strokeStyle = '#f2ecd2'; c.beginPath(); c.moveTo(x, by - 3); c.lineTo(x - 2, by + 2 + 4 * p); c.stroke();
        pea(c, x, by - 5, 5.2, '#79c45a');
      } else pea(c, x, by - 5, 5.2, '#a7b88a');
    });
    c.restore();
    rr(c, fx - 3, fy - 10, fw + 6, 14, 5); c.fillStyle = lg(c, 0, fy - 10, 0, fy + 4, [[0, '#e8554a'], [1, '#a8281f']]); c.fill(); c.lineWidth = 1.6; c.strokeStyle = '#4a120d'; c.stroke();
    if (kind === 'sprouts' && p > 0.1) { // warmth rising
      c.strokeStyle = `rgba(255,170,100,${0.55 * p})`; c.lineWidth = 2.4;
      for (const dx of [0.25, 0.5, 0.75]) { c.beginPath(); for (let k = 0; k <= 8; k++) { const y = fy - 16 - k * 5, x = fx + fw * dx + Math.sin(k * 0.9 + time * 3 + dx * 7) * 4; if (k) c.lineTo(x, y); else c.moveTo(x, y); } c.stroke(); }
    }
    // thermometer
    const tx = fx + fw + cw * 0.12, ty = fy + 4, th = fh * 0.86, tw = 14, room = 0.28, level = room + (kind === 'sprouts' ? 0.27 * p : 0);
    rr(c, tx, ty, tw, th, 7); c.fillStyle = 'rgba(220,232,255,.14)'; c.fill(); c.lineWidth = 1.6; c.strokeStyle = 'rgba(210,225,255,.7)'; c.stroke();
    const lh = th * level; rr(c, tx + 3, ty + th - lh - 8, tw - 6, lh + 4, 3); c.fillStyle = lg(c, 0, ty, 0, ty + th, [[0, '#ff6a5c'], [1, '#d6281c']]); c.fill();
    c.beginPath(); c.arc(tx + tw / 2, ty + th + 3, 9, 0, TAU); c.fillStyle = '#e0382a'; c.fill(); c.lineWidth = 1.6; c.strokeStyle = 'rgba(210,225,255,.7)'; c.stroke();
    c.strokeStyle = 'rgba(210,225,255,.45)'; c.lineWidth = 1.2; c.beginPath(); for (let k = 1; k < 10; k++) { const y = ty + th - th * 0.09 * k - 8; c.moveTo(tx + tw + 3, y); c.lineTo(tx + tw + (k % 5 ? 7 : 11), y); } c.stroke();
    c.setLineDash([4, 4]); c.strokeStyle = 'rgba(190,205,255,.55)'; c.beginPath(); const ry = ty + th - th * room - 8; c.moveTo(tx - 6, ry); c.lineTo(tx + tw + 14, ry); c.stroke(); c.setLineDash([]);
    c.restore();
    tag(c, t.jars[kind], X + cw / 2, h - 52, w, 'center', 12);
  });
  tag(c, t.room, w / 2, h - 22, w, 'center', 12);
  tag(c, t.day(day), w / 2, 20, w, 'center', 13);
}

// --- the loop ---------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  // the body eases toward the chosen level (about 3 s), it never jumps
  const tgt = LV[S.lv], k = 1 - Math.exp(-dt / 0.9);
  for (const key of ['o2', 'br', 'hr', 'spd']) cur[key] += (tgt[key] - cur[key]) * k;
  AN.bedW += clamp((S.lv === 'sleep' ? 1 : 0) - AN.bedW, -dt / 0.7, dt / 0.7);
  AN.ph += TAU * (cur.spd > 0.05 ? 0.7 + 0.5 * cur.spd : 0) * dt;
  AN.scroll += cur.spd * 95 * dt;
  AN.bp += TAU * (cur.br / 60) * dt; AN.hp += TAU * (cur.hr / 60) * dt;
  const v = lab.view;
  if (S.sec === 'debt') drawDebtView(c, w, h, dt, time);
  else if (S.sec === 'seeds') drawSeedsView(c, w, h, dt, time);
  else if (v === 'cell') drawCellView(c, w, h, dt);
  else if (v === 'runner') drawRunnerView(c, w, h, dt, time);
  else drawWhoView(c, w, h, dt, time);
  readout(false);
});

// --- readout -----------------------------------------------------------------------------------------------
let lastKey = '';
function readout(force) {
  const t = T[lang], v = lab.view; let a, b, p, col;
  if (S.sec === 'debt') { a = Math.round(DEBT.sup[Math.min(DEBT.sup.length - 1, Math.floor(SD.t / DEBT.dt))]); b = t.o2; p = DEBT.lac[Math.min(DEBT.lac.length - 1, Math.floor(SD.t / DEBT.dt))] > 0.05 ? `🟡 ${t.lactic}` : ''; col = '#ffb347'; }
  else if (S.sec === 'seeds') { a = '🌡️'; b = t.day(Math.min(3, Math.round(SD.p * 3 + 0.3))); p = ''; col = '#ff8a5c'; }
  else if (v === 'cell') { a = t.blanks(S.chk.filter((x) => x === 'ok').length); b = t.equation; p = simA.sparks > 0 ? t.sparks(simA.sparks) : ''; col = '#e0566c'; }
  else if (v === 'runner') { a = Math.round(cur.o2); b = t.o2; p = t.levels[S.lv]; col = '#ff9a3c'; }
  else { a = S.waited ? t.score(JARS.filter((j, i) => S.guess[i] === j.resp).length) : '?'; b = S.waited ? t.rightGuesses : ''; p = t.key; col = '#e0c040'; }
  const key = [a, b, p, col].join('|');
  if (!force && key === lastKey) return;
  lastKey = key; lab.setReadout(a, b, p, col);
}

// --- controls ---------------------------------------------------------------------------------------------
const secChip = (t, k, emo) => { const open = secret.unlocked(); return `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`; };
function place(tok) {
  const i = S.slots.indexOf(null);
  if (i < 0 || S.done) return;
  S.slots[i] = tok; S.chk = [null, null, null, null]; S.run = false; S.note = null; sfx.tick(); render();
}
function unplace(i) {
  if (S.done || !S.slots[i]) return;
  S.slots[i] = null; S.chk = [null, null, null, null]; S.run = false; S.note = null; sfx.tick(); render();
}
function runCell() {
  if (S.slots.includes(null) || S.done) return;
  const left = S.slots.slice(0, 2), right = S.slots.slice(2);
  const leftOk = IN_OK.every((x) => left.includes(x)), rightOk = OUT_OK.every((x) => right.includes(x));
  S.chk = S.slots.map((x, i) => (i < 2 ? (IN_OK.includes(x) ? 'ok' : 'bad') : leftOk ? (OUT_OK.includes(x) ? 'ok' : 'bad') : null));
  S.run = leftOk;
  if (!leftOk) { S.note = { ok: false, key: 'missingIn' }; sfx.bad(); }
  else if (!rightOk) { S.note = { ok: false, key: 'outWrong' }; sfx.bad(); showStage(); }
  else { S.done = true; S.note = { ok: true, key: 'exCell' }; sfx.good(); showStage(); }
  render();
}
function setLevel(k) { S.lv = k; sfx.click(); }
function pickLevel(k) {
  if (S.ask || k === S.lv) return;
  if (k === 'sit') { setLevel(k); }
  else if (k === 'sleep') { if (S.sleepQ) setLevel(k); else S.ask = { kind: 'sleep', to: 'sleep', pick: null }; }
  else if (!S.predR) { if (k === 'jog') S.ask = { kind: 'jog', to: 'jog', pick: null }; else return; }
  else setLevel(k);
  render();
}
function resetWho() { S.guess = Array(6).fill(null); S.waited = false; S.waiting = false; S.wp = 0; sfx.click(); }
function startSecret(k) {
  S.sec = k;
  if (k === 'debt') { SD.t = 0; SD.on = true; } else { SD.p = 0; SD.run = true; }
  sfx.click();
}
$('overlay').addEventListener('click', (ev) => {
  const sl = ev.target.closest('[data-slot]'), lv = ev.target.closest('[data-lv]'), an = ev.target.closest('[data-a]'), go = ev.target.closest('[data-go]'), yn = ev.target.closest('[data-j]');
  if (sl) unplace(+sl.dataset.slot);
  else if (lv && !lv.disabled) pickLevel(lv.dataset.lv);
  else if (an && S.ask && S.ask.pick === null) {
    S.ask.pick = +an.dataset.a; (S.ask.pick === 1 ? sfx.good : sfx.bad)(); render();
  } else if (go && S.ask) {
    const a = S.ask, ok = a.pick === 1;
    if (a.kind === 'jog') { S.predR = true; S.revealed = true; S.rnote = { ok, key: 'exRun' }; S.lastEx = 'exRun'; }
    else { S.sleepQ = true; S.rnote = { ok, key: 'exSleep' }; S.lastEx = 'exSleep'; }
    S.ask = null; setLevel(a.to); render(); showStage();
  } else if (yn && !S.waited && !S.waiting) { S.guess[+yn.dataset.j] = yn.dataset.g === '1'; sfx.tick(); render(); }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  if (b.id === 'cRun') runCell();
  else if (b.id === 'cFlame') { S.flame = !S.flame; sfx.click(); render(); }
  else if (b.dataset.tok) place(b.dataset.tok);
  else if (b.dataset.act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    if (S.sec === b.dataset.k) { S.sec = null; sfx.click(); } else startSecret(b.dataset.k);
    render();
  } else if (b.id === 'secGo') { startSecret(S.sec); render(); }
  else if (b.id === 'wGo') {
    if (S.waited) resetWho(); else if (!S.waiting && S.guess.every((g) => g !== null)) { S.waiting = true; S.wp = 0; sfx.click(); }
    render();
  }
});

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v; document.body.dataset.s = sec || '';
  $('cellCtl').hidden = sec || v !== 'cell'; $('runCtl').hidden = sec || v !== 'runner'; $('whoCtl').hidden = sec || v !== 'who';
  $('secCtl').hidden = !sec;
  eqEl.hidden = sec || v !== 'cell'; lvEl.hidden = sec || v !== 'runner' || !!S.ask; askEl.hidden = sec || v !== 'runner' || !S.ask; whEl.hidden = sec || v !== 'who';
  if (sec) {
    $('secGo').textContent = sec === 'debt' ? t.sprint30 : t.threeDays;
    $('rSec').innerHTML = ''; $('wSec').innerHTML = '';
    // keep the chip that leaves the secret reachable
    (v === 'runner' ? $('rSec') : $('wSec')).innerHTML = secChip(t, sec, sec === 'debt' ? '⚡' : '🌡️');
    $('runCtl').hidden = v !== 'runner'; $('whoCtl').hidden = v !== 'who';
    $('rNote').hidden = true; $('wGo').parentElement.hidden = true; $('wHint').hidden = true; $('wWhy').innerHTML = '';
    lab.setGlow(sec === 'debt' ? 'rgba(255, 160, 60, .26)' : 'rgba(255, 120, 80, .26)');
    lab.setState({ emo: sec === 'debt' ? '⚡' : '🌡️', title: t.secrets[sec][0], lead: sec === 'debt' ? t.secretA : t.secretB, body: '', extra: '' });
    lab.setFacts(t.facts[v]); readout(true);
    return;
  }
  $('rNote').hidden = false; $('wGo').parentElement.hidden = false; $('wHint').hidden = false;
  if (v === 'cell') renderCell(t); else if (v === 'runner') renderRunner(t); else renderWho(t);
  readout(true);
}
function renderCell(t) {
  lab.setGlow('rgba(224, 86, 108, .26)');
  const slot = (i) => {
    const tok = S.slots[i], cls = S.chk[i] ? S.chk[i] : tok ? 'full' : '';
    if (!tok) return `<button class="rs-slot" data-slot="${i}" aria-label="?"><span class="q">?</span></button>`;
    const [em, ...rest] = t.tokens[tok].split(' ');
    return `<button class="rs-slot ${cls}" data-slot="${i}"${S.done ? ' disabled' : ''}><span class="em">${em}</span><span>${esc(rest.join(' '))}</span></button>`;
  };
  eqEl.classList.toggle('glow', S.done);
  eqEl.innerHTML = `<div class="grp">${slot(0)}<i>+</i>${slot(1)}<i>→</i></div><div class="grp">${slot(2)}<i>+</i>${slot(3)}<i>+</i><span class="en">⚡ ${esc(t.energy)}</span></div>`;
  $('tray').innerHTML = TOKS.map((k) => `<button class="chip rs-tok" data-tok="${k}"${S.slots.includes(k) || S.done || !S.slots.includes(null) ? ' disabled' : ''}>${esc(t.tokens[k])}</button>`).join('');
  $('cHint').textContent = t.fillIn; $('cHint').hidden = S.done;
  $('tray').hidden = S.done;
  $('cRun').textContent = t.runCell; $('cRun').hidden = S.done; $('cRun').disabled = S.slots.includes(null);
  $('cFlame').hidden = !S.done; $('cFlame').textContent = t.flame; $('cFlame').classList.toggle('on', S.flame);
  $('cNote').className = `rs-note ${S.note ? (S.note.ok ? 'ok' : 'no') : ''}`;
  $('cNote').innerHTML = S.note ? `<b>${esc(S.note.ok ? t.right : t.notQuite)}</b> ${esc(t[S.note.key])}` : '';
  const st = S.done ? t.state.cellDone : t.state.cell0;
  if (S.done && S.flame) lab.setState({ emo: '🔥', title: st[0], lead: t.exFlame, body: st[1], extra: '' });
  else lab.setState({ emo: S.done ? '⚡' : '🔬', title: st[0], lead: st[1], body: '', extra: '' });
  lab.setFacts(t.facts.cell);
}
function renderRunner(t) {
  lab.setGlow('rgba(255, 154, 60, .26)');
  lvEl.innerHTML = LV_KEYS.map((k) => `<button class="chip ${k === S.lv ? 'on' : ''}" data-lv="${k}"${!S.predR && (k === 'walk' || k === 'sprint') ? ' disabled' : ''}>${esc(t.levels[k])}</button>`).join('');
  const a = S.ask;
  if (a) {
    const q = a.kind === 'jog' ? t.predictQ : t.sleepQ, opts = a.kind === 'jog' ? t.predictOpts : t.sleepOpts, ex = a.kind === 'jog' ? t.exRun : t.exSleep;
    askEl.innerHTML = `<div class="q">${esc(q)}</div><div class="opts">${opts.map((o, j) => `<button data-a="${j}"${a.pick !== null ? ' disabled' : ''} class="${a.pick === null ? '' : j === 1 ? 'good' : j === a.pick ? 'bad' : ''}">${esc(o)}</button>`).join('')}</div>` +
      (a.pick === null ? '' : `<div class="verdict" style="color:${a.pick === 1 ? 'var(--ok)' : 'var(--wip)'}">${esc(a.pick === 1 ? t.right : t.notQuite)}</div><p>${esc(ex)}</p><button class="go" data-go="1">${esc(t.go)} →</button>`);
  }
  const n = S.rnote;
  $('rNote').className = `rs-note ${n ? (n.ok ? 'ok' : 'no') : ''}`; $('rNote').innerHTML = n ? `<b>${esc(n.ok ? t.right : t.notQuite)}</b> ${esc(t[n.key])}` : '';
  $('rSec').innerHTML = secChip(t, 'debt', '⚡');
  $('rFine').textContent = t.fine;
  const st = S.revealed ? t.state.runnerDone : t.state.runner0;
  lab.setState({ emo: S.revealed ? '🔥' : '🏃', title: st[0], lead: st[1], body: S.lastEx ? t[S.lastEx] : '', extra: '' });
  lab.setFacts(t.facts.runner);
}
function renderWho(t) {
  lab.setGlow('rgba(224, 192, 64, .22)');
  whEl.innerHTML = JARS.map((j, i) => {
    const g = S.guess[i], cls = (val) => (g === val ? (S.waited ? (g === j.resp ? 'ok' : 'bad') : 'on') : '');
    return `<div class="rs-cell"><div class="nm">${esc(t.jars[j.k])}</div><div class="yn" aria-label="${esc(t.respires)}">
      <button class="rs-yn ${cls(true)}" data-j="${i}" data-g="1"${S.waited || S.waiting ? ' disabled' : ''}>${esc(t.yes)}</button>
      <button class="rs-yn ${cls(false)}" data-j="${i}" data-g="0"${S.waited || S.waiting ? ' disabled' : ''}>${esc(t.no)}</button></div></div>`;
  }).join('');
  $('wHint').textContent = t.respires;
  $('wGo').textContent = S.waited ? t.again : t.wait; $('wGo').disabled = !S.waited && (S.waiting || S.guess.some((g) => g === null));
  $('wSec').innerHTML = secChip(t, 'seeds', '🌡️');
  $('wWhy').innerHTML = S.waited ? JARS.map((j, i) => (S.guess[i] === j.resp ? '' : `<p><b>${esc(t.jars[j.k])}</b> ${esc(t.whyJar[j.k])}</p>`)).join('') : '';
  const st = S.waited ? t.state.whoDone : t.state.who0;
  lab.setState({ emo: S.waited ? '🌱' : '🫙', title: st[0], lead: st[1], body: '', extra: '' });
  lab.setFacts(t.facts.who);
}
render();
</script>
