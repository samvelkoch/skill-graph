const rg = (c, x0, y0, r0, x1, y1, r1, st) => { const g = c.createRadialGradient(x0, y0, Math.max(0, r0), x1, y1, Math.max(0, r1)); st.forEach(([o, col]) => g.addColorStop(clamp(o, 0, 1), col)); return g; };

const easeOut = (u) => 1 - (1 - u) * (1 - u);

    const top = `<div class="mt-top"><button class="mt-ar" data-act="cyc" data-d="-1" aria-label="‹" ${busy}>‹</button><div class="mt-nm"><i style="${dot(id)}"></i><b>${esc(t.sn[id])}</b><span>${n} / 5</span></div><button class="mt-ar" data-act="cyc" data-d="1" aria-label="›" ${busy}>›</button></div>`;
    const mid = lb ? `<div class="mt-vd ${lb.ok === false ? 'sur' : ''}"><span><b>${esc(k === 'b' ? t.btwV : lb.ok ? t.right : t.sur)}</b></span><button class="mt-b" data-act="nxt" ${busy}>${esc(t.nextS)} ›</button></div>`
      : `<div class="mt-qq">${esc(n < 3 ? t.need : t.q)}</div><div class="mt-two"><button class="mt-b" data-act="lab" data-g="m" ${n < 3 || S.run ? 'disabled' : ''}>${esc(t.w.m)}</button><button class="mt-b" data-act="lab" data-g="n" ${n < 3 || S.run ? 'disabled' : ''}>${esc(t.w.n)}</button></div>`;
    const st = EMO.map((e, i) => { const d = dn(id)[i], mk = d ? MARK[SM[id].res[i]] : null; return `<button class="mt-sb" data-act="test" data-k="${i}" ${busy}><span class="e">${e}</span><span class="l">${esc(t.tn[i])}</span>${mk ? `<span class="r ${mk[1]}">${mk[0]}</span>` : ''}</button>`; }).join('');
    return `${top}<div class="mt-bot">${mid}<div class="mt-st">${st}</div></div>`;
  }
  if (v === 'table') {
    const tr = S.tr, sym = ROUNDS[tr.i], k = clsOf(sym);
    const top = `<div class="mt-top"><div class="mt-nm"><b>${esc(t.el[sym])}</b><span>${tr.i + 1} / ${ROUNDS.length}</span></div></div>`;
    const mid = tr.rev ? `<div class="mt-vd ${tr.res[tr.i] ? '' : 'sur'}"><span><b>${esc(tr.res[tr.i] ? t.right : t.miss)}</b> ${esc(k === 'm' ? t.isM : t.isN)}</span><button class="mt-b" data-act="trn">${esc(tr.i >= ROUNDS.length - 1 ? t.again : t.nextE)} ›</button></div>`
      : `<div class="mt-qq">${esc(t.q)}</div><div class="mt-two"><button class="mt-b" data-act="tr" data-g="m">${esc(t.w.m)}</button><button class="mt-b" data-act="tr" data-g="n">${esc(t.w.n)}</button></div>`;
    return `${top}<div class="mt-bot">${mid}</div>`;
  }
  const rx = S.rx, pick = rx.phase === 'pick';
  const top = `<div class="mt-top"><div class="mt-nm" style="padding:6px 14px"><b style="white-space:normal;text-align:center;font-size:13px;line-height:1.3">${esc(t.qR)}</b></div></div>`;
  const chips = TUBES.map((sym) => { const i = rx.rank.indexOf(sym); return `<button class="mt-rk ${i >= 0 ? 'on' : ''}" data-act="rk" data-s="${sym}" ${pick ? '' : 'disabled'}>${i >= 0 ? `<span class="n">${i + 1}</span>` : ''}<b>${sym}</b><span>${esc(t.mn[sym])}</span></button>`; });
  const act = pick ? `<button class="mt-b" data-act="rdrop" ${rx.rank.length < 4 ? 'disabled' : ''}>${esc(t.drop)}</button>` : rx.rev ? `<div class="mt-vd ${rx.ok ? '' : 'sur'}"><span><b>${esc(rx.ok ? t.right : t.miss)}</b>${rx.ok ? '' : ' ' + esc(t.wrongR)}</span><button class="mt-b" data-act="ragain">${esc(t.again)} ›</button></div>` : '';
  return `${top}<div class="mt-bot"><div class="mt-rkrow">${chips.join('')}</div>${act}</div>`;
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, id = S.sel, lb = S.labels[id];
  document.body.dataset.v = v;
  layer.innerHTML = overlayHTML(t, v);
  const open = secret.unlocked(), qline = sec ? '' : v === 'tests' ? t.hintT : v === 'table' ? t.q : t.howto;
  const showRule = S.ruleOpen && v === 'tests' && !sec;
  let h = `<div class="mt-q">${esc(qline)}</div>`;
  if (v === 'tests' && !sec) {
    h += `<div class="mt-chips">${ORDER.map((o) => `<button class="mt-ch ${o === id ? 'on' : ''}" data-s="${o}"><i style="${dot(o)}"></i>${esc(t.sn[o])}${S.labels[o] ? ' ✓' : ''}</button>`).join('')}</div>${tabHTML(t)}`;
    if (S.ruleSeen || Object.keys(S.labels).length >= 5) h += `<div class="mt-row"><button class="mt-ch ${S.ruleOpen ? 'on' : ''}" data-act="rule">${esc(t.showRule)}</button></div>`;
  }
  h += `<div class="mt-row">${[['a', '💧'], ['b', '🪙']].map(([k, e]) => `<button class="mt-ch sec ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('')}</div>`;
  $('mtCtrl').innerHTML = h;
  ruleEl.style.display = showRule ? '' : 'none';
  if (showRule) ruleEl.innerHTML = `<button class="mt-x2" type="button" aria-label="×">×</button><h3>${esc(t.ruleTitle)}</h3><p>${esc(t.rule)}</p>`;
  // readout, state card, facts
  if (sec) {
    lab.setReadout(sec === 'a' ? '💧' : '🪙', '', '', '#4ea8ff');
    lab.setState({ emo: sec === 'a' ? '💧' : '🪙', title: t.secrets[sec][0], lead: t.secrets[sec][1], body: sec === 'a' ? t.noteA : '' });
  } else if (v === 'tests') {
    const pill2 = lb ? (lb.ok === null ? t.stamp.b.split(' (')[0] : lb.ok ? t.right : t.surP) : '', col = lb ? (lb.ok === false ? '#e59a1f' : lb.ok ? '#2fbf84' : '#b08cff') : '#4ea8ff';
    lab.setReadout(`${cnt(id)} / 5`, t.testsSub, pill2, col);
    lab.setState({ emo: '🔬', title: t.views.tests, lead: t.state.tests[0], body: t.state.tests[1] + (id === 'iodine' ? ' ' + t.iodine : '') });
  } else if (v === 'table') {
    const tr = S.tr, rd = tr.rev ? (tr.res[tr.i] ? t.right : t.surP) : '';
    lab.setReadout(`${tr.res.length} / ${ROUNDS.length}`, t.elSub, rd, tr.rev && !tr.res[tr.i] ? '#e59a1f' : tr.rev ? '#2fbf84' : '#4ea8ff');
    lab.setState({ emo: '📋', title: t.views.table, lead: t.state.table[0], body: t.state.table[1] });
  } else {
    const rx = S.rx;
    lab.setReadout(rx.rev ? [...TUBES].sort((p, q) => RX[p].rank - RX[q].rank).join(' › ') : `${rx.rank.length} / 4`, rx.rev ? '' : t.placed, rx.rev ? (rx.ok ? t.right : t.surP) : '', rx.rev && !rx.ok ? '#e59a1f' : rx.rev ? '#2fbf84' : '#4ea8ff');
    lab.setState({ emo: '🧪', title: t.views.react, lead: t.state.react[0], body: t.state.react[1] });
  }
  lab.setFacts(t.facts[v]);
}
render();
</script>
