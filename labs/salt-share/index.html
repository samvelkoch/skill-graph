  const spot = c.createRadialGradient(w / 2, oy + 110 * SC, 10, w / 2, oy + 110 * SC, 230 * SC); spot.addColorStop(0, 'rgba(130,175,255,.14)'); spot.addColorStop(1, 'rgba(130,175,255,0)'); c.fillStyle = spot; c.fillRect(0, 0, w, h);

  c.fillStyle = cg; c.fillRect(0, cy, w, Math.max(0, h - cy)); c.fillStyle = 'rgba(255,225,190,.18)'; c.fillRect(0, cy, w, 1.5);
  c.save(); c.translate(ox, oy); c.scale(SC, SC); c.lineJoin = 'round';
  drawBase(c, M, tot, time);
  // water in the glass
  const innerH = G.yB - 3 - (G.yT + 4), lvl = (G.yB - 3) - clamp(V.water / V.cap, 0, 1) * innerH;
  if (V.water > 0.4) {
    c.save(); glassPath(c, 3); c.closePath(); c.clip();
    const wg = c.createLinearGradient(0, lvl, 0, G.yB); wg.addColorStop(0, 'rgba(120,205,245,.9)'); wg.addColorStop(1, 'rgba(38,112,184,.96)');
    c.fillStyle = wg; c.beginPath(); c.moveTo(110, lvl);
    for (let x = 110; x <= 250; x += 6) c.lineTo(x, lvl + Math.sin(x * 0.11 + time * 2.2) * 1.1);
    c.lineTo(250, G.yB); c.lineTo(110, G.yB); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.5; c.beginPath();
    for (let x = 110; x <= 250; x += 6) { const y = lvl + Math.sin(x * 0.11 + time * 2.2) * 1.1; if (x === 110) c.moveTo(x, y); else c.lineTo(x, y); }
    c.stroke();
    if (V.k > 0.4) { c.fillStyle = `rgba(255,255,255,${0.35 * V.k})`; for (let i = 0; i < 7; i++) { const sp = 22 + i * 3, y = G.yB - 8 - ((time * sp + i * 29) % Math.max(10, G.yB - 12 - lvl)); c.beginPath(); c.arc(150 + i * 10 + Math.sin(time * 3 + i) * 2, y, 1.6 + (i % 3) * 0.5, 0, 6.283); c.fill(); } }

      c.globalAlpha = 0.9 * a; c.fillStyle = 'rgba(255,248,225,.35)'; c.beginPath(); c.arc(x, y, 4.4, 0, 6.283); c.fill();
      c.fillStyle = '#fff6dc'; c.beginPath(); c.arc(x, y, 2.5, 0, 6.283); c.fill();

  } else if (exc > 0.02) { c.save(); glassPath(c, 3); c.closePath(); c.clip(); drawCrystals(c, exc); c.restore(); }
  // glass: body, rim light, tick marks

  c.strokeStyle = 'rgba(225,238,255,.7)'; c.lineWidth = 2; glassPath(c, 0); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(G.xTL + 8, G.yT + 10); c.lineTo(G.xBL + 8, G.yB - 22); c.stroke();
  const step = V.cap <= 150 ? 50 : V.cap <= 300 ? 100 : 250;
  for (let v = step; v < V.cap - 0.1; v += step) {

  for (let i = grains.length - 1; i >= 0; i--) {

    c.fillStyle = '#fff6dc'; c.beginPath(); c.arc(p.x, p.y, 1.8, 0, 6.283); c.fill();

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {

};
const taskDone = () => { const s = S.s1, w = s.salt / (s.salt + s.water || 1) * 100; return s.salt > 0 && Math.abs(w - TASKS1[Math.min(s.task, 2)]) < 0.05; };
const allowed = (b) => {
  const v = lab.view, n = +b.dataset.n, act = b.dataset.act;
  if (act === 'salt') {
    if (v === 'mix') return S.s1.salt + n <= solK(0) * S.s1.water / 100 && S.s1.salt + n <= 40;
    return S.s3.salt + n <= 80;
  }
  if (act === 'water') return v === 'mix' ? S.s1.water + n <= 150 : S.s2.water + n <= 300;
  if (act === 'half') return S.s2.salt >= 2.5;
  if (act === 'temp') return b.dataset.h !== '1' || S.g4 !== null || S.s3.salt > SOL20 + 0.05;
  return true;
};
ctl.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;

  if (act === 'salt' || act === 'water') {
    if (v === 'mix') { S.s1[act] += n; S.s1.note = null; } else if (v === 'dilute') { S.s2[act] += n; S.s2.note = null; } else { S.s3.salt += n; S.s3.note = null; }
    sfx.click();
  } else if (act === 'empty') { if (v === 'mix') { S.s1.salt = 0; S.s1.water = 0; S.s1.note = null; } else { S.s3.salt = 0; S.s3.note = null; } sfx.click(); }
  else if (act === 'next') { S.s1.task = Math.min(3, S.s1.task + 1); S.s1.salt = 0; S.s1.water = 0; sfx.click(); }
  else if (act === 'half') { S.s2.salt /= 2; S.s2.water /= 2; S.s2.note = 'half'; sfx.push(); }
  else if (act === 'again') { S.s2.salt = 10; S.s2.water = 90; S.s2.note = null; sfx.click(); }
  else if (act === 'temp') {
    if (b.dataset.h === '1') { if (S.g4 === null) S.askHeat = true; else S.s3.hot = true; } else S.s3.hot = false;
    S.s3.note = null; sfx.click();
  } else if (act === 'sec') {

  }

askEl.addEventListener('click', (ev) => {

ctl.addEventListener('input', (ev) => {

// --- render: ask or free controls, the readout, the state card, the facts ---------------------------------------
const pct = (w) => fmt(w * 100);

const verdict = (ok, t) => ({ emo: ok ? '✅' : '🤔', title: ok ? t.ok : t.no });

      : { emo: '💎', title: m.satT, lead: m.satL(fmt(d), fmt(e)), body: m.satB, extra });
  } else {
    lab.setState({ emo: s.hot ? '🔥' : '🥄', title: m.unsT, lead: s.hot ? m.hot0L(fmt(d), pct(w)) : m.unsL(fmt(d), pct(w)), body: s.hot ? m.hotB(fmt(SOL20), fmt(SOL100)) : m.unsB, extra });
  }
  lab.setFacts(facts);
}
render();
</script>
