// --- physics: a = g − (½·ρ·Cd·A/m)·v², integrated with RK4 in fixed steps of 1/240 s ----------------------
// masses, front areas and drag coefficients are typical estimates; the sheet is A4 (0.21 × 0.297 m) at 80 g/m²
const RHO = 1.2, GRAV = { earth: 9.81, moon: 1.62 }, DT = 1 / 240, TIE = 0.01, LANE = ['#4ea8ff', '#ff9f43'];
const A4 = 0.21 * 0.297, PAPER = A4 * 0.080;
const disc = (d) => Math.PI * d * d / 4;
const OBJ = {
  bowl:    { emo: '🎳', m: 6,      A: disc(0.216), cd: 0.47 },
  tennis:  { emo: '🎾', m: 0.057,  A: disc(0.067), cd: 0.55 },
  hammer:  { emo: '🔨', m: 1.32,   A: 0.004,       cd: 1.0 },
  feather: { emo: '🪶', m: 0.0002, A: 0.003,       cd: 1.2 },
  sheet:   { emo: '📄', m: PAPER,  A: A4,          cd: 1.17 },
  ball:    { emo: '',   m: PAPER,  A: disc(0.06),  cd: 0.6 },
  chute:   { emo: '🪂', m: 0.05,   A: disc(0.5),   cd: 1.5 },
};
const KEYS = Object.keys(OBJ);
const BALL_SVG = '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M10 2 L14 3.5 L17.5 7 L17 12 L14.5 16.5 L9.5 18 L5 16 L2.5 11.5 L3.5 6 Z" fill="#e6e9f0" stroke="#8a93ad"/><path d="M6 7 L10 10 L14 6 M10 10 L9 15 M10 10 L15 12" stroke="#8a93ad" fill="none" stroke-width=".9"/></svg>';
const icon = (k) => OBJ[k].emo || BALL_SVG;

function simulate(key, H, g, air) {
  const o = OBJ[key], k = air ? 0.5 * RHO * o.cd * o.A / o.m : 0, vt = k ? Math.sqrt(g / k) : Infinity;
  const acc = (v) => g - k * v * v;
  const ys = [0], vs = [0];
  let y = 0, v = 0, tReach = null;
  for (let i = 0; i < 5e6; i++) {
    const a1 = acc(v), a2 = acc(v + DT / 2 * a1), a3 = acc(v + DT / 2 * a2), a4 = acc(v + DT * a3);
    const nv = v + DT / 6 * (a1 + 2 * a2 + 2 * a3 + a4);
    const ny = y + DT / 6 * (v + 2 * (v + DT / 2 * a1) + 2 * (v + DT / 2 * a2) + (v + DT * a3));
    ys.push(ny); vs.push(nv);
    if (tReach === null && nv >= 0.99 * vt) tReach = (i + 1) * DT;
    if (ny >= H) {
      const f = (H - y) / (ny - y);
      return { k, vt, ys, vs, tLand: (i + f) * DT, vLand: v + f * (nv - v), tReach: tReach !== null && tReach <= (i + f) * DT ? tReach : null };
    }
    y = ny; v = nv;
  }
}
// position and speed at time t (linear between steps; parked on the ground after landing)
function at(R, t, H) {
  if (t >= R.tLand) return { y: H, v: R.vLand, landed: true };
  const x = Math.max(0, t) / DT, i = Math.floor(x), f = x - i;
  return { y: Math.min(H, lerp(R.ys[i], R.ys[i + 1], f)), v: lerp(R.vs[i], R.vs[i + 1], f), landed: false };
}

const S = { a: 'bowl', b: 'tennis', air: true, place: 'earth', play: 1, secret: null, phase: 'ready', t: 0, guess: null, landed: [false, false] };

const height = () => (S.secret === 'apollo' ? 1.6 : S.secret === 'bremen' ? 110 : 10);

function runs() {
  const key = [S.a, S.b, height(), S.place, airOn()].join('|');
  if (cache.key !== key) cache = { key, R: [S.a, S.b].map((o) => simulate(o, height(), GRAV[S.place], airOn())) };
  return cache.R;
}

// which story does the current set-up tell?
function scenario(R) {
  if (S.secret) return S.secret;
  if (S.place === 'moon') return 'moon';
  if (!S.air) return 'vacuum';
  if (S.a === S.b) return 'same';
  if (OBJ[S.a].m === OBJ[S.b].m) return 'shape';
  return Math.abs(R[0].tLand - R[1].tLand) < 0.25 ? 'close' : 'drag';
}
function nextHint(sc) {
  const paperPair = [S.a, S.b].every((k) => k === 'sheet' || k === 'ball');
  switch (sc) {
    case 'same': return 'heavy';
    case 'close': return 'feather';
    case 'drag': case 'shape': return 'airoff';
    case 'vacuum': return paperPair ? 'moon' : 'paper';
    case 'moon': return secret.unlocked() ? 'apollo' : 'secret';
    case 'apollo': return 'bremen';
    case 'bremen': return airOn() ? 'heavy' : 'airon';
  }
  return 'heavy';
}
function outcome(R) {
  const H = height(), d = R[0].tLand - R[1].tLand;
  const win = Math.abs(d) < TIE ? 'T' : d < 0 ? 'A' : 'B';
  const loser = win === 'A' ? 1 : 0, tw = Math.min(R[0].tLand, R[1].tLand);
  return { win, d: Math.abs(d), gap: win === 'T' ? 0 : H - at(R[loser], tw, H).y };
}

  const open = secret.unlocked();

  const sChip = (k) => `<button class="chip secret ${open ? 'open' : ''} ${isOn(k) ? 'on' : ''}" data-k="${k}">${open ? esc(t.sChip[k]) : '🔒 ???'}</button>`;

      const r = R[l], k = l ? S.b : S.a;
      const top = air ? `<div class="lrow">${esc(t.top)}: <b>${esc(fmtV(r.vt))}</b> · ${esc(r.tReach !== null ? t.reached(fmtS(r.tReach)) : t.notReached)}</div>` : '';
      return `<div class="lst"><i style="background:${LANE[l]}"></i><b>${esc(name(k))}</b><span>· ${esc(fmtM(OBJ[k].m))}</span></div>
        <div class="lrow">⏱ ${esc(t.time)}: <b>${esc(fmtS(r.tLand))}</b> · ${esc(t.land)}: <b>${esc(fmtV(r.vLand))}</b></div>${top}`;
    }).join('') + (air ? '' : `<div class="lrow mut">${esc(t.noAir)}</div>`);
  } else stats = `<div class="lrow mut" style="padding-left:0">${esc(t.dropFirst)}</div>`;
  const src = `${t.src}${S.secret === 'apollo' ? ' ' + t.srcApollo : ''}${S.secret === 'bremen' ? ' ' + t.srcBremen : ''}`;
  lab.setState({ emo, title, lead, body, extra: `<div class="stats">${stats}</div><div class="fine">${esc(t.fine(fmtH(H)))}</div><div class="fine">${esc(src)}</div>` });

  const col = moon ? '#b9bfd0' : air ? '#4ea8ff' : '#a78bfa';
  lab.setGlow(moon ? 'rgba(150,155,175,.22)' : air ? 'rgba(60,110,200,.32)' : 'rgba(140,90,220,.28)');
  lastReadout = ''; readout(col);

  // the stage card
  askEl.style.display = S.phase === 'falling' ? 'none' : '';
  askEl.classList.toggle('bottom', S.phase === 'ready'); askEl.classList.toggle('top', S.phase === 'done');
  if (S.phase === 'ready') {
    const mA = OBJ[S.a].m, mB = OBJ[S.b].m, r = ratioOf(mA, mB);
    const heavier = mA === mB ? t.same : t.heavier(nf(r, 1, 0), lang === 'ru' ? ruTimes(r) : '');
    askEl.innerHTML = `<div class="q">${esc(t.q)}</div>
      <div class="fact">${esc(fmtM(mA))} · ${esc(fmtM(mB))} — ${esc(heavier)}. ${esc(t.from(fmtH(H)))}</div>
      <div class="opts"><button data-g="A"><i style="background:${LANE[0]}"></i>${esc(name(S.a))}</button><button data-g="T">${esc(t.together)}</button><button data-g="B"><i style="background:${LANE[1]}"></i>${esc(name(S.b))}</button></div>`;
  } else if (S.phase === 'done') {
    const o = outcome(R), mW = o.win === 'A' ? OBJ[S.a].m : OBJ[S.b].m, mL = o.win === 'A' ? OBJ[S.b].m : OBJ[S.a].m;
    const right = S.guess === o.win, almost = !right && S.guess === 'T' && o.d < 0.25;
    const vcol = right ? 'var(--ok)' : almost ? 'var(--wip)' : 'var(--red)';
    const r = ratioOf(OBJ[S.a].m, OBJ[S.b].m), rs = nf(r, 1, 0), rt = lang === 'ru' ? ruTimes(r) : '';
    let line = o.win === 'T' ? t.tie(fmtS(TIE)) : t.win(lower(name(o.win === 'A' ? S.a : S.b)), fmtS(o.d));
    let extra = o.win === 'T' || lab.view === 'graph' ? '' : `<p>${esc(t.gap(fmtGap(o.gap)))}</p>`;
    if (lab.view === 'graph' || S.secret === 'apollo') { /* keep the card short; Scott's feather mass is unknown */ }
    else if (r >= 10 && o.win === 'T') extra += `<p class="big">${esc(t.bustTie(rs, rt))}</p>`;
    else if (r >= 10 && o.win !== 'T' && mW > mL && o.d < 0.25) extra += `<p class="big">${esc(t.bust(rs, fmtS(o.d), rt))}</p>`;
    const h = nextHint(sc);
    askEl.innerHTML = `<div class="verdict" style="color:${vcol}">${esc(right ? t.right : almost ? t.almost : t.wrong)}</div>
      <p class="big">${esc(line)}</p>${extra}
      <div class="opts after"><button data-act="again">${esc(t.again)}</button><button class="next" data-hint="${h}">${esc(t.hints[h])} →</button></div>`;
  }
}

// the readout: both clocks, live
let lastReadout = '', readCol = '#4ea8ff';
function readout(col) {
  if (col) readCol = col;
  const t = T[lang], R = runs();
  const clock = (l) => (S.phase === 'ready' ? `? ${U().s}` : fmtS(Math.min(S.t, R[l].tLand)));
  const val = `<span style="color:${LANE[0]}">${esc(clock(0))}</span><span class="vs">·</span><span style="color:${LANE[1]}">${esc(clock(1))}</span>`;
  const pill = S.place === 'moon' ? t.pill.moon : airOn() ? t.pill.air : t.pill.vac;
  const key = val + pill + lang;
  if (key === lastReadout) return;
  lastReadout = key;
  lab.setReadout(val, t.sub(fmtH(height())), pill, readCol);
}

// --- drawing ------------------------------------------------------------------------------------------------
const C = { ink: '#EDEFF7', mut: '#98A0B8', faint: '#646C84', grav: '#ff5a4f', air: '#7cc4ff' };
const MOTES = Array.from({ length: 90 }, () => [Math.random(), Math.random(), 0.5 + Math.random()]);
const STARS = Array.from({ length: 70 }, () => [Math.random(), Math.random(), Math.random()]);
const CRUMPLE = Array.from({ length: 11 }, (_, i) => 0.78 + 0.22 * Math.abs(Math.sin(i * 2.7 + 1.3)));

function drawObj(c, k, x, y, r, time, falling) {
  c.save(); c.translate(x, y);
  const wob = falling && airOn() ? Math.sin(time * 3.1) : 0;
  if (k === 'bowl') {
    const g = c.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#6c7fd8'); g.addColorStop(1, '#141a3a');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
    c.fillStyle = '#05070f';
    for (const [hx, hy] of [[0.25, -0.45], [0.5, -0.15], [0.05, -0.12]]) { c.beginPath(); c.arc(hx * r, hy * r, r * 0.11, 0, 7); c.fill(); }
  } else if (k === 'tennis') {
    c.rotate(time * (falling ? 2 : 0));
    const g = c.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#f2ff8a'); g.addColorStop(1, '#a9c21c');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = Math.max(1.2, r * 0.1);
    c.beginPath(); c.arc(-r * 1.25, 0, r * 0.95, -0.75, 0.75); c.stroke();
    c.beginPath(); c.arc(r * 1.25, 0, r * 0.95, Math.PI - 0.75, Math.PI + 0.75); c.stroke();
  } else if (k === 'hammer') {
    c.fillStyle = '#b07a45'; c.fillRect(-r * 0.13, -r * 1.15, r * 0.26, r * 1.65);
    const g = c.createLinearGradient(0, r * 0.4, 0, r);
    g.addColorStop(0, '#c9d0de'); g.addColorStop(1, '#7d8598');
    c.fillStyle = g; c.fillRect(-r * 0.75, r * 0.42, r * 1.5, r * 0.55);
  } else if (k === 'feather') {
    c.rotate(-0.55 + wob * 0.35);
    c.fillStyle = 'rgba(241,231,210,.95)';
    c.beginPath(); c.moveTo(0, r * 0.75);
    c.bezierCurveTo(-r * 0.75, r * 0.35, -r * 0.6, -r * 0.85, 0, -r * 1.25);
    c.bezierCurveTo(r * 0.7, -r * 0.8, r * 0.7, r * 0.35, 0, r * 0.75); c.fill();
    c.strokeStyle = 'rgba(150,130,100,.6)'; c.lineWidth = 0.8;
    for (let i = -3; i <= 3; i++) { const yy = i * r * 0.25; c.beginPath(); c.moveTo(0, yy); c.lineTo(-r * 0.45, yy - r * 0.2); c.moveTo(0, yy); c.lineTo(r * 0.45, yy - r * 0.2); c.stroke(); }
    c.strokeStyle = '#d8c8a6'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(0, r * 1.25); c.quadraticCurveTo(r * 0.08, 0, 0, -r * 1.25); c.stroke();
  } else if (k === 'sheet') {
    c.rotate(wob * 0.12);
    c.fillStyle = '#f4f6fb'; c.strokeStyle = '#9aa3bb'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(-r * 1.35, -r * 0.1); c.lineTo(r * 1.05, -r * 0.38); c.lineTo(r * 1.35, r * 0.12); c.lineTo(-r * 1.05, r * 0.38); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(120,140,190,.45)';
    for (let i = 1; i <= 3; i++) { const f = i / 4; c.beginPath(); c.moveTo(lerp(-r * 1.35, -r * 1.05, f), lerp(-r * 0.1, r * 0.38, f)); c.lineTo(lerp(r * 1.05, r * 1.35, f), lerp(-r * 0.38, r * 0.12, f)); c.stroke(); }
  } else if (k === 'ball') {
    c.rotate(falling ? time * 1.5 : 0);
    c.fillStyle = '#e6e9f0'; c.strokeStyle = '#8a93ad'; c.lineWidth = 1;
    c.beginPath();
    CRUMPLE.forEach((q, i) => { const a = i / CRUMPLE.length * Math.PI * 2; c[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r * q, Math.sin(a) * r * q); });
    c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-r * 0.4, -r * 0.3); c.lineTo(0, 0); c.lineTo(r * 0.45, -r * 0.35); c.moveTo(0, 0); c.lineTo(-r * 0.1, r * 0.55); c.moveTo(0, 0); c.lineTo(r * 0.5, r * 0.2); c.stroke();
  } else if (k === 'chute') {
    c.rotate(wob * 0.08);
    const cy = -r * 0.35;
    c.fillStyle = '#ff5a4f'; c.beginPath(); c.ellipse(0, cy, r * 1.45, r * 0.95, 0, Math.PI, 0); c.closePath(); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(0, cy); c.ellipse(0, cy, r * 1.45, r * 0.95, 0, Math.PI * 1.36, Math.PI * 1.64); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(237,239,247,.7)'; c.lineWidth = 0.9;
    for (const sx of [-1.45, -0.5, 0.5, 1.45]) { c.beginPath(); c.moveTo(sx * r, cy); c.lineTo(0, r * 0.55); c.stroke(); }
    c.fillStyle = '#f5c84c'; c.beginPath(); c.arc(0, r * 0.62, r * 0.2, 0, 7); c.fill();
    c.fillStyle = '#4ea8ff'; c.fillRect(-r * 0.16, r * 0.78, r * 0.32, r * 0.3);
  }
  c.restore();
}

function arrow(c, x, y0, len, dir, col) {
  if (len < 4) return;
  const y1 = y0 + dir * len;
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x, y0); c.lineTo(x, y1 - dir * 6); c.stroke();
  c.beginPath(); c.moveTo(x - 5, y1 - dir * 7); c.lineTo(x + 5, y1 - dir * 7); c.lineTo(x, y1); c.closePath(); c.fill();
}
const niceStep = (span, n) => { const raw = span / n, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p; };

function drawTower(c, w, h, time) {
  const t = T[lang], R = runs(), H = height(), air = airOn(), moon = S.place === 'moon';
  const left = 46, right = 10, lw = Math.min(190, (w - left - right) / 2 - 8), mid = left + (w - left - right) / 2;
  const xs = [mid - lw / 2 - 5, mid + lw / 2 + 5];
  const r = clamp(Math.min(lw * 0.14, h * 0.045), 10, 20), yTop = 52, yG = h - 30;
  const y0 = yTop + r + 8, y1 = yG - r;
  const Y = (fall) => lerp(y0, y1, fall / H);
  // sky: stars on the Moon
  if (moon) { c.fillStyle = 'rgba(255,255,255,.7)'; for (const [sx, sy, sz] of STARS) { c.globalAlpha = 0.3 + 0.5 * sz; c.fillRect(sx * w, sy * (yG - 10), 1 + sz, 1 + sz); } c.globalAlpha = 1; }
  // ground
  c.fillStyle = moon ? '#3a3d46' : '#1d2a22'; c.fillRect(0, yG, w, h - yG);
  c.strokeStyle = moon ? '#7a7f8e' : '#3d6b4a'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, yG); c.lineTo(w, yG); c.stroke();
  // height scale
  const step = niceStep(H, 5);
  c.font = '800 10.5px Nunito, sans-serif'; c.textAlign = 'right'; c.textBaseline = 'middle'; c.strokeStyle = 'rgba(130,145,190,.35)'; c.lineWidth = 1;
  for (let hh = 0; hh <= H + 1e-9; hh += step) {
    const yy = Y(H - hh) + r; if (hh > 0 && Math.abs(hh - H) > 1e-9 && H - hh < step * 0.5) continue;
    c.beginPath(); c.moveTo(left - 2, yy); c.lineTo(left + 4, yy); c.stroke();
    c.fillStyle = C.faint; c.fillText(fmtH(hh), left - 5, yy);
  }
  if (Math.abs((H / step) - Math.round(H / step)) > 1e-6) { const yy = Y(0) + r; c.fillStyle = C.mut; c.fillText(fmtH(H), left - 5, yy); c.beginPath(); c.moveTo(left - 2, yy); c.lineTo(left + 4, yy); c.stroke(); }
  // vacuum chamber outline
  if (!air && !moon) {
    c.strokeStyle = 'rgba(167,139,250,.55)'; c.setLineDash([6, 5]); c.lineWidth = 1.5;
    c.beginPath(); c.roundRect ? c.roundRect(xs[0] - lw / 2 - 4, yTop - 6, xs[1] - xs[0] + lw + 8, yG - yTop + 6, 12) : c.rect(xs[0] - lw / 2 - 4, yTop - 6, xs[1] - xs[0] + lw + 8, yG - yTop + 6);
    c.stroke(); c.setLineDash([]);
  }
  // legend
  c.textAlign = 'left'; c.font = '800 11px Nunito, sans-serif';
  c.fillStyle = C.grav; c.fillText(t.gravity, left, 12);
  if (air) { c.fillStyle = C.air; c.fillText(t.airPush, left + c.measureText(t.gravity).width + 14, 12); }
  else if (!moon) { c.fillStyle = '#a78bfa'; c.fillText(t.vacTag, left + c.measureText(t.gravity).width + 14, 12); }
  const tv = Math.sqrt(2 * H / GRAV[S.place]), strobe = tv / 10;
  const o = S.phase === 'done' ? outcome(R) : null;
  [S.a, S.b].forEach((k, l) => {
    const cx = xs[l], run = R[l], st = S.phase === 'ready' ? { y: 0, v: 0, landed: false } : at(run, S.t, H);
    // the lane
    c.fillStyle = 'rgba(130,145,190,.07)';
    c.beginPath(); c.roundRect ? c.roundRect(cx - lw / 2, yTop, lw, yG - yTop, 10) : c.rect(cx - lw / 2, yTop, lw, yG - yTop); c.fill();
    if (air) {
      c.fillStyle = 'rgba(180,200,240,.28)';
      for (const [mx, my, ms] of MOTES) {
        if ((mx < 0.5) !== (l === 0)) continue;
        const px = cx - lw / 2 + 4 + ((mx * 2) % 1) * (lw - 8) + Math.sin(time * 0.7 + my * 9) * 3;
        const py = yTop + 4 + ((my + time * 0.01 * ms) % 1) * (yG - yTop - 8);
        c.fillRect(px, py, 1.6, 1.6);
      }
    }
    // the shelf they are dropped from
    c.fillStyle = 'rgba(237,239,247,.35)'; c.fillRect(cx - lw / 2 + 6, yTop + 2, lw - 12, 3);
    // header: colour dot, mass, live speed
    c.fillStyle = LANE[l]; c.beginPath(); c.arc(cx - lw / 2 + 8, 34, 5, 0, 7); c.fill();
    c.fillStyle = C.ink; c.font = '800 11.5px Nunito, sans-serif'; c.textAlign = 'left';
    const head = S.phase === 'ready' ? fmtM(OBJ[k].m) : `${fmtM(OBJ[k].m)} · ${fmtV(st.v)}`;
    c.fillText(head, cx - lw / 2 + 17, 34, lw - 20);
    // strobe dots: where it was every tenth of the airless fall time; wider gaps = faster
    if (S.phase !== 'ready') {
      c.fillStyle = LANE[l]; c.globalAlpha = 0.75;
      for (let ts = strobe, n = 0; ts <= Math.min(S.t, run.tLand) && n < 600; ts += strobe, n++) {
        c.beginPath(); c.arc(cx - lw / 2 + 9, Y(at(run, ts, H).y), 2, 0, 7); c.fill();
      }
      c.globalAlpha = 1;
    }
    // the object
    const oy = Y(st.y), falling = S.phase === 'falling' && !st.landed;
    drawObj(c, k, cx, oy, r, time, falling);
    // force arrows, each measured against the object's own weight
    if (!st.landed) {
      const L = clamp(r * 2.3, 24, 44), ax = cx + r * 1.55 + 8;
      arrow(c, ax, oy, L, 1, C.grav);
      if (air && isFinite(run.vt)) arrow(c, ax + 9, oy, L * Math.min(1, (st.v / run.vt) ** 2), -1, C.air);
      if (air && run.tReach !== null && S.t >= run.tReach && S.phase !== 'ready') {
        c.font = '800 10px Nunito, sans-serif'; const tw = c.measureText(t.topTag).width + 12;
        c.fillStyle = 'rgba(124,196,255,.2)'; c.strokeStyle = C.air; c.lineWidth = 1;
        c.beginPath(); c.roundRect ? c.roundRect(cx - tw / 2, oy - r - 24, tw, 16, 8) : c.rect(cx - tw / 2, oy - r - 24, tw, 16); c.fill(); c.stroke();
        c.fillStyle = C.air; c.textAlign = 'center'; c.fillText(t.topTag, cx, oy - r - 16);
      }
    }
    // result on the ground
    if (st.landed && S.phase !== 'ready') {
      const first = o ? (o.win === 'T' || (o.win === 'A') === (l === 0)) : (run.tLand <= R[1 - l].tLand);
      c.textAlign = 'center'; c.font = '900 13px Nunito, sans-serif'; c.fillStyle = first ? '#fff' : C.mut;
      c.fillText(`${first ? '🏁 ' : ''}${fmtS(run.tLand)}`, cx, yG + 15);
    }
  });
}

function drawGraph(c, w, h) {
  const t = T[lang], R = runs(), H = height(), g = GRAV[S.place], air = airOn();
  const L = 46, Rm = 14, B = h - 34;
  const Tp = S.phase === 'done' && askEl.offsetHeight ? Math.min(h * 0.55, askEl.offsetHeight + 34) : 30;
  const tv = Math.sqrt(2 * H / g), vRef = g * tv;
  const tMax = Math.max(R[0].tLand, R[1].tLand) * 1.04;
  const vMax = Math.max(R[0].vLand, R[1].vLand, air ? vRef : 0) * 1.12;
  const X = (x) => L + x / tMax * (w - L - Rm), Y = (v) => B - v / vMax * (B - Tp);
  // grid and axes
  c.font = '800 10.5px Nunito, sans-serif'; c.lineWidth = 1;
  const ts = niceStep(tMax, w < 500 ? 4 : 7), vs = niceStep(vMax, 5);
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (let x = 0; x <= tMax; x += ts) { c.strokeStyle = 'rgba(130,145,190,.12)'; c.beginPath(); c.moveTo(X(x), Tp); c.lineTo(X(x), B); c.stroke(); c.fillStyle = C.faint; c.fillText(nf(x, ts < 1 ? 1 : 0), X(x), B + 5); }
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let v = 0; v <= vMax; v += vs) { c.strokeStyle = 'rgba(130,145,190,.12)'; c.beginPath(); c.moveTo(L, Y(v)); c.lineTo(w - Rm, Y(v)); c.stroke(); c.fillStyle = C.faint; c.fillText(nf(v, vs < 1 ? 1 : 0), L - 6, Y(v)); }
  c.strokeStyle = 'rgba(200,210,235,.45)'; c.beginPath(); c.moveTo(L, Tp); c.lineTo(L, B); c.lineTo(w - Rm, B); c.stroke();
  c.fillStyle = C.mut; c.textAlign = 'right'; c.textBaseline = 'alphabetic'; c.fillText(t.axisT, w - Rm, B + 28);
  c.textAlign = 'left'; c.fillText(t.axisV, L, Tp - 12);
  if (S.phase === 'ready') {
    c.fillStyle = C.mut; c.textAlign = 'center'; c.font = `500 ${clamp(w * 0.034, 16, 22)}px "EB Garamond", serif`;
    c.fillText(t.graphHint, (L + w - Rm) / 2, Tp + (B - Tp) * 0.3, w - L - Rm - 10);
    return;
  }
  // the airless reference: speed grows by g every second
  if (air) {
    const te = Math.min(tv, tMax);
    c.strokeStyle = 'rgba(200,210,235,.45)'; c.setLineDash([2, 5]); c.lineWidth = 2;
    c.beginPath(); c.moveTo(X(0), Y(0)); c.lineTo(X(te), Y(g * te)); c.stroke(); c.setLineDash([]);
    c.fillStyle = C.mut; c.textAlign = 'left'; c.font = '800 10.5px Nunito, sans-serif'; c.fillText(t.noAirLine, X(te) + 5, Y(g * te) + 4);
  }
  // terminal velocity lines, once reached
  [0, 1].forEach((l) => {
    const r = R[l];
    if (!air || r.tReach === null || S.t < r.tReach || r.vt > vMax) return;
    c.strokeStyle = LANE[l]; c.globalAlpha = 0.6; c.setLineDash([7, 6]); c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(L, Y(r.vt)); c.lineTo(w - Rm, Y(r.vt)); c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
    c.fillStyle = LANE[l]; c.textAlign = 'right'; c.font = '800 10.5px Nunito, sans-serif';
    c.fillText(`${t.topTag} ${fmtV(r.vt)}`, w - Rm - 2, Y(r.vt) - (l && R[0].tReach !== null && Math.abs(R[0].vt - r.vt) < vMax * 0.06 ? -12 : 6));
  });
  // the two curves up to now
  [0, 1].forEach((l) => {
    const r = R[l], tEnd = Math.min(S.t, r.tLand), n = Math.max(2, Math.ceil(tEnd / DT)), stp = Math.max(1, Math.floor(n / 500));
    c.strokeStyle = LANE[l]; c.lineWidth = l ? 2.5 : 5; c.globalAlpha = l ? 1 : 0.8; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(X(0), Y(0));
    for (let i = stp; i < n; i += stp) c.lineTo(X(i * DT), Y(r.vs[i]));
    const end = at(r, tEnd, H);
    c.lineTo(X(tEnd), Y(end.v)); c.stroke(); c.globalAlpha = 1;
    c.fillStyle = LANE[l]; c.beginPath(); c.arc(X(tEnd), Y(end.v), l ? 4 : 6, 0, 7); c.fill();
    if (end.landed) {
      c.fillStyle = '#fff'; c.font = '900 11.5px Nunito, sans-serif'; c.textAlign = X(tEnd) > w - 80 ? 'right' : 'left';
      c.fillText(`🏁 ${fmtS(r.tLand)}`, X(tEnd) + (c.textAlign === 'right' ? -8 : 8), Y(end.v) + (l ? 14 : -10));
    }
  });
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.phase === 'falling') {
    const R = runs();
    S.t += dt * S.play;
    [0, 1].forEach((l) => { if (!S.landed[l] && S.t >= R[l].tLand) { S.landed[l] = true; sfx.snap(); } });
    if (S.t >= Math.max(R[0].tLand, R[1].tLand)) {
      S.t = Math.max(R[0].tLand, R[1].tLand); S.phase = 'done';
      (S.guess === outcome(R).win ? sfx.good : sfx.bad)();
      render();
    }
    readout();
  }
  if (lab.view === 'graph') drawGraph(c, w, h); else drawTower(c, w, h, time);
});
render();
</script>
