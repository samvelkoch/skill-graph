  if (S.pollT < 0 || S.pollDone) return;
  S.pollT += dt;
  const n = countAt(S.pollT);
  if (n !== S.pollCount) { S.pollCount = n; sfx.tick(); render(); }
  if (S.pollT >= HANDS_END + 0.8) { S.pollDone = true; S.pollCount = 25; (S.pq === 0 ? sfx.good : sfx.bad)(); render(); }
}

  $('fo-bricks').innerHTML = t.reasons.map((r, i) => `<button class="chip fo-chip ${S.bricks[i] ? 'on' : ''}" data-act="brick" data-i="${i}">🧱 ${esc(r)}</button>`).join('');
  if (S.sec === 'a') {
    lab.setReadout(String(S.year), rev ? (R.card.truth ? t.stampTrue : t.stampFalse) : '', '', '#2bb3a3');
    lab.setState({ emo: '🪐', title: t.secrets.a[0], lead: t.secrets.a[1], body: '', extra: '' });
  } else if (S.sec === 'b') {
    lab.setReadout(`${S.bricks.filter(Boolean).length} / 3`, t.convincing, '', '#2bb3a3');
    lab.setState({ emo: '🧱', title: t.secrets.b[0], lead: t.secrets.b[1], body: '', extra: '' });
  } else {
    const ok = R.guess === R.card.kind;
    lab.setReadout(`${S.sorted} / 9`, t.sorted, rev ? (ok ? t.right : nq()) : '', '#2bb3a3');
    if (rev) lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : nq(), lead: t.cards[R.card.key].why, body: '', extra: '' });
    else lab.setState({ ...t.state.machine, extra: '' });
  }
}
function renderAdvert(t) {
  lab.setGlow('rgba(255, 158, 94, .26)');
  const k = S.mark.filter((m, i) => m === ADV[i]).length, all = S.mark.every(Boolean);
  $('fo-strips').innerHTML = t.sentences.map((s, i) => {
    const m = S.checked ? ADV[i] : S.mark[i], good = S.mark[i] === ADV[i];
    const label = m ? `${S.checked ? (good ? '✓ ' : '✗ ') : ''}${t[m]}` : '?';
    return `<button class="fo-strip ${m ? `fo-m-${m}` : ''} ${S.checked ? `fo-done ${good ? 'fo-sok' : 'fo-sbad'}` : ''}" data-i="${i}"><span class="fo-s">${S.checked && ADV[i] === 'opinion' ? hilite(s, t.signal) : esc(s)}</span><span class="fo-tag">${esc(label)}</span></button>`;
  }).join('');
  $('fo-check').textContent = S.checked ? t.again : t.check; $('fo-check').disabled = !S.checked && !all;
  if (S.checked) {
    lab.setReadout(`${k} / 6`, t.sentencesRight, k === 6 ? t.right : nq(), '#ff9e5e');
    lab.setState({ emo: k === 6 ? '✅' : '🤔', title: k === 6 ? t.right : nq(), lead: t.state.advert.lead, body: t.state.advert.body, extra: '' });
  } else {
    lab.setReadout('? / 6', t.sentencesRight, '', '#ff9e5e');
    lab.setState({ ...t.state.advert, extra: '' });
  }
}
function renderPoll(t) {
  lab.setGlow('rgba(245, 166, 35, .24)');
  const asked = S.pollT >= 0, done = S.pollDone;
  $('fo-pq').textContent = t.qPoll;
  $('fo-pchips').innerHTML = PPERM.map((oi) => {
    const cls = done ? (oi === 0 ? 'fo-ok' : S.pq === oi ? 'fo-bad' : '') : S.pq === oi ? 'on' : '';
    return `<button class="chip fo-pc ${cls}" data-act="pq" data-i="${oi}"${asked ? ' disabled' : ''}>${esc(t.optsPoll[oi])}</button>`;
  }).join('');
  $('fo-ask').textContent = done ? t.again : t.askClass; $('fo-ask').disabled = !done && (S.pq === null || asked);
  $('fo-tele').style.display = done ? 'inline-flex' : 'none'; $('fo-tele').textContent = t.telescope; $('fo-tele').classList.toggle('on', S.tele);
  const ok = S.pq === 0;
  lab.setReadout(`${S.pollCount} / 30`, t.saidYes, done ? (ok ? t.right : nq()) : '', '#f5a623');
  if (done && S.tele) lab.setState({ emo: '🔭', title: '1610', lead: t.sunWhy, body: '', extra: '' });
  else if (done) lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : nq(), lead: t.pollWhy, body: t.state.poll.body, extra: '' });
  else lab.setState({ ...t.state.poll, extra: '' });
}
render();
</script>
