function drawCurtain(c, w, h, open) {
  const e = open * open * (3 - 2 * open), pw = (w / 2) * (1 - e) + (e < 0.001 ? 1 : 0);
  if (pw < 1) return;
  const folds = 5;
  for (const side of [0, 1]) {
    const x0 = side ? w - pw : 0;
    const g = c.createLinearGradient(x0, 0, x0 + pw, 0);
    for (let i = 0; i <= folds * 2; i++) g.addColorStop(i / (folds * 2), i % 2 ? '#8e1620' : '#d12a35');
    c.fillStyle = g; c.fillRect(x0, 0, pw, h);
    const sh = c.createLinearGradient(0, 0, 0, h); sh.addColorStop(0, 'rgba(0,0,0,.35)'); sh.addColorStop(0.25, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.3)'); c.fillStyle = sh; c.fillRect(x0, 0, pw, h);
    c.fillStyle = '#e9b84a'; c.fillRect(side ? w - 3 : pw - 3, 0, 3, h);

}

// --- the picture --------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const ctx = A.ctx, now = ctx ? ctx.currentTime : 0, view = lab.view;
  const V = view === 'dials' && S.mode !== 'free' ? S.mys : D;
  // the band's step in time with the beat; the dials follow a playing program
  if (S.playing && A.prog) {
    const P = A.prog, el = now - A.t0;
    if (el >= 0) {
      const b = A.beats; let ph = A.phase0;
      for (let i = b.length - 1; i >= 0; i--) if (b[i].at <= now) { ph = A.phase0 + b[i].n + clamp((now - b[i].at) / b[i].dur, 0, 1); break; }
      S.phase = Math.max(S.phase, ph);
      if (P.drive && !P.free) { const p = paramsAt(P, Math.min(el, P.total - 0.001)), k = Math.min(1, dt * 9); D.s += (p.s - D.s) * k; D.l += (p.l - D.l) * k; }
    }
  } else S.phase += dt * bpmOf(V.s) / 60;
  const cover = view === 'changing' && !S.scDone[S.sc]; D.hide = cover;
  updDials();
  // the picture is drawn in a design box of 360 x 300 and scaled to fit
  const sc = Math.min(w / W, h / H);
  if (cover) { drawCover(c, w, h, SC[S.sc].emo, time); return; }
  c.save(); c.translate((w - W * sc) / 2, (h - H * sc) / 2); c.scale(sc, sc);
  c.beginPath(); c.rect(0, 0, W, H); c.clip();
  drawBg(c, time, S.phase);
  const jt = now - S.jumpAt, sleepy = S.sec === 'a' && S.playing && jt < 0;
  const lerpK = Math.min(1, dt * 4);
  for (let i = 0; i < 8; i++) S.jv[i] += ((i < S.nAn ? 1 : 0) - S.jv[i]) * lerpK;
  const jump = jt >= 0 && jt < 0.9 ? (jt < 0.5 ? 34 * Math.sin((jt / 0.5) * Math.PI) : 8 * Math.sin(((jt - 0.5) / 0.4) * Math.PI)) : 0;
  const wide = jt >= 0 && jt < 1.6, bang = jt >= 0 && jt < 1.4;
  const anchors = [];
  const place = (list, xs, i, scl, fy) => {
    if (S.jv[i] < 0.02) return;
    const jv = S.jv[i], e = jv * jv * (3 - 2 * jv), x = xs[i % 4] + (1 - e) * 70;
    c.save(); c.globalAlpha = Math.min(1, jv * 1.4);
    const a = animal(c, list[i % 4], x, fy, scl, S.phase, V, { jump, wide, bang, sleep: sleepy, t: time });
    c.restore();
    anchors.push({ ...a, sc: scl });
  };
  for (let i = 4; i < 8; i++) place(EXTRA, EX, i, 1.05, FY - 10);
  for (let i = 0; i < 4; i++) place(MAIN, KX, i, 1.3, FY);
  // sound rings from the instruments, wider for louder notes
  A.pulses = A.pulses.filter((p) => now - p.at < 0.9);
  for (const p of A.pulses) {
    const age = now - p.at; if (age < 0 || age > 0.7) continue;
    const kk = age / 0.7, gn = clamp((p.g - 0.05) / 0.55, 0, 1);
    for (const a of anchors) for (const lag of gn > 0.4 ? [0, 0.18] : [0]) {
      const k2 = clamp(kk - lag, 0, 1); if (k2 <= 0) continue;
      const r = (5 + 34 * gn) * (1 - (1 - k2) * (1 - k2)) * (a.sc / 1.3);
      c.strokeStyle = `rgba(255,240,200,${(1 - k2) * (0.3 + 0.55 * gn)})`; c.lineWidth = 1.5 + 2 * gn; c.beginPath(); c.arc(a.x, a.y, Math.max(0, r), 0, 7); c.stroke();

  S.curtain += (target - S.curtain) * Math.min(1, dt * 3.2);
  if (view === 'dials' && S.curtain < 0.995) drawCurtain(c, w, h, S.curtain);
});

  if (v === 'dials') renderDials(t, C); else if (v === 'changing') renderChanging(t, C); else renderWords(t, C);
  updDials();
}
function renderDials(t, C) {
  lab.setGlow('rgba(224, 140, 70, .26)');
  const sc = S.mn ? `<span class="fine">${esc(t.score(S.mr, S.mn))}</span>` : '';
  if (S.mode === 'free') {
    C.innerHTML = `<div class="tp-sec">${playBtn('free', 'free', t.play, 'btn')}<button class="chip tp-b" data-act="mys">${t.mystery}</button>${sc}</div>`;
    lab.setReadout(`${t.words.s[widx(D.s)]} · ${t.words.l[widx(D.l)]}`, `${t.dial.s} · ${t.dial.l}`, S.mn ? t.score(S.mr, S.mn) : '', '#e08c46');
    lab.setState({ emo: '🥁', title: t.free[0], lead: t.free[1], body: '', extra: '' });
  } else if (S.mode === 'hidden') {
    C.innerHTML = `<div class="tp-sec">${playBtn('mys', 'hearM', t.hearM, 'btn')}${playBtn('mine', 'hearMine', t.hearMine)}<button class="btn tp-b" data-act="check">${t.check}</button><button class="chip tp-b" data-act="freeMode">${t.freeMode}</button></div>`;
    lab.setReadout('?', `${t.dial.s} · ${t.dial.l}`, S.mn ? t.score(S.mr, S.mn) : '', '#e08c46');
    lab.setState({ emo: '🎭', title: t.hid[0], lead: t.hid[1], body: '', extra: '' });
  } else {
    const ok = (S.chk.s ? 1 : 0) + (S.chk.l ? 1 : 0), cb = t.combo[S.mys.c];
    C.innerHTML = `<div class="tp-sec">${playBtn('mys', 'hearM', t.hearAgain)}<button class="btn tp-b" data-act="mys">${t.again}</button><button class="chip tp-b" data-act="freeMode">${t.freeMode}</button></div>`;
    lab.setReadout(`${S.chk.s ? '✓' : '✗'} ${t.dial.s} · ${S.chk.l ? '✓' : '✗'} ${t.dial.l}`, '', t.score(S.mr, S.mn), ok === 2 ? '#3ddc97' : '#e08c46');
    lab.setState({ emo: ok === 2 ? '✅' : '🎭', title: t.res[ok], lead: t.was(cb[0]),
      body: ['s', 'l'].map((k) => `${S.chk[k] ? '✓' : '✗'} ${t.yours(t.dial[k], t.words[k][widx(D[k])], t.words[k][widx(S.mys[k])])}`).join('. '),
      extra: `<div class="fine">${esc(cb[1])}</div>` });
  }
  lab.setFacts(t.facts.v1.map((f) => ({ ...f })));
}
function renderChanging(t, C) {
  lab.setGlow('rgba(95, 140, 220, .28)');
  const i = S.sc, played = S.scPlayed[i], done = S.scDone[i], ans = SC[i].ans;
  const scenes = SC.map((s, j) => `<button class="tp-scene${j === i ? ' on' : ''}" data-act="scene" data-n="${j}"><span class="e">${s.emo}</span><span>${esc(t.sc[j].t)}</span><span class="m">${S.scDone[j] ? (S.scDone[j] === SC[j].ans ? '✅' : '❌') : ''}</span></button>`).join('');
  const opts = ['s', 'l', 'b'].map((o) => {
    const mark = done && o === ans ? ' on' : '';
    return `<button class="chip tp-b${mark}" data-act="ans" data-o="${o}"${!played || done ? ' disabled' : ''}>${done && o === done && o !== ans ? '✗ ' : done && o === ans ? '✓ ' : ''}${esc(t.opts[o])}</button>`;
  }).join('');
  C.innerHTML = `<div class="tp-sec"><div class="tp-grid">${scenes}</div></div>
    <div class="tp-sec">${playBtn('sc', 'scPlay', played ? t.replay : t.playSnd, 'btn')}<span class="tp-q">${esc(t.ask)}</span>${opts}</div>`;
  const nd = S.scDone.filter(Boolean).length;
  const words = done ? MW[i].map((w) => `${t.mw[w][0]} (${t.mw[w][1]})`).join(' → ') : '';
  lab.setReadout(done ? MW[i].map((w) => t.mw[w][0]).join(' → ') : '?', `${nd} / 4`, '', '#6f98e0');
  if (!done) lab.setState({ emo: SC[i].emo, title: t.sc[i].t, lead: played ? t.scAsk : t.scLead, body: '', extra: '' });
  else lab.setState({ emo: done === ans ? '✅' : '🤔', title: done === ans ? t.right : t.no, lead: t.sc[i].what, body: words, extra: '' });
  lab.setFacts(t.facts.v2.map((f) => ({ ...f })));
}
function renderWords(t, C) {
  lab.setGlow('rgba(240, 200, 100, .24)');
  const open = secret.unlocked(), cards = t.cards.map((cd, j) => `<button class="tp-card${j > 1 ? ' w' : ''}${S.card === j && S.pKind === 'card' ? ' on' : ''}" data-act="card" data-n="${j}" aria-label="${esc(cd.n)}">${esc(cd.s)}</button>`).join('');
  const slots = S.slots.map((j, n) => `<button class="tp-slot${S.slotNow === n ? ' now' : ''}" data-act="slot" data-n="${n}">${esc(t.short[j])}</button>`).join('<span class="tp-arr">→</span>');
  const sb = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} tp-b" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  C.innerHTML = `<div class="tp-sec"><div class="tp-cards">${cards}</div></div>
    <div class="tp-sec"><span class="tp-q">${esc(t.pieceT)}</span><div class="tp-slots">${slots}</div>${playBtn('piece', 'piece', t.playPiece, 'btn')}</div>
    <div class="tp-sec">${sb('a', '😲')}${sb('b', '📈')}</div>`;
  if (S.sec === 'a') {
    const s = S.playing ? t.sa.run : S.secEnd ? t.sa.end : t.sa.run;
    lab.setReadout(S.playing ? '🤫' : '😲', t.secrets.a[0], '', '#f0c864'); lab.setState({ emo: S.playing ? '😴' : '😲', title: s[0], lead: s[1], body: '', extra: '' });
  } else if (S.sec === 'b') {
    const s = S.secEnd ? t.sb.end : t.sb.run(Math.max(1, S.round));
    lab.setReadout(`${Math.max(1, S.round)} / 6`, t.secrets.b[0], '', '#f0c864'); lab.setState({ emo: '📈', title: s[0], lead: s[1], body: '', extra: '' });
  } else if (S.pKind === 'piece' || S.slotNow >= 0) {
    lab.setReadout('🎼', t.pieceT, '', '#f0c864'); lab.setState({ emo: '🎼', title: t.pieceT, lead: t.playingPiece, body: '', extra: '' });
  } else if (S.card !== null) {
    const cd = t.cards[S.card];
    lab.setReadout(cd.s, cd.n, '', '#f0c864'); lab.setState({ emo: '📜', title: cd.n, lead: cd.m, body: '', extra: '' });
  } else {
    lab.setReadout('♪', '', '', '#f0c864'); lab.setState({ emo: '📜', title: t.w3[0], lead: t.w3[1], body: '', extra: '' });
  }
  lab.setFacts(t.facts.v3.map((f) => ({ ...f })));
}
render();
</script>
