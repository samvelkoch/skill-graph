// --- controls ------------------------------------------------------------------------------------------------------
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const compOk = (i) => { const c = S.l.comp; if (i === 4) { c.fill(0); c[4] = 1; } else { c[4] = 0; c[i] = c[i] ? 0 : 1; } };
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i, R = S.r, t = T[lang];
  if (a === 'opt') { // i = kind
    if (R.round === 0 && R.firstPick[0] === undefined) R.firstPick[0] = i;
    if (R.tried.length === 0) R.hist[R.round] = i === 2;
    if (i === 2) { R.ok = true; sfx.good(); showStage(); } else { R.tried.push(i); sfx.bad(); }
  } else if (a === 'reply') { R.reply = i; sfx.click(); }
  else if (a === 'next') { R.round++; R.tried = []; R.ok = false; R.reply = null; sfx.click(); }
  else if (a === 'again') { S.r = { round: 0, tried: [], ok: false, reply: null, first: 0, firstPick: S.r.firstPick, hist: [] }; sfx.click(); }
  else if (a === 'comp') { compOk(i); S.l.focus = 0; sfx.tick(); }
  else if (a === 'lpred') { S.l.pred = i; sfx.good(); }
  else if (a === 'start') { S.s.cur = i; sfx.click(); }
  else if (a === 'tag') { const [s, g] = [+b.dataset.s, +b.dataset.g]; if (!S.s.checked[S.s.cur]) { S.s.tags[S.s.cur][s] = g; sfx.tick(); } }
  else if (a === 'check') { S.s.checked[S.s.cur] = true; sfx.good(); showStage(); }
  else if (a === 'snext') { S.s.cur = 1 - S.s.cur; sfx.click(); }
  else if (a === 'sagain') { S.s = { cur: null, tags: [Array(6).fill(null), Array(6).fill(null)], checked: [false, false] }; sfx.click(); }
  else if (a === 'side') { S.st = { side: i === 0 ? 0 : 1, pick: null }; sfx.click(); }
  else if (a === 'spick') { S.st.pick = i; (i === 0 ? sfx.good : sfx.snap)(); showStage(); }
  else if (a === 'sreset') { S.st = { side: null, pick: null }; sfx.click(); }
  else if (a === 'swans') { S.sw.ans = i; (i === 0 ? sfx.click : sfx.snap)(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k;
    if (S.sec === 'steel') S.st = { side: null, pick: null }; if (S.sec === 'swap') S.sw = { ans: null };
    sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const i = ev.target.dataset.sl; if (i === undefined) return;
  S.l.w[+i] = +ev.target.value / 100; S.l.focus = +i; renderL(T[lang], true);
});

// --- render ---------------------------------------------------------------------------------------------------------
function render() {
  document.body.dataset.v = S.sec || lab.view; // the layout follows the view (see the CSS)
  const t = T[lang], mode = S.sec || lab.view;
  show('sR', mode === 'retell'); show('sL', mode === 'lenses'); show('sS', mode === 'speech'); show('sT', mode === 'steel'); show('sP', mode === 'swap');
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('steel', '🛡️') + sc('swap', '🔄');
  ({ retell: renderR, lenses: renderL, speech: renderS, steel: renderT, swap: renderP })[mode](t);
}
const chip = (act, i, txt, cls = '', extra = '') => `<button class="chip rt-chip ${cls}" data-act="${act}" data-i="${i}" ${extra}>${esc(txt)}</button>`;

function renderR(t) {
  const R = S.r, tr = t.r; lab.setGlow('rgba(255,200,90,.26)');
  const hits = R.hist.filter(Boolean).length;
  if (R.round >= 6) {
    $('sR').innerHTML = `<div class="rt-row">${chip('again', 0, tr.again)}</div>`;
    lab.setReadout(`${hits} / 6`, '', '', '#ffc85a'); lab.setState({ emo: '🤝', title: tr.end(hits), lead: tr.endLead, body: '', extra: '' }); lab.setFacts(t.facts.r); return;
  }
  const rd = tr.rounds[R.round], who = WHO[R.round], nm = t.chars[who];
  let h = `<p class="rt-q">${esc(nm)} · ${esc(t.sides[who])} · ${esc(tr.round(R.round + 1, 6))}</p>`;
  if (!R.ok) h += `<p class="rt-q">${esc(tr.pick)}</p><div class="rt-opts">${ORD[R.round].map((k) => chip('opt', k, rd.o[k], R.tried.includes(k) ? 'bad' : '', R.tried.includes(k) ? 'disabled' : '')).join('')}</div>`;
  else {
    h += `<div class="rt-opts">${chip('opt', 2, rd.o[2], 'good', 'disabled')}</div>`;
    h += R.reply === null ? `<p class="rt-q">${esc(tr.replyQ)}</p><div class="rt-opts">${tr.replies.map((x, i) => chip('reply', i, x)).join('')}</div>` : `<p class="rt-q">${esc(tr.nod(nm))}</p><div class="rt-row">${chip('next', 0, tr.next, 'on')}</div>`;
  }
  $('sR').innerHTML = h;
  lab.setReadout(`${R.round + 1} / 6`, '', R.ok ? tr.ok[0] : '', '#ffc85a');
  const last = R.tried[R.tried.length - 1];
  if (R.ok) lab.setState({ emo: '💚', title: tr.ok[0], lead: tr.ok[1], body: '', extra: '' });
  else if (last !== undefined) lab.setState({ emo: '🤔', title: nm, lead: tr.fb[last], body: tr.pick, extra: '' });
  else if (R.round === 0) lab.setState({ emo: '🏝️', title: tr.s0[0], lead: tr.s0[1], body: '', extra: '' });
  else lab.setState({ emo: '🗣️', title: nm, lead: tr.pick, body: '', extra: '' });
  lab.setFacts(t.facts.r);
}

function renderL(t, light) {
  const L = S.l, tl = t.l, shown = L.pred !== null; lab.setGlow('rgba(120,140,255,.28)');
  if (!light) {
    const a = attrs(L.comp);
    const fmt = (v, k) => (k === 'inj' ? v.toFixed(1).replace(/\.0$/, '') : Math.round(v));
    const keys = ['inj', 'min', 'air', 'hrs', 'cost'];
    $('sL').innerHTML = `<div class="rt-lbl">${esc(tl.weigh)}</div>${[0, 1, 2].map((i) => `<div class="rt-sl"><span>${esc(tl.ends[i][0])}</span><input type="range" class="big" min="0" max="100" value="${Math.round(L.w[i] * 100)}" data-sl="${i}" aria-label="${esc(tl.names[i])}"><span>${esc(tl.ends[i][1])}</span></div>`).join('')}
      ${!shown ? `<p class="rt-q">${esc(tl.q)}</p><div class="rt-opts">${tl.ch.map((x, i) => chip('lpred', i, x)).join('')}</div>` : ''}
      <div class="rt-lbl">${esc(tl.none)} → ${esc(tl.mix)}</div><div class="rt-row">${tl.comp.map((x, i) => chip('comp', i, x, L.comp[i] ? 'on' : '')).join('')}</div>
      <table class="rt-tbl"><tr><th></th><th>${esc(tl.cols[0])}</th><th>${esc(tl.cols[1])}</th><th>${esc(tl.mix)}</th></tr>${keys.map((k, j) => `<tr><td>${esc(tl.tbl[j])}</td><td>${fmt(CARS[k], k)}</td><td>${fmt(NONE[k], k)}</td><td><b>${fmt(a[k], k)}</b></td></tr>`).join('')}</table><div class="rt-note">${esc(tl.inv)}</div>`;
  }
  lab.setReadout(shown ? '🔍' : '?', '', '', '#8a9cff');
  if (!shown) lab.setState({ emo: '🔍', title: tl.s0[0], lead: tl.s0[1], body: '', extra: '' });
  else { const ln = leanOf(L.w).map((k) => tl.lean[k]), s = tl.s1(...ln); lab.setState({ emo: ['🌍', '⚖️', '💛'][L.focus], title: s[0], lead: s[1], body: `${tl.ex[L.focus]} ${tl.body}`, extra: '' }); }
  lab.setFacts(t.facts.l);
}

function renderS(t) {
  const Z = S.s, ts = t.s; lab.setGlow('rgba(255,140,120,.26)');
  const n = Z.checked.filter(Boolean).length;
  if (Z.cur === null) {
    $('sS').innerHTML = `<p class="rt-q">${esc(ts.who)}</p><div class="rt-opts">${ts.speeches.map((sp, i) => chip('start', i, `${t.chars[sp.who]} · ${t.sides[sp.who]}`)).join('')}</div>`;
    lab.setReadout('0 / 2', '', '', '#ff8c78'); lab.setState({ emo: '📜', title: ts.s0[0], lead: ts.s0[1], body: '', extra: '' }); lab.setFacts(t.facts.s); return;
  }
  const sp = ts.speeches[Z.cur], tags = Z.tags[Z.cur], chk = Z.checked[Z.cur], all = tags.every((x) => x !== null);
  let h = `<p class="rt-q">${esc(t.chars[sp.who])} · ${esc(t.sides[sp.who])}</p>`;
  sp.s.forEach((sent, i) => {
    const ok = chk && tags[i] === TRUE_TAGS[i];
    h += `<div class="rt-sent ${chk ? (ok ? 'ok' : 'no') : ''}"><div class="tx">${i + 1}. ${esc(sent)}</div><div class="rt-row">${ts.tags.map((x, g) => `<button class="chip rt-tag ${tags[i] === g ? 'on' : ''}" style="${tags[i] === g ? `background:${TAGC[g]};border-color:${TAGC[g]};color:#0a0c14` : ''}" data-act="tag" data-s="${i}" data-g="${g}" ${chk ? 'disabled' : ''}>${ts.tagEmo[g]} ${esc(x)}</button>`).join('')}</div>${chk && !ok ? `<div class="rt-fix">→ ${ts.tagEmo[TRUE_TAGS[i]]} ${esc(ts.tags[TRUE_TAGS[i]])}: ${esc(ts.tagHelp[TRUE_TAGS[i]])}</div>` : ''}</div>`;
  });
  h += chk ? `<div class="rt-row">${n < 2 ? chip('snext', 0, ts.next, 'on') : chip('sagain', 0, ts.again)}</div>` : `<button class="btn rt-go" data-act="check"${all ? '' : ' disabled'}>${esc(ts.check)}</button>`;
  h += `<div class="rt-note">${ts.tags.map((x, g) => `${ts.tagEmo[g]} ${esc(x)} = ${esc(ts.tagHelp[g])}`).join(' · ')}</div>`;
  $('sS').innerHTML = h;
  lab.setReadout(`${n} / 2`, ts.done(n).replace(/:.*$/, ''), '', '#ff8c78');
  lab.setState(chk ? { emo: '🩻', title: ts.s1[0], lead: ts.s1[1], body: '', extra: '' } : { emo: '📜', title: ts.s0[0], lead: ts.s0[1], body: '', extra: '' });
  lab.setFacts(t.facts.s);
}

function renderT(t) {
  const X = S.st, ts = t.st; lab.setGlow('rgba(90,200,170,.26)');
  let h;
  if (X.side === null) h = `<p class="rt-q">${esc(ts.q)}</p><div class="rt-opts">${ts.sides.map((x, i) => chip('side', i, x)).join('')}</div>`;
  else {
    const side = X.side === 0 ? 'no' : 'yes', pts = ts.pts[side];
    h = `<p class="rt-q">${esc(ts.pick)}</p><div class="rt-opts">${pts.map((p, i) => chip('spick', i, (X.pick !== null && i === 0 ? '★ ' : '') + p, X.pick === null ? '' : i === 0 ? 'good' : i === X.pick ? 'bad' : '', X.pick !== null ? 'disabled' : '')).join('')}</div>`;
    if (X.pick !== null) h += `<p class="rt-q">${esc(ts.strong[X.pick === 0 ? 0 : 1])} ${X.pick === 0 ? '' : esc(ts.show)}</p><div class="rt-row">${chip('sreset', 0, ts.again)}</div>`;
  }
  $('sT').innerHTML = h; lab.setReadout('🛡️', '', '', '#5ac8aa');
  lab.setState({ emo: '🛡️', title: ts.s0[0], lead: ts.s0[1], body: '', extra: '' }); lab.setFacts(t.facts.r);
}

function renderP(t) {
  const W_ = S.sw, tw = t.sw, k = S.r.firstPick[0] ?? 0; lab.setGlow('rgba(90,200,200,.26)');
  const txt = t.r.rounds[0].o[k];
  $('sP').innerHTML = `<p class="rt-q">${esc(tw.lead(txt))}</p><p class="rt-q">${esc(tw.q)}</p><div class="rt-opts">${tw.ch.map((x, i) => chip('swans', i, x, W_.ans === i ? 'on' : '')).join('')}</div>${W_.ans !== null ? `<p class="rt-q">${esc(tw.kinds[k])} ${esc(tw.tail)}</p>` : ''}`;
  lab.setReadout('🔄', '', '', '#5ac8c8'); lab.setState({ emo: '🔄', title: tw.s0[0], lead: tw.s0[1], body: '', extra: '' }); lab.setFacts(t.facts.r);
}
render();
</script>
</body>
</html>
