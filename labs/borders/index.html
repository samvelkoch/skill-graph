const DEC = '#e5c97b', CHC = '#e08d84', ATC = '#b9a3d6';
function lakeBase(g, s) {
  const P = fitProj(8.8, 9.95, 47.95, 47.3, s, 0.04), q = (lon, lat) => P(lon, lat);
  landBase(g, s, '#efe6c8', '#d8caa0');
  const fill = (pts, col) => { g.save(); g.globalAlpha = 0.5; g.fillStyle = col; pathPts(g, pts, true); g.fill(); g.restore(); };
  fill([[0, 0], [s, 0], [s, s], [0, s]], DEC);
  const e1 = q(9.8, 47.38), e2 = q(9.95, 47.68), eb = [e1[0] + s * 0.04, s];
  fill([[0, q(8.8, 47.6)[1]], q(9.17, 47.66), q(9.62, 47.5), e1, eb, [0, s]], CHC);
  fill([q(9.62, 47.5), q(9.74, 47.505), q(9.7, 47.55), e2, [s, e2[1]], [s, s], eb, e1], ATC);
  const lake = LAKE.map((p) => q(p[0], p[1]));
  g.save(); g.lineJoin = 'round'; pathPts(g, lake, true); g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 9; g.stroke();
  const lg = g.createLinearGradient(0, 0, s, s); lg.addColorStop(0, '#8cc2e2'); lg.addColorStop(1, '#4f93c4'); g.fillStyle = lg; pathPts(g, lake, true); g.fill();
  g.save(); pathPts(g, lake, true); g.clip(); g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 3; for (let d = -s; d < s * 2; d += 13) { g.beginPath(); g.moveTo(d, 0); g.lineTo(d + s, s); g.stroke(); } g.restore();
  g.strokeStyle = '#3d6f96'; g.lineWidth = 1.6; pathPts(g, lake, true); g.stroke(); g.restore();
}
function drawLake(c, x, y, s, time) {
  const t = T[lang], P = fitProj(8.8, 9.95, 47.95, 47.3, s, 0.04);
  frame(c, x, y, s); c.save(); clipTile(c, x, y, s); c.translate(x, y);
  c.drawImage(cached('lake', s, lakeBase), 0, 0, s, s);
  const K = P(9.17, 47.66), R = P(9.62, 47.5), L = P(9.7, 47.55); // where the three borders meet the water
  borderLine(c, [P(8.8, 47.62), K], s, 1); borderLine(c, [R, P(9.8, 47.38)], s, 1); borderLine(c, [L, P(9.95, 47.68)], s, 1);
  const pulse = 0.5 + 0.5 * Math.sin(time * 3);
  for (const p of [K, R, L]) { c.fillStyle = '#fff'; c.strokeStyle = RED; c.lineWidth = 2; c.beginPath(); c.arc(p[0], p[1], 5 + pulse, 0, TAU); c.fill(); c.stroke(); }
  c.restore(); frameTop(c, x, y, s);
  const box = [x, y, x + s, y + s], mid = P(9.38, 47.6);
  pill(c, '?', x + mid[0], y + mid[1], { box, size: 18, stroke: '#fff' });
  pill(c, t.secrets.lake[1], x + s * 0.5, y + s * 0.07, { box });
  pill(c, 'DE', x + s * 0.2, y + s * 0.2, { box, dot: DEC }); pill(c, 'CH', x + s * 0.3, y + s * 0.84, { box, dot: CHC }); pill(c, 'AT', x + s * 0.86, y + s * 0.72, { box, dot: ATC });
}

// --- the frame loop -----------------------------------------------------------------------------------------
let warned = false;
canvasLoop($('cv'), (c, w, h, dt, time) => {
  try {
    CW = w; CH = h; DPR = window.devicePixelRatio || 1;
    const s = Math.max(120, Math.min(w - 28, h - 28, 620)), x = (w - s) / 2, y = (h - s) / 2, v = lab.view, D = S.d;
    if (D.tween) { // the "show one way" button moves the four points to a solution
      const q = eIO((time - D.tween.t0) / 0.8);
      D.own.forEach((p, i) => { p.x = lerp(D.tween.from[i].x, SOLUTION[i][0], q); p.y = lerp(D.tween.from[i].y, SOLUTION[i][1], q); });
      if (q >= 1) { D.tween = null; render(); }
    }
    if (S.sec === 'baarle') return drawBaarle(c, x, y, s, time);
    if (S.sec === 'lake') return drawLake(c, x, y, s, time);
    if (v === 'kinds') {
      const K = S.k;
      if (K.i >= CARDS.length) { // all six, revealed
        const g = Math.max(8, s * 0.03), ts = (s - 2 * g) / 3;
        CARDS.forEach((cd, i) => drawCard(c, cd, x + (i % 3) * (ts + g), y + s * 0.5 - ts - g / 2 + Math.floor(i / 3) * (ts + g), ts, 1, 1, { small: true }));
        return;
      }
      const r = K.pick === null ? 0 : eOut((time - K.t0) / 0.9);
      drawCard(c, CARDS[K.i], x, y, s, r, lerp(1.55, 1, r));
    } else if (v === 'draw') drawValley(c, x, y, s, time);
    else {
      const C = S.c;
      if (C.i >= 4) {
        const g = Math.max(8, s * 0.03), ts = (s - g) / 2;
        for (let i = 0; i < 4; i++) drawCap(c, i, x + (i % 2) * (ts + g), y + Math.floor(i / 2) * (ts + g), ts, 1, time);
        return;
      }
      drawCap(c, C.i, x, y, s, C.pick === null ? 0 : eOut((time - C.t0) / 0.9), time);
    }
  } catch (e) { if (!warned) { warned = true; console.error(e); } }
});

// --- dragging the four points -------------------------------------------------------------------------------
const cvEl = $('cv');
const localPt = (ev) => { const r = cvEl.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cvEl.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'draw' || S.sec || S.d.line !== 'own' || !G.v) return;
  const [px, py] = localPt(ev), { x, y, s } = G.v; let best = -1, bd = 30;
  S.d.own.forEach((p, i) => { const d = Math.hypot(x + p.x * s - px, y + p.y * s - py); if (d < bd) { bd = d; best = i; } });
  if (best < 0) return;
  S.d.drag = best; S.d.touched = true; S.d.tween = null; cvEl.setPointerCapture(ev.pointerId); sfx.tick(); ev.preventDefault();
});
cvEl.addEventListener('pointermove', (ev) => {
  const D = S.d; if (D.drag === null || !G.v) return;
  const [px, py] = localPt(ev), { x, y, s } = G.v, i = D.drag, o = D.own;
  o[i].x = clamp((px - x) / s, 0.03, 0.97);
  o[i].y = clamp((py - y) / s, i === 0 ? 0.04 : o[i - 1].y + 0.05, i === 3 ? 0.96 : o[i + 1].y - 0.05);
  render();
});
const endDrag = () => { if (S.d.drag !== null) { S.d.drag = null; render(); } };
cvEl.addEventListener('pointerup', endDrag); cvEl.addEventListener('pointercancel', endDrag);

// --- controls -----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k, K = S.k, D = S.d, C = S.c;
  if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === k ? null : k; sfx.click(); }
  else if (a === 'kpick') {
    if (K.pick !== null) return;
    K.pick = k; K.t0 = nowS(); K.res[K.i] = k === CARDS[K.i].kind; (K.res[K.i] ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'knext') { K.i++; K.pick = null; K.t0 = nowS(); sfx.click(); }
  else if (a === 'kagain') { S.k = { i: 0, pick: null, res: [], t0: nowS() }; sfx.click(); }
  else if (a === 'dguess') {
    if (D.guess !== null) return;
    D.guess = k; D.fresh = true; if (k !== 'none') { D.line = k; D.lt0 = nowS(); } (k === 'none' ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'line') { D.fresh = false; D.line = k; D.lt0 = nowS(); sfx.click(); showStage(); }
  else if (a === 'own') { D.fresh = false; D.line = 'own'; sfx.click(); showStage(); }
  else if (a === 'hint') { D.fresh = false; D.line = 'own'; D.tween = { t0: nowS(), from: D.own.map((p) => ({ x: p.x, y: p.y })) }; D.touched = true; sfx.click(); showStage(); }
  else if (a === 'reset') { D.own = [0.15, 0.38, 0.62, 0.85].map((yy) => ({ x: 0.5, y: yy })); D.tween = null; D.solved = false; sfx.click(); }
  else if (a === 'cpick') {
    if (C.pick !== null) return;
    C.pick = +k; C.t0 = nowS(); C.res[C.i] = +k === 1; (C.res[C.i] ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'cnext') { C.i++; C.pick = null; C.t0 = nowS(); sfx.click(); }
  else if (a === 'cagain') { S.c = { i: 0, pick: null, res: [], t0: nowS() }; sfx.click(); }
  render();
});

// --- one render per change: controls, readout, state card ---------------------------------------------------
const fineHtml = (t) => `<div class="fine">${esc(t.fine)}</div>`;
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  cvEl.style.touchAction = v === 'draw' && !S.sec && S.d.line === 'own' ? 'none' : 'pan-y';
  const open = secret.unlocked();
  $('bdSec').innerHTML = [['baarle', '🏠'], ['lake', '🌊']].map(([k, emo]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  lab.setFacts(t.facts[v]);
  if (S.sec) {
    $('bdMain').style.display = 'none';
    lab.setGlow('rgba(224, 166, 58, .22)');
    lab.setReadout(S.sec === 'baarle' ? '🏠' : '🌊', t.secrets[S.sec][1], '', '#e0a63a');
    lab.setState({ emo: S.sec === 'baarle' ? '🏠' : '🌊', title: t.secrets[S.sec][0], lead: S.sec === 'baarle' ? t.secretA : t.secretB, body: '', extra: fineHtml(t) });
    return;
  }
  $('bdMain').style.display = '';
  if (v === 'kinds') renderKinds(t); else if (v === 'draw') renderDraw(t); else renderCaps(t);
}

function renderKinds(t) {
  const K = S.k, done = K.i >= CARDS.length, right = K.res.filter(Boolean).length, cd = CARDS[Math.min(K.i, 5)];
  lab.setGlow('rgba(224, 166, 58, .24)');
  if (done) {
    $('bdMain').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn bd-b" data-act="kagain">${esc(t.again)}</button></div>`;
    lab.setReadout(`${right} / 6`, t.kindsRight, '', '#e0a63a');
    lab.setState({ emo: '🧭', title: t.state.kindsDone[0], lead: t.state.kindsDone[1], body: '', extra: fineHtml(t) });
    return;
  }
  const picked = K.pick !== null;
  $('bdMain').innerHTML = `<div class="bd-q">${esc(t.kindQ)}</div><div class="chips">${['mount', 'river', 'line'].map((k) => `<button class="chip bd-c ${picked ? (k === cd.kind ? 'ok' : k === K.pick ? 'bad' : '') : ''}" data-act="kpick" data-k="${k}"${picked ? ' disabled' : ''}>${esc(t.kinds[k])}</button>`).join('')}</div>
    ${picked ? `<div class="row2"><button class="btn bd-b" data-act="knext">${esc(t.next)}</button></div>` : ''}`;
  lab.setReadout(`${right} / 6`, t.kindsRight, picked ? t.kinds[cd.kind] : '', '#e0a63a');
  if (!picked) lab.setState({ emo: '🧭', title: t.state.kinds0[0], lead: t.state.kinds0[1], body: t.cards[cd.id].name, extra: fineHtml(t) });
  else { const ok = K.res[K.i]; lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notQuite, lead: t.cards[cd.id].note, body: '', extra: fineHtml(t) }); }
}

function resultsHtml(t, key) {
  const R = evalKey(key), col = (n) => (n ? 'bad' : 'good'), who = R.mine === 'W' ? `<span class="bd-dot" style="background:${TEAL}"></span>${esc(t.west)}` : `<span class="bd-dot" style="background:${AMBER}"></span>${esc(t.east)}`;
  return `<div class="bd-panel"><div class="bd-res ${col(R.split.length)}"><span class="ic">✂️</span><span>${esc(t.results.split(R.split.length))}</span></div>
    <div class="bd-res ${col(R.wrong.length)}"><span class="ic">⚠️</span><span>${esc(t.results.wrong(R.wrong.length))}</span></div>
    <div class="bd-res"><span class="ic">💎</span><span>${esc(t.results.mine('\u0000')).replace('\u0000', who)}</span></div></div>`;
}
function renderDraw(t) {
  const D = S.d, asking = D.guess === null;
  lab.setGlow('rgba(47, 165, 154, .24)');
  if (asking) {
    $('bdMain').innerHTML = `<div class="bd-q">${esc(t.drawQ)}</div><div class="chips">${['river', 'ridge', 'straight', 'none'].map((k) => `<button class="chip bd-c" data-act="dguess" data-k="${k}">${esc(t.lineOpts[k])}</button>`).join('')}</div>`;
    lab.setReadout('?', '', '', '#2fa59a');
    lab.setState({ emo: '🏞️', title: t.state.draw0[0], lead: t.state.draw0[1], body: '', extra: fineHtml(t) });
    return;
  }
  const key = D.line, own = key === 'own', res = key ? evalKey(key) : null;
  const chip = (k) => `<button class="chip bd-c ${key === k ? 'on' : ''}" data-act="line" data-k="${k}">${esc(t.lineOpts[k])} <b>${EV[k].n}</b></button>`;
  $('bdMain').innerHTML = `<div class="chips">${['river', 'ridge', 'straight'].map(chip).join('')}<button class="chip bd-c ${own ? 'on' : ''}" data-act="own">${esc(t.own)}</button></div>
    ${own ? `<div class="row2"><button class="chip bd-c" data-act="hint">${esc(t.hint)}</button><button class="chip bd-c" data-act="reset">${esc(t.reset)}</button></div>` : ''}
    ${key ? resultsHtml(t, key) : ''}`;
  if (res) lab.setReadout(t.problems(res.n), t.withLine, own ? t.own : t.lineOpts[key], res.n ? '#e5484d' : '#3ddc97');
  else lab.setReadout('–', '', '', '#2fa59a');
  const ok = D.guess === 'none';
  if (own && res.n === 0) {
    if (!D.solved) { D.solved = true; sfx.good(); }
    lab.setState({ emo: '✅', title: t.state.drawDone[0], lead: t.exDraw, body: t.state.drawDone[1], extra: fineHtml(t) });
  } else if (own) {
    D.solved = false;
    lab.setState({ emo: '✏️', title: t.drawOwn, lead: '', body: '', extra: fineHtml(t) });
  } else if (key) lab.setState(D.fresh ? { emo: '🤔', title: t.notQuite, lead: t.exDrawQ, body: '', extra: fineHtml(t) } : { emo: '🧭', title: t.lineOpts[key], lead: t.exDrawQ, body: '', extra: fineHtml(t) });
  else lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notQuite, lead: t.exDrawQ, body: '', extra: fineHtml(t) });
}

function renderCaps(t) {
  const C = S.c, done = C.i >= 4, right = C.res.filter(Boolean).length;
  lab.setGlow('rgba(217, 130, 95, .24)');
  if (done) {
    $('bdMain').innerHTML = `<div class="row2" style="margin-top:0"><button class="btn bd-b" data-act="cagain">${esc(t.again)}</button></div>`;
    lab.setReadout(`${right} / 4`, t.capsRight, '', '#d9825f');
    lab.setState({ emo: '🏛️', title: t.state.capitalsDone[0], lead: t.state.capitalsDone[1], body: '', extra: fineHtml(t) });
    return;
  }
  const n = C.i + 1, picked = C.pick !== null, opts = t['capOpts' + n], perm = CAP_PERM[C.i];
  $('bdMain').innerHTML = `<div class="bd-q">${esc(t['capQ' + n])}</div><div class="bd-opts">${perm.map((j) => `<button class="chip bd-c ${picked ? (j === 1 ? 'ok' : j === C.pick ? 'bad' : '') : ''}" data-act="cpick" data-k="${j}"${picked ? ' disabled' : ''}>${esc(opts[j])}</button>`).join('')}</div>
    ${picked ? `<div class="row2"><button class="btn bd-b" data-act="cnext">${esc(t.next)}</button></div>` : ''}`;
  lab.setReadout(`${right} / 4`, t.capsRight, picked ? t.cities[C.i] : '', '#d9825f');
  if (!picked) lab.setState({ emo: '🏛️', title: t.state.capitals0[0], lead: t.state.capitals0[1], body: '', extra: fineHtml(t) });
  else { const ok = C.res[C.i]; lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.notQuite, lead: t.exCap['q' + n], body: '', extra: fineHtml(t) }); }
}
render();
</script>
