// coins that fall into a jar through the slot, bounce once and settle in their place
class Fall {
  constructor() { this.list = []; this.onLand = null; }
  add(k, delay = 0) { this.list.push({ k, st: delay > 0 ? 'wait' : 'fall', wait: delay, y: null, vy: 0, age: 0, ph: Math.random() * 6, bn: 0, landed: false }); }
  setCount(n) { // keep exactly the coins 0..n-1: new ones drop in, extra ones lift away
    const have = new Set(this.list.filter((c) => c.st !== 'out').map((c) => c.k));
    let d = 0;
    for (let k = 0; k < n; k++) if (!have.has(k)) this.add(k, d++ * .05 + .01);
    for (const c of this.list) if (c.k >= n && c.st !== 'out') { c.st = 'out'; c.age = 0; }
  }
  update(dt, g, gs) {
    for (const c of this.list) {
      c.age += dt;
      if (c.st === 'wait') { c.wait -= dt; if (c.wait > 0) continue; c.st = 'fall'; c.age = 0; }
      if (c.st === 'fall') {
        const tg = slotPos(c.k, g);
        if (c.y === null) c.y = g.slotY - g.r * 3;
        c.vy += 2600 * gs * dt; c.y += c.vy * dt;
        if (c.y >= tg.y) {
          c.y = tg.y;
          if (!c.landed) { c.landed = true; this.onLand?.(c.k); }
          if (c.bn < 1 && c.vy > 300 * gs) { c.vy = -c.vy * .28; c.bn++; } else { c.st = 'rest'; c.vy = 0; }
        }
      } else if (c.st === 'rest') c.y = slotPos(c.k, g).y;
    }
    this.list = this.list.filter((c) => c.st !== 'out' || c.age < .3);
  }
  one(ctx, g, c) {
    if (c.st === 'wait' || c.y === null) return;
    const tg = slotPos(c.k, g);
    let x = tg.x, y = c.y, sx = 1, a = 1;
    if (c.st === 'fall') {
      const p = clamp01((c.y - g.slotY) / Math.max(1, tg.y - g.slotY));
      x = lerp(g.cx, tg.x, easeOut(p));
      sx = lerp(Math.max(.3, Math.abs(Math.cos(c.age * 10 + c.ph))), 1, p ** 3);
      a = clamp01(c.age / .06);
    } else if (c.st === 'out') { y -= c.age * 40; a = 1 - c.age / .3; }
    drawCoin(ctx, x, y, g.r, sx, a);
  }
  drawIn(ctx, g) { for (const c of this.list) this.one(ctx, g, c); }

    ctx.save(); ctx.beginPath(); ctx.rect(g.cx - g.W, -80, g.W * 2, g.slotY + 80); ctx.clip();
    for (const c of this.list) if (c.st === 'fall' && c.y !== null && c.y < g.slotY + g.r) this.one(ctx, g, c);
    ctx.restore();
  }
}

// --- jar view: the run (weeks of saving) and the two secrets --------------------------------------------------
let J = newJ(), SR = null;
function newJ() {

  j.fall.onLand = () => {
    j.landed++; clink();
    if (j.landed >= GOAL && j.running && !j.done) { j.done = true; j.running = false; runDone(j); }
  };
  return j;
}
function startRun(save, spend, mode, weekDur) {
  J = newJ(); J.mode = mode; J.running = true; J.save = save; J.spend = spend; J.weeks = Math.ceil(GOAL / save); J.weekDur = weekDur;
  let k = 0;
  for (let w = 0; w < J.weeks; w++) {
    const n = Math.min(save, GOAL - k), st = Math.min(.045, weekDur * .8 / Math.max(1, n));
    for (let i = 0; i < n; i++) J.queue.push({ at: w * weekDur + .12 + i * st, kind: 'jar', k: k++ });
    for (let i = 0; i < spend; i++) J.queue.push({ at: w * weekDur + .12 + i * st, kind: 'bag' });

}

function drawPile(ctx, count, cx, base, nb, r) { // a mound of coins, rows fill from the middle
  let left = count, j = 0;
  while (left > 0 && j < nb) {
    const n = nb - j, m = Math.min(n, left), ord = order(n);
    for (let q = 0; q < m; q++) {
      const col = ord[q];
      drawCoin(ctx, cx + (col - (n - 1) / 2) * r * 2.02 + (rnd(j * 61 + col) - .5) * r * .25, base - r - j * r * 1.74, r);
    }
    left -= m; j++;
  }
  return j;
}
function dayScene(ctx, w, h, dt) { // a year of one coin a day

  const p = clamp01(R.clock / D);
  R.count = Math.min(365, Math.round(365 * p ** 1.3));

  const cols = 53, sp = Math.min((w - 28) / cols, 11), dr = sp * .36, gx = (w - sp * cols) / 2 + sp / 2, gy = 24;
  for (let d = 0; d < 365; d++) {
    const x = gx + Math.floor(d / 7) * sp, y = gy + (d % 7) * sp;
    ctx.fillStyle = d < R.count ? '#E9B23A' : 'rgba(255,247,232,.14)';
    ctx.beginPath(); ctx.arc(x, y, dr, 0, Math.PI * 2); ctx.fill();
    if (d < R.count) { ctx.fillStyle = 'rgba(255,240,170,.8)'; ctx.beginPath(); ctx.arc(x - dr * .3, y - dr * .3, dr * .35, 0, Math.PI * 2); ctx.fill(); }

}
function leakScene(ctx, w, h, dt) { // a jar with a hole: 3 coins leave every day

  else {

  }

  const tableTop = h * .8, g = bigJar(w, h, w * .34);

  const hx = lg.cx + lg.W / 2 - 2, hy = lg.bottom - lg.W * .2, space = w - (lg.cx + lg.W / 2);
  const heapCx = lg.cx + lg.W / 2 + space / 2, base = tableTop + 8, maxW = Math.max(60, space - 30);
  const nb = Math.max(4, Math.ceil((Math.sqrt(8 * count + 1) - 1) / 2)), r = Math.min(7, maxW / (nb * 2.04), 140 / (nb * 1.74));
  const N = Math.max(0, GOAL - launched);
  drawJar(ctx, lg, { inner: (c) => { for (let k = 0; k < N; k++) { const q = slotPos(k, lg); drawCoin(c, q.x, q.y, lg.r); } }, label: [[t.secrets.leak[0]], Math.min(lg.bodyTop + 4, slotPos(GOAL - 1, lg).y - lg.r - 36)] });
  ctx.fillStyle = '#1A1026'; ctx.beginPath(); ctx.ellipse(hx, hy, lg.W * .035, lg.W * .055, 0, 0, Math.PI * 2); ctx.fill(); // the hole

  pill(ctx, t.tl[R.ph], heapCx, topY - 54, w, { px: 13, bg: 'rgba(233,178,58,.92)', fg: '#3A2400' });
}

// --- plan view: a coin bar, a basket and the jar for what is left --------------------------------------------
const P = { spentV: 0, fall: new Fall() };
P.fall.onLand = clink;
const planSpent = () => S.p.basket.reduce((s, i) => s + IPRICE[i], 0);
function drawBasket(ctx, cx, bottom, bw, items, t) {

  ctx.save(); ctx.strokeStyle = '#7A4F27'; ctx.lineWidth = 5; ctx.lineCap = 'round';

    ctx.font = `30px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(IEMO[it], 0, 0); ctx.restore();

function planScene(ctx, w, h, dt) {
  const t = T[lang], p = S.p, gs = h / 420, tableTop = h * .8, cw = Math.min(w, 560), ox = (w - cw) / 2, oy = Math.max(0, tableTop - 336) * .45;

  let lx = x0 - 6; // which coins belong to which thing

}

  $('secJar').style.display = v === 'jar' ? '' : 'none';
  $('secPlan').style.display = v === 'plan' ? '' : 'none';
  let asked;
  if (v === 'needs') asked = renderNeeds(t); else if (v === 'jar') asked = renderJar(t); else asked = renderPlan(t);
  const [emo, title, lead, body] = t.st[v][asked ? 1 : 0];
  lab.setState({ emo, title, lead, body, extra: `<div class="fine">${esc(t.fine)}</div>` });
  readout();
}
function renderNeeds(t) {
  const n = S.n, N = t.n;
  if (n.i >= 5) { // summary: what we need, what we want
    const row = (cls, label, list) => `<div class="row"><span class="tagr ${cls}">${esc(label)}</span><span class="ems">${list.map((e) => `<span>${e}</span>`).join('')}</span></div>`;
    needsEl.innerHTML = `<div class="sum">${row('need', N.need, NEMO.map((p, i) => p[NEED[i]]))}${row('want', N.want, NEMO.map((p, i) => p[1 - NEED[i]]))}<p>${esc(N.sum)}</p></div>`;
    $('secNeeds').innerHTML = `<button class="btn" data-act="nagain">${esc(t.again)}</button>`;
    return true;
  }
  const i = n.i, picked = n.pick !== null, need = NEED[i];
  needsEl.innerHTML = `<div class="nq">${esc(N.q)}</div><div class="pair">${[0, 1].map((c) => {
    const kind = c === need ? 'need' : 'want', cls = picked ? kind + (c === n.pick && c !== need ? ' wrongpick' : '') : '';
    return `<button class="icard ${cls}" data-c="${c}" ${picked ? 'disabled' : ''}>${picked ? `<span class="rib ${kind}">${esc(kind === 'need' ? N.need : N.want)}</span>` : ''}<span class="em">${NEMO[i][c]}</span><span class="nm">${esc(N.items[i][c])}</span></button>`;
  }).join('')}</div>`;
  $('secNeeds').innerHTML = picked
    ? `<div class="verd ${n.pick === need ? 'good' : 'bad'}">${esc(n.pick === need ? t.right : t.wrong)}</div><p class="why">${esc(N.why[i])}</p><button class="btn" data-act="nnext">${esc(t.next)}</button>`
    : '';
  return i > 0 || picked;
}
function renderJar(t) {
  const j = S.j, Jt = t.j, open = secret.unlocked();
  $('jarChips').innerHTML = ['day', 'leak'].map((k) => `<button class="chip secret ${open ? 'open' : ''} ${j.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${k === 'day' ? '🐌' : '🕳️'} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  const q = $('jarQ');
  if (j.sec && SR) {
    $('jarFree').hidden = true;
    q.innerHTML = SR.done ? `<p class="why">${esc(j.sec === 'day' ? t.sec.dayText : t.sec.leakText)}</p><button class="btn" data-act="again">${esc(t.again)}</button>` : '';
    return j.a1 !== null;
  }
  const one = j.step === 'q1', ans = one ? j.a1 : j.a2, done = one ? j.d1 : j.d2, ok = one ? 1 : 2, opts = one ? Jt.o1 : Jt.o2;
  q.innerHTML = `<div class="qt">${esc(one ? Jt.q1 : Jt.q2)}</div><div class="qopts">${opts.map((o, i) => {
    let cls = '';
    if (ans !== null) cls = done ? (i === ok ? 'good' : i === ans ? 'bad' : 'dim') : (i === ans ? 'pick' : 'dim');
    return `<button class="ob ${cls}" data-act="ans" data-o="${i}" ${ans !== null ? 'disabled' : ''}>${esc(o)}</button>`;
  }).join('')}</div>${done ? `<div class="verd ${ans === ok ? 'good' : 'bad'}">${esc(ans === ok ? t.right : t.wrong)}</div><p class="why">${esc(one ? Jt.r1 : Jt.r2)}</p>${one ? `<button class="btn" data-act="jnext">${esc(t.next)}</button>` : ''}` : ''}`;
  $('jarFree').hidden = !j.d2;
  $('svLbl').textContent = `${Jt.slider}: ${j.s}`;
  $('sv').value = j.s;
  $('playB').textContent = Jt.play;
  return j.a1 !== null;
}
function renderPlan(t) {
  const p = S.p, B = t.b, over = planSpent() > BUDGET;
  planEl.innerHTML = `<div class="icards">${[0, 1, 2, 3].map((i) => {
    const cls = [p.basket.includes(i) ? 'in' : '', p.bounce === i ? 'bounce' : '', p.ready ? '' : 'locked'].join(' ');
    return `<button class="icard ${cls}" data-i="${i}" style="--ring:${ICOL[i]}"><span class="em">${IEMO[i]}</span><span class="nm">${esc(B.items[i])}</span><span class="tag">${IPRICE[i]} 🪙</span></button>`;
  }).join('')}</div>`;
  const ctrl = $('secPlan');
  if (p.ready) {
    const left = BUDGET - planSpent();
    ctrl.innerHTML = over ? `<p class="note bad">${esc(B.over)}</p>` : left >= 1 && p.basket.length ? `<p class="note good">${esc(B.saved(left))}</p>` : `<p class="note">${esc(B.have)}</p>`;
  } else {
    const ans = p.a, done = p.demo === 'done';
    ctrl.innerHTML = `<div class="qt">${esc(B.q)}</div><div class="qopts">${B.o.map((o, i) => {
      let cls = '';
      if (ans !== null) cls = done ? (i === 1 ? 'good' : i === ans ? 'bad' : 'dim') : (i === ans ? 'pick' : 'dim');
      return `<button class="ob ${cls}" data-act="pans" data-o="${i}" ${ans !== null ? 'disabled' : ''}>${esc(o)}</button>`;
    }).join('')}</div>${done ? `<div class="verd ${ans === 1 ? 'good' : 'bad'}">${esc(ans === 1 ? t.right : t.wrong)}</div><p class="why">${esc(B.r)}</p><button class="btn" data-act="pnext">${esc(t.next)}</button>` : ''}`;
  }
  return p.a !== null;
}
render();
</script>
