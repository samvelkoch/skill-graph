    c.beginPath(); c.moveTo(r.hx + 14, r.top + 8); c.quadraticCurveTo((r.hx + tx) / 2, Math.min(r.top, ty) - 24, tx - 24, ty + 6); c.stroke(); c.restore();
  }
  for (let i = 0; i < 5; i++) {
    const [tx, ty] = tipOf(i), role = S3.picks[i];
    if (role) {
      const ex = story && i === S3.fi && listened ? 'listen' : 'calm';
      bust(c, tx, ty, 20, LOOK[role], { bg: ROLE_BG[role], ex, t: time });
      c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.beginPath(); c.arc(tx, ty, 20, 0, 7); c.stroke();
    } else {
      c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(tx, ty, 20, 0, 7); c.fill();
      c.save(); c.setLineDash([4, 4]); c.strokeStyle = 'rgba(80,60,150,.8)'; c.lineWidth = 2; c.beginPath(); c.arc(tx, ty, 20, 0, 7); c.stroke(); c.restore();
      c.fillStyle = 'rgba(80,60,150,.9)'; c.font = '900 22px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('+', tx, ty + 1);
    }
    blob(c, tx - 17, ty + 17, 8.5, 8.5, '#fff'); c.strokeStyle = '#5b4aa8'; c.lineWidth = 1; c.beginPath(); c.arc(tx - 17, ty + 17, 8.5, 0, 7); c.stroke();
    c.fillStyle = '#2b2360'; c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(i + 1), tx - 17, ty + 18);
    if (story && i === S3.fi) { c.strokeStyle = '#ffd56a'; c.lineWidth = 3; c.beginPath(); c.arc(tx, ty, 25 + Math.sin(time * 5) * 1.5, 0, 7); c.stroke(); }
  }
  if (story) {
    const [tx, ty] = tipOf(S3.fi), txt = S3.fi < S3.busy ? busyText(S3.fi) : t.b.listen;
    bubble(c, tx, ty - 38, txt, tx, ty - 22);
    bubble(c, r.hx + 18, r.top - 16, t.s3.worry, r.hx + 2, r.top + 2);
  }
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  const s = Math.min(w / W, h / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  c.save(); c.translate(ox, oy); c.scale(s, s);
  c.beginPath(); c.roundRect(0, 0, W, H, 18); c.clip();
  stepK(dt);
  const v = lab.view;
  if (v === 'sig') drawSig(c, time); else if (v === 'steps') drawSteps(c, time); else drawHand(c, time);
  c.restore();
});

// --- controls ------------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
const clock = () => performance.now() / 1000;
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.dataset.a, d = b.dataset;
  if (a === 'g') {
    const sit = lab.view === 'sig' ? SIT[S1.i] : sceneSit();
    G[sit.id] = d.g; if (lab.view === 'steps') S2.gateJust = sit.id;
    (guessRight(sit) ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (a === 'next') { if (S1.i < 5) S1.i++; else S1.end = true; sfx.click(); render(true); return; }
  if (a === 'again1') { for (const k in G) delete G[k]; S1.i = 0; S1.end = false; S2.done = { car: [], shop: [] }; S2.msg = null; sfx.click(); render(true); return; }
  if (a === 'scene') { S2.scene = d.k; S2.msg = null; S2.sec = null; sfx.click(); render(true); return; }
  if (a === 'step') {
    const sc = S2.scene, dn = S2.done[sc], exp = ORDER3[dn.length], s = d.s;
    if (s === exp) { dn.push(s); S2.msg = null; S2.gateJust = null; S2.stepAt = clock(); sfx.good(); }
    else { S2.msg = `${dn.length}${s}`; S2.wrongAt = clock(); S2.gateJust = null; sfx.bad(); }
    render(); showStage(); return;
  }
  if (a === 'again2') { S2.done[S2.scene] = []; S2.msg = null; sfx.click(); render(true); return; }
  if (a === 'sec') {
    if (!secret.unlocked()) { secret.open(); return; }
    S2.sec = d.k; S2.pw = { stage: 0, c1: null, c2: null, bad: false, wrongAt: -9 }; S2.ph = { digits: '', result: null }; sfx.click(); render(true); return;
  }
  if (a === 'secoff') { S2.sec = null; sfx.click(); render(true); return; }
  if (a === 'pw') {
    const p = S2.pw;
    if (p.stage === 0) { p.c1 = d.c; sfx.good(); }
    else if (d.c === 'chk') { p.c2 = 'chk'; p.stage = 2; p.bad = false; sfx.good(); }
    else { p.bad = true; p.wrongAt = clock(); sfx.bad(); }
    render(); showStage(); return;
  }
  if (a === 'pwnext') { S2.pw.stage = 1; sfx.click(); render(true); return; }
  if (a === 'pwagain') { S2.pw = { stage: 0, c1: null, c2: null, bad: false, wrongAt: -9 }; sfx.click(); render(true); return; }
  if (a === 'key') { S2.ph.result = null; if (S2.ph.digits.length < 6) S2.ph.digits += d.d; sfx.tick(); render(); return; }
  if (a === 'clr') { S2.ph = { digits: '', result: null }; sfx.click(); render(); return; }
  if (a === 'call') { if (!S2.ph.digits) return; S2.ph.result = S2.ph.digits === '112' ? 'ok' : 'wrong'; (S2.ph.result === 'ok' ? sfx.good : sfx.bad)(); render(); showStage(); return; }
  if (a === 'role') {
    const i = S3.picks.indexOf(d.r);
    if (i >= 0) S3.picks.splice(i, 1); else if (S3.picks.length < 5) S3.picks.push(d.r); else { sfx.bad(); return; }
    sfx.tick(); render(); return;
  }
  const startStory = () => { S3.phase = 'story'; S3.busy = Math.min(S3.busy, S3.picks.length - 1); S3.fi = 0; S3.aw = 'predict'; S3.predicted = null; S3.reveal = null; };
  if (a === 'start') { startStory(); sfx.click(); render(); showStage(); return; }
  if (a === 'pred') {
    S3.predicted = d.p; S3.reveal = { right: d.p === '1' }; S3.fi = 1; S3.aw = S3.fi < S3.busy ? 'next' : 'done';
    (S3.reveal.right ? sfx.good : sfx.bad)(); render(); showStage(); return;
  }
  if (a === 'nextf') { S3.fi++; S3.reveal = null; S3.aw = S3.fi < S3.busy ? 'next' : 'done'; sfx.click(); render(); showStage(); return; }
  if (a === 'busy') { S3.busy = +d.n; startStory(); sfx.click(); render(); return; }
  if (a === 'replay') { startStory(); sfx.click(); render(); return; }
  if (a === 'back') { S3.phase = 'pick'; sfx.click(); render(); }
});

// --- one render per change: controls, readout and the state card -------------------------------------------------------------
function render(snap) {
  const v = lab.view;
  $('s1').hidden = v !== 'sig'; $('s2').hidden = v !== 'steps'; $('s3').hidden = v !== 'hand';
  if (v === 'sig') renderSig(); else if (v === 'steps') renderSteps(); else renderHand();
  K.tx = targetX(); if (snap) K.x = K.tx;
}
const legend = (sit, t) => `<div>${esc(t.s1.list)}</div><div class="ng-leg">${sit.signs.map((k) => `<span>${SIGN_EMO[k]} ${esc(t.sign[k])}</span>`).join('')}</div>`;
const guessBtns = (u) => `<div class="ng-two"><button class="ng-big" data-a="g" data-g="safe">${esc(u.safe)}</button><button class="ng-big" data-a="g" data-g="warn">${esc(u.warn)}</button></div>`;

function renderSig() {
  const t = T[lang], u = t.s1, fun = `<div class="ng-fine" style="margin-top:8px">${esc(t.fun)}</div>`;
  lab.setGlow('rgba(63, 182, 168, .26)');
  const k = SIT.filter((x) => G[x.id] !== undefined && guessRight(x)).length;
  if (S1.end) {
    $('s1').innerHTML = `<div class="ng-one"><button class="ng-big pri" data-a="again1">${esc(u.again)}</button></div>`;
    lab.setReadout(`${k}/6`, '●'.repeat(6), '', COL.sig);
    lab.setState({ emo: '🏆', title: u.end(k), lead: u.endLead, body: u.endBody, extra: fun });
    lab.setFacts([{ emo: '💡', text: t.facts.a, src: SRC.birch }, { emo: '🌱', text: t.facts.b, src: SRC.cyc }]);
    return;
  }
  const sit = SIT[S1.i], tx = t.sit[sit.id], g = G[sit.id], shown = g !== undefined;
  const dots = SIT.map((x, j) => (G[x.id] !== undefined ? '●' : j === S1.i ? '◉' : '○')).join(' ');
  lab.setReadout(`${S1.i + 1}/6`, dots, shown ? (sit.warn ? '⚠️' : '😊') : '', COL.sig);
  if (!shown) {
    $('s1').innerHTML = guessBtns(u);
    lab.setState({ emo: '🤔', title: u.q, lead: tx.q, body: u.tap, extra: '' }); lab.setFacts([]);
    return;
  }
  const right = guessRight(sit);
  $('s1').innerHTML = `<div class="ng-one"><button class="ng-big pri" data-a="next">${esc(S1.i < 5 ? u.next : u.fin)}</button></div>`;
  lab.setState({ emo: right ? '✅' : '🤔', title: right ? t.right : t.notYet, lead: right ? tx.a : (sit.warn ? u.missWarn : u.missSafe),
    body: right ? '' : `${tx.a}${sit.warn ? ' ' + u.diff : ''}`, extra: (sit.warn ? legend(sit, t) : '') + fun });
  lab.setFacts([{ emo: '💡', text: t.facts.a, src: SRC.birch }, { emo: '🌱', text: t.facts.b, src: SRC.cyc }]);
}

function renderSteps() {
  const t = T[lang], u = t.s2;
  if (S2.sec === 'pw') return renderPw(t);
  if (S2.sec === 'ph') return renderPhone(t);
  lab.setGlow('rgba(240, 166, 74, .26)');
  const sc = S2.scene, dn = S2.done[sc], sit = sceneSit(), tx = t.sit[sit.id], gated = G[sit.id] === undefined, un = secret.unlocked();
  const sec = (k, emo) => `<button class="chip secret ${un ? 'open' : ''}" data-a="sec" data-k="${k}">${un ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  const chips = `<div class="chips"><button class="chip ${sc === 'car' ? 'on' : ''}" data-a="scene" data-k="car">${esc(u.car)}</button><button class="chip ${sc === 'shop' ? 'on' : ''}" data-a="scene" data-k="shop">${esc(u.shop)}</button>${sec('pw', '🛡️')}${sec('ph', '📞')}</div>`;
  lab.setReadout(gated ? '?' : `${dn.length}/3`, sc === 'car' ? u.car : u.shop, dn.length === 3 ? `✓ ${u.safeAdult}` : '', COL.steps);
  if (gated) {
    $('s2').innerHTML = `${chips}<div class="ng-row">${guessBtns(t.s1).replace('class="ng-two"', 'class="ng-two" style="width:100%"')}</div>`;
    lab.setState({ emo: '🤔', title: u.gateT, lead: tx.q, body: u.gateB, extra: '' }); lab.setFacts([]);
    return;
  }
  const rbs = BTN_ORDER.map((s) => `<button class="ng-rb ${dn.includes(s) ? 'done' : ''}" data-a="step" data-s="${s}" ${dn.includes(s) ? 'disabled' : ''}><span class="e">${dn.includes(s) ? '✓' : STEP_EMO[s]}</span>${esc(u[s])}</button>`).join('');
  $('s2').innerHTML = `${chips}<div class="ng-row"><div class="ng-rbs" style="width:100%">${rbs}</div></div>${dn.length === 3 ? `<div class="ng-row"><button class="ng-big pri" data-a="again2">${esc(u.again)}</button></div>` : ''}`;
  const lastStep = dn[dn.length - 1], leg = sit.warn ? legend(sit, t) : '';
  let st;
  if (S2.msg) st = { emo: '🤔', title: u.notYet ?? t.notYet, lead: u.why[sc][S2.msg], body: '', extra: leg };
  else if (dn.length === 3) st = { emo: '🛡️', title: u.doneT, lead: u.doneL, body: u.doneB, extra: leg };
  else if (dn.length > 0) st = { emo: STEP_EMO[lastStep], title: t.right, lead: u.step[sc][lastStep], body: '', extra: leg };
  else if (S2.gateJust === sit.id) {
    const right = guessRight(sit);
    st = { emo: right ? '✅' : '🤔', title: right ? t.right : t.notYet, lead: right ? tx.a : (sit.warn ? t.s1.missWarn : t.s1.missSafe), body: u.promptB, extra: leg };
  } else st = { emo: '👣', title: u.promptT, lead: tx.q, body: u.promptB, extra: leg };
  lab.setState(st);
  lab.setFacts([{ emo: '💡', text: t.facts.nspcc, src: SRC.nspcc }]);
}
function renderPw(t) {
  const p = S2.pw, q = t.pw;
  lab.setGlow('rgba(240, 166, 74, .26)');
  const back = `<div class="chips"><button class="chip" data-a="secoff">${esc(q.back)}</button></div>`;
  let ctrl, st;
  if (p.stage === 0 && p.c1 === null) {
    ctrl = `<div class="ng-one"><button class="ng-big" data-a="pw" data-c="with">${esc(q.with1)}</button><button class="ng-big" data-a="pw" data-c="chk">${esc(q.chk)}</button></div>`;
    st = { emo: '🛡️', title: q.introT, lead: q.v1, body: q.introL };
  } else if (p.stage === 0) {
    ctrl = `<div class="ng-one"><button class="ng-big pri" data-a="pwnext">${esc(q.next)}</button></div>`;
    st = { emo: '✅', title: t.right, lead: p.c1 === 'with' ? q.r1 : q.r1c, body: '' };
  } else if (p.stage === 1) {
    ctrl = `<div class="ng-one"><button class="ng-big" data-a="pw" data-c="with">${esc(q.with2)}</button><button class="ng-big" data-a="pw" data-c="chk">${esc(q.chk2)}</button></div>`;
    st = p.bad ? { emo: '🤔', title: t.notYet, lead: q.r2w, body: '' } : { emo: '🛡️', title: q.introT, lead: q.v2, body: '' };
  } else {
    ctrl = `<div class="ng-one"><button class="ng-big pri" data-a="pwagain">${esc(q.again)}</button></div>`;
    st = { emo: '🛡️', title: q.doneT, lead: q.r2, body: q.doneL };
  }
  $('s2').innerHTML = `${back}<div class="ng-row">${ctrl.replace('class="ng-one"', 'class="ng-one" style="width:100%"')}</div>`;
  lab.setReadout(p.stage === 2 ? '2/2' : `${p.stage + 1}/2`, t.secrets.pw[0], p.stage === 2 ? `✓ ${t.s2.safeAdult}` : '', COL.steps);
  lab.setState({ ...st, extra: '' });
  lab.setFacts([{ emo: '💡', text: t.facts.kp1, src: SRC.kp }, { emo: '📋', text: t.facts.kp2, src: SRC.kp }]);
}
function renderPhone(t) {
  const q = t.ph, ph = S2.ph;
  lab.setGlow('rgba(240, 166, 74, .26)');
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((k) => `<button data-a="key" data-d="${k}">${k}</button>`).join('')
    + '<button class="clr" data-a="clr" aria-label="clear">⌫</button><button data-a="key" data-d="0">0</button><button class="call" data-a="call" aria-label="call">📞</button>';
  $('s2').innerHTML = `<div class="chips"><button class="chip" data-a="secoff">${esc(q.back)}</button></div><div class="ng-pad">${keys}</div>`;
  lab.setReadout(ph.digits || '—', q.simple, ph.result === 'ok' ? '✓' : '', COL.steps);
  lab.setState(ph.result === 'ok' ? { emo: '📞', title: q.okT, lead: q.okL, body: '', extra: '' }
    : ph.result === 'wrong' ? { emo: '🤔', title: q.wrongT, lead: q.wrongL, body: '', extra: '' } : { emo: '📞', title: q.introT, lead: q.introL, body: '', extra: '' });
  lab.setFacts([{ emo: '💡', text: t.facts.p112a, src: SRC.w112 }, { emo: '📱', text: t.facts.p112b, src: SRC.w112 }, { emo: '🌍', text: t.facts.p112c, src: SRC.w112ru }]);
}

function paintPickers() {
  document.querySelectorAll('.ng-p canvas').forEach((cv) => {
    const r = cv.dataset.r, g = cv.getContext('2d');
    g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, 44, 44);
    bust(g, 22, 22, 21, LOOK[r], { bg: ROLE_BG[r], ex: 'calm' });
  });
}
function renderHand() {
  const t = T[lang], q = t.s3, n = S3.picks.length;
  lab.setGlow('rgba(154, 134, 224, .28)');
  const facts = [{ emo: '🖐️', text: t.facts.net, src: SRC.birch }];
  if (S3.phase === 'pick') {
    const pick = ROLE_IDS.map((r) => { const i = S3.picks.indexOf(r);
      return `<button class="ng-p ${i >= 0 ? 'on' : ''}" data-a="role" data-r="${r}"><canvas width="88" height="88" data-r="${r}"></canvas>${esc(q.role[r])}${i >= 0 ? `<i>${i + 1}</i>` : ''}</button>`; }).join('');
    $('s3').innerHTML = `<div class="ng-pick">${pick}</div><div class="ng-row"><button class="ng-big pri" style="width:100%" data-a="start" ${n < 2 ? 'disabled' : ''}>${esc(q.start)}</button></div>`;
    paintPickers();
    lab.setReadout(`${n}/5`, q.fingers, '', COL.hand);
    lab.setState({ emo: '🖐️', title: q.pickT, lead: q.pickL, body: q.pickB, extra: '' });
    lab.setFacts(facts);
    return;
  }
  const maxB = Math.min(3, n - 1), chips = [1, 2, 3].filter((x) => x <= maxB).map((x) => `<button class="chip ${S3.busy === x ? 'on' : ''}" data-a="busy" data-n="${x}">${x}</button>`).join('');
  const top = `<div class="ng-row first"><span class="ng-lbl">${esc(q.busyChip)}</span>${chips}<button class="chip" data-a="back">${esc(q.back)}</button></div>`;
  let ctrl;
  if (S3.aw === 'predict') ctrl = `<div class="ng-one"><button class="ng-big" data-a="pred" data-p="1">${esc(q.p1)}</button><button class="ng-big" data-a="pred" data-p="2">${esc(q.p2)}</button><button class="ng-big" data-a="pred" data-p="3">${esc(q.p3)}</button></div>`;
  else if (S3.aw === 'next') ctrl = `<div class="ng-one"><button class="ng-big pri" data-a="nextf">${esc(q.nextF)}</button></div>`;
  else ctrl = `<div class="ng-one"><button class="ng-big pri" data-a="replay">${esc(q.replay)}</button></div>`;
  $('s3').innerHTML = `${top}<div class="ng-row">${ctrl.replace('class="ng-one"', 'class="ng-one" style="width:100%"')}</div>`;
  lab.setReadout(`${S3.fi + 1}/${n}`, q.fingers, S3.aw === 'done' ? '✓' : '', COL.hand);
  let st;
  if (S3.aw === 'predict') st = { emo: '🤔', title: q.busyT(1), lead: q.busyL, body: '', extra: '' };
  else if (S3.reveal) {
    const nxt = S3.aw === 'done' ? `${q.listenT(S3.fi + 1)} ${q.listenL}` : `${q.busy2T(S3.fi + 1)} ${q.busy2L}`;
    st = S3.reveal.right ? { emo: '✅', title: t.right, lead: q.rightL, body: nxt, extra: '' } : { emo: '🤔', title: t.notYet, lead: q.wrongL, body: `${q.wrongB} ${nxt}`, extra: '' };
  } else if (S3.aw === 'next') st = { emo: '🤔', title: q.busy2T(S3.fi + 1), lead: q.busy2L, body: '', extra: '' };
  else st = { emo: '🤗', title: q.listenT(S3.fi + 1), lead: q.listenL, body: q.listenB, extra: '' };
  lab.setState(st);
  if (S3.predicted !== null) facts.push({ emo: '🔁', text: t.facts.pers, src: SRC.ffs });
  lab.setFacts(facts);
}
render(true);
</script>
