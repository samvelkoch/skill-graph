  document.body.dataset.v = S.sec || v;
  $('sec_hunt').style.display = !S.sec && v === 'hunt' ? '' : 'none';
  $('sec_huddle').style.display = !S.sec && v === 'huddle' ? '' : 'none';
  $('sec_share').style.display = !S.sec && v === 'share' ? '' : 'none';
  $('sec_sec').style.display = S.sec ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('ox', '🐂') + sc('star', '🐦');
  if (S.sec) renderSecret(t); else if (v === 'hunt') renderHunt(t); else if (v === 'huddle') renderHuddle(t); else renderShare(t);
}
function renderSecret(t) {
  const k = S.sec, s = t[k];
  lab.setGlow(k === 'ox' ? 'rgba(160,190,220,.3)' : 'rgba(242,166,90,.3)');
  if (k === 'ox') {
    const ring = OX.mode === 'defend';
    $('secBody').innerHTML = `<p class="sh-note">${esc(s.note)}</p>${ring ? `<div class="sh-row"><button class="chip" data-act="oxleave">${esc(s.leave)}</button></div>` : ''}`;
    lab.setReadout('12', s.sub, t.simple, '#a9c4dc');
    lab.setState({ emo: '🐂', title: ring ? s.ringT : s.t, lead: ring ? s.ringL : s.l, body: '', extra: '' });
    lab.setFacts(t.facts.ox);
  } else {
    $('secBody').innerHTML = `<p class="sh-note">${esc(s.note)}</p>`;
    lab.setReadout('7', s.sub, t.simple, '#f2a65a');
    lab.setState({ emo: '🐦', title: s.t, lead: s.l, body: '', extra: '' });
    lab.setFacts(t.facts.star);
  }
}
function renderHunt(t) {
  const hs = S.hunt, h = t.hunt, ph = hs.phase;
  lab.setGlow('rgba(63,182,201,.26)');
  const tm = (r) => (r.esc ? `> 20 ${t.sec}` : `${numf(r.t)} ${t.sec}`);
  let ctl = '', st;
  if (ph === 'guess') {
    ctl = `<p class="sh-q">${esc(h.q)}</p><div class="sh-row">${['lone', 'shoal', 'same'].map((k) => `<button class="sh-opt" data-act="hguess" data-k="${k}">${esc(h.opts[k])}</button>`).join('')}</div>`;
    st = { emo: '🤔', title: h.q, lead: h.askLead, body: '' };
  } else if (ph === 'ready') {
    ctl = `<div class="sh-row"><button class="btn sh-go" data-act="hgo" data-r="A">${esc(h.goA)}</button></div>`;
    st = { emo: '🎯', title: h.readyT, lead: h.readyL, body: '' };
  } else if (ph === 'A') {
    ctl = `<p class="sh-note">${esc(h.tapHint)}</p>`;
    st = { emo: '🎯', title: h.tapA, lead: h.tapAL, body: '' };
  } else if (ph === 'Adone') {
    ctl = `<div class="sh-row"><button class="btn sh-go" data-act="hgo" data-r="B">${esc(h.goB)}</button></div>`;
    st = { emo: '🎯', title: hs.rA.esc ? h.aEsc : h.aDone, lead: h.rDoneL(t.rl[0], tm(hs.rA), hs.rA.miss), body: h.afterA };
  } else if (ph === 'B') {
    ctl = `<div class="sh-row"><p class="sh-note" style="flex:1">${esc(h.tapHint)}</p><button class="chip" data-act="hhint">${esc(h.hint)}</button></div>`;
    st = { emo: '🎯', title: h.tapB, lead: h.tapBL, body: '' };
  } else {
    ctl = `<div class="sh-row"><button class="btn sh-go" data-act="hagain">${esc(h.again)}</button></div>`;
    const a = hs.rA, b = hs.rB, ta = a.t, tb = b.t, easier = tb > ta + 0.5 ? 'harder' : tb < ta - 0.5 ? 'easier' : 'same';
    const ok = (hs.guess === 'lone' && easier === 'harder') || (hs.guess === 'shoal' && easier === 'easier') || (hs.guess === 'same' && easier === 'same');
    st = { emo: ok ? '✅' : '🤔', title: ok ? h.right : h.no, lead: `${h.data(tm(a), tm(b))} ${h[easier]}`, body: h.why };
  }
  $('hBody').innerHTML = ctl;
  lab.setState({ ...st, extra: '' });
  lab.setFacts(ph === 'done' ? t.facts.hunt : t.facts.huntPre);
  huntReadout(t);
}
function renderHuddle(t) {
  const hd = S.hud, h = t.hud, occ = occSet(), sel = hd.sel === null ? null : peng[hd.sel], n = sel ? nbCount(sel, occ) : 0;
  lab.setGlow('rgba(142,197,255,.28)');
  if (hd.guess === null) {
    $('hdBody').innerHTML = `<p class="sh-q">${esc(h.q)}</p><p class="sh-note">${esc(h.tapNote)}</p>`;
    lab.setReadout('?', '', '', '#8ec5ff');
    lab.setState({ emo: '🤔', title: h.q, lead: h.askL, body: '', extra: '' });
    lab.setFacts(t.facts.hudPre);
    return;
  }
  $('hdBody').innerHTML = `<div class="sh-row"><button class="btn sh-go" data-act="hshuf">${esc(h.shuffle)}</button><button class="chip" data-act="hrun">${esc(hd.run ? h.pause : h.run)}</button></div>`;
  lab.setReadout(`${n}/6`, h.sub, t.simple, '#8ec5ff');
  const fine = `<div class="fine">${esc(h.legend)} (${esc(t.simple)})</div>`;
  const gn = nbCount(peng[hd.guess], occ);
  let st;
  if (hd.note === 'verdict') st = gn === 6 ? { emo: '✅', title: h.right, lead: h.rightL, body: h.selL } : { emo: '🤔', title: h.no, lead: h.noL(gn), body: h.selL };
  else if (hd.note === 'shuf') st = { emo: '🌬️', title: h.shufT, lead: h.shufL, body: h.shufB(hd.shuffles) };
  else st = { emo: '🐧', title: h.selT(n), lead: h.selL, body: hd.shuffles ? h.shufB(hd.shuffles) : '' };
  lab.setState({ ...st, extra: fine });
  lab.setFacts(t.facts.hud);
}
function renderShare(t) {
  const sh = S.shr, h = t.shr, n = sh.n, x = 12 / n, xs = numf(x, Number.isInteger(x) ? 0 : 1), eq = Math.abs(x * 10 - Math.round(x * 10)) < 1e-9 ? '=' : '≈';
  lab.setGlow('rgba(240,138,93,.26)');
  const ready = sh.b !== null && sh.c !== null;
  $('shAsk').style.display = sh.done ? 'none' : '';
  $('shPlay').style.display = sh.done ? '' : 'none';
  if (!sh.done) {
    const opt = (q, j, label, on) => `<button class="sh-opt ${on ? 'on' : ''}" data-act="sopt" data-q="${q}" data-j="${j}">${esc(label)}</button>`;
    $('shAsk').innerHTML = `<p class="sh-q2">${esc(h.q1)}</p><div class="sh-row">${h.o1.map((o, j) => opt('b', j, o, sh.b === j)).join('')}</div>
      <p class="sh-q2">${esc(h.q2)}</p><div class="sh-row">${h.o2.map((o, j) => opt('c', j, h.chance(o), sh.c === j)).join('')}</div>
      <div class="sh-row"><button class="btn sh-go" data-act="sshow"${ready ? '' : ' disabled'}>${esc(h.show)}</button></div>`;
    lab.setReadout('?', '', '', '#f08a5d');
    lab.setState({ emo: '🤔', title: h.askT, lead: h.askL, body: '', extra: '' });
    lab.setFacts([]);
    return;
  }
  $('shLbl').textContent = h.flock; $('shNum').textContent = n; if (+$('shSl').value !== n) $('shSl').value = n;
  $('shHawk').textContent = h.attack; $('shHawk').disabled = !!sh.atk;
  lab.setReadout(`12 ÷ ${n} ${eq} ${xs}`, h.sub, h.pill(n), '#f08a5d');
  let st;
  if (sh.note === 'verdict') {
    const ok = sh.b === h.ok1 && sh.c === h.ok2;
    st = { emo: ok ? '✅' : '🤔', title: ok ? h.right : h.no, lead: h.res, body: h.after };
  } else if (n === 1) st = { emo: '🐦', title: h.n1T, lead: h.n1L, body: h.body };
  else st = { emo: '🐦', title: h.stT(n), lead: h.stL(xs, n), body: h.body };
  const extra = `${sh.att ? `<div class="fine"><b>${esc(h.tally(sh.att, sh.you))}</b></div>` : ''}<div class="fine">${esc(h.model)}</div>`;
  lab.setState({ ...st, extra });
  lab.setFacts(t.facts.shr);
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  V.w = w; V.h = h;
  if (S.sec === 'ox') drawOx(c, w, h, dt, time);
  else if (S.sec === 'star') drawStar(c, w, h, dt, time);
  else if (lab.view === 'hunt') drawHunt(c, w, h, dt, time);
  else if (lab.view === 'huddle') drawHuddle(c, w, h, dt, time);
  else drawShare(c, w, h, dt, time);
});
render();
</script>
</body>
</html>
