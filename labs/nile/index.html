const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => { const t = clamp01(x); return t < .5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t); };
const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeBack = (x) => { const t = clamp01(x), c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const now = () => performance.now() / 1000;
const rgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mixc = (a, b, t) => { const p = rgb(a), q = rgb(b); return `rgb(${p.map((v, i) => Math.round(v + (q[i] - v) * t)).join(',')})`; };

// a dark rounded label that stays inside the canvas
function pill(c, text, x, y, o = {}) {
  const { align = 'center', size = 12, bg = 'rgba(10,12,20,.8)', fg = '#fff', alpha = 1 } = o;
  c.save(); c.globalAlpha = alpha; c.font = `800 ${size}px Nunito, sans-serif`; c.textBaseline = 'middle'; c.textAlign = 'left';
  const pw = c.measureText(text).width + 16, ph = size + 10;
  let X = align === 'left' ? x : align === 'right' ? x - pw : x - pw / 2;
  X = clamp(X, 4, Math.max(4, CW - pw - 4));
  const Y = clamp(y - ph / 2, 4, Math.max(4, CH - ph - 4));
  c.fillStyle = bg; c.beginPath(); c.roundRect(X, Y, pw, ph, ph / 2); c.fill();
  c.fillStyle = fg; c.fillText(text, X + 8, Y + ph / 2 + 1);
  c.restore();
}

function palm(c, x, y, H, lean, time, ph = 0) {
  const topx = x + lean, topy = y - H, cx = x + lean * .1, cy = y - H * .55;
  c.save(); c.lineCap = 'round'; c.globalAlpha = 1;
  c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(cx, cy, topx, topy);
  c.strokeStyle = '#5A3B1F'; c.lineWidth = Math.max(3, H * .07) + 1.5; c.stroke();
  c.strokeStyle = C.wood; c.lineWidth = Math.max(3, H * .07); c.stroke();
  c.strokeStyle = 'rgba(60,35,15,.45)'; c.lineWidth = 1;
  for (let i = 1; i < 7; i++) {
    const t = i / 7.2, qx = (1 - t) * (1 - t) * x + 2 * (1 - t) * t * cx + t * t * topx, qy = (1 - t) * (1 - t) * y + 2 * (1 - t) * t * cy + t * t * topy, hw = Math.max(1.5, H * .033);
    c.beginPath(); c.moveTo(qx - hw, qy); c.lineTo(qx + hw, qy - 1.5); c.stroke();
  }
  const L = H * .5;
  [-1.75, -1.2, -.65, -.1, .45, 1.0, 1.55].forEach((a, i) => {
    const aa = a + Math.sin(time * 1.3 + ph + i) * .05, s = Math.sin(aa);
    const tx = topx + s * L, ty = topy - Math.cos(aa) * L * .5 + .38 * L * s * s;
    const mx = (topx + tx) / 2, my = (topy + ty) / 2 - L * .12, nx = -(ty - topy), ny = tx - topx, k = (L * .16) / (Math.hypot(nx, ny) || 1);
    c.fillStyle = i % 2 ? '#4C9A52' : C.green; c.strokeStyle = '#2F6B36'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(topx, topy); c.quadraticCurveTo(mx + nx * k, my + ny * k, tx, ty); c.quadraticCurveTo(mx - nx * k * .5, my - ny * k * .5, topx, topy); c.fill(); c.stroke();
  });
  c.fillStyle = '#5A3B1F';
  [[-.03, .02], [.03, .03], [0, .05]].forEach(([dx, dy]) => { c.beginPath(); c.arc(topx + dx * H, topy + dy * H, Math.max(1.5, H * .022), 0, TAU); c.fill(); });
  c.restore();
}

  c.fillStyle = 'rgba(40,20,5,.28)'; c.beginPath(); c.ellipse(x + wd * .1, y + 1, wd * .62, Math.max(1, wd * .09), 0, 0, TAU); c.fill();
  const x0 = x - wd / 2, gr = c.createLinearGradient(x0, 0, x0 + wd, 0);

  c.fillStyle = gr; c.strokeStyle = '#7A5530'; c.lineWidth = 1.5;

  c.strokeStyle = 'rgba(90,55,25,.25)'; c.lineWidth = 1; c.beginPath();
  for (let k = 1; k < 4; k++) { c.moveTo(x0, y - ht * k / 4); c.lineTo(x0 + wd, y - ht * k / 4); }

  c.fillStyle = '#D6AC72'; c.strokeStyle = '#7A5530'; c.lineWidth = 1.5;
  c.beginPath(); c.roundRect(x0 - wd * .06, y - ht - ht * .13, wd * 1.12, ht * .16, 2); c.fill(); c.stroke();
  c.fillStyle = '#3F2C1D'; c.beginPath(); c.roundRect(x - wd * .12, y - ht * .56, wd * .24, ht * .56, [wd * .12, wd * .12, 0, 0]); c.fill();

  c.restore();
}

function person(c, x, y, s, o = {}) {

  if (B.auto === 1 && B.x <= xl + .004) { B.sailUp = false; B.auto = 2; render(); }
  if (B.auto === 2 && B.x >= xr - .004) { B.auto = 3; render(); }
  B.sailT += clamp((B.sailUp ? 1 : 0) - B.sailT, -dt * 1.4, dt * 1.4);
  B.windT += clamp((act ? 1 : 0) - B.windT, -dt * 1.2, dt * 1.2);
  const vt = !act ? 0 : B.sailUp ? -.10 * smooth(.4, .9, B.sailT) : .09 * smooth(.4, .9, 1 - B.sailT);
  B.v += (vt - B.v) * Math.min(1, dt * 2.2);

const SH_DUR = 5;

  if (tt < .9) return { a: lerp(a0, .5, ease(tt / .9)), sw: 1, fill: 0, tilt: 0 };
  if (tt < 1.4) return { a: .5, sw: 1, fill: ease((tt - .9) / .5), tilt: 0 };
  if (tt < 2.8) return { a: lerp(.5, -.25, ease((tt - 1.4) / 1.4)), sw: lerp(1, .5, smooth(1.9, 2.8, tt)), fill: 1, tilt: 0 };
  if (tt < 3.8) return { a: -.25, sw: .5, fill: 1 - smooth(3.1, 3.7, tt), tilt: 1.25 * ease((tt - 2.8) / .5) };
  return { a: lerp(-.25, a0, ease((tt - 3.9) / 1.1)), sw: lerp(.5, 1, smooth(3.9, 4.7, tt)), fill: 0, tilt: 1.25 * (1 - smooth(3.8, 4.2, tt)) };
}

// --- the canvas loop: one scene per view ------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  c.lineJoin = 'miter'; c.lineCap = 'butt'; c.setLineDash([]); c.globalAlpha = 1;
  const v = lab.view;
  if (v === 'above') {
    if (S.sec === 'shaduf') drawShaduf(c, w, h, dt, time);
    else if (S.sec === 'nilometer') drawNilometer(c, w, h, dt, time);
    else drawAbove(c, w, h, time);
  } else if (v === 'flood') drawFlood(c, w, h, time);
  else drawBoat(c, w, h, dt, time);
  if (v === 'boat') readout();
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'above') return;
  if (S.sec === 'shaduf') { dip(); return; }
  if (S.sec) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, i = S.inset;
  if (i && x >= i.x && x <= i.x + i.w && y >= i.y && y <= i.y + i.h) { S.A.egypt = !S.A.egypt; sfx.click(); }
});

// --- controls ----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function qInfo() {
  const t = T[lang], v = lab.view;
  if (v === 'above') { const A = S.A, one = A.step === 1; return { q: one ? t.a.q1 : t.a.q2, opts: one ? t.a.o1 : t.a.o2, ok: 1, ans: one ? A.a1 : A.a2, res: one ? t.a.r1 : t.a.r2 }; }
  if (v === 'flood') return { q: t.f.q, opts: t.f.o, ok: 0, ans: S.F.a, res: t.f.r };
  return { q: t.b.q, opts: t.b.o, ok: 1, ans: S.B.a, res: t.b.r };
}
function answer(i) {
  const v = lab.view, t0 = now(), A = S.A, F = S.F, B = S.B;
  let ok;
  if (v === 'above') {
    if (A.step === 1) { if (A.a1 !== null) return; A.a1 = i; A.t1 = t0; } else { if (A.a2 !== null) return; A.a2 = i; A.t2 = t0; }

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'ans') answer(+b.dataset.i);
  else if (act === 'next') { S.A.step = 2; sfx.click(); render(); }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click();
    if (S.sec === 'shaduf') Object.assign(S.SH, { t0: -1, n: 0, flow: 0, bb: .3, gr: 0, counted: true });
    if (S.sec === 'nilometer') { S.NL.L = .55; S.NL.d = .55; $('nSlider').value = 55; }
    render();
  } else if (act === 'dip') dip();
  else if (act === 'play') { S.F.mode = 'play'; S.F.t0 = now(); sfx.click(); render(); }

  } else {
    col = C.wood; glow = 'rgba(232, 194, 90, .24)';
    if (S.B.a !== null) { const i = S.B.sailUp ? 0 : 1; val = `<span style="font-size:.66em">${esc(t.b.dir[i])}</span>`; sub = t.b.sail[i]; pill_ = i === 0 ? `💨 ${t.b.wind}` : `〰️ ${t.b.current}`; }
  }
  const key = [val, sub, pill_, col].join('|');
  if (key === S.rk) return;
  S.rk = key; lab.setGlow(glow); lab.setReadout(val, sub, pill_, col);
}

function render() {
  const t = T[lang], v = lab.view;
  if (v !== 'above') S.sec = null;
  const sec = S.sec, A = S.A, F = S.F, B = S.B;
  document.body.dataset.v = sec ? 'sec' : v;
  // the question stays on screen while the child answers and after
  const q = qInfo(), done = q.ans !== null;
  $('qBlock').style.display = sec ? 'none' : '';
  $('qBlock').innerHTML = `<div class="qq">${esc(q.q)}</div>
    <div class="qopts">${q.opts.map((o, i) => `<button class="qb ${done ? (i === q.ok ? 'good' : i === q.ans ? 'bad' : 'dim') : ''}" data-act="ans" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>
    ${done ? `<div class="qres"><b style="color:${q.ans === q.ok ? 'var(--ok)' : 'var(--wip)'}">${esc(q.ans === q.ok ? t.right : t.wrong)}</b>${esc(q.res)}</div>` : ''}`;

  // view 1: next question, tap hint, secret chips and secret controls
  $('vAbove').style.display = v === 'above' ? '' : 'none';
  $('aNext').style.display = sec ? 'none' : '';
  $('aNext').innerHTML = A.step === 1 && A.a1 !== null ? `<button class="btn" data-act="next">${esc(t.next)}</button>`
    : A.a2 !== null ? `<span class="hintline">${esc(t.a.tapHint)}</span>` : '';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('shaduf', '🪣') + sc('nilometer', '📏');
  $('secBody').style.display = sec ? '' : 'none';
  $('dipB').style.display = sec === 'shaduf' ? '' : 'none';
  $('dipB').textContent = t.sec.dip;
  $('nCtl').style.display = sec === 'nilometer' ? '' : 'none';
  $('nSlider').setAttribute('aria-label', t.sec.flood);

  // view 2: month slider and replay once the year has played
  $('fCtl').style.display = v === 'flood' && F.mode !== 'idle' ? '' : 'none';
  $('mSlider').style.display = F.mode === 'free' ? '' : 'none';
  document.querySelector('#fCtl .ends').style.display = F.mode === 'free' ? '' : 'none';
  $('mSlider').value = F.m; $('mSlider').setAttribute('aria-label', t.f.month);
  $('mE0').textContent = t.f.mon[0]; $('mE1').textContent = t.f.mon[11];
  $('playB').style.display = F.mode === 'free' ? '' : 'none';
  $('playB').textContent = t.f.play;

  // view 3: the sail
  $('bCtl').style.display = v === 'boat' && B.auto === 3 ? '' : 'none';
  $('sailB').textContent = t.b.sailBtn[B.sailUp ? 1 : 0];

  // the state card: neutral before the first answer, full after it; the secrets have their own
  if (sec) {
    const k = sec, s = t.secrets[k];
    lab.setState({ emo: k === 'shaduf' ? '🪣' : '📏', title: s[0], lead: s[1], body: k === 'shaduf' ? t.sec.shadufText : t.sec.nilometerText, extra: '' });
  } else {
    const first = v === 'above' ? A.a1 !== null : done, s = t.st[v][first ? 1 : 0];
    lab.setState({ emo: s[0], title: s[1], lead: s[2], body: '', extra: v === 'flood' && first ? `<div class="fine">${esc(t.fine)}</div>` : '' });
  }
  S.rk = null; readout();
}
render();
</script>
</body>
</html>
