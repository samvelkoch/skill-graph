  } else if (a === 'route') { S.route = b.dataset.r; S.u = 0; S.uPlay = false; sfx.click(); S.uShown = -1; }
  else if (a === 'play2') { if (S.u >= 1) S.u = 0; S.uPlay = !S.uPlay; sfx.click(); S.uShown = -1; }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === b.dataset.k ? null : b.dataset.k; S.secT = now(); sfx.click(); showStage(); }
  render();
});
$('smSlider').addEventListener('input', (ev) => { if (S.pick.y === null) return; S.drag = true; S.playing = false; S.y = 1800 + ev.target.value / 100; $('smPlay').textContent = S.y >= 1829.99 ? T[lang].replay : T[lang].play; });
$('smSlider2').addEventListener('input', (ev) => { S.dragU = true; S.uPlay = false; S.u = ev.target.value / 1000; });
const endDrag = () => { S.drag = false; S.dragU = false; S.uShown = -1; S.yKey = -1; };
$('smSlider').addEventListener('change', endDrag); $('smSlider2').addEventListener('change', endDrag); addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);

// --- one render per change: controls, readout and state card ------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v; if (sec) document.body.dataset.s = sec; else delete document.body.dataset.s;
  $('smY').style.display = v === 'years' ? 'block' : 'none'; $('smR').style.display = v === 'rule' ? 'block' : 'none'; $('smA').style.display = v === 'andes' ? 'block' : 'none';
  // view 1
  $('smPredY').innerHTML = predHTML('y');
  const ansY = S.pick.y !== null;
  $('smSlider').disabled = !ansY; $('smPlay').disabled = !ansY;
  $('smPlay').textContent = S.playing ? t.pause : S.y >= 1829.99 ? t.replay : t.play;
  $('smLblU').textContent = t.around1800; $('smLblS').textContent = ansY ? t.newStates : `${t.newStates}: ?`;
  $('smLegU').innerHTML = ['ng', 'pe', 'rp', 'br'].map((k) => `<div><i style="background:${UNITC[k]}"></i>${esc(t.unit[k])}</div>`).join('');
  if (ansY) legendS(NYEARS(S.y)); else $('smLegS').innerHTML = '';
  $('smFine').textContent = t.fine;
  // view 2
  $('smPredJ').innerHTML = predHTML('j');
  const ansJ = S.pick.j !== null;
  $('smGroups').innerHTML = GR.map((g) => `<button class="sm-chip${S.group === g.k ? ' on' : ''}" data-act="grp" data-k="${g.k}" style="--c:${g.coat}"><i></i>${esc(t.groups[g.k])}</button>`).join('');
  $('smInfo').innerHTML = S.group ? `<b>${esc(t.groups[S.group])}.</b> ${esc(t.gdesc[S.group])}` : esc(t.tapGroup);
  $('smPostBox').hidden = !ansJ;
  $('smPostQ').textContent = S.postSel ? t.postPick(t.posts[S.postSel]) : t.postAsk;
  $('smPosts').innerHTML = POSTS.map((p) => {
    const a = S.assign[p], cls = S.checked ? (a === 'pen' ? ' good' : ' bad') : S.postSel === p ? ' on' : a ? ' assigned' : '';
    return `<button class="sm-chip${cls}" data-act="post" data-p="${p}"${S.checked ? ' disabled' : ''}>${POSTEMO[p]} ${esc(t.posts[p])}${a ? ` <b>→ ${esc(t.groups[a])}</b>` : ''}</button>`;
  }).join('');
  $('smCheck').textContent = t.check; $('smCheck').hidden = S.checked; $('smCheck').disabled = POSTS.some((p) => !S.assign[p]);
  $('smPostV').textContent = S.checked ? (S.nRight === 3 ? t.postRight : t.postPart(S.nRight)) : '';
  $('smPostV').className = 'sm-verdict ' + (S.checked && S.nRight === 3 ? 'good' : 'bad');
  // view 3
  $('smPredO').innerHTML = predHTML('o');
  const ansO = S.pick.o !== null;
  $('smRoutes').innerHTML = ['sm', 'bo'].map((k) => `<button class="sm-chip${S.route === k ? ' on' : ''}" data-act="route" data-r="${k}">${k === 'sm' ? '🏔️' : '⛰️'} ${esc(t.routes[k])}</button>`).join('');
  $('smFine3').textContent = `${t.march}. ${t.fine3}`;
  $('smHard').hidden = !ansO; $('smHard').textContent = ansO ? `${t.st3[S.route][2]} ${t.st3[S.route][3]}` : '';
  S.uShown = -1;
  // secrets
  const open = secret.unlocked(), scb = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('smSecs').innerHTML = scb('a', '📜') + scb('b', '🏷️');
  // readout, state card, facts
  if (sec) {
    const s = sec === 'a' ? t.haiti : t.bol;
    lab.setReadout(sec === 'a' ? '1804' : '1825', '', t.secrets[sec][0], sec === 'a' ? '#c8962a' : '#9b59d0');
    lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' });
    lab.setFacts([{ emo: sec === 'a' ? '📜' : '🏷️', text: sec === 'a' ? t.haitiFact : t.bolFact, src: EVH + (sec === 'a' ? 'Haiti' : 'Bolivia') }]);
    lab.setGlow(sec === 'a' ? 'rgba(200, 150, 42, .26)' : 'rgba(155, 89, 208, .26)');
    return;
  }
  if (v === 'years') {
    lab.setGlow('rgba(95, 143, 181, .26)'); S.yKey = -1; S.shownYr = Math.floor(S.y + 1e-6);
    if (!ansY) { lab.setReadout('?', '', t.yearsPill, '#6d8fb0'); lab.setState({ emo: '🤔', title: t.yearsAsk, lead: '', body: '', extra: '' }); lab.setFacts([]); }
    else yearTexts();
  } else if (v === 'rule') {
    lab.setGlow('rgba(201, 154, 58, .26)');
    if (S.checked) { lab.setReadout(`${S.nRight} / 3`, '', t.groups.pen, '#c99a3a'); const s = t.st2.b; lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' }); lab.setFacts(t.facts2); }
    else if (ansJ) { lab.setReadout(`${POSTS.filter((p) => S.assign[p]).length} / 3`, '', t.junta, '#c99a3a'); const s = t.st2.a; lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' }); lab.setFacts(t.facts2.slice(0, 1)); }
    else { lab.setReadout('5', '', '', '#c99a3a'); const s = t.st2.ask; lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' }); lab.setFacts([]); }
  } else {
    lab.setGlow('rgba(143, 224, 255, .22)');
    if (ansO) { const s = t.st3[S.route]; lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' }); lab.setFacts(t.facts3); }
    else { const s = t.st3ask; lab.setState({ emo: s[0], title: s[1], lead: s[2], body: s[3], extra: '' }); lab.setFacts([]); }
    syncAndes();
  }
}
render();
</script>
