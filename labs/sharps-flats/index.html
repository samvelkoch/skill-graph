  else if (act === 'enhplay') ping(60 + PAIRS[S.enh].pc);
  else if (act === 'fprev') return setFif((S.fif + 11) % 12);
  else if (act === 'fnext') return setFif((S.fif + 1) % 12);
  render();
});

// --- render: controls, readout, state card and facts, one place ---------------------------------------------
const secChips = (t) => {
  const open = secret.unlocked(), c = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="sf-sec">${c('enh', '🎹')}${c('fif', '⭕')}</div>`;
};
function render() {
  const t = T[lang], m = mode(), view = lab.view;
  document.body.dataset.v = m;
  lab.setFacts(t.facts[view] ?? []);
  let html = '';
  if (m === 'step') html = renderStep(t);
  else if (m === 'scale') html = renderScale(t);
  else if (m === 'bass') html = renderBass(t);
  else if (m === 'enh') html = renderEnh(t);
  else html = renderFif(t);
  $('sfBody').innerHTML = html + secChips(t) + `<div class="fine" style="margin-top:8px">${esc(t.fineLab)}</div>`;
}

function renderStep(t) {
  const V = S.v1, st = t.st; lab.setGlow('rgba(255, 138, 92, .24)');
  if (V.fin) {
    const k = V.right.filter(Boolean).length;
    lab.setReadout(`${k}/5`, '', '', CORAL);
    lab.setState({ emo: '🏆', title: st.end(k), lead: st.endLead, body: '', extra: '' });
    return `<div class="sf-row"><button class="sf-btn main" data-act="again1">${esc(t.again)}</button></div>`;
  }
  const q = TASK1[V.i], tgt = midiOf(q.l, q.a, q.o) - 60, ok = V.guess === tgt;
  const ex = q.l === 2 && q.a > 0 ? st.e : q.l === 6 && q.a > 0 ? st.b : q.a > 0 ? st.sharp : st.flat;
  const asked = st.q(askName(q.l, q.a));
  lab.setReadout(esc(txt(q.l, q.a)), `${V.i + 1} / 5`, V.reveal ? (q.a > 0 ? st.pillR : st.pillL) : '', CORAL);
  if (!V.reveal) lab.setState({ emo: '🎹', title: asked, lead: st.lead, body: '', extra: '' });
  else lab.setState(ok ? { emo: '✅', title: t.right, lead: ex, body: '', extra: '' }
    : { emo: '🤔', title: st.no, lead: `${st.green(nameHTML(q.l, q.a))} ${ex}`, body: '', extra: '' });
  return `<p class="sf-q">${esc(asked)}</p><div class="sf-row">${V.reveal ? `<button class="sf-btn main" data-act="next1">${esc(t.next)}</button>` : ''}</div>`;
}

function renderScale(t) {
  const sc = S.sc, tt = t.sc, list = scaleOf(sc.k), s0 = STARTS[sc.k]; lab.setGlow('rgba(78, 168, 255, .24)');
  const chips = STARTS.map((s, k) => `<button class="sf-chip ${k === sc.k ? 'on' : ''}" data-act="start" data-k="${k}">${esc(txt(s.l, s.a))}</button>`).join('');
  const head = `<div class="sf-row"><span class="lbl">${esc(tt.start)}</span>${chips}</div>`;
  const name = tt.major(majorName(s0.l, s0.a));
  if (sc.phase === 'pred') {
    lab.setReadout(String(sc.pred), tt.predUnit, '', BLUE);
    lab.setState({ emo: '🪜', title: name, lead: tt.predQ, body: tt.leadPred, extra: '' });
    return `${head}<p class="sf-q">${esc(tt.predQ)}</p><div class="sf-row"><span class="sf-step"><button data-act="pdec" aria-label="−"${sc.pred <= 0 ? ' disabled' : ''}>−</button><b>${sc.pred}</b><button data-act="pinc" aria-label="+"${sc.pred >= 4 ? ' disabled' : ''}>+</button></span>
      <button class="sf-btn main" data-act="go">${esc(tt.go)}</button></div>`;
  }
  if (sc.phase === 'build') {
    lab.setReadout(tt.count(sc.n), tt.notes, '', BLUE);
    const lead = sc.msg ? tt.miss(sc.msg.d, sc.msg.need) : S.ruleKnown ? tt.follow : tt.first;
    lab.setState({ emo: '🎹', title: tt.noteN(sc.n + 1), lead, body: tt.legend, extra: '' });
    return `${head}<p class="sf-q">${esc(lead)}</p><div class="sf-row"><button class="sf-btn" data-act="hint">${esc(tt.hintBtn)}</button></div>`;
  }
  const blk = blackCount(list), ok = blk === sc.pred;
  const accs = list.slice(0, 7).filter((q) => q.a).map((q) => txt(q.l, q.a)).join(' ');
  const next = STARTS[sc.k + 1], tryN = next ? tt.tryNext(tt.major(majorName(next.l, next.a))) : tt.tryAll;
  lab.setReadout(String(blk), tt.blk, ok ? `✓ ${tt.ok}` : tt.mine(sc.pred), BLUE);
  lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? tt.ok : tt.guessed(sc.pred), lead: `${tt.uses(blk, accs)} ${tt.why[sc.k] ?? ''}`.trim(), body: `${tt.pattern} ${blk ? tt.sig : ''} ${tryN}`.trim(), extra: '' });
  return `${head}<div class="sf-row"><button class="sf-btn main" data-act="play">${esc(tt.play)}</button></div>`;
}

function renderBass(t) {
  const V = S.b3, bt = t.ba; lab.setGlow('rgba(61, 220, 151, .2)');
  const n = LET[lang];
  if (V.intro) {
    lab.setReadout(esc(bt.mid), '', '', GREEN);
    lab.setState({ emo: '🎼', title: bt.midTitle, lead: bt.midLead, body: '', extra: '' });
    return `<div class="sf-row"><button class="sf-btn main" data-act="got">${esc(bt.got)}</button></div>`;
  }
  if (V.fin) {
    const k = V.right.filter(Boolean).length;
    lab.setReadout(`${k}/6`, '', '', GREEN); lab.setState({ emo: '🏆', title: bt.end(k), lead: bt.endLead, body: '', extra: '' });
    return `<div class="sf-row"><button class="sf-btn main" data-act="again3">${esc(t.again)}</button></div>`;
  }
  const q = TASK3[V.i], tgt = midiOf(q.l, 0, q.o) - 48, ok = V.guess === tgt;
  lab.setReadout(V.reveal ? esc(txt(q.l, 0)) : '?', `${V.i + 1} / 6`, '', GREEN);
  if (!V.reveal) lab.setState({ emo: '🎼', title: bt.q, lead: bt.lead, body: '', extra: '' });
  else { const ex = bt.expl[V.i](n); lab.setState(ok ? { emo: '✅', title: t.right, lead: ex, body: '', extra: '' } : { emo: '🤔', title: bt.no, lead: `${bt.green(txt(q.l, 0))} ${ex}`, body: '', extra: '' }); }
  return `<p class="sf-q">${esc(bt.q)}</p><div class="sf-row">${V.reveal ? `<button class="sf-btn main" data-act="next3">${esc(t.next)}</button>` : ''}</div>`;
}

function renderEnh(t) {
  const et = t.enh, P = PAIRS[S.enh]; lab.setGlow('rgba(245, 200, 76, .22)');
  const a = txt(...P.a), b = txt(...P.b);
  lab.setReadout(`${esc(a)} = ${esc(b)}`, et.val, '', GOLD);
  lab.setState({ emo: '🎹', title: et.title(a, b), lead: et.lead, body: et.tap, extra: '' });
  return `<div class="sf-row"><button class="sf-btn main" data-act="enhplay">${esc(et.play)}</button><button class="sf-btn" data-act="enhnext">${esc(et.next)}</button></div>`;
}

function renderFif(t) {
  const ft = t.fif, f = FIF[S.fif]; lab.setGlow('rgba(255, 138, 92, .22)');
  const key = f.n.map(([l, a]) => txt(l, a)).join(' / ');
  lab.setReadout(`${f.c}${f.c ? (f.sh ? '♯' : '♭') : ''}`, key, '', f.sh ? CORAL : BLUE);
  lab.setState({ emo: '⭕', title: f.c ? ft.title(key, f.c, f.sh === 1) : ft.zero(key), lead: ft.lead, body: ft.tap, extra: '' });
  return `<div class="sf-row"><button class="sf-btn" data-act="fprev">${esc(ft.prev)}</button><button class="sf-btn main" data-act="fnext">${esc(ft.nxt)}</button></div>`;
}
render();
</script>
</body>
</html>
