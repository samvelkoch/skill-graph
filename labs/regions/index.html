  else if (act === 'again') { S.paint = new Uint8Array(N); S.asking = false; S.dq = null; S.lifted = false; sfx.click(); }
  else if (act === 'cnty') { if (S.mq === null) return; S.counties = !S.counties; sfx.click(); }
  else if (act === 'mq') { S.mq = i; S.counties = true; (i === 1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (act === 'row') {
    S.mrow = S.mrow === f ? null : f; sfx.tick();
    S.manyHl = S.mrow && S.sel >= 0 ? compCells(S.mrow, S.sel) : null;
  }
  render();
});
$('strict').addEventListener('input', (ev) => { S.strict = +ev.target.value; S.hlK = -1; render(); });

// --- one render per change: controls, readout and the state card ----------------------------------------------
function qBlock(q, opts, chosen, ok, act, ex) {
  const t = T[lang], done = chosen !== null;
  return `<div class="rg-q"><div class="q">${esc(q)}</div><div class="rg-opts">${opts.map((o, i) => `<button class="rg-opt ${done ? (i === ok ? 'good' : i === chosen ? 'bad' : '') : ''}" data-act="${act}" data-i="${i}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>${
    done ? `<div class="rg-verdict ${chosen === ok ? 'ok' : 'no'}">${esc(chosen === ok ? t.right : t.notQuite)}</div><p class="rg-ex">${esc(ex)}</p>` : ''}</div>`;
}
const css = (a) => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secFeat').style.display = v === 'features' ? '' : 'none';
  $('secDraw').style.display = v === 'draw' ? '' : 'none';
  $('secMany').style.display = v === 'many' ? '' : 'none';
  $('fine').textContent = t.fine;
  lab.setGlow('rgba(110, 170, 120, .24)');
  if (v === 'features') renderFeat(t); else if (v === 'draw') renderDraw(t); else renderMany(t);
  lab.setFacts(t.facts[v]);
}
function renderFeat(t) {
  const mv = mapView(), st = stats(mv), nutsOn = S.sec === 'nuts' && S.nuts, open = secret.unlocked();
  const ghostShow = S.fq !== null && S.feat !== 'relief' && !S.sec;
  $('fChips').innerHTML = ['relief', 'climate', 'work', 'language'].map((f) => {
    const un = unlocked(f);
    return `<button class="chip ${S.feat === f && !nutsOn ? 'on' : ''}" data-act="feat" data-f="${f}"${un ? '' : ' disabled'}>${un ? '' : '🔒 '}${esc(t.feats[f])}</button>`;
  }).join('') + (ghostShow ? `<button class="chip ${S.ghost ? 'on' : ''}" data-act="ghost">${esc(t.ghost)}</button>` : '');
  $('fLock').textContent = S.fq === null ? t.lockQ : !S.langSeen ? t.lockLang : '';
  $('fQ').innerHTML = qBlock(t.featuresQ, t.featuresOpts, S.fq, 1, 'fq', t.exFeatures);
  // legend: the second picture of the same map
  if (mv.feat === 'nuts') {
    $('fLegend').innerHTML = mv.keys.map((_, k) => `<div class="rg-nuts"><div class="h"><i style="background:${css(mv.colors[k])}"></i><span>${esc(nameOf(mv, k))}</span></div>
      <div class="b"><span>${esc(t.landShare)}</span><em><s style="width:${Math.round(100 * st.counts[k] / LANDN)}%;background:${css(mv.colors[k])}"></s></em><b>${Math.round(100 * st.counts[k] / LANDN)} %</b></div>
      <div class="b"><span>${esc(t.popShare)}</span><em><s style="width:${Math.round(100 * st.people[k] / st.popSum)}%;background:#fff"></s></em><b>${Math.round(100 * st.people[k] / st.popSum)} %</b></div></div>`).join('');
  } else {
    $('fLegend').innerHTML = mv.keys.map((_, k) => (st.counts[k] ? `<button class="rg-lg ${S.hlId === mv.id && S.hlK === k ? 'on' : ''}" data-act="lg" data-i="${k}"><i style="background:${css(mv.colors[k])}"></i><span>${esc(nameOf(mv, k))}</span>
      <em><s style="width:${Math.round(100 * st.counts[k] / LANDN)}%;background:${css(mv.colors[k])}"></s></em><b>${Math.round(100 * st.counts[k] / LANDN)} %</b></button>` : '')).join('');
  }
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('fSecrets').innerHTML = sc('nuts', '🇪🇺') + sc('fuzzy', '🌫️');
  $('fNuts').style.display = S.sec === 'nuts' ? '' : 'none';
  $('fNuts').innerHTML = `<button class="chip ${S.nuts ? 'on' : ''}" data-act="nutsT">${esc(t.equalPop)}</button>`;
  $('fFuzzy').style.display = S.sec === 'fuzzy' ? '' : 'none';
  $('strictLbl').textContent = t.strict; $('strictVal').textContent = `${S.strict} %`; $('strict').value = S.strict;
  // readout
  const fname = nm(t.feats[S.feat]);
  if (nutsOn) lab.setReadout(String(st.regions), t.byPop, t.biggest(st.biggest), '#6ea8f2');
  else if (S.sec === 'fuzzy') lab.setReadout(t.regionsN(st.regions), t.byFeat(fname), t.mixedPct(st.mixedPct), PAL[S.feat][0] ? css(PAL[S.feat][0]) : '#86b46a');
  else lab.setReadout(t.regionsN(st.regions), t.byFeat(fname), t.biggest(st.biggest), css(PAL[S.feat][S.feat === 'relief' ? 2 : 0]));
  // state card
  if (S.sec === 'nuts') lab.setState({ emo: '🇪🇺', title: t.secrets.nuts[0], lead: t.secrets.nuts[1], body: t.secretA });
  else if (S.sec === 'fuzzy') lab.setState({ emo: '🌫️', title: t.secrets.fuzzy[0], lead: t.secrets.fuzzy[1], body: t.secretB });
  else if (S.fq === null) lab.setState({ emo: '🗺️', title: t.state.features0[0], lead: t.state.features0[1], body: '' });
  else lab.setState({ emo: '🎚️', title: t.state.featuresDone[0], lead: t.state.featuresDone[1], body: '' });
}
function renderDraw(t) {
  const painted = paintedAny(), done = S.lifted;
  $('dNote').textContent = done ? '' : t.villages; $('dNote').style.display = done ? 'none' : '';
  $('dBrush').innerHTML = done ? '' : ['a', 'b'].map((k) => `<button class="chip rg-brush ${S.brush === k ? 'on' : ''}" data-act="brush" data-b="${k}"${S.asking ? ' disabled' : ''}>${esc(k === 'a' ? t.brushA : t.brushB)}</button>`).join('');
  $('dBtns').innerHTML = done ? `<button class="btn" data-act="again">${esc(t.again)}</button>` : S.asking ? '' : `<button class="btn" data-act="lift"${painted ? '' : ' disabled'}>${esc(t.lift)}</button>`;
  $('dQ').innerHTML = S.asking || done ? qBlock(t.borderQ, t.borderOpts, S.dq, 1, 'dq', t.exDraw) : '';
  if (done) lab.setReadout(`${S.score} %`, t.cellsRight, t.bCells(realB()), '#ef8a3c');
  else lab.setReadout('?', '', painted ? t.bCells(paintedB()) : '', '#ef8a3c');
  const st = done ? t.state.drawDone : t.state.draw0;
  lab.setState({ emo: done ? '🧭' : '✏️', title: st[0], lead: st[1], body: '' });
}
function renderMany(t) {
  const asked = S.sel >= 0;
  $('mChips').innerHTML = `<button class="chip ${S.counties ? 'on' : ''}" data-act="cnty"${S.mq === null ? ' disabled' : ''}>${S.mq === null ? '🔒 ' : ''}${esc(t.counties)}</button>`;
  $('mQ').innerHTML = asked ? qBlock(t.manyQ, t.manyOpts, S.mq, 1, 'mq', t.exMany) : '';
  const rows = [
    ['relief', t.feats.relief, true], ['climate', t.feats.climate, true], ['work', t.feats.work, S.fq !== null],
    ['language', t.feats.language, S.langSeen], ['county', t.adm, S.mq !== null],
  ];
  let n = 0;
  if (!asked) $('mCard').innerHTML = `<p class="rg-empty">${esc(t.tapCell)}</p>`;
  else {
    const i = S.sel;
    $('mCard').innerHTML = `<div class="rg-card"><div class="h">${esc(t.belongs)}</div>${rows.map(([f, lbl, show]) => {
      if (!show) return `<div class="rg-row off"><i style="background:rgba(130,145,190,.25)"></i><span class="k">${esc(nm(lbl))}</span><b>?</b></div>`;
      n++;
      const L = LAYER[f], k = L.cls[i], col = f === 'language' && k === 2 ? ORANGE : PAL[f][k];
      const text = f === 'county' ? t.county(k + 1) : t.classes[f][L.keys[k]];
      return `<button class="rg-row ${S.mrow === f ? 'on' : ''}" data-act="row" data-f="${f}"><i style="background:${css(col)}"></i><span class="k">${esc(nm(lbl))}</span><b>${esc(text)}</b></button>`;
    }).join('')}</div>`;
  }
  const cname = asked && S.mq !== null ? t.county(LAYER.county.cls[S.sel] + 1) : '';
  lab.setReadout(asked ? t.nRegions(n) : '–', asked ? t.belongs : t.tapCell, cname, '#c8a2dc');
  const st = S.mq !== null ? t.state.manyDone : t.state.many0;
  lab.setState({ emo: S.mq !== null ? '📍' : '🧩', title: st[0], lead: st[1], body: '' });
}

render();
</script>
