function sceneForever(c, w, h, dt, tm) {
  const u = U, t = T[lang];
  if (F.playing) {
    F.p = Math.min(1, F.p + dt / 10); if (F.p >= 1) F.playing = false;
    const sl = $('fSl'); if (sl && document.activeElement !== sl) sl.value = Math.round(F.p * 1000);
  }
  const yrs = fyears(F.p), key = Math.round(F.p * 1000);
  if (key !== F.key) { F.key = key; roForever(t); }
  c.fillStyle = lg(c, 0, 0, 0, h, [[0, '#2b3160'], [1, '#141d36']]); c.fillRect(0, 0, w, h);
  for (let i = 0; i < 30; i++) { c.fillStyle = `rgba(255,255,255,${.25 + .3 * Math.sin(tm * 1.5 + i)})`; circ(c, rnd(i * 1.3) * w, rnd(i * 2.9 + 7) * h, (.6 + rnd(i + 90)) * u); c.fill(); }
  const x0 = .31 * w, x1 = .94 * w;
  FROWS.forEach((r, i) => {
    const y0 = h * (.15 + .2 * i), ty = y0 + 14 * u, dec = c01((yrs - .6 * r.L) / (.4 * r.L)), gone = yrs >= r.L;
    c.fillStyle = 'rgba(255,255,255,.06)'; rr(c, 6 * u, y0 - 28 * u, w - 12 * u, 66 * u, 14 * u); c.fill();
    c.fillStyle = 'rgba(255,255,255,.14)'; c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 1.3; circ(c, .14 * w, y0 + 6 * u, 25 * u); c.fill(); c.stroke();
    emoji(c, r.e, .14 * w, y0 + 8 * u, 32 * u * (1 - .3 * dec), 1 - .92 * dec);
    c.fillStyle = 'rgba(255,255,255,.14)'; rr(c, x0, ty, x1 - x0, 10 * u, 5 * u); c.fill();
    const fw = (x1 - x0) * F.p;
    if (fw > 1) { c.fillStyle = lg(c, x0, 0, x1, 0, [[0, '#ffd166'], [1, '#e4533f']]); rr(c, x0, ty, fw, 10 * u, 5 * u); c.fill(); }
    const tx = x0 + (x1 - x0) * fpos(r.L);
    c.strokeStyle = '#fff'; c.lineWidth = 2 * u; c.beginPath(); c.moveTo(tx, ty - 5 * u); c.lineTo(tx, ty + 15 * u); c.stroke();
    c.fillStyle = gone ? GREEN : '#fff'; circ(c, tx, ty - 6 * u, 3.5 * u); c.fill();
    const nm = t.fe.rows[r.k];
    pill(c, `${gone ? '✓ ' : ''}${nm[0]} · ${nm[1]}`, x0, y0 - 10 * u, { left: true, bg: gone ? 'rgba(25,110,75,.92)' : 'rgba(10,14,28,.82)' });
  });
  const mx = x0 + (x1 - x0) * F.p;
  c.strokeStyle = 'rgba(255,209,102,.9)'; c.lineWidth = 2 * u; c.beginPath(); c.moveTo(mx, h * .06); c.lineTo(mx, h * .9); c.stroke();
  c.fillStyle = '#ffd166'; circ(c, mx, h * .06, 6 * u); c.fill();
  pill(c, fmtTime(t, yrs), w / 2, h - 20 * u, { size: 15 });
}

// --- prediction cards over the stage ----------------------------------------------------------------------
const askEl = Object.assign(document.createElement('div'), { className: 'hi-ask card' });
askEl.style.display = 'none';
$('overlay').append(askEl);
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function askRiver(t) {
  const a = t.ask, ans = R.ans;
  if (ans === null) return `<div class="q">${esc(a.q)}</div><div class="opts">${[7, 30, 365].map((k) => `<button data-a="${k}">${k}</button>`).join('')}</div>`;
  const ok = ans === 365;
  return `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? a.right : a.wrong)}</div><p>${esc(a.text)}</p>
    <div class="opts">${[7, 30, 365].map((k) => `<button class="fixed ${k === 365 ? 'ok' : k === ans ? 'no' : ''}">${k}</button>`).join('')}<button class="go" data-go="1">${esc(a.go)}</button></div>`;
}
function askTown(t) {
  const a = t.tw.ask, ans = TW.ans;
  if (ans === null) return `<div class="q">${esc(a.q)}</div><div class="opts"><button data-a="yes">${esc(a.yes)}</button><button data-a="no">${esc(a.no)}</button></div>`;
  const ok = ans === 'no';
  return `<div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(ok ? a.right : a.wrong)}</div><p>${esc(a.text)}</p>
    <div class="opts"><button class="fixed ${ans === 'yes' ? 'no' : ''}">${esc(a.yes)}</button><button class="fixed ok">${esc(a.no)}</button><button class="go" data-go="1">${esc(a.go)}</button></div>`;
}
askEl.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const v = lab.view;
  if (b.dataset.go !== undefined) { if (v === 'river') R.card = false; else TW.card = false; sfx.click(); render(); return; }
  if (b.dataset.a === undefined) return;
  if (v === 'river' && R.ans === null) {
    const n = +b.dataset.a;
    R.ans = n; R.card = true; R.act.refill = true; (n === 365 ? sfx.good : sfx.bad)(); startYear(); showStage(); render();
  } else if (v === 'town' && TW.ans === null) {
    TW.ans = b.dataset.a; TW.asked = true; TW.askOpen = false; TW.gi = 1; TW.card = true; TW.shake = 1; (TW.ans === 'no' ? sfx.good : sfx.bad)(); showStage(); render();
  }
});

// --- readouts, state cards and controls ---------------------------------------------------------------------
const fine = (s) => `<div class="hi-fine">${esc(s)}</div>`;
let lastCtrl = '';
function chips(t) {
  const open = secret.unlocked();
  const sc = (k, e) => `<button class="chip hi-chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="row2">${sc('turtle', '🐢')}${sc('forever', '⏳')}</div>`;
}
function roRiver(t) {
  if (R.phase === 'ask') { lab.setReadout('?', '', '', '#3fa7d6'); return; }
  lab.setReadout(String(R.sea), t.riv.sub, R.saved > 0 ? t.riv.saved(R.saved) : '', '#3fa7d6');
}
function roForever(t) {
  const yrs = fyears(F.p), gone = FROWS.filter((r) => yrs >= r.L).length;
  lab.setReadout(esc(fmtTime(t, yrs)), t.fe.sub, t.fe.pill(gone), '#b08cf0');
}
function renderRiver(t) {
  const r = t.riv, a = R.act, asking = R.phase === 'ask', busy = R.phase === 'play' || R.phase === 'drain';
  lab.setGlow('rgba(70,150,210,.28)');
  roRiver(t);
  lab.setFacts(t.facts.river);
  if (asking) lab.setState({ emo: '🤔', title: t.ask.q, lead: '', body: '', extra: '' });
  else if (busy) lab.setState({ emo: '🗓️', title: r.run[0], lead: r.run[1], body: r.run[2], extra: '' });
  else if (R.phase === 'done') { const [ti, le] = r.done(R.sea); lab.setState({ emo: '🌊', title: ti, lead: le, body: '', extra: fine(r.fine) }); }
  else lab.setState({ emo: '🏞️', title: r.idle[0], lead: r.idle[1], body: r.idle[2], extra: fine(r.fine) });
  const em = { refill: '🧴', bag: '🛍️', lid: '🗑️', clean: '🧤' }, lock = asking || busy ? ' disabled' : '';
  const btns = ['refill', 'bag', 'lid', 'clean'].map((k) => `<button class="hi-act ${a[k] ? 'on' : ''}" data-act="tog" data-k="${k}"${lock}><span class="e">${em[k]}</span><span>${esc(r.acts[k])}</span></button>`).join('');
  const label = busy ? r.going : R.phase === 'done' ? r.again : r.play;
  return `<div class="hi-acts">${btns}</div><div class="row2"><button class="btn hi-main" data-act="play"${lock}>${esc(label)}</button></div>${chips(t)}`;
}
function renderBins(t) {
  const b = t.bin, n = B.items.length, shown = B.phase === 'reveal' || B.phase === 'done';
  lab.setGlow('rgba(80,170,110,.26)');
  lab.setReadout(shown ? `${B.right}/${n}` : `${B.put.length}/${n}`, shown ? b.right : b.sorted, '', '#4cae6a');
  const st = shown ? (B.right === n ? b.good : b.some(B.right, n)) : B.phase === 'ready' ? b.ready : b.sort;
  lab.setState({ emo: shown ? (B.right === n ? '✅' : '♻️') : '🗑️', title: st[0], lead: st[1], body: st[2], extra: fine(b.fine) });
  lab.setFacts(t.facts.bins);
  return `<div class="row2" style="margin-top:0"><button class="btn hi-main" data-act="check"${B.phase === 'ready' ? '' : ' disabled'}>${esc(b.check)}</button><button class="chip hi-chip" data-act="newr">${esc(b.newr)}</button></div>`;
}
function renderTown(t) {
  const w = t.tw, gi = TW.gi;
  lab.setGlow('rgba(232,163,58,.28)');
  if (TW.askOpen || R.ans === null) lab.setReadout('?', '', '', '#e8a33a');
  else lab.setReadout(fmt(GN[gi] * 365), w.sub, w.grp[gi], '#e8a33a');
  if (TW.askOpen) lab.setState({ emo: '🤔', title: w.ask.q, lead: '', body: '', extra: '' });
  else lab.setState({ emo: GEM[gi], title: w.st[gi][0], lead: w.st[gi][1], body: w.st[gi][2], extra: fine(w.fine) });
  lab.setFacts(t.facts.town);
  const btns = GN.map((n, i) => `<button class="chip hi-chip ${gi === i && !TW.askOpen ? 'on' : ''}" data-act="grp" data-g="${i}"${i >= 2 && !TW.asked ? ' disabled' : ''}>${GEM[i]} ${esc(w.grp[i])}${i ? ` · ${fmt(n)}` : ''}</button>`).join('');
  return `<div class="chips">${btns}</div>`;
}
function renderTurtle(t) {
  const s = t.tt, st = TT.stage === 3 ? s.s3 : TT.stage === 2 ? s.s2 : s.s1;
  lab.setGlow('rgba(47,183,176,.3)');
  lab.setReadout('🐢', s.sub, TT.saved ? s.saved : '', '#2fb7b0');
  lab.setState({ emo: TT.saved ? '❤️' : '🐢', title: st[0], lead: st[1], body: '', extra: '' });
  lab.setFacts([]);
  return `<div class="row2" style="margin-top:0"><button class="btn hi-main" data-act="tremove"${TT.saved ? ' disabled' : ''}>${esc(s.remove)}</button><button class="chip hi-chip" data-act="tagain">${esc(s.again)}</button></div>${chips(t)}`;
}
function renderForever(t) {
  const f = t.fe;
  lab.setGlow('rgba(150,120,230,.3)');
  roForever(t);
  lab.setState({ emo: '⏳', title: f.state[0], lead: f.state[1], body: '', extra: fine(f.state[2]) });
  lab.setFacts(t.facts.forever);
  return `<input type="range" class="big" id="fSl" min="0" max="1000" step="1" value="0" aria-label="${esc(f.sub)}" style="--track:linear-gradient(90deg,#ffd166,#e4533f,#7b5ea7)">
    <div class="ends"><span>${esc(f.ends[0])}</span><span>${esc(f.ends[1])}</span></div>
    <div class="row2" style="margin-top:0"><button class="btn hi-main" data-act="fplay">${esc(f.play)}</button></div>${chips(t)}`;
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = S.sec ? 'sec' : v;
  let ask = '';
  if (!S.sec && v === 'river' && (R.phase === 'ask' || R.card)) ask = askRiver(t);
  else if (!S.sec && v === 'town' && (TW.askOpen || TW.card)) ask = askTown(t);
  askEl.style.display = ask ? '' : 'none';
  if (ask) askEl.innerHTML = ask;
  const html = S.sec === 'turtle' ? renderTurtle(t) : S.sec === 'forever' ? renderForever(t) : v === 'river' ? renderRiver(t) : v === 'bins' ? renderBins(t) : renderTown(t);
  if (html !== lastCtrl) { $('ctrlBody').innerHTML = html; lastCtrl = html; }
  const sl = $('fSl'); if (sl && document.activeElement !== sl) sl.value = Math.round(F.p * 1000);
}

// --- controls -----------------------------------------------------------------------------------------------
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'tog') { if (R.phase === 'done') resetRiver(); R.act[b.dataset.k] = !R.act[b.dataset.k]; sfx.click(); }
  else if (a === 'play') { if (R.phase === 'play' || R.phase === 'drain') return; R.card = false; startYear(); sfx.click(); }
  else if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) { secret.open(); return; }
    S.sec = S.sec === k ? null : k;
    if (S.sec === 'turtle') resetTurtle();
    if (S.sec === 'forever') resetForever();
    sfx.click();
  } else if (a === 'check') checkBins();
  else if (a === 'newr') { newRound(); sfx.click(); }
  else if (a === 'grp') {
    const i = +b.dataset.g;
    if (i === 1 && !TW.asked) TW.askOpen = true; else { TW.askOpen = false; TW.gi = i; TW.shake = 1; }
    sfx.click();
  } else if (a === 'tremove') { TT.saved = true; TT.st = 0; sfx.good(); }
  else if (a === 'tagain') { resetTurtle(); sfx.click(); }
  else if (a === 'fplay') { if (F.p >= 1) F.p = 0; F.playing = true; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'fSl') return;
  F.p = clamp(+ev.target.value / 1000, 0, 1); F.playing = false;
});

// --- dragging a thing to a bin (bins view) ------------------------------------------------------------------
const cv = $('cv');
const ptr = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
cv.addEventListener('pointerdown', (e) => {
  if (S.sec || lab.view !== 'bins' || B.phase !== 'sort' || B.fly) return;
  const p = ptr(e), g = bGeo(VW, VH, U);
  if (B.pos && Math.hypot(p.x - B.pos.x, p.y - B.pos.y) < 46 * U) {
    B.drag = { x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false }; B.back = null; B.hover = -1;
    try { cv.setPointerCapture(e.pointerId); } catch { /* no capture: dragging still works inside the canvas */ }
    e.preventDefault(); return;
  }
  const bi = binAt(g, p.x, p.y);
  if (bi >= 0) { if (B.sel) place(bi); else B.hintT = 2.4; }
});
cv.addEventListener('pointermove', (e) => {
  if (!B.drag) return;
  const p = ptr(e);
  B.drag.x = clamp(p.x, 8, Math.max(9, VW - 8)); B.drag.y = clamp(p.y, 8, Math.max(9, VH - 8));
  if (Math.hypot(p.x - B.drag.sx, p.y - B.drag.sy) > 8) B.drag.moved = true;
  B.hover = binAt(bGeo(VW, VH, U), B.drag.x, B.drag.y);
});
const dropUp = () => {
  if (!B.drag) return;
  const d = B.drag, g = bGeo(VW, VH, U);
  B.drag = null; B.hover = -1;
  if (!d.moved) { B.sel = !B.sel; sfx.tick(); return; }
  const bi = binAt(g, d.x, d.y);
  if (bi >= 0) place(bi, { x: d.x, y: d.y - 16 * U });
  else { B.back = { x: d.x, y: d.y - 16 * U, t: 0 }; sfx.tick(); }
};
cv.addEventListener('pointerup', dropUp);
cv.addEventListener('pointercancel', dropUp);

// --- the picture --------------------------------------------------------------------------------------------
canvasLoop(cv, (c, w, h, dt, tm) => {
  VW = w; VH = h; U = Math.min(w / 375, h / 440);
  if (!G || G.w !== w || G.h !== h) G = layout(w, h, c.getTransform().a);
  if (S.sec === 'turtle') sceneTurtle(c, w, h, dt, tm);
  else if (S.sec === 'forever') sceneForever(c, w, h, dt, tm);
  else if (lab.view === 'river') sceneRiver(c, w, h, dt, tm);
  else if (lab.view === 'bins') sceneBins(c, w, h, dt, tm);
  else sceneTown(c, w, h, dt, tm);
});
newRound();
render();
</script>
