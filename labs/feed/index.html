    rr(c, 4, rt + 2, w - 8, G.rowH - 4, 12); c.fillStyle = r === shelf ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.025)'; c.fill();

    c.save(); c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
    const nm = T[lang].book.shelves[r], tw = c.measureText(nm).width + 14;
    rr(c, G.bx, rt + 5, tw, 18, 9); c.fillStyle = 'rgba(10,12,20,.8)'; c.fill(); c.fillStyle = '#EDEFF7'; c.fillText(nm, G.bx + 7, rt + 14.5); c.restore();
    for (let i = 0; i < NB; i++) {
      const bh = G.rowH * (0.4 + hs(r * 31 + i) * 0.22), sx = G.bx + i * G.sw + 0.75, bw = G.sw - 1.5, taken = B.taken.has(r * 20 + i);
      const off = B.offer && B.offer.shelf === r && B.offer.books.includes(i);
      if (taken) { c.setLineDash([3, 3]); c.lineWidth = 1; c.strokeStyle = 'rgba(130,145,190,.3)'; rr(c, sx, plank - bh, bw, bh, 2); c.stroke(); c.setLineDash([]); continue; }
      const lift = off ? 7 * (1 - Math.pow(1 - B.lift, 3)) : 0, by = plank - bh - lift, col = spineColor(r, i);
      rr(c, sx, by, bw, bh + lift * 0, 2); const g = c.createLinearGradient(sx, 0, sx + bw, 0);
      g.addColorStop(0, mix(col, '#ffffff', 0.25)); g.addColorStop(0.5, col); g.addColorStop(1, mix(col, '#000000', 0.35));
      c.fillStyle = g; c.fill(); c.lineWidth = 1; c.strokeStyle = mix(col, '#000000', 0.62); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(sx + 1.5, by + bh * 0.28, bw - 3, 2);
      if (off) {
        rr(c, sx - 1, by - 1, bw + 2, bh + 2, 3); c.lineWidth = 2; c.strokeStyle = '#fff'; c.stroke();
        const sx2 = sx + bw / 2, sy2 = by - 9; c.beginPath();
        for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? 2.4 : 5.2; c.lineTo(sx2 + Math.cos(a) * rad, sy2 + Math.sin(a) * rad); }
        c.closePath(); c.fillStyle = '#ffd35a'; c.fill();
      }
    }
    rr(c, G.bx - 4, plank, G.bw + 8, 8, 3); const wg = c.createLinearGradient(0, plank, 0, plank + 8); wg.addColorStop(0, '#8a6844'); wg.addColorStop(1, '#4d3623');
    c.fillStyle = wg; c.fill(); c.lineWidth = 1; c.strokeStyle = '#2a1c10'; c.stroke();
    c.save(); c.fillStyle = '#fff'; c.globalAlpha = 1; c.font = `20px ${EMO}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(q.emo, w - 22, rt + G.rowH * 0.42); c.restore();
    if (B.w[r] > 0) {
      c.save(); c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      rr(c, w - 34, rt + G.rowH * 0.42 + 16, 24, 18, 9); c.fillStyle = q.col; c.fill(); c.lineWidth = 1; c.strokeStyle = mix(q.col, '#000000', 0.55); c.stroke();
      c.fillStyle = '#15182a'; c.fillText(String(B.w[r]), w - 22, rt + G.rowH * 0.42 + 25.5); c.restore();
    }
  }
  drawRobot(c, 30, B.ry, Math.min(18, G.rowH * 0.24), time, mv, shelf >= 0 || mv ? 1 : 0);
}
$('cv').addEventListener('pointerdown', (ev) => {
  if (mode() !== 'book') return;
  const B = S.book, r0 = $('cv').getBoundingClientRect(), { w, h } = { w: r0.width, h: r0.height }, G = bookGeo(w, h);
  const x = ev.clientX - r0.left, y = ev.clientY - r0.top, row = Math.floor((y - G.top) / G.rowH), i = Math.floor((x - G.bx) / G.sw);
  if (row < 0 || row > 4 || i < 0 || i >= NB || B.taken.has(row * 20 + i)) return;
  B.taken.add(row * 20 + i); B.w[row]++; B.n++; B.last = row; B.over = -1; reoffer(B); sfx.click(); render();
});

// --- the canvas loop ---------------------------------------------------------------------------------------
function layOne(w, h) {
  const m = 10, narrow = w < 520, maxPw = narrow ? w * 0.44 : Math.min(w * 0.34, 230), blockH = 92;
  const avH = h - blockH - 2 * m, ph = Math.min(avH, maxPw * 1.95), pw = ph / 1.95;
  const bw = narrow ? w - 2 * m - pw - 16 : Math.min(260, w - 2 * m - pw - 16), gx = (w - (pw + 16 + bw)) / 2, y0 = Math.max(m, (h - (ph + blockH)) / 2);
  const bh = Math.min(ph, 330);
  return { px: gx, py: y0, pw, ph, bx: gx + pw + 16, by: y0 + (ph - bh) / 2 + 0, bw, bh, rx: m, ry: y0 + ph + 34, rw: w - 2 * m };
}
function layTwo(w, h) {
  const m = 10, gap = 14, pw = (w - 2 * m - gap) / 2, below = 8 + 9 + 12 + 24 + 22 + 14 + 24, nameH = 22;
  const ph = Math.min(pw * 1.85, h - 2 * m - nameH - below), pw2 = Math.min(pw, ph / 1.85), ph2 = pw2 * 1.85;
  const total = nameH + ph2 + below, y0 = Math.max(m, (h - total) / 2), cw = pw2 * 2 + gap, x0 = (w - cw) / 2;
  return { pw: pw2, ph: ph2, y0, x: [x0, x0 + pw2 + gap], nameH, below };
}
canvasLoop($('cv'), (c, w, h, dt, time) => {
  tickRun(dt);
  const m = mode();
  if (m === 'book') { setHit(null); drawBook(c, w, h, dt, time); return; }
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (m === 'two') {
    setHit(null);
    const L = layTwo(w, h), t = T[lang], done = S.two.done;
    const shared = done ? overlapSet() : null;
    [FD.ann, FD.ben].forEach((F, i) => {
      animFeed(F, dt);
      const x = L.x[i], py = L.y0 + L.nameH;
      c.save(); c.font = '800 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#EDEFF7';
      c.fillText(`${t.two.names[i]}  ${TOP[i + 1].emo}`, x + L.pw / 2, L.y0 + 10); c.restore();
      drawPhone(c, x, py, L.pw, L.ph, F, time);
      drawShare(c, x, py + L.ph + 10, L.pw, F);
      drawRibbon(c, x, py + L.ph + 34, L.pw, 20, F, 20, time, shared);
    });
    const yb = L.y0 + L.nameH + L.ph + 34 + 20 + 24;
    pill(c, done ? t.two.pill(shared.size) : t.two.pill('?'), w / 2, yb, w);
    return;
  }
  const F = m === 'tap' ? FD.tap : FD.pop, L = layOne(w, h), t = T[lang];
  animFeed(F, dt);
  const scr = drawPhone(c, L.px, L.py, L.pw, L.ph, F, time);
  drawBrain(c, L.bx, L.by, L.bw, L.bh, F, 0);
  c.save(); c.font = '800 12px Nunito, sans-serif'; c.fillStyle = '#98A0B8'; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(t.rib30, L.rx, L.ry - 12); c.restore();
  drawRibbon(c, L.rx, L.ry, L.rw, 26, F, 30, time, null);
  setHit({ x: scr.x, y: scr.y + 20, w: scr.w, h: scr.h - 20 });
});

function overlapSet() {
  const a = new Set(FD.ann.hist.slice(-20).map((c) => c.vid)), s = new Set();
  FD.ben.hist.slice(-20).forEach((c) => { if (a.has(c.vid)) s.add(c.vid); });
  return s;
}

// --- input: swipe up scrolls, a tap watches ----------------------------------------------------------------
const curFeed = () => (lab.view === 'pop' ? FD.pop : FD.tap);
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function userScroll() { if (run) return; advance(curFeed()); curFeed().mk = null; sfx.tick(); render(); }
function userTap() { if (run) return; if (tapCard(curFeed())) { sfx.good(); render(); } }
let pd = null;
hit.addEventListener('pointerdown', (ev) => { pd = { x: ev.clientX, y: ev.clientY }; try { hit.setPointerCapture(ev.pointerId); } catch { /* fine */ } });
hit.addEventListener('pointerup', (ev) => {
  if (!pd) return;
  const dy = pd.y - ev.clientY, dx = Math.abs(pd.x - ev.clientX); pd = null;
  if (dy > 28) userScroll(); else if (Math.abs(dy) < 12 && dx < 12) userTap();
});
hit.addEventListener('pointercancel', () => { pd = null; });

// --- actions ---------------------------------------------------------------------------------------------
function tryIt() {
  const s = S.tap; if (run || s.guess === null || s.tried) return;
  const F = mkFeed({ prefill: true }); FD.tap = F; F.dur = 0.18;
  let taps = 0, phase = 0, moved = false, extra = 0;
  startRun(0.28, () => {
    if (phase === 0) {
      if (moved) { moved = false; advance(F); if (taps >= 5) { phase = 1; F.mk = [F.card.n, F.card.n]; extra = 0; F.dur = 0.3; } return true; }
      if (F.card.t === 0 && taps < 5) { tapCard(F); taps++; sfx.good(); moved = true; return true; }
      advance(F); return true;
    }
    extra++; advance(F); F.mk[1] = F.card.n; return extra < 9;
  }, () => {
    const last = F.hist.slice(-10); s.k = last.filter((c) => c.t === 0).length; s.tried = true; F.dur = 0.32;
    (s.guess === 'mostly' ? sfx.good : sfx.bad)(); showStage();
  });
}
function run2() {
  const s = S.two; if (run || s.guess === null || s.done) return;
  FD.ann = mkFeed(); FD.ben = mkFeed(); FD.ann.dur = FD.ben.dur = 0.16;
  let round = 0, sub = 0;
  startRun(0.15, () => {
    if (sub === 0) { if (FD.ann.card.t === 1) tapCard(FD.ann); if (FD.ben.card.t === 2) tapCard(FD.ben); round++; if (round >= 20) return false; sub = 1; return true; }
    advance(FD.ann); advance(FD.ben); sub = 0; return true;
  }, () => { s.done = true; FD.ann.dur = FD.ben.dur = 0.32; const ok = s.guess === 'no'; (ok ? sfx.good : sfx.bad)(); showStage(); });
}
function resetMode() {
  if (run) return;
  const m = mode();
  if (m === 'tap') { FD.tap = mkFeed({ prefill: true }); S.tap = { guess: null, tried: false, k: 0 }; }
  else if (m === 'two') { FD.ann = mkFeed(); FD.ben = mkFeed(); S.two = { guess: null, done: false }; }
  else if (m === 'pop') { FD.pop = mkPop(); S.search = false; if (S.sec === 'b') FD.pop.explore = 1; }
  else if (m === 'book') S.book = mkBook();
  sfx.click();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const act = b.dataset.act, F = FD.pop;
  if (b.dataset.g) { const s = lab.view === 'two' ? S.two : S.tap; s.guess = b.dataset.g; sfx.tick(); }
  else if (b.dataset.tp !== undefined) { F.w[+b.dataset.tp] = 3; S.search = false; advance(F, false); F.mk = null; sfx.good(); }
  else if (act === 'try') tryIt();
  else if (act === 'run2') run2();
  else if (act === 'reset') resetMode();
  else if (act === 'scroll') userScroll();
  else if (act === 'scroll10') {
    let n = 0; F.dur = 0.14;
    startRun(0.2, () => { advance(F); n++; return n < 10; }, () => { F.dur = 0.32; });
  }
  else if (act === 'notint') { F.w[F.card.t] = 0.2; advance(F, false); sfx.click(); }
  else if (act === 'search') { S.search = !S.search; sfx.click(); }
  else if (act === 'clear') { F.w = [1, 1, 1, 1, 1, 1]; sfx.click(); }
  else if (act === 'bsurp') {
    const B = S.book, cur = B.offer ? B.offer.shelf : -1; let s = rnd() * 5 | 0; if (s === cur) s = (s + 1 + (rnd() * 4 | 0)) % 5;
    B.over = s; reoffer(B); sfx.snap();
  }
  else if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    if (k === 'a') { if (S.sec === 'book') S.sec = null; else { S.sec = 'book'; S.book = mkBook(); F.explore = Math.min(F.explore, 0.5); } }
    else if (S.sec === 'b') { S.sec = null; F.explore = Math.min(F.explore, 0.5); }
    else { lab.view = 'pop'; lab.renderChrome(); S.sec = 'b'; FD.pop = mkPop(); FD.pop.explore = 1; S.search = false; }
    sfx.click();
  }
  render();
});
$('sur').addEventListener('input', (ev) => { FD.pop.explore = clamp(+ev.target.value / 100, 0, 1); render(); });

// --- one render per change ---------------------------------------------------------------------------------
function render() {
  const t = T[lang], m = mode();
  document.body.dataset.v = m;
  $('fdTap').style.display = m === 'tap' ? '' : 'none';
  $('fdTwo').style.display = m === 'two' ? '' : 'none';
  $('fdPop').style.display = m === 'pop' ? '' : 'none';
  $('fdBook').style.display = m === 'book' ? '' : 'none';
  const u = secret.unlocked();
  const sc = (k, emo, on) => `<button class="chip secret ${u ? 'open' : ''} ${on ? 'on' : ''}" data-act="sec" data-k="${k}">${u ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secRow').innerHTML = sc('a', '📚', S.sec === 'book') + sc('b', '🎲', S.sec === 'b');
  lab.setFacts(m === 'book' ? [] : t.facts[m]);
  if (m === 'tap') rTap(t); else if (m === 'two') rTwo(t); else if (m === 'pop') rPop(t); else rBook(t);
  if (run) document.querySelectorAll('#ctrlBody button:not([data-act=sec]), #ctrlBody input').forEach((b) => { b.disabled = true; });
}
const chips = (opts, sel, right, dis) => Object.entries(opts).map(([k, l]) => `<button class="chip ${sel === k ? 'on' : ''} ${right === k ? 'fd-right' : ''}" data-g="${k}"${dis ? ' disabled' : ''}>${esc(l)}</button>`).join('');
const verdict = (ok, t) => (ok ? t.right : t.wrong);

function rTap(t) {
  const s = S.tap, F = FD.tap, v = variety(F);
  lab.setGlow('rgba(255, 181, 71, .24)');
  lab.setReadout(t.pop.val(v), t.pop.sub, t.pop.pill, '#ffb547');
  $('tapQ').textContent = t.tap.q;
  $('tapChips').innerHTML = chips(t.tap.opts, s.guess, s.tried ? 'mostly' : null, s.tried);
  $('tryB').textContent = t.tap.go; $('tryB').disabled = s.guess === null || s.tried;
  $('tapScroll').textContent = t.scroll; $('tapReset').textContent = t.reset; $('tapHint').textContent = t.hint;
  let st;
  if (run) st = { emo: '🧠', title: t.run[0], lead: t.run[1] };
  else if (s.tried) st = { emo: s.guess === 'mostly' ? '✅' : '🤔', title: verdict(s.guess === 'mostly', t), lead: t.tap.res(s.k) };
  else st = { emo: '🤔', title: t.tap.q, lead: t.tap.lead0 };
  lab.setState({ ...st, body: s.tried && !run ? t.tap.body : t.rules, extra: esc(t.nums(Math.round(F.explore * 100))) });
}
function rTwo(t) {
  const s = S.two, done = s.done;
  lab.setGlow('rgba(127, 140, 255, .24)');
  const n = done ? overlapSet().size : null;
  lab.setReadout(done ? t.two.val(n) : t.two.val('?'), t.two.sub, '', '#7f8cff');
  $('twoQ').textContent = t.two.q;
  $('twoChips').innerHTML = chips(t.two.opts, s.guess, done ? 'no' : null, done);
  $('runB').textContent = t.two.go; $('runB').disabled = s.guess === null || done;
  $('twoReset').textContent = t.reset;
  let st;
  if (run) st = { emo: '🧠', title: t.run[0], lead: t.run[1] };
  else if (done) {
    const a = FD.ann.hist.slice(-20).filter((c) => c.t === 1).length, b = FD.ben.hist.slice(-20).filter((c) => c.t === 2).length;
    st = { emo: s.guess === 'no' ? '✅' : '🤔', title: verdict(s.guess === 'no', t), lead: t.two.res(n, a, b) };
  } else st = { emo: '🤔', title: t.two.q, lead: t.two.lead0 };
  lab.setState({ ...st, body: done && !run ? t.two.body : t.rules, extra: esc(t.nums(5)) });
}
function rPop(t) {
  const F = FD.pop, v = variety(F), b = S.sec === 'b', pc = Math.round(F.explore * 100);
  lab.setGlow('rgba(180, 140, 255, .26)');
  lab.setReadout(t.pop.val(v), t.pop.sub, t.pop.pill, '#b48cff');
  $('popScroll').textContent = t.scroll; $('popScroll10').textContent = t.scroll10; $('popNot').textContent = t.pop.notint;
  $('popSearch').textContent = t.pop.search; $('popClear').textContent = t.pop.clear; $('popHint').textContent = t.hint;
  $('popSearch').classList.toggle('on', S.search);
  $('srch').style.display = S.search ? '' : 'none';
  $('srchQ').textContent = t.pop.ask;
  $('srchChips').innerHTML = TOP.map((q, i) => `<button class="chip" data-tp="${i}"><span class="fd-tdot" style="background:${q.col}"></span>${q.emo} ${esc(t.topics[i])}</button>`).join('');
  const sur = $('sur'); sur.max = b ? 100 : 50; if (+sur.value !== pc) sur.value = pc;
  $('surLbl').textContent = t.pop.sur; $('surVal').textContent = `${pc} %`;
  let st, body = t.pop.body0;
  if (b) {
    body = t.pop.bBody;
    st = F.explore >= 0.9 ? { emo: '🎲', title: t.pop.b1, lead: t.pop.b1l } : { emo: '🎲', title: t.pop.b0, lead: t.pop.b0l };
  } else if (v >= 5) { st = { emo: '🎉', title: t.pop.t2, lead: t.pop.won(v) }; body = t.pop.wonBody; }
  else if (v >= 3) st = { emo: '🔭', title: t.pop.t1, lead: t.pop.goal };
  else st = { emo: '🫧', title: t.pop.t0, lead: t.pop.goal };
  lab.setState({ ...st, body, extra: esc(t.nums(pc)) });
}
function rBook(t) {
  const B = S.book, k = t.book, sh = B.offer ? B.offer.shelf : -1;
  $('bSurp').textContent = k.surp; $('bReset').textContent = t.reset; $('bookHint').textContent = k.hint;
  lab.setGlow('rgba(255, 122, 138, .24)');
  lab.setReadout(String(B.n), k.sub, sh >= 0 ? k.shelves[sh] : '', '#ff7a8a');
  if (B.over >= 0) lab.setState({ emo: '🎲', title: k.ts, lead: k.ls, body: '', extra: '' });
  else if (sh >= 0) lab.setState({ emo: '🤖', title: k.t1(k.shelves[sh]), lead: k.l1(B.w[sh]), body: '', extra: '' });
  else lab.setState({ emo: '📚', title: k.t0, lead: k.l0, body: '', extra: '' });
}
render();
