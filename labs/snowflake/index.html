  c.restore(); pill(c, w, label, x, by + 30);
}
function drawDen(c, w, h, time) {
  const t = S.dv / 100, gy = h * .8, rx = Math.min(w * .3, 125), ry = rx * .8, cx = w / 2;
  const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#1b2c52'); bg.addColorStop(1, '#0d1428'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const gg = c.createLinearGradient(0, gy, 0, h); gg.addColorStop(0, '#e6eefa'); gg.addColorStop(1, '#a9bbd8'); c.fillStyle = gg; c.fillRect(0, gy, w, h - gy);
  const dg = c.createRadialGradient(cx - rx * .35, gy - ry * .8, 4, cx, gy - ry * .3, rx * 1.2); dg.addColorStop(0, '#ffffff'); dg.addColorStop(1, '#b6cbe8');
  c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 16; c.shadowOffsetY = 6; c.fillStyle = dg; c.beginPath(); c.ellipse(cx, gy, rx, ry, 0, Math.PI, TAU); c.closePath(); c.fill(); c.restore();
  c.strokeStyle = 'rgba(125,165,212,.6)'; c.lineWidth = 1; c.lineCap = 'round'; c.beginPath();
  SNOWPTS.forEach((q, i) => { if (i > 70) return; const x = cx + (q.u - .5) * rx * 1.9, y = gy - q.v * ry * .9; if (((x - cx) / rx) ** 2 + ((gy - y) / ry) ** 2 > .86) return; for (let k = 0; k < 3; k++) { const a = q.a + k * Math.PI / 3; c.moveTo(x - Math.cos(a) * 3, y - Math.sin(a) * 3); c.lineTo(x + Math.cos(a) * 3, y + Math.sin(a) * 3); } });
  c.stroke();
  const cr = .66 - .34 * t, crx = rx * cr, cry = ry * cr, fk = 1 + Math.sin(time * 7) * .03 + Math.sin(time * 11) * .02;
  const wg = c.createRadialGradient(cx, gy - cry * .25, 2, cx, gy - cry * .25, crx * 1.1); wg.addColorStop(0, '#ffd790'); wg.addColorStop(.55, '#c8772f'); wg.addColorStop(1, '#5a2f1c');
  c.fillStyle = wg; c.beginPath(); c.ellipse(cx, gy, crx, cry, 0, Math.PI, TAU); c.closePath(); c.fill();
  c.fillStyle = '#f3e6c8'; c.beginPath(); c.roundRect(cx - 4, gy - 14, 8, 14, 2); c.fill();
  c.fillStyle = '#ffe28a'; c.beginPath(); c.ellipse(cx, gy - 21, 3.2 * fk, 6.5 * fk, 0, 0, TAU); c.fill();
  const outF = .18, inF = .3 + .5 * t, y1 = h * .12, y2 = h * .56, x1 = Math.max(34, w * .11), x2 = Math.min(w - 34, w * .89), tt = T[lang].den;
  therm(c, x1, y1, y2, outF, false, tt.out, w); therm(c, x2, y1, y2, inF, true, tt.inn, w);
}

// --- one loop for every view ------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.auto) { // the Melt button slides the warmth up by itself
    S.m = Math.min(1, S.m + dt / 3.6); if (S.m >= 1) S.auto = false;
    const pc = Math.round(S.m * 100); if (pc !== S.mR || !S.auto) { S.mR = pc; render(); }
  }
  const v = lab.view;
  if (v === 'grow') drawGrow(c, w, h, dt, time);
  else if (v === 'look') drawLook(c, w, h, time);
  else if (S.den) drawDen(c, w, h, time);
  else drawMelt(c, w, h, time);
});

// --- controls ----------------------------------------------------------------------------------------------------
const showStage = () => { // on a phone the controls sit below the picture: bring the result into view
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function startGrow() {
  const Tc = tempOf(S.tv), hum = S.hv / 100;
  S.g = { t0: now(), cls: classify(Tc, hum), hum, v: Math.random(), rot: Math.random() * TAU / 6 };
  S.growing = true; S.dirty = false; sfx.push();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-si], [data-g]'); if (!b) return;
  if (b.dataset.g) { S.guess = b.dataset.g; sfx.click(); render(); return; }
  if (b.dataset.si !== undefined) { if (S.checked) return; S.sort[+b.dataset.si] = +b.dataset.a; sfx.tick(); render(); return; }
  const act = b.dataset.act;
  if (act === 'grow') {
    if (S.growing) return;
    if (S.fall.on) { S.fall.t0 = now(); S.fall.phase = 1; sfx.push(); } else startGrow();
  } else if (act === 'fall') {
    if (!secret.unlocked()) return secret.open();
    S.fall.on = !S.fall.on; S.fall.t0 = null; S.fall.phase = 0; sfx.click();
  } else if (act === 'check') {
    if (S.sort.some((x) => x === null)) return;
    S.checked = true; (S.sort.every((a, i) => a === WATER[i]) ? sfx.good : sfx.bad)(); showStage();
  } else if (act === 'lkagain') { S.sort = [null, null, null, null, null, null]; S.checked = false; sfx.click(); }
  else if (act === 'melt') { if (S.m >= 1) S.m = 0; S.auto = true; sfx.click(); }
  else if (act === 'again') { S.guess = null; S.m = 0; S.mR = 0; S.auto = false; sfx.click(); }
  else if (act === 'den') {
    if (!secret.unlocked()) return secret.open();
    S.den = !S.den; sfx.click();
  }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'rT') { S.tv = v; S.dirty = !!S.g; } else if (id === 'rH') { S.hv = v; S.dirty = !!S.g; }
  else if (id === 'rM') { S.m = v / 100; S.mR = v; S.auto = false; } else if (id === 'rD') S.dv = v; else return;
  render();
});

// --- one render per change: controls, readout and the state card ----------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  $('secGrow').hidden = v !== 'grow'; $('secLook').hidden = v !== 'look'; $('secMelt').hidden = v !== 'melt';
  askEl.hidden = !(v === 'melt' && !S.den && S.guess === null);
  askEl.textContent = t.melt.q;
  if (v === 'grow') renderGrow(t); else if (v === 'look') renderLook(t); else renderMelt(t);
}
const setVal = (el, x) => { if (el.value !== String(x)) el.value = x; };
function renderGrow(t) {
  const G = t.grow, Tc = tempOf(S.tv), hum = S.hv / 100, unl = secret.unlocked(), fall = S.fall;
  $('tLbl').textContent = G.tl; $('tE0').textContent = G.te[0]; $('tE1').textContent = G.te[1]; $('hLbl').textContent = G.hl; $('hE0').textContent = G.he[0]; $('hE1').textContent = G.he[1];
  setVal($('rT'), S.tv); setVal($('rH'), S.hv);
  $('grSl').hidden = fall.on;
  const running = fall.on && fall.t0 !== null && fall.phase < 3;
  $('bGrow').textContent = fall.on ? (fall.t0 === null ? G.drop : G.again2) : (S.g ? G.again : G.go);
  $('bGrow').disabled = S.growing || running;
  $('cFall').textContent = unl ? `☁️ ${t.secrets.fall[0]}` : '🔒 ???';
  $('cFall').className = `chip secret ${unl ? 'open' : ''} ${fall.on ? 'on' : ''}`;
  lab.setGlow('rgba(120, 175, 255, .28)');
  let st;
  if (fall.on) {
    st = G.fl[fall.phase]; lab.setReadout('☁️', '', '', '#7fb2e8'); lab.setFacts(fall.phase === 3 ? t.facts.fall : []);
    lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });
    return;
  }
  const tIcon = Tc < -17 ? '🥶' : Tc < -9 ? '❄️' : Tc < -4 ? '🌬️' : '🌥️', wIcon = hum < .34 ? '🏜️' : hum < .67 ? '💧' : '💦';
  lab.setReadout(`${tIcon} ${wIcon}`, `${minus(Tc)} °C`, S.g && !S.growing ? G.cls[S.g.cls] : '', mix('#6f93ff', '#ffe29a', (Tc - TMIN) / (TMAX - TMIN)));
  st = S.growing ? G.st.growing : !S.g ? G.st.idle : G.st[S.g.cls];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: `<div class="fine" style="font-size:11px;color:var(--faint)">${esc(t.fine)}</div>` });
  lab.setFacts(t.facts.grow);
}
function renderLook(t) {
  const L = t.look, n = S.seen.size, ready = n >= 3, got = S.sort.filter((a, i) => a === WATER[i]).length, all = S.sort.every((x) => x !== null);

  $('lkNote').hidden = ready; $('lkNote').textContent = L.note; $('lkSort').hidden = !ready;
  $('lkQ').textContent = L.q;
  $('sortGrid').innerHTML = L.items.map(([emo, name], i) => {
    const a = S.sort[i], ok = a === WATER[i], dis = S.checked ? ' disabled' : '';
    const btn = (val, label) => `<button type="button" data-si="${i}" data-a="${val}" class="${a === val ? 'on' : ''}${S.checked && WATER[i] === val ? ' truth' : ''}"${dis}>${esc(label)}</button>`;
    return `<div class="sn-it${S.checked ? (ok ? ' right' : ' wrong') : ''}"><div class="sn-nm">${emo} ${esc(name)}${S.checked ? (ok ? ' ✓' : ' ✗') : ''}</div><div class="sn-yn">${btn(1, L.yes)}${btn(0, L.no)}</div></div>`;

  if (S.checked) lab.setState({ emo: got === 6 ? '✅' : '🤔', title: got === 6 ? L.right : L.wrong(got), lead: L.lead, body: L.body, extra: '' });
  else lab.setState({ emo: st[0], title: st[1], lead: st[2], body: st[3], extra: '' });

function renderMelt(t) {

  $('mAsk').hidden = !pre || S.den; $('mGo').hidden = pre || S.den; $('mDen').hidden = !S.den;
  $('mAsk').innerHTML = ['full', 'half', 'little'].map((k) => `<button type="button" class="sn-opt" data-g="${k}">${esc(M.opts[k])}</button>`).join('');
  $('mLbl').textContent = M.lbl; $('mE0').textContent = M.ends[0]; $('mE1').textContent = M.ends[1]; setVal($('rM'), Math.round(S.m * 100));
  $('bMelt').textContent = M.go; $('bMelt').hidden = done; $('bAgain').textContent = M.again; $('bAgain').hidden = !done;
  $('dLbl').textContent = t.den.lbl; $('dE0').textContent = t.den.ends[0]; $('dE1').textContent = t.den.ends[1]; setVal($('rD'), S.dv);
  $('cDen').textContent = unl ? `🏠 ${t.secrets.den[0]}` : '🔒 ???';
  $('cDen').className = `chip secret ${unl ? 'open' : ''} ${S.den ? 'on' : ''}`;

    const a = M.st.ask; lab.setReadout('🪣', '', '', '#6fb3ee'); lab.setState({ emo: a[0], title: a[1], lead: a[2], body: a[3], extra: '' }); lab.setFacts([]); return;
